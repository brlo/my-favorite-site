  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: '<h2>Σώμα και ψυχή</h2><h3>Οι διώκτες δεν μπορούν να σκοτώσουν την ψυχή</h3><p>Ο Κύριος Ιησούς Χριστός λέει να μη φοβόμαστε τους διώκτες, γιατί αυτοί μπορούν να σκοτώσουν μόνο το σώμα, ενώ την ψυχή δεν μπορούν να τη σκοτώσουν. Δεν μπορούν να βλάψουν την ψυχή. Οι άνθρωποι που αρνούνται τη μετά θάνατον ύπαρξη της ψυχής ισχυρίζονται ότι μαζί με το σώμα πεθαίνει και η ψυχή, και αυτό σημαίνει ότι, βέβαια, οι διώκτες σκοτώνουν όχι μόνο το σώμα αλλά και την ψυχή· όμως αυτό αντιφάσκει με τα λόγια του Χριστού:</p><blockquote><p>«καὶ <strong>μὴ φοβεῖσθε ἀπὸ τῶν ἀποκτεννόντων τὸ σῶμα, <mark>τὴν δὲ ψυχὴν μὴ δυναμένων ἀποκτεῖναι</mark></strong>· φοβεῖσθε δὲ μᾶλλον τὸν δυνάμενον καὶ ψυχὴν καὶ σῶμα ἀπολέσαι ἐν γεέννῃ.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/10/#L28">Μτ 10:28</a>)</p></blockquote><blockquote><p>«Λέγω δὲ ὑμῖν τοῖς φίλοις μου, <strong>μὴ φοβηθῆτε ἀπὸ τῶν ἀποκτεινόντων τὸ σῶμα καὶ μετὰ ταῦτα μὴ ἐχόντων περισσότερόν τι ποιῆσαι</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/12/#L4">Λκ 12:4</a>)</p></blockquote><h3>Η εμφάνιση στο Θαβώρ της ψυχής του κεκοιμημένου προφήτη Μωυσή</h3><p>Κατά τη Μεταμόρφωση του Σωτήρα στο όρος Θαβώρ, οι απόστολοι βλέπουν την εμφάνιση του ήδη κεκοιμημένου προφήτη Μωυσή, ο οποίος συνομιλεί με τον Χριστό για τα σταυρικά πάθη που Τον περιμένουν. Δηλαδή ο προφήτης, αν και πέθανε (<a href="https://bibleox.com/el/gr-lxx-byz/vtor/34/#L7">Δτ 34:7</a>· <a href="https://bibleox.com/el/gr-lxx-byz/nav/1/#L2">Ιησ 1:2</a>) (βλ. σχόλιο), δεν εξαφανίστηκε και δεν έχασε τη συνείδησή του: <strong>συνομιλεί</strong> με τον Χριστό:</p><blockquote><p>«καὶ ἰδοὺ <strong><mark>ὤφθη αὐτοῖς Μωϋσῆς</mark> καὶ Ἠλίας <mark>συλλαλοῦντες</mark></strong> μετ᾿ αὐτοῦ.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/17/#L3">Μτ 17:3</a>)</p></blockquote><blockquote><p>«καὶ ἐγένετο ἐν τῷ προσεύχεσθαι αὐτὸν τὸ εἶδος τοῦ προσώπου αὐτοῦ ἕτερον καὶ ὁ ἱματισμὸς αὐτοῦ λευκὸς ἐξαστράπτων. καὶ ἰδοὺ <strong>ἄνδρες δύο συνελάλουν αὐτῷ, οἵτινες ἦσαν Μωϋσῆς καὶ Ἠλίας</strong>, οἳ ὀφθέντες ἐν δόξῃ <strong>ἔλεγον τὴν ἔξοδον αὐτοῦ</strong> ἣν ἤμελλεν πληροῦν ἐν Ἰερουσαλήμ.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/9/#L29-31">Λκ 9:29-31</a>)</p></blockquote><h3>Ο απόστολος για τη ζωή μετά τον θάνατο</h3><p>Ο απόστολος Παύλος λέει ότι όταν η επίγεια σκηνή (το σώμα) καταλυθεί, έχουμε κατοικία στον ουρανό:</p><blockquote><p>«Οἴδαμεν γὰρ ὅτι <strong>ἐὰν ἡ ἐπίγειος ἡμῶν οἰκία τοῦ σκήνους καταλυθῇ</strong>, <strong>οἰκοδομὴν ἐκ θεοῦ ἔχομεν οἰκίαν ἀχειροποίητον αἰώνιον ἐν τοῖς οὐρανοῖς</strong>. &lt;…&gt; καὶ γὰρ οἱ ὄντες ἐν τῷ σκήνει στενάζομεν βαρούμενοι, ἐφ᾿ ᾧ <strong>οὐ θέλομεν ἐκδύσασθαι ἀλλ᾿ ἐπενδύσασθαι</strong>, ἵνα καταποθῇ τὸ θνητὸν ὑπὸ τῆς ζωῆς.» (<a href="https://bibleox.com/el/gr-lxx-byz/2kor/5/#L1,4">Β Κορ 5:1,4</a>)</p></blockquote><hr><p>Σε άλλο σημείο, ίσως ένα από τα σημαντικότερα, ο απόστολος γράφει ότι επιθυμεί να πεθάνει το συντομότερο, για να περάσει φανερά στη ζωή με τον Θεό, αποκαλώντας τον θάνατο «κέρδος». Αν όμως ο απόστολος μετά τον θάνατο εξαφανίζεται ή κοιμάται, τότε δεν κερδίζει τίποτε, αλλά μόνο χάνει (τη συνείδηση). Σε αυτή την περίπτωση δεν έχει κανένα νόημα να βιάζεται κανείς να πεθάνει και να περάσει στην απραξία. Θα ήταν ορθότερο να ζει, να κηρύττει, να οικοδομεί την Εκκλησία, να έχει κοινωνία με τον Θεό, να βοηθά την Εκκλησία (<strong><mark>να μην την εγκαταλείπει όσο το δυνατόν περισσότερο</mark></strong> — αυτή είναι η κύρια σκέψη που πάντοτε αγνοούν οι αντίπαλοι της διδασκαλίας περί αθανάτου ψυχής*), ζώντας στο επίγειο σώμα. Αλλά ο απόστολος, γνωρίζοντας ότι θα περάσει στη ζωή με τον Θεό στον ουρανό, επιθυμεί να απαλλαγεί το συντομότερο από την επίγεια ζωή στο σώμα:</p><blockquote><p>«ἐμοὶ γὰρ τὸ ζῆν Χριστὸς καὶ <strong>τὸ ἀποθανεῖν κέρδος</strong>. εἰ δὲ τὸ ζῆν ἐν σαρκί, τοῦτό μοι καρπὸς ἔργου· καὶ τί αἱρήσομαι οὐ γνωρίζω. συνέχομαι δὲ ἐκ τῶν δύο, <strong>τὴν ἐπιθυμίαν ἔχων εἰς τὸ ἀναλῦσαι καὶ σὺν Χριστῷ εἶναι, πολλῷ [γὰρ] μᾶλλον κρεῖσσον</strong>· τὸ δὲ ἐπιμένειν [ἐν] τῇ σαρκὶ ἀναγκαιότερον δι᾿ ὑμᾶς.» (<a href="https://bibleox.com/el/gr-lxx-byz/fil/1/#L21-24">Φιλ 1:21-24</a>)</p></blockquote><p>*Όσοι αρνούνται τη μετά θάνατον ύπαρξη της ψυχής συνήθως αγνοούν το επιχείρημα στο σχόλιο που προτάθηκε και λένε: «<em>ο απόστολος δεν θα αντιληφθεί πώς θα περάσει ο χρόνος για αυτόν στον ύπνο και αμέσως θα ξυπνήσει στην ανάσταση με τον Χριστό</em>». Ωστόσο, αν ο απόστολος δεν περνά αμέσως στη ζωή με τον Χριστό, αλλά μόνο σε μια ασυνείδητη απραξία, τότε δεν έχει νόημα να βιάζεται να <strong>εγκαταλείψει την Εκκλησία</strong>, όταν ο απόστολος αμέσως μετά γράφει ευθέως ότι το να μένει στο σώμα είναι πιο αναγκαίο για την Εκκλησία.</p><hr><p>Βγαίνοντας από το σώμα, ο απόστολος πιστεύει ότι θα βρεθεί κοντά στον Κύριο, γι'' αυτό πάλι επιθυμεί καλύτερα να βγει από το σώμα. Δείχνει ότι είναι σημαντικό να είναι κανείς ευάρεστος στον Θεό και ζώντας στο σώμα και βγαίνοντας από αυτό:</p><blockquote><p>«Θαρροῦντες οὖν πάντοτε καὶ εἰδότες ὅτι <strong>ἐνδημοῦντες ἐν τῷ σώματι ἐκδημοῦμεν ἀπὸ τοῦ κυρίου</strong>, &lt;…&gt; θαρροῦμεν δὲ καὶ <strong>εὐδοκοῦμεν μᾶλλον ἐκδημῆσαι ἐκ τοῦ σώματος καὶ ἐνδημῆσαι πρὸς τὸν κύριον</strong>. διὸ καὶ φιλοτιμούμεθα, εἴτε ἐνδημοῦντες εἴτε ἐκδημοῦντες, εὐάρεστοι αὐτῷ εἶναι.» (<a href="https://bibleox.com/el/gr-lxx-byz/2kor/5/#L6,8-9">Β Κορ 5:6,8-9</a>)</p></blockquote><p>Ο απόστολος βρίσκεται στο σώμα σαν σε ναό (<a href="https://bibleox.com/el/el/w/Ο_άνθρωπος_είναι_ναός_του_Θεού">ο άνθρωπος — ναός του Θεού</a>), αλλά σύντομα θα πρέπει να αφήσει το σώμα, να βγει από αυτό:</p><blockquote><p>«δίκαιον δὲ ἡγοῦμαι, ἐφ᾿ ὅσον εἰμὶ <strong>ἐν τούτῳ τῷ σκηνώματι, διεγείρειν ὑμᾶς ἐν ὑπομνήσει</strong>, εἰδὼς ὅτι ταχινή ἐστιν <strong>ἡ ἀπόθεσις τοῦ σκηνώματός μου</strong>, καθὼς καὶ ὁ κύριος ἡμῶν Ἰησοῦς Χριστὸς ἐδήλωσέν μοι·» (<a href="https://bibleox.com/el/gr-lxx-byz/2pet/1/#L13-14">Β Πε 1:13-14</a>)</p></blockquote><p>Ο απόστολος γράφει ότι μπορούσε συνειδητά να βρίσκεται στον ουρανό και με το σώμα και χωρίς το σώμα:</p><blockquote><p>«οἶδα ἄνθρωπον ἐν Χριστῷ πρὸ ἐτῶν δεκατεσσάρων — <strong>εἴτε ἐν σώματι οὐκ οἶδα, εἴτε ἐκτὸς τοῦ σώματος οὐκ οἶδα, ὁ θεὸς οἶδεν</strong> — ἁρπαγέντα τὸν τοιοῦτον ἕως τρίτου οὐρανοῦ.» (<a href="https://bibleox.com/el/gr-lxx-byz/2kor/12/#L2">Β Κορ 12:2</a>)</p></blockquote><p>Ο απόστολος δείχνει την αιωνιότητα της ψυχής:</p><blockquote><p>«Διὸ οὐκ ἐγκακοῦμεν, ἀλλ᾿ <strong>εἰ καὶ ὁ ἔξω ἡμῶν ἄνθρωπος διαφθείρεται, ἀλλ᾿ ὁ ἔσω ἡμῶν ἀνακαινοῦται ἡμέρᾳ</strong> καὶ ἡμέρᾳ. &lt;…&gt; μὴ σκοπούντων ἡμῶν τὰ βλεπόμενα ἀλλὰ <strong>τὰ μὴ βλεπόμενα· τὰ γὰρ βλεπόμενα πρόσκαιρα, τὰ δὲ μὴ βλεπόμενα αἰώνια</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/2kor/4/#L16,18">Β Κορ 4:16,18</a>)</p></blockquote><h3>Στην κρίση υποβάλλονται τα έργα που έγιναν στη ζωή <strong>εν σώματι</strong>, και όχι εκτός σώματος</h3><p>Ο Θεός θα κρίνει μόνο τη δραστηριότητα που έγινε κατά τη ζωή στο σώμα:</p><blockquote><p>«τοὺς γὰρ πάντας ἡμᾶς φανερωθῆναι δεῖ ἔμπροσθεν τοῦ βήματος τοῦ Χριστοῦ, ἵνα κομίσηται ἕκαστος <strong>τὰ διὰ τοῦ σώματος πρὸς ἃ ἔπραξεν</strong>, εἴτε ἀγαθὸν εἴτε φαῦλον.» (<a href="https://bibleox.com/el/gr-lxx-byz/2kor/5/#L10">Β Κορ 5:10</a>)</p></blockquote><h3>Αναφορές από την Παλαιά Διαθήκη</h3><p>Σκέπτονται λανθασμένα όσοι θεωρούν τον θάνατο του ανθρώπου — καταστροφή όχι μόνο του σώματος αλλά και της ψυχής:</p><blockquote><p>«<strong>εἶπον γὰρ ἐν ἑαυτοῖς λογισάμενοι οὐκ ὀρθῶς</strong> Ὀλίγος ἐστὶν καὶ λυπηρὸς ὁ βίος ἡμῶν, καὶ οὐκ ἔστιν ἴασις ἐν τελευτῇ ἀνθρώπου, καὶ οὐκ ἐγνώσθη ὁ ἀναλύσας ἐξ ᾅδου. ὅτι αὐτοσχεδίως ἐγενήθημεν καὶ μετὰ τοῦτο ἐσόμεθα ὡς οὐχ ὑπάρξαντες· ὅτι καπνὸς ἡ πνοὴ ἐν ῥισὶν ἡμῶν, καὶ ὁ λόγος σπινθὴρ ἐν κινήσει καρδίας ἡμῶν, <strong>οὗ σβεσθέντος τέφρα ἀποβήσεται τὸ σῶμα καὶ τὸ πνεῦμα διαχυθήσεται ὡς χαῦνος ἀήρ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/prs/2/#L1-3">Σ.Σολ 2:1-3</a>)</p></blockquote><blockquote><p>«<strong>σκολιοὶ γὰρ λογισμοὶ χωρίζουσιν ἀπὸ θεοῦ</strong>, δοκιμαζομένη τε ἡ δύναμις ἐλέγχει τοὺς ἄφρονας.» (<a href="https://bibleox.com/el/gr-lxx-byz/prs/1/#L3">Σ.Σολ 1:3</a>)</p></blockquote><p>Παράλληλα:</p><blockquote><p>«<strong>Δικαίων δὲ ψυχαὶ ἐν χειρὶ θεοῦ</strong>, καὶ οὐ μὴ ἅψηται αὐτῶν βάσανος. <strong>ἔδοξαν ἐν ὀφθαλμοῖς ἀφρόνων τεθνάναι</strong>, καὶ ἐλογίσθη κάκωσις ἡ ἔξοδος αὐτῶν καὶ <strong>ἡ ἀφ᾿ ἡμῶν πορεία σύντριμμα</strong>, οἱ <strong>δέ</strong> <strong>εἰσιν ἐν εἰρήνῃ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/prs/3/#L1-3">Σ.Σολ 3:1-3</a>)</p></blockquote><h2>Ο έλεγχος των Σαδδουκαίων που αρνούνται τη μετά θάνατον ζωή</h2><p>Ανάμεσα σε όλες τις ιουδαϊκές ομάδες (Φαρισαίοι, Σαδδουκαίοι, Εσσαίοι κ.ά.), στην εξαφάνιση του ανθρώπου μετά τον θάνατο πίστευαν μόνο μία — οι Σαδδουκαίοι (<a href="https://bibleox.com/el/gr-lxx-byz/act/23/#L8">Πραξ 23:8</a>). Και ο Κύριος τους ελέγχει αυστηρά, κατηγορώντας τους για πλάνη και άγνοια των Γραφών:</p><blockquote><p>«ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς, <strong>Πλανᾶσθε</strong> <strong>μὴ εἰδότες τὰς γραφὰς μηδὲ τὴν δύναμιν τοῦ θεοῦ</strong>·» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/22/#L29">Μτ 22:29</a>)</p></blockquote><blockquote><p>«<strong>οὐκ ἔστιν θεὸς νεκρῶν ἀλλὰ ζώντων</strong>· <strong>πολὺ πλανᾶσθε</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mk/12/#L27">Μκ 12:27</a>)</p></blockquote><h2>Η ανθρώπινη ψυχή του Ιησού Χριστού</h2><p>Ο Κύριος Ιησούς Χριστός μετά τον θάνατο του σώματος κατέβη με την ψυχή στον άδη:</p><blockquote><p>«ὅτι <strong>οὐκ ἐγκαταλείψεις τὴν ψυχήν μου εἰς ᾅδην</strong> οὐδὲ δώσεις τὸν ὅσιόν σου ἰδεῖν διαφθοράν.» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/15/#L10">Ψλ 15:10</a> · <a href="https://bibleox.com/el/gr-lxx-byz/act/2/#L27">Πραξ 2:27</a>)</p></blockquote><blockquote><p>«προϊδὼν ἐλάλησεν περὶ τῆς ἀναστάσεως τοῦ Χριστοῦ ὅτι <strong>οὔτε ἐγκατελείφθη εἰς ᾅδην</strong> οὔτε ἡ σὰρξ αὐτοῦ εἶδεν διαφθοράν.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/2/#L31">Πραξ 2:31</a>)</p></blockquote><blockquote><p>«ὅτι καὶ Χριστὸς ἅπαξ περὶ ἁμαρτιῶν [ὑπὲρ ὑμῶν] ἀπέθανεν, δίκαιος ὑπὲρ ἀδίκων, ἵνα ὑμᾶς προσαγάγῃ τῷ θεῷ, <strong>θανατωθεὶς μὲν σαρκὶ ζῳοποιηθεὶς δὲ πνεύματι</strong>· ἐν ᾧ καὶ <strong>τοῖς ἐν φυλακῇ πνεύμασιν πορευθεὶς ἐκήρυξεν</strong>, ἀπειθήσασίν ποτε ὅτε ἀπεξεδέχετο ἡ τοῦ θεοῦ μακροθυμία <strong>ἐν ἡμέραις Νῶε κατασκευαζομένης κιβωτοῦ</strong>, εἰς ἣν ὀλίγοι, τοῦτ᾿ ἔστιν ὀκτὼ ψυχαί, διεσώθησαν δι᾿ ὕδατος.» (<a href="https://bibleox.com/el/gr-lxx-byz/1pet/3/#L18-20">Α Πε 3:18-20</a>)</p><p>«οἳ ἀποδώσουσιν λόγον τῷ ἑτοίμως ἔχοντι κρῖναι ζῶντας καὶ νεκρούς. εἰς τοῦτο γὰρ καὶ <strong>νεκροῖς εὐηγγελίσθη</strong> ἵνα κριθῶσι μὲν κατὰ ἀνθρώπους σαρκὶ ζῶσι δὲ κατὰ θεὸν πνεύματι.» (<a href="https://bibleox.com/el/gr-lxx-byz/1pet/4/#L5-6">Α Πε 4:5-6</a>)</p></blockquote><blockquote><p>«διὸ λέγει, Ἀναβὰς εἰς ὕψος ᾐχμαλώτευσεν αἰχμαλωσίαν, ἔδωκεν δόματα τοῖς ἀνθρώποις. [ <strong>τὸ δὲ Ἀνέβη τί ἐστιν εἰ μὴ ὅτι καὶ κατέβη εἰς τὰ κατώτερα [μέρη] τῆς γῆς</strong>;» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/4/#L8-9">Εφ 4:8-9</a>)</p></blockquote><p>Στον άδη ο Χριστός κήρυξε σε εκείνα τα πνεύματα (ψυχές) που βρίσκονταν εκεί από τον κατακλυσμό:</p><p>Στο τέλος, ο Χριστός κυριαρχεί και πάνω στους νεκρούς και πάνω στους ζωντανούς:</p><blockquote><p>«<strong>εἰς τοῦτο γὰρ <u>Χριστὸς</u> ἀπέθανεν καὶ ἔζησεν ἵνα καὶ <u>νεκρῶν</u> καὶ <u>ζώντων</u> κυριεύσῃ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/14/#L9">Ρωμ 14:9</a>)</p></blockquote><h2>Η ζωή των δικαίων στον ουρανό μετά τον θάνατο</h2><p>Οι ψυχές εκείνων που σκοτώθηκαν για τον Χριστό ζουν μαζί Του στον ουρανό και γνωρίζουν τι συμβαίνει στη γη (μέχρι τώρα δεν έχουν εκδικηθεί):</p><blockquote><p>«Καὶ ὅτε ἤνοιξεν τὴν πέμπτην σφραγῖδα, εἶδον ὑποκάτω τοῦ θυσιαστηρίου <strong>τὰς ψυχὰς τῶν ἐσφαγμένων διὰ τὸν λόγον τοῦ θεοῦ καὶ διὰ τὴν μαρτυρίαν ἣν εἶχον</strong>. καὶ ἔκραξαν φωνῇ μεγάλῃ λέγοντες, <strong>Ἕως πότε, ὁ δεσπότης ὁ ἅγιος καὶ ἀληθινός, οὐ κρίνεις καὶ ἐκδικεῖς τὸ αἷμα ἡμῶν ἐκ τῶν κατοικούντων ἐπὶ τῆς γῆς</strong>; καὶ <strong>ἐδόθη αὐτοῖς ἑκάστῳ στολὴ λευκή</strong>, καὶ ἐρρέθη αὐτοῖς ἵνα ἀναπαύσονται ἔτι χρόνον μικρόν, ἕως πληρωθῶσιν καὶ οἱ σύνδουλοι αὐτῶν καὶ <strong>οἱ ἀδελφοὶ αὐτῶν οἱ μέλλοντες ἀποκτέννεσθαι ὡς καὶ αὐτοί</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/6/#L9-11">Απ 6:9-11</a>)</p></blockquote><h2>Οι μάρτυρες για τον Χριστό κατοικούν στον ουρανό</h2><blockquote><p>«καὶ αὐτοὶ ἐνίκησαν αὐτὸν διὰ τὸ αἷμα τοῦ ἀρνίου καὶ <strong>διὰ τὸν λόγον τῆς μαρτυρίας αὐτῶν</strong>, καὶ <strong>οὐκ ἠγάπησαν τὴν ψυχὴν αὐτῶν ἄχρι θανάτου</strong>. διὰ τοῦτο εὐφραίνεσθε, <strong>οὐρανοὶ καὶ οἱ ἐν αὐτοῖς σκηνοῦντες</strong>· οὐαὶ τὴν γῆν καὶ τὴν θάλασσαν, ὅτι κατέβη ὁ διάβολος πρὸς ὑμᾶς ἔχων θυμὸν μέγαν, εἰδὼς ὅτι ὀλίγον καιρὸν ἔχει.» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/12/#L11-12">Απ 12:11-12</a>)</p></blockquote><p>Οι δίκαιοι κατοικούν στον ουρανό και εμείς, που ζούμε στη γη, ήδη τώρα πλησιάζουμε στη θριαμβεύουσα Εκκλησία στον ουρανό, στα πνεύματα των δικαίων:</p><blockquote><p>«ἀλλὰ <strong>προσεληλύθατε</strong> Σιὼν ὄρει καὶ πόλει θεοῦ ζῶντος, <strong>Ἰερουσαλὴμ ἐπουρανίῳ</strong>, καὶ μυριάσιν ἀγγέλων, <strong>πανηγύρει καὶ ἐκκλησίᾳ πρωτοτόκων ἀπογεγραμμένων ἐν οὐρανοῖς</strong>, καὶ κριτῇ θεῷ πάντων, καὶ <strong>πνεύμασι δικαίων τετελειωμένων</strong>,» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/12/#L22-23">Εβρ 12:22-23</a>)</p></blockquote><p>Οι άνθρωποι που διατήρησαν την παρθενία ακολουθούν πάντοτε τον Χριστό, όπου κι αν πηγαίνει:</p><blockquote><p>«οὗτοί εἰσιν <strong>οἳ μετὰ γυναικῶν οὐκ ἐμολύνθησαν</strong>, <strong>παρθένοι</strong> γάρ εἰσιν. οὗτοι <strong>οἱ ἀκολουθοῦντες τῷ ἀρνίῳ ὅπου ἂν ὑπάγῃ</strong>. οὗτοι ἠγοράσθησαν ἀπὸ τῶν ἀνθρώπων ἀπαρχὴ τῷ θεῷ καὶ τῷ ἀρνίῳ, καὶ ἐν τῷ στόματι αὐτῶν οὐχ εὑρέθη ψεῦδος· <strong>ἄμωμοί εἰσιν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/14/#L4-5">Απ 14:4-5</a>)</p></blockquote><p>Οι νεκροί κρίνονται, ο άδης παραδίδει τους νεκρούς που ήταν μέσα του:</p><blockquote><p>«καὶ <strong>εἶδον τοὺς νεκρούς</strong>, τοὺς μεγάλους καὶ τοὺς μικρούς, ἑστῶτας ἐνώπιον τοῦ θρόνου, καὶ βιβλία ἠνοίχθησαν· καὶ ἄλλο βιβλίον ἠνοίχθη, ὅ ἐστιν τῆς ζωῆς· καὶ <strong>ἐκρίθησαν οἱ νεκροὶ ἐκ τῶν γεγραμμένων ἐν τοῖς βιβλίοις κατὰ τὰ ἔργα αὐτῶν</strong>. καὶ ἔδωκεν ἡ θάλασσα τοὺς νεκροὺς τοὺς ἐν αὐτῇ, καὶ <strong>ὁ θάνατος καὶ ὁ ᾅδης ἔδωκαν τοὺς νεκροὺς τοὺς ἐν αὐτοῖς</strong>, καὶ ἐκρίθησαν ἕκαστος κατὰ τὰ ἔργα αὐτῶν.» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/20/#L12-13">Απ 20:12-13</a>)</p></blockquote><h2>Κριτική</h2><h3>Ο Θεός ανέστησε τον προφήτη Μωυσή;</h3><p>Οι Ορθόδοξοι, για να υπερασπιστούν τη συνειδητή ύπαρξη της ψυχής μετά τον θάνατο, προβάλλουν το επιχείρημα ότι ο προφήτης Μωυσής, αν και πέθανε (<a href="https://bibleox.com/el/gr-lxx-byz/vtor/34/#L7">Δτ 34:7</a>· <a href="https://bibleox.com/el/gr-lxx-byz/nav/1/#L2">Ιησ 1:2</a>), εμφανίζεται και <strong>συνομιλεί</strong> με τον Χριστό:</p><blockquote><p>«καὶ ἰδοὺ <strong><mark>ὤφθη αὐτοῖς Μωϋσῆς</mark> καὶ Ἠλίας <mark>συλλαλοῦντες</mark></strong> μετ᾿ αὐτοῦ.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/17/#L3">Μτ 17:3</a>)</p></blockquote><p>Οι αντίπαλοι της Ορθόδοξης Εκκλησίας, και συγκεκριμένα οι Αντβεντιστές, απαντούν ότι αυτό έγινε δήθεν επειδή ο Θεός ανέλαβε και ανέστησε τον προφήτη Μωυσή. Δεν παραπέμπουν στην Αγία Γραφή, αλλά στο απόκρυφο «Ανάληψη του Μωυσή» (μην μπορώντας να παραπέμψουν ευθέως στα λόγια της Έλεν Γουάιτ).</p><p>Εμείς (όπως και εκείνοι) δεν αναγνωρίζουμε τα απόκρυφα ως έγκυρα κείμενα. Το ζήτημα όμως είναι ότι ακόμη και σε αυτό το απόκρυφο, τουλάχιστον στο σωζόμενο τμήμα, δεν υπάρχουν λόγια για την ανάσταση του προφήτη Μωυσή. Αντίθετα, εκεί αποδίδονται στον Μωυσή λόγια ότι αναχωρεί στην «<em>κοίμηση των πατέρων</em>» του (πηγή).</p><p>Επιπλέον, η ανάσταση του προφήτη αντιφάσκει με τη Γραφή, αφού ακριβώς ο Χριστός είναι ο πρωτότοκος των κεκοιμημένων:</p><blockquote><p>«Νυνὶ δὲ Χριστὸς ἐγήγερται ἐκ νεκρῶν, <strong>ἀπαρχὴ τῶν κεκοιμημένων</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/15/#L20">Α Κορ 15:20</a>)</p></blockquote><p>Γνωρίζουμε επίσης ότι κανείς από τους ανθρώπους (ο λόγος απευθύνεται σε ανθρώπους) δεν ανέβη στον ουρανό, κανείς από τους προφήτες δεν ανέβη στον ουρανό:</p><blockquote><p>«καὶ <strong><mark>οὐδεὶς</mark> ἀναβέβηκεν εἰς τὸν οὐρανὸν εἰ μὴ ὁ ἐκ τοῦ οὐρανοῦ καταβάς, ὁ υἱὸς τοῦ ἀνθρώπου</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/3/#L13">Ιω 3:13</a>)</p></blockquote><blockquote><p>«Ἄνδρες ἀδελφοί, ἐξὸν εἰπεῖν μετὰ παρρησίας πρὸς ὑμᾶς περὶ τοῦ πατριάρχου Δαυίδ, ὅτι καὶ ἐτελεύτησεν καὶ ἐτάφη καὶ τὸ μνῆμα αὐτοῦ ἔστιν ἐν ἡμῖν ἄχρι τῆς ἡμέρας ταύτης· &lt;…&gt; <strong>οὐ γὰρ Δαυὶδ ἀνέβη εἰς τοὺς οὐρανούς</strong>, λέγει δὲ αὐτός, Εἶπεν κύριος τῷ κυρίῳ μου, Κάθου ἐκ δεξιῶν μου» (<a href="https://bibleox.com/el/gr-lxx-byz/act/2/#L29,34">Πραξ 2:29,34</a>)</p></blockquote><p>Περισσότερα για το ότι, πριν από τη σταυρική θυσία του Χριστού και την Ανάστασή Του, όλοι οι άνθρωποι μετά την κοίμηση κατέβαιναν στον άδη:</p><p>Περισσότερα: το άρθρο «Μέχρι τη θυσία του Χριστού οι δίκαιοι της Παλαιάς Διαθήκης κατέβαιναν στον άδη».</p><h3>Η διδασκαλία για τη ζωή της ψυχής είναι πίστη στα λόγια του διαβόλου «όχι, δεν θα πεθάνετε»;</h3><p>Οι αντίπαλοι της διδασκαλίας για την ψυχή (Αντβεντιστές) κατηγορούν τους Ορθοδόξους ως εξής: ο Θεός είπε «θα πεθάνετε», και ο διάβολος είπε «δεν θα πεθάνετε», και αυτό δήθεν σημαίνει ότι η πίστη στη ζωή της ψυχής μετά τον θάνατο είναι πίστη στα λόγια του διαβόλου: «δεν θα πεθάνετε». Αντίστοιχα, όσοι πιστεύουν στη ζωή της ψυχής μετά τον θάνατο του σώματος κατηγορούνται από αυτούς ότι πιστεύουν στο ψέμα του διαβόλου.</p><p>Η κατηγορία είναι ηχηρή, αλλά η ίδια η ιδέα έχει σοβαρές αντιφάσεις και προβλήματα με το πλαίσιο. Ο Θεός δεν είπε μόνο «θα πεθάνετε», αλλά θα πεθάνετε την ημέρα που θα φάτε από το απαγορευμένο δέντρο:</p><blockquote><p>«καὶ ἐνετείλατο κύριος ὁ θεὸς τῷ Αδαμ λέγων Ἀπὸ παντὸς ξύλου τοῦ ἐν τῷ παραδείσῳ βρώσει φάγῃ, <strong>ἀπὸ δὲ τοῦ ξύλου τοῦ γινώσκειν καλὸν καὶ πονηρόν, οὐ φάγεσθε ἀπ᾿ αὐτοῦ· <mark>ᾗ δ᾿ ἂν ἡμέρᾳ φάγητε ἀπ᾿ αὐτοῦ, θανάτῳ ἀποθανεῖσθε</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/gen/2/#L16-17">Γεν 2:16-17</a>)</p></blockquote><p>Οι αντίπαλοι της διδασκαλίας για τη ζωή της ψυχής κατανοούν τα λόγια «θα πεθάνετε» με τον πιο απλό και άμεσο τρόπο, ως θάνατο του σώματος και τέλος όλων των διαδικασιών της ζωής του ανθρώπου, παύση της ύπαρξής του (τουλάχιστον της συνειδητής).</p><p>Συνέβη στους ανθρώπους αυτή η κατανόηση του θανάτου την ημέρα που έφαγαν τους καρπούς; — Όχι, ο Αδάμ πέθανε πολύ αργότερα, σε ηλικία 930 ετών (Γεν 5:5). Τι σημαίνει αυτό; — Σημαίνει ότι ο Θεός μιλούσε για άλλον θάνατο. Τον άλλο θάνατο τον αρνούνταν και ο διάβολος.</p><p>Και αν δεν είναι έτσι, τότε θα πρέπει να παραδεχτούμε ότι ο Θεός είπε ψέματα, όταν είπε ότι οι άνθρωποι θα πεθάνουν την ημέρα που θα φάνε, και ο διάβολος δήθεν αντίθετα είπε την αλήθεια ότι δεν θα πεθάνουν — πράγματι, η χονδροειδής σωματική κατανόηση του θανάτου δεν συνέβη την ίδια ημέρα. Αλλά δεν μπορούμε με κανέναν τρόπο να παραδεχτούμε ότι ο Θεός (η Οδός, η Αλήθεια και η Ζωή — <a href="https://bibleox.com/el/gr-lxx-byz/in/14/#L6">Ιω 14:6</a>) είπε ψέματα, και ο διάβολος (ψεύτης και πατέρας του ψεύδους — <a href="https://bibleox.com/el/gr-lxx-byz/in/8/#L44">Ιω 8:44</a>) είπε την αλήθεια. Ωστόσο, ακριβώς σε αυτό το συμπέρασμα οδηγεί η ερμηνεία των αντιπάλων της διδασκαλίας για την ψυχή.</p><p>Για να βγουν από αυτό το αδιέξοδο, θα πρέπει οπωσδήποτε να ερμηνεύσουν αλληγορικά μέρος της φράσης:</p><ul><li><p>τον ίδιο τον θάνατο να τον κατανοούν κυριολεκτικά,</p></li><li><p>και την ημέρα του θανάτου να μην την κατανοούν κυριολεκτικά.</p></li></ul><p>Η Ορθόδοξη Εκκλησία δεν έχει τέτοια ελαττώματα στην ερμηνεία της:</p><ul><li><p>η ημέρα του θανάτου κατανοείται κυριολεκτικά,</p></li><li><p>και ο ίδιος ο θάνατος κατανοείται κυριολεκτικά, μόνο σε σχέση με την πνευματική κατάσταση του ανθρώπου. Εξάλλου, και στη σωματική κατάσταση συνέβησαν αλλαγές· οι άνθρωποι τουλάχιστον είδαν τη γύμνωσή τους.</p></li></ul><p>Οι προπάτορες πράγματι πέθαναν την ίδια ημέρα, αλλά αυτός ο θάνατος δεν είναι εξαφάνιση, αλλά κατάσταση αποστασίας από τον Θεό, στην οποία βρίσκονται όλοι οι αμαρτωλοί άνθρωποι. Ο ίδιος ο Χριστός Θεός ονομάζει θάνατο την κατάσταση ζωής χωρίς τον Θεό:</p><blockquote><p>«ἕτερος δὲ τῶν μαθητῶν [αὐτοῦ] εἶπεν αὐτῷ, Κύριε, ἐπίτρεψόν μοι πρῶτον ἀπελθεῖν καὶ θάψαι τὸν πατέρα μου. ὁ δὲ Ἰησοῦς λέγει αὐτῷ, Ἀκολούθει μοι, καὶ <strong><mark>ἄφες τοὺς νεκροὺς θάψαι</mark> τοὺς ἑαυτῶν νεκρούς</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/8/#L21-22">Μτ 8:21-22</a>)</p></blockquote><blockquote><p>«Ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι ὁ τὸν λόγον μου ἀκούων καὶ πιστεύων τῷ πέμψαντί με ἔχει ζωὴν αἰώνιον, καὶ εἰς κρίσιν οὐκ ἔρχεται ἀλλὰ <strong><mark>μεταβέβηκεν ἐκ τοῦ θανάτου</mark> εἰς τὴν ζωήν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/5/#L24">Ιω 5:24</a>)</p></blockquote><blockquote><p>«Καὶ τῷ ἀγγέλῳ τῆς ἐν Σάρδεσιν ἐκκλησίας γράψον· Τάδε λέγει ὁ ἔχων τὰ ἑπτὰ πνεύματα τοῦ θεοῦ καὶ τοὺς ἑπτὰ ἀστέρας· Οἶδά σου τὰ ἔργα, ὅτι <strong><mark>ὄνομα ἔχει</mark></strong>ς ὅτι ζῇς, καὶ νεκρὸς εἶ.» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/3/#L1">Απ 3:1</a>)</p></blockquote><p>Το ίδιο λένε και οι απόστολοι. Ζούσαν νεκροί:</p><blockquote><p>«Καὶ ὑμᾶς ὄντας <strong><mark>νεκροὺς τοῖς παραπτώμασιν καὶ ταῖς ἁμαρτίαις</mark></strong> ὑμῶν, <strong><mark>ἐν αἷς</mark></strong> ποτε <strong><mark>περιεπατήσατε</mark></strong> κατὰ τὸν αἰῶνα τοῦ κόσμου τούτου, κατὰ τὸν ἄρχοντα τῆς ἐξουσίας τοῦ ἀέρος, τοῦ πνεύματος τοῦ νῦν ἐνεργοῦντος ἐν τοῖς υἱοῖς τῆς ἀπειθείας·» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/2/#L1-2">Εφ 2:1-2</a>)</p></blockquote><blockquote><p>«ἡ δὲ ὄντως χήρα καὶ μεμονωμένη ἤλπικεν ἐπὶ θεὸν καὶ προσμένει ταῖς δεήσεσιν καὶ ταῖς προσευχαῖς νυκτὸς καὶ ἡμέρας· ἡ δὲ σπαταλῶσα <strong><mark>ζῶσα τέθνηκεν</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1tim/5/#L5-6">Α Τιμ 5:5-6</a>)</p></blockquote><p>Δηλαδή η κατάσταση της νέκρωσης επήλθε στον Αδάμ και την Εύα αμέσως μετά την πτώση — είναι κατάσταση εσωτερικής ζωής χωρίς τον Θεό. Και με αυτή την έννοια, ο διάβολος είπε ψέματα όταν έλεγε ότι δεν θα πεθάνουν. Πέθαναν όπως είπε ο Θεός — την ίδια ημέρα.</p><p>Έτσι, οι κατηγορίες δεν είναι σοβαρές· περιέχουν αυτοαντίφαση και αποσπασματικότητα από το πλαίσιο της Αγίας Γραφής.</p>'
