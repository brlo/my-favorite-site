  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: '<h2>Είδη της ειδωλολατρικής πίστης</h2><p>Η ειδωλολατρική πίστη στα είδωλα έχει τρία είδη, ξεκινώντας από το πιο διαδεδομένο στην αρχαιότητα:</p><ol><li><p><strong>Το είδωλο είναι ο ίδιος ο θεός</strong>. Το ίδιο το αντικείμενο που κατασκευάζει ο ειδωλολάτρης είναι θεότητα.</p></li><li><p><strong>Το είδωλο είναι εικόνα</strong> μιας θεότητας που βρίσκεται μακριά και που υποτίθεται ότι έτσι πρέπει να μοιάζει.</p></li><li><p><strong>Το είδωλο είναι</strong> <strong>επινοημένη εικόνα</strong> ενός φυσικού στοιχείου που θεοποιείται: της θάλασσας, του ανέμου, της βροχής, της φωτιάς, της γης.</p></li></ol><p>Και στις τρεις περιπτώσεις τιμάται ένας <u>ψεύτικος θεός</u>, ο οποίος <u>δεν υπάρχει</u>. Είναι πίστη στο ψέμα.</p><p>Ακριβώς την πρώτη εκδοχή τη συναντάμε στη Βίβλο: η πιο διαδεδομένη ειδωλολατρική πίστη είναι η <u>θεοποίηση του ίδιου του αντικειμένου</u><strong> </strong>(της ύλης).</p><h2>Οι ειδωλολάτρες θεωρούν θεό το ίδιο το κατασκεύασμα</h2><blockquote><p>«καὶ ἀνήγγειλά σοι πάλαι, πρὶν ἐλθεῖν ἐπὶ σὲ ἀκουστόν σοι ἐποίησα· μὴ εἴπῃς ὅτι <strong>Τὰ εἴδωλά μου ἐποίησαν, καὶ μὴ εἴπῃς ὅτι Τὰ γλυπτὰ καὶ τὰ χωνευτὰ ἐνετείλατό μοι</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/is/48/#L5">Ησ 48:5</a>)</p></blockquote><blockquote><p>«Η γλώσσα τους είναι σκαλισμένη από τεχνίτη, και οι ίδιοι είναι ντυμένοι με χρυσό και ασήμι· αλλά <strong>είναι ψεύτικοι και δεν μπορούν να μιλήσουν</strong>. Και σαν για κοπέλα που αγαπά τα στολίδια, παίρνουν το χρυσάφι και φτιάχνουν στεφάνια για τα κεφάλια των θεών τους. Συμβαίνει επίσης οι <strong>ιερείς να κλέβουν από τους θεούς τους το χρυσάφι και το ασήμι</strong> και να τα χρησιμοποιούν για τον εαυτό τους· δίνουν από αυτά και στις πόρνες μέσα στο σπίτι τους· <strong>στολίζουν τους θεούς</strong> — χρυσούς, ασημένιους και ξύλινους — με ρούχα, σαν ανθρώπους. Αλλά <strong>δεν σώζονται από τη σκουριά και τον σκόρο</strong>, αν και είναι ντυμένοι με πορφυρό ρούχο. <strong>Σκουπίζουν το πρόσωπό τους</strong> από τη σκόνη μέσα στο ιερό τους, που έχει μαζευτεί πάνω τους σε αφθονία. Έχει και σκήπτρο, όπως ένας άνθρωπος — κριτής της χώρας, αλλά <strong>δεν μπορεί να θανατώσει τον ένοχο μπροστά του</strong>. Έχει σπαθί στο δεξί χέρι και τσεκούρι, αλλά <strong>τον εαυτό του από στρατό και ληστές δεν θα τον προστατέψει</strong>: από αυτό γίνεται γνωστό ότι <strong>δεν είναι θεοί</strong>(!)· επομένως, μη τους φοβάστε. Γιατί, όπως ένα σπασμένο σκεύος γίνεται άχρηστο για τον άνθρωπο, έτσι είναι και οι θεοί τους. Αφού τοποθετηθούν στα ιερά τους, τα μάτια τους γεμίζουν σκόνη από τα πόδια εκείνων που μπαίνουν. Και όπως σε εκείνον που προσέβαλε τον βασιλιά φράζονται οι είσοδοι του σπιτιού, όταν οδηγείται στον θάνατο, έτσι και τα ιερά τους <strong>τα φυλάνε οι ιερείς τους με πόρτες, κλειδαριές και μάνταλα, για να μη ληστευτούν</strong> από ληστές· ανάβουν γι’ αυτούς λυχνάρια, και μάλιστα περισσότερα από ό,τι για τους εαυτούς τους, αλλά εκείνοι δεν μπορούν να δουν ούτε ένα από αυτά. Είναι σαν δοκάρι μέσα στο σπίτι· <strong>λένε πως τα σκουλήκια της γης τρώγουν τις καρδιές τους και τρώγουν τους ίδιους και τα ρούχα τους, κι εκείνοι δεν το αισθάνονται</strong>. Τα πρόσωπά τους είναι μαύρα από τον καπνό μέσα στα ιερά. <strong>Στο σώμα τους και στα κεφάλια τους πετούν νυχτερίδες, χελιδόνια και άλλα πουλιά</strong>, <strong>ανεβαίνουν πάνω τους και οι γάτες. Από αυτό θα καταλάβετε ότι δεν είναι θεοί</strong>· επομένως, μη τους φοβάστε. Αν κάποιος δεν καθαρίσει τη σκουριά από το χρυσάφι με το οποίο είναι επενδυμένοι για ομορφιά, δεν θα λάμψουν· και <strong>όταν τους έλιωναν, δεν το αισθάνονταν</strong>. Αγοράστηκαν με μεγάλο τίμημα, αλλά πνεύμα δεν υπάρχει μέσα τους. Χωρίς πόδια, <strong>μεταφέρονται στους ώμους</strong>, δείχνοντας έτσι στους ανθρώπους τη μηδαμινότητά τους· ντροπιάζονται και εκείνοι που τους υπηρετούν· γιατί, <strong>αν πέσουν στη γη, δεν μπορούν να σηκωθούν μόνοι τους</strong>· επίσης, αν κάποιος τους στήσει όρθιους, <strong>δεν μπορούν να κινηθούν μόνοι τους</strong>, και αν κάποιος τους γείρει, <strong>δεν μπορούν να ισιώσουν</strong>· αλλά σαν μπροστά σε νεκρούς βάζουν μπροστά τους δώρα. Τις θυσίες τους τις πουλούν οι ιερείς και τις καταχρώνται· το ίδιο κάνουν και οι γυναίκες τους: αλατίζουν μέρος από αυτές και δεν δίνουν τίποτα ούτε στον φτωχό ούτε στον άρρωστο. Στις θυσίες τους αγγίζουν γυναίκες ακάθαρτες και λεχώνες. Έτσι, αφού καταλάβετε από αυτά ότι δεν είναι θεοί, μη τους φοβάστε. Πώς λοιπόν να τους ονομάσουμε θεούς; γυναίκες προσφέρουν θυσίες σε αυτούς τους ασημένιους, χρυσούς και ξύλινους θεούς. Και στα ιερά τους κάθονται οι ιερείς με σχισμένα ρούχα, με ξυρισμένα κεφάλια και γένια και με ακάλυπτα κεφάλια: Σε πέτρες από τα βουνά μοιάζουν αυτοί οι θεοί, οι ξύλινοι και επενδυμένοι με χρυσό και ασήμι, και όσοι τους υπηρετούν θα ντροπιαστούν. Πώς μπορεί κανείς να σκεφτεί ή να πει ότι είναι θεοί; Όλα όσα γίνονται γύρω τους είναι ψέματα. Γι’ αυτό, πώς μπορεί κανείς να σκέφτεται ή να λέει ότι είναι θεοί; <strong>Τους κατασκευάζουν τεχνίτες και χρυσοχόοι· δεν γίνονται τίποτα άλλο από αυτό που ήθελαν να τους κάνουν οι τεχνίτες</strong>. Και εκείνοι που τους φτιάχνουν δεν είναι μακρόβιοι· πώς μπορούν λοιπόν αυτά που έφτιαξαν να είναι θεοί; Άφησαν πίσω τους ψέμα και ντροπή στους απογόνους τους. Πώς να μην καταλάβει κανείς ότι δεν είναι θεοί εκείνοι που <strong>δεν σώζουν ούτε τους εαυτούς τους</strong> από πολέμους ούτε από συμφορές; Εφόσον είναι ξύλινοι και επενδυμένοι με χρυσό και ασήμι, μπορεί κανείς να καταλάβει ότι είναι ψέμα· σε όλα τα έθνη και τους βασιλείς θα γίνει φανερό ότι <strong>αυτοί δεν είναι θεοί, αλλά έργα χεριών ανθρώπων, και δεν υπάρχει μέσα τους καμία θεία ενέργεια</strong>. Σε ποιον λοιπόν μετά από αυτό δεν είναι κατανοητό ότι δεν είναι θεοί; Βασιλιά στη χώρα δεν θα διορίσουν, βροχή στους ανθρώπους δεν θα δώσουν· δίκη δεν θα κρίνουν, τον αδικημένο δεν θα προστατέψουν, όντας ανίσχυροι σαν κοράκια που βρίσκονται ανάμεσα στον ουρανό και τη γη. Γιατί και στην περίπτωση που <strong>πιάσει φωτιά το ιερό των θεών</strong> — των ξύλινων ή των επενδυμένων με χρυσό και ασήμι — οι ιερείς τους θα φύγουν και θα σωθούν, ενώ εκείνοι <strong>σαν δοκάρια στη μέση θα καούν</strong>. Ούτε στον βασιλιά ούτε στους εχθρούς δεν μπορούν να αντισταθούν. Πώς λοιπόν μπορεί κανείς να δεχτεί ή να σκεφτεί ότι είναι θεοί; <strong>Ούτε από κλέφτες ούτε από ληστές δεν μπορούν να προστατέψουν τους εαυτούς τους αυτοί οι θεοί</strong>, οι ξύλινοι και επενδυμένοι με ασήμι και χρυσό· υπερτερώντας τους σε δύναμη, παίρνουν το χρυσάφι και το ασήμι και τα ρούχα που φορούν και φεύγουν με τη λεία, ενώ εκείνοι δεν έχουν τη δύναμη να βοηθήσουν τον εαυτό τους. Γι’ αυτό καλύτερα ένας βασιλιάς που δείχνει ανδρεία ή ένα χρήσιμο στο σπίτι σκεύος που χρησιμοποιεί ο νοικοκύρης, παρά ψεύτικοι θεοί· ή καλύτερα μια πόρτα στο σπίτι, που φυλάει μέσα τα αγαθά, παρά ψεύτικοι θεοί· ή καλύτερα ένα ξύλινο υποστήριγμα στο παλάτι του βασιλιά, παρά ψεύτικοι θεοί. Έτσι, γνωρίζοντας ότι δεν είναι θεοί, μη τους φοβάστε. Τα ζώα είναι καλύτερα από αυτούς· εκείνα, καταφεύγοντας σε καταφύγιο, μπορούν να βοηθήσουν τον εαυτό τους. Έτσι, <strong>από τίποτα δεν φαίνεται σε μας ότι είναι θεοί</strong>· γι’ αυτό μη τους φοβάστε. <strong>Όπως το σκιάχτρο στον κήπο</strong> δεν προστατεύει τίποτα, έτσι και οι ξύλινοι θεοί τους, οι επενδυμένοι με χρυσό και ασήμι. Παρομοίως, οι ξύλινοι θεοί τους, οι επενδυμένοι με χρυσό και ασήμι, μοιάζουν με θάμνο αγκαθιών στον κήπο, πάνω στον οποίο κάθονται κάθε λογής πουλιά, και με πτώμα ριγμένο στο σκοτάδι. Από την πορφύρα και το κόκκινο ύφασμα, που σαπίζουν πάνω τους, μπορείτε να καταλάβετε ότι δεν είναι θεοί· και τα ίδια τελικά θα φαγωθούν και θα γίνουν ντροπή στη χώρα. Έτσι, καλύτερος είναι ο δίκαιος άνθρωπος που δεν έχει είδωλα, γιατί είναι μακριά από την ντροπή.» — Σημείωση: η Επιστολή Ιερεμίου (το 6ο κεφάλαιο του Βαρούχ) δεν υπάρχει στο ελληνικό κείμενο της Βίβλου του ιστότοπου· η μετάφραση δίνεται από το ρωσικό κείμενο.</p></blockquote><h2>Οι Ισραηλίτες ειδωλολάτρες θεωρούσαν θεό το ίδιο το κατασκεύασμα, καθώς και τα φυσικά στοιχεία</h2><blockquote><p>«οἱ πλάσσοντες καὶ γλύφοντες πάντες μάταιοι οἱ ποιοῦντες τὰ καταθύμια αὐτῶν, ἃ οὐκ ὠφελήσει αὐτούς· ἀλλὰ αἰσχυνθήσονται πάντες οἱ πλάσσοντες θεὸν καὶ γλύφοντες ἀνωφελῆ, καὶ πάντες ὅθεν ἐγένοντο ἐξηράνθησαν, καὶ κωφοὶ ἀπὸ ἀνθρώπων συναχθήτωσαν πάντες καὶ στήτωσαν ἅμα, ἐντραπήτωσαν καὶ αἰσχυνθήτωσαν ἅμα. ὅτι ὤξυνεν τέκτων σίδηρον, σκεπάρνῳ εἰργάσατο αὐτὸ καὶ ἐν τερέτρῳ ἔτρησεν αὐτό, εἰργάσατο αὐτὸ ἐν τῷ βραχίονι τῆς ἰσχύος αὐτοῦ· καὶ πεινάσει καὶ ἀσθενήσει καὶ οὐ μὴ πίῃ ὕδωρ. ἐκλεξάμενος τέκτων ξύλον ἔστησεν αὐτὸ ἐν μέτρῳ καὶ ἐν κόλλῃ ἐρρύθμισεν αὐτό, ἐποίησεν αὐτὸ ὡς μορφὴν ἀνδρὸς καὶ ὡς ὡραιότητα ἀνθρώπου στῆσαι αὐτὸ ἐν οἴκῳ. <strong>ὃ ἔκοψεν ξύλον ἐκ τοῦ δρυμοῦ</strong>, ὃ ἐφύτευσεν κύριος καὶ ὑετὸς ἐμήκυνεν, <strong>ἵνα ᾖ ἀνθρώποις εἰς καῦσιν· καὶ λαβὼν ἀπ᾿ αὐτοῦ ἐθερμάνθη, καὶ καύσαντες ἔπεψαν ἄρτους ἐπ᾿ αὐτῶν· τὸ δὲ λοιπὸν εἰργάσαντο εἰς θεούς, καὶ προσκυνοῦσιν αὐτούς</strong>. οὗ τὸ ἥμισυ αὐτοῦ κατέκαυσαν ἐν πυρὶ καὶ καύσαντες ἔπεψαν ἄρτους ἐπ᾿ αὐτῶν· καὶ ἐπ᾿ αὐτοῦ κρέας ὀπτήσας ἔφαγεν καὶ ἐνεπλήσθη· καὶ θερμανθεὶς εἶπεν Ἡδύ μοι ὅτι ἐθερμάνθην καὶ εἶδον πῦρ. <strong>τὸ δὲ λοιπὸν</strong> <strong>ἐποίησεν εἰς θεὸν γλυπτὸν καὶ προσκυνεῖ αὐτῷ καὶ προσεύχεται</strong> λέγων <strong>Ἐξελοῦ με, ὅτι θεός μου εἶ σύ</strong>. <strong>οὐκ ἔγνωσαν φρονῆσαι, ὅτι ἀπημαυρώθησαν τοῦ βλέπειν τοῖς ὀφθαλμοῖς αὐτῶν καὶ τοῦ νοῆσαι τῇ καρδίᾳ αὐτῶν</strong>. καὶ οὐκ ἐλογίσατο τῇ καρδίᾳ αὐτοῦ οὐδὲ ἀνελογίσατο ἐν τῇ ψυχῇ αὐτοῦ οὐδὲ ἔγνω τῇ φρονήσει ὅτι <strong>τὸ ἥμισυ αὐτοῦ κατέκαυσεν ἐν πυρὶ καὶ ἔπεψεν ἐπὶ τῶν ἀνθράκων αὐτοῦ ἄρτους καὶ ὀπτήσας κρέας ἔφαγεν</strong> καὶ τὸ λοιπὸν αὐτοῦ εἰς βδέλυγμα ἐποίησεν καὶ <strong>προσκυνοῦσιν αὐτῷ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/is/44/#L9-19">Ησ 44:9-19</a>)</p></blockquote><blockquote><p>«Μάταιοι μὲν γὰρ πάντες ἄνθρωποι φύσει, οἷς παρῆν θεοῦ ἀγνωσία καὶ ἐκ τῶν ὁρωμένων ἀγαθῶν οὐκ ἴσχυσαν εἰδέναι τὸν ὄντα οὔτε τοῖς ἔργοις προσέχοντες ἐπέγνωσαν τὸν τεχνίτην, <strong>ἀλλ᾿ ἢ πῦρ ἢ πνεῦμα ἢ ταχινὸν ἀέρα ἢ κύκλον ἄστρων ἢ βίαιον ὕδωρ ἢ φωστῆρας οὐρανοῦ πρυτάνεις κόσμου θεοὺς ἐνόμισαν</strong>. ὧν εἰ μὲν τῇ καλλονῇ τερπόμενοι ταῦτα θεοὺς ὑπελάμβανον, γνώτωσαν πόσῳ τούτων ὁ δεσπότης ἐστὶ βελτίων, ὁ γὰρ τοῦ κάλλους γενεσιάρχης ἔκτισεν αὐτά· εἰ δὲ δύναμιν καὶ ἐνέργειαν ἐκπλαγέντες, νοησάτωσαν ἀπ᾿ αὐτῶν πόσῳ ὁ κατασκευάσας αὐτὰ δυνα τώτερός ἐστιν· ἐκ γὰρ μεγέθους καὶ καλλονῆς κτισμάτων ἀναλόγως ὁ γενεσιουργὸς αὐτῶν θεωρεῖται. ἀλλ᾿ ὅμως ἐπὶ τούτοις μέμψις ἐστὶν ὀλίγη, καὶ γὰρ αὐτοὶ τάχα πλανῶνται θεὸν ζητοῦντες καὶ θέλοντες εὑρεῖν· ἐν γὰρ τοῖς ἔργοις αὐτοῦ ἀναστρεφόμενοι διερευνῶσιν καὶ πείθονται τῇ ὄψει, ὅτι καλὰ τὰ βλεπόμενα. πάλιν δ᾿ οὐδ᾿ αὐτοὶ συγγνωστοί· εἰ γὰρ τοσοῦτον ἴσχυσαν εἰδέναι ἵνα δύνωνται στοχάσασθαι τὸν αἰῶνα, τὸν τούτων δεσπότην πῶς τάχιον οὐχ εὗρον; <strong>Ταλαίπωροι δὲ καὶ ἐν νεκροῖς αἱ ἐλπίδες αὐτῶν</strong>, οἵτινες <strong>ἐκάλεσαν θεοὺς ἔργα χειρῶν ἀνθρώπων</strong>, χρυσὸν καὶ ἄργυρον τέχνης ἐμμελέτημα καὶ <strong>ἀπεικάσματα ζῴων</strong> ἢ λίθον ἄχρηστον χειρὸς ἔργον ἀρχαίας. εἰ δὲ καί τις ὑλοτόμος τέκτων εὐκίνητον φυτὸν ἐκπρίσας περιέξυσεν εὐμαθῶς πάντα τὸν φλοιὸν αὐτοῦ καὶ τεχνησάμενος εὐπρεπῶς <strong>κατεσκεύασεν χρήσιμον σκεῦος εἰς ὑπηρεσίαν ζωῆς, τὰ δὲ ἀποβλήματα τῆς ἐργασίας εἰς ἑτοιμασίαν τροφῆς ἀναλώσας ἐνεπλήσθη, τὸ δὲ ἐξ αὐτῶν ἀπόβλημα εἰς οὐθὲν εὔχρηστον, ξύλον σκολιὸν καὶ ὄζοις συμπεφυκός, λαβὼν ἔγλυψεν ἐν ἐπιμελείᾳ ἀργίας αὐτοῦ καὶ ἐμπειρίᾳ συνέσεως ἐτύπωσεν αὐτό</strong>, <strong>ἀπείκασεν αὐτὸ εἰκόνι ἀνθρώπου</strong> <strong>ἢ ζῴῳ τινὶ εὐτελεῖ ὡμοίωσεν αὐτὸ</strong> καταχρίσας μίλτῳ καὶ φύκει ἐρυθήνας χρόαν αὐτοῦ καὶ πᾶσαν κηλῖδα τὴν ἐν αὐτῷ καταχρίσας καὶ ποιήσας αὐτῷ αὐτοῦ ἄξιον οἴκημα ἐν τοίχῳ ἔθηκεν αὐτὸ <strong>ἀσφαλισάμενος σιδήρῳ. ἵνα μὲν οὖν μὴ καταπέσῃ</strong>, προενόησεν αὐτοῦ <strong>εἰδὼς ὅτι ἀδυνατεῖ ἑαυτῷ βοηθῆσαι</strong>· καὶ γάρ ἐστιν εἰκὼν καὶ χρείαν ἔχει βοηθείας. περὶ δὲ κτημάτων καὶ γάμων αὐτοῦ καὶ τέκνων προσευχόμενος οὐκ αἰσχύνεται τῷ ἀψύχῳ προσλαλῶν καὶ περὶ μὲν ὑγιείας τὸ ἀσθενὲς ἐπικαλεῖται, περὶ δὲ ζωῆς <strong>τὸ νεκρὸν</strong> ἀξιοῖ, περὶ δὲ ἐπικουρίας <strong>τὸ ἀπειρότατον</strong> ἱκετεύει, περὶ δὲ ὁδοιπορίας <strong>τὸ μηδὲ βάσει χρῆσθαι δυνάμενον</strong>, περὶ δὲ πορισμοῦ καὶ ἐργασίας καὶ χειρῶν ἐπιτυχίας <strong>τὸ ἀδρανέστατον</strong> <strong>ταῖς χερσὶν εὐδράνειαν αἰτεῖται</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/prs/13/#L1-19">Σ.Σολ 13:1-19</a>)</p></blockquote><blockquote><p>«Πλοῦν τις πάλιν στελλόμενος καὶ ἄγρια μέλλων διοδεύειν κύματα τοῦ φέροντος αὐτὸν πλοίου <strong>σαθρότερον ξύλον ἐπιβοᾶται</strong>. &lt;…&gt; <strong>τὸ χειροποίητον</strong> δέ, ἐπικατάρατον αὐτὸ καὶ ὁ ποιήσας αὐτό, ὅτι ὁ μὲν ἠργάζετο, <strong>τὸ δὲ φθαρτὸν θεὸς ὠνομάσθη</strong>. &lt;…&gt; κενοδοξίᾳ γὰρ ἀνθρώπων εἰσῆλθεν εἰς τὸν κόσμον, καὶ διὰ τοῦτο σύντομον αὐτῶν τὸ τέλος ἐπενοήθη. ἀώρῳ γὰρ πένθει τρυχόμενος πατὴρ τοῦ ταχέως ἀφαιρεθέντος τέκνου <strong>εἰκόνα ποιήσας τόν ποτε νεκρὸν ἄνθρωπον νῦν</strong> <strong>ὡς θεὸν</strong> ἐτίμησεν καὶ παρέδωκεν τοῖς ὑποχειρίοις μυστήρια καὶ τελετάς· εἶτα ἐν χρόνῳ κρατυνθὲν τὸ ἀσεβὲς ἔθος ὡς νόμος ἐφυλάχθη. καὶ τυράννων ἐπιταγαῖς <strong>ἐθρησκεύετο τὰ γλυπτά</strong>, οὓς ἐν ὄψει μὴ δυνάμενοι τιμᾶν ἄνθρωποι διὰ τὸ μακρὰν οἰκεῖν τὴν πόρρωθεν ὄψιν ἀνατυπωσάμενοι ἐμφανῆ εἰκόνα τοῦ τιμωμένου βασιλέως ἐποίησαν, ἵνα ὡς παρόντα τὸν ἀπόντα κολακεύωσιν διὰ τῆς σπουδῆς. εἰς ἐπίτασιν δὲ θρησκείας καὶ τοὺς ἀγνοοῦντας ἡ τοῦ τεχνίτου προετρέψατο φιλοτιμία· ὁ μὲν γὰρ τάχα κρατοῦντι βουλόμενος ἀρέσαι <strong>ἐξεβιάσατο τῇ τέχνῃ τὴν ὁμοιότητα ἐπὶ τὸ κάλλιον· τὸ δὲ πλῆθος ἐφελκόμενον διὰ τὸ εὔχαρι τῆς ἐργασίας τὸν πρὸ ὀλίγου τιμηθέντα ἄνθρωπον</strong> <strong>νῦν σέβασμα</strong> ἐλογίσαντο. καὶ τοῦτο ἐγένετο τῷ βίῳ εἰς ἔνεδρον, ὅτι ἢ συμφορᾷ ἢ τυραννίδι δουλεύσαντες ἄνθρωποι <strong>τὸ ἀκοινώνητον ὄνομα λίθοις καὶ ξύλοις περιέθεσαν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/prs/14/#L1,8,14-21">Σ.Σολ 14:1,8,14-21</a>)</p></blockquote><p>Στους πρόποδες του όρους Σινά οι Ισραηλίτες ζήτησαν κυριολεκτικά να τους φτιάξουν έναν θεό:</p><blockquote><p>«Καὶ ἰδὼν ὁ λαὸς ὅτι κεχρόνικεν Μωϋσῆς καταβῆναι ἐκ τοῦ ὄρους, συνέστη ὁ λαὸς ἐπὶ Ααρων καὶ λέγουσιν αὐτῷ Ἀνάστηθι καὶ <strong>ποίησον ἡμῖν θεούς, οἳ προπορεύσονται ἡμῶν</strong>· ὁ γὰρ Μωϋσῆς οὗτος ὁ ἄνθρωπος, ὃς ἐξήγαγεν ἡμᾶς ἐξ Αἰγύπτου, οὐκ οἴδαμεν, τί γέγονεν αὐτῷ. καὶ λέγει αὐτοῖς Ααρων Περιέλεσθε τὰ ἐνώτια τὰ χρυσᾶ τὰ ἐν τοῖς ὠσὶν τῶν γυναικῶν ὑμῶν καὶ θυγατέρων καὶ ἐνέγκατε πρός με. &lt;…&gt; καὶ ἐδέξατο ἐκ τῶν χειρῶν αὐτῶν καὶ <strong>ἔπλασεν αὐτὰ ἐν τῇ γραφίδι καὶ ἐποίησεν αὐτὰ μόσχον χωνευτὸν</strong> καὶ εἶπεν <strong>Οὗτοι οἱ θεοί σου</strong>, Ισραηλ, οἵτινες ἀνεβίβασάν σε ἐκ γῆς Αἰγύπτου. &lt;…&gt; λέγουσιν γάρ μοι <strong>Ποίησον ἡμῖν θεούς, οἳ προπορεύσονται ἡμῶν</strong>· ὁ γὰρ Μωϋσῆς οὗτος ὁ ἄνθρωπος, ὃς ἐξήγαγεν ἡμᾶς ἐξ Αἰγύπτου, οὐκ οἴδαμεν, τί γέγονεν αὐτῷ.» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/32/#L1-2,4,23">Έξ 32:1-2,4,23</a>)</p></blockquote><blockquote><p>«ὑπέστρεψεν δὲ Μωϋσῆς πρὸς κύριον καὶ εἶπεν Δέομαι, κύριε· ἡμάρτηκεν ὁ λαὸς οὗτος ἁμαρτίαν μεγάλην καὶ <strong>ἐποίησαν ἑαυτοῖς θεοὺς χρυσοῦς</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/32/#L31">Έξ 32:31</a>)</p></blockquote><p>Έκαιγαν θυμίαμα όχι στον Θεό, αλλά στο φίδι, του έδωσαν όνομα, δηλαδή επινόησαν έναν θεό:</p><blockquote><p>«αὐτὸς ἐξῆρεν τὰ ὑψηλὰ καὶ συνέτριψεν πάσας τὰς στήλας καὶ ἐξωλέθρευσεν τὰ ἄλση καὶ <strong>τὸν ὄφιν τὸν χαλκοῦν</strong>, ὃν ἐποίησεν Μωϋσῆς, ὅτι ἕως τῶν ἡμερῶν ἐκείνων ἦσαν οἱ υἱοὶ Ισραηλ <strong>θυμιῶντες αὐτῷ, καὶ ἐκάλεσεν αὐτὸν Νεεσθαν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/4ts/18/#L4">Δ Βασ 18:4</a>)</p></blockquote><p>Έκλεψαν θεούς (αν και έκλεψαν μόνο κατασκευάσματα), δηλαδή τα ίδια τα κατασκευάσματα ονομάζονται θεοί:</p><blockquote><p>«νῦν οὖν πεπόρευσαι· ἐπιθυμίᾳ γὰρ ἐπεθύμησας ἀπελθεῖν εἰς τὸν οἶκον τοῦ πατρός σου· ἵνα τί <strong>ἔκλεψας τοὺς θεούς μου</strong>; ἀποκριθεὶς δὲ Ιακωβ εἶπεν τῷ Λαβαν Εἶπα γάρ Μήποτε ἀφέλῃς τὰς θυγατέρας σου ἀπ᾿ ἐμοῦ καὶ πάντα τὰ ἐμά· ἐπίγνωθι, τί ἐστιν τῶν σῶν παρ᾿ ἐμοί, καὶ λαβέ. καὶ οὐκ ἐπέγνω παρ᾿ αὐτῷ οὐθέν. καὶ εἶπεν αὐτῷ Ιακωβ <strong>Παρ ᾧ ἐὰν εὕρῃς τοὺς θεούς σου, οὐ ζήσεται</strong> ἐναντίον τῶν ἀδελφῶν ἡμῶν. οὐκ ᾔδει δὲ Ιακωβ ὅτι Ραχηλ ἡ γυνὴ αὐτοῦ <strong>ἔκλεψεν αὐτούς</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/gen/31/#L30-32">Γεν 31:30-32</a>)</p></blockquote><p>Απαγορεύονται οι θεοί που κατασκευάζονται με τα χέρια, τους οποίους λάτρευαν:</p><blockquote><p>«οὐκ ἐπακολουθήσετε εἰδώλοις καὶ <strong>θεοὺς χωνευτοὺς</strong> <strong>οὐ ποιήσετε ὑμῖν</strong>· ἐγὼ κύριος ὁ θεὸς ὑμῶν.» (<a href="https://bibleox.com/el/gr-lxx-byz/lev/19/#L4">Λευ 19:4</a>)</p></blockquote><blockquote><p>«καὶ ἐνεπλήσθη ἡ γῆ βδελυγμάτων τῶν ἔργων τῶν χειρῶν αὐτῶν, καὶ <strong>προσεκύνησαν οἷς ἐποίησαν οἱ δάκτυλοι αὐτῶν</strong>·» (<a href="https://bibleox.com/el/gr-lxx-byz/is/2/#L8">Ησ 2:8</a>)</p></blockquote><h2>Η αιτία κατασκευής ειδώλων στον Ισραήλ</h2><blockquote><p>«26 καὶ εἶπεν Ιεροβοαμ ἐν τῇ καρδίᾳ αὐτοῦ <strong>Ἰδοὺ νῦν ἐπιστρέψει ἡ βασιλεία εἰς οἶκον Δαυιδ</strong>· 27 ἐὰν ἀναβῇ ὁ λαὸς οὗτος ἀναφέρειν θυσίας ἐν οἴκῳ κυρίου εἰς Ιερουσαλημ, καὶ ἐπιστραφήσεται καρδία τοῦ λαοῦ πρὸς κύριον καὶ κύριον αὐτῶν, πρὸς Ροβοαμ βασιλέα Ιουδα, καὶ ἀποκτενοῦσίν με. 28 καὶ <strong>ἐβουλεύσατο ὁ βασιλεὺς καὶ ἐπορεύθη καὶ ἐποίησεν δύο δαμάλεις χρυσᾶς</strong> καὶ εἶπεν πρὸς τὸν λαόν Ἱκανούσθω ὑμῖν ἀναβαίνειν εἰς Ιερουσαλημ· <strong>ἰδοὺ θεοί σου</strong>, Ισραηλ, <strong>οἱ ἀναγαγόντες σε</strong> ἐκ γῆς Αἰγύπτου. 29 καὶ ἔθετο τὴν μίαν ἐν Βαιθηλ καὶ τὴν μίαν ἔδωκεν ἐν Δαν. &lt;…&gt; 32 καὶ ἐποίησεν Ιεροβοαμ ἑορτὴν ἐν τῷ μηνὶ τῷ ὀγδόῳ ἐν τῇ πεντεκαιδεκάτῃ ἡμέρᾳ τοῦ μηνὸς κατὰ τὴν ἑορτὴν τὴν ἐν γῇ Ιουδα καὶ ἀνέβη ἐπὶ τὸ θυσιαστήριον, ὃ ἐποίησεν ἐν Βαιθηλ, <strong>τοῦ θύειν ταῖς δαμάλεσιν</strong>, <strong>αἷς ἐποίησεν</strong>, καὶ παρέστησεν ἐν Βαιθηλ τοὺς ἱερεῖς τῶν ὑψηλῶν, ὧν ἐποίησεν.» (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/12/#L32">Γ Βασ 12:26-29,32</a>)</p></blockquote><h2>Στη Βαβυλώνα θεωρούσαν θεό το ίδιο το χάλκινο κατασκεύασμα, καθώς και το ζώο</h2><blockquote><p>«Οι Βαβυλώνιοι είχαν ένα <strong>είδωλο που το έλεγαν Βηλ</strong>, και ξόδευαν γι’ αυτό κάθε μέρα είκοσι μεγάλα μέτρα αλεύρι από σιτάρι, σαράντα πρόβατα και έξι μέτρα κρασί. <strong>Ο βασιλιάς τον τιμούσε και πήγαινε κάθε μέρα να τον προσκυνήσει</strong>· ο Δανιήλ όμως προσκυνούσε τον Θεό του. Και του είπε ο βασιλιάς: γιατί δεν προσκυνάς τον Βηλ; Εκείνος απάντησε: γιατί δεν προσκυνώ είδωλα φτιαγμένα από τα χέρια, αλλά προσκυνώ τον ζωντανό Θεό, που δημιούργησε τον ουρανό και τη γη και κυριαρχεί πάνω σε κάθε σάρκα. Ο βασιλιάς είπε: <strong>μήπως νομίζεις ότι ο Βηλ δεν είναι ζωντανός θεός; δεν βλέπεις πόσα τρώει και πίνει κάθε μέρα</strong>; Ο Δανιήλ, χαμογελώντας, είπε: μην ξεγελιέσαι, βασιλιά· γιατί μέσα είναι πηλός και απ’ έξω χαλκός, και ποτέ δεν έφαγε ούτε ήπιε. Τότε ο βασιλιάς, οργισμένος, κάλεσε τους ιερείς του και τους είπε: αν δεν μου πείτε ποιος τρώει όλα αυτά, θα πεθάνετε. Αν όμως μου αποδείξετε ότι τα τρώει ο Βηλ, τότε θα πεθάνει ο Δανιήλ, γιατί πρόφερε βλασφημία εναντίον του Βηλ. Και είπε ο Δανιήλ στον βασιλιά: ας γίνει σύμφωνα με τον λόγο σου. Οι ιερείς του Βηλ ήταν εβδομήντα, εκτός από τις γυναίκες και τα παιδιά. Και ήρθε ο βασιλιάς με τον Δανιήλ στον ναό του Βηλ, και είπαν οι ιερείς του Βηλ: δες, εμείς θα βγούμε έξω, και εσύ, βασιλιά, βάλε το φαγητό και, αφού ρίξεις κρασί, κλείσε τις πόρτες και σφράγισέ τες με το δαχτυλίδι σου. Και αν αύριο έρθεις και δεν βρεις ότι όλα τα έφαγε ο Βηλ, εμείς θα πεθάνουμε, ή ο Δανιήλ που είπε ψέματα εναντίον μας. Εκείνοι δεν έδιναν σημασία σε αυτό, γιατί κάτω από το τραπέζι είχαν κάνει κρυφή είσοδο, και έμπαιναν πάντα από εκεί και τα έτρωγαν. Όταν εκείνοι βγήκαν, ο βασιλιάς έβαλε το φαγητό μπροστά στον Βηλ, και ο Δανιήλ πρόσταξε τους υπηρέτες του, και έφεραν στάχτη και τη σκόρπισαν σε όλο τον ναό μπροστά στον βασιλιά και μόνο, και βγήκαν, έκλεισαν τις πόρτες, τις σφράγισαν με το βασιλικό δαχτυλίδι και αποσύρθηκαν. Οι ιερείς όμως, κατά τη συνήθειά τους, ήρθαν τη νύχτα με τις γυναίκες και τα παιδιά τους και τα έφαγαν και τα ήπιαν όλα. Την επόμενη μέρα ο βασιλιάς σηκώθηκε νωρίς, και ο Δανιήλ μαζί του, και είπε: είναι άθικτες οι σφραγίδες, Δανιήλ; Εκείνος είπε: είναι άθικτες, βασιλιά. Και μόλις άνοιξαν οι πόρτες, ο βασιλιάς, κοιτάζοντας το τραπέζι, φώναξε με δυνατή φωνή: μεγάλος είσαι, Βηλ, και δεν υπάρχει κανένας δόλος σε σένα! Ο Δανιήλ, χαμογελώντας, κράτησε τον βασιλιά για να μην μπει μέσα, και είπε: κοίτα το πάτωμα και πρόσεξε ποιανών είναι αυτά τα ίχνη. Ο βασιλιάς είπε: βλέπω ίχνη ανδρών, γυναικών και παιδιών. Και, οργισμένος, ο βασιλιάς πρόσταξε να συλλάβουν τους ιερείς, τις γυναίκες τους και τα παιδιά τους, και εκείνοι έδειξαν τις κρυφές πόρτες από τις οποίες έμπαιναν και έτρωγαν ό,τι ήταν στο τραπέζι. Τότε ο βασιλιάς πρόσταξε να τους θανατώσουν και παρέδωσε τον Βηλ στον Δανιήλ, και εκείνος τον κατέστρεψε και τον ναό του. <strong>Σε εκείνον τον τόπο υπήρχε ένας μεγάλος δράκος, και οι Βαβυλώνιοι τον τιμούσαν</strong>. Και είπε ο βασιλιάς στον Δανιήλ: μήπως <strong>θα πεις και γι’ αυτόν ότι είναι χαλκός; να, είναι ζωντανός, και τρώει και πίνει· δεν μπορείς να πεις ότι αυτός ο θεός δεν είναι ζωντανός</strong>· λοιπόν προσκύνησέ τον. Ο Δανιήλ είπε: τον Κύριο και Θεό μου προσκυνώ, γιατί Αυτός είναι ο ζωντανός Θεός. Αλλά εσύ, βασιλιά, δώσε μου την άδεια, και θα σκοτώσω τον δράκο χωρίς σπαθί και ραβδί. Ο βασιλιάς είπε: σου δίνω. Τότε ο Δανιήλ πήρε πίσσα, λίπος και τρίχες, τα έβρασε μαζί και, αφού έφτιαξε από αυτά μια μπάλα, <strong>την πέταξε στο στόμα του δράκου, και ο δράκος έσκασε</strong>. Και είπε ο Δανιήλ: να τα ιερά σας! Όταν όμως οι Βαβυλώνιοι το άκουσαν αυτό, αγανάκτησαν πολύ και ξεσηκώθηκαν εναντίον του βασιλιά, και είπαν: ο βασιλιάς έγινε Ιουδαίος, κατέστρεψε τον Βηλ, σκότωσε τον δράκο και θανάτωσε τους ιερείς.» — Σημείωση: το κεφάλαιο Δαν 14 (Βηλ και Δράκων) δεν υπάρχει στο ελληνικό κείμενο της Βίβλου του ιστότοπου· η μετάφραση δίνεται από το ρωσικό κείμενο.</p></blockquote><h2>Το είδωλο δεν μπορεί να κάνει τίποτα και το ίδιο απαιτεί φροντίδα για τον εαυτό του</h2><p>Η προσοχή εστιάζεται συνεχώς στο ότι τα είδωλα δεν μπορούν να κάνουν τίποτα:</p><blockquote><p>«τί συμφέρει κάρπωσις εἰδώλῳ; <strong>οὔτε γὰρ ἔδεται οὔτε μὴ ὀσφρανθῇ</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/prsir/30/#L19">Σ.Σειρ 30:19</a>)</p></blockquote><blockquote><p>«Καὶ οἱ λοιποὶ τῶν ἀνθρώπων, οἳ οὐκ ἀπεκτάνθησαν ἐν ταῖς πληγαῖς ταύταις, οὐδὲ μετενόησαν ἐκ τῶν ἔργων τῶν χειρῶν αὐτῶν, ἵνα μὴ προσκυνήσουσιν τὰ δαιμόνια καὶ τὰ εἴδωλα τὰ χρυσᾶ καὶ τὰ ἀργυρᾶ καὶ τὰ χαλκᾶ καὶ τὰ λίθινα καὶ τὰ ξύλινα, <strong>ἃ οὔτε βλέπειν δύνανται οὔτε ἀκούειν οὔτε περιπατεῖν</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/9/#L20">Απ 9:20</a>)</p></blockquote><p>Αλλά αν το είδωλο είναι μόνο μια εικόνα, τότε δεν χρειάζεται να λέμε ότι δεν μπορεί να κάνει τίποτα. Οι ίδιοι οι ειδωλολάτρες θα γελάσουν και θα πουν: βεβαίως δεν μπορούν, αφού είναι μόνο μια εικόνα.</p><h2>Χωρίς το είδωλο, η λατρεία του ειδώλου δεν τελείται</h2><blockquote><p>«καὶ ὑμεῖς, οἶκος Ισραηλ, τάδε λέγει κύριος κύριος <strong>Ἕκαστος τὰ ἐπιτηδεύματα αὐτοῦ ἐξάρατε</strong>· καὶ μετὰ ταῦτα εἰ μὴ ὑμεῖς εἰσακούετέ μου καὶ τὸ ὄνομά μου τὸ ἅγιον οὐ βεβηλώσετε οὐκέτι ἐν τοῖς δώροις ὑμῶν καὶ ἐν τοῖς ἐπιτηδεύμασιν ὑμῶν·» (<a href="https://bibleox.com/el/gr-lxx-byz/iez/20/#L39">Ιεζ 20:39</a>) — Σημείωση: στο ελληνικό κείμενο των Εβδομήκοντα ο στίχος λέει “ας απομακρύνει ο καθένας τις πράξεις του”, ενώ το ρωσικό κείμενο μιλά για πορεία προς τα είδωλα και λατρεία τους.</p></blockquote><h2>Περί των ειδώλων στην Καινή Διαθήκη</h2><p>Το ίδιο το είδωλο θεωρείται θεός:</p><blockquote><p>«Δημήτριος γάρ τις ὀνόματι, ἀργυροκόπος, ποιῶν ναοὺς ἀργυροῦς Ἀρτέμιδος παρείχετο τοῖς τεχνίταις οὐκ ὀλίγην ἐργασίαν, οὓς συναθροίσας καὶ τοὺς περὶ τὰ τοιαῦτα ἐργάτας εἶπεν, Ἄνδρες, ἐπίστασθε ὅτι ἐκ ταύτης τῆς ἐργασίας ἡ εὐπορία ἡμῖν ἐστιν, καὶ θεωρεῖτε καὶ ἀκούετε ὅτι οὐ μόνον Ἐφέσου ἀλλὰ σχεδὸν πάσης τῆς Ἀσίας ὁ Παῦλος οὗτος πείσας μετέστησεν ἱκανὸν ὄχλον, λέγων ὅτι <strong>οὐκ εἰσὶν θεοὶ οἱ διὰ χειρῶν γινόμενοι</strong>. οὐ μόνον δὲ τοῦτο <strong>κινδυνεύει ἡμῖν</strong> τὸ μέρος εἰς ἀπελεγμὸν ἐλθεῖν, ἀλλὰ καὶ τὸ τῆς μεγάλης θεᾶς Ἀρτέμιδος ἱερὸν εἰς οὐθὲν λογισθῆναι, μέλλειν τε καὶ καθαιρεῖσθαι τῆς μεγαλειότητος αὐτῆς, ἣν ὅλη ἡ Ἀσία καὶ ἡ οἰκουμένη σέβεται.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/19/#L24-27">Πραξ 19:24-27</a>)</p></blockquote><h2>Ο αληθινός Θεός δεν δίνει απάντηση στον λάτρη των ειδώλων</h2><blockquote><p>«διὰ τοῦτο λάλησον αὐτοῖς καὶ ἐρεῖς πρὸς αὐτούς Τάδε λέγει κύριος <strong>Ἄνθρωπος ἄνθρωπος ἐκ τοῦ οἴκου Ισραηλ, ὃς ἂν θῇ τὰ διανοήματα αὐτοῦ ἐπὶ τὴν καρδίαν αὐτοῦ</strong> καὶ τὴν κόλασιν τῆς ἀδικίας αὐτοῦ τάξῃ πρὸ προσώπου αὐτοῦ καὶ ἔλθῃ πρὸς τὸν προφήτην, <strong>ἐγὼ κύριος ἀποκριθήσομαι αὐτῷ ἐν οἷς ἐνέχεται ἡ διάνοια αὐτοῦ</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/iez/14/#L4">Ιεζ 14:4</a>) — Σημείωση: στο ελληνικό κείμενο των Εβδομήκοντα ο στίχος λέει “ἐγὼ κύριος ἀποκριθήσομαι αὐτῷ” (“εγώ, ο Κύριος, θα του απαντήσω”)· πρόκειται για απάντηση κρίσης, όχι για τον χρησμό που ζητά ο ειδωλολάτρης, γι’ αυτό η ρωσική μετάφραση τη δίνει ως ερώτηση.</p></blockquote><blockquote><p>«ὅπως πλαγιάσῃ τὸν οἶκον τοῦ Ισραηλ κατὰ τὰς καρδίας αὐτῶν <strong>τὰς ἀπηλλοτριωμένας ἀπ᾿ ἐμοῦ ἐν τοῖς ἐνθυμήμασιν αὐτῶν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/iez/14/#L5">Ιεζ 14:5</a>)</p></blockquote><blockquote><p>«καὶ ἐν ταῖς ἀπαρχαῖς τῶν δομάτων ὑμῶν <strong>ἐν τοῖς ἀφορισμοῖς ὑμεῖς μιαίνεσθε ἐν πᾶσιν τοῖς ἐνθυμήμασιν ὑμῶν</strong> ἕως τῆς σήμερον ἡμέρας. καὶ ἐγὼ ἀποκριθῶ ὑμῖν, οἶκος τοῦ Ισραηλ; ζῶ ἐγώ, λέγει κύριος, <strong>εἰ ἀποκριθήσομαι ὑμῖν</strong>, καὶ εἰ ἀναβήσεται ἐπὶ τὸ πνεῦμα ὑμῶν τοῦτο.» (<a href="https://bibleox.com/el/gr-lxx-byz/iez/20/#L31">Ιεζ 20:31</a>)</p></blockquote><h2>Λοιπά</h2><blockquote><p>«Ἀρχὴ γὰρ πορνείας ἐπίνοια εἰδώλων, εὕρεσις δὲ αὐτῶν φθορὰ ζωῆς.» (<a href="https://bibleox.com/el/gr-lxx-byz/prs/14/#L12">Σ.Σολ 14:12</a>)</p></blockquote><blockquote><p>«ἡ γὰρ τῶν ἀνωνύμων εἰδώλων θρησκεία παντὸς ἀρχὴ κακοῦ καὶ αἰτία καὶ πέρας ἐστίν·» (<a href="https://bibleox.com/el/gr-lxx-byz/prs/14/#L27">Σ.Σολ 14:27</a>)</p></blockquote><blockquote><p>«ἀψύχοις γὰρ πεποιθότες εἰδώλοις κακῶς ὀμόσαντες ἀδικηθῆναι οὐ προσδέχονται.» (<a href="https://bibleox.com/el/gr-lxx-byz/prs/14/#L29">Σ.Σολ 14:29</a>)</p></blockquote><blockquote><p>«ἐξῆλθον εἰς συνάντησιν τῷ ἀλλοφύλῳ, καὶ ἐπικατηράσατό με ἐν τοῖς εἰδώλοις αὐτοῦ·» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/151/#L6">Ψλ 151:6</a>)</p></blockquote>'
