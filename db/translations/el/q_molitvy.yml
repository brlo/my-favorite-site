  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: '<h2>Η κατανόηση της Ορθόδοξης Εκκλησίας</h2><p>Η Ορθόδοξη Εκκλησία διδάσκει ότι ο Κύριος Ιησούς Χριστός είναι ο μόνος μεσίτης — αλλά με ποια έννοια; Εκείνος που παρέδωσε τον εαυτό του για τη <u>λύτρωση</u> όλων (<a href="https://bibleox.com/el/gr-lxx-byz/1tim/2/#L5">Α Τιμ 2:5</a>). Όλοι οι άλλοι άγιοι άνθρωποι και οι άγγελοι δεν είναι λυτρωτές. Συμπροσευχόμενοι όμως είναι πολλοί:</p><blockquote><p>«ὃς ἐκ τηλικούτων θανάτων ἐρρύσατο ἡμᾶς καὶ ῥύσεται, εἰς ὃν ἠλπίκαμεν <strong>καὶ ἔτι ῥύσεται, συνυπουργούντων καὶ ὑμῶν ὑπὲρ ἡμῶν τῇ δεήσει, ἵνα ἐκ πολλῶν προσώπων τὸ εἰς ἡμᾶς χάρισμα διὰ πολλῶν</strong> εὐχαριστηθῇ ὑπὲρ ἡμῶν.» (<a href="https://bibleox.com/el/gr-lxx-byz/2kor/1/#L10-11">Β Κορ 1:10-11</a>)</p></blockquote><p>Τέτοιοι είναι και οι άγιοι δίκαιοι φίλοι του Θεού: η Μητέρα του Θεού, οι άγγελοι, οι προφήτες, οι απόστολοι, οι μάρτυρες και οι λοιποί άγιοι. Όπως ζητούσαν από τον απόστολο προσευχές εδώ, έτσι τού ζητούν προσευχές και εκεί. Η σκέψη ότι δήθεν ο καθένας πρέπει να προσεύχεται στον Θεό μόνο για τον εαυτό του είναι ξένη προς την Αγία Γραφή. Αντίθετα, στην Αγία Γραφή ολόκληρη η Εκκλησία καλείται επανειλημμένα σε αμοιβαία προσευχή ο ένας για τον άλλο (<a href="https://bibleox.com/el/gr-lxx-byz/iak/5/#L16">Ιακ 5:16</a>)[1]. Όλοι, ακόμη και οι μεγάλοι δίκαιοι και εκλεκτοί του Θεού, χωρίς να εγκαταλείπουν τις προσευχές προς τον Θεό, ζητούσαν από τους πιστούς να προσεύχονται γι’ αυτούς, οι ίδιοι προσεύχονταν αδιάκοπα για τους πιστούς και παρήγγειλαν να τηρείται αυτή η τάξη και στο μέλλον. Αυτό λέγεται αλλιώς μεσιτεία του ενός για τον άλλο.</p><p>Γνωρίζουμε από την Εκκλησία και το επιβεβαιώνουμε με τη Γραφή, ότι οι δίκαιοι μετά τον χωρισμό από το σώμα περνούν στη ζωή με τον Θεό και συνεχίζουν να Του προσφέρουν τις προσευχές τους. Και όπως ζητούσαν προσευχές από αυτούς τους δικαίους όταν ζούσαν σωματικά στη γη, έτσι ακριβώς ζητάμε τις προσευχές τους και μετά τον χωρισμό τους από το σώμα και τη μετάβασή τους στη φανερή ζωή στον ουρανό με τον Χριστό (<a href="https://bibleox.com/el/gr-lxx-byz/evr/12/#L22-23">Εβρ 12:22-23</a>), γιατί πέρασαν όχι σε χειρότερη, αλλά σε καλύτερη κατάσταση (<a href="https://bibleox.com/el/gr-lxx-byz/fil/1/#L23">Φιλ 1:23</a>). Πιστεύουμε ότι η αγάπη ουδέποτε πίπτει (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/13/#L8">Α Κορ 13:8</a>), και γι’ αυτό ολόκληρη η Εκκλησία: η στρατευομένη στη γη και η θριαμβεύουσα στον ουρανό — είναι η Εκκλησία η μία, η ενιαία, η κοινωνούσα, που προσεύχεται συνολικά η μία για την άλλη και παρακινείται από την αγάπη να φροντίζει για όλα τα μέλη της. Πιστεύουμε και γνωρίζουμε από την Εκκλησία και το δείχνουμε στη Γραφή, ότι οι φύλακες άγγελοί μας έχουν κοινωνία με τον Θεό (<a href="https://bibleox.com/el/gr-lxx-byz/mf/18/#L10">Μτ 18:10</a>) και αποστέλλονται στη διακονία όσων πρόκειται να κληρονομήσουν τη σωτηρία (<a href="https://bibleox.com/el/gr-lxx-byz/evr/1/#L14">Εβρ 1:14</a>), και οι άγιοι δίκαιοι, μένοντας στο θείο φως, γνωρίζουν επίσης όσα γίνονται στη γη και αναπέμπουν στον Θεό τις προσευχές τους για την Εκκλησία (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/6/#L9-11">Απ 6:9-11</a>), και η αιώνια αγάπη παρακινεί όλους σε κοινωνία και αμοιβαία φροντίδα στο ένα σώμα του Χριστού: στον ουρανό και στη γη.</p><h2>Η προσευχή των αγγέλων</h2><h3>Οι άνθρωποι έχουν φύλακες αγγέλους</h3><blockquote><p>«Ὁρᾶτε μὴ καταφρονήσητε ἑνὸς τῶν μικρῶν τούτων· λέγω γὰρ ὑμῖν ὅτι <strong>οἱ ἄγγελοι αὐτῶν</strong> ἐν οὐρανοῖς διὰ παντὸς βλέπουσι τὸ πρόσωπον τοῦ πατρός μου τοῦ ἐν οὐρανοῖς.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/18/#L10">Μτ 18:10</a>)</p></blockquote><h3>Οι άγγελοι αποστέλλονται να φροντίζουν για όσους σώζονται</h3><blockquote><p>«οὐχὶ πάντες εἰσὶν λειτουργικὰ πνεύματα <strong>εἰς διακονίαν ἀποστελλόμενα διὰ τοὺς μέλλοντας κληρονομεῖν σωτηρίαν</strong>;» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/1/#L13-14">Εβρ 1:13-14</a>)</p></blockquote><h3>Οι άγγελοι στον ουρανό χαίρονται για τη μετάνοια του ανθρώπου</h3><blockquote><p>«λέγω ὑμῖν ὅτι οὕτως <strong>χαρὰ ἐν τῷ οὐρανῷ ἔσται ἐπὶ ἑνὶ ἁμαρτωλῷ μετανοοῦντι</strong> ἢ ἐπὶ ἐνενήκοντα ἐννέα δικαίοις οἵτινες οὐ χρείαν ἔχουσιν μετανοίας. &lt;…&gt; οὕτως, λέγω ὑμῖν, <strong>γίνεται χαρὰ ἐνώπιον τῶν ἀγγέλων τοῦ θεοῦ ἐπὶ ἑνὶ ἁμαρτωλῷ μετανοοῦντι</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/15/#L7,10">Λκ 15:7,10</a>)</p></blockquote><h3>Ο άγγελος μεσιτεύει στον Θεό για τους ανθρώπους</h3><p>Ο άγγελος ζητά έλεος για τους κατοίκους των ιουδαϊκών πόλεων:</p><blockquote><p>«καὶ ἀπεκρίθη ὁ ἄγγελος κυρίου καὶ εἶπεν <strong>Κύριε παντοκράτωρ, ἕως τίνος οὐ μὴ ἐλεήσῃς</strong> <strong>τὴν Ιερουσαλημ καὶ τὰς πόλεις Ιουδα</strong>, ἃς ὑπερεῖδες τοῦτο ἑβδομηκοστὸν ἔτος; καὶ ἀπεκρίθη κύριος παντοκράτωρ τῷ ἀγγέλῳ τῷ λαλοῦντι ἐν ἐμοὶ ῥήματα καλὰ καὶ λόγους παρακλητικούς.» (<a href="https://bibleox.com/el/gr-lxx-byz/zah/1/#L12-13">Ζαχ 1:12-13</a>)</p></blockquote><h3>Η κοινωνία με τους αγγέλους</h3><blockquote><p>«ἡνίκα δὲ ὄρθρος ἐγίνετο, <strong>ἐπεσπούδαζον οἱ ἄγγελοι τὸν Λωτ</strong> <strong>λέγοντες</strong> Ἀναστὰς λαβὲ τὴν γυναῖκά σου καὶ τὰς δύο θυγατέρας σου, ἃς ἔχεις, καὶ ἔξελθε, ἵνα μὴ συναπόλῃ ταῖς ἀνομίαις τῆς πόλεως.» (<a href="https://bibleox.com/el/gr-lxx-byz/gen/19/#L15">Γεν 19:15</a>)</p></blockquote><blockquote><p>«Καὶ ἦλθεν ἄγγελος κυρίου καὶ ἐκάθισεν ὑπὸ τὴν δρῦν τὴν οὖσαν ἐν Εφραθα τὴν τοῦ Ιωας πατρὸς Αβιεζρι, καὶ Γεδεων ὁ υἱὸς αὐτοῦ ἐρράβδιζεν πυροὺς ἐν ληνῷ τοῦ ἐκφυγεῖν ἐκ προσώπου Μαδιαμ. καὶ <strong>ὤφθη αὐτῷ ἄγγελος κυρίου καὶ εἶπεν πρὸς αὐτόν</strong> Κύριος μετὰ σοῦ, δυνατὸς τῇ ἰσχύι. καὶ <strong>εἶπεν πρὸς αὐτὸν Γεδεων</strong> Ἐν ἐμοί, κύριε, καὶ εἰ ἔστιν κύριος μεθ᾿ ἡμῶν, ἵνα τί εὗρεν ἡμᾶς πάντα τὰ κακὰ ταῦτα; καὶ ποῦ ἐστιν πάντα τὰ θαυμάσια αὐτοῦ, ὅσα διηγήσαντο ἡμῖν οἱ πατέρες ἡμῶν λέγοντες Οὐχὶ ἐξ Αἰγύπτου ἀνήγαγεν ἡμᾶς κύριος; καὶ νῦν ἀπώσατο ἡμᾶς καὶ παρέδωκεν ἡμᾶς ἐν χειρὶ Μαδιαμ.» (<a href="https://bibleox.com/el/gr-lxx-byz/sud/6/#L11-13">Κρ 6:11-13</a>)</p></blockquote><blockquote><p>«Καὶ ἐγένετο ἀνὴρ ἐκ Σαραα ἐκ τῆς φυλῆς τοῦ Δαν, καὶ ὄνομα αὐτῷ Μανωε, καὶ ἡ γυνὴ αὐτοῦ στεῖρα καὶ οὐκ ἔτικτεν. καὶ <strong>ὤφθη ἄγγελος κυρίου πρὸς τὴν γυναῖκα καὶ εἶπεν πρὸς αὐτήν</strong> Ἰδοὺ δὴ σὺ στεῖρα καὶ οὐ τέτοκας· καὶ ἐν γαστρὶ ἕξεις καὶ τέξῃ υἱόν.» (<a href="https://bibleox.com/el/gr-lxx-byz/sud/13/#L2-3">Κρ 13:2-3</a>)</p></blockquote><blockquote><p>«<strong>ἄγγελοι προσῆλθον καὶ διηκόνουν αὐτῷ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/4/#L11">Μτ 4:11</a>)</p></blockquote><blockquote><p>«Ἐγένετο ἐν ταῖς ἡμέραις Ἡρῴδου βασιλέως τῆς Ἰουδαίας ἱερεύς τις ὀνόματι Ζαχαρίας ἐξ ἐφημερίας Ἀβιά, καὶ γυνὴ αὐτῷ ἐκ τῶν θυγατέρων Ἀαρών, καὶ τὸ ὄνομα αὐτῆς Ἐλισάβετ. &lt;…&gt; <strong>ὤφθη δὲ αὐτῷ ἄγγελος κυρίου</strong> ἑστὼς ἐκ δεξιῶν τοῦ θυσιαστηρίου τοῦ θυμιάματος. &lt;…&gt; <strong>εἶπεν δὲ πρὸς αὐτὸν ὁ ἄγγελος</strong>, Μὴ φοβοῦ, Ζαχαρία, διότι εἰσηκούσθη ἡ δέησίς σου, καὶ ἡ γυνή σου Ἐλισάβετ γεννήσει υἱόν σοι, καὶ καλέσεις τὸ ὄνομα αὐτοῦ Ἰωάννην. &lt;…&gt; Καὶ <strong>εἶπεν Ζαχαρίας πρὸς τὸν ἄγγελον</strong>, Κατὰ τί γνώσομαι τοῦτο; ἐγὼ γάρ εἰμι πρεσβύτης καὶ ἡ γυνή μου προβεβηκυῖα ἐν ταῖς ἡμέραις αὐτῆς. καὶ <strong>ἀποκριθεὶς ὁ ἄγγελος εἶπεν αὐτῷ</strong>, Ἐγώ εἰμι Γαβριὴλ ὁ παρεστηκὼς ἐνώπιον τοῦ θεοῦ, καὶ ἀπεστάλην λαλῆσαι πρὸς σὲ καὶ εὐαγγελίσασθαί σοι ταῦτα·» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/1/#L5,11,13,18-19">Λκ 1:5,11,13,18-19</a>)</p></blockquote><blockquote><p>«Ἐν δὲ τῷ μηνὶ τῷ ἕκτῳ <strong>ἀπεστάλη ὁ ἄγγελος Γαβριὴλ</strong> ἀπὸ τοῦ θεοῦ εἰς πόλιν τῆς Γαλιλαίας ᾗ ὄνομα Ναζαρὲθ <strong>πρὸς παρθένον</strong> ἐμνηστευμένην ἀνδρὶ ᾧ ὄνομα Ἰωσὴφ ἐξ οἴκου Δαυίδ, καὶ τὸ ὄνομα τῆς παρθένου Μαριάμ. καὶ <strong>εἰσελθὼν πρὸς αὐτὴν εἶπεν</strong>, Χαῖρε, κεχαριτωμένη, ὁ κύριος μετὰ σοῦ. &lt;…&gt; καὶ <strong>εἶπεν ὁ ἄγγελος αὐτῇ</strong>, Μὴ φοβοῦ, Μαριάμ, εὗρες γὰρ χάριν παρὰ τῷ θεῷ· καὶ ἰδοὺ συλλήμψῃ ἐν γαστρὶ καὶ τέξῃ υἱόν, καὶ καλέσεις τὸ ὄνομα αὐτοῦ Ἰησοῦν. &lt;…&gt; <strong>εἶπεν δὲ Μαριὰμ πρὸς τὸν ἄγγελον</strong>, Πῶς ἔσται τοῦτο, ἐπεὶ ἄνδρα οὐ γινώσκω; καὶ <strong>ἀποκριθεὶς ὁ ἄγγελος εἶπεν αὐτῇ</strong>, Πνεῦμα ἅγιον ἐπελεύσεται ἐπὶ σέ, καὶ δύναμις ὑψίστου ἐπισκιάσει σοι· διὸ καὶ τὸ γεννώμενον ἅγιον κληθήσεται, υἱὸς θεοῦ.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/1/#L26-28,30-31,34-35">Λκ 1:26-28,30-31,34-35</a>)</p></blockquote><blockquote><p>«καὶ ὅραμα διὰ [τῆς] νυκτὸς τῷ Παύλῳ ὤφθη, ἀνὴρ Μακεδών τις ἦν ἑστὼς καὶ παρακαλῶν αὐτὸν καὶ <strong>λέγων</strong>, Διαβὰς εἰς Μακεδονίαν βοήθησον ἡμῖν.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/16/#L9">Πραξ 16:9</a>)</p></blockquote><blockquote><p>«καὶ ἰδοὺ <strong>ἄγγελος κυρίου ἐπέστη</strong>, καὶ φῶς ἔλαμψεν ἐν τῷ οἰκήματι· <strong>πατάξας δὲ τὴν πλευρὰν τοῦ Πέτρου ἤγειρεν αὐτὸν λέγων</strong>, Ἀνάστα ἐν τάχει. καὶ ἐξέπεσαν αὐτοῦ αἱ ἁλύσεις ἐκ τῶν χειρῶν. <strong>εἶπεν δὲ ὁ ἄγγελος πρὸς αὐτόν</strong>, Ζῶσαι καὶ ὑπόδησαι τὰ σανδάλιά σου. ἐποίησεν δὲ οὕτως. καὶ λέγει αὐτῷ, Περιβαλοῦ τὸ ἱμάτιόν σου καὶ ἀκολούθει μοι.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/12/#L7-8">Πραξ 12:7-8</a>)</p></blockquote><blockquote><p>«Ἀποκάλυψις Ἰησοῦ Χριστοῦ, ἣν ἔδωκεν αὐτῷ ὁ θεός, δεῖξαι τοῖς δούλοις αὐτοῦ ἃ δεῖ γενέσθαι ἐν τάχει, καὶ <strong>ἐσήμανεν ἀποστείλας διὰ τοῦ ἀγγέλου αὐτοῦ τῷ δούλῳ αὐτοῦ Ἰωάννῃ</strong>,» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/1/#L1">Απ 1:1</a>)</p></blockquote><h2>Η προσευχή των κεκοιμημένων</h2><p>Ο προφήτης Βαρούχ ζητά από τον Θεό να ακούσει τις προσευχές των κεκοιμημένων δικαίων:</p><blockquote><p>«κύριε παντοκράτωρ ὁ θεὸς Ισραηλ, ψυχὴ ἐν στενοῖς καὶ πνεῦμα ἀκηδιῶν κέκραγεν πρὸς σέ. ἄκουσον, κύριε, καὶ ἐλέησον, ὅτι <strong>ἡμάρτομεν</strong> ἐναντίον σου· ὅτι σὺ καθήμενος τὸν αἰῶνα, καὶ ἡμεῖς ἀπολλύμενοι τὸν αἰῶνα. κύριε παντοκράτωρ <strong>ὁ θεὸς Ισραηλ, ἄκουσον δὴ τῆς προσευχῆς τῶν τεθνηκότων Ισραηλ καὶ υἱῶν τῶν ἁμαρτανόντων ἐναντίον σου</strong>, οἳ οὐκ ἤκουσαν τῆς φωνῆς κυρίου θεοῦ αὐτῶν καὶ ἐκολλήθη ἡμῖν τὰ κακά.» (<a href="https://bibleox.com/el/gr-lxx-byz/var/3/#L1-4">Βαρ 3:1-4</a>)</p></blockquote><p>Η κεκοιμημένη Ραχήλ, σύζυγος του πατριάρχου Ιακώβ, θρηνεί για τον θάνατο και τα παθήματα των γιων της στη βαβυλώνια αιχμαλωσία. Και ο Κύριος τής απαντά, την παρηγορεί και υπόσχεται να τους ελευθερώσει, όπως και έγινε:</p><blockquote><p>«Οὕτως εἶπεν κύριος Φωνὴ ἐν Ραμα ἠκούσθη θρήνου καὶ κλαυθμοῦ καὶ ὀδυρμοῦ· <strong>Ραχηλ ἀποκλαιομένη οὐκ ἤθελεν παύσασθαι ἐπὶ τοῖς υἱοῖς αὐτῆς, ὅτι οὐκ εἰσίν</strong>. <strong>οὕτως εἶπεν κύριος Διαλιπέτω ἡ φωνή σου ἀπὸ κλαυθμοῦ καὶ οἱ ὀφθαλμοί σου ἀπὸ δακρύων σου, ὅτι ἔστιν μισθὸς τοῖς σοῖς ἔργοις</strong>, καὶ ἐπιστρέψουσιν ἐκ γῆς ἐχθρῶν, μόνιμον τοῖς σοῖς τέκνοις.» (<a href="https://bibleox.com/el/gr-lxx-byz/ier/38/#L15-17">Ιερ 38:15-17</a>)</p></blockquote><p>Αυτό το χωρίο μπορεί να κατανοηθεί αλληγορικά, αλλά και κυριολεκτικά.</p><h2>Η προσευχή των δικαίων</h2><h3>Η προσευχή του δικαίου είναι πιο ευάρεστη στον Θεό</h3><blockquote><p>«θυσίαι ἀσεβῶν βδέλυγμα κυρίῳ, <strong>εὐχαὶ δὲ κατευθυνόντων δεκταὶ παρ᾿ αὐτῷ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/pr/15/#L8">Πρμ 15:8</a>)</p></blockquote><blockquote><p>«μακρὰν ἀπέχει ὁ θεὸς ἀπὸ ἀσεβῶν, <strong>εὐχαῖς δὲ δικαίων ἐπακούει</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/pr/15/#L29">Πρμ 15:29</a>)</p></blockquote><blockquote><p>«ἐξομολογεῖσθε οὖν ἀλλήλοις τὰς ἁμαρτίας καὶ εὔχεσθε ὑπὲρ ἀλλήλων, ὅπως ἰαθῆτε. <strong>πολὺ ἰσχύει δέησις δικαίου ἐνεργουμένη</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/iak/5/#L16">Ιακ 5:16</a>)</p></blockquote><h3>Ο Θεός απαιτεί να προσευχηθεί ο δίκαιος για τη συγχώρηση της αμαρτίας</h3><h4>Ο Ιώβ</h4><blockquote><p>«νῦν δὲ λάβετε ἑπτὰ μόσχους καὶ ἑπτὰ κριοὺς καὶ πορεύθητε πρὸς τὸν θεράποντά μου Ιωβ, καὶ ποιήσει κάρπωσιν περὶ ὑμῶν· <strong>Ιωβ δὲ ὁ θεράπων μου εὔξεται περὶ ὑμῶν, ὅτι εἰ μὴ πρόσωπον αὐτοῦ λήμψομαι</strong>· εἰ μὴ γὰρ δι᾿ αὐτόν, ἀπώλεσα ἂν ὑμᾶς· οὐ γὰρ ἐλαλήσατε ἀληθὲς κατὰ τοῦ θεράποντός μου Ιωβ. —» (<a href="https://bibleox.com/el/gr-lxx-byz/iov/42/#L8">Ιωβ 42:8</a>)</p></blockquote><blockquote><p>«εἶπεν δὲ αὐτῷ ὁ θεὸς καθ᾿ ὕπνον Κἀγὼ ἔγνων ὅτι ἐν καθαρᾷ καρδίᾳ ἐποίησας τοῦτο, καὶ ἐφεισάμην ἐγώ σου τοῦ μὴ ἁμαρτεῖν σε εἰς ἐμέ· ἕνεκεν τούτου οὐκ ἀφῆκά σε ἅψασθαι αὐτῆς. νῦν δὲ ἀπόδος τὴν γυναῖκα τῷ ἀνθρώπῳ, <strong>ὅτι προφήτης ἐστὶν καὶ προσεύξεται περὶ σοῦ καὶ ζήσῃ· εἰ δὲ μὴ ἀποδίδως, γνῶθι ὅτι ἀποθανῇ σὺ καὶ πάντα τὰ σά</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/gen/20/#L6-7">Γεν 20:6-7</a>)</p></blockquote><h4>Ο προφήτης Μωυσής</h4><p>Ο προφήτης Μωυσής ήταν μεσίτης μεταξύ του Θεού και ολοκλήρου του λαού:</p><blockquote><p>«νῦν οὖν ἄκουσόν μου, καὶ συμβουλεύσω σοι, καὶ ἔσται ὁ θεὸς μετὰ σοῦ. <strong>γίνου σὺ τῷ λαῷ τὰ πρὸς τὸν θεὸν</strong> καὶ ἀνοίσεις τοὺς λόγους αὐτῶν πρὸς τὸν θεὸν» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/18/#L19">Έξ 18:19</a>)</p></blockquote><p>Χάρη στην παράκληση του Μωυσή, ο Θεός συγχωρούσε τις αμαρτίες του λαού:</p><blockquote><p>«ἄφες τὴν ἁμαρτίαν τῷ λαῷ τούτῳ κατὰ τὸ μέγα ἔλεός σου, καθάπερ ἵλεως αὐτοῖς ἐγένου ἀπ᾿ Αἰγύπτου ἕως τοῦ νῦν. καὶ εἶπεν κύριος πρὸς Μωυσῆν <strong>Ἵλεως αὐτοῖς εἰμι κατὰ τὸ ῥῆμά σου</strong>·» (<a href="https://bibleox.com/el/gr-lxx-byz/chis/14/#L19-20">Αρ 14:19-20</a>)</p></blockquote><p>Άλλη όμως φορά ο Θεός δηλώνει ότι δεν θα συγχωρούσε ακόμη και με τον λόγο του Μωυσή:</p><blockquote><p>«Καὶ εἶπεν κύριος πρός με <strong>Ἐὰν στῇ Μωϋσῆς καὶ Σαμουηλ πρὸ προσώπου μου, οὐκ ἔστιν ἡ ψυχή μου πρὸς αὐτούς</strong>· ἐξαπόστειλον τὸν λαὸν τοῦτον, καὶ ἐξελθέτωσαν.» (<a href="https://bibleox.com/el/gr-lxx-byz/ier/15/#L1">Ιερ 15:1</a>)</p></blockquote><p>Ικέτευσε τον Θεό να αλλάξει την απόφαση</p><blockquote><p>«καὶ νῦν ἔασόν με καὶ <strong>θυμωθεὶς ὀργῇ εἰς αὐτοὺς ἐκτρίψω αὐτοὺς</strong> καὶ ποιήσω σὲ εἰς ἔθνος μέγα. καὶ <strong>ἐδεήθη Μωϋσῆς ἔναντι κυρίου τοῦ θεοῦ</strong> καὶ εἶπεν Ἵνα τί, κύριε, θυμοῖ ὀργῇ εἰς τὸν λαόν σου, οὓς ἐξήγαγες ἐκ γῆς Αἰγύπτου ἐν ἰσχύι μεγάλῃ καὶ ἐν τῷ βραχίονί σου τῷ ὑψηλῷ; μήποτε εἴπωσιν οἱ Αἰγύπτιοι λέγοντες Μετὰ πονηρίας ἐξήγαγεν αὐτοὺς ἀποκτεῖναι ἐν τοῖς ὄρεσιν καὶ ἐξαναλῶσαι αὐτοὺς ἀπὸ τῆς γῆς. παῦσαι τῆς ὀργῆς τοῦ θυμοῦ σου καὶ <strong>ἵλεως γενοῦ ἐπὶ τῇ κακίᾳ τοῦ λαοῦ σου</strong> μνησθεὶς Αβρααμ καὶ Ισαακ καὶ Ιακωβ τῶν σῶν οἰκετῶν, οἷς ὤμοσας κατὰ σεαυτοῦ καὶ ἐλάλησας πρὸς αὐτοὺς λέγων Πολυπληθυνῶ τὸ σπέρμα ὑμῶν ὡσεὶ τὰ ἄστρα τοῦ οὐρανοῦ τῷ πλήθει, καὶ πᾶσαν τὴν γῆν ταύτην, ἣν εἶπας δοῦναι τῷ σπέρματι αὐτῶν, καὶ καθέξουσιν αὐτὴν εἰς τὸν αἰῶνα. καὶ <strong>ἱλάσθη κύριος περὶ τῆς κακίας</strong>, ἧς εἶπεν ποιῆσαι τὸν λαὸν αὐτοῦ.» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/32/#L10-14">Έξ 32:10-14</a>)</p></blockquote><p>Έπειτα πήγε πάλι να μεσιτεύσει για τον λαό:</p><blockquote><p>«Καὶ ἐγένετο μετὰ τὴν αὔριον εἶπεν Μωϋσῆς πρὸς τὸν λαόν <strong>Ὑμεῖς ἡμαρτήκατε ἁμαρτίαν μεγάλην· καὶ νῦν ἀναβήσομαι πρὸς τὸν θεόν, ἵνα ἐξιλάσωμαι περὶ τῆς ἁμαρτίας ὑμῶν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/32/#L30">Έξ 32:30</a>)</p></blockquote><p>Και πάλι άλλαξε την απόφαση του Θεού</p><blockquote><p>«καὶ ἐλάλησεν κύριος πρὸς Μωυσῆν ἐνώπιος ἐνωπίῳ, ὡς εἴ τις λαλήσει πρὸς τὸν ἑαυτοῦ φίλον. καὶ ἀπελύετο εἰς τὴν παρεμβολήν, ὁ δὲ θεράπων Ἰησοῦς υἱὸς Ναυη νέος οὐκ ἐξεπορεύετο ἐκ τῆς σκηνῆς. Καὶ εἶπεν Μωϋσῆς πρὸς κύριον Ἰδοὺ σύ μοι λέγεις Ἀνάγαγε τὸν λαὸν τοῦτον· σὺ δὲ οὐκ ἐδήλωσάς μοι ὃν συναποστελεῖς μετ᾿ ἐμοῦ· σὺ δέ μοι εἶπας Οἶδά σε παρὰ πάντας, καὶ χάριν ἔχεις παρ᾿ ἐμοί. &lt;…&gt; καὶ <strong>λέγει πρὸς αὐτόν Εἰ μὴ αὐτὸς σὺ πορεύῃ</strong>, <strong>μή με ἀναγάγῃς ἐντεῦθεν</strong>· &lt;…&gt; καὶ εἶπεν κύριος πρὸς Μωυσῆν Καὶ τοῦτόν σοι τὸν λόγον, ὃν εἴρηκας, <strong>ποιήσω· εὕρηκας γὰρ χάριν ἐνώπιόν μου</strong>, καὶ οἶδά σε παρὰ πάντας.» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/33/#L11-12,15,17">Έξ 33:11-12,15,17</a>)</p></blockquote><h4>Ο άνθρωπος του Θεού</h4><blockquote><p>«καὶ εἶπεν ὁ βασιλεὺς Ιεροβοαμ τῷ ἀνθρώπῳ τοῦ θεοῦ <strong>Δεήθητι τοῦ προσώπου κυρίου τοῦ θεοῦ σου</strong>, καὶ ἐπιστρεψάτω ἡ χείρ μου πρός με. καὶ <strong>ἐδεήθη ὁ ἄνθρωπος τοῦ θεοῦ τοῦ προσώπου κυρίου</strong>, καὶ ἐπέστρεψεν τὴν χεῖρα τοῦ βασιλέως πρὸς αὐτόν, καὶ ἐγένετο καθὼς τὸ πρότερον.» (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/13/#L6">Γ Βασ 13:6</a>)</p></blockquote><h2>Η προσευχή του ιερατείου για τους άλλους ανθρώπους</h2><p>Με τις προσευχές των ιερέων για έναν άλλο άνθρωπο (έχουμε μεσιτεία) μπορούν να συγχωρηθούν αμαρτίες:</p><blockquote><p>«<strong>ἀσθενεῖ τις ἐν ὑμῖν; προσκαλεσάσθω τοὺς πρεσβυτέρους τῆς ἐκκλησίας</strong>, καὶ <strong>προσευξάσθωσαν ἐπ᾿ αὐτὸν</strong> ἀλείψαντες ἐλαίῳ ἐν τῷ ὀνόματι [τοῦ] κυρίου· καὶ ἡ εὐχὴ τῆς πίστεως σώσει τὸν κάμνοντα, καὶ ἐγερεῖ αὐτὸν ὁ κύριος· <strong>κἂν ἁμαρτίας ᾖ πεποιηκώς, ἀφεθήσεται αὐτῷ</strong>. ἐξομολογεῖσθε οὖν ἀλλήλοις τὰς ἁμαρτίας καὶ εὔχεσθε ὑπὲρ ἀλλήλων, ὅπως ἰαθῆτε. πολὺ ἰσχύει δέησις δικαίου ἐνεργουμένη.» (<a href="https://bibleox.com/el/gr-lxx-byz/iak/5/#L14-16">Ιακ 5:14-16</a>)</p></blockquote><h2>Η αμοιβαία προσευχή των μελών της Εκκλησίας</h2><p>Αρκεί η προσωπική προσευχή προς τον Θεό;</p><h3>Οι απόστολοι έχουν ανάγκη από προσευχές υπέρ αυτών</h3><blockquote><p>«<strong>προσευχόμενοι ἅμα καὶ περὶ ἡμῶν</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/kol/4/#L3">Κολ 4:3</a>)</p></blockquote><blockquote><p>«Ἀδελφοί, <strong>προσεύχεσθε καὶ περὶ ἡμῶν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1sol/5/#L25">Α Θεσ 5:25</a>)</p></blockquote><blockquote><p>«Τὸ λοιπὸν <strong>προσεύχεσθε, ἀδελφοί, περὶ ἡμῶν</strong>, ἵνα ὁ λόγος τοῦ κυρίου τρέχῃ καὶ δοξάζηται καθὼς καὶ πρὸς ὑμᾶς,» (<a href="https://bibleox.com/el/gr-lxx-byz/2sol/3/#L1">Β Θεσ 3:1</a>)</p></blockquote><blockquote><p>«<strong>Προσεύχεσθε περὶ ἡμῶν</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/13/#L18">Εβρ 13:18</a>)</p></blockquote><blockquote><p>«Παρακαλῶ δὲ ὑμᾶσ[, ἀδελφοί,] διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ καὶ διὰ τῆς ἀγάπης τοῦ πνεύματος, συναγωνίσασθαί μοι <strong>ἐν ταῖς προσευχαῖς ὑπὲρ ἐμοῦ</strong> πρὸς τὸν θεόν,» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/15/#L30">Ρωμ 15:30</a>)</p></blockquote><blockquote><p>«καὶ ἔτι ῥύσεται, <strong>συνυπουργούντων καὶ ὑμῶν ὑπὲρ ἡμῶν τῇ δεήσει</strong>, ἵνα ἐκ πολλῶν προσώπων τὸ εἰς ἡμᾶς χάρισμα <strong>διὰ πολλῶν</strong> εὐχαριστηθῇ ὑπὲρ ἡμῶν.» (<a href="https://bibleox.com/el/gr-lxx-byz/2kor/1/#L10-11">Β Κορ 1:10-11</a>)</p></blockquote><blockquote><p>«οἶδα γὰρ ὅτι <strong>τοῦτό μοι ἀποβήσεται εἰς σωτηρίαν διὰ τῆς ὑμῶν δεήσεως</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/fil/1/#L19">Φιλ 1:19</a>)</p></blockquote><blockquote><p>«ἐλπίζω γὰρ ὅτι <strong>διὰ τῶν προσευχῶν ὑμῶν</strong> χαρισθήσομαι ὑμῖν.» (<a href="https://bibleox.com/el/gr-lxx-byz/fm/1/#L22">Φλμ 1:22</a>)</p></blockquote><h3>Οι απόστολοι προσεύχονται συνεχώς για τους χριστιανούς</h3><blockquote><p>«οὐ παύομαι εὐχαριστῶν ὑπὲρ ὑμῶν <strong>μνείαν ποιούμενος</strong> <strong>ἐπὶ τῶν προσευχῶν μου</strong>,» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/1/#L16">Εφ 1:16</a>)</p></blockquote><blockquote><p>«πάντοτε <strong>ἐν πάσῃ δεήσει μου ὑπὲρ πάντων ὑμῶν</strong> μετὰ χαρᾶς τὴν δέησιν ποιούμενος,» (<a href="https://bibleox.com/el/gr-lxx-byz/fil/1/#L4">Φιλ 1:4</a>)</p></blockquote><blockquote><p>«Εὐχαριστοῦμεν τῷ θεῷ πάντοτε περὶ πάντων ὑμῶν, <strong>μνείαν ποιούμενοι ἐπὶ τῶν προσευχῶν ἡμῶν</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/1sol/1/#L2">Α Θεσ 1:2</a>)</p></blockquote><blockquote><p>«ἀσπάζεται ὑμᾶς Ἐπαφρᾶς ὁ ἐξ ὑμῶν, δοῦλος Χριστοῦ [Ἰησοῦ], πάντοτε <strong>ἀγωνιζόμενος ὑπὲρ ὑμῶν ἐν ταῖς προσευχαῖς</strong>, ἵνα σταθῆτε τέλειοι καὶ πεπληροφορημένοι ἐν παντὶ θελήματι τοῦ θεοῦ.» (<a href="https://bibleox.com/el/gr-lxx-byz/kol/4/#L12">Κολ 4:12</a>)</p></blockquote><blockquote><p>«Χάριν ἔχω τῷ θεῷ, ᾧ λατρεύω ἀπὸ προγόνων ἐν καθαρᾷ συνειδήσει, ὡς <strong>ἀδιάλειπτον ἔχω τὴν περὶ σοῦ μνείαν ἐν ταῖς δεήσεσίν</strong> μου νυκτὸς καὶ ἡμέρας,» (<a href="https://bibleox.com/el/gr-lxx-byz/2tim/1/#L3">Β Τιμ 1:3</a>)</p></blockquote><blockquote><p>«Εὐχαριστῶ τῷ θεῷ μου <strong>πάντοτε μνείαν σου ποιούμενος ἐπὶ τῶν προσευχῶν</strong> μου,» (<a href="https://bibleox.com/el/gr-lxx-byz/fm/1/#L4">Φλμ 1:4</a>)</p></blockquote><h3>Οι απόστολοι καλούσαν τους χριστιανούς να προσεύχονται ο ένας για τον άλλο</h3><blockquote><p>«<strong>εὔχεσθε ὑπὲρ ἀλλήλων</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/iak/5/#L16">Ιακ 5:16</a>)</p></blockquote><blockquote><p>«διὰ πάσης προσευχῆς καὶ δεήσεως προσευχόμενοι ἐν παντὶ καιρῷ ἐν πνεύματι, καὶ εἰς αὐτὸ ἀγρυπνοῦντες ἐν πάσῃ προσκαρτερήσει καὶ <strong>δεήσει περὶ πάντων τῶν ἁγίων</strong>,» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/6/#L18">Εφ 6:18</a>)</p></blockquote><blockquote><p>«<strong>Παρακαλῶ οὖν πρῶτον πάντων ποιεῖσθαι δεήσεις, προσευχάς</strong>, ἐντεύξεις, εὐχαριστίας, <strong>ὑπὲρ πάντων ἀνθρώπων</strong>,» (<a href="https://bibleox.com/el/gr-lxx-byz/1tim/2/#L1">Α Τιμ 2:1</a>)</p></blockquote><h2>Όλη η Εκκλησία — ένα και ενιαίο σώμα του Χριστού, που κοινωνεί και φροντίζει</h2><h3>Η Εκκλησία είναι το Σώμα του Χριστού</h3><blockquote><p><em>«</em><strong><em>Ὑμεῖς δέ ἐστε σῶμα Χριστοῦ</em></strong><em> καὶ μέλη ἐκ μέρους.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/1kor/12/#L27"><em>Α Κορ 12:27</em></a><em>)</em></p></blockquote><blockquote><p><em>«οὐκ οἴδατε ὅτι </em><strong><em>τὰ σώματα ὑμῶν μέλη Χριστοῦ ἐστιν</em></strong><em>» (</em><a href="https://bibleox.com/el/gr-lxx-byz/1kor/6/#L15"><em>Α Κορ 6:15</em></a><em>)</em></p></blockquote><h3>Τα μέλη της Εκκλησίας γίνονται μέτοχοι του Θεού</h3><blockquote><p>«Ὡς πάντα ἡμῖν τῆς θείας δυνάμεως αὐτοῦ τὰ πρὸς ζωὴν καὶ εὐσέβειαν δεδωρημένης διὰ τῆς ἐπιγνώσεως τοῦ καλέσαντος ἡμᾶς ἰδίᾳ δόξῃ καὶ ἀρετῇ, δι᾿ ὧν τὰ τίμια καὶ μέγιστα ἡμῖν ἐπαγγέλματα δεδώρηται, <strong>ἵνα διὰ τούτων γένησθε θείας κοινωνοὶ φύσεως</strong>, ἀποφυγόντες τῆς ἐν τῷ κόσμῳ ἐν ἐπιθυμίᾳ φθορᾶς.» (<a href="https://bibleox.com/el/gr-lxx-byz/2pet/1/#L3-4">Β Πε 1:3-4</a>)</p></blockquote><h3>Όλα τα μέλη του σώματος φροντίζουν το ένα για το άλλο</h3><blockquote><p>«ἵνα μὴ ᾖ σχίσμα ἐν τῷ σώματι, ἀλλὰ τὸ αὐτὸ ὑπὲρ ἀλλήλων μεριμνῶσιν τὰ μέλη. καὶ <strong>εἴτε πάσχει ἓν μέλος</strong>, <strong>συμπάσχει</strong> <strong>πάντα τὰ μέλη</strong>· <strong>εἴτε δοξάζεται ἓν μέλος</strong>, <strong>συγχαίρει πάντα τὰ μέλη</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/12/#L25-26">Α Κορ 12:25-26</a>)</p></blockquote><h3>Οι απόστολοι προσεύχονται πάντοτε για την Εκκλησία</h3><blockquote><p>«Διὰ τοῦτο καὶ ἡμεῖς, ἀφ᾿ ἧς ἡμέρας ἠκούσαμεν, <strong><u>οὐ παυόμεθα</u> ὑπὲρ ὑμῶν προσευχόμενοι καὶ αἰτούμενοι</strong> ἵνα πληρωθῆτε τὴν ἐπίγνωσιν τοῦ θελήματος αὐτοῦ ἐν πάσῃ σοφίᾳ καὶ συνέσει πνευματικῇ,» (<a href="https://bibleox.com/el/gr-lxx-byz/kol/1/#L9">Κολ 1:9</a>)</p></blockquote><h2>Η ενότητα της επίγειας και της ουράνιας Εκκλησίας</h2><h3>Έχουμε ήδη πλησιάσει στην ουράνια Εκκλησία</h3><p>Ήδη τώρα, και όχι στο μέλλον, μετά την ανάσταση:</p><blockquote><p>«ἀλλὰ <strong>προσεληλύθατε</strong> Σιὼν ὄρει καὶ πόλει θεοῦ ζῶντος, Ἰερουσαλὴμ ἐπουρανίῳ, καὶ μυριάσιν ἀγγέλων, πανηγύρει καὶ ἐκκλησίᾳ πρωτοτόκων ἀπογεγραμμένων ἐν οὐρανοῖς, καὶ κριτῇ θεῷ πάντων, καὶ <strong>πνεύμασι δικαίων τετελειωμένων</strong>, καὶ διαθήκης νέας μεσίτῃ Ἰησοῦ, καὶ αἵματι ῥαντισμοῦ κρεῖττον λαλοῦντι παρὰ τὸν Ἅβελ.» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/12/#L22-24">Εβρ 12:22-24</a>)</p></blockquote><h3>Δεν υπάρχει διαίρεση· όλα φροντίζουν και συμπάσχουν το ένα με το άλλο</h3><blockquote><p>«νῦν δὲ πολλὰ μὲν μέλη, ἓν δὲ σῶμα. &lt;…&gt; τὰ δὲ εὐσχήμονα ἡμῶν οὐ χρείαν ἔχει. ἀλλὰ ὁ θεὸς συνεκέρασεν τὸ σῶμα, τῷ ὑστερουμένῳ περισσοτέραν δοὺς τιμήν, <strong>ἵνα μὴ ᾖ σχίσμα ἐν τῷ σώματι, ἀλλὰ τὸ αὐτὸ ὑπὲρ ἀλλήλων μεριμνῶσιν τὰ μέλη</strong>. καὶ εἴτε πάσχει ἓν μέλος, συμπάσχει <strong>πάντα τὰ μέλη</strong>· εἴτε δοξάζεται ἓν μέλος, συγχαίρει <strong>πάντα τὰ μέλη</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/12/#L20,24-26">Α Κορ 12:20,24-26</a>)</p></blockquote><blockquote><p>«λέγω ὑμῖν ὅτι οὕτως <strong>χαρὰ ἐν τῷ οὐρανῷ ἔσται ἐπὶ ἑνὶ ἁμαρτωλῷ μετανοοῦντι</strong> ἢ ἐπὶ ἐνενήκοντα ἐννέα δικαίοις οἵτινες οὐ χρείαν ἔχουσιν μετανοίας. &lt;…&gt; οὕτως, λέγω ὑμῖν, <strong>γίνεται χαρὰ ἐνώπιον τῶν ἀγγέλων τοῦ θεοῦ ἐπὶ ἑνὶ ἁμαρτωλῷ μετανοοῦντι</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/15/#L7,10">Λκ 15:7,10</a>)</p></blockquote><h3>Τα επουράνια και τα επίγεια ενώνονται στον Χριστό</h3><blockquote><p><em>«Εὐλογητὸς ὁ θεὸς καὶ πατὴρ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὁ εὐλογήσας ἡμᾶς ἐν πάσῃ εὐλογίᾳ πνευματικῇ ἐν τοῖς ἐπουρανίοις ἐν Χριστῷ, &lt;…&gt; γνωρίσας ἡμῖν τὸ μυστήριον τοῦ θελήματος αὐτοῦ, κατὰ τὴν εὐδοκίαν αὐτοῦ ἣν προέθετο ἐν αὐτῷ </em><strong><em>εἰς οἰκονομίαν τοῦ πληρώματος τῶν καιρῶν</em></strong><em>, </em><strong><em>ἀνακεφαλαιώσασθαι τὰ πάντα ἐν τῷ Χριστῷ, <u>τὰ ἐπὶ τοῖς οὐρανοῖς καὶ τὰ ἐπὶ τῆς γῆς</u></em></strong><em>» (</em><a href="https://bibleox.com/el/gr-lxx-byz/ef/1/#L3,9-10"><em>Εφ 1:3,9-10</em></a><em>)</em></p></blockquote><blockquote><p><em>«Τούτου χάριν κάμπτω τὰ γόνατά μου πρὸς τὸν πατέρα, ἐξ οὗ πᾶσα </em><strong><em>πατριὰ</em></strong><em> </em><strong><em>ἐν οὐρανοῖς καὶ ἐπὶ γῆς</em></strong><em> ὀνομάζεται,» (</em><a href="https://bibleox.com/el/gr-lxx-byz/ef/3/#L14-15"><em>Εφ 3:14-15</em></a><em>)</em></p></blockquote><blockquote><p><em>«καὶ αὐτός ἐστιν ἡ κεφαλὴ τοῦ σώματος, τῆς ἐκκλησίας· ὅς ἐστιν ἀρχή, πρωτότοκος ἐκ τῶν νεκρῶν, ἵνα γένηται ἐν πᾶσιν αὐτὸς πρωτεύων, ὅτι </em><strong><em>ἐν αὐτῷ εὐδόκησεν πᾶν τὸ πλήρωμα κατοικῆσαι καὶ δι᾿ αὐτοῦ ἀποκαταλλάξαι τὰ πάντα εἰς αὐτόν</em></strong><em>, εἰρηνοποιήσας διὰ τοῦ αἵματος τοῦ σταυροῦ αὐτοῦ, [δι᾿ αὐτοῦ] εἴτε </em><strong><em>τὰ ἐπὶ τῆς γῆς εἴτε τὰ ἐν τοῖς οὐρανοῖς</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/kol/1/#L18-20"><em>Κολ 1:18-20</em></a><em>)</em></p></blockquote><blockquote><p><em>«εἰς τοῦτο γὰρ </em><strong><em>Χριστὸς</em></strong><em> ἀπέθανεν καὶ ἔζησεν ἵνα καὶ </em><strong><em>νεκρῶν καὶ ζώντων κυριεύσῃ</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/rim/14/#L9"><em>Ρωμ 14:9</em></a><em>)</em></p></blockquote><p>Βλ. επίσης: <a href="https://bibleox.com/el/el/w/%CE%97_%CE%95%CE%BA%CE%BA%CE%BB%CE%B7%CF%83%CE%AF%CE%B1#HH-Η-ενότητα-της-επίγειας-και-της-ουράνιας-Εκκλησίας-ένα-Σώμα-Χριστού">Η ενότητα της επίγειας και της ουράνιας Εκκλησίας</a></p><h2>Οι άγιοι προσεύχονται στον ουρανό προς τον Θεό</h2><h3>Οι προσευχές των αγίων είναι ευάρεστες στον Θεό</h3><blockquote><p>«καὶ ὅτε ἔλαβεν τὸ βιβλίον, τὰ τέσσαρα ζῷα καὶ οἱ εἴκοσι τέσσαρες πρεσβύτεροι ἔπεσαν ἐνώπιον τοῦ ἀρνίου, ἔχοντες ἕκαστος κιθάραν καὶ <strong>φιάλας χρυσᾶς γεμούσας θυμιαμάτων, αἵ εἰσιν αἱ προσευχαὶ τῶν ἁγίων</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/5/#L8">Απ 5:8</a>)</p></blockquote><blockquote><p>«Καὶ ἄλλος ἄγγελος ἦλθεν καὶ ἐστάθη ἐπὶ τοῦ θυσιαστηρίου ἔχων λιβανωτὸν χρυσοῦν, καὶ ἐδόθη αὐτῷ θυμιάματα πολλὰ ἵνα δώσει <strong>ταῖς προσευχαῖς τῶν ἁγίων πάντων</strong> ἐπὶ τὸ θυσιαστήριον τὸ χρυσοῦν τὸ ἐνώπιον τοῦ θρόνου.» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/8/#L3">Απ 8:3</a>)</p></blockquote><blockquote><p>«Μετὰ ταῦτα ἤκουσα ὡς <strong>φωνὴν μεγάλην ὄχλου πολλοῦ ἐν τῷ οὐρανῷ λεγόντων, Ἁλληλουϊά· ἡ σωτηρία καὶ ἡ δόξα καὶ ἡ δύναμις τοῦ θεοῦ ἡμῶν</strong>,» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/19/#L1">Απ 19:1</a>)</p></blockquote><p>Γνωρίζουν όσα γίνονται στη γη:</p><blockquote><p>«Καὶ ὅτε ἤνοιξεν τὴν πέμπτην σφραγῖδα, εἶδον ὑποκάτω τοῦ θυσιαστηρίου <strong>τὰς ψυχὰς τῶν ἐσφαγμένων διὰ τὸν λόγον τοῦ θεοῦ καὶ διὰ τὴν μαρτυρίαν</strong> ἣν εἶχον. καὶ ἔκραξαν φωνῇ μεγάλῃ λέγοντες, <strong>Ἕως πότε, ὁ δεσπότης ὁ ἅγιος καὶ ἀληθινός, οὐ κρίνεις καὶ ἐκδικεῖς τὸ αἷμα ἡμῶν ἐκ τῶν κατοικούντων ἐπὶ τῆς γῆς</strong>; καὶ ἐδόθη αὐτοῖς ἑκάστῳ στολὴ λευκή, καὶ ἐρρέθη αὐτοῖς ἵνα ἀναπαύσονται ἔτι χρόνον μικρόν, ἕως πληρωθῶσιν καὶ οἱ σύνδουλοι αὐτῶν καὶ οἱ ἀδελφοὶ αὐτῶν οἱ μέλλοντες ἀποκτέννεσθαι ὡς καὶ αὐτοί.» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/6/#L9-11">Απ 6:9-11</a>)</p></blockquote><h3>Οι άγιοι μεταβαίνουν σε καλύτερη κατάσταση, όχι σε χειρότερη</h3><blockquote><p>«συνέχομαι δὲ ἐκ τῶν δύο, <strong>τὴν ἐπιθυμίαν ἔχων εἰς τὸ ἀναλῦσαι καὶ σὺν Χριστῷ εἶναι, <mark>πολλῷ [γὰρ] μᾶλλον κρεῖσσον</mark></strong>· τὸ δὲ ἐπιμένειν [ἐν] τῇ σαρκὶ ἀναγκαιότερον δι᾿ ὑμᾶς.» (<a href="https://bibleox.com/el/gr-lxx-byz/fil/1/#L23-24">Φιλ 1:23-24</a>)</p></blockquote><h3>Οι άγιοι, μετά τον χωρισμό από το σώμα, δεν χάνουν τη δυνατότητα να κοινωνούν</h3><p>Στη Μεταμόρφωση του Σωτήρα στο όρος Θαβώρ, οι απόστολοι βλέπουν τη φανέρωση του ήδη κεκοιμημένου προφήτη Μωυσή, που συνομιλεί με τον Χριστό για τα σταυρικά πάθη που Τον περιμένουν. Δηλαδή ο προφήτης, αν και πέθανε (<a href="https://bibleox.com/el/gr-lxx-byz/vtor/34/#L7">Δτ 34:7</a> · <a href="https://bibleox.com/el/gr-lxx-byz/nav/1/#L2">Ιησ 1:2</a>), δεν εξαφανίστηκε και δεν έχασε τη συνείδηση: αυτός <strong>κοινωνεί</strong> με τον Χριστό:</p><blockquote><p><em>«καὶ ἰδοὺ </em><strong><em>ὤφθη αὐτοῖς Μωϋσῆς καὶ Ἠλίας συλλαλοῦντες μετ᾿ αὐτοῦ</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/mf/17/#L3"><em>Μτ 17:3</em></a><em>)</em></p></blockquote><blockquote><p><em>«καὶ ἐγένετο ἐν τῷ προσεύχεσθαι αὐτὸν τὸ εἶδος τοῦ προσώπου αὐτοῦ ἕτερον καὶ ὁ ἱματισμὸς αὐτοῦ λευκὸς ἐξαστράπτων. καὶ ἰδοὺ </em><strong><em>ἄνδρες δύο συνελάλουν αὐτῷ, οἵτινες ἦσαν Μωϋσῆς καὶ Ἠλίας</em></strong><em>, οἳ ὀφθέντες ἐν δόξῃ </em><strong><em>ἔλεγον</em></strong><em> τὴν ἔξοδον αὐτοῦ ἣν ἤμελλεν πληροῦν ἐν Ἰερουσαλήμ.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/lk/9/#L29-31"><em>Λκ 9:29-31</em></a><em>)</em></p></blockquote><h3>Η αγάπη πάντοτε παρακινεί να φροντίζουμε για τους άλλους</h3><blockquote><p>«<strong><mark>Ἡ ἀγάπη οὐδέποτε πίπτει</mark></strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/13/#L8">Α Κορ 13:8</a>)</p></blockquote><h2>Κριτική</h2><h3>Ένας μεσίτης</h3><h4>Σύντομη απάντηση</h4><p>Οι Ορθόδοξοι κατηγορούνται για τις προσευχές στους αγίους, λέγοντας ότι μόνο ο Χριστός είναι μεσίτης. Η απάντηση είναι ότι ο Χριστός είναι ο μόνος μεσίτης που λύτρωσε τους ανθρώπους, όπως λέγεται στη συνέχεια του χωρίου:</p><blockquote><p>«εἷς γὰρ θεός, <strong><mark>εἷς καὶ μεσίτης</mark> θεοῦ καὶ ἀνθρώπων, ἄνθρωπος Χριστὸς Ἰησοῦς</strong>, <strong><mark>ὁ δοὺς ἑαυτὸν ἀντίλυτρον ὑπὲρ πάντων</mark></strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/1tim/2/#L5-6">Α Τιμ 2:5-6</a>)</p></blockquote><p>Οι άγιοι δεν είναι λυτρωτές, αλλά συμπροσευχόμενοι (<a href="https://bibleox.com/el/gr-lxx-byz/iak/5/#L16">Ιακ 5:16</a>). Όλο το ζήτημα βρίσκεται στη σημασία των λέξεων. Οι αντίπαλοί μας (κατά κανόνα προτεστάντες) προσεύχονται για τις ανάγκες ο ένας του άλλου. Αν είναι μεσίτες ο ένας για τον άλλο, τότε και οι άγιοι είναι μεσίτες μας. Αν είναι συμπροσευχόμενοι ο ένας για τον άλλο, τότε και οι άγιοι είναι συμπροσευχόμενοί μας, γιατί απλώς τους ζητάμε να προσευχηθούν για μας, να ενωθούν με την προσευχή μας προς τον Θεό. Δεν τους θεωρούμε θεούς και δεν προσευχόμαστε σε αυτούς ως θεούς. Ακριβώς έτσι, όταν οι προτεστάντες ζητούν να προσευχηθούν γι’ αυτούς, δεν θεωρούν τους συντρόφους τους θεούς.</p><p>Μπορούν να υπάρχουν μεσίτες στην προσευχή; — Είναι φανερό από τη Γραφή ότι μπορούν. Για παράδειγμα, με την προσευχή των πρεσβυτέρων της Εκκλησίας μπορούν να συγχωρηθούν οι αμαρτίες ενός άλλου ανθρώπου.</p><blockquote><p><em>«ἀσθενεῖ τις ἐν ὑμῖν; </em><strong><em><mark>προσκαλεσάσθω τοὺς πρεσβυτέρους τῆς ἐκκλησίας</mark></em></strong><em>, καὶ </em><strong><em><mark>προσευξάσθωσαν ἐπ᾿ αὐτὸν</mark></em></strong><em> ἀλείψαντες ἐλαίῳ ἐν τῷ ὀνόματι [τοῦ] κυρίου· καὶ ἡ εὐχὴ τῆς πίστεως</em><strong><em> </em></strong><em>σώσει τὸν κάμνοντα, καὶ </em><strong><em>ἐγερεῖ αὐτὸν ὁ κύριος·</em></strong><em> </em><strong><em><mark>κἂν ἁμαρτίας ᾖ πεποιηκώς, ἀφεθήσεται αὐτῷ.</mark></em></strong><em>» (</em><a href="https://bibleox.com/el/gr-lxx-byz/iak/5/#L14-15"><em>Ιακ 5:14-15</em></a><em>)</em></p></blockquote><p>Αναμφισβήτητη μεσιτεία. Έτσι, η κατανόηση των λόγων για τον Χριστό ως τον μόνο μεσίτη (<a href="https://bibleox.com/el/gr-lxx-byz/1tim/2/#L5-6">Α Τιμ 2:5-6</a>) που προτείνεται από τους αντιπάλους των προσευχών στους αγίους είναι λανθασμένη. Το χωρίο που παρατίθεται δεν μιλά κατά των μεσιτών στην προσευχή.</p><h4>Περισσότερα για τη λέξη «μεσίτης»</h4><p>Υπάρχουν επίσης ιδιαιτερότητες στη σημασία της λέξης. Η λέξη «μεσίτης» δεν σημαίνει μόνο «μεσολαβητής»· μπορεί να αποδοθεί και ως «ειρηνοποιός», πρόσωπο που συμβάλλει στη συμφιλίωση των μερών. Δηλαδή, με άλλα λόγια, ο Χριστός είναι ο μόνος <strong>συμφιλιωτής</strong> (ειρηνοποιός) μεταξύ Θεού και ανθρώπων. Πιο φανερά αυτό λέγεται σε άλλα χωρία των αποστόλων:</p><blockquote><p>«τὰ δὲ πάντα <strong>ἐκ τοῦ θεοῦ τοῦ <mark>καταλλάξαντος</mark> ἡμᾶς ἑαυτῷ διὰ Χριστοῦ</strong> καὶ δόντος ἡμῖν τὴν <strong>διακονίαν τῆς καταλλαγῆς</strong>, ὡς ὅτι <strong><mark>θεὸς ἦν ἐν Χριστῷ κόσμον καταλλάσσων ἑαυτῷ</mark></strong>, μὴ λογιζόμενος αὐτοῖς τὰ παραπτώματα αὐτῶν, καὶ <strong>θέμενος ἐν ἡμῖν τὸν λόγον τῆς καταλλαγῆς</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/2kor/5/#L18-19">Β Κορ 5:18-19</a>)</p></blockquote><blockquote><p>«Τεκνία μου, ταῦτα γράφω ὑμῖν ἵνα μὴ ἁμάρτητε. καὶ <strong><mark>ἐάν τις ἁμάρτῃ</mark>, <mark>παράκλητον ἔχομεν</mark> πρὸς τὸν πατέρα, Ἰησοῦν Χριστὸν</strong> δίκαιον· καὶ <strong><mark>αὐτὸς ἱλασμός ἐστιν περὶ τῶν ἁμαρτιῶν ἡμῶν</mark></strong>, οὐ περὶ τῶν ἡμετέρων δὲ μόνον ἀλλὰ καὶ περὶ ὅλου τοῦ κόσμου. &lt;…&gt; Γράφω ὑμῖν, τεκνία, ὅτι <strong><mark>ἀφέωνται ὑμῖν αἱ ἁμαρτίαι διὰ τὸ ὄνομα αὐτοῦ</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1in/2/#L1-2,12">Α Ιω 2:1-2,12</a>)</p></blockquote><p>Η απόδοση της λέξης «μεσίτης» ως <strong>συμφιλιωτής</strong> ή ειρηνοποιός συμφωνεί και με την κατάληξη της φράσης, όπως ήδη αναφέρθηκε: «<em>ο δούς εαυτόν αντίλυτρον υπέρ πάντων</em>» (<a href="https://bibleox.com/el/gr-lxx-byz/1tim/2/#L5-6">Α Τιμ 2:5-6</a>). Ένας τέτοιος ειρηνοποιός, που με την προσφορά του εαυτού του ως θυσίας λύτρωσε την αμαρτία της ανθρωπότητας ενώπιον του Θεού. Έτσι, αυτό το χωρίο δεν μιλά κατά των προσευχών στους αγίους, αλλά μιλά για τον Χριστό ως <strong>συμφιλιωτή</strong> της ανθρωπότητας με τον Θεό. Ο Χριστός είναι επίσης <strong>συμφιλιωτής</strong> των ανθρώπων μεταξύ τους (<a href="https://bibleox.com/el/gr-lxx-byz/ef/2/#L14">Εφ 2:14</a>).</p><h3>Για τις εκφράσεις «σώσον ημάς»</h3><p>Οι Ορθόδοξοι κατηγορούνται ότι επιτρέπουν στις προσευχές στους αγίους εκφράσεις όπως «σώσον ημάς». Εδώ πάλι το ζήτημα βρίσκεται στη σημασία των λέξεων. Τη σωτηρία την πραγματοποίησε μια φορά ο Χριστός. Άλλος σωτήρας με αυτή την έννοια δεν υπάρχει. Αλλά στη σωτηρία ενός συγκεκριμένου ανθρώπου μπορούν να συμβάλουν πολλοί. Και τέτοιες εκφράσεις επιτρέπονται συχνά στη Γραφή:</p><h4>Ο απόστολος σώζει</h4><blockquote><p><em>«εἴ πως παραζηλώσω μου τὴν σάρκα καὶ </em><strong><em><mark>σώσω</mark> τινὰς ἐξ αὐτῶν</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/rim/11/#L14"><em>Ρωμ 11:14</em></a><em>)</em></p></blockquote><blockquote><p><em>«τοῖς πᾶσιν </em><strong><em>γέγονα πάντα, ἵνα πάντως τινὰς <mark>σώσω</mark></em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/1kor/9/#L22"><em>Α Κορ 9:22</em></a><em>)</em></p></blockquote><h4>Η γυναίκα σώζει</h4><blockquote><p><em>«τί γὰρ οἶδας, </em><strong><em>γύναι, εἰ τὸν ἄνδρα <mark>σώσεις</mark></em></strong><em>; ἢ τί οἶδας, </em><strong><em>ἄνερ</em></strong><em>, εἰ </em><strong><em>τὴν γυναῖκα <mark>σώσεις</mark></em></strong><em>;» (</em><a href="https://bibleox.com/el/gr-lxx-byz/1kor/7/#L16"><em>Α Κορ 7:16</em></a><em>)</em></p></blockquote><h4>Το αποστολικό κάλεσμα να σώζουμε άλλους ανθρώπους</h4><blockquote><p><em>«καὶ οὓς μὲν ἐλεᾶτε διακρινομένους, οὓς δὲ </em><strong><em><mark>σῴζετε</mark></em></strong><em> ἐκ πυρὸς ἁρπάζοντες, οὓς δὲ ἐλεᾶτε ἐν φόβῳ, μισοῦντες καὶ τὸν ἀπὸ τῆς σαρκὸς ἐσπιλωμένον χιτῶνα.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/iud/1/#L22-23">Ιούδα 1:22-23</a><em>)</em></p></blockquote><blockquote><p>«ἔπεχε σεαυτῷ καὶ τῇ διδασκαλίᾳ· ἐπίμενε αὐτοῖς· τοῦτο γὰρ ποιῶν καὶ σεαυτὸν <strong><mark>σώσεις</mark></strong> καὶ <strong>τοὺς ἀκούοντάς σου</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1tim/4/#L16">Α Τιμ 4:16</a>)</p></blockquote><h4>Μπορεί άλλος εκτός από τον Χριστό να σώζει;</h4><p>Ούτε ο απόστολος ούτε οι γυναίκες με τους άνδρες τους είναι σωτήρες με την έννοια που είναι σωτήρας ο Κύριος Ιησούς Χριστός — ο μόνος λυτρωτής και ελευθερωτής της ανθρωπότητας από τον θάνατο και τον άδη, που χαρίζει ανάσταση και αιώνια ζωή με τον Θεό. Ωστόσο εκφράσεις όπως «εγώ θα σώσω», όπως φαίνεται, επιτρέπονται από τους αποστόλους. Το νόημα τέτοιων εκφράσεων το κατανοούμε σωστά — οι άνθρωποι μπορούν να συμβάλουν στη σωτηρία:</p><blockquote><p>«<em>θεοῦ γάρ ἐσμεν </em><strong><em>συνεργοί</em></strong><em>·</em>» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/3/#L9">Α Κορ 3:9</a>)</p></blockquote><h3>Για τις εκφράσεις «ελέησον»</h3><p>Εδώ συμβαίνει το ίδιο όπως με τη λέξη «σώσον» (βλ. παραπάνω). Τέτοιες λέξεις απευθύνονται όχι μόνο στους αγίους, αλλά και σε συνηθισμένους ανθρώπους. Το «ελέησον» σημαίνει «δείξε έλεος». Για παράδειγμα, ο δίκαιος Ιώβ λέει στους φίλους του:</p><blockquote><p>«<strong>ἐλεήσατέ με, ἐλεήσατέ με, ὦ φίλοι</strong>· χεὶρ γὰρ κυρίου ἡ ἁψαμένη μού ἐστιν.» (<a href="https://bibleox.com/el/gr-lxx-byz/iov/19/#L21">Ιωβ 19:21</a>)</p></blockquote><h3>Πώς μπορούν οι άγιοι να ακούν προσευχές από όλο τον κόσμο;</h3><p>Οι αντίπαλοι των προσευχών στους αγίους λένε: «<em>Ο Θεός είναι πανταχού παρών και παντοδύναμος, αλλά αν οι άγιοι δεν έχουν τέτοιες ιδιότητες, πώς μπορούν να ακούν τις προσευχές μεγάλου αριθμού ανθρώπων σε διάφορα μέρη του πλανήτη;</em>»</p><h4>Οι άγιοι προφήτευαν και έκαναν θαύματα όχι με τη δική τους δύναμη, αλλά με τη θεϊκή</h4><p>Οι άγιοι δεν εξετάζονται χωριστά, χωρίς τον Θεό. Σε αυτούς, και όταν ζούσαν σωματικά στη γη, κατοικούσε η θεϊκή δύναμη, και πολύ περισσότερο δεν στερούνται αυτής μετά τη μετάβασή τους στον ουρανό, στη ζωή με τον Χριστό. Έτσι, ο προφήτης Άγαβος, αν και δεν ήταν παντογνώστης, ανήγγειλε τον επερχόμενο μεγάλο λιμό για όλη την οικουμένη (<a href="https://bibleox.com/el/gr-lxx-byz/act/11/#L28">Πραξ 11:28</a>). Ο απόστολος Πέτρος δεν ήταν παντοδύναμος, αλλά ανέστησε την Ταβιθά (<a href="https://bibleox.com/el/gr-lxx-byz/act/9/#L40">Πραξ 9:40</a>). Δεν το έκαναν με τη δική τους δύναμη, αλλά με τη θεϊκή.</p><p>Οι άγιοι, κατά τον λόγο του αποστόλου, μεταβαίνουν όχι σε χειρότερη, αλλά σε ασύγκριτα καλύτερη κατάσταση (<a href="https://bibleox.com/el/gr-lxx-byz/fil/1/#L23-24">Φιλ 1:23-24</a>): δεν χάνουν, αλλά κερδίζουν (<a href="https://bibleox.com/el/gr-lxx-byz/fil/1/#L21">Φιλ 1:21</a>). Ενώνονται με τον Θεό, βρίσκονται στο φως και τη χάρη Του. Δεν μπορεί κανείς να συγκρίνει την ύπαρξή τους με τη δική μας. Γνωρίζουν όσα γίνονται στη γη (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/6/#L10">Απ 6:10</a>). Ακόμη και εδώ, στο σώμα, οι απόστολοι γράφουν ότι βρίσκονται πνευματικά με τους χριστιανούς:</p><h4>Ο απόστολος γνωρίζει την κατάσταση των χριστιανικών κοινοτήτων όχι με το σώμα, αλλά με το πνεύμα</h4><blockquote><p>«εἰ γὰρ καὶ <strong>τῇ σαρκὶ ἄπειμι, ἀλλὰ τῷ πνεύματι σὺν ὑμῖν εἰμι, χαίρων καὶ βλέπων</strong> ὑμῶν τὴν τάξιν καὶ τὸ στερέωμα τῆς εἰς Χριστὸν πίστεως ὑμῶν.» (<a href="https://bibleox.com/el/gr-lxx-byz/kol/2/#L5">Κολ 2:5</a>)</p></blockquote><blockquote><p>«ἐγὼ μὲν γάρ, <strong>ἀπὼν τῷ σώματι παρὼν δὲ τῷ πνεύματι, ἤδη κέκρικα ὡς παρὼν</strong> τὸν οὕτως τοῦτο κατεργασάμενον ἐν τῷ ὀνόματι τοῦ κυρίου [ἡμῶν] Ἰησοῦ, συναχθέντων ὑμῶν καὶ τοῦ ἐμοῦ πνεύματος σὺν τῇ δυνάμει τοῦ κυρίου ἡμῶν Ἰησοῦ, παραδοῦναι τὸν τοιοῦτον τῷ Σατανᾷ εἰς ὄλεθρον τῆς σαρκός, ἵνα τὸ πνεῦμα σωθῇ ἐν τῇ ἡμέρᾳ τοῦ κυρίου.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/5/#L3-5">Α Κορ 5:3-5</a>)</p></blockquote><blockquote><p>«εἰ δέ <strong>τις ἀγαπᾷ τὸν θεόν, οὗτος <mark>ἔγνωσται ὑπ᾿ αὐτοῦ</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/8/#L3">Α Κορ 8:3</a>)</p></blockquote><h4>Οι άνθρωποι που σώζονται έχουν φύλακες αγγέλους</h4><p>Σε όσους σώζονται, όπως είναι γραμμένο, αποστέλλονται για διακονία άγγελοι:</p><blockquote><p>«οὐχὶ πάντες εἰσὶν <strong>λειτουργικὰ πνεύματα εἰς διακονίαν ἀποστελλόμενα διὰ τοὺς μέλλοντας κληρονομεῖν σωτηρίαν</strong>;» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/1/#L14">Εβρ 1:14</a>)</p></blockquote><p>Παράλληλα, οι άγγελοι βλέπουν το πρόσωπο του Θεού (<a href="https://bibleox.com/el/gr-lxx-byz/mf/18/#L10">Μτ 18:10</a>). Ακόμη και αυτοί θα μπορούσαν να μεταφέρουν τις προσευχές μας. Δεν προσευχόμαστε μόνο στους αγίους ανθρώπους, αλλά και στους αγίους αγγέλους: ζητάμε τις προσευχές τους για μας, τους ευχαριστούμε για τον κόπο και τη φροντίδα τους.</p><p>Οι αντίπαλοι της κοινωνίας της επίγειας Εκκλησίας με την ουράνια δεν επιτρέπουν ούτε να ευχαριστήσουμε τον φύλακα άγγελο, που έχει σταλεί σε διακονία για μας, και ο οποίος δεν χρειάζεται να είναι πανταχού παρών και παντοδύναμος για να μας ακούει.</p><p>Έτσι, η Εκκλησία πιστεύει ότι οι άγιοι ακούν τις προσευχές μας χάρη στη διαμονή τους στο θείο φως και στη χάρη Του. Η ενότητα με τον Θεό τούς δίνει αυτή τη δυνατότητα. Ο ίδιος ο Θεός τούς δίνει αυτή τη δυνατότητα. Έτσι, μιλώντας με πολύ απλά λόγια, οι άγιοι ακούν τις προσευχές όχι χάρη στις δικές τους ικανότητες, αλλά χάρη στον Θεό και τις ικανότητές Του.</p><h3>Πώς η Εκκλησία γνωρίζει ποιος είναι άγιος; Μήπως οι άνθρωποι αποφασίζουν αντί για τον Θεό;</h3><p>Οι άνθρωποι δεν αποφασίζουν αντί για τον Θεό. Ο Θεός, σύμφωνα με τις υποσχέσεις Του (<a href="https://bibleox.com/el/el/w/%CE%97_%CF%84%CE%B9%CE%BC%CE%AE_%CF%84%CF%89%CE%BD_%CE%B1%CE%B3%CE%AF%CF%89%CE%BD#HH-Οι-άγιοι-θα-τιμηθούν">χωρία</a>), ο Ίδιος δοξάζει τους αγίους Του, φανερώνει θαύματα, εισακούει τις προσευχές τους. Η Εκκλησία όμως απλώς μαρτυρεί γι’ αυτό και βάζει σε τάξη την τιμή του αγίου μέσα στον λαό, ώστε να μην υπάρχει χάος, όπως και ο απόστολος παρήγγειλε:</p><blockquote><p>«<strong>πάντα δὲ εὐσχημόνως καὶ κατὰ τάξιν γινέσθω</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/14/#L40">Α Κορ 14:40</a>) *τάξη — διάταξη</p></blockquote><blockquote><p>«<strong>τινας περιπατοῦντας ἐν ὑμῖν ἀτάκτως</strong>, μηδὲν ἐργαζομένους ἀλλὰ περιεργαζομένους·» (<a href="https://bibleox.com/el/gr-lxx-byz/2sol/3/#L11">Β Θεσ 3:11</a>)</p></blockquote><p>Η μαρτυρία της Εκκλησίας για την αγιότητα του δικαίου και η θέσπιση του τρόπου τιμής (αγιοκατάταξη) γίνεται, κατά κανόνα, πολύ αργότερα από τον θάνατο του δικαίου, όταν στη μελέτη του ζητήματος μπορεί κανείς να στηριχθεί όχι μόνο στην επίγεια ζωή του δικαίου, αλλά και σε ό,τι ο Θεός μπόρεσε να φανερώσει για τον δίκαιο μετά τη μετάβασή του στον ουρανό, στη ζωή με τον Θεό.</p><p>Από τα μέλη της Εκκλησίας συλλέγονται μαρτυρίες για θαύματα, θεραπείες που γίνονται στον τάφο του δικαίου, για τη βοήθεια που παρέχει ο δίκαιος με τις προσευχές του[2]. Εξετάζεται προσεκτικά η καθαρότητα της ζωής και της πίστης του. Μετά από αυτό, η Εκκλησία εξετάζει συνοδικά τις πληροφορίες που συλλέχθηκαν και μπορεί να εγκρίνει την τιμή του δικαίου ως αγίου, καθώς και να συντάξει γι’ αυτό τα εκκλησιαστικά κείμενα και να ζωγραφίσει την εικόνα του, να ορίσει ημέρα μνήμης. Εν μέρει, αυτό είναι η τακτοποίηση της τιμής που ήδη γίνεται μέσα στον εκκλησιαστικό λαό, η υπόδειξη της ορθότητας αυτής της τιμής, η ένταξη της τιμής στη λατρεία.</p><p>Εξάλλου, για την αγιότητα πολλών δικαίων δεν χρειάζεται μαρτυρία, αφού αυτό προκύπτει από την Αγία Γραφή και την Ιερά Παράδοση της Εκκλησίας. Στους γνωστούς αγίους ανήκει αναμφίβολα η <a href="https://bibleox.com/el/el/w/%CE%97_%CE%98%CE%B5%CE%BF%CF%84%CF%8C%CE%BA%CE%BF%CF%82">Παρθένος Μαρία η Θεοτόκος</a> (την οποία ο Θεός εμεγάλυνε, <a href="https://bibleox.com/el/gr-lxx-byz/lk/1/#L49">Λκ 1:49</a>), οι προπάτορες, οι προφήτες, οι απόστολοι, οι επίσκοποι που διόρισαν, οι πρεσβύτεροι και οι διάκονοι (για παράδειγμα, ο διάκονος και πρωτομάρτυρας Στέφανος, <a href="https://bibleox.com/el/gr-lxx-byz/act/7/#L55-60">Πραξ 7:55-60</a>), πλήθος μαρτύρων. Επιπλέον, η Εκκλησία προσεύχεται όχι μόνο στους αγίους ανθρώπους, αλλά και στους αγγέλους: στον αρχάγγελο Μιχαήλ, στον Γαβριήλ, σε πολλούς άλλους, στον <a href="https://bibleox.com/el/el/w/%CE%9F_%CE%86%CE%B3%CE%B3%CE%B5%CE%BB%CE%BF%CF%82_%CF%86%CF%8D%CE%BB%CE%B1%CE%BA%CE%B1%CF%82">φύλακα άγγελο</a>. Η μαρτυρία για την αγιότητα των αγγέλων είναι περιττή, αφού είναι γνωστοί λειτουργοί του Θεού.</p><h2>Σημαντικό σχόλιο</h2><p>Πριν αρχίσει κανείς να υπερασπίζεται τις προσευχές στους αγίους, πρέπει να κατανοήσει σταθερά το κρίσιμο σημείο: οι αντίπαλοι δεν έχουν θετικό μέρος της εξήγησης της απαγόρευσης των προσευχών στους αγίους. Το θεμέλιο του λόγου των αντιπάλων αποτελείται από μία φράση: «δεν λέγεται στη Γραφή». Αυτό είναι το αρνητικό μέρος της εξήγησης, στο οποίο θα επιμένουν. Θετική εξήγηση, δηλαδή σαφή κατανόηση (ερμηνεία) της απαγόρευσης, δεν έχουν.</p><p>Οι Αντβεντιστές εν μέρει μπορούν να προτείνουν μια κατανόηση, γιατί δεν πιστεύουν στη ζωή της ψυχής του ανθρώπου μετά τον θάνατο του σώματός του. Εξάλλου, ούτε οι Αντβεντιστές δεν μπορούν να εξηγήσουν την απαγόρευση των προσευχών στους αγγέλους, γιατί προς το παρόν δεν αμφισβητούν την ύπαρξη των αγγέλων. Κατά τη Γραφή, στους ανθρώπους που σώζονται έχουν τοποθετηθεί άγγελοι που φροντίζουν για τη σωτηρία του ανθρώπου (<a href="https://bibleox.com/el/gr-lxx-byz/evr/1/#L14">Εβρ 1:14</a>), γιατί λοιπόν δεν μπορεί κανείς να τους πει τίποτε; Δεν μπορούν να το εξηγήσουν.</p><p>Όσον αφορά τους υπόλοιπους (νεο)προτεστάντες, οι περισσότεροι από αυτούς πιστεύουν στη ζωή της ψυχής του ανθρώπου μετά τον χωρισμό από το σώμα, και δεν μπορούν καθόλου να εξηγήσουν τους λόγους για τους οποίους δεν μπορεί κανείς να κοινωνεί με την ουράνια Εκκλησία, στην οποία έχουμε ήδη πλησιάσει (<a href="https://bibleox.com/el/gr-lxx-byz/evr/12/#L22-23">Εβρ 12:22-23</a>), γιατί δεν μπορεί κανείς να μιλά με τους πατριάρχες, τους αποστόλους, τους μάρτυρες, τους αγγέλους. Φυσικά, θα προσπαθούν να προβάλουν κάτι, αλλά αυτό θα είναι πάντοτε μη πειστικό. Για παράδειγμα, θα πουν ότι οι άγιοι εισήλθαν στην ανάπαυση του Θεού και γι’ αυτό δήθεν δεν ανησυχούν πια για τα επίγεια. Αλλά τότε προκύπτει ότι και ο Θεός δεν ανησυχεί για τα επίγεια, γιατί βρίσκεται στην ίδια ανάπαυση. Επίσης γελοίες φαίνονται και οι λοιπές προσπάθειές τους να δώσουν εξήγηση.</p><p>Η αναγκαιότητα να προσευχόμαστε στους αγίους συνάγεται από τη Γραφή εμμέσως (σταδιακά), δηλαδή αυτή η αναγκαιότητα υποδεικνύεται έμμεσα, υπονοείται. Και αυτό είναι φυσιολογικό, γιατί δεν λέγονται όλα στη Γραφή άμεσα. Η σπουδαιότερη διδασκαλία για τον Θεό ως Τριάδα συνάγεται από τη Γραφή εμμέσως. Και οι αντίπαλοί μας συνάγουν πολλά από τη Γραφή εμμέσως. Για παράδειγμα, πουθενά δεν λέγεται ότι δεν πρέπει να βαπτίζονται τα βρέφη, ωστόσο παράλογα ισχυρίζονται ότι δεν πρέπει να βαπτίζονται και δεν τους ενοχλεί που η Γραφή δεν το λέει. Προσπαθούν να συνάγουν αυτή την απαγόρευση εμμέσως, από άλλες δηλώσεις της Γραφής. Γι’ αυτό είναι εξαιρετικά σημαντικό να τους οδηγήσουμε σε αυτό το πεδίο και να τους ζητήσουμε να δώσουν ερμηνεία της απαγόρευσης να προσευχόμαστε στους αγίους.</p><p>Και ακόμη, αγαπητέ φίλε, θυμήσου επίσης ότι οι αντίπαλοι των προσευχών στους αγίους δεν εξεγείρονται καθόλου κατά των μεσιτικών προσευχών (γιατί εύκολα αποδεικνύεται ότι οι ίδιοι είναι μεσίτες ο ένας για τον άλλο όταν προσεύχονται ο ένας για τον άλλο, όσο κι αν διαφωνούν με αυτό). Το κυριότερο, κατά του οποίου εξεγείρονται, είναι η <strong><mark>κοινωνία</mark> της επίγειας Εκκλησίας με την ουράνια</strong>, κατά οποιασδήποτε κοινωνίας με τα άγια πνεύματα: τους αγίους αγγέλους και τους αγίους ανθρώπους, τους φίλους του Θεού. Σαν να προσβλήθηκε η επίγεια Εκκλησία από την ουράνια και δεν θέλει να μιλά μαζί της, το ένα μέρος του σώματος του Χριστού δεν θέλει να κοινωνεί με το άλλο μέρος του ίδιου σώματος. Δεν μπορούν να επιτρέψουν ούτε μία λέξη, δεν επιτρέπουν ούτε ευχαριστία προς τον φύλακα άγγελο για τη φροντίδα του για μας. Γιατί αν παραδεχτούν έστω και την ελάχιστη δυνατότητα κοινωνίας με τους αγίους στον πνευματικό κόσμο, σύντομα δεν θα τους μείνει τίποτε άλλο παρά να παραδεχτούν βήμα βήμα και όλα τα υπόλοιπα που αφορούν την κοινωνία της επίγειας και της ουράνιας Εκκλησίας. Γι’ αυτό, ως ένα από τα ζητήματα, αξίζει να εξεταστεί η δυνατότητα κοινωνίας με τους αγγέλους, που στη Γραφή παρουσιάζεται πολύ ευρέως.</p>'
