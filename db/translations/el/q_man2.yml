  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: '<p><strong>Το προπατορικό αμάρτημα</strong> —</p><p>1) Η αμαρτία των προπατόρων Αδάμ και Εύας.</p><p>2) Η διαφθορά της ανθρώπινης φύσης, η οποία τώρα έλκεται προς αμαρτωλές σκέψεις, λόγια και πράξεις (το κακό θέλουμε να το κάνουμε, ενώ για το αγαθό χρειάζεται προσπάθεια της θέλησης). Αυτή η κατάσταση μεταδίδεται στους απογόνους κατά τη γέννηση: σε όλους, εκτός από τον Κύριο Ιησού Χριστό.</p><h2>Όλοι οι άνθρωποι κληρονομούν την αμαρτωλότητα από τους προπάτορες (Αδάμ και Εύα) ήδη από τη σύλληψη</h2><blockquote><p>«τίς γὰρ καθαρὸς ἔσται ἀπὸ ῥύπου; ἀλλ᾿ <strong>οὐθείς</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/iov/14/#L4">Ιωβ 14:4</a>)</p></blockquote><blockquote><p>«Τί οὖν; προεχόμεθα; οὐ πάντως, προῃτιασάμεθα γὰρ Ἰουδαίους τε καὶ Ἕλληνας <strong>πάντας ὑφ᾿ ἁμαρτίαν εἶναι</strong>, καθὼς γέγραπται ὅτι <strong>Οὐκ ἔστιν δίκαιος οὐδὲ εἷς</strong>, οὐκ ἔστιν ὁ συνίων, οὐκ ἔστιν ὁ ἐκζητῶν τὸν θεόν. πάντες ἐξέκλιναν, ἅμα ἠχρειώθησαν· οὐκ ἔστιν ποιῶν χρηστότητα, οὐκ ἔστιν ἕως ἑνός.» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/3/#L9-12">Ρωμ 3:9-12</a>)</p></blockquote><blockquote><p>«<strong>πάντες γὰρ ἥμαρτον</strong> καὶ ὑστεροῦνται τῆς δόξης τοῦ θεοῦ,» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/3/#L23">Ρωμ 3:23</a>)</p></blockquote><blockquote><p>«Διὰ τοῦτο ὥσπερ <strong>δι᾿ ἑνὸς ἀνθρώπου ἡ ἁμαρτία εἰς τὸν κόσμον εἰσῆλθεν</strong> καὶ διὰ τῆς ἁμαρτίας ὁ θάνατος, καὶ οὕτως <strong>εἰς πάντας ἀνθρώπους ὁ θάνατος διῆλθεν, ἐφ᾿ ᾧ πάντες ἥμαρτον</strong> —» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/5/#L12">Ρωμ 5:12</a>)</p></blockquote><blockquote><p>«ὥσπερ γὰρ <strong>διὰ τῆς παρακοῆς τοῦ ἑνὸς ἀνθρώπου ἁμαρτωλοὶ κατεστάθησαν οἱ πολλοί</strong>, οὕτως καὶ διὰ τῆς ὑπακοῆς τοῦ ἑνὸς δίκαιοι κατασταθήσονται οἱ πολλοί.» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/5/#L19">Ρωμ 5:19</a>)</p></blockquote><blockquote><p>«οἴδαμεν γὰρ ὅτι ὁ νόμος πνευματικός ἐστιν· <strong>ἐγὼ δὲ σάρκινός εἰμι, πεπραμένος ὑπὸ τὴν ἁμαρτίαν</strong>. &lt;…&gt; συνήδομαι γὰρ τῷ νόμῳ τοῦ θεοῦ κατὰ τὸν ἔσω ἄνθρωπον, <strong>βλέπω δὲ ἕτερον νόμον ἐν τοῖς μέλεσίν μου ἀντιστρατευόμενον</strong> τῷ νόμῳ τοῦ νοός μου καὶ <strong>αἰχμαλωτίζοντά με ἐν τῷ νόμῳ τῆς ἁμαρτίας</strong> τῷ ὄντι ἐν τοῖς μέλεσίν μου.» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/7/#L14,22-23">Ρωμ 7:14,22-23</a>)</p></blockquote><blockquote><p>«ἐν οἷς καὶ ἡμεῖς <strong>πάντες</strong> ἀνεστράφημέν ποτε ἐν ταῖς ἐπιθυμίαις τῆς σαρκὸς ἡμῶν, ποιοῦντες τὰ θελήματα τῆς σαρκὸς καὶ τῶν διανοιῶν, καὶ ἤμεθα <strong>τέκνα φύσει ὀργῆς</strong> ὡς καὶ οἱ λοιποί·» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/2/#L3">Εφ 2:3</a>)</p></blockquote><blockquote><p>«ἰδοὺ γὰρ ἐν ἀνομίαις συνελήμφθην, καὶ <strong>ἐν ἁμαρτίαις ἐκίσσησέν με ἡ μήτηρ μου</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/50/#L5">Ψλ 50:5</a>)</p></blockquote><blockquote><p>«<strong>βαθεῖα ἡ καρδία παρὰ πάντα</strong>, καὶ ἄνθρωπός ἐστιν· καὶ τίς γνώσεται αὐτόν;» (<a href="https://bibleox.com/el/gr-lxx-byz/ier/17/#L9">Ιερ 17:9</a>)</p></blockquote><h2>Ενηλικιωμένοι, όλοι αποκτούν και τη δική τους αμαρτωλότητα</h2><blockquote><p>«ὅτι ἄνθρωπος οὐκ ἔστιν <strong>δίκαιος</strong> ἐν τῇ γῇ, ὃς ποιήσει ἀγαθὸν καὶ <strong>οὐχ ἁμαρτήσεται</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ekl/7/#L20">Εκ 7:20</a>)</p></blockquote><blockquote><p>«ὅτι ἁμαρτήσονταί σοι — ὅτι <strong>οὐκ ἔστιν ἄνθρωπος, ὃς οὐχ ἁμαρτήσεται</strong> — καὶ ἐπάξεις ἐπ᾿ αὐτοὺς καὶ παραδώσεις αὐτοὺς ἐνώπιον ἐχθρῶν καὶ αἰχμαλωτιοῦσιν αὐτοὺς οἱ αἰχμαλωτίζοντες εἰς γῆν μακρὰν καὶ ἐγγύς,» (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/8/#L46">Γ Βασ 8:46</a>)</p></blockquote><blockquote><p>«<strong>ἐὰν εἴπωμεν ὅτι ἁμαρτίαν οὐκ ἔχομεν, ἑαυτοὺς πλανῶμεν</strong> καὶ ἡ ἀλήθεια οὐκ ἔστιν ἐν ἡμῖν.» (<a href="https://bibleox.com/el/gr-lxx-byz/1in/1/#L8">Α Ιω 1:8</a>)</p></blockquote><blockquote><p>«ὅτι ἁμαρτήσονταί σοι [ὅτι <strong>οὐκ ἔσται ἄνθρωπος, ὃς οὐχ ἁμαρτήσεται</strong>] καὶ πατάξεις αὐτοὺς καὶ παραδώσεις αὐτοὺς κατὰ πρόσωπον ἐχθρῶν καὶ αἰχμαλωτεύσουσιν οἱ αἰχμαλωτεύοντες αὐτοὺς εἰς γῆν ἐχθρῶν εἰς γῆν μακρὰν ἢ ἐγγὺς» (<a href="https://bibleox.com/el/gr-lxx-byz/2par/6/#L36">Β Παρ 6:36</a>)</p></blockquote><blockquote><p>«μὴ γένοιτο· γινέσθω δὲ ὁ θεὸς ἀληθής, <strong>πᾶς δὲ ἄνθρωπος ψεύστης</strong>, καθὼς γέγραπται, Ὅπως ἂν δικαιωθῇς ἐν τοῖς λόγοις σου καὶ νικήσεις ἐν τῷ κρίνεσθαί σε.» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/3/#L4">Ρωμ 3:4</a>)</p></blockquote><blockquote><p>«καθὼς γέγραπται ὅτι <strong>Οὐκ ἔστιν δίκαιος οὐδὲ εἷς</strong>,» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/3/#L10">Ρωμ 3:10</a>)</p></blockquote><blockquote><p>«ἀλλὰ <strong>συνέκλεισεν ἡ γραφὴ τὰ πάντα ὑπὸ ἁμαρτίαν</strong> ἵνα ἡ ἐπαγγελία ἐκ πίστεως Ἰησοῦ Χριστοῦ δοθῇ τοῖς πιστεύουσιν.» (<a href="https://bibleox.com/el/gr-lxx-byz/gal/3/#L22">Γαλ 3:22</a>)</p></blockquote><h2>Ο Θεός καλεί σε μετάνοια και διόρθωση</h2><blockquote><p>«τοὺς μὲν οὖν χρόνους τῆς ἀγνοίας ὑπεριδὼν <strong><mark>ὁ θεὸς τὰ νῦν παραγγέλλει τοῖς ἀνθρώποις πάντας πανταχοῦ μετανοεῖν</mark></strong>, καθότι ἔστησεν ἡμέραν ἐν ᾗ μέλλει κρίνειν τὴν οἰκουμένην ἐν δικαιοσύνῃ ἐν ἀνδρὶ ᾧ ὥρισεν, πίστιν παρασχὼν πᾶσιν ἀναστήσας αὐτὸν ἐκ νεκρῶν.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/17/#L30-31">Πραξ 17:30-31</a>)</p></blockquote><blockquote><p>«Πέτρος δὲ πρὸς αὐτούς, <strong><mark>Μετανοήσατε, καὶ βαπτισθήτω ἕκαστος ὑμῶν ἐπὶ τῷ ὀνόματι Ἰησοῦ Χριστοῦ εἰς ἄφεσιν τῶν ἁμαρτιῶν ὑμῶν</mark></strong>, καὶ λήμψεσθε τὴν δωρεὰν τοῦ ἁγίου πνεύματος·» (<a href="https://bibleox.com/el/gr-lxx-byz/act/2/#L38">Πραξ 2:38</a>)</p></blockquote><blockquote><p>«<strong><mark>ὁ πιστεύσας καὶ βαπτισθεὶς σωθήσεται</mark></strong>, <strong><mark>ὁ δὲ ἀπιστήσας κατακριθήσεται</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mk/16/#L16">Μκ 16:16</a>)</p></blockquote><p>Ο Θεός καλεί στη σωτηρία μέσω της <strong>Ορθόδοξης Εκκλησίας</strong>, την οποία δημιούργησε πριν από 2000 χρόνια, και στην οποία εισέρχονται με το <strong>Βάπτισμα</strong>.</p>'
- src: христианин-раб-Бога
  path: Ο_χριστιανός_είναι_δούλος_του_Θεού
  title: Ο χριστιανός είναι δούλος του Θεού
  copy_cover: true
  menu:
    parent: Άνθρωπος
    title: Ο χριστιανός είναι δούλος του Θεού
    priority: 23
  update: true
  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <p>Οι χριστιανοί αποκαλούν τους εαυτούς τους δούλους του Θεού, επειδή επιδιώκουν να εκπληρώνουν το θέλημα του Χριστού Θεού. Οι χριστιανοί υπηρετούν τον Χριστό, είναι δούλοι Του, υποτάσσουν σε Αυτόν το θέλημά τους και το κάνουν αυτό εκούσια. Ο Χριστός είναι τέτοιος, ώστε να μην ντρέπεται κανείς να είναι δούλος Του. Επίσης, δεν ντρέπεται κανείς να είναι δούλος του Δημιουργού του κόσμου. Και στη Βασιλεία του Χριστού, προς την οποία τείνουν οι χριστιανοί, αυτό είναι επιπλέον τιμητικό — να είναι κανείς υπάκουος δούλος του Βασιλιά των βασιλέων:</p><blockquote><p>«<strong><mark>μακάριοι οἱ δοῦλοι ἐκεῖνοι, οὓς ἐλθὼν ὁ κύριος εὑρήσει γρηγοροῦντας</mark></strong>· ἀμὴν λέγω ὑμῖν ὅτι περιζώσεται καὶ ἀνακλινεῖ αὐτοὺς καὶ παρελθὼν <strong>διακονήσει αὐτοῖς</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/12/#L37">Λκ 12:37</a>)</p></blockquote><h2>Ο Χριστός διατάζει να ονομάζονται δούλοι Του</h2><blockquote><p>«οὕτως καὶ ὑμεῖς, ὅταν ποιήσητε πάντα τὰ διαταχθέντα ὑμῖν, <strong><mark>λέγετε ὅτι Δοῦλοι ἀχρεῖοί ἐσμεν</mark></strong>, ὃ ὠφείλομεν ποιῆσαι πεποιήκαμεν.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/17/#L10">Λκ 17:10</a>)</p></blockquote><blockquote><p>«<strong>ὑμεῖς φωνεῖτέ με</strong> Ὁ διδάσκαλος καὶ <strong><mark>Ὁ κύριος</mark></strong>, καὶ <strong><mark>καλῶς λέγετε</mark>, εἰμὶ γάρ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/13/#L13">Ιω 13:13</a>)</p></blockquote><blockquote><p>«μνημονεύετε τοῦ λόγου οὗ ἐγὼ εἶπον ὑμῖν, <strong>Οὐκ ἔστιν δοῦλος μείζων τοῦ κυρίου αὐτοῦ</strong>. εἰ ἐμὲ ἐδίωξαν, καὶ ὑμᾶς διώξουσιν· εἰ τὸν λόγον μου ἐτήρησαν, καὶ τὸν ὑμέτερον τηρήσουσιν.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/15/#L20">Ιω 15:20</a>)</p></blockquote><h2>Οι απόστολοι διατάζουν να είναι δούλοι του Χριστού</h2><blockquote><p>«μὴ κατ᾿ ὀφθαλμοδουλίαν ὡς ἀνθρωπάρεσκοι ἀλλ᾿ <strong>ὡς δοῦλοι Χριστοῦ</strong> ποιοῦντες τὸ θέλημα τοῦ θεοῦ ἐκ ψυχῆς,» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/6/#L6">Εφ 6:6</a>)</p></blockquote><blockquote><p>«<strong>ὁ γὰρ ἐν κυρίῳ κληθεὶς δοῦλος</strong> ἀπελεύθερος κυρίου ἐστίν· ὁμοίως ὁ ἐλεύθερος κληθεὶς <strong>δοῦλός ἐστιν Χριστοῦ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/7/#L22">Α Κορ 7:22</a>)</p></blockquote><blockquote><p>«ὡς ἐλεύθεροι, καὶ μὴ ὡς ἐπικάλυμμα ἔχοντες τῆς κακίας τὴν ἐλευθερίαν, ἀλλ᾿ ὡς <strong>θεοῦ δοῦλοι</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1pet/2/#L16">Α Πε 2:16</a>)</p></blockquote><h2>Οι απόστολοι ονομάζουν τους εαυτούς τους δούλους του Χριστού</h2><blockquote><p>«Ἄρτι γὰρ ἀνθρώπους πείθω ἢ τὸν θεόν; ἢ ζητῶ ἀνθρώποις ἀρέσκειν; εἰ ἔτι ἀνθρώποις ἤρεσκον, <strong>Χριστοῦ δοῦλος</strong> οὐκ ἂν ἤμην.» (<a href="https://bibleox.com/el/gr-lxx-byz/gal/1/#L10">Γαλ 1:10</a>)</p></blockquote><blockquote><p>«<strong>Παῦλος δοῦλος θεοῦ</strong>, ἀπόστολος δὲ Ἰησοῦ Χριστοῦ κατὰ πίστιν ἐκλεκτῶν θεοῦ καὶ ἐπίγνωσιν ἀληθείας τῆς κατ᾿ εὐσέβειαν» (<a href="https://bibleox.com/el/gr-lxx-byz/tit/1/#L1">Τιτ 1:1</a>)</p></blockquote><blockquote><p>«<strong>Ἰούδας Ἰησοῦ Χριστοῦ δοῦλος</strong>, ἀδελφὸς δὲ Ἰακώβου, τοῖς ἐν θεῷ πατρὶ ἠγαπημένοις καὶ Ἰησοῦ Χριστῷ τετηρημένοις κλητοῖς·» (<a href="https://bibleox.com/el/gr-lxx-byz/iud/1/#L1">Ιούδα 1:1</a>)</p></blockquote><blockquote><p>«<strong>Ἰάκωβος θεοῦ</strong> καὶ κυρίου Ἰησοῦ Χριστοῦ δοῦλος ταῖς δώδεκα φυλαῖς ταῖς ἐν τῇ διασπορᾷ χαίρειν.» (<a href="https://bibleox.com/el/gr-lxx-byz/iak/1/#L1">Ιακ 1:1</a>)</p></blockquote><blockquote><p>«<strong>Συμεὼν Πέτρος δοῦλος καὶ ἀπόστολος Ἰησοῦ Χριστοῦ</strong> τοῖς ἰσότιμον ἡμῖν λαχοῦσιν πίστιν ἐν δικαιοσύνῃ τοῦ θεοῦ ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ·» (<a href="https://bibleox.com/el/gr-lxx-byz/2pet/1/#L1">Β Πε 1:1</a>)</p></blockquote><blockquote><p>«<strong>Παῦλος δοῦλος Χριστοῦ Ἰησοῦ</strong>, κλητὸς ἀπόστολος, ἀφωρισμένος εἰς εὐαγγέλιον θεοῦ,» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/1/#L1">Ρωμ 1:1</a>)</p></blockquote><blockquote><p>«ἀσπάζεται ὑμᾶς <strong>Ἐπαφρᾶς ὁ ἐξ ὑμῶν, δοῦλος Χριστοῦ</strong> [Ἰησοῦ], πάντοτε ἀγωνιζόμενος ὑπὲρ ὑμῶν ἐν ταῖς προσευχαῖς, ἵνα σταθῆτε τέλειοι καὶ πεπληροφορημένοι ἐν παντὶ θελήματι τοῦ θεοῦ.» (<a href="https://bibleox.com/el/gr-lxx-byz/kol/4/#L12">Κολ 4:12</a>)</p></blockquote><h2>Η Θεοτόκος ονομάζει τον εαυτό της δούλη του Θεού</h2><blockquote><p>«εἶπεν δὲ Μαριάμ, <strong>Ἰδοὺ ἡ δούλη κυρίου</strong>· γένοιτό μοι κατὰ τὸ ῥῆμά σου. καὶ ἀπῆλθεν ἀπ᾿ αὐτῆς ὁ ἄγγελος.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/1/#L38">Λκ 1:38</a>)</p></blockquote><h2>Στην Παλαιά Διαθήκη ο Θεός ονόμαζε τους πιστούς δούλους</h2><blockquote><p>«ἰδοὺ <strong>οἱ δουλεύοντές μοι</strong> <strong>ἀγαλλιάσονται ἐν εὐφροσύνῃ</strong>, ὑμεῖς δὲ κεκράξεσθε διὰ τὸν πόνον τῆς καρδίας ὑμῶν καὶ ἀπὸ συντριβῆς πνεύματος ὀλολύξετε.» (<a href="https://bibleox.com/el/gr-lxx-byz/is/65/#L14">Ησ 65:14</a>)</p></blockquote><blockquote><p>«καὶ ἐξάξω τὸ ἐξ Ιακωβ σπέρμα καὶ τὸ ἐξ Ιουδα, καὶ κληρονομήσει τὸ ὄρος τὸ ἅγιόν μου, καὶ κληρονομήσουσιν οἱ ἐκλεκτοί μου καὶ <strong>οἱ δοῦλοί μου</strong> καὶ κατοικήσουσιν ἐκεῖ.» (<a href="https://bibleox.com/el/gr-lxx-byz/is/65/#L9">Ησ 65:9</a>)</p></blockquote><h2>Οι προφήτες και οι πιστοί ονόμαζαν τους εαυτούς τους δούλους του Θεού</h2><blockquote><p>«ὅτι <strong>ἐγὼ δοῦλος σὸς</strong> καὶ <strong>υἱὸς τῆς παιδίσκης σου</strong>, ἄνθρωπος ἀσθενὴς καὶ ὀλιγοχρόνιος καὶ ἐλάσσων ἐν συνέσει κρίσεως καὶ νόμων·» (<a href="https://bibleox.com/el/gr-lxx-byz/prs/9/#L5">Σ.Σολ 9:5</a>)</p></blockquote><blockquote><p>«καὶ ἐπέστρεψα αὐτοῖς λόγον καὶ εἶπα αὐτοῖς Ὁ θεὸς τοῦ οὐρανοῦ, αὐτὸς εὐοδώσει ἡμῖν, καὶ <strong>ἡμεῖς δοῦλοι αὐτοῦ</strong> καθαροί, καὶ οἰκοδομήσομεν· καὶ ὑμῖν οὐκ ἔστιν μερὶς καὶ δικαιοσύνη καὶ μνημόσυνον ἐν Ιερουσαλημ.» (<a href="https://bibleox.com/el/gr-lxx-byz/ezd/12/#L20">Εσδ 12:20</a>)</p></blockquote><blockquote><p>«καὶ <strong>αὐτοὶ παῖδές σου</strong> καὶ λαός σου, οὓς ἐλυτρώσω ἐν δυνάμει σου τῇ μεγάλῃ καὶ ἐν τῇ χειρί σου τῇ κραταιᾷ.» (<a href="https://bibleox.com/el/gr-lxx-byz/ezd/11/#L10">Εσδ 11:10</a>)</p></blockquote><blockquote><p>«καὶ ηὔξατο εὐχὴν κυρίῳ λέγουσα Αδωναι κύριε ελωαι σαβαωθ, ἐὰν ἐπιβλέπων ἐπιβλέψῃς ἐπὶ <strong>τὴν ταπείνωσιν τῆς δούλης σου</strong> καὶ μνησθῇς μου καὶ δῷς <strong>τῇ δούλῃ σου</strong> σπέρμα ἀνδρῶν, καὶ δώσω αὐτὸν ἐνώπιόν σου δοτὸν ἕως ἡμέρας θανάτου αὐτοῦ, καὶ οἶνον καὶ μέθυσμα οὐ πίεται, καὶ σίδηρος οὐκ ἀναβήσεται ἐπὶ τὴν κεφαλὴν αὐτοῦ.» (<a href="https://bibleox.com/el/gr-lxx-byz/1ts/1/#L11">Α Βασ 1:11</a>)</p></blockquote><blockquote><p>«εὐλογεῖτε, <strong>δοῦλοι</strong>, τὸν κύριον· ὑμνεῖτε καὶ ὑπερυψοῦτε αὐτὸν εἰς τοὺς αἰῶνας.» (<a href="https://bibleox.com/el/gr-lxx-byz/dan/3/#L85">Δν 3:85</a>)</p></blockquote><blockquote><p>«οἱ δὲ ἀπεκρίθησαν ἡμῖν λέγοντες <strong>Ἡμεῖς ἐσμεν παῖδες τοῦ κυρίου</strong> τοῦ κτίσαντος τὸν οὐρανὸν καὶ τὴν γῆν.» (<a href="https://bibleox.com/el/gr-lxx-byz/2ezd/6/#L12">II Εσδρ 6:12</a>)</p></blockquote><h2>Υπήρχαν δούλοι που αγαπούσαν τους κυρίους τους</h2><blockquote><p>«ὅταν δὲ ἐξαποστέλλῃς αὐτὸν ἐλεύθερον ἀπὸ σοῦ, οὐκ ἐξαποστελεῖς αὐτὸν κενόν· &lt;…&gt; ἐὰν δὲ λέγῃ πρὸς σέ <strong>Οὐκ ἐξελεύσομαι ἀπὸ σοῦ, ὅτι ἠγάπηκέν σε</strong> καὶ τὴν οἰκίαν σου, ὅτι εὖ αὐτῷ ἐστιν παρὰ σοί,» (<a href="https://bibleox.com/el/gr-lxx-byz/vtor/15/#L13,16">Δτ 15:13,16</a>)</p></blockquote>
