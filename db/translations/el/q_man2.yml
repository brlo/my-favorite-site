  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <blockquote><p>«<strong><mark>ἐν ἱδρῶτι τοῦ προσώπου σου φάγῃ τὸν ἄρτον σου</mark></strong> ἕως τοῦ ἀποστρέψαι σε εἰς τὴν γῆν, ἐξ ἧς ἐλήμφθης· ὅτι γῆ εἶ καὶ εἰς γῆν ἀπελεύσῃ. —» (<a href="https://bibleox.com/el/gr-lxx-byz/gen/3/#L19">Γεν 3:19</a>)</p></blockquote><blockquote><p>«<strong><mark>παρακαλοῦμεν</mark></strong> δὲ ὑμᾶς, ἀδελφοί, περισσεύειν μᾶλλον, καὶ φιλοτιμεῖσθαι ἡσυχάζειν καὶ πράσσειν τὰ ἴδια καὶ <strong><mark>ἐργάζεσθαι ταῖς χερσὶν ὑμῶν</mark>, καθὼς ὑμῖν παρηγγείλαμεν</strong>,» (<a href="https://bibleox.com/el/gr-lxx-byz/1sol/4/#L10-11">Α Θεσ 4:10-11</a>)</p></blockquote><blockquote><p>«Μετὰ ταῦτα <strong>χωρισθεὶς ἐκ τῶν Ἀθηνῶν</strong> ἦλθεν εἰς Κόρινθον. &lt;…&gt; καὶ <strong>διὰ τὸ ὁμότεχνον εἶναι</strong> ἔμενεν παρ᾿ αὐτοῖς καὶ ἠργάζετο· ἦσαν γὰρ <strong><mark>σκηνοποιοὶ τῇ τέχνῃ</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/18/#L1,3">Πραξ 18:1,3</a>)</p></blockquote><blockquote><p>«ἄχρι τῆς ἄρτι ὥρας καὶ πεινῶμεν καὶ διψῶμεν καὶ γυμνιτεύομεν καὶ κολαφιζόμεθα καὶ ἀστατοῦμεν καὶ <strong><mark>κοπιῶμεν ἐργαζόμενοι ταῖς ἰδίαις χερσίν</mark></strong>· λοιδορούμενοι εὐλογοῦμεν, διωκόμενοι ἀνεχόμεθα,» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/4/#L11-12">Α Κορ 4:11-12</a>)</p></blockquote><blockquote><p>«ὁ κλέπτων μηκέτι κλεπτέτω, μᾶλλον δὲ <strong><mark>κοπιάτω ἐργαζόμενος ταῖς ἰδίαις χερσὶν τὸ ἀγαθόν</mark></strong>, ἵνα ἔχῃ μεταδιδόναι τῷ χρείαν ἔχοντι.» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/4/#L28">Εφ 4:28</a>)</p></blockquote><blockquote><p>«<strong>ἀργυρίου ἢ χρυσίου ἢ ἱματισμοῦ οὐδενὸς ἐπεθύμησα</strong>· αὐτοὶ γινώσκετε ὅτι <strong><mark>ταῖς χρείαις μου</mark> καὶ τοῖς οὖσιν μετ᾿ ἐμοῦ <mark>ὑπηρέτησαν αἱ χεῖρες αὗται</mark></strong>. πάντα ὑπέδειξα ὑμῖν ὅτι οὕτως κοπιῶντας δεῖ ἀντιλαμβάνεσθαι τῶν ἀσθενούντων, μνημονεύειν τε τῶν λόγων τοῦ κυρίου Ἰησοῦ ὅτι αὐτὸς εἶπεν, Μακάριόν ἐστιν μᾶλλον διδόναι ἢ λαμβάνειν.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/20/#L33-35">Πραξ 20:33-35</a>)</p></blockquote><blockquote><p>«ἡ γὰρ παράκλησις ἡμῶν οὐκ ἐκ πλάνης οὐδὲ ἐξ ἀκαθαρσίας οὐδὲ ἐν δόλῳ, &lt;…&gt; <strong>οὔτε γάρ ποτε ἐν λόγῳ κολακείας ἐγενήθημεν</strong>, καθὼς οἴδατε, οὔτε <strong>ἐν προφάσει πλεονεξίας</strong>, θεὸς μάρτυς, &lt;…&gt; μνημονεύετε γάρ, ἀδελφοί, τὸν κόπον ἡμῶν καὶ τὸν μόχθον· <strong><mark>νυκτὸς καὶ ἡμέρας ἐργαζόμενοι πρὸς τὸ μὴ ἐπιβαρῆσαί τινα ὑμῶν</mark></strong> ἐκηρύξαμεν εἰς ὑμᾶς τὸ εὐαγγέλιον τοῦ θεοῦ.» (<a href="https://bibleox.com/el/gr-lxx-byz/1sol/2/#L3,5,9">Α Θεσ 2:3,5,9</a>)</p></blockquote><blockquote><p>«<strong>οὐδὲ δωρεὰν ἄρτον ἐφάγομεν παρά τινος, ἀλλ᾿ <mark>ἐν κόπῳ καὶ μόχθῳ νυκτὸς καὶ ἡμέρας ἐργαζόμενοι</mark> πρὸς τὸ μὴ ἐπιβαρῆσαί τινα ὑμῶν</strong>· οὐχ ὅτι οὐκ ἔχομεν ἐξουσίαν, ἀλλ᾿ ἵνα ἑαυτοὺς τύπον δῶμεν ὑμῖν εἰς τὸ μιμεῖσθαι ἡμᾶς. καὶ γὰρ ὅτε ἦμεν πρὸς ὑμᾶς, τοῦτο παρηγγέλλομεν ὑμῖν, ὅτι <strong>εἴ τις οὐ θέλει ἐργάζεσθαι μηδὲ ἐσθιέτω</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/2sol/3/#L8-10">Β Θεσ 3:8-10</a>)</p></blockquote><blockquote><p>«<strong><mark>μὴ μισήσῃς ἐπίπονον ἐργασίαν</mark></strong> καὶ γεωργίαν ὑπὸ ὑψίστου ἐκτισμένην.» (<a href="https://bibleox.com/el/gr-lxx-byz/prsir/7/#L15">Σ.Σειρ 7:15</a>)</p></blockquote><blockquote><p>«<strong><mark>κρείσσων ἐργαζόμενος</mark></strong> καὶ περισσεύων ἐν πᾶσιν ἢ περιπατῶν δοξαζόμενος καὶ ἀπορῶν ἄρτων.» (<a href="https://bibleox.com/el/gr-lxx-byz/prsir/10/#L27">Σ.Σειρ 10:27</a>)</p></blockquote><blockquote><p>«ἔμβαλε αὐτὸν εἰς ἐργασίαν, ἵνα μὴ ἀργῇ, <strong><mark>πολλὴν γὰρ κακίαν ἐδίδαξεν ἡ ἀργία</mark></strong>·» (<a href="https://bibleox.com/el/gr-lxx-byz/prsir/33/#L28">Σ.Σειρ 33:28</a>)</p></blockquote><blockquote><p>«ὥσπερ γεώργιον <strong>ἀνὴρ ἄφρων</strong>, καὶ ὥσπερ ἀμπελὼν ἄνθρωπος ἐνδεὴς φρενῶν· ἐὰν ἀφῇς αὐτόν, χερσωθήσεται καὶ χορτομανήσει ὅλος καὶ γίνεται ἐκλελειμμένος, οἱ δὲ φραγμοὶ τῶν λίθων αὐτοῦ κατασκάπτονται.» (<a href="https://bibleox.com/el/gr-lxx-byz/pr/24/#L30-31">Πρμ 24:30-31</a>)</p></blockquote>
