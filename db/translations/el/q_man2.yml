  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <blockquote><p>«Τέκνον, <strong>ἐκ νεότητός σου ἐπίλεξαι παιδείαν</strong>, καὶ ἕως πολιῶν <strong>εὑρήσεις σοφίαν</strong>. ὡς ὁ ἀροτριῶν καὶ ὁ σπείρων πρόσελθε αὐτῇ καὶ ἀνάμενε τοὺς ἀγαθοὺς καρποὺς αὐτῆς· ἐν γὰρ τῇ ἐργασίᾳ αὐτῆς ὀλίγον κοπιάσεις καὶ ταχὺ φάγεσαι τῶν γενημάτων αὐτῆς. <strong>ὡς τραχεῖά ἐστιν σφόδρα τοῖς ἀπαιδεύτοις</strong>, καὶ οὐκ ἐμμενεῖ ἐν αὐτῇ ἀκάρδιος· ὡς λίθος δοκιμασίας ἰσχυρὸς ἔσται ἐπ᾿ αὐτῷ, καὶ οὐ χρονιεῖ ἀπορρῖψαι αὐτήν.» (<a href="https://bibleox.com/el/gr-lxx-byz/prsir/6/#L18-21">Σ.Σειρ 6:18-21</a>)</p></blockquote><blockquote><p>«<strong>ἐμίσησαν γὰρ σοφίαν</strong>, τὸν δὲ φόβον τοῦ κυρίου οὐ προ είλαντο οὐδὲ ἤθελον ἐμαῖς προσέχειν βουλαῖς, ἐμυκτήριζον δὲ ἐμοὺς ἐλέγχους. τοιγαροῦν <strong>ἔδονται τῆς ἑαυτῶν ὁδοῦ τοὺς καρποὺς</strong> καὶ τῆς ἑαυτῶν ἀσεβείας πλησθήσονται·» (<a href="https://bibleox.com/el/gr-lxx-byz/pr/1/#L29-31">Πρμ 1:29-31</a>)</p></blockquote><blockquote><p>«<strong>ἀφροσύνη ἀνδρὸς λυμαίνεται τὰς ὁδοὺς αὐτοῦ</strong>, <strong>τὸν δὲ θεὸν αἰτιᾶται τῇ καρδίᾳ αὐτοῦ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/pr/19/#L3">Πρμ 19:3</a>)</p></blockquote><blockquote><p>«<strong>ὁ κτώμενος φρόνησιν ἀγαπᾷ ἑαυτόν</strong>· ὃς δὲ φυλάσσει φρόνησιν, εὑρήσει ἀγαθά.» (<a href="https://bibleox.com/el/gr-lxx-byz/pr/19/#L8">Πρμ 19:8</a>)</p></blockquote><blockquote><p>«ὥσπερ γεώργιον ἀνὴρ ἄφρων, καὶ ὥσπερ ἀμπελὼν <strong>ἄνθρωπος ἐνδεὴς φρενῶν</strong>· ἐὰν ἀφῇς αὐτόν, <strong>χερσωθήσεται καὶ χορτομανήσει ὅλος</strong> καὶ γίνεται ἐκλελειμμένος, οἱ δὲ φραγμοὶ τῶν λίθων αὐτοῦ κατασκάπτονται.» (<a href="https://bibleox.com/el/gr-lxx-byz/pr/24/#L30-31">Πρμ 24:30-31</a>)</p></blockquote><blockquote><p>«<strong>ἔπεχε σεαυτῷ καὶ τῇ διδασκαλίᾳ· ἐπίμενε αὐτοῖς</strong>· τοῦτο γὰρ ποιῶν καὶ σεαυτὸν σώσεις καὶ τοὺς ἀκούοντάς σου.» (<a href="https://bibleox.com/el/gr-lxx-byz/1tim/4/#L16">Α Τιμ 4:16</a>)</p></blockquote><blockquote><p>«<strong>σύνετε δή, ἄφρονες ἐν τῷ λαῷ</strong>, καί, <strong>μωροί</strong>, ποτὲ φρονήσατε.» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/93/#L8">Ψλ 93:8</a>)</p></blockquote><blockquote><p>«ὁ ἀγαπῶν παιδείαν ἀγαπᾷ αἴσθησιν, <strong>ὁ δὲ μισῶν ἐλέγχους ἄφρων</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/pr/12/#L1">Πρμ 12:1</a>)</p></blockquote><blockquote><p>«ἀνθ᾿ ὧν γὰρ <strong>ἠδίκουν νηπίους, φονευθήσονται</strong>, καὶ ἐξετασμὸς ἀσεβεῖς ὀλεῖ.» (<a href="https://bibleox.com/el/gr-lxx-byz/pr/1/#L32">Πρμ 1:32</a>)</p></blockquote><blockquote><p>«<strong>μεριοῦνται ἄφρονες κακίαν</strong>, οἱ δὲ πανοῦργοι κρατήσουσιν αἰσθήσεως.» (<a href="https://bibleox.com/el/gr-lxx-byz/pr/14/#L18">Πρμ 14:18</a>)</p></blockquote><blockquote><p>«στέφανος σοφῶν πανοῦργος, <strong>ἡ δὲ διατριβὴ ἀφρόνων κακή</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/pr/14/#L24">Πρμ 14:24</a>)</p></blockquote><blockquote><p>«Μῶμος πονηρὸς ἐν ἀνθρώπῳ <strong>ψεῦδος, ἐν στόματι ἀπαιδεύτων ἐνδελεχισθήσεται</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/prsir/20/#L24">Σ.Σειρ 20:24</a>)</p></blockquote><blockquote><p>«<strong>ἀρχὴ γὰρ αὐτῆς ἡ ἀληθεστάτη παιδείας ἐπιθυμία</strong>, <strong>φροντὶς δὲ παιδείας ἀγάπη</strong>, ἀγάπη δὲ τήρησις νόμων αὐτῆς, προσοχὴ δὲ νόμων βεβαίωσις ἀφθαρσίας,» (<a href="https://bibleox.com/el/gr-lxx-byz/prs/6/#L17-18">Σ.Σολ 6:17-18</a>)</p></blockquote><blockquote><p>«ὃν τρόπον δὲ Ἰάννης καὶ Ἰαμβρῆς ἀντέστησαν Μωϋσεῖ, οὕτως καὶ οὗτοι <strong>ἀνθίστανται τῇ ἀληθείᾳ</strong>, ἄνθρωποι κατεφθαρμένοι τὸν νοῦν, <strong>ἀδόκιμοι περὶ τὴν πίστιν</strong>·» (<a href="https://bibleox.com/el/gr-lxx-byz/2tim/3/#L8">Β Τιμ 3:8</a>)</p></blockquote><blockquote><p>«ὡς καὶ ἐν πάσαις ἐπιστολαῖς λαλῶν ἐν αὐταῖς περὶ τούτων, ἐν αἷς ἐστιν δυσνόητά τινα, ἃ <strong>οἱ ἀμαθεῖς</strong> καὶ ἀστήρικτοι <strong>στρεβλοῦσιν ὡς καὶ τὰς λοιπὰς γραφὰς πρὸς τὴν ἰδίαν αὐτῶν ἀπώλειαν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/2pet/3/#L16">Β Πε 3:16</a>)</p></blockquote>
