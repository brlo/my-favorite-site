  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: '<h2>Οι πρώτοι χριστιανοί είχαν ασθένειες.</h2><p>Ο Τιμόθεος (επίσκοπος Εφέσου) υπέφερε από στομαχική ασθένεια. Μάλιστα ο απόστολος Παύλος τού επιτρέπει, λόγω της ασθένειας, να χαλαρώσει τη νηστεία:</p><blockquote><p>«<strong>Μηκέτι ὑδροπότει</strong>, ἀλλὰ οἴνῳ ὀλίγῳ χρῶ <strong>διὰ τὸν στόμαχον καὶ τὰς πυκνάς σου ἀσθενείας</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1tim/5/#L23">Α Τιμ 5:23</a>)</p></blockquote><p>Στον ίδιο τον απόστολο Παύλο δόθηκε ασθένεια, για να μην υπερηφανεύεται:</p><blockquote><p>«καὶ τῇ ὑπερβολῇ τῶν ἀποκαλύψεων. διό, ἵνα μὴ ὑπεραίρωμαι, <strong>ἐδόθη μοι σκόλοψ τῇ σαρκί</strong>, ἄγγελος Σατανᾶ, ἵνα με κολαφίζῃ, <strong>ἵνα μὴ ὑπεραίρωμαι</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/2kor/12/#L7">Β Κορ 12:7</a>)</p></blockquote><p>Ο Επαφρόδιτος (συνεργάτης του αποστόλου Παύλου) αρρώστησε και ήταν ετοιμοθάνατος:</p><blockquote><p>«Ἀναγκαῖον δὲ ἡγησάμην <strong>Ἐπαφρόδιτον</strong> τὸν ἀδελφὸν καὶ συνεργὸν καὶ συστρατιώτην μου, ὑμῶν δὲ ἀπόστολον καὶ λειτουργὸν τῆς χρείας μου, πέμψαι πρὸς ὑμᾶς, ἐπειδὴ ἐπιποθῶν ἦν πάντας ὑμᾶς, καὶ ἀδημονῶν διότι <strong>ἠκούσατε ὅτι ἠσθένησεν</strong>. <strong>καὶ γὰρ ἠσθένησεν παραπλήσιον θανάτῳ</strong>· ἀλλὰ ὁ θεὸς ἠλέησεν αὐτόν, οὐκ αὐτὸν δὲ μόνον ἀλλὰ καὶ ἐμέ, ἵνα μὴ λύπην ἐπὶ λύπην σχῶ. &lt;…&gt; ὅτι διὰ τὸ ἔργον Χριστοῦ <strong>μέχρι θανάτου ἤγγισεν</strong>, παραβολευσάμενος τῇ ψυχῇ ἵνα ἀναπληρώσῃ τὸ ὑμῶν ὑστέρημα τῆς πρός με λειτουργίας.» (<a href="https://bibleox.com/el/gr-lxx-byz/fil/2/#L25-27,30">Φιλ 2:25-27,30</a>)</p></blockquote><p>Ο απόστολος Παύλος παραδίδει τον αμαρτήσαντα χριστιανό στον Σατανά, για να πληγεί με ασθένεια:</p><blockquote><p>«ἐγὼ μὲν γάρ, ἀπὼν τῷ σώματι παρὼν δὲ τῷ πνεύματι, ἤδη κέκρικα ὡς παρὼν τὸν οὕτως τοῦτο κατεργασάμενον &lt;…&gt; <strong>παραδοῦναι τὸν τοιοῦτον τῷ Σατανᾷ εἰς ὄλεθρον τῆς σαρκός, ἵνα τὸ πνεῦμα σωθῇ</strong> ἐν τῇ ἡμέρᾳ τοῦ κυρίου.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/5/#L3,5">Α Κορ 5:3,5</a>)</p></blockquote><p>Η ανάξια συμμετοχή στη Θεία Ευχαριστία οδήγησε πολλούς χριστιανούς σε ασθένειες, αδυναμίες και ακόμη και στον θάνατο:</p><blockquote><p>«διὰ τοῦτο ἐν ὑμῖν <strong>πολλοὶ ἀσθενεῖς καὶ ἄρρωστοι</strong> καὶ κοιμῶνται ἱκανοί.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/11/#L30">Α Κορ 11:30</a>)</p></blockquote><p>Οι δίκαιοι της Παλαιάς Διαθήκης αρρώστησαν</p><blockquote><p><em>«μετὰ τὸ γηρᾶσαι Ισαακ καὶ </em><strong><em>ἠμβλύνθησαν οἱ ὀφθαλμοὶ αὐτοῦ</em></strong><em> τοῦ ὁρᾶν» (</em><a href="https://bibleox.com/el/gr-lxx-byz/gen/27/#L1">Γεν 27:1</a>)</p></blockquote><h2>Το όφελος από τα σωματικά παθήματα</h2><h3>Βοήθεια στην εγκατάλειψη των αμαρτιών</h3><blockquote><p>«Χριστοῦ οὖν παθόντος σαρκὶ καὶ ὑμεῖς τὴν αὐτὴν ἔννοιαν ὁπλίσασθε, ὅτι <strong>ὁ παθὼν σαρκὶ πέπαυται ἁμαρτίας</strong>,» (<a href="https://bibleox.com/el/gr-lxx-byz/1pet/4/#L1">Α Πε 4:1</a>)</p></blockquote><h3>Προστασία από την υπερηφάνεια</h3><blockquote><p>«<strong>καὶ τῇ ὑπερβολῇ τῶν ἀποκαλύψεων. διό, ἵνα μὴ ὑπεραίρωμαι, ἐδόθη μοι σκόλοψ τῇ σαρκί, ἄγγελος Σατανᾶ, ἵνα με κολαφίζῃ, ἵνα μὴ ὑπεραίρωμαι</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/2kor/12/#L7">Β Κορ 12:7</a>)</p></blockquote><h3>Νουθεσία</h3><blockquote><p>«<strong>ἐνταῦθα οὖν ἤρξατο τὸ πολὺ τῆς ὑπερηφανίας λήγειν τεθραυσμένος καὶ εἰς ἐπίγνωσιν ἔρχεσθαι θείᾳ μάστιγι κατὰ στιγμὴν ἐπιτεινόμενος ταῖς ἀλγηδόσιν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/2mak/9/#L11">II Μακ 9:11</a>)</p></blockquote><h2>Ο Θεός μπορεί να τιμωρεί με ασθένεια</h2><p>Ο Θεός μπορεί να τιμωρεί για την ανομία και τις αμαρτίες:</p><blockquote><p>«Οὕτως εἶπεν κύριος Ἀνέστησα σύντριμμα, <strong>ἀλγηρὰ ἡ πληγή σου</strong>· οὐκ ἔστιν κρίνων κρίσιν σου, εἰς ἀλγηρὸν ἰατρεύθης, ὠφέλεια οὐκ ἔστιν σοι. πάντες οἱ φίλοι σου ἐπελάθοντό σου, οὐ μὴ ἐπερωτήσουσιν· ὅτι πληγὴν ἐχθροῦ ἔπαισά σε, παιδείαν στερεάν, <strong>ἐπὶ πᾶσαν ἀδικίαν σου ἐπλήθυναν αἱ ἁμαρτίαι σου</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ier/37/#L12-14">Ιερ 37:12-14</a>)</p></blockquote><p>Ο Θεός τιμώρησε με λέπρα τη Μαριάμ (αδελφή του Ααρών και του Μωυσή) για τις μομφές κατά του Μωυσή:</p><blockquote><p>«καὶ διὰ τί οὐκ ἐφοβήθητε καταλαλῆσαι κατὰ τοῦ θεράποντός μου Μωυσῆ; καὶ <strong>ὀργὴ θυμοῦ κυρίου ἐπ᾿ αὐτοῖς</strong>, καὶ ἀπῆλθεν. καὶ ἡ νεφέλη ἀπέστη ἀπὸ τῆς σκηνῆς, καὶ ἰδοὺ <strong>Μαριαμ λεπρῶσα ὡσεὶ χιών</strong>· καὶ ἐπέβλεψεν Ααρων ἐπὶ Μαριαμ, καὶ ἰδοὺ λεπρῶσα.» (<a href="https://bibleox.com/el/gr-lxx-byz/chis/12/#L8-10">Αρ 12:8-10</a>)</p></blockquote><p>Επιδημία έπληξε τον λαό του Ισραήλ για την απομάκρυνσή του από τη λατρεία του Θεού:</p><blockquote><p>«καὶ ἐτελέσθη Ισραηλ τῷ Βεελφεγωρ· καὶ <strong>ὠργίσθη θυμῷ κύριος τῷ Ισραηλ. &lt;…&gt; καὶ ἐγένοντο οἱ τεθνηκότες ἐν τῇ πληγῇ τέσσαρες καὶ εἴκοσι χιλιάδες</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/chis/25/#L3,9">Αρ 25:3,9</a>)</p></blockquote><p>Ο Σωτήρας δείχνει τις αμαρτίες ως αιτία των ασθενειών:</p><blockquote><p>«μετὰ ταῦτα εὑρίσκει αὐτὸν ὁ Ἰησοῦς ἐν τῷ ἱερῷ καὶ εἶπεν αὐτῷ, <strong>Ἴδε ὑγιὴς γέγονας· μηκέτι ἁμάρτανε, ἵνα μὴ χεῖρόν σοί τι γένηται</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/5/#L14">Ιω 5:14</a>)</p></blockquote><p>Ο Θεός μπορεί και να ελεεί και να προστατεύει από τις ασθένειες</p><blockquote><p>«<strong><em>Ἐὰν ἀκοῇ ἀκούσῃς τῆς φωνῆς κυρίου</em></strong><em> τοῦ θεοῦ σου καὶ τὰ ἀρεστὰ ἐναντίον αὐτοῦ ποιήσῃς καὶ ἐνωτίσῃ ταῖς ἐντολαῖς αὐτοῦ καὶ φυλάξῃς πάντα τὰ δικαιώματα αὐτοῦ, </em><strong><em>πᾶσαν νόσον</em></strong><em>, ἣν ἐπήγαγον τοῖς Αἰγυπτίοις, </em><strong><em>οὐκ ἐπάξω ἐπὶ σέ</em></strong><em>· ἐγὼ γάρ εἰμι κύριος ὁ ἰώμενός σε.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/ish/15/#L26">Έξ 15:26</a>)</p></blockquote><h2>Δεν προέρχονται όλες οι ασθένειες από αμαρτίες</h2><blockquote><p>«Καὶ παράγων εἶδεν ἄνθρωπον τυφλὸν ἐκ γενετῆς. καὶ ἠρώτησαν αὐτὸν οἱ μαθηταὶ αὐτοῦ λέγοντες, Ῥαββί, τίς ἥμαρτεν, οὗτος ἢ οἱ γονεῖς αὐτοῦ, ἵνα τυφλὸς γεννηθῇ; ἀπεκρίθη Ἰησοῦς, <strong>Οὔτε οὗτος ἥμαρτεν οὔτε οἱ γονεῖς αὐτοῦ, ἀλλ᾿ ἵνα φανερωθῇ τὰ ἔργα τοῦ θεοῦ ἐν αὐτῷ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/9/#L1-3">Ιω 9:1-3</a>)</p></blockquote><p>Βλ. επίσης: <a href="https://bibleox.com/el/el/w/Η_ιατρική">Η ιατρική</a>.</p><h2>Η Διδαχή — χριστιανικό μνημείο του 1ου–2ου αιώνα</h2><blockquote><p>«τὰ συμβαίνοντά σοι ἐνεργήματα <strong>ὡς ἀγαθὰ προσδέξῃ, εἰδὼς ὅτι ἄτερ θεοῦ οὐδὲν γίνεται</strong>»</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/ΔΙΔΑΧΗ#HH-3">Διδαχή, κεφ. 3</a>)</p>'
