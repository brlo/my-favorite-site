  update: true
  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <blockquote>«ὁ λόγος τοῦ Χριστοῦ ἐνοικείτω ἐν ὑμῖν πλουσίως, ἐν πάσῃ σοφίᾳ <b>διδάσκοντες</b> <b>καὶ</b> <b>νουθετοῦντες</b> <b>ἑαυ</b><b>τοὺς</b> ψαλμοῖς, ὕμνοις, ᾠδαῖς πνευματικαῖς ἐν χάριτι ᾄδοντες ἐν ταῖς καρδίαις ὑμῶν τῷ θεῷ·» (<a href="https://bibleox.com/el/gr-lxx-byz/kol/3/#L16">Κολ 3:16</a>)</blockquote><blockquote>«Διὸ <b>παρακαλεῖτε</b> <b>ἀλλήλους καὶ οἰκοδομεῖτε εἷς τὸν</b> <b>ἕνα</b>, καθὼς καὶ ποιεῖτε.» (<a href="https://bibleox.com/el/gr-lxx-byz/1sol/5/#L11">Α Θεσ 5:11</a>)</blockquote><blockquote>«ἀλλὰ <b>παρακαλεῖτε</b> <b>ἑαυ</b><b>τοὺς</b> καθ᾿ ἑκάστην ἡμέραν, ἄχρις οὗ τὸ Σήμερον καλεῖται, ἵνα μὴ σκληρυνθῇ τις ἐξ ὑμῶν ἀπάτῃ τῆς ἁμαρτίας·» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/3/#L13">Εβρ 3:13</a>)</blockquote><blockquote>«καὶ <b>κατανοῶμεν ἀλλήλους εἰς παροξυσμὸν ἀγάπης καὶ καλῶν ἔργων</b>» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/10/#L24">Εβρ 10:24</a>)</blockquote><blockquote>«μὴ ἐγκαταλείποντες τὴν ἐπισυναγωγὴν ἑαυτῶν, καθὼς ἔθος τισίν, ἀλλὰ <b>παρακαλοῦντες</b>, καὶ τοσούτῳ μᾶλλον ὅσῳ βλέπετε ἐγγίζουσαν τὴν ἡμέραν.» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/10/#L25">Εβρ 10:25</a>)</blockquote><blockquote>«δοῦλον δὲ κυρίου <b>οὐ δεῖ μάχεσθαι, ἀλλὰ ἤπιον εἶναι πρὸς πάντας</b>, <b>διδακτικόν</b>, <b>ἀνεξίκακον</b>, <b>ἐν πραΰτητι παιδεύοντα</b> τοὺς ἀντιδιατιθεμένους, μήποτε δώῃ αὐτοῖς ὁ θεὸς μετάνοιαν εἰς ἐπίγνωσιν ἀληθείας» (<a href="https://bibleox.com/el/gr-lxx-byz/2tim/2/#L24-25">Β Τιμ 2:24-25</a>)</blockquote>
