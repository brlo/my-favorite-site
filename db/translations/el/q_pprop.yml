  update: true
  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <h2>Η ντροπή να ονομάζεσαι Χριστιανός</h2><blockquote><p>«ὃς γὰρ ἐὰν <strong>ἐπαισχυνθῇ με</strong> <strong>καὶ τοὺς ἐμοὺς λόγους</strong> ἐν τῇ γενεᾷ ταύτῃ τῇ μοιχαλίδι καὶ ἁμαρτωλῷ, καὶ <strong>ὁ υἱὸς τοῦ ἀνθρώπου ἐπαισχυνθήσεται αὐτὸν</strong> ὅταν ἔλθῃ ἐν τῇ δόξῃ τοῦ πατρὸς αὐτοῦ μετὰ τῶν ἀγγέλων τῶν ἁγίων.» (<a href="https://bibleox.com/el/gr-lxx-byz/mk/8/#L38">Μκ 8:38</a>)</p></blockquote><blockquote><p>«ὃς γὰρ ἂν <strong>ἐπαισχυνθῇ με καὶ τοὺς ἐμοὺς λόγους</strong>, <strong>τοῦτον ὁ υἱὸς τοῦ ἀνθρώπου ἐπαισχυνθήσεται</strong>, ὅταν ἔλθῃ ἐν τῇ δόξῃ αὐτοῦ καὶ τοῦ πατρὸς καὶ τῶν ἁγίων ἀγγέλων.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/9/#L26">Λκ 9:26</a>)</p></blockquote><blockquote><p>«εὐφρανθείη ἡ ψυχὴ ὑμῶν ἐν τῷ ἐλέει αὐτοῦ, καὶ <strong>μὴ αἰσχυνθείητε ἐν αἰνέσει αὐτοῦ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/prsir/51/#L29">Σ.Σειρ 51:29</a>)</p></blockquote><blockquote><p>«τοῖς δὲ <strong>δειλοῖς</strong> καὶ ἀπίστοις καὶ ἐβδελυγμένοις καὶ φονεῦσιν καὶ πόρνοις καὶ φαρμάκοις καὶ εἰδωλολάτραις καὶ πᾶσιν τοῖς ψευδέσιν τὸ μέρος αὐτῶν ἐν τῇ λίμνῃ τῇ καιομένῃ πυρὶ καὶ θείῳ, ὅ ἐστιν ὁ θάνατος ὁ δεύτερος.» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/21/#L8">Απ 21:8</a>)</p></blockquote><h2>Τα παθήματα για τον Χριστό</h2><p>Το μαρτύριο για τον Χριστό</p>
