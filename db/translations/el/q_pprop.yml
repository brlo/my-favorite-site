  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <blockquote>«Ἐὰν τοῖς προστάγμασίν μου πορεύησθε καὶ τὰς ἐντολάς μου φυλάσσησθε καὶ ποιήσητε αὐτάς, &lt;…&gt; καὶ διώξεσθε τοὺς ἐχθροὺς ὑμῶν, καὶ πεσοῦνται ἐναντίον ὑμῶν φόνῳ· καὶ <b>διώξονται ἐξ ὑμῶν πέντε ἑκατόν</b>, καὶ ἑκατὸν ὑμῶν διώξονται μυριάδας, καὶ πεσοῦνται οἱ ἐχθροὶ ὑμῶν ἐναντίον ὑμῶν μαχαίρᾳ. καὶ ἐπιβλέψω ἐφ᾿ ὑμᾶς καὶ αὐξανῶ ὑμᾶς καὶ πληθυνῶ ὑμᾶς καὶ στήσω τὴν διαθήκην μου μεθ᾿ ὑμῶν.» (<a href="https://bibleox.com/el/gr-lxx-byz/lev/26/#L3,7-9">Λευ 26:3,7-9</a>)</blockquote><blockquote>«ἔλεγεν δὲ πρὸς αὐτούς, <b>Ὁ μὲν θερισμὸς πολύς, οἱ δὲ ἐργάται ὀλίγοι</b>· δεήθητε οὖν τοῦ κυρίου τοῦ θερισμοῦ ὅπως ἐργάτας ἐκβάλῃ εἰς τὸν θερισμὸν αὐτοῦ.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/10/#L2">Λκ 10:2</a>)</blockquote><blockquote>«τότε λέγει τοῖς μαθηταῖς αὐτοῦ, <b>Ὁ μὲν θερισμὸς πολύς, οἱ δὲ ἐργάται ὀλίγοι</b>· δεήθητε οὖν τοῦ κυρίου τοῦ θερισμοῦ ὅπως ἐκβάλῃ ἐργάτας εἰς τὸν θερισμὸν αὐτοῦ.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/9/#L37-38">Μτ 9:37-38</a>)</blockquote>
