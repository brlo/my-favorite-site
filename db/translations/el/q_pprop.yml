    priority: 2
  update: true
  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <h2>Ο χαρακτήρας των ερίδων</h2><h3>Σαν αρνιά</h3><blockquote><p>«ὑπάγετε· ἰδοὺ <strong>ἀποστέλλω ὑμᾶς</strong> <strong><mark>ὡς ἄρνας</mark></strong> ἐν μέσῳ λύκων. &lt;…&gt; εἰς ἣν δ᾿ ἂν πόλιν εἰσέλθητε καὶ μὴ δέχωνται ὑμᾶς, ἐξελθόντες εἰς τὰς πλατείας αὐτῆς εἴπατε, Καὶ τὸν κονιορτὸν τὸν κολληθέντα ἡμῖν ἐκ τῆς πόλεως ὑμῶν εἰς τοὺς πόδας ἀπομασσόμεθα ὑμῖν· πλὴν τοῦτο γινώσκετε ὅτι ἤγγικεν ἡ βασιλεία τοῦ θεοῦ.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/10/#L3,10-11">Λκ 10:3,10-11</a>)</p></blockquote><blockquote><p>«Ἰδοὺ ἐγὼ <strong>ἀποστέλλω ὑμᾶς <mark>ὡς πρόβατα</mark></strong> ἐν μέσῳ λύκων· <strong>γίνεσθε οὖν <mark>φρόνιμοι</mark> ὡς οἱ ὄφεις</strong> καὶ <strong><mark>ἀκέραιοι</mark> ὡς αἱ περιστεραί</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/10/#L16">Μτ 10:16</a>)</p></blockquote><h3>Πραότητα και αγάπη</h3><blockquote><p>«κύριον δὲ τὸν Χριστὸν ἁγιάσατε ἐν ταῖς καρδίαις ὑμῶν, ἕτοιμοι ἀεὶ <strong>πρὸς ἀπολογίαν παντὶ τῷ αἰτοῦντι ὑμᾶς λόγον περὶ τῆς ἐν ὑμῖν ἐλπίδος, ἀλλὰ μετὰ <mark>πραΰτητος</mark> καὶ φόβου</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/1pet/3/#L15-16">Α Πε 3:15-16</a>)</p></blockquote><blockquote><p>«Ὑπομίμνῃσκε αὐτοὺς ἀρχαῖς ἐξουσίαις ὑποτάσσεσθαι, πειθαρχεῖν, πρὸς πᾶν ἔργον ἀγαθὸν ἑτοίμους εἶναι, <strong>μηδένα βλασφημεῖν, ἀμάχους εἶναι, ἐπιεικεῖς, πᾶσαν ἐνδεικνυμένους <mark>πραΰτητα</mark> πρὸς πάντας ἀνθρώπους</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/tit/3/#L1-2">Τιτ 3:1-2</a>)</p></blockquote><blockquote><p>«ἀλλὰ ἤπιον εἶναι πρὸς πάντας, διδακτικόν, ἀνεξίκακον, <strong>ἐν <mark>πραΰτητι</mark> παιδεύοντα τοὺς ἀντιδιατιθεμένους</strong>, μήποτε δώῃ αὐτοῖς ὁ θεὸς μετάνοιαν εἰς ἐπίγνωσιν ἀληθείας» (<a href="https://bibleox.com/el/gr-lxx-byz/2tim/2/#L22-25">Β Τιμ 2:22-25</a>)</p></blockquote><blockquote><p>«Τίς σοφὸς καὶ ἐπιστήμων ἐν ὑμῖν; δειξάτω <strong>ἐκ τῆς καλῆς ἀναστροφῆς τὰ ἔργα αὐτοῦ ἐν <mark>πραΰτητι</mark> σοφίας</strong>. εἰ δὲ ζῆλον πικρὸν ἔχετε καὶ <strong>ἐριθείαν ἐν τῇ καρδίᾳ ὑμῶν, μὴ κατακαυχᾶσθε καὶ ψεύδεσθε κατὰ τῆς ἀληθείας</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/iak/3/#L13-14">Ιακ 3:13-14</a>)</p></blockquote><blockquote><p>«Αὐτὸς δὲ ἐγὼ Παῦλος <strong>παρακαλῶ ὑμᾶς διὰ τῆς <mark>πραΰτητος</mark> καὶ ἐπιεικείας τοῦ Χριστοῦ</strong>, ὃς κατὰ πρόσωπον μὲν ταπεινὸς ἐν ὑμῖν, ἀπὼν δὲ θαρρῶ εἰς ὑμᾶς·» (<a href="https://bibleox.com/el/gr-lxx-byz/2kor/10/#L1">Β Κορ 10:1</a>)</p></blockquote><blockquote><p>«<strong>Παρακαλῶ οὖν ὑμᾶς ἐγὼ ὁ δέσμιος ἐν κυρίῳ ἀξίως περιπατῆσαι τῆς κλήσεως ἧς ἐκλήθητε, μετὰ πάσης ταπεινοφροσύνης καὶ <mark>πραΰτητος</mark>, μετὰ μακροθυμίας</strong>, ἀνεχόμενοι ἀλλήλων ἐν ἀγάπῃ» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/4/#L1-2">Εφ 4:1-2</a>)</p></blockquote><blockquote><p>«<strong>τὸ δὲ τέλος τῆς παραγγελίας ἐστὶν <mark>ἀγάπη</mark></strong> ἐκ καθαρᾶς καρδίας καὶ συνειδήσεως ἀγαθῆς καὶ πίστεως ἀνυποκρίτου, ὧν τινες ἀστοχήσαντες ἐξετράπησαν εἰς ματαιολογίαν, θέλοντες εἶναι νομοδιδάσκαλοι, μὴ νοοῦντες μήτε ἃ λέγουσιν μήτε περὶ τίνων διαβεβαιοῦνται.» (<a href="https://bibleox.com/el/gr-lxx-byz/1tim/1/#L5-7">Α Τιμ 1:5-7</a>)</p></blockquote><blockquote><p>«Ἐὰν ταῖς γλώσσαις τῶν ἀνθρώπων λαλῶ καὶ τῶν ἀγγέλων, ἀγάπην δὲ μὴ ἔχω, γέγονα χαλκὸς ἠχῶν ἢ κύμβαλον ἀλαλάζον. <strong>καὶ ἐὰν</strong> ἔχω προφητείαν <strong>καὶ εἰδῶ τὰ μυστήρια πάντα καὶ πᾶσαν τὴν γνῶσιν, κἂν ἔχω πᾶσαν τὴν πίστιν ὥστε ὄρη μεθιστάναι, <mark>ἀγάπην δὲ μὴ ἔχω, οὐθέν εἰμι</mark></strong>. <strong>κἂν ψωμίσω πάντα τὰ ὑπάρχοντά μου, καὶ ἐὰν παραδῶ τὸ σῶμά μου ἵνα καυχήσωμαι, <mark>ἀγάπην δὲ μὴ ἔχω, οὐδὲν ὠφελοῦμαι</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/13/#L1-3">Α Κορ 13:1-3</a>)</p></blockquote><blockquote><p>«<strong><mark>ἡ δὲ ἄνωθεν σοφία πρῶτον μὲν ἁγνή ἐστιν, ἔπειτα εἰρηνική, ἐπιεικής, εὐπειθής, μεστὴ ἐλέους καὶ καρπῶν ἀγαθῶν, ἀδιάκριτος, ἀνυπόκριτος</mark></strong>· καρπὸς δὲ δικαιοσύνης ἐν εἰρήνῃ σπείρεται τοῖς ποιοῦσιν εἰρήνην.» (<a href="https://bibleox.com/el/gr-lxx-byz/iak/3/#L17-18">Ιακ 3:17-18</a>)</p></blockquote><h2>Να αποφεύγουμε τις ανόητες ζητήσεις</h2><blockquote><p>«δίωκε δὲ δικαιοσύνην, πίστιν, ἀγάπην, εἰρήνην μετὰ τῶν ἐπικαλουμένων τὸν κύριον ἐκ καθαρᾶς καρδίας. <strong><mark>τὰς δὲ μωρὰς καὶ ἀπαιδεύτους ζητήσεις παραιτοῦ</mark></strong>, εἰδὼς ὅτι <strong>γεννῶσιν μάχας</strong>· δοῦλον δὲ κυρίου <strong>οὐ δεῖ μάχεσθαι</strong>, ἀλλὰ ἤπιον εἶναι πρὸς πάντας, διδακτικόν, ἀνεξίκακον, ἐν πραΰτητι παιδεύοντα τοὺς ἀντιδιατιθεμένους, μήποτε δώῃ αὐτοῖς ὁ θεὸς μετάνοιαν εἰς ἐπίγνωσιν ἀληθείας» (<a href="https://bibleox.com/el/gr-lxx-byz/2tim/2/#L22-25">Β Τιμ 2:22-25</a>)</p></blockquote><blockquote><p>«εἴ τις ἑτεροδιδασκαλεῖ καὶ μὴ προσέρχεται ὑγιαίνουσιν λόγοις, τοῖς τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, καὶ τῇ κατ᾿ εὐσέβειαν διδασκαλίᾳ, τετύφωται, μηδὲν ἐπιστάμενος, ἀλλὰ <strong><mark>νοσῶν περὶ ζητήσεις καὶ λογομαχίας</mark>, ἐξ ὧν γίνεται φθόνος, ἔρις, βλασφημίαι, ὑπόνοιαι πονηραί</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/1tim/6/#L3-4">Α Τιμ 6:3-4</a>)</p></blockquote><blockquote><p>«Ταῦτα ὑπομίμνῃσκε, διαμαρτυρόμενος ἐνώπιον τοῦ θεοῦ <strong><mark>μὴ λογομαχεῖν</mark></strong>, <strong>ἐπ᾿ οὐδὲν χρήσιμον, ἐπὶ καταστροφῇ τῶν ἀκουόντων</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/2tim/2/#L14">Β Τιμ 2:14</a>)</p></blockquote><blockquote><p>«<strong><mark>μωρὰς δὲ ζητήσεις</mark> καὶ γενεαλογίας καὶ ἔριν καὶ μάχας νομικὰς <mark>περιΐστασο</mark>, εἰσὶν γὰρ ἀνωφελεῖς καὶ μάταιοι</strong>. <strong><mark>αἱρετικὸν</mark> ἄνθρωπον μετὰ μίαν καὶ δευτέραν νουθεσίαν <mark>παραιτοῦ</mark></strong>, εἰδὼς ὅτι ἐξέστραπται ὁ τοιοῦτος καὶ ἁμαρτάνει, ὢν αὐτοκατάκριτος.» (<a href="https://bibleox.com/el/gr-lxx-byz/tit/3/#L9-11">Τιτ 3:9-11</a>)</p></blockquote>
