  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <p>Ο απόστολος Παύλος δίδασκε για τρία χρόνια τους πρεσβυτέρους της Ασίας:</p><blockquote><p>«διὸ γρηγορεῖτε, μνημονεύοντες ὅτι <strong>τριετίαν νύκτα καὶ ἡμέραν οὐκ ἐπαυσάμην</strong> μετὰ δακρύων νουθετῶν ἕνα ἕκαστον.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/20/#L31">Πραξ 20:31</a>)</p></blockquote><p>Ο απόστολος Παύλος δίδασκε τους χριστιανούς στην Έφεσο για δύο χρόνια και τρεις μήνες:</p><blockquote><p>«Εἰσελθὼν δὲ εἰς τὴν συναγωγὴν ἐπαρρησιάζετο <strong>ἐπὶ μῆνας τρεῖς</strong> διαλεγόμενος καὶ πείθων περὶ τῆς βασιλείας τοῦ θεοῦ. ὡς δέ τινες ἐσκληρύνοντο καὶ ἠπείθουν κακολογοῦντες τὴν ὁδὸν ἐνώπιον τοῦ πλήθους, ἀποστὰς ἀπ᾿ αὐτῶν ἀφώρισεν τοὺς μαθητάς, καθ᾿ ἡμέραν διαλεγόμενος ἐν τῇ σχολῇ Τυράννου. τοῦτο δὲ ἐγένετο <strong>ἐπὶ ἔτη δύο</strong>, ὥστε πάντας τοὺς κατοικοῦντας τὴν Ἀσίαν ἀκοῦσαι τὸν λόγον τοῦ κυρίου, Ἰουδαίους τε καὶ Ἕλληνας.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/19/#L8-10">Πραξ 19:8-10</a>)</p></blockquote>
