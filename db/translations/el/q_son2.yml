  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <h2>Ο Μονογενής — ο μόνος Υιός του Πατέρα</h2><p>Ο Μονογενής είναι ο μόνος γεννημένος. Δηλαδή, όπως γεννήθηκε ο Υιός του Θεού, δεν έχει γεννηθεί κανείς άλλος.</p><blockquote><p>«Καὶ <strong>ὁ λόγος σὰρξ ἐγένετο</strong> καὶ ἐσκήνωσεν ἐν ἡμῖν, καὶ ἐθεασάμεθα τὴν δόξαν αὐτοῦ, δόξαν ὡς <strong>μονογενοῦς παρὰ πατρός</strong>, πλήρης χάριτος καὶ ἀληθείας.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/1/#L14">Ιω 1:14</a>)</p></blockquote><blockquote><p>«θεὸν οὐδεὶς ἑώρακεν πώποτε· <strong>μονογενὴς θεὸς</strong> ὁ ὢν εἰς τὸν κόλπον τοῦ πατρὸς ἐκεῖνος ἐξηγήσατο.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/1/#L18">Ιω 1:18</a>)</p></blockquote><blockquote><p>«Οὕτως γὰρ ἠγάπησεν ὁ <strong>θεὸς</strong> τὸν κόσμον, ὥστε <strong>τὸν υἱὸν τὸν μονογενῆ ἔδωκεν</strong>, ἵνα πᾶς ὁ πιστεύων εἰς αὐτὸν μὴ ἀπόληται ἀλλ᾿ ἔχῃ ζωὴν αἰώνιον.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/3/#L16">Ιω 3:16</a>)</p></blockquote><blockquote><p>«ὁ πιστεύων εἰς αὐτὸν οὐ κρίνεται· ὁ [δὲ] μὴ πιστεύων ἤδη κέκριται, ὅτι μὴ πεπίστευκεν εἰς τὸ ὄνομα <strong>τοῦ μονογενοῦς υἱοῦ τοῦ θεοῦ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/3/#L18">Ιω 3:18</a>)</p></blockquote><blockquote><p>«ὅτε δὲ ἦλθεν τὸ πλήρωμα τοῦ χρόνου, <strong>ἐξαπέστειλεν ὁ θεὸς τὸν υἱὸν αὐτοῦ</strong>, γενόμενον ἐκ γυναικός, γενόμενον ὑπὸ νόμον,» (<a href="https://bibleox.com/el/gr-lxx-byz/gal/4/#L4">Γαλ 4:4</a>)</p></blockquote><blockquote><p>«ἐν τούτῳ ἐφανερώθη ἡ ἀγάπη τοῦ θεοῦ ἐν ἡμῖν, ὅτι <strong>τὸν υἱὸν αὐτοῦ τὸν μονογενῆ</strong> ἀπέσταλκεν ὁ θεὸς εἰς τὸν κόσμον ἵνα ζήσωμεν δι᾿ αὐτοῦ.» (<a href="https://bibleox.com/el/gr-lxx-byz/1in/4/#L9">Α Ιω 4:9</a>)</p></blockquote><p>Η θυσία του μονογενούς γιου του Αβραάμ είναι τύπος της θυσίας του μονογενούς Υιού του Θεού στον σταυρό:</p><blockquote><p>«Πίστει προσενήνοχεν Ἀβραὰμ τὸν Ἰσαὰκ πειραζόμενος, καὶ <strong>τὸν μονογενῆ προσέφερεν</strong> ὁ τὰς ἐπαγγελίας ἀναδεξάμενος,» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/11/#L17">Εβρ 11:17</a>)</p></blockquote><h2>Ο Ιησούς Χριστός είναι ο Πρωτότοκος</h2><p>Ο Χριστός ονομάζεται Πρωτότοκος δύο φορές:</p><blockquote><p>«ὅτι οὓς προέγνω, καὶ προώρισεν συμμόρφους τῆς εἰκόνος τοῦ υἱοῦ αὐτοῦ, εἰς τὸ εἶναι αὐτὸν <strong>πρωτότοκον ἐν πολλοῖς ἀδελφοῖς</strong>·» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/8/#L29">Ρωμ 8:29</a>)</p></blockquote><blockquote><p>«ὅταν δὲ πάλιν εἰσαγάγῃ τὸν <strong>πρωτότοκον</strong> εἰς τὴν οἰκουμένην, λέγει, Καὶ προσκυνησάτωσαν αὐτῷ πάντες ἄγγελοι θεοῦ.» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/1/#L6">Εβρ 1:6</a>)</p></blockquote><p>Γιατί ο Χριστός είναι Πρωτότοκος; Επειδή είναι ο πρώτος που αναστήθηκε από τους νεκρούς:</p><blockquote><p>«καὶ αὐτός ἐστιν ἡ κεφαλὴ τοῦ σώματος, τῆς ἐκκλησίας· ὅς ἐστιν ἀρχή, <strong>πρωτότοκος ἐκ τῶν νεκρῶν</strong>, ἵνα γένηται ἐν πᾶσιν αὐτὸς πρωτεύων,» (<a href="https://bibleox.com/el/gr-lxx-byz/kol/1/#L18">Κολ 1:18</a>)</p></blockquote><blockquote><p>«καὶ ἀπὸ Ἰησοῦ Χριστοῦ, ὁ μάρτυς ὁ πιστός, ὁ <strong>πρωτότοκος τῶν νεκρῶν</strong> καὶ ὁ ἄρχων τῶν βασιλέων τῆς γῆς. Τῷ ἀγαπῶντι ἡμᾶς καὶ λύσαντι ἡμᾶς ἐκ τῶν ἁμαρτιῶν ἡμῶν ἐν τῷ αἵματι αὐτοῦ —» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/1/#L5">Απ 1:5</a>)</p></blockquote><blockquote><p>«εἰ παθητὸς ὁ Χριστός, εἰ <strong>πρῶτος ἐξ ἀναστάσεως νεκρῶν</strong> φῶς μέλλει καταγγέλλειν τῷ τε λαῷ καὶ τοῖς ἔθνεσιν.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/26/#L23">Πραξ 26:23</a>)</p></blockquote><h2>Παρεμπιπτόντως</h2><p>Σύμφωνα με το Ισλάμ, ο Αλλάχ δεν γέννησε και δεν γεννήθηκε:</p><blockquote><p>«Αυτός (ο Αλλάχ) δεν γέννησε και δεν γεννήθηκε». Κοράνι, σούρα 112, εδάφιο 3.</p></blockquote>
