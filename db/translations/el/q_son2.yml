    title: Ο Χριστός δεν είναι ο αρχάγγελος Μιχαήλ
    priority: 16
  update: true
  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: '<h2>Πρόλογος</h2><p>Πρώτα πρέπει να εξηγήσουμε ότι αυτή η γνώμη (ότι ο Χριστός είναι ο αρχάγγελος Μιχαήλ) υπάρχει στην ολοκληρωτική σέχτα των «Μαρτύρων του Ιεχωβά». Οι Μάρτυρες του Ιεχωβά, για να δικαιολογήσουν τις διδασκαλίες τους, δημιούργησαν τη δική τους μετάφραση της Γραφής με σημαντικές διαστρεβλώσεις (<em>κριτικές ειδικών για τη μετάφραση «Νέου Κόσμου» των Μαρτύρων του Ιεχωβά</em>). Επίσης, οι Αντβεντιστές πιστεύουν ότι εκείνος που στην Παλαιά Διαθήκη εμφανίζεται ως αρχάγγελος Μιχαήλ είναι δήθεν ο Υιός του Θεού, ο Ιησούς Χριστός.</p><h2>Οι δύο έννοιες της λέξης «άγγελος»</h2><p>Στη Βίβλο συναντάμε δύο έννοιες της λέξης <em>άγγελος</em>: τη λειτουργία και τη φύση.</p><p><strong>Η λειτουργία</strong> του αγγέλου είναι η αποστολή, γιατί αυτή η αρχαία ελληνική λέξη σημαίνει ακριβώς αυτό: ἄγγελος — αγγελιοφόρος, μηνυτής· εβρ. ‏מלאך‏‎ — απεσταλμένος.</p><p><strong>Η φύση</strong> του αγγέλου είναι το ασώματο πνεύμα. Άγγελοι ονομάζονται ορισμένα κτιστά από τον Θεό πνευματικά όντα, που δεν έχουν σώμα (ασώματα), ή αλλιώς — πνεύματα. Αυτά τα πνεύματα κτίστηκαν πριν από τον άνθρωπο, προικίστηκαν με ελευθερία και νου. Μερικά από αυτά δεν θέλησαν να ζήσουν σε υπακοή στον Θεό, έπεσαν από Αυτόν, αλλά και πάλι ονομάζονται άγγελοι (<a href="https://bibleox.com/el/gr-lxx-byz/mf/25/#L41">Μτ 25:41</a>). Δηλαδή, έχουμε μια φύση ανεξάρτητη από το είδος της δραστηριότητας. Στάλθηκε ή δεν στάλθηκε, και πάλι άγγελος είναι. Τέτοια είναι η φύση. Έτσι, άγγελος ονομάζεται και ένας συγκεκριμένος άνθρωπος, γεννημένος από άνθρωπο — ο προφήτης Ιωάννης ο Βαπτιστής (<a href="https://bibleox.com/el/gr-lxx-byz/mal/3/#L1">Μαλ 3:1</a> · <a href="https://bibleox.com/el/gr-lxx-byz/mf/11/#L10">Μτ 11:10</a> · <a href="https://bibleox.com/el/gr-lxx-byz/mk/1/#L2">Μκ 1:2</a> · <a href="https://bibleox.com/el/gr-lxx-byz/lk/7/#L27">Λκ 7:27</a>). Με την ίδια έννοια, εκεί, και ο ίδιος ο Χριστός ονομάζεται Άγγελος της Καινής Διαθήκης (<a href="https://bibleox.com/el/gr-lxx-byz/mal/3/#L1">Μαλ 3:1</a>). Αυτό το ξεκαθαρίσαμε. Τώρα στις περικοπές.</p><h2>Όλοι οι άγγελοι είναι λειτουργικά πνεύματα, ενώ ο Χριστός κάθεται στον θρόνο</h2><p>Ο απόστολος Παύλος ονομάζει τον Υιό του Θεού ον πολύ ανώτερο από τους αγγέλους (<a href="https://bibleox.com/el/gr-lxx-byz/evr/1/#L4">Εβρ 1:4</a>), γιατί ο Θεός δεν απευθύνεται στους αγγέλους όπως στον Υιό Του (<a href="https://bibleox.com/el/gr-lxx-byz/evr/1/#L5">Εβρ 1:5</a>), όλοι οι άγγελοι θα προσκυνήσουν τον Υιό του Θεού (<a href="https://bibleox.com/el/gr-lxx-byz/evr/1/#L6">Εβρ 1:6</a>), δείχνει τη διαφορά του λόγου του Θεού για τους αγγέλους και για τον Υιό του Θεού: οι μεν είναι λειτουργικά όντα, ο δε είναι ο Κυβερνήτης που κάθεται στον θρόνο (<a href="https://bibleox.com/el/gr-lxx-byz/evr/1/#L7-8">Εβρ 1:7-8</a> και <a href="https://bibleox.com/el/gr-lxx-byz/evr/1/#L13">Εβρ 1:13</a>), υποδεικνύεται η προσωρινότητα όλων των κτιστών, αλλά ο Υιός του Θεού, που δημιούργησε τα πάντα, δεν θα εκλείψει ποτέ (<a href="https://bibleox.com/el/gr-lxx-byz/evr/1/#L10-12">Εβρ 1:10-12</a>). Τέλος, λέγεται ρητά ότι όλοι ανεξαιρέτως οι άγγελοι είναι λειτουργικά πνεύματα, αλλά ο Υιός κάθεται στον θρόνο με τον Πατέρα:</p><blockquote><p>«<strong>πρὸς τίνα δὲ τῶν ἀγγέλων εἴρηκέν ποτε, Κάθου ἐκ δεξιῶν μου</strong> ἕως ἂν θῶ τοὺς ἐχθρούς σου ὑποπόδιον τῶν ποδῶν σου; οὐχὶ <strong>πάντες</strong> <strong>εἰσὶν λειτουργικὰ πνεύματα</strong> εἰς διακονίαν ἀποστελλόμενα διὰ τοὺς μέλλοντας κληρονομεῖν σωτηρίαν;» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/1/#L13-14">Εβρ 1:13-14</a>)</p></blockquote><p>Στον Υιό υπηρετούν, ενώ ο Υιός βασιλεύει με τον Πατέρα.</p><h2>Στον Θεό θα προσκυνήσει η ανθρωπότητα, στον Χριστό θα προσκυνήσει όλη η κτίση</h2><p>Ο Θεός λέει ότι μπροστά Του θα λυγίσει κάθε γόνατο (<a href="https://bibleox.com/el/gr-lxx-byz/rim/14/#L11">Ρωμ 14:11</a>), ενώ στον Χριστό θα προσκυνήσει όλη η κτίση, και όχι μόνο οι άνθρωποι (<a href="https://bibleox.com/el/gr-lxx-byz/fil/2/#L10">Φιλ 2:10</a>), μαζί και οι άγγελοι (<a href="https://bibleox.com/el/gr-lxx-byz/evr/1/#L6">Εβρ 1:6</a>).</p><h2>Ο κόσμος υποτάχθηκε στον Χριστό, όχι στους αγγέλους</h2><blockquote><p>«<strong>Οὐ γὰρ ἀγγέλοις ὑπέταξεν τὴν οἰκουμένην τὴν μέλλουσαν</strong>, περὶ ἧς λαλοῦμεν.» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/2/#L5">Εβρ 2:5</a>)</p></blockquote><p>Παράλληλα, ο κόσμος υποτάχθηκε στον Χριστό:</p><blockquote><p>«πάντα γὰρ ὑπέταξεν ὑπὸ τοὺς πόδας αὐτοῦ. ὅταν δὲ εἴπῃ ὅτι πάντα ὑποτέτακται, δῆλον ὅτι ἐκτὸς τοῦ ὑποτάξαντος αὐτῷ τὰ πάντα.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/15/#L27">Α Κορ 15:27</a>)</p></blockquote><blockquote><p>«καὶ πάντα ὑπέταξεν ὑπὸ τοὺς πόδας αὐτοῦ, καὶ αὐτὸν ἔδωκεν κεφαλὴν ὑπὲρ πάντα τῇ ἐκκλησίᾳ,» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/1/#L22">Εφ 1:22</a>)</p></blockquote><blockquote><p>«πάντα ὑπέταξας ὑποκάτω τῶν ποδῶν αὐτοῦ. ἐν τῷ γὰρ ὑποτάξαι [αὐτῷ] τὰ πάντα οὐδὲν ἀφῆκεν αὐτῷ ἀνυπότακτον. νῦν δὲ οὔπω ὁρῶμεν αὐτῷ τὰ πάντα ὑποτεταγμένα·» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/2/#L8">Εβρ 2:8</a>)</p></blockquote><h2>Παντοκράτορας, Βασιλιάς των Βασιλέων, Κύριος των Κυρίων</h2><p>Άρα, διαπιστώσαμε ότι όλοι οι άγγελοι είναι λειτουργικά πνεύματα, ενώ ο Υιός του Θεού, ο Ιησούς Χριστός, φέρει τους ίδιους τίτλους που πολλές φορές αποδίδονται στον Θεό: Παντοκράτορας, Βασιλιάς των Βασιλέων, Κύριος των Κυρίων. Οι προφήτες ονομάζουν <strong>τον Θεό</strong> Κύριο των Κυρίων (<a href="https://bibleox.com/el/gr-lxx-byz/ps/135/#L2-3">Ψλ 135:2-3</a>). Οι απόστολοι ονομάζουν <strong>τον Θεό</strong> Κύριο των Κυρίων και Βασιλιά των Βασιλέων (<a href="https://bibleox.com/el/gr-lxx-byz/1tim/6/#L15-16">Α Τιμ 6:15-16</a>). Οι απόστολοι ονομάζουν <strong>τον Ιησού Χριστό</strong> Κύριο των Κυρίων και Βασιλιά των Βασιλέων (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/17/#L14">Απ 17:14</a> · <a href="https://bibleox.com/el/gr-lxx-byz/otkr/19/#L16">Απ 19:16</a>), Παντοκράτορα (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/1/#L8">Απ 1:8</a>). Πάνω από τον Βασιλιά των Βασιλέων δεν υπάρχει άλλος βασιλιάς. Πάνω από τον Κύριο των Κυρίων δεν υπάρχει άλλος κύριος. Πάνω από τον Παντοκράτορα δεν υπάρχει κανείς που να περιέχει τον Παντοκράτορα, γιατί Αυτός τα περιέχει όλα με τον εαυτό Του. Ο αρχάγγελος Μιχαήλ είναι ο αρχηγός της αγγελικής στρατιάς. Ο Χριστός είναι ο αρχηγός όλων ανεξαιρέτως των όντων, μαζί με τους αγγέλους και τον ίδιο τον αρχάγγελο Μιχαήλ.</p><h2>Ο Θεός (Γιαχβέ) έστελνε προσωπικά τους προφήτες, και ο Χριστός λέει ότι Αυτός τους έστελνε</h2><p>Σημαντικό είναι να πούμε ότι ο Χριστός δηλώνει πως Αυτός είναι εκείνος που έστελνε στον Ισραήλ πλήθος προφητών (<a href="https://bibleox.com/el/gr-lxx-byz/mf/23/#L34">Μτ 23:34</a>). Και η Γραφή μας πληροφορεί ότι ο ίδιος ο Θεός προσωπικά (και όχι μέσω αγγέλων) απευθυνόταν στους προφήτες και τους έστελνε προσωπικά στον Ισραήλ (<a href="https://bibleox.com/el/gr-lxx-byz/ish/3/#L12">Έξ 3:12</a> · <a href="https://bibleox.com/el/gr-lxx-byz/mal/3/#L19,22">Μαλ 3:19,22</a> · <a href="https://bibleox.com/el/gr-lxx-byz/sud/6/#L8">Κρ 6:8</a> · <a href="https://bibleox.com/el/gr-lxx-byz/2par/25/#L15">Β Παρ 25:15</a> · <a href="https://bibleox.com/el/gr-lxx-byz/1ts/15/#L1">Α Βασ 15:1</a> · <a href="https://bibleox.com/el/gr-lxx-byz/2ts/12/#L1">Β Βασ 12:1</a> · <a href="https://bibleox.com/el/gr-lxx-byz/2ts/12/#L24-25">Β Βασ 12:24-25</a> · <a href="https://bibleox.com/el/gr-lxx-byz/ier/7/#L25">Ιερ 7:25</a>). Δηλαδή ο Χριστός είναι ο Θεός Γιαχβέ. Δεν υπήρχαν μεσολαβητές στην επικοινωνία του Θεού με τους προφήτες.</p><h2>Ο Υιός του Θεού, που γεννιέται από τον Πατέρα, δημιούργησε τους αγγέλους</h2><p>Ο Χριστός είναι ο Δημιουργός όλων των ορατών και αοράτων, μαζί και των αγγέλων (<a href="https://bibleox.com/el/gr-lxx-byz/kol/1/#L13-17">Κολ 1:13-17</a>). Δηλαδή, για να είναι άγγελος, θα έπρεπε να δημιουργήσει και τον ίδιο τον εαυτό Του.</p><h2>Ετυμολογία του ονόματος «Μιχαήλ»</h2><p>Ο Μιχαήλ είναι εβραϊκό όνομα, προέρχεται από τις λέξεις εβρ. ‏מי כמו אלוהים‏‎ (μι κάμο ελοχίμ, συντομευμένα «Μι-κα-έλ»), κατά λέξη — «Ποιος είναι όπως ο Θεός». Δηλαδή — κανείς δεν είναι ίσος με τον Θεό, κανείς δεν μπορεί να συγκριθεί με Αυτόν. Αλλά ο Χριστός δεν θεώρησε αρπαγμό το να είναι ίσος με τον Θεό (<a href="https://bibleox.com/el/gr-lxx-byz/fil/2/#L6">Φιλ 2:6</a>).</p><h2>Η Παλαιά Διαθήκη δόθηκε μέσω αγγέλων, η Καινή κηρύχθηκε από τον Κύριο</h2><p>Ο απόστολος Παύλος δείχνει τη διαφορά Παλαιάς και Καινής Διαθήκης. Η Παλαιά δόθηκε μέσω αγγέλων (<a href="https://bibleox.com/el/gr-lxx-byz/evr/2/#L2">Εβρ 2:2</a>), ενώ η Καινή κηρύχθηκε προσωπικά από τον ίδιο τον Κύριο (<a href="https://bibleox.com/el/gr-lxx-byz/evr/2/#L3">Εβρ 2:3</a>). Δηλαδή, τουλάχιστον όχι μέσω αγγέλων.</p><h2>Ο Θεός, αφού έγινε άνθρωπος, έδειξε τον εαυτό Του στους αγγέλους</h2><blockquote><p>«<em>καὶ ὁμολογουμένως μέγα ἐστὶν τὸ τῆς εὐσεβείας μυστήριον</em>· Ὃς <strong><em>ἐφανερώθη ἐν σαρκί</em></strong>, <em>ἐδικαιώθη ἐν πνεύματι</em>, <strong><em>ὤφθη ἀγγέλοις</em></strong>, <em>ἐκηρύχθη ἐν ἔθνεσιν, ἐπιστεύθη ἐν κόσμῳ, ἀνελήμφθη ἐν δόξῃ</em>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1tim/3/#L16">Α Τιμ 3:16</a>)</p></blockquote><p>Τον Θεό δεν τον είδε ποτέ κανείς (<a href="https://bibleox.com/el/gr-lxx-byz/in/1/#L18">Ιω 1:18</a>), κατοικεί σε απρόσιτο φως, είναι αδύνατο στον άνθρωπο να δει τον Θεό (<a href="https://bibleox.com/el/gr-lxx-byz/1tim/6/#L16">Α Τιμ 6:16</a>), αλλά γεννιέται αληθινός άνθρωπος (<a href="https://bibleox.com/el/gr-lxx-byz/in/1/#L14">Ιω 1:14</a>), ο Θεός γίνεται ορατός εν Χριστώ για όλους. Ο άνθρωπος δεν μπορεί με σαρκικά μάτια να δει τους κατοίκους του πνευματικού κόσμου (τους αγγέλους), αλλά ο Χριστός λέει ότι είδε τον πεσόντα από τον ουρανό Σατανά (<a href="https://bibleox.com/el/gr-lxx-byz/lk/10/#L18">Λκ 10:18</a>). Επίσης, οι άγγελοι εμφανίζονται σε διάφορους καιρούς, σε διάφορους τόπους, σε διαφορετικούς ανθρώπους, και η Γραφή δεν δίνει σ'' αυτό το γεγονός (στην ίδια την εμφάνιση του αγγέλου) απολύτως καμία σημασία, δηλαδή δεν λέει κάτι σαν: «έδειξε τον εαυτό Του στους αγγέλους». Εμφανίστηκε και εμφανίστηκε.</p><h2>Οι άγγελοι είναι κτιστοί, ο Υιός του Θεού γεννητός. Και όχι απλώς γεννητός, αλλά κανένας άλλος δεν γεννήθηκε από τον Θεό Πατέρα όπως ο Μονογενής Υιός</h2><p>Δηλώνεται ότι ο Υιός του Θεού δεν είναι κτιστός, αλλά γεννημένος από τον Θεό, και ό,τι έχει κτιστεί, κτίστηκε αργότερα από τον Υιό (<a href="https://bibleox.com/el/gr-lxx-byz/kol/1/#L15-16">Κολ 1:15-16</a>). Παράλληλα, ο Υιός του Θεού είναι ο Μονογενής Υιός (<a href="https://bibleox.com/el/gr-lxx-byz/in/1/#L18">Ιω 1:18</a>), που σημαίνει ότι κανείς άλλος δεν είναι υιός στον Πατέρα όπως ο Μονογενής Υιός. Διακρίνουμε τις λέξεις «δημιούργησα» και «γέννησα». Μπορείς να δημιουργήσεις ό,τι θέλεις, αλλά να γεννήσεις μόνο κάτι όμοιο με τον εαυτό σου. Την ίδια φύση: το ψάρι — ψάρι, ο άνθρωπος — άνθρωπο, ο Θεός — Θεό. Από την ελιά δεν γεννιούνται πορτοκάλια.</p><h2>Συμπέρασμα</h2><p>Ο Χριστός δεν είναι ο αρχάγγελος Μιχαήλ, αλλά Θεός. Και πολλές φορές ονομάζεται ρητά Θεός. Η Γραφή το λέει καθαρά: «Ο Χριστός είναι Θεός».</p><blockquote><p>«<strong>Ἄκουσον, λαός μου</strong>, καὶ λαλήσω σοι, Ισραηλ, καὶ διαμαρτύρομαί σοι· <strong>ὁ θεὸς ὁ θεός σού εἰμι ἐγώ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/49/#L7">Ψλ 49:7</a>)</p></blockquote>'
