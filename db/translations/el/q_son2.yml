  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: '<h2>Ο Υιός του Θεού ήταν προορισμένος για τη θυσία πριν από τη δημιουργία του κόσμου</h2><blockquote><p>«ὡς ἀμνοῦ ἀμώμου καὶ ἀσπίλου Χριστοῦ, <strong>προεγνωσμένου μὲν πρὸ καταβολῆς κόσμου</strong>, φανερωθέντος δὲ ἐπ᾿ ἐσχάτου τῶν χρόνων δι᾿ ὑμᾶς» (<a href="https://bibleox.com/el/gr-lxx-byz/1pet/1/#L19-20">Α Πε 1:19-20</a>)</p></blockquote><h2>Η ευλογία του Αβραάμ</h2><blockquote><p>«Χριστὸς ἡμᾶς ἐξηγόρασεν ἐκ τῆς κατάρας τοῦ νόμου γενόμενος ὑπὲρ ἡμῶν κατάρα, ὅτι γέγραπται, Ἐπικατάρατος πᾶς ὁ κρεμάμενος ἐπὶ ξύλου, <strong>ἵνα εἰς τὰ ἔθνη ἡ εὐλογία τοῦ Ἀβραὰμ γένηται ἐν Χριστῷ Ἰησοῦ</strong>, ἵνα τὴν ἐπαγγελίαν τοῦ πνεύματος λάβωμεν διὰ τῆς πίστεως.» (<a href="https://bibleox.com/el/gr-lxx-byz/gal/3/#L13-14">Γαλ 3:13-14</a>)</p></blockquote><h2>Η λύτρωση</h2><blockquote><p>«εἰδότες ὅτι οὐ φθαρτοῖς, ἀργυρίῳ ἢ χρυσίῳ <strong>ἐλυτρώθητε</strong> ἐκ τῆς ματαίας ὑμῶν ἀναστροφῆς πατροπαραδότου, ἀλλὰ τιμίῳ <strong>αἵματι ὡς ἀμνοῦ ἀμώμου καὶ ἀσπίλου Χριστοῦ</strong>,» (<a href="https://bibleox.com/el/gr-lxx-byz/1pet/1/#L18-19">Α Πε 1:18-19</a>)</p></blockquote><blockquote><p>«<strong>Χριστὸς ἡμᾶς ἐξηγόρασεν ἐκ τῆς κατάρας τοῦ νόμου</strong> γενόμενος ὑπὲρ ἡμῶν κατάρα, ὅτι γέγραπται, Ἐπικατάρατος πᾶς ὁ κρεμάμενος ἐπὶ ξύλου,» (<a href="https://bibleox.com/el/gr-lxx-byz/gal/3/#L13">Γαλ 3:13</a>)</p></blockquote><blockquote><p>«οὕτως καὶ ὁ <strong>Χριστός, ἅπαξ προσενεχθεὶς εἰς τὸ πολλῶν ἀνενεγκεῖν ἁμαρτίας</strong>, ἐκ δευτέρου χωρὶς ἁμαρτίας ὀφθήσεται τοῖς αὐτὸν ἀπεκδεχομένοις εἰς σωτηρίαν.» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/9/#L28">Εβρ 9:28</a>)</p></blockquote><h2>Η συμφιλίωση</h2><blockquote><p>«<strong>Αὐτὸς γάρ ἐστιν ἡ εἰρήνη ἡμῶν, ὁ ποιήσας τὰ ἀμφότερα ἓν</strong> καὶ τὸ μεσότοιχον τοῦ φραγμοῦ λύσας, <strong>τὴν ἔχθραν, ἐν τῇ σαρκὶ αὐτοῦ</strong>, τὸν νόμον τῶν ἐντολῶν ἐν δόγμασιν καταργήσας, ἵνα τοὺς δύο κτίσῃ ἐν αὑτῷ εἰς ἕνα καινὸν ἄνθρωπον ποιῶν εἰρήνην, καὶ <strong>ἀποκαταλλάξῃ τοὺς ἀμφοτέρους ἐν ἑνὶ σώματι τῷ θεῷ διὰ τοῦ σταυροῦ, ἀποκτείνας τὴν ἔχθραν ἐν αὐτῷ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/2/#L14-16">Εφ 2:14-16</a>)</p></blockquote><blockquote><p>«εἰ γὰρ ἐχθροὶ ὄντες <strong>κατηλλάγημεν τῷ θεῷ διὰ τοῦ θανάτου τοῦ υἱοῦ αὐτοῦ</strong>, πολλῷ μᾶλλον καταλλαγέντες σωθησόμεθα ἐν τῇ ζωῇ αὐτοῦ·» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/5/#L10">Ρωμ 5:10</a>)</p></blockquote><blockquote><p>«τὰ δὲ πάντα ἐκ τοῦ θεοῦ <strong>τοῦ καταλλάξαντος ἡμᾶς ἑαυτῷ διὰ Χριστοῦ</strong> καὶ δόντος ἡμῖν τὴν διακονίαν τῆς καταλλαγῆς,» (<a href="https://bibleox.com/el/gr-lxx-byz/2kor/5/#L18">Β Κορ 5:18</a>)</p></blockquote><blockquote><p>«ὡς ὅτι <strong>θεὸς ἦν ἐν Χριστῷ κόσμον καταλλάσσων ἑαυτῷ</strong>, μὴ λογιζόμενος αὐτοῖς τὰ παραπτώματα αὐτῶν, καὶ θέμενος ἐν ἡμῖν τὸν λόγον τῆς καταλλαγῆς.» (<a href="https://bibleox.com/el/gr-lxx-byz/2kor/5/#L19">Β Κορ 5:19</a>)</p></blockquote><blockquote><p>«καὶ <strong>δι᾿ αὐτοῦ ἀποκαταλλάξαι τὰ πάντα εἰς αὐτόν</strong>, εἰρηνοποιήσας διὰ τοῦ αἵματος τοῦ σταυροῦ αὐτοῦ, [δι᾿ αὐτοῦ] εἴτε τὰ ἐπὶ τῆς γῆς εἴτε τὰ ἐν τοῖς οὐρανοῖς.» (<a href="https://bibleox.com/el/gr-lxx-byz/kol/1/#L20">Κολ 1:20</a>)</p></blockquote><blockquote><p>«νυνὶ δὲ <strong>ἀποκατηλλάγητε ἐν τῷ σώματι τῆς σαρκὸς αὐτοῦ διὰ τοῦ θανάτου, παραστῆσαι ὑμᾶς ἁγίους</strong> καὶ ἀμώμους καὶ <strong>ἀνεγκλήτους κατενώπιον αὐτοῦ</strong>,» (<a href="https://bibleox.com/el/gr-lxx-byz/kol/1/#L22">Κολ 1:22</a>)</p></blockquote><h2>Η ένωση με τον Θεό</h2><blockquote><p>«ὅτι καὶ <strong>Χριστὸς ἅπαξ περὶ ἁμαρτιῶν [ὑπὲρ ὑμῶν] ἀπέθανεν, δίκαιος ὑπὲρ ἀδίκων, ἵνα ὑμᾶς προσαγάγῃ τῷ θεῷ</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/1pet/3/#L18">Α Πε 3:18</a>).</p></blockquote><h2>Η Ευχαριστία (η Μετάληψη του Σώματος και του Αίματος του Χριστού)</h2><blockquote><p>«ἔχομεν θυσιαστήριον ἐξ οὗ φαγεῖν οὐκ ἔχουσιν ἐξουσίαν οἱ τῇ σκηνῇ λατρεύοντες. ὧν γὰρ εἰσφέρεται ζῴων τὸ αἷμα περὶ ἁμαρτίας εἰς τὰ ἅγια διὰ τοῦ ἀρχιερέως, τούτων τὰ σώματα κατακαίεται ἔξω τῆς παρεμβολῆς. διὸ καὶ <strong>Ἰησοῦς, ἵνα ἁγιάσῃ διὰ τοῦ ἰδίου αἵματος τὸν λαόν, ἔξω τῆς πύλης ἔπαθεν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/13/#L10-12">Εβρ 13:10-12</a>)</p></blockquote><blockquote><p>«Ἐσθιόντων δὲ αὐτῶν λαβὼν ὁ Ἰησοῦς ἄρτον καὶ εὐλογήσας ἔκλασεν καὶ δοὺς τοῖς μαθηταῖς εἶπεν, Λάβετε φάγετε, τοῦτό ἐστιν τὸ σῶμά μου. καὶ λαβὼν ποτήριον καὶ εὐχαριστήσας ἔδωκεν αὐτοῖς λέγων, <strong>Πίετε ἐξ αὐτοῦ πάντες, τοῦτο γάρ ἐστιν τὸ αἷμά μου τῆς διαθήκης τὸ περὶ πολλῶν ἐκχυννόμενον εἰς ἄφεσιν ἁμαρτιῶν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/26/#L26-28">Μτ 26:26-28</a>)</p></blockquote><blockquote><p>«καὶ εὐχαριστήσας ἔκλασεν καὶ εἶπεν, Τοῦτό μού ἐστιν τὸ <strong>σῶμα τὸ ὑπὲρ ὑμῶν</strong>· τοῦτο ποιεῖτε εἰς τὴν ἐμὴν ἀνάμνησιν. ὡσαύτως καὶ τὸ ποτήριον μετὰ τὸ δειπνῆσαι, λέγων, Τοῦτο τὸ ποτήριον ἡ καινὴ διαθήκη ἐστὶν ἐν τῷ ἐμῷ αἵματι» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/11/#L24-25">Α Κορ 11:24-25</a>).</p></blockquote><h2>Η Καινή Διαθήκη</h2><blockquote><p>«καὶ εὐχαριστήσας ἔκλασεν καὶ εἶπεν, Τοῦτό μού ἐστιν τὸ σῶμα τὸ ὑπὲρ ὑμῶν· τοῦτο ποιεῖτε εἰς τὴν ἐμὴν ἀνάμνησιν. ὡσαύτως καὶ τὸ ποτήριον μετὰ τὸ δειπνῆσαι, λέγων, <strong>Τοῦτο τὸ ποτήριον ἡ καινὴ διαθήκη ἐστὶν ἐν τῷ ἐμῷ αἵματι</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/11/#L24-25">Α Κορ 11:24-25</a>).</p></blockquote><h2>Η Βασιλεία</h2><blockquote><p>«εἰς τοῦτο γὰρ <strong>Χριστὸς ἀπέθανεν καὶ ἔζησεν ἵνα καὶ νεκρῶν καὶ ζώντων κυριεύσῃ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/14/#L9">Ρωμ 14:9</a>)</p></blockquote><p>Η εκπλήρωση του θελήματος του Πατέρα, των προφητειών, των υποσχέσεων</p><blockquote><p>«λέγω γὰρ Χριστὸν διάκονον γεγενῆσθαι περιτομῆς <strong>ὑπὲρ ἀληθείας θεοῦ, εἰς τὸ βεβαιῶσαι τὰς ἐπαγγελίας τῶν πατέρων</strong>,» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/15/#L8">Ρωμ 15:8</a>)</p></blockquote><h2>Το παράδειγμα</h2><blockquote><p>«εἰς τοῦτο γὰρ ἐκλήθητε, ὅτι καὶ <strong>Χριστὸς ἔπαθεν ὑπὲρ ὑμῶν, ὑμῖν ὑπολιμπάνων ὑπογραμμὸν ἵνα ἐπακολουθήσητε τοῖς ἴχνεσιν αὐτοῦ</strong>·» (<a href="https://bibleox.com/el/gr-lxx-byz/1pet/2/#L21">Α Πε 2:21</a>)</p></blockquote><blockquote><p>«καὶ <strong>ὑπὲρ πάντων ἀπέθανεν ἵνα οἱ ζῶντες μηκέτι ἑαυτοῖς ζῶσιν ἀλλὰ τῷ ὑπὲρ αὐτῶν ἀποθανόντι καὶ ἐγερθέντι</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/2kor/5/#L15">Β Κορ 5:15</a>)</p></blockquote><h2>Ερωτήσεις από μουσουλμάνους</h2><h3>Γιατί χρειάζεται η θυσία, αφού ο ελεήμων Θεός μπορεί να συγχωρήσει έτσι απλά;</h3><p>Ο Θεός, στον οποίο πιστεύουν οι χριστιανοί, ονομάζεται αγάπη:</p><blockquote><p>«ὁ μὴ ἀγαπῶν οὐκ ἔγνω τὸν θεόν, ὅτι <strong>ὁ θεὸς ἀγάπη ἐστίν</strong>. &lt;…&gt; καὶ ἡμεῖς ἐγνώκαμεν καὶ πεπιστεύκαμεν τὴν ἀγάπην ἣν ἔχει ὁ θεὸς ἐν ἡμῖν. Ὁ <strong>θεὸς ἀγάπη ἐστίν</strong>, καὶ ὁ μένων ἐν τῇ ἀγάπῃ ἐν τῷ θεῷ μένει καὶ ὁ θεὸς ἐν αὐτῷ μένει.» (<a href="https://bibleox.com/el/gr-lxx-byz/1in/4/#L8,16">Α Ιω 4:8,16</a>)</p></blockquote><p>Ο Θεός δείχνει την αγάπη Του προς τη δημιουργία Του ακριβώς μέσω της θυσίας του εαυτού Του για τη σωτηρία τους, γιατί ο ίδιος ο Θεός είπε:</p><blockquote><p>«<strong><mark>μείζονα ταύτης ἀγάπην οὐδεὶς ἔχει, ἵνα τις τὴν ψυχὴν αὐτοῦ θῇ ὑπὲρ τῶν φίλων αὐτοῦ</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/15/#L13">Ιω 15:13</a>)</p></blockquote><p>Έτσι, με τη θυσιαστική αγάπη Του έλκει κοντά Του εκείνους που θέλει να σώσει:</p><blockquote><p>«<strong>κἀγὼ ἐὰν ὑψωθῶ ἐκ τῆς γῆς, πάντας ἑλκύσω πρὸς ἐμαυτόν</strong>. τοῦτο δὲ ἔλεγεν <strong>σημαίνων ποίῳ θανάτῳ ἤμελλεν ἀποθνῄσκειν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/12/#L32-33">Ιω 12:32-33</a>)</p></blockquote><p>Αλλά ο Σοφός Θεός οργανώνει τη σωτηρία με σοφία. Εκτός από την αγάπη, μπορούμε να μιλήσουμε και για την ικανοποίηση της θείας δικαιοσύνης, γιατί ο Θεός δεν είναι μόνο ελεήμων, αλλά και δίκαιος. Ξέρει να συνδυάζει τα πάντα μαζί: σοφία, έλεος, δικαιοσύνη και αγάπη.</p>'
- src: Христос-судья
  path: Ο_Χριστός_είναι_ο_Κριτής
  title: Ο Χριστός είναι ο Κριτής
  title_sub: Βιβλικές ρήσεις ότι ο Ιησούς Χριστός θα κρίνει όλους τους ανθρώπους
  meta_desc: Βιβλικές ρήσεις που δείχνουν ότι ο Ιησούς Χριστός είναι ο Κριτής των ζώντων και των νεκρών και ότι όλοι θα σταθούν μπροστά στο βήμα Του.
  copy_cover: true
  menu:
    parent: Θεός/Ο Υιός
    title: Ο Χριστός είναι ο Κριτής
    priority: 12
  update: true
  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <h2>Ο Ιησούς Χριστός θα κρίνει όλους τους ανθρώπους στη Μέλλουσα Κρίση</h2><blockquote><p>«μέλλει γὰρ <strong>ὁ υἱὸς τοῦ ἀνθρώπου</strong> ἔρχεσθαι ἐν τῇ δόξῃ τοῦ πατρὸς αὐτοῦ μετὰ τῶν ἀγγέλων αὐτοῦ, καὶ τότε <strong>ἀποδώσει ἑκάστῳ κατὰ τὴν πρᾶξιν αὐτοῦ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/16/#L27">Μτ 16:27</a>)</p></blockquote><blockquote><p>«Ὅταν δὲ ἔλθῃ <strong>ὁ υἱὸς τοῦ ἀνθρώπου</strong> ἐν τῇ δόξῃ αὐτοῦ καὶ πάντες οἱ ἄγγελοι μετ᾿ αὐτοῦ, τότε καθίσει ἐπὶ θρόνου δόξης αὐτοῦ· καὶ συναχθήσονται ἔμπροσθεν αὐτοῦ πάντα τὰ ἔθνη, καὶ <strong>ἀφορίσει αὐτοὺς ἀπ᾿ ἀλλήλων</strong>, ὥσπερ ὁ ποιμὴν ἀφορίζει τὰ πρόβατα ἀπὸ τῶν ἐρίφων,» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/25/#L31-32">Μτ 25:31-32</a>)</p></blockquote><blockquote><p>«οὐδὲ γὰρ ὁ πατὴρ κρίνει οὐδένα, ἀλλὰ <strong>τὴν κρίσιν πᾶσαν δέδωκεν τῷ υἱῷ</strong>,» (<a href="https://bibleox.com/el/gr-lxx-byz/in/5/#L22">Ιω 5:22</a>)</p></blockquote><blockquote><p>«<strong>Ἰησοῦν τὸν ἀπὸ Ναζαρέθ</strong>, ὡς ἔχρισεν αὐτὸν ὁ θεὸς πνεύματι ἁγίῳ καὶ δυνάμει, ὃς διῆλθεν εὐεργετῶν καὶ ἰώμενος πάντας τοὺς καταδυναστευομένους ὑπὸ τοῦ διαβόλου, ὅτι ὁ θεὸς ἦν μετ᾿ αὐτοῦ. &lt;…&gt; καὶ παρήγγειλεν ἡμῖν κηρύξαι τῷ λαῷ καὶ διαμαρτύρασθαι ὅτι <strong>οὗτός ἐστιν ὁ ὡρισμένος ὑπὸ τοῦ θεοῦ κριτὴς ζώντων καὶ νεκρῶν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/10/#L38,42">Πραξ 10:38,42</a>)</p></blockquote><blockquote><p>«καθότι ἔστησεν ἡμέραν ἐν ᾗ μέλλει <strong>κρίνειν τὴν οἰκουμένην ἐν δικαιοσύνῃ ἐν ἀνδρὶ ᾧ ὥρισεν</strong>, πίστιν παρασχὼν πᾶσιν <strong>ἀναστήσας αὐτὸν ἐκ νεκρῶν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/17/#L31">Πραξ 17:31</a>)</p></blockquote><blockquote><p>«τοὺς γὰρ πάντας ἡμᾶς φανερωθῆναι δεῖ ἔμπροσθεν <strong>τοῦ βήματος τοῦ Χριστοῦ</strong>, ἵνα κομίσηται ἕκαστος τὰ διὰ τοῦ σώματος πρὸς ἃ ἔπραξεν, εἴτε ἀγαθὸν εἴτε φαῦλον.» (<a href="https://bibleox.com/el/gr-lxx-byz/2kor/5/#L10">Β Κορ 5:10</a>)</p></blockquote><blockquote><p>«Διαμαρτύρομαι ἐνώπιον τοῦ <strong>θεοῦ καὶ Χριστοῦ Ἰησοῦ, τοῦ μέλλοντος κρίνειν ζῶντας καὶ νεκρούς</strong>, καὶ τὴν ἐπιφάνειαν αὐτοῦ καὶ τὴν βασιλείαν αὐτοῦ·» (<a href="https://bibleox.com/el/gr-lxx-byz/2tim/4/#L1">Β Τιμ 4:1</a>)</p></blockquote><h2>Όλοι υπόκεινται στην κρίση</h2><blockquote><p><em>«τοὺς γὰρ </em><strong><em><mark>πάντας ἡμᾶς</mark> φανερωθῆναι δεῖ ἔμπροσθεν τοῦ βήματος τοῦ Χριστοῦ</em></strong><em>, ἵνα κομίσηται ἕκαστος τὰ διὰ τοῦ σώματος πρὸς ἃ </em><strong><em>ἔπραξεν</em></strong><em>, </em><strong><em>εἴτε ἀγαθὸν εἴτε φαῦλον</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/2kor/5/#L10"><em>Β Κορ 5:10</em></a><em>)</em></p></blockquote><blockquote><p><em>«σὺ δὲ τί κρίνεις τὸν ἀδελφόν σου; ἢ καὶ σὺ τί ἐξουθενεῖς τὸν ἀδελφόν σου; </em><strong><em><mark>πάντες</mark> γὰρ παραστησόμεθα τῷ βήματι τοῦ θεοῦ</em></strong><em>·» (</em><a href="https://bibleox.com/el/gr-lxx-byz/rim/14/#L10"><em>Ρωμ 14:10</em></a><em>)</em></p></blockquote><blockquote><p><em>«οὕτως λαλεῖτε καὶ οὕτως </em><strong><em><mark>ποιεῖτε ὡς διὰ νόμου ἐλευθερίας μέλλοντες κρίνεσθαι</mark></em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/iak/2/#L12"><em>Ιακ 2:12</em></a><em>)</em></p></blockquote><blockquote><p><em>«ὅτι σὺν </em><strong><em><mark>πᾶν τὸ ποίημα</mark> ὁ θεὸς ἄξει ἐν κρίσει</em></strong><em> ἐν παντὶ παρεωραμένῳ, </em><strong><em>ἐὰν ἀγαθὸν καὶ ἐὰν πονηρόν</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/ekl/12/#L14"><em>Εκ 12:14</em></a><em>)</em></p></blockquote><blockquote><p><em>«Ὅταν δὲ ἔλθῃ </em><strong><em>ὁ υἱὸς τοῦ ἀνθρώπου</em></strong><em> ἐν τῇ δόξῃ αὐτοῦ καὶ πάντες οἱ ἄγγελοι μετ᾿ αὐτοῦ, τότε </em><strong><em>καθίσει ἐπὶ θρόνου</em></strong><em> δόξης αὐτοῦ· καὶ </em><strong><em>συναχθήσονται ἔμπροσθεν αὐτοῦ <mark>πάντα τὰ ἔθνη</mark></em></strong><em>, καὶ </em><strong><em><mark>ἀφορίσει αὐτοὺς ἀπ᾿ ἀλλήλων</mark></em></strong><em>, ὥσπερ ὁ ποιμὴν ἀφορίζει τὰ </em><strong><em><mark>πρόβατα ἀπὸ τῶν ἐρίφων</mark></em></strong><em>,» (</em><a href="https://bibleox.com/el/gr-lxx-byz/mf/25/#L31-32"><em>Μτ 25:31-32</em></a><em>)</em></p></blockquote><h2>Η κρίση θα αρχίσει από την Εκκλησία</h2><blockquote><p><em>«ὅτι </em><strong><em>ὁ καιρὸς τοῦ ἄρξασθαι τὸ κρίμα <mark>ἀπὸ τοῦ οἴκου τοῦ θεοῦ</mark></em></strong><em>· εἰ δὲ πρῶτον </em><strong><em><mark>ἀφ᾿ ἡμῶν</mark></em></strong><em>, τί τὸ τέλος τῶν ἀπειθούντων τῷ τοῦ θεοῦ εὐαγγελίῳ; καὶ εἰ </em><strong><em>ὁ δίκαιος μόλις σῴζεται</em></strong><em>, ὁ ἀσεβὴς καὶ ἁμαρτωλὸς ποῦ φανεῖται;» (</em><a href="https://bibleox.com/el/gr-lxx-byz/1pet/4/#L17-18"><em>Α Πε 4:17-18</em></a><em>)</em></p></blockquote><blockquote><p><em>«ἐμοὶ δὲ </em><strong><em>εἰς ἐλάχιστόν ἐστιν ἵνα ὑφ᾿ ὑμῶν ἀνακριθῶ ἢ ὑπὸ ἀνθρωπίνης ἡμέρας· ἀλλ᾿ <mark>οὐδὲ ἐμαυτὸν ἀνακρίνω</mark></em></strong><em>· οὐδὲν γὰρ ἐμαυτῷ σύνοιδα, ἀλλ᾿ </em><strong><em>οὐκ ἐν τούτῳ δεδικαίωμαι, <mark>ὁ δὲ ἀνακρίνων με κύριός ἐστιν</mark></em></strong><em>. ὥστε </em><strong><em>μὴ πρὸ καιροῦ τι κρίνετε</em></strong><em>, ἕως ἂν ἔλθῃ ὁ κύριος, ὃς καὶ φωτίσει τὰ κρυπτὰ τοῦ σκότους καὶ φανερώσει τὰς βουλὰς τῶν καρδιῶν· καὶ τότε ὁ ἔπαινος γενήσεται ἑκάστῳ ἀπὸ τοῦ θεοῦ.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/1kor/4/#L3-5"><em>Α Κορ 4:3-5</em></a><em>)</em></p></blockquote><h2>Ο Χριστός θα κρίνει στον άνθρωπο ό,τι έγινε κατά τη ζωή στο σώμα</h2><blockquote><p>«τοὺς γὰρ πάντας ἡμᾶς φανερωθῆναι δεῖ ἔμπροσθεν τοῦ βήματος τοῦ Χριστοῦ, ἵνα <strong>κομίσηται ἕκαστος <mark>τὰ διὰ τοῦ σώματος πρὸς ἃ ἔπραξεν</mark></strong>, εἴτε ἀγαθὸν εἴτε φαῦλον.» (<a href="https://bibleox.com/el/gr-lxx-byz/2kor/5/#L10">Β Κορ 5:10</a>)</p></blockquote><p>Η κρίση γίνεται με βάση τα επίγεια έργα στο σώμα:</p><blockquote><p>«Τότε ἐρεῖ καὶ τοῖς ἐξ εὐωνύμων, <strong>Πορεύεσθε ἀπ᾿ ἐμοῦ [οἱ] κατηραμένοι εἰς τὸ πῦρ τὸ αἰώνιον τὸ ἡτοιμασμένον τῷ διαβόλῳ καὶ τοῖς ἀγγέλοις αὐτοῦ· ἐπείνασα γὰρ καὶ οὐκ ἐδώκατέ μοι φαγεῖν</strong>, ἐδίψησα καὶ οὐκ ἐποτίσατέ με, ξένος ἤμην καὶ οὐ συνηγάγετέ με, γυμνὸς καὶ οὐ περιεβάλετέ με, ἀσθενὴς καὶ ἐν φυλακῇ καὶ οὐκ ἐπεσκέψασθέ με. τότε ἀποκριθήσονται καὶ αὐτοὶ λέγοντες, Κύριε, πότε σε εἴδομεν πεινῶντα ἢ διψῶντα ἢ ξένον ἢ γυμνὸν ἢ ἀσθενῆ ἢ ἐν φυλακῇ καὶ οὐ διηκονήσαμέν σοι; τότε ἀποκριθήσεται αὐτοῖς λέγων, Ἀμὴν λέγω ὑμῖν, <strong>ἐφ᾿ ὅσον οὐκ ἐποιήσατε ἑνὶ τούτων τῶν ἐλαχίστων, οὐδὲ ἐμοὶ ἐποιήσατε. καὶ ἀπελεύσονται οὗτοι εἰς κόλασιν αἰώνιον</strong>, οἱ δὲ δίκαιοι εἰς ζωὴν αἰώνιον.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/25/#L41-46">Μτ 25:41-46</a>)</p></blockquote>
- src: Христос-не-архангел-Михаил
  path: Ο_Χριστός_δεν_είναι_ο_αρχάγγελος_Μιχαήλ
  title: Ο Χριστός δεν είναι ο αρχάγγελος Μιχαήλ
  title_sub: Απόκρουση της διδασκαλίας της ολοκληρωτικής σέχτας των Μαρτύρων του Ιεχωβά
  meta_desc: Απόκρουση της διδασκαλίας ότι ο Χριστός είναι ο αρχάγγελος Μιχαήλ· βιβλικές αποδείξεις ότι ο Υιός του Θεού είναι ανώτερος από όλους τους αγγέλους.
