  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: '<h2>Ο Ιησούς Χριστός γεννιέται στη Βηθλεέμ</h2><blockquote><p>«Τοῦ δὲ Ἰησοῦ <strong>γεννηθέντος ἐν Βηθλέεμ τῆς Ἰουδαίας</strong> ἐν ἡμέραις Ἡρῴδου τοῦ βασιλέως» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/2/#L1">Μτ 2:1</a> · <a href="https://bibleox.com/el/gr-lxx-byz/lk/2/#L4-7">Λκ 2:4-7</a>)</p></blockquote><p><em>Σύμφωνα με την προφητεία: </em><a href="https://bibleox.com/el/gr-lxx-byz/mf/2/#L5"><em>Μτ 2:5</em></a><em> · </em><a href="https://bibleox.com/el/gr-lxx-byz/in/7/#L42"><em>Ιω 7:42</em></a><em> · </em><a href="https://bibleox.com/el/gr-lxx-byz/mih/5/#L1"><em>Μιχ 5:1</em></a><em>.</em></p><h2>Η φυγή στην Αίγυπτο</h2><p>Μετά τη γέννηση, ο Ιωσήφ και η Παρθένος Μαρία παίρνουν το βρέφος Ιησού για μερικά χρόνια στην Αίγυπτο, κρύβοντάς Το από την καταδίωξη του βασιλιά Ηρώδη (<a href="https://bibleox.com/el/gr-lxx-byz/mf/2/#L16">Μτ 2:16</a>):</p><blockquote><p>«ὁ δὲ ἐγερθεὶς παρέλαβεν τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ νυκτὸς καὶ <strong>ἀνεχώρησεν εἰς Αἴγυπτον, καὶ ἦν ἐκεῖ ἕως τῆς τελευτῆς Ἡρῴδου</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/2/#L14-15">Μτ 2:14-15</a>)</p></blockquote><p><em>Σύμφωνα με την προφητεία: </em><a href="https://bibleox.com/el/gr-lxx-byz/mf/2/#L15"><em>Μτ 2:15</em></a><em> · </em><a href="https://bibleox.com/el/gr-lxx-byz/os/11/#L1"><em>Ωσ 11:1</em></a><em>.</em></p><h2>Η επιστροφή στη Ναζαρέτ</h2><p>Και μετά επιστρέφουν στο σπίτι του Ιωσήφ (<a href="https://bibleox.com/el/gr-lxx-byz/lk/2/#L4">Λκ 2:4</a>) στη Ναζαρέτ:</p><blockquote><p>«λέγων, Ἐγερθεὶς παράλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ καὶ πορεύου εἰς γῆν Ἰσραήλ, τεθνήκασιν γὰρ οἱ ζητοῦντες τὴν ψυχὴν τοῦ παιδίου. ὁ δὲ ἐγερθεὶς <strong>παρέλαβεν τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ καὶ εἰσῆλθεν εἰς γῆν Ἰσραήλ</strong>. <strong> </strong>ἀκούσας δὲ ὅτι Ἀρχέλαος βασιλεύει τῆς Ἰουδαίας ἀντὶ τοῦ πατρὸς αὐτοῦ Ἡρῴδου ἐφοβήθη ἐκεῖ ἀπελθεῖν· χρηματισθεὶς δὲ κατ᾿ ὄναρ ἀνεχώρησεν <strong>εἰς τὰ μέρη τῆς Γαλιλαίας</strong>, καὶ ἐλθὼν κατῴκησεν εἰς πόλιν λεγομένην <strong>Ναζαρέτ</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/2/#L20-23">Μτ 2:20-23</a>)</p></blockquote><p><em>Σύμφωνα με την προφητεία: </em><a href="https://bibleox.com/el/gr-lxx-byz/mf/2/#L23"><em>Μτ 2:23</em></a><em>, ίσως: </em><a href="https://bibleox.com/el/gr-lxx-byz/sud/13/#L5"><em>Κρ 13:5</em></a><em>.</em></p><h2>Η ετήσια επίσκεψη στην Ιερουσαλήμ</h2><p>Κάθε χρόνο ο Ιησούς Χριστός πήγαινε στον ναό της Ιερουσαλήμ με τους γονείς, τους συγγενείς και τους γνωστούς Του (<a href="https://bibleox.com/el/gr-lxx-byz/lk/2/#L43-44">Λκ 2:43-44</a>):</p><blockquote><p>«Καὶ <strong>ἐπορεύοντο οἱ γονεῖς αὐτοῦ κατ᾿ ἔτος εἰς Ἰερουσαλὴμ</strong> τῇ ἑορτῇ τοῦ πάσχα. καὶ ὅτε ἐγένετο ἐτῶν δώδεκα, <strong>ἀναβαινόντων αὐτῶν κατὰ τὸ ἔθος τῆς ἑορτῆς</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/2/#L41-42">Λκ 2:41-42</a>)</p></blockquote><p>Σε ηλικία 12 ετών ο νεαρός Ιησούς είχε ήδη μεγάλη σοφία, που προκαλούσε τον θαυμασμό των δασκάλων της Ιερουσαλήμ στον ναό:</p><blockquote><p>«Καὶ ἐπορεύοντο οἱ γονεῖς αὐτοῦ κατ᾿ ἔτος εἰς Ἰερουσαλὴμ τῇ ἑορτῇ τοῦ πάσχα. καὶ <strong>ὅτε ἐγένετο ἐτῶν δώδεκα</strong>, ἀναβαινόντων αὐτῶν κατὰ τὸ ἔθος τῆς ἑορτῆς &lt;…&gt; καὶ ἐγένετο μετὰ ἡμέρας τρεῖς εὗρον αὐτὸν <strong>ἐν τῷ ἱερῷ καθεζόμενον ἐν μέσῳ τῶν διδασκάλων καὶ ἀκούοντα αὐτῶν καὶ ἐπερωτῶντα αὐτούς· ἐξίσταντο δὲ πάντες οἱ ἀκούοντες αὐτοῦ ἐπὶ τῇ συνέσει καὶ ταῖς ἀποκρίσεσιν αὐτοῦ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/2/#L41-42,46-47">Λκ 2:41-42,46-47</a>)</p></blockquote><p>Μετά τα 12 του χρόνια, ο Χριστός ζούσε επίσης στη Ναζαρέτ, υπακούοντας στους γονείς Του:</p><blockquote><p>«καὶ κατέβη μετ᾿ αὐτῶν καὶ <strong>ἦλθεν εἰς Ναζαρέθ, καὶ ἦν ὑποτασσόμενος αὐτοῖς</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/2/#L51">Λκ 2:51</a>)</p></blockquote><h2>Η μετάβαση από τη Ναζαρέτ στην Καπερναούμ: η αρχή του κηρύγματος</h2><p>Μόνο όταν έφτασε τα 30 του χρόνια, μετά το βάπτισμα από τον προφήτη Ιωάννη, ο Χριστός εγκαταλείπει τη Ναζαρέτ και μεταβαίνει στην Καπερναούμ για να αρχίσει το κήρυγμα:</p><blockquote><p>«Ἀκούσας δὲ ὅτι Ἰωάννης παρεδόθη ἀνεχώρησεν εἰς τὴν Γαλιλαίαν. καὶ <strong>καταλιπὼν τὴν Ναζαρὰ ἐλθὼν κατῴκησεν εἰς Καφαρναοὺμ</strong> τὴν παραθαλασσίαν ἐν ὁρίοις Ζαβουλὼν καὶ Νεφθαλίμ·» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/4/#L12-13">Μτ 4:12-13</a>)</p></blockquote><p><em>Σύμφωνα με την προφητεία: </em><a href="https://bibleox.com/el/gr-lxx-byz/mf/4/#L14-16"><em>Μτ 4:14-16</em></a><em> · </em><a href="https://bibleox.com/el/gr-lxx-byz/is/9/#L1-2"><em>Ησ 9:1-2</em></a></p><h2>Σημαντικές λεπτομέρειες</h2><h3>Οι Γαλιλαίοι γνωρίζουν καλά τον Ιησού ως γιο του ξυλουργού</h3><p>Κατά τη διάρκεια του κηρύγματος στη Γαλιλαία, ο λαός γνωρίζει καλά τον Ιησού Χριστό ως έναν συνηθισμένο ξυλουργό, γιο ξυλουργού:</p><blockquote><p>«<strong>οὐχ</strong> <strong>οὗτός ἐστιν ὁ τέκτων</strong>, ὁ υἱὸς τῆς Μαρίας καὶ ἀδελφὸς Ἰακώβου καὶ Ἰωσῆτος καὶ Ἰούδα καὶ Σίμωνος; καὶ οὐκ εἰσὶν αἱ ἀδελφαὶ αὐτοῦ ὧδε πρὸς ἡμᾶς; καὶ ἐσκανδαλίζοντο ἐν αὐτῷ.» (<a href="https://bibleox.com/el/gr-lxx-byz/mk/6/#L3">Μκ 6:3</a>)</p></blockquote><blockquote><p>«<strong>οὐχ οὗτός ἐστιν ὁ τοῦ τέκτονος υἱός</strong>; οὐχ ἡ μήτηρ αὐτοῦ λέγεται Μαριὰμ καὶ οἱ ἀδελφοὶ αὐτοῦ Ἰάκωβος καὶ Ἰωσὴφ καὶ Σίμων καὶ Ἰούδας;» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/13/#L55">Μτ 13:55</a>)</p></blockquote><h3>Η τακτική επίσκεψη στον ναό για την τήρηση του Νόμου</h3><p>Για να τηρεί τον Νόμο, ο Χριστός έπρεπε να επισκέπτεται τον ναό στην Ιερουσαλήμ 3 φορές τον χρόνο:</p><blockquote><p>«<strong>τρεῖς καιροὺς τοῦ ἐνιαυτοῦ</strong> ὀφθήσεται <strong>πᾶν ἀρσενικόν</strong> σου ἐνώπιον κυρίου τοῦ θεοῦ σου.» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/23/#L17">Έξ 23:17</a>)</p></blockquote><blockquote><p>«<strong>τρεῖς καιροὺς τοῦ ἐνιαυτοῦ</strong> ὀφθήσεται <strong>πᾶν ἀρσενικόν</strong> σου ἐνώπιον κυρίου τοῦ θεοῦ Ισραηλ·» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/34/#L23">Έξ 34:23</a>)</p></blockquote><blockquote><p>«<strong>τρεῖς καιροὺς τοῦ ἐνιαυτοῦ ὀφθήσεται πᾶν ἀρσενικόν</strong> σου ἐναντίον κυρίου τοῦ θεοῦ σου ἐν τῷ τόπῳ, ᾧ ἐὰν ἐκλέξηται αὐτὸν κύριος, <strong>ἐν τῇ ἑορτῇ τῶν ἀζύμων καὶ ἐν τῇ ἑορτῇ τῶν ἑβδομάδων καὶ ἐν τῇ ἑορτῇ τῆς σκηνοπηγίας</strong>. οὐκ ὀφθήσῃ ἐνώπιον κυρίου τοῦ θεοῦ σου κενός·» (<a href="https://bibleox.com/el/gr-lxx-byz/vtor/16/#L16">Δτ 16:16</a>)</p></blockquote><h3>Ο Χριστός τηρούσε τον Νόμο</h3><blockquote><p>«Μὴ νομίσητε ὅτι ἦλθον καταλῦσαι τὸν <strong>νόμον</strong> ἢ τοὺς προφήτας· <strong>οὐκ ἦλθον καταλῦσαι ἀλλὰ πληρῶσαι</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/5/#L17">Μτ 5:17</a>)</p></blockquote><blockquote><p>«ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν πρὸς αὐτόν, Ἄφες ἄρτι, οὕτως γὰρ <strong>πρέπον ἐστὶν ἡμῖν πληρῶσαι πᾶσαν δικαιοσύνην</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/3/#L15">Μτ 3:15</a>)</p></blockquote><blockquote><p>«ὁ μὲν <strong>υἱὸς τοῦ ἀνθρώπου ὑπάγει καθὼς γέγραπται περὶ αὐτοῦ</strong>, οὐαὶ δὲ τῷ ἀνθρώπῳ ἐκείνῳ δι᾿ οὗ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται· καλὸν ἦν αὐτῷ εἰ οὐκ ἐγεννήθη ὁ ἄνθρωπος ἐκεῖνος.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/26/#L24">Μτ 26:24</a> · <a href="https://bibleox.com/el/gr-lxx-byz/mk/14/#L21">Μκ 14:21</a>)</p></blockquote><blockquote><p>«Εἶπεν δὲ πρὸς αὐτούς, Οὗτοι οἱ λόγοι μου οὓς ἐλάλησα πρὸς ὑμᾶς ἔτι ὢν σὺν ὑμῖν, ὅτι <strong>δεῖ πληρωθῆναι πάντα τὰ γεγραμμένα ἐν τῷ νόμῳ Μωϋσέως</strong> καὶ τοῖς <strong>προφήταις</strong> καὶ <strong>ψαλμοῖς</strong> περὶ ἐμοῦ.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/24/#L44">Λκ 24:44</a>)</p></blockquote><blockquote><p>«ὅτε δὲ ἦλθεν τὸ πλήρωμα τοῦ χρόνου, ἐξαπέστειλεν ὁ θεὸς τὸν υἱὸν αὐτοῦ, <strong>γενόμενον ἐκ γυναικός, γενόμενον ὑπὸ νόμον</strong>,» (<a href="https://bibleox.com/el/gr-lxx-byz/gal/4/#L4">Γαλ 4:4</a>)</p></blockquote><h3>Η αναμονή της πλήρους ηλικίας για το κήρυγμα</h3><p>Ο Χριστός απείχε από το κήρυγμα και τα θαύματα μέχρι την ηλικία των 30 ετών, γιατί η δημόσια διακονία άρχιζε, σύμφωνα με τη θεία θέσπιση και την καθιερωμένη παράδοση, από τα 30 χρόνια (<a href="https://bibleox.com/el/gr-lxx-byz/chis/4/#L3">Αρ 4:3</a>). Γι'' αυτό ο Χριστός, που ήρθε όχι για να καταλύσει τον νόμο αλλά για να τον εκπληρώσει (<a href="https://bibleox.com/el/gr-lxx-byz/mf/5/#L17">Μτ 5:17</a>), περίμενε 30 χρόνια και τότε βγήκε στο κήρυγμα:</p><blockquote><p>«Καὶ αὐτὸς ἦν Ἰησοῦς <strong>ἀρχόμενος ὡσεὶ ἐτῶν τριάκοντα</strong>, ὢν υἱός, ὡς ἐνομίζετο, Ἰωσὴφ τοῦ Ἠλὶ» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/3/#L23">Λκ 3:23</a>)</p></blockquote><p>Ο Χριστός περίμενε μέχρι να έρθει η ώρα Του:</p><blockquote><p>«[καὶ] λέγει αὐτῇ ὁ Ἰησοῦς, Τί ἐμοὶ καὶ σοί, γύναι; <strong>οὔπω ἥκει ἡ ὥρα μου</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/2/#L4">Ιω 2:4</a>)</p></blockquote><blockquote><p>«Ἐζήτουν οὖν αὐτὸν πιάσαι, καὶ οὐδεὶς ἐπέβαλεν ἐπ᾿ αὐτὸν τὴν χεῖρα, ὅτι <strong>οὔπω ἐληλύθει ἡ ὥρα αὐτοῦ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/7/#L30">Ιω 7:30</a>)</p></blockquote><blockquote><p>«Ταῦτα τὰ ῥήματα ἐλάλησεν ἐν τῷ γαζοφυλακίῳ διδάσκων ἐν τῷ ἱερῷ· καὶ οὐδεὶς ἐπίασεν αὐτόν, ὅτι <strong>οὔπω ἐληλύθει ἡ ὥρα αὐτοῦ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/8/#L20">Ιω 8:20</a>)</p></blockquote><blockquote><p>«λέγει οὖν αὐτοῖς ὁ Ἰησοῦς, <strong>Ὁ καιρὸς ὁ ἐμὸς οὔπω πάρεστιν</strong>, ὁ δὲ καιρὸς ὁ ὑμέτερος πάντοτέ ἐστιν ἕτοιμος.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/7/#L6">Ιω 7:6</a>)</p></blockquote><blockquote><p>«ὑμεῖς ἀνάβητε εἰς τὴν ἑορτήν· ἐγὼ οὐκ ἀναβαίνω εἰς τὴν ἑορτὴν ταύτην, ὅτι <strong>ὁ ἐμὸς καιρὸς οὔπω πεπλήρωται</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/7/#L8">Ιω 7:8</a>)</p></blockquote><blockquote><p>«βάπτισμα δὲ ἔχω βαπτισθῆναι, καὶ <strong>πῶς συνέχομαι ἕως ὅτου τελεσθῇ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/12/#L50">Λκ 12:50</a>)</p></blockquote><blockquote><p>«Ταῦτα ἐλάλησεν Ἰησοῦς, καὶ ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ εἰς τὸν οὐρανὸν εἶπεν, <strong>Πάτερ, ἐλήλυθεν ἡ ὥρα</strong>· δόξασόν σου τὸν υἱόν, ἵνα ὁ υἱὸς δοξάσῃ σέ,» (<a href="https://bibleox.com/el/gr-lxx-byz/in/17/#L1">Ιω 17:1</a>)</p></blockquote>'
