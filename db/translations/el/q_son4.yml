  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: '<p>Το άρθρο αυτό δείχνει όχι μόνο ότι ο Ιησούς Χριστός είναι ο Σωτήρας, αλλά και τι είδους Σωτήρας είναι: ότι είναι ο Σωτήρας όλων. Όλοι καλούνται στον Χριστό, αλλά δεν σώζονται όλοι.</p><h2>Οι ειδωλολατρικοί θεοί δεν είναι θεοί</h2><p>Δεν υπάρχει άλλος Θεός:</p><blockquote><p>«Περὶ τῆς βρώσεως οὖν τῶν εἰδωλοθύτων οἴδαμεν ὅτι οὐδὲν εἴδωλον ἐν κόσμῳ, καὶ ὅτι <strong>οὐδεὶς θεὸς εἰ μὴ εἷς</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/8/#L4">Α Κορ 8:4</a>)</p></blockquote><p>Αυτοί που οι ειδωλολάτρες λάτρευαν παλιά δεν είναι θεοί:</p><blockquote><p>«Ἀλλὰ τότε μὲν οὐκ εἰδότες θεὸν ἐδουλεύσατε τοῖς φύσει <strong>μὴ οὖσιν θεοῖς</strong>·» (<a href="https://bibleox.com/el/gr-lxx-byz/gal/4/#L8">Γαλ 4:8</a>)</p></blockquote><p>Ψεύτικοι θεοί:</p><blockquote><p>«Ἄνδρες, τί ταῦτα ποιεῖτε; καὶ ἡμεῖς ὁμοιοπαθεῖς ἐσμεν ὑμῖν ἄνθρωποι, εὐαγγελιζόμενοι ὑμᾶς ἀπὸ τούτων τῶν ματαίων <strong>ἐπιστρέφειν ἐπὶ θεὸν ζῶντα</strong> ὃς ἐποίησεν τὸν οὐρανὸν καὶ τὴν γῆν καὶ τὴν θάλασσαν καὶ πάντα τὰ ἐν αὐτοῖς·» (<a href="https://bibleox.com/el/gr-lxx-byz/act/14/#L15">Πραξ 14:15</a>)</p></blockquote><p>Όλα τα έθνη παλιά δεν βάδιζαν στους δρόμους του Θεού, αλλά στους δικούς τους:</p><blockquote><p>«ὃς ἐν ταῖς παρῳχημέναις γενεαῖς <strong>εἴασεν πάντα τὰ ἔθνη πορεύεσθαι ταῖς ὁδοῖς αὐτῶν</strong>·» (<a href="https://bibleox.com/el/gr-lxx-byz/act/14/#L16">Πραξ 14:16</a>)</p></blockquote><p>Υπάρχουν πολλές ακόμη παρόμοιες ρήσεις: <a href="https://bibleox.com/el/el/w/Ο_Θεός_είναι_ένας">Ο Θεός είναι ένας</a></p><h2>Η απόρριψη του Χριστού είναι απόρριψη του Θεού</h2><blockquote><p><em>«</em><strong><em>ὁ δὲ ἐμὲ ἀθετῶν ἀθετεῖ τὸν ἀποστείλαντά με</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/lk/10/#L16"><em>Λκ 10:16</em></a><em>)</em></p></blockquote><blockquote><p><em>«</em><strong><em>ὁ ἐμὲ μισῶν καὶ τὸν πατέρα μου μισεῖ</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/in/15/#L23"><em>Ιω 15:23</em></a><em>)</em></p></blockquote><blockquote><p><em>«πᾶς </em><strong><em>ὁ ἀρνούμενος τὸν υἱὸν οὐδὲ τὸν πατέρα ἔχει</em></strong><em>· ὁ ὁμολογῶν τὸν υἱὸν καὶ τὸν πατέρα ἔχει.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/1in/2/#L23"><em>Α Ιω 2:23</em></a><em>)</em></p></blockquote><blockquote><p><em>«πᾶς </em><strong><em>ὁ προάγων</em></strong><em> καὶ </em><strong><em>μὴ μένων ἐν τῇ διδαχῇ τοῦ Χριστοῦ</em></strong><em> </em><strong><em>θεὸν οὐκ ἔχει</em></strong><em>· ὁ μένων ἐν τῇ διδαχῇ, οὗτος καὶ τὸν πατέρα καὶ τὸν υἱὸν ἔχει.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/2in/1/#L9"><em>Β Ιω 1:9</em></a><em>)</em></p></blockquote><blockquote><p><em>«ὁ πιστεύων εἰς τὸν υἱὸν ἔχει ζωὴν αἰώνιον· </em><strong><em>ὁ δὲ ἀπειθῶν τῷ υἱῷ οὐκ ὄψεται ζωήν, ἀλλ᾿ ἡ ὀργὴ τοῦ θεοῦ μένει ἐπ᾿ αὐτόν</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/in/3/#L36"><em>Ιω 3:36</em></a><em>)</em></p></blockquote><h2>Χωρίς πίστη στον Χριστό δεν είναι δυνατόν να σωθεί κανείς</h2><blockquote><p><em>«</em><strong><em>ἐν τῷ ὀνόματι Ἰησοῦ Χριστοῦ</em></strong><em> τοῦ Ναζωραίου, ὃν ὑμεῖς ἐσταυρώσατε, ὃν ὁ θεὸς ἤγειρεν ἐκ νεκρῶν, ἐν τούτῳ οὗτος παρέστηκεν ἐνώπιον ὑμῶν ὑγιής. οὗτός ἐστιν ὁ λίθος ὁ ἐξουθενηθεὶς ὑφ᾿ ὑμῶν τῶν οἰκοδόμων, ὁ γενόμενος εἰς κεφαλὴν γωνίας. καὶ </em><strong><em>οὐκ ἔστιν ἐν ἄλλῳ οὐδενὶ ἡ σωτηρία</em></strong><em>, οὐδὲ γὰρ </em><strong><em>ὄνομά ἐστιν ἕτερον ὑπὸ τὸν οὐρανὸν τὸ δεδομένον ἐν ἀνθρώποις ἐν ᾧ δεῖ σωθῆναι ἡμᾶς</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/act/4/#L10-12"><em>Πραξ 4:10-12</em></a><em>)</em></p></blockquote><blockquote><p><em>«</em><strong><em>χωρὶς δὲ πίστεως ἀδύνατον εὐαρεστῆσαι</em></strong><em>, πιστεῦσαι γὰρ δεῖ τὸν προσερχόμενον τῷ θεῷ ὅτι ἔστιν καὶ τοῖς ἐκζητοῦσιν αὐτὸν μισθαποδότης γίνεται.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/evr/11/#L6"><em>Εβρ 11:6</em></a><em>)</em></p></blockquote><h2>Η αίρεση και ο χωρισμός από την Εκκλησία στερούν τη σωτηρία</h2><p>Όσοι επινοούν αιρέσεις δεν θα κληρονομήσουν τη Βασιλεία του Θεού:</p><blockquote><p><em>«φανερὰ δέ ἐστιν τὰ ἔργα τῆς σαρκός, ἅτινά ἐστιν πορνεία, ἀκαθαρσία, ἀσέλγεια, εἰδωλολατρία, φαρμακεία, ἔχθραι, ἔρις, ζῆλος, θυμοί, ἐριθείαι, </em><strong><em>διχοστασίαι</em></strong><em>, </em><strong><em>αἱρέσεις</em></strong><em>, φθόνοι, μέθαι, κῶμοι, καὶ τὰ ὅμοια τούτοις, ἃ προλέγω ὑμῖν καθὼς προεῖπον ὅτι οἱ τὰ τοιαῦτα πράσσοντες </em><strong><em>βασιλείαν θεοῦ οὐ κληρονομήσουσιν</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/gal/5/#L19-21"><em>Γαλ 5:19-21</em></a><em>)</em></p><p><strong><em>*διχοστασίαι — διαίρεση, διχασμός.</em></strong></p></blockquote><p>Όσοι δημιουργούν διαιρέσεις στην Εκκλησία δεν υπηρετούν τον Κύριο Ιησού Χριστό:</p><blockquote><p><em>«Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, </em><strong><em>σκοπεῖν τοὺς τὰς διχοστασίας καὶ τὰ σκάνδαλα παρὰ τὴν διδαχὴν ἣν ὑμεῖς ἐμάθετε ποιοῦντας</em></strong><em>, καὶ ἐκκλίνετε ἀπ᾿ αὐτῶν· </em><strong><em>οἱ γὰρ τοιοῦτοι τῷ κυρίῳ ἡμῶν Χριστῷ οὐ δουλεύουσιν</em></strong><em> ἀλλὰ τῇ ἑαυτῶν κοιλίᾳ, καὶ διὰ τῆς χρηστολογίας καὶ εὐλογίας ἐξαπατῶσιν τὰς καρδίας τῶν ἀκάκων.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/rim/16/#L17-18"><em>Ρωμ 16:17-18</em></a><em>)</em></p></blockquote><blockquote><p><em>«ὅτι ἔλεγον ὑμῖν, Ἐπ᾿ ἐσχάτου [τοῦ] χρόνου ἔσονται ἐμπαῖκται κατὰ τὰς ἑαυτῶν ἐπιθυμίας πορευόμενοι τῶν ἀσεβειῶν. Οὗτοί εἰσιν οἱ </em><strong><em>ἀποδιορίζοντες</em></strong><em>, ψυχικοί, πνεῦμα μὴ ἔχοντες.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/iud/1/#L18-19"><em>Ιούδα 1:18-19</em></a><em>)</em></p></blockquote><p>Η Εκκλησία είναι το σώμα του Χριστού, και ο Χριστός είναι ο Σωτήρας του σώματος:</p><blockquote><p><em>«ὁ δὲ κύριος </em><strong><em>προσετίθει τοὺς σῳζομένους καθ᾿ ἡμέραν ἐπὶ τὸ αὐτό</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/act/2/#L47"><em>Πραξ 2:47</em></a><em>)</em></p></blockquote><blockquote><p><em>«</em><strong><em>σώματος αὐτοῦ</em></strong><em>, ὅ ἐστιν ἡ </em><strong><em>ἐκκλησία</em></strong><em>,» (</em><a href="https://bibleox.com/el/gr-lxx-byz/kol/1/#L24"><em>Κολ 1:24</em></a><em>)</em></p></blockquote><blockquote><p><em>«ὁ Χριστὸς κεφαλὴ τῆς ἐκκλησίας, αὐτὸς </em><strong><em>σωτὴρ τοῦ σώματος</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/ef/5/#L23"><em>Εφ 5:23</em></a><em>)</em></p></blockquote><h2>Όλοι υπόκεινται στην κρίση</h2><blockquote><p><em>«τοὺς γὰρ </em><strong><em>πάντας ἡμᾶς φανερωθῆναι δεῖ ἔμπροσθεν τοῦ βήματος τοῦ Χριστοῦ</em></strong><em>, ἵνα κομίσηται ἕκαστος τὰ διὰ τοῦ σώματος πρὸς ἃ </em><strong><em>ἔπραξεν</em></strong><em>, </em><strong><em>εἴτε ἀγαθὸν εἴτε φαῦλον</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/2kor/5/#L10"><em>Β Κορ 5:10</em></a><em>)</em></p></blockquote><blockquote><p><em>«ὅτι σὺν </em><strong><em>πᾶν τὸ ποίημα ὁ θεὸς ἄξει ἐν κρίσει</em></strong><em> ἐν παντὶ παρεωραμένῳ, </em><strong><em>ἐὰν ἀγαθὸν καὶ ἐὰν πονηρόν</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/ekl/12/#L14"><em>Εκ 12:14</em></a><em>)</em></p></blockquote><h3>Η κρίση θα αρχίσει από την Εκκλησία</h3><blockquote><p><em>«ὅτι </em><strong><em>ὁ καιρὸς τοῦ ἄρξασθαι τὸ κρίμα ἀπὸ τοῦ οἴκου τοῦ θεοῦ</em></strong><em>· εἰ δὲ </em><strong><em>πρῶτον ἀφ᾿ ἡμῶν</em></strong><em>, τί τὸ τέλος τῶν ἀπειθούντων τῷ τοῦ θεοῦ εὐαγγελίῳ; καὶ εἰ </em><strong><em>ὁ δίκαιος μόλις σῴζεται</em></strong><em>, ὁ ἀσεβὴς καὶ ἁμαρτωλὸς ποῦ φανεῖται;» (</em><a href="https://bibleox.com/el/gr-lxx-byz/1pet/4/#L17-18"><em>Α Πε 4:17-18</em></a><em>)</em></p></blockquote><h3>Όλοι αμαρτάνουν πολύ</h3><blockquote><p><em>«</em><strong><em>πολλὰ γὰρ πταίομεν ἅπαντες</em></strong><em>. εἴ τις ἐν λόγῳ οὐ πταίει, οὗτος τέλειος ἀνήρ, δυνατὸς χαλιναγωγῆσαι καὶ ὅλον τὸ σῶμα.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/iak/3/#L2"><em>Ιακ 3:2</em></a><em>)</em></p></blockquote><blockquote><p><em>«</em><strong><em>ἐὰν εἴπωμεν ὅτι ἁμαρτίαν οὐκ ἔχομεν, ἑαυτοὺς πλανῶμεν</em></strong><em> καὶ ἡ ἀλήθεια οὐκ ἔστιν ἐν ἡμῖν. &lt;…&gt; ἐὰν εἴπωμεν ὅτι οὐχ ἡμαρτήκαμεν, ψεύστην ποιοῦμεν αὐτὸν καὶ ὁ λόγος αὐτοῦ οὐκ ἔστιν ἐν ἡμῖν.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/1in/1/#L8,10"><em>Α Ιω 1:8,10</em></a><em>)</em></p></blockquote><h3>Πολλοί θα εκπλαγούν, μη έχοντας λάβει τη σωτηρία</h3><p>Νόμιζαν ότι είναι σωσμένοι:</p><blockquote><p><em>«</em><strong><em>πολλοὶ</em></strong><em> ἐροῦσίν μοι ἐν ἐκείνῃ τῇ ἡμέρᾳ, Κύριε κύριε, οὐ τῷ σῷ ὀνόματι </em><strong><em>ἐπροφητεύσαμεν</em></strong><em>, καὶ τῷ σῷ ὀνόματι </em><strong><em>δαιμόνια ἐξεβάλομεν</em></strong><em>, καὶ τῷ σῷ ὀνόματι </em><strong><em>δυνάμεις πολλὰς ἐποιήσαμεν</em></strong><em>; καὶ τότε ὁμολογήσω αὐτοῖς ὅτι </em><strong><em>Οὐδέποτε ἔγνων ὑμᾶς· ἀποχωρεῖτε ἀπ᾿ ἐμοῦ</em></strong><em> οἱ ἐργαζόμενοι τὴν ἀνομίαν.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/mf/7/#L22-23"><em>Μτ 7:22-23</em></a><em>)</em></p></blockquote><h2>Πολλοί δεν θα σωθούν</h2><h3>Δεν θα σωθούν όλοι</h3><blockquote><p><em>«Ἀγωνίζεσθε εἰσελθεῖν διὰ τῆς στενῆς θύρας, ὅτι </em><strong><em>πολλοί</em></strong><em>, λέγω ὑμῖν, ζητήσουσιν εἰσελθεῖν καὶ </em><strong><em>οὐκ ἰσχύσουσιν</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/lk/13/#L24"><em>Λκ 13:24</em></a><em>)</em></p></blockquote><blockquote><p><em>«Εἰσέλθατε διὰ τῆς στενῆς πύλης· ὅτι </em><strong><em>πλατεῖα ἡ πύλη</em></strong><em> καὶ εὐρύχωρος ἡ ὁδὸς ἡ </em><strong><em>ἀπάγουσα εἰς τὴν ἀπώλειαν, καὶ</em></strong><em> </em><strong><em>πολλοί εἰσιν οἱ εἰσερχόμενοι δι᾿ αὐτῆς</em></strong><em>· τί </em><strong><em>στενὴ ἡ πύλη</em></strong><em> καὶ τεθλιμμένη ἡ ὁδὸς ἡ </em><strong><em>ἀπάγουσα εἰς τὴν ζωήν, καὶ</em></strong><em> </em><strong><em>ὀλίγοι εἰσὶν οἱ εὑρίσκοντες αὐτήν</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/mf/7/#L13-14"><em>Μτ 7:13-14</em></a><em>)</em></p></blockquote><blockquote><p><em>«</em><strong><em>Οὐ πᾶς ὁ λέγων μοι, Κύριε κύριε, εἰσελεύσεται εἰς τὴν βασιλείαν τῶν οὐρανῶν</em></strong><em>, ἀλλ᾿ ὁ ποιῶν τὸ θέλημα τοῦ πατρός μου τοῦ ἐν τοῖς οὐρανοῖς.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/mf/7/#L21"><em>Μτ 7:21</em></a><em>)</em></p></blockquote><blockquote><p><em>«</em><strong><em>πολλοὶ γάρ εἰσιν κλητοὶ ὀλίγοι δὲ ἐκλεκτοί</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/mf/22/#L14"><em>Μτ 22:14</em></a><em>)</em></p></blockquote><h3>Λίγοι είναι εκείνοι που σώζονται</h3><blockquote><p><em>«εἶπεν δέ τις αὐτῷ, Κύριε, </em><strong><em>εἰ ὀλίγοι οἱ σῳζόμενοι</em></strong><em>; ὁ δὲ εἶπεν πρὸς αὐτούς, Ἀγωνίζεσθε εἰσελθεῖν διὰ τῆς στενῆς θύρας, ὅτι </em><strong><em>πολλοί, λέγω ὑμῖν, ζητήσουσιν εἰσελθεῖν καὶ οὐκ ἰσχύσουσιν</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/lk/13/#L23-24"><em>Λκ 13:23-24</em></a><em>)</em></p></blockquote><blockquote><p><em>«Εἰσέλθατε διὰ τῆς στενῆς πύλης· ὅτι </em><strong><em>πλατεῖα ἡ πύλη</em></strong><em> καὶ εὐρύχωρος ἡ ὁδὸς ἡ </em><strong><em>ἀπάγουσα εἰς τὴν ἀπώλειαν, καὶ</em></strong><em> </em><strong><em>πολλοί εἰσιν οἱ εἰσερχόμενοι δι᾿ αὐτῆς</em></strong><em>· τί </em><strong><em>στενὴ ἡ πύλη</em></strong><em> καὶ τεθλιμμένη ἡ ὁδὸς ἡ </em><strong><em>ἀπάγουσα εἰς τὴν ζωήν, καὶ</em></strong><em> </em><strong><em>ὀλίγοι εἰσὶν οἱ εὑρίσκοντες αὐτήν</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/mf/7/#L13-14"><em>Μτ 7:13-14</em></a><em>)</em></p></blockquote><blockquote><p><em>«</em><strong><em>πολλοὶ</em></strong><em> ἐροῦσίν μοι ἐν ἐκείνῃ τῇ ἡμέρᾳ, Κύριε κύριε, οὐ τῷ σῷ ὀνόματι ἐπροφητεύσαμεν, καὶ τῷ σῷ ὀνόματι δαιμόνια ἐξεβάλομεν, καὶ τῷ σῷ ὀνόματι δυνάμεις πολλὰς ἐποιήσαμεν; καὶ τότε ὁμολογήσω αὐτοῖς ὅτι </em><strong><em>Οὐδέποτε ἔγνων ὑμᾶς· ἀποχωρεῖτε ἀπ᾿ ἐμοῦ οἱ ἐργαζόμενοι τὴν ἀνομίαν</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/mf/7/#L22-23"><em>Μτ 7:22-23</em></a><em>)</em></p></blockquote><blockquote><p><em>«Μὴ φοβοῦ, </em><strong><em>τὸ μικρὸν ποίμνιον</em></strong><em>, ὅτι εὐδόκησεν ὁ πατὴρ ὑμῶν δοῦναι ὑμῖν τὴν βασιλείαν.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/lk/12/#L32"><em>Λκ 12:32</em></a><em>)</em></p></blockquote><blockquote><p>«ὁ ἀδικῶν ἀδικησάτω ἔτι, καὶ ὁ ῥυπαρὸς ῥυπανθήτω ἔτι, καὶ ὁ δίκαιος δικαιοσύνην ποιησάτω ἔτι, καὶ <strong>ὁ ἅγιος ἁγιασθήτω ἔτι</strong>. Ἰδοὺ ἔρχομαι ταχύ, καὶ ὁ μισθός μου μετ᾿ ἐμοῦ, <strong>ἀποδοῦναι ἑκάστῳ</strong> <strong>ὡς τὸ ἔργον ἐστὶν αὐτοῦ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/22/#L11-12">Απ 22:11-12</a>)</p></blockquote>'
