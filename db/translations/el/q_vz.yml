  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <h2>Η διαθήκη με τον Αβραάμ</h2><h3>Η υπόσχεση</h3><blockquote><p>«Καὶ εἶπεν κύριος τῷ Αβραμ Ἔξελθε ἐκ τῆς γῆς σου καὶ ἐκ τῆς συγγενείας σου καὶ ἐκ τοῦ οἴκου τοῦ πατρός σου εἰς τὴν γῆν, ἣν ἄν σοι δείξω· καὶ <strong>ποιήσω σε εἰς ἔθνος μέγα</strong> καὶ <strong>εὐλογήσω σε</strong> καὶ <strong>μεγαλυνῶ τὸ ὄνομά σου</strong>, καὶ <strong>ἔσῃ εὐλογητός</strong>· καὶ <strong>εὐλογήσω τοὺς εὐλογοῦντάς σε</strong>, καὶ <strong>τοὺς καταρωμένους σε καταράσομαι</strong>· καὶ <strong>ἐνευλογηθήσονται ἐν σοὶ πᾶσαι αἱ φυλαὶ τῆς γῆς</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/gen/12/#L1-3">Γεν 12:1-3</a>)</p></blockquote><h3>Η διαθήκη</h3><blockquote><p>«Καὶ ἐγὼ ἰδοὺ ἡ διαθήκη μου μετὰ σοῦ, καὶ <strong>ἔσῃ πατὴρ πλήθους ἐθνῶν</strong>. καὶ οὐ κληθήσεται ἔτι τὸ ὄνομά σου Αβραμ, ἀλλ᾿ ἔσται τὸ ὄνομά σου Αβρααμ, ὅτι πατέρα πολλῶν ἐθνῶν τέθεικά σε. καὶ αὐξανῶ σε σφόδρα σφόδρα καὶ <strong>θήσω σε εἰς ἔθνη</strong>, καὶ <strong>βασιλεῖς ἐκ σοῦ ἐξελεύσονται</strong>. καὶ <strong>στήσω τὴν διαθήκην μου ἀνὰ μέσον ἐμοῦ καὶ ἀνὰ μέσον σοῦ καὶ ἀνὰ μέσον τοῦ σπέρματός σου μετὰ σὲ</strong> εἰς γενεὰς αὐτῶν εἰς <strong>διαθήκην αἰώνιον</strong> <strong>εἶναί σου θεὸς καὶ τοῦ σπέρματός σου μετὰ σέ</strong>. καὶ <strong>δώσω σοι καὶ τῷ σπέρματί σου μετὰ σὲ τὴν γῆν</strong>, ἣν παροικεῖς, πᾶσαν τὴν γῆν Χανααν, <strong>εἰς κατάσχεσιν αἰώνιον</strong> καὶ <strong>ἔσομαι αὐτοῖς θεός</strong>. — καὶ εἶπεν ὁ θεὸς πρὸς Αβρααμ Σὺ δὲ τὴν διαθήκην μου διατηρήσεις, σὺ καὶ τὸ σπέρμα σου μετὰ σὲ εἰς τὰς γενεὰς αὐτῶν. καὶ αὕτη ἡ διαθήκη, ἣν διατηρήσεις, ἀνὰ μέσον ἐμοῦ καὶ ὑμῶν καὶ ἀνὰ μέσον τοῦ σπέρματός σου μετὰ σὲ εἰς τὰς γενεὰς αὐτῶν· <strong>περιτμηθήσεται ὑμῶν πᾶν ἀρσενικόν</strong>, καὶ περιτμηθήσεσθε τὴν σάρκα τῆς ἀκροβυστίας ὑμῶν, καὶ <strong>ἔσται ἐν σημείῳ διαθήκης ἀνὰ μέσον ἐμοῦ καὶ ὑμῶν</strong>. καὶ <strong>παιδίον ὀκτὼ ἡμερῶν περιτμηθήσεται ὑμῖν πᾶν ἀρσενικὸν εἰς τὰς γενεὰς ὑμῶν</strong>, ὁ οἰκογενὴς τῆς οἰκίας σου καὶ ὁ ἀργυρώνητος ἀπὸ παντὸς υἱοῦ ἀλλοτρίου, ὃς οὐκ ἔστιν ἐκ τοῦ σπέρματός σου. περιτομῇ περιτμηθήσεται ὁ οἰκογενὴς τῆς οἰκίας σου καὶ ὁ ἀργυρώνητος, καὶ ἔσται ἡ διαθήκη μου ἐπὶ τῆς σαρκὸς ὑμῶν εἰς διαθήκην αἰώνιον. καὶ ἀπερίτμητος ἄρσην, ὃς οὐ περιτμηθήσεται τὴν σάρκα τῆς ἀκροβυστίας αὐτοῦ τῇ ἡμέρᾳ τῇ ὀγδόῃ, ἐξολεθρευθήσεται ἡ ψυχὴ ἐκείνη ἐκ τοῦ γένους αὐτῆς, ὅτι τὴν διαθήκην μου διεσκέδασεν. Εἶπεν δὲ ὁ θεὸς τῷ Αβρααμ Σαρα ἡ γυνή σου, οὐ κληθήσεται τὸ ὄνομα αὐτῆς Σαρα, ἀλλὰ Σαρρα ἔσται τὸ ὄνομα αὐτῆς. εὐλογήσω δὲ αὐτὴν καὶ δώσω σοι ἐξ αὐτῆς τέκνον· καὶ εὐλογήσω αὐτόν, καὶ ἔσται εἰς ἔθνη, καὶ βασιλεῖς ἐθνῶν ἐξ αὐτοῦ ἔσονται.» (<a href="https://bibleox.com/el/gr-lxx-byz/gen/17/#L4-16">Γεν 17:4-16</a>)</p></blockquote><h3>Η διαθήκη στο Σινά</h3><blockquote><p>«βάδιζε εἰπὸν τοῖς υἱοῖς Ισραηλ λέγων Ἐγὼ κύριος καὶ ἐξάξω ὑμᾶς ἀπὸ τῆς δυναστείας τῶν Αἰγυπτίων καὶ <strong>ῥύσομαι ὑμᾶς ἐκ τῆς δουλείας</strong> καὶ λυτρώσομαι ὑμᾶς ἐν βραχίονι ὑψηλῷ καὶ κρίσει μεγάλῃ καὶ <strong>λήμψομαι ἐμαυτῷ ὑμᾶς λαὸν ἐμοὶ</strong> καὶ <strong>ἔσομαι ὑμῶν θεός</strong>, καὶ γνώσεσθε ὅτι ἐγὼ κύριος ὁ θεὸς ὑμῶν ὁ ἐξαγαγὼν ὑμᾶς ἐκ τῆς καταδυναστείας τῶν Αἰγυπτίων, καὶ <strong>εἰσάξω ὑμᾶς εἰς τὴν γῆν, εἰς ἣν ἐξέτεινα τὴν χεῖρά μου δοῦναι αὐτὴν τῷ Αβρααμ καὶ Ισαακ καὶ Ιακωβ, καὶ δώσω ὑμῖν αὐτὴν ἐν κλήρῳ</strong>· ἐγὼ κύριος.» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/6/#L6-8">Έξ 6:6-8</a>)</p></blockquote><h2>Η υπόσχεση για τον ερχομό του Σωτήρα</h2><h3>Στους πρώτους ανθρώπους</h3><blockquote><p>«καὶ εἶπεν κύριος ὁ θεὸς τῷ ὄφει Ὅτι ἐποίησας τοῦτο, ἐπικατάρατος σὺ ἀπὸ πάντων τῶν κτηνῶν καὶ ἀπὸ πάντων τῶν θηρίων τῆς γῆς· ἐπὶ τῷ στήθει σου καὶ τῇ κοιλίᾳ πορεύσῃ καὶ γῆν φάγῃ πάσας τὰς ἡμέρας τῆς ζωῆς σου. καὶ <strong>ἔχθραν θήσω ἀνὰ μέσον σου καὶ ἀνὰ μέσον τῆς γυναικὸς καὶ ἀνὰ μέσον <mark>τοῦ σπέρματός σου</mark> καὶ ἀνὰ μέσον τοῦ σπέρματος αὐτῆς</strong>· αὐτός σου τηρήσει κεφαλήν, καὶ σὺ τηρήσεις αὐτοῦ πτέρναν.» (<a href="https://bibleox.com/el/gr-lxx-byz/gen/3/#L14-15">Γεν 3:14-15</a>)</p></blockquote><h3>Στον Αβραάμ</h3><blockquote><p>«λέγων Κατ᾿ ἐμαυτοῦ ὤμοσα, λέγει κύριος, οὗ εἵνεκεν ἐποίησας τὸ ῥῆμα τοῦτο καὶ οὐκ ἐφείσω τοῦ υἱοῦ σου τοῦ ἀγαπητοῦ δι᾿ ἐμέ, ἦ μὴν <strong>εὐλογῶν εὐλογήσω σε καὶ πληθύνων πληθυνῶ τὸ σπέρμα σου</strong> ὡς τοὺς ἀστέρας τοῦ οὐρανοῦ καὶ ὡς τὴν ἄμμον τὴν παρὰ τὸ χεῖλος τῆς θαλάσσης, καὶ <strong>κληρονομήσει τὸ σπέρμα σου τὰς πόλεις</strong> τῶν ὑπεναντίων· καὶ <strong><mark>ἐνευλογηθήσονται ἐν τῷ σπέρματί σου πάντα τὰ ἔθνη τῆς γῆς</mark></strong>, ἀνθ᾿ ὧν ὑπήκουσας τῆς ἐμῆς φωνῆς.» (<a href="https://bibleox.com/el/gr-lxx-byz/gen/22/#L16-18">Γεν 22:16-18</a>)</p></blockquote><h3>Στον Ισαάκ</h3><blockquote><p>«ὤφθη δὲ αὐτῷ κύριος καὶ εἶπεν Μὴ καταβῇς εἰς Αἴγυπτον· κατοίκησον δὲ ἐν τῇ γῇ, ᾗ ἄν σοι εἴπω. καὶ παροίκει ἐν τῇ γῇ ταύτῃ, καὶ <strong>ἔσομαι μετὰ σοῦ</strong> καὶ <strong>εὐλογήσω σε</strong>· <strong>σοὶ γὰρ καὶ τῷ σπέρματί σου δώσω πᾶσαν τὴν γῆν ταύτην</strong> καὶ στήσω τὸν ὅρκον μου, ὃν ὤμοσα Αβρααμ τῷ πατρί σου. καὶ <strong>πληθυνῶ τὸ σπέρμα σου</strong> ὡς τοὺς ἀστέρας τοῦ οὐρανοῦ καὶ <strong>δώσω τῷ σπέρματί σου πᾶσαν τὴν γῆν ταύτην</strong>, καὶ <strong><mark>ἐνευλογηθήσονται ἐν τῷ σπέρματί σου πάντα τὰ ἔθνη τῆς γῆς</mark></strong>, ἀνθ᾿ ὧν ὑπήκουσεν Αβρααμ ὁ πατήρ σου τῆς ἐμῆς φωνῆς καὶ ἐφύλαξεν τὰ προστάγματά μου καὶ τὰς ἐντολάς μου καὶ τὰ δικαιώματά μου καὶ τὰ νόμιμά μου.» (<a href="https://bibleox.com/el/gr-lxx-byz/gen/26/#L2-5">Γεν 26:2-5</a>)</p></blockquote><h3>Στον Ιακώβ</h3><blockquote><p>«ὁ δὲ κύριος ἐπεστήρικτο ἐπ᾿ αὐτῆς καὶ εἶπεν Ἐγὼ κύριος ὁ θεὸς Αβρααμ τοῦ πατρός σου καὶ ὁ θεὸς Ισαακ· μὴ φοβοῦ· <strong>ἡ γῆ, ἐφ᾿ ἧς σὺ καθεύδεις ἐπ᾿ αὐτῆς, σοὶ δώσω αὐτὴν καὶ τῷ σπέρματί σου</strong>. καὶ <strong>ἔσται τὸ σπέρμα σου ὡς ἡ ἄμμος τῆς γῆς</strong> καὶ πλατυνθήσεται ἐπὶ θάλασσαν καὶ ἐπὶ λίβα καὶ ἐπὶ βορρᾶν καὶ ἐπ᾿ ἀνατολάς, καὶ <strong><mark>ἐνευλογηθήσονται ἐν σοὶ πᾶσαι αἱ φυλαὶ τῆς γῆς καὶ ἐν τῷ σπέρματί σου</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/gen/28/#L13-14">Γεν 28:13-14</a>)</p></blockquote><h2>Η διαθήκη με τον λαό του Ισραήλ</h2><blockquote><p>«Αὐτοὶ ἑωράκατε ὅσα πεποίηκα τοῖς Αἰγυπτίοις, καὶ ἀνέλαβον ὑμᾶς ὡσεὶ ἐπὶ πτερύγων ἀετῶν καὶ προσηγαγόμην ὑμᾶς πρὸς ἐμαυτόν. καὶ νῦν <strong><mark>ἐὰν</mark> ἀκοῇ ἀκούσητε τῆς ἐμῆς φωνῆς καὶ φυλάξητε τὴν διαθήκην μου, ἔσεσθέ μοι λαὸς περιούσιος ἀπὸ πάντων τῶν ἐθνῶν</strong>· ἐμὴ γάρ ἐστιν πᾶσα ἡ γῆ· &lt;…&gt; ἀπεκρίθη δὲ πᾶς ὁ λαὸς ὁμοθυμαδὸν καὶ εἶπαν Πάντα, ὅσα εἶπεν ὁ θεός, <strong>ποιήσομεν</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/19/#L4-5,8">Έξ 19:4-5,8</a>)</p></blockquote><blockquote><p>«<strong>Ἐὰν ἀκοῇ ἀκούσητε τῆς φωνῆς μου καὶ ποιήσῃς πάντα, ὅσα ἂν εἴπω σοι</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/23/#L22">Έξ 23:22</a>)</p></blockquote><blockquote><p>«καὶ λαβὼν τὸ βιβλίον τῆς διαθήκης ἀνέγνω εἰς τὰ ὦτα τοῦ λαοῦ, καὶ εἶπαν Πάντα, ὅσα ἐλάλησεν κύριος, <strong>ποιήσομεν καὶ ἀκουσόμεθα</strong>. λαβὼν δὲ Μωϋσῆς τὸ αἷμα κατεσκέδασεν τοῦ λαοῦ καὶ εἶπεν <strong>Ἰδοὺ τὸ αἷμα τῆς διαθήκης, ἧς διέθετο κύριος πρὸς ὑμᾶς</strong> περὶ πάντων τῶν λόγων τούτων.» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/24/#L7-8">Έξ 24:7-8</a>)</p></blockquote><h2>Οι αποστασίες του Ισραήλ από τον Θεό</h2><blockquote><p>«Καὶ ἐλάλησεν κύριος πρὸς Μωυσῆν λέγων Βάδιζε τὸ τάχος ἐντεῦθεν κατάβηθι· ἠνόμησεν γὰρ ὁ λαός σου, οὓς ἐξήγαγες ἐκ γῆς Αἰγύπτου· <strong>παρέβησαν ταχὺ ἐκ τῆς ὁδοῦ, ἧς ἐνετείλω αὐτοῖς</strong>· ἐποίησαν ἑαυτοῖς μόσχον καὶ προσκεκυνήκασιν αὐτῷ καὶ τεθύκασιν αὐτῷ καὶ εἶπαν Οὗτοι οἱ θεοί σου, Ισραηλ, οἵτινες ἀνεβίβασάν σε ἐκ γῆς Αἰγύπτου.» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/32/#L7-8">Έξ 32:7-8</a>)</p></blockquote><blockquote><p>«ὅτι δύο πονηρὰ ἐποίησεν <strong>ὁ λαός μου· ἐμὲ ἐγκατέλιπον, πηγὴν ὕδατος ζωῆς</strong>, καὶ ὤρυξαν ἑαυτοῖς λάκκους συντετριμμένους, οἳ οὐ δυνήσονται ὕδωρ συνέχειν.» (<a href="https://bibleox.com/el/gr-lxx-byz/ier/2/#L13">Ιερ 2:13</a>)</p></blockquote><blockquote><p>«<strong>ἐν συμβόλοις ἐπηρώτων</strong>, καὶ ἐν ῥάβδοις αὐτοῦ ἀπήγγελλον αὐτῷ· πνεύματι πορνείας ἐπλανήθησαν καὶ <strong>ἐξεπόρνευσαν ἀπὸ τοῦ θεοῦ αὐτῶν</strong>. ἐπὶ τὰς κορυφὰς τῶν ὀρέων ἐθυσίαζον καὶ ἐπὶ τοὺς βουνοὺς ἔθυον, ὑποκάτω δρυὸς καὶ λεύκης καὶ δένδρου συσκιάζοντος, ὅτι καλὸν σκέπη. διὰ τοῦτο ἐκπορνεύσουσιν αἱ θυγατέρες ὑμῶν, καὶ αἱ νύμφαι ὑμῶν μοιχεύσουσιν·» (<a href="https://bibleox.com/el/gr-lxx-byz/os/4/#L12-13">Ωσ 4:12-13</a>)</p></blockquote><blockquote><p>«ἔγνω βοῦς τὸν κτησάμενον καὶ ὄνος τὴν φάτνην τοῦ κυρίου αὐτοῦ· <strong>Ισραηλ δέ με οὐκ ἔγνω, καὶ ὁ λαός με οὐ συνῆκεν</strong>. <strong>οὐαὶ ἔθνος ἁμαρτωλόν, λαὸς πλήρης ἁμαρτιῶν, σπέρμα πονηρόν, υἱοὶ ἄνομοι· ἐγκατελίπατε τὸν κύριον καὶ παρωργίσατε τὸν ἅγιον τοῦ Ισραηλ</strong>. <strong>τί ἔτι πληγῆτε προστιθέντες ἀνομίαν; πᾶσα κεφαλὴ εἰς πόνον καὶ πᾶσα καρδία εἰς λύπην. ἀπὸ ποδῶν ἕως κεφαλῆς οὔτε τραῦμα οὔτε μώλωψ οὔτε πληγὴ φλεγμαίνουσα, οὐκ ἔστιν μάλαγμα ἐπιθεῖναι οὔτε ἔλαιον οὔτε καταδέσμους</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/is/1/#L3-6">Ησ 1:3-6</a>)</p></blockquote><blockquote><p>«κύριε, οἱ ὀφθαλμοί σου εἰς πίστιν· ἐμαστίγωσας αὐτούς, καὶ οὐκ ἐπόνεσαν· συνετέλεσας αὐτούς, καὶ <strong>οὐκ ἠθέλησαν δέξασθαι παιδείαν</strong>· ἐστερέωσαν τὰ πρόσωπα αὐτῶν ὑπὲρ πέτραν καὶ <strong>οὐκ ἠθέλησαν ἐπιστραφῆναι</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ier/5/#L3">Ιερ 5:3</a>)</p></blockquote><blockquote><p>«κατέστρεψα ὑμᾶς, καθὼς κατέστρεψεν ὁ θεὸς Σοδομα καὶ Γομορρα, καὶ ἐγένεσθε ὡς δαλὸς ἐξεσπασμένος ἐκ πυρός· καὶ <strong>οὐδ᾿ ὧς ἐπεστρέψατε πρός με</strong>, λέγει κύριος.» (<a href="https://bibleox.com/el/gr-lxx-byz/am/4/#L11">Αμ 4:11</a>)</p></blockquote><h3>Ο Θεός προειδοποίησε για ποιο λόγο θα εκδιώξει τον Ισραήλ από την υποσχεμένη γη</h3><h4>Η προειδοποίηση</h4><p>Ο εβραϊκός λαός προειδοποιήθηκε ότι λαμβάνει την υποσχεμένη από τον Θεό γη όχι εξαιτίας της δικής του δικαιοσύνης. Οι προηγούμενοι λαοί εκδιώχθηκαν από τη γη του Θεού επειδή το μέτρο των αμαρτιών τους ξεχείλισε. Ο Ισραήλ όμως εισάγεται σε αυτή τη γη του Θεού με την προειδοποίηση ότι, αν αμαρτήσει και αυτός με τον ίδιο τρόπο, τότε και ο Θεός του θα τον εκδιώξει από τη γη Του:</p><blockquote><p>«Ἐὰν δὲ εἰσαγάγῃ σε κύριος ὁ θεός σου εἰς τὴν γῆν, εἰς ἣν εἰσπορεύῃ ἐκεῖ κληρονομῆσαι, καὶ <strong>ἐξαρεῖ ἔθνη μεγάλα ἀπὸ προσώπου σου, τὸν Χετταῖον καὶ Γεργεσαῖον καὶ Αμορραῖον καὶ Χαναναῖον καὶ Φερεζαῖον καὶ Ευαῖον καὶ Ιεβουσαῖον</strong>, ἑπτὰ ἔθνη πολλὰ καὶ ἰσχυρότερα ὑμῶν» (<a href="https://bibleox.com/el/gr-lxx-byz/vtor/7/#L1">Δτ 7:1</a> · <a href="https://bibleox.com/el/gr-lxx-byz/nav/3/#L10">Ιησ 3:10</a> · <a href="https://bibleox.com/el/gr-lxx-byz/ish/3/#L8,17">Έξ 3:8,17</a>),</p><p>«<strong><mark>μὴ εἴπῃς ἐν τῇ καρδίᾳ σου ἐν τῷ ἐξαναλῶσαι κύριον τὸν θεόν σου τὰ ἔθνη ταῦτα ἀπὸ προσώπου σου λέγων Διὰ τὰς δικαιοσύνας μου εἰσήγαγέν με κύριος κληρονομῆσαι τὴν γῆν τὴν ἀγαθὴν ταύτην</mark></strong>· ἀλλὰ διὰ τὴν ἀσέβειαν τῶν ἐθνῶν τούτων κύριος ἐξολεθρεύσει αὐτοὺς πρὸ προσώπου σου. <strong><mark>οὐχὶ διὰ τὴν δικαιοσύνην σου οὐδὲ διὰ τὴν ὁσιότητα τῆς καρδίας σου σὺ εἰσπορεύῃ κληρονομῆσαι τὴν γῆν αὐτῶν</mark></strong>, <strong><mark>ἀλλὰ διὰ τὴν ἀσέβειαν τῶν ἐθνῶν τούτων κύριος ἐξολεθρεύσει αὐτοὺς ἀπὸ προσώπου σου καὶ ἵνα στήσῃ τὴν διαθήκην αὐτοῦ, ἣν ὤμοσεν τοῖς πατράσιν ὑμῶν, τῷ Αβρααμ καὶ τῷ Ισαακ καὶ τῷ Ιακωβ</mark></strong>. καὶ γνώσῃ σήμερον ὅτι <strong><mark>οὐχὶ διὰ τὰς δικαιοσύνας σου κύριος ὁ θεός σου δίδωσίν σοι τὴν γῆν τὴν ἀγαθὴν ταύτην κληρονομῆσαι, ὅτι λαὸς σκληροτράχηλος εἶ</mark></strong>. μνήσθητι <strong>μὴ ἐπιλάθῃ ὅσα παρώξυνας κύριον τὸν θεόν σου</strong> ἐν τῇ ἐρήμῳ· ἀφ᾿ ἧς ἡμέρας ἐξήλθετε ἐξ Αἰγύπτου ἕως ἤλθετε εἰς τὸν τόπον τοῦτον, ἀπειθοῦντες διετελεῖτε τὰ πρὸς κύριον. καὶ ἐν Χωρηβ παρωξύνατε κύριον, καὶ <strong>ἐθυμώθη κύριος ἐφ᾿ ὑμῖν ἐξολεθρεῦσαι ὑμᾶς</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/vtor/9/#L4-8">Δτ 9:4-8</a>)</p></blockquote><blockquote><p>«κατὰ τὰ ἐπιτηδεύματα γῆς Αἰγύπτου, ἐν ᾗ κατῳκήσατε ἐπ᾿ αὐτῇ, οὐ ποιήσετε καὶ <strong>κατὰ τὰ ἐπιτηδεύματα γῆς Χανααν, εἰς ἣν ἐγὼ εἰσάγω ὑμᾶς ἐκεῖ, οὐ ποιήσετε</strong> καὶ τοῖς νομίμοις αὐτῶν οὐ πορεύσεσθε· &lt;…&gt; <strong>Μὴ μιαίνεσθε ἐν πᾶσιν τούτοις· ἐν πᾶσι γὰρ τούτοις ἐμιάνθησαν τὰ ἔθνη, ἃ ἐγὼ ἐξαποστέλλω πρὸ προσώπου ὑμῶν</strong>, καὶ ἐμιάνθη ἡ γῆ, καὶ ἀνταπέδωκα ἀδικίαν αὐτοῖς δι᾿ αὐτήν, καὶ προσώχθισεν ἡ γῆ τοῖς ἐγκαθημένοις ἐπ᾿ αὐτῆς. <strong><mark>καὶ φυλάξεσθε πάντα τὰ νόμιμά μου καὶ πάντα τὰ προστάγματά μου</mark></strong> καὶ οὐ ποιήσετε ἀπὸ πάντων τῶν βδελυγμάτων τούτων, ὁ ἐγχώριος καὶ ὁ προσγενόμενος προσήλυτος ἐν ὑμῖν· πάντα γὰρ τὰ βδελύγματα ταῦτα ἐποίησαν οἱ ἄνθρωποι τῆς γῆς οἱ ὄντες πρότεροι ὑμῶν, καὶ ἐμιάνθη ἡ γῆ· <strong><mark>καὶ ἵνα μὴ προσοχθίσῃ ὑμῖν ἡ γῆ ἐν τῷ μιαίνειν ὑμᾶς αὐτήν, ὃν τρόπον προσώχθισεν τοῖς ἔθνεσιν τοῖς πρὸ ὑμῶν</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/lev/18/#L3,24-28">Λευ 18:3,24-28</a>)</p></blockquote><blockquote><p>«Καὶ ἔσται <strong><mark>ἐὰν μὴ εἰσακούσῃς τῆς φωνῆς κυρίου τοῦ θεοῦ σου</mark></strong> φυλάσσειν καὶ ποιεῖν πάσας τὰς ἐντολὰς αὐτοῦ, ὅσας ἐγὼ ἐντέλλομαί σοι σήμερον, καὶ ἐλεύσονται ἐπὶ σὲ πᾶσαι αἱ κατάραι αὗται καὶ καταλήμψονταί σε. &lt;…&gt; <strong>ἐὰν μὴ εἰσακούσητε ποιεῖν πάντα τὰ ῥήματα τοῦ νόμου τούτου</strong> τὰ γεγραμμένα ἐν τῷ βιβλίῳ τούτῳ φοβεῖσθαι τὸ ὄνομα τὸ ἔντιμον καὶ τὸ θαυμαστὸν τοῦτο, ΚΎΡΙΟΝ τὸν ΘΕΌΝ σου, &lt;…&gt; καὶ ἔσται ὃν τρόπον εὐφράνθη κύριος ἐφ᾿ ὑμῖν εὖ ποιῆσαι ὑμᾶς καὶ πληθῦναι ὑμᾶς, <strong>οὕτως εὐφρανθήσεται κύριος ἐφ᾿ ὑμῖν ἐξολεθρεῦσαι ὑμᾶς, καὶ <mark>ἐξαρθήσεσθε ἀπὸ τῆς γῆς, εἰς ἣν ὑμεῖς εἰσπορεύεσθε</mark> ἐκεῖ κληρονομῆσαι αὐτήν</strong>. καὶ διασπερεῖ σε κύριος ὁ θεός σου εἰς πάντα τὰ ἔθνη ἀπ᾿ ἄκρου τῆς γῆς ἕως ἄκρου τῆς γῆς, καὶ δουλεύσεις ἐκεῖ θεοῖς ἑτέροις, ξύλοις καὶ λίθοις, οὓς οὐκ ἠπίστω σὺ καὶ οἱ πατέρες σου.» (<a href="https://bibleox.com/el/gr-lxx-byz/vtor/28/#L15,58,63-64">Δτ 28:15,58,63-64</a>)</p></blockquote><h4>Ο λαός του Ισραήλ φέρθηκε ακόμη χειρότερα από εκείνους τους λαούς που πριν από αυτόν είχαν εκδιωχθεί για τις αμαρτίες τους, και έτσι εκδιώχθηκε και αυτός</h4><blockquote><p>«καὶ οὐκ ἤκουσαν, καὶ ἐπλάνησεν αὐτοὺς Μανασσης <strong><mark>τοῦ ποιῆσαι τὸ πονηρὸν ἐν ὀφθαλμοῖς κυρίου ὑπὲρ τὰ ἔθνη, ἃ ἠφάνισεν κύριος ἐκ προσώπου υἱῶν Ισραηλ</mark></strong>. καὶ ἐλάλησεν κύριος ἐν χειρὶ δούλων αὐτοῦ τῶν προφητῶν λέγων Ἀνθ ὧν ὅσα ἐποίησεν Μανασσης ὁ βασιλεὺς Ιουδα τὰ βδελύγματα ταῦτα <strong><mark>τὰ πονηρὰ ἀπὸ πάντων, ὧν ἐποίησεν ὁ Αμορραῖος ὁ ἔμπροσθεν</mark></strong>, καὶ ἐξήμαρτεν καί γε Ιουδα ἐν τοῖς εἰδώλοις αὐτῶν» (<a href="https://bibleox.com/el/gr-lxx-byz/4ts/21/#L9-11">Δ Βασ 21:9-11</a>)</p></blockquote><blockquote><p>«καὶ ἐγένετο μετὰ πάσας τὰς κακίας σου, λέγει κύριος, &lt;…&gt; καὶ ἐγένετο ἐν σοὶ διεστραμμένον παρὰ τὰς γυναῖκας ἐν τῇ πορνείᾳ σου, καὶ μετὰ σοῦ πεπορνεύκασιν ἐν τῷ προσδιδόναι σε μισθώματα, καὶ σοὶ μισθώματα οὐκ ἐδόθη, καὶ ἐγένετο ἐν σοὶ διεστραμμένα. — <strong>διὰ τοῦτο, πόρνη, ἄκουε λόγον κυρίου</strong> &lt;…&gt; θυγάτηρ τῆς μητρός σου σὺ εἶ ἡ ἀπωσαμένη τὸν ἄνδρα αὐτῆς καὶ τὰ τέκνα αὐτῆς καὶ ἀδελφὴ τῶν ἀδελφῶν σου τῶν ἀπωσαμένων τοὺς ἄνδρας αὐτῶν καὶ τὰ τέκνα αὐτῶν· <strong>ἡ μήτηρ ὑμῶν Χετταία, καὶ ὁ πατὴρ ὑμῶν Αμορραῖος. ἡ ἀδελφὴ ὑμῶν ἡ πρεσβυτέρα Σαμάρεια, αὐτὴ καὶ αἱ θυγατέρες αὐτῆς, ἡ κατοικοῦσα ἐξ εὐωνύμων σου· καὶ ἡ ἀδελφή σου ἡ νεωτέρα σου ἡ κατοικοῦσα ἐκ δεξιῶν σου Σοδομα καὶ αἱ θυγατέρες αὐτῆς</strong>. καὶ <strong><mark>οὐδ᾿ ὧς ἐν ταῖς ὁδοῖς αὐτῶν ἐπορεύθης οὐδὲ κατὰ τὰς ἀνομίας αὐτῶν ἐποίησας· παρὰ μικρὸν καὶ ὑπέρκεισαι αὐτὰς ἐν πάσαις ταῖς ὁδοῖς σου</mark></strong>. ζῶ ἐγώ, λέγει κύριος, <strong><mark>εἰ πεποίηκεν Σοδομα ἡ ἀδελφή σου, αὐτὴ καὶ αἱ θυγατέρες αὐτῆς, ὃν τρόπον ἐποίησας σὺ καὶ αἱ θυγατέρες σου</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/iez/16/#L23,34-35,45-48">Ιεζ 16:23,34-35,45-48</a>)</p></blockquote><p>Πριν από τη σταύρωση του Ιησού Χριστού, η μεγαλύτερη τιμωρία που δέχθηκε ο εβραϊκός λαός κράτησε περίπου 70 χρόνια — η βαβυλωνιακή αιχμαλωσία. Μετά όμως την απόρριψη και τη θανάτωση του Χριστού, ο εβραϊκός λαός εκδιώχθηκε από τη γη του για περίπου 2000 χρόνια, και ο ναός δεν έχει επιστραφεί μέχρι σήμερα.</p><h2>Το τέλος της Παλαιάς Διαθήκης</h2><p><a href="https://bibleox.com/el/el/w/%CE%97_%CE%A0%CE%B1%CE%BB%CE%B1%CE%B9%CE%AC_%CE%94%CE%B9%CE%B1%CE%B8%CE%AE%CE%BA%CE%B7_%CF%84%CE%AD%CE%BB%CE%BF%CF%82">https://bibleox.com/el/el/w/Η_Παλαιά_Διαθήκη_τέλος</a></p>
