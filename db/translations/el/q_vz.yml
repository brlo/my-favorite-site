    title: Η γυναίκα στον Νόμο του Μωυσή
    priority: 7
  update: true
  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: '<p>Κυρίως, ο νόμος περιγράφει καταστάσεις της ζωής που χαρακτηρίζουν το γυναικείο φύλο, καθώς και διάφορες καταστάσεις στις σχέσεις μεταξύ των φύλων. Μεταξύ αυτών μπορούν να διακριθούν τομείς όπως:</p><ul><li><p>η τεκνογονία (<a href="https://bibleox.com/el/gr-lxx-byz/lev/12/">Λευ 12</a>)</p></li></ul><ul><li><p>η αιμορραγία (<a href="https://bibleox.com/el/gr-lxx-byz/lev/15/#L19-30">Λευ 15:19-30</a>, <a href="https://bibleox.com/el/gr-lxx-byz/lev/18/#L19">Λευ 18:19</a>, <a href="https://bibleox.com/el/gr-lxx-byz/lev/20/#L18">Λευ 20:18</a>)</p></li></ul><ul><li><p>η γύμνωση (<a href="https://bibleox.com/el/gr-lxx-byz/lev/18/">Λευ 18</a>)</p></li></ul><ul><li><p>οι σχέσεις με τους άνδρες, η επιλογή συζύγου (<a href="https://bibleox.com/el/gr-lxx-byz/lev/19/#L20">Λευ 19:20</a>, <a href="https://bibleox.com/el/gr-lxx-byz/lev/21/#L7-14">Λευ 21:7-14</a>, <a href="https://bibleox.com/el/gr-lxx-byz/chis/5/#L12-31">Αρ 5:12-31</a>, <a href="https://bibleox.com/el/gr-lxx-byz/chis/36/">Αρ 36</a>)</p></li></ul><ul><li><p>οι ευχές (<a href="https://bibleox.com/el/gr-lxx-byz/lev/27/#L3-8">Λευ 27:3-8</a>, <a href="https://bibleox.com/el/gr-lxx-byz/chis/6/">Αρ 6</a>, <a href="https://bibleox.com/el/gr-lxx-byz/chis/30/#L4-17">Αρ 30:4-17</a>)</p></li></ul><ul><li><p>οι αμαρτίες (<a href="https://bibleox.com/el/gr-lxx-byz/lev/19/#L20">Λευ 19:20</a>, <a href="https://bibleox.com/el/gr-lxx-byz/lev/20/#L10-21">Λευ 20:10-21</a>)</p></li></ul><p>Ας εξετάσουμε αυτούς τους τομείς χωριστά, με τη σειρά που εκτέθηκαν.</p><h2>Η τεκνογονία</h2><p>Μετά τη γέννηση ενός παιδιού, ο νόμος ορίζει για τη γυναίκα τον αριθμό των ημερών καθαρισμού, και αυτές διαφέρουν ανάλογα με το φύλο του παιδιού που γεννήθηκε. Μετά τη γέννηση αρσενικού βρέφους, η γυναίκα θεωρείται ακάθαρτη για 7 ημέρες και της επιβάλλονται 33 ημέρες καθαρισμού, κατά τις οποίες δεν μπορεί να αγγίξει τίποτε ιερό ούτε να προσέλθει στο αγιαστήριο (<a href="https://bibleox.com/el/gr-lxx-byz/lev/12/#L2-4">Λευ 12:2-4</a>). Στην περίπτωση θηλυκού βρέφους, οι ημέρες αυτές διπλασιάζονται ανάλογα (<a href="https://bibleox.com/el/gr-lxx-byz/lev/12/#L5">Λευ 12:5</a>).</p><h2>Η αιμορραγία</h2><p>Κατ’ αρχάς αξίζει να αναφερθεί ότι ο νόμος λέει πως οποιαδήποτε έκκριση από το σώμα του ανθρώπου τον καθιστά ακάθαρτο:</p><blockquote><p>«Λάλησον τοῖς υἱοῖς Ισραηλ καὶ ἐρεῖς αὐτοῖς Ἀνδρὶ ἀνδρί, ᾧ ἐὰν γένηται ῥύσις ἐκ τοῦ σώματος αὐτοῦ, ἡ ῥύσις αὐτοῦ ἀκάθαρτός ἐστιν.» (<a href="https://bibleox.com/el/gr-lxx-byz/lev/15/#L2">Λευ 15:2</a>)</p></blockquote><p>Ωστόσο, για τις γυναίκες, για ευνόητους λόγους, γίνεται ξεχωριστή και αρκετά εκτενής αναφορά.</p><p>Γενικά, όσο η γυναίκα έχει αιμορραγία είναι ακάθαρτη, και στη συνέχεια της επιβάλλονται 7 ημέρες καθαρισμού. Αν έχει συνεχώς αιμορραγία, τότε είναι πάντοτε ακάθαρτη. Η ακάθαρτη γυναίκα δεν μπορεί να έχει σχέση με τον σύζυγό της, και αν συμβεί το αντίθετο, ο σύζυγος θα είναι ακάθαρτος με τον ίδιο ακριβώς τρόπο όπως και η γυναίκα, και στον σύζυγο επιβάλλονται οι ίδιες διατάξεις όπως και στη γυναίκα. Όλα τα πράγματα πάνω στα οποία θα ξαπλώσει ή θα καθίσει η γυναίκα με αιμορραγία γίνονται ακάθαρτα, και όποιος τα αγγίξει θα είναι ακάθαρτος μέχρι το βράδυ. Μετά τις ημέρες καθαρισμού πρέπει να προσφερθεί θυσία με δύο τρυγόνια ή δύο νεαρά περιστέρια (<a href="https://bibleox.com/el/gr-lxx-byz/lev/15/#L29-30">Λευ 15:29-30</a>), μετά την οποία η γυναίκα θεωρείται καθαρή.</p><p>Υπάρχουν και άλλες νομικές διατάξεις που σχετίζονται με τη γυναίκα και την αιμορραγία, αλλά για αυτές θα γίνει λόγος στις επόμενες παραγράφους.</p><h2>Η γύμνωση</h2><blockquote><p>«Ἄνθρωπος ἄνθρωπος πρὸς πάντα οἰκεῖα σαρκὸς αὐτοῦ οὐ προσελεύσεται ἀποκαλύψαι ἀσχημοσύνην· ἐγὼ κύριος.» (<a href="https://bibleox.com/el/gr-lxx-byz/lev/18/#L6">Λευ 18:6</a>)</p></blockquote><p>Αν και σε αυτό το κεφάλαιο αναφέρεται και η γύμνωση του άνδρα (του πατέρα), όπως είναι λογικό, κυρίως γίνεται απαρίθμηση των απαγορεύσεων για την αποκάλυψη της γύμνωσης γυναικών που βρίσκονται σε διάφορες σχέσεις συγγένειας, όχι μόνο κατά σάρκα:</p><blockquote><p>«ἀσχημοσύνην νύμφης σου οὐκ ἀποκαλύψεις· γυνὴ γὰρ υἱοῦ σού ἐστιν, οὐκ ἀποκαλύψεις τὴν ἀσχημοσύνην αὐτῆς.» (<a href="https://bibleox.com/el/gr-lxx-byz/lev/18/#L15">Λευ 18:15</a>)</p></blockquote><p>Επιστρέφοντας στα ήδη αναφερθέντα σημεία του νόμου περί αιμορραγίας, ας αναφέρουμε και αυτή την απαγόρευση προς τον σύζυγο σχετικά με τη γυναίκα:</p><blockquote><p>«Καὶ πρὸς γυναῖκα ἐν χωρισμῷ ἀκαθαρσίας αὐτῆς οὐ προσελεύσῃ ἀποκαλύψαι τὴν ἀσχημοσύνην αὐτῆς.» (<a href="https://bibleox.com/el/gr-lxx-byz/lev/18/#L19">Λευ 18:19</a>)</p></blockquote><h2>Οι σχέσεις με τους άνδρες, η επιλογή συζύγου</h2><p>Αν ένας άνδρας αποπλανήσει δούλη που είναι αρραβωνιασμένη με άλλον άνδρα, δεν πρέπει να τιμωρηθεί με θάνατο, σε αντίθεση με την περίπτωση που θα αποπλανούσε ελεύθερη (δηλαδή όχι δούλη) (<a href="https://bibleox.com/el/gr-lxx-byz/vtor/22/#L25">Δτ 22:25</a>), αλλά πρέπει μόνο να προσφέρει θυσία για παράπτωμα — ένα κριάρι (<a href="https://bibleox.com/el/gr-lxx-byz/lev/19/#L20-21">Λευ 19:20-21</a>).</p><p>Ο σύζυγος και η σύζυγος θεωρούνται ακάθαρτοι μέχρι το βράδυ μετά τη συζυγική σχέση (<a href="https://bibleox.com/el/gr-lxx-byz/lev/15/#L18">Λευ 15:18</a>).</p><p>Σύζυγοι των ιερέων μπορούσαν να γίνουν μόνο παρθένες (<a href="https://bibleox.com/el/gr-lxx-byz/lev/21/#L13">Λευ 21:13</a>) και όχι χήρες, διαζευγμένες, διαφθαρμένες ή πόρνες.</p><p>Αν μια γυναίκα, λόγω έλλειψης αρσενικών κληρονόμων, κληρονομεί γη, μπορεί να παντρευτεί μόνο κάποιον από τη φυλή του πατέρα της (<a href="https://bibleox.com/el/gr-lxx-byz/chis/36/#L8">Αρ 36:8</a>), ώστε η κληρονομιά να μην περνά σε άλλες φυλές.</p><p>Υπάρχει ακόμη και διάταξη που περιγράφει τις ενέργειες απέναντι στη γυναίκα την οποία ο σύζυγός της υποπτεύθηκε για μοιχεία (<a href="https://bibleox.com/el/gr-lxx-byz/chis/5/#L12-31">Αρ 5:12-31</a>).</p><h2>Οι ευχές (υπόσχεση στον Θεό)</h2><p>Υπήρχαν άνθρωποι που έδιναν ορισμένες ευχές στον Θεό, και μερικοί από αυτούς ονομάζονταν ναζιραίοι (μην μπερδεύετε· τον Ιησού Χριστό τον αποκαλούσαν Ναζωραίο, επειδή ήταν από τη Ναζαρέτ). Αυτοί υποσχόνταν να μην πίνουν και να μη τρώνε κανένα προϊόν από σταφύλι, να μην κόβουν τα μαλλιά τους και να μην πλησιάζουν νεκρό σώμα. Μια τέτοια ευχή μπορούσε να δοθεί τόσο για ορισμένο χρόνο όσο και για όλη τη ζωή. Αυτό αναφέρεται μόνο για να τονιστεί το γεγονός ότι ναζιραίοι ήταν και άνδρες και γυναίκες.</p><p>Ο νόμος επέτρεπε την εξαγορά όσων είχαν πουληθεί (<a href="https://bibleox.com/el/gr-lxx-byz/lev/25/#L25">Λευ 25:25</a>)· κατ’ αναλογία οριζόταν τιμή ακόμη και για εκείνον που είχε αφιερώσει τη ζωή του στον Θεό μέσω της υπηρεσίας στο αγιαστήριο. Εδώ μπορεί να παρατηρήσει κανείς ότι η ζωή του άνδρα και της γυναίκας αποτιμάται διαφορετικά. Για παράδειγμα, ο άνδρας από 20 έως 60 ετών αποτιμάται σε 50 ιερά ασημένια σίκλα, ενώ η γυναίκα σε 30 σίκλα (<a href="https://bibleox.com/el/gr-lxx-byz/lev/27/#L3-4">Λευ 27:3-4</a>). Αυτή τη διαφορά ο Λοπούχιν Α.Π. την ερμηνεύει με το ότι σε κάθε περίπτωση αποτιμόταν η άνιση ικανότητα για εργασία του προσώπου που αφιερωνόταν στο αγιαστήριο· απαιτούνταν από αυτό σωματική εργασία για το αγιαστήριο: κόψιμο ξύλων, μεταφορά νερού και τα λοιπά.</p><blockquote><p>«ἄνθρωπος ἄνθρωπος, ὃς ἂν εὔξηται εὐχὴν κυρίῳ ἢ ὀμόσῃ ὅρκον ἢ ὁρίσηται ὁρισμῷ περὶ τῆς ψυχῆς αὐτοῦ, οὐ βεβηλώσει τὸ ῥῆμα αὐτοῦ· πάντα, ὅσα ἐὰν ἐξέλθῃ ἐκ τοῦ στόματος αὐτοῦ, ποιήσει.» (<a href="https://bibleox.com/el/gr-lxx-byz/chis/30/#L3">Αρ 30:3</a>)</p></blockquote><p>Έτσι, όποιος ορκίστηκε οφείλει να εκπληρώσει τον όρκο του, όμως όσον αφορά τη γυναίκα υπάρχουν επιφυλάξεις. Αν η σύζυγος δώσει όρκο ή ευχή, ο σύζυγος που το άκουσε μπορεί να ακυρώσει αυτόν τον όρκο, και αυτός θα θεωρείται σαν να μην έγινε ποτέ. Το ίδιο και ο πατέρας μπορεί να ακυρώσει τον όρκο της κόρης του που άκουσε κατά τη νεότητά της.</p><h2>Οι αμαρτίες</h2><p>Περιγράφεται μια σειρά νόμων που επιβάλλουν αυστηρές ποινές για αμαρτίες, όπως:</p><ul><li><p>η μοιχεία (<a href="https://bibleox.com/el/gr-lxx-byz/lev/20/#L10-12">Λευ 20:10-12</a>),</p></li><li><p>η κτηνοβασία (περιγράφεται ειδικά σε σχέση με τις γυναίκες: <a href="https://bibleox.com/el/gr-lxx-byz/lev/20/#L16">Λευ 20:16</a>, <a href="https://bibleox.com/el/gr-lxx-byz/lev/18/#L23">Λευ 18:23</a>),</p></li><li><p>η σοδομία (<a href="https://bibleox.com/el/gr-lxx-byz/lev/20/#L13">Λευ 20:13</a>) και τα λοιπά.</p></li></ul><p>Τέτοια παραπτώματα του νόμου τιμωρούνταν με θάνατο.</p>'
