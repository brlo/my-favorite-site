  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: '<h2>Για την Καινή Διαθήκη που θα έρθει</h2><p>Προφητείες της Παλαιάς Διαθήκης ότι, αντί για τη διαθήκη με τον εβραϊκό λαό, την οποία αυτοί παραβίασαν, θα συναφθεί Καινή Διαθήκη με έναν νέο λαό:</p><blockquote><p>«καὶ ἔφαγεν Ιακωβ καὶ ἐνεπλήσθη, καὶ <strong>ἀπελάκτισεν ὁ ἠγαπημένος</strong>, ἐλιπάνθη, ἐπαχύνθη, ἐπλατύνθη· καὶ <strong>ἐγκατέλιπεν θεὸν</strong> τὸν ποιήσαντα αὐτὸν καὶ ἀπέστη ἀπὸ θεοῦ σωτῆρος αὐτοῦ. <strong>παρώξυνάν με ἐπ᾿ ἀλλοτρίοις</strong>, ἐν βδελύγμασιν αὐτῶν ἐξεπίκρανάν με· <strong>ἔθυσαν δαιμονίοις καὶ οὐ θεῷ, θεοῖς, οἷς οὐκ ᾔδεισαν· καινοὶ πρόσφατοι ἥκασιν, οὓς οὐκ ᾔδεισαν οἱ πατέρες αὐτῶν</strong>. θεὸν τὸν γεννήσαντά σε ἐγκατέλιπες καὶ ἐπελάθου θεοῦ τοῦ τρέφοντός σε. καὶ εἶδεν κύριος καὶ ἐζήλωσεν καὶ παρωξύνθη δι᾿ ὀργὴν υἱῶν αὐτοῦ καὶ θυγατέρων καὶ εἶπεν <strong>Ἀποστρέψω τὸ πρόσωπόν μου ἀπ᾿ αὐτῶν καὶ δείξω τί ἔσται αὐτοῖς ἐπ᾿ ἐσχάτων</strong>· ὅτι γενεὰ ἐξεστραμμένη ἐστίν, υἱοί, οἷς οὐκ ἔστιν πίστις ἐν αὐτοῖς. αὐτοὶ <strong>παρεζήλωσάν με ἐπ᾿ οὐ θεῷ</strong>, παρώργισάν με ἐν τοῖς εἰδώλοις αὐτῶν· κἀγὼ <strong>παραζηλώσω αὐτοὺς ἐπ᾿ οὐκ ἔθνει</strong>, ἐπ᾿ ἔθνει ἀσυνέτῳ παροργιῶ αὐτούς.» (<a href="https://bibleox.com/el/gr-lxx-byz/vtor/32/#L15-21">Δτ 32:15-21</a>)</p></blockquote><blockquote><p>«Ἰδοὺ ἡμέραι ἔρχονται, φησὶν κύριος, καὶ <strong>διαθήσομαι τῷ οἴκῳ Ισραηλ καὶ τῷ οἴκῳ Ιουδα διαθήκην καινήν</strong>, οὐ κατὰ τὴν διαθήκην, ἣν διεθέμην τοῖς πατράσιν αὐτῶν ἐν ἡμέρᾳ ἐπιλαβομένου μου τῆς χειρὸς αὐτῶν ἐξαγαγεῖν αὐτοὺς ἐκ γῆς Αἰγύπτου, ὅτι <strong>αὐτοὶ οὐκ ἐνέμειναν ἐν τῇ διαθήκῃ μου, καὶ ἐγὼ ἠμέλησα αὐτῶν</strong>, φησὶν κύριος· ὅτι <strong>αὕτη ἡ διαθήκη, ἣν διαθήσομαι τῷ οἴκῳ Ισραηλ μετὰ τὰς ἡμέρας ἐκείνας</strong>, φησὶν κύριος Διδοὺς δώσω νόμους μου εἰς τὴν διάνοιαν αὐτῶν καὶ ἐπὶ καρδίας αὐτῶν γράψω αὐτούς· καὶ <strong>ἔσομαι αὐτοῖς εἰς θεόν, καὶ αὐτοὶ ἔσονταί μοι εἰς λαόν</strong>· &lt;…&gt; ἐὰν ὑψωθῇ ὁ οὐρανὸς εἰς τὸ μετέωρον, φησὶν κύριος, καὶ ἐὰν ταπεινωθῇ τὸ ἔδαφος τῆς γῆς κάτω, καὶ <strong>ἐγὼ οὐκ ἀποδοκιμῶ τὸ γένος Ισραηλ</strong>, φησὶν κύριος, περὶ πάντων, ὧν ἐποίησαν. οὕτως εἶπεν κύριος ὁ δοὺς τὸν ἥλιον εἰς φῶς τῆς ἡμέρας, σελήνην καὶ ἀστέρας εἰς φῶς τῆς νυκτός, καὶ κραυγὴν ἐν θαλάσσῃ καὶ ἐβόμβησεν τὰ κύματα αὐτῆς, κύριος παντοκράτωρ ὄνομα αὐτῷ Ἐὰν παύσωνται οἱ νόμοι οὗτοι ἀπὸ προσώπου μου, φησὶν κύριος, καὶ <strong>τὸ γένος Ισραηλ παύσεται γενέσθαι ἔθνος κατὰ πρόσωπόν μου πάσας τὰς ἡμέρας</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ier/38/#L31-33,35-37">Ιερ 38:31-33,35-37</a>) — Στην έκδοση των Εβδομήκοντα οι στίχοι 35–37 του κεφαλαίου 38 έχουν άλλη σειρά: 38:35 ↔ 31:37 (“καὶ ἐγὼ οὐκ ἀποδοκιμῶ τὸ γένος Ισραηλ”, δηλαδή “δεν θα απορρίψω”), 38:36 ↔ 31:35 (ήλιος και σελήνη), 38:37 ↔ 31:36 (“ἐὰν παύσωνται οἱ νόμοι”). Παρατίθενται κατά την τάξη των Εβδομήκοντα.</p></blockquote><blockquote><p>«<strong>Ἐμφανὴς ἐγενόμην τοῖς ἐμὲ μὴ ζητοῦσιν</strong>, <strong>εὑρέθην τοῖς ἐμὲ μὴ ἐπερωτῶσιν</strong>· εἶπα Ἰδού εἰμι, <strong>τῷ ἔθνει οἳ οὐκ ἐκάλεσάν μου τὸ ὄνομα</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/is/65/#L1">Ησ 65:1</a>)</p></blockquote><blockquote><p>«καὶ σπερῶ αὐτὴν ἐμαυτῷ ἐπὶ τῆς γῆς καὶ ἐλεήσω τὴν Οὐκ — ἠλεημένην καὶ <strong>ἐρῶ</strong> <strong>τῷ Οὐ — λαῷ — μου Λαός μου εἶ σύ, καὶ αὐτὸς ἐρεῖ Κύριος ὁ θεός μου εἶ σύ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/os/2/#L25">Ωσ 2:25</a>) — Στην έκδοση των Εβδομήκοντα ο στίχος αριθμείται 2:25 (στη σλαβονική και ρωσική μετάφραση 2:23).</p></blockquote><h2>Για το τέλος της Παλαιάς Διαθήκης</h2><blockquote><p>«μεμφόμενος γὰρ αὐτοὺς λέγει, Ἰδοὺ ἡμέραι ἔρχονται, λέγει κύριος, καὶ συντελέσω ἐπὶ τὸν οἶκον Ἰσραὴλ καὶ ἐπὶ τὸν οἶκον Ἰούδα διαθήκην <strong><mark>καινήν</mark></strong>, &lt;…&gt; ἐν τῷ λέγειν Καινὴν <strong><mark>πεπαλαίωκεν τὴν πρώτην</mark></strong>· τὸ δὲ <strong>παλαιούμενον</strong> καὶ <strong>γηράσκον</strong> <strong>ἐγγὺς ἀφανισμοῦ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/8/#L8,13">Εβρ 8:8,13</a>)</p></blockquote><blockquote><p>«ἀλλὰ ἐπωρώθη τὰ νοήματα αὐτῶν. ἄχρι γὰρ τῆς σήμερον ἡμέρας τὸ αὐτὸ <strong>κάλυμμα</strong> <strong>ἐπὶ τῇ ἀναγνώσει τῆς <mark>παλαιᾶς</mark> διαθήκης</strong> μένει μὴ ἀνακαλυπτόμενον, ὅτι <strong>ἐν Χριστῷ καταργεῖται</strong>· ἀλλ᾿ ἕως σήμερον ἡνίκα ἂν ἀναγινώσκηται Μωϋσῆς κάλυμμα ἐπὶ τὴν καρδίαν αὐτῶν κεῖται· ἡνίκα δὲ ἐὰν ἐπιστρέψῃ πρὸς κύριον, περιαιρεῖται τὸ κάλυμμα.» (<a href="https://bibleox.com/el/gr-lxx-byz/2kor/3/#L14-16">Β Κορ 3:14-16</a>)</p></blockquote><blockquote><p>«ὃς καὶ <strong>ἱκάνωσεν ἡμᾶς διακόνους <mark>καινῆς</mark> διαθήκης, οὐ γράμματος ἀλλὰ πνεύματος</strong>· τὸ γὰρ γράμμα ἀποκτέννει, τὸ δὲ πνεῦμα ζῳοποιεῖ.» (<a href="https://bibleox.com/el/gr-lxx-byz/2kor/3/#L6">Β Κορ 3:6</a>)</p></blockquote><blockquote><p>«νυνὶ δὲ <strong>κατηργήθημεν ἀπὸ τοῦ νόμου</strong>, ἀποθανόντες ἐν ᾧ κατειχόμεθα, ὥστε δουλεύειν ἡμᾶς ἐν καινότητι πνεύματος καὶ <strong>οὐ <mark>παλαιότητι</mark> γράμματος</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/7/#L6">Ρωμ 7:6</a>)</p></blockquote><blockquote><p>«Πρὸ τοῦ δὲ ἐλθεῖν τὴν πίστιν <strong>ὑπὸ νόμον ἐφρουρούμεθα συγκλειόμενοι</strong> εἰς τὴν μέλλουσαν πίστιν ἀποκαλυφθῆναι. ὥστε <strong>ὁ νόμος παιδαγωγὸς ἡμῶν γέγονεν</strong> εἰς Χριστόν, ἵνα ἐκ πίστεως δικαιωθῶμεν· ἐλθούσης δὲ τῆς πίστεως <strong><mark>οὐκέτι ὑπὸ παιδαγωγόν ἐσμεν</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/gal/3/#L23-25">Γαλ 3:23-25</a>)</p></blockquote><h3>Προειδοποίηση να μη χρησιμοποιείται η χριστιανική ελευθερία για κακό:</h3><blockquote><p>«Ὑμεῖς γὰρ <strong>ἐπ᾿ ἐλευθερίᾳ ἐκλήθητε, ἀδελφοί· μόνον μὴ τὴν ἐλευθερίαν εἰς ἀφορμὴν τῇ σαρκί</strong>, ἀλλὰ διὰ τῆς ἀγάπης δουλεύετε ἀλλήλοις.» (<a href="https://bibleox.com/el/gr-lxx-byz/gal/5/#L13">Γαλ 5:13</a>)</p></blockquote>'
