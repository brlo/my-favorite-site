  title: Το κυριότερο στον Νόμο
  title_sub: Βιβλικές ρήσεις για τα βασικά στοιχεία του Νόμου του Μωυσή
  meta_desc: 'Βιβλικές ρήσεις για τα βασικά στοιχεία του Νόμου του Μωυσή: κρίση, έλεος και πίστη.'
  copy_cover: true
  menu:
    parent: Παλαιά Διαθήκη
    title: Το κυριότερο στον Νόμο
    priority: 2
  update: true
  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <h2>Το κυριότερο</h2><ul><li><p>Δικαιοσύνη</p></li></ul><ul><li><p>Έλεος</p></li></ul><ul><li><p>Πίστη</p></li></ul><h2>Η υπόδειξη του Κυρίου και Θεού Ιησού Χριστού</h2><blockquote><p>«Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι ἀποδεκατοῦτε τὸ ἡδύοσμον καὶ τὸ ἄνηθον καὶ τὸ κύμινον, καὶ ἀφήκατε <strong>τὰ βαρύτερα τοῦ νόμου</strong>, <strong>τὴν κρίσιν καὶ τὸ ἔλεος καὶ τὴν πίστιν</strong>· ταῦτα [δὲ] ἔδει ποιῆσαι κἀκεῖνα μὴ ἀφιέναι.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/23/#L23">Μτ 23:23</a>)</p></blockquote><blockquote><p>«Διδάσκαλε, <strong>ποία ἐντολὴ μεγάλη ἐν τῷ νόμῳ</strong>; ὁ δὲ ἔφη αὐτῷ, <strong>Ἀγαπήσεις κύριον τὸν θεόν σου</strong> ἐν ὅλῃ τῇ καρδίᾳ σου καὶ ἐν ὅλῃ τῇ ψυχῇ σου καὶ ἐν ὅλῃ τῇ διανοίᾳ σου· <strong>αὕτη ἐστὶν ἡ μεγάλη καὶ πρώτη ἐντολή</strong>. δευτέρα δὲ ὁμοία αὐτῇ, <strong>Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν. ἐν ταύταις ταῖς δυσὶν ἐντολαῖς ὅλος ὁ νόμος κρέμαται καὶ οἱ προφῆται</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/22/#L36-40">Μτ 22:36-40</a>)</p></blockquote><h2>Η υπόδειξη των αποστόλων</h2><blockquote><p>«ὁ γὰρ <strong>πᾶς</strong> <strong>νόμος ἐν ἑνὶ λόγῳ πεπλήρωται, ἐν τῷ Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/gal/5/#L14">Γαλ 5:14</a>)</p></blockquote><h2>Η υπόδειξη των προφητών</h2><blockquote><p>«εἰ ἀνηγγέλη σοι, ἄνθρωπε, τί καλόν; ἢ τί κύριος ἐκζητεῖ παρὰ σοῦ ἀλλ᾿ ἢ <strong>τοῦ ποιεῖν κρίμα</strong> καὶ <strong>ἀγαπᾶν ἔλεον</strong> καὶ <strong>ἕτοιμον εἶναι τοῦ πορεύεσθαι μετὰ κυρίου θεοῦ σου</strong>;» (<a href="https://bibleox.com/el/gr-lxx-byz/mih/6/#L8">Μιχ 6:8</a>)</p></blockquote><blockquote><p>«καὶ σὺ ἐν θεῷ σου ἐπιστρέψεις· <strong>ἔλεον</strong> καὶ <strong>κρίμα</strong> φυλάσσου καὶ <strong>ἔγγιζε πρὸς τὸν θεόν σου</strong> διὰ παντός.» (<a href="https://bibleox.com/el/gr-lxx-byz/os/12/#L7">Ωσ 12:7</a>) — Στην έκδοση των Εβδομήκοντα ο στίχος αριθμείται 12:7 (στη σλαβονική και ρωσική μετάφραση 12:6).</p></blockquote><blockquote><p>«Ἀκούσατε λόγον κυρίου, υἱοὶ Ισραηλ, διότι κρίσις τῷ κυρίῳ πρὸς τοὺς κατοικοῦντας τὴν γῆν, διότι <strong>οὐκ ἔστιν</strong> <strong>ἀλήθεια</strong> <strong>οὐδὲ ἔλεος</strong> <strong>οὐδὲ ἐπίγνωσις θεοῦ</strong> ἐπὶ τῆς γῆς·» (<a href="https://bibleox.com/el/gr-lxx-byz/os/4/#L1">Ωσ 4:1</a>) — Η ρωσική σελίδα παραπέμπει εδώ στο 1:1· στο κείμενο των Εβδομήκοντα η περικοπή βρίσκεται στο 4:1.</p></blockquote><blockquote><p>«διότι <strong>ἔλεος θέλω</strong> καὶ οὐ θυσίαν καὶ <strong>ἐπίγνωσιν θεοῦ</strong> ἢ ὁλοκαυτώματα.» (<a href="https://bibleox.com/el/gr-lxx-byz/os/6/#L6">Ωσ 6:6</a>) — Η ρωσική σελίδα παραπέμπει εδώ στο 1:6· στο κείμενο των Εβδομήκοντα η περικοπή βρίσκεται στο 6:6.</p></blockquote><blockquote><p>«Τάδε λέγει κύριος παντοκράτωρ <strong>Κρίμα δίκαιον</strong> κρίνατε καὶ <strong>ἔλεος καὶ οἰκτιρμὸν ποιεῖτε</strong> ἕκαστος πρὸς τὸν ἀδελφὸν αὐτοῦ» (<a href="https://bibleox.com/el/gr-lxx-byz/zah/7/#L9">Ζαχ 7:9</a>)</p></blockquote><blockquote><p>«ὅτι <strong>κύριος ἀγαπᾷ κρίσιν</strong> καὶ οὐκ ἐγκαταλείψει τοὺς ὁσίους αὐτοῦ, εἰς τὸν αἰῶνα φυλαχθήσονται. ἄνομοι δὲ ἐκδιωχθήσονται, καὶ σπέρμα ἀσεβῶν ἐξολεθρευθήσεται·» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/36/#L28">Ψλ 36:28</a>)</p></blockquote><blockquote><p>«<strong>ἀγαπᾷ ἐλεημοσύνην καὶ κρίσιν</strong>, τοῦ ἐλέους κυρίου πλήρης ἡ γῆ.» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/32/#L5">Ψλ 32:5</a>)</p></blockquote><h2>Λοιπά</h2><blockquote><p>«<strong>πλὴν τὰ ἐνόντα δότε ἐλεημοσύνην</strong>, <strong>καὶ ἰδοὺ πάντα καθαρὰ ὑμῖν ἐστιν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/11/#L41">Λκ 11:41</a>)</p></blockquote><blockquote><p>«πῦρ φλογιζόμενον ἀποσβέσει ὕδωρ, καὶ <strong>ἐλεημοσύνη ἐξιλάσεται ἁμαρτίας</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/prsir/3/#L30">Σ.Σειρ 3:30</a>)</p></blockquote>
