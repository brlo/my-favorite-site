  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <h2>Το Άγιο Πνεύμα μιλά για τον εαυτό Του χρησιμοποιώντας προσωπική αντωνυμία</h2><blockquote><p>«τοῦ δὲ Πέτρου διενθυμουμένου περὶ τοῦ ὁράματος <strong>εἶπεν [αὐτῷ] τὸ πνεῦμα</strong>, Ἰδοὺ ἄνδρες [δύο] ζητοῦσίν σε· ἀλλὰ ἀναστὰς κατάβηθι καὶ πορεύου σὺν αὐτοῖς μηδὲν διακρινόμενος, ὅτι <strong><mark>ἐγὼ</mark> ἀπέσταλκα αὐτούς</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/10/#L19-20">Πραξ 10:19-20</a>)</p></blockquote><blockquote><p>«λειτουργούντων δὲ αὐτῶν τῷ κυρίῳ καὶ νηστευόντων <strong>εἶπεν τὸ πνεῦμα τὸ ἅγιον</strong>, Ἀφορίσατε δή <strong><mark>μοι</mark></strong> τὸν Βαρναβᾶν καὶ Σαῦλον εἰς τὸ ἔργον ὃ <strong>προσκέκλημαι αὐτούς</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/13/#L2">Πραξ 13:2</a>)</p></blockquote><h2>Το Άγιο Πνεύμα μιλά</h2><blockquote><p>«<strong>εἶπεν δὲ τὸ πνεῦμα</strong> τῷ Φιλίππῳ, Πρόσελθε καὶ κολλήθητι τῷ ἅρματι τούτῳ.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/8/#L29">Πραξ 8:29</a>)</p></blockquote><h2>Το Άγιο Πνεύμα σκέπτεται και μεσιτεύει</h2><blockquote><p>«ὁ δὲ ἐραυνῶν τὰς καρδίας οἶδεν τί τὸ <strong>φρόνημα τοῦ πνεύματος</strong>, ὅτι κατὰ θεὸν <strong>ἐντυγχάνει ὑπὲρ ἁγίων</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/8/#L27">Ρωμ 8:27</a>)</p></blockquote><h2>Το Άγιο Πνεύμα ενεργεί όπως θέλει</h2><blockquote><p>«πάντα δὲ ταῦτα ἐνεργεῖ τὸ ἓν καὶ τὸ αὐτὸ <strong>πνεῦμα</strong>, διαιροῦν ἰδίᾳ ἑκάστῳ <strong>καθὼς βούλεται</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/12/#L11">Α Κορ 12:11</a>)</p></blockquote><h2>Το Άγιο Πνεύμα μιλά μέσω των προφητών</h2><blockquote><p>«ἀσύμφωνοι δὲ ὄντες πρὸς ἀλλήλους ἀπελύοντο, εἰπόντος τοῦ Παύλου ῥῆμα ἓν ὅτι Καλῶς <strong>τὸ πνεῦμα τὸ ἅγιον ἐλάλησεν</strong> <strong>διὰ Ἠσαΐου τοῦ προφήτου</strong> πρὸς τοὺς πατέρας ὑμῶν λέγων, Πορεύθητι πρὸς τὸν λαὸν τοῦτον καὶ εἰπόν, Ἀκοῇ ἀκούσετε καὶ οὐ μὴ συνῆτε, καὶ βλέποντες βλέψετε καὶ οὐ μὴ ἴδητε·» (<a href="https://bibleox.com/el/gr-lxx-byz/act/28/#L25-26">Πραξ 28:25-26</a>)</p></blockquote><blockquote><p>«Διό, καθὼς <strong>λέγει τὸ πνεῦμα τὸ ἅγιον</strong>, Σήμερον ἐὰν τῆς φωνῆς αὐτοῦ ἀκούσητε,» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/3/#L7">Εβρ 3:7</a>)</p></blockquote><h2>Από την καρδιά του ανθρώπου απευθύνεται στον Πατέρα</h2><blockquote><p>«Ὅτι δέ ἐστε υἱοί, ἐξαπέστειλεν ὁ θεὸς τὸ <strong>πνεῦμα</strong> τοῦ υἱοῦ αὐτοῦ εἰς τὰς καρδίας ἡμῶν, <strong>κρᾶζον</strong>, <strong>Αββα ὁ πατήρ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/gal/4/#L6">Γαλ 4:6</a>)</p></blockquote><h2>Ακούει</h2><blockquote><p>«ὅταν δὲ ἔλθῃ ἐκεῖνος, τὸ πνεῦμα τῆς ἀληθείας, ὁδηγήσει ὑμᾶς ἐν τῇ ἀληθείᾳ πάσῃ· οὐ γὰρ λαλήσει ἀφ᾿ ἑαυτοῦ, ἀλλ᾿ ὅσα <strong>ἀκούσει</strong> λαλήσει, καὶ τὰ ἐρχόμενα ἀναγγελεῖ ὑμῖν.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/16/#L13">Ιω 16:13</a>)</p></blockquote><h2>Συγκατατίθεται</h2><blockquote><p>«<strong>ἔδοξεν γὰρ τῷ πνεύματι τῷ ἁγίῳ</strong> καὶ ἡμῖν μηδὲν πλέον ἐπιτίθεσθαι ὑμῖν βάρος πλὴν τούτων τῶν ἐπάναγκες,» (<a href="https://bibleox.com/el/gr-lxx-byz/act/15/#L28">Πραξ 15:28</a>)</p></blockquote><h2>Ζει</h2><blockquote><p>«οὐκ οἴδατε ὅτι ναὸς θεοῦ ἐστε καὶ <strong>τὸ πνεῦμα τοῦ θεοῦ οἰκεῖ ἐν ὑμῖν</strong>;» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/3/#L16">Α Κορ 3:16</a>)</p></blockquote><h2>Δείχνει</h2><blockquote><p>«τοῦτο <strong>δηλοῦντος τοῦ πνεύματος τοῦ ἁγίου</strong>, μήπω πεφανερῶσθαι τὴν τῶν ἁγίων ὁδὸν ἔτι τῆς πρώτης σκηνῆς ἐχούσης στάσιν,» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/9/#L8">Εβρ 9:8</a>)</p></blockquote><h2>Μαρτυρεί</h2><blockquote><p>«<strong>Μαρτυρεῖ δὲ ἡμῖν καὶ τὸ πνεῦμα τὸ ἅγιον</strong>· μετὰ γὰρ τὸ εἰρηκέναι,» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/10/#L15">Εβρ 10:15</a>)</p></blockquote><h2>Το Άγιο Πνεύμα το πειράζουν</h2><blockquote><p>«ὁ δὲ Πέτρος πρὸς αὐτήν, Τί ὅτι συνεφωνήθη ὑμῖν <strong>πειράσαι τὸ πνεῦμα</strong> <strong>κυρίου</strong>; ἰδοὺ οἱ πόδες τῶν θαψάντων τὸν ἄνδρα σου ἐπὶ τῇ θύρᾳ καὶ ἐξοίσουσίν σε.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/5/#L9">Πραξ 5:9</a>)</p></blockquote><h2>Το προσβάλλουν</h2><blockquote><p>«πόσῳ δοκεῖτε χείρονος ἀξιωθήσεται τιμωρίας ὁ τὸν υἱὸν τοῦ θεοῦ καταπατήσας, καὶ τὸ αἷμα τῆς διαθήκης κοινὸν ἡγησάμενος ἐν ᾧ ἡγιάσθη, καὶ <strong>τὸ πνεῦμα τῆς χάριτος ἐνυβρίσας</strong>;» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/10/#L29">Εβρ 10:29</a>)</p></blockquote><h2>Το βλασφημούν</h2><blockquote><p>«Διὰ τοῦτο λέγω ὑμῖν, πᾶσα ἁμαρτία καὶ βλασφημία ἀφεθήσεται τοῖς ἀνθρώποις, ἡ δὲ <strong>τοῦ πνεύματος βλασφημία</strong> οὐκ ἀφεθήσεται.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/12/#L31">Μτ 12:31</a>)</p></blockquote><h2>Προσπαθούν να το εξαπατήσουν</h2><blockquote><p>«εἶπεν δὲ ὁ Πέτρος, Ἁνανία, διὰ τί ἐπλήρωσεν ὁ Σατανᾶς τὴν καρδίαν σου <strong>ψεύσασθαί σε τὸ πνεῦμα τὸ ἅγιον</strong> καὶ νοσφίσασθαι ἀπὸ τῆς τιμῆς τοῦ χωρίου;» (<a href="https://bibleox.com/el/gr-lxx-byz/act/5/#L3">Πραξ 5:3</a>)</p></blockquote><h2>Του αντιστέκονται</h2><blockquote><p>«Σκληροτράχηλοι καὶ ἀπερίτμητοι καρδίαις καὶ τοῖς ὠσίν, ὑμεῖς ἀεὶ <strong>τῷ πνεύματι τῷ ἁγίῳ ἀντιπίπτετε</strong>, ὡς οἱ πατέρες ὑμῶν καὶ ὑμεῖς.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/7/#L51">Πραξ 7:51</a>)</p></blockquote>
