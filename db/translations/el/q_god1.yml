  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <h2>Το Πνεύμα είναι Θεός</h2><blockquote><p>«πνεῦμα ὁ θεός, καὶ τοὺς προσκυνοῦντας αὐτὸν ἐν πνεύματι καὶ ἀληθείᾳ δεῖ προσκυνεῖν.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/4/#L24">Ιω 4:24</a>)</p></blockquote><h2>Ο Ανανίας είπε ψέματα στο Άγιο Πνεύμα, στον Θεό</h2><blockquote><p>«εἶπεν δὲ ὁ Πέτρος, Ἁνανία, διὰ τί ἐπλήρωσεν ὁ Σατανᾶς τὴν καρδίαν σου <strong><mark>ψεύσασθαί</mark> σε τὸ πνεῦμα τὸ ἅγιον</strong> καὶ νοσφίσασθαι ἀπὸ τῆς τιμῆς τοῦ χωρίου; οὐχὶ μένον σοὶ ἔμενεν καὶ πραθὲν ἐν τῇ σῇ ἐξουσίᾳ ὑπῆρχεν; τί ὅτι ἔθου ἐν τῇ καρδίᾳ σου τὸ πρᾶγμα τοῦτο; <strong>οὐκ <mark>ἐψεύσω</mark> ἀνθρώποις ἀλλὰ τῷ <mark>θεῷ</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/5/#L3-4">Πραξ 5:3-4</a>)</p></blockquote><h2>Ο Θεός μίλησε μέσω των προφητών</h2><blockquote><p>«Πολυμερῶς καὶ πολυτρόπως πάλαι ὁ <strong><mark>θεὸς</mark></strong> <strong>λαλήσας</strong> τοῖς πατράσιν ἐν τοῖς <strong><mark>προφήταις</mark></strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/1/#L1">Εβρ 1:1</a>)</p></blockquote><blockquote><p>«εὐαγγέλιον <strong><mark>θεοῦ</mark></strong>, ὃ <strong>προεπηγγείλατο</strong> διὰ τῶν <strong><mark>προφητῶν</mark></strong> αὐτοῦ ἐν γραφαῖς ἁγίαις,» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/1/#L1-2">Ρωμ 1:1-2</a>)</p></blockquote><blockquote><p>«ὁ δὲ <strong><mark>θεὸς</mark></strong> ἃ προκατήγγειλεν διὰ <strong><mark>στόματος</mark> πάντων τῶν <mark>προφητῶν</mark></strong> παθεῖν τὸν Χριστὸν αὐτοῦ ἐπλήρωσεν οὕτως. &lt;…&gt; ὃν δεῖ οὐρανὸν μὲν δέξασθαι ἄχρι χρόνων ἀποκαταστάσεως πάντων ὧν <strong><mark>ἐλάλησεν ὁ θεὸς</mark> διὰ στόματος τῶν ἁγίων ἀπ᾿ αἰῶνος αὐτοῦ προφητῶν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/3/#L18,21">Πραξ 3:18,21</a>)</p></blockquote><h2>Μέσω των προφητών μίλησε το Άγιο Πνεύμα</h2><blockquote><p>«ἀσύμφωνοι δὲ ὄντες πρὸς ἀλλήλους ἀπελύοντο, εἰπόντος τοῦ Παύλου ῥῆμα ἓν ὅτι Καλῶς <strong><mark>τὸ πνεῦμα τὸ ἅγιον ἐλάλησεν</mark></strong> <strong><mark>διὰ Ἠσαΐου</mark> τοῦ προφήτου</strong> πρὸς τοὺς πατέρας ὑμῶν λέγων, Πορεύθητι πρὸς τὸν λαὸν τοῦτον καὶ εἰπόν, Ἀκοῇ ἀκούσετε καὶ οὐ μὴ συνῆτε, καὶ βλέποντες βλέψετε καὶ οὐ μὴ ἴδητε·» (<a href="https://bibleox.com/el/gr-lxx-byz/act/28/#L25-26">Πραξ 28:25-26</a>)</p></blockquote><blockquote><p>«Διό, καθὼς <strong>λέγει τὸ πνεῦμα τὸ ἅγιον</strong>, Σήμερον ἐὰν τῆς φωνῆς αὐτοῦ ἀκούσητε,» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/3/#L7">Εβρ 3:7</a>)</p></blockquote><blockquote><p>«Ἄνδρες ἀδελφοί, ἔδει πληρωθῆναι τὴν γραφὴν ἣν <strong>προεῖπεν τὸ πνεῦμα τὸ ἅγιον</strong> <strong>διὰ στόματος Δαυὶδ</strong> περὶ Ἰούδα τοῦ γενομένου ὁδηγοῦ τοῖς συλλαβοῦσιν Ἰησοῦν,» (<a href="https://bibleox.com/el/gr-lxx-byz/act/1/#L16">Πραξ 1:16</a>)</p></blockquote>
