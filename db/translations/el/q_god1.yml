  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: '<h2>Το Filioque — ο όρος</h2><p>Το «Filioque» είναι η εσφαλμένη διδασκαλία της Ρωμαιοκαθολικής Εκκλησίας ότι το Άγιο Πνεύμα εκπορεύεται όχι μόνο από τον Πατέρα, αλλά «και από τον Υιό» (λατ. «Filioque»).</p><p>Λεπτομερής αναίρεση σε βίντεο από τον ιερέα Γεώργιο Μαξίμοφ για το θέμα του Filioque: <a href="https://rutube.ru/video/c1878056726d0e041ba83802090cf308/">Rutube</a>, <a href="https://youtu.be/xuOSiS8zCO4">YouTube</a>.</p><h2>Το Άγιο Πνεύμα εκπορεύεται από τον Πατέρα</h2><p>Δεν γνωρίζουμε τη φύση του Θεού, αλλά ο Υιός του Θεού — ο Ιησούς Χριστός — γνωρίζει:</p><blockquote><p>«Πάντα μοι παρεδόθη ὑπὸ τοῦ πατρός μου, καὶ οὐδεὶς ἐπιγινώσκει τὸν υἱὸν εἰ μὴ ὁ πατήρ, οὐδὲ τὸν πατέρα τις ἐπιγινώσκει εἰ μὴ ὁ υἱὸς <strong>καὶ ᾧ ἐὰν βούληται ὁ υἱὸς ἀποκαλύψαι</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/11/#L27">Μτ 11:27</a>)</p></blockquote><p>Έδωσε τη θεία Αποκάλυψη στους αποστόλους:</p><blockquote><p>«οὐκέτι λέγω ὑμᾶς δούλους, ὅτι ὁ δοῦλος οὐκ οἶδεν τί ποιεῖ αὐτοῦ ὁ κύριος· ὑμᾶς δὲ εἴρηκα φίλους, ὅτι <strong>πάντα ἃ ἤκουσα παρὰ τοῦ πατρός μου ἐγνώρισα ὑμῖν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/15/#L15">Ιω 15:15</a>)</p></blockquote><p>Ο Υιός του Θεού είπε ότι το Άγιο Πνεύμα εκπορεύεται από τον Πατέρα:</p><blockquote><p>«Ὅταν ἔλθῃ ὁ παράκλητος ὃν ἐγὼ πέμψω ὑμῖν <strong>παρὰ τοῦ πατρός</strong>, τὸ πνεῦμα τῆς ἀληθείας <strong>ὃ <mark>παρὰ τοῦ πατρὸς ἐκπορεύεται</mark></strong>, ἐκεῖνος μαρτυρήσει περὶ ἐμοῦ·» (<a href="https://bibleox.com/el/gr-lxx-byz/in/15/#L26">Ιω 15:26</a>)</p></blockquote><p>Ο Πατέρας, ο Υιός και το Άγιο Πνεύμα δεν είναι ονόματα. Ο Θεός δεν έχει δικό Του όνομα. Το όνομα το δίνει εκείνος που είναι ανώτερος. Δεν υπάρχει κανείς ανώτερος από τον Θεό.</p><p>Οι λέξεις Πατέρας, Υιός και Άγιο Πνεύμα είναι μόνο δείκτες των σχέσεων των θείων αυτών προσώπων μεταξύ τους.</p><ul><li><p><strong>Ο Πατέρας</strong> <strong>γεννά</strong>, γι'' αυτό είναι Πατέρας. Αλλά δεν γεννήθηκε, γι'' αυτό δεν είναι Υιός. Δεν εκπορεύεται, γι'' αυτό δεν είναι Άγιο Πνεύμα.</p></li><li><p><strong>Ο Υιός</strong> <strong>γεννιέται</strong>, γι'' αυτό είναι Υιός. Αλλά δεν γεννά, γι'' αυτό δεν είναι Πατέρας. Και δεν εκπορεύεται, γι'' αυτό δεν είναι Άγιο Πνεύμα.</p></li><li><p><strong>Το Άγιο</strong> <strong>Πνεύμα</strong> δεν γεννιέται και δεν γεννά, γι'' αυτό δεν είναι Πατέρας ούτε Υιός. Εκπορεύεται, γι'' αυτό είναι Άγιο Πνεύμα.</p></li></ul><p>Κάθε πρόσωπο έχει μόνο μία διαφορά (ένα υποστατικό ιδίωμα), με την οποία μπορούμε να τα διακρίνουμε μεταξύ τους. Αυτές οι λέξεις (Πατέρας, Υιός και Άγιο Πνεύμα) επιτρέπουν να δείχνουμε αυτά τα ιδιώματα.</p><hr><p>Η δράση του Θεού που παρατηρούμε σε αυτόν τον κόσμο δεν είναι η ίδια η φύση του Θεού, αλλά μόνο οι <strong>ενέργειές Του</strong>, αυτό που ονομάζουμε επίσης χάρη.</p><p>Μόνο ο Πατέρας είναι η αιτία των πάντων. Αυτός μόνος είναι η αιτία της ύπαρξης του Υιού και η αιτία της ύπαρξης του Αγίου Πνεύματος. Μία μόνο αιτία, και όχι δύο ή τρεις.</p><p>Παράλληλα, ο Πατέρας είναι σε όλα ίσος με τον Υιό και το Άγιο Πνεύμα και διαφέρει μόνο ως προς την <strong>αγεννησία</strong>.</p><p>Ο Υιός διαφέρει από τον Πατέρα και το Άγιο Πνεύμα μόνο ως προς τη <strong>γέννηση</strong>.</p><p>Και το Άγιο Πνεύμα διαφέρει από τον Πατέρα και τον Υιό μόνο ως προς την <strong>εκπόρευση</strong>.</p><p>Αυτό ονομάζεται <strong>υποστατικά ιδιώματα</strong>. Τα φυσικά ιδιώματα όμως είναι τα ίδια σε όλα, γιατί η φύση είναι μία. Ο Θεός είναι ένας, αλλά οι υποστάσεις τρεις. Και κάθε υπόσταση έχει <strong>μία</strong> διαφορά από την άλλη.</p><h2>Ενστάσεις των υποστηρικτών του «Filioque»</h2><h3>«Εγώ και ο Πατέρας είμαστε ένα»</h3><p>Ως απόδειξη της καθολικής διδασκαλίας για την εκπόρευση του Αγίου Πνεύματος όχι μόνο από τον Πατέρα, αλλά και από τον Υιό, παρατίθεται το εξής χωρίο:</p><blockquote><p>«ἐγὼ καὶ ὁ πατὴρ ἕν ἐσμεν.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/10/#L30">Ιω 10:30</a>)</p></blockquote><p>Παρόμοια είναι και τα εξής χωρία:</p><blockquote><p>«ὅταν δὲ ἔλθῃ ἐκεῖνος, <strong>τὸ πνεῦμα τῆς ἀληθείας</strong>, ὁδηγήσει ὑμᾶς ἐν τῇ ἀληθείᾳ πάσῃ· οὐ γὰρ λαλήσει ἀφ᾿ ἑαυτοῦ, ἀλλ᾿ ὅσα ἀκούσει λαλήσει, καὶ τὰ ἐρχόμενα ἀναγγελεῖ ὑμῖν. ἐκεῖνος ἐμὲ δοξάσει, ὅτι <strong>ἐκ τοῦ ἐμοῦ λήμψεται</strong> καὶ ἀναγγελεῖ ὑμῖν.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/16/#L13-14">Ιω 16:13-14</a>)</p></blockquote><blockquote><p>«<strong>πάντα ὅσα ἔχει ὁ πατὴρ ἐμά ἐστιν</strong>· διὰ τοῦτο εἶπον ὅτι ἐκ τοῦ ἐμοῦ λαμβάνει καὶ ἀναγγελεῖ ὑμῖν.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/16/#L15">Ιω 16:15</a>)</p></blockquote><p>Αλλά αν από τη φράση «εγώ και ο Πατέρας είμαστε ένα» συνάγεται ότι το Άγιο Πνεύμα εκπορεύεται «και από τον Υιό», τότε αυτό σημαίνει επίσης ότι το Άγιο Πνεύμα εκπορεύεται και από τον εαυτό Του, δηλαδή υποτίθεται ότι το Άγιο Πνεύμα εκπορεύεται από το Άγιο Πνεύμα, γιατί «ένα» δεν είναι μόνο ο Πατέρας και ο Υιός, αλλά και το Άγιο Πνεύμα είναι επίσης «ένα» μαζί τους. Το Άγιο Πνεύμα έχει επίσης ό,τι ακριβώς έχει ο Πατέρας και ο Υιός.</p><p>Το επιχείρημα αυτό θα μπορούσε να είναι λογικά παραδεκτό μόνο εάν το Άγιο Πνεύμα δεν ήταν Θεός, αλλά απλώς κάποια λάμψη, κάποιο αίσθημα αγάπης και τίποτε άλλο, και όχι Θεός. Ωστόσο, σε αυτή την περίπτωση θα επρόκειτο ήδη για μια άλλη μεγάλη πλάνη, που αρνείται τη θεότητα του Αγίου Πνεύματος.</p><p>Ακολουθώντας το επιχείρημα που προτάθηκε, θα πρέπει να παραδεχτούμε:</p><ul><li><p>ότι «ένα» είναι μόνο ο Πατέρας και ο Υιός, ενώ το Άγιο Πνεύμα είναι κάτι άλλο (αίσθημα αγάπης, λάμψη και τίποτε περισσότερο).</p></li><li><p>ή ότι το Άγιο Πνεύμα εκπορεύεται και από τον Πατέρα και από τον Υιό και… από το Άγιο Πνεύμα.</p></li></ul><p>Αν όμως δεχτούμε με συνέπεια την πρόταση ότι το Άγιο Πνεύμα εκπορεύεται και από το Άγιο Πνεύμα, τότε από το ίδιο πράγμα συνάγονται πολλά άλλα παράλογα συμπεράσματα, όπως για παράδειγμα ότι τον Υιό δεν τον γεννά μόνο ο Πατέρας (ο οποίος άλλωστε γι'' αυτό ονομάζεται Πατέρας), αλλά ότι γενικά όλοι γεννούν τον Υιό, ακόμη και ο ίδιος ο Υιός γεννά τον εαυτό Του. Αλλά ο Υιός ονομάζεται Υιός επειδή γεννήθηκε, και ο Πατέρας ονομάζεται Πατέρας επειδή γεννά, όπως και το Πνεύμα ονομάζεται Πνεύμα επειδή εκπορεύεται.</p><p>Αν οι υποστηρικτές του «Filioque» δεν είναι έτοιμοι να παραδεχτούν ότι το Άγιο Πνεύμα εκπορεύεται από τον εαυτό Του, τότε θα πρέπει να παραδεχτούν ότι αυτό το χωρίο μιλά για κάτι άλλο και δεν είναι κατάλληλο για την υπεράσπιση του «Filioque». Ας εξετάσουμε λεπτομερέστερα αυτή την έκφραση.</p><h3>«Από τα δικά Μου θα λάβει»</h3><blockquote><p>«ἐκεῖνος ἐμὲ δοξάσει, ὅτι <strong>ἐκ τοῦ ἐμοῦ λήμψεται</strong> καὶ <strong><mark>ἀναγγελεῖ</mark></strong> ὑμῖν. πάντα ὅσα ἔχει ὁ πατὴρ ἐμά ἐστιν· διὰ τοῦτο εἶπον ὅτι <strong>ἐκ τοῦ ἐμοῦ λαμβάνει</strong> καὶ <strong><mark>ἀναγγελεῖ</mark></strong> ὑμῖν.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/16/#L14-15">Ιω 16:14-15</a>)</p></blockquote><p>Εδώ λέγεται ότι <strong>θα αναγγείλει</strong> το Άγιο Πνεύμα, ότι δεν θα αντιφάσκει προς τον Χριστό. Στον Θεό υπάρχει μία γνώση και μία θέληση. Ο Υιός του Θεού προειδοποιεί τους μαθητές ότι το Άγιο Πνεύμα δεν θα δώσει κάποια άλλη διδασκαλία, γιατί και αυτό θα μιλήσει εκ μέρους του Θεού. Μετά τον Χριστό εμφανίστηκε ο Μοντανός και παρουσιαζόταν ως ενσάρκωση του Αγίου Πνεύματος, διδάσκοντας τη δική του διδασκαλία και όχι τη διδασκαλία του Χριστού. Από τη διδασκαλία του Μοντανού παρασύρθηκε ο επιφανής χριστιανός θεολόγος Τερτυλλιανός.</p><h3>Ο Υιός του Θεού με εμφύσηση στέλνει το Άγιο Πνεύμα</h3><p>Εμφανιζόμενος στους αποστόλους, ο Χριστός φυσά πάνω τους και τους καλεί να λάβουν το Άγιο Πνεύμα:</p><blockquote><p>«εἶπεν οὖν αὐτοῖς πάλιν, Εἰρήνη ὑμῖν· καθὼς ἀπέσταλκέν με ὁ πατήρ, κἀγὼ πέμπω ὑμᾶς. καὶ τοῦτο εἰπὼν <strong>ἐνεφύσησεν καὶ λέγει αὐτοῖς, Λάβετε πνεῦμα ἅγιον</strong>·» (<a href="https://bibleox.com/el/gr-lxx-byz/in/20/#L21-22">Ιω 20:21-22</a>)</p></blockquote><p>Το χωρίο αυτό δεν σημαίνει ότι ο Υιός είναι η πηγή του Αγίου Πνεύματος, αλλά ότι το Άγιο Πνεύμα στον χρόνο (στην επίγεια ιστορία της Εκκλησίας μας, στην οικονομία) αποστέλλεται από τον Πατέρα μέσω του Υιού. Δηλαδή παλαιότερα δεν είχε αποσταλεί (αλλά βέβαια είχε πάντοτε ύπαρξη, αφού εκπορεύεται από τον Πατέρα), και τώρα στον χρόνο αποστέλλεται από τον Πατέρα στην Εκκλησία, όπως λέει και ο ίδιος ο Χριστός λίγα κεφάλαια πριν:</p><blockquote><p>«Ὅταν ἔλθῃ ὁ παράκλητος ὃν <strong><mark>ἐγὼ πέμψω</mark> ὑμῖν <mark>παρὰ τοῦ πατρός</mark>, τὸ πνεῦμα τῆς ἀληθείας</strong> ὃ <strong><mark>παρὰ τοῦ πατρὸς ἐκπορεύεται</mark></strong>, ἐκεῖνος μαρτυρήσει περὶ ἐμοῦ·» (<a href="https://bibleox.com/el/gr-lxx-byz/in/15/#L26">Ιω 15:26</a>)</p></blockquote><p>Ο Υιός του Θεού λέει ότι το Άγιο Πνεύμα θα το στείλει ο ίδιος, αλλά θα το στείλει από τον Πατέρα, γιατί το Άγιο Πνεύμα εκπορεύεται από τον Πατέρα, δηλαδή μόνο ο Πατέρας είναι η αιτία της εκπόρευσης του Αγίου Πνεύματος, και όχι ο Υιός.</p><h2>Ιστορικό υπόβαθρο</h2><p>Η Εκκλησία από την αρχή και πάντοτε δίδασκε ότι το Άγιο Πνεύμα εκπορεύεται ακριβώς από τον Πατέρα (ρήσεις).</p><p>Τον 8ο αιώνα στη Δύση γεννιέται η ιδέα της εκπόρευσης του Αγίου Πνεύματος επιπλέον «και από τον Υιό». Εκεί, το 791, την ίδια ιδέα καταδικάζει ο Πατριάρχης Ακυληίας Παυλίνος.</p><p>Τον 11ο αιώνα από την Ορθόδοξη Εκκλησία, εξαιτίας της διαστρέβλωσης της πίστης και των αντιλήψεων για τη συγκρότηση της Εκκλησίας, αποσπάται μία από τις κοινότητες — η Ρωμαϊκή (σήμερα η Ρωμαιοκαθολική Εκκλησία).</p><p>Στη Ρώμη, υπό την πολιτική πίεση του Φράγκου βασιλιά Καρλομάγνου, άλλαξαν το δόγμα της πίστης:</p><ol><li><p>Μονομερώς άλλαξαν το «Σύμβολο της Πίστεως» που είχε υιοθετηθεί από τις Οικουμενικές Συνόδους, το οποίο οι Οικουμενικές Σύνοδοι απαγόρευσαν να αλλάζει (Γ΄ Οικουμενική Σύνοδος)·</p></li><li><p>Πρόσθεσαν σε αυτό εκείνο που η Εκκλησία δεν δίδαξε ποτέ: το filioque (την εκπόρευση του Αγίου Πνεύματος όχι μόνο από τον Πατέρα, αλλά και από τον Υιό)·</p></li><li><p>Καθιέρωσαν και απαίτησαν από όλη την Εκκλησία να δεχτεί το αλάθητο πρωτείο του πάπα πάνω σε όλη την Εκκλησία, το οποίο δεν υπήρξε ποτέ και αντιβαίνει σαφώς στην Αγία Γραφή (κεφαλή — ο Χριστός, <a href="https://bibleox.com/el/gr-lxx-byz/ef/1/#L22">Εφ 1:22</a>). Ακόμη και ιστορικά ο πάπας δεν ήταν ποτέ πρώτος στην Εκκλησία και καμία Οικουμενική Σύνοδος δεν πραγματοποιήθηκε στη Ρώμη. Ο ίδιος ο Χριστός απαγόρευε στους αποστόλους να αναζητούν το πρωτείο, σταματώντας τις έριδες τους γι'' αυτό (<a href="https://bibleox.com/el/gr-lxx-byz/mk/9/#L34">Μκ 9:34</a> · <a href="https://bibleox.com/el/gr-lxx-byz/mf/20/#L25-28">Μτ 20:25-28</a>).</p></li></ol><p>Για να μπορέσουμε να αξιολογήσουμε αυτό το μεγάλο ιστορικό γεγονός, είναι εξαιρετικά σημαντικό να κατανοήσουμε την <strong>πολιτική κατάσταση στην Ιταλία</strong>.</p><p><strong>Από τον 5ο αιώνα</strong> η Ρώμη υποφέρει από τις σοβαρότατες επιδρομές των βαρβάρων και ο παπικός θρόνος βρίσκεται τακτικά σε εξαιρετικά επισφαλή θέση. Το Βυζάντιο είχε όλο και λιγότερες δυνατότητες να δίνει προσοχή στο δυτικό του μέτωπο, εστιάζοντας σε άλλες κατευθύνσεις. Έτσι, ο πάπας στη Ρώμη με τον καιρό άρχισε να εκπροσωπεί de facto όχι μόνο τη θρησκευτική αλλά και την κρατική εξουσία.</p><p><strong>Στα τέλη του 8ου — αρχές του 9ου αιώνα</strong>, για να σώσουν τη θέση τους οι πάπες κάνουν μια απότομη πολιτική στροφή από τον βυζαντινό αυτοκράτορα προς τον Φράγκο βασιλιά Καρλομάγνο (περ. 748–814).</p><p><strong>Το 800</strong> ο πάπας Λέων Γ΄ ανακηρύσσει, στέφει και αναγνωρίζει τον Κάρολο ως κληρονόμο της ιεράς Ρωμαϊκής Αυτοκρατορίας.</p><p>Για να δικαιολογήσουν το γεγονός ότι ο πάπας διαθέτει γενικά τέτοιες εξουσίες, κατασκευάστηκαν αρκετά πλαστά έγγραφα:</p><ul><li><p><strong>Η Δωρεά του Κωνσταντίνου</strong> — <a href="https://ru.wikipedia.org/wiki/%D0%94%D0%B0%D1%80_%D0%9A%D0%BE%D0%BD%D1%81%D1%82%D0%B0%D0%BD%D1%82%D0%B8%D0%BD%D0%B0">https://ru.wikipedia.org/wiki/Дар_Константина</a></p></li><li><p><strong>Οι Ψευδοϊσιδώρειες Διαταγές</strong> — <a href="https://ru.wikipedia.org/wiki/%D0%9B%D0%B6%D0%B5%D0%B8%D1%81%D0%B8%D0%B4%D0%BE%D1%80%D0%BE%D0%B2%D1%8B_%D0%B4%D0%B5%D0%BA%D1%80%D0%B5%D1%82%D0%B0%D0%BB%D0%B8%D0%B8">https://ru.wikipedia.org/wiki/Лжеисидоровы_декреталии</a></p></li></ul><p>Ένα τέτοιο βήμα δημιούργησε μια κατάσταση που απαιτούσε από τους πάπες περαιτέρω βήματα.</p><p>Η Κωνσταντινούπολη ήταν το κέντρο της αυτοκρατορίας όχι μόνο επειδή εκεί βρισκόταν ο αυτοκράτορας, αλλά και επειδή με πρωτοβουλία της Κωνσταντινούπολης συνέρχονταν Οικουμενικές Σύνοδοι στην ίδια την Κωνσταντινούπολη ή στα περίχωρά της.</p><p>Η επιθυμία να γίνει και πάλι κέντρο της αυτοκρατορίας (όχι μόνο πολιτικό, αλλά και θρησκευτικό) απαίτησε από τη Ρώμη να πάρει στα χέρια της την πρωτοβουλία των Συνόδων και να επιβάλει τη θεολογία της. Αλλά οι Σύνοδοι συνέρχονταν μόνο εξαιτίας μεγάλων αιρέσεων, και τέτοιες εκείνη την εποχή δεν υπήρχαν. Γι'' αυτό στη Δύση βγάζουν από το «παλιό ισπανικό μπαούλο» τη <strong>διδασκαλία του filioque του 7ου–8ου αιώνα</strong>, την προωθούν πολιτικά, εντάσσοντάς την επίσημα στο «Σύμβολο της Πίστεως», και επίσης αυθαιρέτως ανακηρύσσουν την απόλυτη κυριαρχία του πάπα στην Εκκλησία, με επακόλουθη απαίτηση από όλη την Εκκλησία να αναγνωρίσει όλους αυτούς τους ελιγμούς.</p><p>Είναι σημαντικό να σημειωθεί ότι αυτή η προσθήκη στο Σύμβολο της Πίστεως είχε ήδη καταδικαστεί στη Δύση προηγουμένως (το 791 από τον Πατριάρχη Ακυληίας Παυλίνο), και ο ίδιος ο πάπας Λέων Γ΄, που έστεψε τον βασιλιά των Φράγκων, αρνήθηκε να αναγνωρίσει την προσθήκη του filioque στο «Σύμβολο της Πίστεως».</p><p>Εντούτοις, παρά την αντίσταση, προς τα τέλη του 9ου αιώνα το «Filioque» είχε επιτυχώς αφομοιωθεί στη Ρώμη, πράγμα που εν μέρει κατέληξε πρώτα στο «σχίσμα του Φωτίου» και αργότερα στη σύγκρουση του 1054 στην Κωνσταντινούπολη.</p><p>Από αυτά τα γεγονότα συνάγεται ότι η αναβιωμένη ισπανική διδασκαλία <strong>του «filioque» χρησίμευσε μόνο ως πρόσχημα</strong> για την εδραίωση της εξουσίας πάνω στην Εκκλησία. Το Filioque δεν ήταν αυτοσκοπός. Το αναβίωσαν για απολύτως συγκεκριμένους σκοπούς.</p><p><strong>Χρειαζόταν ένα προηγούμενο</strong>: ο πάπας, χωρίς καμία Οικουμενική Σύνοδο, είναι σε θέση μόνος του να διακηρύσσει δογματικές αλήθειες και να απαιτεί από όλη την Εκκλησία να δεχτεί τις «αλάνθαστες» καινοτομίες του.</p><p>Αυτή η αξίωση του πάπα για εξουσία, που δεν έχει ούτε θεολογικά ούτε ιστορικά θεμέλια, απορρίφθηκε κατηγορηματικά από όλες τις άλλες τοπικές Εκκλησίες.</p>'
