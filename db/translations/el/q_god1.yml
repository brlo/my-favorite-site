  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <blockquote>«τοῦτον γὰρ <b>ὁ πατὴρ ἐσφράγισεν ὁ θεός</b>.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/6/#L27">Ιω 6:27</a>)</blockquote><blockquote>«ἀπεκρίθη Ἰησοῦς, Ἐὰν ἐγὼ δοξάσω ἐμαυτόν, ἡ δόξα μου οὐδέν ἐστιν· ἔστιν <b>ὁ πατήρ μου</b> ὁ δοξάζων με, ὃν ὑμεῖς λέγετε ὅτι <b>θεὸς ἡμῶν</b> ἐστιν·» (<a href="https://bibleox.com/el/gr-lxx-byz/in/8/#L54">Ιω 8:54</a>)</blockquote><blockquote>«Εὐλογητὸς <b>ὁ θεὸς καὶ πατὴρ</b> τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὁ πατὴρ τῶν οἰκτιρμῶν καὶ θεὸς πάσης παρακλήσεως,» (<a href="https://bibleox.com/el/gr-lxx-byz/2kor/1/#L3">Β Κορ 1:3</a>)</blockquote><blockquote>«Εὐλογητὸς <b>ὁ θεὸς καὶ πατὴρ</b> τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὁ εὐλογήσας ἡμᾶς ἐν πάσῃ εὐλογίᾳ πνευματικῇ ἐν τοῖς ἐπουρανίοις ἐν Χριστῷ,» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/1/#L3">Εφ 1:3</a>)</blockquote><blockquote>«κατὰ πρόγνωσιν <b>θεοῦ πατρός</b>, ἐν ἁγιασμῷ πνεύματος, εἰς ὑπακοὴν καὶ ῥαντισμὸν αἵματος Ἰησοῦ Χριστοῦ· χάρις ὑμῖν καὶ εἰρήνη πληθυνθείη.» (<a href="https://bibleox.com/el/gr-lxx-byz/1pet/1/#L2">Α Πε 1:2</a>)</blockquote>
