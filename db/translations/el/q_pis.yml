  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: '<h2>Η ανάγνωση της Γραφής είναι ωφέλιμη για τη σωτηρία</h2><p>Ο απόστολος Παύλος λέει ότι η μελέτη των Γραφών μπορεί να βοηθήσει τον άνθρωπο να σωθεί:</p><blockquote><p>«καὶ ὅτι ἀπὸ βρέφους [τὰ] <strong>ἱερὰ γράμματα οἶδας, τὰ δυνάμενά σε σοφίσαι εἰς σωτηρίαν</strong> διὰ πίστεως τῆς ἐν Χριστῷ Ἰησοῦ.» (<a href="https://bibleox.com/el/gr-lxx-byz/2tim/3/#L15">Β Τιμ 3:15</a>)</p></blockquote><p>Όμως χωρίς τη διδαχή της Εκκλησίας, η εσφαλμένη ερμηνεία της Γραφής μπορεί να οδηγήσει τον άνθρωπο στην απώλεια:</p><blockquote><p>«καθὼς καὶ ὁ ἀγαπητὸς ἡμῶν ἀδελφὸς Παῦλος κατὰ τὴν δοθεῖσαν αὐτῷ σοφίαν ἔγραψεν ὑμῖν, ὡς καὶ <strong>ἐν πάσαις ἐπιστολαῖς</strong> λαλῶν ἐν αὐταῖς περὶ τούτων, ἐν αἷς ἐστιν δυσνόητά τινα, ἃ <strong>οἱ ἀμαθεῖς καὶ <mark>ἀστήρικτοι</mark></strong> <strong><mark>στρεβλοῦσιν</mark> ὡς καὶ τὰς λοιπὰς <mark>γραφὰς</mark> πρὸς τὴν ἰδίαν αὐτῶν ἀπώλειαν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/2pet/3/#L15-16">Β Πε 3:15-16</a>)</p></blockquote><h2>Η αναγκαιότητα της ορθής ερμηνείας της Γραφής</h2><h3>Όσα γράφτηκαν από το Άγιο Πνεύμα τα κατανοούν οι φορείς του Αγίου Πνεύματος</h3><p>Όσα γράφτηκαν από ανθρώπους που κινούνταν από το Άγιο Πνεύμα μπορούν να κατανοηθούν σωστά μόνο από τέτοιους ανθρώπους, που κινούνται από το ίδιο Άγιο Πνεύμα:</p><blockquote><p>«καὶ ἔχομεν <strong>βεβαιότερον τὸν προφητικὸν λόγον</strong>, ᾧ <strong>καλῶς ποιεῖτε προσέχοντες</strong> ὡς λύχνῳ φαίνοντι ἐν αὐχμηρῷ τόπῳ, ἕως οὗ ἡμέρα διαυγάσῃ καὶ φωσφόρος ἀνατείλῃ ἐν ταῖς καρδίαις ὑμῶν· τοῦτο πρῶτον γινώσκοντες, ὅτι <strong>πᾶσα προφητεία γραφῆς ἰδίας ἐπιλύσεως οὐ γίνεται</strong>· οὐ γὰρ θελήματι ἀνθρώπου ἠνέχθη προφητεία ποτέ, ἀλλὰ <strong>ὑπὸ πνεύματος ἁγίου φερόμενοι ἐλάλησαν ἀπὸ θεοῦ ἄνθρωποι</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/2pet/1/#L19-21">Β Πε 1:19-21</a>)</p></blockquote><h3>Η εσφαλμένη ερμηνεία της Γραφής μπορεί να οδηγήσει στην απώλεια</h3><p>Άνθρωποι αμαθείς και αστήρικτοι, που δεν στηρίζονται από την Εκκλησία, ερμηνεύουν τη Γραφή προς δική τους απώλεια:</p><blockquote><p>«καθὼς καὶ ὁ ἀγαπητὸς ἡμῶν ἀδελφὸς Παῦλος κατὰ τὴν δοθεῖσαν αὐτῷ σοφίαν ἔγραψεν ὑμῖν, ὡς καὶ <strong>ἐν πάσαις ἐπιστολαῖς</strong> λαλῶν ἐν αὐταῖς περὶ τούτων, ἐν αἷς ἐστιν δυσνόητά τινα, ἃ <strong>οἱ ἀμαθεῖς καὶ <mark>ἀστήρικτοι</mark></strong> <strong><mark>στρεβλοῦσιν</mark> ὡς καὶ τὰς λοιπὰς <mark>γραφὰς</mark> πρὸς τὴν ἰδίαν αὐτῶν ἀπώλειαν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/2pet/3/#L15-16">Β Πε 3:15-16</a>)</p></blockquote><p>Επίσης, η ίδια η μελέτη της Γραφής προτείνεται από τον απόστολο μόνο ως ένα είδος συμπληρώματος σε εκείνο το οποίο ο απόστολος είχε ήδη διδάξει προσωπικά με το κήρυγμά του:</p><blockquote><p>«σὺ δὲ <strong>μένε ἐν οἷς ἔμαθες καὶ ἐπιστώθης</strong>, εἰδὼς παρὰ τίνων ἔμαθες, <strong>καὶ ὅτι</strong> ἀπὸ βρέφους [τὰ] ἱερὰ γράμματα οἶδας, τὰ δυνάμενά σε σοφίσαι εἰς σωτηρίαν διὰ πίστεως τῆς ἐν Χριστῷ Ἰησοῦ.» (<a href="https://bibleox.com/el/gr-lxx-byz/2tim/3/#L14-15">Β Τιμ 3:14-15</a>)</p></blockquote><p><strong>*Και ότι</strong> – δηλαδή «και επιπλέον» σε σχέση με τα προηγούμενα. Δηλαδή η γνώση των Γραφών είναι ωφέλιμη ως συμπλήρωμα στη βάση — τη διδαχή από τον απόστολο. Στην επόμενη γραμμή αυτή η ιδέα επιβεβαιώνεται:</p><blockquote><p>«πᾶσα <strong>γραφὴ</strong> θεόπνευστος καὶ <strong>ὠφέλιμος</strong> <strong>πρὸς διδασκαλίαν</strong>, πρὸς ἐλεγμόν, πρὸς ἐπανόρθωσιν, πρὸς παιδείαν τὴν ἐν δικαιοσύνῃ,» (<a href="https://bibleox.com/el/gr-lxx-byz/2tim/3/#L16">Β Τιμ 3:16</a>)</p></blockquote><p>Δηλαδή η Γραφή δεν προβάλλεται ως κάτι αυτοτελές, αλλά χρησιμεύει ως ωφέλιμο εργαλείο για τον επίσκοπο Τιμόθεο στο έργο του: διδασκαλία, έλεγχος, επανόρθωση, καθοδήγηση — δηλαδή στο έργο της <strong>παράδοσης</strong> της αποστολικής πίστης (της Ιεράς Παράδοσης).</p><blockquote><p>«ἀντεχόμενον <strong>τοῦ κατὰ τὴν διδαχὴν πιστοῦ λόγου</strong>, ἵνα δυνατὸς ᾖ καὶ παρακαλεῖν ἐν τῇ διδασκαλίᾳ τῇ ὑγιαινούσῃ καὶ τοὺς ἀντιλέγοντας ἐλέγχειν. <strong>Εἰσὶν γὰρ πολλοὶ [καὶ] ἀνυπότακτοι, ματαιολόγοι καὶ φρεναπάται</strong>, μάλιστα οἱ ἐκ τῆς περιτομῆς, οὓς δεῖ ἐπιστομίζειν, οἵτινες ὅλους οἴκους ἀνατρέπουσιν διδάσκοντες ἃ μὴ δεῖ αἰσχροῦ κέρδους χάριν.» (<a href="https://bibleox.com/el/gr-lxx-byz/tit/1/#L9-11">Τιτ 1:9-11</a>)</p></blockquote><h3>Οι απόστολοι κατάλαβαν λανθασμένα τον Χριστό</h3><blockquote><p>«Καὶ ἐλθόντες οἱ μαθηταὶ εἰς τὸ πέραν ἐπελάθοντο ἄρτους λαβεῖν. ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς, Ὁρᾶτε καὶ προσέχετε ἀπὸ τῆς ζύμης τῶν Φαρισαίων καὶ Σαδδουκαίων. οἱ δὲ διελογίζοντο ἐν ἑαυτοῖς λέγοντες ὅτι Ἄρτους οὐκ ἐλάβομεν. γνοὺς δὲ ὁ Ἰησοῦς εἶπεν, Τί διαλογίζεσθε ἐν ἑαυτοῖς, ὀλιγόπιστοι, ὅτι ἄρτους οὐκ ἔχετε; <strong>οὔπω νοεῖτε</strong>, οὐδὲ μνημονεύετε τοὺς πέντε ἄρτους τῶν πεντακισχιλίων καὶ πόσους κοφίνους ἐλάβετε; οὐδὲ τοὺς ἑπτὰ ἄρτους τῶν τετρακισχιλίων καὶ πόσας σπυρίδας ἐλάβετε; <strong>πῶς οὐ νοεῖτε ὅτι οὐ περὶ ἄρτων εἶπον ὑμῖν</strong>; προσέχετε δὲ ἀπὸ τῆς ζύμης τῶν Φαρισαίων καὶ Σαδδουκαίων. τότε συνῆκαν ὅτι οὐκ εἶπεν προσέχειν ἀπὸ τῆς ζύμης [τῶν ἄρτων] ἀλλὰ ἀπὸ τῆς διδαχῆς τῶν Φαρισαίων καὶ Σαδδουκαίων.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/16/#L5-12">Μτ 16:5-12</a>)</p></blockquote><h3>Ο Αιθίοπας ευνούχος δεν μπορούσε να κατανοήσει τη Γραφή</h3><blockquote><p>«εἶπεν δὲ τὸ πνεῦμα τῷ Φιλίππῳ, Πρόσελθε καὶ κολλήθητι τῷ ἅρματι τούτῳ. προσδραμὼν δὲ ὁ Φίλιππος ἤκουσεν αὐτοῦ ἀναγινώσκοντος Ἠσαΐαν τὸν προφήτην, καὶ εἶπεν, Ἆρά γε γινώσκεις ἃ ἀναγινώσκεις; ὁ δὲ εἶπεν, <strong>Πῶς γὰρ ἂν δυναίμην ἐὰν μή τις ὁδηγήσει με;</strong> παρεκάλεσέν τε τὸν Φίλιππον ἀναβάντα καθίσαι σὺν αὐτῷ.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/8/#L29-31">Πραξ 8:29-31</a>)</p></blockquote><h3>Ο Χριστός εξηγούσε στους αποστόλους τις προφητείες από τις Γραφές</h3><blockquote><p>«καὶ αὐτὸς εἶπεν πρὸς αὐτούς, Ὦ ἀνόητοι καὶ βραδεῖς τῇ καρδίᾳ τοῦ πιστεύειν ἐπὶ πᾶσιν οἷς ἐλάλησαν οἱ προφῆται· οὐχὶ ταῦτα ἔδει παθεῖν τὸν Χριστὸν καὶ εἰσελθεῖν εἰς τὴν δόξαν αὐτοῦ; καὶ <strong>ἀρξάμενος ἀπὸ Μωϋσέως καὶ ἀπὸ πάντων τῶν προφητῶν διερμήνευσεν αὐτοῖς ἐν πάσαις ταῖς γραφαῖς τὰ περὶ ἑαυτοῦ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/24/#L25-27">Λκ 24:25-27</a>)</p></blockquote><h2>Η Παλαιά Διαθήκη</h2><h3>Η αναγκαιότητα της ερμηνείας της Γραφής</h3><p>Στην Παλαιά Διαθήκη δεν διάβαζαν απλώς τη Γραφή μπροστά στον λαό, αλλά ο ιερέας Έσδρας μαζί με άλλους σοφούς άνδρες πρόσθεταν ερμηνεία, ώστε ο λαός να κατανοεί (Νεεμίας 8 = Έσδρας Β΄ 18):</p><blockquote><p>«καὶ ἔστη Εσδρας ὁ γραμματεὺς ἐπὶ βήματος ξυλίνου, καὶ ἔστησαν ἐχόμενα αὐτοῦ Ματταθιας καὶ Σαμαιας &lt;…&gt; καὶ ἀνέγνωσαν ἐν βιβλίῳ νόμου τοῦ θεοῦ, καὶ ἐδίδασκεν Εσδρας καὶ <strong>διέστελλεν</strong> ἐν ἐπιστήμῃ κυρίου, καὶ <strong>συνῆκεν ὁ λαὸς ἐν τῇ ἀναγνώσει</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ezd/18/#L4,8">Εσδ 18:4,8</a>)</p></blockquote>'
