  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: '<h2>Η Σεπτουαγίντα (Ο΄) — τι είναι;</h2><p>Η <strong>Σεπτουαγίντα</strong> (λατ. Septuaginta — «εβδομήντα», ή εν συντομία — Ο΄) είναι η μετάφραση των βιβλίων της Παλαιάς Διαθήκης, που έγινε τον 3ο–2ο αι. π.Χ. από τα εβραϊκά στα αρχαία ελληνικά από εβδομήντα (72) Εβραίους ερμηνευτές.</p><p>Εκτός από αυτό το ελληνικό κείμενο, υπάρχει και το κείμενο στα εβραϊκά — το μασοριτικό.</p><p>Το <strong>μασοριτικό κείμενο</strong> είναι το κείμενο της Αγίας Γραφής της Παλαιάς Διαθήκης στα εβραϊκά, στο οποίο τον 7ο–10ο αι. μ.Χ. προστέθηκαν φωνητικά σημεία. Τι είναι τα φωνητικά σημεία; Με απλά λόγια, είναι διάφορες γραμμούλες και σημαδάκια πάνω από τις λέξεις, που επιτρέπουν να διαβάσει κανείς σωστά τη λέξη, υποδεικνύοντας τα φωνήεντα που λείπουν από αυτήν και τις ιδιαιτερότητες της ανάγνωσης. Αυτά τα σημαδάκια ονομάζονται διακριτικά σημεία. Επειδή το εβραϊκό κείμενο αποτελούνταν μόνο από σύμφωνα γράμματα, μπορούσε να το διαβάσει σωστά μόνο όποιος γνώριζε την παράδοση της ανάγνωσης (την Παράδοση). Τα φωνητικά σημεία τοποθετήθηκαν για να δώσουν στο κείμενο μία μονοσήμαντη ανάγνωση.</p><p>Η Σεπτουαγίντα είναι σημαντική επειδή είναι το κείμενο των ίδιων των Εβραίων, το οποίο ετοιμάστηκε πριν ο εβραϊκός λαός απορρίψει τον Ιησού ως Χριστό και Θεό. Δηλαδή τότε δεν υπήρχε ακόμη η ανάγκη να κατανοείται η Γραφή έτσι ώστε να μένει όλο και λιγότερος χώρος σε αυτήν για τον Κύριο Ιησού Χριστό. Επίσης, πρέπει να ληφθεί υπόψη ότι κάθε μετάφραση είναι πάντα ερμηνεία. Στην περίπτωση αυτή, η Σεπτουαγίντα είναι μια ερμηνευτική μετάφραση, που έγινε από φορείς της γλώσσας και της παράδοσης, από τα εβραϊκά, που ήταν δύσκολα προσβάσιμα στην ανάγνωση, στην ελληνική γλώσσα, που ήταν κατανοητή από πολλούς.</p><h2>Παρθένος ή γυναίκα</h2><p>Ο ευαγγελιστής Ματθαίος αναφέρεται στην προφητεία του Ησαΐα για τη γέννηση του Χριστού από παρθένο:</p><blockquote><p>«Ἰδοὺ ἡ <strong>παρθένος</strong> ἐν γαστρὶ ἕξει καὶ τέξεται υἱόν, καὶ καλέσουσιν τὸ ὄνομα αὐτοῦ Ἐμμανουήλ, ὅ ἐστιν μεθερμηνευόμενον Μεθ᾿ ἡμῶν ὁ θεός.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/1/#L23">Μτ 1:23</a>)</p></blockquote><p>Κατά τους Ο΄, ο Χριστός έπρεπε να γεννηθεί από Παρθένο:</p><blockquote><p>«διὰ τοῦτο δώσει κύριος αὐτὸς ὑμῖν σημεῖον· ἰδοὺ ἡ <strong>παρθένος</strong> ἐν γαστρὶ ἕξει καὶ τέξεται υἱόν, καὶ καλέσεις τὸ ὄνομα αὐτοῦ Εμμανουηλ·» (<a href="https://bibleox.com/el/gr-lxx-byz/is/7/#L14">Ησ 7:14</a>)</p></blockquote><p>Κατά το μασοριτικό κείμενο, ο Χριστός γεννιέται από μια ανύπαντρη νεαρή κοπέλα: εβρ. — עַלְמָ֗ה [al-maw’].</p><h2>Ράβδος ή κεφαλάρι του κρεβατιού</h2><p>Ο απόστολος Παύλος στην προς Εβραίους επιστολή(!) θυμάται πώς ο Ιακώβ προσκύνησε το πάνω μέρος της ράβδου του:</p><blockquote><p>«Πίστει Ἰακὼβ ἀποθνῄσκων ἕκαστον τῶν υἱῶν Ἰωσὴφ εὐλόγησεν, καὶ προσεκύνησεν ἐπὶ τὸ <strong>ἄκρον τῆς ῥάβδου</strong> <strong>αὐτοῦ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/11/#L21">Εβρ 11:21</a>)</p></blockquote><p>Κατά τους Ο΄, ο Ιακώβ προσκύνησε το πάνω μέρος της ράβδου:</p><blockquote><p>«εἶπεν δέ Ὄμοσόν μοι. καὶ ὤμοσεν αὐτῷ. καὶ προσεκύνησεν Ισραηλ ἐπὶ τὸ <strong>ἄκρον τῆς ῥάβδου</strong> <strong>αὐτοῦ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/gen/47/#L31">Γεν 47:31</a>)</p></blockquote><p>Κατά το μασοριτικό κείμενο, ο Ιακώβ προσκύνησε το κεφαλάρι του κρεβατιού: εβρ. — מִּטָּֽה [mit-taw’].</p><h2>Ο Καϊνάν στη γενεαλογία του Κυρίου Ιησού Χριστού</h2><p>Ο ευαγγελιστής Λουκάς παραθέτει τη γενεαλογία του Σωτήρα, αναφέροντας τον Καϊνάν ανάμεσα στον Σαλά και στον Αρφαξάδ:</p><blockquote><p>«τοῦ Σεροὺχ τοῦ Ῥαγαὺ τοῦ Φάλεκ τοῦ Ἔβερ τοῦ Σαλὰ τοῦ <strong>Καϊνὰμ</strong> τοῦ Ἀρφαξὰδ τοῦ Σὴμ τοῦ Νῶε τοῦ Λάμεχ τοῦ Μαθουσαλὰ τοῦ Ἑνὼχ τοῦ Ἰάρετ τοῦ Μαλελεὴλ τοῦ Καϊνὰμ τοῦ Ἐνὼς τοῦ Σὴθ τοῦ Ἀδὰμ τοῦ θεοῦ.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/3/#L35-38">Λκ 3:35-38</a>)</p></blockquote><p>Στους Ο΄ ο Καϊνάν (130+330 έτη) υπάρχει. Γεννήθηκε από τον Αρφαξάδ και γέννησε τον Σαλά:</p><blockquote><p>«καὶ <strong>ἔζησεν Αρφαξαδ μετὰ τὸ γεννῆσαι αὐτὸν τὸν Καιναν</strong> ἔτη τετρακόσια τριάκοντα καὶ ἐγέννησεν υἱοὺς καὶ θυγατέρας καὶ ἀπέθανεν. Καὶ <strong>ἔζησεν Καιναν ἑκατὸν τριάκοντα ἔτη καὶ ἐγέννησεν τὸν Σαλα</strong>. καὶ ἔζησεν Καιναν μετὰ τὸ γεννῆσαι αὐτὸν τὸν Σαλα ἔτη τριακόσια τριάκοντα καὶ ἐγέννησεν υἱοὺς καὶ θυγατέρας καὶ ἀπέθανεν.» (<a href="https://bibleox.com/el/gr-lxx-byz/gen/11/#L13">Γεν 11:13</a>)</p></blockquote><p>Στο ελληνικό κείμενο των Ο΄, και οι δύο στίχοι 12–13 αναφέρουν τον Καϊνάν (το μασοριτικό κείμενο, αντίθετα, δίνει στον Αρφαξάδ 35+403 έτη και αμέσως τον Σαλά, χωρίς καθόλου τον Καϊνάν):</p><blockquote><p>«Καὶ ἔζησεν Αρφαξαδ ἑκατὸν τριάκοντα πέντε ἔτη καὶ ἐγέννησεν τὸν Καιναν. καὶ ἔζησεν Αρφαξαδ μετὰ τὸ γεννῆσαι αὐτὸν τὸν Καιναν ἔτη τετρακόσια τριάκοντα καὶ ἐγέννησεν υἱοὺς καὶ θυγατέρας καὶ ἀπέθανεν. Καὶ ἔζησεν Καιναν ἑκατὸν τριάκοντα ἔτη καὶ ἐγέννησεν τὸν Σαλα. καὶ ἔζησεν Καιναν μετὰ τὸ γεννῆσαι αὐτὸν τὸν Σαλα ἔτη τριακόσια τριάκοντα καὶ ἐγέννησεν υἱοὺς καὶ θυγατέρας καὶ ἀπέθανεν.» (<a href="https://bibleox.com/el/gr-lxx-byz/gen/11/#L12-13">Γεν 11:12-13</a>)</p></blockquote><p>Ανάλογη εικόνα περιγράφεται και στο προηγούμενο κεφάλαιο: <a href="https://bibleox.com/el/gr-lxx-byz/gen/10/#L22,24">Γεν 10:22,24</a>.</p><h2>«Φως στους τυφλούς» ή «άνοιγμα φυλακής στους δεσμίους»</h2><p>Ο ευαγγελιστής Λουκάς παραπέμπει στην προφητεία του προφήτη Ησαΐα, παραθέτοντάς την κατά τους Ο΄:</p><blockquote><p>«Πνεῦμα κυρίου ἐπ᾿ ἐμέ, οὗ εἵνεκεν ἔχρισέν με εὐαγγελίσασθαι πτωχοῖς, ἀπέσταλκέν με κηρύξαι αἰχμαλώτοις ἄφεσιν καὶ <strong>τυφλοῖς ἀνάβλεψιν</strong>, ἀποστεῖλαι τεθραυσμένους ἐν ἀφέσει, κηρύξαι ἐνιαυτὸν κυρίου δεκτόν.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/4/#L18-19">Λκ 4:18-19</a>)</p></blockquote><p>Στους Ο΄ στο σημείο αυτό βρίσκεται η φράση «τυφλοίς ανάβλεψιν» (δηλαδή «φως στους τυφλούς»):</p><blockquote><p>«Πνεῦμα κυρίου ἐπ᾿ ἐμέ, οὗ εἵνεκεν ἔχρισέν με· εὐαγγελίσασθαι πτωχοῖς ἀπέσταλκέν με, ἰάσασθαι τοὺς συντετριμμένους τῇ καρδίᾳ, κηρύξαι αἰχμαλώτοις ἄφεσιν καὶ <strong>τυφλοῖς ἀνάβλεψιν</strong>, καλέσαι ἐνιαυτὸν κυρίου δεκτὸν καὶ ἡμέραν ἀνταποδόσεως, παρακαλέσαι πάντας τοὺς πενθοῦντας,» (<a href="https://bibleox.com/el/gr-lxx-byz/is/61/#L1-2">Ησ 61:1-2</a>)</p></blockquote><p>Στο μασοριτικό κείμενο η φράση αυτή αποδίδεται «άνοιγμα φυλακής στους δεσμίους» (εβρ. — אֲסוּרִים פְּקַח ־ קֽוֹחַ ׃ [aw-sar’ pek-akh-ko’-akh]). Στους Ο΄, αντίθετα, το χωρίο έχει ως εξής:</p><blockquote><p>«Πνεῦμα κυρίου ἐπ᾿ ἐμέ, οὗ εἵνεκεν ἔχρισέν με· εὐαγγελίσασθαι πτωχοῖς ἀπέσταλκέν με, ἰάσασθαι τοὺς συντετριμμένους τῇ καρδίᾳ, κηρύξαι <strong>αἰχμαλώτοις ἄφεσιν</strong> καὶ τυφλοῖς ἀνάβλεψιν, καλέσαι ἐνιαυτὸν κυρίου δεκτὸν καὶ ἡμέραν ἀνταποδόσεως, παρακαλέσαι πάντας τοὺς πενθοῦντας,» (<a href="https://bibleox.com/el/gr-lxx-byz/is/61/#L1-2">Ησ 61:1-2</a>)</p></blockquote><p>Επιπλέον, στο μασοριτικό κείμενο προκύπτει επανάληψη της φράσης με άλλα λόγια: «<em>να κηρύξει άφεση στους αιχμαλώτους</em> <strong><em>και</em></strong> <em>στους δεσμίους άνοιγμα της φυλακής</em>».</p><h2>Χέρια και πόδια τα τρύπησαν ή τα κατασπαράζει λιοντάρι;</h2><p>Στους Ο΄ υπάρχει προφητεία για τον Χριστό:</p><blockquote><p>«ὅτι ἐκύκλωσάν με κύνες πολλοί, συναγωγὴ πονηρευομένων περιέσχον με, <strong>ὤρυξαν χεῖράς μου καὶ πόδας</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/21/#L16">Ψλ 21:16</a>)</p></blockquote><p>Το μεταγενέστερο μασοριτικό κείμενο στον Ψλ 21:16 (κατά τη μασοριτική αρίθμηση Ψλ 22:17) δεν περιέχει λόγια για το τρύπημα των χεριών και των ποδιών του Χριστού. Αντί γι’ αυτό, εκεί υπάρχει η λέξη «λιοντάρι». Το ρήμα «κατασπαράζω», ωστόσο, δεν υπάρχει καθόλου στο κείμενο, και δεν είναι κατανοητό πώς οι ενέργειες του λιονταριού σχετίζονται με τα χέρια και τα πόδια.</p><p>Ωστόσο, το σωστό είναι «τρύπησαν». Σε έναν αρχαίο χειρόγραφο από το Κουμράν, το 4Q88, επιβεβαιώνεται ότι τα χέρια και τα πόδια τρυπήθηκαν.</p><p>Επιπλέον, υπάρχει και άλλη μια προφητεία για το τι ακριβώς τρυπήθηκε. Αναφέρεται εδώ:</p><blockquote><p><em>«καὶ πάλιν ἑτέρα γραφὴ λέγει, </em><strong><em>Ὄψονται εἰς ὃν <mark>ἐξεκέντησαν</mark>.</em></strong><em>» (</em><a href="https://bibleox.com/el/gr-lxx-byz/in/19/#L37"><em>Ιω 19:37</em></a><em>)</em></p></blockquote><p>Παραπομπή εδώ:</p><blockquote><p><em>«καὶ ἐκχεῶ ἐπὶ τὸν οἶκον Δαυιδ καὶ ἐπὶ τοὺς κατοικοῦντας Ιερουσαλημ πνεῦμα χάριτος καὶ οἰκτιρμοῦ, καὶ ἐπιβλέψονται πρός με ἀνθ᾿ ὧν </em><strong><em><mark>κατωρχήσαντο</mark></em></strong><em> καὶ κόψονται ἐπ᾿ αὐτὸν κοπετὸν ὡς ἐπ᾿ ἀγαπητὸν καὶ ὀδυνηθήσονται ὀδύνην ὡς ἐπὶ πρωτοτόκῳ.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/zah/12/#L10"><em>Ζαχ 12:10</em></a><em>)</em></p></blockquote><blockquote><p><em>«וְשָׁפַכְתִּי עַל ־ בֵּית דָּוִיד וְעַל ׀ יוֹשֵׁב יְרוּשָׁלִַם רוּחַ חֵן וְתַחֲנוּנִים וְהִבִּיטוּ אֵלַי אֵת אֲשֶׁר ־ </em><strong><em>דָּקָרוּ</em></strong><em> וְסָפְדוּ עָלָיו כְּמִסְפֵּד עַל ־ הַיָּחִיד וְהָמֵר עָלָיו כְּהָמֵר עַֽל ־ הַבְּכֽוֹר ׃» (</em><a href="https://bibleox.com/el/heb-osm/zah/12/#L10"><em>Ζαχ 12:10</em></a><em>)</em></p></blockquote><p>דָּקָ֑רוּ — το εβραϊκό ρήμα που στο ελληνικό κείμενο των Ο΄ αποδίδεται κατωρχήσαντο.</p><p>דקר — τρυπώ, διαπερνώ. Και διατρυπιέμαι, τρυπιέμαι.</p><p>Το χειρόγραφο 4Q80 από το Κουμράν επιβεβαιώνει ότι τρύπησαν.</p>'
