  body: <ol><li><p><a class="kanon" href="https://bibleox.com/el/gr-lxx-byz/rim/1/">Προς Ρωμαίους</a> — ο απόστολος προετοιμάζει με την επιστολή την έλευσή του στη Ρώμη·</p></li><li><p><a class="kanon" href="https://bibleox.com/el/gr-lxx-byz/1kor/1/">Προς Κορινθίους Α’</a> — έλεγχος του αιμομίκτη, δημιουργία παρατάξεων, αταξίες στα δείπνα, επίδειξη του χαρίσματος των γλωσσών·</p></li><li><p><a class="kanon" href="https://bibleox.com/el/gr-lxx-byz/2kor/1/">Προς Κορινθίους Β’</a> — αποδείξεις του αποστολικού αξιώματος, διάθεση για προσφορές·</p></li><li><p><a class="kanon" href="https://bibleox.com/el/gr-lxx-byz/gal/1/">Προς Γαλάτας</a> — έλεγχος της ψευδοδιδασκαλίας περί της ανάγκης περιτομής για τους χριστιανούς·</p></li><li><p><a class="kanon" href="https://bibleox.com/el/gr-lxx-byz/ef/1/">Προς Εφεσίους</a> — αναγγελία της θεωρίας των μυστηρίων του Θεού, παρηγοριά των θλιβομένων·</p></li><li><p><a class="kanon" href="https://bibleox.com/el/gr-lxx-byz/fil/1/">Προς Φιλιππησίους</a> — χαιρετιστήρια επιστολή προς την εκκλησία που αγαπούσε περισσότερο τον απόστολο·</p></li><li><p><a class="kanon" href="https://bibleox.com/el/gr-lxx-byz/kol/1/">Προς Κολοσσαείς</a> — κατά των ψευδοδιδασκαλιών και του μείγματος ψευδοδιδασκαλιών του γνωστικισμού, της φιλοσοφίας και του ιουδαϊσμού·</p></li><li><p><a class="kanon" href="https://bibleox.com/el/gr-lxx-byz/1sol/1/">Προς Θεσσαλονικείς Α’</a> — παρηγοριά σχετικά με την τύχη των κεκοιμημένων, θεραπεία των ηθών·</p></li><li><p><a class="kanon" href="https://bibleox.com/el/gr-lxx-byz/2sol/1/">Προς Θεσσαλονικείς Β’</a> — διευκρίνιση της διδασκαλίας περί της Δευτέρας Παρουσίας·</p></li><li><p><a class="kanon" href="https://bibleox.com/el/gr-lxx-byz/1tim/1/">Προς Τιμόθεον Α’</a> — στήριξη και καθοδήγηση κατά την ενίσχυση των ψευδοδιδασκάλων στην Έφεσο·</p></li><li><p><a class="kanon" href="https://bibleox.com/el/gr-lxx-byz/2tim/1/">Προς Τιμόθεον Β’</a> — η αποχαιρετιστήρια διαθήκη του αποστόλου·</p></li><li><p><a class="kanon" href="https://bibleox.com/el/gr-lxx-byz/tit/1/">Προς Τίτον</a> — η κατοχύρωση του κύρους του Τίτου μεταξύ των Κρητών·</p></li><li><p><a class="kanon" href="https://bibleox.com/el/gr-lxx-byz/fm/1/">Προς Φιλήμονα</a> — η επιθυμία να συμφιλιώσει τον Φιλήμονα με τον δούλο του Ονήσιμο·</p></li><li><p><a class="kanon" href="https://bibleox.com/el/gr-lxx-byz/evr/1/">Προς Εβραίους</a> — η αποστασία των χριστιανών και η στροφή τους στον ιουδαϊσμό, η μαρτυρία για την υπεροχή της Καινής Διαθήκης έναντι της Παλαιάς, η ενθάρρυνση των χριστιανών να υπομένουν τις θλίψεις.</p></li></ol>
