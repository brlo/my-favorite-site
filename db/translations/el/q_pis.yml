  body: <p>Οι γραμμές της Αγίας Γραφής, αν και γράφονται με την έμπνευση του Πνεύματος του Θεού (είναι θεόπνευστες), ωστόσο δεν υπαγορεύονται από τον Θεό, και οι γραφείς δεν είναι ένα απρόσωπο εργαλείο στα χέρια του Θεού, όπως ένα μολύβι. Ο προφήτης-ποιμένας γράφει με απλή γλώσσα, ενώ ο προφήτης από το βασιλικό παλάτι γράφει ως άνθρωπος υψηλής μόρφωσης. Και οι δύο καταφεύγουν σε παραδείγματα που αντιστοιχούν στον τρόπο ζωής τους. Έτσι, για τον απόστολο Παύλο, οι άλλοι απόστολοι γράφουν ότι υπάρχει στις επιστολές του κάτι δυσνόητο:</p><blockquote><p>«ὡς καὶ ἐν πάσαις ἐπιστολαῖς λαλῶν ἐν αὐταῖς περὶ τούτων, ἐν αἷς ἐστιν <strong>δυσνόητά τινα</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/2pet/3/#L16">Β Πε 3:16</a>)</p></blockquote><p>Ο ίδιος ο απόστολος Παύλος ονομάζει τον εαυτό του αμαθή στον λόγο, αλλά όχι στη γνώση:</p><blockquote><p>«εἰ δὲ καὶ <strong>ἰδιώτης τῷ λόγῳ</strong>, ἀλλ᾿ οὐ τῇ γνώσει» (<a href="https://bibleox.com/el/gr-lxx-byz/2kor/11/#L6">Β Κορ 11:6</a>)</p></blockquote><p>Δηλαδή γράφει όπως μπορεί, αν και δεν έχει έλλειψη γνώσης. Και πράγματι, ο απόστολος Παύλος, ως μορφωμένος Φαρισαίος, καταφεύγει στη χρήση σύνθετων νοηματικών κατασκευών. Επιπλέον, μερικές φορές οι απόστολοι δηλώνουν απευθείας ότι γράφουν από τον εαυτό τους:</p><blockquote><p>«Περὶ δὲ τῶν παρθένων <strong>ἐπιταγὴν κυρίου οὐκ ἔχω, γνώμην δὲ δίδωμι</strong> ὡς ἠλεημένος ὑπὸ κυρίου πιστὸς εἶναι.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/7/#L25">Α Κορ 7:25</a>)</p></blockquote><p>Θα ήταν πιο σωστό να πούμε ότι η Αγία Γραφή είναι κοινό έργο του Θεού και του ανθρώπου (συνεργασία, συνέργεια):</p><blockquote><p>«θεοῦ γάρ ἐσμεν <strong>συνεργοί</strong>· θεοῦ γεώργιον, θεοῦ οἰκοδομή ἐστε.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/3/#L9">Α Κορ 3:9</a>)</p></blockquote>
