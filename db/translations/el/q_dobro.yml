    priority: 5
  update: true
  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <blockquote>«Πάντοτε χαίρετε, ἀδιαλείπτως προσεύχεσθε, <b>ἐν παντὶ εὐχαριστεῖτε· τοῦτο γὰρ θέλημα θεοῦ</b> ἐν Χριστῷ Ἰησοῦ εἰς ὑμᾶς.» (<a href="https://bibleox.com/el/gr-lxx-byz/1sol/5/#L16-18">Α Θεσ 5:16-18</a>)</blockquote><blockquote>«ἐν παντὶ πλουτιζόμενοι εἰς πᾶσαν ἁπλότητα, ἥτις <b>κατεργάζεται δι᾿ ἡμῶν εὐχαριστίαν τῷ θεῷ</b> —» (<a href="https://bibleox.com/el/gr-lxx-byz/2kor/9/#L11">Β Κορ 9:11</a>)</blockquote><blockquote>«ὅτι ἡ διακονία τῆς λειτουργίας ταύτης οὐ μόνον ἐστὶν προσαναπληροῦσα τὰ ὑστερήματα τῶν ἁγίων, ἀλλὰ καὶ <b>περισσεύουσα διὰ πολλῶν εὐχαριστιῶν τῷ θεῷ</b> —» (<a href="https://bibleox.com/el/gr-lxx-byz/2kor/9/#L12">Β Κορ 9:12</a>)</blockquote><blockquote>«ἐρριζωμένοι καὶ ἐποικοδομούμενοι ἐν αὐτῷ καὶ βεβαιούμενοι [ἐν] τῇ πίστει καθὼς ἐδιδάχθητε, περισσεύοντες <b>ἐν εὐχαριστίᾳ</b>.» (<a href="https://bibleox.com/el/gr-lxx-byz/kol/2/#L7">Κολ 2:7</a>)</blockquote><blockquote>«καὶ πᾶν ὅ τι ἐὰν ποιῆτε ἐν λόγῳ ἢ ἐν ἔργῳ, πάντα ἐν ὀνόματι κυρίου Ἰησοῦ, <b>εὐχαριστοῦντες</b> τῷ θεῷ πατρὶ δι᾿ αὐτοῦ.» (<a href="https://bibleox.com/el/gr-lxx-byz/kol/3/#L17">Κολ 3:17</a>)</blockquote><blockquote>«μηδὲν μεριμνᾶτε, ἀλλ᾿ <b>ἐν παντὶ τῇ προσευχῇ καὶ τῇ δεήσει μετὰ εὐχαριστίας</b> τὰ αἰτήματα ὑμῶν γνωριζέσθω πρὸς τὸν θεόν.» (<a href="https://bibleox.com/el/gr-lxx-byz/fil/4/#L6">Φιλ 4:6</a>)</blockquote><blockquote>«καὶ αἰσχρότης καὶ μωρολογία ἢ εὐτραπελία, ἃ οὐκ ἀνῆκεν, ἀλλὰ μᾶλλον <b>εὐχαριστία</b>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/5/#L4">Εφ 5:4</a>)</blockquote><blockquote>«<b>Τῇ προσευχῇ προσκαρτερεῖτε</b>, γρηγοροῦντες ἐν αὐτῇ <b>ἐν εὐχαριστίᾳ</b>» (<a href="https://bibleox.com/el/gr-lxx-byz/kol/4/#L2">Κολ 4:2</a>)</blockquote><blockquote>«διότι γνόντες τὸν θεὸν οὐχ ὡς θεὸν ἐδόξασαν ἢ <b>ηὐχαρίστησαν</b>, ἀλλ᾿ ἐματαιώθησαν ἐν τοῖς διαλογισμοῖς αὐτῶν καὶ ἐσκοτίσθη ἡ ἀσύνετος αὐτῶν καρδία.» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/1/#L21">Ρωμ 1:21</a>)</blockquote><blockquote>«ἔσονται γὰρ οἱ ἄνθρωποι φίλαυτοι, φιλάργυροι, ἀλαζόνες, ὑπερήφανοι, βλάσφημοι, γονεῦσιν ἀπειθεῖς, <b>ἀχάριστοι</b>, ἀνόσιοι» (<a href="https://bibleox.com/el/gr-lxx-byz/2tim/3/#L2">Β Τιμ 3:2</a>)</blockquote>Η ευχαριστία προϋποθέτει να αρκούμαστε στα αγαθά που έχουμε τώρα:<blockquote>«<b>ἔστιν δὲ πορισμὸς μέγας ἡ εὐσέβεια μετὰ αὐταρκείας· &lt;…&gt; ἔχοντες δὲ διατροφὰς καὶ σκεπάσματα</b>, <b>τούτοις ἀρκεσθησόμεθα</b>. οἱ δὲ βουλόμενοι πλουτεῖν ἐμπίπτουσιν εἰς πειρασμὸν καὶ παγίδα καὶ ἐπιθυμίας πολλὰς ἀνοήτους καὶ βλαβεράς, αἵτινες βυθίζουσιν τοὺς ἀνθρώπους εἰς ὄλεθρον καὶ ἀπώλειαν·» (<a href="https://bibleox.com/el/gr-lxx-byz/1tim/6/#L6,8-9">Α Τιμ 6:6,8-9</a>)</blockquote><blockquote>«οὐχ ὅτι καθ᾿ ὑστέρησιν λέγω, ἐγὼ γὰρ <b>ἔμαθον ἐν οἷς εἰμι αὐτάρκης εἶναι</b>. <b>οἶδα καὶ ταπεινοῦσθαι, οἶδα καὶ περισσεύειν</b>· ἐν παντὶ καὶ ἐν πᾶσιν μεμύημαι καὶ χορτάζεσθαι καὶ πεινᾶν, καὶ περισσεύειν καὶ ὑστερεῖσθαι.» (<a href="https://bibleox.com/el/gr-lxx-byz/fil/4/#L11-12">Φιλ 4:11-12</a>)</blockquote><blockquote>«Οὗτοί εἰσιν <b>γογγυσταί, μεμψίμοιροι</b>, κατὰ τὰς ἐπιθυμίας αὐτῶν πορευόμενοι, καὶ τὸ στόμα αὐτῶν λαλεῖ ὑπέρογκα, θαυμάζοντες πρόσωπα ὠφελείας χάριν.» (<a href="https://bibleox.com/el/gr-lxx-byz/iud/1/#L16">Ιούδα 1:16</a>)</blockquote>
