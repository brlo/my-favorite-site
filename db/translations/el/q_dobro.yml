    priority: 3
  update: true
  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <h2>Η ελεημοσύνη, η φιλοπτωχία, η γενναιοδωρία</h2><blockquote><p>«Ἐὰν δὲ γένηται ἐν σοὶ <strong>ἐνδεὴς</strong> τῶν ἀδελφῶν σου ἐν μιᾷ τῶν πόλεων σου ἐν τῇ γῇ, ᾗ κύριος ὁ θεός σου δίδωσίν σοι, οὐκ ἀποστέρξεις τὴν καρδίαν σου <strong>οὐδ᾿ οὐ μὴ συσφίγξῃς τὴν χεῖρά σου</strong> ἀπὸ τοῦ ἀδελφοῦ σου τοῦ ἐπιδεομένου· <strong>ἀνοίγων ἀνοίξεις τὰς χεῖράς σου</strong> αὐτῷ, δάνειον δανιεῖς αὐτῷ ὅσον ἐπιδέεται, καθ᾿ ὅσον ἐνδεεῖται. πρόσεχε σεαυτῷ μὴ γένηται ῥῆμα κρυπτὸν ἐν τῇ καρδίᾳ σου, ἀνόμημα, λέγων Ἐγγίζει τὸ ἔτος τὸ ἕβδομον, ἔτος τῆς ἀφέσεως, καὶ <strong>πονηρεύσηται ὁ ὀφθαλμός σου τῷ ἀδελφῷ σου τῷ ἐπιδεομένῳ</strong>, καὶ οὐ δώσεις αὐτῷ, καὶ βοήσεται κατὰ σοῦ πρὸς κύριον, καὶ ἔσται ἐν σοὶ ἁμαρτία μεγάλη. διδοὺς δώσεις αὐτῷ καὶ δάνειον δανιεῖς αὐτῷ ὅσον ἐπιδέεται, καὶ οὐ λυπηθήσῃ τῇ καρδίᾳ σου διδόντος σου αὐτῷ· ὅτι διὰ τὸ ῥῆμα τοῦτο εὐλογήσει σε κύριος ὁ θεός σου ἐν πᾶσιν τοῖς ἔργοις καὶ ἐν πᾶσιν, οὗ ἂν ἐπιβάλῃς τὴν χεῖρά σου. <strong>οὐ γὰρ μὴ ἐκλίπῃ ἐνδεὴς ἀπὸ τῆς γῆς</strong>· διὰ τοῦτο ἐγώ σοι ἐντέλλομαι ποιεῖν τὸ ῥῆμα τοῦτο λέγων <strong>Ἀνοίγων ἀνοίξεις τὰς χεῖράς σου</strong> τῷ ἀδελφῷ σου τῷ πένητι καὶ τῷ ἐπιδεομένῳ τῷ ἐπὶ τῆς γῆς σου.» (<a href="https://bibleox.com/el/gr-lxx-byz/vtor/15/#L7-11">Δτ 15:7-11</a>)</p></blockquote><blockquote><p>«<strong>μὴ ἀπόσχῃ εὖ ποιεῖν ἐνδεῆ</strong>, ἡνίκα ἂν ἔχῃ ἡ χείρ σου βοηθεῖν· μὴ εἴπης Ἐπανελθὼν ἐπάνηκε καὶ αὔριον δώσω, δυνατοῦ σου ὄντος εὖ ποιεῖν· οὐ γὰρ οἶδας τί τέξεται ἡ ἐπιοῦσα.» (<a href="https://bibleox.com/el/gr-lxx-byz/pr/3/#L27-28">Πρμ 3:27-28</a>)</p></blockquote><blockquote><p>«<strong>Καὶ πτωχῷ ἔκτεινον τὴν χεῖρά σου</strong>, ἵνα τελειωθῇ ἡ εὐλογία σου. <strong>χάρις δόματος ἔναντι παντὸς ζῶντος</strong>, <strong>καὶ ἐπὶ νεκρῷ μὴ ἀποκωλύσῃς χάριν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/prsir/7/#L32-33">Σ.Σειρ 7:32-33</a>)</p></blockquote><blockquote><p>«ἀγαθὸν προσευχὴ μετὰ νηστείας καὶ ἐλεημοσύνης καὶ δικαιοσύνης· ἀγαθὸν τὸ ὀλίγον μετὰ δικαιοσύνης ἢ πολὺ μετὰ ἀδικίας· καλὸν ποιῆσαι ἐλεημοσύνην ἢ θησαυρίσαι χρυσίον. <strong>ἐλεημοσύνη γὰρ ἐκ θανάτου ῥύεται, καὶ αὐτὴ ἀποκαθαριεῖ πᾶσαν ἁμαρτίαν</strong>· οἱ ποιοῦντες ἐλεημοσύνας καὶ δικαιοσύνας πλησθήσονται ζωῆς·» (<a href="https://bibleox.com/el/gr-lxx-byz/tov/12/#L8-9">Τωβ 12:8-9</a>)</p></blockquote><blockquote><p>«<strong>πλὴν τὰ ἐνόντα δότε ἐλεημοσύνην</strong>, <strong>καὶ ἰδοὺ πάντα καθαρὰ ὑμῖν ἐστιν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/11/#L41">Λκ 11:41</a>)</p></blockquote><blockquote><p>«<strong>μακάριοι οἱ ἐλεήμονες, ὅτι αὐτοὶ ἐλεηθήσονται</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/5/#L7">Μτ 5:7</a>)</p></blockquote>
