    priority: 4
  update: true
  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <h2>Η σοφία στολίστηκε με την ομοφροσύνη των αδελφών και την ομόνοια</h2><blockquote><p>«<strong>Ἡ σοφία</strong> αἰνέσει ψυχὴν αὐτῆς καὶ ἐν μέσῳ λαοῦ αὐτῆς καυχήσεται· ἐν ἐκκλησίᾳ ὑψίστου στόμα αὐτῆς ἀνοίξει καὶ ἔναντι δυνάμεως αὐτοῦ καυχήσεται Ἐγὼ ἀπὸ στόματος ὑψίστου ἐξῆλθον καὶ ὡς ὁμίχλη κατεκάλυψα γῆν· &lt;…&gt; <strong>Ἐν τρισὶν ὡραίσθην</strong> καὶ ἀνέστην ὡραία ἔναντι κυρίου καὶ ἀνθρώπων· <strong><mark>ὁμόνοια</mark> ἀδελφῶν</strong>, καὶ <strong><mark>φιλία</mark> τῶν πλησίον</strong>, καὶ <strong>γυνὴ καὶ ἀνὴρ ἑαυτοῖς <mark>συμπεριφερόμενοι</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/prsir/24/#L1-3">Σ.Σειρ 24:1-3</a> · <a href="https://bibleox.com/el/gr-lxx-byz/prsir/25/#L1">Σ.Σειρ 25:1</a>)</p></blockquote><h2>Προσευχή για να δοθεί στην Εκκλησία ενότητα και ομοφροσύνη</h2><blockquote><p>«<strong><mark>ἵνα πάντες ἓν ὦσιν</mark></strong>, καθὼς σύ, πάτερ, ἐν ἐμοὶ κἀγὼ ἐν σοί, ἵνα καὶ αὐτοὶ ἐν ἡμῖν ὦσιν, <strong>ἵνα ὁ κόσμος πιστεύῃ</strong> ὅτι σύ με ἀπέστειλας. κἀγὼ τὴν δόξαν ἣν δέδωκάς μοι δέδωκα αὐτοῖς, <strong><mark>ἵνα ὦσιν ἓν καθὼς ἡμεῖς ἕν</mark></strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/in/17/#L21-22">Ιω 17:21-22</a>)</p></blockquote><blockquote><p>«ὁ δὲ θεὸς τῆς ὑπομονῆς καὶ τῆς παρακλήσεως δῴη ὑμῖν <strong>τὸ αὐτὸ <mark>φρονεῖν</mark></strong> ἐν ἀλλήλοις κατὰ Χριστὸν Ἰησοῦν» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/15/#L5">Ρωμ 15:5</a>)</p></blockquote><h2>Η εντολή να είμαστε ομόφρονες</h2><p>Τα δώρα του Θεού δεν δίνονται στον άνθρωπο παρά τη θέλησή του. Έτσι, για παράδειγμα, η αγάπη είναι δώρο του Θεού (<a href="https://bibleox.com/el/gr-lxx-byz/1in/4/#L7-8">Α Ιω 4:7-8</a> · <a href="https://bibleox.com/el/gr-lxx-byz/gal/5/#L22-23">Γαλ 5:22-23</a> · <a href="https://bibleox.com/el/gr-lxx-byz/rim/5/#L5">Ρωμ 5:5</a>), ωστόσο δεν επιβάλλεται στον άνθρωπο, και όταν έρθει, δεν μένει μέσα του ενάντια στη θέλησή του. Κάθε άνθρωπος πρέπει να κοπιάζει για να αποκτήσει την αγάπη (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/13/#L1-2,13">Α Κορ 13:1-2,13</a> · <a href="https://bibleox.com/el/gr-lxx-byz/kol/3/#L14">Κολ 3:14</a>) και να κλίνει τη θέλησή του προς τις πράξεις της αγάπης (<a href="https://bibleox.com/el/gr-lxx-byz/in/13/#L34">Ιω 13:34</a> · <a href="https://bibleox.com/el/gr-lxx-byz/in/15/#L12">Ιω 15:12</a> · <a href="https://bibleox.com/el/gr-lxx-byz/in/15/#L17">Ιω 15:17</a> · <a href="https://bibleox.com/el/gr-lxx-byz/1pet/1/#L22">Α Πε 1:22</a>), και ο Θεός απαντά σ’ αυτές τις προσπάθειες, χαρίζοντας και διαφυλάσσοντας το δώρο (<a href="https://bibleox.com/el/gr-lxx-byz/pr/21/#L31">Πρμ 21:31</a>).</p><p>Η ομοφροσύνη είναι επίσης από τον Θεό, γιατί ο Χριστός και οι απόστολοι προσευχήθηκαν γι’ αυτό στον Θεό (<a href="https://bibleox.com/el/gr-lxx-byz/in/17/#L21-22">Ιω 17:21-22</a> · <a href="https://bibleox.com/el/gr-lxx-byz/rim/15/#L5">Ρωμ 15:5</a>). Αν και στην Εκκλησία δόθηκε από το Άγιο Πνεύμα το δώρο της αγάπης και της ομοφροσύνης, ωστόσο ο καθένας στην Εκκλησία πρέπει με κόπο να αποκτά και να διαφυλάσσει αυτό το δώρο. Κάθε πιστός χωριστά μπορεί να αμαρτήσει και κατά της αγάπης και κατά της ομοφροσύνης. Γι’ αυτό και ο καθένας καλείται να τηρεί την αγάπη και την ομοφροσύνη:</p><blockquote><p>«<strong>τὸ αὐτὸ εἰς ἀλλήλους <mark>φρονοῦντες</mark></strong>, μὴ τὰ ὑψηλὰ φρονοῦντες ἀλλὰ <strong>τοῖς ταπεινοῖς συναπαγόμενοι</strong>. μὴ γίνεσθε φρόνιμοι παρ᾿ ἑαυτοῖς.» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/12/#L16">Ρωμ 12:16</a>)</p></blockquote><blockquote><p>«Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, διὰ τοῦ ὀνόματος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ἵνα <strong>τὸ αὐτὸ λέγητε πάντες</strong>, καὶ μὴ ᾖ ἐν ὑμῖν σχίσματα, ἦτε δὲ <strong>κατηρτισμένοι ἐν τῷ αὐτῷ νοῒ καὶ <mark>ἐν τῇ αὐτῇ γνώμῃ</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/1/#L10">Α Κορ 1:10</a>)</p></blockquote><blockquote><p>«Λοιπόν, ἀδελφοί, χαίρετε, καταρτίζεσθε, παρακαλεῖσθε, <strong>τὸ αὐτὸ <mark>φρονεῖτε</mark></strong>, εἰρηνεύετε, καὶ ὁ θεὸς τῆς ἀγάπης καὶ εἰρήνης ἔσται μεθ᾿ ὑμῶν.» (<a href="https://bibleox.com/el/gr-lxx-byz/2kor/13/#L11">Β Κορ 13:11</a>)</p></blockquote><blockquote><p>«πληρώσατέ μου τὴν χαρὰν ἵνα <strong><mark>τὸ αὐτὸ φρονῆτε</mark></strong>, τὴν αὐτὴν ἀγάπην ἔχοντες, <strong>σύμψυχοι, <mark>τὸ ἓν φρονοῦντες</mark></strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/fil/2/#L2">Φιλ 2:2</a>)</p></blockquote><blockquote><p>«Τὸ δὲ τέλος <strong>πάντες <mark>ὁμόφρονες</mark></strong>, συμπαθεῖς, φιλάδελφοι, εὔσπλαγχνοι, ταπεινόφρονες» (<a href="https://bibleox.com/el/gr-lxx-byz/1pet/3/#L8">Α Πε 3:8</a>)</p></blockquote><h2>Κριτική</h2><h3>Πρέπει να υπάρχουν αιρέσεις ανάμεσά σας</h3><blockquote><p>«δεῖ γὰρ καὶ <strong>αἱρέσεις</strong> ἐν ὑμῖν εἶναι, ἵνα [καὶ] οἱ δόκιμοι φανεροὶ γένωνται ἐν ὑμῖν.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/11/#L19">Α Κορ 11:19</a>)</p></blockquote><p>Στο πρωτότυπο υπάρχει η λέξη «αιρέσεις» (στη ρωσική συνοδική μετάφραση αποδίδεται «διχογνωμίες»), δηλαδή πρέπει να υπάρχουν αιρέσεις ανάμεσά σας. Είναι απλώς μια προφητεία για την εμφάνιση αιρέσεων. Όποιος πολλαπλασιάζει τις αιρέσεις, κατά τον λόγο του αποστόλου, δεν θα κληρονομήσει τη Βασιλεία του Θεού:</p><blockquote><p>«φανερὰ δέ ἐστιν τὰ ἔργα τῆς σαρκός, ἅτινά ἐστιν &lt;…&gt; <strong>αἱρέσεις</strong> &lt;…&gt; ἃ προλέγω ὑμῖν καθὼς προεῖπον ὅτι οἱ τὰ τοιαῦτα πράσσοντες <strong>βασιλείαν θεοῦ οὐ κληρονομήσουσιν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/gal/5/#L19-21">Γαλ 5:19-21</a>)</p></blockquote>
- src: благодарение
