    title: Η ακακία (το έλεος)
    priority: 6
  update: true
  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <blockquote><p>«<strong><mark>μὴ ἑαυτοὺς ἐκδικοῦντες, ἀγαπητοί</mark>, ἀλλὰ δότε τόπον τῇ ὀργῇ</strong>, γέγραπται γάρ, Ἐμοὶ ἐκδίκησις, ἐγὼ ἀνταποδώσω, λέγει κύριος.» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/12/#L19">Ρωμ 12:19</a>)</p></blockquote><blockquote><p>«<strong><mark>μὴ εἴπῃς Τείσομαι τὸν ἐχθρόν</mark>· ἀλλὰ ὑπόμεινον τὸν κύριον</strong>, ἵνα σοι βοηθήσῃ» (<a href="https://bibleox.com/el/gr-lxx-byz/pr/20/#L22">Πρμ 20:22</a>)</p></blockquote>
