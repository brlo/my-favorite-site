    <h2>Επίγραφο</h2><blockquote><p>«Ἄκουσον, λαός μου, καὶ λαλήσω σοι, Ισραηλ, καὶ διαμαρτύρομαί σοι· ὁ θεὸς ὁ θεός σού εἰμι ἐγώ.» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/49/#L7">Ψλ 49:7</a>)</p></blockquote><h2>Ο απόστολος στην κοινή σύναξη ονομάζει τον Χριστό Θεό. Ο Χριστός επικύρωσε την πίστη του (<a href="https://bibleox.com/el/gr-lxx-byz/in/20/#L28-29">Ιω 20:28-29</a>)</h2><p>Αυτό είναι το πιο αναμφισβήτητο χωρίο. Εδώ υπάρχει ό,τι είναι απαραίτητο για να πειστεί κανείς ότι ο απόστολος πιστεύει στον Χριστό ως αληθινό Θεό, και κανείς από τους παρόντες αποστόλους δεν του αντιλέγει, ακόμη και ο ίδιος ο Χριστός επικυρώνει αυτή την πίστη. Εδώ στη λέξη «θεὸς» (Θεός) υπάρχει μάλιστα και το άρθρο «ὁ» — δηλαδή εξαλείφονται όλες οι ενστάσεις των αντιπάλων της πίστης στον Χριστό ως Θεό. Αυτός ο στίχος επιτρέπει να δούμε ότι ο Χριστός ονομάζεται ακριβώς εκείνος ο ίδιος Θεός με την ύψιστη έννοια:</p><blockquote><p>«<strong>ἀπεκρίθη Θωμᾶς καὶ εἶπεν αὐτῷ, Ὁ κύριός μου καὶ ὁ θεός μου</strong>. λέγει αὐτῷ ὁ Ἰησοῦς, Ὅτι ἑώρακάς με <strong>πεπίστευκας</strong>; μακάριοι οἱ μὴ ἰδόντες καὶ πιστεύσαντες.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/20/#L28-29">Ιω 20:28-29</a>)</p></blockquote><blockquote><p>«ἀπεκρίθη Θωμᾶς καὶ εἶπεν αὐτῷ, Ὁ κύριός μου καὶ <strong><u>ὁ</u> θεός</strong> μου. λέγει αὐτῷ ὁ Ἰησοῦς, Ὅτι ἑώρακάς με πεπίστευκας; μακάριοι οἱ μὴ ἰδόντες καὶ πιστεύσαντες.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/20/#L28-29">Ιω 20:28-29</a>)</p></blockquote><p>Σε αυτό οι αντίπαλοι της διδασκαλίας για τη θεότητα του Χριστού αντιτείνουν μόνο με μια φράση που δεν πείθει, δηλαδή: «<em>Ο απόστολος απλώς συγκινήθηκε και αναφωνεί από θαυμασμό</em>». Αλλά αυτό αντιφάσκει με το γραμμένο, γιατί λέγεται ρητά ότι ο Θωμάς απευθύνει αυτά τα λόγια στον ίδιο τον Χριστό: «<strong>ἀπεκρίθη Θωμᾶς καὶ εἶπεν <u>αὐτῷ</u></strong>», δηλαδή η φράση «<strong>Ὁ κύριός μου καὶ ὁ θεός μου</strong>!» κατά το κείμενο είναι απευθείας προσφώνηση προς τον Χριστό.</p><p>Απευθυνόμενος στον Χριστό με αυτόν τον τρόπο, ο απόστολος δεν διορθώνεται από κανέναν, και ο ίδιος ο Χριστός επικύρωσε την πίστη του, λέγοντας: «<em>πεπίστευκας</em>». Είναι σαφές ότι πίστεψε στην ανάσταση του Χριστού, αλλά αποκτώντας αυτή την πίστη δείχνει αμέσως ποια πίστη ακριβώς απέκτησε: πίστη στον Χριστό ως Θεό. Εδώ τηρούνται όλες οι γραμματικές απαιτήσεις των κριτικών: τη φράση την προφέρει ο απόστολος, παρουσία του Χριστού και των αποστόλων, κανείς δεν αντιλέγει, και ο Χριστός επιπλέον την επικυρώνει. Αν αυτό δεν πείθει τους απίστους, τότε τι θα μπορούσε ποτέ να τους πείσει;</p><h2>Ο Χριστός είναι ο Ων επί πάντων Θεός (<a href="https://bibleox.com/el/gr-lxx-byz/rim/9/#L3-5">Ρωμ 9:3-5</a>)</h2><p>Ο απόστολος ονομάζει τον Χριστό Θεό με την ύψιστη έννοια:</p><blockquote><p>«ὁ <strong>Χριστὸς</strong> τὸ κατὰ σάρκα· ὁ ὢν ἐπὶ πάντων <strong>θεὸς</strong> εὐλογητὸς εἰς τοὺς αἰῶνας, ἀμήν.» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/9/#L3-5">Ρωμ 9:3-5</a>)</p></blockquote><blockquote><p>«ὧν οἱ πατέρες, καὶ ἐξ ὧν ὁ <strong>Χριστὸς</strong> τὸ κατὰ σάρκα· <strong><u>ὁ</u></strong> ὢν ἐπὶ πάντων <strong>θεὸς</strong> εὐλογητὸς εἰς τοὺς αἰῶνας, ἀμήν.» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/9/#L5">Ρωμ 9:5</a>)</p></blockquote><p>Οι αντίπαλοι της πίστης στον Χριστό ως Θεό αντιτείνουν ότι στη λέξη «θεὸς» (Θεός) λείπει το άρθρο, και επομένως δήθεν ο Χριστός εδώ ονομάζεται Θεός όχι με την ύψιστη έννοια (δήθεν δεν είναι δική του ιδιότητα), ή ότι η λέξη Θεός δεν αναφέρεται καθόλου στον Χριστό.</p><p>Γι' αυτό υπάρχουν διάφορες απόψεις. Υπάρχουν λόγοι να θεωρήσουμε αρκετό το κοινό οριστικό άρθρο που βρίσκεται μπροστά σε όλα τα χαρακτηριστικά που προσδιορίζουν ένα πρόσωπο: «<strong><em><u>ὁ</u></em></strong><em> ὢν ἐπὶ πάντων θεὸς»</em><strong><em> </em></strong>(δηλαδή, Αυτός που είναι πάνω από όλα, Θεός). Εξάλλου, τη σχέση με τον Χριστό της λέξης «Θεός» με άρθρο την αναφέραμε ήδη στην αρχή (<a href="https://bibleox.com/el/gr-lxx-byz/in/20/#L28-29">Ιω 20:28-29</a>). Αν εδώ λείπει το άρθρο, τότε τι λείπει εκεί για να πιστέψουμε;</p><h2>Ο Χριστός είναι ο αληθινός Θεός (<a href="https://bibleox.com/el/gr-lxx-byz/1in/5/#L20">Α Ιω 5:20</a>)</h2><blockquote><p>«οἴδαμεν δὲ ὅτι ὁ υἱὸς τοῦ θεοῦ ἥκει, καὶ δέδωκεν ἡμῖν διάνοιαν ἵνα γινώσκομεν τὸν ἀληθινόν· καὶ ἐσμὲν ἐν τῷ ἀληθινῷ, ἐν τῷ υἱῷ αὐτοῦ <strong>Ἰησοῦ Χριστῷ. οὗτός ἐστιν ὁ ἀληθινὸς θεὸς</strong> καὶ ζωὴ αἰώνιος.» (<a href="https://bibleox.com/el/gr-lxx-byz/1in/5/#L20">Α Ιω 5:20</a>)</p></blockquote><blockquote><p>«οἴδαμεν δὲ ὅτι ὁ υἱὸς τοῦ θεοῦ ἥκει, καὶ δέδωκεν ἡμῖν διάνοιαν ἵνα γινώσκομεν τὸν ἀληθινόν· καὶ ἐσμὲν ἐν τῷ ἀληθινῷ, ἐν τῷ υἱῷ αὐτοῦ <strong>Ἰησοῦ Χριστῷ</strong>. <strong>οὗτός ἐστιν ὁ ἀληθινὸς θεὸς</strong> καὶ ζωὴ αἰώνιος.» (<a href="https://bibleox.com/el/gr-lxx-byz/1in/5/#L20">Α Ιω 5:20</a>)</p></blockquote><p>Όταν ο απόστολος Ιωάννης γράφει «οὗτός ἐστιν» (Αυτός είναι), πίσω από αυτή την αντωνυμία βρίσκεται το όνομα Ιησούς Χριστός (Ἰησοῦ Χριστῷ) από την αμέσως προηγούμενη φράση. Αυτή είναι η πλησιέστερη αναφορά. Η παρουσία του άρθρου «ὁ» μπροστά στο «θεὸς» υπογραμμίζει ότι πρόκειται για ορισμένο χαρακτηριστικό του προσώπου για το οποίο μόλις μιλούσαμε, δηλαδή χαρακτηριστικό του Ιησού Χριστού. Γραμματικά και λογικά εδώ λέγεται: «Αυτός [ο Ιησούς Χριστός] είναι ο αληθινός Θεός και ζωή αιώνιος».</p><h2>Ο Χριστός Θεός απέκτησε την Εκκλησία με το αίμα Του (<a href="https://bibleox.com/el/gr-lxx-byz/act/20/#L28">Πραξ 20:28</a>)</h2><p>Αυτός ο στίχος δείχνει τη θεότητα του Χριστού, αφού Θεός εδώ ονομάζεται εκείνος που απέκτησε την Εκκλησία με το δικό του αίμα. Η θεία φύση δεν έχει αίμα. Αίμα έχει μόνο ο ενσαρκωμένος Υιός. Ακριβώς ο Υιός εδώ ονομάζεται Θεός, που απέκτησε την Εκκλησία με <u>δικό του</u> αίμα:</p><blockquote><p>«προσέχετε ἑαυτοῖς καὶ παντὶ τῷ ποιμνίῳ, ἐν ᾧ ὑμᾶς τὸ πνεῦμα τὸ ἅγιον ἔθετο ἐπισκόπους, ποιμαίνειν <strong>τὴν ἐκκλησίαν τοῦ θεοῦ</strong>, ἣν περιεποιήσατο διὰ <strong>τοῦ αἵματος τοῦ <u>ἰδίου</u></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/20/#L28">Πραξ 20:28</a>)</p></blockquote><blockquote><p>«προσέχετε ἑαυτοῖς καὶ παντὶ τῷ ποιμνίῳ, ἐν ᾧ ὑμᾶς τὸ πνεῦμα τὸ ἅγιον ἔθετο ἐπισκόπους, ποιμαίνειν <strong>τὴν ἐκκλησίαν τοῦ θεοῦ</strong>, ἣν περιεποιήσατο διὰ <strong>τοῦ αἵματος τοῦ <u>ἰδίου</u></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/20/#L28">Πραξ 20:28</a>)</p></blockquote><h2>Ο Θεός, που πριν ήταν αόρατος σε όλους, φανερώθηκε εν σαρκί, έδειξε τον εαυτό Του (<a href="https://bibleox.com/el/gr-lxx-byz/1tim/3/#L15-16">Α Τιμ 3:15-16</a>)</h2><p>Η φράση «Θεός φανερώθηκε εν σαρκί» δίνεται έτσι στη ρωσική συνοδική μετάφραση, αλλά στο ελληνικό κείμενο εδώ δεν υπάρχει η λέξη «Θεός»· αντ' αυτής βρίσκεται η αντωνυμία «Ὃς» (ο οποίος). Αλλά αυτή η αντωνυμία αναφέρεται στον Θεό, γιατί αμέσως πριν ο λόγος ήταν για τον Θεό: «<em>πῶς δεῖ </em><strong><em>ἐν οἴκῳ θεοῦ</em></strong><em> ἀναστρέφεσθαι, ἥτις ἐστὶν </em><strong><em>ἐκκλησία θεοῦ ζῶντος</em></strong>». Και στη συνέχεια γίνεται σαφές ότι ως Θεός εδώ ονομάζεται ακριβώς ο Ιησούς Χριστός, αφού δεν είναι ο Πατέρας αλλά ο Υιός, δηλαδή ο Ιησούς Χριστός «<em>ἐφανερώθη ἐν σαρκί</em>» και έτσι «<em>ὤφθη ἀγγέλοις</em>» (ο Πατέρας ως Θεός παραμένει αόρατος) και ο Υιός ανελήφθη (στους ουρανούς) εν δόξη:</p><blockquote><p>«ἐὰν δὲ βραδύνω, ἵνα εἰδῇς πῶς δεῖ <strong>ἐν οἴκῳ θεοῦ</strong> ἀναστρέφεσθαι, ἥτις ἐστὶν <strong>ἐκκλησία θεοῦ ζῶντος</strong>, στῦλος καὶ ἑδραίωμα τῆς ἀληθείας. καὶ ὁμολογουμένως μέγα ἐστὶν τὸ τῆς εὐσεβείας μυστήριον· <strong>Ὃς ἐφανερώθη ἐν σαρκί</strong>, ἐδικαιώθη ἐν πνεύματι, <strong>ὤφθη ἀγγέλοις</strong>, ἐκηρύχθη ἐν ἔθνεσιν, ἐπιστεύθη ἐν κόσμῳ, <strong>ἀνελήμφθη ἐν δόξῃ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1tim/3/#L15-16">Α Τιμ 3:15-16</a>)</p></blockquote><blockquote><p>«ἐὰν δὲ βραδύνω, ἵνα εἰδῇς πῶς δεῖ ἐν οἴκῳ θεοῦ ἀναστρέφεσθαι, ἥτις ἐστὶν ἐκκλησία θεοῦ ζῶντος, στῦλος καὶ ἑδραίωμα τῆς ἀληθείας. καὶ ὁμολογουμένως μέγα ἐστὶν τὸ τῆς εὐσεβείας μυστήριον· <strong>Ὃς ἐφανερώθη ἐν σαρκί</strong>, ἐδικαιώθη ἐν πνεύματι, <strong>ὤφθη ἀγγέλοις</strong>, ἐκηρύχθη ἐν ἔθνεσιν, ἐπιστεύθη ἐν κόσμῳ, <strong>ἀνελήμφθη ἐν δόξῃ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1tim/3/#L15-16">Α Τιμ 3:15-16</a>)</p></blockquote><h2>Ο Θεός και ο Κύριος Ιησούς Χριστός (<a href="https://bibleox.com/el/gr-lxx-byz/2tim/4/#L1">Β Τιμ 4:1</a>, <a href="https://bibleox.com/el/gr-lxx-byz/2pet/1/#L1">Β Πε 1:1</a>)</h2><p>Σε αυτόν τον στίχο ο Ιησούς ονομάζεται Θεός και Χριστός (η λέξη «Χριστός» μεταφράζεται από τα ελληνικά ως «χρισμένος», είναι τίτλος (<a href="https://bibleox.com/el/gr-lxx-byz/act/2/#L36">Πραξ 2:36</a>) του αναμενόμενου σωτήρα του κόσμου). Στο συνοδικό κείμενο δίνεται η φράση: «<em>ενώπιον του Θεού και του Κυρίου μας Ιησού Χριστού</em>», αλλά στα ελληνικά είναι γραμμένο λίγο διαφορετικά, κατά λέξη: «ενώπιον του Θεού και Χριστού Ιησού» (τοῦ θεοῦ καὶ Χριστοῦ Ἰησοῦ).</p><p>Εδώ μπορεί να αντιτείνει κανείς ότι γίνεται λόγος για δύο: για τον Θεό και για τον Ιησού Χριστό. Αυτή η ένσταση δεν είναι βάσιμη, αφού και οι δύο λέξεις έχουν ένα άρθρο «τοῦ» (οριστικό άρθρο στη γενική πτώση), δηλαδή και οι δύο λέξεις αναφέρονται στο ίδιο προσδιοριζόμενο πρόσωπο — τον Ιησού. Επιπλέον, στη συνέχεια η λέξη «τοῦ μέλλοντος» (εκείνου που πρόκειται) βρίσκεται στον ενικό, γεγονός που δείχνει επιπλέον ότι προηγουμένως ο λόγος ήταν για ένα πρόσωπο:</p><blockquote><p>«Διαμαρτύρομαι ἐνώπιον τοῦ <strong>θεοῦ</strong> καὶ <strong>Χριστοῦ Ἰησοῦ</strong>, τοῦ μέλλοντος κρίνειν ζῶντας καὶ νεκρούς, καὶ τὴν ἐπιφάνειαν αὐτοῦ καὶ τὴν βασιλείαν αὐτοῦ·» (<a href="https://bibleox.com/el/gr-lxx-byz/2tim/4/#L1">Β Τιμ 4:1</a>)</p></blockquote><blockquote><p>«Διαμαρτύρομαι ἐνώπιον <strong><u>τοῦ</u> θεοῦ <u>καὶ</u> Χριστοῦ Ἰησοῦ</strong>, τοῦ μέλλοντος κρίνειν ζῶντας καὶ νεκρούς, καὶ τὴν ἐπιφάνειαν αὐτοῦ καὶ τὴν βασιλείαν αὐτοῦ·» (<a href="https://bibleox.com/el/gr-lxx-byz/2tim/4/#L1">Β Τιμ 4:1</a>)</p></blockquote><p>Ιδού μια ανάλογη γραμματική κατασκευή με ένα κοινό άρθρο:</p><blockquote><p>«Εὐλογητὸς <strong>ὁ θεὸς καὶ πατὴρ</strong> τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὁ κατὰ τὸ πολὺ αὐτοῦ ἔλεος ἀναγεννήσας ἡμᾶς εἰς ἐλπίδα ζῶσαν δι᾿ ἀναστάσεως Ἰησοῦ Χριστοῦ ἐκ νεκρῶν,» (<a href="https://bibleox.com/el/gr-lxx-byz/1pet/1/#L3">Α Πε 1:3</a>)</p></blockquote><blockquote><p>«Εὐλογητὸς <strong><u>ὁ</u> θεὸς <u>καὶ</u> πατὴρ</strong> τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὁ κατὰ τὸ πολὺ αὐτοῦ ἔλεος ἀναγεννήσας ἡμᾶς εἰς ἐλπίδα ζῶσαν δι᾿ ἀναστάσεως Ἰησοῦ Χριστοῦ ἐκ νεκρῶν,» (<a href="https://bibleox.com/el/gr-lxx-byz/1pet/1/#L3">Α Πε 1:3</a>)</p></blockquote><p>Εδώ οι δύο λέξεις «Θεός και Πατέρας» έχουν ένα κοινό άρθρο «ὁ» (οριστικό άρθρο στην ονομαστική), γι' αυτό και οι δύο λέξεις αποτελούν περιγραφή ενός προσώπου και όχι δύο διαφορετικών.</p><p>Στον ίδιο κανόνα υπακούει και η εξής κατασκευή, στην οποία ο Χριστός ονομάζεται Θεός:</p><blockquote><p>«Συμεὼν Πέτρος δοῦλος καὶ ἀπόστολος Ἰησοῦ Χριστοῦ τοῖς ἰσότιμον ἡμῖν λαχοῦσιν πίστιν ἐν δικαιοσύνῃ <strong>τοῦ θεοῦ</strong> ἡμῶν <strong>καὶ σωτῆρος Ἰησοῦ</strong> <strong>Χριστοῦ</strong>·» (<a href="https://bibleox.com/el/gr-lxx-byz/2pet/1/#L1">Β Πε 1:1</a>)</p></blockquote><blockquote><p>«Συμεὼν Πέτρος δοῦλος καὶ ἀπόστολος Ἰησοῦ Χριστοῦ τοῖς ἰσότιμον ἡμῖν λαχοῦσιν πίστιν ἐν δικαιοσύνῃ <strong><u>τοῦ</u> θεοῦ</strong> ἡμῶν <strong>καὶ σωτῆρος Ἰησοῦ</strong> <strong>Χριστοῦ</strong>·» (<a href="https://bibleox.com/el/gr-lxx-byz/2pet/1/#L1">Β Πε 1:1</a>)</p></blockquote><h2>Ο ευαγγελιστής Λουκάς ονομάζει τον Χριστό Θεό (<a href="https://bibleox.com/el/gr-lxx-byz/lk/8/#L39">Λκ 8:39</a>)</h2><p>Ας εξετάσουμε τον στίχο που κατέγραψε ο ευαγγελιστής Λουκάς. Το πρώτο μέρος της περικοπής είναι τα λόγια του Ιησού Χριστού, και το δεύτερο τα λόγια του αφηγητή, δηλαδή του ευαγγελιστή Λουκά. Ο Χριστός στέλνει τον θεραπευμένο άνθρωπο να κηρύξει ό,τι του έκανε ο Θεός, και ο ευαγγελιστής Λουκάς καταγράφει ότι ο θεραπευμένος κήρυξε ό,τι του έκανε ο Ιησούς. Δηλαδή, κατά την αντίληψη του ευαγγελιστή Λουκά, ο Ιησούς και ο Θεός σε αυτή την περίπτωση είναι το ίδιο:</p><blockquote><p>«Ὑπόστρεφε εἰς τὸν οἶκόν σου, καὶ διηγοῦ ὅσα σοι <strong>ἐποίησεν</strong> <strong>ὁ θεός</strong>. καὶ ἀπῆλθεν καθ᾿ ὅλην τὴν πόλιν κηρύσσων ὅσα <strong>ἐποίησεν</strong> αὐτῷ <strong>ὁ Ἰησοῦς</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/8/#L39">Λκ 8:39</a>)</p></blockquote><blockquote><p>«Ὑπόστρεφε εἰς τὸν οἶκόν σου, καὶ διηγοῦ ὅσα σοι <strong>ἐποίησεν</strong> <strong>ὁ θεός</strong>. καὶ ἀπῆλθεν καθ᾿ ὅλην τὴν πόλιν κηρύσσων ὅσα <strong>ἐποίησεν</strong> αὐτῷ <strong>ὁ Ἰησοῦς</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/8/#L39">Λκ 8:39</a>)</p></blockquote><p>Αν οι αντίπαλοι της πίστης στον Χριστό ως Θεό αντιτείνουν ότι ο ευαγγελιστής Λουκάς απλώς περιέγραψε τις πράξεις του θεραπευμένου, δηλαδή ότι ο Ιησούς τον διατάσσει να κηρύξει ό,τι έκανε ο Θεός, αλλά ο θεραπευμένος τον κατάλαβε λάθος και αντί να διηγηθεί ό,τι έκανε ο Θεός άρχισε να διηγείται ό,τι έκανε ο Ιησούς. Αλλά εδώ πρέπει να κατανοήσουμε ότι οι αντίπαλοι της πίστης στον Χριστό ως Θεό θεωρούν και τον ευαγγελιστή Λουκά αντίπαλο της θεότητας του Χριστού, δηλαδή ότι ούτε ο ευαγγελιστής Λουκάς δεν θεωρούσε τον Χριστό Θεό. Σε αυτή την περίπτωση, ο ευαγγελιστής οπωσδήποτε θα είχε επισημάνει με κάποιο τρόπο το λάθος του θεραπευμένου, ότι δήθεν έκανε κάτι εντελώς διαφορετικό από αυτό που του είπε να κάνει ο Ιησούς. Αυτό θα εκφραζόταν τουλάχιστον με τη χρήση αντίθεσης με τους συνδέσμους «αλλά» ή «όμως»: «<em>Ο Ιησούς είπε να επιστρέψει και να διηγηθεί ό,τι έκανε ο Θεός, </em><strong><em><u>αλλά/όμως</u></em></strong><em> αυτός πήγε και κήρυξε ό,τι έκανε ο Ιησούς</em>», και ακόμη πιθανότερα θα έλεγε ευθέως ότι ο θεραπευμένος λανθασμένα θεώρησε τον Ιησού Θεό και γι' αυτό κήρυττε όχι για τον Θεό αλλά για τον Ιησού. Αυτό δεν είναι λεπτομέρεια, αλλά θεμέλιο της πίστης.</p><p>Αλλά ο ευαγγελιστής δεν κάνει καμία αντίθεση. Χρησιμοποιεί επανάληψη με τις ίδιες κατασκευές: «ό,τι έκανε ο Θεός… ό,τι έκανε ο Ιησούς». Αυτό είναι μια σημαντική ένδειξη για την πίστη του ευαγγελιστή στη θεότητα του Χριστού.</p><h2>Στον Χριστό κατοικεί όλο το πλήρωμα της Θεότητας (<a href="https://bibleox.com/el/gr-lxx-byz/kol/2/#L6,9">Κολ 2:6,9</a>)</h2><p>Αυτός ο στίχος, βέβαια, μπορεί να ερμηνευθεί ποικιλοτρόπως, αλλά αξίζει προσοχής ως συμπλήρωμα στα υπόλοιπα:</p><blockquote><p>«Ὡς οὖν παρελάβετε τὸν Χριστὸν Ἰησοῦν τὸν κύριον, ἐν αὐτῷ περιπατεῖτε, &lt;…&gt; ὅτι ἐν αὐτῷ κατοικεῖ <strong>πᾶν</strong> <strong>τὸ πλήρωμα τῆς θεότητος σωματικῶς</strong>,» (<a href="https://bibleox.com/el/gr-lxx-byz/kol/2/#L6,9">Κολ 2:6,9</a>)</p></blockquote><blockquote><p>«Ὡς οὖν παρελάβετε τὸν Χριστὸν Ἰησοῦν τὸν κύριον, ἐν αὐτῷ περιπατεῖτε, &lt;…&gt; ὅτι ἐν αὐτῷ κατοικεῖ πᾶν <strong>τὸ πλήρωμα τῆς θεότητος σωματικῶς</strong>,» (<a href="https://bibleox.com/el/gr-lxx-byz/kol/2/#L6,9">Κολ 2:6,9</a>)</p></blockquote><h2>Οι απόστολοι κηρύττουν τον Χριστό ως Θεό στους ανθρώπους (<a href="https://bibleox.com/el/gr-lxx-byz/act/17/#L3,23">Πραξ 17:3,23</a>)</h2><blockquote><p>«τὸν Χριστὸν ἔδει παθεῖν καὶ ἀναστῆναι ἐκ νεκρῶν, καὶ ὅτι οὗτός ἐστιν ὁ Χριστός, [ὁ] <strong><mark>Ἰησοῦς, ὃν ἐγὼ καταγγέλλω ὑμῖν</mark></strong>. &lt;…&gt; διερχόμενος γὰρ καὶ ἀναθεωρῶν τὰ σεβάσματα ὑμῶν εὗρον καὶ <strong>βωμὸν</strong> ἐν ᾧ ἐπεγέγραπτο, <strong>Ἀγνώστῳ <mark>θεῷ</mark></strong>. <strong>ὃ οὖν</strong> ἀγνοοῦντες εὐσεβεῖτε, τοῦτο <strong><mark>ἐγὼ καταγγέλλω ὑμῖν</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/17/#L3,23">Πραξ 17:3,23</a>)</p></blockquote><h2>Ο Θεός σαρκώθηκε (<a href="https://bibleox.com/el/gr-lxx-byz/in/1/#L1-18">Ιω 1:1-18</a>)</h2><p>Ο απόστολος Ιωάννης ονομάζει τον Λόγο Θεό και στη συνέχεια δηλώνει ότι ο Λόγος σαρκώθηκε. Ακριβώς στον σαρκωμένο Λόγο έδειξε ο προφήτης Ιωάννης ο Βαπτιστής, και έδειχνε στον Ιησού Χριστό:</p><blockquote><p>«Ἐν ἀρχῇ ἦν ὁ λόγος, καὶ ὁ λόγος ἦν πρὸς τὸν θεόν, καὶ <strong>θεὸς ἦν ὁ λόγος</strong>. οὗτος ἦν ἐν ἀρχῇ πρὸς τὸν θεόν. πάντα δι᾿ αὐτοῦ ἐγένετο, καὶ χωρὶς αὐτοῦ ἐγένετο οὐδὲ ἕν. ὃ γέγονεν ἐν αὐτῷ ζωὴ ἦν, καὶ ἡ ζωὴ ἦν τὸ φῶς τῶν ἀνθρώπων· καὶ τὸ φῶς ἐν τῇ σκοτίᾳ φαίνει, καὶ ἡ σκοτία αὐτὸ οὐ κατέλαβεν. Ἐγένετο ἄνθρωπος ἀπεσταλμένος παρὰ θεοῦ, ὄνομα αὐτῷ Ἰωάννης· οὗτος ἦλθεν εἰς μαρτυρίαν, ἵνα μαρτυρήσῃ περὶ τοῦ φωτός, ἵνα πάντες πιστεύσωσιν δι᾿ αὐτοῦ. οὐκ ἦν ἐκεῖνος τὸ φῶς, ἀλλ᾿ ἵνα μαρτυρήσῃ περὶ τοῦ φωτός. Ἦν τὸ φῶς τὸ ἀληθινόν, ὃ φωτίζει πάντα ἄνθρωπον, ἐρχόμενον εἰς τὸν κόσμον. ἐν τῷ κόσμῳ ἦν, καὶ ὁ κόσμος δι᾿ αὐτοῦ ἐγένετο, καὶ ὁ κόσμος αὐτὸν οὐκ ἔγνω. εἰς τὰ ἴδια ἦλθεν, καὶ οἱ ἴδιοι αὐτὸν οὐ παρέλαβον. ὅσοι δὲ ἔλαβον αὐτόν, ἔδωκεν αὐτοῖς ἐξουσίαν τέκνα θεοῦ γενέσθαι, τοῖς πιστεύουσιν εἰς τὸ ὄνομα αὐτοῦ, οἳ οὐκ ἐξ αἱμάτων οὐδὲ ἐκ θελήματος σαρκὸς οὐδὲ ἐκ θελήματος ἀνδρὸς ἀλλ᾿ ἐκ θεοῦ ἐγεννήθησαν. Καὶ ὁ <strong>λόγος σὰρξ ἐγένετο</strong> καὶ ἐσκήνωσεν ἐν ἡμῖν, καὶ ἐθεασάμεθα τὴν δόξαν αὐτοῦ, δόξαν ὡς μονογενοῦς παρὰ πατρός, πλήρης χάριτος καὶ ἀληθείας. Ἰωάννης μαρτυρεῖ περὶ αὐτοῦ καὶ κέκραγεν λέγων, Οὗτος ἦν ὃν εἶπον, Ὁ ὀπίσω μου ἐρχόμενος ἔμπροσθέν μου γέγονεν, ὅτι πρῶτός μου ἦν. ὅτι ἐκ τοῦ πληρώματος αὐτοῦ ἡμεῖς πάντες ἐλάβομεν, καὶ χάριν ἀντὶ χάριτος· ὅτι ὁ νόμος διὰ Μωϋσέως ἐδόθη, ἡ χάρις καὶ ἡ ἀλήθεια διὰ Ἰησοῦ Χριστοῦ ἐγένετο. θεὸν οὐδεὶς ἑώρακεν πώποτε· μονογενὴς θεὸς ὁ ὢν εἰς τὸν κόλπον τοῦ πατρὸς ἐκεῖνος ἐξηγήσατο.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/1/#L1-18">Ιω 1:1-18</a>)</p></blockquote><p>Ο απόστολος εδώ ονομάζει τον Χριστό όχι απλώς Υιό του Πατέρα, αλλά Μονογενή Υιό, που σημαίνει: κανείς άλλος δεν είναι υιός του Πατέρα όπως ο Χριστός. Όχι πρωτότοκος (αυτός που γεννήθηκε πρώτος), αλλά μονογενής (ο μοναδικός υιός). Άλλος Υιός δεν υπάρχει.</p><p>Οι αντίπαλοι της διδασκαλίας για τον Χριστό ως Θεό θα αντιτείνουν ότι σε δύο άλλα χωρία ο Χριστός ονομάζεται και πρωτότοκος:</p><blockquote><p><em>«ὅτι οὓς προέγνω, καὶ προώρισεν συμμόρφους τῆς εἰκόνος τοῦ υἱοῦ αὐτοῦ, εἰς τὸ εἶναι αὐτὸν </em><strong><em>πρωτότοκον ἐν πολλοῖς ἀδελφοῖς</em></strong><em>·» (</em><a href="https://bibleox.com/el/gr-lxx-byz/rim/8/#L29"><em>Ρωμ 8:29</em></a><em>)</em></p></blockquote><blockquote><p><em>«ὅταν δὲ πάλιν εἰσαγάγῃ τὸν </em><strong><em>πρωτότοκον</em></strong><em> εἰς τὴν οἰκουμένην, λέγει, Καὶ προσκυνησάτωσαν αὐτῷ πάντες ἄγγελοι θεοῦ.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/evr/1/#L6"><em>Εβρ 1:6</em></a><em>)</em></p></blockquote><p>Σε αυτό πρέπει να ειπωθεί ότι πρωτότοκος ονομάζεται επειδή αναστήθηκε πρώτος από τους νεκρούς: δεν αναστήθηκε για να πεθάνει ξανά (έτσι ανάσταιναν και οι προφήτες παλαιότερα), αλλά αναστήθηκε μεταμορφωμένος ως νικητής του θανάτου (<a href="https://bibleox.com/el/gr-lxx-byz/rim/6/#L9">Ρωμ 6:9</a>), για να ζήσει αιώνια, και αναλήφθηκε στον ουρανό με δόξα, για να βασιλεύει αιώνια — έτσι κανείς πριν από τον Χριστό δεν είχε αναστηθεί. Αυτός αναστήθηκε πρώτος έτσι, δηλαδή φανερώθηκε ως πρωτότοκος ή ως πρώτος από τους νεκρούς:</p><blockquote><p><em>«καὶ αὐτός ἐστιν ἡ κεφαλὴ τοῦ σώματος, τῆς ἐκκλησίας· ὅς ἐστιν ἀρχή, </em><strong><em>πρωτότοκος ἐκ τῶν νεκρῶν</em></strong><em>, ἵνα γένηται ἐν πᾶσιν αὐτὸς πρωτεύων,» (</em><a href="https://bibleox.com/el/gr-lxx-byz/kol/1/#L18"><em>Κολ 1:18</em></a><em>)</em></p></blockquote><blockquote><p><em>«καὶ ἀπὸ Ἰησοῦ Χριστοῦ, ὁ μάρτυς ὁ πιστός, ὁ </em><strong><em>πρωτότοκος τῶν νεκρῶν</em></strong><em> καὶ ὁ ἄρχων τῶν βασιλέων τῆς γῆς. Τῷ ἀγαπῶντι ἡμᾶς καὶ λύσαντι ἡμᾶς ἐκ τῶν ἁμαρτιῶν ἡμῶν ἐν τῷ αἵματι αὐτοῦ —» (</em><a href="https://bibleox.com/el/gr-lxx-byz/otkr/1/#L5"><em>Απ 1:5</em></a><em>)</em></p></blockquote><blockquote><p><em>«εἰ παθητὸς ὁ Χριστός, εἰ </em><strong><em>πρῶτος ἐξ ἀναστάσεως νεκρῶν</em></strong><em> φῶς μέλλει καταγγέλλειν τῷ τε λαῷ καὶ τοῖς ἔθνεσιν.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/act/26/#L23"><em>Πραξ 26:23</em></a><em>)</em></p></blockquote><p>Λοιπές ρήσεις: «Ο Χριστός είναι ο Μονογενής Υιός»</p><h2>Ό,τι λέγεται στους ψαλμούς για τον Θεό, λέγεται για τον Υιό (<a href="https://bibleox.com/el/gr-lxx-byz/evr/1/#L8-12">Εβρ 1:8-12</a>)</h2><p>Ο απόστολος Παύλος εφαρμόζει τους προφητικούς ψαλμούς στον Χριστό. Λέει ότι ειπώθηκαν για τον Υιό:</p><ol><li><p>Ο Υιός είναι Θεός.</p></li><li><p>Ο Υιός θεμελίωσε τον ουρανό και τη γη.</p></li><li><p>Τον Υιό, τον Θεό, τον έχρισε ο Θεός (ελλ. Χριστός — χρισμένος).</p></li></ol><blockquote><p>«<strong>πρὸς δὲ τὸν υἱόν</strong>, Ὁ θρόνος σου, <strong>ὁ θεός</strong>, εἰς τὸν αἰῶνα τοῦ αἰῶνος, καὶ ἡ ῥάβδος τῆς εὐθύτητος ῥάβδος τῆς βασι λείας σου. ἠγάπησας δικαιοσύνην καὶ ἐμίσησας ἀνομίαν· διὰ τοῦτο <strong>ἔχρισέν σε ὁ θεός</strong>, <strong>ὁ θεός σου</strong>, ἔλαιον ἀγαλλιάσεως παρὰ τοὺς μετόχους σου· καί, <strong>Σὺ κατ᾿ ἀρχάς, κύριε, τὴν γῆν ἐθεμελίωσας, καὶ ἔργα τῶν χειρῶν σού εἰσιν οἱ οὐρανοί</strong>· αὐτοὶ ἀπολοῦνται, σὺ δὲ διαμένεις· καὶ πάντες ὡς ἱμάτιον παλαιωθήσονται, καὶ ὡσεὶ περιβόλαιον ἑλίξεις αὐτούς, ὡς ἱμάτιον καὶ ἀλλαγήσονται· σὺ δὲ ὁ αὐτὸς εἶ καὶ τὰ ἔτη σου οὐκ ἐκλείψουσιν.» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/1/#L8-12">Εβρ 1:8-12</a> · <a href="https://bibleox.com/el/gr-lxx-byz/ps/44/#L6-7">Ψλ 44:6-7</a>)</p></blockquote><p>Οι αντίπαλοι της πίστης στον Χριστό ως Θεό θα αντιτείνουν σε αυτό ότι ο Θεός εδώ ονομάζεται απλώς με την κοινή εβραϊκή λέξη Elohim, η οποία εφαρμοζόταν σε διάφορους θεούς: και στον αληθινό Θεό και στους ψευδείς. Θα περίμεναν να δηλώνεται ο Θεός με το τετραγράμματο, δηλαδή με τα τέσσερα εβραϊκά γράμματα <strong>יְהוָֽה (YHWH, διαβάζεται Γιαχβέ)</strong>. Ο δεύτερος ψαλμός που παραθέτει ο απόστολος (Ψλ 101:25-27) ικανοποιεί τις απαιτήσεις τους. Ολόκληρος αυτός ο ψαλμός είναι απεύθυνση <strong>προς τον Θεό (יְהוָֽה, YHWH)</strong>, ο οποίος ονομάζεται με το όνομα <strong>יְהוָֽה</strong> στους στίχους 21 και 22. Ο ίδιος ο ψαλμός φέρει τον τίτλο: «<em>προσευχή του πάσχοντος, όταν αποθαρρύνεται και εκχέει μπροστά στον Γιαχβέ (יְ֝הוָ֗ה, YHWH) τη λύπη του</em>». Έτσι, ολόκληρος αυτός ο ψαλμός, μαζί με τους στίχους που παραθέτει ο απόστολος, είναι προσευχή προς τον Θεό, και ο Θεός ονομάζεται σε αυτόν όπως περίμεναν — Γιαχβέ. Ο απόστολος όμως λέει ότι αυτό ειπώθηκε για τον Υιό, δηλαδή ο Γιαχβέ είναι ο Υιός, ο Ιησούς Χριστός.</p><h2>Ο Θεός είναι Σωτήρας, ο Ιησούς Χριστός είναι Σωτήρας (<a href="https://bibleox.com/el/gr-lxx-byz/tit/1/#L3-4">Τιτ 1:3-4</a>)</h2><blockquote><p>«ἐφανέρωσεν δὲ καιροῖς ἰδίοις τὸν λόγον αὐτοῦ ἐν κηρύγματι ὃ ἐπιστεύθην ἐγὼ κατ᾿ ἐπιταγὴν τοῦ <strong>σωτῆρος ἡμῶν θεοῦ</strong>, Τίτῳ γνησίῳ τέκνῳ κατὰ κοινὴν πίστιν· χάρις καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς καὶ <strong>Χριστοῦ Ἰησοῦ τοῦ σωτῆρος ἡμῶν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/tit/1/#L3-4">Τιτ 1:3-4</a>)</p></blockquote><blockquote><p>«προσδεχόμενοι τὴν μακαρίαν ἐλπίδα καὶ ἐπιφάνειαν τῆς δόξης τοῦ μεγάλου <strong>θεοῦ καὶ σωτῆρος ἡμῶν Ἰησοῦ Χριστοῦ</strong>,» (<a href="https://bibleox.com/el/gr-lxx-byz/tit/2/#L13">Τιτ 2:13</a>)</p></blockquote><h2>Ο Ιησούς είναι ο ίδιος Θεός με τον Θεό της Παλαιάς Διαθήκης (<a href="https://bibleox.com/el/gr-lxx-byz/mf/23/#L34">Μτ 23:34</a> · <a href="https://bibleox.com/el/gr-lxx-byz/ier/7/#L21,25">Ιερ 7:21,25</a>)</h2><p>Όταν σε όσους αμφισβητούν την πίστη στον Χριστό ως Θεό δείχνεται ότι οι απόστολοι ονομάζουν τον Χριστό κυριολεκτικά Θεό, εκείνοι αντιτείνουν λέγοντας: «δεν αρκεί να ονομάζεται κάποιος Θεός». Ιδού, λένε, και τον προφήτη Μωυσή τον ονόμαζαν θεό:</p><blockquote><p>«καὶ <strong>εἶπεν κύριος πρὸς Μωυσῆν λέγων Ἰδοὺ δέδωκά σε θεὸν Φαραω</strong>, καὶ Ααρων ὁ ἀδελφός σου ἔσται σου προφήτης·» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/7/#L1">Έξ 7:1</a>)</p></blockquote><blockquote><p>«Ἰδοὺ δέδωκά σε <strong>θεὸν</strong> Φαραω» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/7/#L1">Έξ 7:1</a>)</p></blockquote><p>Πρώτον, εδώ δεν τηρείται η απαίτηση που έθεταν προηγουμένως οι ίδιοι οι κριτικοί: η λέξη «Θεός» να έχει το άρθρο. Άρθρο εδώ δεν υπάρχει. Και πράγματι, από το κείμενο φαίνεται ότι ο προφήτης Μωυσής λαμβάνει απλώς μια επίκτητη λειτουργία σε σχέση με τον Φαραώ. Τίποτε εδώ δεν δείχνει ότι ο Μωυσής είναι δήθεν κατά φύση θεός, που κατέχει τη θεότητα ως δική του μόνιμη ιδιότητα. Επιπλέον, δεν τηρείται ούτε η δεύτερη απαίτηση των κριτικών απέναντι στα επιχειρήματά μας: στο εβραϊκό κείμενο εδώ βρίσκεται επίσης η κοινή λέξη «אֱלֹהִ֖ים» (Elohim), και όχι το τετραγράμματο YHWH, δηλαδή δεν πρόκειται για τον αληθινό Θεό με την ύψιστη έννοια.</p><p>Δεύτερον, μπορεί κανείς να βεβαιωθεί οριστικά ότι ο Ιησούς Χριστός είναι ο ίδιος ο αληθινός Θεός: ο Δημιουργός, ο Γιαχβέ, ο Θεός των πατέρων (Αβραάμ, Ισαάκ και Ιακώβ), από άλλα λόγια του αποστόλου. Για παράδειγμα, ο ίδιος ο Χριστός λέει ότι Αυτός έστελνε στον Ισραήλ τους προφήτες, ενώ στην Παλαιά Διαθήκη λέγεται ότι όλους τους προφήτες τους έστελνε ο Θεός Γιαχβέ. Από αυτό συνάγεται επίσης άμεσα ότι ο Χριστός είναι ο σαρκωμένος Θεός Γιαχβέ. Υπάρχουν και άλλα παραδείγματα παρακάτω.</p><h3>Τους προφήτες τους έστελνε μόνο ο Θεός, τους προφήτες τους έστελνε ο Χριστός</h3><p>Ο ίδιος ο Χριστός λέει ότι Αυτός είναι εκείνος που έστελνε στον Ισραήλ τους προφήτες:</p><blockquote><p>«διὰ τοῦτο <strong>ἰδοὺ ἐγὼ ἀποστέλλω πρὸς ὑμᾶς προφήτας</strong> καὶ σοφοὺς καὶ γραμματεῖς· ἐξ αὐτῶν ἀποκτενεῖτε καὶ σταυρώσετε, καὶ ἐξ αὐτῶν μαστιγώσετε ἐν ταῖς συναγωγαῖς ὑμῶν καὶ διώξετε ἀπὸ πόλεως εἰς πόλιν·» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/23/#L34">Μτ 23:34</a>)</p></blockquote><p>Ο Θεός προσωπικά (όχι μέσω μεσολαβητών) απευθύνεται στους προφήτες και τους στέλνει:</p><blockquote><p>«<strong>τάδε λέγει κύριος</strong> Τὰ ὁλοκαυτώματα ὑμῶν συναγάγετε μετὰ τῶν θυσιῶν ὑμῶν καὶ φάγετε κρέα. &lt;…&gt; ἀφ᾿ ἧς ἡμέρας ἐξήλθοσαν οἱ πατέρες αὐτῶν ἐκ γῆς Αἰγύπτου καὶ ἕως τῆς ἡμέρας ταύτης καὶ <strong>ἐξαπέστειλα πρὸς ὑμᾶς πάντας τοὺς δούλους μου τοὺς προφήτας</strong> ἡμέρας καὶ ὄρθρου καὶ ἀπέστειλα,» (<a href="https://bibleox.com/el/gr-lxx-byz/ier/7/#L21,25">Ιερ 7:21,25</a> · <a href="https://bibleox.com/el/gr-lxx-byz/ier/42/#L15">Ιερ 42:15</a> · <a href="https://bibleox.com/el/gr-lxx-byz/ier/51/#L4">Ιερ 51:4</a>)</p></blockquote><blockquote><p>«εἶπεν δὲ ὁ θεὸς Μωυσεῖ λέγων ὅτι Ἔσομαι μετὰ σοῦ, καὶ τοῦτό σοι τὸ σημεῖον ὅτι <strong>ἐγώ σε ἐξαποστέλλω</strong>· ἐν τῷ ἐξαγαγεῖν σε τὸν λαόν μου ἐξ Αἰγύπτου καὶ λατρεύσετε τῷ θεῷ ἐν τῷ ὄρει τούτῳ.» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/3/#L12">Έξ 3:12</a>)</p></blockquote><blockquote><p>«λέγει κύριος παντοκράτωρ, καὶ οὐ μὴ ὑπολειφθῇ ἐξ αὐτῶν ῥίζα οὐδὲ κλῆμα. &lt;…&gt; καὶ ἰδοὺ <strong>ἐγὼ ἀποστέλλω ὑμῖν Ηλιαν τὸν Θεσβίτην</strong> πρὶν ἐλθεῖν ἡμέραν κυρίου τὴν μεγάλην καὶ ἐπιφανῆ,» (<a href="https://bibleox.com/el/gr-lxx-byz/mal/3/#L19,22">Μαλ 3:19,22</a>)</p></blockquote><blockquote><p>«καὶ <strong>ἐξαπέστειλεν κύριος ἄνδρα προφήτην</strong> πρὸς τοὺς υἱοὺς Ισραηλ, καὶ εἶπεν αὐτοῖς Τάδε λέγει κύριος ὁ θεὸς Ισραηλ Ἐγώ εἰμι ὁ ἀναβιβάσας ὑμᾶς ἐξ Αἰγύπτου καὶ ἐξήγαγον ὑμᾶς ἐξ οἴκου δουλείας» (<a href="https://bibleox.com/el/gr-lxx-byz/sud/6/#L8">Κρ 6:8</a>)</p></blockquote><blockquote><p>«καὶ ἐγένετο ὀργὴ κυρίου ἐπὶ Αμασιαν, καὶ <strong>ἀπέστειλεν αὐτῷ προφήτας</strong> καὶ εἶπαν αὐτῷ Τί ἐζήτησας τοὺς θεοὺς τοῦ λαοῦ, οἳ οὐκ ἐξείλαντο τὸν λαὸν αὐτῶν ἐκ χειρός σου;» (<a href="https://bibleox.com/el/gr-lxx-byz/2par/25/#L15">Β Παρ 25:15</a>)</p></blockquote><blockquote><p>«Καὶ εἶπεν Σαμουηλ πρὸς Σαουλ <strong>Ἐμὲ ἀπέστειλεν κύριος</strong> χρῖσαί σε εἰς βασιλέα ἐπὶ Ισραηλ, καὶ νῦν ἄκουε τῆς φωνῆς κυρίου·» (<a href="https://bibleox.com/el/gr-lxx-byz/1ts/15/#L1">Α Βασ 15:1</a>)</p></blockquote><blockquote><p>«καὶ <strong>ἀπέστειλεν κύριος τὸν Ναθαν</strong> τὸν προφήτην πρὸς Δαυιδ, καὶ εἰσῆλθεν πρὸς αὐτὸν καὶ εἶπεν αὐτῷ Δύο ἦσαν ἄνδρες ἐν πόλει μιᾷ, εἷς πλούσιος καὶ εἷς πένης·» (<a href="https://bibleox.com/el/gr-lxx-byz/2ts/12/#L1">Β Βασ 12:1</a>)</p></blockquote><blockquote><p>«καὶ κύριος ἠγάπησεν αὐτόν. καὶ <strong>ἀπέστειλεν ἐν χειρὶ Ναθαν τοῦ προφήτου</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/2ts/12/#L24-25">Β Βασ 12:24-25</a>)</p></blockquote><blockquote><p>«καὶ <strong>ἐξαπέστειλεν κύριος ὁ θεὸς τῶν πατέρων αὐτῶν ἐν χειρὶ προφητῶν</strong> ὀρθρίζων καὶ ἀποστέλλων τοὺς ἀγγέλους αὐτοῦ, ὅτι ἦν φειδόμενος τοῦ λαοῦ αὐτοῦ καὶ τοῦ ἁγιάσματος αὐτοῦ· καὶ ἦσαν μυκτηρίζοντες τοὺς ἀγγέλους αὐτοῦ καὶ ἐξουδενοῦντες τοὺς λόγους αὐτοῦ καὶ ἐμπαίζοντες ἐν τοῖς προφήταις αὐτοῦ, ἕως ἀνέβη ὁ θυμὸς κυρίου ἐν τῷ λαῷ αὐτοῦ, ἕως οὐκ ἦν ἴαμα.» (<a href="https://bibleox.com/el/gr-lxx-byz/2par/36/#L15-16">Β Παρ 36:15-16</a>)</p></blockquote><h2>Οι Εβραίοι εξεπείρασαν τον Χριστό στην έρημο επί του προφήτη Μωυσή (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/10/#L9">Α Κορ 10:9</a> · <a href="https://bibleox.com/el/gr-lxx-byz/ps/94/#L6-9">Ψλ 94:6-9</a>)</h2><blockquote><p>«μηδὲ <strong>ἐκπειράζωμεν τὸν κύριον, καθώς τινες αὐτῶν ἐξεπείρασαν</strong>, καὶ ὑπὸ τῶν ὄφεων ἀπώλλυντο.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/10/#L9">Α Κορ 10:9</a>)</p></blockquote><p>Το βυζαντινό κείμενο της Βίβλου του ιστότοπου έχει εδώ «τὸν κύριον» (τον Κύριο), ενώ αρκετά χειρόγραφα «τὸν Χριστόν» (τον Χριστό), όπως παρατίθεται στη ρωσική έκδοση· και με τις δύο γραφές πρόκειται για το ίδιο πρόσωπο. Στην έρημο οι Εβραίοι εξεπείρασαν τον ίδιο τον Θεό, τον Δημιουργό, και επομένως ο Χριστός είναι ο ίδιος Θεός που εξεπείρασαν:</p><blockquote><p>«δεῦτε προσκυνήσωμεν καὶ προσπέσωμεν αὐτῷ καὶ κλαύσωμεν ἐναντίον κυρίου <strong>τοῦ ποιήσαντος ἡμᾶς</strong>· ὅτι <strong>αὐτός ἐστιν ὁ θεὸς</strong> ἡμῶν, καὶ ἡμεῖς λαὸς νομῆς αὐτοῦ καὶ πρόβατα χειρὸς αὐτοῦ. σήμερον, ἐὰν τῆς φωνῆς αὐτοῦ ἀκούσητε, μὴ σκληρύνητε τὰς καρδίας ὑμῶν ὡς ἐν τῷ παραπικρασμῷ κατὰ τὴν ἡμέραν τοῦ πειρασμοῦ ἐν τῇ ἐρήμῳ, οὗ <strong>ἐπείρασαν οἱ πατέρες ὑμῶν, ἐδοκίμασαν</strong> καὶ εἴδοσαν τὰ ἔργα μου.» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/94/#L6-9">Ψλ 94:6-9</a>)</p></blockquote><h2>Αρχαία χειρόγραφα[1]</h2><p>1. Έτσι φαίνεται σήμερα το <strong>Ιούδα 5: </strong>«<em>Ὑπομνῆσαι δὲ ὑμᾶς βούλομαι, εἰδότας ἅπαξ πάντα, ὅτι Ἰησοῦς λαὸν ἐκ γῆς Αἰγύπτου σώσας τὸ δεύτερον τοὺς μὴ πιστεύσαντας ἀπώλεσεν</em>». Αλλά στον αρχαιότερο πάπυρο που περιέχει την επιστολή του αποστόλου Ιούδα — <a href="https://en.wikipedia.org/wiki/Papyrus_72">p72</a> (3ος αιώνας) — αυτό το κείμενο φαίνεται διαφορετικά: «<em>Ὑπομνῆσαι δὲ ὑμᾶς βούλομαι, εἰδότας ἅπαξ πάντα, ὅτι </em><a href="http://earlynewtestament.com/papyrus72.htm#:~:text=Now%20I%20desire%20to%20remind%20you%2C%20though%20you%20already%20know%20this%2C%20that%20the%20Lord%20God%2C%20Christ"><strong><em>Θεὸς Χριστός</em></strong><em> (Theos Hristos)</em></a><strong><em> </em></strong><em>λαὸν ἐκ γῆς Αἰγύπτου σώσας τὸ δεύτερον τοὺς μὴ πιστεύσαντας ἀπώλεσεν</em>».</p><p>2. Έτσι στο σημερινό κείμενο το τέλος του <strong>Κολ 2:2:</strong> «<em>εἰς ἐπίγνωσιν τοῦ μυστηρίου τοῦ θεοῦ, Χριστοῦ</em>». Αλλά στον αρχαιότερο πάπυρο που διασώζει το κείμενο των επιστολών του αποστόλου Παύλου — <a href="https://en.wikipedia.org/wiki/Papyrus_46">p46</a> (τέλος του 2ου αιώνα) — η φράση διαβάζεται ως ένα όνομα: «<em>εἰς ἐπίγνωσιν τοῦ μυστηρίου </em><strong><em>Θεοῦ Χριστοῦ</em></strong>» (tou Theou Hristou).</p><p>3. Στο κείμενο που έχουμε, το <strong>Β Πε 1:2</strong> διαβάζεται: «<em>χάρις ὑμῖν καὶ εἰρήνη πληθυνθείη ἐν ἐπιγνώσει τοῦ θεοῦ καὶ Ἰησοῦ τοῦ κυρίου ἡμῶν</em>». Και να πώς φαίνεται αυτό το χωρίο στον αρχαιότερο κώδικα της επιστολής: «<em>χάρις ὑμῖν καὶ εἰρήνη πληθυνθείη ἐν ἐπιγνώσει </em><strong><em>Θεοῦ Ἰησοῦ</em></strong><em> (tou Theou Iesou), τοῦ κυρίου ἡμῶν</em>».</p><p>4. Στο Ευαγγέλιο του <strong>Ιωάννη 1:18:</strong> «<em>μονογενὴς θεὸς ὁ ὢν εἰς τὸν κόλπον τοῦ πατρός</em>». Και στους αρχαιότερους παπύρους του Ευαγγελίου του Ιωάννη — <a href="https://en.wikipedia.org/wiki/Papyrus_75?ysclid=mlwxlqa83y641858977">p75</a> (μέσα 3ου αιώνα) και <a href="https://en.wikipedia.org/wiki/Papyrus_66?ysclid=mlwxmlblj1823476742">p66</a> (τέλος του 2ου) διαβάζουμε: «<strong><em>μονογενὴς θεός</em></strong><em>, ὁ ὢν εἰς τὸν κόλπον τοῦ πατρός</em>». Με την ίδια μορφή παραθέτει αυτό το χωρίο και ο άγιος Ειρηναίος της Λυών.</p><h2>Ο Χριστός — κάτοικος δύο κόσμων: του Θεού και του ανθρώπου</h2><p>Δεν υπάρχει μεσίτης που να θέσει το χέρι του πάνω στον Θεό και πάνω στον άνθρωπο, γιατί αυτοί οι κόσμοι δεν αγγίζονται, δεν ενώνονται με τίποτα και με κανέναν:</p><blockquote><p>«<strong>εἴθε ἦν ὁ μεσίτης ἡμῶν καὶ ἐλέγχων καὶ διακούων ἀνὰ μέσον ἀμφοτέρων</strong>·» (<a href="https://bibleox.com/el/gr-lxx-byz/iov/9/#L33">Ιωβ 9:33</a>)</p></blockquote><p>Ο Ιησούς Χριστός (άκτιστος Θεός και κτιστός άνθρωπος) ενώνει αυτούς τους κόσμους με τον εαυτό Του:</p><blockquote><p>«εἷς γὰρ θεός, <strong>εἷς καὶ μεσίτης θεοῦ καὶ ἀνθρώπων</strong>, ἄνθρωπος Χριστὸς Ἰησοῦς,» (<a href="https://bibleox.com/el/gr-lxx-byz/1tim/2/#L5">Α Τιμ 2:5</a>)</p></blockquote><h2>Παραλληλισμοί από την Παλαιά Διαθήκη</h2><h3>Ο Χριστός, ακριβώς όπως και ο Θεός: Βασιλιάς των Βασιλιάδων, Κύριος των Κυρίων</h3><p>Οι προφήτες ονομάζουν τον Θεό Κύριο των Κυρίων:</p><blockquote><p>«ἐξομολογεῖσθε τῷ θεῷ τῶν θεῶν, ὅτι εἰς τὸν αἰῶνα τὸ ἔλεος αὐτοῦ· ἐξομολογεῖσθε <strong>τῷ κυρίῳ τῶν κυρίων</strong>, ὅτι εἰς τὸν αἰῶνα τὸ ἔλεος αὐτοῦ·» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/135/#L2-3">Ψλ 135:2-3</a>)</p></blockquote><p>Οι απόστολοι ονομάζουν τον Θεό Κύριο των Κυρίων και Βασιλιά των Βασιλιάδων:</p><blockquote><p>«ἣν καιροῖς ἰδίοις δείξει ὁ μακάριος καὶ μόνος δυνάστης, <strong>ὁ βασιλεὺς τῶν βασιλευόντων καὶ κύριος τῶν κυριευόντων</strong>, ὁ μόνος ἔχων ἀθανασίαν, φῶς οἰκῶν ἀπρόσιτον, ὃν εἶδεν οὐδεὶς ἀνθρώπων οὐδὲ ἰδεῖν δύναται· ᾧ τιμὴ καὶ κράτος αἰώνιον· ἀμήν.» (<a href="https://bibleox.com/el/gr-lxx-byz/1tim/6/#L15-16">Α Τιμ 6:15-16</a>)</p></blockquote><p>Οι απόστολοι ονομάζουν τον Ιησού Χριστό Κύριο των Κυρίων και Βασιλιά των Βασιλιάδων:</p><blockquote><p>«οὗτοι μετὰ τοῦ ἀρνίου πολεμήσουσιν, καὶ τὸ ἀρνίον νικήσει αὐτούς, ὅτι <strong>κύριος κυρίων ἐστὶν καὶ βασιλεὺς βασιλέων</strong>, καὶ οἱ μετ᾿ αὐτοῦ κλητοὶ καὶ ἐκλεκτοὶ καὶ πιστοί.» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/17/#L14">Απ 17:14</a>)</p></blockquote><blockquote><p>«καὶ ἔχει ἐπὶ τὸ ἱμάτιον καὶ ἐπὶ τὸν μηρὸν αὐτοῦ ὄνομα γεγραμμένον· <strong>Βασιλεὺς βασιλέων καὶ κύριος κυρίων</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/19/#L16">Απ 19:16</a>)</p></blockquote><h3>Ο Χριστός, όπως και ο Θεός, είναι Παντοκράτορας</h3><p>Ο Θεός είναι Παντοκράτορας:</p><blockquote><p>«μακάριος δὲ ἄνθρωπος, ὃν ἤλεγξεν ὁ κύριος· νουθέτημα δὲ <strong>παντοκράτορος</strong> μὴ ἀπαναίνου.» (<a href="https://bibleox.com/el/gr-lxx-byz/iov/5/#L17">Ιωβ 5:17</a> · <a href="https://bibleox.com/el/gr-lxx-byz/otkr/15/#L3">Απ 15:3</a>)</p></blockquote><p>Ο Χριστός είναι Παντοκράτορας:</p><blockquote><p>«Ἐγώ εἰμι τὸ Ἄλφα καὶ τὸ Ὦ, λέγει κύριος ὁ θεός, ὁ ὢν καὶ ὁ ἦν καὶ ὁ ἐρχόμενος, <strong>ὁ παντοκράτωρ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/1/#L8">Απ 1:8</a>)</p></blockquote><blockquote><p>«ὃς ὢν ἀπαύγασμα τῆς δόξης καὶ χαρακτὴρ τῆς ὑποστάσεως αὐτοῦ, <strong>φέρων τε τὰ πάντα τῷ ῥήματι τῆς δυνάμεως αὐτοῦ</strong>, καθαρισμὸν τῶν ἁμαρτιῶν ποιησάμενος ἐκάθισεν ἐν δεξιᾷ τῆς μεγαλωσύνης ἐν ὑψηλοῖς,» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/1/#L3">Εβρ 1:3</a>)</p></blockquote><p>Παρακάτω, στο ίδιο βιβλίο, ο Θεός ονομάζεται Παντοκράτορας:</p><blockquote><p>«καὶ ᾄδουσιν τὴν ᾠδὴν Μωϋσέως τοῦ δούλου τοῦ θεοῦ καὶ τὴν ᾠδὴν τοῦ ἀρνίου λέγοντες, Μεγάλα καὶ θαυμαστὰ τὰ ἔργα σου, <strong>κύριε ὁ θεὸς ὁ παντοκράτωρ</strong>· δίκαιαι καὶ ἀληθιναὶ αἱ ὁδοί σου, <strong>ὁ βασιλεὺς τῶν ἐθνῶν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/15/#L3">Απ 15:3</a>)</p></blockquote><h3>Ο Χριστός είναι ο Ων (εβρ. Γιαχβέ)</h3><p>Ο Χριστός ονομάζει τον εαυτό Του με τον ίδιο τρόπο με τον οποίο ονομαζόταν ο Θεός στην Παλαιά Διαθήκη (Γιαχβέ, ο Ων):</p><blockquote><p>«τότε γνώσεσθε ὅτι <strong>ἐγώ εἰμι</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/in/8/#L28">Ιω 8:28</a>).</p></blockquote><h3>Ο Θεός θα έρθει με όλους τους αγίους, όπως και ο Χριστός</h3><p>Ο Θεός (εβρ. יהוה‏‎) θα έρθει με όλους τους αγίους:</p><blockquote><p>«<strong>ἥξει</strong> <strong>κύριος ὁ θεός</strong> μου <strong>καὶ</strong> <strong>πάντες οἱ ἅγιοι μετ᾿ αὐτοῦ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/zah/14/#L5">Ζαχ 14:5</a>)</p></blockquote><blockquote><p>«Προεφήτευσεν δὲ καὶ τούτοις ἕβδομος ἀπὸ Ἀδὰμ Ἑνὼχ λέγων, Ἰδοὺ <strong>ἦλθεν κύριος ἐν ἁγίαις μυριάσιν αὐτοῦ</strong>,» (<a href="https://bibleox.com/el/gr-lxx-byz/iud/1/#L14">Ιούδα 1:14</a>)</p></blockquote><p>Ο Χριστός θα έρθει με όλους τους αγίους:</p><blockquote><p>«<strong>παρουσίᾳ τοῦ κυρίου ἡμῶν Ἰησοῦ μετὰ πάντων τῶν ἁγίων αὐτοῦ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1sol/3/#L13">Α Θεσ 3:13</a>)</p></blockquote><blockquote><p>«<strong>ἔλθῃ ὁ υἱὸς τοῦ ἀνθρώπου</strong> ἐν τῇ δόξῃ αὐτοῦ <strong>καὶ πάντες οἱ ἄγγελοι μετ᾿ αὐτοῦ</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/25/#L31">Μτ 25:31</a>).</p></blockquote><h2>Δημιουργός και Κριτής — ο Θεός</h2><ol><li>
    <p>Ο Χριστός — Δημιουργός</p></li><li>
    <p>Ο Χριστός — Κριτής</p></li><li>
    <p>Δημιουργός και Κριτής — ο Θεός</p></li></ol><blockquote><p>«λέγων ἐν φωνῇ μεγάλῃ, <strong>Φοβήθητε τὸν θεὸν</strong> καὶ δότε αὐτῷ δόξαν, ὅτι <strong>ἦλθεν ἡ ὥρα τῆς κρίσεως αὐτοῦ</strong>, καὶ <strong>προσκυνήσατε τῷ ποιήσαντι τὸν οὐρανὸν καὶ τὴν γῆν</strong> καὶ θάλασσαν καὶ πηγὰς ὑδάτων.» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/14/#L7">Απ 14:7</a>)</p></blockquote><h2>Αξίζει να το γνωρίζουν οι μουσουλμάνοι</h2><blockquote><p>«Ἰδοὺ <strong>ἡ παρθένος ἐν γαστρὶ ἕξει καὶ τέξεται υἱόν</strong>, καὶ καλέσουσιν τὸ ὄνομα αὐτοῦ Ἐμμανουήλ, ὅ ἐστιν μεθερμηνευόμενον <strong>Μεθ᾿ ἡμῶν ὁ θεός</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/1/#L23">Μτ 1:23</a>)</p></blockquote><blockquote><p>«Καὶ σύ, <strong>Βηθλεεμ</strong> οἶκος τοῦ Εφραθα, ὀλιγοστὸς εἶ τοῦ εἶναι ἐν χιλιάσιν Ιουδα· <strong>ἐκ σοῦ μοι ἐξελεύσεται</strong> τοῦ εἶναι εἰς ἄρχοντα ἐν τῷ Ισραηλ, καὶ <strong>αἱ ἔξοδοι αὐτοῦ ἀπ᾿ ἀρχῆς ἐξ ἡμερῶν αἰῶνος</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mih/5/#L1">Μιχ 5:1</a>)</p></blockquote><blockquote><p>«Ἀβραὰμ ὁ πατὴρ ὑμῶν ἠγαλλιάσατο ἵνα ἴδῃ τὴν ἡμέραν τὴν ἐμήν, καὶ εἶδεν καὶ ἐχάρη. εἶπον οὖν οἱ Ἰουδαῖοι πρὸς αὐτόν, <strong>Πεντήκοντα ἔτη οὔπω ἔχεις καὶ Ἀβραὰμ ἑώρακας</strong>; <strong>εἶπεν αὐτοῖς Ἰησοῦς</strong>, Ἀμὴν ἀμὴν λέγω ὑμῖν, <strong>πρὶν Ἀβραὰμ γενέσθαι ἐγὼ εἰμί</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/8/#L56-58">Ιω 8:56-58</a>)</p></blockquote><blockquote><p>«εἶπεν δὲ αὐτοῖς, <strong>Ἐθεώρουν τὸν Σατανᾶν ὡς ἀστραπὴν ἐκ τοῦ οὐρανοῦ πεσόντα</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/10/#L18">Λκ 10:18</a>)</p></blockquote><blockquote><p>«οἱ δὲ ἐν τῷ πλοίῳ <strong>προσεκύνησαν αὐτῷ</strong> λέγοντες, <strong>Ἀληθῶς θεοῦ υἱὸς εἶ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/14/#L33">Μτ 14:33</a>)</p></blockquote><blockquote><p>«καὶ ἰδὼν <strong>ὁ Ἰησοῦς</strong> τὴν πίστιν αὐτῶν <strong>λέγει</strong> τῷ παραλυτικῷ, Τέκνον, <strong>ἀφίενταί σου αἱ ἁμαρτίαι</strong>. ἦσαν δέ τινες τῶν γραμματέων ἐκεῖ καθήμενοι καὶ διαλογιζόμενοι ἐν ταῖς καρδίαις αὐτῶν, Τί οὗτος οὕτως λαλεῖ; βλασφημεῖ· <strong>τίς δύναται ἀφιέναι ἁμαρτίας εἰ μὴ εἷς ὁ θεός</strong>;» (<a href="https://bibleox.com/el/gr-lxx-byz/mk/2/#L5-7">Μκ 2:5-7</a>)</p></blockquote><blockquote><p>«διὰ τοῦτο οὖν μᾶλλον <strong>ἐζήτουν αὐτὸν</strong> <strong>οἱ Ἰουδαῖοι</strong> ἀποκτεῖναι, ὅτι οὐ μόνον ἔλυεν τὸ σάββατον ἀλλὰ καὶ <strong>πατέρα ἴδιον ἔλεγεν τὸν θεόν, ἴσον ἑαυτὸν ποιῶν τῷ θεῷ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/5/#L18">Ιω 5:18</a>)</p></blockquote><blockquote><p>«<strong>ὥσπερ γὰρ ὁ πατὴρ</strong> ἐγείρει τοὺς νεκροὺς καὶ ζῳοποιεῖ, <strong>οὕτως καὶ ὁ υἱὸς οὓς θέλει ζῳοποιεῖ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/5/#L21">Ιω 5:21</a>)</p></blockquote><blockquote><p>«<strong>οὗ γάρ εἰσιν δύο ἢ τρεῖς συνηγμένοι εἰς τὸ ἐμὸν ὄνομα, ἐκεῖ εἰμι</strong> <strong>ἐν μέσῳ αὐτῶν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/18/#L20">Μτ 18:20</a>) (Ιησούς Χριστός — σημ.)</p></blockquote>
