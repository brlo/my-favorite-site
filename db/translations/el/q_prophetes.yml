    priority: 1
  update: true
  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: "<h2>Η αξιολόγηση των Εκκλησιών της Αποκάλυψης</h2><p>Μπορεί κανείς να συναντήσει προσπάθειες των αντιπάλων της Εκκλησίας να οικοδομήσουν επιχειρήματα ότι αυτή εγκατέλειψε την αληθινή πίστη, επικαλούμενοι το περιεχόμενο των κεφαλαίων 2-3 της Αποκάλυψης του Ιωάννου του Θεολόγου (<a href=\"https://bibleox.com/el/gr-lxx-byz/otkr/2/#L1\">Απ 2:1</a>). Σε αυτά ο Κύριος Ιησούς Χριστός απευθύνεται στις επτά Εκκλησίες, επισημαίνοντας τα πλεονεκτήματα και τα μειονεκτήματά τους. Στην πραγματικότητα, αν εξετάσει κανείς το κείμενο, συμβαίνει το αντίθετο: οι Εκκλησίες διατηρούν την πίστη του Χριστού, και αν ορισμένες από αυτές επικρίνονται, αυτό γίνεται για τα <strong><mark>έργα</mark></strong> τους.</p><h3>1. <strong>Εφέσου</strong></h3><p>✅ Επαινείται για τα έργα της (απομάκρυνση από την ασέλγεια, έλεγχος των ψευδαποστόλων, μίσος προς τα έργα των Νικολαϊτών, υπομονή, κόπος για τον Κύριο).</p><p>❌ Επικρίνεται διότι εγκατέλειψε την πρώτη αγάπη· της προτείνεται να επιστρέψει σε αυτήν και να κάνει τα «πρώτα <strong><mark>έργα</mark></strong>».</p><h3>2. <strong>Σμύρνης</strong></h3><p>✅ Επαινείται για τα έργα της (υπομονή στις θλίψεις, στη φτώχεια και στη βλασφημία). Καλείται να μη φοβάται όσα θα υποφέρει στο μέλλον λόγω των διωγμών. Υπόσχεται ο στέφανος της ζωής. Δεν επικρίνεται για τίποτα.</p><h3>3. <strong>Περγάμου</strong></h3><p>✅ Επαινείται για τα έργα της (δεν αρνήθηκε την πίστη του Χριστού υπό τον φόβο των διωγμών).</p><p>❌ Επικρίνεται διότι <strong>δεν απέβαλε</strong> τους Νικολαΐτες, που έτρωγαν ειδωλόθυτα και πορνεύονταν. Παρ' όλα αυτά, η Εκκλησία της Περγάμου δεν αρνήθηκε την πίστη του Χριστού: «οὐκ ἠρνήσω τὴν <strong>πίστιν</strong> <strong>μου</strong>».</p><h3>4. <strong>Θυατείρων</strong></h3><p>✅ Επαινείται για την <strong>πίστη</strong> και τα έργα (αγάπη, διακονία, υπομονή).</p><p>❌ Επικρίνεται διότι επίσης δεν απέβαλε την «Ιεζάβελ», επιτρέποντας να παρασύρονται οι πιστοί σε πορνείες και ειδωλόθυτη τροφή (όπως και με τους Νικολαΐτες στην Πέργαμο). Τιμωρούνται μόνο όσοι πόρνευσαν με την Ιεζάβελ. Οι υπόλοιποι επαινούνται: «<em>ὃ ἔχετε κρατήσατε ἄχρις οὗ ἂν ἥξω</em>».</p><h3>5. <strong>Σάρδεων</strong></h3><p>✅ Επαινούνται μόνο λίγοι άνθρωποι, που δεν μόλυναν τα ενδύματά τους.</p><p>❌ Εξαιτίας των υπολοίπων συγκρίνεται με νεκρή λόγω της ατέλειας των έργων: «<em>οὐ γὰρ εὕρηκά σου [τὰ] </em><strong><mark>ἔργα</mark></strong><em> πεπληρωμένα</em>». Επικρίνεται διότι δεν αγρυπνεί.</p><h3>6. <strong>Φιλαδελφείας</strong></h3><p>✅ Επαινείται για τα έργα (αν και έχει λίγη δύναμη, δεν αρνήθηκε τον Χριστό), για τη διατήρηση <em>τοῦ λόγου τῆς ὑπομονῆς μου</em>. Καλείται: «<em>κράτει ὃ ἔχεις</em>». Δεν επικρίνεται για τίποτα.</p><h3>7. <strong>Λαοδικείας</strong></h3><p>Δεν επαινείται.</p><p>❌ Επικρίνεται για τα έργα: «Οἶδά σου τὰ <strong><mark>ἔργα</mark></strong>, ὅτι οὔτε ψυχρὸς εἶ οὔτε θερμός». Καλείται να αγοράσει από τον Χριστό χρυσάφι, ενδύματα και κολλύριο, καθώς και να δείξει ζήλο και μετάνοια: «<em>ζήλευε οὖν καὶ μετανόησον</em>».</p><h2>Σύνοψη</h2><p>Συνοπτικά,</p><ul><li><p>\U0001F7E2 Η Σμύρνης (2) και η Φιλαδελφείας (6) δεν επικρίνονται καθόλου.</p></li><li><p>\U0001F7E1 Η Περγάμου (3) και η Θυατείρων (4) διατήρησαν την πίστη, αλλά επικρίνονται διότι δεν απέβαλαν τους πλανεμένους (Νικολαΐτες και Ιεζάβελ). Τιμωρούνται ακριβώς όσοι ανήκουν στις ψευδείς διδασκαλίες. Η ίδια όμως η Εκκλησία επαινείται: «οὐκ ἠρνήσω τὴν <strong>πίστιν</strong> <strong>μου</strong>» (Περγάμου), «<em>ὃ ἔχετε κρατήσατε ἄχρις οὗ ἂν ἥξω</em>» (Θυατείρων).</p></li><li><p>\U0001F7E0 Η Εφέσου (1) επαινείται για την ευσέβεια και τη φύλαξη της πίστης, επικρίνεται για την εγκατάλειψη της πρώτης αγάπης, καλείται να κάνει τα πρώτα <strong>έργα</strong>.</p></li><li><p>\U0001F7E0 Η Σάρδεων (5) επαινείται για λίγους ανθρώπους που διατήρησαν τα ενδύματά τους, επικρίνεται για την ατέλεια των <strong>έργων</strong>.</p></li><li><p>\U0001F534 Η Λαοδικείας (7) δεν επαινείται για τίποτα, επικρίνεται για τη χλιαρότητα στα <strong>έργα</strong>, καλείται σε μετάνοια.</p></li></ul><h2>Συμπέρασμα</h2><ul><li><p>Για την πίστη κανείς δεν επικρίνεται, αλλά σχεδόν όλοι επαινούνται (1, 2, 3, 4, 6).</p></li></ul><ul><li><p>Μερικοί επικρίνονται για έλλειψη σε ένα έργο, αλλά επαινούνται για τη διατήρηση της πίστης (3, 4).</p></li></ul><ul><li><p>Άλλοι έχουν σοβαρότερη έλλειψη στα έργα, αλλά και σε αυτούς διατηρήθηκε η πίστη (1, 5).</p></li></ul><ul><li><p>Η τελευταία επικρίνεται για αδιαφορία προς τα έργα (χλιαρότητα) (7).</p></li></ul><p>Θα μπορούσε κανείς να σκεφτεί ότι ως έργα μπορεί να εννοείται και η πίστη. Ωστόσο, οι Εκκλησίες που διατήρησαν αναμφίβολα την πίστη επικρίνονται για έλλειψη στα έργα (3, 4), κάτι που αφήνει ελάχιστο χώρο σε μια τέτοια ερμηνεία. Έτσι, οι Εκκλησίες της Αποκάλυψης δεν επικρίνονται για την πίστη (ως διδασκαλία), αλλά για την ατέλεια στα έργα. Και μερικές Εκκλησίες δεν επικρίνονται καθόλου.</p>"
