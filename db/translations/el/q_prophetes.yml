  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <h2>Στον χριστιανισμό θα προκύψουν πολλές αιρέσεις</h2><blockquote><p><em>«</em><strong><em><mark>πολλοὶ</mark> ἐλεύσονται ἐπὶ τῷ ὀνόματί μου</em></strong><em> λέγοντες ὅτι Ἐγώ εἰμι, καὶ </em><strong><em><mark>πολλοὺς</mark> πλανήσουσιν</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/mk/13/#L6"><em>Μκ 13:6</em></a><em>)</em></p></blockquote><blockquote><p><em>«καὶ </em><strong><em><mark>πολλοὶ</mark> ψευδοπροφῆται ἐγερθήσονται καὶ πλανήσουσιν <mark>πολλούς</mark></em></strong><em>·» (</em><a href="https://bibleox.com/el/gr-lxx-byz/mf/24/#L11"><em>Μτ 24:11</em></a><em>)</em></p></blockquote><blockquote><p><em>«Ἀγαπητοί, μὴ παντὶ πνεύματι πιστεύετε, ἀλλὰ δοκιμάζετε τὰ πνεύματα εἰ ἐκ τοῦ θεοῦ ἐστιν, ὅτι </em><strong><em><mark>πολλοὶ</mark></em></strong><em> </em><strong><em>ψευδοπροφῆται</em></strong><em> ἐξεληλύθασιν εἰς τὸν κόσμον.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/1in/4/#L1"><em>Α Ιω 4:1</em></a><em>)</em></p></blockquote><h2>Οι αιρέσεις θα διαδοθούν πολύ έντονα</h2><blockquote><p><em>«καὶ </em><strong><em><mark>ὁ λόγος αὐτῶν ὡς γάγγραινα νομὴν ἕξει</mark></em></strong><em>· ὧν ἐστιν Ὑμέναιος καὶ Φίλητος, οἵτινες </em><strong><em>περὶ τὴν ἀλήθειαν ἠστόχησαν</em></strong><em>, λέγοντες [τὴν] ἀνάστασιν ἤδη γεγονέναι, καὶ ἀνατρέπουσιν τήν τινων πίστιν.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/2tim/2/#L17-18"><em>Β Τιμ 2:17-18</em></a><em>)</em></p></blockquote><blockquote><p><em>«Ἐγένοντο δὲ καὶ ψευδοπροφῆται ἐν τῷ λαῷ, ὡς καὶ ἐν ὑμῖν ἔσονται ψευδοδιδάσκαλοι, οἵτινες </em><strong><em>παρεισάξουσιν αἱρέσεις ἀπωλείας</em></strong><em>, καὶ τὸν ἀγοράσαντα αὐτοὺς δεσπότην ἀρνούμενοι, ἐπάγοντες ἑαυτοῖς ταχινὴν ἀπώλειαν. καὶ </em><strong><em><mark>πολλοὶ</mark> ἐξακολουθήσουσιν αὐτῶν ταῖς ἀσελγείαις, δι᾿ οὓς ἡ ὁδὸς τῆς ἀληθείας βλασφημηθήσεται</em></strong><em>· καὶ </em><strong><em>ἐν πλεονεξίᾳ</em></strong><em> πλαστοῖς λόγοις ὑμᾶς </em><strong><em>ἐμπορεύσονται</em></strong><em>· οἷς τὸ κρίμα ἔκπαλαι οὐκ ἀργεῖ, καὶ ἡ ἀπώλεια αὐτῶν οὐ νυστάζει.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/2pet/2/#L1-3"><em>Β Πε 2:1-3</em></a><em>)</em></p></blockquote><h2>Οι κοινότητες των αιρετικών θα αποχωριστούν από την Εκκλησία και την ενότητα της πίστης</h2><blockquote><p><em>«Παιδία, ἐσχάτη ὥρα ἐστίν, καὶ καθὼς ἠκούσατε ὅτι ἀντίχριστος ἔρχεται, καὶ νῦν ἀντίχριστοι πολλοὶ γεγόνασιν· ὅθεν γινώσκομεν ὅτι ἐσχάτη ὥρα ἐστίν. </em><strong><em>ἐξ ἡμῶν ἐξῆλθαν, ἀλλ᾿ οὐκ ἦσαν ἐξ ἡμῶν· <mark>εἰ γὰρ ἐξ ἡμῶν ἦσαν, μεμενήκεισαν ἂν μεθ᾿ ἡμῶν</mark></em></strong><em>· ἀλλ᾿ ἵνα φανερωθῶσιν ὅτι οὐκ εἰσὶν πάντες ἐξ ἡμῶν.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/1in/2/#L18-19"><em>Α Ιω 2:18-19</em></a><em>)</em></p></blockquote><blockquote><p><em>«ὅτι ἔλεγον ὑμῖν, </em><strong><em>Ἐπ᾿ ἐσχάτου [τοῦ] χρόνου</em></strong><em> ἔσονται ἐμπαῖκται κατὰ τὰς ἑαυτῶν ἐπιθυμίας πορευόμενοι τῶν ἀσεβειῶν. Οὗτοί εἰσιν </em><strong><em>οἱ <mark>ἀποδιορίζοντες</mark></em></strong><em>, ψυχικοί, πνεῦμα μὴ ἔχοντες.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/iud/1/#L18-19"><em>Ιούδα 1:18-19</em></a><em>)</em></p></blockquote><h2>Το έργο των ψευδοδιδασκάλων — να αρπάξουν τον πιστό από την Εκκλησία και να τον παρασύρουν πίσω τους</h2><blockquote><p><em>«ἐγὼ οἶδα ὅτι </em><strong><em>εἰσελεύσονται μετὰ τὴν ἄφιξίν μου λύκοι βαρεῖς εἰς ὑμᾶς μὴ φειδόμενοι τοῦ ποιμνίου, καὶ ἐξ ὑμῶν αὐτῶν ἀναστήσονται ἄνδρες <mark>λαλοῦντες διεστραμμένα</mark> <mark>τοῦ ἀποσπᾶν</mark> τοὺς μαθητὰς <mark>ὀπίσω αὐτῶν</mark></em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/act/20/#L29-30"><em>Πραξ 20:29-30</em></a><em>)</em></p></blockquote><h2>Μέθοδοι των ψευδοδιδασκάλων</h2><h3>1. Ευχάριστες διδασκαλίες</h3><p>Οι ψευδοδιδάσκαλοι θα επινοούν ευχάριστες διδασκαλίες ακριβώς επειδή οι ακροατές τους θα αναζητούν ευχάριστη για την ακοή διδασκαλία, μη ανεχόμενοι την υγιή διδασκαλία:</p><blockquote><p><em>«ἔσται γὰρ καιρὸς ὅτε </em><strong><em>τῆς ὑγιαινούσης διδασκαλίας οὐκ ἀνέξονται</em></strong><em>, ἀλλὰ </em><strong><em>κατὰ τὰς ἰδίας ἐπιθυμίας ἑαυτοῖς ἐπισωρεύσουσιν <mark>διδασκάλους</mark></em></strong><em> </em><strong><em><mark>κνηθόμενοι</mark> <mark>τὴν ἀκοήν</mark></em></strong><em>,» (</em><a href="https://bibleox.com/el/gr-lxx-byz/2tim/4/#L3"><em>Β Τιμ 4:3</em></a><em>)</em></p></blockquote><blockquote><p><em>«Τὸ δὲ πνεῦμα ῥητῶς λέγει ὅτι </em><strong><em>ἐν ὑστέροις καιροῖς ἀποστήσονταί τινες τῆς πίστεως, <mark>προσέχοντες πνεύμασιν πλάνοις</mark> καὶ διδασκαλίαις δαιμονίων</em></strong><em>, ἐν ὑποκρίσει ψευδολόγων, κεκαυστηριασμένων τὴν ἰδίαν συνείδησιν,» (</em><a href="https://bibleox.com/el/gr-lxx-byz/1tim/4/#L1-2"><em>Α Τιμ 4:1-2</em></a><em>)</em></p></blockquote><h3>2. Φαινομενική ευσέβεια</h3><blockquote><p><em>«Τοῦτο δὲ γίνωσκε, ὅτι </em><strong><em>ἐν ἐσχάταις ἡμέραις</em></strong><em> ἐνστήσονται καιροὶ χαλεποί· ἔσονται γὰρ οἱ ἄνθρωποι φίλαυτοι, φιλάργυροι, ἀλαζόνες, ὑπερήφανοι, βλάσφημοι, γονεῦσιν ἀπειθεῖς, ἀχάριστοι, ἀνόσιοι, &lt;…&gt; </em><strong><em><mark>ἔχοντες μόρφωσιν εὐσεβείας</mark></em></strong><em> τὴν δὲ δύναμιν αὐτῆς ἠρνημένοι· καὶ τούτους ἀποτρέπου. &lt;…&gt; πάντοτε μανθάνοντα καὶ μηδέποτε εἰς ἐπίγνωσιν ἀληθείας ἐλθεῖν δυνάμενα. ὃν τρόπον δὲ Ἰάννης καὶ Ἰαμβρῆς ἀντέστησαν Μωϋσεῖ, οὕτως καὶ οὗτοι </em><strong><em>ἀνθίστανται τῇ ἀληθείᾳ, ἄνθρωποι κατεφθαρμένοι τὸν νοῦν, ἀδόκιμοι περὶ τὴν πίστιν</em></strong><em>·» (</em><a href="https://bibleox.com/el/gr-lxx-byz/2tim/3/#L1-2,5,7-8"><em>Β Τιμ 3:1-2,5,7-8</em></a><em>)</em></p></blockquote><blockquote><p><em>«Προσέχετε ἀπὸ τῶν </em><strong><em>ψευδοπροφητῶν</em></strong><em>, οἵτινες </em><strong><em>ἔρχονται πρὸς ὑμᾶς <mark>ἐν ἐνδύμασιν προβάτων</mark></em></strong><em>, ἔσωθεν δέ εἰσιν λύκοι ἅρπαγες.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/mf/7/#L15"><em>Μτ 7:15</em></a><em>)</em></p></blockquote><h3>3. Εντυπωσιακά θαύματα</h3><p>Στους αποστόλους και στους αρχαίους χριστιανούς δόθηκαν άφθονες δυνάμεις θαυματουργίας όχι για επίδειξη, αλλά για ωφέλεια:</p><blockquote><p><em>«ἑκάστῳ δὲ δίδοται ἡ φανέρωσις τοῦ πνεύματος </em><strong><em>πρὸς τὸ συμφέρον</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/1kor/12/#L7"><em>Α Κορ 12:7</em></a><em>)</em></p></blockquote><p>Μια μικρή ομάδα ψαράδων χρειαζόταν μεγάλη βοήθεια, ώστε στη σύντομη ζωή τους, ως αυτόπτες μάρτυρες, να μεταφέρουν το κήρυγμα σε όλο τον κόσμο. Οι απόστολοι προειδοποιούσαν ότι αυτά τα χαρίσματα θα έπαυαν:</p><blockquote><p><em>«Ἡ ἀγάπη οὐδέποτε πίπτει. εἴτε δὲ </em><strong><em>προφητεῖαι, καταργηθήσονται· εἴτε γλῶσσαι, παύσονται</em></strong><em>· εἴτε γνῶσις, καταργηθήσεται.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/1kor/13/#L8"><em>Α Κορ 13:8</em></a><em>)</em></p></blockquote><p>Ο ίδιος ο Χριστός κατέκρινε την αναζήτηση θαυμάτων:</p><blockquote><p><em>«ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς, </em><strong><em>Γενεὰ πονηρὰ καὶ μοιχαλὶς σημεῖον ἐπιζητεῖ</em></strong><em>, καὶ σημεῖον οὐ δοθήσεται αὐτῇ εἰ μὴ τὸ σημεῖον Ἰωνᾶ τοῦ προφήτου.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/mf/12/#L39"><em>Μτ 12:39</em></a><em>)</em></p></blockquote><p>Στους έσχατους καιρούς οι ψευδοπροφήτες θα παρασύρουν τους ανθρώπους ακριβώς με θαύματα:</p><blockquote><p><em>«ἐγερθήσονται γὰρ ψευδόχριστοι καὶ ψευδοπροφῆται, καὶ </em><strong><em>δώσουσιν σημεῖα μεγάλα καὶ τέρατα ὥστε πλανῆσαι</em></strong><em>, εἰ δυνατόν, καὶ τοὺς ἐκλεκτούς·» (</em><a href="https://bibleox.com/el/gr-lxx-byz/mf/24/#L24"><em>Μτ 24:24</em></a><em>; </em><a href="https://bibleox.com/el/gr-lxx-byz/mk/13/#L22"><em>Μκ 13:22</em></a><em>)</em></p></blockquote><p>Ως συμπέρασμα, στη Μέλλουσα Κρίση πολλοί πιστοί θα είναι πεπεισμένοι ότι σώθηκαν ακριβώς επειδή έκαναν θαύματα στο όνομα του Χριστού, προφήτευσαν και έδιωξαν δαίμονες. Όμως θα έχουν εξαπατηθεί, θα έχουν διδαχθεί την ανομία, ο Χριστός δεν τους γνωρίζει και τους διώχνει από κοντά Του:</p><blockquote><p><em>«πολλοὶ ἐροῦσίν μοι ἐν ἐκείνῃ τῇ ἡμέρᾳ, Κύριε κύριε, οὐ τῷ σῷ ὀνόματι ἐπροφητεύσαμεν, καὶ τῷ σῷ ὀνόματι δαιμόνια ἐξεβάλομεν, καὶ τῷ σῷ ὀνόματι </em><strong><em>δυνάμεις πολλὰς ἐποιήσαμεν</em></strong><em>; καὶ τότε ὁμολογήσω αὐτοῖς ὅτι </em><strong><em>Οὐδέποτε ἔγνων ὑμᾶς</em></strong><em>· </em><strong><em>ἀποχωρεῖτε ἀπ᾿ ἐμοῦ</em></strong><em> οἱ ἐργαζόμενοι τὴν ἀνομίαν.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/mf/7/#L22-23"><em>Μτ 7:22-23</em></a><em>)</em></p></blockquote><h2>Πώς να αναγνωρίσεις τον ψευδοπροφήτη</h2><p>Οι προφητείες του δεν εκπληρώνονται:</p><blockquote><p>«ὅσα ἐὰν λαλήσῃ ὁ προφήτης ἐπὶ τῷ ὀνόματι κυρίου, καὶ μὴ γένηται τὸ ῥῆμα καὶ <strong>μὴ συμβῇ</strong>, τοῦτο τὸ ῥῆμα, ὃ οὐκ ἐλάλησεν κύριος· ἐν ἀσεβείᾳ ἐλάλησεν ὁ προφήτης ἐκεῖνος, οὐκ ἀφέξεσθε αὐτοῦ.» (<a href="https://bibleox.com/el/gr-lxx-byz/vtor/18/#L22">Δτ 18:22</a>)</p></blockquote><p>Αν όμως ένας προφήτης ή κάποιος που βλέπει όνειρα δείξει κάποιο σημάδι, ένα θαύμα ή το όνειρό του εκπληρωθεί, αλλά σας καλέσει να λατρέψετε άλλον θεό, τότε δεν πρέπει να τον ακούσετε:</p><blockquote><p>«Ἐὰν δὲ ἀναστῇ ἐν σοὶ προφήτης ἢ ἐνυπνιαζόμενος ἐνύπνιον καὶ <strong>δῷ σοι σημεῖον ἢ τέρας καὶ ἔλθῃ τὸ σημεῖον ἢ τὸ τέρας</strong>, ὃ ἐλάλησεν πρὸς σὲ λέγων <strong>Πορευθῶμεν καὶ λατρεύσωμεν θεοῖς ἑτέροις, οὓς οὐκ οἴδατε</strong>, <strong>οὐκ ἀκούσεσθε τῶν λόγων τοῦ προφήτου ἐκείνου</strong> ἢ τοῦ ἐνυπνιαζομένου τὸ ἐνύπνιον ἐκεῖνο, ὅτι πειράζει κύριος ὁ θεὸς ὑμᾶς εἰδέναι εἰ ἀγαπᾶτε κύριον τὸν θεὸν ὑμῶν ἐξ ὅλης τῆς καρδίας ὑμῶν καὶ ἐξ ὅλης τῆς ψυχῆς ὑμῶν.» (<a href="https://bibleox.com/el/gr-lxx-byz/vtor/13/#L2-4">Δτ 13:2-4</a>)</p></blockquote>
