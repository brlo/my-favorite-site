  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: '<h2>Προφητείες</h2><ol><li><p>Ο αριθμός των ημερών μέχρι την έλευση του Χριστού (<a href="https://bibleox.com/el/gr-lxx-byz/dan/9/#L24-25">Δν 9:24-25</a>)·</p></li><li><p>Ο Χριστός θα έρθει στον <strong>δεύτερο</strong> ναό της Ιερουσαλήμ (που δεν υπάρχει πια, <a href="https://bibleox.com/el/gr-lxx-byz/ag/2/#L9">Αγγ 2:9</a>)·</p></li><li><p>Ο Χριστός θα έρθει όταν η φυλή του Ιούδα χάσει την εξουσία (<a href="https://bibleox.com/el/gr-lxx-byz/gen/49/#L10">Γεν 49:10</a>). <a class="link" href="https://sba.yandex.net/redirect?url=https%3A//ru.wikipedia.org/wiki/%D0%98%D1%80%D0%BE%D0%B4_I_%D0%92%D0%B5%D0%BB%D0%B8%D0%BA%D0%B8%D0%B9&amp;client=znatoki&amp;sign=44c95967cbab42d859f498bd86931552">Ο Ηρώδης ο Μέγας</a> — <a class="link" href="https://sba.yandex.net/redirect?url=https%3A//ru.wikipedia.org/wiki/%D0%98%D0%B4%D1%83%D0%BC%D0%B5%D0%B8&amp;client=znatoki&amp;sign=db07db76ea3e23c7eea8f9e31c11b25f">Ιδουμαίος</a>, δηλαδή απόγονος του Ησαύ, όχι Ιουδαίος. Αντικατέστησε την ιουδαϊκή δυναστεία των <a class="link" href="https://sba.yandex.net/redirect?url=https%3A//ru.wikipedia.org/wiki/%D0%A5%D0%B0%D1%81%D0%BC%D0%BE%D0%BD%D0%B5%D0%B8&amp;client=znatoki&amp;sign=419ad47e272bbce96a5bda8632ab7823">Ασμοναίων</a>, στην οποία ανήκαν οι Μακκαβαίοι.</p></li><li><p>Ο Χριστός θα γεννηθεί στη Βηθλεέμ (<a href="https://bibleox.com/el/gr-lxx-byz/mih/5/#L2">Μιχ 5:2</a>)·</p></li><li><p>Ο Χριστός θα είναι απόγονος του Δαβίδ (<a href="https://bibleox.com/el/gr-lxx-byz/ps/88/#L4-6,28-30,37">Ψλ 88:4-6,28-30,37</a>)·</p></li><li><p>Ο Χριστός θα συνάψει την Καινή Διαθήκη (<a href="https://bibleox.com/el/gr-lxx-byz/is/42/#L6">Ησ 42:6</a>). Όλες οι Διαθήκες με τον Θεό συνάπτονταν με αίμα, και εδώ — με το αίμα του ίδιου του Ιησού Χριστού·</p></li><li><p>Ο Χριστός θα προδοθεί για 30 αργύρια (<a href="https://bibleox.com/el/gr-lxx-byz/zah/11/#L12-13">Ζαχ 11:12-13</a>)·</p></li><li><p>Ο Χριστός θα εκτελεστεί μαζί με ληστές (<a href="https://bibleox.com/el/gr-lxx-byz/dan/9/#L26">Δν 9:26</a> · <a href="https://bibleox.com/el/gr-lxx-byz/is/53/#L12">Ησ 53:12</a> · <a href="https://bibleox.com/el/gr-lxx-byz/zah/12/#L10">Ζαχ 12:10</a>)·</p></li><li><p>Τα χέρια και τα πόδια του θα διαπεράσουν (<a href="https://bibleox.com/el/gr-lxx-byz/ps/21/#L16">Ψλ 21:16</a>)· θα τον διαπεράσουν (με λόγχη) (<a href="https://bibleox.com/el/gr-lxx-byz/zah/12/#L10">Ζαχ 12:10</a>) (βλ. την απάντηση στην κριτική παρακάτω)·</p></li><li><p>Οι διαβάτες θα χλευάζουν τον Χριστό, λέγοντας ότι αν ήλπιζε στον Θεό, ας τον λυτρώσει ο Θεός, αν είναι ευάρεστος σε Αυτόν (<a href="https://bibleox.com/el/gr-lxx-byz/ps/21/#L7-8">Ψλ 21:7-8</a>).</p></li><li><p>Μετά την εκτέλεση του Χριστού θα καταστραφούν η Ιερουσαλήμ και ο Ναός (<a href="https://bibleox.com/el/gr-lxx-byz/dan/9/#L26">Δν 9:26</a>)·</p></li><li><p>Ολόκληρο το κεφάλαιο του προφήτη Ησαΐα για τα σωτήρια πάθη του Χριστού: <a href="https://bibleox.com/el/gr-lxx-byz/is/53/">Ησ 53</a>: «<strong>αὐτὸς δὲ ἐτραυματίσθη διὰ τὰς ἀνομίας ἡμῶν</strong> <strong>καὶ μεμαλάκισται διὰ τὰς ἁμαρτίας ἡμῶν· παιδεία εἰρήνης ἡμῶν ἐπ᾿ αὐτόν, τῷ μώλωπι αὐτοῦ ἡμεῖς ἰάθημεν</strong>. πάντες ὡς πρόβατα ἐπλανήθημεν, ἄνθρωπος τῇ ὁδῷ αὐτοῦ ἐπλανήθη· καὶ κύριος παρέδωκεν αὐτὸν ταῖς ἁμαρτίαις ἡμῶν. καὶ <strong>αὐτὸς διὰ τὸ κεκακῶσθαι</strong> οὐκ ἀνοίγει τὸ στόμα· <strong>ὡς πρόβατον ἐπὶ σφαγὴν ἤχθη</strong> καὶ ὡς ἀμνὸς ἐναντίον τοῦ κείροντος αὐτὸν ἄφωνος οὕτως οὐκ ἀνοίγει τὸ στόμα αὐτοῦ. ἐν τῇ ταπεινώσει ἡ κρίσις αὐτοῦ ἤρθη· τὴν γενεὰν αὐτοῦ τίς διηγήσεται; ὅτι αἴρεται ἀπὸ τῆς γῆς ἡ ζωὴ αὐτοῦ, ἀπὸ τῶν ἀνομιῶν τοῦ λαοῦ μου <strong>ἤχθη εἰς θάνατον</strong>. <strong>καὶ δώσω τοὺς πονηροὺς ἀντὶ τῆς ταφῆς αὐτοῦ καὶ τοὺς πλουσίους ἀντὶ τοῦ θανάτου αὐτοῦ</strong>· ὅτι ἀνομίαν οὐκ ἐποίησεν, οὐδὲ εὑρέθη δόλος ἐν τῷ στόματι αὐτοῦ. <strong>καὶ κύριος βούλεται καθαρίσαι αὐτὸν τῆς πληγῆς· ἐὰν δῶτε περὶ ἁμαρτίας</strong>, ἡ ψυχὴ ὑμῶν ὄψεται σπέρμα μακρόβιον· καὶ βούλεται κύριος ἀφελεῖν <strong>ἀπὸ τοῦ πόνου τῆς ψυχῆς αὐτοῦ, δεῖξαι αὐτῷ φῶς</strong> καὶ πλάσαι τῇ συνέσει, δικαιῶσαι δίκαιον <strong>εὖ δουλεύοντα πολλοῖς</strong>, καὶ τὰς ἁμαρτίας αὐτῶν αὐτὸς ἀνοίσει. διὰ τοῦτο αὐτὸς κληρονομήσει πολλοὺς καὶ τῶν ἰσχυρῶν μεριεῖ σκῦλα, ἀνθ᾿ ὧν <strong>παρεδόθη εἰς θάνατον ἡ ψυχὴ αὐτοῦ, καὶ ἐν τοῖς ἀνόμοις ἐλογίσθη</strong>· καὶ αὐτὸς ἁμαρτίας πολλῶν ἀνήνεγκεν καὶ διὰ τὰς ἁμαρτίας αὐτῶν παρεδόθη.» (<a href="https://bibleox.com/el/gr-lxx-byz/is/53/#L5-12">Ησ 53:5-12</a>)</p></li></ol><h2>Τύποι των παθών του Χριστού</h2><ol><li><p>Ο Θεός καθιέρωσε τον τρόπο αφιέρωσης του αρχιερέα: ο αρχιερέας και οι ιερείς έθεταν τα χέρια τους πάνω στο μοσχάρι και έπειτα το έσφαζαν στην είσοδο της Σκηνής του Μαρτυρίου (<a href="https://bibleox.com/el/gr-lxx-byz/ish/29/#L10-11">Έξ 29:10-11</a>). Επίσης, οι αρχιερείς και οι ιερείς συνωμότησαν να συλλάβουν νύχτα τον Χριστό (<a href="https://bibleox.com/el/gr-lxx-byz/mf/26/#L45-47">Μτ 26:45-47</a>) και έπειτα τον εκτέλεσαν στην είσοδο της πόλης της Ιερουσαλήμ (<a href="https://bibleox.com/el/gr-lxx-byz/evr/13/#L12">Εβρ 13:12</a>).</p></li><li><p>Κατόπιν, στο ίδιο σημείο. Με το αίμα του μοσχαριού χρίονται τα κέρατα του θυσιαστηρίου, και το υπόλοιπο αίμα χύνεται στη βάση του θυσιαστηρίου (<a href="https://bibleox.com/el/gr-lxx-byz/ish/29/#L12">Έξ 29:12</a>). Το θυσιαστήριο, πάνω στο οποίο προσφέρθηκε ο Χριστός, ήταν ο σταυρός. Με το αίμα του Χριστού χρίστηκε ο σταυρός, καθώς τα χέρια και τα πόδια του Χριστού καρφώθηκαν με καρφιά και έπειτα τρυπήθηκαν με λόγχη, και το αίμα έτρεχε στη βάση του σταυρού (του θυσιαστηρίου).</p></li><li><p>Μετά την ολοκλήρωση του τυπικού της αφιέρωσης, το θυσιαστήριο γινόταν μέγα αγίασμα: ό,τι το άγγιζε θα αγιαζόταν (<a href="https://bibleox.com/el/gr-lxx-byz/ish/29/#L37">Έξ 29:37</a>). Παρόμοια, ο σταυρός (το θυσιαστήριο) έγινε μέγα αγίασμα για τους χριστιανούς, που χρησιμοποιείται για τον αγιασμό νερού, αντικειμένων και ανθρώπων. Χρησιμοποιείται ως αντικείμενο στη διαδικασία αγιασμού του νερού, ενώ το σημείο του σταυρού με το χέρι απεικονίζεται πάνω σε ανθρώπους και αντικείμενα.</p></li></ol><h2>Προφητείες για τα πάθη του Χριστού</h2><ol><li><p>Ο Χριστός θα αποκαλεί τον εαυτό του Υιό του Θεού·</p></li><li><p>Τα λόγια και τα έργα του θα ελέγχουν τους αντιπάλους του·</p></li><li><p>Θα αποκαλεί πατέρα του τον Θεό·</p></li><li><p>Οι αντίπαλοι του Χριστού θα τον υβρίζουν και θα τον βασανίζουν·</p></li><li><p>Θα τον καταδικάσουν σε άτιμο θάνατο.</p></li></ol><blockquote><p>«ἐνεδρεύσωμεν τὸν δίκαιον, ὅτι <strong>δύσχρηστος ἡμῖν ἐστιν</strong> καὶ <strong>ἐναντιοῦται τοῖς ἔργοις ἡμῶν</strong> καὶ <strong>ὀνειδίζει ἡμῖν ἁμαρτήματα</strong> <strong>νόμου</strong> καὶ <strong>ἐπιφημίζει ἡμῖν ἁμαρτήματα</strong> παιδείας ἡμῶν· <strong>ἐπαγγέλλεται γνῶσιν ἔχειν θεοῦ</strong> καὶ <strong>παῖδα κυρίου ἑαυτὸν ὀνομάζει</strong>· ἐγένετο ἡμῖν <strong>εἰς ἔλεγχον ἐννοιῶν ἡμῶν</strong>, <strong>βαρύς ἐστιν ἡμῖν καὶ βλεπόμενος, ὅτι ἀνόμοιος τοῖς ἄλλοις ὁ βίος αὐτοῦ, καὶ ἐξηλλαγμέναι αἱ τρίβοι αὐτοῦ· εἰς κίβδηλον ἐλογίσθημεν αὐτῷ, καὶ ἀπέχεται τῶν ὁδῶν ἡμῶν</strong> ὡς ἀπὸ ἀκαθαρσιῶν· μακαρίζει ἔσχατα δικαίων καὶ <strong>ἀλαζονεύεται πατέρα θεόν</strong>. ἴδωμεν εἰ οἱ λόγοι αὐτοῦ ἀληθεῖς, καὶ πειράσωμεν τὰ ἐν ἐκβάσει αὐτοῦ· <strong>εἰ γάρ ἐστιν ὁ δίκαιος υἱὸς θεοῦ, ἀντιλήμψεται αὐτοῦ καὶ ῥύσεται αὐτὸν ἐκ χειρὸς ἀνθεστηκότων</strong>. <strong>ὕβρει καὶ βασάνῳ ἐτάσωμεν αὐτόν</strong>, ἵνα γνῶμεν τὴν ἐπιείκειαν αὐτοῦ καὶ δοκιμάσωμεν τὴν ἀνεξικακίαν αὐτοῦ· <strong>θανάτῳ ἀσχήμονι καταδικάσωμεν αὐτόν</strong>, ἔσται γὰρ αὐτοῦ ἐπισκοπὴ ἐκ λόγων αὐτοῦ. Ταῦτα ἐλογίσαντο, καὶ ἐπλανήθησαν· <strong>ἀπετύφλωσεν γὰρ αὐτοὺς ἡ κακία αὐτῶν</strong>,» (<a href="https://bibleox.com/el/gr-lxx-byz/prs/2/#L12-21">Σ.Σολ 2:12-21</a>)</p></blockquote><h2>Κριτική</h2><h3>Τα χέρια και τα πόδια διαπέρασαν ή τα σπαράσσει λέων;</h3><p>Το ύστερο μασοριτικό κείμενο δεν περιέχει στον <a href="https://bibleox.com/el/gr-lxx-byz/ps/21/#L16">Ψλ 21:16</a> λέξεις για το τρύπημα των χεριών και των ποδιών. Αντ'' αυτού, εκεί υπάρχει η λέξη «λέων». Η λέξη «σπαράσσω» (ρήμα) δεν υπάρχει καθόλου στο κείμενο, και δεν είναι σαφές πώς οι ενέργειες του λέοντα σχετίζονται με τα χέρια και τα πόδια.</p><p>Ωστόσο, το ορθό είναι «διαπέρασαν». Στο αρχαίο χειρόγραφο του Κουμράν 4Q88[2] επιβεβαιώνεται ότι τα χέρια και τα πόδια διαπέρασαν.</p><p>Επιπλέον, υπάρχει άλλη μια προφητεία για το ότι διαπέρασαν. Αναφέρεται εδώ:</p><blockquote><p>«καὶ πάλιν ἑτέρα γραφὴ λέγει, <strong>Ὄψονται εἰς ὃν <mark>ἐξεκέντησαν</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/19/#L37">Ιω 19:37</a>)</p></blockquote><p>Η αναφορά εδώ (στη μετάφραση των Ο΄ το ρήμα αποδίδεται «κατωρχήσαντο», ενώ το εβραϊκό κείμενο έχει «דָּקָרוּ» — «διαπέρασαν»):</p><blockquote><p>«καὶ ἐκχεῶ ἐπὶ τὸν οἶκον Δαυιδ καὶ ἐπὶ τοὺς κατοικοῦντας Ιερουσαλημ πνεῦμα χάριτος καὶ οἰκτιρμοῦ, καὶ ἐπιβλέψονται πρός με ἀνθ᾿ ὧν <strong><mark>κατωρχήσαντο</mark></strong> καὶ κόψονται ἐπ᾿ αὐτὸν κοπετὸν ὡς ἐπ᾿ ἀγαπητὸν καὶ ὀδυνηθήσονται ὀδύνην ὡς ἐπὶ πρωτοτόκῳ.» (<a href="https://bibleox.com/el/gr-lxx-byz/zah/12/#L10">Ζαχ 12:10</a>)</p></blockquote><blockquote><p>"וְשָׁפַכְתִּי עַל ־ בֵּית דָּוִיד וְעַל ׀ יוֹשֵׁב יְרוּשָׁלִַם רוּחַ חֵן וְתַחֲנוּנִים וְהִבִּיטוּ אֵלַי אֵת אֲשֶׁר ־ <strong>דָּקָרוּ</strong> וְסָפְדוּ עָלָיו כְּמִסְפֵּד עַל ־ הַיָּחִיד וְהָמֵר עָלָיו כְּהָמֵר עַֽל ־ הַבְּכֽוֹר ׃" (<a href="https://bibleox.com/el/heb-osm/zah/12/#L10">Ζαχ 12:10</a>)</p></blockquote><p>דָּקָ֑רוּ</p><p>דקר — διαπερνώ, τρυπώ, και διαπερνιέμαι, τρυπιέμαι.</p><p>Το χειρόγραφο 4Q80[1] του Κουμράν επιβεβαιώνει ότι διαπέρασαν.</p>'
- src: семь-церквей-апокалипсиса
