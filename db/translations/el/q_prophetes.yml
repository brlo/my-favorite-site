  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: '<h2>Γεγονότα πριν από τη δεύτερη παρουσία του Χριστού</h2><h3>Η βραχύβια βασιλεία του αντιχρίστου πάνω στη γη</h3><blockquote><p>«Ἐρωτῶμεν δὲ ὑμᾶς, ἀδελφοί, ὑπὲρ τῆς παρουσίας τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ καὶ ἡμῶν ἐπισυναγωγῆς ἐπ᾿ αὐτόν, εἰς τὸ μὴ ταχέως σαλευθῆναι ὑμᾶς ἀπὸ τοῦ νοὸς μηδὲ θροεῖσθαι μήτε διὰ πνεύματος μήτε διὰ λόγου μήτε δι᾿ ἐπιστολῆς ὡς δι᾿ ἡμῶν, ὡς ὅτι ἐνέστηκεν ἡ ἡμέρα τοῦ κυρίου. μή τις ὑμᾶς ἐξαπατήσῃ κατὰ μηδένα τρόπον· ὅτι <strong>ἐὰν μὴ ἔλθῃ ἡ ἀποστασία πρῶτον καὶ ἀποκαλυφθῇ ὁ ἄνθρωπος τῆς ἀνομίας, ὁ υἱὸς τῆς ἀπωλείας</strong>,» (<a href="https://bibleox.com/el/gr-lxx-byz/2sol/2/#L1-3">Β Θεσ 2:1-3</a>)</p></blockquote><p>Περισσότερα παρακάτω</p><h2>Τα γεγονότα της Δεύτερης Παρουσίας του Κυρίου Ιησού Χριστού</h2><h3>Στον ουρανό θα φανεί ο σταυρός</h3><blockquote><p>«καὶ τότε <strong>φανήσεται τὸ σημεῖον τοῦ υἱοῦ τοῦ ἀνθρώπου ἐν οὐρανῷ</strong>, καὶ τότε κόψονται πᾶσαι αἱ φυλαὶ τῆς γῆς καὶ ὄψονται τὸν υἱὸν τοῦ ἀνθρώπου ἐρχόμενον ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ μετὰ δυνάμεως καὶ δόξης πολλῆς·» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/24/#L30">Μτ 24:30</a>)</p></blockquote><h3>Ο Χριστός θα έρθει με όλους τους αγίους αγγέλους</h3><p>Η δεύτερη παρουσία του Χριστού θα γίνει στη δόξα του Πατέρα, με όλους τους αγίους αγγέλους:</p><blockquote><p><em>«Ὅταν δὲ </em><strong><em>ἔλθῃ ὁ υἱὸς τοῦ ἀνθρώπου</em></strong><em> ἐν τῇ δόξῃ αὐτοῦ </em><strong><em>καὶ <mark>πάντες</mark> οἱ ἄγγελοι μετ᾿ αὐτοῦ</em></strong><em>, τότε καθίσει ἐπὶ θρόνου δόξης αὐτοῦ·» (</em><a href="https://bibleox.com/el/gr-lxx-byz/mf/25/#L31"><em>Μτ 25:31</em></a><em>)</em></p></blockquote><blockquote><p><em>«ὃς γὰρ ἐὰν ἐπαισχυνθῇ με καὶ τοὺς ἐμοὺς λόγους ἐν τῇ γενεᾷ ταύτῃ τῇ μοιχαλίδι καὶ ἁμαρτωλῷ, καὶ ὁ υἱὸς τοῦ ἀνθρώπου ἐπαισχυνθήσεται αὐτὸν ὅταν </em><strong><em>ἔλθῃ ἐν τῇ δόξῃ τοῦ πατρὸς αὐτοῦ μετὰ τῶν ἀγγέλων <mark>τῶν ἁγίων</mark></em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/mk/8/#L38"><em>Μκ 8:38</em></a><em>)</em></p></blockquote><blockquote><p><em>«μέλλει γὰρ </em><strong><em>ὁ υἱὸς τοῦ ἀνθρώπου ἔρχεσθαι ἐν τῇ δόξῃ τοῦ πατρὸς αὐτοῦ <mark>μετὰ τῶν ἀγγέλων αὐτοῦ</mark></em></strong><em>, καὶ τότε ἀποδώσει ἑκάστῳ κατὰ τὴν πρᾶξιν αὐτοῦ.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/mf/16/#L27"><em>Μτ 16:27</em></a><em>)</em></p></blockquote><blockquote><p><em>«Προεφήτευσεν δὲ καὶ τούτοις ἕβδομος ἀπὸ Ἀδὰμ Ἑνὼχ λέγων, Ἰδοὺ </em><strong><em>ἦλθεν κύριος <mark>ἐν ἁγίαις μυριάσιν</mark> αὐτοῦ</em></strong><em>,» (</em><a href="https://bibleox.com/el/gr-lxx-byz/iud/1/#L14"><em>Ιούδα 1:14</em></a><em>)</em></p></blockquote><blockquote><p><em>«</em><strong><em>ἐν τῇ παρουσίᾳ τοῦ κυρίου ἡμῶν Ἰησοῦ <mark>μετὰ πάντων τῶν ἁγίων</mark> αὐτοῦ</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/1sol/3/#L13"><em>Α Θεσ 3:13</em></a><em>)</em></p></blockquote><blockquote><p><em>«</em><strong><em>ἐν τῇ ἀποκαλύψει τοῦ κυρίου Ἰησοῦ ἀπ᾿ οὐρανοῦ <mark>μετ᾿ ἀγγέλων</mark></em></strong><em> δυνάμεως αὐτοῦ» (</em><a href="https://bibleox.com/el/gr-lxx-byz/2sol/1/#L7"><em>Β Θεσ 1:7</em></a><em>)</em></p></blockquote><blockquote><p><em>«</em><strong><em>ἥξει</em></strong><em> </em><strong><em>κύριος ὁ θεός</em></strong><em> μου </em><strong><em>καὶ</em></strong><em> </em><strong><em><mark>πάντες οἱ ἅγιοι</mark> μετ᾿ αὐτοῦ</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/zah/14/#L5"><em>Ζαχ 14:5</em></a><em>)</em></p></blockquote><h3>Ο Χριστός θα πραγματοποιήσει την καθολική ανάσταση των νεκρών</h3><p>Η καθολική ανάσταση όλων των ανθρώπων που έζησαν ποτέ: δικαίων και αδίκων:</p><blockquote><p>«ἐλπίδα ἔχων εἰς τὸν θεόν, ἣν καὶ αὐτοὶ οὗτοι προσδέχονται, <strong>ἀνάστασιν μέλλειν ἔσεσθαι δικαίων τε καὶ ἀδίκων</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/24/#L15">Πραξ 24:15</a>)</p></blockquote><p>Η ανάσταση θα γίνει σε μεταμορφωμένα άφθαρτα σώματα· οι δίκαιοι θα λάμψουν σαν τον ήλιο:</p><blockquote><p>«Τότε <strong>οἱ δίκαιοι ἐκλάμψουσιν ὡς ὁ ἥλιος</strong> ἐν τῇ βασιλείᾳ τοῦ πατρὸς αὐτῶν. ὁ ἔχων ὦτα ἀκουέτω.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/13/#L43">Μτ 13:43</a>)</p></blockquote><p>Οι άνθρωποι που πέθαναν πριν από τη Δεύτερη Παρουσία έμεναν με τις ψυχές τους σε τόπους αναμονής της ανάστασης. Οι ψυχές των δικαίων χαίρονταν μαζί με τον Χριστό στον ουρανό (<a href="https://bibleox.com/el/gr-lxx-byz/evr/12/#L22-23">Εβρ 12:22-23</a>· <a href="https://bibleox.com/el/gr-lxx-byz/otkr/6/#L9-11">Απ 6:9-11</a>), ενώ οι ψυχές των αμαρτωλών βρίσκονταν σε άλλον τόπο και υπέφεραν (<a href="https://bibleox.com/el/gr-lxx-byz/lk/16/#L23">Λκ 16:23</a>).</p><p>Τα σώματα εκείνων των ανθρώπων που μέχρι τη Δεύτερη Παρουσία του Χριστού δεν θα έχουν ακόμη δει τον θάνατο, θα αλλάξουν όπως και τα σώματα των αναστημένων από τους νεκρούς:</p><blockquote><p>«Οὕτως καὶ <strong>ἡ ἀνάστασις τῶν νεκρῶν</strong>. σπείρεται ἐν φθορᾷ, ἐγείρεται ἐν ἀφθαρσίᾳ· &lt;…&gt; σπείρεται σῶμα ψυχικόν, ἐγείρεται σῶμα πνευματικόν. εἰ ἔστιν σῶμα ψυχικόν, ἔστιν καὶ πνευματικόν. &lt;…&gt; ἰδοὺ μυστήριον ὑμῖν λέγω· <strong><mark>πάντες οὐ κοιμηθησόμεθα, πάντες δὲ ἀλλαγησόμεθα, ἐν ἀτόμῳ, ἐν ῥιπῇ ὀφθαλμοῦ</mark></strong>, ἐν τῇ ἐσχάτῃ σάλπιγγι· σαλπίσει γάρ, καὶ <strong><mark>οἱ νεκροὶ ἐγερθήσονται ἄφθαρτοι, καὶ ἡμεῖς ἀλλαγησόμεθα</mark></strong>. <strong>δεῖ γὰρ τὸ φθαρτὸν τοῦτο ἐνδύσασθαι ἀφθαρσίαν</strong> καὶ τὸ θνητὸν τοῦτο ἐνδύσασθαι ἀθανασίαν.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/15/#L42,44,51-53">Α Κορ 15:42,44,51-53</a>)</p></blockquote><blockquote><p>«Οὐ θέλομεν δὲ ὑμᾶς ἀγνοεῖν, ἀδελφοί, περὶ τῶν κοιμωμένων, ἵνα μὴ λυπῆσθε καθὼς καὶ οἱ λοιποὶ οἱ μὴ ἔχοντες ἐλπίδα. εἰ γὰρ πιστεύομεν ὅτι Ἰησοῦς ἀπέθανεν καὶ ἀνέστη, οὕτως καὶ ὁ θεὸς τοὺς κοιμηθέντας διὰ τοῦ Ἰησοῦ ἄξει σὺν αὐτῷ. Τοῦτο γὰρ ὑμῖν λέγομεν ἐν λόγῳ κυρίου, ὅτι <strong>ἡμεῖς οἱ <mark>ζῶντες</mark> οἱ <mark>περιλειπόμενοι εἰς τὴν παρουσίαν τοῦ κυρίου</mark> οὐ μὴ φθάσωμεν τοὺς κοιμηθέντας</strong>· ὅτι <strong><mark>αὐτὸς ὁ κύριος</mark></strong> ἐν κελεύσματι, ἐν φωνῇ ἀρχαγγέλου καὶ ἐν σάλπιγγι θεοῦ, <strong><mark>καταβήσεται ἀπ᾿ οὐρανοῦ, καὶ οἱ νεκροὶ ἐν Χριστῷ ἀναστήσονται πρῶτον</mark></strong>, <strong>ἔπειτα ἡμεῖς οἱ ζῶντες οἱ <mark>περιλειπόμενοι</mark></strong> <strong>ἅμα σὺν αὐτοῖς ἁρπαγησόμεθα ἐν νεφέλαις εἰς ἀπάντησιν τοῦ κυρίου</strong> εἰς ἀέρα· καὶ οὕτως πάντοτε σὺν κυρίῳ ἐσόμεθα.» (<a href="https://bibleox.com/el/gr-lxx-byz/1sol/4/#L13-17">Α Θεσ 4:13-17</a>)</p></blockquote><h3>Ο Χριστός θα στείλει αγγέλους να συγκεντρώσουν όλους τους ανθρώπους για κρίση</h3><p>Οι άγγελοι θα συγκεντρώσουν δικαίους και αδίκους:</p><blockquote><p>«καὶ τότε <strong>ἀποστελεῖ τοὺς ἀγγέλους</strong> καὶ <strong>ἐπισυνάξει τοὺς ἐκλεκτοὺς</strong> [αὐτοῦ] ἐκ τῶν τεσσάρων ἀνέμων ἀπ᾿ ἄκρου γῆς ἕως ἄκρου οὐρανοῦ.» (<a href="https://bibleox.com/el/gr-lxx-byz/mk/13/#L27">Μκ 13:27</a>)</p></blockquote><blockquote><p>«<strong>ἀποστελεῖ ὁ υἱὸς τοῦ ἀνθρώπου τοὺς ἀγγέλους αὐτοῦ, καὶ συλλέξουσιν</strong> ἐκ τῆς βασιλείας αὐτοῦ πάντα τὰ σκάνδαλα καὶ τοὺς <strong>ποιοῦντας τὴν ἀνομίαν</strong>,» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/13/#L41">Μτ 13:41</a>)</p></blockquote><h3>Ο Χριστός θα εκφέρει την καταδίκη</h3><blockquote><p>«Ὅταν δὲ ἔλθῃ ὁ υἱὸς τοῦ ἀνθρώπου ἐν τῇ δόξῃ αὐτοῦ καὶ πάντες οἱ ἄγγελοι μετ᾿ αὐτοῦ, τότε <strong>καθίσει ἐπὶ θρόνου δόξης αὐτοῦ</strong>· καὶ συναχθήσονται ἔμπροσθεν αὐτοῦ πάντα τὰ ἔθνη, καὶ ἀφορίσει αὐτοὺς ἀπ᾿ ἀλλήλων, ὥσπερ ὁ ποιμὴν ἀφορίζει τὰ πρόβατα ἀπὸ τῶν ἐρίφων, καὶ στήσει τὰ μὲν πρόβατα ἐκ δεξιῶν αὐτοῦ τὰ δὲ ἐρίφια ἐξ εὐωνύμων. τότε ἐρεῖ ὁ βασιλεὺς τοῖς ἐκ δεξιῶν αὐτοῦ, <strong>Δεῦτε, οἱ εὐλογημένοι τοῦ πατρός μου, κληρονομήσατε τὴν ἡτοιμασμένην ὑμῖν βασιλείαν</strong> ἀπὸ καταβολῆς κόσμου· ἐπείνασα γὰρ καὶ ἐδώκατέ μοι φαγεῖν, ἐδίψησα καὶ ἐποτίσατέ με, ξένος ἤμην καὶ συνηγάγετέ με, γυμνὸς καὶ περιεβάλετέ με, ἠσθένησα καὶ ἐπεσκέψασθέ με, ἐν φυλακῇ ἤμην καὶ ἤλθατε πρός με. τότε ἀποκριθήσονται αὐτῷ οἱ δίκαιοι λέγοντες, Κύριε, πότε σε εἴδομεν πεινῶντα καὶ ἐθρέψαμεν, ἢ διψῶντα καὶ ἐποτίσαμεν; πότε δέ σε εἴδομεν ξένον καὶ συνηγάγομεν, ἢ γυμνὸν καὶ περιεβάλομεν; πότε δέ σε εἴδομεν ἀσθενοῦντα ἢ ἐν φυλακῇ καὶ ἤλθομεν πρός σε; καὶ ἀποκριθεὶς ὁ βασιλεὺς ἐρεῖ αὐτοῖς, Ἀμὴν λέγω ὑμῖν, ἐφ᾿ ὅσον ἐποιήσατε ἑνὶ τούτων τῶν ἀδελφῶν μου τῶν ἐλαχίστων, ἐμοὶ ἐποιήσατε. Τότε ἐρεῖ καὶ τοῖς ἐξ εὐωνύμων, <strong>Πορεύεσθε ἀπ᾿ ἐμοῦ [οἱ] κατηραμένοι εἰς τὸ πῦρ τὸ αἰώνιον</strong> τὸ ἡτοιμασμένον τῷ διαβόλῳ καὶ τοῖς ἀγγέλοις αὐτοῦ· ἐπείνασα γὰρ καὶ οὐκ ἐδώκατέ μοι φαγεῖν, ἐδίψησα καὶ οὐκ ἐποτίσατέ με, ξένος ἤμην καὶ οὐ συνηγάγετέ με, γυμνὸς καὶ οὐ περιεβάλετέ με, ἀσθενὴς καὶ ἐν φυλακῇ καὶ οὐκ ἐπεσκέψασθέ με. τότε ἀποκριθήσονται καὶ αὐτοὶ λέγοντες, Κύριε, πότε σε εἴδομεν πεινῶντα ἢ διψῶντα ἢ ξένον ἢ γυμνὸν ἢ ἀσθενῆ ἢ ἐν φυλακῇ καὶ οὐ διηκονήσαμέν σοι; τότε ἀποκριθήσεται αὐτοῖς λέγων, Ἀμὴν λέγω ὑμῖν, ἐφ᾿ ὅσον οὐκ ἐποιήσατε ἑνὶ τούτων τῶν ἐλαχίστων, οὐδὲ ἐμοὶ ἐποιήσατε. καὶ ἀπελεύσονται οὗτοι εἰς κόλασιν αἰώνιον, οἱ δὲ δίκαιοι εἰς ζωὴν αἰώνιον.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/25/#L31-46">Μτ 25:31-46</a>)</p></blockquote><h3>Οι σωσμένοι θα οδηγηθούν στην αιώνια ζωή με τον Χριστό</h3><p>Πριν βρίσκονταν με τον Χριστό μόνο με τις ψυχές τους, περιμένοντας την ανάσταση των σωμάτων. Τώρα όμως οι δίκαιοι οδηγούνται στην αιώνια ζωή με τον Χριστό, έχοντας ήδη λάβει τα μεταμορφωμένα τους σώματα (αναστημένοι):</p><blockquote><p>«ὅτι αὐτὸς ὁ κύριος ἐν κελεύσματι, ἐν φωνῇ ἀρχαγγέλου καὶ ἐν σάλπιγγι θεοῦ, καταβήσεται ἀπ᾿ οὐρανοῦ, καὶ οἱ νεκροὶ ἐν Χριστῷ ἀναστήσονται πρῶτον, ἔπειτα ἡμεῖς οἱ ζῶντες οἱ περιλειπόμενοι <strong>ἅμα σὺν αὐτοῖς ἁρπαγησόμεθα ἐν νεφέλαις εἰς ἀπάντησιν τοῦ κυρίου εἰς ἀέρα· καὶ οὕτως πάντοτε σὺν κυρίῳ ἐσόμεθα</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1sol/4/#L16-17">Α Θεσ 4:16-17</a>)</p></blockquote><h3>Οι χαμένοι θα σταλούν σε αιώνια τιμωρία</h3><blockquote><p>«καὶ <strong>ἀπελεύσονται οὗτοι εἰς κόλασιν αἰώνιον</strong>, οἱ δὲ δίκαιοι εἰς ζωὴν αἰώνιον.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/25/#L46">Μτ 25:46</a>)</p></blockquote><p>Και η σωτηρία και η τιμωρία, όπως είναι γραμμένο, θα είναι αιώνιες.</p><h2>Σημαντικές λεπτομέρειες της Δεύτερης Παρουσίας</h2><h3>Η παρουσία — σαν αστραπή</h3><p>Η δεύτερη παρουσία του Χριστού θα γίνει αμέσως γνωστή σε όλους σε όλο τον κόσμο, σαν αστραπή που αστράφτει:</p><blockquote><p><em>«καὶ </em><strong><em>ἐροῦσιν ὑμῖν, Ἰδοὺ ἐκεῖ</em></strong><em>· [ἤ,] Ἰδοὺ ὧδε· </em><strong><em>μὴ ἀπέλθητε μηδὲ διώξητε</em></strong><em>. </em><strong><em>ὥσπερ γὰρ ἡ ἀστραπὴ</em></strong><em> ἀστράπτουσα ἐκ τῆς ὑπὸ τὸν οὐρανὸν εἰς τὴν ὑπ᾿ οὐρανὸν λάμπει, </em><strong><em>οὕτως ἔσται ὁ υἱὸς τοῦ ἀνθρώπου [ἐν τῇ ἡμέρᾳ αὐτοῦ</em></strong><em>].» (</em><a href="https://bibleox.com/el/gr-lxx-byz/lk/17/#L23-24"><em>Λκ 17:23-24</em></a><em>)</em></p></blockquote><blockquote><p><em>«ἐὰν οὖν </em><strong><em>εἴπωσιν ὑμῖν, Ἰδοὺ ἐν τῇ ἐρήμῳ ἐστίν</em></strong><em>, μὴ ἐξέλθητε· Ἰδοὺ ἐν τοῖς ταμείοις, μὴ πιστεύσητε· </em><strong><em>ὥσπερ γὰρ ἡ ἀστραπὴ ἐξέρχεται ἀπὸ ἀνατολῶν καὶ φαίνεται ἕως δυσμῶν, οὕτως ἔσται ἡ παρουσία τοῦ υἱοῦ τοῦ ἀνθρώπου</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/mf/24/#L26-27"><em>Μτ 24:26-27</em></a><em>)</em></p></blockquote><h3>Ο Χριστός θα έρθει στο ίδιο ενήλικο σώμα</h3><p>Ο Χριστός δεν θα γεννηθεί ξανά από ανθρώπους, αλλά θα έρθει στο σώμα που ήδη έχει, το οποίο έλαβε με τη γέννησή του από την Παρθένο Μαρία τη Θεοτόκο το 1 μ.Χ.:</p><blockquote><p><em>«καὶ ταῦτα εἰπὼν βλεπόντων αὐτῶν ἐπήρθη, καὶ νεφέλη ὑπέλαβεν αὐτὸν ἀπὸ τῶν ὀφθαλμῶν αὐτῶν. καὶ ὡς ἀτενίζοντες ἦσαν εἰς τὸν οὐρανὸν πορευομένου αὐτοῦ, καὶ ἰδοὺ ἄνδρες δύο παρειστήκεισαν αὐτοῖς ἐν ἐσθήσεσι λευκαῖς, οἳ καὶ εἶπαν, Ἄνδρες Γαλιλαῖοι, τί ἑστήκατε βλέποντες εἰς τὸν οὐρανόν; </em><strong><em>οὗτος ὁ Ἰησοῦς ὁ ἀναλημφθεὶς ἀφ᾿ ὑμῶν εἰς τὸν οὐρανὸν οὕτως ἐλεύσεται ὃν τρόπον ἐθεάσασθε αὐτὸν πορευόμενον εἰς τὸν οὐρανόν</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/act/1/#L9-11"><em>Πραξ 1:9-11</em></a><em>)</em></p></blockquote><h3>Η παρουσία για κρίση</h3><p>Ο Κύριος θα έρθει όχι για να διδάξει, αλλά για να κρίνει με τον λόγο που ήδη έδωσε, όταν ήρθε την πρώτη φορά:</p><blockquote><p><em>«ὁ ἀθετῶν ἐμὲ καὶ μὴ λαμβάνων τὰ ῥήματά μου ἔχει τὸν κρίνοντα αὐτόν· </em><strong><em>ὁ λόγος ὃν ἐλάλησα ἐκεῖνος <mark>κρινεῖ</mark> αὐτὸν ἐν τῇ ἐσχάτῃ ἡμέρᾳ</em></strong><em>·» (</em><a href="https://bibleox.com/el/gr-lxx-byz/in/12/#L48"><em>Ιω 12:48</em></a><em>)</em></p></blockquote><blockquote><p><em>«μέλλει γὰρ ὁ υἱὸς τοῦ ἀνθρώπου ἔρχεσθαι ἐν τῇ δόξῃ τοῦ πατρὸς αὐτοῦ μετὰ τῶν ἀγγέλων αὐτοῦ, καὶ τότε </em><strong><em><mark>ἀποδώσει ἑκάστῳ</mark> κατὰ τὴν πρᾶξιν αὐτοῦ</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/mf/16/#L27"><em>Μτ 16:27</em></a><em>)</em></p></blockquote><blockquote><p><em>«Ὅταν δὲ </em><strong><em>ἔλθῃ ὁ υἱὸς τοῦ ἀνθρώπου ἐν τῇ δόξῃ</em></strong><em> αὐτοῦ καὶ πάντες οἱ ἄγγελοι μετ᾿ αὐτοῦ, τότε </em><strong><em>καθίσει ἐπὶ θρόνου</em></strong><em> δόξης αὐτοῦ· καὶ </em><strong><em>συναχθήσονται ἔμπροσθεν αὐτοῦ πάντα τὰ ἔθνη</em></strong><em>, καὶ </em><strong><em><mark>ἀφορίσει αὐτοὺς ἀπ᾿ ἀλλήλων</mark></em></strong><em>, ὥσπερ ὁ ποιμὴν ἀφορίζει τὰ πρόβατα ἀπὸ τῶν ἐρίφων, καὶ στήσει τὰ μὲν πρόβατα ἐκ δεξιῶν αὐτοῦ τὰ δὲ ἐρίφια ἐξ εὐωνύμων. &lt;…&gt; καὶ </em><strong><em>ἀπελεύσονται οὗτοι εἰς κόλασιν αἰώνιον, οἱ δὲ δίκαιοι εἰς ζωὴν αἰώνιον</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/mf/25/#L31-33,46"><em>Μτ 25:31-33,46</em></a><em>)</em></p></blockquote><blockquote><p><em>«</em><strong><em><mark>ἔνδειγμα τῆς δικαίας κρίσεως τοῦ θεοῦ</mark></em></strong><em>, εἰς τὸ καταξιωθῆναι ὑμᾶς τῆς βασιλείας τοῦ θεοῦ, ὑπὲρ ἧς καὶ πάσχετε, εἴπερ δίκαιον παρὰ θεῷ ἀνταποδοῦναι τοῖς θλίβουσιν ὑμᾶς θλῖψιν καὶ ὑμῖν τοῖς θλιβομένοις ἄνεσιν μεθ᾿ ἡμῶν </em><strong><em>ἐν τῇ ἀποκαλύψει τοῦ κυρίου Ἰησοῦ ἀπ᾿ οὐρανοῦ μετ᾿ ἀγγέλων</em></strong><em> δυνάμεως αὐτοῦ </em><strong><em><mark>ἐν πυρὶ φλογός, διδόντος ἐκδίκησιν</mark></em></strong><em> τοῖς μὴ εἰδόσιν θεὸν καὶ τοῖς μὴ ὑπακούουσιν τῷ εὐαγγελίῳ τοῦ κυρίου ἡμῶν Ἰησοῦ,» (</em><a href="https://bibleox.com/el/gr-lxx-byz/2sol/1/#L5-8"><em>Β Θεσ 1:5-8</em></a><em>)</em></p></blockquote><h3>Η δεύτερη παρουσία και η κρίση είναι άρρηκτα συνδεδεμένες</h3><p>Κατά τη δεύτερη παρουσία του Χριστού γίνεται κρίση όλων ανεξαιρέτως των ανθρώπων, και όχι μόνο των αμαρτωλών. Τους μεν ο Κύριος θα ανταμείψει, τους δε θα τιμωρήσει:</p><blockquote><p><em>«Ὅταν δὲ </em><strong><em><mark>ἔλθῃ ὁ υἱὸς τοῦ ἀνθρώπου</mark> ἐν τῇ δόξῃ αὐτοῦ καὶ <mark>πάντες οἱ ἄγγελοι μετ᾿ αὐτοῦ</mark></em></strong><em>, τότε </em><strong><em>καθίσει ἐπὶ θρόνου</em></strong><em> δόξης αὐτοῦ· καὶ </em><strong><em>συναχθήσονται ἔμπροσθεν αὐτοῦ πάντα τὰ ἔθνη</em></strong><em>, καὶ </em><strong><em><mark>ἀφορίσει αὐτοὺς ἀπ᾿ ἀλλήλων</mark></em></strong><em>, ὥσπερ ὁ ποιμὴν ἀφορίζει τὰ πρόβατα ἀπὸ τῶν ἐρίφων, καὶ στήσει τὰ μὲν πρόβατα ἐκ δεξιῶν αὐτοῦ τὰ δὲ ἐρίφια ἐξ εὐωνύμων. &lt;…&gt; καὶ </em><strong><em><mark>ἀπελεύσονται οὗτοι εἰς κόλασιν αἰώνιον, οἱ δὲ δίκαιοι εἰς ζωὴν αἰώνιον</mark></em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/mf/25/#L31-33,46"><em>Μτ 25:31-33,46</em></a><em>)</em></p></blockquote><blockquote><p>«Καὶ εἶδον θρόνον μέγαν λευκὸν καὶ τὸν καθήμενον ἐπ᾿ αὐτόν, οὗ ἀπὸ τοῦ προσώπου ἔφυγεν ἡ γῆ καὶ ὁ οὐρανός, καὶ τόπος οὐχ εὑρέθη αὐτοῖς. καὶ εἶδον τοὺς νεκρούς, τοὺς μεγάλους καὶ τοὺς μικρούς, ἑστῶτας ἐνώπιον τοῦ θρόνου, καὶ βιβλία ἠνοίχθησαν· καὶ ἄλλο βιβλίον ἠνοίχθη, ὅ ἐστιν τῆς ζωῆς· καὶ <strong><mark>ἐκρίθησαν οἱ νεκροὶ ἐκ τῶν γεγραμμένων ἐν τοῖς βιβλίοις κατὰ τὰ ἔργα αὐτῶν</mark></strong>. καὶ ἔδωκεν ἡ θάλασσα τοὺς νεκροὺς τοὺς ἐν αὐτῇ, καὶ <strong>ὁ θάνατος καὶ ὁ ᾅδης ἔδωκαν τοὺς νεκροὺς τοὺς ἐν αὐτοῖς, καὶ ἐκρίθησαν ἕκαστος κατὰ τὰ ἔργα αὐτῶν</strong>. καὶ ὁ θάνατος καὶ ὁ ᾅδης ἐβλήθησαν εἰς τὴν λίμνην τοῦ πυρός. <strong>οὗτος ὁ θάνατος ὁ δεύτερός ἐστιν</strong>, ἡ λίμνη τοῦ πυρός. καὶ εἴ τις οὐχ εὑρέθη ἐν τῇ βίβλῳ τῆς ζωῆς γεγραμμένος ἐβλήθη εἰς τὴν λίμνην τοῦ πυρός.» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/20/#L11-15">Απ 20:11-15</a>)</p></blockquote><blockquote><p><em>«μέλλει γὰρ </em><strong><em><mark>ὁ υἱὸς τοῦ ἀνθρώπου ἔρχεσθαι</mark> ἐν τῇ δόξῃ τοῦ πατρὸς αὐτοῦ <mark>μετὰ τῶν ἀγγέλων αὐτοῦ</mark></em></strong><em>, καὶ τότε </em><strong><em><mark>ἀποδώσει ἑκάστῳ κατὰ τὴν πρᾶξιν αὐτοῦ</mark></em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/mf/16/#L27"><em>Μτ 16:27</em></a><em>)</em></p></blockquote><blockquote><p>«Ὅταν δὲ <strong><mark>ἔλθῃ ὁ υἱὸς τοῦ ἀνθρώπου</mark> ἐν τῇ δόξῃ αὐτοῦ καὶ πάντες οἱ ἄγγελοι μετ᾿ αὐτοῦ, τότε καθίσει ἐπὶ θρόνου</strong> δόξης αὐτοῦ· καὶ <strong>συναχθήσονται ἔμπροσθεν αὐτοῦ <mark>πάντα τὰ ἔθνη</mark></strong>, καὶ <strong><mark>ἀφορίσει</mark> αὐτοὺς ἀπ᾿ ἀλλήλων</strong>, ὥσπερ ὁ ποιμὴν ἀφορίζει τὰ πρόβατα ἀπὸ τῶν ἐρίφων, &lt;…&gt; τότε <strong><mark>ἐρεῖ ὁ βασιλεὺς τοῖς ἐκ δεξιῶν αὐτοῦ</mark></strong>, Δεῦτε, οἱ <strong><mark>εὐλογημένοι</mark></strong> τοῦ πατρός μου, κληρονομήσατε τὴν ἡτοιμασμένην ὑμῖν βασιλείαν ἀπὸ καταβολῆς κόσμου· &lt;…&gt; Τότε <strong><mark>ἐρεῖ καὶ τοῖς ἐξ εὐωνύμων</mark></strong>, Πορεύεσθε ἀπ᾿ ἐμοῦ [οἱ] <strong><mark>κατηραμένοι</mark></strong> εἰς τὸ πῦρ τὸ αἰώνιον τὸ ἡτοιμασμένον τῷ διαβόλῳ καὶ τοῖς ἀγγέλοις αὐτοῦ·» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/25/#L31-32,34,41">Μτ 25:31-32,34,41</a>)</p></blockquote><blockquote><p>«ἔνδειγμα τῆς δικαίας κρίσεως τοῦ θεοῦ, εἰς τὸ καταξιωθῆναι ὑμᾶς τῆς βασιλείας τοῦ θεοῦ, ὑπὲρ ἧς καὶ πάσχετε, εἴπερ δίκαιον παρὰ θεῷ <strong><mark>ἀνταποδοῦναι τοῖς θλίβουσιν ὑμᾶς θλῖψιν καὶ ὑμῖν τοῖς θλιβομένοις ἄνεσιν μεθ᾿ ἡμῶν ἐν τῇ ἀποκαλύψει τοῦ κυρίου Ἰησοῦ ἀπ᾿ οὐρανοῦ μετ᾿ ἀγγέλων δυνάμεως αὐτοῦ</mark></strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/2sol/1/#L5-7">Β Θεσ 1:5-7</a>)</p></blockquote><blockquote><p>«καὶ λέγει μοι, Μὴ σφραγίσῃς τοὺς λόγους τῆς προφητείας τοῦ βιβλίου τούτου, ὁ καιρὸς γὰρ ἐγγύς ἐστιν. <strong>ὁ ἀδικῶν ἀδικησάτω <mark>ἔτι</mark>, καὶ ὁ ῥυπαρὸς ῥυπανθήτω <mark>ἔτι</mark>, καὶ ὁ δίκαιος δικαιοσύνην ποιησάτω <mark>ἔτι</mark>, καὶ ὁ ἅγιος ἁγιασθήτω ἔτι. <mark>Ἰδοὺ ἔρχομαι ταχύ</mark>, καὶ ὁ μισθός μου μετ᾿ ἐμοῦ, <mark>ἀποδοῦναι ἑκάστῳ ὡς τὸ ἔργον ἐστὶν αὐτοῦ</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/22/#L10-12">Απ 22:10-12</a>)</p></blockquote><h3>Όλοι υπόκεινται σε κρίση</h3><blockquote><p><em>«</em><strong><em><mark>τοὺς γὰρ πάντας ἡμᾶς φανερωθῆναι δεῖ ἔμπροσθεν τοῦ βήματος τοῦ Χριστοῦ</mark></em></strong><em>, ἵνα κομίσηται ἕκαστος τὰ διὰ τοῦ σώματος πρὸς ἃ </em><strong><em><mark>ἔπραξεν</mark></em></strong><em>, </em><strong><em>εἴτε <mark>ἀγαθὸν</mark> εἴτε <mark>φαῦλον</mark></em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/2kor/5/#L10"><em>Β Κορ 5:10</em></a><em>)</em></p></blockquote><blockquote><p><em>«ὅτι </em><strong><em>σὺν πᾶν τὸ ποίημα ὁ θεὸς ἄξει ἐν κρίσει</em></strong><em> ἐν παντὶ παρεωραμένῳ, </em><strong><em>ἐὰν ἀγαθὸν καὶ ἐὰν πονηρόν</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/ekl/12/#L14"><em>Εκ 12:14</em></a><em>)</em></p></blockquote><blockquote><p>«ὅτι <strong>ὁ καιρὸς τοῦ ἄρξασθαι τὸ κρίμα ἀπὸ τοῦ οἴκου τοῦ θεοῦ· εἰ δὲ πρῶτον ἀφ᾿ ἡμῶν</strong>, τί τὸ τέλος τῶν ἀπειθούντων τῷ τοῦ θεοῦ εὐαγγελίῳ; καὶ εἰ ὁ δίκαιος μόλις σῴζεται, ὁ ἀσεβὴς καὶ ἁμαρτωλὸς ποῦ φανεῖται;» (<a href="https://bibleox.com/el/gr-lxx-byz/1pet/4/#L17-18">Α Πε 4:17-18</a>)</p></blockquote><blockquote><p>«σὺ δὲ τί κρίνεις τὸν ἀδελφόν σου; ἢ καὶ σὺ τί ἐξουθενεῖς τὸν ἀδελφόν σου; <strong>πάντες γὰρ παραστησόμεθα τῷ βήματι τοῦ θεοῦ</strong>·» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/14/#L10">Ρωμ 14:10</a>)</p></blockquote><blockquote><p>«οὕτως λαλεῖτε καὶ οὕτως <strong>ποιεῖτε ὡς διὰ νόμου ἐλευθερίας μέλλοντες κρίνεσθαι</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/iak/2/#L12">Ιακ 2:12</a>)</p></blockquote><blockquote><p>«Ὅταν δὲ ἔλθῃ ὁ υἱὸς τοῦ ἀνθρώπου ἐν τῇ δόξῃ αὐτοῦ καὶ πάντες οἱ ἄγγελοι μετ᾿ αὐτοῦ, τότε καθίσει ἐπὶ θρόνου δόξης αὐτοῦ· καὶ <strong>συναχθήσονται ἔμπροσθεν αὐτοῦ πάντα τὰ ἔθνη</strong>, καὶ ἀφορίσει αὐτοὺς ἀπ᾿ ἀλλήλων, ὥσπερ ὁ ποιμὴν ἀφορίζει τὰ πρόβατα ἀπὸ τῶν ἐρίφων,» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/25/#L31-32">Μτ 25:31-32</a>)</p></blockquote><h3>Η κρίση θα αρχίσει από την Εκκλησία</h3><blockquote><p><em>«ὅτι </em><strong><em><mark>ὁ καιρὸς τοῦ ἄρξασθαι τὸ κρίμα ἀπὸ τοῦ οἴκου τοῦ θεοῦ</mark></em></strong><em>· εἰ δὲ πρῶτον </em><strong><em><mark>ἀφ᾿ ἡμῶν</mark></em></strong><em>, τί τὸ τέλος τῶν ἀπειθούντων τῷ τοῦ θεοῦ εὐαγγελίῳ; καὶ εἰ </em><strong><em>ὁ δίκαιος μόλις σῴζεται</em></strong><em>, ὁ ἀσεβὴς καὶ ἁμαρτωλὸς ποῦ φανεῖται;» (</em><a href="https://bibleox.com/el/gr-lxx-byz/1pet/4/#L17-18"><em>Α Πε 4:17-18</em></a><em>)</em></p></blockquote><h3>Οι άγιοι κρίνουν τον κόσμο</h3><blockquote><p>«ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς, Ἀμὴν λέγω ὑμῖν ὅτι ὑμεῖς οἱ ἀκολουθήσαντές μοι, ἐν τῇ παλιγγενεσίᾳ, ὅταν καθίσῃ ὁ υἱὸς τοῦ ἀνθρώπου ἐπὶ θρόνου δόξης αὐτοῦ, <strong>καθήσεσθε καὶ ὑμεῖς ἐπὶ δώδεκα θρόνους κρίνοντες</strong> τὰς δώδεκα φυλὰς τοῦ Ἰσραήλ.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/19/#L28">Μτ 19:28</a>)</p></blockquote><blockquote><p>«κἀγὼ διατίθεμαι ὑμῖν καθὼς διέθετό μοι ὁ πατήρ μου βασιλείαν ἵνα ἔσθητε καὶ πίνητε ἐπὶ τῆς τραπέζης μου ἐν τῇ βασιλείᾳ μου, καὶ <strong>καθήσεσθε ἐπὶ θρόνων τὰς δώδεκα φυλὰς κρίνοντες</strong> τοῦ Ἰσραήλ.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/22/#L29-30">Λκ 22:29-30</a>)</p></blockquote><blockquote><p>«ἢ οὐκ οἴδατε ὅτι <strong>οἱ ἅγιοι τὸν κόσμον κρινοῦσιν</strong>; καὶ εἰ ἐν ὑμῖν κρίνεται ὁ κόσμος, ἀνάξιοί ἐστε κριτηρίων ἐλαχίστων;» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/6/#L2">Α Κορ 6:2</a>)</p></blockquote><h3>Πολλοί θα εκπλαγούν, μη λαμβάνοντας τη σωτηρία</h3><p>Νόμιζαν ότι είναι σωσμένοι:</p><blockquote><p><em>«</em><strong><em>πολλοὶ</em></strong><em> ἐροῦσίν μοι ἐν ἐκείνῃ τῇ ἡμέρᾳ, Κύριε κύριε, οὐ τῷ σῷ ὀνόματι </em><strong><em>ἐπροφητεύσαμεν</em></strong><em>, καὶ τῷ σῷ ὀνόματι </em><strong><em>δαιμόνια ἐξεβάλομεν</em></strong><em>, καὶ τῷ σῷ ὀνόματι </em><strong><em>δυνάμεις πολλὰς ἐποιήσαμεν</em></strong><em>; καὶ τότε ὁμολογήσω αὐτοῖς ὅτι </em><strong><em>Οὐδέποτε ἔγνων ὑμᾶς· ἀποχωρεῖτε ἀπ᾿ ἐμοῦ</em></strong><em> οἱ ἐργαζόμενοι τὴν ἀνομίαν.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/mf/7/#L22-23"><em>Μτ 7:22-23</em></a><em>)</em></p></blockquote><h3>Η μεταμόρφωση του κόσμου</h3><blockquote><p>«Καὶ εἶδον <strong>οὐρανὸν καινὸν καὶ γῆν καινήν</strong>· ὁ γὰρ πρῶτος οὐρανὸς καὶ ἡ πρώτη γῆ ἀπῆλθαν, καὶ ἡ θάλασσα οὐκ ἔστιν ἔτι. καὶ τὴν πόλιν τὴν ἁγίαν Ἰερουσαλὴμ καινὴν εἶδον καταβαίνουσαν ἐκ τοῦ οὐρανοῦ ἀπὸ τοῦ θεοῦ, ἡτοιμασμένην ὡς νύμφην κεκοσμημένην τῷ ἀνδρὶ αὐτῆς. καὶ ἤκουσα φωνῆς μεγάλης ἐκ τοῦ θρόνου λεγούσης, Ἰδοὺ ἡ σκηνὴ τοῦ θεοῦ μετὰ τῶν ἀνθρώπων, καὶ σκηνώσει μετ᾿ αὐτῶν, καὶ αὐτοὶ λαοὶ αὐτοῦ ἔσονται, καὶ αὐτὸς ὁ θεὸς μετ᾿ αὐτῶν ἔσται, [αὐτῶν θεός,] καὶ ἐξαλείψει πᾶν δάκρυον ἐκ τῶν ὀφθαλμῶν αὐτῶν, καὶ ὁ θάνατος οὐκ ἔσται ἔτι, οὔτε πένθος οὔτε κραυγὴ οὔτε πόνος οὐκ ἔσται ἔτι· [ὅτι] τὰ πρῶτα ἀπῆλθαν. Καὶ εἶπεν ὁ καθήμενος ἐπὶ τῷ θρόνῳ, <strong><mark>Ἰδοὺ καινὰ ποιῶ πάντα</mark></strong>. καὶ λέγει, Γράψον, ὅτι οὗτοι οἱ λόγοι πιστοὶ καὶ ἀληθινοί εἰσιν. καὶ εἶπέν μοι, Γέγοναν. ἐγώ [εἰμι] τὸ Ἄλφα καὶ τὸ Ὦ, ἡ ἀρχὴ καὶ τὸ τέλος. ἐγὼ τῷ διψῶντι δώσω ἐκ τῆς πηγῆς τοῦ ὕδατος τῆς ζωῆς δωρεάν.» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/21/#L1-6">Απ 21:1-6</a>)</p></blockquote><h2>Για την έκφραση «1000 χρόνια»</h2><h3>Τα 1000 χρόνια — συμβολική ονομασία της περιόδου από την Α΄ έως τη Β΄ παρουσία του Χριστού</h3><p>Η πρώτη παρουσία έχει ήδη γίνει. Ο Υιός του Θεού σαρκώθηκε χωρίς να πάψει να είναι αυτό που ήταν πριν (Θεός), και έγινε ακόμη και άνθρωπος. Δίδαξε, έπαθε, αναστήθηκε, κάθισε στα δεξιά του Θεού, δημιούργησε την Εκκλησία (μία: επίγεια και ουράνια) και έστειλε να κηρύξουν. Για εκείνους που ανταποκρίνονται στο κήρυγμα του Χριστού, που μπαίνουν στην Εκκλησία Του, φτάνουν στη σωτηρία και στη ζωή μαζί Του στον ουρανό, γίνεται λόγος ως για εκείνους που βασιλεύουν μαζί Του, αν και τα σώματά τους, ως νεκρών, βρίσκονται ακόμη στη γη, ενώ με τον Χριστό παραμένουν οι ψυχές τους. Έτσι θα είναι μέχρι τη δεύτερη παρουσία του Κυρίου Ιησού Χριστού, τον χρόνο της οποίας κανείς δεν γνωρίζει παρά μόνο ο Θεός (<a href="https://bibleox.com/el/gr-lxx-byz/act/1/#L7">Πραξ 1:7</a>). Όλη αυτή η περίοδος από την πρώτη έως τη δεύτερη παρουσία ονομάζεται συμβολικά χίλια χρόνια:</p><blockquote><p>«Καὶ εἶδον ἄγγελον καταβαίνοντα ἐκ τοῦ οὐρανοῦ, ἔχοντα τὴν κλεῖν τῆς ἀβύσσου καὶ ἅλυσιν μεγάλην ἐπὶ τὴν χεῖρα αὐτοῦ. καὶ ἐκράτησεν τὸν δράκοντα, ὁ ὄφις ὁ ἀρχαῖος, ὅς ἐστιν Διάβολος καὶ ὁ Σατανᾶς, καὶ ἔδησεν αὐτὸν <strong>χίλια ἔτη</strong>, καὶ ἔβαλεν αὐτὸν εἰς τὴν ἄβυσσον καὶ ἔκλεισεν καὶ ἐσφράγισεν ἐπάνω αὐτοῦ ἵνα μὴ πλανήσῃ ἔτι τὰ ἔθνη ἄχρι τελεσθῇ τὰ <strong>χίλια ἔτη</strong>· μετὰ ταῦτα δεῖ λυθῆναι αὐτὸν μικρὸν χρόνον. Καὶ εἶδον θρόνους, καὶ ἐκάθισαν ἐπ᾿ αὐτούς, καὶ κρίμα ἐδόθη αὐτοῖς, καὶ τὰς ψυχὰς τῶν πεπελεκισμένων διὰ τὴν μαρτυρίαν Ἰησοῦ καὶ διὰ τὸν λόγον τοῦ θεοῦ, καὶ οἵτινες οὐ προσεκύνησαν τὸ θηρίον οὐδὲ τὴν εἰκόνα αὐτοῦ καὶ οὐκ ἔλαβον τὸ χάραγμα ἐπὶ τὸ μέτωπον καὶ ἐπὶ τὴν χεῖρα αὐτῶν· καὶ ἔζησαν καὶ ἐβασίλευσαν μετὰ τοῦ Χριστοῦ χίλια ἔτη. οἱ λοιποὶ τῶν νεκρῶν οὐκ ἔζησαν <strong>ἄχρι τελεσθῇ τὰ χίλια ἔτη</strong>. αὕτη ἡ ἀνάστασις ἡ πρώτη. μακάριος καὶ ἅγιος ὁ ἔχων μέρος ἐν τῇ ἀναστάσει τῇ πρώτῃ· ἐπὶ τούτων ὁ δεύτερος θάνατος οὐκ ἔχει ἐξουσίαν, ἀλλ᾿ ἔσονται ἱερεῖς τοῦ θεοῦ καὶ τοῦ Χριστοῦ, καὶ βασιλεύσουσιν μετ᾿ αὐτοῦ [τὰ] <strong>χίλια ἔτη</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/20/#L1-6">Απ 20:1-6</a>)</p></blockquote><h3>Για την αίρεση του χιλιασμού (μιλεναρισμός)</h3><p>Ο χιλιασμός (μιλεναρισμός) — διδασκαλία για τη γήινη βασιλεία του Χριστού επί 1000 χρόνια. Δεν μπορεί να γίνει δεκτή από τους ορθόδοξους χριστιανούς για τους εξής λόγους:</p><ol><li><p>την αδυναμία αναγνώρισης <strong>δύο</strong> <strong>σωματικών αναστάσεων</strong> (ο Κύριος δίδαξε μόνο για μία σωματική ανάσταση).</p></li><li><p>την αδυναμία αναγνώρισης <strong>δύο</strong> <strong>Φοβερών κρίσεων</strong> (ο Κύριος πάλι διδάσκει μόνο για μία κρίση).</p></li><li><p>την αδυναμία αναγνώρισης <strong>ιδιαίτερης</strong> <strong>παρουσίας</strong> <strong>του Χριστού</strong> πριν από τη Φοβερή κρίση για γήινη διακυβέρνηση του κόσμου.</p></li><li><p>την αδυναμία αναγνώρισης κάποιας <strong>ιδιαίτερης Χιλιετούς βασιλείας</strong> <strong>του Χριστού</strong> ήδη σε αυτόν τον κόσμο, διαφορετικής από τη Βασιλεία των Ουρανών.</p></li></ol><p>Περισσότερα: Χιλιασμός.</p><h2>Για τους δύο θανάτους και τις δύο αναστάσεις</h2><p>Στο βιβλίο της Αποκάλυψης του αποστόλου Ιωάννου του Θεολόγου αναφέρονται (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/20/#L1-6">Απ 20:1-6</a>) δύο θάνατοι και δύο αναστάσεις.</p><p>Ο 1ος θάνατος — το σωματικό τέλος εδώ στη γη.</p><p>Ο 2ος θάνατος — η αιώνια καταδίκη και τιμωρία από τον Θεό στην παγκόσμια Φοβερή Κρίση.</p><p>Η 1η ανάσταση — πνευματική: η στροφή προς τον Θεό, η πίστη, η μετάνοια, το βάπτισμα, η διόρθωση της ζωής.</p><p>Η 2η ανάσταση — σωματική, κατά τη Δεύτερη Παρουσία του Κυρίου Ιησού Χριστού.</p><h3>Η πρώτη ανάσταση — η στροφή προς τον Θεό μέσω του κηρύγματος και του βαπτίσματος</h3><p>Ο Κύριος έδεσε τον Σατανά. Οι ειδωλολατρικές λατρείες άρχισαν να νικώνται από τον χριστιανισμό και να εξαφανίζονται. Οι άνθρωποι απέκτησαν τη δυνατότητα να ανασταίνονται πνευματικά για την αιώνια ζωή με τον Θεό μέσω του Βαπτίσματος, της Ευχαριστίας και της ζωής στην Εκκλησία. Αυτή η πνευματική ανάσταση για την αιώνια ζωή ονομάζεται στο κείμενο πρώτη ανάσταση:</p><blockquote><p>«οἱ λοιποὶ τῶν νεκρῶν οὐκ ἔζησαν ἄχρι τελεσθῇ τὰ χίλια ἔτη. αὕτη <strong>ἡ ἀνάστασις ἡ πρώτη</strong>. μακάριος καὶ ἅγιος ὁ ἔχων μέρος ἐν τῇ ἀναστάσει τῇ πρώτῃ· ἐπὶ τούτων ὁ δεύτερος θάνατος οὐκ ἔχει ἐξουσίαν, ἀλλ᾿ ἔσονται ἱερεῖς τοῦ θεοῦ καὶ τοῦ Χριστοῦ, καὶ βασιλεύσουσιν μετ᾿ αὐτοῦ [τὰ] χίλια ἔτη.» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/20/#L5-6">Απ 20:5-6</a>)</p></blockquote><p>Η στροφή προς τον Θεό ονομάζεται πέρασμα από τον θάνατο στη ζωή:</p><blockquote><p>«καὶ <strong>ὄντας ἡμᾶς νεκροὺς τοῖς παραπτώμασιν συνεζωοποίησεν τῷ Χριστῷ</strong> — χάριτί ἐστε σεσῳσμένοι — καὶ συνήγειρεν καὶ συνεκάθισεν ἐν τοῖς ἐπουρανίοις ἐν Χριστῷ Ἰησοῦ,» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/2/#L5-6">Εφ 2:5-6</a>)</p></blockquote><p>Ο πιστός πέρασε από τον θάνατο στη ζωή:</p><blockquote><p>«Ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι <strong>ὁ τὸν λόγον μου ἀκούων καὶ πιστεύων τῷ πέμψαντί με ἔχει ζωὴν</strong> αἰώνιον, καὶ εἰς κρίσιν οὐκ ἔρχεται ἀλλὰ <strong>μεταβέβηκεν ἐκ τοῦ θανάτου εἰς τὴν ζωήν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/5/#L24">Ιω 5:24</a>)</p></blockquote><p>Εκείνοι όμως που δεν πίστεψαν ονομάζονται γι'' αυτό νεκροί:</p><blockquote><p>«εἶπεν δὲ αὐτῷ, <strong>Ἄφες τοὺς νεκροὺς θάψαι τοὺς ἑαυτῶν νεκρούς</strong>, σὺ δὲ ἀπελθὼν διάγγελλε τὴν βασιλείαν τοῦ θεοῦ.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/9/#L60">Λκ 9:60</a>)</p></blockquote><h3>Η δεύτερη ανάσταση — η ανάσταση όλων των ανθρώπων στα σώματά τους για την παγκόσμια κρίση</h3><p>Η δεύτερη ανάσταση θα αφορά όλους ανεξαιρέτως τους ανθρώπους. Εννοείται η ανάσταση όλων των ανθρώπων που έζησαν ποτέ για την παγκόσμια κρίση. Όλες οι ψυχές επιστρέφουν στα αναστημένα σώματά τους, ώστε ό,τι ποθούσε τον Θεό (ψυχή και σώμα) να λάβει ανταμοιβή, και ό,τι αμάρτησε (ψυχή και σώμα) να λάβει τιμωρία.</p><blockquote><p>«ἐλπίδα ἔχων εἰς τὸν θεόν, ἣν καὶ αὐτοὶ οὗτοι προσδέχονται, <strong>ἀνάστασιν μέλλειν ἔσεσθαι δικαίων τε καὶ ἀδίκων</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/24/#L15">Πραξ 24:15</a>)</p></blockquote><h3>Περισσότερα για τις «δύο αναστάσεις»</h3><blockquote><p>«Καὶ εἶδον ἄγγελον καταβαίνοντα ἐκ τοῦ οὐρανοῦ, ἔχοντα τὴν κλεῖν τῆς ἀβύσσου καὶ ἅλυσιν μεγάλην ἐπὶ τὴν χεῖρα αὐτοῦ. καὶ ἐκράτησεν τὸν δράκοντα, ὁ ὄφις ὁ ἀρχαῖος, ὅς ἐστιν Διάβολος καὶ ὁ Σατανᾶς, καὶ ἔδησεν αὐτὸν χίλια ἔτη, καὶ ἔβαλεν αὐτὸν εἰς τὴν ἄβυσσον καὶ ἔκλεισεν καὶ ἐσφράγισεν ἐπάνω αὐτοῦ ἵνα μὴ πλανήσῃ ἔτι τὰ ἔθνη ἄχρι τελεσθῇ τὰ χίλια ἔτη· μετὰ ταῦτα δεῖ λυθῆναι αὐτὸν μικρὸν χρόνον. Καὶ εἶδον θρόνους, καὶ ἐκάθισαν ἐπ᾿ αὐτούς, καὶ κρίμα ἐδόθη αὐτοῖς, καὶ τὰς ψυχὰς τῶν πεπελεκισμένων διὰ τὴν μαρτυρίαν Ἰησοῦ καὶ διὰ τὸν λόγον τοῦ θεοῦ, καὶ οἵτινες οὐ προσεκύνησαν τὸ θηρίον οὐδὲ τὴν εἰκόνα αὐτοῦ καὶ οὐκ ἔλαβον τὸ χάραγμα ἐπὶ τὸ μέτωπον καὶ ἐπὶ τὴν χεῖρα αὐτῶν· καὶ ἔζησαν καὶ ἐβασίλευσαν μετὰ τοῦ Χριστοῦ χίλια ἔτη. οἱ λοιποὶ τῶν νεκρῶν οὐκ ἔζησαν ἄχρι τελεσθῇ τὰ χίλια ἔτη. <strong>αὕτη ἡ ἀνάστασις ἡ πρώτη</strong>. μακάριος καὶ ἅγιος ὁ ἔχων μέρος <strong>ἐν τῇ ἀναστάσει τῇ πρώτῃ</strong>· ἐπὶ τούτων <strong>ὁ δεύτερος θάνατος</strong> οὐκ ἔχει ἐξουσίαν, ἀλλ᾿ ἔσονται ἱερεῖς τοῦ θεοῦ καὶ τοῦ Χριστοῦ, καὶ βασιλεύσουσιν μετ᾿ αὐτοῦ [τὰ] χίλια ἔτη.» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/20/#L1-6">Απ 20:1-6</a>)</p></blockquote><p>Σχόλιο στη φράση:</p><blockquote><p>«<strong>οἱ λοιποὶ τῶν νεκρῶν οὐκ ἔζησαν ἄχρι τελεσθῇ τὰ χίλια ἔτη. αὕτη ἡ ἀνάστασις ἡ πρώτη</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/20/#L5">Απ 20:5</a>)</p></blockquote><p>Σε όλους είχε δοθεί χρόνος για να αναστηθούν κατά την περίοδο της πρώτης ανάστασης, και όλα είχαν δοθεί γι'' αυτό. Ωστόσο άλλοι αναστήθηκαν και άλλοι δεν αναστήθηκαν, όταν οι νεκροί έπρεπε να αναστηθούν — δηλαδή σε όλη τη διάρκεια των 1000 χρόνων (ώσπου να τελειώσουν τα χίλια χρόνια που είχαν οριστεί γι'' αυτό). Περισσότερα για τη λέξη «ἄχρι».</p><p>Οι πρώτοι αναστήθηκαν κατά τη ζωή στο σώμα, δηλαδή στράφηκαν προς τον Χριστό:</p><blockquote><p>«μακάριος καὶ ἅγιος ὁ ἔχων μέρος ἐν τῇ ἀναστάσει τῇ πρώτῃ· ἐπὶ τούτων ὁ δεύτερος θάνατος οὐκ ἔχει ἐξουσίαν, ἀλλ᾿ ἔσονται ἱερεῖς τοῦ θεοῦ καὶ τοῦ Χριστοῦ, καὶ βασιλεύσουσιν μετ᾿ αὐτοῦ [τὰ] χίλια ἔτη.» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/20/#L6">Απ 20:6</a>)</p></blockquote><p>Πάνω τους <strong>ο δεύτερος θάνατος</strong> δεν θα έχει εξουσία.</p><p>Ιδού η ανάσταση όλων ανεξαιρέτως των ανθρώπων στα σώματά τους για την παγκόσμια κρίση:</p><blockquote><p>«καὶ ἔδωκεν ἡ θάλασσα τοὺς νεκροὺς τοὺς ἐν αὐτῇ, καὶ ὁ θάνατος καὶ ὁ ᾅδης ἔδωκαν τοὺς νεκροὺς τοὺς ἐν αὐτοῖς, καὶ ἐκρίθησαν ἕκαστος κατὰ τὰ ἔργα αὐτῶν. καὶ ὁ θάνατος καὶ ὁ ᾅδης ἐβλήθησαν εἰς τὴν λίμνην τοῦ πυρός. οὗτος ὁ θάνατος ὁ δεύτερός ἐστιν, ἡ λίμνη τοῦ πυρός. καὶ εἴ τις οὐχ εὑρέθη ἐν τῇ βίβλῳ τῆς ζωῆς γεγραμμένος ἐβλήθη εἰς τὴν λίμνην τοῦ πυρός.» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/20/#L13-15">Απ 20:13-15</a>)</p></blockquote><p>Η ρίψη στη λίμνη του πυρός — <strong>ο δεύτερος θάνατος</strong>. Εκεί δεν ρίχτηκαν όσοι είναι γραμμένοι στο βιβλίο της ζωής. Δηλαδή εκείνοι για τους οποίους μιλούσε το Απ 20:6 — ότι πάνω τους ο δεύτερος θάνατος δεν έχει εξουσία.</p>'
- src: пророчества-о-Христе
