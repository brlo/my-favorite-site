  update: true
  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: '<h2>Πρόλογος</h2><p>Ο Κύριος Ιησούς Χριστός, πριν από περισσότερα από 2000 χρόνια, γεννήθηκε από την υπεραγία Παρθένο Μαρία (χωρίς σύζυγο), σύμφωνα με τα λόγια των αρχαίων προφητών. Είχε μεγάλη σοφία ήδη από την παιδική του ηλικία (12 ετών), με την οποία εξέπληττε τους δασκάλους στον ναό της Ιερουσαλήμ. Μέχρι τα 30 του χρόνια ο Ιησούς Χριστός ήταν υπάκουος στον Ιωσήφ, ασκούσε συνηθισμένη εργασία, και στα 30 βγήκε στο κήρυγμα. Περισσότερα για αυτή την περίοδο: Χριστός — ζωή στην Παλαιστίνη.</p><p>Στη συνέχεια, ο Κύριος Ιησούς Χριστός κήρυξε, καθοδήγησε τους μαθητές (αποστόλους), προδόθηκε, υπέφερε στον Σταυρό, την τρίτη ημέρα αναστήθηκε, εμφανίστηκε στους μαθητές του για 40 ημέρες, διδάσκοντάς τους για τη Βασιλεία των Ουρανών, και έπειτα αναλήφθηκε στον ουρανό, κάθισε στα δεξιά του Θεού και υποσχέθηκε να επιστρέψει δεύτερη φορά, όπως αναλήφθηκε, για να κρίνει όλο το σύμπαν. Και 10 ημέρες αργότερα (την 50ή ημέρα από την ανάσταση) δημιούργησε την Εκκλησία του και της έστειλε για πάντα το Άγιο Πνεύμα.</p><h2>Περί των ψευδοχρίστων</h2><h3>Οι απατεώνες</h3><p>Ο ίδιος ο Κύριος Ιησούς Χριστός προειδοποίησε ότι θα έρθουν απατεώνες που θα παρουσιαστούν ως Αυτός, και πολλοί άνθρωποι θα τους πιστέψουν:</p><blockquote><p>«Καθημένου δὲ αὐτοῦ ἐπὶ τοῦ Ὄρους τῶν Ἐλαιῶν προσῆλθον αὐτῷ οἱ μαθηταὶ κατ᾿ ἰδίαν λέγοντες, Εἰπὲ ἡμῖν πότε ταῦτα ἔσται, καὶ τί τὸ σημεῖον τῆς σῆς παρουσίας καὶ συντελείας τοῦ αἰῶνος. καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτοῖς, <strong>Βλέπετε μή τις ὑμᾶς πλανήσῃ· πολλοὶ γὰρ ἐλεύσονται ἐπὶ τῷ ὀνόματί μου λέγοντες, Ἐγώ εἰμι ὁ Χριστός, καὶ πολλοὺς πλανήσουσιν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/24/#L3-5">Μτ 24:3-5</a>)</p></blockquote><h2>Περί της ελεύσεως του Χριστού</h2><h3>Η έλευση — σαν αστραπή</h3><p>Ωστόσο, η δεύτερη έλευση του Χριστού θα γίνει αμέσως γνωστή σε όλο τον κόσμο, σαν αστραπή που αστράφτει:</p><blockquote><p>«καὶ <strong>ἐροῦσιν ὑμῖν, Ἰδοὺ ἐκεῖ</strong>· [ἤ,] Ἰδοὺ ὧδε· <strong>μὴ ἀπέλθητε μηδὲ διώξητε</strong>. <strong>ὥσπερ γὰρ ἡ ἀστραπὴ</strong> ἀστράπτουσα ἐκ τῆς ὑπὸ τὸν οὐρανὸν εἰς τὴν ὑπ᾿ οὐρανὸν λάμπει, <strong>οὕτως ἔσται ὁ υἱὸς τοῦ ἀνθρώπου [ἐν τῇ ἡμέρᾳ αὐτοῦ</strong>].» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/17/#L23-24">Λκ 17:23-24</a>)</p></blockquote><blockquote><p>«ἐὰν οὖν <strong>εἴπωσιν ὑμῖν, Ἰδοὺ ἐν τῇ ἐρήμῳ ἐστίν</strong>, μὴ ἐξέλθητε· Ἰδοὺ ἐν τοῖς ταμείοις, μὴ πιστεύσητε· <strong>ὥσπερ γὰρ ἡ ἀστραπὴ ἐξέρχεται ἀπὸ ἀνατολῶν καὶ φαίνεται ἕως δυσμῶν, οὕτως ἔσται ἡ παρουσία τοῦ υἱοῦ τοῦ ἀνθρώπου</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/24/#L26-27">Μτ 24:26-27</a>)</p></blockquote><h3>Η έλευση με όλους τους αγγέλους</h3><p>Η δεύτερη έλευση του Χριστού θα γίνει στη δόξα του Πατέρα, με όλους τους αγίους Του:</p><blockquote><p><em>«</em><strong><em>ἥξει</em></strong><em> </em><strong><em>κύριος ὁ θεός</em></strong><em> μου </em><strong><em>καὶ</em></strong><em> </em><strong><em>πάντες οἱ ἅγιοι μετ᾿ αὐτοῦ</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/zah/14/#L5"><em>Ζαχ 14:5</em></a><em>)</em></p></blockquote><blockquote><p><em>«</em><strong><em>ἔλθῃ ὁ υἱὸς τοῦ ἀνθρώπου</em></strong><em> ἐν τῇ δόξῃ αὐτοῦ </em><strong><em>καὶ πάντες οἱ ἄγγελοι μετ᾿ αὐτοῦ</em></strong><em>, τότε καθίσει ἐπὶ θρόνου δόξης αὐτοῦ·» (</em><a href="https://bibleox.com/el/gr-lxx-byz/mf/25/#L31"><em>Μτ 25:31</em></a><em>)</em></p></blockquote><blockquote><p>«ὃς γὰρ ἐὰν ἐπαισχυνθῇ με καὶ τοὺς ἐμοὺς λόγους ἐν τῇ γενεᾷ ταύτῃ τῇ μοιχαλίδι καὶ ἁμαρτωλῷ, καὶ ὁ υἱὸς τοῦ ἀνθρώπου ἐπαισχυνθήσεται αὐτὸν ὅταν <strong>ἔλθῃ ἐν τῇ δόξῃ τοῦ πατρὸς αὐτοῦ μετὰ τῶν ἀγγέλων τῶν ἁγίων</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mk/8/#L38">Μκ 8:38</a>)</p></blockquote><blockquote><p>«μέλλει γὰρ ὁ υἱὸς τοῦ ἀνθρώπου <strong>ἔρχεσθαι ἐν τῇ δόξῃ τοῦ πατρὸς αὐτοῦ μετὰ τῶν ἀγγέλων αὐτοῦ, καὶ τότε ἀποδώσει ἑκάστῳ κατὰ τὴν πρᾶξιν αὐτοῦ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/16/#L27">Μτ 16:27</a>)</p></blockquote><blockquote><p><em>«Προεφήτευσεν δὲ καὶ τούτοις ἕβδομος ἀπὸ Ἀδὰμ Ἑνὼχ λέγων, </em><strong><em>Ἰδοὺ ἦλθεν κύριος ἐν ἁγίαις μυριάσιν αὐτοῦ</em></strong><em>,» (</em><a href="https://bibleox.com/el/gr-lxx-byz/iud/1/#L14"><em>Ιούδα 1:14</em></a><em>)</em></p></blockquote><blockquote><p><em>«</em><strong><em>ἐν τῇ παρουσίᾳ τοῦ κυρίου ἡμῶν Ἰησοῦ μετὰ πάντων τῶν ἁγίων αὐτοῦ</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/1sol/3/#L13"><em>Α Θεσ 3:13</em></a><em>)</em></p></blockquote><blockquote><p>«καὶ ὑμῖν τοῖς θλιβομένοις ἄνεσιν μεθ᾿ ἡμῶν <strong>ἐν τῇ ἀποκαλύψει τοῦ κυρίου Ἰησοῦ ἀπ᾿ οὐρανοῦ μετ᾿ ἀγγέλων</strong> δυνάμεως αὐτοῦ» (<a href="https://bibleox.com/el/gr-lxx-byz/2sol/1/#L7">Β Θεσ 1:7</a>)</p></blockquote><h3>Η έλευση στο ίδιο ενήλικο σώμα</h3><p>Ο Χριστός δεν θα γεννηθεί ξανά από ανθρώπους, αλλά θα έρθει στο σώμα που ήδη έχει, το οποίο έλαβε με τη γέννησή του από την Παρθένο Μαρία τη Θεοτόκο το 1 μ.Χ.</p><blockquote><p>«καὶ ταῦτα εἰπὼν βλεπόντων αὐτῶν ἐπήρθη, καὶ νεφέλη ὑπέλαβεν αὐτὸν ἀπὸ τῶν ὀφθαλμῶν αὐτῶν. καὶ ὡς ἀτενίζοντες ἦσαν εἰς τὸν οὐρανὸν πορευομένου αὐτοῦ, καὶ ἰδοὺ ἄνδρες δύο παρειστήκεισαν αὐτοῖς ἐν ἐσθήσεσι λευκαῖς, οἳ καὶ εἶπαν, Ἄνδρες Γαλιλαῖοι, τί ἑστήκατε βλέποντες εἰς τὸν οὐρανόν; <strong>οὗτος ὁ Ἰησοῦς ὁ ἀναλημφθεὶς ἀφ᾿ ὑμῶν εἰς τὸν οὐρανὸν</strong> οὕτως ἐλεύσεται ὃν τρόπον ἐθεάσασθε αὐτὸν πορευόμενον εἰς τὸν οὐρανόν.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/1/#L9-11">Πραξ 1:9-11</a>)</p></blockquote><h3>Η έλευση για κρίση</h3><p>Ο Κύριος θα έρθει όχι για να διδάξει, αλλά για να κρίνει με τον λόγο που ήδη έδωσε, όταν ήρθε την πρώτη φορά:</p><blockquote><p>«ὁ ἀθετῶν ἐμὲ καὶ μὴ λαμβάνων τὰ ῥήματά μου ἔχει τὸν κρίνοντα αὐτόν· <strong>ὁ λόγος ὃν ἐλάλησα ἐκεῖνος κρινεῖ αὐτὸν ἐν τῇ ἐσχάτῃ ἡμέρᾳ</strong>·» (<a href="https://bibleox.com/el/gr-lxx-byz/in/12/#L48">Ιω 12:48</a>)</p></blockquote><blockquote><p>«μέλλει γὰρ ὁ υἱὸς τοῦ ἀνθρώπου <strong>ἔρχεσθαι ἐν τῇ δόξῃ τοῦ πατρὸς αὐτοῦ μετὰ τῶν ἀγγέλων αὐτοῦ, καὶ τότε ἀποδώσει ἑκάστῳ κατὰ τὴν πρᾶξιν αὐτοῦ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/16/#L27">Μτ 16:27</a>)</p></blockquote><blockquote><p>«Ὅταν δὲ <strong>ἔλθῃ ὁ υἱὸς τοῦ ἀνθρώπου ἐν τῇ δόξῃ</strong> αὐτοῦ καὶ πάντες οἱ ἄγγελοι μετ᾿ αὐτοῦ, τότε <strong>καθίσει ἐπὶ θρόνου</strong> δόξης αὐτοῦ· καὶ <strong>συναχθήσονται ἔμπροσθεν αὐτοῦ πάντα τὰ ἔθνη</strong>, καὶ <strong>ἀφορίσει αὐτοὺς ἀπ᾿ ἀλλήλων</strong>, ὥσπερ ὁ ποιμὴν ἀφορίζει τὰ πρόβατα ἀπὸ τῶν ἐρίφων, καὶ στήσει τὰ μὲν πρόβατα ἐκ δεξιῶν αὐτοῦ τὰ δὲ ἐρίφια ἐξ εὐωνύμων. &lt;…&gt; καὶ <strong>ἀπελεύσονται οὗτοι εἰς κόλασιν αἰώνιον, οἱ δὲ δίκαιοι εἰς ζωὴν αἰώνιον</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/25/#L31-33,46">Μτ 25:31-33,46</a>)</p></blockquote><blockquote><p>«<strong>ἔνδειγμα τῆς δικαίας κρίσεως τοῦ θεοῦ</strong>, εἰς τὸ καταξιωθῆναι ὑμᾶς τῆς βασιλείας τοῦ θεοῦ, ὑπὲρ ἧς καὶ πάσχετε, εἴπερ δίκαιον παρὰ θεῷ ἀνταποδοῦναι τοῖς θλίβουσιν ὑμᾶς θλῖψιν καὶ ὑμῖν τοῖς θλιβομένοις ἄνεσιν μεθ᾿ ἡμῶν <strong>ἐν τῇ ἀποκαλύψει τοῦ κυρίου Ἰησοῦ ἀπ᾿ οὐρανοῦ μετ᾿ ἀγγέλων</strong> δυνάμεως αὐτοῦ <strong>ἐν πυρὶ φλογός, διδόντος ἐκδίκησιν</strong> τοῖς μὴ εἰδόσιν θεὸν καὶ τοῖς μὴ ὑπακούουσιν τῷ εὐαγγελίῳ τοῦ κυρίου ἡμῶν Ἰησοῦ,» (<a href="https://bibleox.com/el/gr-lxx-byz/2sol/1/#L5-8">Β Θεσ 1:5-8</a>)</p></blockquote>'
