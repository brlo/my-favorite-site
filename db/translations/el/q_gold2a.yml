  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <h2>Η εξομολόγηση των αμαρτιών στην Παλαιά Διαθήκη</h2><p>Στην Εκκλησία της Παλαιάς Διαθήκης ο ίδιος ο Θεός καθιερώνει την εξομολόγηση στον ναό ενώπιον του ιερέα και τον καθαρισμό από την αμαρτία μέσω του ιερέα:</p><blockquote><p>«καὶ <strong>ἐξαγορεύσει τὴν ἁμαρτίαν περὶ ὧν ἡμάρτηκεν</strong> κατ᾿ αὐτῆς, καὶ <strong>οἴσει περὶ ὧν ἐπλημμέλησεν κυρίῳ</strong>, περὶ τῆς ἁμαρτίας, ἧς ἥμαρτεν, θῆλυ ἀπὸ τῶν προβάτων, ἀμνάδα ἢ χίμαιραν ἐξ αἰγῶν, περὶ ἁμαρτίας· καὶ <strong>ἐξιλάσεται περὶ αὐτοῦ ὁ ἱερεὺς περὶ τῆς ἁμαρτίας αὐτοῦ</strong>, ἧς ἥμαρτεν, καὶ ἀφεθήσεται αὐτῷ ἡ ἁμαρτία.» (<a href="https://bibleox.com/el/gr-lxx-byz/lev/5/#L5-6">Λευ 5:5-6</a>)</p></blockquote><blockquote><p>«ὁ ἐπικαλύπτων ἀσέβειαν ἑαυτοῦ οὐκ εὐοδωθήσεται, <strong>ὁ δὲ ἐξηγούμενος ἐλέγχους ἀγαπηθήσεται</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/pr/28/#L13">Πρμ 28:13</a>)</p></blockquote><h2>Η εξομολόγηση των αμαρτιών στην Καινή Διαθήκη</h2><h3>Η ιεροσύνη έχει την εξουσία να συγχωρεί αμαρτίες</h3><p>Ο Θεός επιφέρει αλλαγή της ιερωσύνης (βλ. περισσότερα):</p><blockquote><p>«<strong>μετατιθεμένης γὰρ τῆς ἱερωσύνης</strong> ἐξ ἀνάγκης καὶ νόμου μετάθεσις γίνεται.» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/7/#L12">Εβρ 7:12</a>)</p></blockquote><p>Δίνει στη νέα ιεροσύνη την εξουσία να συγχωρεί αμαρτίες:</p><blockquote><p>«δώσω σοι τὰς κλεῖδας τῆς βασιλείας τῶν οὐρανῶν, καὶ ὃ ἐὰν δήσῃς ἐπὶ τῆς γῆς ἔσται δεδεμένον ἐν τοῖς οὐρανοῖς, καὶ <strong>ὃ ἐὰν λύσῃς ἐπὶ τῆς γῆς ἔσται λελυμένον ἐν τοῖς οὐρανοῖς</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/16/#L19">Μτ 16:19</a>)</p></blockquote><blockquote><p>«Ἀμὴν λέγω ὑμῖν, ὅσα ἐὰν δήσητε ἐπὶ τῆς γῆς ἔσται δεδεμένα ἐν οὐρανῷ καὶ <strong>ὅσα ἐὰν λύσητε ἐπὶ τῆς γῆς ἔσται λελυμένα ἐν οὐρανῷ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/18/#L18">Μτ 18:18</a>)</p></blockquote><p>Με την προσευχή της ιεροσύνης συγχωρούνται οι αμαρτίες:</p><blockquote><p>«καὶ τοῦτο εἰπὼν ἐνεφύσησεν καὶ λέγει αὐτοῖς, Λάβετε πνεῦμα ἅγιον· <strong>ἄν τινων ἀφῆτε τὰς ἁμαρτίας ἀφέωνται αὐτοῖς, ἄν τινων κρατῆτε κεκράτηνται</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/20/#L22-23">Ιω 20:22-23</a>)</p></blockquote><blockquote><p>«ἀσθενεῖ τις ἐν ὑμῖν; <strong>προσκαλεσάσθω τοὺς πρεσβυτέρους τῆς ἐκκλησίας</strong>, καὶ <strong>προσευξάσθωσαν ἐπ᾿ αὐτὸν</strong> ἀλείψαντες ἐλαίῳ ἐν τῷ ὀνόματι [τοῦ] κυρίου· καὶ ἡ εὐχὴ τῆς πίστεως σώσει τὸν κάμνοντα, καὶ ἐγερεῖ αὐτὸν ὁ κύριος· <strong>κἂν ἁμαρτίας ᾖ πεποιηκώς, ἀφεθήσεται αὐτῷ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/iak/5/#L14-15">Ιακ 5:14-15</a>)</p></blockquote><p>Η ιεροσύνη έχει οριστεί φύλακας της Εκκλησίας:</p><blockquote><p>«Ἀπὸ δὲ τῆς Μιλήτου πέμψας εἰς Ἔφεσον μετεκαλέσατο τοὺς <strong>πρεσβυτέρους τῆς ἐκκλησίας</strong>. ὡς δὲ παρεγένοντο πρὸς αὐτὸν εἶπεν αὐτοῖς, Ὑμεῖς ἐπίστασθε ἀπὸ πρώτης ἡμέρας ἀφ᾿ ἧς ἐπέβην εἰς τὴν Ἀσίαν πῶς μεθ᾿ ὑμῶν τὸν πάντα χρόνον ἐγενόμην, &lt;…&gt; προσέχετε ἑαυτοῖς καὶ παντὶ τῷ ποιμνίῳ, ἐν ᾧ ὑμᾶς τὸ πνεῦμα τὸ ἅγιον ἔθετο <strong>ἐπισκόπους, ποιμαίνειν τὴν ἐκκλησίαν τοῦ θεοῦ, ἣν περιεποιήσατο διὰ τοῦ αἵματος τοῦ ἰδίου</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/20/#L17-18,28">Πραξ 20:17-18,28</a>)</p></blockquote><h3>Η εξομολόγηση διατηρείται στην Εκκλησία</h3><p>Στα σύνορα της Παλαιάς και της Καινής Διαθήκης οι άνθρωποι έρχονταν στον προφήτη Ιωάννη τον Βαπτιστή και επίσης εξομολογούνταν τις αμαρτίες τους:</p><blockquote><p>«ἐγένετο Ἰωάννης βαπτίζων ἐν τῇ ἐρήμῳ καὶ κηρύσσων βάπτισμα μετανοίας <strong>εἰς ἄφεσιν ἁμαρτιῶν</strong>. καὶ <strong>ἐξεπορεύετο πρὸς αὐτὸν πᾶσα ἡ Ἰουδαία χώρα καὶ οἱ Ἱεροσολυμῖται πάντες</strong>, καὶ ἐβαπτίζοντο ὑπ᾿ αὐτοῦ ἐν τῷ Ἰορδάνῃ ποταμῷ <strong>ἐξομολογούμενοι τὰς ἁμαρτίας αὐτῶν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mk/1/#L4-5">Μκ 1:4-5</a>)</p></blockquote><p>Στην Εκκλησία διατηρείται η εξομολόγηση:</p><blockquote><p>«πολλοί τε τῶν <strong>πεπιστευκότων</strong> ἤρχοντο <strong>ἐξομολογούμενοι καὶ ἀναγγέλλοντες τὰς πράξεις αὐτῶν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/19/#L18">Πραξ 19:18</a>)</p></blockquote><h3>Οι πιστοί μετά την απόκτηση της αληθινής πίστης έχουν αργότερα πάλι ανάγκη συγχώρησης νέων αμαρτιών</h3><p>Ο αληθινά πιστός μπορεί να επιστρέψει τον πλησίον από τον λανθασμένο δρόμο και έτσι να καλύψει πλήθος δικών του αμαρτιών:</p><blockquote><p>«Ἀδελφοί μου, ἐάν τις ἐν ὑμῖν <strong>πλανηθῇ ἀπὸ τῆς ἀληθείας</strong> καὶ ἐπιστρέψῃ τις αὐτόν, γινώσκετε ὅτι <strong><mark>ὁ ἐπιστρέψας ἁμαρτωλὸν</mark> ἐκ πλάνης ὁδοῦ αὐτοῦ σώσει ψυχὴν [αὐτοῦ] ἐκ θανάτου καὶ <mark>καλύψει πλῆθος ἁμαρτιῶν</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/iak/5/#L19-20">Ιακ 5:19-20</a>)</p></blockquote><blockquote><p>«ἀσθενεῖ τις <strong>ἐν ὑμῖν</strong>; προσκαλεσάσθω τοὺς πρεσβυτέρους τῆς ἐκκλησίας, καὶ προσευξάσθωσαν ἐπ᾿ αὐτὸν ἀλείψαντες ἐλαίῳ ἐν τῷ ὀνόματι [τοῦ] κυρίου· καὶ ἡ εὐχὴ τῆς πίστεως σώσει τὸν κάμνοντα, καὶ ἐγερεῖ αὐτὸν ὁ κύριος· <strong><mark>κἂν ἁμαρτίας ᾖ πεποιηκώς, ἀφεθήσεται αὐτῷ</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/iak/5/#L14-15">Ιακ 5:14-15</a>)</p></blockquote><h2>Ο Κύριος δεν απορρίπτει τους μετανοούντες</h2><p>Ο Θεός είναι πάντοτε έτοιμος να δεχθεί τη μετάνοια του αμαρτωλού, όσο βαριά κι αν έχει αμαρτήσει</p><blockquote><p>«θυσία τῷ θεῷ <strong>πνεῦμα συντετριμμένον, καρδίαν συντετριμμένην καὶ τεταπεινωμένην ὁ θεὸς οὐκ ἐξ ουθενώσει</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/50/#L17">Ψλ 50:17</a>)</p></blockquote><blockquote><p>«Πᾶν ὃ δίδωσίν μοι ὁ πατὴρ πρὸς ἐμὲ ἥξει, καὶ <strong>τὸν ἐρχόμενον πρὸς ἐμὲ οὐ μὴ ἐκβάλω ἔξω</strong>,» (<a href="https://bibleox.com/el/gr-lxx-byz/in/6/#L37">Ιω 6:37</a>)</p></blockquote>
