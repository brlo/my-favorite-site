  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <p>Η διάβαση του εβραϊκού λαού από τον βυθό της Ερυθράς Θάλασσας, η απελευθέρωση από την αιχμαλωσία στην Αίγυπτο, είναι προτύπωση του Βαπτίσματος (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/10/#L2">Α Κορ 10:2</a>), η έξοδος από τη δουλεία της αμαρτίας. Ο προφήτης Μωυσής διατάζει τα νερά της Ερυθράς Θάλασσας να επιστρέψουν στη θέση τους (<a href="https://bibleox.com/el/gr-lxx-byz/ish/14/#L26-27">Έξ 14:26-27</a>). Ο Θεός πρόσταξε τον προφήτη Μωυσή να υψώσει τη ράβδο και να χωρίσει τη θάλασσα (<a href="https://bibleox.com/el/gr-lxx-byz/ish/14/#L16,21">Έξ 14:16,21</a>), και όταν ο λαός πέρασε στην άλλη όχθη, ο Μωυσής έπρεπε με το χέρι να διατάξει τα νερά να επιστρέψουν στη θέση τους (<a href="https://bibleox.com/el/gr-lxx-byz/ish/14/#L26-27">Έξ 14:26-27</a>). Κατά τη λογική, αυτό γίνεται με οριζόντια κίνηση, σε αντίθεση με την προηγούμενη κίνηση που χώριζε. Έτσι προκύπτει σταυρός:</p><ul><li><p>η κάθετη κίνηση που χωρίζει, το «πριν».</p></li><li><p>η οριζόντια κίνηση που ενώνει, το «μετά».</p></li></ul><p>Προκύπτει σταυρός (αυτό το «|» και αυτό το «—» ισούται με «＋»). Με τον σταυρό οι Εβραίοι σώθηκαν από τη δουλεία. Το ίδιο, όπως κι εμείς σωζόμαστε από τη δουλεία της αμαρτίας με τον σταυρό του Χριστού, βυθιζόμενοι στα νερά του Βαπτίσματος.</p>
