  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <p>Σταυροειδής ευλογία του Ιακώβ στα εγγόνια του. Ο Ιωσήφ έφερε τους γιους του και έβαλε τον καθένα ακριβώς απέναντι από το αντίστοιχο χέρι του πατέρα, αλλά ο Ιάκωβ έσταυρωσε τα χέρια του, βάζοντάς τα ανάποδα:</p><blockquote>«λαβὼν δὲ Ιωσηφ τοὺς δύο υἱοὺς αὐτοῦ, τόν τε Εφραιμ ἐν τῇ δεξιᾷ ἐξ ἀριστερῶν δὲ Ισραηλ, τὸν δὲ Μανασση ἐν τῇ ἀριστερᾷ ἐκ δεξιῶν δὲ Ισραηλ, ἤγγισεν αὐτοὺς αὐτῷ. ἐκτείνας δὲ Ισραηλ τὴν χεῖρα τὴν δεξιὰν ἐπέβαλεν ἐπὶ τὴν κεφαλὴν Εφραιμ — οὗτος δὲ ἦν ὁ νεώτερος — καὶ τὴν ἀριστερὰν ἐπὶ τὴν κεφαλὴν Μανασση, ἐναλλὰξ τὰς χεῖρας.» (<a href="https://bibleox.com/el/gr-lxx-byz/gen/48/#L13-14">Γεν 48:13-14</a>)</blockquote>
- src: EMRx_Крест__буква_тау
