    title: Ο σταυρός — το στρατόπεδο του Ισραήλ
    priority: 2
  update: true
  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: '<p>Ο Θεός ορίζει τη διάταξη των φυλών του εβραϊκού στρατοπέδου. Έτσι πρέπει να στέκονται και έτσι να κινούνται. Το εβραϊκό στρατόπεδο σχηματίζει σταυρό.</p><ul><li><p>Στο κέντρο του στρατοπέδου βρίσκεται η Σκηνή του Μαρτυρίου:</p></li></ul><blockquote><p>«Ἄνθρωπος ἐχόμενος αὐτοῦ κατὰ τάγμα κατὰ σημέας κατ᾿ οἴκους πατριῶν αὐτῶν παρεμβαλέτωσαν οἱ υἱοὶ Ισραηλ· <strong>ἐναντίοι κύκλῳ τῆς σκηνῆς τοῦ μαρτυρίου παρεμβαλοῦσιν οἱ υἱοὶ Ισραηλ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/chis/2/#L2">Αρ 2:2</a>)</p></blockquote><p>Επίσης, στο κέντρο του στρατοπέδου βρίσκεται η φυλή του Λευί:</p><blockquote><p>«καὶ ἀρθήσεται ἡ σκηνὴ τοῦ μαρτυρίου καὶ <strong>ἡ παρεμβολὴ τῶν Λευιτῶν μέσον τῶν παρεμβολῶν</strong>· ὡς καὶ παρεμβάλλουσιν, οὕτως καὶ ἐξαροῦσιν ἕκαστος ἐχόμενος καθ᾿ ἡγεμονίαν.» (<a href="https://bibleox.com/el/gr-lxx-byz/chis/2/#L17">Αρ 2:17</a>)</p></blockquote><ul><li><p>Από την ανατολή: η φυλή του Ιούδα, μετά του Ισσαχάρ, μετά του Ζαβουλών:</p></li></ul><blockquote><p>«καὶ οἱ παρεμβάλλοντες πρῶτοι <strong>κατ᾿ ἀνατολὰς</strong> τάγμα παρεμβολῆς <strong>Ιουδα</strong> &lt;…&gt; καὶ οἱ παρεμβάλλοντες ἐχόμενοι φυλῆς <strong>Ισσαχαρ</strong> &lt;…&gt; καὶ οἱ παρεμβάλλοντες ἐχόμενοι φυλῆς <strong>Ζαβουλων</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/chis/2/#L3,5,7">Αρ 2:3,5,7</a>)</p></blockquote><ul><li><p>Από τον νότο: η φυλή του Ρουβήν, μετά του Συμεών, μετά του Γάδ:</p></li></ul><blockquote><p>«Τάγμα παρεμβολῆς <strong>Ρουβην</strong> <strong>πρὸς λίβα</strong> &lt;…&gt; καὶ οἱ παρεμβάλλοντες ἐχόμενοι αὐτοῦ φυλῆς <strong>Συμεων</strong> &lt;…&gt; καὶ οἱ παρεμβάλλοντες ἐχόμενοι αὐτοῦ φυλῆς <strong>Γαδ</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/chis/2/#L10,12,14">Αρ 2:10,12,14</a>)</p></blockquote><ul><li><p>Από τη δύση: η φυλή του Εφραίμ (από τον Ιωσήφ), μετά του Μανασσή (από τον Ιωσήφ), μετά του Βενιαμίν:</p></li></ul><blockquote><p>«Τάγμα παρεμβολῆς <strong>Εφραιμ</strong> <strong>παρὰ θάλασσαν</strong> &lt;…&gt; καὶ οἱ παρεμβάλλοντες ἐχόμενοι φυλῆς <strong>Μανασση</strong> &lt;…&gt; καὶ οἱ παρεμβάλλοντες ἐχόμενοι φυλῆς <strong>Βενιαμιν</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/chis/2/#L18,20,22">Αρ 2:18,20,22</a>)</p></blockquote><ul><li><p>Από τον βορρά: η φυλή του Δαν, μετά του Ασήρ, μετά του Νεφθαλί:</p></li></ul><blockquote><p>«Τάγμα παρεμβολῆς <strong>Δαν</strong> <strong>πρὸς βορρᾶν</strong> &lt;…&gt; καὶ οἱ παρεμβάλλοντες ἐχόμενοι αὐτοῦ φυλῆς <strong>Ασηρ</strong> &lt;…&gt; καὶ οἱ παρεμβάλλοντες ἐχόμενοι φυλῆς <strong>Νεφθαλι</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/chis/2/#L25,27,29">Αρ 2:25,27,29</a>)</p></blockquote><p><strong><em>* </em></strong><em>Για μια τέτοια διάταξη χρειάζονται 13 στρατόπεδα (1+3+3+3+3), ενώ οι γιοι του Ιακώβ ήταν μόνο 12. Εδώ απαριθμούνται όλες οι φυλές, αλλά αντί για μία φυλή του Ιωσήφ στο στρατόπεδο υπάρχουν δύο φυλές των γιων του: του Μανασσή και του Εφραίμ.</em></p><h2>Κάθε πλευρά του σταυρού αριθμούνταν με το όνομα της φυλής που ήταν πιο κοντά στο κέντρο</h2><p>Στην αρχή δίνεται ο αριθμός του στρατοπέδου του Ιούδα:</p><blockquote><p>«καὶ οἱ παρεμβάλλοντες πρῶτοι κατ᾿ ἀνατολὰς τάγμα παρεμβολῆς Ιουδα σὺν δυνάμει αὐτῶν &lt;…&gt; δύναμις αὐτοῦ οἱ ἐπεσκεμμένοι <strong>τέσσαρες καὶ ἑβδομήκοντα χιλιάδες καὶ ἑξακόσιοι</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/chis/2/#L3-4">Αρ 2:3-4</a>)</p></blockquote><p>Έπειτα απαριθμείται το πλήθος των ανθρώπων στις φυλές που ακολουθούν τον Ιούδα:</p><blockquote><p>«δύναμις αὐτοῦ οἱ ἐπεσκεμμένοι <strong>τέσσαρες καὶ πεντήκοντα χιλιάδες καὶ τετρακόσιοι</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/chis/2/#L6">Αρ 2:6</a>)</p></blockquote><blockquote><p>«δύναμις αὐτοῦ οἱ ἐπεσκεμμένοι <strong>ἑπτὰ καὶ πεντήκοντα χιλιάδες καὶ τετρακόσιοι</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/chis/2/#L8">Αρ 2:8</a>)</p></blockquote><p>Έπειτα όλα αθροίζονται και το σύνολό τους ονομάζεται στρατόπεδο του Ιούδα (της φυλής που είναι πιο κοντά στο κέντρο), στον αριθμό του οποίου περιλαμβάνονται ήδη και τα τρία στρατόπεδα:</p><blockquote><p>«πάντες οἱ ἐπεσκεμμένοι <strong>ἐκ τῆς παρεμβολῆς Ιουδα</strong> <strong>ἑκατὸν ὀγδοήκοντα χιλιάδες καὶ ἑξακισχίλιοι καὶ τετρακόσιοι</strong> σὺν δυνάμει αὐτῶν· πρῶτοι ἐξαροῦσιν.» (<a href="https://bibleox.com/el/gr-lxx-byz/chis/2/#L9">Αρ 2:9</a>)</p></blockquote><p>Το ίδιο επαναλαμβάνεται και για τις υπόλοιπες πλευρές του σταυρού.</p><h2>Με τον σταυρό το στρατόπεδο στεκόταν και επίσης κινούνταν</h2><blockquote><p>«<strong>ὡς καὶ παρεμβάλλουσιν, οὕτως καὶ ἐξαροῦσιν ἕκαστος ἐχόμενος</strong> καθ᾿ ἡγεμονίαν. &lt;…&gt; καὶ ἐποίησαν οἱ υἱοὶ Ισραηλ πάντα, ὅσα συνέταξεν κύριος τῷ Μωυσῇ, <strong>οὕτως παρενέβαλον</strong> κατὰ τάγμα αὐτῶν καὶ <strong>οὕτως ἐξῆρον, ἕκαστος</strong> ἐχόμενοι κατὰ δήμους αὐτῶν κατ᾿ οἴκους πατριῶν αὐτῶν.» (<a href="https://bibleox.com/el/gr-lxx-byz/chis/2/#L17,34">Αρ 2:17,34</a>)</p></blockquote>'
