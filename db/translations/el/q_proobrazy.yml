  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <p>Παλαιοδιαθηκική προτύπωση της σταυρικής θυσίας του Χριστού — η θυσία του Ισαάκ. Ο Αβραάμ (ο πατέρας) θυσιάζει τον Ισαάκ (τον μονάκριβό του γιο):</p><blockquote>«καὶ εἶπεν Λαβὲ <b>τὸν υἱόν σου τὸν ἀγαπητόν</b>, ὃν ἠγάπησας, τὸν Ισαακ, καὶ πορεύθητι εἰς τὴν γῆν τὴν ὑψηλὴν καὶ <b>ἀνένεγκον αὐτὸν ἐκεῖ εἰς ὁλοκάρπωσιν ἐφ᾿ ἓν τῶν ὀρέων</b>, ὧν ἄν σοι εἴπω.» (<a href="https://bibleox.com/el/gr-lxx-byz/gen/22/#L2">Γεν 22:2</a>)</blockquote><blockquote>«Οὕτως γὰρ ἠγάπησεν ὁ θεὸς τὸν κόσμον, ὥστε <b>τὸν υἱὸν τὸν μονογενῆ ἔδωκεν</b>»<b> </b>(<a href="https://bibleox.com/el/gr-lxx-byz/in/3/#L16">Ιω 3:16</a>)</blockquote>Ο Ισαάκ ανεβαίνει στο βουνό κουβαλώντας εκείνο πάνω στο οποίο θα προσφερθεί σε θυσία:<blockquote>«ἔλαβεν δὲ Αβρααμ τὰ ξύλα τῆς ὁλοκαρπώσεως καὶ <b>ἐπέθηκεν Ισαακ</b> τῷ υἱῷ αὐτοῦ· ἔλαβεν δὲ καὶ τὸ πῦρ μετὰ χεῖρα καὶ τὴν μάχαιραν, καὶ ἐπορεύθησαν οἱ δύο ἅμα.» (<a href="https://bibleox.com/el/gr-lxx-byz/gen/22/#L6">Γεν 22:6</a>)</blockquote><blockquote>«Παρέλαβον οὖν τὸν Ἰησοῦν· καὶ <b>βαστάζων αὑτῷ τὸν σταυρὸν</b> ἐξῆλθεν εἰς τὸν λεγόμενον Κρανίου Τόπον, ὃ λέγεται Ἑβραϊστὶ Γολγοθᾶ, ὅπου αὐτὸν ἐσταύρωσαν» (<a href="https://bibleox.com/el/gr-lxx-byz/in/19/#L16-18">Ιω 19:16-18</a>)</blockquote>Ο Αβραάμ έβαλε τον Ισαάκ πάνω στο θυσιαστήριο:<blockquote>«Ἀβραὰμ ὁ πατὴρ ἡμῶν οὐκ ἐξ ἔργων ἐδικαιώθη, <b>ἀνενέγκας</b> <b>Ἰσαὰκ</b> τὸν υἱὸν αὐτοῦ <b>ἐπὶ τὸ θυσιαστήριον</b>;» (<a href="https://bibleox.com/el/gr-lxx-byz/iak/2/#L21">Ιακ 2:21</a>)</blockquote><blockquote>«τοῦτον τῇ ὡρισμένῃ βουλῇ καὶ προγνώσει τοῦ θεοῦ <b>ἔκδοτον</b> διὰ χειρὸς ἀνόμων <b>προσπήξαντες</b> <b>ἀνείλατε</b>» (<a href="https://bibleox.com/el/gr-lxx-byz/act/2/#L23">Πραξ 2:23</a>)</blockquote>Στον σταυρό, όπως πάνω σε θυσιαστήριο, συντελείται η σωτηρία της ανθρωπότητας:<blockquote>«καὶ ἀποκαταλλάξῃ τοὺς ἀμφοτέρους ἐν ἑνὶ σώματι τῷ θεῷ <b>διὰ τοῦ</b> <b>σταυροῦ</b>, <b>ἀποκτείνας τὴν ἔχθραν ἐν αὐτῷ</b>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/2/#L16">Εφ 2:16</a>)</blockquote>
