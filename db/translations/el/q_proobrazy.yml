  update: true
  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: "<p><strong>Στο όραμα του προφήτη Ιεζεκιήλ, ο γραφέας έπρεπε να βάλει το σημείο </strong>«\U00010915»<strong> (το φοινικικό γράμμα ταυ) στο μέτωπο ορισμένων ανθρώπων.</strong></p><p>Ο προφήτης Ιεζεκιήλ βλέπει ένα όραμα για τα έργα των Ιουδαίων που είναι βδελυκτά στον Θεό, γι’ αυτό ο Θεός στέλνει εναντίον τους τιμωρούς με επικεφαλής τον γραφέα. Ο γραφέας βάζει το σημείο στο μέτωπο εκείνων των ανθρώπων στους οποίους όλα εκείνα τα βδελύγματα είναι εξίσου αποκρουστικά όπως και στον Θεό. Όσους έχουν αυτές τις σφραγίδες, σύμφωνα με την εντολή του Θεού, δεν θα τους αγγίξει η τιμωρία.</p><blockquote><p>«καὶ εἶπεν πρὸς αὐτόν Δίελθε μέσην τὴν Ιερουσαλημ καὶ <strong>δὸς τὸ σημεῖον ἐπὶ τὰ μέτωπα τῶν ἀνδρῶν τῶν καταστεναζόντων καὶ τῶν κατωδυνωμένων ἐπὶ πάσαις ταῖς ἀνομίαις ταῖς γινομέναις ἐν μέσῳ αὐτῆς</strong>. καὶ τούτοις εἶπεν ἀκούοντός μου Πορεύεσθε ὀπίσω αὐτοῦ εἰς τὴν πόλιν καὶ κόπτετε καὶ μὴ φείδεσθε τοῖς ὀφθαλμοῖς ὑμῶν καὶ μὴ ἐλεήσητε· πρεσβύτερον καὶ νεανίσκον καὶ παρθένον καὶ νήπια καὶ γυναῖκας ἀποκτείνατε εἰς ἐξάλειψιν, <strong>ἐπὶ δὲ πάντας, ἐφ᾿ οὕς ἐστιν τὸ σημεῖον, μὴ ἐγγίσητε</strong>· καὶ ἀπὸ τῶν ἁγίων μου ἄρξασθε. καὶ ἤρξαντο ἀπὸ τῶν ἀνδρῶν τῶν πρεσβυτέρων, οἳ ἦσαν ἔσω ἐν τῷ οἴκῳ.» (<a href=\"https://bibleox.com/el/gr-lxx-byz/iez/9/#L4-6\">Ιεζ 9:4-6</a>).</p></blockquote><p>Στα εβραϊκά το «κάνε σημείο» είναι γραμμένο ως «הִתְוִיתָ <strong>תָּו</strong>» [taw-vaw' tawv].</p><p>Κυριολεκτικά μπορεί να μεταφραστεί ως «σχεδίασε <strong>תָּ</strong>» (το γράμμα ταυ), αλλά ο προφήτης Ιεζεκιήλ γεννήθηκε σε εκείνη την εποχή που οι Εβραίοι χρησιμοποιούσαν ακόμη τη φοινικική γραφή ή την παλαιοεβραϊκή γραφή, που προήλθε από τη φοινικική, σύμφωνα με την οποία το γράμμα ταυ γράφεται έτσι:<strong> </strong>«\U00010915». Έτσι, κυριολεκτικά είναι γραμμένο το εξής: «<strong>σχεδίασε </strong>\U00010915».</p><p>Με τον ίδιο τρόπο οι πρώτοι χριστιανοί σχημάτιζαν τον σταυρό στο μέτωπό τους: https://bibleox.com/ru/ru/w/крестное-знамение</p><hr><p>Οι Εβραίοι χρησιμοποιούσαν το φοινικικό αλφάβητο (το παλαιοεβραϊκό αλφάβητο, που προήλθε από το φοινικικό) περίπου από τον 10ο έως τον 7ο αιώνα π.Χ. Δηλαδή το χρησιμοποιούσαν μέχρι τη βαβυλωνιακή αιχμαλωσία. Στη Βαβυλώνα οι Εβραίοι οδηγήθηκαν σταδιακά, σε διάστημα 16 ετών (<a href=\"https://ru.wikipedia.org/wiki/%D0%92%D0%B0%D0%B2%D0%B8%D0%BB%D0%BE%D0%BD%D1%81%D0%BA%D0%B8%D0%B9_%D0%BF%D0%BB%D0%B5%D0%BD\">598—582 π.Χ.</a>).</p><p>Ο προφήτης Ιεζεκιήλ έζησε τα έτη <a href=\"https://ru.wikipedia.org/wiki/%D0%98%D0%B5%D0%B7%D0%B5%D0%BA%D0%B8%D0%B8%D0%BB%D1%8C\">περ. 622 — περ. 570 π.Χ.</a> (συνολικά 52 χρόνια).</p><p>Σε ηλικία 25 ετών οδηγήθηκε αιχμάλωτος μαζί με τον λαό του.</p><p>Δηλαδή γεννήθηκε και έμαθε γράμματα ακόμη την εποχή της φοινικικής γραφής.</p><p>Σε <a href=\"https://ru.wikipedia.org/wiki/%D0%98%D0%B5%D0%B7%D0%B5%D0%BA%D0%B8%D0%B8%D0%BB%D1%8C\">ηλικία 30 ετών</a> αρχίζει η προφητική του διακονία (<a href=\"https://bibleox.com/el/gr-lxx-byz/iez/1/#L1\">Ιεζ 1:1</a>).</p><p>Εκείνη την εποχή ο Ιεζεκιήλ γράφει το προφητικό του βιβλίο.</p><p>Μας ενδιαφέρει το γεγονός που περιγράφεται στα κεφάλαια 8-9, το οποίο συμβαίνει ακόμη μετά από 1 χρόνο και δύο μήνες (<a href=\"https://bibleox.com/el/gr-lxx-byz/iez/8/#L1\">Ιεζ 8:1</a>).</p><p>Έτσι ή αλλιώς, βρισκόμαστε κάπου στα σύνορα του 7ου-6ου αιώνα π.Χ., στην αρχή ακριβώς της βαβυλωνιακής αιχμαλωσίας, όταν μόλις αρχίζει η σταδιακή διαμόρφωση της νέας γραφής των Εβραίων. Το αλφάβητο δεν άλλαξε αμέσως. Αυτό γινόταν κατά τη διάρκεια μιας μακράς περιόδου στην αιχμαλωσία.</p><p>Το πιο πιθανό είναι ότι ο προφήτης χρησιμοποιούσε ακόμη τη φοινικική γραφή, κατανοητή στον εβραϊκό λαό, και, αντίστοιχα, έγραφε το ταυ έτσι: «\U00010915». Και αν αυτό είναι σωστό, τότε ο γραφέας έπρεπε να βάζει στο μέτωπο των ανθρώπων το σύμβολο «\U00010915», απαλλάσσοντάς τους από την τιμωρία, κάτι που μας παραπέμπει επίσης στη σωτήρια σημασία του Σταυρού του Κυρίου.</p>"
