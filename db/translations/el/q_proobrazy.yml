  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: '<h2>Η μάχη με τους Αμαληκίτες</h2><p>Προτύπωση της σωτήριας θυσίας του Ιησού Χριστού στον σταυρό είναι ένα γεγονός της Παλαιάς Διαθήκης: η μάχη του εβραϊκού λαού με τους Αμαληκίτες, όπου οι Εβραίοι νικούσαν όταν ο προφήτης Μωυσής, προσευχόμενος στον λόφο, σήκωνε τα χέρια (<a href="https://bibleox.com/el/gr-lxx-byz/ish/17/#L11">Έξ 17:11</a>), και όταν από την κούραση τα κατέβαζε, ο λαός άρχιζε να υποχωρεί μπροστά στον αντίπαλο. Ο προφήτης Μωυσής στον λόφο κατά τη διάρκεια της μάχης των Εβραίων με τους Αμαληκίτες. Τα χέρια του τα στηρίζουν ο Ααρών και ο Ωρ (<a href="https://bibleox.com/el/gr-lxx-byz/ish/17/#L11-12">Έξ 17:11-12</a>). Η μάχη κράτησε όλη μέρα, και ο Μωυσής δεν μπορούσε να κρατάει τα χέρια τόσο πολύ, γι’ αυτό ο Ααρών και ο Ωρ τον βοήθησαν, του έβαλαν μια πέτρα για να καθίσει και κρατούσαν τα χέρια του από τις δύο πλευρές: ο Ααρών το ένα χέρι και ο Ωρ το άλλο (αν θέλετε, όπως τα καρφιά κρατούσαν τα χέρια του Χριστού). Και σ’ αυτή τη στάση ο Μωυσής έμεινε στον λόφο (όπως ο σταυρός του Χριστού στον λόφο) μέχρι το τέλος της ημέρας (<a href="https://bibleox.com/el/gr-lxx-byz/ish/17/#L12">Έξ 17:12</a>) (όπως και ο Χριστός). Έτσι προκύπτει το εξής:</p><ul><li><p>Ο στρατός του Ιησού του Ναυή (έτσι λεγόταν ο αρχηγός των Εβραίων) [<em>Όπως και ο στρατός του Ιησού Χριστού — του αρχηγού της Εκκλησίας</em>]</p></li></ul><ul><li><p>νίκησε τους Αμαληκίτες με τη βοήθεια του σταυρού [<em>όπως και ο Χριστός νίκησε με τον σταυρό</em> (<a href="https://bibleox.com/el/gr-lxx-byz/ef/2/#L16">Εφ 2:16</a>)],</p></li></ul><ul><li><p>τον οποίο σχημάτισε στον λόφο ο Μωυσής [<em>Όπως και ο σταυρός του Χριστού στον Γολγοθά</em>],</p></li></ul><ul><li><p>και τον Μωυσή τον κρατούσαν σ’ αυτή τη στάση [<em>Όπως και ο Χριστός κρατιόταν στον σταυρό</em>]</p></li></ul><ul><li><p>μέχρι το τέλος της ημέρας [<em>Όπως και ο Χριστός</em>].</p></li></ul>'
- src: еврейский-стан-крест
