  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <h2>Ορισμός</h2><p>Η κόλαση μπορεί να νοηθεί με διαφορετικούς τρόπους.</p><ol><li><p>Η κόλαση — ως τόπος διαμονής των ψυχών των νεκρών, μέχρι την κοινή ανάσταση και τη Δευτέρα Παρουσία.</p></li><li><p>Η κόλαση — ως τόπος διαμονής των αναστημένων καταδικασμένων αμαρτωλών (δηλαδή των ψυχών και των σωμάτων τους μαζί), μετά την ένδοξη Δεύτερη Παρουσία του Χριστού, την κοινή Ανάσταση και τη φοβερή Κρίση. Να αλλάξει κανείς αυτή τη μοίρα μετά τη φοβερή Κρίση δεν θα μπορεί πλέον. Και τα βάσανα των καταδικασμένων και η μακαριότητα των δικαίων θα διαρκούν εξίσου αιώνια.</p></li></ol><h2>Η κόλαση, η γέεννα, η λίμνη του πυρός, το αιώνιο πυρ, το εξώτερο σκότος, η φυλακή — τόπος βασάνων</h2><p> Με τον όρο κόλαση στην Αγία Γραφή, τις περισσότερες φορές, εννοείται κάποιος τόπος βασάνων. Αυτός ο τόπος μπορεί να ονομάζεται με διάφορες λέξεις, η ουσία δεν αλλάζει, παραμένει τόπος βασάνων. Στην κόλαση βασανίζονται:</p><blockquote><p>«οἱ δὲ υἱοὶ τῆς βασιλείας <strong>ἐκβληθήσονται εἰς</strong> <strong>τὸ σκότος τὸ ἐξώτερον</strong>· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/8/#L12">Μτ 8:12</a>)</p></blockquote><p> Ο ίδιος ο Χριστός, ως Κριτής, αποφασίζει ποιος θα πάει πού:</p><blockquote><p>«τότε ὁ βασιλεὺς εἶπεν τοῖς διακόνοις, Δήσαντες αὐτοῦ πόδας καὶ χεῖρας <strong>ἐκβάλετε αὐτὸν εἰς τὸ σκότος τὸ ἐξώτερον· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/22/#L13">Μτ 22:13</a>)</p></blockquote><blockquote><p>«καὶ τὸν ἀχρεῖον δοῦλον <strong>ἐκβάλετε εἰς</strong> <strong>τὸ σκότος τὸ ἐξώτερον</strong>· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/25/#L30">Μτ 25:30</a>)</p></blockquote><blockquote><p>«Τότε ἐρεῖ καὶ τοῖς ἐξ εὐωνύμων, <strong>Πορεύεσθε ἀπ᾿ ἐμοῦ [οἱ] κατηραμένοι εἰς τὸ πῦρ τὸ αἰώνιον τὸ ἡτοιμασμένον τῷ διαβόλῳ καὶ τοῖς ἀγγέλοις αὐτοῦ</strong>·» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/25/#L41">Μτ 25:41</a>)</p></blockquote><blockquote><p>«προσέχετε δὲ ἀπὸ τῶν ἀνθρώπων· παραδώσουσιν γὰρ ὑμᾶς εἰς συνέδρια, καὶ ἐν ταῖς συναγωγαῖς αὐτῶν μαστιγώσουσιν ὑμᾶς· &lt;…&gt; καὶ μὴ φοβεῖσθε ἀπὸ τῶν ἀποκτεννόντων τὸ σῶμα, τὴν δὲ ψυχὴν μὴ δυναμένων ἀποκτεῖναι· <strong>φοβεῖσθε δὲ μᾶλλον τὸν δυνάμενον καὶ ψυχὴν καὶ σῶμα ἀπολέσαι ἐν γεέννῃ</strong>. &lt;…&gt; ὅστις δ᾿ ἂν ἀρνήσηταί με ἔμπροσθεν τῶν ἀνθρώπων, <strong>ἀρνήσομαι κἀγὼ αὐτὸν ἔμπροσθεν τοῦ πατρός μου τοῦ ἐν [τοῖς] οὐρανοῖς</strong>. Μὴ νομίσητε ὅτι ἦλθον βαλεῖν εἰρήνην ἐπὶ τὴν γῆν· οὐκ ἦλθον βαλεῖν εἰρήνην ἀλλὰ μάχαιραν. &lt;…&gt; καὶ <strong>ὃς οὐ λαμβάνει τὸν σταυρὸν αὐτοῦ καὶ ἀκολουθεῖ ὀπίσω μου, οὐκ ἔστιν μου ἄξιος</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/10/#L17,28,33-34,38">Μτ 10:17,28,33-34,38</a>)</p></blockquote><p> Ο άνθρωπος μετά τον θάνατο πηγαίνει σε νέο σπίτι. Και αυτό το γεγονός αξίζει θρήνο:</p><blockquote><p>«ὅτι ἐπορεύθη ὁ ἄνθρωπος εἰς <strong>οἶκον αἰῶνος αὐτοῦ</strong>, καὶ ἐκύκλωσαν ἐν ἀγορᾷ οἱ κοπτόμενοι» (<a href="https://bibleox.com/el/gr-lxx-byz/ekl/12/#L5">Εκ 12:5</a>)</p></blockquote><p> Μετά τον θάνατο του ανθρώπου τον περιμένει κρίση:</p><blockquote><p>«καὶ καθ᾿ ὅσον ἀπόκειται τοῖς ἀνθρώποις ἅπαξ <strong>ἀποθανεῖν, μετὰ δὲ τοῦτο κρίσις</strong>,» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/9/#L27">Εβρ 9:27</a>)</p></blockquote><p> Στην κόλαση υπάρχει συνειδητή ύπαρξη των κατοίκων της. Ο βασιλιάς της Βαβυλώνας συναντήθηκε από όλους τους κατοίκους της κόλασης:</p><blockquote><p>«καὶ λήμψῃ τὸν θρῆνον τοῦτον ἐπὶ τὸν βασιλέα Βαβυλῶνος καὶ ἐρεῖς ἐν τῇ ἡμέρᾳ ἐκείνῃ Πῶς ἀναπέπαυται ὁ ἀπαιτῶν καὶ ἀναπέπαυται ὁ ἐπισπουδαστής; &lt;…&gt; <strong>ὁ ᾅδης κάτωθεν ἐπικράνθη συναντήσας σοι</strong>, συνηγέρθησάν σοι πάντες οἱ γίγαντες οἱ ἄρξαντες τῆς γῆς οἱ ἐγείραντες ἐκ τῶν θρόνων αὐτῶν πάντας βασιλεῖς ἐθνῶν. πάντες ἀποκριθήσονται καὶ ἐροῦσίν σοι <strong>Καὶ σὺ ἑάλως ὥσπερ καὶ ἡμεῖς</strong>, ἐν ἡμῖν δὲ κατελογίσθης.» (<a href="https://bibleox.com/el/gr-lxx-byz/is/14/#L4,9-10">Ησ 14:4,9-10</a>)</p></blockquote><p> Ο Κύριος μετά τον θάνατο του σώματος κατέβη στην κόλαση για να κηρύξει σε εκείνα τα πνεύματα που ήταν εκεί από τον κατακλυσμό:</p><blockquote><p>«ὅτι καὶ Χριστὸς ἅπαξ περὶ ἁμαρτιῶν [ὑπὲρ ὑμῶν] ἀπέθανεν, δίκαιος ὑπὲρ ἀδίκων, ἵνα ὑμᾶς προσαγάγῃ τῷ θεῷ, <strong>θανατωθεὶς μὲν σαρκὶ ζῳοποιηθεὶς δὲ πνεύματι</strong>· ἐν ᾧ καὶ <strong>τοῖς ἐν φυλακῇ πνεύμασιν πορευθεὶς ἐκήρυξεν</strong>, ἀπειθήσασίν ποτε ὅτε ἀπεξεδέχετο ἡ τοῦ θεοῦ μακροθυμία <strong>ἐν ἡμέραις Νῶε κατασκευαζομένης κιβωτοῦ</strong>, εἰς ἣν ὀλίγοι, τοῦτ᾿ ἔστιν ὀκτὼ ψυχαί, διεσώθησαν δι᾿ ὕδατος.» (<a href="https://bibleox.com/el/gr-lxx-byz/1pet/3/#L18-20">Α Πε 3:18-20</a>)</p></blockquote><blockquote><p>«διὸ λέγει, Ἀναβὰς εἰς ὕψος ᾐχμαλώτευσεν αἰχμαλωσίαν, ἔδωκεν δόματα τοῖς ἀνθρώποις. [ <strong>τὸ δὲ Ἀνέβη τί ἐστιν εἰ μὴ ὅτι καὶ κατέβη εἰς τὰ κατώτερα [μέρη] τῆς γῆς</strong>;» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/4/#L8-9">Εφ 4:8-9</a>)</p></blockquote><p> Η ψυχή του Χριστού δεν εγκαταλείφθηκε στην κόλαση. Δεν εγκαταλείφθηκε το <u>σώμα</u> στη γη (στον τάφο), αλλά η <u>ψυχή</u> δεν εγκαταλείφθηκε στην κόλαση:</p><blockquote><p>«προϊδὼν ἐλάλησεν περὶ τῆς ἀναστάσεως τοῦ Χριστοῦ ὅτι <strong>οὔτε ἐγκατελείφθη εἰς ᾅδην</strong> οὔτε ἡ σὰρξ αὐτοῦ εἶδεν διαφθοράν.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/2/#L31">Πραξ 2:31</a>)</p></blockquote><p> Οι νεκροί βλέπουν, οι νεκροί κρίνονται, τους νεκρούς τους παραδίδει η κόλαση:</p><blockquote><p>«καὶ <strong>εἶδον τοὺς νεκρούς</strong>, τοὺς μεγάλους καὶ τοὺς μικρούς, ἑστῶτας ἐνώπιον τοῦ θρόνου, καὶ βιβλία ἠνοίχθησαν· καὶ ἄλλο βιβλίον ἠνοίχθη, ὅ ἐστιν τῆς ζωῆς· καὶ <strong>ἐκρίθησαν οἱ νεκροὶ ἐκ τῶν γεγραμμένων ἐν τοῖς βιβλίοις κατὰ τὰ ἔργα αὐτῶν</strong>. καὶ ἔδωκεν ἡ θάλασσα τοὺς νεκροὺς τοὺς ἐν αὐτῇ, καὶ <strong>ὁ θάνατος καὶ ὁ ᾅδης ἔδωκαν τοὺς νεκροὺς τοὺς ἐν αὐτοῖς</strong>, καὶ ἐκρίθησαν ἕκαστος κατὰ τὰ ἔργα αὐτῶν.» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/20/#L12-13">Απ 20:12-13</a>)</p></blockquote>
