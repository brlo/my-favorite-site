  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: '<h2>Ορισμός</h2><p>Η κόλαση — ως τόπος διαμονής των καταδικασμένων αμαρτωλών, μετά την ένδοξη Δεύτερη Παρουσία του Χριστού και τη φοβερή Κρίση. Να αλλάξει κανείς αυτή τη μοίρα μετά τη φοβερή Κρίση δεν θα μπορεί πλέον. Και τα βάσανα των καταδικασμένων και η μακαριότητα των δικαίων θα διαρκούν εξίσου αιώνια.</p><h2>Τα κολαστήρια βάσανα δεν έχουν τέλος</h2><blockquote><p>«καὶ ὁ καπνὸς τοῦ βασανισμοῦ αὐτῶν <strong>εἰς αἰῶνας αἰώνων</strong> ἀναβαίνει, καὶ <strong>οὐκ ἔχουσιν ἀνάπαυσιν ἡμέρας καὶ νυκτός</strong>, οἱ προσκυνοῦντες τὸ θηρίον καὶ τὴν εἰκόνα αὐτοῦ, καὶ εἴ τις λαμβάνει τὸ χάραγμα τοῦ ὀνόματος αὐτοῦ.» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/14/#L11">Απ 14:11</a>)</p></blockquote><blockquote><p>«ἢ δύο ὀφθαλμοὺς ἔχοντα βληθῆναι εἰς τὴν γέενναν, ὅπου <strong>ὁ σκώληξ αὐτῶν οὐ τελευτᾷ καὶ τὸ πῦρ οὐ σβέννυται</strong>·» (<a href="https://bibleox.com/el/gr-lxx-byz/mk/9/#L47-48">Μκ 9:47-48</a>)</p></blockquote><blockquote><p>«καὶ ὁ διάβολος ὁ πλανῶν αὐτοὺς ἐβλήθη εἰς τὴν λίμνην τοῦ πυρὸς καὶ θείου, ὅπου καὶ τὸ θηρίον καὶ ὁ ψευδοπροφήτης, καὶ <strong>βασανισθήσονται ἡμέρας καὶ νυκτὸς εἰς τοὺς αἰῶνας τῶν αἰώνων</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/20/#L10">Απ 20:10</a>)</p></blockquote><blockquote><p>«καὶ πολλοὶ τῶν καθευδόντων ἐν τῷ πλάτει τῆς γῆς ἀναστήσονται, οἱ μὲν εἰς ζωὴν αἰώνιον, οἱ δὲ <strong>εἰς ὀνειδισμόν, οἱ δὲ εἰς διασπορὰν καὶ αἰσχύνην αἰώνιον</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/dan/12/#L2">Δν 12:2</a>)</p></blockquote><blockquote><p>«καὶ <strong>ἀπελεύσονται οὗτοι εἰς κόλασιν αἰώνιον</strong>, οἱ δὲ δίκαιοι εἰς ζωὴν αἰώνιον.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/25/#L46">Μτ 25:46</a>)</p></blockquote><blockquote><p>«ὃς δ᾿ ἂν βλασφημήσῃ εἰς τὸ πνεῦμα τὸ ἅγιον <strong>οὐκ ἔχει ἄφεσιν εἰς τὸν αἰῶνα</strong>, ἀλλὰ <strong>ἔνοχός ἐστιν αἰωνίου ἁμαρτήματος</strong> —» (<a href="https://bibleox.com/el/gr-lxx-byz/mk/3/#L29">Μκ 3:29</a>)</p></blockquote><blockquote><p>«τοῖς μὴ εἰδόσιν θεὸν καὶ τοῖς μὴ ὑπακούουσιν τῷ εὐαγγελίῳ τοῦ κυρίου ἡμῶν Ἰησοῦ, οἵτινες <strong>δίκην τίσουσιν ὄλεθρον αἰώνιον</strong> ἀπὸ προσώπου τοῦ κυρίου καὶ ἀπὸ τῆς δόξης τῆς ἰσχύος αὐτοῦ,» (<a href="https://bibleox.com/el/gr-lxx-byz/2sol/1/#L8-9">Β Θεσ 1:8-9</a>)</p></blockquote><blockquote><p>«Οὗτοί εἰσιν πηγαὶ ἄνυδροι καὶ ὁμίχλαι ὑπὸ λαίλαπος ἐλαυνόμεναι, οἷς <strong>ὁ ζόφος τοῦ σκότους τετήρηται</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/2pet/2/#L17">Β Πε 2:17</a>)</p></blockquote><blockquote><p>«βαπτισμῶν <strong>διδαχῆς</strong>, ἐπιθέσεώς τε χειρῶν, ἀναστάσεώς τε νεκρῶν, καὶ <strong>κρίματος αἰωνίου</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/6/#L2">Εβρ 6:2</a>)</p></blockquote><h2>Τιμωρούνται και εκείνοι που δεν γνώριζαν το θέλημα του Θεού</h2><blockquote><p>«εἴπερ δίκαιον παρὰ θεῷ ἀνταποδοῦναι τοῖς θλίβουσιν ὑμᾶς θλῖψιν καὶ ὑμῖν τοῖς θλιβομένοις ἄνεσιν μεθ᾿ ἡμῶν ἐν τῇ ἀποκαλύψει τοῦ κυρίου Ἰησοῦ ἀπ᾿ οὐρανοῦ μετ᾿ ἀγγέλων δυνάμεως αὐτοῦ ἐν πυρὶ φλογός, διδόντος ἐκδίκησιν τοῖς μὴ εἰδόσιν θεὸν καὶ τοῖς μὴ ὑπακούουσιν τῷ εὐαγγελίῳ τοῦ κυρίου ἡμῶν Ἰησοῦ, οἵτινες <strong>δίκην τίσουσιν ὄλεθρον αἰώνιον</strong> ἀπὸ προσώπου τοῦ κυρίου καὶ ἀπὸ τῆς δόξης τῆς ἰσχύος αὐτοῦ,» (<a href="https://bibleox.com/el/gr-lxx-byz/2sol/1/#L6-9">Β Θεσ 1:6-9</a>)</p></blockquote><blockquote><p>«ἐκεῖνος δὲ ὁ δοῦλος ὁ γνοὺς τὸ θέλημα τοῦ κυρίου αὐτοῦ καὶ μὴ ἑτοιμάσας ἢ ποιήσας πρὸς τὸ θέλημα αὐτοῦ δαρήσεται πολλάς· <strong>ὁ δὲ μὴ γνούς, ποιήσας δὲ ἄξια πληγῶν, δαρήσεται ὀλίγας</strong>. παντὶ δὲ ᾧ ἐδόθη πολύ, πολὺ ζητηθήσεται παρ᾿ αὐτοῦ, καὶ ᾧ παρέθεντο πολύ, περισσότερον αἰτήσουσιν αὐτόν.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/12/#L47-48">Λκ 12:47-48</a>)</p></blockquote><blockquote><p>«ἔσται γὰρ καιρὸς ὅτε τῆς ὑγιαινούσης διδασκαλίας οὐκ ἀνέξονται, ἀλλὰ κατὰ τὰς ἰδίας ἐπιθυμίας <strong>ἑαυτοῖς ἐπισωρεύσουσιν διδασκάλους κνηθόμενοι τὴν ἀκοήν</strong>,» (<a href="https://bibleox.com/el/gr-lxx-byz/2tim/4/#L3">Β Τιμ 4:3</a>)</p></blockquote><blockquote><p>«ἀνάγκην ἔσχον γράψαι ὑμῖν παρακαλῶν <strong>ἐπαγωνίζεσθαι τῇ ἅπαξ παραδοθείσῃ τοῖς ἁγίοις πίστει</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/iud/1/#L3">Ιούδα 1:3</a>)</p></blockquote><h2>Κριτική</h2><h3>Το δόγμα των ατελείωτων κολαστικών βασάνων απομακρύνει τους ανθρώπους από τον Χριστό;</h3><p>Αυτό δεν είναι επιχείρημα. Στον αμαρτωλό γενικά δεν είναι ευχάριστο να ακούει για την τιμωρία της αμαρτίας. Τι λοιπόν, να του υποσχεθούμε μακαριότητα για την αμαρτία; Επίσης, στον άνθρωπο που αγαπά την αμαρτία δεν είναι ευχάριστο να ακούει τη διδασκαλία:</p><ul><li><p>για τη μετάνοια,</p></li><li><p>για την εγκατάλειψη των αμαρτιών,</p></li><li><p>για τη διόρθωση της ζωής,</p></li><li><p>για το ότι ο Χριστός είναι ο μόνος Σωτήρας, και άλλοι δρόμοι δεν οδηγούν στη σωτηρία (<a href="https://bibleox.com/el/gr-lxx-byz/act/4/#L12">Πραξ 4:12</a>),</p></li><li><p>για την αγάπη προς τους εχθρούς, την άρνηση της εκδίκησης, τη συγχώρηση των χρεών, την ευεργεσία προς εκείνους που μας μισούν (<a href="https://bibleox.com/el/gr-lxx-byz/mf/5/#L44">Μτ 5:44</a>· <a href="https://bibleox.com/el/gr-lxx-byz/lk/6/#L27">Λκ 6:27</a>· <a href="https://bibleox.com/el/gr-lxx-byz/lk/6/#L35">Λκ 6:35</a>)</p></li><li><p>για την άρνηση της επιδίωξης του πλουτισμού (<a href="https://bibleox.com/el/gr-lxx-byz/mf/19/#L24">Μτ 19:24</a>),</p></li><li><p>για τη μονογαμία (<a href="https://bibleox.com/el/gr-lxx-byz/mf/19/#L10">Μτ 19:10</a>).</p></li></ul><p>Αλλά αυτό, βέβαια, δεν σημαίνει ότι πρέπει να παραιτηθούμε από αυτό. Και γιατί δεν σημαίνει; Επειδή αυτό είναι αλήθεια. Αν ο άνθρωπος δεν ακούσει αυτά τα λόγια, τότε η προειδοποίηση για την τιμωρία θα εκπληρωθεί πραγματικά, δεν ήταν μάταιη. Τον προειδοποιούμε για να μη του συμβεί αυτό. Παρόμοια και με τα αιώνια βάσανα: αν αυτή είναι αληθινή διδασκαλία, τότε γιατί πρέπει να διορθώσουμε την αλήθεια, αφαιρώντας αυτό που δεν είναι ευχάριστο στον αμαρτωλό να ακούει;</p><p>Στη διδασκαλία πρέπει να ξεκινάμε από την αλήθεια, και όχι από αυτό που είναι ευχάριστο στους ανθρώπους ν'' ακούν:</p>'
