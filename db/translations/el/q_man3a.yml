  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <h2>Σύντομα για τα τελώνια</h2><p>Τα τελώνια — η διδασκαλία της Ορθόδοξης Εκκλησίας ότι μετά την κοίμηση του ανθρώπου οι πεσόντες άγγελοι προσπαθούν να κυριεύσουν την ψυχή του. Έτσι, η ψυχή υποβάλλεται σε φοβερές δοκιμασίες, κατά τις οποίες οι άγγελοι του Θεού προσπαθούν να προστατεύσουν τις δίκαιες ψυχές και να τις οδηγήσουν στον Θεό. Αυτή η διδασκαλία εκφράζεται συμβολικά, εικονικά, ως ορισμένοι σταθμοί, σε κάθε έναν από τους οποίους η ψυχή δοκιμάζεται στα διάφορα πάθη. Οι άγγελοι, στην περίπτωση αυτή, είναι όργανα της θείας δικαιοσύνης.</p><h2>Στην πονηρή ημέρα να αντισταθείτε στα πνεύματα της πονηρίας εν τοις επουρανίοις, να τα υπερνικήσετε όλα</h2><p>Ο διάβολος είναι ο άρχων που εξουσιάζει τον αέρα:</p><blockquote><p>«Καὶ ὑμᾶς ὄντας νεκροὺς τοῖς παραπτώμασιν καὶ ταῖς ἁμαρτίαις ὑμῶν, ἐν αἷς ποτε περιεπατήσατε κατὰ τὸν αἰῶνα τοῦ κόσμου τούτου, κατὰ <strong><mark>τὸν ἄρχοντα τῆς ἐξουσίας τοῦ ἀέρος</mark></strong>, τοῦ πνεύματος τοῦ νῦν ἐνεργοῦντος ἐν τοῖς υἱοῖς τῆς ἀπειθείας·» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/2/#L1-2">Εφ 2:1-2</a>)</p></blockquote><p>Πρέπει να προετοιμαζόμαστε, ώστε στην πονηρή ημέρα (την ημέρα του θανάτου) να τα υπερνικήσουμε όλα:</p><blockquote><p>«<strong><mark>ἐνδύσασθε τὴν πανοπλίαν τοῦ θεοῦ πρὸς τὸ δύνασθαι ὑμᾶς στῆναι πρὸς τὰς μεθοδείας τοῦ διαβόλου</mark></strong>· ὅτι οὐκ ἔστιν ἡμῖν ἡ πάλη πρὸς αἷμα καὶ σάρκα, ἀλλὰ πρὸς τὰς ἀρχάς, πρὸς τὰς ἐξουσίας, πρὸς τοὺς κοσμοκράτορας τοῦ σκότους τούτου, <strong><mark>πρὸς τὰ πνευματικὰ τῆς πονηρίας ἐν τοῖς ἐπουρανίοις</mark></strong>. διὰ τοῦτο ἀναλάβετε τὴν πανοπλίαν τοῦ θεοῦ, ἵνα δυνηθῆτε <strong><mark>ἀντιστῆναι ἐν τῇ ἡμέρᾳ τῇ πονηρᾷ</mark></strong> καὶ <strong><mark>ἅπαντα κατεργασάμενοι στῆναι</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/6/#L11-13">Εφ 6:11-13</a>)</p></blockquote><h2>Ο διάβολος χωρίς την άδεια του Θεού δεν μπορεί να αγγίξει τους δικαίους, ζητά πώς να πάρει άδεια να τους κυριεύσει</h2><p>Ο διάβολος ζητά πώς να κατηγορήσει ή να συκοφαντήσει τον άνθρωπο, για να τον κυριεύσει:</p><blockquote><p>«ὑπολαβὼν δὲ ὁ διάβολος εἶπεν τῷ κυρίῳ Δέρμα ὑπὲρ δέρματος· ὅσα ὑπάρχει ἀνθρώπῳ, ὑπὲρ τῆς ψυχῆς αὐτοῦ ἐκτείσει· οὐ μὴν δὲ ἀλλὰ ἀποστείλας τὴν χεῖρά σου ἅψαι τῶν ὀστῶν αὐτοῦ καὶ τῶν σαρκῶν αὐτοῦ· εἰ μὴν εἰς πρόσωπόν σε εὐλογήσει. εἶπεν δὲ ὁ κύριος τῷ διαβόλῳ <strong><mark>Ἰδοὺ παραδίδωμί σοι αὐτόν, μόνον τὴν ψυχὴν αὐτοῦ διαφύλαξον</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/iov/2/#L4-6">Ιωβ 2:4-6</a>)</p></blockquote><blockquote><p>«ὁ δὲ Μιχαὴλ ὁ ἀρχάγγελος, ὅτε τῷ διαβόλῳ διακρινόμενος διελέγετο <strong><mark>περὶ τοῦ Μωϋσέως σώματος</mark></strong>, οὐκ ἐτόλμησεν κρίσιν ἐπενεγκεῖν βλασφημίας, ἀλλὰ εἶπεν, Ἐπιτιμήσαι σοι κύριος.» (<a href="https://bibleox.com/el/gr-lxx-byz/iud/1/#L9">Ιούδα 1:9</a>)</p></blockquote><h2>Ο διάβολος πάντοτε ζητά ποιον να καταπιεί</h2><blockquote><p>«Νήψατε, γρηγορήσατε. <strong>ὁ ἀντίδικος ὑμῶν διάβολος ὡς λέων ὠρυόμενος περιπατεῖ ζητῶν [τινα] καταπιεῖν</strong>·» (<a href="https://bibleox.com/el/gr-lxx-byz/1pet/5/#L8">Α Πε 5:8</a>)</p></blockquote><h2>Οι άγγελοι αποστέλλονται σε διακονία σε εκείνους που πρόκειται να κληρονομήσουν τη σωτηρία</h2><blockquote><p>«πρὸς τίνα δὲ τῶν ἀγγέλων εἴρηκέν ποτε, Κάθου ἐκ δεξιῶν μου ἕως ἂν θῶ τοὺς ἐχθρούς σου ὑποπόδιον τῶν ποδῶν σου; <strong>οὐχὶ πάντες εἰσὶν λειτουργικὰ πνεύματα εἰς διακονίαν ἀποστελλόμενα διὰ τοὺς μέλλοντας κληρονομεῖν σωτηρίαν</strong>;» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/1/#L13-14">Εβρ 1:13-14</a>)</p></blockquote><h2>Οι άγγελοι «μεταφέρουν» τις ψυχές των δικαίων μετά τον θάνατο</h2><p>Οι ψυχές μετά τον χωρισμό από το σώμα μετακινούνται. Οι ψυχές πρέπει να διανύσουν τον δρόμο προς τον τόπο της μελλοντικής τους διαμονής.</p><p>Οι άγγελοι φρόντισαν για την ψυχή του δικαίου Λαζάρου, αλλά αυτό δεν λέγεται για τον πλούσιο:</p><blockquote><p>«Ἄνθρωπος δέ τις ἦν πλούσιος, καὶ ἐνεδιδύσκετο πορφύραν καὶ βύσσον εὐφραινόμενος καθ᾿ ἡμέραν λαμπρῶς. πτωχὸς δέ τις ὀνόματι Λάζαρος ἐβέβλητο πρὸς τὸν πυλῶνα αὐτοῦ εἱλκωμένος καὶ ἐπιθυμῶν χορτασθῆναι ἀπὸ τῶν πιπτόντων ἀπὸ τῆς τραπέζης τοῦ πλουσίου· ἀλλὰ καὶ οἱ κύνες ἐρχόμενοι ἐπέλειχον τὰ ἕλκη αὐτοῦ. <strong><mark>ἐγένετο δὲ ἀποθανεῖν τὸν πτωχὸν καὶ ἀπενεχθῆναι αὐτὸν ὑπὸ τῶν ἀγγέλων εἰς τὸν κόλπον Ἀβραάμ</mark></strong>· <strong>ἀπέθανεν δὲ καὶ ὁ πλούσιος καὶ ἐτάφη</strong>. καὶ <strong>ἐν τῷ ᾅδῃ ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ, ὑπάρχων ἐν βασάνοις</strong>, ὁρᾷ Ἀβραὰμ ἀπὸ μακρόθεν καὶ Λάζαρον ἐν τοῖς κόλποις αὐτοῦ. καὶ αὐτὸς φωνήσας εἶπεν, Πάτερ Ἀβραάμ, ἐλέησόν με καὶ πέμψον Λάζαρον ἵνα βάψῃ τὸ ἄκρον τοῦ δακτύλου αὐτοῦ ὕδατος καὶ καταψύξῃ τὴν γλῶσσάν μου, ὅτι ὀδυνῶμαι ἐν τῇ φλογὶ ταύτῃ. εἶπεν δὲ Ἀβραάμ, Τέκνον, μνήσθητι ὅτι <strong>ἀπέλαβες τὰ ἀγαθά σου ἐν τῇ ζωῇ σου, καὶ Λάζαρος ὁμοίως τὰ κακά· νῦν δὲ ὧδε παρακαλεῖται σὺ δὲ ὀδυνᾶσαι</strong>. καὶ ἐν πᾶσι τούτοις μεταξὺ ἡμῶν καὶ ὑμῶν χάσμα μέγα ἐστήρικται, ὅπως οἱ θέλοντες διαβῆναι ἔνθεν πρὸς ὑμᾶς μὴ δύνωνται, μηδὲ ἐκεῖθεν πρὸς ἡμᾶς διαπερῶσιν.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/16/#L19-26">Λκ 16:19-26</a>)</p></blockquote><p>Αιφνιδίως παίρνονται οι αμαρτωλές ψυχές:</p><blockquote><p>«καὶ ἐρῶ τῇ ψυχῇ μου, Ψυχή, ἔχεις πολλὰ ἀγαθὰ κείμενα εἰς ἔτη πολλά· ἀναπαύου, φάγε, πίε, εὐφραίνου. εἶπεν δὲ αὐτῷ ὁ θεός, <strong><mark>Ἄφρων, ταύτῃ τῇ νυκτὶ τὴν ψυχήν σου ἀπαιτοῦσιν ἀπὸ σοῦ</mark></strong>· ἃ δὲ ἡτοίμασας, τίνι ἔσται; <strong>οὕτως ὁ θησαυρίζων ἑαυτῷ καὶ μὴ εἰς θεὸν πλουτῶν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/12/#L19-21">Λκ 12:19-21</a>)</p></blockquote><h2>Την ώρα του θανάτου ο διάβολος πηγαίνει στον Χριστό, αλλά δεν έχει τίποτε να Του καταλογίσει</h2><p>Μια μέρα πριν από την κοίμησή Του ο Χριστός μιλά για την προσέγγιση του διαβόλου, που δεν έχει τίποτε δικό του στον Χριστό, δεν μπορεί να Τον κατηγορήσει για αμαρτίες:</p><blockquote><p>«οὐκέτι πολλὰ λαλήσω μεθ᾿ ὑμῶν, <strong><mark>ἔρχεται γὰρ ὁ τοῦ κόσμου ἄρχων· καὶ ἐν ἐμοὶ οὐκ ἔχει οὐδέν</mark></strong>,» (<a href="https://bibleox.com/el/gr-lxx-byz/in/14/#L30">Ιω 14:30</a>)</p></blockquote><p>Αλλά με τους άλλους ανθρώπους δεν είναι έτσι:</p><blockquote><p>«<strong><mark>ὁ ποιῶν τὴν ἁμαρτίαν ἐκ τοῦ διαβόλου ἐστίν</mark></strong>, ὅτι ἀπ᾿ ἀρχῆς ὁ διάβολος ἁμαρτάνει. εἰς τοῦτο ἐφανερώθη ὁ υἱὸς τοῦ θεοῦ, ἵνα λύσῃ τὰ ἔργα τοῦ διαβόλου.» (<a href="https://bibleox.com/el/gr-lxx-byz/1in/3/#L8">Α Ιω 3:8</a>)</p></blockquote><h2>Ο Χριστός ανήλθε στον ουρανό δια του αέρα πάνω σε νεφέλη</h2><blockquote><p>«καὶ ταῦτα εἰπὼν βλεπόντων αὐτῶν <strong><mark>ἐπήρθη, καὶ νεφέλη ὑπέλαβεν αὐτὸν ἀπὸ τῶν ὀφθαλμῶν αὐτῶν</mark></strong>. καὶ ὡς ἀτενίζοντες ἦσαν εἰς τὸν οὐρανὸν <strong><mark>πορευομένου αὐτοῦ</mark></strong>, καὶ ἰδοὺ ἄνδρες δύο παρειστήκεισαν αὐτοῖς ἐν ἐσθήσεσι λευκαῖς,» (<a href="https://bibleox.com/el/gr-lxx-byz/act/1/#L9-10">Πραξ 1:9-10</a>)</p></blockquote><h2>Με τον ίδιο τρόπο ο Χριστός θα έρθει ξανά</h2><blockquote><p>«ἡμῶν γὰρ τὸ πολίτευμα ἐν οὐρανοῖς ὑπάρχει, <strong><mark>ἐξ οὗ καὶ σωτῆρα</mark> ἀπεκδεχόμεθα</strong> κύριον Ἰησοῦν Χριστόν,» (<a href="https://bibleox.com/el/gr-lxx-byz/fil/3/#L20">Φιλ 3:20</a>)</p></blockquote><blockquote><p>«οἳ καὶ εἶπαν, Ἄνδρες Γαλιλαῖοι, τί ἑστήκατε βλέποντες εἰς τὸν οὐρανόν; οὗτος ὁ Ἰησοῦς <strong><mark>ὁ ἀναλημφθεὶς ἀφ᾿ ὑμῶν εἰς τὸν οὐρανὸν οὕτως ἐλεύσεται ὃν τρόπον ἐθεάσασθε αὐτὸν πορευόμενον εἰς τὸν οὐρανόν</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/1/#L11">Πραξ 1:11</a>)</p></blockquote>
