  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: '<h2>Γιατί τιμώνται τα λείψανα των αγίων δικαίων</h2><p>Τα λείψανα των αγίων δικαίων τιμώνται για τον ίδιο λόγο που τιμώνται γενικά και οι ίδιοι οι δίκαιοι (λεπτομέρειες στο επόμενο άρθρο: <a href="https://bibleox.com/el/el/w/%CE%97_%CF%84%CE%B9%CE%BC%CE%AE_%CF%84%CF%89%CE%BD_%CE%B1%CE%B3%CE%AF%CF%89%CE%BD">η τιμή των αγίων</a>), και τιμώνται εξαιτίας της μέθεξης του Θεού, εξαιτίας της ενέργειας μέσα τους της χάρης του Θεού (<a href="https://bibleox.com/el/el/w/%CE%9F_%CE%AC%CE%BD%CE%B8%CF%81%CF%89%CF%80%CE%BF%CF%82_%CE%B5%CE%AF%CE%BD%CE%B1%CE%B9_%CE%BD%CE%B1%CF%8C%CF%82_%CF%84%CE%BF%CF%85_%CE%98%CE%B5%CE%BF%CF%8D">ο άνθρωπος — ναός του Θεού</a>). Ο δίκαιος τιμάται ολόκληρος, και όχι κάποιο ξεχωριστό μέρος του (<a href="https://bibleox.com/el/el/w/%CE%97_%CF%83%CF%8D%CF%83%CF%84%CE%B1%CF%83%CE%B7_%CF%84%CE%BF%CF%85_%CE%B1%CE%BD%CE%B8%CF%81%CF%8E%CF%80%CE%BF%CF%85">η σύσταση της φύσης του ανθρώπου</a>). Τιμάται όχι μόνο η <strong>ψυχή</strong>, αλλά και το <strong>σώμα</strong> (<a href="https://bibleox.com/el/gr-lxx-byz/4ts/13/#L21">Δ Βασ 13:21</a>), ακόμη δε και τα <strong>προσωπικά του αντικείμενα</strong> (<a href="https://bibleox.com/el/gr-lxx-byz/act/19/#L12">Πραξ 19:12</a>) και η <strong>εικόνα</strong> (<a href="https://bibleox.com/el/gr-lxx-byz/act/5/#L15">Πραξ 5:15</a>) του δικαίου, μέσω των οποίων ο Θεός παρέχει τη χάρη Του, επιτελώντας θαύματα και θεραπείες.</p><p>Επειδή οι άγιοι <strong>τιμώνται εξαιτίας της μέθεξης του Θεού και της ενέργειας μέσα τους της θείας χάρης</strong>, και ο Θεός παρέχει τη χάρη Του όχι μόνο μέσω των ζωντανών σωμάτων των αγίων αλλά και μέσω των νεκρών (<a href="https://bibleox.com/el/gr-lxx-byz/4ts/13/#L21">Δ Βασ 13:21</a>), τα σώματα των αγίων τιμώνται εξαιτίας της χάρης όχι μόνο κατά τη ζωή αλλά και μετά τον θάνατο (μετά τον χωρισμό του σώματος από την ψυχή).</p><p>Ο Θεός δεν αποστρέφεται τα σωματικά λείψανα των φίλων Του. Ο Θεός φροντίζει για τα λείψανα των δικαίων (<a href="https://bibleox.com/el/gr-lxx-byz/ps/33/#L19-20">Ψλ 33:19-20</a>· <a href="https://bibleox.com/el/gr-lxx-byz/in/19/#L33,36">Ιω 19:33,36</a>) και συνεχίζει να ενεργεί μέσω αυτών (<a href="https://bibleox.com/el/gr-lxx-byz/4ts/13/#L21">Δ Βασ 13:21</a>). Ούτε οι μυροφόρες γυναίκες αποστρέφονταν τα λείψανα, αυτές που την τρίτη ημέρα μετά τον θάνατο του Σωτήρα πήγαν να ανοίξουν τον τάφο Του για να αλείψουν με ευώδες μύρο το νεκρό σώμα του Χριστού (<a href="https://bibleox.com/el/gr-lxx-byz/mk/16/#L1-3">Μκ 16:1-3</a>), παρόλο που ο νόμος του Μωυσή απαγόρευε σε οποιονδήποτε εκτός από τους συγγενείς να αγγίζει σώματα νεκρών (<a href="https://bibleox.com/el/gr-lxx-byz/lev/21/#L1-4">Λευ 21:1-4</a>).</p><h2>Συχνές ερωτήσεις</h2><h3>Γιατί τα λείψανα βρίσκονται στον ναό και όχι στη γη</h3><p><strong>Ο ναός είναι ο τάφος</strong> για τα λείψανα του δικαίου. Τα λείψανα φυλάσσονται στον ναό μέσα σε σαρκοφάγο (λάρνακα, κιβωτό). Τα λόγια του Θεού ότι ο άνθρωπος είναι χώμα και γι’ αυτό θα επιστρέψει στη γη (<a href="https://bibleox.com/el/gr-lxx-byz/gen/3/#L19">Γεν 3:19</a>) σημαίνουν ότι το σώμα του ανθρώπου, φτιαγμένο από χώμα, θα ξαναγίνει χώμα, δηλαδή θα φθαρεί και θα διαλυθεί, και θα γίνει πάλι εκείνο που ήταν από την αρχή — δηλαδή χώμα.</p><p>Πολλοί δίκαιοι δεν θάφτηκαν κυριολεκτικά μέσα στη γη. Αντίθετα, οι δίκαιοι φρόντιζαν να θάβουν τους δικαίους με κάποιον ξεχωριστό τρόπο, διαλέγοντας συχνά χώρους για την ταφή τους.</p><ol><li><p><strong>Ο Αβραάμ έθαβε τους συγγενείς του σε σπήλαιο που αγόρασε ειδικά</strong>. Μάλιστα, αναζήτησε τόπο ταφής απευθυνόμενος στους κατοίκους, κι εκείνοι του πρόσφεραν τον <strong>καλύτερο</strong> τόπο ταφής (<a href="https://bibleox.com/el/gr-lxx-byz/gen/23/#L2-6">Γεν 23:2-6</a>). Στο τέλος, ο Αβραάμ ζήτησε και αγόρασε σε πλήρη κυριότητα το σπήλαιο που υπέδειξε ο ίδιος (<a href="https://bibleox.com/el/gr-lxx-byz/gen/23/#L7-13,17-20">Γεν 23:7-13,17-20</a>), για να θάβει εκεί τους συγγενείς του. Στο ίδιο σπήλαιο έθαψαν τον ίδιο τον Αβραάμ (<a href="https://bibleox.com/el/gr-lxx-byz/gen/25/#L9-10">Γεν 25:9-10</a>) και τη γυναίκα του Σάρρα (<a href="https://bibleox.com/el/gr-lxx-byz/gen/23/#L19">Γεν 23:19</a>), τον Ισαάκ και τη γυναίκα του Ρεβέκκα (<a href="https://bibleox.com/el/gr-lxx-byz/gen/49/#L1,29-33">Γεν 49:1,29-33</a>), τον Ιακώβ και τη γυναίκα του Λεία (<a href="https://bibleox.com/el/gr-lxx-byz/gen/49/#L1,29-33">Γεν 49:1,29-33</a>· <a href="https://bibleox.com/el/gr-lxx-byz/gen/50/#L12-13">Γεν 50:12-13</a>.</p></li><li><p><strong>Τον Κύριο Ιησού Χριστό τον έθαψαν σε ειδικό χώρο μέσα στον βράχο</strong>, που είχε λαξεύσει για τον εαυτό του ένας πλούσιος άνθρωπος — ο Ιωσήφ από την Αριμαθαία (<a href="https://bibleox.com/el/gr-lxx-byz/mf/27/#L57,60">Μτ 27:57,60</a>· <a href="https://bibleox.com/el/gr-lxx-byz/mk/15/#L46">Μκ 15:46</a>· <a href="https://bibleox.com/el/gr-lxx-byz/lk/23/#L50-53">Λκ 23:50-53</a>· <a href="https://bibleox.com/el/gr-lxx-byz/in/19/#L41">Ιω 19:41</a>). Έτσι ακριβώς το είχε ορίσει από την αρχή ο ίδιος ο Θεός, προφητεύοντάς το μέσω του προφήτη Ησαΐα: «<em>καὶ δώσω τοὺς πονηροὺς ἀντὶ τῆς ταφῆς αὐτοῦ καὶ τοὺς πλουσίους ἀντὶ τοῦ θανάτου αὐτοῦ</em>» (<a href="https://bibleox.com/el/gr-lxx-byz/is/53/#L9">Ησ 53:9</a>.</p></li><li><p><strong>Οι αρχαίοι χριστιανοί έθαβαν συχνά τους δικαίους σε ειδικούς χώρους στις κατακόμβες</strong>, όπου τελούσαν κοντά στα λείψανα τις ιερές ακολουθίες (παράδειγμα).</p></li><li><p>Όταν, 300 χρόνια αργότερα, τον 4ο αιώνα, ήρθαν ασφαλείς καιροί για τον χριστιανισμό, τα λείψανα των αγίων άρχισαν να θάβονται μέσα στους ναούς, τοποθετούμενα όπως ο δίκαιος Ιωσήφ σε σαρκοφάγο (<a href="https://bibleox.com/el/gr-lxx-byz/gen/50/#L26">Γεν 50:26</a>, παράδειγμα), ή τοποθετούνταν σε ειδικό χώρο (κρύπτη) κάτω από το κύριο μέρος του ναού (το ιερό), ή έχτιζαν ειδικούς ξεχωριστούς χώρους (μαρτύρια) (παράδειγμα).</p></li></ol><p>Έτσι, <strong>από τα πανάρχαια χρόνια οι δίκαιοι θάβουν τους δικαίους σε ειδικούς χώρους, και όχι στη γη</strong>. Το ίδιο γίνεται στην Εκκλησία και σήμερα: τα λείψανα του δικαίου τοποθετούνται σε σαρκοφάγο μέσα σε ειδικό χώρο — τον ναό, όπου τελούνται οι ιερές ακολουθίες.</p><p>Όπως κι αν ενεργήσουμε, η ουσία είναι η ίδια:</p><ul><li><p>να χτίσουμε ένα μαρτύριο για να τοποθετηθεί η σαρκοφάγος με τα λείψανα του αγίου, όπου η Εκκλησία συγκεντρώνεται για να τελέσει τις ιερές ακολουθίες,</p></li><li><p>ή αντίστροφα, να χτίσουμε έναν ναό για τις ιερές ακολουθίες και εκεί να τοποθετήσουμε τη σαρκοφάγο με τα λείψανα του αγίου.</p></li></ul><p>Η Εκκλησία, από τα πανάρχαια χρόνια της, χτίζει χώρους για να τοποθετούνται σε αυτούς οι τάφοι των αγίων, και τελεί εκεί τις ιερές ακολουθίες.</p><h3>Μετακομιδή λειψάνων</h3><p>Η μετακομιδή των λειψάνων των δικαίων γινόταν επανειλημμένα, όπως φαίνεται στην Αγία Γραφή, χωρίς καμία καταδίκη. Για παράδειγμα, τον πατριάρχη Ιωσήφ τον έθαψαν σε σαρκοφάγο (λάρνακα, κιβωτό) στην Αίγυπτο (<a href="https://bibleox.com/el/gr-lxx-byz/gen/50/#L26">Γεν 50:26</a>), και αργότερα ο προφήτης Μωυσής με τον λαό επί περισσότερα από 40 χρόνια μετέφεραν τα λείψανα του Ιωσήφ στην έρημο, για να τα θάψει στον τόπο που ζήτησε ο ίδιος ο Ιωσήφ. Λεπτομέρειες πιο κάτω.</p><h3>Διαμελισμός των λειψάνων</h3><p>Από τα πανάρχαια χρόνια, τα λείψανα των αγίων δικαίων περιέρχονταν στην Εκκλησία μετά από φρικτά βασανιστήρια (τεμαχισμούς, καύσεις), όχι ολόκληρα και όχι όλα τα μέρη συγχρόνως (<a href="https://bibleox.com/el/gr-lxx-byz/mf/14/#L11">Μτ 14:11</a>· <a href="https://bibleox.com/el/gr-lxx-byz/mk/6/#L28">Μκ 6:28</a>). Ο Θεός όμως στη συνέχεια ενεργούσε μέσω των λειψάνων των δικαίων, ανεξάρτητα από το αν είναι συγκεντρωμένα μαζί ή όχι. Η ίδια η Εκκλησία, αν τα λείψανα του δικαίου διασώθηκαν ολόκληρα, τα φυλάσσει ολόκληρα σε ειδικές θήκες (σαρκοφάγους, λάρνακες), τοποθετημένες μέσα στους ναούς. Οι διαμελισμοί μπορούσαν να γίνουν για λόγους ανάγκης, για να σωθούν τα λείψανα κατά τη διάρκεια φυσικών καταστροφών και επιδρομών εχθρών. Μερικές φορές, για την τιμή ενός δικαίου σε άλλον τόπο, λαμβάνεται ένα πολύ μικρό τεμάχιο-θραύσμα από τα λείψανα.</p><h2>Η στάση του Θεού απέναντι στα λείψανα των ανθρώπων</h2><h3>Ο Θεός διαφυλάσσει τα λείψανα των δικαίων</h3><blockquote><p>«πολλαὶ αἱ θλίψεις τῶν <strong><mark>δικαίων</mark></strong>, καὶ ἐκ πασῶν αὐτῶν ῥύσεται αὐτούς. κύριος <strong><mark>φυλάσσει πάντα τὰ ὀστᾶ αὐτῶν</mark>, ἓν ἐξ αὐτῶν οὐ συντριβήσεται</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/33/#L19-20">Ψλ 33:19-20</a>)</p></blockquote><blockquote><p>«ἐπὶ δὲ τὸν Ἰησοῦν ἐλθόντες, ὡς εἶδον ἤδη αὐτὸν τεθνηκότα, <strong>οὐ κατέαξαν αὐτοῦ τὰ σκέλη</strong>, &lt;…&gt; <strong>ἐγένετο γὰρ ταῦτα ἵνα ἡ γραφὴ πληρωθῇ, <mark>Ὀστοῦν οὐ συντριβήσεται αὐτοῦ</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/19/#L33,36">Ιω 19:33,36</a>)</p></blockquote><p>Σε αυτό φαίνεται η στάση του ίδιου του Θεού απέναντι στα λείψανα των αγίων. Παρ’ όλα αυτά, ο Θεός μερικές φορές επιτρέπει (και δεν επιθυμεί) να βασανίζουν τους δικαίους, ακόμη και να τους κόβουν το κεφάλι, όπως έγινε με τον προφήτη Ιωάννη τον Βαπτιστή (<a href="https://bibleox.com/el/gr-lxx-byz/mf/14/#L11">Μτ 14:11</a>· <a href="https://bibleox.com/el/gr-lxx-byz/mk/6/#L28">Μκ 6:28</a>). Αλλά ο Θεός παρέχει τη χάρη Του και μέσω των διαμελισμένων λειψάνων των αγίων.</p><h3>Τα λείψανα των αμαρτωλών ο Θεός τα παραδίδει σε ατίμωση</h3><blockquote><p>«<strong><mark>ὁ θεὸς διεσκόρπισεν ὀστᾶ ἀνθρωπαρέσκων</mark></strong>· κατῃσχύνθησαν, ὅτι ὁ θεὸς ἐξουδένωσεν αὐτούς.» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/52/#L5">Ψλ 52:5</a>)</p></blockquote><h2>Ο Θεός συνεχίζει να ενεργεί μέσω του νεκρού σώματος του δικαίου</h2><p>Από το άγγιγμα των λειψάνων του προφήτη Ελισαίου ένας νεκρός αναστήθηκε, αν και δίπλα δεν φαίνεται ούτε καν να γίνεται προσευχή:</p><blockquote><p><em>«καὶ ἐγένετο αὐτῶν θαπτόντων τὸν ἄνδρα καὶ ἰδοὺ εἶδον τὸν μονόζωνον καὶ ἔρριψαν τὸν ἄνδρα ἐν τῷ τάφῳ Ελισαιε, καὶ </em><strong><em><mark>ἐπορεύθη καὶ ἥψατο τῶν ὀστέων Ελισαιε καὶ ἔζησεν</mark></em></strong><em> καὶ ἀνέστη ἐπὶ τοὺς πόδας αὐτοῦ. —» (</em><a href="https://bibleox.com/el/gr-lxx-byz/4ts/13/#L21"><em>Δ Βασ 13:21</em></a><em>)</em></p></blockquote><h2>Ο Θεός συνεχίζει να ενεργεί μέσω των πραγμάτων που φορούσε ο δίκαιος</h2><p>Θεραπεία από το ρούχο του αποστόλου:</p><blockquote><p>«ὥστε καὶ ἐπὶ τοὺς ἀσθενοῦντας ἀποφέρεσθαι <strong><mark>ἀπὸ τοῦ χρωτὸς αὐτοῦ σουδάρια ἢ σιμικίνθια</mark></strong> καὶ ἀπαλλάσσεσθαι ἀπ᾿ αὐτῶν τὰς νόσους, τά τε πνεύματα τὰ πονηρὰ ἐκπορεύεσθαι.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/19/#L12">Πραξ 19:12</a>)</p></blockquote><h2>Ο Θεός ενεργεί μέσω της εικόνας του δικαίου</h2><p>Θεραπεία από την εικόνα του αποστόλου:</p><blockquote><p>«ὥστε καὶ εἰς τὰς πλατείας <strong>ἐκφέρειν τοὺς ἀσθενεῖς</strong> καὶ τιθέναι ἐπὶ κλιναρίων καὶ κραβάττων, <strong>ἵνα ἐρχομένου Πέτρου κἂν ἡ σκιὰ ἐπισκιάσῃ τινὶ αὐτῶν</strong>. συνήρχετο δὲ καὶ τὸ πλῆθος τῶν πέριξ πόλεων Ἰερουσαλήμ, φέροντες ἀσθενεῖς καὶ ὀχλουμένους ὑπὸ πνευμάτων ἀκαθάρτων, <strong>οἵτινες ἐθεραπεύοντο ἅπαντες</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/5/#L15-16">Πραξ 5:15-16</a>)</p></blockquote><h2>Οι προσκυνήσεις στον άγιο</h2><p>Η δεύτερη εντολή του δεκαλόγου (<a href="https://bibleox.com/el/gr-lxx-byz/ish/20/#L2-3">Έξ 20:2-3</a>· <a href="https://bibleox.com/el/gr-lxx-byz/vtor/5/#L6-7">Δτ 5:6-7</a>) απαγορεύει τη λατρεία ψεύτικων θεών (ειδώλων). Οι ψεύτικοι θεοί, εκτός του ότι είναι ψεύτικοι, δεν υπάρχουν.</p><p>Οι άγιοι όμως υπάρχουν, είναι φίλοι του Θεού και δεν λατρεύονται ως θεοί. Οι προσκυνήσεις στους αγίους και στα λείψανά τους είναι έκφραση σεβασμού προς αυτούς ως φίλους του Θεού. Τέτοιες προσκυνήσεις σε αγγέλους, σε ανθρώπους και σε αντικείμενα συναντώνται στην Αγία Γραφή και δεν είναι ειδωλολατρία, γιατί ειδωλολατρία είναι η λατρεία <u>ψεύτικων</u> <u>θεών</u>. Οι δίκαιοι διαρκώς προσκυνούν ανθρώπους, διάφορα αντικείμενα, αγγέλους· άλλοι άνθρωποι προσκυνούν προφήτες.</p><h4><strong>Η προσκύνηση στον Θεό με τη μορφή αγγέλων</strong></h4><blockquote><p><em>«ἀναβλέψας δὲ τοῖς ὀφθαλμοῖς αὐτοῦ εἶδεν, καὶ ἰδοὺ </em><strong><em>τρεῖς ἄνδρες</em></strong><em> εἱστήκεισαν ἐπάνω αὐτοῦ· καὶ ἰδὼν προσέδραμεν εἰς συνάντησιν αὐτοῖς ἀπὸ τῆς θύρας τῆς σκηνῆς αὐτοῦ καὶ </em><strong><em>προσεκύνησεν ἐπὶ τὴν γῆν</em></strong><em>» (</em><a href="https://bibleox.com/el/gr-lxx-byz/gen/18/#L2"><em>Γεν 18:2</em></a><em>)</em></p></blockquote><h4><strong>Η προσκύνηση στον άγγελο</strong></h4><blockquote><p><em>«ὁ δὲ εἶπεν αὐτῷ Ἐγὼ ἀρχιστράτηγος δυνάμεως κυρίου νυνὶ παραγέγονα. καὶ Ἰησοῦς </em><strong><em>ἔπεσεν ἐπὶ πρόσωπον ἐπὶ τὴν γῆν</em></strong><em> καὶ εἶπεν αὐτῷ Δέσποτα, τί προστάσσεις τῷ σῷ οἰκέτῃ;» (</em><a href="https://bibleox.com/el/gr-lxx-byz/nav/5/#L14"><em>Ιησ 5:14</em></a><em>)</em></p></blockquote><h4><strong>Η προσκύνηση στον προφήτη</strong></h4><blockquote><p><em>«καὶ εἶδον αὐτὸν οἱ υἱοὶ τῶν προφητῶν οἱ ἐν Ιεριχω ἐξ ἐναντίας καὶ εἶπον Ἐπαναπέπαυται τὸ πνεῦμα Ηλιου ἐπὶ Ελισαιε· καὶ ἦλθον εἰς συναντὴν αὐτοῦ καὶ </em><strong><em>προσεκύνησαν αὐτῷ</em></strong><em> ἐπὶ τὴν γῆν.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/4ts/2/#L15"><em>Δ Βασ 2:15</em></a><em>)</em></p></blockquote><h4><strong>Η προσκύνηση στον ναό</strong></h4><blockquote><p><em>«ἐγὼ δὲ ἐν τῷ πλήθει τοῦ ἐλέους σου εἰσελεύσομαι εἰς τὸν οἶκόν σου, </em><strong><em>προσκυνήσω πρὸς ναὸν ἅγιόν σου</em></strong><em> ἐν φόβῳ σου.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/ps/5/#L7"><em>Ψλ 5:7</em></a><em>)</em></p></blockquote><h4><strong>Η προσκύνηση στο υποπόδιο του Θεού</strong></h4><blockquote><p><em>«ὑψοῦτε κύριον τὸν θεὸν ἡμῶν καὶ </em><strong><em>προσκυνεῖτε</em></strong><em> </em><strong><em>τῷ ὑποποδίῳ τῶν ποδῶν αὐτοῦ, ὅτι ἅγιός ἐστιν</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/ps/98/#L5"><em>Ψλ 98:5</em></a><em>)</em></p></blockquote><blockquote><p><em>«εἰσελευσόμεθα εἰς τὰ </em><strong><em>σκηνώματα αὐτοῦ, προσκυνήσομεν εἰς τὸν τόπον, οὗ ἔστησαν οἱ πόδες</em></strong><em> αὐτοῦ.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/ps/131/#L7"><em>Ψλ 131:7</em></a><em>)</em></p></blockquote><h4><strong>Η προσκύνηση μπροστά στην Κιβωτό</strong></h4><blockquote><p><em>«καὶ διέρρηξεν Ἰησοῦς τὰ ἱμάτια αὐτοῦ, καὶ </em><strong><em>ἔπεσεν Ἰησοῦς ἐπὶ τὴν γῆν ἐπὶ πρόσωπον ἐναντίον κυρίου</em></strong><em> ἕως ἑσπέρας, αὐτὸς καὶ οἱ πρεσβύτεροι Ισραηλ, καὶ ἐπεβάλοντο χοῦν ἐπὶ τὰς κεφαλὰς αὐτῶν.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/nav/7/#L6"><em>Ιησ 7:6</em></a><em>)</em></p></blockquote><h4><strong>Η προσκύνηση στο ραβδί</strong></h4><blockquote><p><em>Για το ραβδί: «εἶπεν δέ Ὄμοσόν μοι. καὶ ὤμοσεν αὐτῷ. καὶ </em><strong><em>προσεκύνησεν Ισραηλ ἐπὶ τὸ ἄκρον τῆς ῥάβδου αὐτοῦ</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/gen/47/#L31"><em>Γεν 47:31</em></a><em>) Οι Ο΄ (όπως και στην </em><a href="https://bibleox.com/el/gr-lxx-byz/evr/11/#L21"><em>Εβρ </em></a><a class="foot-ref" href="https://bibleox.com/el/gr-lxx-byz/evr/11/#L21"><em>11</em></a><a href="https://bibleox.com/el/gr-lxx-byz/evr/11/#L21"><em>:21</em></a><em>) εδώ χρησιμοποιούν τη λέξη </em><strong><em>ῥάβδος</em></strong><em>, δηλαδή μιλούν για το ραβδί του.</em></p></blockquote><p>Κι άλλα παραδείγματα: προσκυνήσεις.</p><h2>Επεισόδια για τα λείψανα από την Αγία Γραφή</h2><h3>Οι μυροφόρες γυναίκες την τρίτη ημέρα μετά την ταφή πήγαν να ανοίξουν τον τάφο και να αγγίξουν το άγιο σώμα του Κυρίου Ιησού Χριστού</h3><blockquote><p>«Καὶ διαγενομένου τοῦ σαββάτου Μαρία ἡ Μαγδαληνὴ καὶ Μαρία ἡ Ἰακώβου καὶ Σαλώμη <strong>ἠγόρασαν ἀρώματα ἵνα ἐλθοῦσαι ἀλείψωσιν αὐτόν</strong>. καὶ λίαν πρωῒ τῇ μιᾷ τῶν σαββάτων ἔρχονται ἐπὶ τὸ μνημεῖον ἀνατείλαντος τοῦ ἡλίου. καὶ ἔλεγον πρὸς ἑαυτάς, <strong>Τίς ἀποκυλίσει ἡμῖν τὸν λίθον ἐκ τῆς θύρας τοῦ μνημείου</strong>;» (<a href="https://bibleox.com/el/gr-lxx-byz/mk/16/#L1-3">Μκ 16:1-3</a>)</p></blockquote><blockquote><p>«τῇ δὲ μιᾷ τῶν σαββάτων ὄρθρου βαθέως <strong>ἐπὶ τὸ μνῆμα ἦλθον φέρουσαι ἃ ἡτοίμασαν ἀρώματα</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/24/#L1">Λκ 24:1</a>)</p></blockquote><blockquote><p>«Ὀψὲ δὲ σαββάτων, τῇ ἐπιφωσκούσῃ εἰς μίαν σαββάτων, ἦλθεν Μαρία ἡ Μαγδαληνὴ καὶ ἡ ἄλλη Μαρία <strong>θεωρῆσαι τὸν τάφον</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/28/#L1">Μτ 28:1</a>)</p></blockquote><blockquote><p>«Τῇ δὲ μιᾷ τῶν σαββάτων Μαρία ἡ Μαγδαληνὴ <strong>ἔρχεται πρωῒ σκοτίας ἔτι οὔσης εἰς τὸ μνημεῖον</strong>, καὶ βλέπει τὸν λίθον ἠρμένον ἐκ τοῦ μνημείου.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/20/#L1">Ιω 20:1</a>)</p></blockquote><h3>Μετακομιδή λειψάνων</h3><h4>Ο Ιωσήφ</h4><p>Ο Ιωσήφ (ο γιος του Ιακώβ) ζητά αργότερα να μεταφερθούν τα λείψανά του από την Αίγυπτο στη γη που υποσχέθηκε να δώσει ο Θεός:</p><blockquote><p>«καὶ εἶπεν <strong>Ιωσηφ</strong> τοῖς ἀδελφοῖς αὐτοῦ λέγων Ἐγὼ ἀποθνῄσκω· ἐπισκοπῇ δὲ ἐπισκέψεται ὑμᾶς ὁ θεὸς καὶ ἀνάξει ὑμᾶς ἐκ τῆς γῆς ταύτης εἰς τὴν γῆν, ἣν ὤμοσεν ὁ θεὸς τοῖς πατράσιν ἡμῶν Αβρααμ καὶ Ισαακ καὶ Ιακωβ. καὶ ὥρκισεν Ιωσηφ τοὺς υἱοὺς Ισραηλ λέγων Ἐν τῇ ἐπισκοπῇ, ᾗ ἐπισκέψεται ὑμᾶς ὁ θεός, καὶ <strong>συνανοίσετε τὰ ὀστᾶ μου ἐντεῦθεν</strong> μεθ᾿ ὑμῶν.» (<a href="https://bibleox.com/el/gr-lxx-byz/gen/50/#L24-25">Γεν 50:24-25</a>)</p></blockquote><p>Ο Ιωσήφ πεθαίνει· τον θάβουν στην Αίγυπτο, αφού τον τοποθέτησαν σε σαρκοφάγο (λάρνακα, κιβωτό):</p><blockquote><p>«καὶ ἐτελεύτησεν <strong>Ιωσηφ</strong> ἐτῶν ἑκατὸν δέκα· καὶ <strong>ἔθαψαν αὐτὸν καὶ ἔθηκαν ἐν τῇ σορῷ ἐν Αἰγύπτῳ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/gen/50/#L26">Γεν 50:26</a>)</p></blockquote><p>Ο προφήτης Μωυσής εκπληρώνει την παράκληση του Ιωσήφ:</p><blockquote><p>«καὶ ἐκύκλωσεν ὁ θεὸς τὸν λαὸν ὁδὸν τὴν εἰς τὴν ἔρημον εἰς τὴν ἐρυθρὰν θάλασσαν. πέμπτη δὲ γενεὰ ἀνέβησαν οἱ υἱοὶ Ισραηλ ἐκ γῆς Αἰγύπτου. καὶ <strong>ἔλαβεν Μωϋσῆς τὰ ὀστᾶ Ιωσηφ μεθ᾿ ἑαυτοῦ</strong>· ὅρκῳ γὰρ ὥρκισεν Ιωσηφ τοὺς υἱοὺς Ισραηλ λέγων Ἐπισκοπῇ ἐπισκέψεται ὑμᾶς κύριος, καὶ συνανοίσετέ μου τὰ ὀστᾶ ἐντεῦθεν μεθ᾿ ὑμῶν.» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/13/#L18-19">Έξ 13:18-19</a>)</p></blockquote><p>Ο προφήτης Μωυσής και ο λαός του Ισραήλ επί <strong>περισσότερα από 40 χρόνια</strong> πορεύονταν μαζί με τα λείψανα του Ιωσήφ στη χερσόνησο του Σινά. Αργότερα, ο Ιησούς του Ναυή θα θάψει τα λείψανα του Ιωσήφ στη Συχέμ (<a href="https://bibleox.com/el/gr-lxx-byz/nav/24/#L32">Ιησ 24:32</a>).</p><p>Αν λάβουμε υπόψη ότι η 40ετής πορεία στην έρημο του Σινά, δηλαδή η πορεία του Ισραήλ από τη σκλαβιά της Αιγύπτου στη γη της επαγγελίας, είναι προτύπωση της ζωής της Εκκλησίας της Καινής Διαθήκης, που βγάζει τους ανθρώπους από τη σκλαβιά της αμαρτίας και τους οδηγεί στη Βασιλεία των Ουρανών που υποσχέθηκε ο Θεός, τότε σε όλη αυτή την περίοδο της ζωής της Εκκλησίας ο λαός του Θεού είχε πάντοτε μαζί του τα λείψανα του δικαίου. Η προτυπική εικόνα της Εκκλησίας της Παλαιάς Διαθήκης είχε πάντοτε μαζί της τα λείψανα του δικαίου πριν φτάσει στη βασιλεία της.</p><h4>Ο Σαούλ</h4><p>Τον Σαούλ τον σκότωσαν οι Φιλισταίοι, και οι κάτοικοι της Ιαβίς έκαψαν τα σώματα και έθαψαν τα οστά κάτω από το χωράφι της Ιαβίς:</p><blockquote><p>«καὶ ἀνέθηκαν τὰ σκεύη αὐτοῦ εἰς τὸ Ἀσταρτεῖον καὶ τὸ σῶμα αὐτοῦ κατέπηξαν ἐν τῷ τείχει Βαιθσαν. καὶ ἀκούουσιν οἱ κατοικοῦντες Ιαβις τῆς Γαλααδίτιδος ἃ ἐποίησαν οἱ ἀλλόφυλοι τῷ Σαουλ. καὶ ἀνέστησαν πᾶς ἀνὴρ δυνάμεως καὶ ἐπορεύθησαν ὅλην τὴν νύκτα καὶ <strong>ἔλαβον τὸ σῶμα Σαουλ</strong> καὶ τὸ σῶμα Ιωναθαν τοῦ υἱοῦ αὐτοῦ ἀπὸ τείχους Βαιθσαν καὶ φέρουσιν αὐτοὺς εἰς Ιαβις καὶ <strong>κατακαίουσιν αὐτοὺς ἐκεῖ. καὶ λαμβάνουσιν τὰ ὀστᾶ αὐτῶν καὶ θάπτουσιν ὑπὸ τὴν ἄρουραν τὴν Ιαβις</strong> καὶ νηστεύουσιν ἑπτὰ ἡμέρας.» (<a href="https://bibleox.com/el/gr-lxx-byz/1ts/31/#L10-13">Α Βασ 31:10-13</a> · <a href="https://bibleox.com/el/gr-lxx-byz/1par/10/#L12">Α Παρ 10:12</a>)</p></blockquote><p>Ο Δαυίδ μεταφέρει τα λείψανα του Σαούλ στη γη του Βενιαμίν και τα θάβει μαζί με τα λείψανα του πατέρα του Σαούλ:</p><blockquote><p>«καὶ ἐπορεύθη Δαυιδ καὶ <strong>ἔλαβεν τὰ ὀστᾶ Σαουλ</strong> καὶ τὰ ὀστᾶ Ιωναθαν τοῦ υἱοῦ αὐτοῦ παρὰ τῶν ἀνδρῶν υἱῶν Ιαβις Γαλααδ, οἳ ἔκλεψαν αὐτοὺς ἐκ τῆς πλατείας Βαιθσαν, ὅτι ἔστησαν αὐτοὺς ἐκεῖ οἱ ἀλλόφυλοι ἐν ἡμέρᾳ, ᾗ ἐπάταξαν οἱ ἀλλόφυλοι τὸν Σαουλ ἐν Γελβουε, καὶ <strong>ἀνήνεγκεν ἐκεῖθεν τὰ ὀστᾶ Σαουλ</strong> καὶ τὰ ὀστᾶ Ιωναθαν τοῦ υἱοῦ αὐτοῦ καὶ συνήγαγεν τὰ ὀστᾶ τῶν ἐξηλιασμένων. καὶ <strong>ἔθαψαν τὰ ὀστᾶ Σαουλ</strong> καὶ τὰ ὀστᾶ Ιωναθαν τοῦ υἱοῦ αὐτοῦ καὶ τῶν ἡλιασθέντων ἐν γῇ Βενιαμιν ἐν τῇ πλευρᾷ <strong>ἐν τῷ τάφῳ Κις τοῦ πατρὸς αὐτοῦ</strong> καὶ ἐποίησαν πάντα, ὅσα ἐνετείλατο ὁ βασιλεύς. — καὶ ἐπήκουσεν ὁ θεὸς τῇ γῇ μετὰ ταῦτα.» (<a href="https://bibleox.com/el/gr-lxx-byz/2ts/21/#L12-14">Β Βασ 21:12-14</a>)</p></blockquote><h3>Περίπτωση καθυστερημένης ταφής</h3><p>Τον Ιακώβ τον έθαψαν μετά από περισσότερες από 77 ημέρες:</p><blockquote><p>«Καὶ ἐπιπεσὼν Ιωσηφ ἐπὶ τὸ πρόσωπον τοῦ πατρὸς αὐτοῦ ἔκλαυσεν ἐπ᾿ αὐτὸν καὶ ἐφίλησεν αὐτόν. καὶ προσέταξεν Ιωσηφ τοῖς παισὶν αὐτοῦ τοῖς ἐνταφιασταῖς ἐνταφιάσαι τὸν πατέρα αὐτοῦ, καὶ ἐνεταφίασαν οἱ ἐνταφιασταὶ τὸν Ισραηλ. καὶ <strong>ἐπλήρωσαν αὐτοῦ τεσσαράκοντα ἡμέρας</strong>· οὕτως γὰρ καταριθμοῦνται αἱ ἡμέραι τῆς ταφῆς. καὶ <strong>ἐπένθησεν αὐτὸν Αἴγυπτος ἑβδομήκοντα ἡμέρας</strong>. &lt;…&gt; Ὁ πατήρ μου ὥρκισέν με λέγων <strong>Ἐν τῷ μνημείῳ, ᾧ ὤρυξα ἐμαυτῷ ἐν γῇ Χανααν, ἐκεῖ με θάψεις</strong>· νῦν οὖν ἀναβὰς θάψω τὸν πατέρα μου καὶ ἐπανελεύσομαι. &lt;…&gt; καὶ παρεγένοντο ἐφ᾿ ἅλωνα Αταδ, ὅ ἐστιν πέραν τοῦ Ιορδάνου, καὶ ἐκόψαντο αὐτὸν κοπετὸν μέγαν καὶ ἰσχυρὸν σφόδρα· καὶ <strong>ἐποίησεν τὸ πένθος τῷ πατρὶ αὐτοῦ ἑπτὰ ἡμέρας</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/gen/50/#L1-3,5,10">Γεν 50:1-3,5,10</a>)</p></blockquote><h3>Ο προφήτης ζητά να ταφεί μαζί με τα λείψανα άλλου προφήτη</h3><blockquote><p>«καὶ ἦρεν <strong>ὁ προφήτης</strong> τὸ σῶμα τοῦ ἀνθρώπου τοῦ θεοῦ καὶ ἐπέθηκεν αὐτὸ ἐπὶ τὸν ὄνον, καὶ ἐπέστρεψεν αὐτὸν εἰς τὴν πόλιν ὁ προφήτης τοῦ θάψαι αὐτὸν ἐν τῷ τάφῳ ἑαυτοῦ· καὶ ἐκόψαντο αὐτόν Οὐαὶ ἀδελφέ. καὶ ἐγένετο μετὰ τὸ κόψασθαι αὐτὸν καὶ εἶπεν τοῖς υἱοῖς αὐτοῦ λέγων <strong>Ἐὰν ἀποθάνω, θάψατέ με</strong> ἐν τῷ τάφῳ τούτῳ, οὗ ὁ ἄνθρωπος τοῦ θεοῦ τέθαπται ἐν αὐτῷ· παρὰ τὰ ὀστᾶ αὐτοῦ θέτε με, ἵνα σωθῶσι τὰ ὀστᾶ μου μετὰ τῶν ὀστῶν αὐτοῦ·» (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/13/#L29-31">Γ Βασ 13:29-31</a>)</p></blockquote><h2>Ο Ιακώβ τιμά τα λείψανα της συζύγου του</h2><blockquote><p>«ἀπέθανεν δὲ Ραχηλ καὶ ἐτάφη ἐν τῇ ὁδῷ Εφραθα [αὕτη ἐστὶν Βηθλεεμ]. καὶ <strong>ἔστησεν Ιακωβ στήλην ἐπὶ τοῦ μνημείου αὐτῆς</strong>· αὕτη ἐστὶν στήλη μνημείου Ραχηλ ἕως τῆς σήμερον ἡμέρας.» (<a href="https://bibleox.com/el/gr-lxx-byz/gen/35/#L19-20">Γεν 35:19-20</a>)</p></blockquote><h2>Ο βασιλιάς Ιωσίας τιμά τα λείψανα του προφήτη</h2><p>Για τον Ιωσία λέγεται ότι δεν υπήρξε τέτοιος βασιλιάς πριν από αυτόν και μετά από αυτόν, γιατί με όλη την καρδιά, την ψυχή και τις δυνάμεις του στράφηκε στον Θεό (<a href="https://bibleox.com/el/gr-lxx-byz/4ts/23/#L25">Δ Βασ 23:25</a>). Ο βασιλιάς των Ιουδαίων Ιωσίας ήταν από παιδί υπάκουος στον Θεό, και φτάνοντας σε ώριμη ηλικία άρχισε να καθαρίζει το κράτος του από την ειδωλολατρία. Κατέστρεφε τα ειδωλολατρικά αγάλματα, τους βωμούς, τα ειδωλολατρικά υψηλά όπου θυμίαζαν, τα ιερά ειδωλολατρικά άλση, απαγόρευε τη λατρεία στους ιερείς, εξόντωσε τους μάγους και τους νεκρομάντεις, καθάρισε από τα ειδωλολατρικά σύμβολα και επισκεύασε τον ναό του Θεού στην Ιερουσαλήμ, βρήκε το βιβλίο με την Αγία Γραφή, το οποίο διαβάστηκε στον λαό, και ο λαός εισήχθη στη Διαθήκη με τον Θεό. Ο Ιωσίας δεν κατέστρεφε μόνο τους ειδωλολατρικούς ναούς, αλλά φρόντιζε να τους μολύνει, σκορπίζοντας ανθρώπινα οστά:</p><blockquote><p>«καὶ τὸν οἶκον τὸν ἐπὶ πρόσωπον Ιερουσαλημ τὸν ἐκ δεξιῶν τοῦ ὄρους τοῦ Μοσοαθ, ὃν ᾠκοδόμησεν Σαλωμων βασιλεὺς Ισραηλ τῇ Ἀστάρτῃ προσοχθίσματι Σιδωνίων καὶ τῷ Χαμως προσοχθίσματι Μωαβ καὶ τῷ Μολχολ βδελύγματι υἱῶν Αμμων, ἐμίανεν ὁ βασιλεύς. καὶ συνέτριψεν τὰς στήλας καὶ ἐξωλέθρευσεν τὰ ἄλση καὶ <strong>ἔπλησεν τοὺς τόπους αὐτῶν ὀστέων ἀνθρώπων</strong>. —» (<a href="https://bibleox.com/el/gr-lxx-byz/4ts/23/#L13-14">Δ Βασ 23:13-14</a>)</p></blockquote><p>Ο Ιωσίας κατέστρεψε το παλιό είδωλο του Ιεροβοάμ, μολύνοντας εκεί τους τάφους:</p><blockquote><p>«καί γε τὸ θυσιαστήριον τὸ ἐν Βαιθηλ, τὸ ὑψηλόν, ὃ ἐποίησεν Ιεροβοαμ υἱὸς Ναβατ, ὃς ἐξήμαρτεν τὸν Ισραηλ, καί γε τὸ θυσιαστήριον ἐκεῖνο καὶ τὸ ὑψηλὸν κατέσπασεν καὶ συνέτριψεν τοὺς λίθους αὐτοῦ καὶ ἐλέπτυνεν εἰς χοῦν καὶ κατέκαυσεν τὸ ἄλσος. καὶ ἐξένευσεν <strong>Ιωσιας καὶ εἶδεν τοὺς τάφους τοὺς ὄντας ἐκεῖ ἐν τῇ πόλει καὶ ἀπέστειλεν καὶ ἔλαβεν τὰ ὀστᾶ ἐκ τῶν τάφων καὶ κατέκαυσεν ἐπὶ τὸ θυσιαστήριον καὶ ἐμίανεν αὐτὸ</strong> κατὰ τὸ ῥῆμα κυρίου, ὃ ἐλάλησεν ὁ ἄνθρωπος τοῦ θεοῦ ἐν τῷ ἑστάναι Ιεροβοαμ ἐν τῇ ἑορτῇ ἐπὶ τὸ θυσιαστήριον. καὶ ἐπιστρέψας ἦρεν τοὺς ὀφθαλμοὺς αὐτοῦ ἐπὶ τὸν τάφον τοῦ ἀνθρώπου τοῦ θεοῦ τοῦ λαλήσαντος τοὺς λόγους τούτους» (<a href="https://bibleox.com/el/gr-lxx-byz/4ts/23/#L15-16">Δ Βασ 23:15-16</a>)</p></blockquote><p>Ωστόσο, όταν συναντά το μνημείο, αφού διαπιστώνει ότι είναι ο τάφος του προφήτη που προφήτευσε αυτά τα γεγονότα, φέρεται με σεβασμό στα λείψανά του. Εξάλλου, η ίδια η ύπαρξη του μνημείου μαρτυρεί την τιμή που αποδιδόταν παλαιότερα στον προφήτη:</p><blockquote><p>«καὶ εἶπεν <strong>Τί τὸ σκόπελον ἐκεῖνο</strong>, ὃ ἐγὼ ὁρῶ; καὶ εἶπον αὐτῷ οἱ ἄνδρες τῆς πόλεως <strong>Ὁ ἄνθρωπος τοῦ θεοῦ ἐστιν</strong> ὁ ἐξεληλυθὼς ἐξ Ιουδα καὶ ἐπικαλεσάμενος τοὺς λόγους τούτους, οὓς ἐπεκαλέσατο ἐπὶ τὸ θυσιαστήριον Βαιθηλ. καὶ εἶπεν <strong><mark>Ἄφετε αὐτό, ἀνὴρ μὴ κινησάτω τὰ ὀστᾶ αὐτοῦ· καὶ ἐρρύσθησαν τὰ ὀστᾶ αὐτοῦ μετὰ τῶν ὀστῶν τοῦ προφήτου</mark></strong> τοῦ ἥκοντος ἐκ Σαμαρείας. —» (<a href="https://bibleox.com/el/gr-lxx-byz/4ts/23/#L17-18">Δ Βασ 23:17-18</a>)</p></blockquote><p>Αυτός ο ίδιος άνθρωπος του Θεού είχε προφητεύσει πριν ότι αυτό θα γίνει:</p><blockquote><p>«καὶ ἐπεκάλεσεν πρὸς τὸ θυσιαστήριον ἐν λόγῳ κυρίου καὶ εἶπεν Θυσιαστήριον θυσιαστήριον, τάδε λέγει κύριος <strong>Ἰδοὺ υἱὸς τίκτεται τῷ οἴκῳ Δαυιδ, Ιωσιας ὄνομα αὐτῷ, καὶ θύσει ἐπὶ σὲ τοὺς ἱερεῖς τῶν ὑψηλῶν τοὺς ἐπιθύοντας ἐπὶ σὲ καὶ ὀστᾶ ἀνθρώπων καύσει ἐπὶ σέ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/13/#L2">Γ Βασ 13:2</a>)</p></blockquote><h2>Ο Σίμων τιμά τα λείψανα των συγγενών του</h2><p>Ο αρχιερέας Ιωνάθαν (<a href="https://bibleox.com/el/gr-lxx-byz/1mak/10/#L20">I Μακ 10:20</a>· <a href="https://bibleox.com/el/gr-lxx-byz/1mak/11/#L57">I Μακ 11:57</a>) θάφτηκε στη Βασκαμά. Αργότερα, ο αδελφός του, ο αρχιερέας Σίμων (<a href="https://bibleox.com/el/gr-lxx-byz/1mak/13/#L36,42">I Μακ 13:36,42</a>) μεταφέρει τα λείψανά του στην πόλη των πατέρων — τη Μωδεΐν, όπου πριν είχαν θάψει τον Ιούδα (<a href="https://bibleox.com/el/gr-lxx-byz/1mak/9/#L19">I Μακ 9:19</a>). Ο Σίμων ανεγείρει μεγάλο οικοδόμημα, θέλοντας με αυτό να τιμήσει τα λείψανα των συγγενών του:</p><blockquote><p>«ὡς δὲ ἤγγισεν τῆς Βασκαμα, <strong>ἀπέκτεινεν τὸν Ιωναθαν, καὶ ἐτάφη ἐκεῖ</strong>. &lt;…&gt; Καὶ ἀπέστειλεν Σιμων καὶ <strong>ἔλαβεν τὰ ὀστᾶ Ιωναθου τοῦ ἀδελφοῦ αὐτοῦ καὶ ἔθαψεν αὐτὸν ἐν Μωδειν</strong> πόλει τῶν πατέρων αὐτοῦ. καὶ ἐκόψαντο αὐτὸν πᾶς Ισραηλ κοπετὸν μέγαν καὶ ἐπένθησαν αὐτὸν ἡμέρας πολλάς. καὶ ᾠκοδόμησεν Σιμων ἐπὶ τὸν τάφον τοῦ πατρὸς αὐτοῦ καὶ τῶν ἀδελφῶν αὐτοῦ καὶ ὕψωσεν αὐτὸν τῇ ὁράσει λίθῳ ξεστῷ ἐκ τῶν ὄπισθεν καὶ ἔμπροσθεν. καὶ ἔστησεν ἑπτὰ πυραμίδας, μίαν κατέναντι τῆς μιᾶς, τῷ πατρὶ καὶ τῇ μητρὶ καὶ τοῖς τέσσαρσιν ἀδελφοῖς. καὶ ταύταις ἐποίησεν μηχανήματα περιθεὶς στύλους μεγάλους καὶ ἐποίησεν ἐπὶ τοῖς στύλοις πανοπλίας <strong>εἰς ὄνομα αἰώνιον</strong> καὶ παρὰ ταῖς πανοπλίαις πλοῖα ἐγγεγλυμμένα εἰς τὸ θεωρεῖσθαι ὑπὸ πάντων τῶν πλεόντων τὴν θάλασσαν. <strong>οὗτος ὁ τάφος, ὃν ἐποίησεν ἐν Μωδειν</strong>, ἕως τῆς ἡμέρας ταύτης.» (<a href="https://bibleox.com/el/gr-lxx-byz/1mak/13/#L23,25-30">I Μακ 13:23,25-30</a>)</p></blockquote><h2>Σχετικές ρήσεις</h2><ol><li><p><a href="https://bibleox.com/el/el/w/%CE%97_%CF%84%CE%B9%CE%BC%CE%AE_%CF%84%CF%89%CE%BD_%CE%B1%CE%B3%CE%AF%CF%89%CE%BD">η τιμή των αγίων</a></p></li><li><p>η τιμή των εικόνων (προσκύνηση των εικόνων — εικονομαχία)</p></li><li><p>η προσευχή στους αγίους</p></li><li><p><a href="https://bibleox.com/el/el/w/%CE%9F_%CE%AC%CE%BD%CE%B8%CF%81%CF%89%CF%80%CE%BF%CF%82_%CE%B5%CE%AF%CE%BD%CE%B1%CE%B9_%CE%BD%CE%B1%CF%8C%CF%82_%CF%84%CE%BF%CF%85_%CE%98%CE%B5%CE%BF%CF%8D">ο άνθρωπος — ναός του Θεού</a></p></li><li><p><a href="https://bibleox.com/el/el/w/%CE%97_%CF%83%CF%8D%CF%83%CF%84%CE%B1%CF%83%CE%B7_%CF%84%CE%BF%CF%85_%CE%B1%CE%BD%CE%B8%CF%81%CF%8E%CF%80%CE%BF%CF%85">η σύσταση του ανθρώπου</a></p></li></ol>'
