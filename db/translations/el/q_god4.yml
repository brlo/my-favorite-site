  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <h2>Ο παντογνώστης</h2><p>Ο Θεός είναι παντογνώστης (γνωρίζει τα πάντα και βλέπει τα πάντα):</p><blockquote><p>«καὶ οὐκ ἔστιν κτίσις ἀφανὴς ἐνώπιον αὐτοῦ, <strong>πάντα δὲ γυμνὰ καὶ τετραχηλισμένα τοῖς ὀφθαλμοῖς αὐτοῦ</strong>, πρὸς ὃν ἡμῖν ὁ λόγος.» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/4/#L13">Εβρ 4:13</a>)</p></blockquote><blockquote><p>«ὅτι ἐὰν καταγινώσκῃ ἡμῶν ἡ καρδία, ὅτι μείζων ἐστὶν <strong>ὁ θεὸς</strong> τῆς καρδίας ἡμῶν καὶ <strong>γινώσκει πάντα</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1in/3/#L20">Α Ιω 3:20</a>)</p></blockquote><blockquote><p>«ἰδού, κύριε, <strong>σὺ ἔγνως πάντα</strong>, τὰ ἔσχατα καὶ τὰ ἀρχαῖα» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/138/#L5">Ψλ 138:5</a>)</p></blockquote><blockquote><p>«Κύριε, <strong>πάντα σὺ οἶδας</strong>, σὺ γινώσκεις ὅτι φιλῶ σε» (<a href="https://bibleox.com/el/gr-lxx-byz/in/21/#L17">Ιω 21:17</a>)</p></blockquote><blockquote><p>«<strong>σὺ πάντα γινώσκεις</strong>· σὺ οἶδας, κύριε, ὅτι οὐκ ἐν ὕβρει οὐδὲ ἐν ὑπερηφανίᾳ οὐδὲ ἐν φιλοδοξίᾳ ἐποίησα τοῦτο, τὸ μὴ προσκυνεῖν τὸν ὑπερήφανον Αμαν, ὅτι ηὐδόκουν φιλεῖν πέλματα ποδῶν αὐτοῦ πρὸς σωτηρίαν Ισραηλ· 17e ἀλλὰ ἐποίησα τοῦτο, ἵνα μὴ θῶ δόξαν ἀνθρώπου ὑπεράνω δόξης θεοῦ, καὶ οὐ προσκυνήσω οὐδένα πλὴν σοῦ τοῦ κυρίου μου καὶ οὐ ποιήσω αὐτὰ ἐν ὑπερηφανίᾳ. 17f καὶ νῦν, κύριε ὁ θεὸς ὁ βασιλεὺς ὁ θεὸς Αβρααμ, φεῖσαι τοῦ λαοῦ σου, ὅτι ἐπιβλέπουσιν ἡμῖν εἰς καταφθορὰν καὶ ἐπεθύμησαν ἀπολέσαι τὴν ἐξ ἀρχῆς κληρονομίαν σου· 17g μὴ ὑπερίδῃς τὴν μερίδα σου, ἣν σεαυτῷ ἐλυτρώσω ἐκ γῆς Αἰγύπτου· 17h ἐπάκουσον τῆς δεήσεώς μου καὶ ἱλάσθητι τῷ κλήρῳ σου καὶ στρέψον τὸ πένθος ἡμῶν εἰς εὐωχίαν, ἵνα ζῶντες ὑμνῶμέν σου τὸ ὄνομα, κύριε, καὶ μὴ ἀφανίσῃς στόμα αἰνούντων σοι. — 17i καὶ πᾶς Ισραηλ ἐκέκραξαν ἐξ ἰσχύος αὐτῶν, ὅτι θάνατος αὐτῶν ἐν ὀφθαλμοῖς αὐτῶν. 17k Καὶ Εσθηρ ἡ βασίλισσα κατέφυγεν ἐπὶ τὸν κύριον ἐν ἀγῶνι θανάτου κατειλημμένη καὶ ἀφελομένη τὰ ἱμάτια τῆς δόξης αὐτῆς ἐνεδύσατο ἱμάτια στενοχωρίας καὶ πένθους καὶ ἀντὶ τῶν ὑπερηφάνων ἡδυσμάτων σποδοῦ καὶ κοπριῶν ἔπλησεν τὴν κεφαλὴν αὐτῆς καὶ τὸ σῶμα αὐτῆς ἐταπείνωσεν σφόδρα καὶ πάντα τόπον κόσμου ἀγαλλιάματος αὐτῆς ἔπλησε στρεπτῶν τριχῶν αὐτῆς. 17l Καὶ ἐδεῖτο κυρίου θεοῦ Ισραηλ καὶ εἶπεν, Κύριέ μου ὁ βασιλεὺς ἡμῶν, σὺ εἶ μόνος· βοήθησόν μοι τῇ μόνῃ καὶ μὴ ἐχούσῃ βοηθὸν εἰ μὴ σέ, ὅτι κίνδυνός μου ἐν χειρί μου. 17m ἐγὼ ἤκουον ἐκ γενετῆς μου ἐν φυλῇ πατριᾶς μου ὅτι σύ, κύριε, ἔλαβες τὸν Ισραηλ ἐκ πάντων τῶν ἐθνῶν καὶ τοὺς πατέρας ἡμῶν ἐκ πάντων τῶν προγόνων αὐτῶν εἰς κληρονομίαν αἰώνιον καὶ ἐποίησας αὐτοῖς ὅσα ἐλάλησας. 17n καὶ νῦν ἡμάρτομεν ἐνώπιόν σου, καὶ παρέδωκας ἡμᾶς εἰς χεῖρας τῶν ἐχθρῶν ἡμῶν, ἀνθ᾿ ὧν ἐδοξάσαμεν τοὺς θεοὺς αὐτῶν· δίκαιος εἶ, κύριε. 17o καὶ νῦν οὐχ ἱκανώθησαν ἐν πικρασμῷ δουλείας ἡμῶν, ἀλλὰ ἔθηκαν τὰς χεῖρας αὐτῶν ἐπὶ τὰς χεῖρας τῶν εἰδώλων αὐτῶν ἐξᾶραι ὁρισμὸν στόματός σου καὶ ἀφανίσαι κληρονομίαν σου καὶ ἐμφράξαι στόμα αἰνούντων σοι καὶ σβέσαι δόξαν οἴκου σου καὶ θυσιαστήριόν σου 17p καὶ ἀνοῖξαι στόμα ἐθνῶν εἰς ἀρετὰς ματαίων καὶ θαυμασθῆναι βασιλέα σάρκινον εἰς αἰῶνα. 17q μὴ παραδῷς, κύριε, τὸ σκῆπτρόν σου τοῖς μὴ οὖσιν, καὶ μὴ καταγελασάτωσαν ἐν τῇ πτώσει ἡμῶν, ἀλλὰ στρέψον τὴν βουλὴν αὐτῶν ἐπ᾿ αὐτούς, τὸν δὲ ἀρξάμενον ἐφ᾿ ἡμᾶς παραδειγμάτισον. 17r μνήσθητι, κύριε, γνώσθητι ἐν καιρῷ θλίψεως ἡμῶν καὶ ἐμὲ θάρσυνον, βασιλεῦ τῶν θεῶν καὶ πάσης ἀρχῆς ἐπικρατῶν· 17s δὸς λόγον εὔρυθμον εἰς τὸ στόμα μου ἐνώπιον τοῦ λέοντος καὶ μετάθες τὴν καρδίαν αὐτοῦ εἰς μῖσος τοῦ πολεμοῦντος ἡμᾶς εἰς συντέλειαν αὐτοῦ καὶ τῶν ὁμονοούντων αὐτῷ· 17t ἡμᾶς δὲ ῥῦσαι ἐν χειρί σου καὶ βοήθησόν μοι τῇ μόνῃ καὶ μὴ ἐχούσῃ εἰ μὴ σέ, κύριε. 17u <strong>πάντων γνῶσιν ἔχεις</strong> καὶ οἶδας ὅτι ἐμίσησα δόξαν ἀνόμων καὶ βδελύσσομαι κοίτην ἀπεριτμήτων καὶ παντὸς ἀλλοτρίου» (<a href="https://bibleox.com/el/gr-lxx-byz/esf/4/#L17">Εσθ 4:17</a>)</p></blockquote><blockquote><p>«καὶ ἄνθρωποι πάντες ἀπὸ ἐδάφους, καὶ ἐκ γῆς ἐκτίσθη Αδαμ· <strong>ἐν πλήθει ἐπιστήμης</strong> κύριος διεχώρισεν αὐτοὺς καὶ ἠλλοίωσεν τὰς ὁδοὺς αὐτῶν·» (<a href="https://bibleox.com/el/gr-lxx-byz/prsir/33/#L10-11">Σ.Σειρ 33:10-11</a>)</p></blockquote><blockquote><p>«αὐτὸς γὰρ ὁρατής ἐστιν ἔργων ἀνθρώπων, <strong>λέληθεν δὲ αὐτὸν οὐδὲν ὧν πράσσουσιν</strong>,» (<a href="https://bibleox.com/el/gr-lxx-byz/iov/34/#L21">Ιωβ 34:21</a>)</p></blockquote><blockquote><p>«<strong>ἔργα πάσης σαρκὸς ἐνώπιον αὐτοῦ</strong>, καὶ <strong>οὐκ ἔστιν κρυβῆναι ἀπὸ τῶν ὀφθαλμῶν αὐτοῦ</strong>·» (<a href="https://bibleox.com/el/gr-lxx-byz/prsir/39/#L19">Σ.Σειρ 39:19</a>)</p></blockquote><blockquote><p>«ὅτι πνεῦμα κυρίου πεπλήρωκεν τὴν οἰκουμένην, καὶ <strong>τὸ συνέχον τὰ πάντα</strong> <strong>γνῶσιν ἔχει φωνῆς</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/prs/1/#L7">Σ.Σολ 1:7</a>)</p></blockquote><h2>Ο Θεός γνωρίζει το μέλλον</h2><blockquote><p>«διὰ τί δὲ <strong>κύριον ἔλαθον ὧραι</strong>,» (<a href="https://bibleox.com/el/gr-lxx-byz/iov/24/#L1">Ιωβ 24:1</a>)</p></blockquote><blockquote><p>«οὐκ ἐξεποίησεν τοῖς ἁγίοις κυρίου ἐκδιηγήσασθαι πάντα τὰ θαυμάσια αὐτοῦ, ἃ ἐστερέωσεν κύριος ὁ παντοκράτωρ στηριχθῆναι ἐν δόξῃ αὐτοῦ τὸ πᾶν. ἄβυσσον καὶ καρδίαν ἐξίχνευσεν καὶ ἐν πανουργεύμασιν αὐτῶν διενοήθη· <strong>ἔγνω γὰρ ὁ ὕψιστος πᾶσαν εἴδησιν καὶ ἐνέβλεψεν εἰς σημεῖον αἰῶνος ἀπαγγέλλων τὰ παρεληλυθότα καὶ τὰ ἐσόμενα καὶ ἀποκαλύπτων ἴχνη ἀποκρύφων</strong>·» (<a href="https://bibleox.com/el/gr-lxx-byz/prsir/42/#L17-19">Σ.Σειρ 42:17-19</a>)</p></blockquote><h2>Ο Θεός γνωρίζει τις σκέψεις, τα συναισθήματα και τις επιθυμίες του ανθρώπου</h2><blockquote><p>«<strong>Ἰδὼν δὲ κύριος ὁ θεὸς</strong> ὅτι ἐπληθύνθησαν αἱ κακίαι τῶν ἀνθρώπων ἐπὶ τῆς γῆς καὶ <strong>πᾶς τις διανοεῖται ἐν τῇ καρδίᾳ αὐτοῦ ἐπιμελῶς ἐπὶ τὰ πονηρὰ</strong> πάσας τὰς ἡμέρας,» (<a href="https://bibleox.com/el/gr-lxx-byz/gen/6/#L5">Γεν 6:5</a>)</p></blockquote><blockquote><p>«κύριε, <strong>ἐναντίον σου πᾶσα ἡ ἐπιθυμία μου</strong>, καὶ ὁ στεναγμός μου ἀπὸ σοῦ οὐκ ἐκρύβη.» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/37/#L9">Ψλ 37:9</a>)</p></blockquote><blockquote><p>«αὐτὸς γὰρ <strong>γινώσκει τὰ κρύφια τῆς καρδίας</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/43/#L21">Ψλ 43:21</a>)</p></blockquote><blockquote><p>«<strong>πάσας καρδίας ἐτάζει κύριος καὶ πᾶν ἐνθύμημα γιγνώσκει</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/1par/28/#L9">Α Παρ 28:9</a>)</p></blockquote><blockquote><p>«<strong>μόνος γινώσκεις τὴν καρδίαν υἱῶν ἀνθρώπων</strong>,» (<a href="https://bibleox.com/el/gr-lxx-byz/2par/6/#L30">Β Παρ 6:30</a>)</p></blockquote><blockquote><p>«<strong>ὁ πλάσας κατὰ μόνας τὰς καρδίας αὐτῶν, ὁ συνιεὶς εἰς πάντα τὰ ἔργα αὐτῶν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/32/#L15">Ψλ 32:15</a>)</p></blockquote><blockquote><p>«οὐκ ἐξεποίησεν τοῖς ἁγίοις κυρίου ἐκδιηγήσασθαι πάντα τὰ θαυμάσια αὐτοῦ, ἃ ἐστερέωσεν κύριος ὁ παντοκράτωρ στηριχθῆναι ἐν δόξῃ αὐτοῦ τὸ πᾶν. &lt;…&gt; <strong>οὐ παρῆλθεν αὐτὸν πᾶν διανόημα, οὐκ ἐκρύβη ἀπ᾿ αὐτοῦ οὐδὲ εἷς λόγος</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/prsir/42/#L17,20">Σ.Σειρ 42:17,20</a>)</p></blockquote><blockquote><p>«καὶ <strong>εἰδὼς ὁ Ἰησοῦς τὰς ἐνθυμήσεις αὐτῶν</strong> εἶπεν, Ἱνατί <strong>ἐνθυμεῖσθε πονηρὰ ἐν ταῖς καρδίαις ὑμῶν</strong>;» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/9/#L4">Μτ 9:4</a> · <a href="https://bibleox.com/el/gr-lxx-byz/lk/5/#L22">Λκ 5:22</a>)</p></blockquote><blockquote><p>«<strong>εἰδὼς δὲ τὰς ἐνθυμήσεις αὐτῶν</strong> εἶπεν αὐτοῖς» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/12/#L25">Μτ 12:25</a>)</p></blockquote><blockquote><p>«αὐτὸς δὲ <strong>ᾔδει τοὺς διαλογισμοὺς αὐτῶν</strong>, εἶπεν δὲ τῷ ἀνδρὶ τῷ ξηρὰν ἔχοντι τὴν χεῖρα» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/6/#L8">Λκ 6:8</a>)</p></blockquote><blockquote><p>«ὁ δὲ Ἰησοῦς <strong>εἰδὼς τὸν διαλογισμὸν τῆς καρδίας αὐτῶν</strong> ἐπιλαβόμενος παιδίον» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/9/#L47">Λκ 9:47</a>)</p></blockquote><blockquote><p>«αὐτὸς δὲ <strong>εἰδὼς αὐτῶν τὰ διανοήματα</strong> εἶπεν αὐτοῖς» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/11/#L17">Λκ 11:17</a>)</p></blockquote><blockquote><p>«καὶ προσευξάμενοι εἶπαν, Σὺ κύριε, <strong>καρδιογνῶστα</strong> πάντων, ἀνάδειξον ὃν ἐξελέξω ἐκ τούτων τῶν δύο ἕνα» (<a href="https://bibleox.com/el/gr-lxx-byz/act/1/#L24">Πραξ 1:24</a>)</p></blockquote><blockquote><p>«καὶ <strong>ὁ καρδιογνώστης</strong> θεὸς ἐμαρτύρησεν αὐτοῖς δοὺς τὸ πνεῦμα τὸ ἅγιον καθὼς καὶ ἡμῖν,» (<a href="https://bibleox.com/el/gr-lxx-byz/act/15/#L8">Πραξ 15:8</a>)</p></blockquote><h2>Ο Θεός γνωρίζει όλες τις αμαρτίες του ανθρώπου</h2><blockquote><p>«ὁ θεός, σὺ ἔγνως τὴν ἀφροσύνην μου, καὶ <strong>αἱ πλημμέλειαί μου ἀπὸ σοῦ οὐκ ἐκρύβησαν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/68/#L5">Ψλ 68:5</a>)</p></blockquote>
