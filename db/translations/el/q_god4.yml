  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <h2>Ο Θεός δημιούργησε τα πάντα</h2><blockquote><p>«Ἐν ἀρχῇ ἦν ὁ λόγος, καὶ ὁ λόγος ἦν πρὸς τὸν θεόν, καὶ θεὸς ἦν ὁ λόγος. &lt;…&gt; <strong>πάντα δι᾿ αὐτοῦ ἐγένετο, καὶ χωρὶς αὐτοῦ ἐγένετο οὐδὲ ἕν. ὃ γέγονεν</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/in/1/#L1,3">Ιω 1:1,3</a>)</p></blockquote><blockquote><p>«Ἐν ἀρχῇ <strong>ἐποίησεν ὁ θεὸς</strong> <strong>τὸν οὐρανὸν</strong> καὶ <strong>τὴν γῆν</strong>. ἡ δὲ γῆ ἦν ἀόρατος καὶ ἀκατασκεύαστος, καὶ σκότος ἐπάνω τῆς ἀβύσσου, καὶ πνεῦμα θεοῦ ἐπεφέρετο ἐπάνω τοῦ ὕδατος. καὶ εἶπεν ὁ θεός Γενηθήτω <strong>φῶς</strong>. καὶ ἐγένετο φῶς. καὶ εἶδεν ὁ θεὸς τὸ φῶς ὅτι καλόν. καὶ διεχώρισεν ὁ θεὸς ἀνὰ μέσον τοῦ φωτὸς καὶ ἀνὰ μέσον τοῦ σκότους. καὶ ἐκάλεσεν ὁ θεὸς τὸ φῶς ἡμέραν καὶ τὸ σκότος ἐκάλεσεν νύκτα. καὶ ἐγένετο ἑσπέρα καὶ ἐγένετο πρωί, ἡμέρα μία. Καὶ εἶπεν ὁ θεός Γενηθήτω <strong>στερέωμα</strong> ἐν μέσῳ τοῦ ὕδατος καὶ ἔστω διαχωρίζον ἀνὰ μέσον ὕδατος καὶ ὕδατος. καὶ ἐγένετο οὕτως. καὶ ἐποίησεν ὁ θεὸς τὸ στερέωμα, καὶ διεχώρισεν ὁ θεὸς ἀνὰ μέσον τοῦ ὕδατος, ὃ ἦν ὑποκάτω τοῦ στερεώματος, καὶ ἀνὰ μέσον τοῦ ὕδατος τοῦ ἐπάνω τοῦ στερεώματος. καὶ ἐκάλεσεν ὁ θεὸς τὸ στερέωμα οὐρανόν. καὶ εἶδεν ὁ θεὸς ὅτι καλόν. καὶ ἐγένετο ἑσπέρα καὶ ἐγένετο πρωί, ἡμέρα δευτέρα. Καὶ εἶπεν ὁ θεός Συναχθήτω τὸ ὕδωρ τὸ ὑποκάτω τοῦ οὐρανοῦ εἰς συναγωγὴν μίαν, καὶ ὀφθήτω ἡ <strong>ξηρά</strong>. καὶ ἐγένετο οὕτως. καὶ συνήχθη τὸ ὕδωρ τὸ ὑποκάτω τοῦ οὐρανοῦ εἰς τὰς συναγωγὰς αὐτῶν, καὶ ὤφθη ἡ ξηρά. καὶ ἐκάλεσεν ὁ θεὸς τὴν ξηρὰν γῆν καὶ τὰ συστήματα τῶν ὑδάτων ἐκάλεσεν θαλάσσας. καὶ εἶδεν ὁ θεὸς ὅτι καλόν. — καὶ εἶπεν ὁ θεός Βλαστησάτω ἡ γῆ <strong>βοτάνην</strong> χόρτου, σπεῖρον σπέρμα κατὰ γένος καὶ καθ᾿ ὁμοιότητα, καὶ ξύλον κάρπιμον ποιοῦν καρπόν, οὗ τὸ σπέρμα αὐτοῦ ἐν αὐτῷ κατὰ γένος ἐπὶ τῆς γῆς. καὶ ἐγένετο οὕτως. καὶ ἐξήνεγκεν ἡ γῆ βοτάνην χόρτου, σπεῖρον σπέρμα κατὰ γένος καὶ καθ᾿ ὁμοιότητα, καὶ ξύλον κάρπιμον ποιοῦν καρπόν, οὗ τὸ σπέρμα αὐτοῦ ἐν αὐτῷ κατὰ γένος ἐπὶ τῆς γῆς. καὶ εἶδεν ὁ θεὸς ὅτι καλόν. καὶ ἐγένετο ἑσπέρα καὶ ἐγένετο πρωί, ἡμέρα τρίτη. Καὶ εἶπεν ὁ θεός Γενηθήτωσαν φωστῆρες ἐν τῷ στερεώματι τοῦ οὐρανοῦ εἰς φαῦσιν τῆς γῆς τοῦ διαχωρίζειν ἀνὰ μέσον τῆς ἡμέρας καὶ ἀνὰ μέσον τῆς νυκτὸς καὶ ἔστωσαν εἰς σημεῖα καὶ εἰς καιροὺς καὶ εἰς ἡμέρας καὶ εἰς ἐνιαυτοὺς καὶ ἔστωσαν εἰς φαῦσιν ἐν τῷ στερεώματι τοῦ οὐρανοῦ ὥστε φαίνειν ἐπὶ τῆς γῆς. καὶ ἐγένετο οὕτως. καὶ ἐποίησεν ὁ θεὸς τοὺς δύο <strong>φωστῆρας</strong> τοὺς μεγάλους, τὸν φωστῆρα τὸν μέγαν εἰς ἀρχὰς τῆς ἡμέρας καὶ τὸν φωστῆρα τὸν ἐλάσσω εἰς ἀρχὰς τῆς νυκτός, καὶ τοὺς ἀστέρας. καὶ ἔθετο αὐτοὺς ὁ θεὸς ἐν τῷ στερεώματι τοῦ οὐρανοῦ ὥστε φαίνειν ἐπὶ τῆς γῆς καὶ ἄρχειν τῆς ἡμέρας καὶ τῆς νυκτὸς καὶ διαχωρίζειν ἀνὰ μέσον τοῦ φωτὸς καὶ ἀνὰ μέσον τοῦ σκότους. καὶ εἶδεν ὁ θεὸς ὅτι καλόν. καὶ ἐγένετο ἑσπέρα καὶ ἐγένετο πρωί, ἡμέρα τετάρτη. Καὶ εἶπεν ὁ θεός Ἐξαγαγέτω τὰ ὕδατα <strong>ἑρπετὰ</strong> ψυχῶν ζωσῶν καὶ <strong>πετεινὰ</strong> πετόμενα ἐπὶ τῆς γῆς κατὰ τὸ στερέωμα τοῦ οὐρανοῦ. καὶ ἐγένετο οὕτως. καὶ ἐποίησεν ὁ θεὸς τὰ κήτη τὰ μεγάλα καὶ πᾶσαν ψυχὴν ζῴων ἑρπετῶν, ἃ ἐξήγαγεν τὰ ὕδατα κατὰ γένη αὐτῶν, καὶ πᾶν πετεινὸν πτερωτὸν κατὰ γένος. καὶ εἶδεν ὁ θεὸς ὅτι καλά. καὶ ηὐλόγησεν αὐτὰ ὁ θεὸς λέγων Αὐξάνεσθε καὶ πληθύνεσθε καὶ πληρώσατε τὰ ὕδατα ἐν ταῖς θαλάσσαις, καὶ τὰ πετεινὰ πληθυνέσθωσαν ἐπὶ τῆς γῆς. καὶ ἐγένετο ἑσπέρα καὶ ἐγένετο πρωί, ἡμέρα πέμπτη. Καὶ εἶπεν ὁ θεός Ἐξαγαγέτω ἡ γῆ <strong>ψυχὴν ζῶσαν</strong> κατὰ γένος, τετράποδα καὶ ἑρπετὰ καὶ θηρία τῆς γῆς κατὰ γένος. καὶ ἐγένετο οὕτως. καὶ ἐποίησεν ὁ θεὸς τὰ θηρία τῆς γῆς κατὰ γένος καὶ τὰ <strong>κτήνη</strong> κατὰ γένος καὶ πάντα τὰ ἑρπετὰ τῆς γῆς κατὰ γένος αὐτῶν. καὶ εἶδεν ὁ θεὸς ὅτι καλά. — καὶ εἶπεν ὁ θεός Ποιήσωμεν <strong>ἄνθρωπον</strong> κατ᾿ εἰκόνα ἡμετέραν καὶ καθ᾿ ὁμοίωσιν, καὶ ἀρχέτωσαν τῶν ἰχθύων τῆς θαλάσσης καὶ τῶν πετεινῶν τοῦ οὐρανοῦ καὶ τῶν κτηνῶν καὶ πάσης τῆς γῆς καὶ πάντων τῶν ἑρπετῶν τῶν ἑρπόντων ἐπὶ τῆς γῆς. καὶ ἐποίησεν ὁ θεὸς τὸν ἄνθρωπον, κατ᾿ εἰκόνα θεοῦ ἐποίησεν αὐτόν, <strong>ἄρσεν καὶ θῆλυ</strong> ἐποίησεν αὐτούς.» (<a href="https://bibleox.com/el/gr-lxx-byz/gen/1/#L1-27">Γεν 1:1-27</a>)</p></blockquote><blockquote><p>«οὐκ ἔστιν τοιαύτη μερὶς τῷ Ιακωβ, ὅτι <strong>ὁ πλάσας τὰ πάντα</strong> αὐτὸς κληρονομία αὐτοῦ, κύριος ὄνομα αὐτῷ.» (<a href="https://bibleox.com/el/gr-lxx-byz/ier/10/#L16">Ιερ 10:16</a>)</p></blockquote><blockquote><p>«<strong>ὁ θεὸς ὁ ποιήσας τὸν κόσμον καὶ πάντα τὰ ἐν αὐτῷ</strong>, οὗτος οὐρανοῦ καὶ γῆς ὑπάρχων κύριος οὐκ ἐν χειροποιήτοις ναοῖς κατοικεῖ» (<a href="https://bibleox.com/el/gr-lxx-byz/act/17/#L24">Πραξ 17:24</a>)</p></blockquote><blockquote><p>«Ὁ ζῶν εἰς τὸν αἰῶνα <strong>ἔκτισεν τὰ πάντα</strong> κοινῇ·» (<a href="https://bibleox.com/el/gr-lxx-byz/prsir/18/#L1">Σ.Σειρ 18:1</a>)</p></blockquote><blockquote><p>«<strong>πάντα γὰρ ἐποίησεν ὁ κύριος</strong> καὶ τοῖς εὐσεβέσιν ἔδωκεν σοφίαν» (<a href="https://bibleox.com/el/gr-lxx-byz/prsir/43/#L33">Σ.Σειρ 43:33</a>)</p></blockquote><blockquote><p>«Οὕτως λέγει κύριος ὁ λυτρούμενός σε καὶ ὁ πλάσσων σε ἐκ κοιλίας Ἐγὼ κύριος <strong>ὁ συντελῶν πάντα</strong> ἐξέτεινα τὸν οὐρανὸν μόνος καὶ ἐστερέωσα τὴν γῆν» (<a href="https://bibleox.com/el/gr-lxx-byz/is/44/#L24">Ησ 44:24</a>)</p></blockquote><blockquote><p>«Ἄξιος εἶ, ὁ κύριος καὶ ὁ θεὸς ἡμῶν, λαβεῖν τὴν δόξαν καὶ τὴν τιμὴν καὶ τὴν δύναμιν, ὅτι <strong>σὺ ἔκτισας τὰ πάντα</strong>, καὶ <strong>διὰ τὸ θέλημά σου ἦσαν</strong> καὶ ἐκτίσθησαν.» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/4/#L11">Απ 4:11</a>)</p></blockquote><blockquote><p>«ἀξιῶ σε, τέκνον, ἀναβλέψαντα εἰς τὸν οὐρανὸν καὶ τὴν γῆν καὶ τὰ ἐν αὐτοῖς πάντα ἰδόντα γνῶναι ὅτι <strong>οὐκ ἐξ ὄντων ἐποίησεν αὐτὰ ὁ θεός</strong>, καὶ τὸ τῶν ἀνθρώπων γένος οὕτω γίνεται.» (<a href="https://bibleox.com/el/gr-lxx-byz/2mak/7/#L28">II Μακ 7:28</a>)</p></blockquote><blockquote><p>«ὡς ἐμεγαλύνθη τὰ ἔργα σου, κύριε· <strong>πάντα ἐν σοφίᾳ ἐποίησας</strong>, ἐπληρώθη ἡ γῆ τῆς κτήσεώς σου.» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/103/#L24">Ψλ 103:24</a>)</p></blockquote><blockquote><p>«τῷ λόγῳ τοῦ κυρίου <strong>οἱ οὐρανοὶ ἐστερεώθησαν</strong> καὶ τῷ πνεύματι τοῦ στόματος αὐτοῦ <strong>πᾶσα ἡ δύναμις αὐτῶν</strong>· συνάγων <strong>ὡς ἀσκὸν ὕδατα θαλάσσης</strong>, τιθεὶς ἐν θησαυροῖς ἀβύσσους. &lt;…&gt; ὅτι αὐτὸς εἶπεν, καὶ ἐγενήθησαν, αὐτὸς ἐνετείλατο, καὶ ἐκτίσθησαν.» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/32/#L6-7,9">Ψλ 32:6-7,9</a>)</p></blockquote><blockquote><p>«<strong>τὸν ποιήσαντα τὸν οὐρανὸν</strong> καὶ <strong>τὴν γῆν, τὴν θάλασσαν καὶ πάντα τὰ ἐν αὐτοῖς</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/145/#L6">Ψλ 145:6</a>)</p></blockquote><blockquote><p>«οἱ δὲ ἀκούσαντες ὁμοθυμαδὸν ἦραν φωνὴν πρὸς τὸν θεὸν καὶ εἶπαν, Δέσποτα, <strong>σὺ ὁ ποιήσας τὸν οὐρανὸν καὶ τὴν γῆν καὶ τὴν θάλασσαν καὶ πάντα τὰ ἐν αὐτοῖς</strong>,» (<a href="https://bibleox.com/el/gr-lxx-byz/act/4/#L24">Πραξ 4:24</a>)</p></blockquote><blockquote><p>«εὐαγγελιζόμενοι ὑμᾶς ἀπὸ τούτων τῶν ματαίων ἐπιστρέφειν ἐπὶ θεὸν ζῶντα <strong>ὃς ἐποίησεν τὸν οὐρανὸν καὶ τὴν γῆν καὶ τὴν θάλασσαν καὶ πάντα τὰ ἐν αὐτοῖς</strong>·» (<a href="https://bibleox.com/el/gr-lxx-byz/act/14/#L15">Πραξ 14:15</a>)</p></blockquote><blockquote><p>«ἐν γὰρ ἓξ ἡμέραις ἐποίησεν κύριος <strong>τὸν οὐρανὸν καὶ τὴν γῆν καὶ τὴν θάλασσαν καὶ πάντα τὰ ἐν αὐτοῖς</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/20/#L11">Έξ 20:11</a>)</p></blockquote><blockquote><p>«<strong>οὐ γὰρ ὑποστελεῖται πρόσωπον ὁ πάντων δεσπότης</strong> οὐδὲ ἐντραπήσεται μέγεθος, ὅτι <strong>μικρὸν καὶ μέγαν αὐτὸς ἐποίησεν</strong> ὁμοίως τε προνοεῖ περὶ πάντων,» (<a href="https://bibleox.com/el/gr-lxx-byz/prs/6/#L7">Σ.Σολ 6:7</a>)</p></blockquote><blockquote><p>«ὁ φυτεύσας τὸ <strong>οὖς</strong> οὐχὶ ἀκούει, ἢ ὁ πλάσας τὸν <strong>ὀφθαλμὸν</strong> οὐ κατανοεῖ;» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/93/#L9">Ψλ 93:9</a>)</p></blockquote><blockquote><p>«ὅτι ἐν τῇ χειρὶ αὐτοῦ τὰ πέρατα <strong>τῆς γῆς</strong>, καὶ τὰ ὕψη <strong>τῶν ὀρέων</strong> αὐτοῦ εἰσιν· ὅτι αὐτοῦ ἐστιν <strong>ἡ θάλασσα</strong>, καὶ αὐτὸς ἐποίησεν αὐτήν, καὶ <strong>τὴν ξηρὰν</strong> αἱ χεῖρες αὐτοῦ ἔπλασαν. δεῦτε προσκυνήσωμεν καὶ προσπέσωμεν αὐτῷ καὶ κλαύσωμεν ἐναντίον κυρίου <strong>τοῦ ποιήσαντος ἡμᾶς</strong>·» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/94/#L4-6">Ψλ 94:4-6</a>)</p></blockquote><blockquote><p>«ἐγὼ ἐποίησα <strong>γῆν</strong> καὶ <strong>ἄνθρωπον</strong> ἐπ᾿ αὐτῆς, ἐγὼ τῇ χειρί μου ἐστερέωσα <strong>τὸν οὐρανόν</strong>, ἐγὼ πᾶσι τοῖς ἄστροις <strong>ἐνετειλάμην</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/is/45/#L12">Ησ 45:12</a>)</p></blockquote><blockquote><p>«κύριος ὁ ποιήσας <strong>τὴν γῆν</strong> ἐν τῇ ἰσχύι αὐτοῦ, ὁ ἀνορθώσας <strong>τὴν οἰκουμένην</strong> ἐν τῇ σοφίᾳ αὐτοῦ καὶ τῇ φρονήσει αὐτοῦ ἐξέτεινεν <strong>τὸν οὐρανὸν</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/ier/10/#L12">Ιερ 10:12</a>)</p></blockquote><blockquote><p>«<strong>ἐγὼ ἐποίησα</strong> <strong>τὴν γῆν</strong> <strong>ἐν τῇ ἰσχύι μου τῇ μεγάλῃ</strong> καὶ ἐν τῷ ἐπιχείρῳ μου τῷ ὑψηλῷ καὶ δώσω αὐτὴν ᾧ ἐὰν δόξῃ ἐν ὀφθαλμοῖς μου.» (<a href="https://bibleox.com/el/gr-lxx-byz/ier/34/#L5">Ιερ 34:5</a>)</p></blockquote><blockquote><p>«Ὦ κύριε, <strong>σὺ ἐποίησας τὸν οὐρανὸν καὶ τὴν γῆν</strong> τῇ ἰσχύι σου τῇ μεγάλῃ καὶ τῷ βραχίονί σου τῷ ὑψηλῷ καὶ τῷ μετεώρῳ, οὐ μὴ ἀποκρυβῇ ἀπὸ σοῦ οὐθέν,» (<a href="https://bibleox.com/el/gr-lxx-byz/ier/39/#L17">Ιερ 39:17</a>)</p></blockquote><blockquote><p>«Μάταιοι μὲν γὰρ πάντες ἄνθρωποι φύσει, οἷς παρῆν θεοῦ ἀγνωσία καὶ ἐκ τῶν ὁρωμένων ἀγαθῶν οὐκ ἴσχυσαν εἰδέναι τὸν ὄντα οὔτε τοῖς ἔργοις προσέχοντες ἐπέγνωσαν τὸν τεχνίτην, ἀλλ᾿ ἢ <strong>πῦρ</strong> ἢ <strong>πνεῦμα</strong> ἢ ταχινὸν <strong>ἀέρα</strong> ἢ <strong>κύκλον ἄστρων</strong> ἢ βίαιον <strong>ὕδωρ</strong> ἢ <strong>φωστῆρας</strong> οὐρανοῦ πρυτάνεις κόσμου θεοὺς ἐνόμισαν. ὧν εἰ μὲν τῇ καλλονῇ τερπόμενοι ταῦτα θεοὺς ὑπελάμβανον, γνώτωσαν πόσῳ τούτων ὁ δεσπότης ἐστὶ βελτίων, ὁ γὰρ τοῦ κάλλους γενεσιάρχης <strong>ἔκτισεν</strong> αὐτά·» (<a href="https://bibleox.com/el/gr-lxx-byz/prs/13/#L1-3">Σ.Σολ 13:1-3</a>)</p></blockquote><h2>Ο Θεός <a href="https://bibleox.com/el/el/w/Ο_Θεός_είναι_αναλλοίωτος">είναι αναλλοίωτος</a>. Δεν άλλαξε ούτε από τη δημιουργία του κόσμου</h2><blockquote><p>«τὰ μεγαλεῖα τῆς σοφίας αὐτοῦ ἐκόσμησεν, ὡς ἔστιν πρὸ τοῦ αἰῶνος καὶ εἰς τὸν αἰῶνα· <strong>οὔτε προσετέθη οὔτε ἠλαττώθη</strong>, καὶ οὐ προσεδεήθη οὐδενὸς συμβούλου.» (<a href="https://bibleox.com/el/gr-lxx-byz/prsir/42/#L21">Σ.Σειρ 42:21</a>)</p></blockquote>
