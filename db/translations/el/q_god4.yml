  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <h2>Ο Θεός είναι ένας και δεν υπάρχει άλλος</h2><blockquote><p>«Οὕτως λέγει ὁ θεὸς ὁ βασιλεὺς τοῦ Ισραηλ ὁ ῥυσάμενος αὐτὸν θεὸς σαβαωθ Ἐγὼ πρῶτος καὶ ἐγὼ μετὰ ταῦτα, <strong>πλὴν ἐμοῦ οὐκ ἔστιν θεός</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/is/44/#L6">Ησ 44:6</a>)</p></blockquote><blockquote><p>«ἐγὼ κύριος ὁ θεός, καὶ <strong>οὐκ ἔστιν ἔτι πλὴν ἐμοῦ θεός</strong>, καὶ οὐκ ᾔδεις με,» (<a href="https://bibleox.com/el/gr-lxx-byz/is/45/#L5">Ησ 45:5</a>)</p></blockquote><blockquote><p>«ἴδετε ἴδετε ὅτι ἐγώ εἰμι, καὶ <strong>οὐκ ἔστιν θεὸς πλὴν ἐμοῦ</strong>· ἐγὼ ἀποκτενῶ καὶ ζῆν ποιήσω, πατάξω κἀγὼ ἰάσομαι, καὶ οὐκ ἔστιν ὃς ἐξελεῖται ἐκ τῶν χειρῶν μου.» (<a href="https://bibleox.com/el/gr-lxx-byz/vtor/32/#L39">Δτ 32:39</a>)</p></blockquote><blockquote><p>«ἵνα γνῶσιν οἱ ἀπὸ ἀνατολῶν ἡλίου καὶ οἱ ἀπὸ δυσμῶν ὅτι οὐκ ἔστιν πλὴν ἐμοῦ· ἐγὼ κύριος ὁ θεός, καὶ <strong>οὐκ ἔστιν ἔτι</strong>·» (<a href="https://bibleox.com/el/gr-lxx-byz/is/45/#L6">Ησ 45:6</a>)</p></blockquote><blockquote><p>«Οὕτως λέγει κύριος σαβαωθ Ἐκοπίασεν Αἴγυπτος καὶ ἐμπορία Αἰθιόπων, καὶ οἱ Σεβωιν ἄνδρες ὑψηλοὶ ἐπὶ σὲ διαβήσονται καὶ σοὶ ἔσονται δοῦλοι καὶ ὀπίσω σου ἀκολουθήσουσιν δεδεμένοι χειροπέδαις καὶ προσκυνήσουσίν σοι καὶ ἐν σοὶ προσεύξονται, ὅτι ἐν σοὶ ὁ θεός ἐστιν, καὶ ἐροῦσιν <strong>Οὐκ ἔστιν θεὸς πλὴν σοῦ</strong>·» (<a href="https://bibleox.com/el/gr-lxx-byz/is/45/#L14">Ησ 45:14</a>)</p></blockquote><blockquote><p>«Οὕτως λέγει κύριος ὁ ποιήσας τὸν οὐρανόν — οὗτος ὁ θεὸς ὁ καταδείξας τὴν γῆν καὶ ποιήσας αὐτήν, αὐτὸς διώρισεν αὐτήν, οὐκ εἰς κενὸν ἐποίησεν αὐτὴν ἀλλὰ κατοικεῖσθαι — Ἐγώ εἰμι, καὶ <strong>οὐκ ἔστιν ἔτι</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/is/45/#L18">Ησ 45:18</a>)</p></blockquote><blockquote><p>«εἰ ἀναγγελοῦσιν, ἐγγισάτωσαν, ἵνα γνῶσιν ἅμα τίς ἀκουστὰ ἐποίησεν ταῦτα ἀπ᾿ ἀρχῆς. τότε ἀνηγγέλη ὑμῖν Ἐγὼ ὁ θεός, καὶ <strong>οὐκ ἔστιν ἄλλος πλὴν ἐμοῦ</strong>· δίκαιος καὶ σωτὴρ <strong>οὐκ ἔστιν πάρεξ ἐμοῦ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/is/45/#L21">Ησ 45:21</a>)</p></blockquote><blockquote><p>«ἐπιστράφητε πρός με καὶ σωθήσεσθε, οἱ ἀπ᾿ ἐσχάτου τῆς γῆς· <strong>ἐγώ εἰμι ὁ θεός, καὶ οὐκ ἔστιν ἄλλος</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/is/45/#L22">Ησ 45:22</a>)</p></blockquote><blockquote><p>«καὶ μνήσθητε τὰ πρότερα ἀπὸ τοῦ αἰῶνος, ὅτι ἐγώ εἰμι ὁ θεός, καὶ <strong>οὐκ ἔστιν ἔτι πλὴν ἐμοῦ</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/is/46/#L9">Ησ 46:9</a>)</p></blockquote><blockquote><p>«κύριος ὁ θεός σου, οὗτος θεός ἐστιν, καὶ <strong>οὐκ ἔστιν ἔτι πλὴν αὐτοῦ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/vtor/4/#L35">Δτ 4:35</a>)</p></blockquote><blockquote><p>«καὶ εἶπεν αὐτῷ ὁ γραμματεύς, Καλῶς, διδάσκαλε, ἐπ᾿ ἀληθείας εἶπες ὅτι <strong>εἷς ἐστιν καὶ οὐκ ἔστιν ἄλλος πλὴν αὐτοῦ</strong>·» (<a href="https://bibleox.com/el/gr-lxx-byz/mk/12/#L32">Μκ 12:32</a>)</p></blockquote><blockquote><p>«Περὶ τῆς βρώσεως οὖν τῶν εἰδωλοθύτων οἴδαμεν ὅτι οὐδὲν εἴδωλον ἐν κόσμῳ, καὶ ὅτι <strong>οὐδεὶς θεὸς εἰ μὴ εἷς</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/8/#L4">Α Κορ 8:4</a>)</p></blockquote><h2>Οι θεοί των άλλων εθνών δεν είναι θεοί, αλλά δαίμονες</h2><blockquote><p>«<strong>ἔθυσαν δαιμονίοις</strong> καὶ οὐ θεῷ, <strong>θεοῖς, οἷς οὐκ ᾔδεισαν</strong>· <strong>καινοὶ πρόσφατοι ἥκασιν</strong>, οὓς οὐκ ᾔδεισαν οἱ πατέρες αὐτῶν.» (<a href="https://bibleox.com/el/gr-lxx-byz/vtor/32/#L17">Δτ 32:17</a>)</p></blockquote><blockquote><p>«καὶ ἔθυσαν τοὺς υἱοὺς αὐτῶν καὶ τὰς θυγατέρας αὐτῶν <strong>τοῖς δαιμονίοις</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/105/#L37">Ψλ 105:37</a>)</p></blockquote><blockquote><p>«παρωξύνατε γὰρ τὸν ποιήσαντα ὑμᾶς <strong>θύσαντες δαιμονίοις καὶ οὐ θεῷ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/var/4/#L7">Βαρ 4:7</a>)</p></blockquote><blockquote><p>«ἀλλ᾿ ὅτι <strong>ἃ θύουσιν [τὰ ἔθνη], δαιμονίοις καὶ οὐ θεῷ</strong> θύουσιν, οὐ θέλω δὲ ὑμᾶς κοινωνοὺς τῶν δαιμονίων γίνεσθαι.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/10/#L20">Α Κορ 10:20</a>)</p></blockquote><blockquote><p>«εἰ ποιήσει ἑαυτῷ ἄνθρωπος θεούς; καὶ οὗτοι <strong>οὔκ εἰσιν θεοί</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ier/16/#L20">Ιερ 16:20</a>)</p></blockquote><blockquote><p>«ποίᾳ τούτων ἵλεως γένωμαί σοι; οἱ υἱοί σου ἐγκατέλιπόν με καὶ <strong>ὤμνυον ἐν τοῖς οὐκ οὖσιν θεοῖς</strong>· καὶ ἐχόρτασα αὐτούς, καὶ ἐμοιχῶντο καὶ ἐν οἴκοις πορνῶν κατέλυον.» (<a href="https://bibleox.com/el/gr-lxx-byz/ier/5/#L7">Ιερ 5:7</a>)</p></blockquote><blockquote><p>«Ἀλλὰ τότε μὲν οὐκ εἰδότες θεὸν ἐδουλεύσατε <strong>τοῖς φύσει μὴ οὖσιν θεοῖς</strong>·» (<a href="https://bibleox.com/el/gr-lxx-byz/gal/4/#L8">Γαλ 4:8</a>)</p></blockquote><blockquote><p>«ὅτι <strong>πάντες οἱ θεοὶ τῶν ἐθνῶν δαιμόνια</strong>, ὁ δὲ κύριος τοὺς οὐρανοὺς ἐποίησεν·» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/95/#L5">Ψλ 95:5</a>)</p></blockquote><blockquote><p>«καὶ λέγοντες, Ἄνδρες, τί ταῦτα ποιεῖτε; καὶ ἡμεῖς ὁμοιοπαθεῖς ἐσμεν ὑμῖν ἄνθρωποι, <strong>εὐαγγελιζόμενοι ὑμᾶς ἀπὸ τούτων τῶν ματαίων ἐπιστρέφειν ἐπὶ θεὸν ζῶντα</strong> ὃς ἐποίησεν τὸν οὐρανὸν καὶ τὴν γῆν καὶ τὴν θάλασσαν καὶ πάντα τὰ ἐν αὐτοῖς·» (<a href="https://bibleox.com/el/gr-lxx-byz/act/14/#L15">Πραξ 14:15</a>)</p></blockquote><h3>Δεν σώζουν</h3><blockquote><p>«συνάχθητε καὶ ἥκετε, βουλεύσασθε ἅμα, οἱ σῳζόμενοι ἀπὸ τῶν ἐθνῶν. οὐκ ἔγνωσαν οἱ αἴροντες τὸ ξύλον γλύμμα αὐτῶν καὶ <strong>προσευχόμενοι ὡς πρὸς θεούς, οἳ οὐ σῴζουσιν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/is/45/#L20">Ησ 45:20</a>)</p></blockquote>
