  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <h2>Ο Θεός είναι παντοδύναμος</h2><blockquote><p>«ἰδοὺ ἐγὼ στερεῶν βροντὴν καὶ κτίζων πνεῦμα καὶ ἀπαγγέλλων εἰς ἀνθρώπους τὸν χριστὸν αὐτοῦ, ποιῶν ὄρθρον καὶ ὁμίχλην καὶ ἐπιβαίνων ἐπὶ τὰ ὕψη τῆς γῆς· <strong>κύριος ὁ θεὸς ὁ παντοκράτωρ ὄνομα αὐτῷ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/am/4/#L13">Αμ 4:13</a>)</p></blockquote><blockquote><p>«Ἐγώ εἰμι τὸ Ἄλφα καὶ τὸ Ὦ, λέγει κύριος ὁ θεός, ὁ ὢν καὶ ὁ ἦν καὶ ὁ ἐρχόμενος, <strong>ὁ παντοκράτωρ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/1/#L8">Απ 1:8</a>)</p></blockquote><blockquote><p>«Οἶδα ὅτι <strong>πάντα δύνασαι</strong>, <strong>ἀδυνατεῖ δέ σοι οὐθέν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/iov/42/#L2">Ιωβ 42:2</a>)</p></blockquote><blockquote><p>«<strong>ὁ παντοδύναμός σου λόγος</strong> ἀπ᾿ οὐρανῶν ἐκ θρόνων βασιλείων ἀπότομος πολεμιστὴς εἰς μέσον τῆς ὀλεθρίας ἥλατο γῆς ξίφος ὀξὺ τὴν ἀνυπόκριτον ἐπιταγήν σου φέρων» (<a href="https://bibleox.com/el/gr-lxx-byz/prs/18/#L15">Σ.Σολ 18:15</a>)</p></blockquote><blockquote><p>«καὶ φωνὴ τῶν πτερύγων τῶν χερουβιν ἠκούετο ἕως τῆς αὐλῆς τῆς ἐξωτέρας ὡς φωνὴ <strong>θεοῦ Σαδδαι</strong> λαλοῦντος.» (<a href="https://bibleox.com/el/gr-lxx-byz/iez/10/#L5">Ιεζ 10:5</a>)</p></blockquote><blockquote><p>«ἰσχὺν γὰρ ἐνδείκνυσαι ἀπιστούμενος <strong>ἐπὶ δυνάμεως τελειότητι</strong> καὶ ἐν τοῖς εἰδόσι τὸ θράσος ἐξελέγχεις·» (<a href="https://bibleox.com/el/gr-lxx-byz/prs/12/#L17">Σ.Σολ 12:17</a>)</p></blockquote><blockquote><p>«καὶ ἔσομαι ὑμῖν εἰς πατέρα, καὶ ὑμεῖς ἔσεσθέ μοι εἰς υἱοὺς καὶ θυγατέρας, λέγει <strong>κύριος παντοκράτωρ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/2kor/6/#L18">Β Κορ 6:18</a>)</p></blockquote><blockquote><p>«ἐμβλέψας αὐτοῖς ὁ Ἰησοῦς λέγει, Παρὰ ἀνθρώποις ἀδύνατον ἀλλ᾿ οὐ παρὰ θεῷ, <strong>πάντα γὰρ δυνατὰ παρὰ τῷ θεῷ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mk/10/#L27">Μκ 10:27</a>)</p></blockquote><blockquote><p>«καὶ τὰ τέσσαρα ζῷα, ἓν καθ᾿ ἓν αὐτῶν ἔχων ἀνὰ πτέρυγας ἕξ, κυκλόθεν καὶ ἔσωθεν γέμουσιν ὀφθαλμῶν· καὶ ἀνάπαυσιν οὐκ ἔχουσιν ἡμέρας καὶ νυκτὸς λέγοντες, Ἅγιος ἅγιος ἅγιος <strong>κύριος ὁ θεὸς ὁ παντοκράτωρ</strong>, ὁ ἦν καὶ ὁ ὢν καὶ ὁ ἐρχόμενος.» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/4/#L8">Απ 4:8</a>)</p></blockquote><blockquote><p>«ὁ δὲ εἶπεν, <strong>Τὰ ἀδύνατα παρὰ ἀνθρώποις</strong> <strong>δυνατὰ παρὰ τῷ θεῷ ἐστιν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/18/#L27">Λκ 18:27</a>)</p></blockquote><blockquote><p>«λέγοντες, Εὐχαριστοῦμέν σοι, κύριε ὁ θεὸς ὁ παντοκράτωρ, ὁ ὢν καὶ ὁ ἦν, ὅτι <strong>εἴληφας τὴν δύναμίν σου τὴν μεγάλην</strong> καὶ ἐβασίλευσας·» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/11/#L17">Απ 11:17</a>)</p></blockquote><h2>Όπως ο Θεός σκέφτηκε, έτσι θα γίνει</h2><blockquote><p>«τάδε λέγει κύριος σαβαωθ <strong>Ὃν τρόπον εἴρηκα, οὕτως ἔσται, καὶ ὃν τρόπον βεβούλευμαι, οὕτως μενεῖ</strong>, &lt;…&gt; αὕτη ἡ βουλή, ἣν βεβούλευται κύριος ἐπὶ τὴν οἰκουμένην ὅλην, καὶ αὕτη ἡ χεὶρ ἡ ὑψηλὴ ἐπὶ πάντα τὰ ἔθνη τῆς οἰκουμένης. <strong>ἃ γὰρ ὁ θεὸς ὁ ἅγιος βεβούλευται, τίς διασκεδάσει; καὶ τὴν χεῖρα τὴν ὑψηλὴν τίς ἀποστρέψει</strong>;» (<a href="https://bibleox.com/el/gr-lxx-byz/is/14/#L24,26-27">Ησ 14:24,26-27</a>)</p></blockquote>
