  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: '<h2>Ο Θεός σύγχυσε τις γλώσσες στη Βαβυλώνα</h2><p>Το χτίσιμο του πύργου της Βαβυλώνας είναι εικόνα της προσπάθειας να φτάσει κανείς στον ουρανό χωρίς τον Θεό, μόνος του. Αυτό οδήγησε στη σύγχυση των γλωσσών και στην απώλεια της κατανόησης της γλώσσας του άλλου:</p><blockquote><p>«καὶ εἶπαν Δεῦτε οἰκοδομήσωμεν ἑαυτοῖς πόλιν καὶ <strong>πύργον, οὗ ἡ κεφαλὴ ἔσται <mark>ἕως τοῦ οὐρανοῦ</mark></strong>, καὶ ποιήσωμεν ἑαυτοῖς ὄνομα πρὸ τοῦ διασπαρῆναι ἐπὶ προσώπου πάσης τῆς γῆς. καὶ κατέβη κύριος ἰδεῖν τὴν πόλιν καὶ τὸν πύργον, ὃν ᾠκοδόμησαν οἱ υἱοὶ τῶν ἀνθρώπων. καὶ εἶπεν κύριος Ἰδοὺ <strong>γένος ἓν καὶ χεῖλος ἓν πάντων</strong>, καὶ τοῦτο ἤρξαντο ποιῆσαι, καὶ νῦν οὐκ ἐκλείψει ἐξ αὐτῶν πάντα, ὅσα ἂν ἐπιθῶνται ποιεῖν. δεῦτε καὶ καταβάντες <strong><mark>συγχέωμεν ἐκεῖ αὐτῶν τὴν γλῶσσαν, ἵνα μὴ ἀκούσωσιν ἕκαστος τὴν φωνὴν τοῦ πλησίον</mark></strong>. καὶ διέσπειρεν αὐτοὺς κύριος ἐκεῖθεν ἐπὶ πρόσωπον πάσης τῆς γῆς, καὶ ἐπαύσαντο οἰκοδομοῦντες τὴν πόλιν καὶ τὸν πύργον. διὰ τοῦτο ἐκλήθη τὸ ὄνομα αὐτῆς Σύγχυσις, ὅτι <strong>ἐκεῖ συνέχεεν κύριος τὰ χείλη πάσης τῆς γῆς</strong>, καὶ ἐκεῖθεν διέσπειρεν αὐτοὺς κύριος ὁ θεὸς ἐπὶ πρόσωπον πάσης τῆς γῆς.» (<a href="https://bibleox.com/el/gr-lxx-byz/gen/11/#L4-9">Γεν 11:4-9</a>)</p></blockquote><h2>Ο Θεός ξεπέρασε τη σύγχυση των γλωσσών στην Εκκλησία</h2><p>Την ημέρα της ίδρυσης της Εκκλησίας και της καθόδου του Αγίου Πνεύματος, ο Θεός δίνει στους αποστόλους το χάρισμα να καταλαβαίνουν ξένες γλώσσες:</p><blockquote><p>«Καὶ ἐν τῷ συμπληροῦσθαι τὴν ἡμέραν τῆς πεντηκοστῆς ἦσαν πάντες ὁμοῦ ἐπὶ τὸ αὐτό. καὶ ἐγένετο ἄφνω ἐκ τοῦ οὐρανοῦ ἦχος ὥσπερ φερομένης πνοῆς βιαίας καὶ ἐπλήρωσεν ὅλον τὸν οἶκον οὗ ἦσαν καθήμενοι· καὶ ὤφθησαν αὐτοῖς διαμεριζόμεναι γλῶσσαι ὡσεὶ πυρός, καὶ ἐκάθισεν ἐφ᾿ ἕνα ἕκαστον αὐτῶν, καὶ <strong>ἐπλήσθησαν πάντες πνεύματος ἁγίου, καὶ <mark>ἤρξαντο λαλεῖν ἑτέραις γλώσσαις</mark></strong> καθὼς τὸ πνεῦμα ἐδίδου ἀποφθέγγεσθαι αὐτοῖς.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/2/#L1-4">Πραξ 2:1-4</a>)</p></blockquote><h2>Οι άλλες γλώσσες είναι ξένες γλώσσες</h2><p>Όσοι ήρθαν από άλλα μέρη απορούσαν πώς οι Γαλιλαίοι (οι απόστολοι) μπορούν να μιλούν ξένες γλώσσες:</p><blockquote><p>«Ἦσαν δὲ ἐν Ἰερουσαλὴμ κατοικοῦντες Ἰουδαῖοι, ἄνδρες εὐλαβεῖς ἀπὸ παντὸς ἔθνους τῶν ὑπὸ τὸν οὐρανόν· γενομένης δὲ τῆς φωνῆς ταύτης συνῆλθεν τὸ πλῆθος καὶ συνεχύθη, ὅτι <strong><mark>ἤκουον εἷς ἕκαστος τῇ ἰδίᾳ διαλέκτῳ λαλούντων αὐτῶν</mark></strong>. ἐξίσταντο δὲ καὶ ἐθαύμαζον λέγοντες, Οὐχ <strong>ἰδοὺ ἅπαντες οὗτοί εἰσιν οἱ λαλοῦντες Γαλιλαῖοι</strong>; καὶ πῶς ἡμεῖς ἀκούομεν ἕκαστος τῇ ἰδίᾳ διαλέκτῳ ἡμῶν ἐν ᾗ ἐγεννήθημεν; <strong><mark>Πάρθοι</mark></strong> καὶ <strong><mark>Μῆδοι</mark></strong> καὶ <strong><mark>Ἐλαμῖται</mark></strong>, καὶ <strong><mark>οἱ κατοικοῦντες τὴν Μεσοποταμίαν</mark></strong>, <strong><mark>Ἰουδαίαν</mark></strong> τε καὶ <strong><mark>Καππαδοκίαν</mark></strong>, <strong><mark>Πόντον</mark></strong> καὶ τὴν <strong><mark>Ἀσίαν</mark></strong>, <strong><mark>Φρυγίαν</mark></strong> τε καὶ <strong><mark>Παμφυλίαν</mark></strong>, <strong><mark>Αἴγυπτον</mark></strong> καὶ <strong><mark>τὰ μέρη τῆς Λιβύης</mark></strong> τῆς κατὰ Κυρήνην, καὶ οἱ ἐπιδημοῦντες <strong><mark>Ῥωμαῖοι</mark></strong>, Ἰουδαῖοί τε καὶ προσήλυτοι, <strong><mark>Κρῆτες</mark></strong> καὶ <strong><mark>Ἄραβες</mark></strong>, <strong><u><mark>ἀκούομεν λαλούντων αὐτῶν ταῖς ἡμετέραις γλώσσαις</mark></u></strong> τὰ μεγαλεῖα τοῦ θεοῦ. ἐξίσταντο δὲ πάντες καὶ διηπόρουν, ἄλλος πρὸς ἄλλον λέγοντες, Τί θέλει τοῦτο εἶναι;» (<a href="https://bibleox.com/el/gr-lxx-byz/act/2/#L5-12">Πραξ 2:5-12</a>)</p></blockquote><h2>Δεν έχουν όλοι το χάρισμα των γλωσσών</h2><ol><li><p><strong>Δεν</strong> λαμβάνουν όλοι το χάρισμα της γνώσης άλλων γλωσσών.</p></li><li><p>Όσοι λαμβάνουν το χάρισμα των γλωσσών γνωρίζουν <strong>διαφορετικές</strong> γλώσσες.</p></li><li><p>Όλα τα χαρίσματα, μαζί και το χάρισμα των γλωσσών, δίνονται <strong>για το συμφέρον</strong> του έργου.</p></li></ol><blockquote><p>«<strong><mark>Διαιρέσεις δὲ χαρισμάτων</mark></strong> εἰσίν, τὸ δὲ αὐτὸ πνεῦμα· καὶ <strong>διαιρέσεις διακονιῶν</strong> εἰσιν, καὶ ὁ αὐτὸς κύριος· καὶ διαιρέσεις ἐνεργημάτων εἰσίν, ὁ δὲ αὐτὸς θεός, ὁ ἐνεργῶν τὰ πάντα ἐν πᾶσιν. ἑκάστῳ δὲ <strong><mark>δίδοται</mark></strong> ἡ φανέρωσις τοῦ πνεύματος <strong><mark>πρὸς τὸ συμφέρον</mark></strong>.»</p><p>«<strong>ᾧ μὲν</strong> γὰρ διὰ τοῦ πνεύματος δίδοται <strong>λόγος σοφίας</strong>,»</p><p>«<strong>ἄλλῳ δὲ λόγος γνώσεως</strong> κατὰ τὸ αὐτὸ πνεῦμα,»</p><p>«<strong>ἑτέρῳ πίστις</strong> ἐν τῷ αὐτῷ πνεύματι,»</p><p>«<strong>ἄλλῳ δὲ χαρίσματα ἰαμάτων</strong> ἐν τῷ ἑνὶ πνεύματι,»</p><p>«<strong>ἄλλῳ δὲ ἐνεργήματα δυνάμεων</strong>,»</p><p>«<strong>ἄλλῳ [δὲ] προφητεία</strong>,»</p><p>«<strong>ἄλλῳ [δὲ] διακρίσεις πνευμάτων</strong>,»</p><p>«<strong><mark>ἑτέρῳ</mark></strong><mark> </mark><strong><u><mark>γένη</mark></u><mark> γλωσσῶν,</mark></strong>»</p><p>«<strong>ἄλλῳ δὲ ἑρμηνεία γλωσσῶν</strong>·» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/12/#L4-10">Α Κορ 12:4-10</a>)</p></blockquote><blockquote><p>«καὶ οὓς μὲν ἔθετο ὁ θεὸς ἐν τῇ ἐκκλησίᾳ πρῶτον ἀποστόλους, δεύτερον προφήτας, τρίτον διδασκάλους, ἔπειτα δυνάμεις, ἔπειτα χαρίσματα ἰαμάτων, ἀντιλήμψεις, κυβερνήσεις, <strong><u><mark>γένη</mark></u> <mark>γλωσσῶν</mark></strong>.»</p><p>«<strong>μὴ πάντες ἀπόστολοι</strong>;»</p><p>«<strong>μὴ πάντες προφῆται</strong>;»</p><p>«<strong>μὴ πάντες διδάσκαλοι</strong>;»</p><p>«<strong>μὴ πάντες δυνάμεις</strong>;»</p><p>«<strong>μὴ πάντες χαρίσματα ἔχουσιν ἰαμάτων</strong>;»</p><p>«<strong><mark>μὴ πάντες γλώσσαις λαλοῦσιν</mark></strong>;»</p><p>«<strong>μὴ πάντες διερμηνεύουσιν</strong>;»</p><p>«ζηλοῦτε δὲ τὰ χαρίσματα τὰ μείζονα. Καὶ ἔτι καθ᾿ ὑπερβολὴν ὁδὸν ὑμῖν δείκνυμι.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/12/#L28-31">Α Κορ 12:28-31</a>)</p></blockquote><h2>Η γνώση της ελληνικής δεν αρκούσε στον απόστολο για να κηρύξει σε όλους τους ανθρώπους</h2><p>Ο Ρωμαίος χιλίαρχος απορεί που ο απόστολος γνωρίζει ακόμη και την πιο διαδεδομένη γλώσσα — την ελληνική. Δηλαδή, αν και η ελληνική ήταν ευρέως διαδεδομένη (lingua franca), αυτό δεν σημαίνει ότι όλοι την καταλάβαιναν.</p><p>Ο μορφωμένος απόστολος Παύλος, που μαθήτευσε κοντά στον γνωστό και σεβαστό από όλο τον λαό νομοδιδάσκαλο Γαμαλιήλ (<a href="https://bibleox.com/el/gr-lxx-byz/act/22/#L3">Πραξ 22:3</a>), Φαρισαίο και μέλος του Συνεδρίου (<a href="https://bibleox.com/el/gr-lxx-byz/act/5/#L34">Πραξ 5:34</a>), και που παραθέτει Έλληνες φιλοσόφους και συγγραφείς (<a href="https://bibleox.com/el/gr-lxx-byz/act/17/#L28">Πραξ 17:28</a> [1]· <a href="https://bibleox.com/el/gr-lxx-byz/tit/1/#L12">Τιτ 1:12</a> [2]), απευθύνεται στα ελληνικά στον Ρωμαίο χιλίαρχο. Ο χιλίαρχος απορεί που ο απόστολος Παύλος γνωρίζει την ελληνική γλώσσα:</p><blockquote><p>«τότε ἐγγίσας ὁ χιλίαρχος ἐπελάβετο αὐτοῦ καὶ ἐκέλευσεν δεθῆναι ἁλύσεσι δυσί, καὶ ἐπυνθάνετο τίς εἴη καὶ τί ἐστιν πεποιηκώς. &lt;…&gt; Μέλλων τε εἰσάγεσθαι εἰς τὴν παρεμβολὴν ὁ Παῦλος λέγει τῷ χιλιάρχῳ, Εἰ ἔξεστίν μοι εἰπεῖν τι πρὸς σέ; ὁ δὲ ἔφη, <strong><mark>Ἑλληνιστὶ γινώσκεις</mark></strong>;» (<a href="https://bibleox.com/el/gr-lxx-byz/act/21/#L33,37">Πραξ 21:33,37</a>)</p></blockquote><p>Ο Ρωμαίος χιλίαρχος απορεί που ένας Ιουδαίος γνωρίζει την πιο διαδεδομένη γλώσσα της Ρωμαϊκής αυτοκρατορίας. Αυτό μπορεί να προκαλεί απορία μόνο αν <strong>είναι σπάνιο</strong>. Αν η γνώση ακόμη και της ελληνικής σε έναν τόσο μορφωμένο άνθρωπο προκαλεί απορία, τι να πούμε για τη φυσική γνώση της ελληνικής στους υπόλοιπους αποστόλους, πολλοί από τους οποίους ήταν απλοί ψαράδες, άνθρωποι αγράμματοι και απλοί (<a href="https://bibleox.com/el/gr-lxx-byz/act/4/#L13">Πραξ 4:13</a>). Και το πρόβλημα δεν είναι μόνο ότι για το κήρυγμα παντού τη γλώσσα πρέπει να την ξέρει ο κήρυκας (ο απόστολος)· την ελληνική πρέπει να την ξέρει και ο ακροατής.</p><p>Άρα, η γνώση μόνο της ελληνικής δεν αρκεί· γι’ αυτό οι απόστολοι, ως ζωντανοί μάρτυρες της ζωής, της ανάστασης και της διδασκαλίας του Ιησού Χριστού, χρειάζονταν και υπερφυσικά χαρίσματα — ανάμεσά τους και η γνώση γλωσσών — ώστε αυτή η μαρτυρία για τον Χριστό μαζί με την πίστη τους να μεταδοθεί σε όλα τα έθνη.</p><h2>Δεν υπάρχει όφελος, αν κανείς δεν καταλαβαίνει αυτόν που μιλά σε άλλες γλώσσες</h2><blockquote><p>«Νῦν δέ, ἀδελφοί, <strong>ἐὰν ἔλθω</strong> πρὸς ὑμᾶς <strong>γλώσσαις λαλῶν, τί <mark>ὑμᾶς ὠφελήσω</mark>, ἐὰν μὴ ὑμῖν λαλήσω</strong> ἢ ἐν ἀποκαλύψει ἢ ἐν γνώσει ἢ ἐν προφητείᾳ ἢ ἐν διδαχῇ; &lt;…&gt; οὕτως καὶ ὑμεῖς διὰ τῆς γλώσσης ἐὰν μὴ εὔσημον <strong>λόγον</strong> δῶτε, πῶς γνωσθήσεται τὸ λαλούμενον; ἔσεσθε γὰρ <strong>εἰς ἀέρα λαλοῦντες</strong>. τοσαῦτα εἰ τύχοι γένη φωνῶν εἰσιν ἐν κόσμῳ, καὶ <strong>οὐδὲν ἄφωνον</strong>· ἐὰν οὖν μὴ εἰδῶ τὴν δύναμιν τῆς φωνῆς, ἔσομαι τῷ λαλοῦντι βάρβαρος καὶ ὁ λαλῶν ἐν ἐμοὶ βάρβαρος. οὕτως καὶ ὑμεῖς, ἐπεὶ ζηλωταί ἐστε πνευμάτων, <strong>πρὸς τὴν <mark>οἰκοδομὴν</mark> τῆς ἐκκλησίας ζητεῖτε ἵνα <mark>περισσεύητε</mark></strong>. διὸ ὁ λαλῶν γλώσσῃ προσευχέσθω ἵνα <strong>διερμηνεύῃ</strong>. &lt;…&gt; ἐπεὶ ἐὰν εὐλογῇς ἐν πνεύματι, ὁ ἀναπληρῶν τὸν τόπον τοῦ ἰδιώτου πῶς ἐρεῖ τὸ Ἀμήν ἐπὶ τῇ σῇ εὐχαριστίᾳ, ἐπειδὴ τί λέγεις οὐκ οἶδεν; σὺ μὲν γὰρ καλῶς εὐχαριστεῖς, ἀλλ᾿ <strong><mark>ὁ ἕτερος οὐκ οἰκοδομεῖται</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/14/#L6,9-13,16-17">Α Κορ 14:6,9-13,16-17</a>)</p></blockquote><h2>Να μη μιλά κανείς στην Εκκλησία σε άλλες γλώσσες χωρίς διερμηνέα</h2><blockquote><p>«εἴτε γλώσσῃ τις λαλεῖ, κατὰ δύο ἢ τὸ πλεῖστον τρεῖς, καὶ ἀνὰ μέρος, καὶ εἷς διερμηνευέτω· <strong><mark>ἐὰν δὲ μὴ ᾖ διερμηνευτής, σιγάτω ἐν ἐκκλησίᾳ</mark></strong>, ἑαυτῷ δὲ λαλείτω καὶ τῷ θεῷ. &lt;…&gt; οὐ γάρ ἐστιν ἀκαταστασίας ὁ θεὸς ἀλλὰ εἰρήνης. Ὡς ἐν πάσαις ταῖς ἐκκλησίαις τῶν ἁγίων,» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/14/#L27-28,33">Α Κορ 14:27-28,33</a>)</p></blockquote><p>Ταυτόχρονα, έργο των προφητών ήταν το κήρυγμα:</p><blockquote><p>«<strong>Ἰούδας τε καὶ Σίλας, καὶ αὐτοὶ προφῆται ὄντες</strong>, διὰ λόγου πολλοῦ <strong>παρεκάλεσαν</strong> τοὺς ἀδελφοὺς καὶ ἐπεστήριξαν·» (<a href="https://bibleox.com/el/gr-lxx-byz/act/15/#L32">Πραξ 15:32</a>)</p></blockquote><h2>Κάλεσμα να επιδιώκουμε περισσότερο το χάρισμα της προφητείας (του κηρύγματος και της ερμηνείας) παρά τις άλλες γλώσσες</h2><blockquote><p>«Διώκετε τὴν ἀγάπην, <strong>ζηλοῦτε δὲ τὰ πνευματικά, <mark>μᾶλλον δὲ ἵνα προφητεύητε</mark></strong>. ὁ γὰρ λαλῶν γλώσσῃ οὐκ ἀνθρώποις λαλεῖ ἀλλὰ θεῷ, οὐδεὶς γὰρ ἀκούει, πνεύματι δὲ λαλεῖ μυστήρια· ὁ δὲ προφητεύων ἀνθρώποις λαλεῖ <strong>οἰκοδομὴν</strong> καὶ <strong>παράκλησιν</strong> καὶ <strong>παραμυθίαν</strong>. ὁ λαλῶν γλώσσῃ ἑαυτὸν οἰκοδομεῖ· <strong><mark>ὁ δὲ προφητεύων ἐκκλησίαν οἰκοδομεῖ</mark></strong>. θέλω δὲ πάντας ὑμᾶς λαλεῖν γλώσσαις, <strong><mark>μᾶλλον δὲ ἵνα προφητεύητε</mark></strong>· <strong><mark>μείζων δὲ ὁ προφητεύων ἢ ὁ λαλῶν γλώσσαις</mark></strong>, ἐκτὸς εἰ μὴ διερμηνεύῃ, ἵνα ἡ ἐκκλησία οἰκοδομὴν λάβῃ. &lt;…&gt; ὥστε, ἀδελφοί [μου], <strong><mark>ζηλοῦτε τὸ προφητεύειν</mark></strong>, καὶ τὸ λαλεῖν μὴ κωλύετε γλώσσαις·» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/14/#L1-5,39">Α Κορ 14:1-5,39</a>)</p></blockquote><h2>Οι γλώσσες θα παύσουν</h2><blockquote><p>«Ἡ ἀγάπη οὐδέποτε πίπτει. εἴτε δὲ προφητεῖαι, καταργηθήσονται· εἴτε <strong>γλῶσσαι, παύσονται</strong>· εἴτε γνῶσις, καταργηθήσεται.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/13/#L8">Α Κορ 13:8</a>)</p></blockquote><h2>Η αγάπη — το σπουδαιότερο χάρισμα που πρέπει να επιδιώκουμε</h2><blockquote><p>«<strong>Ἐὰν <mark>ταῖς γλώσσαις τῶν ἀνθρώπων λαλῶ</mark></strong> καὶ τῶν ἀγγέλων, <strong><mark>ἀγάπην δὲ μὴ ἔχω</mark></strong>, γέγονα χαλκὸς ἠχῶν ἢ κύμβαλον ἀλαλάζον. καὶ ἐὰν ἔχω προφητείαν καὶ εἰδῶ τὰ μυστήρια πάντα καὶ πᾶσαν τὴν γνῶσιν, κἂν ἔχω πᾶσαν τὴν πίστιν ὥστε ὄρη μεθιστάναι, ἀγάπην δὲ μὴ ἔχω, <strong><mark>οὐθέν εἰμι</mark></strong>. &lt;…&gt; νυνὶ δὲ μένει πίστις, ἐλπίς, ἀγάπη, τὰ τρία ταῦτα· <strong>μείζων δὲ τούτων ἡ ἀγάπη</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/13/#L1-2,13">Α Κορ 13:1-2,13</a>)</p></blockquote><h2>Άλλο πνεύμα, που οι απόστολοι δεν έδιναν</h2><blockquote><p><em>«εἰ μὲν γὰρ ὁ ἐρχόμενος </em><strong><em>ἄλλον Ἰησοῦν</em></strong><em> κηρύσσει ὃν οὐκ ἐκηρύξαμεν, ἢ </em><strong><em><mark>πνεῦμα ἕτερον</mark></em></strong><em> λαμβάνετε </em><strong><em>ὃ οὐκ ἐλάβετε</em></strong><em>, ἢ </em><strong><em>εὐαγγέλιον ἕτερον</em></strong><em> ὃ οὐκ ἐδέξασθε, καλῶς ἀνέχεσθε.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/2kor/11/#L4"><em>Β Κορ 11:4</em></a><em>)</em></p></blockquote><h2>Οι ιεραπόστολοι σήμερα μαθαίνουν γλώσσες</h2><p>Στην αρχαιότητα οι απόστολοι και οι πρώτοι χριστιανοί έλαβαν τα χαρίσματα της γνώσης ξένων γλωσσών από επιτακτική ανάγκη, ώστε η ακόμη πολύ μικρή Εκκλησία να μπορέσει να εξαπλωθεί ευρέως και να κηρύξει σε όλα τα έθνη. Σήμερα όμως οι ιεραπόστολοι αναγκάζονται να μάθουν γλώσσες, δηλαδή να κοπιάσουν. Και γι’ αυτό τώρα υπάρχουν όλα τα μέσα· μπορεί να λείπει μόνο η θέληση.</p><p>Υπάρχουν κοινότητες πιστών στον Χριστό (χαρισματικοί και πεντηκοστιανοί) που μπορεί να ισχυρίζονται ότι έχουν το χάρισμα των γλωσσών και της ερμηνείας τους, αλλά όταν βρίσκονται σε άλλες χώρες, οι ξένοι δεν τους καταλαβαίνουν, και έτσι τέτοιοι ιεραπόστολοι είτε συνεχίζουν να μιλούν στη μητρική τους γλώσσα είτε αναγκάζονται να μάθουν γλώσσες με τα συνηθισμένα μέσα, με εγχειρίδια και δασκάλους.</p><p>Στην εποχή μας αυτό το χάρισμα σχεδόν δεν υπάρχει. Στην Ορθόδοξη Εκκλησία υπάρχει ένας άγιος του 20ού αιώνα — ο όσιος Παΐσιος ο Αγιορείτης — που δεν έμαθε ποτέ άλλες γλώσσες εκτός από τη μητρική (ελληνική) και δεν ισχυρίστηκε ότι έχει χαρίσματα γλωσσών, αλλά όταν τον επισκέπτονταν ξένοι, μπορούσαν να μιλήσουν μαζί του χωρίς διερμηνέα στα γαλλικά, και άλλη φορά στα αγγλικά.</p><h2>Κριτική</h2><h3>Διάφορα ερωτήματα για τα κείμενα από Α΄ Κορ. 14</h3><p>Για το 14ο κεφάλαιο της προς Κορινθίους επιστολής ακούγονται πολλά ερωτήματα, γι’ αυτό έχει νόημα να εξετάσουμε ολόκληρο το κεφάλαιο. Αυτό γίνεται σε χωριστό άρθρο.</p><h3>Οι γλώσσες θα παύσουν μόνο στον μέλλοντα αιώνα;</h3><p>Οι Ορθόδοξοι επισημαίνουν στους πεντηκοστιανούς και χαρισματικούς τα λόγια του αποστόλου Παύλου ότι οι γλώσσες θα παύσουν (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/13/#L8">Α Κορ 13:8</a>), δηλαδή αυτό το χάρισμα θα σταματήσει. Βέβαια, δεν θα εξαφανιστεί εντελώς, γιατί είναι γνωστό ότι πολύ σπάνιοι σύγχρονοι άγιοι στην Ορθοδοξία είχαν το χάρισμα να μιλούν ξένες γλώσσες, αλλά συνολικά δεν θα υπάρχει πια αυτό το μαζικό φαινόμενο που βλέπουμε στους πρώτους χριστιανούς.</p><p>Σε αυτό οι νεοπροτεστάντες πεντηκοστιανοί απαντούν ότι οι γλώσσες θα παύσουν μόνο στον μέλλοντα αιώνα, μετά την έλευση του Χριστού. Ως βάση αυτής της γνώμης μερικοί από αυτούς θεωρούν τα επόμενα λόγια για τον καιρό «<em>όταν… έρθει το τέλειο</em>» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/13/#L10">Α Κορ 13:10</a>).</p><p>Ας δούμε αυτό το κείμενο σε ευρύτερο πλαίσιο:</p><blockquote><p>«<strong>Ἡ ἀγάπη οὐδέποτε πίπτει</strong>. εἴτε δὲ <strong><mark>προφητεῖαι</mark>, καταργηθήσονται· εἴτε <mark>γλῶσσαι</mark>, παύσονται</strong>· εἴτε <strong><mark>γνῶσις</mark>, καταργηθήσεται. <mark>ἐκ μέρους γὰρ γινώσκομεν</mark> καὶ <mark>ἐκ μέρους προφητεύομεν</mark></strong>· <strong><mark>ὅταν δὲ ἔλθῃ τὸ τέλειον, τὸ ἐκ μέρους καταργηθήσεται</mark></strong>. ὅτε ἤμην νήπιος, ἐλάλουν ὡς νήπιος, ἐφρόνουν ὡς νήπιος, ἐλογιζόμην ὡς νήπιος· ὅτε γέγονα ἀνήρ, κατήργηκα τὰ τοῦ νηπίου. <strong>βλέπομεν γὰρ ἄρτι δι᾿ ἐσόπτρου ἐν αἰνίγματι</strong>, τότε δὲ πρόσωπον πρὸς πρόσωπον· <strong><mark>ἄρτι γινώσκω ἐκ μέρους</mark></strong>, τότε δὲ ἐπιγνώσομαι καθὼς καὶ ἐπεγνώσθην. νυνὶ δὲ μένει πίστις, ἐλπίς, ἀγάπη, τὰ τρία ταῦτα· μείζων δὲ τούτων ἡ ἀγάπη.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/13/#L8-13">Α Κορ 13:8-13</a>)</p></blockquote><p>Ο απόστολος είπε ότι, όταν «έρθει το τέλειο», θα σταματήσει αυτό που είναι «εν μέρει». Και τι είναι εν μέρει; <strong>Η γνώση</strong>. Σε αυτή την πρόταση άρχισε να εξηγεί τη δύσκολη έκφρασή του ότι «<strong><em>η γνώση</em></strong><em> θα καταργηθεί</em>». Τώρα πρέπει να μεταδώσει τη σκέψη ότι δεν θα καταργηθεί η ίδια η γνώση (δηλαδή σαν να μην πρόκειται να ξέρουν τίποτα), αλλά αυτή η μερική γνώση που έχουν τώρα θα καταργηθεί και θα υπάρξει πλήρης γνώση. Ακριβώς αυτή τη σκέψη αναπτύσσει παρακάτω.</p><ol><li><p>Λέει ότι τώρα η γνώση <strong>εν μέρει</strong> υπάρχει ήδη, και άλλη γνώση <strong>εν μέρει</strong> αποκαλύπτεται μέσω των προφητειών.</p></li><li><p>Θα έρθει καιρός που θα δοθεί τέλεια γνώση, και όχι «εν μέρει».</p></li><li><p>Τώρα η γνώση λαμβάνεται σαν να βλέπει κανείς μέσα από θαμπό καθρέφτη, αινιγματικά.</p></li></ol><p>Μιλά εδώ για τη γνώση, όχι για το χάρισμα των γλωσσών. Οι χριστιανοί δεν ήξεραν εν μέρει τις ξένες γλώσσες. Αλλιώς δεν θα μπορούσαν να μεταδώσουν πλήρως το Ευαγγέλιο σε άλλα φύλα και έθνη. Είχαν το χάρισμα των γλωσσών σε τελειότητα· ακριβώς γι’ αυτό απορούσαν όσοι ήρθαν την Πεντηκοστή στα Ιεροσόλυμα, που άκουγαν τους αποστόλους να μιλούν στις δικές τους διαλέκτους (<a href="https://bibleox.com/el/gr-lxx-byz/act/2/#L5-12">Πραξ 2:5-12</a>). Αυτό δεν ήταν εν μέρει. Εν μέρει ήταν η γνώση και μόνο αυτή. Ακριβώς για τη γνώση συζητά παρακάτω ο απόστολος.</p><p>Και πότε θα σταματήσει το χάρισμα των γλωσσών; Αυστηρά μιλώντας, εδώ δεν λέγεται. Λέγεται μόνο ότι θα σταματήσει. Και ιδού, ζώντας 20 αιώνες μετά από αυτούς, μπορούμε να κοιτάξουμε πίσω και να δούμε ότι αυτά τα λόγια εκπληρώθηκαν αρκετά σύντομα, όταν το κήρυγμα εξαπλώθηκε πολύ, οι χριστιανοί έγιναν πάρα πολλοί, ώστε στο χάρισμα των γλωσσών δεν υπάρχει τώρα τέτοια επιτακτική ανάγκη. Υπάρχει επιτακτική ανάγκη για την αγάπη, ενώ για το χάρισμα των γλωσσών — όχι. Γι’ αυτό από τότε οι γλώσσες μαθαίνονται.</p><p>Τα λόγια ότι η αγάπη είναι μία, που δεν θα σταματήσει στην αιωνιότητα, δεν δείχνουν ότι αυτό που θα τελειώσει θα τελειώσει στην αιωνιότητα. Όλα τα υπόλοιπα μπορούν να τελειώσουν όποτε θέλουν, και για την αιωνιότητα λέγεται μόνο ότι εκεί δεν θα τελειώσει η αγάπη. Ότι η αγάπη είναι αιώνια και δεν θα σταματήσει ούτε στον μέλλοντα αιώνα, γι’ αυτό δεν μπορεί να υπάρχει συζήτηση.</p><p>Καταλάβαιναν αυτές τις γραμμές της Γραφής όπως τις καταλαβαίνουν οι πεντηκοστιανοί;</p><p>Τον 4ο αιώνα, για παράδειγμα, ο Ιωάννης ο Χρυσόστομος θεωρούσε ότι η κατάργηση του χαρίσματος των γλωσσών αναφερόταν στον παρόντα αιώνα, όχι στον μέλλοντα.</p><p><strong>Ιωάννης ο Χρυσόστομος, άγιος (~347-407)</strong></p><blockquote><p>Όταν έτσι από όλες τις πλευρές και με όλη τη δύναμη έδειξε το μεγαλείο της αγάπης, τότε κάνει το ίδιο και από την άλλη σημαντικότερη πλευρά, εξυψώνει την αξία της με άλλη σύγκριση και λέει: «αν και <strong>οι προφητείες θα παύσουν, και οι γλώσσες θα σωπάσουν». <mark>Αν αυτά τα δύο χαρίσματα στάλθηκαν για την πίστη, τότε με τη διάδοσή της παντού η χρήση τους είναι πια περιττή</mark>. Αλλά η αγάπη προς τον πλησίον δεν θα παύσει, αλλά ακόμη περισσότερο θα αυξάνεται και εδώ και στον μέλλοντα αιώνα</strong>, και τότε ακόμη περισσότερο παρά τώρα. Εδώ πολλά αποδυναμώνουν την αγάπη — τα χρήματα, οι (βιοτικές) μέριμνες, τα σωματικά πάθη, οι ασθένειες της ψυχής· εκεί όμως δεν θα υπάρχει τίποτα τέτοιο. Άλλωστε, στο ότι θα καταργηθούν οι προφητείες και οι γλώσσες δεν υπάρχει τίποτα το παράξενο· αλλά το ότι θα καταργηθεί η γνώση φαίνεται παράξενο, κι εκείνος ακριβώς πρόσθεσε: «και η γνώση θα καταργηθεί». Πώς; Μήπως τότε θα ζούμε στην άγνοια; Όχι, τότε ακριβώς και πρέπει να αυξηθεί η γνώση, όπως είπε: «τότε θα γνωρίσω, όπως και γνωρίστηκα» (Α Κορ 13:12). Γι’ αυτό, για να μη νομίσεις ότι και αυτή θα καταργηθεί όπως οι προφητείες και οι γλώσσες, εκείνος, μετά τα λόγια: «και η γνώση θα καταργηθεί», δεν σταμάτησε, αλλά έδειξε και τον τρόπο της κατάργησης, προσθέτοντας αμέσως: «εκ μέρους γνωρίζουμε, και εκ μέρους προφητεύουμε· όταν δε έρθει το τέλειο, τότε το εκ μέρους θα καταργηθεί» (Α Κορ 13:9-10). Επομένως, δεν θα καταργηθεί η γνώση, αλλά η ατέλεια της γνώσης, γιατί θα γνωρίζουμε όχι μόνο αυτά, αλλά και πολύ περισσότερα.</p></blockquote><p>(Ομιλία 34 στην Α΄ προς Κορινθίους)</p><p>Περισσότερες ρήσεις: ρήσεις αγίων πατέρων για τις άλλες γλώσσες</p><h3>Ανθρώπινες και αγγελικές γλώσσες</h3><p>Όταν δείχνουν στους νεοπροτεστάντες ρήσεις ότι οι άλλες γλώσσες είναι ξένες γλώσσες άλλων λαών, αυτοί συμφωνούν, αλλά σε απάντηση δείχνουν άλλη ρήση, λέγοντας ότι υπάρχει δήθεν και χάρισμα αγγελικών γλωσσών:</p><blockquote><p>«Ἐὰν <strong>ταῖς γλώσσαις τῶν ἀνθρώπων λαλῶ καὶ τῶν <mark>ἀγγέλων</mark></strong>, ἀγάπην δὲ μὴ ἔχω, γέγονα χαλκὸς ἠχῶν ἢ κύμβαλον ἀλαλάζον.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/13/#L1">Α Κορ 13:1</a>)</p></blockquote><p>Αλλά αυτή η γνώμη είναι εσφαλμένη, γιατί οι άγγελοι είναι ασώματα πνεύματα. Δεν έχουν φωνητική συσκευή, γλώσσα, πνεύμονες, φωνητικές χορδές· δεν χρειάζονται ατμόσφαιρα (αέρα) για να επικοινωνήσουν δημιουργώντας και συλλαμβάνοντας ατμοσφαιρικούς κραδασμούς. Έτσι, οποιοιδήποτε ανθρώπινοι ήχοι που παράγονται από φωνητικές χορδές δεν μπορούν να είναι αγγελικές γλώσσες, γιατί οι άγγελοι δεν έχουν φωνητικές χορδές, όπως δεν έχουν ούτε σώμα από σάρκα και οστά (<a href="https://bibleox.com/el/gr-lxx-byz/lk/24/#L39">Λκ 24:39</a>).</p><p>Τι εννοεί τότε ο απόστολος μιλώντας για αγγελικές γλώσσες; Είναι απλώς σχήμα λόγου, υπερβολική ενίσχυση ενός μέρους, για να το ταπεινώσει μετά με το άλλο. Ο απόστολος δείχνει μόνο ότι τα χαρίσματα χωρίς την αγάπη είναι κενός ήχος. Αλλά ενώ οι Κορίνθιοι νόμιζαν ότι το να μιλά κανείς γλώσσες άλλων λαών είναι ήδη κάτι το ξεχωριστό, ο απόστολος αποφάσισε να πάει ακόμη ψηλότερα: ας μπορούσαν να μιλήσουν ακόμη και αγγελικές γλώσσες, αλλά χωρίς αγάπη αυτό δεν θα έφερνε κανένα όφελος.</p><p>Είναι απλώς σχήμα λόγου του αποστόλου. Γι’ αυτό μπορεί κανείς να διαβάσει σχετικά και στον άγιο Ιωάννη τον Χρυσόστομο.</p><p><strong>Ιωάννης ο Χρυσόστομος, άγιος (~347-407)</strong></p><blockquote><p><strong>Μιλώντας για την αγγελική γλώσσα, (ο απόστολος) δεν απέδιδε στους αγγέλους γλώσσα</strong>, αλλά εκφράζει το εξής: ακόμη κι αν μιλήσω όπως συνήθως συνομιλούν οι άγγελοι μεταξύ τους, χωρίς αυτήν (την αγάπη) είμαι τίποτα και μάλιστα βαρύς και ανυπόφορος. Παρόμοια και σε άλλο σημείο, όταν λέει: θα προσκυνήσει Αυτόν <em>«κάθε γόνατο επουρανίων, επιγείων και καταχθονί</em>ων» (Φλπ 2:10), <strong>δεν αποδίδει στους αγγέλους γόνατα και κόκαλα</strong> — μη γένοιτο — αλλά με την ομοιότητα της δικής μας προσκύνησης θέλει να εκφράσει την ένθερμη προσκύνηση των αγγέλων. Έτσι και εδώ μιλά για γλώσσα, εννοώντας όχι σωματικό όργανο, αλλά με τον γνωστό μας τρόπο συνομιλίας εκφράζει τη μεταξύ τους συνδιάλεξη.</p></blockquote><p>(Ομιλίες στην Α΄ προς Κορινθίους, κεφάλαιο 32)</p><p><strong>Μακάριος Θεοδώρητος ο Κύρου (~386-457)</strong></p><blockquote><p><strong>Με τις αγγελικές γλώσσες εννοεί όχι τις αισθητές, αλλά κάποιες νοητές</strong>, με τις οποίες οι άγγελοι υμνολογούν τον Θεό των όλων και συνομιλούν μεταξύ τους. Γιατί ο Ησαΐας τους άκουσε να ψάλλουν, και ο Ιεζεκιήλ, επίσης ο Δανιήλ, ο Ζαχαρίας και ο Μιχαίας τους άκουσαν να συνομιλούν. <strong>Το εξέφρασε</strong> δε αυτό ο θείος Απόστολος <strong>με υπερβολή, με πρόθεση να δείξει την υπεροχή της αγάπης</strong>.</p></blockquote><p>(Ερμηνεία στην Α΄ προς Κορινθίους, κεφ. 13)</p><p>Παρόμοιο σχήμα λόγου χρησιμοποίησε και ο ίδιος ο Χριστός: υπερβολική ενίσχυση ενός μέρους, για να το ταπεινώσει με το άλλο μέρος:</p><blockquote><p>«τί γὰρ ὠφεληθήσεται ἄνθρωπος ἐὰν <strong>τὸν κόσμον ὅλον κερδήσῃ τὴν δὲ ψυχὴν αὐτοῦ ζημιωθῇ</strong>; ἢ τί δώσει ἄνθρωπος ἀντάλλαγμα τῆς ψυχῆς αὐτοῦ;» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/16/#L26">Μτ 16:26</a> · <a href="https://bibleox.com/el/gr-lxx-byz/mk/8/#L36">Μκ 8:36</a>)</p></blockquote><p>Άρα, δεν γίνεται λόγος για χάρισμα ομιλίας σε αγγελική γλώσσα από ανθρώπους, γιατί ο άνθρωπος επικοινωνεί μέσω της σάρκας του, ενώ οι άγγελοι δεν έχουν σάρκα. Αυτή η αναφορά στις αγγελικές γλώσσες είναι απλώς σχήμα λόγου.</p><h3>Μαρτυρία πρώην ποιμένα πεντηκοστιανών</h3><p>Ο πρώην ποιμένας πεντηκοστιανής κοινότητας Παύλος, που αργότερα πέρασε στην Ορθοδοξία, διηγείται σε ένα σύντομο ηχητικό μήνυμα (11 λεπτά) τις εντυπώσεις και την εμπειρία του από τις «άλλες γλώσσες» στον πεντηκοστιανισμό. Συγκρίνει την παλιά εμπειρία με την εμπειρία που απέκτησε στην Ορθοδοξία:</p><p>Ηχητικό αρχείο: <a href="https://disk.yandex.ru/d/hHzrMNPi_lVy2w">https://disk.yandex.ru/d/hHzrMNPi_lVy2w</a></p>'
