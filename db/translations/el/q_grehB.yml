  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <p>Τα τατουάζ και οι τομές στο σώμα απαγορεύονται από τον Θεό:</p><blockquote>«Υἱοί ἐστε κυρίου τοῦ θεοῦ ὑμῶν· οὐ φοιβήσετε, <b>οὐκ ἐπιθήσετε φαλάκρωμα ἀνὰ μέσον τῶν ὀφθαλμῶν ὑμῶν</b> ἐπὶ νεκρῷ·» (<a href="https://bibleox.com/el/gr-lxx-byz/vtor/14/#L1">Δτ 14:1</a>)</blockquote><blockquote>«οὐ ποιήσετε σισόην ἐκ τῆς κόμης τῆς κεφαλῆς ὑμῶν οὐδὲ φθερεῖτε τὴν ὄψιν τοῦ πώγωνος ὑμῶν. καὶ <b>ἐντομίδας ἐπὶ ψυχῇ οὐ ποιήσετε ἐν τῷ σώματι ὑμῶν</b> καὶ <b>γράμματα στικτὰ οὐ ποιήσετε ἐν ὑμῖν</b>· ἐγώ εἰμι κύριος ὁ θεὸς ὑμῶν.» (<a href="https://bibleox.com/el/gr-lxx-byz/lev/19/#L27-28">Λευ 19:27-28</a>)</blockquote><blockquote>«Παρακαλῶ οὖν ὑμᾶς, ἀδελφοί, διὰ τῶν οἰκτιρμῶν τοῦ θεοῦ, <b>παραστῆσαι τὰ σώματα ὑμῶν θυσίαν ζῶσαν ἁγίαν εὐάρεστον τῷ θεῷ</b>, τὴν λογικὴν λατρείαν ὑμῶν· καὶ μὴ συσχηματίζεσθε τῷ αἰῶνι τούτῳ, ἀλλὰ μεταμορφοῦσθε τῇ ἀνακαινώσει τοῦ νοός, εἰς τὸ δοκιμάζειν ὑμᾶς τί τὸ θέλημα τοῦ θεοῦ, τὸ ἀγαθὸν καὶ εὐάρεστον καὶ τέλειον.» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/12/#L1-2">Ρωμ 12:1-2</a>)</blockquote><blockquote>«Καὶ εἶπεν κύριος πρὸς Μωυσῆν λέγων <b>Εἰπὸν τοῖς ἱερεῦσιν τοῖς υἱοῖς Ααρων</b> καὶ ἐρεῖς πρὸς αὐτούς Ἐν ταῖς ψυχαῖς οὐ μιανθήσονται ἐν τῷ ἔθνει αὐτῶν &lt;…&gt; καὶ φαλάκρωμα <b>οὐ ξυρηθήσεσθε τὴν κεφαλὴν ἐπὶ νεκρῷ</b> καὶ τὴν ὄψιν τοῦ πώγωνος οὐ ξυρήσονται καὶ <b>ἐπὶ τὰς σάρκας αὐτῶν οὐ κατατεμοῦσιν ἐντομίδας</b>.» (<a href="https://bibleox.com/el/gr-lxx-byz/lev/21/#L1,5">Λευ 21:1,5</a>)</blockquote>
