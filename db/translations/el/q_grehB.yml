    title: Η ομοφυλοφιλία
    priority: 25
  update: true
  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: |-
    <p>Η ομοφυλοφιλία είναι αμάρτημα και βδέλυγμα ενώπιον του Θεού:</p><blockquote>«καὶ μετὰ ἄρσενος οὐ κοιμηθήσῃ κοίτην γυναικός· βδέλυγμα γάρ ἐστιν.» (<a href="https://bibleox.com/el/gr-lxx-byz/lev/18/#L22">Λευ 18:22</a>)</blockquote><blockquote>«καὶ ὃς ἂν κοιμηθῇ μετὰ ἄρσενος κοίτην γυναικός, βδέλυγμα ἐποίησαν ἀμφότεροι· θανατούσθωσαν, ἔνοχοί εἰσιν.» (<a href="https://bibleox.com/el/gr-lxx-byz/lev/20/#L13">Λευ 20:13</a>)</blockquote>
    Η ομοφυλοφιλία είναι επαίσχυντο πάθος που δέχεται την ανταπόδοση:
    <blockquote>«διὰ τοῦτο παρέδωκεν αὐτοὺς ὁ θεὸς <b>εἰς πάθη ἀτιμίας</b>· <b>αἵ τε γὰρ θήλειαι αὐτῶν μετήλλαξαν τὴν φυσικὴν χρῆσιν εἰς τὴν παρὰ φύσιν, ὁμοίως τε καὶ οἱ ἄρσενες ἀφέντες τὴν φυσικὴν χρῆσιν τῆς θηλείας ἐξεκαύθησαν ἐν τῇ ὀρέξει αὐτῶν εἰς ἀλλήλους, ἄρσενες ἐν ἄρσεσιν τὴν ἀσχημοσύνην κατεργαζόμενοι καὶ τὴν ἀντιμισθίαν ἣν ἔδει τῆς πλάνης αὐτῶν ἐν ἑαυτοῖς ἀπολαμβάνοντες</b>. καὶ καθὼς οὐκ ἐδοκίμασαν τὸν θεὸν ἔχειν ἐν ἐπιγνώσει, παρέδωκεν αὐτοὺς ὁ θεὸς εἰς ἀδόκιμον νοῦν, <b>ποιεῖν τὰ μὴ καθήκοντα</b>, &lt;…&gt; οἵτινες τὸ δικαίωμα τοῦ θεοῦ ἐπιγνόντες, ὅτι <b>οἱ τὰ τοιαῦτα πράσσοντες ἄξιοι θανάτου εἰσίν</b>, οὐ μόνον αὐτὰ ποιοῦσιν ἀλλὰ καὶ <b>συνευδοκοῦσιν τοῖς πράσσουσιν</b>.» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/1/#L26-28,32">Ρωμ 1:26-28,32</a>)</blockquote>
    Η ομοφυλοφιλία είναι θανάσιμο αμάρτημα:
    <blockquote>«ἢ οὐκ οἴδατε ὅτι <b>ἄδικοι θεοῦ βασιλείαν οὐ κληρονομήσουσιν</b>; μὴ πλανᾶσθε· οὔτε πόρνοι οὔτε εἰδωλολάτραι οὔτε μοιχοὶ οὔτε μαλακοὶ οὔτε <b>ἀρσενοκοῖται</b> οὔτε κλέπται οὔτε πλεονέκται, οὐ μέθυσοι, οὐ λοίδοροι, οὐχ ἅρπαγες βασιλείαν θεοῦ κληρονομήσουσιν.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/6/#L9-10">Α Κορ 6:9-10</a>)</blockquote>
    Η ομοφυλοφιλία είναι ανομία, απαγορευμένη από τις εντολές, αντίθετη προς την υγιή διδασκαλία από τον Θεό:
    <blockquote>«εἰδὼς τοῦτο, ὅτι δικαίῳ νόμος οὐ κεῖται, <b>ἀνόμοις δὲ καὶ ἀνυποτάκτοις</b>, ἀσεβέσι καὶ ἁμαρτωλοῖς, ἀνοσίοις καὶ βεβήλοις, πατρολῴαις καὶ μητρολῴαις, ἀνδροφόνοις, πόρνοις, <b>ἀρσενοκοίταις</b>, ἀνδραποδισταῖς, ψεύσταις, ἐπιόρκοις, καὶ εἴ τι ἕτερον <b>τῇ ὑγιαινούσῃ διδασκαλίᾳ ἀντίκειται</b>, κατὰ τὸ εὐαγγέλιον τῆς δόξης τοῦ μακαρίου θεοῦ, ὃ ἐπιστεύθην ἐγώ.» (<a href="https://bibleox.com/el/gr-lxx-byz/1tim/1/#L9-11">Α Τιμ 1:9-11</a>)</blockquote>
    Τα Σόδομα και τα Γόμορρα καταστράφηκαν για το αμάρτημα της ομοφυλοφιλίας:
    <blockquote>«πρὸ τοῦ κοιμηθῆναι καὶ οἱ ἄνδρες τῆς πόλεως <b>οἱ Σοδομῖται</b> περιεκύκλωσαν τὴν οἰκίαν ἀπὸ νεανίσκου ἕως πρεσβυτέρου, ἅπας ὁ λαὸς ἅμα, καὶ ἐξεκαλοῦντο τὸν Λωτ καὶ ἔλεγον πρὸς αὐτόν <b>Ποῦ εἰσιν οἱ ἄνδρες οἱ εἰσελθόντες πρὸς σὲ τὴν νύκτα; ἐξάγαγε αὐτοὺς πρὸς ἡμᾶς, ἵνα συγγενώμεθα αὐτοῖς</b>. ἐξῆλθεν δὲ Λωτ πρὸς αὐτοὺς πρὸς τὸ πρόθυρον, τὴν δὲ θύραν προσέῳξεν ὀπίσω αὐτοῦ. εἶπεν δὲ πρὸς αὐτούς Μηδαμῶς, ἀδελφοί, μὴ πονηρεύσησθε. &lt;…&gt; ἐκτείναντες δὲ οἱ ἄνδρες τὰς χεῖρας εἰσεσπάσαντο τὸν Λωτ πρὸς ἑαυτοὺς εἰς τὸν οἶκον καὶ τὴν θύραν τοῦ οἴκου ἀπέκλεισαν· τοὺς δὲ ἄνδρας τοὺς ὄντας ἐπὶ τῆς θύρας τοῦ οἴκου ἐπάταξαν ἀορασίᾳ ἀπὸ μικροῦ ἕως μεγάλου, καὶ παρελύθησαν ζητοῦντες τὴν θύραν. Εἶπαν δὲ οἱ ἄνδρες πρὸς Λωτ Ἔστιν τίς σοι ὧδε, γαμβροὶ ἢ υἱοὶ ἢ θυγατέρες; ἢ εἴ τίς σοι ἄλλος ἔστιν ἐν τῇ πόλει, ἐξάγαγε ἐκ τοῦ τόπου τούτου· ὅτι <b>ἀπόλλυμεν ἡμεῖς τὸν τόπον τοῦτον, ὅτι ὑψώθη ἡ κραυγὴ αὐτῶν ἐναντίον κυρίου, καὶ ἀπέστειλεν ἡμᾶς κύριος ἐκτρῖψαι αὐτήν</b>.» (<a href="https://bibleox.com/el/gr-lxx-byz/gen/19/#L4-7,10-13">Γεν 19:4-7,10-13</a>)</blockquote><blockquote>«ὡς Σόδομα καὶ Γόμορρα καὶ αἱ περὶ αὐτὰς πόλεις, τὸν ὅμοιον τρόπον τούτοις ἐκπορνεύσασαι καὶ <b>ἀπελθοῦσαι ὀπίσω σαρκὸς ἑτέρας, πρόκεινται δεῖγμα πυρὸς αἰωνίου δίκην ὑπέχουσαι</b>.» (<a href="https://bibleox.com/el/gr-lxx-byz/iud/1/#L7">Ιούδα 1:7</a>)</blockquote>
    Τα έθνη εκδιώχθηκαν από τη γη που υποσχέθηκε ο Θεός στους Εβραίους για τις αμαρτίες της ομοφυλοφιλίας:<blockquote>«πρόσεχε σὺ πάντα, ὅσα ἐγὼ ἐντέλλομαί σοι. ἰδοὺ ἐγὼ <b>ἐκβάλλω πρὸ προσώπου ὑμῶν τὸν Αμορραῖον καὶ Χαναναῖον καὶ Χετταῖον καὶ Φερεζαῖον καὶ Ευαῖον καὶ Γεργεσαῖον καὶ Ιεβουσαῖον</b>·» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/34/#L11">Έξ 34:11</a>)</blockquote><blockquote>«καὶ <b>μετὰ ἄρσενος οὐ κοιμηθήσῃ κοίτην γυναικός</b>· βδέλυγμα γάρ ἐστιν. &lt;…&gt; Μὴ μιαίνεσθε ἐν πᾶσιν τούτοις· <b>ἐν πᾶσι γὰρ τούτοις ἐμιάνθησαν τὰ ἔθνη, ἃ ἐγὼ ἐξαποστέλλω πρὸ προσώπου ὑμῶν</b>» (<a href="https://bibleox.com/el/gr-lxx-byz/lev/18/#L22,24">Λευ 18:22,24</a>)</blockquote><blockquote>«καὶ <b>ὃς ἂν κοιμηθῇ μετὰ ἄρσενος κοίτην γυναικός, βδέλυγμα ἐποίησαν ἀμφότεροι· θανατούσθωσαν, ἔνοχοί εἰσιν</b>. &lt;…&gt; καὶ <b>οὐχὶ πορεύεσθε τοῖς νομίμοις τῶν ἐθνῶν, οὓς ἐξαποστέλλω ἀφ᾿ ὑμῶν· ὅτι ταῦτα πάντα ἐποίησαν, καὶ ἐβδελυξάμην αὐτούς</b>.» (<a href="https://bibleox.com/el/gr-lxx-byz/lev/20/#L13,23">Λευ 20:13,23</a>)</blockquote>
