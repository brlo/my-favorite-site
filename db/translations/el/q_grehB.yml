  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: '<h2>Ορισμός της αίρεσης</h2><p><strong>Αίρεση</strong> (αρχ.-ελλ. αίρεσις — κατεύθυνση, διδασκαλία, σχολή, επιλογή) — μεταγενέστερη χωριστή διδασκαλία που προέκυψε πάνω στις ιδέες μιας προηγούμενης διδασκαλίας, κατά κανόνα σε αντίθεση προς αυτήν. Οι οπαδοί της αίρεσης θεωρούν εσφαλμένη εκείνη τη διδασκαλία από την οποία αποσχίστηκαν, συναντώντας την ίδια αντίδραση ως απάντηση.</p><p>Στο βιβλικό πλαίσιο ως αίρεση θεωρούνταν κάθε σημαντική διαστρέβλωση της διδασκαλίας της πίστης:</p><ul><li><p><strong>φαρισαίοι</strong> — εσφαλμένη διδασκαλία για τη σωτηρία. Ως επί το πλείστον περιόριζαν τη σωτηρία μόνο στην ακριβή τήρηση εξωτερικών διατάξεων;</p></li><li><p><strong>σαδδουκαίοι</strong> — εσφαλμένη διδασκαλία για την πνευματική πραγματικότητα. Αρνούνταν την πνευματική πραγματικότητα: τη ζωή της ψυχής μετά τον θάνατο του σώματος, την ύπαρξη πνευμάτων και αγγέλων, την ανάσταση των νεκρών;</p></li><li><p><strong>η διδασκαλία του Υμεναίου και του Φιλήτου</strong> — εσφαλμένη διδασκαλία για την ανάσταση. Δίδασκαν ότι η ανάσταση έχει ήδη συντελεστεί στο παρελθόν;</p></li><li><p><strong>νικολαΐτες</strong> — εσφαλμένη διδασκαλία για την ηθική ζωή. Επέτρεπαν τη σωματική ακολασία.</p></li></ul><p>Όλες αυτές οι αιρέσεις δεν αγγίζουν άμεσα τη διδασκαλία για τον Θεό, αλλά αφορούν κάποιες άλλες θέσεις της διδασκαλίας της πίστης, και παρ’ όλα αυτά είναι αιρέσεις.</p><h2>Η αίρεση — αμάρτημα που στερεί τη σωτηρία</h2><blockquote><p>«φανερὰ δέ ἐστιν τὰ ἔργα τῆς σαρκός, ἅτινά ἐστιν πορνεία, ἀκαθαρσία, ἀσέλγεια, εἰδωλολατρία, φαρμακεία, ἔχθραι, ἔρις, ζῆλος, θυμοί, ἐριθείαι, διχοστασίαι, <strong><mark>αἱρέσεις</mark></strong>, φθόνοι, μέθαι, κῶμοι, καὶ τὰ ὅμοια τούτοις, ἃ προλέγω ὑμῖν καθὼς προεῖπον ὅτι <strong>οἱ τὰ τοιαῦτα πράσσοντες <mark>βασιλείαν θεοῦ οὐ κληρονομήσουσιν</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/gal/5/#L19-21">Γαλ 5:19-21</a>)</p></blockquote><blockquote><p>«Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, <strong>σκοπεῖν τοὺς τὰς διχοστασίας καὶ τὰ σκάνδαλα</strong> <strong>παρὰ τὴν διδαχὴν ἣν ὑμεῖς ἐμάθετε</strong> ποιοῦντας, καὶ ἐκκλίνετε ἀπ᾿ αὐτῶν· <strong>οἱ γὰρ τοιοῦτοι <mark>τῷ κυρίῳ ἡμῶν Χριστῷ οὐ δουλεύουσιν</mark></strong> ἀλλὰ τῇ ἑαυτῶν κοιλίᾳ, καὶ διὰ τῆς χρηστολογίας καὶ εὐλογίας ἐξαπατῶσιν τὰς καρδίας τῶν ἀκάκων.» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/16/#L17-18">Ρωμ 16:17-18</a>)</p></blockquote><p>Η εσφαλμένη διδασκαλία δεν οδηγεί στον Θεό:</p><blockquote><p><em>«πᾶς </em><strong><em><mark>ὁ προάγων καὶ μὴ μένων ἐν τῇ διδαχῇ τοῦ Χριστοῦ</mark> <mark>θεὸν οὐκ ἔχει</mark></em></strong><em>· ὁ μένων ἐν τῇ διδαχῇ, οὗτος καὶ τὸν πατέρα καὶ τὸν υἱὸν ἔχει.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/2in/1/#L9"><em>Β Ιω 1:9</em></a><em>)</em></p></blockquote><blockquote><p>«<strong>σκολιοὶ γὰρ λογισμοὶ χωρίζουσιν ἀπὸ θεοῦ</strong>, δοκιμαζομένη τε ἡ δύναμις ἐλέγχει τοὺς ἄφρονας.» (<a href="https://bibleox.com/el/gr-lxx-byz/prs/1/#L3">Σ.Σολ 1:3</a>)</p></blockquote><h2>Οι αντίπαλοι του Ιησού Χριστού θεωρούσαν τη διδασκαλία Του ως μία από τις αιρέσεις</h2><p>Οι κατήγοροι των αποστόλων του Χριστού ονομάζουν τη διδασκαλία του Χριστού ναζωραία αίρεση (ο Χριστός μεγάλωσε στη Ναζαρέτ, <a href="https://bibleox.com/el/gr-lxx-byz/in/1/#L45-46">Ιω 1:45-46</a>):</p><blockquote><p>«εὑρόντες γὰρ τὸν ἄνδρα τοῦτον λοιμὸν καὶ κινοῦντα στάσεις πᾶσιν τοῖς Ἰουδαίοις τοῖς κατὰ τὴν οἰκουμένην πρωτοστάτην τε <strong>τῆς τῶν Ναζωραίων αἱρέσεως</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/act/24/#L5">Πραξ 24:5</a>)</p></blockquote><p>Οι απόστολοι επιβεβαιώνουν ότι οι φαρισαίοι και οι σαδδουκαίοι θεωρούν τη διδασκαλία τους αίρεση:</p><blockquote><p>«ὁμολογῶ δὲ τοῦτό σοι ὅτι <strong>κατὰ τὴν ὁδὸν</strong> <strong>ἣν λέγουσιν αἵρεσιν</strong> οὕτως λατρεύω τῷ πατρῴῳ θεῷ, πιστεύων πᾶσι τοῖς κατὰ τὸν νόμον καὶ τοῖς ἐν τοῖς προφήταις γεγραμμένοις» (<a href="https://bibleox.com/el/gr-lxx-byz/act/24/#L14">Πραξ 24:14</a>)</p></blockquote><p>Στο Συνέδριο εξετάζουν τη διδασκαλία του Χριστού ως μία από τις πολλές διδασκαλίες. Ο φαρισαίος Γαμαλιήλ φέρνει παράδειγμα νέων διδασκαλιών:</p><blockquote><p>«ἀναστὰς δέ τις ἐν τῷ συνεδρίῳ <strong>Φαρισαῖος ὀνόματι Γαμαλιήλ, νομοδιδάσκαλος</strong> τίμιος παντὶ τῷ λαῷ, ἐκέλευσεν ἔξω βραχὺ τοὺς ἀνθρώπους ποιῆσαι, εἶπέν τε πρὸς αὐτούς, Ἄνδρες Ἰσραηλῖται, προσέχετε ἑαυτοῖς ἐπὶ τοῖς ἀνθρώποις τούτοις τί μέλλετε πράσσειν. πρὸ γὰρ τούτων τῶν ἡμερῶν ἀνέστη <strong><mark>Θευδᾶς</mark>, λέγων εἶναί τινα ἑαυτόν, ᾧ προσεκλίθη ἀνδρῶν ἀριθμὸς ὡς τετρακοσίων</strong>· ὃς ἀνῃρέθη, καὶ πάντες ὅσοι ἐπείθοντο αὐτῷ διελύθησαν καὶ ἐγένοντο εἰς οὐδέν. μετὰ τοῦτον ἀνέστη <strong><mark>Ἰούδας</mark> ὁ Γαλιλαῖος ἐν ταῖς ἡμέραις τῆς ἀπογραφῆς καὶ ἀπέστησεν λαὸν ὀπίσω αὐτοῦ</strong>· κἀκεῖνος ἀπώλετο, καὶ πάντες ὅσοι ἐπείθοντο αὐτῷ διεσκορπίσθησαν.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/5/#L34-37">Πραξ 5:34-37</a>)</p></blockquote><p>Βλ. επίσης: <a href="https://bibleox.com/el/gr-lxx-byz/lk/23/#L2">Λκ 23:2</a>, <a href="https://bibleox.com/el/gr-lxx-byz/in/7/#L12">Ιω 7:12</a>.</p><h3>Γιατί η διδασκαλία του Χριστού δεν είναι αίρεση;</h3><p>Εν συντομία, επειδή Αυτός είναι Θεός (βλ. τις σχετικές ρήσεις), η Αλήθεια (<a href="https://bibleox.com/el/gr-lxx-byz/in/14/#L6">Ιω 14:6</a>), ο Νομοθέτης («ελέχθη στους αρχαίους: … εγώ όμως σας λέγω…» — <a href="https://bibleox.com/el/gr-lxx-byz/mf/5/#L21-22">Μτ 5:21-22</a>).</p><p>Η διδασκαλία του Χριστού θεωρείται ψευδής και χωριστή μόνο από εκείνους που δεν θεωρούν τον Ιησού Χριστό και Θεό, που δεν πιστεύουν ότι Αυτός είναι εκείνος ο Θεός και Νομοθέτης ο οποίος μίλησε με τον Αβραάμ, τον Ισαάκ και τον Ιακώβ (<a href="https://bibleox.com/el/gr-lxx-byz/ish/3/#L15">Έξ 3:15</a>; <a href="https://bibleox.com/el/gr-lxx-byz/in/8/#L25">Ιω 8:25</a>), ο οποίος έδωσε στον Ισραήλ τον Νόμο (<a href="https://bibleox.com/el/gr-lxx-byz/gal/3/#L19">Γαλ 3:19</a>) και ο οποίος έστειλε στον Ισραήλ προφήτες (<a href="https://bibleox.com/el/gr-lxx-byz/mf/23/#L34">Μτ 23:34</a>). Επειδή ο Ιησούς Χριστός είναι Θεός, ως Νομοθέτης ήρθε και άλλαξε τη διάταξη που ο ίδιος έδωσε, παραδίδοντας τον δικό Του αμπελώνα σε άλλους (<a href="https://bibleox.com/el/gr-lxx-byz/lk/20/#L16">Λκ 20:16</a>; <a href="https://bibleox.com/el/gr-lxx-byz/mk/12/#L9">Μκ 12:9</a>).</p><p>Γι’ αυτό ως αίρεση θεωρούν τη διδασκαλία του Χριστού μόνο εκείνοι που δεν πιστεύουν στον Χριστό, ενώ εκείνοι που πιστεύουν στον Χριστό θεωρούν τη διδασκαλία Του μοναδικά αληθινή (<a href="https://bibleox.com/el/gr-lxx-byz/2in/1/#L9">Β Ιω 1:9</a>; <a href="https://bibleox.com/el/gr-lxx-byz/in/3/#L36">Ιω 3:36</a>). Ωστόσο, ο Χριστός και οι απόστολοι προειδοποίησαν ότι μετά από αυτούς θα εμφανίζονται ψευδείς διδασκαλίες, αλλά πρέπει να φυλάσσουμε εκείνο που παραδόθηκε στην Εκκλησία μια φορά:</p><blockquote><p>«ἐπαγωνίζεσθαι τῇ <strong>ἅπαξ</strong> παραδοθείσῃ τοῖς ἁγίοις πίστει» (<a href="https://bibleox.com/el/gr-lxx-byz/iud/1/#L3">Ιούδα 1:3</a>)</p></blockquote><h3>Κάθε διδασκαλία για τον Ιησού Χριστό είναι αληθινή μόνο και μόνο επειδή μιλά για τον Χριστό;</h3><p>Οι απόστολοι προειδοποιούν ότι άλλοι άνθρωποι μπορούν να κηρύττουν άλλον Ιησού, άλλο Ευαγγέλιο και να μεταδίδουν άλλο πνεύμα:</p><blockquote><p>«<strong>φοβοῦμαι δὲ μή πως</strong>, ὡς ὁ ὄφις ἐξηπάτησεν Εὕαν ἐν τῇ πανουργίᾳ αὐτοῦ, φθαρῇ τὰ νοήματα ὑμῶν ἀπὸ τῆς ἁπλότητος [καὶ τῆς ἁγνότητος] τῆς εἰς τὸν Χριστόν. εἰ μὲν γὰρ <strong>ὁ ἐρχόμενος ἄλλον Ἰησοῦν κηρύσσει</strong> ὃν οὐκ ἐκηρύξαμεν, ἢ <strong>πνεῦμα ἕτερον</strong> λαμβάνετε ὃ οὐκ ἐλάβετε, ἢ <strong>εὐαγγέλιον ἕτερον</strong> ὃ οὐκ ἐδέξασθε, καλῶς ἀνέχεσθε.» (<a href="https://bibleox.com/el/gr-lxx-byz/2kor/11/#L3-4">Β Κορ 11:3-4</a>)</p></blockquote><h2>Προφητείες για τις αιρέσεις</h2><h3>Στον χριστιανισμό θα προκύψουν πολλές αιρέσεις</h3><blockquote><p>«<strong><mark>πολλοὶ</mark> ἐλεύσονται ἐπὶ τῷ ὀνόματί μου</strong> λέγοντες ὅτι Ἐγώ εἰμι, καὶ <strong><mark>πολλοὺς</mark> πλανήσουσιν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mk/13/#L6">Μκ 13:6</a>)</p></blockquote><blockquote><p><em>«καὶ </em><strong><em><mark>πολλοὶ</mark> ψευδοπροφῆται ἐγερθήσονται καὶ πλανήσουσιν <mark>πολλούς</mark></em></strong><em>·» (</em><a href="https://bibleox.com/el/gr-lxx-byz/mf/24/#L11"><em>Μτ 24:11</em></a><em>)</em></p></blockquote><blockquote><p><em>«Ἀγαπητοί, μὴ παντὶ πνεύματι πιστεύετε, ἀλλὰ δοκιμάζετε τὰ πνεύματα εἰ ἐκ τοῦ θεοῦ ἐστιν, ὅτι </em><strong><em><mark>πολλοὶ</mark></em></strong><em> </em><strong><em>ψευδοπροφῆται</em></strong><em> ἐξεληλύθασιν εἰς τὸν κόσμον.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/1in/4/#L1"><em>Α Ιω 4:1</em></a><em>)</em></p></blockquote><p>Υπάρχει επίσης υπόδειξη στη Διδαχή (I-II αιώνας):</p><blockquote><p>«<strong>ἐν γὰρ ταῖς ἐσχάταις ἡμέραις πληθυνθήσονται οἱ ψευδοπροφῆται καὶ οἱ φθορεῖς</strong>, καὶ στραφήσονται τὰ πρόβατα εἰς λύκους, καὶ ἡ ἀγάπη στραφήσεται εἰς μῖσος.» (<a href="https://bibleox.com/grc/grc/w/ΔΙΔΑΧΗ#HH-16">Διδαχή 16:3</a>)</p></blockquote><h3>Οι αιρέσεις θα εξαπλώνονται με μεγάλη δύναμη</h3><blockquote><p><em>«καὶ </em><strong><em><mark>ὁ λόγος αὐτῶν ὡς γάγγραινα νομὴν ἕξει</mark></em></strong><em>· ὧν ἐστιν Ὑμέναιος καὶ Φίλητος, οἵτινες </em><strong><em>περὶ τὴν ἀλήθειαν ἠστόχησαν</em></strong><em>, λέγοντες [τὴν] ἀνάστασιν ἤδη γεγονέναι, καὶ ἀνατρέπουσιν τήν τινων πίστιν.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/2tim/2/#L17-18"><em>Β Τιμ 2:17-18</em></a><em>)</em></p></blockquote><blockquote><p><em>«Ἐγένοντο δὲ καὶ ψευδοπροφῆται ἐν τῷ λαῷ, ὡς καὶ ἐν ὑμῖν ἔσονται ψευδοδιδάσκαλοι, οἵτινες </em><strong><em>παρεισάξουσιν αἱρέσεις ἀπωλείας</em></strong><em>, καὶ τὸν ἀγοράσαντα αὐτοὺς δεσπότην ἀρνούμενοι, ἐπάγοντες ἑαυτοῖς ταχινὴν ἀπώλειαν. καὶ </em><strong><em><mark>πολλοὶ</mark> ἐξακολουθήσουσιν αὐτῶν ταῖς ἀσελγείαις, δι᾿ οὓς ἡ ὁδὸς τῆς ἀληθείας βλασφημηθήσεται</em></strong><em>· καὶ </em><strong><em>ἐν πλεονεξίᾳ</em></strong><em> </em><strong><em>πλαστοῖς λόγοις ὑμᾶς ἐμπορεύσονται</em></strong><em>· οἷς τὸ κρίμα ἔκπαλαι οὐκ ἀργεῖ, καὶ ἡ ἀπώλεια αὐτῶν οὐ νυστάζει.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/2pet/2/#L1-3"><em>Β Πε 2:1-3</em></a><em>)</em></p></blockquote><h3>Κοινότητες αιρετικών θα αποχωρίζονται από την Εκκλησία και την ενότητα της πίστης</h3><blockquote><p><em>«Παιδία, ἐσχάτη ὥρα ἐστίν, καὶ καθὼς ἠκούσατε ὅτι ἀντίχριστος ἔρχεται, καὶ νῦν ἀντίχριστοι πολλοὶ γεγόνασιν· ὅθεν γινώσκομεν ὅτι ἐσχάτη ὥρα ἐστίν. </em><strong><em>ἐξ ἡμῶν ἐξῆλθαν, ἀλλ᾿ οὐκ ἦσαν ἐξ ἡμῶν· <mark>εἰ γὰρ ἐξ ἡμῶν ἦσαν, μεμενήκεισαν ἂν μεθ᾿ ἡμῶν</mark></em></strong><em>· ἀλλ᾿ ἵνα φανερωθῶσιν ὅτι οὐκ εἰσὶν πάντες ἐξ ἡμῶν.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/1in/2/#L18-19"><em>Α Ιω 2:18-19</em></a><em>)</em></p></blockquote><blockquote><p><em>«ὅτι ἔλεγον ὑμῖν, </em><strong><em>Ἐπ᾿ ἐσχάτου [τοῦ] χρόνου</em></strong><em> ἔσονται ἐμπαῖκται κατὰ τὰς ἑαυτῶν ἐπιθυμίας πορευόμενοι τῶν ἀσεβειῶν. </em><strong><em>Οὗτοί εἰσιν <mark>οἱ ἀποδιορίζοντες</mark></em></strong><em>, ψυχικοί, πνεῦμα μὴ ἔχοντες.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/iud/1/#L18-19"><em>Ιούδα 1:18-19</em></a><em>)</em></p></blockquote><h3>Το έργο των ψευδοδιδασκάλων — να αρπάξουν τον πιστό από την Εκκλησία και να τον πάρουν μαζί τους</h3><blockquote><p><em>«ἐγὼ οἶδα ὅτι </em><strong><em>εἰσελεύσονται μετὰ τὴν ἄφιξίν μου λύκοι βαρεῖς εἰς ὑμᾶς μὴ φειδόμενοι τοῦ ποιμνίου, καὶ ἐξ ὑμῶν αὐτῶν ἀναστήσονται ἄνδρες <mark>λαλοῦντες διεστραμμένα</mark> <mark>τοῦ ἀποσπᾶν</mark> τοὺς μαθητὰς <mark>ὀπίσω αὐτῶν</mark></em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/act/20/#L29-30"><em>Πραξ 20:29-30</em></a><em>)</em></p></blockquote><h3>Μέθοδοι των ψευδοδιδασκάλων</h3><h4>Ευχάριστες διδασκαλίες</h4><p>Οι ψευδοδιδάσκαλοι θα επινοούν ευχάριστες διδασκαλίες ακριβώς επειδή οι ακροατές τους θα αναζητούν διδασκαλία ευχάριστη στο αυτί, μη ανεχόμενοι την υγιή διδασκαλία:</p><blockquote><p><em>«ἔσται γὰρ καιρὸς ὅτε </em><strong><em>τῆς ὑγιαινούσης διδασκαλίας οὐκ ἀνέξονται</em></strong><em><mark>,</mark> ἀλλὰ </em><strong><em>κατὰ τὰς ἰδίας ἐπιθυμίας ἑαυτοῖς ἐπισωρεύσουσιν <mark>διδασκάλους</mark></em></strong><em> </em><strong><em><mark>κνηθόμενοι τὴν ἀκοήν</mark></em></strong><em>» (</em><a href="https://bibleox.com/el/gr-lxx-byz/2tim/4/#L3"><em>Β Τιμ 4:3</em></a><em>)</em></p></blockquote><blockquote><p><em>«Τὸ δὲ πνεῦμα ῥητῶς λέγει ὅτι </em><strong><em>ἐν ὑστέροις καιροῖς ἀποστήσονταί τινες τῆς πίστεως, <mark>προσέχοντες πνεύμασιν πλάνοις</mark> καὶ διδασκαλίαις δαιμονίων</em></strong><em>, ἐν ὑποκρίσει ψευδολόγων, κεκαυστηριασμένων τὴν ἰδίαν συνείδησιν» (</em><a href="https://bibleox.com/el/gr-lxx-byz/1tim/4/#L1-2"><em>Α Τιμ 4:1-2</em></a><em>)</em></p></blockquote><h4>Ψευδής ευσέβεια</h4><blockquote><p><em>«Τοῦτο δὲ γίνωσκε, ὅτι </em><strong><em>ἐν ἐσχάταις ἡμέραις</em></strong><em> ἐνστήσονται καιροὶ χαλεποί· ἔσονται γὰρ οἱ ἄνθρωποι φίλαυτοι, φιλάργυροι, ἀλαζόνες, ὑπερήφανοι, βλάσφημοι, γονεῦσιν ἀπειθεῖς, ἀχάριστοι, ἀνόσιοι, &lt;…&gt; </em><strong><em><mark>ἔχοντες μόρφωσιν εὐσεβείας</mark></em></strong><em> τὴν δὲ δύναμιν αὐτῆς ἠρνημένοι· καὶ τούτους ἀποτρέπου. &lt;…&gt; πάντοτε μανθάνοντα καὶ μηδέποτε εἰς ἐπίγνωσιν ἀληθείας ἐλθεῖν δυνάμενα. ὃν τρόπον δὲ Ἰάννης καὶ Ἰαμβρῆς ἀντέστησαν Μωϋσεῖ, οὕτως καὶ οὗτοι </em><strong><em>ἀνθίστανται τῇ ἀληθείᾳ, ἄνθρωποι κατεφθαρμένοι τὸν νοῦν, ἀδόκιμοι περὶ τὴν πίστιν</em></strong><em>·» (</em><a href="https://bibleox.com/el/gr-lxx-byz/2tim/3/#L1-2,5,7-8"><em>Β Τιμ 3:1-2,5,7-8</em></a><em>)</em></p></blockquote><blockquote><p><em>«Προσέχετε ἀπὸ τῶν </em><strong><em>ψευδοπροφητῶν</em></strong><em>, οἵτινες </em><strong><em>ἔρχονται πρὸς ὑμᾶς <mark>ἐν ἐνδύμασιν προβάτων</mark></em></strong><em>, ἔσωθεν δέ εἰσιν λύκοι ἅρπαγες.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/mf/7/#L15"><em>Μτ 7:15</em></a><em>)</em></p></blockquote><h4>Θαύματα</h4><p>Στους αποστόλους και στους αρχαίους χριστιανούς δόθηκαν άφθονες δυνάμεις θαυματουργίας όχι για επίδειξη, αλλά για ωφέλεια:</p><blockquote><p>«ἑκάστῳ δὲ δίδοται ἡ φανέρωσις τοῦ πνεύματος <strong>πρὸς τὸ συμφέρον</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/12/#L7">Α Κορ 12:7</a>)</p></blockquote><p>Μια μικρή ομάδα ψαράδων χρειαζόταν μεγάλη βοήθεια για να φέρει, στη σύντομη ζωή της, το κήρυγμα σε όλο τον κόσμο. Οι απόστολοι προειδοποιούσαν ότι αυτά τα χαρίσματα θα σταματήσουν:</p><blockquote><p>«Ἡ ἀγάπη οὐδέποτε πίπτει. <strong>εἴτε δὲ προφητεῖαι, καταργηθήσονται· εἴτε γλῶσσαι, παύσονται</strong>· εἴτε γνῶσις, καταργηθήσεται.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/13/#L8">Α Κορ 13:8</a>)</p></blockquote><p>Ο ίδιος ο Χριστός καταδίκαζε την αναζήτηση θαυμάτων:</p><blockquote><p>«ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς, <strong>Γενεὰ πονηρὰ καὶ μοιχαλὶς σημεῖον ἐπιζητεῖ</strong>, καὶ σημεῖον οὐ δοθήσεται αὐτῇ εἰ μὴ τὸ σημεῖον Ἰωνᾶ τοῦ προφήτου.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/12/#L39">Μτ 12:39</a>)</p></blockquote><p>Στους έσχατους καιρούς οι ψευδοπροφήτες θα παρασύρουν τους ανθρώπους ακριβώς με θαύματα:</p><blockquote><p>«ἐγερθήσονται γὰρ ψευδόχριστοι καὶ ψευδοπροφῆται, καὶ <strong>δώσουσιν σημεῖα μεγάλα καὶ τέρατα ὥστε πλανῆσαι</strong>, εἰ δυνατόν, καὶ τοὺς ἐκλεκτούς·» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/24/#L24">Μτ 24:24</a> · <a href="https://bibleox.com/el/gr-lxx-byz/mk/13/#L22">Μκ 13:22</a>)</p></blockquote><p>Ως αποτέλεσμα, στη Μέλλουσα Κρίση πολλοί πιστοί θα είναι πεπεισμένοι ότι σώζονται ακριβώς επειδή έκαναν θαύματα στο όνομα του Χριστού, προφήτευαν και έβγαζαν δαιμόνια. Αλλά θα αποδειχτούν εξαπατημένοι, διδαγμένοι στην ανομία· ο Χριστός δεν τους γνωρίζει και τους διώχνει μακριά από τον εαυτό Του:</p><blockquote><p>«πολλοὶ ἐροῦσίν μοι ἐν ἐκείνῃ τῇ ἡμέρᾳ, Κύριε κύριε, οὐ τῷ σῷ ὀνόματι ἐπροφητεύσαμεν, καὶ τῷ σῷ ὀνόματι δαιμόνια ἐξεβάλομεν, καὶ <strong>τῷ σῷ ὀνόματι δυνάμεις πολλὰς ἐποιήσαμεν</strong>; καὶ τότε ὁμολογήσω αὐτοῖς ὅτι <strong>Οὐδέποτε ἔγνων ὑμᾶς</strong>· <strong>ἀποχωρεῖτε ἀπ᾿ ἐμοῦ</strong> οἱ ἐργαζόμενοι τὴν ἀνομίαν.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/7/#L22-23">Μτ 7:22-23</a>)</p></blockquote><h2>Παραδείγματα αιρέσεων κατά τον Α΄ αιώνα</h2><h3>Φαρισαίοι</h3><p>Οι απόστολοι ονόμαζαν τη φαρισαϊκή διδασκαλία αίρεση (χωριστή και εσφαλμένη διδασκαλία):</p><blockquote><p>«ἐξανέστησαν δέ τινες τῶν ἀπὸ <strong>τῆς αἱρέσεως τῶν Φαρισαίων</strong> πεπιστευκότες, λέγοντες ὅτι δεῖ <strong>περιτέμνειν</strong> αὐτοὺς παραγγέλλειν τε <strong>τηρεῖν τὸν νόμον Μωϋσέως</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/15/#L5">Πραξ 15:5</a>)</p></blockquote><p>Οι πιστέψαντες από τους φαρισαίους θεωρούσαν ότι για τη σωτηρία των εθνικών έπρεπε να περιτέμνονται και να τηρούν τον νόμο του Μωυσή.</p><p>Και ο ευαγγελιστής Ματθαίος επισημαίνει τον κίνδυνο της διδασκαλίας των φαρισαίων και των σαδδουκαίων:</p><blockquote><p>«ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς, Ὁρᾶτε καὶ <strong>προσέχετε ἀπὸ τῆς ζύμης τῶν Φαρισαίων καὶ Σαδδουκαίων</strong>. &lt;…&gt; πῶς οὐ νοεῖτε ὅτι οὐ περὶ ἄρτων εἶπον ὑμῖν; προσέχετε δὲ ἀπὸ τῆς ζύμης τῶν Φαρισαίων καὶ Σαδδουκαίων. τότε συνῆκαν ὅτι οὐκ εἶπεν προσέχειν ἀπὸ τῆς ζύμης [τῶν ἄρτων] ἀλλὰ <strong>ἀπὸ τῆς διδαχῆς τῶν Φαρισαίων καὶ Σαδδουκαίων</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/16/#L6,11-12">Μτ 16:6,11-12</a>)</p></blockquote><h3>Σαδδουκαίοι</h3><p>Οι απόστολοι ονόμαζαν τη διδασκαλία των σαδδουκαίων αίρεση (χωριστή και εσφαλμένη διδασκαλία):</p><blockquote><p>«Ἀναστὰς δὲ ὁ ἀρχιερεὺς καὶ πάντες οἱ σὺν αὐτῷ, <strong>ἡ οὖσα αἵρεσις τῶν Σαδδουκαίων</strong>, ἐπλήσθησαν ζήλου» (<a href="https://bibleox.com/el/gr-lxx-byz/act/5/#L17">Πραξ 5:17</a>)</p></blockquote><p>Η διδασκαλία των σαδδουκαίων αρνιόταν την ανάσταση των νεκρών, τη ζωή της ψυχής μετά τον θάνατο και την ύπαρξη αγγέλων και πνευμάτων γενικά:</p><blockquote><p>«Καὶ ἔρχονται <strong>Σαδδουκαῖοι πρὸς αὐτόν, οἵτινες λέγουσιν ἀνάστασιν μὴ εἶναι</strong>, καὶ ἐπηρώτων αὐτὸν λέγοντες, &lt;…&gt; ἔφη αὐτοῖς ὁ Ἰησοῦς, Οὐ διὰ τοῦτο <strong>πλανᾶσθε</strong> μὴ εἰδότες τὰς γραφὰς μηδὲ τὴν δύναμιν τοῦ θεοῦ; &lt;…&gt; <strong>περὶ δὲ τῶν νεκρῶν ὅτι ἐγείρονται οὐκ ἀνέγνωτε ἐν τῇ βίβλῳ Μωϋσέως</strong> ἐπὶ τοῦ βάτου πῶς εἶπεν αὐτῷ ὁ θεὸς λέγων, Ἐγὼ ὁ θεὸς Ἀβραὰμ καὶ [ὁ] θεὸς Ἰσαὰκ καὶ [ὁ] θεὸς Ἰακώβ; οὐκ ἔστιν θεὸς νεκρῶν ἀλλὰ ζώντων· <strong>πολὺ πλανᾶσθε</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mk/12/#L18,24,26-27">Μκ 12:18,24,26-27</a>)</p></blockquote><blockquote><p>«<strong>Σαδδουκαῖοι μὲν γὰρ λέγουσιν μὴ εἶναι ἀνάστασιν μήτε ἄγγελον μήτε πνεῦμα</strong>, Φαρισαῖοι δὲ ὁμολογοῦσιν τὰ ἀμφότερα.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/23/#L8">Πραξ 23:8</a>)</p></blockquote><p>Οι φαρισαίοι διαφωνούσαν με τους σαδδουκαίους:</p><blockquote><p>«Γνοὺς δὲ ὁ Παῦλος ὅτι <strong>τὸ ἓν μέρος ἐστὶν Σαδδουκαίων τὸ δὲ ἕτερον Φαρισαίων</strong> ἔκραζεν ἐν τῷ συνεδρίῳ, Ἄνδρες ἀδελφοί, ἐγὼ Φαρισαῖός εἰμι, υἱὸς Φαρισαίων· περὶ ἐλπίδος καὶ ἀναστάσεως νεκρῶν ἐγὼ κρίνομαι. τοῦτο δὲ αὐτοῦ λαλοῦντος <strong>ἐγένετο στάσις τῶν Φαρισαίων καὶ Σαδδουκαίων, καὶ ἐσχίσθη τὸ πλῆθος</strong>. Σαδδουκαῖοι μὲν γὰρ λέγουσιν μὴ εἶναι ἀνάστασιν μήτε ἄγγελον μήτε πνεῦμα, Φαρισαῖοι δὲ ὁμολογοῦσιν τὰ ἀμφότερα.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/23/#L6-8">Πραξ 23:6-8</a>)</p></blockquote><h3>Η διδασκαλία του Υμεναίου και του Φιλήτου</h3><p>Η διδασκαλία εκείνων που αποστάτησαν από την αλήθεια, του Υμεναίου και του Φιλήτου. Αφού αποστάτησαν, σημαίνει ότι πριν ήταν χριστιανοί. Τώρα διδάσκουν εσφαλμένα για την ανάσταση, πράγμα που προφανώς είναι αίρεση, η οποία θα εξαπλώνεται και από την οποία πρέπει να απομακρυνθούμε:</p><blockquote><p>«τὰς δὲ βεβήλους κενοφωνίας περιΐστασο· ἐπὶ πλεῖον γὰρ προκόψουσιν ἀσεβείας, καὶ <strong>ὁ λόγος αὐτῶν ὡς γάγγραινα νομὴν ἕξει· ὧν ἐστιν Ὑμέναιος καὶ Φίλητος, οἵτινες περὶ τὴν ἀλήθειαν ἠστόχησαν, λέγοντες [τὴν] ἀνάστασιν ἤδη γεγονέναι</strong>, καὶ ἀνατρέπουσιν τήν τινων πίστιν. ὁ μέντοι στερεὸς θεμέλιος τοῦ θεοῦ ἕστηκεν, ἔχων τὴν σφραγῖδα ταύτην· Ἔγνω κύριος τοὺς ὄντας αὐτοῦ, καί, <strong>Ἀποστήτω ἀπὸ ἀδικίας</strong> πᾶς ὁ ὀνομάζων τὸ ὄνομα κυρίου.» (<a href="https://bibleox.com/el/gr-lxx-byz/2tim/2/#L16-19">Β Τιμ 2:16-19</a>)</p></blockquote><h3>Νικολαΐτες</h3><p>Ο Κύριος Ιησούς Χριστός μισεί τη διδασκαλία των νικολαϊτών, δηλαδή προφανώς η διδασκαλία τους είναι αίρεση:</p><blockquote><p>«οὕτως ἔχεις καὶ σὺ κρατοῦντας <strong>τὴν διδαχὴν Νικολαϊτῶν</strong> ὁμοίως.» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/2/#L15">Απ 2:15</a>) — στο βυζαντινό κείμενο λείπει η φράση “ἣν ἐγὼ μισῶ”· η σκέψη συμπληρώνεται στο Απ 2:6.</p></blockquote><blockquote><p>«ἀλλὰ τοῦτο ἔχεις, ὅτι <strong>μισεῖς τὰ ἔργα τῶν Νικολαϊτῶν, ἃ κἀγὼ μισῶ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/2/#L6">Απ 2:6</a>)</p></blockquote><h2>Παραδείγματα αιρέσεων κατά τον Β΄ αιώνα</h2><p>Ο άγιος μάρτυς Ιουστίνος ο Φιλόσοφος (~100-165) γράφει ότι υπάρχουν άνθρωποι οι οποίοι, αν και ονομάζουν εαυτούς χριστιανούς και αναγνωρίζουν τον Ιησού Χριστό ως Κύριο, κηρύττουν διδασκαλίες πνευμάτων της πλάνης, δηλαδή χωριστές ψευδείς διδασκαλίες (αιρέσεις):</p><blockquote><p><em>Υπάρχουν </em><strong><em>άνθρωποι που ονομάζουν εαυτούς χριστιανούς και αναγνωρίζουν τον σταυρωμένο Ιησού ως Κύριο και Χριστό, και μαζί με αυτό κηρύττουν όχι τη διδασκαλία Του, αλλά τα πνεύματα της πλάνης</em></strong><em> &lt;…&gt; με κανέναν από αυτούς δεν κοινωνούμε</em></p></blockquote><p>(Διάλογος προς Τρύφωνα)</p><p>Για τις αναρίθμητες χριστιανικές αιρέσεις γράφει και ο ιερομάρτυς Ειρηναίος ο Λυώνος (~130-202). Γράφει, λόγου χάριν, για τον μαθητή του Ιουστίνου του Φιλοσόφου — τον Τατιανό, ο οποίος πριν από το μαρτύριο του Ιουστίνου δεν δίδασκε αίρεση, και ύστερα επινόησε τη δική του διδασκαλία:</p><blockquote><p>1. Από τους προαναφερθέντες (ψευδοδιδασκάλους) προήλθαν ήδη πολλοί κλάδοι πολλών αιρέσεων, επειδή <strong>πολλοί, ακόμη και όλοι, θέλουν οι ίδιοι να είναι διδάσκαλοι και να απομακρυνθούν από εκείνη την αίρεση την οποία ακολουθούσαν. Συνθέτοντας διδασκαλία από άλλο σύστημα γνωμών και ύστερα πάλι συνθέτοντας τη μία από την άλλη, προσπαθούν να διδάσκουν κάτι νέο, παρουσιάζοντας τους εαυτούς τους ως εφευρέτες της διδασκαλίας που συνέθεσαν</strong>. Έτσι λόγου χάριν: οι λεγόμενοι εγκρατητές, που προήλθαν από τον Σατουρνίνο και τον Μαρκίωνα, <strong>κήρυτταν την αγαμία</strong>, απορρίπτοντας την αρχική δημιουργία του Θεού και έμμεσα κατηγορώντας Εκείνον που δημιούργησε το αρσενικό και το θηλυκό γένος για τη γέννηση των ανθρώπων· και <strong>εισήγαγαν την αποχή από τη χρήση των ζώων</strong>, γινόμενοι αχάριστοι προς τον Θεό που δημιούργησε τα πάντα. <strong>Αρνούνται επίσης τη σωτηρία του πρωτόπλαστου ανθρώπου</strong>· αυτή η γνώμη, άλλωστε, επινοήθηκε σε αυτούς πολύ πρόσφατα. Πρώτος εισήγαγε αυτή τη βλασφημία ο Τατιανός, ο οποίος, όντας ακροατής του Ιουστίνου, όσο βρισκόταν μαζί του δεν έλεγε τίποτα τέτοιο, αλλά μετά το μαρτύριό του αποστάτησε από την Εκκλησία και, παρακινούμενος από τη σκέψη να γίνει διδάσκαλος, ως ανώτερος από τους άλλους, συνέθεσε τον δικό του τρόπο διδασκαλίας. Μυθολογούσε, όμοια με τους βαλεντινιανούς, για κάποιους αόρατους αιώνες, όμοια με τον Μαρκίωνα και τον Σατουρνίνο, κήρυττε τον γάμο φθορά και πορνεία, και ο ίδιος από μόνος του αρνούνταν τη σωτηρία του Αδάμ.</p><p>2. Άλλοι, αντίθετα, ακολουθώντας τον Βασιλείδη και τον Καρποκράτη, εισήγαγαν απαγορευμένη συμβίωση, πολυγαμία και αδιακρισία ως προς τη χρήση των ειδωλοθύτων, λέγοντας ότι ο Θεός δεν δίνει και πολύ σημασία σε αυτό. Αλλά γιατί να συνεχίσουμε; <strong>Είναι αδύνατο να απαριθμήσει κανείς εκείνους που με αυτόν ή με εκείνον τον τρόπο αποστάτησαν από την αλήθεια</strong>.</p></blockquote><p>(Κατά αιρέσεων, κεφ. ΚΗ΄)</p><h2>Η Εκκλησία — μία πίστη, ενότητα και ομοφροσύνη</h2><h3>Στην Εκκλησία υπάρχει μία πίστη</h3><blockquote><p>«ἓν σῶμα καὶ ἓν πνεῦμα, καθὼς καὶ ἐκλήθητε ἐν μιᾷ ἐλπίδι τῆς κλήσεως ὑμῶν· εἷς κύριος, <strong>μία πίστις</strong>, ἓν βάπτισμα·» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/4/#L4-5">Εφ 4:4-5</a>)</p></blockquote><h3>Η εντολή για ομοφροσύνη</h3><blockquote><p><em>«</em><strong><em>τὸ αὐτὸ εἰς ἀλλήλους <mark>φρονοῦντες</mark></em></strong><em>, μὴ τὰ ὑψηλὰ φρονοῦντες ἀλλὰ </em><strong><em>τοῖς ταπεινοῖς συναπαγόμενοι</em></strong><em>. μὴ γίνεσθε φρόνιμοι παρ᾿ ἑαυτοῖς.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/rim/12/#L16"><em>Ρωμ 12:16</em></a><em>)</em></p></blockquote><blockquote><p><em>«Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, διὰ τοῦ ὀνόματος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, </em><strong><em><mark>ἵνα τὸ αὐτὸ λέγητε πάντες</mark></em></strong><em>, καὶ μὴ ᾖ ἐν ὑμῖν σχίσματα, </em><strong><em>ἦτε δὲ κατηρτισμένοι ἐν τῷ αὐτῷ νοῒ καὶ <mark>ἐν τῇ αὐτῇ γνώμῃ</mark></em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/1kor/1/#L10"><em>Α Κορ 1:10</em></a><em>)</em></p></blockquote><p>Περισσότερες ρήσεις για την ομοφροσύνη: <a href="https://bibleox.com/el/el/w/Η_ομοφροσύνη">η ομοφροσύνη</a>.</p><h3>Το θέλημα του Θεού για την ενότητα</h3><p>Ο Κύριος επιθυμεί την ενότητα εκείνων που πιστεύουν σε Αυτόν κατά τον λόγο των αποστόλων</p><blockquote><p>«Οὐ περὶ τούτων δὲ ἐρωτῶ μόνον, ἀλλὰ καὶ <strong>περὶ τῶν πιστευόντων διὰ τοῦ λόγου αὐτῶν εἰς ἐμέ, <mark>ἵνα πάντες ἓν ὦσιν</mark></strong>, καθὼς σύ, πάτερ, ἐν ἐμοὶ κἀγὼ ἐν σοί, ἵνα καὶ αὐτοὶ ἐν ἡμῖν ὦσιν, ἵνα ὁ κόσμος πιστεύῃ ὅτι σύ με ἀπέστειλας.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/17/#L20-21">Ιω 17:20-21</a>)</p></blockquote><h2>Η αναγκαιότητα να αντιστεκόμαστε στις αιρέσεις</h2><blockquote><p>«ἕως θανάτου <strong>ἀγώνισαι περὶ τῆς ἀληθείας</strong>, καὶ κύριος ὁ θεὸς πολεμήσει ὑπὲρ σοῦ.» (<a href="https://bibleox.com/el/gr-lxx-byz/prsir/4/#L28">Σ.Σειρ 4:28</a>)</p></blockquote><blockquote><p>«Ἀγαπητοί, πᾶσαν σπουδὴν ποιούμενος γράφειν ὑμῖν περὶ τῆς κοινῆς ἡμῶν σωτηρίας ἀνάγκην ἔσχον γράψαι ὑμῖν παρακαλῶν <strong>ἐπαγωνίζεσθαι τῇ ἅπαξ παραδοθείσῃ τοῖς ἁγίοις πίστει</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/iud/1/#L3">Ιούδα 1:3</a>)</p></blockquote><blockquote><p>«καὶ μὴ συγκοινωνεῖτε τοῖς ἔργοις τοῖς ἀκάρποις τοῦ σκότους, <strong>μᾶλλον δὲ καὶ ἐλέγχετε</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/5/#L11">Εφ 5:11</a>)</p></blockquote><blockquote><p>«οὓς δὲ σῴζετε ἐκ πυρὸς ἁρπάζοντες, <strong>οὓς δὲ ἐλεᾶτε ἐν φόβῳ</strong>, μισοῦντες καὶ τὸν ἀπὸ τῆς σαρκὸς ἐσπιλωμένον χιτῶνα.» (<a href="https://bibleox.com/el/gr-lxx-byz/iud/1/#L23">Ιούδα 1:23</a>) — στο βυζαντινό κείμενο “ἐλεᾶτε” (ελεείτε), ενώ η συνοδική μετάφραση έχει “ελέγχετε”· η σκέψη του ελέγχου συμπληρώνεται στο Εφ 5:11.</p></blockquote><h2>Ο διάβολος θα πολεμά πάντα την Εκκλησία</h2><blockquote><p>«καὶ εἶπεν κύριος ὁ θεὸς τῷ ὄφει &lt;…&gt; καὶ <strong>ἔχθραν θήσω</strong> ἀνὰ μέσον σου καὶ ἀνὰ μέσον τῆς γυναικὸς καὶ <strong>ἀνὰ μέσον τοῦ σπέρματός σου καὶ ἀνὰ μέσον τοῦ σπέρματος αὐτῆς</strong>· αὐτός σου τηρήσει κεφαλήν, καὶ σὺ τηρήσεις αὐτοῦ πτέρναν.» (<a href="https://bibleox.com/el/gr-lxx-byz/gen/3/#L14-15">Γεν 3:14-15</a>)</p></blockquote><blockquote><p>«Καὶ ὅτε εἶδεν ὁ δράκων ὅτι ἐβλήθη εἰς τὴν γῆν, ἐδίωξεν τὴν γυναῖκα ἥτις ἔτεκεν τὸν ἄρσενα. &lt;…&gt; καὶ <strong>ὠργίσθη ὁ δράκων ἐπὶ τῇ γυναικί, καὶ ἀπῆλθεν ποιῆσαι πόλεμον μετὰ τῶν λοιπῶν τοῦ σπέρματος αὐτῆς</strong>, τῶν τηρούντων τὰς ἐντολὰς τοῦ θεοῦ καὶ ἐχόντων τὴν μαρτυρίαν Ἰησοῦ·» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/12/#L13,17">Απ 12:13,17</a>)</p></blockquote><h2>Κριτική</h2><h3>«Δεν έχετε ζήλο για τα θαύματα»</h3><p>Οι οπαδοί της αίρεσης συχνά προσπαθούν να προσελκύσουν στην κοινότητά τους με θαύματα, θεραπείες και εξορκισμούς. Γι’ αυτό χρησιμοποιούν τις ακόλουθες περικοπές:</p><blockquote><p>«Διώκετε τὴν ἀγάπην, <strong>ζηλοῦτε δὲ τὰ πνευματικά</strong>, μᾶλλον δὲ ἵνα προφητεύητε.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/14/#L1">Α Κορ 14:1</a>)</p></blockquote><p>Με την ίδια περικοπή κατηγορούν την Εκκλησία ότι δεν έχει ζήλο για τα θαύματα, και γι’ αυτό δεν υπάρχει σε αυτή μαζική επίδειξη θαυμάτων.</p><p>Ωστόσο, στους αποστόλους και στους αρχαίους χριστιανούς δόθηκαν άφθονες δυνάμεις θαυματουργίας όχι για επίδειξη, αλλά για ωφέλεια:</p><blockquote><p>«ἑκάστῳ δὲ δίδοται ἡ φανέρωσις τοῦ πνεύματος <strong>πρὸς τὸ συμφέρον</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/12/#L7">Α Κορ 12:7</a>)</p></blockquote><p>Μια μικρή ομάδα ψαράδων χρειαζόταν μεγάλη βοήθεια για να φέρει, στη σύντομη ζωή της, το κήρυγμα σε όλο τον κόσμο. Οι απόστολοι προειδοποιούσαν ότι αυτά τα χαρίσματα θα τελειώσουν:</p><blockquote><p>«Ἡ ἀγάπη οὐδέποτε πίπτει. <strong>εἴτε δὲ προφητεῖαι, καταργηθήσονται· εἴτε γλῶσσαι, παύσονται</strong>· εἴτε γνῶσις, καταργηθήσεται.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/13/#L8">Α Κορ 13:8</a>)</p></blockquote><p>Ο ίδιος ο Χριστός καταδίκαζε την αναζήτηση θαυμάτων:</p><blockquote><p>«ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς, <strong>Γενεὰ πονηρὰ καὶ μοιχαλὶς σημεῖον ἐπιζητεῖ</strong>, καὶ σημεῖον οὐ δοθήσεται αὐτῇ εἰ μὴ τὸ σημεῖον Ἰωνᾶ τοῦ προφήτου.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/12/#L39">Μτ 12:39</a>)</p></blockquote><p>Στους έσχατους καιρούς οι ψευδοπροφήτες θα παρασύρουν τους ανθρώπους ακριβώς με θαύματα:</p><blockquote><p>«ἐγερθήσονται γὰρ ψευδόχριστοι καὶ ψευδοπροφῆται, καὶ <strong>δώσουσιν σημεῖα μεγάλα καὶ τέρατα ὥστε πλανῆσαι</strong>, εἰ δυνατόν, καὶ τοὺς ἐκλεκτούς·» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/24/#L24">Μτ 24:24</a> · <a href="https://bibleox.com/el/gr-lxx-byz/mk/13/#L22">Μκ 13:22</a>)</p></blockquote><p>Ως αποτέλεσμα, στη Μέλλουσα Κρίση πολλοί πιστοί θα είναι πεπεισμένοι ότι σώζονται ακριβώς επειδή έκαναν θαύματα στο όνομα του Χριστού, προφήτευαν και έβγαζαν δαιμόνια. Αλλά θα αποδειχτούν εξαπατημένοι, διδαγμένοι στην ανομία· ο Χριστός δεν τους γνωρίζει και τους διώχνει μακριά από τον εαυτό Του:</p><blockquote><p>«πολλοὶ ἐροῦσίν μοι ἐν ἐκείνῃ τῇ ἡμέρᾳ, Κύριε κύριε, οὐ τῷ σῷ ὀνόματι ἐπροφητεύσαμεν, καὶ τῷ σῷ ὀνόματι δαιμόνια ἐξεβάλομεν, καὶ <strong>τῷ σῷ ὀνόματι δυνάμεις πολλὰς ἐποιήσαμεν</strong>; καὶ τότε ὁμολογήσω αὐτοῖς ὅτι <strong>Οὐδέποτε ἔγνων ὑμᾶς</strong>· <strong>ἀποχωρεῖτε ἀπ᾿ ἐμοῦ</strong> οἱ ἐργαζόμενοι τὴν ἀνομίαν.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/7/#L22-23">Μτ 7:22-23</a>)</p></blockquote><h3>«Δεν έχετε αγάπη»</h3><p>Στις συζητήσεις με οπαδούς κοινοτήτων χωριστών από την Εκκλησία χρησιμοποιείται συχνά μια τέτοια αμυντική αντίδραση όπως η αποφυγή του θέματος, η προσπάθεια να περάσουν στη συζήτηση για το πρόσωπο του αντιπάλου και τις ιδιότητές του. Κατά κανόνα αυτό συμβαίνει μετά από δύσκολες ερωτήσεις. Όσο τακτικοί και ευγενικοί κι αν είστε, μπορούν παρ’ όλα αυτά να σας κατηγορήσουν για:</p><ul><li><p>κατάκριση;</p></li><li><p>υπερηφάνεια;</p></li><li><p>έλλειψη αγάπης.</p></li></ul><p><strong>Στην κατάκριση</strong> — επειδή λέτε ότι στην αίρεση δεν μπορεί κανείς να σωθεί. Ωστόσο, γι’ αυτό μιλά ο απόστολος (<a href="https://bibleox.com/el/gr-lxx-byz/gal/5/#L20">Γαλ 5:20</a>) και οι άγιοι Πατέρες, από τον Α΄ αιώνα (βλ. τις σχετικές ρήσεις). Ο Κύριος έδωσε την εντολή να μην κατακρίνουμε (<a href="https://bibleox.com/el/gr-lxx-byz/lk/6/#L37">Λκ 6:37</a>), αλλά από την άλλη είπε να κρίνουμε με κρίση δίκαιη (<a href="https://bibleox.com/el/gr-lxx-byz/in/7/#L24">Ιω 7:24</a>).</p><p><strong>Στην υπερηφάνεια</strong> — επειδή λέτε ότι η σωτηρία είναι δυνατή μόνο στην Εκκλησία του Χριστού, τη μία, την ορατή και ενιαία. Ωστόσο και γι’ αυτό λέγεται στη Γραφή, ότι ο Χριστός είναι Σωτήρας του σώματος (της Εκκλησίας) (<a href="https://bibleox.com/el/gr-lxx-byz/ef/5/#L23">Εφ 5:23</a>), ότι χωρίς τον Χριστό κανείς δεν σώζεται (βλ. τις σχετικές ρήσεις). Για το ίδιο μιλούν και οι άγιοι Πατέρες (βλ. τις σχετικές ρήσεις).</p><p>Όσον αφορά την <strong>αγάπη</strong>. Αναμφίβολα, οι χριστιανοί πρέπει να είναι πράοι, ταπεινοί, να ενεργούν πάντα από αγάπη. Αλλά ποια μπορεί και πρέπει να είναι η αγάπη; Δεν μπορούμε να κατηγορήσουμε για έλλειψη αγάπης τον Κύριο Ιησού Χριστό και τους αποστόλους. Παράλληλα, να ποιες διδαχές μπορούμε να συναντήσουμε στην Αγία Γραφή:</p><blockquote><p>«Υἱέ, μὴ ὀλιγώρει παιδείας κυρίου μηδὲ ἐκλύου ὑπ᾿ αὐτοῦ ἐλεγχόμενος· <strong>ὃν γὰρ ἀγαπᾷ κύριος <mark>παιδεύει</mark></strong>, μαστιγοῖ δὲ πάντα υἱὸν ὃν παραδέχεται.» (<a href="https://bibleox.com/el/gr-lxx-byz/pr/3/#L11-12">Πρμ 3:11-12</a>)</p></blockquote><blockquote><p>«<strong>ὃν γὰρ ἀγαπᾷ κύριος <mark>παιδεύει</mark></strong>, μαστιγοῖ δὲ πάντα υἱὸν ὃν παραδέχεται.» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/12/#L6">Εβρ 12:6</a>)</p></blockquote><blockquote><p>«ἐγὼ <strong>ὅσους ἐὰν φιλῶ <mark>ἐλέγχω</mark> καὶ παιδεύω</strong>· ζήλευε οὖν καὶ μετανόησον.» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/3/#L19">Απ 3:19</a>)</p></blockquote><blockquote><p>«μακάριος δὲ ἄνθρωπος, ὃν <strong><mark>ἤλεγξεν</mark></strong> ὁ κύριος· <strong>νουθέτημα δὲ παντοκράτορος μὴ ἀπαναίνου</strong>. αὐτὸς γὰρ ἀλγεῖν ποιεῖ καὶ πάλιν ἀποκαθίστησιν· ἔπαισεν, καὶ αἱ χεῖρες αὐτοῦ ἰάσαντο.» (<a href="https://bibleox.com/el/gr-lxx-byz/iov/5/#L17-18">Ιωβ 5:17-18</a>)</p></blockquote><p>Γι’ αυτό είναι ανάγκη να θυμόμαστε ότι, αν κάθε έλεγχο τον θεωρούμε εκδήλωση μίσους, τότε θα κατηγορήσουμε για μίσος τον Θεό και τους αποστόλους, οι οποίοι όχι μόνο οι ίδιοι έλεγχαν το ψέμα, αλλά και καλούσαν σε αυτό:</p><blockquote><p>«καὶ μὴ συγκοινωνεῖτε τοῖς ἔργοις τοῖς ἀκάρποις τοῦ σκότους, μᾶλλον δὲ καὶ <strong><mark>ἐλέγχετε</mark></strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/5/#L11">Εφ 5:11</a>)</p></blockquote><p>Οι προσπάθειες να δειχθεί το ψεύδος μιας ή άλλης διδασκαλίας μπορεί να είναι όχι μόνο εκδήλωση μίσους (κάτι που μερικοί πράγματι μπορεί να κάνουν από υπερηφάνεια και μίσος), αλλά και εκδήλωση αγάπης, φροντίδας για τον πλησίον, επιθυμίας για τη σωτηρία του:</p><blockquote><p>«Ἀδελφοί μου, ἐάν τις ἐν ὑμῖν <strong>πλανηθῇ ἀπὸ τῆς ἀληθείας</strong> καὶ ἐπιστρέψῃ τις αὐτόν, γινώσκετε ὅτι <strong>ὁ ἐπιστρέψας ἁμαρτωλὸν ἐκ πλάνης ὁδοῦ αὐτοῦ σώσει ψυχὴν [αὐτοῦ] ἐκ θανάτου καὶ καλύψει πλῆθος ἁμαρτιῶν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/iak/5/#L19-20">Ιακ 5:19-20</a>)</p></blockquote><p>Πρέπει να προσπαθούμε να μην προσβάλλουμε ποτέ κανέναν, καθώς και να μην αφήνουμε να μεταφέρεται η συζήτηση στη συζήτηση για πρόσωπα, όπου συχνά αρχίζει η αμοιβαία κατάκριση. Πρέπει να μιλάμε για διδασκαλίες, και όχι για τις ιδιότητες των ανθρώπων.</p>'
- src: грех-раскол
  path: Το_σχίσμα
  title: Το σχίσμα
  title_sub:
  meta_desc: Βιβλικές ρήσεις για την αμαρτία του σχίσματος.
  copy_cover: true
  menu:
    parent: Άνθρωπος/Αμαρτία
    title: Το σχίσμα
    priority: 12
  update: true
  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <h2>Το θέλημα του Χριστού και των αποστόλων για την ορατή ενότητα της Εκκλησίας</h2><blockquote><p><em>«Οὐ περὶ τούτων δὲ </em><strong><em><mark>ἐρωτῶ</mark></em></strong><em> μόνον, ἀλλὰ καὶ περὶ τῶν πιστευόντων διὰ τοῦ λόγου αὐτῶν εἰς ἐμέ, </em><strong><em><mark>ἵνα πάντες ἓν ὦσιν</mark></em></strong><em>, καθὼς σύ, πάτερ, ἐν ἐμοὶ κἀγὼ ἐν σοί, </em><strong><em>ἵνα καὶ αὐτοὶ ἐν ἡμῖν ὦσιν, <mark>ἵνα ὁ κόσμος πιστεύῃ ὅτι σύ με</mark> ἀπέστειλας</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/in/17/#L20-21"><em>Ιω 17:20-21</em></a><em>)</em></p></blockquote><blockquote><p>«<strong><mark>Παρακαλῶ</mark></strong> δὲ ὑμᾶς, ἀδελφοί, διὰ τοῦ ὀνόματος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, <strong><mark>ἵνα τὸ αὐτὸ λέγητε πάντες</mark></strong>, <strong><mark>καὶ μὴ ᾖ ἐν ὑμῖν σχίσματα</mark></strong>, <strong>ἦτε δὲ κατηρτισμένοι <mark>ἐν τῷ αὐτῷ νοῒ</mark> καὶ <mark>ἐν τῇ αὐτῇ γνώμῃ</mark></strong>. ἐδηλώθη γάρ μοι περὶ ὑμῶν, ἀδελφοί μου, ὑπὸ τῶν Χλόης <strong>ὅτι ἔριδες ἐν ὑμῖν εἰσιν. λέγω δὲ τοῦτο, ὅτι ἕκαστος ὑμῶν λέγει, Ἐγὼ μέν εἰμι Παύλου, Ἐγὼ δὲ Ἀπολλῶ, Ἐγὼ δὲ Κηφᾶ, Ἐγὼ δὲ Χριστοῦ. μεμέρισται ὁ Χριστός</strong>; μὴ Παῦλος ἐσταυρώθη ὑπὲρ ὑμῶν, ἢ εἰς τὸ ὄνομα Παύλου ἐβαπτίσθητε;» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/1/#L10-13">Α Κορ 1:10-13</a>) «ὅταν γὰρ λέγῃ τις, Ἐγὼ μέν εἰμι Παύλου, ἕτερος δέ, Ἐγὼ Ἀπολλῶ, <strong>οὐκ ἄνθρωποί ἐστε</strong>;» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/3/#L4">Α Κορ 3:4</a>)</p></blockquote><p>Ο Θεός διευθέτησε τα μέλη του σώματος (της Εκκλησίας) έτσι, ώστε να μην υπάρχουν διαιρέσεις, αλλά όλα να φροντίζουν το ένα για το άλλο, να συμπάσχουν και να συγχαίρουν μαζί:</p><blockquote><p>«καὶ γὰρ <strong>ἐν ἑνὶ πνεύματι ἡμεῖς πάντες εἰς ἓν σῶμα ἐβαπτίσθημεν</strong>, εἴτε Ἰουδαῖοι εἴτε Ἕλληνες, εἴτε δοῦλοι εἴτε ἐλεύθεροι, καὶ πάντες ἓν πνεῦμα ἐποτίσθημεν. καὶ γὰρ <strong>τὸ σῶμα οὐκ ἔστιν ἓν μέλος ἀλλὰ πολλά</strong>. &lt;…&gt; <strong><mark>οὐ δύναται δὲ ὁ ὀφθαλμὸς εἰπεῖν τῇ χειρί, Χρείαν σου οὐκ ἔχω, ἢ πάλιν ἡ κεφαλὴ τοῖς ποσίν, Χρείαν ὑμῶν οὐκ ἔχω</mark></strong>· ἀλλὰ πολλῷ μᾶλλον τὰ δοκοῦντα μέλη τοῦ σώματος ἀσθενέστερα ὑπάρχειν ἀναγκαῖά ἐστιν, καὶ ἃ δοκοῦμεν ἀτιμότερα εἶναι τοῦ σώματος, τούτοις τιμὴν περισσοτέραν περιτίθεμεν, καὶ τὰ ἀσχήμονα ἡμῶν εὐσχημοσύνην περισσοτέραν ἔχει, τὰ δὲ εὐσχήμονα ἡμῶν οὐ χρείαν ἔχει. ἀλλὰ <strong><mark>ὁ θεὸς συνεκέρασεν τὸ σῶμα</mark></strong>, τῷ ὑστερουμένῳ περισσοτέραν δοὺς τιμήν, <strong><mark>ἵνα μὴ ᾖ σχίσμα ἐν τῷ σώματι</mark></strong>, ἀλλὰ τὸ αὐτὸ ὑπὲρ ἀλλήλων μεριμνῶσιν τὰ μέλη. καὶ <strong>εἴτε πάσχει ἓν μέλος, συμπάσχει πάντα τὰ μέλη· εἴτε δοξάζεται ἓν μέλος, συγχαίρει πάντα τὰ μέλη</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/12/#L13-14,21-26">Α Κορ 12:13-14,21-26</a>)</p></blockquote><p>Τι είναι αυτά τα διάφορα μέλη του σώματος; — διαφορετικές διακονίες και χαρίσματα στην Εκκλησία:</p><blockquote><p>«Καθάπερ γὰρ <strong>τὸ σῶμα ἕν ἐστιν καὶ μέλη πολλὰ ἔχει, πάντα δὲ τὰ μέλη τοῦ σώματος πολλὰ ὄντα ἕν ἐστιν σῶμα</strong>, οὕτως καὶ ὁ Χριστός· &lt;…&gt; καὶ γὰρ <strong>τὸ σῶμα οὐκ ἔστιν ἓν μέλος ἀλλὰ πολλά</strong>. &lt;…&gt; <strong>Ὑμεῖς δέ ἐστε σῶμα Χριστοῦ καὶ μέλη ἐκ μέρους</strong>. καὶ <strong>οὓς μὲν ἔθετο ὁ θεὸς ἐν τῇ ἐκκλησίᾳ</strong> πρῶτον <strong>ἀποστόλους</strong>, δεύτερον <strong>προφήτας</strong>, τρίτον <strong>διδασκάλους</strong>, <strong>ἔπειτα δυνάμεις</strong>, ἔπειτα <strong>χαρίσματα ἰαμάτων</strong>, ἀντιλήμψεις, κυβερνήσεις, γένη γλωσσῶν. <strong>μὴ πάντες ἀπόστολοι; μὴ πάντες προφῆται; μὴ πάντες διδάσκαλοι; μὴ πάντες δυνάμεις; μὴ πάντες χαρίσματα ἔχουσιν ἰαμάτων</strong>; <strong>μὴ πάντες γλώσσαις λαλοῦσιν</strong>; <strong>μὴ πάντες διερμηνεύουσιν</strong>;» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/12/#L12,14,27-30">Α Κορ 12:12,14,27-30</a>)</p></blockquote><p>Έτσι, όλες αυτές τις διακονίες και τα χαρίσματα ο Θεός τα διευθέτησε έτσι, ώστε να μην υπάρχουν διαιρέσεις στο σώμα, τις οποίες ο απόστολος εμποδίζει στην αρχή της επιστολής (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/1/#L10-13">Α Κορ 1:10-13</a>). Δηλαδή ο Θεός όχι μόνο θέλει την ενότητα (<a href="https://bibleox.com/el/gr-lxx-byz/in/17/#L20-21">Ιω 17:20-21</a>), αλλά και φροντίζει γι’ αυτήν. Να, ο απόστολος έχει τεθεί στη διακονία από τον Θεό και φροντίζει για την ορατή ενότητα, απαγορεύει στους Κορινθίους να δημιουργούν ορατές διαιρέσεις.</p><h2>Το σχίσμα στην Εκκλησία — αμάρτημα που κλείνει στον άνθρωπο τον δρόμο προς τη Βασιλεία του Θεού</h2><blockquote><p>«<em>φανερὰ δέ ἐστιν τὰ ἔργα τῆς σαρκός, ἅτινά ἐστιν πορνεία, ἀκαθαρσία, ἀσέλγεια, εἰδωλολατρία, φαρμακεία, ἔχθραι, ἔρις, ζῆλος, θυμοί, ἐριθείαι,</em> <strong><mark>διχοστασίαι</mark></strong>, αἱρέσεις, <em>φθόνοι, μέθαι, κῶμοι, καὶ τὰ ὅμοια τούτοις, ἃ προλέγω ὑμῖν καθὼς προεῖπον ὅτι οἱ τὰ τοιαῦτα πράσσοντες</em> <strong><em><mark>βασιλείαν θεοῦ οὐ κληρονομήσουσιν.</mark></em></strong>»<mark>*</mark> (<a href="https://bibleox.com/el/gr-lxx-byz/gal/5/#L19-21">Γαλ 5:19-21</a>)</p><p>*<strong><mark>διχοστασίαι</mark> — διαίρεση, διχασμός.</strong></p></blockquote><blockquote><p>«Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, <strong><mark>σκοπεῖν τοὺς τὰς διχοστασίας</mark> καὶ τὰ σκάνδαλα</strong> παρὰ τὴν διδαχὴν ἣν ὑμεῖς ἐμάθετε ποιοῦντας, καὶ ἐκκλίνετε ἀπ᾿ αὐτῶν· <strong><mark>οἱ γὰρ τοιοῦτοι τῷ κυρίῳ ἡμῶν Χριστῷ οὐ δουλεύουσιν</mark></strong> ἀλλὰ τῇ ἑαυτῶν κοιλίᾳ, καὶ διὰ τῆς χρηστολογίας καὶ εὐλογίας ἐξαπατῶσιν τὰς καρδίας τῶν ἀκάκων.» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/16/#L17-18">Ρωμ 16:17-18</a>)</p></blockquote><h2>Προφητεία για τα σχίσματα</h2><blockquote><p><em>«ὅτι ἔλεγον ὑμῖν, </em><strong><em>Ἐπ᾿ ἐσχάτου [τοῦ] χρόνου ἔσονται ἐμπαῖκται</em></strong><em> κατὰ τὰς ἑαυτῶν ἐπιθυμίας πορευόμενοι τῶν ἀσεβειῶν. Οὗτοί εἰσιν </em><strong>οἱ ἀποδιορίζοντες</strong><em>, ψυχικοί, πνεῦμα μὴ ἔχοντες.</em>» (<a href="https://bibleox.com/el/gr-lxx-byz/iud/1/#L18-19">Ιούδα 1:18-19</a>) (χωριζόμενοι ἀπὸ τῆς ἑνότητος τῆς πίστεως)</p></blockquote><blockquote><p>«Παιδία, ἐσχάτη ὥρα ἐστίν, καὶ καθὼς ἠκούσατε ὅτι ἀντίχριστος ἔρχεται, καὶ <strong><mark>νῦν ἀντίχριστοι πολλοὶ γεγόνασιν</mark></strong>· ὅθεν γινώσκομεν ὅτι ἐσχάτη ὥρα ἐστίν. <strong><mark>ἐξ ἡμῶν ἐξῆλθαν, ἀλλ᾿ οὐκ ἦσαν ἐξ ἡμῶν· εἰ γὰρ ἐξ ἡμῶν ἦσαν, μεμενήκεισαν ἂν μεθ᾿ ἡμῶν</mark></strong>· ἀλλ᾿ ἵνα φανερωθῶσιν ὅτι οὐκ εἰσὶν πάντες ἐξ ἡμῶν.» (<a href="https://bibleox.com/el/gr-lxx-byz/1in/2/#L18-19">Α Ιω 2:18-19</a>)</p></blockquote><h2>Παραδείγματα σχισμάτων</h2><blockquote><p>«Ἔγραψά τι τῇ ἐκκλησίᾳ· ἀλλ᾿ ὁ φιλοπρωτεύων αὐτῶν <strong>Διοτρέφης</strong> οὐκ ἐπιδέχεται ἡμᾶς. διὰ τοῦτο, ἐὰν ἔλθω, ὑπομνήσω αὐτοῦ τὰ ἔργα ἃ ποιεῖ, <strong>λόγοις πονηροῖς φλυαρῶν ἡμᾶς· καὶ μὴ ἀρκούμενος ἐπὶ τούτοις οὔτε αὐτὸς ἐπιδέχεται τοὺς ἀδελφοὺς καὶ τοὺς βουλομένους κωλύει καὶ ἐκ τῆς ἐκκλησίας ἐκβάλλει</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/3in/1/#L9-10">Γ Ιω 1:9-10</a>)</p></blockquote><h2>Οι απόστολοι εμπόδιζαν τις απόπειρες διαίρεσης</h2><blockquote><p>«ἐδηλώθη γάρ μοι περὶ ὑμῶν, ἀδελφοί μου, ὑπὸ τῶν Χλόης ὅτι ἔριδες ἐν ὑμῖν εἰσιν. λέγω δὲ τοῦτο, ὅτι ἕκαστος ὑμῶν λέγει, <strong>Ἐγὼ μέν εἰμι Παύλου, Ἐγὼ δὲ Ἀπολλῶ, Ἐγὼ δὲ Κηφᾶ, Ἐγὼ δὲ Χριστοῦ. μεμέρισται ὁ Χριστός</strong>; μὴ Παῦλος ἐσταυρώθη ὑπὲρ ὑμῶν, ἢ εἰς τὸ ὄνομα Παύλου ἐβαπτίσθητε;» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/1/#L11-13">Α Κορ 1:11-13</a>)</p></blockquote><blockquote><p>«<strong>Παρακαλῶ</strong> δὲ ὑμᾶς, ἀδελφοί, διὰ τοῦ ὀνόματος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, <strong>ἵνα τὸ αὐτὸ λέγητε πάντες, καὶ μὴ ᾖ ἐν ὑμῖν σχίσματα</strong>, ἦτε δὲ κατηρτισμένοι ἐν τῷ αὐτῷ νοῒ καὶ ἐν τῇ αὐτῇ γνώμῃ.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/1/#L10">Α Κορ 1:10</a>)</p></blockquote><blockquote><p>«<strong>ἵνα μὴ ᾖ σχίσμα ἐν τῷ σώματι</strong>, ἀλλὰ τὸ αὐτὸ ὑπὲρ ἀλλήλων μεριμνῶσιν τὰ μέλη.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/12/#L25">Α Κορ 12:25</a>)</p></blockquote>
