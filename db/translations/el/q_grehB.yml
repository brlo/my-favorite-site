  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <p><strong>Τρανσβεστισμός</strong> (από το λατ. <em>trans</em> — «μέσω, δια-» και <em>vestitus</em> — «ντυμένος») — επίμονη τάση του ανθρώπου να φορά ρούχα που παραδοσιακά συνδέονται με το αντίθετο φύλο.</p><blockquote><p><em>«Οὐκ ἔσται </em><strong><em>σκεύη ἀνδρὸς ἐπὶ γυναικί, οὐδὲ μὴ ἐνδύσηται ἀνὴρ στολὴν γυναικείαν</em></strong><em>, ὅτι βδέλυγμα κυρίῳ τῷ θεῷ σού ἐστιν πᾶς ποιῶν ταῦτα.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/vtor/22/#L5"><em>Δτ 22:5</em></a><em>)</em></p></blockquote>
- src: родовые-грехи
  path: Το_γονικό_αμάρτημα_δεν_υπάρχει
  title: Το «γονικό αμάρτημα» (δεν υπάρχει)
  title_sub:
  meta_desc:
  copy_cover: true
  menu:
    parent: Άνθρωπος/Αμαρτία
    title: Το «γονικό αμάρτημα» (δεν υπάρχει)
    priority: 500
  update: true
  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: '<p>Γονικά αμαρτήματα δεν υπάρχουν. Αυτή η έννοια επινοήθηκε και χρησιμοποιείται, κατά κανόνα, από τους λεγόμενους «λαϊκούς θεραπευτές», τους μέντιουμ και τους μάγους. Στην Εκκλησία υπάρχει η έννοια του προπατορικού αμαρτήματος, αλλά αυτή είναι άλλη έννοια (βλ. τις σχετικές ρήσεις). Από το προπατορικό αμάρτημα απαλλάσσει πλήρως μόνο το άγιο βάπτισμα της Εκκλησίας, και όχι οι μάγοι και οι μέντιουμ, που υπήρχαν και πριν από τη θεανθρώπινη ενσάρκωση του Κυρίου Ιησού Χριστού, αλλά δεν έκαναν αυτό που έκανε ο Χριστός.</p><p>Ο Θεός ζητά από τον καθένα λογαριασμό για το δικό του αμάρτημα. Ωστόσο, στα παιδιά επιπίπτουν οι συνέπειες και της δίκαιης ζωής των γονέων και της διεφθαρμένης ζωής τους. Αυτό γίνεται παρόμοια με το ότι, αν ο γονέας καταστρέφει την υγεία του (με αλκοόλ, ναρκωτικά), τότε θα βλάψει και την υγεία του παιδιού του, αν και το παιδί δεν φταίει για το ότι οι γονείς κατέστρεφαν την υγεία. Ενώπιον του Θεού το παιδί δεν φέρει ευθύνη για τον αλκοολισμό των γονέων.</p><p>Αυτή η σκέψη μπορεί να γίνει κατανοητή λεπτομερώς από τα ακόλουθα βιβλικά λόγια:</p><blockquote><p>«<strong>τί ὑμῖν ἡ παραβολὴ αὕτη ἐν τοῖς υἱοῖς Ισραηλ λέγοντες Οἱ πατέρες ἔφαγον ὄμφακα, καὶ οἱ ὀδόντες τῶν τέκνων ἐγομφίασαν</strong>; ζῶ ἐγώ, λέγει κύριος, ἐὰν γένηται ἔτι λεγομένη ἡ παραβολὴ αὕτη ἐν τῷ Ισραηλ· ὅτι πᾶσαι αἱ ψυχαὶ ἐμαί εἰσιν· ὃν τρόπον ἡ ψυχὴ τοῦ πατρός, οὕτως καὶ ἡ ψυχὴ τοῦ υἱοῦ, ἐμαί εἰσιν· <strong>ἡ ψυχὴ ἡ ἁμαρτάνουσα, αὕτη ἀποθανεῖται. — <mark>ὁ δὲ ἄνθρωπος, ὃς ἔσται δίκαιος, ὁ ποιῶν κρίμα καὶ δικαιοσύνην</mark></strong>, ἐπὶ τῶν ὀρέων οὐ φάγεται καὶ τοὺς ὀφθαλμοὺς αὐτοῦ οὐ μὴ ἐπάρῃ πρὸς τὰ ἐνθυμήματα οἴκου Ισραηλ καὶ τὴν γυναῖκα τοῦ πλησίον αὐτοῦ οὐ μὴ μιάνῃ καὶ πρὸς γυναῖκα ἐν ἀφέδρῳ οὖσαν οὐ προσεγγιεῖ καὶ ἄνθρωπον οὐ μὴ καταδυναστεύσῃ, ἐνεχυρασμὸν ὀφείλοντος ἀποδώσει καὶ ἅρπαγμα οὐχ ἁρπᾶται, τὸν ἄρτον αὐτοῦ τῷ πεινῶντι δώσει καὶ γυμνὸν περιβαλεῖ καὶ τὸ ἀργύριον αὐτοῦ ἐπὶ τόκῳ οὐ δώσει καὶ πλεονασμὸν οὐ λήμψεται καὶ ἐξ ἀδικίας ἀποστρέψει τὴν χεῖρα αὐτοῦ, κρίμα δίκαιον ποιήσει ἀνὰ μέσον ἀνδρὸς καὶ ἀνὰ μέσον τοῦ πλησίον αὐτοῦ καὶ <strong><mark>τοῖς προστάγμασίν μου πεπόρευται καὶ τὰ δικαιώματά μου πεφύλακται τοῦ ποιῆσαι αὐτά, δίκαιος οὗτός ἐστιν, ζωῇ ζήσεται, λέγει κύριος</mark></strong>. — <strong><mark>καὶ ἐὰν γεννήσῃ υἱὸν λοιμὸν ἐκχέοντα αἷμα</mark></strong> καὶ ποιοῦντα ἁμαρτήματα, ἐν τῇ ὁδῷ τοῦ πατρὸς αὐτοῦ τοῦ δικαίου οὐκ ἐπορεύθη, ἀλλὰ καὶ ἐπὶ τῶν ὀρέων ἔφαγεν καὶ τὴν γυναῖκα τοῦ πλησίον αὐτοῦ ἐμίανεν καὶ πτωχὸν καὶ πένητα κατεδυνάστευσεν καὶ ἅρπαγμα ἥρπασεν καὶ ἐνεχυρασμὸν οὐκ ἀπέδωκεν καὶ εἰς τὰ εἴδωλα ἔθετο τοὺς ὀφθαλμοὺς αὐτοῦ, ἀνομίαν πεποίηκεν, μετὰ τόκου ἔδωκε καὶ πλεονασμὸν ἔλαβεν, <strong><mark>οὗτος ζωῇ οὐ ζήσεται</mark></strong>, πάσας τὰς ἀνομίας ταύτας ἐποίησεν, <strong><mark>θανάτῳ θανατωθήσεται, τὸ αἷμα αὐτοῦ ἐπ᾿ αὐτὸν ἔσται</mark></strong>. — <strong><mark>ἐὰν δὲ γεννήσῃ υἱόν, καὶ ἴδῃ πάσας τὰς ἁμαρτίας τοῦ πατρὸς αὐτοῦ, ἃς ἐποίησεν, καὶ φοβηθῇ καὶ μὴ ποιήσῃ κατὰ ταύτας</mark></strong>, ἐπὶ τῶν ὀρέων οὐ βέβρωκεν καὶ τοὺς ὀφθαλμοὺς αὐτοῦ οὐκ ἔθετο εἰς τὰ ἐνθυμήματα οἴκου Ισραηλ καὶ τὴν γυναῖκα τοῦ πλησίον αὐτοῦ οὐκ ἐμίανεν καὶ ἄνθρωπον οὐ κατεδυνάστευσεν καὶ ἐνεχυρασμὸν οὐκ ἐνεχύρασεν καὶ ἅρπαγμα οὐχ ἥρπασεν, τὸν ἄρτον αὐτοῦ τῷ πεινῶντι ἔδωκεν καὶ γυμνὸν περιέβαλεν καὶ ἀπ᾿ ἀδικίας ἀπέστρεψε τὴν χεῖρα αὐτοῦ, τόκον οὐδὲ πλεονασμὸν οὐκ ἔλαβεν, δικαιοσύνην ἐποίησεν καὶ <strong><mark>ἐν τοῖς προστάγμασίν μου ἐπορεύθη, οὐ τελευτήσει ἐν ἀδικίαις πατρὸς αὐτοῦ, ζωῇ ζήσεται</mark></strong>. <strong><mark>ὁ δὲ πατὴρ αὐτοῦ ἐὰν θλίψει θλίψῃ</mark></strong> καὶ ἁρπάσῃ ἅρπαγμα, ἐναντία ἐποίησεν ἐν μέσῳ τοῦ λαοῦ μου καὶ <strong><mark>ἀποθανεῖται ἐν τῇ ἀδικίᾳ αὐτοῦ</mark></strong>. — <strong><mark>καὶ ἐρεῖτε Τί ὅτι οὐκ ἔλαβεν τὴν ἀδικίαν ὁ υἱὸς τοῦ πατρὸς αὐτοῦ; ὅτι ὁ υἱὸς δικαιοσύνην καὶ ἔλεος ἐποίησεν, πάντα τὰ νόμιμά μου συνετήρησεν καὶ ἐποίησεν αὐτά· ζωῇ ζήσεται. ἡ δὲ ψυχὴ ἡ ἁμαρτάνουσα ἀποθανεῖται· ὁ δὲ υἱὸς οὐ λήμψεται τὴν ἀδικίαν τοῦ πατρὸς αὐτοῦ, οὐδὲ ὁ πατὴρ λήμψεται τὴν ἀδικίαν τοῦ υἱοῦ αὐτοῦ· δικαιοσύνη δικαίου ἐπ᾿ αὐτὸν ἔσται</mark></strong>, καὶ ἀνομία ἀνόμου ἐπ᾿ αὐτὸν ἔσται. <strong><mark>καὶ ὁ ἄνομος ἐὰν ἀποστρέψῃ ἐκ πασῶν τῶν ἀνομιῶν αὐτοῦ, ὧν ἐποίησεν, καὶ φυλάξηται πάσας τὰς ἐντολάς μου καὶ ποιήσῃ δικαιοσύνην καὶ ἔλεος, ζωῇ ζήσεται</mark></strong>, οὐ μὴ ἀποθάνῃ. πάντα τὰ παραπτώματα αὐτοῦ, ὅσα ἐποίησεν, οὐ μνησθήσεται· ἐν τῇ δικαιοσύνῃ αὐτοῦ, ᾗ ἐποίησεν, ζήσεται. μὴ θελήσει θελήσω τὸν θάνατον τοῦ ἀνόμου, λέγει κύριος, ὡς τὸ ἀποστρέψαι αὐτὸν ἐκ τῆς ὁδοῦ τῆς πονηρᾶς καὶ ζῆν αὐτόν; <strong><mark>ἐν δὲ τῷ ἀποστρέψαι δίκαιον ἐκ τῆς δικαιοσύνης αὐτοῦ καὶ ποιήσῃ ἀδικίαν κατὰ πάσας τὰς ἀνομίας, ἃς ἐποίησεν ὁ ἄνομος, πᾶσαι αἱ δικαιοσύναι αὐτοῦ, ἃς ἐποίησεν, οὐ μὴ μνησθῶσιν· ἐν τῷ παραπτώματι αὐτοῦ, ᾧ παρέπεσεν, καὶ ἐν ταῖς ἁμαρτίαις αὐτοῦ, αἷς ἥμαρτεν, ἐν αὐταῖς ἀποθανεῖται</mark></strong>. — καὶ εἴπατε Οὐ κατευθύνει ἡ ὁδὸς κυρίου. ἀκούσατε δή, πᾶς οἶκος Ισραηλ· μὴ ἡ ὁδός μου οὐ κατευθύνει; οὐχὶ ἡ ὁδὸς ὑμῶν οὐ κατευθύνει; ἐν τῷ ἀποστρέψαι τὸν δίκαιον ἐκ τῆς δικαιοσύνης αὐτοῦ καὶ ποιήσῃ παράπτωμα καὶ ἀποθάνῃ, ἐν τῷ παραπτώματι, ᾧ ἐποίησεν, ἐν αὐτῷ ἀποθανεῖται. καὶ ἐν τῷ ἀποστρέψαι ἄνομον ἀπὸ τῆς ἀνομίας αὐτοῦ, ἧς ἐποίησεν, καὶ ποιήσῃ κρίμα καὶ δικαιοσύνην, οὗτος τὴν ψυχὴν αὐτοῦ ἐφύλαξεν καὶ ἀπέστρεψεν ἐκ πασῶν τῶν ἀσεβειῶν αὐτοῦ, ὧν ἐποίησεν, ζωῇ ζήσεται, οὐ μὴ ἀποθάνῃ. καὶ λέγουσιν ὁ οἶκος τοῦ Ισραηλ Οὐ κατορθοῖ ἡ ὁδὸς κυρίου. μὴ ἡ ὁδός μου οὐ κατορθοῖ, οἶκος Ισραηλ; οὐχὶ ἡ ὁδὸς ὑμῶν οὐ κατορθοῖ; ἕκαστον κατὰ τὴν ὁδὸν αὐτοῦ κρινῶ ὑμᾶς, οἶκος Ισραηλ, λέγει κύριος· ἐπιστράφητε καὶ ἀποστρέψατε ἐκ πασῶν τῶν ἀσεβειῶν ὑμῶν, καὶ οὐκ ἔσονται ὑμῖν εἰς κόλασιν ἀδικίας.» (<a href="https://bibleox.com/el/gr-lxx-byz/iez/18/#L2-30">Ιεζ 18:2-30</a>)</p></blockquote><p>Αλλά στους ανθρώπους συχνά προκύπτει η σκέψη ότι η ενοχή για τις αμαρτίες των γονέων μεταδίδεται στα παιδιά. Αυτή η σκέψη προκύπτει μετά την ανάγνωση του ακόλουθου βιβλικού στίχου:</p><blockquote><p>«ἐγὼ γάρ εἰμι κύριος ὁ θεός σου, θεὸς ζηλωτὴς <strong>ἀποδιδοὺς ἁμαρτίας πατέρων ἐπὶ τέκνα ἕως τρίτης καὶ τετάρτης γενεᾶς <u>τοῖς μισοῦσίν με</u></strong> καὶ ποιῶν ἔλεος εἰς χιλιάδας τοῖς ἀγαπῶσίν με καὶ τοῖς φυλάσσουσιν τὰ προστάγματά μου.» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/20/#L5-6">Έξ 20:5-6</a>)</p></blockquote><p>Εδώ γίνεται λόγος για εκείνους τους ανθρώπους που από γενιά σε γενιά συνεχίζουν να μισούν τον Θεό: «<strong>έως τρίτης και τετάρτης γενεάς, <u>τοις μισούσιν με</u></strong>». Τέτοιοι θα τιμωρηθούν για το μίσος τους προς τον Θεό. Γιατί; Αν και ο Κύριος ανεχόταν το μίσος του πατέρα του, του παππού και του προπάππου, αλλά επειδή αυτό το μίσος συνεχίζεται ήδη στην 3η-4η γενιά, έρχεται το τέλος της υπομονής και τέτοιοι υφίστανται την τιμωρία.</p><p>Ο όσιος Εφραίμ ο Σύρος:</p><blockquote><p>Στ. 5-6, 13-14, 16-17, 22-26 Στο όρος δίνει ο Θεός τις εντολές και λέει: «Εγώ είμαι Κύριος, ο αποδιδούς αμαρτίας πατέρων επί τέκνα έως τρίτης και τετάρτης γενεάς τοις μισούσιν με». <strong><mark>Ο Θεός, κατά τη μακροθυμία Του, ανέχεται τον πονηρό άνθρωπο, και τον γιο και τον εγγονό του· αλλά αν δεν μετανοήσουν, επιβάλλει την τιμωρία στο κεφάλι του τέταρτου, μόλις αυτός στην πονηρία του γίνει όμοιος με τους πατέρες του</mark></strong>.</p></blockquote><p>(Ερμηνεία στην Έξοδο 20)</p>'
