  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <blockquote><p>«καὶ <strong>δῶρα οὐ λήμψῃ· τὰ γὰρ δῶρα ἐκτυφλοῖ ὀφθαλμοὺς βλεπόντων καὶ λυμαίνεται ῥήματα δίκαια</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/23/#L8">Έξ 23:8</a>)</p></blockquote><blockquote><p>«οὐκ ἐκκλινοῦσιν κρίσιν, οὐκ ἐπιγνώσονται πρόσωπον <strong>οὐδὲ λήμψονται δῶρον· τὰ γὰρ δῶρα ἐκτυφλοῖ ὀφθαλμοὺς σοφῶν καὶ ἐξαίρει λόγους δικαίων</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/vtor/16/#L19">Δτ 16:19</a>)</p></blockquote><blockquote><p>«ὅτι ἡ συκοφαντία περιφέρει σοφὸν καὶ <strong>ἀπόλλυσι τὴν καρδίαν εὐτονίας αὐτοῦ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ekl/7/#L7">Εκ 7:7</a>)</p></blockquote><blockquote><p>«<strong>λαμβάνοντος δῶρα ἐν κόλπῳ</strong> ἀδίκως οὐ κατευοδοῦνται ὁδοί, <strong>ἀσεβὴς δὲ ἐκκλίνει ὁδοὺς δικαιοσύνης</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/pr/17/#L23">Πρμ 17:23</a>)</p></blockquote><blockquote><p>«βασιλεὺς δίκαιος ἀνίστησιν χώραν, <strong>ἀνὴρ δὲ παράνομος κατασκάπτει</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/pr/29/#L4">Πρμ 29:4</a>)</p></blockquote><blockquote><p>«Καὶ ἐγένετο ὡς ἐγήρασεν Σαμουηλ, καὶ κατέστησεν τοὺς υἱοὺς αὐτοῦ δικαστὰς τῷ Ισραηλ. &lt;…&gt; καὶ <strong>οὐκ ἐπορεύθησαν οἱ υἱοὶ αὐτοῦ ἐν ὁδῷ αὐτοῦ καὶ ἐξέκλιναν ὀπίσω τῆς συντελείας καὶ ἐλάμβανον δῶρα καὶ ἐξέκλινον δικαιώματα</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1ts/8/#L1,3">Α Βασ 8:1,3</a>)</p></blockquote><blockquote><p>«μαρτύριον γὰρ ἀσεβοῦς θάνατος, <strong>πῦρ δὲ καύσει οἴκους δωροδεκτῶν</strong>. ἐν γαστρὶ δὲ λήμψεται ὀδύνας, ἀποβήσεται δὲ αὐτῷ κενά, ἡ δὲ κοιλία αὐτοῦ ὑποίσει δόλον.» (<a href="https://bibleox.com/el/gr-lxx-byz/iov/15/#L34-35">Ιωβ 15:34-35</a>)</p></blockquote><blockquote><p>«μὴ συναπολέσῃς μετὰ <strong>ἀσεβῶν</strong> τὴν ψυχήν μου καὶ μετὰ ἀνδρῶν αἱμάτων τὴν ζωήν μου, <strong>ὧν ἐν χερσὶν ἀνομίαι, ἡ δεξιὰ αὐτῶν ἐπλήσθη δώρων</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/25/#L9-10">Ψλ 25:9-10</a>)</p></blockquote><blockquote><p>«καὶ ἐν <strong>πλεονεξίᾳ</strong> πλαστοῖς λόγοις ὑμᾶς ἐμπορεύσονται· οἷς τὸ κρίμα ἔκπαλαι οὐκ ἀργεῖ, καὶ ἡ ἀπώλεια αὐτῶν οὐ νυστάζει. &lt;…&gt; ἀδικούμενοι μισθὸν ἀδικίας· ἡδονὴν ἡγούμενοι τὴν ἐν ἡμέρᾳ τρυφήν, σπίλοι καὶ μῶμοι ἐντρυφῶντες ἐν ταῖς ἀπάταις αὐτῶν συνευωχούμενοι ὑμῖν, ὀφθαλμοὺς ἔχοντες μεστοὺς μοιχαλίδος καὶ ἀκαταπαύστους ἁμαρτίας, δελεάζοντες ψυχὰς ἀστηρίκτους, <strong>καρδίαν γεγυμνασμένην πλεονεξίας</strong> ἔχοντες, κατάρας τέκνα, καταλείποντες εὐθεῖαν ὁδὸν ἐπλανήθησαν, <strong>ἐξακολουθήσαντες τῇ ὁδῷ τοῦ Βαλαὰμ</strong> τοῦ Βοσόρ, <strong>ὃς μισθὸν ἀδικίας ἠγάπησεν</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/2pet/2/#L3,13-15">Β Πε 2:3,13-15</a>)</p></blockquote>
