  update: true
  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <blockquote><p>«ἢ οὐκ οἴδατε ὅτι <strong>ἄδικοι θεοῦ βασιλείαν οὐ κληρονομήσουσιν</strong>; <strong>μὴ πλανᾶσθε</strong>· οὔτε πόρνοι οὔτε εἰδωλολάτραι οὔτε μοιχοὶ οὔτε μαλακοὶ οὔτε ἀρσενοκοῖται οὔτε <strong><mark>κλέπται</mark></strong> οὔτε πλεονέκται, οὐ μέθυσοι, οὐ λοίδοροι, <strong><mark>οὐχ ἅρπαγες βασιλείαν θεοῦ κληρονομήσουσιν</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/6/#L9-10">Α Κορ 6:9-10</a>)</p></blockquote><blockquote><p>«<strong>ὁ κλέπτων μηκέτι κλεπτέτω</strong>, μᾶλλον δὲ κοπιάτω ἐργαζόμενος ταῖς ἰδίαις χερσὶν τὸ ἀγαθόν, ἵνα ἔχῃ μεταδιδόναι τῷ χρείαν ἔχοντι.» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/4/#L28">Εφ 4:28</a>)</p></blockquote><blockquote><p>«<strong><mark>ἐγὼ γάρ εἰμι κύριος ὁ ἀγαπῶν δικαιοσύνην καὶ μισῶν ἁρπάγματα</mark></strong> ἐξ ἀδικίας· καὶ δώσω τὸν μόχθον αὐτῶν δικαίοις καὶ διαθήκην αἰώνιον διαθήσομαι αὐτοῖς.» (<a href="https://bibleox.com/el/gr-lxx-byz/is/61/#L8">Ησ 61:8</a>)</p></blockquote><blockquote><p>«καὶ εἶπεν πρός με Αὕτη ἡ ἀρὰ ἡ ἐκπορευομένη ἐπὶ πρόσωπον πάσης τῆς γῆς, διότι <strong>πᾶς ὁ κλέπτης ἐκ τούτου ἕως θανάτου ἐκδικηθήσεται</strong>, καὶ πᾶς ὁ ἐπίορκος ἐκ τούτου ἕως θανάτου ἐκδικηθήσεται· καὶ ἐξοίσω αὐτό, λέγει κύριος παντοκράτωρ, καὶ εἰσελεύσεται εἰς τὸν οἶκον τοῦ κλέπτου καὶ εἰς τὸν οἶκον τοῦ ὀμνύοντος τῷ ὀνόματί μου ἐπὶ ψεύδει καὶ καταλύσει ἐν μέσῳ τοῦ οἴκου αὐτοῦ καὶ συντελέσει αὐτὸν καὶ τὰ ξύλα αὐτοῦ καὶ τοὺς λίθους αὐτοῦ.» (<a href="https://bibleox.com/el/gr-lxx-byz/zah/5/#L3-4">Ζαχ 5:3-4</a>)</p></blockquote><blockquote><p>«καὶ φονεύετε καὶ μοιχᾶσθε καὶ <strong>κλέπτετε</strong> καὶ ὀμνύετε ἐπ᾿ ἀδίκῳ καὶ ἐθυμιᾶτε τῇ Βααλ καὶ ἐπορεύεσθε ὀπίσω θεῶν ἀλλοτρίων, ὧν οὐκ οἴδατε, τοῦ κακῶς εἶναι ὑμῖν καὶ <strong>ἤλθετε καὶ ἔστητε ἐνώπιον ἐμοῦ</strong> ἐν τῷ οἴκῳ, οὗ ἐπικέκληται τὸ ὄνομά μου ἐπ᾿ αὐτῷ, καὶ εἴπατε Ἀπεσχήμεθα τοῦ μὴ ποιεῖν πάντα τὰ βδελύγματα ταῦτα» (<a href="https://bibleox.com/el/gr-lxx-byz/ier/7/#L9-10">Ιερ 7:9-10</a>)</p></blockquote><blockquote><p>«Καὶ ἐλάλησεν κύριος πάντας τοὺς λόγους τούτους λέγων &lt;…&gt; <strong>οὐ κλέψεις</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/20/#L1,14">Έξ 20:1,14</a>)</p></blockquote><blockquote><p>«Καὶ ἐλάλησεν κύριος πρὸς Μωυσῆν λέγων &lt;…&gt; <strong>Οὐ κλέψετε</strong>. οὐ ψεύσεσθε. οὐ συκοφαντήσει ἕκαστος τὸν πλησίον.» (<a href="https://bibleox.com/el/gr-lxx-byz/lev/19/#L1,11">Λευ 19:1,11</a>)</p></blockquote><hr><blockquote><p>«καὶ <strong><mark>ἐν τῷ εἶπαί με τῷ ἀσεβεῖ Θανάτῳ θανατωθήσῃ, καὶ ἀποστρέψῃ ἀπὸ τῆς ἁμαρτίας αὐτοῦ καὶ ποιήσῃ κρίμα καὶ δικαιοσύνην</mark></strong> καὶ <strong><mark>ἐνεχύρασμα ἀποδῷ καὶ ἅρπαγμα ἀποτείσῃ, ἐν προστάγμασιν ζωῆς διαπορεύηται</mark></strong> τοῦ μὴ ποιῆσαι ἄδικον, <strong><mark>ζωῇ ζήσεται</mark></strong> καὶ οὐ μὴ ἀποθάνῃ· <strong>πᾶσαι αἱ ἁμαρτίαι αὐτοῦ, ἃς ἥμαρτεν, οὐ μὴ ἀναμνησθῶσιν· ὅτι κρίμα καὶ δικαιοσύνην ἐποίησεν, ἐν αὐτοῖς ζήσεται</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/iez/33/#L14-16">Ιεζ 33:14-16</a>)</p></blockquote><blockquote><p>«<strong><mark>σταθεὶς δὲ Ζακχαῖος εἶπεν πρὸς τὸν κύριον, Ἰδοὺ τὰ ἡμίσειά μου τῶν ὑπαρχόντων, κύριε, τοῖς πτωχοῖς δίδωμι, καὶ εἴ τινός τι ἐσυκοφάντησα ἀποδίδωμι τετραπλοῦν</mark></strong>. εἶπεν δὲ πρὸς αὐτὸν ὁ Ἰησοῦς ὅτι <strong><mark>Σήμερον σωτηρία τῷ οἴκῳ τούτῳ ἐγένετο</mark></strong>, καθότι καὶ αὐτὸς υἱὸς Ἀβραάμ ἐστιν· ἦλθεν γὰρ ὁ υἱὸς τοῦ ἀνθρώπου ζητῆσαι καὶ σῶσαι τὸ ἀπολωλός.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/19/#L8-10">Λκ 19:8-10</a>)</p></blockquote>
