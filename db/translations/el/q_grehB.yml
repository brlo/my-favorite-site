  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <blockquote>«Ἀδελφοί μου, <b>μὴ ἐν προσωπολημψίαις</b> ἔχετε τὴν πίστιν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ τῆς δόξης. ἐὰν γὰρ εἰσέλθῃ εἰς συναγωγὴν ὑμῶν ἀνὴρ χρυσοδακτύλιος ἐν ἐσθῆτι λαμπρᾷ, εἰσέλθῃ δὲ καὶ πτωχὸς ἐν ῥυπαρᾷ ἐσθῆτι, <b>ἐπιβλέψητε δὲ ἐπὶ τὸν φοροῦντα τὴν ἐσθῆτα τὴν λαμπρὰν καὶ εἴπητε, Σὺ κάθου ὧδε καλῶς, καὶ τῷ πτωχῷ εἴπητε, Σὺ στῆθι ἢ κάθου ἐκεῖ ὑπὸ τὸ ὑποπόδιόν μου</b>, οὐ διεκρίθητε ἐν ἑαυτοῖς καὶ ἐγένεσθε κριταὶ διαλογισμῶν πονηρῶν; &lt;…&gt; εἰ μέντοι νόμον τελεῖτε βασιλικὸν κατὰ τὴν γραφήν, Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν, καλῶς ποιεῖτε· <b>εἰ δὲ προσωπολημπτεῖτε, ἁμαρτίαν ἐργάζεσθε</b>, ἐλεγχόμενοι ὑπὸ τοῦ νόμου ὡς παραβάται.» (<a href="https://bibleox.com/el/gr-lxx-byz/iak/2/#L1-4,8-9">Ιακ 2:1-4,8-9</a>)</blockquote><blockquote>«Οἱ δοῦλοι, ὑπακούετε κατὰ πάντα τοῖς κατὰ σάρκα κυρίοις, <b>μὴ ἐν ὀφθαλμοδουλίᾳ</b> <b>ὡς ἀνθρωπάρεσκοι</b>, ἀλλ᾿ <b>ἐν ἁπλότητι καρδίας</b>, φοβούμενοι τὸν κύριον.» (<a href="https://bibleox.com/el/gr-lxx-byz/kol/3/#L22">Κολ 3:22</a>)</blockquote><blockquote>«Οἱ δοῦλοι, ὑπακούετε τοῖς κατὰ σάρκα κυρίοις μετὰ φόβου καὶ τρόμου ἐν ἁπλότητι τῆς καρδίας ὑμῶν ὡς τῷ Χριστῷ, <b>μὴ κατ᾿ ὀφθαλμοδουλίαν ὡς ἀνθρωπάρεσκοι</b> ἀλλ᾿ ὡς δοῦλοι Χριστοῦ ποιοῦντες τὸ θέλημα τοῦ θεοῦ ἐκ ψυχῆς, μετ᾿ εὐνοίας δουλεύοντες, ὡς τῷ κυρίῳ καὶ οὐκ ἀνθρώποις» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/6/#L5-7">Εφ 6:5-7</a>)</blockquote><blockquote>«ἐκεῖ φοβηθήσονται φόβον, οὗ οὐκ ἦν φόβος, ὅτι <b>ὁ θεὸς διεσκόρπισεν ὀστᾶ ἀνθρωπαρέσκων</b>· κατῃσχύνθησαν, ὅτι ὁ θεὸς ἐξουδένωσεν αὐτούς.» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/52/#L5">Ψλ 52:5</a>)</blockquote><blockquote>«Ἕως πότε κρίνετε ἀδικίαν καὶ <b>πρόσωπα ἁμαρτωλῶν λαμβάνετε</b>; διάψαλμα.» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/81/#L2">Ψλ 81:2</a>)</blockquote><blockquote>«Οὐ ποιήσετε ἄδικον ἐν κρίσει· <b>οὐ λήμψῃ πρόσωπον πτωχοῦ οὐδὲ θαυμάσεις πρόσωπον δυνάστου</b>, ἐν δικαιοσύνῃ κρινεῖς τὸν πλησίον σου.» (<a href="https://bibleox.com/el/gr-lxx-byz/lev/19/#L15">Λευ 19:15</a>)</blockquote><blockquote>«Ταῦτα δὲ λέγω ὑμῖν τοῖς σοφοῖς ἐπιγινώσκειν· <b>αἰδεῖσθαι</b> <b>πρόσωπον</b> <b>ἐν κρίσει οὐ καλόν</b>·» (<a href="https://bibleox.com/el/gr-lxx-byz/pr/24/#L23">Πρμ 24:23</a>)</blockquote><blockquote>«<b>ὃς οὐκ αἰσχύνεται πρόσωπα δικαίων, οὐκ ἀγαθός</b>· ὁ τοιοῦτος ψωμοῦ ἄρτου ἀποδώσεται ἄνδρα.» (<a href="https://bibleox.com/el/gr-lxx-byz/pr/28/#L21">Πρμ 28:21</a>)</blockquote><blockquote>«ἐνδύσεται θώρακα δικαιοσύνην καὶ περιθήσεται κόρυθα <b>κρίσιν ἀνυπόκριτον</b>·» (<a href="https://bibleox.com/el/gr-lxx-byz/prs/5/#L18">Σ.Σολ 5:18</a>)</blockquote><blockquote>«Μὴ περὶ τούτων αἰσχυνθῇς καὶ <b>μὴ λάβῃς πρόσωπον τοῦ ἁμαρτάνειν</b>· περὶ νόμου ὑψίστου καὶ διαθήκης καὶ περὶ κρίματος δικαιῶσαι τὸν ἀσεβῆ» (<a href="https://bibleox.com/el/gr-lxx-byz/prsir/42/#L1-2">Σ.Σειρ 42:1-2</a>)</blockquote><blockquote>«κἀγὼ δέδωκα ὑμᾶς ἐξουδενωμένους καὶ παρειμένους εἰς πάντα τὰ ἔθνη, ἀνθ᾿ ὧν ὑμεῖς οὐκ ἐφυλάξασθε τὰς ὁδούς μου, ἀλλὰ <b>ἐλαμβάνετε πρόσωπα ἐν νόμῳ</b>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mal/2/#L9">Μαλ 2:9</a>)</blockquote><blockquote>«Οὗτοί εἰσιν γογγυσταί, μεμψίμοιροι, κατὰ τὰς ἐπιθυμίας αὐτῶν πορευόμενοι, καὶ τὸ στόμα αὐτῶν λαλεῖ ὑπέρογκα, <b>θαυμάζοντες</b> <b>πρόσωπα</b> <b>ὠφελείας χάριν</b>.» (<a href="https://bibleox.com/el/gr-lxx-byz/iud/1/#L16">Ιούδα 1:16</a>)</blockquote>
