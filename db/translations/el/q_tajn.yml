  body: <p><strong>Το Ευχέλαιο</strong>, γνωστό και ως <strong>Ιερό Ευχέλαιο</strong>, είναι εκκλησιαστικό μυστήριο που τελείται πάνω σε άρρωστο άνθρωπο από σύναξη ιερέων (σε έσχατη περίπτωση από έναν ιερέα) και συνίσταται στην επίκληση πάνω στον ασθενή, μέσω προσευχών και χρίσεως με αγιασμένο έλαιο, της θεραπευτικής και καθαρτικής χάριτος που γιατρεύει τις σωματικές και ψυχικές ασθένειες.</p><p><strong>Βιβλικές ρήσεις:</strong></p><blockquote><p>«ἀσθενεῖ τις ἐν ὑμῖν; <strong>προσκαλεσάσθω τοὺς πρεσβυτέρους τῆς ἐκκλησίας</strong>, καὶ <strong>προσευξάσθωσαν ἐπ᾿ αὐτὸν <mark>ἀλείψαντες ἐλαίῳ</mark> ἐν τῷ ὀνόματι [τοῦ] κυρίου</strong>· καὶ <strong>ἡ εὐχὴ τῆς πίστεως σώσει τὸν κάμνοντα</strong>, καὶ ἐγερεῖ αὐτὸν ὁ κύριος· <strong>κἂν ἁμαρτίας ᾖ πεποιηκώς, ἀφεθήσεται αὐτῷ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/iak/5/#L14-15">Ιακ 5:14-15</a>)</p></blockquote><blockquote><p>«Καὶ ἐξελθόντες ἐκήρυξαν ἵνα μετανοῶσιν, καὶ δαιμόνια πολλὰ ἐξέβαλλον, καὶ <strong><mark>ἤλειφον ἐλαίῳ πολλοὺς ἀρρώστους καὶ ἐθεράπευον</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mk/6/#L12-13">Μκ 6:12-13</a>)</p></blockquote><blockquote><p>«Καὶ προσκαλεσάμενος τοὺς δώδεκα μαθητὰς αὐτοῦ <strong>ἔδωκεν αὐτοῖς ἐξουσίαν</strong> πνευμάτων ἀκαθάρτων ὥστε <strong>ἐκβάλλειν</strong> αὐτὰ καὶ <strong>θεραπεύειν πᾶσαν νόσον</strong> καὶ <strong>πᾶσαν μαλακίαν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/10/#L1">Μτ 10:1</a>)</p></blockquote><blockquote><p>«<strong>ἀσθενοῦντας θεραπεύετε</strong>, νεκροὺς ἐγείρετε, λεπροὺς καθαρίζετε, δαιμόνια ἐκβάλλετε· <strong>δωρεὰν ἐλάβετε, δωρεὰν δότε</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/10/#L8">Μτ 10:8</a>)</p></blockquote>
