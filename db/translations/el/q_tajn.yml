  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: '<h2>Ορισμός</h2><p><strong>Το Χρίσμα</strong> (η λήψη των δωρεών του Αγίου Πνεύματος) είναι ένα από τα επτά μυστήρια της Εκκλησίας, στο οποίο ο άνθρωπος λαμβάνει δυνάμεις (δωρεές του Αγίου Πνεύματος) για να πορευτεί στον πνευματικό δρόμο και να προκόψει. Το μυστήριο του Χρίσματος τελείται μαζί με το μυστήριο του Βαπτίσματος, αμέσως μετά από αυτό.</p><p>Αρχικά το μυστήριο τελούνταν με την επίθεση των χειρών του αποστόλου και προσευχή. Αργότερα, αλλά ακόμη και επί των αποστόλων, η επίθεση των χειρών αντικαταστάθηκε από το χρίσμα του ανθρώπου με μύρο (ειδικό αγιασμένο λάδι). Κατά πάσα πιθανότητα αυτό έγινε ώστε το μυστήριο να μπορούν να το τελούν όχι μόνο οι απόστολοι και οι επίσκοποι, αλλά και εκείνοι οι πρεσβύτεροι στους οποίους οι επίσκοποι δίνουν αυτό το δικαίωμα, όπως και στα άλλα μυστήρια[1]. Ο επίσκοπος παρασκευάζει το μύρο και το δίνει στον πρεσβύτερο που τελεί αυτό το μυστήριο. Αναλυτικότερα περιγράφεται στην <a href="https://bibleox.com/el/el/w/Το_Χρίσμα#HH-Από-τον-1ο2ο-αιώνα-αντί-της-επίθεσης-των-χειρών-χρίουν-με-μύρο">αντίστοιχη ενότητα</a> παρακάτω.</p><h2>Η μαρτυρία για το μυστήριο της μετάδοσης των δωρεών του Αγίου Πνεύματος</h2><p>Το κήρυγμα του αποστόλου Πέτρου.</p><p>Ο απόστολος Πέτρος καλεί στο Βάπτισμα για την άφεση των αμαρτιών και έπειτα μιλά επιπλέον για την ανάγκη να λάβει κανείς τη δωρεά του Αγίου Πνεύματος:</p><blockquote><p>«Πέτρος δὲ πρὸς αὐτούς, Μετανοήσατε, καὶ <strong><mark>βαπτισθήτω</mark></strong> <strong>ἕκαστος ὑμῶν</strong> ἐπὶ τῷ ὀνόματι Ἰησοῦ Χριστοῦ εἰς ἄφεσιν τῶν ἁμαρτιῶν ὑμῶν, <strong><u><mark>καὶ</mark></u> <mark>λήμψεσθε τὴν δωρεὰν τοῦ ἁγίου πνεύματος</mark></strong>·» (<a href="https://bibleox.com/el/gr-lxx-byz/act/2/#L38">Πραξ 2:38</a>)</p></blockquote><h2>Οι δωρεές του Αγίου Πνεύματος μεταδίδονται με την επίθεση των χειρών των αποστόλων</h2><p>Ο ευαγγελιστής Λουκάς στο βιβλίο των Πράξεων λέει άμεσα ότι «με την επίθεση των χειρών των αποστόλων δίνεται το Άγιο Πνεύμα» (<a href="https://bibleox.com/el/gr-lxx-byz/act/8/#L18">Πραξ 8:18</a>). Αυτά δεν είναι λόγια του Σίμωνα, αλλά του ευαγγελιστή Λουκά, του συγγραφέα των Πράξεων. Επιπλέον, παρακάτω ο απόστολος Πέτρος μιλά άμεσα για τη μετάδοση των δωρεών του Αγίου Πνεύματος ως δωρεά του Θεού, αλλά κατηγορεί τον Σίμωνα ότι σκέφτηκε να αποκτήσει αυτή τη δωρεά με χρήματα:</p><blockquote><p>«τότε ἐπετίθουν τὰς χεῖρας ἐπ᾿ αὐτούς, καὶ ἐλάμβανον πνεῦμα ἅγιον. ἰδὼν δὲ ὁ Σίμων ὅτι <strong><mark>διὰ τῆς ἐπιθέσεως τῶν χειρῶν τῶν ἀποστόλων δίδοται τὸ πνεῦμα</mark></strong>, προσήνεγκεν αὐτοῖς χρήματα λέγων, Δότε κἀμοὶ τὴν ἐξουσίαν ταύτην ἵνα ᾧ ἐὰν ἐπιθῶ τὰς χεῖρας λαμβάνῃ πνεῦμα ἅγιον. Πέτρος δὲ εἶπεν πρὸς αὐτόν, Τὸ ἀργύριόν σου σὺν σοὶ εἴη εἰς ἀπώλειαν, ὅτι <strong>τὴν δωρεὰν τοῦ θεοῦ ἐνόμισας διὰ χρημάτων κτᾶσθαι</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/8/#L17-20">Πραξ 8:17-20</a>)</p></blockquote><p>Ο απόστολος Παύλος βαπτίζει στην Έφεσο. Μετά το βάπτισμα αμέσως επιθέτει τα χέρια για τη μετάδοση των δωρεών του Αγίου Πνεύματος:</p><blockquote><p>«εἶπεν δὲ Παῦλος, Ἰωάννης ἐβάπτισεν βάπτισμα μετανοίας, τῷ λαῷ λέγων εἰς τὸν ἐρχόμενον μετ᾿ αὐτὸν ἵνα πιστεύσωσιν, τοῦτ᾿ ἔστιν εἰς τὸν Ἰησοῦν. ἀκούσαντες δὲ <strong><mark>ἐβαπτίσθησαν</mark></strong> εἰς τὸ ὄνομα τοῦ κυρίου Ἰησοῦ· <strong><mark>καὶ ἐπιθέντος αὐτοῖς τοῦ Παύλου χεῖρας ἦλθε τὸ πνεῦμα τὸ ἅγιον ἐπ᾿ αὐτούς</mark></strong>, ἐλάλουν τε γλώσσαις καὶ ἐπροφήτευον.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/19/#L4-6">Πραξ 19:4-6</a>)</p></blockquote><h2>Η μετάδοση των δωρεών του Αγίου Πνεύματος — μυστήριο χωριστό από το Βάπτισμα</h2><p>Οι Σαμαρείτες βαπτίστηκαν, αλλά το Άγιο Πνεύμα κατέβηκε αργότερα, μετά την επίθεση των χειρών των αποστόλων.</p><p>Το βάπτισμα των Σαμαρειτών τελέστηκε. Πουθενά δεν λέγεται ότι με αυτό το βάπτισμα υπήρχε κάτι λάθος. Αντίθετα, δηλώνεται άμεσα ότι «μόνο βαπτισμένοι ήταν», ενώ το Πνεύμα δεν είχε ακόμη κατέβει πάνω τους. Όταν οι απόστολοι άκουσαν για τους Σαμαρείτες, έγινε σαφές ότι κάποιος από τους αποστόλους έπρεπε να πάει στους Σαμαρείτες, ώστε να μη μείνουν μόνο βαπτισμένοι (κάτι που μπορούσε να κάνει και ο Φίλιππος), αλλά να λάβουν και τις δωρεές του Αγίου Πνεύματος (κάτι που ο Φίλιππος δεν μπορούσε πλέον να κάνει, γιατί τις δωρεές του Αγίου Πνεύματος μπορούν να μεταδίδουν μόνο οι απόστολοι και εκείνοι στους οποίους αυτοί μετέδωσαν αυτή τη δωρεά — οι επίσκοποι).</p><blockquote><p>«Φίλιππος δὲ κατελθὼν εἰς [τὴν] πόλιν τῆς Σαμαρείας ἐκήρυσσεν αὐτοῖς τὸν Χριστόν. &lt;…&gt; ὅτε δὲ ἐπίστευσαν τῷ Φιλίππῳ εὐαγγελιζομένῳ περὶ τῆς βασιλείας τοῦ θεοῦ καὶ τοῦ ὀνόματος Ἰησοῦ Χριστοῦ, <strong><mark>ἐβαπτίζοντο</mark></strong> ἄνδρες τε καὶ γυναῖκες. &lt;…&gt; Ἀκούσαντες δὲ οἱ ἐν Ἱεροσολύμοις ἀπόστολοι ὅτι δέδεκται ἡ Σαμάρεια τὸν λόγον τοῦ θεοῦ <strong>ἀπέστειλαν πρὸς αὐτοὺς Πέτρον καὶ Ἰωάννην, οἵτινες καταβάντες <mark>προσηύξαντο περὶ αὐτῶν ὅπως λάβωσιν πνεῦμα ἅγιον· οὐδέπω γὰρ ἦν ἐπ᾿ οὐδενὶ αὐτῶν ἐπιπεπτωκός</mark>, <u><mark>μόνον δὲ βεβαπτισμένοι ὑπῆρχον</mark></u></strong> εἰς τὸ ὄνομα τοῦ κυρίου Ἰησοῦ. τότε <strong><u><mark>ἐπετίθουν τὰς χεῖρας</mark></u> <mark>ἐπ᾿ αὐτούς, καὶ ἐλάμβανον πνεῦμα ἅγιον</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/8/#L5,12,14-17">Πραξ 8:5,12,14-17</a>)</p></blockquote><h2>Από τον 1ο–2ο αιώνα, αντί της επίθεσης των χειρών, χρίουν με μύρο</h2><p>Αρχικά το μυστήριο τελούνταν με την επίθεση των χειρών των αποστόλων και των επισκόπων. Έπειτα, κατά πάσα πιθανότητα, εξαιτίας της αύξησης του αριθμού των ανθρώπων που προσχωρούσαν στον χριστιανισμό, ήταν πολύ δύσκολο για τους επισκόπους να επιθέτουν τα χέρια σε όλους τους χριστιανούς, γι’ αυτό και καθιερώθηκε η πρακτική του αγιασμού ειδικού λαδιού (μύρου), το οποίο δινόταν στον ιερέα (πρεσβύτερο) για να χρίει με αυτό στο μυστήριο του Χρίσματος, αντί της επίθεσης των χειρών του επισκόπου.</p><p>Υπάρχει μαρτυρία για την τέλεση του μυστηρίου με αυτόν τον τρόπο τόσο στην ίδια την Αγία Γραφή όσο και σε ορισμένους από τους αρχαιότερους χριστιανούς συγγραφείς.</p><blockquote><p>«ὁ δὲ βεβαιῶν ἡμᾶς σὺν ὑμῖν εἰς Χριστὸν καὶ <strong>χρίσας</strong> ἡμᾶς θεός, ὁ καὶ σφραγισάμενος ἡμᾶς καὶ δοὺς τὸν ἀρραβῶνα τοῦ πνεύματος ἐν ταῖς καρδίαις ἡμῶν.» (<a href="https://bibleox.com/el/gr-lxx-byz/2kor/1/#L21-22">Β Κορ 1:21-22</a>)</p></blockquote><blockquote><p>«καὶ ὑμεῖς <strong>χρῖσμα ἔχετε</strong> ἀπὸ τοῦ ἁγίου, καὶ οἴδατε πάντες.» (<a href="https://bibleox.com/el/gr-lxx-byz/1in/2/#L20">Α Ιω 2:20</a>)</p></blockquote><blockquote><p>«καὶ ὑμεῖς <strong>τὸ χρῖσμα ὃ ἐλάβετε</strong> ἀπ᾿ αὐτοῦ μένει ἐν ὑμῖν, καὶ οὐ χρείαν ἔχετε ἵνα τις διδάσκῃ ὑμᾶς· ἀλλ᾿ ὡς <strong>τὸ αὐτοῦ χρῖσμα</strong> διδάσκει ὑμᾶς περὶ πάντων, καὶ ἀληθές ἐστιν καὶ οὐκ ἔστιν ψεῦδος, καὶ καθὼς ἐδίδαξεν ὑμᾶς, μένετε ἐν αὐτῷ.» (<a href="https://bibleox.com/el/gr-lxx-byz/1in/2/#L27">Α Ιω 2:27</a>)</p></blockquote><p><strong>Θεόφιλος Αντιοχείας, άγιος ιεράρχης, 2ος αιώνας</strong></p><blockquote><p>Περὶ δὲ τοῦ σε καταγελᾶν μου, καλοῦντά με χριστιανόν, οὐκ οἶδας ὃ λέγεις. πρῶτον μὲν ὅτι τὸ χριστὸν ἡδὺ καὶ εὔχρηστον καὶ ἀκαταγέλαστόν ἐστιν. ποῖον γὰρ πλοῖον δύναται εὔχρηστον εἶναι καὶ σώζεσθαι, ἐὰν μὴ πρῶτον χρισθῇ; ἢ ποῖος πύργος ἢ οἰκία εὔμορφος καὶ εὔχρηστός ἐστιν, ἐπὰν οὐ κέχρισται; τίς δὲ ἄνθρωπος εἰσελθὼν εἰς τόνδε τὸν βίον ἢ ἀθλῶν οὐ χρίεται ἐλαίῳ; &lt;…&gt; τοιγαροῦν <strong>ἡμεῖς τούτου εἵνεκεν καλούμεθα χριστιανοὶ ὅτι χριόμεθα ἔλαιον θεοῦ</strong>.</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/pRt3_ΘEOΦIΛOΥ_ΠΡOΣ_AΥΤOΛΥΚOΝ">Θεόφιλος, Προς Αυτόλυκον</a>)</p><p>Δείτε περισσότερες ρήσεις:</p><ul><li><p>Περισσότερες ρήσεις για την έννοια του μυστηρίου του Χρίσματος</p></li><li><p>Μακάριος Μπουλγκάκοφ (Μητροπολίτης Μόσχας), Ορθόδοξη δογματική θεολογία, τόμος 2</p></li></ul><h2>Κριτική</h2><h3>Μα το Άγιο Πνεύμα δεν κατεβαίνει στον εκατόνταρχο Κορνήλιο χωρίς την επίθεση των χειρών του αποστόλου;</h3><p>Η κάθοδος του Αγίου Πνεύματος στην οικογένεια του Κορνήλιου κατά το κήρυγμα του αποστόλου Πέτρου είναι η <strong>μοναδική</strong> περίπτωση όπου το Άγιο Πνεύμα κατεβαίνει χωρίς την επίθεση των χειρών του αποστόλου και πριν από το βάπτισμα. Πριν από αυτή την εξαιρετική περίπτωση υπήρξε μια σειρά έκτακτων γεγονότων που δείχνουν ότι έτσι ο Θεός προετοίμαζε την Εκκλησία να δεχτεί τους ειδωλολάτρες (όχι τους Ιουδαίους). Πριν από αυτό, η δυνατότητα να δεχτούν ειδωλολάτρες δεν ήταν καθόλου προφανής και ακόμη και αργότερα προκαλούσε διαφωνίες. Με αυτή την ειδική κάθοδο του Αγίου Πνεύματος ο Θεός έδειξε ότι:</p><ol><li><p>Μπορεί κανείς να δεχτεί ειδωλολάτρες στην Εκκλησία (όχι Ιουδαίους)·</p></li><li><p>Απέκλεισε τη δυνατότητα να αμφιβάλλει κανείς γι’ αυτό και να κατηγορεί ανθρώπους για εσφαλμένες κρίσεις. Ο Θεός το έκανε αυτό όχι χωρίς απόστολο (το Πνεύμα δεν κατέβηκε αμέσως, αλλά πρώτα στάλθηκε άγγελος που διέταξε να βρουν τον απόστολο), ωστόσο το ίδιο το Άγιο Πνεύμα κατεβαίνει πριν από την επίθεση των χειρών του αποστόλου, εκφράζοντας καθαρά το θέλημα του Θεού για την αποδοχή των ειδωλολατρών.</p></li></ol><p>Σημαντικό είναι να σημειωθεί ότι η κάθοδος του Αγίου Πνεύματος δεν καταργεί την ανάγκη του μυστηρίου του Βαπτίσματος, το οποίο ο απόστολος τελεί αμέσως μετά την κάθοδο του Αγίου Πνεύματος στην οικογένεια του Κορνήλιου:</p><blockquote><p>«Ἀνὴρ δέ τις ἐν Καισαρείᾳ ὀνόματι Κορνήλιος, ἑκατοντάρχης ἐκ σπείρης τῆς καλουμένης Ἰταλικῆς, &lt;…&gt; Ἀνοίξας δὲ Πέτρος τὸ στόμα εἶπεν, Ἐπ᾿ ἀληθείας καταλαμβάνομαι ὅτι οὐκ ἔστιν προσωπολήμπτης ὁ θεός, &lt;…&gt; <strong>Ἔτι λαλοῦντος τοῦ Πέτρου τὰ ῥήματα ταῦτα <mark>ἐπέπεσεν τὸ πνεῦμα τὸ ἅγιον ἐπὶ πάντας</mark> τοὺς ἀκούοντας τὸν λόγον</strong>. &lt;…&gt; τότε ἀπεκρίθη Πέτρος, Μήτι τὸ ὕδωρ δύναται κωλῦσαί τις τοῦ μὴ βαπτισθῆναι τούτους οἵτινες <strong>τὸ πνεῦμα τὸ ἅγιον ἔλαβον</strong> ὡς καὶ ἡμεῖς; <strong><mark>προσέταξεν</mark> δὲ αὐτοὺς ἐν τῷ ὀνόματι Ἰησοῦ Χριστοῦ βαπτισθῆναι</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/10/#L1,34,44,46-48">Πραξ 10:1,34,44,46-48</a>)</p></blockquote><p>Για όσους θέλουν να πειστούν γι’ αυτό λεπτομερέστερα, παραθέτουμε μια αναλυτική εξήγηση.</p><p>Στην αρχή της ύπαρξης της Εκκλησίας, η αποδοχή ειδωλολατρών ήταν σχεδόν αδύνατη. Το κήρυγμα ανοίγεται μόνο για τους Ιουδαίους (<a href="https://bibleox.com/el/gr-lxx-byz/act/11/#L19"><u>Πραξ 11:19</u></a> · <a href="https://bibleox.com/el/gr-lxx-byz/act/11/#L1,18"><u>Πραξ 11:1,18</u></a> · <a href="https://bibleox.com/el/gr-lxx-byz/act/14/#L27"><u>Πραξ 14:27</u></a> · <a href="https://bibleox.com/el/gr-lxx-byz/act/15/#L4"><u>Πραξ 15:4</u></a> · <a href="https://bibleox.com/el/gr-lxx-byz/act/15/#L7"><u>Πραξ 15:7</u></a>). Η Εκκλησία δεν έχει ακόμη γενική αντίληψη για το αν μπορεί να δέχεται ειδωλολάτρες (δηλαδή μη Ιουδαίους).</p><p>Ακόμη και σε έναν από τους πλησιέστερους μαθητές, τον απόστολο Πέτρο, χρειάστηκε ειδική προετοιμασία: όχι μία, αλλά τρεις φορές να του δειχθεί το ίδιο όραμα για την ακάθαρτη τροφή με την εντολή να μη θεωρεί ακάθαρτο εκείνο που ο Θεός καθάρισε (<a href="https://bibleox.com/el/gr-lxx-byz/act/10/#L15">Πραξ 10:15</a> · <a href="https://bibleox.com/el/gr-lxx-byz/act/11/#L9">Πραξ 11:9</a>).</p><p>Έτσι, ο απόστολος Πέτρος έρχεται στον Κορνήλιο και μετά την έναρξη του κηρύγματος το Άγιο Πνεύμα κατεβαίνει στην οικογένεια του Κορνήλιου. Μετά την κάθοδο, ο απόστολος τους βαπτίζει αμέσως στο νερό. Μετά το βάπτισμα του Ρωμαίου εκατόνταρχου Κορνήλιου, οι χριστιανοί από τους Ιουδαίους μένουν κατάπληκτοι με το γεγονός:</p><blockquote><p>«καὶ ἐξέστησαν οἱ ἐκ περιτομῆς πιστοὶ ὅσοι συνῆλθαν τῷ Πέτρῳ, ὅτι καὶ ἐπὶ τὰ ἔθνη ἡ δωρεὰ τοῦ πνεύματος τοῦ ἁγίου ἐκκέχυται·» (<a href="https://bibleox.com/el/gr-lxx-byz/act/10/#L45">Πραξ 10:45</a>)</p></blockquote><p>Στα Ιεροσόλυμα κατηγορούν τον απόστολο Πέτρο για το βάπτισμα του ειδωλολάτρη, αλλά αφού ακούσουν τη διήγησή του για την αποκάλυψη από τον Θεό και την κάθοδο του Αγίου Πνεύματος στον Κορνήλιο, ησυχάζουν (<a href="https://bibleox.com/el/gr-lxx-byz/act/11/#L1,18">Πραξ 11:1,18</a>). Ακόμη και μετά από αυτό, το ζήτημα δεν λύνεται οριστικά. Ο απόστολος Πέτρος βρίσκεται στην Αντιόχεια. Εκεί έρχονται επίσης χριστιανοί από τα Ιεροσόλυμα από τον απόστολο Ιάκωβο (<a href="https://bibleox.com/el/gr-lxx-byz/gal/2/#L12">Γαλ 2:12</a>) και τότε οι Ιουδαίοι της Αντιόχειας μαζί με τον απόστολο Πέτρο αρχίζουν να κρύβονται από τους Ιεροσολυμίτες, για να μη φαίνεται ότι συναναστρέφονται ειδωλολάτρες.</p><p>Έτσι, δεν είναι δύσκολο να δει κανείς ότι υπήρχε μεγάλη ανάγκη για την ειδική προετοιμασία της Εκκλησίας να δεχτεί ειδωλολάτρες.</p><p>1. Ακόμη και τον απόστολο χρειάστηκε να τον διδάξει ο Θεός τρεις φορές χωριστά.</p><p>2. Οι χριστιανοί αυτόπτες είναι σοκαρισμένοι με το γεγονός και μπροστά στους άλλους πρέπει να δικαιολογούνται.</p><p>3. Προκύπτουν διαφωνίες με τους αποστόλους και συγκαλείται ολόκληρη σύνοδος στα Ιεροσόλυμα.</p><p>Και όλα αυτά ακόμη και όταν ο Θεός επενέβη υπερφυσικά και ο Ίδιος, χωρίς την επίθεση των χειρών του αποστόλου, κατέβηκε στους ειδωλολάτρες. Ακόμη και παρ’ όλα αυτά, προκύπτει ισχυρή αντίδραση. Και τι θα γινόταν χωρίς αυτό;</p><p>Έτσι, ο Κύριος ενεργεί με εξαιρετικό τρόπο μία μόνο φορά, για να διδάξει την Εκκλησία να δέχεται ειδωλολάτρες.</p><p>Αυτό το ξεχωριστό γεγονός δεν ακύρωσε το Βάπτισμα. Ο απόστολος βάπτισε αμέσως την οικογένεια του Κορνήλιου.</p><p>Αξίζει να στρέψουμε την ιδιαίτερη προσοχή σε ολόκληρη την αλυσίδα των γεγονότων, η ουσία της οποίας είναι ότι ο Θεός, απολύτως προβλέψιμα, μπορεί να ενεργεί όπως ο Ίδιος θέλει, αλλά… δεν ενεργεί χωρίς την Εκκλησία.</p><p>Οι δημιουργοί των δικών τους χριστιανικών κοινωνιών προτιμούν εδώ να βλέπουν μόνο ένα παραθυράκι για τη δική τους αυτόκλητη σύναξη, προσπαθώντας να αποδείξουν ότι το Άγιο Πνεύμα θα το λάβουν, δήθεν, απλώς από το κήρυγμα του Ευαγγελίου. Αλλά αγνοούν πλήρως το γεγονός ότι το Άγιο Πνεύμα, που έχει τη δυνατότητα να ενεργεί απολύτως ανεξάρτητα, που δεν χρειάζεται τον απόστολο για να κατέβει στον Κορνήλιο και την οικογένειά του, δεν θέλησε να το κάνει αυτό χωρίς την Εκκλησία.</p><p>Βλέποντας τη δικαιοσύνη του Κορνήλιου, τις προσευχές και τις ελεημοσύνες του, ο Θεός του στέλνει όχι τις δωρεές του Αγίου Πνεύματος, αλλά πρώτα έναν άγγελο που διατάζει τον Κορνήλιο να βρει την Εκκλησία. Και μόνο όταν έρχεται η Εκκλησία στο πρόσωπο του αποστόλου, όταν έρχεται εκείνος στον οποίο δόθηκε η εξουσία να μεταδίδει τις δωρεές του Αγίου Πνεύματος, μόνο τότε κατεβαίνει και σε αυτόν.</p><p>Έτσι, το Άγιο Πνεύμα μπορεί να κατέβει χωρίς την Εκκλησία, αλλά δεν το κάνει. Ούτε μία φορά στη Γραφή δεν συμβαίνει αυτό. Σε όλες τις άλλες περιπτώσεις το Πνεύμα δεν κατέβαινε πριν από το βάπτισμα.</p><p>Η κάθοδος του Αγίου Πνεύματος κατά το βάπτισμα — αυτό ακριβώς σημαίνει ότι κατά τη διάρκεια του βαπτίσματος επιθέτονταν τα χέρια και κατέβαινε το Άγιο Πνεύμα. Σήμερα γίνεται το ίδιο. Κατά το βάπτισμα, αμέσως μετά, τελείται και το Χρίσμα.</p><p>Το Βάπτισμα ονομάζεται πνευματική γέννηση, είσοδος στην Εκκλησία, ένωση με το σώμα. Η αποστολή των δωρεών του Αγίου Πνεύματος δεν ονομάζεται έτσι. Το Βάπτισμα, όπως λέει ο απόστολος, σώζει. Μήπως σώζει μόνο το νερό; Φυσικά και η ενέργεια του Πνεύματος μέσω του νερού. Χωρίς το Άγιο Πνεύμα δεν γίνεται η πνευματική γέννηση κατά τη βύθιση στα νερά του βαπτίσματος. Και το μυστήριο της μετάδοσης των δωρεών του Αγίου Πνεύματος είναι χωριστό. Έτσι και εδώ ο απόστολος μιλά γι’ αυτό ως για χωριστές ενέργειες του Πνεύματος:</p><blockquote><p>«καὶ γὰρ <strong>ἐν ἑνὶ πνεύματι ἡμεῖς πάντες εἰς ἓν σῶμα <mark>ἐβαπτίσθημεν</mark></strong>, εἴτε Ἰουδαῖοι εἴτε Ἕλληνες, εἴτε δοῦλοι εἴτε ἐλεύθεροι, καὶ πάντες <strong><mark>ἓν πνεῦμα ἐποτίσθημεν</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/12/#L13">Α Κορ 12:13</a>)</p></blockquote><p>1) <strong>Βαπτιστήκαμε</strong> με το Πνεύμα και(!)</p><p>2) <strong>Ποτιστήκαμε</strong> με το Πνεύμα.</p><p>Και τα δύο γίνονται από το Άγιο Πνεύμα. Από το νερό κανείς δεν γεννιέται χωρίς την ενέργεια του Πνεύματος.</p><p>Και αν αυτές ήταν ξεχωριστές έννοιες, δεν θα υπήρχε ανάγκη να τεθεί η γέννηση από το νερό ως προϋπόθεση για τη θέα και την είσοδο στη Βασιλεία των Ουρανών. Θα αρκούσε να πει κανείς απλώς: από το Πνεύμα. Αλλά ο Σωτήρας, μιλώντας για τη γέννηση, λέει μαζί: από το νερό και το Πνεύμα, μη παραλείποντας ούτε το νερό ούτε το Πνεύμα.</p><h3>Αν τις δωρεές του Αγίου Πνεύματος μπορούν να τις μεταδίδουν μόνο οι απόστολοι, τότε γιατί το Άγιο Πνεύμα κατεβαίνει στον Αιθίοπα ευνούχο μετά το βάπτισμα από τον διάκονο Φίλιππο;</h3><p>Στην περίπτωση του Φιλίππου και του ευνούχου (<a href="https://bibleox.com/el/gr-lxx-byz/act/8/#L39">Πραξ 8:39</a>) υπάρχει μια πολύ σημαντική λεπτομέρεια.</p><p>Οι περισσότεροι ερμηνευτές, μαζί με τους αρχαιότερους, μεταξύ των οποίων και ο ιερός Ιωάννης ο Χρυσόστομος, παραθέτουν αυτό το κείμενο χωρίς τη φράση για την κάθοδο του Αγίου Πνεύματος (αγιον επεπεϲεν επι τον ευνουχον αγγελοϲ δε). Αλλά λέγεται απλώς:</p><blockquote><p>Τὸ Πνεῦμα <s>τὸ Ἅγιον ἐπέπεσεν ἐπὶ τὸν εὐνοῦχον, ὁ δὲ ἄγγελος</s> Κυρίου ἥρπασεν τὸν Φίλιππον.</p></blockquote><p>Ο Σιναϊτικός κώδικας χωρίς αυτά τα λόγια (4ος αιώνας):</p><blockquote><p>καὶ ἐκέλευσεν στῆναι τὸ ἅρμα,</p><p>καὶ κατέβησαν ἀμφότεροι εἰς τὸ ὕδωρ,</p><p>ὁ τε Φίλιππος καὶ ὁ εὐνοῦχος,</p><p>καὶ ἐβάπτισεν αὐτόν.</p><p>ὅτε δὲ ἀνέβησαν ἐκ τοῦ ὕδατος,</p><p><strong>πνεῦμα Κυρίου ἥρπασεν τὸν Φίλιππον</strong>,</p><p>καὶ οὐκ εἶδεν αὐτὸν οὐκέτι ὁ εὐνοῦχος·</p><p>ἐπορεύετο γὰρ τὴν ὁδὸν αὐτοῦ χαίρων.</p><p>Φίλιππος δὲ εὑρέθη εἰς Ἄζωτον,</p><p>καὶ διερχόμενος εὐηγγελίζετο τὰς πόλεις πάσας,</p><p>ἕως τοῦ ἐλθεῖν αὐτὸν εἰς Καισάριαν. (Πράξεις 8:39-40)</p></blockquote><p>Ο Βατικανός κώδικας χωρίς αυτά τα λόγια (4ος αιώνας):</p><blockquote><p>και εκελευϲε ϲτηναι το αρμα και κατεβηϲαν αμφοτεροι ειϲ το υδωρ ο τε φιλιπποϲ και ο ευνουχοϲ και εβαπτιϲεν αυτον</p><p>οτε δε ανεβηϲαν εκ του υδατοϲ <strong>πνευμα κ̅υ̅ ηρπαϲεν το̅ φιλιππον</strong> και ουκ ειδε̅ αυτον ουκετι ο ευνουχοϲ επορευετο γαρ αυτου την οδον χαιρων</p></blockquote><p>Ο Αλεξανδρινός κώδικας χωρίς αυτά τα λόγια (5ος αιώνας):</p><blockquote><p>και εκελευϲεν ϲτηναι το αρμα και κατεβηϲαν αμφοτεροι ειϲ το υδωρ ο τε φιλιπποϲ και ο ευνουχοϲ και εβαπτιϲεν αυτον</p><p>οτε δε ανεβηϲαν εκ του υδατοϲ <strong>π̅ν̅α̅ κ̅υ̅ ηρπαϲεν τον φιλιππο̅</strong> και ουκ ειδεν αυτον ουκετι ο ευνουχοϲ επορευετο γαρ την οδο̅ αυτου χαιρων</p><p>φιλιπποϲ δε ευρεθη ειϲ αζωτον και διερχομενοϲ ταϲ πολειϲ παϲαϲ εωϲ του ελθειν αυτο̅ ειϲ καιϲαριαν</p></blockquote><p>Έτσι παραθέτει ο ιερός Ιωάννης ο Χρυσόστομος (χωρίς τα λόγια για την κάθοδο του Αγίου Πνεύματος):</p><blockquote><p>Ὅτε δὲ ἀνέβησαν ἀπὸ τοῦ ὕδατος, <strong>Πνεῦμα Κυρίου ἥρπασε τὸν Φίλιππον</strong>, καὶ οὐκ εἶδεν αὐτὸν οὐκ ἔτι ὁ εὐνοῦχος.</p></blockquote><p>(In acta apostolorum, ΟΜΙΛΙΑ ΙΘʹ)</p>'
