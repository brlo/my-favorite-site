  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <h2>Ορισμός</h2><p><strong>Ο Γάμος</strong> είναι ένα από τα επτά μυστήρια της Εκκλησίας, στο οποίο επικαλούμαστε την ευλογία του Θεού για την ελεύθερη συζυγική ένωση, που βασίζεται στην αμοιβαία αγάπη του άνδρα και της γυναίκας, κατά την εικόνα της πνευματικής ένωσης του Χριστού και της Εκκλησίας του.</p><h2>Βιβλικές ρήσεις</h2><p>Στον γάμο τελείται μυστήριο που επιτελεί ο Θεός:</p><blockquote><p>«Καὶ εἶπεν κύριος ὁ θεός Οὐ καλὸν εἶναι τὸν ἄνθρωπον μόνον· ποιήσωμεν αὐτῷ βοηθὸν κατ᾿ αὐτόν. &lt;…&gt; καὶ ᾠκοδόμησεν κύριος ὁ θεὸς τὴν πλευράν, ἣν ἔλαβεν ἀπὸ τοῦ Αδαμ, εἰς γυναῖκα καὶ ἤγαγεν αὐτὴν πρὸς τὸν Αδαμ. &lt;…&gt; ἕνεκεν τούτου <strong>καταλείψει ἄνθρωπος τὸν πατέρα αὐτοῦ καὶ τὴν μητέρα αὐτοῦ καὶ προσκολληθήσεται πρὸς τὴν γυναῖκα αὐτοῦ, καὶ <mark>ἔσονται οἱ δύο εἰς σάρκα μίαν</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/gen/2/#L18,22,24">Γεν 2:18,22,24</a>)</p></blockquote><blockquote><p>«καὶ [προσελθόντες Φαρισαῖοι] ἐπηρώτων αὐτὸν εἰ ἔξεστιν ἀνδρὶ γυναῖκα ἀπολῦσαι, πειράζοντες αὐτόν. ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς, Τί ὑμῖν ἐνετείλατο Μωϋσῆς; οἱ δὲ εἶπαν, Ἐπέτρεψεν Μωϋσῆς βιβλίον ἀποστασίου γράψαι καὶ ἀπολῦσαι. ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς, Πρὸς τὴν σκληροκαρδίαν ὑμῶν ἔγραψεν ὑμῖν τὴν ἐντολὴν ταύτην. ἀπὸ δὲ ἀρχῆς κτίσεως ἄρσεν καὶ θῆλυ ἐποίησεν αὐτούς· ἕνεκεν τούτου καταλείψει ἄνθρωπος τὸν πατέρα αὐτοῦ καὶ τὴν μητέρα [καὶ προσκολληθήσεται πρὸς τὴν γυναῖκα αὐτοῦ], καὶ ἔσονται οἱ δύο εἰς σάρκα μίαν· ὥστε <strong><mark>οὐκέτι εἰσὶν δύο ἀλλὰ μία σάρξ</mark>. ὃ οὖν <mark>ὁ θεὸς συνέζευξεν</mark> ἄνθρωπος μὴ χωριζέτω</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mk/10/#L2-9">Μκ 10:2-9</a>)</p></blockquote><blockquote><p>«οὐκ οἴδατε ὅτι τὰ σώματα ὑμῶν μέλη Χριστοῦ ἐστιν; ἄρας οὖν τὰ μέλη τοῦ Χριστοῦ ποιήσω πόρνης μέλη; μὴ γένοιτο. [ἢ] οὐκ οἴδατε ὅτι ὁ κολλώμενος τῇ πόρνῃ ἓν σῶμά ἐστιν; <strong>Ἔσονται γάρ, φησίν, οἱ δύο εἰς σάρκα μίαν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/6/#L15-16">Α Κορ 6:15-16</a>)</p></blockquote><blockquote><p>«οὕτως ὀφείλουσιν καὶ οἱ ἄνδρες ἀγαπᾶν τὰς ἑαυτῶν γυναῖκας ὡς τὰ ἑαυτῶν σώματα. ὁ ἀγαπῶν τὴν ἑαυτοῦ γυναῖκα ἑαυτὸν ἀγαπᾷ, &lt;…&gt; ἀντὶ τούτου καταλείψει ἄνθρωπος τὸν πατέρα καὶ τὴν μητέρα καὶ προσκολληθήσεται πρὸς τὴν γυναῖκα αὐτοῦ, καὶ <strong>ἔσονται οἱ δύο εἰς σάρκα μίαν. τὸ μυστήριον τοῦτο μέγα ἐστίν</strong>, ἐγὼ δὲ λέγω εἰς Χριστὸν καὶ εἰς τὴν ἐκκλησίαν. πλὴν καὶ ὑμεῖς οἱ καθ᾿ ἕνα ἕκαστος τὴν ἑαυτοῦ γυναῖκα οὕτως ἀγαπάτω ὡς ἑαυτόν, ἡ δὲ γυνὴ ἵνα φοβῆται τὸν ἄνδρα.» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/5/#L28,31-33">Εφ 5:28,31-33</a>)</p></blockquote><h2>Για την εκκλησιαστική ευλογία του γάμου τον 1ο αιώνα</h2><h3>Ιγνάτιος ο Θεοφόρος, άγιος ιεράρχης (~37–107)</h3><blockquote><p>«πρέπει δὲ τοῖς γαμοῦσι καὶ ταῖς γαμουμέναις <strong>μετὰ γνώμης τοῦ ἐπισκόπου</strong> τὴν ἕνωσιν ποιεῖσθαι, ἵνα ὁ γάμος ᾖ κατὰ κύριον καὶ μὴ κατ ̓ ἐπιθυμίαν.»</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/ΙγνΘ_Πολ#HH-5">Ιγνάτιος, Προς Πολύκαρπον 5</a>)</p>
