  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: '<p>Στην αρχή ο Θεός δημιούργησε τον άνθρωπο (εβρ. אָדָ֗ם — Αδάμ):</p><blockquote><p>«καὶ <strong>ἔπλασεν ὁ θεὸς τὸν ἄνθρωπον</strong> χοῦν ἀπὸ τῆς γῆς καὶ ἐνεφύσησεν εἰς τὸ πρόσωπον αὐτοῦ πνοὴν ζωῆς, καὶ ἐγένετο ὁ ἄνθρωπος εἰς ψυχὴν ζῶσαν.» (<a href="https://bibleox.com/el/gr-lxx-byz/gen/2/#L7">Γεν 2:7</a>)</p></blockquote><p>Στη συνέχεια, από την πλευρά του Αδάμ δημιούργησε την Εύα:</p><blockquote><p>«τῷ δὲ Αδαμ <strong>οὐχ εὑρέθη βοηθὸς ὅμοιος αὐτῷ</strong>. — καὶ ἐπέβαλεν ὁ θεὸς ἔκστασιν ἐπὶ τὸν Αδαμ, καὶ ὕπνωσεν· καὶ ἔλαβεν μίαν τῶν πλευρῶν αὐτοῦ καὶ ἀνεπλήρωσεν σάρκα ἀντ αὐτῆς. καὶ <strong>ᾠκοδόμησεν κύριος ὁ θεὸς τὴν πλευράν, ἣν ἔλαβεν ἀπὸ τοῦ Αδαμ, εἰς γυναῖκα</strong> καὶ ἤγαγεν αὐτὴν πρὸς τὸν Αδαμ.» (<a href="https://bibleox.com/el/gr-lxx-byz/gen/2/#L20-22">Γεν 2:20-22</a>)</p></blockquote><p>Ο Αδάμ απέκτησε πολλά παιδιά:</p><blockquote><p>«ἐγένοντο δὲ αἱ ἡμέραι Αδαμ <strong>μετὰ τὸ γεννῆσαι αὐτὸν τὸν Σηθ</strong> ἑπτακόσια ἔτη, καὶ <strong>ἐγέννησεν υἱοὺς καὶ θυγατέρας</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/gen/5/#L4">Γεν 5:4</a>)</p></blockquote><p>Μετά τον Σηθ (δηλαδή είχαν ήδη γεννηθεί τρία αγόρια: ο Κάιν (<a href="https://bibleox.com/el/gr-lxx-byz/gen/4/#L1">Γεν 4:1</a>), ο Άβελ (<a href="https://bibleox.com/el/gr-lxx-byz/gen/4/#L2">Γεν 4:2</a>) και ο Σηθ (<a href="https://bibleox.com/el/gr-lxx-byz/gen/4/#L25">Γεν 4:25</a>)), γεννήθηκαν επιπλέον γιοι και κόρες. Ωστόσο, ο συγγραφέας της Γένεσης δεν τους δίνει πλέον καμία προσοχή, γιατί το βλέμμα του στρέφεται μόνο στις λεπτομέρειες της ιστορίας που θεωρεί σημαντικές για τον αναγνώστη. Στη συνέχεια απαριθμούνται μόνο ορισμένες γενεαλογικές γραμμές κατά πατέρες (σύμφωνα με την εβραϊκή παράδοση) από τον Κάιν και τον Σηθ. Από τον Κάιν αναφέρεται η γραμμή που οδηγεί στους εφευρέτες των μουσικών οργάνων (<a href="https://bibleox.com/el/gr-lxx-byz/gen/4/#L21">Γεν 4:21</a>), των όπλων (<a href="https://bibleox.com/el/gr-lxx-byz/gen/4/#L22">Γεν 4:22</a>), της πολυγαμίας (<a href="https://bibleox.com/el/gr-lxx-byz/gen/4/#L19">Γεν 4:19</a>). Αναφέρονται μερικοί πατέρες από τον Σηθ έως τον Νώε (<a href="https://bibleox.com/el/gr-lxx-byz/gen/5/#L6-29">Γεν 5:6-29</a>). Ο Σηθ γέννησε πολλούς γιους και κόρες (<a href="https://bibleox.com/el/gr-lxx-byz/gen/5/#L7">Γεν 5:7</a>), αλλά από αυτούς αναφέρεται μόνο ένας: ο Ενώς (<a href="https://bibleox.com/el/gr-lxx-byz/gen/4/#L26">Γεν 4:26</a>). Το ίδιο ισχύει και για τους υπόλοιπους. Έπειτα οι άνθρωποι πληθύνονται, λησμονούν τον Θεό, βυθίζονται πρώτα στις αμαρτίες και ύστερα στα νερά του κατακλυσμού. Όλοι οι άνθρωποι εκτός από την οικογένεια του Νώε πεθαίνουν. Και τώρα πια από την οικογένεια του Νώε κατάγονται όλες οι φυλές (<a href="https://bibleox.com/el/gr-lxx-byz/gen/9/#L19">Γεν 9:19</a>). Ο Νώε γέννησε τον Σημ, τον Χαμ και τον Ιάφεθ:</p><blockquote><p>«Καὶ ἦν Νωε ἐτῶν πεντακοσίων καὶ ἐγέννησεν Νωε τρεῖς υἱούς, τὸν Σημ, τὸν Χαμ, τὸν Ιαφεθ.» (<a href="https://bibleox.com/el/gr-lxx-byz/gen/5/#L32">Γεν 5:32</a>)</p></blockquote><blockquote><p>«ἐγέννησεν δὲ Νωε τρεῖς υἱούς, τὸν Σημ, τὸν Χαμ, τὸν Ιαφεθ.» (<a href="https://bibleox.com/el/gr-lxx-byz/gen/6/#L10">Γεν 6:10</a>)</p></blockquote><blockquote><p>«ἐν τῇ ἡμέρᾳ ταύτῃ εἰσῆλθεν Νωε, Σημ, Χαμ, Ιαφεθ, υἱοὶ Νωε, καὶ ἡ γυνὴ Νωε καὶ αἱ τρεῖς γυναῖκες τῶν υἱῶν αὐτοῦ μετ᾿ αὐτοῦ εἰς τὴν κιβωτόν.» (<a href="https://bibleox.com/el/gr-lxx-byz/gen/7/#L13">Γεν 7:13</a>)</p></blockquote><blockquote><p>«Ἦσαν δὲ οἱ υἱοὶ Νωε οἱ ἐξελθόντες ἐκ τῆς κιβωτοῦ Σημ, Χαμ, Ιαφεθ· Χαμ ἦν πατὴρ Χανααν.» (<a href="https://bibleox.com/el/gr-lxx-byz/gen/9/#L18">Γεν 9:18</a>)</p></blockquote><p>Ο Χαμ:</p><blockquote><p>«Υἱοὶ δὲ Χαμ· Χους καὶ Μεσραιμ, Φουδ καὶ Χανααν.» (<a href="https://bibleox.com/el/gr-lxx-byz/gen/10/#L6">Γεν 10:6</a>)</p></blockquote><blockquote><p>«Καὶ υἱοὶ Χαμ· Χους καὶ Μεστραιμ, Φουδ καὶ Χανααν.» (<a href="https://bibleox.com/el/gr-lxx-byz/1par/1/#L8">Α Παρ 1:8</a>)</p></blockquote><p><strong>Χους</strong> — Αιθιοπία (μαύροι); <strong>Μεστραιμ</strong> — Αίγυπτος (μελαμψοί); <strong>Φουδ</strong> — Λιβύη (λευκοί), <strong>Χανααν</strong> — το δυτικό τμήμα της εύφορης ημισελήνου (όχι μαύροι), ακριβώς αυτόν καταριέται ο Νώε (<a href="https://bibleox.com/el/gr-lxx-byz/gen/9/#L25,27">Γεν 9:25,27</a>). Επίσης και οι Σουμέριοι (όχι μαύροι) κατάγονται από απόγονο του Χους (τον Νεβρώδ — <a href="https://bibleox.com/el/gr-lxx-byz/gen/10/#L8">Γεν 10:8</a>). [<a href="https://www.youtube.com/watch?v=JPGyRZqSZkY">Αναλυτική εξέταση</a>] <strong><em>Σημείωση</em></strong><em>: οι γιοι του Αδάμ παντρεύονταν τις αδελφές τους. Δεν υπήρχε άλλος δρόμος για την εκπλήρωση της θείας εντολής περί πολλαπλασιασμού. Επιπλέον, παρόμοια κατάσταση προέκυψε και με τους εγγονούς του Νώε: όλοι οι άνθρωποι στη Γη μετά τον κατακλυσμό είναι στενοί συγγενείς. Η αιμομιξία γίνεται απαγορευμένη πολύ αργότερα, επί του προφήτη Μωυσή. Ο εβραϊκός λαός κατάγεται από έναν αδελφό και μια αδελφή: τον Αβραάμ και τη Σάρρα (</em><a href="https://bibleox.com/el/gr-lxx-byz/gen/20/#L12"><em>Γεν 20:12</em></a><em>). Στη συνέχεια το άρθρο χρειάζεται επεξεργασία. Είναι απαραίτητο να περιγραφούν οι πληροφορίες της Βίβλου για τους προπάτορες των λαών και των φυλών.</em></p>'
