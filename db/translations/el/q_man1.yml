  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: '<p>Σχετικά με την ενδυμασία, στην Παλαιά Διαθήκη συναντάμε την εξής απαγόρευση:</p><blockquote><p>«<strong>Οὐκ ἔσται σκεύη ἀνδρὸς ἐπὶ γυναικί, οὐδὲ μὴ ἐνδύσηται ἀνὴρ στολὴν γυναικείαν</strong>, ὅτι βδέλυγμα κυρίῳ τῷ θεῷ σού ἐστιν πᾶς ποιῶν ταῦτα.» (<a href="https://bibleox.com/el/gr-lxx-byz/vtor/22/#L5">Δτ 22:5</a>)</p></blockquote><p>Προφανώς, αυτή η απαγόρευση δίνεται κατά των διαστροφών, όταν δηλαδή ο άνθρωπος επιδιώκει ακριβώς να μοιάζει με το αντίθετο φύλο, έχει κάποιες μη φυσιολογικές καταστάσεις.</p><hr><p>Στην Καινή Διαθήκη υπάρχουν λόγια για το κάλυμμα της κεφαλής:</p><blockquote><p>«<strong>πᾶσα δὲ γυνὴ προσευχομένη ἢ προφητεύουσα ἀκατακαλύπτῳ τῇ κεφαλῇ</strong> καταισχύνει τὴν κεφαλὴν αὐτῆς· ἓν γάρ ἐστιν καὶ τὸ αὐτὸ τῇ ἐξυρημένῃ.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/11/#L5">Α Κορ 11:5</a>)</p></blockquote><p>Στον σύγχρονο κόσμο επινοήθηκαν για τις γυναίκες διάφορα ενδύματα, μεταξύ των οποίων και τα γυναικεία παντελόνια, αλλά στην εκκλησιαστική παράδοση επικράτησαν ορισμένοι κανόνες σχετικά με την εξωτερική εμφάνιση των πιστών (πρέπει να είναι σεμνή): στις γυναίκες συνιστάται να έρχονται με φούστες και σκεπασμένο κεφάλι, να χρησιμοποιούν όσο το δυνατόν λιγότερο καλλυντικά, ενώ στους άνδρες συνιστώνται μετρίως κλειστά ενδύματα (το σορτς και η αμάνικη φανέλα θα ήταν ακατάλληλα ενδύματα για τον ναό). Έτσι πρέπει να πράττουμε, ώστε να φαινόμαστε ευπρεπείς ενώπιον του Θεού (η εσωτερική τάξη δεν αρνείται και την εξωτερική τάξη), καθώς και να μην αποσπούμε με προκλητική εμφάνιση τους πλησίον μας, που ήρθαν στον ναό για να προσευχηθούν.</p><p>Έχοντας ορισμένες δυσκολίες στη ζωή για την τήρηση της παράδοσης, οι γυναίκες μερικές φορές παίρνουν μαζί τους ένα μαντήλι ή κάτι παρόμοιο, ώστε, πριν μπουν στον ναό, να το δέσουν πάνω από το παντελόνι.</p><p>Μερικές φορές, ορισμένοι πιστοί αντιδρούν ακατάλληλα σε όσους παραβιάζουν αυτή την παράδοση — ανθρώπους που δεν την παραβιάζουν κακόβουλα, αλλά απλώς, μη γνωρίζοντάς την, μπήκαν στον ναό για να ρωτήσουν ή να προσευχηθούν. Στους πιστούς που αντιδρούν έτσι προσπαθούν να εξηγήσουν ότι δεν πρέπει να τρομάζουν και να διώχνουν τους ανθρώπους, και πολύ περισσότερο να μην τους φέρονται απότομα.</p>'
