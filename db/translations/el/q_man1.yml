  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <blockquote><p>«ἢ οὐκ οἴδατε ὅτι <strong>τὸ σῶμα ὑμῶν ναὸς τοῦ ἐν ὑμῖν ἁγίου πνεύματός ἐστιν</strong>, οὗ ἔχετε ἀπὸ θεοῦ, καὶ οὐκ ἐστὲ ἑαυτῶν;» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/6/#L19">Α Κορ 6:19</a>)</p></blockquote><blockquote><p>«εἴ τις τὸν ναὸν τοῦ θεοῦ φθείρει, φθερεῖ τοῦτον ὁ θεός· ὁ γὰρ ναὸς τοῦ θεοῦ ἅγιός ἐστιν, <strong>οἵτινές ἐστε ὑμεῖς</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/3/#L17">Α Κορ 3:17</a>)</p></blockquote><blockquote><p>«οὐκ οἴδατε ὅτι <strong>ναὸς θεοῦ ἐστε</strong> καὶ τὸ πνεῦμα τοῦ θεοῦ οἰκεῖ ἐν ὑμῖν;» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/3/#L16">Α Κορ 3:16</a>)</p></blockquote><blockquote><p>«τίς δὲ συγκατάθεσις ναῷ θεοῦ μετὰ εἰδώλων; ἡμεῖς γὰρ <strong>ναὸς θεοῦ ἐσμεν ζῶντος</strong>· καθὼς εἶπεν ὁ θεὸς ὅτι <strong>Ἐνοικήσω ἐν αὐτοῖς καὶ ἐμπεριπατήσω</strong>, καὶ ἔσομαι αὐτῶν θεός, καὶ αὐτοὶ ἔσονταί μου λαός.» (<a href="https://bibleox.com/el/gr-lxx-byz/2kor/6/#L16">Β Κορ 6:16</a>)</p></blockquote><blockquote><p>«εἶπαν οὖν οἱ Ἰουδαῖοι, Τεσσαράκοντα καὶ ἓξ ἔτεσιν οἰκοδομήθη ὁ ναὸς οὗτος, καὶ σὺ ἐν τρισὶν ἡμέραις ἐγερεῖς αὐτόν; ἐκεῖνος δὲ ἔλεγεν περὶ τοῦ <strong>ναοῦ τοῦ σώματος αὐτοῦ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/2/#L20-21">Ιω 2:20-21</a>)</p></blockquote><blockquote><p>«Χριστὸς δὲ ὡς υἱὸς ἐπὶ τὸν οἶκον αὐτοῦ· οὗ <strong>οἶκός ἐσμεν ἡμεῖς</strong>, ἐὰν τὴν παρρησίαν καὶ τὸ καύχημα τῆς ἐλπίδος κατάσχωμεν.» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/3/#L6">Εβρ 3:6</a>)</p></blockquote><blockquote><p>«ἐν ᾧ πᾶσα οἰκοδομὴ συναρμολογουμένη αὔξει εἰς ναὸν ἅγιον ἐν κυρίῳ, ἐν ᾧ καὶ ὑμεῖς <strong>συνοικοδομεῖσθε εἰς κατοικητήριον τοῦ θεοῦ</strong> ἐν πνεύματι.» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/2/#L21-22">Εφ 2:21-22</a>)</p></blockquote>
