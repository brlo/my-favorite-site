  update: true
  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <h2>Ο άνθρωπος είναι πλασμένος για να είναι εικόνα και ομοίωση του Θεού:</h2><blockquote><p>«καὶ εἶπεν ὁ θεός Ποιήσωμεν ἄνθρωπον <strong>κατ᾿ εἰκόνα</strong> ἡμετέραν καὶ <strong>καθ᾿ ὁμοίωσιν</strong>, καὶ ἀρχέτωσαν τῶν ἰχθύων τῆς θαλάσσης καὶ τῶν πετεινῶν τοῦ οὐρανοῦ καὶ τῶν κτηνῶν καὶ πάσης τῆς γῆς καὶ πάντων τῶν ἑρπετῶν τῶν ἑρπόντων ἐπὶ τῆς γῆς.» (<a href="https://bibleox.com/el/gr-lxx-byz/gen/1/#L26">Γεν 1:26</a>)</p></blockquote><p>Ωστόσο, πλάθεται μόνο κατ' εικόνα:</p><blockquote><p>«καὶ <strong>ἐποίησεν</strong> ὁ θεὸς τὸν ἄνθρωπον, <strong>κατ᾿ εἰκόνα θεοῦ</strong> <strong>ἐποίησεν αὐτόν</strong>, ἄρσεν καὶ θῆλυ ἐποίησεν αὐτούς.» (<a href="https://bibleox.com/el/gr-lxx-byz/gen/1/#L27">Γεν 1:27</a>)</p></blockquote><blockquote><p>«Αὕτη ἡ βίβλος γενέσεως ἀνθρώπων· ᾗ ἡμέρᾳ ἐποίησεν ὁ θεὸς τὸν Αδαμ, <strong>κατ᾿ εἰκόνα θεοῦ ἐποίησεν αὐτόν</strong>·» (<a href="https://bibleox.com/el/gr-lxx-byz/gen/5/#L1">Γεν 5:1</a>)</p></blockquote><blockquote><p>«ὁ ἐκχέων αἷμα ἀνθρώπου ἀντὶ τοῦ αἵματος αὐτοῦ ἐκχυθήσεται, ὅτι <strong>ἐν εἰκόνι θεοῦ ἐποίησα τὸν ἄνθρωπον</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/gen/9/#L6">Γεν 9:6</a>)</p></blockquote><h3>Η εικόνα του Θεού στον άνθρωπο</h3><p>Αιώνια ύπαρξη:</p><blockquote><p>«ὅτι ὁ θεὸς ἔκτισεν τὸν ἄνθρωπον ἐπ᾿ ἀφθαρσίᾳ καὶ <strong>εἰκόνα τῆς ἰδίας ἀιδιότητος</strong> ἐποίησεν αὐτόν·» (<a href="https://bibleox.com/el/gr-lxx-byz/prs/2/#L23">Σ.Σολ 2:23</a>)</p></blockquote><h3>Η ομοίωση του Θεού στον άνθρωπο</h3><p>Ο άνθρωπος καλείται μόνο να ομοιωθεί με τον Θεό:</p><blockquote><p>«ἄρατε τὸν ζυγόν μου ἐφ᾿ ὑμᾶς καὶ <strong>μάθετε ἀπ᾿ ἐμοῦ</strong>, ὅτι πραΰς εἰμι καὶ ταπεινὸς τῇ καρδίᾳ, καὶ <strong>εὑρήσετε ἀνάπαυσιν</strong> ταῖς ψυχαῖς ὑμῶν·» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/11/#L29">Μτ 11:29</a>)</p></blockquote><blockquote><p>«ὅτι οὓς προέγνω, καὶ προώρισεν <strong>συμμόρφους τῆς εἰκόνος τοῦ υἱοῦ αὐτοῦ</strong>, εἰς τὸ εἶναι αὐτὸν πρωτότοκον ἐν πολλοῖς ἀδελφοῖς·» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/8/#L29">Ρωμ 8:29</a>)</p></blockquote>
