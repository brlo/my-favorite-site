  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <p>Ο προφήτης Ησαΐας επιτρέπει τη θεραπεία με φαρμακευτικά μέσα:</p><blockquote><p>«καὶ εἶπεν <strong>Λαβέτωσαν παλάθην σύκων καὶ ἐπιθέτωσαν ἐπὶ τὸ ἕλκος</strong>, καὶ ὑγιάσει.» (<a href="https://bibleox.com/el/gr-lxx-byz/4ts/20/#L7">Δ Βασ 20:7</a>)</p></blockquote><p>Ο Θεός δημιούργησε τα φυτά έτσι, ώστε μερικά από αυτά να έχουν φαρμακευτικές ιδιότητες:</p><blockquote><p>«Τίμα ἰατρὸν πρὸς τὰς χρείας αὐτοῦ τιμαῖς αὐτοῦ, καὶ γὰρ αὐτὸν ἔκτισεν κύριος· παρὰ γὰρ ὑψίστου ἐστὶν ἴασις, καὶ παρὰ βασιλέως λήμψεται δόμα. ἐπιστήμη ἰατροῦ ἀνυψώσει κεφαλὴν αὐτοῦ, καὶ ἔναντι μεγιστάνων θαυμασθήσεται. <strong>κύριος ἔκτισεν ἐκ γῆς φάρμακα</strong>, καὶ ἀνὴρ φρόνιμος οὐ προσοχθιεῖ αὐτοῖς.» (<a href="https://bibleox.com/el/gr-lxx-byz/prsir/38/#L1-4">Σ.Σειρ 38:1-4</a>)</p></blockquote><p>Η ελπίδα στον Θεό όταν καταφεύγουμε στον γιατρό:</p><blockquote><p>«<em>Τέκνον, </em><strong><em>ἐν ἀρρωστήματί σου μὴ παράβλεπε, ἀλλ᾿ εὖξαι κυρίῳ, καὶ αὐτὸς ἰάσεταί σε</em></strong><em>· ἀπόστησον πλημμέλειαν καὶ εὔθυνον χεῖρας καὶ ἀπὸ πάσης ἁμαρτίας καθάρισον καρδίαν· δὸς εὐωδίαν καὶ μνημόσυνον σεμιδάλεως καὶ λίπανον προσφορὰν ὡς μὴ ὑπάρχων. </em><strong><em>καὶ ἰατρῷ δὸς τόπον, καὶ γὰρ αὐτὸν ἔκτισεν κύριος, καὶ μὴ ἀποστήτω σου, καὶ γὰρ αὐτοῦ χρεία</em></strong><em>. ἔστιν καιρὸς ὅτε καὶ ἐν χερσὶν αὐτῶν εὐοδία· καὶ γὰρ αὐτοὶ κυρίου δεηθήσονται, ἵνα εὐοδώσῃ αὐτοῖς ἀνάπαυσιν καὶ ἴασιν χάριν ἐμβιώσεως.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/prsir/38/#L9-14">Σ.Σειρ 38:9-14</a>)</p></blockquote><p>Είναι λάθος να στηρίζουμε όλη την ελπίδα μόνο στους γιατρούς:</p><blockquote><p>«καὶ ἐν τῇ μαλακίᾳ αὐτοῦ οὐκ ἐζήτησεν κύριον, ἀλλὰ τοὺς ἰατρούς.» (<a href="https://bibleox.com/el/gr-lxx-byz/2par/16/#L12">Β Παρ 16:12</a>)</p></blockquote><p>Ο απόστολος και ευαγγελιστής Λουκάς ήταν γιατρός:</p><blockquote><p>«Λουκᾶς ὁ ἰατρὸς ὁ ἀγαπητὸς» (<a href="https://bibleox.com/el/gr-lxx-byz/kol/4/#L14">Κολ 4:14</a>)</p></blockquote>
