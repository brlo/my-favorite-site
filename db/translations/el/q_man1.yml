  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <h2>Μέσω των ιερών λειψάνων</h2><blockquote><p>«καὶ ἐγένετο αὐτῶν θαπτόντων τὸν ἄνδρα καὶ ἰδοὺ εἶδον τὸν μονόζωνον καὶ ἔρριψαν τὸν ἄνδρα ἐν τῷ τάφῳ Ελισαιε, καὶ ἐπορεύθη καὶ ἥψατο <strong>τῶν ὀστέων Ελισαιε</strong> καὶ ἔζησεν καὶ ἀνέστη ἐπὶ τοὺς πόδας αὐτοῦ» (<a href="https://bibleox.com/el/gr-lxx-byz/4ts/13/#L21">Δ Βασ 13:21</a>).</p></blockquote><h2>Μέσω του ύδατος</h2><blockquote><p>«καὶ εἶπεν αὐτῷ, Ὕπαγε <strong>νίψαι εἰς τὴν κολυμβήθραν τοῦ Σιλωάμ</strong> [ὃ ἑρμηνεύεται Ἀπεσταλμένος]. ἀπῆλθεν οὖν καὶ ἐνίψατο, καὶ ἦλθεν βλέπων.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/9/#L7">Ιω 9:7</a>)</p></blockquote><h2>Μέσω των ενδυμάτων</h2><blockquote><p>«ὥστε καὶ ἐπὶ τοὺς ἀσθενοῦντας ἀποφέρεσθαι <strong>ἀπὸ τοῦ χρωτὸς αὐτοῦ σουδάρια ἢ σιμικίνθια</strong> καὶ ἀπαλλάσσεσθαι ἀπ᾿ αὐτῶν τὰς νόσους, τά τε πνεύματα τὰ πονηρὰ ἐκπορεύεσθαι.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/19/#L12">Πραξ 19:12</a>)</p></blockquote><h2>Μέσω της σκιάς του αποστόλου</h2><blockquote><p>«ὥστε καὶ εἰς τὰς πλατείας <strong>ἐκφέρειν τοὺς ἀσθενεῖς</strong> καὶ τιθέναι ἐπὶ κλιναρίων καὶ κραβάττων, <strong>ἵνα ἐρχομένου Πέτρου κἂν ἡ σκιὰ ἐπισκιάσῃ τινὶ αὐτῶν</strong>. συνήρχετο δὲ καὶ τὸ πλῆθος τῶν πέριξ πόλεων Ἰερουσαλήμ, φέροντες ἀσθενεῖς καὶ ὀχλουμένους ὑπὸ πνευμάτων ἀκαθάρτων, <strong>οἵτινες ἐθεραπεύοντο ἅπαντες</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/5/#L15-16">Πραξ 5:15-16</a>)</p></blockquote><h2>Άμεσα, με τον λόγο του Θεού</h2><blockquote><p>«διὸ οὐδὲ ἐμαυτὸν ἠξίωσα πρὸς σὲ ἐλθεῖν· ἀλλὰ <strong>εἰπὲ λόγῳ, καὶ ἰαθήτω ὁ παῖς μου</strong>. &lt;…&gt; καὶ ὑποστρέψαντες εἰς τὸν οἶκον οἱ πεμφθέντες εὗρον τὸν δοῦλον ὑγιαίνοντα.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/7/#L7,10">Λκ 7:7,10</a>)</p></blockquote><h2>Η ενέργεια της χάριτος μέσω αντικειμένων</h2><blockquote><p>«καὶ σὺ ἔπαρον τῇ <strong>ῥάβδῳ</strong> σου καὶ ἔκτεινον τὴν χεῖρά σου ἐπὶ τὴν θάλασσαν καὶ ῥῆξον αὐτήν, καὶ εἰσελθάτωσαν οἱ υἱοὶ Ισραηλ εἰς μέσον τῆς θαλάσσης κατὰ τὸ ξηρόν.» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/14/#L16">Έξ 14:16</a>)</p></blockquote>
