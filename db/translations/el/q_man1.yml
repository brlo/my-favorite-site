  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <blockquote><p>«<strong><mark>πλούσιοι πτωχῶν ἄρξουσιν</mark></strong>, καὶ οἰκέται ἰδίοις δεσπόταις δανιοῦσιν.» (<a href="https://bibleox.com/el/gr-lxx-byz/pr/22/#L7">Πρμ 22:7</a>)</p></blockquote><blockquote><p>«μὴ δίδου σεαυτὸν εἰς ἐγγύην αἰσχυνόμενος πρόσωπον· <strong><mark>ἐὰν γὰρ μὴ ἔχῃς πόθεν ἀποτείσῃς</mark></strong>, λήμψονται τὸ στρῶμα τὸ ὑπὸ τὰς πλευράς σου.» (<a href="https://bibleox.com/el/gr-lxx-byz/pr/22/#L26-27">Πρμ 22:26-27</a>)</p></blockquote><blockquote><p>«ἔστιν δὲ <strong>πορισμὸς μέγας ἡ εὐσέβεια μετὰ αὐταρκείας</strong>· οὐδὲν γὰρ εἰσηνέγκαμεν εἰς τὸν κόσμον, ὅτι οὐδὲ ἐξενεγκεῖν τι δυνάμεθα· <strong><mark>ἔχοντες δὲ διατροφὰς καὶ σκεπάσματα, τούτοις ἀρκεσθησόμεθα</mark></strong>. οἱ δὲ βουλόμενοι πλουτεῖν ἐμπίπτουσιν εἰς πειρασμὸν καὶ παγίδα καὶ ἐπιθυμίας πολλὰς ἀνοήτους καὶ βλαβεράς, αἵτινες βυθίζουσιν τοὺς ἀνθρώπους εἰς ὄλεθρον καὶ ἀπώλειαν· <strong><mark>ῥίζα γὰρ πάντων τῶν κακῶν ἐστιν ἡ φιλαργυρία</mark></strong>, ἧς τινες ὀρεγόμενοι ἀπεπλανήθησαν ἀπὸ τῆς πίστεως καὶ ἑαυτοὺς περιέπειραν ὀδύναις πολλαῖς.» (<a href="https://bibleox.com/el/gr-lxx-byz/1tim/6/#L6-10">Α Τιμ 6:6-10</a>)</p></blockquote><blockquote><p>«Ἀφιλάργυρος ὁ τρόπος· <strong><mark>ἀρκούμενοι τοῖς παροῦσιν</mark></strong>· αὐτὸς γὰρ εἴρηκεν, Οὐ μή σε ἀνῶ οὐδ᾿ οὐ μή σε ἐγκαταλίπω·» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/13/#L5">Εβρ 13:5</a>)</p></blockquote>
