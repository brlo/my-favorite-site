  update: true
  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <p>Η σύνθεση της φύσης του ανθρώπου:</p><ol><li><p>Το σαρκικό σώμα;</p></li><li><p>Η ψυχή;</p></li><li><p>Το πνεύμα (η δύναμη της ψυχής).</p></li></ol><h2>Η σάρκα</h2><blockquote><p>«δεκαμηνιαίῳ χρόνῳ <strong>παγεὶς ἐν αἵματι</strong> ἐκ σπέρματος ἀνδρὸς καὶ ἡδονῆς ὕπνῳ συνελθούσης.» (<a href="https://bibleox.com/el/gr-lxx-byz/prs/7/#L2">Σ.Σολ 7:2</a>)</p></blockquote><h2>Η ψυχή και το πνεύμα</h2><blockquote><p>«Αὐτὸς δὲ ὁ θεὸς τῆς εἰρήνης ἁγιάσαι ὑμᾶς <strong>ὁλοτελεῖς</strong>, καὶ ὁλόκληρον ὑμῶν <strong>τὸ πνεῦμα</strong> καὶ <strong>ἡ ψυχὴ</strong> καὶ <strong>τὸ σῶμα</strong> ἀμέμπτως ἐν τῇ παρουσίᾳ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ τηρηθείη.» (<a href="https://bibleox.com/el/gr-lxx-byz/1sol/5/#L23">Α Θεσ 5:23</a>)</p></blockquote><blockquote><p>«ἀλλ᾿ ἢ <strong>αἱ σάρκες αὐτοῦ</strong> ἤλγησαν, <strong>ἡ δὲ ψυχὴ αὐτοῦ</strong> ἐπένθησεν.» (<a href="https://bibleox.com/el/gr-lxx-byz/iov/14/#L22">Ιωβ 14:22</a>)</p></blockquote><blockquote><p>«Ὁ θεὸς ὁ θεός μου, πρὸς σὲ ὀρθρίζω· ἐδίψησέν σοι <strong>ἡ ψυχή μου</strong>. ποσαπλῶς σοι <strong>ἡ σάρξ μου</strong> ἐν γῇ ἐρήμῳ καὶ ἀβάτῳ καὶ ἀνύδρῳ;» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/62/#L1">Ψλ 62:1</a>)</p></blockquote><blockquote><p>«ἐπιποθεῖ καὶ ἐκλείπει <strong>ἡ ψυχή μου</strong> εἰς τὰς αὐλὰς τοῦ κυρίου, ἡ καρδία μου καὶ <strong>ἡ σάρξ μου</strong> ἠγαλλιάσαντο ἐπὶ θεὸν ζῶντα.» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/83/#L2">Ψλ 83:2</a>)</p></blockquote><blockquote><p>«<strong>τῇ ψυχῇ αὐτοῦ</strong> ἀγαθὸν ποιεῖ ἀνὴρ ἐλεήμων, ἐξολλύει δὲ αὐτοῦ <strong>σῶμα</strong> ὁ ἀνελεήμων.» (<a href="https://bibleox.com/el/gr-lxx-byz/pr/11/#L17">Πρμ 11:17</a>)</p></blockquote><h2>Με τον θάνατο του ανθρώπου χωρίζονται η ψυχή και το σώμα του</h2><blockquote><p>«καὶ μὴ φοβεῖσθε ἀπὸ <strong>τῶν ἀποκτεννόντων τὸ σῶμα, τὴν δὲ ψυχὴν μὴ δυναμένων ἀποκτεῖναι</strong>· φοβεῖσθε δὲ μᾶλλον τὸν δυνάμενον καὶ ψυχὴν καὶ σῶμα ἀπολέσαι ἐν γεέννῃ.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/10/#L28">Μτ 10:28</a> · <a href="https://bibleox.com/el/gr-lxx-byz/lk/12/#L4">Λκ 12:4</a>)</p></blockquote><blockquote><p>«καθεζόμενος δέ τις νεανίας ὀνόματι Εὔτυχος ἐπὶ τῆς θυρίδος, καταφερόμενος ὕπνῳ βαθεῖ διαλεγομένου τοῦ Παύλου ἐπὶ πλεῖον, κατενεχθεὶς ἀπὸ τοῦ ὕπνου <strong>ἔπεσεν</strong> ἀπὸ τοῦ τριστέγου κάτω καὶ <strong>ἤρθη νεκρός</strong>. καταβὰς δὲ ὁ Παῦλος ἐπέπεσεν αὐτῷ καὶ συμπεριλαβὼν εἶπεν, <strong>Μὴ θορυβεῖσθε, ἡ γὰρ ψυχὴ αὐτοῦ ἐν αὐτῷ ἐστιν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/20/#L9-10">Πραξ 20:9-10</a>)</p></blockquote><h2>Μετά τον θάνατο η σάρκα του ανθρώπου αποσυντίθεται, αλλά η ψυχή συνεχίζει να υπάρχει</h2><blockquote><p>«προϊδὼν ἐλάλησεν περὶ τῆς ἀναστάσεως τοῦ Χριστοῦ ὅτι οὔτε <strong>ἐγκατελείφθη εἰς ᾅδην</strong> οὔτε <strong>ἡ σὰρξ αὐτοῦ</strong> εἶδεν διαφθοράν.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/2/#L31">Πραξ 2:31</a>)</p></blockquote><p>Ρήσεις για την αθανασία της ψυχής του ανθρώπου.</p><h2>Με την ανάσταση αποκαθίσταται η προηγούμενη σάρκα του ίδιου του ανθρώπου, και η ψυχή επιστρέφει, ενωνόμενη με τη σάρκα της</h2><blockquote><p>«<strong>οἶδα γὰρ ὅτι ἀέναός ἐστιν ὁ ἐκλύειν με μέλλων ἐπὶ γῆς. <mark>ἀναστήσαι</mark> <mark>τὸ δέρμα μου</mark> <mark>τὸ ἀνατλῶν ταῦτα</mark>· παρὰ γὰρ κυρίου ταῦτά μοι συνετελέσθη, ἃ ἐγὼ ἐμαυτῷ συνεπίσταμαι, <mark>ἃ ὁ ὀφθαλμός μου ἑόρακεν</mark> <mark>καὶ οὐκ ἄλλος</mark>· πάντα δέ μοι συντετέλεσται ἐν κόλπῳ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/iov/19/#L25-27">Ιωβ 19:25-27</a>)</p></blockquote>
