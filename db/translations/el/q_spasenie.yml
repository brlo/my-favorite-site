  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: '<h2>Τι είναι η σωτηρία</h2><p><strong>Η σωτηρία</strong> — η αιώνια ζωή με τον Θεό (<a href="https://bibleox.com/el/gr-lxx-byz/rim/2/#L5-8">Ρωμ 2:5-8</a> · <a href="https://bibleox.com/el/gr-lxx-byz/mf/19/#L17">Μτ 19:17</a>), η σωτηρία από τον θάνατο (<a href="https://bibleox.com/el/gr-lxx-byz/iak/5/#L19-20">Ιακ 5:19-20</a>), η νέα μεταμορφωμένη ζωή (<a href="https://bibleox.com/el/gr-lxx-byz/fil/3/#L21">Φιλ 3:21</a> · <a href="https://bibleox.com/el/gr-lxx-byz/2pet/1/#L3-4">Β Πε 1:3-4</a>).</p><h3>Η αιώνια ζωή με τον Θεό</h3><blockquote><p>«Εἰ δὲ ἡ χείρ σου ἢ ὁ πούς σου σκανδαλίζει σε, ἔκκοψον αὐτὸν καὶ βάλε ἀπὸ σοῦ· καλόν σοί ἐστιν <strong>εἰσελθεῖν εἰς τὴν ζωὴν</strong> κυλλὸν ἢ χωλόν, ἢ δύο χεῖρας ἢ δύο πόδας ἔχοντα βληθῆναι εἰς τὸ πῦρ τὸ αἰώνιον.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/18/#L8">Μτ 18:8</a>)</p></blockquote><blockquote><p>«ὁ δὲ εἶπεν αὐτῷ, Τί με ἐρωτᾷς περὶ τοῦ ἀγαθοῦ; εἷς ἐστιν ὁ ἀγαθός. <strong>εἰ δὲ θέλεις εἰς τὴν ζωὴν εἰσελθεῖν</strong>, τήρησον τὰς ἐντολάς.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/19/#L17">Μτ 19:17</a>)</p></blockquote><h3>Η θέωση</h3><blockquote><p>«Ὡς πάντα ἡμῖν <strong>τῆς θείας δυνάμεως αὐτοῦ</strong> τὰ πρὸς ζωὴν καὶ εὐσέβειαν δεδωρημένης διὰ τῆς ἐπιγνώσεως τοῦ καλέσαντος ἡμᾶς ἰδίᾳ δόξῃ καὶ ἀρετῇ, δι᾿ ὧν <strong>τὰ τίμια καὶ μέγιστα ἡμῖν ἐπαγγέλματα δεδώρηται, ἵνα διὰ τούτων γένησθε θείας κοινωνοὶ φύσεως</strong>, ἀποφυγόντες τῆς ἐν τῷ κόσμῳ ἐν ἐπιθυμίᾳ φθορᾶς.» (<a href="https://bibleox.com/el/gr-lxx-byz/2pet/1/#L3-4">Β Πε 1:3-4</a>)</p></blockquote><blockquote><p>«ὃς <strong>μετασχηματίσει τὸ σῶμα τῆς ταπεινώσεως ἡμῶν σύμμορφον τῷ σώματι τῆς δόξης αὐτοῦ</strong> κατὰ τὴν ἐνέργειαν τοῦ δύνασθαι αὐτὸν καὶ ὑποτάξαι αὑτῷ τὰ πάντα.» (<a href="https://bibleox.com/el/gr-lxx-byz/fil/3/#L21">Φιλ 3:21</a>)</p></blockquote><p><a href="https://bibleox.com/el/gr-lxx-byz/in/17/#L21-23">Ιω 17:21-23</a> · <a href="https://bibleox.com/el/gr-lxx-byz/1in/3/#L2">Α Ιω 3:2</a> · <a href="https://bibleox.com/el/gr-lxx-byz/ps/81/#L6">Ψλ 81:6</a> · <a href="https://bibleox.com/el/gr-lxx-byz/gal/2/#L20">Γαλ 2:20</a> · <a href="https://bibleox.com/el/gr-lxx-byz/rim/8/#L14,16">Ρωμ 8:14,16</a></p><h2>Οι προϋποθέσεις της σωτηρίας</h2><h3>Η ορθή πίστη στον Χριστό</h3><blockquote><p>«<strong>ἐν τῷ ὀνόματι Ἰησοῦ Χριστοῦ</strong> τοῦ Ναζωραίου, ὃν ὑμεῖς ἐσταυρώσατε, ὃν ὁ θεὸς ἤγειρεν ἐκ νεκρῶν, ἐν τούτῳ οὗτος παρέστηκεν ἐνώπιον ὑμῶν ὑγιής. οὗτός ἐστιν ὁ λίθος ὁ ἐξουθενηθεὶς ὑφ᾿ ὑμῶν τῶν οἰκοδόμων, ὁ γενόμενος εἰς κεφαλὴν γωνίας. καὶ <strong>οὐκ ἔστιν ἐν ἄλλῳ οὐδενὶ ἡ σωτηρία</strong>, οὐδὲ γὰρ <strong>ὄνομά ἐστιν ἕτερον ὑπὸ τὸν οὐρανὸν τὸ δεδομένον ἐν ἀνθρώποις ἐν ᾧ δεῖ σωθῆναι ἡμᾶς</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/4/#L10-12">Πραξ 4:10-12</a>)</p></blockquote><blockquote><p>«<strong>χωρὶς δὲ πίστεως ἀδύνατον εὐαρεστῆσαι</strong>, πιστεῦσαι γὰρ δεῖ τὸν προσερχόμενον τῷ θεῷ ὅτι ἔστιν καὶ τοῖς ἐκζητοῦσιν αὐτὸν μισθαποδότης γίνεται.» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/11/#L6">Εβρ 11:6</a>)</p></blockquote><blockquote><p>«πᾶς <strong>ὁ προάγων καὶ μὴ μένων ἐν τῇ <mark>διδαχῇ τοῦ Χριστοῦ</mark> θεὸν οὐκ ἔχει</strong>· ὁ μένων <strong>ἐν τῇ διδαχῇ</strong>, οὗτος καὶ τὸν πατέρα καὶ τὸν υἱὸν ἔχει.» (<a href="https://bibleox.com/el/gr-lxx-byz/2in/1/#L9">Β Ιω 1:9</a>)</p></blockquote><blockquote><p><em>«φανερὰ δέ ἐστιν </em><strong><em>τὰ ἔργα τῆς σαρκός</em></strong><em>, ἅτινά ἐστιν πορνεία, ἀκαθαρσία, ἀσέλγεια, εἰδωλολατρία, φαρμακεία, ἔχθραι, ἔρις, ζῆλος, θυμοί, ἐριθείαι, διχοστασίαι, </em><strong><em><mark>αἱρέσεις</mark></em></strong><em>, φθόνοι, μέθαι, κῶμοι, καὶ τὰ ὅμοια τούτοις, ἃ προλέγω ὑμῖν καθὼς προεῖπον ὅτι </em><strong><em>οἱ τὰ τοιαῦτα πράσσοντες <mark>βασιλείαν θεοῦ οὐ κληρονομήσουσιν</mark></em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/gal/5/#L19-21"><em>Γαλ 5:19-21</em></a><em>)</em></p></blockquote><h3>Τα έργα της πίστεως</h3><h4>Η τήρηση των εντολών</h4><blockquote><p>«εἰ δὲ θέλεις εἰς τὴν ζωὴν εἰσελθεῖν, <strong><mark>τήρησον τὰς ἐντολάς</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/19/#L17">Μτ 19:17</a>)</p></blockquote><blockquote><p>«Πᾶς οὖν ὅστις <strong>ἀκούει μου τοὺς λόγους τούτους καὶ <mark>ποιεῖ</mark></strong> αὐτοὺς ὁμοιωθήσεται ἀνδρὶ φρονίμῳ, ὅστις ᾠκοδόμησεν αὐτοῦ τὴν οἰκίαν ἐπὶ τὴν πέτραν.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/7/#L24">Μτ 7:24</a>)</p></blockquote><blockquote><p>«πᾶς ὁ ἐρχόμενος πρός με καὶ <strong>ἀκούων μου τῶν λόγων καὶ <mark>ποιῶν</mark> αὐτούς</strong>, ὑποδείξω ὑμῖν τίνι ἐστὶν ὅμοιος· ὅμοιός ἐστιν ἀνθρώπῳ οἰκοδομοῦντι οἰκίαν ὃς ἔσκαψεν καὶ ἐβάθυνεν καὶ ἔθηκεν θεμέλιον ἐπὶ τὴν πέτραν· πλημμύρης δὲ γενομένης προσέρηξεν ὁ ποταμὸς τῇ οἰκίᾳ ἐκείνῃ, καὶ οὐκ ἴσχυσεν σαλεῦσαι αὐτὴν διὰ τὸ καλῶς οἰκοδομῆσθαι αὐτήν. <strong>ὁ δὲ ἀκούσας καὶ <mark>μὴ ποιήσας</mark> ὅμοιός ἐστιν ἀνθρώπῳ οἰκοδομήσαντι οἰκίαν ἐπὶ τὴν γῆν χωρὶς θεμελίου</strong>, ᾗ προσέρηξεν ὁ ποταμός, καὶ εὐθὺς <strong>συνέπεσεν</strong>, καὶ ἐγένετο τὸ ῥῆγμα τῆς οἰκίας ἐκείνης μέγα.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/6/#L47-49">Λκ 6:47-49</a>)</p></blockquote><blockquote><p>«Γίνεσθε δὲ <strong><mark>ποιηταὶ λόγου</mark></strong> καὶ μὴ ἀκροαταὶ μόνον παραλογιζόμενοι ἑαυτούς. ὅτι εἴ τις ἀκροατὴς λόγου ἐστὶν καὶ οὐ ποιητής, οὗτος ἔοικεν ἀνδρὶ κατανοοῦντι τὸ πρόσωπον τῆς γενέσεως αὐτοῦ ἐν ἐσόπτρῳ·» (<a href="https://bibleox.com/el/gr-lxx-byz/iak/1/#L22-23">Ιακ 1:22-23</a>)</p></blockquote><h4>Η ανάγκη της ζωής στην Εκκλησία</h4><blockquote><p>«ὁ Χριστὸς κεφαλὴ τῆς ἐκκλησίας, αὐτὸς <strong><mark>σωτὴρ τοῦ σώματος</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/5/#L23">Εφ 5:23</a>)</p></blockquote><blockquote><p>«<strong><mark>σώματος</mark> αὐτοῦ</strong>, ὅ ἐστιν ἡ <strong><mark>ἐκκλησία</mark></strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/kol/1/#L24">Κολ 1:24</a>)</p></blockquote><blockquote><p>«καὶ γὰρ <strong>ἐν ἑνὶ πνεύματι ἡμεῖς πάντες <mark>εἰς ἓν σῶμα ἐβαπτίσθημεν</mark></strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/12/#L13">Α Κορ 12:13</a>)</p></blockquote><blockquote><p>«ὅσοι γὰρ <strong>εἰς Χριστὸν <mark>ἐβαπτίσθητε, Χριστὸν ἐνεδύσασθε</mark></strong>·» (<a href="https://bibleox.com/el/gr-lxx-byz/gal/3/#L27">Γαλ 3:27</a>)</p></blockquote><blockquote><p>«ὁ δὲ κύριος <strong><mark>προσετίθει τοὺς σῳζομένους καθ᾿ ἡμέραν ἐπὶ τὸ αὐτό</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/2/#L47">Πραξ 2:47</a>)</p></blockquote><h4>Το βάπτισμα</h4><p>Το Βάπτισμα ονομάζεται επίσης «γέννηση άνωθεν»:</p><blockquote><p>«<strong>ἐὰν μή τις <mark>γεννηθῇ ἐξ ὕδατος καὶ πνεύματος</mark></strong>, <strong>οὐ δύναται εἰσελθεῖν εἰς τὴν βασιλείαν τοῦ θεοῦ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/3/#L5">Ιω 3:5</a>)</p></blockquote><p>Περισσότερα: το βάπτισμα</p><h4>Η κοινωνία της σάρκας και του αίματος του Χριστού</h4><blockquote><p>«εἶπεν οὖν αὐτοῖς ὁ Ἰησοῦς, Ἀμὴν ἀμὴν λέγω ὑμῖν, <strong>ἐὰν μὴ <mark>φάγητε τὴν σάρκα τοῦ υἱοῦ τοῦ ἀνθρώπου καὶ πίητε αὐτοῦ τὸ αἷμα</mark>, οὐκ ἔχετε ζωὴν ἐν ἑαυτοῖς</strong>. ὁ τρώγων μου τὴν σάρκα καὶ πίνων μου τὸ αἷμα ἔχει ζωὴν αἰώνιον, κἀγὼ <strong>ἀναστήσω αὐτὸν τῇ ἐσχάτῃ ἡμέρᾳ</strong>·» (<a href="https://bibleox.com/el/gr-lxx-byz/in/6/#L53-54">Ιω 6:53-54</a>)</p></blockquote><p>Περισσότερα: <a href="https://bibleox.com/el/el/w/%CE%97_%CE%98%CE%B5%CE%AF%CE%B1_%CE%95%CF%85%CF%87%CE%B1%CF%81%CE%B9%CF%83%CF%84%CE%AF%CE%B1">η Θεία Ευχαριστία</a></p><h2>Δεν αρκεί μόνο η πίστη, χρειάζονται και τα έργα για τη σωτηρία</h2><h3>Η πίστη χωρίς έργα δεν σώζει</h3><blockquote><p>«ἔχετε τὴν πίστιν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ τῆς δόξης. &lt;…&gt; Τί τὸ ὄφελος, ἀδελφοί μου, <strong>ἐὰν πίστιν λέγῃ τις ἔχειν, <mark>ἔργα δὲ μὴ ἔχῃ; μὴ δύναται ἡ πίστις σῶσαι αὐτόν</mark></strong>; ἐὰν ἀδελφὸς ἢ ἀδελφὴ γυμνοὶ ὑπάρχωσιν καὶ λειπόμενοι τῆς ἐφημέρου τροφῆς, εἴπῃ δέ τις αὐτοῖς ἐξ ὑμῶν, Ὑπάγετε ἐν εἰρήνῃ, θερμαίνεσθε καὶ χορτάζεσθε, μὴ δῶτε δὲ αὐτοῖς τὰ ἐπιτήδεια τοῦ σώματος, τί τὸ ὄφελος; <strong><mark>οὕτως καὶ ἡ πίστις, ἐὰν μὴ ἔχῃ ἔργα, νεκρά</mark> ἐστιν καθ᾿ ἑαυτήν</strong>. Ἀλλ᾿ ἐρεῖ τις, Σὺ πίστιν ἔχεις κἀγὼ ἔργα ἔχω. δεῖξόν μοι τὴν πίστιν σου χωρὶς τῶν ἔργων, κἀγώ σοι δείξω ἐκ τῶν ἔργων μου τὴν πίστιν. σὺ πιστεύεις ὅτι εἷς θεός ἐστιν; καλῶς ποιεῖς· καὶ <strong>τὰ δαιμόνια πιστεύουσιν</strong> καὶ φρίσσουσιν. θέλεις δὲ γνῶναι, ὦ ἄνθρωπε κενέ, ὅτι <strong><mark>ἡ πίστις χωρὶς τῶν ἔργων ἀργή ἐστιν</mark></strong>;» (<a href="https://bibleox.com/el/gr-lxx-byz/iak/2/#L1,14-20">Ιακ 2:1,14-20</a>)</p></blockquote><h3>Πολλοί που πράττουν την ανομία θα χαθούν, αν και όχι μόνο πίστευαν, αλλά και έκαναν θαύματα στο όνομα του Χριστού</h3><blockquote><p><em>«</em><strong><em>πολλοὶ</em></strong><em> ἐροῦσίν μοι ἐν ἐκείνῃ τῇ ἡμέρᾳ, Κύριε κύριε, οὐ τῷ σῷ ὀνόματι </em><strong><em>ἐπροφητεύσαμεν</em></strong><em>, καὶ τῷ σῷ ὀνόματι </em><strong><em>δαιμόνια ἐξεβάλομεν</em></strong><em>, καὶ τῷ σῷ ὀνόματι </em><strong><em>δυνάμεις πολλὰς ἐποιήσαμεν</em></strong><em>; καὶ τότε ὁμολογήσω αὐτοῖς ὅτι </em><strong><em>Οὐδέποτε ἔγνων ὑμᾶς· <mark>ἀποχωρεῖτε</mark></em></strong> ἀπ᾿ ἐμοῦ <strong><em><mark>οἱ ἐργαζόμενοι τὴν ἀνομίαν</mark></em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/mf/7/#L22-23"><em>Μτ 7:22-23</em></a><em>)</em></p></blockquote><h3>Η κρίση γίνεται με βάση τα έργα</h3><blockquote><p>«μέλλει γὰρ ὁ υἱὸς τοῦ ἀνθρώπου ἔρχεσθαι ἐν τῇ δόξῃ τοῦ πατρὸς αὐτοῦ μετὰ τῶν ἀγγέλων αὐτοῦ, καὶ τότε <strong><mark>ἀποδώσει ἑκάστῳ κατὰ τὴν πρᾶξιν αὐτοῦ</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/16/#L27">Μτ 16:27</a>)</p></blockquote><blockquote><p><em>«τοὺς γὰρ </em><strong><em><mark>πάντας ἡμᾶς</mark></em></strong><em> </em><strong><em>φανερωθῆναι δεῖ ἔμπροσθεν τοῦ βήματος</em></strong><em> τοῦ Χριστοῦ, ἵνα κομίσηται </em><strong><em><mark>ἕκαστος</mark> <mark>τὰ διὰ τοῦ σώματος πρὸς ἃ ἔπραξεν</mark></em></strong><em>, εἴτε ἀγαθὸν εἴτε φαῦλον.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/2kor/5/#L10"><em>Β Κορ 5:10</em></a><em>)</em></p></blockquote><blockquote><p>«μετ᾿ εὐνοίας δουλεύοντες, ὡς τῷ κυρίῳ καὶ οὐκ ἀνθρώποις, <strong>εἰδότες ὅτι <mark>ἕκαστος</mark>, <mark>ἐάν τι ποιήσῃ ἀγαθόν</mark>, τοῦτο κομίσεται παρὰ κυρίου</strong>, εἴτε δοῦλος εἴτε ἐλεύθερος.» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/6/#L7-8">Εφ 6:7-8</a>)</p></blockquote><blockquote><p>«καὶ σοί, κύριε, τὸ ἔλεος, ὅτι σὺ <strong><mark>ἀποδώσεις ἑκάστῳ κατὰ τὰ ἔργα αὐτοῦ</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/61/#L12">Ψλ 61:12</a>)</p></blockquote><blockquote><p>«ὃς <strong><mark>ἀποδώσει ἑκάστῳ κατὰ τὰ ἔργα αὐτοῦ</mark></strong>,» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/2/#L6">Ρωμ 2:6</a>)</p></blockquote><blockquote><p>«ἐγώ εἰμι ὁ ἐραυνῶν νεφροὺς καὶ καρδίας, καὶ <strong><mark>δώσω ὑμῖν ἑκάστῳ κατὰ τὰ ἔργα ὑμῶν</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/2/#L23">Απ 2:23</a>)</p></blockquote><blockquote><p>«Ἰδοὺ ἔρχομαι ταχύ, καὶ ὁ μισθός μου μετ᾿ ἐμοῦ, <strong><mark>ἀποδοῦναι ἑκάστῳ ὡς τὸ ἔργον ἐστὶν αὐτοῦ</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/22/#L12">Απ 22:12</a>)</p></blockquote><h3>Η δικαίωση με τα έργα, και όχι μόνο με την πίστη</h3><blockquote><p>«<strong>Ἀβραὰμ ὁ πατὴρ ἡμῶν οὐκ ἐξ ἔργων ἐδικαιώθη</strong>, ἀνενέγκας Ἰσαὰκ τὸν υἱὸν αὐτοῦ ἐπὶ τὸ θυσιαστήριον; βλέπεις ὅτι ἡ πίστις συνήργει τοῖς ἔργοις αὐτοῦ καὶ ἐκ τῶν ἔργων ἡ πίστις ἐτελειώθη, καὶ ἐπληρώθη ἡ γραφὴ ἡ λέγουσα, Ἐπίστευσεν δὲ Ἀβραὰμ τῷ θεῷ, καὶ ἐλογίσθη αὐτῷ εἰς δικαιοσύνην, καὶ φίλος θεοῦ ἐκλήθη. ὁρᾶτε ὅτι <strong><mark>ἐξ ἔργων δικαιοῦται ἄνθρωπος καὶ οὐκ ἐκ πίστεως μόνον</mark></strong>. ὁμοίως δὲ καὶ <strong>Ῥαὰβ ἡ πόρνη οὐκ ἐξ ἔργων ἐδικαιώθη</strong>, ὑποδεξαμένη τοὺς ἀγγέλους καὶ ἑτέρᾳ ὁδῷ ἐκβαλοῦσα; ὥσπερ γὰρ τὸ σῶμα χωρὶς πνεύματος νεκρόν ἐστιν, οὕτως καὶ ἡ πίστις χωρὶς ἔργων νεκρά ἐστιν.» (<a href="https://bibleox.com/el/gr-lxx-byz/iak/2/#L21-26">Ιακ 2:21-26</a>)</p></blockquote><h3>Με την υπομονή στα αγαθά έργα αποκτάται η αιώνια ζωή</h3><blockquote><p>«κατὰ δὲ τὴν σκληρότητά σου καὶ ἀμετανόητον καρδίαν θησαυρίζεις σεαυτῷ ὀργὴν ἐν ἡμέρᾳ ὀργῆς καὶ ἀποκαλύψεως δικαιοκρισίας τοῦ θεοῦ, ὃς <strong>ἀποδώσει ἑκάστῳ κατὰ τὰ ἔργα αὐτοῦ</strong>, τοῖς μὲν <strong><mark>καθ᾿ ὑπομονὴν ἔργου ἀγαθοῦ</mark> δόξαν καὶ τιμὴν καὶ <mark>ἀφθαρσίαν</mark> ζητοῦσιν, <mark>ζωὴν αἰώνιον</mark></strong>· τοῖς δὲ ἐξ ἐριθείας καὶ ἀπειθοῦσι τῇ ἀληθείᾳ πειθομένοις δὲ τῇ ἀδικίᾳ, ὀργὴ καὶ θυμός —» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/2/#L5-8">Ρωμ 2:5-8</a>)</p></blockquote><h3>Να πλουτίζουμε σε έργα, για να φτάσουμε στην αιώνια ζωή</h3><blockquote><p>«ἀγαθοεργεῖν, <strong><mark>πλουτεῖν ἐν ἔργοις καλοῖς</mark></strong>, εὐμεταδότους εἶναι, κοινωνικούς, ἀποθησαυρίζοντας ἑαυτοῖς θεμέλιον καλὸν εἰς τὸ μέλλον, <strong><mark>ἵνα ἐπιλάβωνται τῆς ὄντως ζωῆς</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1tim/6/#L18-19">Α Τιμ 6:18-19</a>)</p></blockquote><h3>Δημιουργημένοι για αγαθά έργα</h3><p>Η απουσία έργων είναι παράβαση του θελήματος του Θεού για τον άνθρωπο. Χωρίς αγαθά έργα ο άνθρωπος δεν εκπληρώνει τον προορισμό του, δεν εκπληρώνει αυτό για το οποίο δημιουργήθηκε:</p><blockquote><p>«αὐτοῦ γάρ ἐσμεν ποίημα, <strong><mark>κτισθέντες</mark> ἐν Χριστῷ Ἰησοῦ <mark>ἐπὶ ἔργοις ἀγαθοῖς</mark></strong> οἷς προητοίμασεν ὁ θεὸς ἵνα ἐν αὐτοῖς περιπατήσωμεν.» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/2/#L10">Εφ 2:10</a>)</p></blockquote><h3>Η βασιλεία του Θεού κληρονομείται με την ακολουθία του Χριστού στην υπομονή των παθημάτων</h3><blockquote><p>«εἰ δὲ τέκνα, καὶ <strong><mark>κληρονόμοι</mark></strong>· κληρονόμοι μὲν θεοῦ, συγκληρονόμοι δὲ Χριστοῦ, <strong><mark>εἴπερ</mark></strong> <strong><mark>συμπάσχομεν</mark></strong> ἵνα καὶ συνδοξασθῶμεν.» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/8/#L17">Ρωμ 8:17</a>)</p></blockquote><h3>Ο απόστολος γνωρίζει ότι το κήρυγμα του Ευαγγελίου (έργο) θα του χρησιμεύσει για σωτηρία</h3><blockquote><p>«οἶδα γὰρ ὅτι <strong>τοῦτό μοι ἀποβήσεται εἰς σωτηρίαν</strong> διὰ τῆς ὑμῶν δεήσεως καὶ ἐπιχορηγίας τοῦ πνεύματος Ἰησοῦ Χριστοῦ,» (<a href="https://bibleox.com/el/gr-lxx-byz/fil/1/#L19">Φιλ 1:19</a>)</p></blockquote><h3>Η δικαιοσύνη του χριστιανού πρέπει να ξεπεράσει τη δικαιοσύνη των γραμματέων και των Φαρισαίων</h3><blockquote><p>«λέγω γὰρ ὑμῖν ὅτι <strong><mark>ἐὰν μὴ περισσεύσῃ ὑμῶν ἡ δικαιοσύνη πλεῖον τῶν γραμματέων καὶ Φαρισαίων</mark></strong>, <strong><mark>οὐ μὴ εἰσέλθητε εἰς τὴν βασιλείαν τῶν οὐρανῶν</mark></strong>. &lt;…&gt; ἐγὼ δὲ λέγω ὑμῖν ὅτι πᾶς ὁ ὀργιζόμενος τῷ ἀδελφῷ αὐτοῦ ἔνοχος ἔσται τῇ κρίσει· ὃς δ᾿ ἂν εἴπῃ τῷ ἀδελφῷ αὐτοῦ, Ῥακά, ἔνοχος ἔσται τῷ συνεδρίῳ· ὃς δ᾿ ἂν εἴπῃ, Μωρέ, ἔνοχος ἔσται εἰς τὴν γέενναν τοῦ πυρός. &lt;…&gt; ἐγὼ δὲ λέγω ὑμῖν ὅτι πᾶς ὁ βλέπων γυναῖκα πρὸς τὸ ἐπιθυμῆσαι αὐτὴν ἤδη ἐμοίχευσεν αὐτὴν ἐν τῇ καρδίᾳ αὐτοῦ. &lt;…&gt; ἐγὼ δὲ λέγω ὑμῖν μὴ ὀμόσαι ὅλως· μήτε ἐν τῷ οὐρανῷ, ὅτι θρόνος ἐστὶν τοῦ θεοῦ· &lt;…&gt; ἐγὼ δὲ λέγω ὑμῖν μὴ ἀντιστῆναι τῷ πονηρῷ· ἀλλ᾿ ὅστις σε ῥαπίζει εἰς τὴν δεξιὰν σιαγόνα [σου], στρέψον αὐτῷ καὶ τὴν ἄλλην· &lt;…&gt; ἐγὼ δὲ λέγω ὑμῖν, ἀγαπᾶτε τοὺς ἐχθροὺς ὑμῶν καὶ προσεύχεσθε ὑπὲρ τῶν διωκόντων ὑμᾶς, &lt;…&gt; Ἔσεσθε οὖν ὑμεῖς τέλειοι ὡς ὁ πατὴρ ὑμῶν ὁ οὐράνιος τέλειός ἐστιν.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/5/#L20,22,28,34,39,44,48">Μτ 5:20,22,28,34,39,44,48</a>)</p></blockquote><p>Οι γραμματείς όμως και οι Φαρισαίοι λένε, αλλά δεν πράττουν:</p><blockquote><p>«λέγων, Ἐπὶ τῆς Μωϋσέως καθέδρας ἐκάθισαν <strong><mark>οἱ γραμματεῖς καὶ οἱ Φαρισαῖοι</mark></strong>. πάντα οὖν ὅσα ἐὰν εἴπωσιν ὑμῖν ποιήσατε καὶ τηρεῖτε, κατὰ δὲ τὰ ἔργα αὐτῶν μὴ ποιεῖτε· <strong><mark>λέγουσιν γὰρ καὶ οὐ ποιοῦσιν</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/23/#L2-3">Μτ 23:2-3</a>)</p></blockquote><p>*Η πίστη λογίζεται ως δικαιοσύνη όταν υπάρχουν έργα. Ο άνθρωπος δικαιώνεται όχι μόνο με την πίστη, αλλά και με τα έργα (<a href="https://bibleox.com/el/gr-lxx-byz/iak/2/#L21-24">Ιακ 2:21-24</a>).</p><h3>Όποιος πράττει, είναι δίκαιος</h3><blockquote><p>«Τεκνία, μηδεὶς πλανάτω ὑμᾶς· <strong><mark>ὁ ποιῶν</mark> τὴν δικαιοσύνην <mark>δίκαιός ἐστιν</mark></strong>, καθὼς ἐκεῖνος δίκαιός ἐστιν· <strong>ὁ ποιῶν τὴν ἁμαρτίαν ἐκ τοῦ διαβόλου ἐστίν</strong>, ὅτι ἀπ᾿ ἀρχῆς ὁ διάβολος ἁμαρτάνει. εἰς τοῦτο ἐφανερώθη ὁ υἱὸς τοῦ θεοῦ, ἵνα λύσῃ τὰ ἔργα τοῦ διαβόλου.» (<a href="https://bibleox.com/el/gr-lxx-byz/1in/3/#L7-8">Α Ιω 3:7-8</a>)</p></blockquote><h3>Ο δίκαιος μόλις σώζεται</h3><p>Ο δίκαιος είναι ο άνθρωπος που πορεύεται κατά τη δικαιοσύνη του Θεού (<a href="https://bibleox.com/el/gr-lxx-byz/iez/33/#L13-16">Ιεζ 33:13-16</a>). Ο αμαρτωλός είναι ο άνθρωπος που πορεύεται ενάντια στη δικαιοσύνη του Θεού, δηλαδή αυτός που αμαρτάνει. Ακόμη και ο δίκαιος μόλις σώζεται. Ο αμαρτωλός, ακολουθώντας τη λογική, δεν σώζεται καθόλου:</p><blockquote><p>«καὶ εἰ <strong><mark>ὁ δίκαιος μόλις σῴζεται</mark></strong>, ὁ ἀσεβὴς καὶ ἁμαρτωλὸς ποῦ φανεῖται;» (<a href="https://bibleox.com/el/gr-lxx-byz/1pet/4/#L18">Α Πε 4:18</a>)</p></blockquote><h3>Μπορεί κανείς να ομολογεί ότι γνωρίζει τον Θεό, αλλά με τα έργα να Τον αρνείται</h3><blockquote><p>«Τί δέ με καλεῖτε, Κύριε κύριε, καὶ <strong><mark>οὐ ποιεῖτε</mark></strong> ἃ λέγω;» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/6/#L46">Λκ 6:46</a>)</p></blockquote><blockquote><p>«<strong>θεὸν ὁμολογοῦσιν εἰδέναι, <mark>τοῖς δὲ ἔργοις ἀρνοῦνται</mark></strong>, βδελυκτοὶ ὄντες καὶ ἀπειθεῖς καὶ πρὸς πᾶν ἔργον ἀγαθὸν ἀδόκιμοι.» (<a href="https://bibleox.com/el/gr-lxx-byz/tit/1/#L16">Τιτ 1:16</a>)</p></blockquote><p>Στα έργα που δεν είναι ευάρεστα στον Θεό περιλαμβάνονται οι αιρέσεις (<a href="https://bibleox.com/el/gr-lxx-byz/gal/5/#L20">Γαλ 5:20</a>) και η δημιουργία διαιρέσεων μεταξύ των πιστών (<a href="https://bibleox.com/el/gr-lxx-byz/in/17/#L20-21">Ιω 17:20-21</a> · <a href="https://bibleox.com/el/gr-lxx-byz/1kor/1/#L10">Α Κορ 1:10</a>).</p><h3>Το έργο της επιστροφής του αμαρτωλού από τον πλανεμένο δρόμο καλύπτει αμαρτίες</h3><p>Αν ο αληθινά πιστός επιστρέψει τον πλησίον από την πλάνη, με αυτό το έργο θα καλύψει πλήθος αμαρτιών. Αν η σωτηρία επιτυγχανόταν μόνο με την πίστη, τότε η επιστροφή του πλησίον από την πλάνη θα βοηθούσε μόνο τον πλησίον, ενώ στον ίδιο που τον επέστρεψε δεν θα έδινε τίποτε και δεν θα κάλυπτε τις αμαρτίες του (γιατί να τις καλύψει, αν έχεις ήδη σωθεί με την πίστη;):</p><blockquote><p>«Ἀδελφοί μου, ἐάν τις ἐν ὑμῖν <strong>πλανηθῇ ἀπὸ τῆς ἀληθείας</strong> καὶ ἐπιστρέψῃ τις αὐτόν, γινώσκετε ὅτι <strong><mark>ὁ ἐπιστρέψας</mark> ἁμαρτωλὸν ἐκ πλάνης ὁδοῦ αὐτοῦ <mark>σώσει ψυχὴν [αὐτοῦ] ἐκ θανάτου</mark> καὶ <mark>καλύψει πλῆθος ἁμαρτιῶν</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/iak/5/#L19-20">Ιακ 5:19-20</a>)</p></blockquote><h3>Πρόσκληση στους πιστούς να προσπαθήσουν να εισέλθουν στην κατάπαυση του Θεού</h3><p>Δηλαδή χωρίς επιμέλεια οι πιστοί μπορεί και να μην εισέλθουν:</p><blockquote><p>«<strong><mark>σπουδάσωμεν οὖν εἰσελθεῖν</mark></strong> εἰς ἐκείνην τὴν κατάπαυσιν, ἵνα μὴ ἐν τῷ αὐτῷ τις ὑποδείγματι πέσῃ τῆς ἀπειθείας.» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/4/#L11">Εβρ 4:11</a>)</p></blockquote><h3>Οι αρετές και η είσοδος στην αιώνια βασιλεία</h3><p>Ο πιστός δεν θα μείνει χωρίς πρόοδο όταν έχει αρετές. Καθώς εδραιώνεται σε αυτές, του ανοίγεται ελεύθερη είσοδος στη Βασιλεία. Όποιος όμως δεν έχει αρετή — αυτός είναι τυφλός:</p><blockquote><p>«καὶ αὐτὸ τοῦτο δὲ σπουδὴν πᾶσαν παρεισενέγκαντες <strong><mark>ἐπιχορηγήσατε ἐν τῇ πίστει ὑμῶν τὴν ἀρετήν</mark></strong>, ἐν δὲ τῇ ἀρετῇ <strong>τὴν γνῶσιν</strong>, ἐν δὲ τῇ γνώσει <strong>τὴν ἐγκράτειαν</strong>, ἐν δὲ τῇ ἐγκρατείᾳ <strong>τὴν ὑπομονήν</strong>, ἐν δὲ τῇ ὑπομονῇ <strong>τὴν εὐσέβειαν</strong>, ἐν δὲ τῇ εὐσεβείᾳ <strong>τὴν φιλαδελφίαν</strong>, ἐν δὲ τῇ φιλαδελφίᾳ <strong>τὴν ἀγάπην</strong>. <strong><mark>ταῦτα γὰρ ὑμῖν ὑπάρχοντα καὶ πλεονάζοντα οὐκ ἀργοὺς οὐδὲ ἀκάρπους καθίστησιν</mark></strong> εἰς τὴν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ ἐπίγνωσιν· <strong>ᾧ γὰρ μὴ πάρεστιν ταῦτα, τυφλός ἐστιν μυωπάζων, λήθην λαβὼν τοῦ καθαρισμοῦ τῶν πάλαι αὐτοῦ ἁμαρτιῶν</strong>. διὸ μᾶλλον, ἀδελφοί, <strong><mark>σπουδάσατε βεβαίαν ὑμῶν τὴν κλῆσιν καὶ ἐκλογὴν ποιεῖσθαι</mark></strong>· ταῦτα γὰρ <strong>ποιοῦντες</strong> οὐ μὴ πταίσητέ ποτε· <strong><mark>οὕτως γὰρ πλουσίως ἐπιχορηγηθήσεται ὑμῖν ἡ εἴσοδος εἰς τὴν αἰώνιον βασιλείαν</mark></strong> τοῦ κυρίου ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ.» (<a href="https://bibleox.com/el/gr-lxx-byz/2pet/1/#L5-11">Β Πε 1:5-11</a>)</p></blockquote><hr><p>Έτσι, ούτε η πίστη χωρίς έργα σώζει, ούτε τα έργα χωρίς πίστη.</p><h2>Μετά το βάπτισμα οι πιστοί μπορούν ακόμη να αμαρτάνουν και πρέπει να αγωνίζονται κατά της αμαρτίας μέσα τους</h2><blockquote><p>«Ἑκουσίως γὰρ <strong>ἁμαρτανόντων ἡμῶν μετὰ τὸ λαβεῖν τὴν ἐπίγνωσιν τῆς ἀληθείας</strong>, οὐκέτι περὶ ἁμαρτιῶν ἀπολείπεται θυσία,» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/10/#L26">Εβρ 10:26</a>)</p></blockquote><blockquote><p>«<strong>ἐὰν εἴπωμεν ὅτι ἁμαρτίαν οὐκ ἔχομεν, ἑαυτοὺς πλανῶμεν</strong> καὶ ἡ ἀλήθεια οὐκ ἔστιν ἐν ἡμῖν. ἐὰν ὁμολογῶμεν τὰς ἁμαρτίας ἡμῶν, πιστός ἐστιν καὶ δίκαιος ἵνα ἀφῇ ἡμῖν τὰς ἁμαρτίας καὶ καθαρίσῃ ἡμᾶς ἀπὸ πάσης ἀδικίας.» (<a href="https://bibleox.com/el/gr-lxx-byz/1in/1/#L8-9">Α Ιω 1:8-9</a>)</p></blockquote><blockquote><p>«Τεκνία μου, ταῦτα <strong><mark>γράφω ὑμῖν ἵνα μὴ ἁμάρτητε</mark></strong>. καὶ ἐάν τις ἁμάρτῃ, παράκλητον ἔχομεν πρὸς τὸν πατέρα, Ἰησοῦν Χριστὸν δίκαιον·» (<a href="https://bibleox.com/el/gr-lxx-byz/1in/2/#L1">Α Ιω 2:1</a>)</p></blockquote><blockquote><p>«<strong><mark>Πόθεν πόλεμοι καὶ πόθεν μάχαι ἐν ὑμῖν</mark></strong>; οὐκ ἐντεῦθεν, ἐκ τῶν ἡδονῶν ὑμῶν τῶν στρατευομένων ἐν τοῖς μέλεσιν ὑμῶν;» (<a href="https://bibleox.com/el/gr-lxx-byz/iak/4/#L1">Ιακ 4:1</a>)</p></blockquote><blockquote><p><em>«ἀσθενεῖ τις ἐν ὑμῖν; </em><strong><em>προσκαλεσάσθω τοὺς πρεσβυτέρους τῆς ἐκκλησίας</em></strong><em>, καὶ προσευξάσθωσαν ἐπ᾿ αὐτὸν ἀλείψαντες ἐλαίῳ ἐν τῷ ὀνόματι [τοῦ] κυρίου· καὶ </em><strong><em>ἡ εὐχὴ τῆς πίστεως σώσει τὸν κάμνοντα</em></strong><em>, καὶ ἐγερεῖ αὐτὸν ὁ κύριος· </em><strong><em>κἂν <mark>ἁμαρτίας ᾖ πεποιηκώς, ἀφεθήσεται αὐτῷ</mark></em></strong><em>. ἐξομολογεῖσθε οὖν ἀλλήλοις τὰς ἁμαρτίας καὶ </em><strong><em>εὔχεσθε ὑπὲρ ἀλλήλων, ὅπως ἰαθῆτε. πολὺ ἰσχύει δέησις δικαίου ἐνεργουμένη</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/iak/5/#L14-16"><em>Ιακ 5:14-16</em></a><em>)</em></p></blockquote><blockquote><p><em>«</em><strong><em>ἐκνήψατε δικαίως καὶ <mark>μὴ ἁμαρτάνετε</mark></em></strong><em>, </em><strong><em>ἀγνωσίαν γὰρ θεοῦ τινες ἔχουσιν</em></strong><em>· πρὸς ἐντροπὴν ὑμῖν λαλῶ.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/1kor/15/#L33-34"><em>Α Κορ 15:33-34</em></a><em>)</em></p></blockquote><blockquote><p>«γίνεσθε εἰς ἀλλήλους χρηστοί, εὔσπλαγχνοι, <strong><mark>χαριζόμενοι ἑαυτοῖς</mark></strong> καθὼς καὶ ὁ θεὸς ἐν Χριστῷ ἐχαρίσατο ὑμῖν.» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/4/#L32">Εφ 4:32</a>)</p></blockquote><p>Τέλος, ο Κύριος Ιησούς Χριστός δίνει στους μαθητές Του μια προσευχή, με την οποία τους διδάσκει να ζητούν τη συγχώρηση των αμαρτιών. Δεν είναι μια προσευχή που λέγεται μια φορά στη ζωή. Οι μαθητές ζήτησαν από τον Χριστό να τους διδάξει να προσεύχονται, και ο Χριστός ως απάντηση τους έδωσε αυτό το υπόδειγμα:</p><blockquote><p>«εἶπεν δὲ αὐτοῖς, <strong><mark>Ὅταν προσεύχησθε, λέγετε</mark></strong>, Πάτερ, ἁγιασθήτω τὸ ὄνομά σου· ἐλθέτω ἡ βασιλεία σου τὸν ἄρτον ἡμῶν τὸν ἐπιούσιον δίδου ἡμῖν τὸ καθ᾿ ἡμέραν· καὶ <strong><mark>ἄφες ἡμῖν τὰς ἁμαρτίας ἡμῶν</mark></strong>, καὶ γὰρ αὐτοὶ ἀφίομεν παντὶ ὀφείλοντι ἡμῖν· καὶ μὴ εἰσενέγκῃς ἡμᾶς εἰς πειρασμόν.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/11/#L1-4">Λκ 11:1-4</a> · <a href="https://bibleox.com/el/gr-lxx-byz/mf/6/#L7-13">Μτ 6:7-13</a>)</p></blockquote><h2>Η σωτηρία δεν είναι μια πράξη, αλλά διαδικασία ολόκληρης της ζωής</h2><p>Η αναγκαιότητα να κατεργαζόμαστε τη σωτηρία (ελλ. κατεργάζεσθε — <em>να πράττουμε, να κάνουμε, να παράγουμε, να επιτυγχάνουμε, να επιδιώκουμε, να υποτάσσουμε, να κατακτούμε</em>)</p><blockquote><p>«Ὥστε, ἀγαπητοί μου, καθὼς πάντοτε ὑπηκούσατε, μὴ ὡς ἐν τῇ παρουσίᾳ μου μόνον ἀλλὰ νῦν πολλῷ μᾶλλον ἐν τῇ ἀπουσίᾳ μου, μετὰ φόβου καὶ τρόμου <strong>τὴν ἑαυτῶν σωτηρίαν κατεργάζεσθε</strong>·» (<a href="https://bibleox.com/el/gr-lxx-byz/fil/2/#L12">Φιλ 2:12</a>)</p></blockquote><p>Ο απόστολος έχει ωδίνες γέννας, ώσπου να μορφωθεί ο Χριστός μέσα στους βαπτισμένους χριστιανούς. Δηλαδή δεν μορφώθηκε σε αυτούς αυτόματα, σε μια στιγμή:</p><blockquote><p>«τεκνία μου, οὓς <strong>πάλιν ὠδίνω μέχρις οὗ μορφωθῇ Χριστὸς ἐν ὑμῖν</strong>·» (<a href="https://bibleox.com/el/gr-lxx-byz/gal/4/#L19">Γαλ 4:19</a>)</p></blockquote><blockquote><p>«τὸν καλὸν ἀγῶνα ἠγώνισμαι, <strong>τὸν δρόμον τετέλεκα</strong>, τὴν πίστιν τετήρηκα·» (<a href="https://bibleox.com/el/gr-lxx-byz/2tim/4/#L7">Β Τιμ 4:7</a>)</p></blockquote><p>Η σωτηρία είναι μόνο υποσχεμένη, όχι και αποκτημένη (θα σωθεί, όχι σώθηκε):</p><blockquote><p>«καὶ ἔσεσθε μισούμενοι ὑπὸ πάντων διὰ τὸ ὄνομά μου· <strong><mark>ὁ δὲ ὑπομείνας εἰς τέλος</mark></strong> οὗτος σωθήσεται.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/10/#L22">Μτ 10:22</a> · <a href="https://bibleox.com/el/gr-lxx-byz/mf/24/#L13">Μτ 24:13</a>)</p></blockquote><blockquote><p>«<strong><mark>γίνου πιστὸς ἄχρι θανάτου, καὶ δώσω</mark></strong> σοι τὸν στέφανον τῆς ζωῆς.» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/2/#L10">Απ 2:10</a>)</p></blockquote><p>Ο απόστολος δεν εκφέρει κρίση για τον εαυτό του, αν και δεν γνωρίζει πράξεις εναντίον του Θεού, αλλά δεν δικαιώνεται με αυτό, παρά περιμένει την κρίση από τον Θεό:</p><blockquote><p>«Οὕτως <strong>ἡμᾶς λογιζέσθω</strong> ἄνθρωπος ὡς ὑπηρέτας Χριστοῦ καὶ <strong>οἰκονόμους</strong> μυστηρίων θεοῦ. <strong>ὧδε λοιπὸν <mark>ζητεῖται</mark> ἐν τοῖς οἰκονόμοις <mark>ἵνα</mark> <mark>πιστός τις εὑρεθῇ</mark></strong>. ἐμοὶ δὲ εἰς ἐλάχιστόν ἐστιν ἵνα ὑφ᾿ ὑμῶν ἀνακριθῶ ἢ ὑπὸ ἀνθρωπίνης ἡμέρας· ἀλλ᾿ <strong><mark>οὐδὲ ἐμαυτὸν ἀνακρίνω</mark></strong>· οὐδὲν γὰρ ἐμαυτῷ σύνοιδα, ἀλλ᾿ οὐκ ἐν τούτῳ δεδικαίωμαι, <strong><mark>ὁ δὲ ἀνακρίνων με κύριός ἐστιν</mark></strong>. <strong>ὥστε μὴ πρὸ καιροῦ τι κρίνετε</strong>, ἕως ἂν ἔλθῃ ὁ κύριος, ὃς καὶ φωτίσει τὰ κρυπτὰ τοῦ σκότους καὶ φανερώσει τὰς βουλὰς τῶν καρδιῶν· καὶ τότε ὁ ἔπαινος γενήσεται ἑκάστῳ ἀπὸ τοῦ θεοῦ.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/4/#L1-5">Α Κορ 4:1-5</a>)</p></blockquote><h3>Για την επίτευξη της χριστιανικής τελειότητας</h3><p>Ο απόστολος, όπως και όλοι οι χριστιανοί, τρέχει για να λάβει τον άφθαρτο στέφανο, κοπιάζει, αγωνιά μήπως και ο ίδιος μείνει ανάξιος:</p><blockquote><p>«πᾶς δὲ ὁ ἀγωνιζόμενος πάντα ἐγκρατεύεται, ἐκεῖνοι μὲν οὖν ἵνα <strong>φθαρτὸν στέφανον</strong> λάβωσιν, ἡμεῖς δὲ <strong>ἄφθαρτον</strong>. <strong>ἐγὼ</strong> <strong>τοίνυν οὕτως τρέχω</strong> ὡς οὐκ ἀδήλως, οὕτως πυκτεύω ὡς οὐκ ἀέρα δέρων· ἀλλὰ <strong>ὑπωπιάζω μου τὸ σῶμα</strong> καὶ δουλαγωγῶ, <strong>μή πως</strong> ἄλλοις κηρύξας αὐτὸς <strong><mark>ἀδόκιμος γένωμαι</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/9/#L25-27">Α Κορ 9:25-27</a>)</p></blockquote><blockquote><p>«<strong>Οὐχ ὅτι ἤδη ἔλαβον</strong> ἢ ἤδη τετελείωμαι, <strong>διώκω δὲ εἰ καὶ καταλάβω</strong>, ἐφ᾿ ᾧ καὶ κατελήμφθην ὑπὸ Χριστοῦ [Ἰησοῦ]. ἀδελφοί, <strong>ἐγὼ ἐμαυτὸν οὐ λογίζομαι κατειληφέναι</strong>· ἓν δέ, τὰ μὲν ὀπίσω ἐπιλανθανόμενος τοῖς δὲ ἔμπροσθεν ἐπεκτεινόμενος, <strong>κατὰ σκοπὸν διώκω</strong> εἰς τὸ βραβεῖον τῆς ἄνω κλήσεως τοῦ θεοῦ ἐν Χριστῷ Ἰησοῦ.» (<a href="https://bibleox.com/el/gr-lxx-byz/fil/3/#L12-14">Φιλ 3:12-14</a>)</p></blockquote><h3>Οι σωζόμενοι και οι απολλύμενοι</h3><p>Όπως οι σωζόμενοι δεν έχουν ακόμη σωθεί, έτσι και οι απολλύμενοι δεν έχουν ακόμη χαθεί. Και οι δύο βρίσκονται στον δρόμο και οι δύο μπορούν να αλλάξουν δρόμο. Ο σωζόμενος μπορεί ακόμη να οδηγηθεί στην απώλεια, και ο απολλύμενος — στη σωτηρία:</p><blockquote><p>«ὅτι Χριστοῦ εὐωδία ἐσμὲν τῷ θεῷ ἐν τοῖς <strong><mark>σῳζομένοις</mark></strong> καὶ ἐν τοῖς <strong><mark>ἀπολλυμένοις</mark></strong>,» (<a href="https://bibleox.com/el/gr-lxx-byz/2kor/2/#L15">Β Κορ 2:15</a>)</p></blockquote><p>Πολλοί θα προσπαθήσουν να φτάσουν στη Βασιλεία των Ουρανών, και δεν θα μπορέσουν:</p><blockquote><p><strong><em>«Ἀγωνίζεσθε εἰσελθεῖν διὰ τῆς στενῆς θύρας</em></strong><em>, ὅτι πολλοί, λέγω ὑμῖν, </em><strong><em><mark>ζητήσουσιν εἰσελθεῖν καὶ οὐκ ἰσχύσουσιν</mark></em></strong><em>» (</em><a href="https://bibleox.com/el/gr-lxx-byz/lk/13/#L24"><em>Λκ 13:24</em></a><em> · </em><a href="https://bibleox.com/el/gr-lxx-byz/mf/7/#L14"><em>Μτ 7:14</em></a><em> · </em><a href="https://bibleox.com/el/gr-lxx-byz/mf/7/#L13"><em>Μτ 7:13</em></a><em>)</em></p></blockquote><p>Όχι μόνο πολλοί πιστοί, αλλά ακόμη και εκείνοι που κάνουν θαύματα στο όνομα του Χριστού, δεν φτάνουν στη Βασιλεία των Ουρανών:</p><blockquote><p>«<strong>πολλοὶ</strong> ἐροῦσίν μοι ἐν ἐκείνῃ τῇ ἡμέρᾳ, Κύριε κύριε, οὐ τῷ σῷ ὀνόματι <strong>ἐπροφητεύσαμεν</strong>, καὶ τῷ σῷ ὀνόματι <strong>δαιμόνια ἐξεβάλομεν</strong>, καὶ τῷ σῷ ὀνόματι <strong>δυνάμεις πολλὰς ἐποιήσαμεν</strong>; καὶ τότε ὁμολογήσω αὐτοῖς ὅτι <strong>Οὐδέποτε ἔγνων ὑμᾶς· ἀποχωρεῖτε ἀπ᾿ ἐμοῦ</strong> οἱ ἐργαζόμενοι τὴν ἀνομίαν.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/7/#L22-23">Μτ 7:22-23</a>)</p></blockquote><h2>Ο Χριστός — ο παγκόσμιος Κριτής</h2><h3>Όλοι υπόκεινται σε κρίση</h3><blockquote><p>«τοὺς γὰρ <strong><mark>πάντας ἡμᾶς</mark> φανερωθῆναι δεῖ ἔμπροσθεν τοῦ βήματος τοῦ Χριστοῦ</strong>, ἵνα κομίσηται ἕκαστος τὰ διὰ τοῦ σώματος πρὸς ἃ <strong>ἔπραξεν</strong>, <strong>εἴτε ἀγαθὸν εἴτε φαῦλον</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/2kor/5/#L10">Β Κορ 5:10</a>)</p></blockquote><blockquote><p>«σὺ δὲ τί κρίνεις τὸν ἀδελφόν σου; ἢ καὶ σὺ τί ἐξουθενεῖς τὸν ἀδελφόν σου; <strong><mark>πάντες</mark> γὰρ παραστησόμεθα τῷ βήματι τοῦ θεοῦ</strong>·» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/14/#L10">Ρωμ 14:10</a>)</p></blockquote><blockquote><p>«οὕτως λαλεῖτε καὶ οὕτως <strong><mark>ποιεῖτε ὡς διὰ νόμου ἐλευθερίας μέλλοντες κρίνεσθαι</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/iak/2/#L12">Ιακ 2:12</a>)</p></blockquote><blockquote><p>«ὅτι σὺν <strong><mark>πᾶν τὸ ποίημα</mark> ὁ θεὸς ἄξει ἐν κρίσει</strong> ἐν παντὶ παρεωραμένῳ, <strong>ἐὰν ἀγαθὸν καὶ ἐὰν πονηρόν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ekl/12/#L14">Εκ 12:14</a>)</p></blockquote><blockquote><p>«Ὅταν δὲ ἔλθῃ <strong>ὁ υἱὸς τοῦ ἀνθρώπου</strong> ἐν τῇ δόξῃ αὐτοῦ καὶ πάντες οἱ ἄγγελοι μετ᾿ αὐτοῦ, τότε <strong>καθίσει ἐπὶ θρόνου</strong> δόξης αὐτοῦ· καὶ <strong>συναχθήσονται ἔμπροσθεν αὐτοῦ <mark>πάντα τὰ ἔθνη</mark></strong>, καὶ <strong><mark>ἀφορίσει αὐτοὺς ἀπ᾿ ἀλλήλων</mark></strong>, ὥσπερ ὁ ποιμὴν ἀφορίζει <strong><mark>τὰ πρόβατα ἀπὸ τῶν ἐρίφων</mark></strong>,» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/25/#L31-32">Μτ 25:31-32</a>)</p></blockquote><h3>Η κρίση θα αρχίσει από την Εκκλησία</h3><blockquote><p>«ὅτι <strong>ὁ καιρὸς τοῦ ἄρξασθαι τὸ κρίμα <mark>ἀπὸ τοῦ οἴκου τοῦ θεοῦ</mark></strong>· εἰ δὲ <strong><mark>πρῶτον ἀφ᾿ ἡμῶν</mark></strong>, τί τὸ τέλος τῶν ἀπειθούντων τῷ τοῦ θεοῦ εὐαγγελίῳ; καὶ εἰ <strong>ὁ δίκαιος μόλις σῴζεται</strong>, ὁ ἀσεβὴς καὶ ἁμαρτωλὸς ποῦ φανεῖται;» (<a href="https://bibleox.com/el/gr-lxx-byz/1pet/4/#L17-18">Α Πε 4:17-18</a>)</p></blockquote><blockquote><p>«ἐμοὶ δὲ <strong>εἰς ἐλάχιστόν ἐστιν ἵνα ὑφ᾿ ὑμῶν ἀνακριθῶ ἢ ὑπὸ ἀνθρωπίνης ἡμέρας· ἀλλ᾿ <mark>οὐδὲ ἐμαυτὸν ἀνακρίνω</mark></strong>· οὐδὲν γὰρ ἐμαυτῷ σύνοιδα, ἀλλ᾿ <strong>οὐκ ἐν τούτῳ δεδικαίωμαι, <mark>ὁ δὲ ἀνακρίνων με κύριός ἐστιν</mark></strong>. ὥστε <strong>μὴ πρὸ καιροῦ τι κρίνετε</strong>, ἕως ἂν ἔλθῃ ὁ κύριος, ὃς καὶ φωτίσει τὰ κρυπτὰ τοῦ σκότους καὶ φανερώσει τὰς βουλὰς τῶν καρδιῶν· καὶ τότε ὁ ἔπαινος γενήσεται ἑκάστῳ ἀπὸ τοῦ θεοῦ.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/4/#L3-5">Α Κορ 4:3-5</a>)</p></blockquote><h3>Όλοι αμαρτάνουν πολύ</h3><blockquote><p>«<strong>πολλὰ γὰρ πταίομεν ἅπαντες</strong>. εἴ τις ἐν λόγῳ οὐ πταίει, οὗτος τέλειος ἀνήρ, δυνατὸς χαλιναγωγῆσαι καὶ ὅλον τὸ σῶμα.» (<a href="https://bibleox.com/el/gr-lxx-byz/iak/3/#L2">Ιακ 3:2</a>)</p></blockquote><blockquote><p>«<strong>ἐὰν εἴπωμεν ὅτι ἁμαρτίαν οὐκ ἔχομεν, ἑαυτοὺς πλανῶμεν</strong> καὶ ἡ ἀλήθεια οὐκ ἔστιν ἐν ἡμῖν. &lt;…&gt; ἐὰν εἴπωμεν ὅτι οὐχ ἡμαρτήκαμεν, ψεύστην ποιοῦμεν αὐτὸν καὶ ὁ λόγος αὐτοῦ οὐκ ἔστιν ἐν ἡμῖν.» (<a href="https://bibleox.com/el/gr-lxx-byz/1in/1/#L8,10">Α Ιω 1:8,10</a>)</p></blockquote><h3>Πολλοί θα εκπλαγούν, όταν δεν λάβουν τη σωτηρία</h3><p>Νόμιζαν ότι ήταν σωσμένοι:</p><blockquote><p>«<strong>πολλοὶ</strong> ἐροῦσίν μοι ἐν ἐκείνῃ τῇ ἡμέρᾳ, Κύριε κύριε, οὐ τῷ σῷ ὀνόματι <strong>ἐπροφητεύσαμεν</strong>, καὶ τῷ σῷ ὀνόματι <strong>δαιμόνια ἐξεβάλομεν</strong>, καὶ τῷ σῷ ὀνόματι <strong>δυνάμεις πολλὰς ἐποιήσαμεν</strong>; καὶ τότε ὁμολογήσω αὐτοῖς ὅτι <strong>Οὐδέποτε ἔγνων ὑμᾶς· ἀποχωρεῖτε ἀπ᾿ ἐμοῦ</strong> οἱ ἐργαζόμενοι τὴν ἀνομίαν.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/7/#L22-23">Μτ 7:22-23</a>)</p></blockquote><h2>Κριτική</h2><h3>«Όποιος πιστεύει δεν έρχεται σε κρίση»</h3><blockquote><p>«Ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι ὁ τὸν λόγον μου ἀκούων καὶ πιστεύων τῷ πέμψαντί με ἔχει ζωὴν αἰώνιον, καὶ <strong>εἰς κρίσιν οὐκ ἔρχεται</strong> ἀλλὰ μεταβέβηκεν ἐκ τοῦ θανάτου εἰς τὴν ζωήν.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/5/#L24">Ιω 5:24</a>)</p></blockquote><p>Εν συντομία, εδώ λέγεται ότι οι αληθινά πιστοί και εκτελούντες (<a href="https://bibleox.com/el/gr-lxx-byz/lk/6/#L47-49">Λκ 6:47-49</a> · <a href="https://bibleox.com/el/gr-lxx-byz/1in/2/#L17">Α Ιω 2:17</a>) τα λόγια του Σωτήρα δεν οδηγούνται σε καταδίκη για τιμωρία, αλλά ποιοι είναι αυτοί οι πιστοί και εκτελούντες θα το κρίνει ο Ίδιος ο Χριστός στην κρίση (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/4/#L3-5">Α Κορ 4:3-5</a>), γιατί, όπως ήδη δείχθηκε παραπάνω, η παγκόσμια κρίση θα αρχίσει ακριβώς από την Εκκλησία (<a href="https://bibleox.com/el/gr-lxx-byz/1pet/4/#L17-18">Α Πε 4:17-18</a>) και όλοι υπόκεινται σε κρίση.</p><p>Ας εξετάσουμε με περισσότερη λεπτομέρεια.</p><p>Η παράθεση πρέπει να κατανοείται στο πλαίσιο όλων όσων λέγονται στη Βίβλο. Εκεί λέγεται και για την αναγκαιότητα της τήρησης των εντολών για τη σωτηρία (<a href="https://bibleox.com/el/gr-lxx-byz/lk/6/#L47-49">Λκ 6:47-49</a> · <a href="https://bibleox.com/el/gr-lxx-byz/1in/2/#L17">Α Ιω 2:17</a>), και για την αναγκαιότητα του Βαπτίσματος (<a href="https://bibleox.com/el/gr-lxx-byz/in/3/#L5">Ιω 3:5</a>), της Θείας Ευχαριστίας (<a href="https://bibleox.com/el/gr-lxx-byz/in/6/#L53-54">Ιω 6:53-54</a>) και πολλά άλλα. Δεν μπορεί κανείς να κοιτά μόνο μερικές παραθέσεις, κλείνοντας τα μάτια στις άλλες.</p><p>Και αφού δεν μπορεί να αποκλειστεί το υπόλοιπο που είναι αναγκαίο για τη σωτηρία, τότε πρόκειται για πιστούς που εισήλθαν στην Εκκλησία μέσω του Βαπτίσματος, ζουν στην Εκκλησία (το σώμα του Χριστού) μέσω της συμμετοχής στη Θεία Ευχαριστία, τηρούν τις εντολές, γνωρίζουν και ζουν κατά το θέλημα του Θεού. <strong>Αν</strong> έτσι πράττουν, τότε δεν έρχονται σε κρίση για καταδίκη. Αλλά ποιοι θα είναι αυτοί; Το γνωρίζει ο Κριτής Χριστός. Γι’ αυτό, για αρχή, όλοι έρχονται σε κρίση, για την οποία μιλούν απευθείας άλλα χωρία.</p><p>Όλοι υπόκεινται σε κρίση:</p><blockquote><p>«τοὺς γὰρ <strong>πάντας ἡμᾶς φανερωθῆναι δεῖ ἔμπροσθεν τοῦ βήματος τοῦ Χριστοῦ</strong>, ἵνα κομίσηται ἕκαστος τὰ διὰ τοῦ σώματος πρὸς ἃ <strong>ἔπραξεν</strong>, εἴτε <strong>ἀγαθὸν</strong> εἴτε <strong>φαῦλον</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/2kor/5/#L10">Β Κορ 5:10</a>)</p></blockquote><p>Εδώ αναφερόμαστε άμεσα στους <strong>πιστούς</strong>:</p><blockquote><p>«σὺ δὲ τί κρίνεις τὸν <strong>ἀδελφόν</strong> σου; ἢ καὶ σὺ τί ἐξουθενεῖς τὸν <strong>ἀδελφόν</strong> σου; <strong>πάντες γὰρ παραστησόμεθα τῷ βήματι τοῦ θεοῦ</strong>·» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/14/#L10">Ρωμ 14:10</a>)</p></blockquote><blockquote><p>«ὅτι σὺν <strong>πᾶν τὸ ποίημα ὁ θεὸς ἄξει ἐν κρίσει</strong> ἐν παντὶ παρεωραμένῳ, <strong>ἐὰν ἀγαθὸν καὶ ἐὰν πονηρόν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ekl/12/#L14">Εκ 12:14</a>)</p></blockquote><p>Αλλά δεν αρκεί να πούμε μόνο ότι όλοι θα κριθούν. Και όχι μόνο αυτό: ακριβώς από την Εκκλησία, δηλαδή από τους πιστούς, θα αρχίσει η κρίση:</p><blockquote><p>«ὅτι <strong>ὁ καιρὸς τοῦ ἄρξασθαι τὸ κρίμα ἀπὸ τοῦ οἴκου τοῦ θεοῦ</strong>· εἰ δὲ <strong>πρῶτον ἀφ᾿ ἡμῶν</strong>, τί τὸ τέλος τῶν ἀπειθούντων τῷ τοῦ θεοῦ εὐαγγελίῳ; καὶ εἰ ὁ δίκαιος μόλις σῴζεται, ὁ ἀσεβὴς καὶ ἁμαρτωλὸς ποῦ φανεῖται;» (<a href="https://bibleox.com/el/gr-lxx-byz/1pet/4/#L17-18">Α Πε 4:17-18</a>)</p></blockquote><p>Έτσι, ο πιστός και εκτελών (και ποιος είναι αυτός — θα το κρίνει ο Χριστός ως Κριτής) δεν έρχεται σε κρίση για καταδίκη.</p><p>Αυτοί οι <strong>πολλοί πιστοί</strong>, προφανώς, νόμιζαν ότι είναι σωσμένοι και ότι δεν θα έρθουν σε κρίση. Και μολονότι πίστευαν, καταδικάζονται ως άνομοι:</p><blockquote><p>«<strong>πολλοὶ</strong> ἐροῦσίν μοι ἐν ἐκείνῃ τῇ ἡμέρᾳ, <strong>Κύριε κύριε, οὐ τῷ σῷ ὀνόματι ἐπροφητεύσαμεν</strong>, καὶ τῷ σῷ ὀνόματι <strong>δαιμόνια ἐξεβάλομεν</strong>, καὶ τῷ σῷ ὀνόματι <strong>δυνάμεις πολλὰς ἐποιήσαμεν</strong>; καὶ τότε ὁμολογήσω αὐτοῖς ὅτι <strong>Οὐδέποτε ἔγνων ὑμᾶς· ἀποχωρεῖτε ἀπ᾿ ἐμοῦ</strong> οἱ ἐργαζόμενοι τὴν ἀνομίαν.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/7/#L22-23">Μτ 7:22-23</a>)</p></blockquote><p>Έτσι, ο Χριστός θα κρίνει όλους, στην Κρίση χωρίζοντας άλλους από άλλους:</p><blockquote><p>«Ὅταν δὲ ἔλθῃ <strong>ὁ υἱὸς τοῦ ἀνθρώπου</strong> ἐν τῇ δόξῃ αὐτοῦ καὶ πάντες οἱ ἄγγελοι μετ᾿ αὐτοῦ, τότε <strong>καθίσει ἐπὶ θρόνου</strong> δόξης αὐτοῦ· καὶ <strong>συναχθήσονται ἔμπροσθεν αὐτοῦ <mark>πάντα τὰ ἔθνη</mark></strong>, καὶ <strong><mark>ἀφορίσει αὐτοὺς ἀπ᾿ ἀλλήλων</mark></strong>, ὥσπερ ὁ ποιμὴν ἀφορίζει <strong><mark>τὰ πρόβατα ἀπὸ τῶν ἐρίφων</mark></strong>,» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/25/#L31-32">Μτ 25:31-32</a>)</p></blockquote><h3>«Ο άνθρωπος δεν δικαιώνεται με τα έργα»</h3><blockquote><p>«εἰδότες [δὲ] ὅτι <strong>οὐ δικαιοῦται ἄνθρωπος ἐξ ἔργων <mark>νόμου</mark> ἐὰν μὴ διὰ πίστεως Ἰησοῦ Χριστοῦ</strong>, καὶ ἡμεῖς εἰς Χριστὸν Ἰησοῦν ἐπιστεύσαμεν, ἵνα δικαιωθῶμεν ἐκ πίστεως Χριστοῦ καὶ <strong>οὐκ ἐξ ἔργων <mark>νόμου</mark>, ὅτι ἐξ ἔργων <mark>νόμου</mark> οὐ δικαιωθήσεται</strong> πᾶσα σάρξ.» (<a href="https://bibleox.com/el/gr-lxx-byz/gal/2/#L16">Γαλ 2:16</a>)</p></blockquote><p>Εδώ πρόκειται για τα έργα του Νόμου του Μωυσή, με τα οποία δεν μπορεί κανείς να δικαιωθεί. Στην προς Γαλάτας επιστολή αυτό είναι το κύριο θέμα, αφορμή για το οποίο έγινε η διαμάχη για την αναγκαιότητα της περιτομής για τους εθνικούς. Δεν είναι αναγκαία, γιατί σωζόμαστε όχι με τα έργα του Νόμου του Μωυσή, αλλά με την πίστη στον Χριστό και με τα έργα αυτής της πίστης στον Χριστό (βλ. <a href="https://bibleox.com/el/el/w/%CE%97_%CF%83%CF%89%CF%84%CE%B7%CF%81%CE%AF%CE%B1#HH-Δεν-αρκεί-μόνο-η-πίστη-χρειάζονται-και-τα-έργα-για-τη-σωτηρία">τις παραθέσεις για την αναγκαιότητα των έργων</a>).</p><h3>«Με τη χάρη είστε σωσμένοι, μέσω της πίστης»</h3><blockquote><p>«καὶ ὄντας ἡμᾶς νεκροὺς τοῖς παραπτώμασιν συνεζωοποίησεν τῷ Χριστῷ — <strong>χάριτί ἐστε σεσῳσμένοι</strong> — &lt;…&gt; τῇ γὰρ <strong>χάριτί ἐστε σεσῳσμένοι διὰ πίστεως</strong>· καὶ τοῦτο οὐκ ἐξ ὑμῶν, <strong>θεοῦ τὸ δῶρον</strong>· <strong>οὐκ ἐξ ἔργων</strong>, ἵνα μή τις καυχήσηται.» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/2/#L5,8-9">Εφ 2:5,8-9</a>)</p></blockquote><p>Εδώ δεν πρόκειται για την προσωπική σωτηρία κάθε ανθρώπου, αλλά για τον ερχομό στον κόσμο της <strong>δυνατότητας</strong> να σωθεί (για το άνοιγμα αυτής της δυνατότητας).</p><h4>1. Το άνοιγμα της δυνατότητας σωτηρίας — δώρο</h4><p>Πριν από τον Χριστό δεν υπήρχε δυνατότητα σωτηρίας. Μετά τον Χριστό η σωτηρία έγινε δυνατή, δημιουργήθηκαν τα μέσα της σωτηρίας. Τι έκανε ο άνθρωπος για να εμφανιστεί η δυνατότητα να σωθεί; Τίποτε. Οι αμαρτίες της ανθρωπότητας μόνο πολλαπλασιάζονταν. Η προετοιμασία της οδού της σωτηρίας προέκυψε ως <strong>δώρο</strong> του Θεού στους ανθρώπους. Αυτό το δώρο δεν το αξίζει η αμαρτωλή ανθρωπότητα:</p><blockquote><p>«ἔτι γὰρ <strong>Χριστὸς ὄντων ἡμῶν ἀσθενῶν ἔτι κατὰ καιρὸν ὑπὲρ ἀσεβῶν ἀπέθανεν</strong>. μόλις γὰρ ὑπὲρ δικαίου τις ἀποθανεῖται· ὑπὲρ γὰρ τοῦ ἀγαθοῦ τάχα τις καὶ τολμᾷ ἀποθανεῖν· <strong><mark>συνίστησιν δὲ τὴν ἑαυτοῦ ἀγάπην εἰς ἡμᾶς ὁ θεὸς ὅτι ἔτι ἁμαρτωλῶν ὄντων ἡμῶν Χριστὸς ὑπὲρ ἡμῶν ἀπέθανεν</mark></strong>. πολλῷ οὖν μᾶλλον δικαιωθέντες νῦν ἐν τῷ αἵματι αὐτοῦ σωθησόμεθα δι᾿ αὐτοῦ ἀπὸ τῆς ὀργῆς.» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/5/#L6-9">Ρωμ 5:6-9</a>)</p></blockquote><h4>2. Τα μέσα της σωτηρίας — δώρο</h4><p>Επίσης, για την είσοδο στον σωτήριο δρόμο και τη λήψη των μέσων της σωτηρίας, ο συγκεκριμένος άνθρωπος χρειάζεται ακριβώς την πίστη. Εισάγεται στην Εκκλησία, αναγεννάται με το Βάπτισμα, λαμβάνει τα χαρίσματα του Αγίου Πνεύματος με το Μυστήριο του Χρίσματος, ενώνεται με τον Χριστό στη Θεία Ευχαριστία — όλα αυτά <strong>δωρεάν</strong> με την πίστη. Από τον άνθρωπο δεν απαιτείται να αξίζει εκ των προτέρων αυτό το δώρο.</p><h4>3. Η πορεία προς τη σωτηρία — πραγματοποιείται με τη βοήθεια του Θεού (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/15/#L10">Α Κορ 15:10</a>) με ανθρώπινα έργα (<a href="https://bibleox.com/el/gr-lxx-byz/rim/2/#L5-8">Ρωμ 2:5-8</a>) σε όλη τη ζωή (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/2/#L10">Απ 2:10</a>)</h4><p>Στη συνέχεια γίνεται λόγος για τον σκοπό της εν Χριστώ γέννησης — είναι τα αγαθά έργα:</p><blockquote><p>«αὐτοῦ γάρ ἐσμεν ποίημα, <strong>κτισθέντες ἐν Χριστῷ Ἰησοῦ <mark>ἐπὶ ἔργοις ἀγαθοῖς</mark></strong> οἷς προητοίμασεν ὁ θεὸς ἵνα ἐν αὐτοῖς περιπατήσωμεν.» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/2/#L10">Εφ 2:10</a>)</p></blockquote><p>Χωρίς αυτά τα αγαθά έργα, όπως λέγεται σε άλλα χωρία της Γραφής, δεν είναι δυνατόν να σωθεί κανείς, γιατί η πίστη χωρίς έργα είναι νεκρή (<a href="https://bibleox.com/el/gr-lxx-byz/iak/2/#L20">Ιακ 2:20</a>), ο άνθρωπος δικαιώνεται με τα έργα, και όχι μόνο με την πίστη (<a href="https://bibleox.com/el/gr-lxx-byz/iak/2/#L24">Ιακ 2:24</a>), όλοι θα κριθούν (<a href="https://bibleox.com/el/gr-lxx-byz/2kor/5/#L10">Β Κορ 5:10</a>), και η ίδια η κρίση θα γίνει με βάση τα έργα (<a href="https://bibleox.com/el/gr-lxx-byz/2kor/5/#L10">Β Κορ 5:10</a> · <a href="https://bibleox.com/el/gr-lxx-byz/ef/6/#L7-8">Εφ 6:7-8</a>).</p><p>Έτσι, τη σωτηρία που άνοιξε κάποτε στην ανθρωπότητα πρέπει να την οικειοποιηθούμε όχι μόνο με την πίστη, αλλά και με τα έργα, και αυτό, όπως ήδη δείχθηκε παραπάνω, είναι διαδικασία, και μάλιστα επίπονη, τον σκοπό της οποίας πολλοί δεν τον φτάνουν:</p><blockquote><p>«<strong>Ἀγωνίζεσθε εἰσελθεῖν διὰ τῆς στενῆς θύρας</strong>, ὅτι πολλοί, λέγω ὑμῖν, <strong><mark>ζητήσουσιν εἰσελθεῖν καὶ οὐκ ἰσχύσουσιν</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/13/#L24">Λκ 13:24</a> · <a href="https://bibleox.com/el/gr-lxx-byz/mf/7/#L14">Μτ 7:14</a> · <a href="https://bibleox.com/el/gr-lxx-byz/mf/7/#L13">Μτ 7:13</a>)</p></blockquote><h3>Ο συνετός ληστής πρόλαβε μόνο να πιστέψει, αλλά δεν έκανε κανένα έργο;</h3><p>Ο ληστής σώζεται ως μέρος του παλαιοδιαθηκικού Ισραήλ, βρισκόμενος στην Παλαιά Διαθήκη με τον Θεό, με πίστη στον Σωτήρα, έχοντας προλάβει να κάνει και κάτι:</p><p>Γιατί στην Παλαιά Διαθήκη; Επειδή είναι γραμμένο ότι ο Χριστός θα βαπτίζει με το Άγιο Πνεύμα (<a href="https://bibleox.com/el/gr-lxx-byz/lk/3/#L16">Λκ 3:16</a> · <a href="https://bibleox.com/el/gr-lxx-byz/mf/3/#L11">Μτ 3:11</a> · <a href="https://bibleox.com/el/gr-lxx-byz/mk/1/#L8">Μκ 1:8</a>), και ο Χριστός υποσχέθηκε να το στείλει μετά την ανάληψη (<a href="https://bibleox.com/el/gr-lxx-byz/in/16/#L7">Ιω 16:7</a> · <a href="https://bibleox.com/el/gr-lxx-byz/in/14/#L16">Ιω 14:16</a> · <a href="https://bibleox.com/el/gr-lxx-byz/in/14/#L26">Ιω 14:26</a> · <a href="https://bibleox.com/el/gr-lxx-byz/in/7/#L38-39">Ιω 7:38-39</a>), δηλαδή την Πεντηκοστή. Δεν γράφεται για κήρυγμα μετανοίας και βαπτίσματος στον ληστή, δεν γράφεται για την κάθοδο του Αγίου Πνεύματος στον ληστή (σε αντίθεση με το πώς έγινε σε άλλους αρχαίους χριστιανούς αργότερα). Έτσι, ο συνετός ληστής σώθηκε ακόμη στο πλαίσιο της Παλαιάς Διαθήκης, πριν από τη σύσταση της Εκκλησίας, χωρίς τα μυστήρια του Βαπτίσματος και της Θείας Ευχαριστίας.</p><p>Ωστόσο, ο ληστής έκανε και έργο — δέχτηκε ταπεινά την τιμωρία που του στάλθηκε, ως αυτό που πραγματικά άξιζε, έφερε άξιο καρπό μετανοίας (<a href="https://bibleox.com/el/gr-lxx-byz/mf/3/#L8">Μτ 3:8</a>).</p><blockquote><p>«καὶ <strong>ἡμεῖς μὲν δικαίως, ἄξια γὰρ ὧν ἐπράξαμεν ἀπολαμβάνομεν</strong>· οὗτος δὲ οὐδὲν ἄτοπον ἔπραξεν.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/23/#L41">Λκ 23:41</a>)</p></blockquote><p>Η ταπεινή υπομονή των παθημάτων, χωρίς γογγυσμό κατά του Θεού, χωρίς να αναζητά ενόχους αλλού και χωρίς να τους καταδικάζει — αυτό είναι πράξη χριστιανού (<a href="https://bibleox.com/el/gr-lxx-byz/pr/3/#L11">Πρμ 3:11</a>). Οι προπάτορές μας, αφού έπεσαν, άρχισαν να κατηγορούν όχι τον εαυτό τους, αλλά άλλους, και εν μέρει ακόμη και τον Θεό:</p><blockquote><p>«καὶ εἶπεν ὁ Αδαμ <strong>Ἡ γυνή, ἣν ἔδωκας μετ᾿ ἐμοῦ, αὕτη μοι ἔδωκεν ἀπὸ τοῦ ξύλου, καὶ ἔφαγον</strong>. καὶ εἶπεν κύριος ὁ θεὸς τῇ γυναικί Τί τοῦτο ἐποίησας; καὶ εἶπεν ἡ γυνή <strong>Ὁ ὄφις ἠπάτησέν με, καὶ ἔφαγον</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/gen/3/#L12-13">Γεν 3:12-13</a>)</p></blockquote><p>αλλά ο ληστής κατηγόρησε τον εαυτό του και υπέμεινε την τιμωρία. Αυτό είναι έργο, και έργο πολύ άξιο του χριστιανικού πνεύματος.</p><p>Όντας ληστής, δεν δοξάζεται ως ένας από τους μεγάλους, δεν λαμβάνει την ετοιμασμένη θέση δεξιά ή αριστερά του Σωτήρα (<a href="https://bibleox.com/el/gr-lxx-byz/mk/10/#L40">Μκ 10:40</a>), αλλά σώζεται με την πίστη και τουλάχιστον με αυτό το μικρό έργο που πρόλαβε να κάνει. Έτσι ο ληστής έχει τελικά έργα, και όχι μόνο πίστη.</p><p>Αξίζει να προσέξουμε ακόμη και το ότι δεν είναι ο ίδιος ο ληστής που αναγνωρίζει τον εαυτό του σωσμένο, αλλά ο Χριστός εκφέρει κρίση γι’ αυτόν. Στα λόγια του ληστή δεν παρατηρείται καμία βεβαιότητα για τη σωτηρία, αντίθετα, συνειδητοποιεί ότι δεν θα φτάσει στην αιώνια ζωή με τον Θεό, γι’ αυτό, έχοντας μόνο μια διστακτική ελπίδα στο έλεος, ζητά από τον Χριστό να τον θυμηθεί όταν ο Χριστός έρθει στη Βασιλεία Του (όπου ο ληστής τότε δεν θα είναι, όπως ο ίδιος ο ληστής υποθέτει).</p><h3>«Καθένας που θα επικαλεστεί το όνομα του Κυρίου θα σωθεί»</h3><blockquote><p>«Πᾶς γὰρ ὃς ἂν ἐπικαλέσηται τὸ ὄνομα κυρίου σωθήσεται.» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/10/#L13">Ρωμ 10:13</a>)</p></blockquote><blockquote><p>«καὶ ἔσται πᾶς ὃς ἐὰν ἐπικαλέσηται τὸ ὄνομα κυρίου σωθήσεται.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/2/#L21">Πραξ 2:21</a>)</p></blockquote><p>Δυσκολία μπορεί να προκύψει με τη σκέψη: άραγε για τη σωτηρία αρκεί μόνο να επικαλεστεί κανείς τον Κύριο και καθένας, όπως κι αν επικαλεστεί, ό,τι κι αν κάνει, πάντως θα σωθεί. Στην πραγματικότητα, η λέξη «καθένας» εδώ σημαίνει ότι θα μπορέσει να σωθεί όχι μόνο ο Εβραίος, αλλά άνθρωπος από κάθε έθνος.</p><p>Αυτά τα λόγια ο απόστολος απλώς τα παραθέτει. Αρχικά ειπώθηκαν στους Εβραίους στην Παλαιά Διαθήκη ως προφητεία για το μέλλον. Και τώρα ο απόστολος υπενθυμίζει τα ειπωμένα, δείχνοντας ότι ήρθε ο καιρός της εκπλήρωσης αυτών των λόγων. Στην Παλαιά Διαθήκη αυτά τα λόγια τα είπε ο προφήτης Ιωήλ:</p><blockquote><p>«καὶ ἔσται <strong>πᾶς, ὃς ἂν ἐπικαλέσηται τὸ ὄνομα κυρίου, σωθήσεται</strong>· ὅτι ἐν τῷ ὄρει Σιων καὶ ἐν Ιερουσαλημ ἔσται ἀνασῳζόμενος, καθότι εἶπεν κύριος, καὶ εὐαγγελιζόμενοι, οὓς κύριος προσκέκληται.» (<a href="https://bibleox.com/el/gr-lxx-byz/iol/3/#L5">Ιλ 3:5</a>)</p></blockquote><p>Ο λόγος του προφήτη απευθύνεται στον λαό του Ισραήλ, που είναι πεπεισμένος ότι ο Θεός σώζει μόνο τους Ισραηλίτες. Και ιδού, στον λαό του Ισραήλ δίνεται προφητεία ότι θα έρθει καιρός που θα σωθεί όχι μόνο ο Ισραηλίτης, αλλά καθένας (λαός) που θα αρχίσει να επικαλείται τον Θεό.</p><p>Έτσι, αυτά τα λόγια είναι από την Παλαιά Διαθήκη, την οποία ο Θεός συνήψε μόνο με τον λαό του Ισραήλ, ενώ η Καινή Διαθήκη — με την Εκκλησία, στην οποία κάλεσε όλα τα έθνη, γιατί στην Εκκλησία η εθνικότητα δεν έχει πλέον σημασία (<a href="https://bibleox.com/el/gr-lxx-byz/kol/3/#L11">Κολ 3:11</a>). Γι’ αυτό ακριβώς γίνεται λόγος εδώ, όπως φαίνεται άμεσα από το πλαίσιο: η εθνικότητα δεν έχει σημασία για τη σωτηρία:</p><blockquote><p>«λέγει γὰρ ἡ γραφή, <strong>Πᾶς ὁ πιστεύων</strong> ἐπ᾿ αὐτῷ οὐ καταισχυνθήσεται. <strong><mark>οὐ γάρ ἐστιν διαστολὴ Ἰουδαίου τε καὶ Ἕλληνος</mark></strong>, ὁ γὰρ αὐτὸς κύριος πάντων, πλουτῶν εἰς πάντας τοὺς ἐπικαλουμένους αὐτόν· <strong><mark>Πᾶς γὰρ ὃς ἂν ἐπικαλέσηται τὸ ὄνομα κυρίου σωθήσεται</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/10/#L11-13">Ρωμ 10:11-13</a>)</p></blockquote><p>Το υπόλοιπο μέρος της Αγίας Γραφής δεν χάνει την αναγκαιότητά του.</p><p>Πώς να σωθεί κανείς; Τήρησε τις εντολές — λέει ο Κύριος:</p><blockquote><p>«εἰ δὲ θέλεις εἰς τὴν ζωὴν εἰσελθεῖν, <strong>τήρησον τὰς ἐντολάς</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/19/#L17">Μτ 19:17</a>)</p></blockquote><p>Ακυρώνεται αυτό με τα λόγια για την επίκληση του Θεού; Φυσικά, όχι.</p><p>Λέγεται ότι αυτός που δεν έχει γεννηθεί από το νερό και το Πνεύμα δεν θα δει τη Βασιλεία των Ουρανών και δεν θα εισέλθει σε αυτήν. Αυτό επίσης δεν ακυρώνεται.</p><blockquote><p>«ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ, Ἀμὴν ἀμὴν λέγω σοι, ἐὰν μή τις γεννηθῇ ἄνωθεν, <strong>οὐ δύναται ἰδεῖν τὴν βασιλείαν τοῦ θεοῦ</strong>. &lt;…&gt; ἀπεκρίθη Ἰησοῦς, Ἀμὴν ἀμὴν λέγω σοι, ἐὰν μή τις γεννηθῇ ἐξ ὕδατος καὶ πνεύματος, <strong>οὐ δύναται εἰσελθεῖν εἰς τὴν βασιλείαν τοῦ θεοῦ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/3/#L3,5">Ιω 3:3,5</a>)</p></blockquote><p>Τα λόγια για τη Θεία Ευχαριστία δεν ακυρώνονται. Χωρίς αυτήν ο άνθρωπος δεν μπορεί να έχει ζωή εν εαυτώ και να αναστηθεί (για τη ζωή με τον Θεό) την τελευταία ημέρα.</p><blockquote><p>«εἶπεν οὖν αὐτοῖς ὁ Ἰησοῦς, Ἀμὴν ἀμὴν λέγω ὑμῖν, <strong>ἐὰν μὴ φάγητε τὴν σάρκα τοῦ υἱοῦ τοῦ ἀνθρώπου καὶ πίητε αὐτοῦ τὸ αἷμα</strong>, <strong>οὐκ ἔχετε ζωὴν ἐν ἑαυτοῖς</strong>. ὁ τρώγων μου τὴν σάρκα καὶ πίνων μου τὸ αἷμα ἔχει ζωὴν αἰώνιον, κἀγὼ <strong>ἀναστήσω αὐτὸν τῇ ἐσχάτῃ ἡμέρᾳ</strong>·» (<a href="https://bibleox.com/el/gr-lxx-byz/in/6/#L53-54">Ιω 6:53-54</a>)</p></blockquote><p>Οι Νικολαΐτες και πολλοί αιρετικοί επικαλούνται τον Θεό, ωστόσο, ως αιρετικοί και σχισματικοί, καταδικάζονται σε στέρηση της Βασιλείας:</p><blockquote><p><em>«φανερὰ δέ ἐστιν τὰ ἔργα τῆς σαρκός, ἅτινά ἐστιν πορνεία, ἀκαθαρσία, ἀσέλγεια, εἰδωλολατρία, φαρμακεία, ἔχθραι, ἔρις, ζῆλος, θυμοί, ἐριθείαι, </em><strong><em>διχοστασίαι</em></strong><em>, </em><strong><em>αἱρέσεις</em></strong><em>, φθόνοι, μέθαι, κῶμοι, καὶ τὰ ὅμοια τούτοις, ἃ προλέγω ὑμῖν καθὼς προεῖπον ὅτι οἱ τὰ τοιαῦτα πράσσοντες βασιλείαν θεοῦ οὐ κληρονομήσουσιν.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/gal/5/#L19-21"><em>Γαλ 5:19-21</em></a><em>)</em></p><p><strong><em>*διχοστασίαι — διαιρέσεις, διχασμοί.</em></strong></p></blockquote><p>Έτσι, «καθένας» σημαίνει άνθρωπο οποιασδήποτε εθνικότητας, και όχι μόνο Εβραίο. Για την Εκκλησία, λοιπόν, μιλά ο απόστολος:</p><blockquote><p>«νυνὶ δὲ ἀπόθεσθε καὶ ὑμεῖς τὰ πάντα, ὀργήν, θυμόν, κακίαν, βλασφημίαν, αἰσχρολογίαν ἐκ τοῦ στόματος ὑμῶν· &lt;…&gt; καὶ ἐνδυσάμενοι τὸν νέον τὸν ἀνακαινούμενον εἰς ἐπίγνωσιν κατ᾿ εἰκόνα τοῦ κτίσαντος αὐτόν, ὅπου <strong><mark>οὐκ ἔνι Ἕλλην καὶ Ἰουδαῖος</mark>, περιτομὴ καὶ ἀκροβυστία, <mark>βάρβαρος, Σκύθης</mark>, δοῦλος, ἐλεύθερος</strong>, ἀλλὰ [τὰ] πάντα καὶ ἐν πᾶσιν Χριστός.» (<a href="https://bibleox.com/el/gr-lxx-byz/kol/3/#L8,10-11">Κολ 3:8,10-11</a>)</p></blockquote><h3>«Η αντικαταστατική θυσία»</h3><p>Ορισμένοι υποστηρικτές της διδασκαλίας της σωτηρίας μόνο με την πίστη (χωρίς έργα) μιλούν για μια τέτοια θεωρία σωτηρίας ως «αντικαταστατική θυσία», με την οποία εννοείται το εξής. Όπως αντί για τον Ισαάκ θυσιάστηκε ένα αρνί για να ζήσει ο Ισαάκ, έτσι αντί για τον αμαρτωλό άνθρωπο θυσιάστηκε ο Χριστός για να ζήσει ο αμαρτωλός. Έτσι, αφού ο Θεός Πατέρας εκχέει την οργή Του στον Υιό, τότε δεν οργίζεται πλέον εναντίον των πιστών αμαρτωλών. Και τώρα οι πιστοί αμαρτωλοί δεν έχουν εμπόδια για τη ζωή με τον Θεό.</p><p>Η ιδέα περί αντικαταστατικής θυσίας δεν φαίνεται να έχει σχέση με την αλήθεια. Προέρχεται από μια ψευδή προϋπόθεση, ότι το πρόβλημα είναι στον Θεό (Αυτός οργίζεται εναντίον των αμαρτωλών). Και για να διορθωθεί ο Θεός (τι τολμηρή σκέψη από μόνη της) πρέπει να πεθάνει ο Υιός. Στον άνθρωπο όμως δεν είναι καθόλου απαραίτητο να διορθωθεί, αφού ο Θεός θα οργίζεται εναντίον του Υιού, και έτσι το πρόβλημα (σαν να βρίσκεται στον Θεό) εξαλείφεται. Μια τέτοια θεωρία δεν μπορεί να γίνει δεκτή ως αλήθεια, γιατί είναι αντίθετη με την κοινή λογική. Είναι φανερό ότι το πρόβλημα δεν είναι στον Θεό. Στην αιώνια ζωή με τον Θεό δεν μπορεί να εισέλθει τίποτε ακάθαρτο:</p><blockquote><p>«καὶ ἡ πόλις οὐ χρείαν ἔχει τοῦ ἡλίου οὐδὲ τῆς σελήνης, ἵνα φαίνωσιν αὐτῇ, ἡ γὰρ δόξα τοῦ θεοῦ ἐφώτισεν αὐτήν, καὶ ὁ λύχνος αὐτῆς τὸ ἀρνίον. &lt;…&gt; καὶ <strong>οὐ μὴ εἰσέλθῃ εἰς αὐτὴν πᾶν κοινὸν καὶ ποιῶν βδέλυγμα καὶ ψεῦδος</strong>, εἰ μὴ οἱ γεγραμμένοι ἐν τῷ βιβλίῳ τῆς ζωῆς τοῦ ἀρνίου.» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/21/#L23,27">Απ 21:23,27</a>)</p></blockquote>'
