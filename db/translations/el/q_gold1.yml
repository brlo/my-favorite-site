  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <h2>Η αγάπη προς τον Θεό και τον πλησίον — η πρώτη εντολή</h2><blockquote><p>«ἀπεκρίθη ὁ Ἰησοῦς ὅτι Πρώτη ἐστίν, Ἄκουε, Ἰσραήλ, κύριος ὁ θεὸς ἡμῶν κύριος εἷς ἐστιν, καὶ <strong><mark>ἀγαπήσεις κύριον τὸν θεόν σου</mark></strong> ἐξ ὅλης τῆς καρδίας σου καὶ ἐξ ὅλης τῆς ψυχῆς σου καὶ ἐξ ὅλης τῆς διανοίας σου καὶ ἐξ ὅλης τῆς ἰσχύος σου. δευτέρα αὕτη, <strong><mark>Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν</mark></strong>. μείζων τούτων ἄλλη ἐντολὴ οὐκ ἔστιν.» (<a href="https://bibleox.com/el/gr-lxx-byz/mk/12/#L29-31">Μκ 12:29-31</a> · <a href="https://bibleox.com/el/gr-lxx-byz/vtor/6/#L5">Δτ 6:5</a> · <a href="https://bibleox.com/el/gr-lxx-byz/lev/19/#L18">Λευ 19:18</a>)</p></blockquote><blockquote><p>«Καὶ ἰδοὺ νομικός τις ἀνέστη ἐκπειράζων αὐτὸν λέγων, Διδάσκαλε, <strong>τί ποιήσας ζωὴν αἰώνιον κληρονομήσω</strong>; ὁ δὲ εἶπεν πρὸς αὐτόν, Ἐν τῷ νόμῳ τί γέγραπται; πῶς ἀναγινώσκεις; ὁ δὲ ἀποκριθεὶς εἶπεν, <strong><mark>Ἀγαπήσεις κύριον τὸν θεόν σου</mark></strong> ἐξ ὅλης [τῆς] καρδίας σου καὶ ἐν ὅλῃ τῇ ψυχῇ σου καὶ ἐν ὅλῃ τῇ ἰσχύϊ σου καὶ ἐν ὅλῃ τῇ διανοίᾳ σου, καὶ <strong><mark>τὸν πλησίον σου ὡς σεαυτόν</mark></strong>. εἶπεν δὲ αὐτῷ, Ὀρθῶς ἀπεκρίθης· τοῦτο ποίει καὶ ζήσῃ.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/10/#L25-28">Λκ 10:25-28</a>)</p></blockquote><h2>Η αγάπη υπέρ τα πάντα</h2><blockquote><p>«<strong><mark>Ἐὰν</mark></strong> ταῖς γλώσσαις τῶν ἀνθρώπων λαλῶ καὶ τῶν ἀγγέλων, <strong><mark>ἀγάπην δὲ μὴ ἔχω</mark></strong>, γέγονα χαλκὸς ἠχῶν ἢ κύμβαλον ἀλαλάζον. καὶ ἐὰν ἔχω προφητείαν καὶ εἰδῶ τὰ μυστήρια πάντα καὶ πᾶσαν τὴν γνῶσιν, κἂν ἔχω πᾶσαν τὴν πίστιν ὥστε ὄρη μεθιστάναι, ἀγάπην δὲ μὴ ἔχω, <strong><mark>οὐθέν εἰμι</mark></strong>. κἂν ψωμίσω πάντα τὰ ὑπάρχοντά μου, καὶ ἐὰν παραδῶ τὸ σῶμά μου ἵνα καυχήσωμαι, ἀγάπην δὲ μὴ ἔχω, οὐδὲν ὠφελοῦμαι.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/13/#L1-3">Α Κορ 13:1-3</a>)</p></blockquote><blockquote><p>«<strong><mark>ὕδωρ πολὺ οὐ δυνήσεται σβέσαι τὴν ἀγάπην, καὶ ποταμοὶ οὐ συγκλύσουσιν αὐτήν</mark></strong>· ἐὰν δῷ ἀνὴρ τὸν πάντα βίον αὐτοῦ ἐν τῇ ἀγάπῃ, ἐξουδενώσει ἐξουδενώσουσιν αὐτόν.» (<a href="https://bibleox.com/el/gr-lxx-byz/pp/8/#L7">Ασμ 8:7</a>)</p></blockquote><h2>Η αγάπη είναι αιώνια</h2><blockquote><p>«<strong><mark>Ἡ ἀγάπη οὐδέποτε πίπτει</mark></strong>. εἴτε δὲ προφητεῖαι, καταργηθήσονται· εἴτε γλῶσσαι, παύσονται· εἴτε γνῶσις, καταργηθήσεται.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/13/#L8">Α Κορ 13:8</a>)</p></blockquote><blockquote><p>«Θές με ὡς σφραγῖδα ἐπὶ τὴν καρδίαν σου, ὡς σφραγῖδα ἐπὶ τὸν βραχίονά σου· ὅτι κραταιὰ ὡς θάνατος ἀγάπη, σκληρὸς ὡς ᾅδης ζῆλος· περίπτερα αὐτῆς περίπτερα πυρός, φλόγες αὐτῆς· <strong><mark>ὕδωρ πολὺ οὐ δυνήσεται σβέσαι τὴν ἀγάπην, καὶ ποταμοὶ οὐ συγκλύσουσιν αὐτήν</mark></strong>· ἐὰν δῷ ἀνὴρ τὸν πάντα βίον αὐτοῦ ἐν τῇ ἀγάπῃ, ἐξουδενώσει ἐξουδενώσουσιν αὐτόν.» (<a href="https://bibleox.com/el/gr-lxx-byz/pp/8/#L6-7">Ασμ 8:6-7</a>)</p></blockquote><h2>Πώς μπορεί να είναι η αγάπη</h2><blockquote><p>«Ἡ ἀγάπη <strong>μακροθυμεῖ</strong>, <strong>χρηστεύεται</strong> ἡ ἀγάπη, <strong>οὐ ζηλοῖ</strong>, <strong>οὐ περπερεύεται</strong>, <strong>οὐ φυσιοῦται</strong>, <strong>οὐκ ἀσχημονεῖ</strong>, <strong>οὐ ζητεῖ τὰ ἑαυτῆς</strong>, <strong>οὐ παροξύνεται</strong>, <strong>οὐ λογίζεται τὸ κακόν</strong>, <strong>οὐ χαίρει ἐπὶ τῇ ἀδικίᾳ</strong>, <strong>συγχαίρει δὲ τῇ ἀληθείᾳ</strong>· <strong>πάντα στέγει</strong>, <strong>πάντα πιστεύει</strong>, <strong>πάντα ἐλπίζει</strong>, <strong>πάντα ὑπομένει</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/13/#L4-7">Α Κορ 13:4-7</a>)</p></blockquote><blockquote><p>«<strong>Υἱέ, μὴ ὀλιγώρει παιδείας κυρίου μηδὲ ἐκλύου ὑπ᾿ αὐτοῦ ἐλεγχόμενος· <mark>ὃν γὰρ ἀγαπᾷ κύριος παιδεύει</mark></strong>, μαστιγοῖ δὲ πάντα υἱὸν ὃν παραδέχεται.» (<a href="https://bibleox.com/el/gr-lxx-byz/pr/3/#L11-12">Πρμ 3:11-12</a>)</p></blockquote><blockquote><p>«<strong>ὃν γὰρ ἀγαπᾷ <mark>κύριος παιδεύει</mark></strong>, μαστιγοῖ δὲ πάντα υἱὸν ὃν παραδέχεται.» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/12/#L6">Εβρ 12:6</a>)</p></blockquote><blockquote><p>«ἐγὼ <strong><mark>ὅσους ἐὰν φιλῶ ἐλέγχω καὶ παιδεύω</mark></strong>· ζήλευε οὖν καὶ μετανόησον.» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/3/#L19">Απ 3:19</a>)</p></blockquote><blockquote><p>«κρινόμενοι δὲ ὑπὸ [τοῦ] κυρίου <strong>παιδευόμεθα, ἵνα μὴ σὺν τῷ κόσμῳ κατακριθῶμεν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/11/#L32">Α Κορ 11:32</a>)</p></blockquote><blockquote><p>«<strong>μακάριος δὲ ἄνθρωπος, ὃν ἤλεγξεν ὁ κύριος</strong>· νουθέτημα δὲ παντοκράτορος μὴ ἀπαναίνου. αὐτὸς γὰρ ἀλγεῖν ποιεῖ καὶ πάλιν ἀποκαθίστησιν· ἔπαισεν, καὶ αἱ χεῖρες αὐτοῦ ἰάσαντο.» (<a href="https://bibleox.com/el/gr-lxx-byz/iov/5/#L17-18">Ιωβ 5:17-18</a>)</p></blockquote><blockquote><p>«Θές με ὡς σφραγῖδα ἐπὶ τὴν καρδίαν σου, ὡς σφραγῖδα ἐπὶ τὸν βραχίονά σου· ὅτι κραταιὰ ὡς θάνατος <strong><mark>ἀγάπη</mark></strong>, σκληρὸς ὡς ᾅδης <strong><mark>ζῆλος</mark></strong>· περίπτερα αὐτῆς <strong><mark>περίπτερα πυρός</mark></strong>, <strong><mark>φλόγες αὐτῆς</mark></strong>· ὕδωρ πολὺ οὐ δυνήσεται σβέσαι τὴν ἀγάπην, καὶ ποταμοὶ οὐ συγκλύσουσιν αὐτήν· ἐὰν δῷ ἀνὴρ τὸν πάντα βίον αὐτοῦ ἐν τῇ ἀγάπῃ, ἐξουδενώσει ἐξουδενώσουσιν αὐτόν.» (<a href="https://bibleox.com/el/gr-lxx-byz/pp/8/#L6-7">Ασμ 8:6-7</a>)</p></blockquote>
