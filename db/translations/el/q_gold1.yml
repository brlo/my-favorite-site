  update: true
  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <h2>Δέκα εντολές που έδωσε ο Θεός στον προφήτη Μωυσή σε πλάκες λίθινες</h2><p>Με αυτές τις εντολές δεν περιορίζονταν οι διαταγές του Θεού, όμως ακριβώς αυτές οι διαταγές δόθηκαν σε πλάκες λίθινες.</p><h3>1</h3><blockquote><p>«<strong>Ἐγώ εἰμι κύριος ὁ θεός σου</strong>, ὅστις ἐξήγαγόν σε ἐκ γῆς Αἰγύπτου ἐξ οἴκου δουλείας. <strong>οὐκ ἔσονταί σοι θεοὶ ἕτεροι πλὴν ἐμοῦ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/20/#L2-3">Έξ 20:2-3</a> · <a href="https://bibleox.com/el/gr-lxx-byz/vtor/5/#L6-7">Δτ 5:6-7</a> · <a href="https://bibleox.com/el/gr-lxx-byz/lev/19/#L2">Λευ 19:2</a>)</p></blockquote><h3>2</h3><blockquote><p>«<strong>οὐ ποιήσεις σεαυτῷ εἴδωλον οὐδὲ παντὸς ὁμοίωμα, ὅσα ἐν τῷ οὐρανῷ ἄνω καὶ ὅσα ἐν τῇ γῇ κάτω καὶ ὅσα ἐν τοῖς ὕδασιν ὑποκάτω τῆς γῆς</strong>. οὐ προσκυνήσεις αὐτοῖς οὐδὲ μὴ λατρεύσῃς αὐτοῖς· ἐγὼ γάρ εἰμι κύριος ὁ θεός σου, θεὸς ζηλωτὴς ἀποδιδοὺς ἁμαρτίας πατέρων ἐπὶ τέκνα ἕως τρίτης καὶ τετάρτης γενεᾶς τοῖς μισοῦσίν με» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/20/#L4-5">Έξ 20:4-5</a> · <a href="https://bibleox.com/el/gr-lxx-byz/vtor/5/#L8-9">Δτ 5:8-9</a> · <a href="https://bibleox.com/el/gr-lxx-byz/lev/19/#L4">Λευ 19:4</a>)</p></blockquote><h3>3</h3><blockquote><p>«<strong>οὐ λήμψῃ τὸ ὄνομα κυρίου τοῦ θεοῦ σου ἐπὶ ματαίῳ</strong>· οὐ γὰρ μὴ καθαρίσῃ κύριος τὸν λαμβάνοντα τὸ ὄνομα αὐτοῦ ἐπὶ ματαίῳ.» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/20/#L7">Έξ 20:7</a> · <a href="https://bibleox.com/el/gr-lxx-byz/vtor/5/#L11">Δτ 5:11</a> · <a href="https://bibleox.com/el/gr-lxx-byz/lev/19/#L12">Λευ 19:12</a>)</p></blockquote><h3>4</h3><blockquote><p>«<strong>μνήσθητι τὴν ἡμέραν τῶν σαββάτων ἁγιάζειν αὐτήν</strong>. ἓξ ἡμέρας ἐργᾷ καὶ ποιήσεις πάντα τὰ ἔργα σου· τῇ δὲ ἡμέρᾳ τῇ ἑβδόμῃ σάββατα κυρίῳ τῷ θεῷ σου· οὐ ποιήσεις ἐν αὐτῇ πᾶν ἔργον, σὺ καὶ ὁ υἱός σου καὶ ἡ θυγάτηρ σου, ὁ παῖς σου καὶ ἡ παιδίσκη σου, ὁ βοῦς σου καὶ τὸ ὑποζύγιόν σου καὶ πᾶν κτῆνός σου καὶ ὁ προσήλυτος ὁ παροικῶν ἐν σοί.» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/20/#L8-10">Έξ 20:8-10</a> · <a href="https://bibleox.com/el/gr-lxx-byz/vtor/5/#L12-15">Δτ 5:12-15</a> · <a href="https://bibleox.com/el/gr-lxx-byz/lev/19/#L3">Λευ 19:3</a> · <a href="https://bibleox.com/el/gr-lxx-byz/lev/19/#L30">Λευ 19:30</a> · <a href="https://bibleox.com/el/gr-lxx-byz/ier/17/#L21">Ιερ 17:21</a> · <a href="https://bibleox.com/el/gr-lxx-byz/ezd/23/#L15-18">Εσδ 23:15-18</a>)</p></blockquote><h3>5</h3><blockquote><p>«<strong>τίμα τὸν πατέρα σου καὶ τὴν μητέρα</strong>, ἵνα εὖ σοι γένηται, καὶ ἵνα μακροχρόνιος γένῃ ἐπὶ τῆς γῆς τῆς ἀγαθῆς, ἧς κύριος ὁ θεός σου δίδωσίν σοι.» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/20/#L12">Έξ 20:12</a> · <a href="https://bibleox.com/el/gr-lxx-byz/vtor/5/#L16">Δτ 5:16</a> · <a href="https://bibleox.com/el/gr-lxx-byz/lev/19/#L3">Λευ 19:3</a>)</p></blockquote><h3>6</h3><blockquote><p>«<strong>οὐ φονεύσεις</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/20/#L15">Έξ 20:15</a> · <a href="https://bibleox.com/el/gr-lxx-byz/vtor/5/#L18">Δτ 5:18</a> · <a href="https://bibleox.com/el/gr-lxx-byz/lev/19/#L17-18">Λευ 19:17-18</a>)</p></blockquote><h3>7</h3><blockquote><p>«<strong>οὐ μοιχεύσεις</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/20/#L13">Έξ 20:13</a> · <a href="https://bibleox.com/el/gr-lxx-byz/vtor/5/#L17">Δτ 5:17</a> · <a href="https://bibleox.com/el/gr-lxx-byz/lev/19/#L20">Λευ 19:20</a>)</p></blockquote><h3>8</h3><blockquote><p>«<strong>οὐ κλέψεις</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/20/#L14">Έξ 20:14</a> · <a href="https://bibleox.com/el/gr-lxx-byz/vtor/5/#L19">Δτ 5:19</a> · <a href="https://bibleox.com/el/gr-lxx-byz/lev/19/#L11">Λευ 19:11</a> · <a href="https://bibleox.com/el/gr-lxx-byz/lev/19/#L13">Λευ 19:13</a>)</p></blockquote><h3>9</h3><blockquote><p>«<strong>οὐ ψευδομαρτυρήσεις κατὰ τοῦ πλησίον σου μαρτυρίαν ψευδῆ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/20/#L16">Έξ 20:16</a> · <a href="https://bibleox.com/el/gr-lxx-byz/vtor/5/#L20">Δτ 5:20</a> · <a href="https://bibleox.com/el/gr-lxx-byz/lev/19/#L11">Λευ 19:11</a>)</p></blockquote><h3>10</h3><blockquote><p>«οὐκ ἐπιθυμήσεις τὴν γυναῖκα τοῦ πλησίον σου. <strong>οὐκ ἐπιθυμήσεις τὴν οἰκίαν τοῦ πλησίον σου</strong> οὔτε τὸν ἀγρὸν αὐτοῦ οὔτε τὸν παῖδα αὐτοῦ οὔτε τὴν παιδίσκην αὐτοῦ οὔτε τοῦ βοὸς αὐτοῦ οὔτε τοῦ ὑποζυγίου αὐτοῦ οὔτε παντὸς κτήνους αὐτοῦ οὔτε ὅσα τῷ πλησίον σού ἐστιν.» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/20/#L17">Έξ 20:17</a> · <a href="https://bibleox.com/el/gr-lxx-byz/vtor/5/#L21">Δτ 5:21</a> · <a href="https://bibleox.com/el/gr-lxx-byz/lev/19/#L17">Λευ 19:17</a>)</p></blockquote><h2>Ερμηνεία</h2><p>Ερμηνεία των δέκα εντολών.</p>
