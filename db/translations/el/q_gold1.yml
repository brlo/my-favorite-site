  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <h2>Ο Θεός μιλά μέσω της Γραφής</h2><blockquote><p>«ὃ <strong>προεπηγγείλατο</strong> <strong>διὰ τῶν προφητῶν</strong> αὐτοῦ <strong>ἐν γραφαῖς ἁγίαις</strong>,» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/1/#L2">Ρωμ 1:2</a>)</p></blockquote><blockquote><p>«Ἄνδρες ἀδελφοί, ἔδει πληρωθῆναι <strong>τὴν γραφὴν ἣν προεῖπεν τὸ πνεῦμα τὸ ἅγιον</strong> διὰ στόματος Δαυὶδ περὶ Ἰούδα τοῦ γενομένου ὁδηγοῦ τοῖς συλλαβοῦσιν Ἰησοῦν,» (<a href="https://bibleox.com/el/gr-lxx-byz/act/1/#L16">Πραξ 1:16</a>)</p></blockquote><blockquote><p>«<strong>πᾶσα γραφὴ θεόπνευστος</strong> καὶ ὠφέλιμος πρὸς διδασκαλίαν, πρὸς ἐλεγμόν, πρὸς ἐπανόρθωσιν, πρὸς παιδείαν τὴν ἐν δικαιοσύνῃ,» (<a href="https://bibleox.com/el/gr-lxx-byz/2tim/3/#L16">Β Τιμ 3:16</a>)</p></blockquote><h2>Το κήρυγμα των αποστόλων — ο λόγος του Θεού</h2><blockquote><p>«καὶ γενόμενοι ἐν Σαλαμῖνι <strong>κατήγγελλον τὸν <mark>λόγον τοῦ θεοῦ</mark></strong> ἐν ταῖς συναγωγαῖς τῶν Ἰουδαίων· εἶχον δὲ καὶ Ἰωάννην ὑπηρέτην.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/13/#L5">Πραξ 13:5</a>)</p></blockquote><blockquote><p>«Ὡς δὲ ἔγνωσαν οἱ ἀπὸ τῆς Θεσσαλονίκης Ἰουδαῖοι ὅτι καὶ ἐν τῇ Βεροίᾳ <strong>κατηγγέλη ὑπὸ τοῦ Παύλου ὁ <mark>λόγος τοῦ θεοῦ</mark></strong>, ἦλθον κἀκεῖ σαλεύοντες καὶ ταράσσοντες τοὺς ὄχλους.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/17/#L13">Πραξ 17:13</a>)</p></blockquote><blockquote><p>«Καὶ διὰ τοῦτο καὶ ἡμεῖς εὐχαριστοῦμεν τῷ θεῷ ἀδιαλείπτως, ὅτι παραλαβόντες <strong>λόγον ἀκοῆς παρ᾿ ἡμῶν τοῦ θεοῦ ἐδέξασθε οὐ λόγον ἀνθρώπων ἀλλὰ καθώς ἐστιν ἀληθῶς <mark><mark>λόγον θεοῦ</mark></mark>, ὃς καὶ ἐνεργεῖται ἐν ὑμῖν τοῖς πιστεύουσιν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1sol/2/#L13">Α Θεσ 2:13</a>)</p></blockquote><h2>Η εντολή του Σωτήρα για την ανάγνωση της Γραφής</h2><blockquote><p>«<strong>ἐραυνᾶτε τὰς γραφάς</strong>, ὅτι ὑμεῖς δοκεῖτε ἐν αὐταῖς ζωὴν αἰώνιον ἔχειν· καὶ ἐκεῖναί εἰσιν αἱ μαρτυροῦσαι περὶ ἐμοῦ·» (<a href="https://bibleox.com/el/gr-lxx-byz/in/5/#L39">Ιω 5:39</a>)</p></blockquote><blockquote><p>«ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς, <strong>Πλανᾶσθε μὴ εἰδότες τὰς γραφὰς</strong> μηδὲ τὴν δύναμιν τοῦ θεοῦ·» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/22/#L29">Μτ 22:29</a> · <a href="https://bibleox.com/el/gr-lxx-byz/mk/12/#L24">Μκ 12:24</a>)</p></blockquote><h2>Η ανάγνωση της Γραφής ωφελεί στη σωτηρία</h2><blockquote><p>«καὶ ὅτι ἀπὸ βρέφους [τὰ] <strong>ἱερὰ γράμματα οἶδας, τὰ δυνάμενά σε σοφίσαι εἰς σωτηρίαν</strong> διὰ πίστεως τῆς ἐν Χριστῷ Ἰησοῦ.» (<a href="https://bibleox.com/el/gr-lxx-byz/2tim/3/#L15">Β Τιμ 3:15</a>)</p></blockquote><h2>Η Γραφή δεν μπορεί να καταλυθεί</h2><blockquote><p>«εἰ ἐκείνους εἶπεν θεοὺς πρὸς οὓς ὁ λόγος τοῦ θεοῦ ἐγένετο, καὶ οὐ δύναται λυθῆναι ἡ γραφή,» (<a href="https://bibleox.com/el/gr-lxx-byz/in/10/#L35">Ιω 10:35</a>)</p></blockquote><h3>Η Γραφή δεν είναι φόρος τιμής στην ιστορία, αλλά γράφτηκε για τον σημερινό άνθρωπο</h3><blockquote><p>«ὅσα γὰρ προεγράφη, <strong>εἰς τὴν ἡμετέραν διδασκαλίαν ἐγράφη</strong>, ἵνα διὰ τῆς ὑπομονῆς καὶ διὰ τῆς παρακλήσεως τῶν γραφῶν τὴν ἐλπίδα ἔχωμεν.» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/15/#L4">Ρωμ 15:4</a>)</p></blockquote><blockquote><p>«τοῦτο πρῶτον γινώσκοντες, ὅτι <strong>πᾶσα προφητεία γραφῆς ἰδίας ἐπιλύσεως οὐ γίνεται</strong>· οὐ γὰρ θελήματι ἀνθρώπου ἠνέχθη προφητεία ποτέ, ἀλλὰ <strong>ὑπὸ πνεύματος ἁγίου φερόμενοι ἐλάλησαν ἀπὸ θεοῦ</strong> ἄνθρωποι.» (<a href="https://bibleox.com/el/gr-lxx-byz/2pet/1/#L20-21">Β Πε 1:20-21</a>)</p></blockquote><h2>Η κατανόηση της Γραφής</h2><h3>Οι απόστολοι γνώριζαν τη Γραφή, αλλά χρειάστηκαν την εξήγηση του Σωτήρα</h3><blockquote><p>«καὶ ἀρξάμενος ἀπὸ Μωϋσέως καὶ ἀπὸ πάντων τῶν προφητῶν <strong>διερμήνευσεν αὐτοῖς ἐν πάσαις ταῖς γραφαῖς τὰ περὶ ἑαυτοῦ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/24/#L27">Λκ 24:27</a> · <a href="https://bibleox.com/el/gr-lxx-byz/lk/24/#L32">Λκ 24:32</a>)</p></blockquote><h3>Ο Θεός έδωσε στους αποστόλους τη δυνατότητα να κατανοούν τη Γραφή</h3><blockquote><p>«τότε <strong>διήνοιξεν αὐτῶν τὸν νοῦν τοῦ συνιέναι τὰς γραφάς</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/24/#L45">Λκ 24:45</a>)</p></blockquote><h3>Οι απόστολοι δίδασκαν τους Ιουδαίους στη συναγωγή να κατανοούν σωστά τη Γραφή</h3><blockquote><p>«Οἱ δὲ ἀδελφοὶ εὐθέως διὰ νυκτὸς ἐξέπεμψαν τόν τε Παῦλον καὶ τὸν Σίλαν εἰς Βέροιαν, οἵτινες παραγενόμενοι εἰς τὴν συναγωγὴν τῶν Ἰουδαίων ἀπῄεσαν. οὗτοι δὲ ἦσαν εὐγενέστεροι τῶν ἐν Θεσσαλονίκῃ, οἵτινες ἐδέξαντο τὸν λόγον μετὰ πάσης προθυμίας, καθ᾿ ἡμέραν <strong>ἀνακρίνοντες τὰς γραφὰς εἰ ἔχοι ταῦτα οὕτως</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/17/#L10-11">Πραξ 17:10-11</a>)</p></blockquote><h3>Δεν είναι όλα στη Γραφή εύκολα κατανοητά. Οι αμαθείς διαστρέφουν τη Γραφή</h3><blockquote><p>«ὡς καὶ <strong>ἐν πάσαις ἐπιστολαῖς λαλῶν ἐν αὐταῖς περὶ τούτων, ἐν αἷς ἐστιν δυσνόητά τινα</strong>, ἃ οἱ ἀμαθεῖς καὶ ἀστήρικτοι στρεβλοῦσιν ὡς καὶ τὰς λοιπὰς γραφὰς πρὸς τὴν ἰδίαν αὐτῶν ἀπώλειαν.» (<a href="https://bibleox.com/el/gr-lxx-byz/2pet/3/#L16">Β Πε 3:16</a>)</p></blockquote><h3>Ο Ιουδαίος Απολλώς αποδείκνυε με τη Γραφή ότι ο Ιησούς είναι ο Χριστός</h3><blockquote><p>«εὐτόνως γὰρ τοῖς Ἰουδαίοις διακατηλέγχετο δημοσίᾳ <strong>ἐπιδεικνὺς διὰ τῶν γραφῶν εἶναι τὸν Χριστὸν Ἰησοῦν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/18/#L28">Πραξ 18:28</a>)</p></blockquote>
