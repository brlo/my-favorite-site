  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: '<h2>Άνισα βάσανα στην κόλαση</h2><h3>Εκείνος που γνώριζε και παρέβη θα τιμωρηθεί περισσότερο από εκείνον που δεν γνώριζε αλλά παρέβη</h3><blockquote><p>«ἐκεῖνος δὲ ὁ δοῦλος <strong>ὁ γνοὺς τὸ θέλημα</strong> τοῦ κυρίου αὐτοῦ καὶ <strong>μὴ ἑτοιμάσας ἢ ποιήσας πρὸς τὸ θέλημα αὐτοῦ <mark>δαρήσεται πολλάς</mark></strong>· ὁ δὲ μὴ γνούς, <strong>ποιήσας δὲ ἄξια πληγῶν, <mark>δαρήσεται ὀλίγας</mark></strong>. παντὶ δὲ ᾧ ἐδόθη πολύ, πολὺ ζητηθήσεται παρ᾿ αὐτοῦ, καὶ <strong>ᾧ παρέθεντο πολύ, περισσότερον αἰτήσουσιν αὐτόν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/12/#L47-48">Λκ 12:47-48</a>)</p></blockquote><h3>Οι υποκριτές θα λάβουν την ισχυρότερη καταδίκη</h3><blockquote><p>«<strong>οἱ κατεσθίοντες τὰς οἰκίας τῶν χηρῶν</strong> καὶ προφάσει μακρὰ προσευχόμενοι, <strong><mark>οὗτοι λήμψονται περισσότερον κρίμα</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mk/12/#L40">Μκ 12:40</a>)</p></blockquote><blockquote><p>«<strong>Προσέχετε ἀπὸ τῶν γραμματέων τῶν θελόντων περιπατεῖν ἐν στολαῖς καὶ φιλούντων ἀσπασμοὺς ἐν ταῖς ἀγοραῖς καὶ πρωτοκαθεδρίας ἐν ταῖς συναγωγαῖς καὶ πρωτοκλισίας ἐν τοῖς δείπνοις</strong>, οἳ κατεσθίουσιν τὰς οἰκίας τῶν χηρῶν καὶ προφάσει μακρὰ προσεύχονται· <strong><mark>οὗτοι λήμψονται περισσότερον κρίμα</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/20/#L46-47">Λκ 20:46-47</a>)</p></blockquote><h3>Ο αμαρτάνων διδάσκαλος θα λάβει μεγαλύτερη καταδίκη</h3><blockquote><p>«<strong><mark>Μὴ πολλοὶ διδάσκαλοι</mark> γίνεσθε, ἀδελφοί μου, εἰδότες ὅτι <mark>μεῖζον κρίμα λημψόμεθα</mark></strong>. πολλὰ γὰρ πταίομεν ἅπαντες. εἴ τις ἐν λόγῳ οὐ πταίει, οὗτος τέλειος ἀνήρ, δυνατὸς χαλιναγωγῆσαι καὶ ὅλον τὸ σῶμα.» (<a href="https://bibleox.com/el/gr-lxx-byz/iak/3/#L1-2">Ιακ 3:1-2</a>)</p></blockquote><h3>Στις αμαρτωλές πόλεις πριν από τον Χριστό θα είναι πιο ανεκτά στην κρίση σε σύγκριση με εκείνες όπου ο Χριστός απορρίφθηκε ακόμη και με φανερά θαύματα</h3><blockquote><p>«πλὴν λέγω ὑμῖν, <strong>Τύρῳ καὶ Σιδῶνι ἀνεκτότερον ἔσται ἐν ἡμέρᾳ κρίσεως ἢ ὑμῖν</strong>. καὶ σύ, Καφαρναούμ, μὴ ἕως οὐρανοῦ ὑψωθήσῃ; ἕως ᾅδου καταβήσῃ. ὅτι εἰ ἐν Σοδόμοις ἐγενήθησαν αἱ δυνάμεις αἱ γενόμεναι ἐν σοί, ἔμεινεν ἂν μέχρι τῆς σήμερον. πλὴν λέγω ὑμῖν ὅτι <strong><mark>γῇ Σοδόμων ἀνεκτότερον ἔσται ἐν ἡμέρᾳ κρίσεως ἢ σοί</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/11/#L22-24">Μτ 11:22-24</a>)</p></blockquote><blockquote><p>«καὶ <strong>ὃς ἂν μὴ δέξηται ὑμᾶς μηδὲ ἀκούσῃ τοὺς λόγους ὑμῶν</strong>, ἐξερχόμενοι ἔξω τῆς οἰκίας ἢ τῆς πόλεως ἐκείνης ἐκτινάξατε τὸν κονιορτὸν [ἐκ] τῶν ποδῶν ὑμῶν. ἀμὴν λέγω ὑμῖν, ἀνεκτότερον ἔσται <strong><mark>γῇ Σοδόμων καὶ Γομόρρων ἐν ἡμέρᾳ κρίσεως ἢ τῇ πόλει ἐκείνῃ</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/10/#L14-15">Μτ 10:14-15</a> · <a href="https://bibleox.com/el/gr-lxx-byz/mk/6/#L11">Μκ 6:11</a>)</p></blockquote><blockquote><p>«Οὐαί σοι, Χοραζίν· οὐαί σοι, Βηθσαϊδά· ὅτι εἰ ἐν <strong><mark>Τύρῳ καὶ Σιδῶνι ἐγενήθησαν αἱ δυνάμεις αἱ γενόμεναι ἐν ὑμῖν</mark></strong>, πάλαι ἂν ἐν σάκκῳ καὶ σποδῷ καθήμενοι μετενόησαν. πλὴν Τύρῳ καὶ Σιδῶνι ἀνεκτότερον ἔσται ἐν τῇ κρίσει ἢ ὑμῖν. καὶ σύ, Καφαρναούμ, μὴ ἕως οὐρανοῦ ὑψωθήσῃ; ἕως τοῦ ᾅδου καταβιβασθήσῃ.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/10/#L13-15">Λκ 10:13-15</a> · <a href="https://bibleox.com/el/gr-lxx-byz/mf/11/#L20-22">Μτ 11:20-22</a>)</p></blockquote><h3>Αλίμονο σε εκείνους μέσω των οποίων έρχεται το σκάνδαλο</h3><blockquote><p>«Εἶπεν δὲ πρὸς τοὺς μαθητὰς αὐτοῦ, <strong>Ἀνένδεκτόν ἐστιν τοῦ τὰ σκάνδαλα μὴ ἐλθεῖν, πλὴν <mark>οὐαὶ δι᾿ οὗ ἔρχεται</mark>· <mark>λυσιτελεῖ αὐτῷ</mark> εἰ λίθος μυλικὸς περίκειται περὶ τὸν τράχηλον αὐτοῦ καὶ ἔρριπται εἰς τὴν θάλασσαν ἢ ἵνα σκανδαλίσῃ τῶν μικρῶν τούτων ἕνα</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/17/#L1-2">Λκ 17:1-2</a>)</p></blockquote><h3>Αλίμονο σε εκείνους που σκανδαλίζουν τους πιστούς</h3><blockquote><p>«καὶ ὃς ἐὰν δέξηται ἓν παιδίον τοιοῦτο ἐπὶ τῷ ὀνόματί μου, ἐμὲ δέχεται. <strong><mark>Ὃς δ᾿ ἂν σκανδαλίσῃ</mark> ἕνα τῶν μικρῶν τούτων τῶν πιστευόντων εἰς ἐμέ, συμφέρει <mark>αὐτῷ</mark></strong><mark> </mark> ἵνα <strong><mark>κρεμασθῇ</mark> μύλος ὀνικὸς περὶ τὸν τράχηλον αὐτοῦ καὶ καταποντισθῇ ἐν τῷ πελάγει τῆς θαλάσσης</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/18/#L5-6">Μτ 18:5-6</a>)</p></blockquote><h3>Αλίμονο στον προδότη του Χριστού, καλύτερα να μην είχε γεννηθεί</h3><blockquote><p>«ὁ μὲν υἱὸς τοῦ ἀνθρώπου ὑπάγει καθὼς γέγραπται περὶ αὐτοῦ, <strong><mark>οὐαὶ δὲ τῷ ἀνθρώπῳ ἐκείνῳ</mark> δι᾿ οὗ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται· <mark>καλὸν ἦν αὐτῷ εἰ οὐκ ἐγεννήθη ὁ ἄνθρωπος ἐκεῖνος</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/26/#L24">Μτ 26:24</a> · <a href="https://bibleox.com/el/gr-lxx-byz/mk/14/#L21">Μκ 14:21</a> · <a href="https://bibleox.com/el/gr-lxx-byz/lk/22/#L22">Λκ 22:22</a>)</p></blockquote><h2>Άνιση μακαριότητα στη Βασιλεία των Ουρανών</h2><h3>Ανταπόδοση κατά το μέτρο του αγαθού</h3><blockquote><p><em>«μετ᾿ εὐνοίας δουλεύοντες, ὡς τῷ κυρίῳ καὶ οὐκ ἀνθρώποις, </em><strong><em>εἰδότες ὅτι <mark>ἕκαστος</mark>, <mark>ἐάν τι ποιήσῃ ἀγαθόν</mark>, τοῦτο κομίσεται παρὰ κυρίου, εἴτε δοῦλος εἴτε ἐλεύθερος</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/ef/6/#L7-8"><em>Εφ 6:7-8</em></a><em>)</em></p></blockquote><blockquote><p>«ἐγὼ ἐφύτευσα, Ἀπολλῶς ἐπότισεν, ἀλλὰ ὁ θεὸς ηὔξανεν· ὥστε οὔτε ὁ φυτεύων ἐστίν τι οὔτε ὁ ποτίζων, ἀλλ᾿ ὁ αὐξάνων θεός. ὁ φυτεύων δὲ καὶ ὁ ποτίζων ἕν εἰσιν, <strong><mark>ἕκαστος</mark> δὲ τὸν ἴδιον μισθὸν λήμψεται <mark>κατὰ τὸν ἴδιον κόπον</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/3/#L6-8">Α Κορ 3:6-8</a>)</p></blockquote><blockquote><p>«Τοῦτο δέ, <strong><mark>ὁ σπείρων φειδομένως φειδομένως καὶ θερίσει</mark></strong>, καὶ ὁ σπείρων ἐπ᾿ εὐλογίαις ἐπ᾿ εὐλογίαις καὶ θερίσει.» (<a href="https://bibleox.com/el/gr-lxx-byz/2kor/9/#L6">Β Κορ 9:6</a>)</p></blockquote><blockquote><p>«μέλλει γὰρ ὁ υἱὸς τοῦ ἀνθρώπου ἔρχεσθαι ἐν τῇ δόξῃ τοῦ πατρὸς αὐτοῦ μετὰ τῶν ἀγγέλων αὐτοῦ, καὶ τότε <strong>ἀποδώσει ἑκάστῳ κατὰ τὴν πρᾶξιν αὐτοῦ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/16/#L27">Μτ 16:27</a> · <a href="https://bibleox.com/el/gr-lxx-byz/rim/2/#L5-6">Ρωμ 2:5-6</a>)</p></blockquote><blockquote><p>«δίδοτε, καὶ δοθήσεται ὑμῖν· <strong>μέτρον</strong> καλὸν πεπιεσμένον σεσαλευμένον <strong>ὑπερεκχυννόμενον δώσουσιν εἰς τὸν κόλπον ὑμῶν</strong>· <strong><mark>ᾧ γὰρ μέτρῳ μετρεῖτε ἀντιμετρηθήσεται ὑμῖν</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/6/#L38">Λκ 6:38</a>)</p></blockquote><h3>Ο απόστολος τείνει προς το μεγαλύτερο</h3><blockquote><p><em>«</em><strong><em>Οὐχ ὅτι ἤδη ἔλαβον ἢ ἤδη τετελείωμαι</em></strong><em>, </em><strong><em>διώκω δὲ εἰ καὶ καταλάβω</em></strong><em>, ἐφ᾿ ᾧ καὶ κατελήμφθην ὑπὸ Χριστοῦ [Ἰησοῦ]. ἀδελφοί, </em><strong><em><mark>ἐγὼ ἐμαυτὸν οὐ λογίζομαι κατειληφέναι</mark></em></strong><em>· ἓν δέ, τὰ μὲν ὀπίσω ἐπιλανθανόμενος τοῖς δὲ ἔμπροσθεν ἐπεκτεινόμενος, </em><strong><em><mark>κατὰ σκοπὸν διώκω εἰς τὸ βραβεῖον τῆς ἄνω κλήσεως</mark> τοῦ θεοῦ ἐν Χριστῷ Ἰησοῦ</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/fil/3/#L12-14"><em>Φιλ 3:12-14</em></a><em>)</em></p></blockquote><h3>Όποιος τηρήσει τις εντολές και διδάξει να τις τηρούν θα ονομαστεί μέγας</h3><blockquote><p>«ὃς ἐὰν οὖν λύσῃ μίαν τῶν ἐντολῶν τούτων τῶν ἐλαχίστων καὶ διδάξῃ οὕτως τοὺς ἀνθρώπους, ἐλάχιστος κληθήσεται ἐν τῇ βασιλείᾳ τῶν οὐρανῶν· <strong><mark>ὃς δ᾿ ἂν ποιήσῃ καὶ διδάξῃ</mark>, οὗτος μέγας κληθήσεται ἐν τῇ βασιλείᾳ τῶν οὐρανῶν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/5/#L19">Μτ 5:19</a>)</p></blockquote><h3>Πολλές μονές στη Βασιλεία των Ουρανών</h3><blockquote><p>«<strong>ἐν τῇ οἰκίᾳ τοῦ πατρός μου μοναὶ πολλαί εἰσιν</strong>· εἰ δὲ μή, εἶπον ἂν ὑμῖν ὅτι πορεύομαι ἑτοιμάσαι τόπον ὑμῖν;» (<a href="https://bibleox.com/el/gr-lxx-byz/in/14/#L2">Ιω 14:2</a>)</p></blockquote><h3>Ο μισθός του προφήτη και ο μισθός του δικαίου</h3><blockquote><p>«Ὁ δεχόμενος ὑμᾶς ἐμὲ δέχεται, καὶ ὁ ἐμὲ δεχόμενος δέχεται τὸν ἀποστείλαντά με. <strong>ὁ δεχόμενος προφήτην εἰς ὄνομα προφήτου <mark>μισθὸν προφήτου</mark> λήμψεται</strong>, καὶ <strong>ὁ δεχόμενος δίκαιον εἰς ὄνομα δικαίου <mark>μισθὸν δικαίου</mark> λήμψεται</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/10/#L40-41">Μτ 10:40-41</a>)</p></blockquote><h3>Οι δούλοι ανταμείβονται διαφορετικά</h3><blockquote><p>«Καὶ ἐγένετο ἐν τῷ ἐπανελθεῖν αὐτὸν λαβόντα τὴν βασιλείαν καὶ εἶπεν φωνηθῆναι αὐτῷ τοὺς δούλους τούτους οἷς δεδώκει τὸ ἀργύριον, ἵνα γνοῖ τί διεπραγματεύσαντο. παρεγένετο δὲ ὁ πρῶτος λέγων, Κύριε, ἡ μνᾶ σου δέκα προσηργάσατο μνᾶς. καὶ εἶπεν αὐτῷ, Εὖγε, ἀγαθὲ δοῦλε, ὅτι ἐν ἐλαχίστῳ πιστὸς ἐγένου, <strong>ἴσθι ἐξουσίαν ἔχων ἐπάνω <mark>δέκα πόλεων</mark></strong>. καὶ ἦλθεν ὁ δεύτερος λέγων, Ἡ μνᾶ σου, κύριε, ἐποίησεν πέντε μνᾶς. εἶπεν δὲ καὶ τούτῳ, <strong>Καὶ σὺ ἐπάνω γίνου <mark>πέντε πόλεων</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/19/#L15-19">Λκ 19:15-19</a>)</p></blockquote><blockquote><p>«Ὥσπερ γὰρ ἄνθρωπος ἀποδημῶν ἐκάλεσεν τοὺς ἰδίους δούλους καὶ <strong>παρέδωκεν αὐτοῖς τὰ ὑπάρχοντα αὐτοῦ</strong>, καὶ <strong>ᾧ μὲν ἔδωκεν πέντε τάλαντα, ᾧ δὲ δύο, ᾧ δὲ ἕν</strong>, <strong>ἑκάστῳ κατὰ τὴν ἰδίαν δύναμιν</strong>, καὶ ἀπεδήμησεν. εὐθέως πορευθεὶς ὁ τὰ πέντε τάλαντα λαβὼν ἠργάσατο ἐν αὐτοῖς καὶ ἐκέρδησεν ἄλλα πέντε· ὡσαύτως ὁ τὰ δύο ἐκέρδησεν ἄλλα δύο. ὁ δὲ τὸ ἓν λαβὼν ἀπελθὼν ὤρυξεν γῆν καὶ ἔκρυψεν τὸ ἀργύριον τοῦ κυρίου αὐτοῦ. μετὰ δὲ πολὺν χρόνον ἔρχεται ὁ κύριος τῶν δούλων ἐκείνων καὶ συναίρει λόγον μετ᾿ αὐτῶν. καὶ <strong>προσελθὼν ὁ τὰ πέντε τάλαντα λαβὼν προσήνεγκεν ἄλλα πέντε</strong> τάλαντα λέγων, Κύριε, πέντε τάλαντά μοι παρέδωκας· ἴδε ἄλλα πέντε τάλαντα ἐκέρδησα. ἔφη αὐτῷ ὁ κύριος αὐτοῦ, Εὖ, δοῦλε ἀγαθὲ καὶ πιστέ, ἐπὶ ὀλίγα ἦς πιστός, ἐπὶ πολλῶν σε καταστήσω· εἴσελθε εἰς τὴν χαρὰν τοῦ κυρίου σου. προσελθὼν δὲ καὶ ὁ τὰ δύο τάλαντα εἶπεν, Κύριε, δύο τάλαντά μοι παρέδωκας· ἴδε ἄλλα δύο τάλαντα ἐκέρδησα. ἔφη αὐτῷ ὁ κύριος αὐτοῦ, Εὖ, δοῦλε ἀγαθὲ καὶ πιστέ, ἐπὶ ὀλίγα ἦς πιστός, ἐπὶ πολλῶν σε καταστήσω· εἴσελθε εἰς τὴν χαρὰν τοῦ κυρίου σου. προσελθὼν δὲ καὶ ὁ τὸ ἓν τάλαντον εἰληφὼς εἶπεν, Κύριε, ἔγνων σε ὅτι σκληρὸς εἶ ἄνθρωπος, θερίζων ὅπου οὐκ ἔσπειρας καὶ συνάγων ὅθεν οὐ διεσκόρπισας· καὶ φοβηθεὶς ἀπελθὼν ἔκρυψα τὸ τάλαντόν σου ἐν τῇ γῇ· ἴδε ἔχεις τὸ σόν. ἀποκριθεὶς δὲ ὁ κύριος αὐτοῦ εἶπεν αὐτῷ, Πονηρὲ δοῦλε καὶ ὀκνηρέ, ᾔδεις ὅτι θερίζω ὅπου οὐκ ἔσπειρα καὶ συνάγω ὅθεν οὐ διεσκόρπισα; ἔδει σε οὖν βαλεῖν τὰ ἀργύριά μου τοῖς τραπεζίταις, καὶ ἐλθὼν ἐγὼ ἐκομισάμην ἂν τὸ ἐμὸν σὺν τόκῳ. <strong>ἄρατε οὖν ἀπ᾿ αὐτοῦ τὸ τάλαντον καὶ δότε τῷ ἔχοντι τὰ δέκα τάλαντα</strong>· τῷ γὰρ ἔχοντι παντὶ δοθήσεται καὶ περισσευθήσεται· τοῦ δὲ μὴ ἔχοντος καὶ ὃ ἔχει ἀρθήσεται ἀπ᾿ αὐτοῦ. καὶ τὸν ἀχρεῖον δοῦλον ἐκβάλετε εἰς τὸ σκότος τὸ ἐξώτερον· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/25/#L14-30">Μτ 25:14-30</a>)</p></blockquote><p>*η παραβολή των γεωργών (<a href="https://bibleox.com/el/gr-lxx-byz/mf/20/#L1-16">Μτ 20:1-16</a>), στην οποία όλοι ανταμείβονται το ίδιο, ειπώθηκε παρουσία των Φαρισαίων (<a href="https://bibleox.com/el/gr-lxx-byz/mf/19/#L3">Μτ 19:3</a>), ειπώθηκε για να μην υπερηφανεύονται οι μεν έναντι των δε: εκείνοι που ήρθαν νωρίς και κόπιασαν περισσότερο, έναντι εκείνων που στράφηκαν αργότερα και κόπιασαν λιγότερο — διότι και στον ύστερο σύντομο χρόνο μπορεί κανείς να προλάβει να αποκτήσει το αναγκαίο, γι'' αυτό δεν πρέπει να απελπίζεται.</p><h3>Οι παρθένοι έχουν ιδιαίτερη προσέγγιση στον Χριστό</h3><blockquote><p>«οὗτοί εἰσιν <strong>οἳ μετὰ γυναικῶν οὐκ ἐμολύνθησαν</strong>, παρθένοι γάρ εἰσιν. <strong><mark>οὗτοι οἱ ἀκολουθοῦντες τῷ ἀρνίῳ ὅπου ἂν ὑπάγῃ</mark></strong>. οὗτοι ἠγοράσθησαν ἀπὸ τῶν ἀνθρώπων ἀπαρχὴ τῷ θεῷ καὶ τῷ ἀρνίῳ,» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/14/#L4">Απ 14:4</a>)</p></blockquote>'
