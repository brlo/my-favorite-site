  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <blockquote><p>«ἐγὼ τοὺς ἐμὲ φιλοῦντας ἀγαπῶ, <strong>οἱ δὲ ἐμὲ ζητοῦντες εὑρήσουσιν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/pr/8/#L17">Πρμ 8:17</a>)</p></blockquote><blockquote><p>«καὶ νῦν, Σαλωμων υἱέ μου, γνῶθι τὸν θεὸν τῶν πατέρων σου καὶ δούλευε αὐτῷ ἐν καρδίᾳ τελείᾳ καὶ ψυχῇ θελούσῃ, ὅτι πάσας καρδίας ἐτάζει κύριος καὶ πᾶν ἐνθύμημα γιγνώσκει· <strong>ἐὰν ζητήσῃς αὐτόν, εὑρεθήσεταί σοι</strong>, καὶ ἐὰν καταλείψῃς αὐτόν, καταλείψει σε εἰς τέλος.» (<a href="https://bibleox.com/el/gr-lxx-byz/1par/28/#L9">Α Παρ 28:9</a>)</p></blockquote><blockquote><p>«καὶ ἐλπισάτωσαν ἐπὶ σὲ οἱ γινώσκοντες τὸ ὄνομά σου, ὅτι <strong>οὐκ ἐγκατέλιπες τοὺς ἐκζητοῦντάς σε</strong>, κύριε.» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/9/#L10">Ψλ 9:10</a>)</p></blockquote><blockquote><p>«κύριος ἐκ τοῦ οὐρανοῦ διέκυψεν ἐπὶ τοὺς υἱοὺς τῶν ἀν θρώπων τοῦ ἰδεῖν εἰ ἔστιν <strong>συνίων ἢ ἐκζητῶν τὸν θεόν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/13/#L2">Ψλ 13:2</a>)</p></blockquote><blockquote><p>«<strong>ἐξεζήτησα τὸν κύριον, καὶ ἐπήκουσέν μου</strong> καὶ ἐκ πασῶν τῶν παροικιῶν μου ἐρρύσατό με. <strong>προσέλθατε πρὸς αὐτὸν καὶ φωτίσθητε</strong>, καὶ τὰ πρόσωπα ὑμῶν οὐ μὴ καταισχυνθῇ.» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/33/#L4-5">Ψλ 33:4-5</a>)</p></blockquote><blockquote><p>«πλούσιοι ἐπτώχευσαν καὶ ἐπείνασαν, <strong>οἱ δὲ ἐκζητοῦντες τὸν κύριον οὐκ ἐλαττωθήσονται παντὸς ἀγαθοῦ</strong>. διάψαλμα.» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/33/#L10">Ψλ 33:10</a>)</p></blockquote><blockquote><p>«Ἀκούσατέ μου, οἱ διώκοντες τὸ δίκαιον καὶ <strong>ζητοῦντες τὸν κύριον</strong>, ἐμβλέψατε εἰς τὴν στερεὰν πέτραν, ἣν ἐλατομήσατε, καὶ εἰς τὸν βόθυνον τοῦ λάκκου, ὃν ὠρύξατε.» (<a href="https://bibleox.com/el/gr-lxx-byz/is/51/#L1">Ησ 51:1</a>)</p></blockquote><blockquote><p>«Αἰτεῖτε, καὶ δοθήσεται ὑμῖν· <strong>ζητεῖτε, καὶ εὑρήσετε</strong>· κρούετε, καὶ ἀνοιγήσεται ὑμῖν.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/7/#L7">Μτ 7:7</a>)</p></blockquote><blockquote><p>«χωρὶς δὲ πίστεως ἀδύνατον εὐαρεστῆσαι, πιστεῦσαι γὰρ δεῖ τὸν προσερχόμενον τῷ θεῷ ὅτι ἔστιν καὶ <strong>τοῖς ἐκζητοῦσιν αὐτὸν μισθαποδότης γίνεται</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/11/#L6">Εβρ 11:6</a>)</p></blockquote><blockquote><p>«ἢ τοῦ πλούτου τῆς χρηστότητος αὐτοῦ καὶ τῆς ἀνοχῆς καὶ τῆς μακροθυμίας καταφρονεῖς, ἀγνοῶν ὅτι τὸ χρηστὸν <strong>τοῦ θεοῦ εἰς μετάνοιάν σε ἄγει; κατὰ δὲ τὴν σκληρότητά σου καὶ ἀμετανόητον καρδίαν θησαυρίζεις σεαυτῷ ὀργὴν ἐν ἡμέρᾳ ὀργῆς καὶ ἀποκαλύψεως δικαιοκρισίας τοῦ θεοῦ, ὃς ἀποδώσει</strong> <strong>ἑκάστῳ</strong> κατὰ τὰ ἔργα αὐτοῦ, <strong><u>τοῖς μὲν</u> καθ᾿ ὑπομονὴν ἔργου ἀγαθοῦ δόξαν καὶ τιμὴν καὶ ἀφθαρσίαν <u>ζητοῦσιν</u>, <u>ζωὴν αἰώνιον</u>· τοῖς δὲ ἐξ ἐριθείας καὶ ἀπειθοῦσι τῇ ἀληθείᾳ πειθομένοις δὲ τῇ ἀδικίᾳ</strong>, <strong>ὀργὴ καὶ θυμός</strong> —» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/2/#L4-8">Ρωμ 2:4-8</a>)</p></blockquote><blockquote><p>«ἐπαινεῖσθε ἐν τῷ ὀνόματι τῷ ἁγίῳ αὐτοῦ, <strong>εὐφρανθήτω καρδία ζητούντων τὸν κύριον· ζητήσατε τὸν κύριον</strong> καὶ κραταιώθητε, ζητήσατε τὸ πρόσωπον αὐτοῦ διὰ παντός.» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/104/#L3-4">Ψλ 104:3-4</a>)</p></blockquote>
