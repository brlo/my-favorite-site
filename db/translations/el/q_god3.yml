  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <h2>Ο Θεός είναι πηγή του αγαθού, όχι του κακού</h2><blockquote><p>«μηδεὶς πειραζόμενος λεγέτω ὅτι Ἀπὸ θεοῦ πειράζομαι· <strong><mark>ὁ γὰρ θεὸς ἀπείραστός ἐστιν κακῶν, πειράζει δὲ αὐτὸς οὐδένα</mark></strong>. &lt;…&gt; πᾶσα δόσις ἀγαθὴ καὶ πᾶν δώρημα τέλειον ἄνωθέν ἐστιν, καταβαῖνον ἀπὸ τοῦ πατρὸς τῶν φώτων, παρ᾿ ᾧ οὐκ ἔνι παραλλαγὴ ἢ τροπῆς ἀποσκίασμα.» (<a href="https://bibleox.com/el/gr-lxx-byz/iak/1/#L13,17">Ιακ 1:13,17</a>)</p></blockquote><blockquote><p>«Καὶ ἔστιν αὕτη ἡ ἀγγελία ἣν ἀκηκόαμεν ἀπ᾿ αὐτοῦ καὶ ἀναγγέλλομεν ὑμῖν, ὅτι <strong><mark>ὁ θεὸς φῶς ἐστιν καὶ σκοτία ἐν αὐτῷ οὐκ ἔστιν οὐδεμία</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1in/1/#L5">Α Ιω 1:5</a>)</p></blockquote><blockquote><p>«ὁ δὲ Ἰησοῦς εἶπεν αὐτῷ, Τί με λέγεις ἀγαθόν; <strong><mark>οὐδεὶς ἀγαθὸς εἰ μὴ εἷς ὁ θεός</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mk/10/#L18">Μκ 10:18</a> · <a href="https://bibleox.com/el/gr-lxx-byz/mf/19/#L17">Μτ 19:17</a> · <a href="https://bibleox.com/el/gr-lxx-byz/lk/18/#L19">Λκ 18:19</a>)</p></blockquote><blockquote><p>«<strong><mark>χρηστὸς κύριος τοῖς σύμπασιν</mark></strong>, καὶ οἱ οἰκτιρμοὶ αὐτοῦ ἐπὶ πάντα τὰ ἔργα αὐτοῦ.» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/144/#L9">Ψλ 144:9</a>)</p></blockquote><h2>Αναμάρτητος</h2><blockquote><p>«καὶ οἴδατε ὅτι ἐκεῖνος ἐφανερώθη ἵνα τὰς ἁμαρτίας ἄρῃ, καὶ <strong><mark>ἁμαρτία ἐν αὐτῷ οὐκ ἔστιν</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1in/3/#L5">Α Ιω 3:5</a>)</p></blockquote><blockquote><p>«Πᾶς ὁ ποιῶν τὴν ἁμαρτίαν καὶ τὴν ἀνομίαν ποιεῖ, καὶ ἡ ἁμαρτία ἐστὶν ἡ ἀνομία. &lt;…&gt; <strong><mark>ὁ ποιῶν τὴν ἁμαρτίαν ἐκ τοῦ διαβόλου ἐστίν</mark></strong>, ὅτι ἀπ᾿ ἀρχῆς ὁ διάβολος ἁμαρτάνει. εἰς τοῦτο ἐφανερώθη ὁ υἱὸς τοῦ θεοῦ, ἵνα λύσῃ τὰ ἔργα τοῦ διαβόλου. <strong>Πᾶς ὁ γεγεννημένος ἐκ τοῦ θεοῦ ἁμαρτίαν οὐ ποιεῖ</strong>, ὅτι σπέρμα αὐτοῦ ἐν αὐτῷ μένει· καὶ οὐ δύναται ἁμαρτάνειν, ὅτι ἐκ τοῦ θεοῦ γεγέννηται.» (<a href="https://bibleox.com/el/gr-lxx-byz/1in/3/#L4,8-9">Α Ιω 3:4,8-9</a>)</p></blockquote><h2>Ο Θεός είναι αγάπη</h2><blockquote><p>«ὁ μὴ ἀγαπῶν οὐκ ἔγνω τὸν θεόν, ὅτι <strong><mark>ὁ θεὸς ἀγάπη ἐστίν</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1in/4/#L8">Α Ιω 4:8</a>)</p></blockquote><blockquote><p>«καὶ ἡμεῖς ἐγνώκαμεν καὶ πεπιστεύκαμεν τὴν ἀγάπην ἣν ἔχει ὁ θεὸς ἐν ἡμῖν. <strong><mark>Ὁ θεὸς ἀγάπη ἐστίν</mark>, καὶ ὁ μένων ἐν τῇ ἀγάπῃ ἐν τῷ θεῷ μένει</strong> καὶ ὁ θεὸς ἐν αὐτῷ μένει.» (<a href="https://bibleox.com/el/gr-lxx-byz/1in/4/#L16">Α Ιω 4:16</a>)</p></blockquote><h2>Ο Θεός θέλει να σωθούν <strong>όλοι</strong></h2><blockquote><p>«Παρακαλῶ οὖν πρῶτον πάντων ποιεῖσθαι δεήσεις, προσευχάς, ἐντεύξεις, εὐχαριστίας, ὑπὲρ πάντων ἀνθρώπων, &lt;…&gt; τοῦτο καλὸν καὶ ἀπόδεκτον ἐνώπιον τοῦ σωτῆρος ἡμῶν θεοῦ, ὃς <strong><mark>πάντας ἀνθρώπους θέλει σωθῆναι</mark></strong> καὶ εἰς ἐπίγνωσιν ἀληθείας ἐλθεῖν.» (<a href="https://bibleox.com/el/gr-lxx-byz/1tim/2/#L1,3-4">Α Τιμ 2:1,3-4</a>)</p></blockquote><blockquote><p>«οὐ βραδύνει <strong><mark>κύριος</mark></strong> τῆς ἐπαγγελίας, ὥς τινες βραδύτητα ἡγοῦνται, ἀλλὰ μακροθυμεῖ εἰς ὑμᾶς, <strong><mark>μὴ βουλόμενός τινας ἀπολέσθαι ἀλλὰ πάντας εἰς μετάνοιαν χωρῆσαι</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/2pet/3/#L9">Β Πε 3:9</a>)</p></blockquote><blockquote><p>«εἰπὸν αὐτοῖς Ζῶ ἐγώ, τάδε λέγει κύριος <strong><mark>Οὐ βούλομαι τὸν θάνατον τοῦ ἀσεβοῦς</mark> ὡς τὸ ἀποστρέψαι τὸν ἀσεβῆ ἀπὸ τῆς ὁδοῦ αὐτοῦ καὶ ζῆν αὐτόν</strong>. ἀποστροφῇ ἀποστρέψατε ἀπὸ τῆς ὁδοῦ ὑμῶν· καὶ ἵνα τί ἀποθνῄσκετε, οἶκος Ισραηλ;» (<a href="https://bibleox.com/el/gr-lxx-byz/iez/33/#L11">Ιεζ 33:11</a>)</p></blockquote><blockquote><p>«<strong><mark>μὴ θελήσει θελήσω τὸν θάνατον τοῦ ἀνόμου</mark></strong>, λέγει κύριος, <strong>ὡς τὸ ἀποστρέψαι αὐτὸν ἐκ τῆς ὁδοῦ τῆς πονηρᾶς καὶ ζῆν αὐτόν</strong>;» (<a href="https://bibleox.com/el/gr-lxx-byz/iez/18/#L23">Ιεζ 18:23</a>)</p></blockquote><blockquote><p>«Οὕτως γὰρ <strong><mark>ἠγάπησεν ὁ θεὸς τὸν κόσμον</mark></strong>, ὥστε <strong>τὸν υἱὸν τὸν μονογενῆ ἔδωκεν, ἵνα πᾶς ὁ πιστεύων εἰς αὐτὸν μὴ ἀπόληται ἀλλ᾿ ἔχῃ ζωὴν αἰώνιον</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/3/#L16">Ιω 3:16</a>)</p></blockquote><blockquote><p>«ἦλθεν γὰρ <strong>ὁ υἱὸς τοῦ ἀνθρώπου <mark>ζητῆσαι καὶ σῶσαι τὸ ἀπολωλός</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/19/#L10">Λκ 19:10</a>)</p></blockquote><p>Ωστόσο, δεν θα σωθούν όλοι (βλ. το άρθρο «Δεν θα σωθούν όλοι»).</p>
