  update: true
  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <h2>Ο αιώνιος Θεός</h2><blockquote><p>«καὶ νῦν οὐκ ἔγνως εἰ μὴ ἤκουσας; <strong>θεὸς</strong> αἰώνιος ὁ θεὸς ὁ κατασκευάσας τὰ ἄκρα τῆς γῆς, οὐ πεινάσει οὐδὲ κοπιάσει, οὐδὲ ἔστιν ἐξεύρεσις τῆς φρονήσεως αὐτοῦ·» (<a href="https://bibleox.com/el/gr-lxx-byz/is/40/#L28">Ησ 40:28</a>)</p></blockquote><blockquote><p>«καὶ ἐφύτευσεν Αβρααμ ἄρουραν ἐπὶ τῷ φρέατι τοῦ ὅρκου καὶ ἐπεκαλέσατο ἐκεῖ τὸ ὄνομα κυρίου <strong>Θεὸς αἰώνιος</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/gen/21/#L33">Γεν 21:33</a>)</p></blockquote><blockquote><p>«ἤλπισαν, κύριε, ἕως τοῦ αἰῶνος, <strong>ὁ θεὸς ὁ μέγας ὁ αἰώνιος</strong>,» (<a href="https://bibleox.com/el/gr-lxx-byz/is/26/#L4">Ησ 26:4</a>)</p></blockquote><blockquote><p>«Τάδε λέγει <strong>κύριος ὁ ὕψιστος ὁ ἐν ὑψηλοῖς κατοικῶν τὸν αἰῶνα</strong>, ἅγιος ἐν ἁγίοις ὄνομα αὐτῷ, κύριος ὕψιστος ἐν ἁγίοις ἀναπαυόμενος καὶ ὀλιγοψύχοις διδοὺς μακροθυμίαν καὶ διδοὺς ζωὴν τοῖς συντετριμμένοις τὴν καρδίαν» (<a href="https://bibleox.com/el/gr-lxx-byz/is/57/#L15">Ησ 57:15</a>)</p></blockquote><blockquote><p>«καὶ <strong>ὁ κύριος εἰς τὸν αἰῶνα μένει</strong>, ἡτοίμασεν ἐν κρίσει τὸν θρόνον αὐτοῦ,» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/9/#L7">Ψλ 9:7</a>)</p></blockquote><blockquote><p>«ἵνα τί ὑπολαμβάνετε, ὄρη τετυρωμένα, τὸ ὄρος, ὃ εὐδόκησεν ὁ θεὸς κατοικεῖν ἐν αὐτῷ; καὶ γὰρ <strong>ὁ κύριος κατασκηνώσει εἰς τέλος</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/67/#L16">Ψλ 67:16</a>)</p></blockquote><blockquote><p>«κατ᾿ ἀρχὰς σύ, κύριε, τὴν γῆν ἐθεμελίωσας, καὶ ἔργα τῶν χειρῶν σού εἰσιν οἱ οὐρανοί· <strong>αὐτοὶ ἀπολοῦνται, σὺ δὲ διαμενεῖς</strong>, καὶ πάντες ὡς ἱμάτιον παλαιωθήσονται, καὶ ὡσεὶ περιβόλαιον ἀλλάξεις αὐτούς, καὶ ἀλλαγήσονται· <strong>σὺ δὲ ὁ αὐτὸς εἶ, καὶ τὰ ἔτη σου οὐκ ἐκλείψουσιν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/101/#L25-27">Ψλ 101:25-27</a> · <a href="https://bibleox.com/el/gr-lxx-byz/evr/1/#L10-12">Εβρ 1:10-12</a>)</p></blockquote><blockquote><p>«καὶ οὐκ ἔσται σοι ὁ ἥλιος εἰς φῶς ἡμέρας, οὐδὲ ἀνατολὴ σελήνης φωτιεῖ σοι τὴν νύκτα, ἀλλ᾿ ἔσται σοι <strong>κύριος φῶς αἰώνιον</strong> καὶ ὁ θεὸς δόξα σου.» (<a href="https://bibleox.com/el/gr-lxx-byz/is/60/#L19">Ησ 60:19</a> · <a href="https://bibleox.com/el/gr-lxx-byz/is/60/#L20">Ησ 60:20</a>)</p></blockquote><blockquote><p>«καὶ ἤκουσα τοῦ περιβεβλημένου τὰ βύσσινα, ὃς ἦν ἐπάνω τοῦ ὕδατος τοῦ ποταμοῦ Ἕως καιροῦ συντελείας· καὶ ὕψωσε τὴν δεξιὰν καὶ τὴν ἀριστερὰν εἰς τὸν οὐρανὸν καὶ <strong>ὤμοσε τὸν ζῶντα εἰς τὸν αἰῶνα</strong> θεὸν ὅτι εἰς καιρὸν καὶ καιροὺς καὶ ἥμισυ καιροῦ ἡ συντέλεια χειρῶν ἀφέσεως λαοῦ ἁγίου, καὶ συντελεσθήσεται πάντα ταῦτα.» (<a href="https://bibleox.com/el/gr-lxx-byz/dan/12/#L7">Δν 12:7</a>)</p></blockquote><h2>Ο Θεός βασιλεύει αιώνια</h2><blockquote><p>«κύριος <strong>βασιλεύων</strong> <strong>τὸν αἰῶνα καὶ ἐπ᾿ αἰῶνα καὶ ἔτι</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/15/#L18">Έξ 15:18</a>)</p></blockquote><blockquote><p>«<strong>βασιλεύσει κύριος εἰς τὸν αἰῶνα</strong>, ὁ θεός σου, Σιων, εἰς γενεὰν καὶ γενεάν.» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/145/#L10">Ψλ 145:10</a>)</p></blockquote><blockquote><p>«ἐθεώρουν ἐν ὁράματι τῆς νυκτὸς καὶ ἰδοὺ ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ ὡς <strong>υἱὸς ἀνθρώπου</strong> ἤρχετο, καὶ ὡς παλαιὸς ἡμερῶν παρῆν, καὶ οἱ παρεστηκότες παρῆσαν αὐτῷ. καὶ <strong>ἐδόθη <strong>αὐτῷ</strong> ἐξουσία, καὶ πάντα τὰ ἔθνη τῆς γῆς κατὰ γένη καὶ πᾶσα δόξα αὐτῷ λατρεύουσα</strong>· καὶ <strong>ἡ ἐξουσία αὐτοῦ ἐξουσία αἰώνιος, ἥτις οὐ μὴ ἀρθῇ, καὶ ἡ βασιλεία αὐτοῦ, ἥτις οὐ μὴ φθαρῇ</strong>. —» (<a href="https://bibleox.com/el/gr-lxx-byz/dan/7/#L13-14">Δν 7:13-14</a>)</p></blockquote><blockquote><p>«<strong>ὁ θρόνος σου, ὁ θεός, εἰς τὸν αἰῶνα τοῦ αἰῶνος</strong>, ῥάβδος εὐθύτητος ἡ ῥάβδος τῆς βασιλείας σου.» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/44/#L6">Ψλ 44:6</a>)</p></blockquote><blockquote><p>«καὶ βασιλεύσει ἐπὶ τὸν οἶκον Ἰακὼβ <strong>εἰς τοὺς αἰῶνας</strong>, καὶ <strong>τῆς βασιλείας αὐτοῦ οὐκ ἔσται τέλος</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/1/#L33">Λκ 1:33</a>)</p></blockquote><blockquote><p>«οὕτως γὰρ πλουσίως ἐπιχορηγηθήσεται ὑμῖν ἡ εἴσοδος εἰς <strong>τὴν αἰώνιον βασιλείαν</strong> τοῦ κυρίου ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ.» (<a href="https://bibleox.com/el/gr-lxx-byz/2pet/1/#L11">Β Πε 1:11</a>)</p></blockquote><h2>Ο Θεός υπάρχει πριν από την αρχή του χρόνου και σε όλη τη διάρκειά του (αιώνιος)</h2><blockquote><p>«τὰ μεγαλεῖα τῆς σοφίας αὐτοῦ ἐκόσμησεν, ὡς ἔστιν <strong>πρὸ τοῦ αἰῶνος</strong> καὶ <strong>εἰς τὸν αἰῶνα</strong>· οὔτε προσετέθη οὔτε ἠλαττώθη, καὶ οὐ προσεδεήθη οὐδενὸς συμβούλου.» (<a href="https://bibleox.com/el/gr-lxx-byz/prsir/42/#L21">Σ.Σειρ 42:21</a>)</p></blockquote><blockquote><p>«ἐπ᾿ ἐλπίδι ζωῆς αἰωνίου, ἣν ἐπηγγείλατο ὁ ἀψευδὴς θεὸς <strong>πρὸ χρόνων αἰωνίων</strong>,» (<a href="https://bibleox.com/el/gr-lxx-byz/tit/1/#L2">Τιτ 1:2</a>)</p></blockquote>
