  body: '<ul><li><p>Ο Πρώτος και ο Έσχατος (<a href="https://bibleox.com/el/gr-lxx-byz/is/44/#L6">Ησ 44:6</a> · <a href="https://bibleox.com/el/gr-lxx-byz/is/48/#L12">Ησ 48:12</a>)</p></li></ul><ul><li><p>Ο Θεός των πατέρων, του Αβραάμ, του Ισαάκ και του Ιακώβ (<a href="https://bibleox.com/el/gr-lxx-byz/ish/3/#L15">Έξ 3:15</a>)</p></li></ul><ul><li><p>Ο Ων (ο Υπάρχων) (<a href="https://bibleox.com/el/gr-lxx-byz/ish/3/#L14">Έξ 3:14</a>)</p></li></ul><ul><li><p>Η Αγάπη (<a href="https://bibleox.com/el/gr-lxx-byz/1in/4/#L8">Α Ιω 4:8</a>)</p></li></ul><ul><li><p>Ο Δημιουργός (<a href="https://bibleox.com/el/gr-lxx-byz/ps/149/#L2">Ψλ 149:2</a>)</p></li></ul><ul><li><p>Ο Πατέρας (<a href="https://bibleox.com/el/gr-lxx-byz/vtor/32/#L6">Δτ 32:6</a> · <a href="https://bibleox.com/el/gr-lxx-byz/is/64/#L7">Ησ 64:7</a>)</p></li></ul><ul><li><p>Ο Λυτρωτής (<a href="https://bibleox.com/el/gr-lxx-byz/is/43/#L14">Ησ 43:14</a>)</p></li></ul><ul><li><p>Ο Θεραπευτής (<a href="https://bibleox.com/el/gr-lxx-byz/ish/15/#L26">Έξ 15:26</a>)</p></li></ul><ul><li><p>Ο Άγιος (<a href="https://bibleox.com/el/gr-lxx-byz/lev/21/#L8">Λευ 21:8</a> · <a href="https://bibleox.com/el/gr-lxx-byz/lev/11/#L44-45">Λευ 11:44-45</a> · <a href="https://bibleox.com/el/gr-lxx-byz/is/40/#L25">Ησ 40:25</a>)</p></li></ul><ul><li><p>Ο Αγιάζων (<a href="https://bibleox.com/el/gr-lxx-byz/ish/31/#L13">Έξ 31:13</a> · <a href="https://bibleox.com/el/gr-lxx-byz/lev/20/#L8">Λευ 20:8</a> · <a href="https://bibleox.com/el/gr-lxx-byz/lev/21/#L15,23">Λευ 21:15,23</a> · <a href="https://bibleox.com/el/gr-lxx-byz/lev/22/#L9,16,32">Λευ 22:9,16,32</a>)</p></li></ul><ul><li><p>Ο Κρυπτός (<a href="https://bibleox.com/el/gr-lxx-byz/is/45/#L15">Ησ 45:15</a>)</p></li></ul><ul><li><p>Ο Δίκαιος (<a href="https://bibleox.com/el/gr-lxx-byz/vtor/32/#L4">Δτ 32:4</a>)</p></li></ul><ul><li><p>Ο Αληθινός (<a href="https://bibleox.com/el/gr-lxx-byz/vtor/32/#L4">Δτ 32:4</a>)</p></li></ul><ul><li><p>Ο Ζηλωτής (<a href="https://bibleox.com/el/gr-lxx-byz/ish/34/#L14">Έξ 34:14</a> · <a href="https://bibleox.com/el/gr-lxx-byz/ish/20/#L5">Έξ 20:5</a> · <a href="https://bibleox.com/el/gr-lxx-byz/vtor/4/#L24">Δτ 4:24</a> · <a href="https://bibleox.com/el/gr-lxx-byz/vtor/5/#L9">Δτ 5:9</a>)</p></li></ul><ul><li><p>Ο Τύπτων (<a href="https://bibleox.com/el/gr-lxx-byz/iez/7/#L6">Ιεζ 7:6</a>)</p></li><li><p>Το Φως (<a href="https://bibleox.com/el/gr-lxx-byz/in/12/#L46">Ιω 12:46</a>)</p></li></ul><ul><li><p>Το Πυρ το καταναλίσκον (<a href="https://bibleox.com/el/gr-lxx-byz/vtor/4/#L24">Δτ 4:24</a> · <a href="https://bibleox.com/el/gr-lxx-byz/evr/12/#L29">Εβρ 12:29</a>)</p></li></ul><p>Δείτε επίσης: «Ο Χριστός — οι τίτλοι».</p><p><em>*Το άρθρο αναμένει επεξεργασία</em></p>'
