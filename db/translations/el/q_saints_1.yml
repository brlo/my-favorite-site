  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης).
    Τα χωρία των Αγίων Πατέρων παρατίθενται, όπου αυτό είναι δυνατόν, από το ελληνικό
    πρωτότυπο της βιβλιοθήκης του ιστότοπου και παραπέμπουν σε αυτό· όσα δεν υπάρχουν
    στη βιβλιοθήκη μεταφράζονται από τα ρωσικά. Οι βιβλικές περικοπές παρατίθενται
    κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό
    κείμενο της Καινής Διαθήκης). Οι προφανείς αβλεψίες των ηλεκτρονικών κειμένων
    της βιβλιοθήκης (τυπογραφικά λάθη, τεχνικοί δείκτες σελίδων) διορθώνονται.</p>"
  body: '<h2>Πρόλογος</h2><p><strong>Ο βιβλικός κανόνας</strong> — ο κατάλογος εκείνων
    των βιβλίων, το περιεχόμενο των οποίων αναγνωρίζεται από την Εκκλησία ως θεοαποκάλυπτη
    αλήθεια και τα οποία συγκεντρώθηκαν σε ένα βιβλίο γνωστό στους πολλούς ως Βίβλος.</p><p>Το
    τμήμα του κανόνα που αφορά την Παλαιά Διαθήκη διαμορφώθηκε σταδιακά στη διάρκεια
    δεκαπέντε αιώνων πριν από την έλευση του Κυρίου Ιησού Χριστού. Γι’ αυτό και ο
    καθορισμός του βιβλικού κανόνα στην Εκκλησία του Χριστού αφορούσε κυρίως τα βιβλία
    που γράφτηκαν στην εποχή της Καινής Διαθήκης — μετά την ανάσταση του Κυρίου Ιησού
    Χριστού. Η ανάγκη του κανόνα προκλήθηκε από το γεγονός ότι οι σεχταριστικές ομάδες
    του γνωστικού κινήματος έβγαλαν στο φως πλήθος κειμένων, αποδίδοντάς τα στους
    αποστόλους και χρησιμοποιώντας το κύρος των αποστόλων για τη διάδοση των διδασκαλιών
    τους. Εξαλείφοντας την απάτη των γνωστικών, η αποστολική Εκκλησία έθεσε στα κείμενα
    σημάδια που δείχνουν στους πιστούς ότι τα έργα που εκείνη υπέδειξε προέρχονται
    από τους αποστόλους (μέσα στην ίδια την Εκκλησία), ενώ όλο το υπόλοιπο πλήθος
    των έργων που κατασκεύασαν αργότερα οι γνωστικές ομάδες δεν έχει καμία σχέση με
    τους αποστόλους.</p><p>Σήμερα το ζήτημα της διαμόρφωσης του βιβλικού κανόνα είναι
    επίκαιρο εξαιτίας της πολεμικής της Ορθόδοξης Εκκλησίας με τις προτεσταντικές
    κοινότητες, τους μουσουλμάνους και τους αθέους. Συνηθίζουν οι προτεστάντες να
    ισχυρίζονται ότι η ιστορική Εκκλησία, που την ίδρυσε κάποτε ο Χριστός, αποστάτησε
    στη συνέχεια από Αυτόν, και ότι διάφορες προτεσταντικές κοινότητες δημιουργούνται
    σταδιακά και προσφέρονται ως εναλλακτική λύση απέναντι στην «πεπτωκυία Εκκλησία».
    Υποστηρίζεται ότι η νέα τους κοινότητα είναι η σωστή, διότι δήθεν ανταποκρίνεται
    απολύτως στη Γραφή (στην ερμηνεία τους, φυσικά). Εδώ συναντούν το εύλογο ερώτημα
    από την πλευρά της Ορθοδοξίας: από πού λοιπόν έχουν οι προτεστάντες τη Γραφή και
    γιατί αποφάσισαν ότι ακριβώς αυτά τα βιβλία ανήκουν στους αποστόλους και αποτελούν
    θεοαποκάλυπτη αλήθεια; Και πρόβλημα για την ιδέα τους περί «πεπτωκυίας Εκκλησίας»
    γίνεται το γεγονός ότι ακριβώς αυτή η «πεπτωκυία Εκκλησία» τον Δ΄ αιώνα καθόρισε
    εκείνον τον βιβλικό κανόνα της Καινής Διαθήκης που αναγνωρίζεται σήμερα από όλους
    τους πιστούς στον Χριστό. Σε απάντηση, οι προτεστάντες προσπαθούν να αποδείξουν
    ότι τα αποστολικά κείμενα ήταν πάντοτε γνωστά σε όλους, ή ισχυρίζονται ότι ο Θεός
    καθιέρωσε τον κανόνα μέσω της «πεπτωκυίας Εκκλησίας», πράγμα που, κατά τη γνώμη
    μας, είναι αδύναμη θέση και ελάχιστους ειλικρινείς ανθρώπους μπορεί να πείσει.</p><p>Λοιπόν,
    ήταν άραγε προφανής ο κανόνας στους συγχρόνους των αποστόλων;</p><p><strong>Το
    πρόβλημα των ψευδεπίγραφων επιστολών στην εποχή των αποστόλων</strong></p><p>Τον
    πρώτο αιώνα δεν υπήρχαν μέσα άμεσης επικοινωνίας σαν το διαδίκτυο. Οι επιστολές
    γράφονταν από τους αποστόλους σε διαφορετικούς χρόνους, σε διαφορετικές συνθήκες,
    προς διαφορετικές κοινότητες. Εξάλλου, οι ίδιοι οι απόστολοι αφήνουν να εννοηθεί
    ότι στις κοινότητες έφταναν και πλαστές επιστολές, «ὡς δι᾿ ἡμῶν» (<a href="https://bibleox.com/el/gr-lxx-byz/2sol/2/#L2">Β
    Θεσ 2:2</a>).</p><p>Μερικές αποστολικές επιστολές διαδίδονταν και γίνονταν γνωστές
    σε πολλές κοινότητες με τέτοιο τρόπο, ώστε η πατρότητά τους να μη δημιουργεί αμφιβολίες.
    Μια επιστολή μπορούσε να παραδοθεί αυτοπροσώπως ή μέσω ενός στενού συνεργάτη.
    Ωστόσο, συνέβαινε και το αντίθετο, όταν ο απόστολος έγραφε από τον εγκλεισμό,
    καθισμένος εκεί μαζί με τους συνεργάτες του.</p><p>Ακόμη και όταν η πατρότητα
    μιας επιστολής για μία κοινότητα ήταν αναμφισβήτητη, υπάρχουν και πολλές άλλες
    κοινότητες. Όλες τους, μέσω διαφόρων απεσταλμένων, πρέπει να παραδίδουν τις επιστολές
    η μία στην άλλη αλυσιδωτά, αντιγράφοντάς τες ξανά και ξανά. Και έτσι, κάθε φορά
    που μία κοινότητα παραλάμβανε μια επιστολή, όφειλε πρώτα να βεβαιωθεί ότι αυτή
    ανήκει πράγματι στον απόστολο.</p><p>Κανόνα γνωστό σε όλους οι απόστολοι δεν συνέταξαν,
    γι’ αυτό δεν υπάρχει η δυνατότητα να συμβουλευτεί κανείς απλώς έναν αξιόπιστο
    κατάλογο. Για να προστατεύσουν την πίστη και τους πιστούς, οι απόστολοι λαμβάνουν
    μέτρα εναντίον των ψευδεπίγραφων επιστολών. Για παράδειγμα, ο απόστολος αναφέρει
    ένα διακριτικό γνώρισμα των επιστολών του:</p><blockquote><p>«Ὁ ἀσπασμὸς τῇ ἐμῇ
    <strong>χειρὶ Παύλου, ὅ ἐστιν σημεῖον ἐν πάσῃ ἐπιστολῇ· οὕτως γράφω</strong>.
    ἡ χάρις τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ μετὰ πάντων ὑμῶν» (<a href="https://bibleox.com/el/gr-lxx-byz/2sol/3/#L17-18">Β
    Θεσ 3:17-18</a>)</p></blockquote><p>Γι’ αυτόν τον λόγο, παρεμπιπτόντως, επί πολύ
    καιρό υπήρχαν αμφισβητήσεις σχετικά με την προς Εβραίους επιστολή του αποστόλου
    Παύλου, στην οποία ο συγγραφέας δεν κατονομάζει τον εαυτό του και η οποία δεν
    περιέχει το αναφερθέν συμβατικό σημείο. Αλλά δεν είναι αυτοί οι μόνοι τρόποι προστασίας
    της πίστης. Άλλωστε τη συμβατική φράση μπορεί να την παραποιήσει οποιοσδήποτε.
    Ως σημαντικότερο κανόνα ο απόστολος καθιερώνει τη σύγκριση του περιεχομένου των
    επιστολών με εκείνη την πίστη που οι απόστολοι παρέδωσαν στις κοινότητες. Όταν
    ο απόστολος μιλά για τις ψευδεπίγραφες επιστολές (<a href="https://bibleox.com/el/gr-lxx-byz/2sol/2/#L2">Β
    Θεσ 2:2</a>), μέσα στο ίδιο κεφάλαιο, συνοψίζοντας τα λεχθέντα, καθιερώνει και
    τον κανόνα:</p><blockquote><p>«<strong>ἄρα οὖν, ἀδελφοί, στήκετε, καὶ κρατεῖτε
    τὰς παραδόσεις ἃς ἐδιδάχθητε εἴτε διὰ λόγου εἴτε δι᾿ ἐπιστολῆς ἡμῶν</strong>»
    (<a href="https://bibleox.com/el/gr-lxx-byz/2sol/2/#L15">Β Θεσ 2:15</a>)</p></blockquote><p>Πράγματι,
    ο πιο ασφαλής τρόπος για να βεβαιωθεί κανείς για την αλήθεια μιας επιστολής είναι
    να συγκρίνει το περιεχόμενο του κειμένου με εκείνο της πίστης για την οποία λέγεται:
    «<em>τῇ ἅπαξ παραδοθείσῃ τοῖς ἁγίοις πίστει</em>» (<a href="https://bibleox.com/el/gr-lxx-byz/iud/1/#L3">Ιούδα
    1:3</a>). Μπορεί η επιστολή να είναι αγνώστου συγγραφέα, αλλά γνωρίζουμε σε ποια
    κοινότητα ανήκει και ποιος δίδαξε επί χρόνια τον πρεσβύτερό της (<a href="https://bibleox.com/el/gr-lxx-byz/act/20/#L31">Πραξ
    20:31</a>). Γι’ αυτό ακριβώς η αντιστοιχία του κειμένου προς την πίστη των αποστολικών
    κοινοτήτων ήταν το κριτήριο της γνησιότητας ενός κειμένου.</p><p>Καθιερώνοντας
    τη φράση-σημάδι της επιστολής του, εντέλλοντας να συγκρίνουν τις διδασκαλίες όσων
    έρχονται με την αποστολική πίστη που εναποτέθηκε μια για πάντα στην Εκκλησία,
    ο απόστολος μιλά επίσης και για το πού αλλού μπορούν να βρεθούν οι επιστολές του,
    καλώντας σε ανταλλαγή των κειμένων του:</p><blockquote><p>«καὶ ὅταν ἀναγνωσθῇ
    παρ᾿ ὑμῖν ἡ ἐπιστολή, ποιήσατε ἵνα καὶ ἐν τῇ Λαοδικέων ἐκκλησίᾳ ἀναγνωσθῇ, καὶ
    τὴν ἐκ Λαοδικείας ἵνα καὶ ὑμεῖς ἀναγνῶτε» (<a href="https://bibleox.com/el/gr-lxx-byz/kol/4/#L16">Κολ
    4:16</a>)</p></blockquote><p>Παρά ταύτα, δεν υπάρχει καμία προσπάθεια του αποστόλου
    να καθορίσει αυστηρά τον κατάλογο των εκκλησιαστικών κειμένων. Οι απόστολοι, κατά
    την ανάγκη, έγραφαν επιστολές στον χρόνο και στον τόπο όπου προέκυπτε η ανάγκη.
    Γι’ αυτό, εφόσον δεν υπήρχε καταγεγραμμένος κατάλογος, το ζήτημα δεν λυνόταν μονοσήμαντα
    για όλα τα κείμενα.</p><p>Αντιπαρατιθέμενοι προς την Ορθόδοξη Εκκλησία, πολλοί
    προτεστάντες εκκινούν από τη σκέψη ότι τα αποστολικά κείμενα ήταν αμέσως γνωστά
    σε όλους, σαν να είχαν συντάξει οι ίδιοι οι απόστολοι έναν αξιόπιστο κατάλογο
    των έργων τους. Η απόφαση της Εκκλησίας εδώ είναι δήθεν απλή τυπικότητα, επικύρωση
    ενός πράγματος ούτως ή άλλως προφανούς σε όλους. Ωστόσο, στην πραγματικότητα αυτή
    η σκέψη απέχει πολύ από την αληθινή κατάσταση των πραγμάτων. Ακόμη και τον Δ΄
    αιώνα δεν υπήρχε μονοσήμαντη απάντηση σχετικά με τα βιβλία του κανόνα.</p><p>Ο
    κανόνας της Καινής Διαθήκης, τον οποίο δέχονται σήμερα οι προτεστάντες, γεννήθηκε
    μέσα από τέσσερις αιώνες ζωής της Εκκλησίας. Για παράδειγμα, ακόμη και τον Δ΄
    αιώνα ο ιεράρχης Ιωάννης ο Χρυσόστομος αναγνώριζε στον κανόνα μόνο 3 από τις 7
    καθολικές επιστολές, και δεν αναφέρει την Αποκάλυψη του Ιωάννη του Θεολόγου:</p><blockquote><p><em>Ἔστι
    δὲ καὶ τῆς Καινῆς Διαθήκης βιβλία, δηλαδὴ δεκατέσσαρες ἐπιστολαὶ Παύλου, εὐαγγέλια
    τέσσαρα, δύο τῶν μαθητῶν τοῦ Χριστοῦ, Ἰωάννου καὶ Ματθαίου, καὶ δύο Λουκᾶ καὶ
    Μάρκου, ὧν ὁ μὲν Πέτρου, ὁ δὲ Παύλου μαθητής. Ἐκεῖνοι αὐτόπται τοῦ Χριστοῦ ἐγένοντο
    καὶ συνανεστράφησαν αὐτῷ, οὗτοι δὲ ἑτέροις παρέδωκαν ἃ παρ’ ἐκείνων ἔλαβον. Ἔτι
    δὲ ἡ βίβλος τῶν Πράξεων, τοῦ αὐτοῦ Λουκᾶ, τοῦ τὰ τότε γεγονότα ἱστορήσαντος, καὶ
    </em><strong><em>τρεῖς καθολικαὶ ἐπιστολαί</em></strong><em>.</em></p></blockquote><p>(Επισκόπηση
    των βιβλίων της Παλαιάς Διαθήκης)</p><p>Για το ίδιο ζήτημα τον Δ΄ αιώνα γράφει
    ο ιεράρχης Αμφιλόχιος Ικονίου:</p><blockquote><p><em>Τί τὸ λεῖπον; </em><strong><em>Οἱ
    μὲν ἑπτὰ τὰς καθολικὰς ἐπιστολὰς δεῖν παραλαμβάνειν λέγουσιν, οἱ δὲ τρεῖς μόνας</em></strong><em>:
    Ἰακώβου μίαν, μίαν Πέτρου καὶ μίαν Ἰωάννου· τινὲς δὲ τρεῖς παραλαμβάνουσι τὰς
    Ἰωάννου, πρὸς τούτοις δὲ καὶ δύο Πέτρου, καὶ ἑβδόμην τὴν Ἰούδα. Ὁμοίως δὲ καὶ
    </em><strong><em>τὴν Ἀποκάλυψιν Ἰωάννου οἱ μὲν ἐγκρίνουσιν, οἱ δὲ πλείους νοθεύεσθαι
    λέγουσι</em></strong><em>. Οὗτος ἀψευδέστατος ἂν εἴη κανὼν τῶν θεοπνεύστων Γραφῶν.</em></p></blockquote><p>(Κανόνας
    1) (Επιστολή προς Σέλευκον)</p><p>Έτσι, αυτό που σήμερα όλοι οι χριστιανοί διαβάζουν
    και αναγνωρίζουν ως Αγία Γραφή είναι το αποτέλεσμα τουλάχιστον τεσσάρων αιώνων
    ζωής της Εκκλησίας, η οποία καθοδηγείται από το Άγιο Πνεύμα.</p><p>Όσον αφορά
    τον κανόνα της Παλαιάς Διαθήκης, μπορούμε να πούμε ότι απορρίφθηκε από τους προτεστάντες.
    Η Εκκλησία διάβαζε την Παλαιά Διαθήκη κατά τη μετάφραση των Εβδομήκοντα, μαζί
    με εκείνα τα βιβλία που οι προτεστάντες σήμερα δεν δέχονται, κρίνοντας από τον
    κατάλογο των βιβλίων που απαντά στην εβραϊκή παράδοση.</p><p>Στη συνέχεια παρατίθενται
    ρήσεις που έχουν, με τον ένα ή τον άλλο τρόπο, σχέση με το ζήτημα του κανόνα της
    Γραφής.</p><h2>Β΄ αιώνας</h2><h3>Παπίας ο Ιεραπολίτης (~70-155)</h3><blockquote><p>«<strong>Μάρκος
    μὲν ἑρμηνευτὴς Πέτρου γενόμενος, ὅσα ἐμνημόνευσεν, ἀκριβῶς ἔγραψεν</strong>, οὐ
    μέντοι τάξει τὰ ὑπὸ τοῦ κυρίου ἢ λεχθέντα ἢ πραχθέντα. οὔτε γὰρ ἤκουσεν τοῦ κυρίου
    οὔτε παρηκολούθησεν αὐτῷ, ὕστε ρον δὲ, ὡς ἔφην, <strong>Πέτρῳ· ὃς πρὸς τὰς χρείας
    ἐποιεῖτο τὰς διδασκαλίας</strong>, ἀλλ'' οὐχ ὥσπερ σύνταξιν τῶν κυριακῶν ποιούμενος
    λογίων, <strong>ὥστε οὐδὲν ἥμαρτεν Μάρκος οὕτως ἔνια γράψας ὡς ἀπεμνημόνευσεν</strong>.
    ἑνὸς γὰρ ἐποιήσατο πρόνοιαν, τοῦ μηδὲν ὧν ἤκουσεν παραλιπεῖν ἢ ψεύσασθαί τι ἐν
    αὐτοῖς». &lt;…&gt; «<strong>Ματθαῖος μὲν οὖν Ἑβραΐδι διαλέκτῳ τὰ λόγια συνετάξατο</strong>,
    ἡρμήνευσεν δ'' αὐτὰ ὡς ἦν δυνατὸς ἕκαστος».</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%95%CE%9A%CE%9A%CE%9B%CE%97%CE%A3%CE%99%CE%91%CE%A3%CE%A4%CE%99%CE%9A%CE%97%CE%A3_%CE%99%CE%A3%CE%A4%CE%9F%CE%A1%CE%99%CE%91%CE%A3-3#HH-39">Ερμηνεία
    των Κυριακών Λογίων του Παπία, όπως παρατίθεται στον Ευσέβιο, Εκκλησιαστική Ιστορία
    Γ΄, 39</a>)</p><h3>Ιουστίνος ο Φιλόσοφος (~100-165)</h3><blockquote><p>σιγήσαντος
    αὐτοῦ καὶ μηκέτι ἐπὶ Πιλάτου ἀποκρίνασθαι μηδὲν μηδενὶ βουλομένου, ὡς <strong>ἐν
    τοῖς <mark>ἀπομνημονεύμασι τῶν ἀποστόλων</mark> αὐτοῦ</strong> δεδήλωται</p><p>&lt;…&gt;</p><p>Συνήκαμεν
    καὶ τὸ εἰρημένον, ὅτι Ἡμέρα κυρίου ὡς χίλια ἔτη, εἰς τοῦτο συνάγειν. καὶ ἔπειτα
    καὶ παρ'' ἡμῖν ἀνήρ τις, ᾧ ὄνομα <strong>Ἰωάννης, εἷς τῶν ἀποστόλων τοῦ Χριστοῦ</strong>,
    <strong>ἐν <mark>ἀποκαλύψει</mark> γενομένῃ αὐτῷ</strong> χίλια ἔτη ποιήσειν ἐν
    Ἰερουσαλὴμ τοὺς τῷ ἡμετέρῳ Χριστῷ πιστεύσαντας προεφήτευσε, καὶ</p></blockquote><p>(<a
    href="https://bibleox.com/grc/grc/w/Ιουστίνος_ο_Φιλόσοφος-Διάλογο_προς_Τρύφωνα#HH-102">Ιουστίνος,
    Διάλογος πρὸς Τρύφωνα, 102 και 81</a>)</p><h3>Μελίτων Σαρδέων, ιεράρχης (~100-180)</h3><blockquote><p><em>Μελίτων
    Ὀνησίμῳ τῷ ἀδελφῷ χαίρειν. Ἐπεὶ διὰ τὴν πρὸς τὴν πίστιν ἡμῶν σπουδὴν πολλάκις
    ἠξίωσας ἐκλογάς σοι ποιήσασθαι ἐκ τοῦ νόμου καὶ τῶν προφητῶν τῶν εἰς τὸν Σωτῆρα
    καὶ πᾶσαν τὴν πίστιν ἡμῶν ἀνηκόντων, ἔτι δὲ καὶ τὸν ἀριθμὸν τῶν βιβλίων τῆς Παλαιᾶς
    Διαθήκης καὶ τὴν τάξιν ἐν ᾗ κεῖνται ἀκριβῶς μαθεῖν, ἐσπούδασα τοῦτο ποιῆσαι, εἰδώς
    σου τὴν περὶ τὴν πίστιν σπουδὴν καὶ τὴν περὶ τὴν διδασκαλίαν φιλομάθειαν, ὅτι
    τοῦτο περὶ πλείστου ποιῇ, ἀγαπῶν τὸν Θεὸν καὶ περὶ τὴν αἰώνιον σωτηρίαν πονῶν.
    Ἀπελθὼν οὖν εἰς τὴν Ἀνατολὴν καὶ ἕως τῶν τόπων ἐλθών, ἔνθα ἐκηρύχθη καὶ ἐπράχθη
    τὰ τῆς Γραφῆς, ἀκριβῶς ἐξέμαθον τὰ τῆς Παλαιᾶς Διαθήκης βιβλία καὶ ἀπέστειλά σοι
    τὸν κατάλογον αὐτῶν. Ταῦτα δέ ἐστι τὰ ὀνόματα·</em></p><ul><li><p><em>Πέντε βιβλία
    Μωυσέως:</em></p><ul><li><p><em>Γένεσις,</em></p></li><li><p><em>Ἔξοδος,</em></p></li><li><p><em>Λευιτικόν,</em></p></li><li><p><em>Ἀριθμοί,</em></p></li><li><p><em>Δευτερονόμιον·</em></p></li></ul></li><li><p><em>Ἰησοῦς
    Ναυῆ,</em></p></li><li><p><em>Κριταί,</em></p></li><li><p><em>Ῥούθ,</em></p></li><li><p><em>Τέσσαρες
    βίβλοι τῶν Βασιλειῶν·</em></p></li><li><p><em>Δύο Παραλειπομένων,</em></p></li><li><p><em>Ψαλμοὶ
    Δαυίδ,</em></p></li><li><p><em>Παροιμίαι Σολομῶντος, ἢ βίβλος Σοφίας,</em></p></li><li><p><em>Ἐκκλησιαστής,</em></p></li><li><p><em>Ἆσμα
    Ἀσμάτων,</em></p></li><li><p><em>Ἰώβ·</em></p></li><li><p><em>οἱ προφῆται· Ἡσαΐας,
    Ἱερεμίας καὶ οἱ δώδεκα ἐν μιᾷ βιβλίῳ, Δανιήλ, Ἰεζεκιήλ, Ἔσδρας. Ἐξ ὧν καὶ τὰς
    ἐκλογὰς πεποίημαι, εἰς ἓξ βίβλους διελών.</em></p></li></ul></blockquote><p>(Εκλογαί)</p><h3>Τατιανός
    (~120-175)</h3><p>Για το ότι ο Τατιανός συνέταξε συλλογή κειμένων από τα τέσσερα
    Ευαγγέλια, που ονομάστηκε Διατεσσάρων:</p><blockquote><p>Ο Κλήμης ο Αλεξανδρεὺς
    (Strom., III, 12) αὐτῷ ἀποδίδωσι τὸ βιβλίον «περὶ τῆς κατὰ τὸν Σωτῆρα τελειότητος».
    Εὐσέβιος (V, 13) μνημονεύει ὅτι ἠσχολήθη περὶ «βιβλίου ζητημάτων» (προβλημάτων),
    ἐν ᾧ ἐξηγοῦντο τὰ σκοτεινὰ καὶ δυσχερῆ χωρία τῆς Ἁγίας Γραφῆς· καὶ ἔτι <strong>συνέταξε
    συναγωγὴν τῶν εὐαγγελίων καὶ ἔδωκεν αὐτῇ τὸ ὄνομα διατεσσάρων (κατὰ τέσσαρας)</strong>.
    Αἱ ἰδιότητες καὶ ἡ σύνθεσις τοῦ τελευταίου τούτου ἀξιολόγου ἔργου μέχρι σήμερον
    ἀποτελοῦσι ἀντικείμενον ἔριδος μεταξὺ τῶν λογίων, διὰ τὴν ἔλλειψιν ἀκριβῶν καὶ
    ἐμπεριστατωμένων μαρτυριῶν τῶν ἀρχαίων ἐκκλησιαστικῶν συγγραφέων. Ἔτι κατὰ τὸν
    χρόνον τοῦ Θεοδωρήτου (†458) ὑπῆρχε σημαντικὸς ἀριθμὸς τοῦ Διατεσσάρων τοῦ Τατιανοῦ,
    καὶ ἰδοὺ τί περὶ αὐτοῦ ἀναφέρει ὁ Θεοδώρητος (haer. fab. 1, 20). Ὁ Τατιανὸς συνέταξεν
    εὐαγγέλιον ὀνομαζόμενον Διατεσσάρων, παραλείψας τὰς γενεαλογίας τοῦ Χριστοῦ καὶ
    ἄλλους τόπους τοὺς δεικνύντας ὅτι ὁ Κύριος κατὰ σάρκα ἐκ τοῦ σπέρματος Δαυὶδ προῆλθεν.
    Τούτῳ τῷ εὐαγγελίῳ ἐχρῶντο οὐ μόνον οἱ ὀπαδοὶ τοῦ Τατιανοῦ, ἀλλὰ καὶ οἱ ὀρθόδοξοι
    χριστιανοί, ὡς βιβλίῳ λίαν εὐχρήστῳ, ἀγνοοῦντες τὴν δολιότητα τῆς συναγωγῆς ταύτης.
    Αὐτὸς ὁ Θεοδώρητος εὗρεν ὑπὲρ τὰ διακόσια ἀντίτυπα αὐτῆς ἐν ταῖς ἐκκλησίαις τῆς
    ἑαυτοῦ περιφερείας (Κύρου), ἀφείλετο αὐτὰ καὶ ἀντικατέστησεν αὐτὰ διὰ τῶν κανονικῶν
    εὐαγγελίων τῶν τεσσάρων εὐαγγελιστῶν.</p></blockquote><p>(Σχετικά με τον Τατιανό
    και την Απολογία του)</p><h3>Κανόνας από κείμενο αγνώστου συγγραφέα, που βρέθηκε
    το 1700 από τον Μουρατόρι</h3><p>Κατά πάσα πιθανότητα, το κείμενο γράφτηκε στα
    τέλη του Β΄ αιώνα:</p><blockquote><p>….στα οποία παρά ταύτα εκείνος ήταν παρών,
    και έτσι τα τοποθέτησε [μέσα στην αφήγησή του]. (2) <strong>Το τρίτο βιβλίο του
    Ευαγγελίου</strong> είναι εκείνο του <strong>Κατά Λουκά</strong>. (3) Ο Λουκάς,
    ο πολύ γνωστός ιατρός, μετά την Ανάληψη του Χριστού, (4-5) όταν ο Παύλος τον είχε
    πάρει μαζί του ως ένα ζηλωτή του νόμου, (6) το συνέταξε στο δικό του όνομα, σύμφωνα
    με [την γενική] πεποίθηση. Όμως ο ίδιος δεν είχε (7) δει τον Κύριο εν σαρκί, και
    έτσι, κατά πώς μπορούσε να εξακριβώσει τα γεγονότα, (8) έτσι πράγματι αρχίζει
    να λέει την ιστορία από την γέννηση του Ιωάννη. (9) <strong>Το τέταρτο εκ των
    Ευαγγελίων είναι εκείνο του Ιωάννη</strong>, [ενός εκ] των μαθητών. (10) Στους
    συμμαθητές του και επισκόπους, που τον παρότρυναν [να γράψει] (11) είπε, «Νηστέψτε
    μαζί μου από σήμερα για τρεις μέρες, και ό,τι (12) αποκαλυφθεί σε ένα έκαστον
    από σας (13) ας το πούμε ο ένας στον άλλον.» Την ίδια νύχτα αποκαλύφθηκε (14)
    στον Ανδρέα, [έναν εκ] των αποστόλων, (15-16) πως ο Ιωάννης θα έπρεπε να καταγράψει
    τα πάντα στο δικό του όνομα, ενώ όλοι οι άλλοι να το επιθεωρήσουν. Έτσι, παρ’
    ότι διάφορα (17) στοιχεία δύναται να διδάσκονται μέσα στα μεμονωμένα βιβλία των
    Ευαγγελίων, (18) παρά ταύτα αυτό δεν κάνει καμμία διαφορά στην πίστη των πιστών,
    καθ’ ότι δια του ενός κυρίαρχου Πνεύματος τα πάντα &lt;…&gt; (20) έχουν δηλωθεί
    σε όλα [τα Ευαγγέλια]: περί της (21) Γεννήσεως, περί του Πάθους, περί της Αναστάσεως,
    (22) περί της ζωής με τους μαθητές Του, (23) και περί της διπλής Παρουσίας Του
    – (24) η μεν πρώτη με ταπεινότητα, όταν περιφρονήθηκε, το οποίο είχε ήδη λάβει
    χώρα, (25) η δε δεύτερη, ένδοξη με βασιλική δύναμη, (26) η οποία είναι ακόμα στο
    μέλλον. Τι (27) θαυμάσιο που είναι λοιπόν, όταν ο Ιωάννης τόσο συνεπώς (28) αναφέρει
    αυτά τα συγκεκριμένα σημεία στις Επιστολές του επίσης, (29) λέγοντας για τον εαυτό
    του: «Αυτά που είδαμε με τα μάτια μας (30) και ακούσαμε με τα αυτιά μας και τα
    χέρια μας (31) έχουν ψηλαφήσει, αυτά έχουμε γράψει σε σας»; (32) Διότι κατ’ αυτό
    τον τρόπο δηλώνει [τον εαυτό του] όχι μόνο ως αυτόπτη και αυτήκοο μάρτυρα, (33)
    αλλά και επίσης ως συγγραφέα όλων των θαυμάσιων πράξεων του Κυρίου, με την σειρά
    τους. (34) Επί πλέον, <strong>οι πράξεις όλων των αποστόλων (35) είχαν γραφεί
    σε ένα μόνο βιβλίο</strong>. Για τον «κράτιστο Θεόφιλο» ο Λουκάς συγκέντρωσε (36)
    τα μεμονωμένα γεγονότα που έλαβαν χώρα παρόντος του ιδίου – (37) όπως υποδηλώνεται
    σαφώς, με το να παραλείπει το μαρτύριο του Πέτρου (38) καθώς και την αναχώρηση
    του Παύλου από την πόλη [της Ρώμης] (39) όταν ταξίδεψε στην Ισπανία. Όσο για τις
    επιστολές του (40-41) Παύλου, οι ίδιες φανερώνουν ξεκάθαρα σε εκείνους που επιθυμούν
    να καταλάβουν, ποιες [είναι αυτές], από ποιόν τόπο, ή για ποιόν σκοπό είχαν σταλεί.
    (42) Πρωτίστως, <strong>προς τους Κορίνθιους</strong>, απαγορεύοντας τα αιρετικά
    σχίσματα, (43) μετά, <strong>προς τους Γαλάτες</strong>, εναντίον της περιτομής,
    (44-6) μετά <strong>προς του Ρωμαίους</strong> έγραψε εκτενώς, διευκρινίζοντας
    την σειρά (ή την διάταξη) των Γραφών, καθώς επίσης πως ο Χριστός είναι το κεφαλαίο
    (ή κεντρικό) τους θέμα. Είναι απαραίτητο (47) όπως τις συζητήσουμε μια-μια, εφ’
    όσον ο ίδιος ο ευλογημένος (48) απόστολος Παύλος, ακολουθώντας το παράδειγμα του
    προκατόχου του (49-50) Ιωάννη, γράφει ονομαστικά μόνο στις επτά εκκλησίες, με
    την ακόλουθη σειρά: <strong>προς τους Κορίνθιους (51) πρώτα, προς τους Εφέσιους
    δεύτερον, προς τους Φιλιππησίους τρίτον, (52) προς τους Κολασσαείς τέταρτον, προς
    τους Γαλάτες πέμπτον, (53) προς τους Θεσσαλονικείς έκτον, προς τους Ρωμαίους (54-5)
    έβδομον</strong>. Είναι αλήθεια πως <strong>γράφει άλλη μια φορά προς τους Κορίνθιους
    και τους Θεσσαλονικείς</strong> χάριν νουθεσίας, (56-7), και όμως είναι σαφώς
    ξεκάθαρο πως υπάρχει μια Εκκλησία, που είναι εξαπλωμένη σε όλη την έκταση της
    γης. Διότι και ο <strong>Ιωάννης επίσης στην (58) Αποκάλυψη</strong>, αν και γράφει
    προς επτά εκκλησίες, (59-60) παρά ταύτα μιλά σε όλες. [Ομοίως και ο Παύλος είχε
    γράψει] μια από στοργή και αγάπη <strong>στον Φιλήμονα, μια στον Τίτο και δυο
    στον Τιμόθεο</strong>. <strong>Και αυτές θεωρούνται ιερές</strong> &lt;…&gt; (62-3)
    στην εκτίμηση της καθολικής Εκκλησίας για τον καθορισμό της εκκλησιαστικής πειθαρχίας.
    Υπάρχει επίσης συγχρόνως [επιστολή] <strong><mark>προς (64) τους Λαοδικείς, [και]
    μια άλλη προς τους Αλεξανδρινούς, [και οι δυο] χαλκευμένες στου Παύλου (65) το
    όνομα για [να επεκτείνουν] την αίρεση του Μαρκίωνα, καθώς και μερικές άλλες (66)
    που δεν μπορούν να εισαχθούν στην καθολική εκκλησία</mark></strong> (67) – καθ’
    ότι δεν αρμόζει να αναμιχθεί χολή με το μέλι. (68) Επί πλέον, <strong>η Επιστολή
    του Ιούδα και δυο από τις προαναφερόμενες (ή, που φέρουν το όνομα) του Ιωάννη</strong>
    λογαριάζονται (ή χρησιμοποιούνται) στην καθολική [Εκκλησία], καθώς και [το βιβλίο
    της] <strong>Σοφίας, &lt;…&gt; (70) γραμμένα από τους φίλους του Σολομώντα</strong>
    προς τιμήν του. (71) Εμείς αποδεχόμαστε μόνο <strong>τις αποκαλύψεις του Ιωάννη
    και του Πέτρου, (72) αν και μερικοί από εμάς δεν είμαστε πρόθυμοι να αναγιγνώσκεται
    το δεύτερο μέσα στην Εκκλησία</strong>. (73) Όμως ο Ερμάς έγραψε τον Ποιμένα (74)
    πολύ πρόσφατα, στην εποχή μας, στην πόλη της Ρώμης, (75) ενώ ο επίσκοπος Πίος,
    ο αδελφός του, κατείχε την [επισκοπική] έδρα (76) της εκκλησίας της πόλεως της
    Ρώμης (77) και ως εκ τούτου θα έπρεπε πράγματι να αναγιγνώσκεται. Όμως (78) δεν
    γίνεται να αναγιγνώσκεται δημοσίως στον κόσμο μέσα στην εκκλησία, είτε ανάμεσα
    (79) στους προφήτες, ο αριθμός των οποίων είναι συμπληρωμένος, ή ανάμεσα (80)
    στους αποστόλους, επειδή είναι μετά τον καιρό [τους]. (81) Όμως δεν δεχόμαστε
    τίποτε απολύτως του Αρσίνοος ή του Ουαλεντίνου ή του Μιλτιάδη, (82) ο οποίος επίσης
    συνέταξε (83) ένα νέο βιβλίο ψαλμών για τον Μαρκίωνα, (84-5) μαζί με τον Βασιλίδη,
    τον Ασιάτη ιδρυτή των Καταφρυγιανών....</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/Vkxs_%CE%9A%CE%B1%CE%BD%CF%8C%CE%BD%CE%B1%CF%82_%CF%84%CE%BF%CF%85_%CE%9C%CE%BF%CF%85%CF%81%CE%B1%CF%84%CF%8C%CF%81%CE%B9">Κανόνας
    του Μουρατόρι</a>)</p><h3>Τερτυλλιανός</h3><blockquote><p>«Διότι αὕτη ἡ αἵρεσις
    (ὁ <em>γνωστικισμός</em>) οὐ παραδέχεταί τινα τῶν Γραφῶν, εἰ δέ τινα καὶ παραδέχοιτο,
    οὐχ ὁλοκλήρως, διαστρέφουσα αὐτὰ προσθήκαις καὶ παραλείψεσιν εἰς τὸν ἴδιον σκοπόν.»</p></blockquote><p>(Σχετικά
    με την παραγραφή κατά των αιρετικών)</p><h2>Δ΄ αιώνας</h2><h3>Αθανάσιος ο Μέγας,
    ιεράρχης (~295-373)</h3><blockquote><p>Ἁπάντων μὲν οὖν τῶν τῆς Παλαιᾶς Διαθήκης
    βιβλίων εἴκοσι δύο ὁ ἀριθμός (κατὰ παράδοσιν δέ, ὡς ἤκουσα, καὶ παρ’ Ἑβραίοις
    τοσαῦτα καὶ τὰ στοιχεῖα). Ταῦτα δὲ ἕκαστα τῇδε τῇ τάξει καὶ τοῖσδε τοῖς ὀνόμασι
    κεῖται·</p><p><strong>πρῶτον μὲν Γένεσις, εἶτα Ἔξοδος, εἶτα Λευιτικόν, μεθ’ ἣν
    Ἀριθμοί, καὶ τὸ τελευταῖον Δευτερονόμιον· μεθ’ ἃ Ἰησοῦς ὁ τοῦ Ναυῆ καὶ Κριταί.
    μετὰ δὲ τοὺς Κριτὰς Ῥούθ, καὶ πάλιν ἑξῆς τέσσαρες βίβλοι τῶν Βασιλειῶν, ὧν ἡ πρώτη
    καὶ ἡ δευτέρα μία βίβλος λογίζεται, ὁμοίως δὲ καὶ ἡ τρίτη καὶ ἡ τετάρτη μία· μετ’
    αὐτὰς πρώτη καὶ δευτέρα τῶν Παραλειπομένων, εἰς μίαν βίβλον καὶ αὕτη λογιζομένη,
    εἶτα πρώτη καὶ δευτέρα τοῦ Ἔσδρα, καὶ αὗται εἰς μίαν βίβλον παραλαμβανόμεναι.
    μετὰ ταύτας βίβλος Ψαλμῶν, καὶ ἑξῆς Παροιμίαι, εἶτα Ἐκκλησιαστὴς καὶ Ἆσμα Ἀσμάτων.
    πρὸς τούτοις ἔστι βιβλία· Ἰὼβ καὶ τὸ τελευταῖον οἱ Προφῆται, δώδεκα λογιζόμενοι
    εἰς μίαν βίβλον, εἶτα Ἡσαΐας, Ἰερεμίας καὶ σὺν αὐτῷ Βαρούχ, Θρῆνοι καὶ Ἐπιστολή,
    καὶ μετὰ Ἰερεμίαν Ἰεζεκιὴλ καὶ Δανιήλ</strong>. μέχρι τούτων αἱ τῆς Παλαιᾶς Διαθήκης
    βίβλοι ὠνομάσθησαν.</p><p>Οὐ μὴν δὲ κατοκνήσω εἰπεῖν καὶ τὰ τῆς Καινῆς Διαθήκης,
    ἔστι δὲ ταῦτα. <strong>Εὐαγγέλια τέσσαρα· τὸ μὲν κατὰ Ματθαῖον, τὸ δὲ κατὰ Μᾶρκον,
    τὸ δὲ κατὰ Λουκᾶν, τὸ δὲ κατὰ Ἰωάννην· μετὰ ταῦτα Πράξεις τῶν ἀποστόλων καὶ ἐπιστολαὶ
    ἀποστολικαὶ ἑπτά, λεγόμεναι καθολικαί, ἤτοι Ἰακώβου μία, Πέτρου δύο, εἶτα Ἰωάννου
    τρεῖς, καὶ μετὰ ταύτας Ἰούδα μία. πρὸς τούτοις ἔστι καὶ Παύλου τοῦ ἀποστόλου ἐπιστολαὶ
    δεκατέσσαρες, τῇδε τῇ τάξει τεταγμέναι· πρώτη πρὸς Ῥωμαίους, εἶτα δύο πρὸς Κορινθίους,
    μεθ’ ἃς πρὸς Γαλάτας, καὶ ἑξῆς πρὸς Ἐφεσίους, εἶτα πρὸς Φιλιππησίους καὶ πρὸς
    Κολοσσαεῖς, μετὰ ταύτας δύο πρὸς Θεσσαλονικεῖς καὶ ἡ πρὸς Ἑβραίους, ἑξῆς δύο πρὸς
    Τιμόθεον, μία πρὸς Τίτον καὶ τελευταία ἡ πρὸς Φιλήμονα, καὶ ἔτι Ἀποκάλυψις Ἰωάννου</strong>.
    Αὗται σωτηρίας εἰσὶ πηγαί, ὥστε ἐνδεᾶ τῶν ἐν ταύταις λογίων πλησθῆναι τὸν διψῶντα.
    Ἐν ταύταις μόναις τὸ τῆς εὐσεβείας κηρύσσεται δίδαγμα. Μηδεὶς τούτοις προστιθέτω
    μηδὲ ἀφαιρείτω τι. Ταύτας νοῶν ὁ Κύριος ἐνέτρεπε τοὺς Σαδδουκαίους λέγων· «Πλανᾶσθε,
    μὴ εἰδότες τὰς Γραφάς» (Ματθ. 22, 29), καὶ τοὺς Ἰουδαίους προέτρεπε· «Ἐρευνᾶτε
    τὰς Γραφάς, ... ὅτι αὗταί εἰσιν αἱ μαρτυροῦσαι περὶ ἐμοῦ» (Ἰωάν. 5, 39).</p><p>Πλὴν
    ἀκριβείας ἕνεκα (καὶ τοῦτο ἀναγκαίως γράφων) προστίθημι ὅτι ἐκτὸς τούτων ἔστι
    καὶ ἕτερα βιβλία, εἰς τὸν κανόνα μὲν οὐκ εἰσελθόντα, παρὰ δὲ τῶν πατέρων ἀνεγνώσκεσθαι
    παρεγγυηθέντα τοῖς ἄρτι προσερχομένοις καὶ κατηχηθῆναι τὸν τῆς εὐσεβείας λόγον
    ἐθέλουσι, τοιαῦτα· <strong>Σοφία Σολομῶντος, Σοφία Σειράχ, Ἐσθήρ, Ἰουδίθ, Τωβίας,
    ἡ καλουμένη Διδαχὴ τῶν Ἀποστόλων καὶ ὁ Ποιμήν</strong>. Πλὴν ἀγαπητοί, ἐκείνων
    μὲν εἰς τὸν κανόνα ἀναγεγραμμένων, τούτων δὲ ἀναγινωσκομένων, ἀποκρύφων οὐδαμοῦ
    γέγονε μνήμη· αἱρετικῶν ἐστιν ἐπινόηματα, ἃ γράφουσιν ὅτε βούλονται, παλαιότητα
    δὲ αὐτοῖς προσάπτουσι καὶ ἔτη προστιθέασι, προφάσει τοῦ ὡς ἀρχαῖα προφέροντας
    ἐξαπατᾶν τοὺς ἁπλουστέρους.</p></blockquote><p>(Πασχάλιος λόγος 39, Περί του κανόνα
    της Αγίας Γραφής)</p><h3><a href="https://bibleox.com/grc/grc/w/%CE%91%CF%80%CE%BF%CF%83%CF%84%CE%BF%CE%BB%CE%B9%CE%BA%CE%BF%CE%AF_%CE%9A%CE%B1%CE%BD%CF%8C%CE%BD%CE%B5%CF%82#HH-85">Κανόνες
    των αγίων αποστόλων</a></h3><blockquote><p>Ἔστω ὑμῖν πᾶσι κληρικοῖς καὶ λαϊκοῖς
    <strong>βιβλία σεβάσμια καὶ ἅγια, τῆς μὲν Παλαιᾶς Διαθήκης</strong>, Μωυσέως,
    πέντε· Γένεσις, Ἔξοδος, Λευιτικόν, Ἀριθμοί, Δευτερονόμιον· Ἰησοῦ Ναυῆ, ἕν· Κριτῶν,
    ἕν· Ρούθ, ἕν· Βασιλειῶν, τέσσαρα· Παραλειπομένων, τῆς βίβλου τῶν ἡμερῶν, δύο·
    Ἔσδρα, δύο· Ἐσθήρ, ἕν· Μακκαβαίων, τρία· Ἰώβ, ἕν· Ψαλτηρίου, ἕν· Σολομῶντος, τρία,
    Παροιμίαι, Ἐκκλησιαστής, ᾎσμα ᾈσμάτων· Προφητῶν, δώδεκα· Ἡσαΐου, ἕν· Ἱερεμίου,
    ἕν· Ἰεζεκιήλ, ἕν· Δανιήλ, ἕν. Ἔξωθεν δὲ ὑμῖν προσιστορείσθω μανθάνειν ὑμῶν τοὺς
    νέους τὴν Σοφίαν τοῦ πολυμαθοῦς Σειράχ. <strong>Ἡμέτερα δὲ (τουτέστι, τῆς Καινῆς
    Διαθήκης)</strong>, Εὐαγγέλια τέσσαρα· Ματθαίου, Μάρκου, Λουκᾶ καὶ Ἰωάννου· Παύλου
    ἐπιστολαὶ, δεκατέσσαρες· Πέτρου ἐπιστολαί, δύο· Ἰωάννου, τρεῖς· Ἰακώβου, μία·
    Ἰούδα, μία· Κλήμεντος ἐπιστολαί, δύο· καὶ αἱ Διαταγαὶ ὑμῖν τοῖς ἐπισκόποις δι᾿
    ἐμοῦ Κλήμεντος, ἐν ὀκτὼ βιβλίοις προσπεφωνημέναι· ἃς οὐ χρὴ δημοσιεύειν ἐπὶ πάντων
    διὰ τὰ ἐν αὐταῖς μυστικά· καὶ αἱ Πράξεις ἡμῶν τῶν Ἀποστόλων.</p></blockquote><p>(<a
    href="https://bibleox.com/grc/grc/w/%CE%91%CF%80%CE%BF%CF%83%CF%84%CE%BF%CE%BB%CE%B9%CE%BA%CE%BF%CE%AF_%CE%9A%CE%B1%CE%BD%CF%8C%CE%BD%CE%B5%CF%82#HH-85">85ος
    κανόνας</a>)</p><h3>Σύνοδος Λαοδικείας (360)</h3><blockquote><p>Περὶ τοῦ ποῖα
    δεῖ βιβλία ἀναγινώσκειν.</p><p><strong>Βιβλία τῆς Παλαιᾶς Διαθήκης: </strong>1)
    Γένεσις κόσμου, 2) Ἔξοδος ἐξ Αἰγύπτου, 3) Λευιτικόν, 4) Ἀριθμοί, 5) Δευτερονόμιον,
    6) Ἰησοῦς Ναυῆ, 7) Κριταί, Ῥούθ, 8) Ἐσθήρ, 9) Βασιλειῶν πρώτη καὶ δευτέρα, 10)
    Βασιλειῶν τρίτη καὶ τετάρτη, 11) Παραλειπομένων πρώτη καὶ δευτέρα, 12) Ἔσδρα πρώτη
    καὶ δευτέρα, 13) Βίβλος τῶν ρν΄ ψαλμῶν, 14) Παροιμίαι Σολομῶντος, 15) Ἐκκλησιαστής,
    16) Ἆσμα Ἀσμάτων, 17) Ἰώβ, 18) οἱ δώδεκα προφῆται, 19) Ἡσαΐας, 20) Ἰερεμίας, Βαρούχ,
    Θρῆνοι καὶ Ἐπιστολή, 21) Ἰεζεκιήλ, 22) Δανιήλ.</p><p><strong>Βιβλία τῆς Καινῆς
    Διαθήκης:</strong> 1) 4 Εὐαγγέλια: κατὰ Ματθαῖον, κατὰ Μᾶρκον, κατὰ Λουκᾶν, κατὰ
    Ἰωάννην, 2) Πράξεις τῶν ἀποστόλων, 3) 7 Ἐπιστολαὶ αἱ ἑξῆς: Ἰακώβου 1, Πέτρου 2,
    Ἰωάννου 3, Ἰούδα 1, 4) 14 Ἐπιστολαὶ Παύλου: πρὸς Ῥωμαίους 1, πρὸς Κορινθίους 2,
    πρὸς Γαλάτας 1, πρὸς Ἐφεσίους 1, πρὸς Φιλιππησίους 1, πρὸς Κολοσσαεῖς 1, πρὸς
    Θεσσαλονικεῖς 2, πρὸς Ἑβραίους 1, πρὸς Τιμόθεον 2, πρὸς Τίτον 1, πρὸς Φιλήμονα
    1.</p></blockquote><p>(Κανόνας 60)</p><h3>Γρηγόριος ο Θεολόγος, ιεράρχης (325-389)</h3><blockquote><p>Ἀλλ’
    ἵνα μή σοι νόος ἀλλοτρίοις ἐν βίβλοισιν — πολλὰ γὰρ νόθα — πλανηθῇ, δέξαι παρ’
    ἐμοῦ, φίλε, τοῦτον τὸν δόκιμον κατάλογον.</p><p>Εἰσὶν οὖν <strong>δώδεκα ἱστορικαὶ
    βίβλοι τῆς ἀρχαιοτάτης ἑβραϊκῆς σοφίας</strong>. πρώτη Γένεσις, εἶτα Ἔξοδος, Λευιτικόν,
    εἶτα Ἀριθμοί, εἶτα Δευτερονόμιον, εἶτα Ἰησοῦς καὶ Κριταί, Ῥοὺθ ὀγδόη, ἡ δὲ ἐνάτη
    καὶ δεκάτη Πράξεις τῶν Βασιλειῶν, εἶτα Παραλειπόμενα, τελευταία σοι ἡ τοῦ Ἔσδρα.
    Στιχηρῶν δὲ πέντε, ὧν πρώτη Ἰώβ, εἶτα Δαυίδ, εἶτα τρεῖς Σολομῶντος· Ἐκκλησιαστής,
    Ἆσμα Ἀσμάτων καὶ Παροιμίαι. Πνεύματος δὲ προφητικοῦ πέντε, ὧν ἐν Γραφῇ μίαν ποιοῦσιν
    αἱ δώδεκα· Ὡσηέ, Ἀμμὼς καὶ τρίτος Μιχαίας, εἶτα Ἰωήλ, εἶτα Ἰωνᾶς καὶ Ἀβδιού, Ναούμ,
    Ἀββακούμ καὶ Σοφονίας, Ἀγγαῖος, εἶτα Ζαχαρίας καὶ Μαλαχίας. Αὕτη μία βίβλος, ἡ
    δευτέρα δὲ Ἡσαΐας, εἶτα ὁ ἐκ βρέφους κληθεὶς Ἰερεμίας, εἶτα Ἰεζεκιὴλ καὶ Δανιὴλ
    ἡ χάρις.</p><p>Καὶ οἱ μὲν εἴκοσι δύο τῆς Παλαιᾶς Διαθήκης βίβλοι κατὰ τὸν ἀριθμὸν
    τῶν ἑβραϊκῶν στοιχείων ἐδείχθησαν· νῦν δὲ ἀρίθμησον καὶ τὰ <strong>τῆς καινῆς
    μυστηρίου βιβλία</strong>. Ματθαῖος τὰ θαύματα Χριστοῦ τοῖς Ἑβραίοις συνέγραψε,
    Μᾶρκος τῇ Ἰταλίᾳ, Λουκᾶς τῇ Ἀχαΐᾳ, Ἰωάννης δὲ ὁ μέγας οὐρανοβάμων κῆρυξ πᾶσιν.
    Εἶτα Πράξεις τῶν σοφῶν ἀποστόλων, δεκατέσσαρες Παύλου ἐπιστολαί, ἑπτὰ καθολικαί,
    ὧν μία Ἰακώβου, δύο Πέτρου, τρεῖς πάλιν Ἰωάννου, καὶ ἑβδόμη Ἰούδα.</p><p>Ἰδοὺ
    πάντα σοι τὰ βιβλία· εἰ δέ τινα τούτων ἐκτός ἐστι, τῶν νόθων ἐστί.</p></blockquote><p>(Κανόνας
    1)</p><h3>Αμφιλόχιος Ικονίου, ιεράρχης (~340 – μετά το 394)</h3><blockquote><p>Διαφερόντως
    δέ σε εἰδέναι προσήκει καὶ τοῦτο, ὡς οὐ πᾶν βιβλίον ἀξιόπιστόν ἐστι, κἂν σεμνὸν
    ἔχῃ τῆς Γραφῆς ὄνομα. Εἰσὶ γάρ, εἰσὶν ἐνίοτε ψευδώνυμοι βίβλοι· αἱ μὲν μέσαι πως
    καὶ πρὸς τὸν λόγον τῆς ἀληθείας ἐγγίζουσαι, αἱ δὲ νόθαι καὶ σφόδρα ἐπισφαλεῖς,
    ὥσπερ νομίσματα κίβδηλα, ἃ τῷ μὲν χαράγματι βασιλικὰ φαίνεται, τῇ δὲ ὕλῃ παράσημα.
    Διὸ δή σοι ἤδη ἐρῶ ἕκαστον τῶν θεοπνεύστων βιβλίων, ἵνα σαφῶς ἅπαντα γνῷς· πρῶτον
    δέ σοι λέξω τὰ <strong>τῆς Παλαιᾶς Διαθήκης βιβλία</strong>.</p><p>Ἡ πεντάτευχος
    περιέχει τὴν Δημιουργίαν, εἶτα Ἔξοδον, ἐν μέσῳ τὸ Λευιτικόν, ἐφ’ ᾗ Ἀριθμοὶ καὶ
    εἶτα Δευτερονόμιον. Πρόσθες αὐτοῖς τὰ τοῦ Ἰησοῦ καὶ τὰ τῶν Κριτῶν, εἶτα Ῥούθ,
    τὰς τέσσαρας τῶν Βασιλειῶν καὶ τὰς δύο τῶν Παραλειπομένων, ἐπὶ τούτοις Ἔσδρα πρώτην
    καὶ δευτέραν. Ἐρῶ δὲ ἐφεξῆς καὶ τὰς πέντε στιχηρὰς βίβλους· τὴν τοῦ Ἰώβ, τὸν ἐν
    πολυειδέσι πάθεσιν ἀθλήσαντα, τὸ Ψαλτήριον, τὸ τῆς ψυχῆς ἐμμελὲς φάρμακον, τὰς
    τρεῖς τοῦ σοφοῦ Σολομῶντος — Παροιμίας, Ἐκκλησιαστὴν καὶ Ἆσμα Ἀσμάτων. Πρόσθες
    αὐτοῖς τοὺς δώδεκα προφήτας· πρῶτον Ὡσηέ, εἶτα δεύτερον Ἀμμώς, Μιχαίαν, Ἰωήλ,
    Ἀβδιού τε καὶ Ἰωνᾶν, τὸν τοῦ τριημέρου Πάθους τύπον· ἐπὶ τούτοις Ναούμ, Ἀββακούμ,
    εἶτα τὸν ἔνατον Σοφονίαν, Ἀγγαῖον καὶ Ζαχαρίαν, ὁμοῦ δὲ καὶ τὸν ἔνδοξον κήρυκα
    Μαλαχίαν. Μετὰ τούτους γνῶθι τοὺς τέσσαρας προφήτας· τὸν μεγαλοφωνότατον Ἡσαΐαν,
    τὸν συμπαθέστατον Ἰερεμίαν καὶ τὸν μυστικὸν Ἰεζεκιήλ, τελευταῖον δὲ Δανιήλ, τὸν
    καὶ ἐν λόγῳ καὶ ἐν ἔργῳ σοφώτατον. Τούτοις προστιθέασί τινες καὶ τὴν Ἐσθήρ.</p><p>Ἦλθέ
    μοι καιρὸς εἰπεῖν καὶ τὰ <strong>τῆς Καινῆς Διαθήκης βιβλία</strong>. Εὐαγγελιστὰς
    δέχου μόνους τέσσαρας· Ματθαῖον, εἶτα Μᾶρκον, ἐπὶ τούτοις τρίτον Λουκᾶν, Ἰωάννην
    τῷ μὲν χρόνῳ τέταρτον, τῇ δὲ τῶν δογμάτων ἀκρότητι πρῶτον, ὃν υἱὸν βροντῆς ἀξίως
    καλῶ· οὗτος τὸν Θεὸν Λόγον ὑπὲρ πάντας ἐξεθείασεν. Δέχου καὶ δευτέραν τοῦ Λουκᾶ
    βίβλον, τὸ τῶν καθολικῶν Πράξεων τῶν ἀποστόλων. Πρόσθες δὲ ἔτι τὸ σκεῦος τῆς ἐκλογῆς,
    τὸν κήρυκα καὶ ἀπόστολον τῶν ἐθνῶν Παῦλον, τὸν σοφῶς ταῖς Ἐκκλησίαις δεκατέσσαρας
    ἐπιστολὰς γράψαντα· Ῥωμαίοις πρώτην, ᾗ προστιθέναι χρὴ δευτέραν Κορινθίοις, Γαλάταις,
    Ἐφεσίοις, εἶτα τοῖς ἐν Φιλίπποις, εἶτα τὴν Κολοσσαεῦσι γραφεῖσαν, Θεσσαλονικεῦσι
    δύο καὶ Τιμοθέῳ δύο, Τίτῳ δὲ καὶ Φιλήμονι ἀνὰ μίαν, καὶ Ἑβραίοις μίαν (ταύτην
    τινὲς νόθην φασίν, οὐκ ὀρθῶς λέγοντες· ἐν αὐτῇ γὰρ ἡ γνησία χάρις). Τί τὸ λεῖπον;
    τὰς καθολικὰς οἱ μὲν ἑπτὰ δεῖν παραλαμβάνειν λέγουσιν, οἱ δὲ τρεῖς μόνας· Ἰακώβου
    μίαν, μίαν Πέτρου καὶ μίαν Ἰωάννου· τινὲς δὲ τρεῖς παραλαμβάνουσι τὰς Ἰωάννου,
    πρὸς τούτοις δὲ καὶ δύο Πέτρου, καὶ ἑβδόμην τὴν Ἰούδα. Ὁμοίως δὲ καὶ τὴν Ἀποκάλυψιν
    Ἰωάννου οἱ μὲν ἐγκρίνουσιν, οἱ δὲ πλείους νοθεύεσθαι λέγουσι. Οὗτος ἀψευδέστατος
    ἂν εἴη κανὼν τῶν θεοπνεύστων Γραφῶν.</p></blockquote><p>(Κανόνας 1) (Επιστολή
    προς Σέλευκον)</p><h2>Ε΄ αιώνας</h2><h3>Σύνοδος Καρχηδόνος (393-419)</h3><blockquote><p>Ἤρεσεν,
    ἵνα μηδὲν πλὴν τῶν κανονικῶν Γραφῶν ἐν τῇ ἐκκλησίᾳ ἀναγινώσκηται. Κανονικαὶ δέ
    εἰσι Γραφαί· Γένεσις, Ἔξοδος, Λευιτικόν, Ἀριθμοί, Δευτερονόμιον, Ἰησοῦς Ναυῆ,
    Κριταί, τέσσαρες βίβλοι Βασιλειῶν, δύο Παραλειπομένων, Ἰώβ, Ψαλτήριον, τέσσαρες
    βίβλοι Σολομῶντος, δώδεκα βίβλοι προφητῶν, Ἡσαΐας, Ἰερεμίας, Ἰεζεκιήλ, Δανιήλ,
    Τωβίτ, Ἰουδίθ, Ἐσθήρ, δύο βίβλοι Ἔσδρα. <strong>Καινῆς Διαθήκης</strong>: 4 Εὐαγγέλια,
    1 βίβλος Πράξεων τῶν ἀποστόλων, 14 ἐπιστολαὶ Παύλου, 2 τοῦ ἀποστόλου Πέτρου, 3
    τοῦ ἀποστόλου Ἰωάννου, 1 τοῦ ἀποστόλου Ἰακώβου, 1 τοῦ ἀποστόλου Ἰούδα, Ἀποκάλυψις
    Ἰωάννου, βίβλος 1.</p></blockquote><p>(Κανόνας 33)</p><h2>Ζ΄ αιώνας</h2><h3>ΣΤ΄
    Οικουμενική Σύνοδος (691)</h3><p>Επικύρωση των προηγουμένων κανόνων των συνόδων
    και των αγίων πατέρων, στους οποίους είχαν απαριθμηθεί τα βιβλία του βιβλικού
    κανόνα:</p><blockquote><p>Ἔδοξε δὲ καὶ τοῦτο τῇ ἁγίᾳ ταύτῃ συνόδῳ κάλλιστά τε
    καὶ σπουδαιότατα, ὥστε μένειν καὶ ἀπὸ τοῦ νῦν βεβαίους καὶ ἀσφαλεῖς, πρὸς ψυχῶν
    θεραπείαν καὶ ἰατρείαν παθῶν, <strong>τοὺς ὑπὸ τῶν πρὸ ἡμῶν ἁγίων καὶ μακαρίων
    Πατέρων δεχθέντας καὶ κυρωθέντας, ἀλλὰ μὴν καὶ παραδοθέντας ἡμῖν ὀνόματι τῶν ἁγίων
    καὶ ἐνδόξων Ἀποστόλων ὀγδοήκοντα πέντε κανόνας</strong>. Ἐπειδὴ δ᾿ ἐν τούτοις
    τοῖς κανόσιν ἐντέταλται δέχεσθαι ἡμᾶς τὰς τῶν αὐτῶν ἁγίων Ἀποστόλων διὰ Κλήμεντος
    Διατάξεις, αἷς τισι πάλαι ὑπὸ τῶν ἑτεροδόξων ἐπὶ λύμῃ τῆς ἐκκλησίας νόθα τινὰ
    καὶ ξένα τῆς εὐσεβείας παρενετέθησαν, τὸ εὐπρεπὲς κάλλος τῶν θείων δογμάτων ἡμῖν
    ἀμαυρώσαντα· τὴν τῶν τοιούτων Διατάξεων προσφόρως ἀποβολὴν πεποιήμεθα πρὸς τὴν
    τοῦ χριστιανικωτάτου ποιμνίου οἰκοδομὴν καὶ ἀσφάλειαν, οὐδαμῶς ἐγκρίνοντες τὰ
    τῆς αἱρετικῆς ψευδολογίας κυήματα, καὶ τῇ γνήσιᾳ τῶν Ἀποστόλων καὶ ὁλοκλήρῳ διδαχῇ
    παρενείροντες. Ἐπισφραγίζομεν δὲ καὶ τοὺς λοιποὺς πάντας ἱεροὺς κανόνας, τοὺς
    ὑπὸ τῶν ἁγίων καὶ μακαρίων Πατέρων ἡμῶν ἐκτεθέντας, τουτέστι τῶν τε ἐν Νικαίᾳ
    συναθροισθέντων τριακοσίων δεκαοκτὼ ἁγίων Πατέρων, καὶ τῶν ἐν Ἀγκύρᾳ· ἔτι μὴν
    καὶ τῶν ἐν Νεοκαισαρείᾳ, ὡσαύτως καὶ τῶν ἐν Γάγγραις· πρὸς τούτοις δὲ καὶ τῶν
    ἐν Ἀντιοχείᾳ τῆς Συρίας· ἀλλὰ μὴν καὶ <strong>τῶν ἐν Λαοδικείᾳ τῆς Φρυγίας</strong>·
    προσέτι καὶ τῶν ἑκατὸν πεντήκοντα, τῶν ἐν ταύτῃ τῇ θεοφύλακτῳ καὶ βασιλίδι συνελθόντων
    πόλει, καὶ τῶν διακοσίων, τῶν ἐν τῇ Ἐφεσίων μητροπόλει τὸ πρότερον συναγηγερμένων·
    καὶ τῶν ἐν Χαλκηδόνι, τῶν ἑξακοσίων τριάκοντα ἁγίων καὶ μακαρίων Πατέρων· ὡσαύτως
    καὶ τῶν ἐν Σαρδικῇ· ἔτι μὴν καὶ <strong>τῶν ἐν Καρθαγένη</strong>· προσέτι γε
    μὴν καὶ τῶν ἐν αὖθις ἐν ταῦτῃ τῇ θεοφυλάκτῳ καὶ βασιλίδι πόλει συνελθόντων ἐπὶ
    Νεκταρίου τοῦ τῆς βασιλίδος ταύτης πόλεως προέδρου, καὶ Θεοφίλου, τοῦ γενομένου
    Ἀλεξανδρείας ἀρχιεπισκόπου· ἀλλὰ μὴν καὶ Διονυσίου ἀρχιεπισκόπου γενομένου Ἀλεξανδρείας
    μεγαλοπόλεως, καὶ Πέτρου γενομένου Ἀλεξανδρείας, καὶ μάρτυρος, καὶ Γρηγορίου ἐπισκόπου
    γενομένου Νεοκαισαρείας, τοῦ θαυματουργοῦ, <strong>Ἀθανασίου ἀρχιεπισκόπου Ἀλεξανδρείας</strong>,
    Βασιλείου ἀρχιεπισκόπου Καισαρείας Καππαδοκίας, Γρηγορίου ἐπισκόπου Νύσσης, <strong>Γρηγορίου
    τοῦ Θεολόγου, Ἀμφιλοχίου τοῦ Ἰκονίου</strong>, Τιμοθέου ἀρχιεπισκόπου γενομένου
    Ἀλεξανδρείας τὸ πρότερον, Θεοφίλου ἀρχιεπισκόπου τῆς αὐτῆς Ἀλεξανδρέων μεγαλοπόλεως,
    Κυρίλλου ἀρχιεπισκόπου τῆς Ἀλεξανδρείας, καὶ Γενναδίου Πατριάρχου γενομένου τῆς
    θεοφυλακτου ταύτης καὶ βασιλίδος πόλεως· ἔτι μὴν καὶ τὸν ὑπὸ Κυπριανοῦ, τοῦ γενομένου
    ἀρχιεπισκόπου τῆς Ἄφρων χώρας καὶ μάρτυρος, καὶ τῆς κατ᾿ αὐτὸν συνόδου ἐκθέντα
    κανόνα, ὃς ἐν τοῖς τῶν προειρημένων προέδρων τόποις, καὶ μόνον, κατὰ τὸ παραδοθὲν
    αὐτοῖς ἔθος, ἐκράτησε· καὶ μηδενὶ ἐξεῖναι τοὺς προδηλωθέντας παραχαράττειν κανόνας,
    ἢ ἀθετεῖν, ἢ ἑτέρους παρὰ τοὺς προκειμένους παραδέχεσθαι κανόνας, ψευδεπιγράφως
    ὑπό τινων συντεθέντας, τῶν τὴν ἀλήθειαν καπηλεύειν ἐπιχειρησάντων. Εἰ δέ τις ἁλῶ
    κανόνα τινὰ τῶν εἰρημένων καινοτομῶν, ἢ ἀνατρέπειν ἐπιχειρῶν, ὑπεύθυνος ἔσται
    κατὰ τὸν τοιοῦτον κανόνα, ὡς αὐτὸς διαγορεύει, τὴν ἐπιτιμίαν δεχόμενος, καὶ δι᾿
    αὐτοῦ, ἐν ᾧ περ πταίει θεραπευόμενος.</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%B5%CF%81%CE%BF%CE%AF_%CE%9A%CE%B1%CE%BD%CF%8C%CE%BD%CE%B5%CF%82_%CF%84%CF%89%CE%BD_%CE%91%CE%B3%CE%AF%CF%89%CE%BD_%CE%9F%CE%B9%CE%BA%CE%BF%CF%85%CE%BC%CE%B5%CE%BD%CE%B9%CE%BA%CF%8E%CE%BD%CE%A3%CF%85%CE%BD%CF%8C%CE%B4%CF%89%CE%BD#HH5-%CE%9A%CE%B1%CE%BD%E1%BD%BC%CE%BD-B">2ος
    κανόνας</a>)</p><h2>Η΄ αιώνας</h2><h3>Ιωάννης ο Δαμασκηνός, όσιος (2ο μισό του
    7ου αι. – έως το 754)</h3><blockquote><p>Ἰστέον δέ, ὡς εἴκοσι δύο <strong>βίβλοι
    εἰσὶ τῆς Παλαιᾶς Διαθήκης</strong> κατὰ τὰ στοιχεῖα τῆς Ἑβραΐδος φωνῆς. Εἴκοσι
    δύο γὰρ στοιχεῖα ἔχουσιν, ἐξ ὧν πέντε διπλοῦνται, ὡς γίνεσθαι αὐτὰ εἴκοσι ἑπτά·
    διπλοῦν γάρ ἐστι τὸ <em>Χὰφ</em> καὶ τὸ <em>Μὲμ</em> καὶ τὸ <em>Νοῦν</em> καὶ
    τὸ <em>Φὶ</em> καὶ τὸ <em>Σαδί</em>. Διὸ καὶ αἱ βίβλοι κατὰ τοῦτον τὸν τρόπον
    εἴκοσι δύο μὲν ἀριθμοῦνται, εἴκοσι ἑπτὰ δὲ εὑρίσκονται διὰ τὸ πέντε ἐξ αὐτῶν διπλοῦσθαι.
    Συνάπτεται γὰρ ἡ <em>Ῥοὺθ</em> τοῖς <em>Κριταῖς</em> καὶ ἀριθμεῖται παρ᾿ Ἑβραίοις
    μία βίβλος· ἡ <em>πρώτη καὶ δευτέρα τῶν Βασιλειῶν</em> μία βίβλος· ἡ <em>τρίτη
    καὶ ἡ τετάρτη</em> <em>τῶν Βασιλειῶν</em> μία βίβλος· ἡ <em>πρώτη καὶ ἡ δευτέρα
    τῶν Παραλειπομένων</em> μία βίβλος· ἡ <em>πρώτη καὶ ἡ δευτέρα τοῦ Ἔσδρα</em> μία
    βίβλος. Οὕτως οὖν σύγκεινται αἱ βίβλοι ἐν πεντατεύχοις τέτρασι, καὶ μένουσιν ἄλλαι
    δύο, ὡς εἶναι τὰς ἐνδιαθέτους βίβλους οὕτως· πέντε νομικάς· <em>Γένεσιν, Ἔξοδον,
    Λευιτικόν, Ἀριθμούς, Δευτερονόμιον</em>· αὕτη πρώτη πεντάτευχος, ἣ καὶ νομοθεσία.
    Εἶτα ἄλλη πεντάτευχος, τὰ καλούμενα Γραφεῖα, παρά τισι δὲ Ἁγιόγραφα, ἅτινά ἐστιν
    οὕτως· <em>Ἰησοῦς ὁ τοῦ Ναυῆ</em>, <em>Κριταὶ μετὰ</em> τῆς <em>Ῥούθ</em>, <em>Βασιλειῶν
    πρώτη</em> μετὰ τῆς <em>δευτέρας</em>, βίβλος μία, <em>Βασιλειῶν τρίτη</em> μετὰ
    τῆς <em>τετάρτης</em>, βίβλος μία, καὶ αἱ <em>δύο</em> τῶν <em>Παραλειπομένων</em>,
    βίβλος μία· αὕτη δευτέρα πεντάτευχος. Τρίτη πεντάτευχος αἱ στιχήρεις βίβλοι· <em>τοῦ
    Ἰώβ, τὸ Ψαλτήριον, Παροιμίαι Σολομῶντος, Ἐκκλησιαστὴς</em> τοῦ αὐτοῦ, τὰ <em>Ἄισματα
    τῶν ᾀσμάτων</em> τοῦ αὐτοῦ. Τετάρτη πεντάτευχος, ἡ προφητική· τὸ <em>δωδεκαπρόφητον</em>,
    βίβλος μία, <em>Ἡσαΐας, Ἰερεμίας Ἰεζεκιήλ, Δανιήλ</em>. Εἶτα τοῦ <em>Ἔσδρα</em>,
    αἱ <em>δύο</em> εἰς μίαν συναπτόμεναι <em>βίβλον</em>, καὶ ἡ <em>Ἐσθήρ</em>. Ἡ
    δὲ Πανάρετος, τουτέστιν ἡ <em>Σοφία τοῦ Σολομῶντος</em>, καὶ ἡ <em>Σοφία τοῦ Ἰησοῦ</em>,
    ἣν ὁ πατὴρ μὲν τοῦ Σιρὰχ ἐξέθετο Ἑβραϊστί, Ἑλληνιστὶ δὲ ἡρμήνευσεν ὁ τούτου μὲν
    ἔγγονος Ἰησοῦς, τοῦ δὲ Σιρὰχ υἱός· ἐνάρετοι μὲν καὶ καλαί, ἀλλ᾿ οὐκ ἀριθμοῦνται
    οὐδὲ ἔκειντο ἐν τῇ κιβωτῷ.</p><p>Τῆς δὲ <strong>Νέας Διαθήκης</strong> εὐαγγέλια
    τέσσαρα· <em>τὸ κατὰ Ματθαῖον, τὸ κατὰ Μάρκον, τὸ κατὰ Λουκᾶν, τὸ κατὰ Ἰωάννην</em>·
    <em>Πράξεις τῶν ἁγίων ἀποστόλων</em> διὰ Λουκᾶ τοῦ εὐαγγελιστοῦ· καθολικαὶ ἐπιστολαὶ
    ἑπτά· <em>Ἰακώβου</em> μία, <em>Πέτρου</em> δύο, <em>Ἰωάννου</em> τρεῖς, <em>Ἰούδα</em>
    μία· <em>Παύλου ἀποστόλου</em> <em>ἐπιστολαὶ δεκατέσσαρες</em>, <em>Ἀποκάλυψις
    Ἰωάννου εὐαγγελιστοῦ</em>, <em>κανόνες τῶν ἁγίων ἀποστόλων</em> διὰ Κλήμεντος.</p></blockquote><p>(<a
    href="https://bibleox.com/grc/grc/w/JCZw_%E1%BC%9C%CE%BA%CE%B4%CE%BF%CF%83%CE%B9%CF%82_%E1%BC%80%CE%BA%CF%81%CE%B9%CE%B2%E1%BD%B4%CF%82_%CF%84%E1%BF%86%CF%82_%E1%BD%80%CF%81%CE%B8%CE%BF%CE%B4%CF%8C%CE%BE%CE%BF%CF%85_%CF%80%CE%AF%CF%83%CF%84%CE%B5%CF%89%CF%82__%CE%92%CE%B9%CE%B2%CE%BB%CE%AF%CE%BF_%CE%94#HH-%CE%9A%CE%95%CE%A6%CE%91%CE%9B%CE%91%CE%99%CE%9FN-90-%CE%A0%CE%B5%CF%81%E1%BD%B6-%CE%B3%CF%81%CE%B1%CF%86%E1%BF%86%CF%82">Έκδοσις
    ακριβής της ορθοδόξου πίστεως, βιβλίο Δ΄, κεφάλαιο 90 (17), περί Γραφής</a>)</p><h2>ΙΖ΄
    αιώνας</h2><h3>Επιστολή των Πατριαρχών (1723)</h3><p>Είναι συνοδικό κείμενο της
    Εκκλησίας των Ιεροσολύμων (1672), αλλά έως αυτόν τον χρόνο (1723) εγκρίθηκε επίσης
    από τα τέσσερα Πατριαρχεία (Κωνσταντινουπόλεως, Ιεροσολύμων, Αντιοχείας, Αλεξανδρείας)
    και από τη Σύνοδο της Ρωσικής Εκκλησίας.</p><blockquote><p>Ἀκολουθοῦντες τῷ κανόνι
    τῆς Καθολικῆς Ἐκκλησίας, Ἁγίαν Γραφὴν καλοῦμεν πάντα ἐκεῖνα [τὰ βιβλία], ὅσα συνέλεξεν
    ἐκ [τοῦ κανόνος] τῆς ἐν Λαοδικείᾳ Συνόδου καὶ ἀπηρίθμησεν ὁ Κύριλλος [Λούκαρις],
    προστιθεὶς τῇ Ἁγίᾳ Γραφῇ ἐκεῖνα ἃ ἀνοήτως, ἀμαθῶς, ἀκριβέστερον δὲ εἰπεῖν κακοβούλως,
    ἀπόκρυφα ὠνόμασεν, οἷον τὴν «<strong>Σοφίαν Σολομῶντος</strong>», τὴν «<strong>Ἰουδίθ</strong>»,
    τὸν «<strong>Τωβίαν</strong>», τὴν «<strong>Ἱστορίαν τοῦ δράκοντος</strong>»,
    τὴν «<strong>Ἱστορίαν τῆς Σωσάννης</strong>», τοὺς «<strong>Μακκαβαίους</strong>»
    καὶ τὴν «<strong>Σοφίαν Σειράχ</strong>».</p><p><strong><em><mark>Ταῦτα μετὰ τῶν
    λοιπῶν γνησίων βιβλίων τῆς θείας Γραφῆς γνήσια μέρη τῆς Γραφῆς ἀποδεχόμεθα</mark></em></strong>.
    Ἡ γὰρ ἀρχαία συνήθεια, ἢ μᾶλλον ἡ Καθολικὴ Ἐκκλησία, ἥτις παρέδωκεν ἡμῖν ὡς γνήσια
    τὰ ἱερὰ Εὐαγγέλια καὶ τὰ λοιπὰ βιβλία τῆς Γραφῆς, ἀναμφιβόλως παρέδωκε καὶ ταῦτα
    ὡς μέρη τῆς Ἁγίας Γραφῆς, καὶ ἡ ἀθέτησις αὐτῶν ἀθέτησις ἐκείνων ἐστίν.</p><p>Εἰ
    δὲ δοκεῖ ὅτι οὐκ ἀεὶ πάντα μετὰ τῶν λοιπῶν [βιβλίων] ἀπηριθμοῦντο, ὅμως καὶ ταῦτα
    συναπηριθμοῦντο καὶ συνεθεωροῦντο μετὰ τῆς λοιπῆς Γραφῆς, παρά τε τῶν συνόδων
    καὶ πολλῶν ἀρχαιοτάτων καὶ ἐπιφανῶν θεολόγων τῆς Καθολικῆς Ἐκκλησίας. <strong><mark>Πάντα
    ταῦτα τὰ βιβλία καὶ ἡμεῖς κανονικὰ ἡγούμεθα καὶ Ἁγίαν Γραφὴν ἀναγνωρίζομεν</mark></strong>.</p></blockquote><p>(Ερώτηση
    3)</p>'
