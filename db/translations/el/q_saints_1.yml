    <h2>Προοίμιο (εισαγωγή στο πρόβλημα)</h2><p>Από τη Γραφή και την Παράδοση γνωρίζουμε ότι ο Νόμος του Μωυσή (ΝΜ) έχει καταργηθεί. Με την πρώτη ματιά, στους ανθρώπους είναι εύκολο να κατανοήσουν τα λόγια για την κατάργηση του νόμου. Τι σημαίνει «καταργήθηκε»; «Καταργήθηκε» σημαίνει ότι η τήρηση των εντολών του νόμου δεν έχει πλέον σημασία, ότι οι χριστιανοί δεν πρέπει να ακολουθούν τις διατάξεις του ΝΜ. Όταν όμως εξετάζει κανείς τις εντολές του ΝΜ, μπορεί να πέσει σε σοβαρή απορία. Βλέπει εντολές δύο ειδών: εκείνες που μπορούν να παραβαίνονται και εκείνες που δεν μπορούν να παραβαίνονται. Για παράδειγμα, η κατάργηση της προσφοράς της δεκάτης στον ναό της Ιερουσαλήμ, βεβαίως, επιτρέπει να μην την προσφέρει κανείς, αλλά η κατάργηση της απαγόρευσης της βλασφημίας, προφανώς, σε καμία περίπτωση δεν μπορεί να επιτρέψει τη βλασφημία.</p><p>Το πρώτο είδος εντολών, η κατάργηση των οποίων επιτρέπει να μην εκπληρώνεται η απαίτηση της εντολής:</p><ul><li><p>η περιτομή;</p></li><li><p>η σαββατική ανάπαυση;</p></li><li><p>το να σκοτώνει κανείς για βλασφημία, για παράβαση του σαββάτου και για άλλα θανάσιμα αμαρτήματα;</p></li><li><p>η απαγόρευση του αγγίγματος των νεκρών;</p></li><li><p>οι ζωικές θυσίες;</p></li><li><p>η προσφορά της δεκάτης στον ναό της Ιερουσαλήμ;</p></li><li><p>ο εορτασμός των εορτών της Παλαιάς Διαθήκης.</p></li></ul><p>Το δεύτερο είδος εντολών, η κατάργηση των οποίων δεν οδηγεί στην άδεια των αντίθετων πράξεων:</p><ul><li><p>να αγαπάς τον Θεό;</p></li><li><p>να αγαπάς τον πλησίον;</p></li><li><p>να μη βλασφημείς;</p></li><li><p>να μην ειδωλολατρείς;</p></li><li><p>να μη ψευδομαρτυρείς;</p></li><li><p>να μην επιτρέπεις την ασέλγεια, τις σοδομικές αμαρτίες και κάθε είδους διαστροφές;</p></li><li><p>να μην πορνεύεις;</p></li><li><p>να μην κάνεις στον άλλον ό,τι δεν θέλεις για τον εαυτό σου.</p></li></ul><p>Βλέποντας όλα αυτά, ο άνθρωπος δεν μπορεί να καταλάβει τι σημαίνει τότε η φράση «ο Νόμος του Μωυσή καταργήθηκε»; Για να βοηθήσουν τον άνθρωπο να βγει από αυτή την απορία, μερικοί προτείνουν να διαιρέσουμε τον ΝΜ σε δύο μέρη: <strong>τελετουργικές</strong> εντολές και <strong>ηθικές</strong> εντολές. Και εξηγούν: οι τελετουργικές καταργήθηκαν, ενώ οι ηθικές όχι.</p><p>Αυτή η προσέγγιση έχει προβλήματα:</p><ol><li><p>Ούτε οι απόστολοι ούτε οι άγιοι Πατέρες διαιρούν τον ΝΜ σε μέρη: ενεργό και ανενεργό. Μιλώντας για την κατάργηση του ΝΜ, μιλούν γενικά: πεθάναμε για τον ΝΜ, δεν βρισκόμαστε πλέον υπό την καθοδήγηση του ΝΜ.</p></li><li><p>Αν η Παλαιά Διαθήκη (ΠΔ) έφτασε στο τέλος της και ο ΝΜ (οι όροι της παραμονής στην ΠΔ) καταργήθηκε, τότε πώς εξηγείται η συνέχιση της ισχύος μέρους του ΝΜ για τον χριστιανό που δεν εισήλθε καν στην ΠΔ;</p></li><li><p>Δεν υπάρχει σαφές όριο ανάμεσα στις ηθικές και τις τελετουργικές εντολές. Στο τέλος, ο άνθρωπος ταράζεται επειδή δεν τηρεί κάποια εντολή του ΝΜ: «και αν καταδικαστώ επειδή δεν τήρησα κάτι σημαντικό»;</p></li><li><p>Οι αιρετικοί χρησιμοποιούν την ασάφεια του ορίου της διαίρεσης για να παγιδέψουν τους ανθρώπους στις αιρέσεις τους. Μετακινούν το αφανές όριο ανάμεσα στις τελετουργικές και τις ηθικές εντολές, λέγοντας ότι πρέπει να τηρείται η σαββατική ανάπαυση, διδάσκουν να φέρνουν τη δεκάτη στις τσέπες τους και απειλούν με κατάρα (αν και η τσέπη τους δεν έχει καμία σχέση με τον ναό της Ιερουσαλήμ), συνηθίζουν να τηρούν την αποχή από ακάθαρτες τροφές και ερμηνεύουν τη 2η εντολή έτσι ώστε να στρέφεται κατά των εικόνων του Θεού και των αγίων Του. Έτσι κατηγορούν την Εκκλησία για αποστασία από τον Θεό και προτείνουν να φύγει κανείς γρήγορα στη σέκτα τους, όπου δήθεν τηρούνται όλες οι αναγκαίες διατάξεις του ΝΜ.</p></li></ol><p>Για την ασάφεια του ορίου πρέπει να πούμε περισσότερα:</p><ul><li><p>Η σαββατική ανάπαυση — τελετουργική εντολή ή ηθική; Δεν ωθεί τον άνθρωπο προς την ηθική τελείωση την έβδομη ημέρα;</p></li><li><p>Το να προσφέρει κανείς τη δεκάτη — τελετουργική εντολή; Δεν κλίνει (προδιαθέτει) την καρδιά του ανθρώπου στη θυσία, την ευσπλαχνία και την αγάπη; Δεν είναι η θυσία βοήθεια στην Εκκλησία για το κήρυγμα και την τέλεση της λατρείας;</p></li><li><p>Η απαγόρευση των εικόνων δεν προφυλάσσει από την ειδωλολατρία (ηθικό αμάρτημα);</p></li><li><p>Το να σκοτώνεις για θανάσιμα αμαρτήματα — άραγε τελετουργική εντολή; Δεν δόθηκε αυτή η εντολή για τη διαφύλαξη της ηθικής στον λαό;</p></li><li><p>Οι ζωικές θυσίες δεν είναι άραγε ευχαριστία προς τον Θεό (ηθική πράξη), που γινόταν δεκτή ακόμη και πριν από τον ΝΜ, από τους πρώτους ανθρώπους;</p></li></ul><p>Γενικά, η διαίρεση του ΝΜ δεν υπάρχει στη Γραφή, δεν την έκαναν οι άγιοι Πατέρες, το προτεινόμενο όριο της διαίρεσης δεν έχει στέρεες βάσεις και είναι αφανές, οι άνθρωποι ταράζονται, οι σεχταριστές το εκμεταλλεύονται. Τι να κάνουμε λοιπόν; Να κατανοούμε την κατάργηση του ΝΜ όπως διδάσκουν οι απόστολοι και οι άγιοι Πατέρες: <strong>όλος ο Νόμος του Μωυσή καταργήθηκε, χωρίς διαίρεση σε μέρη</strong>. Και τι γίνεται με τις εντολές που προφανώς δεν επιτρέπεται να παραβαίνουμε;</p><p>Η απάντηση είναι απλή: <strong><mark>ο χριστιανός πρέπει να ακολουθεί τον Χριστό και όχι τον Νόμο του Μωυσή</mark></strong>. Ο Νόμος του Μωυσή πράγματι καταργήθηκε ολόκληρος. Επειδή όμως ο Χριστός είναι Θεός και έδωσε στην Παλαιά Διαθήκη αυτές τις εντολές, το ηθικό τους μέρος πράγματι συμπίπτει συχνά με τον τρόπο που δίδαξε να ζούμε ο Χριστός, <strong>αλλά οι χριστιανοί το μαθαίνουν αυτό εξετάζοντας όχι τον Νόμο του Μωυσή αλλά την εικόνα του Χριστού</strong>: τη ζωή και τη διδασκαλία Του, που φυλάσσονται στην Εκκλησία Του. Για παράδειγμα, ο Χριστός δεν βλασφήμησε, γι' αυτό και οι χριστιανοί δεν πρέπει να βλασφημούν. <strong><mark>Η ακολούθηση του Χριστού είναι η ίδια η ουσία της ζωής του χριστιανού</mark></strong>. Δηλαδή ο χριστιανός τηρεί την εντολή όχι επειδή έτσι προστάζει το γράμμα του Νόμου του Μωυσή, αλλά επειδή εξομοιώνεται με τον Κύριο και Θεό Ιησού Χριστό:</p><blockquote><p>«<strong>ὅσοι γὰρ εἰς Χριστὸν ἐβαπτίσθητε, Χριστὸν ἐνεδύσασθε</strong>·» (<a href="https://bibleox.com/el/gr-lxx-byz/gal/3/#L27">Γαλ 3:27</a>)</p></blockquote><blockquote><p>«ζῶ δὲ οὐκέτι ἐγώ, <strong>ζῇ δὲ ἐν ἐμοὶ Χριστός</strong>· ὃ δὲ νῦν ζῶ ἐν σαρκί, ἐν πίστει ζῶ τῇ τοῦ υἱοῦ τοῦ θεοῦ τοῦ ἀγαπήσαντός με καὶ παραδόντος ἑαυτὸν ὑπὲρ ἐμοῦ.» (<a href="https://bibleox.com/el/gr-lxx-byz/gal/2/#L20">Γαλ 2:20</a>; <a href="https://bibleox.com/el/gr-lxx-byz/rim/8/#L10">Ρωμ 8:10</a>)</p></blockquote><blockquote><p>«τεκνία μου, <strong>οὓς πάλιν ὠδίνω μέχρις οὗ μορφωθῇ Χριστὸς ἐν ὑμῖν</strong>,» (<a href="https://bibleox.com/el/gr-lxx-byz/gal/4/#L19">Γαλ 4:19</a>)</p></blockquote><blockquote><p>«<strong>τοῦτο φρονεῖτε ἐν ὑμῖν ὃ καὶ ἐν Χριστῷ Ἰησοῦ</strong>,» (<a href="https://bibleox.com/el/gr-lxx-byz/fil/2/#L5">Φιλιπ 2:5</a>)</p></blockquote><blockquote><p>«ὁ δὲ πνευματικὸς ἀνακρίνει [τὰ] πάντα, αὐτὸς δὲ ὑπ' οὐδενὸς ἀνακρίνεται. τίς γὰρ ἔγνω νοῦν κυρίου, ὃς συμβιβάσει αὐτόν; <strong>ἡμεῖς δὲ νοῦν Χριστοῦ ἔχομεν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/2/#L15-16">Α Κορ 2:15-16</a>)</p></blockquote><blockquote><p><em>«παρακαλῶ οὖν ὑμᾶς· </em><strong><em>μιμηταί μου γίνεσθε</em></strong><em>» </em>(<a href="https://bibleox.com/el/gr-lxx-byz/1kor/4/#L16">Α Κορ 4:16</a>)</p></blockquote><blockquote><p><em>«</em><strong><em>Συμμιμηταί μου γίνεσθε, ἀδελφοί</em></strong><em>, καὶ σκοπεῖτε τοὺς οὕτω περιπατοῦντας </em><strong><em>καθὼς ἔχετε τύπον ἡμᾶς</em></strong><em>» </em>(<a href="https://bibleox.com/el/gr-lxx-byz/fil/3/#L17">Φιλιπ 3:17</a>)</p></blockquote><p>Ο Χριστός υποδεικνύει τον ίδιο τρόπο δράσης: βλέπει τον Πατέρα να δημιουργεί και δημιουργεί και Αυτός:</p><blockquote><p>«Ἀπεκρίνατο οὖν ὁ Ἰησοῦς καὶ ἔλεγεν αὐτοῖς, Ἀμὴν ἀμὴν λέγω ὑμῖν, οὐ δύναται ὁ υἱὸς ποιεῖν ἀφ' ἑαυτοῦ οὐδὲν <strong>ἐὰν μή τι <mark>βλέπῃ τὸν πατέρα ποιοῦντα</mark>· ἃ γὰρ ἂν ἐκεῖνος ποιῇ, ταῦτα καὶ ὁ υἱὸς <mark>ὁμοίως ποιεῖ</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/5/#L19">Ιω 5:19</a>)</p></blockquote><p>Για να μη συγκρίνει κανείς τη ζωή του με το γράμμα, αλλά με τον ζώντα Θεό, ο Θεός γίνεται όμοιος με εμάς, δίνει στους ανθρώπους τον Εαυτό Του και τη δική Του ανθρώπινη ζωή ως ορατή εικόνα, καταργώντας τον νόμο των εντολών με τη διδασκαλία:</p><blockquote><p>«<strong>τὸν νόμον τῶν ἐντολῶν ἐν δόγμασιν καταργήσας</strong>, <strong>ἵνα τοὺς δύο κτίσῃ</strong> <strong>ἐν αὑτῷ εἰς ἕνα καινὸν ἄνθρωπον</strong> ποιῶν εἰρήνην,» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/2/#L15">Εφ 2:15</a>)</p></blockquote><blockquote><p>«ὅτι αὕτη ἡ διαθήκη, ἣν διαθήσομαι τῷ οἴκῳ Ισραηλ μετὰ τὰς ἡμέρας ἐκείνας, φησὶν κύριος <strong>Διδοὺς δώσω νόμους μου εἰς τὴν διάνοιαν αὐτῶν καὶ ἐπὶ καρδίας αὐτῶν γράψω αὐτούς</strong>, καὶ ἔσομαι αὐτοῖς εἰς θεόν, καὶ αὐτοὶ ἔσονταί μοι εἰς λαόν·» (<a href="https://bibleox.com/el/gr-lxx-byz/ier/38/#L33">Ιερ 38:33</a>)</p></blockquote><blockquote><p>«φανερούμενοι ὅτι <strong>ἐστὲ ἐπιστολὴ Χριστοῦ</strong> διακονηθεῖσα ὑφ' ἡμῶν, <strong>ἐγγεγραμμένη οὐ μέλανι ἀλλὰ πνεύματι θεοῦ ζῶντος, οὐκ ἐν πλαξὶν λιθίναις ἀλλ' ἐν πλαξὶν καρδίαις σαρκίναις</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/2kor/3/#L3">Β Κορ 3:3</a>)</p></blockquote><p>Στο τέλος, ο χριστιανός δεν κρίνεται κατά τον Νόμο του Μωυσή, αλλά κατά τον νόμο της ελευθερίας:</p><blockquote><p>«οὕτως λαλεῖτε καὶ οὕτως <strong>ποιεῖτε</strong> <strong>ὡς διὰ νόμου ἐλευθερίας μέλλοντες κρίνεσθαι</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/iak/2/#L12">Ιακ 2:12</a>)</p></blockquote><p>Όταν ο χριστιανός προσπαθεί να εξομοιωθεί με τον Χριστό, αν και δεν κοιτάζει τον Νόμο του Μωυσή, οι ηθικές διατάξεις του ΝΜ μπορεί να συμπίπτουν με τον τρόπο ζωής του Χριστού. Η αιτία αυτών των συμπτώσεων δεν είναι ο Νόμος, αλλά ο ίδιος ο Θεός, που έγινε αιτία και του Νόμου και της αγιότητας του δικαίου. Δεν είναι ο Νόμος η πρώτη αιτία, αλλά ο Θεός. Ο Θεός έγινε αιτία του Νόμου, και ο Θεός έγινε αιτία των αγίων, που εξομοιώθηκαν με τον Θεό χωρίς να έχουν ανάγκη από νόμο (<a href="https://bibleox.com/el/gr-lxx-byz/1tim/1/#L9">Α Τιμ 1:9</a>).</p><p>Με περισσότερες λεπτομέρειες για όλα αυτά γράφει τον Β΄ αιώνα ο ιερομάρτυς Ειρηναίος ο Λουγδούνου, η παράθεση παρακάτω. Την ίδια εποχή και ο μάρτυς Ιουστίνος λέει σύντομα: «<em>αἰώνιός τε ἡμῖν νόμος καὶ τελευταῖος ὁ Χριστὸς ἐδόθη καὶ ἡ διαθήκη πιστή, μεθ' ἣν οὐ νόμος, οὐ πρόσταγμα, οὐκ ἐντολή</em>».</p><p>Αξίζει να γίνει μια διευκρίνιση: οι άγιοι Πατέρες, αν και δεν ζούσαν κατά τον Νόμο του Μωυσή, συνέτασσαν εντούτοις ερμηνείες της Γραφής, μεταξύ των οποίων και του Νόμου του Μωυσή. Η εξέταση του Νόμου του Μωυσή μέσα από το πρίσμα της εκκλησιαστικής διδασκαλίας μπορεί να έχει όφελος.</p><p>Ο νόμος της ελευθερίας (ο νόμος του Χριστού) είναι τελειότερος, 1) οικοδομείται στη γνώση του Χριστού και 2) απαιτεί μεγαλύτερη ευθύνη, για την οποία μιλάει ο απόστολος:</p><blockquote><p>«βλέπετε δὲ μή πως <strong>ἡ ἐξουσία ὑμῶν αὕτη πρόσκομμα γένηται τοῖς ἀσθενέσιν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/8/#L9">Α Κορ 8:9</a>)</p></blockquote><blockquote><p>«Ὑμεῖς γὰρ ἐπ' ἐλευθερίᾳ ἐκλήθητε, ἀδελφοί· <strong>μόνον μὴ τὴν ἐλευθερίαν εἰς ἀφορμὴν τῇ σαρκί</strong>, ἀλλὰ διὰ τῆς ἀγάπης δουλεύετε ἀλλήλοις.» (<a href="https://bibleox.com/el/gr-lxx-byz/gal/5/#L13">Γαλ 5:13</a>)</p></blockquote><p>Μελετώντας την Παλαιά Διαθήκη και τον Νόμο του Μωυσή και αντλώντας όφελος, πρέπει να κατανοούμε ότι ο χριστιανός ακολουθεί τον Χριστό και ζει όχι κατά τον Νόμο του Μωυσή (όχι κατά μια καταγεγραμμένη οδηγία), αλλά από αγάπη, εξομοιώνεται με τον Δημιουργό του, απεικονίζει μέσα του την εικόνα Του, που φυλάσσεται στην Εκκλησία Του.</p><p>Η ζωή όχι κατά την οδηγία του Νόμου, αλλά κατά την οδό της εξομοίωσης με την εικόνα του Χριστού, φέρνει στο προσκήνιο τα ζητήματα που σχετίζονται με τη σωστή εικόνα του Χριστού. Διότι αν ο άνθρωπος ακολουθήσει έναν άλλον Ιησού, τον οποίο οι απόστολοι δεν κήρυξαν (<a href="https://bibleox.com/el/gr-lxx-byz/2kor/11/#L3-4">Β Κορ 11:3-4</a>), τότε και τη ζωή του θα την οικοδομήσει κατά την εικόνα ενός άλλου Ιησού: κατά την εικόνα που επινοήθηκε από έναν ξένο άνθρωπο και δεν παραλήφθηκε από την Εκκλησία του Χριστού, η οποία γνώρισε προσωπικά, είδε και άκουσε τον Χριστό (<a href="https://bibleox.com/el/gr-lxx-byz/1in/1/#L1-3">Α Ιω 1:1-3</a>), και διαφύλαξε την εικόνα Του μέσα της επί χιλιετίες, σε μια αδιάκοπη σειρά αγίων που απεικόνισαν τον Χριστό μέσα τους (<a href="https://bibleox.com/el/gr-lxx-byz/fil/3/#L17">Φιλιπ 3:17</a>), από την αρχή, σε κάθε αιώνα, και έως τις ημέρες μας. Εξάλλου, αυτό είναι ήδη το επόμενο κεντρικό ζήτημα, με το οποίο ο απόστολος Ιωάννης ανοίγει την επιστολή του, μαρτυρώντας ότι η Εκκλησία έλαβε την αληθινή εικόνα του Χριστού (<a href="https://bibleox.com/el/gr-lxx-byz/1in/1/#L1-3">Α Ιω 1:1-3</a>; βλ. <a href="https://bibleox.com/el/gr-lxx-byz/gal/3/#L1">Γαλ 3:1</a>) και κλείνει την ίδια επιστολή με μια αυθόρμητη προειδοποίηση για τις ψευδείς εικόνες (<a href="https://bibleox.com/el/gr-lxx-byz/1in/5/#L21">Α Ιω 5:21</a>).</p>
    <h2>Α΄ αιώνας</h2><h3>Ιγνάτιος ο Θεοφόρος, επίσκοπος Αντιοχείας, ιερομάρτυς (35-107)</h3><blockquote><p>«<strong><mark>εἰ γὰρ μέχρι νῦν κατὰ Ἰουδαϊσμὸν ζῶμεν</mark></strong>, <strong><mark>ὁμολογοῦμεν χάριν μὴ εἰληφέναι</mark></strong>.» (<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%B3%CE%BD%CE%98_%CE%9C%CE%B1%CE%B3#HH-8">Προς Μαγνησιείς 8</a>)</p></blockquote><blockquote><p>«<strong><mark>ἄτοπόν ἐστιν, Ἰησοῦν Χριστὸν λαλεῖν καὶ ἰουδαΐζειν</mark></strong>. ὁ γὰρ Χριστιανισμὸς οὐκ εἰς Ἰουδαϊσμὸν ἐπίστευσεν, ἀλλ' Ἰουδαϊσμὸς εἰς Χριστιανισμόν, ᾧ πᾶσα γλῶσσα πιστεύσασα εἰς θεὸν συνήχθη·» (<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%B3%CE%BD%CE%98_%CE%9C%CE%B1%CE%B3#HH-10">Προς Μαγνησιείς 10</a>)</p></blockquote><h3>Απόστολος Βαρνάβας (Α΄ αιώνας)</h3><blockquote><p>«ἄρα οὖν οὐκ ἔστιν ἐντολὴ θεοῦ τὸ μὴ τρώγειν, <strong><mark>Μωϋσῆς δὲ ἐν πνεύματι ἐλάλησεν</mark></strong>. τὸ οὖν χοιρίον πρὸς τοῦτο εἶπεν· οὐ κολληθήσῃ, φησίν, ἀνθρώποις τοιούτοις, οἵτινές εἰσιν ὅμοιοι χοίρων· &lt;…&gt; Καὶ οὐ φάγῃ, φησίν, σμύραιναν οὐδὲ πολύποδα οὐδὲ σηπίαν· οὐ μή, φησίν, ὁμοιωθῇς κολλώμενος ἀνθρώποις τοιούτοις, οἵτινες εἰς τέλος εἰσὶν ἀσεβεῖς καὶ κεκριμένοι ἤδη τῷ θανάτῳ, ὡς καὶ ταῦτα τὰ ἰχθύδια μόνα ἐπικατάρατα ἐν τῷ βυθῷ νήχεται, μὴ κολυμβῶντα ὡς τὰ λοιπά, ἀλλ' ἐν τῇ γῇ κάτω τοῦ βυθοῦ κατοικεῖ. ἀλλὰ καὶ τὸν δασύποδα οὐ φάγῃ. πρὸς τί; οὐ μὴ γένῃ, φησίν, παιδοφθόρος οὐδὲ ὁμοιωθήσῃ τοῖς τοιούτοις, ὅτι ὁ λαγωὸς κατ' ἐνιαυτὸν πλεονεκτεῖ τὴν ἀφόδευσιν· ὅσα γὰρ ἔτη ζῇ, τοσαύτας ἔχει τρύπας. ἀλλ' οὐδὲ τὴν ὕαιναν φάγῃ· οὐ μή, φησίν, γένῃ μοιχὸς οὐδὲ φθορέὺς οὐδὲ ὁμοιωθήσῃ τοῖς τοιούτοις. πρὸς τί; ὅτι τὸ ζῷον τοῦτο παρ' ἐνιαυτὸν ἀλλάσσει τὴν φύσιν καὶ ποτὲ μὲν ἄρρεν, ποτὲ δὲ θῆλυ γίνεται. ἀλλὰ καὶ τὴν γαλῆν ἐμίσησεν καλῶς. οὐ μή, φησίν, γενηθῇς τοιοῦτος, οἵους ἀκούομεν ἀνομίαν ποιοῦσας ἐν τῷ στόματι. τὸ γὰρ ζῷον τοῦτο τῷ στόματι κύει. &lt;…&gt; τί δὲ τὸ διχηλοῦν; ὅτι ὁ δίκαιος καὶ ἐν τούτῳ τῷ κόσμῳ περιπατεῖ καὶ τὸν ἅγιον αἰῶνα ἐκδέχεται. βλέπετε, πῶς ἐνομοθέτησεν Μωϋσῆς καλῶς. ἀλλὰ πόθεν ἐκείνοις ταῦτα νοῆσαι ἢ συνιέναι; ἡμεῖς δὲ δικαίως νοήσαντες τὰς ἐντολὰς λαλοῦμεν, ὡς ἠθέλησεν ὁ κύριος. διὰ τοῦτο περιέτεμεν τὰς ἀκοὰς ἡμῶν καὶ τὰς καρδίας, ἵνα συνιῶμεν ταῦτα.»</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%95%CF%80%CE%B9%CF%83%CF%84%CE%BF%CE%BB%CE%AE_%CE%92%CE%B1%CF%81%CE%BD%CE%AC%CE%B2%CE%B1#HH-10">Επιστολή Βαρνάβα</a>)</p>
    <h2>Β΄ αιώνας</h2><h3>Ιουστίνος ο Φιλόσοφος, μάρτυς (περ. 100-165)</h3><blockquote><p>«<strong>ὁ γὰρ ἐν Χωρὴβ παλαιὸς ἤδη νόμος καὶ ὑμῶν μόνων, ὁ δὲ πάντων ἁπλῶς· <mark>νόμος δὲ κατὰ νόμου τεθεὶς τὸν πρὸ αὐτοῦ ἔπαυσε, καὶ διαθήκη μετέπειτα γενομένη τὴν προτέραν ὁμοίως ἔστησεν</mark></strong>· <strong><mark>αἰώνιός τε ἡμῖν νόμος καὶ τελευταῖος ὁ Χριστὸς ἐδόθη καὶ ἡ διαθήκη πιστή, μεθ' ἣν οὐ νόμος, οὐ πρόσταγμα, οὐκ ἐντολή</mark></strong>. ἢ σὺ ταῦτα οὐκ ἀνέγνως ἃ φησιν Ἠσαΐας; «Ἀκούσατέ μου, ἀκούσατέ μου, λαός μου, καὶ οἱ βασιλεῖς πρός με ἐνωτίζεσθε, ὅτι <strong><mark>νόμος παρ' ἐμοῦ ἐξελεύσεται</mark></strong> καὶ ἡ κρίσις μου εἰς φῶς ἐθνῶν. ἐγγίζει ταχὺ ἡ δικαιοσύνη μου, καὶ ἐξελεύσεται τὸ σωτήριόν μου, καὶ εἰς τὸν βραχίονά μου ἔθνη ἐλπιοῦσι». καὶ διὰ Ἰερεμίου περὶ ταύτης αὐτῆς τῆς καινῆς διαθήκης οὕτω φησίν· «Ἰδοὺ ἡμέραι ἔρχονται, λέγει κύριος, καὶ διαθήσομαι τῷ οἴκῳ Ἰσραὴλ καὶ τῷ οἴκῳ Ἰούδα διαθήκην καινήν, οὐχ ἣν διεθέμην τοῖς πατράσιν αὐτῶν, ἐν ἡμέρᾳ ᾗ ἐπελαβόμην τῆς χειρὸς αὐτῶν ἐξαγαγεῖν αὐτοὺς ἐκ τῆς Αἰγύπτου».</p><p>…</p><p><strong>διὰ τὰς ἀδικίας ὑμῶν καὶ τῶν πατέρων ὑμῶν</strong> εἰς σημεῖον, ὡς προέφην, καὶ τὸ σάββατον <strong>ἐντέταλται ὁ θεὸς φυλάσσειν ὑμᾶς</strong> καὶ τὰ ἄλλα <strong>προστάγματα προσετετάχει</strong>,</p><p>…</p><p>Καὶ ὅτι διὰ τὰς ἁμαρτίας τοῦ λαοῦ ὑμῶν καὶ διὰ τὰς εἰδωλολατρείας, ἀλλ' οὐ διὰ τὸ ἐνδεὴς εἶναι τῶν τοιούτων προσφορῶν, ἐνετείλατο ὁμοίως ταῦτα γίνεσθαι</p><p>…</p><p>Ὡς οὖν ἀπὸ Ἀβραὰμ ἤρξατο περιτομὴ καὶ <strong>ἀπὸ Μωυσέως σάββατον καὶ θυσίαι καὶ προσφοραὶ καὶ ἑορταί</strong>, καὶ ἀπεδείχθη <strong>διὰ τὸ σκληροκάρδιον τοῦ λαοῦ ὑμῶν ταῦτα διατετάχθαι</strong>, οὕτως <strong><mark>παύσασθαι ἔδει κατὰ τὴν τοῦ πατρὸς βουλὴν εἰς τὸν διὰ τῆς ἀπὸ τοῦ γένους τοῦ Ἀβραὰμ καὶ φυλῆς Ἰούδα καὶ Δαυεὶδ παρθένου γεννηθέντα υἱὸν τοῦ θεοῦ Χριστόν</mark></strong>,</p><p>…</p><p>Διὰ τὸ σκληροκάρδιον τοῦ λαοῦ ὑμῶν <strong><mark>πάντα τὰ τοιαῦτα ἐντάλματα νοεῖτε τὸν θεὸν διὰ Μωυσέως ἐντειλάμενόν ὑμῖν</mark></strong>, ἵνα διὰ πολλῶν τούτων ἐν πάσῃ πράξει πρὸ ὀφθαλμῶν ἀεὶ ἔχητε τὸν θεὸν καὶ μήτε ἀδικεῖν μήτε ἀσεβεῖν ἄρχησθε.»</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%BF_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82-%CE%94%CE%B9%CE%AC%CE%BB%CE%BF%CE%B3%CE%BF_%CF%80%CF%81%CE%BF%CF%82_%CE%A4%CF%81%CF%8D%CF%86%CF%89%CE%BD%CE%B1">Διάλογος προς Τρύφωνα</a>)</p><h3>Ειρηναίος ο Λουγδούνου, ιερομάρτυς (130-202)</h3><blockquote><p>«οἱ ἄνθρωποι <strong><mark>οὐκ ἐν πολυλογίᾳ τοῦ νόμου βιώσονται, ἀλλ' ἐν συντομίᾳ πίστεως καὶ ἀγάπης</mark></strong>, περὶ τούτου Ἠσαΐας οὕτως λέγει· «Λόγον συντετμημένον ἐν δικαιοσύνῃ· ὅτι λόγον συντετμημένον ποιήσει ὁ θεὸς ἐν πάσῃ τῇ γῇ» (Ησ 10:22-23). Διὸ καὶ ὁ ἀπόστολος Παῦλος λέγει· «Πλήρωμα νόμου ἡ ἀγάπη» (Ρωμ 13:10)· <strong><mark>ὁ γὰρ ἀγαπῶν τὸν θεὸν τὸν νόμον πεπλήρωκεν</mark></strong>. Οὕτως καὶ ὁ Κύριος, ἐρωτηθεὶς ποία ἐντολὴ μεγίστη, ἀπεκρίθη· «Ἀγαπήσεις κύριον τὸν θεόν σου ἐξ ὅλης τῆς καρδίας σου καὶ ἐξ ὅλης τῆς ἰσχύος σου· καὶ ἡ δευτέρα ὁμοία αὐτῇ· ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν. Ἐν ταύταις ταῖς δυσὶν ἐντολαῖς ὅλος ὁ νόμος καὶ οἱ προφῆται κρέμανται» (Μκ 12:30 ἑξ.· Μτ 22:37 ἑξ.). Διὰ τῆς εἰς αὐτὸν πίστεως τὴν ἀγάπην ἡμῶν τὴν πρὸς θεὸν καὶ τὸν πλησίον αὐξάνει, δι' ἣν εὐσεβεῖς καὶ δίκαιοι καὶ ἀγαθοὶ γινόμεθα· καὶ διὰ τοῦτο· «Λόγον συντετμημένον ἐποίησεν ἐν τῇ γῇ, ἐν τῇ οἰκουμένῃ».</p><p>&lt;…&gt;</p><p>Τὸ <strong><mark>μὴ βούλεσθαι αὐτὸν τοὺς λελυτρωμένους ἐπὶ τὴν Μωυσέως νομοθεσίαν ἐπανάγειν – ὁ γὰρ νόμος ὑπὸ τοῦ Χριστοῦ πεπλήρωται – ἀλλὰ δεῖν ἐν πίστει καὶ ἀγάπῃ ζῇν</mark></strong> ἐκ τοῦ Υἱοῦ τοῦ θεοῦ κατὰ τὴν καινὴν ταύτην τοῦ λόγου φύσιν, περὶ τούτου Ἠσαΐας οὕτως κηρύσσει· «<strong>Μὴ μνημονεύετε τὰ πρῶτα καὶ τὰ ἀρχαῖα μὴ λογίζεσθε. Ἰδοὺ ποιῶ καινά</strong>, ἃ ἤδη ἀνατέλλει, καὶ γνώσεσθε αὐτά. Καὶ ποιήσω ἐν τῇ ἐρήμῳ ποταμοὺς καὶ ἐν τῇ ἀνύδρῳ χειμάρρους, ποτίσαι τὸ γένος μου τὸ ἐκλεκτόν, τὸν λαόν μου ὃν περιεποιησάμην, τὴν ἀρετήν μου διηγεῖσθαι» (Ησ 43:19-21). Ἔρημος δὲ καὶ ἄνυδρος πρότερον ἦν ἡ τῶν ἐθνῶν κλῆσις, ἐπειδὴ οὔτε ὁ Λόγος δι' αὐτῆς διῆλθεν οὔτε τὸ ἅγιον Πνεῦμα ἐπότισεν αὐτήν, ὃ τὴν καινὴν ὁδὸν τῆς εὐσεβείας καὶ δικαιοσύνης ἐχάραξε καὶ τοὺς ἀφθόνους ἐπήγασε ποταμούς, τουτέστιν ἐπὶ τῆς γῆς τὸ ἅγιον Πνεῦμα ἐξέχεεν, ὡς ἐπηγγείλατο διὰ τῶν προφητῶν ἐν ταῖς ἐσχάταις ἡμέραις ἐκχέαι τὸ Πνεῦμα ἐπὶ πᾶσαν τὴν γῆν.</p><p>90. Οὕτως οὖν <strong><mark>ἡ κλῆσις ἡμῶν δι' ἀνακαινίσεως πνεύματος καὶ οὐκ ἐν τῷ παλαιῷ ἡμῶν</mark></strong>, καθὼς προεφήτευσεν Ἱερεμίας</p><p>&lt;…&gt;</p><p>Ἡ πρώτη σύναξις (τουτέστιν ἡ ἐκκλησία) τὸν νόμον αὐτὸν εἶχεν ἄνδρα.</p><p>&lt;…&gt;</p><p>Ἐπειδὴ δὲ διὰ τῆς κλήσεως ταύτης ἡ ζωὴ ἡμῖν δέδοται, καὶ ὁ θεὸς τὴν πίστιν Ἀβραὰμ τὴν εἰς αὐτὸν ἐν ἡμῖν αὖθις εἰς τελείωσιν ἤγαγεν, <strong><mark>οὐκέτι δεῖ ἡμᾶς ἐπὶ τὴν πρώτην νομοθεσίαν ἐπανιέναι.</mark> Τὸν γὰρ κύριον τοῦ νόμου, τὸν Υἱὸν τοῦ θεοῦ, εἰλήφαμεν. Καὶ διὰ τῆς εἰς αὐτὸν πίστεως μανθάνομεν ἀγαπᾶν τὸν θεὸν ἐξ ὅλης καρδίας καὶ τοὺς πλησίον ὡς ἑαυτούς</strong>. Ἡ δὲ ἀγάπη ἡ πρὸς θεὸν παντὸς ἁμαρτήματος πόρρω ἐστίν, καὶ ἡ ἀγάπη ἡ πρὸς τὸν πλησίον κακὸν τῷ πλησίον οὐκ ἐργάζεται (πρβλ. Ρωμ 13:10).</p><p>96. Διὸ <strong><mark>οὐδενὸς ἡμῖν νόμου χρεία ὡς παιδαγωγοῦ</mark></strong>· ἰδοὺ γὰρ τῷ Πατρὶ λαλοῦμεν καὶ ἐνώπιον αὐτοῦ ἑστήκαμεν πρόσωπον πρὸς πρόσωπον, νήπιοι ἐν τῇ κακίᾳ γενόμενοι καὶ ἐν δικαιοσύνῃ καὶ σεμνότητι κεκραταιωμένοι. Ὁ γὰρ <strong>νόμος οὐκέτι ἐρεῖ· «Οὐ μοιχεύσεις» τῷ μηκέτι ἐπιθυμίας ἐναγεῖς πρὸς γυναῖκα ἀλλοτρίαν ἀναβαλλομένῳ· καὶ οὐκ ἐρεῖ· «Οὐ φονεύσεις» τῷ πᾶσαν ὀργὴν καὶ ἔχθραν ἀφ' ἑαυτοῦ ἀπελάσαντι· οὐδὲ ἐρεῖ· «Οὐκ ἐπιθυμήσεις τὸν οἶκον τοῦ πλησίον σου, οὐδὲ τὸν βοῦν αὐτοῦ, οὐδὲ τὸν ὄνον αὐτοῦ» τοῖς μηδὲν περὶ τῶν γηίνων φροντίζουσιν, ἀλλὰ τοὺς οὐρανίους καρποὺς συνάγουσιν· καὶ οὐκ ἐρεῖ· «Ὀφθαλμὸν ἀντὶ ὀφθαλμοῦ καὶ ὀδόντα ἀντὶ ὀδόντος» (Ἔξ 21:24) τῷ μηδένα ἐχθρὸν ἑαυτοῦ λογιζομένῳ ἀλλὰ πάντας πλησίον· διὸ οὐδὲ τὰς χεῖρας εἰς ἐκδίκησιν ἐκτείνειν δύναται. Οὐδὲ δεκάτην ἀπαιτῆσαι ἔστιν ἀπὸ τοῦ πάντα τὰ ὑπάρχοντα αὐτοῦ τῷ θεῷ προσφέροντος καὶ πατέρα καὶ μητέρα καὶ πᾶσαν τὴν συγγένειαν καταλιπόντος καὶ τῷ λόγῳ τοῦ θεοῦ ἀκολουθήσαντος. Καὶ <mark>οὐκ ἐντέταλται ἡμέραν ἐν ἀναπαύσει καὶ σχολῇ διάγειν τῷ καθ' ἑκάστην ἡμέραν σαββατίζοντι, τουτέστιν ἐν τῷ ναῷ τοῦ θεοῦ, ὅ ἐστιν τὸ σῶμα τοῦ ἀνθρώπου, τὴν ἀξίαν λατρείαν τῷ θεῷ ἐπιτελοῦντι καὶ πᾶσαν ὥραν δικαιοσύνην ἐργαζομένῳ</mark>. Ἐγὼ γὰρ «ἔλεον θέλω καὶ οὐ θυσίαν», φησίν, «καὶ ἐπίγνωσιν θεοῦ ἢ ὁλοκαυτώματα»</strong> (Ωσ 6:6).</p></blockquote><p>(Απόδειξις του αποστολικού κηρύγματος)</p>
    <h2>Γ΄ αιώνας</h2><h3>Κυπριανός ο Καρχηδόνος, ιερομάρτυς (περ. 201-258)</h3><blockquote><p>CXIX. Βαρὺ ἦν <strong><mark>τὸ τοῦ νόμου ζυγόν, ὅπερ ἀπεθέμεθα</mark></strong>, καὶ ἐλαφρὸν τὸ ζυγὸν τοῦ Κυρίου, ὅπερ ἀνελάβομεν</p></blockquote><p>(Προς τους Ιουδαίους)</p>
    <h2>Δ΄ αιώνας</h2><h3>Σύνοδος της Λαοδικείας (360)</h3><blockquote><p>«Ὅτι <strong><mark>οὐ δεῖ χριστιανοὺς ἰουδαΐζειν</mark> καὶ ἐν τῷ σαββάτῳ ἀργεῖν, ἀλλ' ἐργάζεσθαι αὐτοὺς ἐν τῇ αὐτῇ ἡμέρᾳ</strong>· τὴν δὲ κυριακὴν προτιμῶντας, εἴ γε δύναιντο, σχολάζειν ὡς χριστιανοί. <strong>Εἰ δὲ εὑρεθεῖεν ἰουδαΐζοντες, ἔστωσαν ἀνάθεμα παρὰ Χριστῷ</strong>».</p></blockquote><p>(29ος κανόνας)</p><h3>Μακάριος ο Μέγας, ο Αιγύπτιος, όσιος (περ. 300-391)</h3><blockquote><p>«<strong><mark>Ἐκείνοις νόμος ἐδόθη ἐν πλαξὶ γεγραμμένος λιθίναις, ἡμῖν δὲ νόμοι πνευματικοὶ πλαξὶν ἐγγραφόμενοι καρδίας σαρκίναις</mark></strong>· λέγει γάρ· «διδοὺς νόμους μου ἐν καρδίαις αὐτῶν, καὶ ἐπὶ τὰς διανοίας αὐτῶν ἐπιγράψω αὐτούς» (<a href="https://bibleox.com/el/gr-lxx-byz/ier/38/#L33">Ιερ 38:33</a>). <strong><mark>Κἀκεῖνα μὲν πάντα καταργούμενα καὶ πρόσκαιρα, νῦν δὲ πάντα ἐξ ἀληθείας εἰς τὸν ἔσω ἄνθρωπον ἐπιτελούμενα</mark>. ∆ιαθήκη τε γὰρ ἔσωθεν καὶ πόλεμος ἔσωθεν, καὶ ἁπαξαπλῶς</strong> ὅσα ἐκείνοις συνέβη, «τυπικῶς» ἐγίνετο· «ἐγράφη δὲ πρὸς νουθεσίαν ἡμετέραν» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/10/#L11">Α Κορ 10:11</a>). τῷ γὰρ Ἀβραὰμ προεῖπεν ὁ θεὸς τὸ ἐσόμενον ὅτι «πάροικον ἔσται τὸ σπέρμα σου ἐν γῇ οὐκ ἰδίᾳ, καὶ κακώσουσι καὶ δουλώσουσιν αὐτὸ ἔτη τετρακόσια» (<a href="https://bibleox.com/el/gr-lxx-byz/gen/15/#L13">Γεν 15:13</a>). <strong>Τοῦτο ἐπλήρου τὴν τῆς σκιᾶς εἰκόνα.</strong>»</p><p>&lt;…&gt;</p><p>Ἐν τῷ νόμῳ ζῷα ἄλογα προσεφέροντο εἰς θυσίαν, καὶ εἰ μὴ ἐσφάζοντο, οὐκ ἦσαν δεκταὶ αἱ προσφοραί. καὶ νῦν ἐὰν μὴ σφαγῇ ἡ ἁμαρτία, οὐκ ἔστι δεκτὴ ἡ προσφορὰ παρὰ τῷ θεῷ καὶ ἀληθινή.</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/0paG_Ὁμιλίαι_πνευματικαὶ_50">Μακάριος ὁ Μέγας, Πνευματικαὶ ὁμιλίαι, ὁμιλία 47</a>)</p><h3>Ιωάννης ο Χρυσόστομος, ιεράρχης (περ. 347-407)</h3><blockquote><p>«Ὁ οὖν νόμος κατὰ τῶν ἐπαγγελιῶν τοῦ Θεοῦ; εἰ γὰρ ἐν τῷ σπέρματι τοῦ Ἀβραὰμ αἱ εὐλογίαι δέδονται, ὁ δὲ νόμος κατάραν εἰσάγει, ἄρα κατὰ τῶν ἐπαγγελιῶν τοῦ Θεοῦ. Πῶς οὖν λύει τὴν ἀντίθεσιν; Πρῶτον μὲν ἀπαγορεύει, εἰπών· Μὴ γένοιτο· ἔπειτα καὶ κατασκευάζει, οὕτω λέγων· Εἰ γὰρ ἐδόθη νόμος ὁ δυνάμενος ζωοποιῆσαι, ὄντως ἂν ἐκ νόμου ἦν ἡ δικαιοσύνη.</p><p>Ὃ δὲ λέγει, τοῦτό ἐστιν· Εἰ μὲν ἐν αὐτῷ, φησὶ, τὴν ἐλπίδα τῆς ζωῆς εἴχομεν, καὶ αὐτὸς ἦν ὁ τὸ κῦρος ἔχων τῆς ἡμετέρας σωτηρίας, ἴσως ταῦτα καλῶς ἔλεγες· <strong><mark>εἰ δὲ ἀπὸ πίστεως σώζει, κἂν ἐπικαταράτους ποιῇ, οὐδὲν ἐβλάβης ἐρχομένης ἐκείνης καὶ πάντα λυούσης</mark></strong><mark>. </mark><strong><mark>Εἰ μὲν γὰρ δι' ἐκείνου ἡ ἐπαγγελία, εἰκότως ἐδεδοίκεις μὴ τῆς δικαιοσύνης ἐκπέσῃς, ἐκπίπτων τοῦ νόμου</mark></strong>· εἰ δὲ διὰ τοῦτο ἐδόθη, ἵνα συγκλείσῃ πάντας, τουτέστιν, ἵνα ἐλέγξῃ, καὶ δείξῃ τὰ οἰκεῖα αὐτῶν πλημμελήματα, οὐ μόνον οὐ κωλύει σε τοῦ τυχεῖν τῆς ἐπαγγελίας, ἀλλὰ καὶ συμπράττει πρὸς τὸ τυχεῖν. Τοῦτο γοῦν δηλῶν ἔλεγεν· Ἀλλὰ συνέκλεισεν ἡ Γραφὴ τὰ πάντα ὑπὸ ἁμαρτίαν, ἵνα ἡ ἐπαγγελία ἐκ πίστεως Ἰησοῦ Χριστοῦ δοθῇ τοῖς πιστεύουσιν.</p><p><strong><mark>Ἐπειδὴ γὰρ Ἰουδαῖοι οὐδὲ τῶν ἁμαρτημάτων ᾐσθάνοντο τῶν οἰκείων, οἱ δὲ μὴ αἰσθανόμενοι, οὐδὲ ἀφέσεως ἐπεθύμουν, ἔδωκε τὸν νόμον ἐλέγχοντα τὰ τραύματα</mark></strong>, <strong><mark>ἵνα ποθήσωσι τὸν ἰατρόν</mark></strong>. Τὸ γὰρ, Συνέκλεισεν, ἤλεγξέν ἐστι, καὶ ἐλέγξας κατεῖχεν ἐν φόβῳ. Εἶδες ὅτι οὐ μόνον κατὰ τῶν ἐπαγγελιῶν τοῦ Θεοῦ οὐκ ἔστιν, ἀλλὰ καὶ ὑπὲρ τῶν ἐπαγγελιῶν ἐδόθη; Εἰ μὲν γὰρ ἑαυτῷ τὸ πρᾶγμα ἐξεδίκει καὶ τὴν αὐθεντίαν ὁ νόμος, καλῶς ταῦτα ἐλέγετο· εἰ δὲ ἑτέρῳ τρέχει, καὶ δι' ἐκεῖνον πάντα ἔπραττε, <strong>πῶς κατὰ τῶν ἐπαγγελιῶν τοῦ Θεοῦ; Εἰ γὰρ μὴ νόμος ἐδόθη, <mark>πάντες εἰς κακίαν ἐξώκειλαν, καὶ οὐδεὶς ἔμελλεν Ἰουδαίων ἔσεσθαι ὁ ἀκουσόμενος τοῦ Χριστοῦ</mark></strong>· νυνὶ δὲ δοθεὶς, δύο ταῦτα κατώρθωσεν, ἀρετὴν σύμμετρον παιδεύσας τοὺς προσέχοντας, καὶ πείσας εἰδέναι τὰ οἰκεῖα ἁμαρτήματα, ὃ μάλιστα αὐτοὺς ἐποίει προθυμοτέρους πρὸς τὸ ζητεῖν τὸν Υἱόν. Οἱ γοῦν μὴ πιστεύσαντες αὐτῷ, ἐκ τοῦ μὴ καταγνῶναι τῶν οἰκείων ἁμαρτημάτων, οὐκ ἐπίστευσαν.»</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/KHFl_%E1%BD%99%CF%80%CF%8C%CE%BC%CE%BD%CE%B7%CE%BC%CE%B1_%CE%B5%E1%BC%B0%CF%82_%CF%84%E1%BD%B4%CE%BD_%CF%80%CF%81%E1%BD%B8%CF%82_%CE%93%CE%B1%CE%BB%CE%AC%CF%84%CE%B1%CF%82_%E1%BC%90%CF%80%CE%B9%CF%83%CF%84%CE%BF%CE%BB%CE%AE%CE%BD">Υπόμνημα εις την προς Γαλάτας επιστολήν</a>)</p><blockquote><p>«Εἰ γὰρ ἃ κατέλυσα, ταῦτα πάλιν οἰκοδομῶ, παραβάτην ἐμαυτὸν συνίστημι». Ὅρα τοῦ Παύλου τὴν σύνεσιν. <strong>Ἐκεῖνοι δεῖξαι ἐβούλοντο, ὅτι ὁ μὴ τηρῶν τὸν νόμον, παραβάτης· οὗτος δὲ εἰς τοὐναντίον περιέτρεψε τὸν λόγον, δεικνὺς ὅτι <mark>ὁ τηρῶν τὸν νόμον, παραβάτης, οὐ τῆς πίστεως, ἀλλὰ καὶ αὐτοῦ τοῦ νόμου</mark></strong>. Ἃ γὰρ κατέλυσα, ταῦτα πάλιν οἰκοδομῶ, τὸν νόμον φησίν. Ὃ δὲ λέγει, τοιοῦτόν ἐστι· <strong><mark>πέπαυται ὁ νόμος, καὶ τοῦτο ὡμολογήσαμεν, δι' ὧν ἀφέντες αὐτὸν, κατεφύγομεν ἐπὶ τὴν ἐκ πίστεως σωτηρίαν. Ἂν τοίνυν φιλονεικήσωμεν στῆσαι αὐτὸν, αὐτῷ τούτῳ παραβάται γινόμεθα, τὰ παρὰ τοῦ Θεοῦ λυθέντα φιλονεικοῦντες τηρεῖν</mark></strong>». Εἶτα καὶ πῶς κατελύθη, δείκνυσιν. «Ἐγὼ γὰρ διὰ νόμου νόμῳ ἀπέθανον». ∆ιπλῆν ἔχει τοῦτο τὴν θεωρίαν· ἢ γὰρ νόμου τοῦ τῆς χάριτός φησιν· οἶδε γὰρ καὶ τοῦτον νόμον καλεῖν, ὡς ὅταν λέγῃ· Ὁ δὲ νόμος τοῦ Πνεύματος τῆς ζωῆς ἐλευθέρωσέ με· ἢ τὸν νόμον ἐνταῦθα τὸν παλαιὸν λέγει, δεικνὺς ὅτι δι' αὐτοῦ τοῦ νόμου τῷ νόμῳ ἀπέθανε· τουτέστιν· <strong><mark>Αὐτός με ὁ νόμος ἐνήγαγεν εἰς τὸ μηκέτι προσέχειν αὐτῷ</mark></strong><mark>. </mark><strong><mark>Εἰ τοίνυν μέλλοιμι αὐτῷ προσέχειν, καὶ αὐτὸν παραβαίνω</mark></strong>. Πῶς καὶ τίνι τρόπῳ; Μωϋσῆς φησι, Προφήτην ὑμῖν ἀναστήσει Κύριος ὁ Θεὸς ἐκ τῶν ἀδελφῶν ὑμῶν, ὡς ἐμέ· αὐτοῦ ἀκούσεσθε· περὶ τοῦ Χριστοῦ λέγων. Ὥστε οἱ μὴ τούτῳ πειθόμενοι, παραβαίνουσι τὸν νόμον.</p><p>&lt;…&gt;</p><p>Τῷ μὲν γὰρ εἰπεῖν, Χριστῷ συνεσταύρωμαι, τὸ βάπτισμα ᾐνίξατο· τῷ δὲ εἰπεῖν, Ζῶ δὲ οὐκέτι ἐγὼ, τὴν μετὰ ταῦτα πολιτείαν, δι' ἧς νεκροῦται ἡμῶν τὰ μέλη. <strong><mark>Τί δέ ἐστι, Ζῇ δὲ ἐν ἐμοὶ Χριστός; Οὐδὲν γίνεται, φησὶν, ὑπ' ἐμοῦ, ὧν ὁ Χριστὸς οὐ βούλεται</mark></strong>. Ὥσπερ γὰρ θάνατον λέγει οὐ τοῦτον τὸν κοινὸν, ἀλλὰ τὸν ἐκ τῶν ἁμαρτιῶν, οὕτω καὶ ζωὴν, τὴν ἐκείνων ἀπαλλαγήν· <strong>Θεῷ γὰρ οὐκ ἔστιν ἄλλως ζῇν, ἀλλ' ἢ νεκρωθέντα τῇ ἁμαρτίᾳ</strong>. Ὥσπερ οὖν ὁ Χριστὸς τὸν σωματικὸν ὑπέστη θάνατον, οὕτως ἐγὼ τὸν κατὰ τῆς ἁμαρτίας. Νεκρώσατε γὰρ τὰ μέλη ὑμῶν τὰ ἐπὶ τῆς γῆς, ἅτινά ἐστι πορνεία, ἀκαθαρσία, μοιχεία· παὶ πάλιν λέγει, Ὁ παλαιὸς ἡμῶν ἄνθρωπος ἐσταυρώθη· ὅπερ ἐν τῷ λουτρῷ γέγονε. Μετὰ δὲ ταῦτα <strong>ἐὰν μένῃς νεκρὸς τῇ ἁμαρτίᾳ, ζῇς τῷ Θεῷ</strong>· ἂν δὲ πάλιν αὐτὴν ἀναστήσῃς, ἐλυμήνω τῇ τοιαύτῃ ζωῇ. Ἀλλ' οὐχ ὁ Παῦλος τοιοῦτος, ἀλλ' ἔμενε δι' ὅλου νεκρός. Εἰ τοίνυν <strong><mark>ζῶ τῷ Θεῷ, φησὶν, ἑτέραν παρὰ τὴν ἐν τῷ νόμῳ ζωὴν, καὶ νεκρὸς ἐγενόμην τῷ νόμῳ, οὐδὲν τοῦ νόμου φυλάττειν δύναμαι</mark></strong>.</p><p>ηʹ. Καὶ ὅρα τὴν ἀκρίβειαν τῆς πολιτείας, καὶ θαύμασον μεθ' ὑπερβολῆς τὴν μακαρίαν ἐκείνην ψυχήν. Οὐ γὰρ εἶπε, Ζῶ ἐγὼ, ἀλλὰ, Ζῇ ἐν ἐμοὶ Χριστός. Τίς ταύτην τολμήσει ῥῆξαι τὴν φωνήν; Ἐπειδὴ γὰρ εὐήνιον ἑαυτὸν τῷ Χριστῷ κατεσκεύασε, καὶ ἅπαντα ἐξέβαλε τὰ βιωτικά, καὶ πρὸς τὸ θέλημα τὸ ἐκείνου πάντα ἔπραττεν, οὐκ εἶπε, Ζῶ τῷ Χριστῷ, ἀλλ', ὃ πολλῷ πλέον ἦν, Ζῇ δὲ ἐν ἐμοὶ Χριστός. Ὥσπερ γὰρ ἡ ἁμαρτία, ὅταν κρατήσῃ, αὕτη ἐστὶν ἡ ζῶσα, πρὸς ἃ βούλεται τὴν ψυχὴν ἄγουσα· οὕτως <strong>εἰ <mark>ἐκείνης νεκρωθείσης τὰ τῷ Χριστῷ δοκοῦντα γίνεται</mark>, οὐδὲ ἀνθρωπίνη λοιπόν ἐστιν ἡ τοιαύτη ζωὴ, αὐτοῦ ζῶντος ἐν ἡμῖν, τουτέστιν, ἐνεργοῦντος, κρατοῦντος</strong>.</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/KHFl_%E1%BD%99%CF%80%CF%8C%CE%BC%CE%BD%CE%B7%CE%BC%CE%B1_%CE%B5%E1%BC%B0%CF%82_%CF%84%E1%BD%B4%CE%BD_%CF%80%CF%81%E1%BD%B8%CF%82_%CE%93%CE%B1%CE%BB%CE%AC%CF%84%CE%B1%CF%82_%E1%BC%90%CF%80%CE%B9%CF%83%CF%84%CE%BF%CE%BB%CE%AE%CE%BD">Υπόμνημα εις την προς Γαλάτας επιστολήν</a>)</p><blockquote><p>«Καταλύσας τοίνυν ἐνταῦθα τὸν τῶν ἠθικῶν λόγον, ἐπὶ τὰ δόγματα ἐκβαίνει πάλιν, οὕτω λέγων· Ἢ ἀγνοεῖτε, ἀδελφοί; γινώσκουσι γὰρ νόμον λαλῶ. Ἐπειδὴ γὰρ εἶπεν, ὅτι ἀπεθάνομεν τῇ ἁμαρτίᾳ, δείκνυσιν ἐνταῦθα, ὅτι οὐ μόνον ἁμαρτία αὐτῶν οὐ κυριεύει, ἀλλ' <strong><mark>οὐδὲ νόμος</mark></strong>. Εἰ δὲ νόμος οὐ κυριεύει, πολλῷ μᾶλλον ἁμαρτία. Καὶ <strong>καταγλυκαίνων τὸν λόγον, ἀπὸ παραδείγματος ἀνθρωπίνου τοῦτο ποιεῖ φανερόν</strong>. Καὶ δοκεῖ μὲν ἕν τι λέγειν, δύο δὲ τίθησι τοῦ προκειμένου κατασκευὰς, μίαν μὲν, ὅτι <strong>ἀποθανόντος ἀνδρὸς, οὐχ ὑπόκειται γυνὴ νόμῳ τῷ τοῦ ἀνδρός, οὐδὲ ἔστιν ὁ κωλύων ἑτέρῳ γενέσθαι γυναῖκα· ἑτέραν δὲ, ὅτι ἐνταῦθα οὐ μόνον ὁ ἀνὴρ ἐτελεύτησεν, ἀλλὰ καὶ ἡ γυνή· ὥστε διπλῆς ἀπολαύειν τῆς ἐλευθερίας</strong>.</p><p>&lt;…&gt;</p><p>Ὁ γὰρ ἀποθανὼν, φησὶ, δεδικαίωται ἀπὸ τῆς ἁμαρτίας. <strong>Οὐκοῦν τοῖς ζῶσιν ὁ νόμος κεῖται, τοῖς δὲ τεθνηκόσιν οὐκέτι διατάττεται</strong>. Ὁρᾷς πῶς διπλῆν τὴν ἐλευθερίαν ἐδήλωσεν;</p><p>&lt;…&gt;</p><p>Εἶτα τὸ συμπέρασμα οὐ κατὰ τὴν πρότασιν ἐπάγει· τὸ γὰρ ἀκόλουθον ἦν εἰπεῖν· Ὥστε, ἀδελφοί μου, <strong>οὐ κυριεύσει ὑμῶν ὁ νόμος· ἀπέθανε γάρ</strong>. Ἀλλ' οὐκ εἶπεν οὕτως, ἀλλ' ἐν μὲν τῇ προτάσει τοῦτο ᾐνίξατο· ἐν δὲ τῇ ἐπαγωγῇ λοιπὸν, ὥστε ἀνεπαχθῆ ποιῆσαι τὸν λόγον, τὴν γυναῖκα εἰσάγει τετελευτηκυῖαν, λέγων· Ὥστε, ἀδελφοί μου, καὶ ὑμεῖς ἐθανατώθητε τῷ νόμῳ. Ὅταν γὰρ καὶ τοῦτο κἀκεῖνο γενόμενον τὴν αὐτὴν ἐλευθερίαν παρέχῃ, τί κωλύει χαρίσασθαι τῷ νόμῳ, τοῦ πράγματος μηδὲν παραβλαπτομένου; Ἡ γὰρ ὕπανδρος γυνὴ τῷ ζῶντι ἀνδρὶ δέδεται νόμῳ. Ποῦ νῦν εἰσιν οἱ τὸν νόμον διαβάλλοντες; Ἀκουέτωσαν πῶς καὶ εἰς ἀνάγκην ἐμπεσὼν, οὐ καθαιρεῖ αὐτοῦ τὸ ἀξίωμα, ἀλλὰ μεγάλα περὶ τῆς ἐξουσίας αὐτοῦ διαλέγεται, εἴ γε ζῶντος αὐτοῦ, <strong>δέδεται ὁ Ἰουδαῖος, καὶ μοιχοὶ χρηματίζουσιν οἱ παραβαίνοντες καὶ ἀφιέντες αὐτὸν</strong> ζῶντα· <strong>εἰ δὲ τελευτήσαντα εἴασεν, οὐδὲν θαυμαστόν· καὶ γὰρ ἐπ' ἀνθρώπων οὐ διαβάλλεται ὁ τοῦτο ποιῶν</strong>. Ἐὰν δὲ ἀποθάνῃ ὁ ἀνήρ, κατήργηται ἀπὸ τοῦ νόμου τοῦ ἀνδρός.</p><p>γʹ. Εἶδες πῶς ἐν τῷ παραδείγματι <strong>τὸν νόμον δείκνυσι τετελευτηκότα</strong>; Ἀλλ' οὐκ ἐν τῇ ἐπαγωγῇ τοῦτο ποιεῖ. Ἄρα οὖν ζῶντος τοῦ ἀνδρὸς, μοιχαλὶς χρηματίζει ἡ γυνή. Ὅρα πῶς ἐνδιατρίβει ταῖς κατηγορίαις τῶν τὸν νόμον παραβαινόντων ζῶντα. Ἐπεὶ δὲ αὐτὸν ἔπαυσε, λοιπὸν <strong><mark>μετὰ ἀσφαλείας ἁπάσης αὐτὸν χαρίζεται τῇ πίστει</mark></strong>, οὐδὲν παραβλάπτων ἐντεῦθεν. Ζῶντος γὰρ, φησὶ, τοῦ ἀνδρὸς, μοιχαλὶς χρηματίσει ἡ γυνὴ, ἐὰν γένηται ἀνδρὶ ἑτέρῳ. Ὥστε, ἀδελφοί μου, καὶ ὑμεῖς. Ἀκόλουθον ἦν εἰπεῖν· Τοῦ νόμου τελευτήσαντος, οὐ κρίνεσθε μοιχείας, ἀνδρὶ γενόμενοι ἑτέρῳ. Ἀλλ' οὐκ εἶπεν οὕτως, ἀλλὰ πῶς; Ἐθανατώθητε τῷ νόμῳ. <strong><mark>Εἰ νεκροὶ γεγόνατε, οὐκ ἐστὲ ὑπὸ τὸν νόμον</mark></strong>.</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/WPeS_%CE%9B%CF%8C%CE%B3%CE%BF%CE%B9_%CE%B5%E1%BC%B0%CF%82_%CF%84%E1%BD%B4%CE%BD_%CF%80%CF%81%E1%BD%B8%CF%82_%E1%BF%AC%CF%89%CE%BC%CE%B1%CE%AF%CE%BF%CF%85%CF%82_%E1%BC%90%CF%80%CE%B9%CF%83%CF%84%CE%BF%CE%BB%CE%AE%CE%BD_1">Ομιλίαι εις την προς Ρωμαίους επιστολήν</a>)</p><h3>Θεοδώρητος ο Κύρου, μακάριος (περ. 386-457)</h3><blockquote><p>««Ξένας» ἐκάλεσεν ὁ Ἀπόστολος τὰς διδασκαλίας τὰς ἐναντίας τῷ εὐαγγελίῳ. Διὸ κελεύει αὐτοὺς ἐμμένειν τῇ διδασκαλίᾳ τῆς χάριτος καὶ <strong>καταλιπεῖν τὰς ὑπονομικὰς παρατηρήσεις</strong>. Οὐδεὶς γάρ, φησίν, ἐξ ἐκείνων ὠφελήθη.»</p></blockquote><p>(Ερμηνεία εις την προς Εβραίους επιστολήν)</p><p>Α Τιμ 1:8 — Ο νόμος καλός, εάν τις αὐτῷ νομίμως χρῆται:</p><blockquote><p>Οὐ τὸν νόμον αἰτιῶμαι, ἀλλὰ τοὺς πονηροὺς διδασκάλους τοῦ νόμου. Οἶδα γὰρ ὅτι <strong><mark>ὁ νόμος ὠφέλιμος</mark></strong> τοῖς βουληθεῖσι φυλάξαι τὸν σκοπὸν τοῦ νόμου. Τοῦτο σημαίνει τὸ «νομίμως αὐτῷ χρῆται», τουτέστιν <strong><mark>εἰ τίς ἀκολουθεῖ τῷ σκοπῷ αὐτοῦ</mark></strong>. <strong><mark>Ὁ δὲ σκοπὸς τοῦ νόμου ἦν ἀγαγεῖν ἡμᾶς πρὸς τὸν Δεσπότην Χριστόν, καὶ ἐλθόντος αὐτοῦ ὁ νόμος οὐκέτι ἰσχύει</mark></strong>. Τοῦτο εἶπεν ὁ Ἀπόστολος καὶ ἐν τῇ πρὸς Γαλάτας ἐπιστολῇ· «Ἀγὼ γὰρ διὰ νόμου νόμῳ ἀπέθανον, ἵνα Θεῷ ζήσω» (Γαλ 2:19). Νόμῳ γάρ, φησίν, ὑπακούων, οὐ τηρῶ τὸν νόμον.</p></blockquote><p>(Ερμηνεία εις την Α΄ προς Τιμόθεον επιστολήν)</p><h3>Εφραίμ ο Σύρος, όσιος (περ. 306-373)</h3><p>Α Τιμ 1:8 — Ο νόμος καλός, εάν τις αὐτῷ νομίμως χρῆται:</p><blockquote><p>Ἡμεῖς δὲ <strong>ἴσμεν ὅτι καλὸς ὁ νόμος, ἐάν τις αὐτῷ νομίμως χρῆται, τουτέστιν ἐὰν τις εἰδῇ τὸν καιρὸν αὐτοῦ (τὸν τεταγμένον αὐτῷ)</strong> καὶ νοῇ τὰ ἀληθινὰ μυστήρια τὰ ἐν τοῖς τύποις αὐτοῦ ἐγγεγραμμένα.</p></blockquote><p>(Ερμηνεία εις την Α΄ προς Τιμόθεον επιστολήν)</p>
    <h2>Η΄ αιώνας</h2>
    <h3>Ιωάννης ο Δαμασκηνός, όσιος<strong> </strong>(β΄ μισό του Ζ΄ αι. – έως το 754)</h3>
    <blockquote><p>Εἰδὼς ὁ Θεὸς τὸ παχύ τε καὶ φιλόσαρκον καὶ πρὸς τὴν ὕλην ὅλως ἐπιρρεπὲς τοῦ Ἰσραηλίτου λαοῦ, ἅμα δὲ καὶ τὸ ἀδιάκριτον· πρῶτον μέν, «ἵνα ὁ δοῦλος καὶ τὸ ὑποζύγιον ἀναπαύσηται», ὡς γέγραπται· ἐπειδὴ ἀνὴρ «δίκαιος οἰκτείρει ψυχὰς κτηνῶν αὐτοῦ», ἅμα δὲ ἵνα καὶ σχολὴν ἄγοντες ἐκ τοῦ περὶ τὴν ὕλην περισπασμοῦ πρὸς Θεὸν συνάγωνται «ἐν ψαλμοῖς καὶ ὕμνοις καὶ ᾠδαῖς πνευματικαῖς» καὶ μελέτῃ τῶν θείων Γραφῶν ἅπασαν τὴν ἑβδόμην ἀναλίσκοντες καὶ ἐν τῷ Θεῷ καταπαύοντες. <strong>Ὅτε μὲν γὰρ οὐκ ἦν νόμος, οὐ Γραφὴ θεόπνευστος, οὐδὲ τὸ Σάββατον Θεῷ ἀφιέρωτο. Ὅτε δὲ ἡ θεόπνευστος Γραφὴ διὰ Μωσέως ἐδόθη, ἀφιερώθη τῷ Θεῷ τὸ Σάββατον, ὡς ἂν περὶ τὴν ταύτης μελέτην ἐν αὐτῷ ἀδολεσχήσωσιν οἱ μὴ πάντα τὸν βίον τῷ Θεῷ ἀφιεροῦντες, οἱ μὴ πόθῳ τῷ Δεσπότῃ ὡς Πατρὶ δουλεύοντες, ἀλλ᾿ ὡς δοῦλοι ἀγνώμονες,</strong> κἂν μικρὸν καὶ ἐλάχιστον μέρος τῆς ἑαυτῶν ζωῆς τῷ Θεῷ ἀποτέμωνται, καὶ τοῦτο φόβῳ τῶν ἐπὶ τῇ παραβάσει εὐθυνῶν καὶ ἐπιτιμήσεων· «δικαίῳ γὰρ νόμος οὐ κεῖται», ἀλλ᾿ ἀδίκοις. Ἐπεὶ πρῶτος Μωσῆς τεσσαράκοντα ἡμερῶν καὶ αὖθις ἑτέρων τεσσαράκοντα νηστείᾳ <strong>προσεδρεύσας τῷ Θεῷ, πάντως καὶ τοῖς Σάββασι διὰ τῆς νηστείας ἐκάκου ἑαυτόν, τοῦ νόμου μὴ κακοῦν ἑαυτοὺς ἐν τῇ τοῦ Σαββάτου ἡμέρᾳ προστάσσοντος</strong>. Εἰ δὲ φαῖεν, ὅτι πρὸ τοῦ νόμου τοῦτο, τί φήσουσι περὶ <strong>τοῦ Θεσβίτου Ἡλιοῦ τεσσαράκοντα ἡμερῶν ὁδὸν ἀνύσαντος ἐν βρώσει μιᾷ</strong>; Οὗτος γὰρ οὐ μόνον διὰ τῆς νηστείας, ἀλλὰ καὶ διὰ τῆς ὁδοιπορίας ἐν τοῖς Σάββασι τῶν τεσσαράκοντα ἡμερῶν ἑαυτὸν κακώσας ἔλυσε τὸ Σάββατον· καὶ οὐκ ὠργίσθη τούτῳ ὁ τὸν νόμον δεδωκώς, ἀλλὰ καὶ ὡς ἀρετῆς ἔπαθλον ἐν Χωρὴβ ἑαυτὸν ἐνεφάνισε. Τί δὲ περὶ <strong>Δανιὴλ φήσουσιν; Οὐχὶ τρεῖς ἑβδομάδας διετέλεσεν ἄσιτος</strong>; Τί δὲ πᾶς Ἰσραήλ; Οὐ περιτέμνει τὸ παιδίον ἐν Σαββάτῳ, εἰ τύχοι, ὀκταήμερον; Οὐχὶ δὲ καὶ τὴν μεγάλην νηστείαν, ἣν νενομοθέτηνται, εἰ ἐν Σαββάτῳ καταντήσοι, νηστεύουσι; Οὐχὶ δὲ καὶ οἱ ἱερεῖς καὶ οἱ Λευῖται ἐν τοῖς τῆς σκηνῆς ἔργοις βεβηλοῦσι τὸ Σάββατον καὶ ἀναίτιοί εἰσιν; Ἀλλὰ καὶ κτῆνος, ἂν εἰς βόθρον ἐμπέσοι ἐν Σαββάτῳ, ὁ μὲν ἀνασπάσας ἀναίτιος, ὁ δὲ παριδὼν κατάκριτος. Τί δὲ πᾶς Ἰσραήλ; Οὐχὶ ἑπτὰ ἡμέρας τὴν τοῦ Θεοῦ κιβωτὸν περιφέροντες τὰ Ἱεριχούντια τείχη περιῄεσαν, ἐν αἷς πάντως ἦν καὶ τὸ σάββατον;</p><p>Ὡς οὖν ἔφην, <strong><mark>σχολῆς ἕνεκα τῆς πρὸς Θεόν, ἵνα κἂν σμικροτάτην ἀπόμοιραν αὐτῷ ἀπονέμωσι καὶ ἀναπαύσωνται ὅ τε δοῦλος καὶ τὸ ὑποζύγιον, ἡ τοῦ Σαββάτου τήρησις ἐπινενόητο τοῖς νηπίοις ἔτι</mark></strong> καὶ ὑπὸ τὰ στοιχεῖα τοῦ κόσμου δεδουλωμένοις, <strong><mark>τοῖς σαρκικοῖς καὶ μηδὲν ὑπὲρ τὸ σῶμα καὶ τὸ γράμμα ἐννοῆσαι δυναμένοις</mark></strong>. «Ὅτε δὲ ἦλθε τὸ πλήρωμα τοῦ χρόνου, ἐξαπέστειλεν ὁ Θεὸς τὸν Υἱὸν αὐτοῦ τὸν μονογενῆ, γενόμενον ἐκ γυναικὸς ἄνθρωπον, γενόμενον ὑπὸ νόμον, ἵνα τοὺς ὑπὸ νόμον ἐξαγοράσῃ, ἵνα τὴν υἱοθεσίαν ἀπολάβωμεν». Ὅσοι γὰρ ἐλάβομεν αὐτόν, ἔδωκεν ἡμῖν ἐξουσίαν τέκνα Θεοῦ γενέσθαι, τοῖς πιστεύουσιν εἰς αὐτόν. Ὥστε οὐκέτι ἐσμὲν δοῦλοι ἀλλ᾿ υἱοί, οὐκέτι ὑπὸ νόμον ἀλλ᾿ <strong><mark>ὑπὸ χάριν· οὐκέτι μερικῶς τῷ Κυρίῳ δουλεύοντες ἐκ φόβου, ἀλλὰ πάντα τὸν τῆς ζωῆς χρόνον αὐτῷ ἀνατιθέναι ὀφείλοντες καὶ ἀεὶ τὸν δοῦλον, τὸν θυμὸν λέγω καὶ τὴν ἐπιθυμίαν, ἀπὸ τῆς ἁμαρτίας καταπαύοντες καὶ τῷ Θεῷ σχολάζειν ἐπιτρέποντες· τὴν μὲν ἐπιθυμίαν ἅπασαν ἀεὶ πρὸς Θεὸν ἀνατείνοντες, τὸν δὲ θυμὸν κατὰ τῶν τοῦ Θεοῦ δυσμενῶν καθοπλίζοντες· καὶ τὸ ὑποζύγιον, ἤτοι τὸ σῶμα, ὁμοίως τῆς μὲν δουλείας τῆς ἁμαρτίας ἀναπαύοντες, ταῖς δὲ θείαις ἐντολαῖς ἐξυπηρετεῖσθαι προτρέποντες</mark></strong>.</p><p>Ταῦτα ὁ πνευματικὸς ἡμῖν ἐντέλλεται τοῦ Κυρίου νόμος, καὶ οἱ τοῦτον φυλάσσοντες ὑπέρτεροι τοῦ Μωσαϊκοῦ νόμου γεγόνασιν· <strong><mark>ἐλθόντος γὰρ τοῦ τελείου τὸ ἐκ μέρους κατήργηται</mark></strong>, <strong><mark>καὶ τοῦ καλύμματος τοῦ νόμου, ἤτοι τοῦ καταπετάσματος, διὰ τῆς τοῦ Σωτῆρος διαρραγέντος σταυρώσεως καὶ τοῦ Πνεύματος πυρίναις γλώσσαις ἐκλάμψαντος τὸ γράμμα κατήργηται, τὰ σωματικὰ πέπαυται καὶ</mark> <u><mark>ὁ τῆς δουλείας νόμος πεπλήρωται</mark></u><mark> καὶ νόμος ἐλευθερίας ἡμῖν δεδώρηται</mark></strong>. Καὶ ἑορτάζομεν τὴν τελείαν τῆς ἀνθρωπίνης φύσεως κατάπαυσιν, φημὶ δὴ τὴν τῆς ἀναστάσεως ἡμέραν, ἐν ᾗ ἡμᾶς ὁ Κύριος Ἰησοῦς, ὁ τῆς ζωῆς ἀρχηγὸς καὶ Σωτήρ, εἰς τὴν ἐπηγγελμένην τοῖς πνευματικῶς τῷ Θεῷ λατρεύουσι κληρουχίαν εἰσήγαγεν, εἰς ἣν αὐτὸς πρόδρομος ἡμῶν εἰσῆλθεν, ἀναστὰς ἐκ νεκρῶν καὶ ἀνοιγέντων αὐτῷ τῶν οὐρανίων πυλῶν ἐν δεξιᾷ τοῦ Πατρὸς κεκάθικε σωματικῶς, ἔνθα καὶ οἱ τὸν πνευματικὸν τηροῦντες νόμον εἰσελεύσονται.</p></blockquote>
    <p>(<a href="https://bibleox.com/grc/grc/w/JCZw_%E1%BC%9C%CE%BA%CE%B4%CE%BF%CF%83%CE%B9%CF%82_%E1%BC%80%CE%BA%CF%81%CE%B9%CE%B2%E1%BD%B4%CF%82_%CF%84%E1%BF%86%CF%82_%E1%BD%80%CF%81%CE%B8%CE%BF%CE%B4%CF%8C%CE%BE%CE%BF%CF%85_%CF%80%CE%AF%CF%83%CF%84%CE%B5%CF%89%CF%82__%CE%92%CE%B9%CE%B2%CE%BB%CE%AF%CE%BF_%CE%94#HH-%CE%9A%CE%95%CE%A6%CE%91%CE%9B%CE%91%CE%99%CE%9FN-96-%CE%9A%CE%B1%CF%84%E1%BD%B0-%E1%BC%B8%CE%BF%CF%85%CE%B4%CE%B1%CE%AF%CF%89%CE%BD-%CF%80%CE%B5%CF%81%E1%BD%B6-%CF%84%CE%BF%E1%BF%A6-%CE%A3%CE%B1%CE%B2%CE%B2%CE%AC%CF%84%CE%BF%CF%85">Έκδοσις ακριβής της ορθοδόξου πίστεως, κεφάλαιο 96 (23). Κατά Ιουδαίων περί του Σαββάτου</a>)</p>
    <h3>Ζ΄ Οικουμενική Σύνοδος (787)</h3>
    <blockquote><p>Ἐπειδὴ πλανώμενοί τινες ἐκ τῆς τῶν Ἑβραίων θρησκείας, μυκτηρίζειν ἔδοξαν Χριστὸν τὸν Θεὸν ἡμῶν, προσποιούμενοι μὲν χριστιανίζειν, <strong><mark>αὐτὸν δὲ ἀρνούμενοι κρύβδην, καὶ λαθραίως σαββατίζοντες, καὶ ἕτερα Ἰουδαϊκὰ ποιοῦντες</mark></strong>· ὁρίζομεν τούτους, μήτε εἰς κοινωνίαν, μήτε εἰς εὐχήν, μήτε εἰς ἐκκλησίαν δέχεσθαι, ἀλλὰ φανερῶς εἶναι κατὰ τὴν ἑαυτῶν θρησκείαν Ἑβραίους, καὶ μήτε τοὺς παῖδας αὐτῶν βαπτίζειν, μήτε δοῦλον ὠνεῖσθαι, ἢ κτᾶσθαι. Εἰ δὲ ἐξ εἰλικρινοῦς πίστεως ἐπιστρέψει τις αὐτῶν, καὶ ὁμολογήσει ἐξ ὅλης καρδίας, θριαμβεύων τὰ κατ᾿ αὐτοὺς ἔθη καὶ πράγματα, πρὸς τὸ καὶ ἄλλους ἐλεγχθῆναι καὶ διορθώσασθαι, τοῦτον προσδέχεσθαι, καὶ βαπτίζειν, καὶ τοὺς παῖδας αὐτοῦ, καὶ ἀσφαλίζεσθαι αὐτοὺς ἀποστῆναι τῶν Ἑβραϊκῶν ἐπιτηδευμάτων· εἰ δὲ μὴ οὕτως ἔχοιεν, μηδαμῶς αὐτοὺς προσδέχεσθαι.</p></blockquote>
    <p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%B5%CF%81%CE%BF%CE%AF_%CE%9A%CE%B1%CE%BD%CF%8C%CE%BD%CE%B5%CF%82_%CF%84%CF%89%CE%BD_%CE%91%CE%B3%CE%AF%CF%89%CE%BD_%CE%9F%CE%B9%CE%BA%CE%BF%CF%85%CE%BC%CE%B5%CE%BD%CE%B9%CE%BA%CF%8E%CE%BD%CE%A3%CF%85%CE%BD%CF%8C%CE%B4%CF%89%CE%BD#HH6-%CE%9A%CE%B1%CE%BD%E1%BD%BC%CE%BD-%CE%97">Κανόνας 8</a>)</p>
    <h2>ΙΘ΄ αιώνας</h2>
    <h3>Θεοφάνης ο Έγκλειστος, ιεράρχης (1815-1894)</h3>
    <blockquote>
    <p>Μὲ τὸν στίχο αὐτὸν δὲν προστίθεται τίποτε στὴν ἐκφρασμένη σκέψη, ἀλλὰ δίνεται μόνο ἕνα ἐπεξηγηματικὸ παράδειγμα τῆς λατρείας τῶν στοιχείων, τῆς δουλείας στὰ στοιχεῖα.</p>
    <p><em>Ἡμέρες παρατηρεῖτε</em> — <strong>παρατηρεῖτε θρησκευτικὰ τὶς <em>ἡμέρες</em>, λόγου χάριν τὸ σάββατο, τοὺς <em>μῆνες</em> — τὴ νουμηνία, τοὺς <em>καιρούς</em> — τὶς πολυήμερες γιορτές, ὅπως εἶναι τὸ Πάσχα, ἡ γιορτὴ τῶν σκηνῶν, ποὺ κι αὐτὴ θυμίζει τὶς ἐποχὲς τοῦ χρόνου, — τὰ <em>ἔτη</em>, τὸ σαββατικὸ ἔτος ἢ τὸ ἰωβηλαῖο τῶν πενήντα ἐτῶν</strong>.</p>
    <p>Γιατὶ ἄγγιξε ὁ Ἀπόστολος μόνο τοὺς καιροὺς ποὺ τιμῶνται θρησκευτικὰ καὶ ὄχι κάτι ἄλλο; Ἢ ἐπειδὴ μὲ αὐτοὺς τοὺς καιροὺς καθορίζεται καὶ ὅλα τὰ ὑπόλοιπα· ἔτσι ὥστε, λέγοντας αὐτό, ὁ Ἀπόστολος εἶπε κατὰ κάποιον τρόπο: <strong>παρατηρεῖτε τὶς ἡμέρες καὶ βεβαίως ὅλα ὅσα συνδέονται μὲ τὴν τιμὴ τους, δηλαδὴ ὁλόκληρο τὸν νόμο</strong>. Ἢ ἐπειδὴ οἱ Γαλάτες, κλίνοντας πρὸς τὸν ἰουδαϊσμό, ἄρχισαν πρὸς τὸ παρὸν νὰ παρατηροῦν μόνο τὶς ἡμέρες, χωρὶς νὰ ἀγγίξουν τὰ ὑπόλοιπα. Μὲ τὰ λόγια αὐτὰ καθορίζεται τὸ μέτρο τῆς ἀποπλάνησης, στὸ ὁποῖο εἶχαν ἤδη ἐπιτύχει οἱ ἀποπλανητές. Ἡ περιτομὴ δὲν εἶχε ἀκόμη γίνει δεκτή· ἔλειψε ἀπὸ τοὺς Γαλάτες τὸ θάρρος νὰ δεχτοῦν καὶ κάτι ἄλλο. Ἡ τήρηση ὅμως τῶν καιρῶν δὲν παρουσίαζε μεγάλες δυσκολίες. Γι᾿ αὐτὸ καὶ ἔγινε δεκτή. Ἂν καὶ οἱ Γαλάτες κατάφεραν, ἴσως, νὰ ἀποδώσουν ἰουδαϊκὴ θρησκευτικὴ τιμὴ μόνο στὰ σάββατα καὶ στὶς νουμηνίες ἢ σὲ κάποια ἄλλη γιορτὴ ποὺ τοὺς βόλευε· ὁ Ἀπόστολος ὅμως ἀπαριθμεῖ ἤδη ὁλόκληρο τὸν κύκλο τῶν ἰουδαϊκῶν καιρῶν ποὺ τιμῶνται θρησκευτικά.</p>
    <p>Ὁ μακάριος Ἱερώνυμος ρωτᾷ ἐδῶ: μὰ καὶ οἱ χριστιανοὶ δὲν ἔχουν τὶς δικὲς τους ἡμέρες, τὶς ὁποῖες τιμοῦν; Τὶ λοιπόν; Ὑπόκεινται καὶ αὐτοὶ στὴν ἴδια μομφή; Καὶ ἀπαντᾷ: <strong><mark>στοὺς χριστιανοὺς ὅλα εἶναι πνευματικά, καὶ ὅλα τελοῦνται ἐν πνεύματι ἐλευθερίας</mark></strong>.</p>
    <p>Ἂς προσθέσουμε σὲ αὐτὸ ὅτι οἱ χριστιανοὶ δὲν ἔχουν μόνο ἡμέρες ποὺ τιμῶνται θρησκευτικά, ἀλλὰ καὶ τὶς δικὲς τους ἱερὲς τελετές, καὶ δικὰ τους ἱερὰ πρόσωπα καὶ δικοὺς τους τόπους λατρείας. Καὶ ὅλα ὅσα ἀνάγονται σὲ αὐτὰ καθορίζονται ἀπὸ τὸ Τυπικό. Δὲν εἶναι αὐτὸ δεσμός, δεσμά, δουλεία; <strong>Ὅλα αὐτὰ ὑπάρχουν στοὺς χριστιανούς, γιατὶ χωρὶς τὸ ἐξωτερικὸ δὲν μπορεῖ νὰ ὑπάρξει ἡ ἔκφραση τῶν εὐλαβῶν μας σχέσεων πρὸς τὸν Θεό</strong>· εἴτε ἕνας χύνει μπροστὰ στὸν Θεὸ τὴν ψυχὴ του, εἴτε πολλοὶ συγκεντρώνονται γι᾿ αὐτὸ σὲ ἕναν τόπο — τοὺς ναούς. Καὶ <strong><mark>ὁ ἅγιος ἀπόστολος Παῦλος ἀπέρριπτε ὅλους τοὺς ἐξωτερικοὺς ἰουδαϊκοὺς θεσμοὺς</mark></strong> ὄχι γιατὶ τίποτε τὸ ἐξωτερικὸ δὲν εἶναι πιὰ ἀναγκαῖο στὸν χριστιανισμό, ἀλλὰ γιατὶ ἡ ἰουδαϊκὴ ἐξωτερικότητα δὲν ἀνταποκρινόταν πιὰ στὸ πνεῦμα τῆς νέας ἐν Χριστῷ πίστης, γι᾿ αὐτὸ καὶ <strong>ἔπρεπε νὰ ἀπορριφθεῖ</strong>. Ὁ ἅγιος Παῦλος, ὅπως καὶ ὅλοι οἱ Ἀπόστολοι, ἀπορρίπτοντας τὴν ἰουδαϊκὴ λατρεία τῶν στοιχείων, εἰσήγαγε παντοῦ τὴ δικὴ του χριστιανική — λατρεία λογική, νοερή, πνευματική. Ἡ προτύπωση ὅλης τῆς ἐξωτερικῆς μας τάξης δόθηκε ἀπὸ τοὺς Ἀποστόλους· οἱ λεπτομέρειες καθορίστηκαν ἀργότερα: ὁ χρόνος τὶς ἀγίασε. Νὰ λοιπὸν τὸ Τυπικό!</p>
    <p>Κι ὅμως αὐτὸ εἶναι δεσμός· ποῦ εἶναι λοιπὸν ἡ χριστιανικὴ ἐλευθερία; Ἐδῶ εἶναι. Τὸ Τυπικό, ἂν καὶ ὁρίζει: ἔτσι κι ἔτσι νὰ ἐνεργεῖς, δὲν λέει ὅτι, ἐκτελώντας τὰ πάντα κατὰ τὸ γραμμένο, τελείωσες τὸ ἔργο σου καὶ ἀρκεῖ. Ἀντίθετα, <strong><mark>προστάζει νὰ μπαίνεις στὸ πνεῦμα τοῦ θεσπισμένου, γιὰ νὰ ἐνεργεῖς ἀπὸ τὸ πνεῦμα, σὰν ἀπὸ τὸν ἑαυτὸ σου, μὲ τὸν νοῦ σου, μὲ τὴ θέλησή σου καί, ἑπομένως, ἐλεύθερα</mark></strong>. Ἡ ἐξωτερικὴ ἐνέργεια εἶναι μία, ἀληθινά, δεσμὸς καὶ δεσμά· ὅταν ὅμως ἐκεῖνο γιὰ τὸ ὁποῖο θεσπίστηκε αὐτὴ ἡ ἐνέργεια γίνει δεκτὸ ἀπὸ τὸν νοῦ καὶ τὴν καρδιά, τότε ἡ ἐνέργεια παύει νὰ δεσμεύει — ἀναπτύσσεται ἐλεύθερα ἀπὸ τὸ πνεῦμα. Καὶ ὅλη ἡ χριστιανικὴ μας ἐξωτερικότητα βγῆκε ἀπὸ τὸ πνεῦμα. Ὁ ἰουδαϊσμὸς πήγαινε ἀπὸ τὸ ἐξωτερικὸ πρὸς τὸ ἐσωτερικό. Ὁ χριστιανισμὸς ξεκινᾶ ἀπὸ μέσα καὶ ντύνεται μὲ ὡραία ἐξωτερικότητα, ὅπως τὸ γεμάτο ζωὴ φυτὸ ντύνεται μὲ φύλλα καὶ ἄνθη. Τὸ ὅτι ὅλα αὐτὰ σταθεροποιήθηκαν σὲ ὁρισμένη μορφὴ δὲν ἐμποδίζει τὸ πρᾶγμα νὰ εἶναι σὲ κάθε τόπο καὶ σὲ κάθε πρόσωπο ζωντανό, βγαλμένο ἀπὸ τὸ πνεῦμα, ἐλεύθερο. Πρέπει μόνο νὰ κρατᾶς ἕναν νόμο: μπὲς στὸ πνεῦμα τοῦ θεσπισμένου, ἐξοικείωσέ το μὲ τὸν νοῦ καὶ τὴν καρδιά, καί, ἐκτελώντας το πάντα, θὰ ἐνεργεῖς ἀπὸ τὸν ἑαυτὸ σου ἐλεύθερα, χωρὶς νὰ νιώθεις κανέναν δεσμὸ ἀπὸ τὴν ἐξωτερικότητα.</p>
    <p>Ἔτσι τὸ Τυπικὸ δὲν δεσμεύει τὴ χριστιανικὴ ἐλευθερία, ὑποχρεώνοντας νὰ ἐκτελοῦμε ὅλα τὰ τοῦ Τυπικοῦ ἐν πνεύματι. Ἀλλὰ δὲν δεσμεύει, γιατὶ στὶς χριστιανικὲς ἐξωτερικὲς ἀκολουθίες δὲν ὑπάρχει τίποτε γιὰ τὸ ὁποῖο, ὅπως γιὰ τὶς ἰουδαϊκὲς τελετές, θὰ μποροῦσε κανεὶς νὰ πεῖ: μὴ ἀγγίξεις, μὴ γευτεῖς, μὴ ψαύσεις, ἐκτὸς ἀπὸ τὴν ἀμετάβλητη μορφὴ τῶν ἑπτὰ θείων μυστηρίων. <strong>Ἔχουμε τὸ ἐξωτερικό, γιατὶ χωρὶς τὸ ἐξωτερικὸ δὲν μποροῦμε νὰ ὑπάρξουμε ὡς ἄνθρωποι</strong>. Τιμοῦμε μὲ εὐλάβεια τὶς καθιερωμένες ἐξωτερικὲς τάξεις, γιατὶ εἶναι ἁγιασμένες ἀπὸ τὴν ἀρχαιότητα καὶ ἔδωσαν μαρτυρία τῆς ἀξίας ἢ τῆς σκοπιμότητάς τους μὲ τὸ ὅτι μόρφωσαν καὶ ὁδήγησαν στὰ οὐράνια σκηνώματα τόσους χοροὺς ἁγίων. Ἀλλὰ ταυτόχρονα <strong><mark>οἱ καθιερωμένες σὲ ἐμᾶς τάξεις δὲν εἶναι τέτοιες, ὥστε ἡ Ἐκκλησία νὰ εἶναι δεμένη μὲ αὐτὲς ὡς μὲ δεσμὰ δουλείας, καὶ νὰ μὴν μπορεῖ τίποτε σὲ αὐτὲς οὔτε νὰ ἀλλάξει οὔτε νὰ καταργήσει. Ἡ Ἐκκλησία, ὁ χριστιανισμός, ὡς πρὸς αὐτὲς εἶναι ἀπόλυτα ἐλεύθερη, καί, ἂν βρεῖ ὅτι κάτι ἔπαψε νὰ εἶναι ὠφέλιμο, μπορεῖ εἴτε νὰ τὸ καταργήσει τελείως εἴτε νὰ τὸ ἀντικαταστήσει μὲ νέο, ὅπως ἐπίσης νὰ εἰσαγάγει ἐκ νέου κάτι ποὺ δὲν ὑπάρχει, ἀλλὰ ποὺ τὸ κρίνει ἀναγκαῖο</mark>. Καὶ ὅποιος θὰ ὑποστήριζε ὅτι οἱ τάξεις μας εἶναι ἐντελῶς ἀπαραβίαστες, ἐκτὸς ἀπὸ τὸν τρόπο τέλεσης τῶν μυστηρίων, θὰ ἔπεφτε στὸν ἰουδαϊσμὸ</strong> μὲ τὸ δικὸ του: μὴ ἀγγίξεις. Ἡ Ἐκκλησία τοῦ Θεοῦ πάντοτε χρησιμοποιοῦσε καὶ χρησιμοποιεῖ αὐτὴ τὴν ἐλευθερία· μόνο ὄχι ἔτσι, ὥστε σήμερα τὸ ἕνα καὶ αὔριο τὸ ἄλλο.</p>
    <p>Μὲ εὐλάβεια, μὲ φόβο καὶ τρόμο πρέπει νὰ τελεῖται κάθε τυπικὴ πράξη — ἀνάγνωση, ψαλμωδία, κίνηση — ὄχι ὅμως καθόσον εἶναι μιὰ τέτοια πράξη (στὴ θέση της μπορεῖ νὰ εἶναι καὶ ἄλλη), ἀλλὰ καθόσον στρέφεται πρὸς τὸν Θεό. Ἐκεῖνος ὅμως ποὺ κάνει τὸ ἔργο τοῦ Θεοῦ μὲ ἀμέλεια εἶναι καταραμένος. Ὅποιος θὰ ὑποστήριζε ὅτι ὁ φόβος καὶ ὁ τρόμος πρέπει νὰ ἀναφέρονται στὶς ἴδιες τὶς πράξεις καὶ ὅτι πρέπει νὰ τὶς τελεῖ κανεὶς μὲ αὐτὸ τὸ πνεῦμα, θὰ φανέρωνε μέσα του ἰουδαΐζον πνεῦμα.</p>
    <p>Τελώντας μὲ εὐλάβεια τὶς τυπικὲς ἀκολουθίες, πιστεύουμε ὅτι προσελκύουμε τὴν εὔνοια τοῦ Θεοῦ ἐπάνω μας, τὴν εὐδοκία τοῦ Θεοῦ πρὸς ἐμᾶς· ὄχι ὅμως ἐπειδὴ τελέσαμε ἀκριβῶς αὐτὴ τὴν ἀκολουθία: ἡ δύναμη δὲν βρίσκεται στὴν ἀκολουθία, ἀλλὰ στὴν υἱϊκὴ ἀνάταση τοῦ νου καὶ τῆς καρδιᾶς, γεμάτη πίστη καὶ ἀφοσίωση στὸν Θεό. <strong><mark>Ὅποιος θὰ ἀπέδιδε στὶς ἴδιες τὶς ἀκολουθίες, καθόσον εἶναι τέτοιες, ἐκτὸς ἀπὸ τὰ Θεῖα μυστήρια, ἰδιαίτερη δύναμη, αὐτὸς θὰ ἰουδαΐζε</mark></strong>.</p>
    <p><strong>Κάποιοι ἐπιθυμοῦν (ὑπάρχουν καὶ τέτοιες αἱρέσεις) νὰ γυμνώσουν τὸν χριστιανισμὸ ἀπὸ κάθε ἐξωτερικότητα· καὶ τὴν ἐπιθυμία αὐτὴ νομίζουν πὼς τὴ δικαιώνουν μὲ τὴ διδασκαλία τοῦ ἀποστόλου Παύλου περὶ τοῦ ὅτι ὁ ἰουδαϊκὸς νόμος δὲν εἶναι ἀναγκαῖος γιὰ τοὺς χριστιανούς</strong>. Δὲν πρόσεξαν ὅσο ἔπρεπε ὅτι ὁ ἴδιος ἅγιος Παῦλος, ποὺ ἀπομάκρυνε ὅλες τὶς ἰουδαϊκὲς τελετές, <strong><mark>παντοῦ εἰσήγαγε τὶς δικὲς του χριστιανικές</mark></strong>. Τοὺς φαίνεται πώς, μόλις ὑπάρξει κάτι ἐξωτερικό, αὐτὸ εἶναι ἤδη ἰουδαϊσμός, καὶ φωνάζουν: ἰουδαϊσμός, ἀξία! Καὶ δὲν θέλουν νὰ καταλάβουν ὅτι <strong><mark>ὁ ἰουδαϊσμὸς δὲν βρίσκεται στὸ ὅτι ὑπάρχει τὸ ἐξωτερικό, ἀλλὰ στὸ ὅτι αὐτὸ τὸ ἐξωτερικὸ τελεῖται καὶ τιμᾶται ἰουδαϊκά</mark></strong>.</p>
    <p>Οἱ ἴδιοι ὀνειρεύονται πὼς ἔχουν γδυθεῖ ἀπὸ κάθε ἐξωτερικὸ καὶ ὅτι λατρεύουν τὸν Θεὸ ἐν πνεύματι, καθαρὰ χριστιανικά. Ἐνῶ ὅμως, στρεφόμενοι πρὸς τὸν Θεό, <strong><mark>παίρνουν ὁρισμένη στάση καὶ ἀπευθύνουν πρὸς τὸν Θεὸ ἰδιαίτερο λόγο. Τὶ εἶναι αὐτό, παρὰ ἀκολουθία; Ἀκολουθία, μόνο αὐτοσχέδια. Τέτοιοι σοφοὶ δὲν μποροῦν νὰ ἔχουν κοινὲς συνάξεις· δὲν τὶς θεωροῦν ἀναγκαῖες καὶ τὴν ἔννοια τῆς Ἐκκλησίας τοῦ Θεοῦ ὡς ἑνὸς σώματος</mark></strong> δὲν μποροῦν νὰ χωρέσουν. Ἀξιοσημείωτο εἶναι ὅτι ποτὲ δὲν κάνουν οὔτε τὸν σταυρὸ τους. Δὲν εἶναι φανερὸ ὅτι τὸ πνεῦμα ποὺ τοὺς διδάσκει καὶ κατοικεῖ μέσα τους φοβᾶται τὸν σταυρό, ποὺ συνέτριψε ὅλη τὴ δύναμη τοῦ ἐχθροῦ;</p>
    <p>Χωρὶς ἐξωτερικὲς ἀκολουθίες ἐμεῖς, ποὺ εἴμαστε χρονικοὶ καὶ χωρικοί, δὲν μποροῦμε νὰ ὑπάρξουμε. <strong><mark>Καὶ οἱ Ἄγγελοι ἔχουν τὶς δικὲς τους τάξεις. Καὶ στὸν μέλλοντα αἰώνα θὰ ὑπάρχουν δικὲς τους</mark></strong>. Καὶ γιὰ ὅλα σὲ αὐτὲς ὑπάρχει δικὸς τους καιρός, τόπος καὶ τάξη. Μόνο ἐν πνεύματι ἡ λατρεία τοῦ Θεοῦ μπορεῖ καὶ πρέπει νὰ εἶναι ἀδιάλειπτη, χωρὶς νὰ περιορίζεται οὔτε ἀπὸ καιρὸ οὔτε ἀπὸ τόπο οὔτε ἀπὸ θέση.</p>
    </blockquote>
    <p>(Η προς Γαλάτας επιστολή του αγίου αποστόλου Παύλου, ερμηνευμένη από τον άγιο Θεοφάνη)</p>
    <p>Σχόλιο στην Α΄ Τιμ 1:8 — Ο νόμος είναι καλός, εάν κάποιος τον χρησιμοποιεί νόμιμα.</p>
    <blockquote>
    <p>Ὁ Ἀπόστολος φαίνεται νὰ μαλακώνει τὴν προηγούμενη μομφὴ πρὸς ἐκείνους ποὺ προβάλλουν τὴ σημασία τοῦ νόμου, ὅτι δηλαδὴ δὲν ξέρουν τὶ κάνουν: παραδέχομαι ὅτι: <strong>ὁ νόμος εἶναι καλός</strong>. Ἀλλὰ ἀμέσως προσθέτει ἕναν ὅρο ποὺ μπορεῖ νὰ ἀφαιρέσει κάθε θάρρος ἀπὸ ἐκείνους ποὺ διδάσκουν γιὰ τὴ δύναμη τοῦ νόμου: <strong>ἐὰν κάποιος τὸν χρησιμοποιεῖ νόμιμα</strong>, χρῆται — τὸν χρησιμοποιεῖ νόμιμα, δηλαδὴ στὸ πνεῦμα τοῦ ἴδιου τοῦ νόμου, κατὰ τὸ ἐσωτερικὸ του νόημα καὶ τὴ σημασία του. Ξέρω, λέει, ὅτι <strong>ὁ νόμος εἶναι καλός· ἐσεῖς ὅμως τὸν διδάσκετε ἄσχημα</strong>. <strong><mark>Προβάλλετε τὴ σημασία του ὡς ἀπόλυτη, ἐνῶ αὐτὴ ὑπόκειται σὲ ὅρο: «ἐάν». Ἐξέτασε τώρα αὐτὸν τὸν ὅρο καὶ θὰ βρεῖς ὅτι ἡ ἐκπλήρωσή του πρέπει νὰ ὁδηγεῖ στὴ θέαση τῆς παύσης τοῦ νόμου</mark></strong>. <strong><mark>Ὁ νόμος εἶναι παιδαγωγὸς πρὸς τὸν Χριστό — εἶναι σκιά, τὸ σῶμα ὅμως εἶναι ὁ Χριστός. Ἀκολούθησε αὐτὸν τὸν παιδαγωγό, βάδισε σὲ αὐτὴ τὴ σκιά — καὶ θὰ φτάσεις στὸν Χριστό</mark></strong>, τὸν ὑποσχεμένο Λυτρωτή. <strong><mark>Ὅσο δὲν εἶχε ἔρθει ὁ Χριστός, ἤσασταν ὅλοι ὑπὸ παιδαγωγία, βαδίζατε στὴ σκιά· ὅταν ὅμως ἦρθε ὁ Χριστός, ἡ παιδαγωγία τελείωσε, καὶ ἡ σκιὰ πρέπει νὰ μείνει πίσω. Κι ἐσεῖς ὅλο ἐπαναλαμβάνετε: νόμος, νόμος.</mark></strong> Ἑπομένως, τὸν χρησιμοποιεῖτε παράνομα, τὸν μεταχειρίζεστε ὄχι κατὰ τὴ σημασία καὶ τὸ πνεῦμα του· γι᾿ αὐτὸ δὲν ξέρετε τὶ λέτε.</p>
    </blockquote>
    <p>(Ερμηνεία στην Α΄ προς Τιμόθεον επιστολή)</p>
    <h2>Κ΄ αιώνας</h2>
    <h3>Ιλαρίων (Τρόιτσκι), αρχιεπίσκοπος Βερέι, ιερομάρτυς (1886-1929)</h3>
    <blockquote>
    <p>Στοὺς Ἰουδαίους μόνους δόθηκε ὁ νόμος (νόμος τῶν ἐντολῶν)· ὁ νόμος αὐτὸς ἦταν ἀντικείμενο ἔχθρας ἀνάμεσα σὲ αὐτοὺς καὶ στοὺς ἐθνικούς: στεκόταν ἀνάμεσα στοὺς ἐθνικοὺς καὶ στοὺς Ἰουδαίους σὰν τοῖχος (τὸ μεσότοιχον τοῦ φραγμοῦ). Ἔτσι ἦταν μέχρι τὴν ἔλευση τοῦ Χριστοῦ. Ἀλλὰ <strong><mark>ὁ Χριστὸς καταργεῖ</mark> μὲ τὰ δόγματά Του, μὲ τὰ ἰδανικὰ Του <mark>τὸν παλαιοδιαθηκικὸ νόμο τῶν ἐντολῶν, τὸν νόμο</mark></strong>, ποὺ τὰ καθόριζε ὅλα καὶ τὰ τιμωροῦσε ὅλα, ποὺ φανέρωνε μόνο τὴν ἀνθρώπινη ἀδυναμία καὶ <strong><mark>ὁδηγοῦσε τοὺς ἀνθρώπους τῆς Παλαιᾶς Διαθήκης μόνο στὴ συνείδηση τῆς ἀνάγκης γιὰ ἕναν ἄλλο δρόμο δικαίωσης</mark>. <mark>Στὴ θέση τοῦ νόμου</mark>, τοῦ ὁποίου οἱ ἐντολὲς ἦταν χαραγμένες στὶς πέτρινες πλάκες, <mark>τίθεται ὁ νόμος ποὺ εἶναι γραμμένος στὶς πλάκες τῆς καρδιᾶς (Β΄ Κορ 3:3), ὁ νόμος τῆς πίστης... ὁ νόμος τοῦ Πνεύματος τῆς ζωῆς (Ρωμ 3:27, 8:2)</mark>. </strong>Ὁ σταυρικὸς θάνατος τοῦ Χριστοῦ ἄνοιξε τὸν νέο δρόμο τῆς σωτηρίας. Σὲ αὐτὸν τὸν δρόμο καταργεῖται ἡ διάκριση ἀνάμεσα σὲ Ἰουδαίους καὶ ἐθνικούς, καὶ Ἰουδαῖοι καὶ ἐθνικοὶ γίνονται ἕνα — τὰ ἀμφότερα ἕν· ἀπὸ τοὺς Ἰουδαίους καὶ τοὺς ἐθνικοὺς πλάθεται ὁ νέος ἄνθρωπος (τοῦς δύο εἰς ἕνα καινὸν ἄνθρωπον), ὥστε οἱ ἐθνικοὶ ἔγιναν συγκληρονόμοι τῶν Ἰουδαίων, μέτοχοι τῶν ἐπαγγελιῶν καὶ μαζὶ τους ἀποτελοῦν ἕνα Σῶμα</p>
    <p>&lt;…&gt;</p>
    <p><strong>Ἡ ἀγάπη εἶναι ἡ νέα ἀρχὴ ζωῆς τῆς ἀναγεννημένης ἀνθρωπότητας</strong>, καὶ ὅλη ἡ τελείωση, <strong>ἡ αὔξηση τοῦ ἐκκλησιαστικοῦ ὀργανισμοῦ ἐξαρτᾶται ἀπὸ τὴ μετοχὴ τῶν ἐπιμέρους μελῶν <mark>στὸν νόμο τῆς ἀγάπης</mark></strong>. Ὅλη αὐτὴ ἡ διαδικασία τῆς αὔξησης εἶναι ἔργο τῆς χάρης τοῦ Θεοῦ, ἀλλὰ ἡ πρόσληψη αὐτῆς τῆς χάρης (ἁφῆς τῆς ἐπιχορηγίας), βέβαια, εἶναι δυνατὴ μόνο μὲ τὴν ἀγάπη. Χωρὶς ἀγάπη τὰ χαρίσματα ποὺ ἔλαβε ἕνα ὁρισμένο μέλος θὰ ἦταν ἄχρηστα γιὰ τὴ ζωὴ ὁλόκληρου τοῦ Σώματος, γιατὶ αὐτὸ τὸ μέλος θὰ ἔκλεινε στὸν ἑαυτὸ του, δὲν θὰ γνώριζε τὰ ἄλλα μέλη καὶ θὰ ἦταν ἀπομονωμένο. Χωρὶς ἀγάπη δὲν θὰ ἦταν δυνατὴ οὔτε ἡ ἴδια ἡ πρόσληψη τῶν δώρων τοῦ Ἁγίου Πνεύματος.</p>
    <p>&lt;…&gt;</p>
    <p>Στὰ κείμενα τῆς Καινῆς Διαθήκης διαμορφώνεται γιὰ τὴν Ἐκκλησία καὶ τὴ σχέση της μὲ τὸν ἰουδαϊσμὸ μιὰ ἐντελῶς ὁρισμένη ἀντίληψη. Ἀπὸ τὰ ἱερὰ βιβλία τῆς Καινῆς Διαθήκης πιὸ ἔντονο ἀντιιουδαϊκὸ χρῶμα ἔχουν τὸ Εὐαγγέλιο τοῦ Ἰωάννη καὶ ἡ Ἐπιστολὴ πρὸς Ἑβραίους. Ἐδῶ βλέπουμε τὴ σαφῶς διατυπωμένη σκέψη ὅτι <strong><mark>ἡ Παλαιὰ Διαθήκη ἔχει τὴ νόμιμη καὶ πραγματικὴ σημασία της μέχρι τὴ θεμελίωση τῆς Ἐκκλησίας τοῦ Χριστοῦ. Ὅταν ὅμως θεμελιώθηκε ἡ Ἐκκλησία τοῦ Χριστοῦ, στὴν Παλαιὰ Διαθήκη μὲ τὶς θυσιαστικὲς τελετὲς καὶ ὅλους γενικὰ τοὺς νόμους δὲν ὑπάρχει ἀνάγκη</mark></strong>.</p>
    </blockquote>
    <p>(<strong><u>Δοκίμια από την ιστορία του δόγματος περί της Εκκλησίας</u></strong>)</p>
    <h2>Σχόλια</h2>
    <h3>Α΄ Κορ 14:34 — ας σιωπούν, όπως και ο Νόμος ορίζει</h3>
    <p>Ο άγιος Ιωάννης ο Χρυσόστομος λέει ότι ο απόστολος ο ίδιος θεσπίζει αυτόν τον νόμο για τις εκκλησίες. Συγχρόνως, για να φράξει τα στόματα εκείνων που θα ήθελαν να αντιλέξουν, επικαλείται επιπλέον (δηλαδή επιπροσθέτως) τον νόμο, όχι όμως τον Νόμο του Μωυσή, αλλά τον νόμο που έδωσε ο Θεός στη Γεν 3:16:</p>
    <p><strong>Ιωάννης ο Χρυσόστομος, ιεράρχης</strong></p>
    <blockquote><p>Περικόψας τὸν θόρυβον τὸν ἀπὸ τῶν γλωττῶν, καὶ τὸν ἀπὸ τῶν προφητειῶν, καὶ <strong>νομοθετήσας, ὥστε μὴ σύγχυσιν γίνεσθαι</strong>, τούς τε γλώσσαις λαλοῦντας ἀνὰ μέρος τοῦτο ποιεῖν, τούς τε προφητεύοντας ἀρξαμένου ἑτέρου σιγᾷν, λοιπὸν καὶ ἐπὶ τὴν ταραχὴν τὴν ἀπὸ τῶν γυναικῶν γινομένην ὁδῷ πρόεισι, τὴν ἄκαιρον αὐτῶν ἐκκόπτων παῤῥησίαν, καὶ σφόδρα εὐκαίρως. Εἰ γὰρ τοῖς τὰ χαρίσματα ἔχουσιν ἁπλῶς οὐκ ἐφίεται λαλεῖν, οὐδ' ὅτε βούλονται, καὶ ταῦτα ὑπὸ τοῦ Πνεύματος κινουμένοις, πολλῷ μᾶλλον ἐκείναις εἰκῆ φλυαρούσαις καὶ μάτην. ∆ιὰ τοῦτο καὶ μετὰ πολλῆς τῆς αὐθεντίας ἐπιστομίζει τὴν φλυαρίαν αὐτῶν, <strong>καὶ τὸν νόμον μεθ' ἑαυτοῦ λαβὼν, οὕτως αὐτῶν ἀποῤῥάπτει τὰ στόματα</strong>. Οὐ γὰρ παραινεῖ μόνον ἐνταῦθα, οὐδὲ συμβουλεύει, ἀλλὰ καὶ ἐπιτάττει σφοδρῶς, παλαιὸν ὑπὲρ τούτων ἀναγινώσκων νόμον. Εἰπὼν γὰρ, ὅτι Αἱ γυναῖκες ὑμῶν ἐν ταῖς ἐκκλησίαις σιγάτωσαν, καὶ, Οὐκ ἐπιτέτραπται αὐταῖς λαλεῖν, ἀλλ' ὑποτάττεσθαι, ἐπήγαγε, Καθὼς καὶ ὁ νόμος λέγει. Καὶ ποῦ τοῦτο ὁ νόμος λέγει; <strong>Πρὸς τὸν ἄνδρα σου ἡ ἀποστροφή σου, καὶ αὐτός σου κυριεύσει</strong>.</p></blockquote>
    <p>(<a href="https://bibleox.com/grc/grc/w/JU0H_%CE%9B%CF%8C%CE%B3%CE%BF%CE%B9_%CE%B5%E1%BC%B0%CF%82_%CF%84%E1%BD%B4%CE%BD_%CF%80%CF%81%CF%8E%CF%84%CE%B7%CE%BD_%CF%80%CF%81%E1%BD%B8%CF%82_%CE%9A%CE%BF%CF%81%CE%B9%CE%BD%CE%B8%CE%AF%CE%BF%CF%85%CF%82_3#HH-%CE%9F%CE%9C%CE%99%CE%9B%CE%99%CE%91-%CE%9B%CE%96%CD%B4">Ομιλίες στην Α΄ προς Κορινθίους, ομιλία 37</a>)</p>
    <p>Τον άγιο Ιωάννη τον Χρυσόστομο επαναλαμβάνουν οι άγιοι Θεοδώρητος ο Κύρου, Θεοφύλακτος ο Βουλγαρίας και Θεοφάνης ο Έγκλειστος.</p>
    <h3>Ρωμ 13:10 — Η αγάπη είναι εκπλήρωση του Νόμου</h3>
    <p>Εδώ ο απόστολος μιλά αντιστρόφως: δεν είναι εκείνος που τηρεί τον Νόμο αυτός που αγαπά, αλλά εκείνος που αγαπά αυτός τηρεί τον Νόμο. Έτσι, η αγάπη (ακόμη και για εκείνους που δεν γνωρίζουν τον Νόμο) είναι εκπλήρωση του Νόμου. Γιατί ο Νόμος του Μωυσή στηρίζεται σε αυτό, πηγάζει από την αγάπη.</p>
    <blockquote><p>«Μηδενὶ μηδὲν ὀφείλετε, εἰ μὴ τὸ ἀλλήλους ἀγαπᾶν· <strong>ὁ γὰρ ἀγαπῶν τὸν ἕτερον νόμον πεπλήρωκεν</strong>. <strong>τὸ γὰρ</strong> Οὐ μοιχεύσεις, Οὐ φονεύσεις, Οὐ κλέψεις, Οὐκ ἐπιθυμήσεις, καὶ εἴ τις ἑτέρα ἐντολή, <strong>ἐν τῷ λόγῳ τούτῳ ἀνακεφαλαιοῦται, [ἐν τῷ] Ἀγαπήσεις</strong> τὸν πλησίον σου ὡς σεαυτόν. ἡ ἀγάπη τῷ πλησίον κακὸν οὐκ ἐργάζεται· <strong>πλήρωμα οὖν νόμου ἡ ἀγάπη</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/13/#L8-10">Ρωμ 13:8-10</a>)</p></blockquote>
    <p>Μια τέτοια κατανόηση προτείνει ο ιερομάρτυς Ειρηναίος της Λυών, εξηγώντας διεξοδικά ότι ο ίδιος ο Χριστός (η τάση προς την εικόνα Του μέσα μας) και η πίστη σε Αυτόν μας οδηγούν στην αγάπη. Και παραπέμπει ακριβώς στο Ρωμ 13:10. Λέει ότι δεν έχουμε ανάγκη από τον Νόμο ως παιδαγωγό και δείχνει ότι για τους χριστιανούς δεν είναι αναγκαίες ούτε οι ηθικές εντολές: μη μοιχεύσεις, μη σκοτώσεις, μη φθονήσεις και τα λοιπά, γιατί ο ακόλουθος του Χριστού (ο χριστιανός) δεν μπορεί να τα κάνει αυτά, ούτε καν στον νου του δεν πρέπει να του έρχονται.</p>
    <h3>Γαλ 3:21 — Ο Νόμος δεν είναι αντίθετος προς τις επαγγελίες του Θεού</h3>
    <p>Οι άγιοι Πατέρες γράφουν ότι οι επαγγελίες προς τον Αβραάμ αφορούσαν ευλογίες, ενώ ο Νόμος του Μωυσή υπόσχεται αντίθετα κατάρες. Μήπως λοιπόν ο Νόμος είναι αντίθετος προς τις επαγγελίες προς τον Αβραάμ; Όχι, γιατί ο Νόμος δόθηκε ως μέσο αναζήτησης των επαγγελιών. Οι αμαρτωλοί άνθρωποι έπρεπε μέσω του Νόμου να καταλάβουν ότι είναι αμαρτωλοί και να ζητήσουν απελευθέρωση από την αμαρτία, δηλαδή να ζητήσουν τον Σωτήρα. Και αν δεν υπήρχε ο Νόμος, δεν θα άκουγαν ούτε τον Χριστό. Δηλαδή και πάλι, ο Νόμος τους προετοίμαζε για τον Χριστό.</p>
    <h3>Γαλ 3:13 — μας εξαγόρασε από την κατάρα του Νόμου</h3>
    <p>Εδώ ακριβώς λέγεται για ποιο λόγο οι επαγγελίες προς τον Αβραάμ (οι ευλογίες) δεν είναι αντίθετες προς τον Νόμο του Μωυσή (που υπόσχεται κατάρες). Απάντηση: γιατί ο Θεός εξαγόρασε από την κατάρα.</p>
    <h3>Γαλ 2:21 — δεν αθετώ τη χάρη του Θεού. Αν όμως η δικαίωση γίνεται διά του Νόμου, τότε ο Χριστός πέθανε μάταια.</h3>
    <p>Εδώ λέγεται από τους αγίους Πατέρες ότι ο Νόμος έχασε την ισχύ του. Και στη συνέχεια, στον άγιο Ιωάννη τον Χρυσόστομο, φαίνεται ότι κοιτάζουμε τον Χριστό και Τον ακολουθούμε, δηλαδή η ίδια σκέψη με τον άγιο Ειρηναίο της Λυών. Βλ. τις παραπάνω ρήσεις.</p>
