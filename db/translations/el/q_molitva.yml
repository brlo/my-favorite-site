  title: Η δράση του Θεού κατά την πίστη και την προσευχή των άλλων
  title_sub:
  meta_desc: Βιβλικές ρήσεις για τη δράση της θείας χάριτος στον άνθρωπο μέσω της πίστης και της προσευχής των άλλων.
  copy_cover: true
