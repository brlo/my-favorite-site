  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: '<h2>Η προσκύνηση προς τον ναό</h2><p>Προσκύνηση προς τον <a href="https://bibleox.com/el/el/w/Ο_ναός_της_Ιερουσαλήμ">ναό</a>, ο οποίος ήταν γεμάτος ιερές <a href="https://bibleox.com/el/el/w/Ο_ναός_της_Ιερουσαλήμ#HH-Οι-γλυπτές-παραστάσεις">παραστάσεις</a> των χερουβείμ:</p><blockquote><p>«ἐγὼ δὲ ἐν τῷ πλήθει τοῦ ἐλέους σου εἰσελεύσομαι εἰς τὸν οἶκόν σου, <strong>προσκυνήσω πρὸς ναὸν ἅγιόν</strong> <strong>σου</strong> ἐν φόβῳ σου.» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/5/#L7">Ψλ 5:7</a>)</p></blockquote><blockquote><p>«<strong>προσκυνήσω πρὸς ναὸν ἅγιόν σου</strong> καὶ ἐξομολογήσομαι τῷ ὀνόματί σου ἐπὶ τῷ ἐλέει σου καὶ τῇ ἀληθείᾳ σου, ὅτι ἐμεγάλυνας ἐπὶ πᾶν ὄνομα τὸ λόγιόν σου.» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/137/#L2">Ψλ 137:2</a>)</p></blockquote><h2>Η προσκύνηση προς το υποπόδιο του Θεού (τον ναό)</h2><blockquote><p>«ὑψοῦτε κύριον τὸν θεὸν ἡμῶν καὶ <strong>προσκυνεῖτε</strong> τῷ <strong>ὑποποδίῳ τῶν ποδῶν αὐτοῦ, ὅτι ἅγιός ἐστιν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/98/#L5">Ψλ 98:5</a>)</p></blockquote><blockquote><p>«εἰσελευσόμεθα εἰς τὰ <strong>σκηνώματα αὐτοῦ, προσκυνήσομεν εἰς τὸν τόπον, οὗ ἔστησαν οἱ πόδες αὐτοῦ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/131/#L7">Ψλ 131:7</a>)</p></blockquote><h2>Η προσκύνηση μπροστά στην Κιβωτό της Διαθήκης</h2><p>Ο προφήτης Ιησούς του Ναυή προσκυνά μπροστά στην <a href="https://bibleox.com/el/el/w/Η_Κιβωτός_της_Διαθήκης">Κιβωτό της Διαθήκης</a>, που είχε εικόνες χερουβείμ στο κάλυμμα και τα άγια αντικείμενα στο εσωτερικό της:</p><blockquote><p>«καὶ διέρρηξεν Ἰησοῦς τὰ ἱμάτια αὐτοῦ, καὶ <strong>ἔπεσεν Ἰησοῦς ἐπὶ τὴν γῆν ἐπὶ πρόσωπον ἐναντίον κυρίου</strong> ἕως ἑσπέρας, αὐτὸς καὶ οἱ πρεσβύτεροι Ισραηλ, καὶ ἐπεβάλοντο χοῦν ἐπὶ τὰς κεφαλὰς αὐτῶν.» (<a href="https://bibleox.com/el/gr-lxx-byz/nav/7/#L6">Ιησ 7:6</a>)</p></blockquote><h2>Η προσκύνηση της εικόνας του Θεού με τη μορφή τριών αγγέλων</h2><p>Ο Αβραάμ προσκυνά τον Θεό, που εμφανίστηκε με τη μορφή τριών ανδρών:</p><blockquote><p><em>«</em><strong><em>Ὤφθη δὲ αὐτῷ ὁ θεὸς</em></strong><em> πρὸς τῇ δρυὶ τῇ Μαμβρη καθημένου αὐτοῦ ἐπὶ τῆς θύρας τῆς σκηνῆς αὐτοῦ μεσημβρίας. ἀναβλέψας δὲ τοῖς ὀφθαλμοῖς αὐτοῦ εἶδεν, καὶ ἰδοὺ </em><strong><em>τρεῖς ἄνδρες</em></strong><em> εἱστήκεισαν ἐπάνω αὐτοῦ· καὶ ἰδὼν προσέδραμεν εἰς συνάντησιν αὐτοῖς ἀπὸ τῆς θύρας τῆς σκηνῆς αὐτοῦ καὶ </em><strong><em>προσεκύνησεν ἐπὶ τὴν γῆν</em></strong><em>» (</em><a href="https://bibleox.com/el/gr-lxx-byz/gen/18/#L1-2"><em>Γεν 18:1-2</em></a><em>)</em></p></blockquote><p>Γιατί ο Θεός εμφανίστηκε με μορφή εικόνας; — Επειδή ο Θεός από τη φύση Του είναι αόρατος, κανείς ποτέ δεν Τον είδε (<a href="https://bibleox.com/el/gr-lxx-byz/1tim/6/#L16">Α Τιμ 6:16</a> · <a href="https://bibleox.com/el/gr-lxx-byz/in/1/#L18">Ιω 1:18</a>). Παρ’ όλα αυτά, η Γραφή αναφέρει ότι εμφανίστηκε ακριβώς ο Θεός (<em>εβρ. יְהוָ֔ה — Γιαχβέ</em>).</p><h2>Η προσκύνηση του αντικειμένου</h2><blockquote><p>Στη ράβδο: «εἶπεν δέ Ὄμοσόν μοι. καὶ ὤμοσεν αὐτῷ. καὶ <strong>προσεκύνησεν Ισραηλ ἐπὶ τὸ ἄκρον τῆς ῥάβδου αὐτοῦ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/gen/47/#L31">Γεν 47:31</a> · <a href="https://bibleox.com/el/gr-lxx-byz/evr/11/#L21">Εβρ 11:21</a>) — στο εβραϊκό κείμενο εδώ αναφέρεται το κρεβάτι, ενώ στην έκδοση των Εβδομήκοντα — <strong>ῥάβδου</strong>.</p></blockquote><h2>Η προσκύνηση του αγγέλου</h2><p>Αξίζει πρώτα να σημειωθεί ότι οι άγγελοι είναι πνεύματα (<a href="https://bibleox.com/el/gr-lxx-byz/evr/1/#L13-14">Εβρ 1:13-14</a>), και τα πνεύματα δεν έχουν σάρκα και οστά (<a href="https://bibleox.com/el/gr-lxx-byz/lk/24/#L39">Λκ 24:39</a>), δηλαδή και οι άγγελοι εμφανίζονται στους ανθρώπους με μορφή ανθρώπων. Αντίστοιχα, αν προσκυνείται ένας άγγελος, τότε <strong>προσκυνείται η ορατή εικόνα του αόρατου πνεύματος</strong> (του αγγέλου):</p><blockquote><p>«ὁ δὲ εἶπεν αὐτῷ Ἐγὼ ἀρχιστράτηγος δυνάμεως κυρίου νυνὶ παραγέγονα. καὶ Ἰησοῦς <strong>ἔπεσεν ἐπὶ πρόσωπον</strong> ἐπὶ τὴν γῆν καὶ εἶπεν αὐτῷ Δέσποτα, τί προστάσσεις τῷ σῷ οἰκέτῃ;» (<a href="https://bibleox.com/el/gr-lxx-byz/nav/5/#L14">Ιησ 5:14</a>)</p></blockquote><blockquote><p>«Ἦλθον δὲ οἱ δύο ἄγγελοι εἰς Σοδομα ἑσπέρας· Λωτ δὲ ἐκάθητο παρὰ τὴν πύλην Σοδομων. ἰδὼν δὲ Λωτ ἐξανέστη εἰς συνάντησιν αὐτοῖς καὶ <strong>προσεκύνησεν τῷ προσώπῳ ἐπὶ τὴν γῆν</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/gen/19/#L1">Γεν 19:1</a>)</p></blockquote><blockquote><p>«καὶ ἐγένετο ἐν τῷ ἀναβῆναι τὴν φλόγα ἐπάνωθεν τοῦ θυσιαστηρίου εἰς τὸν οὐρανὸν καὶ ἀνέβη ὁ ἄγγελος κυρίου ἐν τῇ φλογί, καὶ Μανωε καὶ ἡ γυνὴ αὐτοῦ ἐθεώρουν καὶ <strong>ἔπεσον ἐπὶ πρόσωπον αὐτῶν ἐπὶ τὴν γῆν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/sud/13/#L20">Κρ 13:20</a>)</p></blockquote><blockquote><p>«καὶ οὐκ ἤκουσα τὴν φωνὴν λαλιᾶς αὐτοῦ, <strong>ἐγὼ ἤμην πεπτωκὼς ἐπὶ πρόσωπόν μου</strong> ἐπὶ τὴν γῆν.» (<a href="https://bibleox.com/el/gr-lxx-byz/dan/10/#L9">Δν 10:9</a>)</p></blockquote><blockquote><p>«καὶ ἐν τῷ αὐτὸν λαλῆσαι μετ᾿ ἐμοῦ τὰ προστάγματα ταῦτα <strong>ἔδωκα τὸ πρόσωπόν μου ἐπὶ τὴν γῆν</strong> καὶ ἐσιώπησα.» (<a href="https://bibleox.com/el/gr-lxx-byz/dan/10/#L15">Δν 10:15</a>)</p></blockquote><h2>Η προσκύνηση του προφήτη</h2><blockquote><p>Στον <strong>Ελισαίο</strong>: «καὶ εἶδον αὐτὸν οἱ <strong>υἱοὶ τῶν προφητῶν</strong> οἱ ἐν Ιεριχω ἐξ ἐναντίας καὶ εἶπον Ἐπαναπέπαυται τὸ πνεῦμα Ηλιου ἐπὶ Ελισαιε· καὶ ἦλθον εἰς συναντὴν αὐτοῦ καὶ <strong>προσεκύνησαν αὐτῷ ἐπὶ τὴν γῆν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/4ts/2/#L15">Δ Βασ 2:15</a>)</p></blockquote><blockquote><p>«καὶ ἦν <strong>Αβδιου</strong> ἐν τῇ ὁδῷ μόνος, καὶ ἦλθεν Ηλιου εἰς συνάντησιν αὐτοῦ μόνος· καὶ Αβδιου <strong>ἔσπευσεν καὶ ἔπεσεν ἐπὶ πρόσωπον αὐτοῦ</strong> καὶ εἶπεν Εἰ σὺ εἶ αὐτός, κύριέ μου Ηλιου;» (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/18/#L7">Γ Βασ 18:7</a>)</p></blockquote><blockquote><p>Στον Δανιήλ: «τότε <strong>Ναβουχοδονοσορ</strong> ὁ βασιλεὺς <strong>πεσὼν ἐπὶ πρόσωπον</strong> χαμαὶ <strong>προσεκύνησε</strong> τῷ <strong>Δανιηλ</strong> καὶ ἐπέταξε θυσίας καὶ σπονδὰς ποιῆσαι αὐτῷ.» (<a href="https://bibleox.com/el/gr-lxx-byz/dan/2/#L46">Δν 2:46</a>)</p></blockquote><blockquote><p>«καὶ εἶπεν αὐτῇ Τί ἔγνως; καὶ εἶπεν αὐτῷ Ἄνδρα ὄρθιον ἀναβαίνοντα ἐκ τῆς γῆς, καὶ οὗτος διπλοίδα ἀναβεβλημένος. καὶ ἔγνω Σαουλ ὅτι Σαμουηλ οὗτος, καὶ <strong>ἔκυψεν ἐπὶ πρόσωπον αὐτοῦ ἐπὶ τὴν γῆν καὶ προσεκύνησεν</strong> αὐτῷ.» (<a href="https://bibleox.com/el/gr-lxx-byz/1ts/28/#L14">Α Βασ 28:14</a>)</p></blockquote><blockquote><p>«καὶ εἶδεν <strong>Αβιγαια</strong> τὸν Δαυιδ καὶ ἔσπευσεν καὶ κατεπήδησεν ἀπὸ τῆς ὄνου καὶ <strong>ἔπεσεν ἐνώπιον Δαυιδ ἐπὶ πρόσωπον αὐτῆς καὶ προσεκύνησεν αὐτῷ ἐπὶ τὴν γῆν</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/1ts/25/#L23">Α Βασ 25:23</a>)</p></blockquote><h2>Η προσκύνηση του λαού</h2><blockquote><p>«καὶ <strong>προσεκύνησεν</strong> Αβρααμ ἐναντίον τοῦ λαοῦ τῆς γῆς» (<a href="https://bibleox.com/el/gr-lxx-byz/gen/23/#L12">Γεν 23:12</a>)</p></blockquote><h2>Η προσκύνηση του αδελφού</h2><blockquote><p>«αὐτὸς δὲ προῆλθεν ἔμπροσθεν αὐτῶν καὶ <strong>προσεκύνησεν</strong> ἐπὶ τὴν γῆν <strong>ἑπτάκις</strong> ἕως τοῦ ἐγγίσαι τοῦ ἀδελφοῦ αὐτοῦ.» (<a href="https://bibleox.com/el/gr-lxx-byz/gen/33/#L3">Γεν 33:3</a>)</p></blockquote><blockquote><p>«Ιωσηφ δὲ ἦν ἄρχων τῆς γῆς, οὗτος ἐπώλει παντὶ τῷ λαῷ τῆς γῆς· ἐλθόντες δὲ <strong>οἱ ἀδελφοὶ Ιωσηφ</strong> <strong>προσεκύνησαν αὐτῷ ἐπὶ πρόσωπον ἐπὶ τὴν γῆν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/gen/42/#L6">Γεν 42:6</a>)</p></blockquote><h2>Η προσκύνηση του πεθερού</h2><blockquote><p>«ἐξῆλθεν δὲ Μωϋσῆς εἰς συνάντησιν τῷ γαμβρῷ αὐτοῦ καὶ <strong>προσεκύνησεν</strong> αὐτῷ καὶ ἐφίλησεν αὐτόν, καὶ ἠσπάσαντο ἀλλήλους· καὶ εἰσήγαγεν αὐτὸν εἰς τὴν σκηνήν.» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/18/#L7">Έξ 18:7</a>)</p></blockquote>'
