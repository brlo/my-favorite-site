    priority: 4
  update: true
  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <p>Η ενέργεια της θείας χάριτος δεν συντελείται πάντοτε κατά την προσωπική πίστη και το προσωπικό αίτημα. Δεν είναι λίγες οι περιπτώσεις όπου ο Θεός ενήργησε κατά την πίστη των δικών τους ανθρώπων, οι οποίοι κοπιάζουν για τον δικό τους άνθρωπο και τον παρακαλούν (προσεύχονται) γι’ αυτόν.</p><h2>Οι τέσσερις φίλοι και ο παράλυτος</h2><p>Η θεραπεία και η άφεση των αμαρτιών γίνονται κατά την πίστη των φίλων του παράλυτου, οι οποίοι κοπίασαν πολύ για να τον φέρουν στον Χριστό:</p><blockquote><p>«<em>ἰδὼν ὁ Ἰησοῦς</em> <strong>τὴν πίστιν</strong> <strong>αὐτῶν</strong> <em>λέγει τῷ παραλυτικῷ, Τέκνον</em>, <strong><em>ἀφίενταί σου</em></strong><em> </em><strong><em>αἱ ἁμαρτίαι</em></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mk/2/#L5">Μκ 2:5</a>)</p></blockquote><h2>Ο εκατόνταρχος και ο δούλος</h2><p>Πιστεύει και παρακαλεί ο εκατόνταρχος, αλλά θεραπεύεται ο δούλος του εκατόνταρχου:</p><blockquote><p>«καὶ ἀποκριθεὶς ὁ ἑκατόνταρχος ἔφη, Κύριε, οὐκ εἰμὶ ἱκανὸς ἵνα μου ὑπὸ τὴν στέγην εἰσέλθῃς· ἀλλὰ μόνον εἰπὲ λόγῳ, καὶ ἰαθήσεται ὁ παῖς μου. &lt;…&gt; ἀκούσας δὲ ὁ Ἰησοῦς ἐθαύμασεν καὶ εἶπεν τοῖς ἀκολουθοῦσιν, <strong>Ἀμὴν λέγω ὑμῖν, παρ᾿ οὐδενὶ τοσαύτην πίστιν ἐν τῷ Ἰσραὴλ εὗρον</strong>. &lt;…&gt; καὶ εἶπεν ὁ Ἰησοῦς τῷ ἑκατοντάρχῃ, Ὕπαγε, ὡς ἐπίστευσας γενηθήτω σοι. καὶ <strong>ἰάθη ὁ παῖς [αὐτοῦ] ἐν τῇ ὥρᾳ ἐκείνῃ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/8/#L8,10,13">Μτ 8:8,10,13</a>)</p></blockquote><h2>Ο πατέρας και ο δαιμονισμένος γιος</h2><p>Πιστεύει και παρακαλεί ο πατέρας, αλλά θεραπεύεται από τον δαιμονισμό ο γιος:</p><blockquote><p>«καὶ ἀπεκρίθη αὐτῷ εἷς ἐκ τοῦ ὄχλου, Διδάσκαλε, <strong>ἤνεγκα τὸν υἱόν μου πρὸς σέ, ἔχοντα πνεῦμα ἄλαλον</strong>· καὶ ὅπου ἐὰν αὐτὸν καταλάβῃ ῥήσσει αὐτόν, καὶ ἀφρίζει καὶ τρίζει τοὺς ὀδόντας καὶ ξηραίνεται· καὶ εἶπα τοῖς μαθηταῖς σου ἵνα αὐτὸ ἐκβάλωσιν, καὶ οὐκ ἴσχυσαν. ὁ δὲ ἀποκριθεὶς αὐτοῖς λέγει, Ὦ γενεὰ ἄπιστος, ἕως πότε πρὸς ὑμᾶς ἔσομαι; ἕως πότε ἀνέξομαι ὑμῶν; φέρετε αὐτὸν πρός με. καὶ ἤνεγκαν αὐτὸν πρὸς αὐτόν. καὶ ἰδὼν αὐτὸν τὸ πνεῦμα εὐθὺς συνεσπάραξεν αὐτόν, καὶ πεσὼν ἐπὶ τῆς γῆς ἐκυλίετο ἀφρίζων. καὶ ἐπηρώτησεν τὸν πατέρα αὐτοῦ, Πόσος χρόνος ἐστὶν ὡς τοῦτο γέγονεν αὐτῷ; ὁ δὲ εἶπεν, Ἐκ παιδιόθεν· καὶ πολλάκις καὶ εἰς πῦρ αὐτὸν ἔβαλεν καὶ εἰς ὕδατα ἵνα ἀπολέσῃ αὐτόν· ἀλλ᾿ εἴ τι δύνῃ, βοήθησον ἡμῖν σπλαγχνισθεὶς ἐφ᾿ ἡμᾶς. ὁ δὲ Ἰησοῦς εἶπεν αὐτῷ, Τὸ <strong>Εἰ δύνῃ — πάντα δυνατὰ τῷ πιστεύοντι</strong>. εὐθὺς κράξας ὁ πατὴρ τοῦ παιδίου ἔλεγεν, Πιστεύω· βοήθει μου τῇ ἀπιστίᾳ. ἰδὼν δὲ ὁ Ἰησοῦς ὅτι ἐπισυντρέχει ὄχλος ἐπετίμησεν τῷ πνεύματι τῷ ἀκαθάρτῳ λέγων αὐτῷ, Τὸ ἄλαλον καὶ κωφὸν πνεῦμα, ἐγὼ ἐπιτάσσω σοι, ἔξελθε ἐξ αὐτοῦ καὶ μηκέτι εἰσέλθῃς εἰς αὐτόν. καὶ κράξας καὶ πολλὰ σπαράξας ἐξῆλθεν· καὶ ἐγένετο ὡσεὶ νεκρός, ὥστε τοὺς πολλοὺς λέγειν ὅτι ἀπέθανεν. ὁ δὲ Ἰησοῦς κρατήσας τῆς χειρὸς αὐτοῦ ἤγειρεν αὐτόν, καὶ ἀνέστη.» (<a href="https://bibleox.com/el/gr-lxx-byz/mk/9/#L17-27">Μκ 9:17-27</a>)</p></blockquote><h2>Η Χαναναία μητέρα και η δαιμονισμένη κόρη</h2><p>Πιστεύει και παρακαλεί η μητέρα, αλλά θεραπεύεται από τον δαιμονισμό η κόρη της Χαναναίας (Συροφοινίκισσας — <a href="https://bibleox.com/el/gr-lxx-byz/mk/7/#L26">Μκ 7:26</a>):</p><blockquote><p>«καὶ ἰδοὺ γυνὴ Χαναναία ἀπὸ τῶν ὁρίων ἐκείνων ἐξελθοῦσα ἔκραζεν λέγουσα, Ἐλέησόν με, κύριε, υἱὸς Δαυίδ· ἡ θυγάτηρ μου <strong>κακῶς δαιμονίζεται</strong>. ὁ δὲ οὐκ ἀπεκρίθη αὐτῇ λόγον. καὶ προσελθόντες οἱ μαθηταὶ αὐτοῦ ἠρώτουν αὐτὸν λέγοντες, Ἀπόλυσον αὐτήν, ὅτι κράζει ὄπισθεν ἡμῶν. ὁ δὲ ἀποκριθεὶς εἶπεν, Οὐκ ἀπεστάλην εἰ μὴ εἰς τὰ πρόβατα τὰ ἀπολωλότα οἴκου Ἰσραήλ. ἡ δὲ ἐλθοῦσα προσεκύνει αὐτῷ λέγουσα, Κύριε, βοήθει μοι. ὁ δὲ ἀποκριθεὶς εἶπεν, Οὐκ ἔστιν καλὸν λαβεῖν τὸν ἄρτον τῶν τέκνων καὶ βαλεῖν τοῖς κυναρίοις. ἡ δὲ εἶπεν, Ναί, κύριε, καὶ γὰρ τὰ κυνάρια ἐσθίει ἀπὸ τῶν ψιχίων τῶν πιπτόντων ἀπὸ τῆς τραπέζης τῶν κυρίων αὐτῶν. τότε ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτῇ, Ὦ γύναι, <strong>μεγάλη σου ἡ πίστις</strong>· γενηθήτω σοι ὡς θέλεις. καὶ ἰάθη ἡ θυγάτηρ αὐτῆς ἀπὸ τῆς ὥρας ἐκείνης.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/15/#L22-28">Μτ 15:22-28</a>)</p></blockquote><h2>Ο Ιάειρος και η δωδεκάχρονη κόρη του</h2><p>Πιστεύει και παρακαλεί ο πατέρας (Ιάειρος), αλλά ανασταίνεται θεραπευμένη η κόρη:</p><blockquote><p>«καὶ ἰδοὺ ἦλθεν ἀνὴρ ᾧ ὄνομα Ἰάϊρος, καὶ οὗτος ἄρχων τῆς συναγωγῆς ὑπῆρχεν, καὶ πεσὼν παρὰ τοὺς πόδας τοῦ Ἰησοῦ παρεκάλει αὐτὸν εἰσελθεῖν εἰς τὸν οἶκον αὐτοῦ, ὅτι <strong>θυγάτηρ μονογενὴς ἦν αὐτῷ</strong> ὡς ἐτῶν δώδεκα καὶ αὐτὴ ἀπέθνῃσκεν. Ἐν δὲ τῷ ὑπάγειν αὐτὸν οἱ ὄχλοι συνέπνιγον αὐτόν. &lt;…&gt; Ἔτι αὐτοῦ λαλοῦντος ἔρχεταί τις παρὰ τοῦ ἀρχισυναγώγου λέγων ὅτι <strong>Τέθνηκεν ἡ θυγάτηρ σου</strong>, μηκέτι σκύλλε τὸν διδάσκαλον. ὁ δὲ Ἰησοῦς ἀκούσας ἀπεκρίθη αὐτῷ, <strong>Μὴ φοβοῦ, μόνον πίστευσον, καὶ σωθήσεται</strong>. ἐλθὼν δὲ εἰς τὴν οἰκίαν οὐκ ἀφῆκεν εἰσελθεῖν τινα σὺν αὐτῷ εἰ μὴ Πέτρον καὶ Ἰωάννην καὶ Ἰάκωβον καὶ τὸν πατέρα τῆς παιδὸς καὶ τὴν μητέρα. ἔκλαιον δὲ πάντες καὶ ἐκόπτοντο αὐτήν. ὁ δὲ εἶπεν, Μὴ κλαίετε, οὐ γὰρ ἀπέθανεν ἀλλὰ καθεύδει. καὶ κατεγέλων αὐτοῦ, εἰδότες ὅτι ἀπέθανεν. αὐτὸς δὲ κρατήσας τῆς χειρὸς αὐτῆς ἐφώνησεν λέγων, Ἡ παῖς, ἔγειρε. καὶ ἐπέστρεψεν τὸ πνεῦμα αὐτῆς, καὶ ἀνέστη παραχρῆμα, καὶ διέταξεν αὐτῇ δοθῆναι φαγεῖν.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/8/#L41-42,49-55">Λκ 8:41-42,49-55</a>)</p></blockquote><h2>Ο βασιλικός αξιωματούχος και ο γιος του</h2><p>Πιστεύει και παρακαλεί ο βασιλικός, αλλά θεραπεύεται ο γιος του:</p><blockquote><p>«Ἦλθεν οὖν πάλιν εἰς τὴν Κανὰ τῆς Γαλιλαίας, ὅπου ἐποίησεν τὸ ὕδωρ οἶνον. καὶ ἦν τις βασιλικὸς οὗ <strong>ὁ υἱὸς ἠσθένει</strong> ἐν Καφαρναούμ· οὗτος ἀκούσας ὅτι Ἰησοῦς ἥκει ἐκ τῆς Ἰουδαίας εἰς τὴν Γαλιλαίαν ἀπῆλθεν πρὸς αὐτὸν καὶ ἠρώτα ἵνα καταβῇ καὶ ἰάσηται αὐτοῦ τὸν υἱόν, ἤμελλεν γὰρ ἀποθνῄσκειν. εἶπεν οὖν ὁ Ἰησοῦς πρὸς αὐτόν, Ἐὰν μὴ σημεῖα καὶ τέρατα ἴδητε, οὐ μὴ πιστεύσητε. λέγει πρὸς αὐτὸν ὁ βασιλικός, Κύριε, κατάβηθι πρὶν ἀποθανεῖν τὸ παιδίον μου. λέγει αὐτῷ ὁ Ἰησοῦς, Πορεύου· ὁ υἱός σου ζῇ. <strong>ἐπίστευσεν</strong> ὁ ἄνθρωπος τῷ λόγῳ ὃν εἶπεν αὐτῷ ὁ Ἰησοῦς καὶ ἐπορεύετο.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/4/#L46-50">Ιω 4:46-50</a>)</p></blockquote><h2>Συμπεράσματα</h2><p>Έτσι, ο Σωτήρας περίμενε την πίστη των γονέων για να δείξει τη θεία ενέργεια στα παιδιά τους. Και με το αίτημα και την πίστη των γονέων η θεία χάρη ενεργούσε στα παιδιά τους.</p>
