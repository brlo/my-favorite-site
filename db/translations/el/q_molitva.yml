  update: true
  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: '<h2>Οι προσευχές μπορούν να είναι μακρές</h2><h3>Η εντολή να προσεύχεται κανείς πάντοτε</h3><blockquote><p>«Πάντοτε χαίρετε, <strong>ἀδιαλείπτως προσεύχεσθε</strong>, ἐν παντὶ εὐχαριστεῖτε· τοῦτο γὰρ θέλημα θεοῦ ἐν Χριστῷ Ἰησοῦ εἰς ὑμᾶς.» (<a href="https://bibleox.com/el/gr-lxx-byz/1sol/5/#L16-18">Α Θεσ 5:16-18</a>)</p></blockquote><blockquote><p>«διὰ πάσης προσευχῆς καὶ δεήσεως <strong>προσευχόμενοι ἐν παντὶ καιρῷ</strong> ἐν πνεύματι, καὶ εἰς αὐτὸ ἀγρυπνοῦντες ἐν πάσῃ προσκαρτερήσει καὶ δεήσει περὶ πάντων τῶν ἁγίων» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/6/#L18">Εφ 6:18</a>)</p></blockquote><h3>Ο Κύριος Ιησούς Χριστός προσευχόταν επί πολύ μακρό χρόνο</h3><p>Προσευχήθηκε όλη τη νύχτα:</p><blockquote><p>«Ἐγένετο δὲ ἐν ταῖς ἡμέραις ταύταις ἐξελθεῖν αὐτὸν εἰς τὸ ὄρος προσεύξασθαι, καὶ ἦν <strong>διανυκτερεύων ἐν τῇ προσευχῇ</strong> τοῦ θεοῦ.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/6/#L12">Λκ 6:12</a>)</p></blockquote><p>Προσευχήθηκε από το βράδυ σχεδόν μέχρι το πρωί. Η νύχτα χωρίζεται σε τέσσερα μέρη ή φυλακές (βάρδιες). Η τέταρτη φυλακή (βάρδια) είναι το τελευταίο μέρος της νύχτας, σχεδόν το πρωί. Ο Χριστός προσευχήθηκε σχεδόν όλη τη νύχτα:</p><blockquote><p>«καὶ ἀπολύσας τοὺς ὄχλους ἀνέβη εἰς τὸ ὄρος κατ᾿ ἰδίαν <strong>προσεύξασθαι</strong>. <strong>ὀψίας</strong> δὲ γενομένης μόνος ἦν ἐκεῖ. &lt;…&gt; <strong>τετάρτῃ δὲ φυλακῇ τῆς νυκτὸς</strong> ἦλθεν πρὸς αὐτοὺς περιπατῶν ἐπὶ τὴν θάλασσαν.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/14/#L23,25">Μτ 14:23,25</a>)</p></blockquote><p>Ο Χριστός, μετά από μία ώρα προσευχής, ήρθε να ξυπνήσει τους αποστόλους, και αυτό επαναλήφθηκε άλλες δύο φορές. Μπορούμε να υποθέσουμε ότι προσευχήθηκε περίπου τρεις ώρες:</p><blockquote><p>«Καὶ ἔρχονται εἰς χωρίον οὗ τὸ ὄνομα Γεθσημανί, καὶ λέγει τοῖς μαθηταῖς αὐτοῦ, Καθίσατε ὧδε ἕως <strong>προσεύξωμαι</strong>. &lt;…&gt; καὶ προελθὼν μικρὸν <strong>ἔπιπτεν ἐπὶ τῆς γῆς, καὶ προσηύχετο</strong> ἵνα εἰ δυνατόν ἐστιν παρέλθῃ ἀπ᾿ αὐτοῦ ἡ ὥρα, &lt;…&gt; καὶ ἔρχεται καὶ εὑρίσκει αὐτοὺς καθεύδοντας, καὶ λέγει τῷ Πέτρῳ, Σίμων, καθεύδεις; οὐκ ἴσχυσας <strong><mark>μίαν ὥραν</mark></strong> γρηγορῆσαι; &lt;…&gt; καὶ <strong><mark>πάλιν</mark> ἀπελθὼν προσηύξατο</strong> τὸν αὐτὸν λόγον εἰπών. καὶ πάλιν ἐλθὼν εὗρεν αὐτοὺς καθεύδοντας, ἦσαν γὰρ αὐτῶν οἱ ὀφθαλμοὶ καταβαρυνόμενοι, καὶ οὐκ ᾔδεισαν τί ἀποκριθῶσιν αὐτῷ. καὶ ἔρχεται <strong><mark>τὸ τρίτον</mark></strong> καὶ λέγει αὐτοῖς, Καθεύδετε τὸ λοιπὸν καὶ ἀναπαύεσθε; ἀπέχει· ἦλθεν ἡ ὥρα, ἰδοὺ παραδίδοται ὁ υἱὸς τοῦ ἀνθρώπου εἰς τὰς χεῖρας τῶν ἁμαρτωλῶν.» (<a href="https://bibleox.com/el/gr-lxx-byz/mk/14/#L32,35,37,39-41">Μκ 14:32,35,37,39-41</a>)</p></blockquote><h3>Οι παραβολές</h3><p>Αφού έδωσε το υπόδειγμα της προσευχής — «Πάτερ ημών», ο Κύριος πρόσθεσε αμέσως την παραβολή για την επιμονή και την υπομονή στην προσευχή:</p><blockquote><p>«Καὶ εἶπεν πρὸς αὐτούς, Τίς ἐξ ὑμῶν ἕξει φίλον καὶ πορεύσεται πρὸς αὐτὸν μεσονυκτίου καὶ εἴπῃ αὐτῷ, Φίλε, χρῆσόν μοι τρεῖς ἄρτους, ἐπειδὴ φίλος μου παρεγένετο ἐξ ὁδοῦ πρός με καὶ οὐκ ἔχω ὃ παραθήσω αὐτῷ· κἀκεῖνος ἔσωθεν ἀποκριθεὶς εἴπῃ, Μή μοι κόπους πάρεχε· ἤδη ἡ θύρα κέκλεισται, καὶ τὰ παιδία μου μετ᾿ ἐμοῦ εἰς τὴν κοίτην εἰσίν· οὐ δύναμαι ἀναστὰς δοῦναί σοι. λέγω ὑμῖν, εἰ καὶ οὐ δώσει αὐτῷ ἀναστὰς διὰ τὸ εἶναι φίλον αὐτοῦ, <strong>διά γε τὴν ἀναίδειαν αὐτοῦ ἐγερθεὶς δώσει</strong> αὐτῷ ὅσων χρῄζει.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/11/#L5-8">Λκ 11:5-8</a>)</p></blockquote><p>Η παραβολή για τη χήρα και τον κριτή:</p><blockquote><p>«Ἔλεγεν δὲ παραβολὴν αὐτοῖς πρὸς τὸ <strong>δεῖν πάντοτε προσεύχεσθαι αὐτοὺς καὶ μὴ ἐγκακεῖν</strong>, λέγων, Κριτής τις ἦν ἔν τινι πόλει τὸν θεὸν μὴ φοβούμενος καὶ ἄνθρωπον μὴ ἐντρεπόμενος. χήρα δὲ ἦν ἐν τῇ πόλει ἐκείνῃ καὶ ἤρχετο πρὸς αὐτὸν λέγουσα, Ἐκδίκησόν με ἀπὸ τοῦ ἀντιδίκου μου. καὶ οὐκ ἤθελεν ἐπὶ χρόνον, μετὰ δὲ ταῦτα εἶπεν ἐν ἑαυτῷ, Εἰ καὶ τὸν θεὸν οὐ φοβοῦμαι οὐδὲ ἄνθρωπον ἐντρέπομαι, διά γε τὸ παρέχειν μοι κόπον τὴν χήραν ταύτην ἐκδικήσω αὐτήν, ἵνα μὴ εἰς τέλος ἐρχομένη ὑπωπιάζῃ με. Εἶπεν δὲ ὁ κύριος, Ἀκούσατε τί ὁ κριτὴς τῆς ἀδικίας λέγει· ὁ δὲ θεὸς οὐ μὴ ποιήσῃ τὴν ἐκδίκησιν τῶν ἐκλεκτῶν αὐτοῦ τῶν <strong>βοώντων αὐτῷ ἡμέρας καὶ νυκτός</strong>, καὶ μακροθυμεῖ ἐπ᾿ αὐτοῖς;» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/18/#L1-7">Λκ 18:1-7</a>)</p></blockquote><h2>Οι προσευχές μπορούν να είναι σύντομες</h2><p>Μετά την παραβολή για τη χήρα και τον κριτή, που μιλά για την ανάγκη συνεχούς και επίμονης προσευχής, ο Κύριος φέρνει την παραβολή για τη σύντομη προσευχή του τελώνη που Του είναι ευάρεστη, αν και η ίδια η παραβολή, όπως εξηγεί ο Ευαγγελιστής, αφορά εκείνους που μάταια είναι βέβαιοι για τη δικαιοσύνη τους. Τελικά, ο Χριστός δείχνει αμέσως με τι ευαρέστησε τον Θεό ο τελώνης: με τη χαμηλή γνώμη για τον εαυτό του και τη δικαιοσύνη του:</p><blockquote><p>«Εἶπεν δὲ καὶ πρός τινας τοὺς <strong>πεποιθότας ἐφ᾿ ἑαυτοῖς ὅτι εἰσὶν δίκαιοι καὶ ἐξουθενοῦντας τοὺς λοιποὺς</strong> τὴν παραβολὴν ταύτην· Ἄνθρωποι δύο ἀνέβησαν εἰς τὸ ἱερὸν προσεύξασθαι, ὁ εἷς Φαρισαῖος καὶ ὁ ἕτερος τελώνης. ὁ Φαρισαῖος σταθεὶς πρὸς ἑαυτὸν ταῦτα προσηύχετο, Ὁ θεός, εὐχαριστῶ σοι ὅτι οὐκ εἰμὶ ὥσπερ οἱ λοιποὶ τῶν ἀνθρώπων, ἅρπαγες, ἄδικοι, μοιχοί, ἢ καὶ ὡς οὗτος ὁ τελώνης· νηστεύω δὶς τοῦ σαββάτου, ἀποδεκατῶ πάντα ὅσα κτῶμαι. ὁ δὲ τελώνης μακρόθεν ἑστὼς οὐκ ἤθελεν οὐδὲ τοὺς ὀφθαλμοὺς ἐπᾶραι εἰς τὸν οὐρανόν, ἀλλ᾿ ἔτυπτεν τὸ στῆθος αὐτοῦ λέγων, <strong>Ὁ θεός, ἱλάσθητί μοι τῷ ἁμαρτωλῷ</strong>. λέγω ὑμῖν, κατέβη οὗτος δεδικαιωμένος εἰς τὸν οἶκον αὐτοῦ παρ᾿ ἐκεῖνον· ὅτι <strong><mark>πᾶς ὁ ὑψῶν ἑαυτὸν ταπεινωθήσεται, ὁ δὲ ταπεινῶν ἑαυτὸν ὑψωθήσεται</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/18/#L9-14">Λκ 18:9-14</a>)</p></blockquote><h2>Η κριτική</h2><h3>Να μη πολυλογούμε</h3><p>Στο Ευαγγέλιο του Ματθαίου, πριν από την προσευχή «Πάτερ ημών», είναι γραμμένα τα λόγια του Χριστού ότι δεν πρέπει να λέει κανείς περιττά στην προσευχή:</p><blockquote><p>«Προσευχόμενοι δὲ <strong>μὴ βατταλογήσητε</strong> ὥσπερ οἱ ἐθνικοί, δοκοῦσιν γὰρ ὅτι <strong>ἐν τῇ πολυλογίᾳ αὐτῶν</strong> εἰσακουσθήσονται.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/6/#L7">Μτ 6:7</a>)</p></blockquote><p>Εδώ γίνεται λόγος για την ανάγκη να μη λέει κανείς περιττά, να μη ζητά με λεπτομέρειες για τις επίγειες ανάγκες, τις οποίες ο Θεός γνωρίζει ήδη. Ο ίδιος ο Κύριος όμως προσευχόταν πολύ, και μερικές φορές επαναλάμβανε τις προσευχές Του:</p><blockquote><p><em>«καὶ </em><strong><em>πάλιν</em></strong><em> ἀπελθὼν προσηύξατο </em><strong><em>τὸν αὐτὸν λόγον εἰπών</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/mk/14/#L39"><em>Μκ 14:39</em></a><em>)</em></p></blockquote><p>Βλ. επίσης: <a href="https://bibleox.com/el/el/w/Η_προσευχή#HH-Η-απουσία-κενής-πολυλογίας">Η απουσία κενής πολυλογίας</a>.</p>'
