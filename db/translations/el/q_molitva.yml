  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: '<h2>Η εντολή για την προσευχή</h2><h3>Η δεητική προσευχή</h3><blockquote><p>«<strong><mark>Αἰτεῖτε, καὶ δοθήσεται ὑμῖν</mark></strong>· ζητεῖτε, καὶ εὑρήσετε· <strong>κρούετε, καὶ ἀνοιγήσεται ὑμῖν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/7/#L7">Μτ 7:7</a> · <a href="https://bibleox.com/el/gr-lxx-byz/lk/11/#L9">Λκ 11:9</a>)</p></blockquote><h3>Η ευχαριστήρια προσευχή</h3><blockquote><p>«<strong>ἀδιαλείπτως προσεύχεσθε, <mark>ἐν παντὶ εὐχαριστεῖτε</mark>· τοῦτο γὰρ θέλημα θεοῦ</strong> ἐν Χριστῷ Ἰησοῦ εἰς ὑμᾶς.» (<a href="https://bibleox.com/el/gr-lxx-byz/1sol/5/#L17-18">Α Θεσ 5:17-18</a>)</p></blockquote><blockquote><p>«μηδὲν μεριμνᾶτε, ἀλλ᾿ ἐν παντὶ <strong>τῇ προσευχῇ καὶ τῇ δεήσει μετὰ <mark>εὐχαριστίας</mark></strong> τὰ αἰτήματα ὑμῶν γνωριζέσθω πρὸς τὸν θεόν.» (<a href="https://bibleox.com/el/gr-lxx-byz/fil/4/#L6">Φιλ 4:6</a>)</p></blockquote><blockquote><p>«καὶ μὴ μεθύσκεσθε οἴνῳ, ἐν ᾧ ἐστιν ἀσωτία, ἀλλὰ πληροῦσθε ἐν πνεύματι, λαλοῦντες ἑαυτοῖς [ἐν] ψαλμοῖς καὶ ὕμνοις καὶ ᾠδαῖς πνευματικαῖς, ᾄδοντες καὶ ψάλλοντες τῇ καρδίᾳ ὑμῶν τῷ κυρίῳ, <strong><mark>εὐχαριστοῦντες πάντοτε ὑπὲρ πάντων</mark></strong> ἐν ὀνόματι τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ τῷ θεῷ καὶ πατρί» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/5/#L18-20">Εφ 5:18-20</a>)</p></blockquote><blockquote><p>«καὶ πᾶν ὅ τι ἐὰν ποιῆτε ἐν λόγῳ ἢ ἐν ἔργῳ, πάντα ἐν ὀνόματι κυρίου Ἰησοῦ, <strong><mark>εὐχαριστοῦντες τῷ θεῷ πατρὶ δι᾿ αὐτοῦ</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/kol/3/#L17">Κολ 3:17</a>)</p></blockquote><h3>Η δοξολογική προσευχή</h3><blockquote><p>«εἰσέλθατε εἰς τὰς πύλας αὐτοῦ ἐν <strong><mark>ἐξομολογήσει</mark></strong>, εἰς τὰς αὐλὰς αὐτοῦ ἐν ὕμνοις· <strong><mark>ἐξομολογεῖσθε αὐτῷ, αἰνεῖτε τὸ ὄνομα αὐτοῦ</mark></strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/99/#L4">Ψλ 99:4</a>)</p></blockquote><blockquote><p>«<strong><mark>Εὐλογήσω τὸν κύριον ἐν παντὶ καιρῷ, διὰ παντὸς ἡ αἴνεσις αὐτοῦ ἐν τῷ στόματί μου</mark></strong>. ἐν τῷ κυρίῳ ἐπαινεσθήσεται ἡ ψυχή μου· ἀκουσάτωσαν πραεῖς καὶ εὐφρανθήτωσαν.» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/33/#L1-2">Ψλ 33:1-2</a>)</p></blockquote><blockquote><p>«δι᾿ αὐτοῦ οὖν <strong>ἀναφέρωμεν θυσίαν <mark>αἰνέσεως</mark> διὰ παντὸς τῷ θεῷ</strong>, τοῦτ᾿ ἔστιν καρπὸν χειλέων <strong><mark>ὁμολογούντων τῷ ὀνόματι αὐτοῦ</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/13/#L15">Εβρ 13:15</a>)</p></blockquote><h2>Η συνεχής προσευχή και η θεία μελέτη</h2><blockquote><p>«διὰ πάσης προσευχῆς καὶ δεήσεως <strong><mark>προσευχόμενοι ἐν παντὶ καιρῷ</mark> ἐν πνεύματι</strong>, καὶ εἰς αὐτὸ ἀγρυπνοῦντες ἐν πάσῃ προσκαρτερήσει καὶ δεήσει περὶ πάντων τῶν ἁγίων» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/6/#L18">Εφ 6:18</a>)</p></blockquote><blockquote><p>«<strong><mark>ἀδιαλείπτως προσεύχεσθε</mark></strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/1sol/5/#L17">Α Θεσ 5:17</a>)</p></blockquote><blockquote><p>«Ἔλεγεν δὲ παραβολὴν αὐτοῖς πρὸς τὸ <strong><mark>δεῖν πάντοτε προσεύχεσθαι</mark> αὐτοὺς καὶ μὴ ἐγκακεῖν</strong>, λέγων, Κριτής τις ἦν ἔν τινι πόλει τὸν θεὸν μὴ φοβούμενος καὶ ἄνθρωπον μὴ ἐντρεπόμενος. χήρα δὲ ἦν ἐν τῇ πόλει ἐκείνῃ καὶ ἤρχετο πρὸς αὐτὸν λέγουσα, Ἐκδίκησόν με ἀπὸ τοῦ ἀντιδίκου μου. καὶ οὐκ ἤθελεν ἐπὶ χρόνον, μετὰ δὲ ταῦτα εἶπεν ἐν ἑαυτῷ, Εἰ καὶ τὸν θεὸν οὐ φοβοῦμαι οὐδὲ ἄνθρωπον ἐντρέπομαι, διά γε τὸ παρέχειν μοι κόπον τὴν χήραν ταύτην ἐκδικήσω αὐτήν, ἵνα μὴ εἰς τέλος ἐρχομένη ὑπωπιάζῃ με. Εἶπεν δὲ ὁ κύριος, Ἀκούσατε τί ὁ κριτὴς τῆς ἀδικίας λέγει· <strong>ὁ δὲ θεὸς οὐ μὴ ποιήσῃ τὴν ἐκδίκησιν τῶν ἐκλεκτῶν αὐτοῦ τῶν βοώντων αὐτῷ ἡμέρας καὶ νυκτός, καὶ μακροθυμεῖ ἐπ᾿ αὐτοῖς</strong>;» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/18/#L1-7">Λκ 18:1-7</a>)</p></blockquote><h2>Ποια προσευχή εισακούεται</h2><h3>Η πίστη</h3><blockquote><p>«Εἰ δέ τις ὑμῶν λείπεται σοφίας, αἰτείτω παρὰ τοῦ διδόντος θεοῦ πᾶσιν ἁπλῶς καὶ μὴ ὀνειδίζοντος, καὶ δοθήσεται αὐτῷ. <strong><mark>αἰτείτω δὲ ἐν πίστει</mark>, μηδὲν διακρινόμενος, ὁ γὰρ διακρινόμενος ἔοικεν κλύδωνι θαλάσσης</strong> ἀνεμιζομένῳ καὶ ῥιπιζομένῳ· <strong>μὴ γὰρ οἰέσθω ὁ ἄνθρωπος ἐκεῖνος ὅτι λήμψεταί τι παρὰ τοῦ κυρίου</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/iak/1/#L5-7">Ιακ 1:5-7</a>)</p></blockquote><blockquote><p>«καὶ πάντα ὅσα ἂν <strong><mark>αἰτήσητε ἐν τῇ προσευχῇ πιστεύοντες</mark></strong> λήμψεσθε.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/21/#L22">Μτ 21:22</a> · <a href="https://bibleox.com/el/gr-lxx-byz/mk/11/#L24">Μκ 11:24</a>)</p></blockquote><h3>Η δικαιοσύνη (η ζωή κατά το θέλημα του Θεού, η απομάκρυνση από την αμαρτία)</h3><blockquote><p><em>«θυσίαι ἀσεβῶν βδέλυγμα κυρίῳ, </em><strong><em>εὐχαὶ δὲ <mark>κατευθυνόντων</mark> δεκταὶ παρ᾿ αὐτῷ</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/pr/15/#L8"><em>Πρμ 15:8</em></a><em>)</em></p></blockquote><blockquote><p><em>«μακρὰν ἀπέχει ὁ θεὸς ἀπὸ ἀσεβῶν, </em><strong><em>εὐχαῖς δὲ <mark>δικαίων</mark> ἐπακούει</em></strong><em>» (</em><a href="https://bibleox.com/el/gr-lxx-byz/pr/15/#L29"><em>Πρμ 15:29</em></a><em>)</em></p></blockquote><blockquote><p>«<strong><mark>ἐὰν</mark></strong> <strong><mark>μείνητε ἐν ἐμοὶ</mark> καὶ τὰ ῥήματά μου ἐν ὑμῖν μείνῃ</strong>, ὃ ἐὰν θέλητε αἰτήσασθε καὶ γενήσεται ὑμῖν.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/15/#L7">Ιω 15:7</a>)</p></blockquote><blockquote><p>«Καὶ εἶπεν κύριος Ἐγγίζει μοι ὁ λαὸς οὗτος <strong>τοῖς χείλεσιν αὐτῶν τιμῶσίν με, ἡ δὲ καρδία αὐτῶν πόρρω ἀπέχει ἀπ᾿ ἐμοῦ</strong>, μάτην δὲ σέβονταί με διδάσκοντες ἐντάλματα ἀνθρώπων καὶ διδασκαλίας.» (<a href="https://bibleox.com/el/gr-lxx-byz/is/29/#L13">Ησ 29:13</a>)</p></blockquote><h3>Η ταπεινή και συντετριμμένη καρδιά</h3><blockquote><p>«θυσία τῷ θεῷ <strong><mark>πνεῦμα συντετριμμένον, καρδίαν συντετριμμένην καὶ τεταπεινωμένην</mark> ὁ θεὸς οὐκ ἐξ ουθενώσει</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/50/#L17">Ψλ 50:17</a>)</p></blockquote><blockquote><p><em>«</em><strong><em><mark>θέλημα τῶν φοβουμένων αὐτὸν ποιήσει καὶ τῆς δεήσεως αὐτῶν ἐπακούσεται</mark></em></strong><em> καὶ σώσει αὐτούς.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/ps/144/#L19"><em>Ψλ 144:19</em></a><em>)</em> — Στην έκδοση των Εβδομήκοντα ο Ψαλμός 9 σταματά στον στίχο 20· γι’ αυτό παραθέτουμε τον κοντινό σε νόημα στίχο 144:19.</p></blockquote><blockquote><p><em>«</em><strong><em><mark>προσευχὴ ταπεινοῦ νεφέλας διῆλθεν</mark></em></strong><em>, καὶ ἕως συνεγγίσῃ, οὐ μὴ παρακληθῇ·» (</em><a href="https://bibleox.com/el/gr-lxx-byz/prsir/35/#L17"><em>Σ.Σειρ 35:17</em></a><em>)</em></p></blockquote><blockquote><p><em>«πάντα γὰρ ταῦτα ἐποίησεν ἡ χείρ μου, καὶ ἔστιν ἐμὰ πάντα ταῦτα, λέγει κύριος· καὶ </em><strong><em>ἐπὶ τίνα <mark>ἐπιβλέψω ἀλλ᾿ ἢ ἐπὶ τὸν ταπεινὸν</mark></em></strong><em> καὶ ἡσύχιον καὶ τρέμοντα τοὺς λόγους μου;» (</em><a href="https://bibleox.com/el/gr-lxx-byz/is/66/#L2"><em>Ησ 66:2</em></a><em>)</em></p></blockquote><blockquote><p><em>«ἴσως </em><strong><em><mark>πεσεῖται ἔλεος αὐτῶν</mark></em></strong><em> κατὰ πρόσωπον κυρίου, καὶ ἀποστρέψουσιν ἐκ τῆς ὁδοῦ αὐτῶν τῆς πονηρᾶς, ὅτι μέγας ὁ θυμὸς καὶ ἡ ὀργὴ κυρίου, ἣν ἐλάλησεν ἐπὶ τὸν λαὸν τοῦτον.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/ier/43/#L7"><em>Ιερ 43:7</em></a><em>)</em> — Στην έκδοση των Εβδομήκοντα ο στίχος βρίσκεται στο κεφάλαιο 43, ενώ η σλαβονική και η ρωσική μετάφραση τον αριθμούν 36:7.</p></blockquote><blockquote><p><em>«ἀλλ᾿ ἐν ψυχῇ συντετριμμένῃ καὶ </em><strong><em><mark>πνεύματι τεταπεινωμένῳ</mark> <mark>προσδεχθείημεν</mark></em></strong><em> ὡς ἐν ὁλοκαυτώμασι κριῶν καὶ ταύρων καὶ ὡς ἐν μυριάσιν ἀρνῶν πιόνων·» (</em><a href="https://bibleox.com/el/gr-lxx-byz/dan/3/#L39"><em>Δν 3:39</em></a><em>)</em></p></blockquote><blockquote><p>«<strong>Εἶπεν δὲ καὶ πρός τινας τοὺς <mark>πεποιθότας ἐφ᾿ ἑαυτοῖς ὅτι εἰσὶν δίκαιοι καὶ ἐξουθενοῦντας τοὺς λοιποὺς</mark></strong> τὴν παραβολὴν ταύτην· Ἄνθρωποι δύο ἀνέβησαν εἰς τὸ ἱερὸν προσεύξασθαι, ὁ εἷς Φαρισαῖος καὶ ὁ ἕτερος τελώνης. <strong>ὁ Φαρισαῖος σταθεὶς πρὸς ἑαυτὸν ταῦτα προσηύχετο</strong>, Ὁ θεός, εὐχαριστῶ σοι ὅτι <strong><mark>οὐκ εἰμὶ ὥσπερ οἱ λοιποὶ τῶν ἀνθρώπων</mark></strong>, ἅρπαγες, ἄδικοι, μοιχοί, ἢ καὶ ὡς οὗτος ὁ τελώνης· νηστεύω δὶς τοῦ σαββάτου, ἀποδεκατῶ πάντα ὅσα κτῶμαι. <strong>ὁ δὲ τελώνης μακρόθεν ἑστὼς οὐκ ἤθελεν οὐδὲ τοὺς ὀφθαλμοὺς ἐπᾶραι εἰς τὸν οὐρανόν</strong>, ἀλλ᾿ ἔτυπτεν τὸ στῆθος αὐτοῦ λέγων, <strong>Ὁ θεός, ἱλάσθητί μοι τῷ ἁμαρτωλῷ</strong>. λέγω ὑμῖν, κατέβη οὗτος δεδικαιωμένος εἰς τὸν οἶκον αὐτοῦ παρ᾿ ἐκεῖνον· ὅτι πᾶς ὁ ὑψῶν ἑαυτὸν ταπεινωθήσεται, ὁ δὲ ταπεινῶν ἑαυτὸν ὑψωθήσεται.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/18/#L9-14">Λκ 18:9-14</a>)</p></blockquote><p>Βλ. επίσης: <a href="https://bibleox.com/el/el/w/Η_ταπείνωση">Η ταπείνωση</a>.</p><h3>Η συγχώρηση όλων των προσβολών</h3><blockquote><p>«καὶ <strong>ὅταν στήκετε προσευχόμενοι, <mark>ἀφίετε</mark> εἴ τι ἔχετε κατά τινος</strong>, <strong>ἵνα καὶ ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς ἀφῇ ὑμῖν τὰ παραπτώματα ὑμῶν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mk/11/#L25">Μκ 11:25</a>) — Στο κριτικό κείμενο που παραθέτουμε λείπει ο στίχος 26· γι’ αυτό η παράθεση περιορίζεται στον στίχο 25.</p></blockquote><blockquote><p>«<strong><mark>Ἐὰν γὰρ ἀφῆτε</mark> τοῖς ἀνθρώποις τὰ παραπτώματα αὐτῶν, ἀφήσει καὶ ὑμῖν ὁ πατὴρ ὑμῶν ὁ οὐράνιος</strong>·» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/6/#L14">Μτ 6:14</a>)</p></blockquote><h3>Η ειρήνη με τους πλησίον</h3><blockquote><p>«ἐὰν οὖν προσφέρῃς τὸ δῶρόν σου ἐπὶ τὸ θυσιαστήριον κἀκεῖ μνησθῇς ὅτι ὁ ἀδελφός σου ἔχει τι κατὰ σοῦ, ἄφες ἐκεῖ τὸ δῶρόν σου ἔμπροσθεν τοῦ θυσιαστηρίου, καὶ <strong><mark>ὕπαγε πρῶτον διαλλάγηθι τῷ ἀδελφῷ σου</mark>, καὶ τότε ἐλθὼν πρόσφερε τὸ δῶρόν σου</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/5/#L23-24">Μτ 5:23-24</a>)</p></blockquote><blockquote><p>«<strong>Οἱ ἄνδρες ὁμοίως συνοικοῦντες κατὰ γνῶσιν</strong>, ὡς ἀσθενεστέρῳ σκεύει τῷ γυναικείῳ <strong>ἀπονέμοντες τιμήν</strong>, ὡς καὶ συγκληρονόμοις χάριτος ζωῆς, <strong>εἰς τὸ μὴ ἐγκόπτεσθαι τὰς προσευχὰς ὑμῶν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1pet/3/#L7">Α Πε 3:7</a>)</p></blockquote><h3>Η υπομονή</h3><blockquote><p>«Ἔλεγεν δὲ παραβολὴν αὐτοῖς πρὸς τὸ <strong><mark>δεῖν πάντοτε προσεύχεσθαι αὐτοὺς καὶ μὴ ἐγκακεῖν</mark></strong>, λέγων, Κριτής τις ἦν ἔν τινι πόλει τὸν θεὸν μὴ φοβούμενος καὶ ἄνθρωπον μὴ ἐντρεπόμενος. χήρα δὲ ἦν ἐν τῇ πόλει ἐκείνῃ καὶ ἤρχετο πρὸς αὐτὸν λέγουσα, Ἐκδίκησόν με ἀπὸ τοῦ ἀντιδίκου μου. καὶ οὐκ ἤθελεν ἐπὶ χρόνον, μετὰ δὲ ταῦτα εἶπεν ἐν ἑαυτῷ, Εἰ καὶ τὸν θεὸν οὐ φοβοῦμαι οὐδὲ ἄνθρωπον ἐντρέπομαι, διά γε τὸ παρέχειν μοι κόπον τὴν χήραν ταύτην ἐκδικήσω αὐτήν, ἵνα μὴ εἰς τέλος ἐρχομένη ὑπωπιάζῃ με. Εἶπεν δὲ ὁ κύριος, Ἀκούσατε τί ὁ κριτὴς τῆς ἀδικίας λέγει· <strong>ὁ δὲ θεὸς οὐ μὴ ποιήσῃ τὴν ἐκδίκησιν τῶν ἐκλεκτῶν αὐτοῦ τῶν βοώντων αὐτῷ ἡμέρας καὶ νυκτός, καὶ μακροθυμεῖ ἐπ᾿ αὐτοῖς</strong>;» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/18/#L1-7">Λκ 18:1-7</a>)</p></blockquote><blockquote><p>«Καὶ εἶπεν πρὸς αὐτούς, Τίς ἐξ ὑμῶν ἕξει φίλον καὶ πορεύσεται πρὸς αὐτὸν μεσονυκτίου καὶ εἴπῃ αὐτῷ, Φίλε, χρῆσόν μοι τρεῖς ἄρτους, ἐπειδὴ φίλος μου παρεγένετο ἐξ ὁδοῦ πρός με καὶ οὐκ ἔχω ὃ παραθήσω αὐτῷ· κἀκεῖνος ἔσωθεν ἀποκριθεὶς εἴπῃ, Μή μοι κόπους πάρεχε· ἤδη ἡ θύρα κέκλεισται, καὶ τὰ παιδία μου μετ᾿ ἐμοῦ εἰς τὴν κοίτην εἰσίν· οὐ δύναμαι ἀναστὰς δοῦναί σοι. λέγω ὑμῖν, εἰ καὶ οὐ δώσει αὐτῷ ἀναστὰς διὰ τὸ εἶναι φίλον αὐτοῦ, <strong><mark>διά γε τὴν ἀναίδειαν αὐτοῦ ἐγερθεὶς δώσει αὐτῷ ὅσων χρῄζει</mark>. κἀγὼ ὑμῖν λέγω, αἰτεῖτε, καὶ δοθήσεται ὑμῖν</strong>· ζητεῖτε, καὶ εὑρήσετε· κρούετε, καὶ ἀνοιγήσεται ὑμῖν. πᾶς γὰρ ὁ αἰτῶν λαμβάνει, καὶ ὁ ζητῶν εὑρίσκει, καὶ τῷ κρούοντι ἀνοίγεται.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/11/#L5-10">Λκ 11:5-10</a>)</p></blockquote><h3>Η ελεημοσύνη (η έμπρακτη βοήθεια στους ενδεείς)</h3><blockquote><p>«<strong>ἀγαθὸν προσευχὴ μετὰ νηστείας καὶ <mark>ἐλεημοσύνης</mark> καὶ δικαιοσύνης</strong>· ἀγαθὸν τὸ ὀλίγον μετὰ δικαιοσύνης ἢ πολὺ μετὰ ἀδικίας· καλὸν ποιῆσαι ἐλεημοσύνην ἢ θησαυρίσαι χρυσίον.» (<a href="https://bibleox.com/el/gr-lxx-byz/tov/12/#L8">Τωβ 12:8</a>)</p></blockquote><blockquote><p>«Μακάριος <strong>ὁ συνίων ἐπὶ πτωχὸν καὶ πένητα</strong>· ἐν ἡμέρᾳ πονηρᾷ ῥύσεται αὐτὸν ὁ κύριος. κύριος διαφυλάξαι αὐτὸν καὶ ζήσαι αὐτὸν καὶ μακαρίσαι αὐ τὸν ἐν τῇ γῇ καὶ μὴ παραδῴη αὐτὸν εἰς χεῖρας ἐχθροῦ αὐτοῦ.» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/40/#L1-2">Ψλ 40:1-2</a>)</p></blockquote><blockquote><p>«δανίζει θεῷ <strong>ὁ ἐλεῶν</strong> πτωχόν, κατὰ δὲ τὸ δόμα αὐτοῦ <strong>ἀνταποδώσει</strong> αὐτῷ.» (<a href="https://bibleox.com/el/gr-lxx-byz/pr/19/#L17">Πρμ 19:17</a>)</p></blockquote><blockquote><p>«<strong>ὅταν τὰς χεῖρας ἐκτείνητε πρός με, ἀποστρέψω τοὺς ὀφθαλμούς μου ἀφ᾿ ὑμῶν, καὶ ἐὰν πληθύνητε τὴν δέησιν, οὐκ εἰσακούσομαι ὑμῶν</strong>· αἱ γὰρ χεῖρες ὑμῶν αἵματος πλήρεις. λούσασθε, καθαροὶ γένεσθε, ἀφέλετε τὰς πονηρίας ἀπὸ τῶν ψυχῶν ὑμῶν ἀπέναντι τῶν ὀφθαλμῶν μου, παύσασθε ἀπὸ τῶν πονηριῶν ὑμῶν, <strong>μάθετε καλὸν ποιεῖν, ἐκζητήσατε κρίσιν, <mark>ῥύσασθε ἀδικούμενον, κρίνατε ὀρφανῷ καὶ δικαιώσατε χήραν</mark></strong>·» (<a href="https://bibleox.com/el/gr-lxx-byz/is/1/#L15-17">Ησ 1:15-17</a>)</p></blockquote><blockquote><p>«ὁ δὲ ἀτενίσας αὐτῷ καὶ ἔμφοβος γενόμενος εἶπεν, Τί ἐστιν, κύριε; εἶπεν δὲ αὐτῷ, <strong>Αἱ προσευχαί σου καὶ <mark>αἱ ἐλεημοσύναι σου</mark> ἀνέβησαν εἰς μνημόσυνον ἔμπροσθεν τοῦ θεοῦ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/10/#L4">Πραξ 10:4</a>)</p></blockquote><h3>Η νηστεία</h3><blockquote><p>«καὶ νῦν λέγει κύριος ὁ θεὸς ὑμῶν <strong>Ἐπιστράφητε πρός με ἐξ ὅλης τῆς καρδίας ὑμῶν καὶ <mark>ἐν νηστείᾳ</mark></strong> καὶ ἐν κλαυθμῷ καὶ ἐν κοπετῷ·» (<a href="https://bibleox.com/el/gr-lxx-byz/iol/2/#L12">Ιλ 2:12</a>)</p></blockquote><blockquote><p>«καὶ ἔδωκα τὸ πρόσωπόν μου ἐπὶ κύριον τὸν θεὸν εὑρεῖν <strong>προσευχὴν καὶ ἔλεος <mark>ἐν νηστείαις</mark></strong> καὶ σάκκῳ καὶ σποδῷ.» (<a href="https://bibleox.com/el/gr-lxx-byz/dan/9/#L3">Δν 9:3</a>)</p></blockquote><blockquote><p>«τότε <strong>νηστεύσαντες καὶ προσευξάμενοι</strong> καὶ ἐπιθέντες τὰς χεῖρας αὐτοῖς ἀπέλυσαν.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/13/#L3">Πραξ 13:3</a>)</p></blockquote><blockquote><p>«τὰ γόνατά μου ἠσθένησαν ἀπὸ <strong>νηστείας</strong>, καὶ ἡ σάρξ μου ἠλλοιώθη δι᾿ ἔλαιον. &lt;…&gt; βοήθησόν μοι, κύριε ὁ θεός μου, σῶσόν με κατὰ τὸ ἔλεός σου» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/108/#L24,26">Ψλ 108:24,26</a>)</p></blockquote><h3>Η απουσία υποκρισίας</h3><blockquote><p>«Καὶ <strong><mark>ὅταν προσεύχησθε, οὐκ ἔσεσθε ὡς οἱ ὑποκριταί</mark>· ὅτι φιλοῦσιν ἐν ταῖς συναγωγαῖς καὶ ἐν ταῖς γωνίαις τῶν πλατειῶν ἑστῶτες <mark>προσεύχεσθαι, ὅπως φανῶσιν τοῖς ἀνθρώποις</mark></strong>· ἀμὴν λέγω ὑμῖν, <strong>ἀπέχουσιν τὸν μισθὸν αὐτῶν</strong>. σὺ δὲ ὅταν προσεύχῃ, εἴσελθε εἰς τὸ ταμεῖόν σου καὶ κλείσας τὴν θύραν σου πρόσευξαι τῷ πατρί σου τῷ ἐν τῷ κρυπτῷ· καὶ ὁ πατήρ σου ὁ βλέπων ἐν τῷ κρυπτῷ ἀποδώσει σοι.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/6/#L5-6">Μτ 6:5-6</a>)</p></blockquote><h3>Η απουσία κενής πολυλογίας</h3><p>Έχει ήδη ειπωθεί ότι απαιτείται συνεχής προσευχή, επιμονή και υπομονή στην προσευχή (<a href="https://bibleox.com/el/gr-lxx-byz/lk/18/#L1-7">Λκ 18:1-7</a>). Αλλά ο Θεός δεν εξευμενίζεται με τη συχνή επανάληψη των λόγων. Η προσευχή πρέπει να συνδυάζεται με όλα τα παραπάνω: πίστη, δικαιοσύνη, έργα ευάρεστα στον Θεό, απομάκρυνση από την αμαρτία, καθαρότητα καρδιάς, συγχώρηση των προσβολών, ειρήνη με τους πλησίον και τα λοιπά. Οι ειδωλολάτρες όμως, <u>χωρίς να αλλάζουν τον εαυτό τους</u> και τη ζωή τους, ήλπιζαν να πετύχουν κάτι φωνάζοντας δυνατότερα και συχνότερα στους θεούς τους, που τάχα κοιμούνται (βλ. <a href="https://bibleox.com/el/gr-lxx-byz/3ts/18/#L26-28">Γ Βασ 18:26-28</a>).</p><blockquote><p>«<strong>Προσευχόμενοι δὲ μὴ βατταλογήσητε ὥσπερ οἱ ἐθνικοί, δοκοῦσιν γὰρ ὅτι ἐν τῇ πολυλογίᾳ αὐτῶν εἰσακουσθήσονται</strong>. μὴ οὖν ὁμοιωθῆτε αὐτοῖς, οἶδεν γὰρ ὁ πατὴρ ὑμῶν ὧν χρείαν ἔχετε πρὸ τοῦ ὑμᾶς αἰτῆσαι αὐτόν.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/6/#L7-8">Μτ 6:7-8</a>)</p></blockquote><p>Ο ίδιος ο Κύριος Ιησούς Χριστός προσευχόταν συχνά όλη τη νύχτα και μερικές φορές επαναλάμβανε τις προσευχές Του:</p><blockquote><p>«καὶ <strong>πάλιν</strong> ἀπελθὼν προσηύξατο <strong>τὸν αὐτὸν λόγον εἰπών</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mk/14/#L39">Μκ 14:39</a>)</p></blockquote><h2>Ο Θεός δίνει ό,τι είναι σύμφωνο με το θέλημά Του</h2><blockquote><p>«<strong>αἰτεῖτε καὶ οὐ λαμβάνετε, διότι κακῶς αἰτεῖσθε</strong>, ἵνα ἐν ταῖς ἡδοναῖς ὑμῶν δαπανήσητε.» (<a href="https://bibleox.com/el/gr-lxx-byz/iak/4/#L3">Ιακ 4:3</a>)</p></blockquote><blockquote><p>«καὶ αὕτη ἐστὶν ἡ παρρησία ἣν ἔχομεν πρὸς αὐτόν, ὅτι ἐάν τι <strong>αἰτώμεθα κατὰ τὸ θέλημα αὐτοῦ</strong> ἀκούει ἡμῶν.» (<a href="https://bibleox.com/el/gr-lxx-byz/1in/5/#L14">Α Ιω 5:14</a>)</p></blockquote><blockquote><p>«<strong>ἐὰν μείνητε ἐν ἐμοὶ καὶ τὰ ῥήματά μου ἐν ὑμῖν μείνῃ</strong>, ὃ ἐὰν θέλητε αἰτήσασθε καὶ γενήσεται ὑμῖν.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/15/#L7">Ιω 15:7</a>)</p></blockquote><blockquote><p>«ἢ τίς ἐστιν ἐξ ὑμῶν ἄνθρωπος, ὃν αἰτήσει ὁ υἱὸς αὐτοῦ ἄρτον — μὴ λίθον ἐπιδώσει αὐτῷ; ἢ καὶ ἰχθὺν αἰτήσει — μὴ ὄφιν ἐπιδώσει αὐτῷ; εἰ οὖν ὑμεῖς πονηροὶ ὄντες οἴδατε δόματα ἀγαθὰ διδόναι τοῖς τέκνοις ὑμῶν, πόσῳ μᾶλλον ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς <strong>δώσει ἀγαθὰ</strong> τοῖς αἰτοῦσιν αὐτόν.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/7/#L9-11">Μτ 7:9-11</a>)</p></blockquote><h2>Η κατ’ ιδίαν προσευχή</h2><blockquote><p>«σὺ δὲ <strong>ὅταν προσεύχῃ, εἴσελθε εἰς τὸ ταμεῖόν σου καὶ κλείσας τὴν θύραν σου πρόσευξαι τῷ πατρί σου τῷ ἐν τῷ κρυπτῷ</strong>· καὶ ὁ πατήρ σου ὁ βλέπων ἐν τῷ κρυπτῷ ἀποδώσει σοι.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/6/#L6">Μτ 6:6</a>)</p></blockquote><h2>Η κοινή προσευχή</h2><blockquote><p>«Πάλιν λέγω ὑμῖν ὅτι ἐὰν <strong>δύο συμφωνήσωσιν ἐξ ὑμῶν ἐπὶ τῆς γῆς περὶ παντὸς πράγματος</strong> οὗ ἐὰν αἰτήσωνται, γενήσεται αὐτοῖς παρὰ τοῦ πατρός μου τοῦ ἐν οὐρανοῖς. <strong><mark>οὗ γάρ εἰσιν δύο ἢ τρεῖς συνηγμένοι εἰς τὸ ἐμὸν ὄνομα, ἐκεῖ εἰμι ἐν μέσῳ αὐτῶν</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/18/#L19-20">Μτ 18:19-20</a>)</p></blockquote><h2>Οι προσευχές για άλλους ανθρώπους</h2><h3>Η προσευχή για τους πλησίον και την Εκκλησία</h3><blockquote><p>«ἐξομολογεῖσθε οὖν ἀλλήλοις τὰς ἁμαρτίας καὶ <strong>εὔχεσθε ὑπὲρ ἀλλήλων</strong>, ὅπως ἰαθῆτε. πολὺ ἰσχύει δέησις δικαίου ἐνεργουμένη.» (<a href="https://bibleox.com/el/gr-lxx-byz/iak/5/#L16">Ιακ 5:16</a>)</p></blockquote><blockquote><p>«<strong>προσευχόμενοι ἅμα καὶ περὶ ἡμῶν</strong>, ἵνα ὁ θεὸς ἀνοίξῃ ἡμῖν θύραν τοῦ λόγου, λαλῆσαι τὸ μυστήριον τοῦ Χριστοῦ, δι᾿ ὃ καὶ δέδεμαι» (<a href="https://bibleox.com/el/gr-lxx-byz/kol/4/#L3">Κολ 4:3</a>)</p></blockquote><blockquote><p>«Ἀδελφοί, <strong>προσεύχεσθε καὶ περὶ ἡμῶν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1sol/5/#L25">Α Θεσ 5:25</a>)</p></blockquote><blockquote><p>«Τὸ λοιπὸν <strong>προσεύχεσθε, ἀδελφοί, περὶ ἡμῶν</strong>, ἵνα ὁ λόγος τοῦ κυρίου τρέχῃ καὶ δοξάζηται καθὼς καὶ πρὸς ὑμᾶς» (<a href="https://bibleox.com/el/gr-lxx-byz/2sol/3/#L1">Β Θεσ 3:1</a>)</p></blockquote><blockquote><p>«<strong>Προσεύχεσθε περὶ ἡμῶν</strong>, πειθόμεθα γὰρ ὅτι καλὴν συνείδησιν ἔχομεν, ἐν πᾶσιν καλῶς θέλοντες ἀναστρέφεσθαι.» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/13/#L18">Εβρ 13:18</a>)</p></blockquote><blockquote><p>«χαίρομεν γὰρ ὅταν ἡμεῖς ἀσθενῶμεν, ὑμεῖς δὲ δυνατοὶ ἦτε· τοῦτο καὶ <strong>εὐχόμεθα, τὴν ὑμῶν κατάρτισιν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/2kor/13/#L9">Β Κορ 13:9</a>)</p></blockquote><blockquote><p>«εἰς ὃ καὶ <strong>προσευχόμεθα πάντοτε περὶ ὑμῶν</strong>, ἵνα ὑμᾶς ἀξιώσῃ τῆς κλήσεως ὁ θεὸς ἡμῶν καὶ πληρώσῃ πᾶσαν εὐδοκίαν ἀγαθωσύνης καὶ ἔργον πίστεως ἐν δυνάμει» (<a href="https://bibleox.com/el/gr-lxx-byz/2sol/1/#L11">Β Θεσ 1:11</a>)</p></blockquote><blockquote><p>«<strong>συνυπουργούντων καὶ ὑμῶν ὑπὲρ ἡμῶν τῇ δεήσει</strong>, ἵνα ἐκ πολλῶν προσώπων τὸ εἰς ἡμᾶς χάρισμα διὰ πολλῶν εὐχαριστηθῇ ὑπὲρ ἡμῶν.» (<a href="https://bibleox.com/el/gr-lxx-byz/2kor/1/#L11">Β Κορ 1:11</a>)</p></blockquote><h3>Η προσευχή για όσους μας αδικούν</h3><blockquote><p>«ἐγὼ δὲ λέγω ὑμῖν, ἀγαπᾶτε τοὺς ἐχθροὺς ὑμῶν καὶ <strong>προσεύχεσθε ὑπὲρ τῶν διωκόντων ὑμᾶς</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/5/#L44">Μτ 5:44</a>)</p></blockquote><blockquote><p>«εὐλογεῖτε τοὺς καταρωμένους ὑμᾶς, <strong>προσεύχεσθε περὶ τῶν ἐπηρεαζόντων ὑμᾶς</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/6/#L28">Λκ 6:28</a>)</p></blockquote><h3>Η προσευχή για όσους αμαρτάνουν με αμαρτία που δεν είναι προς θάνατον</h3><blockquote><p>«<strong>Ἐάν τις ἴδῃ τὸν ἀδελφὸν αὐτοῦ ἁμαρτάνοντα ἁμαρτίαν μὴ πρὸς θάνατον, αἰτήσει, καὶ δώσει αὐτῷ ζωήν</strong>, τοῖς ἁμαρτάνουσιν μὴ πρὸς θάνατον. ἔστιν ἁμαρτία πρὸς θάνατον· οὐ περὶ ἐκείνης λέγω ἵνα ἐρωτήσῃ. πᾶσα ἀδικία ἁμαρτία ἐστίν, καὶ ἔστιν ἁμαρτία οὐ πρὸς θάνατον.» (<a href="https://bibleox.com/el/gr-lxx-byz/1in/5/#L16-17">Α Ιω 5:16-17</a>)</p></blockquote><h3>Με την προσευχή της Εκκλησίας συγχωρούνται οι αμαρτίες των ανθρώπων</h3><blockquote><p>«ἀσθενεῖ τις ἐν ὑμῖν; <strong>προσκαλεσάσθω τοὺς πρεσβυτέρους τῆς ἐκκλησίας</strong>, καὶ προσευξάσθωσαν ἐπ᾿ αὐτὸν ἀλείψαντες ἐλαίῳ ἐν τῷ ὀνόματι [τοῦ] κυρίου· καὶ ἡ εὐχὴ τῆς πίστεως σώσει τὸν κάμνοντα, καὶ ἐγερεῖ αὐτὸν ὁ κύριος· <strong>κἂν ἁμαρτίας ᾖ πεποιηκώς, ἀφεθήσεται αὐτῷ</strong>. ἐξομολογεῖσθε οὖν ἀλλήλοις τὰς ἁμαρτίας καὶ εὔχεσθε ὑπὲρ ἀλλήλων, ὅπως ἰαθῆτε. πολὺ ἰσχύει δέησις δικαίου ἐνεργουμένη.» (<a href="https://bibleox.com/el/gr-lxx-byz/iak/5/#L14-16">Ιακ 5:14-16</a>)</p></blockquote>'
