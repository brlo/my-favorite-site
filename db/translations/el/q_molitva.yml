  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <h2>Ο Θεός ονομάζει τον ναό της Παλαιάς Διαθήκης οίκο προσευχής</h2><blockquote><p>«εἰσάξω αὐτοὺς εἰς τὸ ὄρος τὸ ἅγιόν μου καὶ εὐφρανῶ αὐτοὺς ἐν τῷ <strong>οἴκῳ τῆς προσευχῆς μου</strong>· τὰ ὁλοκαυτώματα αὐτῶν καὶ αἱ θυσίαι αὐτῶν ἔσονται δεκταὶ ἐπὶ τοῦ θυσιαστηρίου μου· ὁ γὰρ <strong>οἶκός μου <mark>οἶκος προσευχῆς</mark> κληθήσεται πᾶσιν τοῖς ἔθνεσιν</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/is/56/#L7">Ησ 56:7</a> · <a href="https://bibleox.com/el/gr-lxx-byz/mf/21/#L13">Μτ 21:13</a> · <a href="https://bibleox.com/el/gr-lxx-byz/mk/11/#L17">Μκ 11:17</a>)</p></blockquote><p>Η διάταξη του ναού δεν προέβλεπε θέσεις για κάθισμα. <a href="https://bibleox.com/el/el/w/Ο_ναός_της_Ιερουσαλήμ">Λεπτομερής περιγραφή του ναού</a>.</p><h2>Στον ναό προσεύχονταν όρθιοι</h2><blockquote><p>«καὶ συνήχθη Ιουδας ἐκζητῆσαι τὸν κύριον, καὶ ἀπὸ πασῶν τῶν πόλεων Ιουδας ἦλθον ζητῆσαι τὸν κύριον. &lt;…&gt; καὶ <strong>πᾶς Ιουδας <mark>ἑστηκὼς ἔναντι κυρίου</mark> καὶ τὰ παιδία αὐτῶν καὶ αἱ γυναῖκες</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/2par/20/#L4,13">Β Παρ 20:4,13</a>)</p></blockquote><blockquote><p>«καὶ εἶπεν Μωϋσῆς πρὸς Κορε Εἰσακούσατέ μου, υἱοὶ Λευι. μὴ μικρόν ἐστιν τοῦτο ὑμῖν ὅτι διέστειλεν ὁ θεὸς Ισραηλ ὑμᾶς ἐκ συναγωγῆς Ισραηλ καὶ προσηγάγετο ὑμᾶς πρὸς ἑαυτὸν <strong>λειτουργεῖν τὰς λειτουργίας τῆς σκηνῆς κυρίου καὶ <mark>παρίστασθαι</mark></strong> ἔναντι τῆς συναγωγῆς λατρεύειν αὐτοῖς;» (<a href="https://bibleox.com/el/gr-lxx-byz/chis/16/#L8-9">Αρ 16:8-9</a>)</p></blockquote><h2>Τα όντα που υπηρετούν τον Θεό απεικονίζονται όρθια</h2><blockquote><p>«καὶ αἱ πτέρυγες τῶν <strong>χερουβιν</strong> διαπεπετασμέναι πήχεων εἴκοσι· καὶ αὐτὰ <strong><mark>ἑστηκότα ἐπὶ τοὺς πόδας αὐτῶν</mark>, καὶ τὰ πρόσωπα αὐτῶν εἰς τὸν οἶκον</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/2par/3/#L13">Β Παρ 3:13</a>)</p></blockquote><h2>Ο Χριστός ζήτησε από τους αποστόλους να σηκωθούν για προσευχή</h2><blockquote><p>«καὶ <strong>ἀναστὰς ἀπὸ τῆς προσευχῆς ἐλθὼν πρὸς τοὺς μαθητὰς εὗρεν κοιμωμένους αὐτοὺς ἀπὸ τῆς λύπης</strong>, καὶ εἶπεν αὐτοῖς, Τί καθεύδετε; <strong><mark>ἀναστάντες προσεύχεσθε</mark></strong>, ἵνα μὴ εἰσέλθητε εἰς πειρασμόν.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/22/#L45-46">Λκ 22:45-46</a>) — Στο κριτικό κείμενο που παραθέτουμε οι στίχοι 43–44 είναι κενοί· γι’ αυτό η παράθεση αρχίζει από τον στίχο 45.</p></blockquote><p>Η λέξη «σηκωθείτε» μπορεί να κατανοηθεί και ως «ξυπνήστε από τον ύπνο». Ωστόσο, αυτό το χωρίο είναι σημαντικό και επειδή δείχνει την προσευχή του ίδιου του Χριστού με μεγάλο κόπο και σταγόνες ιδρώτα.</p><h2>Σημειώσεις</h2><p>Δεν υπάρχουν βιβλικοί στίχοι στους οποίους η σύναξη των πιστών να προσεύχεται ενώπιον του Θεού καθισμένη σε αίθουσα γεμάτη στασίδια.</p>
