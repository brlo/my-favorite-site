    priority: 6
  update: true
  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <h2>Η προσευχή κατά το πρότυπο</h2><p>Στην Παλαιά Διαθήκη υπάρχει ένα μεγάλο θεόπνευστο προσευχητάριο — το Ψαλτήρι. Γράφτηκε από τον προφήτη και βασιλιά Δαβίδ. Χρησιμοποιούνταν στον ναό· οι ψαλμοί ψάλλονταν ανεβαίνοντας τα σκαλοπάτια.</p><p>Όταν οι απόστολοι ζητούν από τον Κύριο να τους μάθει να προσεύχονται, επικαλούνται το γεγονός ότι ο προφήτης Ιωάννης ο Βαπτιστής είχε ήδη μάθει να προσεύχονται στους μαθητές του:</p><blockquote><p>«Καὶ ἐγένετο ἐν τῷ εἶναι αὐτὸν ἐν τόπῳ τινὶ προσευχόμενον, ὡς ἐπαύσατο, εἶπέν τις τῶν μαθητῶν αὐτοῦ πρὸς αὐτόν, Κύριε, <strong>δίδαξον ἡμᾶς προσεύχεσθαι</strong>, καθὼς καὶ <strong>Ἰωάννης ἐδίδαξεν τοὺς μαθητὰς αὐτοῦ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/11/#L1">Λκ 11:1</a>)</p></blockquote><p>Έπειτα ο Χριστός έδωσε υπόδειγμα προσευχής με τα δικά Του λόγια:</p><blockquote><p>«εἶπεν δὲ αὐτοῖς, Ὅταν προσεύχησθε, λέγετε, Πάτερ, ἁγιασθήτω τὸ ὄνομά σου· ἐλθέτω ἡ βασιλεία σου τὸν ἄρτον ἡμῶν τὸν ἐπιούσιον δίδου ἡμῖν τὸ καθ᾿ ἡμέραν· καὶ ἄφες ἡμῖν τὰς ἁμαρτίας ἡμῶν, καὶ γὰρ αὐτοὶ ἀφίομεν παντὶ ὀφείλοντι ἡμῖν· καὶ μὴ εἰσενέγκῃς ἡμᾶς εἰς πειρασμόν.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/11/#L2-4">Λκ 11:2-4</a> · <a href="https://bibleox.com/el/gr-lxx-byz/mf/6/#L9-13">Μτ 6:9-13</a>)</p></blockquote><p>Δηλαδή το να δίνει κανείς προσευχές και να προσεύχεται κατά το πρότυπο (τον κανόνα) είναι απολύτως φυσικό και αποτελεί βιβλική πρακτική.</p>
