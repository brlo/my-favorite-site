  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: '<h2>Η Γραφή για τον μοναχισμό</h2><h3>Οι ευνούχοι που εκλέγουν το αρεστό στον Θεό</h3><p>Ο Θεός ξεχωρίζει ιδιαίτερα εκείνους που, χωρίς να συνάπτουν γάμο, φροντίζουν ιδιαίτερα για την τήρηση των νόμων του Θεού. Αυτοί, κατά κάποιον τρόπο, ανυψώνονται πάνω από τους υπόλοιπους «<em>γιους και κόρες</em>»:</p><blockquote><p>«τάδε λέγει κύριος <strong>Τοῖς <mark>εὐνούχοις, ὅσοι</mark></strong> ἂν φυλάξωνται τὰ σάββατά μου καὶ ἐκλέξωνται ἃ ἐγὼ θέλω καὶ <strong><mark>ἀντέχωνται τῆς διαθήκης μου</mark></strong>, δώσω αὐτοῖς ἐν τῷ οἴκῳ μου καὶ ἐν τῷ τείχει μου <strong><mark>τόπον ὀνομαστὸν κρείττω</mark> υἱῶν καὶ θυγατέρων</strong>, ὄνομα αἰώνιον δώσω αὐτοῖς καὶ οὐκ ἐκλείψει.» (<a href="https://bibleox.com/el/gr-lxx-byz/is/56/#L4-5">Ησ 56:4-5</a>)</p></blockquote><blockquote><p>«<strong>καὶ <mark>εὐνοῦχος</mark></strong> <strong>ὁ μὴ ἐργασάμενος ἐν χειρὶ ἀνόμημα</strong> μηδὲ ἐνθυμηθεὶς κατὰ τοῦ κυρίου πονηρά, <strong>δοθήσεται γὰρ αὐτῷ τῆς πίστεως <mark>χάρις ἐκλεκτὴ</mark> καὶ κλῆρος ἐν ναῷ κυρίου θυμηρέστερος</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/prs/3/#L14">Σ.Σολ 3:14</a>)</p></blockquote><h3>Ο δρόμος της τελειότητας, ανώτερος από την τήρηση των εντολών</h3><p>Ο πλούσιος νεαρός, που αναζητούσε τον δρόμο της σωτηρίας, παίρνει από τον Σωτήρα την επιβεβαίωση ότι γι’ αυτό είναι απαραίτητο να τηρήσει τις εντολές. Ωστόσο, επειδή ο νεαρός ενδιαφέρθηκε για κάτι μεγαλύτερο, ο Κύριος τού υπέδειξε το ανώτερο: όχι μόνο να σωθεί, αλλά και να γίνει τέλειος. Γι’ αυτό ο Κύριος κάλεσε τον νεαρό να μοιράσει όλα τα υπάρχοντά του στους φτωχούς και να Τον ακολουθήσει:</p><blockquote><p>«ἔφη αὐτῷ ὁ Ἰησοῦς, <strong><mark>Εἰ θέλεις τέλειος εἶναι</mark>, ὕπαγε <mark>πώλησόν σου τὰ ὑπάρχοντα καὶ δὸς τοῖς πτωχοῖς</mark></strong>, καὶ ἕξεις θησαυρὸν ἐν οὐρανοῖς, <strong>καὶ <mark>δεῦρο ἀκολούθει μοι</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/19/#L21">Μτ 19:21</a>)</p></blockquote><h3>Αυτοί που ευνούχισαν τον εαυτό τους για χάρη της Βασιλείας των Ουρανών</h3><p>Οι μοναχοί αφήνουν όλο τον επίγειο πλούτο και όλους τους δεσμούς, αφιερώνουν όλη τη ζωή τους στην επιδίωξη του Θεού και στη διακονία Του. Οι μοναχοί είναι εκείνοι που ευνούχισαν τον εαυτό τους, υποβάλλοντας τον εαυτό τους σε στερήσεις για χάρη της Βασιλείας των Ουρανών:</p><blockquote><p>«λέγουσιν αὐτῷ οἱ μαθηταὶ [αὐτοῦ], Εἰ οὕτως ἐστὶν ἡ αἰτία τοῦ ἀνθρώπου μετὰ τῆς γυναικός, <strong>οὐ συμφέρει γαμῆσαι</strong>. ὁ δὲ εἶπεν αὐτοῖς, <strong>Οὐ πάντες χωροῦσιν τὸν λόγον [τοῦτον], ἀλλ᾿ οἷς δέδοται</strong>. εἰσὶν γὰρ εὐνοῦχοι οἵτινες ἐκ κοιλίας μητρὸς ἐγεννήθησαν οὕτως, καὶ εἰσὶν εὐνοῦχοι οἵτινες εὐνουχίσθησαν ὑπὸ τῶν ἀνθρώπων, καὶ <strong>εἰσὶν εὐνοῦχοι οἵτινες <mark>εὐνούχισαν ἑαυτοὺς διὰ τὴν βασιλείαν τῶν οὐρανῶν</mark></strong>. <strong>ὁ δυνάμενος χωρεῖν χωρείτω</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/19/#L10-12">Μτ 19:10-12</a>)</p></blockquote><p>Αυτά τα λόγια για τους ευνούχους τα είπε ο Χριστός αφού οι απόστολοι άκουσαν την απαγόρευσή Του να χωρίζουν τη γυναίκα τους. Οι απόστολοι έκριναν ότι τότε είναι καλύτερο να μην παντρεύονται. Ο Κύριος όμως δεν αντέτεινε σ’ αυτό το συμπέρασμα, αλλά μόνο υπέδειξε ότι δεν μπορούν όλοι να επιλέξουν αυτόν τον δρόμο. Όποιος όμως μπορεί, ας τον επιλέξει. Δηλαδή, είναι ένας ξεχωριστός δρόμος των ασκητών.</p><h3>Η σύσταση του αποστόλου</h3><p>Ο απόστολος επαναλαμβάνει πλέον ρητά τη σκέψη περί αγαμίας:</p><blockquote><p>«Περὶ δὲ ὧν ἐγράψατε, <strong>καλὸν ἀνθρώπῳ γυναικὸς μὴ ἅπτεσθαι</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/7/#L1">Α Κορ 7:1</a>)</p></blockquote><p>Ο απόστολος Παύλος δεν είχε γυναίκα και δίνει στους άγαμους και στις χήρες τη σύσταση (ακριβώς σύσταση) να μην αναζητήσουν νέο σύζυγο, παραμένοντας όπως ο ίδιος:</p><blockquote><p>«Λέγω δὲ τοῖς ἀγάμοις καὶ ταῖς χήραις, <strong><mark>καλὸν αὐτοῖς ἐὰν μείνωσιν ὡς κἀγώ</mark></strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/7/#L8">Α Κορ 7:8</a>)</p></blockquote><p>Ο απόστολος εξηγεί τους λόγους αυτής της σύστασης:</p><blockquote><p>«ἐὰν δὲ καὶ γαμήσῃς, οὐχ ἥμαρτες· καὶ ἐὰν γήμῃ ἡ παρθένος, οὐχ ἥμαρτεν. θλῖψιν δὲ τῇ σαρκὶ ἕξουσιν οἱ τοιοῦτοι, ἐγὼ δὲ ὑμῶν φείδομαι. τοῦτο δέ φημι, ἀδελφοί, ὁ καιρὸς συνεσταλμένος ἐστίν· τὸ λοιπὸν ἵνα καὶ οἱ ἔχοντες γυναῖκας ὡς μὴ ἔχοντες ὦσιν, καὶ οἱ κλαίοντες ὡς μὴ κλαίοντες, καὶ οἱ χαίροντες ὡς μὴ χαίροντες, καὶ οἱ ἀγοράζοντες ὡς μὴ κατέχοντες, καὶ οἱ χρώμενοι τὸν κόσμον ὡς μὴ καταχρώμενοι· παράγει γὰρ τὸ σχῆμα τοῦ κόσμου τούτου. θέλω δὲ ὑμᾶς ἀμερίμνους εἶναι. <strong><mark>ὁ ἄγαμος μεριμνᾷ τὰ τοῦ κυρίου, πῶς ἀρέσῃ τῷ κυρίῳ· ὁ δὲ γαμήσας μεριμνᾷ τὰ τοῦ κόσμου, πῶς ἀρέσῃ τῇ γυναικί</mark></strong>, καὶ μεμέρισται. καὶ <strong>ἡ γυνὴ ἡ ἄγαμος καὶ ἡ παρθένος μεριμνᾷ τὰ τοῦ κυρίου, ἵνα ᾖ ἁγία [καὶ] τῷ σώματι καὶ τῷ πνεύματι· ἡ δὲ γαμήσασα μεριμνᾷ τὰ τοῦ κόσμου, πῶς ἀρέσῃ τῷ ἀνδρί</strong>. τοῦτο δὲ πρὸς τὸ ὑμῶν αὐτῶν σύμφορον λέγω, οὐχ ἵνα βρόχον ὑμῖν ἐπιβάλω, ἀλλὰ πρὸς τὸ εὔσχημον καὶ εὐπάρεδρον τῷ κυρίῳ ἀπερισπάστως. Εἰ δέ τις ἀσχημονεῖν ἐπὶ τὴν παρθένον αὐτοῦ νομίζει ἐὰν ᾖ ὑπέρακμος, καὶ οὕτως ὀφείλει γίνεσθαι, ὃ θέλει ποιείτω· οὐχ ἁμαρτάνει· γαμείτωσαν. ὃς δὲ ἕστηκεν ἐν τῇ καρδίᾳ αὐτοῦ ἑδραῖος, μὴ ἔχων ἀνάγκην, ἐξουσίαν δὲ ἔχει περὶ τοῦ ἰδίου θελήματος, <strong>καὶ τοῦτο κέκρικεν ἐν τῇ ἰδίᾳ καρδίᾳ, τηρεῖν τὴν ἑαυτοῦ παρθένον, καλῶς ποιήσει</strong>· ὥστε καὶ ὁ γαμίζων τὴν ἑαυτοῦ παρθένον καλῶς ποιεῖ, καὶ <strong>ὁ μὴ γαμίζων κρεῖσσον ποιήσει</strong>. Γυνὴ δέδεται ἐφ᾿ ὅσον χρόνον ζῇ ὁ ἀνὴρ αὐτῆς· ἐὰν δὲ κοιμηθῇ ὁ ἀνήρ, ἐλευθέρα ἐστὶν ᾧ θέλει γαμηθῆναι, μόνον ἐν κυρίῳ. <strong><mark>μακαριωτέρα δέ ἐστιν ἐὰν οὕτως μείνῃ</mark></strong>, κατὰ τὴν ἐμὴν γνώμην, δοκῶ δὲ κἀγὼ πνεῦμα θεοῦ ἔχειν.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/7/#L28-40">Α Κορ 7:28-40</a>)</p></blockquote><p>Οι χριστιανοί που έζησαν τη ζωή τους παρθενικά ακολουθούν στον ουρανό τον Χριστό, όπου κι αν πάει:</p><blockquote><p>«Καὶ εἶδον, καὶ ἰδοὺ τὸ ἀρνίον ἑστὸς ἐπὶ τὸ ὄρος Σιών, καὶ μετ᾿ αὐτοῦ <strong>ἑκατὸν τεσσαράκοντα τέσσαρες χιλιάδες</strong> ἔχουσαι τὸ ὄνομα αὐτοῦ καὶ τὸ ὄνομα τοῦ πατρὸς αὐτοῦ γεγραμμένον ἐπὶ τῶν μετώπων αὐτῶν. καὶ ἤκουσα φωνὴν ἐκ τοῦ οὐρανοῦ ὡς φωνὴν ὑδάτων πολλῶν καὶ ὡς φωνὴν βροντῆς μεγάλης, καὶ ἡ φωνὴ ἣν ἤκουσα ὡς κιθαρῳδῶν κιθαριζόντων ἐν ταῖς κιθάραις αὐτῶν. <strong>καὶ ᾄδουσιν [ὡς] ᾠδὴν καινὴν ἐνώπιον τοῦ θρόνου</strong> καὶ ἐνώπιον τῶν τεσσάρων ζῴων καὶ τῶν πρεσβυτέρων· καὶ <strong><mark>οὐδεὶς ἐδύνατο μαθεῖν τὴν ᾠδὴν</mark> εἰ μὴ αἱ ἑκατὸν τεσσαράκοντα τέσσαρες χιλιάδες</strong>, οἱ ἠγορασμένοι ἀπὸ τῆς γῆς. <strong>οὗτοί εἰσιν οἳ μετὰ γυναικῶν οὐκ ἐμολύνθησαν, <mark>παρθένοι</mark> γάρ εἰσιν. οὗτοι <mark>οἱ ἀκολουθοῦντες τῷ ἀρνίῳ ὅπου ἂν ὑπάγῃ</mark></strong>. οὗτοι ἠγοράσθησαν ἀπὸ τῶν ἀνθρώπων ἀπαρχὴ τῷ θεῷ καὶ τῷ ἀρνίῳ, καὶ ἐν τῷ στόματι αὐτῶν οὐχ εὑρέθη ψεῦδος· ἄμωμοί εἰσιν.» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/14/#L1-5">Απ 14:1-5</a>)</p></blockquote><h3>Η πρώτη χριστιανική κοινότητα ήταν σαν ένα κοινοβιακό μοναστήρι</h3><blockquote><p>«<strong>πάντες δὲ οἱ πιστεύσαντες ἦσαν ἐπὶ τὸ αὐτὸ καὶ εἶχον <mark>ἅπαντα κοινά</mark></strong>, <strong><mark>καὶ τὰ κτήματα</mark> καὶ <mark>τὰς ὑπάρξεις</mark> ἐπίπρασκον καὶ διεμέριζον αὐτὰ πᾶσιν καθότι ἄν τις χρείαν εἶχεν</strong>· <strong><mark>καθ᾿ ἡμέραν</mark> τε <mark>προσκαρτεροῦντες ὁμοθυμαδὸν ἐν τῷ ἱερῷ</mark></strong>, κλῶντές τε κατ᾿ οἶκον ἄρτον, μετελάμβανον τροφῆς ἐν ἀγαλλιάσει καὶ ἀφελότητι καρδίας» (<a href="https://bibleox.com/el/gr-lxx-byz/act/2/#L44-46">Πραξ 2:44-46</a>)</p></blockquote><blockquote><p>«Τοῦ δὲ πλήθους τῶν πιστευσάντων ἦν καρδία καὶ ψυχὴ μία, <strong><mark>καὶ οὐδὲ εἷς τι τῶν ὑπαρχόντων αὐτῷ ἔλεγεν ἴδιον εἶναι</mark>, ἀλλ᾿ ἦν αὐτοῖς πάντα κοινά</strong>. &lt;…&gt; οὐδὲ γὰρ ἐνδεής τις ἦν ἐν αὐτοῖς· <strong><mark>ὅσοι γὰρ κτήτορες χωρίων ἢ οἰκιῶν ὑπῆρχον, πωλοῦντες ἔφερον τὰς τιμὰς τῶν πιπρασκομένων</mark> καὶ ἐτίθουν παρὰ τοὺς πόδας τῶν ἀποστόλων</strong>· <strong><mark>διεδίδετο δὲ ἑκάστῳ καθότι ἄν τις χρείαν εἶχεν</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/4/#L32,34-35">Πραξ 4:32,34-35</a>)</p></blockquote><blockquote><p>«<strong><mark>τῶν δὲ λοιπῶν οὐδεὶς ἐτόλμα κολλᾶσθαι αὐτοῖς</mark></strong>, ἀλλ᾿ ἐμεγάλυνεν αὐτοὺς ὁ λαός» (<a href="https://bibleox.com/el/gr-lxx-byz/act/5/#L13">Πραξ 5:13</a>)</p></blockquote><h2>Παραδείγματα μοναχικής ζωής</h2><h3>Ο Κύριος Ιησούς Χριστός</h3><ul><li><p>ήταν άγαμος·</p></li><li><p>δεν είχε δικό του σπίτι (<a href="https://bibleox.com/el/gr-lxx-byz/mf/8/#L20">Μτ 8:20</a> · <a href="https://bibleox.com/el/gr-lxx-byz/lk/9/#L58">Λκ 9:58</a> · <a href="https://bibleox.com/el/gr-lxx-byz/mf/19/#L21">Μτ 19:21</a>)·</p></li><li><p>δεν είχε προσωπικά χρήματα, ήταν αφιλάργυρος (<a href="https://bibleox.com/el/gr-lxx-byz/mk/12/#L15">Μκ 12:15</a> · <a href="https://bibleox.com/el/gr-lxx-byz/mf/17/#L24-27">Μτ 17:24-27</a> · <a href="https://bibleox.com/el/gr-lxx-byz/mf/19/#L21">Μτ 19:21</a>)·</p></li><li><p>πολλές φορές προσευχόταν μόνος ολόκληρες νύχτες (<a href="https://bibleox.com/el/gr-lxx-byz/lk/6/#L12">Λκ 6:12</a><em> · </em><a href="https://bibleox.com/el/gr-lxx-byz/mf/6/#L6">Μτ 6:6</a> · <a href="https://bibleox.com/el/gr-lxx-byz/mf/14/#L23,25">Μτ 14:23,25</a> · <a href="https://bibleox.com/el/gr-lxx-byz/mk/14/#L32,35,37,39-41">Μκ 14:32,35,37,39-41</a>)·</p></li><li><p>είχε μαθητές (<a href="https://bibleox.com/el/gr-lxx-byz/lk/6/#L13">Λκ 6:13</a> · <a href="https://bibleox.com/el/gr-lxx-byz/lk/10/#L1">Λκ 10:1</a>)·</p></li><li><p>δίδασκε προσευχή, έδινε στους μαθητές υπόδειγμα προσευχής (<a href="https://bibleox.com/el/gr-lxx-byz/mf/6/#L9">Μτ 6:9</a>)·</p></li><li><p>παρηγορούσε, έλεγχε, δίδασκε και νουθετούσε όσους έρχονταν (<a href="https://bibleox.com/el/gr-lxx-byz/mk/6/#L31">Μκ 6:31</a>).</p></li></ul><h3>Η Παρθένος Μαρία η Θεοτόκος</h3><ul><li><p>έδωσε όρκο αγαμίας, βρισκόταν σε γάμο μόνο τυπικά, δεν είχε συζυγικές σχέσεις («άνδρα δεν γνωρίζω», <a href="https://bibleox.com/el/el/w/Η_Θεοτόκος#HH-Η-Θεοτόκος-ήταν-και-παραμένει-παρθένος">περισσότερα</a>)·</p></li><li><p>δεν είχε περιουσία, δόθηκε από παιδί για ανατροφή στον ναό, έπειτα αρραβωνιάστηκε τον Ιωσήφ και έπειτα ο Κύριος την εμπιστεύθηκε στον απόστολο Ιωάννη (<a href="https://bibleox.com/el/gr-lxx-byz/in/19/#L27">Ιω 19:27</a>)·</p></li></ul><h3>Ο προφήτης Ιωάννης ο Πρόδρομος</h3><ul><li><p>ήταν άγαμος·</p></li><li><p>ζούσε στην έρημο, χωρίς δικό του σπίτι (<a href="https://bibleox.com/el/gr-lxx-byz/lk/1/#L80">Λκ 1:80</a>)·</p></li><li><p>φορούσε χονδρικά ρούχα φτιαγμένα από τον ίδιο (<a href="https://bibleox.com/el/gr-lxx-byz/mf/3/#L4">Μτ 3:4</a>)·</p></li><li><p>έτρωγε πολύ απλή τροφή που έβρισκε στην έρημο (<a href="https://bibleox.com/el/gr-lxx-byz/mf/3/#L4">Μτ 3:4</a>)·</p></li><li><p>τα ρούχα που έφτιαχνε μόνος του και η τροφή που έβρισκε δείχνουν ότι δεν είχε χρήματα·</p></li><li><p>δίδασκε προσευχή, έδινε υπόδειγμα προσευχής (<a href="https://bibleox.com/el/gr-lxx-byz/lk/11/#L1">Λκ 11:1</a>)·</p></li><li><p>είχε μαθητές (<a href="https://bibleox.com/el/gr-lxx-byz/mf/11/#L2">Μτ 11:2</a> · <a href="https://bibleox.com/el/gr-lxx-byz/in/1/#L35">Ιω 1:35</a> · <a href="https://bibleox.com/el/gr-lxx-byz/in/3/#L25">Ιω 3:25</a>)·</p></li><li><p>παρηγορούσε, έλεγχε, δίδασκε και νουθετούσε όσους έρχονταν (<a href="https://bibleox.com/el/gr-lxx-byz/lk/3/#L18">Λκ 3:18</a> · <a href="https://bibleox.com/el/gr-lxx-byz/lk/3/#L10-20">Λκ 3:10-20</a> · <a href="https://bibleox.com/el/gr-lxx-byz/mk/6/#L31">Μκ 6:31</a>).</p></li></ul><h3>Ο προφήτης Ηλίας</h3><ul><li><p>ήταν άγαμος·</p></li><li><p>συχνά ζούσε σε άγριες συνθήκες, σε ερήμους και σπηλιές (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/17/#L3-7">Γ Βασ 17:3-7</a> · <a href="https://bibleox.com/el/gr-lxx-byz/3ts/19/#L9">Γ Βασ 19:9</a> · <a href="https://bibleox.com/el/gr-lxx-byz/3ts/19/#L4">Γ Βασ 19:4</a>).</p></li><li><p>φορούσε απλά ρούχα από τρίχες ζώων και δερμάτινη ζώνη (<a href="https://bibleox.com/el/gr-lxx-byz/4ts/1/#L8">Δ Βασ 1:8</a>)·</p></li><li><p>τρεφόταν με απλή τροφή που του έφερναν κόρακες (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/17/#L6">Γ Βασ 17:6</a>).</p></li><li><p>είχε μαθητή (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/19/#L19-21">Γ Βασ 19:19-21</a>).</p></li><li><p>με εντολή του Θεού έλεγχε την ασέβεια των ανθρώπων (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/18/#L17-40">Γ Βασ 18:17-40</a>).</p></li></ul><h3>Ο προφήτης Δανιήλ</h3><ul><li><p>ήταν άγαμος·</p></li><li><p>τρεφόταν με απλή τροφή, αρνούμενος την τροφή του βασιλιά (<a href="https://bibleox.com/el/gr-lxx-byz/dan/1/#L12">Δν 1:12</a>).</p></li><li><p>προσευχόταν συχνά (<a href="https://bibleox.com/el/gr-lxx-byz/dan/6/#L11">Δν 6:11</a>).</p></li><li><p>έλεγχε την ασέβεια (<a href="https://bibleox.com/el/gr-lxx-byz/dan/5/#L17,23">Δν 5:17,23</a>).</p></li></ul><h3>Ο προφήτης Ιερεμίας</h3><ul><li><p>ήταν άγαμος με εντολή του Θεού (<a href="https://bibleox.com/el/gr-lxx-byz/ier/16/#L1-2">Ιερ 16:1-2</a>).</p></li><li><p>ζούσε σε απομόνωση, βρισκόμενος συχνά σε φυλακή ή εξορία (<a href="https://bibleox.com/el/gr-lxx-byz/ier/44/#L15-16">Ιερ 44:15-16</a>).</p></li><li><p>νουθετούσε και έλεγχε τα έθνη (<a href="https://bibleox.com/el/gr-lxx-byz/ier/1/#L9-10">Ιερ 1:9-10</a>).</p></li></ul>'
- src: мирный-дух
  path: Το_ειρηνικό_πνεύμα
  title: Το ειρηνικό πνεύμα
  title_sub:
  meta_desc:
  copy_cover: true
  menu:
    parent: Εκκλησία/Ασκητική
    title: Το ειρηνικό πνεύμα
    priority: 30
  update: true
  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <h2>Για την κατάπαυση του Θεού</h2><blockquote><p><em>«καὶ ηὐλόγησεν ὁ θεὸς τὴν ἡμέραν τὴν ἑβδόμην καὶ ἡγίασεν αὐτήν, ὅτι ἐν αὐτῇ </em><strong><em>κατέπαυσεν</em></strong><em> ἀπὸ πάντων τῶν ἔργων αὐτοῦ, ὧν ἤρξατο ὁ θεὸς ποιῆσαι.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/gen/2/#L3"><em>Γεν 2:3</em></a><em>)</em></p></blockquote><blockquote><p>«ὁ δὲ Ἰησοῦς ἀπεκρίνατο αὐτοῖς, <strong>Ὁ πατήρ μου ἕως ἄρτι ἐργάζεται, κἀγὼ ἐργάζομαι</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/5/#L17">Ιω 5:17</a>)</p></blockquote><blockquote><p><em>«</em><strong><em>εἰσερχόμεθα γὰρ εἰς [τὴν] κατάπαυσιν οἱ πιστεύσαντες</em></strong><em>, καθὼς εἴρηκεν, Ὡς ὤμοσα ἐν τῇ ὀργῇ μου, Εἰ </em><strong><em>εἰσελεύσονται εἰς τὴν κατάπαυσίν μου</em></strong><em>, καίτοι τῶν ἔργων ἀπὸ καταβολῆς κόσμου γενηθέντων.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/evr/4/#L3"><em>Εβρ 4:3</em></a><em> · </em><a href="https://bibleox.com/el/gr-lxx-byz/ps/94/#L11"><em>Ψλ 94:11</em></a><em> · </em><a href="https://bibleox.com/el/gr-lxx-byz/evr/3/#L11"><em>Εβρ 3:11</em></a><em>)</em></p></blockquote><h2>Η ειρήνη του Θεού</h2><blockquote><p>«<strong><mark>Εἰρήνην ἀφίημι ὑμῖν, εἰρήνην τὴν ἐμὴν δίδωμι ὑμῖν</mark>· οὐ καθὼς ὁ κόσμος δίδωσιν ἐγὼ δίδωμι ὑμῖν. μὴ ταρασσέσθω ὑμῶν ἡ καρδία μηδὲ δειλιάτω</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/14/#L27">Ιω 14:27</a>)</p></blockquote><blockquote><p>«<strong>ἄρατε τὸν ζυγόν μου ἐφ᾿ ὑμᾶς καὶ μάθετε ἀπ᾿ ἐμοῦ</strong>, ὅτι πραΰς εἰμι καὶ ταπεινὸς τῇ καρδίᾳ, καὶ <strong><mark>εὑρήσετε ἀνάπαυσιν ταῖς ψυχαῖς ὑμῶν</mark></strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/11/#L29">Μτ 11:29</a>)</p></blockquote><blockquote><p>«καὶ <strong><mark>ἡ εἰρήνη τοῦ θεοῦ</mark> ἡ <mark>ὑπερέχουσα πάντα νοῦν</mark> φρουρήσει τὰς καρδίας ὑμῶν</strong> καὶ τὰ νοήματα ὑμῶν ἐν Χριστῷ Ἰησοῦ.» (<a href="https://bibleox.com/el/gr-lxx-byz/fil/4/#L7">Φιλ 4:7</a>)</p></blockquote><blockquote><p>«<strong>ὁ γὰρ εἰσελθὼν εἰς τὴν κατάπαυσιν αὐτοῦ καὶ αὐτὸς κατέπαυσεν ἀπὸ τῶν ἔργων αὐτοῦ</strong> ὥσπερ ἀπὸ τῶν ἰδίων ὁ θεός. <strong><mark>σπουδάσωμεν οὖν εἰσελθεῖν εἰς ἐκείνην τὴν κατάπαυσιν</mark></strong>, ἵνα μὴ ἐν τῷ αὐτῷ τις ὑποδείγματι πέσῃ τῆς ἀπειθείας.» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/4/#L10-11">Εβρ 4:10-11</a>)</p></blockquote><blockquote><p>«κύριος πολεμήσει περὶ ὑμῶν, καὶ ὑμεῖς <strong>σιγήσετε</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/14/#L14">Έξ 14:14</a>)</p></blockquote><blockquote><p>«καὶ λέγει Αὐτὸς προπορεύσομαί σου καὶ <strong>καταπαύσω σε</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/33/#L14">Έξ 33:14</a>)</p></blockquote><blockquote><p>«καὶ θήσομαι τόπον τῷ λαῷ μου Ισραηλ καὶ καταφυτεύσω αὐτόν, καὶ <strong>κατασκηνώσει καθ᾿ ἑαυτὸν</strong> καὶ οὐ μεριμνήσει ἔτι, καὶ οὐ προσθήσει ἀδικία τοῦ ταπεινῶσαι αὐτὸν καθὼς ἀπ᾿ ἀρχῆς.» (<a href="https://bibleox.com/el/gr-lxx-byz/1par/17/#L9">Α Παρ 17:9</a>)</p></blockquote><blockquote><p>«ὡς ὤμοσα ἐν τῇ ὀργῇ μου Εἰ εἰσελεύσονται εἰς τὴν <strong>κατάπαυσίν μου</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/94/#L11">Ψλ 94:11</a>)</p></blockquote>
