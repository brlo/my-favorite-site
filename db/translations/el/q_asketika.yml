    title: Οι πειρασμοί
    priority: 18
  update: true
  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <h2>Ο πιστός πρέπει να είναι προετοιμασμένος για τους πειρασμούς</h2><blockquote><p>«Τέκνον, <strong><mark>εἰ προσέρχῃ δουλεύειν κυρίῳ, ἑτοίμασον τὴν ψυχήν σου εἰς πειρασμόν</mark></strong>· εὔθυνον τὴν καρδίαν σου καὶ καρτέρησον καὶ μὴ σπεύσῃς ἐν καιρῷ ἐπαγωγῆς· κολλήθητι αὐτῷ καὶ μὴ ἀποστῇς, ἵνα αὐξηθῇς ἐπ᾿ ἐσχάτων σου. <strong>πᾶν, ὃ ἐὰν ἐπαχθῇ σοι, δέξαι καὶ ἐν ἀλλάγμασιν ταπεινώσεώς σου μακροθύμησον· ὅτι ἐν πυρὶ δοκιμάζεται χρυσὸς</strong> καὶ ἄνθρωποι δεκτοὶ ἐν καμίνῳ ταπεινώσεως.» (<a href="https://bibleox.com/el/gr-lxx-byz/prsir/2/#L1-5">Σ.Σειρ 2:1-5</a>)</p></blockquote><h2>Οι πειρασμοί (δοκιμασίες) είναι ωφέλιμοι</h2><blockquote><p>«<strong>πειρασθῶσι καὶ ἁγιασθῶσι πολλοί</strong>, καὶ ἁμάρτωσιν οἱ ἁμαρτωλοί» (<a href="https://bibleox.com/el/gr-lxx-byz/dan/12/#L10">Δν 12:10</a>)</p></blockquote><blockquote><p>«Τέκνον, εἰ προσέρχῃ δουλεύειν κυρίῳ, <strong>ἑτοίμασον τὴν ψυχήν σου εἰς πειρασμόν</strong>· εὔθυνον τὴν καρδίαν σου καὶ καρτέρησον καὶ μὴ σπεύσῃς ἐν καιρῷ ἐπαγωγῆς· κολλήθητι αὐτῷ καὶ μὴ ἀποστῇς, <strong>ἵνα αὐξηθῇς ἐπ᾿ ἐσχάτων σου</strong>. πᾶν, ὃ ἐὰν ἐπαχθῇ σοι, <strong>δέξαι</strong> καὶ ἐν ἀλλάγμασιν ταπεινώσεώς σου μακροθύμησον· ὅτι ἐν πυρὶ δοκιμάζεται χρυσὸς καὶ ἄνθρωποι δεκτοὶ ἐν καμίνῳ ταπεινώσεως.» (<a href="https://bibleox.com/el/gr-lxx-byz/prsir/2/#L1-5">Σ.Σειρ 2:1-5</a>)</p></blockquote><blockquote><p>«<strong>Πᾶσαν χαρὰν ἡγήσασθε, ἀδελφοί μου, ὅταν πειρασμοῖς περιπέσητε ποικίλοις</strong>, γινώσκοντες ὅτι τὸ δοκίμιον ὑμῶν τῆς πίστεως κατεργάζεται ὑπομονήν· ἡ δὲ ὑπομονὴ ἔργον τέλειον ἐχέτω, ἵνα ἦτε τέλειοι καὶ ὁλόκληροι, ἐν μηδενὶ λειπόμενοι.» (<a href="https://bibleox.com/el/gr-lxx-byz/iak/1/#L2-4">Ιακ 1:2-4</a>)</p></blockquote><blockquote><p>«<strong>Μακάριος ἀνὴρ ὃς ὑπομένει πειρασμόν</strong>, ὅτι δόκιμος γενόμενος λήμψεται τὸν στέφανον τῆς ζωῆς, ὃν ἐπηγγείλατο τοῖς ἀγαπῶσιν αὐτόν.» (<a href="https://bibleox.com/el/gr-lxx-byz/iak/1/#L12">Ιακ 1:12</a>)</p></blockquote><blockquote><p>«<strong>ἐν ᾧ ἀγαλλιᾶσθε, ὀλίγον ἄρτι εἰ δέον [ἐστὶν] λυπηθέντες ἐν ποικίλοις πειρασμοῖς</strong>, ἵνα τὸ δοκίμιον ὑμῶν τῆς πίστεως πολυτιμότερον χρυσίου τοῦ ἀπολλυμένου, διὰ πυρὸς δὲ δοκιμαζομένου, εὑρεθῇ εἰς ἔπαινον καὶ δόξαν καὶ τιμὴν ἐν ἀποκαλύψει Ἰησοῦ Χριστοῦ.» (<a href="https://bibleox.com/el/gr-lxx-byz/1pet/1/#L6-7">Α Πε 1:6-7</a>)</p></blockquote><blockquote><p>«Ἀγαπητοί, <strong>μὴ ξενίζεσθε τῇ ἐν ὑμῖν πυρώσει πρὸς πειρασμὸν ὑμῖν γινομένῃ</strong> ὡς ξένου ὑμῖν συμβαίνοντος, ἀλλὰ καθὸ κοινωνεῖτε τοῖς τοῦ Χριστοῦ παθήμασιν χαίρετε, ἵνα καὶ ἐν τῇ ἀποκαλύψει τῆς δόξης αὐτοῦ χαρῆτε ἀγαλλιώμενοι.» (<a href="https://bibleox.com/el/gr-lxx-byz/1pet/4/#L12-13">Α Πε 4:12-13</a>)</p></blockquote><h2>Ο Θεός δεν επιτρέπει πειρασμούς πάνω από τις δυνάμεις και ενισχύει τον πιστό</h2><blockquote><p>«πειρασμὸς ὑμᾶς οὐκ εἴληφεν εἰ μὴ ἀνθρώπινος· πιστὸς δὲ ὁ θεός, <strong>ὃς οὐκ ἐάσει ὑμᾶς πειρασθῆναι ὑπὲρ ὃ δύνασθε</strong>, ἀλλὰ <strong>ποιήσει σὺν τῷ πειρασμῷ καὶ τὴν ἔκβασιν τοῦ δύνασθαι ὑπενεγκεῖν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/10/#L13">Α Κορ 10:13</a>)</p></blockquote><blockquote><p>«<strong>οἶδεν κύριος εὐσεβεῖς ἐκ πειρασμοῦ ῥύεσθαι</strong>, ἀδίκους δὲ εἰς ἡμέραν κρίσεως κολαζομένους τηρεῖν» (<a href="https://bibleox.com/el/gr-lxx-byz/2pet/2/#L9">Β Πε 2:9</a>)</p></blockquote><h2>Πώς να νικούμε τους πειρασμούς</h2><p>Χρειάζεται πνευματική εγρήγορση και προσευχή:</p><blockquote><p>«<strong>γρηγορεῖτε καὶ προσεύχεσθε</strong>, ἵνα μὴ εἰσέλθητε εἰς πειρασμόν· τὸ μὲν πνεῦμα πρόθυμον ἡ δὲ σὰρξ ἀσθενής.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/26/#L41">Μτ 26:41</a> · <a href="https://bibleox.com/el/gr-lxx-byz/mk/14/#L38">Μκ 14:38</a> · <a href="https://bibleox.com/el/gr-lxx-byz/lk/22/#L40">Λκ 22:40</a> · <a href="https://bibleox.com/el/gr-lxx-byz/lk/22/#L46">Λκ 22:46</a>)</p></blockquote><h2>Η πτώση στους πειρασμούς</h2><blockquote><p>«<strong>οἱ δὲ βουλόμενοι πλουτεῖν ἐμπίπτουσιν εἰς πειρασμὸν</strong> καὶ παγίδα καὶ ἐπιθυμίας πολλὰς ἀνοήτους καὶ βλαβεράς, αἵτινες βυθίζουσιν τοὺς ἀνθρώπους εἰς ὄλεθρον καὶ ἀπώλειαν» (<a href="https://bibleox.com/el/gr-lxx-byz/1tim/6/#L9">Α Τιμ 6:9</a>)</p></blockquote>
