  title_sub:
  meta_desc: Νήστεψαν ο Κύριος Ιησούς Χριστός, οι προφήτες, οι απόστολοι, οι μαθητές του Ιωάννη του Προδρόμου, η Εκκλησία. «Καλό έργο είναι η προσευχή με νηστεία, ελεημοσύνη και δικαιοσύνη» (Τωβ 12:8).
  copy_cover: true
  menu:
    parent: Εκκλησία/Ασκητική
    title: Η νηστεία
    priority: 19
  update: true
  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <p>Για τον ασκητισμό γενικά:</p><blockquote><p>«<strong>πᾶς δὲ ὁ ἀγωνιζόμενος πάντα ἐγκρατεύεται</strong>, ἐκεῖνοι μὲν οὖν <strong>ἵνα φθαρτὸν στέφανον λάβωσιν</strong>, <strong>ἡμεῖς δὲ ἄφθαρτον</strong>. ἐγὼ τοίνυν οὕτως τρέχω ὡς οὐκ ἀδήλως, οὕτως πυκτεύω ὡς οὐκ ἀέρα δέρων· ἀλλὰ <strong>ὑπωπιάζω μου τὸ σῶμα καὶ δουλαγωγῶ, μή πως</strong> ἄλλοις κηρύξας αὐτὸς <strong>ἀδόκιμος γένωμαι</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/9/#L25-27">Α Κορ 9:25-27</a>)</p></blockquote><p>Ο Θεός καλεί να στραφούμε προς Αυτόν με νηστεία:</p><blockquote><p>«καὶ νῦν λέγει κύριος ὁ θεὸς ὑμῶν <strong>Ἐπιστράφητε πρός με ἐξ ὅλης τῆς καρδίας ὑμῶν καὶ ἐν νηστείᾳ</strong> καὶ ἐν κλαυθμῷ καὶ ἐν κοπετῷ» (<a href="https://bibleox.com/el/gr-lxx-byz/iol/2/#L12">Ιλ 2:12</a>)</p></blockquote><p>Ο Κύριος Ιησούς Χριστός άρχισε το κήρυγμα με νηστεία:</p><blockquote><p>«καὶ <strong>νηστεύσας ἡμέρας τεσσαράκοντα</strong> καὶ νύκτας τεσσαράκοντα ὕστερον ἐπείνασεν.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/4/#L2">Μτ 4:2</a>)</p></blockquote><p>Ο Κύριος δίδαξε πώς να νηστεύουμε σωστά:</p><blockquote><p>«<strong>Ὅταν δὲ νηστεύητε</strong>, μὴ γίνεσθε ὡς οἱ ὑποκριταὶ σκυθρωποί, ἀφανίζουσιν γὰρ τὰ πρόσωπα αὐτῶν ὅπως φανῶσιν τοῖς ἀνθρώποις νηστεύοντες· ἀμὴν λέγω ὑμῖν, ἀπέχουσιν τὸν μισθὸν αὐτῶν.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/6/#L16">Μτ 6:16</a>)</p></blockquote><blockquote><p>«σὺ δὲ <strong>νηστεύων</strong> ἄλειψαί σου τὴν κεφαλὴν καὶ τὸ πρόσωπόν σου νίψαι» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/6/#L17">Μτ 6:17</a>)</p></blockquote><p>Οι μαθητές του προφήτη Ιωάννη νήστευαν:</p><blockquote><p>«Τότε προσέρχονται αὐτῷ οἱ μαθηταὶ Ἰωάννου λέγοντες, Διὰ τί <strong>ἡμεῖς καὶ οἱ Φαρισαῖοι νηστεύομεν</strong> πολλά, οἱ δὲ μαθηταί σου οὐ νηστεύουσιν;» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/9/#L14">Μτ 9:14</a> · <a href="https://bibleox.com/el/gr-lxx-byz/mk/2/#L18">Μκ 2:18</a>)</p></blockquote><p>Οι μαθητές του Χριστού θα νηστέψουν μετά τη σταύρωση του Χριστού:</p><blockquote><p>«καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς, Μὴ δύνανται οἱ υἱοὶ τοῦ νυμφῶνος πενθεῖν ἐφ᾿ ὅσον μετ᾿ αὐτῶν ἐστιν ὁ νυμφίος; ἐλεύσονται δὲ ἡμέραι ὅταν ἀπαρθῇ ἀπ᾿ αὐτῶν ὁ νυμφίος, καὶ τότε <strong>νηστεύσουσιν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/9/#L15">Μτ 9:15</a> · <a href="https://bibleox.com/el/gr-lxx-byz/mk/2/#L20">Μκ 2:20</a> · <a href="https://bibleox.com/el/gr-lxx-byz/lk/5/#L35">Λκ 5:35</a>)</p></blockquote><p>Μερικά δαιμόνια δεν μπορούν να εκβληθούν από τον άνθρωπο χωρίς νηστεία (στο κείμενο που παραθέτουμε η φράση «καὶ νηστείᾳ» απουσιάζει):</p><blockquote><p>«καὶ εἶπεν αὐτοῖς, Τοῦτο τὸ γένος ἐν οὐδενὶ δύναται ἐξελθεῖν εἰ μὴ <strong>ἐν προσευχῇ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mk/9/#L29">Μκ 9:29</a>)</p></blockquote><p>Η χήρα στον ναό του Κυρίου υπηρετούσε τον Θεό με προσευχή και νηστεία μέρα και νύχτα:</p><blockquote><p>«χήρα ἕως ἐτῶν ὀγδοήκοντα τεσσάρων, ἣ οὐκ ἀφίστατο τοῦ ἱεροῦ <strong>νηστείαις καὶ δεήσεσιν λατρεύουσα</strong> νύκτα καὶ ἡμέραν.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/2/#L37">Λκ 2:37</a>)</p></blockquote><p>Στον εκατόνταρχο στάλθηκε άγγελος κατά τη διάρκεια της νηστείας (στο κείμενο που παραθέτουμε δεν μνημονεύεται η νηστεία):</p><blockquote><p>«καὶ ὁ Κορνήλιος ἔφη, Ἀπὸ τετάρτης ἡμέρας μέχρι ταύτης τῆς ὥρας ἤμην τὴν ἐνάτην <strong>προσευχόμενος</strong> ἐν τῷ οἴκῳ μου, καὶ ἰδοὺ ἀνὴρ ἔστη ἐνώπιόν μου ἐν ἐσθῆτι λαμπρᾷ» (<a href="https://bibleox.com/el/gr-lxx-byz/act/10/#L30">Πραξ 10:30</a>)</p></blockquote><p>Το Άγιο Πνεύμα μιλούσε στους πρώτους χριστιανούς κατά τη διάρκεια της νηστείας:</p><blockquote><p>«<strong>λειτουργούντων δὲ αὐτῶν τῷ κυρίῳ καὶ</strong> <strong>νηστευόντων</strong> εἶπεν τὸ πνεῦμα τὸ ἅγιον, Ἀφορίσατε δή μοι τὸν Βαρναβᾶν καὶ Σαῦλον εἰς τὸ ἔργον ὃ προσκέκλημαι αὐτούς.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/13/#L2">Πραξ 13:2</a>)</p></blockquote><p>Οι πρώτοι χριστιανοί συμπλήρωναν την προσευχή με νηστεία σε κάθε σημαντικό έργο:</p><blockquote><p>«χειροτονήσαντες δὲ αὐτοῖς κατ᾿ ἐκκλησίαν πρεσβυτέρους προσευξάμενοι <strong>μετὰ νηστειῶν</strong> παρέθεντο αὐτοὺς τῷ κυρίῳ εἰς ὃν πεπιστεύκεισαν.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/14/#L23">Πραξ 14:23</a>)</p></blockquote><p>Για χάρη της νηστείας οι σύζυγοι μπορούν να απομακρύνονται προσωρινά ο ένας από τον άλλο (στο κείμενο που παραθέτουμε δεν μνημονεύεται η νηστεία):</p><blockquote><p>«μὴ ἀποστερεῖτε ἀλλήλους, εἰ μήτι ἂν ἐκ συμφώνου πρὸς καιρὸν ἵνα σχολάσητε <strong>τῇ προσευχῇ</strong> καὶ πάλιν ἐπὶ τὸ αὐτὸ ἦτε, ἵνα μὴ πειράζῃ ὑμᾶς ὁ Σατανᾶς διὰ τὴν ἀκρασίαν ὑμῶν.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/7/#L5">Α Κορ 7:5</a>)</p></blockquote><p>Με τη νηστεία οι απόστολοι φανερώνονται ως υπηρέτες του Θεού:</p><blockquote><p>«ἀλλ᾿ ἐν παντὶ συνιστάνοντες ἑαυτοὺς ὡς θεοῦ διάκονοι, ἐν ὑπομονῇ πολλῇ, ἐν θλίψεσιν, ἐν ἀνάγκαις, ἐν στενοχωρίαις, ἐν πληγαῖς, ἐν φυλακαῖς, ἐν ἀκαταστασίαις, ἐν κόποις, ἐν ἀγρυπνίαις, <strong>ἐν νηστείαις</strong>, ἐν ἁγνότητι, ἐν γνώσει, ἐν μακροθυμίᾳ, ἐν χρηστότητι, ἐν πνεύματι ἁγίῳ, ἐν ἀγάπῃ ἀνυποκρίτῳ» (<a href="https://bibleox.com/el/gr-lxx-byz/2kor/6/#L4-6">Β Κορ 6:4-6</a>)</p></blockquote><p>Ο απόστολος, κατηγορώντας τον εαυτό του για τον αναγκαστικό αυτοέπαινό του (<a href="https://bibleox.com/el/gr-lxx-byz/2kor/11/#L21">Β Κορ 11:21</a>), καυχιέται για τη νηστεία:</p><blockquote><p>«κόπῳ καὶ μόχθῳ, ἐν ἀγρυπνίαις πολλάκις, ἐν λιμῷ καὶ δίψει, <strong>ἐν νηστείαις</strong> πολλάκις, ἐν ψύχει καὶ γυμνότητι» (<a href="https://bibleox.com/el/gr-lxx-byz/2kor/11/#L27">Β Κορ 11:27</a>)</p></blockquote><p>Ο απόστολος επιτρέπει στον επίσκοπο Τιμόθεο να χαλαρώσει τη νηστεία εξαιτίας της ασθενούς υγείας του:</p><blockquote><p>«<strong>Μηκέτι ὑδροπότει</strong>, ἀλλὰ οἴνῳ ὀλίγῳ χρῶ διὰ τὸν στόμαχον καὶ τὰς πυκνάς σου ἀσθενείας.» (<a href="https://bibleox.com/el/gr-lxx-byz/1tim/5/#L23">Α Τιμ 5:23</a>)</p></blockquote><p>Καλό έργο = προσευχή + νηστεία + ελεημοσύνη + δικαιοσύνη:</p><blockquote><p>«<strong>ἀγαθὸν προσευχὴ μετὰ νηστείας</strong> καὶ ἐλεημοσύνης καὶ δικαιοσύνης· ἀγαθὸν τὸ ὀλίγον μετὰ δικαιοσύνης ἢ πολὺ μετὰ ἀδικίας· καλὸν ποιῆσαι ἐλεημοσύνην ἢ θησαυρίσαι χρυσίον.» (<a href="https://bibleox.com/el/gr-lxx-byz/tov/12/#L8">Τωβ 12:8</a>)</p></blockquote><p>Ο βασιλιάς και προφήτης Δαυίδ στις συμφορές ταπεινωνόταν ενώπιον του Θεού με νηστεία:</p><blockquote><p>«ἐγὼ δὲ ἐν τῷ αὐτοὺς παρενοχλεῖν μοι ἐνεδυόμην σάκκον καὶ <strong>ἐταπείνουν ἐν νηστείᾳ τὴν ψυχήν μου</strong>, καὶ ἡ προσευχή μου εἰς κόλπον μου ἀποστραφήσεται.» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/34/#L13">Ψλ 34:13</a>)</p></blockquote>
