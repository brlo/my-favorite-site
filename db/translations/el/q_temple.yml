  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: '<h2>Γενικές πληροφορίες</h2><p>Ο ναός χτίστηκε από τον Σολομώντα στο όρος Μοριά (<a href="https://bibleox.com/el/gr-lxx-byz/2par/3/#L1">Β Παρ 3:1</a>), στον τόπο του αλωνιού (του τόπου όπου συγκεντρώνουν και καθαρίζουν το σιτάρι) του Ορνά του Ιεβουσαίου (<a href="https://bibleox.com/el/gr-lxx-byz/2par/3/#L1">Β Παρ 3:1</a>), όπου ο πατέρας του Σολομώντα (Δαυίδ) είδε τον άγγελο που έπληττε τον λαό και όπου επίσης υπέδειξε ο προφήτης Γαδ (<a href="https://bibleox.com/el/gr-lxx-byz/2ts/24/#L16-18">Β Βασ 24:16-18</a>). Η οικοδόμηση του ναού άρχισε το 480ό έτος μετά την έξοδο των Εβραίων από την Αίγυπτο (κατά τους Ο΄ — το 440ό). Ήταν το 4ο έτος της βασιλείας του Σολομώντα, τον μήνα Νισώ (εβρ. Ζιφ) (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/6/#L3">Γ Βασ 6:3</a> · <a href="https://bibleox.com/el/gr-lxx-byz/2par/3/#L2">Β Παρ 3:2</a>). Η οικοδόμηση ολοκληρώθηκε μετά από 7 χρόνια, όταν διένυε το 11ο έτος της βασιλείας του Σολομώντα, τον μήνα Βαάλ (εβρ. Βουλ) (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/6/#L4">Γ Βασ 6:4</a>).</p><h2>Η εντολή του Θεού για την οικοδόμηση του ναού</h2><blockquote><p>«Καὶ ἐλάλησεν κύριος πρὸς Μωυσῆν λέγων Εἰπὸν τοῖς υἱοῖς Ισραηλ, καὶ λάβετέ μοι ἀπαρχὰς παρὰ πάντων, οἷς ἂν δόξῃ τῇ καρδίᾳ, καὶ λήμψεσθε τὰς ἀπαρχάς μου. &lt;…&gt; καὶ <strong>ποιήσεις μοι ἁγίασμα</strong>, καὶ ὀφθήσομαι ἐν ὑμῖν· &lt;…&gt; ὅρα <strong>ποιήσεις κατὰ τὸν τύπον τὸν δεδειγμένον σοι ἐν τῷ ὄρει</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/25/#L1-2,8,40">Έξ 25:1-2,8,40</a>)</p></blockquote><blockquote><p>«Ἡ <strong>σκηνὴ</strong> τοῦ μαρτυρίου ἦν τοῖς πατράσιν ἡμῶν ἐν τῇ ἐρήμῳ, καθὼς <strong>διετάξατο ὁ λαλῶν τῷ Μωϋσῇ ποιῆσαι αὐτὴν</strong> κατὰ τὸν τύπον ὃν ἑωράκει,» (<a href="https://bibleox.com/el/gr-lxx-byz/act/7/#L44">Πραξ 7:44</a>)</p></blockquote><p>Ο επίγειος ναός κατασκευάζεται κατά το πρότυπο της ουράνιας πραγματικότητας:</p><blockquote><p><em>«οὐ γὰρ εἰς </em><strong><em>χειροποίητα εἰσῆλθεν ἅγια Χριστός, ἀντίτυπα τῶν ἀληθινῶν</em></strong><em>, ἀλλ᾿ εἰς αὐτὸν τὸν οὐρανόν, νῦν ἐμφανισθῆναι τῷ προσώπῳ τοῦ θεοῦ ὑπὲρ ἡμῶν·» (</em><a href="https://bibleox.com/el/gr-lxx-byz/evr/9/#L24"><em>Εβρ 9:24</em></a><em>)</em></p></blockquote><h2>Η διάταξη του ναού της Ιερουσαλήμ</h2><p>Οι τοίχοι του ναού ήταν χτισμένοι από πέτρα.</p><p><em>Στη συνέχεια οι διαστάσεις δίνονται σε πήχεις. Για να μετατρέψουμε κατά προσέγγιση τους πήχεις σε μέτρα, διαιρούμε τον αριθμό των πήχεων με το 2.</em></p><h3>Διαστάσεις του ναού (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/6/#L4">Γ Βασ 6:4</a> · <a href="https://bibleox.com/el/gr-lxx-byz/2par/3/#L3">Β Παρ 3:3</a>)</h3><ul><li><p>60 πήχεις μήκος (χωρισμένος με τοίχο σε 20 και 40 πήχεις),</p></li><li><p>20 πήχεις πλάτος,</p></li><li><p>30 πήχεις ύψος.</p></li></ul><p>Σε μέτρα: 31,5 × 10,5 × 15,75.</p><p>Ο ναός χωρίζεται σε δύο μέρη (των 20 και των 40 πήχεων) με πέτρινο τοίχο (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/6/#L16-17">Γ Βασ 6:16-17</a>):</p><ul><li><p>το μέρος των 20 πήχεων ονομάζεται «Άγια των Αγίων» (ή Δαβίρ, ή «εσωτερικό μέρος του ναού»),</p></li><li><p>το μέρος των 40 πήχεων ονομάζεται «Άγια».</p></li></ul><p>Ο ναός είχε θυρίδες με δικτυωτά πλαίσια και εσοχές (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/6/#L4">Γ Βασ 6:4</a>).</p><h3>Το αιλάμ</h3><p>Μπροστά από τον ναό ήταν επίσης προσαρτημένο το αιλάμ (δεν λογίζεται ως ο ναός). Οι διαστάσεις του (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/6/#L4">Γ Βασ 6:4</a>):</p><ul><li><p>20 πήχεις μήκος,</p></li><li><p>10 πήχεις πλάτος,</p></li><li><p>120 πήχεις ύψος (<a href="https://bibleox.com/el/gr-lxx-byz/2par/3/#L4">Β Παρ 3:4</a>)?</p></li></ul><h3>Η πλευρική προσθήκη</h3><p>Γύρω από τον ναό έγινε τριώροφη προσθήκη (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/6/#L5">Γ Βασ 6:5</a>), που δεν αγγίζει τους τοίχους του ναού (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/6/#L6">Γ Βασ 6:6</a>). Το πλάτος των ορόφων, αρχίζοντας από τον κατώτερο: 5, 6, 7 πήχεις.</p><h3>Τα πλευρικά δωμάτια</h3><p>Γύρω από τον ναό χτίστηκαν επίσης πλευρικά δωμάτια, στερεωμένα στον ναό με κέδρινα δοκάρια (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/6/#L10">Γ Βασ 6:10</a>). Το ύψος των δωματίων: 5 πήχεις.</p><h3>Οι τοίχοι του ναού</h3><p>Οι τοίχοι είναι χτισμένοι από λαξευμένη πέτρα. Εσωτερικά οι τοίχοι και η οροφή του ναού είναι επενδυμένοι με κέδρινες σανίδες (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/6/#L9,16">Γ Βασ 6:9,16</a>). Το δάπεδο του ναού είναι επενδυμένο με σανίδες πεύκης (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/6/#L15">Γ Βασ 6:15</a>). Όλα ήταν καλυμμένα με ξύλο, και η πέτρα δεν φαινόταν από μέσα. Οι τοίχοι και το δάπεδο του ναού ήταν επίσης ως έναν βαθμό διακοσμημένοι με χρυσό (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/6/#L22">Γ Βασ 6:22</a> · <a href="https://bibleox.com/el/gr-lxx-byz/2par/3/#L5">Β Παρ 3:5</a> · <a href="https://bibleox.com/el/gr-lxx-byz/2par/3/#L7">Β Παρ 3:7</a> · <a href="https://bibleox.com/el/gr-lxx-byz/3ts/6/#L30">Γ Βασ 6:30</a>). Κατά κανόνα, με χρυσό καλύπτονταν οι γλυπτές παραστάσεις (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/6/#L32">Γ Βασ 6:32</a>). Πάνω στις κέδρινες σανίδες (τοίχους και οροφή) ήταν σκαλισμένα χερουβίμ, φοίνικες, ανθισμένα άνθη (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/6/#L29">Γ Βασ 6:29</a>), καθώς και απομιμήσεις κολοκυνθών. Ήταν σκαλισμένα «μέσα και έξω» (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/6/#L29">Γ Βασ 6:29</a>), δηλαδή στα Άγια των Αγίων (μέσα, στο εσωτερικό μέρος του ναού) και στα Άγια (έξω, στο εξωτερικό μέρος). Ο ναός ήταν στολισμένος με πολύτιμους λίθους (<a href="https://bibleox.com/el/gr-lxx-byz/2par/3/#L6">Β Παρ 3:6</a>). Σημαντικό: παραστάσεις χερουβίμ υπήρχαν και πριν, στα καλύμματα (τους τοίχους) της Σκηνής (<a href="https://bibleox.com/el/gr-lxx-byz/ish/26/#L1">Έξ 26:1</a>).</p><h2>Τα Άγια των Αγίων</h2><p>Διαστάσεις: 20 × 20 × 20 πήχεις (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/6/#L20">Γ Βασ 6:20</a> · <a href="https://bibleox.com/el/gr-lxx-byz/2par/3/#L8">Β Παρ 3:8</a>). Τα Άγια των Αγίων ήταν επενδυμένα με καθαρό χρυσό. Είχαν τεντωμένες χρυσές αλυσίδες (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/6/#L21">Γ Βασ 6:21</a> · <a href="https://bibleox.com/el/gr-lxx-byz/2par/3/#L16">Β Παρ 3:16</a>).</p><h3>Η είσοδος</h3><p>Η είσοδος στα Άγια των Αγίων γινόταν από <strong>θύρα με πενταπλές φλιές</strong> (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/6/#L31">Γ Βασ 6:31</a> · <a href="https://bibleox.com/el/gr-lxx-byz/2par/4/#L22">Β Παρ 4:22</a>), φτιαγμένη από ξύλο αρκεύθου. Η θύρα (όπως και οι τοίχοι) ήταν στολισμένη με γλυπτές παραστάσεις χερουβίμ, φοινίκων και ανθισμένων ανθέων. Οι γλυπτές παραστάσεις ήταν καλυμμένες με χρυσό (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/6/#L32">Γ Βασ 6:32</a>). Εδώ υπήρχε και καταπέτασμα με κεντημένες παραστάσεις χερουβίμ (<a href="https://bibleox.com/el/gr-lxx-byz/2par/3/#L14">Β Παρ 3:14</a> · <a href="https://bibleox.com/el/gr-lxx-byz/1mak/1/#L22">I Μακ 1:22</a>), από υακίνθινο ύφασμα, κόκκινο και πορφυρό, όπως ήταν στη Σκηνή (<a href="https://bibleox.com/el/gr-lxx-byz/ish/26/#L31">Έξ 26:31</a>). Μπροστά από το καταπέτασμα έκαιγε πάντοτε ακοίμητη λυχνία (<a href="https://bibleox.com/el/gr-lxx-byz/lev/24/#L1-4">Λευ 24:1-4</a>).</p><h3>Τα δύο χερουβίμ</h3><p>Τοποθετήθηκαν δύο μεγάλα αγάλματα χερουβίμ, φτιαγμένα από ξύλο ελιάς (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/6/#L23">Γ Βασ 6:23</a>). Ήταν επενδυμένα με χρυσό (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/6/#L28">Γ Βασ 6:28</a> · <a href="https://bibleox.com/el/gr-lxx-byz/2par/3/#L10">Β Παρ 3:10</a>). Το ύψος και το πλάτος των χερουβίμ ήταν 10 πήχεις (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/6/#L23">Γ Βασ 6:23</a>), το πλάτος μετριέται από την άκρη του ενός φτερού ως την άκρη του άλλου (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/6/#L24-27">Γ Βασ 6:24-27</a> · <a href="https://bibleox.com/el/gr-lxx-byz/2par/3/#L11">Β Παρ 3:11</a>). Το ένα φτερό του χερουβίμ ακουμπούσε τον τοίχο, το άλλο φτερό ακουμπούσε το φτερό του διπλανού χερουβίμ (<a href="https://bibleox.com/el/gr-lxx-byz/2par/3/#L11-12">Β Παρ 3:11-12</a>). Τα πρόσωπά τους ήταν στραμμένα προς τον ναό (<a href="https://bibleox.com/el/gr-lxx-byz/2par/3/#L13">Β Παρ 3:13</a>).</p><h3>Η Κιβωτός της Διαθήκης</h3><p>Στη μέση, κάτω από τα φτερά των χερουβίμ, βρισκόταν η Κιβωτός της Διαθήκης (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/6/#L19">Γ Βασ 6:19</a> · <a href="https://bibleox.com/el/gr-lxx-byz/3ts/8/#L6">Γ Βασ 8:6</a> · <a href="https://bibleox.com/el/gr-lxx-byz/2par/5/#L7">Β Παρ 5:7</a>), μαζί με τους αναφορείς της για τη μεταφορά (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/8/#L7">Γ Βασ 8:7</a> · <a href="https://bibleox.com/el/gr-lxx-byz/2par/5/#L9">Β Παρ 5:9</a> · <a href="https://bibleox.com/el/gr-lxx-byz/ish/25/#L15">Έξ 25:15</a>). Οι διαστάσεις της κιβωτού: 2 × 1,5 × 1,5 πήχεις (<a href="https://bibleox.com/el/gr-lxx-byz/ish/25/#L10">Έξ 25:10</a>). Η κιβωτός ήταν φτιαγμένη από ξύλο άσηπτο (<a href="https://bibleox.com/el/gr-lxx-byz/ish/25/#L10">Έξ 25:10</a>) και ήταν καλυμμένη με χρυσό εξωτερικά και εσωτερικά (<a href="https://bibleox.com/el/gr-lxx-byz/ish/25/#L10">Έξ 25:10</a>). Σε κάθε γωνία της βάσης της κιβωτού υπήρχε χρυσός δακτύλιος (<a href="https://bibleox.com/el/gr-lxx-byz/ish/25/#L12">Έξ 25:12</a>) για τους ξύλινους αναφορείς, επίσης καλυμμένους με χρυσό (<a href="https://bibleox.com/el/gr-lxx-byz/ish/25/#L13">Έξ 25:13</a>), που χρειάζονται για τη μεταφορά της κιβωτού. Μέσα στην κιβωτό βρίσκονταν οι 2 λίθινες πλάκες της Διαθήκης, που τις είχε τοποθετήσει εκεί ο προφήτης Μωυσής (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/8/#L9">Γ Βασ 8:9</a> · <a href="https://bibleox.com/el/gr-lxx-byz/2par/5/#L10">Β Παρ 5:10</a>), το μάννα (<a href="https://bibleox.com/el/gr-lxx-byz/ish/16/#L32-34">Έξ 16:32-34</a>) και η ανθισμένη ράβδος του Ααρών από αμυγδαλιά (<a href="https://bibleox.com/el/gr-lxx-byz/chis/17/#L8-11">Αρ 17:8-11</a>). Η Κιβωτός της Διαθήκης από πάνω ήταν σκεπασμένη με κάλυμμα 2 × 1,5 πήχεων (<a href="https://bibleox.com/el/gr-lxx-byz/ish/25/#L17">Έξ 25:17</a>). Πάνω στο κάλυμμα βρίσκονταν δύο χρυσά ομοιώματα χερουβίμ, στραμμένα το ένα προς το άλλο (<a href="https://bibleox.com/el/gr-lxx-byz/ish/25/#L18-20">Έξ 25:18-20</a>). Τα φτερά τους ήταν υψωμένα και σκέπαζαν με αυτά το κάλυμμα της κιβωτού. Πάνω από το κάλυμμα της κιβωτού, ανάμεσα στα δύο χερουβίμ, ο Θεός αποκαλυπτόταν και μιλούσε (<a href="https://bibleox.com/el/gr-lxx-byz/ish/25/#L22">Έξ 25:22</a>).</p><h2>Τα Άγια</h2><h3>Η είσοδος</h3><p>Η είσοδος στα Άγια γινόταν από <strong>τετράπλευρη δίφυλλη θύρα</strong>, φτιαγμένη από ξύλο πεύκης (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/6/#L34">Γ Βασ 6:34</a>), και οι φλιές της από ξύλο αρκεύθου (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/6/#L33">Γ Βασ 6:33</a>). Οι θύρες αυτές ήταν επίσης στολισμένες με ανάγλυφες παραστάσεις χερουβίμ, φοινίκων και ανθισμένων ανθέων, καλυμμένες με χρυσό (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/6/#L35">Γ Βασ 6:35</a>).</p><h3>Το θυσιαστήριο</h3><p>Μπροστά από τη θύρα των Αγίων των Αγίων βρισκόταν το θυσιαστήριο για την καύση του θυμιάματος. Ήταν φτιαγμένο από ξύλο και επενδυμένο με χρυσό (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/6/#L20">Γ Βασ 6:20</a> · <a href="https://bibleox.com/el/gr-lxx-byz/3ts/7/#L34">Γ Βασ 7:34</a>).</p><h3>Η τράπεζα</h3><p>Δίπλα υπήρχε η χρυσή τράπεζα για τους άρτους της προθέσεως (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/7/#L34">Γ Βασ 7:34</a> · <a href="https://bibleox.com/el/gr-lxx-byz/2par/4/#L8">Β Παρ 4:8</a>).</p><h3>Οι λυχνίες</h3><p>Αριστερά και δεξιά βρίσκονταν χρυσές λυχνίες (μενόρες): 5 δεξιά και 5 αριστερά (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/7/#L35">Γ Βασ 7:35</a>). Ήταν ολόκληρες φτιαγμένες από καθαρό χρυσό, μαζί με τα λυχνάρια, τα θυμιατήρια, τα άνθη, τις λαβίδες, τα τρύβλια, τα μαχαίρια, τις φιάλες, τους δίσκους και τους μεντεσέδες των θυρών — όλα από χρυσό (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/7/#L36">Γ Βασ 7:36</a> · <a href="https://bibleox.com/el/gr-lxx-byz/2par/4/#L19-22">Β Παρ 4:19-22</a>).</p><h2>Ο πρόναος</h2><p>Εσωτερικά είναι επενδυμένος με καθαρό χρυσό (<a href="https://bibleox.com/el/gr-lxx-byz/2par/3/#L4">Β Παρ 3:4</a>).</p><h3>Οι στύλοι: Ιαχίν και Βοόζ</h3><p>Μπροστά από την είσοδο του προνάου τοποθετήθηκαν δύο τεράστιοι χάλκινοι πανομοιότυποι στύλοι, στους οποίους δόθηκαν ονόματα: δεξιά — Ιαχίν (Ιαχουμ), αριστερά — Βοόζ (Βααζ) (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/7/#L7">Γ Βασ 7:7</a> · <a href="https://bibleox.com/el/gr-lxx-byz/2par/3/#L17">Β Παρ 3:17</a>). Σε ύψος οι στύλοι ήταν <strong>18 πήχεις</strong> (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/7/#L3">Γ Βασ 7:3</a>) (35 πήχεις — <a href="https://bibleox.com/el/gr-lxx-byz/2par/3/#L15">Β Παρ 3:15</a>). Τους περιέβαλλε σχοινί 14 πήχεων (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/7/#L3">Γ Βασ 7:3</a>). Πάνω στους στύλους βρίσκονταν κιονόκρανα, ύψους 5 πήχεων το καθένα (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/7/#L4">Γ Βασ 7:4</a>). Τα κιονόκρανα ήταν στολισμένα με δίχτυα και σχοινιά σε σχήμα αλυσίδας (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/7/#L4">Γ Βασ 7:4</a>): 7 σειρές σχοινιών σε κάθε κιονόκρανο.. Στα κιονόκρανα υπήρχαν δύο σειρές ρόδια (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/7/#L6">Γ Βασ 7:6</a>). Αναφέρονται επίσης κιονόκρανα των στύλων στον πρόναο, σε σχήμα κρίνων, 4 πήχεις το καθένα (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/7/#L8">Γ Βασ 7:8</a>).</p><h2>Οι αυλές</h2><p>Μπροστά από τον ναό έγινε η <strong>εσωτερική (ιερατική) αυλή</strong> (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/6/#L36">Γ Βασ 6:36</a> · <a href="https://bibleox.com/el/gr-lxx-byz/2par/4/#L9">Β Παρ 4:9</a>). Είναι χτισμένη (περιφραγμένη) με τρεις σειρές λαξευμένων λίθων και μία σειρά κέδρινων δοκών (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/6/#L36">Γ Βασ 6:36</a>) (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/7/#L49">Γ Βασ 7:49</a>). Περιφραγμένη ήταν και η μεγάλη εξωτερική αυλή (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/7/#L49">Γ Βασ 7:49</a> · <a href="https://bibleox.com/el/gr-lxx-byz/2par/4/#L9">Β Παρ 4:9</a>).</p><h3>Το θυσιαστήριο</h3><p>Διαστάσεις: 20 × 20 πήχεις και 10 πήχεις ύψος (<a href="https://bibleox.com/el/gr-lxx-byz/2par/4/#L1">Β Παρ 4:1</a>).</p><h3>Η χυτή θάλασσα</h3><p>Στρογγυλό σκεύος για το πλύσιμο των ιερέων (<a href="https://bibleox.com/el/gr-lxx-byz/2par/4/#L6">Β Παρ 4:6</a>). Στην πρώτη (εσωτερική) αυλή βρισκόταν η στρογγυλή θάλασσα, χυτή από χαλκό («η χάλκινη θάλασσα»). Διαστάσεις: 10 πήχεις σε διάμετρο, 5 πήχεις σε ύψος (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/7/#L10">Γ Βασ 7:10</a> · <a href="https://bibleox.com/el/gr-lxx-byz/2par/4/#L2">Β Παρ 4:2</a>), πάχος — περίπου μια παλάμη ανθρώπου (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/7/#L12">Γ Βασ 7:12</a> · <a href="https://bibleox.com/el/gr-lxx-byz/2par/4/#L5">Β Παρ 4:5</a>). Ένα σχοινί 30 πήχεων την περιέβαλλε ολόγυρα (<a href="https://bibleox.com/el/gr-lxx-byz/2par/4/#L2">Β Παρ 4:2</a>). Οι άκρες του έργου ήταν στολισμένες με δύο σειρές κολοκυνθών: 10 κολοκύνθες σε 1 πήχη (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/7/#L11">Γ Βασ 7:11</a>). Χωρούσε 2000 βάτους (κατά το εβραϊκό κείμενο) ή 3000 μετρητές (<a href="https://bibleox.com/el/gr-lxx-byz/2par/4/#L5">Β Παρ 4:5</a>). Στεκόταν στα νοτιοανατολικά του ναού (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/7/#L25">Γ Βασ 7:25</a> · <a href="https://bibleox.com/el/gr-lxx-byz/2par/4/#L10">Β Παρ 4:10</a>).</p><h3>Οι 12 βόες</h3><p>Η χάλκινη θάλασσα στεκόταν πάνω σε 12 βόες (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/7/#L13">Γ Βασ 7:13</a> · <a href="https://bibleox.com/el/gr-lxx-byz/2par/4/#L3-4">Β Παρ 4:3-4</a> · <a href="https://bibleox.com/el/gr-lxx-byz/2par/4/#L15">Β Παρ 4:15</a>): 3 βόες έβλεπαν προς τον βορρά, και προς τις υπόλοιπες πλευρές του ορίζοντα έβλεπαν επίσης από 3 βόες.</p><h3>Οι 10 λουτήρες</h3><p>Σκεύη για το πλύσιμο των ζώων των θυσιών, πριν από την προσφορά (<a href="https://bibleox.com/el/gr-lxx-byz/2par/4/#L6">Β Παρ 4:6</a>). Κάθε λουτήρας χωρούσε 40 χοείς (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/7/#L24">Γ Βασ 7:24</a>). Στέκονταν δίπλα στον ναό: 5 αριστερά και 5 δεξιά (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/7/#L25">Γ Βασ 7:25</a>). Κάθε ένας από αυτούς είχε κινητή βάση με τροχούς.</p><h3>Οι 10 βάσεις</h3><p>10 κινητές χάλκινες τετράγωνες βάσεις (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/7/#L14">Γ Βασ 7:14</a> · <a href="https://bibleox.com/el/gr-lxx-byz/3ts/7/#L21">Γ Βασ 7:21</a>): 5 × 4 πήχεις και 6 πήχεις ύψος. Στα τοιχώματα των βάσεων ήταν σκαλισμένα λιοντάρια, βόες και χερουβίμ, και επάνω — πλαίσια (χῶραι) (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/7/#L16">Γ Βασ 7:16</a>). Οι βάσεις μετακινούνταν πάνω σε 4 χάλκινους τροχούς (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/7/#L17">Γ Βασ 7:17</a>). Το ύψος των τροχών: ενάμισι πήχη (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/7/#L18">Γ Βασ 7:18</a>). Όλες ήταν όμοιες (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/7/#L23">Γ Βασ 7:23</a>).</p><h3>Ψαλτωδοί, σαλπιστές</h3><p>Κατά τα εγκαίνια του ναού οι Λευίτες έψαλλαν και έπαιζαν μουσικά όργανα (κύμβαλα, νάβλα και κινύρα), και οι ιερείς σάλπιζαν (<a href="https://bibleox.com/el/gr-lxx-byz/2par/5/#L12">Β Παρ 5:12</a>). Τα μουσικά όργανα είχαν κατασκευαστεί ειδικά για τον ναό (<a href="https://bibleox.com/el/gr-lxx-byz/2par/7/#L6">Β Παρ 7:6</a>).</p><h2>Οι γλυπτές παραστάσεις</h2><p>Γλυπτές παραστάσεις χερουβίμ υπήρχαν στους τοίχους του ναού (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/6/#L32">Γ Βασ 6:32</a>), στην είσοδο (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/6/#L32">Γ Βασ 6:32</a> · <a href="https://bibleox.com/el/gr-lxx-byz/3ts/6/#L35">Γ Βασ 6:35</a>) και στο καταπέτασμα μπροστά από την είσοδο των Αγίων των Αγίων (<a href="https://bibleox.com/el/gr-lxx-byz/2par/3/#L14">Β Παρ 3:14</a> · <a href="https://bibleox.com/el/gr-lxx-byz/1mak/1/#L22">I Μακ 1:22</a>). Στα Άγια των Αγίων στέκονταν δύο μεγάλα ξύλινα επιχρυσωμένα αγάλματα χερουβίμ (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/6/#L23">Γ Βασ 6:23</a>). Πάνω στο κάλυμμα της Κιβωτού της Διαθήκης ήταν φτιαγμένα δύο αγάλματα χερουβίμ (<a href="https://bibleox.com/el/gr-lxx-byz/ish/25/#L18-20">Έξ 25:18-20</a>). Στην αυλή του ναού, πάνω στις μεγάλες βάσεις για τους λουτήρες, ήταν σκαλισμένα λιοντάρια, βόες και χερουβίμ (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/7/#L16">Γ Βασ 7:16</a>).</p><h2>Η προσευχή</h2><p>Η προσευχή του βασιλιά Σολομώντα κατά τα εγκαίνια του ναού: <a href="https://bibleox.com/el/gr-lxx-byz/3ts/8/#L22-53">Γ Βασ 8:22-53</a> · <a href="https://bibleox.com/el/gr-lxx-byz/2par/6/#L14-42">Β Παρ 6:14-42</a></p><p>Η απάντηση του Θεού στην προσευχή του Σολομώντα: <a href="https://bibleox.com/el/gr-lxx-byz/2par/7/#L12-22">Β Παρ 7:12-22</a></p>'
