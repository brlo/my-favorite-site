  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <h2>Ορισμός</h2><p><strong>Θυμίαμα</strong> — ο καπνός από τον καιόμενο λίβανο (ρητίνη).</p><p><strong>Λίβανος</strong> ή <strong>Λιβάνι</strong> (αραβ. lādan — «αρωματική ρητίνη») — αρωματική ρητίνη ορισμένων δέντρων, αρχικά από τους κέδρους του Λιβάνου. Ο καιόμενος λίβανος αναδίδει ευχάριστη ευωδία. Χρησιμοποιείται κατά τις ιεροπραξίες και την παρασκευή ευώδων ιερών συνθέσεων (<a href="https://bibleox.com/el/gr-lxx-byz/ish/30/#L34-36">Έξ 30:34-36</a>).</p><p><strong>Θυμίαση</strong> — η καύση του λιβάνου, η ανάδυση του θυμιάματος από αυτόν.</p><p><strong>Θυμιατό (θυμιατήρι)</strong> — σκεύος (φιάλη) για την καύση ευωδών συνθέσεων (με λίβανο).</p><h2>Βιβλικές ρήσεις</h2><h3>Η ευώδης σύνθεση (με λίβανο) — άγιο των αγίων</h3><blockquote><p>«καὶ εἶπεν κύριος πρὸς Μωυσῆν <strong>Λαβὲ σεαυτῷ ἡδύσματα</strong>, στακτήν, ὄνυχα, χαλβάνην ἡδυσμοῦ καὶ <strong>λίβανον</strong> διαφανῆ, ἴσον ἴσῳ ἔσται· καὶ ποιήσουσιν ἐν αὐτῷ θυμίαμα, μυρεψικὸν ἔργον μυρεψοῦ, μεμιγμένον, καθαρόν, ἔργον ἅγιον. καὶ συγκόψεις ἐκ τούτων λεπτὸν καὶ θήσεις ἀπέναντι τῶν μαρτυρίων ἐν τῇ σκηνῇ τοῦ μαρτυρίου, ὅθεν γνωσθήσομαί σοι ἐκεῖθεν· <strong>ἅγιον τῶν ἁγίων</strong> ἔσται ὑμῖν. θυμίαμα κατὰ τὴν σύνθεσιν ταύτην οὐ ποιήσετε ὑμῖν αὐτοῖς· <strong>ἁγίασμα ἔσται ὑμῖν κυρίῳ</strong>· ὃς ἂν ποιήσῃ ὡσαύτως ὥστε ὀσφραίνεσθαι ἐν αὐτῷ, ἀπολεῖται ἐκ τοῦ λαοῦ αὐτοῦ.» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/30/#L34-38">Έξ 30:34-38</a>)</p></blockquote><h3>Ο λίβανος (ρητίνη) προστίθεται στην προσφορά σεμιδάλεως (αλεύρου) μαζί με το έλαιο, και έπειτα ο ιερέας καίει τη θυσία</h3><blockquote><p>«Ἐὰν δὲ ψυχὴ προσφέρῃ <strong>δῶρον θυσίαν</strong> τῷ κυρίῳ, σεμίδαλις ἔσται τὸ δῶρον αὐτοῦ, καὶ ἐπιχεεῖ ἐπ᾿ αὐτὸ ἔλαιον καὶ <strong>ἐπιθήσει ἐπ᾿ αὐτὸ <mark>λίβανον</mark></strong>· θυσία ἐστίν. καὶ οἴσει πρὸς τοὺς υἱοὺς Ααρων τοὺς ἱερεῖς, καὶ δραξάμενος ἀπ᾿ αὐτῆς πλήρη τὴν δράκα ἀπὸ τῆς σεμιδάλεως σὺν τῷ ἐλαίῳ καὶ πάντα τὸν λίβανον αὐτῆς καὶ <strong>ἐπιθήσει ὁ ἱερεὺς τὸ μνημόσυνον αὐτῆς ἐπὶ τὸ θυσιαστήριον</strong>· θυσία, ὀσμὴ εὐωδίας τῷ κυρίῳ.» (<a href="https://bibleox.com/el/gr-lxx-byz/lev/2/#L1-2">Λευ 2:1-2</a>)</p></blockquote><h3>Η θυσία γίνεται και χωρίς λίβανο (λιβάνι)</h3><blockquote><p>«καὶ ἄξει ὁ ἄνθρωπος τὴν γυναῖκα αὐτοῦ πρὸς τὸν ἱερέα καὶ <strong>προσοίσει τὸ δῶρον περὶ αὐτῆς</strong> τὸ δέκατον τοῦ οιφι ἄλευρον κρίθινον, οὐκ ἐπιχεεῖ ἐπ᾿ αὐτὸ ἔλαιον <strong>οὐδὲ ἐπιθήσει ἐπ᾿ αὐτὸ λίβανον</strong>, ἔστιν γὰρ θυσία ζηλοτυπίας, θυσία μνημοσύνου ἀναμιμνήσκουσα ἁμαρτίαν.» (<a href="https://bibleox.com/el/gr-lxx-byz/chis/5/#L15">Αρ 5:15</a>)</p></blockquote><h3>Θυσιαστήριο μόνο για το θυμίαμα (τον λίβανο)</h3><p>Χωριστά ορίζεται η κατασκευή θυσιαστηρίου για το θυμίαμα, πάνω στο οποίο δεν πρέπει να καίγεται τίποτε άλλο. Το θυμίαμα πάνω του προσφέρεται ανεξάρτητα από τις θυσίες, αυτοτελώς. Τελείται κάθε πρωί και κάθε βράδυ κατά την προετοιμασία των λυχναριών:</p><blockquote><p>«Καὶ <strong>ποιήσεις θυσιαστήριον θυμιάματος</strong> ἐκ ξύλων ἀσήπτων· καὶ ποιήσεις αὐτὸ &lt;…&gt; καὶ <strong>θήσεις αὐτὸ ἀπέναντι τοῦ καταπετάσματος τοῦ ὄντος ἐπὶ τῆς κιβωτοῦ τῶν μαρτυρίων</strong>, ἐν οἷς γνωσθήσομαί σοι ἐκεῖθεν. καὶ <strong>θυμιάσει ἐπ᾿ αὐτοῦ Ααρων θυμίαμα σύνθετον λεπτόν· τὸ πρωῒ πρωί, ὅταν ἐπισκευάζῃ τοὺς λύχνους, θυμιάσει ἐπ᾿ αὐτοῦ</strong>, καὶ ὅταν ἐξάπτῃ Ααρων τοὺς λύχνους ὀψέ, θυμιάσει ἐπ᾿ αὐτοῦ· θυμίαμα ἐνδελεχισμοῦ διὰ παντὸς ἔναντι κυρίου εἰς γενεὰς αὐτῶν. καὶ οὐκ ἀνοίσεις ἐπ᾿ αὐτοῦ θυμίαμα ἕτερον, κάρπωμα, θυσίαν· καὶ σπονδὴν οὐ σπείσεις ἐπ᾿ αὐτοῦ.» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/30/#L1,6-9">Έξ 30:1,6-9</a>)</p></blockquote><h3>Το θυμίαμα συμβολίζει τις προσευχές</h3><blockquote><p>«κατευθυνθήτω <strong>ἡ προσευχή μου ὡς θυμίαμα ἐνώπιόν σου</strong>, ἔπαρσις τῶν χειρῶν μου θυσία ἑσπερινή.» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/140/#L2">Ψλ 140:2</a>)</p></blockquote><blockquote><p>«καὶ ὅτε ἔλαβεν τὸ βιβλίον, τὰ τέσσαρα ζῷα καὶ οἱ εἴκοσι τέσσαρες πρεσβύτεροι ἔπεσαν ἐνώπιον τοῦ ἀρνίου, ἔχοντες ἕκαστος κιθάραν καὶ <strong>φιάλας χρυσᾶς γεμούσας θυμιαμάτων, αἵ εἰσιν αἱ προσευχαὶ τῶν ἁγίων</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/5/#L8">Απ 5:8</a>)</p></blockquote><h3>Το θυμίαμα — χωριστή θυσία στον Θεό</h3><p>Το θυμίαμα αναφέρεται χωριστά, απαριθμείται μαζί με τις άλλες ιεροπραξίες (όχι ως προσθήκη σε κάτι, ούτε ως κάτι που πηγαίνει μόνο μαζί με κάτι άλλο):</p><blockquote><p>«καὶ <strong>ἐξελεξάμην τὸν οἶκον τοῦ πατρός σου</strong> ἐκ πάντων τῶν σκήπτρων Ισραηλ ἐμοὶ ἱερατεύειν καὶ <strong>ἀναβαίνειν ἐπὶ θυσιαστήριόν μου</strong> καὶ <strong>θυμιᾶν θυμίαμα</strong> καὶ αἴρειν εφουδ» (<a href="https://bibleox.com/el/gr-lxx-byz/1ts/2/#L28">Α Βασ 2:28</a>)</p></blockquote><blockquote><p>«καὶ <strong>οὐκ ἔστιν ἐν τῷ καιρῷ τούτῳ</strong> ἄρχων καὶ προφήτης οὐδὲ ἡγούμενος οὐδὲ ὁλοκαύτωσις οὐδὲ θυσία οὐδὲ προσφορὰ οὐδὲ <strong>θυμίαμα</strong> οὐδὲ τόπος τοῦ καρπῶσαι ἐνώπιόν σου καὶ εὑρεῖν ἔλεος·» (<a href="https://bibleox.com/el/gr-lxx-byz/dan/3/#L38">Δν 3:38</a>)</p></blockquote><blockquote><p>«διότι ἀπ᾿ ἀνατολῶν ἡλίου ἕως δυσμῶν τὸ ὄνομά μου δεδόξασται ἐν τοῖς ἔθνεσιν, καὶ <strong>ἐν παντὶ τόπῳ θυμίαμα προσάγεται τῷ ὀνόματί μου</strong> καὶ θυσία καθαρά, διότι μέγα τὸ ὄνομά μου ἐν τοῖς ἔθνεσιν, λέγει κύριος παντοκράτωρ.» (<a href="https://bibleox.com/el/gr-lxx-byz/mal/1/#L11">Μαλ 1:11</a>)</p></blockquote><blockquote><p>«καὶ ἐποίησαν σκεύη ἅγια καινὰ καὶ εἰσήνεγκαν τὴν λυχνίαν καὶ <strong>τὸ θυσιαστήριον τῶν θυμιαμάτων</strong> καὶ τὴν τράπεζαν εἰς τὸν ναόν. καὶ <strong>ἐθυμίασαν ἐπὶ τὸ θυσιαστήριον</strong> καὶ ἐξῆψαν τοὺς λύχνους τοὺς ἐπὶ τῆς λυχνίας, καὶ ἔφαινον ἐν τῷ ναῷ.» (<a href="https://bibleox.com/el/gr-lxx-byz/1mak/4/#L49-50">I Μακ 4:49-50</a>)</p></blockquote><blockquote><p>«καὶ ἰδοὺ ἐγὼ ὁ υἱὸς αὐτοῦ <strong>οἰκοδομῶ οἶκον τῷ ὀνόματι κυρίου θεοῦ μου</strong> ἁγιάσαι αὐτὸν αὐτῷ τοῦ <strong>θυμιᾶν ἀπέναντι αὐτοῦ θυμίαμα</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/2par/2/#L3">Β Παρ 2:3</a>)</p></blockquote><blockquote><p>«<strong>Μνημόσυνον Ιωσιου εἰς σύνθεσιν θυμιάματος</strong> ἐσκευασμένον ἔργῳ μυρεψοῦ· ἐν παντὶ στόματι ὡς μέλι γλυκανθήσεται καὶ ὡς μουσικὰ ἐν συμποσίῳ οἴνου.» (<a href="https://bibleox.com/el/gr-lxx-byz/prsir/49/#L1">Σ.Σειρ 49:1</a>)</p></blockquote><blockquote><p>«ὡς <strong>ἐδοξάσθη ἐν περιστροφῇ λαοῦ</strong>, ἐν ἐξόδῳ οἴκου καταπετάσματος· &lt;…&gt; <strong>ὡς πῦρ καὶ λίβανος ἐπὶ πυρείου</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/prsir/50/#L5,9">Σ.Σειρ 50:5,9</a>)</p></blockquote><blockquote><p>«κατευθυνθήτω ἡ προσευχή μου <strong>ὡς θυμίαμα ἐνώπιόν σου</strong>, ἔπαρσις τῶν χειρῶν μου θυσία ἑσπερινή.» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/140/#L2">Ψλ 140:2</a>)</p></blockquote><blockquote><p>«καὶ <strong>εἰσῆλθεν εἰς τὸν ναὸν κυρίου θυμιάσαι</strong> ἐπὶ τὸ θυσιαστήριον τῶν θυμιαμάτων.» (<a href="https://bibleox.com/el/gr-lxx-byz/2par/26/#L16">Β Παρ 26:16</a>)</p></blockquote><blockquote><p>«Τίς αὕτη ἡ ἀναβαίνουσα ἀπὸ τῆς ἐρήμου ὡς στελέχη καπνοῦ <strong>τεθυμιαμένη σμύρναν καὶ λίβανον</strong> ἀπὸ πάντων κονιορτῶν μυρεψοῦ;» (<a href="https://bibleox.com/el/gr-lxx-byz/pp/3/#L6">Ασμ 3:6</a>)</p></blockquote><blockquote><p>«οὐκ ἐμοὶ πρόβατα τῆς ὁλοκαρπώσεώς σου, οὐδὲ ἐν ταῖς θυσίαις σου ἐδόξασάς με, <strong>οὐδὲ ἔγκοπον ἐποίησά σε ἐν λιβάνῳ</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/is/43/#L23">Ησ 43:23</a>)</p></blockquote><blockquote><p>«Καὶ ἄλλος ἄγγελος ἦλθεν καὶ ἐστάθη ἐπὶ τοῦ θυσιαστηρίου ἔχων λιβανωτὸν χρυσοῦν, καὶ ἐδόθη αὐτῷ <strong>θυμιάματα πολλὰ</strong> ἵνα <strong>δώσει ταῖς προσευχαῖς τῶν ἁγίων πάντων ἐπὶ τὸ θυσιαστήριον τὸ χρυσοῦν</strong> τὸ ἐνώπιον τοῦ θρόνου.» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/8/#L3">Απ 8:3</a>)</p></blockquote><blockquote><p>«καὶ <strong>ἀνέβη ὁ καπνὸς τῶν θυμιαμάτων ταῖς προσευχαῖς τῶν ἁγίων</strong> ἐκ χειρὸς τοῦ ἀγγέλου ἐνώπιον τοῦ θεοῦ.» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/8/#L4">Απ 8:4</a>)</p></blockquote><h3>Προσβολή του Θεού με την προσφορά θυμιάματος σε ψεύτικους θεούς</h3><blockquote><p>«ἀνθ᾿ ὧν ἐγκατέλιπόν με καὶ ἀπηλλοτρίωσαν τὸν τόπον τοῦτον καὶ <strong>ἐθυμίασαν ἐν αὐτῷ θεοῖς ἀλλοτρίοις</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/ier/19/#L4">Ιερ 19:4</a>)</p></blockquote><blockquote><p>«ὁ λαὸς οὗτος ὁ παροξύνων με ἐναντίον ἐμοῦ διὰ παντός, αὐτοὶ θυσιάζουσιν ἐν τοῖς κήποις καὶ <strong>θυμιῶσιν ἐπὶ ταῖς πλίνθοις</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/is/65/#L3">Ησ 65:3</a>)</p></blockquote><blockquote><p>«τὰς ἁμαρτίας αὐτῶν καὶ τῶν πατέρων αὐτῶν, λέγει κύριος, οἳ <strong>ἐθυμίασαν ἐπὶ τῶν ὀρέων</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/is/65/#L7">Ησ 65:7</a>)</p></blockquote><blockquote><p>«καὶ λαλήσω πρὸς αὐτοὺς μετὰ κρίσεως περὶ πάσης τῆς κακίας αὐτῶν, ὡς ἐγκατέλιπόν με καὶ <strong>ἔθυσαν θεοῖς ἀλλοτρίοις</strong> καὶ προσεκύνησαν τοῖς ἔργοις τῶν χειρῶν αὐτῶν.» (<a href="https://bibleox.com/el/gr-lxx-byz/ier/1/#L16">Ιερ 1:16</a>)</p></blockquote><p>Θάνατος σε όποιον χρησιμοποιεί το ιερό άρωμα για θυμίαμα σε ψεύτικους θεούς:</p><blockquote><p>«θυμίαμα κατὰ τὴν σύνθεσιν ταύτην οὐ ποιήσετε ὑμῖν αὐτοῖς· ἁγίασμα ἔσται ὑμῖν κυρίῳ· <strong>ὃς ἂν ποιήσῃ ὡσαύτως ὥστε ὀσφραίνεσθαι ἐν αὐτῷ, ἀπολεῖται ἐκ τοῦ λαοῦ αὐτοῦ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/30/#L37-38">Έξ 30:37-38</a>)</p></blockquote>
