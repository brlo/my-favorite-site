  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: '<h2>Πρόσβαση στην ιερωσύνη</h2><h3>Ιερείς είναι μόνο οι απόγονοι του Ααρών</h3><p>Ιερείς μπορούσαν να είναι μόνο ο Ααρών (ο αδελφός του προφήτη Μωυσή) και οι απόγονοί του (<a href="https://bibleox.com/el/gr-lxx-byz/ish/28/#L1">Έξ 28:1</a>· <a href="https://bibleox.com/el/gr-lxx-byz/ish/28/#L4">Έξ 28:4</a>).</p><h3>Η μεταβίβαση του αξιώματος του αρχιερέα</h3><p>Ιερείς μπορούσαν να είναι μόνο ο Ααρών (ο αδελφός του προφήτη Μωυσή) και οι απόγονοί του (<a href="https://bibleox.com/el/gr-lxx-byz/ish/28/#L1">Έξ 28:1</a>· <a href="https://bibleox.com/el/gr-lxx-byz/ish/28/#L4">Έξ 28:4</a>· <a href="https://bibleox.com/el/gr-lxx-byz/ish/29/#L9">Έξ 29:9</a>). Τον διάδοχο του αρχιερέα τον έντυναν με τα άμφια και τον έχρισαν με έλαιο επί επτά ημέρες (<a href="https://bibleox.com/el/gr-lxx-byz/ish/29/#L29-30">Έξ 29:29-30</a>). Μαζί με το αξίωμα μεταβιβάζονταν και τα ιερά άμφια (<a href="https://bibleox.com/el/gr-lxx-byz/ish/29/#L29">Έξ 29:29</a>). Αν κάποιος ξένος πλησίαζε στις ιεροπραξίες, τιμωρούνταν με θάνατο (<a href="https://bibleox.com/el/gr-lxx-byz/chis/3/#L10">Αρ 3:10</a>).</p><h3>Οι απαιτήσεις για τον υποψήφιο</h3><p>Δεν πρέπει να έχει σωματικά ελαττώματα (<a href="https://bibleox.com/el/gr-lxx-byz/lev/21/#L17-21">Λευ 21:17-21</a>):</p><ul><li><p>τύφλωση,</p></li><li><p>χωλότητα,</p></li><li><p>δυσμορφία,</p></li><li><p>σπασμένα ή παράλυτα άκρα,</p></li><li><p>κύρτωση,</p></li><li><p>δεν πρέπει να έχει λεύκωμα στο μάτι,</p></li><li><p>να μην έχει ψώρα, να μην έχει λειχήνα, να μην έχουν βλάβη οι όρχεις.</p></li></ul><h3>Οι απαιτήσεις για τον ιερέα</h3><ul><li><p>δεν πρέπει να κόβει τα μαλλιά και τα γένια του (<a href="https://bibleox.com/el/gr-lxx-byz/lev/21/#L1,5">Λευ 21:1,5</a>)·</p></li><li><p>δεν πρέπει να παίρνει για γυναίκα του διαζευγμένη (<a href="https://bibleox.com/el/gr-lxx-byz/lev/21/#L7">Λευ 21:7</a>), πόρνη, ατιμασμένη, εκβεβλημένη από τον άνδρα της (<a href="https://bibleox.com/el/gr-lxx-byz/lev/21/#L7">Λευ 21:7</a>), ενώ σύζυγος του αρχιερέα μπορεί να είναι μόνο παρθένα (<a href="https://bibleox.com/el/gr-lxx-byz/lev/21/#L13-14">Λευ 21:13-14</a>)·</p></li><li><p>δεν πρέπει να αγγίζει νεκρούς (<a href="https://bibleox.com/el/gr-lxx-byz/lev/21/#L1-4">Λευ 21:1-4</a>), και ο αρχιερέας δεν μπορεί να αγγίξει ούτε τους νεκρούς συγγενείς του (<a href="https://bibleox.com/el/gr-lxx-byz/lev/21/#L10-11">Λευ 21:10-11</a>)·</p></li><li><p>ο αρχιερέας πρέπει να περπατά με σκεπασμένο το κεφάλι (<a href="https://bibleox.com/el/gr-lxx-byz/lev/21/#L10">Λευ 21:10</a>).</p></li></ul><h2>Η τελετή</h2><h3>Εν συντομία</h3><p>Τελείται με προσφορά θυσιών, πλύσεις, χρίση με έλαιο (<a href="https://bibleox.com/el/gr-lxx-byz/ish/28/#L41">Έξ 28:41</a>), ραντισμό με αίμα ζώων, τράπεζα. Για τη χειροτονία χρειάζονται τα ιερά άμφια (<a href="https://bibleox.com/el/gr-lxx-byz/ish/28/#L2-3">Έξ 28:2-3</a>), τα οποία μεταβιβάζονται μαζί με το αξίωμα (<a href="https://bibleox.com/el/gr-lxx-byz/ish/29/#L29">Έξ 29:29</a>).</p><h3>Η χειροτονία σε αρχιερέα της Παλαιάς Διαθήκης</h3><h4>Οι θυσίες</h4><p>Για τη χειροτονία πρέπει να προσφερθούν σε θυσία ζώα χωρίς ψεγάδι (<a href="https://bibleox.com/el/gr-lxx-byz/ish/29/#L1">Έξ 29:1</a>) και άζυμο ψωμί από σιτάλευρο (<a href="https://bibleox.com/el/gr-lxx-byz/ish/29/#L2">Έξ 29:2</a>):</p><ul><li><p><strong>ένα μοσχάρι</strong> (βόδι)·</p></li><li><p><strong>δύο κριάρια</strong>·</p></li><li><p><strong>άζυμα ψωμιά</strong>, αλειμμένα με έλαιο·</p></li><li><p><strong>άζυμα</strong> από σιτάλευρο.</p></li></ul><p>Ο αρχιερέας και οι ιερείς βάζουν τα χέρια πάνω στο μοσχάρι και έπειτα το σφάζουν στην είσοδο της Σκηνής του Μαρτυρίου (<a href="https://bibleox.com/el/gr-lxx-byz/ish/29/#L10-11">Έξ 29:10-11</a>) (προτύπωση της θανάτωσης του Χριστού).</p><p>Με το αίμα του μοσχαριού αλείφουν τα κέρατα του θυσιαστηρίου και το υπόλοιπο το χύνουν στη βάση του θυσιαστηρίου (<a href="https://bibleox.com/el/gr-lxx-byz/ish/29/#L12">Έξ 29:12</a>) (προτύπωση των παθών του Χριστού στον σταυρό-θυσιαστήριο). Τα εντόσθια του μοσχαριού (συκώτι, νεφρά κ.λπ.) καίγονται πάνω στο θυσιαστήριο (<a href="https://bibleox.com/el/gr-lxx-byz/ish/29/#L13">Έξ 29:13</a>). Το κρέας του μοσχαριού, το δέρμα κ.λπ. καίγονται στη φωτιά έξω από το στρατόπεδο — είναι θυσία για την αμαρτία (<a href="https://bibleox.com/el/gr-lxx-byz/ish/29/#L14">Έξ 29:14</a>).</p><p>Παρομοίως, ο αρχιερέας και οι ιερείς βάζουν τα χέρια πάνω στο κεφάλι ενός κριαριού και το σφάζουν (<a href="https://bibleox.com/el/gr-lxx-byz/ish/29/#L16">Έξ 29:16</a>), και με το αίμα του κριαριού ραντίζεται το θυσιαστήριο ολόγυρα (<a href="https://bibleox.com/el/gr-lxx-byz/ish/29/#L15">Έξ 29:15</a>). Το κριάρι το τεμάχιζαν, έπλεναν τα εντόσθια και τα έκαιγαν πάνω στο θυσιαστήριο — είναι θυσία στον Κύριο (<a href="https://bibleox.com/el/gr-lxx-byz/ish/29/#L17-18">Έξ 29:17-18</a>).</p><p>Επίσης και πάνω στο τελευταίο κριάρι ο αρχιερέας μαζί με τους ιερείς έβαζαν τα χέρια στο κεφάλι (<a href="https://bibleox.com/el/gr-lxx-byz/ish/29/#L19">Έξ 29:19</a>), το έσφαζαν (<a href="https://bibleox.com/el/gr-lxx-byz/ish/29/#L20">Έξ 29:20</a>), και με το αίμα του άλειφαν το άκρο του δεξιού αυτιού του Ααρών και των γιων του, το μεγάλο δάχτυλο του δεξιού χεριού και ποδιού (<a href="https://bibleox.com/el/gr-lxx-byz/ish/29/#L20">Έξ 29:20</a>), και έπειτα ράντιζαν με αίμα το θυσιαστήριο ολόγυρα (<a href="https://bibleox.com/el/gr-lxx-byz/ish/29/#L21">Έξ 29:21</a>).</p><p>Με το αίμα από το θυσιαστήριο και με το έλαιο της χρίσεως ράντιζαν τον Ααρών με τους γιους του και τα ιερατικά τους άμφια (<a href="https://bibleox.com/el/gr-lxx-byz/ish/29/#L21">Έξ 29:21</a>). Τώρα είναι αγιασμένοι.</p><p>Έπειτα παίρνουν τα εντόσθια του κριαριού (<a href="https://bibleox.com/el/gr-lxx-byz/ish/29/#L22">Έξ 29:22</a>), 1 στρογγυλό ψωμί, 1 πλακούντα και 1 άζυμο από το καλάθι (<a href="https://bibleox.com/el/gr-lxx-byz/ish/29/#L23">Έξ 29:23</a>), τα δίνουν στα χέρια του Ααρών και των γιων του (<a href="https://bibleox.com/el/gr-lxx-byz/ish/29/#L24">Έξ 29:24</a>), έπειτα τα παίρνουν πάλι από αυτούς και τα καίγουν πάνω στο θυσιαστήριο (<a href="https://bibleox.com/el/gr-lxx-byz/ish/29/#L25">Έξ 29:25</a>). Επίσης προσφέρεται σε θυσία το στήθος από το κριάρι (<a href="https://bibleox.com/el/gr-lxx-byz/ish/29/#L26-28">Έξ 29:26-28</a>).</p><h4>Η πλύση</h4><p>Πριν από τη χειροτονία τελείται πλύση με νερό (<a href="https://bibleox.com/el/gr-lxx-byz/ish/29/#L4">Έξ 29:4</a>).</p><h4>Η ένδυση με τα ιερατικά άμφια</h4><p>Μετά την πλύση, τον άνθρωπο τον ντύνουν με τα ιερά άμφια (<a href="https://bibleox.com/el/gr-lxx-byz/ish/29/#L5-6">Έξ 29:5-6</a>). Και τους ιερείς τους ντύνουν με άμφια (<a href="https://bibleox.com/el/gr-lxx-byz/ish/29/#L8-9">Έξ 29:8-9</a>).</p><h4>Η επίχυση ελαίου στο κεφάλι</h4><p>Μετά την ένδυση, τον άνθρωπο τον χρίουν με έλαιο (λάδι, <a href="https://bibleox.com/el/gr-lxx-byz/ish/28/#L41">Έξ 28:41</a>), χύνοντάς το στο κεφάλι (<a href="https://bibleox.com/el/gr-lxx-byz/ish/29/#L7">Έξ 29:7</a>).</p><h4>Η τράπεζα</h4><p>Το κρέας του κριαριού βραζόταν σε αγιασμένο τόπο (<a href="https://bibleox.com/el/gr-lxx-byz/ish/29/#L31">Έξ 29:31</a>), έπειτα έπρεπε να το φάνε ο αρχιερέας με τους ιερείς στις θύρες της Σκηνής του Μαρτυρίου (<a href="https://bibleox.com/el/gr-lxx-byz/ish/29/#L32">Έξ 29:32</a>). Δεν επιτρεπόταν στους ξένους να μετάσχουν σε αυτή την τράπεζα (<a href="https://bibleox.com/el/gr-lxx-byz/ish/29/#L33">Έξ 29:33</a>). Αν το κρέας έμενε μέχρι το πρωί, έπρεπε να καεί (<a href="https://bibleox.com/el/gr-lxx-byz/ish/29/#L34">Έξ 29:34</a>).</p><h4>Η επανάληψη επί 7 ημέρες</h4><p>Όλη αυτή η τελετή της προσφοράς θυσιών και του αγιασμού επαναλαμβανόταν επί 7 ημέρες (<a href="https://bibleox.com/el/gr-lxx-byz/ish/29/#L35">Έξ 29:35</a>· <a href="https://bibleox.com/el/gr-lxx-byz/lev/8/#L33-34">Λευ 8:33-34</a>). Ως αποτέλεσμα, το θυσιαστήριο θα γίνει μεγάλο αγίασμα: καθετί που το αγγίζει θα αγιαστεί (<a href="https://bibleox.com/el/gr-lxx-byz/ish/29/#L37">Έξ 29:37</a>) (προτύπωση του σταυρού του Χριστού, που έγινε αγίασμα).</p><h2>Τα άμφια</h2><h3>Ο σκοπός</h3><p>Για τιμή, δόξα και αγιασμό (<a href="https://bibleox.com/el/gr-lxx-byz/ish/28/#L2-3">Έξ 28:2-3</a>), για τη μεταβίβαση του αρχιερατικού αξιώματος (<a href="https://bibleox.com/el/gr-lxx-byz/ish/29/#L29">Έξ 29:29</a>).</p><h3>Το σύνολο</h3><p>Στο σύνολο των αμφίων του αρχιερέα περιλαμβάνονται (<a href="https://bibleox.com/el/gr-lxx-byz/ish/28/#L4">Έξ 28:4</a>):</p><ul><li><p><strong>λογείο</strong>,</p></li><li><p><strong>εφώδ</strong> (εξωτερικό ένδυμα),</p></li><li><p><strong>υποδύτης</strong> (ο εξωτερικός ποδήρης),</p></li><li><p><strong>χιτώνας</strong> σφιχτός (εσωτερικό ένδυμα),</p></li><li><p><strong>κίδαρις</strong> (κάλυμμα κεφαλής),</p></li><li><p><strong>ζώνη</strong>.</p></li></ul><h3>Εφώδ ή επωμίς (εξωτερικό αμάνικο ένδυμα)</h3><p>Είναι κατασκευασμένο από χρυσό, νήματα διαφόρων χρωμάτων (γαλάζια, πορφυρά, κόκκινα, δηλαδή ερυθρά) και κλωστή βύσσου (λεπτό λινό ύφασμα) (<a href="https://bibleox.com/el/gr-lxx-byz/ish/28/#L5-6">Έξ 28:5-6</a>).</p><h4>Οι επωμίδες (τα ωμικά)</h4><p>Το εφώδ δεν είναι μονοκόμματο, αλλά αποτελείται από πίσω και μπροστινό μέρος, γι’ αυτό στους ώμους στερεώνεται με «επωμίδες» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/28/#L7">Έξ 28:7</a>).</p><p>Για τις δύο επωμίδες κατασκευάστηκαν δύο στολίδια (<a href="https://bibleox.com/el/gr-lxx-byz/ish/28/#L12">Έξ 28:12</a>): δύο πολύτιμοι λίθοι σμαράγδου σε χρυσές υποδοχές (<a href="https://bibleox.com/el/gr-lxx-byz/ish/28/#L10">Έξ 28:10</a>). Πάνω σε αυτούς τους λίθους είναι χαραγμένα 12 ονόματα των φυλών του Ισραήλ (<a href="https://bibleox.com/el/gr-lxx-byz/ish/28/#L9">Έξ 28:9</a>): 6 ονόματα στον ένα λίθο και 6 ονόματα στον άλλο, κατά τη σειρά της γέννησης (<a href="https://bibleox.com/el/gr-lxx-byz/ish/28/#L10">Έξ 28:10</a>). Οι λίθοι είναι τοποθετημένοι σε χρυσές υποδοχές και στολισμένοι με χρυσή αλυσίδα (<a href="https://bibleox.com/el/gr-lxx-byz/ish/28/#L13-14">Έξ 28:13-14</a>).</p><p>Κάπου στις άκρες, πιθανώς κοντά στη ζώνη, το εφώδ είχε δύο κρίκους, για τη στερέωση του λογείου πάνω του (<a href="https://bibleox.com/el/gr-lxx-byz/ish/28/#L29">Έξ 28:29</a>).</p><h3>Η ζώνη</h3><p>Η ζώνη φοριέται πάνω από το εφώδ και είναι κατασκευασμένη από τα ίδια υλικά: νήματα (γαλάζια, πορφυρά, κόκκινα) και κλωστή βύσσου (<a href="https://bibleox.com/el/gr-lxx-byz/ish/28/#L8">Έξ 28:8</a>). Η ζώνη ήταν διακοσμημένη με σχέδια (<a href="https://bibleox.com/el/gr-lxx-byz/ish/28/#L39">Έξ 28:39</a>).</p><h3>Το λογείο (το περιστήθιο)</h3><p>Τετράγωνο κομμάτι υφάσματος, διπλωμένο στα δύο (<a href="https://bibleox.com/el/gr-lxx-byz/ish/28/#L16">Έξ 28:16</a>). Διαστάσεις: 23 × 23 εκ. (μία σπιθαμή μήκος και πλάτος) (<a href="https://bibleox.com/el/gr-lxx-byz/ish/28/#L16">Έξ 28:16</a>). Η σπιθαμή είναι η απόσταση ανάμεσα στον αντίχειρα και στον δείκτη, περίπου 23 εκ. Είναι κατασκευασμένο από τα ίδια υλικά με το εφώδ (χρυσό, νήματα και βύσσο) (<a href="https://bibleox.com/el/gr-lxx-byz/ish/28/#L15">Έξ 28:15</a>).</p><p>Πάνω σε αυτό το κομμάτι υφάσματος είναι στερεωμένοι 12 πολύτιμοι λίθοι. Αναφέρονται ανά 3 σε σειρά (συνολικά 4 σειρές, <a href="https://bibleox.com/el/gr-lxx-byz/ish/28/#L17">Έξ 28:17</a>):</p><ul><li><p>σάρδιο, τοπάζι, σμαράγδι (<a href="https://bibleox.com/el/gr-lxx-byz/ish/28/#L17">Έξ 28:17</a>)·</p></li><li><p>άνθραξ, ζαφείρι, ίασπις (<a href="https://bibleox.com/el/gr-lxx-byz/ish/28/#L18">Έξ 28:18</a>)·</p></li><li><p>λιγύριο, αχάτης, αμέθυστος (<a href="https://bibleox.com/el/gr-lxx-byz/ish/28/#L19">Έξ 28:19</a>)·</p></li><li><p>χρυσόλιθος, βηρύλλιο, ονύχιο (<a href="https://bibleox.com/el/gr-lxx-byz/ish/28/#L19">Έξ 28:19</a>).</p></li></ul><p>Πάνω στους λίθους είναι χαραγμένα τα ονόματα των 12 φυλών του Ισραήλ, ένα όνομα σε κάθε λίθο (<a href="https://bibleox.com/el/gr-lxx-byz/ish/28/#L21">Έξ 28:21</a>).</p><p>Το λογείο στερεωνόταν στις επωμίδες (<a href="https://bibleox.com/el/gr-lxx-byz/ish/28/#L29">Έξ 28:29</a>). Για τον σκοπό αυτό, στις δύο πάνω γωνίες το λογείο είχε χρυσούς κρίκους, μέσα στους οποίους περνούσε αλυσίδα από καθαρό χρυσό (<a href="https://bibleox.com/el/gr-lxx-byz/ish/28/#L22">Έξ 28:22</a>), και με το άλλο άκρο η αλυσίδα στερεωνόταν στις επωμίδες από τη μπροστινή πλευρά (<a href="https://bibleox.com/el/gr-lxx-byz/ish/28/#L22">Έξ 28:22</a>).</p><p>Στις δύο κάτω γωνίες το λογείο είχε 4 χρυσούς κρίκους: δύο στην εσωτερική πλευρά (προς το εφώδ) και δύο στην εξωτερική πλευρά. Από αυτούς τους κρίκους το λογείο στερεωνόταν με κορδόνι από γαλάζιο νήμα στους κρίκους του εφώδ, ώστε να μη γλιστρά από το εφώδ, μένοντας πάνω από τη ζώνη (<a href="https://bibleox.com/el/gr-lxx-byz/ish/28/#L29">Έξ 28:29</a>). (Στο ελληνικό κείμενο που παραθέτουμε οι στίχοι 23–28 είναι κενοί· η αντιστοίχιση δίνεται με τον στίχο 29, που σώζει τις αλυσίδες και τις δύο ασπίδες της επωμίδος.)</p><p>Το λογείο φοριέται κάθε φορά που έπρεπε να μπει κανείς στο αγιαστήριο (τον ναό) (<a href="https://bibleox.com/el/gr-lxx-byz/ish/28/#L29">Έξ 28:29</a>).</p><h4>Ουρίμ και Θουμμίμ</h4><p>Στο εσωτερικό του λογείου (επειδή ήταν από ύφασμα διπλωμένο στα δύο), όπως και στην <a href="https://bibleox.com/el/el/w/Η_Κιβωτός_της_Διαθήκης">Κιβωτό της Διαθήκης</a>, τοποθετούνταν (<a href="https://bibleox.com/el/gr-lxx-byz/lev/8/#L8">Λευ 8:8</a>) μυστηριώδη αντικείμενα: <strong>Ουρίμ και Θουμμίμ</strong>, στη σλαβονική μετάφραση: <strong>Φανέρωση και Αλήθεια</strong> (<a href="https://bibleox.com/el/gr-lxx-byz/ish/28/#L30">Έξ 28:30</a>). Ο αρχιερέας πρέπει να τα έχει στην καρδιά του (<a href="https://bibleox.com/el/gr-lxx-byz/ish/28/#L30">Έξ 28:30</a>).</p><h3>Ο υποδύτης (ο εξωτερικός ποδήρης)</h3><p>Είναι κατασκευασμένος από γαλάζιο ύφασμα (<a href="https://bibleox.com/el/gr-lxx-byz/ish/28/#L31">Έξ 28:31</a>). Ο ποδήρης πρέπει να έχει άνοιγμα για το κεφάλι (<a href="https://bibleox.com/el/gr-lxx-byz/ish/28/#L32">Έξ 28:32</a>). Το άνοιγμα είναι διακοσμημένο με υφαντό κέντημα, για να μη σχίζεται (<a href="https://bibleox.com/el/gr-lxx-byz/ish/28/#L32">Έξ 28:32</a>).</p><p>Κάτω στο στρίφωμα ο ποδήρης είναι κεντημένος με παραστάσεις ροδιών (<a href="https://bibleox.com/el/gr-lxx-byz/ish/28/#L33">Έξ 28:33</a>), με κλωστές υακίνθινες, πορφυρές, κόκκινες. Ανάμεσα στα ρόδια είναι στερεωμένα χρυσά κουδουνάκια (<a href="https://bibleox.com/el/gr-lxx-byz/ish/28/#L33">Έξ 28:33</a>): ρόδι, κουδουνάκι, ρόδι, κουδουνάκι — σε όλο τον κύκλο (<a href="https://bibleox.com/el/gr-lxx-byz/ish/28/#L34">Έξ 28:34</a>).</p><h3>Η κίδαρις (κάλυμμα κεφαλής)</h3><p>Το κάλυμμα κεφαλής είναι κατασκευασμένο από βύσσο (<a href="https://bibleox.com/el/gr-lxx-byz/ish/28/#L39">Έξ 28:39</a>).</p><h4>Το χρυσό πέταλο</h4><p>Στην κίδαρι στερεωνόταν πέταλο από καθαρό χρυσό με χαραγμένη επιγραφή «Αγίασμα Κυρίου» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/28/#L36">Έξ 28:36</a>). Το πέταλο στερεώνεται στη μπροστινή πλευρά της κίδαρι με κορδόνι γαλάζιου χρώματος (<a href="https://bibleox.com/el/gr-lxx-byz/ish/28/#L37">Έξ 28:37</a>) και βρίσκεται στο ύψος του μετώπου (<a href="https://bibleox.com/el/gr-lxx-byz/ish/28/#L38">Έξ 28:38</a>).</p><h3>Ο χιτώνας</h3><p>Ο χιτώνας είναι κατασκευασμένος από βύσσο (<a href="https://bibleox.com/el/gr-lxx-byz/ish/28/#L39">Έξ 28:39</a>). Τα λινά περισκελή (<a href="https://bibleox.com/el/gr-lxx-byz/ish/28/#L42">Έξ 28:42</a>) κάλυπταν από τη μέση έως τους μηρούς.</p><h2>Ο απλός ιερέας</h2><p>Τα άμφια των απλών ιερέων δεν έχουν λεπτομερή περιγραφή. Τα άμφια κατασκευάζονται γι’ αυτούς για τιμή και δόξα (<a href="https://bibleox.com/el/gr-lxx-byz/ish/28/#L40">Έξ 28:40</a>).</p><p>Ο ιερέας πρέπει να έχει χιτώνα (<a href="https://bibleox.com/el/gr-lxx-byz/ish/28/#L40">Έξ 28:40</a>), κεντημένη ζώνη (<a href="https://bibleox.com/el/gr-lxx-byz/ish/28/#L39">Έξ 28:39</a>-<a href="https://bibleox.com/el/gr-lxx-byz/ish/28/#L40">40</a>), κάλυμμα κεφαλής (<a href="https://bibleox.com/el/gr-lxx-byz/ish/28/#L40">Έξ 28:40</a>).</p><p>Αυτά τα άμφια πρέπει να φοριούνται για την παραμονή στη Σκηνή του Μαρτυρίου και για την τέλεση της λατρείας στο αγιαστήριο (τον ναό) (<a href="https://bibleox.com/el/gr-lxx-byz/ish/28/#L43">Έξ 28:43</a>).</p><h2>Οι καθημερινές θυσίες</h2><p>Κάθε ημέρα μπροστά στις θύρες της Σκηνής του Μαρτυρίου (<a href="https://bibleox.com/el/gr-lxx-byz/ish/29/#L42">Έξ 29:42</a>) πρέπει να προσφέρονται <strong>δύο αρνιά ενός έτους</strong> (<a href="https://bibleox.com/el/gr-lxx-byz/ish/29/#L38">Έξ 29:38</a>): ένα το πρωί και ένα το βράδυ (<a href="https://bibleox.com/el/gr-lxx-byz/ish/29/#L39">Έξ 29:39</a>).</p><p>Μαζί με τα αρνιά προσφέρονται σε θυσία <strong>αλεύρι</strong>, <strong>έλαιο</strong> και <strong>κρασί</strong> (<a href="https://bibleox.com/el/gr-lxx-byz/ish/29/#L40">Έξ 29:40</a>).</p><p>Ο τόπος της προσφοράς των θυσιών θα αγιαστεί με τη δόξα του Θεού (<a href="https://bibleox.com/el/gr-lxx-byz/ish/29/#L43">Έξ 29:43</a>).</p>'
