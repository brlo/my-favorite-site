  update: true
  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <h2>Η Κιβωτός της Διαθήκης (του Μαρτυρίου)</h2><p>Στο κέντρο των <a href="https://bibleox.com/el/el/w/Ο_ναός_της_Ιερουσαλήμ#HH-Τα-Άγια-των-Αγίων">Αγίων των Αγίων</a> του <a href="https://bibleox.com/el/el/w/Ο_ναός_της_Ιερουσαλήμ">Ναού της Ιερουσαλήμ</a>, κάτω από τα φτερά των χερουβίμ, βρισκόταν η Κιβωτός της Διαθήκης (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/6/#L19">Γ Βασ 6:19</a>· <a href="https://bibleox.com/el/gr-lxx-byz/3ts/8/#L6">Γ Βασ 8:6</a>· <a href="https://bibleox.com/el/gr-lxx-byz/2par/5/#L7">Β Παρ 5:7</a>), με τους αναφορείς της για τη μεταφορά (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/8/#L7">Γ Βασ 8:7</a>· <a href="https://bibleox.com/el/gr-lxx-byz/2par/5/#L9">Β Παρ 5:9</a>· <a href="https://bibleox.com/el/gr-lxx-byz/ish/25/#L15">Έξ 25:15</a>).</p><h3>Το σώμα</h3><p>Έχει διαστάσεις 2,5 × 1,5 πήχεις, ύψος 1,5 πήχη (<a href="https://bibleox.com/el/gr-lxx-byz/ish/25/#L10">Έξ 25:10</a>). Είναι κατασκευασμένη από ξύλο άσηπτο (<a href="https://bibleox.com/el/gr-lxx-byz/ish/25/#L10">Έξ 25:10</a>). Εσωτερικά και εξωτερικά είναι επενδεδυμένη με χρυσό και στο επάνω μέρος έχει χρυσό στεφάνι (<a href="https://bibleox.com/el/gr-lxx-byz/ish/25/#L11">Έξ 25:11</a>).</p><h3>Οι κρίκοι</h3><p>Σε κάθε μία από τις κάτω γωνίες της κιβωτού είναι στερεωμένος ένας χρυσός κρίκος για τη μεταφορά της (<a href="https://bibleox.com/el/gr-lxx-byz/ish/25/#L14">Έξ 25:14</a>), συνολικά 4 κρίκοι (<a href="https://bibleox.com/el/gr-lxx-byz/ish/25/#L12">Έξ 25:12</a>).</p><h3>Οι αναφορείς</h3><p>Στους κρίκους τοποθετούνται δύο αναφορείς από ξύλο άσηπτο (<a href="https://bibleox.com/el/gr-lxx-byz/ish/25/#L13">Έξ 25:13</a>). Οι αναφορείς είναι επενδεδυμένοι με χρυσό (<a href="https://bibleox.com/el/gr-lxx-byz/ish/25/#L13">Έξ 25:13</a>). Οι αναφορείς δεν πρέπει ποτέ να αφαιρούνται από την κιβωτό (<a href="https://bibleox.com/el/gr-lxx-byz/ish/25/#L15">Έξ 25:15</a>).</p><h3>Το ιλαστήριον (κάλυμμα)</h3><p>Έχει διαστάσεις 2,5 × 1,5 πήχεις (όπως η κιβωτός) και είναι κατασκευασμένο από καθαρό χρυσό (<a href="https://bibleox.com/el/gr-lxx-byz/ish/25/#L17">Έξ 25:17</a>).</p><h3>Τα χερουβίμ</h3><p>Πάνω στο κάλυμμα της κιβωτού είναι κατασκευασμένα δύο αγάλματα χερουβίμ από χρυσό (<a href="https://bibleox.com/el/gr-lxx-byz/ish/25/#L18">Έξ 25:18</a>). Το ένα χερούβ βρίσκεται στο ένα άκρο του καλύμματος και το άλλο στο άλλο (<a href="https://bibleox.com/el/gr-lxx-byz/ish/25/#L19">Έξ 25:19</a>), με τα πρόσωπα στραμμένα το ένα προς το άλλο, προς το κάλυμμα (<a href="https://bibleox.com/el/gr-lxx-byz/ish/25/#L20">Έξ 25:20</a>). Τα φτερά τους είναι υψωμένα και σκεπάζουν το κάλυμμα (<a href="https://bibleox.com/el/gr-lxx-byz/ish/25/#L20">Έξ 25:20</a>).</p><h3>Το περιεχόμενο</h3><p>Μέσα στην Κιβωτό βρίσκονταν οι δύο λίθινες πλάκες της Διαθήκης, τις οποίες τοποθέτησε εκεί ο προφήτης Μωυσής (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/8/#L9">Γ Βασ 8:9</a>· <a href="https://bibleox.com/el/gr-lxx-byz/2par/5/#L10">Β Παρ 5:10</a>), το μάννα (<a href="https://bibleox.com/el/gr-lxx-byz/ish/16/#L32-34">Έξ 16:32-34</a>) και η ανθισμένη ράβδος του Ααρών από αμυγδαλιά (<a href="https://bibleox.com/el/gr-lxx-byz/chis/17/#L8-11">Αρ 17:8-11</a>).</p><h2>Ο Θεός μιλάει πάνω από την κιβωτό</h2><p>Ο Θεός φανερώνεται καθαρά και μιλάει πάνω από το κάλυμμα της κιβωτού, ανάμεσα στα δύο χερουβίμ (<a href="https://bibleox.com/el/gr-lxx-byz/ish/25/#L22">Έξ 25:22</a>).</p>
