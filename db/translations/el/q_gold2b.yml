  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: '<h2>Πρόλογος</h2><p>Η αίτηση κάποιας ευσπλαχνίας για τον κεκοιμημένο είναι κίνηση καρδιάς που αγαπά, δηλαδή ανθρώπου οδηγούμενου από την αγάπη προς τον Θεό και τον πλησίον. Δεν γνωρίζουμε πώς θα κρίνει ο Κύριος να ενεργήσει σε σχέση με κάθε αίτηση για τον κεκοιμημένο, όμως έχουμε λόγο για ελπίδα και αγάπη που μας ωθεί στη φροντίδα. Ποιος είναι αυτός ο λόγος; Ο λόγος είναι η θεία αποκάλυψη, από την οποία μαθαίνουμε ότι ο Θεός είναι παντοδύναμος, ότι κατέχει τα «κλειδιά» του άδη και του θανάτου, ότι υπάρχουν αμαρτίες που δεν θα συγχωρηθούν ούτε στον μέλλοντα αιώνα (που επιτρέπει να κατανοήσουμε ότι υπάρχουν και άλλες αμαρτίες), ότι ο Θεός μας κάλεσε να απευθυνόμαστε σε Αυτόν με κάθε λογής αιτήματα. Γνωρίζουμε επίσης ότι δεν είναι <a href="https://bibleox.com/el/el/w/Η_άνιση_ανταπόδοση">ίση η μέτρηση</a> της τιμωρίας των αμαρτωλών, και δεν είναι ίδιος ο βαθμός μακαριότητας των δικαίων, γι'' αυτό ακόμη κι αν ο άνθρωπος δεν σωθεί, ελπίζουμε σε ανακούφιση της μοίρας του. Για τους κεκοιμημένους φρόντιζαν στην Παλαιά Διαθήκη (βλ. παρακάτω), φρόντιζαν και οι αρχαιότεροι χριστιανοί (βλ. περισσότερα).</p><p>Σε όλα αυτά ωθεί η αγάπη, που «ουδέποτε πίπτει» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/13/#L8">Α Κορ 13:8</a>).</p><h2>Ο Θεός είναι παντοδύναμος</h2><p>Άλλες ρήσεις: <a href="https://bibleox.com/el/el/w/Ο_Θεός_είναι_παντοδύναμος">Ο Θεός είναι παντοδύναμος</a></p><blockquote><p><em>«Ἐγὼ κύριος ὁ θεὸς πάσης σαρκός· </em><strong><em>μὴ ἀπ᾿ ἐμοῦ κρυβήσεταί τι</em></strong><em>;» (</em><a href="https://bibleox.com/el/gr-lxx-byz/ier/39/#L27"><em>Ιερ 39:27</em></a><em>)</em></p></blockquote><h2>Ο Θεός υποσχέθηκε ότι όσοι τηρούν τις εντολές θα λάβουν με την προσευχή ό,τι ζητήσουν με πίστη</h2><p>Αυτά τα λόγια ειπώθηκαν στο πλαίσιο της προσευχής για τη σωτηρία των αμαρτησάντων αδελφών, τους οποίους ο Θεός σώζει με την προσευχή των δικαίων:</p><blockquote><p>«καὶ <strong>ὃ ἐὰν αἰτῶμεν λαμβάνομεν ἀπ᾿ αὐτοῦ</strong>, ὅτι τὰς ἐντολὰς αὐτοῦ τηροῦμεν καὶ τὰ ἀρεστὰ ἐνώπιον αὐτοῦ ποιοῦμεν.» (<a href="https://bibleox.com/el/gr-lxx-byz/1in/3/#L22">Α Ιω 3:22</a>)</p></blockquote><h2>Οι αμαρτίες μπορούν να συγχωρούνται με την προσευχή της Εκκλησίας</h2><p>Αυτό σημαίνει ότι οι αμαρτίες συγχωρούνται όχι μόνο όταν ο ίδιος ο άνθρωπος μετανοεί και ζητά συγχώρηση, αλλά και όταν άλλοι ζητούν τη συγχώρηση των αμαρτιών του:</p><blockquote><p>«καὶ ἐὰν οἴδαμεν ὅτι <strong>ἀκούει ἡμῶν ὃ ἐὰν αἰτώμεθα</strong>, οἴδαμεν ὅτι ἔχομεν τὰ αἰτήματα ἃ ᾐτήκαμεν ἀπ᾿ αὐτοῦ.» (<a href="https://bibleox.com/el/gr-lxx-byz/1in/5/#L15">Α Ιω 5:15</a>)</p></blockquote><blockquote><p>«καὶ <strong>πάντα ὅσα ἂν αἰτήσητε ἐν τῇ προσευχῇ πιστεύοντες λήμψεσθε</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/21/#L22">Μτ 21:22</a>)</p></blockquote><blockquote><p>«Πάλιν λέγω ὑμῖν ὅτι ἐὰν δύο συμφωνήσωσιν ἐξ ὑμῶν ἐπὶ τῆς γῆς περὶ παντὸς πράγματος <strong>οὗ ἐὰν αἰτήσωνται, γενήσεται αὐτοῖς παρὰ τοῦ πατρός μου τοῦ ἐν οὐρανοῖς</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/18/#L19">Μτ 18:19</a>)</p></blockquote><blockquote><p>«οὐχ ὑμεῖς με ἐξελέξασθε, ἀλλ᾿ ἐγὼ ἐξελεξάμην ὑμᾶς καὶ ἔθηκα ὑμᾶς ἵνα ὑμεῖς ὑπάγητε καὶ καρπὸν φέρητε καὶ ὁ καρπὸς ὑμῶν μένῃ, ἵνα <strong>ὅ τι ἂν αἰτήσητε τὸν πατέρα ἐν τῷ ὀνόματί μου δῷ ὑμῖν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/15/#L16">Ιω 15:16</a>)</p></blockquote><blockquote><p>«καὶ ἐὰν οἴδαμεν ὅτι <strong><mark>ἀκούει ἡμῶν ὃ ἐὰν αἰτώμεθα</mark></strong>, οἴδαμεν ὅτι ἔχομεν τὰ αἰτήματα ἃ ᾐτήκαμεν ἀπ᾿ αὐτοῦ. <strong><mark>Ἐάν τις ἴδῃ τὸν ἀδελφὸν αὐτοῦ ἁμαρτάνοντα ἁμαρτίαν μὴ πρὸς θάνατον, αἰτήσει, καὶ δώσει αὐτῷ ζωήν</mark></strong>, τοῖς ἁμαρτάνουσιν μὴ πρὸς θάνατον. ἔστιν ἁμαρτία πρὸς θάνατον· οὐ περὶ ἐκείνης λέγω ἵνα ἐρωτήσῃ.» (<a href="https://bibleox.com/el/gr-lxx-byz/1in/5/#L15-16">Α Ιω 5:15-16</a>)</p></blockquote><blockquote><p>«ἀσθενεῖ τις ἐν ὑμῖν; <strong>προσκαλεσάσθω τοὺς πρεσβυτέρους τῆς ἐκκλησίας</strong>, καὶ <strong>προσευξάσθωσαν ἐπ᾿ αὐτὸν</strong> ἀλείψαντες ἐλαίῳ ἐν τῷ ὀνόματι [τοῦ] κυρίου· καὶ ἡ εὐχὴ τῆς πίστεως <strong>σώσει τὸν κάμνοντα</strong>, καὶ ἐγερεῖ αὐτὸν ὁ κύριος· <strong>κἂν ἁμαρτίας ᾖ πεποιηκώς, ἀφεθήσεται αὐτῷ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/iak/5/#L14-15">Ιακ 5:14-15</a>)</p></blockquote><p>Οι φίλοι του παραλυτικού συντρόφου τους κοπίασαν πολύ για να φέρουν τον φίλο τους στον Χριστό. Και με την πίστη τους ο Κύριος συγχώρησε τις αμαρτίες του παραλυτικού και τον θεράπευσε:</p><blockquote><p>«καὶ <strong>ἰδὼν</strong> ὁ <em>Ἰησοῦς</em> <strong>τὴν πίστιν αὐτῶν</strong> <em>λέγει τῷ παραλυτικῷ, Τέκνον, </em><strong><em>ἀφίενταί σου</em></strong><em> </em><strong><em>αἱ ἁμαρτίαι</em></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mk/2/#L5">Μκ 2:5</a>)</p></blockquote><h2>Οι αμαρτίες μπορούν να συγχωρούνται και μετά τον θάνατο</h2><p>Από τα λόγια του Κυρίου Ιησού Χριστού συνάγεται ότι είναι δυνατή η συγχώρηση αμαρτιών όχι μόνο σε αυτόν τον αιώνα αλλά και στον μέλλοντα. Υπάρχουν αμαρτίες που δεν θα συγχωρηθούν ούτε τώρα ούτε μετά:</p><blockquote><p>«Διὰ τοῦτο λέγω ὑμῖν, πᾶσα ἁμαρτία καὶ βλασφημία ἀφεθήσεται τοῖς ἀνθρώποις, ἡ δὲ τοῦ πνεύματος βλασφημία <strong>οὐκ ἀφεθήσεται. καὶ ὃς ἐὰν εἴπῃ λόγον κατὰ τοῦ υἱοῦ τοῦ ἀνθρώπου, ἀφεθήσεται αὐτῷ· ὃς δ᾿ ἂν εἴπῃ κατὰ τοῦ πνεύματος τοῦ ἁγίου, οὐκ ἀφεθήσεται αὐτῷ οὔτε ἐν τούτῳ τῷ αἰῶνι οὔτε ἐν τῷ μέλλοντι</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/12/#L31-32">Μτ 12:31-32</a>)</p></blockquote><h2>Ο Χριστός κατέχει τα κλειδιά του άδη και του θανάτου</h2><blockquote><p>«Καὶ ὅτε εἶδον αὐτόν, ἔπεσα πρὸς τοὺς πόδας αὐτοῦ ὡς νεκρός· καὶ ἔθηκεν τὴν δεξιὰν αὐτοῦ ἐπ᾿ ἐμὲ λέγων, Μὴ φοβοῦ· ἐγώ εἰμι ὁ πρῶτος καὶ ὁ ἔσχατος, καὶ ὁ ζῶν, καὶ ἐγενόμην νεκρὸς καὶ ἰδοὺ ζῶν εἰμι εἰς τοὺς αἰῶνας τῶν αἰώνων, καὶ <strong>ἔχω τὰς κλεῖς τοῦ θανάτου καὶ τοῦ ᾅδου</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/1/#L17-18">Απ 1:17-18</a>)</p></blockquote><h2>Παλαιά Διαθήκη. Φροντίδα για τη συγχώρηση των αμαρτιών των κεκοιμημένων</h2><h3>Νηστεία για τους κεκοιμημένους</h3><p>Οι Ισραηλίτες νήστεψαν για τον κεκοιμημένο βασιλιά Σαούλ, τους γιους του και όλους τους πεσόντες στη μάχη Ισραηλίτες</p><blockquote><p>«καὶ ἀπέθανεν Σαουλ καὶ οἱ τρεῖς υἱοὶ αὐτοῦ καὶ ὁ αἴρων τὰ σκεύη αὐτοῦ ἐν τῇ ἡμέρᾳ ἐκείνῃ κατὰ τὸ αὐτό.» (<a href="https://bibleox.com/el/gr-lxx-byz/1ts/31/#L6">Α Βασ 31:6</a>)</p></blockquote><blockquote><p>«καὶ λαμβάνουσιν τὰ ὀστᾶ αὐτῶν καὶ θάπτουσιν ὑπὸ τὴν ἄρουραν τὴν Ιαβις καὶ <strong>νηστεύουσιν ἑπτὰ ἡμέρας</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1ts/31/#L13">Α Βασ 31:13</a>)</p></blockquote><blockquote><p>«καὶ <strong>ἐκόψαντο καὶ ἔκλαυσαν καὶ ἐνήστευσαν ἕως δείλης</strong> ἐπὶ Σαουλ καὶ ἐπὶ Ιωναθαν τὸν υἱὸν αὐτοῦ καὶ ἐπὶ τὸν λαὸν Ιουδα καὶ ἐπὶ τὸν οἶκον Ισραηλ, ὅτι ἐπλήγησαν ἐν ῥομφαίᾳ.» (<a href="https://bibleox.com/el/gr-lxx-byz/2ts/1/#L12">Β Βασ 1:12</a>)</p></blockquote><h3>Προσευχή και θυσία για τους κεκοιμημένους</h3><p>Οι Ιουδαίοι προσευχήθηκαν για τους πεσόντες στρατιώτες, ώστε να τους συγχωρηθεί η αμαρτία. Έστειλαν επίσης χρήματα στον ναό της Ιερουσαλήμ, για να προσφερθεί εξιλαστήρια θυσία για τους κεκοιμημένους, για τον καθαρισμό τους από την αμαρτία:</p><blockquote><p>«Ιουδας δὲ ἀναλαβὼν τὸ στράτευμα ἧκεν εἰς Οδολλαμ πόλιν· τῆς δὲ ἑβδομάδος ἐπιβαλλούσης κατὰ τὸν ἐθισμὸν ἁγνισθέντες αὐτόθι τὸ σάββατον διήγαγον. τῇ δὲ ἐχομένῃ ἦλθον οἱ περὶ τὸν Ιουδαν καθ᾿ ὃν χρόνον τὸ τῆς χρείας ἐγεγόνει, τὰ σώματα τῶν προπεπτωκότων ἀνακομίσασθαι καὶ μετὰ τῶν συγγενῶν ἀποκαταστῆσαι εἰς τοὺς πατρῴους τάφους. εὗρον δὲ ἑκάστου τῶν τεθνηκότων ὑπὸ τοὺς χιτῶνας ἱερώματα τῶν ἀπὸ Ιαμνείας εἰδώλων, ἀφ᾿ ὧν ὁ νόμος ἀπείργει τοὺς Ιουδαίους· τοῖς δὲ πᾶσι σαφὲς ἐγένετο διὰ τήνδε τὴν αἰτίαν τούσδε πεπτωκέναι. πάντες οὖν εὐλογήσαντες τὰ τοῦ δικαιοκρίτου κυρίου τὰ κεκρυμμένα φανερὰ ποιοῦντος <strong>εἰς ἱκετείαν ἐτράπησαν ἀξιώσαντες τὸ γεγονὸς ἁμάρτημα τελείως ἐξαλειφθῆναι</strong>. ὁ δὲ γενναῖος Ιουδας παρεκάλεσε τὸ πλῆθος συντηρεῖν αὑτοὺς ἀναμαρτήτους εἶναι ὑπ᾿ ὄψιν ἑωρακότας τὰ γεγονότα διὰ τὴν τῶν προπεπτωκότων ἁμαρτίαν. ποιησάμενός τε κατ᾿ ἀνδρολογίαν εἰς ἀργυρίου δραχμὰς δισχιλίας <strong>ἀπέστειλεν εἰς Ιεροσόλυμα προσαγαγεῖν περὶ ἁμαρτίας θυσίαν πάνυ καλῶς καὶ ἀστείως πράττων ὑπὲρ ἀναστάσεως</strong> διαλογιζόμενος· <strong>εἰ μὴ γὰρ τοὺς προπεπτωκότας ἀναστῆναι προσεδόκα, περισσὸν καὶ ληρῶδες ὑπὲρ νεκρῶν εὔχεσθαι</strong>· εἶτε ἐμβλέπων τοῖς μετ᾿ εὐσεβείας κοιμωμένοις κάλλιστον ἀποκείμενον χαριστήριον, ὁσία καὶ εὐσεβὴς ἡ ἐπίνοια· <strong>ὅθεν περὶ τῶν τεθνηκότων τὸν ἐξιλασμὸν ἐποιήσατο τῆς ἁμαρτίας ἀπολυθῆναι</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/2mak/12/#L38-45">II Μακ 12:38-45</a>)</p></blockquote><h3>Ελεημοσύνη για τους κεκοιμημένους</h3><p>Οι Ιουδαίοι έκαναν ελεημοσύνη για χάρη των κεκοιμημένων:</p><blockquote><p>«<strong>χάρις δόματος ἔναντι παντὸς ζῶντος, καὶ ἐπὶ νεκρῷ μὴ ἀποκωλύσῃς χάριν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/prsir/7/#L33">Σ.Σειρ 7:33</a>)</p></blockquote><blockquote><p>«<strong>ἔκχεον τοὺς ἄρτους σου ἐπὶ τὸν τάφον τῶν δικαίων</strong> καὶ μὴ δῷς τοῖς ἁμαρτωλοῖς.» (<a href="https://bibleox.com/el/gr-lxx-byz/tov/4/#L17">Τωβ 4:17</a>)</p></blockquote><p>Ελεημοσύνη για τους νεκρούς δεν έκαναν από τη δεκάτη:</p><blockquote><p>«Ἐὰν δὲ <strong>συντελέσῃς ἀποδεκατῶσαι πᾶν τὸ ἐπιδέκατον τῶν γενημάτων τῆς γῆς σου</strong> ἐν τῷ ἔτει τῷ τρίτῳ, τὸ δεύτερον ἐπιδέκατον δώσεις τῷ Λευίτῃ καὶ τῷ προσηλύτῳ καὶ τῷ ὀρφανῷ καὶ τῇ χήρᾳ, καὶ φάγονται ἐν ταῖς πόλεσίν σου καὶ ἐμπλησθήσονται. καὶ <strong>ἐρεῖς ἐναντίον κυρίου τοῦ θεοῦ σου</strong> Ἐξεκάθαρα τὰ ἅγια ἐκ τῆς οἰκίας μου καὶ ἔδωκα αὐτὰ τῷ Λευίτῃ καὶ τῷ προσηλύτῳ καὶ τῷ ὀρφανῷ καὶ τῇ χήρᾳ κατὰ πάσας τὰς ἐντολάς, ἃς ἐνετείλω μοι· οὐ παρῆλθον τὴν ἐντολήν σου καὶ οὐκ ἐπελαθόμην· καὶ οὐκ ἔφαγον ἐν ὀδύνῃ μου ἀπ᾿ αὐτῶν, οὐκ ἐκάρπωσα ἀπ᾿ αὐτῶν εἰς ἀκάθαρτον, <strong>οὐκ ἔδωκα ἀπ᾿ αὐτῶν τῷ τεθνηκότι</strong>· ὑπήκουσα τῆς φωνῆς κυρίου τοῦ θεοῦ μου, ἐποίησα καθὰ ἐνετείλω μοι.» (<a href="https://bibleox.com/el/gr-lxx-byz/vtor/26/#L12-14">Δτ 26:12-14</a>)</p></blockquote><h2>Στον Θεό όλοι ζουν</h2><p>Οι παρατιθέμενες ρήσεις δείχνουν τις πεποιθήσεις των Ιουδαίων, τις συγκεκριμένες πρακτικές τους. Προσεύχονταν για τη συγχώρηση των αμαρτιών των κεκοιμημένων, νήστευαν γι'' αυτούς, πρόσφεραν θυσίες γι'' αυτούς, έκαναν ελεημοσύνη γι'' αυτούς και γενικά φρόντιζαν για τη μεταθανάτια μοίρα τους. Τη μεταθανάτια ύπαρξη την αρνούνταν μόνο οι Σαδδουκαίοι, τους οποίους ο Κύριος έλεγξε για τις πλάνες και την άγνοια των Γραφών:</p><blockquote><p>«ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς, Πλανᾶσθε <strong>μὴ εἰδότες τὰς γραφὰς μηδὲ τὴν δύναμιν τοῦ θεοῦ</strong>·» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/22/#L29">Μτ 22:29</a>)</p></blockquote><blockquote><p>«<strong>οὐκ ἔστιν θεὸς νεκρῶν ἀλλὰ ζώντων</strong>· <strong>πολὺ πλανᾶσθε</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mk/12/#L27">Μκ 12:27</a>)</p></blockquote><h2>Ελπίδα για κάθε βοήθεια προς τον κεκοιμημένο</h2><p>Αν ακόμη και κάποιον άνθρωπο ήταν αδύνατο να τον σώσει κανείς από την κόλαση, σε κάθε περίπτωση μπορεί να ανακουφίσει τα βάσανά του, να του δώσει κάποια παρηγοριά τώρα ή στο μέλλον (μετά την κοινή ανάσταση και την Κρίση), επειδή το μέτρο της τιμωρίας δεν είναι ίδιο:</p><blockquote><p><em>«ἐκεῖνος δὲ ὁ δοῦλος </em><strong><em>ὁ γνοὺς τὸ θέλημα</em></strong><em> τοῦ κυρίου αὐτοῦ καὶ </em><strong><em>μὴ ἑτοιμάσας ἢ ποιήσας πρὸς τὸ θέλημα αὐτοῦ <mark>δαρήσεται πολλάς</mark></em></strong><em>· ὁ δὲ μὴ γνούς, </em><strong><em>ποιήσας δὲ ἄξια πληγῶν, <mark>δαρήσεται ὀλίγας</mark></em></strong><em>. παντὶ δὲ ᾧ ἐδόθη πολύ, πολὺ ζητηθήσεται παρ᾿ αὐτοῦ, καὶ </em><strong><em>ᾧ παρέθεντο πολύ, περισσότερον αἰτήσουσιν αὐτόν</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/lk/12/#L47-48"><em>Λκ 12:47-48</em></a><em>)</em></p></blockquote><p>Περισσότερες ρήσεις για τη διαφορά της τιμωρίας: <em> </em><a href="https://bibleox.com/el/el/w/Η_άνιση_ανταπόδοση">το μέτρο της τιμωρίας δεν είναι ίδιο</a>.</p>'
