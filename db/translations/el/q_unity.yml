  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: '<h2>Πρόλογος</h2><p>Πρώτα απ’ όλα, είναι σημαντικό να σημειωθεί ότι στη Βίβλο δεν υπάρχει ούτε ένα παράδειγμα ούτε ένας λόγος για τη δημιουργία δικών μας εκκλησιών και για την ανακήρυξη του εαυτού μας ποιμένα τους. Ο Χριστός δημιούργησε μία ορατή Εκκλησία και εξέφρασε το θέλημά Του για την ενότητά της.</p><h2>Το θέλημα του Χριστού και των αποστόλων για την ορατή ενότητα της Εκκλησίας</h2><blockquote><p><em>«Οὐ περὶ τούτων δὲ </em><strong><em><mark>ἐρωτῶ</mark></em></strong><em> μόνον, ἀλλὰ καὶ περὶ τῶν πιστευόντων διὰ τοῦ λόγου αὐτῶν εἰς ἐμέ, </em><strong><em><mark>ἵνα πάντες ἓν ὦσιν</mark></em></strong><em>, καθὼς σύ, πάτερ, ἐν ἐμοὶ κἀγὼ ἐν σοί, </em><strong><em>ἵνα καὶ αὐτοὶ ἐν ἡμῖν ὦσιν, <mark>ἵνα ὁ κόσμος πιστεύῃ ὅτι σύ με ἀπέστειλας</mark></em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/in/17/#L20-21"><em>Ιω 17:20-21</em></a><em>)</em></p></blockquote><blockquote><p>«<strong><mark>Παρακαλῶ</mark></strong> δὲ ὑμᾶς, ἀδελφοί, διὰ τοῦ ὀνόματος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, <strong><mark>ἵνα τὸ αὐτὸ λέγητε πάντες</mark></strong>, <strong><mark>καὶ μὴ ᾖ ἐν ὑμῖν σχίσματα</mark></strong>, <strong>ἦτε δὲ κατηρτισμένοι <mark>ἐν τῷ αὐτῷ νοῒ</mark> καὶ <mark>ἐν τῇ αὐτῇ γνώμῃ</mark></strong>. ἐδηλώθη γάρ μοι περὶ ὑμῶν, ἀδελφοί μου, ὑπὸ τῶν Χλόης ὅτι <strong>ἔριδες ἐν ὑμῖν εἰσιν. λέγω δὲ τοῦτο, ὅτι ἕκαστος ὑμῶν λέγει, Ἐγὼ μέν εἰμι Παύλου, Ἐγὼ δὲ Ἀπολλῶ, Ἐγὼ δὲ Κηφᾶ, Ἐγὼ δὲ Χριστοῦ. μεμέρισται ὁ Χριστός</strong>; μὴ Παῦλος ἐσταυρώθη ὑπὲρ ὑμῶν, ἢ εἰς τὸ ὄνομα Παύλου ἐβαπτίσθητε;» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/1/#L10-13">Α Κορ 1:10-13</a>) «ὅταν γὰρ λέγῃ τις, Ἐγὼ μέν εἰμι Παύλου, ἕτερος δέ, Ἐγὼ Ἀπολλῶ, <strong>οὐκ ἄνθρωποί ἐστε</strong>;» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/3/#L4">Α Κορ 3:4</a>)</p></blockquote><p>Ο Θεός τοποθέτησε τα μέλη του σώματος (της Εκκλησίας) έτσι, ώστε να μην υπάρχει διαίρεση, αλλά όλοι να φροντίζουν ο ένας τον άλλον, να πάσχουν μαζί και να χαίρονται μαζί:</p><blockquote><p>«καὶ γὰρ <strong>ἐν ἑνὶ πνεύματι ἡμεῖς πάντες εἰς ἓν σῶμα ἐβαπτίσθημεν</strong>, εἴτε Ἰουδαῖοι εἴτε Ἕλληνες, εἴτε δοῦλοι εἴτε ἐλεύθεροι, καὶ πάντες ἓν πνεῦμα ἐποτίσθημεν. καὶ γὰρ <strong>τὸ σῶμα οὐκ ἔστιν ἓν μέλος ἀλλὰ πολλά</strong>. &lt;…&gt; <strong><mark>οὐ δύναται δὲ ὁ ὀφθαλμὸς εἰπεῖν τῇ χειρί, Χρείαν σου οὐκ ἔχω, ἢ πάλιν ἡ κεφαλὴ τοῖς ποσίν, Χρείαν ὑμῶν οὐκ ἔχω</mark></strong>· ἀλλὰ πολλῷ μᾶλλον τὰ δοκοῦντα μέλη τοῦ σώματος ἀσθενέστερα ὑπάρχειν ἀναγκαῖά ἐστιν, καὶ ἃ δοκοῦμεν ἀτιμότερα εἶναι τοῦ σώματος, τούτοις τιμὴν περισσοτέραν περιτίθεμεν, καὶ τὰ ἀσχήμονα ἡμῶν εὐσχημοσύνην περισσοτέραν ἔχει, τὰ δὲ εὐσχήμονα ἡμῶν οὐ χρείαν ἔχει. ἀλλὰ <strong><mark>ὁ θεὸς συνεκέρασεν τὸ σῶμα</mark></strong>, τῷ ὑστερουμένῳ περισσοτέραν δοὺς τιμήν, <strong><mark>ἵνα μὴ ᾖ σχίσμα ἐν τῷ σώματι</mark></strong>, ἀλλὰ τὸ αὐτὸ ὑπὲρ ἀλλήλων μεριμνῶσιν τὰ μέλη. καὶ <strong>εἴτε πάσχει ἓν μέλος, συμπάσχει πάντα τὰ μέλη· εἴτε δοξάζεται ἓν μέλος, συγχαίρει πάντα τὰ μέλη</strong>.» <em>(</em><a href="https://bibleox.com/el/gr-lxx-byz/1kor/12/#L13-14,21-26"><em>Α Κορ 12:13-14,21-26</em></a><em>)</em></p></blockquote><p>Τι είναι αυτά τα διάφορα μέλη του σώματος; — διάφορες διακονίες και χαρίσματα στην Εκκλησία:</p><blockquote><p>«<strong>Καθάπερ γὰρ τὸ σῶμα ἕν ἐστιν καὶ μέλη πολλὰ ἔχει, πάντα δὲ τὰ μέλη τοῦ σώματος πολλὰ ὄντα ἕν ἐστιν σῶμα</strong>, οὕτως καὶ ὁ Χριστός· &lt;…&gt; καὶ γὰρ <strong>τὸ σῶμα οὐκ ἔστιν ἓν μέλος ἀλλὰ πολλά</strong>. &lt;…&gt; <strong>Ὑμεῖς δέ ἐστε σῶμα Χριστοῦ καὶ μέλη ἐκ μέρους</strong>. καὶ οὓς μὲν <strong>ἔθετο ὁ θεὸς ἐν τῇ ἐκκλησίᾳ</strong> πρῶτον <strong>ἀποστόλους</strong>, δεύτερον <strong>προφήτας</strong>, τρίτον <strong>διδασκάλους</strong>, ἔπειτα <strong>δυνάμεις</strong>, ἔπειτα <strong>χαρίσματα</strong> ἰαμάτων, ἀντιλήμψεις, κυβερνήσεις, γένη γλωσσῶν. <strong>μὴ πάντες ἀπόστολοι; μὴ πάντες προφῆται; μὴ πάντες διδάσκαλοι; μὴ πάντες δυνάμεις; μὴ πάντες χαρίσματα ἔχουσιν ἰαμάτων</strong>; <strong>μὴ πάντες γλώσσαις λαλοῦσιν</strong>; <strong>μὴ πάντες διερμηνεύουσιν</strong>;» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/12/#L12,14,27-30">Α Κορ 12:12,14,27-30</a>)</p></blockquote><p>Έτσι, όλες αυτές τις διακονίες και τα χαρίσματα ο Θεός τα τοποθέτησε έτσι, ώστε να μην υπάρχουν διαιρέσεις στο σώμα, τις οποίες ο απόστολος προλαμβάνει στην αρχή της επιστολής (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/1/#L10-13">Α Κορ 1:10-13</a>). Δηλαδή ο Θεός όχι μόνο θέλει την ενότητα (<a href="https://bibleox.com/el/gr-lxx-byz/in/17/#L20-21">Ιω 17:20-21</a>), αλλά και φροντίζει γι’ αυτήν. Ο απόστολος λοιπόν έχει τεθεί από τον Θεό σε διακονία και φροντίζει για την ορατή ενότητα, απαγορεύει στους Κορινθίους να δημιουργούν ορατές διαιρέσεις.</p><p>Εφόσον η ενότητα είναι θέλημα του Χριστού, είναι σημαντικό να κατανοήσουμε ότι θα σωθεί εκείνος που εκπληρώνει το θέλημα του Θεού (<a href="https://bibleox.com/el/gr-lxx-byz/mf/7/#L21">Μτ 7:21</a>).</p><h2>Οι αντίχριστοι παραβιάζουν το θέλημα του Χριστού, βγαίνουν φανερά έξω από τα όρια της Εκκλησίας</h2><p>Οι αντίχριστοι βγαίνουν έξω από τις αποστολικές κοινότητες:</p><blockquote><p><em>«Παιδία, ἐσχάτη ὥρα ἐστίν, καὶ καθὼς ἠκούσατε ὅτι ἀντίχριστος ἔρχεται, καὶ </em><strong><em>νῦν <mark>ἀντίχριστοι πολλοὶ γεγόνασιν</mark></em></strong><em>· ὅθεν γινώσκομεν ὅτι ἐσχάτη ὥρα ἐστίν. </em><strong><em><mark>ἐξ ἡμῶν ἐξῆλθαν, ἀλλ᾿ οὐκ ἦσαν ἐξ ἡμῶν· εἰ γὰρ ἐξ ἡμῶν ἦσαν, μεμενήκεισαν ἂν μεθ᾿ ἡμῶν</mark></em></strong><em>· ἀλλ᾿ ἵνα φανερωθῶσιν ὅτι οὐκ εἰσὶν πάντες ἐξ ἡμῶν.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/1in/2/#L18-19"><em>Α Ιω 2:18-19</em></a><em>)</em></p></blockquote><p>Υπηρετούν <u>όχι</u> τον Χριστό:</p><blockquote><p><em>«Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, </em><strong><em>σκοπεῖν τοὺς <mark>τὰς διχοστασίας καὶ τὰ σκάνδαλα</mark> παρὰ τὴν διδαχὴν ἣν ὑμεῖς ἐμάθετε ποιοῦντας</em></strong><em>, καὶ ἐκκλίνετε ἀπ᾿ αὐτῶν· </em><strong><em><mark>οἱ γὰρ τοιοῦτοι τῷ κυρίῳ ἡμῶν Χριστῷ οὐ δουλεύουσιν</mark></em></strong><em> ἀλλὰ τῇ ἑαυτῶν κοιλίᾳ, καὶ διὰ τῆς χρηστολογίας καὶ εὐλογίας ἐξαπατῶσιν τὰς καρδίας τῶν ἀκάκων.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/rim/16/#L17-18"><em>Ρωμ 16:17-18</em></a><em>)</em></p></blockquote><h2>Η αρχική ορατή ενότητα της Εκκλησίας</h2><h3>Οι ξένοι — χωριστά</h3><p>Η Εκκλησία στην αρχή είχε απολύτως συγκεκριμένα ορατά όρια:</p><blockquote><p>«τῶν δὲ <strong>λοιπῶν</strong> οὐδεὶς ἐτόλμα κολλᾶσθαι αὐτοῖς, ἀλλ᾿ ἐμεγάλυνεν αὐτοὺς ὁ λαός·» (<a href="https://bibleox.com/el/gr-lxx-byz/act/5/#L13">Πραξ 5:13</a>)</p></blockquote><h3>Τα κοινά αγαθά</h3><p>Η Εκκλησία ήταν ένα μονολιθικό σύνολο:</p><blockquote><p>«Τοῦ δὲ πλήθους τῶν πιστευσάντων ἦν <strong>καρδία καὶ ψυχὴ μία</strong>, καὶ οὐδὲ εἷς τι τῶν ὑπαρχόντων αὐτῷ ἔλεγεν ἴδιον εἶναι, ἀλλ᾿ <strong>ἦν αὐτοῖς πάντα κοινά</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/4/#L32">Πραξ 4:32</a>)</p></blockquote><h3>Κοινή λύση των αμφιλεγόμενων ζητημάτων</h3><p>Η Εκκλησία έχει κοινά προβλήματα και τα λύνει μαζί, συγκεντρωνόμενη σε απολύτως συγκεκριμένες, ορατές συνόδους:</p><blockquote><p>«<strong>Συνήχθησαν δὲ οἱ ἀπόστολοι καὶ οἱ πρεσβύτεροι</strong> ἰδεῖν περὶ τοῦ λόγου τούτου. &lt;…&gt; Τότε <strong>ἔδοξε τοῖς ἀποστόλοις καὶ τοῖς πρεσβυτέροις σὺν ὅλῃ τῇ ἐκκλησίᾳ</strong> ἐκλεξαμένους ἄνδρας ἐξ αὐτῶν πέμψαι εἰς Ἀντιόχειαν σὺν τῷ Παύλῳ καὶ Βαρναβᾷ, Ἰούδαν τὸν καλούμενον Βαρσαββᾶν καὶ Σίλαν, ἄνδρας ἡγουμένους ἐν τοῖς ἀδελφοῖς,» (<a href="https://bibleox.com/el/gr-lxx-byz/act/15/#L6,22">Πραξ 15:6,22</a>)</p></blockquote><h3>Κοινοί κανόνες</h3><p>Η Εκκλησία έχει συγκεκριμένους κανόνες κοινούς για όλους:</p><blockquote><p>«ὡς δὲ διεπορεύοντο <strong>τὰς πόλεις</strong>, <strong>παρεδίδοσαν αὐτοῖς φυλάσσειν τὰ δόγματα τὰ κεκριμένα ὑπὸ τῶν ἀποστόλων καὶ πρεσβυτέρων</strong> τῶν ἐν Ἱεροσολύμοις. αἱ μὲν οὖν ἐκκλησίαι ἐστερεοῦντο τῇ πίστει καὶ ἐπερίσσευον τῷ ἀριθμῷ καθ᾿ ἡμέραν.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/16/#L4-5">Πραξ 16:4-5</a>)</p></blockquote><h3>Απαγόρευση διαίρεσης σε παρατάξεις</h3><p>Στην Εκκλησία ανακόπτεται κάθε απόπεια διαίρεσης:</p><blockquote><p>«<strong><mark>Παρακαλῶ</mark></strong> δὲ ὑμᾶς, ἀδελφοί, διὰ τοῦ ὀνόματος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, <strong><mark>ἵνα τὸ αὐτὸ λέγητε πάντες</mark></strong>, <strong><mark>καὶ μὴ ᾖ ἐν ὑμῖν σχίσματα</mark></strong>, <strong>ἦτε δὲ κατηρτισμένοι <mark>ἐν τῷ αὐτῷ νοῒ</mark> καὶ <mark>ἐν τῇ αὐτῇ γνώμῃ</mark></strong>. ἐδηλώθη γάρ μοι περὶ ὑμῶν, ἀδελφοί μου, ὑπὸ τῶν Χλόης ὅτι <strong>ἔριδες ἐν ὑμῖν εἰσιν. λέγω δὲ τοῦτο, ὅτι ἕκαστος ὑμῶν λέγει, Ἐγὼ μέν εἰμι Παύλου, Ἐγὼ δὲ Ἀπολλῶ, Ἐγὼ δὲ Κηφᾶ, Ἐγὼ δὲ Χριστοῦ. μεμέρισται ὁ Χριστός</strong>; μὴ Παῦλος ἐσταυρώθη ὑπὲρ ὑμῶν, ἢ εἰς τὸ ὄνομα Παύλου ἐβαπτίσθητε;» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/1/#L10-13">Α Κορ 1:10-13</a>) «ὅταν γὰρ λέγῃ τις, Ἐγὼ μέν εἰμι Παύλου, ἕτερος δέ, Ἐγὼ Ἀπολλῶ, <strong>οὐκ ἄνθρωποί ἐστε</strong>;» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/3/#L4">Α Κορ 3:4</a>)</p></blockquote><h3>Μία πίστη και μυστήρια</h3><p>Στην Εκκλησία υπάρχει ακριβώς μία, συγκεκριμένη, κοινή για όλους πίστη:</p><blockquote><p>«<em>εἷς κύριος, </em><strong><em>μία πίστις</em></strong><em>, ἓν βάπτισμα·</em>» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/4/#L5">Εφ 4:5</a>)</p></blockquote><blockquote><p>«<em>πᾶς </em><strong><em>ὁ προάγων καὶ μὴ μένων ἐν τῇ διδαχῇ τοῦ Χριστοῦ θεὸν οὐκ ἔχει</em></strong><em>· ὁ μένων ἐν τῇ διδαχῇ, οὗτος καὶ τὸν πατέρα καὶ τὸν υἱὸν ἔχει.</em>» (<a href="https://bibleox.com/el/gr-lxx-byz/2in/1/#L9">Β Ιω 1:9</a>)</p></blockquote><p>Όπως λέει ο Σωτήρας: η πίστη κατά τον λόγο των αποστόλων:</p><blockquote><p>«Οὐ περὶ τούτων δὲ ἐρωτῶ μόνον, ἀλλὰ καὶ περὶ τῶν <strong>πιστευόντων</strong> <strong>διὰ τοῦ λόγου αὐτῶν</strong> εἰς ἐμέ,» (<a href="https://bibleox.com/el/gr-lxx-byz/in/17/#L20">Ιω 17:20</a>)</p></blockquote><p>Η Εκκλησία γνώριζε ότι στο μέλλον θα εμφανιστούν άνθρωποι που θα θελήσουν να αποχωριστούν από τη μοναδική πίστη. Αυτοί οι άνθρωποι δεν ονομάζονται Εκκλησία:</p><blockquote><p>«ὅτι ἔλεγον ὑμῖν, Ἐπ᾿ ἐσχάτου [τοῦ] χρόνου ἔσονται ἐμπαῖκται κατὰ τὰς ἑαυτῶν ἐπιθυμίας πορευόμενοι τῶν ἀσεβειῶν. Οὗτοί εἰσιν <strong>οἱ ἀποδιορίζοντες</strong>, ψυχικοί, πνεῦμα μὴ ἔχοντες.» (<a href="https://bibleox.com/el/gr-lxx-byz/iud/1/#L18-19">Ιούδα 1:18-19</a>)</p></blockquote><h3>Μία ιεραρχία της ιεροσύνης</h3><blockquote><p><em>«Ἀπὸ δὲ τῆς Μιλήτου πέμψας εἰς Ἔφεσον μετεκαλέσατο τοὺς πρεσβυτέρους τῆς ἐκκλησίας. ὡς δὲ παρεγένοντο πρὸς αὐτὸν εἶπεν αὐτοῖς, Ὑμεῖς ἐπίστασθε ἀπὸ πρώτης ἡμέρας ἀφ᾿ ἧς ἐπέβην εἰς τὴν Ἀσίαν πῶς μεθ᾿ ὑμῶν τὸν πάντα χρόνον ἐγενόμην, &lt;…&gt; προσέχετε ἑαυτοῖς καὶ παντὶ τῷ ποιμνίῳ, </em><strong><em>ἐν ᾧ ὑμᾶς τὸ πνεῦμα τὸ ἅγιον ἔθετο ἐπισκόπους, ποιμαίνειν τὴν ἐκκλησίαν τοῦ θεοῦ</em></strong><em>, ἣν περιεποιήσατο διὰ τοῦ αἵματος τοῦ ἰδίου.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/act/20/#L17-18,28"><em>Πραξ 20:17-18,28</em></a><em>)</em></p></blockquote><p>Περισσότερα για την ιεροσύνη.</p><hr><p>Έτσι, η Εκκλησία είναι μια απολύτως συγκεκριμένη ορατή κοινωνία (οργανισμός), με μία ακριβώς κοινή αποστολική πίστη, με κοινούς για όλους κανόνες, κάτω από ενιαίους ως προς όλα ηγέτες, τοποθετημένους από τους αποστόλους, της οποίας τα μέλη δεν έχουν μεταξύ τους κανένα φραγμό.</p><h2>Τα όρια της Εκκλησίας και η Ευχαριστία</h2><p>Η παλαιοδιαθηκική Εκκλησία δεν ονομαζόταν Σώμα Χριστού, σε αντίθεση με τη νεοδιαθηκική. Η νεοδιαθηκική Εκκλησία είναι ένας μυστικός θεανθρώπινος οργανισμός, το Σώμα Χριστού. Γι’ αυτό, τα όρια της Εκκλησίας είναι εκεί όπου είναι τα όρια του σώματος. Πού είναι τα όρια του ανθρώπινου σώματος; Όπου κυκλοφορεί το αίμα — εκεί είναι το σώμα. Όπου δεν κυκλοφορεί — εκεί δεν είναι σώμα. Χωρίς αίμα δεν υπάρχει ζωή στα μέρη του ανθρώπου. Το κομμένο χέρι δεν είναι πια μέρος του σώματος. Σύντομα, χωρίς αίμα, θα σαπίσει, μη δεχόμενο τη ροή του αίματος. Όπου υπάρχει αληθινή Θεία Κοινωνία, εκεί είναι το Σώμα, δηλαδή η Εκκλησία:</p><blockquote><p>«τὸ ποτήριον τῆς εὐλογίας ὃ εὐλογοῦμεν, οὐχὶ <strong>κοινωνία ἐστὶν τοῦ αἵματος τοῦ Χριστοῦ</strong>; τὸν ἄρτον ὃν κλῶμεν, οὐχὶ <strong>κοινωνία τοῦ σώματος τοῦ Χριστοῦ ἐστιν</strong>; ὅτι εἷς ἄρτος, <strong>ἓν σῶμα οἱ πολλοί ἐσμεν, οἱ γὰρ πάντες ἐκ τοῦ ἑνὸς ἄρτου μετέχομεν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/10/#L16-17">Α Κορ 10:16-17</a>)</p></blockquote><blockquote><p>«Ὑμεῖς δέ ἐστε <strong>σῶμα Χριστοῦ</strong> καὶ μέλη ἐκ μέρους.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/12/#L27">Α Κορ 12:27</a>)</p></blockquote><blockquote><p>«νυνὶ δὲ ἐν Χριστῷ Ἰησοῦ ὑμεῖς οἵ ποτε ὄντες μακρὰν <strong>ἐγενήθητε ἐγγὺς ἐν τῷ αἵματι τοῦ Χριστοῦ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/2/#L13">Εφ 2:13</a>)</p></blockquote><p>Γι’ αυτό σώζονται μόνο στην Εκκλησία, επειδή ο Χριστός είναι σωτήρας του Σώματος, δηλαδή της Εκκλησίας:</p><blockquote><p>«ὅτι ἀνήρ ἐστιν κεφαλὴ τῆς γυναικὸς ὡς καὶ ὁ Χριστὸς <strong>κεφαλὴ τῆς ἐκκλησίας</strong>, αὐτὸς <strong>σωτὴρ τοῦ σώματος</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/5/#L23">Εφ 5:23</a>)</p></blockquote><p>Περισσότερα για την Ευχαριστία.</p><h3>Ο ιερομάρτυς Ιγνάτιος, επίσκοπος Αντιοχείας (1ος αιώνας), επιστολή προς Σμυρναίους:</h3><blockquote><p>«Κεφάλαιο 8. Μην κάνετε τίποτα χωρίς τον επίσκοπο.… Χωρίς τον επίσκοπο, κανείς να μην κάνει τίποτα από όσα αφορούν την Εκκλησία· <strong>μόνη εκείνη η ευχαριστία να θεωρείται αληθινή, που τελείται από τον επίσκοπο ή από εκείνον στον οποίο ο ίδιος θα την παραχωρήσει</strong>»</p></blockquote>'
