  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: '<h2>Ο διάβολος (Σατανάς) — παραπεσών άγγελος</h2><p>Ο διάβολος είναι ένας από τους πολλούς αγγέλους που δημιούργησε ο Θεός, αλλά που στη συνέχεια δεν θέλησε να υπηρετεί τον Θεό, δηλαδή αποστάτησε από τον Θεό — παραπεσών:</p><blockquote><p>«Υἱὲ ἀνθρώπου, λαβὲ θρῆνον ἐπὶ τὸν ἄρχοντα Τύρου καὶ εἰπὸν αὐτῷ Τάδε λέγει κύριος κύριος Σὺ ἀποσφράγισμα ὁμοιώσεως καὶ στέφανος κάλλους ἐν τῇ τρυφῇ τοῦ παραδείσου τοῦ θεοῦ ἐγενήθης· πᾶν λίθον χρηστὸν ἐνδέδεσαι, σάρδιον καὶ τοπάζιον καὶ σμάραγδον καὶ ἄνθρακα καὶ σάπφειρον καὶ ἴασπιν καὶ ἀργύριον καὶ χρυσίον καὶ λιγύριον καὶ ἀχάτην καὶ ἀμέθυστον καὶ χρυσόλιθον καὶ βηρύλλιον καὶ ὀνύχιον, καὶ χρυσίου ἐνέπλησας τοὺς θησαυρούς σου καὶ τὰς ἀποθήκας σου ἐν σοὶ ἀφ᾿ ἧς ἡμέρας ἐκτίσθης σύ. <strong>μετὰ τοῦ χερουβ ἔθηκά σε ἐν ὄρει ἁγίῳ θεοῦ, ἐγενήθης ἐν μέσῳ λίθων πυρίνων. ἐγενήθης ἄμωμος σὺ ἐν ταῖς ἡμέραις σου ἀφ᾿ ἧς ἡμέρας σὺ ἐκτίσθης ἕως εὑρέθη τὰ ἀδικήματα ἐν σοί.</strong> ἀπὸ πλήθους τῆς ἐμπορίας σου ἔπλησας τὰ ταμίειά σου ἀνομίας καὶ <strong>ἥμαρτες καὶ ἐτραυματίσθης ἀπὸ ὄρους τοῦ θεοῦ, καὶ ἤγαγέν σε τὸ χερουβ ἐκ μέσου λίθων πυρίνων</strong>. <strong>ὑψώθη ἡ καρδία σου ἐπὶ τῷ κάλλει σου</strong>, διεφθάρη ἡ ἐπιστήμη σου μετὰ τοῦ κάλλους σου· <strong>διὰ πλῆθος ἁμαρτιῶν σου ἐπὶ τὴν γῆν ἔρριψά σε</strong>, ἐναντίον βασιλέων ἔδωκά σε παραδειγματισθῆναι. διὰ τὸ πλῆθος τῶν ἁμαρτιῶν σου καὶ τῶν ἀδικιῶν τῆς ἐμπορίας σου ἐβεβήλωσας τὰ ἱερά σου· <strong>καὶ ἐξάξω πῦρ ἐκ μέσου σου, τοῦτο καταφάγεταί σε</strong>· καὶ δώσω σε εἰς σποδὸν ἐπὶ τῆς γῆς σου ἐναντίον πάντων τῶν ὁρώντων σε. καὶ πάντες οἱ ἐπιστάμενοί σε ἐν τοῖς ἔθνεσιν στυγνάσουσιν ἐπὶ σέ· ἀπώλεια ἐγένου καὶ οὐχ ὑπάρξεις ἔτι εἰς τὸν αἰῶνα.» (<a href="https://bibleox.com/el/gr-lxx-byz/iez/28/#L12-19">Ιεζ 28:12-19</a>)</p></blockquote><p>Τα αποστατήσαντα από τον Θεό άγγελα ονομάζονται με διάφορες λέξεις: δαίμονες (<a href="https://bibleox.com/el/gr-lxx-byz/mf/8/#L31">Μτ 8:31</a>), δαιμόνιον (<a href="https://bibleox.com/el/gr-lxx-byz/tov/6/#L8">Τωβ 6:8</a>), ἄγγελος Σατανᾶ (<a href="https://bibleox.com/el/gr-lxx-byz/2kor/12/#L7">Β Κορ 12:7</a>), ἀκάθαρτο πνεῦμα (<a href="https://bibleox.com/el/gr-lxx-byz/mf/10/#L1">Μτ 10:1</a>), «διάολος» (λαϊκή ονομασία). Ο Σατανάς ονομάζεται επίσης όφις (<a href="https://bibleox.com/el/gr-lxx-byz/gen/3/#L1">Γεν 3:1</a>; <a href="https://bibleox.com/el/gr-lxx-byz/is/27/#L1">Ησ 27:1</a>; <a href="https://bibleox.com/el/gr-lxx-byz/otkr/12/#L9">Απ 12:9</a>; <a href="https://bibleox.com/el/gr-lxx-byz/otkr/20/#L2">Απ 20:2</a>), δράκων (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/12/#L9">Απ 12:9</a>; <a href="https://bibleox.com/el/gr-lxx-byz/otkr/20/#L2">Απ 20:2</a>), ἑωσφόρος (<a href="https://bibleox.com/el/gr-lxx-byz/is/14/#L12">Ησ 14:12</a>), Λεβιάθαν (<a href="https://bibleox.com/el/gr-lxx-byz/is/27/#L1">Ησ 27:1</a>), ἄρχων τοῦ κόσμου τούτου (<a href="https://bibleox.com/el/gr-lxx-byz/in/12/#L31">Ιω 12:31</a>), ὁ πονηρός (<a href="https://bibleox.com/el/gr-lxx-byz/mf/13/#L19">Μτ 13:19</a>), ψευδὲς πνεῦμα (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/22/#L22">Γ Βασ 22:22</a>). Ο διάβολος δεν είναι ένα ανώνυμο συναίσθημα, ούτε αφηρημένη κίνηση μέσα στον άνθρωπο, ούτε αλληγορία. Είναι πραγματικό ον, προσωπικότητα. Ο διάβολος είναι το πρώτο ον που αμάρτησε:</p><blockquote><p>«ὁ ποιῶν τὴν ἁμαρτίαν ἐκ τοῦ διαβόλου ἐστίν, ὅτι <strong>ἀπ᾿ ἀρχῆς ὁ διάβολος ἁμαρτάνει</strong>. εἰς τοῦτο ἐφανερώθη ὁ υἱὸς τοῦ θεοῦ, ἵνα λύσῃ τὰ ἔργα τοῦ διαβόλου.» (<a href="https://bibleox.com/el/gr-lxx-byz/1in/3/#L8">Α Ιω 3:8</a>)</p></blockquote><h2>Ο διάβολος έχει δική του βούληση</h2><blockquote><p>«καὶ ἀνανήψωσιν ἐκ τῆς τοῦ διαβόλου παγίδος, ἐζωγρημένοι ὑπ᾿ αὐτοῦ <strong>εἰς τὸ ἐκείνου θέλημα</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/2tim/2/#L26">Β Τιμ 2:26</a>)</p></blockquote><h2>Ο διάβολος ενεργεί μέσω της πρότασης κακών σκέψεων στον άνθρωπο</h2><blockquote><p>«εἶπεν δὲ ὁ Πέτρος, Ἁνανία, διὰ τί <strong>ἐπλήρωσεν ὁ Σατανᾶς τὴν καρδίαν σου ψεύσασθαί σε</strong> τὸ πνεῦμα τὸ ἅγιον καὶ νοσφίσασθαι ἀπὸ τῆς τιμῆς τοῦ χωρίου;» (<a href="https://bibleox.com/el/gr-lxx-byz/act/5/#L3">Πραξ 5:3</a>)</p></blockquote><blockquote><p>«καὶ δείπνου γινομένου, <strong>τοῦ διαβόλου ἤδη βεβληκότος εἰς τὴν καρδίαν ἵνα παραδοῖ αὐτὸν Ἰούδας Σίμωνος Ἰσκαριώτου</strong>,» (<a href="https://bibleox.com/el/gr-lxx-byz/in/13/#L2">Ιω 13:2</a>)</p></blockquote><h2>Ο Σατανάς έπεσε από τον ουρανό</h2><blockquote><p>«εἶπεν δὲ αὐτοῖς, Ἐθεώρουν <strong>τὸν Σατανᾶν ὡς ἀστραπὴν ἐκ τοῦ οὐρανοῦ πεσόντα</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/10/#L18">Λκ 10:18</a>; <a href="https://bibleox.com/el/gr-lxx-byz/iez/28/#L12-19">Ιεζ 28:12-19</a>)</p></blockquote><h2>Παρέσυρε μαζί του ορισμένους άλλους αγγέλους</h2><blockquote><p>«Εἰ γὰρ <strong>ὁ θεὸς ἀγγέλων ἁμαρτησάντων οὐκ ἐφείσατο</strong>, ἀλλὰ σιραῖς ζόφου ταρταρώσας παρέδωκεν εἰς κρίσιν τηρουμένους,» (<a href="https://bibleox.com/el/gr-lxx-byz/2pet/2/#L4">Β Πε 2:4</a>)</p></blockquote><h2>Λόγω του διαβόλου προέκυψε ο θάνατος στον κόσμο</h2><blockquote><p>«<strong>φθόνῳ δὲ διαβόλου θάνατος εἰσῆλθεν εἰς τὸν κόσμον</strong>, πειράζουσιν δὲ αὐτὸν οἱ τῆς ἐκείνου μερίδος ὄντες.» (<a href="https://bibleox.com/el/gr-lxx-byz/prs/2/#L24">Σ.Σολ 2:24</a>)</p></blockquote><h2>Ο διάβολος — αντίπαλος των ανθρώπων. Ψάχνει ποιον να παρασύρει στην απώλεια</h2><blockquote><p>«Νήψατε, γρηγορήσατε. <strong>ὁ ἀντίδικος ὑμῶν διάβολος</strong> ὡς λέων ὠρυόμενος περιπατεῖ <strong>ζητῶν [τινα] καταπιεῖν</strong>·» (<a href="https://bibleox.com/el/gr-lxx-byz/1pet/5/#L8">Α Πε 5:8</a>)</p></blockquote><h2> Ο διάβολος — αντίπαλος της ανθρώπινης σωτηρίας</h2><blockquote><p>«Ἔστιν δὲ αὕτη ἡ παραβολή· Ὁ σπόρος ἐστὶν ὁ λόγος τοῦ θεοῦ. οἱ δὲ παρὰ τὴν ὁδόν εἰσιν οἱ ἀκούσαντες, εἶτα <strong>ἔρχεται ὁ διάβολος καὶ αἴρει τὸν λόγον ἀπὸ τῆς καρδίας αὐτῶν</strong>, <strong>ἵνα μὴ πιστεύσαντες σωθῶσιν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/8/#L11-12">Λκ 8:11-12</a>)</p></blockquote><blockquote><p>«Καὶ ἔδειξέν μοι Ἰησοῦν τὸν ἱερέα τὸν μέγαν ἑστῶτα πρὸ προσώπου ἀγγέλου κυρίου, <strong>καὶ ὁ διάβολος εἱστήκει ἐκ δεξιῶν αὐτοῦ τοῦ ἀντικεῖσθαι αὐτῷ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/zah/3/#L1">Ζαχ 3:1</a>)</p></blockquote><h2>Ο διάβολος προσποιείται ότι είναι άγγελος του Θεού</h2><blockquote><p>«καὶ οὐ θαῦμα, <strong>αὐτὸς γὰρ ὁ Σατανᾶς μετασχηματίζεται εἰς ἄγγελον φωτός</strong>·» (<a href="https://bibleox.com/el/gr-lxx-byz/2kor/11/#L14">Β Κορ 11:14</a>)</p></blockquote><h2>Ο διάβολος φεύγει από εκείνους που υποτάσσονται στον Θεό και αποστρέφονται τον διάβολο</h2><blockquote><p>«<strong>ὑποτάγητε οὖν τῷ θεῷ· ἀντίστητε δὲ τῷ διαβόλῳ, καὶ φεύξεται ἀφ᾿ ὑμῶν</strong>·» (<a href="https://bibleox.com/el/gr-lxx-byz/iak/4/#L7">Ιακ 4:7</a>)</p></blockquote><h2>Ο διάβολος γνωρίζει την Αγία Γραφή και πειράζει με αυτήν, αλλοιώνοντας τα νοήματα</h2><blockquote><p>«Ἤγαγεν δὲ αὐτὸν εἰς Ἰερουσαλὴμ καὶ ἔστησεν ἐπὶ τὸ πτερύγιον τοῦ ἱεροῦ, καὶ εἶπεν αὐτῷ, Εἰ υἱὸς εἶ τοῦ θεοῦ, <strong>βάλε σεαυτὸν ἐντεῦθεν κάτω· γέγραπται</strong> γὰρ ὅτι Τοῖς ἀγγέλοις αὐτοῦ ἐντελεῖται περὶ σοῦ τοῦ διαφυλάξαι σε, καὶ ὅτι Ἐπὶ χειρῶν ἀροῦσίν σε μήποτε προσκόψῃς πρὸς λίθον τὸν πόδα σου. καὶ ἀποκριθεὶς εἶπεν αὐτῷ ὁ Ἰησοῦς ὅτι Εἴρηται, Οὐκ ἐκπειράσεις κύριον τὸν θεόν σου.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/4/#L9-12">Λκ 4:9-12</a>)</p></blockquote><h2>Ο διάβολος — πατέρας του ψεύδους</h2><blockquote><p>«ὑμεῖς ἐκ τοῦ πατρὸς τοῦ διαβόλου ἐστὲ καὶ τὰς ἐπιθυμίας τοῦ πατρὸς ὑμῶν θέλετε ποιεῖν. ἐκεῖνος ἀνθρωποκτόνος ἦν ἀπ᾿ ἀρχῆς, καὶ ἐν τῇ ἀληθείᾳ οὐκ ἔστηκεν, ὅτι <strong>οὐκ ἔστιν ἀλήθεια ἐν αὐτῷ</strong>. ὅταν λαλῇ τὸ ψεῦδος, ἐκ τῶν ἰδίων λαλεῖ, ὅτι <strong>ψεύστης ἐστὶν καὶ ὁ πατὴρ αὐτοῦ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/8/#L44">Ιω 8:44</a>)</p></blockquote><h2>Ο διάβολος μπορεί να κάνει θαύματα, να ρίξει φωτιά από τον ουρανό</h2><blockquote><p>«τότε <strong>εἶπεν ὁ κύριος τῷ διαβόλῳ Ἰδοὺ</strong> <strong>πάντα, ὅσα ἔστιν αὐτῷ, δίδωμι ἐν τῇ χειρί σου</strong>, ἀλλὰ αὐτοῦ μὴ ἅψῃ. καὶ ἐξῆλθεν ὁ διάβολος παρὰ τοῦ κυρίου. &lt;…&gt; Ἔτι τούτου λαλοῦντος ἦλθεν ἕτερος ἄγγελος καὶ εἶπεν πρὸς Ιωβ <strong>Πῦρ ἔπεσεν ἐκ τοῦ οὐρανοῦ καὶ κατέκαυσεν τὰ πρόβατα καὶ τοὺς ποιμένας κατέφαγεν</strong> ὁμοίως· καὶ σωθεὶς ἐγὼ μόνος ἦλθον τοῦ ἀπαγγεῖλαί σοι.» (<a href="https://bibleox.com/el/gr-lxx-byz/iov/1/#L12,16">Ιωβ 1:12,16</a>)</p></blockquote><blockquote><p>«οὗ ἐστιν ἡ παρουσία <strong>κατ᾿ ἐνέργειαν τοῦ Σατανᾶ ἐν πάσῃ δυνάμει καὶ σημείοις καὶ τέρασιν</strong> ψεύδους» (<a href="https://bibleox.com/el/gr-lxx-byz/2sol/2/#L9">Β Θεσ 2:9</a>)</p></blockquote><h2>Ο διάβολος μαλώνει με τους αγγέλους του Θεού</h2><blockquote><p>«ὁ δὲ Μιχαὴλ ὁ ἀρχάγγελος, ὅτε τῷ διαβόλῳ διακρινόμενος διελέγετο περὶ τοῦ Μωϋσέως σώματος, οὐκ ἐτόλμησεν κρίσιν ἐπενεγκεῖν βλασφημίας, ἀλλὰ εἶπεν, Ἐπιτιμήσαι σοι κύριος.» (<a href="https://bibleox.com/el/gr-lxx-byz/iud/1/#L9">Ιούδα 1:9</a>)</p></blockquote><h2>Για τους παραπεσόντες αγγέλους έχει ετοιμαστεί τόπος αιώνιας βασάνου</h2><blockquote><p>«Τότε ἐρεῖ καὶ τοῖς ἐξ εὐωνύμων, Πορεύεσθε ἀπ᾿ ἐμοῦ [οἱ] κατηραμένοι εἰς <strong>τὸ πῦρ τὸ αἰώνιον τὸ ἡτοιμασμένον τῷ διαβόλῳ καὶ τοῖς ἀγγέλοις αὐτοῦ</strong>·» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/25/#L41">Μτ 25:41</a>)</p></blockquote><blockquote><p>«καὶ <strong>ὁ διάβολος</strong> ὁ πλανῶν αὐτοὺς <strong>ἐβλήθη εἰς τὴν λίμνην τοῦ πυρὸς καὶ θείου</strong>, ὅπου καὶ τὸ θηρίον καὶ ὁ ψευδοπροφήτης, καὶ βασανισθήσονται ἡμέρας καὶ νυκτὸς εἰς τοὺς αἰῶνας τῶν αἰώνων.» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/20/#L10">Απ 20:10</a>)</p></blockquote><h3>Τα δαιμόνια το ξέρουν αυτό</h3><blockquote><p>«καὶ ἰδοὺ ἔκραξαν λέγοντες, Τί ἡμῖν καὶ σοί, υἱὲ τοῦ θεοῦ; ἦλθες ὧδε <strong>πρὸ καιροῦ βασανίσαι ἡμᾶς</strong>;» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/8/#L29">Μτ 8:29</a>)</p></blockquote><h2>Τα δαιμόνια δεν ζητούν ελεύθερα (προαιρετικά) το θέλημα του Θεού, αλλά δεν μπορούν να μην υποταχθούν στο προσταγμα του Θεού</h2><blockquote><p>«καὶ ἐθαμβήθησαν ἅπαντες, ὥστε συζητεῖν πρὸς ἑαυτοὺς λέγοντας, Τί ἐστιν τοῦτο; διδαχὴ καινὴ κατ᾿ ἐξουσίαν· <strong>καὶ τοῖς πνεύμασι τοῖς ἀκαθάρτοις ἐπιτάσσει, καὶ ὑπακούουσιν αὐτῷ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mk/1/#L27">Μκ 1:27</a>)</p></blockquote><blockquote><p>«οἱ δὲ δαίμονες παρεκάλουν αὐτὸν λέγοντες, <strong>Εἰ ἐκβάλλεις ἡμᾶς</strong>, ἀπόστειλον ἡμᾶς εἰς τὴν ἀγέλην τῶν χοίρων.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/8/#L31">Μτ 8:31</a>)</p></blockquote>'
