  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <h2>Οι άγγελοι — ασώματα πνεύματα</h2><blockquote><p>«πρὸς τίνα δὲ <strong><mark>τῶν ἀγγέλων</mark></strong> εἴρηκέν ποτε, Κάθου ἐκ δεξιῶν μου ἕως ἂν θῶ τοὺς ἐχθρούς σου ὑποπόδιον τῶν ποδῶν σου; <strong>οὐχὶ <mark>πάντες</mark> <mark>εἰσὶν</mark> λειτουργικὰ <mark>πνεύματα</mark></strong> εἰς διακονίαν ἀποστελλόμενα διὰ τοὺς μέλλοντας κληρονομεῖν σωτηρίαν;» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/1/#L13-14">Εβρ 1:13-14</a>)</p></blockquote><blockquote><p>«ἴδετε τὰς χεῖράς μου καὶ τοὺς πόδας μου ὅτι ἐγώ εἰμι αὐτός· ψηλαφήσατέ με καὶ ἴδετε, ὅτι <strong><mark>πνεῦμα σάρκα καὶ ὀστέα οὐκ ἔχει</mark></strong> καθὼς ἐμὲ θεωρεῖτε ἔχοντα.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/24/#L39">Λκ 24:39</a>)</p></blockquote><h2>Οι άγγελοι αποστέλλονται σε διακονία για τους σωζόμενους</h2><blockquote><p>«πρὸς τίνα δὲ <strong><mark>τῶν ἀγγέλων</mark></strong> εἴρηκέν ποτε, Κάθου ἐκ δεξιῶν μου ἕως ἂν θῶ τοὺς ἐχθρούς σου ὑποπόδιον τῶν ποδῶν σου; οὐχὶ πάντες <strong><mark>εἰσὶν λειτουργικὰ πνεύματα εἰς διακονίαν ἀποστελλόμενα διὰ τοὺς μέλλοντας κληρονομεῖν σωτηρίαν</mark></strong>;» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/1/#L13-14">Εβρ 1:13-14</a>)</p></blockquote><h2>Οι άγγελοι είναι με τους φοβουμένους τον Θεό</h2><blockquote><p>«παρεμβαλεῖ <strong><mark>ἄγγελος κυρίου</mark> κύκλῳ τῶν φοβουμένων αὐτὸν καὶ <mark>ῥύσεται αὐτούς</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/33/#L7">Ψλ 33:7</a>)</p></blockquote><blockquote><p>«<strong>Ὁ κατοικῶν ἐν βοηθείᾳ τοῦ ὑψίστου</strong> ἐν σκέπῃ τοῦ θεοῦ τοῦ οὐρανοῦ αὐλισθήσεται. ἐρεῖ τῷ κυρίῳ Ἀντιλήμπτωρ μου εἶ καὶ καταφυγή μου, ὁ θεός μου, ἐλπιῶ ἐπ᾿ αὐτόν, ὅτι αὐτὸς ῥύσεταί με ἐκ παγίδος θηρευτῶν καὶ ἀπὸ λόγου ταραχώδους. &lt;…&gt; ὅτι σύ, κύριε, ἡ ἐλπίς μου· <strong>τὸν ὕψιστον ἔθου καταφυγήν σου. οὐ προσελεύσεται πρὸς σὲ κακά</strong>, καὶ μάστιξ οὐκ ἐγγιεῖ τῷ σκηνώματί σου, <strong><mark>ὅτι τοῖς ἀγγέλοις αὐτοῦ ἐντελεῖται περὶ σοῦ τοῦ διαφυλάξαι σε</mark></strong> ἐν πάσαις ταῖς ὁδοῖς σου·» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/90/#L1-3,9-11">Ψλ 90:1-3,9-11</a>)</p></blockquote><h2>Οι άγγελοι των πιστών</h2><blockquote><p>«Ὁρᾶτε μὴ καταφρονήσητε ἑνὸς τῶν μικρῶν τούτων· λέγω γὰρ ὑμῖν ὅτι <strong><mark>οἱ ἄγγελοι αὐτῶν ἐν οὐρανοῖς</mark></strong> διὰ παντὸς βλέπουσι τὸ πρόσωπον τοῦ πατρός μου τοῦ ἐν οὐρανοῖς.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/18/#L10">Μτ 18:10</a>)</p></blockquote><h2>Οι άγγελοι παραλαμβάνουν τις ψυχές των δικαίων στη ζωή μετά θάνατον</h2><blockquote><p>«ἐγένετο δὲ ἀποθανεῖν τὸν πτωχὸν καὶ <strong><mark>ἀπενεχθῆναι αὐτὸν ὑπὸ τῶν ἀγγέλων</mark></strong> εἰς τὸν κόλπον Ἀβραάμ· ἀπέθανεν δὲ καὶ ὁ πλούσιος καὶ ἐτάφη.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/16/#L22">Λκ 16:22</a>)</p></blockquote><h2>Η πίστη των δικαίων της Παλαιάς Διαθήκης και των χριστιανών στους αγγέλους</h2><blockquote><p>«<strong>ἄγγελος δὲ κυρίου συγκατέβη</strong> <strong>ἅμα τοῖς περὶ τὸν Αζαριαν εἰς τὴν κάμινον</strong> <strong>καὶ ἐξετίναξε τὴν φλόγα τοῦ πυρὸς ἐκ τῆς καμίνου</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/dan/3/#L49">Δν 3:49</a>)</p></blockquote><blockquote><p>«καὶ ἐπιγνοῦσα τὴν φωνὴν τοῦ Πέτρου ἀπὸ τῆς χαρᾶς οὐκ ἤνοιξεν τὸν πυλῶνα, εἰσδραμοῦσα δὲ ἀπήγγειλεν ἑστάναι τὸν Πέτρον πρὸ τοῦ πυλῶνος. οἱ δὲ πρὸς αὐτὴν εἶπαν, Μαίνῃ. ἡ δὲ διϊσχυρίζετο οὕτως ἔχειν. οἱ δὲ ἔλεγον, <strong>Ὁ ἄγγελός ἐστιν αὐτοῦ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/12/#L14-15">Πραξ 12:14-15</a>)</p></blockquote><h2>Οι άγγελοι του Κυρίου και του Θεού Ιησού Χριστού (ως ανθρώπου)</h2><h3>Ο Ιησούς Χριστός, ως άνθρωπος, ενισχυόταν από αγγέλους</h3><blockquote><p>«Τότε ἀφίησιν αὐτὸν ὁ διάβολος, καὶ ἰδοὺ <strong>ἄγγελοι προσῆλθον καὶ διηκόνουν αὐτῷ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/4/#L11">Μτ 4:11</a>)</p></blockquote><h3>Τον Χριστό μαρτυρούν οι δύο άγγελοι φύλακές Του</h3><h4>Ταυτόχρονα δύο άγγελοι</h4><blockquote><p>«Μαρία δὲ εἱστήκει πρὸς τῷ μνημείῳ ἔξω κλαίουσα. ὡς οὖν ἔκλαιεν παρέκυψεν εἰς τὸ μνημεῖον, καὶ θεωρεῖ <strong>δύο ἀγγέλους ἐν λευκοῖς καθεζομένους, ἕνα πρὸς τῇ κεφαλῇ καὶ ἕνα πρὸς τοῖς ποσίν</strong>, ὅπου ἔκειτο τὸ σῶμα τοῦ Ἰησοῦ.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/20/#L11-12">Ιω 20:11-12</a>)</p></blockquote><blockquote><p>«εἰσελθοῦσαι δὲ οὐχ εὗρον τὸ σῶμα τοῦ [κυρίου] Ἰησοῦ καὶ ἐγένετο ἐν τῷ ἀπορεῖσθαι αὐτὰς περὶ τούτου καὶ ἰδοὺ <strong>ἄνδρες δύο ἐπέστησαν αὐταῖς ἐν ἐσθῆτι ἀστραπτούσῃ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/24/#L3-4">Λκ 24:3-4</a>)</p></blockquote><blockquote><p>«καὶ ὡς ἀτενίζοντες ἦσαν εἰς τὸν οὐρανὸν πορευομένου αὐτοῦ, καὶ ἰδοὺ <strong>ἄνδρες δύο παρειστήκεισαν αὐτοῖς ἐν ἐσθήσεσι λευκαῖς</strong>,» (<a href="https://bibleox.com/el/gr-lxx-byz/act/1/#L10">Πραξ 1:10</a>)</p></blockquote><h4>Ένας άγγελος έξω από τον τάφο</h4><blockquote><p>«καὶ ἰδοὺ σεισμὸς ἐγένετο μέγας· <strong>ἄγγελος</strong> γὰρ κυρίου καταβὰς ἐξ οὐρανοῦ καὶ προσελθὼν <strong>ἀπεκύλισεν τὸν λίθον καὶ ἐκάθητο ἐπάνω αὐτοῦ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/28/#L2">Μτ 28:2</a>)</p></blockquote><h4>Ένας άγγελος μέσα στον τάφο</h4><blockquote><p>«καὶ εἰσελθοῦσαι <strong>εἰς τὸ μνημεῖον εἶδον νεανίσκον</strong> καθήμενον ἐν τοῖς δεξιοῖς <strong>περιβεβλημένον στολὴν λευκήν</strong>, καὶ ἐξεθαμβήθησαν.» (<a href="https://bibleox.com/el/gr-lxx-byz/mk/16/#L5">Μκ 16:5</a>)</p></blockquote><h2>Άγγελος ελευθερώνει τον απόστολο</h2><blockquote><p>«καὶ ἰδοὺ <strong>ἄγγελος κυρίου ἐπέστη, καὶ φῶς ἔλαμψεν ἐν τῷ οἰκήματι· πατάξας δὲ τὴν πλευρὰν τοῦ Πέτρου ἤγειρεν αὐτὸν λέγων, Ἀνάστα ἐν τάχει</strong>. καὶ ἐξέπεσαν αὐτοῦ αἱ ἁλύσεις ἐκ τῶν χειρῶν. εἶπεν δὲ ὁ ἄγγελος πρὸς αὐτόν, Ζῶσαι καὶ ὑπόδησαι τὰ σανδάλιά σου. ἐποίησεν δὲ οὕτως. καὶ λέγει αὐτῷ, Περιβαλοῦ τὸ ἱμάτιόν σου καὶ ἀκολούθει μοι. καὶ ἐξελθὼν ἠκολούθει, καὶ οὐκ ᾔδει ὅτι ἀληθές ἐστιν τὸ γινόμενον διὰ τοῦ ἀγγέλου, ἐδόκει δὲ ὅραμα βλέπειν. διελθόντες δὲ πρώτην φυλακὴν καὶ δευτέραν ἦλθαν ἐπὶ τὴν πύλην τὴν σιδηρᾶν τὴν φέρουσαν εἰς τὴν πόλιν, ἥτις αὐτομάτη ἠνοίγη αὐτοῖς, καὶ ἐξελθόντες προῆλθον ῥύμην μίαν, καὶ εὐθέως ἀπέστη ὁ ἄγγελος ἀπ᾿ αὐτοῦ. καὶ ὁ Πέτρος ἐν ἑαυτῷ γενόμενος εἶπεν, Νῦν οἶδα ἀληθῶς ὅτι ἐξαπέστειλεν [ὁ] κύριος τὸν ἄγγελον αὐτοῦ καὶ ἐξείλατό με ἐκ χειρὸς Ἡρῴδου καὶ πάσης τῆς προσδοκίας τοῦ λαοῦ τῶν Ἰουδαίων. συνιδών τε ἦλθεν ἐπὶ τὴν οἰκίαν τῆς Μαρίας τῆς μητρὸς Ἰωάννου τοῦ ἐπικαλουμένου Μάρκου, οὗ ἦσαν ἱκανοὶ συνηθροισμένοι καὶ προσευχόμενοι. κρούσαντος δὲ αὐτοῦ τὴν θύραν τοῦ πυλῶνος προσῆλθεν παιδίσκη ὑπακοῦσαι ὀνόματι Ῥόδη· καὶ ἐπιγνοῦσα τὴν φωνὴν τοῦ Πέτρου ἀπὸ τῆς χαρᾶς οὐκ ἤνοιξεν τὸν πυλῶνα, εἰσδραμοῦσα δὲ ἀπήγγειλεν ἑστάναι τὸν Πέτρον πρὸ τοῦ πυλῶνος. οἱ δὲ πρὸς αὐτὴν εἶπαν, Μαίνῃ. ἡ δὲ διϊσχυρίζετο οὕτως ἔχειν. οἱ δὲ ἔλεγον, <strong>Ὁ ἄγγελός ἐστιν αὐτοῦ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/12/#L7-15">Πραξ 12:7-15</a>)</p></blockquote>
