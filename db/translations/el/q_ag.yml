  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: '<h2>Ορισμός</h2><p><strong>Χάρις (αρχαιοελληνικά</strong> <strong>χάρις, εβραϊκά חֵ֣ן) </strong>—<strong> </strong>στην κύρια σημασία είναι η θεία δύναμη που ενεργεί στον άνθρωπο με σκοπό τη σωτηρία του.</p><ol><li><p><strong>Δύναμη του Θεού,</strong> <strong>ενέργεια του Θεού</strong> (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/15/#L10">Α Κορ 15:10</a> - <u>χάριτι</u> δὲ θεοῦ εἰμι ὅ εἰμι, καὶ ἡ <u>χάρις αὐτοῦ ἡ εἰς ἐμὲ</u> οὐ κενὴ ἐγενήθη, ἀλλὰ περισσότερον αὐτῶν πάντων ἐκοπίασα, οὐκ ἐγὼ δὲ ἀλλὰ ἡ <u>χάρις τοῦ θεοῦ</u> [ἡ] σὺν ἐμοί).</p></li><li><p><strong>Έλεος, ευσπλαχνία, δωρεά, εύνοια προς κάποιον, αγάπη προς κάποιον</strong> (<a href="https://bibleox.com/el/gr-lxx-byz/gen/18/#L3">Γεν 18:3</a> - ἄρα εὗρον <u>χάριν</u> ἐναντίον σου), (<a href="https://bibleox.com/el/gr-lxx-byz/sud/6/#L17">Κρ 6:17</a> - εἰ εὗρον <u>χάριν</u> ἐν ὀφθαλμοῖς σου), (<a href="https://bibleox.com/el/gr-lxx-byz/1ts/16/#L22">Α Βασ 16:22</a> - εὗρεν <u>χάριν</u> ἐν ὀφθαλμοῖς μου) (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/11/#L19">Γ Βασ 11:19</a> - καὶ εὗρεν Αδερ <u>χάριν</u> ἐναντίον Φαραω), (<a href="https://bibleox.com/el/gr-lxx-byz/act/2/#L47">Πραξ 2:47</a> - ἔχοντες <u>χάριν</u> πρὸς ὅλον τὸν λαόν), (<a href="https://bibleox.com/el/gr-lxx-byz/act/7/#L46">Πραξ 7:46</a> - ὃς εὗρεν <u>χάριν</u> ἐνώπιον τοῦ θεοῦ), (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/16/#L3">Α Κορ 16:3</a> - ἀπενεγκεῖν τὴν <u>χάριν</u> ὑμῶν εἰς Ἰερουσαλήμ).</p></li><li><p><strong>Ευχαριστία προς τον Θεό, θεάρεστη ζωή</strong> (<a href="https://bibleox.com/el/gr-lxx-byz/2kor/9/#L15">Β Κορ 9:15</a> - <u>χάρις τῷ θεῷ</u> ἐπὶ τῇ ἀνεκδιηγήτῳ αὐτοῦ δωρεᾷ), (<a href="https://bibleox.com/el/gr-lxx-byz/1pet/2/#L19">Α Πε 2:19</a> - τοῦτο γὰρ <u>χάρις</u> εἰ διὰ συνείδησιν θεοῦ ὑποφέρει τις λύπας …).</p></li><li><p><strong>Ομορφιά</strong> (<a href="https://bibleox.com/el/gr-lxx-byz/pr/5/#L19">Πρμ 5:19</a> - πῶλος σῶν <u>χαρίτων</u>), (<a href="https://bibleox.com/el/gr-lxx-byz/pr/3/#L22">Πρμ 3:22</a> - <u>χάρις</u> ᾖ περὶ σῷ τραχήλῳ).</p></li><li><p><strong>Πολύτιμο πράγμα</strong> (<a href="https://bibleox.com/el/gr-lxx-byz/pr/17/#L8">Πρμ 17:8</a> - εβραϊκά: אֶבֶן <u>חֵן</u> — «πολύτιμη πέτρα»· στα Ο΄ ο στίχος δεν αναφέρει πολύτιμο λίθο), (<a href="https://bibleox.com/el/gr-lxx-byz/ekl/10/#L12">Εκ 10:12</a> - λόγοι στόματος σοφοῦ <u>χάρις</u>), (<a href="https://bibleox.com/el/gr-lxx-byz/ps/44/#L2">Ψλ 44:2</a> - ἐξεχύθη χάρις ἐν χείλεσίν σου).</p></li><li><p><strong>Σεβασμός, τιμή, δόξα</strong> (<a href="https://bibleox.com/el/gr-lxx-byz/iudf/8/#L23">Ιουδιθ 8:23</a> - κατευθυνθήσεται ἡ δουλεία ἡμῶν εἰς <u>χάριν</u>).</p></li></ol><h2>Η προσκαλούσα ενέργεια της χάριτος</h2><blockquote><p>«Θαυμάζω ὅτι οὕτως ταχέως μετατίθεσθε ἀπὸ <strong><mark>τοῦ καλέσαντος ὑμᾶς ἐν χάριτι</mark></strong> [Χριστοῦ] εἰς ἕτερον εὐαγγέλιον» (<a href="https://bibleox.com/el/gr-lxx-byz/gal/1/#L6">Γαλ 1:6</a>)</p></blockquote><blockquote><p>«ὅτε δὲ εὐδόκησεν <strong>ὁ ἀφορίσας με</strong> ἐκ κοιλίας μητρός μου καὶ <strong><mark>καλέσας διὰ τῆς χάριτος αὐτοῦ</mark></strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/gal/1/#L15">Γαλ 1:15</a>)</p></blockquote><h2>Η χάρις ως θείο δώρο</h2><blockquote><p><mark>«</mark><strong><mark>ἡ χάρις</mark></strong> τοῦ κυρίου Ἰησοῦ <strong><mark>μεθ᾿ ὑμῶν</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/16/#L23">Α Κορ 16:23</a>)</p></blockquote><blockquote><p>«<strong><mark>χάρις ὑμῖν</mark></strong> καὶ εἰρήνη <strong>ἀπὸ θεοῦ</strong> πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.» (<a href="https://bibleox.com/el/gr-lxx-byz/2kor/1/#L2">Β Κορ 1:2</a>)</p></blockquote><blockquote><p>«ἀλλὰ <strong><mark>λήμψεσθε δύναμιν</mark></strong> <strong>ἐπελθόντος τοῦ ἁγίου πνεύματος ἐφ᾿ ὑμᾶς</strong>, καὶ ἔσεσθέ μου μάρτυρες ἔν τε Ἰερουσαλὴμ καὶ ἐν πάσῃ τῇ Ἰουδαίᾳ καὶ Σαμαρείᾳ καὶ ἕως ἐσχάτου τῆς γῆς.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/1/#L8">Πραξ 1:8</a>)</p></blockquote><blockquote><p>«Χάριν ἔχω <strong><mark>τῷ ἐνδυναμώσαντί με</mark></strong> Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν, ὅτι πιστόν με ἡγήσατο θέμενος εἰς διακονίαν» (<a href="https://bibleox.com/el/gr-lxx-byz/1tim/1/#L12">Α Τιμ 1:12</a>)</p></blockquote><blockquote><p>«οὗ ἐγενήθην διάκονος κατὰ τὴν <strong><mark>δωρεὰν τῆς χάριτος τοῦ θεοῦ τῆς δοθείσης μοι κατὰ τὴν ἐνέργειαν τῆς δυνάμεως αὐτοῦ</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/3/#L7">Εφ 3:7</a>)</p></blockquote><blockquote><p>«<strong>Ἑνὶ δὲ ἑκάστῳ ἡμῶν <mark>ἐδόθη ἡ χάρις</mark></strong> κατὰ τὸ μέτρον τῆς δωρεᾶς τοῦ Χριστοῦ.» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/4/#L7">Εφ 4:7</a>)</p></blockquote><blockquote><p>«καὶ αὐτῶν δεήσει ὑπὲρ ὑμῶν ἐπιποθούντων ὑμᾶς διὰ <strong><mark>τὴν ὑπερβάλλουσαν χάριν τοῦ θεοῦ ἐφ᾿ ὑμῖν</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/2kor/9/#L14">Β Κορ 9:14</a>)</p></blockquote><blockquote><p>«<strong><mark>δυνατεῖ δὲ ὁ θεὸς πᾶσαν χάριν περισσεῦσαι εἰς ὑμᾶς</mark></strong>, ἵνα ἐν παντὶ πάντοτε πᾶσαν αὐτάρκειαν ἔχοντες περισσεύητε εἰς πᾶν ἔργον ἀγαθόν» (<a href="https://bibleox.com/el/gr-lxx-byz/2kor/9/#L8">Β Κορ 9:8</a>)</p></blockquote><blockquote><p>«καὶ τῇ ὑπερβολῇ τῶν ἀποκαλύψεων. διό, ἵνα μὴ ὑπεραίρωμαι, ἐδόθη μοι σκόλοψ τῇ σαρκί, ἄγγελος Σατανᾶ, ἵνα με κολαφίζῃ, ἵνα μὴ ὑπεραίρωμαι. ὑπὲρ τούτου τρὶς τὸν κύριον παρεκάλεσα ἵνα ἀποστῇ ἀπ᾿ ἐμοῦ· καὶ εἴρηκέν μοι, <strong><mark>Ἀρκεῖ σοι ἡ χάρις</mark> μου· ἡ γὰρ δύναμις ἐν ἀσθενείᾳ τελεῖται</strong>. ἥδιστα οὖν μᾶλλον καυχήσομαι ἐν ταῖς ἀσθενείαις μου, <strong><mark>ἵνα ἐπισκηνώσῃ ἐπ᾿ ἐμὲ ἡ δύναμις</mark> τοῦ Χριστοῦ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/2kor/12/#L7-9">Β Κορ 12:7-9</a>)</p></blockquote><blockquote><p>«Συνεργοῦντες δὲ καὶ παρακαλοῦμεν <strong><mark>μὴ εἰς κενὸν τὴν χάριν τοῦ θεοῦ δέξασθαι ὑμᾶς</mark></strong> —» (<a href="https://bibleox.com/el/gr-lxx-byz/2kor/6/#L1">Β Κορ 6:1</a>)</p></blockquote><blockquote><p>«χάριτι δὲ θεοῦ εἰμι ὅ εἰμι, καὶ <strong><mark>ἡ χάρις αὐτοῦ ἡ εἰς ἐμὲ</mark> οὐ κενὴ ἐγενήθη</strong>, ἀλλὰ <strong>περισσότερον αὐτῶν πάντων ἐκοπίασα, οὐκ ἐγὼ δὲ ἀλλὰ <mark>ἡ χάρις τοῦ θεοῦ [ἡ] σὺν ἐμοί</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/15/#L10">Α Κορ 15:10</a>)</p></blockquote><blockquote><p>«Πέτρος δὲ πρὸς αὐτούς, Μετανοήσατε, καὶ βαπτισθήτω ἕκαστος ὑμῶν ἐπὶ τῷ ὀνόματι Ἰησοῦ Χριστοῦ εἰς ἄφεσιν τῶν ἁμαρτιῶν ὑμῶν, καὶ <strong><mark>λήμψεσθε τὴν δωρεὰν τοῦ ἁγίου πνεύματος</mark></strong>·» (<a href="https://bibleox.com/el/gr-lxx-byz/act/2/#L38">Πραξ 2:38</a>)</p></blockquote><blockquote><p>«ὁ δὲ βεβαιῶν ἡμᾶς σὺν ὑμῖν εἰς Χριστὸν καὶ χρίσας ἡμᾶς θεός, ὁ καὶ σφραγισάμενος ἡμᾶς καὶ <strong><mark>δοὺς</mark></strong><mark> </mark><strong><mark>τὸν ἀρραβῶνα τοῦ πνεύματος</mark> ἐν ταῖς καρδίαις ἡμῶν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/2kor/1/#L21-22">Β Κορ 1:21-22</a>)</p></blockquote><blockquote><p>«ὑμεῖς δὲ οὐκ ἐστὲ ἐν σαρκὶ ἀλλὰ ἐν πνεύματι, εἴπερ <strong><mark>πνεῦμα θεοῦ οἰκεῖ ἐν ὑμῖν</mark></strong>. εἰ δέ τις πνεῦμα Χριστοῦ οὐκ ἔχει, οὗτος οὐκ ἔστιν αὐτοῦ.» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/8/#L9">Ρωμ 8:9</a>)</p></blockquote><blockquote><p>«οὐκ οἴδατε ὅτι ναὸς θεοῦ ἐστε καὶ <strong>τὸ πνεῦμα τοῦ θεοῦ οἰκεῖ ἐν ὑμῖν</strong>;» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/3/#L16">Α Κορ 3:16</a>)</p></blockquote><blockquote><p><em>«οὐ γὰρ ἐλάβετε πνεῦμα δουλείας πάλιν εἰς φόβον, ἀλλὰ </em><strong><em><mark>ἐλάβετε πνεῦμα</mark> υἱοθεσίας, <mark>ἐν ᾧ κράζομεν</mark>, Αββα ὁ πατήρ</em></strong><em>·» (</em><a href="https://bibleox.com/el/gr-lxx-byz/rim/8/#L15"><em>Ρωμ 8:15</em></a><em>)</em></p></blockquote><blockquote><p><em>«Ὅτι δέ ἐστε υἱοί, </em><strong><em>ἐξαπέστειλεν ὁ θεὸς <mark>τὸ πνεῦμα τοῦ υἱοῦ αὐτοῦ εἰς τὰς καρδίας ἡμῶν</mark>, <mark>κρᾶζον</mark>, Αββα ὁ πατήρ</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/gal/4/#L6"><em>Γαλ 4:6</em></a><em>)</em></p></blockquote><blockquote><p>«καὶ ὑμεῖς <strong><mark>τὸ χρῖσμα</mark></strong> ὃ <strong><mark>ἐλάβετε</mark> ἀπ᾿ αὐτοῦ <mark>μένει ἐν ὑμῖν</mark></strong>, καὶ οὐ χρείαν ἔχετε ἵνα τις διδάσκῃ ὑμᾶς· ἀλλ᾿ ὡς <strong><mark>τὸ αὐτοῦ χρῖσμα διδάσκει ὑμᾶς</mark></strong> περὶ πάντων, καὶ ἀληθές ἐστιν καὶ οὐκ ἔστιν ψεῦδος, καὶ καθὼς ἐδίδαξεν ὑμᾶς, μένετε ἐν αὐτῷ.» (<a href="https://bibleox.com/el/gr-lxx-byz/1in/2/#L27">Α Ιω 2:27</a>)</p></blockquote><blockquote><p>«Συνεργοῦντες δὲ καὶ παρακαλοῦμεν <strong>μὴ εἰς κενὸν <mark>τὴν χάριν</mark> τοῦ θεοῦ <mark>δέξασθαι ὑμᾶς</mark></strong> —» (<a href="https://bibleox.com/el/gr-lxx-byz/2kor/6/#L1">Β Κορ 6:1</a>)</p></blockquote><blockquote><p>«ἡμεῖς γὰρ ναὸς θεοῦ ἐσμεν ζῶντος· καθὼς εἶπεν ὁ θεὸς ὅτι <strong><mark>Ἐνοικήσω ἐν αὐτοῖς καὶ ἐμπεριπατήσω</mark></strong>, καὶ ἔσομαι αὐτῶν θεός, καὶ αὐτοὶ ἔσονταί μου λαός.» (<a href="https://bibleox.com/el/gr-lxx-byz/2kor/6/#L16">Β Κορ 6:16</a>)</p></blockquote><blockquote><p>«ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ, Ἐάν τις ἀγαπᾷ με τὸν λόγον μου τηρήσει, καὶ ὁ πατήρ μου ἀγαπήσει αὐτόν, καὶ <strong><mark>πρὸς αὐτὸν ἐλευσόμεθα καὶ μονὴν παρ᾿ αὐτῷ ποιησόμεθα</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/14/#L23">Ιω 14:23</a>)</p></blockquote><blockquote><p>«<strong><mark>καλὸν γὰρ χάριτι βεβαιοῦσθαι τὴν καρδίαν</mark></strong>, οὐ βρώμασιν, ἐν οἷς οὐκ ὠφελήθησαν οἱ περιπατοῦντες.» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/13/#L9">Εβρ 13:9</a>)</p></blockquote><blockquote><p>«Διὸ βασιλείαν ἀσάλευτον παραλαμβάνοντες <strong><mark>ἔχωμεν χάριν</mark>, δι᾿ ἧς λατρεύωμεν</strong> εὐαρέστως τῷ θεῷ μετὰ εὐλαβείας καὶ δέους·» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/12/#L28">Εβρ 12:28</a>)</p></blockquote><blockquote><p>«Καὶ <strong>προσέφερον</strong> αὐτῷ παιδία <strong>ἵνα αὐτῶν ἅψηται</strong>· οἱ δὲ μαθηταὶ ἐπετίμησαν αὐτοῖς. ἰδὼν δὲ ὁ Ἰησοῦς ἠγανάκτησεν καὶ εἶπεν αὐτοῖς, Ἄφετε τὰ παιδία ἔρχεσθαι πρός με, μὴ κωλύετε αὐτά, τῶν γὰρ τοιούτων ἐστὶν ἡ βασιλεία τοῦ θεοῦ. &lt;…&gt; καὶ <strong>ἐναγκαλισάμενος</strong> αὐτὰ <strong><mark>κατευλόγει τιθεὶς τὰς χεῖρας ἐπ᾿ αὐτά</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mk/10/#L13-14,16">Μκ 10:13-14,16</a>)</p></blockquote><blockquote><p>«Ἐξήγαγεν δὲ αὐτοὺς [ἔξω] ἕως πρὸς Βηθανίαν, καὶ <strong><mark>ἐπάρας τὰς χεῖρας αὐτοῦ εὐλόγησεν αὐτούς</mark></strong>. καὶ ἐγένετο ἐν τῷ εὐλογεῖν αὐτὸν αὐτοὺς διέστη ἀπ᾿ αὐτῶν καὶ ἀνεφέρετο εἰς τὸν οὐρανόν.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/24/#L50-51">Λκ 24:50-51</a>)</p></blockquote><h2>Η ενέργεια της χάριτος μέσω των ανθρώπων</h2><blockquote><p>«ἔχω οὖν [τὴν] καύχησιν ἐν Χριστῷ Ἰησοῦ τὰ πρὸς τὸν θεόν· οὐ γὰρ τολμήσω τι λαλεῖν ὧν οὐ <strong><mark>κατειργάσατο</mark> Χριστὸς <mark>δι᾿ ἐμοῦ</mark></strong> εἰς ὑπακοὴν ἐθνῶν, λόγῳ καὶ ἔργῳ, <strong><mark>ἐν δυνάμει</mark></strong> σημείων καὶ τεράτων, <strong><mark>ἐν δυνάμει πνεύματος</mark></strong>· ὥστε με ἀπὸ Ἰερουσαλὴμ καὶ κύκλῳ μέχρι τοῦ Ἰλλυρικοῦ πεπληρωκέναι τὸ εὐαγγέλιον τοῦ Χριστοῦ» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/15/#L17-19">Ρωμ 15:17-19</a>)</p></blockquote><blockquote><p>«δι᾿ ἣν αἰτίαν ἀναμιμνῄσκω σε ἀναζωπυρεῖν <strong><mark>τὸ χάρισμα τοῦ θεοῦ</mark></strong>, ὅ ἐστιν <strong>ἐν σοὶ <mark>διὰ τῆς ἐπιθέσεως τῶν χειρῶν μου</mark></strong>·» (<a href="https://bibleox.com/el/gr-lxx-byz/2tim/1/#L6">Β Τιμ 1:6</a>)</p></blockquote><p>Έλαβαν χάριν για να φέρουν τα έθνη στην υπακοή της πίστεως:</p><blockquote><p>«δι᾿ οὗ <strong><mark>ἐλάβομεν χάριν</mark></strong> καὶ <strong>ἀποστολὴν</strong> <strong><mark>εἰς</mark></strong> <strong><mark>ὑπακοὴν πίστεως ἐν πᾶσιν τοῖς ἔθνεσιν</mark></strong> ὑπὲρ τοῦ ὀνόματος αὐτοῦ» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/1/#L5">Ρωμ 1:5</a>)</p></blockquote><blockquote><p>«πᾶς <strong>λόγος</strong> σαπρὸς ἐκ τοῦ στόματος ὑμῶν μὴ ἐκπορευέσθω, ἀλλὰ εἴ τις <strong>ἀγαθὸς</strong> πρὸς οἰκοδομὴν τῆς χρείας, ἵνα <strong>δῷ χάριν τοῖς ἀκούουσιν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/4/#L29">Εφ 4:29</a>)</p></blockquote><blockquote><p>«<strong>ὁ λόγος ὑμῶν πάντοτε ἐν χάριτι</strong>, ἅλατι ἠρτυμένος, εἰδέναι πῶς δεῖ ὑμᾶς ἑνὶ ἑκάστῳ ἀποκρίνεσθαι.» (<a href="https://bibleox.com/el/gr-lxx-byz/kol/4/#L6">Κολ 4:6</a>)</p></blockquote><h2>Η χάρις δίνεται στους ταπεινούς</h2><blockquote><p>«κύριος ὑπερηφάνοις ἀντιτάσσεται, <strong><mark>ταπεινοῖς δὲ δίδωσιν χάριν</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/pr/3/#L34">Πρμ 3:34</a>)</p></blockquote><blockquote><p>«μείζονα δὲ δίδωσιν χάριν· διὸ λέγει, Ὁ θεὸς ὑπερηφάνοις ἀντιτάσσεται, <strong><mark>ταπεινοῖς δὲ δίδωσιν χάριν</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/iak/4/#L6">Ιακ 4:6</a>)</p></blockquote><blockquote><p>«Ὁμοίως, νεώτεροι, ὑποτάγητε πρεσβυτέροις. πάντες δὲ ἀλλήλοις τὴν ταπεινοφροσύνην ἐγκομβώσασθε, ὅτι Ὁ θεὸς ὑπερηφάνοις ἀντιτάσσεται, <strong><mark>ταπεινοῖς δὲ δίδωσιν χάριν</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1pet/5/#L5">Α Πε 5:5</a>)</p></blockquote><h2>Η ανάγκη να αναζωπυρώνουμε τη χάριν</h2><blockquote><p>«δι᾿ ἣν αἰτίαν <strong><mark>ἀναμιμνῄσκω σε ἀναζωπυρεῖν τὸ χάρισμα τοῦ θεοῦ</mark></strong>, ὅ ἐστιν ἐν σοὶ διὰ τῆς ἐπιθέσεως τῶν χειρῶν μου·» (<a href="https://bibleox.com/el/gr-lxx-byz/2tim/1/#L6">Β Τιμ 1:6</a>)</p></blockquote>'
