  update: true
  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <ol><li><p><strong>Αγιότητα</strong> — ο πλήρης χωρισμός ενός πράγματος για έναν μόνο σκοπό.</p></li><li><p><strong>Αγιότητα</strong> — τρόπος ζωής αφιερωμένος στον Θεό.</p></li><li><p><strong>Άγιος</strong> — αυτός που ζει χωρίς αμαρτία, σύμφωνα με το θέλημα του Θεού.</p></li></ol><blockquote><p>«ὃ γὰρ ἀπέθανεν, <strong>τῇ ἁμαρτίᾳ ἀπέθανεν ἐφάπαξ· ὃ δὲ ζῇ, ζῇ τῷ θεῷ</strong>. οὕτως καὶ ὑμεῖς <strong>λογίζεσθε ἑαυτοὺς [εἶναι] νεκροὺς μὲν τῇ ἁμαρτίᾳ ζῶντας δὲ τῷ θεῷ</strong> ἐν Χριστῷ Ἰησοῦ. <strong>Μὴ οὖν βασιλευέτω ἡ ἁμαρτία ἐν τῷ θνητῷ ὑμῶν σώματι</strong> εἰς τὸ ὑπακούειν ταῖς ἐπιθυμίαις αὐτοῦ, <strong>μηδὲ παριστάνετε τὰ μέλη ὑμῶν ὅπλα ἀδικίας τῇ ἁμαρτίᾳ</strong>, ἀλλὰ παραστήσατε ἑαυτοὺς τῷ θεῷ ὡσεὶ ἐκ νεκρῶν ζῶντας καὶ τὰ μέλη ὑμῶν ὅπλα δικαιοσύνης τῷ θεῷ· &lt;…&gt; ἐλευθερωθέντες δὲ ἀπὸ τῆς ἁμαρτίας ἐδουλώθητε τῇ δικαιοσύνῃ· &lt;…&gt; νυνὶ δέ, <strong>ἐλευθερωθέντες ἀπὸ τῆς ἁμαρτίας δουλωθέντες δὲ τῷ θεῷ, ἔχετε τὸν καρπὸν ὑμῶν εἰς ἁγιασμόν</strong>, τὸ δὲ τέλος ζωὴν αἰώνιον.» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/6/#L10-13,18,22">Ρωμ 6:10-13,18,22</a>)</p></blockquote><blockquote><p>«Πᾶς ὁ γεγεννημένος ἐκ τοῦ θεοῦ ἁμαρτίαν οὐ ποιεῖ, ὅτι σπέρμα αὐτοῦ ἐν αὐτῷ μένει· καὶ <strong>οὐ δύναται ἁμαρτάνειν</strong>, ὅτι ἐκ τοῦ θεοῦ γεγέννηται.» (<a href="https://bibleox.com/el/gr-lxx-byz/1in/3/#L9">Α Ιω 3:9</a>)</p></blockquote><blockquote><p>«Οἴδαμεν ὅτι <strong>πᾶς ὁ γεγεννημένος ἐκ τοῦ θεοῦ οὐχ ἁμαρτάνει</strong>, ἀλλ᾿ ὁ γεννηθεὶς ἐκ τοῦ θεοῦ τηρεῖ αὐτόν, καὶ ὁ πονηρὸς οὐχ ἅπτεται αὐτοῦ.» (<a href="https://bibleox.com/el/gr-lxx-byz/1in/5/#L18">Α Ιω 5:18</a>)</p></blockquote><blockquote><p>«<strong>Εἰρήνην</strong> διώκετε μετὰ πάντων, καὶ <strong>τὸν ἁγιασμόν, οὗ χωρὶς οὐδεὶς ὄψεται τὸν κύριον</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/12/#L14">Εβρ 12:14</a>)</p></blockquote><blockquote><p>«καὶ ἡ <strong>πόλις</strong> οὐ χρείαν ἔχει τοῦ ἡλίου οὐδὲ τῆς σελήνης, ἵνα φαίνωσιν αὐτῇ, ἡ γὰρ δόξα τοῦ θεοῦ ἐφώτισεν αὐτήν, καὶ ὁ λύχνος αὐτῆς τὸ ἀρνίον. &lt;…&gt; καὶ οἱ πυλῶνες αὐτῆς οὐ μὴ κλεισθῶσιν ἡμέρας, νὺξ γὰρ οὐκ ἔσται ἐκεῖ· &lt;…&gt; καὶ <strong>οὐ μὴ εἰσέλθῃ εἰς αὐτὴν πᾶν κοινὸν καὶ ποιῶν βδέλυγμα καὶ ψεῦδος</strong>, εἰ μὴ οἱ γεγραμμένοι ἐν τῷ βιβλίῳ τῆς ζωῆς τοῦ ἀρνίου.» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/21/#L23,25,27">Απ 21:23,25,27</a>)</p></blockquote>
