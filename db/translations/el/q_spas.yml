    priority: 9
  update: true
  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <h2>Πολλοί δεν θα σωθούν</h2><blockquote><p>«Ἀγωνίζεσθε εἰσελθεῖν διὰ τῆς στενῆς θύρας, ὅτι <strong><mark>πολλοί</mark></strong>, λέγω ὑμῖν, ζητήσουσιν εἰσελθεῖν καὶ <strong>οὐκ ἰσχύσουσιν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/13/#L24">Λκ 13:24</a>)</p></blockquote><blockquote><p>«Εἰσέλθατε διὰ τῆς στενῆς πύλης· ὅτι <strong>πλατεῖα ἡ πύλη</strong> καὶ εὐρύχωρος <strong>ἡ ὁδὸς ἡ ἀπάγουσα εἰς τὴν ἀπώλειαν</strong>, καὶ <strong><mark>πολλοί</mark> εἰσιν οἱ εἰσερχόμενοι δι᾿ αὐτῆς</strong>· τί <strong>στενὴ ἡ πύλη</strong> καὶ τεθλιμμένη <strong>ἡ ὁδὸς ἡ ἀπάγουσα εἰς τὴν ζωήν</strong>, καὶ <strong>ὀλίγοι εἰσὶν οἱ εὑρίσκοντες αὐτήν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/7/#L13-14">Μτ 7:13-14</a>)</p></blockquote><h2>Δεν θα σωθούν όλοι οι πιστοί</h2><blockquote><p>«<strong><mark>Οὐ πᾶς ὁ λέγων</mark> μοι, Κύριε κύριε, εἰσελεύσεται εἰς τὴν βασιλείαν τῶν οὐρανῶν</strong>, ἀλλ᾿ ὁ ποιῶν τὸ θέλημα τοῦ πατρός μου τοῦ ἐν τοῖς οὐρανοῖς.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/7/#L21">Μτ 7:21</a>)</p></blockquote><blockquote><p>«πολλοὶ ἐροῦσίν μοι ἐν ἐκείνῃ τῇ ἡμέρᾳ, Κύριε κύριε, οὐ τῷ σῷ ὀνόματι <strong>ἐπροφητεύσαμεν</strong>, καὶ τῷ σῷ ὀνόματι <strong>δαιμόνια ἐξεβάλομεν</strong>, καὶ τῷ σῷ ὀνόματι <strong>δυνάμεις πολλὰς ἐποιήσαμεν</strong>; καὶ τότε ὁμολογήσω αὐτοῖς ὅτι <strong><mark>Οὐδέποτε ἔγνων ὑμᾶς· ἀποχωρεῖτε ἀπ᾿ ἐμοῦ οἱ ἐργαζόμενοι τὴν ἀνομίαν</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/7/#L22-23">Μτ 7:22-23</a>)</p></blockquote><blockquote><p>«πολλοὶ γάρ εἰσιν κλητοὶ <strong>ὀλίγοι δὲ ἐκλεκτοί</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/22/#L14">Μτ 22:14</a>)</p></blockquote>
