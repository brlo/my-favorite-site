  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <h2>Λίγοι είναι οι σωζόμενοι</h2><blockquote><p>«εἶπεν δέ τις αὐτῷ, Κύριε, <strong>εἰ ὀλίγοι οἱ σῳζόμενοι</strong>; ὁ δὲ εἶπεν πρὸς αὐτούς, Ἀγωνίζεσθε εἰσελθεῖν διὰ τῆς στενῆς θύρας, ὅτι <strong>πολλοί, λέγω ὑμῖν, ζητήσουσιν εἰσελθεῖν καὶ οὐκ ἰσχύσουσιν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/13/#L23-24">Λκ 13:23-24</a>)</p></blockquote><blockquote><p>«Εἰσέλθατε διὰ τῆς στενῆς πύλης· ὅτι <strong>πλατεῖα ἡ πύλη</strong> καὶ εὐρύχωρος <strong>ἡ ὁδὸς ἡ ἀπάγουσα εἰς τὴν ἀπώλειαν</strong>, καὶ <strong>πολλοί εἰσιν οἱ εἰσερχόμενοι δι᾿ αὐτῆς</strong>· τί <strong>στενὴ ἡ πύλη</strong> καὶ τεθλιμμένη <strong>ἡ ὁδὸς ἡ ἀπάγουσα εἰς τὴν ζωήν</strong>, καὶ <strong>ὀλίγοι εἰσὶν οἱ εὑρίσκοντες αὐτήν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/7/#L13-14">Μτ 7:13-14</a>)</p></blockquote><blockquote><p>«<strong>πολλοὶ</strong> ἐροῦσίν μοι ἐν ἐκείνῃ τῇ ἡμέρᾳ, Κύριε κύριε, οὐ τῷ σῷ ὀνόματι ἐπροφητεύσαμεν, καὶ τῷ σῷ ὀνόματι δαιμόνια ἐξεβάλομεν, καὶ τῷ σῷ ὀνόματι δυνάμεις πολλὰς ἐποιήσαμεν; καὶ τότε ὁμολογήσω αὐτοῖς ὅτι <strong>Οὐδέποτε ἔγνων ὑμᾶς· ἀποχωρεῖτε ἀπ᾿ ἐμοῦ οἱ ἐργαζόμενοι τὴν ἀνομίαν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/7/#L22-23">Μτ 7:22-23</a>)</p></blockquote><blockquote><p>«Μὴ φοβοῦ, <strong>τὸ μικρὸν ποίμνιον</strong>, ὅτι εὐδόκησεν ὁ πατὴρ ὑμῶν δοῦναι ὑμῖν τὴν βασιλείαν.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/12/#L32">Λκ 12:32</a>)</p></blockquote><blockquote><p>«[ἢ] οὐκ ἔξεστίν μοι ὃ θέλω ποιῆσαι ἐν τοῖς ἐμοῖς; ἢ ὁ ὀφθαλμός σου πονηρός ἐστιν ὅτι ἐγὼ ἀγαθός εἰμι; Οὕτως ἔσονται <strong>οἱ ἔσχατοι πρῶτοι καὶ οἱ πρῶτοι ἔσχατοι</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/20/#L15-16">Μτ 20:15-16</a>)</p></blockquote><blockquote><p>«τότε ὁ βασιλεὺς εἶπεν τοῖς διακόνοις, Δήσαντες αὐτοῦ πόδας καὶ χεῖρας ἐκβάλετε αὐτὸν εἰς τὸ σκότος τὸ ἐξώτερον· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων. πολλοὶ γάρ εἰσιν κλητοὶ <strong>ὀλίγοι δὲ ἐκλεκτοί</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/22/#L13-14">Μτ 22:13-14</a>)</p></blockquote><blockquote><p>«λέγω γὰρ ὑμῖν ὅτι <strong>οὐδεὶς τῶν ἀνδρῶν ἐκείνων τῶν κεκλημένων γεύσεταί μου τοῦ δείπνου</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/14/#L24">Λκ 14:24</a>)</p></blockquote><h2>Παλαιοδιαθηκικό παράδειγμα για τον μικρό αριθμό των σωζομένων</h2><blockquote><p>«Εἰ γὰρ ὁ θεὸς ἀγγέλων ἁμαρτησάντων οὐκ ἐφείσατο, ἀλλὰ σιραῖς ζόφου ταρταρώσας παρέδωκεν εἰς κρίσιν τηρουμένους, καὶ <strong>ἀρχαίου κόσμου οὐκ ἐφείσατο, ἀλλὰ <mark>ὄγδοον Νῶε δικαιοσύνης κήρυκα ἐφύλαξεν</mark></strong>, κατακλυσμὸν κόσμῳ ἀσεβῶν ἐπάξας, καὶ <strong>πόλεις Σοδόμων καὶ Γομόρρας τεφρώσας κατέκρινεν</strong>, ὑπόδειγμα μελλόντων ἀσεβέσιν τεθεικώς, καὶ <strong>δίκαιον Λὼτ</strong> καταπονούμενον ὑπὸ τῆς τῶν ἀθέσμων ἐν ἀσελγείᾳ ἀναστροφῆς <strong>ἐρρύσατο</strong>· βλέμματι γὰρ καὶ ἀκοῇ ὁ δίκαιος ἐγκατοικῶν ἐν αὐτοῖς ἡμέραν ἐξ ἡμέρας ψυχὴν δικαίαν ἀνόμοις ἔργοις ἐβασάνιζεν· οἶδεν κύριος εὐσεβεῖς ἐκ πειρασμοῦ ῥύεσθαι, ἀδίκους δὲ εἰς ἡμέραν κρίσεως κολαζομένους τηρεῖν» (<a href="https://bibleox.com/el/gr-lxx-byz/2pet/2/#L4-9">Β Πε 2:4-9</a>)</p></blockquote><blockquote><p>«<strong>ταῦτα δὲ τυπικῶς συνέβαινεν ἐκείνοις, ἐγράφη δὲ πρὸς νουθεσίαν ἡμῶν</strong>, εἰς οὓς τὰ τέλη τῶν αἰώνων κατήντηκεν.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/10/#L11">Α Κορ 10:11</a>)</p></blockquote>
