  body: <blockquote>«<b>ὁ δὲ ἐμὲ ἀθετῶν ἀθετεῖ τὸν ἀποστείλαντά με</b>.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/10/#L16">Λκ 10:16</a>)</blockquote><blockquote>«<b>ὁ ἐμὲ μισῶν καὶ τὸν πατέρα μου μισεῖ</b>.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/15/#L23">Ιω 15:23</a>)</blockquote><blockquote>«πᾶς <b>ὁ ἀρνούμενος τὸν υἱὸν οὐδὲ τὸν πατέρα ἔχει</b>· ὁ ὁμολογῶν τὸν υἱὸν καὶ τὸν πατέρα ἔχει.» (<a href="https://bibleox.com/el/gr-lxx-byz/1in/2/#L23">Α Ιω 2:23</a>)</blockquote><blockquote>«πᾶς ὁ <b>προάγων</b> καὶ <b>μὴ μένων ἐν τῇ διδαχῇ τοῦ Χριστοῦ</b> <b>θεὸν οὐκ ἔχει</b>· ὁ μένων ἐν τῇ διδαχῇ, οὗτος καὶ τὸν πατέρα καὶ τὸν υἱὸν ἔχει.» (<a href="https://bibleox.com/el/gr-lxx-byz/2in/1/#L9">Β Ιω 1:9</a>)</blockquote><blockquote>«ὁ πιστεύων εἰς τὸν υἱὸν ἔχει ζωὴν αἰώνιον· <b>ὁ δὲ ἀπειθῶν τῷ υἱῷ οὐκ ὄψεται ζωήν</b>, ἀλλ᾿ <b>ἡ ὀργὴ τοῦ θεοῦ μένει ἐπ᾿ αὐτόν</b>.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/3/#L36">Ιω 3:36</a>)</blockquote>
