  title: Ο Υιός είναι άναρχος
  title_sub: Βιβλικές ρήσεις για το πώς ο άναρχος Υιός του Θεού λαμβάνει αρχή (γεννιέται) ως άνθρωπος
  meta_desc: Βιβλικές ρήσεις για τη γέννηση από την Παρθένο Μαρία του άναρχου Υιού του Θεού.
  copy_cover: true
  menu:
    parent: Θεός/Ο Υιός
    title: Ο Υιός είναι άναρχος
    priority: 4
  update: true
  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <h2>Ο Υιός του Θεού δεν έχει αρχή, αλλά δίνει αρχή σε ό,τι έχει αρχή</h2><blockquote><p>«Ἐν ἀρχῇ ἦν ὁ λόγος, καὶ ὁ λόγος ἦν πρὸς τὸν θεόν, καὶ θεὸς ἦν ὁ λόγος. &lt;…&gt; <strong>πάντα δι᾿ αὐτοῦ ἐγένετο, καὶ χωρὶς αὐτοῦ ἐγένετο οὐδὲ ἕν. ὃ γέγονεν</strong> &lt;…&gt; Καὶ ὁ λόγος σὰρξ ἐγένετο καὶ ἐσκήνωσεν ἐν ἡμῖν, καὶ ἐθεασάμεθα τὴν δόξαν αὐτοῦ, δόξαν ὡς μονογενοῦς παρὰ πατρός, πλήρης χάριτος καὶ ἀληθείας.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/1/#L1,3,14">Ιω 1:1,3,14</a>)</p></blockquote><h2>Ο ιερέας Μελχισεδέκ — τύπος του Υιού του Θεού, που δεν έχει αρχή ημερών (άναρχος)</h2><blockquote><p>«ἀπάτωρ, ἀμήτωρ, ἀγενεαλόγητος, <strong>μήτε ἀρχὴν ἡμερῶν μήτε ζωῆς τέλος ἔχων, ἀφωμοιωμένος δὲ τῷ υἱῷ τοῦ θεοῦ</strong>, μένει ἱερεὺς εἰς τὸ διηνεκές.» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/7/#L3">Εβρ 7:3</a>)</p></blockquote><h2>Ο άναρχος αρχίζει</h2><p>Ο άναρχος Θεός αρχίζει, γεννιέται ως άνθρωπος από την Παρθένο, σύμφωνα με την προφητεία (<a href="https://bibleox.com/el/gr-lxx-byz/is/7/#L14">Ησ 7:14</a>):</p><blockquote><p>«ὅτε δὲ ἦλθεν τὸ πλήρωμα τοῦ χρόνου, <strong>ἐξαπέστειλεν</strong> ὁ θεὸς τὸν υἱὸν αὐτοῦ, <strong>γενόμενον ἐκ γυναικός</strong>, γενόμενον ὑπὸ νόμον,» (<a href="https://bibleox.com/el/gr-lxx-byz/gal/4/#L4">Γαλ 4:4</a>)</p></blockquote><blockquote><p>«ὃς ἐν μορφῇ θεοῦ ὑπάρχων οὐχ ἁρπαγμὸν ἡγήσατο τὸ εἶναι ἴσα θεῷ, ἀλλὰ ἑαυτὸν ἐκένωσεν <strong>μορφὴν δούλου λαβών, ἐν ὁμοιώματι ἀνθρώπων γενόμενος· καὶ σχήματι εὑρεθεὶς ὡς ἄνθρωπος</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/fil/2/#L6-7">Φιλ 2:6-7</a>)</p></blockquote><blockquote><p>«Ἐν ἀρχῇ ἦν ὁ λόγος, καὶ ὁ λόγος ἦν πρὸς τὸν θεόν, καὶ <strong>θεὸς ἦν ὁ λόγος</strong>. &lt;…&gt; πάντα δι᾿ αὐτοῦ ἐγένετο, καὶ χωρὶς αὐτοῦ ἐγένετο οὐδὲ ἕν. ὃ γέγονεν &lt;…&gt; Καὶ <strong>ὁ λόγος σὰρξ ἐγένετο</strong> καὶ ἐσκήνωσεν ἐν ἡμῖν, καὶ ἐθεασάμεθα τὴν δόξαν αὐτοῦ, δόξαν ὡς μονογενοῦς παρὰ πατρός, πλήρης χάριτος καὶ ἀληθείας.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/1/#L1,3,14">Ιω 1:1,3,14</a>)</p></blockquote>
- src: Христос-на-небе
  path: Ο_Χριστός_είναι_στους_ουρανούς
  title: Ο Χριστός είναι στους ουρανούς
  meta_desc: Βιβλικές ρήσεις που δείχνουν ότι ο Χριστός ανέβηκε στους ουρανούς και κάθισε στα δεξιά του Θεού.
  copy_cover: true
  menu:
    parent: Θεός/Ο Υιός
