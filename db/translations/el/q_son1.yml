  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <p>Με την παράβαση του Αδάμ καταδικάστηκε ολόκληρη η ανθρωπότητα:</p><blockquote>«Ἄρα οὖν ὡς <b>δι᾿ ἑνὸς παραπτώματος εἰς πάντας ἀνθρώπους εἰς κατάκριμα</b>, οὕτως καὶ δι᾿ ἑνὸς δικαιώματος εἰς πάντας ἀνθρώπους εἰς δικαίωσιν ζωῆς·» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/5/#L18">Ρωμ 5:18</a>)</blockquote>Την κατάρα της ανθρωπότητας ανέλαβε ο Χριστός:<blockquote>«Χριστὸς ἡμᾶς ἐξηγόρασεν ἐκ τῆς κατάρας τοῦ νόμου γενόμενος ὑπὲρ ἡμῶν κατάρα, ὅτι γέγραπται, Ἐπικατάρατος πᾶς ὁ κρεμάμενος ἐπὶ ξύλου,» (<a href="https://bibleox.com/el/gr-lxx-byz/gal/3/#L13">Γαλ 3:13</a>)</blockquote>Ο Χριστός λύτρωσε τον άνθρωπο με το Αίμα Του:<blockquote>«εἰδότες ὅτι οὐ φθαρτοῖς, ἀργυρίῳ ἢ χρυσίῳ <b>ἐλυτρώθητε</b> <b>ἐκ τῆς ματαίας ὑμῶν ἀναστροφῆς πατροπαραδότου</b>, ἀλλὰ τιμίῳ <b>αἵματι ὡς ἀμνοῦ ἀμώμου καὶ ἀσπίλου Χριστοῦ</b>,» (<a href="https://bibleox.com/el/gr-lxx-byz/1pet/1/#L18-19">Α Πε 1:18-19</a>)</blockquote><blockquote>«καὶ ᾄδουσιν ᾠδὴν καινὴν λέγοντες, Ἄξιος εἶ λαβεῖν τὸ βιβλίον καὶ ἀνοῖξαι τὰς σφραγῖδας αὐτοῦ, ὅτι ἐσφάγης καὶ <b>ἠγόρασας τῷ θεῷ ἐν τῷ αἵματί σου</b> ἐκ πάσης φυλῆς καὶ γλώσσης καὶ λαοῦ καὶ ἔθνους,» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/5/#L9">Απ 5:9</a>)</blockquote>
