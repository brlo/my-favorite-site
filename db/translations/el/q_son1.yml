  body: <blockquote><p>«<strong>τὸν μὴ γνόντα ἁμαρτίαν</strong> ὑπὲρ ἡμῶν ἁμαρτίαν ἐποίησεν» (<a href="https://bibleox.com/el/gr-lxx-byz/2kor/5/#L21">Β Κορ 5:21</a>).</p></blockquote><blockquote><p>«πεπειρασμένον δὲ κατὰ πάντα καθ᾿ ὁμοιότητα <strong>χωρὶς ἁμαρτίας</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/4/#L15">Εβρ 4:15</a>)</p></blockquote><blockquote><p>«ὅσιος, <strong>ἄκακος, ἀμίαντος, κεχωρισμένος ἀπὸ τῶν ἁμαρτωλῶν</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/7/#L26">Εβρ 7:26</a>)</p></blockquote><blockquote><p>«διὰ πνεύματος αἰωνίου ἑαυτὸν προσήνεγκεν <strong>ἄμωμον</strong> τῷ θεῷ» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/9/#L14">Εβρ 9:14</a>)</p></blockquote><blockquote><p>«<strong>ἁμαρτία ἐν αὐτῷ οὐκ ἔστιν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1in/3/#L5">Α Ιω 3:5</a>)</p></blockquote><blockquote><p>«οὐκέτι πολλὰ λαλήσω μεθ᾿ ὑμῶν, ἔρχεται γὰρ <strong>ὁ τοῦ κόσμου ἄρχων</strong>· καὶ <strong>ἐν ἐμοὶ οὐκ ἔχει οὐδέν</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/in/14/#L30">Ιω 14:30</a>)</p></blockquote><blockquote><p>«<strong>τίς</strong> ἐξ ὑμῶν <strong>ἐλέγχει με περὶ ἁμαρτίας</strong>; εἰ ἀλήθειαν λέγω, διὰ τί ὑμεῖς οὐ πιστεύετέ μοι;» (<a href="https://bibleox.com/el/gr-lxx-byz/in/8/#L46">Ιω 8:46</a>)</p></blockquote><blockquote><p>«καὶ δώσω τοὺς πονηροὺς ἀντὶ τῆς ταφῆς αὐτοῦ καὶ τοὺς πλουσίους ἀντὶ τοῦ θανάτου αὐτοῦ· ὅτι <strong>ἀνομίαν οὐκ ἐποίησεν</strong>, οὐδὲ εὑρέθη δόλος ἐν τῷ στόματι αὐτοῦ.» (<a href="https://bibleox.com/el/gr-lxx-byz/is/53/#L9">Ησ 53:9</a>)</p></blockquote>
- src: Христос-титулы
