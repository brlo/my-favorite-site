  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: '<p>Για τους μουσουλμάνους θα είναι σημαντικό ότι η Αγία Γραφή αποδίδει στον Χριστό πολλούς τίτλους που το Ισλάμ επιτρέπει κατηγορηματικά να αποδίδονται μόνο στον Θεό: Δημιουργός, Άγιος, Βασιλιάς των Βασιλιάδων, Πρώτος, Αναλλοίωτος, Παντοδύναμος:</p><ul><li><p><strong>Ο Δημιουργός</strong> (αλ-Χάλικ, ٱلْخَـٰلِقُ) – <a href="https://bibleox.com/el/gr-lxx-byz/in/1/#L3,10">Ιω 1:3,10</a><strong> </strong> <a href="https://bibleox.com/el/gr-lxx-byz/evr/1/#L1-2">Εβρ 1:1-2</a> · <a href="https://bibleox.com/el/gr-lxx-byz/evr/11/#L3">Εβρ 11:3</a> · <a href="https://bibleox.com/el/gr-lxx-byz/evr/1/#L8-12">Εβρ 1:8-12</a> · <a href="https://bibleox.com/el/gr-lxx-byz/kol/1/#L13-17">Κολ 1:13-17</a></p></li></ul><ul><li><p><strong>Ο Βασιλιάς των Βασιλιάδων</strong> (Μάλικ αλ-Μουλούκ, مالك الملك) – <a href="https://bibleox.com/el/gr-lxx-byz/otkr/17/#L14">Απ 17:14</a> · <a href="https://bibleox.com/el/gr-lxx-byz/otkr/19/#L16">Απ 19:16</a></p></li></ul><ul><li><p>Ο Κυρίαρχος (αλ-Κάχχαρ, ٱلْقَهَّـٰرُ) – <a href="https://bibleox.com/el/gr-lxx-byz/otkr/17/#L14">Απ 17:14</a> · <a href="https://bibleox.com/el/gr-lxx-byz/otkr/19/#L16">Απ 19:16</a></p></li></ul><ul><li><p><strong>Ο Άγιος</strong> (αλ-Κουδδούς, ٱلْقُدُّوسُ) – <a href="https://bibleox.com/el/gr-lxx-byz/otkr/3/#L7">Απ 3:7</a> · <a href="https://bibleox.com/el/gr-lxx-byz/otkr/6/#L10">Απ 6:10</a> · <a href="https://bibleox.com/el/gr-lxx-byz/evr/7/#L26">Εβρ 7:26</a> · <a href="https://bibleox.com/el/gr-lxx-byz/act/3/#L14">Πραξ 3:14</a></p></li></ul><ul><li><p>Ο Πράος (αλ-Χαλίμ, ٱلْحَلِيمُ) – <a href="https://bibleox.com/el/gr-lxx-byz/ier/11/#L19">Ιερ 11:19</a> · <a href="https://bibleox.com/el/gr-lxx-byz/mf/11/#L29">Μτ 11:29</a> · <a href="https://bibleox.com/el/gr-lxx-byz/mf/21/#L5">Μτ 21:5</a></p></li></ul><ul><li><p>Η Αρχή, <strong>ο Πρώτος</strong> (αλ-Άουαλ, الأول) – <a href="https://bibleox.com/el/gr-lxx-byz/in/1/#L1-3">Ιω 1:1-3</a> · <a href="https://bibleox.com/el/gr-lxx-byz/otkr/1/#L10">Απ 1:10</a> · <a href="https://bibleox.com/el/gr-lxx-byz/otkr/1/#L17">Απ 1:17</a> · <a href="https://bibleox.com/el/gr-lxx-byz/otkr/2/#L8">Απ 2:8</a> · <a href="https://bibleox.com/el/gr-lxx-byz/otkr/22/#L13">Απ 22:13</a></p></li></ul><ul><li><p>Το Τέλος, ο Έσχατος (αλ-Άχιρ, الأخر) – <a href="https://bibleox.com/el/gr-lxx-byz/otkr/1/#L10">Απ 1:10</a> · <a href="https://bibleox.com/el/gr-lxx-byz/otkr/1/#L17">Απ 1:17</a> · <a href="https://bibleox.com/el/gr-lxx-byz/otkr/2/#L8">Απ 2:8</a> · <a href="https://bibleox.com/el/gr-lxx-byz/otkr/22/#L13">Απ 22:13</a></p></li></ul><ul><li><p><strong>Ο Αναλλοίωτος</strong> (ας-Σαμάντ, الصمد) – <a href="https://bibleox.com/el/gr-lxx-byz/evr/13/#L8">Εβρ 13:8</a> · <a href="https://bibleox.com/el/gr-lxx-byz/evr/1/#L10-12">Εβρ 1:10-12</a></p></li></ul><ul><li><p>Ο Ζων (αλ-Χάγι, الحي) – <a href="https://bibleox.com/el/gr-lxx-byz/otkr/1/#L17">Απ 1:17</a> · <a href="https://bibleox.com/el/gr-lxx-byz/act/3/#L15">Πραξ 3:15</a></p></li></ul><ul><li><p>Ο Σωτήρας (αλ-Μουχάιμιν, ٱلْمُهَيْمِنُ) – <a href="https://bibleox.com/el/gr-lxx-byz/in/4/#L42">Ιω 4:42</a> · <a href="https://bibleox.com/el/gr-lxx-byz/lk/1/#L47">Λκ 1:47</a> · <a href="https://bibleox.com/el/gr-lxx-byz/lk/2/#L11">Λκ 2:11</a> · <a href="https://bibleox.com/el/gr-lxx-byz/act/5/#L31">Πραξ 5:31</a> · <a href="https://bibleox.com/el/gr-lxx-byz/act/13/#L23">Πραξ 13:23</a> · <a href="https://bibleox.com/el/gr-lxx-byz/ef/5/#L23">Εφ 5:23</a> · <a href="https://bibleox.com/el/gr-lxx-byz/fil/3/#L20">Φιλ 3:20</a> · <a href="https://bibleox.com/el/gr-lxx-byz/1tim/1/#L1">Α Τιμ 1:1</a> · <a href="https://bibleox.com/el/gr-lxx-byz/2tim/1/#L10">Β Τιμ 1:10</a> · <a href="https://bibleox.com/el/gr-lxx-byz/tit/1/#L4">Τιτ 1:4</a> · <a href="https://bibleox.com/el/gr-lxx-byz/tit/2/#L13">Τιτ 2:13</a> · <a href="https://bibleox.com/el/gr-lxx-byz/tit/3/#L6">Τιτ 3:6</a> · <a href="https://bibleox.com/el/gr-lxx-byz/2pet/1/#L1">Β Πε 1:1</a> · <a href="https://bibleox.com/el/gr-lxx-byz/2pet/1/#L11">Β Πε 1:11</a> · <a href="https://bibleox.com/el/gr-lxx-byz/2pet/2/#L20">Β Πε 2:20</a> · <a href="https://bibleox.com/el/gr-lxx-byz/2pet/3/#L18">Β Πε 3:18</a> · <a href="https://bibleox.com/el/gr-lxx-byz/1in/4/#L14">Α Ιω 4:14</a></p></li></ul><ul><li><p>Το Φως (αν-Νουρ, النور) – <a href="https://bibleox.com/el/gr-lxx-byz/in/1/#L9">Ιω 1:9</a> · <a href="https://bibleox.com/el/gr-lxx-byz/in/12/#L46">Ιω 12:46</a> · <a href="https://bibleox.com/el/gr-lxx-byz/in/12/#L35-36">Ιω 12:35-36</a></p></li></ul><ul><li><p>Ο Κληρονόμος (αλ-Ουαρίθ, الوارث) – <a href="https://bibleox.com/el/gr-lxx-byz/evr/1/#L2">Εβρ 1:2</a> · <a href="https://bibleox.com/el/gr-lxx-byz/mf/21/#L38">Μτ 21:38</a> · <a href="https://bibleox.com/el/gr-lxx-byz/2tim/4/#L1">Β Τιμ 4:1</a> · <a href="https://bibleox.com/el/gr-lxx-byz/2pet/1/#L11">Β Πε 1:11</a><em> · </em><a href="https://bibleox.com/el/gr-lxx-byz/rim/8/#L17">Ρωμ 8:17</a></p></li></ul><ul><li><p>Η Αλήθεια (αλ-Χακκ, الحق) – <a href="https://bibleox.com/el/gr-lxx-byz/in/14/#L6">Ιω 14:6</a> · <a href="https://bibleox.com/el/gr-lxx-byz/otkr/3/#L7">Απ 3:7</a></p></li></ul><ul><li><p>Ο Ανοίγων (αλ-Φαττάχ, ٱلْفَتَّاحُ) – <a href="https://bibleox.com/el/gr-lxx-byz/otkr/3/#L7-8">Απ 3:7-8</a></p></li></ul><ul><li><p>Ο Εγείρων (αλ-Μπαΐθ, ٱلْبَاعِثُ) – <a href="https://bibleox.com/el/gr-lxx-byz/in/5/#L21">Ιω 5:21</a> · <a href="https://bibleox.com/el/gr-lxx-byz/in/6/#L54">Ιω 6:54</a></p></li></ul><ul><li><p><strong>Ο Παντοδύναμος</strong> (αλ-Τζαμπάρ, ٱلْجَبَّارُ) – <a href="https://bibleox.com/el/gr-lxx-byz/evr/1/#L3">Εβρ 1:3</a><strong> </strong> <a href="https://bibleox.com/el/gr-lxx-byz/otkr/1/#L8">Απ 1:8</a> · <a href="https://bibleox.com/el/gr-lxx-byz/mf/28/#L18">Μτ 28:18</a></p></li></ul>'
- src: молитва-Иисусу-Христу
  path: Προσευχή_στον_Ιησού_Χριστό
  title: Προσευχή στον Ιησού Χριστό
  copy_cover: true
  menu:
    parent: Θεός/Ο Υιός
    title: Προσευχή στον Ιησού Χριστό
    priority: 50
  update: true
  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <h2>Μπορούμε να προσευχόμαστε στον Ιησού Χριστό;</h2><p>Φυσικά και μπορούμε. Αλλά αυτή την εντολή δεν την έχουμε από τη Γραφή, αλλά από την Παράδοση.</p><h2>Μπορούμε, μόνο με βάση τη Γραφή, να ισχυριστούμε ότι πρέπει να προσευχόμαστε στον Ιησού Χριστό;</h2><p>Στη Βίβλο δεν υπάρχει εντολή να προσευχόμαστε στον Ιησού Χριστό. Ωστόσο, υπάρχουν ορισμένες ενδείξεις στο <a href="https://bibleox.com/el/gr-lxx-byz/in/14/#L14">Ιω 14:14</a> (βλ. το ελληνικό κείμενο).</p><p>Ο Ιησούς Χριστός προσευχόταν στον Πατέρα (<a href="https://bibleox.com/el/gr-lxx-byz/mk/14/#L36">Μκ 14:36</a>· <a href="https://bibleox.com/el/gr-lxx-byz/lk/22/#L42">Λκ 22:42</a>), έδωσε την προσευχή «Πάτερ ημών» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/6/#L9">Μτ 6:9</a>· <a href="https://bibleox.com/el/gr-lxx-byz/lk/11/#L2">Λκ 11:2</a>), δηλαδή δίδασκε να προσευχόμαστε στον Πατέρα.</p><p>Όσοι θέλουν να οικοδομήσουν την πίστη χωρίς την Παράδοση, μόνο πάνω στη Γραφή (φυσικά, με τη δική τους κατανόηση της Γραφής), δεν τολμούν να αρνηθούν την προσευχή στον Ιησού Χριστό. Γι' αυτό λένε ότι, αφού υπάρχει πρακτική προσευχής στον Ιησού Χριστό, άρα μπορούμε να προσευχόμαστε σ' Αυτόν. Ωστόσο, συχνά δυσκολεύονται να δείξουν ακόμη και την πρακτική, γιατί είναι πολύ σπάνια, αλλά, φυσικά, υπάρχει. Για παράδειγμα:</p><blockquote><p>«καὶ ἐλιθοβόλουν τὸν Στέφανον <strong>ἐπικαλούμενον</strong> καὶ λέγοντα, <strong>Κύριε Ἰησοῦ</strong>, δέξαι τὸ πνεῦμά μου.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/7/#L59">Πραξ 7:59</a>)</p></blockquote><h2>Κριτική</h2><h3>«Ζητήστε στο όνομά Μου»</h3><p>Οι Προτεστάντες αντιτείνουν, επισημαίνοντας ότι η εντολή βρίσκεται σε αυτόν τον στίχο:</p><blockquote><p>«ἐάν τι αἰτήσητέ με <strong>ἐν τῷ ὀνόματί μου</strong> ἐγὼ ποιήσω.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/14/#L14">Ιω 14:14</a>)</p></blockquote><p>Ωστόσο, αξίζει να παραθέσουμε το πλαίσιο και να δούμε ότι ο Κύριος Ιησούς Χριστός και εδώ δίδασκε να ζητάμε από τον Πατέρα:</p><blockquote><p>«καὶ ὅ τι ἂν <strong><mark>αἰτήσητε</mark></strong> ἐν τῷ ὀνόματί μου τοῦτο ποιήσω, ἵνα δοξασθῇ ὁ πατὴρ ἐν τῷ υἱῷ· ἐάν τι αἰτήσητέ με ἐν τῷ ὀνόματί μου ἐγὼ ποιήσω.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/14/#L13-14">Ιω 14:13-14</a>)</p></blockquote>
