    priority: 6
  update: true
  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <blockquote>«Ὁ μὲν οὖν κύριος [Ἰησοῦς] μετὰ τὸ λαλῆσαι αὐτοῖς <b>ἀνελήμφθη εἰς τὸν οὐρανὸν καὶ ἐκάθισεν ἐκ δεξιῶν τοῦ θεοῦ</b>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mk/16/#L19">Μκ 16:19</a>)</blockquote><blockquote>«ὃς ὢν ἀπαύγασμα τῆς δόξης καὶ χαρακτὴρ τῆς ὑποστάσεως αὐτοῦ, φέρων τε τὰ πάντα τῷ ῥήματι τῆς δυνάμεως αὐτοῦ, καθαρισμὸν τῶν ἁμαρτιῶν ποιησάμενος <b>ἐκάθισεν ἐν δεξιᾷ τῆς μεγαλωσύνης ἐν ὑψηλοῖς</b>,» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/1/#L3">Εβρ 1:3</a>)</blockquote><blockquote>«Κεφάλαιον δὲ ἐπὶ τοῖς λεγομένοις, <b>τοιοῦτον ἔχομεν ἀρχιερέα, ὃς ἐκάθισεν ἐν δεξιᾷ τοῦ θρόνου τῆς μεγαλωσύνης ἐν τοῖς οὐρανοῖς</b>,» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/8/#L1">Εβρ 8:1</a>)</blockquote><blockquote>«οὗτος δὲ μίαν ὑπὲρ ἁμαρτιῶν προσενέγκας θυσίαν <b>εἰς τὸ διηνεκὲς ἐκάθισεν ἐν δεξιᾷ τοῦ θεοῦ</b>,» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/10/#L12">Εβρ 10:12</a>)</blockquote><blockquote>«ἀφορῶντες εἰς τὸν τῆς πίστεως ἀρχηγὸν καὶ τελειωτὴν Ἰησοῦν, ὃς ἀντὶ τῆς προκειμένης αὐτῷ χαρᾶς ὑπέμεινεν σταυρὸν αἰσχύνης καταφρονήσας, <b>ἐν δεξιᾷ τε τοῦ θρόνου τοῦ θεοῦ κεκάθικεν</b>.» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/12/#L2">Εβρ 12:2</a>)</blockquote><blockquote>«οὐ γὰρ εἰς χειροποίητα <b>εἰσῆλθεν</b> ἅγια <b>Χριστός</b>, ἀντίτυπα τῶν ἀληθινῶν, ἀλλ᾿ <b>εἰς αὐτὸν τὸν οὐρανόν</b>, νῦν ἐμφανισθῆναι τῷ προσώπῳ τοῦ θεοῦ ὑπὲρ ἡμῶν·» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/9/#L24">Εβρ 9:24</a>)</blockquote><blockquote>«ὑπάρχων δὲ πλήρης πνεύματος ἁγίου ἀτενίσας εἰς τὸν οὐρανὸν εἶδεν δόξαν θεοῦ καὶ <b>Ἰησοῦν ἑστῶτα ἐκ δεξιῶν τοῦ θεοῦ, καὶ εἶπεν, Ἰδοὺ θεωρῶ τοὺς οὐρανοὺς διηνοιγμένους καὶ τὸν υἱὸν τοῦ ἀνθρώπου ἐκ δεξιῶν ἑστῶτα τοῦ θεοῦ</b>.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/7/#L55-56">Πραξ 7:55-56</a>)</blockquote>
- src: Христос-Творец-мира
  path: Ο_Χριστός_είναι_Δημιουργός_του_κόσμου
  title: Ο Χριστός είναι Δημιουργός του κόσμου
  meta_desc: 'Βιβλικές ρήσεις που δείχνουν ότι ο Ιησούς Χριστός, ο Υιός του Θεού, δημιούργησε τα πάντα: τους αιώνες, τον κόσμο και ό,τι υπάρχει.'
  copy_cover: true
  menu:
    parent: Θεός/Ο Υιός
    title: Ο Χριστός είναι Δημιουργός του κόσμου
    priority: 9
  update: true
  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <p>Ο Ιησούς Χριστός, ο Θεός Υιός, είναι ο Δημιουργός του κόσμου:</p><blockquote><p>«πρὸς δὲ <strong><mark>τὸν υἱόν</mark></strong>, Ὁ θρόνος σου, ὁ θεός, εἰς τὸν αἰῶνα τοῦ αἰῶνος, καὶ ἡ ῥάβδος τῆς εὐθύτητος ῥάβδος τῆς βασι λείας σου. ἠγάπησας δικαιοσύνην καὶ ἐμίσησας ἀνομίαν· διὰ τοῦτο ἔχρισέν σε ὁ θεός, ὁ θεός σου, ἔλαιον ἀγαλλιάσεως παρὰ τοὺς μετόχους σου· καί, <strong><mark>Σὺ κατ᾿ ἀρχάς, κύριε, τὴν γῆν ἐθεμελίωσας, καὶ ἔργα τῶν χειρῶν σού εἰσιν οἱ οὐρανοί</mark></strong>· αὐτοὶ ἀπολοῦνται, σὺ δὲ διαμένεις· καὶ πάντες ὡς ἱμάτιον παλαιωθήσονται, καὶ ὡσεὶ περιβόλαιον ἑλίξεις αὐτούς, ὡς ἱμάτιον καὶ ἀλλαγήσονται· σὺ δὲ ὁ αὐτὸς εἶ καὶ τὰ ἔτη σου οὐκ ἐκλείψουσιν.» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/1/#L8-12">Εβρ 1:8-12</a>)</p></blockquote><blockquote><p>«ὃς ἐρρύσατο ἡμᾶς ἐκ τῆς ἐξουσίας τοῦ σκότους καὶ μετέστησεν εἰς τὴν βασιλείαν τοῦ <strong><mark>υἱοῦ</mark> τῆς ἀγάπης αὐτοῦ</strong>, ἐν ᾧ ἔχομεν τὴν ἀπολύτρωσιν, τὴν ἄφεσιν τῶν ἁμαρτιῶν· ὅς ἐστιν εἰκὼν τοῦ θεοῦ τοῦ ἀοράτου, <strong>πρωτότοκος πάσης κτίσεως</strong>, ὅτι <strong><mark>ἐν αὐτῷ ἐκτίσθη τὰ πάντα ἐν τοῖς οὐρανοῖς καὶ ἐπὶ τῆς γῆς, τὰ ὁρατὰ καὶ τὰ ἀόρατα</mark>, εἴτε θρόνοι εἴτε κυριότητες εἴτε ἀρχαὶ εἴτε ἐξουσίαι· τὰ πάντα δι᾿ αὐτοῦ καὶ εἰς αὐτὸν ἔκτισται</strong>, καὶ αὐτός ἐστιν πρὸ πάντων καὶ τὰ πάντα ἐν αὐτῷ συνέστηκεν.» (<a href="https://bibleox.com/el/gr-lxx-byz/kol/1/#L13-17">Κολ 1:13-17</a>)</p></blockquote><blockquote><p>«ἐν τῷ κόσμῳ ἦν, καὶ <strong>ὁ κόσμος δι᾿ αὐτοῦ ἐγένετο</strong>, καὶ ὁ κόσμος αὐτὸν οὐκ ἔγνω.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/1/#L10">Ιω 1:10</a>)</p></blockquote><blockquote><p>«Πολυμερῶς καὶ πολυτρόπως πάλαι ὁ θεὸς λαλήσας τοῖς πατράσιν ἐν τοῖς προφήταις ἐπ᾿ ἐσχάτου τῶν ἡμερῶν τούτων ἐλάλησεν ἡμῖν ἐν <strong>υἱῷ</strong>, ὃν ἔθηκεν κληρονόμον πάντων, <strong>δι᾿ οὗ καὶ ἐποίησεν τοὺς αἰῶνας</strong>·» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/1/#L1-2">Εβρ 1:1-2</a>)</p></blockquote><blockquote><p>«Πίστει νοοῦμεν <strong>κατηρτίσθαι τοὺς αἰῶνας ῥήματι θεοῦ</strong>, εἰς τὸ μὴ ἐκ φαινομένων τὸ βλεπόμενον γεγονέναι.» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/11/#L3">Εβρ 11:3</a>)</p></blockquote>
