  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <p>Τα φτερωτά φίδια:</p><blockquote>«Ἡ ὅρασις τῶν τετραπόδων τῶν ἐν τῇ ἐρήμῳ. Ἐν τῇ θλίψει καὶ τῇ στενοχωρίᾳ, λέων καὶ σκύμνος λέοντος ἐκεῖθεν καὶ ἀσπίδες καὶ ἔκγονα <b>ἀσπίδων πετομένων</b>, οἳ ἔφερον ἐπ᾿ ὄνων καὶ καμήλων τὸν πλοῦτον αὐτῶν πρὸς ἔθνος ὃ οὐκ ὠφελήσει αὐτοὺς εἰς βοήθειαν, ἀλλὰ εἰς αἰσχύνην καὶ ὄνειδος.» (<a href="https://bibleox.com/el/gr-lxx-byz/is/30/#L6">Ησ 30:6</a>)</blockquote><blockquote>«Μὴ εὐφρανθείητε, πάντες οἱ ἀλλόφυλοι, συνετρίβη γὰρ ὁ ζυγὸς τοῦ παίοντος ὑμᾶς· ἐκ γὰρ σπέρματος ὄφεων ἐξελεύσεται ἔκγονα ἀσπίδων, καὶ τὰ ἔκγονα αὐτῶν ἐξελεύσονται <b>ὄφεις πετόμενοι</b>.» (<a href="https://bibleox.com/el/gr-lxx-byz/is/14/#L29">Ησ 14:29</a>)</blockquote>Ζώα στο νερό με πτερύγια:<blockquote>«καὶ ταῦτα φάγεσθε ἀπὸ πάντων τῶν <b>ἐν τοῖς ὕδασιν</b>· πάντα, ὅσα ἐστὶν ἐν αὐτοῖς <b>πτερύγια</b> καὶ λεπίδες, φάγεσθε.» (<a href="https://bibleox.com/el/gr-lxx-byz/vtor/14/#L9">Δτ 14:9</a>)</blockquote>Φτερωτές σαύρες:<blockquote>«πάντα τὰ <b>ἑρπετὰ τῶν πετεινῶν</b> ἀκάθαρτα ταῦτά ἐστιν ὑμῖν, οὐ φάγεσθε ἀπ᾿ αὐτῶν.» (<a href="https://bibleox.com/el/gr-lxx-byz/vtor/14/#L19">Δτ 14:19</a>)</blockquote>Ο Βεεμώθ (στα Ο΄ «θηρία»), που από την περιγραφή μοιάζει με δεινόσαυρο:<blockquote>«ἀλλὰ δὴ ἰδοὺ <b>θηρία</b> παρὰ σοί· χόρτον ἴσα βουσὶν ἐσθίει. ἰδοὺ δὴ ἰσχὺς αὐτοῦ ἐπ᾿ ὀσφύι, ἡ δὲ δύναμις ἐπ᾿ ὀμφαλοῦ γαστρός· <b>ἔστησεν οὐρὰν ὡς κυπάρισσον</b>, τὰ δὲ νεῦρα αὐτοῦ συμπέπλεκται· αἱ πλευραὶ αὐτοῦ πλευραὶ χάλκειαι, ἡ δὲ ῥάχις αὐτοῦ σίδηρος χυτός. τοῦτ᾿ ἔστιν ἀρχὴ πλάσματος κυρίου, πεποιημένον ἐγκαταπαίζεσθαι ὑπὸ τῶν ἀγγέλων αὐτοῦ. &lt;…&gt; σκιάζονται δὲ ἐν αὐτῷ δένδρα μεγάλα σὺν ῥαδάμνοις καὶ κλῶνες ἄγνου. ἐὰν γένηται πλήμμυρα, οὐ μὴ αἰσθηθῇ, πέποιθεν ὅτι προσκρούσει ὁ Ιορδάνης εἰς τὸ στόμα αὐτοῦ. ἐν τῷ ὀφθαλμῷ αὐτοῦ δέξεται αὐτόν, ἐνσκολιευόμενος τρήσει ῥῖνα; —» (<a href="https://bibleox.com/el/gr-lxx-byz/iov/40/#L15-19,22-24">Ιωβ 40:15-19,22-24</a>)</blockquote>Ο Λεβιάθαν (στα Ο΄ «δράκων»), που από την περιγραφή μοιάζει με δεινόσαυρο:<blockquote>«ἄξεις δὲ <b>δράκοντα</b> <b>ἐν ἀγκίστρῳ</b>, περιθήσεις δὲ φορβεὰν περὶ ῥῖνα αὐτοῦ; εἰ δήσεις κρίκον ἐν τῷ μυκτῆρι αὐτοῦ, ψελίῳ δὲ τρυπήσεις τὸ χεῖλος αὐτοῦ; λαλήσει δέ σοι δεήσει, ἱκετηρίᾳ μαλακῶς; θήσεται δὲ διαθήκην μετὰ σοῦ, λήμψῃ δὲ αὐτὸν δοῦλον αἰώνιον; παίξῃ δὲ ἐν αὐτῷ ὥσπερ ὀρνέῳ ἢ δήσεις αὐτὸν ὥσπερ στρουθίον παιδίῳ; ἐνσιτοῦνται δὲ ἐν αὐτῷ ἔθνη, μεριτεύονται δὲ αὐτὸν Φοινίκων γένη; πᾶν δὲ πλωτὸν συνελθὸν οὐ μὴ ἐνέγκωσιν βύρσαν μίαν οὐ ρᾶς αὐτοῦ καὶ <b>ἐν πλοίοις ἁλιέων κεφαλὴν αὐτοῦ</b>.» (<a href="https://bibleox.com/el/gr-lxx-byz/iov/40/#L25-31">Ιωβ 40:25-31</a>)</blockquote><blockquote>«<b>οὐχ ἑόρακας αὐτὸν οὐδὲ ἐπὶ τοῖς λεγομένοις τεθαύμακας</b>; &lt;…&gt; <b>οὐ σιωπήσομαι δι᾿ αὐτόν, καὶ λόγον δυνάμεως ἐλεήσει τὸν ἴσον αὐτοῦ</b>. τίς ἀποκαλύψει πρόσωπον ἐνδύσεως αὐτοῦ; εἰς δὲ <b>πτύξιν θώρακος αὐτοῦ</b> τίς ἂν εἰσέλθοι; πύλας προσώπου αὐτοῦ τίς ἀνοίξει; <b>κύκλῳ ὀδόντων αὐτοῦ φόβος. τὰ ἔγκατα αὐτοῦ ἀσπίδες χάλκειαι, σύνδεσμος δὲ αὐτοῦ ὥσπερ σμιρίτης λίθος· εἷς τοῦ ἑνὸς κολλῶνται, πνεῦμα δὲ οὐ μὴ διέλθῃ αὐτόν· ἀνὴρ τῷ ἀδελφῷ αὐτοῦ προσκολληθήσεται, συνέχονται καὶ οὐ μὴ ἀποσπασθῶσιν</b>. ἐν πταρμῷ αὐτοῦ ἐπιφαύσκεται φέγγος, <b>οἱ δὲ ὀφθαλμοὶ αὐτοῦ εἶδος ἑωσφόρου. ἐκ στόματος αὐτοῦ ἐκπορεύονται λαμπάδες καιόμεναι καὶ διαρριπτοῦνται ἐσχάραι πυρός· ἐκ μυκτήρων αὐτοῦ ἐκπορεύεται καπνὸς καμίνου καιομένης πυρὶ ἀνθράκων· ἡ ψυχὴ αὐτοῦ ἄνθρακες, φλὸξ δὲ ἐκ στόματος αὐτοῦ ἐκπορεύεται. ἐν δὲ τραχήλῳ αὐτοῦ αὐλίζεται δύναμις, ἔμπροσθεν αὐτοῦ τρέχει ἀπώλεια</b>. σάρκες δὲ σώματος αὐτοῦ κεκόλληνται· καταχέει ἐπ᾿ αὐτόν, οὐ σαλευθήσεται. ἡ καρδία αὐτοῦ πέπηγεν ὡς λίθος, ἕστηκεν δὲ ὥσπερ ἄκμων ἀνήλατος. <b>στραφέντος δὲ αὐτοῦ φόβος θηρίοις τετράποσιν ἐπὶ γῆς ἁλλομένοις. ἐὰν συναντήσωσιν αὐτῷ λόγχαι, οὐδὲν μὴ ποιήσωσιν δόρυ ἐπηρμένον καὶ θώρακα· ἥγηται μὲν γὰρ σίδηρον ἄχυρα, χαλκὸν δὲ ὥσπερ ξύλον σαθρόν· οὐ μὴ τρώσῃ αὐτὸν τόξον χάλκειον, ἥγηται μὲν πετροβόλον χόρτον· ὡς καλάμη ἐλογίσθησαν σφῦραι, καταγελᾷ δὲ σεισμοῦ πυρφόρου. ἡ στρωμνὴ αὐτοῦ ὀβελίσκοι ὀξεῖς, πᾶς δὲ χρυσὸς θαλάσσης ὑπ᾿ αὐτὸν ὥσπερ πηλὸς ἀμύθητος. ἀναζεῖ τὴν ἄβυσσον ὥσπερ χαλκεῖον, ἥγηται δὲ τὴν θάλασσαν ὥσπερ ἐξάλειπτρον, τὸν δὲ τάρταρον τῆς ἀβύσσου ὥσπερ αἰχμάλωτον· ἐλογίσατο ἄβυσσον εἰς περίπατον. οὐκ ἔστιν οὐδὲν ἐπὶ τῆς γῆς ὅμοιον αὐτῷ πεποιημένον ἐγκαταπαίζεσθαι ὑπὸ τῶν ἀγγέλων μου· πᾶν ὑψηλὸν ὁρᾷ, αὐτὸς δὲ βασιλεὺς πάντων τῶν ἐν τοῖς ὕδασιν</b>.» (<a href="https://bibleox.com/el/gr-lxx-byz/iov/41/#L1,4-26">Ιωβ 41:1,4-26</a>)</blockquote>
