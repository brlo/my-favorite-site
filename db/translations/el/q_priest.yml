  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: '<h2>Η θεοσύστατη ιερωσύνη στην Παλαιά Διαθήκη</h2><p>Ιερείς είναι μόνο οι απόγονοι του Ααρών:</p><blockquote><p>«<strong>καὶ ζώσεις αὐτοὺς ταῖς ζώναις</strong> καὶ περιθήσεις αὐτοῖς τὰς κιδάρεις, καὶ <strong>ἔσται αὐτοῖς ἱερατεία ἐμοὶ εἰς τὸν αἰῶνα</strong>. καὶ τελειώσεις τὰς χεῖρας Ααρων καὶ τὰς χεῖρας τῶν υἱῶν αὐτοῦ.» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/29/#L9">Έξ 29:9</a>)</p></blockquote><p>Η ιερωσύνη μεταδίδεται μαζί με τα ιερά ενδύματα και το χρίσμα:</p><blockquote><p>«καὶ <strong>ἡ στολὴ τοῦ ἁγίου</strong>, ἥ ἐστιν Ααρων, <strong>ἔσται τοῖς υἱοῖς αὐτοῦ μετ᾿ αὐτόν</strong>, <strong>χρισθῆναι αὐτοὺς ἐν αὐτοῖς καὶ τελειῶσαι τὰς χεῖρας αὐτῶν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/29/#L29">Έξ 29:29</a>)</p></blockquote><p>Ο ξένος που πλησιάζει στα ιερατικά έργα πρέπει να πεθάνει. Το καθήκον της ιερωσύνης είναι να το επιβλέπει αυτό:</p><blockquote><p>«καὶ Ααρων καὶ τοὺς υἱοὺς αὐτοῦ καταστήσεις ἐπὶ τῆς σκηνῆς τοῦ μαρτυρίου, καὶ φυλάξουσιν τὴν ἱερατείαν αὐτῶν καὶ πάντα τὰ κατὰ τὸν βωμὸν καὶ ἔσω τοῦ καταπετάσματος· <strong>καὶ ὁ ἀλλογενὴς ὁ ἁπτόμενος ἀποθανεῖται</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/chis/3/#L10">Αρ 3:10</a>)</p></blockquote><p>Αναλυτικά:</p><blockquote><p>«<strong><mark>Καὶ εἶπεν κύριος πρὸς Ααρων λέγων Σὺ καὶ οἱ υἱοί σου</mark></strong> καὶ ὁ οἶκος πατριᾶς σου λήμψεσθε τὰς ἁμαρτίας τῶν ἁγίων, <strong>καὶ σὺ καὶ οἱ υἱοί σου</strong> λήμψεσθε τὰς ἁμαρτίας τῆς ἱερατείας ὑμῶν. καὶ <strong>τοὺς ἀδελφούς σου, φυλὴν Λευι</strong>, δῆμον τοῦ πατρός σου, προσαγάγου πρὸς σεαυτόν, <strong>καὶ προστεθήτωσάν σοι καὶ λειτουργείτωσάν σοι</strong>, <strong>καὶ σὺ καὶ οἱ υἱοί σου μετὰ σοῦ ἀπέναντι τῆς σκηνῆς τοῦ μαρτυρίου</strong>. καὶ φυλάξονται τὰς φυλακάς σου καὶ τὰς φυλακὰς τῆς σκηνῆς, πλὴν πρὸς τὰ σκεύη τὰ ἅγια καὶ πρὸς τὸ θυσιαστήριον οὐ προσελεύσονται, καὶ οὐκ ἀποθανοῦνται καὶ οὗτοι καὶ ὑμεῖς. &lt;…&gt; <strong><mark>καὶ σὺ καὶ οἱ υἱοί σου μετὰ σοῦ διατηρήσετε τὴν ἱερατείαν ὑμῶν</mark></strong> κατὰ πάντα τρόπον τοῦ θυσιαστηρίου καὶ τὸ ἔνδοθεν τοῦ καταπετάσματος καὶ λειτουργήσετε τὰς λειτουργίας <strong><mark>δόμα τῆς ἱερατείας ὑμῶν· καὶ ὁ ἀλλογενὴς ὁ προσπορευόμενος ἀποθανεῖται</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/chis/18/#L1-3,7">Αρ 18:1-3,7</a>)</p></blockquote><h2>Η αλλαγή της ιερωσύνης στην Καινή Διαθήκη</h2><p>Ο Κύριος Ιησούς Χριστός συνάπτει την Καινή Διαθήκη (<a href="https://bibleox.com/el/gr-lxx-byz/lk/22/#L20">Λκ 22:20</a> · <a href="https://bibleox.com/el/gr-lxx-byz/evr/8/#L8">Εβρ 8:8</a>), αλλάζει τον νόμο, αλλάζει την ιερωσύνη (αλλάζει, δεν την καταργεί):</p><blockquote><p>«<strong>μετατιθεμένης γὰρ τῆς ἱερωσύνης ἐξ ἀνάγκης καὶ νόμου μετάθεσις γίνεται</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/7/#L12">Εβρ 7:12</a>)</p></blockquote><p>Ο Σωτήρ στέλνει το Άγιο Πνεύμα στους αποστόλους, εγκαθιδρύοντας την ιεραρχία της ιερωσύνης κατά την τάξη του Μελχισεδέκ, και ο Ίδιος γίνεται αρχιερέας:</p><blockquote><p>«<strong>Ἰησοῦς, κατὰ τὴν τάξιν Μελχισέδεκ ἀρχιερεὺς γενόμενος εἰς τὸν αἰῶνα</strong>. Οὗτος γὰρ ὁ Μελχισέδεκ, βασιλεὺς Σαλήμ, ἱερεὺς τοῦ θεοῦ τοῦ ὑψίστου, ὁ συναντήσας Ἀβραὰμ ὑποστρέφοντι ἀπὸ τῆς κοπῆς τῶν βασιλέων καὶ εὐλογήσας αὐτόν, ᾧ καὶ δεκάτην ἀπὸ πάντων ἐμέρισεν Ἀβραάμ, πρῶτον μὲν ἑρμηνευόμενος <strong>βασιλεὺς δικαιοσύνης</strong> ἔπειτα δὲ καὶ βασιλεὺς Σαλήμ, ὅ ἐστιν <strong>βασιλεὺς εἰρήνης</strong>, ἀπάτωρ, ἀμήτωρ, ἀγενεαλόγητος, <strong>μήτε ἀρχὴν ἡμερῶν μήτε ζωῆς τέλος ἔχων, ἀφωμοιωμένος δὲ τῷ υἱῷ τοῦ θεοῦ, μένει ἱερεὺς εἰς τὸ διηνεκές</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/6/#L20">Εβρ 6:20</a> · <a href="https://bibleox.com/el/gr-lxx-byz/evr/7/#L1-3">Εβρ 7:1-3</a>)</p></blockquote><blockquote><p>«Κεφάλαιον δὲ ἐπὶ τοῖς λεγομένοις, <strong>τοιοῦτον ἔχομεν ἀρχιερέα, ὃς ἐκάθισεν ἐν δεξιᾷ τοῦ θρόνου τῆς μεγαλωσύνης ἐν τοῖς οὐρανοῖς</strong>,» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/8/#L1">Εβρ 8:1</a>)</p></blockquote><h2>Η συγκρότηση της εκκλησιαστικής ιεραρχίας</h2><p>Την ημέρα της Πεντηκοστής το Άγιο Πνεύμα στέλνεται στους αποστόλους και σε όλη την εκκλησιαστική σύναξη, σε όλη την Εκκλησία. Αλλά ακόμη και πριν από εκείνη την ημέρα ο Σωτήρ εμφανίζεται μόνο στους αποστόλους και μόνο σε αυτούς στέλνει το Άγιο Πνεύμα, δίνοντάς τους την εξουσία να συγχωρούν τις αμαρτίες ως ιερείς, δηλαδή εγκαθιδρύοντας την ιεραρχία:</p><blockquote><p>«εἶπεν οὖν αὐτοῖς πάλιν, Εἰρήνη ὑμῖν· καθὼς ἀπέσταλκέν με ὁ πατήρ, κἀγὼ πέμπω ὑμᾶς. καὶ τοῦτο εἰπὼν <strong>ἐνεφύσησεν</strong> καὶ λέγει αὐτοῖς, <strong>Λάβετε πνεῦμα ἅγιον</strong>· <strong>ἄν τινων ἀφῆτε τὰς ἁμαρτίας ἀφέωνται αὐτοῖς, ἄν τινων κρατῆτε κεκράτηνται</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/20/#L21-23">Ιω 20:21-23</a>)</p></blockquote><p>Κατά τον ίδιο τρόπο, στην Εκκλησία της Παλαιάς Διαθήκης το έργο του καθαρισμού από την αμαρτία το είχε ακριβώς η ιερωσύνη:</p><blockquote><p>«<strong>καὶ ἐξαγορεύσει τὴν ἁμαρτίαν περὶ ὧν ἡμάρτηκεν κατ᾿ αὐτῆς</strong>, καὶ οἴσει περὶ ὧν ἐπλημμέλησεν κυρίῳ, περὶ τῆς ἁμαρτίας, ἧς ἥμαρτεν, θῆλυ ἀπὸ τῶν προβάτων, ἀμνάδα ἢ χίμαιραν ἐξ αἰγῶν, περὶ ἁμαρτίας· <strong>καὶ ἐξιλάσεται περὶ αὐτοῦ ὁ ἱερεὺς περὶ τῆς ἁμαρτίας αὐτοῦ, ἧς ἥμαρτεν</strong>, καὶ ἀφεθήσεται αὐτῷ ἡ ἁμαρτία.» (<a href="https://bibleox.com/el/gr-lxx-byz/lev/5/#L5-6">Λευ 5:5-6</a>)</p></blockquote><h2>Η εξουσία της νέας ιεραρχίας</h2><p>Ο Κύριος δίνει στους αποστόλους τα κλειδιά της Βασιλείας των Ουρανών και την εξουσία να απαγορεύουν και να επιτρέπουν (να δένουν και να λύνουν):</p><blockquote><p>«δώσω σοι τὰς κλεῖδας τῆς βασιλείας τῶν οὐρανῶν, <strong>καὶ ὃ ἐὰν δήσῃς ἐπὶ τῆς γῆς ἔσται δεδεμένον ἐν τοῖς οὐρανοῖς, καὶ ὃ ἐὰν λύσῃς ἐπὶ τῆς γῆς ἔσται λελυμένον ἐν τοῖς οὐρανοῖς</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/16/#L19">Μτ 16:19</a>)</p></blockquote><blockquote><p>«Ἀμὴν λέγω ὑμῖν, <strong>ὅσα ἐὰν δήσητε ἐπὶ τῆς γῆς ἔσται δεδεμένα ἐν οὐρανῷ καὶ ὅσα ἐὰν λύσητε ἐπὶ τῆς γῆς ἔσται λελυμένα ἐν οὐρανῷ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/18/#L18">Μτ 18:18</a>)</p></blockquote><p>Τους ιερείς τους εξέλεγαν και τους χειροτονούσαν οι απόστολοι, αλλά η Γραφή λέει ότι ακριβώς το Άγιο Πνεύμα έθεσε τους πρεσβυτέρους να φροντίζουν την Εκκλησία:</p><blockquote><p>«<strong>μετεκαλέσατο τοὺς πρεσβυτέρους τῆς ἐκκλησίας</strong>. ὡς δὲ παρεγένοντο πρὸς αὐτὸν εἶπεν αὐτοῖς, Ὑμεῖς ἐπίστασθε ἀπὸ πρώτης ἡμέρας ἀφ᾿ ἧς ἐπέβην εἰς τὴν Ἀσίαν πῶς μεθ᾿ ὑμῶν τὸν πάντα χρόνον ἐγενόμην, &lt;…&gt; προσέχετε ἑαυτοῖς καὶ παντὶ τῷ ποιμνίῳ, ἐν ᾧ ὑμᾶς <strong>τὸ πνεῦμα τὸ ἅγιον ἔθετο ἐπισκόπους, ποιμαίνειν τὴν ἐκκλησίαν τοῦ θεοῦ</strong>, ἣν περιεποιήσατο διὰ τοῦ αἵματος τοῦ ἰδίου.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/20/#L17-18,28">Πραξ 20:17-18,28</a>)</p></blockquote><p>Όλα αυτά είναι εκπλήρωση της προφητείας της Παλαιάς Διαθήκης, για την οποία θα μιλήσουμε παρακάτω.</p><h2>Η προφητεία για την ιερωσύνη της Καινής Διαθήκης</h2><p>Στην Εκκλησία της Παλαιάς Διαθήκης οι ιερείς προέρχονταν μόνο από τον ιουδαϊκό λαό, από τη φυλή του Λευί, από το γένος του Ααρών. Στην Εκκλησία όμως της Καινής Διαθήκης οι ιερείς θα προέρχονται από όλα τα έθνη, όχι μόνο από τον ιουδαϊκό λαό (το γένος του Ααρών):</p><blockquote><p>«<strong>ἔρχομαι συναγαγεῖν πάντα τὰ ἔθνη καὶ τὰς γλώσσας</strong>, καὶ ἥξουσιν καὶ ὄψονται τὴν δόξαν μου. καὶ καταλείψω ἐπ᾿ αὐτῶν σημεῖα καὶ ἐξαποστελῶ ἐξ αὐτῶν σεσῳσμένους εἰς τὰ ἔθνη, εἰς Θαρσις καὶ Φουδ καὶ Λουδ καὶ Μοσοχ καὶ Θοβελ καὶ εἰς τὴν Ἑλλάδα καὶ εἰς τὰς νήσους τὰς πόρρω, <strong>οἳ οὐκ ἀκηκόασίν μου τὸ ὄνομα οὐδὲ ἑωράκασιν τὴν δόξαν μου</strong>, καὶ ἀναγγελοῦσίν μου τὴν δόξαν ἐν τοῖς ἔθνεσιν. καὶ ἄξουσιν τοὺς ἀδελφοὺς ὑμῶν ἐκ πάντων τῶν ἐθνῶν δῶρον κυρίῳ μεθ᾿ ἵππων καὶ ἁρμάτων ἐν λαμπήναις ἡμιόνων μετὰ σκιαδίων εἰς τὴν ἁγίαν πόλιν Ιερουσαλημ, εἶπεν κύριος, ὡς ἂν ἐνέγκαισαν οἱ υἱοὶ Ισραηλ ἐμοὶ τὰς θυσίας αὐτῶν μετὰ ψαλμῶν εἰς τὸν οἶκον κυρίου. <strong>καὶ ἀπ᾿ αὐτῶν λήμψομαι ἐμοὶ ἱερεῖς καὶ Λευίτας, εἶπεν κύριος</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/is/66/#L18-21">Ησ 66:18-21</a>)</p></blockquote><h2>Η διδασκαλία περί της αποστολικής διαδοχής και της χειροτονίας</h2><h3>Η χειροτονία των επισκόπων</h3><p>Ο επίσκοπος Τιμόθεος έχει ένα ιδιαίτερο χάρισμα διά της επιθέσεως των χειρών του αποστόλου, με την επίθεση των χειρών και άλλων, ήδη χειροτονημένων επισκόπων:</p><blockquote><p>«δι᾿ ἣν αἰτίαν ἀναμιμνῄσκω σε ἀναζωπυρεῖν <strong><mark>τὸ χάρισμα τοῦ θεοῦ</mark>, ὅ ἐστιν ἐν σοὶ <u><mark>διὰ</mark></u> <mark>τῆς ἐπιθέσεως τῶν χειρῶν μου</mark></strong>·» (<a href="https://bibleox.com/el/gr-lxx-byz/2tim/1/#L6">Β Τιμ 1:6</a>)</p></blockquote><blockquote><p>«μὴ ἀμέλει <strong>τοῦ ἐν σοὶ <mark>χαρίσματος</mark>, ὃ ἐδόθη σοι διὰ προφητείας <mark>μετὰ ἐπιθέσεως τῶν χειρῶν τοῦ πρεσβυτερίου</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1tim/4/#L14">Α Τιμ 4:14</a>)</p></blockquote><p>Ο μάγος Σίμων είδε ότι δεν είναι κάθε χριστιανός ικανός να επιθέτει τα χέρια για να μεταδώσει το Άγιο Πνεύμα. Κατά λέξη: δεν έχουν όλοι αυτή την εξουσία. Έφερε χρήματα στους αποστόλους για να του δώσουν και αυτώ αυτή την εξουσία (οι απόστολοι τον αναθεμάτισαν):</p><blockquote><p>«ἰδὼν δὲ ὁ Σίμων ὅτι <strong>διὰ τῆς ἐπιθέσεως τῶν χειρῶν τῶν ἀποστόλων δίδοται τὸ πνεῦμα</strong>, προσήνεγκεν αὐτοῖς χρήματα λέγων, <strong>Δότε κἀμοὶ τὴν ἐξουσίαν ταύτην</strong> ἵνα <strong><mark>ᾧ ἐὰν ἐπιθῶ τὰς χεῖρας</mark> λαμβάνῃ πνεῦμα ἅγιον</strong>. Πέτρος δὲ εἶπεν πρὸς αὐτόν, Τὸ ἀργύριόν σου σὺν σοὶ εἴη εἰς ἀπώλειαν, ὅτι <strong><mark>τὴν δωρεὰν τοῦ θεοῦ</mark></strong> ἐνόμισας διὰ χρημάτων κτᾶσθαι.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/8/#L18-20">Πραξ 8:18-20</a>)</p></blockquote><h3>Η χειροτονία του αποστόλου Παύλου</h3><blockquote><p>«λειτουργούντων δὲ αὐτῶν τῷ κυρίῳ καὶ νηστευόντων εἶπεν τὸ πνεῦμα τὸ ἅγιον, Ἀφορίσατε δή μοι τὸν Βαρναβᾶν καὶ <strong><mark>Σαῦλον</mark></strong> εἰς τὸ ἔργον ὃ προσκέκλημαι αὐτούς. τότε νηστεύσαντες καὶ προσευξάμενοι καὶ <strong><mark>ἐπιθέντες τὰς χεῖρας αὐτοῖς</mark></strong> ἀπέλυσαν.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/13/#L2-3">Πραξ 13:2-3</a>)</p></blockquote><h3>Η χειροτονία των διακόνων</h3><blockquote><p>«οὓς ἔστησαν ἐνώπιον τῶν ἀποστόλων, καὶ προσευξάμενοι <strong>ἐπέθηκαν αὐτοῖς τὰς χεῖρας</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/6/#L6">Πραξ 6:6</a> · <a href="https://bibleox.com/el/gr-lxx-byz/act/21/#L8">Πραξ 21:8</a>)</p></blockquote><h3>Η διδασκαλία περί της χειροτονίας</h3><p>Η αποστολική διδασκαλία περί της επιθέσεως των χειρών:</p><blockquote><p>«βαπτισμῶν <strong>διδαχῆς</strong>, <strong>ἐπιθέσεώς τε χειρῶν</strong>, ἀναστάσεώς τε νεκρῶν, καὶ κρίματος αἰωνίου.» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/6/#L2">Εβρ 6:2</a>)</p></blockquote><p>Προειδοποίηση να μη βιάζεται κανείς να χειροτονεί (σε ιερείς):</p><blockquote><p>«<strong>Χεῖρας ταχέως μηδενὶ ἐπιτίθει</strong>, μηδὲ κοινώνει ἁμαρτίαις ἀλλοτρίαις· σεαυτὸν ἁγνὸν τήρει.» (<a href="https://bibleox.com/el/gr-lxx-byz/1tim/5/#L22">Α Τιμ 5:22</a>)</p></blockquote><h2>Επίσκοποι και πρεσβύτεροι — η διαφορά</h2><p>Οι έννοιες επίσκοπος (από το επισκοπέω — «ο εποπτεύων», «ο επιβλέπων») και πρεσβύτερος (από το πρέσβυς — «ο γηραιότερος, ο επικεφαλής της κοινότητας») έχουν μικτή χρήση και είναι κατά κάποιο τρόπο ανταλλάξιμες. Ωστόσο, τα καθήκοντα και η εξουσία συγκεκριμένων ανθρώπων φαίνονται καθαρά, όπως και αν ονομάζονται. Ο Τίτος έπρεπε να ολοκληρώσει το έργο του αποστόλου και να τοποθετήσει πρεσβυτέρους στην Κρήτη:</p><blockquote><p>«Τούτου χάριν ἀπέλιπόν σε ἐν Κρήτῃ, ἵνα τὰ λείποντα ἐπιδιορθώσῃ καὶ <strong>καταστήσῃς κατὰ πόλιν πρεσβυτέρους</strong>, ὡς ἐγώ σοι διεταξάμην,» (<a href="https://bibleox.com/el/gr-lxx-byz/tit/1/#L5">Τιτ 1:5</a>)</p></blockquote><p>Ο Τιμόθεος μπορούσε να κρίνει τους πρεσβυτέρους του, να ελέγχει και να επιτιμά τους πιστούς:</p><blockquote><p>«<strong>κατὰ πρεσβυτέρου κατηγορίαν</strong> μὴ παραδέχου, ἐκτὸς εἰ μὴ ἐπὶ δύο ἢ τριῶν μαρτύρων.» (<a href="https://bibleox.com/el/gr-lxx-byz/1tim/5/#L19">Α Τιμ 5:19</a>)</p></blockquote><blockquote><p>«κήρυξον τὸν λόγον, ἐπίστηθι εὐκαίρως ἀκαίρως, <strong>ἔλεγξον, ἐπιτίμησον</strong>, παρακάλεσον, ἐν πάσῃ μακροθυμίᾳ καὶ διδαχῇ.» (<a href="https://bibleox.com/el/gr-lxx-byz/2tim/4/#L2">Β Τιμ 4:2</a>)</p></blockquote><p>Έτσι, ο Τίτος και ο Τιμόθεος ήταν επίσκοποι με τη σημερινή έννοια, αν και ονομάζονταν πρεσβύτεροι.</p><h2>Είναι όλοι ιερείς;</h2><h3>Η παραλληλία με τα λόγια της Παλαιάς Διαθήκης</h3><p>Ο απόστολος Πέτρος επαναλαμβάνει τα λόγια της Παλαιάς Διαθήκης, ονομάζοντας όλους τους χριστιανούς βασίλειον ιεράτευμα και άγιο έθνος:</p><blockquote><p>«<strong>Ὑμεῖς δὲ γένος ἐκλεκτόν, <u>βασίλειον ἱεράτευμα</u>, <u>ἔθνος ἅγιον</u></strong>, λαὸς εἰς περιποίησιν, ὅπως τὰς ἀρετὰς ἐξαγγείλητε τοῦ ἐκ σκότους ὑμᾶς καλέσαντος εἰς τὸ θαυμαστὸν αὐτοῦ φῶς·» (<a href="https://bibleox.com/el/gr-lxx-byz/1pet/2/#L9">Α Πε 2:9</a>)</p></blockquote><p>Τα ίδια λόγια στην Παλαιά Διαθήκη απευθύνονται σε όλο τον Ισραήλ:</p><blockquote><p>«καὶ νῦν ἐὰν ἀκοῇ ἀκούσητε τῆς ἐμῆς φωνῆς καὶ φυλάξητε τὴν διαθήκην μου, ἔσεσθέ μοι λαὸς περιούσιος ἀπὸ πάντων τῶν ἐθνῶν· ἐμὴ γάρ ἐστιν πᾶσα ἡ γῆ· <strong>ὑμεῖς δὲ ἔσεσθέ μοι <u>βασίλειον ἱεράτευμα</u> καὶ <u>ἔθνος ἅγιον</u></strong>. ταῦτα τὰ ῥήματα ἐρεῖς τοῖς υἱοῖς Ισραηλ.» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/19/#L5-6">Έξ 19:5-6</a>)</p></blockquote><p>Έτσι, ο Θεός ονομάζει ήδη τον Ισραήλ της Παλαιάς Διαθήκης βασίλειον ιεράτευμα και άγιο έθνος. Ωστόσο, με τη λατρευτική έννοια, δεν ήταν όλοι οι Εβραίοι ιερείς. Κατά τον Νόμο, μόνο η ιερωσύνη του Ααρών μπορούσε να εισέλθει στη Σκηνή, ενώ οι υπόλοιποι για την είσοδο στη Σκηνή θα πλήρωναν με την ίδια τους τη ζωή, δηλαδή θα έπρεπε να πεθάνουν (<a href="https://bibleox.com/el/gr-lxx-byz/chis/3/#L10">Αρ 3:10</a> · <a href="https://bibleox.com/el/gr-lxx-byz/chis/3/#L38">Αρ 3:38</a> · <a href="https://bibleox.com/el/gr-lxx-byz/chis/18/#L7">Αρ 18:7</a>).</p><p>Αν στην Παλαιά Διαθήκη διακρίνουμε τις λέξεις, θα έχουμε βασίλειον ιεράτευμα (όχι όλοι) και άγιο έθνος (όλοι)· την ίδια διάκριση θα πρέπει να την αναγνωρίσουμε και στα λόγια του αποστόλου στην Καινή Διαθήκη: βασίλειον ιεράτευμα (όχι όλοι), άγιο έθνος (όλοι) (<a href="https://bibleox.com/el/gr-lxx-byz/1pet/2/#L9">Α Πε 2:9</a>). Τα λόγια μπορούν να κατανοηθούν και κυριολεκτικά και αλληγορικά, αλλά σε κάθε περίπτωση θα πρέπει να συνδέσουμε τις δύο αυτές φράσεις και να τις κατανοήσουμε ανάλογα, με τον ίδιο τρόπο.</p><h3>Η απόπειρα να καθιερωθεί καθολική ιερωσύνη στην Παλαιά Διαθήκη</h3><p>Στην Παλαιά Διαθήκη ο Θεός είχε καθιερώσει τάξη κατά την οποία ιερείς μπορούσαν να είναι μόνο οι απόγονοι του Ααρών:</p><blockquote><p>«καὶ ἡ στολὴ τοῦ ἁγίου, ἥ ἐστιν Ααρων, ἔσται τοῖς υἱοῖς αὐτοῦ μετ᾿ αὐτόν, χρισθῆναι αὐτοὺς ἐν αὐτοῖς καὶ τελειῶσαι τὰς χεῖρας αὐτῶν.» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/29/#L29">Έξ 29:29</a>)</p></blockquote><p>Ακόμη και από το γένος του Ααρών δεν μπορούσαν όλοι να γίνουν ιερείς:</p><blockquote><p>«<strong>πᾶς, ᾧ ἐστιν ἐν αὐτῷ μῶμος, ἐκ τοῦ σπέρματος Ααρων τοῦ ἱερέως, οὐκ ἐγγιεῖ τοῦ προσενεγκεῖν τὰς θυσίας τῷ θεῷ σου</strong>· ὅτι μῶμος ἐν αὐτῷ, τὰ δῶρα τοῦ θεοῦ οὐ προσελεύσεται προσενεγκεῖν. &lt;…&gt; πλὴν πρὸς τὸ καταπέτασμα οὐ προσελεύσεται καὶ πρὸς τὸ θυσιαστήριον οὐκ ἐγγιεῖ, ὅτι μῶμον ἔχει· <strong>καὶ οὐ βεβηλώσει τὸ ἅγιον τοῦ θεοῦ αὐτοῦ</strong>, ὅτι ἐγώ εἰμι κύριος ὁ ἁγιάζων αὐτούς.» (<a href="https://bibleox.com/el/gr-lxx-byz/lev/21/#L21,23">Λευ 21:21,23</a>)</p></blockquote><p>Εναντίον αυτής της θείας τάξεως ξεσηκώθηκαν<strong> ο Κορέ, ο Δαθάν, ο Αβειρών και ο Αυνάν</strong>, απαιτώντας από τον προφήτη Μωυσή να επιλέγονται ιερείς μέσα από όλο τον λαό, όχι μόνο από το γένος του Ααρών. Αναφέρονταν σε εκείνη ακριβώς τη φράση (<a href="https://bibleox.com/el/gr-lxx-byz/ish/19/#L5-6">Έξ 19:5-6</a>), λέγοντας ότι όλοι είναι άγιοι:</p><blockquote><p>«συνέστησαν ἐπὶ Μωυσῆν καὶ Ααρων καὶ εἶπαν Ἐχέτω ὑμῖν, ὅτι <strong>πᾶσα ἡ συναγωγὴ πάντες ἅγιοι καὶ ἐν αὐτοῖς κύριος</strong>, καὶ διὰ τί κατανίστασθε ἐπὶ τὴν συναγωγὴν κυρίου;» (<a href="https://bibleox.com/el/gr-lxx-byz/chis/16/#L3">Αρ 16:3</a>)</p></blockquote><blockquote><p>«καὶ προσηγάγετό σε καὶ πάντας τοὺς ἀδελφούς σου υἱοὺς Λευι μετὰ σοῦ, <strong>καὶ ζητεῖτε ἱερατεύειν</strong>;» (<a href="https://bibleox.com/el/gr-lxx-byz/chis/16/#L10">Αρ 16:10</a>)</p></blockquote><p>Αργότερα φάνηκε η δόξα του Θεού και η γη κατάπιε τους στασιαστές:</p><blockquote><p>«καὶ ἐπισυνέστησεν ἐπ᾿ αὐτοὺς Κορε τὴν πᾶσαν αὐτοῦ συναγωγὴν παρὰ τὴν θύραν τῆς σκηνῆς τοῦ μαρτυρίου. καὶ ὤφθη ἡ δόξα κυρίου πάσῃ τῇ συναγωγῇ. καὶ ἐλάλησεν κύριος πρὸς Μωυσῆν καὶ Ααρων λέγων Ἀποσχίσθητε ἐκ μέσου τῆς συναγωγῆς ταύτης, <strong>καὶ ἐξαναλώσω αὐτοὺς εἰς ἅπαξ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/chis/16/#L19-21">Αρ 16:19-21</a>)</p></blockquote><p>Ο Θεός είπε να πετάξουν έξω τις θυσίες των στασιαστών από τα θυμιατήρια και από τα ίδια τα θυμιατήρια να κάνουν επένδυση του θυσιαστηρίου για να θυμίζει στις μελλοντικές γενιές:</p><blockquote><p>«καὶ πρὸς Ελεαζαρ τὸν υἱὸν Ααρων τὸν ἱερέα Ἀνέλεσθε τὰ πυρεῖα τὰ χαλκᾶ ἐκ μέσου τῶν κατακεκαυμένων <strong>καὶ τὸ πῦρ τὸ ἀλλότριον τοῦτο σπεῖρον ἐκεῖ</strong>, ὅτι ἡγίασαν τὰ πυρεῖα τῶν ἁμαρτωλῶν τούτων ἐν ταῖς ψυχαῖς αὐτῶν· καὶ ποίησον αὐτὰ λεπίδας ἐλατάς, περίθεμα τῷ θυσιαστηρίῳ, ὅτι προσηνέχθησαν ἔναντι κυρίου καὶ ἡγιάσθησαν <strong>καὶ ἐγένοντο εἰς σημεῖον τοῖς υἱοῖς Ισραηλ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/chis/16/#L37-38">Αρ 16:37-38</a>)</p></blockquote><blockquote><p>«<strong>ταῦτα δὲ τυπικῶς συνέβαινεν ἐκείνοις, ἐγράφη δὲ πρὸς νουθεσίαν ἡμῶν</strong>, εἰς οὓς τὰ τέλη τῶν αἰώνων κατήντηκεν.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/10/#L11">Α Κορ 10:11</a>)</p></blockquote><p>Το ολέθριο πείσμα του Κορέ θυμάται και ο απόστολος Ιούδας:</p><blockquote><p>«οὐαὶ αὐτοῖς, ὅτι τῇ ὁδῷ τοῦ Κάϊν ἐπορεύθησαν, καὶ τῇ πλάνῃ τοῦ Βαλαὰμ μισθοῦ ἐξεχύθησαν, καὶ <strong>τῇ ἀντιλογίᾳ τοῦ Κόρε ἀπώλοντο</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/iud/1/#L11">Ιούδα 1:11</a>)</p></blockquote><p>Δίνεται και προφητεία ότι στον έσχατο καιρό θα εμφανιστούν τέτοιοι άνθρωποι:</p><blockquote><p>«ἔσται γὰρ καιρὸς ὅτε τῆς ὑγιαινούσης διδασκαλίας οὐκ ἀνέξονται, ἀλλὰ <strong>κατὰ τὰς ἰδίας ἐπιθυμίας ἑαυτοῖς ἐπισωρεύσουσιν διδασκάλους</strong> κνηθόμενοι τὴν ἀκοήν,» (<a href="https://bibleox.com/el/gr-lxx-byz/2tim/4/#L3">Β Τιμ 4:3</a>)</p></blockquote><h3>Η προφητεία για την τοποθέτηση ιερέων στην Καινή Διαθήκη</h3><p>Ήδη στην Παλαιά Διαθήκη υπήρχε προφητεία ότι στην Καινή Διαθήκη θα προέρχονται ακόμη ιερείς και λειτουργοί, αλλά μόνο από όλα τα έθνη, όχι μόνο από το γένος του Ααρών:</p><blockquote><p>«<strong>ἔρχομαι συναγαγεῖν πάντα τὰ ἔθνη καὶ τὰς γλώσσας, καὶ ἥξουσιν καὶ ὄψονται τὴν δόξαν μου. &lt;…&gt; καὶ ἀπ᾿ αὐτῶν λήμψομαι ἐμοὶ ἱερεῖς καὶ Λευίτας, εἶπεν κύριος</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/is/66/#L18,21">Ησ 66:18,21</a>)</p></blockquote><p>Στην Καινή Διαθήκη υποδεικνύεται ότι κανείς δεν μπορεί να οικειοποιηθεί μόνος του την ιερωσύνη:</p><blockquote><p>«Πᾶς γὰρ ἀρχιερεὺς ἐξ ἀνθρώπων λαμβανόμενος <strong>ὑπὲρ ἀνθρώπων καθίσταται τὰ πρὸς τὸν θεόν</strong>, ἵνα προσφέρῃ δῶρά τε καὶ θυσίας ὑπὲρ ἁμαρτιῶν, μετριοπαθεῖν δυνάμενος τοῖς ἀγνοοῦσιν καὶ πλανωμένοις, ἐπεὶ καὶ αὐτὸς περίκειται ἀσθένειαν, καὶ δι᾿ αὐτὴν ὀφείλει καθὼς περὶ τοῦ λαοῦ οὕτως καὶ περὶ αὑτοῦ προσφέρειν περὶ ἁμαρτιῶν. καὶ <strong>οὐχ ἑαυτῷ τις λαμβάνει τὴν τιμήν</strong>, ἀλλὰ καλούμενος ὑπὸ τοῦ θεοῦ, <strong>καθώσπερ καὶ Ἀαρών</strong>. <strong>Οὕτως καὶ ὁ Χριστὸς οὐχ ἑαυτὸν ἐδόξασεν γενηθῆναι ἀρχιερέα</strong>, ἀλλ᾿ ὁ λαλήσας πρὸς αὐτόν, Υἱός μου εἶ σύ, ἐγὼ σήμερον γεγέννηκά σε·» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/5/#L1-5">Εβρ 5:1-5</a>)</p></blockquote><h3>Ο Σίμων ο μάγος που πίστεψε και βαπτίσθηκε δεν έχει το χάρισμα να μεταδίδει τα δώρα του Αγίου Πνεύματος</h3><p>Ο Σίμων ο μάγος, όπως είναι γραμμένο, πίστεψε και βαπτίσθηκε:</p><blockquote><p>«ὁ δὲ <strong>Σίμων καὶ αὐτὸς ἐπίστευσεν, καὶ βαπτισθεὶς</strong> ἦν προσκαρτερῶν τῷ Φιλίππῳ, θεωρῶν τε σημεῖα καὶ δυνάμεις μεγάλας γινομένας ἐξίστατο.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/8/#L13">Πραξ 8:13</a>)</p></blockquote><p>Όταν όμως κατάλαβε ότι δεν μπορούν όλοι οι χριστιανοί να μεταδίδουν τα δώρα του Αγίου Πνεύματος, προσπάθησε να αγοράσει αυτό το χάρισμα από τους αποστόλους. Οι απόστολοι τον αναθεμάτισαν γι’ αυτό:</p><blockquote><p>«ἰδὼν δὲ ὁ <strong><mark>Σίμων</mark> ὅτι διὰ τῆς ἐπιθέσεως τῶν χειρῶν τῶν ἀποστόλων δίδοται τὸ πνεῦμα, προσήνεγκεν αὐτοῖς χρήματα</strong> λέγων, <strong><mark>Δότε κἀμοὶ τὴν ἐξουσίαν ταύτην ἵνα ᾧ ἐὰν ἐπιθῶ τὰς χεῖρας λαμβάνῃ πνεῦμα ἅγιον</mark></strong>. <strong><mark>Πέτρος δὲ εἶπεν</mark> πρὸς αὐτόν, Τὸ ἀργύριόν σου σὺν σοὶ εἴη εἰς ἀπώλειαν, ὅτι <mark>τὴν δωρεὰν τοῦ θεοῦ ἐνόμισας διὰ χρημάτων κτᾶσθαι</mark></strong>. οὐκ ἔστιν σοι μερὶς οὐδὲ κλῆρος ἐν τῷ λόγῳ τούτῳ, ἡ γὰρ καρδία σου οὐκ ἔστιν εὐθεῖα ἔναντι τοῦ θεοῦ. μετανόησον οὖν ἀπὸ τῆς κακίας σου ταύτης, καὶ δεήθητι τοῦ κυρίου εἰ ἄρα ἀφεθήσεταί σοι ἡ ἐπίνοια τῆς καρδίας σου· εἰς γὰρ χολὴν πικρίας καὶ σύνδεσμον ἀδικίας ὁρῶ σε ὄντα.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/8/#L18-23">Πραξ 8:18-23</a>)</p></blockquote><p>Από αυτό φαίνεται ότι δεν ήταν όλοι οι χριστιανοί ιερείς που είχαν την εξουσία και το δώρο του Θεού να μεταδίδουν το Άγιο Πνεύμα. Τέτοιο δώρο δεν είχε ούτε ο διάκονος Φίλιππος που βάπτισε τους Σαμαρείτες (<a href="https://bibleox.com/el/gr-lxx-byz/act/21/#L8">Πραξ 21:8</a>). Και όσοι έχουν αυτό το δώρο το έλαβαν διά της επιθέσεως των χειρών των αποστόλων (<a href="https://bibleox.com/el/gr-lxx-byz/2tim/1/#L6">Β Τιμ 1:6</a>) και της ιερωσύνης (<a href="https://bibleox.com/el/gr-lxx-byz/1tim/4/#L14">Α Τιμ 4:14</a>).</p><p>Λοιπόν:</p><ul><li><p>Δεν έλαβαν όλοι την εντολή να διδάσκουν και να βαπτίζουν: «<strong>πορευθέντες</strong> ουν <strong>μαθητεύσατε</strong> πάντα τα έθνη, <strong>βαπτίζοντες</strong> αυτούς εις το όνομα του πατρός και του υιού και του αγίου πνεύματος» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/28/#L19">Μτ 28:19</a>)</p></li><li><p>Δεν έλαβαν όλοι την εντολή: «<strong>τούτο</strong> <strong>ποιείτε</strong> εις την εμήν ανάμνησιν» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/22/#L19">Λκ 22:19</a> · <a href="https://bibleox.com/el/gr-lxx-byz/1kor/11/#L24">Α Κορ 11:24</a>)</p></li><li><p>Δεν δόθηκε σε όλους η εξουσία να δένουν και να λύνουν: «όσα εάν <strong>δήσητε</strong> επί της γης έσται δεδεμένα εν ουρανώ και όσα εάν <strong>λύσητε</strong> επί της γης έσται λελυμένα εν ουρανώ» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/18/#L18">Μτ 18:18</a>)</p></li><li><p>Δεν δόθηκε σε όλους η εξουσία να συγχωρούν και να μη συγχωρούν αμαρτίες: «αν τινων <strong>αφήτε τας αμαρτίας</strong> αφέωνται αυτοίς, αν τινων <strong>κρατήτε</strong> κεκράτηνται» (<a href="https://bibleox.com/el/gr-lxx-byz/in/20/#L23">Ιω 20:23</a>)</p></li><li><p>Δεν δόθηκε σε όλους η εξουσία να επιθέτουν τα χέρια για να μεταδώσουν το Άγιο Πνεύμα: «<strong>διά της επιθέσεως των χειρών των αποστόλων δίδοται το πνεύμα</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/act/8/#L18">Πραξ 8:18</a>)</p></li><li><p>Ακριβώς τους πρεσβυτέρους προστάζει ο απόστολος να καλούν, γιατί με την προσευχή τους και την ιερουργία (άλειψαν με λάδι) μπορούν να συγχωρεθούν οι αμαρτίες του ασθενούς: «<strong>ασθενεί τις εν υμίν; προσκαλεσάσθω τους πρεσβυτέρους της εκκλησίας</strong>, και <strong>προσευξάσθωσαν επ’ αυτόν αλείψαντες ελαίω</strong> εν τω ονόματι του κυρίου. και η ευχή της πίστεως σώσει τον κάμνοντα, και εγερεί αυτόν ο κύριος· <strong>καν αμαρτίας η πεποιηκώς, αφεθήσεται αυτώ</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/iak/5/#L14-15">Ιακ 5:14-15</a>)</p></li></ul><h2>Το βασίλειον ιεράτευμα — πώς να το κατανοήσουμε;</h2><p>Τόσο στην Παλαιά όσο και στην Καινή Διαθήκη, κάθε πιστός καλείται να είναι ιερέας στον δικό του ναό — στο σώμα του. <a href="https://bibleox.com/el/el/w/%CE%9F_%CE%AC%CE%BD%CE%B8%CF%81%CF%89%CF%80%CE%BF%CF%82_%CE%B5%CE%AF%CE%BD%CE%B1%CE%B9_%CE%BD%CE%B1%CF%8C%CF%82_%CF%84%CE%BF%CF%85_%CE%98%CE%B5%CE%BF%CF%8D">Ο άνθρωπος είναι ναός του Θεού</a>, και ιερέας είναι εκείνος που σε αυτόν τον ναό προσφέρει θυσία στον Θεό. Ακριβώς από αυτή τη σκέψη ξεκινάει ο απόστολος Πέτρος, πριν μιλήσει για το βασίλειον ιεράτευμα:</p><blockquote><p>«<strong>καὶ αὐτοὶ ὡς λίθοι ζῶντες οἰκοδομεῖσθε <mark>οἶκος</mark> πνευματικὸς εἰς ἱεράτευμα ἅγιον</strong>, <strong>ἀνενέγκαι πνευματικὰς θυσίας</strong> εὐπροσδέκτους θεῷ διὰ Ἰησοῦ Χριστοῦ.» (<a href="https://bibleox.com/el/gr-lxx-byz/1pet/2/#L5">Α Πε 2:5</a>)</p></blockquote><p>Μιλώντας για το βασίλειον ιεράτευμα, ο απόστολος Πέτρος στην ίδια επιστολή μιλάει και για τους ποιμένες και για την ανάγκη να τους υπακούουν:</p><blockquote><p>«Ὁμοίως, νεώτεροι, <strong>ὑποτάγητε πρεσβυτέροις</strong>. πάντες δὲ ἀλλήλοις τὴν ταπεινοφροσύνην ἐγκομβώσασθε, ὅτι <strong>Ὁ θεὸς ὑπερηφάνοις ἀντιτάσσεται, ταπεινοῖς δὲ δίδωσιν χάριν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1pet/5/#L5">Α Πε 5:5</a>)</p></blockquote><p>Υπάρχει και άλλο λόγιο για τους χριστιανούς ως ιερείς:</p><blockquote><p>«καὶ ἀπὸ Ἰησοῦ Χριστοῦ, ὁ μάρτυς ὁ πιστός, ὁ πρωτότοκος τῶν νεκρῶν καὶ ὁ ἄρχων τῶν βασιλέων τῆς γῆς. Τῷ ἀγαπῶντι ἡμᾶς καὶ λύσαντι ἡμᾶς ἐκ τῶν ἁμαρτιῶν ἡμῶν ἐν τῷ αἵματι αὐτοῦ — καὶ <strong>ἐποίησεν ἡμᾶς βασιλείαν, ἱερεῖς τῷ θεῷ καὶ πατρὶ αὐτοῦ</strong> — αὐτῷ ἡ δόξα καὶ τὸ κράτος εἰς τοὺς αἰῶνας [τῶν αἰώνων]· ἀμήν.» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/1/#L5-6">Απ 1:5-6</a> · <a href="https://bibleox.com/el/gr-lxx-byz/otkr/5/#L9-10">Απ 5:9-10</a> · <a href="https://bibleox.com/el/gr-lxx-byz/otkr/20/#L6">Απ 20:6</a>)</p></blockquote><p>Κατά την ίδια έννοια που ο χριστιανός είναι βασιλιάς, είναι και ιερέας. Αν τώρα δεν εξουσιάζει τους ανθρώπους που είναι έξω από την Εκκλησία, τότε δεν είναι ούτε ιερέας γι’ αυτούς. Μια τέτοια ερμηνεία είναι έντιμη ως προς το πλαίσιο και ανταποκρίνεται στην κοινή λογική.</p><p>Ο χριστιανός καλείται να βασιλεύει στο σώμα του, κάνοντας το νου του να βασιλεύει πάνω στις επιθυμίες του σώματός του, και αφού καθαρίσει αυτόν τον ναό του Θεού (το σώμα και την καρδιά του), πρέπει να προσφέρει εκεί θυσίες ευάρεστες στον Θεό: καθαρούς λογισμούς, λόγια, έργα, προσευχές και ύμνους.</p><h2>Ο σεβασμός προς τους ιερείς</h2><blockquote><p>«<strong>Οἱ καλῶς προεστῶτες πρεσβύτεροι διπλῆς τιμῆς ἀξιούσθωσαν</strong>, μάλιστα οἱ κοπιῶντες ἐν λόγῳ καὶ διδασκαλίᾳ·» (<a href="https://bibleox.com/el/gr-lxx-byz/1tim/5/#L17">Α Τιμ 5:17</a>)</p></blockquote><blockquote><p>«ἐν ὅλῃ ψυχῇ σου εὐλαβοῦ τὸν κύριον καὶ <strong>τοὺς ἱερεῖς αὐτοῦ θαύμαζε</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/prsir/7/#L29">Σ.Σειρ 7:29</a>)</p></blockquote><blockquote><p>«φοβοῦ τὸν κύριον καὶ <strong>δόξασον ἱερέα</strong> καὶ δὸς τὴν μερίδα αὐτῷ, καθὼς ἐντέταλταί σοι» (<a href="https://bibleox.com/el/gr-lxx-byz/prsir/7/#L31">Σ.Σειρ 7:31</a>)</p></blockquote><h2>Η ανάγκη υπακοής στην ιερωσύνη</h2><blockquote><p>«<strong><mark>Πείθεσθε τοῖς ἡγουμένοις ὑμῶν</mark> καὶ ὑπείκετε, αὐτοὶ γὰρ ἀγρυπνοῦσιν ὑπὲρ τῶν ψυχῶν ὑμῶν</strong> ὡς λόγον ἀποδώσοντες, ἵνα μετὰ χαρᾶς τοῦτο ποιῶσιν καὶ μὴ στενάζοντες, ἀλυσιτελὲς γὰρ ὑμῖν τοῦτο.» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/13/#L17">Εβρ 13:17</a>)</p></blockquote><blockquote><p>«Ὁμοίως, νεώτεροι, <strong><mark>ὑποτάγητε</mark> <mark>πρεσβυτέροις</mark></strong>. πάντες δὲ ἀλλήλοις τὴν ταπεινοφροσύνην ἐγκομβώσασθε, ὅτι <strong>Ὁ θεὸς ὑπερηφάνοις ἀντιτάσσεται, ταπεινοῖς δὲ δίδωσιν χάριν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1pet/5/#L5">Α Πε 5:5</a>)</p></blockquote><p>Στην Παλαιά Διαθήκη, η ανυπακοή στον ιερέα-κριτή είναι θανάσιμο αμάρτημα:</p><blockquote><p>«καὶ ὁ ἄνθρωπος, ὃς ἂν ποιήσῃ ἐν ὑπερηφανίᾳ <strong>τοῦ μὴ ὑπακοῦσαι τοῦ ἱερέως</strong> τοῦ παρεστηκότος λειτουργεῖν ἐπὶ τῷ ὀνόματι κυρίου τοῦ θεοῦ σου ἢ τοῦ κριτοῦ, ὃς ἂν ᾖ ἐν ταῖς ἡμέραις ἐκείναις, καὶ <strong>ἀποθανεῖται ὁ ἄνθρωπος ἐκεῖνος</strong>, καὶ ἐξαρεῖς τὸν πονηρὸν ἐξ Ισραηλ·» (<a href="https://bibleox.com/el/gr-lxx-byz/vtor/17/#L12">Δτ 17:12</a>)</p></blockquote><h2>Κριτική</h2><h3>Η κάθοδος του Αγίου Πνεύματος διά της επιθέσεως των χειρών — είναι απλώς η αντίληψη του Σίμωνα;</h3><p>Οι Ορθόδοξοι δείχνουν στη Γραφή χωρία για το ιδιαίτερο χάρισμα της μετάδοσης του Αγίου Πνεύματος διά της επιθέσεως των χειρών. Μεταξύ αυτών των χωρίων είναι και η περίπτωση του μάγου Σίμωνα.</p><p>Ο μάγος Σίμων είδε ότι δεν είναι κάθε χριστιανός ικανός να επιθέτει τα χέρια για να μεταδώσει το Άγιο Πνεύμα. Κατά λέξη: δεν έχουν όλοι αυτή την εξουσία. Έφερε χρήματα στους αποστόλους για να του δώσουν και αυτώ αυτή την εξουσία (οι απόστολοι τον αναθεμάτισαν):</p><blockquote><p>«ἰδὼν δὲ ὁ Σίμων ὅτι <strong>διὰ τῆς ἐπιθέσεως τῶν χειρῶν τῶν ἀποστόλων δίδοται τὸ πνεῦμα</strong>, προσήνεγκεν αὐτοῖς χρήματα λέγων, <strong>Δότε κἀμοὶ τὴν ἐξουσίαν ταύτην</strong> ἵνα <strong><mark>ᾧ ἐὰν ἐπιθῶ τὰς χεῖρας</mark> λαμβάνῃ πνεῦμα ἅγιον</strong>. Πέτρος δὲ εἶπεν πρὸς αὐτόν, Τὸ ἀργύριόν σου σὺν σοὶ εἴη εἰς ἀπώλειαν, ὅτι <strong><mark>τὴν δωρεὰν τοῦ θεοῦ</mark></strong> ἐνόμισας διὰ χρημάτων κτᾶσθαι.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/8/#L18-20">Πραξ 8:18-20</a>)</p></blockquote><p>Οι κριτικοί λένε ότι αυτό είναι απλώς η εσφαλμένη αντίληψη του μάγου Σίμωνα. Δηλαδή, ήταν μάγος, γι’ αυτό τα κατάλαβε όλα λάθος.</p><p>Και ο απόστολος Παύλος ήταν επίσης μάγος;</p><blockquote><p>«δι᾿ ἣν αἰτίαν ἀναμιμνῄσκω σε ἀναζωπυρεῖν <strong><mark>τὸ χάρισμα τοῦ θεοῦ</mark>, ὅ ἐστιν ἐν σοὶ <mark>διὰ τῆς ἐπιθέσεως τῶν χειρῶν μου</mark></strong>·» (<a href="https://bibleox.com/el/gr-lxx-byz/2tim/1/#L6">Β Τιμ 1:6</a>)</p></blockquote><blockquote><p>«μὴ ἀμέλει <strong>τοῦ ἐν σοὶ <mark>χαρίσματος</mark>, ὃ ἐδόθη σοι διὰ προφητείας <mark>μετὰ ἐπιθέσεως τῶν χειρῶν τοῦ πρεσβυτερίου</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1tim/4/#L14">Α Τιμ 4:14</a>)</p></blockquote><p>Ο απόστολος όμως λέει ευθέως ότι το δώρο του Θεού δίνεται διά της χειροτονίας του.</p><p>Ας επιστρέψουμε όμως στην περίπτωση του Σίμωνα. Αυτή την αφήγηση από τις Πράξεις των αποστόλων τη γράφει ο ευαγγελιστής Λουκάς (<a href="https://bibleox.com/el/gr-lxx-byz/lk/1/#L3">Λκ 1:3</a> · <a href="https://bibleox.com/el/gr-lxx-byz/act/1/#L1">Πραξ 1:1</a>). Δεν γράφει για κάποια δήθεν εσφαλμένη κατανόηση των γεγονότων από τον μάγο Σίμωνα, αλλά ότι ο Σίμων απλώς το είδε αυτό. Και τι είδε; Ο ευαγγελιστής Λουκάς γράφει ότι: «<em>διά της επιθέσεως των χειρών των αποστόλων δίδοται το πνεύμα</em>» — να, τι είδε. Δεν το λέει ο Σίμων, αλλά ο ευαγγελιστής Λουκάς. Στη συνέχεια από τα λόγια του αποστόλου Πέτρου γίνεται σαφές ότι αυτό είναι πράγματι έτσι: ο απόστολος μπορεί να μεταδώσει αυτό το δώρο του Θεού, αλλά κατηγορεί τον Σίμωνα ακριβώς επειδή θέλησε να αποκτήσει <strong>το δώρο του Θεού</strong> <strong><u>με χρήματα</u>.</strong></p><h3>Η χειροτονία του αποστόλου Παύλου δεν έγινε από ανθρώπους;</h3><p>Οι Ορθόδοξοι δείχνουν ότι τον απόστολο Παύλο για τη διακονία του τον χειροτόνησε η Εκκλησία:</p><blockquote><p>«λειτουργούντων δὲ αὐτῶν τῷ κυρίῳ καὶ νηστευόντων εἶπεν τὸ πνεῦμα τὸ ἅγιον, Ἀφορίσατε δή μοι τὸν Βαρναβᾶν καὶ <strong><mark>Σαῦλον</mark></strong> εἰς τὸ ἔργον ὃ προσκέκλημαι αὐτούς. τότε νηστεύσαντες καὶ προσευξάμενοι καὶ <strong><mark>ἐπιθέντες τὰς χεῖρας αὐτοῖς</mark></strong> ἀπέλυσαν.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/13/#L2-3">Πραξ 13:2-3</a>)</p></blockquote><p>Οι κριτικοί αντιτείνουν ότι ο απόστολος Παύλος δεν χειροτονήθηκε από ανθρώπους, επικαλούμενοι το χωρίο:</p><blockquote><p>«<strong>Παῦλος ἀπόστολος, <mark>οὐκ ἀπ᾿ ἀνθρώπων οὐδὲ δι᾿ ἀνθρώπου</mark></strong> ἀλλὰ διὰ Ἰησοῦ Χριστοῦ καὶ θεοῦ πατρὸς τοῦ ἐγείραντος αὐτὸν ἐκ νεκρῶν,» (<a href="https://bibleox.com/el/gr-lxx-byz/gal/1/#L1">Γαλ 1:1</a>)</p></blockquote><p>Η ένσταση όμως αυτή είναι αβάσιμη, γιατί εδώ γίνεται λόγος μόνο για τον τρόπο της εκλογής, όχι για τη μετάδοση του δώρου του Θεού.</p><p>Πριν από την επίθεση των χειρών στον Σαύλο, τον εκλέγει πράγματι το Ίδιο το Άγιο Πνεύμα και προστάζει την Εκκλησία να τον ξεχωρίσει για τη διακονία στην οποία, όπως είναι γραμμένο, το Άγιο Πνεύμα τον κάλεσε. Γιατί οι κριτικοί επικαλούνται αυτό το χωρίο — δεν είναι κατανοητό, γιατί δεν υπάρχει αντίφαση. Ο Σαύλος εκλέχθηκε όχι από ανθρώπους και όχι μέσω ανθρώπων, αλλά το Ίδιο το Άγιο Πνεύμα τον εκλέγει, προστάζοντας την Εκκλησία να τον ξεχωρίσει για τη διακονία, και μετά η Εκκλησία χειροτονεί τον Σαύλο:</p><blockquote><p>«λειτουργούντων δὲ αὐτῶν τῷ κυρίῳ καὶ νηστευόντων <strong><mark>εἶπεν τὸ πνεῦμα τὸ ἅγιον</mark>, <mark>Ἀφορίσατε</mark></strong> δή μοι τὸν Βαρναβᾶν καὶ <strong><mark>Σαῦλον</mark></strong> <strong>εἰς τὸ ἔργον ὃ <mark>προσκέκλημαι</mark> αὐτούς</strong>. <strong><mark>τότε</mark></strong> νηστεύσαντες καὶ προσευξάμενοι καὶ <strong><mark>ἐπιθέντες τὰς χεῖρας αὐτοῖς</mark></strong> ἀπέλυσαν.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/13/#L2-3">Πραξ 13:2-3</a>)</p></blockquote><p>Έτσι, την εκλογή την κάνει το Άγιο Πνεύμα, και η χάρη στέλνεται όχι χωρίς την Εκκλησία, αλλά μέσω αυτής — με την επίθεση των χειρών των λειτουργών της.</p><p>Οι κριτικοί προσπαθούν να δικαιολογήσουν την έλλειψη οποιασδήποτε άμεσης σχέσης των κοινοτήτων που δημιούργησαν με τους πρώτους χριστιανούς, καθώς και την αυτόνομη εκλογή ποιμένων και διδασκάλων από μέρους τους. Είναι φανερό ότι άνθρωποι που οι ίδιοι δεν έχουν από τον Θεό εξουσία να καθοδηγούν και να διδάσκουν την Εκκλησία, δεν μπορούσαν να δώσουν σε κανέναν τέτοια εξουσία. Αλλά γι’ αυτούς έχει σημασία να δείξουν ως πιθανό ότι το Άγιο Πνεύμα θα μπορούσε να το κάνει έτσι — ότι θα μπορούσε να θέσει τους ποιμένες τους στη διακονία χωρίς καμία σχέση με την Εκκλησία που υπήρχε ήδη πριν από αυτούς.</p><p>Ωστόσο, αν και το Άγιο Πνεύμα είναι ελεύθερο να κάνει ό,τι θέλει, δεν βλέπουμε στη Γραφή ούτε μία περίπτωση όπου ο Θεός έθεσε σε διακονία και έσωσε ανθρώπους χωριστά από τη μία και ορατή Εκκλησία που δημιούργησε ο Χριστός.</p><p>Τον Σαύλο τον εξέλεξε ο Θεός, και αν και ασφαλώς μπορούσε ο Ίδιος να τον θέσει στη διακονία, δεν θέλησε να το κάνει χωρίς την Εκκλησία του. Το ίδιο βλέπουμε και με το βάπτισμα των πρώτων εθνικών — του Αιθίοπα ευνούχου (<a href="https://bibleox.com/el/gr-lxx-byz/act/8/#L27">Πραξ 8:27</a>) και του εκατόνταρχου Κορνήλιου (<a href="https://bibleox.com/el/gr-lxx-byz/act/10/#L1">Πραξ 10:1</a>).</p><ol><li><p>Ο Αιθίοπας ευνούχος διάβαζε τη Γραφή, αλλά δεν την καταλάβαινε. <strong>Ο Θεός μπορούσε ο Ίδιος</strong> να καθοδηγήσει τον ευνούχο και να του μεταδώσει τη σωτήρια χάρη του Βαπτίσματος, <strong>αλλά δεν το κάνει αυτό χωριστά από την Εκκλησία</strong>. Ο Θεός στέλνει στον ευνούχο την Εκκλησία, που τον διδάσκει να καταλαβαίνει τη Γραφή και του μεταδίδει τη χάρη στο Βάπτισμα.</p></li><li><p>Ο εκατόνταρχος Κορνήλιος προσευχόταν στον Θεό και έκανε καλά έργα. <strong>Ο Θεός μπορούσε ο Ίδιος</strong> να μεταδώσει στον Κορνήλιο τη σωτήρια χάρη, <strong>αλλά δεν το κάνει αυτό χωριστά από την Εκκλησία</strong>. Αντί γι’ αυτό, του στέλνει έναν άγγελο και του προστάζει να βρει την Εκκλησία (στο πρόσωπο του αποστόλου Πέτρου). Όταν έρχεται ο απόστολος, τότε μόνο κατεβαίνει το Άγιο Πνεύμα στον Κορνήλιο, αν και θα μπορούσε εξίσου να κατέβει και νωρίτερα χωρίς τον απόστολο, αλλά δεν θέλησε να το κάνει.</p></li><li><p>Ο διώκτης των χριστιανών Σαύλος (ο μελλοντικός απόστολος Παύλος) πηγαίνει στη Δαμασκό για να διώξει τους χριστιανούς. Ο Χριστός του εμφανίζεται με εκτυφλωτικό φως, ο Σαύλος τον ρωτάει τι να κάνει. Ο Χριστός <strong>ο Θεός μπορούσε ο Ίδιος</strong> να δώσει τη χάρη στον Σαύλο, <strong>αλλά δεν το κάνει αυτό χωριστά από την Εκκλησία</strong>, αλλά του προστάζει να βρει στη Δαμασκό την Εκκλησία (στο πρόσωπο του αποστόλου Ανανία) και μόνο εκεί ο Σαύλος, μέσω της Εκκλησίας, λαμβάνει τη θεραπεία (<a href="https://bibleox.com/el/gr-lxx-byz/act/9/#L17">Πραξ 9:17</a>), τη χάρη του Αγίου Πνεύματος (<a href="https://bibleox.com/el/gr-lxx-byz/act/9/#L17">Πραξ 9:17</a>) και τη σωτήρια χάρη του Βαπτίσματος που έπλυνε τις αμαρτίες του (<a href="https://bibleox.com/el/gr-lxx-byz/act/22/#L16">Πραξ 22:16</a>).</p></li></ol><p>Κατά τον ίδιο τρόπο σε όλες τις περιπτώσεις, όπως και με τη χειροτονία του Σαύλου για το ιδιαίτερο αποστολικό έργο: ο Θεός ο Ίδιος εκλέγει τον Σαύλο και ο Θεός μπορούσε ο Ίδιος να του μεταδώσει το δώρο του, αλλά δεν το κάνει αυτό χωριστά από την Εκκλησία του. Το Άγιο Πνεύμα απευθύνεται στην Εκκλησία και η Εκκλησία χειροτονεί τον Σαύλο (<a href="https://bibleox.com/el/gr-lxx-byz/act/13/#L2-3">Πραξ 13:2-3</a>).</p><p>Έτσι, όλες οι αξιώσεις των κοινοτήτων που είναι χωρισμένες από την Εκκλησία για μια ιδιαίτερη, χωριστή από την Εκκλησία κλήση των ποιμένων τους δεν έχουν βάση στη Γραφή. Τέτοιες περιπτώσεις στη Γραφή απλώς δεν υπάρχουν.</p><h3>Η επίθεση των χειρών δανείστηκε από την ειδωλολατρία</h3><p>Όσοι δημιούργησαν μόνοι τους μια εκκλησία, πρέπει πρώτα απ’ όλα να αποδείξουν την πτώση της Εκκλησίας που δημιουργήθηκε κάποτε από τον Χριστό. Γιατί αν η Εκκλησία δεν έπεσε, τότε η νέα τους κοινότητα είναι περιττή, και απλώς πρέπει να μπει κανείς στην Εκκλησία του Χριστού. Για να αποδείξουν την πτώση της Εκκλησίας χρησιμοποιούν συχνά την τακτική της «επικόλλησης ετικετών» όσο το δυνατόν πιό φοβερών. Έτσι, η Εκκλησία κατηγορείται συχνά ότι αποστάτησε από τον Θεό στην ειδωλολατρία με το να δανειστεί ειδωλολατρικές πρακτικές, μεταξύ των οποίων αναφέρουν:</p><ul><li><p>η ύπαρξη ιερών ναών,</p></li><li><p>ιερών τόπων,</p></li><li><p>ιερών αντικειμένων,</p></li><li><p>ιερών εικόνων,</p></li><li><p>ιδιαίτερων ιερών ανθρώπων (ιερέων),</p></li><li><p>ιερών τελετών και μυστηρίων (δήθεν συνταγών επιρροής στον Θεό), μεταξύ των οποίων είναι και η επίθεση των χειρών.</p></li></ul><p>Αυτή η κατηγορία είναι εξαιρετικά παράλογη, γιατί όλα αυτά τα καθιέρωσε ο Ίδιος ο Θεός και γι’ όλα αυτά μιλάει η Γραφή με ευθύ λόγο. Τους εθνικούς τους φέρνουν εδώ μόνο και μόνο για να κολλήσουν στην Εκκλησία μια ετικέτα. Όλα αυτά τα ιερά οικοδομήματα, οι τόποι, τα αντικείμενα, οι πράξεις και οι άνθρωποι υπάρχουν στη Γραφή της Παλαιάς και της Καινής Διαθήκης. Ένα παράδειγμα:</p><ul><li><p>το ιερό</p></li></ul><h4>Η επίθεση των χειρών στην Παλαιά Διαθήκη</h4><p>Ο Ιακώβ ευλόγησε τα εγγόνια του, επιθέτοντας τα χέρια του επάνω τους με προσευχή:</p><blockquote><p><em>«ἐκτείνας δὲ Ισραηλ </em><strong><em>τὴν <mark>χεῖρα</mark> τὴν δεξιὰν <mark>ἐπέβαλεν ἐπὶ τὴν κεφαλὴν</mark></em></strong><em> </em><strong><em>Εφραιμ</em></strong><em> — οὗτος δὲ ἦν ὁ νεώτερος — καὶ </em><strong><em>τὴν ἀριστερὰν <mark>ἐπὶ τὴν κεφαλὴν</mark> Μανασση</em></strong><em>, ἐναλλὰξ τὰς χεῖρας. καὶ </em><strong><em><mark>ηὐλόγησεν</mark></em></strong><em> αὐτοὺς καὶ εἶπεν Ὁ θεός, ᾧ εὐηρέστησαν οἱ πατέρες μου ἐναντίον αὐτοῦ Αβρααμ καὶ Ισαακ, ὁ θεὸς ὁ τρέφων με ἐκ νεότητος ἕως τῆς ἡμέρας ταύτης, ὁ </em><strong><em><mark>ἄγγελος</mark></em></strong><em> ὁ ῥυόμενός με ἐκ πάντων τῶν κακῶν </em><strong><em><mark>εὐλογήσαι τὰ παιδία ταῦτα</mark></em></strong><em>, καὶ ἐπικληθήσεται ἐν αὐτοῖς τὸ ὄνομά μου καὶ τὸ ὄνομα τῶν πατέρων μου Αβρααμ καὶ Ισαακ, καὶ πληθυνθείησαν εἰς πλῆθος πολὺ ἐπὶ τῆς γῆς.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/gen/48/#L14-16"><em>Γεν 48:14-16</em></a><em>)</em></p></blockquote><p>Ο Θεός πρόσταξε τον προφήτη Μωυσή να θέσει στη διακονία τον Ιησού του Ναυή διά της επιθέσεως των χειρών:</p><blockquote><p><em>«καὶ </em><strong><em><mark>ἐλάλησεν κύριος</mark></em></strong><em> πρὸς Μωυσῆν λέγων </em><strong><em><mark>Λαβὲ</mark></em></strong><em> πρὸς σεαυτὸν τὸν </em><strong><em><mark>Ἰησοῦν υἱὸν Ναυη</mark></em></strong><em>, ἄνθρωπον, ὃς ἔχει πνεῦμα ἐν ἑαυτῷ, καὶ </em><strong><em><mark>ἐπιθήσεις τὰς χεῖράς σου ἐπ᾿ αὐτὸν</mark></em></strong><em> &lt;…&gt; καὶ ἐποίησεν Μωϋσῆς καθὰ ἐνετείλατο αὐτῷ κύριος, καὶ λαβὼν τὸν Ἰησοῦν ἔστησεν αὐτὸν ἐναντίον Ελεαζαρ τοῦ ἱερέως καὶ ἔναντι πάσης συναγωγῆς </em><strong><em><mark>καὶ ἐπέθηκεν τὰς χεῖρας αὐτοῦ ἐπ᾿ αὐτὸν</mark></em></strong><em> καὶ συνέστησεν αὐτόν, καθάπερ συνέταξεν κύριος τῷ Μωυσῇ.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/chis/27/#L18,22-23"><em>Αρ 27:18,22-23</em></a><em>)</em></p></blockquote><blockquote><p>«καὶ <strong>Ἰησοῦς υἱὸς Ναυη <mark>ἐνεπλήσθη πνεύματος συνέσεως, ἐπέθηκεν γὰρ Μωϋσῆς τὰς χεῖρας αὐτοῦ ἐπ᾿ αὐτόν</mark></strong>· καὶ εἰσήκουσαν αὐτοῦ οἱ υἱοὶ Ισραηλ καὶ ἐποίησαν καθότι ἐνετείλατο κύριος τῷ Μωυσῇ.» (<a href="https://bibleox.com/el/gr-lxx-byz/vtor/34/#L9">Δτ 34:9</a>)</p></blockquote><p>Ο Θεός πρόσταξε να τοποθετούνται στη διακονία του ναού οι Λευίτες διά της επιθέσεως των χειρών:</p><blockquote><p><em>«καὶ προσάξεις τοὺς Λευίτας ἔναντι κυρίου, καὶ </em><strong><em><mark>ἐπιθήσουσιν</mark></em></strong><em> οἱ υἱοὶ Ισραηλ τὰς </em><strong><em><mark>χεῖρας</mark></em></strong><em> αὐτῶν </em><strong><em><mark>ἐπὶ τοὺς Λευίτας</mark></em></strong><em>,» (</em><a href="https://bibleox.com/el/gr-lxx-byz/chis/8/#L10"><em>Αρ 8:10</em></a><em>)</em></p></blockquote><h4>Η επίθεση των χειρών στην Καινή Διαθήκη</h4><blockquote><p><em>«δι᾿ ἣν αἰτίαν ἀναμιμνῄσκω σε ἀναζωπυρεῖν </em><strong><em><mark>τὸ χάρισμα τοῦ θεοῦ</mark>, ὅ ἐστιν ἐν σοὶ <u><mark>διὰ</mark></u> <mark>τῆς ἐπιθέσεως τῶν χειρῶν μου</mark></em></strong><em>·» (</em><a href="https://bibleox.com/el/gr-lxx-byz/2tim/1/#L6"><em>Β Τιμ 1:6</em></a><em>)</em></p></blockquote><blockquote><p><em>«μὴ ἀμέλει </em><strong><em>τοῦ ἐν σοὶ <mark>χαρίσματος</mark>, ὃ ἐδόθη σοι διὰ προφητείας <mark>μετὰ ἐπιθέσεως τῶν χειρῶν τοῦ πρεσβυτερίου</mark></em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/1tim/4/#L14"><em>Α Τιμ 4:14</em></a><em>)</em></p></blockquote><blockquote><p><em>«βαπτισμῶν </em><strong><em><mark>διδαχῆς</mark></em></strong><em>, </em><strong><em><mark>ἐπιθέσεώς τε χειρῶν</mark></em></strong><em>, ἀναστάσεώς τε νεκρῶν, καὶ κρίματος αἰωνίου.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/evr/6/#L2"><em>Εβρ 6:2</em></a><em>)</em></p></blockquote><p>Μετά από τη μελέτη της Γραφής, προκαλούν έκπληξη οι κατηγορίες εναντίον της Εκκλησίας ότι δήθεν μετά τους αποστόλους υιοθέτησε αυτές τις πρακτικές και τη στάση απέναντί τους από τους εθνικούς, ενώ οι ίδιοι οι απόστολοι γράφουν για το δώρο του Θεού που μεταδίδεται από αυτούς <u>με</u> την επίθεση των χειρών τους, μιλώντας γι’ αυτό ως μέρος της διδασκαλίας. Όλα αυτά δεν είναι καινοτομία (ο ίδιος ο τρόπος), αλλά κάτι που υπήρχε για αιώνες στο ίδιο αυτό περιβάλλον πριν από τους αποστόλους, επειδή το καθιέρωσε όχι οι εθνικοί, αλλά ο Ίδιος ο Θεός.</p><h3>Δεν ονομάζονταν ιερείς στην Καινή Διαθήκη;</h3><p>Η λέξη «ιερωσύνη» απαντάται σε καινοδιαθηκικό πλαίσιο. Ο Χριστός έκανε αλλαγή της ιερωσύνης, όχι κατάργησή της:</p><blockquote><p>«<strong>μετατιθεμένης γὰρ τῆς <mark>ἱερωσύνης</mark></strong> ἐξ ἀνάγκης καὶ νόμου μετάθεσις γίνεται.» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/7/#L12">Εβρ 7:12</a>)</p></blockquote><p>Ο Χριστός έγινε αιώνιος αρχιερέας, αλλά οι ιερείς δεν καταργήθηκαν. Για την εκλογή και την τοποθέτησή τους μιλάει η προφητεία:</p><blockquote><p>«<strong>ἔρχομαι συναγαγεῖν <mark>πάντα τὰ ἔθνη</mark> καὶ τὰς γλώσσας</strong>, καὶ ἥξουσιν καὶ ὄψονται τὴν δόξαν μου. &lt;…&gt; <strong><mark>καὶ ἀπ᾿ αὐτῶν λήμψομαι ἐμοὶ ἱερεῖς</mark> καὶ Λευίτας, εἶπεν κύριος</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/is/66/#L18,21">Ησ 66:18,21</a>)</p></blockquote><p>Εκτός αυτού, δεν ήταν όλοι, αλλά ακριβώς οι απόστολοι ήταν στην πράξη ιερείς. Στην Παλαιά Διαθήκη ο ιερέας είχε το καθήκον να καθαρίζει τον άνθρωπο από την αμαρτία (<a href="https://bibleox.com/el/gr-lxx-byz/lev/5/#L5-6">Λευ 5:5-6</a>), έτσι και στην Καινή Διαθήκη, με τη συγκρότηση της νέας εκκλησιαστικής ιεραρχίας, της δίνεται αυτή η εξουσία — να συγχωρεί ή να μη συγχωρεί τις αμαρτίες:</p><blockquote><p>«εἶπεν οὖν αὐτοῖς πάλιν, Εἰρήνη ὑμῖν· καθὼς ἀπέσταλκέν με ὁ πατήρ, κἀγὼ πέμπω ὑμᾶς. καὶ τοῦτο εἰπὼν <strong>ἐνεφύσησεν</strong> καὶ λέγει αὐτοῖς, <strong>Λάβετε πνεῦμα ἅγιον</strong>· <strong>ἄν τινων ἀφῆτε τὰς ἁμαρτίας ἀφέωνται αὐτοῖς, ἄν τινων κρατῆτε κεκράτηνται</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/20/#L21-23">Ιω 20:21-23</a>)</p></blockquote><p>Οι αρχαιότατοι χριστιανοί επιβεβαιώνουν ότι οι πρεσβύτεροι ήταν και ιερείς.</p>'
