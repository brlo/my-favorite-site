# Папки меню раздела цитат el (Βιβλικές ρήσεις, список el-q). Загружать первым:
# bin/rails pages:import_translations FILE=db/translations/el/q_00_folders.yml
# priority верхнеуровневых — по порядку папок эталона ru (Бог=0, Церковь=1, …, Ангелы=6, Пророчества=7).
lang: el
list: el-q
folders:
  - { path: "Θεός", priority: 0 }
  - { path: "Θεός/Ο Πατέρας", priority: 0 }
  - { path: "Θεός/Το Άγιο Πνεύμα", priority: 0 }
  - { path: "Θεός/Ο Υιός", priority: 0 }
  - { path: "Άνθρωπος", priority: 4 }
  - { path: "Άνθρωπος/Η μετά θάνατον ζωή", priority: 0 }
  - { path: "Κόσμος", priority: 3 }
  - { path: "Παραβολές", priority: 5 }
  - { path: "Άγγελοι", priority: 6 }
  - { path: "Προφητείες", priority: 7 }
  - { path: "Άγγελοι/Άγιοι άγγελοι", priority: 0 }
  - { path: "Άγγελοι/Παραπεσόντες", priority: 0 }
pages: []
