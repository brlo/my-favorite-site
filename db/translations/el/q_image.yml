  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: '<h2>Η ορατή εικόνα του αοράτου</h2><h3>Το σύμπαν</h3><p>Ο Θεός δημιούργησε τον κόσμο έτσι, ώστε με το ορατό να γνωρίζεται το αόρατο· ώστε ο άνθρωπος, μέσω της θεώρησης της ορατής δημιουργίας, να γνωρίζει τον αόρατο Δημιουργό:</p><blockquote><p>«διότι <strong>τὸ γνωστὸν τοῦ θεοῦ φανερόν ἐστιν ἐν αὐτοῖς</strong>· <strong>ὁ θεὸς γὰρ αὐτοῖς ἐφανέρωσεν</strong>. <strong>τὰ γὰρ ἀόρατα αὐτοῦ</strong> ἀπὸ κτίσεως κόσμου <strong>τοῖς ποιήμασιν νοούμενα καθορᾶται</strong>, ἥ τε ἀΐδιος αὐτοῦ δύναμις καὶ θειότης, εἰς τὸ εἶναι αὐτοὺς ἀναπολογήτους·» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/1/#L19-20">Ρωμ 1:19-20</a>)</p></blockquote><h3>Ο ναός</h3><p>Ο ορατός επίγειος ναός είναι εικόνα της αόρατης ουράνιας πραγματικότητας. Στον προφήτη δίνεται η εντολή να κατασκευάσει τον ναό κατά το πρότυπο που του δείχτηκε στο όρος:</p><blockquote><p>«καὶ ποιήσεις μοι <strong>ἁγίασμα</strong>, καὶ ὀφθήσομαι ἐν ὑμῖν· καὶ ποιήσεις μοι <strong>κατὰ πάντα, ὅσα ἐγώ σοι δεικνύω ἐν τῷ ὄρει</strong>, <strong>τὸ παράδειγμα τῆς σκηνῆς</strong> καὶ τὸ παράδειγμα πάντων τῶν σκευῶν αὐτῆς· <strong>οὕτω ποιήσεις</strong>. &lt;…&gt; <strong>ὅρα ποιήσεις κατὰ τὸν τύπον τὸν δεδειγμένον σοι ἐν τῷ ὄρει</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/25/#L8-9,40">Έξ 25:8-9,40</a>)</p></blockquote><p>Ο απόστολος επισημαίνει ότι ο ναός κατασκευάστηκε κατά το πρότυπο του αληθινού αγιαστηρίου:</p><blockquote><p><em>«οὐ γὰρ εἰς </em><strong><em>χειροποίητα εἰσῆλθεν ἅγια Χριστός, ἀντίτυπα τῶν ἀληθινῶν</em></strong><em>, ἀλλ᾿ εἰς αὐτὸν τὸν οὐρανόν, νῦν ἐμφανισθῆναι τῷ προσώπῳ τοῦ θεοῦ ὑπὲρ ἡμῶν·</em>» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/9/#L24">Εβρ 9:24</a>)</p></blockquote><blockquote><p>«Ἡ <strong>σκηνὴ</strong> τοῦ μαρτυρίου ἦν τοῖς πατράσιν ἡμῶν ἐν τῇ ἐρήμῳ, καθὼς διετάξατο ὁ λαλῶν τῷ Μωϋσῇ ποιῆσαι αὐτὴν <strong>κατὰ τὸν τύπον</strong> ὃν ἑωράκει,» (<a href="https://bibleox.com/el/gr-lxx-byz/act/7/#L44">Πραξ 7:44</a>)</p></blockquote><h2>Η Παλαιά Διαθήκη — στον ναό μόνο ο Θεός και οι άγγελοι</h2><h3>Ο αόρατος Θεός</h3><p>Στον παλαιοδιαθηκικό ναό, που χτίστηκε με εντολή του Θεού, στο κεντρικότερο σημείο βρισκόταν μόνο η κιβωτός (το σεντούκι) με τα άγια, πάνω από το κάλυμμα της οποίας, ανάμεσα στα δύο χερουβίμ, ο Θεός αποκαλυπτόταν και μιλούσε:</p><blockquote><p>«καὶ <strong>γνωσθήσομαί σοι ἐκεῖθεν καὶ λαλήσω σοι ἄνωθεν τοῦ ἱλαστηρίου ἀνὰ μέσον τῶν δύο χερουβιμ</strong> τῶν ὄντων ἐπὶ τῆς κιβωτοῦ τοῦ μαρτυρίου καὶ κατὰ πάντα, ὅσα ἂν ἐντείλωμαί σοι πρὸς τοὺς υἱοὺς Ισραηλ.» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/25/#L22">Έξ 25:22</a>)</p></blockquote><h3>Οι άγιοι άγγελοι</h3><p>Ο ναός ήταν παντού γεμάτος παραστάσεις αγγέλων (χερουβίμ).</p><h4>Χερουβίμ στο κάλυμμα της κιβωτού</h4><blockquote><p>«καὶ <strong>ποιήσεις δύο χερουβιμ χρυσᾶ</strong> τορευτὰ καὶ ἐπιθήσεις αὐτὰ <strong>ἐξ ἀμφοτέρων τῶν κλιτῶν τοῦ ἱλαστηρίου</strong>· ποιηθήσονται χερουβ εἷς ἐκ τοῦ κλίτους τούτου καὶ χερουβ εἷς ἐκ τοῦ κλίτους τοῦ δευτέρου τοῦ ἱλαστηρίου· καὶ ποιήσεις τοὺς δύο χερουβιμ ἐπὶ τὰ δύο κλίτη. ἔσονται οἱ χερουβιμ ἐκτείνοντες τὰς πτέρυγας ἐπάνωθεν, συσκιάζοντες ταῖς πτέρυξιν αὐτῶν ἐπὶ τοῦ ἱλαστηρίου, καὶ τὰ πρόσωπα αὐτῶν εἰς ἄλληλα· εἰς τὸ ἱλαστήριον ἔσονται τὰ πρόσωπα τῶν χερουβιμ.» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/25/#L18-20">Έξ 25:18-20</a>)</p></blockquote><h4>Χερουβίμ αριστερά και δεξιά της κιβωτού</h4><blockquote><p>«Καὶ <strong>ἐποίησεν ἐν τῷ δαβιρ δύο χερουβιν</strong> δέκα πήχεων μέγεθος ἐσταθμωμένον. &lt;…&gt; καὶ <strong>ἀμφότερα τὰ χερουβιν ἐν μέσῳ τοῦ οἴκου τοῦ ἐσωτάτου</strong>· καὶ διεπέτασεν τὰς πτέρυγας αὐτῶν, καὶ ἥπτετο πτέρυξ μία τοῦ τοίχου, καὶ πτέρυξ ἥπτετο τοῦ τοίχου τοῦ δευτέρου, καὶ αἱ πτέρυγες αὐτῶν αἱ ἐν μέσῳ τοῦ οἴκου ἥπτοντο πτέρυξ πτέρυγος.» (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/6/#L23,27">Γ Βασ 6:23,27</a>)</p></blockquote><h4>Χερουβίμ στο καταπέτασμα</h4><blockquote><p>«καὶ ἐποίησεν τὸ <strong>καταπέτασμα</strong> ἐξ ὑακίνθου καὶ πορφύρας καὶ κοκκίνου καὶ βύσσου καὶ <strong>ὕφανεν ἐν αὐτῷ χερουβιν</strong>. —» (<a href="https://bibleox.com/el/gr-lxx-byz/2par/3/#L14">Β Παρ 3:14</a> · <a href="https://bibleox.com/el/gr-lxx-byz/1mak/1/#L22">I Μακ 1:22</a>)</p></blockquote><h4>Χερουβίμ στους τοίχους του ναού</h4><blockquote><p>«καὶ <strong>πάντας τοὺς τοίχους τοῦ οἴκου κύκλῳ ἐγκολαπτὰ ἔγραψεν γραφίδι χερουβιν</strong>, καὶ φοίνικες τῷ ἐσωτέρῳ καὶ τῷ ἐξωτέρῳ.» (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/6/#L29">Γ Βασ 6:29</a>)</p></blockquote><p>Λεπτομέρειες για τη διάταξη του ναού: <a href="https://bibleox.com/el/el/w/Ο_ναός_της_Ιερουσαλήμ">Ο ναός της Ιερουσαλήμ</a>.</p><h2>Η Καινή Διαθήκη — στον ναό ο Θεός, οι άγγελοι και οι ψυχές των δικαίων</h2><h3>Άλλαξε η ουράνια πραγματικότητα</h3><p>Ο Θεός σαρκώθηκε, έγινε ορατός, έπαθε, αναστήθηκε, ανέβηκε στον ουρανό και <u>με ορατό</u> τρόπο βασίλεψε (<a href="https://bibleox.com/el/gr-lxx-byz/mk/16/#L19">Μκ 16:19</a> · <a href="https://bibleox.com/el/gr-lxx-byz/ef/1/#L20-21">Εφ 1:20-21</a> · <a href="https://bibleox.com/el/gr-lxx-byz/otkr/3/#L21">Απ 3:21</a>).</p><h3>Ο Χριστός — Θεός</h3><blockquote><p>«Ὁ μὲν οὖν κύριος [Ἰησοῦς] μετὰ τὸ λαλῆσαι αὐτοῖς ἀνελήμφθη εἰς τὸν οὐρανὸν καὶ <strong><mark>ἐκάθισεν ἐκ δεξιῶν τοῦ θεοῦ</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mk/16/#L19">Μκ 16:19</a>)</p></blockquote><blockquote><p>«ἣν ἐνήργησεν ἐν τῷ Χριστῷ ἐγείρας αὐτὸν ἐκ νεκρῶν, καὶ <strong><mark>καθίσας ἐν δεξιᾷ αὐτοῦ ἐν τοῖς ἐπουρανίοις</mark></strong> ὑπεράνω πάσης ἀρχῆς καὶ ἐξουσίας καὶ δυνάμεως καὶ κυριότητος καὶ παντὸς ὀνόματος ὀνομαζομένου οὐ μόνον ἐν τῷ αἰῶνι τούτῳ ἀλλὰ καὶ ἐν τῷ μέλλοντι·» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/1/#L20-21">Εφ 1:20-21</a>)</p></blockquote><blockquote><p>«ὁ νικῶν δώσω αὐτῷ καθίσαι μετ᾿ ἐμοῦ <strong>ἐν τῷ θρόνῳ μου</strong>, ὡς κἀγὼ ἐνίκησα καὶ <strong><mark>ἐκάθισα μετὰ τοῦ πατρός μου ἐν τῷ θρόνῳ</mark> αὐτοῦ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/3/#L21">Απ 3:21</a>)</p></blockquote><h3>Οι άγιοι άγγελοι</h3><blockquote><p>«Καὶ ἄλλος <strong>ἄγγελος</strong> ἦλθεν καὶ ἐστάθη ἐπὶ τοῦ θυσιαστηρίου ἔχων λιβανωτὸν χρυσοῦν, καὶ ἐδόθη αὐτῷ θυμιάματα πολλὰ ἵνα δώσει ταῖς προσευχαῖς τῶν ἁγίων πάντων ἐπὶ τὸ θυσιαστήριον τὸ χρυσοῦν τὸ ἐνώπιον τοῦ θρόνου.» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/8/#L3">Απ 8:3</a>)</p></blockquote><blockquote><p>«καὶ ἐξῆλθον οἱ ἑπτὰ <strong>ἄγγελοι</strong> [οἱ] ἔχοντες τὰς ἑπτὰ πληγὰς ἐκ τοῦ ναοῦ, ἐνδεδυμένοι λίνον καθαρὸν λαμπρὸν καὶ περιεζωσμένοι περὶ τὰ στήθη ζώνας χρυσᾶς.» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/15/#L6">Απ 15:6</a>)</p></blockquote><h3>Οι ψυχές των αγίων δικαίων</h3><blockquote><p>«Καὶ ὅτε ἤνοιξεν τὴν πέμπτην σφραγῖδα, εἶδον <strong>ὑποκάτω τοῦ θυσιαστηρίου τὰς ψυχὰς τῶν ἐσφαγμένων διὰ τὸν λόγον τοῦ θεοῦ καὶ διὰ τὴν μαρτυρίαν ἣν εἶχον</strong>. καὶ ἔκραξαν φωνῇ μεγάλῃ λέγοντες, Ἕως πότε, ὁ δεσπότης ὁ ἅγιος καὶ ἀληθινός, οὐ κρίνεις καὶ ἐκδικεῖς τὸ αἷμα ἡμῶν ἐκ τῶν κατοικούντων ἐπὶ τῆς γῆς; καὶ ἐδόθη αὐτοῖς ἑκάστῳ <strong>στολὴ λευκή</strong>, καὶ ἐρρέθη αὐτοῖς ἵνα ἀναπαύσονται ἔτι χρόνον μικρόν, ἕως πληρωθῶσιν καὶ οἱ σύνδουλοι αὐτῶν καὶ <strong>οἱ ἀδελφοὶ αὐτῶν οἱ μέλλοντες ἀποκτέννεσθαι ὡς καὶ αὐτοί</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/6/#L9-11">Απ 6:9-11</a>)</p></blockquote><blockquote><p>«Καὶ εἶδον, καὶ ἰδοὺ τὸ <strong>ἀρνίον</strong> ἑστὸς ἐπὶ τὸ ὄρος Σιών, καὶ <strong>μετ᾿ αὐτοῦ ἑκατὸν τεσσαράκοντα τέσσαρες χιλιάδες</strong> ἔχουσαι τὸ ὄνομα αὐτοῦ καὶ τὸ ὄνομα τοῦ πατρὸς αὐτοῦ γεγραμμένον ἐπὶ τῶν μετώπων αὐτῶν. &lt;…&gt; καὶ ᾄδουσιν [ὡς] ᾠδὴν καινὴν ἐνώπιον τοῦ θρόνου καὶ ἐνώπιον τῶν τεσσάρων ζῴων καὶ τῶν πρεσβυτέρων· καὶ οὐδεὶς ἐδύνατο μαθεῖν τὴν ᾠδὴν εἰ μὴ αἱ ἑκατὸν τεσσαράκοντα τέσσαρες χιλιάδες, <strong>οἱ ἠγορασμένοι ἀπὸ τῆς γῆς</strong>. οὗτοί εἰσιν οἳ <strong>μετὰ γυναικῶν οὐκ ἐμολύνθησαν</strong>, παρθένοι γάρ εἰσιν. οὗτοι <strong>οἱ ἀκολουθοῦντες τῷ ἀρνίῳ ὅπου ἂν ὑπάγῃ</strong>. οὗτοι ἠγοράσθησαν ἀπὸ τῶν ἀνθρώπων ἀπαρχὴ τῷ θεῷ καὶ τῷ ἀρνίῳ, καὶ ἐν τῷ στόματι αὐτῶν οὐχ εὑρέθη ψεῦδος· ἄμωμοί εἰσιν.» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/14/#L1,3-5">Απ 14:1,3-5</a>)</p></blockquote><h3>Η ψαλμωδία</h3><blockquote><p>«καὶ ἐξαίφνης ἐγένετο σὺν τῷ ἀγγέλῳ πλῆθος στρατιᾶς οὐρανίου αἰνούντων τὸν θεὸν καὶ λεγόντων, Δόξα ἐν ὑψίστοις θεῷ καὶ ἐπὶ γῆς εἰρήνη ἐν ἀνθρώποις εὐδοκίας.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/2/#L13-14">Λκ 2:13-14</a>)</p></blockquote><blockquote><p>«Καὶ εἶδον, καὶ ἰδοὺ τὸ <strong>ἀρνίον</strong> ἑστὸς ἐπὶ τὸ ὄρος Σιών, καὶ <strong>μετ᾿ αὐτοῦ ἑκατὸν τεσσαράκοντα τέσσαρες χιλιάδες</strong> ἔχουσαι τὸ ὄνομα αὐτοῦ καὶ τὸ ὄνομα τοῦ πατρὸς αὐτοῦ γεγραμμένον ἐπὶ τῶν μετώπων αὐτῶν. &lt;…&gt; καὶ <strong>ᾄδουσιν [ὡς] ᾠδὴν καινὴν</strong> ἐνώπιον τοῦ θρόνου καὶ ἐνώπιον τῶν τεσσάρων ζῴων καὶ τῶν πρεσβυτέρων· καὶ οὐδεὶς ἐδύνατο μαθεῖν τὴν ᾠδὴν εἰ μὴ αἱ ἑκατὸν τεσσαράκοντα τέσσαρες χιλιάδες, οἱ ἠγορασμένοι ἀπὸ τῆς γῆς. οὗτοί εἰσιν οἳ μετὰ γυναικῶν οὐκ ἐμολύνθησαν, παρθένοι γάρ εἰσιν. οὗτοι οἱ ἀκολουθοῦντες τῷ ἀρνίῳ ὅπου ἂν ὑπάγῃ. οὗτοι ἠγοράσθησαν ἀπὸ τῶν ἀνθρώπων ἀπαρχὴ τῷ θεῷ καὶ τῷ ἀρνίῳ, καὶ ἐν τῷ στόματι αὐτῶν οὐχ εὑρέθη ψεῦδος· ἄμωμοί εἰσιν.» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/14/#L1,3-5">Απ 14:1,3-5</a>)</p></blockquote><h3>Η εντολή να μετρηθεί ο ουράνιος ναός</h3><blockquote><p>«Καὶ ἐδόθη μοι κάλαμος ὅμοιος ῥάβδῳ, λέγων, Ἔγειρε καὶ <strong>μέτρησον <mark>τὸν ναὸν τοῦ θεοῦ</mark></strong> καὶ τὸ θυσιαστήριον καὶ τοὺς προσκυνοῦντας ἐν αὐτῷ.» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/11/#L1">Απ 11:1</a>)</p></blockquote><h3>Ο θρόνος</h3><blockquote><p>«πεσοῦνται οἱ εἴκοσι τέσσαρες πρεσβύτεροι ἐνώπιον <strong>τοῦ καθημένου ἐπὶ τοῦ θρόνου</strong> καὶ προσκυνήσουσιν τῷ ζῶντι εἰς τοὺς αἰῶνας τῶν αἰώνων, καὶ βαλοῦσιν τοὺς στεφάνους αὐτῶν ἐνώπιον τοῦ θρόνου λέγοντες,» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/4/#L10">Απ 4:10</a>)</p></blockquote><blockquote><p>«καὶ οἱ εἴκοσι τέσσαρες πρεσβύτεροι οἳ ἐνώπιον τοῦ θεοῦ κάθηνται ἐπὶ τοὺς θρόνους αὐτῶν ἔπεσαν ἐπὶ τὰ πρόσωπα αὐτῶν καὶ προσεκύνησαν τῷ θεῷ» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/11/#L16">Απ 11:16</a>)</p></blockquote><h3>Το θυσιαστήριο</h3><blockquote><p>«Καὶ ἄλλος ἄγγελος ἦλθεν καὶ ἐστάθη <strong>ἐπὶ τοῦ θυσιαστηρίου</strong> ἔχων λιβανωτὸν χρυσοῦν, καὶ ἐδόθη αὐτῷ θυμιάματα πολλὰ ἵνα δώσει ταῖς προσευχαῖς τῶν ἁγίων πάντων ἐπὶ <strong>τὸ θυσιαστήριον</strong> τὸ χρυσοῦν <strong>τὸ ἐνώπιον τοῦ θρόνου</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/8/#L3">Απ 8:3</a>)</p></blockquote><blockquote><p>«καὶ εἴληφεν ὁ ἄγγελος τὸν λιβανωτόν, καὶ ἐγέμισεν αὐτὸν ἐκ τοῦ πυρὸς τοῦ <strong>θυσιαστηρίου</strong> καὶ ἔβαλεν εἰς τὴν γῆν· καὶ ἐγένοντο βρονταὶ καὶ φωναὶ καὶ ἀστραπαὶ καὶ σεισμός.» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/8/#L5">Απ 8:5</a>)</p></blockquote><blockquote><p>«Καὶ ὁ ἕκτος ἄγγελος ἐσάλπισεν· καὶ ἤκουσα φωνὴν μίαν ἐκ τῶν κεράτων τοῦ <strong>θυσιαστηρίου</strong> τοῦ χρυσοῦ τοῦ ἐνώπιον τοῦ θεοῦ,» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/9/#L13">Απ 9:13</a>)</p></blockquote><h3>Η επτάφωτη λυχνία</h3><blockquote><p>«καὶ ἐκ τοῦ θρόνου ἐκπορεύονται ἀστραπαὶ καὶ φωναὶ καὶ βρονταί· καὶ <strong>ἑπτὰ λαμπάδες πυρὸς καιόμεναι</strong> <strong>ἐνώπιον τοῦ θρόνου</strong>, ἅ εἰσιν τὰ ἑπτὰ πνεύματα τοῦ θεοῦ,» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/4/#L5">Απ 4:5</a>)</p></blockquote><h3>Η θυμίαση</h3><blockquote><p>«Καὶ ἄλλος ἄγγελος ἦλθεν καὶ ἐστάθη ἐπὶ τοῦ θυσιαστηρίου ἔχων <strong>λιβανωτὸν χρυσοῦν</strong>, καὶ ἐδόθη αὐτῷ <strong>θυμιάματα πολλὰ</strong> ἵνα δώσει ταῖς προσευχαῖς τῶν ἁγίων πάντων ἐπὶ τὸ θυσιαστήριον τὸ χρυσοῦν τὸ ἐνώπιον τοῦ θρόνου. &lt;…&gt; καὶ <strong>εἴληφεν ὁ ἄγγελος τὸν λιβανωτόν</strong>, καὶ ἐγέμισεν αὐτὸν ἐκ τοῦ πυρὸς τοῦ θυσιαστηρίου καὶ ἔβαλεν εἰς τὴν γῆν· καὶ ἐγένοντο βρονταὶ καὶ φωναὶ καὶ ἀστραπαὶ καὶ σεισμός.» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/8/#L3,5">Απ 8:3,5</a>)</p></blockquote><h3>Ο Ειρηναίος Λυώνος (2ος αιώνας) για τον ναό ως εικόνα της ουράνιας πραγματικότητας</h3><p>Την οικοδόμηση του ναού κατά το πρότυπο της ουράνιας πραγματικότητας την επιβεβαιώνει ο άγιος Ειρηναίος Λυώνος (2ος αιώνας). Ο Ειρηναίος αναφέρεται στην Αποκάλυψη του Ιωάννη του Θεολόγου, λέγοντας ότι στα επίγεια πράγματα αρμόζει να είναι εικόνες των ουρανίων, που δημιουργήθηκαν από τον Θεό:</p><blockquote><p><em>Γι’ αυτό, όπως Αυτός [ο Θεός] δεν έχει ανάγκη από τίποτα από αυτά [τις θυσίες], αλλά θέλει να τα κάνουμε για χάρη μας, για να μη μένουμε άκαρποι· έτσι και ο ίδιος ο Λόγος έδωσε στον λαό (τον ιουδαϊκό) την εντολή για τις προσφορές, αν και δεν τις είχε ανάγκη, για να μάθει να λατρεύει τον Θεό· έτσι και για τον ίδιο λόγο θέλει </em><strong><em>κι εμείς</em></strong><em> </em><strong><em>να προσφέρουμε δώρο στο θυσιαστήριο</em></strong><em> συχνά και αδιαλείπτως.</em></p><p><em>Άρα, στα </em><strong><em><mark>ουράνια υπάρχει θυσιαστήριο</mark></em></strong><em>, γιατί εκεί κατευθύνονται οι </em>προσευχές<em> και οι προσφορές μας, και </em><strong><em><mark>ο ναός</mark></em></strong><em>, όπως λέει ο Ιωάννης στην Αποκάλυψη: «και άνοιξε ο ναός του Θεού» (</em>Απ 11:19<em>), και η σκηνή: «ιδού γαρ, λέει, η σκηνή του Θεού, στην οποία θα κατοικήσει με τους ανθρώπους»</em> (Απ 21:3)<em>. Τα δώρα, οι προσφορές και όλες οι θυσίες ο λαός (ο ιουδαϊκός) τα έλαβε προτυπικά, όπως φάνηκε στον Μωυσή, στο όρος, από τον έναν και τον ίδιο Θεό, του οποίου το όνομα και τώρα δοξάζεται στην Εκκλησία ανάμεσα σε όλα τα έθνη. Αλλά </em><strong><em><mark>αρμόζει τα γύρω μας επίγεια πράγματα να είναι εικόνες των ουρανίων</mark></em></strong><em>, που δημιουργήθηκαν από τον ίδιο Θεό. </em><strong><em>Γιατί αλλιώς δεν μπορούσε να φέρει κοντά (στη δική μας κατανόηση) την ομοιότητα των πνευματικών πραγμάτων</em></strong><em>.</em></p></blockquote><p>(<u>Κατά αιρέσεων, βιβλίο 4, κεφ. 18-19</u>)</p><h2>Ο Θεός πρόσταξε να τιμάται ο ναός</h2><p>Ο ναός είναι εικόνα της ουράνιας πραγματικότητας. Ο Θεός πρόσταξε να τιμάται αυτή η εικόνα:</p><blockquote><p>«Τὰ σάββατά μου φυλάξεσθε καὶ <strong>ἀπὸ τῶν ἁγίων μου φοβηθήσεσθε</strong>· ἐγώ εἰμι κύριος.» (<a href="https://bibleox.com/el/gr-lxx-byz/lev/19/#L30">Λευ 19:30</a>)</p></blockquote><blockquote><p>«τὰ σάββατά μου φυλάξεσθε καὶ <strong>ἀπὸ τῶν ἁγίων μου φοβηθήσεσθε</strong>· ἐγώ εἰμι κύριος.» (<a href="https://bibleox.com/el/gr-lxx-byz/lev/26/#L2">Λευ 26:2</a>)</p></blockquote><p>Ο ναός της Καινής Διαθήκης είναι κατασκευασμένος κατά το πρότυπο από την Αποκάλυψη του Ιωάννη του Θεολόγου.</p>'
