  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: '<h2>Η παραβολή</h2><blockquote><p>«ὁ δὲ θέλων δικαιῶσαι ἑαυτὸν εἶπεν πρὸς τὸν Ἰησοῦν, Καὶ τίς ἐστίν μου πλησίον; ὑπολαβὼν ὁ Ἰησοῦς εἶπεν, Ἄνθρωπός τις κατέβαινεν ἀπὸ Ἰερουσαλὴμ εἰς Ἰεριχὼ καὶ λῃσταῖς περιέπεσεν, οἳ καὶ ἐκδύσαντες αὐτὸν καὶ πληγὰς ἐπιθέντες ἀπῆλθον ἀφέντες ἡμιθανῆ. κατὰ συγκυρίαν δὲ ἱερεύς τις κατέβαινεν ἐν τῇ ὁδῷ ἐκείνῃ, καὶ ἰδὼν αὐτὸν ἀντιπαρῆλθεν· ὁμοίως δὲ καὶ Λευίτης [γενόμενος] κατὰ τὸν τόπον ἐλθὼν καὶ ἰδὼν ἀντιπαρῆλθεν. Σαμαρίτης δέ τις ὁδεύων ἦλθεν κατ᾿ αὐτὸν καὶ ἰδὼν ἐσπλαγχνίσθη, καὶ προσελθὼν <strong>κατέδησεν τὰ <mark>τραύματα</mark></strong> αὐτοῦ ἐπιχέων ἔλαιον καὶ οἶνον, <strong>ἐπιβιβάσας δὲ αὐτὸν ἐπὶ τὸ ἴδιον <mark>κτῆνος</mark></strong> <strong>ἤγαγεν αὐτὸν εἰς <mark>πανδοχεῖον</mark> καὶ ἐπεμελήθη αὐτοῦ</strong>. καὶ ἐπὶ τὴν αὔριον ἐκβαλὼν ἔδωκεν δύο δηνάρια τῷ πανδοχεῖ καὶ εἶπεν, Ἐπιμελήθητι αὐτοῦ, καὶ ὅ τι ἂν προσδαπανήσῃς ἐγὼ ἐν τῷ ἐπανέρχεσθαί με ἀποδώσω σοι. τίς τούτων τῶν τριῶν πλησίον δοκεῖ σοι γεγονέναι τοῦ ἐμπεσόντος εἰς τοὺς λῃστάς; ὁ δὲ εἶπεν, Ὁ ποιήσας τὸ ἔλεος μετ᾿ αὐτοῦ. εἶπεν δὲ αὐτῷ ὁ Ἰησοῦς, Πορεύου καὶ σὺ ποίει ὁμοίως.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/10/#L29-37">Λκ 10:29-37</a>)</p></blockquote><h2>Ερμηνεία της παραβολής</h2><h3>Γεώργιος Μαξίμοφ, ιερέας</h3><blockquote><p>Η παραβολή του καλού Σαμαρείτου — περί τίνος πρόκειται;</p> <p>Σήμερα ακούσαμε στο ευαγγελικό ανάγνωσμα την παραβολή του καλού Σαμαρείτου. Στην αρχή περιγράφονται οι περιστάσεις στις οποίες ειπώθηκε αυτή η παραβολή: ένας νομικός ήρθε στον Χριστό για να Τον πειράξει και έθεσε το ερώτημα: «Τι πρέπει να κάνω για να σωθώ;» Όπως εξηγούν οι άγιοι Πατέρες, σκόπευε να παγιδεύσει τον Χριστό ώστε να πει λόγια που θα μπορούσαν να παρουσιαστούν ως αντίθεση στον νόμο του Μωυσή. Ωστόσο ο Ιησούς, βλέποντας την καρδιά του, ρωτά: «Τι είναι γραμμένο στον Νόμο;» Και εκείνος απαντά: «Αγάπησε τον Θεό και τον πλησίον σου». Ο Κύριος όμως του λέει: «Καλώς είπες· έτσι να κάνεις». Με αυτόν τον τρόπο, ταυτόχρονα, ματαίωσε τον δόλιο σκοπό αυτού του ανθρώπου και έδειξε το παράλογο της ερώτησής του: αφού γνωρίζεις ήδη την απάντηση στο ερώτημά σου, γιατί ρωτάς;</p> <p>Αλλά για να «δικαιώσει τον εαυτό του», όπως λέει ο ευαγγελιστής, και για να δείξει ότι δήθεν θέτει το ερώτημα όχι από δόλο αλλά από παρανόηση, ο νομικός ρωτά: «Και ποιος είναι ο πλησίον μου;» Και ο Κύριος του απαντά με την παραβολή του καλού Σαμαρείτου, στο τέλος της οποίας θέτει το ερώτημα: ποιος από αυτούς που αναφέρονται στην παραβολή, κατά τη γνώμη σου, ήταν πλησίον για τον άνθρωπο που έπεσε στα χέρια ληστών; Και ο συνομιλητής του αναγκάζεται να παραδεχτεί ότι πλησίον ήταν ο Σαμαρείτης.</p> <p>Από την πρώτη απάντηση του Κυρίου βλέπουμε, όπως έλεγε ο άγιος Θεοφάνης ο Έγκλειστος, ότι όλα όσα είναι απαραίτητα για τη σωτηρία μπορούμε να τα μάθουμε από την Αγία Γραφή. Στη συνέχεια όμως αυτός ο άνθρωπος θέτει ένα ερώτημα στο οποίο η Αγία Γραφή της Παλαιάς Διαθήκης δεν έδινε σαφή απάντηση. Και τότε ο Χριστός δείχνει ότι η ίδια η συνείδησή του μαρτυρεί για το πώς πρέπει να πράττει κανείς. Ο καθένας από εμάς, ήδη με τη φωνή αυτής της συνείδησης, γνωρίζει πώς να πράττει το σωστό και, αντίθετα, ποιες πράξεις είναι λανθασμένες και δεν είναι ευάρεστες στον Θεό. Αυτό είναι σύμβολο του πώς θα κριθούμε μετά την ανάσταση στη Φοβερή Κρίση του Χριστού. Πολλοί άγιοι έλεγαν ότι τότε η συνείδηση του ανθρώπου θα μαρτυρήσει εναντίον του, δηλαδή κατήγορος και εισαγγελέας θα είναι ο ίδιος ο άνθρωπος. Γι'' αυτό σε εκείνη τη δίκη δεν θα υπάρχουν αμφισβητήσεις και αντιρρήσεις του τύπου «εγώ δεν το έκανα, δεν το ήξερα», γιατί η συνείδηση του καθενός θα μαρτυρεί, ακριβώς όπως μαρτυρούσε η συνείδηση αυτού του νομικού. Γνωρίζαμε ότι αυτό δεν είναι ευάρεστο στον Θεό και γνωρίζαμε πώς έπρεπε να πράξουμε το σωστό, κατά συνείδηση. Και αν πράξαμε λάθος, η συνείδησή μας δεν θα μας αφήσει να δικαιολογηθούμε.</p> <p>Η παραβολή που είπε ο Κύριος, στην κυριολεκτική της ερμηνεία, λέει ότι δεν πρέπει να θεωρούμε πλησίον μόνο τον ομοεθνή και ομόφρονα, όπως νόμιζαν οι Ιουδαίοι. Ο Χριστός έδειξε στον νομικό ότι η δική του συνείδηση μαρτυρεί πως πλησίον μπορεί να είναι και εκείνος που όλοι οι Ιουδαίοι της εποχής θεωρούσαν μακρινό. Γι'' αυτό έφερε ως παράδειγμα έναν Σαμαρείτη, μολονότι οι Ιουδαίοι περιφρονούσαν τους Σαμαρείτες. Συγχρόνως ο Κύριος δείχνει σε αυτή την παραβολή ότι ακριβώς τα έργα της αγάπης, της ευσπλαχνίας και της αγαθοσύνης μπορούν να κάνουν και εμάς πλησίον σε κάθε άνθρωπο στον οποίο προσφέρουμε ευεργεσία.</p> <p>Αν μιλήσουμε για την πνευματική ερμηνεία αυτής της παραβολής, κατά την εξήγηση του μακαρίου Θεοφυλάκτου, ο άνθρωπος που έπεσε στους ληστές είναι ολόκληρη η ανθρωπότητα· ως ληστές νοούνται ο διάβολος και οι δαίμονες· ως ιερέας ή Λευίτης που προσπέρασαν τον τραυματισμένο νοείται ο παλαιός νόμος, ο οποίος μπορούσε να εξηγήσει τι είναι καλό και τι κακό, αλλά δεν έσωζε τον άνθρωπο. Και τέλος, πίσω από τη μορφή του Σαμαρείτη βρίσκεται ο ίδιος ο Κύριος Ιησούς Χριστός.</p> <p>Ως πανδοχείο, στο οποίο φέρνει τον τραυματισμένο άνθρωπο, νοείται η Εκκλησία· ο πανδοχέας συμβολίζει τους ποιμένες της Εκκλησίας· τα δύο δηνάρια που δίνει ο Σαμαρείτης για τη θεραπεία του τραυματισμένου είναι η Παλαιά και η Καινή Διαθήκη. Όπως τα αρχαία νομίσματα έφεραν πάνω τους την εικόνα του βασιλιά, έτσι και η Παλαιά και η Καινή Διαθήκη φέρουν εξίσου την εικόνα του Ουράνιου Βασιλιά, του Κυρίου μας. Το ότι περιποίησε τις πληγές του τραυματισμένου με λάδι και κρασί δηλώνει τα εκκλησιαστικά Μυστήρια: με το λάδι το Χρίσμα, με το κρασί η Θεία Ευχαριστία. Το ότι αυτό το έκανε όχι ο πανδοχέας αλλά ο Σαμαρείτης δείχνει ότι ο τελών τα Μυστήρια είναι ο ίδιος ο Χριστός και όχι οι ποιμένες. Τέλος, τα λόγια του Σαμαρείτη: «Αν ξοδέψεις κάτι περισσότερο από αυτά τα δύο δηνάρια για τη θεραπεία αυτού του ανθρώπου, εγώ θα σου το ανταποδώσω όταν επιστρέψω», αναφέρονται στους κόπους και τις δαπάνες που ανέλαβαν πολλοί ποιμένες της Εκκλησίας για το ποίμνιό τους. Και γνωρίζετε από τους βίους των αγίων ότι πολλοί όχι μόνο ξόδεψαν την περιουσία τους, αλλά και την υγεία τους και την ίδια τους τη ζωή· όλα αυτά θα τους τα ανταποδώσει ο Κύριος εκατονταπλάσια, όταν επιστρέψει με τη Δεύτερη Παρουσία Του.</p> <p>Ας οικοδομηθούμε από αυτά τα λόγια του Ευαγγελίου και ας μείνουμε κι εμείς ενωμένοι με την Εκκλησία του Χριστού, ας διδασκόμαστε από την Αγία Γραφή και ας προσπαθούμε να επιτελούμε έργα ελεημοσύνης. Η ευεργεσία φέρνει φως στην ψυχή μας και μας κάνει όμοιους με τον Χριστό. Όπως ο Κύριος έδειξε έλεος σε ολόκληρη την ανθρωπότητα και σε εμάς, έτσι κι εμείς γινόμαστε έστω και λίγο όμοιοι με τον Κύριο, όταν δείχνουμε έλεος σε όποιον έχει ανάγκη ή έχει πληγεί από συμφορά. Και βαδίζοντας έτσι σε αυτόν τον δρόμο, θα βρεθούμε εκεί όπου ο Κύριος θέλει να μας δει όλους — στη Βασιλεία των Ουρανών.</p> </blockquote><p>(<a href="https://vk.com/wall293099986_47857">πηγή</a>)</p>'
