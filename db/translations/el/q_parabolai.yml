  path: Η_παραβολή_για_την_επιλογή_της_θέσης_στον_γάμο
  title: Η παραβολή για την επιλογή της θέσης στον γάμο
  meta_desc: Η παραβολή του Ιησού Χριστού για την επιλογή της θέσης στον γάμο και την ταπείνωση.
  copy_cover: true
  menu:
    parent: Παραβολές
    title: Η παραβολή για την επιλογή της θέσης στον γάμο
    priority: 5
  update: true
  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <blockquote><p>«Ὅταν κληθῇς ὑπό τινος εἰς γάμους, <strong>μὴ κατακλιθῇς εἰς τὴν πρωτοκλισίαν</strong>, μήποτε ἐντιμότερός σου ᾖ κεκλημένος ὑπ᾿ αὐτοῦ, καὶ ἐλθὼν ὁ σὲ καὶ αὐτὸν καλέσας ἐρεῖ σοι, Δὸς τούτῳ τόπον, καὶ τότε ἄρξῃ <strong>μετὰ αἰσχύνης τὸν ἔσχατον τόπον κατέχειν</strong>. ἀλλ᾿ ὅταν κληθῇς πορευθεὶς <strong>ἀνάπεσε εἰς τὸν ἔσχατον τόπον</strong>, ἵνα ὅταν ἔλθῃ ὁ κεκληκώς σε ἐρεῖ σοι, <strong>Φίλε, προσανάβηθι ἀνώτερον· τότε ἔσται σοι δόξα ἐνώπιον πάντων τῶν συνανακειμένων σοι</strong>. ὅτι <strong><mark>πᾶς ὁ ὑψῶν ἑαυτὸν ταπεινωθήσεται καὶ ὁ ταπεινῶν ἑαυτὸν ὑψωθήσεται</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/14/#L8-11">Λκ 14:8-11</a>)</p></blockquote>
