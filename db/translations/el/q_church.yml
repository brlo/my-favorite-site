  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: '<h2>Το χριστιανικό ιδεώδες</h2><p>Το χριστιανικό ιδεώδες είναι ο μοναδικός γάμος για πάντα.</p><h2>Επιείκεια για τους λαϊκούς</h2><p>Αν η σύζυγος ή ο σύζυγος πεθάνει, τότε, αν και δεν επιδοκιμάζεται ο νέος γάμος (εξάλλου οι χριστιανοί πιστεύουν στη μετά θάνατον ζωή και στη γενική ανάσταση των νεκρών), ωστόσο επιτρέπεται ως μέτρο επιείκειας, όπως διατυπώνεται από τον απόστολο, ώστε ο άνθρωπος να μην πέσει σε κάποια βαριά αμαρτήματα και χαθεί τότε πλέον οριστικά:</p><blockquote><p>«Λέγω δὲ τοῖς ἀγάμοις καὶ <strong>ταῖς χήραις</strong>, καλὸν αὐτοῖς ἐὰν μείνωσιν ὡς κἀγώ· <strong>εἰ δὲ οὐκ ἐγκρατεύονται γαμησάτωσαν, <mark>κρεῖττον γάρ ἐστιν γαμῆσαι ἢ πυροῦσθαι</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/7/#L8-9">Α Κορ 7:8-9</a>)</p></blockquote><blockquote><p>«βούλομαι οὖν <strong>νεωτέρας γαμεῖν</strong>, τεκνογονεῖν, οἰκοδεσποτεῖν, μηδεμίαν ἀφορμὴν διδόναι τῷ ἀντικειμένῳ λοιδορίας χάριν·» (<a href="https://bibleox.com/el/gr-lxx-byz/1tim/5/#L14">Α Τιμ 5:14</a>)</p></blockquote><p>Επίσης και ο Σωτήρας, μιλώντας για την απαγόρευση του διαζυγίου, κάνει εξαίρεση για την περίπτωση πορνείας (μοιχείας):</p><blockquote><p>«Ἐρρέθη δέ, Ὃς ἂν ἀπολύσῃ τὴν γυναῖκα αὐτοῦ, δότω αὐτῇ ἀποστάσιον. ἐγὼ δὲ λέγω ὑμῖν ὅτι πᾶς ὁ ἀπολύων τὴν γυναῖκα αὐτοῦ <strong>παρεκτὸς λόγου πορνείας</strong> ποιεῖ αὐτὴν μοιχευθῆναι, καὶ ὃς ἐὰν ἀπολελυμένην γαμήσῃ μοιχᾶται.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/5/#L31-32">Μτ 5:31-32</a>)</p></blockquote><p>Έτσι, αν ο σύζυγος πέθανε ή μοίχευσε, τότε είναι δυνατός ένας νέος γάμος. Αλλά και πάλι όχι απεριόριστα, αλλά μόνο ως μέτρο επιείκειας, μόνο δύο επιπλέον φορές.</p><p>Σε αυτούς τους λόγους η Εκκλησία πρόσθεσε, με ανάλογη συλλογιστική, και μερικούς ακόμη λόγους, όπως: η απειλή της ζωής από τον σύζυγο και τα παρόμοια.</p><h2>Στους ιερείς πρέπει να εκλέγεται άνδρας που βρίσκεται σε έναν μόνο γάμο</h2><p>Αξίζει να ειπωθεί αυτό, για να φανεί ότι το να παραμένει κανείς σε έναν μόνο γάμο θεωρείται πράγματι αξιότερος τρόπος ζωής:</p><blockquote><p>«δεῖ οὖν <strong>τὸν ἐπίσκοπον ἀνεπίλημπτον εἶναι, μιᾶς</strong> <strong>γυναικὸς</strong> <strong>ἄνδρα</strong>, νηφάλιον, σώφρονα, κόσμιον, φιλόξενον, διδακτικόν» (<a href="https://bibleox.com/el/gr-lxx-byz/1tim/3/#L2">Α Τιμ 3:2</a>)</p></blockquote><blockquote><p>«<strong>διάκονοι ἔστωσαν</strong> <strong>μιᾶς</strong> <strong>γυναικὸς</strong> <strong>ἄνδρες</strong>, τέκνων καλῶς προϊστάμενοι καὶ τῶν ἰδίων οἴκων·» (<a href="https://bibleox.com/el/gr-lxx-byz/1tim/3/#L12">Α Τιμ 3:12</a>)</p></blockquote><blockquote><p>«Τούτου χάριν ἀπέλιπόν σε ἐν Κρήτῃ, ἵνα τὰ λείποντα ἐπιδιορθώσῃ καὶ <strong>καταστήσῃς κατὰ πόλιν πρεσβυτέρους</strong>, ὡς ἐγώ σοι διεταξάμην, <strong>εἴ τίς ἐστιν ἀνέγκλητος, μιᾶς γυναικὸς ἀνήρ</strong>, τέκνα ἔχων πιστά, μὴ ἐν κατηγορίᾳ ἀσωτίας ἢ ἀνυπότακτα.» (<a href="https://bibleox.com/el/gr-lxx-byz/tit/1/#L5-6">Τιτ 1:5-6</a>)</p></blockquote>'
