  update: true
  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <h2>Προτυπώσεις του Σταυρού στην Παλαιά Διαθήκη</h2><ol><li><p>Η σταυρική θυσία του Χριστού — ο Αβραάμ και ο Ισαάκ</p></li><li><p>Ο Σταυρός — ο Μωυσής</p></li><li><p>Ο Σταυρός — το εβραϊκό στρατόπεδο</p></li><li><p>Ο Σταυρός και το Βάπτισμα — η διάβαση της θάλασσας</p></li><li><p>Ο Σταυρός — η ευλογία του Ιακώβ</p></li><li><p>Ο Σταυρός — το γράμμα Ταυ στο μέτωπο των πιστών στο προφητικό όραμα</p></li></ol><h2>Ο Σταυρός — όργανο νίκης και καταλλαγής</h2><blockquote><p>«καὶ ὑμᾶς νεκροὺς ὄντας τοῖς παραπτώμασιν καὶ τῇ ἀκροβυστίᾳ τῆς σαρκὸς ὑμῶν, συνεζωοποίησεν ὑμᾶς σὺν αὐτῷ, χαρισάμενος ἡμῖν πάντα τὰ παραπτώματα, ἐξαλείψας τὸ καθ᾿ ἡμῶν χειρόγραφον τοῖς δόγμασιν ὃ ἦν ὑπεναντίον ἡμῖν, καὶ αὐτὸ ἦρκεν ἐκ τοῦ μέσου <strong>προσηλώσας αὐτὸ τῷ σταυρῷ· ἀπεκδυσάμενος τὰς ἀρχὰς καὶ τὰς ἐξουσίας</strong> ἐδειγμάτισεν ἐν παρρησίᾳ, <strong>θριαμβεύσας αὐτοὺς ἐν αὐτῷ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/kol/2/#L13-15">Κολ 2:13-15</a>)</p></blockquote><blockquote><p>«καὶ <strong>ἀποκαταλλάξῃ</strong> τοὺς ἀμφοτέρους ἐν ἑνὶ σώματι τῷ θεῷ <strong>διὰ τοῦ σταυροῦ, ἀποκτείνας τὴν ἔχθραν ἐν αὐτῷ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/2/#L16">Εφ 2:16</a>)</p></blockquote><blockquote><p>«καὶ δι᾿ αὐτοῦ ἀποκαταλλάξαι τὰ πάντα εἰς αὐτόν, <strong>εἰρηνοποιήσας</strong> <strong>διὰ τοῦ αἵματος τοῦ σταυροῦ αὐτοῦ</strong>, [δι᾿ αὐτοῦ] εἴτε τὰ ἐπὶ τῆς γῆς εἴτε τὰ ἐν τοῖς οὐρανοῖς.» (<a href="https://bibleox.com/el/gr-lxx-byz/kol/1/#L20">Κολ 1:20</a>)</p></blockquote><h2>Ο Σταυρός — θυσιαστήριο, άγιο των αγίων</h2><p>Ο Κύριος Ιησούς Χριστός πρόσφερε τον εαυτό Του ως θυσία στον σταυρό — το θυσιαστήριο:</p><blockquote><p>«ὁ Χριστός, ἅπαξ προσενεχθεὶς εἰς τὸ πολλῶν ἀνενεγκεῖν ἁμαρτίας» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/9/#L28">Εβρ 9:28</a>)</p></blockquote><p>Επιβεβαίωση αυτού είναι η παλαιοδιαθηκική προτύπωση της σταυρικής θυσίας του Χριστού — η προσφορά του Ισαάκ σε θυσία. Ο Αβραάμ (ο πατέρας) προσφέρει σε θυσία τον Ισαάκ (τον μονογενή του γιο):</p><blockquote><p>«καὶ εἶπεν Λαβὲ <strong>τὸν υἱόν σου τὸν ἀγαπητόν</strong>, ὃν ἠγάπησας, τὸν Ισαακ, καὶ πορεύθητι εἰς τὴν γῆν τὴν ὑψηλὴν καὶ <strong>ἀνένεγκον αὐτὸν ἐκεῖ εἰς ὁλοκάρπωσιν ἐφ᾿ ἓν τῶν ὀρέων</strong>, ὧν ἄν σοι εἴπω.» (<a href="https://bibleox.com/el/gr-lxx-byz/gen/22/#L2">Γεν 22:2</a>)</p></blockquote><blockquote><p>«Οὕτως γὰρ ἠγάπησεν ὁ θεὸς τὸν κόσμον, ὥστε <strong>τὸν υἱὸν τὸν μονογενῆ ἔδωκεν</strong>» (<strong> </strong><a href="https://bibleox.com/el/gr-lxx-byz/in/3/#L16">Ιω 3:16</a>)</p></blockquote><p>Ο Ισαάκ μεταφέρει πάνω του στο βουνό αυτό με το οποίο θα προσφερθεί σε θυσία:</p><blockquote><p>«ἔλαβεν δὲ Αβρααμ τὰ ξύλα τῆς ὁλοκαρπώσεως καὶ <strong>ἐπέθηκεν Ισαακ</strong> τῷ υἱῷ αὐτοῦ· ἔλαβεν δὲ καὶ τὸ πῦρ μετὰ χεῖρα καὶ τὴν μάχαιραν, καὶ ἐπορεύθησαν οἱ δύο ἅμα.» (<a href="https://bibleox.com/el/gr-lxx-byz/gen/22/#L6">Γεν 22:6</a>)</p></blockquote><blockquote><p>«Παρέλαβον οὖν τὸν Ἰησοῦν· καὶ <strong>βαστάζων αὑτῷ τὸν σταυρὸν</strong> ἐξῆλθεν εἰς τὸν λεγόμενον Κρανίου Τόπον, ὃ λέγεται Ἑβραϊστὶ Γολγοθᾶ, ὅπου αὐτὸν ἐσταύρωσαν, καὶ μετ᾿ αὐτοῦ ἄλλους δύο ἐντεῦθεν καὶ ἐντεῦθεν, μέσον δὲ τὸν Ἰησοῦν.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/19/#L16-18">Ιω 19:16-18</a>)</p></blockquote><h3>Ο Αβραάμ έθεσε τον Ισαάκ πάνω στο θυσιαστήριο</h3><blockquote><p>«Ἀβραὰμ ὁ πατὴρ ἡμῶν οὐκ ἐξ ἔργων ἐδικαιώθη, <strong>ἀνενέγκας Ἰσαὰκ τὸν υἱὸν αὐτοῦ ἐπὶ τὸ θυσιαστήριον</strong>;» (<a href="https://bibleox.com/el/gr-lxx-byz/iak/2/#L21">Ιακ 2:21</a>)</p></blockquote><blockquote><p>«τοῦτον τῇ ὡρισμένῃ βουλῇ καὶ προγνώσει τοῦ θεοῦ ἔκδοτον <strong>διὰ χειρὸς ἀνόμων προσπήξαντες</strong> <strong>ἀνείλατε</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/act/2/#L23">Πραξ 2:23</a>)</p></blockquote><p>Στον σταυρό, όπως στο θυσιαστήριο, συντελείται η σωτηρία της ανθρωπότητας:</p><blockquote><p>«καὶ ἀποκαταλλάξῃ τοὺς ἀμφοτέρους ἐν ἑνὶ σώματι τῷ θεῷ <strong>διὰ τοῦ σταυροῦ, ἀποκτείνας τὴν ἔχθραν ἐν αὐτῷ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/2/#L16">Εφ 2:16</a>)</p></blockquote><h3>Το θυσιαστήριο — άγιο των αγίων</h3><blockquote><p>«ἑπτὰ ἡμέρας καθαριεῖς τὸ θυσιαστήριον καὶ ἁγιάσεις αὐτό, καὶ <strong>ἔσται τὸ θυσιαστήριον ἅγιον τοῦ ἁγίου· πᾶς ὁ ἁπτόμενος τοῦ θυσιαστηρίου ἁγιασθήσεται</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/29/#L37">Έξ 29:37</a>)</p></blockquote><h2>Ευαγγέλιο</h2><blockquote><p>«ὁ δὲ Ἰησοῦς ἐμβλέψας αὐτῷ ἠγάπησεν αὐτὸν καὶ εἶπεν αὐτῷ, Ἕν σε ὑστερεῖ· ὕπαγε ὅσα ἔχεις πώλησον καὶ δὸς [τοῖς] πτωχοῖς, καὶ ἕξεις θησαυρὸν ἐν οὐρανῷ, καὶ <strong>δεῦρο ἀκολούθει μοι</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mk/10/#L21">Μκ 10:21</a>) — Στο Βυζαντινό κείμενο ο στίχος δεν περιέχει τη φράση “ἄρας τὸν σταυρόν”.</p></blockquote><blockquote><p>«Καὶ προσκαλεσάμενος τὸν ὄχλον σὺν τοῖς μαθηταῖς αὐτοῦ εἶπεν αὐτοῖς, Εἴ τις θέλει ὀπίσω μου ἐλθεῖν, ἀπαρνησάσθω ἑαυτὸν καὶ <strong>ἀράτω τὸν σταυρὸν αὐτοῦ</strong> καὶ ἀκολουθείτω μοι.» (<a href="https://bibleox.com/el/gr-lxx-byz/mk/8/#L34">Μκ 8:34</a>)</p></blockquote><blockquote><p>«καὶ <strong>ὃς οὐ λαμβάνει τὸν σταυρὸν αὐτοῦ</strong> καὶ ἀκολουθεῖ ὀπίσω μου, οὐκ ἔστιν μου ἄξιος.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/10/#L38">Μτ 10:38</a>)</p></blockquote><blockquote><p>«Τότε ὁ Ἰησοῦς εἶπεν τοῖς μαθηταῖς αὐτοῦ, Εἴ τις θέλει ὀπίσω μου ἐλθεῖν, ἀπαρνησάσθω ἑαυτὸν καὶ <strong>ἀράτω τὸν σταυρὸν αὐτοῦ</strong> καὶ ἀκολουθείτω μοι.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/16/#L24">Μτ 16:24</a>)</p></blockquote><blockquote><p>«Ἔλεγεν δὲ πρὸς πάντας, Εἴ τις θέλει ὀπίσω μου ἔρχεσθαι, ἀρνησάσθω ἑαυτὸν καὶ <strong>ἀράτω τὸν σταυρὸν αὐτοῦ</strong> καθ᾿ ἡμέραν, καὶ ἀκολουθείτω μοι.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/9/#L23">Λκ 9:23</a>)</p></blockquote><blockquote><p>«<strong>ὅστις οὐ βαστάζει τὸν σταυρὸν ἑαυτοῦ</strong> καὶ ἔρχεται ὀπίσω μου οὐ δύναται εἶναί μου μαθητής.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/14/#L27">Λκ 14:27</a>)</p></blockquote><blockquote><p>«καὶ λέγοντες, Ὁ καταλύων τὸν ναὸν καὶ ἐν τρισὶν ἡμέραις οἰκοδομῶν, σῶσον σεαυτόν, εἰ υἱὸς εἶ τοῦ θεοῦ, [καὶ] <strong>κατάβηθι ἀπὸ τοῦ σταυροῦ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/27/#L40">Μτ 27:40</a>)</p></blockquote><blockquote><p>«Ἄλλους ἔσωσεν, ἑαυτὸν οὐ δύναται σῶσαι· βασιλεὺς Ἰσραήλ ἐστιν, <strong>καταβάτω νῦν ἀπὸ τοῦ σταυροῦ</strong> καὶ πιστεύσομεν ἐπ᾿ αὐτόν.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/27/#L42">Μτ 27:42</a>)</p></blockquote><blockquote><p>«σῶσον σεαυτὸν <strong>καταβὰς ἀπὸ τοῦ σταυροῦ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mk/15/#L30">Μκ 15:30</a>)</p></blockquote><blockquote><p>«ὁ Χριστὸς ὁ βασιλεὺς Ἰσραὴλ <strong>καταβάτω νῦν ἀπὸ τοῦ σταυροῦ</strong>, ἵνα ἴδωμεν καὶ πιστεύσωμεν. καὶ οἱ συνεσταυρωμένοι σὺν αὐτῷ ὠνείδιζον αὐτόν.» (<a href="https://bibleox.com/el/gr-lxx-byz/mk/15/#L32">Μκ 15:32</a>)</p></blockquote><h2>Απόστολος</h2><blockquote><p>«ἀφορῶντες εἰς τὸν τῆς πίστεως ἀρχηγὸν καὶ τελειωτὴν Ἰησοῦν, ὃς ἀντὶ τῆς προκειμένης αὐτῷ χαρᾶς <strong>ὑπέμεινεν σταυρὸν</strong> αἰσχύνης καταφρονήσας, ἐν δεξιᾷ τε τοῦ θρόνου τοῦ θεοῦ κεκάθικεν.» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/12/#L2">Εβρ 12:2</a>)</p></blockquote><blockquote><p>«ἐμοὶ δὲ μὴ γένοιτο <strong>καυχᾶσθαι</strong> εἰ μὴ <strong>ἐν τῷ σταυρῷ</strong> <strong>τοῦ κυρίου</strong> ἡμῶν Ἰησοῦ Χριστοῦ, δι᾿ οὗ ἐμοὶ κόσμος ἐσταύρωται κἀγὼ κόσμῳ.» (<a href="https://bibleox.com/el/gr-lxx-byz/gal/6/#L14">Γαλ 6:14</a>)</p></blockquote><blockquote><p>«οὐ γὰρ ἀπέστειλέν με Χριστὸς βαπτίζειν ἀλλὰ εὐαγγελίζεσθαι, οὐκ ἐν σοφίᾳ λόγου, ἵνα <strong>μὴ κενωθῇ ὁ σταυρὸς τοῦ Χριστοῦ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/1/#L17">Α Κορ 1:17</a>)</p></blockquote><blockquote><p>«<strong>Ὁ λόγος γὰρ ὁ τοῦ σταυροῦ τοῖς μὲν ἀπολλυμένοις μωρία ἐστίν</strong>, τοῖς δὲ σῳζομένοις ἡμῖν δύναμις θεοῦ ἐστιν.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/1/#L18">Α Κορ 1:18</a>)</p></blockquote><blockquote><p>«ὅσοι θέλουσιν εὐπροσωπῆσαι ἐν σαρκί, οὗτοι ἀναγκάζουσιν ὑμᾶς περιτέμνεσθαι, μόνον ἵνα <strong>τῷ σταυρῷ τοῦ Χριστοῦ μὴ διώκωνται</strong>·» (<a href="https://bibleox.com/el/gr-lxx-byz/gal/6/#L12">Γαλ 6:12</a>)</p></blockquote><blockquote><p>«ἐγὼ δέ, ἀδελφοί, εἰ περιτομὴν ἔτι κηρύσσω, τί ἔτι διώκομαι; ἄρα κατήργηται <strong>τὸ σκάνδαλον τοῦ σταυροῦ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/gal/5/#L11">Γαλ 5:11</a>)</p></blockquote><blockquote><p>«καὶ <strong>ἀποκαταλλάξῃ</strong> τοὺς ἀμφοτέρους ἐν ἑνὶ σώματι τῷ θεῷ <strong>διὰ τοῦ σταυροῦ, ἀποκτείνας τὴν ἔχθραν ἐν αὐτῷ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/2/#L16">Εφ 2:16</a>)</p></blockquote><blockquote><p>«πολλοὶ γὰρ <strong>περιπατοῦσιν</strong> οὓς πολλάκις ἔλεγον ὑμῖν, νῦν δὲ καὶ κλαίων λέγω, <strong>τοὺς ἐχθροὺς τοῦ σταυροῦ τοῦ Χριστοῦ</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/fil/3/#L18">Φιλ 3:18</a>)</p></blockquote><blockquote><p>«καὶ δι᾿ αὐτοῦ ἀποκαταλλάξαι τὰ πάντα εἰς αὐτόν, <strong>εἰρηνοποιήσας</strong> <strong>διὰ τοῦ αἵματος τοῦ σταυροῦ αὐτοῦ</strong>, [δι᾿ αὐτοῦ] εἴτε τὰ ἐπὶ τῆς γῆς εἴτε τὰ ἐν τοῖς οὐρανοῖς.» (<a href="https://bibleox.com/el/gr-lxx-byz/kol/1/#L20">Κολ 1:20</a>)</p></blockquote><blockquote><p>«ἐξαλείψας τὸ καθ᾿ ἡμῶν χειρόγραφον τοῖς δόγμασιν ὃ ἦν ὑπεναντίον ἡμῖν, καὶ αὐτὸ ἦρκεν ἐκ τοῦ μέσου <strong>προσηλώσας αὐτὸ τῷ σταυρῷ</strong>·» (<a href="https://bibleox.com/el/gr-lxx-byz/kol/2/#L14">Κολ 2:14</a>)</p></blockquote>
