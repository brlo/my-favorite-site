    title: Να μην ονομάζεστε πατέρες και διδάσκαλοι
    priority: 22
  update: true
  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: '<h2>Ο Χριστός διατάζει να μην ονομάζεστε δάσκαλοι και πατέρες</h2><blockquote><p>«λέγων, Ἐπὶ τῆς Μωϋσέως καθέδρας ἐκάθισαν οἱ γραμματεῖς καὶ οἱ Φαρισαῖοι. &lt;…&gt; πάντα δὲ τὰ ἔργα αὐτῶν ποιοῦσιν πρὸς τὸ θεαθῆναι τοῖς ἀνθρώποις· πλατύνουσιν γὰρ τὰ φυλακτήρια αὐτῶν καὶ μεγαλύνουσιν τὰ κράσπεδα, <strong>φιλοῦσιν</strong> δὲ τὴν πρωτοκλισίαν ἐν τοῖς δείπνοις καὶ τὰς πρωτοκαθεδρίας ἐν ταῖς συναγωγαῖς καὶ τοὺς ἀσπασμοὺς ἐν ταῖς ἀγοραῖς καὶ <strong>καλεῖσθαι ὑπὸ τῶν ἀνθρώπων, Ῥαββί</strong>. <strong>ὑμεῖς δὲ <mark>μὴ κληθῆτε, Ῥαββί</mark></strong>, εἷς γάρ ἐστιν ὑμῶν ὁ διδάσκαλος, πάντες δὲ ὑμεῖς ἀδελφοί ἐστε. <strong><mark>καὶ πατέρα μὴ καλέσητε ὑμῖν ἐπὶ τῆς γῆς</mark></strong>, εἷς γάρ ἐστιν ὑμῶν ὁ πατὴρ ὁ οὐράνιος.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/23/#L2,5-9">Μτ 23:2,5-9</a>)</p></blockquote><p>Λέγεται όχι τόσο κυριολεκτικά, όπως και για τον ακρωτηριασμό των μελών (<a href="https://bibleox.com/el/gr-lxx-byz/mf/5/#L29-30">Μτ 5:29-30</a>) ή για το ότι ο Χριστός ήρθε να χωρίσει οικογένειες, δεν έφερε ειρήνη αλλά μάχαιρα (<a href="https://bibleox.com/el/gr-lxx-byz/mf/10/#L34-35">Μτ 10:34-35</a>). Δίνεται μάθημα ταπεινοφροσύνης, ώστε οι πιστοί να μην επιδιώκουν να τους αποκαλούν «δάσκαλε, δάσκαλε» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/23/#L7">Μτ 23:7</a>), και αφού λάβουν αυτούς τους τίτλους, να μην υπερηφανεύονται και να μην επαίρονται, κατανοώντας ότι η ύψιστη αυθεντία, ο αληθινός πατέρας και δάσκαλος είναι ο Θεός.</p><p>Είναι σημαντικό να κατανοήσουμε σωστά το νόημα, ξεκινώντας από το πλαίσιο, αλλιώς θα προκύψει ότι ακόμη και ένα παιδί δεν μπορεί να αποκαλέσει πατέρα τον γονέα του, αν και ο Θεός στην εντολή τους αποκαλεί έτσι (<a href="https://bibleox.com/el/gr-lxx-byz/vtor/5/#L16">Δτ 5:16</a>). Επίσης, σε κανέναν δάσκαλο δεν επιτρέπεται να ονομάζεται δάσκαλος, αν και δάσκαλοι στην Εκκλησία σαφώς υπάρχουν. Από τη Γραφή βλέπουμε ότι αυτά τα λόγια δεν τα απέφευγαν.</p><h2>Δάσκαλοι</h2><h3>Ο Χριστός αποκαλεί τον Φαρισαίο Νικόδημο δάσκαλο του Ισραήλ</h3><blockquote><p>«ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ, <strong><mark>Σὺ εἶ ὁ διδάσκαλος</mark></strong> τοῦ Ἰσραὴλ καὶ ταῦτα οὐ γινώσκεις;» (<a href="https://bibleox.com/el/gr-lxx-byz/in/3/#L10">Ιω 3:10</a>)</p></blockquote><h3>Ο απόστολος λέει ότι έχει οριστεί δάσκαλος</h3><blockquote><p>«εἰς ὃ ἐτέθην <strong><mark>ἐγὼ</mark></strong> κῆρυξ καὶ ἀπόστολος καὶ <strong><mark>διδάσκαλος</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/2tim/1/#L11">Β Τιμ 1:11</a>)</p></blockquote><blockquote><p>«ὁ δοὺς ἑαυτὸν ἀντίλυτρον ὑπὲρ πάντων, τὸ μαρτύριον καιροῖς ἰδίοις· εἰς ὃ ἐτέθην <strong><mark>ἐγὼ</mark></strong> κῆρυξ καὶ ἀπόστολος — ἀλήθειαν λέγω, οὐ ψεύδομαι — <strong><mark>διδάσκαλος</mark></strong> ἐθνῶν ἐν πίστει καὶ ἀληθείᾳ.» (<a href="https://bibleox.com/el/gr-lxx-byz/1tim/2/#L6-7">Α Τιμ 2:6-7</a>)</p></blockquote><h3>Ο Θεός όρισε δασκάλους στην Εκκλησία</h3><blockquote><p>«καὶ οὓς μὲν <strong><mark>ἔθετο ὁ θεὸς</mark></strong> ἐν τῇ ἐκκλησίᾳ πρῶτον ἀποστόλους, δεύτερον προφήτας, τρίτον <strong><mark>διδασκάλους</mark></strong>, ἔπειτα δυνάμεις, ἔπειτα χαρίσματα ἰαμάτων, ἀντιλήμψεις, κυβερνήσεις, γένη γλωσσῶν.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/12/#L28">Α Κορ 12:28</a>)</p></blockquote><blockquote><p>«καὶ <strong><mark>αὐτὸς</mark></strong><mark> </mark><strong><mark>ἔδωκεν</mark></strong> τοὺς μὲν ἀποστόλους, τοὺς δὲ προφήτας, τοὺς δὲ εὐαγγελιστάς, τοὺς δὲ ποιμένας καὶ <strong><mark>διδασκάλους</mark></strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/4/#L11">Εφ 4:11</a>)</p></blockquote><blockquote><p>«εἴτε διακονίαν ἐν τῇ διακονίᾳ, εἴτε <strong><mark>ὁ διδάσκων</mark></strong> ἐν τῇ διδασκαλίᾳ» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/12/#L7">Ρωμ 12:7</a>)</p></blockquote><blockquote><p>«καὶ γὰρ <strong><mark>ὀφείλοντες εἶναι διδάσκαλοι</mark></strong> διὰ τὸν χρόνον, πάλιν χρείαν ἔχετε τοῦ διδάσκειν ὑμᾶς τινὰ τὰ στοιχεῖα τῆς ἀρχῆς τῶν λογίων τοῦ θεοῦ, καὶ γεγόνατε χρείαν ἔχοντες γάλακτος, [καὶ] οὐ στερεᾶς τροφῆς.» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/5/#L12">Εβρ 5:12</a>)</p></blockquote><h3>Προειδοποίηση για την ευθύνη των δασκάλων</h3><blockquote><p><em>«</em><strong><em><mark>Μὴ πολλοὶ διδάσκαλοι γίνεσθε</mark></em></strong><em>, ἀδελφοί μου, εἰδότες ὅτι μεῖζον κρίμα λημψόμεθα. πολλὰ γὰρ πταίομεν ἅπαντες. εἴ τις ἐν λόγῳ οὐ πταίει, οὗτος τέλειος ἀνήρ, δυνατὸς χαλιναγωγῆσαι καὶ ὅλον τὸ σῶμα.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/iak/3/#L1-2"><em>Ιακ 3:1-2</em></a><em>)</em></p></blockquote><h2>Πατέρες</h2><h3>Ο Χριστός υπόσχεται πατέρες</h3><blockquote><p>«ἔφη ὁ Ἰησοῦς, Ἀμὴν λέγω ὑμῖν, <strong>οὐδείς ἐστιν ὃς ἀφῆκεν οἰκίαν ἢ ἀδελφοὺς ἢ ἀδελφὰς ἢ μητέρα ἢ <mark>πατέρα</mark> ἢ τέκνα ἢ ἀγροὺς ἕνεκεν ἐμοῦ</strong> καὶ ἕνεκεν τοῦ εὐαγγελίου, <strong>ἐὰν μὴ λάβῃ ἑκατονταπλασίονα νῦν ἐν τῷ καιρῷ τούτῳ</strong> <strong><mark>οἰκίας καὶ ἀδελφοὺς καὶ ἀδελφὰς καὶ μητέρας</mark></strong> καὶ τέκνα καὶ ἀγροὺς μετὰ διωγμῶν, καὶ ἐν τῷ αἰῶνι τῷ ἐρχομένῳ ζωὴν αἰώνιον.» (<a href="https://bibleox.com/el/gr-lxx-byz/mk/10/#L29-30">Μκ 10:29-30</a>) — Στο κείμενο της Ελληνικής Βίβλου που παραθέτουμε ο κατάλογος των ανταποδομάτων δεν περιλαμβάνει “πατέρες”· η έμφαση μπαίνει στη λέξη “μητέρες”.</p></blockquote><h3>Ο απόστολος αποκαλεί τον εαυτό του πατέρα και τους πιστούς παιδιά</h3><blockquote><p>«Οὐκ ἐντρέπων ὑμᾶς γράφω ταῦτα, ἀλλ᾿ ὡς <strong><mark>τέκνα μου ἀγαπητὰ</mark></strong> νουθετῶν· ἐὰν γὰρ μυρίους παιδαγωγοὺς ἔχητε ἐν Χριστῷ, ἀλλ᾿ <strong><mark>οὐ πολλοὺς</mark> <u><mark>πατέρας</mark></u>, ἐν γὰρ Χριστῷ Ἰησοῦ διὰ τοῦ εὐαγγελίου <mark>ἐγὼ ὑμᾶς ἐγέννησα</mark></strong>. &lt;…&gt; διὰ τοῦτο ἔπεμψα ὑμῖν Τιμόθεον, ὅς ἐστίν <strong><mark>μου</mark></strong> <strong><mark>τέκνον</mark></strong> ἀγαπητὸν καὶ πιστὸν ἐν κυρίῳ, ὃς ὑμᾶς ἀναμνήσει τὰς ὁδούς μου τὰς ἐν Χριστῷ [Ἰησοῦ], καθὼς πανταχοῦ ἐν πάσῃ ἐκκλησίᾳ διδάσκω.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/4/#L14-15,17">Α Κορ 4:14-15,17</a>)</p></blockquote><blockquote><p>«<strong><mark>τεκνία μου</mark></strong>, <strong>οὓς πάλιν ὠδίνω</strong> μέχρις οὗ μορφωθῇ Χριστὸς ἐν ὑμῖν·» (<a href="https://bibleox.com/el/gr-lxx-byz/gal/4/#L19">Γαλ 4:19</a>)</p></blockquote><blockquote><p>«<strong><mark>Τεκνία μου</mark></strong>, ταῦτα γράφω ὑμῖν ἵνα μὴ ἁμάρτητε. καὶ ἐάν τις ἁμάρτῃ, παράκλητον ἔχομεν πρὸς τὸν πατέρα, Ἰησοῦν Χριστὸν δίκαιον·» (<a href="https://bibleox.com/el/gr-lxx-byz/1in/2/#L1">Α Ιω 2:1</a>)</p></blockquote><blockquote><p>«<strong><mark>Τεκνία</mark></strong>, μὴ ἀγαπῶμεν λόγῳ μηδὲ τῇ γλώσσῃ ἀλλὰ ἐν ἔργῳ καὶ ἀληθείᾳ.» (<a href="https://bibleox.com/el/gr-lxx-byz/1in/3/#L18">Α Ιω 3:18</a>)</p></blockquote><blockquote><p>«μειζοτέραν τούτων οὐκ ἔχω χαράν, ἵνα ἀκούω <strong><mark>τὰ ἐμὰ τέκνα</mark></strong> ἐν τῇ ἀληθείᾳ περιπατοῦντα.» (<a href="https://bibleox.com/el/gr-lxx-byz/3in/1/#L4">Γ Ιω 1:4</a>)</p></blockquote><blockquote><p>«παρακαλῶ σε περὶ <strong><mark>τοῦ ἐμοῦ τέκνου</mark></strong>, ὃν <strong>ἐγέννησα ἐν τοῖς δεσμοῖς</strong> Ὀνήσιμον» (<a href="https://bibleox.com/el/gr-lxx-byz/fm/1/#L10">Φλμ 1:10</a>)</p></blockquote><h3>Ο Αβραάμ — πατέρας των πιστών</h3><blockquote><p>«διὰ τοῦτο ἐκ πίστεως, ἵνα κατὰ χάριν, εἰς τὸ εἶναι βεβαίαν τὴν ἐπαγγελίαν παντὶ τῷ σπέρματι, οὐ τῷ ἐκ τοῦ νόμου μόνον ἀλλὰ καὶ τῷ ἐκ πίστεως <strong><mark>Ἀβραάμ [ὅς ἐστιν πατὴρ πάντων ἡμῶν</mark></strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/4/#L16">Ρωμ 4:16</a>)</p></blockquote><blockquote><p>«Γινώσκετε ἄρα ὅτι <strong>οἱ ἐκ πίστεως, οὗτοι υἱοί εἰσιν Ἀβραάμ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/gal/3/#L7">Γαλ 3:7</a>)</p></blockquote><blockquote><p><em>«Ἐγένετο δὲ Αβραμ ἐτῶν ἐνενήκοντα ἐννέα, καὶ ὤφθη κύριος τῷ Αβραμ καὶ εἶπεν αὐτῷ Ἐγώ εἰμι ὁ θεός σου· εὐαρέστει ἐναντίον ἐμοῦ καὶ γίνου ἄμεμπτος, &lt;…&gt; Καὶ ἐγὼ ἰδοὺ ἡ διαθήκη μου μετὰ σοῦ, καὶ </em><strong><em><mark>ἔσῃ πατὴρ</mark> πλήθους ἐθνῶν</em></strong><em>. καὶ οὐ κληθήσεται ἔτι τὸ ὄνομά σου Αβραμ, ἀλλ᾿ ἔσται τὸ ὄνομά σου Αβρααμ, ὅτι </em><strong><em><mark>πατέρα πολλῶν ἐθνῶν</mark> τέθεικά σε</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/gen/17/#L1,4-5"><em>Γεν 17:1,4-5</em></a><em>)</em></p></blockquote><blockquote><p>«καὶ σημεῖον ἔλαβεν περιτομῆς, σφραγῖδα τῆς δικαιοσύνης τῆς πίστεως τῆς ἐν τῇ ἀκροβυστίᾳ, <strong><mark>εἰς τὸ εἶναι αὐτὸν πατέρα πάντων τῶν πιστευόντων</mark></strong> δι᾿ ἀκροβυστίας, εἰς τὸ λογισθῆναι αὐτοῖς [τὴν] δικαιοσύνην, καὶ <strong>πατέρα</strong> περιτομῆς τοῖς οὐκ ἐκ περιτομῆς μόνον ἀλλὰ καὶ τοῖς στοιχοῦσιν τοῖς ἴχνεσιν τῆς ἐν ἀκροβυστίᾳ πίστεως <strong><mark>τοῦ πατρὸς ἡμῶν</mark></strong> Ἀβραάμ. &lt;…&gt; καθὼς γέγραπται ὅτι <strong><mark>Πατέρα πολλῶν ἐθνῶν τέθεικά σε</mark></strong>] κατέναντι οὗ ἐπίστευσεν θεοῦ τοῦ ζῳοποιοῦντος τοὺς νεκροὺς καὶ καλοῦντος τὰ μὴ ὄντα ὡς ὄντα·» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/4/#L11-12,17">Ρωμ 4:11-12,17</a>)</p></blockquote><h3>Ο Θεός δίνει εντολή για πατέρες και μητέρες</h3><blockquote><p>«<strong><mark>τίμα τὸν πατέρα</mark></strong> σου καὶ τὴν μητέρα, ἵνα εὖ σοι γένηται, καὶ ἵνα μακροχρόνιος γένῃ ἐπὶ τῆς γῆς τῆς ἀγαθῆς, ἧς κύριος ὁ θεός σου δίδωσίν σοι.» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/20/#L12">Έξ 20:12</a>)</p></blockquote><blockquote><p>«<strong><mark>τίμα τὸν πατέρα</mark></strong> σου καὶ τὴν μητέρα σου, ὃν τρόπον <strong>ἐνετείλατό σοι κύριος ὁ θεός</strong> σου, ἵνα εὖ σοι γένηται, καὶ ἵνα μακροχρόνιος γένῃ ἐπὶ τῆς γῆς, ἧς κύριος ὁ θεός σου δίδωσίν σοι.» (<a href="https://bibleox.com/el/gr-lxx-byz/vtor/5/#L16">Δτ 5:16</a>)</p></blockquote><blockquote><p>«τὰς ἐντολὰς οἶδας· Μὴ φονεύσῃς, Μὴ μοιχεύσῃς, Μὴ κλέψῃς, Μὴ ψευδομαρτυρήσῃς, Μὴ ἀποστερήσῃς, <strong><mark>Τίμα τὸν πατέρα</mark></strong> σου καὶ τὴν μητέρα.» (<a href="https://bibleox.com/el/gr-lxx-byz/mk/10/#L19">Μκ 10:19</a>)</p></blockquote><blockquote><p>«<strong><mark>τίμα τὸν πατέρα</mark></strong> σου καὶ τὴν μητέρα, ἥτις ἐστὶν ἐντολὴ πρώτη ἐν ἐπαγγελίᾳ» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/6/#L2">Εφ 6:2</a>)</p></blockquote><h3>Ο απόστολος απευθύνεται στους πατέρες</h3><blockquote><p>«Καὶ <strong><mark>οἱ πατέρες</mark></strong>, μὴ παροργίζετε τὰ τέκνα ὑμῶν, ἀλλὰ ἐκτρέφετε αὐτὰ ἐν παιδείᾳ καὶ νουθεσίᾳ κυρίου.» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/6/#L4">Εφ 6:4</a>)</p></blockquote><blockquote><p>«<strong><mark>Οἱ πατέρες</mark></strong>, μὴ ἐρεθίζετε τὰ τέκνα ὑμῶν, ἵνα μὴ ἀθυμῶσιν.» (<a href="https://bibleox.com/el/gr-lxx-byz/kol/3/#L21">Κολ 3:21</a>)</p></blockquote><blockquote><p>«<strong><mark>γράφω ὑμῖν, πατέρες</mark></strong>, ὅτι ἐγνώκατε τὸν ἀπ᾿ ἀρχῆς. γράφω ὑμῖν, νεανίσκοι, ὅτι νενικήκατε τὸν πονηρόν. ἔγραψα ὑμῖν, παιδία, ὅτι ἐγνώκατε τὸν πατέρα» (<a href="https://bibleox.com/el/gr-lxx-byz/1in/2/#L13-14">Α Ιω 2:13-14</a>)</p></blockquote><h2>Όχι μόνο δάσκαλο και πατέρα, αλλά ακόμη και θεούς ο Θεός επιτρέπει να αποκαλεί κανείς με την ορθή έννοια (όχι κατά φύση, αλλά κατά χάρη)</h2><blockquote><p>«ἐγὼ εἶπα <strong>Θεοί ἐστε</strong> καὶ υἱοὶ ὑψίστου πάντες· ὑμεῖς δὲ ὡς ἄνθρωποι ἀποθνῄσκετε καὶ ὡς εἷς τῶν ἀρχόντων πίπτετε.» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/81/#L6-7">Ψλ 81:6-7</a>)</p></blockquote><blockquote><p>«ἀπεκρίθη αὐτοῖς [ὁ] Ἰησοῦς, Οὐκ ἔστιν γεγραμμένον ἐν τῷ νόμῳ ὑμῶν ὅτι Ἐγὼ εἶπα, <strong>Θεοί ἐστε</strong>; εἰ ἐκείνους εἶπεν θεοὺς πρὸς οὓς ὁ λόγος τοῦ θεοῦ ἐγένετο, καὶ οὐ δύναται λυθῆναι ἡ γραφή» (<a href="https://bibleox.com/el/gr-lxx-byz/in/10/#L34-35">Ιω 10:34-35</a>)</p></blockquote><p>Ωστόσο, ο Χριστός δίνει εντολή να αποκαλούμε τους εαυτούς μας δούλους (<a href="https://bibleox.com/el/gr-lxx-byz/lk/17/#L10">Λκ 17:10</a>).</p><h2>Παρόμοιο θέμα</h2><p>Για την αντίρρηση κατά της ονομασίας των χριστιανών ως δούλων: <a href="https://bibleox.com/el/el/w/Ο_χριστιανός_είναι_δούλος_του_Θεού">Ο χριστιανός είναι δούλος του Θεού</a></p>'
- src: анания-и-сапфира
  path: Ο_Ανανίας_και_η_Σαπφείρα
  title: Ο Ανανίας και η Σαπφείρα
  title_sub:
  meta_desc: Βιβλικές ρήσεις για την κατανόηση της τιμωρίας του Ανανία και της Σαπφείρας.
  copy_cover: true
  menu:
    parent: Εκκλησία
    title: Ο Ανανίας και η Σαπφείρα
    priority: 28
  update: true
  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <p>Στην αρχή της ζωής της Εκκλησίας ο Κύριος επιβλέπει με ιδιαίτερη αυστηρότητα την καθαρότητα της ζωής μέσα σε αυτήν. Έτσι, για την απόπειρα να πουν ψέματα στην Εκκλησία, ο άνδρας με τη γυναίκα του (ο Ανανίας και η Σαπφείρα) πέφτουν νεκροί με τον λόγο του αποστόλου:</p><blockquote>«Ἀνὴρ δέ τις <b>Ἁνανίας</b> ὀνόματι σὺν <b>Σαπφείρῃ</b> τῇ γυναικὶ αὐτοῦ <b>ἐπώλησεν κτῆμα καὶ ἐνοσφίσατο ἀπὸ τῆς τιμῆς</b>, συνειδυίης καὶ τῆς γυναικός, καὶ ἐνέγκας μέρος τι παρὰ τοὺς πόδας τῶν ἀποστόλων ἔθηκεν. εἶπεν δὲ ὁ Πέτρος, <b>Ἁνανία, διὰ τί ἐπλήρωσεν ὁ Σατανᾶς τὴν καρδίαν σου ψεύσασθαί σε τὸ πνεῦμα τὸ ἅγιον καὶ νοσφίσασθαι ἀπὸ τῆς τιμῆς τοῦ χωρίου</b>; οὐχὶ μένον σοὶ ἔμενεν καὶ πραθὲν ἐν τῇ σῇ ἐξουσίᾳ ὑπῆρχεν; τί ὅτι ἔθου ἐν τῇ καρδίᾳ σου τὸ πρᾶγμα τοῦτο; <b>οὐκ ἐψεύσω ἀνθρώποις ἀλλὰ τῷ θεῷ. ἀκούων δὲ ὁ Ἁνανίας τοὺς λόγους τούτους πεσὼν ἐξέψυξεν</b>· καὶ ἐγένετο φόβος μέγας ἐπὶ πάντας τοὺς ἀκούοντας. ἀναστάντες δὲ οἱ νεώτεροι συνέστειλαν αὐτὸν καὶ ἐξενέγκαντες ἔθαψαν. Ἐγένετο δὲ ὡς ὡρῶν τριῶν διάστημα καὶ ἡ γυνὴ αὐτοῦ μὴ εἰδυῖα τὸ γεγονὸς εἰσῆλθεν. ἀπεκρίθη δὲ πρὸς αὐτὴν Πέτρος, Εἰπέ μοι, εἰ τοσούτου τὸ χωρίον ἀπέδοσθε; ἡ δὲ εἶπεν, Ναί, τοσούτου. ὁ δὲ Πέτρος πρὸς αὐτήν, Τί ὅτι συνεφωνήθη ὑμῖν πειράσαι τὸ πνεῦμα κυρίου; ἰδοὺ οἱ πόδες τῶν θαψάντων τὸν ἄνδρα σου ἐπὶ τῇ θύρᾳ καὶ ἐξοίσουσίν σε. <b>ἔπεσεν δὲ παραχρῆμα πρὸς τοὺς πόδας αὐτοῦ καὶ ἐξέψυξεν· εἰσελθόντες δὲ οἱ νεανίσκοι εὗρον αὐτὴν νεκράν, καὶ ἐξενέγκαντες ἔθαψαν πρὸς τὸν ἄνδρα αὐτῆς</b>. καὶ ἐγένετο φόβος μέγας ἐφ᾿ ὅλην τὴν ἐκκλησίαν καὶ ἐπὶ πάντας τοὺς ἀκούοντας ταῦτα.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/5/#L1-11">Πραξ 5:1-11</a>)</blockquote>Έτσι έγινε και με την παλαιοδιαθηκική Εκκλησία. Στην αρχή της ζωής αυτής της Εκκλησίας, για την παράβαση της ανάπαυσης του Σαββάτου ένας άνθρωπος τιμωρήθηκε με θάνατο:<blockquote>«Καὶ ἦσαν οἱ υἱοὶ Ισραηλ ἐν τῇ ἐρήμῳ καὶ <b>εὗρον ἄνδρα συλλέγοντα ξύλα τῇ ἡμέρᾳ τῶν σαββάτων</b>. καὶ προσήγαγον αὐτὸν οἱ εὑρόντες αὐτὸν συλλέγοντα ξύλα τῇ ἡμέρᾳ τῶν σαββάτων πρὸς Μωυσῆν καὶ Ααρων καὶ πρὸς πᾶσαν συναγωγὴν υἱῶν Ισραηλ. καὶ ἀπέθεντο αὐτὸν εἰς φυλακήν· οὐ γὰρ συνέκριναν, τί ποιήσωσιν αὐτόν. καὶ <b>ἐλάλησεν κύριος πρὸς Μωυσῆν λέγων Θανάτῳ θανατούσθω ὁ ἄνθρωπος</b>· λιθοβολήσατε αὐτὸν λίθοις, πᾶσα ἡ συναγωγή. καὶ ἐξήγαγον αὐτὸν πᾶσα ἡ συναγωγὴ ἔξω τῆς παρεμβολῆς, καὶ ἐλιθοβόλησαν αὐτὸν πᾶσα ἡ συναγωγὴ λίθοις ἔξω τῆς παρεμβολῆς, καθὰ συνέταξεν κύριος τῷ Μωυσῇ.» (<a href="https://bibleox.com/el/gr-lxx-byz/chis/15/#L32-36">Αρ 15:32-36</a>)</blockquote>Αν και αργότερα οι Εβραίοι παραβίαζαν επανειλημμένα τα σάββατα (<a href="https://bibleox.com/el/gr-lxx-byz/ezd/23/#L15-16,18">Εσδ 23:15-16,18</a>; <a href="https://bibleox.com/el/gr-lxx-byz/iez/20/#L13,16,21,24">Ιεζ 20:13,16,21,24</a>; <a href="https://bibleox.com/el/gr-lxx-byz/iez/22/#L8">Ιεζ 22:8</a>; <a href="https://bibleox.com/el/gr-lxx-byz/iez/23/#L38">Ιεζ 23:38</a>) ακόμη και οι ιερείς (<a href="https://bibleox.com/el/gr-lxx-byz/iez/22/#L26">Ιεζ 22:26</a>), ωστόσο αντί για άμεση θανατική ποινή γίνονταν προσπάθειες να εμποδιστεί η παράβαση του σαββάτου:<blockquote>«καὶ ἐγένετο ἡνίκα κατέστησαν πύλαι Ιερουσαλημ πρὸ τοῦ σαββάτου, <b>καὶ εἶπα καὶ ἔκλεισαν τὰς πύλας, καὶ εἶπα ὥστε μὴ ἀνοιγῆναι αὐτὰς ἕως ὀπίσω τοῦ σαββάτου</b>· καὶ ἐκ τῶν παιδαρίων μου ἔστησα ἐπὶ τὰς πύλας <b>ὥστε μὴ αἴρειν βαστάγματα ἐν ἡμέρᾳ τοῦ σαββάτου</b>. καὶ ηὐλίσθησαν πάντες καὶ ἐποίησαν πρᾶσιν ἔξω Ιερουσαλημ ἅπαξ καὶ δίς. καὶ διεμαρτυράμην ἐν αὐτοῖς καὶ εἶπα πρὸς αὐτούς Διὰ τί ὑμεῖς αὐλίζεσθε ἀπέναντι τοῦ τείχους; ἐὰν δευτερώσητε, ἐκτενῶ τὴν χεῖρά μου ἐν ὑμῖν. ἀπὸ τοῦ καιροῦ ἐκείνου οὐκ ἤλθοσαν ἐν σαββάτῳ. <b>καὶ εἶπα τοῖς Λευίταις, οἳ ἦσαν καθαριζόμενοι καὶ ἐρχόμενοι φυλάσσοντες τὰς πύλας, ἁγιάζειν τὴν ἡμέραν τοῦ σαββάτου</b>. πρὸς ταῦτα μνήσθητί μου, ὁ θεός, καὶ φεῖσαί μου κατὰ τὸ πλῆθος τοῦ ἐλέους σου.» (<a href="https://bibleox.com/el/gr-lxx-byz/ezd/23/#L19-22">Εσδ 23:19-22</a>)</blockquote><blockquote>«<b>Τάδε λέγει κύριος</b> Βάδισον καὶ <b>στῆθι ἐν πύλαις υἱῶν λαοῦ σου</b>, ἐν αἷς εἰσπορεύονται ἐν αὐταῖς βασιλεῖς Ιουδα καὶ ἐν αἷς ἐκπορεύονται ἐν αὐταῖς, καὶ ἐν πάσαις ταῖς πύλαις Ιερουσαλημ καὶ ἐρεῖς πρὸς αὐτούς Ἀκούσατε λόγον κυρίου, βασιλεῖς Ιουδα καὶ πᾶσα Ιουδαία καὶ <b>πᾶσα Ιερουσαλημ οἱ εἰσπορευόμενοι ἐν ταῖς πύλαις ταύταις</b>, τάδε λέγει κύριος <b>Φυλάσσεσθε τὰς ψυχὰς ὑμῶν καὶ μὴ αἴρετε βαστάγματα ἐν τῇ ἡμέρᾳ τῶν σαββάτων καὶ μὴ ἐκπορεύεσθε ταῖς πύλαις Ιερουσαλημ καὶ μὴ ἐκφέρετε βαστάγματα ἐξ οἰκιῶν ὑμῶν ἐν τῇ ἡμέρᾳ τῶν σαββάτων καὶ πᾶν ἔργον οὐ ποιήσετε· ἁγιάσατε τὴν ἡμέραν τῶν σαββάτων, καθὼς ἐνετειλάμην τοῖς πατράσιν ὑμῶν</b>» (<a href="https://bibleox.com/el/gr-lxx-byz/ier/17/#L19-22">Ιερ 17:19-22</a>)</blockquote>
