  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: '<h2>Προσευχές, προφητείες και θαύματα δεν είναι σημάδι σωτηρίας</h2><blockquote><p>«<strong><mark>Οὐ πᾶς ὁ λέγων μοι, Κύριε κύριε, εἰσελεύσεται εἰς τὴν βασιλείαν τῶν οὐρανῶν</mark></strong>, ἀλλ᾿ ὁ ποιῶν τὸ θέλημα τοῦ πατρός μου τοῦ ἐν τοῖς οὐρανοῖς. πολλοὶ ἐροῦσίν μοι ἐν ἐκείνῃ τῇ ἡμέρᾳ, Κύριε κύριε, οὐ τῷ σῷ ὀνόματι <strong>ἐπροφητεύσαμεν</strong>, καὶ τῷ σῷ ὀνόματι <strong>δαιμόνια ἐξεβάλομεν</strong>, καὶ τῷ σῷ ὀνόματι <strong>δυνάμεις πολλὰς ἐποιήσαμεν</strong>; καὶ τότε ὁμολογήσω αὐτοῖς ὅτι <strong><mark>Οὐδέποτε ἔγνων ὑμᾶς</mark></strong>· ἀποχωρεῖτε ἀπ᾿ ἐμοῦ οἱ ἐργαζόμενοι τὴν ἀνομίαν.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/7/#L21-23">Μτ 7:21-23</a>)</p></blockquote><blockquote><p>«ὁ δὲ εἶπεν, <strong>Βλέπετε μὴ πλανηθῆτε· πολλοὶ γὰρ ἐλεύσονται ἐπὶ τῷ ὀνόματί μου</strong> λέγοντες, Ἐγώ εἰμι· καί, <strong>Ὁ καιρὸς ἤγγικεν· μὴ πορευθῆτε ὀπίσω αὐτῶν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/21/#L8">Λκ 21:8</a> · <a href="https://bibleox.com/el/gr-lxx-byz/mf/24/#L5">Μτ 24:5</a> · <a href="https://bibleox.com/el/gr-lxx-byz/mk/13/#L6">Μκ 13:6</a>)</p></blockquote><h2>Για τη σωτηρία είναι απαραίτητο να είναι κανείς μέλος του Σώματος του Χριστού (της Εκκλησίας)</h2><p>Η Εκκλησία είναι το Σώμα του Χριστού:</p><blockquote><p><em>«</em><strong><em><mark>σώματος</mark></em></strong><em> αὐτοῦ, ὅ ἐστιν ἡ </em><strong><em><mark>ἐκκλησία</mark></em></strong><em>» (</em><a href="https://bibleox.com/el/gr-lxx-byz/kol/1/#L24"><em>Κολ 1:24</em></a><em>)</em></p></blockquote><p>Ο Χριστός είναι ο Σωτήρας του Σώματος, δηλαδή της Εκκλησίας:</p><blockquote><p><em>«αὐτὸς </em><strong><em><mark>σωτὴρ τοῦ σώματος</mark></em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/ef/5/#L23"><em>Εφ 5:23</em></a><em>)</em></p></blockquote><p>Η θύρα προς τη σωτηρία είναι ο Χριστός:</p><blockquote><p>«<strong><mark>ἐγώ εἰμι ἡ θύρα· δι᾿ ἐμοῦ ἐάν τις εἰσέλθῃ σωθήσεται</mark></strong> καὶ εἰσελεύσεται καὶ ἐξελεύσεται καὶ νομὴν εὑρήσει. ὁ κλέπτης οὐκ ἔρχεται εἰ μὴ ἵνα κλέψῃ καὶ θύσῃ καὶ ἀπολέσῃ· ἐγὼ ἦλθον ἵνα ζωὴν ἔχωσιν καὶ περισσὸν ἔχωσιν.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/10/#L9-10">Ιω 10:9-10</a>)</p></blockquote><p>Ο Κύριος πρόσθετε τους σωζόμενους στην Εκκλησία:</p><blockquote><p><em>«ὁ δὲ κύριος </em><strong><em><mark>προσετίθει τοὺς σῳζομένους καθ᾿ ἡμέραν ἐπὶ τὸ αὐτό</mark></em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/act/2/#L47"><em>Πραξ 2:47</em></a><em>)</em></p></blockquote><p>Όποιος βρίσκεται έξω από το Σώμα δεν μπορεί να φέρει καρπό, θα εκβληθεί και θα ριχτεί στη φωτιά:</p><blockquote><p>«<strong><mark>μείνατε ἐν ἐμοί</mark>, κἀγὼ ἐν ὑμῖν. καθὼς <mark>τὸ κλῆμα οὐ δύναται καρπὸν φέρειν ἀφ᾿ ἑαυτοῦ</mark> ἐὰν μὴ μένῃ ἐν τῇ ἀμπέλῳ</strong>, οὕτως οὐδὲ ὑμεῖς ἐὰν μὴ ἐν ἐμοὶ μένητε. ἐγώ εἰμι ἡ ἄμπελος, ὑμεῖς τὰ κλήματα. ὁ μένων ἐν ἐμοὶ κἀγὼ ἐν αὐτῷ οὗτος φέρει καρπὸν πολύν, ὅτι <strong>χωρὶς ἐμοῦ οὐ δύνασθε ποιεῖν οὐδέν</strong>. <strong><mark>ἐὰν μή τις μένῃ ἐν ἐμοί, ἐβλήθη ἔξω</mark></strong> ὡς τὸ κλῆμα καὶ ἐξηράνθη, καὶ <strong>συνάγουσιν αὐτὰ καὶ εἰς τὸ πῦρ βάλλουσιν</strong> καὶ καίεται.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/15/#L4-6">Ιω 15:4-6</a>)</p></blockquote><blockquote><p>«οὗτός ἐστιν ὁ λίθος ὁ ἐξουθενηθεὶς ὑφ᾿ ὑμῶν τῶν οἰκοδόμων, ὁ γενόμενος εἰς κεφαλὴν γωνίας. καὶ <strong><mark>οὐκ ἔστιν ἐν ἄλλῳ οὐδενὶ ἡ σωτηρία</mark></strong>, οὐδὲ γὰρ ὄνομά ἐστιν ἕτερον ὑπὸ τὸν οὐρανὸν τὸ δεδομένον ἐν ἀνθρώποις ἐν ᾧ δεῖ σωθῆναι ἡμᾶς.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/4/#L11-12">Πραξ 4:11-12</a>)</p></blockquote><p>Όποιος δεν είναι με τον Χριστό είναι εναντίον Του:</p><blockquote><p>«<strong>ὁ μὴ ὢν μετ᾿ ἐμοῦ κατ᾿ ἐμοῦ ἐστιν</strong>, καὶ ὁ μὴ συνάγων μετ᾿ ἐμοῦ σκορπίζει.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/11/#L23">Λκ 11:23</a>)</p></blockquote><h2>Η ένταξη στο Σώμα του Χριστού (την Εκκλησία)</h2><h3>Βάπτισμα</h3><blockquote><p><em>«</em><strong><em>ἐν ἑνὶ πνεύματι ἡμεῖς πάντες <mark>εἰς ἓν σῶμα ἐβαπτίσθημεν</mark></em></strong><em>» (</em><a href="https://bibleox.com/el/gr-lxx-byz/1kor/12/#L13"><em>Α Κορ 12:13</em></a><em>)</em></p></blockquote><h3>Θεία Κοινωνία</h3><blockquote><p><em>«τὸ ποτήριον τῆς εὐλογίας ὃ εὐλογοῦμεν, οὐχὶ κοινωνία ἐστὶν τοῦ αἵματος τοῦ Χριστοῦ; τὸν </em><strong><em>ἄρτον</em></strong><em> ὃν κλῶμεν, οὐχὶ </em><strong><em>κοινωνία τοῦ σώματος τοῦ Χριστοῦ</em></strong><em> ἐστιν; ὅτι </em><strong><em>εἷς ἄρτος, <mark>ἓν σῶμα</mark> οἱ πολλοί ἐσμεν, <mark>οἱ γὰρ πάντες ἐκ τοῦ ἑνὸς ἄρτου μετέχομεν</mark></em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/1kor/10/#L16-17"><em>Α Κορ 10:16-17</em></a><em>)</em></p></blockquote><h2>Η κιβωτός — παλαιοδιαθηκική προτύπωση της σωτηρίας</h2><blockquote><p>«καὶ εἶπεν ὁ θεός <strong>Ἀπαλείψω τὸν ἄνθρωπον, ὃν ἐποίησα, ἀπὸ προσώπου τῆς γῆς</strong> ἀπὸ ἀνθρώπου ἕως κτήνους καὶ ἀπὸ ἑρπετῶν ἕως τῶν πετεινῶν τοῦ οὐρανοῦ, ὅτι ἐθυμώθην ὅτι ἐποίησα αὐτούς. &lt;…&gt; ἐφθάρη δὲ ἡ γῆ ἐναντίον τοῦ θεοῦ, καὶ ἐπλήσθη ἡ γῆ ἀδικίας. καὶ εἶδεν κύριος ὁ θεὸς τὴν γῆν, καὶ ἦν κατεφθαρμένη, ὅτι κατέφθειρεν πᾶσα σὰρξ τὴν ὁδὸν αὐτοῦ ἐπὶ τῆς γῆς. καὶ εἶπεν ὁ θεὸς πρὸς Νωε Καιρὸς παντὸς ἀνθρώπου ἥκει ἐναντίον μου, ὅτι ἐπλήσθη ἡ γῆ ἀδικίας ἀπ᾿ αὐτῶν, καὶ ἰδοὺ <strong>ἐγὼ καταφθείρω αὐτοὺς καὶ τὴν γῆν</strong>. <strong><mark>ποίησον οὖν σεαυτῷ κιβωτὸν</mark></strong> ἐκ ξύλων τετραγώνων· νοσσιὰς ποιήσεις τὴν κιβωτὸν καὶ ἀσφαλτώσεις αὐτὴν ἔσωθεν καὶ ἔξωθεν τῇ ἀσφάλτῳ. &lt;…&gt; <strong>ἐγὼ δὲ ἰδοὺ ἐπάγω τὸν κατακλυσμὸν ὕδωρ ἐπὶ τὴν γῆν καταφθεῖραι πᾶσαν σάρκα, ἐν ᾗ ἐστιν πνεῦμα ζωῆς</strong>, ὑποκάτω τοῦ οὐρανοῦ· καὶ <strong><mark>ὅσα ἐὰν ᾖ ἐπὶ τῆς γῆς, τελευτήσει</mark></strong>. καὶ στήσω τὴν διαθήκην μου πρὸς σέ· <strong>εἰσελεύσῃ δὲ εἰς τὴν κιβωτόν, σὺ καὶ οἱ υἱοί σου καὶ ἡ γυνή σου καὶ αἱ γυναῖκες τῶν υἱῶν σου μετὰ σοῦ</strong>. καὶ ἀπὸ πάντων τῶν κτηνῶν καὶ ἀπὸ πάντων τῶν ἑρπετῶν καὶ ἀπὸ πάντων τῶν θηρίων καὶ ἀπὸ πάσης σαρκός, δύο δύο ἀπὸ πάντων εἰσάξεις εἰς τὴν κιβωτόν, ἵνα τρέφῃς μετὰ σεαυτοῦ· ἄρσεν καὶ θῆλυ ἔσονται. ἀπὸ πάντων τῶν ὀρνέων τῶν πετεινῶν κατὰ γένος καὶ ἀπὸ πάντων τῶν κτηνῶν κατὰ γένος καὶ ἀπὸ πάντων τῶν ἑρπετῶν τῶν ἑρπόντων ἐπὶ τῆς γῆς κατὰ γένος αὐτῶν, δύο δύο ἀπὸ πάντων εἰσελεύσονται πρὸς σὲ τρέφεσθαι μετὰ σοῦ, ἄρσεν καὶ θῆλυ. σὺ δὲ λήμψῃ σεαυτῷ ἀπὸ πάντων τῶν βρωμάτων, ἃ ἔδεσθε, καὶ συνάξεις πρὸς σεαυτόν, καὶ ἔσται σοὶ καὶ ἐκείνοις φαγεῖν. καὶ ἐποίησεν Νωε πάντα, ὅσα ἐνετείλατο αὐτῷ κύριος ὁ θεός, οὕτως ἐποίησεν.» (<a href="https://bibleox.com/el/gr-lxx-byz/gen/6/#L7,11-14,17-22">Γεν 6:7,11-14,17-22</a>)</p></blockquote><blockquote><p>«καὶ <strong>ἀπέθανεν πᾶσα σὰρξ κινουμένη ἐπὶ τῆς γῆς</strong> τῶν πετεινῶν καὶ τῶν κτηνῶν καὶ τῶν θηρίων καὶ πᾶν ἑρπετὸν κινούμενον ἐπὶ τῆς γῆς καὶ πᾶς ἄνθρωπος. καὶ <strong>πάντα, ὅσα ἔχει πνοὴν ζωῆς, καὶ πᾶς, ὃς ἦν ἐπὶ τῆς ξηρᾶς, ἀπέθανεν</strong>. καὶ <strong>ἐξήλειψεν πᾶν τὸ ἀνάστημα, ὃ ἦν ἐπὶ προσώπου πάσης τῆς γῆς</strong>, ἀπὸ ἀνθρώπου ἕως κτήνους καὶ ἑρπετῶν καὶ τῶν πετεινῶν τοῦ οὐρανοῦ, καὶ <strong><mark>ἐξηλείφθησαν ἀπὸ τῆς γῆς· καὶ κατελείφθη μόνος Νωε καὶ οἱ μετ᾿ αὐτοῦ ἐν τῇ κιβωτῷ</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/gen/7/#L21-23">Γεν 7:21-23</a>)</p></blockquote><blockquote><p>«ἀπειθήσασίν ποτε ὅτε ἀπεξεδέχετο ἡ τοῦ θεοῦ μακροθυμία ἐν ἡμέραις Νῶε κατασκευαζομένης <strong><mark>κιβωτοῦ, εἰς ἣν ὀλίγοι, τοῦτ᾿ ἔστιν ὀκτὼ ψυχαί, διεσώθησαν</mark></strong> δι᾿ ὕδατος.» (<a href="https://bibleox.com/el/gr-lxx-byz/1pet/3/#L20">Α Πε 3:20</a>)</p></blockquote><h3>Οι παλαιοδιαθηκικοί τύποι γράφτηκαν για νουθεσία μας</h3><blockquote><p><em>«</em><strong><em>ταῦτα δὲ τυπικῶς συνέβαινεν ἐκείνοις, ἐγράφη δὲ πρὸς νουθεσίαν ἡμῶν</em></strong><em>, εἰς οὓς τὰ τέλη τῶν αἰώνων κατήντηκεν.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/1kor/10/#L11"><em>Α Κορ 10:11</em></a><em>)</em></p></blockquote><h2>Κριτική</h2><h3>Τα λέτε αυτά από υπερηφάνεια: «Μόνο εμείς σωζόμαστε, οι υπόλοιποι όχι»</h3><p>Κάποτε ο Θεός δημιούργησε μέσω του προφήτη Μωυσή την παλαιοδιαθηκική εκκλησία και θέσπισε εκεί τάξεις αρεστές σε Αυτόν. Αργότερα, δίπλα της προέκυψε ο σαμαρειτικός λαός, που αποτελούνταν από πλήθος μετατοπισμένων λαών, οι οποίοι με βάση τους πέντε κυλίνδρους του προφήτη Μωυσή (την Τορά), χωρίς να δέχονται τους κυλίνδρους των μεταγενέστερων συγγραφέων (των προφητών), δημιούργησαν μόνοι τους τη δική τους ξεχωριστή θρησκευτική κοινωνία με δικές της τάξεις, η οποία πίστευε με τον δικό της τρόπο στον Θεό και περίμενε τον Χριστό. Ο Χριστός απαντά στη Σαμαρείτιδα:</p><blockquote><p>«<strong>ὑμεῖς προσκυνεῖτε ὃ οὐκ οἴδατε</strong>· ἡμεῖς προσκυνοῦμεν ὃ οἴδαμεν, ὅτι <strong>ἡ σωτηρία ἐκ τῶν Ἰουδαίων ἐστίν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/4/#L22">Ιω 4:22</a>)</p></blockquote><p>Ο Χριστός το έλεγε αυτό από υπερηφάνεια ή επειδή στις αυθαίρετα δημιουργημένες κοινωνίες με αυθαίρετα επινοημένη πίστη κατά το βιβλίο, πραγματικά δεν μπορεί κανείς να σωθεί;</p><p>Όταν ο απόστολος λέει ότι όσοι πράττουν τα έργα της σάρκας, μεταξύ των οποίων είναι αιρέσεις και σχίσματα, δεν μπορούν να κληρονομήσουν τη Βασιλεία του Θεού, το λέει από υπερηφάνεια ή επειδή με τέτοιες αμαρτίες πραγματικά δεν μπορεί κανείς να κληρονομήσει τη Βασιλεία του Θεού;</p><blockquote><p><em>«</em><strong><em>φανερὰ δέ ἐστιν τὰ ἔργα τῆς σαρκός</em></strong><em>, ἅτινά ἐστιν πορνεία, ἀκαθαρσία, ἀσέλγεια, εἰδωλολατρία, φαρμακεία, ἔχθραι, ἔρις, ζῆλος, θυμοί, ἐριθείαι, </em><strong><em><mark>διχοστασίαι, αἱρέσεις</mark></em></strong><em>, φθόνοι, μέθαι, κῶμοι, καὶ τὰ ὅμοια τούτοις, ἃ προλέγω ὑμῖν καθὼς προεῖπον ὅτι οἱ τὰ τοιαῦτα πράσσοντες </em><strong><em><mark>βασιλείαν θεοῦ οὐ κληρονομήσουσιν</mark></em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/gal/5/#L19-21"><em>Γαλ 5:19-21</em></a><em>)</em></p><p><strong><em><mark>*διχοστασίαι</mark> — διαίρεση, διχασμός.</em></strong></p></blockquote><p>Οι Προτεστάντες βλέπουν εδώ υπερηφάνεια εξαιτίας της επινοημένης από αυτούς διδασκαλίας περί δήθεν ήδη ληφθείσας σωτηρίας μόνο χάρη στην αναγνώριση του Χριστού ως προσωπικού τους Σωτήρα, δηλαδή σωτηρίας αμέσως τώρα και μόνο διά της πίστεως. Οι Ορθόδοξοι δεν αποδέχονται αυτή τη διδασκαλία και, κατά συνέπεια, έχουν εντελώς διαφορετικό τρόπο σκέψης περί σωτηρίας (<a href="https://bibleox.com/el/el/w/Η_σωτηρία#HH-Οι-προϋποθέσεις-της-σωτηρίας">περισσότερα</a>).</p><p>Ερχόμενοι στην Ορθόδοξη Εκκλησία, δεν είμαστε ακόμη σωσμένοι, αλλά σωζόμαστε. Δεν θα σωθούν όλοι όσοι ήρθαν στην Εκκλησία, αλλά μόνο εκείνοι που, χρησιμοποιώντας τα μέσα της σωτηρίας, θα αρχίσουν να εργάζονται επιμελώς πάνω στον εαυτό τους, εκριζώνοντας τα αμαρτωλά πάθη και αποκτώντας τις ευαγγελικές αρετές. Η παραμονή στην Ορθόδοξη Εκκλησία είναι μόνο μία από τις προϋποθέσεις της σωτηρίας. Σε όποιον ζητά τη σωτηρία χρειάζονται τα μέσα της σωτηρίας: ο άρρωστος χρειάζεται φάρμακα και ο πνιγόμενος στη μέση του ωκεανού χρειάζεται πλοίο. Έτσι και σε κάθε άνθρωπο που πάσχει από αμαρτωλά πάθη, για να διαπλεύσει τη θάλασσα της επίγειας ζωής χωρίς να βυθιστεί στην αμαρτωλή άβυσσο και να φτάσει στη ζωή με τον Θεό, είναι απαραίτητα <strong>τα μέσα της σωτηρίας: η ορθή πίστη και τα χαριτόδοτα μυστήρια. </strong>Αυτά τα μέσα σωτηρίας τα έθεσε ο Θεός στην κιβωτό της σωτηρίας Του — την Ορθόδοξη Εκκλησία — την οποία ο ίδιος ο Θεός Ιησούς Χριστός ήρθε προσωπικά και δημιούργησε πριν από 2000 χρόνια.</p><p>Κοινότητες που δημιουργήθηκαν πρόσφατα αυθαίρετα από συνηθισμένους ανθρώπους, ευθέως κατά της θελήσεως του Θεού περί της ενότητας των πιστών, όχι μόνο δεν έχουν τα μέσα της σωτηρίας, αλλά αντίθετα, με την ίδια τη χωριστή ύπαρξή τους οδηγούν τους ανθρώπους σε βαριές αμαρτωλές καταστάσεις — θανάσιμα αμαρτήματα αιρέσεων και σχισμάτων (<a href="https://bibleox.com/el/gr-lxx-byz/gal/5/#L19-21">Γαλ 5:19-21</a>).</p><p>Η δημιουργία δικών μας «εκκλησιών», ο διαχωρισμός των πιστών, ευθέως κατά της θελήσεως του Χριστού και των αποστόλων περί της ενότητας των πιστών — όλα αυτά είναι ακριβώς εκδήλωση υπερηφάνειας:</p><blockquote><p><em>«Οὐ περὶ τούτων δὲ </em><strong><em><mark>ἐρωτῶ</mark></em></strong><em> μόνον, ἀλλὰ καὶ περὶ τῶν πιστευόντων διὰ τοῦ λόγου αὐτῶν εἰς ἐμέ, </em><strong><em><mark>ἵνα πάντες ἓν ὦσιν</mark></em></strong><em>, καθὼς σύ, πάτερ, ἐν ἐμοὶ κἀγὼ ἐν σοί, </em><strong><em>ἵνα καὶ αὐτοὶ ἐν ἡμῖν ὦσιν, <mark>ἵνα ὁ κόσμος πιστεύῃ ὅτι σύ με ἀπέστειλας</mark></em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/in/17/#L20-21"><em>Ιω 17:20-21</em></a><em>)</em></p></blockquote><blockquote><p><em>«</em><strong><em><mark>Παρακαλῶ</mark></em></strong><em> δὲ ὑμᾶς, ἀδελφοί, διὰ τοῦ ὀνόματος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, </em><strong><em><mark>ἵνα τὸ αὐτὸ λέγητε πάντες</mark>, <mark>καὶ μὴ ᾖ ἐν ὑμῖν σχίσματα</mark></em></strong><em>, </em><strong><em>ἦτε δὲ κατηρτισμένοι <mark>ἐν τῷ αὐτῷ νοῒ</mark> καὶ <mark>ἐν τῇ αὐτῇ γνώμῃ</mark></em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/1kor/1/#L10"><em>Α Κορ 1:10</em></a><em>)</em></p></blockquote><p>Φυσικά, πολεμώντας τον Χριστό και δημιουργώντας δικές μας «εκκλησίες», δεν μπορεί κανείς να σωθεί. Και ο απόστολος λέει ότι πράττοντας τα έργα της σάρκας, σε αιρέσεις και σχίσματα, δεν μπορεί κανείς να κληρονομήσει τη Βασιλεία των Ουρανών:</p><blockquote><p><em>«</em><strong><em>φανερὰ δέ ἐστιν τὰ ἔργα τῆς σαρκός</em></strong><em>, ἅτινά ἐστιν πορνεία, ἀκαθαρσία, ἀσέλγεια, εἰδωλολατρία, φαρμακεία, ἔχθραι, ἔρις, ζῆλος, θυμοί, ἐριθείαι, </em><strong><em><mark>διχοστασίαι, αἱρέσεις</mark></em></strong><em>, φθόνοι, μέθαι, κῶμοι, καὶ τὰ ὅμοια τούτοις, ἃ προλέγω ὑμῖν καθὼς προεῖπον ὅτι οἱ τὰ τοιαῦτα πράσσοντες </em><strong><em><mark>βασιλείαν θεοῦ οὐ κληρονομήσουσιν</mark></em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/gal/5/#L19-21"><em>Γαλ 5:19-21</em></a><em>)</em></p><p><strong><em><mark>*διχοστασίαι</mark> — διαίρεση, διχασμός.</em></strong></p></blockquote><p>Ο απόστολος λέει ευθέως ότι όσοι δημιουργούν διαιρέσεις δεν υπηρετούν τον Κύριο Ιησού Χριστό:</p><blockquote><p><em>«Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, </em><strong><em><mark>σκοπεῖν τοὺς τὰς διχοστασίας</mark></em></strong><em> καὶ τὰ σκάνδαλα παρὰ τὴν διδαχὴν ἣν ὑμεῖς ἐμάθετε ποιοῦντας, καὶ ἐκκλίνετε ἀπ᾿ αὐτῶν· </em><strong><em><mark>οἱ γὰρ τοιοῦτοι τῷ κυρίῳ ἡμῶν Χριστῷ οὐ δουλεύουσιν</mark></em></strong><em> ἀλλὰ τῇ ἑαυτῶν κοιλίᾳ, καὶ διὰ τῆς χρηστολογίας καὶ εὐλογίας ἐξαπατῶσιν τὰς καρδίας τῶν ἀκάκων.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/rim/16/#L17-18"><em>Ρωμ 16:17-18</em></a><em>)</em></p></blockquote><p>Πώς μπορεί κανείς να σωθεί ακολουθώντας τον δρόμο εκείνου που ενεργεί κατά του Χριστού;</p><p>Εξάλλου, η αίρεση και το σχίσμα δεν είναι οι μόνες αμαρτίες· υπάρχουν πολλά και άλλα θανάσιμα αμαρτήματα. Είναι άραγε πράξη υπερηφάνειας η προειδοποίηση προς τον μέθυσο ότι, παραμένοντας στο θανάσιμο αμάρτημα της μέθης, δεν μπορεί να κληρονομήσει τη Βασιλεία των Ουρανών, όπως λέγεται στη Γραφή (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/6/#L9">Α Κορ 6:9</a>); Ή το να πει κανείς κάτι παρόμοιο σε φονιά, κλέφτη, μάγο, πόρνο, απατεώνα; Αν αυτό δεν είναι υπερηφάνεια και πρέπει να προειδοποιούμε για αυτά τα θανάσιμα αμαρτήματα (<a href="https://bibleox.com/el/gr-lxx-byz/ef/5/#L11">Εφ 5:11</a>), τότε, για να είμαστε απόλυτα ειλικρινείς, πρέπει να προειδοποιούμε και τους αιρετικούς μαζί με τους σχισματικούς, γιατί η αίρεση και τα σχίσματα βρίσκονται στον ίδιο κατάλογο θανάσιμων αμαρτημάτων με τη μέθη, τους φόνους και τα παρόμοια, στα οποία παραμένοντας ο άνθρωπος δεν μπορεί να κληρονομήσει τη Βασιλεία των Ουρανών.</p><p>Πώς λοιπόν μπορεί ο άνθρωπος να βγει από αυτή την αμαρτωλή κατάσταση; Να αρνηθεί την παραμονή στην κοινωνία που δημιουργήθηκε πρόσφατα από έναν συνηθισμένο άνθρωπο και να αρνηθεί την πίστη αυτής της κοινωνίας, που επινοήθηκε πρόσφατα από τον ίδιο άνθρωπο. Στη συνέχεια πρέπει να εισέλθει στην Ορθόδοξη Εκκλησία, που δημιουργήθηκε από τον Κύριο Ιησού Χριστό, και να ασπαστεί την ορθόδοξη πίστη, την οποία διδάχθηκαν οι απόστολοι από τον Χριστό, την οποία αυτοί έθεσαν στην Ορθόδοξη Εκκλησία και η οποία διατηρείται αναλλοίωτα στην Εκκλησία του Χριστού από το Άγιο Πνεύμα, που της στάλθηκε για πάντα:</p><blockquote><p><em>«κἀγὼ ἐρωτήσω τὸν πατέρα καὶ ἄλλον παράκλητον δώσει ὑμῖν ἵνα </em><strong><em>μεθ᾿ ὑμῶν <mark>εἰς τὸν αἰῶνα</mark> ᾖ</em></strong><em>» (</em><a href="https://bibleox.com/el/gr-lxx-byz/in/14/#L16"><em>Ιω 14:16</em></a><em>)</em></p></blockquote><blockquote><p><em>«διδάσκοντες αὐτοὺς τηρεῖν πάντα ὅσα ἐνετειλάμην ὑμῖν· καὶ ἰδοὺ ἐγὼ μεθ᾿ ὑμῶν εἰμι </em><strong><em><mark>πάσας τὰς ἡμέρας</mark> ἕως τῆς συντελείας τοῦ αἰῶνος</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/mf/28/#L20"><em>Μτ 28:20</em></a><em>)</em></p></blockquote>'
