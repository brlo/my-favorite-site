  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: '<h2>Προσευχή για τις αρχές</h2><blockquote><p>«<strong>Παρακαλῶ οὖν πρῶτον πάντων ποιεῖσθαι δεήσεις, <mark>προσευχάς</mark></strong>, ἐντεύξεις, εὐχαριστίας, ὑπὲρ πάντων ἀνθρώπων, <strong><mark>ὑπὲρ βασιλέων καὶ πάντων τῶν ἐν ὑπεροχῇ ὄντων</mark></strong>, ἵνα ἤρεμον καὶ ἡσύχιον βίον διάγωμεν ἐν πάσῃ εὐσεβείᾳ καὶ σεμνότητι. τοῦτο καλὸν καὶ ἀπόδεκτον ἐνώπιον τοῦ σωτῆρος ἡμῶν θεοῦ, ὃς πάντας ἀνθρώπους θέλει σωθῆναι καὶ εἰς ἐπίγνωσιν ἀληθείας ἐλθεῖν.» (<a href="https://bibleox.com/el/gr-lxx-byz/1tim/2/#L1-4">Α Τιμ 2:1-4</a>)</p></blockquote><h2>Υπακοή στις κρατικές αρχές</h2><blockquote><p>«Ὑπομίμνῃσκε αὐτοὺς <strong><mark>ἀρχαῖς ἐξουσίαις ὑποτάσσεσθαι, πειθαρχεῖν</mark></strong>, πρὸς πᾶν ἔργον ἀγαθὸν ἑτοίμους εἶναι, μηδένα βλασφημεῖν, ἀμάχους εἶναι, ἐπιεικεῖς, <strong>πᾶσαν ἐνδεικνυμένους πραΰτητα</strong> πρὸς πάντας ἀνθρώπους.» (<a href="https://bibleox.com/el/gr-lxx-byz/tit/3/#L1-2">Τιτ 3:1-2</a>)</p></blockquote><blockquote><p>«<strong><mark>Ὑποτάγητε πάσῃ ἀνθρωπίνῃ κτίσει</mark></strong> διὰ τὸν κύριον· εἴτε <strong><mark>βασιλεῖ</mark></strong> ὡς <strong><mark>ὑπερέχοντι</mark></strong>, εἴτε <strong><mark>ἡγεμόσιν</mark></strong> ὡς δι᾿ αὐτοῦ πεμπομένοις εἰς ἐκδίκησιν κακοποιῶν ἔπαινον δὲ ἀγαθοποιῶν·» (<a href="https://bibleox.com/el/gr-lxx-byz/1pet/2/#L13-14">Α Πε 2:13-14</a>)</p></blockquote><blockquote><p>«πάντας τιμήσατε, τὴν ἀδελφότητα ἀγαπᾶτε, τὸν θεὸν φοβεῖσθε, <strong><mark>τὸν βασιλέα τιμᾶτε</mark></strong>. Οἱ οἰκέται <strong>ὑποτασσόμενοι ἐν παντὶ φόβῳ τοῖς δεσπόταις, οὐ μόνον τοῖς ἀγαθοῖς καὶ ἐπιεικέσιν ἀλλὰ καὶ τοῖς σκολιοῖς. τοῦτο γὰρ χάρις</strong> εἰ διὰ συνείδησιν θεοῦ ὑποφέρει τις λύπας πάσχων ἀδίκως.» (<a href="https://bibleox.com/el/gr-lxx-byz/1pet/2/#L17-19">Α Πε 2:17-19</a>)</p></blockquote><blockquote><p>«ἔφη τε ὁ Παῦλος, Οὐκ ᾔδειν, ἀδελφοί, ὅτι ἐστὶν ἀρχιερεύς· γέγραπται γὰρ ὅτι <strong><mark>Ἄρχοντα τοῦ λαοῦ σου οὐκ ἐρεῖς κακῶς</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/23/#L5">Πραξ 23:5</a>)</p></blockquote><blockquote><p>«ὡς Σόδομα καὶ Γόμορρα καὶ αἱ περὶ αὐτὰς πόλεις, τὸν ὅμοιον τρόπον τούτοις ἐκπορνεύσασαι καὶ ἀπελθοῦσαι ὀπίσω σαρκὸς ἑτέρας, πρόκεινται δεῖγμα πυρὸς αἰωνίου δίκην ὑπέχουσαι. Ὁμοίως μέντοι καὶ οὗτοι ἐνυπνιαζόμενοι σάρκα μὲν μιαίνουσιν, <strong><mark>κυριότητα δὲ ἀθετοῦσιν, δόξας δὲ βλασφημοῦσιν</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/iud/1/#L7-8">Ιούδα 1:7-8</a>)</p></blockquote><p>Δεν υπάρχει εξουσία που δεν είναι από τον Θεό, και οι υπάρχουσες εξουσίες έχουν οριστεί από τον Θεό — <strong>λέει ο απόστολος, βρισκόμενος στη Ρωμαϊκή Αυτοκρατορία</strong> με ειδωλολατρικές λατρείες:</p><blockquote><p>«<strong>Πᾶσα ψυχὴ ἐξουσίαις ὑπερεχούσαις ὑποτασσέσθω</strong>. <strong>οὐ γὰρ ἔστιν ἐξουσία εἰ μὴ ὑπὸ θεοῦ</strong>, <strong><mark>αἱ δὲ οὖσαι ὑπὸ θεοῦ τεταγμέναι εἰσίν</mark></strong>· ὥστε ὁ ἀντιτασσόμενος τῇ ἐξουσίᾳ τῇ τοῦ θεοῦ διαταγῇ ἀνθέστηκεν, οἱ δὲ ἀνθεστηκότες ἑαυτοῖς κρίμα λήμψονται. οἱ γὰρ ἄρχοντες οὐκ εἰσὶν φόβος τῷ ἀγαθῷ ἔργῳ ἀλλὰ τῷ κακῷ. θέλεις δὲ μὴ φοβεῖσθαι τὴν ἐξουσίαν; τὸ ἀγαθὸν ποίει, καὶ ἕξεις ἔπαινον ἐξ αὐτῆς· <strong>θεοῦ</strong> γὰρ <strong>διάκονός ἐστιν</strong> σοὶ εἰς τὸ ἀγαθόν. ἐὰν δὲ τὸ κακὸν ποιῇς, φοβοῦ· οὐ γὰρ εἰκῇ τὴν μάχαιραν φορεῖ· θεοῦ γὰρ διάκονός ἐστιν, <strong>ἔκδικος εἰς ὀργὴν τῷ τὸ κακὸν πράσσοντι</strong>. διὸ <strong>ἀνάγκη ὑποτάσσεσθαι</strong>, οὐ μόνον διὰ τὴν ὀργὴν ἀλλὰ καὶ διὰ τὴν συνείδησιν.» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/13/#L1-5">Ρωμ 13:1-5</a>)</p></blockquote><p>Ο Χριστός δείχνει ότι ο Πιλάτος έχει εξουσία άνωθεν:</p><blockquote><p>«<strong><mark>Οὐκ εἶχες ἐξουσίαν κατ᾿ ἐμοῦ οὐδεμίαν εἰ μὴ ἦν δεδομένον σοι ἄνωθεν</mark></strong>· διὰ τοῦτο ὁ παραδούς μέ σοι μείζονα ἁμαρτίαν ἔχει.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/19/#L11">Ιω 19:11</a>)</p></blockquote><h2>Το όριο της υπακοής στις κρατικές αρχές</h2><blockquote><p>«ὁ δὲ Πέτρος καὶ Ἰωάννης ἀποκριθέντες εἶπον πρὸς αὐτούς, <strong>Εἰ δίκαιόν ἐστιν ἐνώπιον τοῦ θεοῦ</strong> ὑμῶν ἀκούειν μᾶλλον ἢ τοῦ θεοῦ, κρίνατε» (<a href="https://bibleox.com/el/gr-lxx-byz/act/4/#L19">Πραξ 4:19</a>)</p></blockquote><blockquote><p>«ἀποκριθεὶς δὲ Πέτρος καὶ οἱ ἀπόστολοι εἶπαν, <strong>Πειθαρχεῖν δεῖ θεῷ μᾶλλον ἢ ἀνθρώποις</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/5/#L29">Πραξ 5:29</a>)</p></blockquote><h2>Φόροι</h2><blockquote><p>«διὰ τοῦτο γὰρ καὶ <strong>φόρους τελεῖτε</strong>, λειτουργοὶ γὰρ θεοῦ εἰσιν εἰς αὐτὸ τοῦτο προσκαρτεροῦντες. <strong>ἀπόδοτε πᾶσιν τὰς ὀφειλάς, τῷ τὸν φόρον τὸν φόρον, τῷ τὸ τέλος τὸ τέλος, τῷ τὸν φόβον τὸν φόβον, τῷ τὴν τιμὴν</strong> τὴν τιμήν.» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/13/#L6-7">Ρωμ 13:6-7</a>)</p></blockquote><h2>Παλαιά Διαθήκη</h2><blockquote><p>«<strong>φοβοῦ τὸν θεόν, υἱέ, καὶ βασιλέα</strong> καὶ μηθετέρῳ αὐτῶν ἀπειθήσῃς·» (<a href="https://bibleox.com/el/gr-lxx-byz/pr/24/#L21">Πρμ 24:21</a>)</p></blockquote><h3>Ο Θεός «προσλαμβάνει» ξένους βασιλείς για τιμωρία</h3><blockquote><p>«ἀλλὰ <strong>ἐπάξει ὁ θεὸς ἐπὶ σὲ</strong> καὶ ἐπὶ τὸν λαόν σου καὶ ἐπὶ τὸν οἶκον τοῦ πατρός σου ἡμέρας, αἳ οὔπω ἥκασιν ἀφ᾿ ἧς ἡμέρας ἀφεῖλεν Εφραιμ ἀπὸ Ιουδα, <strong>τὸν βασιλέα τῶν Ἀσσυρίων</strong>. &lt;…&gt; ἐν τῇ ἡμέρᾳ ἐκείνῃ <strong><mark>ξυρήσει κύριος τῷ ξυρῷ τῷ μεγάλῳ καὶ μεμεθυσμένῳ, ὅ ἐστιν πέραν τοῦ ποταμοῦ</mark></strong> βασιλέως Ἀσσυρίων, τὴν κεφαλὴν καὶ τὰς τρίχας τῶν ποδῶν καὶ τὸν πώγωνα ἀφελεῖ.» (<a href="https://bibleox.com/el/gr-lxx-byz/is/7/#L17,20">Ησ 7:17,20</a>)</p></blockquote><h3>Ο Θεός διατάζει τον ιουδαϊκό λαό να υποταχθεί στον βαβυλώνιο βασιλιά Ναβουχοδονόσορα</h3><blockquote><p>«<strong>ἔδωκα τὴν γῆν τῷ Ναβουχοδονοσορ βασιλεῖ Βαβυλῶνος <mark>δουλεύειν αὐτῷ</mark>, καὶ τὰ θηρία τοῦ ἀγροῦ ἐργάζεσθαι αὐτῷ</strong>. &lt;…&gt; <strong>καὶ τὸ ἔθνος καὶ ἡ βασιλεία, ὅσοι ἐὰν μὴ ἐμβάλωσιν τὸν τράχηλον αὐτῶν ὑπὸ τὸν ζυγὸν βασιλέως Βαβυλῶνος, <mark>ἐν μαχαίρᾳ καὶ ἐν λιμῷ ἐπισκέψομαι αὐτούς</mark>, εἶπεν κύριος, <mark>ἕως ἐκλίπωσιν ἐν χειρὶ αὐτοῦ</mark></strong>. καὶ ὑμεῖς μὴ ἀκούετε τῶν ψευδοπροφητῶν ὑμῶν καὶ τῶν μαντευομένων ὑμῖν καὶ τῶν ἐνυπνιαζομένων ὑμῖν καὶ τῶν οἰωνισμάτων ὑμῶν καὶ τῶν φαρμακῶν ὑμῶν τῶν λεγόντων Οὐ μὴ ἐργάσησθε τῷ βασιλεῖ Βαβυλῶνος· ὅτι ψευδῆ αὐτοὶ προφητεύουσιν ὑμῖν πρὸς τὸ μακρῦναι ὑμᾶς ἀπὸ τῆς γῆς ὑμῶν. <strong>καὶ τὸ ἔθνος, ὃ ἐὰν <mark>εἰσαγάγῃ τὸν τράχηλον αὐτοῦ ὑπὸ τὸν ζυγὸν βασιλέως Βαβυλῶνος καὶ ἐργάσηται αὐτῷ, καὶ καταλείψω αὐτὸν ἐπὶ τῆς γῆς αὐτοῦ</mark></strong>, καὶ ἐργᾶται αὐτῷ καὶ ἐνοικήσει ἐν αὐτῇ. — καὶ πρὸς Σεδεκιαν βασιλέα Ιουδα ἐλάλησα κατὰ πάντας τοὺς λόγους τούτους λέγων <strong><mark>Εἰσαγάγετε τὸν τράχηλον ὑμῶν</mark></strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/ier/34/#L6,8-12">Ιερ 34:6,8-12</a>) — Στην έκδοση των Εβδομήκοντα η περικοπή βρίσκεται στο Ιερ 34 (στίχοι 6, 8–12)· οι στίχοι 7 και 13 στο κείμενο της Ελληνικής Βίβλου που παραθέτουμε λείπουν.</p></blockquote><p>Εν τω μεταξύ, ο βαβυλώνιος βασιλιάς Ναβουχοδονόσορας ήταν βεβαίως ειδωλολάτρης (<a href="https://bibleox.com/el/gr-lxx-byz/dan/3/#L1-6">Δν 3:1-6</a>). Η υποταγή σε αυτόν σήμαινε αναγνώριση της κοσμικής εξουσίας του πάνω στα εξωτερικά: στη γη, στα πλούτη και στα λοιπά. Όταν ο Ναβουχοδονόσορας άρχισε να εξαναγκάζει τους Ιουδαίους να προσκυνήσουν τα είδωλα, τότε ακριβώς αυτή η θεομάχη διαταγή του απορρίφθηκε:</p><blockquote><p>«οὓς καὶ συνιδὼν Ναβουχοδονοσορ ὁ βασιλεὺς εἶπεν αὐτοῖς Διὰ τί, Σεδραχ, Μισαχ, Αβδεναγω, <strong>τοῖς θεοῖς μου οὐ λατρεύετε καὶ τῇ εἰκόνι τῇ χρυσῇ, ἣν ἔστησα, οὐ προσκυνεῖτε</strong>;» (<a href="https://bibleox.com/el/gr-lxx-byz/dan/3/#L14">Δν 3:14</a>)</p></blockquote><p>Τον αναγνωρίζουν ως βασιλιά, αλλά αρνούνται να υπακούσουν:</p><blockquote><p>«ἀποκριθέντες δὲ Σεδραχ, Μισαχ, Αβδεναγω εἶπαν τῷ βασιλεῖ Ναβουχοδονοσορ <strong><mark>Βασιλεῦ</mark></strong>, οὐ χρείαν ἔχομεν ἡμεῖς ἐπὶ τῇ ἐπιταγῇ ταύτῃ ἀποκριθῆναί σοι· ἔστι γὰρ θεὸς ἐν οὐρανοῖς εἷς κύριος ἡμῶν, ὃν φοβούμεθα, ὅς ἐστι δυνατὸς ἐξελέσθαι ἡμᾶς ἐκ τῆς καμίνου τοῦ πυρός, καὶ ἐκ τῶν χειρῶν σου, <strong><mark>βασιλεῦ</mark></strong>, ἐξελεῖται ἡμᾶς· καὶ τότε φανερόν σοι ἔσται, ὅτι <strong><mark>οὔτε τῷ εἰδώλῳ σου λατρεύομεν οὔτε τῇ εἰκόνι σου τῇ χρυσῇ, ἣν ἔστησας, προσκυνοῦμεν</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/dan/3/#L16-18">Δν 3:16-18</a>)</p></blockquote><p>Γι’ αυτό ρίχτηκαν στο καμίνι:</p><blockquote><p>«τότε οἱ ἄνδρες ἐκεῖνοι συνεποδίσθησαν ἔχοντες τὰ ὑποδήματα αὐτῶν καὶ τὰς τιάρας αὐτῶν ἐπὶ τῶν κεφαλῶν αὐτῶν σὺν τῷ ἱματισμῷ αὐτῶν καὶ <strong>ἐβλήθησαν εἰς τὴν κάμινον</strong>. ἐπειδὴ τὸ πρόσταγμα τοῦ βασιλέως ἤπειγεν καὶ ἡ κάμινος ἐξεκαύθη ὑπὲρ τὸ πρότερον ἑπταπλασίως, καὶ οἱ ἄνδρες οἱ προχειρισθέντες συμποδίσαντες αὐτοὺς καὶ προσαγαγόντες τῇ καμίνῳ ἐνεβάλοσαν εἰς αὐτήν. τοὺς μὲν οὖν ἄνδρας τοὺς συμποδίσαντας τοὺς περὶ τὸν Αζαριαν ἐξελθοῦσα ἡ φλὸξ ἐκ τῆς καμίνου ἐνεπύρισε καὶ ἀπέκτεινεν, <strong>αὐτοὶ δὲ συνετηρήθησαν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/dan/3/#L21-23">Δν 3:21-23</a>) — Στην έκδοση των Εβδομήκοντα ο στίχος 3:24 περιέχει την προσευχή των τριών νέων· η περικοπή παρατίθεται έως τον στίχο 23.</p></blockquote><p>Και ο άγγελος του Θεού τους διαφύλαξε αβλαβείς:</p><blockquote><p>«<strong>ἄγγελος δὲ κυρίου</strong> συγκατέβη ἅμα τοῖς περὶ τὸν Αζαριαν εἰς τὴν κάμινον καὶ ἐξετίναξε τὴν φλόγα τοῦ πυρὸς ἐκ τῆς καμίνου καὶ ἐποίησε τὸ μέσον τῆς καμίνου ὡσεὶ πνεῦμα δρόσου διασυρίζον, καὶ <strong>οὐχ ἥψατο αὐτῶν καθόλου τὸ πῦρ καὶ οὐκ ἐλύπησε καὶ οὐ παρηνώχλησεν αὐτούς</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/dan/3/#L49-50">Δν 3:49-50</a>)</p></blockquote><p>Οι τρεις νέοι δεν υπάκουσαν μόνο σε αυτή τη μία βασιλική διαταγή, να λατρεύσουν άλλους θεούς:</p><blockquote><p>«Καὶ ἐγένετο ἐν τῷ ἀκοῦσαι τὸν βασιλέα ὑμνούντων αὐτῶν καὶ ἑστὼς ἐθεώρει αὐτοὺς ζῶντας, τότε Ναβουχοδονοσορ ὁ βασιλεὺς ἐθαύμασε καὶ ἀνέστη σπεύσας καὶ εἶπεν τοῖς φίλοις αὐτοῦ &lt;…&gt; <strong>ὑπολαβὼν δὲ Ναβουχοδονοσορ ὁ βασιλεὺς εἶπεν Εὐλογητὸς κύριος ὁ θεὸς τοῦ Σεδραχ, Μισαχ, Αβδεναγω, ὃς ἀπέστειλε τὸν ἄγγελον αὐτοῦ καὶ ἔσωσε τοὺς παῖδας αὐτοῦ τοὺς ἐλπίσαντας ἐπ᾿ αὐτόν, <mark>τὴν γὰρ προσταγὴν τοῦ βασιλέως ἠθέτησαν</mark></strong> καὶ παρέδωκαν τὰ σώματα αὐτῶν εἰς ἐμπυρισμόν, <strong><mark>ἵνα μὴ λατρεύσωσι μηδὲ προσκυνήσωσι θεῷ ἑτέρῳ ἀλλ᾿ ἢ τῷ θεῷ αὐτῶν</mark></strong>· καὶ νῦν ἐγὼ κρίνω ἵνα πᾶν ἔθνος καὶ πᾶσαι φυλαὶ καὶ πᾶσαι γλῶσσαι, ὃς ἂν βλασφημήσῃ εἰς τὸν κύριον τὸν θεὸν Σεδραχ, Μισαχ, Αβδεναγω, διαμελισθήσεται καὶ ἡ οἰκία αὐτοῦ δημευθήσεται, διότι οὐκ ἔστιν θεὸς ἕτερος ὃς δυνήσεται ἐξελέσθαι οὕτως.» (<a href="https://bibleox.com/el/gr-lxx-byz/dan/3/#L91,95-96">Δν 3:91,95-96</a>)</p></blockquote><h3>Ο Θεός έσωζε από ξένους βασιλείς</h3><blockquote><p>«οὐχ οὕτως· τάδε λέγει κύριος πρὸς βασιλέα Ἀσσυρίων Οὐκ εἰσελεύσεται εἰς τὴν πόλιν ταύτην καὶ οὐ τοξεύσει ἐκεῖ βέλος, καὶ οὐ προφθάσει αὐτὴν θυρεός, καὶ οὐ μὴ ἐκχέῃ πρὸς αὐτὴν πρόσχωμα· τῇ ὁδῷ, ᾗ ἦλθεν, ἐν αὐτῇ ἀποστραφήσεται καὶ εἰς τὴν πόλιν ταύτην οὐκ εἰσελεύσεται, λέγει κύριος. <strong>καὶ ὑπερασπιῶ ὑπὲρ τῆς πόλεως ταύτης δι᾿ ἐμὲ καὶ διὰ Δαυιδ τὸν δοῦλόν μου</strong>. Καὶ ἐγένετο ἕως νυκτὸς καὶ <strong>ἐξῆλθεν ἄγγελος κυρίου καὶ ἐπάταξεν ἐν τῇ παρεμβολῇ τῶν Ἀσσυρίων ἑκατὸν ὀγδοήκοντα πέντε χιλιάδας</strong>· καὶ ὤρθρισαν τὸ πρωί, καὶ ἰδοὺ πάντες σώματα νεκρά. καὶ ἀπῆρεν καὶ ἐπορεύθη καὶ ἀπέστρεψεν Σενναχηριμ βασιλεὺς Ἀσσυρίων καὶ ᾤκησεν ἐν Νινευη.» (<a href="https://bibleox.com/el/gr-lxx-byz/4ts/19/#L32-36">Δ Βασ 19:32-36</a>)</p></blockquote><h3>Από την ευσέβεια του λαού εξαρτιόνταν η τιμωρία και η απελευθέρωση</h3><blockquote><p>«λέγων <strong>Ἀποστράφητε ἕκαστος ἀπὸ τῆς ὁδοῦ αὐτοῦ τῆς πονηρᾶς καὶ ἀπὸ τῶν πονηρῶν ἐπιτηδευμάτων ὑμῶν, καὶ κατοικήσετε ἐπὶ τῆς γῆς, ἧς ἔδωκα ὑμῖν καὶ τοῖς πατράσιν ὑμῶν ἀπ᾿ αἰῶνος καὶ ἕως αἰῶνος· <mark>μὴ πορεύεσθε ὀπίσω θεῶν ἀλλοτρίων τοῦ δουλεύειν αὐτοῖς καὶ τοῦ προσκυνεῖν αὐτοῖς, ὅπως μὴ παροργίζητέ με ἐν τοῖς ἔργοις τῶν χειρῶν ὑμῶν τοῦ κακῶσαι ὑμᾶς</mark></strong>. <strong><mark>καὶ οὐκ ἠκούσατέ μου</mark></strong>. διὰ τοῦτο τάδε λέγει κύριος <strong><mark>Ἐπειδὴ οὐκ ἐπιστεύσατε τοῖς λόγοις μου</mark></strong>, ἰδοὺ ἐγὼ ἀποστέλλω καὶ λήμψομαι τὴν πατριὰν ἀπὸ βορρᾶ καὶ ἄξω αὐτοὺς ἐπὶ τὴν γῆν ταύτην καὶ ἐπὶ τοὺς κατοικοῦντας αὐτὴν καὶ ἐπὶ πάντα τὰ ἔθνη τὰ κύκλῳ αὐτῆς καὶ <strong>ἐξερημώσω αὐτοὺς καὶ δώσω αὐτοὺς εἰς ἀφανισμὸν καὶ εἰς συριγμὸν καὶ εἰς ὀνειδισμὸν αἰώνιον</strong>· καὶ ἀπολῶ ἀπ᾿ αὐτῶν φωνὴν χαρᾶς καὶ φωνὴν εὐφροσύνης, φωνὴν νυμφίου καὶ φωνὴν νύμφης, ὀσμὴν μύρου καὶ φῶς λύχνου. καὶ ἔσται πᾶσα ἡ γῆ εἰς ἀφανισμόν, καὶ <strong>δουλεύσουσιν ἐν τοῖς ἔθνεσιν ἑβδομήκοντα ἔτη</strong>. <strong>καὶ ἐν τῷ πληρωθῆναι τὰ ἑβδομήκοντα ἔτη ἐκδικήσω τὸ ἔθνος ἐκεῖνο, φησὶν κύριος, καὶ θήσομαι αὐτοὺς εἰς ἀφανισμὸν αἰώνιον</strong>·» (<a href="https://bibleox.com/el/gr-lxx-byz/ier/25/#L5-12">Ιερ 25:5-12</a>)</p></blockquote><blockquote><p>«<strong>δῴη σοι κατὰ τὴν καρδίαν σου</strong> καὶ πᾶσαν τὴν βουλήν σου πληρώσαι.» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/19/#L4">Ψλ 19:4</a>)</p></blockquote>'
