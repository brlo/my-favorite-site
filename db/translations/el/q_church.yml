  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <h2>Η αληθινή διδασκαλία έχει ήδη δοθεί μια φορά στην Εκκλησία</h2><blockquote><p><em>«Ἀγαπητοί, πᾶσαν σπουδὴν ποιούμενος γράφειν ὑμῖν περὶ τῆς κοινῆς ἡμῶν σωτηρίας ἀνάγκην ἔσχον γράψαι ὑμῖν παρακαλῶν </em><strong><em>ἐπαγωνίζεσθαι τῇ <mark>ἅπαξ</mark> παραδοθείσῃ τοῖς ἁγίοις πίστει</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/iud/1/#L3"><em>Ιούδα 1:3</em></a><em>)</em></p></blockquote><blockquote><p>«<strong><mark>ὑμεῖς ὃ ἠκούσατε ἀπ᾿ ἀρχῆς ἐν ὑμῖν μενέτω</mark></strong>· <strong><mark>ἐὰν ἐν ὑμῖν μείνῃ ὃ</mark> <mark>ἀπ᾿ ἀρχῆς</mark> ἠκούσατε</strong>, καὶ ὑμεῖς ἐν τῷ υἱῷ καὶ ἐν τῷ πατρὶ μενεῖτε.» (<a href="https://bibleox.com/el/gr-lxx-byz/1in/2/#L24">Α Ιω 2:24</a>)</p></blockquote><p>Γι’ αυτό η Εκκλησία ονομάζεται πλήρωμα:</p><blockquote><p>«καὶ πάντα ὑπέταξεν ὑπὸ τοὺς πόδας αὐτοῦ, καὶ αὐτὸν ἔδωκεν κεφαλὴν ὑπὲρ πάντα τῇ <strong>ἐκκλησίᾳ</strong>, ἥτις ἐστὶν τὸ σῶμα αὐτοῦ, τὸ <strong><mark>πλήρωμα</mark></strong> τοῦ τὰ πάντα ἐν πᾶσιν πληρουμένου.» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/1/#L22-23">Εφ 1:22-23</a>)</p></blockquote><p>Η Εκκλησία βεβαιώνει αυτή την αλήθεια:</p><blockquote><p>«ἐὰν δὲ βραδύνω, ἵνα εἰδῇς πῶς δεῖ ἐν οἴκῳ θεοῦ ἀναστρέφεσθαι, ἥτις ἐστὶν ἐκκλησία θεοῦ ζῶντος, στῦλος καὶ <strong><mark>ἑδραίωμα τῆς ἀληθείας</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1tim/3/#L15">Α Τιμ 3:15</a>)</p></blockquote><h2>Την αληθινή διδασκαλία την έδωσε προσωπικά και φανερά ο ίδιος ο Χριστός Θεός</h2><p>Αυτή η διδασκαλία παραδόθηκε από τον Χριστό ως προερχόμενη από τον Πατέρα:</p><blockquote><p>«ὅτι <strong>τὰ ῥήματα ἃ ἔδωκάς μοι δέδωκα αὐτοῖς</strong>, καὶ αὐτοὶ ἔλαβον καὶ ἔγνωσαν ἀληθῶς ὅτι παρὰ σοῦ ἐξῆλθον, καὶ ἐπίστευσαν ὅτι σύ με ἀπέστειλας.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/17/#L8">Ιω 17:8</a>)</p></blockquote><p>Πρέπει να παραμένει κανείς ακριβώς στη διδασκαλία που έδωσε ο Χριστός:</p><blockquote><p>«πᾶς ὁ προάγων καὶ μὴ μένων ἐν τῇ διδαχῇ τοῦ Χριστοῦ θεὸν οὐκ ἔχει· <strong>ὁ μένων ἐν τῇ διδαχῇ, οὗτος καὶ τὸν πατέρα καὶ τὸν υἱὸν ἔχει</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/2in/1/#L9">Β Ιω 1:9</a>)</p></blockquote><h2>Δεν επιτρέπεται να διδάσκει κανείς διαφορετικά</h2><blockquote><p><em>«Καθὼς παρεκάλεσά σε προσμεῖναι ἐν Ἐφέσῳ πορευόμενος εἰς Μακεδονίαν, </em><strong><em>ἵνα παραγγείλῃς τισὶν <mark>μὴ ἑτεροδιδασκαλεῖν</mark></em></strong><em> μηδὲ προσέχειν μύθοις καὶ γενεαλογίαις ἀπεράντοις, αἵτινες ἐκζητήσεις παρέχουσιν μᾶλλον ἢ οἰκονομίαν θεοῦ τὴν ἐν πίστει·» (</em><a href="https://bibleox.com/el/gr-lxx-byz/1tim/1/#L3-4"><em>Α Τιμ 1:3-4</em></a><em>)</em></p></blockquote><blockquote><p><em>«καὶ </em><strong><em><mark>ἃ ἤκουσας</mark></em></strong><em> </em><strong><em>παρ᾿ ἐμοῦ</em></strong><em> διὰ πολλῶν μαρτύρων, </em><strong><em><mark>ταῦτα παράθου</mark> πιστοῖς</em></strong><em> ἀνθρώποις, οἵτινες ἱκανοὶ ἔσονται καὶ ἑτέρους διδάξαι.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/2tim/2/#L2"><em>Β Τιμ 2:2</em></a><em>)</em></p></blockquote><blockquote><p><em>«Ἐπαινῶ δὲ ὑμᾶς ὅτι πάντα μου μέμνησθε καὶ </em><strong><em><mark>καθὼς παρέδωκα ὑμῖν τὰς παραδόσεις κατέχετε</mark></em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/1kor/11/#L2"><em>Α Κορ 11:2</em></a><em>)</em></p></blockquote><blockquote><p><em>«Γνωρίζω δὲ ὑμῖν, ἀδελφοί, τὸ εὐαγγέλιον ὃ εὐηγγελισάμην ὑμῖν, ὃ καὶ παρελάβετε, ἐν ᾧ καὶ ἑστήκατε, δι᾿ οὗ καὶ σῴζεσθε, τίνι λόγῳ εὐηγγελισάμην ὑμῖν </em><strong><em><mark>εἰ κατέχετε</mark></em></strong><em>, ἐκτὸς εἰ μὴ εἰκῇ ἐπιστεύσατε.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/1kor/15/#L1-2"><em>Α Κορ 15:1-2</em></a><em>)</em></p></blockquote><blockquote><p><em>«Λοιπὸν οὖν, ἀδελφοί, ἐρωτῶμεν ὑμᾶς καὶ </em><strong><em>παρακαλοῦμεν</em></strong><em> ἐν κυρίῳ Ἰησοῦ, ἵνα </em><strong><em>καθὼς <mark>παρελάβετε παρ᾿ ἡμῶν</mark> τὸ πῶς δεῖ ὑμᾶς περιπατεῖν καὶ ἀρέσκειν θεῷ, καθὼς καὶ περιπατεῖτε, ἵνα <mark>περισσεύητε</mark> μᾶλλον</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/1sol/4/#L1"><em>Α Θεσ 4:1</em></a><em>)</em></p></blockquote><blockquote><p><em>«ἄρα οὖν, ἀδελφοί, στήκετε, καὶ </em><strong><em><mark>κρατεῖτε τὰς παραδόσεις ἃς ἐδιδάχθητε</mark></em></strong><em> εἴτε διὰ λόγου εἴτε δι᾿ ἐπιστολῆς ἡμῶν.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/2sol/2/#L15"><em>Β Θεσ 2:15</em></a><em>)</em></p></blockquote><h2>Θα προσπαθούν να διαστρέφουν την πίστη που δόθηκε μια φορά</h2><blockquote><p><em>«ἀντεχόμενον τοῦ κατὰ τὴν διδαχὴν πιστοῦ λόγου, ἵνα δυνατὸς ᾖ καὶ παρακαλεῖν ἐν τῇ διδασκαλίᾳ τῇ ὑγιαινούσῃ καὶ τοὺς ἀντιλέγοντας ἐλέγχειν. </em><strong><em><mark>Εἰσὶν γὰρ πολλοὶ [καὶ] ἀνυπότακτοι, ματαιολόγοι καὶ φρεναπάται</mark></em></strong><em>, μάλιστα οἱ ἐκ τῆς περιτομῆς, οὓς δεῖ ἐπιστομίζειν, οἵτινες ὅλους οἴκους ἀνατρέπουσιν διδάσκοντες ἃ μὴ δεῖ αἰσχροῦ κέρδους χάριν.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/tit/1/#L9-11"><em>Τιτ 1:9-11</em></a><em>)</em></p></blockquote><blockquote><p><em>«φοβοῦμαι δὲ μή πως, ὡς ὁ ὄφις ἐξηπάτησεν Εὕαν ἐν τῇ πανουργίᾳ αὐτοῦ, φθαρῇ τὰ νοήματα ὑμῶν ἀπὸ τῆς ἁπλότητος [καὶ τῆς ἁγνότητος] τῆς εἰς τὸν Χριστόν. εἰ μὲν γὰρ ὁ ἐρχόμενος </em><strong><em><mark>ἄλλον Ἰησοῦν κηρύσσει ὃν οὐκ ἐκηρύξαμεν</mark></em></strong><em>, ἢ πνεῦμα ἕτερον λαμβάνετε ὃ οὐκ ἐλάβετε, ἢ </em><strong><em><mark>εὐαγγέλιον ἕτερον ὃ οὐκ ἐδέξασθε</mark></em></strong><em>, καλῶς ἀνέχεσθε. &lt;…&gt; οἱ γὰρ τοιοῦτοι ψευδαπόστολοι, ἐργάται δόλιοι, μετασχηματιζόμενοι εἰς ἀποστόλους Χριστοῦ. καὶ οὐ θαῦμα, αὐτὸς γὰρ ὁ Σατανᾶς μετασχηματίζεται εἰς ἄγγελον φωτός· οὐ μέγα οὖν εἰ καὶ οἱ διάκονοι αὐτοῦ μετασχηματίζονται ὡς διάκονοι δικαιοσύνης, ὧν τὸ τέλος ἔσται κατὰ τὰ ἔργα αὐτῶν.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/2kor/11/#L3-4,13-15"><em>Β Κορ 11:3-4,13-15</em></a><em>)</em></p></blockquote><h2>Να απομακρύνεται κανείς από εκείνους που εισάγουν νέα διδασκαλία, αντί για εκείνη που άφησε ο Χριστός</h2><blockquote><p><em>«</em><strong><em>εἴ τις ἑτεροδιδασκαλεῖ</em></strong><em> </em><strong><em>καὶ μὴ προσέρχεται ὑγιαίνουσιν λόγοις, τοῖς τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ</em></strong><em>, καὶ τῇ κατ᾿ εὐσέβειαν διδασκαλίᾳ, </em><strong><em>τετύφωται</em></strong><em>, </em><strong><em>μηδὲν ἐπιστάμενος</em></strong><em>, ἀλλὰ νοσῶν περὶ ζητήσεις καὶ λογομαχίας, ἐξ ὧν γίνεται φθόνος, ἔρις, βλασφημίαι, ὑπόνοιαι πονηραί, διαπαρατριβαὶ διεφθαρμένων ἀνθρώπων τὸν νοῦν καὶ ἀπεστερημένων τῆς ἀληθείας, </em><strong><em>νομιζόντων <mark>πορισμὸν</mark> εἶναι τὴν εὐσέβειαν</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/1tim/6/#L3-5"><em>Α Τιμ 6:3-5</em></a><em>)</em> — Στο Βυζαντινό κείμενο η φράση “ἀφίστασο ἀπὸ τῶν τοιούτων” δεν παραδίδεται.</p></blockquote><blockquote><p><em>«Ὦ Τιμόθεε, </em><strong><em>τὴν παραθήκην φύλαξον</em></strong><em>, </em><strong><em><mark>ἐκτρεπόμενος</mark></em></strong><em> τὰς βεβήλους κενοφωνίας καὶ ἀντιθέσεις τῆς </em><strong><em>ψευδωνύμου γνώσεως</em></strong><em>, ἥν τινες ἐπαγγελλόμενοι περὶ τὴν πίστιν ἠστόχησαν. Ἡ χάρις μεθ᾿ ὑμῶν.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/1tim/6/#L20-21"><em>Α Τιμ 6:20-21</em></a><em>)</em></p></blockquote><blockquote><p><em>«Παραγγέλλομεν δὲ ὑμῖν, ἀδελφοί, ἐν ὀνόματι τοῦ κυρίου Ἰησοῦ Χριστοῦ, </em><strong><em><mark>στέλλεσθαι</mark> ὑμᾶς ἀπὸ παντὸς ἀδελφοῦ</em></strong><em> ἀτάκτως περιπατοῦντος καὶ </em><strong><em>μὴ κατὰ τὴν παράδοσιν ἣν παρελάβοσαν παρ᾿ ἡμῶν</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/2sol/3/#L6"><em>Β Θεσ 3:6</em></a><em>)</em></p></blockquote><blockquote><p><em>«Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, σκοπεῖν τοὺς τὰς διχοστασίας καὶ τὰ σκάνδαλα παρὰ τὴν διδαχὴν ἣν ὑμεῖς ἐμάθετε ποιοῦντας, καὶ </em><strong><em><mark>ἐκκλίνετε</mark></em></strong><em> ἀπ᾿ αὐτῶν· </em><strong><em>οἱ γὰρ τοιοῦτοι τῷ κυρίῳ ἡμῶν Χριστῷ οὐ δουλεύουσιν</em></strong><em> ἀλλὰ τῇ ἑαυτῶν κοιλίᾳ, καὶ διὰ τῆς χρηστολογίας καὶ εὐλογίας ἐξαπατῶσιν τὰς καρδίας τῶν ἀκάκων.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/rim/16/#L17-18"><em>Ρωμ 16:17-18</em></a><em>)</em></p></blockquote><blockquote><p><em>«</em><strong><em>εἴ τις ἔρχεται πρὸς ὑμᾶς</em></strong><em> καὶ </em><strong><em><mark>ταύτην τὴν διδαχὴν οὐ φέρει, μὴ λαμβάνετε αὐτὸν εἰς οἰκίαν</mark></em></strong><em> καὶ χαίρειν αὐτῷ μὴ λέγετε· ὁ λέγων γὰρ αὐτῷ χαίρειν κοινωνεῖ τοῖς ἔργοις αὐτοῦ τοῖς πονηροῖς.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/2in/1/#L10-11"><em>Β Ιω 1:10-11</em></a><em>)</em></p></blockquote><blockquote><p><em>«</em><strong><em>ἀλλὰ καὶ ἐὰν ἡμεῖς</em></strong><em> </em><strong><em>ἢ ἄγγελος ἐξ οὐρανοῦ</em></strong><em> [ὑμῖν] </em><strong><em>εὐαγγελίζηται παρ᾿ ὃ εὐηγγελισάμεθα ὑμῖν</em></strong><em>, </em><strong><em><mark>ἀνάθεμα</mark> ἔστω</em></strong><em>. ὡς προειρήκαμεν, καὶ ἄρτι πάλιν λέγω, </em><strong><em>εἴ τις ὑμᾶς εὐαγγελίζεται παρ᾿ ὃ παρελάβετε, <mark>ἀνάθεμα</mark> ἔστω</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/gal/1/#L8-9"><em>Γαλ 1:8-9</em></a><em>)</em></p></blockquote><p>Ο όρος <strong>«ανάθεμα»</strong> — αφορισμός από την Εκκλησία.</p><h2>Να ελέγχει κανείς τις διαστρεβλώσεις της Παράδοσης (αίρεση)</h2><blockquote><p><em>«οὓς δὲ </em><strong><em>σῴζετε ἐκ πυρὸς ἁρπάζοντες</em></strong><em>, οὓς δὲ ἐλεᾶτε ἐν φόβῳ, μισοῦντες καὶ τὸν ἀπὸ τῆς σαρκὸς ἐσπιλωμένον χιτῶνα.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/iud/1/#L23"><em>Ιούδα 1:23</em></a><em>)</em></p></blockquote><blockquote><p><em>«καὶ μὴ συγκοινωνεῖτε τοῖς ἔργοις τοῖς ἀκάρποις τοῦ σκότους, μᾶλλον δὲ καὶ </em><strong><em>ἐλέγχετε</em></strong><em>» (</em><a href="https://bibleox.com/el/gr-lxx-byz/ef/5/#L11"><em>Εφ 5:11</em></a><em>)</em></p></blockquote><blockquote><p><em>«ἀντεχόμενον τοῦ κατὰ τὴν διδαχὴν πιστοῦ λόγου, ἵνα δυνατὸς ᾖ καὶ παρακαλεῖν ἐν τῇ διδασκαλίᾳ τῇ ὑγιαινούσῃ καὶ τοὺς ἀντιλέγοντας </em><strong><em><mark>ἐλέγχειν</mark></em></strong><em>. </em>Εἰσὶν γὰρ πολλοὶ [καὶ] ἀνυπότακτοι, ματαιολόγοι καὶ φρεναπάται<em>, μάλιστα οἱ ἐκ τῆς περιτομῆς, οὓς δεῖ </em><strong><em>ἐπιστομίζειν</em></strong><em>, οἵτινες ὅλους οἴκους ἀνατρέπουσιν διδάσκοντες ἃ μὴ δεῖ αἰσχροῦ κέρδους χάριν.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/tit/1/#L9-11"><em>Τιτ 1:9-11</em></a><em>)</em></p></blockquote><blockquote><p><em>«ἕως θανάτου </em><strong><em>ἀγώνισαι περὶ τῆς ἀληθείας</em></strong><em>, καὶ κύριος ὁ θεὸς πολεμήσει ὑπὲρ σοῦ.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/prsir/4/#L28">Σ.Σειρ 4:28</a>) — Στην έκδοση των Εβδομήκοντα ο στίχος αριθμείται 4:28.</p></blockquote><blockquote><p><em>«Ἀγαπητοί, πᾶσαν σπουδὴν ποιούμενος γράφειν ὑμῖν περὶ τῆς κοινῆς ἡμῶν σωτηρίας ἀνάγκην ἔσχον γράψαι ὑμῖν παρακαλῶν </em><strong><em>ἐπαγωνίζεσθαι τῇ ἅπαξ παραδοθείσῃ τοῖς ἁγίοις πίστει</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/iud/1/#L3"><em>Ιούδα 1:3</em></a><em>)</em></p></blockquote><h2>Σε τι θα καθοδηγήσει το Πνεύμα της αληθείας</h2><p>Πριν από την αποστολή του Αγίου Πνεύματος και την κάθοδό Του στους αποστόλους, ο Χριστός υπόσχεται ότι, όταν το Άγιο Πνεύμα σταλεί στους αποστόλους, θα τους βοηθήσει να θυμηθούν και να κατανοήσουν όλα όσα είπε ο Χριστός:</p><blockquote><p>«ὁ δὲ παράκλητος, τὸ πνεῦμα τὸ ἅγιον ὃ πέμψει ὁ πατὴρ ἐν τῷ ὀνόματί μου, ἐκεῖνος ὑμᾶς διδάξει πάντα καὶ <strong><mark>ὑπομνήσει ὑμᾶς πάντα ἃ εἶπον ὑμῖν</mark></strong> [ἐγώ].» (<a href="https://bibleox.com/el/gr-lxx-byz/in/14/#L26">Ιω 14:26</a>)</p></blockquote><blockquote><p>«<strong>Ἔτι πολλὰ ἔχω ὑμῖν λέγειν, ἀλλ᾿ οὐ δύνασθε βαστάζειν ἄρτι</strong>· ὅταν δὲ ἔλθῃ ἐκεῖνος, <strong><mark>τὸ πνεῦμα τῆς ἀληθείας, ὁδηγήσει ὑμᾶς ἐν τῇ ἀληθείᾳ πάσῃ</mark></strong>· οὐ γὰρ λαλήσει ἀφ᾿ ἑαυτοῦ, ἀλλ᾿ ὅσα ἀκούσει λαλήσει, καὶ τὰ ἐρχόμενα ἀναγγελεῖ ὑμῖν. ἐκεῖνος ἐμὲ δοξάσει, ὅτι <strong><mark>ἐκ τοῦ ἐμοῦ λήμψεται καὶ ἀναγγελεῖ ὑμῖν</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/16/#L12-14">Ιω 16:12-14</a>)</p></blockquote>
