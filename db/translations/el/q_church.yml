  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: '<h2>Ο Χριστός — η ρίζα της Εκκλησίας</h2><blockquote><p>«Ὡς οὖν παρελάβετε τὸν <strong><mark>Χριστὸν Ἰησοῦν</mark></strong> τὸν κύριον, ἐν αὐτῷ περιπατεῖτε, <strong><mark>ἐρριζωμένοι</mark></strong> καὶ ἐποικοδομούμενοι <strong><mark>ἐν αὐτῷ</mark></strong> καὶ βεβαιούμενοι [ἐν] τῇ πίστει καθὼς ἐδιδάχθητε, περισσεύοντες ἐν εὐχαριστίᾳ.» (<a href="https://bibleox.com/el/gr-lxx-byz/kol/2/#L6-7">Κολ 2:6-7</a>)</p></blockquote><blockquote><p>«<strong><mark>Ἐγὼ Ἰησοῦς</mark></strong> ἔπεμψα τὸν ἄγγελόν μου μαρτυρῆσαι ὑμῖν ταῦτα ἐπὶ ταῖς ἐκκλησίαις. <strong><mark>ἐγώ εἰμι ἡ ῥίζα</mark></strong> καὶ τὸ γένος Δαυίδ, ὁ ἀστὴρ ὁ λαμπρὸς ὁ πρωϊνός.» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/22/#L16">Απ 22:16</a>)</p></blockquote><h3>Ο Χριστός είναι επίσης η άμπελος που τρέφει τα κλήματα</h3><blockquote><p>«<strong><mark>Ἐγώ εἰμι ἡ ἄμπελος ἡ ἀληθινή</mark></strong>, καὶ ὁ πατήρ μου ὁ γεωργός ἐστιν. πᾶν κλῆμα ἐν ἐμοὶ μὴ φέρον καρπόν, αἴρει αὐτό, καὶ πᾶν τὸ καρπὸν φέρον καθαίρει αὐτὸ ἵνα καρπὸν πλείονα φέρῃ. ἤδη ὑμεῖς καθαροί ἐστε διὰ τὸν λόγον ὃν λελάληκα ὑμῖν· <strong>μείνατε ἐν ἐμοί</strong>, κἀγὼ ἐν ὑμῖν. καθὼς τὸ κλῆμα οὐ δύναται καρπὸν φέρειν ἀφ᾿ ἑαυτοῦ ἐὰν μὴ μένῃ ἐν τῇ ἀμπέλῳ, οὕτως οὐδὲ ὑμεῖς ἐὰν μὴ ἐν ἐμοὶ μένητε. <strong><mark>ἐγώ εἰμι ἡ ἄμπελος, ὑμεῖς τὰ κλήματα</mark></strong>. ὁ μένων ἐν ἐμοὶ κἀγὼ ἐν αὐτῷ οὗτος φέρει καρπὸν πολύν, ὅτι χωρὶς ἐμοῦ οὐ δύνασθε ποιεῖν οὐδέν. <strong>ἐὰν μή τις μένῃ ἐν ἐμοί, ἐβλήθη ἔξω ὡς τὸ κλῆμα καὶ ἐξηράνθη</strong>, καὶ συνάγουσιν αὐτὰ καὶ εἰς τὸ πῦρ βάλλουσιν καὶ καίεται.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/15/#L1-6">Ιω 15:1-6</a>)</p></blockquote><h3>Ο Χριστός είναι επίσης η κεφαλή της Εκκλησίας</h3><blockquote><p><em>«καὶ </em><strong><em>αὐτός ἐστιν ἡ <mark>κεφαλὴ</mark> τοῦ σώματος, τῆς ἐκκλησίας</em></strong><em>· ὅς ἐστιν ἀρχή, πρωτότοκος ἐκ τῶν νεκρῶν, ἵνα γένηται ἐν πᾶσιν αὐτὸς πρωτεύων» (</em><a href="https://bibleox.com/el/gr-lxx-byz/kol/1/#L18"><em>Κολ 1:18</em></a><em>)</em></p></blockquote><blockquote><p><em>«καὶ πάντα ὑπέταξεν ὑπὸ τοὺς πόδας αὐτοῦ, καὶ αὐτὸν ἔδωκεν </em><strong><em><mark>κεφαλὴν</mark> ὑπὲρ πάντα τῇ ἐκκλησίᾳ</em></strong><em>, ἥτις ἐστὶν τὸ </em><strong><em>σῶμα αὐτοῦ</em></strong><em>, τὸ πλήρωμα τοῦ τὰ πάντα ἐν πᾶσιν πληρουμένου.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/ef/1/#L22-23"><em>Εφ 1:22-23</em></a><em>)</em></p></blockquote><blockquote><p><em>«καὶ οὐ κρατῶν τὴν </em><strong><em><mark>κεφαλήν</mark>, ἐξ οὗ πᾶν τὸ σῶμα</em></strong><em> διὰ τῶν ἁφῶν καὶ συνδέσμων ἐπιχορηγούμενον καὶ συμβιβαζόμενον αὔξει τὴν αὔξησιν τοῦ θεοῦ.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/kol/2/#L19"><em>Κολ 2:19</em></a><em>)</em></p></blockquote><h2>Μέρος του Ισραήλ (τα κλήματα) αποκόπηκε από τον Χριστό (τη ρίζα)</h2><p>Μέρος του Ισραήλ αποκόπηκε, και τα ειδωλολατρικά έθνη εμβολιάστηκαν στη ρίζα (στον Χριστό). Οι αποκομμένοι Ιουδαίοι δεν ονομάζονται αποκομμένο μέρος της ρίζας, αλλά αποκομμένα κλήματα:</p><blockquote><p>«εἰ δὲ ἡ ἀπαρχὴ ἁγία, καὶ τὸ φύραμα· καὶ εἰ ἡ ῥίζα ἁγία, καὶ οἱ κλάδοι. Εἰ δέ <strong><mark>τινες τῶν κλάδων ἐξεκλάσθησαν</mark></strong>, σὺ δὲ <strong>ἀγριέλαιος ὢν ἐνεκεντρίσθης ἐν αὐτοῖς καὶ</strong> <strong><mark>συγκοινωνὸς τῆς ῥίζης</mark></strong> τῆς πιότητος τῆς ἐλαίας ἐγένου, μὴ κατακαυχῶ τῶν κλάδων· εἰ δὲ κατακαυχᾶσαι, οὐ σὺ τὴν ῥίζαν βαστάζεις ἀλλὰ ἡ ῥίζα σέ.» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/11/#L16-18">Ρωμ 11:16-18</a>)</p></blockquote><blockquote><p>«Ἠσαΐας δὲ ἀποτολμᾷ καὶ λέγει, <strong>Εὑρέθην [ἐν] τοῖς ἐμὲ μὴ ζητοῦσιν</strong>, ἐμφανὴς ἐγενόμην τοῖς ἐμὲ μὴ ἐπερωτῶσιν. <strong><u><mark>πρὸς δὲ τὸν Ἰσραὴλ</mark></u></strong> λέγει,<mark> </mark><strong><mark>Ὅλην τὴν ἡμέραν ἐξεπέτασα τὰς χεῖράς μου πρὸς λαὸν ἀπειθοῦντα καὶ ἀντιλέγοντα</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/10/#L20-21">Ρωμ 10:20-21</a>)</p></blockquote><blockquote><p>«Λέγω οὖν, <strong>μὴ ἀπώσατο ὁ θεὸς τὸν λαὸν αὐτοῦ; μὴ γένοιτο· καὶ γὰρ ἐγὼ Ἰσραηλίτης εἰμί</strong>, ἐκ σπέρματος Ἀβραάμ, φυλῆς Βενιαμείν. &lt;…&gt; ἀλλὰ τί λέγει αὐτῷ ὁ χρηματισμός; <strong>Κατέλιπον ἐμαυτῷ ἑπτακισχιλίους ἄνδρας, οἵτινες οὐκ ἔκαμψαν γόνυ τῇ Βάαλ. οὕτως οὖν καὶ ἐν τῷ νῦν καιρῷ</strong> <strong><mark>λεῖμμα</mark> κατ᾿ ἐκλογὴν χάριτος γέγονεν</strong>· &lt;…&gt; τί οὖν; ὃ ἐπιζητεῖ Ἰσραήλ, τοῦτο οὐκ ἐπέτυχεν, <strong><mark>ἡ δὲ ἐκλογὴ ἐπέτυχεν· οἱ δὲ λοιποὶ ἐπωρώθησαν</mark></strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/11/#L1,4-5,7">Ρωμ 11:1,4-5,7</a>)</p></blockquote><h2>Στη θέση των αποκοπέντων κλημάτων (μέρους του Ισραήλ) εμβολιάζεται στη ρίζα νέο κλήμα (όλα τα υπόλοιπα έθνη)</h2><blockquote><p>«καὶ ἔφαγεν Ιακωβ καὶ ἐνεπλήσθη, καὶ ἀπελάκτισεν ὁ ἠγαπημένος, ἐλιπάνθη, ἐπαχύνθη, ἐπλατύνθη· καὶ <strong>ἐγκατέλιπεν θεὸν</strong> τὸν ποιήσαντα αὐτὸν καὶ ἀπέστη ἀπὸ θεοῦ σωτῆρος αὐτοῦ. παρώξυνάν με ἐπ᾿ ἀλλοτρίοις, ἐν βδελύγμασιν αὐτῶν ἐξεπίκρανάν με· ἔθυσαν δαιμονίοις καὶ οὐ θεῷ, θεοῖς, οἷς οὐκ ᾔδεισαν· καινοὶ πρόσφατοι ἥκασιν, οὓς οὐκ ᾔδεισαν οἱ πατέρες αὐτῶν. <strong>θεὸν τὸν γεννήσαντά σε ἐγκατέλιπες</strong> καὶ ἐπελάθου θεοῦ τοῦ τρέφοντός σε. καὶ εἶδεν κύριος καὶ ἐζήλωσεν καὶ παρωξύνθη δι᾿ ὀργὴν υἱῶν αὐτοῦ καὶ θυγατέρων καὶ εἶπεν <strong><mark>Ἀποστρέψω τὸ πρόσωπόν μου ἀπ᾿ αὐτῶν καὶ δείξω τί ἔσται αὐτοῖς ἐπ᾿ ἐσχάτων</mark></strong>· ὅτι γενεὰ ἐξεστραμμένη ἐστίν, υἱοί, οἷς οὐκ ἔστιν πίστις ἐν αὐτοῖς. αὐτοὶ παρεζήλωσάν με ἐπ᾿ οὐ θεῷ, παρώργισάν με ἐν τοῖς εἰδώλοις αὐτῶν· <strong><mark>κἀγὼ παραζηλώσω αὐτοὺς ἐπ᾿ οὐκ ἔθνει</mark></strong>, ἐπ᾿ ἔθνει ἀσυνέτῳ παροργιῶ αὐτούς.» (<a href="https://bibleox.com/el/gr-lxx-byz/vtor/32/#L15-21">Δτ 32:15-21</a>)</p></blockquote><blockquote><p>«<strong>Ἰδοὺ ἡμέραι ἔρχονται</strong>, φησὶν κύριος, καὶ διαθήσομαι τῷ οἴκῳ Ισραηλ καὶ τῷ οἴκῳ Ιουδα <strong><mark>διαθήκην καινήν</mark>, <mark>οὐ κατὰ τὴν</mark> διαθήκην, ἣν διεθέμην τοῖς πατράσιν αὐτῶν ἐν ἡμέρᾳ ἐπιλαβομένου μου τῆς χειρὸς αὐτῶν ἐξαγαγεῖν αὐτοὺς ἐκ γῆς Αἰγύπτου, ὅτι <mark>αὐτοὶ οὐκ ἐνέμειναν</mark> ἐν τῇ διαθήκῃ μου, καὶ ἐγὼ ἠμέλησα αὐτῶν</strong>, φησὶν κύριος· ὅτι αὕτη ἡ διαθήκη, ἣν διαθήσομαι τῷ οἴκῳ Ισραηλ μετὰ τὰς ἡμέρας ἐκείνας, φησὶν κύριος <strong>Διδοὺς δώσω νόμους μου εἰς τὴν διάνοιαν αὐτῶν καὶ ἐπὶ καρδίας αὐτῶν γράψω αὐτούς· καὶ ἔσομαι αὐτοῖς εἰς θεόν, καὶ <mark>αὐτοὶ ἔσονταί μοι εἰς λαόν</mark></strong>· καὶ οὐ μὴ διδάξωσιν ἕκαστος τὸν πολίτην αὐτοῦ καὶ ἕκαστος τὸν ἀδελφὸν αὐτοῦ λέγων Γνῶθι τὸν κύριον· ὅτι πάντες εἰδήσουσίν με ἀπὸ μικροῦ αὐτῶν καὶ ἕως μεγάλου αὐτῶν, ὅτι ἵλεως ἔσομαι ταῖς ἀδικίαις αὐτῶν καὶ τῶν ἁμαρτιῶν αὐτῶν οὐ μὴ μνησθῶ ἔτι. — ἐὰν ὑψωθῇ ὁ οὐρανὸς εἰς τὸ μετέωρον, φησὶν κύριος, καὶ ἐὰν ταπεινωθῇ τὸ ἔδαφος τῆς γῆς κάτω, καὶ ἐγὼ οὐκ ἀποδοκιμῶ τὸ γένος Ισραηλ, φησὶν κύριος, περὶ πάντων, ὧν ἐποίησαν. οὕτως εἶπεν κύριος ὁ δοὺς τὸν ἥλιον εἰς φῶς τῆς ἡμέρας, σελήνην καὶ ἀστέρας εἰς φῶς τῆς νυκτός, καὶ κραυγὴν ἐν θαλάσσῃ καὶ ἐβόμβησεν τὰ κύματα αὐτῆς, κύριος παντοκράτωρ ὄνομα αὐτῷ Ἐὰν παύσωνται οἱ νόμοι οὗτοι ἀπὸ προσώπου μου, φησὶν κύριος, καὶ τὸ γένος Ισραηλ παύσεται γενέσθαι ἔθνος κατὰ πρόσωπόν μου πάσας τὰς ἡμέρας. —» (<a href="https://bibleox.com/el/gr-lxx-byz/ier/38/#L31-37">Ιερ 38:31-37</a>) — Στην έκδοση των Εβδομήκοντα η περικοπή βρίσκεται στο Ιερ 38 και η σειρά των στίχων 35–37 είναι διαφορετική.</p></blockquote><blockquote><p>«εἰ δὲ ἡ ἀπαρχὴ ἁγία, καὶ τὸ φύραμα· καὶ εἰ ἡ ῥίζα ἁγία, καὶ οἱ κλάδοι. Εἰ δέ τινες τῶν κλάδων ἐξεκλάσθησαν, <strong><mark>σὺ δὲ ἀγριέλαιος ὢν ἐνεκεντρίσθης ἐν αὐτοῖς</mark></strong> καὶ <strong><mark>συγκοινωνὸς τῆς ῥίζης</mark></strong> τῆς πιότητος τῆς ἐλαίας ἐγένου, μὴ κατακαυχῶ τῶν κλάδων· εἰ δὲ κατακαυχᾶσαι, οὐ σὺ τὴν ῥίζαν βαστάζεις ἀλλὰ ἡ ῥίζα σέ.» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/11/#L16-18">Ρωμ 11:16-18</a>)</p></blockquote><blockquote><p>«Ἐμφανὴς ἐγενόμην τοῖς ἐμὲ μὴ ζητοῦσιν, εὑρέθην τοῖς ἐμὲ μὴ ἐπερωτῶσιν· <strong><mark>εἶπα Ἰδού εἰμι, τῷ ἔθνει οἳ οὐκ ἐκάλεσάν μου τὸ ὄνομα</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/is/65/#L1">Ησ 65:1</a>)</p></blockquote><blockquote><p>«καὶ σπερῶ αὐτὴν ἐμαυτῷ ἐπὶ τῆς γῆς καὶ <strong>ἐλεήσω τὴν Οὐκ — ἠλεημένην</strong> καὶ <strong><mark>ἐρῶ τῷ Οὐ — λαῷ — μου Λαός μου εἶ σύ</mark></strong>, καὶ αὐτὸς ἐρεῖ Κύριος ὁ θεός μου εἶ σύ.» (<a href="https://bibleox.com/el/gr-lxx-byz/os/2/#L25">Ωσ 2:25</a>) — Στην έκδοση των Εβδομήκοντα ο στίχος αριθμείται 2:25 (στη σλαβονική και ρωσική μετάφραση 2:23).</p></blockquote><blockquote><p>«<strong><mark>οὓς καὶ ἐκάλεσεν ἡμᾶς οὐ μόνον ἐξ Ἰουδαίων ἀλλὰ καὶ ἐξ ἐθνῶν</mark></strong>; <strong>ὡς καὶ ἐν τῷ Ὡσηὲ λέγει, <mark>Καλέσω τὸν οὐ λαόν μου λαόν μου καὶ τὴν οὐκ ἠγαπημένην ἠγαπημένην</mark></strong>· καὶ ἔσται ἐν τῷ τόπῳ οὗ ἐρρέθη αὐτοῖς, Οὐ λαός μου ὑμεῖς, ἐκεῖ <strong><mark>κληθήσονται υἱοὶ θεοῦ ζῶντος</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/9/#L24-26">Ρωμ 9:24-26</a>)</p></blockquote><h2>Στην Εκκλησία δεν έχει πλέον σημασία η εθνικότητα</h2><p>Ο απόστολος στο <a href="https://bibleox.com/el/gr-lxx-byz/rim/11/#L16-18">Ρωμ 11:16-18</a> εξαλείφει τη μία από τις ακρότητες: την περιφρόνηση και την υπεροψία απέναντι στους Ιουδαίους. Η άλλη ακρότητα είναι ο υπερβολικός σεβασμός απέναντί τους. Η μέση οδός είναι η απουσία εθνικότητας στην Εκκλησία, όπου όλοι είναι αδελφοί μεταξύ τους, και όλοι όσοι ενωθούν με την Εκκλησία θα γίνουν επίσης αδελφοί, ανεξάρτητα από εθνικότητα και από το πού και ως τι όρισε ο Θεός να γεννηθούν:</p><blockquote><p>«ὅπου <strong><mark>οὐκ ἔνι Ἕλλην καὶ Ἰουδαῖος</mark></strong>, περιτομὴ καὶ ἀκροβυστία, <strong><mark>βάρβαρος</mark></strong>, <strong><mark>Σκύθης</mark></strong>, <strong>δοῦλος, ἐλεύθερος</strong>, ἀλλὰ [τὰ] πάντα καὶ ἐν πᾶσιν Χριστός.» (<a href="https://bibleox.com/el/gr-lxx-byz/kol/3/#L11">Κολ 3:11</a>)</p></blockquote><h2>Δεν υπάρχει <strong><u>καμία</u></strong> διαφορά μεταξύ Ιουδαίου και ειδωλολάτρη στην Εκκλησία</h2><blockquote><p>«πολλῆς δὲ ζητήσεως γενομένης ἀναστὰς Πέτρος εἶπεν πρὸς αὐτούς, Ἄνδρες ἀδελφοί, ὑμεῖς ἐπίστασθε ὅτι ἀφ᾿ ἡμερῶν ἀρχαίων ἐν ὑμῖν ἐξελέξατο ὁ θεὸς διὰ τοῦ στόματός μου ἀκοῦσαι τὰ ἔθνη τὸν λόγον τοῦ εὐαγγελίου καὶ πιστεῦσαι· καὶ ὁ καρδιογνώστης θεὸς ἐμαρτύρησεν αὐτοῖς δοὺς τὸ πνεῦμα τὸ ἅγιον καθὼς καὶ ἡμῖν, καὶ <strong><u><mark>οὐθὲν</mark></u> <mark>διέκρινεν μεταξὺ</mark> ἡμῶν τε καὶ αὐτῶν</strong>, τῇ πίστει καθαρίσας τὰς καρδίας αὐτῶν.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/15/#L7-9">Πραξ 15:7-9</a>)</p></blockquote><blockquote><p>«νυνὶ δὲ ἐν Χριστῷ Ἰησοῦ ὑμεῖς οἵ ποτε ὄντες μακρὰν ἐγενήθητε ἐγγὺς ἐν τῷ αἵματι τοῦ Χριστοῦ. Αὐτὸς γάρ ἐστιν ἡ εἰρήνη ἡμῶν, ὁ ποιήσας <strong><mark>τὰ ἀμφότερα ἓν</mark></strong> καὶ τὸ μεσότοιχον τοῦ φραγμοῦ λύσας, <strong>τὴν ἔχθραν, ἐν τῇ σαρκὶ αὐτοῦ</strong>, τὸν νόμον τῶν ἐντολῶν ἐν δόγμασιν καταργήσας, ἵνα <strong><mark>τοὺς δύο κτίσῃ ἐν αὑτῷ εἰς ἕνα καινὸν ἄνθρωπον</mark></strong> ποιῶν εἰρήνην, καὶ <strong><mark>ἀποκαταλλάξῃ τοὺς ἀμφοτέρους ἐν ἑνὶ σώματι</mark></strong> <strong>τῷ θεῷ</strong> διὰ τοῦ σταυροῦ, ἀποκτείνας τὴν ἔχθραν ἐν αὐτῷ. &lt;…&gt; ὅτι <strong><mark>δι᾿ αὐτοῦ ἔχομεν τὴν προσαγωγὴν οἱ ἀμφότεροι ἐν ἑνὶ πνεύματι πρὸς τὸν πατέρα</mark></strong>. &lt;…&gt; ἐποικοδομηθέντες ἐπὶ τῷ θεμελίῳ τῶν ἀποστόλων καὶ προφητῶν, <strong>ὄντος ἀκρογωνιαίου αὐτοῦ Χριστοῦ Ἰησοῦ</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/2/#L13-16,18,20">Εφ 2:13-16,18,20</a>)</p></blockquote><h2>Ο λαός του Ισραήλ εκλέχθηκε για την έλευση του Σωτήρα στον κόσμο. Αυτός ο σκοπός επιτεύχθηκε.</h2><p>Η Παλαιά Διαθήκη — η υπόσχεση της έλευσης του Σωτήρα</p><h2>Τα παιδιά του Αβραάμ είναι οι πιστοί</h2><blockquote><p>«καθὼς Ἀβραὰμ ἐπίστευσεν τῷ θεῷ, καὶ ἐλογίσθη αὐτῷ εἰς δικαιοσύνην. Γινώσκετε ἄρα ὅτι <strong><mark>οἱ ἐκ πίστεως, οὗτοι υἱοί εἰσιν Ἀβραάμ</mark></strong>. προϊδοῦσα δὲ ἡ γραφὴ ὅτι ἐκ πίστεως δικαιοῖ τὰ ἔθνη ὁ θεὸς προευηγγελίσατο τῷ Ἀβραὰμ ὅτι Ἐνευλογηθήσονται ἐν σοὶ <strong>πάντα τὰ ἔθνη</strong>. ὥστε <strong>οἱ ἐκ πίστεως εὐλογοῦνται σὺν τῷ πιστῷ Ἀβραάμ. ὅσοι γὰρ ἐξ ἔργων νόμου εἰσὶν ὑπὸ κατάραν εἰσίν</strong>· γέγραπται γὰρ ὅτι Ἐπικατάρατος πᾶς ὃς οὐκ ἐμμένει πᾶσιν τοῖς γεγραμμένοις ἐν τῷ βιβλίῳ τοῦ νόμου τοῦ ποιῆσαι αὐτά.» (<a href="https://bibleox.com/el/gr-lxx-byz/gal/3/#L6-10">Γαλ 3:6-10</a>)</p></blockquote><h2>Ιουδαίοι είναι εκείνοι που είναι τέτοιοι πνευματικά (εσωτερικά), και όχι εξωτερικά</h2><blockquote><p>«<strong>οὐ γὰρ ὁ ἐν τῷ φανερῷ Ἰουδαῖός ἐστιν</strong>, οὐδὲ ἡ ἐν τῷ φανερῷ ἐν σαρκὶ περιτομή· <strong>ἀλλ᾿ ὁ <mark>ἐν τῷ κρυπτῷ</mark> Ἰουδαῖος</strong>, καὶ περιτομὴ καρδίας ἐν πνεύματι οὐ γράμματι, οὗ ὁ ἔπαινος οὐκ ἐξ ἀνθρώπων ἀλλ᾿ ἐκ τοῦ θεοῦ.» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/2/#L28-29">Ρωμ 2:28-29</a>)</p></blockquote><blockquote><p>«<strong><mark>οὔτε γὰρ</mark></strong> <strong><mark>περιτομή τί ἐστιν</mark></strong> οὔτε <strong><mark>ἀκροβυστία</mark></strong>, ἀλλὰ καινὴ κτίσις.» (<a href="https://bibleox.com/el/gr-lxx-byz/gal/6/#L15">Γαλ 6:15</a>)</p></blockquote><h2>Προφητεία για την καινοδιαθηκική ιεροσύνη από <u>όλα</u> τα έθνη</h2><p>Στην παλαιοδιαθηκική Εκκλησία οι ιερείς διορίζονταν μόνο από τον εβραϊκό λαό, τη φυλή του Λευί, το γένος του Ααρών. Αλλά στην καινοδιαθηκική Εκκλησία οι ιερείς θα διορίζονται από όλα τα έθνη, και όχι μόνο από τον εβραϊκό λαό (το γένος του Ααρών):</p><blockquote><p><em>«κἀγὼ τὰ ἔργα αὐτῶν καὶ τὸν λογισμὸν αὐτῶν ἐπίσταμαι. </em><strong><em>ἔρχομαι συναγαγεῖν <u><mark>πάντα</mark></u> <mark>τὰ ἔθνη καὶ τὰς γλώσσας</mark></em></strong><em>, καὶ ἥξουσιν καὶ ὄψονται τὴν δόξαν μου. καὶ καταλείψω ἐπ᾿ αὐτῶν σημεῖα καὶ ἐξαποστελῶ ἐξ αὐτῶν σεσῳσμένους εἰς τὰ ἔθνη, εἰς Θαρσις καὶ Φουδ καὶ Λουδ καὶ Μοσοχ καὶ Θοβελ καὶ εἰς τὴν Ἑλλάδα καὶ εἰς τὰς νήσους τὰς πόρρω, </em><strong><em>οἳ οὐκ ἀκηκόασίν μου</em></strong><em> τὸ ὄνομα οὐδὲ ἑωράκασιν τὴν δόξαν μου, καὶ ἀναγγελοῦσίν μου τὴν δόξαν ἐν τοῖς ἔθνεσιν. καὶ ἄξουσιν τοὺς ἀδελφοὺς ὑμῶν ἐκ πάντων τῶν ἐθνῶν δῶρον κυρίῳ μεθ᾿ ἵππων καὶ ἁρμάτων ἐν λαμπήναις ἡμιόνων μετὰ σκιαδίων εἰς τὴν ἁγίαν πόλιν Ιερουσαλημ, εἶπεν κύριος, ὡς ἂν ἐνέγκαισαν οἱ υἱοὶ Ισραηλ ἐμοὶ τὰς θυσίας αὐτῶν μετὰ ψαλμῶν εἰς τὸν οἶκον κυρίου. </em><strong><em><mark>καὶ ἀπ᾿ αὐτῶν λήμψομαι ἐμοὶ ἱερεῖς καὶ Λευίτας</mark></em></strong><em>, εἶπεν κύριος.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/is/66/#L18-21"><em>Ησ 66:18-21</em></a><em>)</em></p></blockquote>'
