  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <h2>Ο αρχιερέας Καϊάφας</h2><p>Διαμέσου ενός ανθρώπου που ζητούσε να σκοτώσει τον Χριστό, εκφέρεται προφητεία όχι από μόνος του, αλλά μόνο και μόνο επειδή εκείνο το έτος ήταν αρχιερέας:</p><blockquote><p><em>«εἷς δέ τις ἐξ αὐτῶν </em><strong><em><mark>Καϊάφας</mark></em></strong><em>, ἀρχιερεὺς ὢν τοῦ ἐνιαυτοῦ ἐκείνου, εἶπεν αὐτοῖς, Ὑμεῖς οὐκ οἴδατε οὐδέν, οὐδὲ λογίζεσθε ὅτι </em><strong><em>συμφέρει ὑμῖν ἵνα εἷς ἄνθρωπος ἀποθάνῃ ὑπὲρ τοῦ λαοῦ καὶ μὴ ὅλον τὸ ἔθνος ἀπόληται. τοῦτο δὲ <mark>ἀφ᾿ ἑαυτοῦ οὐκ εἶπεν, ἀλλὰ ἀρχιερεὺς ὢν τοῦ ἐνιαυτοῦ ἐκείνου ἐπροφήτευσεν</mark> ὅτι ἔμελλεν Ἰησοῦς ἀποθνῄσκειν ὑπὲρ τοῦ ἔθνους</em></strong><em>» (</em><a href="https://bibleox.com/el/gr-lxx-byz/in/11/#L49-51"><em>Ιω 11:49-51</em></a><em>)</em></p></blockquote><h2>Ο Ιούδας ο Ισκαριώτης</h2><blockquote><p>«Καὶ <strong>προσκαλεσάμενος τοὺς δώδεκα μαθητὰς αὐτοῦ</strong> <strong><mark>ἔδωκεν αὐτοῖς ἐξουσίαν πνευμάτων ἀκαθάρτων ὥστε ἐκβάλλειν αὐτὰ καὶ θεραπεύειν πᾶσαν νόσον καὶ πᾶσαν μαλακίαν</mark></strong>. Τῶν δὲ δώδεκα ἀποστόλων τὰ ὀνόματά ἐστιν ταῦτα· πρῶτος Σίμων ὁ λεγόμενος Πέτρος καὶ Ἀνδρέας ὁ ἀδελφὸς αὐτοῦ, καὶ Ἰάκωβος ὁ τοῦ Ζεβεδαίου καὶ Ἰωάννης ὁ ἀδελφὸς αὐτοῦ, Φίλιππος καὶ Βαρθολομαῖος, Θωμᾶς καὶ Μαθθαῖος ὁ τελώνης, Ἰάκωβος ὁ τοῦ Ἁλφαίου καὶ Θαδδαῖος, Σίμων ὁ Καναναῖος καὶ <strong><mark>Ἰούδας</mark> ὁ Ἰσκαριώτης</strong> ὁ καὶ παραδοὺς αὐτόν. Τούτους τοὺς δώδεκα ἀπέστειλεν ὁ Ἰησοῦς παραγγείλας αὐτοῖς λέγων, Εἰς ὁδὸν ἐθνῶν μὴ ἀπέλθητε, καὶ εἰς πόλιν Σαμαριτῶν μὴ εἰσέλθητε· &lt;…&gt; <strong>ἀσθενοῦντας θεραπεύετε, νεκροὺς ἐγείρετε, λεπροὺς καθαρίζετε, δαιμόνια ἐκβάλλετε</strong>· δωρεὰν ἐλάβετε, δωρεὰν δότε.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/10/#L1-5,8">Μτ 10:1-5,8</a>)</p></blockquote><blockquote><p>«λέγει δὲ <strong><mark>Ἰούδας</mark> ὁ Ἰσκαριώτης</strong> εἷς τῶν μαθητῶν αὐτοῦ, ὁ μέλλων αὐτὸν παραδιδόναι, &lt;…&gt; εἶπεν δὲ τοῦτο οὐχ ὅτι περὶ τῶν πτωχῶν ἔμελεν αὐτῷ ἀλλ᾿ ὅτι <strong><mark>κλέπτης ἦν</mark></strong> καὶ τὸ γλωσσόκομον ἔχων τὰ βαλλόμενα ἐβάσταζεν.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/12/#L4,6">Ιω 12:4,6</a>)</p></blockquote><h2>Η πιστότητα του Θεού υπερβαίνει την ανθρώπινη απιστία</h2><blockquote><p>«τί γὰρ εἰ <strong>ἠπίστησάν τινες; μὴ ἡ ἀπιστία αὐτῶν τὴν πίστιν τοῦ θεοῦ καταργήσει; μὴ γένοιτο</strong>· γινέσθω δὲ ὁ θεὸς ἀληθής, πᾶς δὲ ἄνθρωπος ψεύστης, καθὼς γέγραπται, Ὅπως ἂν δικαιωθῇς ἐν τοῖς λόγοις σου καὶ νικήσεις ἐν τῷ κρίνεσθαί σε.» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/3/#L3-4">Ρωμ 3:3-4</a>)</p></blockquote><h2>Η ευθύνη του ιερέα</h2><blockquote><p>«ὁ δὲ μὴ γνούς, ποιήσας δὲ ἄξια πληγῶν, δαρήσεται ὀλίγας. παντὶ δὲ ᾧ ἐδόθη πολύ, πολὺ ζητηθήσεται παρ᾿ αὐτοῦ, καὶ <strong>ᾧ παρέθεντο πολύ, περισσότερον αἰτήσουσιν αὐτόν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/12/#L48">Λκ 12:48</a>)</p></blockquote>
