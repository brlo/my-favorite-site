  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <blockquote>«<b>Μὴ ἀγαπᾶτε τὸν κόσμον μηδὲ τὰ ἐν τῷ κόσμῳ</b>. ἐάν τις ἀγαπᾷ τὸν κόσμον, οὐκ ἔστιν ἡ ἀγάπη τοῦ πατρὸς ἐν αὐτῷ· ὅτι πᾶν τὸ ἐν τῷ κόσμῳ, <b>ἡ ἐπιθυμία τῆς σαρκὸς καὶ ἡ ἐπιθυμία τῶν ὀφθαλμῶν καὶ ἡ ἀλαζονεία τοῦ βίου</b>, οὐκ ἔστιν ἐκ τοῦ πατρὸς ἀλλὰ ἐκ τοῦ κόσμου ἐστίν.» (<a href="https://bibleox.com/el/gr-lxx-byz/1in/2/#L15-16">Α Ιω 2:15-16</a>)</blockquote><blockquote>«ὡς τέκνα ὑπακοῆς, <b>μὴ συσχηματιζόμενοι ταῖς πρότερον ἐν τῇ ἀγνοίᾳ ὑμῶν ἐπιθυμίαις</b>» (<a href="https://bibleox.com/el/gr-lxx-byz/1pet/1/#L14">Α Πε 1:14</a>)</blockquote>Η ανάγκη να τείνουμε προς την εικόνα του Θεού, και όχι προς την εικόνα της σύγχρονης εποχής:<blockquote>«καὶ <b>μὴ συσχηματίζεσθε τῷ αἰῶνι τούτῳ</b>, ἀλλὰ μεταμορφοῦσθε τῇ ἀνακαινώσει τοῦ νοός, εἰς τὸ <b>δοκιμάζειν ὑμᾶς τί τὸ θέλημα τοῦ θεοῦ</b>, τὸ ἀγαθὸν καὶ εὐάρεστον καὶ τέλειον.» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/12/#L2">Ρωμ 12:2</a>)</blockquote>
