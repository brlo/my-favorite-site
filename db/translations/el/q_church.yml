  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: '<p>Οι απόστολοι και οι επίσκοποι είναι μεταξύ τους ίσοι. Οι απόστολοι συχνά φιλονικούσαν ποιος από αυτούς είναι ανώτερος. Ο Χριστός τους υπέδειξε να μην αναζητούν εξουσία ο ένας πάνω στον άλλο:</p><blockquote><p>«<strong>Εἰσῆλθεν δὲ διαλογισμὸς ἐν αὐτοῖς, τὸ τίς ἂν εἴη μείζων αὐτῶν</strong>. &lt;…&gt; καὶ εἶπεν αὐτοῖς, Ὃς ἂν δέξηται τοῦτο τὸ παιδίον ἐπὶ τῷ ὀνόματί μου ἐμὲ δέχεται, καὶ ὃς ἂν ἐμὲ δέξηται δέχεται τὸν ἀποστείλαντά με· <strong>ὁ γὰρ μικρότερος ἐν πᾶσιν ὑμῖν ὑπάρχων οὗτός ἐστιν μέγας</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/9/#L46,48">Λκ 9:46,48</a>)</p></blockquote><blockquote><p>«<strong>Ἐγένετο δὲ καὶ φιλονεικία ἐν αὐτοῖς, τὸ τίς αὐτῶν δοκεῖ εἶναι μείζων</strong>. ὁ δὲ εἶπεν αὐτοῖς, Οἱ βασιλεῖς τῶν ἐθνῶν κυριεύουσιν αὐτῶν καὶ οἱ ἐξουσιάζοντες αὐτῶν εὐεργέται καλοῦνται. <strong>ὑμεῖς δὲ οὐχ οὕτως, ἀλλ᾿ ὁ μείζων ἐν ὑμῖν γινέσθω ὡς ὁ νεώτερος</strong>, <strong>καὶ ὁ ἡγούμενος ὡς ὁ διακονῶν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/22/#L24-26">Λκ 22:24-26</a>)</p></blockquote><blockquote><p>«οἱ δὲ ἐσιώπων, <strong>πρὸς ἀλλήλους γὰρ διελέχθησαν ἐν τῇ ὁδῷ τίς μείζων</strong>. καὶ καθίσας ἐφώνησεν τοὺς δώδεκα καὶ λέγει αὐτοῖς, <strong>Εἴ τις θέλει πρῶτος εἶναι ἔσται πάντων ἔσχατος καὶ πάντων διάκονος</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mk/9/#L34-35">Μκ 9:34-35</a>)</p></blockquote><p>Όταν ο απόστολος Ιάκωβος και ο Ιωάννης ζήτησαν από τον Χριστό να καθίσουν στο Βασίλειό Του δεξιά και αριστερά Του, οι άλλοι απόστολοι αγανάκτησαν. Ο Χριστός υπέδειξε σε όλους αυτούς να μην αναζητούν εξουσία ο ένας πάνω στον άλλο:</p><blockquote><p>«ὁ δὲ Ἰησοῦς προσκαλεσάμενος αὐτοὺς εἶπεν, Οἴδατε ὅτι οἱ ἄρχοντες τῶν ἐθνῶν κατακυριεύουσιν αὐτῶν καὶ οἱ μεγάλοι κατεξουσιάζουσιν αὐτῶν. <strong>οὐχ οὕτως ἔσται ἐν ὑμῖν</strong>· ἀλλ᾿ ὃς ἐὰν θέλῃ ἐν ὑμῖν μέγας γενέσθαι ἔσται ὑμῶν διάκονος, καὶ ὃς ἂν θέλῃ ἐν ὑμῖν εἶναι πρῶτος ἔσται ὑμῶν δοῦλος·» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/20/#L25-27">Μτ 20:25-27</a>)</p></blockquote><p>Το ίδιο και εδώ (<a href="https://bibleox.com/el/gr-lxx-byz/mk/10/#L41-44">Μκ 10:41-44</a>). Η Ρωμαϊκή Εκκλησία, που αποσχίστηκε από όλες τις υπόλοιπες Ορθόδοξες Εκκλησίες, επικαλείται την ιδιαίτερη εξουσία του αποστόλου Πέτρου:</p><blockquote><p>«δώσω σοι τὰς κλεῖδας τῆς βασιλείας τῶν οὐρανῶν, καὶ <strong>ὃ ἐὰν δήσῃς ἐπὶ τῆς γῆς ἔσται δεδεμένον ἐν τοῖς οὐρανοῖς</strong>, καὶ ὃ ἐὰν λύσῃς ἐπὶ τῆς γῆς ἔσται λελυμένον ἐν τοῖς οὐρανοῖς.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/16/#L19">Μτ 16:19</a>)</p></blockquote><p>Αλλά αυτή η εξουσία δόθηκε σε όλους τους αποστόλους:</p><blockquote><p>«Ἀμὴν λέγω ὑμῖν, <strong>ὅσα ἐὰν δήσητε ἐπὶ τῆς γῆς ἔσται δεδεμένα ἐν οὐρανῷ</strong> καὶ ὅσα ἐὰν λύσητε ἐπὶ τῆς γῆς ἔσται λελυμένα ἐν οὐρανῷ.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/18/#L18">Μτ 18:18</a>)</p></blockquote><blockquote><p>«καὶ τοῦτο εἰπὼν ἐνεφύσησεν καὶ λέγει αὐτοῖς, Λάβετε πνεῦμα ἅγιον· <strong>ἄν τινων ἀφῆτε τὰς ἁμαρτίας ἀφέωνται αὐτοῖς</strong>, ἄν τινων κρατῆτε κεκράτηνται.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/20/#L22-23">Ιω 20:22-23</a>)</p></blockquote><p>Είναι χαρακτηριστικό ότι ο Κύριος πλένει τα πόδια ακριβώς του αποστόλου Πέτρου (και στη συνέχεια των υπολοίπων), δίνοντας παράδειγμα και προειδοποιώντας κατά της φιλαρχίας:</p><blockquote><p>«εἰ οὖν ἐγὼ ἔνιψα ὑμῶν τοὺς πόδας ὁ κύριος καὶ ὁ διδάσκαλος, καὶ ὑμεῖς ὀφείλετε ἀλλήλων νίπτειν τοὺς πόδας· <strong>ὑπόδειγμα γὰρ δέδωκα ὑμῖν ἵνα καθὼς ἐγὼ ἐποίησα ὑμῖν καὶ ὑμεῖς ποιῆτε</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/13/#L14-15">Ιω 13:14-15</a>)</p></blockquote><p>Αργότερα, ο απόστολος Παύλος ελέγχει ενώπιον της συνάθροισης τον απόστολο Πέτρο (<a href="https://bibleox.com/el/gr-lxx-byz/gal/2/#L11">Γαλ 2:11</a>), και στην πρώτη αποστολική σύνοδο στα Ιεροσόλυμα προεδρεύει ο απόστολος Ιάκωβος (<a href="https://bibleox.com/el/gr-lxx-byz/act/15/#L13,19">Πραξ 15:13,19</a>), ενώ ο ίδιος ο απόστολος Πέτρος εγκαθιστούσε επισκόπους όχι μόνο στη Ρώμη αλλά, για παράδειγμα, και στην Αντιόχεια.</p><p>Οι μαθητές των αποστόλων γράφουν ότι οι επίσκοποι είναι διάδοχοι των αποστόλων. Ό,τι αφορά τους αποστόλους αφορά και τους επισκόπους. Ρήσεις των μαθητών των αποστόλων και των αρχαίων χριστιανών για αυτό: Οι επίσκοποι — διάδοχοι των αποστόλων</p>'
