  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <h2>Ο Θεός είναι πάντα με την Εκκλησία</h2><p>Το Άγιο Πνεύμα αποστέλλεται στην Εκκλησία για πάντα:</p><blockquote><p>«κἀγὼ ἐρωτήσω τὸν πατέρα καὶ ἄλλον παράκλητον δώσει ὑμῖν ἵνα <strong>μεθ᾿ ὑμῶν εἰς τὸν αἰῶνα</strong> ᾖ» (<a href="https://bibleox.com/el/gr-lxx-byz/in/14/#L16">Ιω 14:16</a>)</p></blockquote><p>Ο Κύριος Ιησούς Χριστός υποσχέθηκε να είναι με την Εκκλησία πάντα:</p><blockquote><p>«διδάσκοντες αὐτοὺς τηρεῖν πάντα ὅσα ἐνετειλάμην ὑμῖν· καὶ ἰδοὺ ἐγὼ <strong>μεθ᾿ ὑμῶν</strong> εἰμι <strong>πάσας τὰς ἡμέρας ἕως τῆς συντελείας τοῦ αἰῶνος</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/28/#L20">Μτ 28:20</a>)</p></blockquote><h2>Η Εκκλησία δεν θα νικηθεί</h2><p>Ο Κύριος προφητεύει ότι η Εκκλησία είναι ακατανίκητη:</p><blockquote><p>«κἀγὼ δέ σοι λέγω ὅτι σὺ εἶ Πέτρος, καὶ ἐπὶ ταύτῃ τῇ πέτρᾳ οἰκοδομήσω μου τὴν ἐκκλησίαν, καὶ <strong>πύλαι ᾅδου οὐ κατισχύσουσιν αὐτῆς</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/16/#L18">Μτ 16:18</a>)</p></blockquote><h2>Η αλήθεια θα είναι πάντα στην Εκκλησία</h2><p>Η αλήθεια θα είναι με την Εκκλησία για πάντα:</p><blockquote><p>«Ὁ πρεσβύτερος ἐκλεκτῇ κυρίᾳ καὶ τοῖς τέκνοις αὐτῆς, οὓς ἐγὼ ἀγαπῶ ἐν ἀληθείᾳ, καὶ οὐκ ἐγὼ μόνος ἀλλὰ καὶ πάντες οἱ ἐγνωκότες <strong>τὴν ἀλήθειαν</strong>, διὰ τὴν ἀλήθειαν τὴν μένουσαν ἐν ἡμῖν, καὶ <strong>μεθ᾿ ἡμῶν ἔσται εἰς τὸν αἰῶνα</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/2in/1/#L1-2">Β Ιω 1:1-2</a>)</p></blockquote><h2>Η Εκκλησία θα δοξάζει πάντα τον Θεό</h2><p>Στην Εκκλησία όλοι και σε όλες τις γενεές θα δοξάζουν τον Θεό:</p><blockquote><p>«αὐτῷ ἡ <strong>δόξα ἐν τῇ ἐκκλησίᾳ</strong> καὶ ἐν Χριστῷ Ἰησοῦ <strong>εἰς πάσας τὰς γενεὰς</strong> <strong>τοῦ αἰῶνος τῶν αἰώνων</strong>· ἀμήν.» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/3/#L21">Εφ 3:21</a>)</p></blockquote><h2>Στην Εκκλησία θα τελείται η Ευχαριστία μέχρι την έλευση του Χριστού</h2><blockquote><p>«ὁσάκις γὰρ ἐὰν ἐσθίητε τὸν <strong>ἄρτον</strong> τοῦτον καὶ τὸ <strong>ποτήριον</strong> πίνητε, τὸν θάνατον τοῦ κυρίου καταγγέλλετε, <strong>ἄχρις οὗ ἔλθῃ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/11/#L26">Α Κορ 11:26</a>)</p></blockquote>
