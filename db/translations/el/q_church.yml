  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <h2>Συγκριτικός πίνακας</h2><table><colgroup></colgroup><tbody><tr><td><p><strong>Τιμόθεος</strong> (πόλη Έφεσος, Α Τιμ 1:3)</p><p>(<a href="https://bibleox.com/el/gr-lxx-byz/1tim/3/#L1-13"><u>Α Τιμ 3:1-13</u></a>)</p></td><td><p><strong>Τιτ</strong> (νησί Κρήτη, Τιτ 1:5)</p><p>(<a href="https://bibleox.com/el/gr-lxx-byz/tit/1/#L5-9"><u>Τιτ 1:5-9</u></a>)</p></td></tr><tr><td><p>άμεμπτος</p></td><td><p>άμεμπτος |</p><p>άμεμπτος, ως οικονόμος του Θεού,</p></td></tr><tr><td><p>άνδρας μιας γυναικός</p></td><td><p>άνδρας μιας γυναικός</p></td></tr><tr><td><p>νήφων</p></td><td><p>εγκρατής</p></td></tr><tr><td><p>σώφρων</p></td><td><p>σώφρων</p></td></tr><tr><td><p>κόσμιος</p></td><td><p>ευσεβής</p></td></tr><tr><td><p>αξιοσέβαστος</p></td><td><p>δίκαιος</p></td></tr><tr><td><p>φιλόξενος</p></td><td><p>φιλόξενος</p></td></tr><tr><td><p>διδακτικός</p></td><td><p>αντεχόμενος του κατά την διδαχήν πιστού λόγου, ίνα δυνατός ή και παρακαλείν εν τη διδασκαλία τη υγιαινούση και τους αντιλέγοντας ελέγχειν</p></td></tr><tr><td><p>μη μέθυσος</p></td><td><p>μη μέθυσος</p></td></tr><tr><td><p>μη πλήκτης</p></td><td><p>μη πλήκτης</p></td></tr><tr><td><p>άμαχος</p></td><td><p>μη αυθάδης</p></td></tr><tr><td><p>μη αισχροκερδής, αλλά</p></td><td><p>μη αισχροκερδής</p></td></tr><tr><td><p>ήπιος</p></td><td><p>μη οργίλος</p></td></tr><tr><td><p>ειρηνικός</p></td><td></td></tr><tr><td><p>αφιλάργυρος</p></td><td></td></tr><tr><td><p>του ιδίου οίκου καλώς προϊστάμενος</p></td><td></td></tr><tr><td><p>τέκνα έχων εν υποταγή μετά πάσης σεμνότητος· ει δε τις του ιδίου οίκου προστήναι ουκ οίδεν, πώς εκκλησίας Θεού επιμελήσεται;</p></td><td><p>τέκνα έχων πιστά, μη εν κατηγορία ασωτίας ή ανυπότακτα.</p></td></tr><tr><td><p>μη νεόφυτος, ίνα μη τυφωθείς εις κρίμα εμπέσει του διαβόλου.</p></td><td></td></tr><tr><td><p>δει δε αυτόν και μαρτυρίαν καλήν έχειν από των έξωθεν, ίνα μη εις ονειδισμόν εμπέσει και παγίδα του διαβόλου.</p></td><td><p>φιλάγαθος</p></td></tr></tbody></table><h2>Ρήσεις</h2><blockquote><p>«Πιστὸς ὁ λόγος· εἴ τις ἐπισκοπῆς ὀρέγεται, καλοῦ ἔργου ἐπιθυμεῖ. </p><p>δεῖ οὖν τὸν <strong>ἐπίσκοπον</strong> </p><ul><li><p>ἀνεπίλημπτον εἶναι, </p></li><li><p>μιᾶς γυναικὸς ἄνδρα, </p></li><li><p>νηφάλιον, </p></li><li><p>σώφρονα, </p></li><li><p>κόσμιον, </p></li><li><p>φιλόξενον, </p></li><li><p>διδακτικόν, </p></li><li><p>μὴ πάροινον, </p></li><li><p>μὴ πλήκτην, </p></li><li><p>ἀλλὰ ἐπιεικῆ, </p></li><li><p>ἄμαχον, </p></li><li><p>ἀφιλάργυρον, </p></li><li><p>τοῦ ἰδίου οἴκου καλῶς προϊστάμενον, </p></li><li><p>τέκνα ἔχοντα ἐν ὑποταγῇ μετὰ πάσης σεμνότητος· </p></li><li><p>[εἰ δέ τις τοῦ ἰδίου οἴκου προστῆναι οὐκ οἶδεν, πῶς ἐκκλησίας θεοῦ ἐπιμελήσεται;] </p></li><li><p>μὴ νεόφυτον, </p></li><li><p>ἵνα μὴ τυφωθεὶς εἰς κρίμα ἐμπέσῃ τοῦ διαβόλου. </p></li><li><p>δεῖ δὲ καὶ μαρτυρίαν καλὴν ἔχειν ἀπὸ τῶν ἔξωθεν, </p></li><li><p>ἵνα μὴ εἰς ὀνειδισμὸν ἐμπέσῃ καὶ παγίδα τοῦ διαβόλου. </p></li></ul><p><strong>Διακόνους</strong> ὡσαύτως </p><ul><li><p>σεμνούς, </p></li><li><p>μὴ διλόγους, </p></li><li><p>μὴ οἴνῳ πολλῷ προσέχοντας, </p></li><li><p>μὴ αἰσχροκερδεῖς, </p></li><li><p>ἔχοντας τὸ μυστήριον τῆς πίστεως ἐν καθαρᾷ συνειδήσει. </p></li><li><p>καὶ οὗτοι δὲ δοκιμαζέσθωσαν πρῶτον, εἶτα διακονείτωσαν ἀνέγκλητοι ὄντες. </p></li></ul><p><strong>γυναῖκας</strong> ὡσαύτως </p><ul><li><p>σεμνάς, </p></li><li><p>μὴ διαβόλους, </p></li><li><p>νηφαλίους, </p></li><li><p>πιστὰς ἐν πᾶσιν. </p></li></ul><p><strong>διάκονοι</strong> ἔστωσαν </p><ul><li><p>μιᾶς γυναικὸς ἄνδρες, </p></li><li><p>τέκνων καλῶς προϊστάμενοι καὶ τῶν ἰδίων οἴκων· </p></li></ul><p>οἱ γὰρ καλῶς διακονήσαντες βαθμὸν ἑαυτοῖς καλὸν περιποιοῦνται καὶ πολλὴν παρρησίαν ἐν πίστει τῇ ἐν Χριστῷ Ἰησοῦ.» (</p><p><a href="https://bibleox.com/el/gr-lxx-byz/1tim/3/#L1-13">Α Τιμ 3:1-13</a>)</p></blockquote><blockquote><p>«Τούτου χάριν ἀπέλιπόν σε ἐν Κρήτῃ, ἵνα τὰ λείποντα ἐπιδιορθώσῃ καὶ καταστήσῃς κατὰ πόλιν <strong>πρεσβυτέρους</strong>, ὡς ἐγώ σοι διεταξάμην, </p><ul><li><p>εἴ τίς ἐστιν ἀνέγκλητος, </p></li><li><p>μιᾶς γυναικὸς ἀνήρ, </p></li><li><p>τέκνα ἔχων πιστά, μὴ ἐν κατηγορίᾳ ἀσωτίας ἢ ἀνυπότακτα. </p></li></ul><p>δεῖ γὰρ τὸν <strong>ἐπίσκοπον</strong> ἀνέγκλητον εἶναι ὡς θεοῦ οἰκονόμον, </p><ul><li><p>μὴ αὐθάδη, </p></li><li><p>μὴ ὀργίλον, </p></li><li><p>μὴ πάροινον, </p></li><li><p>μὴ πλήκτην, </p></li><li><p>μὴ αἰσχροκερδῆ, </p></li><li><p>ἀλλὰ φιλόξενον, </p></li><li><p>φιλάγαθον, </p></li><li><p>σώφρονα, </p></li><li><p>δίκαιον, </p></li><li><p>ὅσιον, </p></li><li><p>ἐγκρατῆ, </p></li><li><p>ἀντεχόμενον τοῦ κατὰ τὴν διδαχὴν πιστοῦ λόγου, </p></li><li><p>ἵνα δυνατὸς ᾖ καὶ παρακαλεῖν ἐν τῇ διδασκαλίᾳ τῇ ὑγιαινούσῃ καὶ τοὺς ἀντιλέγοντας ἐλέγχειν.» ( </p></li></ul><p><a href="https://bibleox.com/el/gr-lxx-byz/tit/1/#L5-9">Τιτ 1:5-9</a>)</p></blockquote>
