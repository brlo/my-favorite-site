  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: '<h2>Τι είναι η Παράδοση;</h2><p>Η Παράδοση είναι η αποκάλυψη του Θεού Πατέρα, την οποία Αυτός, μέσω του Μονογενούς Υιού Του, παρέδωσε στους αποστόλους, κι εκείνοι τη μετέδωσαν στην υπόλοιπη Εκκλησία, η οποία τη μεταδίδει από γενεά σε γενεά με λόγο (προφορικό και γραπτό) και με έργο:</p><blockquote><p>«ὅτι <strong>τὰ ῥήματα ἃ ἔδωκάς μοι δέδωκα αὐτοῖς, καὶ αὐτοὶ ἔλαβον</strong> καὶ ἔγνωσαν ἀληθῶς ὅτι παρὰ σοῦ ἐξῆλθον, καὶ ἐπίστευσαν ὅτι σύ με ἀπέστειλας.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/17/#L8">Ιω 17:8</a>)</p></blockquote><blockquote><p>«Ἐπαινῶ δὲ ὑμᾶς ὅτι <strong>πάντα μου μέμνησθε καὶ καθὼς παρέδωκα ὑμῖν τὰς παραδόσεις κατέχετε</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/11/#L2">Α Κορ 11:2</a>)</p></blockquote><h2>Η Παράδοση δεν είναι μόνο κείμενα, αλλά και λόγια που ακούγονται, με τα οποία μεταδίδεται η πίστη</h2><blockquote><p>«Καὶ διὰ τοῦτο καὶ ἡμεῖς εὐχαριστοῦμεν τῷ θεῷ ἀδιαλείπτως, ὅτι <strong>παραλαβόντες <mark>λόγον ἀκοῆς παρ᾿ ἡμῶν τοῦ θεοῦ</mark></strong> ἐδέξασθε οὐ λόγον ἀνθρώπων ἀλλὰ καθώς ἐστιν ἀληθῶς λόγον θεοῦ, ὃς καὶ ἐνεργεῖται ἐν ὑμῖν τοῖς πιστεύουσιν.» (<a href="https://bibleox.com/el/gr-lxx-byz/1sol/2/#L13">Α Θεσ 2:13</a>)</p></blockquote><blockquote><p>«<strong>ὑποτύπωσιν ἔχε ὑγιαινόντων λόγων ὧν παρ᾿ ἐμοῦ ἤκουσας</strong> ἐν πίστει καὶ ἀγάπῃ τῇ ἐν Χριστῷ Ἰησοῦ·» (<a href="https://bibleox.com/el/gr-lxx-byz/2tim/1/#L13">Β Τιμ 1:13</a>)</p></blockquote><blockquote><p>«καὶ <strong>ἃ ἤκουσας</strong> <strong>παρ᾿ ἐμοῦ</strong> διὰ πολλῶν μαρτύρων, <strong>ταῦτα παράθου πιστοῖς</strong> ἀνθρώποις, οἵτινες ἱκανοὶ ἔσονται καὶ ἑτέρους διδάξαι.» (<a href="https://bibleox.com/el/gr-lxx-byz/2tim/2/#L2">Β Τιμ 2:2</a>)</p></blockquote><blockquote><p>«ἄρα οὖν, ἀδελφοί, <strong>στήκετε, καὶ κρατεῖτε τὰς παραδόσεις</strong> ἃς ἐδιδάχθητε εἴτε διὰ <strong>λόγου</strong> εἴτε δι᾿ <strong>ἐπιστολῆς</strong> ἡμῶν.» (<a href="https://bibleox.com/el/gr-lxx-byz/2sol/2/#L15">Β Θεσ 2:15</a>)</p></blockquote><blockquote><p>«ὑμεῖς ὃ <strong>ἠκούσατε ἀπ᾿ ἀρχῆς</strong> ἐν ὑμῖν μενέτω· <strong>ἐὰν ἐν ὑμῖν μείνῃ ὃ ἀπ᾿ ἀρχῆς ἠκούσατε, καὶ ὑμεῖς ἐν τῷ υἱῷ καὶ ἐν τῷ πατρὶ μενεῖτε</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1in/2/#L24">Α Ιω 2:24</a>)</p></blockquote><blockquote><p>«Ἐπαινῶ δὲ ὑμᾶς ὅτι <strong>πάντα μου</strong> <strong>μέμνησθε</strong> καὶ καθὼς παρέδωκα ὑμῖν τὰς παραδόσεις κατέχετε.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/11/#L2">Α Κορ 11:2</a>)</p></blockquote><blockquote><p>«<strong>μνημόνευε οὖν πῶς εἴληφας καὶ ἤκουσας, καὶ τήρει</strong>, καὶ μετανόησον. ἐὰν οὖν μὴ γρηγορήσῃς, ἥξω ὡς κλέπτης, καὶ οὐ μὴ γνῷς ποίαν ὥραν ἥξω ἐπὶ σέ.» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/3/#L3">Απ 3:3</a>)</p></blockquote><h2>Οι απόστολοι χρησιμοποιούσαν την Παράδοση</h2><p>Ο απόστολος αναφέρει τα ονόματα δύο Αιγυπτίων μάγων, που δεν αναφέρονται στην Αγία Γραφή:</p><blockquote><p>«ὃν τρόπον δὲ <strong>Ἰάννης καὶ Ἰαμβρῆς</strong> ἀντέστησαν Μωϋσεῖ, οὕτως καὶ οὗτοι ἀνθίστανται τῇ ἀληθείᾳ, ἄνθρωποι κατεφθαρμένοι τὸν νοῦν, ἀδόκιμοι περὶ τὴν πίστιν·» (<a href="https://bibleox.com/el/gr-lxx-byz/2tim/3/#L8">Β Τιμ 3:8</a>)</p></blockquote><p>Ο απόστολος Ιούδας αναφέρει μια διαμάχη που δεν μνημονεύεται στην Αγία Γραφή:</p><blockquote><p>«<strong>ὁ δὲ Μιχαὴλ ὁ ἀρχάγγελος, ὅτε τῷ διαβόλῳ διακρινόμενος διελέγετο περὶ τοῦ Μωϋσέως σώματος</strong>, οὐκ ἐτόλμησεν κρίσιν ἐπενεγκεῖν βλασφημίας, ἀλλὰ εἶπεν, Ἐπιτιμήσαι σοι κύριος.» (<a href="https://bibleox.com/el/gr-lxx-byz/iud/1/#L9">Ιούδα 1:9</a>)</p></blockquote><p>Για τα λόγια του Ενώχ, που δεν αναφέρονται στην Αγία Γραφή:</p><blockquote><p>«<strong>Προεφήτευσεν δὲ καὶ τούτοις ἕβδομος ἀπὸ Ἀδὰμ Ἑνὼχ</strong> λέγων, <strong>Ἰδοὺ ἦλθεν κύριος ἐν ἁγίαις μυριάσιν αὐτοῦ</strong>,» (<a href="https://bibleox.com/el/gr-lxx-byz/iud/1/#L14">Ιούδα 1:14</a>)</p></blockquote><p>Ο απόστολος Παύλος μιλά για τον προφήτη Ησαΐα, που πριονίστηκε αφού κρύφτηκε στην κουφάλα ενός δέντρου:</p><blockquote><p>«ἐλιθάσθησαν, <strong>ἐπρίσθησαν</strong>, ἐν φόνῳ μαχαίρης ἀπέθανον, περιῆλθον ἐν μηλωταῖς, ἐν αἰγείοις δέρμασιν, ὑστερούμενοι, θλιβόμενοι, κακουχούμενοι,» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/11/#L37">Εβρ 11:37</a>)</p></blockquote><p>Ο ευαγγελιστής Λουκάς γράφει το Ευαγγέλιο με βάση λόγια που άκουσε από αυτόπτες μάρτυρες, δηλαδή καταγράφει την παράδοση:</p><blockquote><p>«Ἐπειδήπερ πολλοὶ ἐπεχείρησαν ἀνατάξασθαι διήγησιν περὶ τῶν πεπληροφορημένων ἐν ἡμῖν πραγμάτων, <strong>καθὼς παρέδοσαν ἡμῖν οἱ ἀπ᾿ ἀρχῆς αὐτόπται</strong> καὶ ὑπηρέται γενόμενοι τοῦ λόγου, ἔδοξε κἀμοὶ παρηκολουθηκότι ἄνωθεν πᾶσιν ἀκριβῶς καθεξῆς σοι γράψαι, κράτιστε Θεόφιλε,» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/1/#L1-3">Λκ 1:1-3</a>)</p></blockquote><h3>Μεταδίδουν πληροφορίες που δεν αναφέρονται στο Ευαγγέλιο</h3><p>Ο απόστολος Παύλος, στη συνομιλία του με τους ποιμένες της Εφέσου, επισημαίνει μια διδασκαλία του Χριστού του Σωτήρα που δεν υπάρχει στο Ευαγγέλιο:</p><blockquote><p>«πάντα ὑπέδειξα ὑμῖν ὅτι οὕτως κοπιῶντας δεῖ ἀντιλαμβάνεσθαι τῶν ἀσθενούντων, μνημονεύειν τε τῶν λόγων τοῦ κυρίου Ἰησοῦ ὅτι <strong>αὐτὸς εἶπεν, Μακάριόν ἐστιν μᾶλλον διδόναι ἢ λαμβάνειν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/20/#L35">Πραξ 20:35</a>)</p></blockquote><p>Αναφέρει την εμφάνιση του αναστημένου Χριστού σε μεγάλο πλήθος ανθρώπων, που επίσης δεν καταγράφεται στο Ευαγγέλιο:</p><blockquote><p>«ἔπειτα <strong>ὤφθη ἐπάνω πεντακοσίοις ἀδελφοῖς</strong> ἐφάπαξ, ἐξ ὧν οἱ πλείονες μένουσιν ἕως ἄρτι, τινὲς δὲ ἐκοιμήθησαν· ἔπειτα ὤφθη Ἰακώβῳ, εἶτα τοῖς ἀποστόλοις πᾶσιν·» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/15/#L6-7">Α Κορ 15:6-7</a>)</p></blockquote><h2>Η σημασία της Παράδοσης</h2><p>Η εσφαλμένη διδασκαλία δεν οδηγεί στον Θεό:</p><blockquote><p>«<strong>πᾶς ὁ προάγων καὶ μὴ μένων ἐν τῇ διδαχῇ τοῦ Χριστοῦ θεὸν οὐκ ἔχει</strong>· ὁ μένων ἐν τῇ διδαχῇ, οὗτος καὶ τὸν πατέρα καὶ τὸν υἱὸν ἔχει.» (<a href="https://bibleox.com/el/gr-lxx-byz/2in/1/#L9">Β Ιω 1:9</a>)</p></blockquote><p>Οι αιρέσεις (οι εσφαλμένες διδασκαλίες) δεν κληρονομούν τη Βασιλεία του Θεού:</p><blockquote><p>«εἰδωλολατρία, φαρμακεία, ἔχθραι, ἔρις, ζῆλος, θυμοί, ἐριθείαι, διχοστασίαι, <strong>αἱρέσεις</strong>, φθόνοι, μέθαι, κῶμοι, καὶ τὰ ὅμοια τούτοις, ἃ προλέγω ὑμῖν καθὼς προεῖπον ὅτι οἱ τὰ τοιαῦτα πράσσοντες <strong>βασιλείαν θεοῦ οὐ κληρονομήσουσιν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/gal/5/#L20-21">Γαλ 5:20-21</a>)</p></blockquote><h2>Η αναγκαιότητα της Παράδοσης</h2><p>Η Αγία Γραφή δεν είναι η πηγή όλων των πληροφοριών για τον Ιησού Χριστό:</p><blockquote><p><em>«Πολλὰ μὲν οὖν καὶ ἄλλα σημεῖα ἐποίησεν ὁ Ἰησοῦς ἐνώπιον τῶν μαθητῶν [αὐτοῦ], ἃ </em><strong><em>οὐκ ἔστιν γεγραμμένα ἐν τῷ βιβλίῳ τούτῳ</em></strong><em>· ταῦτα δὲ γέγραπται ἵνα πιστεύσητε ὅτι Ἰησοῦς ἐστιν ὁ Χριστὸς ὁ υἱὸς τοῦ θεοῦ, καὶ ἵνα πιστεύοντες ζωὴν ἔχητε ἐν τῷ ὀνόματι αὐτοῦ.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/in/20/#L30-31"><em>Ιω 20:30-31</em></a><em>)</em></p></blockquote><blockquote><p><em>«Ἔστιν δὲ καὶ </em><strong><em>ἄλλα πολλὰ ἃ ἐποίησεν ὁ Ἰησοῦς</em></strong><em>, ἅτινα ἐὰν γράφηται καθ᾿ ἕν, οὐδ᾿ αὐτὸν οἶμαι τὸν κόσμον χωρῆσαι τὰ γραφόμενα βιβλία.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/in/21/#L25"><em>Ιω 21:25</em></a><em>)</em></p></blockquote><p>Σε καμία επιστολή δεν υπάρχει διδασκαλία για το πώς να βαπτίζουμε σωστά, πώς να χειροτονούμε διακόνους, πρεσβυτέρους, επισκόπους:</p><blockquote><p>«Διὸ ἀφέντες τὸν τῆς ἀρχῆς τοῦ Χριστοῦ λόγον ἐπὶ τὴν τελειότητα φερώμεθα, <strong>μὴ πάλιν θεμέλιον καταβαλλόμενοι</strong> μετανοίας ἀπὸ νεκρῶν ἔργων, καὶ πίστεως ἐπὶ θεόν, <strong>βαπτισμῶν διδαχῆς, ἐπιθέσεώς τε χειρῶν</strong>, ἀναστάσεώς τε νεκρῶν, καὶ κρίματος αἰωνίου.» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/6/#L1-2">Εβρ 6:1-2</a>)</p></blockquote><p>Όπως ήδη αναφέρθηκε, οι απόστολοι ήθελαν να μεταδίδουν ορισμένες πληροφορίες προφορικά:</p><blockquote><p><em>«Πολλὰ ἔχων ὑμῖν γράφειν </em><strong><em>οὐκ ἐβουλήθην διὰ χάρτου καὶ μέλανος</em></strong><em>, ἀλλὰ ἐλπίζω γενέσθαι πρὸς ὑμᾶς καὶ στόμα πρὸς στόμα λαλῆσαι, ἵνα ἡ χαρὰ ἡμῶν πεπληρωμένη ᾖ.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/2in/1/#L12"><em>Β Ιω 1:12</em></a><em>)</em></p></blockquote><blockquote><p>«<strong>Πολλὰ εἶχον γράψαι σοι, ἀλλ᾿ οὐ θέλω διὰ μέλανος καὶ καλάμου σοι γράφειν</strong>· ἐλπίζω δὲ εὐθέως <strong>σε ἰδεῖν, καὶ στόμα πρὸς στόμα λαλήσομεν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/3in/1/#L13-14">Γ Ιω 1:13-14</a>)</p></blockquote><blockquote><p><em>«ἄρα οὖν, ἀδελφοί, στήκετε, καὶ κρατεῖτε τὰς παραδόσεις ἃς </em><strong><em>ἐδιδάχθητε</em></strong><em> εἴτε διὰ </em><strong><em>λόγου</em></strong><em> εἴτε δι᾿ ἐπιστολῆς ἡμῶν.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/2sol/2/#L15"><em>Β Θεσ 2:15</em></a><em>)</em></p></blockquote><p>Ο απόστολος Παύλος ζητά να φυλάσσουμε την Παράδοση (τη διδαχή των αποστόλων), που δεν παραλήφθηκε μόνο μέσω των επιστολών αλλά και προφορικά:</p><blockquote><p>«καὶ <strong>ἃ ἤκουσας</strong> <strong>παρ᾿ ἐμοῦ</strong> διὰ πολλῶν μαρτύρων, <strong>ταῦτα παράθου πιστοῖς</strong> ἀνθρώποις, οἵτινες ἱκανοὶ ἔσονται καὶ ἑτέρους διδάξαι.» (<a href="https://bibleox.com/el/gr-lxx-byz/2tim/2/#L2">Β Τιμ 2:2</a>)</p></blockquote><h3>Η διάρκεια του προφορικού κηρύγματος των αποστόλων</h3><p>Ο απόστολος Παύλος δίδασκε τους πρεσβυτέρους της Ασίας τρία χρόνια, νύχτα και μέρα:</p><blockquote><p>«διὸ γρηγορεῖτε, μνημονεύοντες ὅτι <strong><mark>τριετίαν</mark> νύκτα καὶ ἡμέραν οὐκ ἐπαυσάμην μετὰ δακρύων νουθετῶν</strong> ἕνα ἕκαστον.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/20/#L31">Πραξ 20:31</a>)</p></blockquote><p>Ενάμισι χρόνο δίδασκε την κοινότητα στην Κόρινθο:</p><blockquote><p>«Μετὰ ταῦτα χωρισθεὶς ἐκ τῶν Ἀθηνῶν ἦλθεν εἰς Κόρινθον. &lt;…&gt; Ἐκάθισεν δὲ <strong><mark>ἐνιαυτὸν καὶ μῆνας ἓξ</mark> διδάσκων</strong> ἐν αὐτοῖς τὸν λόγον τοῦ θεοῦ.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/18/#L1,11">Πραξ 18:1,11</a>)</p></blockquote><p>Κήρυττε στην Έφεσο: πρώτα τρεις μήνες στη συναγωγή και μετά δύο χρόνια με τους μαθητές στη σχολή:</p><blockquote><p>«Εἰσελθὼν δὲ εἰς τὴν συναγωγὴν ἐπαρρησιάζετο <strong>ἐπὶ μῆνας τρεῖς</strong> διαλεγόμενος καὶ πείθων περὶ τῆς βασιλείας τοῦ θεοῦ. ὡς δέ τινες ἐσκληρύνοντο καὶ ἠπείθουν κακολογοῦντες τὴν ὁδὸν ἐνώπιον τοῦ πλήθους, ἀποστὰς ἀπ᾿ αὐτῶν <strong>ἀφώρισεν τοὺς μαθητάς, καθ᾿ ἡμέραν διαλεγόμενος ἐν τῇ σχολῇ Τυράννου</strong>. τοῦτο δὲ <strong>ἐγένετο ἐπὶ <mark>ἔτη δύο</mark></strong>, ὥστε πάντας τοὺς κατοικοῦντας τὴν Ἀσίαν ἀκοῦσαι τὸν λόγον τοῦ κυρίου, Ἰουδαίους τε καὶ Ἕλληνας.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/19/#L8-10">Πραξ 19:8-10</a>)</p></blockquote><p>Συνολικά, ο απόστολος Παύλος μόνος του κήρυττε τουλάχιστον 30 χρόνια: από τη μεταστροφή του, το 33-34 μ.Χ., ως τον θάνατό του, το 64-67 μ.Χ.</p><h2>Η εντολή να φυλάσσουμε την Παράδοση και να διδάσκουμε σύμφωνα με αυτήν</h2><blockquote><p>«Καθὼς παρεκάλεσά σε προσμεῖναι ἐν Ἐφέσῳ πορευόμενος εἰς Μακεδονίαν, ἵνα παραγγείλῃς τισὶν <strong>μὴ ἑτεροδιδασκαλεῖν</strong> μηδὲ προσέχειν μύθοις καὶ γενεαλογίαις ἀπεράντοις, αἵτινες ἐκζητήσεις παρέχουσιν μᾶλλον ἢ οἰκονομίαν θεοῦ τὴν ἐν πίστει·» (<a href="https://bibleox.com/el/gr-lxx-byz/1tim/1/#L3-4">Α Τιμ 1:3-4</a>)</p></blockquote><blockquote><p>«καὶ <strong>ἃ ἤκουσας</strong> <strong>παρ᾿ ἐμοῦ</strong> διὰ πολλῶν μαρτύρων, <strong>ταῦτα παράθου πιστοῖς</strong> ἀνθρώποις, οἵτινες ἱκανοὶ ἔσονται καὶ ἑτέρους διδάξαι.» (<a href="https://bibleox.com/el/gr-lxx-byz/2tim/2/#L2">Β Τιμ 2:2</a>)</p></blockquote><blockquote><p>«ἄρα οὖν, ἀδελφοί, <strong>στήκετε, καὶ κρατεῖτε τὰς παραδόσεις</strong> ἃς ἐδιδάχθητε εἴτε διὰ <strong>λόγου</strong> εἴτε δι᾿ <strong>ἐπιστολῆς</strong> ἡμῶν.» (<a href="https://bibleox.com/el/gr-lxx-byz/2sol/2/#L15">Β Θεσ 2:15</a>)</p></blockquote><blockquote><p>«Ἐπαινῶ δὲ ὑμᾶς ὅτι πάντα μου μέμνησθε καὶ καθὼς παρέδωκα ὑμῖν <strong>τὰς παραδόσεις κατέχετε</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/11/#L2">Α Κορ 11:2</a>)</p></blockquote><blockquote><p>«Γνωρίζω δὲ ὑμῖν, ἀδελφοί, τὸ εὐαγγέλιον ὃ εὐηγγελισάμην ὑμῖν, ὃ καὶ παρελάβετε, ἐν ᾧ καὶ ἑστήκατε, δι᾿ οὗ καὶ σῴζεσθε, <strong>τίνι λόγῳ εὐηγγελισάμην ὑμῖν εἰ κατέχετε</strong>, ἐκτὸς εἰ μὴ εἰκῇ ἐπιστεύσατε.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/15/#L1-2">Α Κορ 15:1-2</a>)</p></blockquote><blockquote><p>«Ἀγαπητοί, πᾶσαν σπουδὴν ποιούμενος γράφειν ὑμῖν περὶ τῆς κοινῆς ἡμῶν σωτηρίας ἀνάγκην ἔσχον γράψαι ὑμῖν παρακαλῶν <strong>ἐπαγωνίζεσθαι τῇ ἅπαξ παραδοθείσῃ τοῖς ἁγίοις πίστει</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/iud/1/#L3">Ιούδα 1:3</a>)</p></blockquote><blockquote><p>«Λοιπὸν οὖν, ἀδελφοί, ἐρωτῶμεν ὑμᾶς καὶ <strong>παρακαλοῦμεν</strong> ἐν κυρίῳ Ἰησοῦ, ἵνα καθὼς <strong>παρελάβετε παρ᾿ ἡμῶν τὸ πῶς δεῖ ὑμᾶς περιπατεῖν καὶ ἀρέσκειν θεῷ, καθὼς καὶ περιπατεῖτε, ἵνα περισσεύητε μᾶλλον</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1sol/4/#L1">Α Θεσ 4:1</a>)</p></blockquote><blockquote><p>«ἀντεχόμενον <strong>τοῦ κατὰ τὴν διδαχὴν πιστοῦ λόγου</strong>, ἵνα δυνατὸς ᾖ καὶ παρακαλεῖν ἐν τῇ διδασκαλίᾳ τῇ ὑγιαινούσῃ καὶ τοὺς ἀντιλέγοντας ἐλέγχειν. Εἰσὶν γὰρ <strong>πολλοὶ [καὶ] ἀνυπότακτοι, ματαιολόγοι καὶ φρεναπάται</strong>, μάλιστα οἱ ἐκ τῆς περιτομῆς, οὓς δεῖ ἐπιστομίζειν, οἵτινες ὅλους οἴκους ἀνατρέπουσιν διδάσκοντες ἃ μὴ δεῖ αἰσχροῦ κέρδους χάριν.» (<a href="https://bibleox.com/el/gr-lxx-byz/tit/1/#L9-11">Τιτ 1:9-11</a>)</p></blockquote><blockquote><p>«φοβοῦμαι δὲ μή πως, ὡς ὁ ὄφις ἐξηπάτησεν Εὕαν ἐν τῇ πανουργίᾳ αὐτοῦ, φθαρῇ τὰ νοήματα ὑμῶν ἀπὸ τῆς ἁπλότητος [καὶ τῆς ἁγνότητος] τῆς εἰς τὸν Χριστόν. εἰ μὲν γὰρ ὁ ἐρχόμενος <strong>ἄλλον Ἰησοῦν κηρύσσει ὃν οὐκ ἐκηρύξαμεν</strong>, ἢ πνεῦμα ἕτερον λαμβάνετε ὃ οὐκ ἐλάβετε, ἢ <strong>εὐαγγέλιον ἕτερον ὃ οὐκ ἐδέξασθε</strong>, καλῶς ἀνέχεσθε. &lt;…&gt; οἱ γὰρ τοιοῦτοι ψευδαπόστολοι, ἐργάται δόλιοι, μετασχηματιζόμενοι εἰς ἀποστόλους Χριστοῦ. καὶ οὐ θαῦμα, αὐτὸς γὰρ ὁ Σατανᾶς μετασχηματίζεται εἰς ἄγγελον φωτός· οὐ μέγα οὖν εἰ καὶ οἱ διάκονοι αὐτοῦ μετασχηματίζονται ὡς διάκονοι δικαιοσύνης, ὧν τὸ τέλος ἔσται κατὰ τὰ ἔργα αὐτῶν.» (<a href="https://bibleox.com/el/gr-lxx-byz/2kor/11/#L3-4,13-15">Β Κορ 11:3-4,13-15</a>)</p></blockquote><h2>Να απομακρυνόμαστε από όσους εισάγουν νέα διδασκαλία</h2><blockquote><p>«<strong>αἱρετικὸν ἄνθρωπον</strong> μετὰ μίαν καὶ δευτέραν νουθεσίαν <strong>παραιτοῦ</strong>,» (<a href="https://bibleox.com/el/gr-lxx-byz/tit/3/#L10">Τιτ 3:10</a>)</p></blockquote><blockquote><p>«<strong>εἴ τις ἑτεροδιδασκαλεῖ</strong> καὶ μὴ προσέρχεται ὑγιαίνουσιν λόγοις, τοῖς τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, καὶ τῇ κατ᾿ εὐσέβειαν διδασκαλίᾳ, <strong>τετύφωται, μηδὲν ἐπιστάμενος, ἀλλὰ νοσῶν περὶ ζητήσεις καὶ λογομαχίας</strong>, ἐξ ὧν γίνεται φθόνος, ἔρις, βλασφημίαι, ὑπόνοιαι πονηραί, <strong>διαπαρατριβαὶ διεφθαρμένων ἀνθρώπων τὸν νοῦν καὶ ἀπεστερημένων τῆς ἀληθείας</strong>, νομιζόντων πορισμὸν εἶναι τὴν εὐσέβειαν.» (<a href="https://bibleox.com/el/gr-lxx-byz/1tim/6/#L3-5">Α Τιμ 6:3-5</a>)</p></blockquote><blockquote><p>«Ὦ Τιμόθεε, <strong>τὴν παραθήκην φύλαξον</strong>, <strong>ἐκτρεπόμενος τὰς βεβήλους κενοφωνίας καὶ ἀντιθέσεις τῆς ψευδωνύμου γνώσεως</strong>, ἥν τινες ἐπαγγελλόμενοι περὶ τὴν πίστιν ἠστόχησαν. Ἡ χάρις μεθ᾿ ὑμῶν.» (<a href="https://bibleox.com/el/gr-lxx-byz/1tim/6/#L20-21">Α Τιμ 6:20-21</a>)</p></blockquote><blockquote><p>«Παραγγέλλομεν δὲ ὑμῖν, ἀδελφοί, ἐν ὀνόματι τοῦ κυρίου Ἰησοῦ Χριστοῦ, <strong>στέλλεσθαι ὑμᾶς ἀπὸ παντὸς ἀδελφοῦ ἀτάκτως περιπατοῦντος</strong> καὶ <strong>μὴ κατὰ τὴν παράδοσιν</strong> ἣν παρελάβοσαν παρ᾿ ἡμῶν.» (<a href="https://bibleox.com/el/gr-lxx-byz/2sol/3/#L6">Β Θεσ 3:6</a>)</p></blockquote><blockquote><p>«Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, <strong>σκοπεῖν τοὺς τὰς διχοστασίας καὶ τὰ σκάνδαλα παρὰ τὴν διδαχὴν ἣν ὑμεῖς ἐμάθετε ποιοῦντας, καὶ ἐκκλίνετε ἀπ᾿ αὐτῶν</strong>· οἱ γὰρ τοιοῦτοι τῷ κυρίῳ ἡμῶν Χριστῷ οὐ δουλεύουσιν ἀλλὰ τῇ ἑαυτῶν κοιλίᾳ, καὶ διὰ τῆς χρηστολογίας καὶ εὐλογίας ἐξαπατῶσιν τὰς καρδίας τῶν ἀκάκων.» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/16/#L17-18">Ρωμ 16:17-18</a>)</p></blockquote><blockquote><p>«<strong>εἴ τις ἔρχεται πρὸς ὑμᾶς καὶ ταύτην τὴν διδαχὴν οὐ φέρει, μὴ λαμβάνετε αὐτὸν εἰς οἰκίαν</strong> καὶ χαίρειν αὐτῷ μὴ λέγετε· ὁ λέγων γὰρ αὐτῷ χαίρειν κοινωνεῖ τοῖς ἔργοις αὐτοῦ τοῖς πονηροῖς.» (<a href="https://bibleox.com/el/gr-lxx-byz/2in/1/#L10-11">Β Ιω 1:10-11</a>)</p></blockquote><blockquote><p>«ἀλλὰ καὶ ἐὰν ἡμεῖς ἢ ἄγγελος ἐξ οὐρανοῦ [ὑμῖν] εὐαγγελίζηται <strong>παρ᾿ ὃ εὐηγγελισάμεθα ὑμῖν, ἀνάθεμα ἔστω</strong>. ὡς προειρήκαμεν, καὶ ἄρτι πάλιν λέγω, <strong>εἴ τις ὑμᾶς εὐαγγελίζεται παρ᾿ ὃ παρελάβετε, ἀνάθεμα ἔστω</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/gal/1/#L8-9">Γαλ 1:8-9</a>)</p></blockquote><p><strong>Ανάθεμα</strong> — αφορισμός από την Εκκλησία.</p><h2>Να καταγγέλλουμε τις διαστρεβλώσεις της Παράδοσης (αίρεση)</h2><blockquote><p>«ἕως θανάτου <strong>ἀγώνισαι περὶ τῆς ἀληθείας</strong>, καὶ κύριος ὁ θεὸς πολεμήσει ὑπὲρ σοῦ.» (<a href="https://bibleox.com/el/gr-lxx-byz/prsir/4/#L28">Σ.Σειρ 4:28</a>)</p></blockquote><blockquote><p>«Ἀγαπητοί, πᾶσαν σπουδὴν ποιούμενος γράφειν ὑμῖν περὶ τῆς κοινῆς ἡμῶν σωτηρίας ἀνάγκην ἔσχον γράψαι ὑμῖν παρακαλῶν <strong>ἐπαγωνίζεσθαι τῇ ἅπαξ παραδοθείσῃ τοῖς ἁγίοις πίστει</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/iud/1/#L3">Ιούδα 1:3</a>)</p></blockquote><blockquote><p>«οὓς δὲ σῴζετε ἐκ πυρὸς ἁρπάζοντες, <strong>οὓς δὲ ἐλεᾶτε ἐν φόβῳ</strong>, μισοῦντες καὶ τὸν ἀπὸ τῆς σαρκὸς ἐσπιλωμένον χιτῶνα.» (<a href="https://bibleox.com/el/gr-lxx-byz/iud/1/#L23">Ιούδα 1:23</a>)</p></blockquote><blockquote><p>«καὶ μὴ συγκοινωνεῖτε τοῖς ἔργοις τοῖς ἀκάρποις τοῦ σκότους, <strong>μᾶλλον δὲ καὶ ἐλέγχετε</strong>,» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/5/#L11">Εφ 5:11</a>)</p></blockquote>'
