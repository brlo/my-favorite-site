  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: '<h2>Η θέσπιση του μυστηρίου της Θείας Ευχαριστίας</h2><p>Ο Κύριος και Θεός Ιησούς Χριστός θεσπίζει το μυστήριο της Θείας Ευχαριστίας στο υπερώο της Σιών, όπου συγκέντρωσε μόνο τους δώδεκα αποστόλους:</p><blockquote><p>«Ἐσθιόντων δὲ αὐτῶν λαβὼν ὁ Ἰησοῦς ἄρτον καὶ εὐλογήσας ἔκλασεν καὶ δοὺς τοῖς μαθηταῖς εἶπεν, <strong>Λάβετε φάγετε, τοῦτό ἐστιν τὸ σῶμά μου</strong>. καὶ λαβὼν ποτήριον καὶ εὐχαριστήσας ἔδωκεν αὐτοῖς λέγων, <strong>Πίετε ἐξ αὐτοῦ πάντες</strong>, <strong>τοῦτο γάρ ἐστιν τὸ αἷμά μου τῆς διαθήκης</strong> τὸ περὶ πολλῶν ἐκχυννόμενον εἰς ἄφεσιν ἁμαρτιῶν.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/26/#L26-28">Μτ 26:26-28</a>) / Επίσης: <a href="https://bibleox.com/el/gr-lxx-byz/mk/14/#L22-24">Μκ 14:22-24</a> · <a href="https://bibleox.com/el/gr-lxx-byz/lk/22/#L19-20">Λκ 22:19-20</a></p></blockquote><p>Ο απόστολος Παύλος, που έγινε απόστολος μετά την Ανάσταση του Σωτήρα, διδάχθηκε την τέλεση της Ευχαριστίας ξεχωριστά και προσωπικά από τον αναστημένο Ιησού Χριστό:</p><blockquote><p>«<strong>Ἐγὼ γὰρ παρέλαβον ἀπὸ τοῦ κυρίου</strong>, ὃ καὶ παρέδωκα ὑμῖν, ὅτι ὁ κύριος Ἰησοῦς ἐν τῇ νυκτὶ ᾗ παρεδίδετο ἔλαβεν ἄρτον καὶ εὐχαριστήσας ἔκλασεν καὶ εἶπεν, <strong>Τοῦτό μού ἐστιν τὸ σῶμα</strong> τὸ ὑπὲρ ὑμῶν· τοῦτο ποιεῖτε εἰς τὴν ἐμὴν ἀνάμνησιν. ὡσαύτως καὶ τὸ ποτήριον μετὰ τὸ δειπνῆσαι, λέγων, <strong>Τοῦτο τὸ ποτήριον ἡ καινὴ διαθήκη ἐστὶν ἐν τῷ ἐμῷ αἵματι</strong>· τοῦτο ποιεῖτε, ὁσάκις ἐὰν πίνητε, εἰς τὴν ἐμὴν ἀνάμνησιν.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/11/#L23-25">Α Κορ 11:23-25</a>)</p></blockquote><h2>Μέσω της Ευχαριστίας ενωνόμαστε σε ένα Σώμα</h2><blockquote><p>«ἡ γὰρ σάρξ μου ἀληθής ἐστιν βρῶσις, καὶ τὸ αἷμά μου ἀληθής ἐστιν πόσις. <strong>ὁ τρώγων μου τὴν σάρκα καὶ πίνων μου τὸ αἷμα ἐν ἐμοὶ μένει κἀγὼ ἐν αὐτῷ</strong>. καθὼς ἀπέστειλέν με ὁ ζῶν πατὴρ κἀγὼ ζῶ διὰ τὸν πατέρα, καὶ ὁ τρώγων με κἀκεῖνος ζήσει δι᾿ ἐμέ.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/6/#L55-57">Ιω 6:55-57</a>)</p></blockquote><p>Όσοι μετέχουν στο μυστήριο της Ευχαριστίας ενώνονται πραγματικά (στην πραγματικότητα) με τον Χριστό και μεταξύ τους στο Σώμα Του:</p><blockquote><p>«<strong>τὸ ποτήριον</strong> τῆς εὐλογίας ὃ εὐλογοῦμεν, οὐχὶ <strong>κοινωνία ἐστὶν τοῦ αἵματος τοῦ Χριστοῦ</strong>; <strong>τὸν ἄρτον</strong> ὃν κλῶμεν, οὐχὶ <strong>κοινωνία τοῦ σώματος τοῦ Χριστοῦ ἐστιν</strong>; ὅτι εἷς ἄρτος, <strong>ἓν σῶμα οἱ πολλοί ἐσμεν, οἱ γὰρ πάντες ἐκ τοῦ ἑνὸς ἄρτου μετέχομεν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/10/#L16-17">Α Κορ 10:16-17</a>)</p></blockquote><blockquote><p>«<strong>Ὑμεῖς δέ ἐστε σῶμα Χριστοῦ</strong> καὶ μέλη ἐκ μέρους.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/12/#L27">Α Κορ 12:27</a>)</p></blockquote><blockquote><p>«νυνὶ δὲ <strong>ἐν Χριστῷ Ἰησοῦ ὑμεῖς</strong> οἵ ποτε ὄντες μακρὰν <strong>ἐγενήθητε ἐγγὺς ἐν τῷ αἵματι τοῦ Χριστοῦ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/2/#L13">Εφ 2:13</a>)</p></blockquote><blockquote><p>«<strong>ὅτι μέλη ἐσμὲν τοῦ σώματος αὐτοῦ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/5/#L30">Εφ 5:30</a>)</p></blockquote><p>Περισσότερα: <a href="https://bibleox.com/el/el/w/%CE%97_%CE%95%CE%BA%CE%BA%CE%BB%CE%B7%CF%83%CE%AF%CE%B1">η ένωση με τον Χριστό, η ένταξη στο Σώμα Του (την Εκκλησία)</a>.</p><h2>Η αδυναμία σωτηρίας χωρίς τη συμμετοχή στην Ευχαριστία</h2><blockquote><p>«εἶπεν οὖν αὐτοῖς ὁ Ἰησοῦς, Ἀμὴν ἀμὴν λέγω ὑμῖν, <strong>ἐὰν μὴ φάγητε τὴν σάρκα τοῦ υἱοῦ τοῦ ἀνθρώπου καὶ πίητε αὐτοῦ τὸ αἷμα, οὐκ ἔχετε ζωὴν ἐν ἑαυτοῖς</strong>. ὁ τρώγων μου τὴν σάρκα καὶ πίνων μου τὸ αἷμα ἔχει ζωὴν αἰώνιον, κἀγὼ ἀναστήσω αὐτὸν τῇ ἐσχάτῃ ἡμέρᾳ· ἡ γὰρ σάρξ μου ἀληθής ἐστιν βρῶσις, καὶ τὸ αἷμά μου ἀληθής ἐστιν πόσις. ὁ τρώγων μου τὴν σάρκα καὶ πίνων μου τὸ αἷμα ἐν ἐμοὶ μένει κἀγὼ ἐν αὐτῷ. καθὼς ἀπέστειλέν με ὁ ζῶν πατὴρ κἀγὼ ζῶ διὰ τὸν πατέρα, καὶ ὁ τρώγων με κἀκεῖνος ζήσει δι᾿ ἐμέ. οὗτός ἐστιν ὁ ἄρτος ὁ ἐκ τοῦ οὐρανοῦ καταβάς, οὐ καθὼς ἔφαγον οἱ πατέρες καὶ ἀπέθανον· <strong>ὁ τρώγων τοῦτον τὸν ἄρτον ζήσει εἰς τὸν αἰῶνα</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/6/#L53-58">Ιω 6:53-58</a>)</p></blockquote><p>Μέσω της Ευχαριστίας ενωνόμαστε με τον Χριστό, και ο Χριστός είναι ο Σωτήρας του σώματος:</p><blockquote><p>«Χριστὸς κεφαλὴ τῆς ἐκκλησίας, <strong><mark>αὐτὸς σωτὴρ τοῦ σώματος</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/5/#L23">Εφ 5:23</a>)</p></blockquote><h2>Στο μυστήριο — η αληθινή Σάρκα και το Αίμα του Σωτήρα</h2><h3>Ο άρτος — η σάρκα που θα δώσει ο Χριστός για τη ζωή του κόσμου</h3><p>Στην Ευχαριστία οι πιστοί μεταλαμβάνουν την αληθινή (πραγματική) σάρκα και το αληθινό αίμα του Ιησού Χριστού, που τα έδωσε για τη ζωή του κόσμου, προσφέροντας τον εαυτό Του ως θυσία στον σταυρό:</p><blockquote><p>«ἐγώ εἰμι ὁ ἄρτος τῆς ζωῆς. οἱ πατέρες ὑμῶν ἔφαγον ἐν τῇ ἐρήμῳ τὸ μάννα καὶ ἀπέθανον· οὗτός ἐστιν ὁ ἄρτος ὁ ἐκ τοῦ οὐρανοῦ καταβαίνων ἵνα τις ἐξ αὐτοῦ φάγῃ καὶ μὴ ἀποθάνῃ. ἐγώ εἰμι ὁ ἄρτος ὁ ζῶν ὁ ἐκ τοῦ οὐρανοῦ καταβάς· ἐάν τις φάγῃ ἐκ τούτου τοῦ ἄρτου ζήσει εἰς τὸν αἰῶνα· καὶ <strong><mark>ὁ ἄρτος</mark> δὲ ὃν ἐγὼ δώσω <mark>ἡ σάρξ</mark> μού ἐστιν <mark>ὑπὲρ τῆς τοῦ κόσμου ζωῆς</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/6/#L48-51">Ιω 6:48-51</a>)</p></blockquote><p>Εδώ ο Κύριος δηλώνει άμεσα ότι αυτός ο ουράνιος άρτος είναι η Σάρκα Του, την οποία έχει <strong>τώρα</strong> και την οποία θα δώσει <strong>στο μέλλον</strong> για τη ζωή του κόσμου. Αυτό μόνο υπόσχεται. Τώρα δεν έχει δώσει ακόμη αυτή τη σάρκα. Τη διδασκαλία την δίνει ήδη, αλλά στο μέλλον θα παραδώσει σε εκτέλεση όχι τη διδασκαλία, ούτε ένα σύμβολο, ούτε μια ανάμνηση, αλλά τη δική Του πραγματική σάρκα. Ακριβώς η Σάρκα Του είναι εκείνος ο ουράνιος άρτος που προσφέρει να φάμε, δίνοντάς τον στους μαθητές στο μυστήριο της Ευχαριστίας κάτω από τα είδη του άρτου και του οίνου.</p><h3>Το Αίμα της Διαθήκης — μεγάλη αγιότητα</h3><p>Σε βαρύτατη τιμωρία θα υποπέσει εκείνος που δεν θεωρεί το Αίμα της Διαθήκης αγιότητα και μ’ αυτό προσβάλλει το Πνεύμα της χάριτος:</p><blockquote><p>«ἀθετήσας τις νόμον Μωϋσέως χωρὶς οἰκτιρμῶν ἐπὶ δυσὶν ἢ τρισὶν μάρτυσιν ἀποθνῄσκει· <strong>πόσῳ δοκεῖτε χείρονος ἀξιωθήσεται τιμωρίας ὁ τὸν υἱὸν τοῦ θεοῦ καταπατήσας, καὶ <mark>τὸ αἷμα τῆς διαθήκης κοινὸν ἡγησάμενος</mark> ἐν ᾧ ἡγιάσθη, καὶ τὸ πνεῦμα τῆς χάριτος ἐνυβρίσας</strong>;» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/10/#L28-29">Εβρ 10:28-29</a>)</p></blockquote><blockquote><p>«<strong>ὃς δ᾿ ἂν</strong> <strong>βλασφημήσῃ εἰς τὸ πνεῦμα τὸ ἅγιον</strong> οὐκ ἔχει ἄφεσιν εἰς τὸν αἰῶνα, ἀλλὰ <strong>ἔνοχός ἐστιν αἰωνίου ἁμαρτήματος</strong> —» (<a href="https://bibleox.com/el/gr-lxx-byz/mk/3/#L29">Μκ 3:29</a>)</p></blockquote><h3>Η Σάρκα του Υιού του Ανθρώπου</h3><p>Μιλώντας για την Ευχαριστία, ο Χριστός εστιάζει την προσοχή στην ανθρώπινη φύση Του:</p><blockquote><p>«εἶπεν οὖν αὐτοῖς ὁ Ἰησοῦς, Ἀμὴν ἀμὴν λέγω ὑμῖν, ἐὰν μὴ φάγητε <strong>τὴν σάρκα τοῦ υἱοῦ τοῦ <mark>ἀνθρώπου</mark></strong> καὶ πίητε αὐτοῦ τὸ αἷμα, οὐκ ἔχετε ζωὴν ἐν ἑαυτοῖς.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/6/#L53">Ιω 6:53</a>)</p></blockquote><h3>Ασθένειες και θάνατος για όσους μεταλαμβάνουν ανάξια</h3><p>Απαιτείται δοκιμασία πριν από τη μετάληψη. Όσοι μεταλαμβάνουν ανάξια είναι ένοχοι, ασθενούν και ακόμη πεθαίνουν:</p><blockquote><p>«Ὥστε ὃς ἂν ἐσθίῃ τὸν ἄρτον ἢ πίνῃ τὸ ποτήριον τοῦ κυρίου ἀναξίως, ἔνοχος ἔσται τοῦ σώματος καὶ τοῦ αἵματος τοῦ κυρίου. δοκιμαζέτω δὲ ἄνθρωπος ἑαυτόν, καὶ οὕτως ἐκ τοῦ ἄρτου ἐσθιέτω καὶ ἐκ τοῦ ποτηρίου πινέτω· <strong>ὁ γὰρ ἐσθίων καὶ πίνων κρίμα ἑαυτῷ ἐσθίει καὶ πίνει μὴ διακρίνων τὸ σῶμα</strong>. <strong>διὰ τοῦτο ἐν ὑμῖν πολλοὶ ἀσθενεῖς καὶ ἄρρωστοι καὶ κοιμῶνται ἱκανοί</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/11/#L27-30">Α Κορ 11:27-30</a>)</p></blockquote><h2>Η αναγκαιότητα της προετοιμασίας για το μυστήριο</h2><blockquote><p><em>«</em><strong><em>δοκιμαζέτω δὲ ἄνθρωπος ἑαυτόν</em></strong><em>, καὶ οὕτως ἐκ τοῦ ἄρτου ἐσθιέτω καὶ ἐκ τοῦ ποτηρίου πινέτω·» (</em><a href="https://bibleox.com/el/gr-lxx-byz/1kor/11/#L28"><em>Α Κορ 11:28</em></a><em>)</em></p></blockquote><h2>Στην Εκκλησία το μυστήριο της θείας κοινωνίας θα τελείται μέχρι την έλευση του Ιησού Χριστού</h2><blockquote><p>«ὁσάκις γὰρ ἐὰν ἐσθίητε τὸν ἄρτον τοῦτον καὶ τὸ ποτήριον πίνητε, τὸν θάνατον τοῦ κυρίου καταγγέλλετε, <strong>ἄχρις οὗ ἔλθῃ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/11/#L26">Α Κορ 11:26</a>)</p></blockquote><h2>Παλαιοδιαθηκικοί προεικονισμοί της Ευχαριστίας</h2><h3>Ο πασχαλινός αμνός</h3><p>Ο άμωμος αμνός (αρνί ενός έτους χωρίς ελάττωμα) αρσενικού γένους έπρεπε να <strong>πεθαίνει</strong> πραγματικά για τις αμαρτίες των ανθρώπων, και ύστερα να <strong>τρώγεται</strong> πραγματικά, ολόκληρος. Ο Χριστός — ο Αμνός — πραγματοποιεί κυριολεκτικά και τα δύο μέρη αυτής της εικόνας:</p><ul><li><p>Πεθαίνει πραγματικά (όχι συμβολικά) για τις αμαρτίες των ανθρώπων·</p></li><li><p>Τον τρώνε πραγματικά (όχι συμβολικά).</p></li></ul><blockquote><p>«λάλησον πρὸς πᾶσαν συναγωγὴν υἱῶν Ισραηλ λέγων Τῇ δεκάτῃ τοῦ μηνὸς τούτου <strong>λαβέτωσαν ἕκαστος πρόβατον</strong> κατ᾿ οἴκους πατριῶν, ἕκαστος πρόβατον κατ᾿ οἰκίαν. &lt;…&gt; <strong>πρόβατον τέλειον ἄρσεν</strong> ἐνιαύσιον ἔσται ὑμῖν· ἀπὸ τῶν ἀρνῶν καὶ τῶν ἐρίφων λήμψεσθε. καὶ ἔσται ὑμῖν διατετηρημένον ἕως τῆς τεσσαρεσκαιδεκάτης τοῦ μηνὸς τούτου, καὶ <strong>σφάξουσιν αὐτὸ πᾶν τὸ πλῆθος συναγωγῆς υἱῶν Ισραηλ πρὸς ἑσπέραν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/12/#L3,5-6">Έξ 12:3,5-6</a>) (<a href="https://bibleox.com/el/gr-lxx-byz/ish/12/#L21-22,25">Έξ 12:21-22,25</a>)</p></blockquote><blockquote><p>«<strong>αὐτὸς δὲ ἐτραυματίσθη διὰ τὰς ἀνομίας ἡμῶν</strong> καὶ μεμαλάκισται διὰ τὰς ἁμαρτίας ἡμῶν· παιδεία εἰρήνης ἡμῶν ἐπ᾿ αὐτόν, <strong>τῷ μώλωπι αὐτοῦ ἡμεῖς ἰάθημεν</strong>. πάντες ὡς πρόβατα ἐπλανήθημεν, ἄνθρωπος τῇ ὁδῷ αὐτοῦ ἐπλανήθη· καὶ <strong>κύριος παρέδωκεν αὐτὸν ταῖς ἁμαρτίαις ἡμῶν</strong>. καὶ <strong>αὐτὸς διὰ τὸ κεκακῶσθαι</strong> οὐκ ἀνοίγει τὸ στόμα· ὡς πρόβατον ἐπὶ σφαγὴν ἤχθη καὶ <strong>ὡς ἀμνὸς ἐναντίον τοῦ κείροντος αὐτὸν</strong> ἄφωνος οὕτως οὐκ ἀνοίγει τὸ στόμα αὐτοῦ.» (<a href="https://bibleox.com/el/gr-lxx-byz/is/53/#L5-7">Ησ 53:5-7</a>) (<a href="https://bibleox.com/el/gr-lxx-byz/act/8/#L32">Πραξ 8:32</a>)</p></blockquote><blockquote><p>«<strong>ἐγὼ δὲ ὡς ἀρνίον ἄκακον</strong> ἀγόμενον τοῦ θύεσθαι» (<a href="https://bibleox.com/el/gr-lxx-byz/ier/11/#L19">Ιερ 11:19</a>)</p></blockquote><blockquote><p>«Τῇ ἐπαύριον βλέπει τὸν Ἰησοῦν ἐρχόμενον πρὸς αὐτόν, καὶ λέγει, <strong>Ἴδε ὁ ἀμνὸς τοῦ θεοῦ ὁ αἴρων τὴν ἁμαρτίαν τοῦ κόσμου</strong>. &lt;…&gt; καὶ ἐμβλέψας τῷ Ἰησοῦ περιπατοῦντι λέγει, <strong>Ἴδε ὁ ἀμνὸς τοῦ θεοῦ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/1/#L29,36">Ιω 1:29,36</a>)</p></blockquote><blockquote><p>«οὐ φθαρτοῖς, ἀργυρίῳ ἢ χρυσίῳ <strong>ἐλυτρώθητε</strong> ἐκ τῆς ματαίας ὑμῶν ἀναστροφῆς πατροπαραδότου, ἀλλὰ <strong>τιμίῳ αἵματι</strong> <strong>ὡς ἀμνοῦ ἀμώμου καὶ ἀσπίλου Χριστοῦ</strong>,» (<a href="https://bibleox.com/el/gr-lxx-byz/1pet/1/#L18-19">Α Πε 1:18-19</a>)</p></blockquote><blockquote><p>«λέγοντες φωνῇ μεγάλῃ, Ἄξιός ἐστιν <strong>τὸ ἀρνίον τὸ ἐσφαγμένον</strong> λαβεῖν τὴν δύναμιν καὶ πλοῦτον καὶ σοφίαν καὶ ἰσχὺν καὶ τιμὴν καὶ δόξαν καὶ εὐλογίαν.» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/5/#L12">Απ 5:12</a>) (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/7/#L17">Απ 7:17</a>) (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/14/#L1">Απ 14:1</a>)</p></blockquote><h3>Το μάννα</h3><p>Το μάννα στην έρημο ενίσχυε τις δυνάμεις του εβραϊκού λαού στον δρόμο από την αιχμαλωσία της Αιγύπτου προς τη γη της επαγγελίας (την υποσχεμένη). Το μάννα στην έρημο το έτρωγαν πραγματικά. Πραγματικά προφύλασσε τους ανθρώπους από τον θάνατο, έδινε ζωή (άλλη τροφή στην έρημο δεν υπήρχε):</p><blockquote><p>«εἶπεν δὲ κύριος πρὸς Μωυσῆν Ἰδοὺ <strong>ἐγὼ ὕω ὑμῖν ἄρτους ἐκ τοῦ οὐρανοῦ</strong>, καὶ ἐξελεύσεται ὁ λαὸς καὶ συλλέξουσιν <strong>τὸ τῆς ἡμέρας εἰς ἡμέραν</strong>, ὅπως πειράσω αὐτοὺς εἰ πορεύσονται τῷ νόμῳ μου ἢ οὔ· &lt;…&gt; καὶ ἐπωνόμασαν οἱ υἱοὶ Ισραηλ <strong>τὸ ὄνομα αὐτοῦ μαν</strong>· ἦν δὲ ὡς σπέρμα κορίου λευκόν, τὸ δὲ γεῦμα αὐτοῦ ὡς ἐγκρὶς ἐν μέλιτι.» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/16/#L4,31">Έξ 16:4,31</a>)</p></blockquote><blockquote><p>«καὶ ὅταν <strong>κατέβη ἡ δρόσος</strong> ἐπὶ τὴν παρεμβολὴν νυκτός, <strong>κατέβαινεν τὸ μαννα ἐπ᾿ αὐτῆς</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/chis/11/#L9">Αρ 11:9</a>)</p></blockquote><p>Επειδή το μάννα είναι μόνο εικόνα, σκιά του μέλλοντος, και όχι το ίδιο το πράγμα, δεν έδινε αιώνια ζωή, αλλά μόνο παράτεινε την επίγεια ζωή, έσωζε από τον θάνατο της πείνας· στο τέλος όλοι εκείνοι οι Εβραίοι πέθαναν, όπως πεθαίνουν οι άνθρωποι. Ο Χριστός όμως λέει ότι όποιος τρώει Αυτόν θα ζει αιώνια:</p><blockquote><p>«<strong>οἱ πατέρες ἡμῶν τὸ μάννα ἔφαγον ἐν τῇ ἐρήμῳ</strong>, καθώς ἐστιν γεγραμμένον, <strong>Ἄρτον ἐκ τοῦ οὐρανοῦ ἔδωκεν αὐτοῖς φαγεῖν</strong>. εἶπεν οὖν αὐτοῖς ὁ Ἰησοῦς, Ἀμὴν ἀμὴν λέγω ὑμῖν, οὐ Μωϋσῆς δέδωκεν ὑμῖν τὸν ἄρτον ἐκ τοῦ οὐρανοῦ, ἀλλ᾿ ὁ πατήρ μου δίδωσιν ὑμῖν τὸν ἄρτον ἐκ τοῦ οὐρανοῦ τὸν ἀληθινόν· <strong>ὁ γὰρ ἄρτος τοῦ θεοῦ ἐστιν ὁ καταβαίνων ἐκ τοῦ οὐρανοῦ καὶ ζωὴν διδοὺς τῷ κόσμῳ</strong>. &lt;…&gt; εἶπεν αὐτοῖς ὁ Ἰησοῦς, <strong>Ἐγώ εἰμι ὁ ἄρτος τῆς ζωῆς</strong>· ὁ ἐρχόμενος πρός με οὐ μὴ πεινάσῃ, καὶ ὁ πιστεύων εἰς ἐμὲ οὐ μὴ διψήσει πώποτε. &lt;…&gt; <strong>ἐγώ εἰμι ὁ ἄρτος τῆς ζωῆς</strong>. <strong>οἱ πατέρες ὑμῶν ἔφαγον ἐν τῇ ἐρήμῳ τὸ μάννα καὶ ἀπέθανον· οὗτός ἐστιν ὁ ἄρτος ὁ ἐκ τοῦ οὐρανοῦ καταβαίνων ἵνα τις ἐξ αὐτοῦ φάγῃ καὶ μὴ ἀποθάνῃ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/6/#L31-33,35,48-50">Ιω 6:31-33,35,48-50</a>)</p></blockquote><blockquote><p>«<strong>ὁ τρώγων μου τὴν σάρκα καὶ πίνων μου τὸ αἷμα ἔχει ζωὴν αἰώνιον</strong>, κἀγὼ ἀναστήσω αὐτὸν τῇ ἐσχάτῃ ἡμέρᾳ· ἡ γὰρ σάρξ μου ἀληθής ἐστιν βρῶσις, καὶ τὸ αἷμά μου ἀληθής ἐστιν πόσις. &lt;…&gt; καθὼς ἀπέστειλέν με ὁ ζῶν πατὴρ κἀγὼ ζῶ διὰ τὸν πατέρα, καὶ <strong>ὁ τρώγων με</strong> κἀκεῖνος ζήσει δι᾿ ἐμέ. οὗτός ἐστιν ὁ ἄρτος ὁ ἐκ τοῦ οὐρανοῦ καταβάς, <strong>οὐ καθὼς ἔφαγον οἱ πατέρες καὶ ἀπέθανον· ὁ τρώγων τοῦτον τὸν ἄρτον ζήσει εἰς τὸν αἰῶνα</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/6/#L54-55,57-58">Ιω 6:54-55,57-58</a>)</p></blockquote><p>Επιπλέον, αν δει κανείς όλη την πορεία του εβραϊκού λαού από τη δουλεία της Αιγύπτου προς τη γη της επαγγελίας ως πορεία του χριστιανού από τη δουλεία της αμαρτίας προς τη Βασιλεία των Ουρανών, τότε και εδώ το μάννα δείχνει κυριολεκτικά την Ευχαριστία:</p><ul><li><p>η πραγματική αιγυπτιακή αιχμαλωσία — η πραγματική δουλεία στην αμαρτία.</p></li><li><p>η πραγματική έξοδος από τη δουλεία μέσα από τον βυθό της θάλασσας — το πραγματικό βάπτισμα (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/10/#L2">Α Κορ 10:2</a>).</p></li><li><p>η πραγματική σαραντάχρονη πορεία στην έρημο — η πραγματική επίγεια ζωή στην Εκκλησία.</p></li><li><p>το πραγματικό μάννα και το νερό — η πραγματική Σάρκα και το Αίμα του Σωτήρα, που δίνονται από τον Θεό.</p></li><li><p>η πραγματική γη που υποσχέθηκε στους Εβραίους — η πραγματική Βασιλεία, αλλά τώρα πια όχι επίγεια, παρά ουράνια.</p></li></ul><h3>Το γλυκό νερό στη Μερρά</h3><blockquote><p>«Ἐξῆρεν δὲ Μωϋσῆς τοὺς υἱοὺς Ισραηλ ἀπὸ θαλάσσης ἐρυθρᾶς καὶ ἤγαγεν αὐτοὺς εἰς τὴν ἔρημον Σουρ· καὶ ἐπορεύοντο τρεῖς ἡμέρας ἐν τῇ ἐρήμῳ καὶ οὐχ ηὕρισκον ὕδωρ ὥστε πιεῖν. ἦλθον δὲ εἰς Μερρα καὶ οὐκ ἠδύναντο πιεῖν ἐκ Μερρας, πικρὸν γὰρ ἦν· διὰ τοῦτο ἐπωνομάσθη τὸ ὄνομα τοῦ τόπου ἐκείνου Πικρία. καὶ διεγόγγυζεν ὁ λαὸς ἐπὶ Μωυσῆν λέγοντες Τί πιόμεθα; ἐβόησεν δὲ Μωϋσῆς πρὸς κύριον· καὶ ἔδειξεν αὐτῷ κύριος <strong>ξύλον, καὶ ἐνέβαλεν αὐτὸ εἰς τὸ ὕδωρ, καὶ ἐγλυκάνθη τὸ ὕδωρ</strong>. ἐκεῖ ἔθετο αὐτῷ δικαιώματα καὶ κρίσεις καὶ ἐκεῖ ἐπείρασεν αὐτὸν» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/15/#L22-25">Έξ 15:22-25</a>)</p></blockquote><h3>Το χρίσμα της εισόδου του σπιτιού με το αίμα του αμνού</h3><p>Το χρίσμα της εισόδου του σπιτιού με αίμα έσωζε από τον θάνατο:</p><blockquote><p>«καὶ λήμψονται ἀπὸ τοῦ <strong>αἵματος καὶ θήσουσιν ἐπὶ τῶν δύο σταθμῶν καὶ ἐπὶ τὴν φλιὰν ἐν τοῖς οἴκοις</strong>, ἐν οἷς ἐὰν φάγωσιν αὐτὰ ἐν αὐτοῖς. &lt;…&gt; λήμψεσθε δὲ δεσμὴν ὑσσώπου καὶ βάψαντες ἀπὸ τοῦ αἵματος τοῦ παρὰ τὴν θύραν <strong>καθίξετε τῆς φλιᾶς καὶ ἐπ᾿ ἀμφοτέρων τῶν σταθμῶν ἀπὸ τοῦ αἵματος</strong>, ὅ ἐστιν παρὰ τὴν θύραν· ὑμεῖς δὲ οὐκ ἐξελεύσεσθε ἕκαστος τὴν θύραν τοῦ οἴκου αὐτοῦ ἕως πρωί. καὶ παρελεύσεται κύριος πατάξαι τοὺς Αἰγυπτίους καὶ <strong>ὄψεται τὸ αἷμα ἐπὶ τῆς φλιᾶς καὶ ἐπ᾿ ἀμφοτέρων τῶν σταθμῶν, καὶ παρελεύσεται κύριος τὴν θύραν καὶ οὐκ ἀφήσει τὸν ὀλεθρεύοντα εἰσελθεῖν εἰς τὰς οἰκίας ὑμῶν πατάξαι</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/12/#L7,22-23">Έξ 12:7,22-23</a>)</p></blockquote><h3>Το κάρβουνο από το θυσιαστήριο που καθαρίζει τις αμαρτίες</h3><p>Οι αμαρτίες του προφήτη Ησαΐα καθαρίστηκαν με το άγγιγμα στα χείλη του αναμμένου κάρβουνου, που πάρθηκε από το θυσιαστήριο:</p><blockquote><p>«καὶ εἶπα Ὦ τάλας ἐγώ, ὅτι κατανένυγμαι, ὅτι <strong>ἄνθρωπος ὢν καὶ ἀκάθαρτα χείλη ἔχων</strong> ἐν μέσῳ λαοῦ ἀκάθαρτα χείλη ἔχοντος ἐγὼ οἰκῶ καὶ τὸν βασιλέα κύριον σαβαωθ εἶδον τοῖς ὀφθαλμοῖς μου. καὶ ἀπεστάλη πρός με ἓν τῶν σεραφιν, καὶ ἐν τῇ χειρὶ εἶχεν <strong>ἄνθρακα, ὃν τῇ λαβίδι ἔλαβεν ἀπὸ τοῦ θυσιαστηρίου, καὶ ἥψατο τοῦ στόματός μου καὶ εἶπεν Ἰδοὺ ἥψατο τοῦτο τῶν χειλέων σου καὶ ἀφελεῖ τὰς ἀνομίας σου καὶ τὰς ἁμαρτίας σου περικαθαριεῖ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/is/6/#L5-7">Ησ 6:5-7</a>)</p></blockquote><h3>Η βρώση των καρπών από το δέντρο</h3><p>Η ανθρωπότητα απομακρύνθηκε από τον Θεό, γεύοντας πραγματικά τον καρπό από το δέντρο (<a href="https://bibleox.com/el/gr-lxx-byz/gen/3/#L6">Γεν 3:6</a>), και έτσι η ανθρωπότητα επιστρέφει στον Θεό, γεύοντας τον καρπό από το δέντρο του σταυρού. Ο άνθρωπος απομακρύνθηκε από τον Θεό μέσω του δέντρου της παρακοής, και επιστρέφει μέσω του ξύλου του σταυρού της υπακοής (<a href="https://bibleox.com/el/gr-lxx-byz/fil/2/#L8">Φιλ 2:8</a>· <a href="https://bibleox.com/el/gr-lxx-byz/mf/16/#L24">Μτ 16:24</a>). Ο καρπός από το δέντρο στέρησε τη ζωή, ο καρπός από το δέντρο την επιστρέφει. Από όποια πόρτα βγήκε ο άνθρωπος, από την ίδια μπαίνει. Τότε ο Κύριος έλεγε: «<em>μη φάτε</em>» (<a href="https://bibleox.com/el/gr-lxx-byz/gen/2/#L17">Γεν 2:17</a>) — έφαγαν. Τώρα λέει «<em>φάτε</em>» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/26/#L26">Μτ 26:26</a>) — πολλοί κάνουν το ίδιο παλιό λάθος, αλλά τώρα αντίθετα — δεν τρώνε. Αν και τότε και τώρα, αυτή την εντολή δεν ήταν δύσκολο να την τηρήσει κανείς:</p><blockquote><p>«ἀπὸ δὲ καρποῦ τοῦ ξύλου, ὅ ἐστιν ἐν μέσῳ τοῦ παραδείσου, <strong>εἶπεν ὁ θεός Οὐ φάγεσθε</strong> ἀπ᾿ αὐτοῦ οὐδὲ μὴ ἅψησθε αὐτοῦ, ἵνα μὴ ἀποθάνητε.» (<a href="https://bibleox.com/el/gr-lxx-byz/gen/3/#L3">Γεν 3:3</a>) «ἀπὸ δὲ τοῦ ξύλου τοῦ γινώσκειν καλὸν καὶ πονηρόν, <strong>οὐ φάγεσθε</strong> ἀπ᾿ αὐτοῦ· ᾗ δ᾿ ἂν ἡμέρᾳ φάγητε ἀπ᾿ αὐτοῦ, <strong>θανάτῳ ἀποθανεῖσθε</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/gen/2/#L17">Γεν 2:17</a>)</p></blockquote><blockquote><p>«Ἐσθιόντων δὲ αὐτῶν λαβὼν ὁ Ἰησοῦς ἄρτον καὶ εὐλογήσας ἔκλασεν καὶ δοὺς τοῖς μαθηταῖς εἶπεν, <strong>Λάβετε φάγετε</strong>, τοῦτό ἐστιν τὸ σῶμά μου.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/26/#L26">Μτ 26:26</a>) «<strong>ὁ τρώγων τοῦτον τὸν ἄρτον ζήσει εἰς τὸν αἰῶνα</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/6/#L58">Ιω 6:58</a>)</p></blockquote><h3>Η ειρηνική θυσία της ευχαριστίας</h3><p>Στην Παλαιά Διαθήκη υπάρχουν δύο είδη ειρηνικών θυσιών:</p><ul><li><p>η θυσία της <strong>αινέσεως</strong> (תודה, τοντά)·</p></li><li><p>η θυσία της <strong>ευχαριστίας</strong> (ή της σωτηρίας) (σελαμίμ ή נדר, νέντερ).</p></li></ul><p>Η ειρηνική θυσία προϋπέθετε προσφορά άρτου και ζωικής θυσίας. Η ειρηνική θυσία της <strong>αινέσεως</strong> προσφερόταν με άζυμο άρτο, και αν επιπλέον προσφερόταν και ειρηνική θυσία <strong>ευχαριστίας</strong>, τότε προσφερόταν με ένζυμο άρτο:</p><blockquote><p><em>«ἐπ᾿ </em><strong><em>ἄρτοις ζυμίταις</em></strong><em> προσοίσει τὰ δῶρα αὐτοῦ ἐπὶ θυσίᾳ αἰνέσεως σωτηρίου.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/lev/7/#L13"><em>Λευ 7:13</em></a><em>)</em></p></blockquote><p>Στην Καινή Διαθήκη το μυστήριο στο οποίο προσφέρεται άρτος στον Θεό ονομάζεται <strong>«Ευχαριστία» (ελληνική λέξη που σημαίνει «ευχαριστία»)</strong>, γιατί ο ίδιος ο Χριστός, πριν δώσει στους μαθητές, <strong>ευχαρίστησε</strong> τον Θεό και ευλόγησε τον άρτο (<a href="https://bibleox.com/el/gr-lxx-byz/lk/22/#L19">Λκ 22:19</a>·<strong> </strong><a href="https://bibleox.com/el/gr-lxx-byz/1kor/11/#L23-24">Α Κορ 11:23-24</a>).</p><p>Δηλαδή στην Ευχαριστία της Ορθόδοξης Εκκλησίας κυριολεκτικά αυτό γίνεται σήμερα:</p><ul><li><p>λαμβάνεται ένζυμος άρτος·</p></li><li><p>αναπέμπεται ευχαριστία·</p></li><li><p>μόνο που δεν προσφέρεται μαζί του ζωικό σφάγιο, γιατί η θυσία, ο Αμνός, το Πάσχα είναι ο Χριστός ο σταυρωμένος και αναστημένος.</p></li></ul><p>Αξίζει να προσέξει κανείς ότι οι άζυμοι άρτοι ονομάζονται άρτοι θλίψεως («ἄζυμα, ἄρτον κακώσεως», <a href="https://bibleox.com/el/gr-lxx-byz/vtor/16/#L3">Δτ 16:3</a>), και η ειρηνική θυσία με ένζυμο άρτο ονομάζεται θυσία ευχαριστίας ή θυσία σωτηρίας (תֹּודַ֥ת — ευχαριστία, σωτηρίου — σωτηρία <a href="https://bibleox.com/el/gr-lxx-byz/lev/7/#L13">Λευ 7:13</a>).</p><p><em><mark>Σημείωση</mark>:</em> <em>το κρέας της θυσίας επιτρεπόταν να φαγωθεί είτε την ίδια μέρα, χωρίς να μείνει ως το πρωί (όπως το Πάσχα), είτε δύο μέρες, αλλά απαγορευόταν κατηγορηματικά να μείνει για την τρίτη μέρα. Αν δεν το έτρωγαν ως την τρίτη μέρα, το υπόλοιπο έπρεπε να καεί, αλλιώς η θυσία απορρίπτεται από τον Θεό, γίνεται μόλυνση και αμαρτία. Αυτό μας παραπέμπει στην Ανάσταση του Σωτήρα — την τρίτη μέρα ο τάφος ήταν κενός. Δηλαδή, στην περίπτωση αυτή, ο ένζυμος άρτος αναφέρεται στην Καινή Διαθήκη — στην Ανάσταση του Σωτήρα.</em></p><h2>Η αλλαγή της φύσης των πραγμάτων</h2><ul><li><p>Η ράβδος σε φίδι και αντίστροφα (<a href="https://bibleox.com/el/gr-lxx-byz/ish/4/#L3-4">Έξ 4:3-4</a>· <a href="https://bibleox.com/el/gr-lxx-byz/ish/7/#L9-10,15">Έξ 7:9-10,15</a>)·</p></li></ul><ul><li><p>Το νερό σε αίμα (<a href="https://bibleox.com/el/gr-lxx-byz/ish/7/#L17,19-21">Έξ 7:17,19-21</a>)·</p></li></ul><ul><li><p>Το νερό σε κρασί (<a href="https://bibleox.com/el/gr-lxx-byz/in/2/#L7-10">Ιω 2:7-10</a>).</p></li></ul><h2>Η ευλογία του άρτου και του οίνου</h2><p>Ο άυλος Θεός, που πρώτα δημιούργησε από το τίποτα το σύμπαν, που προκάλεσε τον κατακλυσμό της οικουμένης, που σταμάτησε τον ήλιο, που σε κάθε τόπο θαυματουργικά δίνει διάφορες τροφές και νερό, που μετατοπίζει ποτάμια και θάλασσες, που επανειλημμένα αλλάζει τη φύση των πραγμάτων (ράβδος, νερό), που έγινε υλικός (ενσαρκώθηκε), που πληθύνει με την ευλογία Του τον άρτο και τα ψάρια (<a href="https://bibleox.com/el/gr-lxx-byz/mf/14/#L15-21">Μτ 14:15-21</a>· <a href="https://bibleox.com/el/gr-lxx-byz/mf/15/#L32-38">Μτ 15:32-38</a>· <a href="https://bibleox.com/el/gr-lxx-byz/mk/6/#L35-44">Μκ 6:35-44</a>· <a href="https://bibleox.com/el/gr-lxx-byz/mk/8/#L1-9">Μκ 8:1-9</a>· <a href="https://bibleox.com/el/gr-lxx-byz/lk/9/#L12-17">Λκ 9:12-17</a>· <a href="https://bibleox.com/el/gr-lxx-byz/in/6/#L5-13">Ιω 6:5-13</a>), που δημιούργησε τα μάτια του εκ γενετής τυφλού, που αποκατέστησε τη σαπισμένη σάρκα του Λαζάρου, στο πασχαλινό δείπνο με τους μαθητές δεν μοίρασε απλώς άρτο και κρασί, αλλά αφού προσευχήθηκε, <strong>τα ευλόγησε </strong>και τα ονόμασε δική Του Σάρκα και Αίμα:</p><blockquote><p>«Ἐσθιόντων δὲ αὐτῶν λαβὼν ὁ Ἰησοῦς ἄρτον καὶ <strong>εὐλογήσας</strong> ἔκλασεν καὶ δοὺς τοῖς μαθηταῖς εἶπεν, Λάβετε φάγετε, <strong>τοῦτό ἐστιν τὸ σῶμά μου</strong>. καὶ λαβὼν ποτήριον καὶ <strong>εὐχαριστήσας</strong> ἔδωκεν αὐτοῖς λέγων, Πίετε ἐξ αὐτοῦ πάντες, <strong>τοῦτο γάρ ἐστιν τὸ αἷμά μου τῆς διαθήκης</strong> τὸ περὶ πολλῶν ἐκχυννόμενον εἰς ἄφεσιν ἁμαρτιῶν.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/26/#L26-28">Μτ 26:26-28</a>)</p></blockquote><p>Δεν είναι δυνατόν να κατανοήσει κανείς αυτή την ευλογία ως κάτι ασήμαντο και κενό.</p><h2>Παλαιοδιαθηκικές προφητείες για την Ευχαριστία</h2><blockquote><p>«<strong>Ἡ σοφία</strong> ᾠκοδόμησεν ἑαυτῇ οἶκον καὶ ὑπήρεισεν στύλους ἑπτά· <strong>ἔσφαξεν τὰ ἑαυτῆς θύματα, ἐκέρασεν εἰς κρατῆρα τὸν ἑαυτῆς οἶνον καὶ ἡτοιμάσατο τὴν ἑαυτῆς τράπεζαν</strong>· ἀπέστειλεν τοὺς ἑαυτῆς δούλους συγκαλούσα μετὰ ὑψηλοῦ κηρύγματος ἐπὶ κρατῆρα λέγουσα Ὅς ἐστιν ἄφρων, ἐκκλινάτω πρός με· καὶ τοῖς ἐνδεέσι φρενῶν εἶπεν <strong>Ἔλθατε φάγετε τῶν ἐμῶν ἄρτων καὶ πίετε οἶνον, ὃν ἐκέρασα ὑμῖν</strong>· ἀπολείπετε ἀφροσύνην, καὶ ζήσεσθε, καὶ ζητήσατε φρόνησιν, ἵνα βιώσητε, καὶ κατορθώσατε ἐν γνώσει σύνεσιν.» (<a href="https://bibleox.com/el/gr-lxx-byz/pr/9/#L1-6">Πρμ 9:1-6</a>)</p></blockquote><blockquote><p>«<strong>Οἱ διψῶντες, πορεύεσθε ἐφ᾿ ὕδωρ</strong>, καὶ ὅσοι μὴ ἔχετε ἀργύριον, βαδίσαντες ἀγοράσατε καὶ <strong>πίετε</strong> ἄνευ ἀργυρίου καὶ τιμῆς οἴνου καὶ στέαρ. ἵνα τί <strong>τιμᾶσθε ἀργυρίου</strong>, καὶ τὸν μόχθον ὑμῶν <strong>οὐκ εἰς πλησμονήν</strong>; ἀκούσατέ μου καὶ φάγεσθε ἀγαθά, καὶ ἐντρυφήσει ἐν ἀγαθοῖς ἡ ψυχὴ ὑμῶν. προσέχετε τοῖς ὠτίοις ὑμῶν καὶ ἐπακολουθήσατε ταῖς ὁδοῖς μου· ἐπακούσατέ μου, καὶ ζήσεται ἐν ἀγαθοῖς ἡ ψυχὴ ὑμῶν· καὶ <strong>διαθήσομαι ὑμῖν διαθήκην αἰώνιον</strong>, τὰ ὅσια Δαυιδ τὰ πιστά.» (<a href="https://bibleox.com/el/gr-lxx-byz/is/55/#L1-3">Ησ 55:1-3</a>)</p></blockquote><blockquote><p>«<strong>Ἡ σοφία αἰνέσει ψυχὴν αὐτῆς καὶ ἐν μέσῳ λαοῦ αὐτῆς καυχήσεται</strong>· &lt;…&gt; <strong>προσέλθετε πρός με, οἱ ἐπιθυμοῦντές μου, καὶ ἀπὸ τῶν γενημάτων μου ἐμπλήσθητε· &lt;…&gt; οἱ ἐσθίοντές με ἔτι πεινάσουσιν, καὶ οἱ πίνοντές με ἔτι διψήσουσιν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/prsir/24/#L1,19,21">Σ.Σειρ 24:1,19,21</a>)</p></blockquote><h2>Κριτική</h2><h3>Η παραβολική σύγκριση του Χριστού με την πόρτα;</h3><p>Μιλώντας στον λαό, ο Χριστός παρομοιάζει τον εαυτό Του με την πόρτα της μάντρας των προβάτων:</p><blockquote><p>«Εἶπεν οὖν πάλιν ὁ Ἰησοῦς, Ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι <strong>ἐγώ εἰμι ἡ θύρα τῶν προβάτων</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/10/#L7">Ιω 10:7</a>)</p></blockquote><p>Εφόσον εδώ ο Χριστός ονομάζει τον εαυτό Του πόρτα με εικόνα, μήπως αυτό σημαίνει ότι και τα ευχαριστιακά λόγια για τη σάρκα και το αίμα πρέπει επίσης να τα κατανοούμε με εικόνα; Καθόλου, δεν σημαίνει. Πριν από τη σύγκριση με την πόρτα, ο Σωτήρας διηγήθηκε την παραβολή του ποιμένα που μπαίνει από την πόρτα στα πρόβατα στη μάντρα, και του κλέφτη που πηδάει από αλλού. Συγκρίνοντας τον εαυτό Του με την πόρτα, ο Σωτήρας απλώς τελειώνει αυτή την παραβολή, εξηγώντας την στον λαό. Με παραβολές ο Χριστός μιλούσε πάντα στον λαό, και στους μαθητές κατ’ ιδίαν τα εξηγούσε όλα:</p><blockquote><p>«Καὶ προσελθόντες οἱ μαθηταὶ εἶπαν αὐτῷ, <strong>Διὰ τί ἐν παραβολαῖς λαλεῖς αὐτοῖς</strong>; ὁ δὲ ἀποκριθεὶς εἶπεν [αὐτοῖς] ὅτι <strong>Ὑμῖν δέδοται γνῶναι τὰ μυστήρια τῆς βασιλείας τῶν οὐρανῶν, ἐκείνοις δὲ οὐ δέδοται</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/13/#L10-11">Μτ 13:10-11</a>)</p></blockquote><blockquote><p>«<strong>διὰ τοῦτο ἐν παραβολαῖς αὐτοῖς λαλῶ</strong>, ὅτι βλέποντες οὐ βλέπουσιν καὶ <strong>ἀκούοντες οὐκ ἀκούουσιν οὐδὲ συνίουσιν</strong>·» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/13/#L13">Μτ 13:13</a>)</p></blockquote><blockquote><p>«καὶ ἔλεγεν αὐτοῖς, Ὑμῖν τὸ μυστήριον δέδοται τῆς βασιλείας τοῦ θεοῦ· <strong>ἐκείνοις δὲ τοῖς ἔξω ἐν παραβολαῖς τὰ πάντα γίνεται</strong>,» (<a href="https://bibleox.com/el/gr-lxx-byz/mk/4/#L11">Μκ 4:11</a>)</p></blockquote><blockquote><p>«Καὶ τοιαύταις παραβολαῖς πολλαῖς ἐλάλει αὐτοῖς τὸν λόγον, καθὼς ἠδύναντο ἀκούειν· <strong>χωρὶς δὲ παραβολῆς οὐκ ἐλάλει αὐτοῖς, κατ᾿ ἰδίαν δὲ τοῖς ἰδίοις μαθηταῖς ἐπέλυεν πάντα</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mk/4/#L33-34">Μκ 4:33-34</a>)</p></blockquote><p>Βρισκόμενος <strong>κατ’ ιδίαν με τους μαθητές</strong> στο υπερώο της Σιών και μιλώντας τους για την Ευχαριστία, ο Χριστός δεν πρόσθετε παραβολές, πολύ περισσότερο παραβολές για σώμα και αίμα, δηλαδή ο Χριστός μιλούσε κυριολεκτικά, και όχι με εικόνα. Μιλώντας στον λαό, ο Χριστός επίσης δεν πρόσθετε στα λόγια για την Ευχαριστία καμία παραβολή. Ξεκίνησε από τη συζήτηση για το παλαιοδιαθηκικό μάννα. Αυτό δεν είναι παραβολή, αλλά πραγματικότητα. Οι Εβραίοι έτρωγαν πραγματικά το μάννα, για να μην πεθάνουν πραγματικά. Και για να δείξει στους ακροατές ότι το μάννα ήταν μόνο εικόνα, ο Κύριος λέει ότι εκείνοι, αν και έτρωγαν το μάννα, αυτό τους έσωζε μόνο από την πείνα, και στο τέλος πέθαναν όλοι (όπως πεθαίνουν όλοι οι άνθρωποι), ενώ εκείνος που θα φάει Αυτόν — δεν θα πεθάνει (γιατί αυτό δεν είναι πια εικόνα, αλλά εκείνο στο οποίο έδειχνε η εικόνα — ο αληθινός ουράνιος άρτος, που δίνει αιώνια ζωή):</p><blockquote><p>«<strong>ὁ τρώγων με</strong> κἀκεῖνος ζήσει δι᾿ ἐμέ. οὗτός ἐστιν ὁ ἄρτος ὁ ἐκ τοῦ οὐρανοῦ καταβάς, <strong>οὐ καθὼς ἔφαγον οἱ πατέρες καὶ ἀπέθανον· ὁ τρώγων τοῦτον τὸν ἄρτον ζήσει εἰς τὸν αἰῶνα</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/6/#L57-58">Ιω 6:57-58</a>)</p></blockquote><h3>«Δεν θα πιώ από τον καρπό του αμπελιού»</h3><p>Μερικοί αντιλέγουν στη ρεαλιστική κατανόηση της σάρκας και του αίματος στην Ευχαριστία, επικαλούμενοι τα λόγια του Χριστού για τον καρπό του αμπελιού στον Μυστικό Δείπνο.</p><p>Για τον καρπό του αμπελιού μιλούν και οι τρεις ευαγγελιστές: Ματθαίος, Μάρκος και Λουκάς (<a href="https://bibleox.com/el/gr-lxx-byz/mf/26/#L29">Μτ 26:29</a>· <a href="https://bibleox.com/el/gr-lxx-byz/mk/14/#L25">Μκ 14:25</a>· <a href="https://bibleox.com/el/gr-lxx-byz/lk/22/#L18">Λκ 22:18</a>). Ο ευαγγελιστής Λουκάς, σε αντίθεση με τον Μάρκο και τον Ματθαίο, περιγράφει τον δείπνο λεπτομερέστερα, αναφέροντας αρκετά ποτήρια που ήπιαν:</p><h4>Το πρώτο ποτήρι</h4><blockquote><p>«καὶ εἶπεν πρὸς αὐτούς, Ἐπιθυμίᾳ ἐπεθύμησα τοῦτο τὸ πάσχα φαγεῖν μεθ᾿ ὑμῶν πρὸ τοῦ με παθεῖν· λέγω γὰρ ὑμῖν ὅτι οὐ μὴ φάγω αὐτὸ ἕως ὅτου πληρωθῇ ἐν τῇ βασιλείᾳ τοῦ θεοῦ. καὶ <strong>δεξάμενος <mark>ποτήριον</mark> εὐχαριστήσας εἶπεν, Λάβετε τοῦτο καὶ <mark>διαμερίσατε εἰς ἑαυτούς</mark></strong>· λέγω γὰρ ὑμῖν [ὅτι] οὐ μὴ πίω ἀπὸ τοῦ νῦν ἀπὸ τοῦ γενήματος τῆς ἀμπέλου ἕως οὗ ἡ βασιλεία τοῦ θεοῦ ἔλθῃ.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/22/#L15-18">Λκ 22:15-18</a>)</p></blockquote><p>Ο Χριστός προστάζει να μοιράσουν το περιεχόμενο του ποτηριού μεταξύ των μαθητών. Αυτό το ποτήρι μοιράστηκε. Ως τώρα δεν υπήρχε Ευχαριστία και λόγια για σώμα και αίμα. Υπήρχε μόνο το πασχαλινό δείπνο. Μετά από αυτό το ποτήρι του κρασιού ο Χριστός λέει αμέσως τη φράση για τον καρπό του αμπελιού, που δεν θα πιει πια:</p><blockquote><p>«λέγω γὰρ ὑμῖν [ὅτι] οὐ μὴ πίω ἀπὸ τοῦ νῦν ἀπὸ τοῦ γενήματος τῆς ἀμπέλου ἕως οὗ ἡ βασιλεία τοῦ θεοῦ ἔλθῃ.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/22/#L18">Λκ 22:18</a>)</p></blockquote><p>Και μόνο <strong>μετά το δείπνο</strong> (<a href="https://bibleox.com/el/gr-lxx-byz/lk/22/#L20">Λκ 22:20</a>· <a href="https://bibleox.com/el/gr-lxx-byz/1kor/11/#L25">Α Κορ 11:25</a>) ο Χριστός τελεί την Ευχαριστία, παίρνοντας τον άρτο και παίρνοντας πάλι το ποτήρι (αυτό είναι ήδη άλλο ποτήρι, αφού το πρώτο το είχαν πιει), το δίνει στους μαθητές, μιλώντας μόνο τώρα για το Σώμα και το Αίμα Του:</p><h4>Το δεύτερο ποτήρι</h4><blockquote><p>«καὶ <strong>λαβὼν ἄρτον εὐχαριστήσας ἔκλασεν καὶ ἔδωκεν αὐτοῖς λέγων, Τοῦτό ἐστιν τὸ σῶμά μου</strong> [τὸ ὑπὲρ ὑμῶν διδόμενον· τοῦτο ποιεῖτε εἰς τὴν ἐμὴν ἀνάμνησιν. <strong>καὶ τὸ ποτήριον ὡσαύτως <u>μετὰ τὸ δειπνῆσαι</u>, λέγων, <mark>Τοῦτο τὸ ποτήριον</mark> ἡ καινὴ διαθήκη ἐν τῷ αἵματί μου, τὸ ὑπὲρ ὑμῶν ἐκχυννόμενον</strong>].» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/22/#L19-20">Λκ 22:19-20</a>)</p></blockquote><p>Άρα, στο πρώτο μέρος τελείται μόνο το παραδοσιακό εβραϊκό πασχαλινό γεύμα, στο οποίο έπιναν υποχρεωτικά <strong>4 ποτήρια κρασιού</strong> με νερό και ευχαριστούσαν τον Θεό. Στη Γραφή δεν υπάρχουν εντολές να πίνουν αυτά τα 4 ποτήρια κρασιού. Ήταν απλώς ιουδαϊκό έθιμο. Περισσότερα για τα έθιμα του ιουδαϊκού πασχαλινού γεύματος αναφέρονται στη Μισνά:</p><blockquote><p>ΜΙΣΝΑ ΠΡΩΤΗ</p><p>(א) עַרְבֵי פְסָחִים סָמוּךְ לַמִּנְחָה, לֹא יֹאכַל אָדָם עַד שֶׁתֶּחְשַׁךְ. וַאֲפִלּוּ עָנִי שֶׁבְּיִשְׂרָאֵל לֹא יֹאכַל עַד שֶׁיָּסֵב. וְלֹא יִפְחֲתוּ לוֹ מֵאַרְבָּעָה כוֹסוֹת שֶׁל יַיִן, וַאֲפִלּוּ מִן הַתַּמְחוּי:</p><p>ΠΑΡΑΜΟΝΗ ΤΟΥ ΠΑΣΧΑ ΔΕΝ ΠΡΕΠΕΙ ΝΑ ΦΑΕΙ ΑΝΘΡΩΠΟΣ από την ώρα που είναι ΛΙΓΟ ΠΡΙΝ ΑΠΟ ΤΗ ΜΙΝΧΑ ΩΣ ΟΤΟΥ ΝΥΧΤΩΣΕΙ. ΚΑΙ ΑΚΟΜΗ ΚΑΙ Ο ΠΙΟ ΦΤΩΧΟΣ ΣΤΟΝ λαό ΤΟΥ ΙΣΡΑΗΛ ΔΕΝ ΠΡΕΠΕΙ ΝΑ ΦΑΕΙ, ΠΡΙΝ ΞΑΠΛΩΣΕΙ για το γεύμα. ΚΑΙ <strong>ΚΑΝΕΝΑΣ δεν πρέπει να πιει ΛΙΓΟΤΕΡΑ ΑΠΟ ΤΕΣΣΕΡΑ ΠΟΤΗΡΙΑ ΚΡΑΣΙΟΥ</strong> — ΑΚΟΜΗ ΚΑΙ εκείνος που παίρνει φαγητό ΑΠΟ ΦΙΛΑΝΘΡΩΠΙΚΗ ΚΟΥΖΙΝΑ.</p></blockquote><p>(<a href="https://toldot.com/articles/articles_30013.html">Μισνά Πεσαχίμ 10</a>)</p><p>Την πρώτη φορά ο Χριστός απλώς τελεί αυτό το έθιμο: παίρνει το ποτήρι, ευχαριστεί, και το δίνει στους μαθητές Του, χωρίς να πει λέξη ότι αυτό είναι το Αίμα Του, αλλά λέγοντας να το μοιράσουν μεταξύ τους, πράγμα που προφανώς και έκαναν. Το ποτήρι άδειασε. Για τον άρτο την πρώτη φορά δεν γίνεται καθόλου λόγος. Μετά το δείπνο όμως γίνεται λόγος για τον άρτο, πάλι γίνεται λόγος για το ποτήρι, και μόνο τώρα εμφανίζονται τα λόγια για το σώμα και το αίμα του Χριστού. Γι’ αυτό τα λόγια για τον καρπό του αμπελιού αναφέρονται στο πρώτο ποτήρι με κρασί από σταφύλι, και τα λόγια για το Αίμα του Χριστού — στο δεύτερο ποτήρι, στο οποίο με μυστηριακό τρόπο δινόταν στους μαθητές όχι πια κρασί, αλλά το αληθινό Αίμα του Χριστού, στο οποίο και πιστεύουμε.</p><h3>«Το Πνεύμα ζωοποιεί, η σάρκα δεν ωφελεί καθόλου» (δεν προσφέρει κανένα όφελος)</h3><p>Οι αντίπαλοι της διδασκαλίας της Εκκλησίας για την Ευχαριστία ισχυρίζονται ότι ο Χριστός μίλησε για τη βρώση της Σάρκας Του μόνο συμβολικά. Επισημαίνουν τα εξής λόγια:</p><blockquote><p>«τὸ πνεῦμά ἐστιν τὸ ζῳοποιοῦν, <strong>ἡ σὰρξ οὐκ ὠφελεῖ οὐδέν</strong>· τὰ ῥήματα ἃ ἐγὼ λελάληκα ὑμῖν πνεῦμά ἐστιν καὶ ζωή ἐστιν.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/6/#L63">Ιω 6:63</a>)</p></blockquote><p>Οι υποστηρικτές του συμβολισμού εξηγούν αυτές τις γραμμές έτσι, ότι δηλαδή η βρώση της σάρκας του Χριστού, υποτίθεται, δεν προσφέρει κανένα όφελος.</p><p>Εμείς όμως δείχνουμε ότι τα λόγια «η σάρκα δεν ωφελεί» ειπώθηκαν για τη σαρκική σκέψη, που δεν προσφέρει όφελος. Ειπώθηκαν για ανθρώπους που σκέφτονται αποκλειστικά γήινα, χοντροκομμένα, κατά κόσμον: μόνο με εκείνον τον τρόπο που έχουν συνηθίσει να βλέπουν στη ζωή τους, ανίκανους να ανυψώσουν τη σκέψη τους στα πνευματικά μυστήρια[1].</p><p>Μπορούμε να συναντήσουμε πολλά και άλλα χωρία στη Γραφή, όπου τέτοια λόγια χρησιμοποιούνται για ανθρώπους που σκέφτονται αποκλειστικά γήινα:</p><blockquote><p>«ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτῷ, Μακάριος εἶ, Σίμων Βαριωνᾶ, ὅτι <strong>σὰρξ καὶ αἷμα οὐκ ἀπεκάλυψέν σοι</strong> ἀλλ᾿ ὁ πατήρ μου ὁ ἐν τοῖς οὐρανοῖς.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/16/#L17">Μτ 16:17</a>)</p></blockquote><blockquote><p>«ἀποκαλύψαι τὸν υἱὸν αὐτοῦ ἐν ἐμοὶ ἵνα εὐαγγελίζωμαι αὐτὸν ἐν τοῖς ἔθνεσιν, εὐθέως <strong>οὐ προσανεθέμην σαρκὶ καὶ αἵματι</strong>,» (<a href="https://bibleox.com/el/gr-lxx-byz/gal/1/#L16">Γαλ 1:16</a>)</p></blockquote><blockquote><p>«οὕτως ἀνόητοί ἐστε; <strong>ἐναρξάμενοι πνεύματι νῦν σαρκὶ ἐπιτελεῖσθε</strong>;» (<a href="https://bibleox.com/el/gr-lxx-byz/gal/3/#L3">Γαλ 3:3</a>)</p></blockquote><blockquote><p>«<strong>Ἐπικατάρατος ὁ ἄνθρωπος, ὃς</strong> τὴν ἐλπίδα ἔχει ἐπ᾿ ἄνθρωπον καὶ <strong>στηρίσει σάρκα βραχίονος αὐτοῦ</strong> ἐπ᾿ αὐτόν, καὶ ἀπὸ κυρίου ἀποστῇ ἡ καρδία αὐτοῦ·» (<a href="https://bibleox.com/el/gr-lxx-byz/ier/17/#L5">Ιερ 17:5</a>)</p></blockquote><p>Τέτοιοι άνθρωποι νόμιζαν ότι μπροστά τους είναι ένας απλός άνθρωπος, ο γιος του Ιωσήφ. Πώς μπορεί ένας συνηθισμένος άνθρωπος να τους δώσει να φάνε τη σάρκα του; — Μόνο όπως κάθε άνθρωπος, αποκόπτοντας από τον εαυτό του και δίνοντάς την για τροφή. Αυτή η σκέψη δεν τους προσέφερε κανένα όφελος. Ταράχτηκαν πολύ, λέγοντας: «<strong><em>τι παράξενα λόγια</em></strong><em>! ποιος μπορεί να τα ακούει;</em>» (<a href="https://bibleox.com/el/gr-lxx-byz/in/6/#L60">Ιω 6:60</a>) και έφυγαν.</p><p>Ωστόσο, ο Χριστός δεν είναι ένας οποιοσδήποτε άνθρωπος, αλλά ο παντοδύναμος Θεός. Αυτός θεσπίζει το μυστήριο στο οποίο η ζωοποιός Σάρκα και το Αίμα Του δίνονται με μυστηριακό τρόπο κάτω από το είδος του άρτου και του οίνου, και αυτό γίνεται με τη δύναμη του Θεού. Γι’ αυτό απαιτείται να σκέφτεται κανείς πνευματικά, αφήνοντας τόπο στη μυστηριακή τέλεση εκείνου που με τον νου δεν μπορούμε πάντα να κατανοήσουμε, αφήνοντας τόπο στην υπερφυσική τέλεση των λόγων του Χριστού, που υπερβαίνει τις γήινες τάξεις:</p><blockquote><p>«εἶπεν οὖν αὐτοῖς ὁ Ἰησοῦς, Ἀμὴν ἀμὴν λέγω ὑμῖν, <strong>ἐὰν μὴ φάγητε τὴν σάρκα τοῦ υἱοῦ τοῦ ἀνθρώπου καὶ πίητε αὐτοῦ τὸ αἷμα, οὐκ ἔχετε ζωὴν ἐν ἑαυτοῖς</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/6/#L53">Ιω 6:53</a>)</p></blockquote><h3>Γιατί «να φάμε τον Θεό»;</h3><p>Με αυτή τη μορφή την ερώτηση θέτουν οι μουσουλμάνοι. Οι προτεστάντες όμως απευθύνουν στην Εκκλησία αυτή την ερώτηση με ελαφρώς διαφορετική μορφή, αλλά η ουσία είναι η ίδια.</p><p>Η απάντηση σε μια τέτοια ερώτηση μπορεί να είναι μεγάλη, αλλά εδώ θα δοθεί μόνο η γενική σκέψη: Η Θεία Κοινωνία εισάγει τον άνθρωπο στην πιο στενή κοινωνία με τον Χριστό Θεό: όχι μόνο πνευματική, αλλά και σωματική, γιατί ο Θεός δημιούργησε τον άνθρωπο όχι μόνο από ψυχή, αλλά και από σώμα.</p><p>Στην πραγματικότητα, κάθε άνθρωπος, εκτός από τον Αδάμ και την Εύα, από την πρώτη στιγμή της εμφάνισής του σε αυτόν τον κόσμο, τρεφόταν με το σώμα άλλου ανθρώπου — με το σώμα της μητέρας του. Αν δεν το έκανε, δεν θα μπορούσε να έχει ζωή, δεν θα μπορούσε να αναπτυχθεί και να εξελιχθεί, αναμφίβολα θα χανόταν, κάτι που συμβαίνει και στην περίπτωση που το έμβρυο δεν μπορεί να εμφυτευτεί.</p><p>Όταν γεννιέται το βρέφος, το σώμα του είναι χτισμένο από το σώμα της μητέρας του. Το σώμα της μητέρας, δίνοντας τον εαυτό του, έδινε ζωή στο βρέφος, και έτσι και τα δύο (μητέρα και βρέφος) βρίσκονταν σε σωματική κοινωνία. Ακόμη και μετά τη γέννηση, το βρέφος συνεχίζει για πολύ καιρό να τρέφεται με το σώμα της μητέρας, γιατί το γάλα που καταναλώνουν τα βρέφη παράγεται στο σώμα της μητέρας από το αίμα της. Αντίστοιχα, το γάλα είναι το αίμα της μητέρας, με την παραπάνω έννοια.</p><p>Η θέσπιση και των δύο διαδικασιών (τεκνογονία και Ευχαριστία) έγινε από τον Θεό.</p><p>Γνωρίζοντας τη θεόπλαστη ανθρώπινη φύση με τις διαδικασίες της γέννησης και της τροφής, δεν απορεί κανείς αναγνωρίζοντας παρόμοιες διαδικασίες στην Ευχαριστία, στην οποία τρεφόμαστε πια όχι με το σώμα της μητέρας, αλλά με το Σώμα του Χριστού Θεού, και έτσι εισερχόμαστε με τον Θεό όχι μόνο σε πνευματική, αλλά και σε σωματική κοινωνία — πλήρη κοινωνία με τον Χριστό, με πνεύμα και σώμα:</p><blockquote><p>«<strong>ὅτι <mark>μέλη</mark> ἐσμὲν τοῦ <mark>σώματος</mark> αὐτοῦ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/5/#L30">Εφ 5:30</a>)</p></blockquote>'
