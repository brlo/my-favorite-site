  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: '<h2>Τα ιερά στην Καινή Διαθήκη</h2><h3>Ο άγιος ναός</h3><p>Ο ναός των Ιεροσολύμων ήταν εικόνα του αληθινού αγιαστηρίου:</p><blockquote><p>«οὐ γὰρ <strong>εἰς <mark>χειροποίητα</mark> εἰσῆλθεν ἅγια Χριστός, <mark>ἀντίτυπα τῶν ἀληθινῶν</mark></strong>, ἀλλ᾿ εἰς αὐτὸν τὸν οὐρανόν, νῦν ἐμφανισθῆναι τῷ προσώπῳ τοῦ θεοῦ ὑπὲρ ἡμῶν·» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/9/#L24">Εβρ 9:24</a>)</p></blockquote><blockquote><p>«καὶ ἀνέβη εἰς Ἱεροσόλυμα ὁ Ἰησοῦς. καὶ εὗρεν <strong><mark>ἐν τῷ ἱερῷ</mark></strong> τοὺς πωλοῦντας βόας καὶ πρόβατα καὶ περιστερὰς καὶ τοὺς κερματιστὰς καθημένους, καὶ ποιήσας φραγέλλιον ἐκ σχοινίων <strong>πάντας ἐξέβαλεν ἐκ τοῦ ἱεροῦ</strong>, τά τε πρόβατα καὶ τοὺς βόας, καὶ τῶν κολλυβιστῶν ἐξέχεεν τὸ κέρμα καὶ τὰς τραπέζας ἀνέτρεψεν, καὶ τοῖς τὰς περιστερὰς πωλοῦσιν εἶπεν, Ἄρατε ταῦτα ἐντεῦθεν, μὴ ποιεῖτε <strong><mark>τὸν οἶκον τοῦ πατρός μου</mark> οἶκον ἐμπορίου</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/2/#L13-16">Ιω 2:13-16</a>)</p></blockquote><blockquote><p>«καὶ ἦσαν <strong><mark>διὰ παντὸς ἐν τῷ ἱερῷ</mark></strong> εὐλογοῦντες τὸν θεόν.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/24/#L53">Λκ 24:53</a>)</p></blockquote><blockquote><p>«<strong>καθ᾿ ἡμέραν</strong> τε <strong><mark>προσκαρτεροῦντες ὁμοθυμαδὸν ἐν τῷ ἱερῷ</mark></strong>, κλῶντές τε κατ᾿ οἶκον ἄρτον, μετελάμβανον τροφῆς ἐν ἀγαλλιάσει καὶ ἀφελότητι καρδίας» (<a href="https://bibleox.com/el/gr-lxx-byz/act/2/#L46">Πραξ 2:46</a>)</p></blockquote><p>Ο απόστολος προσεύχεται στον ναό και εκεί του εμφανίζεται ο Χριστός σε όραμα:</p><blockquote><p>«Ἐγένετο δέ μοι ὑποστρέψαντι εἰς Ἰερουσαλὴμ καὶ <strong><mark>προσευχομένου μου ἐν τῷ ἱερῷ</mark> γενέσθαι με ἐν ἐκστάσει</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/act/22/#L17">Πραξ 22:17</a>)</p></blockquote><p>Ο αντίχριστος (ο άνθρωπος της ανομίας) θα καθίσει στον ναό του Θεού (προφανώς, για να καθίσει στον ναό του Θεού, πρέπει να είναι: όχι ο ναός του Δία και όχι ο ναός του Περούνα, αλλά ο ναός του Θεού):</p><blockquote><p>«μή τις ὑμᾶς ἐξαπατήσῃ κατὰ μηδένα τρόπον· ὅτι ἐὰν μὴ ἔλθῃ ἡ ἀποστασία πρῶτον καὶ ἀποκαλυφθῇ <strong>ὁ ἄνθρωπος τῆς ἀνομίας</strong>, ὁ υἱὸς τῆς ἀπωλείας, <strong>ὁ ἀντικείμενος καὶ ὑπεραιρόμενος</strong> ἐπὶ πάντα <strong>λεγόμενον</strong> <strong>θεὸν</strong> ἢ <strong>σέβασμα</strong>, ὥστε αὐτὸν <strong><mark>εἰς τὸν ναὸν τοῦ θεοῦ καθίσαι</mark></strong>, ἀποδεικνύντα ἑαυτὸν ὅτι ἔστιν θεός.» (<a href="https://bibleox.com/el/gr-lxx-byz/2sol/2/#L3-4">Β Θεσ 2:3-4</a>)</p></blockquote><h3>Ο άγιος τόπος</h3><p>Στον άγιο τόπο οι ακροατές πρέπει να δουν κάτι:</p><blockquote><p>«<strong>Ὅταν οὖν ἴδητε τὸ βδέλυγμα</strong> τῆς ἐρημώσεως τὸ ῥηθὲν διὰ Δανιὴλ τοῦ προφήτου <strong>ἑστὸς ἐν <mark>τόπῳ ἁγίῳ</mark></strong>, ὁ ἀναγινώσκων νοείτω» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/24/#L15">Μτ 24:15</a>)</p></blockquote><h3>Το ιερό αντικείμενο</h3><h4>Ο ναός και το θυσιαστήριο είναι ακόμη άγια και αγιάζουν</h4><blockquote><p>«μωροὶ καὶ τυφλοί, τίς γὰρ μείζων ἐστίν, ὁ χρυσὸς ἢ <strong><mark>ὁ ναὸς ὁ ἁγιάσας</mark></strong> τὸν χρυσόν; &lt;…&gt; τυφλοί, τί γὰρ μεῖζον, τὸ δῶρον ἢ <strong><mark>τὸ θυσιαστήριον τὸ ἁγιάζον</mark></strong> τὸ δῶρον;» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/23/#L17,19">Μτ 23:17,19</a>)</p></blockquote><h4>Η θεραπεία στην κολυμβήθρα της Βηθεσδά</h4><blockquote><p>«ἀπεκρίθη αὐτῷ ὁ ἀσθενῶν, Κύριε, <strong>ἄνθρωπον</strong> <strong>οὐκ ἔχω</strong> ἵνα ὅταν <strong>ταραχθῇ <mark>τὸ ὕδωρ</mark> <mark>βάλῃ με</mark> εἰς τὴν <mark>κολυμβήθραν</mark></strong>· ἐν ᾧ δὲ ἔρχομαι ἐγὼ ἄλλος πρὸ ἐμοῦ καταβαίνει.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/5/#L7">Ιω 5:7</a>)</p></blockquote><h4>Οι απόστολοι θεράπευαν με αλείμματα ελαίου</h4><blockquote><p>«καὶ προσκαλεῖται τοὺς δώδεκα, καὶ ἤρξατο αὐτοὺς ἀποστέλλειν δύο δύο, καὶ ἐδίδου αὐτοῖς ἐξουσίαν τῶν πνευμάτων τῶν ἀκαθάρτων· &lt;…&gt; Καὶ ἐξελθόντες ἐκήρυξαν ἵνα μετανοῶσιν, καὶ δαιμόνια πολλὰ ἐξέβαλλον, καὶ <strong><mark>ἤλειφον ἐλαίῳ πολλοὺς ἀρρώστους καὶ ἐθεράπευον</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mk/6/#L7,12-13">Μκ 6:7,12-13</a>)</p></blockquote><blockquote><p>«ἀσθενεῖ τις ἐν ὑμῖν; <strong>προσκαλεσάσθω τοὺς πρεσβυτέρους τῆς ἐκκλησίας</strong>, καὶ <strong>προσευξάσθωσαν ἐπ᾿ αὐτὸν <mark>ἀλείψαντες ἐλαίῳ</mark> ἐν τῷ ὀνόματι [τοῦ] κυρίου</strong>· καὶ ἡ εὐχὴ τῆς πίστεως σώσει τὸν κάμνοντα, καὶ ἐγερεῖ αὐτὸν ὁ κύριος· κἂν ἁμαρτίας ᾖ πεποιηκώς, ἀφεθήσεται αὐτῷ» (<a href="https://bibleox.com/el/gr-lxx-byz/iak/5/#L14-16">Ιακ 5:14-16</a>)</p></blockquote><h4>Το αίμα του Χριστού είναι ιερό</h4><blockquote><p><em>«ἀθετήσας τις νόμον Μωϋσέως χωρὶς οἰκτιρμῶν ἐπὶ δυσὶν ἢ τρισὶν μάρτυσιν ἀποθνῄσκει· </em><strong><em>πόσῳ δοκεῖτε <mark>χείρονος</mark> <mark>ἀξιωθήσεται τιμωρίας ὁ τὸν υἱὸν τοῦ θεοῦ καταπατήσας</mark>, καὶ <mark>τὸ αἷμα τῆς διαθήκης κοινὸν ἡγησάμενος</mark> ἐν ᾧ ἡγιάσθη, καὶ τὸ πνεῦμα τῆς χάριτος ἐνυβρίσας</em></strong><em>;» (</em><a href="https://bibleox.com/el/gr-lxx-byz/evr/10/#L28-29"><em>Εβρ 10:28-29</em></a><em>)</em></p></blockquote><h4>Οι άνθρωποι θεραπεύονται όταν αγγίζουν τα ρούχα που άφησαν οι απόστολοι</h4><blockquote><p><em>«ὥστε καὶ </em><strong><em>ἐπὶ τοὺς ἀσθενοῦντας ἀποφέρεσθαι ἀπὸ τοῦ χρωτὸς αὐτοῦ <mark>σουδάρια ἢ σιμικίνθια</mark> καὶ ἀπαλλάσσεσθαι ἀπ᾿ αὐτῶν τὰς νόσους, τά τε πνεύματα τὰ πονηρὰ ἐκπορεύεσθαι</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/act/19/#L12"><em>Πραξ 19:12</em></a><em>)</em></p></blockquote><h4>Ο αντίχριστος θα υψωθεί πάνω από τα ιερά</h4><p>Προφανώς, για να υψωθεί πάνω από τα ιερά, πρέπει να υπάρχουν:</p><blockquote><p>«μή τις ὑμᾶς ἐξαπατήσῃ κατὰ μηδένα τρόπον· ὅτι ἐὰν μὴ ἔλθῃ ἡ ἀποστασία πρῶτον καὶ ἀποκαλυφθῇ <strong>ὁ ἄνθρωπος τῆς ἀνομίας</strong>, ὁ υἱὸς τῆς ἀπωλείας, <strong>ὁ ἀντικείμενος καὶ <mark>ὑπεραιρόμενος</mark></strong> ἐπὶ πάντα <strong>λεγόμενον</strong> <strong>θεὸν</strong> ἢ <strong><mark>σέβασμα</mark></strong>, ὥστε αὐτὸν εἰς τὸν ναὸν τοῦ θεοῦ καθίσαι, ἀποδεικνύντα ἑαυτὸν ὅτι ἔστιν θεός.» (<a href="https://bibleox.com/el/gr-lxx-byz/2sol/2/#L3-4">Β Θεσ 2:3-4</a>)</p></blockquote><h3>Η ιερή εικόνα</h3><h4>Οι άνθρωποι περίμεναν θεραπεία από τη σκιά του αποστόλου</h4><blockquote><p>«ὥστε καὶ <strong>εἰς τὰς πλατείας ἐκφέρειν τοὺς ἀσθενεῖς</strong> καὶ τιθέναι ἐπὶ κλιναρίων καὶ κραβάττων, <strong>ἵνα ἐρχομένου Πέτρου κἂν ἡ σκιὰ ἐπισκιάσῃ τινὶ αὐτῶν</strong>. συνήρχετο δὲ καὶ τὸ πλῆθος τῶν πέριξ πόλεων Ἰερουσαλήμ, φέροντες ἀσθενεῖς καὶ ὀχλουμένους ὑπὸ πνευμάτων ἀκαθάρτων, <strong>οἵτινες ἐθεραπεύοντο ἅπαντες</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/5/#L15-16">Πραξ 5:15-16</a>)</p></blockquote><h3>Οι ιεροί άνθρωποι (οι ιερείς)</h3><h4>Η εμφάνιση του Χριστού μόνο στους αποστόλους. Ο Χριστός δίνει εξουσία μόνο σε αυτούς</h4><blockquote><p><em>«εἶπεν οὖν αὐτοῖς πάλιν, Εἰρήνη ὑμῖν· καθὼς ἀπέσταλκέν με ὁ πατήρ, κἀγὼ πέμπω ὑμᾶς. καὶ τοῦτο εἰπὼν </em><strong><em>ἐνεφύσησεν</em></strong><em> καὶ λέγει αὐτοῖς, </em><strong><em>Λάβετε πνεῦμα ἅγιον</em></strong><em>· </em><strong><em>ἄν τινων ἀφῆτε τὰς ἁμαρτίας ἀφέωνται αὐτοῖς, ἄν τινων κρατῆτε κεκράτηνται</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/in/20/#L21-23"><em>Ιω 20:21-23</em></a><em>)</em></p></blockquote><blockquote><p>«Ἀμὴν λέγω ὑμῖν, <strong>ὅσα ἐὰν δήσητε ἐπὶ τῆς γῆς ἔσται δεδεμένα ἐν οὐρανῷ καὶ ὅσα ἐὰν λύσητε ἐπὶ τῆς γῆς ἔσται λελυμένα ἐν οὐρανῷ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/18/#L18">Μτ 18:18</a>)</p></blockquote><h3>Οι ιερές τελετές και τα μυστήρια</h3><p>Η ευχαριστιακή θυσία (της Καινής Διαθήκης). Ο Κύριος διδάσκει την τέλεσή της μόνο στους αποστόλους:</p><blockquote><p><em>«Ἐσθιόντων δὲ αὐτῶν </em><strong><em>λαβὼν ὁ Ἰησοῦς <mark>ἄρτον</mark> καὶ εὐλογήσας <mark>ἔκλασεν</mark> καὶ δοὺς τοῖς μαθηταῖς εἶπεν, Λάβετε φάγετε, τοῦτό ἐστιν τὸ σῶμά μου</em></strong><em>. καὶ </em><strong><em>λαβὼν <mark>ποτήριον</mark> καὶ εὐχαριστήσας ἔδωκεν αὐτοῖς λέγων, Πίετε ἐξ αὐτοῦ πάντες</em></strong><em>, τοῦτο γάρ ἐστιν τὸ αἷμά μου τῆς διαθήκης τὸ περὶ πολλῶν ἐκχυννόμενον εἰς ἄφεσιν ἁμαρτιῶν.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/mf/26/#L26-28"><em>Μτ 26:26-28</em></a><em> · </em><a href="https://bibleox.com/el/gr-lxx-byz/mk/14/#L22-24"><em>Μκ 14:22-24</em></a><em> · </em><a href="https://bibleox.com/el/gr-lxx-byz/lk/22/#L19-20"><em>Λκ 22:19-20</em></a>)</p></blockquote><blockquote><p>«καὶ <strong>λαβὼν <mark>ἄρτον</mark> εὐχαριστήσας <mark>ἔκλασεν</mark> καὶ ἔδωκεν αὐτοῖς λέγων, Τοῦτό ἐστιν τὸ σῶμά μου [τὸ ὑπὲρ ὑμῶν διδόμενον· τοῦτο <mark>ποιεῖτε</mark> εἰς τὴν ἐμὴν ἀνάμνησιν</strong>. καὶ <strong><mark>τὸ ποτήριον</mark> ὡσαύτως μετὰ τὸ δειπνῆσαι</strong>, λέγων, Τοῦτο τὸ ποτήριον ἡ καινὴ διαθήκη ἐν τῷ αἵματί μου, τὸ ὑπὲρ ὑμῶν ἐκχυννόμενον].» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/22/#L19-20">Λκ 22:19-20</a>)</p></blockquote><p>Στη συνέχεια, χωριστά, την ίδια τάξη (τελετή) διδάσκει τον απόστολο Παύλο, που κλήθηκε αργότερα:</p><blockquote><p><em>«</em><strong><em>Ἐγὼ γὰρ παρέλαβον ἀπὸ τοῦ κυρίου</em></strong><em>, ὃ καὶ παρέδωκα ὑμῖν, ὅτι ὁ κύριος Ἰησοῦς ἐν τῇ νυκτὶ ᾗ παρεδίδετο </em><strong><em>ἔλαβεν <mark>ἄρτον</mark> καὶ εὐχαριστήσας</em></strong><em> </em><strong><em><mark>ἔκλασεν</mark></em></strong><em> καὶ εἶπεν, </em><strong><em>Τοῦτό μού ἐστιν τὸ σῶμα</em></strong><em> τὸ ὑπὲρ ὑμῶν· </em><strong><em><mark>τοῦτο ποιεῖτε</mark></em></strong><em> εἰς τὴν ἐμὴν ἀνάμνησιν. </em><strong><em><mark>ὡσαύτως καὶ τὸ ποτήριον</mark></em></strong><em> μετὰ τὸ δειπνῆσαι, λέγων, </em><strong><em>Τοῦτο τὸ ποτήριον ἡ καινὴ διαθήκη ἐστὶν ἐν τῷ ἐμῷ αἵματι</em></strong><em>· τοῦτο ποιεῖτε, ὁσάκις ἐὰν πίνητε, εἰς τὴν ἐμὴν ἀνάμνησιν.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/1kor/11/#L23-25"><em>Α Κορ 11:23-25</em></a><em>)</em></p></blockquote><h3>Η επίθεση των χειρών με προσευχή</h3><blockquote><p><em>«δι᾿ ἣν αἰτίαν ἀναμιμνῄσκω σε ἀναζωπυρεῖν </em><strong><em>τὸ <mark>χάρισμα τοῦ θεοῦ</mark>, ὅ ἐστιν ἐν σοὶ <u><mark>διὰ</mark></u> <mark>τῆς ἐπιθέσεως τῶν χειρῶν μου</mark></em></strong><em>·» (</em><a href="https://bibleox.com/el/gr-lxx-byz/2tim/1/#L6"><em>Β Τιμ 1:6</em></a><em>)</em></p></blockquote><blockquote><p><em>«μὴ ἀμέλει τοῦ </em><strong><em>ἐν σοὶ <mark>χαρίσματος</mark>, ὃ ἐδόθη σοι διὰ προφητείας <mark>μετὰ ἐπιθέσεως τῶν χειρῶν τοῦ πρεσβυτερίου</mark></em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/1tim/4/#L14"><em>Α Τιμ 4:14</em></a><em>)</em></p></blockquote><blockquote><p><em>«λειτουργούντων δὲ αὐτῶν τῷ κυρίῳ καὶ νηστευόντων εἶπεν τὸ πνεῦμα τὸ ἅγιον, Ἀφορίσατε δή μοι τὸν Βαρναβᾶν καὶ </em><strong><em><mark>Σαῦλον</mark></em></strong><em> εἰς τὸ ἔργον ὃ προσκέκλημαι αὐτούς. τότε νηστεύσαντες καὶ προσευξάμενοι καὶ </em><strong><em><mark>ἐπιθέντες τὰς χεῖρας αὐτοῖς</mark></em></strong><em> ἀπέλυσαν.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/act/13/#L2-3"><em>Πραξ 13:2-3</em></a><em>)</em></p></blockquote><blockquote><p><em>«οὓς ἔστησαν ἐνώπιον τῶν ἀποστόλων, καὶ προσευξάμενοι </em><strong><em><mark>ἐπέθηκαν αὐτοῖς τὰς χεῖρας</mark></em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/act/6/#L6"><em>Πραξ 6:6</em></a><em> · </em><a href="https://bibleox.com/el/gr-lxx-byz/act/21/#L8"><em>Πραξ 21:8</em></a><em>)</em></p></blockquote><blockquote><p><em>«βαπτισμῶν </em><strong><em><mark>διδαχῆς</mark></em></strong><em>, </em><strong><em><mark>ἐπιθέσεώς τε χειρῶν</mark></em></strong><em>, ἀναστάσεώς τε νεκρῶν, καὶ κρίματος αἰωνίου.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/evr/6/#L2"><em>Εβρ 6:2</em></a><em>)</em></p></blockquote><blockquote><p>«ἰδὼν δὲ ὁ Σίμων ὅτι <strong><mark>διὰ τῆς ἐπιθέσεως τῶν χειρῶν τῶν ἀποστόλων δίδοται τὸ πνεῦμα</mark></strong>, προσήνεγκεν αὐτοῖς χρήματα λέγων, Δότε κἀμοὶ τὴν ἐξουσίαν ταύτην ἵνα ᾧ ἐὰν ἐπιθῶ τὰς χεῖρας λαμβάνῃ πνεῦμα ἅγιον. Πέτρος δὲ εἶπεν πρὸς αὐτόν, Τὸ ἀργύριόν σου σὺν σοὶ εἴη εἰς ἀπώλειαν, ὅτι <strong>τὴν δωρεὰν τοῦ θεοῦ</strong> ἐνόμισας διὰ χρημάτων κτᾶσθαι.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/8/#L18-20">Πραξ 8:18-20</a>)</p></blockquote><blockquote><p>«οὐδέπω γὰρ ἦν ἐπ᾿ οὐδενὶ αὐτῶν ἐπιπεπτωκός, μόνον δὲ βεβαπτισμένοι ὑπῆρχον εἰς τὸ ὄνομα τοῦ κυρίου Ἰησοῦ. τότε <strong><mark>ἐπετίθουν τὰς χεῖρας ἐπ᾿ αὐτούς, καὶ ἐλάμβανον πνεῦμα ἅγιον</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/8/#L16-17">Πραξ 8:16-17</a>)</p></blockquote><h3>Το δώρο του Θεού που μεταδίδει τη χάρη</h3><blockquote><p>«εἶπεν δὲ Πέτρος, Ἀργύριον καὶ χρυσίον οὐχ ὑπάρχει μοι, <strong><mark>ὃ δὲ ἔχω τοῦτό σοι δίδωμι</mark></strong>· ἐν τῷ ὀνόματι Ἰησοῦ Χριστοῦ τοῦ Ναζωραίου περιπάτει. καὶ πιάσας αὐτὸν τῆς δεξιᾶς χειρὸς ἤγειρεν αὐτόν· παραχρῆμα δὲ ἐστερεώθησαν αἱ βάσεις αὐτοῦ καὶ τὰ σφυδρά, καὶ ἐξαλλόμενος ἔστη καὶ περιεπάτει, καὶ εἰσῆλθεν σὺν αὐτοῖς εἰς τὸ ἱερὸν περιπατῶν καὶ ἁλλόμενος καὶ αἰνῶν τὸν θεόν.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/3/#L6-8">Πραξ 3:6-8</a>)</p></blockquote><h2>Τα ιερά στην Παλαιά Διαθήκη</h2><h3>Ο άγιος ναός</h3><blockquote><p>«Καὶ <strong>ἐλάλησεν κύριος</strong> πρὸς Μωυσῆν λέγων Εἰπὸν τοῖς υἱοῖς Ισραηλ, καὶ <strong>λάβετέ μοι ἀπαρχὰς</strong> παρὰ πάντων, οἷς ἂν δόξῃ τῇ καρδίᾳ, καὶ λήμψεσθε τὰς ἀπαρχάς μου. &lt;…&gt; καὶ <strong><em><mark>ποιήσεις</mark></em> <mark>μοι</mark> <em><mark>ἁγίασμα</mark></em></strong>, καὶ ὀφθήσομαι ἐν ὑμῖν· καὶ ποιήσεις μοι <strong><mark>κατὰ πάντα, ὅσα ἐγώ σοι δεικνύω</mark></strong> ἐν τῷ ὄρει, <strong><mark>τὸ παράδειγμα τῆς σκηνῆς</mark></strong> καὶ τὸ παράδειγμα πάντων τῶν σκευῶν αὐτῆς· οὕτω ποιήσεις.» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/25/#L1-2,8-9">Έξ 25:1-2,8-9</a>)</p></blockquote><blockquote><p><em>«ἰδοὺ υἱὸς τίκτεταί σοι &lt;…&gt; </em><strong><em>οὗτος οἰκοδομήσει οἶκον τῷ ὀνόματί μου</em></strong><em>» (</em><a href="https://bibleox.com/el/gr-lxx-byz/1par/22/#L9-10"><em>Α Παρ 22:9-10</em></a><em>)</em></p></blockquote><blockquote><p><em>«ἐγὼ δὲ ἐν τῷ πλήθει τοῦ ἐλέους σου εἰσελεύσομαι εἰς τὸν οἶκόν σου, </em><strong><em>προσκυνήσω</em></strong><em> πρὸς </em><strong><em><mark>ναὸν ἅγιόν σου</mark></em></strong><em> ἐν φόβῳ σου.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/ps/5/#L7"><em>Ψλ 5:7</em></a><em>)</em></p></blockquote><h3>Ο άγιος τόπος</h3><blockquote><p><em>«καὶ εἶπεν Μὴ ἐγγίσῃς ὧδε· λῦσαι τὸ ὑπόδημα ἐκ τῶν ποδῶν σου· </em><strong><em>ὁ γὰρ <mark>τόπος</mark>, ἐν ᾧ σὺ ἕστηκας, <mark>γῆ ἁγία ἐστίν</mark></em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/ish/3/#L5"><em>Έξ 3:5</em></a><em>)</em></p></blockquote><blockquote><p><em>«καὶ λέγει ὁ ἀρχιστράτηγος κυρίου πρὸς Ἰησοῦν Λῦσαι τὸ ὑπόδημα ἐκ τῶν ποδῶν σου· </em><strong><em>ὁ γὰρ <mark>τόπος</mark>, ἐφ᾿ ᾧ σὺ ἕστηκας, <mark>ἅγιός ἐστιν</mark></em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/nav/5/#L15"><em>Ιησ 5:15</em></a><em>)</em></p></blockquote><blockquote><p><em>«καὶ τὸν κριὸν τῆς τελειώσεως λήμψῃ καὶ ἑψήσεις τὰ κρέα </em><strong><em><mark>ἐν τόπῳ ἁγίῳ</mark></em></strong><em>» (</em><a href="https://bibleox.com/el/gr-lxx-byz/ish/29/#L31"><em>Έξ 29:31</em></a><em>)</em></p></blockquote><h3>Το ιερό αντικείμενο</h3><p>Το μύρο είναι ιερό. Ο ναός και όλα τα σκεύη του ναού, όταν χριστούν με μύρο, είναι ιερά. Από τους ανθρώπους, με το μύρο μπορούν να χριστούν μόνο οι απόγονοι του Ααρών, για να γίνουν ιερείς:</p><blockquote><p>«Καὶ σὺ λαβὲ ἡδύσματα, τὸ ἄνθος σμύρνης ἐκλεκτῆς πεντακοσίους σίκλους καὶ κινναμώμου εὐώδους τὸ ἥμισυ τούτου διακοσίους πεντήκοντα καὶ καλάμου εὐώδους διακοσίους πεντήκοντα καὶ ἴρεως πεντακοσίους σίκλους τοῦ ἁγίου καὶ ἔλαιον ἐξ ἐλαίων ιν καὶ ποιήσεις αὐτὸ <strong><mark>ἔλαιον χρῖσμα ἅγιον</mark></strong>, μύρον μυρεψικὸν τέχνῃ μυρεψοῦ· ἔλαιον χρῖσμα ἅγιον ἔσται. καὶ <strong>χρίσεις ἐξ αὐτοῦ τὴν σκηνὴν</strong> τοῦ μαρτυρίου καὶ <strong>τὴν κιβωτὸν τοῦ μαρτυρίου</strong> καὶ <strong>τὴν λυχνίαν</strong> καὶ πάντα τὰ σκεύη αὐτῆς καὶ <strong>τὸ θυσιαστήριον τοῦ θυμιάματος</strong> καὶ <strong>τὸ θυσιαστήριον τῶν ὁλοκαυτωμάτων</strong> καὶ πάντα αὐτοῦ τὰ σκεύη καὶ <strong>τὴν τράπεζαν</strong> καὶ <strong>πάντα τὰ σκεύη αὐτῆς</strong> καὶ <strong>τὸν λουτῆρα</strong> καὶ τὴν βάσιν αὐτοῦ καὶ <strong><mark>ἁγιάσεις αὐτά</mark></strong>, καὶ <strong><mark>ἔσται ἅγια τῶν ἁγίων</mark></strong>· πᾶς ὁ ἁπτόμενος αὐτῶν ἁγιασθήσεται. καὶ <strong>Ααρων καὶ τοὺς υἱοὺς αὐτοῦ χρίσεις</strong> καὶ ἁγιάσεις αὐτοὺς ἱερατεύειν μοι. καὶ τοῖς υἱοῖς Ισραηλ λαλήσεις λέγων Ἔλαιον ἄλειμμα χρίσεως ἅγιον ἔσται τοῦτο ὑμῖν εἰς τὰς γενεὰς ὑμῶν. <strong>ἐπὶ σάρκα ἀνθρώπου οὐ χρισθήσεται</strong>, καὶ κατὰ τὴν σύνθεσιν ταύτην οὐ ποιήσετε ὑμῖν ἑαυτοῖς ὡσαύτως· <strong><mark>ἅγιόν ἐστιν</mark></strong> καὶ <strong><mark>ἁγίασμα ἔσται ὑμῖν</mark></strong>. ὃς ἂν ποιήσῃ ὡσαύτως, καὶ ὃς ἂν δῷ ἀπ᾿ αὐτοῦ ἀλλογενεῖ, ἐξολεθρευθήσεται ἐκ τοῦ λαοῦ αὐτοῦ.» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/30/#L23-33">Έξ 30:23-33</a>)</p></blockquote><p>Το θυσιαστήριο είναι άγιο των αγίων:</p><blockquote><p>«καὶ λήμψῃ τὸ ἔλαιον τοῦ χρίσματος καὶ χρίσεις τὴν σκηνὴν καὶ πάντα τὰ ἐν αὐτῇ καὶ ἁγιάσεις αὐτὴν καὶ πάντα τὰ σκεύη αὐτῆς, καὶ ἔσται ἁγία. καὶ χρίσεις τὸ θυσιαστήριον τῶν καρπωμάτων καὶ πάντα αὐτοῦ τὰ σκεύη καὶ ἁγιάσεις τὸ θυσιαστήριον, καὶ <strong><mark>ἔσται τὸ θυσιαστήριον ἅγιον τῶν ἁγίων</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/40/#L9-10">Έξ 40:9-10</a>)</p></blockquote><blockquote><p><em>«ἑπτὰ ἡμέρας καθαριεῖς τὸ θυσιαστήριον καὶ ἁγιάσεις αὐτό, καὶ ἔσται τὸ </em><strong><em><mark>θυσιαστήριον ἅγιον τοῦ ἁγίου</mark></em></strong><em>· </em><strong><em>πᾶς ὁ ἁπτόμενος τοῦ θυσιαστηρίου ἁγιασθήσεται</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/ish/29/#L37"><em>Έξ 29:37</em></a><em>)</em></p></blockquote><p><a href="https://bibleox.com/el/el/w/Θυμίαμα_λίβανος_λιβάνι_θυμιατό">Το θυμίαμα</a> (αρωματική ουσία για την καύση στο θυσιαστήριο) είναι άγιο των αγίων:</p><blockquote><p>«καὶ εἶπεν κύριος πρὸς Μωυσῆν Λαβὲ σεαυτῷ ἡδύσματα, στακτήν, ὄνυχα, χαλβάνην ἡδυσμοῦ καὶ λίβανον διαφανῆ, ἴσον ἴσῳ ἔσται· καὶ ποιήσουσιν ἐν αὐτῷ <strong><mark>θυμίαμα</mark>, μυρεψικὸν ἔργον μυρεψοῦ</strong>, μεμιγμένον, καθαρόν, ἔργον ἅγιον. καὶ συγκόψεις ἐκ τούτων λεπτὸν καὶ θήσεις ἀπέναντι τῶν μαρτυρίων ἐν τῇ σκηνῇ τοῦ μαρτυρίου, ὅθεν γνωσθήσομαί σοι ἐκεῖθεν· <strong><mark>ἅγιον τῶν ἁγίων</mark> ἔσται ὑμῖν</strong>. θυμίαμα κατὰ τὴν σύνθεσιν ταύτην οὐ ποιήσετε ὑμῖν αὐτοῖς· <strong><mark>ἁγίασμα ἔσται ὑμῖν</mark> κυρίῳ</strong>· ὃς ἂν ποιήσῃ ὡσαύτως ὥστε ὀσφραίνεσθαι ἐν αὐτῷ, ἀπολεῖται ἐκ τοῦ λαοῦ αὐτοῦ.» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/30/#L34-38">Έξ 30:34-38</a>)</p></blockquote><h3>Η ιερή εικόνα</h3><blockquote><p><em>«Καὶ </em><strong><em><mark>τὴν σκηνὴν ποιήσεις δέκα αὐλαίας</mark></em></strong><em> ἐκ βύσσου κεκλωσμένης καὶ ὑακίνθου καὶ πορφύρας καὶ κοκκίνου κεκλωσμένου· </em><strong><em><mark>χερουβιμ ἐργασίᾳ ὑφάντου ποιήσεις αὐτάς</mark></em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/ish/26/#L1"><em>Έξ 26:1</em></a><em> · </em><a href="https://bibleox.com/el/gr-lxx-byz/ish/36/#L8"><em>Έξ 36:8</em></a><em>)</em></p></blockquote><blockquote><p><em>«καὶ </em><strong><em>λήμψῃ τὸ ἔλαιον τοῦ χρίσματος καὶ χρίσεις</em></strong><em> </em><strong><em><mark>τὴν σκηνὴν καὶ πάντα τὰ ἐν αὐτῇ</mark></em></strong><em> καὶ </em><strong><em><mark>ἁγιάσεις</mark></em></strong><em> αὐτὴν καὶ </em><strong><em><mark>πάντα τὰ σκεύη αὐτῆς</mark></em></strong><em>, καὶ </em><strong><em><mark>ἔσται ἁγία</mark></em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/ish/40/#L9"><em>Έξ 40:9</em></a><em>)</em></p></blockquote><h3>Οι ιεροί άνθρωποι (οι ιερείς)</h3><p><a href="https://bibleox.com/el/el/w/Το_μυστήριο_της_Ιερωσύνης">Ιερείς</a> είναι μόνο οι απόγονοι του Ααρών:</p><blockquote><p><em>«καὶ ζώσεις αὐτοὺς ταῖς ζώναις καὶ περιθήσεις αὐτοῖς τὰς κιδάρεις, καὶ </em><strong><em>ἔσται αὐτοῖς ἱερατεία ἐμοὶ εἰς τὸν αἰῶνα</em></strong><em>. καὶ τελειώσεις τὰς χεῖρας </em><strong><em>Ααρων καὶ τὰς χεῖρας τῶν υἱῶν αὐτοῦ</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/ish/29/#L9"><em>Έξ 29:9</em></a><em>)</em></p></blockquote><p>Η ιερωσύνη μεταδίδεται μαζί με τα ιερά ενδύματα και το χρίσμα:</p><blockquote><p><em>«καὶ </em><strong><em>ἡ στολὴ τοῦ ἁγίου</em></strong><em>, ἥ ἐστιν Ααρων, </em><strong><em>ἔσται τοῖς υἱοῖς αὐτοῦ μετ᾿ αὐτόν</em></strong><em>, </em><strong><em>χρισθῆναι αὐτοὺς ἐν αὐτοῖς καὶ τελειῶσαι τὰς χεῖρας αὐτῶν</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/ish/29/#L29"><em>Έξ 29:29</em></a><em>)</em></p></blockquote><p>Ο ξένος που πλησιάζει στα ιερά πρέπει να πεθάνει. Το καθήκον της ιερωσύνης είναι να το προσέχει αυτό:</p><blockquote><p><em>«καὶ Ααρων καὶ τοὺς υἱοὺς αὐτοῦ καταστήσεις ἐπὶ τῆς σκηνῆς τοῦ μαρτυρίου, καὶ φυλάξουσιν τὴν ἱερατείαν αὐτῶν καὶ πάντα τὰ κατὰ τὸν βωμὸν καὶ ἔσω τοῦ καταπετάσματος· καὶ </em><strong><em>ὁ ἀλλογενὴς ὁ ἁπτόμενος ἀποθανεῖται</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/chis/3/#L10"><em>Αρ 3:10</em></a><em>)</em></p></blockquote><h4>Το άγγιγμα του σώματος του προφήτη Ελισσαίου θεράπευε</h4><blockquote><p><em>«καὶ ἐγένετο αὐτῶν θαπτόντων τὸν ἄνδρα καὶ ἰδοὺ εἶδον τὸν μονόζωνον καὶ ἔρριψαν τὸν ἄνδρα ἐν τῷ τάφῳ Ελισαιε, καὶ ἐπορεύθη καὶ ἥψατο </em><strong><em>τῶν ὀστέων Ελισαιε</em></strong><em> καὶ ἔζησεν καὶ ἀνέστη ἐπὶ τοὺς πόδας αὐτοῦ.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/4ts/13/#L21"><em>Δ Βασ 13:21</em></a><em>)</em></p></blockquote><h3>Οι ιερές τελετές και τα μυστήρια</h3><p>Στην Παλαιά Διαθήκη υπήρχαν πάρα πολλές τελετές. Μπορεί κανείς να μάθει γι’ αυτές από το βιβλίο του Λευιτικού. Για παράδειγμα, η τελετή της χειροτονίας του αρχιερέα: <a href="https://bibleox.com/el/el/w/Ο_ιερέας_της_Παλαιάς_Διαθήκης#HH-Η-τελετή">Η τελετή</a></p><p>Η ευχαριστιακή θυσία (της Παλαιάς Διαθήκης):</p><p><a href="https://bibleox.com/el/el/w/Η_Θεία_Ευχαριστία#HH-Η-ειρηνική-θυσία-της-ευχαριστίας">Η ειρηνική θυσία της ευχαριστίας</a></p><h3>Η επίθεση των χειρών με προσευχή</h3><h4>Ο Ιακώβ ευλογεί τα εγγόνια του</h4><p>Ο Ιακώβ ευλόγησε τα εγγόνια του, βάζοντας πάνω τους τα χέρια με προσευχή:</p><blockquote><p><em>«</em><strong><em>ἐκτείνας δὲ Ισραηλ τὴν <mark>χεῖρα</mark> τὴν δεξιὰν <mark>ἐπέβαλεν ἐπὶ τὴν κεφαλὴν</mark></em></strong><em> </em><strong><em>Εφραιμ</em></strong><em> — οὗτος δὲ ἦν ὁ νεώτερος — καὶ </em><strong><em>τὴν ἀριστερὰν ἐπὶ τὴν <mark>κεφαλὴν</mark> Μανασση</em></strong><em>, ἐναλλὰξ τὰς χεῖρας. καὶ </em><strong><em><mark>ηὐλόγησεν</mark></em></strong><em> αὐτοὺς καὶ εἶπεν Ὁ θεός, ᾧ εὐηρέστησαν οἱ πατέρες μου ἐναντίον αὐτοῦ Αβρααμ καὶ Ισαακ, ὁ θεὸς ὁ τρέφων με ἐκ νεότητος ἕως τῆς ἡμέρας ταύτης, ὁ </em><strong><em><mark>ἄγγελος</mark></em></strong><em> ὁ ῥυόμενός με ἐκ πάντων τῶν κακῶν </em><strong><em><mark>εὐλογήσαι τὰ παιδία ταῦτα</mark></em></strong><em>, καὶ ἐπικληθήσεται ἐν αὐτοῖς τὸ ὄνομά μου καὶ τὸ ὄνομα τῶν πατέρων μου Αβρααμ καὶ Ισαακ, καὶ πληθυνθείησαν εἰς πλῆθος πολὺ ἐπὶ τῆς γῆς.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/gen/48/#L14-16"><em>Γεν 48:14-16</em></a><em>)</em></p></blockquote><h4>Ο Μωυσής χειροτονεί τον Ιησού του Ναυή</h4><p>Ο Θεός πρόσταξε τον προφήτη Μωυσή να χειροτονήσει τον Ιησού του Ναυή με την επίθεση των χειρών:</p><blockquote><p><em>«καὶ </em><strong><em><mark>ἐλάλησεν κύριος</mark></em></strong><em> πρὸς Μωυσῆν λέγων </em><strong><em><mark>Λαβὲ</mark></em></strong><em> πρὸς σεαυτὸν τὸν </em><strong><em><mark>Ἰησοῦν υἱὸν Ναυη</mark></em></strong><em>, ἄνθρωπον, ὃς ἔχει πνεῦμα ἐν ἑαυτῷ, καὶ </em><strong><em><mark>ἐπιθήσεις τὰς χεῖράς σου ἐπ᾿ αὐτὸν</mark></em></strong><em> &lt;…&gt; καὶ ἐποίησεν Μωϋσῆς καθὰ ἐνετείλατο αὐτῷ κύριος, καὶ λαβὼν τὸν Ἰησοῦν ἔστησεν αὐτὸν ἐναντίον Ελεαζαρ τοῦ ἱερέως καὶ ἔναντι πάσης συναγωγῆς καὶ </em><strong><em><mark>ἐπέθηκεν τὰς χεῖρας αὐτοῦ ἐπ᾿ αὐτὸν</mark></em></strong><em> καὶ συνέστησεν αὐτόν, καθάπερ συνέταξεν κύριος τῷ Μωυσῇ.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/chis/27/#L18,22-23"><em>Αρ 27:18,22-23</em></a><em>)</em></p></blockquote><h4>Ο τρόπος χειροτονίας των Λευιτών</h4><p>Ο Θεός πρόσταξε να χειροτονούνται οι Λευίτες για τη διακονία στον ναό με την επίθεση των χειρών:</p><blockquote><p><em>«καὶ προσάξεις τοὺς Λευίτας ἔναντι κυρίου, καὶ </em><strong><em><mark>ἐπιθήσουσιν</mark></em></strong><em> οἱ υἱοὶ Ισραηλ </em><strong><em><mark>τὰς χεῖρας</mark></em></strong><em> αὐτῶν </em><strong><em><mark>ἐπὶ τοὺς Λευίτας</mark></em></strong><em>» (</em><a href="https://bibleox.com/el/gr-lxx-byz/chis/8/#L10"><em>Αρ 8:10</em></a><em>)</em></p></blockquote><h2>Κριτική</h2><h3>Ο Θεός δεν κατοικεί σε χειροποίητους ναούς</h3><p>Όσοι επικρίνουν την Εκκλησία και αντιτίθενται στους ναούς φέρνουν ως επιχείρημα το χωρίο:</p><blockquote><p>«ὃς εὗρεν χάριν ἐνώπιον τοῦ θεοῦ καὶ ᾐτήσατο εὑρεῖν σκήνωμα τῷ οἴκῳ Ἰακώβ. Σολομῶν δὲ οἰκοδόμησεν αὐτῷ οἶκον. <strong>ἀλλ᾿ οὐχ ὁ ὕψιστος ἐν χειροποιήτοις κατοικεῖ</strong>· καθὼς ὁ προφήτης λέγει, Ὁ οὐρανός μοι θρόνος, ἡ δὲ γῆ ὑποπόδιον τῶν ποδῶν μου· ποῖον οἶκον οἰκοδομήσετέ μοι, λέγει κύριος, ἢ τίς τόπος τῆς καταπαύσεώς μου;» (<a href="https://bibleox.com/el/gr-lxx-byz/act/7/#L46-49">Πραξ 7:46-49</a>)</p></blockquote><p>Ωστόσο, αυτό δεν αποτελεί σε καμία περίπτωση μαρτυρία εναντίον των ναών, διότι εκείνη την εποχή, όταν ο Δαβίδ θέλησε να οικοδομήσει οίκο (ναό) στον Θεό, ο ίδιος ο Θεός είχε ήδη προστάξει τον προφήτη Μωυσή να κατασκευάσει τη Σκηνή, να την αγιάσει, να τοποθετήσει εκεί ιερείς, να τηρεί τελετές, να έχει ιερά (την Κιβωτό) και είχε ορίσει θανατικές ποινές για την παραβίαση των θεσπισμένων από τον Θεό τάξεων. Αυτό το χωρίο εξηγεί μόνο ότι ο Θεός είναι παντού και όχι μόνο στον ναό. Παράλληλα, οι ναοί είναι θέσπισμα του ίδιου του Θεού και όχι του ανθρώπου, και πολύ περισσότερο δεν είναι κάτι που δήθεν δανείστηκε από τους ειδωλολάτρες.</p><h2>Σημείωση</h2><h3>Η αντίσταση και η έπαρση απέναντι στα ιερά είναι ένα από τα σημεία του αντίχριστου</h3><blockquote><p>«μή τις ὑμᾶς ἐξαπατήσῃ κατὰ μηδένα τρόπον· ὅτι ἐὰν μὴ ἔλθῃ ἡ ἀποστασία πρῶτον καὶ ἀποκαλυφθῇ <strong><mark>ὁ ἄνθρωπος τῆς ἀνομίας</mark></strong>, ὁ υἱὸς τῆς ἀπωλείας, <strong><mark>ὁ ἀντικείμενος καὶ ὑπεραιρόμενος</mark></strong> ἐπὶ πάντα <strong><mark>λεγόμενον</mark></strong> <strong>θεὸν</strong> ἢ <strong><mark>σέβασμα</mark></strong>, ὥστε αὐτὸν εἰς τὸν ναὸν τοῦ θεοῦ καθίσαι, ἀποδεικνύντα ἑαυτὸν ὅτι ἔστιν θεός.» (<a href="https://bibleox.com/el/gr-lxx-byz/2sol/2/#L3-4">Β Θεσ 2:3-4</a>)</p></blockquote><blockquote><p>«Παιδία, ἐσχάτη ὥρα ἐστίν, καὶ καθὼς ἠκούσατε ὅτι ἀντίχριστος ἔρχεται, καὶ νῦν <strong><mark>ἀντίχριστοι πολλοὶ γεγόνασιν</mark></strong>· ὅθεν γινώσκομεν ὅτι ἐσχάτη ὥρα ἐστίν.» (<a href="https://bibleox.com/el/gr-lxx-byz/1in/2/#L18">Α Ιω 2:18</a>)</p></blockquote><h3>Το θηρίο θα βλασφημήσει εκείνους που κατοικούν στον ουρανό</h3><blockquote><p>«καὶ ἤνοιξεν τὸ στόμα αὐτοῦ εἰς βλασφημίας πρὸς τὸν θεόν, <strong><mark>βλασφημῆσαι</mark></strong> τὸ ὄνομα αὐτοῦ καὶ τὴν σκηνὴν αὐτοῦ, <strong><mark>τοὺς ἐν τῷ οὐρανῷ σκηνοῦντας</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/13/#L6">Απ 13:6</a>)</p></blockquote><h3>Στον ουρανό ζουν οι ψυχές των δικαίων και οι άγγελοι</h3><blockquote><p>«ἀλλὰ <strong><mark>προσεληλύθατε</mark></strong> Σιὼν ὄρει καὶ πόλει θεοῦ ζῶντος, <strong><mark>Ἰερουσαλὴμ ἐπουρανίῳ</mark>, καὶ μυριάσιν <mark>ἀγγέλων</mark></strong>, πανηγύρει καὶ <strong>ἐκκλησίᾳ πρωτοτόκων ἀπογεγραμμένων ἐν οὐρανοῖς</strong>, καὶ κριτῇ θεῷ πάντων, <strong>καὶ <mark>πνεύμασι δικαίων</mark> τετελειωμένων</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/12/#L22-23">Εβρ 12:22-23</a>)</p></blockquote>'
