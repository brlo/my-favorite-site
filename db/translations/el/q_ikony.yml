  update: true
  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: '<p>Οι ορθόδοξοι χριστιανοί κατηγορούνται για ειδωλολατρία, επειδή αποκαλούν τις εικόνες είδωλα και την τιμή των εικόνων ειδωλολατρία. Το άρθρο εξετάζει τις κατηγορίες, αναλύοντας το θέμα της τιμής των εικόνων με βάση την Αγία Γραφή.</p><p>Πρώτα θα δώσουμε μια σύντομη απάντηση, έπειτα θα εξετάσουμε κάπως πιο αναλυτικά την κριτική, και στο τέλος θα δώσουμε την πληρέστερη απάντηση με ανάλυση της Γραφής.</p><h2>Η συντομότερη υπεράσπιση της τιμής των εικόνων</h2><p>Στους χρόνους πριν από τη σάρκωση του Θεού, όταν έθετε τον νόμο για τον παλαιοδιαθηκικό Ισραήλ, ο Θεός δεν φανέρωσε δικές Του εικόνες, και απαγόρευσε να φτιάχνουν εικόνες ψευδών θεών (ειδώλων) και να τις τιμούν (<a href="https://bibleox.com/el/gr-lxx-byz/ish/20/#L4-5">Έξ 20:4-5</a> · <a href="https://bibleox.com/el/gr-lxx-byz/vtor/5/#L8-9">Δτ 5:8-9</a> · <a href="https://bibleox.com/el/gr-lxx-byz/vtor/4/#L15-19">Δτ 4:15-19</a>), όμως τους δικούς Του αγίους λειτουργούς ο Θεός πρόσταξε να τους απεικονίζουν (<a href="https://bibleox.com/el/gr-lxx-byz/ish/25/#L1">Έξ 25:1</a> · <a href="https://bibleox.com/el/gr-lxx-byz/ish/26/#L1">Έξ 26:1</a> · <a href="https://bibleox.com/el/gr-lxx-byz/ish/25/#L18-20">Έξ 25:18-20</a>), και οι προφήτες προσκυνούσαν μπροστά στα ιερά αντικείμενα με τις εικόνες (<a href="https://bibleox.com/el/gr-lxx-byz/nav/7/#L6">Ιησ 7:6</a> · <a href="https://bibleox.com/el/gr-lxx-byz/ps/5/#L7">Ψλ 5:7</a>). Οι ορθόδοξοι έχουν ακριβώς την ίδια στάση απέναντι στην τιμή των ιερών με εικόνες όπως οι προφήτες.</p><p>Εξάλλου, κατά τη βουλή του Θεού, ο ίδιος ο ναός είναι εικόνα του ουρανού (<a href="https://bibleox.com/el/gr-lxx-byz/ish/25/#L8-9,40">Έξ 25:8-9,40</a> · <a href="https://bibleox.com/el/gr-lxx-byz/evr/9/#L24">Εβρ 9:24</a> · <a href="https://bibleox.com/el/gr-lxx-byz/act/7/#L44">Πραξ 7:44</a>). Ο Θεός πρόσταξε να τιμούν τον ναό (<a href="https://bibleox.com/el/gr-lxx-byz/lev/19/#L30">Λευ 19:30</a> · <a href="https://bibleox.com/el/gr-lxx-byz/lev/26/#L2">Λευ 26:2</a>), τον ναό τον τιμούσαν, μπροστά του προσκυνούσαν (<a href="https://bibleox.com/el/gr-lxx-byz/ps/5/#L7">Ψλ 5:7</a> · <a href="https://bibleox.com/el/gr-lxx-byz/ps/98/#L5">Ψλ 98:5</a> · <a href="https://bibleox.com/el/gr-lxx-byz/ps/131/#L7">Ψλ 131:7</a>). Αυτή είναι η ορθόδοξη τιμή: τιμώντας την εικόνα, τιμούμε το πρωτότυπο.</p><p>Κάθε δικαιολογία που θα ήθελε κανείς να εφαρμόσει στην προφητική τιμή των ιερών με εικόνες, εφαρμόζεται και στην ορθόδοξη τιμή (γιατί είναι το ίδιο πράγμα), όπως και κάθε καταδίκη που θα ήθελε κανείς να στρέψει κατά της ορθόδοξης τιμής, στρέφεται και κατά της προφητικής τιμής.</p><p>Το ζήτημα δεν είναι καθόλου οι εικόνες και η τιμή τους. Επειδή είδωλο είναι κάθε ψευδής αντίληψη για τον Θεό, το ζήτημα είναι ποια σχέση με την αλήθεια έχει 1) η ίδια η εικόνα και 2) το νοηματικό περιεχόμενο που της δίνει εκείνος που τη τιμά. Αν έστω και ένα από τα δύο είναι κατ’ αρχήν ψευδές, τότε πρόκειται για ειδωλολατρία[1], που απομακρύνει τον άνθρωπο από την αλήθεια. Ακριβώς αυτό είναι το πρόβλημα: το είδωλο δεν οδηγεί στον Θεό, η ψευδής αντίληψη για τον Θεό δεν οδηγεί στον αληθινό Θεό, αφού το ψέμα δεν οδηγεί στην αλήθεια, αλλά απομακρύνει απ’ αυτήν[2].</p><p>Ας ελέγξουμε σύντομα αυτόν τον ισχυρισμό σε διάλογο με τον αντίπαλο της τιμής των εικόνων:</p><p><strong>Ο αντίπαλος των εικόνων</strong>: οι προσκυνήσεις μπροστά σε αντικείμενα είναι ειδωλολατρία.</p><p><strong>Ο ορθόδοξος</strong>: δηλαδή οι προφήτες του Θεού, προσκυνώντας μπροστά στον ναό και στην κιβωτό με τις εικόνες, έγιναν ειδωλολάτρες;</p><p><strong>Ο αντίπαλος</strong>: ο Θεός είπε μόνο να απεικονίζουμε, αλλά δεν είπε να τιμούμε ή να προσκυνούμε.</p><p><strong>Ο ορθόδοξος</strong>: δηλαδή οι προφήτες έκαναν αυτό που δεν έπρεπε, που δεν είναι γραμμένο, που δεν προστάχθηκε, δηλαδή έπεσαν σε ειδωλολατρία;</p><p><strong>Ο αντίπαλος</strong>: οι προφήτες δεν προσκυνούσαν τον ίδιο τον ναό ή την κιβωτό, αλλά απέδιδαν αυτή την προσκύνηση στον Θεό.</p><p><strong>Ο ορθόδοξος</strong>: ακριβώς. Και οι ορθόδοξοι δεν προσκυνούν το ξύλο και τα χρώματα, αλλά το πρόσωπο που απεικονίζεται, όπως λέει η διδασκαλία: διά της εικόνας τιμούμε το πρωτότυπο, όπως και οι προφήτες. Δεν υπάρχει καμία διαφορά.</p><p>Και τα λοιπά. Αυτός ο κανόνας θα λειτουργεί πάντα, γιατί ανάμεσα στην προφητική και την ορθόδοξη τιμή δεν υπάρχει καμία διαφορά. Τώρα ας εξετάσουμε το ζήτημα πιο αναλυτικά.</p><h2>Οι αντίπαλοι των εικόνων λένε: «Ο λόγος του Θεού λέει καθαρά: μην κάνεις εικόνες, και εσείς κάνετε»</h2><p><strong>Απάντηση</strong>: πρόκειται για παλαιοδιαθηκική απαγόρευση από τον νόμο του Μωυσή, που αφορά την απεικόνιση μόνο του Θεού, όπως φαίνεται από το πλαίσιο:</p><ul><li><p>οι πρώτες 4 εντολές αφορούν ακριβώς <strong>τον Θεό</strong> (<a href="https://bibleox.com/el/gr-lxx-byz/ish/20/#L4-5">Έξ 20:4-5</a> · <a href="https://bibleox.com/el/gr-lxx-byz/vtor/5/#L8-9">Δτ 5:8-9</a>),</p></li><li><p>θέτοντας την απαγόρευση, ο Θεός δηλώνει την αιτία της, ότι δηλαδή κατά τη θέσπιση του Νόμου ο Θεός δεν φανέρωσε ακριβώς <strong>τη δική Του εικόνα</strong> (<a href="https://bibleox.com/el/gr-lxx-byz/vtor/4/#L15-19">Δτ 4:15-19</a>): αφού δεν είδατε τον Θεό, μην Τον απεικονίζετε.</p></li></ul><p>Έτσι, η απαγόρευση αφορά τις εικόνες ακριβώς του Θεού· τους δικούς Του αγίους λειτουργούς ο Θεός όχι μόνο δεν απαγόρευσε, αλλά πρόσταξε να τους απεικονίζουν (<a href="https://bibleox.com/el/gr-lxx-byz/ish/25/#L1">Έξ 25:1</a> · <a href="https://bibleox.com/el/gr-lxx-byz/ish/26/#L1">Έξ 26:1</a>), και οι δίκαιοι προσκυνούσαν τον ναό και τα ιερά με αυτές τις εικόνες (<a href="https://bibleox.com/el/gr-lxx-byz/nav/7/#L6">Ιησ 7:6</a> · <a href="https://bibleox.com/el/gr-lxx-byz/ps/5/#L7">Ψλ 5:7</a> · <a href="https://bibleox.com/el/gr-lxx-byz/ps/98/#L5">Ψλ 98:5</a> · <a href="https://bibleox.com/el/gr-lxx-byz/ps/131/#L7">Ψλ 131:7</a>).</p><p>Η παλαιοδιαθηκική εκκλησία είχε εικόνες και τις τιμούσε. Πρώτα απ’ όλα, <strong>ο ίδιος ο παλαιοδιαθηκικός ναός είναι εικόνα</strong>. Αυτός, ως επίγειος χώρος, κατά την αρχική βουλή του Θεού έπρεπε να γίνει απεικόνιση όσων γίνονται στον ουρανό. Ο Θεός πρόσταξε τον προφήτη Μωυσή να κατασκευάσει τον ναό όχι επειδή είχε ανάγκη από ναό (ο Θεός δεν είχε ανάγκη <a href="https://bibleox.com/el/gr-lxx-byz/is/66/#L1">Ησ 66:1</a> · <a href="https://bibleox.com/el/gr-lxx-byz/ps/49/#L13">Ψλ 49:13</a> · <a href="https://bibleox.com/el/gr-lxx-byz/is/1/#L11">Ησ 1:11</a>), αλλά πρόσταξε να φτιάξουν τον ναό ακριβώς ως εικόνα του ουρανού, ως απεικόνιση της ουράνιας πραγματικότητας που δείχθηκε στον προφήτη (<a href="https://bibleox.com/el/gr-lxx-byz/ish/25/#L8-9,40">Έξ 25:8-9,40</a> · <a href="https://bibleox.com/el/gr-lxx-byz/evr/9/#L24">Εβρ 9:24</a> · <a href="https://bibleox.com/el/gr-lxx-byz/act/7/#L44">Πραξ 7:44</a>). Ο Θεός προστάζει να τιμούν αυτή την εικόνα (<a href="https://bibleox.com/el/gr-lxx-byz/lev/19/#L30">Λευ 19:30</a> · <a href="https://bibleox.com/el/gr-lxx-byz/lev/26/#L2">Λευ 26:2</a>). Ο προφήτης Δαβίδ την προσκυνά (<a href="https://bibleox.com/el/gr-lxx-byz/ps/5/#L7">Ψλ 5:7</a> · <a href="https://bibleox.com/el/gr-lxx-byz/ps/98/#L5">Ψλ 98:5</a> · <a href="https://bibleox.com/el/gr-lxx-byz/ps/131/#L7">Ψλ 131:7</a>). Όταν οι ασεβείς βασιλείς τοποθετούσαν στον ναό ειδωλολατρικά είδωλα (<a href="https://bibleox.com/el/gr-lxx-byz/4ts/21/#L3-7">Δ Βασ 21:3-7</a>), δηλαδή κατέστρεφαν την εικόνα της ουράνιας πραγματικότητας, τότε ο Θεός απέρριπτε τον ναό (<a href="https://bibleox.com/el/gr-lxx-byz/4ts/23/#L27">Δ Βασ 23:27</a>).</p><p>Ακριβώς επειδή ο ναός είναι εικόνα του ουρανού, στην Καινή Διαθήκη υφίσταται αλλαγές (εσωτερική διάταξη, εικόνες), αφού αλλάζει και η ουράνια πραγματικότητα. Στην Παλαιά Διαθήκη, στην ουράνια πραγματικότητα παρέμεναν πνευματικά ορατοί <strong>μόνο οι άγγελοι</strong>. Ο Θεός ήταν εντελώς αόρατος και άυλος, και οι άνθρωποι δεν έφταναν ακόμη στη ζωή στον ουρανό (περισσότερα).</p><p>Στην Καινή Διαθήκη, ή μάλλον με την έλευση του Κυρίου Ιησού Χριστού, έγιναν μεγάλες αλλαγές:</p><ol><li><p><strong>Ο Θεός έγινε ορατός</strong> κατά την ανθρωπότητα (<a href="https://bibleox.com/el/gr-lxx-byz/in/1/#L18">Ιω 1:18</a> · <a href="https://bibleox.com/el/gr-lxx-byz/1in/1/#L1-2">Α Ιω 1:1-2</a>).</p></li><li><p><strong>Ο Θεός βασίλεψε στον ουρανό ορατά</strong> (<a href="https://bibleox.com/el/gr-lxx-byz/ef/1/#L20-21">Εφ 1:20-21</a> · <a href="https://bibleox.com/el/gr-lxx-byz/otkr/3/#L21">Απ 3:21</a>).</p></li><li><p><strong>Στον ουρανό εμφανίστηκαν άνθρωποι,</strong> αφού έλαβαν τη δυνατότητα να φτάσουν στη ζωή με τον Κύριο Ιησού Χριστό (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/6/#L9-11">Απ 6:9-11</a> · <a href="https://bibleox.com/el/gr-lxx-byz/otkr/14/#L1,3-5">Απ 14:1,3-5</a>).</p></li><li><p><strong>Ο Θεός συνάπτει την Καινή Διαθήκη </strong>(<a href="https://bibleox.com/el/gr-lxx-byz/ier/31/#L31">Ιερ 31:31</a> · <a href="https://bibleox.com/el/gr-lxx-byz/evr/8/#L8">Εβρ 8:8</a> · <a href="https://bibleox.com/el/gr-lxx-byz/lk/22/#L20">Λκ 22:20</a> · <a href="https://bibleox.com/el/gr-lxx-byz/1kor/11/#L25">Α Κορ 11:25</a>)<strong>. Η Παλαιά Διαθήκη τελείωσε μαζί με τον νόμο του Μωυσή</strong> (<a href="https://bibleox.com/el/gr-lxx-byz/rim/7/#L6">Ρωμ 7:6</a> · <a href="https://bibleox.com/el/gr-lxx-byz/gal/3/#L21-25">Γαλ 3:21-25</a> · <a href="https://bibleox.com/el/gr-lxx-byz/ef/2/#L14-16">Εφ 2:14-16</a>). Η απαγόρευση της απεικόνισης του Θεού χάνει την ισχύ της, αφού ήταν μέρος του νόμου του Μωυσή, ο οποίος με την έλευση του Χριστού καταργήθηκε (<a href="https://bibleox.com/el/el/w/%CE%97_%CE%BA%CE%B1%CF%84%CE%AC%CF%81%CE%B3%CE%B7%CF%83%CE%B7_%CF%84%CE%BF%CF%85_%CE%9D%CF%8C%CE%BC%CE%BF%CF%85_%CF%84%CE%BF%CF%85_%CE%9C%CF%89%CF%85%CF%83%CE%AE">περισσότερα</a>).</p></li></ol><p>Έτσι, ο παλαιοδιαθηκικός ναός ήταν απεικόνιση της παλαιοδιαθηκικής ουράνιας πραγματικότητας, η οποία στην Καινή Διαθήκη άλλαξε. Η παλιά δεν υπάρχει πια. Και αφού ο ναός ήταν από την αρχή, κατά τη βουλή του Θεού, απεικόνιση της ουράνιας πραγματικότητας, μετά την αλλαγή της δεν έχει πια νόημα να απεικονίζουμε το παλιό. Γι’ αυτό οι χριστιανοί από την αρχαιότητα απεικονίζουν τη νέα ουράνια πραγματικότητα, βάζοντας στο κέντρο την εικόνα του Ιησού Χριστού (του Θεού) που βασίλεψε φανερά στον ουρανό, και γύρω — τις εικόνες των αγίων λειτουργών Του: τώρα πια όχι μόνο αγγέλων, αλλά και ανθρώπων.</p><p>Χαρακτηριστικό γεγονός είναι η βλάβη του ναού στα Ιεροσόλυμα μετά τη θυσία του Χριστού:</p><blockquote><p>«<strong>Καὶ ἰδοὺ τὸ καταπέτασμα τοῦ ναοῦ ἐσχίσθη ἀπ᾿ ἄνωθεν ἕως κάτω εἰς δύο, καὶ ἡ γῆ ἐσείσθη, καὶ αἱ πέτραι ἐσχίσθησαν</strong>, καὶ τὰ μνημεῖα ἀνεῴχθησαν καὶ <strong>πολλὰ σώματα τῶν κεκοιμημένων ἁγίων ἠγέρθησαν, καὶ ἐξελθόντες ἐκ τῶν μνημείων μετὰ τὴν ἔγερσιν αὐτοῦ</strong> εἰσῆλθον εἰς τὴν ἁγίαν πόλιν καὶ ἐνεφανίσθησαν πολλοῖς.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/27/#L51-53">Μτ 27:51-53</a>)</p></blockquote><p>Και στη δεκαετία του 70 ο ναός καταστρέφεται εντελώς από τους Ρωμαίους, παραχωρώντας για όλες τις επόμενες χιλιετίες τη θέση του στη νέα εικόνα της ουράνιας πραγματικότητας — τον ορθόδοξο ναό.</p><img src="https://res.bibleox.com/s/img/image/simple/686bea5b5f47da2505d3ae31/s_p_pjRHeoFaUpKPoyEH.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686bea5b5f47da2505d3ae31/m_p_pjRHeoFaUpKPoyEH.jpg">μεγέθυνση</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686cf7375f47da2505d3ae4f/m_p_MOsOWI2vEXUj5ELf.jpg">εκδοχή 2</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686d23425f47da2505d3ae55/s_p_LzqgbhnIsbqtghoc.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d23425f47da2505d3ae55/m_p_LzqgbhnIsbqtghoc.jpg">μεγέθυνση</a>]</p><p>Περισσότερες αρχαίες εικόνες εδώ: <a href="https://bibleox.com/el/el/w/Ik1c_%CE%A3%CF%85%CE%BB%CE%BB%CE%BF%CE%B3%CE%AE_%CE%B1%CF%81%CF%87%CE%B1%CE%AF%CF%89%CE%BD_%CE%B5%CE%B9%CE%BA%CF%8C%CE%BD%CF%89%CE%BD">Συλλογή αρχαίων εικόνων</a></p><p>Δεν έχει ξεπεραστεί μόνο η παλαιοδιαθηκική εικόνα της ουράνιας πραγματικότητας, αλλά και η ίδια η Παλαιά Διαθήκη, αναπόσπαστο μέρος της οποίας ήταν ο νόμος του Μωυσή, που τώρα έχασε τη σημασία του. Εκτός από την απαγόρευση της απεικόνισης του Θεού υπάρχουν και πολλές άλλες διατάξεις που στην Καινή Διαθήκη δεν ισχύουν πια:</p><blockquote><p>«<strong>ὀνομάζων</strong> δὲ <strong>τὸ ὄνομα κυρίου</strong> <strong>θανάτῳ θανατούσθω</strong>· λίθοις λιθοβολείτω αὐτὸν πᾶσα συναγωγὴ Ισραηλ· ἐάν τε προσήλυτος ἐάν τε αὐτόχθων, ἐν τῷ ὀνομάσαι αὐτὸν τὸ ὄνομα κυρίου <strong>τελευτάτω</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/lev/24/#L16">Λευ 24:16</a>)</p></blockquote><p>Η βλασφημία κατά του ονόματος του Θεού είναι αμαρτία κατά της <strong>3ης εντολής</strong>. Η ποινή κατά τον νόμο του Μωυσή — θάνατος (<a href="https://bibleox.com/el/gr-lxx-byz/lev/24/#L16">Λευ 24:16</a>). Απ’ όσο γνωρίζουμε, οι αντίπαλοι των εικόνων δεν διδάσκουν να σκοτώνουν ανθρώπους για βλασφημία κατά του Θεού. Απαιτούν να τηρείται η παλαιοδιαθηκική απαγόρευση της απεικόνισης του Θεού, δείχνοντας το χωρίο με τα λόγια «αυτό είναι ο λόγος του Θεού», αλλά και η εντολή για θανάτωση των βλασφήμων είναι επίσης λόγος του Θεού, γραμμένος επίσης καθαρά, και όμως δεν το κάνουν. Γιατί; Επειδή ο νόμος του Μωυσή έχει καταργηθεί.</p><p>Η <strong>4η εντολή</strong> θεσπίζει την ανάπαυση του Σαββάτου — την αποχή από τα έργα (<a href="https://bibleox.com/el/gr-lxx-byz/ish/20/#L8-10">Έξ 20:8-10</a> · <a href="https://bibleox.com/el/gr-lxx-byz/vtor/5/#L12-15">Δτ 5:12-15</a> · <a href="https://bibleox.com/el/gr-lxx-byz/lev/19/#L3">Λευ 19:3</a> · <a href="https://bibleox.com/el/gr-lxx-byz/lev/19/#L30">Λευ 19:30</a>). Η ποινή κατά τον νόμο του Μωυσή — θάνατος. Είναι κι αυτό λόγος του Θεού, γραμμένος επίσης καθαρά, αλλά οι αντίπαλοι των εικόνων δεν διδάσκουν να σκοτώνουν για την παράβαση της ανάπαυσης του Σαββάτου, και οι περισσότεροι απ’ αυτούς δεν τηρούν ούτε την ίδια την ανάπαυση του Σαββάτου. Γιατί; Επειδή ο νόμος του Μωυσή έχει καταργηθεί.</p><p>Έτσι, το να απαγορεύει κανείς την απεικόνιση του Θεού που σαρκώθηκε σημαίνει:</p><ol><li><p><strong>να ιουδαΐζει</strong>: να συνεχίζει να ζει κατά τον νόμο του Μωυσή (παρεμπιπτόντως, για τον ίδιο λόγο μαζεύουν και το δέκατο)·</p></li><li><p><strong>να αρνείται έμμεσα τη σάρκωση του Θεού</strong>: είτε να αρνείται ότι ο Χριστός είναι Θεός, είτε να αρνείται ότι είναι ορατός.</p></li></ol><p>Τώρα ας εξετάσουμε το ζήτημα ακόμη πιο αναλυτικά.</p><h2>Η 2η εντολή του νόμου του Μωυσή</h2><p>Οι αντίπαλοι των εικόνων θεωρούν τις εικόνες παράβαση της δεύτερης εντολής του <a href="https://bibleox.com/el/el/w/%CE%9F%CE%B9_%CE%94%CE%AD%CE%BA%CE%B1_%CE%95%CE%BD%CF%84%CE%BF%CE%BB%CE%AD%CF%82">νόμου του Μωυσή</a>:</p><blockquote><ol start="2"><li><p>«<strong>οὐ ποιήσεις σεαυτῷ εἴδωλον οὐδὲ παντὸς ὁμοίωμα</strong>, ὅσα ἐν τῷ οὐρανῷ ἄνω καὶ ὅσα ἐν τῇ γῇ κάτω καὶ ὅσα ἐν τοῖς ὕδασιν ὑποκάτω τῆς γῆς. <strong>οὐ προσκυνήσεις αὐτοῖς</strong> οὐδὲ μὴ λατρεύσῃς αὐτοῖς· ἐγὼ γάρ εἰμι κύριος ὁ θεός σου, θεὸς ζηλωτὴς ἀποδιδοὺς ἁμαρτίας πατέρων ἐπὶ τέκνα ἕως τρίτης καὶ τετάρτης γενεᾶς τοῖς μισοῦσίν με» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/20/#L4-5">Έξ 20:4-5</a> · <a href="https://bibleox.com/el/gr-lxx-byz/vtor/5/#L8-9">Δτ 5:8-9</a>)</p></li></ol></blockquote><p>Οι 10 εντολές του Μωυσή χωρίζονται σε 2 μέρη (δύο πλάκες):</p><ul><li><p>Τέσσερις εντολές για την αγάπη προς τον Θεό·</p></li><li><p>Έξι εντολές για την αγάπη προς τον πλησίον.</p></li></ul><p>Η 2η εντολή αναφέρεται στην εκδήλωση της αγάπης προς τον Θεό και δεν απαγορεύει γενικά οποιεσδήποτε εικόνες και προσκυνήσεις, αλλά απαγορεύει την κατασκευή αντικειμένων για να τα τιμούν ως θεούς αντί του μοναδικού αληθινού Θεού. Με άλλα λόγια, <strong>αυτή</strong> <strong>η εντολή απαγορεύει την προσκύνηση <u>ψευδών</u> <u>θεών</u></strong>. Ακριβώς γι’ αυτό βλέπουμε στη Γραφή και εικόνες και προσκυνήσεις που δεν αντιβαίνουν σ’ αυτή την εντολή. Περί αυτού στη συνέχεια.</p><h3>«Μην κάνεις εικόνες»</h3><h4>Ο Θεός προστάζει να γίνουν εικόνες στον ναό Του</h4><p>Αν και οι εικόνες απαγορεύονται από τη 2η εντολή, ο ίδιος ο Θεός που έδωσε αυτή την εντολή προστάζει τώρα να γίνουν στον ναό Του (τη Σκηνή) εικόνες χερουβίμ στους τοίχους της Σκηνής, στο καταπέτασμα που οδηγεί στα Άγια των Αγίων, και να γίνουν χρυσά αγάλματα χερουβίμ στο σκέπασμα της Κιβωτού της Διαθήκης:</p><blockquote><p>«Καὶ <strong>ἐλάλησεν κύριος</strong> πρὸς Μωυσῆν λέγων &lt;…&gt; Καὶ <strong>τὴν σκηνὴν ποιήσεις <mark>δέκα αὐλαίας</mark></strong> ἐκ βύσσου κεκλωσμένης καὶ ὑακίνθου καὶ πορφύρας καὶ κοκκίνου κεκλωσμένου· <strong>χερουβιμ ἐργασίᾳ ὑφάντου ποιήσεις αὐτάς</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/25/#L1">Έξ 25:1</a> · <a href="https://bibleox.com/el/gr-lxx-byz/ish/26/#L1">Έξ 26:1</a>)</p></blockquote><blockquote><p>«καὶ <strong>ποιήσεις <mark>καταπέτασμα</mark></strong> ἐξ ὑακίνθου καὶ πορφύρας καὶ κοκκίνου κεκλωσμένου καὶ βύσσου νενησμένης· <strong>ἔργον ὑφαντὸν ποιήσεις αὐτὸ χερουβιμ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/26/#L31">Έξ 26:31</a>)</p></blockquote><blockquote><p>«καὶ <strong>ποιήσεις δύο χερουβιμ</strong> χρυσᾶ τορευτὰ καὶ ἐπιθήσεις αὐτὰ <strong>ἐξ ἀμφοτέρων τῶν <mark>κλιτῶν τοῦ ἱλαστηρίου</mark></strong>·» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/25/#L18">Έξ 25:18</a>)</p></blockquote><p>Στον μεταγενέστερο ναό, που έκτισε ο Σολομών, υπήρχαν ακόμη περισσότερες εικόνες και αγάλματα:</p><blockquote><p>«καὶ ἐποίησεν τὸ <strong><mark>καταπέτασμα</mark></strong> ἐξ ὑακίνθου καὶ πορφύρας καὶ κοκκίνου καὶ βύσσου καὶ <strong>ὕφανεν ἐν αὐτῷ χερουβιν</strong>. —» (<a href="https://bibleox.com/el/gr-lxx-byz/2par/3/#L14">Β Παρ 3:14</a>)</p></blockquote><blockquote><p>«καὶ ἐποίησεν <strong><mark>ἐν τῷ οἴκῳ τῷ ἁγίῳ τῶν ἁγίων</mark></strong> <strong>χερουβιν δύο</strong> ἔργον ἐκ ξύλων καὶ ἐχρύσωσεν αὐτὰ χρυσίῳ.» (<a href="https://bibleox.com/el/gr-lxx-byz/2par/3/#L10">Β Παρ 3:10</a>)</p></blockquote><blockquote><p>«Καὶ <strong>ἐποίησεν ἐν τῷ <mark>δαβιρ</mark></strong> <strong>δύο χερουβιν</strong> δέκα πήχεων μέγεθος ἐσταθμωμένον.» (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/6/#L23">Γ Βασ 6:23</a>)</p></blockquote><p>Η λεπτομερής διάταξη του ναού: <a href="https://bibleox.com/el/el/w/%CE%9F_%CE%BD%CE%B1%CF%8C%CF%82_%CF%84%CE%B7%CF%82_%CE%99%CE%B5%CF%81%CE%BF%CF%85%CF%83%CE%B1%CE%BB%CE%AE%CE%BC">Ο ναός της Ιερουσαλήμ</a></p><p>Για την κατασκευή των σκευών του ναού ο Θεός έδωσε στους τεχνίτες το δώρο του Αγίου Πνεύματος:</p><blockquote><p>«Καὶ ἐλάλησεν κύριος πρὸς Μωυσῆν λέγων Ἰδοὺ ἀνακέκλημαι ἐξ ὀνόματος τὸν Βεσελεηλ τὸν τοῦ Ουριου τὸν Ωρ τῆς φυλῆς Ιουδα καὶ <strong>ἐνέπλησα αὐτὸν πνεῦμα θεῖον σοφίας καὶ συνέσεως καὶ ἐπιστήμης ἐν παντὶ ἔργῳ</strong> διανοεῖσθαι καὶ ἀρχιτεκτονῆσαι ἐργάζεσθαι τὸ χρυσίον καὶ τὸ ἀργύριον καὶ τὸν χαλκὸν καὶ τὴν ὑάκινθον καὶ τὴν πορφύραν καὶ τὸ κόκκινον τὸ νηστὸν καὶ τὴν βύσσον τὴν κεκλωσμένην καὶ τὰ λιθουργικὰ καὶ εἰς τὰ ἔργα τὰ τεκτονικὰ τῶν ξύλων ἐργάζεσθαι κατὰ πάντα τὰ ἔργα.» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/31/#L1-5">Έξ 31:1-5</a>)</p></blockquote><h4>Ο Θεός πρόσταξε να κατασκευάσουν εικόνα του φιδιού</h4><p>Ο Θεός επίσης προστάζει να κατασκευάσουν το χάλκινο φίδι, ώστε όσοι το κοιτούσαν να σώζονται θαυματουργικά από τα δαγκώματα των φιδιών:</p><blockquote><p>«καὶ εἶπεν κύριος πρὸς Μωυσῆν <strong>Ποίησον σεαυτῷ ὄφιν</strong> καὶ θὲς αὐτὸν ἐπὶ σημείου, καὶ ἔσται ἐὰν δάκῃ ὄφις ἄνθρωπον, πᾶς ὁ δεδηγμένος ἰδὼν αὐτὸν ζήσεται.» (<a href="https://bibleox.com/el/gr-lxx-byz/chis/21/#L8">Αρ 21:8</a>)</p></blockquote><p>Είναι πολύ σημαντικό ότι αυτό το φίδι ήταν εικόνα του Ιησού Χριστού και έπρεπε να δείχνει τα μελλοντικά Του πάθη στον Σταυρό:</p><blockquote><p>«καὶ <strong>καθὼς Μωϋσῆς ὕψωσεν τὸν ὄφιν ἐν τῇ ἐρήμῳ, οὕτως ὑψωθῆναι δεῖ τὸν υἱὸν τοῦ ἀνθρώπου</strong>, ἵνα πᾶς ὁ πιστεύων ἐν αὐτῷ ἔχῃ ζωὴν αἰώνιον.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/3/#L14-15">Ιω 3:14-15</a>)</p></blockquote><p>Αυτό το φίδι αργότερα κατέστρεψε ο βασιλιάς Εζεκίας, όταν οι Ισραηλίτες άρχισαν να θεωρούν θεό το ίδιο το φίδι, δίνοντάς του δικό του ψευδές όνομα (Νεεσθάν), που δεν έχει καμία σχέση με τον αληθινό Θεό. Εγκατέλειψαν τον αληθινό Θεό, παραβαίνοντας τη δεύτερη εντολή:</p><blockquote><p>«αὐτὸς ἐξῆρεν τὰ ὑψηλὰ καὶ συνέτριψεν πάσας τὰς στήλας καὶ ἐξωλέθρευσεν τὰ ἄλση καὶ τὸν ὄφιν τὸν χαλκοῦν, ὃν ἐποίησεν Μωϋσῆς, ὅτι ἕως τῶν ἡμερῶν ἐκείνων ἦσαν οἱ υἱοὶ Ισραηλ <strong>θυμιῶντες αὐτῷ, καὶ ἐκάλεσεν αὐτὸν <mark>Νεεσθαν</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/4ts/18/#L4">Δ Βασ 18:4</a>)</p></blockquote><h3>Μην προσκυνάς τις εικόνες</h3><p>Αν και οι προσκυνήσεις εικόνων (παραστάσεων) απαγορεύονται, οι δίκαιοι συνεχώς προσκυνούν ανθρώπους, διάφορα αντικείμενα, αγγέλους, ενώ άλλοι άνθρωποι προσκυνούν προφήτες. Κανείς δεν τους καταδικάζει για ειδωλολατρία, γιατί αυτές οι προσκυνήσεις δεν γίνονται σε ψευδείς θεούς (είδωλα).</p><h4>Προσκύνηση του Θεού με τη μορφή αγγέλων</h4><p>Ο Αβραάμ προσκυνά τον Θεό με τη μορφή τριών ανδρών:</p><blockquote><p><em>«</em><strong><em>Ὤφθη δὲ αὐτῷ ὁ θεὸς</em></strong><em> πρὸς τῇ δρυὶ τῇ Μαμβρη καθημένου αὐτοῦ ἐπὶ τῆς θύρας τῆς σκηνῆς αὐτοῦ μεσημβρίας. ἀναβλέψας δὲ τοῖς ὀφθαλμοῖς αὐτοῦ εἶδεν, καὶ ἰδοὺ </em><strong><em>τρεῖς ἄνδρες</em></strong><em> εἱστήκεισαν ἐπάνω αὐτοῦ· καὶ ἰδὼν προσέδραμεν εἰς συνάντησιν αὐτοῖς ἀπὸ τῆς θύρας τῆς σκηνῆς αὐτοῦ καὶ </em><strong><em>προσεκύνησεν ἐπὶ τὴν γῆν</em></strong><em>» (</em><a href="https://bibleox.com/el/gr-lxx-byz/gen/18/#L1-2"><em>Γεν 18:1-2</em></a><em>)</em></p></blockquote><p>Γιατί φάνηκε ο Θεός με μορφή εικόνας; — Επειδή ο Θεός κατά τη φύση είναι αόρατος, κανείς ποτέ δεν Τον είδε (<a href="https://bibleox.com/el/gr-lxx-byz/1tim/6/#L16">Α Τιμ 6:16</a> · <a href="https://bibleox.com/el/gr-lxx-byz/in/1/#L18">Ιω 1:18</a>).</p><h4>Προσκύνηση αγγέλου</h4><p>Αξίζει πρώτα να σημειωθεί ότι οι άγγελοι είναι πνεύματα (<a href="https://bibleox.com/el/gr-lxx-byz/evr/1/#L13-14">Εβρ 1:13-14</a>), και τα πνεύματα δεν έχουν σάρκα και οστά (<a href="https://bibleox.com/el/gr-lxx-byz/lk/24/#L39">Λκ 24:39</a>), δηλαδή και οι άγγελοι εμφανίζονται στους ανθρώπους με μορφή ανθρώπων. Αντίστοιχα, αν προσκυνούν άγγελο, τότε <strong>προσκυνούν την ορατή εικόνα του αόρατου πνεύματος</strong> (του αγγέλου):</p><blockquote><p><em>«ὁ δὲ εἶπεν αὐτῷ Ἐγὼ ἀρχιστράτηγος δυνάμεως κυρίου νυνὶ παραγέγονα. καὶ Ἰησοῦς </em><strong><em>ἔπεσεν ἐπὶ πρόσωπον</em></strong><em> ἐπὶ τὴν γῆν καὶ εἶπεν αὐτῷ Δέσποτα, τί προστάσσεις τῷ σῷ οἰκέτῃ;» (</em><a href="https://bibleox.com/el/gr-lxx-byz/nav/5/#L14"><em>Ιησ 5:14</em></a><em>)</em></p></blockquote><h4>Προσκύνηση προφήτη</h4><blockquote><p><em>«καὶ εἶδον αὐτὸν οἱ υἱοὶ τῶν προφητῶν οἱ ἐν Ιεριχω ἐξ ἐναντίας καὶ εἶπον Ἐπαναπέπαυται τὸ πνεῦμα Ηλιου ἐπὶ Ελισαιε· καὶ ἦλθον εἰς συναντὴν αὐτοῦ καὶ </em><strong><em>προσεκύνησαν αὐτῷ</em></strong><em> ἐπὶ τὴν γῆν.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/4ts/2/#L15"><em>Δ Βασ 2:15</em></a><em>)</em></p></blockquote><h4>Προσκύνηση του ναού</h4><p>Ο Δαβίδ έκανε προσκυνήσεις στον ναό, που και ο ίδιος ήταν εικόνα του ουρανού (<a href="https://bibleox.com/el/gr-lxx-byz/lev/19/#L30">Λευ 19:30</a> · <a href="https://bibleox.com/el/gr-lxx-byz/lev/26/#L2">Λευ 26:2</a>), και ήταν γεμάτος εικόνες αγίων αγγέλων (<a href="https://bibleox.com/el/gr-lxx-byz/ish/25/#L1">Έξ 25:1</a> · <a href="https://bibleox.com/el/gr-lxx-byz/ish/26/#L1">Έξ 26:1</a>):</p><blockquote><p>«ἐγὼ δὲ ἐν τῷ πλήθει τοῦ ἐλέους σου εἰσελεύσομαι εἰς τὸν οἶκόν σου, <strong>προσκυνήσω πρὸς ναὸν ἅγιόν σου</strong> ἐν φόβῳ σου.» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/5/#L7">Ψλ 5:7</a>)</p></blockquote><p>Παράλληλα, ο Θεός πρόσταξε να τιμούν τον ναό (<a href="https://bibleox.com/el/gr-lxx-byz/lev/19/#L30">Λευ 19:30</a> · <a href="https://bibleox.com/el/gr-lxx-byz/lev/26/#L2">Λευ 26:2</a>).</p><h4>Προσκύνηση του υποποδίου του Θεού (του ναού)</h4><blockquote><p>«ὑψοῦτε κύριον τὸν θεὸν ἡμῶν καὶ <strong>προσκυνεῖτε</strong> <strong>τῷ ὑποποδίῳ τῶν ποδῶν αὐτοῦ, ὅτι ἅγιός ἐστιν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/98/#L5">Ψλ 98:5</a>)</p></blockquote><blockquote><p>«εἰσελευσόμεθα <strong>εἰς τὰ σκηνώματα αὐτοῦ, προσκυνήσομεν εἰς τὸν τόπον, οὗ ἔστησαν οἱ πόδες αὐτοῦ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/131/#L7">Ψλ 131:7</a>)</p></blockquote><h4>Προσκύνηση μπροστά στην κιβωτό</h4><p>Ο Ιησούς του Ναυή έκανε προσκυνήσεις μπροστά στην Κιβωτό της Διαθήκης, πάνω στην οποία υπήρχαν αγάλματα αγίων χερουβίμ:</p><blockquote><p><em>«καὶ διέρρηξεν Ἰησοῦς τὰ ἱμάτια αὐτοῦ, καὶ </em><strong><em>ἔπεσεν Ἰησοῦς ἐπὶ τὴν γῆν ἐπὶ πρόσωπον ἐναντίον κυρίου</em></strong><em> ἕως ἑσπέρας, αὐτὸς καὶ οἱ πρεσβύτεροι Ισραηλ, καὶ ἐπεβάλοντο χοῦν ἐπὶ τὰς κεφαλὰς αὐτῶν.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/nav/7/#L6"><em>Ιησ 7:6</em></a><em>)</em></p></blockquote><h4>Προσκύνηση της ράβδου</h4><blockquote><p><em>Για το ραβδί: «εἶπεν δέ Ὄμοσόν μοι. καὶ ὤμοσεν αὐτῷ. καὶ </em><strong><em>προσεκύνησεν Ισραηλ ἐπὶ τὸ ἄκρον τῆς ῥάβδου αὐτοῦ</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/gen/47/#L31"><em>Γεν 47:31</em></a><em>) Στους Ο΄ εδώ υπάρχει η λέξη </em><strong><em>ράβδος</em></strong><em>, δηλαδή γίνεται λόγος για το ραβδί του</em><em> (πρβλ. </em><a href="https://bibleox.com/el/gr-lxx-byz/evr/11/#L21"><em>Εβρ</em><em> 11:21</em></a><em>)</em></p></blockquote><p>Κι άλλα παραδείγματα: <a href="https://bibleox.com/ru/ru/w/%D0%BF%D0%BE%D0%BA%D0%BB%D0%BE%D0%BD%D1%8B" lang="ru">https://bibleox.com/ru/ru/w/поклоны</a></p><h3>Η ειδωλολατρική πίστη στο είδωλο παραβαίνει τη 2η εντολή</h3><p>Η ειδωλολατρική πίστη στο είδωλο οδηγεί σε παράβαση της 2ης εντολής, γιατί <u>σε κάθε περίπτωση</u> απαιτεί προσκύνηση<strong> </strong><u>ψευδούς</u> <u>θεού</u>, που δεν υπάρχει. Ο Μολόχ, ο Βάαλ, ο Δίας, ο Γιούπιτερ και ο Περούν δεν υπάρχουν — είναι ψευδείς θεοί.</p><p>Η ειδωλολατρική πίστη στο είδωλο έχει τρία είδη, ξεκινώντας από το πιο διαδεδομένο:</p><ol><li><p><strong>Είδωλο — ο ίδιος ο θεός</strong>. Το ίδιο το αντικείμενο που κατασκεύασε ο ειδωλολάτρης (το είδωλο) είναι θεότητα.</p></li><li><p><strong>Είδωλο — εικόνα ψευδούς θεότητας</strong>, που βρίσκεται δήθεν μακριά, αλλά έτσι υποτίθεται ότι πρέπει να μοιάζει.</p></li><li><p><strong>Είδωλο —</strong> <strong>επινοημένη εικόνα</strong> <strong>φυσικού στοιχείου </strong>(που θεοποιείται): θάλασσας, ανέμου, βροχής, φωτιάς, γης.</p></li></ol><p>Και στις τρεις περιπτώσεις τιμάται <u>ψευδής</u> <u>θεός</u>, που <u>δεν υπάρχει</u>. Είναι πίστη στο ψέμα.</p><p>Ακριβώς την πρώτη εκδοχή συναντάμε στη Γραφή. Η πιο διαδεδομένη ειδωλολατρική πίστη, η περιγραφή της οποίας συναντάται στις σελίδες της Γραφής, είναι η <u>θέωση του ίδιου του αντικειμένου</u><strong> </strong>(της ύλης). Ο ειδωλολάτρης μπορούσε να φτιάξει μόνος του θεό από εύχρηστο υλικό, ή να θεοποιήσει ένα ήδη υπάρχον φυσικό αντικείμενο ή φαινόμενο: ζώα, δέντρο, πέτρα, βουνά, Ήλιο, αστέρια, άνεμο, θάλασσα, καταιγίδα και την υπόλοιπη ύλη. Οι προφήτες ελέγχουν την ειδωλολατρία, λέγοντας ότι από το ένα μέρος του δέντρου ο ειδωλολάτρης ετοίμασε φαγητό για τον εαυτό του, και το άλλο μέρος του ίδιου δέντρου το ονόμασε θεό του:</p><blockquote><p><em>«ὃ </em><strong><em>ἔκοψεν ξύλον ἐκ τοῦ δρυμοῦ</em></strong><em>, ὃ ἐφύτευσεν κύριος καὶ ὑετὸς ἐμήκυνεν, </em><strong><em>ἵνα ᾖ ἀνθρώποις εἰς καῦσιν· καὶ λαβὼν ἀπ᾿ αὐτοῦ ἐθερμάνθη, καὶ καύσαντες ἔπεψαν ἄρτους ἐπ᾿ αὐτῶν· τὸ δὲ λοιπὸν <mark>εἰργάσαντο εἰς θεούς</mark>, καὶ προσκυνοῦσιν αὐτούς</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/is/44/#L14-15"><em>Ησ 44:14-15</em></a><em>)</em></p></blockquote><blockquote><p><em>«Λαβαν δὲ ᾤχετο κεῖραι τὰ πρόβατα αὐτοῦ· </em><strong><em>ἔκλεψεν δὲ Ραχηλ τὰ εἴδωλα</em></strong><em> τοῦ πατρὸς αὐτῆς. &lt;…&gt; νῦν οὖν πεπόρευσαι· ἐπιθυμίᾳ γὰρ ἐπεθύμησας ἀπελθεῖν εἰς τὸν οἶκον τοῦ πατρός σου· </em><strong><em>ἵνα τί <mark>ἔκλεψας τοὺς θεούς</mark> μου</em></strong><em>;» (</em><a href="https://bibleox.com/el/gr-lxx-byz/gen/31/#L19,30"><em>Γεν 31:19,30</em></a><em>)</em></p></blockquote><blockquote><p><em>«Πλοῦν τις πάλιν στελλόμενος καὶ ἄγρια μέλλων διοδεύειν κύματα τοῦ φέροντος αὐτὸν πλοίου </em><strong><em>σαθρότερον ξύλον ἐπιβοᾶται. &lt;…&gt; εἶτα ἐν χρόνῳ κρατυνθὲν τὸ ἀσεβὲς ἔθος ὡς νόμος ἐφυλάχθη. καὶ τυράννων ἐπιταγαῖς <mark>ἐθρησκεύετο τὰ γλυπτά</mark></em></strong><em>» (</em><a href="https://bibleox.com/el/gr-lxx-byz/prs/14/#L1,16-17"><em>Σ.Σολ 14:1,16-17</em></a><em>)</em></p></blockquote><blockquote><p><em>«καὶ λατρεύσετε ἐκεῖ θεοῖς ἑτέροις, ἔργοις χειρῶν ἀνθρώπων, ξύλοις καὶ λίθοις, </em><strong><em>οἳ οὐκ ὄψονται οὐδὲ μὴ ἀκούσωσιν <mark>οὔτε μὴ φάγωσιν οὔτε μὴ ὀσφρανθῶσιν</mark></em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/vtor/4/#L28"><em>Δτ 4:28</em></a><em>)</em> — το χωρίο Δν 14:6 (ο Βηλ) δεν υπάρχει στο κείμενο της Ελληνικής Βίβλου που παραθέτουμε· γι’ αυτό παραθέτουμε ένα κοντινό χωρίο για τα είδωλα.</p></blockquote><blockquote><p><em>«τί συμφέρει κάρπωσις εἰδώλῳ; </em><strong><em><mark>οὔτε γὰρ ἔδεται οὔτε μὴ ὀσφρανθῇ</mark></em></strong><em>» (<a href="https://bibleox.com/el/gr-lxx-byz/prsir/30/#L19">Σ.Σειρ 30:19</a>)</em></p></blockquote><blockquote><p><em>«Δημήτριος γάρ τις ὀνόματι, ἀργυροκόπος, ποιῶν ναοὺς ἀργυροῦς Ἀρτέμιδος παρείχετο τοῖς τεχνίταις οὐκ ὀλίγην ἐργασίαν, οὓς συναθροίσας καὶ τοὺς περὶ τὰ τοιαῦτα ἐργάτας εἶπεν, Ἄνδρες, ἐπίστασθε ὅτι ἐκ ταύτης τῆς ἐργασίας ἡ εὐπορία ἡμῖν ἐστιν, καὶ θεωρεῖτε καὶ ἀκούετε ὅτι οὐ μόνον Ἐφέσου ἀλλὰ σχεδὸν πάσης τῆς Ἀσίας ὁ Παῦλος οὗτος πείσας μετέστησεν ἱκανὸν ὄχλον, λέγων ὅτι </em><strong><em><mark>οὐκ εἰσὶν θεοὶ οἱ διὰ χειρῶν γινόμενοι</mark></em></strong><em>. οὐ μόνον δὲ τοῦτο </em><strong><em>κινδυνεύει ἡμῖν τὸ μέρος εἰς ἀπελεγμὸν ἐλθεῖν</em></strong><em>» (<a href="https://bibleox.com/el/gr-lxx-byz/act/19/#L24-27">Πραξ 19:24-27</a>)</em></p></blockquote><p>Άλλα παρόμοια χωρία της Γραφής: <a href="https://bibleox.com/ru/ru/w/%D1%8F%D0%B7%D1%8B%D1%87%D0%B5%D1%81%D0%BA%D0%B0%D1%8F-%D0%B2%D0%B5%D1%80%D0%B0-%D0%B2-%D0%B8%D0%B4%D0%BE%D0%BB%D0%B0" lang="ru">https://bibleox.com/ru/ru/w/языческая-вера-в-идола</a></p><p>Οι αρχαίοι φιλόσοφοι, ως άνθρωποι που σκέφτονται, υπερασπιζόμενοι την ειδωλολατρική πίστη τους, έφταναν να συνειδητοποιήσουν ότι το υλικό που έχει επεξεργαστεί από ανθρώπινα χέρια δεν μπορεί να είναι θεός. Μπορούσαν να διατυπώσουν άλλες κρίσεις, λέγοντας ότι είναι απλώς εικόνα του θεού ή επινοημένη εικόνα του στοιχείου. Αλλά η παράβαση της 2ης εντολής γίνεται και πάλι, γιατί προσκυνούν <strong>ψευδή θεό</strong> και όχι τον αληθινό Θεό.</p><p>Ο ειδωλολατρικός θεός γίνεται ψευδής όχι μόνο εξαιτίας του ονόματος ή της εικόνας. Το ψέμα για τον θεό φανερώνεται και στον αριθμό των θεών, στις δυνάμεις τους, στις ουσιώδεις ιδιότητές τους, και κυρίως — στο θέλημα του Θεού για τη δημιουργία Του, που αποκαλύπτεται στις εντολές.</p><p>Για να γίνει σαφές, ας συγκρίνουμε κατ’ αντιστοιχία.</p><h4>Οι ειδωλολατρικοί θεοί</h4><ul><li><p>όνομα ψευδές (Μολόχ, Βάαλ, Δίας, Περούν κ.λπ.),</p></li><li><p>μορφή ψευδής (διάφορες ανθρωπόμορφες παραστάσεις),</p></li><li><p>δυνάμεις ψευδείς (περιορισμένες· πολλοί ειδωλολατρικοί θεοί έχουν διαφορετικές δυνάμεις),</p></li><li><p>θέλημα ψευδές (όχι εκείνο που εξέφρασε ο αληθινός Θεός στις εντολές),</p></li><li><p>ουσιώδεις ιδιότητες ψευδείς (όχι αιωνιότητα, όχι πανταχού παρουσία, όχι παντογνωσία, όχι απεραντοσύνη, όχι αθανασία, όχι αγιότητα),</p></li><li><p>καλεί σε άλλον τόπο (ψευδή) και με άλλον δρόμο (ψευδή).</p></li></ul><h4>Ο Θεός στον οποίο πιστεύει η Ορθόδοξη Εκκλησία</h4><ul><li><p>όνομα του αληθινού Θεού από την Αγία Γραφή (ο Ων, Πατέρας, Υιός, Άγιο Πνεύμα, Ιησούς Χριστός και <a href="https://bibleox.com/el/el/w/%CE%A4%CE%B1_%CE%BF%CE%BD%CF%8C%CE%BC%CE%B1%CF%84%CE%B1_%CF%84%CE%BF%CF%85_%CE%98%CE%B5%CE%BF%CF%8D">άλλα</a>).</p></li><li><p>εικόνες τέτοιες, μέσω των οποίων ο ίδιος φανέρωσε τον εαυτό Του στον κόσμο (τρεις άγγελοι στον Αβραάμ — <a href="https://bibleox.com/el/gr-lxx-byz/gen/18/#L1-2"><em>Γεν 18:1-2</em></a>, περιστερά — <a href="https://bibleox.com/el/gr-lxx-byz/lk/3/#L22"><em>Λκ 3:22</em></a>, και τέλος, με μορφή ανθρώπου, που πραγματικά έγινε ο Υιός του Θεού – Ιησούς Χριστός).</p></li><li><p>απεικονίζει τον παντοδύναμο δημιουργό του σύμπαντος.</p></li><li><p>που καλεί στην τήρηση των θείων εντολών (ο Χριστός απεικονίζεται με ανοιχτό βιβλίο, στο οποίο είναι γραμμένες οι εντολές Του).</p></li><li><p>απεικονίζει τον Θεό που καλεί στη ζωή μαζί Του, μέσω της οδού του σταυρού (ο Χριστός απεικονίζεται στον σταυρό με σταυροφόρο φωτοστέφανο).</p></li></ul><p>Έτσι, ο ειδωλολάτρης θεωρεί την εικόνα θεό ή εικόνα ψευδούς θεού, ενώ η Ορθόδοξη Εκκλησία απεικονίζει τον αληθινό Θεό, χωρίς να θεωρεί θεό το ίδιο το κατασκεύασμα (την εικόνα).</p><p>Επίσης, η Ορθόδοξη Εκκλησία απεικονίζει τους φίλους του Θεού: την Παρθένο Μαρία τη Θεοτόκο, τους αγγέλους, τους αποστόλους, τους δικαίους. Αυτό δεν είναι ψέμα. Όλοι τους υπάρχουν πραγματικά. Παράλληλα, ούτε οι ίδιοι αυτοί άγιοι άνθρωποι και άγγελοι, ούτε οι εικόνες τους θεωρούνται θεοί.</p><p>Όλες οι εικόνες στην Ορθόδοξη Εκκλησία τιμώνται στο ίδιο επίπεδο με το Ευαγγέλιο και τον σταυρό ως ιερά. Η τιμή τους αναφέρεται στον αληθινό Θεό και στους πραγματικά υπάρχοντες φίλους Του.</p><h3>Η αιτία της θέσπισης της 2ης εντολής</h3><p>Έτσι, ο Θεός όχι μόνο δεν απαγόρευσε να κάνουν εικόνες των αγίων, αλλά πρόσταξε και να τις κάνουν (<a href="https://bibleox.com/el/gr-lxx-byz/ish/25/#L1">Έξ 25:1</a> · <a href="https://bibleox.com/el/gr-lxx-byz/ish/26/#L1">Έξ 26:1</a>), ενώ τις δικές Του εικόνες τις απαγόρευσε με τη δεύτερη εντολή. Δηλώνει την αιτία της απαγόρευσης: όταν ο Θεός έδινε τη νομοθεσία, δεν φανέρωσε καμία <strong>δική Του</strong> εικόνα, για να μην προσπαθήσουν οι Ισραηλίτες να <strong>Τον</strong> απεικονίσουν και έπειτα δεν αρχίσουν να λατρεύουν τις ίδιες τις εικόνες και τα αγάλματα ως θεούς, αντί του μοναδικού αληθινού Θεού:</p><blockquote><p>«καὶ φυλάξεσθε σφόδρα τὰς ψυχὰς ὑμῶν, ὅτι <strong><mark>οὐκ εἴδετε ὁμοίωμα</mark> ἐν τῇ ἡμέρᾳ, ᾗ ἐλάλησεν κύριος</strong> πρὸς ὑμᾶς ἐν Χωρηβ ἐν τῷ ὄρει ἐκ μέσου τοῦ πυρός. <strong><mark>μὴ ἀνομήσητε καὶ ποιήσητε ὑμῖν ἑαυτοῖς γλυπτὸν ὁμοίωμα, πᾶσαν εἰκόνα</mark></strong>, ὁμοίωμα ἀρσενικοῦ ἢ θηλυκοῦ, ὁμοίωμα παντὸς κτήνους τῶν ὄντων ἐπὶ τῆς γῆς, ὁμοίωμα παντὸς ὀρνέου πτερωτοῦ, ὃ πέταται ὑπὸ τὸν οὐρανόν, ὁμοίωμα παντὸς ἑρπετοῦ, ὃ ἕρπει ἐπὶ τῆς γῆς, ὁμοίωμα παντὸς ἰχθύος, ὅσα ἐστὶν ἐν τοῖς ὕδασιν ὑποκάτω τῆς γῆς. <strong><mark>καὶ μὴ ἀναβλέψας</mark></strong> εἰς τὸν οὐρανὸν καὶ ἰδὼν τὸν ἥλιον καὶ τὴν σελήνην καὶ τοὺς ἀστέρας καὶ πάντα τὸν κόσμον τοῦ οὐρανοῦ <strong><mark>πλανηθεὶς προσκυνήσῃς αὐτοῖς καὶ λατρεύσῃς αὐτοῖς</mark></strong>, ἃ ἀπένειμεν κύριος ὁ θεός σου αὐτὰ πᾶσιν τοῖς ἔθνεσιν τοῖς ὑποκάτω τοῦ οὐρανοῦ.» (<a href="https://bibleox.com/el/gr-lxx-byz/vtor/4/#L15-19">Δτ 4:15-19</a>)</p></blockquote><p>Αυτή η προειδοποίηση ήταν πολύ δικαιολογημένη, γιατί εκείνη την εποχή ολόκληρος ο πλανήτης Γη ήταν ειδωλολατρικός και προσκυνούσε τέτοια είδωλα. Σήμερα μάλιστα χρειάζεται να εξηγεί κανείς ότι ο ειδωλολάτρης κυριολεκτικά θεωρούσε θεό το αντικείμενο που έφτιαξε με τα ίδια του τα χέρια.</p><h2>Με την έλευση του Χριστού γίνονται αλλαγές</h2><h3>1. Τελειώνει η Παλαιά Διαθήκη και ο νόμος του Μωυσή</h3><blockquote><p>«νυνὶ δὲ <strong>κατηργήθημεν ἀπὸ τοῦ νόμου</strong>, <strong>ἀποθανόντες ἐν ᾧ κατειχόμεθα</strong>, ὥστε δουλεύειν ἡμᾶς ἐν καινότητι πνεύματος καὶ οὐ παλαιότητι γράμματος.» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/7/#L6">Ρωμ 7:6</a>)</p></blockquote><blockquote><p>«ὥστε <strong>ὁ νόμος παιδαγωγὸς ἡμῶν γέγονεν εἰς Χριστόν</strong>, ἵνα ἐκ πίστεως δικαιωθῶμεν· ἐλθούσης δὲ τῆς πίστεως <strong>οὐκέτι ὑπὸ παιδαγωγόν ἐσμεν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/gal/3/#L24-25">Γαλ 3:24-25</a>)</p></blockquote><blockquote><p>«Αὐτὸς γάρ ἐστιν ἡ εἰρήνη ἡμῶν, ὁ ποιήσας τὰ ἀμφότερα ἓν καὶ τὸ μεσότοιχον τοῦ φραγμοῦ λύσας, τὴν ἔχθραν, ἐν τῇ σαρκὶ αὐτοῦ, <strong>τὸν νόμον τῶν ἐντολῶν ἐν δόγμασιν</strong> <strong>καταργήσας</strong>, ἵνα τοὺς δύο κτίσῃ ἐν αὑτῷ εἰς ἕνα καινὸν ἄνθρωπον ποιῶν εἰρήνην» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/2/#L14-15">Εφ 2:14-15</a>)</p></blockquote><p><strong>Ο Χριστός συνάπτει την Καινή Διαθήκη, τερματίζοντας μ’ αυτό την Παλαιά Διαθήκη με τον νόμο του Μωυσή</strong> (<a href="https://bibleox.com/el/gr-lxx-byz/rim/7/#L6">Ρωμ 7:6</a> · <a href="https://bibleox.com/el/gr-lxx-byz/gal/3/#L21-25">Γαλ 3:21-25</a> · <a href="https://bibleox.com/el/gr-lxx-byz/ef/2/#L14-16">Εφ 2:14-16</a>). Η απαγόρευση της απεικόνισης του Θεού ήταν μέρος του νόμου του Μωυσή, ο οποίος με την έλευση του Χριστού καταργήθηκε (<a href="https://bibleox.com/el/el/w/%CE%97_%CE%BA%CE%B1%CF%84%CE%AC%CF%81%CE%B3%CE%B7%CF%83%CE%B7_%CF%84%CE%BF%CF%85_%CE%9D%CF%8C%CE%BC%CE%BF%CF%85_%CF%84%CE%BF%CF%85_%CE%9C%CF%89%CF%85%CF%83%CE%AE">περισσότερα</a>). Οι εντολές που έδωσε ο Θεός μέσω του Μωυσή χάνουν την κατά γράμμα σημασία τους: δεν τηρούμε την ανάπαυση του Σαββάτου (και δεν σκοτώνουμε όσους την παραβαίνουν), δεν προσφέρουμε ζώα σε θυσία, δεν περιτεμνόμαστε, δεν γιορτάζουμε τις ιουδαϊκές εορτές, δεν προσφέρουμε το δέκατο, και πολλές άλλες διατάξεις του νόμου του Μωυσή δεν τις εκπληρώνουμε. Η Παλαιά Διαθήκη και ο νόμος του Μωυσή έχουν καταργηθεί ως τέτοια, και οι πιστοί της Καινής Διαθήκης καλούνται να είναι λειτουργοί του πνεύματος και όχι του γράμματος (<a href="https://bibleox.com/el/gr-lxx-byz/2kor/3/#L6">Β Κορ 3:6</a>), δηλαδή να κατανοούν τις αιτίες των θείων θεσμών, να εισχωρούν στο νόημά τους και να τηρούν την ουσία της εντολής.</p><p>Η κατά γράμμα σημασία της 2ης εντολής απαγόρευε να απεικονίζουν μόνο τον Θεό, αλλά όχι τους αγίους λειτουργούς Του (<a href="https://bibleox.com/el/gr-lxx-byz/ish/25/#L1">Έξ 25:1</a> · <a href="https://bibleox.com/el/gr-lxx-byz/ish/26/#L1">Έξ 26:1</a>).</p><p>Η ουσία της 2ης εντολής — <strong>να μην προσκυνούμε <u>ψευδείς</u> <u>θεούς</u></strong>.</p><p>Αντίστοιχα, η Ορθόδοξη Εκκλησία απεικονίζει τους αγίους, γιατί αυτό δεν απαγορεύτηκε ποτέ, αλλά μάλιστα προστάχθηκε να τους απεικονίζουν (<a href="https://bibleox.com/el/gr-lxx-byz/ish/25/#L1">Έξ 25:1</a> · <a href="https://bibleox.com/el/gr-lxx-byz/ish/26/#L1">Έξ 26:1</a>) και οι δίκαιοι προσκυνούσαν μπροστά σ’ εκείνες τις εικόνες (<a href="https://bibleox.com/el/gr-lxx-byz/nav/7/#L6">Ιησ 7:6</a> · <a href="https://bibleox.com/el/gr-lxx-byz/ps/5/#L7">Ψλ 5:7</a>). Η απεικόνιση του Θεού απαγορευόταν μόνο στην Παλαιά Διαθήκη από τον νόμο του Μωυσή, γιατί κανείς δεν είχε δει τον Θεό. Και αφού ο νόμος του Μωυσή καταργήθηκε, καταργήθηκε και η απαγόρευση της απεικόνισης του Θεού, ως μέρος του νόμου του Μωυσή.</p><h3>2. Ο Θεός έγινε ορατός, λαμβάνοντας την ανθρώπινη φύση (σαρκώθηκε)</h3><p>Στην Παλαιά Διαθήκη ο Θεός απαγορεύει να Τον απεικονίζουν, εξηγώντας ότι όταν ο λαός λάμβανε τον Νόμο, ο Θεός δεν του φανέρωσε τη δική Του εικόνα (<a href="https://bibleox.com/el/gr-lxx-byz/vtor/4/#L15-19">Δτ 4:15-19</a>). Ωστόσο, συνάπτοντας την Καινή Διαθήκη και δίνοντας νέα διδασκαλία (<a href="https://bibleox.com/el/gr-lxx-byz/ef/2/#L15">Εφ 2:15</a>), ο Θεός φανέρωσε τον εαυτό Του, γινόμενος ορατός κατά την ανθρώπινη φύση, καταργώντας τον νόμο του Μωυσή, και γι’ αυτό τώρα είναι δυνατόν να απεικονίζονται όχι μόνο οι άγιοι, αλλά και ο ίδιος ο Θεός με την εικόνα με την οποία ο ίδιος φανέρωσε τον εαυτό Του:</p><blockquote><p>«<strong><em>θεὸν οὐδεὶς ἑώρακεν πώποτε</em></strong><em>· </em><strong><em>μονογενὴς θεὸς</em></strong><em> ὁ ὢν εἰς τὸν κόλπον τοῦ πατρὸς ἐκεῖνος </em><strong><em>ἐξηγήσατο</em></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/1/#L18">Ιω 1:18</a>)</p></blockquote><blockquote><p><em>«Ὃ ἦν ἀπ᾿ ἀρχῆς, </em><strong><em>ὃ ἀκηκόαμεν, ὃ ἑωράκαμεν τοῖς ὀφθαλμοῖς ἡμῶν, ὃ ἐθεασάμεθα</em></strong><em> καὶ αἱ χεῖρες ἡμῶν ἐψηλάφησαν, </em><strong><em>περὶ τοῦ λόγου τῆς ζωῆς</em></strong><em> — καὶ ἡ ζωὴ ἐφανερώθη, καὶ ἑωράκαμεν καὶ μαρτυροῦμεν καὶ ἀπαγγέλλομεν ὑμῖν τὴν ζωὴν τὴν αἰώνιον </em><strong><em>ἥτις ἦν πρὸς τὸν πατέρα καὶ ἐφανερώθη ἡμῖν</em></strong> —» (<a href="https://bibleox.com/el/gr-lxx-byz/1in/1/#L1-2">Α Ιω 1:1-2</a>)</p></blockquote><h3>3. Αλλάζει η ουράνια πραγματικότητα</h3><p>Ο ναός, ως επίγειος χώρος, κατά τη βουλή του Θεού ήταν από την αρχή εικόνα της ουράνιας πραγματικότητας: ο Θεός πρόσταξε τον προφήτη Μωυσή να κατασκευάσει τον ναό όχι επειδή ο Θεός είχε ανάγκη από ναό (δεν είχε ανάγκη <a href="https://bibleox.com/el/gr-lxx-byz/is/66/#L1">Ησ 66:1</a> · <a href="https://bibleox.com/el/gr-lxx-byz/ps/49/#L13">Ψλ 49:13</a> · <a href="https://bibleox.com/el/gr-lxx-byz/is/1/#L11">Ησ 1:11</a>), αλλά πρόσταξε να φτιάξουν τον ναό ακριβώς ως εικόνα του ουρανού, ως απεικόνιση της ουράνιας πραγματικότητας που δείχθηκε στον προφήτη (<a href="https://bibleox.com/el/gr-lxx-byz/ish/25/#L8-9,40">Έξ 25:8-9,40</a> · <a href="https://bibleox.com/el/gr-lxx-byz/evr/9/#L24">Εβρ 9:24</a>). Στην Παλαιά Διαθήκη υπήρχε μία ουράνια πραγματικότητα, και στην Καινή — άλλη. Παλαιότερα στην ουράνια πραγματικότητα παρέμεναν πνευματικά ορατοί <strong>μόνο οι άγγελοι</strong>, γιατί ο Θεός είναι εντελώς άυλος και αόρατος (την ορατή ανθρώπινη φύση ο Υιός του Θεού τότε δεν την είχε λάβει ακόμη), και οι άνθρωποι δεν έφταναν ακόμη στη ζωή στον ουρανό, αλλά μετά τον θάνατο κατέβαιναν στον άδη (περισσότερα).</p><p>Ωστόσο, μετά την έλευση του Χριστού γίνονται αλλαγές:</p><ol><li><p><strong>Ο Χριστός Θεός βασίλεψε στον ουρανό ορατά</strong> (<a href="https://bibleox.com/el/gr-lxx-byz/ef/1/#L20-21">Εφ 1:20-21</a> · <a href="https://bibleox.com/el/gr-lxx-byz/otkr/3/#L21">Απ 3:21</a>).</p></li><li><p><strong>Στον ουρανό εμφανίστηκαν άνθρωποι </strong>(εκτός από τον ίδιο τον Χριστό), αφού απέκτησαν πρόσβαση στη ζωή με τον Χριστό στον ουρανό (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/6/#L9-11">Απ 6:9-11</a> · <a href="https://bibleox.com/el/gr-lxx-byz/otkr/14/#L1,3-5">Απ 14:1,3-5</a> · <a href="https://bibleox.com/el/gr-lxx-byz/evr/12/#L22-24">Εβρ 12:22-24</a>).</p></li></ol><p>Η ουράνια πραγματικότητα άλλαξε. Η παλιά δεν υπάρχει πια. Ο ναός στα Ιεροσόλυμα έγινε εικόνα της περασμένης, και όχι της παρούσας ουράνιας πραγματικότητας. Γι’ αυτό οι χριστιανοί από την αρχαιότητα απεικονίζουν τη νέα ουράνια πραγματικότητα, βάζοντας στο κέντρο την εικόνα του Ιησού Χριστού (του Θεού) που βασίλεψε φανερά στον ουρανό, και γύρω — τους αγίους λειτουργούς Του, τώρα πια και ανθρώπους.</p><p>Χαρακτηριστικό γεγονός είναι η βλάβη του ναού στα Ιεροσόλυμα μετά τη θυσία του Χριστού:</p><blockquote><p>«<strong>Καὶ ἰδοὺ τὸ καταπέτασμα τοῦ ναοῦ ἐσχίσθη ἀπ᾿ ἄνωθεν ἕως κάτω εἰς δύο, καὶ ἡ γῆ ἐσείσθη, καὶ αἱ πέτραι ἐσχίσθησαν</strong>, καὶ τὰ μνημεῖα ἀνεῴχθησαν καὶ <strong>πολλὰ σώματα τῶν κεκοιμημένων ἁγίων ἠγέρθησαν, καὶ ἐξελθόντες ἐκ τῶν μνημείων μετὰ τὴν ἔγερσιν αὐτοῦ</strong> εἰσῆλθον εἰς τὴν ἁγίαν πόλιν καὶ ἐνεφανίσθησαν πολλοῖς.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/27/#L51-53">Μτ 27:51-53</a>)</p></blockquote><p>Και στη δεκαετία του 70 ο ναός καταστρέφεται εντελώς από τους Ρωμαίους, παραχωρώντας για όλες τις επόμενες χιλιετίες τη θέση του στη νέα εικόνα της ουράνιας πραγματικότητας — τον ορθόδοξο ναό.</p><img src="https://res.bibleox.com/s/img/image/simple/686bea5b5f47da2505d3ae31/s_p_pjRHeoFaUpKPoyEH.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686bea5b5f47da2505d3ae31/m_p_pjRHeoFaUpKPoyEH.jpg">μεγέθυνση</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686cf7375f47da2505d3ae4f/m_p_MOsOWI2vEXUj5ELf.jpg">εκδοχή 2</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686d23425f47da2505d3ae55/s_p_LzqgbhnIsbqtghoc.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d23425f47da2505d3ae55/m_p_LzqgbhnIsbqtghoc.jpg">μεγέθυνση</a>]</p><p>Περισσότερες αρχαίες εικόνες εδώ: <a href="https://bibleox.com/el/el/w/Ik1c_%CE%A3%CF%85%CE%BB%CE%BB%CE%BF%CE%B3%CE%AE_%CE%B1%CF%81%CF%87%CE%B1%CE%AF%CF%89%CE%BD_%CE%B5%CE%B9%CE%BA%CF%8C%CE%BD%CF%89%CE%BD">Συλλογή αρχαίων εικόνων</a></p><h2>Ο Θεός έφτιαχνε τις δικές Του εικόνες</h2><p>Τον Θεό δεν Τον είδε ποτέ κανείς:</p><blockquote><p>«<strong><mark>θεὸν οὐδεὶς ἑώρακεν πώποτε</mark></strong>· μονογενὴς θεὸς ὁ ὢν εἰς τὸν κόλπον τοῦ πατρὸς ἐκεῖνος ἐξηγήσατο.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/1/#L18">Ιω 1:18</a>)</p></blockquote><p>Αλλά ταυτόχρονα ο Θεός εμφανίστηκε πολλές φορές με μορφή εικόνας:</p><h3>Ο Θεός εμφανίστηκε στον Αβραάμ με τη μορφή τριών αγγέλων</h3><p>Οι τρεις άγγελοι — δεν είναι ο Θεός όπως είναι στην πραγματικότητα, δεν είναι αυτό που είναι πριν από τη δημιουργία του κόσμου. Δηλαδή είναι <strong>εικόνα</strong> του Θεού, και ο Αβραάμ προσκυνά την εικόνα του Θεού:</p><blockquote><p>«<strong>Ὤφθη δὲ αὐτῷ ὁ θεὸς</strong> πρὸς τῇ δρυὶ τῇ Μαμβρη καθημένου αὐτοῦ ἐπὶ τῆς θύρας τῆς σκηνῆς αὐτοῦ μεσημβρίας. ἀναβλέψας δὲ τοῖς ὀφθαλμοῖς αὐτοῦ εἶδεν, καὶ ἰδοὺ <strong>τρεῖς ἄνδρες</strong> εἱστήκεισαν ἐπάνω αὐτοῦ· καὶ ἰδὼν προσέδραμεν εἰς συνάντησιν αὐτοῖς ἀπὸ τῆς θύρας τῆς σκηνῆς αὐτοῦ καὶ <strong>προσεκύνησεν ἐπὶ τὴν γῆν</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/gen/18/#L1-2">Γεν 18:1-2</a>)</p></blockquote><p>Ο Αβραάμ, προσκυνώντας την εικόνα του Θεού με τη μορφή τριών αγγέλων, υπηρέτησε τον Θεό ή τις εικόνες του Θεού; Προφανώς τον Θεό.</p><h3>Ο Θεός πάλεψε φανερά με τον Ιακώβ</h3><blockquote><p>«ὑπελείφθη δὲ Ιακωβ μόνος, καὶ ἐπάλαιεν ἄνθρωπος μετ᾿ αὐτοῦ ἕως πρωί. &lt;…&gt; εἶπεν δὲ αὐτῷ Οὐ κληθήσεται ἔτι τὸ ὄνομά σου Ιακωβ, ἀλλὰ Ισραηλ ἔσται τὸ ὄνομά σου, ὅτι <strong>ἐνίσχυσας μετὰ θεοῦ</strong> καὶ μετὰ ἀνθρώπων δυνατός. &lt;…&gt; καὶ ἐκάλεσεν Ιακωβ τὸ ὄνομα τοῦ τόπου ἐκείνου Εἶδος θεοῦ· <strong>εἶδον γὰρ θεὸν πρόσωπον πρὸς πρόσωπον, καὶ ἐσώθη μου ἡ ψυχή</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/gen/32/#L25,29,31">Γεν 32:25,29,31</a>)</p></blockquote><h3>Ο Θεός μέσω εικόνας μιλούσε με τον προφήτη Μωυσή</h3><blockquote><p>«καὶ εἶπεν πρὸς αὐτούς Ἀκούσατε τῶν λόγων μου· <strong>ἐὰν γένηται προφήτης ὑμῶν κυρίῳ, ἐν ὁράματι αὐτῷ γνωσθήσομαι</strong> καὶ ἐν ὕπνῳ λαλήσω αὐτῷ. <strong>οὐχ οὕτως ὁ θεράπων μου Μωϋσῆς</strong>· ἐν ὅλῳ τῷ οἴκῳ μου πιστός ἐστιν· <strong>στόμα κατὰ στόμα λαλήσω αὐτῷ, ἐν εἴδει καὶ οὐ δι᾿ αἰνιγμάτων, καὶ τὴν δόξαν κυρίου εἶδεν</strong>· καὶ διὰ τί οὐκ ἐφοβήθητε καταλαλῆσαι κατὰ τοῦ θεράποντός μου Μωυσῆ;» (<a href="https://bibleox.com/el/gr-lxx-byz/chis/12/#L6-8">Αρ 12:6-8</a>)</p></blockquote><h3>Ο Θεός κατέβηκε σαν περιστερά στον Ιησού Χριστό</h3><blockquote><p>«καὶ <strong>καταβῆναι τὸ πνεῦμα τὸ ἅγιον σωματικῷ εἴδει ὡς περιστερὰν</strong> ἐπ᾿ αὐτόν, καὶ φωνὴν ἐξ οὐρανοῦ γενέσθαι, Σὺ εἶ ὁ υἱός μου ὁ ἀγαπητός, ἐν σοὶ εὐδόκησα.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/3/#L22">Λκ 3:22</a> · <a href="https://bibleox.com/el/gr-lxx-byz/mf/3/#L16">Μτ 3:16</a> · <a href="https://bibleox.com/el/gr-lxx-byz/mk/1/#L10">Μκ 1:10</a> · <a href="https://bibleox.com/el/gr-lxx-byz/in/1/#L32">Ιω 1:32</a>)</p></blockquote><h3>Ο άνθρωπος — εικόνα του Θεού</h3><blockquote><p>«καὶ <strong>ἐποίησεν ὁ θεὸς τὸν ἄνθρωπον, κατ᾿ εἰκόνα θεοῦ ἐποίησεν αὐτόν</strong>, ἄρσεν καὶ θῆλυ ἐποίησεν αὐτούς.» (<a href="https://bibleox.com/el/gr-lxx-byz/gen/1/#L27">Γεν 1:27</a>)</p></blockquote><blockquote><p>«Αὕτη ἡ βίβλος γενέσεως ἀνθρώπων· ᾗ ἡμέρᾳ ἐποίησεν ὁ θεὸς τὸν Αδαμ, <strong>κατ᾿ εἰκόνα θεοῦ ἐποίησεν αὐτόν</strong>·» (<a href="https://bibleox.com/el/gr-lxx-byz/gen/5/#L1">Γεν 5:1</a>)</p></blockquote><blockquote><p>«ὁ ἐκχέων αἷμα ἀνθρώπου ἀντὶ τοῦ αἵματος αὐτοῦ ἐκχυθήσεται, ὅτι <strong>ἐν εἰκόνι θεοῦ ἐποίησα τὸν ἄνθρωπον</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/gen/9/#L6">Γεν 9:6</a>)</p></blockquote><blockquote><p>«ὅτι ὁ θεὸς ἔκτισεν τὸν ἄνθρωπον ἐπ᾿ ἀφθαρσίᾳ καὶ <strong>εἰκόνα τῆς ἰδίας ἀιδιότητος ἐποίησεν αὐτόν</strong>·» (<a href="https://bibleox.com/el/gr-lxx-byz/prs/2/#L23">Σ.Σολ 2:23</a>)</p></blockquote><h2>Ο Ιησούς Χριστός — εικόνα του Θεού Πατέρα</h2><blockquote><p>«τοῦτο φρονεῖτε ἐν ὑμῖν ὃ καὶ <strong>ἐν Χριστῷ Ἰησοῦ, ὃς ἐν μορφῇ θεοῦ ὑπάρχων</strong> οὐχ ἁρπαγμὸν ἡγήσατο τὸ εἶναι ἴσα θεῷ» (<a href="https://bibleox.com/el/gr-lxx-byz/fil/2/#L5-6">Φιλ 2:5-6</a>)</p></blockquote><blockquote><p>«ὃς ὢν <strong>ἀπαύγασμα τῆς δόξης καὶ χαρακτὴρ τῆς ὑποστάσεως αὐτοῦ</strong>, φέρων τε τὰ πάντα τῷ ῥήματι τῆς δυνάμεως αὐτοῦ, καθαρισμὸν τῶν ἁμαρτιῶν ποιησάμενος ἐκάθισεν ἐν δεξιᾷ τῆς μεγαλωσύνης ἐν ὑψηλοῖς» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/1/#L3">Εβρ 1:3</a>)</p></blockquote><blockquote><p>«ἐν οἷς ὁ θεὸς τοῦ αἰῶνος τούτου ἐτύφλωσεν τὰ νοήματα τῶν ἀπίστων εἰς τὸ μὴ αὐγάσαι τὸν φωτισμὸν τοῦ εὐαγγελίου τῆς δόξης τοῦ Χριστοῦ, <strong>ὅς ἐστιν εἰκὼν τοῦ θεοῦ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/2kor/4/#L4">Β Κορ 4:4</a>)</p></blockquote><blockquote><p>«εὐχαριστοῦντες τῷ πατρὶ τῷ ἱκανώσαντι ὑμᾶς εἰς τὴν μερίδα τοῦ κλήρου τῶν ἁγίων ἐν τῷ φωτί· ὃς ἐρρύσατο ἡμᾶς ἐκ τῆς ἐξουσίας τοῦ σκότους καὶ μετέστησεν εἰς τὴν βασιλείαν <strong>τοῦ υἱοῦ τῆς ἀγάπης αὐτοῦ</strong>, ἐν ᾧ ἔχομεν τὴν ἀπολύτρωσιν, τὴν ἄφεσιν τῶν ἁμαρτιῶν· <strong>ὅς ἐστιν εἰκὼν τοῦ θεοῦ τοῦ ἀοράτου</strong>, πρωτότοκος πάσης κτίσεως» (<a href="https://bibleox.com/el/gr-lxx-byz/kol/1/#L12-15">Κολ 1:12-15</a>)</p></blockquote><blockquote><p>«λέγει αὐτῷ Φίλιππος, Κύριε, <strong>δεῖξον ἡμῖν τὸν πατέρα</strong>, καὶ ἀρκεῖ ἡμῖν. λέγει αὐτῷ ὁ Ἰησοῦς, Τοσούτῳ χρόνῳ μεθ᾿ ὑμῶν εἰμι καὶ οὐκ ἔγνωκάς με, Φίλιππε; <strong>ὁ ἑωρακὼς ἐμὲ ἑώρακεν τὸν πατέρα</strong>· πῶς σὺ λέγεις, Δεῖξον ἡμῖν τὸν πατέρα;» (<a href="https://bibleox.com/el/gr-lxx-byz/in/14/#L8-9">Ιω 14:8-9</a>)</p></blockquote><h3>Όποιος δεν τιμά την εικόνα του Πατέρα, δεν τιμά ούτε τον Πατέρα</h3><blockquote><p>«ἵνα πάντες τιμῶσι τὸν υἱὸν καθὼς τιμῶσι τὸν πατέρα. <strong>ὁ μὴ τιμῶν τὸν υἱὸν οὐ τιμᾷ τὸν πατέρα</strong> τὸν πέμψαντα αὐτόν.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/5/#L23">Ιω 5:23</a>)</p></blockquote><h3>Όποιος απορρίπτει την εικόνα του Πατέρα, δεν έχει ούτε τον Πατέρα</h3><blockquote><p>«<strong>πᾶς ὁ ἀρνούμενος τὸν υἱὸν οὐδὲ τὸν πατέρα ἔχει</strong>· ὁ ὁμολογῶν τὸν υἱὸν καὶ τὸν πατέρα ἔχει.» (<a href="https://bibleox.com/el/gr-lxx-byz/1in/2/#L23">Α Ιω 2:23</a>)</p></blockquote><h3>Όποιος μισεί την εικόνα του Πατέρα, μισεί και τον Πατέρα</h3><blockquote><p>«<strong>ὁ ἐμὲ μισῶν καὶ τὸν πατέρα μου μισεῖ</strong>. &lt;…&gt; εἰ τὰ ἔργα μὴ ἐποίησα ἐν αὐτοῖς ἃ οὐδεὶς ἄλλος ἐποίησεν, ἁμαρτίαν οὐκ εἴχοσαν· νῦν δὲ καὶ ἑωράκασιν καὶ <strong>μεμισήκασιν καὶ ἐμὲ καὶ τὸν πατέρα μου</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/15/#L23-24">Ιω 15:23-24</a>)</p></blockquote><h3>Στην εικόνα του Πατέρα πρέπει να προσκυνήσει όλη η κτίση</h3><blockquote><p>«ἵνα <strong>ἐν τῷ ὀνόματι Ἰησοῦ πᾶν γόνυ κάμψῃ ἐπουρανίων καὶ ἐπιγείων καὶ καταχθονίων</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/fil/2/#L10">Φιλ 2:10</a>)</p></blockquote><h2>Ο Θεός θεραπεύει μέσω της εικόνας των αγίων</h2><p>Ο Θεός δίνει στους ανθρώπους θεραπεία όχι μόνο μέσω των ενδυμάτων που έμειναν από τους αγίους αποστόλους (<a href="https://bibleox.com/el/gr-lxx-byz/act/19/#L12">Πραξ 19:12</a>),<em> αλλά</em> ακόμη και μέσω της εικόνας του αποστόλου (της σκιάς):</p><blockquote><p>«ὥστε καὶ εἰς τὰς πλατείας <strong>ἐκφέρειν τοὺς ἀσθενεῖς</strong> καὶ τιθέναι ἐπὶ κλιναρίων καὶ κραβάττων, <strong>ἵνα ἐρχομένου Πέτρου κἂν ἡ σκιὰ ἐπισκιάσῃ τινὶ αὐτῶν</strong>. συνήρχετο δὲ καὶ τὸ πλῆθος τῶν πέριξ πόλεων Ἰερουσαλήμ, φέροντες ἀσθενεῖς καὶ ὀχλουμένους ὑπὸ πνευμάτων ἀκαθάρτων, <strong>οἵτινες ἐθεραπεύοντο ἅπαντες</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/5/#L15-16">Πραξ 5:15-16</a>)</p></blockquote><h2>Ο Θεός δεν απαντά στους ειδωλολάτρες</h2><blockquote><p><em>«διὰ τοῦτο λάλησον αὐτοῖς καὶ ἐρεῖς πρὸς αὐτούς Τάδε λέγει κύριος Ἄνθρωπος ἄνθρωπος ἐκ τοῦ οἴκου Ισραηλ, </em><strong><em>ὃς ἂν θῇ τὰ διανοήματα αὐτοῦ ἐπὶ τὴν καρδίαν αὐτοῦ</em></strong><em> καὶ τὴν κόλασιν τῆς ἀδικίας αὐτοῦ τάξῃ πρὸ προσώπου αὐτοῦ καὶ ἔλθῃ πρὸς τὸν προφήτην, </em><strong><em>ἐγὼ κύριος ἀποκριθήσομαι αὐτῷ ἐν οἷς ἐνέχεται ἡ διάνοια αὐτοῦ</em></strong><em>» (</em><a href="https://bibleox.com/el/gr-lxx-byz/iez/14/#L4"><em>Ιεζ 14:4</em></a><em>)</em></p></blockquote><blockquote><p><em>«ὅπως πλαγιάσῃ τὸν οἶκον τοῦ Ισραηλ κατὰ τὰς καρδίας αὐτῶν </em><strong><em>τὰς ἀπηλλοτριωμένας ἀπ᾿ ἐμοῦ ἐν τοῖς ἐνθυμήμασιν αὐτῶν</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/iez/14/#L5"><em>Ιεζ 14:5</em></a><em>)</em></p></blockquote><blockquote><p><em>«καὶ ἐν ταῖς ἀπαρχαῖς τῶν δομάτων ὑμῶν ἐν τοῖς ἀφορισμοῖς ὑμεῖς </em><strong><em>μιαίνεσθε ἐν πᾶσιν τοῖς ἐνθυμήμασιν ὑμῶν</em></strong><em> ἕως τῆς σήμερον ἡμέρας. καὶ ἐγὼ ἀποκριθῶ ὑμῖν, οἶκος τοῦ Ισραηλ; ζῶ ἐγώ, λέγει κύριος, </em><strong><em>εἰ ἀποκριθήσομαι ὑμῖν</em></strong><em>, καὶ εἰ ἀναβήσεται ἐπὶ τὸ πνεῦμα ὑμῶν τοῦτο.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/iez/20/#L31"><em>Ιεζ 20:31</em></a><em>)</em></p></blockquote><p>Ωστόσο, οι αντίπαλοι των εικόνων συνήθως παραδέχονται ότι οι ορθόδοξοι που τιμούν τις εικόνες μπορούν να έχουν κοινωνία με τον Θεό. Αλλά στη Γραφή είναι γραμμένο ότι ο Θεός δεν απαντά στους ειδωλολάτρες.</p><h2>Μπορεί η εικόνα να σώζει;</h2><p>Οι ορθόδοξοι κατηγορούνται ότι κάποιος μπορεί να χρησιμοποιεί εκφράσεις όπως «η εικόνα έσωσε» ή «η εικόνα θεράπευσε». Σώζει και θεραπεύει ο Θεός, και, αν και τέτοιες εκφράσεις όπως «η εικόνα έσωσε» συνήθως δεν τις χρησιμοποιούμε, είναι παραδεκτές, αν εννοείται ότι δεν θεράπευσε και έσωσε το ίδιο το υλικό της εικόνας, αλλά ο Θεός μέσω του υλικού.</p><h3>Ο απόστολος σώζει</h3><blockquote><p>«εἴ πως παραζηλώσω μου τὴν σάρκα καὶ <strong>σώσω τινὰς ἐξ αὐτῶν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/11/#L14">Ρωμ 11:14</a>)</p></blockquote><blockquote><p>«ἐγενόμην τοῖς ἀσθενέσιν ἀσθενής, ἵνα τοὺς ἀσθενεῖς κερδήσω· <strong>τοῖς πᾶσιν γέγονα πάντα, ἵνα πάντως τινὰς σώσω</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/9/#L22">Α Κορ 9:22</a>)</p></blockquote><h3>Η γυναίκα σώζει</h3><blockquote><p>«τί γὰρ οἶδας, <strong>γύναι, εἰ τὸν ἄνδρα σώσεις</strong>; ἢ τί οἶδας, <strong>ἄνερ</strong>, <strong>εἰ τὴν γυναῖκα σώσεις</strong>;» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/7/#L16">Α Κορ 7:16</a>)</p></blockquote><h3>Το αποστολικό κάλεσμα να σώζουμε ανθρώπους</h3><blockquote><p>«καὶ οὓς μὲν ἐλεᾶτε διακρινομένους, οὓς δὲ <strong>σῴζετε</strong> ἐκ πυρὸς ἁρπάζοντες, οὓς δὲ ἐλεᾶτε ἐν φόβῳ, μισοῦντες καὶ τὸν ἀπὸ τῆς σαρκὸς ἐσπιλωμένον χιτῶνα.» (<a href="https://bibleox.com/el/gr-lxx-byz/iud/1/#L22-23">Ιούδα 1:22-23</a>)</p></blockquote><blockquote><p>«ἔπεχε σεαυτῷ καὶ τῇ διδασκαλίᾳ· ἐπίμενε αὐτοῖς· τοῦτο γὰρ ποιῶν καὶ σεαυτὸν <strong>σώσεις</strong> καὶ <strong>τοὺς ἀκούοντάς σου</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1tim/4/#L16">Α Τιμ 4:16</a>)</p></blockquote><h3>Μήπως εκτός από τον Χριστό μπορεί κάποιος άλλος να σώζει;</h3><p>Ούτε ο απόστολος, ούτε οι γυναίκες με τους άνδρες τους είναι σωτήρες με την έννοια με την οποία είναι σωτήρας ο Κύριος Ιησούς Χριστός — ο μόνος λυτρωτής και ελευθερωτής της ανθρωπότητας από τον θάνατο και τον άδη, που χαρίζει ανάσταση και αιώνια ζωή με τον Θεό. Ωστόσο οι εκφράσεις «εγώ θα σώσω», όπως φαίνεται, επιτρέπονται από τους αποστόλους. Το νόημα τέτοιων εκφράσεων το καταλαβαίνουμε σωστά — οι άνθρωποι μπορούν να συνεργούν στη σωτηρία: «<em>Είμαστε </em><strong><em>συνεργοί</em></strong><em> του Θεού</em>» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/3/#L9">Α Κορ 3:9</a>).</p><p>Το ίδιο και με την εικόνα: δεν σώζει η εικόνα, αλλά σώζει ο Θεός, ο Θεός στέλνει τη χάρη μέσω του αντικειμένου. Στη Γραφή βρίσκουμε πολλά τέτοια παραδείγματα, για τα οποία θα μιλήσουμε παρακάτω.</p><h2>Για την έκφραση: η εικόνα — παράθυρο στον πνευματικό κόσμο</h2><p>Η εικόνα είναι σαν <strong>παράθυρο στον πνευματικό κόσμο</strong>. Αυτή η έκφραση δεν έχει μυστηριώδη νοήματα και είναι μεταφορική έκφραση. Σημαίνει μόνο ότι, κοιτάζοντας την εικόνα, σαν να κοιτάμε στον αόρατο πνευματικό κόσμο, όπως από ένα παράθυρο.</p><p>Τα πνευματικά πράγματα είναι αόρατα, αλλά ο αγιογράφος απεικονίζει το αόρατο στην εικόνα ορατά, χρησιμοποιώντας σύμβολα. Έτσι, για παράδειγμα, η παρουσία της θείας χάρης στους αγίους απεικονίζεται με τη μορφή φωτοστέφανου γύρω από το κεφάλι τους, η απουσία σκιών σημαίνει παρουσία στο θείο φως (που δεν είναι συνηθισμένο φως, δεν ρίχνει σκιές), τα νοήματα βρίσκονται στις χειρονομίες των χεριών, στα χρώματα των ενδυμάτων, σε ιδιαίτερα σημάδια στα ενδύματα (τρία αστέρια στη Θεοτόκο), στα γύρω αντικείμενα, στα κτίρια, στον χώρο γενικά. Κοιτάζοντας όλα αυτά, μαθαίνουμε κάτι για τον αόρατο πνευματικό κόσμο. Ακριβώς γι’ αυτό μερικές φορές χρησιμοποιείται η έκφραση ότι η εικόνα είναι σαν παράθυρο στον πνευματικό κόσμο (περισσότερα).</p><p>Γιατί χρειάζεται να το εξηγήσουμε αυτό ξεχωριστά; Επειδή συχνά συναντά κανείς πώς οι αντίπαλοι της Ορθόδοξης Εκκλησίας, ψάχνοντας κάτι για να συνθέσουν τις κατηγορίες τους, απλώς επινοούν κατηγορίες, για να τις ενσταλάξουν στους οπαδούς τους, καλλιεργώντας σ’ αυτούς το μίσος κατά της Ορθόδοξης Εκκλησίας. Έτσι, για παράδειγμα, θέλοντας να δείξουν τους ορθοδόξους σιχαμερούς μάγους, οι αντίπαλοι της Εκκλησίας επινοούν ότι οι ορθόδοξοι δήθεν συνδέονται με τον Θεό μέσω των εικόνων, σαν μέσω κάποιας ενεργειακής πύλης, και γι’ αυτό έχουν ανάγκη από εικόνες για την κοινωνία με τον Θεό. Όλα αυτά είναι απλώς αναληθή.</p><p>Η Ορθόδοξη Εκκλησία καλεί τους πιστούς στην προσευχή παντού, ανεξάρτητα από την ύπαρξη εικόνων. Η εικόνα είναι μόνο ένα βοηθητικό μέσο για την πνευματική οικοδομή και την προσευχή. Στην προσευχή η εικόνα βοηθά να συγκεντρώσει κανείς τις σκέψεις: να μη διασκορπίζεται, να μην αποσπάται. Επίσης η εικόνα είναι μέσο για την έκφραση σεβασμού προς το πρόσωπο που απεικονίζεται σ’ αυτήν. Διάφορα αντικείμενα, μεταξύ τους και οι εικόνες, μπορούν να γίνουν μέσο μέσω του οποίου ο Θεός μεταδίδει στους ανθρώπους τη χάρη Του· γι’ αυτό θα μιλήσουμε πιο αναλυτικά στην επόμενη ενότητα.</p><h2>Η θεία ενέργεια μέσω αντικειμένων και εικόνων</h2><p>Οι ορθόδοξοι κατηγορούνται ότι περιμένουν κάποια θεία βοήθεια όχι μόνο απευθείας από τον Θεό, αλλά και μέσω αντικειμένων και εικόνων. Αλλά και αυτή η πίστη δεν αντιβαίνει στη Γραφή, στην οποία πολλές φορές ο Θεός ενήργησε μέσω αντικειμένων και εικόνων.</p><h3>Τα λείψανα</h3><p>Ανάσταση μέσω λειψάνων. Δεν βλέπουμε εδώ ούτε την πίστη κάποιου, ούτε προσευχή, τίποτε άλλο εκτός από την τυχαία επαφή ενός νεκρού με τα λείψανα του προφήτη:</p><blockquote><p><em>«καὶ ἐγένετο αὐτῶν </em><strong><em>θαπτόντων τὸν ἄνδρα</em></strong><em> καὶ ἰδοὺ εἶδον τὸν μονόζωνον καὶ ἔρριψαν τὸν ἄνδρα ἐν τῷ τάφῳ Ελισαιε, καὶ ἐπορεύθη καὶ </em><strong><em>ἥψατο τῶν <mark>ὀστέων Ελισαιε</mark> καὶ ἔζησεν καὶ ἀνέστη ἐπὶ τοὺς πόδας αὐτοῦ</em></strong><em>. —» (</em><a href="https://bibleox.com/el/gr-lxx-byz/4ts/13/#L21"><em>Δ Βασ 13:21</em></a><em>)</em></p></blockquote><h3>Τα ενδύματα</h3><blockquote><p><em>«ὥστε καὶ </em><strong><em>ἐπὶ τοὺς ἀσθενοῦντας ἀποφέρεσθαι ἀπὸ τοῦ χρωτὸς αὐτοῦ <mark>σουδάρια ἢ σιμικίνθια</mark> καὶ ἀπαλλάσσεσθαι ἀπ᾿ αὐτῶν τὰς νόσους</em></strong><em>, τά τε πνεύματα τὰ πονηρὰ ἐκπορεύεσθαι.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/act/19/#L12"><em>Πραξ 19:12</em></a><em>)</em></p></blockquote><h3>Η εικόνα</h3><blockquote><p>«ὥστε καὶ εἰς τὰς πλατείας <strong>ἐκφέρειν τοὺς ἀσθενεῖς</strong> καὶ τιθέναι ἐπὶ κλιναρίων καὶ κραβάττων, <strong>ἵνα ἐρχομένου Πέτρου κἂν ἡ σκιὰ ἐπισκιάσῃ τινὶ αὐτῶν</strong>. συνήρχετο δὲ καὶ τὸ πλῆθος τῶν πέριξ πόλεων Ἰερουσαλήμ, φέροντες ἀσθενεῖς καὶ ὀχλουμένους ὑπὸ πνευμάτων ἀκαθάρτων, <strong>οἵτινες ἐθεραπεύοντο ἅπαντες</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/5/#L15-16">Πραξ 5:15-16</a>)</p></blockquote><h3>Το νερό</h3><blockquote><p><em>«καὶ εἶπεν αὐτῷ, Ὕπαγε </em><strong><em>νίψαι εἰς τὴν κολυμβήθραν τοῦ <mark>Σιλωάμ</mark></em></strong><em> [ὃ ἑρμηνεύεται Ἀπεσταλμένος]. </em><strong><em>ἀπῆλθεν οὖν καὶ ἐνίψατο, καὶ ἦλθεν βλέπων</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/in/9/#L7"><em>Ιω 9:7</em></a><em>)</em> — το χωρίο Ιω 5:4 (ο άγγελος που τάραζε το νερό) δεν υπάρχει στο κείμενο της Ελληνικής Βίβλου που παραθέτουμε· παραθέτουμε ένα χωρίο όπου το νερό συνδέεται με τη θεραπεία.</p></blockquote><h3>Επίσης</h3><p><a href="https://bibleox.com/el/el/w/%CE%9F%CE%B9_%CE%B8%CE%B5%CF%81%CE%B1%CF%80%CE%B5%CE%AF%CE%B5%CF%82">Οι θεραπείες</a></p><h2>Η διδασκαλία της Ορθόδοξης Εκκλησίας για την τιμή των εικόνων</h2><h3>Το δόγμα για την τιμή των εικόνων των 367 αγίων πατέρων της Ζ΄ Οικουμενικής Συνόδου, της Νικαίας (787)</h3><blockquote><p>Διαφυλάττουμε απαραχάρακτες όλες τις εκκλησιαστικές παραδόσεις, που έχουν κατοχυρωθεί γραπτώς ή προφορικώς. <strong>Μία από αυτές προστάζει να κατασκευάζουμε ζωγραφικές εικόνες· επειδή αυτό συμφωνεί με την ιστορία του ευαγγελικού κηρύγματος, αποτελεί επιβεβαίωση ότι ο Θεός Λόγος αληθινά, και όχι φαινομενικά, έγινε άνθρωπος, και μας ωφελεί· γιατί τα πράγματα που εξηγούν το ένα το άλλο, αναμφίβολα και αποδεικνύουν το ένα το άλλο</strong>. Γι’ αυτό, εμείς που βαδίζουμε τη βασιλική οδό και ακολουθούμε τη θεία διδασκαλία των αγίων πατέρων μας και την παράδοση της καθολικής Εκκλησίας — γιατί γνωρίζουμε ότι σ’ αυτήν κατοικεί το Άγιο Πνεύμα — με κάθε επιμέλεια και σύνεση ορίζουμε να <strong><mark>προσφέρονται οι άγιες και σεπτές εικόνες (για προσκύνηση) ακριβώς όπως και η εικόνα του τιμίου και ζωοποιού σταυρού</mark></strong>, είτε είναι φτιαγμένες από χρώματα είτε από (ψηφιδωτές) πλάκες είτε από οποιαδήποτε άλλη ύλη, αρκεί να είναι φτιαγμένες με πρέποντα τρόπο, και είτε βρίσκονται στις άγιες εκκλησίες του Θεού πάνω σε ιερά σκεύη και ενδύματα, σε τοίχους και σε σανίδες, είτε σε σπίτια και κοντά στους δρόμους, και <strong>είτε είναι εικόνες του Κυρίου και Θεού και Σωτήρος μας Ιησού Χριστού, είτε της αχράντου Δέσποινας μας της αγίας Θεοτόκου, είτε των τιμίων αγγέλων και όλων των αγίων και δικαίων ανδρών</strong>. — Όσο πιο συχνά, με τη βοήθεια των εικόνων, γίνονται αντικείμενο της θεωρίας μας, τόσο περισσότερο όσοι κοιτάζουν αυτές τις εικόνες <strong><mark>διεγείρονται σε ανάμνηση των ίδιων των πρωτοτύπων, αποκτούν περισσότερη αγάπη προς αυτά και λαμβάνουν περισσότερα κίνητρα να τους αποδίδουν ασπασμό, τιμή και προσκύνηση, αλλά σε καμία περίπτωση εκείνη την αληθινή λατρεία, που, κατά την πίστη μας, αρμόζει μόνο στη θεία φύση</mark></strong>. <strong>Διεγείρονται να προσφέρουν στις εικόνες θυμίαμα προς τιμήν τους και να τις φωτίζουν, όπως γίνεται αυτό και προς τιμήν της εικόνας του τιμίου και ζωοποιού σταυρού, των αγίων αγγέλων και των άλλων ιερών προσφορών, και όπως, από ευσεβή πόθο, γινόταν αυτό συνήθως και στην αρχαιότητα</strong>· γιατί <strong><mark>η τιμή που αποδίδεται στην εικόνα περνά στο πρωτότυπό της και όποιος προσκυνά την εικόνα προσκυνά την υπόσταση του εικονιζομένου σ’ αυτήν</mark></strong>. Αυτή η διδασκαλία βρίσκεται στους αγίους πατέρες μας, δηλαδή στην παράδοση της καθολικής Εκκλησίας, στην οποία το Ευαγγέλιο πέρασε διαδοχικά από τον έναν πατέρα στον άλλο.</p></blockquote><p>(Ζ΄ Οικουμενική Σύνοδος, Πράξη 7)</p><h3>Ιερεμίας, πατριάρχης Κωνσταντινουπόλεως (1576)</h3><blockquote><p>Στο εικοστό πρώτο και τελευταίο από όλα κεφάλαιο, που πραγματεύεται την τιμή των αγίων και ότι η ανάμνηση των αγίων ωφελεί στην ενίσχυση της πίστης μας, αν σ’ αυτό σκεφτόμαστε πώς εκείνοι με την πίστη έλαβαν τη θεία χάρη και βοήθεια — λέμε ότι <strong>η επίκληση αρμόζει κυρίως μόνο σε σχέση με τον ένα Θεό, και σ’ Αυτόν αναφέρεται κατεξοχήν και κυρίως· ενώ εκείνη που γίνεται προς τους αγίους δεν είναι με την κύρια έννοια, αλλά στρέφεται σ’ αυτούς, τρόπον τινά, κατά συμβεβηκός και κατά χάρη. Γιατί δεν είναι ο Πέτρος ή ο Παύλος που ακούει εκείνους που τους επικαλούνται, αλλά η χάρη που έχουν</strong>, κατά τον λόγο του Κυρίου: «εγώ είμαι μαζί σας έως τη συντέλεια του αιώνα» (Μτ 28:20).</p><p>Ο θείος Παύλος, γράφοντας προς τους Ρωμαίους, για την επίκληση του Θεού λέει: «πώς θα επικαλεστούν εκείνον στον οποίο δεν πίστεψαν;» (Ρωμ 10:14). — Δείχνοντας μ’ αυτό ότι πρέπει να επικαλούμαστε μόνο εκείνον τον ένα, στον οποίο πιστέψαμε, δηλαδή τον Θεό. <strong>Και ότι κι εμείς στρέφουμε τις επικλήσεις μας κυρίως προς τον ένα Θεό, αυτό φαίνεται από το ότι στη θεία μυσταγωγία φωνάζουμε: «Πάτερ ημών» κ.λπ. Και αλλού: «Κύριε των δυνάμεων, μεθ’ ημών γενού, άλλον γαρ εκτός σου βοηθόν εν θλίψεσιν ουκ έχομεν». Και πάλι: «άλλον εκτός σου Θεό δεν γνωρίζουμε». Μεσίτες όμως κάνουμε όλους τους αγίους, και προπάντων τη Μητέρα του Κυρίου, και μαζί της τον χορό των αγγέλων και των αγίων, και τους τιμούμε με ναούς, αφιερώσεις, επικλήσεις, ιερές εικόνες, σχετικώς και όχι λατρευτικώς. Γιατί <mark>γνωρίζουμε ότι η λατρεία πρέπει να αποδίδεται κατεξοχήν στον ένα Θεό, και εκτός από Αυτόν δεν πρέπει να αναγνωρίζουμε κανέναν άλλο ως Θεό, ούτε να προσκυνούμε «ξένον θεόν» (Ψλ 80:10)</mark></strong>. Προτιμότερο να μη θέλουμε οι ίδιοι να γίνουμε άγιοι, παρά να φοβόμαστε μήπως πέσουμε, μέσω της σχετικής τιμής, στη θεοποίηση. Ας μη γένοιτο· γιατί <strong><mark>είναι ασεβές και ξένο προς την Εκκλησία του Χριστού και τα παιδιά της να μην προσκυνούμε, σχετικώς, τις άγιες εικόνες, γιατί η τιμή τους περνά στο πρωτότυπο</mark></strong>, όπως λέει ο Μέγας Βασίλειος: αναγνωρίζουμε και όλους τους αγίους ως μεσίτες και πρεσβευτές μας, και λέμε ότι όχι μόνο στον παρόντα αλλά και στον μέλλοντα αιώνα θα υπάρξει κάποια μεσιτεία, γιατί για μερικούς θα δεηθούν άγγελοι και άγιοι, και όχι λιγότερο η Δέσποινα του κόσμου, όμως όχι για όλους γενικά, και για κανέναν που πέθανε μες στις αμαρτίες — καθόλου· γιατί ο Θεός γι’ αυτούς έκλεισε εντελώς το έλεός Του, γι’ αυτό και αποκάλυψε γι’ αυτούς τα εξής: «αν υπάρχουν Νώε, Δανιήλ και Ιώβ, δεν θα σώσουν ούτε γιους ούτε θυγατέρες τους» (Ιεζ 14:14,18). Μόνο για εκείνους θα παρακαλούν όλοι τον Θεό, για τους οποίους η μεσιτεία είναι ευπρόσδεκτη, δηλαδή για εκείνους που πρόλαβαν το τέλος της ζωής τους με μετάνοια, αλλά δεν μπόρεσαν ακόμη να καθαριστούν από τις ακαθαρσίες των αμαρτιών, και μόνο για όσο ακόμη συνεχίζεται η κρίση. Όταν όμως τελειώσει αυτό το θέαμα, όταν ο καθένας οδηγηθεί στον καθορισμένο τόπο της τιμωρίας, η μεσιτεία δεν είναι δυνατή και δεν θα υπάρχει. Αυτή η μεσιτεία γίνεται και τώρα και αναγγέλλεται στην Εκκλησία: επικαλούμαστε και τους αγίους, και τη Δέσποινα μας, και τους αγίους αγγέλους. Τη Δέσποινα μας έτσι: «Υπεραγία Δέσποινα Θεοτόκε, πρέσβευε υπέρ ημών των αμαρτωλών»· τους αγίους αγγέλους: «Πάσαι αι επουράνιοι Δυνάμεις, άγιοι Άγγελοι και Αρχάγγελοι, πρεσβεύσατε υπέρ ημών των αμαρτωλών»· — παρόμοια και προς τον προφήτη Πρόδρομο και Βαπτιστή του Κυρίου, τους ενδόξους αποστόλους, προφήτες, μάρτυρες, οσίους, ποιμένες, διδασκάλους της οικουμένης και όλους τους άλλους αγίους. Ζητάμε και από τον χορό των αγίων γυναικών να παρακαλούν για μας τους αμαρτωλούς· ζητάμε από τον Θεό, με τη χάρη Του και την ανίκητη, ακατάληπτη, θεία δύναμη του σταυρού, να είναι ελεήμων προς εμάς που Τον υπηρετούμε, που μένουμε στην ομολογία και τη μετάνοια, και ζητάμε τον φωτισμό των ματιών της ψυχής μας, για να μην κοιμηθούμε μες στις αμαρτίες στον θάνατο, και για να μη δυναμώσει ο εχθρός εναντίον μας. Έτσι, με τη μεσιτεία όλων εκείνων για τους οποίους μιλήσαμε, παρακαλούμε τον Θεό να μας ελεήσει και να μας βγάλει από τα δίχτυα του πονηρού.</p></blockquote><p>(Απάντηση στους Λουθηρανούς, πρώτη)</p><p>Υπάρχει επίσης μια μακρύτερη δεύτερη απάντηση στους Λουθηρανούς με λεπτομερή ανάλυση της τιμής των εικόνων: η δεύτερη απάντηση.</p><p>Και μια τρίτη σύντομη απάντηση: η τρίτη απάντηση.</p><h3>Η επιστολή των πατριαρχών της ανατολικής καθολικής Εκκλησίας για την ορθόδοξη πίστη (1723)</h3><blockquote><p>Πώς πρέπει να σκεφτόμαστε για τις άγιες εικόνες και για την προσκύνηση των αγίων;</p><p>Απάντηση. Επειδή υπάρχουν άγιοι, και η Καθολική Εκκλησία τους αναγνωρίζει ως προστάτες, γι’ αυτό <strong><mark>τους τιμούμε ως φίλους του Θεού, που προσεύχονται για μας στον Θεό των όλων</mark></strong>. Η τιμή όμως των αγίων είναι διπλή: η μία αναφέρεται στη Μητέρα του Θεού Λόγου, την οποία τιμούμε περισσότερο απ’ ό,τι αρμόζει σε δούλη του Θεού, γιατί η Θεοτόκος, αν και είναι αληθινά δούλη του ενός Θεού, είναι όμως και Μητέρα, που γέννησε κατά σάρκα τον ένα της Τριάδος. Γι’ αυτό και την υμνούμε ως ανώτερη ασυγκρίτως από όλους τους αγγέλους και τους αγίους, και της αποδίδουμε προσκύνηση μεγαλύτερη από εκείνη που αρμόζει σε δούλη του Θεού. Η άλλη προσκύνηση, που αρμόζει στους δούλους του Θεού, αναφέρεται στους αγίους αγγέλους, αποστόλους, προφήτες, μάρτυρες και γενικά σε όλους τους αγίους. Επιπλέον <strong>τιμούμε με προσκύνηση το ξύλο του τιμίου και ζωοποιού Σταυρού, πάνω στον οποίο ο Σωτήρας μας έπαθε για τη σωτηρία του κόσμου, την εικόνα του ζωοποιού Σταυρού, τη φάτνη της Βηθλεέμ, με την οποία λυτρωθήκαμε από την αλογία, τον τόπο του Γολγοθά, τον ζωοδόχο Τάφο και τους άλλους αγίους τόπους, καθώς και το άγιο Ευαγγέλιο, τα ιερά σκεύη στα οποία τελείται η αναίμακτη Θυσία, τιμούμε και δοξάζουμε τους αγίους με τις ετήσιες αναμνήσεις τους, με πανδήμους εορτές, με την οικοδόμηση αγίων ναών και με προσφορές</strong>. <strong>Ακόμη</strong> <strong>προσκυνούμε τις εικόνες του Κυρίου μας Ιησού Χριστού, της Υπεραγίας Θεοτόκου και όλων των αγίων· τιμούμε αυτές τις εικόνες και τις ασπαζόμαστε, καθώς και τις εικόνες των αγίων αγγέλων, όπως εμφανίστηκαν σε μερικούς πατριάρχες και προφήτες· απεικονίζουμε και το Πανάγιο Πνεύμα</strong> όπως φάνηκε με τη μορφή περιστεράς.</p><p><strong>Αν όμως μερικοί, για την προσκύνηση των αγίων εικόνων, μας κατηγορούν για ειδωλολατρία, τότε αυτή την κατηγορία τη θεωρούμε κενή και ανόητη· γιατί δεν λατρεύουμε κανέναν άλλο, παρά μόνο τον ένα εν Τριάδι Θεό</strong>. Τους αγίους όμως τους τιμούμε διπλά. Πρώτον, σε σχέση με τον Θεό, γιατί για χάρη Του μακαρίζουμε τους αγίους· δεύτερον, σε σχέση με τους ίδιους τους αγίους, αφού είναι ζωντανές εικόνες του Θεού. Επιπλέον, τιμώντας τους αγίους ως δούλους του Θεού, <strong><mark>τιμούμε τις άγιες εικόνες σχετικώς — η τιμή των εικόνων αναφέρεται στα πρωτότυπα· γιατί όποιος προσκυνά την εικόνα, διά της εικόνας προσκυνά το πρωτότυπο· έτσι ώστε με κανέναν τρόπο δεν μπορεί να χωριστεί η τιμή της εικόνας από την τιμή εκείνου που απεικονίζεται σ’ αυτήν· αλλά και τα δύο μένουν σε ενότητα, όπως ακριβώς η τιμή που αποδίδεται στον βασιλικό απεσταλμένο είναι αδιαχώριστη από την τιμή που αποδίδεται στον ίδιο τον Βασιλιά</mark></strong>.</p><p>Εκείνα τα χωρία που παίρνουν οι αντίπαλοι από τη Γραφή, για να στηρίξουν την ανοησία τους, δεν τους ευνοούν τόσο όσο νομίζουν· αντίθετα, συμφωνούν απόλυτα με τη γνώμη μας. Γιατί, <strong>διαβάζοντας τη θεία Γραφή, εξετάζουμε τον χρόνο, το πρόσωπο, τα παραδείγματα και τις αιτίες. Γι’ αυτό, αν βρίσκουμε ότι ο ίδιος Θεός σε ένα σημείο λέει: «Μη κάνεις για τον εαυτό σου είδωλο ούτε ομοίωμα, για να μην τα προσκυνήσεις ούτε να τα λατρέψεις», και σε άλλο σημείο προστάζει να κατασκευάσουν Χερουβίμ</strong>· και αν επιπλέον βλέπουμε στον ναό φτιαγμένες εικόνες βοδιών και λιονταριών, όλα αυτά δεν τα δεχόμαστε με δεισιδαιμονία (γιατί η δεισιδαιμονία δεν είναι πίστη)· αλλά, όπως είπαμε, συνυπολογίζοντας τον χρόνο και τις άλλες περιστάσεις, <strong><mark>φτάνουμε στη σωστή κατανόηση. Τα λόγια «Μη κάνεις για τον εαυτό σου είδωλο ή ομοίωμα», κατά τη γνώμη μας, σημαίνουν το ίδιο με τα λόγια: μην προσκυνάς ξένους θεούς, μην ειδωλολατρείς</mark></strong>. — Έτσι, και το έθιμο που κρατά η Εκκλησία από τους αποστολικούς χρόνους, να προσκυνά τις άγιες εικόνες, και η λατρεία που αρμόζει στον ένα Θεό, θα μείνουν απαραχάρακτα, και ο Θεός δεν θα αντιφάσκει στα λόγια Του. Όσο για το ότι οι αντίπαλοί μας επικαλούνται τους αγίους Πατέρες, που δήθεν λένε ότι δεν αρμόζει να προσκυνάμε τις εικόνες, αυτοί οι άγιοι άνδρες μάλλον μας υπερασπίζονται· γιατί στους αγώνες τους ξεσηκώνονται περισσότερο εναντίον εκείνων που αποδίδουν στις άγιες εικόνες θεϊκή προσκύνηση ή φέρνουν στους ναούς εικόνες των πεθαμένων συγγενών τους· αυτούς τους προσκυνητές τους πλήττουν με ανάθεμα, αλλά δεν κατακρίνουν τη σωστή προσκύνηση των αγίων και των αγίων εικόνων, του τιμίου Σταυρού και όλων των παραπάνω. Και ότι από τους αποστολικούς χρόνους οι άγιες εικόνες χρησιμοποιούνταν στους ναούς και οι πιστοί τις προσκυνούσαν, το μαρτυρούν πάρα πολλοί, μαζί με τους οποίους και η αγία Ζ΄ Οικουμενική Σύνοδος καταισχύνει κάθε αιρετική βλασφημία.</p><p>Επειδή αυτή η Σύνοδος δίνει με τον πιο σαφή τρόπο να καταλάβουμε πώς πρέπει να προσκυνούμε τις άγιες εικόνες, όταν <strong><mark>παραδίδει σε κατάρα και αφορισμό εκείνους που αποδίδουν στις εικόνες θεϊκή προσκύνηση ή αποκαλούν ειδωλολάτρες τους ορθοδόξους που προσκυνούν τις εικόνες, τότε μαζί της και εμείς αναθεματίζουμε εκείνους που ή στον άγιο, ή στον άγγελο, ή στην εικόνα, ή στον Σταυρό, ή στα άγια λείψανα, ή στα ιερά σκεύη, ή στο Ευαγγέλιο, ή σε οτιδήποτε άλλο, όσα είναι στον ουρανό πάνω και όσα στη γη και στη θάλασσα, αποδίδουν τέτοια τιμή, που αρμόζει μόνο στον ένα εν Τριάδι Θεό. Επίσης αναθεματίζουμε και εκείνους που αποκαλούν ειδωλολατρία την προσκύνηση των εικόνων, και γι’ αυτό δεν τις προσκυνούν, δεν τιμούν τον Σταυρό και τους αγίους, όπως πρόσταξε η Εκκλησία</mark></strong>.</p><p>Τους αγίους και τις άγιες εικόνες τις προσκυνούμε όπως είπαμε, και τις ζωγραφίζουμε για τον στολισμό των ναών, για να χρησιμεύουν στους αμόρφωτους αντί για βιβλία και να παροτρύνουν στη μίμηση των αρετών των αγίων και στην ανάμνησή τους, να συντελούν στην αύξηση της αγάπης, στην εγρήγορση και στη διαρκή επίκληση του Κυρίου ως Δεσπότη και Πατέρα, και των αγίων ως δούλων Του, βοηθών και μεσιτών μας.</p></blockquote><p>(Επιστολή των Πατριαρχών του 1723, Ερώτηση 3)</p><h2>Απαντήσεις στην κριτική</h2><h3>Καταργείτε μία από τις δέκα εντολές του Θεού</h3><p>Τηρείτε την <a href="https://bibleox.com/el/el/w/%CE%9F%CE%B9_%CE%94%CE%AD%CE%BA%CE%B1_%CE%95%CE%BD%CF%84%CE%BF%CE%BB%CE%AD%CF%82">4η</a> εντολή για την ανάπαυση του Σαββάτου; Δεν κάνετε κανένα έργο το Σάββατο; Σκοτώνετε εκείνους τους αδελφούς και αδελφές σας που κάνουν έργα το Σάββατο; Τους σκοτώνετε για βλασφημία ή ειδωλολατρία; Αν δεν το κάνετε αυτό, για ποιον λόγο; Μήπως δεν καταργείτε τις εντολές του Θεού; Για χάρη τίνος αγνοείται αυτό το γεγονός, ότι απαιτείτε να τηρείται η 2η εντολή, ενώ εσείς οι ίδιοι δεν τηρείτε την 4η;</p><p>Ο νόμος του Μωυσή έχει καταργηθεί. Οι χριστιανοί ακολουθούν τον Χριστό. Η δεύτερη εντολή προφανώς δεν απαγόρευε τις εικόνες και την τιμή τους, γιατί ο Θεός προστάζει να κάνουν εικόνες στον ναό Του, πρόσταξε να τιμούν τον ναό, και οι προφήτες προσκυνούσαν μπροστά στα ιερά με τις εικόνες. Η εντολή απαγόρευε να απεικονίζουν τον Θεό, και επίσης απαγόρευε την ειδωλολατρία (την τιμή και τη λατρεία ψευδών θεών).</p><h3>Θυμιατίζετε τις εικόνες όπως οι Ισραηλίτες θυμίαζαν τον Νεεσθάν</h3><p>Το λάθος των Ισραηλιτών δεν ήταν ότι θυμίαζαν (το θυμίαμα το θέσπισε ο ίδιος ο Θεός), αλλά ότι επινόησαν μια ψευδή θεότητα, ονομάζοντάς την Νεεσθάν, και αντί να λατρεύουν τον Θεό, άρχισαν να λατρεύουν τον Νεεσθάν που επινόησαν, προφανώς θεωρώντας θεότητα το ίδιο το αντικείμενο, όπως πάντα γινόταν στους Ισραηλίτες (περισσότερα). Δεν επινοήθηκε μόνο το όνομα, αλλά και τρόποι ευαρέστησης του Νεεσθάν, που ακολουθείται και από το επινοημένο θέλημά του (εντολές). Αυτό είναι ειδωλολατρία, δηλαδή λατρεία ψευδών θεών. Απομακρύνει από τον Θεό και τη ζωή κατά το θέλημά Του, οδηγεί στη ζωή κατά το θέλημα του Νεεσθάν (του δημιουργού του).</p><p>Οι ορθόδοξοι απεικονίζουν τον αληθινό Θεό, αποκαλώντας Τον με τα δικά Του ονόματα, εκπληρώνοντας τις εντολές Του, χωρίς να θεωρούν θεό το αντικείμενο (την εικόνα), κάνοντας προσκυνήσεις και θυμίαμα όχι στην εικόνα, αλλά στον Θεό. Αυτό δεν είναι ειδωλολατρία, αφού εδώ δεν υπάρχουν καν ψευδείς θεοί, ούτε λατρεία ψευδών θεών, σε αντίθεση με ό,τι γινόταν στους υπηρέτες του Νεεσθάν.</p><h3>Ο Θεός είπε να απεικονίζουμε, αλλά δεν είπε να τιμούμε</h3><p>Δεν είναι έτσι. Στη Γραφή μπορεί κανείς να δει ότι ο Θεός πρόσταξε και να κάνουν εικόνες και να τις τιμούν. Στη Γραφή υπάρχει και η πρακτική της τιμής των εικόνων.</p><p>Ο Θεός είπε να τιμούν τον ναό, που κατά τη βουλή του ίδιου του Θεού είναι εικόνα της ουράνιας πραγματικότητας. Ο προφήτης Δαβίδ προσκυνούσε μπροστά στον ναό με τις εικόνες, ο προφήτης Ιησούς του Ναυή προσκυνούσε μπροστά στην Κιβωτό της Διαθήκης με τις εικόνες. Έτσι και να τιμούν την εικόνα ο Θεός το πρόσταξε, και οι προφήτες τιμούσαν τα ιερά με τις εικόνες, προσκυνώντας μπροστά τους. Χωρίς αμφιβολία, οι προφήτες απέδιδαν αυτή την τιμή στον Θεό: δηλαδή τιμώντας την εικόνα, τιμούσαν το πρωτότυπο. Ακριβώς το ίδιο κάνουν οι ορθόδοξοι χριστιανοί.</p><h3>Η πρόταση να εγκαταλείψουμε για παν ενδεχόμενο τις εικόνες</h3><p>Αφού άκουσαν τις εξηγήσεις μας, οι αντίπαλοι της τιμής των εικόνων συχνά συμφωνούν ότι η τιμή των εικόνων είναι παραδεκτή, αλλά λένε ότι δεν γνωρίζουν όλοι εμείς αρκετά καλά τη διδασκαλία της Εκκλησίας και εξακολουθούν να αντιμετωπίζουν την εικόνα ως είδωλο, γι’ αυτό, λένε, καλύτερα να αφαιρέσετε τις εικόνες, για να αποφύγετε τον σκανδαλισμό.</p><p>Δεν συμφωνούμε μ’ αυτό, γιατί οι εικόνες είναι αναγκαίες, και η λανθασμένη στάση απέναντί τους πρέπει να αντιμετωπίζεται με τη διαφώτιση και την εξήγηση της σωστής πίστης.</p><p>Μερικοί άνθρωποι καταλαβαίνουν λάθος τη Γραφή, ωστόσο αυτό δεν μας αναγκάζει να εγκαταλείψουμε τη Γραφή για να αποφύγουμε τον σκανδαλισμό. Αυτό μας οδηγεί μόνο στην ανάγκη διαφώτισης και σωστής εξήγησης των βιβλικών λόγων.</p><h3>Απαντήσεις στην κριτική σχετικά με την ιστορία και την πατερική παράδοση</h3><p><a href="https://bibleox.com/ru/ru/w/%D0%B8%D0%BA%D0%BE%D0%BD%D1%8B-%D0%BF%D0%BE%D1%87%D0%B8%D1%82%D0%B0%D1%8E%D1%82" lang="ru">https://bibleox.com/ru/ru/w/иконы-почитают#HH-Критика</a></p><h2>Συμπέρασμα</h2><p>Έτσι, θεωρούμε ότι πλανώνται εκείνοι που εξισώνουν την τιμή των εικόνων με την προσκύνηση ψευδών θεών (ειδώλων), και ότι η κατηγορία των ορθοδόξων για ειδωλολατρία είναι άδικη κατηγορία κατά των πιστών και διαστρεβλωμένη αντίληψη της ορθόδοξης πίστης.</p><p>Η εικόνα είναι απλώς μια σωστή εξήγηση και υπενθύμιση του Θεού, των ανθρώπων και των γεγονότων, αλλά δεν τιμάται ούτε ως Θεός ούτε αντί του Θεού. Δείχνουμε στοιχειώδη σεβασμό σ’ ό,τι έχει σχέση με τον Θεό, όπως οι άνθρωποι σέβονται τη σημαία της χώρας όχι για το ξεχωριστό ύφασμα, αλλά για τον σεβασμό της ίδιας της χώρας, σέβονται το πορτρέτο του προέδρου όχι για το καλό χαρτί και τα χρώματα, αλλά για τον ίδιο τον πρόεδρο, σέβονται τον σταυρό και το Ευαγγέλιο όχι για το σπάνιο είδος ξύλου και το υλικό του βιβλίου, αλλά γιατί πάνω στον σταυρό ο Θεός σταυρώθηκε για τη σωτηρία μας, και στο βιβλίο είναι γραμμένα τα σωτήρια λόγια Του.</p><p>Η εικόνα καλείται να βοηθήσει τους ανθρώπους να δείξουν σεβασμό στον Θεό, στη Μητέρα Του και στους φίλους Του. Η εικόνα μπορεί να βοηθήσει να συγκεντρωθεί κανείς κατά την προσευχή, να κατευθύνει τον νου προς τον Θεό.</p><p>Μερικές φορές, καθόλου με τη θέλησή μας, ο ίδιος ο Θεός φανερώνει θαύματα και θεραπείες μέσω εικόνων και άλλων αντικειμένων, που φυσιολογικά μας οδηγεί στην ιδέα της ιδιαίτερης τιμής αυτού του αντικειμένου, αλλά όχι αντί του Θεού, παρά για χάρη του Θεού, όπως κάποτε ο Θεός είπε στον προφήτη Μωυσή για την ανάγκη σεβασμού της αγίας γης:</p><blockquote><p>«καὶ εἶπεν Μὴ ἐγγίσῃς ὧδε· <strong><mark>λῦσαι τὸ ὑπόδημα</mark> ἐκ τῶν ποδῶν σου· <mark>ὁ γὰρ τόπος</mark>, ἐν ᾧ σὺ ἕστηκας, <mark>γῆ ἁγία ἐστίν</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/3/#L5">Έξ 3:5</a>)</p></blockquote><p>Επίσης και ο προφήτης Δαβίδ είχε ευλάβεια μπροστά στο ιερό και προσκυνούσε το ιερό:</p><blockquote><p>«ὑψοῦτε κύριον τὸν θεὸν ἡμῶν καὶ <strong><mark>προσκυνεῖτε</mark></strong> <strong>τῷ ὑποποδίῳ τῶν ποδῶν αὐτοῦ, ὅτι <mark>ἅγιός ἐστιν</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/98/#L5">Ψλ 98:5</a>)</p></blockquote><p>Και σ’ εκείνους που δεν είχαν τέτοια ευλάβεια, ο Θεός έστελνε θανατική τιμωρία:</p><blockquote><p>«βασιλεῦ, σὺ ἐποιήσω ἑστιατορίαν τοῖς φίλοις σου καὶ ἔπινες οἶνον, καὶ τὰ <strong>σκεύη τοῦ οἴκου τοῦ θεοῦ τοῦ ζῶντος ἠνέχθη σοι</strong>, καὶ <strong>ἐπίνετε ἐν αὐτοῖς</strong> σὺ καὶ οἱ μεγιστᾶνές σου καὶ ᾐνέσατε πάντα τὰ εἴδωλα τὰ χειροποίητα τῶν ἀνθρώπων· καὶ τῷ θεῷ τῷ ζῶντι οὐκ εὐλογήσατε, καὶ τὸ πνεῦμά σου ἐν τῇ χειρὶ αὐτοῦ, καὶ τὸ βασίλειόν σου αὐτὸς ἔδωκέ σοι, καὶ οὐκ εὐλόγησας αὐτὸν οὐδὲ ᾔνεσας αὐτῷ &lt;…&gt; καὶ <strong>τὸ σύγκριμα ἐπῆλθε Βαλτασαρ τῷ βασιλεῖ</strong>, καὶ τὸ βασίλειον ἐξῆρται ἀπὸ τῶν Χαλδαίων καὶ ἐδόθη τοῖς Μήδοις καὶ τοῖς Πέρσαις.» (<a href="https://bibleox.com/el/gr-lxx-byz/dan/5/#L23,30">Δν 5:23,30</a>) — Στους Ο΄ ο θάνατος του Βαλτασάρ δηλώνεται έμμεσα (το σύγκριμα που επήλθε)· κατά το εβραϊκό κείμενο, εκείνη τη νύχτα σκοτώθηκε ο Βαλτασάρ ο βασιλιάς των Χαλδαίων.</p></blockquote><p>Έτσι, μιλώντας απλά, όταν τιμάται <strong>ψευδής </strong>θεός ή δείκτης προς <strong>ψευδή</strong> θεό, τότε αυτό είναι ειδωλολατρία, δηλαδή τιμή και προσκύνηση <u>ψευδούς</u> <u>θεού</u> (ειδώλου). Σε μια τέτοια θρησκευτική τιμή ανθρώπων, αντικειμένων και εικόνων η Ορθόδοξη Εκκλησία δεν διδάσκει και την καταδικάζει.</p><p>Η τιμή του αληθινού Θεού οδηγεί στην τιμή όλων όσων συνδέονται μ’ Αυτόν. Τον Θεό Τον τιμούν ως Θεό, και τους φίλους Του και πιστούς λειτουργούς Του — ως φίλους Του και πιστούς λειτουργούς Του, και όχι ως Θεό. Τον βασιλιά τον σέβονται ως βασιλιά, και τους αυλικούς του — ως αυλικούς, και όχι ως βασιλιά. Σ’ αυτή την τιμή δεν υπάρχει <u>ψευδής</u> <u>θεός</u>. Αυτή την πίστη διδάσκει η Ορθόδοξη Εκκλησία.</p><h2>Σχετικές παραπομπές</h2><ol><li><p><a href="https://bibleox.com/el/el/w/%CE%97_%CF%84%CE%B9%CE%BC%CE%AE_%CF%84%CF%89%CE%BD_%CE%B1%CE%B3%CE%AF%CF%89%CE%BD">https://bibleox.com/el/el/w/Η_τιμή_των_αγίων</a></p></li><li><p><a href="https://bibleox.com/el/el/w/%CE%97_%CF%84%CE%B9%CE%BC%CE%AE_%CF%84%CF%89%CE%BD_%CE%BB%CE%B5%CE%B9%CF%88%CE%AC%CE%BD%CF%89%CE%BD">https://bibleox.com/el/el/w/Η_τιμή_των_λειψάνων</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/%D0%92%D1%8B%D0%B1%D0%BE%D1%80_%D0%BC%D0%B5%D1%81%D1%82%D0%B0_%D0%BA%D0%B0%D0%BA_%D1%84%D0%BE%D1%80%D0%BC%D0%B0_%D0%BF%D0%BE%D1%87%D0%B8%D1%82%D0%B0%D0%BD%D0%B8%D1%8F" lang="ru">https://bibleox.com/ru/ru/w/Выбор_места_как_форма_почитания</a></p></li><li><p><a href="https://bibleox.com/el/el/w/%CE%A0%CF%81%CE%BF%CF%83%CE%B5%CF%85%CF%87%CE%AD%CF%82_%CF%83%CF%84%CE%BF%CF%85%CF%82_%CE%B1%CE%B3%CE%AF%CE%BF%CF%85%CF%82">https://bibleox.com/el/el/w/Προσευχές_στους_αγίους</a></p></li><li><p><a href="https://bibleox.com/el/el/w/%CE%9F_%CE%AC%CE%BD%CE%B8%CF%81%CF%89%CF%80%CE%BF%CF%82_%CE%B5%CE%AF%CE%BD%CE%B1%CE%B9_%CE%BD%CE%B1%CF%8C%CF%82_%CF%84%CE%BF%CF%85_%CE%98%CE%B5%CE%BF%CF%8D">https://bibleox.com/el/el/w/Ο_άνθρωπος_είναι_ναός_του_Θεού</a></p></li><li><p><a href="https://bibleox.com/el/el/w/%CE%97_%CF%83%CF%8D%CF%83%CF%84%CE%B1%CF%83%CE%B7_%CF%84%CE%BF%CF%85_%CE%B1%CE%BD%CE%B8%CF%81%CF%8E%CF%80%CE%BF%CF%85">https://bibleox.com/el/el/w/Η_σύσταση_του_ανθρώπου</a></p></li></ol>'
