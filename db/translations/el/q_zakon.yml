  path: Η_επαφή_με_νεκρό
  title: Η επαφή με νεκρό
  title_sub:
  meta_desc: Βιβλικές ρήσεις για την απαγόρευση του Νόμου του Μωυσή να αγγίζει κανείς νεκρό.
  copy_cover: true
