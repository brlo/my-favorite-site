  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: '<p>Πράξεις για τις οποίες προβλεπόταν θάνατος στην Παλαιά Διαθήκη:</p><ul><li><p>παράτρυνση σε λατρεία ψευδών θεών: <a href="https://bibleox.com/el/gr-lxx-byz/vtor/13/#L6-10">Δτ 13:6-10</a></p></li><li><p>προσφορά θυσίας σε ψευδή θεό: <a href="https://bibleox.com/el/gr-lxx-byz/ish/22/#L20">Έξ 22:20</a></p></li><li><p>προσφορά παιδιών ως θυσίας σε είδωλο: <a href="https://bibleox.com/el/gr-lxx-byz/lev/20/#L2">Λευ 20:2</a></p></li><li><p>βλασφημία: <a href="https://bibleox.com/el/gr-lxx-byz/lev/24/#L16">Λευ 24:16</a></p></li><li><p>μαγεία: <a href="https://bibleox.com/el/gr-lxx-byz/lev/20/#L27">Λευ 20:27</a> · <a href="https://bibleox.com/el/gr-lxx-byz/ish/22/#L18">Έξ 22:18</a></p></li><li><p>ψευδοπροφητεία και αποστασία από τον Θεό: <a href="https://bibleox.com/el/gr-lxx-byz/vtor/13/#L5">Δτ 13:5</a> · <a href="https://bibleox.com/el/gr-lxx-byz/vtor/18/#L20">Δτ 18:20</a></p></li><li><p>παράβαση του Σαββάτου: <a href="https://bibleox.com/el/gr-lxx-byz/ish/31/#L14-15">Έξ 31:14-15</a> · <a href="https://bibleox.com/el/gr-lxx-byz/ish/35/#L2">Έξ 35:2</a></p></li></ul><ul><li><p>φόνος: <a href="https://bibleox.com/el/gr-lxx-byz/ish/21/#L12">Έξ 21:12</a> · <a href="https://bibleox.com/el/gr-lxx-byz/lev/24/#L17">Λευ 24:17</a> · <a href="https://bibleox.com/el/gr-lxx-byz/lev/24/#L21">Λευ 24:21</a> · <a href="https://bibleox.com/el/gr-lxx-byz/chis/35/#L16">Αρ 35:16</a> · <a href="https://bibleox.com/el/gr-lxx-byz/chis/35/#L17">Αρ 35:17</a> · <a href="https://bibleox.com/el/gr-lxx-byz/chis/35/#L18">Αρ 35:18</a> · <a href="https://bibleox.com/el/gr-lxx-byz/chis/35/#L21">Αρ 35:21</a> · <a href="https://bibleox.com/el/gr-lxx-byz/chis/35/#L31">Αρ 35:31</a></p></li><li><p>εξύβριση πατέρα ή μητέρας: <a href="https://bibleox.com/el/gr-lxx-byz/ish/21/#L17">Έξ 21:17</a> · <a href="https://bibleox.com/el/gr-lxx-byz/lev/20/#L9">Λευ 20:9</a></p></li></ul><ul><li><p>χτύπημα πατέρα ή μητέρας: <a href="https://bibleox.com/el/gr-lxx-byz/ish/21/#L15">Έξ 21:15</a></p></li></ul><ul><li><p>απαγωγή ανθρώπου ή πώλησή του ως δούλου: <a href="https://bibleox.com/el/gr-lxx-byz/ish/21/#L16">Έξ 21:16</a> · <a href="https://bibleox.com/el/gr-lxx-byz/vtor/24/#L7">Δτ 24:7</a></p></li></ul><ul><li><p>αμέλεια για ζώο που κερατίζει και σκότωσε άνθρωπο: <a href="https://bibleox.com/el/gr-lxx-byz/ish/21/#L29">Έξ 21:29</a></p></li></ul><ul><li><p>βιασμός: <a href="https://bibleox.com/el/gr-lxx-byz/vtor/22/#L25">Δτ 22:25</a></p></li></ul><ul><li><p>μοιχεία (θανατώνονται και οι δύο που διέπραξαν πορνεία): <a href="https://bibleox.com/el/gr-lxx-byz/lev/20/#L10">Λευ 20:10</a> · <a href="https://bibleox.com/el/gr-lxx-byz/lev/20/#L11">Λευ 20:11</a> · <a href="https://bibleox.com/el/gr-lxx-byz/lev/20/#L12">Λευ 20:12</a> · <a href="https://bibleox.com/el/gr-lxx-byz/vtor/22/#L22">Δτ 22:22</a> · <a href="https://bibleox.com/el/gr-lxx-byz/vtor/22/#L25">Δτ 22:25</a></p></li><li><p>σαρκικές σχέσεις μεταξύ συγγενών: <a href="https://bibleox.com/el/gr-lxx-byz/lev/20/#L11-21">Λευ 20:11-21</a></p></li></ul><ul><li><p>πορνεία της κόρης του ιερέα — η κόρη καίγεται <a href="https://bibleox.com/el/gr-lxx-byz/lev/21/#L9">Λευ 21:9</a></p></li></ul><ul><li><p>σοδομία: <a href="https://bibleox.com/el/gr-lxx-byz/lev/20/#L13">Λευ 20:13</a> · <a href="https://bibleox.com/el/gr-lxx-byz/lev/20/#L15">Λευ 20:15</a> · <a href="https://bibleox.com/el/gr-lxx-byz/lev/20/#L16">Λευ 20:16</a></p></li><li><p>κτηνοβασία: <a href="https://bibleox.com/el/gr-lxx-byz/ish/22/#L19">Έξ 22:19</a></p></li><li><p>ανυπακοή στους ιερείς και τους κριτές: <a href="https://bibleox.com/el/gr-lxx-byz/vtor/17/#L8-12">Δτ 17:8-12</a></p></li><li><p>είσοδος στη Σκηνή του Μαρτυρίου από κοινό άνθρωπο (όχι ιερέα): <a href="https://bibleox.com/el/gr-lxx-byz/chis/3/#L10">Αρ 3:10</a> · <a href="https://bibleox.com/el/gr-lxx-byz/chis/3/#L38">Αρ 3:38</a> · <a href="https://bibleox.com/el/gr-lxx-byz/chis/18/#L7">Αρ 18:7</a></p></li><li><p>απόπειρα μη ιερέα να ιερατεύσει: <a href="https://bibleox.com/el/gr-lxx-byz/chis/3/#L10">Αρ 3:10</a></p></li></ul><ul><li><p>μεταφορά της Σκηνής από κοινό άνθρωπο (όχι λευίτη): <a href="https://bibleox.com/el/gr-lxx-byz/chis/1/#L51">Αρ 1:51</a></p></li></ul><ul><li><p>ανάβαση στο όρος Σιών (διάβαση της οριογραμμής): <a href="https://bibleox.com/el/gr-lxx-byz/ish/19/#L12">Έξ 19:12</a></p></li></ul><p>Επιπλέον:</p><ul><li><p>Εντολή να σκοτώσουν τα παιδιά και τις γυναίκες των Μαδιανιτών που παρέσυραν τους Ισραηλίτες στη λατρεία του ειδώλου Φογώρ: <a href="https://bibleox.com/el/gr-lxx-byz/chis/31/#L15-17">Αρ 31:15-17</a></p></li></ul><ul><li><p>Εντολή να σκοτώσουν τον λαό του Αμαλήκ: άνδρες, γυναίκες, νήπια και βρέφη που θηλάζουν: <a href="https://bibleox.com/el/gr-lxx-byz/1ts/15/#L3">Α Βασ 15:3</a></p></li></ul>'
