  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: '<h2>Λεπτομερής εξήγηση για την κατάργηση του Νόμου του Μωυσή</h2><p>Βλέπε στο προοίμιο των Ρήσεων Πατέρων της Εκκλησίας, στο κεφάλαιο «Για την κατάργηση του Νόμου του Μωυσή».</p><h2>Ο Νόμος του Μωυσή καταργήθηκε</h2><blockquote><p><em>«νυνὶ δὲ </em><strong><em><mark>κατηργήθημεν ἀπὸ τοῦ νόμου</mark></em></strong><em>, </em><strong><em><mark>ἀποθανόντες ἐν ᾧ</mark> κατειχόμεθα</em></strong><em>, ὥστε δουλεύειν ἡμᾶς ἐν καινότητι πνεύματος καὶ </em><strong><em>οὐ παλαιότητι γράμματος</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/rim/7/#L6">Ρωμ 7:6</a><em>)</em></p></blockquote><h3>Όχι πια υπό τον παιδαγωγό (τον Νόμο)</h3><blockquote><p>«ἀλλὰ συνέκλεισεν ἡ γραφὴ τὰ πάντα ὑπὸ ἁμαρτίαν ἵνα ἡ ἐπαγγελία ἐκ πίστεως Ἰησοῦ Χριστοῦ δοθῇ τοῖς πιστεύουσιν. <strong><mark>Πρὸ τοῦ δὲ ἐλθεῖν τὴν πίστιν</mark> ὑπὸ νόμον <mark>ἐφρουρούμεθα</mark></strong> συγκλειόμενοι εἰς τὴν μέλλουσαν πίστιν ἀποκαλυφθῆναι. ὥστε <strong>ὁ νόμος <mark>παιδαγωγὸς ἡμῶν γέγονεν εἰς Χριστόν</mark></strong>, ἵνα ἐκ πίστεως δικαιωθῶμεν· ἐλθούσης δὲ τῆς πίστεως <strong><mark>οὐκέτι ὑπὸ παιδαγωγόν ἐσμεν</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/gal/3/#L21-25">Γαλ 3:21-25</a>)</p></blockquote><blockquote><p>«Λέγω δέ, <strong><mark>ἐφ᾿ ὅσον</mark> χρόνον</strong> ὁ <strong>κληρονόμος</strong> νήπιός ἐστιν, οὐδὲν διαφέρει δούλου κύριος πάντων ὤν, ἀλλὰ <strong>ὑπὸ ἐπιτρόπους ἐστὶν</strong> καὶ οἰκονόμους <strong>ἄχρι τῆς προθεσμίας τοῦ πατρός</strong>. &lt;…&gt; νῦν δὲ γνόντες θεόν, μᾶλλον δὲ γνωσθέντες ὑπὸ θεοῦ, πῶς ἐπιστρέφετε πάλιν ἐπὶ τὰ ἀσθενῆ καὶ πτωχὰ στοιχεῖα, <strong>οἷς πάλιν ἄνωθεν δουλεύειν θέλετε; ἡμέρας παρατηρεῖσθε καὶ μῆνας καὶ καιροὺς καὶ ἐνιαυτούς</strong>. φοβοῦμαι ὑμᾶς μή πως εἰκῇ κεκοπίακα εἰς ὑμᾶς. &lt;…&gt; Λέγετέ μοι, <strong><mark>οἱ ὑπὸ νόμον θέλοντες εἶναι</mark></strong>, τὸν νόμον οὐκ ἀκούετε; &lt;…&gt; ἀλλ᾿ ὥσπερ τότε <strong>ὁ κατὰ σάρκα γεννηθεὶς ἐδίωκεν τὸν κατὰ πνεῦμα, οὕτως καὶ νῦν</strong>. ἀλλὰ τί λέγει ἡ γραφή; Ἔκβαλε τὴν παιδίσκην καὶ τὸν υἱὸν αὐτῆς, <strong>οὐ γὰρ μὴ κληρονομήσει ὁ υἱὸς τῆς παιδίσκης μετὰ τοῦ υἱοῦ τῆς ἐλευθέρας</strong>. διό, ἀδελφοί, <strong><mark>οὐκ ἐσμὲν παιδίσκης τέκνα ἀλλὰ τῆς ἐλευθέρας</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/gal/4/#L1-2,9-11,21,29-31">Γαλ 4:1-2,9-11,21,29-31</a>)</p></blockquote><h2>Η συνοδική απόφαση για την κατάργηση του Νόμου</h2><p>Η πρώτη αποστολική σύνοδος αποφάσισε ότι οι χριστιανοί δεν έχουν ανάγκη να τηρούν τις διατάξεις του ιουδαϊκού νόμου:</p><blockquote><p>«<strong>ἐξανέστησαν δέ τινες <mark>τῶν ἀπὸ τῆς αἱρέσεως τῶν Φαρισαίων πεπιστευκότες</mark></strong>,<mark> </mark><strong><mark>λέγοντες ὅτι δεῖ</mark></strong> περιτέμνειν αὐτοὺς παραγγέλλειν τε <strong><mark>τηρεῖν τὸν νόμον Μωϋσέως</mark></strong>. Συνήχθησαν δὲ οἱ ἀπόστολοι καὶ οἱ πρεσβύτεροι ἰδεῖν περὶ τοῦ λόγου τούτου.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/15/#L5-6">Πραξ 15:5-6</a>)</p></blockquote><blockquote><p>«Ἐπειδὴ ἠκούσαμεν ὅτι <strong><mark>τινὲς</mark> ἐξ ἡμῶν [ἐξελθόντες]</strong> <strong><mark>ἐτάραξαν</mark> ὑμᾶς</strong> <strong>λόγοις <mark>ἀνασκευάζοντες</mark> τὰς ψυχὰς ὑμῶν, <mark>οἷς οὐ διεστειλάμεθα</mark></strong>,» (<a href="https://bibleox.com/el/gr-lxx-byz/act/15/#L24">Πραξ 15:24</a>)</p></blockquote><blockquote><p>«<strong><mark>ἔδοξεν γὰρ τῷ πνεύματι τῷ ἁγίῳ καὶ ἡμῖν μηδὲν πλέον ἐπιτίθεσθαι ὑμῖν βάρος πλὴν τούτων τῶν ἐπάναγκες</mark>, ἀπέχεσθαι εἰδωλοθύτων καὶ αἵματος καὶ πνικτῶν καὶ πορνείας</strong>· ἐξ ὧν διατηροῦντες ἑαυτοὺς εὖ πράξετε. Ἔρρωσθε.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/15/#L28-29">Πραξ 15:28-29</a>)</p></blockquote><blockquote><p>«<strong>περὶ δὲ τῶν πεπιστευκότων ἐθνῶν ἡμεῖς ἐπεστείλαμεν κρίναντες φυλάσσεσθαι αὐτοὺς τό τε εἰδωλόθυτον καὶ αἷμα καὶ πνικτὸν καὶ πορνείαν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/21/#L25">Πραξ 21:25</a>)</p></blockquote><blockquote><p>«ὡς δὲ διεπορεύοντο τὰς πόλεις, <strong>παρεδίδοσαν αὐτοῖς φυλάσσειν τὰ δόγματα τὰ κεκριμένα ὑπὸ τῶν ἀποστόλων καὶ πρεσβυτέρων τῶν ἐν Ἱεροσολύμοις</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/16/#L4">Πραξ 16:4</a>)</p></blockquote><h2>Οι απόστολοι και οι πρώτοι χριστιανοί δεν ζούσαν κατά τον Νόμο του Μωυσή</h2><h3>Για τους άνομους έγινε σαν άνομος (δηλαδή δεν τον τηρούσε)</h3><blockquote><p>«καὶ ἐγενόμην τοῖς Ἰουδαίοις ὡς Ἰουδαῖος, ἵνα Ἰουδαίους κερδήσω· τοῖς ὑπὸ νόμον ὡς ὑπὸ νόμον, μὴ ὢν αὐτὸς ὑπὸ νόμον, ἵνα τοὺς ὑπὸ νόμον κερδήσω· <strong><mark>τοῖς ἀνόμοις ὡς ἄνομος</mark></strong>, μὴ ὢν ἄνομος θεοῦ ἀλλ᾿ <strong><mark>ἔννομος Χριστοῦ</mark></strong>, ἵνα κερδάνω τοὺς ἀνόμους·» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/9/#L20-21">Α Κορ 9:20-21</a>)</p></blockquote><h3>Ο διάκονος Στέφανος κατηγορήθηκε ότι δίδασκε την αλλαγή του Νόμου</h3><blockquote><p>«ἔστησάν τε μάρτυρας ψευδεῖς λέγοντας, Ὁ ἄνθρωπος οὗτος οὐ παύεται <strong>λαλῶν ῥήματα</strong> κατὰ τοῦ τόπου τοῦ ἁγίου [τούτου] <strong><mark>καὶ τοῦ νόμου</mark></strong>· ἀκηκόαμεν γὰρ αὐτοῦ λέγοντος ὅτι Ἰησοῦς ὁ Ναζωραῖος οὗτος καταλύσει τὸν τόπον τοῦτον καὶ <strong><mark>ἀλλάξει τὰ ἔθη ἃ παρέδωκεν ἡμῖν Μωϋσῆς</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/6/#L13-14">Πραξ 6:13-14</a>)</p></blockquote><h3>Ο απόστολος Παύλος κατηγορείται ότι διδάσκει να λατρεύεται ο Θεός όχι κατά τον Νόμο</h3><blockquote><p>«λέγοντες ὅτι <strong><mark>Παρὰ τὸν νόμον ἀναπείθει οὗτος τοὺς ἀνθρώπους σέβεσθαι τὸν θεόν</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/18/#L13">Πραξ 18:13</a>)</p></blockquote><blockquote><p>«οἱ δὲ ἀκούσαντες ἐδόξαζον τὸν θεόν, εἶπάν τε αὐτῷ, Θεωρεῖς, ἀδελφέ, πόσαι μυριάδες εἰσὶν ἐν τοῖς Ἰουδαίοις τῶν πεπιστευκότων, καὶ πάντες ζηλωταὶ τοῦ νόμου ὑπάρχουσιν· κατηχήθησαν δὲ περὶ σοῦ ὅτι <strong><mark>ἀποστασίαν διδάσκεις ἀπὸ Μωϋσέως τοὺς κατὰ τὰ ἔθνη πάντας Ἰουδαίους</mark></strong>, <strong><mark>λέγων μὴ περιτέμνειν αὐτοὺς τὰ τέκνα</mark></strong> <strong><mark>μηδὲ τοῖς ἔθεσιν περιπατεῖν</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/21/#L20-21">Πραξ 21:20-21</a>)</p></blockquote><p>Αν ο απόστολος Παύλος κηρύσσει τον Ιουδαϊσμό, τότε γιατί τον καταδιώκουν οι Ιουδαίοι; Τον καταδιώκουν επειδή εγκατέλειψε τον Νόμο:</p><blockquote><p>«<strong>τῇ ἐλευθερίᾳ ἡμᾶς Χριστὸς ἠλευθέρωσεν· στήκετε οὖν</strong> καὶ <strong><mark>μὴ πάλιν ζυγῷ δουλείας ἐνέχεσθε</mark></strong>. &lt;…&gt; ἐγὼ δέ, ἀδελφοί, εἰ περιτομὴν ἔτι κηρύσσω, <strong><mark>τί ἔτι διώκομαι</mark>; ἄρα κατήργηται τὸ σκάνδαλον τοῦ σταυροῦ</strong>.»<strong> </strong>(<a href="https://bibleox.com/el/gr-lxx-byz/gal/5/#L1,11,13">Γαλ 5:1,11</a>)</p></blockquote><p>Μερικοί χριστιανοί προσποιούνται τους υποταγμένους στον Νόμο μπροστά στους Ιουδαίους, για να μην καταδιώκονται:</p><blockquote><p>«<strong>ὅσοι θέλουσιν εὐπροσωπῆσαι ἐν σαρκί</strong>, οὗτοι ἀναγκάζουσιν ὑμᾶς περιτέμνεσθαι, <strong>μόνον ἵνα τῷ σταυρῷ τοῦ Χριστοῦ μὴ διώκωνται</strong>·» (<a href="https://bibleox.com/el/gr-lxx-byz/gal/6/#L12">Γαλ 6:12</a>)</p></blockquote><h3>Οι χριστιανοί δεν περιτέμνονται</h3><blockquote><p>«<strong>περιτετμημένος τις ἐκλήθη; μὴ ἐπισπάσθω</strong>. <strong>ἐν ἀκροβυστίᾳ κέκληταί τις; μὴ περιτεμνέσθω</strong>. <strong>ἡ περιτομὴ οὐδέν ἐστιν, καὶ ἡ ἀκροβυστία οὐδέν ἐστιν</strong>, ἀλλὰ τήρησις ἐντολῶν θεοῦ.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/7/#L18-19">Α Κορ 7:18-19</a>)</p></blockquote><blockquote><p>«ἐν γὰρ Χριστῷ Ἰησοῦ <strong>οὔτε περιτομή τι ἰσχύει οὔτε ἀκροβυστία</strong>, ἀλλὰ πίστις δι᾿ ἀγάπης ἐνεργουμένη.» (<a href="https://bibleox.com/el/gr-lxx-byz/gal/5/#L6">Γαλ 5:6</a>)</p></blockquote><blockquote><p>«<strong>οὔτε γὰρ περιτομή τί ἐστιν οὔτε ἀκροβυστία</strong>, ἀλλὰ καινὴ κτίσις.» (<a href="https://bibleox.com/el/gr-lxx-byz/gal/6/#L15">Γαλ 6:15</a>)</p></blockquote><blockquote><p>«ὅπου οὐκ ἔνι Ἕλλην καὶ Ἰουδαῖος, <strong>περιτομὴ καὶ ἀκροβυστία</strong>, βάρβαρος, Σκύθης, δοῦλος, ἐλεύθερος, ἀλλὰ [τὰ] πάντα καὶ ἐν πᾶσιν Χριστός.» (<a href="https://bibleox.com/el/gr-lxx-byz/kol/3/#L11">Κολ 3:11</a>)</p></blockquote><h3>Δεν προσφέρουν ζώα σε θυσία</h3><blockquote><p>«ἀνώτερον λέγων ὅτι <strong>Θυσίας καὶ προσφορὰς καὶ ὁλοκαυτώματα καὶ περὶ ἁμαρτίας οὐκ ἠθέλησας οὐδὲ εὐδόκησας, αἵτινες κατὰ νόμον προσφέρονται</strong>, τότε εἴρηκεν, Ἰδοὺ ἥκω τοῦ ποιῆσαι τὸ θέλημά σου. <strong>ἀναιρεῖ τὸ πρῶτον ἵνα τὸ δεύτερον στήσῃ</strong>· &lt;…&gt; Αὕτη ἡ διαθήκη ἣν διαθήσομαι πρὸς αὐτοὺς μετὰ τὰς ἡμέρας ἐκείνας, λέγει κύριος, διδοὺς νόμους μου ἐπὶ καρδίας αὐτῶν, καὶ ἐπὶ τὴν διάνοιαν αὐτῶν ἐπιγράψω αὐτούς, καὶ τῶν ἁμαρτιῶν αὐτῶν καὶ τῶν ἀνομιῶν αὐτῶν οὐ μὴ μνησθήσομαι ἔτι. <strong>ὅπου δὲ ἄφεσις τούτων, οὐκέτι προσφορὰ περὶ ἁμαρτίας</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/10/#L8-9,16-18">Εβρ 10:8-9,16-18</a>)</p></blockquote><h3>Δεν τηρούν τη σαββατική ανάπαυση</h3><blockquote><p>«<strong>Μὴ οὖν τις ὑμᾶς κρινέτω</strong> ἐν βρώσει καὶ ἐν πόσει ἢ ἐν μέρει ἑορτῆς ἢ νεομηνίας ἢ <strong>σαββάτων</strong>,» (<a href="https://bibleox.com/el/gr-lxx-byz/kol/2/#L16">Κολ 2:16</a>)</p></blockquote><blockquote><p>«Ἐν ἐκείνῳ τῷ καιρῷ ἐπορεύθη ὁ Ἰησοῦς <strong>τοῖς σάββασιν</strong> διὰ τῶν σπορίμων· οἱ δὲ μαθηταὶ αὐτοῦ ἐπείνασαν, καὶ <strong>ἤρξαντο τίλλειν στάχυας καὶ ἐσθίειν</strong>. οἱ δὲ Φαρισαῖοι ἰδόντες εἶπαν αὐτῷ, Ἰδοὺ οἱ μαθηταί σου ποιοῦσιν ὃ οὐκ ἔξεστιν ποιεῖν ἐν σαββάτῳ. &lt;…&gt; εἰ δὲ ἐγνώκειτε τί ἐστιν, Ἔλεος θέλω καὶ οὐ θυσίαν, <strong>οὐκ ἂν κατεδικάσατε τοὺς ἀναιτίους</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/12/#L1-2,7">Μτ 12:1-2,7</a>)</p></blockquote><h3>Συναναστρέφονται με αλλοεθνείς, και οι ίδιοι είναι αλλοεθνείς</h3><blockquote><p>«καὶ συνομιλῶν αὐτῷ εἰσῆλθεν, καὶ εὑρίσκει συνεληλυθότας πολλούς, ἔφη τε πρὸς αὐτούς, <strong>Ὑμεῖς ἐπίστασθε ὡς ἀθέμιτόν ἐστιν ἀνδρὶ Ἰουδαίῳ κολλᾶσθαι ἢ προσέρχεσθαι ἀλλοφύλῳ</strong>· <strong>κἀμοὶ ὁ θεὸς ἔδειξεν μηδένα κοινὸν ἢ ἀκάθαρτον λέγειν ἄνθρωπον</strong>·» (<a href="https://bibleox.com/el/gr-lxx-byz/act/10/#L27-28">Πραξ 10:27-28</a>)</p></blockquote><h3>Αγγίζουν νεκρούς</h3><p>Ο Κύριος Ιησούς Χριστός άγγιξε τη νεκρή κόρη του Ιαείρου:</p><blockquote><p>«καὶ <strong>κρατήσας τῆς χειρὸς τοῦ παιδίου λέγει αὐτῇ</strong>, Ταλιθα κουμ, ὅ ἐστιν μεθερμηνευόμενον Τὸ κοράσιον, σοὶ λέγω, ἔγειρε.» (<a href="https://bibleox.com/el/gr-lxx-byz/mk/5/#L41">Μκ 5:41</a>)</p></blockquote><p>Κατά τον νόμο, όταν ο Χριστός πέθανε στον σταυρό, δεν ήταν επιτρεπτό να Τον αγγίξει κανείς, όπως σε έναν ήδη νεκρό. Μόνο η Θεοτόκος μπορούσε να το κάνει αυτό, ως συγγενής (<a href="https://bibleox.com/el/gr-lxx-byz/lev/21/#L1-4">Λευ 21:1-4</a>). Ωστόσο, όχι μόνο δεν καταδικάζουμε τον Ιωάννη τον Θεολόγο, τον Νικόδημο και τον Ιωσήφ από την Αριμαθαία, αλλά τους επαινούμε που δεν φοβήθηκαν τίποτα και υπηρέτησαν τον Σωτήρα μας.</p><blockquote><p>«καὶ λαβὼν τὸ σῶμα ὁ <strong>Ἰωσὴφ</strong> ἐνετύλιξεν αὐτὸ ἐν σινδόνι καθαρᾷ, καὶ ἔθηκεν αὐτὸ ἐν τῷ καινῷ αὐτοῦ μνημείῳ ὃ ἐλατόμησεν ἐν τῇ πέτρᾳ, καὶ προσκυλίσας λίθον μέγαν τῇ θύρᾳ τοῦ μνημείου ἀπῆλθεν.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/27/#L59-60">Μτ 27:59-60</a>)</p></blockquote><blockquote><p>«καὶ ἀκούσαντες <strong>οἱ μαθηταὶ</strong> αὐτοῦ ἦλθον καὶ ἦραν τὸ πτῶμα αὐτοῦ καὶ ἔθηκαν αὐτὸ ἐν μνημείῳ.» (<a href="https://bibleox.com/el/gr-lxx-byz/mk/6/#L29">Μκ 6:29</a>)</p></blockquote><blockquote><p>«καὶ γνοὺς ἀπὸ τοῦ κεντυρίωνος ἐδωρήσατο τὸ πτῶμα τῷ <strong>Ἰωσήφ</strong>. καὶ ἀγοράσας σινδόνα καθελὼν αὐτὸν ἐνείλησεν τῇ σινδόνι καὶ ἔθηκεν αὐτὸν ἐν μνημείῳ ὃ ἦν λελατομημένον ἐκ πέτρας, καὶ προσεκύλισεν λίθον ἐπὶ τὴν θύραν τοῦ μνημείου.» (<a href="https://bibleox.com/el/gr-lxx-byz/mk/15/#L45-46">Μκ 15:45-46</a>)</p></blockquote><blockquote><p>«ὡς δὲ ἐτέλεσαν πάντα τὰ περὶ αὐτοῦ γεγραμμένα, καθελόντες ἀπὸ τοῦ ξύλου ἔθηκαν εἰς μνημεῖον.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/13/#L29">Πραξ 13:29</a>)</p></blockquote><h3>Ο Κύριος αφήνει ελεύθερη τη γυναίκα που κατηγορήθηκε για μοιχεία</h3><p>Ο Νόμος προστάζει τον λιθοβολισμό για τη μοιχεία (<a href="https://bibleox.com/el/gr-lxx-byz/lev/20/#L10">Λευ 20:10</a>), όμως ο Κύριος δεν καταδίκασε τη γυναίκα για μοιχεία, αλλά την άφησε ελεύθερη:</p><blockquote><p>«ἡ δὲ εἶπεν, Οὐδείς, κύριε. εἶπεν δὲ ὁ Ἰησοῦς, <strong><mark>Οὐδὲ ἐγώ σε κατακρίνω· πορεύου, [καὶ] ἀπὸ τοῦ νῦν μηκέτι ἁμάρτανε</mark></strong>.]» (<a href="https://bibleox.com/el/gr-lxx-byz/in/8/#L11">Ιω 8:11</a>)</p></blockquote><h3>Ο Κύριος προστάζει να πίνουν το Αίμα Του</h3><p>Ο Θεός απαγορεύει να πίνει κανείς αίμα (<a href="https://bibleox.com/el/gr-lxx-byz/gen/9/#L4">Γεν 9:4</a> · <a href="https://bibleox.com/el/gr-lxx-byz/lev/3/#L17">Λευ 3:17</a> · <a href="https://bibleox.com/el/gr-lxx-byz/lev/7/#L26">Λευ 7:26</a> · <a href="https://bibleox.com/el/gr-lxx-byz/lev/17/#L14">Λευ 17:14</a> · <a href="https://bibleox.com/el/gr-lxx-byz/vtor/12/#L16">Δτ 12:16</a>), αλλά στον Μυστικό Δείπνο δίνει στους μαθητές το ποτήριο με τα λόγια: πιείτε, αυτό είναι το Αίμα Μου:</p><blockquote><p>«Ἐσθιόντων δὲ αὐτῶν λαβὼν ὁ Ἰησοῦς ἄρτον καὶ εὐλογήσας ἔκλασεν καὶ δοὺς τοῖς μαθηταῖς εἶπεν, Λάβετε φάγετε, τοῦτό ἐστιν τὸ σῶμά μου. καὶ λαβὼν ποτήριον καὶ εὐχαριστήσας ἔδωκεν αὐτοῖς λέγων, <strong><mark>Πίετε ἐξ αὐτοῦ πάντες, τοῦτο γάρ ἐστιν τὸ αἷμά μου</mark></strong> τῆς διαθήκης τὸ περὶ πολλῶν ἐκχυννόμενον εἰς ἄφεσιν ἁμαρτιῶν.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/26/#L26-28">Μτ 26:26-28</a>)</p></blockquote><h3>Ο Κύριος έγινε αρχιερέας από τη φυλή του Ιούδα</h3><p>Ο Νόμος προστάζει οι ιερείς να είναι μόνο από τη φυλή του Λευί, από το γένος του Ααρών:</p><blockquote><p><em>«καὶ ζώσεις αὐτοὺς ταῖς ζώναις καὶ περιθήσεις αὐτοῖς τὰς κιδάρεις, καὶ </em><strong><em>ἔσται αὐτοῖς ἱερατεία</em></strong><em> ἐμοὶ εἰς τὸν αἰῶνα. καὶ τελειώσεις τὰς χεῖρας </em><strong><em>Ααρων καὶ τὰς χεῖρας τῶν υἱῶν αὐτοῦ</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/ish/29/#L9"><em>Έξ 29:9</em></a><em>)</em></p></blockquote><blockquote><p><em>«καὶ </em><strong><em>ἡ στολὴ τοῦ ἁγίου</em></strong><em>, ἥ ἐστιν Ααρων, </em><strong><em>ἔσται τοῖς υἱοῖς αὐτοῦ μετ᾿ αὐτόν</em></strong><em>, </em><strong><em>χρισθῆναι αὐτοὺς ἐν αὐτοῖς καὶ τελειῶσαι τὰς χεῖρας αὐτῶν</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/ish/29/#L29"><em>Έξ 29:29</em></a><em>)</em></p></blockquote><p>Αλλά ο Κύριος έγινε αρχιερέας, γεννημένος στη φυλή του Ιούδα:</p><blockquote><p>«πρόδηλον γὰρ ὅτι <strong><mark>ἐξ Ἰούδα ἀνατέταλκεν ὁ κύριος ἡμῶν</mark></strong>, εἰς ἣν φυλὴν <strong>περὶ ἱερέων οὐδὲν Μωϋσῆς ἐλάλησεν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/7/#L14">Εβρ 7:14</a>)</p></blockquote><h3>Η αληθινή πασχαλινή θυσία δεν προσφέρεται στον ναό</h3><p>Η πασχαλινή θυσία μπορεί να προσφέρεται μόνο στον ναό της Ιερουσαλήμ:</p><blockquote><p>«<strong>οὐ δυνήσῃ θῦσαι τὸ πασχα ἐν οὐδεμιᾷ τῶν πόλεών σου, ὧν κύριος ὁ θεός σου δίδωσίν σοι</strong>, ἀλλ᾿ ἢ εἰς τὸν τόπον, ὃν ἐὰν ἐκλέξηται κύριος ὁ θεός σου ἐπικληθῆναι τὸ ὄνομα αὐτοῦ ἐκεῖ, θύσεις τὸ πασχα ἑσπέρας πρὸς δυσμὰς ἡλίου ἐν τῷ καιρῷ, ᾧ ἐξῆλθες ἐξ Αἰγύπτου,» (<a href="https://bibleox.com/el/gr-lxx-byz/vtor/16/#L5-6">Δτ 16:5-6</a>)</p></blockquote><blockquote><p>«διὸ καὶ Ἰησοῦς, ἵνα ἁγιάσῃ διὰ τοῦ ἰδίου αἵματος τὸν λαόν, <strong><mark>ἔξω τῆς πύλης ἔπαθεν</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/13/#L12">Εβρ 13:12</a>)</p></blockquote><h2>Οι Δέκα Εντολές είναι κι αυτές Νόμος του Μωυσή;</h2><h3>Ο Νόμος του Θεού διά του Μωυσή — όλες οι εντολές στο βιβλίο του Λευιτικού</h3><p>Το βιβλίο του Λευιτικού, στο οποίο απαριθμούνται πολλές εντολές του Θεού, μεταξύ των οποίων και <a href="https://bibleox.com/el/el/w/%CE%9F%CE%B9_%CE%94%CE%AD%CE%BA%CE%B1_%CE%95%CE%BD%CF%84%CE%BF%CE%BB%CE%AD%CF%82">οι εντολές από τις λίθινες πλάκες</a>, τις ονομάζει <strong>νόμους του Κυρίου που θεσπίστηκαν διά του Μωυσή</strong>:</p><blockquote><p>«<strong><mark>Ταῦτα τὰ κρίματα καὶ τὰ προστάγματα καὶ ὁ νόμος, ὃν ἔδωκεν κύριος</mark></strong> ἀνὰ μέσον αὐτοῦ καὶ ἀνὰ μέσον τῶν υἱῶν Ισραηλ ἐν τῷ ὄρει Σινα <strong><mark>ἐν χειρὶ Μωυσῆ</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/lev/26/#L46">Λευ 26:46</a>)</p></blockquote><h3>Ο Θεός ονομάζει όλες τις εντολές Του Νόμο</h3><p>Για παράδειγμα, η εντολή να συγκεντρώνουν το μάννα είναι Νόμος του Θεού:</p><blockquote><p>«εἶπεν δὲ κύριος πρὸς Μωυσῆν Ἰδοὺ ἐγὼ ὕω ὑμῖν ἄρτους ἐκ τοῦ οὐρανοῦ, καὶ <strong><mark>ἐξελεύσεται ὁ λαὸς καὶ συλλέξουσιν τὸ τῆς ἡμέρας εἰς ἡμέραν</mark></strong>, ὅπως πειράσω αὐτοὺς εἰ πορεύσονται <strong><mark>τῷ νόμῳ μου</mark></strong> ἢ οὔ·»</p><p>…</p><p>«εἶπεν δὲ κύριος πρὸς Μωυσῆν Ἕως τίνος οὐ βούλεσθε εἰσακούειν <strong><mark>τὰς ἐντολάς μου καὶ τὸν νόμον μου</mark></strong>;» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/16/#L4,28">Έξ 16:4,28</a>)</p></blockquote><p>Έξοδος κεφ. 16, 24, 31, 34, 35· Δευτερονόμιο κεφ. 4, 6, 10.</p><h3>Ο Νέος Νόμος είναι γραμμένος πια όχι σε πέτρινες πλάκες, αλλά στην καρδιά</h3><p>Αυτό που ήταν γραμμένο στις πέτρινες πλάκες ονομάζεται «νόμος»:</p><blockquote><p>«αὕτη ἡ διαθήκη, ἣν διαθήσομαι τῷ οἴκῳ Ισραηλ μετὰ τὰς ἡμέρας ἐκείνας, φησὶν κύριος <strong>Διδοὺς δώσω <mark>νόμους μου</mark> εἰς τὴν διάνοιαν αὐτῶν καὶ <mark>ἐπὶ καρδίας αὐτῶν γράψω αὐτούς</mark></strong>· καὶ ἔσομαι αὐτοῖς εἰς θεόν, καὶ αὐτοὶ ἔσονταί μοι εἰς λαόν·» (<a href="https://bibleox.com/el/gr-lxx-byz/ier/38/#L33">Ιερ 38:33</a>)</p></blockquote><blockquote><p>«φανερούμενοι ὅτι <strong>ἐστὲ ἐπιστολὴ Χριστοῦ</strong> διακονηθεῖσα ὑφ᾿ ἡμῶν, <strong>ἐγγεγραμμένη</strong> οὐ μέλανι ἀλλὰ πνεύματι θεοῦ ζῶντος, <strong><mark>οὐκ</mark> <u>ἐν <mark>πλαξὶν λιθίναις</mark></u> <mark>ἀλλ᾿ ἐν πλαξὶν καρδίαις σαρκίναις</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/2kor/3/#L3">Β Κορ 3:3</a>)</p></blockquote><h3>Ο Χριστός μιλά για τις εντολές, χωρίς να ξεχωρίζει τις Δέκα Εντολές</h3><blockquote><p>«Ἠκούσατε ὅτι ἐρρέθη τοῖς ἀρχαίοις, <strong>Οὐ φονεύσεις</strong>· ὃς δ᾿ ἂν φονεύσῃ, ἔνοχος ἔσται τῇ κρίσει.»</p><p>«Ἠκούσατε ὅτι ἐρρέθη, <strong>Οὐ μοιχεύσεις</strong>.»</p><p>«Πάλιν ἠκούσατε ὅτι ἐρρέθη τοῖς ἀρχαίοις, <strong><mark>Οὐκ ἐπιορκήσεις</mark></strong>, ἀποδώσεις δὲ τῷ κυρίῳ τοὺς ὅρκους σου.»</p><p>«Ἠκούσατε ὅτι ἐρρέθη, <strong><mark>Ὀφθαλμὸν ἀντὶ ὀφθαλμοῦ καὶ ὀδόντα ἀντὶ ὀδόντος</mark></strong>.»</p><p>«Ἠκούσατε ὅτι ἐρρέθη, <strong><mark>Ἀγαπήσεις τὸν πλησίον σου</mark></strong> <strong>καὶ μισήσεις τὸν ἐχθρόν σου</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/5/#L21,27,33,38,43">Μτ 5:21,27,33,38,43</a>)</p></blockquote><h3>Οι απόστολοι ονομάζουν τον Δεκάλογο απλώς Νόμο</h3><p>Ο απόστολος Ιάκωβος λέει ότι όποιος παραβαίνει την εντολή «ου φονεύσεις» είναι παραβάτης του νόμου:</p><blockquote><p>«ὅστις γὰρ ὅλον τὸν νόμον τηρήσῃ, πταίσῃ δὲ ἐν ἑνί, γέγονεν πάντων ἔνοχος. ὁ γὰρ εἰπών, Μὴ μοιχεύσῃς, εἶπεν καί, Μὴ φονεύσῃς· <strong>εἰ δὲ οὐ μοιχεύεις, <mark>φονεύεις</mark> δέ, γέγονας <mark>παραβάτης νόμου</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/iak/2/#L10-11">Ιακ 2:10-11</a>)</p></blockquote><h2>Ο Νόμος δεν σώζει</h2><h3>Ο Νόμος είναι σκιά των μελλόντων, υπενθύμιση της αμαρτίας</h3><blockquote><p>«<strong><mark>Σκιὰν</mark> γὰρ ἔχων ὁ νόμος τῶν μελλόντων ἀγαθῶν</strong>, οὐκ αὐτὴν τὴν εἰκόνα τῶν πραγμάτων, κατ᾿ ἐνιαυτὸν ταῖς αὐταῖς θυσίαις ἃς προσφέρουσιν εἰς τὸ διηνεκὲς οὐδέποτε δύναται τοὺς προσερχομένους τελειῶσαι· ἐπεὶ οὐκ ἂν ἐπαύσαντο προσφερόμεναι, διὰ τὸ μηδεμίαν ἔχειν ἔτι συνείδησιν ἁμαρτιῶν τοὺς λατρεύοντας ἅπαξ κεκαθαρισμένους; ἀλλ᾿ <strong>ἐν αὐταῖς <mark>ἀνάμνησις ἁμαρτιῶν</mark></strong> κατ᾿ ἐνιαυτόν,» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/10/#L1-3">Εβρ 10:1-3</a>)</p></blockquote><h3>Ο Νόμος δεν μπορεί να σώσει: ούτε η γνώση του Νόμου ούτε τα έργα</h3><blockquote><p>«Ὁ οὖν νόμος κατὰ τῶν ἐπαγγελιῶν [τοῦ θεοῦ]; μὴ γένοιτο· <strong>εἰ γὰρ ἐδόθη νόμος ὁ δυνάμενος ζῳοποιῆσαι, ὄντως ἐκ νόμου ἂν ἦν ἡ δικαιοσύνη</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/gal/3/#L21">Γαλ 3:21</a>)</p></blockquote><h3>Η τήρηση του γράμματος του Νόμου δεν σώζει</h3><blockquote><p>«λέγω γὰρ ὑμῖν ὅτι ἐὰν μὴ περισσεύσῃ ὑμῶν ἡ δικαιοσύνη πλεῖον τῶν γραμματέων καὶ Φαρισαίων, οὐ μὴ εἰσέλθητε εἰς τὴν βασιλείαν τῶν οὐρανῶν.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/5/#L20">Μτ 5:20</a>)</p></blockquote><blockquote><p>«<strong>Ἐὰν</strong> ταῖς γλώσσαις τῶν ἀνθρώπων λαλῶ καὶ τῶν ἀγγέλων, <strong>ἀγάπην δὲ μὴ ἔχω, γέγονα χαλκὸς ἠχῶν ἢ κύμβαλον ἀλαλάζον</strong>. καὶ ἐὰν ἔχω προφητείαν καὶ εἰδῶ τὰ μυστήρια πάντα καὶ πᾶσαν τὴν γνῶσιν, κἂν ἔχω πᾶσαν τὴν πίστιν ὥστε ὄρη μεθιστάναι, ἀγάπην δὲ μὴ ἔχω, οὐθέν εἰμι. <strong>κἂν ψωμίσω πάντα τὰ ὑπάρχοντά μου, καὶ ἐὰν παραδῶ τὸ σῶμά μου ἵνα καυχήσωμαι, ἀγάπην δὲ μὴ ἔχω, οὐδὲν ὠφελοῦμαι</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/13/#L1-3">Α Κορ 13:1-3</a>)</p></blockquote><h3>Η παράβαση του Νόμου οδηγεί σε καταδίκη</h3><blockquote><p>«ὅσοι γὰρ ἀνόμως ἥμαρτον, ἀνόμως καὶ ἀπολοῦνται· καὶ ὅσοι ἐν νόμῳ ἥμαρτον, διὰ νόμου κριθήσονται· οὐ γὰρ οἱ ἀκροαταὶ νόμου δίκαιοι παρὰ τῷ θεῷ, ἀλλ᾿ οἱ ποιηταὶ νόμου δικαιωθήσονται.» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/2/#L12-13">Ρωμ 2:12-13</a>)</p></blockquote><h3>Όποιος δεν τηρεί όλο τον Νόμο είναι επικατάρατος</h3><blockquote><p>«ὅσοι γὰρ ἐξ ἔργων νόμου εἰσὶν ὑπὸ κατάραν εἰσίν· γέγραπται γὰρ ὅτι <strong><mark>Ἐπικατάρατος πᾶς ὃς οὐκ ἐμμένει πᾶσιν τοῖς γεγραμμένοις ἐν τῷ βιβλίῳ τοῦ νόμου τοῦ ποιῆσαι αὐτά</mark></strong>. ὅτι δὲ ἐν νόμῳ οὐδεὶς δικαιοῦται παρὰ τῷ θεῷ δῆλον, ὅτι Ὁ δίκαιος ἐκ πίστεως ζήσεται· ὁ δὲ νόμος οὐκ ἔστιν ἐκ πίστεως, ἀλλ᾿ Ὁ ποιήσας αὐτὰ ζήσεται ἐν αὐτοῖς.» (<a href="https://bibleox.com/el/gr-lxx-byz/gal/3/#L10-12">Γαλ 3:10-12</a>)</p></blockquote><h3>Ο Νόμος δεν οδήγησε κανέναν σε τελειότητα</h3><blockquote><p>«<strong>ἀθέτησις</strong> μὲν γὰρ <strong>γίνεται προαγούσης ἐντολῆς διὰ τὸ αὐτῆς ἀσθενὲς καὶ ἀνωφελές, <mark>οὐδὲν γὰρ ἐτελείωσεν ὁ νόμος</mark></strong>, ἐπεισαγωγὴ δὲ κρείττονος ἐλπίδος, δι᾿ ἧς ἐγγίζομεν τῷ θεῷ.» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/7/#L18-19">Εβρ 7:18-19</a>)</p></blockquote><h2>Γιατί τότε χρειάζεται ο Νόμος του Μωυσή;</h2><h3>Ο Νόμος δίνει τη γνώση της αμαρτίας</h3><blockquote><p>«διότι ἐξ ἔργων νόμου οὐ δικαιωθήσεται πᾶσα σὰρξ ἐνώπιον αὐτοῦ, <strong>διὰ γὰρ νόμου <mark>ἐπίγνωσις ἁμαρτίας</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/3/#L20">Ρωμ 3:20</a>)</p></blockquote><blockquote><p>«<strong>νόμος δὲ παρεισῆλθεν ἵνα <mark>πλεονάσῃ τὸ παράπτωμα</mark></strong>· οὗ δὲ ἐπλεόνασεν ἡ ἁμαρτία, ὑπερεπερίσσευσεν ἡ χάρις,» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/5/#L20">Ρωμ 5:20</a>)</p></blockquote><h3>Ο Νόμος δεσμεύει τον αμαρτωλό (είναι αναγκαίος για τον αμαρτωλό)</h3><blockquote><p>«εἰδὼς τοῦτο, ὅτι δικαίῳ <strong>νόμος οὐ κεῖται</strong>, <strong><mark>ἀνόμοις</mark></strong> δὲ καὶ ἀνυποτάκτοις, ἀσεβέσι καὶ ἁμαρτωλοῖς, ἀνοσίοις καὶ βεβήλοις, πατρολῴαις καὶ μητρολῴαις, ἀνδροφόνοις,» (<a href="https://bibleox.com/el/gr-lxx-byz/1tim/1/#L9">Α Τιμ 1:9</a>)</p></blockquote><h3>Ο Νόμος επιτρέπει να δει κανείς την ανάγκη για Σωτήρα (η προσμονή του Σωτήρα)</h3><blockquote><p>«συνήδομαι γὰρ τῷ νόμῳ τοῦ θεοῦ κατὰ τὸν ἔσω ἄνθρωπον, βλέπω δὲ ἕτερον νόμον ἐν τοῖς μέλεσίν μου ἀντιστρατευόμενον τῷ νόμῳ τοῦ νοός μου καὶ αἰχμαλωτίζοντά με ἐν τῷ νόμῳ τῆς ἁμαρτίας τῷ ὄντι ἐν τοῖς μέλεσίν μου. <strong>ταλαίπωρος ἐγὼ ἄνθρωπος· <mark>τίς</mark> με ῥύσεται ἐκ τοῦ σώματος τοῦ θανάτου τούτου</strong>;» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/7/#L22-24">Ρωμ 7:22-24</a>)</p></blockquote><h2>Ο Νόμος δεν είναι αιώνιος</h2><h3>Ο Νόμος ισχύει μέχρι να εκπληρωθεί</h3><blockquote><p>«ἀμὴν γὰρ λέγω ὑμῖν, ἕως ἂν παρέλθῃ ὁ οὐρανὸς καὶ ἡ γῆ, ἰῶτα ἓν ἢ μία κεραία οὐ μὴ παρέλθῃ ἀπὸ τοῦ νόμου <strong><mark>ἕως ἂν πάντα γένηται</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/5/#L18">Μτ 5:18</a>)</p></blockquote><h3>Ο Χριστός εκπλήρωσε τον Νόμο και έτσι τον κατάργησε</h3><blockquote><p>«Μὴ νομίσητε ὅτι ἦλθον καταλῦσαι τὸν νόμον ἢ τοὺς προφήτας· οὐκ <strong><mark>ἦλθον</mark></strong> καταλῦσαι ἀλλὰ <strong><mark>πληρῶσαι</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/5/#L17">Μτ 5:17</a>)</p></blockquote><h2>Ο Χριστός κλείνει την εποχή του Νόμου</h2><h3>Η προφητεία για τον ερχομό προφήτη όμοιου με τον Μωυσή</h3><p>Όταν θεσπίζεται ο Νόμος του Μωυσή, λέγεται αμέσως ότι στο μέλλον θα έρθει προφήτης όμοιος με τον Μωυσή, δηλαδή <strong>νομοθέτης</strong>, τον οποίο πρέπει να ακούν. Αυτό ειπώθηκε για τον Χριστό:</p><blockquote><p>«<strong><mark>προφήτην</mark></strong> ἐκ τῶν ἀδελφῶν σου <strong><mark>ὡς ἐμὲ ἀναστήσει σοι κύριος ὁ θεός σου, αὐτοῦ ἀκούσεσθε</mark></strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/vtor/18/#L15">Δτ 18:15</a>)</p></blockquote><blockquote><p>«Μωϋσῆς μὲν εἶπεν ὅτι <strong><mark>Προφήτην ὑμῖν ἀναστήσει κύριος ὁ θεὸς ὑμῶν ἐκ τῶν ἀδελφῶν ὑμῶν ὡς ἐμέ· αὐτοῦ ἀκούσεσθε κατὰ πάντα ὅσα ἂν λαλήσῃ πρὸς ὑμᾶς</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/3/#L22">Πραξ 3:22</a>)</p></blockquote><blockquote><p>«οὗτός ἐστιν ὁ Μωϋσῆς ὁ εἴπας τοῖς υἱοῖς Ἰσραήλ, <strong><mark>Προφήτην ὑμῖν ἀναστήσει ὁ θεὸς ἐκ τῶν ἀδελφῶν ὑμῶν ὡς ἐμέ</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/7/#L37">Πραξ 7:37</a>)</p></blockquote><p>Και ο Θεός ο Ίδιος το επιβεβαιώνει με τα ίδια λόγια:</p><blockquote><p>«καὶ ἐγένετο νεφέλη ἐπισκιάζουσα αὐτοῖς, καὶ ἐγένετο φωνὴ ἐκ τῆς νεφέλης, Οὗτός ἐστιν ὁ υἱός μου ὁ ἀγαπητός, <strong><mark>ἀκούετε αὐτοῦ</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mk/9/#L7">Μκ 9:7</a> · <a href="https://bibleox.com/el/gr-lxx-byz/mf/17/#L5">Μτ 17:5</a> · <a href="https://bibleox.com/el/gr-lxx-byz/lk/9/#L35">Λκ 9:35</a>)</p></blockquote><h3>Ο Χριστός αποκαλεί τον Νόμο «δικό σας»</h3><blockquote><p>«καὶ <strong>ἐν τῷ νόμῳ</strong> δὲ <strong><mark>τῷ ὑμετέρῳ</mark></strong> γέγραπται ὅτι δύο ἀνθρώπων ἡ μαρτυρία ἀληθής ἐστιν.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/8/#L17">Ιω 8:17</a>)</p></blockquote><blockquote><p>«ἀπεκρίθη αὐτοῖς [ὁ] Ἰησοῦς, Οὐκ ἔστιν γεγραμμένον <strong>ἐν τῷ νόμῳ <mark>ὑμῶν</mark></strong> ὅτι Ἐγὼ εἶπα, Θεοί ἐστε;» (<a href="https://bibleox.com/el/gr-lxx-byz/in/10/#L34">Ιω 10:34</a>)</p></blockquote><h3>Ο Νόμος ισχύει μέχρι τον Ιωάννη τον Βαπτιστή</h3><blockquote><p>«ἀπὸ δὲ τῶν ἡμερῶν Ἰωάννου τοῦ βαπτιστοῦ ἕως ἄρτι ἡ βασιλεία τῶν οὐρανῶν βιάζεται, καὶ βιασταὶ ἁρπάζουσιν αὐτήν. <strong>πάντες γὰρ οἱ προφῆται καὶ ὁ νόμος <mark>ἕως</mark> Ἰωάννου ἐπροφήτευσαν</strong>·» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/11/#L12-13">Μτ 11:12-13</a>)</p></blockquote><h3>Ο Νόμος δόθηκε μέχρι τον καιρό της έλευσης</h3><blockquote><p>«Τί οὖν ὁ <strong>νόμος</strong>; <strong>τῶν παραβάσεων χάριν προσετέθη, <mark>ἄχρις οὗ ἔλθῃ</mark> τὸ σπέρμα</strong> ᾧ ἐπήγγελται, διαταγεὶς δι᾿ ἀγγέλων ἐν χειρὶ μεσίτου.» (<a href="https://bibleox.com/el/gr-lxx-byz/gal/3/#L19">Γαλ 3:19</a>)</p></blockquote><h3>Ο Νόμος των εντολών καταργήθηκε με τη διδασκαλία</h3><blockquote><p>«Αὐτὸς γάρ ἐστιν ἡ εἰρήνη ἡμῶν, ὁ ποιήσας τὰ ἀμφότερα ἓν καὶ τὸ μεσότοιχον τοῦ φραγμοῦ λύσας, τὴν ἔχθραν, ἐν τῇ σαρκὶ αὐτοῦ, <strong><mark>τὸν νόμον τῶν ἐντολῶν ἐν δόγμασιν</mark></strong> <strong><mark>καταργήσας</mark></strong>, ἵνα τοὺς δύο κτίσῃ ἐν αὑτῷ εἰς ἕνα καινὸν ἄνθρωπον ποιῶν εἰρήνην, καὶ ἀποκαταλλάξῃ τοὺς ἀμφοτέρους ἐν ἑνὶ σώματι τῷ θεῷ διὰ τοῦ σταυροῦ, ἀποκτείνας τὴν ἔχθραν ἐν αὐτῷ.» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/2/#L14-16">Εφ 2:14-16</a>)</p></blockquote><h3>Το να φιλονικεί κανείς για τον Νόμο είναι πια άχρηστο</h3><blockquote><p>«μωρὰς δὲ ζητήσεις καὶ γενεαλογίας καὶ <strong>ἔριν καὶ μάχας νομικὰς περιΐστασο</strong>, <strong>εἰσὶν γὰρ ἀνωφελεῖς καὶ μάταιοι</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/tit/3/#L9">Τιτ 3:9</a>)</p></blockquote><h3>Ο ζυγός της δουλείας — ο Νόμος του Μωυσή</h3><blockquote><p>«τῇ ἐλευθερίᾳ ἡμᾶς Χριστὸς ἠλευθέρωσεν· στήκετε οὖν καὶ <strong>μὴ πάλιν <mark>ζυγῷ δουλείας</mark> ἐνέχεσθε</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/gal/5/#L1">Γαλ 5:1</a>)</p></blockquote><h3>Ο ζυγός του Χριστού είναι άλλος, ελαφρός</h3><blockquote><p>«Δεῦτε πρός με πάντες οἱ κοπιῶντες καὶ πεφορτισμένοι, κἀγὼ ἀναπαύσω ὑμᾶς. <strong>ἄρατε τὸν ζυγόν μου ἐφ᾿ ὑμᾶς καὶ <mark>μάθετε ἀπ᾿ ἐμοῦ</mark></strong>, ὅτι πραΰς εἰμι καὶ ταπεινὸς τῇ καρδίᾳ, καὶ εὑρήσετε ἀνάπαυσιν ταῖς ψυχαῖς ὑμῶν· <strong><mark>ὁ γὰρ ζυγός μου χρηστὸς καὶ τὸ φορτίον μου ἐλαφρόν ἐστιν</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/11/#L28-30">Μτ 11:28-30</a>)</p></blockquote><h3>Ο Νέος Νόμος — ο Νόμος του Χριστού — η αγάπη</h3><blockquote><p>«ἡ ἀγάπη τῷ πλησίον κακὸν οὐκ ἐργάζεται· <strong><mark>πλήρωμα οὖν νόμου ἡ ἀγάπη</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/13/#L10">Ρωμ 13:10</a>)</p></blockquote><blockquote><p>«<strong>ὁ γὰρ πᾶς νόμος ἐν ἑνὶ λόγῳ πεπλήρωται, ἐν τῷ <mark>Ἀγαπήσεις</mark></strong> τὸν πλησίον σου ὡς σεαυτόν.» (<a href="https://bibleox.com/el/gr-lxx-byz/gal/5/#L14">Γαλ 5:14</a>)</p></blockquote><h3>Μετά τον μακρύ λόγο για τον Νόμο — πίστη και αγάπη</h3><blockquote><p>«καὶ ὃ ἐὰν αἰτῶμεν λαμβάνομεν ἀπ᾿ αὐτοῦ, ὅτι τὰς ἐντολὰς αὐτοῦ τηροῦμεν καὶ τὰ ἀρεστὰ ἐνώπιον αὐτοῦ ποιοῦμεν. καὶ <strong>αὕτη ἐστὶν ἡ ἐντολὴ αὐτοῦ, ἵνα <mark>πιστεύσωμεν</mark> τῷ ὀνόματι τοῦ υἱοῦ αὐτοῦ Ἰησοῦ Χριστοῦ</strong> <strong>καὶ <mark>ἀγαπῶμεν</mark> ἀλλήλους, <mark>καθὼς ἔδωκεν ἐντολὴν ἡμῖν</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1in/3/#L22-23">Α Ιω 3:22-23</a>)</p></blockquote><blockquote><p>«Ἀλλήλων τὰ βάρη βαστάζετε, καὶ οὕτως <strong><mark>ἀναπληρώσετε τὸν νόμον τοῦ Χριστοῦ</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/gal/6/#L2">Γαλ 6:2</a>)</p></blockquote><blockquote><p>«μαρτύρομαι δὲ πάλιν παντὶ ἀνθρώπῳ περιτεμνομένῳ ὅτι ὀφειλέτης ἐστὶν ὅλον τὸν νόμον ποιῆσαι. <strong><mark>κατηργήθητε ἀπὸ Χριστοῦ</mark> οἵτινες ἐν νόμῳ δικαιοῦσθε, τῆς χάριτος ἐξεπέσατε. ἡμεῖς γὰρ πνεύματι ἐκ πίστεως <mark>ἐλπίδα δικαιοσύνης ἀπεκδεχόμεθα</mark></strong>. ἐν γὰρ Χριστῷ Ἰησοῦ οὔτε περιτομή τι ἰσχύει οὔτε ἀκροβυστία, <strong>ἀλλὰ <mark>πίστις δι᾿ ἀγάπης ἐνεργουμένη</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/gal/5/#L3-6">Γαλ 5:3-6</a>)</p></blockquote><blockquote><p>«<strong><mark>Ὑμεῖς γὰρ ἐπ᾿ ἐλευθερίᾳ ἐκλήθητε, ἀδελφοί</mark></strong>· μόνον μὴ τὴν ἐλευθερίαν εἰς ἀφορμὴν τῇ σαρκί, ἀλλὰ διὰ τῆς <strong><mark>ἀγάπης</mark> δουλεύετε ἀλλήλοις</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/gal/5/#L1,11,13">Γαλ 5:1,11,13</a>)</p></blockquote><h3>Στον θάνατο οδηγεί η έλλειψη πίστης, όχι η παράβαση του Νόμου του Μωυσή</h3><blockquote><p>«ὁ ἔχων τὸν υἱὸν ἔχει τὴν ζωήν· ὁ μὴ ἔχων τὸν υἱὸν τοῦ θεοῦ τὴν ζωὴν οὐκ ἔχει.» (<a href="https://bibleox.com/el/gr-lxx-byz/1in/5/#L12">Α Ιω 5:12</a>)</p></blockquote><h3>Η σωτηρία ήρθε ανεξάρτητα από τα έργα του Νόμου του Μωυσή</h3><blockquote><p>«Νυνὶ δὲ <strong><mark>χωρὶς νόμου</mark> δικαιοσύνη θεοῦ πεφανέρωται</strong>, μαρτυρουμένη ὑπὸ τοῦ νόμου καὶ τῶν προφητῶν, δικαιοσύνη δὲ θεοῦ διὰ πίστεως Ἰησοῦ Χριστοῦ, εἰς πάντας τοὺς πιστεύοντας· οὐ γάρ ἐστιν διαστολή·» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/3/#L21-22">Ρωμ 3:21-22</a>)</p></blockquote><blockquote><p>«<strong>Οὐδὲν ἄρα νῦν κατάκριμα τοῖς <mark>ἐν Χριστῷ Ἰησοῦ</mark></strong>· <strong><mark>ὁ γὰρ νόμος τοῦ πνεύματος τῆς ζωῆς ἐν Χριστῷ Ἰησοῦ ἠλευθέρωσέν με ἀπὸ τοῦ νόμου</mark></strong> τῆς ἁμαρτίας καὶ τοῦ θανάτου.» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/8/#L1-2">Ρωμ 8:1-2</a>)</p></blockquote><h3>Η ζωή κατά τον Νόμο — ζωή κατά τη σάρκα</h3><blockquote><p>«τοῦτο μόνον θέλω μαθεῖν ἀφ᾿ ὑμῶν, <strong><mark>ἐξ ἔργων νόμου τὸ πνεῦμα ἐλάβετε</mark></strong> ἢ ἐξ ἀκοῆς πίστεως; οὕτως ἀνόητοί ἐστε; <strong>ἐναρξάμενοι πνεύματι νῦν <mark>σαρκὶ ἐπιτελεῖσθε</mark></strong>;» (<a href="https://bibleox.com/el/gr-lxx-byz/gal/3/#L2-3,23">Γαλ 3:2-3,23</a>)</p></blockquote><h3>Η ζωή κατά το Πνεύμα είναι ανώτερη από τη ζωή κατά τον Νόμο</h3><blockquote><p>«Λέγω δέ, <strong>πνεύματι περιπατεῖτε</strong> καὶ ἐπιθυμίαν σαρκὸς οὐ μὴ τελέσητε. &lt;…&gt; <strong>εἰ δὲ πνεύματι ἄγεσθε, <mark>οὐκ ἐστὲ ὑπὸ νόμον</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/gal/5/#L16,18">Γαλ 5:16,18</a>)</p></blockquote><blockquote><p>«Ὁ δὲ καρπὸς τοῦ πνεύματός ἐστιν ἀγάπη, χαρά, εἰρήνη, μακροθυμία, χρηστότης, ἀγαθωσύνη, πίστις, πραΰτης, ἐγκράτεια· <strong><mark>κατὰ τῶν τοιούτων οὐκ ἔστιν νόμος</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/gal/5/#L22-23">Γαλ 5:22-23</a>)</p></blockquote>'
