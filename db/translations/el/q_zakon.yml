    parent: Παλαιά Διαθήκη/Νόμος
    title: Η επαφή με νεκρό
    priority: 4
  update: true
  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: '<h2>Η απαγόρευση του αγγίγματος νεκρών στην Παλαιά Διαθήκη</h2><p>Το άγγιγμα νεκρού καθιστούσε τον άνθρωπο ακάθαρτο (μιασμένο). Ωστόσο οι συγγενείς μπορούσαν να αγγίζουν τους δικούς τους νεκρούς χωρίς να μολύνονται:</p><blockquote><p>«Καὶ εἶπεν κύριος πρὸς Μωυσῆν λέγων Εἰπὸν τοῖς ἱερεῦσιν τοῖς υἱοῖς Ααρων καὶ ἐρεῖς πρὸς αὐτούς <strong>Ἐν ταῖς ψυχαῖς οὐ μιανθήσονται ἐν τῷ ἔθνει αὐτῶν</strong> <strong>ἀλλ᾿ ἢ ἐν τῷ οἰκείῳ τῷ ἔγγιστα αὐτῶν</strong>, ἐπὶ πατρὶ καὶ μητρὶ καὶ υἱοῖς καὶ θυγατράσιν, ἐπ᾿ ἀδελφῷ καὶ ἐπ᾿ ἀδελφῇ παρθένῳ τῇ ἐγγιζούσῃ αὐτῷ τῇ μὴ ἐκδεδομένῃ ἀνδρί, <strong>ἐπὶ τούτοις μιανθήσεται</strong>. <strong>οὐ μιανθήσεται ἐξάπινα ἐν τῷ λαῷ αὐτοῦ</strong> εἰς βεβήλωσιν αὐτοῦ.» (<a href="https://bibleox.com/el/gr-lxx-byz/lev/21/#L1-4">Λευ 21:1-4</a>)</p></blockquote><blockquote><p>«Καὶ παρεγένοντο οἱ ἄνδρες, οἳ ἦσαν <strong>ἀκάθαρτοι ἐπὶ ψυχῇ ἀνθρώπου</strong> καὶ οὐκ ἠδύναντο ποιῆσαι τὸ πασχα ἐν τῇ ἡμέρᾳ ἐκείνῃ» (<a href="https://bibleox.com/el/gr-lxx-byz/chis/9/#L6">Αρ 9:6</a>)</p></blockquote><blockquote><p>«πᾶς <strong>ὁ ἁπτόμενος τοῦ τεθνηκότος</strong> ἀπὸ ψυχῆς ἀνθρώπου, ἐὰν ἀποθάνῃ, καὶ μὴ ἀφαγνισθῇ, τὴν σκηνὴν κυρίου ἐμίανεν· ἐκτριβήσεται ἡ ψυχὴ ἐκείνη ἐξ Ισραηλ· ὅτι ὕδωρ ῥαντισμοῦ οὐ περιερραντίσθη ἐπ᾿ αὐτόν, <strong>ἀκάθαρτός ἐστιν</strong>, ἔτι ἡ ἀκαθαρσία αὐτοῦ ἐν αὐτῷ ἐστιν.» (<a href="https://bibleox.com/el/gr-lxx-byz/chis/19/#L13">Αρ 19:13</a>)</p></blockquote><blockquote><p>«καὶ <strong>ἐπὶ ψυχὴν ἀνθρώπου οὐκ εἰσελεύσονται τοῦ μιανθῆναι</strong>, ἀλλ᾿ ἢ ἐπὶ πατρὶ καὶ ἐπὶ μητρὶ καὶ ἐπὶ υἱῷ καὶ ἐπὶ θυγατρὶ καὶ ἐπὶ ἀδελφῷ καὶ ἐπὶ ἀδελφῇ αὐτοῦ, ἣ οὐ γέγονεν ἀνδρί, μιανθήσεται.» (<a href="https://bibleox.com/el/gr-lxx-byz/iez/44/#L25">Ιεζ 44:25</a>)</p></blockquote><blockquote><p>«καὶ εἶπεν Αγγαιος Ἐὰν ἅψηται <strong>μεμιαμμένος ἐπὶ ψυχῇ</strong> ἀπὸ παντὸς τούτων, εἰ μιανθήσεται; καὶ ἀπεκρίθησαν οἱ ἱερεῖς καὶ εἶπαν <strong>Μιανθήσεται</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ag/2/#L13">Αγγ 2:13</a>)</p></blockquote><h2>Η επαφή με τα λείψανα των δικαίων</h2><p>Στους χρόνους της Παλαιάς Διαθήκης, από το άγγιγμα των λειψάνων του προφήτη Ελισαίου αναστήθηκε ένας νεκρός:</p><blockquote><p>«καὶ ἐγένετο αὐτῶν θαπτόντων τὸν ἄνδρα καὶ ἰδοὺ εἶδον τὸν μονόζωνον καὶ ἔρριψαν τὸν ἄνδρα ἐν τῷ τάφῳ Ελισαιε, καὶ <strong>ἐπορεύθη καὶ ἥψατο τῶν ὀστέων Ελισαιε καὶ ἔζησεν</strong> καὶ ἀνέστη ἐπὶ τοὺς πόδας αὐτοῦ.» (<a href="https://bibleox.com/el/gr-lxx-byz/4ts/13/#L21">Δ Βασ 13:21</a>)</p></blockquote><h2>Η κατάργηση των ιουδαϊκών διατάξεων</h2><blockquote><p>«ἔδοξεν γὰρ τῷ πνεύματι τῷ ἁγίῳ καὶ ἡμῖν <strong>μηδὲν πλέον ἐπιτίθεσθαι ὑμῖν βάρος πλὴν τούτων τῶν ἐπάναγκες</strong>, ἀπέχεσθαι εἰδωλοθύτων καὶ αἵματος καὶ πνικτῶν καὶ πορνείας· ἐξ ὧν διατηροῦντες ἑαυτοὺς εὖ πράξετε. Ἔρρωσθε.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/15/#L28-29">Πραξ 15:28-29</a>)</p></blockquote><blockquote><p>«<strong>περὶ δὲ τῶν πεπιστευκότων ἐθνῶν ἡμεῖς ἐπεστείλαμεν κρίναντες φυλάσσεσθαι αὐτοὺς τό τε εἰδωλόθυτον καὶ αἷμα καὶ πνικτὸν καὶ πορνείαν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/21/#L25">Πραξ 21:25</a>)</p></blockquote><p>Περισσότερα: <a href="https://bibleox.com/el/el/w/Η_κατάργηση_του_Νόμου_του_Μωυσή">η κατάργηση των ιουδαϊκών διατάξεων</a></p><h2>Η επαφή με νεκρούς στην Καινή Διαθήκη</h2><p>Ο Κύριος Ιησούς Χριστός άγγιξε το νεκρό κορίτσι του Ιαείρου:</p><blockquote><p>«καὶ <strong>κρατήσας τῆς χειρὸς τοῦ παιδίου λέγει αὐτῇ</strong>, Ταλιθα κουμ, ὅ ἐστιν μεθερμηνευόμενον Τὸ κοράσιον, σοὶ λέγω, ἔγειρε.» (<a href="https://bibleox.com/el/gr-lxx-byz/mk/5/#L41">Μκ 5:41</a>)</p></blockquote><p>Κατά τον Νόμο, όταν ο Χριστός πέθανε στον σταυρό, δεν επιτρεπόταν να Τον αγγίξει κανείς, αφού ήταν πλέον νεκρός. Μόνο η Θεοτόκος μπορούσε να το κάνει αυτό, ως συγγενής (<a href="https://bibleox.com/el/gr-lxx-byz/lev/21/#L1-4">Λευ 21:1-4</a>). Ωστόσο δεν κατακρίνουμε τον Ιωάννη τον Θεολόγο, τον Νικόδημο και τον Ιωσήφ από την Αριμαθαία, αλλά τους επαινούμε, γιατί δεν φοβήθηκαν τίποτα και υπηρέτησαν τον Σωτήρα μας:</p><blockquote><p>«καὶ λαβὼν τὸ σῶμα <strong>ὁ Ἰωσὴφ</strong> ἐνετύλιξεν αὐτὸ ἐν σινδόνι καθαρᾷ, καὶ ἔθηκεν αὐτὸ ἐν τῷ καινῷ αὐτοῦ μνημείῳ ὃ ἐλατόμησεν ἐν τῇ πέτρᾳ, καὶ προσκυλίσας λίθον μέγαν τῇ θύρᾳ τοῦ μνημείου ἀπῆλθεν.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/27/#L59-60">Μτ 27:59-60</a>)</p></blockquote><blockquote><p>«καὶ ἀκούσαντες <strong>οἱ μαθηταὶ</strong> αὐτοῦ ἦλθον καὶ ἦραν τὸ πτῶμα αὐτοῦ καὶ ἔθηκαν αὐτὸ ἐν μνημείῳ.» (<a href="https://bibleox.com/el/gr-lxx-byz/mk/6/#L29">Μκ 6:29</a>)</p></blockquote><blockquote><p>«καὶ γνοὺς ἀπὸ τοῦ κεντυρίωνος ἐδωρήσατο τὸ πτῶμα <strong>τῷ Ἰωσήφ</strong>. καὶ ἀγοράσας σινδόνα καθελὼν αὐτὸν ἐνείλησεν τῇ σινδόνι καὶ ἔθηκεν αὐτὸν ἐν μνημείῳ ὃ ἦν λελατομημένον ἐκ πέτρας, καὶ προσεκύλισεν λίθον ἐπὶ τὴν θύραν τοῦ μνημείου.» (<a href="https://bibleox.com/el/gr-lxx-byz/mk/15/#L45-46">Μκ 15:45-46</a>)</p></blockquote><blockquote><p>«ὡς δὲ ἐτέλεσαν πάντα τὰ περὶ αὐτοῦ γεγραμμένα, <strong>καθελόντες ἀπὸ τοῦ ξύλου ἔθηκαν εἰς μνημεῖον</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/13/#L29">Πραξ 13:29</a>)</p></blockquote><p>Ο απόστολος αγγίζει τον νεκρό νέο:</p><blockquote><p>«καθεζόμενος δέ τις νεανίας ὀνόματι Εὔτυχος ἐπὶ τῆς θυρίδος, καταφερόμενος ὕπνῳ βαθεῖ διαλεγομένου τοῦ Παύλου ἐπὶ πλεῖον, κατενεχθεὶς ἀπὸ τοῦ ὕπνου ἔπεσεν ἀπὸ τοῦ τριστέγου κάτω καὶ ἤρθη <strong>νεκρός</strong>. καταβὰς δὲ ὁ Παῦλος <strong>ἐπέπεσεν αὐτῷ καὶ συμπεριλαβὼν</strong> εἶπεν, Μὴ θορυβεῖσθε, ἡ γὰρ ψυχὴ αὐτοῦ ἐν αὐτῷ ἐστιν.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/20/#L9-10">Πραξ 20:9-10</a>)</p></blockquote>'
- src: закваска
