  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <h2>Ο Κύριος Ιησούς Χριστός έπινε κρασί</h2><blockquote><p>«ἦλθεν <strong>ὁ υἱὸς τοῦ ἀνθρώπου ἐσθίων καὶ πίνων</strong>, καὶ λέγουσιν, Ἰδοὺ ἄνθρωπος φάγος καὶ <strong>οἰνοπότης</strong>, τελωνῶν φίλος καὶ ἁμαρτωλῶν. καὶ ἐδικαιώθη ἡ σοφία ἀπὸ τῶν ἔργων αὐτῆς.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/11/#L19">Μτ 11:19</a>)</p></blockquote><blockquote><p>«ἀμὴν λέγω ὑμῖν ὅτι <strong>οὐκέτι οὐ μὴ πίω ἐκ τοῦ γενήματος τῆς ἀμπέλου</strong> ἕως τῆς ἡμέρας ἐκείνης ὅταν αὐτὸ πίνω καινὸν ἐν τῇ βασιλείᾳ τοῦ θεοῦ.» (<a href="https://bibleox.com/el/gr-lxx-byz/mk/14/#L25">Μκ 14:25</a>)</p></blockquote><h2>Ο Κύριος μετέτρεψε το νερό σε κρασί στον γάμο της Κανά της Γαλιλαίας</h2><blockquote><p>«ὡς δὲ <strong>ἐγεύσατο ὁ ἀρχιτρίκλινος τὸ ὕδωρ οἶνον γεγενημένον</strong>, καὶ οὐκ ᾔδει πόθεν ἐστίν, οἱ δὲ διάκονοι ᾔδεισαν οἱ ἠντληκότες τὸ ὕδωρ, φωνεῖ τὸν νυμφίον ὁ ἀρχιτρίκλινος» (<a href="https://bibleox.com/el/gr-lxx-byz/in/2/#L9">Ιω 2:9</a>)</p></blockquote><h2>Λόγω ασθένειας προτείνεται στον Τιμόθεο να πίνει λίγο κρασί</h2><blockquote><p>«Μηκέτι ὑδροπότει, ἀλλὰ <strong>οἴνῳ ὀλίγῳ χρῶ</strong> διὰ τὸν στόμαχον καὶ τὰς πυκνάς σου ἀσθενείας.» (<a href="https://bibleox.com/el/gr-lxx-byz/1tim/5/#L23">Α Τιμ 5:23</a>)</p></blockquote><h2>Παρατήρηση</h2><p>Δεν είναι αμαρτία η κατανάλωση φαγητού, αλλά η λαιμαργία και η καλοφαγία. Δεν είναι αμαρτία η κατανάλωση κρασιού, αλλά η μέθη.</p>
