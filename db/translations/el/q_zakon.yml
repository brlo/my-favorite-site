  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: '<h2>Η ζύμη — το μικρό που επηρεάζει τα πάντα</h2><p>Η εικόνα της ζύμης στην Καινή Διαθήκη <u>δεν</u> χρησιμοποιείται ως κάτι κακό ή καλό από μόνο του, αλλά για να δείξει πώς ένα μικρό μέρος μπορεί να επηρεάσει όλα τα υπόλοιπα. Βάζουν λίγη ζύμη στο αλεύρι, αλλά τελικά κάνει όλο το φύραμα να ζυμωθεί.</p><p>Εκτός από τη ζύμη, ο Κύριος χρησιμοποιεί συχνά και την εικόνα του αλατιού, το οποίο επίσης επηρεάζει όλα τα υπόλοιπα (τα συντηρεί από τη φθορά):</p><blockquote><p>«<strong>Ὑμεῖς ἐστε τὸ ἅλας</strong> τῆς γῆς· ἐὰν δὲ τὸ ἅλας μωρανθῇ, ἐν τίνι ἁλισθήσεται; εἰς οὐδὲν ἰσχύει ἔτι εἰ μὴ βληθῆναι ἔξω καὶ καταπατεῖσθαι ὑπὸ τῶν ἀνθρώπων.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/5/#L13">Μτ 5:13</a>)</p></blockquote><blockquote><p>«Καλὸν τὸ ἅλας· ἐὰν δὲ τὸ ἅλας ἄναλον γένηται, ἐν τίνι αὐτὸ ἀρτύσετε; <strong>ἔχετε ἐν ἑαυτοῖς ἅλα</strong>, καὶ εἰρηνεύετε ἐν ἀλλήλοις.» (<a href="https://bibleox.com/el/gr-lxx-byz/mk/9/#L50">Μκ 9:50</a>)</p></blockquote><p>Παράλληλα, το αλάτι, όπως και η ζύμη, έπαιρνε μέρος στις θυσίες της Παλαιάς Διαθήκης:</p><blockquote><p>«καὶ πᾶν <strong>δῶρον θυσίας ὑμῶν ἁλὶ ἁλισθήσεται</strong>· οὐ διαπαύσετε ἅλα διαθήκης κυρίου ἀπὸ θυσιασμάτων ὑμῶν, ἐπὶ παντὸς δώρου ὑμῶν <strong>προσοίσετε κυρίῳ τῷ θεῷ ὑμῶν ἅλας</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/lev/2/#L13">Λευ 2:13</a>)</p></blockquote><h2>Οι θετικές έννοιες της ζύμης</h2><h3>Η ζύμη — η Βασιλεία των Ουρανών</h3><p>Ο Κύριος Ιησούς Χριστός παρομοιάζει τη ζύμη με τη Βασιλεία των Ουρανών. Και πάλι, κάτι μικρό πρέπει να επηρεάσει τα πάντα:</p><blockquote><p>«Ἄλλην παραβολὴν ἐλάλησεν αὐτοῖς· <strong><mark>Ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν ζύμῃ</mark></strong>, ἣν λαβοῦσα γυνὴ ἐνέκρυψεν εἰς ἀλεύρου σάτα τρία ἕως οὗ ἐζυμώθη ὅλον.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/13/#L33">Μτ 13:33</a>)</p></blockquote><blockquote><p>«Καὶ πάλιν εἶπεν, <strong><mark>Τίνι ὁμοιώσω τὴν βασιλείαν τοῦ θεοῦ; ὁμοία ἐστὶν ζύμῃ</mark></strong>, ἣν λαβοῦσα γυνὴ ἐνέκρυψεν εἰς ἀλεύρου σάτα τρία ἕως οὗ ἐζυμώθη ὅλον.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/13/#L20-21">Λκ 13:20-21</a>)</p></blockquote><h2>Οι αρνητικές έννοιες της ζύμης</h2><h3>Η ζύμη — αιρετική διδασκαλία</h3><p>Ο Κύριος Ιησούς Χριστός υποδεικνύει στους αποστόλους τη βλαβερότητα της διδασκαλίας των Φαρισαίων και των Σαδδουκαίων. Χρησιμοποιεί την εικόνα της ζύμης για να δείξει πώς το μικρό μπορεί να επηρεάσει τα πάντα:</p><blockquote><p>«ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς, Ὁρᾶτε καὶ <strong>προσέχετε ἀπὸ τῆς <mark>ζύμης</mark> τῶν Φαρισαίων καὶ Σαδδουκαίων</strong>. &lt;…&gt; πῶς οὐ νοεῖτε ὅτι οὐ περὶ ἄρτων εἶπον ὑμῖν; προσέχετε δὲ ἀπὸ τῆς ζύμης τῶν Φαρισαίων καὶ Σαδδουκαίων. τότε συνῆκαν ὅτι οὐκ εἶπεν προσέχειν ἀπὸ τῆς ζύμης [τῶν ἄρτων] ἀλλὰ ἀπὸ τῆς <strong><mark>διδαχῆς</mark> τῶν Φαρισαίων καὶ Σαδδουκαίων</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/16/#L6,11-12">Μτ 16:6,11-12</a>)</p></blockquote><h3>Η ζύμη — υποκρισία</h3><p>Άλλη φορά ο Χριστός, μπροστά σε χιλιάδες ανθρώπους, χρησιμοποιεί πάλι την εικόνα της ζύμης για να δείξει τη βλαβερότητα του χαρακτηριστικού γνωρίσματος των Φαρισαίων — της υποκρισίας. Και πάλι η υποκρισία αποδεικνύεται κάτι μικρό που επηρεάζει τα πάντα:</p><blockquote><p>«Ἐν οἷς ἐπισυναχθεισῶν τῶν μυριάδων τοῦ ὄχλου, ὥστε καταπατεῖν ἀλλήλους, ἤρξατο λέγειν πρὸς τοὺς μαθητὰς αὐτοῦ πρῶτον, <strong>Προσέχετε ἑαυτοῖς ἀπὸ τῆς <mark>ζύμης</mark></strong>, ἥτις ἐστὶν <strong><mark>ὑπόκρισις</mark></strong>, τῶν Φαρισαίων.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/12/#L1">Λκ 12:1</a>)</p></blockquote><h3>Η ζύμη — ο αμετανόητος πόρνος στην κοινότητα</h3><p>Ο απόστολος Παύλος χρησιμοποιεί την εικόνα της ζύμης για να επιπλήξει την κοινότητα της Κορίνθου επειδή βρίσκεται μέσα σε αυτήν ένας αμετανόητος πόρνος. Ο πόρνος είναι ένα μικρό μέρος της κοινότητας, αλλά μπορεί να ασκήσει επιρροή σε ολόκληρη την κοινότητα:</p><blockquote><p>«Ὅλως ἀκούεται ἐν ὑμῖν πορνεία, καὶ τοιαύτη πορνεία ἥτις οὐδὲ ἐν τοῖς ἔθνεσιν, ὥστε γυναῖκά τινα τοῦ πατρὸς ἔχειν. &lt;…&gt; Οὐ καλὸν τὸ καύχημα ὑμῶν. οὐκ οἴδατε ὅτι <strong><mark>μικρὰ ζύμη ὅλον τὸ φύραμα ζυμοῖ</mark></strong>; <strong>ἐκκαθάρατε τὴν παλαιὰν ζύμην, ἵνα ἦτε νέον φύραμα</strong>, καθώς ἐστε ἄζυμοι. καὶ γὰρ τὸ πάσχα ἡμῶν ἐτύθη Χριστός· ὥστε ἑορτάζωμεν, μὴ ἐν ζύμῃ παλαιᾷ μηδὲ ἐν <strong><mark>ζύμῃ κακίας καὶ πονηρίας</mark></strong>, ἀλλ᾿ ἐν ἀζύμοις εἰλικρινείας καὶ ἀληθείας.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/5/#L1,6-8">Α Κορ 5:1,6-8</a>)</p></blockquote><p>Ο απόστολος προτείνει να απαλλαγούμε όχι από τη ζύμη γενικά, αλλά από τη ζύμη της κακίας και της πονηρίας: δηλαδή να εκδιώξουμε τον αμετανόητο πόρνο από την κοινότητα (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/5/#L9,11">Α Κορ 5:9,11</a>). Εδώ ο απόστολος αποκαλύπτει τις έννοιες της Παλαιάς Διαθήκης και δεν μιλάει για το ψωμί:</p><blockquote><p>«ἐκκαθάρατε τὴν παλαιὰν ζύμην, <strong>ἵνα <mark>ἦτε</mark> νέον φύραμα</strong>, καθώς ἐστε ἄζυμοι. καὶ γὰρ τὸ πάσχα ἡμῶν ἐτύθη Χριστός· ὥστε ἑορτάζωμεν, μὴ ἐν ζύμῃ παλαιᾷ μηδὲ ἐν ζύμῃ κακίας καὶ πονηρίας, ἀλλ᾿ ἐν ἀζύμοις εἰλικρινείας καὶ ἀληθείας.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/5/#L7-8">Α Κορ 5:7-8</a>)</p></blockquote><blockquote><p>«πῶς οὐ νοεῖτε ὅτι οὐ περὶ ἄρτων εἶπον ὑμῖν;» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/16/#L11">Μτ 16:11</a>)</p></blockquote><h3>Η ζύμη — ο άνθρωπος που παρασύρει στον ιουδαϊσμό μέσα στην κοινότητα</h3><p>Ο απόστολος Παύλος χρησιμοποιεί την εικόνα της ζύμης, προειδοποιώντας την κοινότητα της Γαλατίας για τον κίνδυνο να βρίσκονται ανάμεσά τους κάποιοι που διδάσκουν ότι για τη σωτηρία πρέπει να τηρείται ο Νόμος του Μωυσή:</p><blockquote><p>«κατηργήθητε ἀπὸ Χριστοῦ οἵτινες ἐν νόμῳ δικαιοῦσθε, τῆς χάριτος ἐξεπέσατε. ἡμεῖς γὰρ πνεύματι ἐκ πίστεως ἐλπίδα δικαιοσύνης ἀπεκδεχόμεθα. &lt;…&gt; <strong><mark>μικρὰ ζύμη ὅλον τὸ φύραμα ζυμοῖ</mark></strong>. ἐγὼ πέποιθα εἰς ὑμᾶς ἐν κυρίῳ ὅτι οὐδὲν ἄλλο φρονήσετε· ὁ δὲ <strong><mark>ταράσσων ὑμᾶς</mark></strong> βαστάσει τὸ κρίμα, ὅστις ἐὰν ᾖ. &lt;…&gt; <strong>ὄφελον καὶ ἀποκόψονται οἱ ἀναστατοῦντες ὑμᾶς</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/gal/5/#L4-5,9-10,12">Γαλ 5:4-5,9-10,12</a>)</p></blockquote>'
