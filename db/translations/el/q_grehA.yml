  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: '<h2>Η ανθρωποκτονία — αμάρτημα</h2><blockquote>«<b>οὐ φονεύσεις</b>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/20/#L15">Έξ 20:15</a> · <a href="https://bibleox.com/el/gr-lxx-byz/vtor/5/#L18">Δτ 5:18</a>)</blockquote><blockquote>«ὁ δὲ Ἰησοῦς εἶπεν, Τὸ <b>Οὐ φονεύσεις</b>» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/19/#L18">Μτ 19:18</a> · <a href="https://bibleox.com/el/gr-lxx-byz/mf/5/#L21">Μτ 5:21</a> · <a href="https://bibleox.com/el/gr-lxx-byz/mk/10/#L19">Μκ 10:19</a> · <a href="https://bibleox.com/el/gr-lxx-byz/lk/18/#L20">Λκ 18:20</a> · <a href="https://bibleox.com/el/gr-lxx-byz/rim/13/#L9">Ρωμ 13:9</a>)</blockquote>Κάθε βρέφος, είτε βρίσκεται ακόμη στη μήτρα είτε έχει ήδη βγει από αυτήν, είναι άνθρωπος. Η ανθρωποκτονία είναι αμάρτημα. Σε ένα αρχαίο μνημείο της χριστιανικής γραμματείας (Διδαχή) λέγεται γι’ αυτό ευθέως:<blockquote>«<b>οὐ φονεύσεις τέκνον ἐν φθορᾷ</b>, οὐδὲ γεννηθὲν ἀποκτενεῖς» (<a href="https://bibleox.com/grc/grc/w/ΔΙΔΑΧΗ#HH-2">Διδαχή</a>)</blockquote><h2>Το βρέφος είναι επίσης άνθρωπος. Στη μήτρα και έξω από αυτήν.</h2>Η Γραφή ονομάζει βρέφη εκείνα που γεννιούνται πολύ νωρίτερα από το κανονικό (στους 3-4 μήνες της εγκυμοσύνης). Σημείωση: το χωρίο Γ΄ Έσδρας 6:21 δεν υπάρχει στο κείμενο της Ελληνικής Βίβλου του ιστότοπου· η μετάφραση δίνεται από το ρωσικό κείμενο:<blockquote>«και τα βρέφη του ενός έτους θα μιλήσουν με τις φωνές τους, και οι έγκυες γυναίκες <b>θα γεννήσουν πρόωρα βρέφη στους τρεις και στους τέσσερις μήνες</b>, και θα μείνουν ζωντανά και θα δυναμώσουν.»</blockquote>Ο έπαινος στις μαίες που αρνήθηκαν να σκοτώσουν τα νεογέννητα βρέφη:<blockquote>«ἐφοβήθησαν δὲ αἱ μαῖαι τὸν θεὸν καὶ οὐκ ἐποίησαν καθότι συνέταξεν αὐταῖς ὁ βασιλεὺς Αἰγύπτου, καὶ <b>ἐζωογόνουν τὰ ἄρσενα</b>. &lt;…&gt; εὖ δὲ ἐποίει ὁ θεὸς ταῖς μαίαις, καὶ ἐπλήθυνεν ὁ λαὸς καὶ ἴσχυεν σφόδρα. ἐπειδὴ ἐφοβοῦντο αἱ μαῖαι τὸν θεόν, ἐποίησαν ἑαυταῖς οἰκίας. —» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/1/#L17,20-21">Έξ 1:17,20-21</a>)</blockquote>Ο προφήτης Ιωάννης ο Πρόδρομος πληρώθηκε με το Άγιο Πνεύμα ήδη πριν από τη γέννησή του, μέσα στη μήτρα της μητέρας του. Δηλαδή δεν είναι «κάτι» που κάποτε θα γίνει άνθρωπος, αλλά ο ίδιος ο προφήτης Ιωάννης, όντας ακόμη στη μήτρα, γίνεται ναός του Πνεύματος του Θεού.<blockquote>«ἔσται γὰρ μέγας ἐνώπιον [τοῦ] κυρίου, καὶ οἶνον καὶ σίκερα οὐ μὴ πίῃ, καὶ <b>πνεύματος ἁγίου</b> πλησθήσεται ἔτι <b>ἐκ κοιλίας</b> <b>μητρὸς αὐτοῦ</b>» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/1/#L15">Λκ 1:15</a>)</blockquote>Ο Θεός έπλασε στη μήτρα της μητέρας όχι «κάτι» που αργότερα έγινε άνθρωπος, αλλά τον ίδιο τον άνθρωπο, ο οποίος αργότερα απλώς βγήκε από τη μήτρα, δηλαδή γεννήθηκε. Ο Θεός αγίασε τον άνθρωπο ακόμη πριν από τη γέννηση:<blockquote>«Πρὸ τοῦ <b>με</b> <b>πλάσαι σε ἐν κοιλίᾳ</b> ἐπίσταμαί σε καὶ πρὸ τοῦ σε <b>ἐξελθεῖν ἐκ μήτρας</b> ἡγίακά σε, προφήτην εἰς ἔθνη τέθεικά σε.» (<a href="https://bibleox.com/el/gr-lxx-byz/ier/1/#L5">Ιερ 1:5</a>)</blockquote>Το ίδιο λέει και ο προφήτης Ιώβ ο πολύαθλος. Ο Θεός μάς δημιουργεί στη μήτρα, και όχι «κάτι» που αργότερα θα γίνει άνθρωπος:<blockquote>«πότερον οὐχ ὡς καὶ ἐγὼ <b>ἐγενόμην ἐν γαστρί</b>, καὶ ἐκεῖνοι γεγόνασιν; <b>γεγόναμεν</b> δὲ <b>ἐν τῇ αὐτῇ κοιλίᾳ</b>.» (<a href="https://bibleox.com/el/gr-lxx-byz/iov/31/#L15">Ιωβ 31:15</a>)</blockquote>Η διαδικασία της ανάπτυξης του ανθρώπου στη μήτρα της μητέρας περιγράφεται ως δημιουργική πράξη του ίδιου του Θεού. Περιγράφεται έτσι, ώστε ο άνθρωπος υπάρχει ήδη, αλλά ντύνεται τη σάρκα σαν ρούχο, για να βγει στον κόσμο. Ο Ιώβ δεν μιλά για κάποια ύλη που αναπτύχθηκε και ύστερα έγινε ο Ιώβ. Μιλά αμέσως για το έμβρυο ως για τον εαυτό του: δεν έντυσες εσύ <b>εμένα</b> με σάρκα;<blockquote>«αἱ χεῖρές σου ἔπλασάν με καὶ ἐποίησάν με &lt;…&gt; μνήσθητι ὅτι πηλόν με ἔπλασας, εἰς δὲ γῆν με πάλιν ἀποστρέφεις. ἦ οὐχ <b>ὥσπερ γάλα με ἤμελξας, ἐτύρωσας δέ με ἴσα τυρῷ; δέρμα καὶ κρέας με ἐνέδυσας, ὀστέοις δὲ καὶ νεύροις με ἐνεῖρας</b>. ζωὴν δὲ καὶ ἔλεος ἔθου παρ᾿ ἐμοί, ἡ δὲ ἐπισκοπή σου ἐφύλαξέν μου τὸ πνεῦμα.» (<a href="https://bibleox.com/el/gr-lxx-byz/iov/10/#L8-12">Ιωβ 10:8-12</a>)</blockquote>Και ο προφήτης Δαβίδ περιγράφει:<blockquote>«ὅτι σὺ ἐκτήσω τοὺς νεφρούς μου, κύριε, <b>ἀντελάβου μου</b> <b>ἐκ γαστρὸς</b> μητρός μου. &lt;…&gt; οὐκ ἐκρύβη τὸ ὀστοῦν μου ἀπὸ σοῦ, <b>ὃ ἐποίησας ἐν κρυφῇ</b>. καὶ ἡ ὑπόστασίς μου ἐν τοῖς κατωτάτοις τῆς γῆς· <b>τὸ ἀκατέργαστόν μου εἴδοσαν οἱ ὀφθαλμοί σου</b>, καὶ ἐπὶ τὸ βιβλίον σου πάντες γραφήσονται· ἡμέρας πλασθήσονται, καὶ οὐθεὶς ἐν αὐτοῖς.» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/138/#L13,15-16">Ψλ 138:13,15-16</a>)</blockquote>'
