  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <blockquote><p>«μακάριοι οἱ <strong>ἐλεήμονες</strong>, ὅτι αὐτοὶ <strong>ἐλεηθήσονται</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/5/#L7">Μτ 5:7</a>)</p></blockquote><blockquote><p>«Οὕτως οὖν προσεύχεσθε ὑμεῖς· Πάτερ ἡμῶν ὁ ἐν τοῖς οὐρανοῖς, ἁγιασθήτω τὸ ὄνομά σου, &lt;…&gt; καὶ <strong>ἄφες ἡμῖν τὰ ὀφειλήματα ἡμῶν, ὡς καὶ ἡμεῖς ἀφήκαμεν</strong> τοῖς ὀφειλέταις ἡμῶν· &lt;…&gt; <strong>Ἐὰν γὰρ ἀφῆτε τοῖς ἀνθρώποις τὰ παραπτώματα αὐτῶν, ἀφήσει καὶ ὑμῖν ὁ πατὴρ ὑμῶν ὁ οὐράνιος· ἐὰν δὲ μὴ ἀφῆτε τοῖς ἀνθρώποις, οὐδὲ ὁ πατὴρ ὑμῶν ἀφήσει τὰ παραπτώματα ὑμῶν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/6/#L9,12,14-15">Μτ 6:9,12,14-15</a>)</p></blockquote><blockquote><p>«Καὶ μὴ κρίνετε, καὶ οὐ μὴ κριθῆτε· καὶ μὴ καταδικάζετε, καὶ οὐ μὴ καταδικασθῆτε. <strong>ἀπολύετε, καὶ ἀπολυθήσεσθε</strong>·» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/6/#L37">Λκ 6:37</a>)</p></blockquote><blockquote><p>«Τότε προσελθὼν ὁ Πέτρος εἶπεν αὐτῷ, Κύριε, <strong>ποσάκις ἁμαρτήσει εἰς ἐμὲ ὁ ἀδελφός μου</strong> καὶ ἀφήσω αὐτῷ; ἕως ἑπτάκις; λέγει αὐτῷ ὁ Ἰησοῦς, Οὐ λέγω σοι ἕως ἑπτάκις ἀλλὰ ἕως ἑβδομηκοντάκις ἑπτά.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/18/#L21-22">Μτ 18:21-22</a>)</p></blockquote><blockquote><p>«γίνεσθε εἰς ἀλλήλους χρηστοί, εὔσπλαγχνοι, <strong>χαριζόμενοι ἑαυτοῖς</strong> <strong>καθὼς καὶ ὁ θεὸς ἐν Χριστῷ ἐχαρίσατο ὑμῖν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/4/#L32">Εφ 4:32</a>)</p></blockquote><blockquote><p>«Ἦμεν γάρ <strong>ποτε</strong> καὶ <strong>ἡμεῖς</strong> ἀνόητοι, ἀπειθεῖς, πλανώμενοι, δουλεύοντες ἐπιθυμίαις καὶ ἡδοναῖς ποικίλαις, <strong>ἐν κακίᾳ καὶ φθόνῳ διάγοντες</strong>, στυγητοί, <strong>μισοῦντες ἀλλήλους</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/tit/3/#L3">Τιτ 3:3</a>)</p></blockquote><blockquote><p>«<strong>ἐὰν οὖν προσφέρῃς τὸ δῶρόν σου ἐπὶ τὸ θυσιαστήριον κἀκεῖ μνησθῇς ὅτι ὁ ἀδελφός σου ἔχει τι κατὰ σοῦ, ἄφες ἐκεῖ τὸ δῶρόν σου ἔμπροσθεν τοῦ θυσιαστηρίου, καὶ ὕπαγε πρῶτον διαλλάγηθι τῷ ἀδελφῷ σου</strong>, καὶ τότε ἐλθὼν πρόσφερε τὸ δῶρόν σου. <strong>ἴσθι εὐνοῶν τῷ ἀντιδίκῳ σου ταχὺ ἕως ὅτου εἶ μετ᾿ αὐτοῦ ἐν τῇ ὁδῷ</strong>, μήποτέ σε παραδῷ ὁ ἀντίδικος τῷ κριτῇ, καὶ ὁ κριτὴς τῷ ὑπηρέτῃ, καὶ εἰς φυλακὴν βληθήσῃ· ἀμὴν λέγω σοι, οὐ μὴ ἐξέλθῃς ἐκεῖθεν ἕως ἂν ἀποδῷς τὸν ἔσχατον κοδράντην.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/5/#L23-26">Μτ 5:23-26</a>)</p></blockquote><blockquote><p>«<strong>μὴ στενάζετε, ἀδελφοί, κατ᾿ ἀλλήλων, ἵνα μὴ κριθῆτε</strong>· ἰδοὺ ὁ κριτὴς πρὸ τῶν θυρῶν ἕστηκεν.» (<a href="https://bibleox.com/el/gr-lxx-byz/iak/5/#L9">Ιακ 5:9</a>)</p></blockquote><blockquote><p>«πεπληρωμένους πάσῃ ἀδικίᾳ πονηρίᾳ πλεονεξίᾳ κακίᾳ, μεστοὺς φθόνου φόνου <strong>ἔριδος</strong> δόλου κακοηθείας, ψιθυριστάς, καταλάλους, θεοστυγεῖς, <strong>ὑβριστάς</strong>, <strong>ὑπερηφάνους</strong>, ἀλαζόνας, ἐφευρετὰς κακῶν, γονεῦσιν ἀπειθεῖς, ἀσυνέτους, ἀσυνθέτους, <strong>ἀστόργους</strong>, <strong>ἀνελεήμονας</strong>· οἵτινες τὸ δικαίωμα τοῦ θεοῦ ἐπιγνόντες, ὅτι <strong>οἱ τὰ τοιαῦτα πράσσοντες ἄξιοι θανάτου εἰσίν</strong>, οὐ μόνον αὐτὰ ποιοῦσιν ἀλλὰ καὶ συνευδοκοῦσιν τοῖς πράσσουσιν.» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/1/#L29-32">Ρωμ 1:29-32</a>)</p></blockquote><blockquote><p>«φανερὰ δέ ἐστιν τὰ ἔργα τῆς σαρκός, ἅτινά ἐστιν πορνεία, ἀκαθαρσία, ἀσέλγεια, εἰδωλολατρία, φαρμακεία, ἔχθραι, <strong>ἔρις</strong>, ζῆλος, <strong>θυμοί</strong>, <strong>ἐριθείαι</strong>, διχοστασίαι, αἱρέσεις, <strong>φθόνοι</strong>, μέθαι, κῶμοι, καὶ τὰ ὅμοια τούτοις, ἃ προλέγω ὑμῖν καθὼς προεῖπον ὅτι <strong>οἱ τὰ τοιαῦτα πράσσοντες βασιλείαν θεοῦ οὐ κληρονομήσουσιν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/gal/5/#L19-21">Γαλ 5:19-21</a>)</p></blockquote><blockquote><p>«τότε προσκαλεσάμενος αὐτὸν ὁ κύριος αὐτοῦ λέγει αὐτῷ, <strong>Δοῦλε πονηρέ, πᾶσαν τὴν ὀφειλὴν ἐκείνην ἀφῆκά σοι, ἐπεὶ παρεκάλεσάς με</strong>· οὐκ ἔδει καὶ σὲ ἐλεῆσαι τὸν σύνδουλόν σου, ὡς κἀγὼ σὲ ἠλέησα; καὶ ὀργισθεὶς ὁ κύριος αὐτοῦ παρέδωκεν αὐτὸν τοῖς βασανισταῖς ἕως οὗ ἀποδῷ πᾶν τὸ ὀφειλόμενον. <strong>Οὕτως καὶ ὁ πατήρ μου ὁ οὐράνιος ποιήσει ὑμῖν ἐὰν μὴ ἀφῆτε ἕκαστος τῷ ἀδελφῷ αὐτοῦ ἀπὸ τῶν καρδιῶν ὑμῶν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/18/#L32-35">Μτ 18:32-35</a>)</p></blockquote>
