  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <h2>Η καταδίκη της υπερηφάνειας</h2><blockquote><p><em>«πάντες δὲ ἀλλήλοις τὴν ταπεινοφροσύνην ἐγκομβώσασθε, ὅτι </em><strong><em>Ὁ θεὸς ὑπερηφάνοις ἀντιτάσσεται</em></strong><em>, ταπεινοῖς δὲ δίδωσιν χάριν.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/1pet/5/#L5"><em>Α Πε 5:5</em></a><em> · </em><a href="https://bibleox.com/el/gr-lxx-byz/iak/4/#L6"><em>Ιακ 4:6</em></a><em>)</em></p></blockquote><blockquote><p><em>«</em><strong><em>ἀκάθαρτος παρὰ θεῷ πᾶς ὑψηλοκάρδιος</em></strong><em>, χειρὶ δὲ χεῖρας ἐμβαλὼν ἀδίκως οὐκ ἀθῳωθήσεται.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/pr/16/#L5"><em>Πρμ 16:5</em></a><em>)</em></p></blockquote><blockquote><p><em>«</em><strong><em>φόβος κυρίου μισεῖ ἀδικίαν, ὕβριν τε καὶ ὑπερηφανίαν</em></strong><em> καὶ ὁδοὺς πονηρῶν· μεμίσηκα δὲ ἐγὼ διεστραμμένας ὁδοὺς κακῶν.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/pr/8/#L13"><em>Πρμ 8:13</em></a><em>)</em></p></blockquote><h2>Εκδηλώσεις της υπερηφάνειας</h2><blockquote><p><em>«Προσέχετε [δὲ] τὴν δικαιοσύνην ὑμῶν μὴ ποιεῖν ἔμπροσθεν τῶν ἀνθρώπων πρὸς τὸ θεαθῆναι αὐτοῖς· εἰ δὲ μήγε, μισθὸν οὐκ ἔχετε παρὰ τῷ πατρὶ ὑμῶν τῷ ἐν τοῖς οὐρανοῖς. Ὅταν οὖν ποιῇς ἐλεημοσύνην, </em><strong><em>μὴ σαλπίσῃς ἔμπροσθέν σου, ὥσπερ οἱ ὑποκριταὶ ποιοῦσιν</em></strong><em> ἐν ταῖς συναγωγαῖς καὶ ἐν ταῖς ῥύμαις, </em><strong><em>ὅπως δοξασθῶσιν ὑπὸ τῶν ἀνθρώπων</em></strong><em>· ἀμὴν λέγω ὑμῖν, ἀπέχουσιν τὸν μισθὸν αὐτῶν. σοῦ δὲ ποιοῦντος ἐλεημοσύνην μὴ γνώτω ἡ ἀριστερά σου τί ποιεῖ ἡ δεξιά σου, ὅπως ᾖ σου ἡ ἐλεημοσύνη ἐν τῷ κρυπτῷ· καὶ ὁ πατήρ σου ὁ βλέπων ἐν τῷ κρυπτῷ [αὐτὸς] ἀποδώσει σοι. Καὶ ὅταν προσεύχησθε, οὐκ ἔσεσθε ὡς οἱ ὑποκριταί· ὅτι φιλοῦσιν ἐν ταῖς συναγωγαῖς καὶ ἐν ταῖς γωνίαις τῶν πλατειῶν ἑστῶτες προσεύχεσθαι, </em><strong><em>ὅπως φανῶσιν τοῖς ἀνθρώποις</em></strong><em>· ἀμὴν λέγω ὑμῖν, ἀπέχουσιν τὸν μισθὸν αὐτῶν. σὺ δὲ ὅταν προσεύχῃ, εἴσελθε εἰς τὸ ταμεῖόν σου καὶ κλείσας τὴν θύραν σου πρόσευξαι τῷ πατρί σου τῷ ἐν τῷ κρυπτῷ· καὶ ὁ πατήρ σου ὁ βλέπων ἐν τῷ κρυπτῷ ἀποδώσει σοι.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/mf/6/#L1-6"><em>Μτ 6:1-6</em></a><em>)</em></p></blockquote><blockquote><p><em>«Εἶπεν δὲ καὶ πρός τινας </em><strong><em>τοὺς πεποιθότας ἐφ᾿ ἑαυτοῖς ὅτι εἰσὶν δίκαιοι καὶ ἐξουθενοῦντας τοὺς λοιποὺς</em></strong><em> τὴν παραβολὴν ταύτην· Ἄνθρωποι δύο ἀνέβησαν εἰς τὸ ἱερὸν προσεύξασθαι, ὁ εἷς Φαρισαῖος καὶ ὁ ἕτερος τελώνης. ὁ Φαρισαῖος σταθεὶς πρὸς ἑαυτὸν ταῦτα προσηύχετο, Ὁ θεός, εὐχαριστῶ σοι ὅτι </em><strong><em>οὐκ εἰμὶ ὥσπερ οἱ λοιποὶ τῶν ἀνθρώπων</em></strong><em>, ἅρπαγες, ἄδικοι, μοιχοί, ἢ καὶ ὡς οὗτος ὁ τελώνης· νηστεύω δὶς τοῦ σαββάτου, ἀποδεκατῶ πάντα ὅσα κτῶμαι.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/lk/18/#L9-12"><em>Λκ 18:9-12</em></a><em>)</em></p></blockquote><blockquote><p><em>«Καὶ μὴ κρίνετε, καὶ οὐ μὴ κριθῆτε· καὶ μὴ καταδικάζετε, καὶ οὐ μὴ καταδικασθῆτε. ἀπολύετε, καὶ ἀπολυθήσεσθε·» (</em><a href="https://bibleox.com/el/gr-lxx-byz/lk/6/#L37"><em>Λκ 6:37</em></a><em>)</em></p></blockquote><blockquote><p><em>«ὁδηγοὶ τυφλοί, οἱ διϋλίζοντες τὸν κώνωπα τὴν δὲ κάμηλον καταπίνοντες.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/mf/23/#L24"><em>Μτ 23:24</em></a><em>)</em></p></blockquote><h2>Η υπερηφάνεια — διαβολικό αμάρτημα</h2><blockquote><p>«Υἱὲ ἀνθρώπου, λαβὲ θρῆνον ἐπὶ τὸν ἄρχοντα Τύρου καὶ εἰπὸν αὐτῷ Τάδε λέγει κύριος κύριος Σὺ ἀποσφράγισμα ὁμοιώσεως καὶ στέφανος κάλλους ἐν τῇ τρυφῇ τοῦ παραδείσου τοῦ θεοῦ ἐγενήθης· πᾶν λίθον χρηστὸν ἐνδέδεσαι, σάρδιον καὶ τοπάζιον καὶ σμάραγδον καὶ ἄνθρακα καὶ σάπφειρον καὶ ἴασπιν καὶ ἀργύριον καὶ χρυσίον καὶ λιγύριον καὶ ἀχάτην καὶ ἀμέθυστον καὶ χρυσόλιθον καὶ βηρύλλιον καὶ ὀνύχιον, καὶ χρυσίου ἐνέπλησας τοὺς θησαυρούς σου καὶ τὰς ἀποθήκας σου ἐν σοὶ ἀφ᾿ ἧς ἡμέρας ἐκτίσθης σύ. <strong>μετὰ τοῦ χερουβ ἔθηκά σε ἐν ὄρει ἁγίῳ θεοῦ</strong>, ἐγενήθης ἐν μέσῳ λίθων πυρίνων. ἐγενήθης ἄμωμος σὺ ἐν ταῖς ἡμέραις σου ἀφ᾿ ἧς ἡμέρας σὺ ἐκτίσθης <strong>ἕως εὑρέθη τὰ ἀδικήματα ἐν σοί</strong>. ἀπὸ πλήθους τῆς ἐμπορίας σου <strong>ἔπλησας τὰ ταμίειά σου ἀνομίας καὶ ἥμαρτες</strong> καὶ ἐτραυματίσθης ἀπὸ ὄρους τοῦ θεοῦ, καὶ ἤγαγέν σε τὸ χερουβ ἐκ μέσου λίθων πυρίνων. <strong><mark>ὑψώθη ἡ καρδία σου</mark> ἐπὶ τῷ κάλλει σου, διεφθάρη ἡ ἐπιστήμη σου μετὰ τοῦ κάλλους σου</strong>· διὰ πλῆθος ἁμαρτιῶν σου ἐπὶ τὴν γῆν ἔρριψά σε, ἐναντίον βασιλέων ἔδωκά σε παραδειγματισθῆναι.» (<a href="https://bibleox.com/el/gr-lxx-byz/iez/28/#L12-17">Ιεζ 28:12-17</a>)</p></blockquote><blockquote><p>«πῶς ἐξέπεσεν ἐκ τοῦ οὐρανοῦ ὁ ἑωσφόρος ὁ πρωῒ ἀνατέλλων; συνετρίβη εἰς τὴν γῆν ὁ ἀποστέλλων πρὸς πάντα τὰ ἔθνη. σὺ δὲ <strong><mark>εἶπας ἐν τῇ διανοίᾳ σου Εἰς τὸν οὐρανὸν ἀναβήσομαι, ἐπάνω τῶν ἄστρων τοῦ οὐρανοῦ</mark> θήσω τὸν θρόνον μου, καθιῶ ἐν ὄρει ὑψηλῷ ἐπὶ τὰ ὄρη τὰ ὑψηλὰ τὰ πρὸς βορρᾶν, ἀναβήσομαι ἐπάνω τῶν νεφελῶν, ἔσομαι ὅμοιος τῷ ὑψίστῳ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/is/14/#L12-14">Ησ 14:12-14</a>)</p></blockquote>
