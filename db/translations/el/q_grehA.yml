  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <p>Μερικά από τα θανάσιμα αμαρτήματα που αναφέρονται στη Βίβλο:</p><blockquote><p>«πεπληρωμένους πάσῃ ἀδικίᾳ πονηρίᾳ πλεονεξίᾳ κακίᾳ, μεστοὺς φθόνου φόνου ἔριδος δόλου κακοηθείας, ψιθυριστάς, καταλάλους, θεοστυγεῖς, ὑβριστάς, ὑπερηφάνους, ἀλαζόνας, ἐφευρετὰς κακῶν, γονεῦσιν ἀπειθεῖς, ἀσυνέτους, ἀσυνθέτους, ἀστόργους, ἀνελεήμονας· οἵτινες τὸ δικαίωμα τοῦ θεοῦ ἐπιγνόντες, ὅτι <strong>οἱ τὰ τοιαῦτα πράσσοντες ἄξιοι θανάτου εἰσίν</strong>, οὐ μόνον αὐτὰ ποιοῦσιν ἀλλὰ καὶ συνευδοκοῦσιν τοῖς πράσσουσιν.» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/1/#L29-32">Ρωμ 1:29-32</a>)</p></blockquote><blockquote><p>«φανερὰ δέ ἐστιν τὰ ἔργα τῆς σαρκός, ἅτινά ἐστιν πορνεία, ἀκαθαρσία, ἀσέλγεια, εἰδωλολατρία, φαρμακεία, ἔχθραι, ἔρις, ζῆλος, θυμοί, ἐριθείαι, διχοστασίαι, αἱρέσεις, φθόνοι, μέθαι, κῶμοι, καὶ τὰ ὅμοια τούτοις, ἃ προλέγω ὑμῖν καθὼς προεῖπον ὅτι <strong>οἱ τὰ τοιαῦτα πράσσοντες βασιλείαν θεοῦ οὐ κληρονομήσουσιν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/gal/5/#L19-21">Γαλ 5:19-21</a>)</p></blockquote><blockquote><p>«ἢ οὐκ οἴδατε ὅτι ἄδικοι θεοῦ βασιλείαν οὐ κληρονομήσουσιν; μὴ πλανᾶσθε· οὔτε πόρνοι οὔτε εἰδωλολάτραι οὔτε μοιχοὶ οὔτε μαλακοὶ οὔτε ἀρσενοκοῖται οὔτε κλέπται οὔτε πλεονέκται, οὐ μέθυσοι, οὐ λοίδοροι, οὐχ ἅρπαγες <strong>βασιλείαν θεοῦ κληρονομήσουσιν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/6/#L9-10">Α Κορ 6:9-10</a>)</p></blockquote><blockquote><p>«ἴστε γινώσκοντες ὅτι πᾶς πόρνος ἢ ἀκάθαρτος ἢ πλεονέκτης, ὅ ἐστιν εἰδωλολάτρης, <strong>οὐκ ἔχει κληρονομίαν ἐν τῇ βασιλείᾳ τοῦ Χριστοῦ καὶ θεοῦ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/5/#L5">Εφ 5:5</a>)</p></blockquote><blockquote><p>«τοῖς δὲ δειλοῖς καὶ ἀπίστοις καὶ ἐβδελυγμένοις καὶ φονεῦσιν καὶ πόρνοις καὶ φαρμάκοις καὶ εἰδωλολάτραις καὶ πᾶσιν τοῖς ψευδέσιν <strong>τὸ μέρος αὐτῶν ἐν τῇ λίμνῃ τῇ καιομένῃ πυρὶ καὶ θείῳ</strong>, ὅ ἐστιν ὁ θάνατος ὁ δεύτερος.» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/21/#L8">Απ 21:8</a>)</p></blockquote><blockquote><p>«Μακάριοι οἱ πλύνοντες τὰς στολὰς αὐτῶν, ἵνα ἔσται ἡ ἐξουσία αὐτῶν ἐπὶ τὸ ξύλον τῆς ζωῆς καὶ τοῖς πυλῶσιν εἰσέλθωσιν εἰς τὴν πόλιν. <strong>ἔξω</strong> οἱ κύνες καὶ οἱ φάρμακοι καὶ οἱ πόρνοι καὶ οἱ φονεῖς καὶ οἱ εἰδωλολάτραι καὶ πᾶς φιλῶν καὶ ποιῶν ψεῦδος.» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/22/#L14-15">Απ 22:14-15</a>)</p></blockquote><blockquote><p>«μάρτυς ψευδὴς οὐκ ἀτιμώρητος ἔσται, <strong><mark>ὁ δὲ ἐγκαλῶν ἀδίκως οὐ διαφεύξεται</mark></strong>. &lt;…&gt; μάρτυς ψευδὴς οὐκ ἀτιμώρητος ἔσται· <strong><mark>ὃς δ᾿ ἂν ἐκκαύσῃ κακίαν, ἀπολεῖται ὑπ᾿ αὐτῆς</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/pr/19/#L5,9">Πρμ 19:5,9</a>)</p></blockquote><p>Όλα τα αμαρτήματα μπορούν να συγχωρεθούν, όσο ο άνθρωπος είναι ζωντανός και ικανός να μετανοήσει, μπαίνοντας στην Εκκλησία του Χριστού. Ο άνθρωπος θα κριθεί γι’ αυτό που έκανε, ζώντας στο σώμα:</p><blockquote><p><em>«τοὺς γὰρ πάντας ἡμᾶς φανερωθῆναι δεῖ ἔμπροσθεν τοῦ βήματος τοῦ Χριστοῦ, ἵνα κομίσηται ἕκαστος </em><strong><em>τὰ διὰ τοῦ σώματος πρὸς ἃ ἔπραξεν</em></strong><em>, εἴτε ἀγαθὸν εἴτε φαῦλον.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/2kor/5/#L10"><em>Β Κορ 5:10</em></a><em>)</em></p></blockquote>
