  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: '<h2>Αμαρτία</h2>Στο τμήμα «Μαγεία» ανήκουν και όλα τα υπόλοιπα: <ul><li>μαντεία (οποιαδήποτε),</li><li>κλήση πνευμάτων,</li><li>πίστη στη μαγεία (οποιαδήποτε, μαύρη, λευκή),</li><li>δύναμη φυλαχτών (συμπεριλαμβανομένων των κόκκινων κορδονιών),</li><li>μαγεμένων αντικειμένων,</li><li>ωροσκόπια (αστρολογία),</li><li>προσφυγή σε μέντιουμ,</li><li>σε γόητες,</li><li>σε μάγους,</li><li>σε μάγισσες,</li><li>σε μάντες,</li><li>σε φαρμακούς,</li><li>σε ηλικιωμένες γυναίκες που «βγάζουν» το «μάτι», τη «μαγγανεία», τις «οικογενειακές κατάρες»,</li><li>και ούτω καθεξής:</li></ul><blockquote>«Ἐὰν δὲ εἰσέλθῃς εἰς τὴν γῆν, ἣν κύριος ὁ θεός σου δίδωσίν σοι, οὐ μαθήσῃ ποιεῖν κατὰ τὰ βδελύγματα τῶν ἐθνῶν ἐκείνων. οὐχ εὑρεθήσεται ἐν σοὶ <b>περικαθαίρων τὸν υἱὸν αὐτοῦ ἢ τὴν θυγατέρα αὐτοῦ ἐν πυρί</b>, <b>μαντευόμενος</b> μαντείαν, <b>κληδονιζόμενος</b> καὶ <b>οἰωνιζόμενος</b>, <b>φαρμακός</b>, <b>ἐπαείδων ἐπαοιδήν</b>, <b>ἐγγαστρίμυθος</b> καὶ <b>τερατοσκόπος</b>, <b>ἐπερωτῶν τοὺς νεκρούς</b>. ἔστιν γὰρ <b>βδέλυγμα κυρίῳ τῷ θεῷ σου πᾶς ποιῶν ταῦτα</b>· ἕνεκεν γὰρ τῶν βδελυγμάτων τούτων κύριος ἐξολεθρεύσει αὐτοὺς ἀπὸ σοῦ. τέλειος ἔσῃ ἐναντίον κυρίου τοῦ θεοῦ σου· τὰ γὰρ ἔθνη ταῦτα, οὓς σὺ κατακληρονομεῖς αὐτούς, οὗτοι <b>κληδόνων</b> καὶ <b>μαντειῶν</b> ἀκούσονται, σοὶ δὲ οὐχ οὕτως ἔδωκεν κύριος ὁ θεός σου.» (<a href="https://bibleox.com/el/gr-lxx-byz/vtor/18/#L9-14">Δτ 18:9-14</a>)</blockquote><blockquote>«καὶ διῆγον τοὺς υἱοὺς αὐτῶν καὶ τὰς θυγατέρας αὐτῶν ἐν πυρὶ καὶ <b>ἐμαντεύοντο μαντείας</b> καὶ <b>οἰωνίζοντο</b> καὶ ἐπράθησαν τοῦ ποιῆσαι τὸ πονηρὸν ἐν ὀφθαλμοῖς κυρίου παροργίσαι αὐτόν.» (<a href="https://bibleox.com/el/gr-lxx-byz/4ts/17/#L17">Δ Βασ 17:17</a>)</blockquote><blockquote>«καὶ αὐτὸς <b>διήγαγεν τὰ τέκνα αὐτοῦ ἐν πυρὶ</b> ἐν Γαι — βαναι — εννομ καὶ <b>ἐκληδονίζετο</b> καὶ <b>οἰωνίζετο</b> καὶ <b>ἐφαρμακεύετο</b> καὶ ἐποίησεν <b>ἐγγαστριμύθους</b> καὶ <b>ἐπαοιδούς</b>· <b>ἐπλήθυνεν τοῦ ποιῆσαι τὸ πονηρὸν ἐναντίον κυρίου</b> τοῦ παροργίσαι αὐτόν. καὶ <b>ἔθηκεν τὸ γλυπτὸν</b> καὶ τὸ χωνευτόν, εἰκόνα ἣν ἐποίησεν, ἐν οἴκῳ θεοῦ, οὗ εἶπεν ὁ θεὸς πρὸς Δαυιδ καὶ πρὸς Σαλωμων υἱὸν αὐτοῦ Ἐν τῷ οἴκῳ τούτῳ καὶ Ιερουσαλημ, ἣν ἐξελεξάμην ἐκ πασῶν φυλῶν Ισραηλ, θήσω τὸ ὄνομά μου εἰς τὸν αἰῶνα·» (<a href="https://bibleox.com/el/gr-lxx-byz/2par/33/#L6-7">Β Παρ 33:6-7</a>)</blockquote><blockquote>«καὶ ἐὰν εἴπωσιν πρὸς ὑμᾶς Ζητήσατε <b>τοὺς ἀπὸ τῆς γῆς φωνοῦντας</b> καὶ <b>τοὺς ἐγγαστριμύθους</b>, <b>τοὺς κενολογοῦντας</b> <b>οἳ ἐκ τῆς κοιλίας φωνοῦσιν</b>, <b>οὐκ ἔθνος πρὸς θεὸν αὐτοῦ</b>; τί ἐκζητοῦσιν περὶ τῶν ζώντων τοὺς νεκρούς;» (<a href="https://bibleox.com/el/gr-lxx-byz/is/8/#L19">Ησ 8:19</a>)</blockquote><blockquote>«καὶ ὑμεῖς μὴ ἀκούετε <b>τῶν ψευδοπροφητῶν ὑμῶν</b> καὶ <b>τῶν μαντευομένων ὑμῖν</b> καὶ <b>τῶν ἐνυπνιαζομένων ὑμῖν</b> καὶ <b>τῶν οἰωνισμάτων ὑμῶν</b> καὶ <b>τῶν φαρμακῶν ὑμῶν</b> τῶν λεγόντων Οὐ μὴ ἐργάσησθε τῷ βασιλεῖ Βαβυλῶνος·» (<a href="https://bibleox.com/el/gr-lxx-byz/ier/34/#L9">Ιερ 34:9</a>)</blockquote><blockquote>«ὅτι οὕτως εἶπεν κύριος Μὴ ἀναπειθέτωσαν ὑμᾶς <b>οἱ ψευδοπροφῆται οἱ ἐν ὑμῖν</b>, καὶ μὴ ἀναπειθέτωσαν ὑμᾶς <b>οἱ μάντεις ὑμῶν</b>, καὶ <b>μὴ ἀκούετε εἰς τὰ ἐνύπνια ὑμῶν</b>, ἃ ὑμεῖς ἐνυπνιάζεσθε» (<a href="https://bibleox.com/el/gr-lxx-byz/ier/36/#L8">Ιερ 36:8</a>)</blockquote><blockquote>«καὶ ἐρεῖς Τάδε λέγει κύριος Οὐαὶ <b>ταῖς συρραπτούσαις προσκεφάλαια</b> ἐπὶ πάντα ἀγκῶνα χειρὸς καὶ ποιούσαις ἐπιβόλαια ἐπὶ πᾶσαν κεφαλὴν πάσης ἡλικίας τοῦ διαστρέφειν ψυχάς· αἱ ψυχαὶ διεστράφησαν τοῦ λαοῦ μου, καὶ ψυχὰς περιεποιοῦντο.» (<a href="https://bibleox.com/el/gr-lxx-byz/iez/13/#L18">Ιεζ 13:18</a>)</blockquote><blockquote>«διὰ τοῦτο τάδε λέγει κύριος κύριος Ἰδοὺ ἐγὼ ἐπὶ <b>τὰ προσκεφάλαια ὑμῶν</b>, ἐφ᾿ ἃ ὑμεῖς συστρέφετε ἐκεῖ ψυχάς, καὶ διαρρήξω αὐτὰ ἀπὸ τῶν βραχιόνων ὑμῶν καὶ ἐξαποστελῶ τὰς ψυχάς, ἃς ὑμεῖς ἐκστρέφετε τὰς ψυχὰς αὐτῶν, εἰς διασκορπισμόν·» (<a href="https://bibleox.com/el/gr-lxx-byz/iez/13/#L20">Ιεζ 13:20</a>)</blockquote><blockquote>«Οὕτως λέγει κύριος ὁ λυτρούμενός σε καὶ ὁ πλάσσων σε ἐκ κοιλίας Ἐγὼ κύριος ὁ συντελῶν πάντα ἐξέτεινα τὸν οὐρανὸν μόνος καὶ ἐστερέωσα τὴν γῆν. τίς ἕτερος <b>διασκεδάσει σημεῖα ἐγγαστριμύθων</b> καὶ μαντείας ἀπὸ καρδίας, <b>ἀποστρέφων φρονίμους εἰς τὰ ὀπίσω</b> καὶ <b>τὴν βουλὴν αὐτῶν μωρεύων</b>» (<a href="https://bibleox.com/el/gr-lxx-byz/is/44/#L24-25">Ησ 44:24-25</a>)</blockquote><blockquote>«καὶ ἐξαρῶ <b>τὰ φάρμακά σου</b> ἐκ τῶν χειρῶν σου, καὶ <b>ἀποφθεγγόμενοι</b> οὐκ ἔσονται ἐν σοί· καὶ ἐξολεθρεύσω <b>τὰ γλυπτά σου</b> καὶ τὰς στήλας σου ἐκ μέσου σου, καὶ οὐκέτι μὴ προσκυνήσῃς τοῖς ἔργοις τῶν χειρῶν σου· καὶ ἐκκόψω <b>τὰ ἄλση σου</b> ἐκ μέσου σου καὶ ἀφανιῶ τὰς πόλεις σου·» (<a href="https://bibleox.com/el/gr-lxx-byz/mih/5/#L11-13">Μιχ 5:11-13</a>)</blockquote><blockquote>«καὶ οὐ μετενόησαν ἐκ τῶν φόνων αὐτῶν οὔτε ἐκ <b>τῶν φαρμάκων αὐτῶν</b> οὔτε ἐκ τῆς πορνείας αὐτῶν οὔτε ἐκ τῶν κλεμμάτων αὐτῶν.» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/9/#L21">Απ 9:21</a>)</blockquote><blockquote>«ὁ νικῶν κληρονομήσει ταῦτα, καὶ ἔσομαι αὐτῷ θεὸς καὶ αὐτὸς ἔσται μοι υἱός. τοῖς δὲ δειλοῖς καὶ ἀπίστοις καὶ ἐβδελυγμένοις καὶ φονεῦσιν καὶ πόρνοις καὶ <b>φαρμάκοις</b> καὶ <b>εἰδωλολάτραις</b> καὶ πᾶσιν τοῖς ψευδέσιν τὸ μέρος αὐτῶν ἐν τῇ λίμνῃ τῇ καιομένῃ πυρὶ καὶ θείῳ, ὅ ἐστιν ὁ θάνατος ὁ δεύτερος.» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/21/#L7-8">Απ 21:7-8</a>)</blockquote><blockquote>«ἔξω οἱ κύνες καὶ <b>οἱ φάρμακοι</b> καὶ οἱ πόρνοι καὶ οἱ φονεῖς καὶ οἱ εἰδωλολάτραι καὶ πᾶς φιλῶν καὶ ποιῶν ψεῦδος.» (<a href="https://bibleox.com/el/gr-lxx-byz/otkr/22/#L15">Απ 22:15</a>)</blockquote><h2>Οι γόητες και οι μάγοι απέναντι στον Θεό δεν είναι τίποτα. Δεν θα σώσουν τους ανθρώπους από τις τιμωρίες Του.</h2><blockquote>«νῦν δὲ ἥξει ἐξαίφνης ἐπὶ σὲ τὰ δύο ταῦτα ἐν μιᾷ ἡμέρᾳ· χηρεία καὶ ἀτεκνία ἥξει ἐξαίφνης ἐπὶ σὲ ἐν <b>τῇ φαρμακείᾳ σου</b> ἐν <b>τῇ ἰσχύι τῶν ἐπαοιδῶν σου</b> σφόδρα» (<a href="https://bibleox.com/el/gr-lxx-byz/is/47/#L9">Ησ 47:9</a>)</blockquote><blockquote>«στῆθι νῦν ἐν <b>ταῖς ἐπαοιδαῖς σου</b> καὶ <b>τῇ πολλῇ φαρμακείᾳ σου</b>, ἃ ἐμάνθανες ἐκ νεότητός σου, εἰ δυνήσῃ ὠφεληθῆναι. κεκοπίακας ἐν ταῖς βουλαῖς σου· στήτωσαν καὶ σωσάτωσάν σε <b>οἱ ἀστρολόγοι τοῦ οὐρανοῦ</b>, <b>οἱ ὁρῶντες τοὺς ἀστέρας</b> <b>ἀναγγειλάτωσάν σοι</b> τί μέλλει ἐπὶ σὲ ἔρχεσθαι. ἰδοὺ πάντες <b>ὡς φρύγανα ἐπὶ πυρὶ κατακαήσονται</b> καὶ οὐ μὴ ἐξέλωνται τὴν ψυχὴν αὐτῶν ἐκ φλογός· ὅτι ἔχεις ἄνθρακας πυρός, κάθισαι ἐπ᾿ αὐτούς. οὗτοι ἔσονταί σοι βοήθεια, ἐκοπίασας ἐν τῇ μεταβολῇ σου ἐκ νεότητος, ἄνθρωπος καθ᾿ ἑαυτὸν ἐπλανήθη, <b>σοὶ δὲ οὐκ ἔσται σωτηρία</b>.» (<a href="https://bibleox.com/el/gr-lxx-byz/is/47/#L12-15">Ησ 47:12-15</a>)</blockquote><h2>Η στροφή στις σκοτεινές δυνάμεις — προδοσία του Θεού (μοιχεία)</h2><blockquote>«ὑμεῖς δὲ προσαγάγετε ὧδε, <b>υἱοὶ ἄνομοι</b>, <b>σπέρμα μοιχῶν</b> καὶ <b>πόρνης</b>· ἐν τίνι ἐνετρυφήσατε; καὶ ἐπὶ τίνα ἠνοίξατε τὸ στόμα ὑμῶν; καὶ ἐπὶ τίνα ἐχαλάσατε τὴν γλῶσσαν ὑμῶν; οὐχ ὑμεῖς ἐστε τέκνα ἀπωλείας, σπέρμα ἄνομον; <b>οἱ παρακαλοῦντες ἐπὶ τὰ εἴδωλα</b> ὑπὸ δένδρα δασέα, σφάζοντες τὰ τέκνα αὐτῶν ἐν ταῖς φάραγξιν ἀνὰ μέσον τῶν πετρῶν.» (<a href="https://bibleox.com/el/gr-lxx-byz/is/57/#L3-5">Ησ 57:3-5</a>)</blockquote><blockquote>«ἀπὸ πλήθους πορνείας. πόρνη καλὴ καὶ ἐπιχαρὴς ἡγουμένη <b>φαρμάκων</b> ἡ πωλοῦσα ἔθνη <b>ἐν τῇ πορνείᾳ αὐτῆς</b> καὶ φυλὰς <b>ἐν τοῖς φαρμάκοις αὐτῆς</b>» (<a href="https://bibleox.com/el/gr-lxx-byz/naum/3/#L4">Νμ 3:4</a>)</blockquote><blockquote>«καὶ προσάξω πρὸς ὑμᾶς ἐν κρίσει καὶ ἔσομαι μάρτυς ταχὺς ἐπὶ τὰς <b>φαρμακοὺς</b> καὶ ἐπὶ τὰς <b>μοιχαλίδας</b> καὶ ἐπὶ τοὺς ὀμνύοντας τῷ ὀνόματί μου ἐπὶ ψεύδει καὶ ἐπὶ τοὺς ἀποστεροῦντας μισθὸν μισθωτοῦ καὶ τοὺς καταδυναστεύοντας χήραν καὶ τοὺς κονδυλίζοντας ὀρφανοὺς καὶ τοὺς ἐκκλίνοντας κρίσιν προσηλύτου καὶ τοὺς μὴ φοβουμένους με, λέγει κύριος παντοκράτωρ.» (<a href="https://bibleox.com/el/gr-lxx-byz/mal/3/#L5">Μαλ 3:5</a>)</blockquote><h2>Όταν οι άνθρωποι γίνονταν χριστιανοί, απαρνούνταν τη μαγεία</h2><blockquote>«πολλοί τε τῶν πεπιστευκότων ἤρχοντο ἐξομολογούμενοι καὶ ἀναγγέλλοντες τὰς πράξεις αὐτῶν. ἱκανοὶ δὲ τῶν <b>τὰ περίεργα πραξάντων</b> συνενέγκαντες τὰς βίβλους κατέκαιον ἐνώπιον πάντων· καὶ συνεψήφισαν τὰς τιμὰς αὐτῶν καὶ εὗρον ἀργυρίου μυριάδας πέντε.» (<a href="https://bibleox.com/el/gr-lxx-byz/act/19/#L18-19">Πραξ 19:18-19</a>)</blockquote>'
