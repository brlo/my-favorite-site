  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <p>Ο Κύριος Ιησούς Χριστός απαγορεύει να καταδικάζουμε:</p><blockquote>«<b>Μὴ κρίνετε</b>, ἵνα μὴ κριθῆτε·» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/7/#L1">Μτ 7:1</a>)</blockquote><blockquote>«Καὶ <b>μὴ κρίνετε</b>, καὶ οὐ μὴ κριθῆτε· καὶ <b>μὴ καταδικάζετε</b>, καὶ οὐ μὴ καταδικασθῆτε. ἀπολύετε, καὶ ἀπολυθήσεσθε·» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/6/#L37">Λκ 6:37</a>)</blockquote>Ο Κύριος στρέφει αυτά τα λόγια προς εκείνους που κρίνουν τους άλλους, ενώ οι ίδιοι είναι γεμάτοι από ακόμη μεγαλύτερο αμάρτημα:<blockquote>«ἢ πῶς ἐρεῖς τῷ ἀδελφῷ σου, Ἄφες ἐκβάλω τὸ κάρφος ἐκ τοῦ ὀφθαλμοῦ σου, καὶ ἰδοὺ ἡ δοκὸς ἐν τῷ ὀφθαλμῷ σοῦ; <b>ὑποκριτά, ἔκβαλε πρῶτον τὴν δοκὸν ἐκ τοῦ ὀφθαλμοῦ σοῦ, καὶ τότε διαβλέψεις ἐκβαλεῖν τὸ κάρφος ἐκ τοῦ ὀφθαλμοῦ τοῦ ἀδελφοῦ σου</b>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/7/#L4-5">Μτ 7:4-5</a>)</blockquote>Ταυτόχρονα, διδάσκει να κρίνουμε με δίκαιη κρίση:<blockquote>«μὴ κρίνετε κατ᾿ ὄψιν, ἀλλὰ <b>τὴν δικαίαν κρίσιν κρίνετε</b>.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/7/#L24">Ιω 7:24</a>)</blockquote><blockquote>«διὰ τοῦτο <b>μὴ γίνεσθε ἄφρονες</b>, ἀλλὰ συνίετε τί τὸ θέλημα τοῦ κυρίου.» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/5/#L17">Εφ 5:17</a>)</blockquote><blockquote>«<b>Τί δὲ καὶ ἀφ᾿ ἑαυτῶν οὐ κρίνετε</b> τὸ δίκαιον;» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/12/#L57">Λκ 12:57</a>)</blockquote>Οι απόστολοι μιλούν για την αναγκαιότητα της κρίσης:<blockquote>«τί γάρ μοι τοὺς ἔξω κρίνειν; <b>οὐχὶ τοὺς ἔσω ὑμεῖς κρίνετε</b>; τοὺς δὲ ἔξω ὁ θεὸς κρινεῖ. <b>ἐξάρατε τὸν πονηρὸν ἐξ ὑμῶν αὐτῶν</b>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/5/#L12-13">Α Κορ 5:12-13</a>)</blockquote><blockquote>«Τολμᾷ τις ὑμῶν πρᾶγμα ἔχων πρὸς τὸν ἕτερον κρίνεσθαι ἐπὶ τῶν ἀδίκων, καὶ οὐχὶ ἐπὶ τῶν ἁγίων; ἢ οὐκ οἴδατε ὅτι οἱ ἅγιοι τὸν κόσμον κρινοῦσιν; καὶ εἰ ἐν ὑμῖν κρίνεται ὁ κόσμος, <b>ἀνάξιοί ἐστε κριτηρίων ἐλαχίστων</b>; &lt;…&gt; πρὸς ἐντροπὴν ὑμῖν λέγω. <b>οὕτως οὐκ ἔνι ἐν ὑμῖν οὐδεὶς σοφὸς ὃς δυνήσεται διακρῖναι ἀνὰ μέσον τοῦ ἀδελφοῦ αὐτοῦ</b>;» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/6/#L1-2,5">Α Κορ 6:1-2,5</a>)</blockquote>
