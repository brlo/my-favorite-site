    parent: Άνθρωπος/Αμαρτία
    title: Το ψέμα και η απάτη
    priority: 3
  update: true
  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <blockquote><p>«ὑμεῖς ἐκ τοῦ πατρὸς <strong><mark>τοῦ διαβόλου</mark></strong> ἐστὲ καὶ τὰς ἐπιθυμίας τοῦ πατρὸς ὑμῶν θέλετε ποιεῖν. ἐκεῖνος ἀνθρωποκτόνος ἦν ἀπ᾿ ἀρχῆς, καὶ ἐν τῇ ἀληθείᾳ οὐκ ἔστηκεν, ὅτι οὐκ ἔστιν ἀλήθεια ἐν αὐτῷ. ὅταν λαλῇ τὸ ψεῦδος, ἐκ τῶν ἰδίων λαλεῖ, ὅτι <strong><mark>ψεύστης ἐστὶν καὶ ὁ πατὴρ αὐτοῦ</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/8/#L44">Ιω 8:44</a>)</p></blockquote><blockquote><p>«μάρτυς ψευδὴς οὐκ ἀτιμώρητος ἔσται, <strong>ὁ δὲ ἐγκαλῶν ἀδίκως οὐ διαφεύξεται</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/pr/19/#L5">Πρμ 19:5</a>)</p></blockquote><blockquote><p>«<strong>οὐ ψευδομαρτυρήσεις</strong> κατὰ τοῦ πλησίον σου μαρτυρίαν ψευδῆ.» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/20/#L16">Έξ 20:16</a>)</p></blockquote><blockquote><p>«Οὐ κλέψετε. <strong>οὐ ψεύσεσθε. οὐ συκοφαντήσει ἕκαστος τὸν πλησίον</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/lev/19/#L11">Λευ 19:11</a>)</p></blockquote><blockquote><p>«νυνὶ δὲ ἀπόθεσθε καὶ ὑμεῖς τὰ πάντα, ὀργήν, θυμόν, κακίαν, βλασφημίαν, αἰσχρολογίαν ἐκ τοῦ στόματος ὑμῶν· <strong>μὴ ψεύδεσθε εἰς ἀλλήλους</strong>, ἀπεκδυσάμενοι τὸν παλαιὸν ἄνθρωπον σὺν ταῖς πράξεσιν αὐτοῦ» (<a href="https://bibleox.com/el/gr-lxx-byz/kol/3/#L8-9">Κολ 3:8-9</a>)</p></blockquote><blockquote><p>«Διὸ <strong>ἀποθέμενοι τὸ ψεῦδος λαλεῖτε ἀλήθειαν</strong> ἕκαστος μετὰ τοῦ πλησίον αὐτοῦ, ὅτι ἐσμὲν ἀλλήλων μέλη.» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/4/#L25">Εφ 4:25</a>)</p></blockquote><blockquote><p>«<strong>πᾶσα ἀδικία ἁμαρτία ἐστίν</strong>, καὶ ἔστιν ἁμαρτία οὐ πρὸς θάνατον.» (<a href="https://bibleox.com/el/gr-lxx-byz/1in/5/#L17">Α Ιω 5:17</a>)</p></blockquote><blockquote><p>«<strong>βδέλυγμα κυρίῳ χείλη ψευδῆ</strong>, ὁ δὲ ποιῶν πίστεις δεκτὸς παρ᾿ αὐτῷ.» (<a href="https://bibleox.com/el/gr-lxx-byz/pr/12/#L22">Πρμ 12:22</a>)</p></blockquote><blockquote><p>«οὐ διαμενοῦσιν παράνομοι κατέναντι τῶν ὀφθαλμῶν σου, ἐμίσησας πάντας τοὺς ἐργαζομένους τὴν ἀνομίαν. <strong>ἀπολεῖς πάντας τοὺς λαλοῦντας τὸ ψεῦδος</strong>· ἄνδρα αἱμάτων καὶ δόλιον βδελύσσεται κύριος.» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/5/#L5-6">Ψλ 5:5-6</a>)</p></blockquote><blockquote><p>«καὶ <strong>ἐπικατάρατος</strong> ὃς ἦν δυνατὸς καὶ ὑπῆρχεν ἐν τῷ ποιμνίῳ αὐτοῦ ἄρσεν καὶ εὐχὴ αὐτοῦ ἐπ᾿ αὐτῷ καὶ θύει διεφθαρμένον τῷ κυρίῳ· διότι βασιλεὺς μέγας ἐγώ εἰμι, λέγει κύριος παντοκράτωρ, καὶ τὸ ὄνομά μου ἐπιφανὲς ἐν τοῖς ἔθνεσιν.» (<a href="https://bibleox.com/el/gr-lxx-byz/mal/1/#L14">Μαλ 1:14</a>)</p></blockquote>
