  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: <h2>Η κακολογία (η ύβρις)</h2><blockquote><p>«<strong>τὸ στόμα σου ἐπλεόνασεν κακίαν</strong>, καὶ ἡ γλῶσσά σου περιέπλεκεν δολιότητα·» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/49/#L19">Ψλ 49:19</a>)</p></blockquote><blockquote><p>«τάφος ἀνεῳγμένος ὁ λάρυγξ αὐτῶν, ταῖς γλώσσαις αὐτῶν ἐδολιοῦσαν, ἰὸς ἀσπίδων ὑπὸ τὰ χείλη αὐτῶν, <strong>ὧν τὸ στόμα ἀρᾶς καὶ πικρίας γέμει</strong>·» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/3/#L13-14">Ρωμ 3:13-14</a>)</p></blockquote><blockquote><p>«<strong>μηδένα βλασφημεῖν</strong>, ἀμάχους εἶναι, ἐπιεικεῖς, πᾶσαν ἐνδεικνυμένους πραΰτητα πρὸς πάντας ἀνθρώπους.» (<a href="https://bibleox.com/el/gr-lxx-byz/tit/3/#L2">Τιτ 3:2</a>)</p></blockquote><blockquote><p>«ὃς <strong>λοιδορούμενος οὐκ ἀντελοιδόρει</strong>, πάσχων οὐκ ἠπείλει, παρεδίδου δὲ τῷ κρίνοντι δικαίως·» (<a href="https://bibleox.com/el/gr-lxx-byz/1pet/2/#L23">Α Πε 2:23</a>)</p></blockquote><blockquote><p>«<strong>Ἀποθέμενοι οὖν πᾶσαν κακίαν</strong> καὶ πάντα δόλον καὶ ὑποκρίσεις καὶ φθόνους καὶ πάσας <strong>καταλαλιάς</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/1pet/2/#L1">Α Πε 2:1</a>)</p></blockquote><blockquote><p>«νυνὶ δὲ ἀπόθεσθε καὶ ὑμεῖς τὰ πάντα, ὀργήν, θυμόν, κακίαν, <strong>βλασφημίαν</strong>, αἰσχρολογίαν ἐκ τοῦ στόματος ὑμῶν·» (<a href="https://bibleox.com/el/gr-lxx-byz/kol/3/#L8">Κολ 3:8</a>)</p></blockquote><h3>Κατά του Θεού</h3><blockquote><p>«καὶ ἐπονομάσας ὁ υἱὸς τῆς γυναικὸς τῆς Ισραηλίτιδος τὸ ὄνομα κατηράσατο, καὶ ἤγαγον αὐτὸν πρὸς Μωυσῆν· καὶ τὸ ὄνομα τῆς μητρὸς αὐτοῦ Σαλωμιθ θυγάτηρ Δαβρι ἐκ τῆς φυλῆς Δαν. &lt;…&gt; καὶ τοῖς υἱοῖς Ισραηλ λάλησον καὶ ἐρεῖς πρὸς αὐτούς <strong>Ἄνθρωπος, ὃς ἐὰν καταράσηται θεόν, ἁμαρτίαν λήμψεται</strong>· ὀνομάζων δὲ τὸ ὄνομα κυρίου θανάτῳ θανατούσθω· λίθοις λιθοβολείτω αὐτὸν πᾶσα συναγωγὴ Ισραηλ· ἐάν τε προσήλυτος ἐάν τε αὐτόχθων, ἐν τῷ ὀνομάσαι αὐτὸν τὸ ὄνομα κυρίου τελευτάτω.» (<a href="https://bibleox.com/el/gr-lxx-byz/lev/24/#L11,15-16">Λευ 24:11,15-16</a>)</p></blockquote><h3>Κατά των γονέων</h3><blockquote><p>«<strong>ὁ κακολογῶν πατέρα αὐτοῦ ἢ μητέρα αὐτοῦ</strong> τελευτήσει θανάτῳ. —» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/21/#L16">Έξ 21:16</a>)</p></blockquote><blockquote><p>«<strong>Ἐπικατάρατος ὁ ἀτιμάζων πατέρα αὐτοῦ ἢ μητέρα αὐτοῦ</strong>· καὶ ἐροῦσιν πᾶς ὁ λαός Γένοιτο.» (<a href="https://bibleox.com/el/gr-lxx-byz/vtor/27/#L16">Δτ 27:16</a>)</p></blockquote><blockquote><p>«<strong>ὀφθαλμὸν καταγελῶντα πατρὸς καὶ ἀτιμάζοντα γῆρας μητρός</strong>, ἐκκόψαισαν αὐτὸν κόρακες ἐκ τῶν φαράγγων, καὶ καταφάγοισαν αὐτὸν νεοσσοὶ ἀετῶν.» (<a href="https://bibleox.com/el/gr-lxx-byz/pr/30/#L17">Πρμ 30:17</a>)</p></blockquote><h3>Κατά του πλησίον</h3><blockquote><p>«<strong>Μὴ καταλαλεῖτε ἀλλήλων</strong>, ἀδελφοί· ὁ καταλαλῶν ἀδελφοῦ ἢ κρίνων τὸν ἀδελφὸν αὐτοῦ καταλαλεῖ νόμου καὶ κρίνει νόμον· εἰ δὲ νόμον κρίνεις, οὐκ εἶ ποιητὴς νόμου ἀλλὰ κριτής.» (<a href="https://bibleox.com/el/gr-lxx-byz/iak/4/#L11">Ιακ 4:11</a>)</p></blockquote><h3>Κατά της εξουσίας και των αρχόντων</h3><blockquote><p>«<strong>θεοὺς οὐ κακολογήσεις</strong> καὶ <strong>ἄρχοντας τοῦ λαοῦ σου οὐ κακῶς ἐρεῖς</strong>. —» (<a href="https://bibleox.com/el/gr-lxx-byz/ish/22/#L27">Έξ 22:27</a>)</p></blockquote><blockquote><p>«Ὁμοίως μέντοι καὶ οὗτοι ἐνυπνιαζόμενοι σάρκα μὲν μιαίνουσιν, κυριότητα δὲ ἀθετοῦσιν, <strong>δόξας δὲ βλασφημοῦσιν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/iud/1/#L8">Ιούδα 1:8</a>)</p></blockquote><blockquote><p>«μάλιστα δὲ τοὺς ὀπίσω σαρκὸς ἐν ἐπιθυμίᾳ μιασμοῦ πορευομένους καὶ κυριότητος καταφρονοῦντας. Τολμηταί, αὐθάδεις, <strong>δόξας οὐ τρέμουσιν βλασφημοῦντες</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/2pet/2/#L10">Β Πε 2:10</a>)</p></blockquote>
