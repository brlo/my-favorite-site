  update: true
  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: '<h2>Η αισχρολογία (η βωμολοχία) — αμάρτημα</h2><blockquote><p>«πᾶς <strong>λόγος σαπρὸς</strong> ἐκ τοῦ στόματος ὑμῶν μὴ ἐκπορευέσθω, ἀλλὰ εἴ τις ἀγαθὸς πρὸς οἰκοδομὴν τῆς χρείας, ἵνα δῷ χάριν τοῖς ἀκούουσιν.» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/4/#L29">Εφ 4:29</a>)</p></blockquote><blockquote><p>«πορνεία δὲ καὶ ἀκαθαρσία πᾶσα ἢ πλεονεξία μηδὲ ὀνομαζέσθω ἐν ὑμῖν, καθὼς πρέπει ἁγίοις, καὶ <strong>αἰσχρότης</strong> καὶ μωρολογία ἢ εὐτραπελία, ἃ οὐκ ἀνῆκεν, ἀλλὰ μᾶλλον εὐχαριστία.» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/5/#L3-4">Εφ 5:3-4</a>)</p></blockquote><blockquote><p>«νυνὶ δὲ ἀπόθεσθε καὶ ὑμεῖς τὰ πάντα, ὀργήν, θυμόν, κακίαν, βλασφημίαν, <strong>αἰσχρολογίαν</strong> ἐκ τοῦ στόματος ὑμῶν·» (<a href="https://bibleox.com/el/gr-lxx-byz/kol/3/#L8">Κολ 3:8</a>)</p></blockquote><blockquote><p>«μὴ ἀποδιδόντες κακὸν ἀντὶ κακοῦ ἢ λοιδορίαν ἀντὶ λοιδορίας, τοὐναντίον δὲ εὐλογοῦντες, ὅτι εἰς τοῦτο ἐκλήθητε ἵνα εὐλογίαν κληρονομήσητε. <strong>ὁ γὰρ θέλων ζωὴν ἀγαπᾶν καὶ ἰδεῖν ἡμέρας ἀγαθὰς παυσάτω τὴν γλῶσσαν ἀπὸ κακοῦ καὶ χείλη τοῦ μὴ λαλῆσαι δόλον</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/1pet/3/#L9-10">Α Πε 3:9-10</a>)</p></blockquote><blockquote><p>«καὶ ὁ μισῶν λαλιὰν ἐλαττονοῦται κακίᾳ.» (<a href="https://bibleox.com/el/gr-lxx-byz/prsir/19/#L6">Σ.Σειρ 19:6</a>)</p></blockquote><blockquote><p>«τὴν δὲ <strong>γλῶσσαν</strong> οὐδεὶς δαμάσαι δύναται ἀνθρώπων· <strong>ἀκατάστατον κακόν, μεστὴ ἰοῦ θανατηφόρου. ἐν αὐτῇ εὐλογοῦμεν τὸν κύριον καὶ πατέρα, καὶ ἐν αὐτῇ καταρώμεθα τοὺς ἀνθρώπους τοὺς καθ᾿ ὁμοίωσιν θεοῦ γεγονότας</strong>· <strong><mark>ἐκ τοῦ αὐτοῦ στόματος ἐξέρχεται εὐλογία καὶ κατάρα. οὐ χρή, ἀδελφοί μου, ταῦτα οὕτως γίνεσθαι</mark></strong>. μήτι ἡ πηγὴ ἐκ τῆς αὐτῆς ὀπῆς βρύει τὸ γλυκὺ καὶ τὸ πικρόν; &lt;…&gt; <strong><mark>Τίς σοφὸς καὶ ἐπιστήμων ἐν ὑμῖν; δειξάτω ἐκ τῆς καλῆς ἀναστροφῆς τὰ ἔργα αὐτοῦ ἐν πραΰτητι σοφίας</mark></strong>. εἰ δὲ ζῆλον πικρὸν ἔχετε καὶ ἐριθείαν ἐν τῇ καρδίᾳ ὑμῶν, μὴ κατακαυχᾶσθε καὶ ψεύδεσθε κατὰ τῆς ἀληθείας. οὐκ ἔστιν αὕτη ἡ σοφία ἄνωθεν κατερχομένη, ἀλλὰ ἐπίγειος, ψυχική, δαιμονιώδης· ὅπου γὰρ ζῆλος καὶ ἐριθεία, ἐκεῖ ἀκαταστασία καὶ πᾶν φαῦλον πρᾶγμα.» (<a href="https://bibleox.com/el/gr-lxx-byz/iak/3/#L8-11,13-16">Ιακ 3:8-11,13-16</a>)</p></blockquote><h2>Ποιο είναι το πρόβλημα με τη βρισιά;</h2><p>Το πρόβλημα με τη βρισιά (την επιθετική γλώσσα) είναι ότι ο άνθρωπος θέλει να φαίνεται και να είναι κακός, επιθετικός, επικίνδυνος, «σκληρός». Το κακό λεξιλόγιο είναι μόνο ένας από τους τρόπους για να πετύχει αυτόν τον σκοπό. Σε αυτό προσθέτει κακά συναισθήματα, βλέμματα, χειρονομίες, ρούχα, τατουάζ, συνήθειες και όλους τους άλλους τρόπους αυτοέκφρασης. Αλλά ας επιστρέψουμε στις λέξεις.</p><p>Οι λέξεις αποτελούνται από ήχους. Ο συνδυασμός ήχων από μόνος του δεν σημαίνει τίποτα: δεν είναι ούτε κακός ούτε καλός. Ας επινοήσουμε, λόγου χάριν, τη λέξη «αμουσάνταρ». Το «αμουσάνταρ» δεν σημαίνει ακόμη τίποτα και γι’ αυτό δεν θεωρείται ούτε κακό ούτε καλό. Όταν όμως στην κοινωνία αποδίδεται σε μια λέξη ένα νόημα, ο άνθρωπος επιλέγει λέξεις με νοήματα ανάλογα με τις καταστάσεις και με το πώς θέλει να φαίνεται σε αυτή την κατάσταση. Όταν θέλει να είναι ευγενικός και αβρός, χρησιμοποιεί ευγενικό λεξιλόγιο, δηλαδή λέξεις στις οποίες έχουν αποδοθεί ευχάριστα νοήματα που δείχνουν την ειρηνική μας διάθεση, την ταπεινοφροσύνη, την εξυπηρετικότητα ή κάτι παρόμοιο. Όταν όμως θέλει να φαίνεται σκληρός, επικίνδυνος, κακός ή επιθετικός, καταφεύγει σε επιθετικό λεξιλόγιο, δηλαδή σε λέξεις στις οποίες έχουν αποδοθεί επιθετικά, χυδαία και άλλα αρνητικά νοήματα, που θα δείξουν αμέσως ότι ένας τέτοιος άνθρωπος δεν έχει κάποια ανατροφή ή διάθεση που θα τον συγκρατούσε από κακές πράξεις — θέλει να φαίνεται στους γύρω του επικίνδυνος, κακός, επιθετικός, ανισόρροπος, ανήσυχος άνθρωπος, πράγμα που δεν έχει τίποτα το καλό.</p><p>Επιπλέον, όταν ο άνθρωπος εξοικειώνεται με μια τέτοια κακή κατάσταση, γίνεται από αυτήν εξαρτημένος, όπως από το κάπνισμα ή την κατανάλωση οινοπνευματωδών ποτών, όπως και από κάθε αμαρτωλό πάθος. Ως αποτέλεσμα, μπορεί να αναλαμβάνει διάφορες ενέργειες για να έρχεται σε αυτή την κακή κατάσταση, να την καλλιεργεί εσωτερικά: να βρίζει ακόμη και όταν είναι μόνος του, να ακούει κακή μουσική, να γεμίζει τον εαυτό του και τον γύρω χώρο με σκοτεινό συμβολισμό. Δηλαδή όλα αυτά είναι κίνηση προς κακές καταστάσεις, καλλιέργεια μέσα του της κατάστασης της κακίας, του πάθους του θυμού, ενώ ο Κύριος Ιησούς Χριστός μας διδάσκει:</p><blockquote><p>«ἐγὼ δὲ λέγω ὑμῖν ὅτι <strong>πᾶς ὁ ὀργιζόμενος τῷ ἀδελφῷ αὐτοῦ ἔνοχος ἔσται τῇ κρίσει</strong>· <strong>ὃς δ᾿ ἂν εἴπῃ τῷ ἀδελφῷ αὐτοῦ, Ῥακά, ἔνοχος ἔσται τῷ συνεδρίῳ· ὃς δ᾿ ἂν εἴπῃ, Μωρέ, ἔνοχος ἔσται εἰς τὴν γέενναν τοῦ πυρός</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/5/#L22">Μτ 5:22</a>)</p></blockquote><blockquote><p>«μακάριοι <strong>οἱ πραεῖς, ὅτι αὐτοὶ κληρονομήσουσιν τὴν γῆν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/5/#L5">Μτ 5:5</a>)</p></blockquote><p>Και ο απόστολος λέει:</p><blockquote><p>«<strong>πᾶσα πικρία καὶ θυμὸς καὶ ὀργὴ καὶ κραυγὴ καὶ βλασφημία ἀρθήτω ἀφ᾿ ὑμῶν σὺν πάσῃ κακίᾳ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/4/#L31">Εφ 4:31</a>)</p></blockquote><p>Και ο προφήτης:</p><blockquote><p>«<strong>παῦσαι ἀπὸ ὀργῆς καὶ ἐγκατάλιπε θυμόν</strong>, μὴ παραζήλου ὥστε πονηρεύεσθαι·» (<a href="https://bibleox.com/el/gr-lxx-byz/ps/36/#L8">Ψλ 36:8</a>)</p></blockquote><p>Εδώ αξίζει να πούμε και για τα ανόητα αστεία:</p><blockquote><p>«καὶ αἰσχρότης καὶ μωρολογία ἢ <strong>εὐτραπελία, ἃ οὐκ ἀνῆκεν</strong>, ἀλλὰ μᾶλλον εὐχαριστία.» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/5/#L4">Εφ 5:4</a>)</p></blockquote><blockquote><p>«<strong>οὐαί, οἱ γελῶντες νῦν, ὅτι πενθήσετε καὶ κλαύσετε</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/6/#L25">Λκ 6:25</a>)</p></blockquote>'
