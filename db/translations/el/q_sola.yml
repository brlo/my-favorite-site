  references: "<p>Μετάφραση: Ροδίων Βλάσοφ (με τη χρήση εργαλείων τεχνητής νοημοσύνης). Τα χωρία των Αγίων Πατέρων μεταφράζονται από τα ρωσικά και, όπου είναι δυνατόν, ελέγχονται με το ελληνικό πρωτότυπο της βιβλιοθήκης του ιστότοπου· οι βιβλικές περικοπές παρατίθενται κατά το κείμενο της Ελληνικής Βίβλου του ιστότοπου (μετάφραση των Ο΄ και βυζαντινό κείμενο της Καινής Διαθήκης).</p>"
  body: '<h2>Πρόλογος</h2><p>Η Sola Scriptura είναι ένα τέχνασμα που χρησιμοποιείται για τη δημιουργία ιδίων εκκλησιών. Όπως τα κόλπα των απατεώνων που παίζουν το παιχνίδι με τα ποτήρια, με απλά αλλά επιδέξια τεχνάσματα μπερδεύουν τους ακροατές, οι οποίοι δεν αντιλαμβάνονται την υποκατάσταση που γίνεται μπροστά στα μάτια τους. Δεν τους διδάσκεται καθόλου η διδασκαλία «μόνο κατά τη Γραφή», αλλά απλώς τους προτείνεται μια ακόμη ερμηνεία της Γραφής, που απορρίπτει ό,τι δεν αντιστοιχεί στην προσωπική πίστη του νέου διδασκάλου (στη γνώμη του). Η προσωπική πίστη του διδασκάλου μεταδίδεται στους ακροατές και γίνεται μια ακόμη ανθρώπινη παράδοση. Αλλά αυτή η παράδοση δεν ονομάζεται παράδοση, και εδώ βρίσκεται το τέχνασμα: στους ακροατές δημιουργείται η ψευδαίσθηση ότι πιστεύουν μόνο κατά τη Γραφή. Με παρόμοιο τρόπο δημιουργήθηκαν και οι προηγούμενες αιρετικές κοινότητες: απορρίπτοντας την πίστη της Εκκλησίας, που παραλήφθηκε απευθείας από τους αποστόλους μαζί με τη Γραφή, ανυψώνουν πάνω από όλα τις ίδιες γνώμες των διδασκάλων, οι οποίες είναι όλες διαφορετικές. Όσες σέκτες κι αν προκύψουν, οι διδάσκαλοί τους δικαιολογούν με τη Γραφή απολύτως οποιαδήποτε πίστη.</p><p><strong>Άγιος Ειρηναίος Λυώνος, ιερομάρτυς (~130-202)</strong></p><blockquote><p>…<strong>με διεστραμμένη ερμηνεία και παράλογη εξήγηση προσπαθούν</strong> <strong>να συγκροτήσουν υπέρ εαυτών αποδείξεις όχι μόνο από τα ευαγγελικά και αποστολικά λόγια, αλλά και από τον νόμο και τους προφήτες</strong> &lt;…&gt; <strong>με μεγάλη βία και πανουργία τα προσαρμόζουν στο δικό τους επινόημα, και έτσι αιχμαλωτίζουν και αποπλανούν από την αλήθεια εκείνους που δεν πιστεύουν σταθερά</strong> &lt;…&gt; Βλέπεις, αγαπητέ, <strong>τον τρόπο με τον οποίο εξαπατούν τον νου τους, βιάζοντας τις γραφές και επιχειρώντας με αυτές να επιβεβαιώσουν το επινόημά τους</strong>. &lt;…&gt; Ας δούμε τώρα και την αστάθεια των γνωμών αυτών (των αιρεσιαρχών), πώς <strong>αυτοί, δύο ή τρεις, για το ίδιο πράγμα δεν λένε το ίδιο, αλλά αντιφάσκουν μεταξύ τους</strong> και στην ουσία του πράγματος και στα ονόματα. &lt;…&gt; <strong>ο καθένας τους διδάσκει όπως θέλει.</strong></p></blockquote><p>(Κατά Αιρέσεων, I)</p><blockquote><p>Τέτοια είναι <strong>μεταξύ τους η διαφωνία για ένα (χωρίο) και η διχογνωμία για τις ίδιες τις Γραφές</strong>·</p></blockquote><p>(Κατά Αιρέσεων, IV, 35.4)</p><p><strong>Ο μακάριος Ιερώνυμος ο Στριδώνιος, όσιος (~347-420)</strong></p><blockquote><p><em>Αλλά επειδή έχουμε ήδη μιλήσει πολύ, και η διάρκεια της συζήτησης κούρασε την προσοχή των ακροατών, θα σου πω την εσωτερική μου σκέψη σύντομα και ειλικρινά: </em><strong><em>πρέπει να κρατούμε σταθερά εκείνη την Εκκλησία που, θεμελιωμένη από τους αποστόλους, συνεχίζει την ύπαρξή της μέχρι τη σημερινή ημέρα. Αν ακούσεις κάπου για ανθρώπους που, θεωρώντας εαυτούς ανήκοντες στον Χριστό, πήραν το όνομα όχι από τον Κύριο Ιησού Χριστό αλλά από κάποιον άλλον, όπως λόγου χάρη οι Μαρκιωνίτες, οι Βαλεντινιανοί, οι Μοντανοί ή οι Καμπίτες, να ξέρεις ότι αυτό δεν είναι η Εκκλησία του Χριστού αλλά η συναγωγή του αντιχρίστου. Διότι αυτό ακριβώς ότι εμφανίστηκαν αργότερα δείχνει σε εκείνους για τους οποίους προφήτευσε ο απόστολος για το μέλλον</em></strong><em>. </em><strong><em>Και ας μη κολακεύονται ότι βρίσκουν, όπως φαίνεται, επιβεβαίωση των λόγων τους στις Γραφές· γιατί και ο διάβολος είπε κάτι από τις Γραφές· και η ουσία των Γραφών δεν είναι στην ανάγνωση αλλά στην κατανόηση. Αλλιώς, αν ακολουθούσαμε <u>μόνο το γράμμα</u>, θα μπορούσαμε και εμείς οι ίδιοι να συνθέσουμε ένα νέο δόγμα</em></strong><em>, να υποστηρίξουμε λόγου χάρη ότι δεν πρέπει να δεχόμαστε στην Εκκλησία εκείνους που φορούν υποδήματα και έχουν δύο χιτώνες.</em></p></blockquote><p>(Διάλογος κατά των Λουκιφεριανών)</p><p><strong>Ο όσιος Βικέντιος ο Λερινός († πριν από το 450)</strong></p><blockquote><p>Επιτεθήκαμε επίσης κατά της εγκληματικής υπερηφάνειας του Νεστορίου, με την οποία <strong>καυχιόταν ότι μόνο αυτός κατανοεί την Αγία Γραφή, σαν να μη τη γνώριζαν όλοι εκείνοι που πριν από αυτόν ερμήνευσαν τα θεία λόγια, έχοντας το χάρισμα της διδασκαλίας, δηλαδή όλοι οι ιερείς, όλοι οι ομολογητές και οι μάρτυρες, από τους οποίους άλλοι εξηγούσαν τον νόμο του Θεού</strong>, και άλλοι συμφωνούσαν με εκείνους που εξηγούσαν ή τους πίστευαν, και τέλος <strong>ισχυριζόταν ότι και τώρα πλανάται και πάντοτε πλανιόταν ολόκληρη η Εκκλησία</strong>, η οποία, όπως του φαινόταν, ακολουθούσε και θα ακολουθεί αμαθείς και πεπλανημένους διδασκάλους.</p></blockquote><p>(Υπομνήματα του Περεγρίνου)</p><p>Βλ. και άλλες παρόμοιες δηλώσεις.</p><h2>Sola Scriptura</h2><p><strong>«Sola Scriptura»</strong> (λατ. — Sola Scriptura, δηλ. «μόνο η Γραφή») — μέθοδος οικοδόμησης της διδασκαλίας που προτάθηκε τον 16ο αιώνα από τους μεταρρυθμιστές (έθεσαν την αρχή του προτεσταντικού κινήματος), σύμφωνα με την οποία ύψιστη αυθεντία για την οικοδόμηση της διδασκαλίας είναι μόνο η Αγία Γραφή (στην υποκειμενική αντίληψη του αναγνώστη).</p><p>Παρά τη θεωρία, μεταξύ προτεσταντών και νεοπροτεσταντών είναι ευρέως διαδεδομένη η αντίληψη της «Sola Scriptura» ως πλήρους απόρριψης της Παράδοσης. Λίγοι προτεστάντες είναι έτοιμοι να συζητήσουν στον τομέα της πατερικής κληρονομιάς, αλλά, τις περισσότερες φορές, κατά τη διάρκεια της πολεμικής των ορθοδόξων με τους προτεστάντες, ακόμη και η αναφορά ονομάτων αγίων Πατέρων, πολύ περισσότερο των έργων τους, συναντά έντονη απόρριψη και χλευασμό. Στην ίδια τη λέξη «παράδοση» στις προτεσταντικές κοινότητες αποδίδεται αρνητική σημασία μέσω της ταύτισής της με την «παράδοση των πρεσβυτέρων» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/15/#L2">Μτ 15:2</a>), με πλήρη αγνόηση της ύπαρξης της αποστολικής Παράδοσης, την οποία οι ίδιοι οι απόστολοι διέταξαν να τηρούμε (<a href="https://bibleox.com/el/gr-lxx-byz/2sol/2/#L15">Β Θεσ 2:15</a>) — της πίστης που φυτεύτηκε με διάφορους τρόπους στην Εκκλησία από τον Κύριο και τους αποστόλους και διατηρείται αδιάκοπα σε αυτήν και μεταδίδεται από τους προγόνους στους απογόνους.</p><h2>Οι προσπάθειες να θεμελιωθεί η Sola Scriptura</h2><p>Οι υπερασπιστές της Sola Scriptura παραθέτουν περικοπές από τη Γραφή, παρουσιάζοντάς τες με τέτοιο τρόπο σαν να λέγεται σε αυτές ότι πρέπει να θεωρούμε τη Γραφή ύψιστη ή μοναδική αυθεντία της πίστης. Ωστόσο, στην πραγματικότητα, σε καμία από τις παρατιθέμενες περικοπές δεν γίνεται λόγος για τη Sola Scriptura, δηλαδή για το ότι δήθεν <strong>μόνο</strong> η Γραφή (και τίποτα άλλο εκτός από αυτήν) έχει κάποιον αποκλειστικό, ύψιστο ή μοναδικό ρόλο στη διδασκαλία.</p><p>Προς υπεράσπιση της Sola Scriptura προτείνονται περικοπές των εξής τύπων.</p><h3>1. Ο λόγος του Θεού είναι αλήθεια</h3><p>Ό,τι ανακοινώνει ο Θεός με οποιονδήποτε τρόπο (προφορικά, γραπτά, με όραμα, μέσω απεσταλμένου: αγγέλου, προφήτη ή αποστόλου) — αυτό είναι αλήθεια:</p><blockquote><p>«ἁγίασον αὐτοὺς ἐν τῇ ἀληθείᾳ· <strong>ὁ λόγος ὁ σὸς ἀλήθειά ἐστιν</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/17/#L17">Ιω 17:17</a>)</p></blockquote><p>Με αυτό δεν διαφωνούμε. Κάθε λόγος του Θεού είναι αλήθεια, και όχι μόνο ο γραπτός. Η προφορική παράδοση ονομάζεται επίσης λόγος του Θεού:</p><blockquote><p>«Καὶ διὰ τοῦτο καὶ ἡμεῖς εὐχαριστοῦμεν τῷ θεῷ ἀδιαλείπτως, ὅτι <strong>παραλαβόντες λόγον <u>ἀκοῆς</u> παρ᾿ ἡμῶν τοῦ θεοῦ</strong> ἐδέξασθε οὐ λόγον ἀνθρώπων ἀλλὰ καθώς ἐστιν ἀληθῶς <strong>λόγον θεοῦ</strong>, ὃς καὶ ἐνεργεῖται ἐν ὑμῖν τοῖς πιστεύουσιν.» (<a href="https://bibleox.com/el/gr-lxx-byz/1sol/2/#L13">Α Θεσ 2:13</a> · <a href="https://bibleox.com/el/gr-lxx-byz/1pet/1/#L23-25">Α Πε 1:23-25</a>)</p></blockquote><p>Ότι όλη η Γραφή είναι θεόπνευστη επίσης δεν το αμφισβητούμε:</p><blockquote><p>«<strong>πᾶσα γραφὴ θεόπνευστος</strong> καὶ ὠφέλιμος πρὸς διδασκαλίαν, πρὸς ἐλεγμόν, πρὸς ἐπανόρθωσιν, πρὸς παιδείαν τὴν ἐν δικαιοσύνῃ,» (<a href="https://bibleox.com/el/gr-lxx-byz/2tim/3/#L16">Β Τιμ 3:16</a>)</p></blockquote><h3>2. Η Γραφή είναι σημαντική για τους πιστούς</h3><p>Η Αγία Γραφή έχει μεγάλη σημασία για τους πιστούς:</p><blockquote><p>«<strong>πᾶσα γραφὴ</strong> θεόπνευστος καὶ <strong>ὠφέλιμος</strong> πρὸς διδασκαλίαν, πρὸς ἐλεγμόν, πρὸς ἐπανόρθωσιν, πρὸς παιδείαν τὴν ἐν δικαιοσύνῃ,» (<a href="https://bibleox.com/el/gr-lxx-byz/2tim/3/#L16">Β Τιμ 3:16</a>)</p></blockquote><blockquote><p>«<strong>ἐραυνᾶτε τὰς γραφάς</strong>, ὅτι ὑμεῖς δοκεῖτε ἐν αὐταῖς ζωὴν αἰώνιον ἔχειν· καὶ ἐκεῖναί εἰσιν αἱ μαρτυροῦσαι περὶ ἐμοῦ·» (<a href="https://bibleox.com/el/gr-lxx-byz/in/5/#L39">Ιω 5:39</a>)</p></blockquote><p>Με αυτό επίσης δεν διαφωνούμε.</p><hr><p>Όλα αυτά είναι αληθινά. Η Ορθόδοξη Εκκλησία δεν διαφωνεί με κανένα από τα παραπάνω, αλλά η ίδια τα επιβεβαιώνει όλα.</p><p>Ωστόσο:</p><ul><li><p>αυτές οι περικοπές δεν δείχνουν ότι η αλήθεια είναι <strong>μόνο</strong> στη Γραφή, ενώ η Παράδοση δεν είναι αλήθεια· οι ίδιες περικοπές για την Παράδοση απλώς αγνοούνται (βλ. παρακάτω), αφού οι υποστηρικτές της Sola Scriptura δεν έχουν σκοπό να υπερασπιστούν την αναγκαιότητα της Παράδοσης.</p></li><li><p>αυτές οι περικοπές δεν δείχνουν ότι <strong>όλη</strong> η Θεία Αποκάλυψη είναι γραμμένη στη Γραφή, και επομένως δήθεν η Παράδοση μπορεί να απορριφθεί. Η απόρριψη της Παράδοσης είναι πράξη εναντίον της Γραφής (<a href="https://bibleox.com/el/gr-lxx-byz/2sol/2/#L15">Β Θεσ 2:15</a>).</p></li></ul><p>Όλες οι παρατιθέμενες περικοπές δεν λένε απολύτως τίποτα για τη λέξη «μόνο» της αντίληψης «μόνο η Γραφή». Όλες υποδεικνύουν μόνο την αναγκαιότητα της Θείας Αποκάλυψης και την αλήθειά της, σε όποια μορφή κι αν γίνεται αντιληπτή: γραπτή, προφορική ή οπτική. Σε αυτό πιστεύουμε, και εδώ δεν υπάρχει τίποτα από τη «Sola Scriptura».</p><h2>Το τέχνασμα των κηρύκων της Sola Scriptura</h2><p>Έχοντας δείξει στον ακροατή ότι η Γραφή έχει ύψιστη αυθεντία και ότι το να ακούει κανείς τη Γραφή είναι σαν να ακούει τον Θεό, στη συνέχεια, εντελώς ανεπαίσθητα για τον ακροατή, γίνεται η υποκατάσταση: αντί για τον Θεό και τη Γραφή αρχίζει να μιλά και να ερμηνεύει τη Γραφή με τον δικό του τρόπο ο κήρυκας. Και τώρα πλέον προτείνεται να δεχόμαστε ως λόγια του Θεού τα λόγια του κήρυκα, του δημιουργού μιας από τις χιλιάδες κοινότητες που αντιφάσκουν μεταξύ τους στην ερμηνεία της Γραφής.</p><p>Φυσικά, ο κήρυκας συνεχίζει στις ομιλίες του να παραπέμπει στη Γραφή, στηρίζοντας τα λόγια του με ένα σύνολο περικοπών, αλλά το προφανές πρόβλημα εδώ είναι ότι ο προτεσταντισμός γέννησε με αυτόν τον τρόπο χιλιάδες οποιεσδήποτε διδασκαλίες για τον Θεό, τις ενέργειές Του και τους τρόπους σωτηρίας. Επιπλέον, από την αρχή της ύπαρξης του χριστιανισμού, οι κοινότητες έξω από την Εκκλησία προσπαθούσαν να διαστρέψουν την πίστη και να παρασύρουν τους ανθρώπους ακριβώς μέσω της διαστρέβλωσης της Γραφής. Αυτό έκανε ακόμη και ο διάβολος, πειράζοντας τον Χριστό ακριβώς με τη Γραφή:</p><blockquote><p>«Τότε παραλαμβάνει αὐτὸν ὁ διάβολος εἰς τὴν ἁγίαν πόλιν, καὶ ἵστησιν αὐτὸν ἐπὶ τὸ πτερύγιον τοῦ ἱεροῦ, καὶ λέγει αὐτῷ, Εἰ υἱὸς εἶ τοῦ θεοῦ, <strong>βάλε σεαυτὸν κάτω· γέγραπται γὰρ ὅτι Τοῖς ἀγγέλοις αὐτοῦ ἐντελεῖται περὶ σοῦ καὶ ἐπὶ χειρῶν ἀροῦσίν σε, μήποτε προσκόψῃς πρὸς λίθον τὸν πόδα σου</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/4/#L5-6">Μτ 4:5-6</a>)</p></blockquote><p>Επίσης ο διάβολος, παίρνοντας αφορμή από τα λόγια του Θεού, οδήγησε στην πτώση τους πρώτους ανθρώπους:</p><blockquote><p>«Ὁ δὲ ὄφις ἦν φρονιμώτατος πάντων τῶν θηρίων τῶν ἐπὶ τῆς γῆς, ὧν ἐποίησεν κύριος ὁ θεός· καὶ <strong>εἶπεν ὁ ὄφις τῇ γυναικί Τί ὅτι εἶπεν ὁ θεός Οὐ μὴ φάγητε ἀπὸ παντὸς ξύλου τοῦ ἐν τῷ παραδείσῳ</strong>; καὶ εἶπεν ἡ γυνὴ τῷ ὄφει Ἀπὸ καρποῦ ξύλου τοῦ παραδείσου φαγόμεθα, ἀπὸ δὲ καρποῦ τοῦ ξύλου, ὅ ἐστιν ἐν μέσῳ τοῦ παραδείσου, εἶπεν ὁ θεός Οὐ φάγεσθε ἀπ᾿ αὐτοῦ οὐδὲ μὴ ἅψησθε αὐτοῦ, ἵνα μὴ ἀποθάνητε. καὶ <strong>εἶπεν ὁ ὄφις τῇ γυναικί Οὐ θανάτῳ ἀποθανεῖσθε</strong>· ᾔδει γὰρ ὁ θεὸς ὅτι ἐν ᾗ ἂν ἡμέρᾳ φάγητε ἀπ᾿ αὐτοῦ, διανοιχθήσονται ὑμῶν οἱ ὀφθαλμοί, καὶ ἔσεσθε ὡς θεοὶ γινώσκοντες καλὸν καὶ πονηρόν.» (<a href="https://bibleox.com/el/gr-lxx-byz/gen/3/#L1-5">Γεν 3:1-5</a>)</p></blockquote><p>Έτσι, ο διάβολος και οι δημιουργοί των κοινοτήτων που εχθρεύονται την Εκκλησία χρησιμοποίησαν ακριβώς τη Γραφή για να παρασύρουν τους ανθρώπους. Πώς γίνεται αυτό; Γίνεται επειδή η ιδιωτική ερμηνεία της Γραφής περιβάλλεται με την αυθεντία της Γραφής.</p><h2>Το θεμελιώδες πρόβλημα της Sola Scriptura — ο υποκειμενισμός</h2><p>Το θεμελιώδες πρόβλημα αυτής της προσέγγισης στην οικοδόμηση της πίστης είναι ότι <strong>δεν υπάρχει αντικειμενική κατανόηση της Αγίας Γραφής</strong>. Κάθε άνθρωπος την αντιλαμβάνεται μέσα από το πρίσμα της συσσωρευμένης εμπειρίας του, της κοσμοθεωρίας του, των συμφερόντων και των προτιμήσεών του, δηλαδή την αντιλαμβάνεται <strong>υποκειμενικά</strong>. Με απλά λόγια, το πρόβλημα είναι το εξής: <strong>ποιος θα αποφασίσει τι αντιστοιχεί στη Γραφή και τι όχι; </strong>Η Sola Scriptura δεν απαντά σε αυτό το ερώτημα. Ακριβώς αυτό την καθιστά απλώς μια θεωρία που είναι αδύνατο να εφαρμοστεί στην πράξη. Και αυτό δεν είναι αβάσιμες δηλώσεις.</p><p>Οι πρώτοι κιόλας χρήστες της Sola Scriptura (οι μεταρρυθμιστές) πρότειναν διαφορετικές διδασκαλίες, βασισμένες στη δική τους, διαφορετική κατανόηση της Αγίας Γραφής. Οι διαφωνίες αφορούσαν τα πιο σημαντικά ζητήματα:</p><ul><li><p>η σωτηρία·</p></li><li><p>ο προορισμός των ανθρώπων στη σωτηρία,</p></li><li><p>η αμαρτωλότητα του ανθρώπου,</p></li><li><p>ο ρόλος των Μυστηρίων στη ζωή των πιστών,</p></li><li><p>η πραγματικότητα της παρουσίας του Χριστού στην Ευχαριστία,</p></li><li><p>η δυνατότητα βαπτίσματος των νηπίων,</p></li><li><p>η ύπαρξη εικόνων στη ζωή των πιστών.</p></li></ul><p>Διαφορετικές διδασκαλίες γέννησαν αμέσως διαφορετικές κοινότητες. Και αυτό είναι μόνο η αρχή. Με την πάροδο του χρόνου, ο αριθμός των διαφωνιών και των διαιρέσεων στον χώρο των οπαδών της Sola Scriptura αυξανόταν ραγδαία και, ξεκινώντας από λίγες διδασκαλίες και κοινοτήτων, μέσα σε 500 χρόνια έφτασε τις δεκάδες χιλιάδες διαιρέσεις και διαφωνίες για οποιαδήποτε ζητήματα πίστης, μέχρι και τα πιο σημαντικά — για τον Θεό και το πρόσωπο του Χριστού.</p><p>Έτσι, η Sola Scriptura, ως αντίληψη, στην πράξη δεν επέτρεψε να απομακρύνονται οι ανθρώπινες επικαλύψεις και να φτάνει κανείς στην πίστη των συγγραφέων των βιβλίων της Βίβλου. Η Sola Scriptura, παρά τις ηχηρές διακηρύξεις των υποστηρικτών της, απλώς ανοίγει τον δρόμο για την εμφάνιση πλήθους νέων ανθρώπινων επικαλύψεων — νέων παραδόσεων, για τις οποίες θα γίνει λόγος στη συνέχεια.</p><h2>Η Sola Scriptura οδήγησε στην εμφάνιση πλήθους παραδόσεων</h2><p>Σύμφωνα με τον διακηρυγμένο σκοπό των μεταρρυθμιστών, η Sola Scriptura θα έπρεπε να απομακρύνει τις ανθρώπινες παραδόσεις. Στην πραγματικότητα όμως, κάθε νέος δημιουργός μιας ακόμη προτεσταντικής κοινότητας γινόταν δημιουργός μιας ακόμη ανθρώπινης παράδοσης, απλώς περιβάλλοντας με περικοπές από τη Γραφή τη δική του πίστη, κάτι που έκαναν διάφοροι αιρεσιάρχες πολύ πριν από τους μεταρρυθμιστές, από τότε που εμφανίστηκαν αυθεντικές δηλώσεις και κείμενα (<a href="https://bibleox.com/el/gr-lxx-byz/gen/3/#L1,4-5">Γεν 3:1,4-5</a>).</p><p>Γύρω από τον νέο ηγέτη σχηματιζόταν μια κοινότητα που αντιλαμβανόταν, φύλασσε και μετέδιδε στους απογόνους της τίποτα άλλο παρά την πίστη αυτού του ηγέτη. Και αν κάποιος θελήσει να ενταχθεί σε αυτή την κοινότητα, θα είναι υποχρεωμένος να αποδεχθεί την πίστη του ηγέτη της κοινότητας και να κατανοεί τη Γραφή όπως την κατανοεί ακριβώς αυτή η κοινότητα. Αν έρθει κάποιος στους βαπτιστές — θα δεχθεί την πίστη κατά την παράδοση των βαπτιστών, και στους πεντηκοστιανούς θα δεχθεί την πίστη κατά την παράδοση των πεντηκοστιανών, στους αντβεντιστές — κατά την παράδοση των αντβεντιστών, το ίδιο σε όλους τους υπόλοιπους. Οι κοινότητες καταδικάζουν τις παραδόσεις η μία της άλλης: στον βαπτιστή δεν θα επιτρέψουν να διδάξει την κοινότητα των αντβεντιστών, και στον πεντηκοστιανό — την κοινότητα των βαπτιστών.</p><p>Ως αποτέλεσμα, όλες αυτές οι κοινότητες της Sola Scriptura έφτασαν στο σημείο να μην πρέπει να πιστεύει κανείς «μόνο κατά τη Γραφή», αλλά αυστηρά κατά την παράδοσή τους: μόνο όπως είπε κάποτε ο ηγέτης τους, και η κοινότητα το διατήρησε ως παράδοση, μεταδίδοντας τη γνώση από τους προγόνους στους απογόνους μέσω του προφορικού κηρύγματος και των βιβλίων των διδασκάλων. Απλώς δεν συνηθίζεται να ονομάζεται αυτό παράδοση, πολύ περισσότερο «ανθρώπινη παράδοση», με το οποίο, ως μπαμπούλα, συνηθίζεται να ονομάζεται μόνο η Παράδοση της Εκκλησίας.</p><h2>Ο ηγέτης της κοινότητας ως πηγή πίστης</h2><p>Αν η Γραφή ήταν κάποια αυτάρκης πηγή πίστης, τότε καθένας που θα αναλάμβανε να θεμελιώσει την πίστη «μόνο στη Γραφή» θα είχε την ίδια πίστη με τους άλλους οπαδούς της Sola Scriptura. Ωστόσο σε όλους αυτούς η πίστη βγήκε διαφορετική, άρα και η πηγή της πίστης είναι διαφορετική. Αυτή η πηγή είναι ο <strong>άνθρωπος</strong> που ίδρυσε την κοινότητα. Αυτός την επινόησε, τη μετέδωσε στους οπαδούς του, και εκείνοι φυλάσσουν την πίστη του ηγέτη τους.</p><h2>Στην πράξη δεν είναι η Γραφή, αλλά η ίδια η παράδοση που έρχεται πρώτη στις προτεσταντικές κοινότητες</h2><p>Σε όλες αυτές τις κοινότητες στην πρώτη θέση μπαίνει ακριβώς η παράδοσή τους, και η Γραφή χρησιμοποιείται μόνο ως πρόσθετο εργαλείο, επιλέγοντας από αυτήν περικοπές συμφέρουσες για τη θεμελίωση της παράδοσης. Η πίστη που έγινε δεκτή σε μια από αυτές τις κοινότητες στην πράξη υπερισχύει της Γραφής, και τα βιβλικά κείμενα χρησιμοποιούνται μόνο για να δημιουργηθεί γύρω από τον ακροατή μια φούσκα, μια απατηλή ψευδαίσθηση ότι εδώ πιστεύουν μόνο κατά τη Γραφή, ενώ στη συνείδησή του μέσω του κηρύγματος εναποτίθεται ακριβώς η παράδοση αυτής της κοινότητας στην οποία βρέθηκε.</p><p>Η Γραφή μπορεί εύκολα να αγνοηθεί αν έρθει σε αντίφαση με την παράδοση. Για παράδειγμα, πουθενά δεν λέγεται στη Γραφή ότι τα νήπια δεν πρέπει να βαπτίζονται, αλλά αντίθετα — το πρότυπο του βαπτίσματος (η περιτομή) εφαρμοζόταν ακριβώς στα νήπια (<a href="https://bibleox.com/el/gr-lxx-byz/gen/17/#L10-12">Γεν 17:10-12</a>), ωστόσο πολλοί προτεστάντες επιμένουν στην απαγόρευση του βαπτίσματος των νηπίων, επικαλούμενοι έμμεσες αιτίες από τη Γραφή. Στη Γραφή δεν λέγεται ότι τα νήπια σώζονται χωρίς βάπτισμα, αλλά αντίθετα, ο Σωτήρας είπε ότι χωρίς τη γέννηση από ύδωρ και Πνεύμα κανείς δεν μπορεί ούτε να δει ούτε να εισέλθει στη Βασιλεία των Ουρανών (<a href="https://bibleox.com/el/gr-lxx-byz/in/3/#L3,5-6">Ιω 3:3,5-6</a>), και χωρίς το πρότυπο του βαπτίσματος ο άνθρωπος στην Παλαιά Διαθήκη έπρεπε επίσης να εξολοθρευτεί από τον λαό (<a href="https://bibleox.com/el/gr-lxx-byz/gen/17/#L14">Γεν 17:14</a>), αλλά πολλοί προτεστάντες διδάσκουν ότι τα νήπια σώζονται χωρίς βάπτισμα, προσπαθώντας και πάλι να επικαλεστούν έμμεσες περικοπές από τη Γραφή, ενώ στηρίζονται ακόμη περισσότερο στις δικές τους σκέψεις γι’ αυτό.</p><p>Διατηρώντας την πίστη σε ό,τι βρίσκεται μόνο στην παράδοσή τους, κατηγορούν την Εκκλησία για τη διδασκαλία περί μεταδόσεως της χάριτος της ιερωσύνης μέσω της χειροτονίας, απορρίπτοντας απλώς τα πιο άμεσα λόγια για τη μετάδοση του δώρου του Θεού <strong>μέσω</strong> της χειροτονίας (<a href="https://bibleox.com/el/gr-lxx-byz/2tim/1/#L6">Β Τιμ 1:6</a> · <a href="https://bibleox.com/el/gr-lxx-byz/act/8/#L18">Πραξ 8:18</a>). Γιατί έτσι; Απλώς επειδή η παράδοσή τους προτείνει άλλη πίστη, και εφόσον η παράδοση υπερισχύει της Γραφής, το άμεσο βιβλικό κείμενο απορρίπτεται, γιατί δεν επιτρέπεται να πιστεύει κανείς διαφορετικά από ό,τι κάποτε διδάχθηκε αυτή η κοινότητα. Αν και έτσι έχουν τα πράγματα, δεν επιτρέπεται να μιλά κανείς με τέτοια λόγια: δεν επιτρέπεται να χρησιμοποιεί τη λέξη παράδοση (η λέξη χρησιμοποιείται μόνο για επιθέσεις κατά της Εκκλησίας), δεν επιτρέπεται να λέει ανοιχτά ότι εδώ μεταδίδεται μόνο η πίστη του ιδρυτή αυτής της συγκεκριμένης κοινότητας.</p><h2>Ανέντιμες αντιπαραθέσεις</h2><p>Στις κοινότητες που δημιουργήθηκαν από οπαδούς της Sola Scriptura είναι ευρέως διαδεδομένη η αντιπαράθεση: η Εκκλησία απέρριψε τη Γραφή και πιστεύει μόνο κατά την Παράδοση, ενώ κάθε προτεσταντική κοινότητα αντίθετα — απέρριψε την Παράδοση και πιστεύει μόνο κατά τη Γραφή.</p><p>Στην πραγματικότητα όμως:</p><ul><li><p>ούτε η Εκκλησία πιστεύει μόνο κατά την Παράδοση, χρησιμοποιώντας παράλληλα με αυτήν και τη Γραφή·</p></li><li><p>ούτε οι προτεσταντικές κοινότητες πιστεύουν μόνο κατά τη Γραφή, αναγνωρίζοντας ως ορθή μόνο την πίστη του ηγέτη τους, την οποία φυλάσσουν ως παράδοση.</p></li></ul><p>Έτσι, καμία Sola Scriptura δεν υπάρχει στην πράξη. Υπάρχει μόνο στη θεωρία. Η εφαρμογή αυτής της αντίληψης από κάθε συγκεκριμένο άνθρωπο αναπόφευκτα συνεπάγεται την εμφάνιση μιας ακόμη νέας πίστης, μιας νέας κατανόησης της Γραφής, μιας νέας κοινότητας και, κατά συνέπεια, μιας νέας παράδοσης.</p><p>Το να το αποδείξει κανείς δεν είναι καθόλου δύσκολο. Αρκεί να κάνει ένα πείραμα. Αν ένας άνθρωπος έρθει σε μια από αυτές τις κοινότητες, και αυτή δεν του μεταδώσει τις γνώσεις της, αλλά απλώς του δώσει στα χέρια μια Βίβλο, τότε διαβάζοντας μόνο τη Βίβλο, αυτός ο άνθρωπος 100% δεν θα φτάσει στην πίστη αυτής της κοινότητας. Θα φτάσει στην πίστη τους μόνο σε μία περίπτωση — αν η κοινότητα του μεταδώσει την πίστη της.</p><p>Ολόκληρη τη διδασκαλία της η Ορθόδοξη Εκκλησία την επιβεβαιώνει με την Αγία Γραφή. Ωστόσο, με την <strong>εκκλησιαστική κατανόηση</strong> της Αγίας Γραφής οι προτεσταντικές κοινότητες δεν συμφωνούν, προτείνοντας αντ’ αυτού όχι «μόνο τη Γραφή» (σιωπηλά), αλλά τη <strong>δική τους κατανόηση και πίστη</strong>.</p><h2>Η Sola Scriptura έρχεται σε ευθεία σύγκρουση με τη Γραφή</h2><p>Οι αντιρρήσεις της Ορθόδοξης Εκκλησίας κατά της Sola Scriptura δεν αφορούν τη λέξη «Γραφή», αλλά τη λέξη «μόνο». Και οι αντιρρήσεις στηρίζονται στην ίδια τη Γραφή:</p><ol><li><p><strong>Η «Sola Scriptura» απουσιάζει από τη Γραφή</strong>. Στην ίδια τη Γραφή δεν υπάρχει η απαίτηση να οικοδομεί κανείς την πίστη μόνο στη Γραφή ή να προτιμά μόνο τη Γραφή. Γι’ αυτό οι προτεστάντες παραθέτουν περικοπές μόνο για τη σημασία της Γραφής (αποσιωπώντας τις περικοπές για τη σημασία της Παράδοσης), επειδή περικοπές για τη Sola Scriptura στη Γραφή απλώς δεν υπάρχουν.</p></li><li><p><strong>Αντίθετα, στη Γραφή λέγεται να φυλάσσεται η προφορική Παράδοση</strong>. Επανειλημμένα απαιτείται να φυλάσσεται η Παράδοση: όχι μόνο το γραπτό, αλλά και το προφορικό κήρυγμα των αποστόλων (<a href="https://bibleox.com/el/el/w/Η_Ιερά_Παράδοση">περικοπές</a>). Επιπλέον, το προφορικό κήρυγμα τίθεται από τους αποστόλους στην πρώτη θέση (<a href="https://bibleox.com/el/gr-lxx-byz/2sol/2/#L15">Β Θεσ 2:15</a>).</p></li><li><p><strong>Στη Γραφή απαιτείται να μαθαίνουμε από τους διδασκάλους της Εκκλησίας. </strong>Ο Θεός τοποθετεί στην Εκκλησία πρεσβυτέρους και διδασκάλους (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/12/#L28">Α Κορ 12:28</a> · <a href="https://bibleox.com/el/gr-lxx-byz/ef/4/#L11">Εφ 4:11</a>) στους οποίους έχει ανατεθεί η καθοδήγηση και η διδασκαλία του εκκλησιαστικού ποιμνίου (με το ποίμνιο). Οι οπαδοί της Sola Scriptura αρνούνται να μάθουν από την Εκκλησία. Μη επιθυμώντας να γίνουν μαθητές στην Εκκλησία, αυτοί οι άνθρωποι ανακήρυξαν οι ίδιοι εαυτούς διδασκάλους (<a href="https://bibleox.com/el/gr-lxx-byz/2tim/4/#L3">Β Τιμ 4:3</a>).</p></li><li><p><strong>Η Γραφή μπορεί να ερμηνευθεί λανθασμένα</strong>. Στη Γραφή υπάρχει υπόδειξη ότι άνθρωποι μη εδραιωμένοι από την Εκκλησία ερμηνεύουν τη Γραφή προς δική τους απώλεια (<a href="https://bibleox.com/el/gr-lxx-byz/2pet/3/#L15-16">Β Πε 3:15-16</a>). Οι οπαδοί της Sola Scriptura ούτε καν σκοπεύουν να μάθουν από την Εκκλησία. Οι ίδιοι, απορρίπτοντας τους διδασκάλους και παίρνοντας μόνο το εγχειρίδιο, ερμηνεύουν τη Γραφή όπως τύχει, κάτι που τους οδήγησε στην ύπαρξη τεράστιου αριθμού διαιρεμένων κοινοτήτων με διαφορετική πίστη και διαφορετική κατανόηση του εγχειριδίου (της Γραφής). Στη Γραφή όμως λέγεται ότι η αυτόνομη ερμηνεία της Γραφής χωρίς καθοδήγηση από την Εκκλησία οδηγεί στη διαστρέβλωση της Γραφής και στην απώλεια (<a href="https://bibleox.com/el/gr-lxx-byz/2pet/3/#L15-16">Β Πε 3:15-16</a>).</p></li></ol><p>Έτσι, οι οπαδοί της Sola Scriptura ενεργούν κατά της Γραφής στα εξής:</p><ol><li><p><strong>Διδάσκουν ό,τι δεν υπάρχει στην Αγία Γραφή</strong>. Στη Γραφή δεν υπάρχει διδασκαλία περί «Sola Scriptura»·</p></li><li><p><strong>Απορρίπτουν την προφορική Παράδοση των αποστόλων</strong>. Λένε ότι πρωταρχική σημασία έχει μόνο η Γραφή, ενεργώντας αντίθετα προς τα λόγια των αποστόλων που είναι γραμμένα στη Γραφή, στα οποία απαιτούν να φυλάσσεται η Παράδοση, θέτοντας στην πρώτη θέση το προφορικό κήρυγμα και μόνο μετά το γραπτό (<a href="https://bibleox.com/el/gr-lxx-byz/2sol/2/#L15">Β Θεσ 2:15</a>)·</p></li><li><p><strong>Απορρίπτουν το διδακτικό αξίωμα της Εκκλησίας</strong> και των διδασκάλων της Εκκλησίας που τοποθέτησε ο Θεός, ευθέως κατά της Γραφής (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/12/#L28">Α Κορ 12:28</a> · <a href="https://bibleox.com/el/gr-lxx-byz/ef/4/#L11">Εφ 4:11</a>).</p></li><li><p><strong>Ερμηνεύουν τη Γραφή χωρίς να είναι εδραιωμένοι από την Εκκλησία</strong>. Κάθε προτεσταντική κοινότητα έχει τη δική της κατανόηση της Γραφής, κάθε σύναξη της κοινότητας και μέσα στην ίδια τη σύναξη μπορούν να κατανοούν τη Γραφή όπως οι ίδιοι θέλουν, επειδή η Sola Scriptura παροτρύνει να απορρίπτεται η ύψιστη αυθεντία οποιωνδήποτε άλλων πηγών διδασκαλίας εκτός από τη Γραφή (στην κατανόηση του αναγνώστη). Αν σε κάποιον άρεσε μια άλλη κατανόηση της Γραφής, τότε αυτή θα θεωρηθεί αληθινή, αφού η Γραφή είναι ανώτερη από τον λόγο του κήρυκα, έστω και προτεστάντη.</p></li></ol><h2>Η κύρια απόδειξη της πλάνης της ιδέας της Sola Scriptura</h2><p>Αν σκοπός της επινόησης της Sola Scriptura ήταν η όσο το δυνατόν ισχυρότερη διαίρεση του χριστιανικού κόσμου, τότε αυτή η ιδέα αποδείχθηκε εξαιρετικά αποτελεσματική. Αν όμως σκοπός της επινόησής της ήταν η αναζήτηση της πίστης των αποστόλων, τότε η Sola Scriptura έγινε μια εσφαλμένη ιδέα, που απλώς απομάκρυνε από τον σκοπό και γέννησε πλήθος παραδόσεων και διαιρέσεων.</p><p>Η πιο σημαντική απόδειξη της πλάνης της Sola Scriptura είναι οι ίδιοι οι οπαδοί της Sola Scriptura: αναρίθμητο πλήθος κοινοτήτων που αντιφάσκουν μεταξύ τους, με διδασκαλίες επινοημένες κάτω από το σύνθημα «μόνο η Γραφή». Καμία άλλη ιδέα δεν δημιούργησε τόσες διαιρέσεις μεταξύ των πιστών στον Χριστό, όσες η «Sola Scriptura». Και αυτό έγινε σε ευθεία αντίθεση με τη Γραφή (<a href="https://bibleox.com/el/gr-lxx-byz/in/17/#L20-21">Ιω 17:20-21</a> · <a href="https://bibleox.com/el/gr-lxx-byz/1kor/1/#L10">Α Κορ 1:10</a> · <a href="https://bibleox.com/el/gr-lxx-byz/1in/2/#L18-19">Α Ιω 2:18-19</a>).</p><blockquote><p>«Οὐ περὶ τούτων δὲ ἐρωτῶ μόνον, ἀλλὰ καὶ περὶ τῶν πιστευόντων διὰ τοῦ λόγου αὐτῶν εἰς ἐμέ, <strong>ἵνα πάντες ἓν ὦσιν</strong>, καθὼς σύ, πάτερ, ἐν ἐμοὶ κἀγὼ ἐν σοί, ἵνα καὶ αὐτοὶ ἐν ἡμῖν ὦσιν, <strong>ἵνα ὁ κόσμος πιστεύῃ</strong> ὅτι σύ με ἀπέστειλας.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/17/#L20-21">Ιω 17:20-21</a>)</p></blockquote><blockquote><p>«Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, διὰ τοῦ ὀνόματος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, <strong>ἵνα τὸ αὐτὸ λέγητε πάντες, καὶ μὴ ᾖ ἐν ὑμῖν σχίσματα</strong>, ἦτε δὲ κατηρτισμένοι ἐν τῷ αὐτῷ νοῒ καὶ ἐν τῇ αὐτῇ γνώμῃ.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/1/#L10">Α Κορ 1:10</a>)</p></blockquote><blockquote><p>«Παιδία, ἐσχάτη ὥρα ἐστίν, καὶ καθὼς ἠκούσατε ὅτι ἀντίχριστος ἔρχεται, καὶ νῦν ἀντίχριστοι πολλοὶ γεγόνασιν· ὅθεν γινώσκομεν ὅτι ἐσχάτη ὥρα ἐστίν. ἐξ ἡμῶν ἐξῆλθαν, ἀλλ᾿ οὐκ ἦσαν ἐξ ἡμῶν· <strong>εἰ γὰρ ἐξ ἡμῶν ἦσαν, μεμενήκεισαν ἂν μεθ᾿ ἡμῶν</strong>· ἀλλ᾿ ἵνα φανερωθῶσιν ὅτι οὐκ εἰσὶν πάντες ἐξ ἡμῶν.» (<a href="https://bibleox.com/el/gr-lxx-byz/1in/2/#L18-19">Α Ιω 2:18-19</a>)</p></blockquote><hr><p>Τον 16ο αιώνα ο μεταρρυθμιστής Λούθηρος πρότεινε την αντίληψη της Sola Scriptura. Στη συνέχεια, κάθε μεταρρυθμιστής άρχισε να οικοδομεί την πίστη, αποδίδοντας ύψιστη αυθεντία, όπως ισχυριζόταν, «μόνο στη Γραφή» (στη δική του κατανόηση της Γραφής). Υποτίθεται ότι η οικοδόμηση της πίστης μόνο στη Γραφή θα έπρεπε να οδηγήσει στην πίστη των αποστόλων. Έτσι διακηρύχθηκε ότι ακριβώς αυτή η μέθοδος και μόνο αυτή επιτρέπει στον άνθρωπο να φτάσει στην πίστη των αποστόλων. Αλλά στο τέλος, σε όλους τους μεταρρυθμιστές, παρά την πρόθεση, βγήκε διαφορετική πίστη.</p><p>Στην αρχή η προσέγγιση της «Sola Scriptura» γέννησε τρεις κατευθύνσεις με διαφορετικές κατανοήσεις της Γραφής: λουθηρανούς, καλβινιστές και αγγλικανούς. Αργότερα, αυτή η αντίληψη επέτρεψε σε οποιονδήποτε άνθρωπο στον πλανήτη να δημιουργεί τις δικές του κοινότητες με τις δικές του διδασκαλίες, αρκεί μόνο να πάρει στα χέρια του μια Βίβλο. Έτσι εμφανίστηκαν χιλιάδες, λεγόμενες, ομολογίες, καθεμία με τη δική της πίστη και τη δική της κατανόηση της Γραφής. Αυτή η διαδικασία συνεχίζεται μέχρι σήμερα. Εξαιτίας της διαφοράς στην πίστη, ακολουθώντας <strong>ανθρώπινα έθιμα</strong> (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/3/#L3">Α Κορ 3:3</a>), όλοι διαιρούνται μεταξύ τους, όλοι έχουν διαφορετική <strong>πίστη</strong>, διαφορετικό <strong>βάπτισμα</strong> και διαφορετική <strong>αντίληψη περί Θεού</strong>. Όλα αυτά αντιφάσκουν με το πώς πρέπει να είναι στην Εκκλησία:</p><blockquote><p>«ἓν σῶμα καὶ ἓν πνεῦμα, καθὼς καὶ ἐκλήθητε ἐν μιᾷ ἐλπίδι τῆς κλήσεως ὑμῶν· <strong>εἷς <mark>κύριος</mark>, μία <mark>πίστις</mark>, ἓν <mark>βάπτισμα</mark></strong>·» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/4/#L4-5">Εφ 4:4-5</a>)</p></blockquote><p>Κάποιοι μπορεί να αντιτάξουν σχετικά με τη διαφορετική πίστη στον Θεό, λέγοντας ότι όλοι πιστεύουν στον Ιησού. Ωστόσο δεν έχουν όλοι την αποστολική πίστη στον Χριστό ως Θεό· υπάρχουν αρκετοί προτεστάντες-ουνιτάριοι που αρνούνται την πίστη στον Θεό, έναν κατά φύση και τριαδικό στα πρόσωπα: Πατέρα, Υιό και Άγιο Πνεύμα. Επιπλέον, πολλές κοινότητες έχουν διαφορετικές αντιλήψεις για τον Θεό, το θέλημά Του και τους τρόπους ευαρέστησής Του. Για παράδειγμα, οι πεντηκοστιανοί/χαρισματικοί θεωρούν ότι στον Θεό είναι ευάρεστο το ασυνάρτητο μουρμουρητό τους, οι πτώσεις στο πάτωμα και ότι όλα αυτά δήθεν είναι ενέργεια του Αγίου Πνεύματος, δηλαδή του Θεού. Την ίδια στιγμή οι άλλες κοινότητες απορρίπτουν αυτή την αντίληψη των πεντηκοστιανών για τον Θεό, προτείνοντας αντ’ αυτής τις δικές τους αντιλήψεις. Έτσι, έχουν διαφορετικές αντιλήψεις για τον Θεό, και μερικές φορές και διαφορετικές διδασκαλίες για τον Θεό.</p><p>Το αναρίθμητο πλήθος ανθρώπων που αντιφάσκουν μεταξύ τους με τη Βίβλο στα χέρια, οι οποίοι ισχυρίζονται ότι οικοδόμησαν μια ακόμη πίστη «μόνο κατά τη Γραφή», αποτελεί το πιο χαρακτηριστικό επιχείρημα κατά της Sola Scriptura. Μέσω του «μόνο η Γραφή» υποσχέθηκαν στους ανθρώπους να ανοίξουν δρόμο προς μία αποστολική πίστη, απαλλάσσοντας την πίστη από τις «ανθρώπινες επικαλύψεις», αλλά στην πραγματικότητα αυτή η προσέγγιση γέννησε τεράστιο πλήθος ανθρώπινων επικαλύψεων και δεν έδωσε στον χριστιανικό κόσμο τίποτα άλλο παρά αναρίθμητες διαιρέσεις, αντίθετα με το θέλημα του Θεού περί της ενότητας των πιστών (<a href="https://bibleox.com/el/gr-lxx-byz/in/17/#L20-21">Ιω 17:20-21</a> · <a href="https://bibleox.com/el/gr-lxx-byz/1kor/1/#L10">Α Κορ 1:10</a> · <a href="https://bibleox.com/el/gr-lxx-byz/1in/2/#L18-19">Α Ιω 2:18-19</a>).</p><blockquote><p>«Οὐ περὶ τούτων δὲ ἐρωτῶ μόνον, ἀλλὰ καὶ περὶ τῶν πιστευόντων διὰ τοῦ λόγου αὐτῶν εἰς ἐμέ, ἵνα πάντες ἓν ὦσιν, καθὼς σύ, πάτερ, ἐν ἐμοὶ κἀγὼ ἐν σοί, <strong><mark>ἵνα καὶ αὐτοὶ ἐν ἡμῖν ὦσιν</mark>, ἵνα ὁ κόσμος πιστεύῃ</strong> ὅτι σύ με ἀπέστειλας.» (<a href="https://bibleox.com/el/gr-lxx-byz/in/17/#L20-21">Ιω 17:20-21</a>)</p></blockquote><blockquote><p>«<strong><mark>Παρακαλῶ</mark></strong> δὲ ὑμᾶς, ἀδελφοί, διὰ τοῦ ὀνόματος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, <strong><mark>ἵνα τὸ αὐτὸ λέγητε πάντες</mark>, <mark>καὶ μὴ ᾖ ἐν ὑμῖν σχίσματα</mark></strong>, <strong>ἦτε δὲ κατηρτισμένοι <mark>ἐν τῷ αὐτῷ νοῒ</mark> καὶ <mark>ἐν τῇ αὐτῇ γνώμῃ</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/1/#L10">Α Κορ 1:10</a>)</p></blockquote><h3>Παραλληλίες της Παλαιάς Διαθήκης[3]</h3><p>Παρόμοια διαίρεση συνέβη στην Παλαιά Διαθήκη κατά την οικοδόμηση της βαβυλωνιακής πόλης και του πύργου (<a href="https://bibleox.com/el/gr-lxx-byz/gen/11/#L1-9">Γεν 11:1-9</a>). Οι άνθρωποι αποφάσισαν με τις δικές τους δυνάμεις να χτίσουν πόλη και πύργο μέχρι τον ουρανό (<a href="https://bibleox.com/el/gr-lxx-byz/gen/11/#L4">Γεν 11:4</a>), αλλά άρχισαν να μιλούν διαφορετικά (<a href="https://bibleox.com/el/gr-lxx-byz/gen/11/#L7">Γεν 11:7</a>), διαιρέθηκαν και διασκορπίστηκαν (<a href="https://bibleox.com/el/gr-lxx-byz/gen/11/#L8">Γεν 11:8</a>). Έτσι και τώρα.</p><p>Ο Θεός δημιούργησε την Εκκλησία, της έστειλε για πάντα το Άγιο Πνεύμα (<a href="https://bibleox.com/el/gr-lxx-byz/in/14/#L16">Ιω 14:16</a>), ο ίδιος υποσχέθηκε να είναι μαζί της όλες τις ημέρες (<a href="https://bibleox.com/el/gr-lxx-byz/mf/28/#L20">Μτ 28:20</a>), μετέδωσε προφορικά τη διδασκαλία, τοποθέτησε ιερείς (<a href="https://bibleox.com/el/gr-lxx-byz/act/20/#L17-18,28">Πραξ 20:17-18,28</a>) και διδασκάλους (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/12/#L28">Α Κορ 12:28</a>), οι οποίοι δίδασκαν προφορικά, αλλά και αλληλογραφούσαν.</p><p>Ύστερα από περισσότερους από XV αιώνες έρχονται άνθρωποι, παίρνουν από την Εκκλησία μόνο την αλληλογραφία ορισμένων αποστόλων (όχι όλων) που διαφύλαξε η Εκκλησία, αντίθετα προς αυτή την αλληλογραφία απορρίπτουν την αήττητη Εκκλησία (<a href="https://bibleox.com/el/gr-lxx-byz/mf/16/#L18">Μτ 16:18</a>) — το <strong>θεμέλιο</strong> που έθεσε ο Θεός, απορρίπτουν την πίστη που παραλήφθηκε από τους αποστόλους και φυλάσσεται στην Εκκλησία — την Παράδοση των αποστόλων (<a href="https://bibleox.com/el/gr-lxx-byz/2sol/2/#L15">Β Θεσ 2:15</a> κ.ά.), τους ιερείς (<a href="https://bibleox.com/el/gr-lxx-byz/act/20/#L17-18,28">Πραξ 20:17-18,28</a>) και τους διδασκάλους (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/12/#L28">Α Κορ 12:28</a>) που τοποθέτησε ο Θεός, και σκόπευαν με τον δικό τους νου και τις δικές τους δυνάμεις (έρευνες στον τομέα της ιστορίας, της αρχαιολογίας, της γλωσσολογίας κ.ά.) αυτόνομα, χωριστά από την Εκκλησία που ίδρυσε ο Θεός, να χτίσουν τη δική τους πόλη. Σε αυτούς προσχωρούν και άλλοι οικοδόμοι. Στο τέλος, άρχισαν να μιλούν διαφορετικά, διαιρέθηκαν και διασκορπίστηκαν, αρχίζοντας να χτίζουν τους δικούς τους οικισμούς με τις δικές τους γλώσσες επικοινωνίας, μη θέλοντας να ζήσουν στην <em>πόλη «που έχει </em><strong><em>θεμέλιο</em></strong><em>, της οποίας τεχνίτης και δημιουργός είναι ο Θεός»</em> (<a href="https://bibleox.com/el/gr-lxx-byz/evr/11/#L10">Εβρ 11:10</a>).</p><h2>Το «μόνο η Γραφή» οδηγεί στη σκέψη του «μόνο»</h2><p>Η διδασκαλία των προτεσταντών, που περιλαμβάνει πολλά αξιώματα με τη λέξη «μόνο», συχνά οδηγεί τους οπαδούς της σε μια σκέψη που μπορεί σύντομα να ονομαστεί σκέψη του «μόνο». Αυτό αναγκάζει πολλούς από αυτούς να δίνουν προσοχή μόνο σε ορισμένα κομμάτια του κειμένου που τους αρέσουν, φαντάζοντας στα κατάλληλα σημεία τη λέξη «μόνο», σαν να λένε στον εαυτό τους: «μόνο αυτά τα λόγια πρέπει να λάβω υπόψη», χτίζοντας πάνω σε αυτό κάποια κατασκευή. Όταν ο συγγραφέας κάποιου κειμένου εξετάζει διάφορες πλευρές ενός θέματος, περιγράφοντάς τες είτε διαδοχικά είτε σε διάφορα σημεία του έργου του, τότε στους προτεστάντες συχνά επιλέγεται μόνο ένα πράγμα και ανυψώνεται σε απόλυτο.</p><ul><li><p>Για παράδειγμα, οι απόστολοι γράφουν για την αναγκαιότητα για τη σωτηρία και της πίστης και των έργων. Η σκέψη του «μόνο» αναγκάζει εδώ να επιλεγεί το απόσπασμα του κειμένου για την πίστη και να προστεθεί η λέξη «μόνο».</p></li><li><p>Οι απόστολοι γράφουν για την αναγκαιότητα και της Γραφής και της Παράδοσης. Η σκέψη του «μόνο» αναγκάζει εδώ να επιλεγεί το απόσπασμα του κειμένου για τη σημασία της Γραφής και να προστεθεί η λέξη «μόνο».</p></li></ul><p>Κατά τη μελέτη των κειμένων των αρχαίων συγγραφέων αυτή η σκέψη εκδηλώνεται σχεδόν παντού.</p><ul><li><p>Για παράδειγμα, οι συγγραφείς κατά την εξήγηση της Ευχαριστίας δίνουν δύο ερμηνείες (κυριολεκτική και συμβολική), οι προτεστάντες τείνουν να βλέπουν μόνο τη συμβολική ερμηνεία, προσπαθώντας να παρουσιάσουν αυτούς τους συγγραφείς ως οπαδούς των δικών τους «μόνο»-διδασκαλιών.</p></li></ul><p>Με αυτή την αρχή προέκυψαν πολλές αιρέσεις. Άραγε το γεγονός ότι ο Ιησούς Χριστός είναι άνθρωπος σημαίνει ότι είναι μόνο άνθρωπος; Όχι, είναι και Θεός. Και αν είναι Θεός, μήπως αυτό σημαίνει ότι είναι μόνο Θεός; Όχι, είναι και άνθρωπος. Αν ο Χριστός είναι εικόνα του Πατέρα, μήπως αυτό σημαίνει ότι είναι μόνο εικόνα (απλώς απεικόνιση); Όχι, είναι και αληθινός Θεός και αληθινός άνθρωπος. Πόσοι άνθρωποι προσέκοψαν σε αυτό, και μέχρι σήμερα προσκόπτουν. Έτσι και εδώ, η συμβολική ερμηνεία δεν απορρίπτει την κυριολεκτική, και η κυριολεκτική δεν απορρίπτει τη συμβολική.</p><p>Στους ορθοδόξους τίποτα δεν εμποδίζει να αναγνωρίζουν την αναγκαιότητα και της Γραφής και της Παράδοσης, και της πίστης και των έργων, και αναγνωρίζοντας την κυριολεκτική κατανόηση της Ευχαριστίας, να αναγνωρίζουν επιπλέον και τις συμβολικές σημασίες. Πολλοί προτεστάντες παντού επιμένουν στη λέξη «μόνο», απλώς αγνοώντας τις άλλες δηλώσεις των ίδιων συγγραφέων.</p><h2>Η Σύνοδος στα Ιεροσόλυμα και η Γραφή</h2><p>Μία από τις χαρακτηριστικές αποδείξεις ότι η Εκκλησία δεν ζούσε κατά την αρχή «μόνο η Γραφή» είναι τα γεγονότα της πρώτης εκκλησιαστικής Συνόδου στα Ιεροσόλυμα υπό την ηγεσία των αποστόλων.</p><p>Στη Σύνοδο των Ιεροσολύμων, χωρίς υποδείξεις από τη Γραφή, καταργείται ο Νόμος του Μωυσή, η περιτομή, η απαγόρευση ακάθαρτης τροφής, η αργία του Σαββάτου, η απαγόρευση επαφής με νεκρούς, η επικοινωνία με ειδωλολάτρες και ούτω καθεξής. Αυτή την απόφαση πήρε η Εκκλησία, συγκεντρωμένη και αφού συσκέφθηκε (<a href="https://bibleox.com/el/gr-lxx-byz/act/15/#L22">Πραξ 15:22</a>). Αυτό έγινε χωρίς τη Γραφή, επειδή ο συγγραφέας της Γραφής ζει στην Εκκλησία — το Άγιο Πνεύμα, και γι’ αυτό <strong>ο κανόνας της Συνόδου δεν επικυρώνεται με τη φράση «όπως είναι γραμμένο»</strong>, αλλά με την υπόδειξη του θελήματος του Αγίου Πνεύματος και της Εκκλησίας: «<strong><mark>έτσι φάνηκε καλό στο Άγιο Πνεύμα και σε εμάς</mark></strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/act/15/#L28-29">Πραξ 15:28-29</a>).</p><p>Έτσι, η κατάργηση του Νόμου του Μωυσή είναι απόφαση του Αγίου Πνεύματος και της Εκκλησίας. Από την άλλη, σε αυτούς αντιτάσσονταν χριστιανοί που είχαν πιστέψει από τη φαρισαϊκή αίρεση (<a href="https://bibleox.com/el/gr-lxx-byz/act/15/#L5">Πραξ 15:5</a>). Στο πλευρό των δεύτερων ήταν μερικές κατανοητές εκφράσεις από τη Γραφή (<a href="https://bibleox.com/el/gr-lxx-byz/gen/17/#L14">Γεν 17:14</a>). Στο πλευρό όμως των αποστόλων ήταν ακριβώς η αυθεντία της Εκκλησίας, γιατί αυτοί, όπως είναι γραμμένο, συσκέφθηκαν με όλη την Εκκλησία (<a href="https://bibleox.com/el/gr-lxx-byz/act/15/#L22">Πραξ 15:22</a>), και στη συνέχεια διακήρυξαν την κοινή απόφαση. Χωρίς τη Γραφή, αλλά μόνο με τον λόγο τους υπέδειξαν την κατάργηση του Νόμου σε εκείνους που απαιτούσαν να τηρούν τον Νόμο κατά τη Γραφή.</p><p>Στη Γραφή λέγεται ότι πρέπει να περιτέμνεται κανείς και ότι εκείνος που δεν περιτέμνεται θα εξολοθρευτεί από τον λαό (<a href="https://bibleox.com/el/gr-lxx-byz/gen/17/#L14">Γεν 17:14</a>). Αλλά οι απόστολοι δεν ανέθεσαν να διδάσκεται αυτό:</p><blockquote><p><em>«Ἐπειδὴ ἠκούσαμεν ὅτι τινὲς ἐξ ἡμῶν [ἐξελθόντες] </em><strong><em>ἐτάραξαν ὑμᾶς λόγοις</em></strong><em> </em><strong><em>ἀνασκευάζοντες τὰς ψυχὰς ὑμῶν</em></strong><em>, </em><strong><em>οἷς <mark>οὐ διεστειλάμεθα</mark></em></strong><em>,» (</em><a href="https://bibleox.com/el/gr-lxx-byz/act/15/#L24"><em>Πραξ 15:24</em></a><em>)</em></p></blockquote><p>Αλλά αυτό, στην πραγματικότητα, λέγεται στη Γραφή. Για ποιο λόγο δεν πρέπει να το διδάσκουμε; Με βάση ποια Γραφή αποφάσισαν ότι δεν πρέπει να περιτέμνονται; Ποια Γραφή επέτρεψε να τρώνε χοιρινό; — Αυτό έγινε όχι κατά τη Γραφή, αλλά με συνοδική απόφαση όλης της Εκκλησίας που βεβαιώνει την αλήθεια (<a href="https://bibleox.com/el/gr-lxx-byz/1tim/3/#L15">Α Τιμ 3:15</a>).</p><p>Από τότε, η απόφαση της Συνόδου των Ιεροσολύμων έγινε Παράδοση της Εκκλησίας:</p><blockquote><p><em>«ὡς δὲ διεπορεύοντο τὰς πόλεις, </em><strong><em><mark>παρεδίδοσαν</mark></em></strong><em> αὐτοῖς φυλάσσειν τὰ δόγματα τὰ κεκριμένα ὑπὸ τῶν ἀποστόλων καὶ πρεσβυτέρων τῶν ἐν Ἱεροσολύμοις.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/act/16/#L4"><em>Πραξ 16:4</em></a><em>)</em></p></blockquote><hr><p>Ο πρόεδρος της αποστολικής Συνόδου των Ιεροσολύμων, ο απόστολος Ιάκωβος, θυμάται στην ομιλία του τα λόγια του προφήτη Αμώς. Σε αυτή την προφητεία δεν υπάρχουν λόγια για την περιτομή:</p><blockquote><p><em>«ἐν τῇ ἡμέρᾳ ἐκείνῃ ἀναστήσω τὴν σκηνὴν Δαυιδ τὴν πεπτωκυῖαν καὶ ἀνοικοδομήσω τὰ πεπτωκότα αὐτῆς καὶ τὰ κατεσκαμμένα αὐτῆς ἀναστήσω καὶ ἀνοικοδομήσω αὐτὴν καθὼς αἱ ἡμέραι τοῦ αἰῶνος, ὅπως ἐκζητήσωσιν οἱ κατάλοιποι τῶν ἀνθρώπων καὶ πάντα τὰ ἔθνη, ἐφ᾿ οὓς ἐπικέκληται τὸ ὄνομά μου ἐπ᾿ αὐτούς, λέγει κύριος ὁ θεὸς ὁ ποιῶν ταῦτα.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/am/9/#L11-12"><em>Αμ 9:11-12</em></a><em>)</em></p></blockquote><p>Αν με αυτή τη βάση γίνεται δεκτό ό,τι έγινε στη Σύνοδο των Ιεροσολύμων (κάποια έμμεση αναφορά στη Γραφή και μνεία του Αγίου Πνεύματος), τότε λογικά πρέπει να γίνουν δεκτές όλες οι Οικουμενικές Σύνοδοι της Ορθόδοξης Εκκλησίας, και όχι μόνο η Ιεροσολυμιτική, επειδή το Άγιο Πνεύμα αποστέλλεται στην Εκκλησία όχι μόνο για τη Σύνοδο των Ιεροσολύμων, αλλά για πάντα:</p><blockquote><p><em>«κἀγὼ ἐρωτήσω τὸν πατέρα καὶ ἄλλον παράκλητον δώσει ὑμῖν </em><strong><em>ἵνα μεθ᾿ ὑμῶν <mark>εἰς τὸν αἰῶνα</mark> ᾖ</em></strong><em>,» (</em><a href="https://bibleox.com/el/gr-lxx-byz/in/14/#L16"><em>Ιω 14:16</em></a><em>)</em></p></blockquote><p>Και ο ίδιος ο Χριστός υποσχέθηκε να είναι με την Εκκλησία όλες τις ημέρες:</p><blockquote><p><em>«διδάσκοντες αὐτοὺς τηρεῖν πάντα ὅσα ἐνετειλάμην ὑμῖν· καὶ ἰδοὺ ἐγὼ μεθ᾿ ὑμῶν εἰμι </em><strong><em><mark>πάσας τὰς ἡμέρας</mark> ἕως τῆς συντελείας τοῦ αἰῶνος</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/mf/28/#L20"><em>Μτ 28:20</em></a><em>)</em></p></blockquote><p>Πολύ πιο ισχυρά επιχειρήματα από τη Γραφή επιδείκνυαν σε όλες τις Συνόδους, περιλαμβανομένης και της Ζ΄, που υπερασπίστηκε την προσκύνηση των εικόνων. Το Άγιο Πνεύμα βρίσκεται ακόμη στην Εκκλησία. Όλες οι Σύνοδοι πρέπει να γίνουν δεκτές σύμφωνα με τέτοια επιχειρήματα.</p><h2>Το διδακτικό αξίωμα της Εκκλησίας</h2><h3>Το ποίμνιο έχει ανατεθεί στους πρεσβυτέρους, που είναι οι φύλακές του</h3><blockquote><p><em>«Ἀπὸ δὲ τῆς Μιλήτου πέμψας εἰς Ἔφεσον μετεκαλέσατο τοὺς πρεσβυτέρους τῆς ἐκκλησίας. ὡς δὲ παρεγένοντο πρὸς αὐτὸν εἶπεν αὐτοῖς, Ὑμεῖς ἐπίστασθε ἀπὸ πρώτης ἡμέρας ἀφ᾿ ἧς ἐπέβην εἰς τὴν Ἀσίαν πῶς μεθ᾿ ὑμῶν τὸν πάντα χρόνον ἐγενόμην, &lt;…&gt; προσέχετε ἑαυτοῖς καὶ παντὶ τῷ ποιμνίῳ, </em><strong><em>ἐν ᾧ ὑμᾶς <mark>τὸ πνεῦμα τὸ ἅγιον ἔθετο ἐπισκόπους, ποιμαίνειν τὴν ἐκκλησίαν</mark> τοῦ θεοῦ</em></strong><em>, ἣν περιεποιήσατο διὰ τοῦ αἵματος τοῦ ἰδίου.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/act/20/#L17-18,28"><em>Πραξ 20:17-18,28</em></a><em>)</em></p></blockquote><h3>Ο Θεός έθεσε στην Εκκλησία διδασκάλους· δεν είναι όλοι διδάσκαλοι</h3><blockquote><p>«καὶ <strong>αὐτὸς <mark>ἔδωκεν</mark></strong> τοὺς μὲν ἀποστόλους, τοὺς δὲ προφήτας, τοὺς δὲ εὐαγγελιστάς, τοὺς δὲ <strong>ποιμένας καὶ <mark>διδασκάλους</mark></strong>, πρὸς τὸν καταρτισμὸν τῶν ἁγίων εἰς ἔργον διακονίας, εἰς οἰκοδομὴν τοῦ σώματος τοῦ Χριστοῦ,» (<a href="https://bibleox.com/el/gr-lxx-byz/ef/4/#L11-12">Εφ 4:11-12</a>)</p></blockquote><blockquote><p>«καὶ <strong><mark>οὓς μὲν ἔθετο ὁ θεὸς ἐν τῇ ἐκκλησίᾳ</mark></strong> πρῶτον ἀποστόλους, δεύτερον προφήτας, τρίτον <strong><mark>διδασκάλους</mark></strong>, ἔπειτα δυνάμεις, ἔπειτα χαρίσματα ἰαμάτων, ἀντιλήμψεις, κυβερνήσεις, γένη γλωσσῶν. μὴ πάντες ἀπόστολοι; μὴ πάντες προφῆται; <strong><mark>μὴ πάντες διδάσκαλοι</mark></strong>; μὴ πάντες δυνάμεις;» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/12/#L28-29">Α Κορ 12:28-29</a>)</p></blockquote><h3>Άνθρωποι μη εδραιωμένοι από την Εκκλησία ερμηνεύουν τη Γραφή προς δική τους απώλεια</h3><blockquote><p>«καὶ τὴν τοῦ κυρίου ἡμῶν μακροθυμίαν σωτηρίαν ἡγεῖσθε, καθὼς καὶ ὁ ἀγαπητὸς ἡμῶν ἀδελφὸς Παῦλος κατὰ τὴν δοθεῖσαν αὐτῷ σοφίαν ἔγραψεν ὑμῖν, <strong>ὡς καὶ ἐν πάσαις ἐπιστολαῖς λαλῶν ἐν αὐταῖς περὶ τούτων, ἐν αἷς ἐστιν δυσνόητά τινα, ἃ <mark>οἱ ἀμαθεῖς καὶ ἀστήρικτοι στρεβλοῦσιν ὡς καὶ τὰς λοιπὰς γραφὰς πρὸς τὴν ἰδίαν αὐτῶν ἀπώλειαν</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/2pet/3/#L15-16">Β Πε 3:15-16</a>)</p></blockquote><h2>Η Γραφή μπορεί να ερμηνευθεί λανθασμένα</h2><blockquote><p>«καὶ τὴν τοῦ κυρίου ἡμῶν μακροθυμίαν σωτηρίαν ἡγεῖσθε, καθὼς καὶ ὁ ἀγαπητὸς ἡμῶν ἀδελφὸς Παῦλος κατὰ τὴν δοθεῖσαν αὐτῷ σοφίαν ἔγραψεν ὑμῖν, <strong>ὡς καὶ ἐν πάσαις ἐπιστολαῖς λαλῶν ἐν αὐταῖς περὶ τούτων, ἐν αἷς ἐστιν δυσνόητά τινα, ἃ <mark>οἱ ἀμαθεῖς καὶ ἀστήρικτοι στρεβλοῦσιν ὡς καὶ τὰς λοιπὰς γραφὰς πρὸς τὴν ἰδίαν αὐτῶν ἀπώλειαν</mark></strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/2pet/3/#L15-16">Β Πε 3:15-16</a>)</p></blockquote><p>Περισσότερα: <a href="https://bibleox.com/el/el/w/Η_ερμηνεία_της_Γραφής">η ερμηνεία της Γραφής</a>.</p><blockquote><p>ας μάθουν από τις Γραφές ότι <strong><mark>ο διάβολος, που επινόησε τις αιρέσεις</mark></strong> εξαιτίας της δυσωδίας της ίδιας του της κακίας <strong><mark>μεταχειρίζεται τα ρητά της Γραφής, ώστε υπό την κάλυψή τους, αφού διασπείρει το δηλητήριό του, να εξαπατήσει τους απλούς</mark></strong>. Έτσι εξαπάτησε την Εύα. Έτσι προκάλεσε και τις άλλες αιρέσεις. Έτσι και τώρα <strong><mark>έπεισε τον Άρειο να υποκρίνεται και να μιλά φαινομενικά κατά των αιρέσεων, ώστε απαρατήρητα να σπείρει στους νους των ανθρώπων τη δική του αίρεση</mark></strong>. &lt;…&gt; Ποιος άκουσε ποτέ κάτι παρόμοιο; Ή <strong>από πού ή από ποιον άκουσαν αυτό οι εξαγορασμένοι και κολακευτικοί υπερασπιστές της αίρεσης; Ποιος, διδάσκοντας κατηχητική διδασκαλία, τους είπε κάτι τέτοιο;</strong> &lt;…&gt; Αν όμως οι ίδιοι ομολογούν ότι το άκουσαν τώρα για πρώτη φορά, τότε ας μην αρνούνται ότι αυτή η αίρεση είναι ξένη προς εμάς και <strong>δεν προέρχεται από τους Πατέρες</strong>. Και αυτό που δεν προέρχεται από τους Πατέρες, αλλά επινοήθηκε μόλις τώρα, μπορεί να είναι κάτι άλλο από εκείνο για το οποίο προφήτευσε ο μακάριος Παύλος: «εν υστέροις καιροίς αποστήσονταί τινες της υγιαινούσης πίστεως, προσέχοντες πνεύμασι πλάνοις και διδασκαλίαις δαιμονίων, εν υποκρίσει ψευδολόγων, κεκαυτηριασμένων την ιδίαν συνείδησιν» (Α΄ Τιμ. 4:1-2) και «αποστρεφόμενοι την αλήθειαν» (Τίτ. 1:14).</p></blockquote><p>(Αθανάσιος ο Μέγας, Λόγος κατά Αρειανών Α΄, 8)</p><h2>Τι είναι η Παράδοση;</h2><p>Η Παράδοση είναι η αποκάλυψη του Θεού Πατέρα, την οποία Αυτός μέσω του Μονογενούς Υιού Του παρέδωσε στους αποστόλους, και εκείνοι την παρέδωσαν στην Εκκλησία, και η Εκκλησία τη μεταδίδει ως πίστη από γενιά σε γενιά με λόγο (προφορικό και γραπτό) και με έργο:</p><blockquote><p><em>«ὅτι </em><strong><em>τὰ ῥήματα ἃ <mark>ἔδωκάς</mark> μοι <mark>δέδωκα</mark> αὐτοῖς, καὶ αὐτοὶ ἔλαβον</em></strong><em> καὶ ἔγνωσαν ἀληθῶς ὅτι παρὰ σοῦ ἐξῆλθον, καὶ ἐπίστευσαν ὅτι σύ με ἀπέστειλας.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/in/17/#L8"><em>Ιω 17:8</em></a><em>)</em></p></blockquote><blockquote><p><em>«Ἐπαινῶ δὲ ὑμᾶς ὅτι </em><strong><em>πάντα μου μέμνησθε καὶ καθὼς παρέδωκα ὑμῖν τὰς <mark>παραδόσεις</mark> κατέχετε</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/1kor/11/#L2"><em>Α Κορ 11:2</em></a><em>)</em></p></blockquote><h2>Η εντολή να φυλάσσεται η Παράδοση και να διδάσκεται κατ’ αυτήν</h2><blockquote><p><em>«ἄρα οὖν, ἀδελφοί, </em><strong><em><mark>στήκετε, καὶ κρατεῖτε τὰς παραδόσεις</mark></em></strong><em> ἃς ἐδιδάχθητε εἴτε διὰ </em><strong><em>λόγου</em></strong><em> εἴτε δι᾿ </em><strong><em>ἐπιστολῆς</em></strong><em> ἡμῶν.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/2sol/2/#L15"><em>Β Θεσ 2:15</em></a><em>)</em></p></blockquote><blockquote><p><em>«Ἐπαινῶ δὲ ὑμᾶς ὅτι πάντα μου μέμνησθε καὶ </em><strong><em><mark>καθὼς παρέδωκα ὑμῖν τὰς παραδόσεις κατέχετε</mark></em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/1kor/11/#L2"><em>Α Κορ 11:2</em></a><em>)</em></p></blockquote><blockquote><p><em>«Γνωρίζω δὲ ὑμῖν, ἀδελφοί, τὸ εὐαγγέλιον ὃ εὐηγγελισάμην ὑμῖν, ὃ καὶ παρελάβετε, ἐν ᾧ καὶ ἑστήκατε, </em><strong><em><mark>δι᾿ οὗ καὶ σῴζεσθε</mark></em></strong><em>, </em><strong><em>τίνι λόγῳ εὐηγγελισάμην ὑμῖν εἰ κατέχετε</em></strong><em>, ἐκτὸς εἰ μὴ εἰκῇ ἐπιστεύσατε.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/1kor/15/#L1-2"><em>Α Κορ 15:1-2</em></a><em>)</em></p></blockquote><blockquote><p><em>«καὶ ἃ </em><strong><em><mark>ἤκουσας</mark></em></strong><em> </em><strong><em>παρ᾿ ἐμοῦ</em></strong><em> διὰ πολλῶν μαρτύρων, </em><strong><em><mark>ταῦτα παράθου</mark> πιστοῖς</em></strong><em> ἀνθρώποις, οἵτινες ἱκανοὶ ἔσονται καὶ ἑτέρους διδάξαι.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/2tim/2/#L2"><em>Β Τιμ 2:2</em></a><em>)</em></p></blockquote><blockquote><p><em>«Λοιπὸν οὖν, ἀδελφοί, ἐρωτῶμεν ὑμᾶς καὶ </em><strong><em><mark>παρακαλοῦμεν</mark></em></strong><em> ἐν κυρίῳ Ἰησοῦ, ἵνα </em><strong><em><mark>καθὼς παρελάβετε παρ᾿ ἡμῶν</mark> τὸ πῶς δεῖ ὑμᾶς περιπατεῖν καὶ ἀρέσκειν θεῷ, καθὼς καὶ περιπατεῖτε, <mark>ἵνα περισσεύητε μᾶλλον</mark></em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/1sol/4/#L1"><em>Α Θεσ 4:1</em></a><em>)</em></p></blockquote><blockquote><p><em>«Ἀγαπητοί, πᾶσαν σπουδὴν ποιούμενος γράφειν ὑμῖν περὶ τῆς κοινῆς ἡμῶν σωτηρίας ἀνάγκην ἔσχον γράψαι ὑμῖν παρακαλῶν </em><strong><em><mark>ἐπαγωνίζεσθαι τῇ ἅπαξ παραδοθείσῃ τοῖς ἁγίοις πίστει</mark></em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/iud/1/#L3"><em>Ιούδα 1:3</em></a><em>)</em></p></blockquote><blockquote><p><em>«ἀντεχόμενον τοῦ </em><strong><em><mark>κατὰ τὴν διδαχὴν πιστοῦ λόγου</mark></em></strong><em>, ἵνα δυνατὸς ᾖ καὶ παρακαλεῖν ἐν τῇ διδασκαλίᾳ τῇ ὑγιαινούσῃ καὶ τοὺς ἀντιλέγοντας ἐλέγχειν. Εἰσὶν γὰρ πολλοὶ [καὶ] </em><strong><em>ἀνυπότακτοι, ματαιολόγοι καὶ φρεναπάται</em></strong><em>, μάλιστα οἱ ἐκ τῆς περιτομῆς, οὓς δεῖ ἐπιστομίζειν, οἵτινες ὅλους οἴκους ἀνατρέπουσιν διδάσκοντες ἃ μὴ δεῖ αἰσχροῦ κέρδους χάριν.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/tit/1/#L9-11"><em>Τιτ 1:9-11</em></a><em>)</em></p></blockquote><blockquote><p><em>«φοβοῦμαι δὲ μή πως, ὡς ὁ ὄφις ἐξηπάτησεν Εὕαν ἐν τῇ πανουργίᾳ αὐτοῦ, φθαρῇ τὰ νοήματα ὑμῶν ἀπὸ τῆς ἁπλότητος [καὶ τῆς ἁγνότητος] τῆς εἰς τὸν Χριστόν. εἰ μὲν γὰρ ὁ ἐρχόμενος </em><strong><em><mark>ἄλλον Ἰησοῦν κηρύσσει ὃν οὐκ ἐκηρύξαμεν</mark></em></strong><em>, ἢ πνεῦμα ἕτερον λαμβάνετε ὃ οὐκ ἐλάβετε, ἢ </em><strong><em><mark>εὐαγγέλιον ἕτερον ὃ οὐκ ἐδέξασθε</mark></em></strong><em>, καλῶς ἀνέχεσθε. &lt;…&gt; οἱ γὰρ τοιοῦτοι ψευδαπόστολοι, ἐργάται δόλιοι, μετασχηματιζόμενοι εἰς ἀποστόλους Χριστοῦ. καὶ οὐ θαῦμα, αὐτὸς γὰρ ὁ Σατανᾶς μετασχηματίζεται εἰς ἄγγελον φωτός· οὐ μέγα οὖν εἰ καὶ οἱ διάκονοι αὐτοῦ μετασχηματίζονται ὡς διάκονοι δικαιοσύνης, ὧν τὸ τέλος ἔσται κατὰ τὰ ἔργα αὐτῶν.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/2kor/11/#L3-4,13-15"><em>Β Κορ 11:3-4,13-15</em></a><em>)</em></p></blockquote><blockquote><p><em>«Καθὼς παρεκάλεσά σε προσμεῖναι ἐν Ἐφέσῳ πορευόμενος εἰς Μακεδονίαν, ἵνα παραγγείλῃς τισὶν </em><strong><em><mark>μὴ ἑτεροδιδασκαλεῖν</mark></em></strong><em> μηδὲ προσέχειν μύθοις καὶ γενεαλογίαις ἀπεράντοις, αἵτινες ἐκζητήσεις παρέχουσιν μᾶλλον ἢ οἰκονομίαν θεοῦ τὴν ἐν πίστει·» (</em><a href="https://bibleox.com/el/gr-lxx-byz/1tim/1/#L3-4"><em>Α Τιμ 1:3-4</em></a><em>)</em></p></blockquote><h2>Η Παράδοση — όχι μόνο κείμενα, αλλά και λόγια που ακούστηκαν</h2><blockquote><p><em>«Καὶ διὰ τοῦτο καὶ ἡμεῖς εὐχαριστοῦμεν τῷ θεῷ ἀδιαλείπτως, ὅτι </em><strong><em>παραλαβόντες <mark>λόγον ἀκοῆς</mark> παρ᾿ ἡμῶν τοῦ θεοῦ</em></strong><em> ἐδέξασθε οὐ λόγον ἀνθρώπων ἀλλὰ καθώς ἐστιν ἀληθῶς λόγον θεοῦ, ὃς καὶ ἐνεργεῖται ἐν ὑμῖν τοῖς πιστεύουσιν.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/1sol/2/#L13"><em>Α Θεσ 2:13</em></a><em>)</em></p></blockquote><blockquote><p><em>«</em><strong><em>ὑποτύπωσιν ἔχε ὑγιαινόντων λόγων ὧν παρ᾿ ἐμοῦ <mark>ἤκουσας</mark></em></strong><em> ἐν πίστει καὶ ἀγάπῃ τῇ ἐν Χριστῷ Ἰησοῦ·» (</em><a href="https://bibleox.com/el/gr-lxx-byz/2tim/1/#L13"><em>Β Τιμ 1:13</em></a><em>)</em></p></blockquote><blockquote><p><em>«καὶ ἃ </em><strong><em><mark>ἤκουσας</mark></em></strong><em> </em><strong><em>παρ᾿ ἐμοῦ</em></strong><em> διὰ πολλῶν μαρτύρων, </em><strong><em>ταῦτα παράθου πιστοῖς</em></strong><em> ἀνθρώποις, οἵτινες ἱκανοὶ ἔσονται καὶ ἑτέρους διδάξαι.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/2tim/2/#L2"><em>Β Τιμ 2:2</em></a><em>)</em></p></blockquote><blockquote><p><em>«ἄρα οὖν, ἀδελφοί, </em><strong><em>στήκετε, καὶ κρατεῖτε τὰς παραδόσεις</em></strong><em> ἃς ἐδιδάχθητε εἴτε διὰ </em><strong><em><mark>λόγου</mark></em></strong><em> εἴτε δι᾿ </em><strong><em>ἐπιστολῆς</em></strong><em> ἡμῶν.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/2sol/2/#L15"><em>Β Θεσ 2:15</em></a><em>)</em></p></blockquote><blockquote><p><em>«ὑμεῖς ὃ </em><strong><em>ἠκούσατε ἀπ᾿ ἀρχῆς</em></strong><em> ἐν ὑμῖν μενέτω· </em><strong><em>ἐὰν ἐν ὑμῖν μείνῃ ὃ ἀπ᾿ ἀρχῆς <mark>ἠκούσατε</mark>, καὶ ὑμεῖς ἐν τῷ υἱῷ καὶ ἐν τῷ πατρὶ μενεῖτε</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/1in/2/#L24"><em>Α Ιω 2:24</em></a><em>)</em></p></blockquote><blockquote><p><em>«Ἐπαινῶ δὲ ὑμᾶς ὅτι </em><strong><em>πάντα μου</em></strong><em> </em><strong><em><mark>μέμνησθε</mark></em></strong><em> καὶ καθὼς παρέδωκα ὑμῖν τὰς παραδόσεις κατέχετε.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/1kor/11/#L2"><em>Α Κορ 11:2</em></a><em>)</em></p></blockquote><blockquote><p><em>«</em><strong><em>μνημόνευε οὖν πῶς εἴληφας καὶ <mark>ἤκουσας</mark>, καὶ τήρει</em></strong><em>, καὶ μετανόησον. ἐὰν οὖν μὴ γρηγορήσῃς, ἥξω ὡς κλέπτης, καὶ οὐ μὴ γνῷς ποίαν ὥραν ἥξω ἐπὶ σέ.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/otkr/3/#L3"><em>Απ 3:3</em></a><em>)</em></p></blockquote><h2>Η αναγκαιότητα της Παράδοσης</h2><h3>Η Αγία Γραφή δεν είναι πηγή όλων των πληροφοριών για τον Ιησού Χριστό</h3><blockquote><p><em>«Πολλὰ μὲν οὖν καὶ ἄλλα σημεῖα ἐποίησεν ὁ Ἰησοῦς ἐνώπιον τῶν μαθητῶν [αὐτοῦ], ἃ </em><strong><em>οὐκ ἔστιν γεγραμμένα ἐν τῷ βιβλίῳ τούτῳ</em></strong><em>· ταῦτα δὲ γέγραπται ἵνα πιστεύσητε ὅτι Ἰησοῦς ἐστιν ὁ Χριστὸς ὁ υἱὸς τοῦ θεοῦ, καὶ ἵνα πιστεύοντες ζωὴν ἔχητε ἐν τῷ ὀνόματι αὐτοῦ.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/in/20/#L30-31"><em>Ιω 20:30-31</em></a><em>)</em></p></blockquote><blockquote><p><em>«</em><strong><em>Ἔστιν δὲ καὶ ἄλλα πολλὰ ἃ ἐποίησεν ὁ Ἰησοῦς</em></strong><em>, ἅτινα ἐὰν γράφηται καθ᾿ ἕν, οὐδ᾿ αὐτὸν οἶμαι τὸν κόσμον χωρῆσαι τὰ γραφόμενα βιβλία.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/in/21/#L25"><em>Ιω 21:25</em></a><em>)</em></p></blockquote><h3>Στη Γραφή δεν περιγράφεται η διδασκαλία περί επιθέσεως των χειρών</h3><p>Σε καμία επιστολή δεν υπάρχει διδασκαλία για το πώς να βαπτίζει κανείς σωστά, πώς να χειροτονεί διακόνους, πρεσβυτέρους, επισκόπους:</p><blockquote><p><em>«Διὸ ἀφέντες τὸν τῆς ἀρχῆς τοῦ Χριστοῦ λόγον ἐπὶ τὴν τελειότητα φερώμεθα, </em><strong><em>μὴ πάλιν θεμέλιον καταβαλλόμενοι</em></strong><em> μετανοίας ἀπὸ νεκρῶν ἔργων, καὶ πίστεως ἐπὶ θεόν, </em><strong><em>βαπτισμῶν διδαχῆς, ἐπιθέσεώς τε χειρῶν</em></strong><em>, ἀναστάσεώς τε νεκρῶν, καὶ κρίματος αἰωνίου.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/evr/6/#L1-2"><em>Εβρ 6:1-2</em></a><em>)</em></p></blockquote><h3>Οι απόστολοι προτιμούσαν την προφορική επικοινωνία</h3><blockquote><p><em>«Πολλὰ ἔχων ὑμῖν γράφειν </em><strong><em>οὐκ ἐβουλήθην διὰ χάρτου καὶ μέλανος</em></strong><em>, ἀλλὰ ἐλπίζω γενέσθαι πρὸς ὑμᾶς καὶ στόμα πρὸς στόμα λαλῆσαι, ἵνα ἡ χαρὰ ἡμῶν πεπληρωμένη ᾖ.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/2in/1/#L12"><em>Β Ιω 1:12</em></a><em>)</em></p></blockquote><blockquote><p><em>«</em><strong><em>Πολλὰ εἶχον γράψαι σοι, ἀλλ᾿ οὐ θέλω διὰ μέλανος καὶ καλάμου σοι γράφειν</em></strong><em>· ἐλπίζω δὲ εὐθέως </em><strong><em>σε ἰδεῖν, καὶ στόμα πρὸς στόμα λαλήσομεν</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/3in/1/#L13-14"><em>Γ Ιω 1:13-14</em></a><em>)</em></p></blockquote><h3>Πρέπει να φυλάσσεται και το προφορικό και το γραπτό κήρυγμα</h3><p>Ο απόστολος Παύλος ζητά να φυλάσσεται η Παράδοση (η διδαχή των αποστόλων), που παραλήφθηκε όχι μόνο στις επιστολές, αλλά και από τα λόγια:</p><blockquote><p><em>«ἄρα οὖν, ἀδελφοί, στήκετε, καὶ κρατεῖτε τὰς παραδόσεις ἃς </em><strong><em>ἐδιδάχθητε</em></strong><em> εἴτε διὰ </em><strong><em>λόγου</em></strong><em> εἴτε δι᾿ </em><strong><em>ἐπιστολῆς</em></strong><em> ἡμῶν.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/2sol/2/#L15"><em>Β Θεσ 2:15</em></a><em>)</em></p></blockquote><blockquote><p><em>«καὶ ἃ </em><strong><em>ἤκουσας</em></strong><em> </em><strong><em>παρ᾿ ἐμοῦ</em></strong><em> διὰ πολλῶν μαρτύρων, </em><strong><em>ταῦτα παράθου πιστοῖς</em></strong><em> ἀνθρώποις, οἵτινες ἱκανοὶ ἔσονται καὶ ἑτέρους διδάξαι.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/2tim/2/#L2"><em>Β Τιμ 2:2</em></a><em>)</em></p></blockquote><h3>Η μεγάλη διάρκεια του προφορικού κηρύγματος των αποστόλων</h3><h4>3 χρόνια</h4><p>Ο απόστολος Παύλος δίδαξε τους πρεσβυτέρους της Ασίας τρία χρόνια, νύχτα και ημέρα:</p><blockquote><p><em>«διὸ γρηγορεῖτε, μνημονεύοντες ὅτι </em><strong><em><mark>τριετίαν</mark> νύκτα καὶ ἡμέραν οὐκ ἐπαυσάμην μετὰ δακρύων νουθετῶν</em></strong><em> ἕνα ἕκαστον.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/act/20/#L31"><em>Πραξ 20:31</em></a><em>)</em></p></blockquote><h4>1,5 χρόνο</h4><p>Ενάμισι χρόνο δίδασκε την κοινότητα στην Κόρινθο:</p><blockquote><p><em>«Μετὰ ταῦτα χωρισθεὶς ἐκ τῶν Ἀθηνῶν ἦλθεν εἰς Κόρινθον. &lt;…&gt; Ἐκάθισεν δὲ </em><strong><em><mark>ἐνιαυτὸν καὶ μῆνας ἓξ</mark> διδάσκων</em></strong><em> ἐν αὐτοῖς τὸν λόγον τοῦ θεοῦ.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/act/18/#L1,11"><em>Πραξ 18:1,11</em></a><em>)</em></p></blockquote><h4>2 χρόνια και 2 μήνες</h4><p>Κήρυξε στην Έφεσο: πρώτα δύο μήνες στη συναγωγή και μετά δύο χρόνια με τους μαθητές στη σχολή:</p><blockquote><p><em>«Εἰσελθὼν δὲ εἰς τὴν συναγωγὴν ἐπαρρησιάζετο </em><strong><em>ἐπὶ μῆνας τρεῖς</em></strong><em> διαλεγόμενος καὶ πείθων περὶ τῆς βασιλείας τοῦ θεοῦ. ὡς δέ τινες ἐσκληρύνοντο καὶ ἠπείθουν κακολογοῦντες τὴν ὁδὸν ἐνώπιον τοῦ πλήθους, ἀποστὰς ἀπ᾿ αὐτῶν </em><strong><em>ἀφώρισεν τοὺς μαθητάς, καθ᾿ ἡμέραν διαλεγόμενος ἐν τῇ σχολῇ Τυράννου</em></strong><em>. τοῦτο δὲ </em><strong><em>ἐγένετο ἐπὶ <mark>ἔτη δύο</mark></em></strong><em>, ὥστε πάντας τοὺς κατοικοῦντας τὴν Ἀσίαν ἀκοῦσαι τὸν λόγον τοῦ κυρίου, Ἰουδαίους τε καὶ Ἕλληνας.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/act/19/#L8-10"><em>Πραξ 19:8-10</em></a><em>)</em></p></blockquote><p>Συνολικά, μόνο ο απόστολος Παύλος κήρυξε τουλάχιστον 30 χρόνια: από τη μεταστροφή του το 33-34 μ.Χ. μέχρι τον θάνατό του το 64-67 μ.Χ.</p><h2>Οι απόστολοι χρησιμοποιούσαν την Παράδοση</h2><p>Ο απόστολος αναφέρει τα ονόματα δύο Αιγυπτίων μάγων, που απουσιάζουν από τη Γραφή:</p><blockquote><p><em>«ὃν τρόπον δὲ </em><strong><em>Ἰάννης καὶ Ἰαμβρῆς</em></strong><em> ἀντέστησαν Μωϋσεῖ, οὕτως καὶ οὗτοι ἀνθίστανται τῇ ἀληθείᾳ, ἄνθρωποι κατεφθαρμένοι τὸν νοῦν, ἀδόκιμοι περὶ τὴν πίστιν·» (</em><a href="https://bibleox.com/el/gr-lxx-byz/2tim/3/#L8"><em>Β Τιμ 3:8</em></a><em>)</em></p></blockquote><p>Ο απόστολος Ιούδας αναφέρει μια διαφωνία που απουσιάζει από τη Γραφή:</p><blockquote><p><em>«ὁ δὲ Μιχαὴλ ὁ ἀρχάγγελος, ὅτε τῷ διαβόλῳ διακρινόμενος διελέγετο </em><strong><em>περὶ τοῦ Μωϋσέως σώματος</em></strong><em>, οὐκ ἐτόλμησεν κρίσιν ἐπενεγκεῖν βλασφημίας, ἀλλὰ εἶπεν, Ἐπιτιμήσαι σοι κύριος.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/iud/1/#L9"><em>Ιούδα 1:9</em></a><em>)</em></p></blockquote><p>Για τα λόγια του Ενώχ, που απουσιάζουν από τη Γραφή:</p><blockquote><p><em>«</em><strong><em>Προεφήτευσεν δὲ καὶ τούτοις ἕβδομος ἀπὸ Ἀδὰμ Ἑνὼχ</em></strong><em> λέγων, Ἰδοὺ ἦλθεν κύριος ἐν ἁγίαις μυριάσιν αὐτοῦ,» (</em><a href="https://bibleox.com/el/gr-lxx-byz/iud/1/#L14"><em>Ιούδα 1:14</em></a><em>)</em></p></blockquote><p>Ο απόστολος Παύλος μιλά για τον προφήτη Ησαΐα, ο οποίος πριονίστηκε, κρυμμένος σε κοιλότητα δέντρου:</p><blockquote><p>«ἐλιθάσθησαν, <strong>ἐπρίσθησαν</strong>, ἐν φόνῳ μαχαίρης ἀπέθανον, περιῆλθον ἐν μηλωταῖς, ἐν αἰγείοις δέρμασιν, ὑστερούμενοι, θλιβόμενοι, κακουχούμενοι,» (<a href="https://bibleox.com/el/gr-lxx-byz/evr/11/#L37">Εβρ 11:37</a>)</p></blockquote><p>Ο ευαγγελιστής Λουκάς γράφει το Ευαγγέλιο με βάση λόγια που άκουσε από αυτόπτες μάρτυρες, δηλαδή γράφει παράδοση:</p><blockquote><p><em>«Ἐπειδήπερ πολλοὶ ἐπεχείρησαν ἀνατάξασθαι διήγησιν περὶ τῶν πεπληροφορημένων ἐν ἡμῖν πραγμάτων, </em><strong><em>καθὼς παρέδοσαν ἡμῖν οἱ ἀπ᾿ ἀρχῆς αὐτόπται καὶ ὑπηρέται γενόμενοι τοῦ λόγου</em></strong><em>, ἔδοξε κἀμοὶ παρηκολουθηκότι ἄνωθεν πᾶσιν ἀκριβῶς καθεξῆς σοι γράψαι, κράτιστε Θεόφιλε,» (</em><a href="https://bibleox.com/el/gr-lxx-byz/lk/1/#L1-3"><em>Λκ 1:1-3</em></a><em>)</em></p></blockquote><h3>Αναφέρουν πληροφορίες που απουσιάζουν από το Ευαγγέλιο</h3><p>Ο απόστολος Παύλος επισημαίνει στη συνομιλία με τους Εφεσίους ποιμένες μια διδασκαλία του Χριστού Σωτήρα που απουσιάζει από το Ευαγγέλιο:</p><blockquote><p><em>«πάντα ὑπέδειξα ὑμῖν ὅτι οὕτως κοπιῶντας δεῖ ἀντιλαμβάνεσθαι τῶν ἀσθενούντων, μνημονεύειν τε τῶν λόγων τοῦ κυρίου Ἰησοῦ ὅτι </em><strong><em>αὐτὸς εἶπεν, Μακάριόν ἐστιν μᾶλλον διδόναι ἢ λαμβάνειν</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/act/20/#L35"><em>Πραξ 20:35</em></a><em>)</em></p></blockquote><p>Αναφέρει την εμφάνιση του αναστημένου Χριστού σε μεγάλο αριθμό ανθρώπων, κάτι που επίσης δεν είναι γραμμένο στο Ευαγγέλιο:</p><blockquote><p><em>«ἔπειτα </em><strong><em>ὤφθη ἐπάνω πεντακοσίοις ἀδελφοῖς</em></strong><em> ἐφάπαξ, ἐξ ὧν οἱ πλείονες μένουσιν ἕως ἄρτι, τινὲς δὲ ἐκοιμήθησαν· ἔπειτα ὤφθη Ἰακώβῳ, εἶτα τοῖς ἀποστόλοις πᾶσιν·» (</em><a href="https://bibleox.com/el/gr-lxx-byz/1kor/15/#L6-7"><em>Α Κορ 15:6-7</em></a><em>)</em></p></blockquote><h2>Η σημασία της Παράδοσης</h2><p>Η εσφαλμένη διδασκαλία δεν οδηγεί στον Θεό:</p><blockquote><p><em>«πᾶς </em><strong><em>ὁ προάγων καὶ μὴ μένων ἐν τῇ διδαχῇ τοῦ Χριστοῦ θεὸν οὐκ ἔχει</em></strong><em>· ὁ μένων ἐν τῇ διδαχῇ, οὗτος καὶ τὸν πατέρα καὶ τὸν υἱὸν ἔχει.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/2in/1/#L9"><em>Β Ιω 1:9</em></a><em>)</em></p></blockquote><p>Οι αιρέσεις (οι ψευδείς διδασκαλίες) δεν κληρονομούν τη Βασιλεία του Θεού:</p><blockquote><p><em>«εἰδωλολατρία, φαρμακεία, ἔχθραι, ἔρις, ζῆλος, θυμοί, ἐριθείαι, διχοστασίαι, </em><strong><em>αἱρέσεις</em></strong><em>, φθόνοι, μέθαι, κῶμοι, καὶ τὰ ὅμοια τούτοις, ἃ προλέγω ὑμῖν καθὼς προεῖπον ὅτι οἱ τὰ τοιαῦτα πράσσοντες </em><strong><em>βασιλείαν θεοῦ οὐ κληρονομήσουσιν</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/gal/5/#L20-21"><em>Γαλ 5:20-21</em></a><em>)</em></p></blockquote><h2>Να απομακρύνεστε από εκείνους που εισάγουν νέα διδασκαλία</h2><blockquote><p><em>«</em><strong><em>αἱρετικὸν ἄνθρωπον</em></strong><em> μετὰ μίαν καὶ δευτέραν νουθεσίαν </em><strong><em><mark>παραιτοῦ</mark></em></strong><em>,» (</em><a href="https://bibleox.com/el/gr-lxx-byz/tit/3/#L10"><em>Τιτ 3:10</em></a><em>)</em></p></blockquote><blockquote><p><em>«</em><strong><em>εἴ τις ἑτεροδιδασκαλεῖ</em></strong><em> καὶ μὴ προσέρχεται ὑγιαίνουσιν λόγοις, τοῖς τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, καὶ τῇ κατ᾿ εὐσέβειαν διδασκαλίᾳ, </em><strong><em>τετύφωται, μηδὲν ἐπιστάμενος, ἀλλὰ νοσῶν περὶ ζητήσεις καὶ λογομαχίας</em></strong><em>, ἐξ ὧν γίνεται φθόνος, ἔρις, βλασφημίαι, ὑπόνοιαι πονηραί, διαπαρατριβαὶ διεφθαρμένων ἀνθρώπων τὸν νοῦν καὶ ἀπεστερημένων τῆς ἀληθείας, </em><strong><em>νομιζόντων <mark>πορισμὸν</mark> εἶναι τὴν εὐσέβειαν</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/1tim/6/#L3-5"><em>Α Τιμ 6:3-5</em></a><em>)</em> — στο κείμενο που παραθέτουμε η φράση “ἀφίστασο ἀπὸ τῶν τοιούτων” απουσιάζει.</p></blockquote><blockquote><p><em>«Ὦ Τιμόθεε, </em><strong><em>τὴν παραθήκην φύλαξον</em></strong><em>, </em><strong><em><mark>ἐκτρεπόμενος</mark> τὰς βεβήλους κενοφωνίας καὶ ἀντιθέσεις τῆς ψευδωνύμου γνώσεως</em></strong><em>, ἥν τινες ἐπαγγελλόμενοι περὶ τὴν πίστιν ἠστόχησαν. Ἡ χάρις μεθ᾿ ὑμῶν.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/1tim/6/#L20-21"><em>Α Τιμ 6:20-21</em></a><em>)</em></p></blockquote><blockquote><p><em>«Παραγγέλλομεν δὲ ὑμῖν, ἀδελφοί, ἐν ὀνόματι τοῦ κυρίου Ἰησοῦ Χριστοῦ, </em><strong><em><mark>στέλλεσθαι</mark> ὑμᾶς ἀπὸ παντὸς ἀδελφοῦ ἀτάκτως περιπατοῦντος</em></strong><em> καὶ </em><strong><em>μὴ κατὰ τὴν παράδοσιν</em></strong><em> ἣν παρελάβοσαν παρ᾿ ἡμῶν.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/2sol/3/#L6"><em>Β Θεσ 3:6</em></a><em>)</em></p></blockquote><blockquote><p><em>«Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, </em><strong><em>σκοπεῖν τοὺς τὰς διχοστασίας καὶ τὰ σκάνδαλα παρὰ τὴν διδαχὴν ἣν ὑμεῖς ἐμάθετε ποιοῦντας, καὶ <mark>ἐκκλίνετε</mark> ἀπ᾿ αὐτῶν</em></strong><em>· οἱ γὰρ τοιοῦτοι τῷ κυρίῳ ἡμῶν Χριστῷ οὐ δουλεύουσιν ἀλλὰ τῇ ἑαυτῶν κοιλίᾳ, καὶ διὰ τῆς χρηστολογίας καὶ εὐλογίας ἐξαπατῶσιν τὰς καρδίας τῶν ἀκάκων.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/rim/16/#L17-18"><em>Ρωμ 16:17-18</em></a><em>)</em></p></blockquote><blockquote><p><em>«εἴ τις ἔρχεται πρὸς ὑμᾶς καὶ ταύτην τὴν διδαχὴν οὐ φέρει, </em><strong><em><mark>μὴ λαμβάνετε</mark> αὐτὸν εἰς οἰκίαν</em></strong><em> καὶ χαίρειν αὐτῷ μὴ λέγετε· ὁ λέγων γὰρ αὐτῷ χαίρειν κοινωνεῖ τοῖς ἔργοις αὐτοῦ τοῖς πονηροῖς.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/2in/1/#L10-11"><em>Β Ιω 1:10-11</em></a><em>)</em></p></blockquote><blockquote><p><em>«ἀλλὰ καὶ ἐὰν ἡμεῖς ἢ ἄγγελος ἐξ οὐρανοῦ [ὑμῖν] εὐαγγελίζηται </em><strong><em>παρ᾿ ὃ εὐηγγελισάμεθα ὑμῖν, ἀνάθεμα ἔστω</em></strong><em>. ὡς προειρήκαμεν, καὶ ἄρτι πάλιν λέγω, </em><strong><em>εἴ τις ὑμᾶς εὐαγγελίζεται παρ᾿ ὃ παρελάβετε, <mark>ἀνάθεμα</mark> ἔστω</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/gal/1/#L8-9"><em>Γαλ 1:8-9</em></a><em>)</em></p></blockquote><p><strong>Ανάθεμα</strong> — αποκοπή από την Εκκλησία.</p><h2>Η αναγκαιότητα να τιμούμε και να ακολουθούμε τους αγίους</h2><blockquote><p><em>«</em><strong><em><mark>Μνημονεύετε</mark> τῶν ἡγουμένων</em></strong><em> ὑμῶν, οἵτινες ἐλάλησαν ὑμῖν τὸν λόγον τοῦ θεοῦ, ὧν ἀναθεωροῦντες τὴν ἔκβασιν τῆς ἀναστροφῆς </em><strong><em><mark>μιμεῖσθε τὴν πίστιν</mark></em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/evr/13/#L7">Εβρ 13:7</a>)</p></blockquote><blockquote><p><em>«παρακαλῶ οὖν ὑμᾶς, </em><strong><em><mark>μιμηταί</mark> μου γίνεσθε</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/1kor/4/#L16">Α Κορ 4:16</a>) — στο βυζαντινό κείμενο λείπει η φράση “καθὼς κἀγὼ Χριστοῦ” (βρίσκεται στο Α Κορ 11:1).</p></blockquote><blockquote><p><em>«</em><strong><em><mark>Συμμιμηταί μου γίνεσθε, ἀδελφοί</mark>, καὶ <mark>σκοπεῖτε τοὺς οὕτω περιπατοῦντας καθὼς ἔχετε τύπον ἡμᾶς</mark></em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/fil/3/#L17"><em>Φιλ 3:17</em></a><em>)</em></p></blockquote><p>Περισσότερα για την τιμή των αγίων: <a href="https://bibleox.com/el/el/w/Η_τιμή_των_αγίων">η τιμή των αγίων στη Βίβλο</a>.</p><h2>Κριτική</h2><h3>Απευθυνθείτε στον νόμο και στην αποκάλυψη (Ησ 8:20)</h3><p>Προς υπεράσπιση της Sola Scriptura παραθέτουν την εξής περικοπή από την Παλαιά Διαθήκη: (Στους Ο΄ ο στίχος 20 διαβάζεται διαφορετικά: ο λόγος του υποτίτλου «απευθυνθείτε στον νόμο και στην αποκάλυψη» ανήκει στη ρωσική συνοδική μετάφραση, ενώ εδώ τονίζεται η φράση για τον νόμο και τον λόγο.)</p><blockquote><p>«<strong>καὶ ἐὰν εἴπωσιν πρὸς ὑμᾶς Ζητήσατε</strong> <strong>τοὺς ἀπὸ τῆς γῆς φωνοῦντας καὶ τοὺς ἐγγαστριμύθους, τοὺς κενολογοῦντας οἳ ἐκ τῆς κοιλίας φωνοῦσιν</strong>, οὐκ ἔθνος πρὸς θεὸν αὐτοῦ; τί ἐκζητοῦσιν περὶ τῶν ζώντων τοὺς νεκρούς; <strong>νόμον γὰρ εἰς βοήθειαν ἔδωκεν, ἵνα εἴπωσιν οὐχ ὡς τὸ ῥῆμα τοῦτο, περὶ οὗ οὐκ ἔστιν δῶρα δοῦναι περὶ αὐτοῦ</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/is/8/#L19-20">Ησ 8:19-20</a>) [4]</p></blockquote><ol><li><p>Εδώ δεν λέγεται τίποτα για την υπεροχή της Γραφής έναντι της Παράδοσης. Περιττό να πούμε ότι <strong>μεταξύ των μάγων και της Γραφής πρέπει να επιλέξει κανείς τη Γραφή</strong>. Σε αυτές τις γραμμές γίνεται λόγος για τη σύγκριση της Πεντατεύχου του Μωυσή (της Τορά) και της Αποκάλυψης (των λόγων των προφητών) με τα λόγια των μάγων και των μέντιουμ, που δεν πρέπει καθόλου να υπάρχουν στον λαό (<a href="https://bibleox.com/el/gr-lxx-byz/vtor/18/#L9-14">Δτ 18:9-14</a>). Ο προφήτης Ησαΐας προτείνει να χρησιμοποιείται η Τορά και τα προφητικά λόγια ως εξωτερικό μέσο για τον έλεγχο των μάγων, υποδεικνύοντας στον λαό τη διαφορά ανάμεσα σε ό,τι λένε οι μάγοι και σε ό,τι λέει ο Θεός.</p></li></ol><ol start="2"><li><p>Επιπλέον, στους χρόνους της Παλαιάς Διαθήκης η Γραφή κατ’ αρχήν δεν μπορούσε να αποσπαστεί από την Παράδοση. Χωρίς την Παράδοση όχι μόνο δεν είναι δυνατό να την κατανοήσει κανείς σωστά, αλλά ούτε να τη διαβάσει σωστά, επειδή είναι γραμμένη μόνο με σύμφωνα γράμματα (<a href="https://bibleox.com/el/el/w/Οι_Ευαγγελιστές_χρησιμοποιούν_τους_Ο΄">περισσότερα</a>). Μη γνωρίζοντας την ανάγνωση, η ίδια λέξη μπορεί να διαβαστεί με διαφορετικούς τρόπους. Για να διαβάζει κανείς τις λέξεις σωστά, πρέπει να βρίσκεται στην <strong>παράδοση</strong> της ανάγνωσης, και αυτή μεταδιδόταν ως Παράδοση από τους προγόνους στους απογόνους. Γι’ αυτό κάθε λόγος για τη Γραφή είναι αχώριστος από την Παράδοση.</p></li><li><p>Αξίζει να υπενθυμίσουμε στους αντιπάλους τη δική τους θέση — η «Sola scriptura» επιμένει στη λέξη «Sola» (μόνο), ότι μόνο η Γραφή είναι η ύψιστη αυθεντία. Ωστόσο, στην παρατιθέμενη περικοπή δεν υπάρχει αυτή η ίδια η αποκλειστικότητα της αυθεντίας της Γραφής, δεν υπάρχει η λέξη «μόνο» (ή κάτι παρόμοιο), που επιθυμούν να βλέπουν οι οπαδοί της «<strong>μόνο</strong> Γραφής». Αν όμως την προσθέτει κανείς εδώ μόνο με το επιχείρημα ότι δεν αναφέρεται ρητά η Παράδοση, τότε αξίζει να είναι συνεπής και να αναγνωρίσει ότι σε άλλες ανάλογες περικοπές προτείνεται να οικοδομείται η πίστη μόνο στην Παράδοση, αφού δεν αναφέρεται η Γραφή:</p></li></ol><blockquote><p>«<strong>ὑποτύπωσιν</strong> <strong>ἔχε ὑγιαινόντων λόγων ὧν παρ᾿ ἐμοῦ <mark>ἤκουσας</mark></strong> ἐν πίστει καὶ ἀγάπῃ τῇ ἐν Χριστῷ Ἰησοῦ·» (<a href="https://bibleox.com/el/gr-lxx-byz/2tim/1/#L13">Β Τιμ 1:13</a>)</p></blockquote><blockquote><p><em>«καὶ ἃ </em><strong><em><mark>ἤκουσας</mark> παρ᾿ ἐμοῦ διὰ πολλῶν μαρτύρων</em></strong><em>, </em><strong><em><mark>ταῦτα παράθου πιστοῖς</mark></em></strong><em> ἀνθρώποις, οἵτινες ἱκανοὶ ἔσονται καὶ ἑτέρους διδάξαι.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/2tim/2/#L2"><em>Β Τιμ 2:2</em></a><em>)</em></p></blockquote><p>Η ακολουθία της Παράδοσης που ακούστηκε επιτρέπει όχι μόνο να διακρίνει κανείς το σωστό από το λανθασμένο, αλλά απείρως περισσότερο — επιτρέπει να μένει κανείς στον Θεό:</p><blockquote><p><em>«ὑμεῖς ὃ </em><strong><em><mark>ἠκούσατε</mark> ἀπ᾿ ἀρχῆς</em></strong><em> </em><strong><em>ἐν ὑμῖν μενέτω</em></strong><em>· </em><strong><em>ἐὰν ἐν ὑμῖν μείνῃ ὃ ἀπ᾿ ἀρχῆς <mark>ἠκούσατε</mark>, καὶ ὑμεῖς ἐν τῷ υἱῷ καὶ ἐν τῷ πατρὶ μενεῖτε</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/1in/2/#L24"><em>Α Ιω 2:24</em></a><em>)</em></p></blockquote><p>Να φυλάσσετε ό,τι ακούσατε καλεί και ο ίδιος ο Κύριος Ιησούς Χριστός, όταν σχεδόν όλη η Καινή Διαθήκη είχε ήδη γραφτεί:</p><blockquote><p><em>«</em><strong><em>μνημόνευε οὖν πῶς εἴληφας καὶ <mark>ἤκουσας</mark>, καὶ τήρει</em></strong><em>, καὶ μετανόησον. ἐὰν οὖν μὴ γρηγορήσῃς, ἥξω ὡς κλέπτης, καὶ οὐ μὴ γνῷς ποίαν ὥραν ἥξω ἐπὶ σέ.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/otkr/3/#L3"><em>Απ 3:3</em></a><em>)</em></p></blockquote><p>Μήπως αυτό σημαίνει ότι ο Κύριος και οι απόστολοι διδάσκουν «μόνο την Παράδοση»; Άλλωστε, έχοντας γράψει αυτήν την ίδια τη Γραφή, εδώ δεν αναφέρουν καν τη Γραφή, αλλά απαιτούν να ακολουθεί κανείς την Παράδοση.</p><p>Παίρνοντας μόνο αυτούς τους στίχους, οι αντίπαλοι της Εκκλησίας θα μπορούσαν με τον ίδιο ακριβώς τρόπο να επινοήσουν και το αντίθετο άκρο — τη θέση «μόνο η Παράδοση». Αλλά επειδή δεν παρέλαβαν την Παράδοση των αποστόλων, εμφανιζόμενοι XV αιώνες (και περισσότερο) μετά τους αποστόλους, μη έχοντας σκοπό να υπερασπιστούν την Παράδοση, δεν εξάγουν τέτοια άκρα περί της Παράδοσης. Η Εκκλησία όμως, έχοντας παραλάβει από τους αποστόλους και την Παράδοση και τη Γραφή, δεν απορρίπτει ούτε το ένα ούτε το άλλο, και δεν απορρίπτει τις εντολές των αποστόλων περί φυλάξεως της προφορικής Παράδοσης, θεωρώντας εξίσου αληθινά και τη Γραφή και την Παράδοση.</p><h3>Να μη φρονείτε υπέρ το γεγραμμένον (Α Κορ 4:6)</h3><blockquote><p>«Ταῦτα δέ, ἀδελφοί, μετεσχημάτισα εἰς ἐμαυτὸν καὶ Ἀπολλῶν δι᾿ ὑμᾶς, ἵνα ἐν ἡμῖν <strong>μάθητε</strong> τὸ <strong>Μὴ ὑπὲρ ἃ γέγραπται</strong>, ἵνα μὴ εἷς ὑπὲρ τοῦ ἑνὸς φυσιοῦσθε κατὰ τοῦ ἑτέρου.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/4/#L6">Α Κορ 4:6</a>)</p></blockquote><p>Εδώ γίνεται λόγος για κάποιο γραπτό κείμενο, με βάση το οποίο πρέπει να κατανοήσει κανείς ότι δεν πρέπει να υπερηφανεύεται ο ένας έναντι του άλλου. Για ποιο κείμενο γίνεται λόγος; Για το προηγούμενο κεφάλαιο της ίδιας επιστολής, στο οποίο διδασκόταν μάθημα ταπεινοφροσύνης. Ο απόστολος προτείνει <strong>να μάθουν από αυτούς να μην υπερηφανεύονται</strong> ο ένας έναντι του άλλου, μη φρονώντας υπέρ το γεγραμμένο μόλις πριν.</p><p>Αυτή η επιστολή γράφτηκε εξαιτίας της διαίρεσης που προέκυψε στην κοινότητα της Κορίνθου. Σε όλο το 2ο κεφάλαιο ο απόστολος μείωνε τη σημασία του εαυτού του και του Απολλώ, μεγαλύνοντας τον Χριστό, για να εμποδίσει τις διαιρέσεις στην Κόρινθο σε παυλιανούς και απολλωνιανούς (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/3/#L4-7">Α Κορ 3:4-7</a>), να εμποδίσει τις διαιρέσεις της Εκκλησίας σε παρατάξεις. Σε εκείνους που διαιρούνταν δεν διέφερε η διδασκαλία (αλλιώς ο απόστολος θα μιλούσε για διδασκαλία), αλλά η στάση ο ένας προς τον άλλο. Διαιρούνταν με το όνομα του εκκλησιαστικού διδασκάλου. Σαν κάθε ένας στην Εκκλησία να έπρεπε να επικοινωνεί μόνο με όσους είχαν μαθητεύσει στον ίδιο διδάσκαλο, και να απορρίπτει τους μαθητές άλλων εκκλησιαστικών διδασκάλων. Για να διορθώσει αυτή τη λανθασμένη σκέψη, ο απόστολος ταπείνωσε τη σημασία εκείνων των ονομάτων με τα οποία σχηματίστηκαν οι διαιρέσεις, δηλαδή ταπείνωσε τον εαυτό του και τον Απολλώ, υψώνοντας τον Χριστό.</p><p>Λίγο πιο κάτω, συνοψίζοντας τα λεχθέντα, ο απόστολος λέει το ίδιο με άλλα λόγια, καλώντας να ακολουθήσουν όχι πια το γραμμένο, αλλά τον ίδιο:</p><blockquote><p>«παρακαλῶ <strong><mark>οὖν</mark> ὑμᾶς, <mark>μιμηταί μου γίνεσθε</mark></strong>. διὰ τοῦτο ἔπεμψα ὑμῖν Τιμόθεον, ὅς ἐστίν μου τέκνον ἀγαπητὸν καὶ πιστὸν ἐν κυρίῳ, ὃς ὑμᾶς ἀναμνήσει τὰς ὁδούς μου τὰς ἐν Χριστῷ [Ἰησοῦ], καθὼς πανταχοῦ ἐν πάσῃ ἐκκλησίᾳ διδάσκω.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/4/#L16-17">Α Κορ 4:16-17</a>)</p></blockquote><p>Έτσι, στην περικοπή ο λόγος είναι για το ότι οι χριστιανοί <strong>να μη φρονούν <u>για τον εαυτό τους</u> υπέρ το γραμμένο αποστολικό παράδειγμα</strong>, και, ακολουθώντας το κάλεσμα για ταπεινοφροσύνη, να μην υπερηφανεύονται ο ένας έναντι του άλλου και να μη διαιρούνται.</p><h3>Να μην ακούτε ούτε απόστολο ούτε άγγελο, αν διδάσκουν διαφορετικά;</h3><p>Από τους οπαδούς της Sola Scriptura μπορεί να ακούσει κανείς το επιχείρημα ότι ο απόστολος θέτει τα δικά του γράμματα πάνω από τον εαυτό του και ακόμη και πάνω από τον άγγελο του Θεού. Αναφέρονται σε αυτή τη γραμμή:</p><blockquote><p><em>«ἀλλὰ καὶ </em><strong><em>ἐὰν ἡμεῖς ἢ ἄγγελος ἐξ οὐρανοῦ [ὑμῖν] εὐαγγελίζηται παρ᾿ ὃ εὐηγγελισάμεθα ὑμῖν</em></strong><em>, </em><strong><em>ἀνάθεμα ἔστω</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/gal/1/#L8">Γαλ 1:8</a>)</p></blockquote><p>Ο απόστολος εδώ δεν μιλά για τον εαυτό του, αλλά έχει υπόψη ψευδείς επιστολές που στέλνονταν στις κοινότητες σαν να ήταν από το όνομα των αποστόλων:</p><blockquote><p>«εἰς τὸ <strong>μὴ ταχέως σαλευθῆναι ὑμᾶς ἀπὸ τοῦ νοὸς</strong> μηδὲ θροεῖσθαι μήτε διὰ πνεύματος μήτε διὰ λόγου <strong>μήτε δι᾿ ἐπιστολῆς ὡς δι᾿ ἡμῶν</strong>, ὡς ὅτι ἐνέστηκεν ἡ ἡμέρα τοῦ κυρίου. μή τις ὑμᾶς ἐξαπατήσῃ κατὰ μηδένα τρόπον· ὅτι ἐὰν μὴ ἔλθῃ ἡ ἀποστασία πρῶτον καὶ ἀποκαλυφθῇ ὁ ἄνθρωπος τῆς ἀνομίας, ὁ υἱὸς τῆς ἀπωλείας,» (<a href="https://bibleox.com/el/gr-lxx-byz/2sol/2/#L2-3">Β Θεσ 2:2-3</a>)</p></blockquote><p>Διδάσκει να μην ακούν ούτε αποκαλύψεις ανθρώπων που ψευδώς παριστάνουν ότι μιλούν με αγγελικές γλώσσες και δήθεν προφητεύουν από αυτούς.</p><p>Πώς να προσδιορίσει κανείς ότι η επιστολή δεν είναι από τον απόστολο, και η αποκάλυψη όχι από άγγελο; Σε αυτές ανακοινώνεται άλλη πίστη. Όχι εκείνη που κάποτε παρέδωσαν οι απόστολοι. Φυσικά, ο απόστολος δεν προσπαθεί να αφαιρέσει την εξουσία που έδωσε ο Θεός στους αποστόλους. Οι προηγούμενες γραμμές, και γενικά όλη η επιστολή, είναι γραμμένες κατά των διδασκάλων που είχαν εμφανιστεί και παρέσυραν τους Γαλάτες στον ιουδαϊσμό.</p><blockquote><p>«Ὦ ἀνόητοι <strong>Γαλάται, τίς ὑμᾶς ἐβάσκανεν</strong>, οἷς κατ᾿ ὀφθαλμοὺς Ἰησοῦς Χριστὸς προεγράφη ἐσταυρωμένος;» (<a href="https://bibleox.com/el/gr-lxx-byz/gal/3/#L1">Γαλ 3:1</a>)</p></blockquote><blockquote><p>«<strong>φοβοῦμαι</strong> ὑμᾶς <strong>μή πως εἰκῇ κεκοπίακα</strong> εἰς ὑμᾶς.» (<a href="https://bibleox.com/el/gr-lxx-byz/gal/4/#L11">Γαλ 4:11</a>)</p></blockquote><blockquote><p>«Ἐτρέχετε καλῶς· <strong>τίς ὑμᾶς ἐνέκοψεν</strong> [τῇ] ἀληθείᾳ μὴ πείθεσθαι; &lt;…&gt; <strong>ὄφελον καὶ ἀποκόψονται οἱ ἀναστατοῦντες ὑμᾶς</strong>.» (<a href="https://bibleox.com/el/gr-lxx-byz/gal/5/#L7,12">Γαλ 5:7,12</a>)</p></blockquote><p>Η πρόθεση του αποστόλου είναι να προστατεύσει το ποίμνιό του από τους ψευδοδιδασκάλους, και όχι από τον εαυτό του, πολύ περισσότερο όχι από τους αγγέλους του Θεού. Οι άγιοι άγγελοι δεν μπορούν να παρασύρουν από τον αληθινό δρόμο την Εκκλησία του Θεού, την οποία υπηρετούν. Ο απόστολος απλώς καθιστά σαφές ότι πρέπει να κρατιέται εκείνη η πίστη που κάποτε παραδόθηκε από αυτόν, και όποιος θα διδάσκει διαφορετικά, ακόμη κι αν παρουσιαστεί ως απόστολος ή προσποιηθεί τον άγγελο του Θεού, δεν αξίζει να γίνει δεκτός.</p><hr><p>Σε αυτή την περικοπή υπάρχουν τρία νοηματικά σκαλοπάτια:</p><ol><li><p><strong>Αυτό</strong> <strong>απεικόνισε</strong> με άλλη μορφή (μετεσχημάτισα) για τον εαυτό μου και τον Απολλώ για χάρη σας, <strong>ώστε</strong> <strong>(ίνα),</strong></p></li><li><p><strong>Να μάθετε από εμάς</strong> να μη σκέφτεστε [για τον εαυτό σας] υπέρ το γεγραμμένο [στο προηγούμενο κεφάλαιο], <strong>ώστε (ίνα),</strong></p></li><li><p><strong>να μην υπερηφανεύεστε</strong> ο ένας έναντι του άλλου.</p></li></ol><p>Πού απεικόνισε ο απόστολος τον εαυτό του και τον Απολλώ ως μη υπερηφανευόμενους έναντι των άλλων αδελφών; Στο προηγούμενο κεφάλαιο:</p><blockquote><p>«ὅταν γὰρ λέγῃ τις, Ἐγὼ μέν εἰμι Παύλου, ἕτερος δέ, Ἐγὼ Ἀπολλῶ, οὐκ ἄνθρωποί ἐστε; <strong>τί οὖν ἐστιν Ἀπολλῶς; τί δέ ἐστιν Παῦλος; διάκονοι</strong> δι᾿ ὧν ἐπιστεύσατε, καὶ ἑκάστῳ ὡς ὁ κύριος ἔδωκεν. <strong><mark>ἐγὼ ἐφύτευσα, Ἀπολλῶς ἐπότισεν</mark>, ἀλλὰ ὁ θεὸς ηὔξανεν· ὥστε οὔτε <mark>ὁ φυτεύων ἐστίν τι οὔτε ὁ ποτίζων</mark></strong>, ἀλλ᾿ ὁ αὐξάνων θεός.» (<a href="https://bibleox.com/el/gr-lxx-byz/1kor/3/#L4-7">Α Κορ 3:4-7</a>)</p></blockquote><p>Παρόμοια ο απόστολος λέει σε άλλη επιστολή, καλώντας σε ομοψυχία:</p><blockquote><p>«<strong>τὸ αὐτὸ εἰς ἀλλήλους φρονοῦντες</strong>, <strong><mark>μὴ τὰ ὑψηλὰ φρονοῦντες</mark></strong> ἀλλὰ <strong>τοῖς ταπεινοῖς συναπαγόμενοι</strong>. μὴ γίνεσθε φρόνιμοι παρ᾿ ἑαυτοῖς.» (<a href="https://bibleox.com/el/gr-lxx-byz/rim/12/#L16">Ρωμ 12:16</a>)</p></blockquote><p>Το ίδιο δίδασκε και ο Σωτήρας:</p><ul><li><p>«Όποιος υψώνει τον εαυτό του θα ταπεινωθεί, και όποιος ταπεινώνει τον εαυτό του θα υψωθεί» (<a href="https://bibleox.com/el/gr-lxx-byz/mf/23/#L12">Μτ 23:12</a>)</p></li><li><p>«Όποιος θέλει να γίνει μεγάλος ανάμεσά σας, ας γίνει υπηρέτης σας» (<a href="https://bibleox.com/el/gr-lxx-byz/mk/10/#L43">Μκ 10:43</a>)</p></li></ul><p>Έτσι, ο απόστολος καλεί απλώς σε ταπεινοφροσύνη και ενότητα, παραπέμποντας στο γραμμένο για τον εαυτό του και τον Απολλώ νωρίτερα.</p><p>Στην ίδια επιστολή ο απόστολος επαινεί τους Κορινθίους επειδή φυλάσσουν την παράδοση:</p><blockquote><p><em>«Ἐπαινῶ δὲ ὑμᾶς ὅτι </em><strong><em>πάντα μου μέμνησθε καὶ <mark>καθὼς παρέδωκα ὑμῖν</mark> <mark>τὰς παραδόσεις κατέχετε</mark></em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/1kor/11/#L2"><em>Α Κορ 11:2</em></a><em>)</em></p></blockquote><p>Και λέει ότι οι Κορίνθιοι σώζονται, αν μόνο κρατούν ό,τι παραδόθηκε όπως ακριβώς κηρύχθηκε:</p><blockquote><p><em>«Γνωρίζω δὲ ὑμῖν, ἀδελφοί, τὸ εὐαγγέλιον ὃ εὐηγγελισάμην ὑμῖν, ὃ καὶ παρελάβετε, ἐν ᾧ καὶ ἑστήκατε, δι᾿ οὗ καὶ σῴζεσθε, </em><strong><em><mark>τίνι λόγῳ εὐηγγελισάμην</mark></em></strong><em> ὑμῖν </em><strong><em><mark>εἰ κατέχετε</mark></em></strong><em>, ἐκτὸς εἰ μὴ εἰκῇ ἐπιστεύσατε.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/1kor/15/#L1-2"><em>Α Κορ 15:1-2</em></a><em>)</em></p></blockquote><p>Υπάρχουν επίσης και πολλές άλλες δηλώσεις για την προφορική παράδοση, που έχουν ήδη αναφερθεί. Θα παραθέσουμε μερικές από αυτές:</p><blockquote><p>«<strong>ὑποτύπωσιν ἔχε ὑγιαινόντων λόγων ὧν παρ᾿ ἐμοῦ <u>ἤκουσας</u></strong> ἐν πίστει καὶ ἀγάπῃ τῇ ἐν Χριστῷ Ἰησοῦ·» (<a href="https://bibleox.com/el/gr-lxx-byz/2tim/1/#L13">Β Τιμ 1:13</a>)</p></blockquote><blockquote><p><em>«καὶ ἃ </em><strong><em><u>ἤκουσας</u> παρ᾿ ἐμοῦ διὰ πολλῶν μαρτύρων</em></strong><em>, </em><strong><em>ταῦτα παράθου πιστοῖς</em></strong><em> ἀνθρώποις, οἵτινες ἱκανοὶ ἔσονται καὶ ἑτέρους διδάξαι.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/2tim/2/#L2"><em>Β Τιμ 2:2</em></a><em>)</em></p></blockquote><blockquote><p><em>«ὑμεῖς ὃ </em><strong><em><u>ἠκούσατε</u> ἀπ᾿ ἀρχῆς</em></strong><em> </em><strong><em>ἐν ὑμῖν μενέτω</em></strong><em>· </em><strong><em>ἐὰν ἐν ὑμῖν μείνῃ ὃ ἀπ᾿ ἀρχῆς <u>ἠκούσατε</u>, καὶ ὑμεῖς ἐν τῷ υἱῷ καὶ ἐν τῷ πατρὶ μενεῖτε</em></strong><em>.» (</em><a href="https://bibleox.com/el/gr-lxx-byz/1in/2/#L24"><em>Α Ιω 2:24</em></a><em>)</em></p></blockquote><h2>Συμπέρασμα</h2><p>Για την υπεράσπιση της θέσης «Μόνο η Γραφή» χρησιμοποιείται η εξής τακτική: μη έχοντας σαφείς περικοπές περί Sola Scriptura, να δείχνει κανείς περικοπές περί της σημασίας της Γραφής, <strong>αγνοώντας και</strong> <strong>αποσιωπώντας τις περικοπές περί της σημασίας της Παράδοσης</strong>. Έτσι, στον ακροατή πρέπει να φανεί ότι δήθεν μόνο η Γραφή έχει σημασία.</p><p>Οι προτεστάντες συχνά κατηγορούν τους ορθοδόξους, λέγοντας:</p><blockquote><p>— <strong>απλώς δείξτε μας στην Αγία Γραφή</strong> πού γράφει να τιμούμε τις εικόνες, να προσευχόμαστε στους αγίους και τα παρόμοια.</p></blockquote><p>Τους δείχνουμε, αλλά τους λέμε:</p><blockquote><p>— σημαντική είναι και η Παράδοση, και αυτό το επιβεβαιώνει ακόμη και η Γραφή.</p></blockquote><p>Τότε λένε:</p><blockquote><p>— όχι, σημαντική είναι μόνο η Γραφή.</p></blockquote><p>Και τότε πλέον τους ζητάμε:</p><blockquote><p>— <strong>απλώς δείξτε μας στην Αγία Γραφή</strong> ότι σημαντική είναι μόνο η Γραφή, ή ότι η Γραφή είναι σημαντικότερη από την Παράδοση.</p></blockquote><p>Δεν μπορούν να δείξουν κάτι τέτοιο, επειδή τέτοια λόγια δεν υπάρχουν στη Γραφή. Απαιτώντας από εμάς να δείχνουμε παρόμοιες φράσεις για τις εικόνες, για τις προσευχές στους αγίους, δεν μπορούν να δείξουν την ίδια ακριβώς φράση ότι όλα πρέπει να είναι μόνο στη Γραφή. Δεν μπορούν να ανταποκριθούν στις δικές τους απαιτήσεις, εφαρμόζοντας διπλά μέτρα.</p><p>Οι ίδιοι το επινόησαν, οι ίδιοι απαιτούν από εμάς να τα δείχνουμε όλα στη Γραφή και οι ίδιοι δεν μπορούν να δείξουν την αρχή τους στη Γραφή.</p><p>Έτσι, η θέση «Sola Scriptura» αντιφάσκει με τον εαυτό της και δεν επέτρεψε σε εκείνους που την επινόησαν να φτάσουν στην αποστολική πίστη, αλλά αντ’ αυτού γέννησε χιλιάδες νέες πεποιθήσεις και διαιρέσεις μεταξύ των ανθρώπων που πιστεύουν στον Χριστό. Η Sola Scriptura απέκτησε τη δημοτικότητά της ως ένα τέχνασμα, μέσω του οποίου κάθε άνθρωπος ξένος προς την Εκκλησία του Χριστού σκοπεύει να περιβάλλει τα λόγια του με θεία αυθεντία και να συγκεντρώνει ξεχωριστές κοινότητες με βάση τη γνώμη του.</p>'
