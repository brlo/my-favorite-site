    body: |-
      <h2>祈れという戒め</h2><h3>願いの祈り</h3><blockquote><p>「<strong><mark>求めなさい。そうすれば、与えられる</mark></strong>。探しなさい。そうすれば、見つかる。<strong>門をたたきなさい。そうすれば、開かれる</strong>」（<a href="https://bibleox.com/ja/jp-ni/mf/7/#L7">マタ. 7:7</a>）（<a href="https://bibleox.com/ja/jp-ni/lk/11/#L9">ルカ. 11:9</a>）</p></blockquote><h3>感謝の祈り</h3><blockquote><p>「<strong>絶えず祈りなさい。<mark>どんなことにも感謝しなさい</mark>。これこそ、キリスト・イエスにおいて、神があなたがたに望んでおられることです</strong>」（<a href="https://bibleox.com/ja/jp-ni/1sol/5/#L17-18">１テサ. 5:17-18</a>）</p></blockquote><blockquote><p>「何事につけ、<strong><mark>感謝を込めて</mark>祈りと願いをささげ</strong>、求めているものを神に打ち明けなさい」（<a href="https://bibleox.com/ja/jp-ni/fil/4/#L6">フィリ. 4:6</a>）</p></blockquote><blockquote><p>「むしろ、霊に満たされ、詩編と賛歌と霊的な歌によって語り合い、主に向かって心からほめ歌いなさい。そして、<strong><mark>いつも、あらゆることについて</mark></strong>、わたしたちの主イエス・キリストの名により、<strong><mark>父である神に感謝しなさい</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/ef/5/#L18-20">エフェ. 5:18-20</a>）</p></blockquote><blockquote><p>「そして、何を話すにせよ、行うにせよ、すべてを主イエスの名によって行い、<strong><mark>イエスによって、父である神に感謝しなさい</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/kol/3/#L17">コロ. 3:17</a>）</p></blockquote><h3>神を賛美する祈り（頌栄）</h3><blockquote><p>「<strong><mark>感謝の歌</mark></strong>をうたって主の門に進み賛美の歌をうたって主の庭に入れ。<strong><mark>感謝をささげ、御名をたたえよ</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/ps/100/#L4">詩. 100:4</a>）</p></blockquote><blockquote><p>「<strong><mark>どのようなときも、わたしは主をたたえわたしの口は絶えることなく賛美を歌う</mark></strong>。わたしの魂は主を賛美する。貧しい人よ、それを聞いて喜び祝え」（<a href="https://bibleox.com/ja/jp-ni/ps/34/#L2-3">詩. 34:2-3</a>）</p></blockquote><blockquote><p>「だから、イエスを通して<strong><mark>賛美</mark>のいけにえ</strong>、すなわち<strong><mark>御名をたたえる</mark></strong>唇の実を、<strong>絶えず神に献げましょう</strong>」（<a href="https://bibleox.com/ja/jp-ni/evr/13/#L15">ヘブ. 13:15</a>）</p></blockquote><h2>絶え間ない祈りと神の観想</h2><blockquote><p>「<strong><mark>どのような時にも</mark></strong>、<strong>“霊”に助けられて</strong>祈り、願い求め、すべての聖なる者たちのために、絶えず目を覚まして根気よく祈り続けなさい」（<a href="https://bibleox.com/ja/jp-ni/ef/6/#L18">エフェ. 6:18</a>）</p></blockquote><blockquote><p>「<strong><mark>絶えず祈りなさい</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/1sol/5/#L17">１テサ. 5:17</a>）</p></blockquote><blockquote><p>「イエスは、<strong>気を落とさずに<mark>絶えず祈らなければならない</mark></strong>ことを教えるために、弟子たちにたとえを話された。『ある町に、神を畏れず人を人とも思わない裁判官がいた。ところが、その町に一人のやもめがいて、裁判官のところに来ては、「相手を裁いて、わたしを守ってください」と言っていた。裁判官は、しばらくの間は取り合おうとしなかった。しかし、その後に考えた。「自分は神など畏れないし、人を人とも思わない。しかし、あのやもめは、うるさくてかなわないから、彼女のために裁判をしてやろう。さもないと、ひっきりなしにやって来て、わたしをさんざんな目に遭わすにちがいない。」』それから、主は言われた。『この不正な裁判官の言いぐさを聞きなさい。まして神は、<strong>昼も夜も叫び求めている選ばれた人たちのために裁きを行わずに、彼らをいつまでもほうっておかれることがあろうか</strong>』」（<a href="https://bibleox.com/ja/jp-ni/lk/18/#L1-7">ルカ. 18:1-7</a>）</p></blockquote><h2>どのような祈りが聞き入れられるか</h2><h3>信仰</h3><blockquote><p>「あなたがたの中で知恵の欠けている人がいれば、だれにでも惜しみなくとがめだてしないでお与えになる神に願いなさい。そうすれば、与えられます。<strong>いささかも疑わず、<mark>信仰をもって願いなさい</mark>。疑う者は、風に吹かれて揺れ動く海の波に似ています。そういう人は、主から何かいただけると思ってはなりません</strong>」（<a href="https://bibleox.com/ja/jp-ni/iak/1/#L5-7">ヤコ. 1:5-7</a>）</p></blockquote><blockquote><p>「<strong><mark>信じて祈るならば</mark></strong>、求めるものは何でも得られる」（<a href="https://bibleox.com/ja/jp-ni/mf/21/#L22">マタ. 21:22</a>）（<a href="https://bibleox.com/ja/jp-ni/mk/11/#L24">マコ. 11:24</a>）</p></blockquote><h3>義（神の御心に従う生活、罪から離れること）</h3><blockquote><p><em>「主は逆らう者のいけにえをいとい</em><strong><em><mark>正しい人</mark>の祈りを喜び迎えられる</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/pr/15/#L8"><em>箴. 15:8</em></a><em>）</em></p></blockquote><blockquote><p><em>「主は逆らう者に遠くいますが</em><strong><em><mark>従う者</mark>の祈りを聞いてくださる</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/pr/15/#L29"><em>箴. 15:29</em></a><em>）</em></p></blockquote><blockquote><p>「<strong><mark>あなたがたがわたしにつながっており</mark>、わたしの言葉があなたがたの内にいつもあるならば</strong>、望むものを何でも願いなさい。そうすればかなえられる」（<a href="https://bibleox.com/ja/jp-ni/in/15/#L7">ヨハ. 15:7</a>）</p></blockquote><blockquote><p>「この民は、口でわたしに近づき<strong>唇でわたしを敬うが心はわたしから遠く離れている</strong>」（<a href="https://bibleox.com/ja/jp-ni/is/29/#L13">イザ. 29:13</a>）</p></blockquote><h3>へりくだり、悔いる心</h3><blockquote><p>「しかし、神の求めるいけにえは<strong><mark>打ち砕かれた霊。打ち砕かれ悔いる心を</mark>神よ、あなたは侮られません</strong>」（<a href="https://bibleox.com/ja/jp-ni/ps/51/#L19">詩. 51:19</a>）</p></blockquote><blockquote><p><em>「主よ、あなたは</em><strong><em><mark>貧しい人に耳を傾けその願いを聞き</mark></em></strong><em>、彼らの心を確かにし」（</em><a href="https://bibleox.com/ja/jp-ni/ps/10/#L17"><em>詩. 10:17</em></a><em>）</em></p></blockquote><blockquote><p><em>「</em><strong><em><mark>謙虚な人の祈りは、雲を突き抜けて行き</mark></em></strong><em>、それが主に届くまで、彼は慰めを得ない」（</em><a href="https://bibleox.com/ja/jp-ni/prsir/35/#L17"><em>シラ. 35:21</em></a><em>）</em></p></blockquote><blockquote><p><em>「</em><strong><em><mark>わたしが顧みるのは苦しむ人</mark></em></strong><em>、霊の砕かれた人わたしの言葉におののく人」（</em><a href="https://bibleox.com/ja/jp-ni/is/66/#L2"><em>イザ. 66:2</em></a><em>）</em></p></blockquote><blockquote><p><em>「しかし、打ち砕かれた魂と</em><strong><em><mark>へりくだった霊</mark>によって、わたしたちが<mark>受け入れられます</mark>ように</em></strong><em>」（</em><a href="https://bibleox.com/ja/gr-lxx-byz/dan/3/#L39"><em>ダニ. 3:39、七十人訳</em></a><em>。ギリシア語からの訳：ἀλλ᾿ ἐν ψυχῇ συντετριμμένῃ καὶ πνεύματι τεταπεινωμένῳ προσδεχθείημεν。この箇所は新共同訳のダニエル書にはありません）</em></p></blockquote><blockquote><p>「<strong><mark>自分は正しい人間だとうぬぼれて、他人を見下している</mark>人々に対しても、イエスは次のたとえを話された</strong>。『二人の人が祈るために神殿に上った。一人はファリサイ派の人で、もう一人は徴税人だった。<strong>ファリサイ派の人は立って、心の中でこのように祈った</strong>。「神様、わたしは<strong><mark>ほかの人たちのように</mark></strong>、奪い取る者、不正な者、姦通を犯す者でなく、また、この徴税人のような者でもないことを感謝します。わたしは週に二度断食し、全収入の十分の一を献げています。」<strong>ところが、徴税人は遠くに立って、目を天に上げようともせず</strong>、胸を打ちながら言った。<strong>「神様、罪人のわたしを憐れんでください。」</strong>言っておくが、義とされて家に帰ったのは、この人であって、あのファリサイ派の人ではない。だれでも高ぶる者は低くされ、へりくだる者は高められる』」（<a href="https://bibleox.com/ja/jp-ni/lk/18/#L9-14">ルカ. 18:9-14</a>）</p></blockquote><p>こちらも参照（ロシア語）：<a href="https://bibleox.com/ru/ru/w/%D1%81%D0%BC%D0%B8%D1%80%D0%B5%D0%BD%D0%B8%D0%B5">謙遜</a>。</p><h3>すべての侮辱を赦すこと</h3><blockquote><p>「また、<strong>立って祈るとき、だれかに対して何か恨みに思うことがあれば、<mark>赦してあげなさい</mark></strong>。そうすれば、あなたがたの天の父も、あなたがたの過ちを赦してくださる。〔<strong>もし赦さないなら、あなたがたの天の父も</strong>、あなたがたの過ちを<strong>お赦しにならない</strong>。〕」（<a href="https://bibleox.com/ja/jp-ni/mk/11/#L25-26">マコ. 11:25-26</a>）<em>（新共同訳は26節を〔　〕に入れていますが、ビザンティン本文（多数派写本）では本文の一部です。）</em></p></blockquote><blockquote><p>「<strong><mark>もし人の過ちを赦すなら</mark>、あなたがたの天の父もあなたがたの過ちをお赦しになる</strong>」（<a href="https://bibleox.com/ja/jp-ni/mf/6/#L14">マタ. 6:14</a>）</p></blockquote><h3>隣人との平和</h3><blockquote><p>「だから、あなたが祭壇に供え物を献げようとし、兄弟が自分に反感を持っているのをそこで思い出したなら、その供え物を祭壇の前に置き、<strong><mark>まず行って兄弟と仲直りをし</mark>、それから帰って来て、供え物を献げなさい</strong>」（<a href="https://bibleox.com/ja/jp-ni/mf/5/#L23-24">マタ. 5:23-24</a>）</p></blockquote><blockquote><p>「<strong>同じように、夫たちよ、妻を自分よりも弱いものだとわきまえて生活を共にし</strong>、命の恵みを共に受け継ぐ者として<strong>尊敬しなさい</strong>。<strong>そうすれば、あなたがたの祈りが妨げられることはありません</strong>」（<a href="https://bibleox.com/ja/jp-ni/1pet/3/#L7">１ペト. 3:7</a>）</p></blockquote><h3>忍耐</h3><blockquote><p>「イエスは、<strong><mark>気を落とさずに絶えず祈らなければならない</mark></strong>ことを教えるために、弟子たちにたとえを話された。『ある町に、神を畏れず人を人とも思わない裁判官がいた。ところが、その町に一人のやもめがいて、裁判官のところに来ては、「相手を裁いて、わたしを守ってください」と言っていた。裁判官は、しばらくの間は取り合おうとしなかった。しかし、その後に考えた。「自分は神など畏れないし、人を人とも思わない。しかし、あのやもめは、うるさくてかなわないから、彼女のために裁判をしてやろう。さもないと、ひっきりなしにやって来て、わたしをさんざんな目に遭わすにちがいない。」』それから、主は言われた。『この不正な裁判官の言いぐさを聞きなさい。まして神は、<strong>昼も夜も叫び求めている選ばれた人たちのために裁きを行わずに、彼らをいつまでもほうっておかれることがあろうか</strong>』」（<a href="https://bibleox.com/ja/jp-ni/lk/18/#L1-7">ルカ. 18:1-7</a>）</p></blockquote><blockquote><p>「また、弟子たちに言われた。『あなたがたのうちのだれかに友達がいて、真夜中にその人のところに行き、次のように言ったとしよう。「友よ、パンを三つ貸してください。旅行中の友達がわたしのところに立ち寄ったが、何も出すものがないのです。」すると、その人は家の中から答えるにちがいない。「面倒をかけないでください。もう戸は閉めたし、子供たちはわたしのそばで寝ています。起きてあなたに何かをあげるわけにはいきません。」しかし、言っておく。その人は、友達だからということでは起きて何か与えるようなことはなくても、<strong><mark>しつように頼めば、起きて来て必要なものは何でも与えるであろう</mark>。そこで、わたしは言っておく。求めなさい。そうすれば、与えられる</strong>。探しなさい。そうすれば、見つかる。門をたたきなさい。そうすれば、開かれる。だれでも、求める者は受け、探す者は見つけ、門をたたく者には開かれる』」（<a href="https://bibleox.com/ja/jp-ni/lk/11/#L5-10">ルカ. 11:5-10</a>）</p></blockquote><h3>施し（困っている人々への実際の助け）</h3><blockquote><p>「<strong>真実をもって祈りをささげ、正義をもって<mark>慈善の業</mark>をする方が</strong>、不正を行って金持ちとなるよりも、よいことです。金をため込むよりも慈善の業をする方がはるかにすばらしいことなのです」（<a href="https://bibleox.com/ja/jp-ni/tov/12/#L8">トビ. 12:8</a>）<em>（七十人訳の別の本文では「断食を伴う祈りは良い。しかし、その二つにまさるのは、義を伴う施しである」となっています。）</em></p></blockquote><blockquote><p>「いかに幸いなことでしょう<strong>弱いものに思いやりのある人は</strong>。災いのふりかかるとき主はその人を逃れさせてくださいます。主よ、その人を守って命を得させこの地で幸せにしてください。貪欲な敵に引き渡さないでください」（<a href="https://bibleox.com/ja/jp-ni/ps/41/#L2-3">詩. 41:2-3</a>）</p></blockquote><blockquote><p>「<strong>弱者を憐れむ人は</strong>主に貸す人。<strong>その行いは必ず報いられる</strong>」（<a href="https://bibleox.com/ja/jp-ni/pr/19/#L17">箴. 19:17</a>）</p></blockquote><blockquote><p>「<strong>お前たちが手を広げて祈っても、わたしは目を覆う。どれほど祈りを繰り返しても、決して聞かない</strong>。お前たちの血にまみれた手を洗って、清くせよ。悪い行いをわたしの目の前から取り除け。悪を行うことをやめ<strong>善を行うことを学び裁きをどこまでも実行して<mark>搾取する者を懲らし、孤児の権利を守りやもめの訴えを弁護せよ</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/is/1/#L15-17">イザ. 1:15-17</a>）</p></blockquote><blockquote><p>「すると、天使は言った。『<strong>あなたの祈りと<mark>施し</mark>は、神の前に届き、覚えられた</strong>』」（<a href="https://bibleox.com/ja/jp-ni/act/10/#L4">使. 10:4</a>）</p></blockquote><h3>断食</h3><blockquote><p>「主は言われる。『今こそ、<strong>心からわたしに立ち帰れ<mark>断食し</mark></strong>、泣き悲しんで』」（<a href="https://bibleox.com/ja/jp-ni/iol/2/#L12">ヨエ. 2:12</a>）</p></blockquote><blockquote><p>「わたしは主なる神を仰いで<strong><mark>断食し</mark></strong>、粗布をまとい、灰をかぶって<strong>祈りをささげ、嘆願した</strong>」（<a href="https://bibleox.com/ja/jp-ni/dan/9/#L3">ダニ. 9:3</a>）</p></blockquote><blockquote><p>「そこで、彼らは<strong>断食して祈り</strong>、二人の上に手を置いて出発させた」（<a href="https://bibleox.com/ja/jp-ni/act/13/#L3">使. 13:3</a>）</p></blockquote><blockquote><p>「<strong>断食して</strong>膝は弱くなりからだは脂肪を失い、衰えて行きます。&lt;…&gt; わたしの神、主よ、わたしを助けてください。慈しみによってお救いください」（<a href="https://bibleox.com/ja/jp-ni/ps/109/#L24,26">詩. 109:24,26</a>）</p></blockquote><h3>偽善のないこと</h3><blockquote><p>「<strong><mark>祈るときにも、あなたがたは偽善者のようであってはならない</mark>。偽善者たちは、<mark>人に見てもらおうと</mark>、会堂や大通りの角に立って<mark>祈りたがる</mark></strong>。はっきり言っておく。<strong>彼らは既に報いを受けている</strong>。だから、あなたが祈るときは、奥まった自分の部屋に入って戸を閉め、隠れたところにおられるあなたの父に祈りなさい。そうすれば、隠れたことを見ておられるあなたの父が報いてくださる」（<a href="https://bibleox.com/ja/jp-ni/mf/6/#L5-6">マタ. 6:5-6</a>）</p></blockquote><h3>空しい多弁のないこと</h3><p>すでに上で述べたように、祈りには絶え間なさ、粘り強さ、忍耐が求められます（<a href="https://bibleox.com/ja/jp-ni/lk/18/#L1-7">ルカ. 18:1-7</a>）。しかし、神は言葉が繰り返される回数によってなだめられるのではありません。祈りは、上に挙げたすべてのこと、すなわち信仰、義、神に喜ばれる行い、罪から離れること、心の清さ、侮辱を赦すこと、隣人との平和などと結びついていなければなりません。一方、異教徒たちは、<u>自分自身と</u>自分の生活<u>を変えることなく</u>、あたかも眠っているかのような自分たちの神々に届くまで叫べばよいと期待していました。だから、もっと大きく、もっと何度も叫ばなければならないかのように考えていたのです（<a href="https://bibleox.com/ja/jp-ni/3ts/18/#L26-28">王上. 18:26-28</a>を参照）。</p><blockquote><p>「また、<strong>あなたがたが祈るときは、異邦人のようにくどくどと述べてはならない。異邦人は、言葉数が多ければ、聞き入れられると思い込んでいる</strong>。彼らのまねをしてはならない。あなたがたの父は、願う前から、あなたがたに必要なものをご存じなのだ」（<a href="https://bibleox.com/ja/jp-ni/mf/6/#L7-8">マタ. 6:7-8</a>）</p></blockquote><p>主イエス・キリスト御自身もしばしば夜通し祈られ、時には御自分の祈りを繰り返されました。</p><blockquote><p>「<strong>更に</strong>、向こうへ行って、<strong>同じ言葉で</strong>祈られた」（<a href="https://bibleox.com/ja/jp-ni/mk/14/#L39">マコ. 14:39</a>）</p></blockquote><h2>神は御心に適うことを与えられる</h2><blockquote><p>「<strong>願い求めても、与えられないのは</strong>、自分の楽しみのために使おうと、<strong>間違った動機で願い求めるからです</strong>」（<a href="https://bibleox.com/ja/jp-ni/iak/4/#L3">ヤコ. 4:3</a>）</p></blockquote><blockquote><p>「<strong>何事でも神の御心に適うことをわたしたちが願うなら</strong>、神は聞き入れてくださる。これが神に対するわたしたちの確信です」（<a href="https://bibleox.com/ja/jp-ni/1in/5/#L14">１ヨハ. 5:14</a>）</p></blockquote><blockquote><p>「<strong>あなたがたがわたしにつながっており、わたしの言葉があなたがたの内にいつもあるならば</strong>、望むものを何でも願いなさい。そうすればかなえられる」（<a href="https://bibleox.com/ja/jp-ni/in/15/#L7">ヨハ. 15:7</a>）</p></blockquote><blockquote><p>「あなたがたのだれが、パンを欲しがる自分の子供に、石を与えるだろうか。魚を欲しがるのに、蛇を与えるだろうか。このように、あなたがたは悪い者でありながらも、自分の子供には良い物を与えることを知っている。まして、あなたがたの天の父は、求める者に<strong>良い物をくださる</strong>にちがいない」（<a href="https://bibleox.com/ja/jp-ni/mf/7/#L9-11">マタ. 7:9-11</a>）</p></blockquote><h2>一人での祈り</h2><blockquote><p>「だから、<strong>あなたが祈るときは、奥まった自分の部屋に入って戸を閉め、隠れたところにおられるあなたの父に祈りなさい</strong>。そうすれば、隠れたことを見ておられるあなたの父が報いてくださる」（<a href="https://bibleox.com/ja/jp-ni/mf/6/#L6">マタ. 6:6</a>）</p></blockquote><h2>共同の祈り</h2><blockquote><p>「また、はっきり言っておくが、どんな願い事であれ、<strong>あなたがたのうち二人が地上で心を一つにして求めるなら</strong>、わたしの天の父はそれをかなえてくださる。<strong><mark>二人または三人がわたしの名によって集まるところには、わたしもその中にいるのである</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/mf/18/#L19-20">マタ. 18:19-20</a>）</p></blockquote><h2>ほかの人々のための祈り</h2><h3>隣人と教会のための祈り</h3><blockquote><p>「だから、主にいやしていただくために、罪を告白し合い、<strong>互いのために祈りなさい</strong>。正しい人の祈りは、大きな力があり、効果をもたらします」（<a href="https://bibleox.com/ja/jp-ni/iak/5/#L16">ヤコ. 5:16</a>）</p></blockquote><blockquote><p>「同時に<strong>わたしたちのためにも祈ってください</strong>。神が御言葉のために門を開いてくださり、わたしたちがキリストの秘められた計画を語ることができるように。このために、わたしは牢につながれています」（<a href="https://bibleox.com/ja/jp-ni/kol/4/#L3">コロ. 4:3</a>）</p></blockquote><blockquote><p>「兄弟たち、<strong>わたしたちのためにも祈ってください</strong>」（<a href="https://bibleox.com/ja/jp-ni/1sol/5/#L25">１テサ. 5:25</a>）</p></blockquote><blockquote><p>「終わりに、<strong>兄弟たち、わたしたちのために祈ってください</strong>。主の言葉が、あなたがたのところでそうであったように、速やかに宣べ伝えられ、あがめられるように」（<a href="https://bibleox.com/ja/jp-ni/2sol/3/#L1">２テサ. 3:1</a>）</p></blockquote><blockquote><p>「<strong>わたしたちのために祈ってください</strong>。わたしたちは、明らかな良心を持っていると確信しており、すべてのことにおいて、立派にふるまいたいと思っています」（<a href="https://bibleox.com/ja/jp-ni/evr/13/#L18">ヘブ. 13:18</a>）</p></blockquote><blockquote><p>「わたしたちは自分が弱くても、あなたがたが強ければ喜びます。<strong>あなたがたが完全な者になることをも、わたしたちは祈っています</strong>」（<a href="https://bibleox.com/ja/jp-ni/2kor/13/#L9">２コリ. 13:9</a>）</p></blockquote><blockquote><p>「このことのためにも、<strong>いつもあなたがたのために祈っています</strong>。どうか、わたしたちの神が、あなたがたを招きにふさわしいものとしてくださり、また、その御力で、善を求めるあらゆる願いと信仰の働きを成就させてくださるように」（<a href="https://bibleox.com/ja/jp-ni/2sol/1/#L11">２テサ. 1:11</a>）</p></blockquote><blockquote><p>「<strong>あなたがたも祈りで援助してください</strong>。そうすれば、多くの人のお陰でわたしたちに与えられた恵みについて、多くの人々がわたしたちのために感謝をささげてくれるようになるのです」（<a href="https://bibleox.com/ja/jp-ni/2kor/1/#L11">２コリ. 1:11</a>）</p></blockquote><h3>わたしたちに害を加える者のための祈り</h3><blockquote><p>「しかし、わたしは言っておく。敵を愛し、<strong>自分を迫害する者のために祈りなさい</strong>」（<a href="https://bibleox.com/ja/jp-ni/mf/5/#L44">マタ. 5:44</a>）<em>（ビザンティン本文（多数派写本）ではこの節は長く、「呪う者を祝福し、憎む者に親切にし、侮辱する者と迫害する者のために祈りなさい」となっています。）</em></p></blockquote><blockquote><p>「悪口を言う者に祝福を祈り、<strong>あなたがたを侮辱する者のために祈りなさい</strong>」（<a href="https://bibleox.com/ja/jp-ni/lk/6/#L28">ルカ. 6:28</a>）</p></blockquote><h3>死に至らない罪を犯している人のための祈り</h3><blockquote><p>「<strong>死に至らない罪を犯している兄弟を見たら、その人のために神に願いなさい。そうすれば、神はその人に命をお与えになります</strong>。これは、死に至らない罪を犯している人々の場合です。死に至る罪があります。これについては、神に願うようにとは言いません。不義はすべて罪です。しかし、死に至らない罪もあります」（<a href="https://bibleox.com/ja/jp-ni/1in/5/#L16-17">１ヨハ. 5:16-17</a>）</p></blockquote><h3>教会の祈りによって人々の罪が赦される</h3><blockquote><p>「あなたがたの中で病気の人は、<strong>教会の長老を招いて</strong>、主の名によってオリーブ油を塗り、祈ってもらいなさい。信仰に基づく祈りは、病人を救い、主がその人を起き上がらせてくださいます。<strong>その人が罪を犯したのであれば、主が赦してくださいます</strong>。だから、主にいやしていただくために、罪を告白し合い、互いのために祈りなさい。正しい人の祈りは、大きな力があり、効果をもたらします」（<a href="https://bibleox.com/ja/jp-ni/iak/5/#L14-16">ヤコ. 5:14-16</a>）</p></blockquote>

  - src: молитвы-за-умерших
    path: Pd2e_永眠者のための祈り
    title: 永眠者のための祈り
    meta_desc: 永眠者のための祈り、施し、いけにえ、断食についての聖書の引用
    menu: { parent: "教会/祈り", title: "永眠者のための祈り", priority: 3 }
    references: |-
      <p>ここに、永眠したオネシフォロのための使徒パウロの祈りを見る人もいます。この時までにオネシフォロはすでに死んでいたと考えるからです。</p><blockquote><p>「どうか、主がオネシフォロの家族を憐れんでくださいますように。彼は、わたしをしばしば励まし、わたしが囚人の身であることを恥とも思わず、ローマに着くとわたしを熱心に探し、見つけ出してくれたのです。<strong>どうか、主がかの日に、主のもとで彼に憐れみを授けてくださいますように</strong>。彼がエフェソでどれほどわたしに仕えてくれたか、あなたがだれよりもよく知っています」（<a href="https://bibleox.com/ja/jp-ni/2tim/1/#L16-18">２テモ. 1:16-18</a>）</p></blockquote><p>そうかもしれませんが、この時までにオネシフォロがすでに死んでいたと考える真剣な根拠は、今のところないように思われます。</p>
    body: |-
      <h2>序</h2><p>永眠者のために何かの憐れみを願うことは、愛する心の動き、すなわち神と隣人への愛に導かれた人の心の動きです。あれこれの永眠者のための願いに対して主がどのように行動されるかを、わたしたちは知りません。しかし、わたしたちには希望の理由と、配慮へと動かす愛とがあります。その理由とは何でしょうか。理由は神の啓示です。そこからわたしたちは、神が全能であること、神が陰府と死の「鍵」を持っておられること、来るべき世においても赦されない罪があること（それによって、ほかの罪もあることがわかります）、そして神がわたしたちを、さまざまな願いをもって御自分に向かうよう招かれたことを知ります。わたしたちはまた、罪人の罰の程度は<a href="https://bibleox.com/ru/ru/w/bib_%D0%9D%D0%B5%D0%BE%D0%B4%D0%B8%D0%BD%D0%B0%D0%BA%D0%BE%D0%B2%D0%B0%D1%8F_%D0%BC%D0%B5%D1%80%D0%B0_%D0%B2%D0%BE%D0%B7%D0%B4%D0%B0%D1%8F%D0%BD%D0%B8%D1%8F:_%D0%BC%D1%83%D1%87%D0%B5%D0%BD%D0%B8%D1%8F_%D0%B8_%D0%B1%D0%BB%D0%B0%D0%B6%D0%B5%D0%BD%D1%81%D1%82%D0%B2%D0%B0">同じではなく</a>、義人の至福の程度も同じではないことを知っています。それゆえ、たとえある人が救われないとしても、わたしたちはその人の運命が和らげられることを望むのです。旧約でも永眠者は顧みられており（下記「旧約：永眠者の罪の赦しへの配慮」を参照）、最も古いキリスト者たちも彼らを顧みていました（<a href="https://bibleox.com/ru/ru/w/91USaqiJ_%D0%BC%D0%BE%D0%BB%D0%B8%D1%82%D0%B2%D1%8B_%D0%B7%D0%B0_%D1%83%D0%BC%D0%B5%D1%80%D1%88%D0%B8%D1%85">詳しく</a>、ロシア語）。</p><p>これらすべてへとわたしたちを動かすのは、「決して滅びない」愛です（<a href="https://bibleox.com/ja/jp-ni/1kor/13/#L8">１コリ. 13:8</a>）。</p><h2>神は全能である</h2><blockquote><p><em>「見よ、わたしは生きとし生けるものの神、主である。</em><strong><em>わたしの力の及ばないことが、ひとつでもあるだろうか</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/ier/32/#L27"><em>エレ. 32:27</em></a><em>）</em></p></blockquote><p>ほかの引用（ロシア語）：<a href="https://bibleox.com/ru/ru/w/%D0%91%D0%BE%D0%B3-%D0%B2%D1%81%D0%B5%D0%BC%D0%BE%D0%B3%D1%83%D1%89%D0%B8%D0%B9">全能の神</a></p><h2>神は、戒めを守る者は信仰をもって願うものを祈りの中で何でも受けると約束された</h2><blockquote><p>「<strong>神に願うことは何でもかなえられます</strong>。わたしたちが神の掟を守り、御心に適うことを行っているからです」（<a href="https://bibleox.com/ja/jp-ni/1in/3/#L22">１ヨハ. 3:22</a>）</p></blockquote><blockquote><p>「わたしたちは、<strong>願い事は何でも聞き入れてくださる</strong>ということが分かるなら、神に願ったことは既にかなえられていることも分かります」（<a href="https://bibleox.com/ja/jp-ni/1in/5/#L15">１ヨハ. 5:15</a>）</p></blockquote><blockquote><p>「<strong>信じて祈るならば、求めるものは何でも得られる</strong>」（<a href="https://bibleox.com/ja/jp-ni/mf/21/#L22">マタ. 21:22</a>）</p></blockquote><blockquote><p>「また、はっきり言っておくが、どんな願い事であれ、あなたがたのうち二人が地上で心を一つにして求めるなら、わたしの天の父は<strong>それをかなえてくださる</strong>」（<a href="https://bibleox.com/ja/jp-ni/mf/18/#L19">マタ. 18:19</a>）</p></blockquote><blockquote><p>「あなたがたがわたしを選んだのではない。わたしがあなたがたを選んだ。あなたがたが出かけて行って実を結び、その実が残るようにと、また、<strong>わたしの名によって父に願うものは何でも与えられるように</strong>と、わたしがあなたがたを任命したのである」（<a href="https://bibleox.com/ja/jp-ni/in/15/#L16">ヨハ. 15:16</a>）</p></blockquote><p>これらの言葉は、罪を犯している兄弟たちの救いのための祈りという文脈の中で語られています。神は正しい人の祈りを通して彼らを救われるのです。</p><blockquote><p>「わたしたちは、<strong><mark>願い事は何でも聞き入れてくださる</mark></strong>ということが分かるなら、神に願ったことは既にかなえられていることも分かります。<strong><mark>死に至らない罪を犯している兄弟を見たら、その人のために神に願いなさい。そうすれば、神はその人に命をお与えになります</mark>。これは、死に至らない罪を犯している人々の場合です</strong>。死に至る罪があります。これについては、神に願うようにとは言いません」（<a href="https://bibleox.com/ja/jp-ni/1in/5/#L15-16">１ヨハ. 5:15-16</a>）</p></blockquote><h2>教会の祈りによって罪が赦されることがある</h2><p>つまり、罪が赦されるのは、本人が悔い改めて赦しを願うときだけでなく、ほかの人々がその人の罪の赦しを願うときでもあるのです。</p><blockquote><p>「あなたがたの中で病気の人は、<strong>教会の長老を招いて</strong>、主の名によってオリーブ油を塗り、<strong>祈ってもらいなさい</strong>。信仰に基づく祈りは、病人を救い、主がその人を起き上がらせてくださいます。<strong>その人が罪を犯したのであれば、主が赦してくださいます</strong>」（<a href="https://bibleox.com/ja/jp-ni/iak/5/#L14-15">ヤコ. 5:14-15</a>）</p></blockquote><p>中風の仲間の友人たちは、友人をキリストのもとに連れて来るために大いに骨を折りました。そして彼らの信仰によって、主は中風の人の罪を赦し、彼をいやされました。</p><blockquote><p>「<em>イエスは</em><strong>その人たちの信仰を見て</strong><em>、中風の人に、「子よ、</em><strong><em>あなたの罪は赦される</em></strong><em>」と言われた</em>」（<a href="https://bibleox.com/ja/jp-ni/mk/2/#L5">マコ. 2:5</a>）</p></blockquote><h2>死後にも罪が赦されることがある</h2><p>主イエス・キリストの言葉から、罪の赦しはこの世においてだけでなく、来るべき世においても可能であることがわかります。今も後にも赦されない罪があるのです。</p><blockquote><p>「だから、言っておく。人が犯す罪や冒瀆は、どんなものでも赦されるが、“霊”に対する冒瀆は赦されない。人の子に言い逆らう者は赦される。しかし、聖霊に言い逆らう者は、<strong>この世でも後の世でも赦されることがない</strong>」（<a href="https://bibleox.com/ja/jp-ni/mf/12/#L31-32">マタ. 12:31-32</a>）</p></blockquote><h2>キリストは陰府と死の鍵を持っておられる</h2><blockquote><p>「わたしは、その方を見ると、その足もとに倒れて、死んだようになった。すると、その方は右手をわたしの上に置いて言われた。『恐れるな。わたしは最初の者にして最後の者、また生きている者である。一度は死んだが、見よ、世々限りなく生きて、<strong>死と陰府の鍵を持っている</strong>』」（<a href="https://bibleox.com/ja/jp-ni/otkr/1/#L17-18">黙. 1:17-18</a>）</p></blockquote><h2>旧約：永眠者の罪の赦しへの配慮</h2><h3>永眠者のための断食</h3><p>イスラエル人は、死んだサウル王とその息子たち、戦いに倒れたすべてのイスラエル人のために断食しました。</p><blockquote><p>「この同じ日に、サウルとその三人の息子、従卒、更に彼の兵は皆死んだ」（<a href="https://bibleox.com/ja/jp-ni/1ts/31/#L6">サム上. 31:6</a>）</p></blockquote><blockquote><p>「彼らの骨を拾ってヤベシュのぎょりゅうの木の下に葬り、<strong>七日間、断食した</strong>」（<a href="https://bibleox.com/ja/jp-ni/1ts/31/#L13">サム上. 31:13</a>）</p></blockquote><blockquote><p>「彼らは、剣に倒れたサウルとその子ヨナタン、そして主の民とイスラエルの家を<strong>悼んで泣き、夕暮れまで断食した</strong>」（<a href="https://bibleox.com/ja/jp-ni/2ts/1/#L12">サム下. 1:12</a>）</p></blockquote><h3>永眠者のための祈りといけにえ</h3><p>ユダヤ人は、戦死した兵士たちのために、その罪が赦されるよう祈りました。また、死者のために贖罪のいけにえが献げられ、彼らが罪から清められるよう、エルサレムの神殿に金を送りました。</p><blockquote><p>「ユダは軍隊を率いてアドラムの町へ行った。第七日が近づいていたので、いつものように身を清め、その地で安息日を守った。翌日ユダとその兵士たちは、いつまでも放置しておけないので戦死者たちのなきがらを持ち帰り、墓に葬って先祖の列に加えるために出発した。ところが、それぞれ死者の下着の下に、律法によってユダヤ人が触れてはならないとされているヤムニアの偶像の守り札が見つかり、この人々の戦死の理由はこのためであるということがだれの目にも明らかになった。一同は、隠れたことを明らかにされる正しい裁き主の御業をたたえながら、<strong>この罪が跡形もなくぬぐい去られることを、ひたすら祈願した</strong>。高潔なユダは、これらの戦死者たちの罪の結果を目撃したのであるから、この上はだれも罪を犯してはならないと一同を鼓舞した。<strong>次いで、各人から金を集め、その額、銀二千ドラクメを贖罪の献げ物のためにエルサレムへ送った。それは死者の復活に思いを巡らす彼の、実に立派で高尚な行いであった</strong>。<strong>もし彼が、戦死者の復活することを期待していなかったなら、死者のために祈るということは、余計なことであり、愚かしい行為であったろう</strong>。だが彼は、敬虔な心を抱いて眠りについた人々のために備えられているすばらしい恵みに目を留めていた。その思いはまことに宗教的、かつ敬虔なものであった。<strong>そういうわけで、彼は死者が罪から解かれるよう彼らのために贖いのいけにえを献げたのである</strong>」（<a href="https://bibleox.com/ja/jp-ni/2mak/12/#L38-45">２マカ. 12:38-45</a>）</p></blockquote><h3>永眠者のための施し</h3><p>ユダヤ人は、永眠者のために施しをしました。</p><blockquote><p>「生きとし生けるもの、すべてに恵みを施せ。<strong>また、死者にも思いやりを示せ</strong>」（<a href="https://bibleox.com/ja/jp-ni/prsir/7/#L33">シラ. 7:33</a>）</p></blockquote><blockquote><p>「<strong>正しい人々を埋葬するときは、そこで宴を設けなさい</strong>。しかし罪人たちの場合には、そうしてはならない」（<a href="https://bibleox.com/ja/jp-ni/tov/4/#L17">トビ. 4:17</a>）<em>（七十人訳ギリシア語の本文では ἔκχεον τοὺς ἄρτους σου ἐπὶ τὸν τάφον τῶν δικαίων —「あなたのパンを正しい人々の墓の上に注げ（供えよ）。罪人たちには与えるな」となっています。）</em></p></blockquote><p>死者のための施しは、十分の一の中からは与えられませんでした。</p><blockquote><p>「<strong>十分の一の納期である三年目ごとに、収穫物の十分の一を全部納め終わり</strong>、レビ人、寄留者、孤児、寡婦に施し、彼らが町の中でそれを食べて満ち足りたとき、<strong>あなたの神、主の前で次のように言いなさい</strong>。『わたしは、聖なる献げ物を残らず家から取り出し、すべてあなたが命じられた戒めに従って、レビ人、寄留者、孤児、寡婦に施し、あなたの戒めからはずれたり、それを忘れたりしませんでした。それを喪中に食べたり、汚れているときに取り出したり、<strong>死者に供えたりしたことはありません</strong>。わたしの神、主の御声に聞き従い、すべてあなたが命じられたとおりに行いました』」（<a href="https://bibleox.com/ja/jp-ni/vtor/26/#L12-14">申. 26:12-14</a>）</p></blockquote><h2>神のもとではすべての者が生きている</h2><p>挙げた引用は、ユダヤ人の信仰と具体的な実践を示しています。彼らは死者の罪の赦しのために祈り、死者のために断食し、死者のためにいけにえを献げ、死者のために施しをし、全体として死後の彼らの運命を気にかけていました。死後の存在を否定していたのはサドカイ派だけであり、主は彼らの誤りと聖書を知らないことを叱責されました。</p><blockquote><p>「イエスはお答えになった。『あなたたちは<strong>聖書も神の力も知らないから</strong>、思い違いをしている』」（<a href="https://bibleox.com/ja/jp-ni/mf/22/#L29">マタ. 22:29</a>）</p></blockquote><blockquote><p>「<strong>神は死んだ者の神ではなく、生きている者の神なのだ</strong>。<strong>あなたたちは大変な思い違いをしている</strong>」（<a href="https://bibleox.com/ja/jp-ni/mk/12/#L27">マコ. 12:27</a>）</p></blockquote><h2>永眠者へのあらゆる助けへの希望</h2><p>たとえある人が地獄から救われることができないとしても、いずれにせよ、その苦しみは和らげられ、今あるいは将来（全体的な復活と審判の後）に、何らかの慰めが与えられることがありえます。罰の程度は同じではないからです。</p><blockquote><p><em>「</em><strong><em>主人の思いを知りながら</em></strong><em>何も準備せず、</em><strong><em>あるいは主人の思いどおりにしなかった僕は、<mark>ひどく鞭打たれる</mark>。しかし、知らずにいて</em></strong><em></em><strong><em>鞭打たれるようなことをした者は、<mark>打たれても少しで済む</mark></em></strong><em>。すべて多く与えられた者は、多く求められ、</em><strong><em>多く任された者は、更に多く要求される</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/lk/12/#L47-48"><em>ルカ. 12:47-48</em></a><em>）</em></p></blockquote><p>罰の違いについてのさらに多くの引用（ロシア語）：<a href="https://bibleox.com/ru/ru/w/bib_%D0%9D%D0%B5%D0%BE%D0%B4%D0%B8%D0%BD%D0%B0%D0%BA%D0%BE%D0%B2%D0%B0%D1%8F_%D0%BC%D0%B5%D1%80%D0%B0_%D0%B2%D0%BE%D0%B7%D0%B4%D0%B0%D1%8F%D0%BD%D0%B8%D1%8F:_%D0%BC%D1%83%D1%87%D0%B5%D0%BD%D0%B8%D1%8F_%D0%B8_%D0%B1%D0%BB%D0%B0%D0%B6%D0%B5%D0%BD%D1%81%D1%82%D0%B2%D0%B0">罰の程度は同じではない</a>。</p>

  - src: действие-Бога-по-вере-родителей-и-друзей
    path: Gf3o_ほかの人々の信仰と祈りによる神の働き
    title: ほかの人々の信仰と祈りによる神の働き
    meta_desc: ほかの人々の信仰と祈りによって人の内に働く神の恵みについての聖書の引用
    menu: { parent: "教会/祈り", title: "ほかの人々の信仰によって", priority: 4 }
    body: |-
      <p>神の恵みの働きは、いつもその人自身の信仰とその人自身の願いによって起こるとは限りません。神が、愛する人のために骨を折り、その人のために願う（祈る）近しい人々の信仰によって働かれた例は少なくありません。</p><h2>4人の友と中風の人</h2><p>中風の人を、大いに骨を折ってキリストのもとに連れて来た友人たちの信仰によって、いやしと罪の赦しが起こります。</p><blockquote><p>「<em>イエスは</em><strong>その人たちの信仰を見て</strong><em>、中風の人に、「子よ、</em><strong><em>あなたの罪は赦される</em></strong><em>」と言われた</em>」（<a href="https://bibleox.com/ja/jp-ni/mk/2/#L5">マコ. 2:5</a>）</p></blockquote><h2>百人隊長とその僕</h2><p>百人隊長が信じて願いますが、いやされるのは百人隊長の僕です。</p><blockquote><p>「すると、百人隊長は答えた。『主よ、わたしはあなたを自分の屋根の下にお迎えできるような者ではありません。ただ、ひと言おっしゃってください。そうすれば、わたしの僕はいやされます。』&lt;…&gt; イエスはこれを聞いて感心し、従っていた人々に言われた。『<strong>はっきり言っておく。イスラエルの中でさえ、わたしはこれほどの信仰を見たことがない</strong>。』&lt;…&gt; そして、百人隊長に言われた。『帰りなさい。あなたが信じたとおりになるように。』ちょうどそのとき、<strong>僕の病気はいやされた</strong>」（<a href="https://bibleox.com/ja/jp-ni/mf/8/#L8,10,13">マタ. 8:8,10,13</a>）</p></blockquote><h2>父と悪霊に取りつかれた息子</h2><p>父親が信じて願いますが、悪霊からいやされるのは息子です。</p><blockquote><p>「先生、<strong>息子をおそばに連れて参りました。この子は霊に取りつかれて、ものが言えません</strong>。&lt;…&gt; イエスは父親に、『このようになったのは、いつごろからか』とお尋ねになった。父親は言った。『幼い時からです。&lt;…&gt; おできになるなら、わたしどもを憐れんでお助けください。』イエスは言われた。『「できれば」と言うか。<strong>信じる者には何でもできる</strong>。』その子の父親はすぐに叫んだ。『信じます。信仰のないわたしをお助けください』」（<a href="https://bibleox.com/ja/jp-ni/mk/9/#L17-27">マコ. 9:17-27</a>）</p></blockquote><h2>カナンの母と悪霊に取りつかれた娘</h2><p>母親が信じて願いますが、悪霊からいやされるのはカナンの女（シリア・フェニキアの女 — <a href="https://bibleox.com/ja/jp-ni/mk/7/#L26">マコ. 7:26</a>）の娘です。</p><blockquote><p>「すると、この地に生まれたカナンの女が出て来て、『主よ、ダビデの子よ、わたしを憐れんでください。娘が<strong>悪霊にひどく苦しめられています</strong>』と叫んだ。&lt;…&gt; そこで、イエスはお答えになった。『婦人よ、<strong>あなたの信仰は立派だ</strong>。あなたの願いどおりになるように。』そのとき、娘の病気はいやされた」（<a href="https://bibleox.com/ja/jp-ni/mf/15/#L22-28">マタ. 15:22-28</a>）</p></blockquote><h2>ヤイロと12歳の娘</h2><p>父親（ヤイロ）が信じて願いますが、生き返らされ、いやされるのは娘です。</p><blockquote><p>「そこへ、ヤイロという人が来た。この人は会堂長であった。彼はイエスの足もとにひれ伏して、自分の家に来てくださるようにと願った。十二歳ぐらいの<strong>一人娘</strong>がいたが、死にかけていたのである。&lt;…&gt;『<strong>お嬢さんは亡くなりました</strong>。この上、先生を煩わすことはありません。』イエスは、これを聞いて会堂長に言われた。『<strong>恐れることはない。ただ信じなさい。そうすれば、娘は救われる</strong>。』&lt;…&gt; イエスは娘の手を取り、『娘よ、起きなさい』と呼びかけられた。すると娘は、その霊が戻って、すぐに起き上がった」（<a href="https://bibleox.com/ja/jp-ni/lk/8/#L41-42,49-55">ルカ. 8:41-42,49-55</a>）</p></blockquote><h2>王の役人とその息子</h2><p>役人が信じて願いますが、いやされるのはその息子です。</p><blockquote><p>「さて、カファルナウムに王の役人がいて、その<strong>息子が病気であった</strong>。この人は、イエスがユダヤからガリラヤに来られたと聞き、イエスのもとに行き、カファルナウムまで下って来て息子をいやしてくださるように頼んだ。息子が死にかかっていたからである。&lt;…&gt; イエスは言われた。『帰りなさい。あなたの息子は生きる。』その人は、イエスの言われた言葉を<strong>信じて</strong>帰って行った」（<a href="https://bibleox.com/ja/jp-ni/in/4/#L46-50">ヨハ. 4:46-50</a>）</p></blockquote><h2>結論</h2><p>このように、救い主は、子どもたちに対する神の働きを示すために、親の信仰を期待されました。そして親の願いと信仰によって、神の恵みは子どもたちに働いたのです。</p>

  - src: молитва-не-своими-словами
    path: Pm4t_型に従う祈り
    title: 型に従う祈り
    title_sub: 祈りは、自分の言葉ではなくても自分の祈りでありうるか
    menu: { parent: "教会/祈り", title: "型に従う祈り", priority: 6 }
    body: |-
      <h2>型に従う祈り</h2><p>旧約には、神の霊感による大きな祈祷書、すなわち詩編があります。それは預言者であり王であるダビデによって書かれました。詩編は神殿で用いられ、階段を上りながら歌われました。</p><p>使徒たちが主に祈ることを教えてくださるよう願うとき、彼らは、預言者洗礼者ヨハネがすでに弟子たちに祈ることを教えていたことを引き合いに出しています。</p><blockquote><p>「イエスはある所で祈っておられた。祈りが終わると、弟子の一人がイエスに、『主よ、<strong>ヨハネが弟子たちに教えたように</strong>、<strong>わたしたちにも祈りを教えてください</strong>』と言った」（<a href="https://bibleox.com/ja/jp-ni/lk/11/#L1">ルカ. 11:1</a>）</p></blockquote><p>その後、キリストは御自分の言葉で祈りの型をお与えになりました。</p><blockquote><p>「そこで、イエスは言われた。『祈るときには、こう言いなさい。「父よ、御名が崇められますように。御国が来ますように。わたしたちに必要な糧を毎日与えてください。わたしたちの罪を赦してください、わたしたちも自分に負い目のある人を皆赦しますから。わたしたちを誘惑に遭わせないでください」』」（<a href="https://bibleox.com/ja/jp-ni/lk/11/#L2-4">ルカ. 11:2-4</a>）（<a href="https://bibleox.com/ja/jp-ni/mf/6/#L9-13">マタ. 6:9-13</a>）</p></blockquote><p>つまり、祈りを与えること、型（規則）に従って祈ることは、まったく普通のことであり、聖書的な実践なのです。</p>

  - src: длинные-молитвы
    path: Lp5r_長い祈り
    title: 長い祈り
    meta_desc: 長い祈りについての聖書の引用
    menu: { parent: "教会/祈り", title: "長い祈り", priority: 7 }
    body: |-
      <h2>祈りは長くてもよい</h2><h3>いつも祈れという戒め</h3><blockquote><p>「いつも喜んでいなさい。<strong>絶えず祈りなさい</strong>。どんなことにも感謝しなさい。これこそ、キリスト・イエスにおいて、神があなたがたに望んでおられることです」（<a href="https://bibleox.com/ja/jp-ni/1sol/5/#L16-18">１テサ. 5:16-18</a>）</p></blockquote><blockquote><p>「<strong>どのような時にも</strong>、“霊”に助けられて祈り、願い求め、すべての聖なる者たちのために、絶えず目を覚まして根気よく祈り続けなさい」（<a href="https://bibleox.com/ja/jp-ni/ef/6/#L18">エフェ. 6:18</a>）</p></blockquote><h3>主イエス・キリストは並外れて長く祈られた</h3><p>夜通し祈られました。</p><blockquote><p>「そのころ、イエスは祈るために山に行き、<strong>神に祈って夜を明かされた</strong>」（<a href="https://bibleox.com/ja/jp-ni/lk/6/#L12">ルカ. 6:12</a>）</p></blockquote><p>夕方からほとんど朝まで祈られました。夜は4つの部分、すなわち4つの夜回りに分けられます。第4の夜回りは夜の最後の部分で、ほとんど朝です。キリストはほとんど夜通し祈られたのです。</p><blockquote><p>「群衆を解散させてから、<strong>祈るため</strong>にひとり山にお登りになった。<strong>夕方</strong>になっても、ただひとりそこにおられた。&lt;…&gt; <strong>夜が明けるころ</strong>、イエスは湖の上を歩いて弟子たちのところに行かれた」（<a href="https://bibleox.com/ja/jp-ni/mf/14/#L23,25">マタ. 14:23,25</a>）<em>（「夜が明けるころ」は、ギリシア語原文では τετάρτῃ φυλακῇ τῆς νυκτὸς —「夜の第四の見張りの時」です。）</em></p></blockquote><p>祈りが始まって一時間後に、キリストは使徒たちを起こしに来られ、それがさらに二度繰り返されました。およそ3時間祈られたと考えることができます。</p><blockquote><p>「一同がゲツセマネという所に来ると、イエスは弟子たちに、『<strong>わたしが祈っている</strong>間、ここに座っていなさい』と言われた。&lt;…&gt; 少し進んで行って<strong>地面にひれ伏し</strong>、できることなら、この苦しみの時が自分から過ぎ去るようにと<strong>祈り</strong>、&lt;…&gt; それから、戻って御覧になると、弟子たちは眠っていたので、ペトロに言われた。『シモン、眠っているのか。<strong><mark>わずか一時</mark></strong>も目を覚ましていられなかったのか。』&lt;…&gt; <strong><mark>更に</mark>、向こうへ行って</strong>、同じ言葉で<strong>祈られた</strong>。再び戻って御覧になると、弟子たちは眠っていた。ひどく眠かったのである。彼らは、イエスにどう言えばよいのか、分からなかった。イエスは<strong><mark>三度目に</mark></strong>戻って来て言われた。『あなたがたはまだ眠っている。休んでいる』」（<a href="https://bibleox.com/ja/jp-ni/mk/14/#L32,35,37,39-41">マコ. 14:32,35,37,39-41</a>）</p></blockquote><h3>たとえ</h3><p>祈りの型である「主の祈り」を与えた後、主はすぐに、祈りにおける粘り強さと忍耐についてのたとえを付け加えられました。</p><blockquote><p>「また、弟子たちに言われた。『あなたがたのうちのだれかに友達がいて、真夜中にその人のところに行き、次のように言ったとしよう。「友よ、パンを三つ貸してください。旅行中の友達がわたしのところに立ち寄ったが、何も出すものがないのです。」すると、その人は家の中から答えるにちがいない。「面倒をかけないでください。もう戸は閉めたし、子供たちはわたしのそばで寝ています。起きてあなたに何かをあげるわけにはいきません。」しかし、言っておく。その人は、友達だからということでは起きて何か与えるようなことはなくても、<strong>しつように頼めば、起きて来て</strong>必要なものは何でも<strong>与えるであろう</strong>』」（<a href="https://bibleox.com/ja/jp-ni/lk/11/#L5-8">ルカ. 11:5-8</a>）</p></blockquote><p>やもめと裁判官のたとえ：</p><blockquote><p>「イエスは、<strong>気を落とさずに絶えず祈らなければならない</strong>ことを教えるために、弟子たちにたとえを話された。『ある町に、神を畏れず人を人とも思わない裁判官がいた。ところが、その町に一人のやもめがいて、裁判官のところに来ては、「相手を裁いて、わたしを守ってください」と言っていた。裁判官は、しばらくの間は取り合おうとしなかった。しかし、その後に考えた。「自分は神など畏れないし、人を人とも思わない。しかし、あのやもめは、うるさくてかなわないから、彼女のために裁判をしてやろう。さもないと、ひっきりなしにやって来て、わたしをさんざんな目に遭わすにちがいない。」』それから、主は言われた。『この不正な裁判官の言いぐさを聞きなさい。まして神は、<strong>昼も夜も叫び求めている</strong>選ばれた人たちのために裁きを行わずに、彼らをいつまでもほうっておかれることがあろうか』」（<a href="https://bibleox.com/ja/jp-ni/lk/18/#L1-7">ルカ. 18:1-7</a>）</p></blockquote><h2>祈りは短くてもよい</h2><p>絶え間ない粘り強い祈りの必要についてのやもめと裁判官のたとえの後、主は、御自分に喜ばれた徴税人の短い祈りについてのたとえを話されます。ただし、福音記者が説明するとおり、このたとえそのものは、自分の義をむなしく確信している人々についてのものです。最後に、キリストは、徴税人がどのようにして神に喜ばれたかを直接指し示しておられます。自分自身と自分の義を低く見ることによってです。</p><blockquote><p>「<strong>自分は正しい人間だとうぬぼれて、他人を見下している</strong>人々に対しても、イエスは次のたとえを話された。『二人の人が祈るために神殿に上った。一人はファリサイ派の人で、もう一人は徴税人だった。ファリサイ派の人は立って、心の中でこのように祈った。「神様、わたしはほかの人たちのように、奪い取る者、不正な者、姦通を犯す者でなく、また、この徴税人のような者でもないことを感謝します。わたしは週に二度断食し、全収入の十分の一を献げています。」ところが、徴税人は遠くに立って、目を天に上げようともせず、胸を打ちながら言った。<strong>「神様、罪人のわたしを憐れんでください。」</strong>言っておくが、義とされて家に帰ったのは、この人であって、あのファリサイ派の人ではない。<strong><mark>だれでも高ぶる者は低くされ、へりくだる者は高められる</mark></strong>』」（<a href="https://bibleox.com/ja/jp-ni/lk/18/#L9-14">ルカ. 18:9-14</a>）</p></blockquote><h2>反論への応答</h2><h3>くどくどと述べるな</h3><p>マタイによる福音書では、「主の祈り」の前に、祈りの中で多くを語りすぎてはならないというキリストの言葉が記されています。</p><blockquote><p>「また、あなたがたが祈るときは、異邦人のように<strong>くどくどと述べてはならない</strong>。異邦人は、<strong>言葉数が多ければ</strong>、聞き入れられると思い込んでいる」（<a href="https://bibleox.com/ja/jp-ni/mf/6/#L7">マタ. 6:7</a>）</p></blockquote><p>これは、余計なことを言わないこと、神がすでに知っておられる地上の必要について細々と願わないことの必要について語っています。主御自身も長く祈られ、時には御自分の祈りを繰り返されました。</p><blockquote><p><em>「</em><strong><em>更に</em></strong><em>、向こうへ行って、</em><strong><em>同じ言葉で</em></strong><em>祈られた」（</em><a href="https://bibleox.com/ja/jp-ni/mk/14/#L39"><em>マコ. 14:39</em></a><em>）</em></p></blockquote><p>こちらも参照：<a href="https://bibleox.com/ja/ja/w/Pr1y_祈り/">祈り：空しい多弁のないこと</a></p>

  - src: молитва_стоя
    path: Ps6t_立って祈ること
    title: 立って祈ること
    menu: { parent: "教会/祈り", title: "立って祈ること", priority: 50 }
    body: |-
      <h2>神は旧約の神殿を祈りの家と呼ばれる</h2><blockquote><p>「わたしは彼らを聖なるわたしの山に導き<strong>わたしの祈りの家</strong>の喜びの祝いに連なることを許す。彼らが焼き尽くす献げ物といけにえをささげるならわたしの祭壇で、わたしはそれを受け入れる。<strong>わたしの家は、すべての民の<mark>祈りの家</mark>と呼ばれる</strong>」（<a href="https://bibleox.com/ja/jp-ni/is/56/#L7">イザ. 56:7</a>）（<a href="https://bibleox.com/ja/jp-ni/mf/21/#L13">マタ. 21:13</a>）（<a href="https://bibleox.com/ja/jp-ni/mk/11/#L17">マコ. 11:17</a>）</p></blockquote><p>神殿の構造には、座るための場所は設けられていませんでした。<a href="https://bibleox.com/ru/ru/w/%D0%B8%D0%B5%D1%80%D1%83%D1%81%D0%B0%D0%BB%D0%B8%D0%BC%D1%81%D0%BA%D0%B8%D0%B9-%D1%85%D1%80%D0%B0%D0%BC">神殿の詳しい構造</a>。</p><h2>神殿では人々は立って祈った</h2><blockquote><p>「ユダの人々は主を求めて集まった。ユダのすべての町から人々が主を求めて集まって来た。&lt;…&gt; <strong>ユダのすべての人々がその幼子も、妻も、息子と共に<mark>主の御前に立っていた</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/2par/20/#L4,13">代下. 20:4,13</a>）</p></blockquote><blockquote><p>「モーセは更に、コラに言った。『レビの子らよ、聞きなさい。イスラエルの神はあなたたちをイスラエルの共同体から取り分けられた者として御自身のそばに置き、<strong>主の幕屋の仕事をし、共同体の前に<mark>立って</mark></strong>彼らに仕えさせられる。あなたたちはそれを不足とするのか』」（<a href="https://bibleox.com/ja/jp-ni/chis/16/#L8-9">民. 16:8-9</a>）</p></blockquote><h2>神に仕える存在は立った姿で描かれる</h2><blockquote><p>「この<strong>ケルビム</strong>の広げた翼は合わせて二十アンマであった。ケルビムは顔を内側に向けて<strong><mark>足で立っていた</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/2par/3/#L13">代下. 3:13</a>）</p></blockquote><h2>キリストは使徒たちに、起きて祈るよう言われた</h2><blockquote><p>「〔すると、天使が天から現れて、イエスを力づけた。イエスは苦しみもだえ、<strong>いよいよ切に祈られた。汗が血の滴るように</strong>地面に落ちた。〕イエスが祈り終わって立ち上がり、弟子たちのところに戻って御覧になると、彼らは悲しみの果てに眠り込んでいた。イエスは言われた。『なぜ眠っているのか。誘惑に陥らぬよう、<strong><mark>起きて祈っていなさい</mark></strong>』」（<a href="https://bibleox.com/ja/jp-ni/lk/22/#L43-46">ルカ. 22:43-46</a>）<em>（新共同訳は43-44節を〔　〕に入れていますが、ビザンティン本文（多数派写本）では本文の一部です。）</em></p></blockquote><p>「起きて」という語は、「眠りから覚めて」という意味にも理解できます。しかしこの箇所は、大いなる労苦と汗の滴を伴うキリスト御自身の祈りを示している点でも大切です。</p><h2>注記</h2><p>信じる者たちの集会が、ベンチの並んだ広間に座って神の前で祈ったという聖書の箇所は一つもありません。</p>

  - src: поклоны
    path: Bw7s_伏拝
