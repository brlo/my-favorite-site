    body: |-
      <h2>神殿にひれ伏す</h2><p>ケルビムの聖なる<a href="https://bibleox.com/ru/ru/w/%D0%B8%D0%B5%D1%80%D1%83%D1%81%D0%B0%D0%BB%D0%B8%D0%BC%D1%81%D0%BA%D0%B8%D0%B9-%D1%85%D1%80%D0%B0%D0%BC#HH-%D0%98%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D1%8F">像</a>で満たされていた<a href="https://bibleox.com/ru/ru/w/%D0%B8%D0%B5%D1%80%D1%83%D1%81%D0%B0%D0%BB%D0%B8%D0%BC%D1%81%D0%BA%D0%B8%D0%B9-%D1%85%D1%80%D0%B0%D0%BC">神殿</a>にひれ伏すこと：</p><blockquote><p>「しかしわたしは、深い慈しみをいただいてあなたの家に入り、<strong>聖なる宮に向かってひれ伏し</strong>あなたを畏れ敬います」（<a href="https://bibleox.com/ja/jp-ni/ps/5/#L8">詩. 5:8</a>）</p></blockquote><blockquote><p>「<strong>聖なる神殿に向かってひれ伏し</strong>あなたの慈しみとまことのゆえに御名に感謝をささげます。その御名のすべてにまさってあなたは仰せを大いなるものとされました」（<a href="https://bibleox.com/ja/jp-ni/ps/138/#L2">詩. 138:2</a>）</p></blockquote><h2>神の足台（神殿）にひれ伏す</h2><blockquote><p>「我らの神、主をあがめよ。<strong>その足台</strong>（足を載せる台 — 注）<strong>に向かってひれ伏せ。主は聖なる方</strong>」（<a href="https://bibleox.com/ja/jp-ni/ps/99/#L5">詩. 99:5</a>）<em>（七十人訳ギリシア語 προσκυνεῖτε τῷ ὑποποδίῳ τῶν ποδῶν αὐτοῦ —「その御足の足台にひれ伏せ」）</em></p></blockquote><blockquote><p>「わたしたちは<strong>主のいます所に行き御足を置かれる所に向かって伏し拝もう</strong>」（<a href="https://bibleox.com/ja/jp-ni/ps/132/#L7">詩. 132:7</a>）</p></blockquote><h2>契約の箱の前にひれ伏す</h2><p>預言者ヌンの子ヨシュアは、蓋にケルビムの像があり、中に聖なる物が納められた<a href="https://bibleox.com/ru/ru/w/%D0%BA%D0%BE%D0%B2%D1%87%D0%B5%D0%B3_%D0%B7%D0%B0%D0%B2%D0%B5%D1%82%D0%B0">契約の箱</a>の前にひれ伏します。</p><blockquote><p>「ヨシュアは衣服を引き裂き、イスラエルの長老たちと共に、<strong>主の箱の前で夕方まで地にひれ伏し</strong>、頭に塵をかぶった」（<a href="https://bibleox.com/ja/jp-ni/nav/7/#L6">ヨシュ. 7:6</a>）</p></blockquote><h2>三人の天使の姿をとった神の像にひれ伏す</h2><p>アブラハムは三人の人の姿をとった神にひれ伏します。</p><blockquote><p><em>「</em><strong><em>主は［像の姿で］</em></strong><em>マムレの樫の木の所で</em><strong><em>アブラハムに現れた</em></strong><em>（七十人訳ギリシア語 θεὸς —「神」、ヘブライ語 יְהוָ֔ה —「ヤハウェ」）。暑い真昼に、アブラハムは天幕の入り口に座っていた。目を上げて見ると、</em><strong><em>三人の人</em></strong><em>が彼に向かって立っていた。アブラハムはすぐに天幕の入り口から走り出て迎え、</em><strong><em>地にひれ伏して</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/gen/18/#L1-2"><em>創. 18:1-2</em></a><em>）</em></p></blockquote><p>なぜ神は像の姿で現れたのでしょうか。神は本性において見えない方であり、だれも神を見たことがないからです（<a href="https://bibleox.com/ja/jp-ni/1tim/6/#L16">１テモ. 6:16</a>; <a href="https://bibleox.com/ja/jp-ni/in/1/#L18">ヨハ. 1:18</a>）。それにもかかわらず、聖書は、現れたのは神であったと伝えています（<em>ヘブライ語 יְהוָ֔ה —「ヤハウェ」</em>）。</p><h2>物にひれ伏す</h2><blockquote><p>杖に：「『では、誓ってくれ』と言ったので、ヨセフは誓った。<strong>イスラエルは、寝台の枕もとで感謝を表した</strong>」（<a href="https://bibleox.com/ja/jp-ni/gen/47/#L31">創. 47:31</a>）。「感謝を表した」は、ヘブライ語原文では וַיִּשְׁתַּחוּ —「ひれ伏した」です。七十人訳では<strong>杖に</strong>（ギリシア語 προσεκύνησεν Ισραηλ ἐπὶ τὸ ἄκρον τῆς ῥάβδου αὐτοῦ —「イスラエルは自分の杖の先にひれ伏した」）となっています。<a href="https://bibleox.com/ja/jp-ni/evr/11/#L21">ヘブ. 11:21</a>も参照。</p></blockquote><h2>天使にひれ伏す</h2><p>まず注意すべきなのは、天使は霊であり（<a href="https://bibleox.com/ja/jp-ni/evr/1/#L13-14">ヘブ. 1:13-14</a>）、霊には肉も骨もない（<a href="https://bibleox.com/ja/jp-ni/lk/24/#L39">ルカ. 24:39</a>）ということです。つまり、天使もまた人の姿で人々に現れるのです。したがって、だれかが天使にひれ伏すなら、その人は<strong>見えない霊（天使）の見える像にひれ伏している</strong>のです。</p><blockquote><p>「彼は答えた。『いや。わたしは主の軍の将軍である。今、着いたところだ。』ヨシュアは地にひれ伏して<strong>拝し</strong>、彼に、『わが主は、この僕に何をお言いつけになるのですか』と言うと」（<a href="https://bibleox.com/ja/jp-ni/nav/5/#L14">ヨシュ. 5:14</a>）</p></blockquote><blockquote><p>「二人の御使いが夕方ソドムに着いたとき、ロトはソドムの門の所に座っていた。ロトは彼らを見ると、立ち上がって迎え、<strong>地にひれ伏して</strong>」（<a href="https://bibleox.com/ja/jp-ni/gen/19/#L1">創. 19:1</a>）</p></blockquote><blockquote><p>「すると、祭壇から炎が天に上るとき、主の御使いも、その祭壇の炎と共に上って行った。マノアとその妻はそれを見て、<strong>ひれ伏して顔を地につけた</strong>」（<a href="https://bibleox.com/ja/jp-ni/sud/13/#L20">士. 13:20</a>）</p></blockquote><blockquote><p>「その人の話す声が聞こえてきたが、わたしは聞きながら意識を失い、<strong>地に倒れた</strong>」（<a href="https://bibleox.com/ja/jp-ni/dan/10/#L9">ダニ. 10:9</a>）<em>（ヘブライ語原文では「顔を伏せ、顔を地につけて」です。）</em></p></blockquote><blockquote><p>「こう言われてわたしは<strong>顔を地に伏せ</strong>、言葉を失った」（<a href="https://bibleox.com/ja/jp-ni/dan/10/#L15">ダニ. 10:15</a>）</p></blockquote><h2>預言者にひれ伏す</h2><blockquote><p><strong>エリシャに</strong>：「<strong>エリコの預言者の仲間たち</strong>は目の前で彼を見て、『エリヤの霊がエリシャの上にとどまっている』と言い、彼を迎えに行って、<strong>その前で地にひれ伏した</strong>」（<a href="https://bibleox.com/ja/jp-ni/4ts/2/#L15">王下. 2:15</a>）</p></blockquote><blockquote><p>「<strong>オバドヤ</strong>が道を歩いていると、エリヤが彼に会いに来た。オバドヤは<strong>それがエリヤだと分かって、ひれ伏し</strong>、『あなたは、エリヤさまではありませんか』と言った」（<a href="https://bibleox.com/ja/jp-ni/3ts/18/#L7">王上. 18:7</a>）</p></blockquote><blockquote><p>ダニエルに：「これを聞いた<strong>ネブカドネツァル</strong>は<strong>ひれ伏してダニエルを拝し</strong>、献げ物と香を彼に供えさせた」（<a href="https://bibleox.com/ja/jp-ni/dan/2/#L46">ダニ. 2:46</a>）</p></blockquote><blockquote><p>サムエルに：「サウルはその女に言った。『どんな姿だ。』女は言った。『老人が上って来ます。上着をまとっています。』サウルにはそれがサムエルだと分かったので、<strong>顔を地に伏せ、礼をした</strong>」（<a href="https://bibleox.com/ja/jp-ni/1ts/28/#L14">サム上. 28:14</a>）</p></blockquote><blockquote><p>「<strong>アビガイル</strong>はダビデを見ると、急いでろばを降り、<strong>ダビデの前の地にひれ伏し礼をした</strong>」（<a href="https://bibleox.com/ja/jp-ni/1ts/25/#L23">サム上. 25:23</a>）</p></blockquote><h2>民にひれ伏す</h2><blockquote><p>「アブラハムは国の民の前で<strong>挨拶をし</strong>」（<a href="https://bibleox.com/ja/jp-ni/gen/23/#L12">創. 23:12</a>）<em>（「挨拶をし」は、ヘブライ語原文では וַיִּשְׁתַּחוּ —「ひれ伏し」です。）</em></p></blockquote><h2>兄弟にひれ伏す</h2><blockquote><p>「ヤコブはそれから、先頭に進み出て、兄のもとに着くまでに<strong>七度</strong>地に<strong>ひれ伏した</strong>」（<a href="https://bibleox.com/ja/jp-ni/gen/33/#L3">創. 33:3</a>）</p></blockquote><blockquote><p>「ところで、ヨセフはエジプトの司政者として、国民に穀物を販売する監督をしていた。<strong>ヨセフの兄たち</strong>は来て、<strong>地面にひれ伏し、ヨセフを拝した</strong>」（<a href="https://bibleox.com/ja/jp-ni/gen/42/#L6">創. 42:6</a>）</p></blockquote><h2>しゅうとにひれ伏す</h2><blockquote><p>「モーセは出て来てしゅうとを迎え、<strong>身をかがめて</strong>口づけした。彼らは互いに安否を尋ね合ってから、天幕の中に入った」（<a href="https://bibleox.com/ja/jp-ni/ish/18/#L7">出. 18:7</a>）</p></blockquote>
