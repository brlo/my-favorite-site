    path: Bh6l_キリストの復活の前すべての魂は陰府に降った
    title: キリストの復活の前、すべての人の魂は陰府に降った
    title_sub: 義人の魂も含め、すべての魂は、死によって体から離れた後、陰府に降った
    menu: { parent: "人間/死後", title: "キリスト以前はすべて陰府へ", priority: 6 }
    references: |-
      <p>「しかし義人たちは、朽ちることのない、しぼむことのない国を受け継ぐ。彼らは今は陰府に留め置かれているが、不義の者たちと同じ場所にいるのではない。この場所へは一つの降り口があり、その門には一人の大天使が軍勢と共に立っているとわたしたちは信じている。そして、魂のために任命された天使たちに導かれる者たちがこの門を通り過ぎると、彼らは同じ一つの道を進むのではない。義人たちは光の中を右の方へと導かれ、その場所に立つ天使たちに賛美されながら、光に満ちた場所へと連れて行かれる。そして、そこには初めからの義人たちが住んでいる。彼らは必然に支配されることなく、目の前にある恵みを観想することをいつも楽しみ、常に新しいほかの恵みを待ち望むことを喜び、それらをこれらよりも常に優れたものと見なしている。そしてその場所は彼らに何の労苦ももたらさない。そこには焼けつく暑さも、寒さも、とげもない。父祖たちと義人たちの顔はいつもほほえんでいるのが見られる。彼らはこの場所に続く、天における安息と永遠の再生とを待っているのである。わたしたちはこれをアブラハムのふところという名で呼ぶ…</p><p>陰府については以上である。そこにはすべての者の魂が、神が定められた時まで留め置かれている。その時、神はすべての者の復活を成し遂げられる。魂をほかの体に移すことによってではなく、体そのものをよみがえらせることによってである」</p><p>致命者聖ヒッポリュトス（ローマ）。<a href="https://bibleox.com/en/en/w/hippolytus-against-plato-on-the-cause-of-the-universe/">「プラトンに対して、宇宙の原因について」</a>（英語。英訳からの訳）</p><p>「アブラハムのふところとは、父祖たちのひそかな安息でなくて何であろうか。それについて真理は言われる。『言っておくが、いつか、東や西から大勢の人が来て、天の国でアブラハム、イサク、ヤコブと共に宴会の席に着く』（マタ 8:11-12）。紫の衣と柔らかい麻布を着た者が御国の子らと呼ばれるのはふさわしい。彼は遠くからラザロを見ようと目を上げた。不信の者たちは、自分たちの罪の定めの低い所にいて、最後の審判の日まで、自分たちの上に安らっているすべての信者たちを見上げるが、その後は彼らの喜びを決して見ることができないからである」</p><p>大グレゴリオス（対話者）。「福音書についての四十の講話」第40講話（ロシア語からの訳）。</p>
    body: |-
      <h2>旧約の義人たちは死後に陰府に降ることについて語っている</h2><blockquote><p>「わたしの人生は過ぎ去りわたしの計画も心の願いも失われた。夜は昼となり暗黒の後に光が近づくと人は言うが<strong><mark>わたしは陰府に自分のための家を求めその暗黒に寝床を整えた</mark></strong>。墓穴に向かって『あなたはわたしの父』と言い蛆虫に向かって『わたしの母、姉妹』と言う。どこになお、<strong>わたしの希望</strong>があるのか。誰がわたしに希望を見せてくれるのか。<strong><mark>それはことごとく陰府に落ちた</mark></strong>。すべては塵の上に横たわっている」（<a href="https://bibleox.com/ja/jp-ni/iov/17/#L11-16">ヨブ. 17:11-16</a>）<em>（ヘブライ語 שְׁאוֹל בֵּיתִי —「陰府はわたしの家」、ギリシア語 ᾅδης μου ὁ οἶκος —「ハデスはわたしの家」）</em></p></blockquote><blockquote><p>「息子や娘たちが皆やって来て、慰めようとしたが、ヤコブは慰められることを拒んだ。『<strong><mark>ああ、わたしもあの子のところへ、嘆きながら陰府へ下って行こう</mark></strong>。』父はこう言って、ヨセフのために泣いた」（<a href="https://bibleox.com/ja/jp-ni/gen/37/#L35">創. 37:35</a>）<em>（ヘブライ語 שְׁאֹלָה —「陰府へ」、ギリシア語 εἰς ᾅδου —「ハデスへ」）</em></p></blockquote><blockquote><p>「太陽の下に起こるすべてのことの中で最も悪いのは、<strong><mark>だれにでも同じひとつのことが臨むこと</mark></strong>、その上、生きている間、人の心は悪に満ち、思いは狂っていて、<strong><mark>その後は死ぬだけだ</mark>ということ。命あるもののうちに数えられてさえいればまだ安心だ。犬でも、生きていれば、死んだ獅子よりましだ</strong>。生きているものは、少なくとも知っている自分はやがて死ぬ、ということを。しかし、死者はもう何ひとつ知らない。彼らはもう報いを受けることもなく彼らの名は忘れられる」（<a href="https://bibleox.com/ja/jp-ni/ekl/9/#L3-5">コヘ. 9:3-5</a>）</p></blockquote><blockquote><p>「心に留めてくださいわたしがどれだけ続くものであるかをあなたが人の子らをすべていかにむなしいものとして創造されたかを。<strong><mark>命ある人間で、死を見ないものがあるでしょうか。陰府の手から魂を救い出せるものがひとりでもあるでしょうか</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/ps/89/#L48-49">詩. 89:48-49</a>）<em>（ヘブライ語 מִיַּד־שְׁאוֹל —「陰府の手から」）</em></p></blockquote><h2>キリストの復活の後の天の現実の変化</h2><p>キリスト以前には、永眠した義人たちの魂が天で神と共にある生に達していなかったことを確かめるには、キリスト以前の天の現実の描写と、キリストの復活の後の描写とを比べることができます。</p><p>キリスト以前には、天の現実は山の上で預言者モーセに示されました。預言者が、見た像に従って地上の神殿（幕屋、聖所）を造るためです：</p><blockquote><p><em>「</em><strong><em><mark>わたしのための聖なる所を彼らに造らせなさい</mark></em></strong><em>。わたしは彼らの中に住むであろう。</em><strong><em><mark>わたしが示す作り方に正しく従って</mark></em></strong><em>、</em><strong><em>幕屋</em></strong><em>とそのすべての祭具を</em><strong><em>作りなさい</em></strong><em>。&lt;…&gt; あなたは</em><strong><em>この山で示された作り方に従い、注意して作りなさい</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/ish/25/#L8-9,40"><em>出. 25:8-9,40</em></a><em>）</em></p></blockquote><blockquote><p><em>「なぜならキリストは、</em><strong><em><mark>まことのものの写しにすぎない</mark>、人間の手で造られた聖所</em></strong><em>にではなく、天そのものに入り、今やわたしたちのために神の御前に現れてくださったからです」（</em><a href="https://bibleox.com/ja/jp-ni/evr/9/#L24"><em>ヘブ. 9:24</em></a><em>）</em></p></blockquote><p>旧約の神殿の<a href="https://bibleox.com/ru/ru/w/%D0%B8%D0%B5%D1%80%D1%83%D1%81%D0%B0%D0%BB%D0%B8%D0%BC%D1%81%D0%BA%D0%B8%D0%B9-%D1%85%D1%80%D0%B0%D0%BC">構造</a>と像を調べると、キリストのいけにえの前には、天には神（見えない仕方で）と聖なる天使たちだけがいることが分かります（<a href="https://bibleox.com/ja/jp-ni/3ts/6/#L29">王上. 6:29</a>）。</p><p>キリストの復活と昇天の後、その人性において見える神が天に座しておられ（<a href="https://bibleox.com/ja/jp-ni/ef/1/#L20-21">エフェ. 1:20-21</a>; <a href="https://bibleox.com/ja/jp-ni/otkr/3/#L21">黙. 3:21</a>）、そこには天使たちが今もとどまり（<a href="https://bibleox.com/ja/jp-ni/otkr/8/#L3">黙. 8:3</a>; <a href="https://bibleox.com/ja/jp-ni/otkr/15/#L6">黙. 15:6</a>）、義人たちの魂も現れます（<a href="https://bibleox.com/ja/jp-ni/otkr/6/#L9-11">黙. 6:9-11</a>; <a href="https://bibleox.com/ja/jp-ni/otkr/14/#L1,3-5">黙. 14:1,3-5</a>）。この新しい天の現実を、わたしたちは神学者ヨハネの黙示録に見ます。</p><p>このように、新しい天の現実においては、神と天使たちのほかに、キリストの復活の前にはそこにいなかった義人たちの魂も現れるのです。</p><h3>旧約 — 神殿には神と天使たちだけ</h3><p>キリストのいけにえの前、旧約において神は預言者モーセに山の上で神殿を示し、地上ではすべてを示された像に従って作るよう命じられます（<a href="https://bibleox.com/ja/jp-ni/ish/25/#L8-9,40">出. 25:8-9,40</a>; <a href="https://bibleox.com/ja/jp-ni/evr/9/#L24">ヘブ. 9:24</a>）。結局モーセは神殿を造りますが、そこでは神はまったく描かれておらず、神の現れる場所（契約の箱の蓋）の周りには天使の像が置かれ、すべての壁と垂れ幕にも天使の像があります。</p><h4>見えない神</h4><p>神の命令によって建てられた旧約の神殿には、神の像はありませんでした。神は見えない方だったからです。最も大切な場所には聖なる物を納めた契約の箱だけが置かれ、その蓋の上、二体のケルビムの間で神は御自身を現し、語られました：</p><blockquote><p><em>「</em><strong><em>わたしは掟の箱の上の一対のケルビムの間、すなわち贖いの座の上からあなたに臨み</em></strong><em>、わたしがイスラエルの人々に命じることをことごとくあなたに語る」（</em><a href="https://bibleox.com/ja/jp-ni/ish/25/#L22"><em>出. 25:22</em></a><em>）</em></p></blockquote><h4>聖なる天使たち</h4><p>神殿は至る所、天使（ケルビム）の像で満たされていました：</p><blockquote><p><em>「</em><strong><em>打ち出し作りで一対のケルビムを作り、贖いの座の両端</em></strong><em>、すなわち、一つを一方の端に、もう一つを他の端に付けなさい。一対のケルビムを贖いの座の一部としてその両端に作る。一対のケルビムは顔を贖いの座に向けて向かい合い、翼を広げてそれを覆う」（</em><a href="https://bibleox.com/ja/jp-ni/ish/25/#L18-20"><em>出. 25:18-20</em></a><em>）</em></p></blockquote><blockquote><p><em>「</em><strong><em>ソロモンはオリーブ材で二体のケルビムを作り、内陣に据えた</em></strong><em>。その高さは十アンマであった。&lt;…&gt; </em><strong><em>ソロモンはこのケルビムを神殿の奥に置いた</em></strong><em>。二体のケルビムはそれぞれ翼を広げ、一方のケルビムの翼が一方の壁に触れ、もう一方のケルビムの翼も、もう一方の壁に触れていた。また、それぞれの内側に向かった翼は接し合っていた」（</em><a href="https://bibleox.com/ja/jp-ni/3ts/6/#L23,27"><em>王上. 6:23,27</em></a><em>）</em></p></blockquote><blockquote><p><em>「彼は、青の織物、深紅の織物、緋の織物、麻の織物で</em><strong><em>垂れ幕</em></strong><em>を作ったが、</em><strong><em>それにもケルビムの縫い取りを施した</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/2par/3/#L14"><em>代下. 3:14</em></a><em>）（</em><a href="https://bibleox.com/ja/jp-ni/1mak/1/#L22"><em>１マカ. 1:22</em></a><em>）</em></p></blockquote><blockquote><p><em>「</em><strong><em>神殿の周囲の壁面はすべて、内側の部屋も外側の部屋も、ケルビム</em></strong><em>となつめやしと花模様の浮き彫りが施されていた」（</em><a href="https://bibleox.com/ja/jp-ni/3ts/6/#L29"><em>王上. 6:29</em></a><em>）</em></p></blockquote><p>神殿の構造について詳しく：<a href="https://bibleox.com/ru/ru/w/%D0%B8%D0%B5%D1%80%D1%83%D1%81%D0%B0%D0%BB%D0%B8%D0%BC%D1%81%D0%BA%D0%B8%D0%B9-%D1%85%D1%80%D0%B0%D0%BC">エルサレムの神殿</a></p><h3>新約 — 神殿には神、天使たち、義人たちの魂</h3><p>神の子の受肉と死に対する勝利の後、わたしたちは別の天の現実を見ます。それは神学者ヨハネによって黙示録に描かれています。第一に、神は見える方となり、玉座に着かれます。第二に、今や天で神に仕えているのは天使たちだけでなく、聖なる義人たちの多くの魂でもあります。</p><h4>キリスト</h4><blockquote><p>「主イエスは、弟子たちに話した後、天に上げられ、<strong><mark>神の右の座に着かれた</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/mk/16/#L19">マコ. 16:19</a>）</p></blockquote><blockquote><p>「神は、この力をキリストに働かせて、キリストを死者の中から復活させ、<strong><mark>天において御自分の右の座に着かせ</mark></strong>、すべての支配、権威、勢力、主権の上に置き、今の世ばかりでなく、来るべき世にも唱えられるあらゆる名の上に置かれました」（<a href="https://bibleox.com/ja/jp-ni/ef/1/#L20-21">エフェ. 1:20-21</a>）</p></blockquote><blockquote><p>「勝利を得る者を、わたしは<strong>自分の座</strong>に共に座らせよう。わたしが勝利を得て、<strong><mark>わたしの父と共にその玉座に着いた</mark></strong>のと同じように」（<a href="https://bibleox.com/ja/jp-ni/otkr/3/#L21">黙. 3:21</a>）</p></blockquote><h4>聖なる天使たち</h4><blockquote><p><em>「また、別の</em><strong><em>天使</em></strong><em>が来て、手に金の香炉を持って祭壇のそばに立つと、この天使に多くの香が渡された。すべての聖なる者たちの祈りに添えて、玉座の前にある金の祭壇に献げるためである」（</em><a href="https://bibleox.com/ja/jp-ni/otkr/8/#L3"><em>黙. 8:3</em></a><em>）</em></p></blockquote><blockquote><p><em>「そして、この神殿から、七つの災いを携えた七人の</em><strong><em>天使</em></strong><em>が出て来た。天使たちは、輝く清い亜麻布の衣を着て、胸に金の帯を締めていた」（</em><a href="https://bibleox.com/ja/jp-ni/otkr/15/#L6"><em>黙. 15:6</em></a><em>）</em></p></blockquote><h4>聖なる義人たちの魂</h4><blockquote><p><em>「小羊が第五の封印を開いたとき、</em><strong><em>神の言葉と自分たちがたてた証しのために殺された人々の<mark>魂</mark>を、わたしは祭壇の下に見た</em></strong><em>。彼らは大声でこう叫んだ。『真実で聖なる主よ、いつまで裁きを行わず、地に住む者にわたしたちの血の復讐をなさらないのですか。』すると、その一人一人に、</em><strong><em>白い衣</em></strong><em>が与えられ、また、</em><strong><em>自分たちと同じように殺されようとしている兄弟であり</em></strong><em>、仲間の僕である者たちの</em><strong><em>数が満ちるまで</em></strong><em>、なお、しばらく静かに待つようにと告げられた」（</em><a href="https://bibleox.com/ja/jp-ni/otkr/6/#L9-11"><em>黙. 6:9-11</em></a><em>）</em></p></blockquote><blockquote><p><em>「また、わたしが見ていると、見よ、</em><strong><em>小羊</em></strong><em>がシオンの山に立っており、</em><strong><em>小羊と共に<mark>十四万四千人</mark>の者たち</em></strong><em>がいて、その額には小羊の名と、小羊の父の名とが記されていた。&lt;…&gt; 彼らは、玉座の前、また四つの生き物と長老たちの前で、新しい歌のたぐいをうたった。この歌は、</em><strong><em><mark>地上から贖われた</mark></em></strong><em>十四万四千人の者たちのほかは、覚えることができなかった。彼らは、</em><strong><em>女に触れて身を汚したことのない者</em></strong><em>である。彼らは童貞だからである。この者たちは、</em><strong><em>小羊の行くところへは、どこへでも従って行く</em></strong><em>。この者たちは、神と小羊に献げられる初穂として、人々の中から贖われた者たちで、その口には偽りがなく、とがめられるところのない者たちである」（</em><a href="https://bibleox.com/ja/jp-ni/otkr/14/#L1,3-5"><em>黙. 14:1,3-5</em></a><em>）</em></p></blockquote><h2>天から降って来た御子のほかには、天に上った者はだれもいない</h2><blockquote><p>「<strong><mark>天から降って来た者、すなわち人の子のほかには、天に上った者はだれもいない</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/in/3/#L13">ヨハ. 3:13</a>）</p></blockquote><blockquote><p>「兄弟たち、<strong>先祖ダビデについては、彼は死んで葬られ</strong>、その墓は今でもわたしたちのところにあると、はっきり言えます。&lt;…&gt; <strong><mark>ダビデは天に昇りませんでした</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/act/2/#L29,34">使. 2:29,34</a>）</p></blockquote><h2>「わたしの魂を陰府に捨てておかず」 — ダビデについて言われたのではない</h2><p>ダビデ王が詩編（<a href="https://bibleox.com/ja/jp-ni/ps/16/#L10">詩. 16:10</a>）で語った、魂は陰府に捨てておかれず、肉は朽ち果てることがないという預言は、ダビデについてではなく、キリストについてのものです。したがって、ダビデ王の<strong>肉</strong>は朽ち果て、彼の<strong>魂</strong>はキリストが陰府に降られるまで陰府に捨てておかれたのです。</p><blockquote><p>「あなたは、わたしの魂を陰府に捨てておかず、あなたの聖なる者を朽ち果てるままにしておかれない。&lt;…&gt; 兄弟たち、<strong>先祖ダビデについては、彼は死んで葬られ</strong>、その墓は今でもわたしたちのところにあると、はっきり言えます。&lt;…&gt; そして、<strong><mark>キリストの復活について前もって知り、『彼は陰府に捨てておかれず、その体は朽ち果てることがない』と語りました</mark></strong>。&lt;…&gt; <strong>ダビデは天に昇りませんでした</strong>」（<a href="https://bibleox.com/ja/jp-ni/act/2/#L27,29,31,34">使. 2:27,29,31,34</a>）<em>（ビザンティン本文（多数派写本）では「<strong>彼の魂</strong>（ἡ ψυχὴ αὐτοῦ）は陰府に捨てておかれず、彼の肉は朽ち果てることがない」となっています。）</em></p></blockquote><h2>キリストは陰府に降って宣べ伝え、御自身が出て来られ、義人たちを陰府から連れ出された</h2><p>陰府でキリストは、世界的な洪水の時からそこにいた霊（魂）たちに宣べ伝えられました：</p><blockquote><p>「キリストも、罪のためにただ一度苦しまれました。正しい方が、正しくない者たちのために苦しまれたのです。あなたがたを神のもとへ導くためです。<strong>キリストは、肉では死に渡されましたが、霊では生きる者とされたのです</strong>。そして、霊においてキリストは、<strong><mark>捕らわれていた霊たちのところへ行って宣教されました</mark></strong>。この霊たちは、ノアの時代に箱舟が作られていた間、神が忍耐して待っておられたのに従わなかった者です」（<a href="https://bibleox.com/ja/jp-ni/1pet/3/#L18-20">１ペト. 3:18-20</a>）</p><p>「彼らは、生きている者と死んだ者とを裁こうとしておられる方に、申し開きをしなければなりません。<strong><mark>死んだ者にも福音が告げ知らされたのは</mark></strong>、彼らが、人間の見方からすれば、肉において裁かれて死んだようでも、神との関係で、霊において生きるようになるためなのです」（<a href="https://bibleox.com/ja/jp-ni/1pet/4/#L5-6">１ペト. 4:5-6</a>）</p></blockquote><h2>義人たちは陰府に捕らわれていたが、キリストはこの捕囚を打ち破られた</h2><blockquote><p>「そこで、『高い所に昇るとき、<strong><mark>捕らわれ人を連れて行き</mark></strong>、人々に賜物を分け与えられた』と言われています。<strong>『昇った』というのですから、低い所、地上に降りておられたのではないでしょうか</strong>」（<a href="https://bibleox.com/ja/jp-ni/ef/4/#L8-9">エフェ. 4:8-9</a>）<em>（「低い所、地上に」は、ギリシア語原文では εἰς τὰ κατώτερα μέρη τῆς γῆς —「地の低い所に」です。ビザンティン本文（多数派写本）では「<strong>まず</strong>（πρῶτον）地の低い所に降りておられた」となっています。）</em></p></blockquote><blockquote><p>「恐れるな。わたしは最初の者にして最後の者、また生きている者である。一度は死んだが、見よ、世々限りなく生きて、<strong><mark>死と陰府の鍵を持っている</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/otkr/1/#L17-18">黙. 1:17-18</a>）</p></blockquote><h2>旧約のすべての義人は約束されたものを受けず、新約の義人たちを除いては完全な者とされなかった</h2><p>彼らは天のものを待ち望み、求めましたが、それを受けませんでした：</p><blockquote><p>「信仰とは、<strong>望んでいる</strong>事柄を<strong>確信し</strong>、見えない事実を確認することです。&lt;…&gt; 信仰によって、アベルは &lt;…&gt; 信仰によって、エノクは &lt;…&gt; ノアは &lt;…&gt; アブラハムは &lt;…&gt; 信仰によって、アブラハムは<strong>他国に宿るようにして約束の地に住み</strong>、同じ約束されたものを共に受け継ぐ者であるイサク、ヤコブと一緒に幕屋に住みました。<strong><mark>アブラハムは、</mark><u><mark>神が設計者であり建設者である</mark></u><mark>堅固な土台を持つ</mark><u><mark>都</mark></u><mark>を待望していたからです</mark></strong>。信仰によって、不妊の女サラ自身も &lt;…&gt; <strong><mark>この人たちは皆、信仰を抱いて死にました。約束されたものを手に入れませんでしたが</mark></strong>、<strong><u><mark>はるかにそれを見て喜びの声をあげ</mark></u></strong>、自分たちが地上ではよそ者であり、仮住まいの者であることを公に言い表したのです。このように言う人たちは、自分が故郷を探し求めていることを明らかに表しているのです。もし出て来た土地のことを思っていたのなら、戻るのに良い機会もあったかもしれません。ところが実際は、<strong><mark>彼らは更にまさった故郷、すなわち</mark><u><mark>天の</mark></u><mark>故郷を熱望していたのです</mark></strong>。だから、神は彼らの神と呼ばれることを恥となさいません。<strong><mark>神は、彼らのために都を準備されていたからです</mark></strong>。信仰によって、アブラハムは &lt;…&gt; イサクは &lt;…&gt; ヨセフは &lt;…&gt; モーセは &lt;…&gt; これ以上、何を話そう。もしギデオン、バラク、サムソン、エフタ、ダビデ、サムエル、また預言者たちのことを語るなら、時間が足りないでしょう。&lt;…&gt; ところで、<strong><em><u><mark>この人たちはすべて</mark></u>、その信仰のゆえに神に認められながらも、<u><mark>約束されたものを手に入れませんでした</mark></u></em></strong>。神は、わたしたちのために、更にまさったものを計画してくださったので、<strong><mark>わたしたちを除いては、彼らは完全な状態に達しなかったのです</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/evr/11/#L1-2,4-5,7-11,13-17,20-23,32,39-40">ヘブ. 11:1-2,4-5,7-11,13-17,20-23,32,39-40</a>）</p></blockquote><h2>キリストのいけにえは、信じる義人たちを以前に犯された罪から解き放つ</h2><blockquote><p>「さて、わたしたちが知っているように、すべて律法の言うところは、律法の下にいる人々に向けられています。それは、すべての人の口がふさがれて、全世界が神の裁きに服するようになるためなのです。なぜなら、<strong><mark>律法を実行することによっては、だれ一人神の前で義とされないからです</mark></strong>。律法によっては、罪の自覚しか生じないのです。<strong><mark>ところが今や、律法とは関係なく</mark></strong>、<strong>しかも律法と預言者によって立証されて、<mark>神の義が示されました</mark>。すなわち、<mark>イエス・キリストを信じることにより、信じる者すべてに与えられる神の義です</mark></strong>。<strong><mark>そこには何の差別もありません</mark></strong>。<strong><mark>人は皆、罪を犯して神の栄光を受けられなくなっていますが</mark>、ただ<mark>キリスト・イエスによる贖いの業を通して</mark>、神の恵みにより無償で<mark>義とされるのです</mark>。<mark>神はこのキリストを立て</mark></strong>、その血によって信じる者のために<strong><mark>罪を償う供え物となさいました</mark></strong>。それは、<strong><mark>今まで人が犯した罪を見逃して</mark></strong>、神の義をお示しになるためです。このように神は忍耐してこられたが、<strong><mark>今この時に義を示されたのは</mark></strong>、御自分が正しい方であることを明らかにし、イエスを信じる者を義となさるためです。では、人の誇りはどこにあるのか。それは取り除かれました。どんな法則によってか。行いの法則によるのか。そうではない。信仰の法則によってです」（<a href="https://bibleox.com/ja/jp-ni/rim/3/#L19-27">ロマ. 3:19-27</a>）</p></blockquote>

  - src: "bib_Неодинаковая_мера_воздаяния:_мучения_и_блаженства"
    path: Ud50m_報いの程度は同じではない
    title: 報いの程度は同じではない — 苦しみと至福
    menu: { parent: "人間/死後", title: "報いの程度は同じではない", priority: 50 }
    body: |-
      <h2>地獄の苦しみは同じではない</h2><h3>知っていて背いた者は、知らずに背いた者よりも厳しく罰せられる</h3><blockquote><p>「<strong>主人の思いを知りながら</strong>何も準備せず、<strong>あるいは主人の思いどおりにしなかった僕は、<mark>ひどく鞭打たれる</mark>。しかし、知らずにいて</strong>鞭打たれるようなことを<strong>した者は、<mark>打たれても少しで済む</mark></strong>。すべて多く与えられた者は、多く求められ、<strong>多く任された者は、更に多く要求される</strong>」（<a href="https://bibleox.com/ja/jp-ni/lk/12/#L47-48">ルカ. 12:47-48</a>）</p></blockquote><h3>偽善者はより厳しい裁きを受ける</h3><blockquote><p>「〔<strong>律法学者とファリサイ派の人々、あなたたち偽善者は不幸だ</strong>。やもめの家を食い物にし、見せかけの長い祈りをする。<strong><mark>だからあなたたちは、人一倍厳しい裁きを受けることになる</mark></strong>。〕」（<a href="https://bibleox.com/ja/jp-ni/mf/23/#L14">マタ. 23:14</a>）<em>（新共同訳はこの節を〔　〕に入れていますが、ビザンティン本文（多数派写本）では本文の一部です。）</em></p></blockquote><blockquote><p>「<strong>律法学者に気をつけなさい。彼らは長い衣をまとって歩き回りたがり</strong>、また、広場で挨拶されること、会堂では上席、宴会では上座に座ることを好む。そして、やもめの家を食い物にし、見せかけの長い祈りをする。<strong><mark>このような者たちは、人一倍厳しい裁きを受けることになる</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/lk/20/#L46-47">ルカ. 20:46-47</a>）</p></blockquote><h3>罪を犯す教師はより厳しい裁きを受ける</h3><blockquote><p>「わたしの兄弟たち、<strong><mark>あなたがたのうち多くの人が教師になってはなりません</mark>。わたしたち教師がほかの人たちより<mark>厳しい裁きを受けることになる</mark>と、あなたがたは知っています</strong>。わたしたちは皆、度々過ちを犯すからです。言葉で過ちを犯さないなら、それは自分の全身を制御できる完全な人です」（<a href="https://bibleox.com/ja/jp-ni/iak/3/#L1-2">ヤコ. 3:1-2</a>）</p></blockquote><h3>キリスト以前の罪深い町々は、明らかな奇跡が示されてもキリストを拒んだ町々よりも、裁きの時に軽い罰で済む</h3><blockquote><p>「しかし、言っておく。<strong>裁きの日にはティルスやシドンの方が、お前たちよりまだ軽い罰で済む</strong>。また、カファルナウム、お前は、天にまで上げられるとでも思っているのか。陰府にまで落とされるのだ。お前のところでなされた奇跡が、ソドムで行われていれば、あの町は今日まで無事だったにちがいない。しかし、言っておく。<strong><mark>裁きの日にはソドムの地の方が、お前よりまだ軽い罰で済むのである</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/mf/11/#L22-24">マタ. 11:22-24</a>）</p></blockquote><blockquote><p>「しかし、<strong>あなたがたを迎え入れず</strong>、あなたがたに耳を傾けようともしない所があったら、そこを出ていくとき、彼らへの証しとして足の裏の埃を払い落としなさい」（<a href="https://bibleox.com/ja/jp-ni/mk/6/#L11">マコ. 6:11</a>）<em>（ビザンティン本文（多数派写本）では、この節にさらに「はっきり言っておく。<mark>裁きの日には、この町よりもソドムやゴモラの方が軽い罰で済む</mark>」という言葉があります。）</em>「はっきり言っておく。<strong><mark>裁きの日には、この町よりもソドムやゴモラの地の方が軽い罰で済む</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/mf/10/#L14-15">マタ. 10:14-15</a>）</p></blockquote><blockquote><p>「コラジン、お前は不幸だ。ベトサイダ、お前は不幸だ。お前たちのところでなされた奇跡がティルスやシドンで行われていれば、これらの町はとうの昔に粗布をまとい、灰の中に座って悔い改めたにちがいない。しかし、<strong><mark>裁きの時には、お前たちよりまだティルスやシドンの方が軽い罰で済む</mark></strong>。また、カファルナウム、お前は、天にまで上げられるとでも思っているのか。陰府にまで落とされるのだ」（<a href="https://bibleox.com/ja/jp-ni/lk/10/#L13-15">ルカ. 10:13-15</a>; <a href="https://bibleox.com/ja/jp-ni/mf/11/#L20-22">マタ. 11:20-22</a>）</p></blockquote><h3>つまずきをもたらす者は不幸である</h3><blockquote><p>「イエスは弟子たちに言われた。『<strong>つまずきは避けられない。だが、それをもたらす者は<mark>不幸である</mark>。そのような者は</strong>、これらの小さい者の一人をつまずかせるよりも、<strong>首にひき臼を懸けられて</strong>、海に投げ込まれてしまう<strong><mark>方がましである</mark></strong>』」（<a href="https://bibleox.com/ja/jp-ni/lk/17/#L1-2">ルカ. 17:1-2</a>）</p></blockquote><h3>信じる者をつまずかせる者は不幸である</h3><blockquote><p>「わたしの名のためにこのような一人の子供を受け入れる者は、わたしを受け入れるのである。<strong>しかし、わたしを信じるこれらの小さな者の一人を<mark>つまずかせる者は</mark>、大きな石臼を首に懸けられて、深い海に沈められる<mark>方がましである</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/mf/18/#L5-6">マタ. 18:5-6</a>）</p></blockquote><h3>キリストを裏切る者は不幸である。生まれなかった方がよかった</h3><blockquote><p>「人の子は、聖書に書いてあるとおりに、去って行く。だが、<strong><mark>人の子を裏切るその者は不幸だ。生まれなかった方が、その者のためによかった</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/mf/26/#L24">マタ. 26:24</a>; <a href="https://bibleox.com/ja/jp-ni/mk/14/#L21">マコ. 14:21</a>; <a href="https://bibleox.com/ja/jp-ni/lk/22/#L22">ルカ. 22:22</a>）</p></blockquote><h2>天の国の至福は同じではない</h2><h3>善の程度に応じた報い</h3><blockquote><p><em>「人にではなく主に仕えるように、喜んで仕えなさい。</em><strong><em>あなたがたも知っているとおり</em></strong><em>、奴隷であっても自由な身分の者であっても、</em><strong><em><mark>善いことを行えば、だれでも主から報いを受けるのです</mark></em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/ef/6/#L7-8"><em>エフェ. 6:7-8</em></a><em>）</em></p></blockquote><blockquote><p>「わたしは植え、アポロは水を注いだ。しかし、成長させてくださったのは神です。ですから、大切なのは、植える者でも水を注ぐ者でもなく、成長させてくださる神です。植える者と水を注ぐ者とは一つですが、<strong><mark>それぞれが働きに応じて</mark>自分の報酬を受け取ることになります</strong>」（<a href="https://bibleox.com/ja/jp-ni/1kor/3/#L6-8">１コリ. 3:6-8</a>）</p></blockquote><blockquote><p>「つまり、こういうことです。<strong><mark>惜しんでわずかしか種を蒔かない者は、刈り入れもわずかで、惜しまず豊かに蒔く人は、刈り入れも豊かなのです</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/2kor/9/#L6">２コリ. 9:6</a>）</p></blockquote><blockquote><p>「人の子は、父の栄光に輝いて天使たちと共に来るが、そのとき、<strong>それぞれの行いに応じて報いるのである</strong>」（<a href="https://bibleox.com/ja/jp-ni/mf/16/#L27">マタ. 16:27</a>）（<a href="https://bibleox.com/ja/jp-ni/rim/2/#L5-6">ロマ. 2:5-6</a>）</p></blockquote><blockquote><p>「与えなさい。そうすれば、あなたがたにも与えられる。押し入れ、揺すり入れ、あふれるほどに<strong>量り</strong>をよくして、<strong>ふところに入れてもらえる</strong>。<strong><mark>あなたがたは自分の量る秤で量り返されるからである</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/lk/6/#L38">ルカ. 6:38</a>）</p></blockquote><h3>使徒はより多くを目指す</h3><blockquote><p><em>「</em><strong><em>わたしは、既にそれを得たというわけではなく</em></strong><em>、既に完全な者となっているわけでもありません。</em><strong><em>何とかして捕らえようと努めているのです</em></strong><em>。自分がキリスト・イエスに捕らえられているからです。兄弟たち、</em><strong><em><mark>わたし自身は既に捕らえたとは思っていません</mark></em></strong><em>。なすべきことはただ一つ、後ろのものを忘れ、前のものに全身を向けつつ、</em><strong><em><mark>神がキリスト・イエスによって上へ召して、お与えになる賞を得るために、目標を目指してひたすら走ることです</mark></em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/fil/3/#L12-14"><em>フィリ. 3:12-14</em></a><em>）</em></p></blockquote><h3>掟を守り、ほかの人にも守るよう教える者は、大いなる者と呼ばれる</h3><blockquote><p>「だから、これらの最も小さな掟を一つでも破り、そうするようにと人に教える者は、天の国で最も小さい者と呼ばれる。しかし、<strong><mark>それを守り、そうするように教える者は</mark>、天の国で<mark>大いなる者と呼ばれる</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/mf/5/#L19">マタ. 5:19</a>）</p></blockquote><h3>天の国には住む所がたくさんある</h3><blockquote><p>「<strong>わたしの父の家には住む所がたくさんある</strong>。もしなければ、あなたがたのために場所を用意しに行くと言ったであろうか」（<a href="https://bibleox.com/ja/jp-ni/in/14/#L2">ヨハ. 14:2</a>）</p></blockquote><h3>預言者の報いと正しい者の報い</h3><blockquote><p>「あなたがたを受け入れる人は、わたしを受け入れ、わたしを受け入れる人は、わたしを遣わされた方を受け入れるのである。<strong>預言者を預言者として受け入れる人は、<mark>預言者と同じ報い</mark>を受け</strong>、<strong>正しい者を正しい者として受け入れる人は、<mark>正しい者と同じ報い</mark>を受ける</strong>」（<a href="https://bibleox.com/ja/jp-ni/mf/10/#L40-41">マタ. 10:40-41</a>）</p></blockquote><h3>僕たちは異なる報いを受ける</h3><blockquote><p>「さて、彼は王の位を受けて帰って来ると、金を渡しておいた僕を呼んで来させ、どれだけ利益を上げたかを知ろうとした。最初の者が進み出て、『御主人様、あなたの一ムナで十ムナもうけました』と言った。主人は言った。『良い僕だ。よくやった。お前はごく小さな事に忠実だったから、<strong><mark>十の町</mark>の支配権を授けよう</strong>。』二番目の者が来て、『御主人様、あなたの一ムナで五ムナ稼ぎました』と言った。主人は、『<strong>お前は<mark>五つの町</mark>を治めよ</strong>』と言った」（<a href="https://bibleox.com/ja/jp-ni/lk/19/#L15-19">ルカ. 19:15-19</a>）</p></blockquote><blockquote><p>「天の国はまた次のようにたとえられる。ある人が旅行に出かけるとき、僕たちを呼んで、<strong>自分の財産を預けた</strong>。<strong>それぞれの力に応じて</strong>、<strong>一人には五タラントン、一人には二タラントン、もう一人には一タラントンを預けて</strong>旅に出かけた。&lt;…&gt; まず、<strong>五タラントン預かった者が進み出て、ほかの五タラントンを差し出して</strong>言った。&lt;…&gt;『御主人様、二タラントンお預けになりましたが、御覧ください。ほかに二タラントンもうけました。』&lt;…&gt; ところで、一タラントン預かった者も進み出て言った。『御主人様、あなたは蒔かない所から刈り取り、散らさない所からかき集められる厳しい方だと知っていましたので、恐ろしくなり、出かけて行って、あなたのタラントンを地の中に隠しておきました。御覧ください。これがあなたのお金です。』主人は答えた。『怠け者の悪い僕だ。わたしが蒔かない所から刈り取り、散らさない所からかき集めることを知っていたのか。それなら、わたしの金を銀行に入れておくべきであった。そうしておけば、帰って来たとき、利息付きで返してもらえたのに。さあ、<strong>そのタラントンをこの男から取り上げて、十タラントン持っている者に与えよ</strong>。だれでも持っている人は更に与えられて豊かになるが、持っていない人は持っているものまでも取り上げられる。この役に立たない僕を外の暗闇に追い出せ。そこで泣きわめいて歯ぎしりするだろう』」（<a href="https://bibleox.com/ja/jp-ni/mf/25/#L14-30">マタ. 25:14-30</a>）</p></blockquote><p>*すべての者が等しく報いを受けるぶどう園の労働者のたとえ（<a href="https://bibleox.com/ja/jp-ni/mf/20/#L1-16">マタ. 20:1-16</a>）は、ファリサイ派の人々のいる前で語られました（<a href="https://bibleox.com/ja/jp-ni/mf/19/#L3">マタ. 19:3</a>）。それは、ある人々がほかの人々に対して高ぶらないように、すなわち、早く来てより多く働いた者が、後になって立ち帰り、少なく働いた者に対して高ぶらないように語られたのです。遅い、短い時間であっても、必要なものを得ることはできるのですから、落胆してはなりません。</p><h3>童貞者はキリストに特別に近い</h3><blockquote><p>「彼らは、<strong>女に触れて身を汚したことのない者</strong>である。彼らは童貞だからである。<strong><mark>この者たちは、小羊の行くところへは、どこへでも従って行く</mark></strong>。この者たちは、神と小羊に献げられる初穂として、人々の中から贖われた者たちで」（<a href="https://bibleox.com/ja/jp-ni/otkr/14/#L4">黙. 14:4</a>）</p></blockquote>
