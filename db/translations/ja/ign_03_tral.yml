  - src: ИгнАн_Тр
    path: Ig1T_トラレスの教会への手紙
    title: トラレスの教会への手紙
    meta_desc: アンティオキアの聖イグナティオス（テオフォロス）がトラレスの教会に宛てた手紙。ギリシア語原文からの翻訳と注。
    menu: { parent: "手紙", title: "トラレスの教会への手紙", priority: 6 }
    body: |-
      <h2>0</h2><p>イグナティオス、またの名をテオフォロスより、イエス・キリストの父なる神に愛され、アジアのトラレスにある聖なる教会、選ばれ、神にふさわしい教会、私たちの希望であるイエス・キリストの受難によって、また、この方へと私たちがよみがえる復活によって、肉においても霊においても平和を得ている教会へ。私はこの教会に、使徒の流儀にならって満ちあふれる挨拶を送り[1]、心からの喜びを祈ります。</p>
      <h2>1</h2><p>1. あなたがたが、忍耐のうちに、汚れのない揺るがない思いを持っていることを私は知りました。それは一時の習いによるのではなく、本性によるものです。あなたがたの主教ポリュビオスがそのことを私に明らかにしてくれました。彼は神とイエス・キリストの御心によってスミルナに来て、キリスト・イエスにあって縛られている私と共に大いに喜んでくれたので、私は彼のうちにあなたがたの群れ全体を見たほどです。</p><p>2. こうして私は、神に従うあなたがたの好意を彼を通して受け、神をたたえました。私が知っていたとおり、あなたがたが神に倣う者であることを見いだしたからです[2]。</p>
      <h2>2</h2><p>1. あなたがたがイエス・キリストに従うように主教に従っているとき、あなたがたは人間に従って生きているのではなく、私たちのために死なれたイエス・キリストに従って生きているのだと私には見えます。それは、あなたがたがこの方の死を信じて、死を免れるためです。</p><p>2. ですから、あなたがたが今しているように、主教を抜きにして何も行わないことが必要です。また、私たちの希望であるイエス・キリストの使徒たちに従うように、司祭団にも従いなさい。この方のうちに生きるなら、私たちは（この方のうちに）見いだされるでしょう。</p><p>3. イエス・キリストの秘義に仕える輔祭たち[3]も、あらゆる仕方ですべての人に喜ばれなければなりません。彼らは食べ物や飲み物に仕える者ではなく、神の教会に仕える者だからです[4]。ですから、彼らは非難を火のように避けなければなりません。</p>
      <h2>3</h2><p>1. 同じように、すべての人は輔祭たちをイエス・キリストのように敬いなさい。また主教を父の型[5]として、司祭たちを神の会議として、使徒たちの集まりとして敬いなさい。これらを抜きにしては、教会と呼ばれるものはありません。</p><p>2. あなたがたがこのことをそのとおりに心得ていると、私は確信しています。私はあなたがたの愛の生きた手本をあなたがたの主教のうちに受け取り、今も私のもとに持っています。彼のたたずまいそのものが大いなる教えであり、その柔和さが力なのです。神を信じない者たちでさえ、彼を敬うだろうと私は思います。</p><p>3. 私はあなたがたを愛しているので、このことについてもっと厳しく書くこともできるのですが、控えています。罪に定められた者でありながら、使徒のようにあなたがたに命じようなどとは、私は思ってもいません。</p>
      <h2>4</h2><p>1. 私は神において多くのことを悟っていますが、自分を量り知ることにしています。誇りによって滅びないためです。今こそ私はいっそう恐れなければならず、私を高ぶらせる者たちに心を向けてはなりません。私に（ほめ言葉を）語る者たちは、私を鞭打っているのです[6]。</p><p>2. 私は苦しみを受けることを愛していますが、自分がそれにふさわしいかどうかを知りません。この熱望は多くの人には見えませんが、私をいっそう激しく攻め立てます[7]。ですから、私には柔和が必要です。柔和によって、この世の支配者は滅ぼされるのです。</p>
      <h2>5</h2><p>1. 私は天上のことをあなたがたに書くことができないのでしょうか。いいえ、むしろ、まだ幼子であるあなたがたに害を与えることを恐れているのです[8]。どうか許してください。あなたがたが受け止めきれず、息を詰まらせることのないためです。</p><p>2. 私自身も、縛られており、天上のことや天使たちの配置、支配者たちの集まり、見えるものと見えないもの[9]を理解できるからといって、それでもう弟子だというわけではありません。神を欠くことのないためには、私たちにはまだ多くのものが欠けているのです。</p>
      <h2>6</h2><p>1. ですから、あなたがたに勧めます――いいえ、私ではなく、イエス・キリストの愛が勧めるのです。キリスト者の食物だけを用い、異質な草、すなわち異端を避けなさい。</p><p>2. 彼らは、信用されようとして、自分たちの教えにイエス・キリストを織り交ぜます。それは、致死の毒を蜜入りの葡萄酒に混ぜて与えるようなものです。何も知らない者は、それを喜んで受け取り、悪い快楽のうちに死を受けるのです。</p>
      <h2>7</h2><p>1. ですから、このような者たちを警戒しなさい。そうできるのは、あなたがたが高ぶらず、神であるイエス・キリストからも、主教からも、使徒たちの定めからも離れないでいるときです。</p><p>2. 祭壇の内側にいる者は清く、祭壇の外にいる者は清くありません[10]。すなわち、主教と司祭団と輔祭たちを抜きにして何かを行う者は、良心において清くないのです。</p>
      <h2>8</h2><p>1. 私がこう書くのは、あなたがたの間にこのようなことがあると知ったからではありません。あなたがたは私の愛する者たちなので、悪魔の罠を前もって見越して、あなたがたを守ろうとしているのです。ですから、あなたがたは柔和を身にまとい、主の肉である信仰と、イエス・キリストの血である愛とのうちに、自分自身を新たにしなさい。</p><p>2. あなたがたのうちのだれも、隣人に対して恨みを抱いてはなりません。異邦人たちに口実を与えてはなりません。わずかな愚か者のために、神のうちにある群れが冒涜されることのないためです。「わたしの名がむなしく、ある人々の間で冒涜されている、その者は災いだ」[11]と言われているからです。</p>
      <h2>9</h2><p>1. ですから、だれかがイエス・キリストを抜きにしてあなたがたに語るときには、耳を貸してはなりません。この方はダビデの家系の方、マリアから生まれた方であり、真実に生まれ、食べ、飲み、ポンティオ・ピラトのもとで真実に迫害され、天上のもの、地上のもの、地下のものが見ている前で[12]真実に十字架につけられ、死なれました。</p><p>2. この方は真実に死者の中から復活されました。この方の父がこの方を復活させたのです。同じようにこの方の父は、この方を信じる私たちをも、キリスト・イエスのうちに復活させてくださるでしょう[13]。この方を離れては、私たちは真の命を持たないのです。</p>
      <h2>10</h2><p>しかし、もし、ある人々――つまり神を信じない者、不信仰な者たち――が言うように、この方が苦しみを受けたのは見せかけにすぎない[14]とすれば――見せかけにすぎないのは彼ら自身なのですが――、なぜ私は縛られているのでしょうか。なぜ私は野獣と戦うことを願っているのでしょうか。それなら私はむなしく死ぬことになります。それなら私は主について偽りを語っていることになるのです[15]。</p>
      <h2>11</h2><p>1. ですから、死をもたらす実を結ぶ悪いひこばえを避けなさい。だれかがそれを味わえば、たちまち死んでしまいます。彼らは父が植えられたものではないからです[16]。</p><p>2. もし父が植えられたものであったなら、彼らは十字架の枝として現れ、その実は朽ちないものであったでしょう。この十字架によって、キリストは御自分の受難のうちに、御自分の肢体であるあなたがたを招いておられるのです[17]。頭が肢体なしに生まれることはありえません。神は一致を約束しておられ、その一致とは神御自身なのです。</p>
      <h2>12</h2><p>1. 私はスミルナから、私と共にいる神の諸教会と一緒にあなたがたに挨拶を送ります。彼らはあらゆる点で、肉においても霊においても、私を安らがせてくれました。</p><p>2. 私がイエス・キリストのために身に帯び、神に到達することを願い求めているこの鎖が、あなたがたに勧めます。あなたがたの一致と、互いのための祈りのうちにとどまりなさい。あなたがた一人一人、とりわけ司祭たちは、父とイエス・キリストと使徒たちの誉れのために、主教を元気づけるのがふさわしいのです。</p><p>3. 私が書いたことが、あなたがたにとって不利な証しとならないよう、愛のうちに私の言うことを聞いてくれることを願っています。私のためにも祈ってください。私は神の憐れみのうちに、あなたがたの愛を必要としています。それは、私が定められている分け前に到達するにふさわしい者とされ、失格者とならないためです[18]。</p>
      <h2>13</h2><p>1. スミルナとエフェソの人々の愛が、あなたがたに挨拶を送ります。あなたがたの祈りのうちに、シリアの教会を覚えてください。私はその教会の最も小さい者であり、その教会の一員と呼ばれる値打ちもありません[19]。</p><p>2. イエス・キリストのうちに、お元気で。掟に従うように主教に従い、同じように司祭団にも従いなさい。あなたがた一人一人は、分かたれない心で互いに愛し合いなさい。</p><p>3. 私の霊はあなたがたのための身代わりの捧げ物です[20]。今だけでなく、私が神に到達するときにもそうです。私はまだ危険の中にいるからです。しかし父は、イエス・キリストのうちに、私の願いとあなたがたの願いとを真実にかなえてくださいます[21]。この方のうちに、あなたがたが非の打ちどころのない者として見いだされますように。</p>
    references: |-
      <ol><li><p>ἐν τῷ πληρώματι ἐν ἀποστολικῷ χαρακτῆρι。教会の全員に、使徒たちが手紙で挨拶したのと同じ仕方で挨拶を送る、の意。「使徒的な権威の満ちあふれる中で」と解する人もいます。</p></li><li><p>古いラテン語訳とアルメニア語訳は「あなたがたが神に倣う者であるのを見いだして、私は（神を）たたえた」と読み、本訳もこれに従っています。</p></li><li><p>輔祭は「イエス・キリストの秘義（神秘）に仕える者」と呼ばれています。聖体の祭儀で奉仕する務めを指すと考えられます（<a href="https://bibleox.com/ja/jp-ni/1kor/4/#L1">１コリ. 4:1</a> 参照）。</p></li><li><p>使徒言行録6章の「食事の世話」をする務めとの対比です（<a href="https://bibleox.com/ja/jp-ni/act/6/#L2">使. 6:2</a> 参照）。</p></li><li><p>τύπος —「型、姿」。主教は父なる神の姿を表す者とされています（<a href="https://bibleox.com/ja/ja/w/Ig1M_マグネシアの教会への手紙#HH-6">『マグネシアの教会への手紙』6:1</a>、<a href="https://bibleox.com/ja/ja/w/Ig1M_マグネシアの教会への手紙#HH-3">『マグネシアの教会への手紙』3:1</a> 参照）。</p></li><li><p>イグナティオスに「あなたは殉教者になるだろう」と語って彼をほめる人々のことと考えられます。ほめ言葉が高慢の誘惑となるので、「鞭打つ」と言っています。</p></li><li><p>殉教への熱望。それが高慢や虚栄の思いと混じらないかを、イグナティオスは恐れています。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/1kor/3/#L1-2">１コリ. 3:1-2</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/kol/1/#L16">コロ. 1:16</a> 参照。</p></li><li><p>「祭壇」は、聖体を受けるために信徒が集まる教会のことです（<a href="https://bibleox.com/ja/ja/w/Ig1E_エフェソの教会への手紙#HH-5">『エフェソの教会への手紙』5:2</a>、<a href="https://bibleox.com/ja/ja/w/Ig1F_フィラデルフィアの教会への手紙#HH-4">『フィラデルフィアの教会への手紙』4章</a> 参照）。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/is/52/#L5">イザ. 52:5</a>（七十人訳による）。<a href="https://bibleox.com/ja/jp-ni/rim/2/#L24">ロマ. 2:24</a> にも引用されています。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/fil/2/#L10">フィリ. 2:10</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/2kor/4/#L14">２コリ. 4:14</a> 参照。</p></li><li><p>τὸ δοκεῖν —「見せかけ、外見だけ」。キリストは本当に肉を持たず、苦しみも見かけだけだったと説く仮現論者（ドケティスト）のことです。イグナティオスはこれに「真実に」という言葉を繰り返して答えています（9章）。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/1kor/15/#L14-15">１コリ. 15:14-15</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/mf/15/#L13">マタ. 15:13</a>、<a href="https://bibleox.com/ja/ja/w/Ig1F_フィラデルフィアの教会への手紙#HH-3">『フィラデルフィアの教会への手紙』3:1</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/1kor/12/#L27">１コリ. 12:27</a> 参照。</p></li><li><p>ἀδόκιμος —「失格者」（<a href="https://bibleox.com/ja/jp-ni/1kor/9/#L27">１コリ. 9:27</a> 参照）。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/1kor/15/#L8-9">１コリ. 15:8-9</a> 参照。</p></li><li><p>ἁγνίζεται ὑμῶν τὸ ἐμὸν πνεῦμα。<a href="https://bibleox.com/ja/ja/w/Ig1E_エフェソの教会への手紙#HH-8">『エフェソの教会への手紙』8:1</a> と同じ献身の言い方です。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/1sol/5/#L24">１テサ. 5:24</a> 参照。</p></li></ol>
      <p>翻訳：ロジオン・ヴラソフ（AIツールを併用）。底本：ギリシア語本文（<a href="https://bibleox.com/ja/grc/w/ΙγνΘ_Τραλ">本サイトのギリシア語版</a>。明らかな脱落はライトフット版・ホームズ版で補った）。参照：ロシア語訳（『初期教会教父選集』ブリュッセル、1988年）、英訳（Roberts–Donaldson）、仏訳（Genoude、1837年）。聖書の引用は新共同訳による。</p>
