  - src: ИгнАн_Пк
    path: Ig1P_ポリュカルポスへの手紙
    title: ポリュカルポスへの手紙
    meta_desc: アンティオキアの聖イグナティオス（テオフォロス）がスミルナの主教ポリュカルポスに宛てた手紙。ギリシア語原文からの翻訳と注。
    menu: { parent: "手紙", title: "ポリュカルポスへの手紙", priority: 3 }
    body: |-
      <h2>0</h2><p>イグナティオス、またの名をテオフォロス[1]より、スミルナの人々の教会の主教ポリュカルポス、いや、むしろ父なる神と主イエス・キリストとによって見守られている主教ポリュカルポスへ。心からの挨拶を送ります。</p>
      <h2>1</h2><p>1. 揺るがない岩の上に据えられたような[2]、神のうちにあるあなたの思いを受け入れて、私は神を大いにたたえています。汚れのないあなたの顔を見ることを許されたからです[3]。神のうちに、私はあなたを喜びとしたいものです。</p><p>2. あなたが身にまとっている恵みによって、あなたに勧めます。あなたの走る道をさらに進み、すべての人が救われるよう勧めなさい。肉と霊とにおけるあらゆる心配りによって、あなたの職務[4]を全うしなさい。一致に心を配りなさい。それにまさるものは何もありません。主があなたを担っておられるように、すべての人を担いなさい[5]。今もしているように、愛のうちにすべての人を忍耐しなさい。</p><p>3. 絶えず祈ることに専念しなさい[6]。今あるよりもさらに多くの悟りを求めなさい。眠ることのない霊を持って、目を覚ましていなさい。一人一人に、神と同じ心をもって語りかけなさい。完全な競技者のように、すべての人の病を担いなさい[7]。労苦の多い所には、多くの得るものがあるのです。</p>
      <h2>2</h2><p>1. よい弟子たちを愛するのは、あなたにとって何の誉れにもなりません[8]。むしろ、より厄介な者たちを柔和をもって従わせなさい。すべての傷が同じ膏薬で治るわけではありません。激しい発作は湿布で鎮めなさい。</p><p>2. すべてにおいて蛇のように賢く、いつも鳩のように素直でありなさい[9]。あなたが肉の人であり霊の人でもあるのは、目に見えることを優しく扱うためです。目に見えないことについては、それが明らかにされるよう祈り求めなさい[10]。そうすれば、あなたは何一つ欠けることなく、あらゆる賜物に満ちあふれるでしょう。</p><p>3. 舵取りが風を求め、嵐に遭った者が港を求めるように、時があなたを求めています。神に到達するためです。神の競技者として身を慎みなさい[11]。賞は不朽と永遠の命であり、あなたもそれを確信しています。私と、あなたが愛してくれたこの鎖とは、あらゆる点であなたのための身代わりの命です。</p>
      <h2>3</h2><p>1. 信用できそうに見えながら異なる教えを説く者たちに、あなたは動揺してはなりません。打たれる金床のように堅く立ちなさい。打ちたたかれながら勝つのは、偉大な競技者のすることです。とりわけ神のために、私たちはすべてを耐え忍ばなければなりません。神も私たちを忍耐してくださるためです。</p><p>2. 今よりもさらに熱心になりなさい。時のしるしを見分けなさい。時を超えた方、時を持たない方、見えない方でありながら私たちのために見えるものとなられた方、触れることのできない方、苦しみを受けない方でありながら私たちのために苦しみを受けうる方となられた方、あらゆる仕方で私たちのために忍耐してくださった方を待ち望みなさい。</p>
      <h2>4</h2><p>1. やもめたちをなおざりにしてはなりません[12]。主に次いで、あなたが彼女たちの世話をする者となりなさい。あなたの同意なしに何事も行われてはなりません。またあなたも、神を抜きにして何も行ってはなりません。実際、あなたはそうしていません。しっかりと立っていなさい。</p><p>2. 集会をもっと頻繁に開きなさい。すべての人を名指しで尋ね求めなさい。</p><p>3. 奴隷の男女を見下してはなりません。しかし彼ら自身も高ぶってはならず、神の栄光のためにいっそうよく仕えるべきです。神からよりまさる自由を得るためです[13]。共同の費用で自由の身にしてもらうことを望んではなりません。欲望の奴隷となって見いだされることのないためです。</p>
      <h2>5</h2><p>1. 悪だくみ[14]を避けなさい。むしろ、それについて説教しなさい。私の姉妹たちには、主を愛し、肉においても霊においても夫に満足するよう語りなさい。同じように私の兄弟たちにも、イエス・キリストの名によって、主が教会を愛されたように妻を愛するよう命じなさい[15]。</p><p>2. もしだれかが、主の肉に敬意を表して[16]、純潔のうちにとどまることができるなら、誇ることなくとどまりなさい。もし誇るなら、その人は滅び、主教よりも上に知られようとするなら、その人は損なわれています。結婚する男も女も、主教の同意を得て結ばれるのがふさわしいのです[17]。それは、結婚が欲望によるのではなく、主に従うものとなるためです。すべてを神の誉れのために行いなさい。</p>
      <h2>6</h2><p>1. 主教に心を向けなさい[18]。神もあなたがたに心を向けてくださるためです。主教と司祭たちと輔祭たちに従う人々のために、私は自分の命を差し出します。彼らと共に、神のうちに私の分け前を得ることができますように。互いに共に労し、共に戦い、共に走り、共に苦しみ、共に眠り、共に起きなさい。神の家の管理者[19]、側近、しもべとして。</p><p>2. あなたがたが仕えている方、あなたがたに給与を支払ってくださる方に喜ばれるようにしなさい[20]。あなたがたのうちのだれも、脱走兵として見いだされてはなりません[21]。洗礼をあなたがたの武具とし、信仰を兜、愛を槍、忍耐を全身の武具として保ちなさい[22]。あなたがたの行いを預け金としなさい。それにふさわしい払い戻しを受けるためです[23]。ですから、神があなたがたに対してそうであるように、柔和のうちに互いに寛容でありなさい。いつまでもあなたがたのことを喜びとしたいものです。</p>
      <h2>7</h2><p>1. あなたがたの祈りによって、シリアのアンティオキアの教会が平和を得たと、私に知らされました。それで私も、神のうちに思い煩いから解かれて、いっそう心が晴れやかになりました。苦しみを受けることによって神に到達し、あなたがたの祈り[24]によって弟子として見いだされるならばですが。</p><p>2. 神に最も祝福されたポリュカルポスよ、神に最もふさわしい会議を開き、あなたがたが心から愛していて、労を惜しまない人を一人選ぶのがふさわしいことです[25]。その人は「神の使いとして走る者」と呼ばれることができるでしょう。この人をふさわしい者として、シリアに行かせ、神の栄光のために、あなたがたの労を惜しまない愛をたたえさせなさい。</p><p>3. キリスト者は自分自身を支配する権能を持たず、神のために時間を用いるのです。この業は神の業であり、あなたがたがこれを成し遂げるとき、あなたがたの業ともなるのです。あなたがたが神にふさわしい善い業に備えができていることを、私は恵みによって信じています。私はあなたがたの真理への熱意を知っているので、短い手紙であなたがたに勧めたのです。</p>
      <h2>8</h2><p>1. 私は御心の命じるままに、トロアスからネアポリスへと急に船出することになったので[26]、すべての教会に書くことができませんでした。ですから、神の御心を持っているあなたが、この先の諸教会に書き送り、彼らも同じことをするようにしてください。ある教会は使者を徒歩で送り、ある教会はあなたが送る人々に手紙を託すことができるでしょう。それは、あなたがたがそれにふさわしい者として、永遠の業によって栄光を受けるためです。</p><p>2. 私は、すべての人に名を挙げて挨拶を送ります。エピトロポスの妻[27]にも、その家の全員と子どもたちと共に挨拶を送ります。私の愛するアッタロスに挨拶を送ります。シリアに行くにふさわしい者とされるはずの人に挨拶を送ります。恵みがいつも彼と共に、また彼を遣わすポリュカルポスと共にありますように。</p><p>3. 私たちの神イエス・キリストのうちに、あなたがたがいつも健やかであるよう祈ります。この方のうちに、神の一致と主教の見守り[28]とのうちにとどまりなさい。私にとって慕わしい名を持つアルケーに挨拶を送ります。主のうちに、お元気で。</p>
    references: |-
      <ol><li><p>イグナティオスはトロアスからネアポリスへ船出する前に、スミルナの主教ポリュカルポスにこの手紙を書きました。主教の務めについての牧会的な勧めの手紙です。1–5章はポリュカルポス個人に（二人称単数で）、6章からは教会全体に向けて語られています。ポリュカルポスは後にスミルナで殉教しました（155年頃）。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/mf/7/#L24-25">マタ. 7:24-25</a> 参照。</p></li><li><p>イグナティオスがローマへの途中でスミルナに滞在したとき、ポリュカルポスに会ったことを指します。</p></li><li><p>τόπος —「場所、地位」。ここでは主教の職務のことです。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/gal/6/#L2">ガラ. 6:2</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/1sol/5/#L17">１テサ. 5:17</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/mf/8/#L17">マタ. 8:17</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/lk/6/#L32">ルカ. 6:32</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/mf/10/#L16">マタ. 10:16</a> 参照。</p></li><li><p>人の隠れた傾きや心の内を見抜けるように、の意と解されています。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/1kor/9/#L25">１コリ. 9:25</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/1tim/5/#L3">１テモ. 5:3</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/1kor/7/#L21-22">１コリ. 7:21-22</a> 参照。</p></li><li><p>κακοτεχνίαι。偽りの教えや異端の策略を指すとも、言葉の巧みな技巧を指すとも解されています。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/ef/5/#L25">エフェ. 5:25</a> 参照。</p></li><li><p>主の肉（キリストの体である教会、また私たちの体を御自分の肢体とされた主）に敬意を表して、の意。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/1kor/7/#L39">１コリ. 7:39</a>「ただし、主に結ばれている者とに限ります」参照。</p></li><li><p>ここから、手紙は教会全体（二人称複数）に向けて語られます。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/1kor/4/#L1-2">１コリ. 4:1-2</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/2tim/2/#L3-4">２テモ. 2:3-4</a> 参照。以下はローマ軍の生活にたとえています。</p></li><li><p>δεσέρτωρ — ラテン語 desertor（脱走兵）からの借用語。武器を捨てて逃げる兵士のことです。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/ef/6/#L11-17">エフェ. 6:11-17</a> 参照。</p></li><li><p>δεπόσιτα と ἄκκεπτα — ラテン語 deposita（預け金）と accepta（払い戻し）からの借用語。ローマの兵士は報酬や戦利品の一部を軍旗のもとに預け、除隊のときにまとめて受け取りました。</p></li><li><p>写本と本サイトのギリシア語本文は ἐν τῇ ἀναστάσει ὑμῶν「あなたがたの復活において」と読みますが、ライトフットなどの校訂者は ἐν τῇ αἰτήσει ὑμῶν「あなたがたの願い（祈り）によって」と改めて読み、本訳もこれに従っています。写本どおりなら「（終わりの日の）あなたがたの復活のときに、弟子として見いだされる」の意となります。</p></li><li><p>χειροτονῆσαι。<a href="https://bibleox.com/ja/ja/w/Ig1F_フィラデルフィアの教会への手紙#HH-10">『フィラデルフィアの教会への手紙』10:1</a> の注を参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/act/16/#L11">使. 16:11</a> 参照。パウロもトロアスからネアポリスへ渡りました。</p></li><li><p>τὴν τοῦ Ἐπιτρόπου —「エピトロポスの妻」。エピトロポスを人名と取らず、「（ローマの）管理官の妻」と解する説もあります。</p></li><li><p>ἐπισκοπή —「見守り、監督」。写本によっては ἐπισκόπῳ「主教（のもとに）」と読みます。</p></li></ol>
      <p>翻訳：ロジオン・ヴラソフ（AIツールを併用）。底本：ギリシア語本文（<a href="https://bibleox.com/ja/grc/w/ΙγνΘ_Πολ">本サイトのギリシア語版</a>。明らかな脱落はライトフット版・ホームズ版で補った）。参照：ロシア語訳（『初期教会教父選集』ブリュッセル、1988年）、英訳（Roberts–Donaldson）、仏訳（Genoude、1837年）。聖書の引用は新共同訳による。</p>
