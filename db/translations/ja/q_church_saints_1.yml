    title: 恵み
    menu: { parent: "教会/聖人", title: "恵み", priority: 3 }
    references: |-
      <ol><li><p><a href="https://www.pravenc.ru/text/149313.html">https://www.pravenc.ru/text/149313.html</a>（ロシア語）</p></li></ol>
    body: |-
      <h2>定義</h2><p><strong>恵み（古代ギリシア語</strong> <strong>χάρις、ヘブライ語 חֵ֣ן）</strong>— その主要な意味では、人の救いのために人に働きかける神の力です[1]。</p><p><em>（以下の例では、χάρις あるいは חֵן を訳した新共同訳の語に下線を引いています。）</em></p><ol><li><p><strong>神の力、神の働き</strong>（<a href="https://bibleox.com/ja/jp-ni/1kor/15/#L10">１コリ. 15:10</a> —「<u>神の恵み</u>によって今日のわたしがあるのです。そして、<u>わたしに与えられた神の恵み</u>は無駄にならず、わたしは他のすべての使徒よりずっと多く働きました。しかし、働いたのは、実はわたしではなく、<u>わたしと共にある神の恵み</u>なのです」— χάριτι δὲ θεοῦ εἰμι ὅ εἰμι, καὶ ἡ χάρις αὐτοῦ ἡ εἰς ἐμὲ οὐ κενὴ ἐγενήθη, ἀλλὰ περισσότερον αὐτῶν πάντων ἐκοπίασα, οὐκ ἐγὼ δὲ ἀλλὰ ἡ χάρις τοῦ θεοῦ [ἡ] σὺν ἐμοί）。</p></li><li><p><strong>憐れみ、好意、贈り物、ある人への好意、ある人への愛</strong>（<a href="https://bibleox.com/ja/jp-ni/gen/18/#L3">創. 18:3</a> —「<u>よろしければ</u>」、直訳「もしわたしがあなたの目に<u>恵み</u>を得たのなら」— ἄρα εὗρον χάριν ἐναντίον σου）、（<a href="https://bibleox.com/ja/gr-lxx-byz/sud/6/#L17">士. 6:17</a> —「もし<u>御目にかないますなら</u>」— εἰ εὗρον χάριν ἐν ὀφθαλμοῖς σου）、（<a href="https://bibleox.com/ja/jp-ni/1ts/16/#L22">サム上. 16:22</a> —「彼は、わたしの<u>心に適った</u>」— εὗρεν χάριν ἐν ὀφθαλμοῖς μου）、（<a href="https://bibleox.com/ja/gr-lxx-byz/3ts/11/#L19">王上. 11:19</a> —「ハダドは、ファラオに大変<u>気に入られ</u>」— καὶ εὗρεν Αδερ χάριν ἐναντίον Φαραω）、（<a href="https://bibleox.com/ja/gr-lxx-byz/act/2/#L47">使. 2:47</a> —「民衆全体から<u>好意</u>を寄せられた」— ἔχοντες χάριν πρὸς ὅλον τὸν λαόν）、（<a href="https://bibleox.com/ja/jp-ni/act/7/#L46">使. 7:46</a> —「ダビデは神の<u>御心に適い</u>」— ὃς εὗρεν χάριν ἐνώπιον τοῦ θεοῦ）、（<a href="https://bibleox.com/ja/gr-lxx-byz/1kor/16/#L3">１コリ. 16:3</a> —「その<u>贈り物</u>を届けにエルサレムに」— ἀπενεγκεῖν τὴν χάριν ὑμῶν εἰς Ἰερουσαλήμ）。</p></li><li><p><strong>神への感謝、神に喜ばれること</strong>（<a href="https://bibleox.com/ja/jp-ni/2kor/9/#L15">２コリ. 9:15</a> —「言葉では言い尽くせない贈り物について<u>神に感謝します</u>」— χάρις τῷ θεῷ ἐπὶ τῇ ἀνεκδιηγήτῳ αὐτοῦ δωρεᾷ）、（<a href="https://bibleox.com/ja/jp-ni/1pet/2/#L19">１ペト. 2:19</a> —「不当な苦しみを受けることになっても、神がそうお望みだとわきまえて苦痛を耐えるなら、それは<u>御心に適うこと</u>なのです」— τοῦτο γὰρ χάρις εἰ διὰ συνείδησιν θεοῦ ὑποφέρει τις λύπας）。</p></li><li><p><strong>美しさ</strong>（<a href="https://bibleox.com/ja/jp-ni/pr/5/#L19">箴. 5:19</a> —「<u>優雅な</u>かもしか」— πῶλος σῶν χαρίτων）、（<a href="https://bibleox.com/ja/gr-lxx-byz/pr/3/#L22">箴. 3:22</a> —「首には<u>優雅な飾り</u>を得る」— χάρις ᾖ περὶ σῷ τραχήλῳ）。</p></li><li><p><strong>尊いもの</strong>（<a href="https://bibleox.com/ja/jp-ni/pr/17/#L8">箴. 17:8</a> —「<u>美しい</u>宝石」— אֶֽבֶן ־ חֵן）、（<a href="https://bibleox.com/ja/jp-ni/ekl/10/#L12">コヘ. 10:12</a> —「賢者の口の言葉は<u>恵み</u>」— λόγοι στόματος σοφοῦ χάρις）、（<a href="https://bibleox.com/ja/jp-ni/ps/45/#L3">詩. 45:3</a> —「あなたの唇は<u>優雅に</u>語る」— ἐξεχύθη χάρις ἐν χείλεσίν σου、直訳「あなたの唇に恵みが注がれた」）。</p></li><li><p><strong>誉れ、尊敬、栄光</strong>（<a href="https://bibleox.com/ja/jp-ni/iudf/8/#L23">ユデ. 8:23</a> —「わたしたちの奴隷生活は何ら<u>実り</u>をもたらさず」— κατευθυνθήσεται ἡ δουλεία ἡμῶν εἰς χάριν、直訳「わたしたちの奴隷の身分は誉れへと導かれることはない」）</p></li></ol><h2>恵みの招く働き</h2><blockquote><p>「<strong><mark>キリストの恵みへ招いてくださった方から</mark></strong>、あなたがたがこんなにも早く離れて、ほかの福音に乗り換えようとしていることに、わたしはあきれ果てています」（<a href="https://bibleox.com/ja/jp-ni/gal/1/#L6">ガラ. 1:6</a>）</p></blockquote><blockquote><p>「しかし、<strong>わたしを母の胎内にあるときから選び分け</strong>、<strong><mark>恵みによって召し出してくださった</mark></strong>神が、御心のままに」（<a href="https://bibleox.com/ja/jp-ni/gal/1/#L15">ガラ. 1:15</a>）</p></blockquote><h2>神の賜物としての恵み</h2><blockquote><p>「主イエスの<strong><mark>恵みが、あなたがたと共にあるように</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/1kor/16/#L23">１コリ. 16:23</a>）</p></blockquote><blockquote><p>「わたしたちの父である<strong>神</strong>と主イエス・キリスト<strong>からの<mark>恵み</mark></strong>と平和<strong><mark>が、あなたがたにあるように</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/2kor/1/#L2">２コリ. 1:2</a>）</p></blockquote><blockquote><p>「<strong>あなたがたの上に聖霊が降ると</strong>、あなたがたは<strong><mark>力を受ける</mark></strong>（δύναμιν）。そして、エルサレムばかりでなく、ユダヤとサマリアの全土で、また、地の果てに至るまで、わたしの証人となる」（<a href="https://bibleox.com/ja/jp-ni/act/1/#L8">使. 1:8</a>）</p></blockquote><blockquote><p>「<strong><mark>わたしを強くしてくださった</mark></strong>、わたしたちの主キリスト・イエスに感謝しています。この方が、わたしを忠実な者と見なして務めに就かせてくださったからです」（<a href="https://bibleox.com/ja/jp-ni/1tim/1/#L12">１テモ. 1:12</a>）</p></blockquote><blockquote><p>「<strong><mark>神は、その力を働かせてわたしに恵みを賜り</mark></strong>、この福音に仕える者としてくださいました」（<a href="https://bibleox.com/ja/jp-ni/ef/3/#L7">エフェ. 3:7</a>）</p></blockquote><blockquote><p>「しかし、<strong>わたしたち一人一人に</strong>、キリストの賜物のはかりに従って、<strong><mark>恵みが与えられています</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/ef/4/#L7">エフェ. 4:7</a>）</p></blockquote><blockquote><p>「更に、彼らはあなたがたに与えられた<strong><mark>神のこの上なくすばらしい恵み</mark></strong>を見て、あなたがたを慕い、あなたがたのために祈るのです」（<a href="https://bibleox.com/ja/jp-ni/2kor/9/#L14">２コリ. 9:14</a>）</p></blockquote><blockquote><p>「<strong><mark>神は</mark></strong>、あなたがたがいつもすべての点ですべてのものに十分で、あらゆる善い業に満ちあふれるように、<strong><mark>あらゆる恵みをあなたがたに満ちあふれさせることがおできになります</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/2kor/9/#L8">２コリ. 9:8</a>）</p></blockquote><blockquote><p>「また、あの啓示された事があまりにもすばらしいからです。それで、そのために思い上がることのないようにと、わたしの身に一つのとげが与えられました。それは、思い上がらないように、わたしを痛めつけるために、サタンから送られた使いです。この使いについて、離れ去らせてくださるように、わたしは三度主に願いました。すると主は、『<strong><mark>わたしの恵み</mark>（χάρις）<mark>はあなたに十分である</mark>。力（δύναμις）は弱さの中でこそ十分に発揮されるのだ</strong>』と言われました。だから、<strong><mark>キリストの力</mark>（δύναμις）<mark>がわたしの内に宿るように</mark></strong>、むしろ大いに喜んで自分の弱さを誇りましょう」（<a href="https://bibleox.com/ja/jp-ni/2kor/12/#L7-9">２コリ. 12:7-9</a>）</p></blockquote><blockquote><p>「わたしたちはまた、神の協力者としてあなたがたに勧めます。<strong><mark>神からいただいた恵みを無駄にしてはいけません</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/2kor/6/#L1">２コリ. 6:1</a>）</p></blockquote><blockquote><p>「神の恵み（χάριτι）によって今日のわたしがあるのです。そして、<strong><mark>わたしに与えられた神の恵み</mark>（χάρις）は無駄にならず</strong>、わたしは他のすべての使徒よりずっと多く<strong>働きました</strong>。<strong>しかし、働いたのは、実はわたしではなく、<mark>わたしと共にある神の恵み</mark>（χάρις）なのです</strong>」（<a href="https://bibleox.com/ja/jp-ni/1kor/15/#L10">１コリ. 15:10</a>）</p></blockquote><blockquote><p>「すると、ペトロは彼らに言った。『悔い改めなさい。めいめい、イエス・キリストの名によって洗礼を受け、罪を赦していただきなさい。そうすれば、<strong><mark>賜物として聖霊を受けます</mark></strong>』」（<a href="https://bibleox.com/ja/jp-ni/act/2/#L38">使. 2:38</a>）</p></blockquote><blockquote><p>「わたしたちとあなたがたとをキリストに固く結び付け、わたしたちに油を注いでくださったのは、神です。神はまた、わたしたちに証印を押して、<strong>保証としてわたしたちの心に<mark>“霊”を与えてくださいました</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/2kor/1/#L21-22">２コリ. 1:21-22</a>）</p></blockquote><blockquote><p>「<strong><mark>神の霊があなたがたの内に宿っているかぎり</mark></strong>、あなたがたは、肉ではなく霊の支配下にいます。キリストの霊を持たない者は、キリストに属していません」（<a href="https://bibleox.com/ja/jp-ni/rim/8/#L9">ロマ. 8:9</a>）</p></blockquote><blockquote><p>「あなたがたは、自分が神の神殿であり、<strong>神の霊が自分たちの内に住んでいる</strong>ことを知らないのですか」（<a href="https://bibleox.com/ja/jp-ni/1kor/3/#L16">１コリ. 3:16</a>）</p></blockquote><blockquote><p><em>「あなたがたは、人を奴隷として再び恐れに陥れる霊ではなく、</em><strong><em>神の子とする<mark>霊を受けたのです</mark>。<mark>この霊によってわたしたちは</mark>、『アッバ、父よ』と<mark>呼ぶのです</mark></em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/rim/8/#L15"><em>ロマ. 8:15</em></a><em>）</em></p></blockquote><blockquote><p><em>「あなたがたが子であることは、</em><strong><em>神が、『アッバ、父よ』と<mark>叫ぶ</mark>御子の<mark>霊を、わたしたちの心に送ってくださった</mark></em></strong><em>事実から分かります」（</em><a href="https://bibleox.com/ja/jp-ni/gal/4/#L6"><em>ガラ. 4:6</em></a><em>）</em></p></blockquote><blockquote><p>「しかし、<strong>いつもあなたがたの内には、御子から<mark>注がれた油</mark>がありますから</strong>、だれからも教えを受ける必要がありません。<strong><mark>この油が万事について教えます</mark></strong>。それは真実であって、偽りではありません。だから、教えられたとおり、御子の内にとどまりなさい」（<a href="https://bibleox.com/ja/jp-ni/1in/2/#L27">１ヨハ. 2:27</a>）</p></blockquote><blockquote><p>「わたしたちはまた、神の協力者としてあなたがたに勧めます。<strong>神からいただいた<mark>恵み</mark>を<mark>無駄にしてはいけません</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/2kor/6/#L1">２コリ. 6:1</a>）</p></blockquote><blockquote><p>「わたしたちは生ける神の神殿なのです。神がこう言われているとおりです。『<strong><mark>わたしは彼らの間に住み、巡り歩く</mark></strong>。そして、彼らの神となり、彼らはわたしの民となる』」（<a href="https://bibleox.com/ja/jp-ni/2kor/6/#L16">２コリ. 6:16</a>）</p></blockquote><blockquote><p>「イエスはこう答えて言われた。『わたしを愛する人は、わたしの言葉を守る。わたしの父はその人を愛され、<strong><mark>父とわたしとはその人のところに行き、一緒に住む</mark></strong>』」（<a href="https://bibleox.com/ja/jp-ni/in/14/#L23">ヨハ. 14:23</a>）</p></blockquote><blockquote><p>「<strong><mark>食べ物ではなく、恵みによって心が強められるのはよいことです</mark></strong>。食物の規定に従って生活した者は、益を受けませんでした」（<a href="https://bibleox.com/ja/jp-ni/evr/13/#L9">ヘブ. 13:9</a>）</p></blockquote><blockquote><p>「このように、わたしたちは揺り動かされることのない御国を受けているのですから、<strong><mark>感謝しよう</mark>。感謝の念をもって</strong>、畏れ敬いながら、神に喜ばれるように<strong>仕えていこう</strong>」（<a href="https://bibleox.com/ja/jp-ni/evr/12/#L28">ヘブ. 12:28</a>）<em>（「感謝しよう」と訳されている語は、ギリシア語原文では ἔχωμεν χάριν —「恵みを持とう」であり、続く「感謝の念をもって」は δι᾿ ἧς —「その恵みによって」です。）</em></p></blockquote><blockquote><p>「イエスに触れていただくために、<strong>人々が子供たちを連れて来た</strong>。弟子たちはこの人々を叱った。しかし、イエスはこれを見て憤り、弟子たちに言われた。『子供たちをわたしのところに来させなさい。妨げてはならない。神の国はこのような者たちのものである。』&lt;…&gt; そして、<strong>子供たちを抱き上げ</strong>、<strong><mark>手を置いて祝福された</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/mk/10/#L13-14,16">マコ. 10:13-14,16</a>）</p></blockquote><blockquote><p>「イエスは、そこから彼らをベタニアの辺りまで連れて行き、<strong><mark>手を上げて祝福された</mark></strong>。そして、祝福しながら彼らを離れ、天に上げられた」（<a href="https://bibleox.com/ja/jp-ni/lk/24/#L50-51">ルカ. 24:50-51</a>）</p></blockquote><h2>人々を通しての恵みの働き</h2><blockquote><p>「そこでわたしは、神のために働くことをキリスト・イエスによって誇りに思っています。<strong>キリストが<mark>わたしを通して働かれたこと</mark></strong>以外は、あえて何も申しません。キリストは異邦人を神に従わせるために、わたしの言葉と行いを通して、また、しるしや<strong>奇跡の力</strong>（δυνάμει）、<strong><mark>神の霊の力</mark>（δυνάμει）<mark>によって</mark></strong>働かれました。こうしてわたしは、エルサレムからイリリコン州まで巡って、キリストの福音をあまねく宣べ伝えました」（<a href="https://bibleox.com/ja/jp-ni/rim/15/#L17-19">ロマ. 15:17-19</a>）</p></blockquote><blockquote><p>「そういうわけで、<strong><mark>わたしが手を置いたことによって</mark>あなたに与えられている<mark>神の賜物</mark></strong>を、再び燃えたたせるように勧めます」（<a href="https://bibleox.com/ja/jp-ni/2tim/1/#L6">２テモ. 1:6</a>）</p></blockquote><p>彼らは、諸民族を従順へと導くために恵みを受けました。</p><blockquote><p>「わたしたちはこの方により、その御名を広めて<strong><mark>すべての異邦人を信仰による従順へと導くために</mark></strong>、<strong><mark>恵みを受けて</mark></strong><strong>使徒とされました</strong>」（<a href="https://bibleox.com/ja/jp-ni/rim/1/#L5">ロマ. 1:5</a>）</p></blockquote><blockquote><p>「悪い<strong>言葉</strong>を一切口にしてはなりません。ただ、<strong>聞く人に恵みが与えられるように</strong>、その人を造り上げるのに<strong>役立つ</strong>言葉を、必要に応じて語りなさい」（<a href="https://bibleox.com/ja/jp-ni/ef/4/#L29">エフェ. 4:29</a>）</p></blockquote><blockquote><p>「<strong>いつも、塩で味付けされた快い言葉で語りなさい</strong>。そうすれば、一人一人にどう答えるべきかが分かるでしょう」（<a href="https://bibleox.com/ja/jp-ni/kol/4/#L6">コロ. 4:6</a>）<em>（「快い言葉で」は、ギリシア語原文では ἐν χάριτι —「恵みをもって」です。）</em></p></blockquote><h2>恵みはへりくだる者に与えられる</h2><blockquote><p>「主は不遜な者を嘲り<strong><mark>へりくだる人に恵みを賜る</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/pr/3/#L34">箴. 3:34</a>）</p></blockquote><blockquote><p>「もっと豊かな恵みをくださる。それで、こう書かれています。『神は、高慢な者を敵とし、<strong><mark>謙遜な者には恵みをお与えになる</mark></strong>』」（<a href="https://bibleox.com/ja/jp-ni/iak/4/#L6">ヤコ. 4:6</a>）</p></blockquote><blockquote><p>「同じように、若い人たち、長老に従いなさい。皆互いに謙遜を身に着けなさい。なぜなら、『神は、高慢な者を敵とし、<strong><mark>謙遜な者には恵みをお与えになる</mark></strong>』からです」（<a href="https://bibleox.com/ja/jp-ni/1pet/5/#L5">１ペト. 5:5</a>）</p></blockquote><h2>恵みを燃え立たせる必要</h2><blockquote><p>「そういうわけで、わたしが手を置いたことによってあなたに与えられている<strong><mark>神の賜物を、再び燃えたたせるように勧めます</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/2tim/1/#L6">２テモ. 1:6</a>）</p></blockquote>
