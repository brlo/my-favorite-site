  - src: святость
    path: Ho1s_聖性
    title: 聖性
    meta_desc: 聖性についての聖書の引用
    menu: { parent: "教会/聖人", title: "聖性", priority: 1 }
    body: |-
      <ol><li><p><strong>聖性</strong>とは、あるものを一つの目的のために完全に取り分けることです。</p></li><li><p><strong>聖性</strong>とは、神に献げられた生き方です。</p></li><li><p><strong>聖人</strong>とは、罪なしに、神の御心に従って生きる人です。</p></li></ol><blockquote><p>「キリストが死なれたのは、<strong>ただ一度罪に対して死なれたのであり、生きておられるのは、神に対して生きておられるのです</strong>。このように、あなたがたも<strong>自分は罪に対して死んでいるが、キリスト・イエスに結ばれて、神に対して生きているのだと考えなさい</strong>。従って、<strong>あなたがたの死ぬべき体を罪に支配させて</strong>、体の欲望に従うようなことがあってはなりません。また、あなたがたの五体を不義のための道具として<strong>罪に任せてはなりません</strong>。かえって、自分自身を死者の中から生き返った者として神に献げ、また、五体を義のための道具として神に献げなさい。&lt;…&gt; 罪から解放され、義に仕えるようになりました。&lt;…&gt; あなたがたは、<strong>今は罪から解放されて神の奴隷となり、聖なる生活の実を結んでいます</strong>。行き着くところは、永遠の命です」（<a href="https://bibleox.com/ja/jp-ni/rim/6/#L10-13,18,22">ロマ. 6:10-13,18,22</a>）</p></blockquote><blockquote><p>「神から生まれた人は皆、罪を犯しません。神の種がこの人の内にいつもあるからです。この人は神から生まれたので、<strong>罪を犯すことができません</strong>」（<a href="https://bibleox.com/ja/jp-ni/1in/3/#L9">１ヨハ. 3:9</a>）</p></blockquote><blockquote><p>「わたしたちは知っています。<strong>すべて神から生まれた者は罪を犯しません</strong>。神からお生まれになった方が、その人を守ってくださり、悪い者は手を触れることができません」（<a href="https://bibleox.com/ja/jp-ni/1in/5/#L18">１ヨハ. 5:18</a>）</p></blockquote><blockquote><p>「すべての人との<strong>平和</strong>を、また<strong>聖なる生活を追い求めなさい。聖なる生活を抜きにして、だれも主を見ることはできません</strong>」（<a href="https://bibleox.com/ja/jp-ni/evr/12/#L14">ヘブ. 12:14</a>）<em>（「聖なる生活」は、ギリシア語原文では ἁγιασμόν —「聖性、聖化」です。）</em></p></blockquote><blockquote><p>「<strong>この都</strong>には、それを照らす太陽も月も、必要でない。&lt;…&gt; 都の門は、一日中決して閉ざされない。そこには夜がないからである。&lt;…&gt; しかし、<strong>汚れた者、忌まわしいことと偽りを行う者はだれ一人、決して都に入れない</strong>。小羊の命の書に名が書いてある者だけが入れる」（<a href="https://bibleox.com/ja/jp-ni/otkr/21/#L23,25,27">黙. 21:23,25,27</a>）</p></blockquote>

  - src: святыня
    path: Sh2r_聖なるもの
    title: 聖なるもの
    menu: { parent: "教会/聖人", title: "聖なるもの", priority: 2 }
    body: |-
      <h2>新約における聖なるもの</h2><h3>聖なる神殿</h3><p>エルサレムの神殿は、まことの聖所の写しでした。</p><blockquote><p>「なぜならキリストは、<strong><mark>まことのものの写しにすぎない</mark>、人間の手で造られた聖所にではなく</strong>、天そのものに入り、今やわたしたちのために神の御前に現れてくださったからです」（<a href="https://bibleox.com/ja/jp-ni/evr/9/#L24">ヘブ. 9:24</a>）</p></blockquote><blockquote><p>「ユダヤ人の過越祭が近づいたので、イエスはエルサレムへ上って行かれた。そして、<strong><mark>神殿の境内で</mark></strong>牛や羊や鳩を売っている者たちと、座って両替をしている者たちを御覧になった。イエスは縄で鞭を作り、<strong>羊や牛をすべて境内から追い出し</strong>、両替人の金をまき散らし、その台を倒し、鳩を売る者たちに言われた。『このような物はここから運び出せ。<strong><mark>わたしの父の家</mark>を商売の家としてはならない</strong>』」（<a href="https://bibleox.com/ja/jp-ni/in/2/#L13-16">ヨハ. 2:13-16</a>）</p></blockquote><blockquote><p>「［使徒たちは］<strong><mark>絶えず神殿の境内にいて</mark></strong>、神をほめたたえていた」（<a href="https://bibleox.com/ja/jp-ni/lk/24/#L53">ルカ. 24:53</a>）</p></blockquote><blockquote><p>「そして、［信じる者たちは］<strong>毎日</strong>ひたすら心を一つにして<strong><mark>神殿に参り</mark></strong>、家ごとに集まってパンを裂き、喜びと真心をもって一緒に食事をし」（<a href="https://bibleox.com/ja/jp-ni/act/2/#L46">使. 2:46</a>）</p></blockquote><p>使徒は神殿で祈り、そこでキリストが幻の中で彼に現れます。</p><blockquote><p>「さて、わたしはエルサレムに帰って来て、<strong><mark>神殿で祈っていたとき</mark>、我を忘れた状態になり</strong>」（<a href="https://bibleox.com/ja/jp-ni/act/22/#L17">使. 22:17</a>）</p></blockquote><p>反キリスト（不法の者）は神の神殿に座ります（明らかに、神の神殿に座るためには、神殿が存在していなければなりません。ゼウスの神殿でもペルーンの神殿でもなく、神の神殿です）。</p><blockquote><p>「だれがどのような手段を用いても、だまされてはいけません。なぜなら、まず、神に対する反逆が起こり、<strong>不法の者</strong>、つまり、滅びの子が出現しなければならないからです。この者は、<strong>すべて神と呼ばれたり拝まれたりするもの</strong><em>（ギリシア語 σέβασμα —「崇敬の対象、聖なるもの」）</em><strong>に反抗して、傲慢にふるまい</strong>、ついには、<strong><mark>神殿に座り込み</mark></strong>、自分こそは神であると宣言するのです」（<a href="https://bibleox.com/ja/jp-ni/2sol/2/#L3-4">２テサ. 2:3-4</a>）<em>（「神殿」は、ギリシア語原文では τὸν ναὸν τοῦ θεοῦ —「神の神殿」です。）</em></p></blockquote><h3>聖なる場所</h3><p>聖なる場所で、聞く者たちは何かを見ることになります。</p><blockquote><p>「預言者ダニエルの言った<strong>憎むべき破壊者が、<mark>聖なる場所</mark>に立つのを見たら</strong>――読者は悟れ――」（<a href="https://bibleox.com/ja/jp-ni/mf/24/#L15">マタ. 24:15</a>）</p></blockquote><h3>聖なる物</h3><h4>神殿と祭壇は今も聖なるものであり、聖別する</h4><blockquote><p>「愚かで、ものの見えない者たち、黄金と、<strong><mark>黄金を清める神殿と</mark></strong>、どちらが尊いか。&lt;…&gt; ものの見えない者たち、供え物と、<strong><mark>供え物を清くする祭壇と</mark></strong>、どちらが尊いか」（<a href="https://bibleox.com/ja/jp-ni/mf/23/#L17,19">マタ. 23:17,19</a>）</p></blockquote><h4>天使は水を通していやしを与える</h4><blockquote><p>「〔彼らは、水が動くのを待っていた。それは、<strong>主の使い</strong>がときどき池に降りて来て、<strong><mark>水</mark>が動くことがあり、水が動いたとき、真っ先に水に入る者は</strong>、どんな病気にかかっていても、<strong><mark>いやされた</mark></strong>からである。〕」（<a href="https://bibleox.com/ja/jp-ni/in/5/#L4">ヨハ. 5:4</a>）<em>（新共同訳はこの節を〔　〕に入れ、後代の付加としていますが、ビザンティン本文（多数派写本）では本文の一部です。）</em></p></blockquote><h4>使徒たちは油を塗っていやした</h4><blockquote><p>「そして、十二人を呼び寄せ、二人ずつ組にして遣わすことにされた。その際、汚れた霊に対する権能を授け、&lt;…&gt; 十二人は出かけて行って、悔い改めさせるために宣教した。そして、多くの悪霊を追い出し、<strong><mark>油を塗って多くの病人をいやした</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/mk/6/#L7,12-13">マコ. 6:7,12-13</a>）</p></blockquote><blockquote><p>「あなたがたの中で病気の人は、<strong>教会の長老を招いて</strong>、<strong>主の名によって<mark>オリーブ油を塗り</mark>、祈ってもらいなさい</strong>。信仰に基づく祈りは、病人を救い、主がその人を起き上がらせてくださいます。その人が罪を犯したのであれば、主が赦してくださいます」（<a href="https://bibleox.com/ja/jp-ni/iak/5/#L14-15">ヤコ. 5:14-15</a>）</p></blockquote><h4>キリストの血は聖なるものである</h4><blockquote><p><em>「モーセの律法を破る者は、二、三人の証言に基づいて、情け容赦なく死刑に処せられます。</em><strong><em>まして、神の子を足げにし、自分が聖なる者とされた<mark>契約の血を汚れたものと見なし</mark>、その上、恵みの霊を侮辱する者は、<mark>どれほど重い刑罰に値すると思いますか</mark></em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/evr/10/#L28-29"><em>ヘブ. 10:28-29</em></a><em>）</em></p></blockquote><h4>使徒の残した布に触れることによって人々がいやされる</h4><blockquote><p><em>「</em><strong><em>彼が<mark>身に着けていた手ぬぐいや前掛けを持って行って</mark>病人に当てると、病気はいやされ、悪霊どもも出て行く</em></strong><em>ほどであった」（</em><a href="https://bibleox.com/ja/jp-ni/act/19/#L12"><em>使. 19:12</em></a><em>）</em></p></blockquote><h4>反キリストは聖なるものの上に自分を高める</h4><p>明らかに、聖なるものの上に自分を高めるためには、聖なるものが存在していなければなりません。</p><blockquote><p>「だれがどのような手段を用いても、だまされてはいけません。なぜなら、まず、神に対する反逆が起こり、<strong>不法の者</strong>、つまり、滅びの子が出現しなければならないからです。この者は、<strong>すべて神と呼ばれたり<mark>拝まれたりするもの</mark></strong><em>（ギリシア語 σέβασμα —「崇敬の対象、聖なるもの」）</em><strong>に反抗して、<mark>傲慢にふるまい</mark></strong>、ついには、神殿に座り込み、自分こそは神であると宣言するのです」（<a href="https://bibleox.com/ja/jp-ni/2sol/2/#L3-4">２テサ. 2:3-4</a>）</p></blockquote><h3>聖なる像（影）</h3><h4>人々は使徒の影からいやしを期待した</h4><blockquote><p>「<strong>人々は病人を大通りに運び出し</strong>、担架や床に寝かせた。<strong>ペトロが通りかかるとき、せめてその影だけでも病人のだれかにかかるようにした</strong>。また、エルサレム付近の町からも、群衆が病人や汚れた霊に悩まされている人々を連れて集まって来たが、<strong>一人残らずいやしてもらった</strong>」（<a href="https://bibleox.com/ja/jp-ni/act/5/#L15-16">使. 5:15-16</a>）</p></blockquote><h3>聖なる人々（司祭）</h3><h4>キリストは使徒たちにだけ現れ、使徒たちにだけ権能を授けられる</h4><blockquote><p><em>「イエスは重ねて言われた。『あなたがたに平和があるように。父がわたしをお遣わしになったように、わたしもあなたがたを遣わす。』そう言ってから、彼らに</em><strong><em>息を吹きかけて</em></strong><em>言われた。『</em><strong><em>聖霊を受けなさい。だれの罪でも、あなたがたが赦せば、その罪は赦される。だれの罪でも、あなたがたが赦さなければ、赦されないまま残る</em></strong><em>』」（</em><a href="https://bibleox.com/ja/jp-ni/in/20/#L21-23"><em>ヨハ. 20:21-23</em></a><em>）</em></p></blockquote><blockquote><p>「はっきり言っておく。<strong>あなたがたが地上でつなぐことは、天上でもつながれ、あなたがたが地上で解くことは、天上でも解かれる</strong>」（<a href="https://bibleox.com/ja/jp-ni/mf/18/#L18">マタ. 18:18</a>）</p></blockquote><h3>聖なる儀式と機密</h3><p>（新約の）聖体のいけにえ。主はその執り行い方を使徒たちにだけ教えられます。</p><blockquote><p><em>「一同が食事をしているとき、イエスは</em><strong><em><mark>パン</mark>を取り、賛美の祈りを唱えて、それを<mark>裂き</mark>、弟子たちに与えながら言われた。『取って食べなさい。これはわたしの体である。』</em></strong><em>また、</em><strong><em><mark>杯</mark>を取り、感謝の祈りを唱え、彼らに渡して言われた。『皆、この杯から飲みなさい。これは、罪が赦されるように、多くの人のために流されるわたしの血、契約の血である</em></strong><em>』」（</em><a href="https://bibleox.com/ja/jp-ni/mf/26/#L26-28"><em>マタ. 26:26-28</em></a><em>）／同様に：</em><a href="https://bibleox.com/ja/jp-ni/mk/14/#L22-24"><em>マコ. 14:22-24</em></a><em>; </em><a href="https://bibleox.com/ja/jp-ni/lk/22/#L19-20"><em>ルカ. 22:19-20</em></a></p></blockquote><blockquote><p>「それから、イエスは<strong><mark>パン</mark>を取り、感謝の祈りを唱えて、それを<mark>裂き</mark>、使徒たちに与えて言われた。『これは、あなたがたのために与えられるわたしの体である。わたしの記念として<mark>このように行いなさい</mark>。』</strong>食事を終えてから、<strong><mark>杯も同じようにして</mark></strong>言われた。『この杯は、あなたがたのために流される、わたしの血による新しい契約である』」（<a href="https://bibleox.com/ja/jp-ni/lk/22/#L19-20">ルカ. 22:19-20</a>）</p></blockquote><p>その後、主は、のちに回心した使徒パウロに、同じ順序（儀式）を別に教えられます。</p><blockquote><p><em>「わたしがあなたがたに伝えたことは、</em><strong><em>わたし自身、主から受けたものです</em></strong><em>。すなわち、主イエスは、引き渡される夜、</em><strong><em><mark>パン</mark>を取り、感謝の祈りをささげて</em></strong><em>それを</em><strong><em><mark>裂き</mark></em></strong><em>、『</em><strong><em>これは</em></strong><em>、あなたがたのための</em><strong><em>わたしの体である</em></strong><em>。わたしの記念として</em><strong><em><mark>このように行いなさい</mark></em></strong><em>』と言われました。また、食事の後で、</em><strong><em><mark>杯も同じようにして</mark></em></strong><em>、『</em><strong><em>この杯は、わたしの血によって立てられる新しい契約である</em></strong><em>。飲む度に、わたしの記念としてこのように行いなさい』と言われました」（</em><a href="https://bibleox.com/ja/jp-ni/1kor/11/#L23-25"><em>１コリ. 11:23-25</em></a><em>）</em></p></blockquote><h3>祈りを伴う按手</h3><blockquote><p><em>「そういうわけで、</em><strong><em><mark>わたしが手を置いたこと</mark><u><mark>によって</mark></u>あなたに与えられている<mark>神の賜物</mark></em></strong><em>を、再び燃えたたせるように勧めます」（</em><a href="https://bibleox.com/ja/jp-ni/2tim/1/#L6"><em>２テモ. 1:6</em></a><em>）</em></p></blockquote><blockquote><p><em>「あなたの内にある</em><strong><em>恵みの<mark>賜物</mark>を軽んじてはなりません。その賜物は、<mark>長老たちがあなたに手を置いたとき</mark>、預言によって与えられたもの</em></strong><em>です」（</em><a href="https://bibleox.com/ja/jp-ni/1tim/4/#L14"><em>１テモ. 4:14</em></a><em>）</em></p></blockquote><blockquote><p><em>「彼らが主を礼拝し、断食していると、聖霊が告げた。『さあ、バルナバと</em><strong><em><mark>サウロ</mark></em></strong><em>をわたしのために選び出しなさい。わたしが前もって二人に決めておいた仕事に当たらせるために。』そこで、彼らは断食して祈り、</em><strong><em><mark>二人の上に手を置いて</mark></em></strong><em>出発させた」（</em><a href="https://bibleox.com/ja/jp-ni/act/13/#L2-3"><em>使. 13:2-3</em></a><em>）</em></p></blockquote><blockquote><p><em>「使徒たちの前に立たせた。使徒たちは、祈って</em><strong><em><mark>彼らの上に手を置いた</mark></em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/act/6/#L6"><em>使. 6:6</em></a><em>; </em><a href="https://bibleox.com/ja/jp-ni/act/21/#L8"><em>21:8</em></a><em>）</em></p></blockquote><blockquote><p><em>「種々の洗礼についての</em><strong><em><mark>教え</mark></em></strong><em>、</em><strong><em><mark>手を置く儀式</mark></em></strong><em>、死者の復活、永遠の審判」（</em><a href="https://bibleox.com/ja/jp-ni/evr/6/#L1-2"><em>ヘブ. 6:1-2</em></a><em>）</em></p></blockquote><blockquote><p>「シモンは、<strong><mark>使徒たちが手を置くことで、“霊”が与えられる</mark></strong>のを見、金を持って来て、言った。『わたしが手を置けば、だれでも聖霊が受けられるように、わたしにもその力を授けてください。』すると、ペトロは言った。『この金は、お前と一緒に滅びてしまうがよい。<strong>神の賜物</strong>を金で手に入れられると思っているからだ』」（<a href="https://bibleox.com/ja/jp-ni/act/8/#L18-20">使. 8:18-20</a>）</p></blockquote><blockquote><p>「人々は主イエスの名によって洗礼を受けていただけで、聖霊はまだだれの上にも降っていなかったからである。<strong><mark>ペトロとヨハネが人々の上に手を置くと、彼らは聖霊を受けた</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/act/8/#L16-17">使. 8:16-17</a>）</p></blockquote><h3>恵みを分け与える神の賜物</h3><blockquote><p>「ペトロは言った。『わたしには金や銀はないが、<strong><mark>持っているものをあげよう</mark></strong>。ナザレの人イエス・キリストの名によって立ち上がり、歩きなさい。』そして、右手を取って彼を立ち上がらせた。すると、たちまち、その男は足やくるぶしがしっかりして、躍り上がって立ち、歩きだした。そして、歩き回ったり躍ったりして神を賛美し、二人と一緒に境内に入って行った」（<a href="https://bibleox.com/ja/jp-ni/act/3/#L6-8">使. 3:6-8</a>）</p></blockquote><h2>旧約における聖なるもの</h2><h3>聖なる神殿</h3><blockquote><p>「<strong>主はモーセに仰せになった</strong>。イスラエルの人々に命じて、わたしのもとに<strong>献納物を持って来させなさい</strong>。あなたたちは、彼らがおのおの進んで心からささげるわたしへの献納物を受け取りなさい。&lt;…&gt; <strong><mark>わたしのための聖なる所</mark></strong><em>（七十人訳ギリシア語 ἁγίασμα —「聖なるもの」）</em>を彼らに造らせなさい。わたしは彼らの中に住むであろう。<strong><mark>わたしが示す作り方に正しく従って</mark></strong>、<strong><mark>幕屋</mark></strong>とそのすべての祭具を作りなさい」（<a href="https://bibleox.com/ja/jp-ni/ish/25/#L1-2,8-9">出. 25:1-2,8-9</a>）</p></blockquote><blockquote><p><em>「見よ、あなたに子が生まれる。&lt;…&gt; </em><strong><em>この子がわたしの名のために神殿を築く</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/1par/22/#L9-10"><em>代上. 22:9-10</em></a><em>）</em></p></blockquote><blockquote><p><em>「しかしわたしは、深い慈しみをいただいてあなたの家に入り、</em><strong><em><mark>聖なる宮</mark>に向かってひれ伏し</em></strong><em>あなたを畏れ敬います」（</em><a href="https://bibleox.com/ja/jp-ni/ps/5/#L8"><em>詩. 5:8</em></a><em>）</em></p></blockquote><h3>聖なる場所</h3><blockquote><p><em>「神が言われた。『ここに近づいてはならない。足から履物を脱ぎなさい。</em><strong><em>あなたの立っている<mark>場所は聖なる土地</mark>だから</em></strong><em>』」（</em><a href="https://bibleox.com/ja/jp-ni/ish/3/#L5"><em>出. 3:5</em></a><em>）</em></p></blockquote><blockquote><p><em>「主の軍の将軍はヨシュアに言った。『あなたの足から履物を脱げ。</em><strong><em>あなたの立っている<mark>場所は聖なる所</mark>である</em></strong><em>。』ヨシュアはそのとおりにした」（</em><a href="https://bibleox.com/ja/jp-ni/nav/5/#L15"><em>ヨシュ. 5:15</em></a><em>）</em></p></blockquote><blockquote><p><em>「あなたは任職の雄羊を取り、その肉を</em><strong><em><mark>聖なる場所</mark>で</em></strong><em>煮て料理する」（</em><a href="https://bibleox.com/ja/jp-ni/ish/29/#L31"><em>出. 29:31</em></a><em>）</em></p></blockquote><h3>聖なる物</h3><p>聖なる聖別の油（聖膏）は聖なるものです。神殿と、それを注がれたすべての神殿の祭具は聖なるものです。人のうちでそれを注がれてよいのはアロンの子孫だけで、こうして彼らは祭司となります。</p><blockquote><p>「上質の香料を取りなさい。すなわち、ミルラの樹脂五百シェケル、&lt;…&gt; あなたはこれらを材料にして<strong><mark>聖なる聖別の油</mark></strong>を作る。すなわち、香料師の混ぜ合わせ方に従って聖なる聖別の油を作る。それを以下のものに注ぐ。すなわち、<strong>臨在の幕屋</strong>、<strong>掟の箱</strong>、<strong>机とそのすべての祭具</strong>、<strong>燭台</strong>とその祭具、香をたく<strong>祭壇</strong>、<strong>焼き尽くす献げ物の祭壇</strong>とそのすべての祭具、<strong>洗盤</strong>とその台。<strong><mark>あなたがこれらを聖別すると、神聖なものとなる</mark></strong>。<strong><mark>それに触れたもの</mark></strong>は、みな聖なるものとなる。<strong>アロンとその子らにこの油を注いで</strong>、彼らを聖別し、祭司としてわたしに仕えさせなさい。イスラエルの人々に告げてこう言いなさい。聖なる聖別の油は、代々にわたってわたしのために使うべきものである。<strong>一般の人の体に注いだり</strong>、同じ割合のものを作ってはならない。<strong><mark>それ［油］は聖なるもの</mark></strong>であるから、<strong><mark>聖なるものとして扱いなさい</mark></strong>。類似したものを混ぜ合わせて、一般の人に塗る者は、その民から断たれる」（<a href="https://bibleox.com/ja/jp-ni/ish/30/#L23-33">出. 30:23-33</a>）<em>（29節の「神聖なもの」は、ヘブライ語原文では קֹדֶשׁ קָדָשִׁים —「至聖なるもの（聖の聖）」です。）</em></p></blockquote><p>祭壇は至聖なるものです。</p><blockquote><p>「次に、あなたは聖別の油を取って、幕屋とその中のすべてのものに注ぎ、幕屋とそのすべての祭具を聖別する。それは聖なるものとなる。次いで、焼き尽くす献げ物の祭壇とそのすべての祭具に油を注ぎ、祭壇を聖別する。<strong><mark>祭壇は神聖なものとなる</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/ish/40/#L9-10">出. 40:9-10</a>）<em>（「神聖なもの」は、ヘブライ語原文では「至聖なるもの」です。）</em></p></blockquote><blockquote><p><em>「七日の間、祭壇のために罪の贖いの儀式を行って、聖別すれば、</em><strong><em><mark>祭壇は神聖なものとなる</mark></em></strong><em>。</em><strong><em>祭壇に触れるものはすべて、聖なるものとなる</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/ish/29/#L37"><em>出. 29:37</em></a><em>）</em></p></blockquote><p><a href="https://bibleox.com/ru/ru/w/%D1%84%D0%B8%D0%BC%D0%B8%D0%B0%D0%BC">香</a>（祭壇でたくための香りのよい物質）は至聖なるものです。</p><blockquote><p>「主はモーセに言われた。以下の香料、すなわち、ナタフ香、シェヘレト香、ヘルベナ香、これらの香料と純粋な乳香をそれぞれ同量取り、<strong><mark>香</mark></strong>を作りなさい。すなわち、香料師の混ぜ合わせ方に従ってよく混ぜ合わせた、純粋な、聖なる香を作る。その一部を細かく砕いて粉末にし、粉末の一部を、臨在の幕屋の中の掟の箱の前に置く。わたしはそこであなたに会う。これはあなたたちにとって<strong><mark>神聖なもの</mark></strong>である。同じ割合で作った香を私用に使ってはならない。<strong><mark>あなたは、それを主に対して聖なるものとしなければならない</mark></strong>。また、類似したものを作って、香りを楽しもうとする者は、すべてその民から断たれる」（<a href="https://bibleox.com/ja/jp-ni/ish/30/#L34-38">出. 30:34-38</a>）</p></blockquote><h3>聖なる像</h3><blockquote><p><em>「</em><strong><em><mark>幕屋は十枚の幕で造りなさい</mark></em></strong><em>。亜麻のより糸、青、紫、緋色の毛糸を使い、</em><strong><em><mark>意匠家の描いたケルビムの模様を織り込みなさい</mark></em></strong><em>」（</em><a href="https://bibleox.com/ja/gr-lxx-byz/ish/26/#L1"><em>出. 26:1</em></a><em>、ギリシア語からの訳; </em><a href="https://bibleox.com/ja/jp-ni/ish/36/#L8"><em>出. 36:8</em></a><em>）</em></p></blockquote><blockquote><p><em>「次に、</em><strong><em>あなたは聖別の油を取って</em></strong><em>、</em><strong><em><mark>幕屋とその中のすべてのものに</mark>注ぎ</em></strong><em>、幕屋と</em><strong><em><mark>そのすべての祭具を</mark></em></strong><em></em><strong><em><mark>聖別する</mark></em></strong><em>。</em><strong><em><mark>それは聖なるものとなる</mark></em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/ish/40/#L9"><em>出. 40:9</em></a><em>）</em></p></blockquote><h3>聖なる人々（祭司）</h3><p><a href="https://bibleox.com/ru/ru/w/%D0%A2%D0%B0%D0%B8%D0%BD%D1%81%D1%82%D0%B2%D0%BE-%D0%A1%D0%B2%D1%8F%D1%89%D0%B5%D0%BD%D1%81%D1%82%D0%B2%D0%B0">祭司</a>はアロンの子孫だけです。</p><blockquote><p><em>「</em><strong><em>アロンとその子らに</em></strong><em>飾り帯を締め、ターバンを巻く。</em><strong><em>彼らの祭司職はこうして、不変の定めにより、彼らのものとなる</em></strong><em>。次に、アロンとその子らの任職式を行う」（</em><a href="https://bibleox.com/ja/jp-ni/ish/29/#L9"><em>出. 29:9</em></a><em>）</em></p></blockquote><p>祭司職は、聖なる祭服と共に、油注ぎによって受け継がれます。</p><blockquote><p><em>「アロンの</em><strong><em>祭服は</em></strong><em>、</em><strong><em>彼の後を継ぐ子らが聖別の油を注がれ、祭司職に任命されたならば、彼らのものとなる</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/ish/29/#L29"><em>出. 29:29</em></a><em>）</em></p></blockquote><p>聖なる奉仕に近づいたほかの者は死なねばなりませんでした。祭司職の務めは、これを見張ることでした。</p><blockquote><p><em>「あなたはアロンとその子らを監督して、その祭司職を厳守させなさい。</em><strong><em>ほかの者がその務めをしようとするならば死刑に処せられる</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/chis/3/#L10"><em>民. 3:10</em></a><em>）</em></p></blockquote><h4>預言者エリシャの遺体に触れていやされた</h4><blockquote><p><em>「人々がある人を葬ろうとしていたとき、その部隊を見たので、彼をエリシャの墓に投げ込んで立ち去った。その人は</em><strong><em>エリシャの骨に</em></strong><em>触れると生き返り、自分の足で立ち上がった」（</em><a href="https://bibleox.com/ja/jp-ni/4ts/13/#L21"><em>王下. 13:21</em></a><em>）</em></p></blockquote><h3>聖なる儀式と機密</h3><p>旧約には非常に多くの儀式がありました。それについてはレビ記から知ることができます。たとえば、大祭司を任命する儀式（ロシア語）：<a href="https://bibleox.com/ru/ru/w/%D0%B2%D0%B5%D1%82%D1%85%D0%BE%D0%B7%D0%B0%D0%B2%D0%B5%D1%82%D0%BD%D1%8B%D0%B9-%D1%81%D0%B2%D1%8F%D1%89%D0%B5%D0%BD%D0%BD%D0%B8%D0%BA#HH-%D0%9E%D0%B1%D1%80%D1%8F%D0%B4">旧約の祭司 — 儀式</a></p><p>（旧約の）聖体のいけにえ：</p><p><a href="https://bibleox.com/ru/ru/w/%D0%95%D0%B2%D1%85%D0%B0%D1%80%D0%B8%D1%81%D1%82%D0%B8%D1%8F">聖体機密（エウカリスティア） — 旧約における予型</a></p><h3>祈りを伴う按手</h3><h4>ヤコブは孫たちを祝福する</h4><p>ヤコブは孫たちの上に手を置き、祈りによって祝福しました。</p><blockquote><p><em>「イスラエルは</em><strong><em>右手を伸ばして</em></strong><em>、弟である</em><strong><em>エフライムの<mark>頭の上に置き</mark>、左手をマナセの<mark>頭の上に置いた</mark></em></strong><em>。&lt;…&gt; そして、ヨセフを</em><strong><em><mark>祝福して</mark></em></strong><em>言った。『わたしの先祖アブラハムとイサクがその御前に歩んだ神よ。わたしの生涯を今日まで導かれた牧者なる神よ。わたしをあらゆる苦しみから贖われた</em><strong><em><mark>御使いよ</mark></em></strong><em>。どうか、</em><strong><em><mark>この子供たちの上に祝福をお与えください</mark></em></strong><em>。どうか、わたしの名とわたしの先祖アブラハム、イサクの名が彼らによって覚えられますように。どうか、彼らがこの地上に数多く増え続けますように』」（</em><a href="https://bibleox.com/ja/jp-ni/gen/48/#L14-16"><em>創. 48:14-16</em></a><em>）</em></p></blockquote><h4>モーセはヌンの子ヨシュアを務めに任じる</h4><p>神は預言者モーセに、按手によってヌンの子ヨシュアを務めに任じるよう命じられました。</p><blockquote><p><em>「</em><strong><em><mark>主はモーセに言われた</mark></em></strong><em>。『霊に満たされた人、</em><strong><em><mark>ヌンの子ヨシュアを選んで</mark></em></strong><em>、</em><strong><em><mark>手を彼の上に置き</mark></em></strong><em>』&lt;…&gt; モーセは、主が命じられたとおりに、ヨシュアを選んで祭司エルアザルと共同体全体の前に立たせ、</em><strong><em><mark>手を彼の上に置いて</mark></em></strong><em>、主がモーセを通して命じられたとおりに、彼を職に任じた」（</em><a href="https://bibleox.com/ja/jp-ni/chis/27/#L18,22-23"><em>民. 27:18,22-23</em></a><em>）</em></p></blockquote><h4>レビ人を務めに任じる方法</h4><p>神は、按手によってレビ人を神殿の務めに任じるよう命じられました。</p><blockquote><p><em>「そして、レビ人を主の御前に進ませ、イスラエルの人々は</em><strong><em><mark>レビ人の上に手を置く</mark></em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/chis/8/#L10"><em>民. 8:10</em></a><em>）</em></p></blockquote><h2>反論への応答</h2><h3>神は人の手で造ったものには住まない</h3><p>神殿に反対する教会の批判者たちは、次の節を引用します。</p><blockquote><p>「ダビデは神の御心に適い、ヤコブの家のために神の住まいが欲しいと願っていましたが、神のために家を建てたのはソロモンでした。けれども、<strong>いと高き方は人の手で造ったようなものにはお住みになりません</strong>。これは、預言者も言っているとおりです。『主は言われる。「天はわたしの王座、地はわたしの足台。お前たちは、わたしにどんな家を建ててくれると言うのか。わたしの憩う場所はどこにあるのか」』」（<a href="https://bibleox.com/ja/jp-ni/act/7/#L46-49">使. 7:46-49</a>）</p></blockquote><p>しかし、これは決して神殿に反対する証言ではありません。ダビデが神のために家（神殿）を建てたいと思った時までに、神御自身がすでに預言者モーセに、幕屋を造り、それを聖別し、そこに祭司を立て、儀式を守り、聖なるもの（契約の箱）を持つよう命じ、神の定めた秩序に背くことに対して死罪を定めておられたからです。この節は、神は神殿の中だけでなく、どこにでもおられるということを説明しているにすぎません。そして神殿は神御自身の定めであって、人間の定めではなく、まして異教徒から借りてきたものなどではありません。</p><h2>注記</h2><h3>聖なるものに反抗し、その上に自分を高めることは、反キリストのしるしの一つである</h3><blockquote><p>「だれがどのような手段を用いても、だまされてはいけません。なぜなら、まず、神に対する反逆が起こり、<strong><mark>不法の者</mark></strong>、つまり、滅びの子が出現しなければならないからです。この者は、<strong><mark>すべて神と呼ばれたり</mark></strong><strong><mark>拝まれたりするもの</mark></strong>に<strong><mark>反抗して、傲慢にふるまい</mark></strong>、ついには、神殿に座り込み、自分こそは神であると宣言するのです」（<a href="https://bibleox.com/ja/jp-ni/2sol/2/#L3-4">２テサ. 2:3-4</a>）</p></blockquote><blockquote><p>「子供たちよ、終わりの時が来ています。反キリストが来ると、あなたがたがかねて聞いていたとおり、<strong><mark>今や多くの反キリストが現れています</mark></strong>。これによって、終わりの時が来ていると分かります」（<a href="https://bibleox.com/ja/jp-ni/1in/2/#L18">１ヨハ. 2:18</a>）</p></blockquote><h3>獣は天に住む者たちを冒瀆する</h3><blockquote><p>「そこで、獣は口を開いて神を冒瀆し、神の名と神の幕屋、<strong><mark>天に住む者たちを冒瀆した</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/otkr/13/#L6">黙. 13:6</a>）</p></blockquote><h3>天には義人たちの魂と天使たちが住んでいる</h3><blockquote><p>「しかし、<strong><mark>あなたがたが近づいたのは</mark></strong>、シオンの山、生ける神の都、<strong><mark>天のエルサレム</mark>、無数の<mark>天使たち</mark>の祝いの集まり</strong>、<strong>天に登録されている長子たちの集会</strong>、すべての人の審判者である神、<strong><mark>完全なものとされた正しい人たちの霊</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/evr/12/#L22-23">ヘブ. 12:22-23</a>）</p></blockquote>

