    references: |-
      <ol><li><p><strong>聖金口イオアン：</strong>「その後、キリストは彼らの当惑に対するもう一つの解答を加えて言われる。<em>命を与えるのは“霊”である。肉は何の役にも立たない</em>（6:63）。すなわち、わたしについて言われたことは霊的に聞かなければならない。肉的に聞く者は何も得ず、何の益も受けない。どのようにして天から降って来たのかと疑い、ヨセフの子だと考え、<em>どうしてこの人は自分の肉を我々に食べさせることができるのか</em>（52節）と問うこと——これは肉的な聞き方のなせるわざであった。これらすべては機密的、霊的に理解されなければならなかったのである。しかし、あなたは言う、肉を食べるとは何であるかを、彼らはどこから理解できたのか、と。まさにそれゆえにこそ、彼らはふさわしい時を待ち、尋ねるべきであって、去るべきではなかったのである。<em>わたしがあなたがたに話した言葉は霊であり、命である</em>（63節）。すなわち、それは神的で霊的であり、肉的なものを何も含まず、自然の秩序に従うものでもなく、そのようなあらゆる必然から自由で、地上で働く法則を超え、別の特別な意味を持っている。こうして、ここで『霊的な（言葉）』と言う代わりに『霊』と言われたように、『肉』と言われたときにも、肉的な（ものごと）ではなく肉的な聞き方を意味しておられたのであり、同時に、霊的なものを望むべきときにいつも肉的なものを望んでいたユダヤ人たちを暗に指しておられたのである。霊的なことを肉的に理解する者は何の益も得ないからである。では何か。キリストの肉は肉ではないのか。疑いなく肉である。それならなぜ<em>肉は何の役にも立たない</em>と言われるのか。御自分の肉についてではなく——決してそうではない——御自分の言葉を肉的に理解する者たちについて言っておられるのである。では『肉的に理解する』とは何か。物事を単純に見て、それ以上のことを何も思い描かないこと、これが肉的に理解するということである。しかしわたしたちは、目に見えるものをそのように判断してはならず、内なる目をもってそのすべての機密を見通さなければならない。これが霊的に理解するということである。実際、キリストの肉を食べず、その血を飲まない者は、自分の内に命を持たない。それなら、それなしには生きることができないのに、どうして肉が何の役にも立たないことがあろうか。<em>肉は何の役にも立たない</em>という言葉が、キリストの肉についてではなく、肉的な聞き方について言われていることが分からないのか」（『ヨハネによる福音書講話』。英訳からの訳）</p></li></ol>
    body: |-
      <h2>聖体機密の制定</h2><p>主であり神であるイエス・キリストは、12人の使徒だけを集めた最後の晩餐において、聖体機密を制定されました：</p><blockquote><p>「一同が食事をしているとき、イエスはパンを取り、賛美の祈りを唱えて、それを裂き、弟子たちに与えながら言われた。『<strong>取って食べなさい。これはわたしの体である。</strong>』また、杯を取り、感謝の祈りを唱え、彼らに渡して言われた。『<strong>皆、この杯から飲みなさい。これは</strong>、罪が赦されるように、多くの人のために流される<strong>わたしの血、契約の血である</strong>』」（<a href="https://bibleox.com/ja/jp-ni/mf/26/#L26-28">マタ. 26:26-28</a>）／<em>こちらも：</em><a href="https://bibleox.com/ja/jp-ni/mk/14/#L22-24">マコ. 14:22-24</a><em>; </em><a href="https://bibleox.com/ja/jp-ni/lk/22/#L19-20">ルカ. 22:19-20</a><em>（ビザンティン本文（多数派写本）ではマタ 26:28 は「新しい契約の血」となっています。）</em></p></blockquote><p>救い主の復活の後に使徒となった使徒パウロは、復活されたイエス・キリストから、別に、個人的に聖体機密を行うことを教えられました：</p><blockquote><p>「わたしがあなたがたに伝えたことは、<strong>わたし自身、主から受けたものです</strong>。すなわち、主イエスは、引き渡される夜、パンを取り、感謝の祈りをささげてそれを裂き、『<strong>これは、あなたがたのためのわたしの体である</strong>。わたしの記念としてこのように行いなさい』と言われました。また、食事の後で、杯も同じようにして、『<strong>この杯は、わたしの血によって立てられる新しい契約である</strong>。飲む度に、わたしの記念としてこのように行いなさい』と言われました」（<a href="https://bibleox.com/ja/jp-ni/1kor/11/#L23-25">１コリ. 11:23-25</a>）</p></blockquote><h2>聖体機密にあずかることなしには救いはありえない</h2><blockquote><p>「イエスは言われた。『はっきり言っておく。<strong>人の子の肉を食べ、その血を飲まなければ、あなたたちの内に命はない</strong>。わたしの肉を食べ、わたしの血を飲む者は、永遠の命を得、わたしはその人を終わりの日に復活させる。わたしの肉はまことの食べ物、わたしの血はまことの飲み物だからである。わたしの肉を食べ、わたしの血を飲む者は、いつもわたしの内におり、わたしもまたいつもその人の内にいる。生きておられる父がわたしをお遣わしになり、またわたしが父によって生きるように、わたしを食べる者もわたしによって生きる。これは天から降って来たパンである。先祖が食べたのに死んでしまったようなものとは違う。<strong>このパンを食べる者は永遠に生きる</strong>』」（<a href="https://bibleox.com/ja/jp-ni/in/6/#L53-58">ヨハ. 6:53-58</a>）</p></blockquote><h2>聖体機密によって一つの体に結ばれる</h2><p>聖体機密にあずかる者は、真に（実際に）キリストと、また互いに、キリストの体において結ばれます：</p><blockquote><p>「<strong>わたしたちが神を賛美する賛美の杯は</strong>、<strong>キリストの血にあずかること</strong>ではないか。<strong>わたしたちが裂くパンは</strong>、<strong>キリストの体にあずかること</strong>ではないか。<strong>パンは一つだから、わたしたちは大勢でも一つの体です。皆が一つのパンを分けて食べるからです</strong>」（<a href="https://bibleox.com/ja/jp-ni/1kor/10/#L16-17">１コリ. 10:16-17</a>）</p></blockquote><blockquote><p>「<strong>あなたがたはキリストの体であり</strong>、また、一人一人はその部分です」（<a href="https://bibleox.com/ja/jp-ni/1kor/12/#L27">１コリ. 12:27</a>）</p></blockquote><blockquote><p>「しかしあなたがたは、以前は遠く離れていたが、今や、<strong>キリスト・イエスにおいて、キリストの血によって近い者となったのです</strong>」（<a href="https://bibleox.com/ja/jp-ni/ef/2/#L13">エフェ. 2:13</a>）</p></blockquote><h2>機密は、イエス・キリストのまことの体と血である</h2><h3>パンは、キリストが世を生かすために与える肉である</h3><p>聖体機密において、信者たちは、イエス・キリストが十字架上で御自身をいけにえとして献げ、世の命のために与えられた、まことの（実在の）体とまことの血を自分の内に受けます：</p><blockquote><p>「わたしは命のパンである。あなたたちの先祖は荒れ野でマンナを食べたが、死んでしまった。しかし、これは、天から降って来たパンであり、これを食べる者は死なない。わたしは、天から降って来た生きたパンである。このパンを食べるならば、その人は永遠に生きる。<strong>わたしが与えるパンとは、<u>世を生かすため</u>のわたしの<u>肉</u>のことである</strong>」（<a href="https://bibleox.com/ja/jp-ni/in/6/#L48-51">ヨハ. 6:48-51</a>）</p></blockquote><p>ここで主は、この天からのパンが御自分の肉であり、それを<strong>今</strong>持っておられ、<strong>将来</strong>世の命のために与えると直接言っておられます。将来、主が刑の執行に引き渡されるのは、象徴でも、記念でも、教えでもなく、御自分の実在の肉です。そしてまさにこれが、主が食べるよう差し出される天からのパンなのです。</p><h3>契約の血は大いなる聖物である</h3><p>契約の血を聖なるものと見なさず、それによって恵みの霊を侮辱する者は、最も重い罰を受けることになります：</p><blockquote><p>「モーセの律法を破る者は、二、三人の証言に基づいて、情け容赦なく死刑に処せられます。<strong>まして、神の子を足げにし、自分が聖なる者とされた<mark>契約の血を汚れたものと見なし</mark>、その上、恵みの霊を侮辱する者は、どれほど重い刑罰に値すると思いますか</strong>」（<a href="https://bibleox.com/ja/jp-ni/evr/10/#L28-29">ヘブ. 10:28-29</a>）</p></blockquote><blockquote><p>「しかし、<strong>聖霊を冒瀆する者は</strong>永遠に赦されず、<strong>永遠に罪の責めを負う</strong>」（<a href="https://bibleox.com/ja/jp-ni/mk/3/#L29">マコ. 3:29</a>）</p></blockquote><h3>人の子の肉</h3><p>聖体機密について語るとき、キリストは御自分の人間としての本性に注意を向けておられます：</p><blockquote><p>「イエスは言われた。『はっきり言っておく。<strong>人の子の肉</strong>を食べ、その血を飲まなければ、あなたたちの内に命はない』」（<a href="https://bibleox.com/ja/jp-ni/in/6/#L53">ヨハ. 6:53</a>）</p></blockquote><h3>ふさわしくないままであずかる者には病と死がある</h3><p>食べる前に自分を確かめることが求められます。ふさわしくないままであずかる者は罪を犯すことになり、病気になり、死ぬことさえあります：</p><blockquote><p>「従って、ふさわしくないままで主のパンを食べたり、その杯を飲んだりする者は、主の体と血に対して罪を犯すことになります。だれでも、自分をよく確かめたうえで、そのパンを食べ、その杯から飲むべきです。<strong>主の体のことをわきまえずに飲み食いする者は、自分自身に対する裁きを飲み食いしているのです</strong>。<strong>そのため、あなたがたの間に弱い者や病人がたくさんおり、多くの者が死んだのです</strong>」（<a href="https://bibleox.com/ja/jp-ni/1kor/11/#L27-30">１コリ. 11:27-30</a>）<em>（ビザンティン本文（多数派写本）では29節は「ふさわしくないままで飲み食いする者は、主の体をわきまえないので、自分自身に対する裁きを飲み食いしているのです」となっています。）</em></p></blockquote><h3>キリストを門にたとえるのは比喩か</h3><p>人々と語り合う中で、キリストは御自分を羊の囲いの門にたとえておられます：</p><blockquote><p>「イエスはまた言われた。『はっきり言っておく。<strong>わたしは羊の門である</strong>』」（<a href="https://bibleox.com/ja/jp-ni/in/10/#L7">ヨハ. 10:7</a>）</p></blockquote><p>ここでキリストは比喩的に御自分を門と呼んでおられるのだから、肉と血についての聖体機密の言葉も比喩的に理解すべきだということになるのでしょうか。いいえ、そういうことにはなりません。門へのたとえの前に、救い主は、門を通って羊の囲いに入る羊飼いと、ほかの所を乗り越えて来る盗人についてのたとえを話されました。御自分を門にたとえることで、救い主はこのたとえを締めくくり、人々に説明しておられるだけなのです。キリストは人々にはいつもたとえで語られ、弟子たちにはひそかにすべてを説明されました：</p><blockquote><p>「弟子たちはイエスに近寄って、『<strong>なぜ、あの人たちにはたとえを用いてお話しになるのですか</strong>』と言った。イエスはお答えになった。『<strong>あなたがたには天の国の秘密を悟ることが許されているが、あの人たちには許されていないからである</strong>』」（<a href="https://bibleox.com/ja/jp-ni/mf/13/#L10-11">マタ. 13:10-11</a>）</p></blockquote><blockquote><p>「<strong>だから、彼らにはたとえを用いて話すのだ</strong>。見ても見ず、<strong>聞いても聞かず、理解できないからである</strong>」（<a href="https://bibleox.com/ja/jp-ni/mf/13/#L13">マタ. 13:13</a>）</p></blockquote><blockquote><p>「そこで、イエスは言われた。『あなたがたには神の国の秘密が打ち明けられているが、<strong>外の人々には、すべてがたとえで示される</strong>』」（<a href="https://bibleox.com/ja/jp-ni/mk/4/#L11">マコ. 4:11</a>）</p></blockquote><blockquote><p>「イエスは、人々の聞く力に応じて、このように多くのたとえで御言葉を語られた。<strong>たとえを用いずに語ることはなかったが、御自分の弟子たちにはひそかにすべてを説明された</strong>」（<a href="https://bibleox.com/ja/jp-ni/mk/4/#L33-34">マコ. 4:33-34</a>）</p></blockquote><p>シオンの部屋で<strong>弟子たちだけと共にいて</strong>聖体機密について彼らと語られたとき、キリストはたとえを必要とされず、たとえ、ましてや体と血についてのたとえを付け加えられませんでした。つまり、キリストは比喩的にではなく、文字どおりに語られたのです。人々と語り合うときにも、キリストは聖体機密についての御自分の言葉に何のたとえも付け加えられませんでした。キリストは旧約のマンナについての話から始められました。これはたとえではなく、現実です。ユダヤ人たちは、実際に死なないために、実際にマンナを食べました。そして主は、彼らはマンナを食べたけれども、それでも（結局はすべての人と同じように）死んだ、しかし御自分を食べる者は死なない、と言われるのです。</p><blockquote><p>「<strong>わたしを食べる者もわたしによって生きる</strong>。これは天から降って来たパンである。<strong>先祖が食べたのに死んでしまったようなものとは違う。このパンを食べる者は永遠に生きる</strong>」（<a href="https://bibleox.com/ja/jp-ni/in/6/#L57-58">ヨハ. 6:57-58</a>）</p></blockquote><h3>「ぶどうの実から作ったものを飲むことは決してあるまい」</h3><p>ある人々は、最後の晩餐でのぶどうの実についてのキリストの言葉を挙げて、聖体機密における肉と血の実在的な理解に反対します。</p><p>ぶどうの実については、マルコ、マタイ、ルカの三人の福音記者が語っています。福音記者ルカは、マルコやマタイと違って晩餐をより詳しく描き、飲まれた幾つかの杯に触れています：</p><h4>第一の杯</h4><blockquote><p>「イエスは言われた。『苦しみを受ける前に、あなたがたと共にこの過越の食事をしたいと、わたしは切に願っていた。言っておくが、神の国で過越が成し遂げられるまで、わたしは決してこの過越の食事をとることはない。』そして、<strong>イエスは杯を取り上げ、感謝の祈りを唱えてから言われた。『これを取り、互いに回して飲みなさい</strong>。言っておくが、神の国が来るまで、わたしは今後ぶどうの実から作ったものを飲むことは決してあるまい』」（<a href="https://bibleox.com/ja/jp-ni/lk/22/#L15-18">ルカ. 22:15-18</a>）</p></blockquote><p>ここまでは、まだ聖体機密も、体と血についての言葉もありませんでした。あったのは過越の食事だけです。ぶどうの実についての言葉は、すでに語られています。晩餐の後に聖体機密が始まります：</p><h4>第二の杯</h4><blockquote><p>「それから、イエスは<strong>パンを取り、感謝の祈りを唱えて、それを裂き、使徒たちに与えて言われた。『これは</strong>、あなたがたのために与えられる<strong>わたしの体である</strong>。わたしの記念としてこのように行いなさい。』食事を終えてから、<strong>杯も同じようにして言われた。『<mark>この杯は</mark>、あなたがたのために流される、わたしの血による新しい契約である</strong>』」（<a href="https://bibleox.com/ja/jp-ni/lk/22/#L19-20">ルカ. 22:19-20</a>）</p></blockquote><p>このように、前半では伝統的なユダヤ人の過越の食事だけが行われ、そこでは必ず<strong>4杯のぶどう酒</strong>と水を飲み、神に感謝をささげました。聖書には、この4杯のぶどう酒を飲めという命令はありません。これはユダヤ人の慣習にすぎませんでした。ユダヤ人の過越の食事の慣習は、ユダヤ教のミシュナにより詳しく記されています：</p><blockquote><p><em>第一ミシュナ</em></p><p><em>(א) עַרְבֵי פְסָחִים סָמוּךְ לַמִּנְחָה, לֹא יֹאכַל אָדָם עַד שֶׁתֶּחְשַׁךְ. וַאֲפִלּוּ עָנִי שֶׁבְּיִשְׂרָאֵל לֹא יֹאכַל עַד שֶׁיָּסֵב. וְלֹא יִפְחֲתוּ לוֹ מֵאַרְבָּעָה כוֹסוֹת שֶׁל יַיִן, וַאֲפִלּוּ מִן הַתַּמְחוּי:</em></p><p><em>過越祭の前夜、午後の献げ物の時刻が近づいたら、暗くなるまで何も食べてはならない。イスラエルの最も貧しい者であっても、（食事の席で）横になるまでは食べてはならない。そして、</em><strong><em>四杯のぶどう酒より少なくしてはならない</em></strong><em>。たとえ施しの食卓から食べる者であっても。</em></p></blockquote><p>（<a href="https://toldot.com/articles/articles_30013.html">ミシュナ「ペサヒーム」10</a>、ロシア語）</p><p>最初のとき、キリストはこの慣習を行われるだけです。杯を取り、感謝し、弟子たちに渡されますが、それが御自分の血であるとは一言も言われず、互いに分けるよう言われ、弟子たちは明らかにそうしました。杯は飲み干されます。ここにはパンについての言及はまったくありません。それからキリストは、もう飲まないというぶどうの実についての句を語られ（ルカ 22:18）、そして<strong>食事を終えてから</strong>（ルカ 22:20; １コリ 11:25）初めて、キリストはパンを取り、再び杯を取り（最初の杯はすでに飲み干されたので、これは別の杯です）、弟子たちに渡し、今度こそ御自分の体と血について語られるのです。</p><h2>聖体機密の旧約における予型</h2><h3>過越の小羊</h3><p>傷のない雄の小羊（傷のない一歳の小羊）は、人々の罪のために実際に<strong>死に</strong>、それから実際に、全部<strong>食べられ</strong>なければなりませんでした。小羊であるキリストは、この像の両方の部分を文字どおりに体現しておられます。キリストは人々の罪のために本当に（比喩的にではなく）死なれ、人々は本当に（比喩的にではなく）キリストを食べるのです。</p><blockquote><p>「イスラエルの共同体全体に次のように告げなさい。『今月の十日、人はそれぞれ父の家ごとに、すなわち家族ごとに<strong>小羊</strong>を一匹用意しなければならない。その小羊は、<strong>傷のない一歳の雄</strong>でなければならない。用意するのは羊でも山羊でもよい。それは、この月の十四日まで取り分けておき、<strong>イスラエルの共同体の会衆が皆で夕暮れにそれを屠り</strong>』」（<a href="https://bibleox.com/ja/jp-ni/ish/12/#L3,5-6">出. 12:3,5-6</a>）（<a href="https://bibleox.com/ja/jp-ni/ish/12/#L21-22,25">出. 12:21-22,25</a>）</p></blockquote><blockquote><p>「<strong>彼が刺し貫かれたのはわたしたちの背きのためであり</strong>彼が打ち砕かれたのはわたしたちの咎のためであった。彼の受けた懲らしめによってわたしたちに平和が与えられ<strong>彼の受けた傷によって、わたしたちはいやされた</strong>。わたしたちは羊の群れ道を誤り、それぞれの方角に向かって行った。<strong>そのわたしたちの罪をすべて主は彼に負わせられた</strong>。苦役を課せられて、かがみ込み彼は口を開かなかった。屠り場に引かれる小羊のように<strong>毛を刈る者の前に物を言わない羊のように</strong>彼は口を開かなかった」（<a href="https://bibleox.com/ja/jp-ni/is/53/#L5-7">イザ. 53:5-7</a>）（<a href="https://bibleox.com/ja/jp-ni/act/8/#L32">使. 8:32</a>）</p></blockquote><blockquote><p>「わたしは、<strong>飼いならされた小羊</strong>が屠り場に引かれて行くように」（<a href="https://bibleox.com/ja/jp-ni/ier/11/#L19">エレ. 11:19</a>）</p></blockquote><blockquote><p>「その翌日、ヨハネは、自分の方へイエスが来られるのを見て言った。『見よ、<strong>世の罪を取り除く神の小羊だ</strong>。』&lt;…&gt; そして、歩いておられるイエスを見つめて、『見よ、<strong>神の小羊だ</strong>』と言った」（<a href="https://bibleox.com/ja/jp-ni/in/1/#L29,36">ヨハ. 1:29,36</a>）</p></blockquote><blockquote><p>「知ってのとおり、<strong>あなたがた</strong>が先祖伝来のむなしい生活から<strong>贖われた</strong>のは、金や銀のような朽ち果てるものにはよらず、きずや汚れのない<strong>小羊</strong>のような<strong>キリストの尊い血によるのです</strong>」（<a href="https://bibleox.com/ja/jp-ni/1pet/1/#L18-19">１ペト. 1:18-19</a>）</p></blockquote><blockquote><p>「天使たちは大声でこう言った。『<strong>屠られた小羊</strong>は、力、富、知恵、威力、誉れ、栄光、そして賛美を受けるにふさわしい方です』」（<a href="https://bibleox.com/ja/jp-ni/otkr/5/#L12">黙. 5:12</a>）（<a href="https://bibleox.com/ja/jp-ni/otkr/7/#L17">黙. 7:17</a>）（<a href="https://bibleox.com/ja/jp-ni/otkr/14/#L1">黙. 14:1</a>）</p></blockquote><h3>マナ</h3><p>荒れ野のマナは、エジプトの捕囚から約束の地へ向かう途上で、ユダヤ人の民の力を支えました。彼らは荒れ野で実際にマナを食べました。それは実際に人々を死から守り、命を与えました（荒れ野にはほかに食べ物がありませんでした）：</p><blockquote><p>「主はモーセに言われた。『見よ、<strong>わたしはあなたたちのために、天からパンを降らせる</strong>。民は出て行って、<strong>毎日</strong>必要な分だけ集める。わたしは、彼らがわたしの指示どおりにするかどうかを試す。』&lt;…&gt; イスラエルの家では、<strong>それをマナと名付けた</strong>。それは、コエンドロの種に似て白く、蜜の入ったウェファースのような味がした」（<a href="https://bibleox.com/ja/jp-ni/ish/16/#L4,31">出. 16:4,31</a>）</p></blockquote><blockquote><p>「夜、宿営に<strong>露が降りると、マナも降った</strong>」（<a href="https://bibleox.com/ja/jp-ni/chis/11/#L9">民. 11:9</a>）</p></blockquote><p>マナは像、来るべきものの影にすぎず、そのもの自体ではないので、永遠の命を与えはせず、地上の命を延ばし、飢え死にから救っただけでした。結局、あのユダヤ人たちは皆、人々が死ぬのと同じように死にました。しかしキリストは、御自分を食べる者は永遠に生きると言われます：</p><blockquote><p>「わたしたちの先祖は、<strong>荒れ野でマンナを食べました</strong>。『<strong>天からのパンを彼らに与えて食べさせた</strong>』と書いてあるとおりです。」すると、イエスは言われた。『はっきり言っておく。モーセが天からのパンをあなたがたに与えたのではなく、わたしの父が天からのまことのパンをお与えになる。<strong>神のパンは、天から降って来て、世に命を与えるものである</strong>。』&lt;…&gt; イエスは言われた。『<strong>わたしが命のパンである</strong>。わたしのもとに来る者は決して飢えることがなく、わたしを信じる者は決して渇くことがない。&lt;…&gt; <strong>わたしは命のパンである</strong>。あなたたちの先祖は<strong>荒れ野でマンナを食べたが、死んでしまった</strong>。しかし、これは、<strong>天から降って来たパンであり、これを食べる者は死なない</strong>』」（<a href="https://bibleox.com/ja/jp-ni/in/6/#L31-33,35,48-50">ヨハ. 6:31-33,35,48-50</a>）</p></blockquote><blockquote><p>「<strong>わたしの肉を食べ、わたしの血を飲む者は、永遠の命を得</strong>、わたしはその人を終わりの日に復活させる。&lt;…&gt; <strong>わたしを食べる者もわたしによって生きる</strong>。これは天から降って来たパンである。<strong>先祖が食べたのに死んでしまったようなものとは違う。このパンを食べる者は永遠に生きる</strong>」（<a href="https://bibleox.com/ja/jp-ni/in/6/#L54-55,57-58">ヨハ. 6:54-55,57-58</a>）</p></blockquote><p>さらに、エジプトの奴隷状態から約束の地へのユダヤ人の道全体を、罪の奴隷状態から天の国へのキリスト者の道と見るなら、ここでもマナは文字どおり聖体機密を指し示しています：</p><ul><li><p>実際のエジプトの捕囚 — 実際の罪の奴隷状態。</p></li><li><p>海の底を通る、奴隷状態からの実際の脱出 — 実際の洗礼（<a href="https://bibleox.com/ja/jp-ni/1kor/10/#L2">１コリ. 10:2</a>）。</p></li><li><p>実際の40年の荒れ野の放浪 — 教会における実際の地上の生活。</p></li><li><p>実際のマナと水 — 神によって与えられる、救い主の実際の体と血。</p></li><li><p>ユダヤ人に約束された実際の地 — 実際の国。ただし今は地上の国ではなく、天の国。</p></li></ul><h3>マラの甘い水</h3><blockquote><p>「モーセはイスラエルを、葦の海から旅立たせた。彼らはシュルの荒れ野に向かって、荒れ野を三日の間進んだが、水を得なかった。マラに着いたが、そこの水は苦くて飲むことができなかった。こういうわけで、そこの名はマラ（苦い）と呼ばれた。民はモーセに向かって、『何を飲んだらよいのか』と不平を言った。モーセが主に向かって叫ぶと、主は彼に<strong>一本の木を示された。その木を水に投げ込むと、水は甘くなった</strong>。その所で主は彼に掟と法とを与えられ、またその所で彼を試みて」（<a href="https://bibleox.com/ja/jp-ni/ish/15/#L22-25">出. 15:22-25</a>）</p></blockquote><h3>家の入り口に小羊の血を塗ること</h3><p>家の入り口に血を塗ることが、死から救いました：</p><blockquote><p>「<strong>その血を取って、小羊を食べる家の入り口の二本の柱と鴨居に塗る</strong>。&lt;…&gt; そして、一束のヒソプを取り、鉢の中の血に浸し、<strong>鴨居と入り口の二本の柱に鉢の中の血を塗りなさい</strong>。翌朝までだれも家の入り口から出てはならない。主がエジプト人を撃つために巡るとき、<strong>鴨居と二本の柱に塗られた血を御覧になって、その入り口を過ぎ越される。滅ぼす者が家に入って、あなたたちを撃つことがないためである</strong>」（<a href="https://bibleox.com/ja/jp-ni/ish/12/#L7,22-23">出. 12:7,22-23</a>）</p></blockquote><h3>罪を清める祭壇の炭火</h3><p>預言者イザヤの罪は、祭壇から取られた燃える炭火が唇に触れることによって清められました：</p><blockquote><p>「わたしは言った。『災いだ。わたしは滅ぼされる。<strong>わたしは汚れた唇の者</strong>。汚れた唇の民の中に住む者。しかも、わたしの目は王なる万軍の主を仰ぎ見た。』するとセラフィムのひとりが、わたしのところに飛んで来た。<strong>その手には祭壇から火鋏で取った炭火があった。彼はわたしの口に火を触れさせて言った。『見よ、これがあなたの唇に触れたのであなたの咎は取り去られ、罪は赦された』</strong>」（<a href="https://bibleox.com/ja/jp-ni/is/6/#L5-7">イザ. 6:5-7</a>）</p></blockquote><h3>木の実を食べること</h3><p>人類は、実際に木の実を味わうことによって神から離れました（<a href="https://bibleox.com/ja/jp-ni/gen/3/#L6">創. 3:6</a>）。それで人類は、十字架の木の実を食べることによって神に立ち帰ります。人は不従順の木によって神から離れましたが、十字架上の従順の木によって立ち帰ります（<a href="https://bibleox.com/ja/jp-ni/fil/2/#L8">フィリ. 2:8</a>; <a href="https://bibleox.com/ja/jp-ni/mf/16/#L24">マタ. 16:24</a>）。木の実は命を奪いました。木の実が命を取り戻させます。人は出て行ったその門から入るのです。あのとき主は「<em>食べてはならない</em>」（<a href="https://bibleox.com/ja/jp-ni/gen/2/#L17">創. 2:17</a>）と言われましたが、彼らは食べました。今、主は「<em>食べなさい</em>」（<a href="https://bibleox.com/ja/jp-ni/mf/26/#L26">マタ. 26:26</a>）と言われますが、多くの人が同じ過ちを犯しています。ただし今は逆に、食べないのです。あのときも今も、この戒めを守るのは難しくなかったのですが：</p><blockquote><p>「でも、園の中央に生えている木の果実だけは、<strong>食べてはいけない</strong>、触れてもいけない、死んではいけないから、<strong>と神様はおっしゃいました</strong>」（<a href="https://bibleox.com/ja/jp-ni/gen/3/#L3">創. 3:3</a>）「ただし、善悪の知識の木からは、<strong>決して食べてはならない</strong>。食べると<strong>必ず死んでしまう</strong>」（<a href="https://bibleox.com/ja/jp-ni/gen/2/#L17">創. 2:17</a>）</p></blockquote><blockquote><p>「一同が食事をしているとき、イエスはパンを取り、賛美の祈りを唱えて、それを裂き、弟子たちに与えながら<strong>言われた。『取って食べなさい</strong>。これはわたしの体である』」（<a href="https://bibleox.com/ja/jp-ni/mf/26/#L26">マタ. 26:26</a>）「これは天から降って来たパンである。先祖が食べたのに死んでしまったようなものとは違う。<strong>このパンを食べる者は永遠に生きる</strong>」（<a href="https://bibleox.com/ja/jp-ni/in/6/#L58">ヨハ. 6:58</a>）</p></blockquote><h2>物の本性の変化</h2><ul><li><p>杖が蛇に、そしてまた杖に（<a href="https://bibleox.com/ja/jp-ni/ish/4/#L3-4">出. 4:3-4</a>; <a href="https://bibleox.com/ja/jp-ni/ish/7/#L9-10,15">出. 7:9-10,15</a>）。</p></li></ul><ul><li><p>水が血に（<a href="https://bibleox.com/ja/jp-ni/ish/7/#L17,19-21">出. 7:17,19-21</a>）。</p></li></ul><ul><li><p>水がぶどう酒に（<a href="https://bibleox.com/ja/jp-ni/in/2/#L7-10">ヨハ. 2:7-10</a>）。</p></li></ul><h2>パンとぶどう酒の祝福</h2><p>初めに無から宇宙を造り、世界的な洪水を起こし、太陽を止め、どんな場所でも奇跡的にさまざまな食べ物と水を与え、川と海を分け、物の本性を何度も変え（杖、水）、物質的な存在となり（受肉し）、祝福によってパンと魚を増やし（<a href="https://bibleox.com/ja/jp-ni/mf/14/#L15-21">マタ. 14:15-21</a>; <a href="https://bibleox.com/ja/jp-ni/mf/15/#L32-38">マタ. 15:32-38</a>; <a href="https://bibleox.com/ja/jp-ni/mk/6/#L35-44">マコ. 6:35-44</a>; <a href="https://bibleox.com/ja/jp-ni/mk/8/#L1-9">マコ. 8:1-9</a>; <a href="https://bibleox.com/ja/jp-ni/lk/9/#L12-17">ルカ. 9:12-17</a>; <a href="https://bibleox.com/ja/jp-ni/in/6/#L5-13">ヨハ. 6:5-13</a>）、生まれつき目の見えない人に目を造り、腐敗したラザロの肉を回復させた非物質的な神は、弟子たちとの過越の晩餐で、パンとぶどう酒をただ分け与えただけでなく、祈った後に<strong>それを祝福し</strong>、御自分の体と血と呼ばれたのです：</p><blockquote><p>「一同が食事をしているとき、イエスはパンを取り、<strong>賛美の祈りを唱えて</strong>、それを裂き、弟子たちに与えながら言われた。『取って食べなさい。<strong>これはわたしの体である</strong>。』また、杯を取り、感謝の祈りを唱え、彼らに渡して言われた。『皆、この杯から飲みなさい。<strong>これは</strong>、罪が赦されるように、多くの人のために流される<strong>わたしの血、契約の血である</strong>』」（<a href="https://bibleox.com/ja/jp-ni/mf/26/#L26-28">マタ. 26:26-28</a>）<em>（「賛美の祈りを唱えて」は、ギリシア語原文では εὐλογήσας —「祝福して」です。）</em></p></blockquote><p>この祝福を、取るに足りない空しいものと理解することはできません。</p><h2>聖体機密についての旧約の預言</h2><blockquote><p>「<strong>知恵</strong>は家を建て、七本の柱を刻んで立てた。<strong>獣を屠り、酒を調合し</strong>、食卓を整えはしためを町の高い所に遣わして呼びかけさせた。『浅はかな者はだれでも立ち寄るがよい。』意志の弱い者にはこう言った。『<strong>わたしのパンを食べわたしが調合した酒を飲むがよい</strong>浅はかさを捨て、命を得るために分別の道を進むために』」（<a href="https://bibleox.com/ja/jp-ni/pr/9/#L1-6">箴. 9:1-6</a>）</p></blockquote><blockquote><p>「<strong>渇きを覚えている者は皆、水のところに来るがよい</strong>。銀を持たない者も来るがよい。穀物を求めて、<strong>食べよ</strong>。来て、銀を払うことなく穀物を求め価を払うことなく、ぶどう酒と乳を得よ。なぜ、<strong>糧にならぬもの</strong>のために銀を量って払い<strong>飢えを満たさぬもの</strong>のために労するのか。わたしに聞き従えば良いものを食べることができる。あなたたちの魂はその豊かさを楽しむであろう。耳を傾けて聞き、わたしのもとに来るがよい。聞き従って、魂に命を得よ。わたしはあなたたちと<strong>とこしえの契約</strong>を結ぶ。ダビデに約束した真実の慈しみのゆえに」（<a href="https://bibleox.com/ja/jp-ni/is/55/#L1-3">イザ. 55:1-3</a>）</p></blockquote><blockquote><p><em>「</em><strong><em>知恵</em></strong><em>は自分自身をほめたたえ、その民の中で誇らしげに歌う。&lt;…&gt;</em><strong><em>わたしを慕う人たちよ。わたしのもとに来て、わたしの実を心行くまで食べよ。&lt;…&gt; わたしを食べる人は更に飢えを感じ、わたしを飲む人は更に渇きを覚える</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/prsir/24/#L1,19,21"><em>シラ. 24:1,19,21</em></a><em>）</em></p></blockquote><h2>批判への応答</h2><h3>キリストを門にたとえるのは比喩か</h3><p>人々に語るとき、キリストは御自分を羊の囲いに通じる門にたとえておられます：</p><blockquote><p>「イエスはまた言われた。『はっきり言っておく。<strong>わたしは羊の門である</strong>』」（<a href="https://bibleox.com/ja/jp-ni/in/10/#L7">ヨハ. 10:7</a>）</p></blockquote><p>では、キリストが比喩的に御自分を門と呼んでおられるのだから、肉と血についての聖体機密の言葉も比喩的に理解すべきだということになるのでしょうか。決してそういうことにはなりません。門へのたとえの前に、救い主は、門を通って羊の囲いに入る羊飼いと、ほかの所を乗り越えて来る盗人についてのたとえを話されました。御自分を門にたとえることで、救い主はこのたとえを締めくくり、人々に説明しておられるだけなのです。キリストは人々にはいつもたとえで語られましたが、弟子たちにはひそかにすべてを説明されました：</p><blockquote><p>「弟子たちはイエスに近寄って、『<strong>なぜ、あの人たちにはたとえを用いてお話しになるのですか</strong>』と言った。イエスはお答えになった。『<strong>あなたがたには天の国の秘密を悟ることが許されているが、あの人たちには許されていないからである</strong>』」（<a href="https://bibleox.com/ja/jp-ni/mf/13/#L10-11">マタ. 13:10-11</a>）</p></blockquote><blockquote><p>「<strong>だから、彼らにはたとえを用いて話すのだ</strong>。見ても見ず、<strong>聞いても聞かず、理解できないからである</strong>」（<a href="https://bibleox.com/ja/jp-ni/mf/13/#L13">マタ. 13:13</a>）</p></blockquote><blockquote><p>「そこで、イエスは言われた。『あなたがたには神の国の秘密が打ち明けられているが、<strong>外の人々には、すべてがたとえで示される</strong>』」（<a href="https://bibleox.com/ja/jp-ni/mk/4/#L11">マコ. 4:11</a>）</p></blockquote><blockquote><p>「イエスは、人々の聞く力に応じて、このように多くのたとえで御言葉を語られた。たとえを用いずに語ることはなかったが、<strong><mark>御自分の弟子たちにはひそかにすべてを説明された</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/mk/4/#L33-34">マコ. 4:33-34</a>）</p></blockquote><p>シオンの高間で<strong>弟子たちだけと共にいて</strong>聖体機密について彼らと語られたとき、キリストはたとえを付け加えられず、ましてや体と血についてのたとえを付け加えられませんでした。つまり、キリストは比喩的にではなく文字どおりに語られたのです。人々に語るときにも、キリストは聖体機密についての言葉に何のたとえも付け加えられませんでした。キリストは旧約のマナについての話から始められました。これはたとえではなく、現実です。ユダヤ人たちは、実際に死なないために、実際にマナを食べました。こうして、マナが像にすぎなかったことを聞き手に指摘するために、主は、彼らはマナを食べたけれども、それは飢えから救っただけで、結局は（すべての人が死ぬように）死んだ、しかし御自分を食べる者は死なない（これはもはや像ではなく、像が指し示していたもの、すなわち永遠の命を与える天からのまことのパンだからです）と言われるのです：</p><blockquote><p>「生きておられる父がわたしをお遣わしになり、またわたしが父によって生きるように、わたしを食べる者もわたしによって生きる。<strong>これは天から降って来たパンである。先祖が食べたのに死んでしまったようなものとは違う。このパンを食べる者は永遠に生きる</strong>」（<a href="https://bibleox.com/ja/jp-ni/in/6/#L57-58">ヨハ. 6:57-58</a>）</p></blockquote><h3>「ぶどうの実から作ったものを飲むことは決してあるまい」</h3><p>ある人々は、最後の晩餐でのぶどうの実についてのキリストの言葉を挙げて、聖体機密における肉と血の実在的な理解に反対します。</p><p>ぶどうの実については、マタイ、マルコ、ルカの三人の福音記者が触れています（マタ 26:29; マコ 14:25; ルカ 22:18）。福音記者ルカは、マルコやマタイと違って晩餐をより詳しく描き、飲まれた幾つかの杯に触れています：</p><h4>第一の杯</h4><blockquote><p>「イエスは言われた。『苦しみを受ける前に、あなたがたと共にこの過越の食事をしたいと、わたしは切に願っていた。言っておくが、神の国で過越が成し遂げられるまで、わたしは決してこの過越の食事をとることはない。』そして、イエスは<strong><mark>杯</mark></strong>を取り上げ、感謝の祈りを唱えてから言われた。『これを取り、<strong><mark>互いに回して飲みなさい</mark></strong>。言っておくが、神の国が来るまで、わたしは今後ぶどうの実から作ったものを飲むことは決してあるまい』」（<a href="https://bibleox.com/ja/jp-ni/lk/22/#L15-18">ルカ. 22:15-18</a>）</p></blockquote><p>キリストは、杯の中身を弟子たちの間で分けるよう命じられます。この杯は分けられます。まだ聖体機密も、体と血についての言葉もありませんでした。それは過越の食事にすぎませんでした。このぶどう酒の杯の後、キリストはすぐに、もう飲まないというぶどうの実についての句を語られます：</p><blockquote><p>「言っておくが、神の国が来るまで、わたしは今後ぶどうの実から作ったものを飲むことは決してあるまい」（<a href="https://bibleox.com/ja/jp-ni/lk/22/#L18">ルカ. 22:18</a>）</p></blockquote><p>そして<strong>食事を終えてから</strong>（ルカ 22:20; １コリ 11:25）初めて、キリストは聖体機密を行われます。パンを取り、再び杯を取り（最初の杯はすでに飲み干されたので、これは別の杯です）、弟子たちに渡し、今度こそ御自分の体と血について語られるのです：</p><h4>第二の杯</h4><blockquote><p>「それから、イエスは<strong>パンを取り、感謝の祈りを唱えて、それを裂き、使徒たちに与えて</strong>言われた。『これは、あなたがたのために与えられるわたしの体である。わたしの記念としてこのように行いなさい。』<strong><u>食事を終えてから</u>、杯も同じようにして言われた。『<mark>この杯は</mark>、あなたがたのために流される、わたしの血による新しい契約である</strong>』」（<a href="https://bibleox.com/ja/jp-ni/lk/22/#L19-20">ルカ. 22:19-20</a>）</p></blockquote><p>このように、前半では伝統的なユダヤ人の過越の食事だけが行われ、そこでは必ず水で割った4杯のぶどう酒を飲み、神に感謝をささげました。聖書には、この<strong>4杯のぶどう酒</strong>を飲めという命令はありません。これはユダヤ人の慣習にすぎませんでした。ユダヤ人の過越の食事の慣習は、ユダヤ教のミシュナにより詳しく記されています：</p><p><strong>第一ミシュナ</strong></p><blockquote><p><em>(א) עַרְבֵי פְסָחִים סָמוּךְ לַמִּנְחָה, לֹא יֹאכַל אָדָם עַד שֶׁתֶּחְשַׁךְ. וַאֲפִלּוּ עָנִי שֶׁבְּיִשְׂרָאֵל לֹא יֹאכַל עַד שֶׁיָּסֵב. וְלֹא יִפְחֲתוּ לוֹ מֵאַרְבָּעָה כוֹסוֹת שֶׁל יַיִן, וַאֲפִלּוּ מִן הַתַּמְחוּי:</em></p><p><em>過越祭の前夜、午後の献げ物の時刻が近づいたら、暗くなるまで何も食べてはならない。イスラエルの最も貧しい者であっても、（食事の席で）横になるまでは食べてはならない。そして、</em><strong><em>四杯のぶどう酒より少なく与えてはならない</em></strong><em>。たとえ施しの食卓から食べ物を受ける者であっても。</em></p></blockquote><p>（<a href="https://toldot.com/articles/articles_30013.html">ミシュナ「ペサヒーム」10</a>、ロシア語）</p><p>最初のとき、キリストはこの慣習を行われるだけです。杯を取り、感謝し、弟子たちに渡されますが、それが御自分の血であるとは何も言われず、互いに分けるよう言われ、弟子たちは明らかにそうしました。杯は飲み干されます。最初の場面ではパンについての言及はありません。しかし食事の後には、パンについて言われ、再び杯について言われ、そのとき初めてキリストの体と血についての言葉が現れます。したがって、ぶどうの実についての言葉は最初のぶどう酒の杯に関わるものであり、キリストの血についての言葉は第二の杯に関わるものです。その杯において、機密的な仕方で、弟子たちに与えられたのはもはやぶどう酒ではなく、わたしたちが信じるキリストのまことの血だったのです。</p><h3>「命を与えるのは“霊”である。肉は何の役にも立たない」</h3><p>聖体機密についての正教会の教えに反対する人々は、キリストは御自分の肉を食べることについて象徴的にだけ語られたと主張します。彼らは次の言葉を指摘します：</p><blockquote><p>「命を与えるのは“霊”である。<strong>肉は何の役にも立たない</strong>。わたしがあなたがたに話した言葉は霊であり、命である」（<a href="https://bibleox.com/ja/jp-ni/in/6/#L63">ヨハ. 6:63</a>）</p></blockquote><p>象徴説の支持者たちは、これらの節を、キリストの肉を食べることはまったく何の役にも立たないという意味だと説明します。</p><p>しかしわたしたちは、「<em>肉は何の役にも立たない</em>」という言葉は、何の役にも立たない肉的な考え方について言われていることを示します。これは、もっぱら地上的に、粗雑に、俗っぽく考える人々、すなわち自分の生活の中で見慣れた仕方でしか考えず、霊的な機密へと思いを高めることのできない人々について言われているのです[1]。</p><p>聖書には、もっぱら地上的に考える人々について、このような言葉が使われている箇所がほかにも数多くあります：</p><blockquote><p>「すると、イエスはお答えになった。『シモン・バルヨナ、あなたは幸いだ。<strong>あなたにこのことを現したのは、人間ではなく</strong>、わたしの天の父なのだ』」（<a href="https://bibleox.com/ja/jp-ni/mf/16/#L17">マタ. 16:17</a>）<em>（「人間」は、ギリシア語原文では σὰρξ καὶ αἷμα —「肉と血」です。）</em></p></blockquote><blockquote><p>「御子をわたしに示して、その福音を異邦人に告げ知らせるようにされたとき、<strong>わたしは、すぐ血肉に相談するようなことはせず</strong>」（<a href="https://bibleox.com/ja/jp-ni/gal/1/#L16">ガラ. 1:16</a>）</p></blockquote><blockquote><p>「あなたがたは、それほど物分かりが悪く、<strong>“霊”によって始めたのに、肉によって仕上げようとするのですか</strong>」（<a href="https://bibleox.com/ja/jp-ni/gal/3/#L3">ガラ. 3:3</a>）</p></blockquote><blockquote><p>「主はこう言われる。<strong>呪われよ、人間に信頼し、肉なる者を頼みとし</strong>その心が主を離れ去っている人は」（<a href="https://bibleox.com/ja/jp-ni/ier/17/#L5">エレ. 17:5</a>）</p></blockquote><p>そのような人々は、自分たちの前にいるのは普通の人、ヨセフの子だと考えていました。普通の人がどうして自分の肉を彼らに食べさせることができるでしょうか。——どんな人でもそうするように、自分の体から引きちぎって食べ物として与えるという仕方でしかありません。このような考え方は彼らに何の役にも立ちませんでした。彼らは大いにつまずいて、「<em>実にひどい話だ。だれが、こんな話を聞いていられようか</em>」（<a href="https://bibleox.com/ja/jp-ni/in/6/#L60">ヨハ. 6:60</a>）と言い、去って行きました。</p><p>しかしキリストはただの人ではなく、全能の神です。キリストは機密を定められ、その中で、御自分の命を与える肉と血が、パンとぶどう酒の形のもとに機密的な仕方で与えられます。それは神の力によって成し遂げられるのです。そのためには、霊的に考え、わたしたちが理性で必ずしも理解できないことが機密的に成し遂げられる余地、地上の秩序を超えるキリストの言葉が超自然的に成し遂げられる余地を残しておかなければなりません：</p><blockquote><p>「イエスは言われた。『はっきり言っておく。<strong>人の子の肉を食べ、その血を飲まなければ、あなたたちの内に命はない</strong>』」（<a href="https://bibleox.com/ja/jp-ni/in/6/#L53">ヨハ. 6:53</a>）</p></blockquote><h3>なぜ聖体の小片がかびたり燃えたりすることがあるのか</h3><p>聖体機密において、パンとぶどう酒がキリストの体と血に変化（実体変化）した後も、パンとぶどう酒のすべての外的な性質（偶有性、ラテン語 <em>accidentiae</em>、ギリシア語 <em>symbebekóta</em>）は残りますが、パンとぶどう酒の実体*は完全にキリストの体と血の実体に置き換えられます。この置き換えは、味覚、嗅覚、視覚、聴覚、触覚といった感覚によっては知覚されません。実体が置き換えられたという事実は、信仰によって受け入れられます。キリストの体と血は、聖体機密において機密的な仕方で与えられ、それを完全に知っておられるのは、あらゆるものの真の本性を知っておられる神だけです。一方わたしたちは、世界と物の本性を知る手段が限られています。パンとぶどう酒の外的な性質は残っており（これは錯覚ではありません）、わたしたちは外的な性質を通して世界を知覚するので、聖体機密を経験的な手段で実験的に調べることは不可能です。それでも信者は、自分自身の生活の経験を通して機密の真実を確信することができます。たとえば、機密にあずかる前と後には、しばしば霊的な誘惑が伴います。ふさわしく機密にあずかることは人の霊的な成長を助けますが、ふさわしくないままであずかること（信仰なしに、必要な痛悔の思いなしに、悔い改めていない重い罪を抱えたまま）は、霊的にも身体的にも害をもたらし、病気や死にさえ至ることがあります（１コリ 11:27-30）。それはちょうど、火と結びつく準備のできていない物が、火に触れると焦げてしまうのと同じです。</p><p><strong>用語について：</strong></p><p>偶有性について詳しく：<a href="https://azbyka.ru/otechnik/bogoslovie/chto-nahoditsja-v-chashe-prichastija/1_14">azbyka.ru</a>（ロシア語）。偶有性についてのダマスコの聖イオアン：<a href="https://azbyka.ru/otechnik/Ioann_Damaskin/filosofskie_glavy/4">azbyka.ru</a>（ロシア語）。</p><p>*実体 —— 科学の概念ではなく神学の概念です（<a href="https://azbyka.ru/otechnik/bogoslovie/chto-nahoditsja-v-chashe-prichastija/1_14">azbyka.ru</a>、ロシア語）。実体は原子や分子と同じではありません。しかし実体と原子の間にはつながりがあります。実体とは、原子や分子の存在も、その物に固有のすべてのものも決定する存在の基礎（ラテン語 <em>substantia</em> —— 直訳では「下に立つもの」）だからです。</p><h3>なぜ「神を食べる」のか</h3><p>イスラム教徒はこのように問いを立てます。一方プロテスタントの人々は、少し違った形でこの問いを正教会に向けますが、本質は同じです。</p><p>このような問いへの答えは長くなりえますが、ここでは全体的な考えだけを示します。聖体にあずかることは、人をキリストなる神との最も緊密な結びつき、霊的なだけでなく身体的な結びつきへと導き入れます。神は人を魂だけでなく体からも造られたからです。</p><p>実際、アダムとエバを除くすべての人は、この世に現れたその時から、ほかの人の体、すなわち母の体から養われてきました。もしそうしなかったら、命を持つことも、成長し発達することもできず、疑いなく滅びてしまったでしょう。胎芽が着床できないときには、実際にそうなります。</p><p>幼子が生まれるとき、その体は母の体から形づくられています。母の体は自分自身を与えて幼子に命を与え、こうして両者（母と幼子）は身体的な結びつきの中にありました。生まれた後も、幼子は長い間母の体から養われ続けます。幼子が飲む乳は、母の体の中で母の血から作られるからです。したがって、乳は、上に述べた意味で母の血なのです。</p><p>この二つの過程（出産と聖体機密）を定められたのは、どちらも神です。</p><p>神によって造られた人間の本性を、その誕生と養いの過程と共に知るとき、聖体機密の中に同様の過程を認めても驚く理由はありません。聖体機密においてわたしたちは、もはや母の体からではなく、キリストなる神の体から養われ、こうして神との霊的なだけでなく身体的な結びつき、すなわち霊においても体においてもキリストとの完全な結びつきに入るのです：</p><blockquote><p>「<strong>わたしたちは、<mark>キリストの体の一部</mark>なのです</strong>」（<a href="https://bibleox.com/ja/jp-ni/ef/5/#L30">エフェ. 5:30</a>）<em>（ビザンティン本文（多数派写本）では、この節に ἐκ τῆς σαρκὸς αὐτοῦ καὶ ἐκ τῶν ὀστέων αὐτοῦ —「<mark>その肉とその骨から</mark>（成るものです）」という言葉が続きます。）</em></p></blockquote>
