    body: |-
      <h2>二つの書簡について</h2><p>『第一の手紙』は西暦96〜97年に書かれたと位置づけられます。『第二の手紙』は2世紀の中ごろに帰せられます（これが聖クレメンスの手になるかどうかは議論があります）。両書簡はいずれも5世紀のアレクサンドリア写本（Codex Alexandrinus）に初めて見出されたのですが、不完全な状態にありました：『第一の手紙』は57章の結びと58〜63章を欠き、『第二の手紙』は12章のところで途切れています。</p><p>欠けていた部分は、その後、コンスタンティノポリスのエルサレム駐在所が所蔵していた小文字写本（Codex Hierosol. 54、1056年）において発見されました。本訳は、復元された部分を本文の該当する位置に組み入れています（57:7および58〜63章の注を参照してください）。</p><h2>0</h2><p>ローマに寄留する神の教会から、コリントに寄留する神の教会へ。わたしたちの主イエス・キリストによって、神の御心に基づいて召され、聖別された方々へ。全能の神がイエス・キリストを通して与えてくださる恵みと平和とが、あなたがたの上に豊かに増し加わりますように[1]。</p><h2>1</h2><p>1. 皆さん、わたしたちに突如として、しかも次々と降りかかった災難と逆境のゆえに、あなたがたのもとで問い合わされている事柄についての返事は、遅れを来したものと考えられます。問題となったのは、神の選ばれた方々には異質で、見知らぬものである——汚れていて不敬虔な騒乱でした。ごく少数の無謀で傲慢な人々が、その騒乱をこれほどの狂乱にまで激しく燃え立たせ、あなたがたの尊く、名高く、すべての人に愛されるべき名を、大きく冒瀆するに至ったのです。</p><p>2. なぜなら、あなたがたのもとに寄留した人があって、あなたがたの至善で堅固な信仰を認めなかった者がいるでしょうか。キリストにおける、賢明で温和な敬虔さに驚嘆しなかった者がいるでしょうか。あなたがたのもてなしの品性の際立った美しさを告げ知らせなかった者がいるでしょうか。あなたがたの完全で確かな知識を、幸いなことと称えなかった者がいるでしょうか。</p><p>3. あなたがたは何事においても人をえこひいきせず、神の律法に従って歩み、指導者たちに従い、あなたがたの間の司祭たちに、当然帰すべき尊栄をささげていました。また若者たちには、節制と厳粛さをもって考えるようにと教え、婦人たちには、傷のない、厳粛で、清らかな良心のうちにすべてのことを完成するようにと命じ、それぞれの夫をふさわしい愛をもって敬うようにと勧めました。さらに、従順の規範のうちに身を置き、家を厳粛に治め、何事においても慎み深くあるようにと教えたのです[2]。</p><h2>2</h2><p>1. あなたがたは皆、謙虚な心を保ち、何ひとつ誇ることがなく、むしろ人に従う立場であって、従わせる立場ではありませんでした。与えることを喜び、受け取ることを喜びとはしませんでした。キリストから日々与えられるものに満ち足り、この方の言葉に心を留め、そのみ言葉を腹のうちに深く蓄えていました。この方の受難は、いつもあなたがたの目の前にありました。</p><p>2. かくして、深く豊潤な平和がすべての人に与えられ、善を行うことへの飽くことなき渇望が生まれ、聖霊の満ちあふれる注ぎがすべての人の上にありました。</p><p>3. あなたがたは聖善な心を満たし、善い熱意と敬虔な信頼とをもって、全能の神に向かって手を伸ばし、時に無意識に罪を犯したことを思い、この方があわれんでくださるようにと願い求めました。</p><p>4. 昼も夜も、あなたがたにとって競技が行われていました。それは兄弟全体のためのもので、あわれみと良心のうちに、この方の選ばれた人々の数が救われるためのものでした。</p><p>5. あなたがたは真実で無垢であり、互いに恨みを抱くことはありませんでした。</p><p>6. すべての騒乱も、すべての分裂も、あなたがたには憎むべきものでした。隣人の過ちを悲しみ、その欠けたところを自分自身の欠けとして受け止めていました。</p><p>7. あなたがたはあらゆる善行を後悔することなく、「すべての善い業のためにいつでも用意ができて」いました[3]。</p><p>8. あなたがたは至善にして威厳ある生き方をもって身を飾り、すべてのことをこの方への畏れのうちに行いました。主の戒めと定めは、あなたがたの心に刻み込まれていました。</p><h2>3</h2><p>1. すべての栄光と拡大とがあなたがたに与えられ、書かれている言葉は成し遂げられました。「彼は食べ、飲み、肥え太って広がり、愛された者が蹴り上げた」[4]。</p><p>2. かくして、嫉みとねたみ、争いと騒乱、迫害と動乱、戦争と虜囚とが生じました。</p><p>3. こうして「名誉なき者たちが名誉ある者たちに向かって立ち上がり」ました。誉れなき者が誉れある者に、無知な者が賢い者に、若い者が長老たちに向かってです[5]。</p><p>4. それゆえ、正義と平和は遠くへ去って行きました。各人が神の畏れを捨て、その信仰において目がかすみ、この方の戒めの律に従って歩まず、キリストにふさわしく生きず、各人が悪しき心の欲のままに歩み、不義で不敬虔な嫉みを受け入れたからです——死はまさにそれによって世に入ったのです[6]。</p><h2>4</h2><p>1. なぜなら、こう書かれているからです。「日が経って、カインは地の実りのうちから神にいけにえをささげました。アベルもまた、自分の羊群の初子とその脂とをささげました。</p><p>2. 神はアベルとその賜物に顧みられましたが、カインとそのいけにえには顧みられませんでした。</p><p>3. カインは激しく悲しみ、その顔は伏せられました。</p><p>4. 神はカインに言われました。『なぜあなたは強く悲しむのか。なぜあなたの顔は伏せられたのか。お前が正しくささげるが、正しく分けることをしないなら、罪を犯したのではないか』[7]</p><p>5. 『静かにしていなさい。彼はお前に向かって転じ、お前は彼を治めるであろう』。</p><p>6. カインはその兄弟アベルに言いました。『野原へ行こう。』二人が野原にいると、カインはその兄弟アベルに立ち向かい、彼を殺しました。」</p><p>7. 見なさい、兄弟たち。嫉みとねたみが、兄弟殺しをなし遂げたのです。</p><p>8. 嫉みのゆえに、わたしたちの父ヤコブはその兄エサウの顔から逃れました。</p><p>9. 嫉みはヨセフを死に至るまで迫害させ、奴隷の身にまで落としました。</p><p>10. 嫉みはモーセを、エジプトの王ファラオの顔から逃れるように強いました——その同族の者がこう言うのを聞いたからです。「お前をわたしたちの指導者と裁き人に立てたのはだれか。昨日エジプト人を殺したように、わたしをも殺すつもりか。」</p><p>11. 嫉みのゆえに、アロンとミリアムは幕営の外に宿しました。</p><p>12. 嫉みはダタンとアビロンを、生きたまま陰府（ハデス）へと引き下ろしました——彼らが神の僕モーセに背いて騒乱を起こしたからです。</p><p>13. 嫉みのゆえに、ダビデは異邦人からねたみを受けるばかりでなく、イスラエルの王サウルからも迫害されました。</p><h2>5</h2><p>1. しかし、わたしたちが昔の模範たちから離れて、時の近くに立った競技者たちのもとへ行くようにしましょう。わたしたちの世代から、勇壮な模範たちを取り上げましょう。</p><p>2. 嫉みとねたみのゆえに、最大にして最も正義なる柱たちが迫害され、死に至るまで競技しました。</p><p>3. 善なる使徒たちを、わたしたちの目の前に置きましょう。</p><p>4. ペトロは、不義の嫉みのゆえに、一つの苦でも二つの苦でもなく、多くの苦難を耐え、このように証しを果たして、当然の栄光の場所へと旅立って行きました[8]。</p><p>5. パウロは嫉みと争いのゆえに、忍耐の賞を示しました。</p><p>6. 彼は七度鎖を担い、追放され、石で打たれ、東方にも西方にも宣明者となって、その信仰の勇壮な名声を得ました[9]。</p><p>7. 世界全体に正義を教え、西方の果てまで至り、指導者たちの前で証しを果たし、こうしてこの世から解き放たれて、聖なる場所へと旅立ちました。忍耐の最大の模範となったのです[10]。</p><h2>6</h2><p>1. 聖善に生きたこれらの男たちと共に、選ばれた人々の大いなる群れが集められました。彼らは嫉みのゆえに多くの凌辱と拷問を耐え、わたしたちの中で最も美しい模範となりました。</p><p>2. 嫉みのゆえに迫害された婦人たち——ダナイデスとディルケー——は、恐ろしく不敬虔な凌辱を耐え、信仰の堅固な競程に至りました。体こそ弱い女たちでありながら、勇壮な賞を得たのです[11]。</p><p>3. 嫉みは、それぞれの妻たちをその夫から疎遠にし、わたしたちの父アダムの口にあった言葉を変えてしまいました。「これは今、わたしの骨の骨、わたしの肉の肉。」</p><p>4. 嫉みと争いは、大いなる都々を覆し、大いなる国民たちを根こそぎにしました。</p><h2>7</h2><p>1. 親愛な皆さん、わたしたちはこれを書き送るに当たって、あなたがたを勧めるばかりでなく、自分たち自身をも思い起こしています。わたしたちは同じ競技場の区画にいて、同じ競技がわたしたちの上にも課されているのですから。</p><p>2. それゆえ、空虚でむなしい心配事を捨てて、わたしたちの聖伝の、栄光にして厳粛な規範のもとへ行きましょう。</p><p>3. そして見届けましょう。何が善く、何が喜ばしく、何がわたしたちを造られた方の御前に受け入れられるのかを。</p><p>4. キリストの血を凝視しましょう。それが父の御前にいかに尊いものであるかを知りましょう。わたしたちの救いのために流され、全世界に悔い改めの恵みをもたらしたのです。</p><p>5. 歴代々々を巡って、主がどの世代にも、御自分のもとへ立ち帰ろうと望む者たちに悔い改めの場所を設けてこられたかを見届けましょう。</p><p>6. ノアは悔い改めを宣べ、耳を傾けた者たちは救われました[12]。</p><p>7. ヨナはニネベの人々に滅亡を宣べました。彼らは自分の罪を悔いて神に願い求め、赦しを得ました。神にとってのよそ者でありながら、救いを受けたのです。</p><h2>8</h2><p>1. 神の恵みの奉仕者たちは、聖霊によって悔い改めについて語りました。</p><p>2. そして万物の主御自身も、誓いをもって悔い改めについて語られました。「わたしは生きている、と主は言われる。わたしが望むのは罪人の死ではなく、その悔い改めである」と、良い決意を付け加えて[13]。</p><p>3. さらにこう言われます。「悔い改めよ、イスラエルの家よ、お前たちの不義から。わたしの民の子らに言え。お前たちの罪が地から天に至るほどで、緋の色より赤く、粗布より黒くとも、お前たちが全き心をもってわたしに立ち帰り、『父よ』と言うなら、わたしはお前たちを聖なる民として耳を傾ける。」[14]</p><p>4. また別の箇所ではこう言われます。「洗い清めて清くなれ。わたしの目の前から、お前たちの魂の悪事を取り除け。悪業をやめ、善を行うことを学べ。裁きを求め、虐げられている者を救い出し、孤児のために裁きを下し、やもめの訴えを弁護せよ。来て、わたしたちは互いに問い正そう、と主は言われる。お前たちの罪が緋の色のようであっても、わたしは雪のように白くする。紅のようであっても、羊毛のように白くする。お前たちが進んでわたしに聞き従うなら、地の良い実りを食べるであろう。しかし進んで聞き従わないなら、剣がお前たちを食らうであろう。主の口がこれらのことを語ったのだから。」[15]</p><p>5. ですから、御自分の愛されるすべての者を悔い改めに与らせようと望んで、全能の御心をもってこの事を堅められました。</p><h2>9</h2><p>1. ですから、御自分の威厳にして栄光ある御心に聞き従い、あわれみと御善とを願い求める者となってひれ伏し、御慈しみのもとへ立ち帰りましょう。そして、むなしい労苦と争いと、死へと至らせる嫉みとを捨てましょう。</p><p>2. その威厳ある栄光に完全に奉仕した人たちを凝視しましょう。</p><p>3. エノクを見ましょう。従順のうちに正しい者と見出され、取り去られ、その死は見出されませんでした[16]。</p><p>4. ノアはその奉仕のうちに忠実と見出され、世界に再生を宣べました。主は彼によって、一致のうちに箱舟へ入った生き物たちを救われました。</p><h2>10</h2><p>1. アブラハムは「神の友」と呼ばれました。神の言葉に聞き従う者となった点で、忠実と見出されたのです[17]。</p><p>2. 彼は従順のゆえに、自分の土地から、自分の親族から、父の家から出て行きました。それは、小さな土地と、弱い親族と、小さな家を捨てて、神の約束を受け継ぐためでした。神は彼に言われます。</p><p>3. 「お前の土地から、お前の親族から、お前の父の家から出て、わたしがお前に示す土地へ行きなさい。わたしはお前を大いなる国民とし、お前を祝福し、お前の名を大いなるものとし、お前は祝福された者となるでしょう。お前を祝福する者をわたしは祝福し、お前を呪う者を呪います。地のすべての氏族がお前によって祝福されるでしょう。」[18]</p><p>4. またロトと分かれたとき、神は彼に言われました。「目を上げて、お前が今いる場所から、北と南と東と海へ見渡しなさい。お前が見るすべての土地を、お前とお前の子孫に、とこしえに与えるでしょう。</p><p>5. わたしはお前の子孫を地の砂のようにするでしょう。地の砂を数えられる者がいるなら、お前の子孫も数えられるでしょう。」[19]</p><p>6. また言われます。「神はアブラハムを外へ連れ出して、彼に言われた。天を仰ぎ、星を数えてみよ、数えられるならば。お前の子孫もそのようになるであろう。アブラムは神を信じ、それは彼の義と見なされた。」[20]</p><p>7. 信仰ともてなしのゆえに、年老いて息子が与えられました。そして従順のゆえに、その息子を、神が彼に示された山の一つに連れて行き、いけにえとしてささげました。</p><h2>11</h2><p>1. もてなしと敬虔のゆえに、ロトはソドムから救われました。その周辺の全地域が火と硫黄によって裁かれたのです。主は明らかにされました。御自分に望みをかける者たちを決して見捨てないこと、二心の者たちを刑罰と凌辱の中に置かれることを。</p><p>2. なぜなら、彼と共に外へ出た妻は、意見が異なり、一致していなかったので、この標しとして立てられました。彼女は塩の柱となり、今日に至っています。それはすべての人に知らせるためです。二心の者たち、神の力について疑う者たちは、すべての世代にとって裁きと戒めとなるのだと[21]。</p><h2>12</h2><p>1. 信仰ともてなしのゆえに、遊女ラハブは救われました。</p><p>2. ナウェの子ヨシュアがエリコへ斥候を送られたとき、その地の王は、彼らがその国を偵察しに来たことを知り、彼らを捕えに人を送りました。捕えたうえで死に至らせるためでした。</p><p>3. そこで、もてなし深いラハブは彼らを受け入れ、屋上に、亜麻の幹の下に隠しました。</p><p>4. 王の使者が来て、こう言いました。「わたしたちの国の斥候がお前のところに入った。彼らを出せ。王がそう命じている。」彼女は答えました。「あなたがたの探している人たちは確かにわたしのところに入りましたが、すぐに出て行き、今は道を進んでいます。」そして別の方向を指し示しました。</p><p>5. 彼女はあの男たちに言いました。「わたしは確かに知っています。主なる神がこの地をあなたがたの手にお渡しになることを。あなたがたへの恐れと戦慄が、この地に住む者たちの上に下ったのですから。ですから、あなたがたがこの地を取ることになったとき、どうかわたしとわたしの父の家をも救ってください。」</p><p>6. 彼らは彼女に言いました。「あなたがわたしたちに言ったとおりになるでしょう。わたしたちの到着を知ったなら、お前の屋根の下に自分の家のすべての人を集めなさい。そうすれば救われるでしょう。家の外に見出される者はすべて滅びるのですから。」</p><p>7. 彼らはさらに彼女に標しを与えました。自分の家の外に紅の縄を掛けるようにと。彼らは明らかに示していたのです。主の血によって、神を信頼し、神に望みをかけるすべての人のために贖いが起こるのだと[22]。</p><p>8. 見なさい、親愛な皆さん。この女のうちには信仰ばかりでなく、預言もありました[23]。</p><h2>13</h2><p>1. ですから、兄弟たち、謙虚になりましょう。あらゆる誇大と虚栄と無知と怒りを脱ぎ捨てて、書かれている事を行いましょう。聖霊が言われるからです。「賢い者はその賢さのうちに誇ってはならない。力ある者はその力のうちに誇ってはならない。富める者はその富のうちに誇ってはならない。誇る者は主のうちに誇れ。この方を求め、裁きと正義を行うことを」[24]。特に覚えているべきは、主イエスの言葉です。温和と忍耐を教えてお語りになった主はこう言われました。</p><p>2. 「あわれむ者はあわれまれるでしょう。赦す者は赦されるでしょう。あなたがたが何をするかによって、そのようにしてされるでしょう。与えるかのように、与えられるでしょう。裁くかのように、裁かれるでしょう。善意をもって接するかのように、善意をもって接されるでしょう。あなたがたが人を量る秤で量るなら、その秤で量られるでしょう。」[25]</p><p>3. この戒めとこれらの教えの上に自分たちを固めましょう。この方の聖なる言葉に聞き従い、謙虚に歩むために。聖なる言葉は言うからです。</p><p>4. 「わたしはだれに目を留めるのか。温和で、静かで、わたしの言葉に戦慄する者にほかならない」[26]。</p><h2>14</h2><p>1. ですから、兄弟たちよ、神に聞き従う方が義であり、聖なることです。誇大と騒乱を抱えた、汚れた嫉みの首謀者たちに従うことではありません。</p><p>2. なぜなら、わたしたちが無分別にも、争いと騒乱へと矢を放ち、わたしたちを善いものから引き剥がそうとする人々の欲に自らを託すなら、ただの損害ではなく、大きな危険に陥ることになるからです。</p><p>3. わたしたちを造られた方の慈しみと優しさに従って、互いに善意をもって接しましょう。</p><p>4. なぜなら書かれているからです。「温和な者たちが地の住人となり、無垢な者たちがその地に残される。不法を行う者たちはその地から根絶やしにされる」[27]。</p><p>5. また言われます。「わたしは不敬虔な者が高く上げられ、リバノンの杉のように持ち上がるのを見た。そして通り過ぎた。見よ、彼はいなかった。その場所を探したが、見つからなかった。無垢を守り、正直を心に留めよ。平和な人には良い終わりがある」[28]。</p><h2>15</h2><p>1. ですから、敬虔と共に平和を保つ人たちと結び付き、偽善をもって平和を望む人たちとは結び付かないようにしましょう。</p><p>2. 言われているからです。「この民は唇をもってわたしを敬うが、その心はわたしから遠く離れている」[29]。</p><p>3. また言われます。「彼らは口で祝福しながら、心で呪っていた」[30]。</p><p>4. また言われます。「彼らは口をもって彼を愛し、舌をもって彼に偽りを言った。彼らの心は彼と共に真っ直ぐではなく、その契約において彼に信頼して歩まなかった」[31]。</p><p>5. それゆえ、「正義ある者に対して不義を語る偽りの唇は沈黙せよ」[32]。また言われます。「主はすべての偽りの唇を根絶やしにされる。大きなことを語る舌を。彼らは言う。わたしたちは舌を大きくする。わたしたちの唇は自分たちのものだ。だれがわたしたちの主だというのか。</p><p>6. 弱者たちの嘆きと貧しい者たちの呻きから、今わたしは立ち上がる、と主は言われる。わたしはその人を救いの中に置く。</p><p>7. その人のうちで自由に語ろう」[33]。</p><h2>16</h2><p>1. なぜなら、キリストは謙虚な者の御方だからです。御自分の小さな群れの上に高ぶる者たちの御方ではありません。</p><p>2. 神の威厳の笏、主イエス・キリストは、誇大と高慢の誇示をもって来られたのではありません。そうされることがおできになったにもかかわらず、謙虚をもって来られました。聖霊がこの方について語ったとおりです。聖霊は言うからです。</p><p>3. 「主よ、だれがわたしたちの聞いたことを信じたのでしょうか。主の腕はだれに啓示されたのでしょうか。わたしたちはその御前に子供のように告げました。渇いた地における根のように。この方には姿も栄光もありません。わたしたちはこの方を見ましたが、姿も美もありませんでした。この方の姿は辱めを負い、人々の姿に比べて衰えていました。打たれ、苦しむ人の姿で、軟弱に耐えることを知っています。その顔はそむけられ、辱められ、数えられませんでした[34]。</p><p>4. この方はわたしたちの罪を担い、わたしたちのために苦しみます。わたしたちは、この方が苦労と打撃と患難の中にいると見なしていました。</p><p>5. しかし、この方自身はわたしたちの罪のゆえに傷つけられ、わたしたちの不義のゆえに弱らされました。わたしたちの平和の懲らしめがこの方の上にあり、この方の傷によってわたしたちは癒されました。</p><p>6. わたしたちは皆、羊のように迷い、人々はおのおの自分の道に迷いました。</p><p>7. 主はこの方をわたしたちの罪のために渡されました。この方は患難を受けて口を開きません。屠場へ引かれる羊のように、毛を刈る者の前で声のない羊のように、口を開きません。謙卑のうちに、この方の裁きは取り上げられました。</p><p>8. この方の世代をだれが語り得るでしょうか。この方の命は地から取り去られるのですから。</p><p>9. わたしの民の不義のところから、この方は死へと来ました。</p><p>10. わたしは悪者たちをその墓の代わりに、富める者たちをその死の代わりに与えるでしょう。この方は不法を行わず、その口には偽りが見出されなかったからです。そして主はこの方を打撃から清めることを望まれます。</p><p>11. あなたがたが罪のためにささげるなら、お前たちの魂は長い命の種を見るでしょう。</p><p>12. 主はこの方を魂の苦しみから取り除くことを望まれ、光を示し、悟りによって形造り、多くの者によく仕える正しい者を義とされるでしょう。彼らの罪をこの方が担うからです。</p><p>13. それゆえ、この方は多くの者を受け継ぎ、強き者たちと分けて戦利品を得るでしょう。この方の魂が死に渡されたこと、不法者たちの数に見なされたことに報いて、</p><p>14. この方は多くの者たちの罪を担い、彼らの罪のゆえに渡されたのです。」</p><p>15. この方自身もまた言われます。「わたしは虫であって人ではありません。人々の恥辱、民の見下すものです[35]。</p><p>16. わたしを見る者は皆、わたしを嘲笑いました。唇をもって語り、頭を振りました。この方は主に望みをかけているのだから、救い出してくれ。この方を喜ばれるなら、救ってくれ。」</p><p>17. 見なさい、親愛な兄弟たちよ。わたしたちに与えられた模範は何でしょうか。もし主がこのように謙虚なら、この方を通して、この方の恵みの軛の下に入ったわたしたちは、何をすべきでしょうか。</p><h2>17</h2><p>1. わたしたちはまた、山羊の皮と羊の皮を身にまといながら歩み、キリストの到来を宣べ伝えた人たちにも倣いましょう。わたしたちはエリヤとエリシャ、さらにエゼキエルを言います。預言者たち、また証しを受けた人たちもです。</p><p>2. アブラハムは大きく証しを受け、「神の友」と呼ばれました。彼は神の栄光を凝視しながら、謙虚に言いました。「わたしは地と灰です」[36]。</p><p>3. さらにヨブについてもこう書かれています。「ヨブは正しく、責めるべきところのない、真実な、神を畏れ、すべての悪を避ける人でした」[37]。</p><p>4. しかし、彼自身が自らを告発して言いました。「汚れから清い者はいません。その命が一日であっても」[38]。</p><p>5. モーセは「その全家のうちに忠実な」と呼ばれました。神はその奉仕を通して、エジプトを鞭と凌辱をもって裁かれました。しかし彼も、大きく栄光を与えられたのに、大きなことを語らず、茨の中で神からお告げを受けたときに言いました。「わたしは何者でしょうか、わたしを遣わすとは。わたしは声弱く、舌遅い者です」[39]。</p><p>6. また言われます。「わたしは釜のそばの蒸気にすぎません」[40]。</p><h2>18</h2><p>1. 証しを受けたダビデについて、わたしたちは何と言うべきでしょうか。神は彼について言われました。「わたしはわたしの心にかなう人を見出した。イエッサイの子ダビデを。とこしえの慈しみをもって彼に油を注いだ」[41]。</p><p>2. しかし、彼自身も神に向かって言いました。「神よ、あなたの大きい慈しみに基づいてわたしをあわれみ、あなたの豊かな慈しみに基づいてわたしの不義を消し去ってください[42]。</p><p>3. ますます、わたしを不義から洗い、わたしを罪から清めてください。わたしは自分の不義を知っていますから。わたしの罪は常にわたしの前にあります。</p><p>4. わたしはあなたにだけ罪を犯し、あなたの御前で悪を行いました。それは、あなたがお言葉において正しいとされ、裁かれるときに勝たれるためです。</p><p>5. 見よ、わたしは不義の中で捕えられ、罪の中で母はわたしを身ごもりました。</p><p>6. 見よ、あなたは真実を愛されます。あなたの知恵の、見えない隠れた事を、わたしに明らかにされました。</p><p>7. あなたはヒッソプをもってわたしに注ぎ、わたしは清くなるでしょう。あなたはわたしを洗い、雪よりも白くなるでしょう。</p><p>8. あなたはわたしに喜びと歓楽の声を聞かせてくださるでしょう。打ち折られた骨は喜び躍るでしょう。</p><p>9. あなたの顔を、わたしの罪から背けてください。わたしのすべての不義を消し去ってください。</p><p>10. 神よ、わたしのうちに清い心を造り、わたしの内側に真っ直ぐな霊を新たにしてください。</p><p>11. どうか、わたしを御顔の前から退けないでください。あなたの聖霊をわたしから取り上げないでください。</p><p>12. あなたの救いの喜びをわたしに返し、君王の霊をもってわたしを固めてください。</p><p>13. わたしは不法者たちにあなたの道を教えます。不敬虔な者たちはあなたに立ち帰るでしょう。</p><p>14. 神よ、わたしの救いの神よ、わたしを血から救ってください。</p><p>15. わたしの舌はあなたの正義を喜び歌うでしょう。主よ、わたしの口を開いてください。わたしの唇はあなたの賛美を告げ知らせるでしょう。</p><p>16. あなたがいけにえを望まれたなら、わたしはささげたでしょう。全焼のいけにえはあなたを喜ばせないでしょう。</p><p>17. 神へのいけにえは砕かれた霊です。砕かれ、打ちへりくだった心を、神は見下されないでしょう。」</p><h2>19</h2><p>1. このように多くの、しかもこのように証しを受けた人たちによって、謙虚と従順の徳は、わたしたちだけではなく、わたしたち以前の世代をも、より良いものにしました。この方の言葉を畏れと真実をもって受け入れられた人たちをです。</p><p>2. ですから、多くの、大きく、栄光ある事に与ったわたしたちは、初めからわたしたちに伝えられた平和の目標へと立ち返り、父であり、全世界の創造主である御方を凝視し、その威厳にして超越する平和の賜物の善き業と結び付きましょう。</p><p>3. 心でこの方を見、魂の眼をもって、この方の忍耐深い御心を凝視し、この方が御自分のすべての被造物に対していかに怒りを持たないかを悟りましょう。</p><h2>20</h2><p>1. 諸天は、この方の統治の下に動いて、平和のうちにこの方に服従しています。</p><p>2. 昼と夜は、この方が定められた軌道を走り終え、互いに何の障害ともなりません。</p><p>3. 太陽と月と星々の舞いの隊列は、この方の命じたとおりに一致のうちに、少しの逸脱もなく、自分たちに割り当てられた軌道を進んで行きます。</p><p>4. 実を孕む大地はこの方の御心に従って、それぞれの時節に、人々と獣たちと、その地上に生きるすべての生き物のために豊かな食物を生み出します。分裂することなく、この方が審定された何物をも変えることなく。</p><p>5. 深淵の測り知れない審定と陰府の語り得ない疆界も、同じ戒めのうちに保たれています。</p><p>6. 限りのない海の器は、この方の創造に従って諸々の集まりの中に集められ、その上に置かれた閂を越えることはありません。この方が命じたとおりに行うのです。</p><p>7. 神は言われたからです。「お前はここまで来るがよい。お前の波は自分のうちで打ち砕かれる」[43]。</p><p>8. 人に測り難い大洋と、その後に続く諸々の世界も、主の同じ秩序のもとに流れて行きます。</p><p>9. 春と夏と秋と冬の季節は、平和のうちに互いに引き継いで行きます。</p><p>10. 風の住処は、それぞれの時節に、少しのつまずきもなくその奉仕を成し遂げます。絶え間なく湧き出る泉は、楽しみと健康のために造られ、不足なく、命のための乳を人々に与えます。最も小さな生き物たちさえ、一致と平和のうちに群れの集まりをなします。</p><p>11. これらすべてのことを、万物の大いなる造り主であり主である御方は、平和と一致のうちに存在するように命じられました。すべてのものに恩恵を与え、とりわけ、わたしたちの主イエス・キリストによって御慈しみに身を寄せたわたしたちに、溢れるほどに与えられるのです。</p><p>12. この方に栄光と威厳がありますように、世々限りなく。アーメン。</p><h2>21</h2><p>1. 見なさい、親愛な皆さん。この方のこれほど多くの恩恵が、わたしたち全員の裁きとなってしまわないように。この方にふさわしく生きず、一致のうちに、御前で善い事を、この方の喜ばれる事を行わないならば。</p><p>2. 言われているからです。「主の霊は、腹の内室を探る灯です」[44]。</p><p>3. 見届けましょう。この方がどれほど近くにおられるかを。わたしたちの思いの、わたしたちの考えの一つとしても、この方に隠れているものは何もないことを。</p><p>4. ですから、この方の御心から脱走しないことが、義なのです。</p><p>5. 無知で悟りのない、高ぶり、おのが言葉の華やかさを誇る人たちに反対する方が、神に反対するよりましです。</p><p>6. 主イエス・キリスト——その血がわたしたちのために渡された御方——を畏れ敬いましょう。わたしたちの指導者たちを敬い、司祭たちを尊び、若者たちを神への畏れの教育で育てましょう。わたしたちの婦人たちを善へと整えましょう。</p><p>7. 彼女たちは、賛美に値する清さの品格を示し、その温和で無垢な願いを現し、沈黙によってその優しい舌を明らかにするように。そして、その愛がえり好みせず、神を畏れるすべての人に聖なる平等さをもって与えられるように。</p><p>8. わたしたちの子どもたちは、キリストにおける教育に与るように。そして知るように、神の前で謙虚にはどんな力があるかを。神の前で清い愛は何をなし得るかを。この方への畏れは、清い思いのうちに聖善に生きるすべての人を救う、いかに善く、いかに大きなものであるかを。</p><p>9. 神は思いと考えの探り手です。その息吹はわたしたちのうちにあり、この方がいつ望まれるか、そのときそれを取り上げられます。</p><h2>22</h2><p>1. これらすべてのことを、キリストにおける信仰が確証しています。この方が聖霊によって、わたしたちをこう呼びかけてくださるからです。「来て、子どもたちよ、わたしに聞け。わたしは主を畏れることを教える。</p><p>2. 生命を望む人、良い日々を見ることを愛する人は、だれか。</p><p>3. お前の舌を悪から遠ざけよ。お前の唇を偽りの言葉から遠ざけよ。</p><p>4. 悪を避けて善を行え。</p><p>5. 平和を尋ね求め、それを追い求めよ。</p><p>6. 主の目は正しい者たちに注がれ、主の耳は彼らの願いに傾けられる。主の顔は悪を行う者たちに向けられ、彼らの記念を地から断ち切られる。</p><p>7. 正しい者は叫んだ。主はその人の声に耳を傾け、その人のすべての患難から救い出された。」[45]</p><p>8. 「罪人には多くの鞭がある。しかし主に望みをかける人を、慈しみが取り囲む。」[46]</p><h2>23</h2><p>1. すべての事において慈しみ深く、善を行われる父は、この方を畏れる人たちのために深い思いを抱いておられます。単純な心をもって御もとへ進み出る人たちに、温かく、やさしく、その恵みを返されるのです。</p><p>2. ですから、二心になってはいけません。この方の、超越する栄光ある賜物の前に、魂に疑いを抱いてはいけません。</p><p>3. こう書かれている言葉が、わたしたちから遠ざかるように。「二心の者たちは惨めである。心に疑いを抱く者たちはこう言う。『これはわたしたちの父祖の時代にも聞いた。しかし見よ、わたしたちは年老いたが、この事は何一つわたしたちの上に起らなかった[47]。</p><p>4. 悟りのない者たちよ、自分を木に引き比べてみよ。ぶどうの木を取れ。まず葉を落とし、次に芽が出る。次に葉が出る。次に花が咲く。その後に実の青いのがつき、最後に熟したぶどうがなる。』」見なさい。ほんの短い時節のうちに、木の実は熟し果てます。</p><p>5. この方の御心も、まことに、速やかに、突然に成し遂げられるのです。聖書もこれを証ししています。「来たるべき方は速やかに来られる。遅れられることはない」と、「主は突如、その聖所に来られる。あなたがたが待望している聖なる方」[48]。</p><h2>24</h2><p>1. 親愛な皆さん、考えましょう。主はどのように絶え間なく、来るべき復活は必ず起こるのだとわたしたちに示しておられるかを。主は主イエス・キリストを死者の中から復活させて、この方を復活の初穂とされたのです[49]。</p><p>2. 親愛な皆さん、時節ごとに起こる復活を見届けましょう。</p><p>3. 昼と夜が、わたしたちに復活を示しています。夜は眠り、昼は起きます。昼が去り、夜がやって来ます。</p><p>4. 収穫を見届けましょう。種はどのように、いかなる仕方で生じるのか。</p><p>5. 蒔く人は出て行き、それぞれの種を地に蒔きました。種は乾いた裸の地に落ちて朽ちます。その後、この朽ちることの中から、主の摂理の威厳がそれを立ち上がらせ、一粒から多くへと増し加えて、実をもたらすのです[50]。</p><h2>25</h2><p>1. 東方の土地——すなわちアラビアのあたり——に起こる、あの不思議な標しを見届けましょう。</p><p>2. ある鳥がいます。フェニックスと呼ばれるものです。これはただ一つしかなく、五百年生きます。その終わりに近づいたとき、乳香、没薬、そのほかの香料で自分のために巣を築きます。時が満ちると、その中に入って死にます。</p><p>3. その肉が朽ちると、ある虫が生まれます。この虫は死んだ獣の湿りから養われて羽を得ます。その後、勇壮になったとき、先の鳥の骨の置かれたあの巣を持ち上げ、それを担いで、アラビアの国からエジプトの、ヘリオポリスと呼ばれる場所まで飛んで行きます。</p><p>4. そして、昼間、すべての人が見ている中で、太陽の祭壇の上に降りて骨を置き、そうして後へ帰って行きます。</p><p>5. そこで祭司たちは年代の記録を調べ、この鳥が来たときが、ちょうど五百年の満ちるときであったことを知ります[51]。</p><h2>26</h2><p>1. では、この方が一羽の鳥によってさえ、御自分の約束の偉大さをわたしたちに示しておられるのに、万物の造り主が、良い信仰の確信のうちに、聖善に御自分に仕えた人たちを復活させるなら、それを偉大で不思議な事と考えるのは当然ではないでしょうか。</p><p>2. 言われているからです。「わたしは立ち上がるであろう。わたしはあなたを賛美するでしょう」と、「わたしは横たわって眠った。わたしは目覚めた。あなたがわたしと共にいてくださるからです」[52]。</p><p>3. またヨブは言います。「あなたはわたしのこの肉を立ち上がらせるであろう。このすべての事を飲み干した肉を」[53]。</p><h2>27</h2><p>1. それゆえ、わたしたちの魂をこの希望に結び付けましょう。約束のうちに忠実であり、裁きのうちに正しい御方に。</p><p>2. 偽るなと戒められた御方が、はるかにまして、御自身は偽られないでしょう。神の御もとで不可能なものは何もありません。偽ることのほかは。</p><p>3. ですから、この方の忠実さがわたしたちの心に再び燃え上がらせるようにしましょう。そして、すべてのものがこの方の近くにあるのだと考えましょう。</p><p>4. この方は御自分の威厳ある言葉をもってすべてのものを堅く立てました。そして言葉をもって、それらを打ち倒すこともおできになります。</p><p>5. 「だれがこの方に言うことができましょうか、『あなたは何をなさったのですか』と。だれがこの方の力の権能に立ち向かえるでしょう。」この方がいつ望まれるか、どのように望まれるか、そのときそのようにすべての事を行われます。この方が審定された事で、成し遂げられないものは何もありません[54]。</p><p>6. すべてのものはこの方の御前にあります。この方の御心から隠れているものは何もありません。</p><p>7. 「諸天は神の栄光を語り、大空はその御手の業を告げます。昼は昼に言葉を吐き、夜は夜に知識を伝えます。語る言葉も発する声もないのに、その声は聞こえます」[55]。</p><h2>28</h2><p>1. ですから、すべてのものがこの方に見られ、聞かれているのですから、この方を畏れ、悪業の汚れた欲を捨てましょう。そうすれば、この方の慈しみをもって、来るべき裁きから覆い隠されるのです。</p><p>2. だれがこの方の強い御手から逃れることができましょうか。この方から離脱する者を、どの世界が受け入れるでしょうか。書かれたものはこう言います。</p><p>3. 「どこへ行けばあなたの顔から逃れ、どこに隠れられるでしょうか。天に登っても、あなたはそこにいます。地の果てへ行っても、そこにあなたの右の御手があります。深淵の中に臥しても、そこにあなたの霊があります」[56]。</p><p>4. それなら、だれがどこへ行き、どこへ逃れて、すべてのものをそのうちに抱える御方から離れることができましょうか。</p><h2>29</h2><p>1. ですから、魂の聖さのうちにこの方に近づき、清くて穢れのない手をこの方に向けて掲げましょう。わたしたちの父である、温かく慈しみ深い御方を愛し、わたしたちを御自分の選ばれた部分としてくださった御方を。</p><p>2. なぜならこう書かれているからです。「いと高き者が国々を分け、アダムの子らを散らされたとき、神の天使たちの数に従って国々の境を立てられた。主の部分は御自分の民ヤコブとなった。その嗣業の分はイスラエルである。」[57]</p><p>3. また別の箇所では言われます。「見よ、主は国々の中から御自分のために一つの民を取られる。人が自分の脱穀場の初穂を取るように。その民から、聖なるものの聖なるものが出て来る。」[58]</p><h2>30</h2><p>1. ですから、わたしたちは聖なる部分ですから、聖なるものに属するすべての事を行いましょう。中傷から逃れ、汚れて不敬な交わり、酔い、新奇を好む欲、卑しい情欲、憎むべき姦淫と憎むべき高慢から逃れましょう。</p><p>2. 「神は高慢な者たちに敵対し、謙虚な者たちに恵みを与えられる」と言われているからです[59]。</p><p>3. ですから、神から恵みを与えられた人たちと結び付きましょう。一致を着け、謙虚になり、節制し、あらゆる囁きと中傷から自分を遠ざけましょう。言葉ではなく、行いによって義とされるのですから。</p><p>4. 「多くのことを語る者も答えを聞くであろう。雄弁な者が自分を正しい者と考えるのであろうか[60]。</p><p>5. 女から生まれた者は、祝福されても命は短い。言葉のうちで多くになってはいけない。」</p><p>6. わたしたちの賛美は神のうちにありますように。自分たちのうちからでないように。神は自分で自分を賛美する者を憎まれるのですから。</p><p>7. わたしたちの善行の証しは、他の人によって与えられるように。わたしたちの正しい父祖たちにそうであったように。</p><p>8. 厚かましさと横柄さと大胆さは、神から呪われた者たちのものです。温かさと謙虚さと柔軟さは、神から祝福された者たちのものです。</p><h2>31</h2><p>1. ですから、この方の祝福と結び付き、祝福の道とはどのようなものかを見届けましょう。初めから起こった事を繰り返し読み返しましょう。</p><p>2. わたしたちの父祖アブラハムは、何のゆえに祝福されたのでしょうか。信仰のうちに正義と真実を行ったからではありませんか。</p><p>3. イサクは確信をもって、来るべき事を知りながら、喜んでいけにえへと進み出ました。</p><p>4. ヤコブは謙虚のうちに自分の土地を出て行きました。兄弟のゆえにラバンのもとへ行き、仕えました。そしてイスラエルの十二の笏が彼に与えられました。</p><h2>32</h2><p>1. これらの事を一人一人が真実に見極めるなら、この方から与えられた賜物の偉大さを知るでしょう。</p><p>2. この方から、神の祭壇に奉仕するすべての司祭たちとレビ人たちがいます。この方から、主イエスが肉に従って来ました。この方から、ユダに従って、王たち、首長たち、指導者たちがいます。この方のそのほかの笏も、小さからぬ栄光のうちにあります。神が「お前の子孫は天の星々のようになるであろう」と約束されたとおりです[61]。</p><p>3. それで、彼らは皆、栄光を受け、高く上げられました。自分たちによって、自分たちの行いによって、自分たちがなし遂げた正義の業によってではなく、この方の御心によってです。</p><p>4. わたしたちもまた、この方の御心によってキリスト・イエスのうちに召されましたが、自分たち自身によって義とされるのではありません。わたしたちの知恵によって、悟りによって、敬虔によって、聖なる心のうちでなし遂げた行いによってではなく、信仰によってです。全能なる神が、永遠の初めからすべての人を義としてこられたのは、この信仰によってなのです。この方に栄光がありますように、世々限りなく。アーメン。</p><h2>33</h2><p>1. では、兄弟たち、わたしたちは何をすべきでしょうか。善を行うことをやめ、愛を捨ててしまいましょうか。断じていけません。主がこのような事がわたしたちの上に起こることをお許しになるはずがありません。それどころか、切実な熱意をもって、あらゆる善い業を成し遂げましょう。</p><p>2. 造り主であり、万物の主である御方御自身が、御自分の業を喜んでおられるのですから。</p><p>3. この方は御自分のとてつもない力をもって諸天を堅く立て、測り知れない悟りをもってそれらを整えられました。地を、それを取り囲む水から分け、御自分の御心の確かな基礎の上に据えられました。そしてその地を歩き回る生き物たちに、御自分の秩序に従って存在するように命じられました。海と海の中の生き物たちを前もって造り、御自分の力をもってその中に閉じ込められました。</p><p>4. すべてのものの上に、最も卓越した、とてつもなく大きなもの。人です。この方は聖なる、穢れのない御手をもって、御自分の形像の相[χαρακτήρ]を人に形造られました。</p><p>5. 神はこう言われるからです。「わたしたちがかたちどり、わたしたちに似せて、人を造ろう。」神は人を造られました。男と女に造られました[62]。</p><p>6. これらすべてを成し終えて、この方はそれらを讃め、祝福して言われました。「生み育ち、増し加われ。」</p><p>7. 見届けましょう。すべての正しい者たちは善行によって飾られました。主御自身も善行によって御自分を飾って喜ばれました。</p><p>8. このような模範を持っていますから、怠けることなくこの方の御心へと進み出ましょう。全身の力を尽くして、正義の業を行いましょう。</p><h2>34</h2><p>1. 忠実な働き手は、自分の労働のパンを胸を張って受け取ります。怠け者で気力を失った者は、自分に仕事を割り当てた人をまともに見ることができません。</p><p>2. ですから、わたしたちは善を行うことへ熱心でなければなりません。すべてのものはこの方から来るのですから。</p><p>3. この方はわたしたちに前もって預言されました。「見よ、主は来られる。この方の報いは御前を進む。各人に、その人の業に応じて返される。」[63]</p><p>4. それで、この方を信じるわたしたちに、この方は勧められます。全き心をもってこの方を仰ぎ、あらゆる善い業において怠け者も気力を失った者もならないように。</p><p>5. わたしたちの誇りと大胆さは、この方のうちにありますように。この方の御心に服従しましょう。この方の天使たちの全体を考えましょう。彼らがどのように御前で立って、この方の御心に奉仕しているかを。</p><p>6. 聖書は言いますから。「万々が御前に立ち、千々の千が御もとに仕え、そして叫んだ。聖なる方、聖なる方、聖なる方、万軍の主。すべての被造物はその栄光に満ちている」[64]。</p><p>7. わたしたちもまた、一致のうちに、一つの良心をもって同じ所に集められ、あたかも一つの口から出るように、切実にこの方に向かって叫びましょう。そうすれば、この方の大きく栄光ある約束に与ることができます。</p><p>8. この方は言われるからです。「目は見たことがなく、耳は聞いたことがなく、人の心にも登ったことがない。この方が忍ぶ者たちのために備えておられたすべての事は。」[65]</p><h2>35</h2><p>1. 神の賜物は、なんと祝福され、なんと不思議なものでしょうか、親愛な皆さん。</p><p>2. 不朽のうちの命、正義のうちの輝き、自由のうちの真実、確信のうちの信仰、聖さのうちの節制。これらすべてがわたしたちの思いのもとに下って来たのです。</p><p>3. では、忍ぶ者たちのために備えられているものは、一体何でしょうか。造り主であり、諸世代の父である、その至聖なる御方御自身が、それらの数と美しさを知っておられます。</p><p>4. ですから、わたしたちは競技しましょう。忍ぶ者たちの数のうちに見出され、約束された賜物に与るために。</p><p>5. 親愛な皆さん、これはどのように成るのでしょうか。わたしたちの思いが忠実に神に向かって堅く立っているなら。この方の喜ばれ、受け入れられる事を求めるなら。この方の穢れのない御心に属する事を成し遂げ、真実の道に従うなら。あらゆる不義と悪、貪欲、分裂、悪意と策略、囁きと中傷、神を憎む事、高慢と誇大、空しい栄光ともてなしをしない心を、自分たちから投げ捨てるなら。</p><p>6. なぜなら、これらの事を行う者たちは、神にとって忌み嫌われるものだからです。「これらの事を行う者たちだけでなく、これらの事に同意する者たちも」。</p><p>7. 聖書は言うからです。「しかし、神は罪人に言われた。お前はなぜわたしの定めを語り、わたしの契約をお前の口に担っているのか[66]。</p><p>8. お前は懲らしめを憎み、わたしの言葉を後ろに投げ捨てた。盗人を見るなら、その者と共に走り、姦淫者たちのうちに自分の分を置いた。お前の口は悪事に満ち、お前の舌は策略を絡ませている。座って兄弟を中傷し、同じ母の子を告発してつまずきを置いた。</p><p>9. お前はこれらの事を行い、わたしは黙っていた。お前は不法な者よ、わたしがお前に似ていると思い込んだ。</p><p>10. わたしはお前を告発し、お前の目の前において示すであろう。</p><p>11. これらの事を悟れ、神を忘れる者たちよ。そうでないなら、この方が獅子のようにお前を捕らえ、救い出す者はいないであろう。</p><p>12. 賛美のいけにえはわたしを栄光に輝かせる。そこに道がある。わたしが神の救いをその人に示そう。」</p><h2>36</h2><p>1. これがその道です、親愛な皆さん。この道によって、わたしたちはわたしたちの救いを見出します。イエス・キリストです。わたしたちのすべての献げ物の大司祭、わたしたちの軟弱さの守り手であり助け手。</p><p>2. この方によって、わたしたちは諸天の高みを仰ぎ、この方によって、この方の穢れなく超越した情景を映して見ます。この方によって、わたしたちの心の眼が開かれました。この方によって、わたしたちの悟りなく闇に沈んだ思いが、光へと芽生えます。この方によって、万物の主は、わたしたちが不死の知識を味わうことを望まれました。この方は御方の威厳の輝きであり、天使たちよりはるかに大きい御方です。御方が受け継がれた名が、彼らの名よりはるかに違うものだからです[67]。</p><p>3. なぜなら、こう書かれているからです。「この方が天使たちを霊とし、御もとに仕える者たちを火の炎とされる」[68]。</p><p>4. 御方の息子について、主はこう言われます。「お前はわたしの息子だ。わたしは今日、お前を生んだ。わたしに求めよ。わたしは国々をお前の嗣業として、地の果てをお前の領土として与える。」[69]</p><p>5. またこの方に言われます。「わたしの右の座に就いておれ。わたしがお前の敵をお前の足台にするまで。」</p><p>6. では、この方の敵とはだれでしょうか。悪なる者たちです。この方の御心に反対する者たちです。</p><h2>37</h2><p>1. ですから、兄弟たちよ、この方の穢れのない戒めのうちに、あらゆる切実さをもって戦いましょう。</p><p>2. わたしたちの指導者たちのもとで戦う人たちを考えましょう。彼らがどれほど秩序正しく、どれほど従順に、どれほど服従して、命じられた事を成し遂げているかを。</p><p>3. 皆が総督なのではありません。皆が千夫長や百夫長や五十夫長でも、その次の階級でもありません。各人が自分の班のうちで、王と指導者たちによって命じられた事を成し遂げるのです。</p><p>4. 大きい者は小さい者なしには存在できず、小さい者は大きい者なしには存在できません。すべてのもののうちには何か融合があり、そのうちに大きな用い方があります。</p><p>5. わたしたちの体を見ましょう。頭は足なしには何ものではなく、足も頭なしにはそうです。わたしたちの体の最も小さな肢体さえ、体全体にとって必要で、役に立ちます。しかしすべてが共に呼吸し、一つの服従のもとに用いられて、体全体が救われるのです。</p><h2>38</h2><p>1. ですから、わたしたちの体全体がキリスト・イエスのうちに救われますように。そして各人が、その人がその賜物のうちに立てられたとおりに、隣人に服従しますように。</p><p>2. 強い者は弱い者を顧みましょう。弱い者は強い者を敬いましょう。富める者は貧しい者に与えましょう。貧しい者は神に感謝しましょう。一人の者を与えて、その人によって自分の欠けを補ってくださったのですから。賢い者は自分の賢さを言葉ではなく善行によって示しましょう。謙虚な者は自分で自分の証しをしてはいけません。他の人に証しをさせておきましょう。肉において清い者は誇ってはいけません。節制を与えてくださるのは別の御方だと知りながら。</p><p>3. ですから、兄弟たち、考えましょう。わたしたちはどのような素材から生まれたか。わたしたちは誰で、どのようにしてこの世界に入ったか。わたしたちを形造り、造られた御方は、わたしたちをどのような墓と闇から、御自分の世界へと導き入れられたか。わたしたちが生まれる前に、御自分の恩恵を前もって備えられたのです。</p><p>4. わたしたちはこれらすべてをこの方から受けていますから、すべての事においてこの方に感謝すべきです。この方に栄光がありますように、世々限りなく。アーメン。</p><h2>39</h2><p>1. 無知で悟りのない、愚かで教育を受けない者たちが、わたしたちを嘲笑い、見下しています。自分たちの思いにおいて自分を高く上げたいと望んで。</p><p>2. 死すべき者に何ができるでしょうか。土から生まれた者の力は何でしょうか。</p><p>3. なぜならこう書かれているからです。「わたしの御前には姿がなかった。ただ息と声を聞いていた。</p><p>4. なぜなのか。死すべき者は主の御前で清い者となり得るのか。この方の業のうちで責められるところのない人となり得るのか。この方の僕たちを信じないで、この方の天使たちについて歪んだ事を考えたなら。</p><p>5. しかし天も御方の御前では清くありません。ましてや、粘土の家に住む者たちはどうでしょうか。わたしたち自身も同じ粘土のうちからです。この方は彼らを蛾のように打ち、朝から夕まで、もはや彼らはいません。彼らは自分自身を助けることができないので、滅びました。</p><p>6. この方は彼らに息を吹きかけると、彼らは死にました。知恵を持たなかったからです。</p><p>7. 呼びかけよ、だれかがお前に耳を傾けるなら。あるいは見よ、天使たちの聖なる者のだれかを見るなら。怒りは無知な者を殺し、嫉みは迷う者を死なせます。</p><p>8. わたしは無知な者たちが根を張るのを見た。しかしすぐに、彼らの住処は食い荒らされました。</p><p>9. 彼らの子らは救いから遠ざかるように。彼らはより弱い者たちの門の前で折れるように。取り出す者はいないであろう。彼らのために備えられたものを、正しい者たちが食べるであろう。彼ら自身は悪の中から取り出される者とはならないでしょう。」[70]</p><h2>40</h2><p>1. これらの事がわたしたちには明らかですから、神聖な知識の深さへと身をかがめながら、主が定められた時節に成し遂げるようにと命じられたすべての事を、秩序に従って行うべきです。</p><p>2. 献げ物と奉仕は成し遂げられるようにと、この方は、意のままに、あるいは無秩序に起こるようには命じられませんでした。定められた時節と時刻のうちにです。</p><p>3. どこで、だれによって成し遂げられるべきかも、この方御自身が最高の御心をもって定められました。すべての事が聖善に起こって、喜びのうちで受け入れられるものとなり、この方の御心にかなうためです。</p><p>4. それで、定められた時節に自分の献げ物をする人たちは、受け入れられ、祝福されています。主の律に従うのですから、間違うことはありません。</p><p>5. 大司祭には、その人に与えられた固有の奉仕があります。司祭たちには固有の場所が割り当てられています。レビ人たちには固有の奉仕が課されています。在俗の人は、在俗の人の戒めに結ばれています。</p><h2>41</h2><p>1. 兄弟たち、わたしたち各人は自分の班のうちで、良い良心をもって、厳粛さのうちに神を喜ばせるようにしましょう。自分の奉仕に定められた規範から外れないように。</p><p>2. 兄弟たち、献げ物は、いつもの献げ物も、誓願のいけにえも、罪のためと過ちのためのいけにえも、どこででもささげられるのではありません。エルサレムでのみです。そこでも、どこででもささげられるのではなく、神殿の前の祭壇のところで、ささげられるものが大司祭と前述の奉仕者たちによって点検されてからです。</p><p>3. それで、この方の御心にふさわしいことの外で何かを行う人たちは、死という刑罰を負います。</p><p>4. 見なさい、兄弟たち。わたしたちは、より多くの知識に値するものとされたぶんだけ、より大きな危険に置かれているのです。</p><h2>42</h2><p>1. 使徒たちは、わたしたちの主イエス・キリストから福音を聞きました。イエス・キリストは神から遣わされました。</p><p>2. キリストは神から、使徒たちはキリストから。この二つのことは、神の御心に従って、秩序正しく成りました。</p><p>3. それで、使徒たちは命令を受け、わたしたちの主イエス・キリストの復活によって確信を得て、神の言葉のうちに信仰を与えられ、聖霊の確信をもって出て行き、神の国が来ようとしていることを宣べ伝えました。</p><p>4. そして、土地々々と都々で宣べ伝えながら、彼らは初めの信じる人たちを、霊によって試し、将来信じる人たちのために主教と輔祭に立てました。</p><p>5. これは新しい設置ではありません。ずっと以前から、主教たちと輔祭たちについて書かれていたのですから。聖書はこう言います。「わたしは彼らの主教たちを正義のうちに、彼らの輔祭たちを信仰のうちに立てるであろう。」[71]</p><h2>43</h2><p>1. キリストのうちに神からこの仕事を託された人たちが、前述の人たちを立てたとして、それが何ほど不思議でしょうか。祝福された「その全家のうちに忠実な僕」モーセも、自分に命じられたすべての事を聖なる書に記しました。その他の預言者たちもこの方に従い、この方が立てた律例を証しして固めました[72]。</p><p>2. 司祭職についての嫉みが生じ、諸々の部族が、どの部族がその栄光ある名で飾られるかについて騒乱を起こしたとき、この方は十二の部族の長たちに、各部族の名が書かれた笏を自分に提出するように命じました。それを受け取って束ね、部族の長たちの指輪で封印し、証しの幕屋の中の神の卓の上に置きました。</p><p>3. 幕屋を閉ざし、鍵も同じように笏も封印しました。</p><p>4. そして彼らに言いました。「兄弟たちよ、どの部族の笏が芽を出すなら、神はその部族を選び、その部族を司祭として御もとに仕えさせるのです。」</p><p>5. 朝になると、この方は全イスラエル——六十万の男たち——を召集し、部族の長たちに封印を見せ、証しの幕屋を開いて笏を取り出しました。そしてアロンの笏が、芽を出したばかりでなく、実をつけているのが見出されました。</p><p>6. どう考えますか、親愛な皆さん。モーセはこの事が起ころうとしていることを前もって知らなかったのでしょうか。知っていました。むしろ確かに知っていました。しかしイスラエルの中に騒乱が起こらないように、真実で唯一の御方の名が栄光を受けるように、こうされたのです。この方に栄光がありますように、世々限りなく。アーメン[73]。</p><h2>44</h2><p>1. わたしたちの使徒たちもまた、わたしたちの主イエス・キリストを通して知っていました。主教の名分について争いが起こるだろうと。</p><p>2. それでこの理由のゆえに、完全な先見を受け取って、前述の人たちを立て、その後に法を加えました。彼らが眠りに就いたなら、他の、試しに合った人たちが、彼らの奉仕を引き継ぐようにと。</p><p>3. それで、あの使徒たちによって、あるいはその後に、教会全体が同意して立派な人たちによって立てられ、キリストの羊群に謙虚さをもって、静かに、忠実に仕え、長い間、すべての人からの証しを受けてきた人たちを、奉仕から落とすのは不正だと、わたしたちは考えます。</p><p>4. なぜなら、穢れなく聖善に賜物をささげてきた人たちの主教職を落とすなら、わたしたちにとって小さからぬ罪になるからです。</p><p>5. 祝福されていますように、わたしたちの前に先立って旅立った司祭たち。彼らは実り豊かで完全な死を得ました。だれかが自分たちを立っている場所から動かすのを恐れていませんでした。</p><p>6. あなたがたが、良く生きる何人かの人たちを、穢れなく尊栄を与えられていた奉仕から引き移したのを、わたしたちは見ているのですから。</p><h2>45</h2><p>1. 兄弟たち、あなたがたは熱心であり、救いに属する事柄について熱望しています。</p><p>2. あなたがたは聖なる聖書の上に身をかがめてきました。真実な、聖霊によって書かれた書物です。</p><p>3. あなたがたは知っています。その中には不義な事も歪められた事も書かれていないと。そして見出すでしょう。正しい者たちが聖なる人たちから落とされたことはないと。</p><p>4. 正しい者たちは迫害されました。しかし不法な者たちによって。捕らえられました。しかし不敬な者たちによって。石で打たれました。律を犯す者たちによって。殺されました。汚れて不義な嫉みを受け入れた者たちによって。</p><p>5. 彼らはこれらの事を耐えながら、栄光のうちに耐え抜きました。</p><p>6. しかし兄弟たち、わたしたちは何と言うべきでしょうか。ダニエルは、神を畏れる人たちによって獅子の穴へ投げ込まれたのでしょうか。</p><p>7. あるいはハナニヤ、アザルヤ、ミシャエルは、いと高き方の威厳にして栄光ある礼拝を礼拝していた人たちによって火の炉へ入れられたのでしょうか。断じてそうであってはなりません。それでは、これらの事を行ったのは誰でしょうか。忌み嫌われ、すべての悪に満ちた人たちです。彼らの怒りはこれほどまでに狂い、聖善にして穢れのない心組みをもって神に仕えていた人たちを凌辱のうちに投げ込んだのです。知らずにいたのです。いと高き方は、清い良心をもって、その至善の名を礼拝する人たちの護り手であり衛護者であることを。この方に栄光がありますように、世々限りなく。アーメン。</p><p>8. しかし確信のうちに忍んだ人たちは、栄光と尊さを受け継ぎ、高く上げられ、神によってこの方の記念のうちに書き記されたものとなりました。世々限りなく。アーメン。</p><h2>46</h2><p>1. ですから、兄弟たち、わたしたちもまた、このような模範と結び付くべきです。</p><p>2. なぜなら書かれているからです。「聖なる者たちと結び付け。彼らと結び付く者は聖なるものとされるであろう」[74]。</p><p>3. また別の箇所で言われます。「無垢な人と共にあれば、お前は無垢であろう。選ばれた人と共にあれば、お前は選ばれた者であろう。歪んだ人と共にあれば、お前は歪むであろう。」[75]</p><p>4. ですから、無垢で正しい人たちと結び付きましょう。これらは神の選ばれた者たちです。</p><p>5. なぜあなたがたの間に、分裂と怒りと不和と派閥と戦争があるのでしょうか。</p><p>6. わたしたちには一人の神と一人のキリストと、わたしたちの上に注がれた一つの恵みの霊と、キリストのうちの一つの召しがないのでしょうか。</p><p>7. なぜわたしたちは、キリストの肢体を引き裂いて分け、自分自身の体に向かって騒乱を起こし、これほどの狂乱に至るのでしょうか。わたしたちは互いの肢体であることを忘れてしまうほどに。わたしたちの主イエスの言葉を覚えていましょう。</p><p>8. この方は言われるからです。「あの人には災いがある。生まれない方がその人にとって良かったことでしょう。わたしの選ばれた者たちの一人をつまずかせる者は。ひき臼を首に据え付けて海に沈められる方が、その人にとって良かったことでしょう。わたしの選ばれた者たちの一人を歪める者は。」</p><p>9. あなたがたの分裂は多くの人を迷わせ、多くの人を意気消沈させ、多くの人を疑わせ、わたしたち全員を悲しみに落としました。そしてあなたがたの騒乱は、いつまでも消え去りません。</p><h2>47</h2><p>1. 祝福された使徒パウロの手紙を取り上げましょう。</p><p>2. この方は福音の初めに、まずあなたがたに何を書き送りましたか。</p><p>3. この方は真実に、霊のうちで、あなたがたに手紙を送りました。この方自身について、ケファについて、アポロについてです。当時のあなたがたにも、えり好みが生じていたからです。</p><p>4. しかし、あのえり好みはあなたがたに小さい罪をもたらしました。えり好みの対象となったのは、証しを受けた使徒たちと、その人たちのうちで試しに合った一人の人でしたから。</p><p>5. 今や考えましょう。だれがあなたがたを迷わせ、あなたがたの名高い兄弟愛の尊厳を減らしたのかを。</p><p>6. 親愛な皆さん、こんなことを耳にするのは恥です。まことに恥であり、キリストのうちの歩みにふさわしくないことです。最も堅固で、最も古いコリントの教会が、一つや二つの人のために、司祭たちに向かって騒乱を起こすとは。</p><p>7. しかもこの噂は、わたしたちのもとだけでなく、わたしたちと異なる意見をもつ人たちのもとにまで届きました。あなたがたの無知のために主の名が冒瀆され、あなたがた自身にも危険が積み重ねられるに至ったのです。</p><h2>48</h2><p>1. ですから、この事を速やかに取り除き、主の前にひれ伏し、泣きながらこの方を願い求めましょう。この方が和らいで、わたしたちと和解し、わたしたちの兄弟愛の、厳粛で清らかな歩みへと回復させてくださるように。</p><p>2. なぜなら、これこそ命へと開かれた正義の門だからです。書かれているとおりです。「わたしのために正義の門を開いてください。わたしはその中に入って主に感謝するでしょう。</p><p>3. これが主の門です。正しい人たちはその中に入るでしょう。」[76]</p><p>4. 多くの門が開かれている中で、この正義の門こそ、キリストのうちの門です。この門に入り、聖さと正義のうちに自分の歩みをまっすぐに整え、少しの乱れもなくすべての事を成し遂げる人たちは、幸いです。</p><p>5. その人は忠実であるように。知識を語り得る力のある人であるように。言葉を判別する点で賢い人であるように。行いの点で清い人であるように。</p><p>6. なぜなら、自分がますます大きいと考えるぶんだけ、ますます謙虚であるべきだからです。そして自分のことではなく、すべての人に共通に益となることを求めましょう。</p><h2>49</h2><p>1. キリストのうちに愛を持っている人は、キリストの戒めを行いましょう。</p><p>2. 神の愛の結びを、だれが語り表すことができるでしょうか。</p><p>3. その美しさの偉大さを、だれが十分に語り得るでしょうか。</p><p>4. 愛が人を引き上げる高みは、語り尽くすことができません。</p><p>5. 愛はわたしたちを神と結び付けます。「愛は多くの罪を覆います」。愛はすべての事を忍び、すべての事に耐えます。愛のうちに卑しいものは何もなく、高慢なものは何もありません。愛は分裂を持ちません。愛は騒乱を起こしません。愛はすべての事を一致のうちに行います。神の選ばれた人たちは皆、愛のうちに完全とされました。愛なしには、神の御前に喜ばれるものは何もありません[77]。</p><p>6. 主は愛のうちにわたしたちを受け入れてくださいました。わたしたちへの愛のゆえに、わたしたちの主イエス・キリストは、神の御心のうちに、御自分の血をわたしたちのために注ぎ、御自分の肉をわたしたちの肉のために、御自分の魂をわたしたちの魂のために与えられました。</p><h2>50</h2><p>1. 見なさい、親愛な皆さん。愛はなんと大きく、なんと不思議なものでしょうか。その完全さには語り得る説明がありません。</p><p>2. この愛のうちに見出されるに値する人は、神がその人を値する者とされるほか、だれでしょうか。ですから、この方の慈しみを願い求め、懇願しましょう。人間のえり好みなしに、責められるところなく、愛のうちに見出されるようにと。</p><p>3. アダムから今日に至るすべての世代は過ぎ去りました。しかし、愛のうちに完全とされた人たちには、神の恵みに従って、敬虔な人たちの席があります。キリストの国が現れるときに、彼らは明らかにされるでしょう。</p><p>4. なぜなら書かれているからです。「内室に入りなさい。わずかしばらくの間。わたしの怒りと憤りが過ぎ去るまで。そしてわたしは良い日を覚え、あなたがたをその墓から立ち上がらせるであろう」[78]。</p><p>5. 親愛な皆さん、わたしたちは祝福されています。一致と愛のうちに神の戒めを行い、愛のゆえにわたしたちの罪が赦されるなら。</p><p>6. なぜなら書かれているからです。「不義が赦され、罪が覆われた人たちは、幸いです。主が罪を数えない人、その口に偽りのない人も、幸いです。」[79]</p><p>7. この祝福は、神によって、わたしたちの主イエス・キリストを通して選ばれた人たちの上に成りました。この方に栄光がありますように、世々限りなく。アーメン。</p><h2>51</h2><p>1. ですから、わたしたちが敵対者の何かの罠によって過ちを犯し、悪を行ってしまったなら、赦されるように願いましょう。そして騒乱と分裂の首謀者となった人たちも、共通の希望を心に留めるべきです。</p><p>2. なぜなら、畏れと愛をもって生きる人たちは、隣人が不幸に陥るよりも、自分が不幸に陥ることを望みます。わたしたちに伝えられた善く正しい一致に判罰が下るよりも、自分自身への判罰を選ぶのです。</p><p>3. 人にとっては、自分の過ちを告白することの方が、自分の心を硬くすることより善いのです。神の僕モーセに叛いた人たちの心が硬くなったように。彼らの裁きは明らかになりました。</p><p>4. 彼らは「生きたまま陰府に下り」、「死が彼らを飼う」となったのです[80]。</p><p>5. ファラオとその軍隊、エジプトのすべての指導者たち、その戦車と戦車に乗る者たちが、ほかの理由でもなく紅海に沈んで滅びたのは、神の僕モーセがエジプトで標しと不思議な業を行った後も、彼らの、悟らない心が硬かったからです。</p><h2>52</h2><p>1. 兄弟たち、主は万物を必要とされません。この方が何ものも求められないのは、この方への信仰告白のほかにはありません。</p><p>2. 選ばれたダビデが言うからです。「わたしは主に感謝をささげる。それはこの方を喜ばせることになるでしょう。角のある若い子牛や蹄のある牛をささげるよりも。弱い人たちが見て、喜び躍るように。」[81]</p><p>3. また言います。「神に賛美のいけにえをささげ、いと高き方にあなたの願いを返せ。患難の日にわたしを呼べ。わたしはその人を救い出す。その人はわたしを栄光に輝かせるでしょう。」[82]</p><p>4. 「神へのいけにえは砕かれた霊です。」</p><h2>53</h2><p>1. 親愛な皆さん、あなたがたは聖なる聖書を知っており、しかもよく知って、神の言葉の上に身をかがめています。ですから、わたしたちはこれを思い起こすために書きます。</p><p>2. モーセが山に登り、断食と謙虚のうちに四十日四十夜を過ごしたとき、神はこの方に言われました。「直ちにここから下りなさい。あなたがエジプトの国から導き出したあなたの民が不法を行ったからです。彼らはわたしが彼らに命じた道から速やかに外れ、自分のために鋳像を造りました。」</p><p>3. 主はさらにこの方に言われました。「わたしはお前に一度語り、二度語った。わたしはこの民を見た。見よ、彼らは硬い首の者たちだ。わたしを放っておけ。わたしは彼らを根絶やしにし、彼らの名を天の下から消し去るであろう。そしてわたしはあなたを、この民よりはるかに大きく、不思議な国民とする。」[83]</p><p>4. モーセは言いました。「主よ、断じてそうしないでください。この民の罪を赦してください。そうでなければ、わたしをも命の書から消し去ってください。」</p><p>5. おお、大きい愛よ。おお、超えることのできない完全さよ。一人の僕が主に向かって自由に語り、民全体の赦しを求めます。そうでなければ、自分自身も彼らと共に消し去られることを値する者とするのです。</p><h2>54</h2><p>1. では、あなたがたの間でだれが勇気ある人でしょうか。だれが慈しみ深い人でしょうか。だれが愛の確信を満たされた人でしょうか。</p><p>2. その人は言いなさい。「わたしのせいで騒乱と争いと分裂が起こるなら、わたしは退きます。あなたがたの望む場所へ去ります。民の命じる事を何でも行います。ただ、キリストの羊群が、立っている司祭たちと共に平和であるように。」</p><p>3. この事を行った人は、キリストのうちで自分のために大きい名声を得るでしょう。あらゆる場所がその人を受け入れるでしょう。「主のものは地であり、その満ちるところすべて」だからです[84]。</p><p>4. 神の悔いることのない生き方を生きる人たちは、この事を行いました。そして行うでしょう。</p><h2>55</h2><p>1. さらに異邦人の模範をも挙げましょう。疫病のような時節が現れたとき、多くの王たちと指導者たちが神託によって導かれ、自分自身を死に渡しました。自分の血によって市民たちを救うためでした。多くの人が自分の都を出て行き、騒乱がこれ以上起きないようにしました。</p><p>2. わたしたちは知っています。わたしたちの中には多くの人たちがいて、他の人たちを贖うために自分を縛りに渡しました。多くの人たちは自分を奴隷の身に渡し、受け取った代金で他の人たちを養いました。</p><p>3. 多くの婦人たちが神の恵みによって力を与えられ、多くの勇壮な事を成し遂げました。</p><p>4. 祝福されたユディトは、都が包囲されていたとき、司祭たちに願い、異邦人の陣営へ出て行くことを許されました[85]。</p><p>5. そこで彼女は自分を危険に渡して出て行きました。包囲の中にいる祖国と民への愛のために。そして主はホロフェルネスを一人の女の手に渡されました。</p><p>6. これに劣らず、信仰において完全なエステルも、自分を危険に投げ入れました。イスラエルの十二部族が滅びようとしているのを救うためでした。彼女は断食と謙虚によって、すべてを見通す主、諸々の世代の神に願い求めました。主は彼女の魂の謙虚を見て、彼女がそのために危険を冒した民を救われたのです。</p><h2>56</h2><p>1. わたしたちもまた、何かの過ちのうちにある人たちのために取り次ぎましょう。温かさと謙虚さが彼らに与えられ、わたしたちではなく神の御心に従うようになるために。そうすれば、神と聖なる人たちへの、慈しみと共にある記念は、その人たちのために実り豊かで完全なものとなるでしょう。</p><p>2. 親愛な皆さん、懲らしめを受け取りましょう。これについて憤慨すべき人は誰もいません。わたしたちが互いに行う勧告は、善く、この上なく有益です。わたしたちを神の御心と結び付けるのですから。</p><p>3. 聖なる言葉はこう言われます。「主はわたしを懲らしめて、わたしを教えましたが、死に渡されませんでした。」</p><p>4. 「主が愛される者は懲らしめられる。この方が受け入れる息子はすべて鞭で打たれる。」</p><p>5. 「正しい人がわたしを憐れみをもって懲らしめ、告発するであろう、と言われます。罪人たちの油をもって、わたしの頭を潤すな。」[86]</p><p>6. また言われます。「主に告発された人は幸いです。全能の御方の懲らしめを退けてはならない。この方が苦しめるのも、この方自身が立ち直らせるのも、この方だからです。</p><p>7. この方が打つと、この方の御手が癒します。</p><p>8. 六度の患難のうちにこの方はあなたを救い、七度目には悪はあなたに触れないでしょう。</p><p>9. 飢饉のときには死からあなたを救い、戦いのときには鉄の御手から助け出すでしょう。</p><p>10. この方はあなたを、舌の鞭から隠してくださるでしょう。あなたはやって来る悪事を恐れないでしょう。</p><p>11. 不義と不法を行う者たちを笑って見るでしょう。野の獣たちから恐れることもないでしょう。</p><p>12. 野の獣たちはあなたと平和を結ぶでしょう。</p><p>13. その後、あなたは知るでしょう。あなたの家は平和であること。あなたの幕屋の住まいは過ちを犯さないことを。</p><p>14. あなたはまた知るでしょう。あなたの子孫は多いこと。あなたの子どもたちは野の百草のようであることを。</p><p>15. あなたは時節に刈り入れられる熟した麦のように、あるいは脱穀場の時刻に集められた束のように、墓の中へと入って行くでしょう。」[87]</p><p>16. 見なさい、親愛な皆さん。主に懲らしめられる人たちにはどれほど大きな護りがあるでしょうか。この方は善い父として、わたしたちが憐れまれるように、御自分の聖なる懲らしめをもってわたしたちを懲らしめてくださるのです。</p><h2>57</h2><p>1. ですから、騒乱の発端を起こしたあなたがたは、司祭たちに服従し、悔い改めの教育を受けましょう。自分の心の膝を屈めるのです。</p><p>2. 服従することを学び、あなたがたの舌の、誇り高い、横柄な傲慢を脱ぎ捨てましょう。キリストの羊群のうちに小さく、立派なものと見出される方が、高い者と自任してこの方の希望から投げ出されるよりも、ましですから。</p><p>3. 至善の知恵はこう言われます。「見よ、わたしはお前たちにわたしの息の言葉を語り出そう。わたしはお前たちにわたしの言葉を教えるであろう[88]。</p><p>4. わたしが呼んでもお前たちは耳を傾けず、わたしが言葉を伸ばしても心を留めず、わたしの意図を聞く耳を持たないものにし、わたしの告発に従わなかった。それゆえ、わたしもお前たちの滅びにおいて笑うでしょう。災厄がお前たちのところに来るとき、驚愕が突然、嵐のようにお前たちのところにやって来るとき、破滅が大嵐のように迫るとき、あるいは患難と包囲がお前たちのところに来るとき、わたしは喜び躍るでしょう。</p><p>5. お前たちがわたしを呼ぶとき、わたしはお前たちに耳を傾けないでしょう。悪い者たちがわたしを探しても、見つからないでしょう。彼らは知恵を憎み、主を畏れることを選ばず、わたしの意図に心を留めることを望まず、わたしの告発を嘲笑ったのですから。</p><p>6. それゆえ、お前たちは自分自身の道の実を食べ、自分自身の不敬虔の悪果に飽き足りるでしょう。</p><p>7. 「お前たちが幼い者に不当な事をするから、殺されるであろう。不敬虔な者は調べによって滅びるであろう。わたしに聞く人は、確信をもって希望の上に陣を張り、あらゆる悪から恐れなく安らかになるであろう。」[89]</p><h2>58</h2><p>1. ですから、この方の至聖で栄光ある名に耳を傾け、前述の、知恵が不服従の者たちに向けて先に語った脅威を避けましょう。「確信をもって陣を張る」ように、この方の至聖なる威厳の名の上に。</p><p>2. わたしたちの忠告を受け入れなさい。そうすれば後悔することはないでしょう。神は生きておられ、主イエス・キリストは生きておられ、聖霊も生きており、選ばれた人たちの信仰と希望も生きています。謙虚さと、切実な温かさをもって、神から与えられた定めと戒めを、後悔なく行う人は、この人こそ編み込まれ、数えられるでしょう。イエス・キリストを通して救われる人々の数の中に。この方を通して、この方に栄光がありますように、世々限りなく。アーメン。</p><h2>59</h2><p>1. この方がわたしたちを通して語られた言葉に従わない人がいるなら、その人たちは知るように。自分たちを小さからぬつまずきと危険の中に縛りつけるのだと。</p><p>2. しかしわたしたちはこの罪のないものでありましょう。そして切実な祈りと願いをささげましょう。万物の造り主が、その愛される僕イエス・キリスト、わたしたちの主を通して、全世界において、この方の数えられた選ばれた人々の数を、破れなく保たれますように。この方を通してこの方は、わたしたちを闇から光へ、無知から御名の栄光の認識へと召されたのです。</p><p>3. その御方の、すべての被造物に先立つ御名に望みをかけるように。わたしたちの心の眼を開いて、わたしたちがあなたを知るように。高きところにおける唯一のいと高き方、聖なる者たちの中に休まれる聖なる方。高慢な者たちの傲慢を抑え、国々の意図を打ち砕かれる方。謙虚な人を高く上げ、高い者を低くされる方。富ませ、貧しくされる方。人を殺し、生かされる方。霊たちの唯一の恩恵主、あらゆる血肉の神。深淵を仰ぎ見る方、人の業を観察される方。危険の中にある人たちの助け手、希望を失った人たちの救い手。すべての霊の造り主であり主教。国々を地の上に増し加え、その中から、あなたを愛する人たちを、愛される僕イエス・キリストを通して選ばれた方。この方を通して、あなたはわたしたちを教育し、聖なるものとし、尊ぶものとされました。</p><p>4. 主よ、わたしたちはあなたを願い求めます。わたしたちの助け手であり、救い手となってください。患難の中にあるわたしたちを救ってください。倒れた者たちを起こしてください。必要としている人たちの前に現れてください。弱っている人たちを癒してください。あなたの民の迷う人たちを回帰させてください。飢えている人たちを養い、わたしたちの囚われている人たちを贖い、病んでいる人たちを立ち上がらせ、意気消沈している人たちを慰めてください。すべての国々があなたを知りますように。あなただけが神であり、イエス・キリストはあなたの僕であること、そして「わたしたちは御民、御牧場の羊」であることを[90]。</p><h2>60</h2><p>1. あなたはこの世界の永遠の創造を、行われる業をもって現してこられました。主よ、あなたは世界を造られました。すべての世代のうちで忠実な方、裁きのうちで正しい方、力と威厳のうちで不思議な方、造ることのうちで賢い方、造られた事を据えることのうちで悟りある方。見えるもののうちで善い方、あなたに確信を寄せる人たちに対して温かい方。憐れみ深く慈悲深い御方よ、わたしたちの不義と、不義の行いと、過ちと過失を赦してください。</p><p>2. あなたの僕と女僕のすべての罪を数えてお咎めにならないでください。そしてわたしたちを、御真実の清めをもって清め、わたしたちの歩みをまっすぐに整えてください。聖なる心のうちに歩み、あなたの御前で、またわたしたちの指導者たちの御前で、善く喜ばれる事を行うように。</p><p>3. 主よ、そうしてください。あなたの御顔を平和のうちにわたしたちの上に照らして、わたしたちに善として現してください。あなたの強い御手をもってわたしたちが覆い隠され、あなたの高い御腕によってあらゆる罪から救われるように。そして、不当にわたしたちを憎む者たちから、わたしたちを救い出してください。</p><p>4. 一致と平和をわたしたちに、また地に住むすべての人に与えてください。あなたの先祖たちに与えられたように。彼らは信仰と真実のうちに、聖善にあなたを呼び求めたのです。わたしたちが、全能にして至善の御名に服従し、また地の上のわたしたちの指導者たちに服従しますように。</p><h2>61</h2><p>1. 主よ、あなたはこの方の威厳にして語り尽くせない権能によって、彼らに治める権威を与えてくださいました。それは、わたしたちがあなたから彼らに与えられた栄光と尊さを知って、あなたの御心に何ひとつ反することなく、彼らに服従するためでした。主よ、彼らに健康と平和と一致と堅固さをお与えください。彼らがあなたが彼らに与えられた治める権威を、少しのつまずきもなく治め続けるように。</p><p>2. 主よ、天の主、諸々の世代の王よ、あなたは人の子らに栄光と尊さと、地の上にあるものの権威を与えてこられました。主よ、彼らの意図を、あなたの御前で善く喜ばれる事へとまっすぐに整えてください。彼らが平和と温かさのうちに、敬虔をもってあなたが与えられた権威を治め続け、あなたの和らぎを得ますように。</p><p>3. 栄光がありますように、あなたに。これらの事を、そしてこれらの事を超える善い事を、わたしたちと共になし得る唯一の御方に。わたしたちの魂の大司祭であり守り手であるイエス・キリストを通して。この方を通して、あなたに栄光と威厳がありますように。今も、そして世代から世代へ、世々限りなく。アーメン。</p><h2>62</h2><p>1. 兄弟たち、わたしたちの礼拝に属する事柄について、また、聖善に、正しく生きようと望む人たちにとって善い生き方に最も有益な事柄について、わたしたちは十分にあなたがたに書き送りました。</p><p>2. なぜなら、信仰と悔い改めと真実の愛と節制と悟りと忍耐について、わたしたちはあらゆる箇所に触れ、あなたがたに思い起こさせました。正義と真実と忍耐をもって、全能の神を聖善に喜ばせるべきこと。恨みを抱かず、愛と平和のうちに、切実な温かさをもって一致すること。わたしたちの前述の父祖たちが、父であり神であり造り主である御方と、すべての人に関わる事について、謙虚のうちに喜ばれたように。</p><p>3. わたしたちがこれらの事を思い起こさせることを、そのように喜んで行うのは、自分たちが忠実で、この上なく立派な、神の教育の言葉の上に身をかがめている人たちに書いていることを、はっきりと知っているからです。</p><h2>63</h2><p>1. ですから、このような、これほど多くの模範たちに近づき、首を屈めて服従の位置を満たすことが、ふさわしいことです。そうしてわたしたちが、むなしい騒乱から静まり、真実のうちにわたしたちの前に据えられた目標へ、少しの過ちもなく到達するために。</p><p>2. あなたがたが、聖霊によってわたしたちが書き送った言葉に聞き従うなら、この手紙に書かれている平和と一致のための願いのうちに、あなたがたの、ふさわしくない嫉みの怒りを切り捨てるなら、わたしたちに喜びと歓喜をもたらすことになるでしょう。</p><p>3. わたしたちはまた、忠実で慎み深い人たちを遣わしました。彼らは若い日から白髪に至るまで、わたしたちの中で責められるところなく生きて来た人たちです。彼らはあなたがたとわたしたちの間の証人となるでしょう。</p><p>4. わたしたちがこの事をしたのは、あなたがたが知るためです。わたしたちのあらゆる配慮は、あなたがたが早く平和になるために成されました。そして今もなお、そうなのです。</p><h2>64</h2><p>1. 最後に、すべてを見通す神、霊たちの主、あらゆる肉の主、主イエス・キリストを選び、この方によってわたしたちを選んで、御自分のものとなった民としてくださった御方が、その威厳にして聖なる御名に召されたすべての魂に、信仰と畏れと平和と忍耐と長く忍ぶ心と節制と清さと慎みを授けてくださいますように。御名を喜ばせるために、わたしたちの大司祭であり守り手であるイエス・キリストを通して。この方を通して、この方に栄光と威厳と権能と尊さがありますように。今も、そしてすべての世々限りなく。アーメン。</p><h2>65</h2><p>1. わたしたちが遣わしたクロディウス・エフェボスとウァレリオス・ビトノス、そしてフォルトナトを、平和のうちに、喜びをもって、早くわたしたちのもとへ帰してください。そうすれば彼らが早く、わたしたちが願い求め、切に望む平和と一致を報せるでしょう。そしてわたしたちももっと早く、あなたがたの堅固さを喜ぶことができます。</p><p>2. わたしたちの主イエス・キリストの恵みが、あなたがたと共にありますように。そして神によってこの方を通して、あらゆる場所から召されたすべての人と共にありますように。この方を通して、この方に栄光と尊さと権能と威厳と、永遠の御座がありますように。永遠の初めから、世々限りなく。アーメン。</p>
    references: |-
      <ol><li><p>「寄留する」（παροικοῦσα）：原語は「客旅・寄留者」を指します。古代のキリスト者は、自分たちがこの世における寄留者であるという意識をこの語で表しました。本サイトの<a href="https://bibleox.com/ja/ja/w/Pk1F_フィリピの教会への手紙#HH-1">『フィリピの教会への手紙』</a>第1章も、同じ表現で教会を呼んでいます。</p></li><li><p>「司祭たち」（πρεσβυτέρους）：コリントの騒乱は教会の職分に関わるものです。ここでは教会に按手された長老（司祭）を指し、単に年長者を指すのではありません。</p></li><li><p>「すべての善い業のためにいつでも用意ができて」：<a href="https://bibleox.com/ja/jp-ni/tit/3/#L1">テト. 3:1</a>、<a href="https://bibleox.com/ja/jp-ni/2tim/2/#L21">２テモ. 2:21</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/vtor/32/#L15">申. 32:15</a> からの引用です（七十人訳の措辞）。新共同訳では「エシュルンはしかし、肥えると足でけった。お前は肥え太ると、かたくなになり造り主なる神を捨て、救いの岩を侮った。」</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/is/3/#L5">イザ. 3:5</a>（七十人訳）参照。新共同訳：「民は隣人どうしで虐げ合う。若者は長老に、卑しい者は尊い者に無礼を働く。」</p></li><li><p>「死はまさにそれによって世に入った」：<a href="https://bibleox.com/ja/jp-ni/prs/2/#L24">知. 2:24</a> の引用です。新共同訳では「悪魔のねたみによって死がこの世に入り、悪魔の仲間に属する者が死を味わうのである。」七十人訳にも「悪魔のねたみによって」という句がありますが、作者はこの句を省き、「死が世に入った」とだけ引用しています（<a href="https://bibleox.com/ja/jp-ni/rim/5/#L12">ロマ. 5:12</a> の措辞に近い）。</p></li><li><p>この言葉は七十人訳に従っています（ヘブライ語本文に基づく新共同訳とは大きく異なります）。新共同訳：「もしお前が正しいのなら、顔を上げられるはずではないか。正しくないなら、罪は戸口で待ち伏せており、お前を求める。お前はそれを支配せねばならない。」（<a href="https://bibleox.com/ja/jp-ni/gen/4/#L7">創. 4:7</a>）</p></li><li><p>ペトロの殉教は新約聖書には記されていません（<a href="https://bibleox.com/ja/jp-ni/in/21/#L18-19">ヨハ. 21:18-19</a> の預言を参照）。伝統では、ネロ帝のときローマで、逆さ十字架につけられて殉教したと伝えられます。</p></li><li><p>パウロが七度鎖を担ったことは『使徒行伝』には記されていません。作者は同時代の証人としてこの言葉を述べたのでしょう。<a href="https://bibleox.com/ja/jp-ni/2kor/11/#L23-27">２コリ. 11:23-27</a> に列挙された苦難を参照。</p></li><li><p>「西方の果て」：イタリア、特にローマを指します。東方から見れば、ローマは西の果てだからです。</p></li><li><p>ダナイデス（Danaides）：アルゴス王ダナオスの娘たちで、父の命により初夜に夫を殺しました。ディルケー（Dirce）：テーバイの王妃で、牛の角に縛りつけられて引き回され死にました。作者はこの二人の人物をもって、殉教した婦人たちが耐えた刑罰の凄まじさを表しています。</p></li><li><p>ノアが悔い改めを宣べ伝えたことは創世記には明記されていません（<a href="https://bibleox.com/ja/jp-ni/2pet/2/#L5">２ペト. 2:5</a>「義を説いていたノア」参照）。当時の教会の伝統的な言い方です。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/iez/33/#L11">エゼ. 33:11</a>（七十人訳。エゼ. 18:23 参照）から。新共同訳：「わたしは悪人が死ぬのを喜ばない。むしろ、悪人がその道から立ち帰って生きることを喜ぶ。」</p></li><li><p>この言葉は聖書に対応する原典がなく、七十人訳の諸箇所の措辞を合わせたものです（<a href="https://bibleox.com/ja/jp-ni/ps/103/#L11">詩. 103:11</a>、<a href="https://bibleox.com/ja/jp-ni/is/1/#L18">イザ. 1:18</a>、<a href="https://bibleox.com/ja/jp-ni/ier/3/#L19">エレ. 3:19</a>、<a href="https://bibleox.com/ja/jp-ni/ier/3/#L22">22</a> 参照）。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/is/1/#L16-20">イザ. 1:16-20</a> からの引用です（七十人訳の措辞で、新共同訳とは大きく異なります）。新共同訳：「洗って、清くせよ。悪い行いをわたしの目の前から取り除け。悪を行うことをやめ、善を行うことを学び、裁きをどこまでも実行して搾取する者を懲らし、孤児の権利を守り、やもめの訴えを弁護せよ。」</p></li><li><p>七十人訳の創5:24では「人々は彼を見出さなかった。神が彼を取り去られたからである」。<a href="https://bibleox.com/ja/jp-ni/evr/11/#L5">ヘブ. 11:5</a> 参照：「信仰によって、エノクは死を経験しないように、天に移されました。」</p></li><li><p>「神の友」：<a href="https://bibleox.com/ja/jp-ni/is/41/#L8">イザ. 41:8</a>、<a href="https://bibleox.com/ja/jp-ni/iak/2/#L23">ヤコ. 2:23</a> 参照。第17:2節の「わたしは地と灰です」は<a href="https://bibleox.com/ja/jp-ni/gen/18/#L27">創. 18:27</a> からです。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/gen/12/#L1-3">創. 12:1-3</a> からの引用です（七十人訳。新共同訳とほぼ一致）。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/gen/13/#L14-17">創. 13:14-17</a> からの引用です（七十人訳）。新共同訳：「さあ、目を上げて、あなたがいる場所から東西南北を見渡しなさい。」作者の引用では「北と南と東と海へ」となっています。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/gen/15/#L5-6">創. 15:5-6</a> からの引用です。<a href="https://bibleox.com/ja/jp-ni/rim/4/#L3">ロマ. 4:3</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/lk/17/#L32">ルカ. 17:32</a> 参照：「ロトの妻のことを思い出しなさい。」</p></li><li><p>物語は<a href="https://bibleox.com/ja/jp-ni/nav/2/">ヨシュ. 2</a>（七十人訳）に基づきます。紅の縄を主の血の予型と解するのは、初期教会の伝統的な読み方です。</p></li><li><p>「預言」は第5節のラハブの言葉を指します。彼女は、神がこの地をイスラエルの手に渡すことを先に語ったのですから。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/ier/9/#L23-24">エレ. 9:23-24</a>（七十人訳）からの引用です。新共同訳：「むしろ、誇る者は、この事を誇るがよい。目覚めてわたしを知ることを。わたしこそ主。この地に慈しみと正義と恵みの業を行う事。その事をわたしは喜ぶ、と主は言われる。」</p></li><li><p>主の言葉は<a href="https://bibleox.com/ja/jp-ni/mf/5/#L7">マタ. 5:7</a>、<a href="https://bibleox.com/ja/jp-ni/mf/7/#L1-2">マタ. 7:1-2</a>、<a href="https://bibleox.com/ja/jp-ni/lk/6/#L36-38">ルカ. 6:36-38</a> を合わせたものです。作者は記憶に基づいて引用しており、新共同訳とはやや異なります。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/is/66/#L2">イザ. 66:2</a>（七十人訳）からの引用です。新共同訳：「わたしが顧みるのは苦しむ人、霊の砕かれた人、わたしの言葉におののく人。」</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/pr/2/#L21-22">箴. 2:21-22</a>（七十人訳）参照。新共同訳：「正しい人は地に住まいを得、無垢な人はそこに永らえる。神に逆らう者は地から断たれ、欺く者はそこから引き抜かれる。」</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/ps/37/#L35-37">詩. 37:35-37</a> からの引用です（七十人訳の詩篇では第36編）。新共同訳：「無垢であろうと努め、まっすぐに見ようとせよ。平和な人には未来がある。」</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/is/29/#L13">イザ. 29:13</a>（七十人訳）からの引用です。新共同訳：「この民は、口でわたしに近づき唇でわたしを敬うが心はわたしから遠く離れている。」</p></li><li><p>七十人訳の詩篇第61編に対応する<a href="https://bibleox.com/ja/jp-ni/ps/62/#L5">詩. 62:5</a> 参照：「常に欺こうとして口先で祝福し、腹の底で呪う。」</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/ps/78/#L36-37">詩. 78:36-37</a> からの引用です（七十人訳の詩篇では第77編）。新共同訳：「その口をもって神を侮り舌をもって欺いた。」「彼らの心は神に対して確かに定まらずその契約に忠実ではなかった。」</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/ps/31/#L19">詩. 31:19</a>（七十人訳の詩篇では第30編）参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/ps/12/#L4-6">詩. 12:4-6</a> からの引用です（七十人訳の詩篇では第11編）。</p></li><li><p>イザヤ書第53章からの引用です（七十人訳の措辞、「主よ、だれがわたしたちの聞いたことを信じたのでしょうか」で始まる）。新共同訳：「わたしたちの聞いたことを、誰が信じえようか。主は御腕の力を誰に示されたことがあろうか。」（<a href="https://bibleox.com/ja/jp-ni/is/53/#L1">イザ. 53:1</a>）</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/ps/22/#L7-8">詩. 22:7-8</a> 参照（七十人訳の詩篇では第21編）。新共同訳：「わたしは虫けら、とても人とはいえない。人間の屑、民の恥。」</p></li><li><p>「神の友」：<a href="https://bibleox.com/ja/jp-ni/is/41/#L8">イザ. 41:8</a> 参照。引用は<a href="https://bibleox.com/ja/jp-ni/gen/18/#L27">創. 18:27</a> からです。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/iov/1/#L1">ヨブ. 1:1</a>（七十人訳）からの引用です。新共同訳：「ウツの地にヨブという人がいた。無垢な正しい人で、神を畏れ、悪を避けて生きていた。」</p></li><li><p>七十人訳のヨブ14:4-5の措辞です。新共同訳：「汚れたものから清いものを引き出すことができましょうか。だれひとりできないのです。」（<a href="https://bibleox.com/ja/jp-ni/iov/14/#L4">ヨブ. 14:4</a>）</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/ish/3/#L11">出. 3:11</a>、<a href="https://bibleox.com/ja/jp-ni/ish/4/#L10">出. 4:10</a> 参照。七十人訳の出4:10では「声弱く舌遅い者」（ἰσχνόφωνος καὶ βραδύγλωσσος）です。新共同訳：「わたしはもともと弁が立つ方ではありません。…わたしは口が重く、舌の重い者なのです。」</p></li><li><p>この言葉は聖書の外にあり、出典は不明です。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/ps/89/#L21">詩. 89:21</a>（七十人訳の詩篇では第88編）と<a href="https://bibleox.com/ja/jp-ni/1ts/13/#L14">サム上. 13:14</a> を合わせた引用です。</p></li><li><p>詩篇第51編をほぼ全編にわたって引用しています（七十人訳の詩篇では第50編）。新共同訳の措辞は随所で異なります（例：<a href="https://bibleox.com/ja/jp-ni/ps/51/#L3">詩. 51:3</a>：「神よ、わたしを憐れんでください。御慈しみをもって。深い御憐れみをもって背きの罪をぬぐってください。」）</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/iov/38/#L11">ヨブ. 38:11</a>（七十人訳）参照。新共同訳：「ここまでは来てもよいが越えてはならない。高ぶる波をここでとどめよ」と命じた。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/pr/20/#L27">箴. 20:27</a> からの引用です。七十人訳では「主の霊」とありますが、新共同訳はヘブライ語本文に従います：「主の灯は人間の吸い込む息。腹の隅々まで探る。」</p></li><li><p>詩篇第34編からの引用です（七十人訳の詩篇では第33編）。新共同訳では「子らよ、わたしに聞き従え。主を畏れることを教えよう。」「舌を悪から唇を偽りの言葉から遠ざけ、悪を避け、善を行い、平和を尋ね求め、追い求めよ。」（<a href="https://bibleox.com/ja/jp-ni/ps/34/#L12-18">詩. 34:12-18</a>）</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/ps/32/#L10">詩. 32:10</a> からの引用です（七十人訳の詩篇では第31編）。新共同訳：「神に逆らう者は悩みが多く主に信頼する者は慈しみに囲まれる。」</p></li><li><p>この言葉は聖書に対応する原文がなく、出典は不明です。</p></li><li><p>「来たるべき方は速やかに来られる」：<a href="https://bibleox.com/ja/jp-ni/evr/10/#L37">ヘブ. 10:37</a> 参照、「主は突如、その聖所に来られる」：<a href="https://bibleox.com/ja/jp-ni/mal/3/#L1">マラ. 3:1</a>（七十人訳の措辞）。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/1kor/15/#L20">１コリ. 15:20</a> 参照：キリストは死者の中から復活し、眠りについた人たちの初穂となられました。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/1kor/15/#L36-38">１コリ. 15:36-38</a> 参照。</p></li><li><p>フェニックスの伝説は古代の東方とギリシアの文学に見られます。作者は当時よく知られた伝説をもって復活の例としました。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/ps/3/#L5-6">詩. 3:5-6</a>（七十人訳）を合わせた引用です。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/iov/19/#L26">ヨブ. 19:26</a>（七十人訳の措辞）からの引用です。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/iov/9/#L12">ヨブ. 9:12</a>（七十人訳）からの引用です。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/ps/19/#L2-4">詩. 19:2-4</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/ps/139/#L8-10">詩. 139:8-10</a>（七十人訳の詩篇では第138編）参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/vtor/32/#L8-9">申. 32:8-9</a> からの引用です。七十人訳では「神の天使たちの数」です。新共同訳では「神の子らの数に従い国々の境を設けられた。」</p></li><li><p>この言葉は旧約聖書に対応する原文がなく、七十人訳の数箇所の措辞を合わせたものと思われます。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/pr/3/#L34">箴. 3:34</a> からの引用です（七十人訳）。新約聖書も同じ経文を「神は、高慢な者を敵とし、謙遜な者には恵みをお与えになる」と引用しています（<a href="https://bibleox.com/ja/jp-ni/iak/4/#L6">ヤコ. 4:6</a>、<a href="https://bibleox.com/ja/jp-ni/1pet/5/#L5">１ペト. 5:5</a>）。</p></li><li><p>この二つの言葉は聖書に対応する原文がなく、出典は不明です。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/gen/15/#L5">創. 15:5</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/gen/1/#L26-27">創. 1:26-27</a> からの引用です（七十人訳。新共同訳も「我々にかたどり、我々に似せて、人を造ろう」）。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/is/40/#L10">イザ. 40:10</a>、<a href="https://bibleox.com/ja/jp-ni/is/62/#L11">イザ. 62:11</a>、<a href="https://bibleox.com/ja/jp-ni/otkr/22/#L12">黙. 22:12</a> を合わせた引用です（七十人訳の措辞）。</p></li><li><p>末句「すべての被造物はその栄光に満ちている」は、七十人訳に付加されている三聖童の賛歌からのものです。新共同訳はこの賛歌（「若い三人の友の賛歌」）をダニエル書の補遺として収めていますが、本サイトの新共同訳テキストには含まれていません。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/1kor/2/#L9">１コリ. 2:9</a> 参照：「目が見もせず、耳が聞きもせず、人の心に思い浮かびもしなかったことを、神は御自分を愛する者たちに準備された。」</p></li><li><p>詩篇第50編の後半からの引用です（七十人訳の詩篇では第49編）。新共同訳では「神は背く者に言われる。『お前はわたしの掟を片端から唱え、わたしの契約を口にする。どういうつもりか。』」（<a href="https://bibleox.com/ja/jp-ni/ps/50/#L16-23">詩. 50:16-23</a>）</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/evr/1/#L3">ヘブ. 1:3</a> 参照：「御子は、神の栄光の反映であり、神の本質の完全な現れであって。」</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/ps/104/#L4">詩. 104:4</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/ps/2/#L7-8">詩. 2:7-8</a> からの引用です。第5節「わたしの右の座に就くがよい……」は<a href="https://bibleox.com/ja/jp-ni/ps/110/#L1">詩. 110:1</a> からです。</p></li><li><p>ヨブ記からの引用です。七十人訳の語句（第4章16節と第15章15-16節）によるもので、当時流布していたより長いギリシア語ヨブ記に基づきます。新共同訳では「神は聖なる人々をも信頼なさらず、天すら、神の目には清くない。」（<a href="https://bibleox.com/ja/jp-ni/iov/15/#L15">ヨブ. 15:15</a>）</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/is/60/#L17">イザ. 60:17</a> からの引用です。七十人訳では「主教たちを正義のうちに」の句が現れますが、「輔祭たちを信仰のうちに」の句は七十人訳にはなく、作者が加えた自由な引用です。新共同訳では「わたしがあなたに与える命令は平和、あなたを支配するものは恵みの業。」</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/chis/12/#L7">民. 12:7</a> を参照（「わたしの僕モーセはそうではない。彼はわたしの家の者すべてに信頼されている。」）。<a href="https://bibleox.com/ja/jp-ni/evr/3/#L2">ヘブ. 3:2</a>、<a href="https://bibleox.com/ja/jp-ni/evr/3/#L5">5</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/in/17/#L3">ヨハ. 17:3</a> 参照：「永遠の命とは、唯一のまことの神であられるあなたと、あなたのお遣わしになったイエス・キリストを知ることです。」</p></li><li><p>この言葉は聖書に対応する原文がなく、出典は不明です（当時流布していた教えの文書からの可能性があります）。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/ps/18/#L26-27">詩. 18:26-27</a>（七十人訳の詩篇では第17編）参照。新共同訳：「あなたの慈しみに生きる人にあなたは慈しみを示し、無垢な人には無垢に。」</p></li><li><p>詩篇第118編からの引用です（七十人訳の詩篇では第117編）。新共同訳では「正義の城門を開け、わたしは入って主に感謝しよう。」「これは主の城門、主に従う人々はここを入る。」（<a href="https://bibleox.com/ja/jp-ni/ps/118/#L19-20">詩. 118:19-20</a>）</p></li><li><p>「愛は多くの罪を覆います」：<a href="https://bibleox.com/ja/jp-ni/1pet/4/#L8">１ペト. 4:8</a> 参照；「すべての事を忍び、すべての事に耐える」：<a href="https://bibleox.com/ja/jp-ni/1kor/13/#L4-7">１コリ. 13:4-7</a> 参照。</p></li><li><p>イザヤ書（「さあ、わが民よ、部屋に入れ……激しい憤りが過ぎ去るまで」）とエゼキエル書（「わたしはお前たちの墓を開く」）の七十人訳の措辞を合わせた引用です（<a href="https://bibleox.com/ja/jp-ni/is/26/#L20">イザ. 26:20</a>、<a href="https://bibleox.com/ja/jp-ni/iez/37/#L12">エゼ. 37:12</a>）。</p></li><li><p>詩篇第32編からの引用です（七十人訳の詩篇では第31編）。新共同訳では「いかに幸いなことでしょう。背きを赦され、罪を覆っていただいた者は。」（<a href="https://bibleox.com/ja/jp-ni/ps/32/#L1-2">詩. 32:1-2</a>）</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/chis/16/#L33">民. 16:33</a>（「彼らと彼らに属するものはすべて、生きたまま、陰府へ落ち」）と詩篇第49編（七十人訳の詩篇では第48編；<a href="https://bibleox.com/ja/jp-ni/ps/49/#L15">詩. 49:15</a>「死が彼らを飼う」）の七十人訳の措辞からの引用です。</p></li><li><p>詩篇第69編からの引用です（七十人訳の詩篇では第68編）。新共同訳では「神の御名を賛美してわたしは歌い……それは雄牛のいけにえよりも角をもち、ひづめの割れた牛よりもなお主に喜ばれることでしょう。」（<a href="https://bibleox.com/ja/jp-ni/ps/69/#L30-32">詩. 69:30-32</a>）</p></li><li><p>詩篇第50編からの引用です（七十人訳の詩篇では第49編）。新共同訳では「告白を神へのいけにえとしてささげ、いと高き神に満願の献げ物をせよ。」「それから、わたしを呼ぶがよい。苦難の日、わたしはお前を救おう。」（<a href="https://bibleox.com/ja/jp-ni/ps/50/#L14-15">詩. 50:14-15</a>）</p></li><li><p>出エジプト記32:7-14 とヨブ記（「神は一つのことによって語られ、また二つのことによって語られる」）の七十人訳の措辞を合わせた引用です（<a href="https://bibleox.com/ja/jp-ni/iov/33/#L14">ヨブ. 33:14</a>）。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/ps/24/#L1">詩. 24:1</a> からの引用です（七十人訳の詩篇では第23編）。新共同訳：「地とそこに満ちるもの、世界とそこに住むものは、主のもの。」</p></li><li><p>ユディトの物語は第二正典の『ユディト書』に記されています（新共同訳も収めています）。<a href="https://bibleox.com/ja/jp-ni/iudf/8/">ユデ. 8</a>（第8〜13章）参照。</p></li><li><p>この引用群について：第3節は<a href="https://bibleox.com/ja/jp-ni/ps/118/#L18">詩. 118:18</a>（七十人訳の詩篇では第117編）参照；第4節は<a href="https://bibleox.com/ja/jp-ni/pr/3/#L12">箴. 3:12</a> と<a href="https://bibleox.com/ja/jp-ni/evr/12/#L6">ヘブ. 12:6</a> 参照；第5節は<a href="https://bibleox.com/ja/jp-ni/ps/141/#L5">詩. 141:5</a>（七十人訳の詩篇では第140編）参照。</p></li><li><p>ヨブ記第5章からの引用です（七十人訳の措辞で、新共同訳よりも長い）。新共同訳：「見よ、幸いなのは神の懲らしめを受ける人。全能者の戒めを拒んではならない。」（<a href="https://bibleox.com/ja/jp-ni/iov/5/#L17-26">ヨブ. 5:17-26</a>）</p></li><li><p>箴言第1章からの引用です（七十人訳。「知恵」が一人称で語ります）。第57:7節まで続きます。新共同訳の措辞はこれとは大きく異なります。</p></li><li><p>第57:7節から第63章まではアレクサンドリア写本に欠けており、1056年製作のエルサレム駐在所写本（Codex Hierosol. 54）によって補っています。本訳は原書の章節の順に従って本文に組み入れています。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/ps/79/#L13">詩. 79:13</a>（七十人訳の詩篇では第78編）参照。新共同訳：「わたしたちはあなたの民、あなたに養われる羊の群れ。」</p></li></ol><p>翻訳：ロジオン・ヴラソフ（AIツールを併用）。底本：ギリシア語本文（<a href="https://bibleox.com/ja/grc/w/ΚλΡμ_Κορ1">本サイトのギリシア語版</a>）。参照：ロシア語訳（プレオブラジェンスキー訳。第57:7節と第58–63章はプリシェルコフ訳による）、英訳（Roberts–Donaldson）。第57:7節と第58–63章はアレクサンドリア写本に欠けており、1056年製作のエルサレム駐在所写本（Codex Hierosol. 54）によって補い、ここでは原書の章節の順に従って本文に組み入れた。聖書のリンクは本サイトの新共同訳を指す。翻訳原則：作者が聖書を引用する箇所は、彼自身が用いたテキスト（おおむね七十人訳）の語句に従って訳し、新共同訳と措辞が異なる箇所は注で示して新共同訳へのリンクを付した；用語・人名はイグナティオス書簡の日本語訳（本サイト）に倣う；段落番号はギリシア語原文の章・節の区分による（章:節 で引用できる）。</p>
