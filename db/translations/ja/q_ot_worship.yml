  - src: иерусалимский-храм
    path: Jt1t_エルサレムの神殿
    title: 旧約のエルサレムの神殿
    title_sub: ソロモンが建てた、古代の旧約のエルサレムの神殿の構造についての聖書の記述
    meta_desc: ソロモンが建てた、古代の旧約のエルサレムの神殿の構造についての聖書の記述
    menu: { parent: "旧約/礼拝", title: "エルサレムの神殿", priority: 1 }
    body: |-
      <h2>概要</h2><p>神殿は、ソロモンによってモリヤ山に建てられました（<a href="https://bibleox.com/ja/jp-ni/2par/3/#L1">代下. 3:1</a>）。そこはエブス人オルナンの麦打ち場（小麦を集めて清める場所）の跡で（<a href="https://bibleox.com/ja/jp-ni/2par/3/#L1">代下. 3:1</a>）、ソロモンの父ダビデが民を打つ天使を見た場所であり、預言者ガドも指し示した場所でした（<a href="https://bibleox.com/ja/jp-ni/2ts/24/#L16-18">サム下. 24:16-18</a>）。神殿の建築は、ユダヤ人がエジプトを出てから480年目（七十人訳では440年目）に始まりました。それはソロモンの治世第四年、ジウの月でした（<a href="https://bibleox.com/ja/jp-ni/3ts/6/#L37">王上. 6:37</a>; <a href="https://bibleox.com/ja/jp-ni/2par/3/#L2">代下. 3:2</a>）。建物は7年後、ソロモンの治世第十一年、ブルの月に完成しました（<a href="https://bibleox.com/ja/jp-ni/3ts/6/#L38">王上. 6:38</a>）。</p><h2>神殿を造れという神の命令</h2><blockquote><p>「主はモーセに仰せになった。イスラエルの人々に命じて、わたしのもとに献納物を持って来させなさい。&lt;…&gt; <strong>わたしのための聖なる所を彼らに造らせなさい</strong>。わたしは彼らの中に住むであろう。&lt;…&gt; <strong>あなたはこの山で示された作り方に従い、注意して作りなさい</strong>」（<a href="https://bibleox.com/ja/jp-ni/ish/25/#L1-2,8,40">出. 25:1-2,8,40</a>）</p></blockquote><blockquote><p>「わたしたちの先祖には、荒れ野に<strong>証しの幕屋</strong>がありました。これは、見たままの形に<strong>造るようにとモーセに言われた方</strong>のお命じになったとおりのものでした」（<a href="https://bibleox.com/ja/jp-ni/act/7/#L44">使. 7:44</a>）</p></blockquote><p>地上の神殿は、天にある実体にかたどって造られています：</p><blockquote><p><em>「なぜならキリストは、</em><strong><em>まことのものの写しにすぎない、人間の手で造られた聖所</em></strong><em>にではなく、天そのものに入り、今やわたしたちのために神の御前に現れてくださったからです」（</em><a href="https://bibleox.com/ja/jp-ni/evr/9/#L24"><em>ヘブ. 9:24</em></a><em>）</em></p></blockquote><h2>エルサレムの神殿の構造</h2><p>神殿の壁は石で築かれていました。</p><p><em>以下の寸法はアンマ（キュビト）で示されています。おおよそのメートルにするには、アンマの数を2で割ってください。</em></p><h3>神殿の寸法（<a href="https://bibleox.com/ja/jp-ni/3ts/6/#L2">王上. 6:2</a>; <a href="https://bibleox.com/ja/jp-ni/2par/3/#L3">代下. 3:3</a>）</h3><ul><li><p>奥行き60アンマ（壁によって20アンマと40アンマに分けられる）、</p></li><li><p>間口20アンマ、</p></li><li><p>高さ30アンマ。</p></li></ul><p>メートルでは：31.5 x 10.5 x 15.75。</p><p>神殿は石の壁によって二つの部分（20アンマと40アンマ）に分けられていました（<a href="https://bibleox.com/ja/jp-ni/3ts/6/#L16-17">王上. 6:16-17</a>）：</p><ul><li><p>20アンマの部分は「至聖所」（または内陣、デビル）と呼ばれます。</p></li><li><p>40アンマの部分は「聖所」（外陣）と呼ばれます。</p></li></ul><p>神殿には格子作りの窓がありました（<a href="https://bibleox.com/ja/jp-ni/3ts/6/#L4">王上. 6:4</a>）。</p><h3>前廊</h3><p>神殿の前には前廊（玄関）も造られました（神殿の一部には数えられません）。その寸法（<a href="https://bibleox.com/ja/jp-ni/3ts/6/#L3">王上. 6:3</a>）：</p><ul><li><p>奥行き20アンマ、</p></li><li><p>間口10アンマ、</p></li><li><p>高さ120アンマ（<a href="https://bibleox.com/ja/jp-ni/2par/3/#L4">代下. 3:4</a>）？</p></li></ul><h3>脇間</h3><p>神殿の周囲には三階建ての脇間が造られ（<a href="https://bibleox.com/ja/jp-ni/3ts/6/#L5">王上. 6:5</a>）、梁は神殿の壁にはめ込まれていませんでした（<a href="https://bibleox.com/ja/jp-ni/3ts/6/#L6">王上. 6:6</a>）。各階の幅は、下から順に5、6、7アンマです。</p><h3>脇の部屋</h3><p>神殿の周囲には脇の部屋も造られ、レバノン杉の材木で神殿に固定されていました（<a href="https://bibleox.com/ja/jp-ni/3ts/6/#L10">王上. 6:10</a>）。部屋の高さは5アンマです。</p><h3>神殿の壁</h3><p>壁は切り石で築かれていました。内側では、神殿の壁と天井はレバノン杉の板で覆われていました（<a href="https://bibleox.com/ja/jp-ni/3ts/6/#L9,16">王上. 6:9,16</a>）。神殿の床には糸杉の板が張られていました（<a href="https://bibleox.com/ja/jp-ni/3ts/6/#L15">王上. 6:15</a>）。すべてが木材で覆われ、内側からは石が全く見えませんでした（<a href="https://bibleox.com/ja/jp-ni/3ts/6/#L18">王上. 6:18</a>）。神殿の壁と床は、ある程度金でも覆われていました（<a href="https://bibleox.com/ja/jp-ni/3ts/6/#L22">王上. 6:22</a>; <a href="https://bibleox.com/ja/jp-ni/2par/3/#L5">代下. 3:5</a>; <a href="https://bibleox.com/ja/jp-ni/2par/3/#L7">代下. 3:7</a>; <a href="https://bibleox.com/ja/jp-ni/3ts/6/#L30">王上. 6:30</a>）。通常、彫刻された像は金で覆われていました（<a href="https://bibleox.com/ja/jp-ni/3ts/6/#L32">王上. 6:32</a>）。レバノン杉の板（壁と天井）には、ケルビム、なつめやし、花模様（<a href="https://bibleox.com/ja/jp-ni/3ts/6/#L29">王上. 6:29</a>）、ひょうたん模様（<a href="https://bibleox.com/ja/jp-ni/3ts/6/#L18">王上. 6:18</a>）が彫られていました。それらは「内側の部屋も外側の部屋も」（<a href="https://bibleox.com/ja/jp-ni/3ts/6/#L29">王上. 6:29</a>）、すなわち至聖所（神殿の内側の部分）にも聖所（外側の部分）にも彫られていました。神殿は宝石で飾られていました（<a href="https://bibleox.com/ja/jp-ni/2par/3/#L6">代下. 3:6</a>）。重要なこと：ケルビムの像は、それ以前にも幕屋の幕（壁）にありました（<a href="https://bibleox.com/ja/gr-lxx-byz/ish/26/#L1">出. 26:1、七十人訳</a>; <a href="https://bibleox.com/ja/jp-ni/ish/36/#L8">出. 36:8</a>）。</p><h2>至聖所</h2><p>寸法：20 x 20 x 20アンマ（<a href="https://bibleox.com/ja/jp-ni/3ts/6/#L20">王上. 6:20</a>; <a href="https://bibleox.com/ja/jp-ni/2par/3/#L8">代下. 3:8</a>）。純金で覆われていました。金の鎖が渡されていました（<a href="https://bibleox.com/ja/jp-ni/3ts/6/#L21">王上. 6:21</a>）。</p><h3>入り口</h3><p>至聖所への入り口は、<strong>五角形</strong>の扉で（<a href="https://bibleox.com/ja/jp-ni/3ts/6/#L31">王上. 6:31</a>; <a href="https://bibleox.com/ja/jp-ni/2par/4/#L22">代下. 4:22</a>）、オリーブ材で作られていました。扉は（壁と同じように）ケルビム、なつめやし、花模様の浮き彫りで飾られていました。彫刻は金で覆われていました（<a href="https://bibleox.com/ja/jp-ni/3ts/6/#L32">王上. 6:32</a>）。ここにはまた、ケルビムの縫い取りを施した垂れ幕がありました（<a href="https://bibleox.com/ja/jp-ni/2par/3/#L14">代下. 3:14</a>; <a href="https://bibleox.com/ja/jp-ni/1mak/1/#L22">１マカ. 1:22</a>）。幕屋と同じように、青、紫、緋色の織物でした（<a href="https://bibleox.com/ja/gr-lxx-byz/ish/26/#L31">出. 26:31、七十人訳</a>）。垂れ幕の前には、絶えずともし火がともっていました（<a href="https://bibleox.com/ja/jp-ni/lev/24/#L1-4">レビ. 24:1-4</a>）。</p><h3>二体のケルビム</h3><p>オリーブ材で作られた二体の大きなケルビムの像が据えられていました（<a href="https://bibleox.com/ja/jp-ni/3ts/6/#L23">王上. 6:23</a>）。それらは金で覆われていました（<a href="https://bibleox.com/ja/jp-ni/3ts/6/#L28">王上. 6:28</a>; <a href="https://bibleox.com/ja/jp-ni/2par/3/#L10">代下. 3:10</a>）。ケルビムの高さと幅は10アンマで（<a href="https://bibleox.com/ja/jp-ni/3ts/6/#L23">王上. 6:23</a>）、幅は一方の翼の先から他方の翼の先までで測られました（<a href="https://bibleox.com/ja/jp-ni/3ts/6/#L24-27">王上. 6:24-27</a>; <a href="https://bibleox.com/ja/jp-ni/2par/3/#L11">代下. 3:11</a>）。それぞれのケルビムの一方の翼は壁に触れ、もう一方の翼は隣のケルビムの翼に触れていました（<a href="https://bibleox.com/ja/jp-ni/2par/3/#L11-12">代下. 3:11-12</a>）。その顔は神殿の方を向いていました（<a href="https://bibleox.com/ja/jp-ni/2par/3/#L13">代下. 3:13</a>）。<em>（代下. 3:13 の「内側に」は、ヘブライ語原文では לַבָּיִת —「神殿の方に」です。）</em></p><h3>契約の箱</h3><p>中央の、ケルビムの翼の下には契約の箱が置かれていました（<a href="https://bibleox.com/ja/jp-ni/3ts/6/#L19">王上. 6:19</a>; <a href="https://bibleox.com/ja/jp-ni/3ts/8/#L6">王上. 8:6</a>; <a href="https://bibleox.com/ja/jp-ni/2par/5/#L7">代下. 5:7</a>）。それを担ぐための棒も一緒でした（<a href="https://bibleox.com/ja/jp-ni/3ts/8/#L7">王上. 8:7</a>; <a href="https://bibleox.com/ja/jp-ni/2par/5/#L9">代下. 5:9</a>; <a href="https://bibleox.com/ja/jp-ni/ish/25/#L15">出. 25:15</a>）。箱の寸法は2.5×1.5×1.5アンマでした（<a href="https://bibleox.com/ja/jp-ni/ish/25/#L10">出. 25:10</a>）。箱はアカシヤ材で作られ（<a href="https://bibleox.com/ja/jp-ni/ish/25/#L10">出. 25:10</a>）、内側も外側も金で覆われていました（<a href="https://bibleox.com/ja/jp-ni/ish/25/#L11">出. 25:11</a>）。箱の脚の四隅には金の環があり（<a href="https://bibleox.com/ja/jp-ni/ish/25/#L12">出. 25:12</a>）、やはり金で覆われた木の棒を通すためのもので（<a href="https://bibleox.com/ja/jp-ni/ish/25/#L13">出. 25:13</a>）、それは箱を担ぐのに必要でした。箱の中には、預言者モーセ自身が納めた二枚の石の契約の板（<a href="https://bibleox.com/ja/jp-ni/3ts/8/#L9">王上. 8:9</a>; <a href="https://bibleox.com/ja/jp-ni/2par/5/#L10">代下. 5:10</a>）、マナ（<a href="https://bibleox.com/ja/jp-ni/ish/16/#L32-34">出. 16:32-34</a>）、そしてアーモンドの花を咲かせたアロンの杖（<a href="https://bibleox.com/ja/jp-ni/chis/17/#L23-26">民. 17:23-26</a>）がありました。契約の箱の上は、2.5×1.5アンマのふた（贖いの座）で閉じられていました（<a href="https://bibleox.com/ja/jp-ni/ish/25/#L17">出. 25:17</a>）。ふたの上には、向かい合う二体の金のケルビムの像がありました（<a href="https://bibleox.com/ja/jp-ni/ish/25/#L18-20">出. 25:18-20</a>）。その翼は上に広げられ、それで箱のふたを覆っていました。箱のふたの上、二体のケルビムの間で、神は御自身を現し、語られました（<a href="https://bibleox.com/ja/jp-ni/ish/25/#L22">出. 25:22</a>）。</p><h2>聖所</h2><h3>入り口</h3><p>聖所への入り口は、糸杉材の<strong>二枚の折り畳み扉</strong>で（<a href="https://bibleox.com/ja/jp-ni/3ts/6/#L34">王上. 6:34</a>）、門柱はオリーブ材で<strong>四角形</strong>でした（<a href="https://bibleox.com/ja/jp-ni/3ts/6/#L33">王上. 6:33</a>）。これらの扉も、金で覆われたケルビム、なつめやし、花模様の彫刻で飾られていました（<a href="https://bibleox.com/ja/jp-ni/3ts/6/#L35">王上. 6:35</a>）。</p><h3>祭壇</h3><p>至聖所の扉の前には、<a href="https://bibleox.com/ru/q/%D1%84%D0%B8%D0%BC%D0%B8%D0%B0%D0%BC">香をたく</a>ための祭壇がありました。それは木で作られ、金で覆われていました（<a href="https://bibleox.com/ja/jp-ni/3ts/6/#L22">王上. 6:22</a>; <a href="https://bibleox.com/ja/jp-ni/3ts/7/#L48">王上. 7:48</a>）。</p><h3>聖卓</h3><p>その近くには、供えのパンを載せる金の聖卓がありました（<a href="https://bibleox.com/ja/jp-ni/3ts/7/#L48">王上. 7:48</a>; <a href="https://bibleox.com/ja/jp-ni/2par/4/#L8">代下. 4:8</a>）。</p><h3>燭台</h3><p>左右には金の燭台（メノラー）があり、右に5つ、左に5つでした（<a href="https://bibleox.com/ja/jp-ni/3ts/7/#L49">王上. 7:49</a>）。それらは純金で作られ、ともし火皿、香炉、花、芯切り鋏、鉢、皿、柄杓、扉のちょうつがいも、すべて金でした（<a href="https://bibleox.com/ja/jp-ni/3ts/7/#L50">王上. 7:50</a>; <a href="https://bibleox.com/ja/jp-ni/2par/4/#L19-22">代下. 4:19-22</a>）。</p><h2>前廊</h2><p>内部は純金で覆われていました（<a href="https://bibleox.com/ja/jp-ni/2par/3/#L4">代下. 3:4</a>）。</p><h3>柱：ヤキンとボアズ</h3><p>前廊の入り口の前には、二本の巨大な同じ形の青銅の柱が立てられ、名が付けられました。右はヤキン、左はボアズです（<a href="https://bibleox.com/ja/jp-ni/3ts/7/#L21">王上. 7:21</a>; <a href="https://bibleox.com/ja/jp-ni/2par/3/#L17">代下. 3:17</a>）。柱の高さは<strong>18アンマ</strong>でした（<a href="https://bibleox.com/ja/jp-ni/3ts/7/#L15">王上. 7:15</a>）（35アンマ — <a href="https://bibleox.com/ja/jp-ni/2par/3/#L15">代下. 3:15</a>）。周囲は12アンマの縄で測られました（<a href="https://bibleox.com/ja/jp-ni/3ts/7/#L15">王上. 7:15</a>）。柱の上には、それぞれ高さ5アンマの柱頭が据えられていました（<a href="https://bibleox.com/ja/jp-ni/3ts/7/#L16">王上. 7:16</a>）。柱頭は格子模様と網目模様の房で飾られ（<a href="https://bibleox.com/ja/jp-ni/3ts/7/#L16">王上. 7:16</a>）、それぞれの柱頭に7つずつありました（<a href="https://bibleox.com/ja/jp-ni/3ts/7/#L17">王上. 7:17</a>）。柱頭の上には、ざくろが二列に並べられていました（<a href="https://bibleox.com/ja/jp-ni/3ts/7/#L18">王上. 7:18</a>）。前廊の柱の、ゆりの花の形をした4アンマの柱頭についても言及されています（<a href="https://bibleox.com/ja/jp-ni/3ts/7/#L19">王上. 7:19</a>）。青銅の祭具はすべて磨き上げられていました（<a href="https://bibleox.com/ja/jp-ni/3ts/7/#L45">王上. 7:45</a>）。</p><h2>庭</h2><p>神殿の前には<strong>内庭（祭司の庭）</strong>が造られました（<a href="https://bibleox.com/ja/jp-ni/3ts/6/#L36">王上. 6:36</a>; <a href="https://bibleox.com/ja/jp-ni/2par/4/#L9">代下. 4:9</a>）。それは切り石三列とレバノン杉の角材一列で築かれて（囲まれて）いました（<a href="https://bibleox.com/ja/jp-ni/3ts/6/#L36">王上. 6:36</a>）（<a href="https://bibleox.com/ja/jp-ni/3ts/7/#L12">王上. 7:12</a>）。外側の大庭も囲まれていました（<a href="https://bibleox.com/ja/jp-ni/3ts/7/#L12">王上. 7:12</a>; <a href="https://bibleox.com/ja/jp-ni/2par/4/#L9">代下. 4:9</a>）。</p><h3>祭壇</h3><p>寸法：20 x 20アンマ、高さ10アンマ（<a href="https://bibleox.com/ja/jp-ni/2par/4/#L1">代下. 4:1</a>）</p><h3>青銅の「海」</h3><p>祭司が身を清めるための円形の器です（<a href="https://bibleox.com/ja/jp-ni/2par/4/#L6">代下. 4:6</a>）。第一の（内側の）庭には、青銅で鋳造された円形の「海」がありました。寸法：直径10アンマ、高さ5アンマ（<a href="https://bibleox.com/ja/jp-ni/3ts/7/#L23">王上. 7:23</a>; <a href="https://bibleox.com/ja/jp-ni/2par/4/#L2">代下. 4:2</a>）、厚さは約一トファ（手幅）（<a href="https://bibleox.com/ja/jp-ni/3ts/7/#L26">王上. 7:26</a>; <a href="https://bibleox.com/ja/jp-ni/2par/4/#L5">代下. 4:5</a>）。周囲は30アンマの縄で測られました（<a href="https://bibleox.com/ja/jp-ni/3ts/7/#L23">王上. 7:23</a>）。器の縁は、一アンマにつき十のひょうたん模様の二列で飾られていました（<a href="https://bibleox.com/ja/jp-ni/3ts/7/#L24">王上. 7:24</a>）。容量は2000バトでした（<a href="https://bibleox.com/ja/jp-ni/3ts/7/#L26">王上. 7:26</a>）。それは神殿の南東に置かれていました（<a href="https://bibleox.com/ja/jp-ni/3ts/7/#L39">王上. 7:39</a>; <a href="https://bibleox.com/ja/jp-ni/2par/4/#L10">代下. 4:10</a>）。</p><h3>12頭の牛</h3><p>青銅の「海」は12頭の牛の上に据えられていました（<a href="https://bibleox.com/ja/jp-ni/3ts/7/#L25">王上. 7:25</a>; <a href="https://bibleox.com/ja/jp-ni/2par/4/#L3-4">代下. 4:3-4</a>; <a href="https://bibleox.com/ja/jp-ni/2par/4/#L15">代下. 4:15</a>）。3頭の牛は北を向き、同じように3頭ずつがほかのそれぞれの方角を向いていました。</p><h3>10の洗盤</h3><p>いけにえの動物をささげる前に洗い清めるための器です（<a href="https://bibleox.com/ja/jp-ni/2par/4/#L6">代下. 4:6</a>）。それぞれの洗盤は［40］バト入りました。それらは神殿のそばに、左に5つ、右に5つ置かれていました（<a href="https://bibleox.com/ja/jp-ni/3ts/7/#L39">王上. 7:39</a>）。それぞれに車輪の付いた移動式の台がありました。</p><h3>10台の台車</h3><p>移動式の四角い青銅の台（台車）10台（<a href="https://bibleox.com/ja/jp-ni/3ts/7/#L27">王上. 7:27</a>; <a href="https://bibleox.com/ja/jp-ni/3ts/7/#L31">王上. 7:31</a>）：4 x 4アンマ、高さ3アンマ。台車の鏡板には獅子、牛、ケルビムが描かれ、上には唐草模様がありました（<a href="https://bibleox.com/ja/jp-ni/3ts/7/#L28-29">王上. 7:28-29</a>）。台車は4つの青銅の車輪で動きました（<a href="https://bibleox.com/ja/jp-ni/3ts/7/#L30">王上. 7:30</a>）。車輪の高さは1.5アンマでした（<a href="https://bibleox.com/ja/jp-ni/3ts/7/#L32">王上. 7:32</a>）。すべて同じ形でした（<a href="https://bibleox.com/ja/jp-ni/3ts/7/#L37">王上. 7:37</a>）。</p><h3>詠唱者、ラッパ奏者</h3><p>神殿の奉献の際、レビ人は歌い、楽器（シンバル、竪琴、琴）を奏で、祭司たちはラッパを吹きました（<a href="https://bibleox.com/ja/jp-ni/2par/5/#L12">代下. 5:12</a>）。楽器は神殿のために特別に作られました（<a href="https://bibleox.com/ja/jp-ni/2par/7/#L6">代下. 7:6</a>）。</p><h2>像</h2><p>ケルビムの浮き彫りの像は、神殿の壁（<a href="https://bibleox.com/ja/jp-ni/3ts/6/#L32">王上. 6:32</a>）、入り口の扉（<a href="https://bibleox.com/ja/jp-ni/3ts/6/#L32">王上. 6:32</a>; <a href="https://bibleox.com/ja/jp-ni/3ts/6/#L35">王上. 6:35</a>）、至聖所の入り口の前の垂れ幕（<a href="https://bibleox.com/ja/jp-ni/2par/3/#L14">代下. 3:14</a>; <a href="https://bibleox.com/ja/jp-ni/1mak/1/#L22">１マカ. 1:22</a>）にありました。至聖所には、金で覆われた二体の大きな木のケルビムの像が立っていました（<a href="https://bibleox.com/ja/jp-ni/3ts/6/#L23">王上. 6:23</a>）。契約の箱のふたの上には、二体のケルビムの像が作られていました（<a href="https://bibleox.com/ja/jp-ni/ish/25/#L18-20">出. 25:18-20</a>）。神殿の庭では、洗盤の大きな台車に獅子、牛、ケルビムが描かれていました（<a href="https://bibleox.com/ja/jp-ni/3ts/7/#L28-29">王上. 7:28-29</a>）。</p><h2>祈り</h2><p>神殿の奉献の際のソロモン王の祈り：<a href="https://bibleox.com/ja/jp-ni/3ts/8/#L22-53">王上. 8:22-53</a>; <a href="https://bibleox.com/ja/jp-ni/2par/6/#L14-42">代下. 6:14-42</a></p><p>ソロモンの祈りに対する神の答え：<a href="https://bibleox.com/ja/jp-ni/2par/7/#L12-22">代下. 7:12-22</a></p>

  - src: ковчег_завета
    path: Ak2c_契約の箱
    title: 契約の箱
    title_sub: 契約の箱の構造
    meta_desc: 契約の箱（掟の箱）の構造についての聖書の記述
    menu: { parent: "旧約/礼拝", title: "契約の箱", priority: 2 }
    body: |-
      <h2>契約の箱（掟の箱）</h2><p><a href="https://bibleox.com/ru/ru/w/%D0%B8%D0%B5%D1%80%D1%83%D1%81%D0%B0%D0%BB%D0%B8%D0%BC%D1%81%D0%BA%D0%B8%D0%B9-%D1%85%D1%80%D0%B0%D0%BC">エルサレムの神殿</a>の至聖所の中央、ケルビムの翼の下に、契約の箱が置かれていました（<a href="https://bibleox.com/ja/jp-ni/3ts/6/#L19">王上. 6:19</a>; <a href="https://bibleox.com/ja/jp-ni/3ts/8/#L6">王上. 8:6</a>; <a href="https://bibleox.com/ja/jp-ni/2par/5/#L7">代下. 5:7</a>）。それを担ぐための棒も一緒でした（<a href="https://bibleox.com/ja/jp-ni/3ts/8/#L7">王上. 8:7</a>; <a href="https://bibleox.com/ja/jp-ni/2par/5/#L9">代下. 5:9</a>; <a href="https://bibleox.com/ja/jp-ni/ish/25/#L15">出. 25:15</a>）。</p><h3>本体</h3><p>寸法は縦2.5アンマ、横1.5アンマ、高さ1.5アンマです（<a href="https://bibleox.com/ja/jp-ni/ish/25/#L10">出. 25:10</a>）。アカシヤ材で作られています（<a href="https://bibleox.com/ja/jp-ni/ish/25/#L10">出. 25:10</a>）。内側も外側も金で覆われ、周囲には金の飾り縁があります（<a href="https://bibleox.com/ja/jp-ni/ish/25/#L11">出. 25:11</a>）。</p><h3>環</h3><p>箱の四隅の脚には、箱を担ぐための金の環が付けられ、全部で4つです（<a href="https://bibleox.com/ja/jp-ni/ish/25/#L12">出. 25:12</a>; <a href="https://bibleox.com/ja/jp-ni/ish/25/#L13-15">出. 25:13-15</a>）。<em>（新共同訳では出. 25:14 が欠けています。ヘブライ語原文では「その棒を箱の両側の環に通し、箱を担げるようにする」です。）</em></p><h3>棒</h3><p>環にはアカシヤ材の2本の棒が通されます（<a href="https://bibleox.com/ja/jp-ni/ish/25/#L13">出. 25:13</a>）。棒は金で覆われています（<a href="https://bibleox.com/ja/jp-ni/ish/25/#L13">出. 25:13</a>）。棒を箱から抜いてはなりません（<a href="https://bibleox.com/ja/jp-ni/ish/25/#L15">出. 25:15</a>）。</p><h3>ふた（贖いの座）</h3><p>寸法は（箱と同じく）縦2.5アンマ、横1.5アンマで、純金で作られています（<a href="https://bibleox.com/ja/jp-ni/ish/25/#L17">出. 25:17</a>）。</p><h3>ケルビム</h3><p>箱のふたの上には、金で二体のケルビムの像が作られています（<a href="https://bibleox.com/ja/jp-ni/ish/25/#L18">出. 25:18</a>）。一体はふたの一方の端に、もう一体は他方の端にあり（<a href="https://bibleox.com/ja/jp-ni/ish/25/#L19">出. 25:19</a>）、ふたの方を向いて向かい合っています（<a href="https://bibleox.com/ja/jp-ni/ish/25/#L20">出. 25:20</a>）。その翼は上に広げられ、ふたを覆っています（<a href="https://bibleox.com/ja/jp-ni/ish/25/#L20">出. 25:20</a>）。</p><h3>中身</h3><p>箱の中には、預言者モーセが納めた二枚の石の契約の板（<a href="https://bibleox.com/ja/jp-ni/3ts/8/#L9">王上. 8:9</a>; <a href="https://bibleox.com/ja/jp-ni/2par/5/#L10">代下. 5:10</a>）、マナ（<a href="https://bibleox.com/ja/jp-ni/ish/16/#L32-34">出. 16:32-34</a>）、そしてアーモンドの花を咲かせたアロンの杖（<a href="https://bibleox.com/ja/jp-ni/chis/17/#L23-26">民. 17:23-26</a>）がありました。</p><h2>神は箱の上で語られる</h2><p>神は、箱のふたの上、二体のケルビムの間で、目に見える形で御自身を現し、語られます（<a href="https://bibleox.com/ja/jp-ni/ish/25/#L22">出. 25:22</a>）。</p>

  - src: ветхозаветный-священник
    path: Pr3o_旧約の祭司
    title: 旧約の祭司
    meta_desc: 旧約の祭司と大祭司の任職、祭服、いけにえについての聖書の記述
    menu: { parent: "旧約/礼拝", title: "旧約の祭司", priority: 3 }
    references: |-
      <ol><li><p>A. P. ロプーヒンの解説を参照：<a href="https://bible.optina.ru/old:ish:28:30#lopuxin_ap">https://bible.optina.ru/old:ish:28:30#lopuxin_ap</a>（ロシア語）</p></li><li><p><a href="https://ja.wikipedia.org/wiki/ウリムとトンミム">https://ja.wikipedia.org/wiki/ウリムとトンミム</a></p></li></ol>
    body: |-
      <h2>祭司職への選任</h2><h3>祭司はアロンの子孫だけ</h3><p>祭司になれたのは、アロン（預言者モーセの兄）とその子孫だけでした（<a href="https://bibleox.com/ja/jp-ni/ish/28/#L1">出. 28:1</a>; <a href="https://bibleox.com/ja/jp-ni/ish/28/#L4">出. 28:4</a>）。</p><h3>大祭司の職の継承</h3><p>祭司になれたのは、アロン（預言者モーセの兄）とその子孫だけでした（<a href="https://bibleox.com/ja/jp-ni/ish/28/#L1">出. 28:1</a>; <a href="https://bibleox.com/ja/jp-ni/ish/28/#L4">出. 28:4</a>; <a href="https://bibleox.com/ja/jp-ni/ish/29/#L9">出. 29:9</a>）。大祭司の後継者は、七日の間祭服を着せられ、油を注がれました（<a href="https://bibleox.com/ja/jp-ni/ish/29/#L29-30">出. 29:29-30</a>）。職と共に聖なる祭服も受け継がれました（<a href="https://bibleox.com/ja/jp-ni/ish/29/#L29">出. 29:29</a>）。部外者が祭司の務めを行おうとすれば、死刑に処せられました（<a href="https://bibleox.com/ja/jp-ni/chis/3/#L10">民. 3:10</a>）。</p><h3>候補者への要求</h3><p>体に障害があってはなりません（<a href="https://bibleox.com/ja/jp-ni/lev/21/#L17-21">レビ. 21:17-21</a>）：</p><ul><li><p>目の不自由な者、</p></li><li><p>足の不自由な者、</p></li><li><p>鼻に欠陥のある者、手足の不釣り合いの者、</p></li><li><p>手足の折れた者、</p></li><li><p>背中にこぶのある者、</p></li><li><p>目に欠陥のある者、</p></li><li><p>できもの、疥癬のある者、睾丸のつぶれた者。</p></li></ul><h3>祭司への要求</h3><ul><li><p>頭髪をそり上げたり、ひげの両端をそり落としたりしてはならない（<a href="https://bibleox.com/ja/jp-ni/lev/21/#L1,5">レビ. 21:1,5</a>）。</p></li><li><p>離縁された女（<a href="https://bibleox.com/ja/jp-ni/lev/21/#L7">レビ. 21:7</a>）、遊女、身を汚した女（<a href="https://bibleox.com/ja/jp-ni/lev/21/#L7">レビ. 21:7</a>）をめとってはならず、大祭司の妻は処女でなければならない（<a href="https://bibleox.com/ja/jp-ni/lev/21/#L13-14">レビ. 21:13-14</a>）。</p></li><li><p>死者に触れてはならず（<a href="https://bibleox.com/ja/jp-ni/lev/21/#L1-4">レビ. 21:1-4</a>）、大祭司は亡くなった親族にさえ触れてはならない（<a href="https://bibleox.com/ja/jp-ni/lev/21/#L10-11">レビ. 21:10-11</a>）。<em>（レビ. 21:1 の「親族の遺体」は、ヘブライ語原文では「民の中の死者」です。）</em></p></li><li><p>大祭司は頭をあらわにしてはならない（<a href="https://bibleox.com/ja/jp-ni/lev/21/#L10">レビ. 21:10</a>）。</p></li></ul><h2>儀式</h2><h3>概略</h3><p>いけにえをささげること、洗い清め、油注ぎ（<a href="https://bibleox.com/ja/jp-ni/ish/28/#L41">出. 28:41</a>）、動物の血を振りかけること、そして食事によって行われます。聖別には聖なる祭服が必要であり（<a href="https://bibleox.com/ja/jp-ni/ish/28/#L2-3">出. 28:2-3</a>）、それは職と共に受け継がれます（<a href="https://bibleox.com/ja/jp-ni/ish/29/#L29">出. 29:29</a>）。</p><h3>旧約の大祭司の聖別</h3><h4>いけにえ</h4><p>聖別のためには、傷のない動物をいけにえとしてささげなければならず（<a href="https://bibleox.com/ja/jp-ni/ish/29/#L1">出. 29:1</a>）、上等の小麦粉で作った酵母を入れないパンも用います（<a href="https://bibleox.com/ja/jp-ni/ish/29/#L2">出. 29:2</a>）：</p><ul><li><p><strong>若い雄牛一頭</strong>、</p></li><li><p><strong>雄羊二匹</strong>、</p></li><li><p>オリーブ油を混ぜて焼いた、酵母を入れない<strong>輪形のパン</strong>と、オリーブ油を塗った薄焼きパン、</p></li><li><p>上等の小麦粉で作った<strong>酵母を入れないパン</strong>。</p></li></ul><p><em>（出. 29:1 の「雄の小羊二匹」は、ヘブライ語原文では אֵילִם שְׁנַיִם —「<strong>雄羊</strong>二匹」です。）</em></p><p>大祭司と祭司たちは雄牛に手を置き、それから雄牛は臨在の幕屋の入り口で屠られます（<a href="https://bibleox.com/ja/jp-ni/ish/29/#L10-11">出. 29:10-11</a>）（キリストが殺されることの予型）。</p><p>祭壇の角には雄牛の血が塗られ、残りはすべて祭壇の基に流されます（<a href="https://bibleox.com/ja/jp-ni/ish/29/#L12">出. 29:12</a>）（十字架という祭壇の上でのキリストの苦難の予型）。雄牛の内臓（肝臓、腎臓など）は祭壇で燃やされます（<a href="https://bibleox.com/ja/jp-ni/ish/29/#L13">出. 29:13</a>）。雄牛の肉と皮と残りは宿営の外で火で焼かれます。これが贖罪の献げ物です（<a href="https://bibleox.com/ja/jp-ni/ish/29/#L14">出. 29:14</a>）。</p><p>同じように、大祭司と祭司たちは一匹の雄羊の頭に手を置き（<a href="https://bibleox.com/ja/jp-ni/ish/29/#L15">出. 29:15</a>）、それを屠り、その血を祭壇の周りに注ぎかけます（<a href="https://bibleox.com/ja/jp-ni/ish/29/#L16">出. 29:16</a>）。雄羊は各部に分割され、内臓が洗われ、祭壇で燃やされます。これが主にささげる焼き尽くす献げ物です（<a href="https://bibleox.com/ja/jp-ni/ish/29/#L17-18">出. 29:17-18</a>）。</p><p>また、大祭司と祭司たちはもう一匹の雄羊の頭に手を置き（<a href="https://bibleox.com/ja/jp-ni/ish/29/#L19">出. 29:19</a>）、それを屠り（<a href="https://bibleox.com/ja/jp-ni/ish/29/#L20">出. 29:20</a>）、その血をアロンとその子らの右の耳たぶ、右手の親指、右足の親指に付け（<a href="https://bibleox.com/ja/jp-ni/ish/29/#L20">出. 29:20</a>）、それから血を祭壇の周りに注ぎかけました（<a href="https://bibleox.com/ja/jp-ni/ish/29/#L20">出. 29:20</a>）。</p><p>祭壇の上の血と聖別の油を、アロンとその子ら、そして彼らの祭服に振りまきました（<a href="https://bibleox.com/ja/jp-ni/ish/29/#L21">出. 29:21</a>）。こうして彼らは聖なる者となります。</p><p>次に、雄羊の脂肪の部分を取り（<a href="https://bibleox.com/ja/jp-ni/ish/29/#L22">出. 29:22</a>）、酵母を入れないパンの籠から一塊のパン、輪形のパン一個、薄焼きパン一個を取り（<a href="https://bibleox.com/ja/jp-ni/ish/29/#L23">出. 29:23</a>）、それらをアロンとその子らの手に載せ（<a href="https://bibleox.com/ja/jp-ni/ish/29/#L24">出. 29:24</a>）、それから彼らの手から受け取って祭壇で燃やします（<a href="https://bibleox.com/ja/jp-ni/ish/29/#L25">出. 29:25</a>）。雄羊の胸の肉もささげられます（<a href="https://bibleox.com/ja/jp-ni/ish/29/#L26-28">出. 29:26-28</a>）。</p><h4>洗い清め</h4><p>聖別の前に、水による洗い清めが行われます（<a href="https://bibleox.com/ja/jp-ni/ish/29/#L4">出. 29:4</a>）。</p><h4>祭服を着せること</h4><p>洗い清めの後、その人に聖なる祭服が着せられます（<a href="https://bibleox.com/ja/jp-ni/ish/29/#L5-6">出. 29:5-6</a>）。祭司たちにも祭服が着せられます（<a href="https://bibleox.com/ja/jp-ni/ish/29/#L8-9">出. 29:8-9</a>）。</p><h4>頭に油を注ぐこと</h4><p>祭服を着せた後、その人に油が注がれます（<a href="https://bibleox.com/ja/jp-ni/ish/28/#L41">出. 28:41</a>）。油は頭に注ぎかけられます（<a href="https://bibleox.com/ja/jp-ni/ish/29/#L7">出. 29:7</a>）。</p><h4>食事</h4><p>雄羊の肉は聖なる場所で煮られ（<a href="https://bibleox.com/ja/jp-ni/ish/29/#L31">出. 29:31</a>）、それから大祭司と祭司たちは臨在の幕屋の入り口でそれを食べなければなりませんでした（<a href="https://bibleox.com/ja/jp-ni/ish/29/#L32">出. 29:32</a>）。一般の人はこの食事にあずかることができませんでした（<a href="https://bibleox.com/ja/jp-ni/ish/29/#L33">出. 29:33</a>）。肉が翌朝まで残ったなら、焼き捨てなければなりませんでした（<a href="https://bibleox.com/ja/jp-ni/ish/29/#L34">出. 29:34</a>）。</p><h4>七日間の繰り返し</h4><p>いけにえをささげ、聖別するこの儀式全体は、七日間繰り返されました（<a href="https://bibleox.com/ja/jp-ni/ish/29/#L35">出. 29:35</a>; <a href="https://bibleox.com/ja/jp-ni/lev/8/#L33-34">レビ. 8:33-34</a>）。その結果、祭壇は神聖なものとなり、祭壇に触れるものはすべて聖なるものとなります（<a href="https://bibleox.com/ja/jp-ni/ish/29/#L37">出. 29:37</a>）（聖なるものとなったキリストの十字架の予型）。</p><h2>祭服</h2><h3>目的</h3><p>威厳と美しさのため、聖別のため（<a href="https://bibleox.com/ja/jp-ni/ish/28/#L2-3">出. 28:2-3</a>）、そして大祭司の職を継承するため（<a href="https://bibleox.com/ja/jp-ni/ish/29/#L29">出. 29:29</a>）。</p><h3>一そろい</h3><p>大祭司の祭服の一そろいには、次のものが含まれます（<a href="https://bibleox.com/ja/jp-ni/ish/28/#L4">出. 28:4</a>）：</p><ul><li><p><strong>胸当て</strong>、</p></li><li><p><strong>エフォド</strong>（外衣）、</p></li><li><p><strong>上着</strong>、</p></li><li><p>格子縞に織った<strong>長い服</strong>（下衣）、</p></li><li><p><strong>ターバン</strong>（頭の覆い）、</p></li><li><p><strong>飾り帯</strong>。</p></li></ul><h3>エフォド（袖のない外衣）</h3><p>金、さまざまな色の毛糸（青、紫、緋色、すなわち赤）、および亜麻のより糸で作られます（<a href="https://bibleox.com/ja/jp-ni/ish/28/#L5-6">出. 28:5-6</a>）。</p><h4>肩ひも</h4><p>エフォドは一枚物ではなく、背と前の部分から成っているので、肩の上で「肩ひも」によってつながれます（<a href="https://bibleox.com/ja/jp-ni/ish/28/#L7">出. 28:7</a>）。</p><p>二本の肩ひものために二つの飾りが作られました（<a href="https://bibleox.com/ja/jp-ni/ish/28/#L12">出. 28:12</a>）。金の縁取りをした石です（<a href="https://bibleox.com/ja/jp-ni/ish/28/#L13">出. 28:13</a>）。これらの石には、イスラエルの十二部族の名が彫りつけられました（<a href="https://bibleox.com/ja/jp-ni/ish/28/#L9">出. 28:9</a>）。一つの石に六つの名、もう一つの石に六つの名を、生まれた順に彫りました（<a href="https://bibleox.com/ja/jp-ni/ish/28/#L10">出. 28:10</a>）。石は金で縁取りされ、金の鎖で飾られました（<a href="https://bibleox.com/ja/jp-ni/ish/28/#L13-14">出. 28:13-14</a>）。<em>（出. 28:9 の「ラピス・ラズリ」は、ヘブライ語原文では שֹׁהַם で、オニキス（縞めのう）とも訳されます。）</em></p><p>エフォドの縁のどこか、おそらく付け帯の近くに、胸当てを結び付けるための二つの環がありました（<a href="https://bibleox.com/ja/jp-ni/ish/28/#L28">出. 28:28</a>）。</p><h3>付け帯（飾り帯）</h3><p>織った付け帯はエフォドの上に締められ、同じ材料、すなわち青、紫、緋色の毛糸と亜麻のより糸で作られます（<a href="https://bibleox.com/ja/jp-ni/ish/28/#L8">出. 28:8</a>）。飾り帯はつづれ織でした（<a href="https://bibleox.com/ja/jp-ni/ish/28/#L39">出. 28:39</a>）。</p><h3>胸当て</h3><p>二重にした真四角な布です（<a href="https://bibleox.com/ja/jp-ni/ish/28/#L16">出. 28:16</a>）。寸法は約23 × 23 cm（縦横それぞれ一ゼレト）です（<a href="https://bibleox.com/ja/jp-ni/ish/28/#L16">出. 28:16</a>）。ゼレトは、広げた手の親指と小指の間の長さで、約23 cmです。エフォドと同じ材料（金、毛糸、亜麻）で作られます（<a href="https://bibleox.com/ja/jp-ni/ish/28/#L15">出. 28:15</a>）。</p><p>この布には12の宝石が付けられます。それらは一列に3つずつ挙げられています（全部で4列、<a href="https://bibleox.com/ja/jp-ni/ish/28/#L17">出. 28:17</a>。宝石の名は新共同訳による）：</p><ul><li><p>ルビー、トパーズ、エメラルド（<a href="https://bibleox.com/ja/jp-ni/ish/28/#L17">出. 28:17</a>）、</p></li><li><p>ざくろ石、サファイア、ジャスパー（<a href="https://bibleox.com/ja/jp-ni/ish/28/#L18">出. 28:18</a>）、</p></li><li><p>オパール、めのう、紫水晶（<a href="https://bibleox.com/ja/jp-ni/ish/28/#L19">出. 28:19</a>）、</p></li><li><p>藍玉、ラピス・ラズリ、碧玉（<a href="https://bibleox.com/ja/jp-ni/ish/28/#L20">出. 28:20</a>）。</p></li></ul><p>石には、イスラエルの十二部族の名が、一つの石に一つずつ彫りつけられました（<a href="https://bibleox.com/ja/jp-ni/ish/28/#L21">出. 28:21</a>）。</p><p>胸当ては肩ひもに結び付けられました（<a href="https://bibleox.com/ja/jp-ni/ish/28/#L23">出. 28:23</a>）。そのために、胸当ての上の二つの端には金の環があり（<a href="https://bibleox.com/ja/jp-ni/ish/28/#L23">出. 28:23</a>）、そこに純金の（<a href="https://bibleox.com/ja/jp-ni/ish/28/#L22">出. 28:22</a>）鎖が通され（<a href="https://bibleox.com/ja/jp-ni/ish/28/#L24">出. 28:24</a>）、鎖のもう一方の端は肩ひもの前側に結び付けられました（<a href="https://bibleox.com/ja/jp-ni/ish/28/#L22">出. 28:22</a>; <a href="https://bibleox.com/ja/jp-ni/ish/28/#L25">出. 28:25</a>）。</p><p>胸当ての下の二つの端には4つの金の環がありました。二つは内側（エフォドの側）に（<a href="https://bibleox.com/ja/jp-ni/ish/28/#L26">出. 28:26</a>）、二つは外側にありました（<a href="https://bibleox.com/ja/jp-ni/ish/28/#L27">出. 28:27</a>）。これらの環によって、胸当ては青いねじりひもで（<a href="https://bibleox.com/ja/jp-ni/ish/28/#L28">出. 28:28</a>）エフォドの環に結ばれ（<a href="https://bibleox.com/ja/jp-ni/ish/28/#L28">出. 28:28</a>）、付け帯の上にとどまって、エフォドからはずれないようにされました（<a href="https://bibleox.com/ja/jp-ni/ish/28/#L28">出. 28:28</a>）。</p><p>胸当ては、聖所（神殿）に入るたびに着けられました（<a href="https://bibleox.com/ja/jp-ni/ish/28/#L29">出. 28:29</a>）。</p><h4>ウリムとトンミム</h4><p>胸当ての中には（二重にした布でできていたので）、<a href="https://bibleox.com/ru/ru/w/%D0%BA%D0%BE%D0%B2%D1%87%D0%B5%D0%B3_%D0%B7%D0%B0%D0%B2%D0%B5%D1%82%D0%B0">契約の箱</a>の中のように、神秘的な物が入れられました（<a href="https://bibleox.com/ja/jp-ni/lev/8/#L8">レビ. 8:8</a>）。<strong>ウリムとトンミム</strong>[1][2]で、教会スラヴ語訳では<strong>「顕示と真理」</strong>です（<a href="https://bibleox.com/ja/csl-ru/ish/28/#L30">出. 28:30、教会スラヴ語訳</a>）。大祭司はそれらを胸に帯びていなければなりませんでした（<a href="https://bibleox.com/ja/jp-ni/ish/28/#L30">出. 28:30</a>）。</p><h3>上着</h3><p>青一色の布で作られます（<a href="https://bibleox.com/ja/jp-ni/ish/28/#L31">出. 28:31</a>）。上着には頭を通す穴がなければなりません（<a href="https://bibleox.com/ja/jp-ni/ish/28/#L32">出. 28:32</a>）。穴のへりは、破れないように縁取りされます（<a href="https://bibleox.com/ja/jp-ni/ish/28/#L32">出. 28:32</a>）。</p><p>上着の下の裾には、青、紫、緋色の毛糸でざくろの飾りが付けられ（<a href="https://bibleox.com/ja/jp-ni/ish/28/#L33">出. 28:33</a>）、ざくろの間には金の鈴が付けられます（<a href="https://bibleox.com/ja/jp-ni/ish/28/#L33">出. 28:33</a>）。ざくろ、鈴、ざくろ、鈴と、裾の回りに付けます（<a href="https://bibleox.com/ja/jp-ni/ish/28/#L34">出. 28:34</a>）。</p><h3>ターバン（頭の覆い）</h3><p>ターバンは亜麻で作られます（<a href="https://bibleox.com/ja/jp-ni/ish/28/#L39">出. 28:39</a>）。</p><h4>金の額当て</h4><p>ターバンには純金の額当てが付けられ、そこには「主の聖なる者」と彫られていました（<a href="https://bibleox.com/ja/jp-ni/ish/28/#L36">出. 28:36</a>）。<em>（ヘブライ語原文では קֹדֶשׁ לַיהוָה —「主に聖なるもの」です。）</em>額当ては青いねじりひもでターバンの正面に結ばれ（<a href="https://bibleox.com/ja/jp-ni/ish/28/#L37">出. 28:37</a>）、額の位置にあります（<a href="https://bibleox.com/ja/jp-ni/ish/28/#L38">出. 28:38</a>）。</p><h3>長い服</h3><p>長い服は亜麻で作られます（<a href="https://bibleox.com/ja/jp-ni/ish/28/#L39">出. 28:39</a>）。その下には、腰から腿までを覆う亜麻布のズボンを着けます（<a href="https://bibleox.com/ja/jp-ni/ish/28/#L42">出. 28:42</a>）。</p><h2>一般の祭司</h2><p>一般の祭司の祭服については、詳しい記述はありません。祭服は、威厳と美しさのために彼らのために作られます（<a href="https://bibleox.com/ja/jp-ni/ish/28/#L40">出. 28:40</a>）。</p><p>祭司は長い服（<a href="https://bibleox.com/ja/jp-ni/ish/28/#L40">出. 28:40</a>）、飾り帯（<a href="https://bibleox.com/ja/jp-ni/ish/28/#L39">出. 28:39</a>-<a href="https://bibleox.com/ja/jp-ni/ish/28/#L40">40</a>）、ターバン（<a href="https://bibleox.com/ja/jp-ni/ish/28/#L40">出. 28:40</a>）を持たなければなりません。</p><p>これらの祭服は、臨在の幕屋にいるとき、また聖所（神殿）で務めをするときに着るものです（<a href="https://bibleox.com/ja/jp-ni/ish/28/#L43">出. 28:43</a>）。</p><h2>いけにえ</h2><p>毎日、臨在の幕屋の入り口で（<a href="https://bibleox.com/ja/jp-ni/ish/29/#L42">出. 29:42</a>）、<strong>一歳の小羊二匹</strong>をささげなければなりません（<a href="https://bibleox.com/ja/jp-ni/ish/29/#L38">出. 29:38</a>）。朝に一匹、夕暮れに一匹です（<a href="https://bibleox.com/ja/jp-ni/ish/29/#L39">出. 29:39</a>）。<em>（出. 29:38 の「雄羊」は、ヘブライ語原文では כְּבָשִׂים —「<strong>小羊</strong>」です。）</em></p><p>小羊と共に、<strong>小麦粉</strong>、<strong>オリーブ油</strong>、<strong>ぶどう酒</strong>がささげられます（<a href="https://bibleox.com/ja/jp-ni/ish/29/#L40">出. 29:40</a>）。</p><p>いけにえをささげる場所は、神の栄光によって聖別されます（<a href="https://bibleox.com/ja/jp-ni/ish/29/#L43">出. 29:43</a>）。</p>

  - src: фимиам
    path: In20c_香
    title: 香、乳香、香炉
    meta_desc: 香と乳香についての聖書の引用
    menu: { parent: "旧約/礼拝", title: "香", priority: 20 }
    body: |-
      <h2>定義</h2><p><strong>香</strong> — 乳香（樹脂）を燃やした煙、または燃やされる香りのよい調合物。</p><p><strong>乳香</strong>（ロシア語では「リヴァン」または「ラダン」。アラビア語の lādan —「香りのよい樹脂」から）— ある種の木の香りのよい樹脂。ロシア語の「リヴァン」はレバノンと関係があります。乳香を燃やすと心地よい香りが立ちます。聖なる儀式の際や、香りのよい聖なる調合物を作るときに用いられます（<a href="https://bibleox.com/ja/jp-ni/ish/30/#L34-36">出. 30:34-36</a>）。</p><p><strong>香をたくこと</strong> — 乳香を燃やすこと、そこから香の煙が立ち昇ること。</p><p><strong>香炉</strong> — 香りのよい調合物（乳香を含む）を燃やすための器具（器）。</p><h2>聖書の引用</h2><h3>香りのよい調合物（乳香を含む）は神聖なもの</h3><blockquote><p>「主はモーセに言われた。<strong>以下の香料</strong>、すなわち、ナタフ香、シェヘレト香、ヘルベナ香、これらの香料と純粋な<strong>乳香</strong>をそれぞれ同量取り、香を作りなさい。すなわち、香料師の混ぜ合わせ方に従ってよく混ぜ合わせた、純粋な、聖なる香を作る。その一部を細かく砕いて粉末にし、粉末の一部を、臨在の幕屋の中の掟の箱の前に置く。わたしはそこであなたに会う。<strong>これはあなたたちにとって神聖なものである</strong>。同じ割合で作った香を私用に使ってはならない。<strong>あなたは、それを主に対して聖なるものとしなければならない</strong>。また、類似したものを作って、香りを楽しもうとする者は、すべてその民から断たれる」（<a href="https://bibleox.com/ja/jp-ni/ish/30/#L34-38">出. 30:34-38</a>）</p></blockquote><h3>乳香はオリーブ油と共に穀物の献げ物に加えられ、それから祭司が献げ物を燃やす</h3><blockquote><p>「<strong>穀物の献げ物</strong>を主にささげるときは、上等の小麦粉を献げ物としなさい。奉納者がそれにオリーブ油を注ぎ、<strong>更に<mark>乳香</mark>を載せ</strong>、アロンの子らである祭司たちのもとに持って行くと、祭司の一人がその中からオリーブ油のかかった上等の小麦粉一つかみと乳香全部を取り、<strong>しるしとして祭壇で燃やして煙にする</strong>。これが燃やして主にささげる宥めの香りである」（<a href="https://bibleox.com/ja/jp-ni/lev/2/#L1-2">レビ. 2:1-2</a>）</p></blockquote><h3>乳香のない献げ物もある</h3><blockquote><p>「夫は妻を祭司のところへ連れて行く。その際、大麦の粉十分の一エファを、オリーブ油を注がず、<strong>乳香も載せずに</strong>、妻のための<strong>献げ物として携えて行く</strong>。これは嫉妬した場合の献げ物、すなわち罪の判定のための献げ物である」（<a href="https://bibleox.com/ja/jp-ni/chis/5/#L15">民. 5:15</a>）</p></blockquote><h3>香のためだけの祭壇</h3><p>香をたくための祭壇を造ることが別に定められており、その上ではほかのものを燃やしてはなりません。その上で香は、いけにえとは別に、それだけでたかれます。これは毎朝と毎夕、ともし火を整えるときに行われます：</p><blockquote><p>「<strong>アカシヤ材で香をたく祭壇を造りなさい</strong>。&lt;…&gt; それを<strong>掟の箱を隔てる垂れ幕の手前に</strong>置く。この掟の箱の上の贖いの座の前でわたしはあなたと会う。<strong>アロンはその祭壇で香草の香をたく。すなわち、毎朝ともし火を整えるとき</strong>、また夕暮れに、ともし火をともすときに、香をたき、代々にわたって主の御前に香りの献げ物を絶やさぬようにする。あなたたちはその上で規定に反した香や焼き尽くす献げ物、穀物の献げ物、ぶどう酒の献げ物などをささげてはならない」（<a href="https://bibleox.com/ja/jp-ni/ish/30/#L1,6-9">出. 30:1,6-9</a>）</p></blockquote><h3>香は祈りを表す</h3><blockquote><p>「<strong>わたしの祈りを御前に立ち昇る香りとし</strong>高く上げた手を夕べの供え物としてお受けください」（<a href="https://bibleox.com/ja/jp-ni/ps/141/#L2">詩. 141:2</a>）<em>（「香り」は、ヘブライ語原文では קְטֹרֶת —「<strong>香</strong>」です。）</em></p></blockquote><blockquote><p>「巻物を受け取ったとき、四つの生き物と二十四人の長老は、おのおの、竪琴と、<strong>香のいっぱい入った金の鉢とを手に持って</strong>、小羊の前にひれ伏した。<strong>この香は聖なる者たちの祈りである</strong>」（<a href="https://bibleox.com/ja/jp-ni/otkr/5/#L8">黙. 5:8</a>）</p></blockquote><h3>香は神への独立した献げ物である</h3><p>香は単独で言及され、ほかの聖なる儀式と同列に挙げられています（何かへの付け足しとしてではなく、何かと一緒にだけ来るものとしてでもなく）：</p><blockquote><p>「わたしのためにイスラエルの全部族の中からあなたの先祖を<strong>選んで</strong>祭司とし、わたしの祭壇に上って<strong>香をたかせ</strong>、エフォドを着せてわたしの前に立たせた」（<a href="https://bibleox.com/ja/jp-ni/1ts/2/#L28">サム上. 2:28</a>）</p></blockquote><blockquote><p>「<strong>今この時</strong>、わたしたちには支配者も預言者も指導者もなく、焼き尽くす献げ物も、いけにえも、献げ物も、<strong>香も</strong>、あなたの前に初物をささげて憐れみを見いだす場所も<strong>ありません</strong>」（<a href="https://bibleox.com/ja/gr-lxx-byz/dan/3/#L38">ダニ. 3:38、七十人訳</a>。アザルヤの祈り。ギリシア語からの訳：οὐδὲ θυμίαμα）</p></blockquote><blockquote><p>「日の出る所から日の入る所まで、諸国の間でわが名はあがめられ、<strong>至るところでわが名のために香がたかれ</strong>、清い献げ物がささげられている。わが名は諸国の間であがめられているからだ、と万軍の主は言われる」（<a href="https://bibleox.com/ja/jp-ni/mal/1/#L11">マラ. 1:11</a>）</p></blockquote><blockquote><p>「また聖なる祭具類を新しくし、燭台、<strong>香壇</strong>、供えのパンの机を神殿に運び入れ、<strong>香壇には香をたき</strong>、燭台には火をともして神殿内部を照らした」（<a href="https://bibleox.com/ja/jp-ni/1mak/4/#L49-50">１マカ. 4:49-50</a>）</p></blockquote><blockquote><p>「<strong>ヨシヤの業績は、香料造りが丹念に混ぜ合わせた香のようにかぐわしい</strong>。それはだれの口にも蜜のように甘く、酒の席での音楽のようだ」（<a href="https://bibleox.com/ja/jp-ni/prsir/49/#L1">シラ. 49:1</a>）</p></blockquote><blockquote><p>「聖所の前を歩むその姿、主の家の垂れ幕を出て来る姿は、<strong>なんと栄光に満ちていたことか</strong>［大祭司シモン］。&lt;…&gt; <strong>香炉にくべられた乳香</strong>、金を打ち延べ、あらゆる宝石をちりばめた器のようだ」（<a href="https://bibleox.com/ja/jp-ni/prsir/50/#L5,9">シラ. 50:5,9</a>）</p></blockquote><blockquote><p>「わたしの祈りを御前に<strong>立ち昇る香りとし</strong>高く上げた手を夕べの供え物としてお受けください」（<a href="https://bibleox.com/ja/jp-ni/ps/141/#L2">詩. 141:2</a>）</p></blockquote><blockquote><p>「ところが、彼は勢力を増すとともに思い上がって堕落し、自分の神、主に背いた。<strong>彼は主の神殿に入り、香の祭壇の上で香をたこうとした</strong>」（<a href="https://bibleox.com/ja/jp-ni/2par/26/#L16">代下. 26:16</a>）</p></blockquote><blockquote><p>「荒れ野から上って来るおとめは誰か。煙の柱が近づいて来るかのよう。それは隊商のもたらすさまざまな香料<strong>ミルラや乳香をたく煙</strong>」（<a href="https://bibleox.com/ja/jp-ni/pp/3/#L6">雅. 3:6</a>）</p></blockquote><blockquote><p>「あなたは羊をわたしへの焼き尽くす献げ物とせずいけにえをもってわたしを敬おうとしなかった。わたしは穀物の献げ物のためにあなたを苦しめたことはない。<strong>乳香のために重荷を負わせたこともない</strong>」（<a href="https://bibleox.com/ja/jp-ni/is/43/#L23">イザ. 43:23</a>）</p></blockquote><blockquote><p>「また、別の天使が来て、手に金の香炉を持って祭壇のそばに立つと、この天使に<strong>多くの香</strong>が渡された。<strong>すべての聖なる者たちの祈りに添えて、玉座の前にある金の祭壇に献げるため</strong>である」（<a href="https://bibleox.com/ja/jp-ni/otkr/8/#L3">黙. 8:3</a>）</p></blockquote><blockquote><p>「<strong>香の煙は</strong>、天使の手から、<strong>聖なる者たちの祈りと共に</strong>神の御前へ<strong>立ち上った</strong>」（<a href="https://bibleox.com/ja/jp-ni/otkr/8/#L4">黙. 8:4</a>）</p></blockquote><h3>偽りの神々に香がたかれるとき、神は怒られる</h3><blockquote><p>「わたしは、わが民の甚だしい悪に対して裁きを告げる。彼らはわたしを捨て、<strong>他の神々に香をたき</strong>手で造ったものの前にひれ伏した」（<a href="https://bibleox.com/ja/jp-ni/ier/1/#L16">エレ. 1:16</a>）</p></blockquote><blockquote><p>「この民は常にわたしを怒らせ、わたしに逆らう。園でいけにえをささげ、<strong>屋根の上で香をたき</strong>」（<a href="https://bibleox.com/ja/jp-ni/is/65/#L3">イザ. 65:3</a>）<em>（「屋根の上で」は、ヘブライ語原文では עַל־הַלְּבֵנִים —「<strong>れんがの上で</strong>」（れんがの祭壇の上で）です。）</em></p></blockquote><blockquote><p>「彼らの悪も先祖の悪も共に、と主は言われる。<strong>彼らは山の上で香をたき</strong>丘の上でわたしを嘲った」（<a href="https://bibleox.com/ja/jp-ni/is/65/#L7">イザ. 65:7</a>）</p></blockquote><p>聖なる香を自分のために用いることへの死罪：</p><blockquote><p>「同じ割合で作った香を私用に使ってはならない。あなたは、それを主に対して聖なるものとしなければならない。<strong>また、類似したものを作って、香りを楽しもうとする者は、すべてその民から断たれる</strong>」（<a href="https://bibleox.com/ja/jp-ni/ish/30/#L37-38">出. 30:37-38</a>）</p></blockquote>
