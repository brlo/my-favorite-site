pages:
  - src: 4qENaG01_Дар_иных_языков
    path: Tg25s_異言の賜物
    title: 異言の賜物（ほかの国々の言葉を語る賜物）
    meta_desc: 異言の賜物（ほかの国々の言葉を語る賜物）についての聖書の引用
    menu: { parent: "教会/賜物", title: "異言の賜物", priority: 25 }
    references: |-
      <ol><li><p>キリキアのアラトスの『天象譜』、またゼノンの弟子クレアンテス（<a href="https://bible.optina.ru/new:act:17:28">参照</a>、ロシア語）。</p></li><li><p>クレタのエピメニデス（<a href="https://bible.optina.ru/new:tit:01:12">参照</a>、ロシア語）。</p></li></ol>
    body: |-
      <p><em>（訳注：新共同訳は、使徒言行録2章では γλῶσσα（舌、言語）を「ほかの国々の言葉」と訳し、コリントの信徒への手紙一12-14章では同じ語を「異言」と訳しています。しかしギリシア語原文では、どちらも同じ γλῶσσαι —「言葉、言語」です。）</em></p><h2>神はバベルで言葉を混乱させられた</h2><p>バベルの塔の建設は、比喩的には、神なしに自分の力で天に達しようとする試みです。それが言葉の混乱と、互いの言葉が分からなくなることを招きました：</p><blockquote><p>「彼らは、『さあ、<strong><mark>天まで</mark>届く塔のある町を建て</strong>、有名になろう。そして、全地に散らされることのないようにしよう』と言った。主は降って来て、人の子らが建てた、塔のあるこの町を見て、言われた。『<strong>彼らは一つの民で、皆一つの言葉を話している</strong>から、このようなことをし始めたのだ。これでは、彼らが何を企てても、妨げることはできない。我々は降って行って、直ちに<strong><mark>彼らの言葉を混乱させ、互いの言葉が聞き分けられぬようにしてしまおう</mark></strong>。』主は彼らをそこから全地に散らされたので、彼らはこの町の建設をやめた。こういうわけで、この町の名はバベルと呼ばれた。<strong>主がそこで全地の言葉を混乱（バラル）させ</strong>、また、主がそこから彼らを全地に散らされたからである」（<a href="https://bibleox.com/ja/jp-ni/gen/11/#L4-9">創. 11:4-9</a>）</p></blockquote><h2>神は教会において言葉の混乱を克服された</h2><p>教会が形づくられ、聖霊が降った日に、神は使徒たちに外国の言葉を理解する賜物をお与えになります：</p><blockquote><p>「五旬祭の日が来て、一同が一つになって集まっていると、突然、激しい風が吹いて来るような音が天から聞こえ、彼らが座っていた家中に響いた。そして、炎のような舌が分かれ分かれに現れ、一人一人の上にとどまった。すると、<strong>一同は聖霊に満たされ</strong>、“霊”が語らせるままに、<strong><mark>ほかの国々の言葉で話しだした</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/act/2/#L1-4">使. 2:1-4</a>）<em>（ギリシア語原文では λαλεῖν ἑτέραις γλώσσαις —「ほかの言葉（異言）で語る」です。）</em></p></blockquote><h2>異言とは外国の言葉である</h2><p>ほかの土地から来た人々は、ガリラヤの人々（使徒たち）が外国の言葉を話せることに驚きました：</p><blockquote><p>「さて、エルサレムには天下のあらゆる国から帰って来た、信心深いユダヤ人が住んでいたが、この物音に大勢の人が集まって来た。そして、<strong><mark>だれもかれも、自分の故郷の言葉が話されているのを聞いて</mark></strong>、あっけにとられてしまった。人々は驚き怪しんで言った。『<strong>話をしているこの人たちは、皆ガリラヤの人ではないか</strong>。どうしてわたしたちは、めいめいが生まれた故郷の言葉を聞くのだろうか。わたしたちの中には、<strong><mark>パルティア</mark></strong>、<strong><mark>メディア</mark></strong>、<strong><mark>エラム</mark></strong>からの者がおり、また、<strong><mark>メソポタミア</mark></strong>、<strong><mark>ユダヤ</mark></strong>、<strong><mark>カパドキア</mark></strong>、<strong><mark>ポントス</mark></strong>、<strong><mark>アジア</mark></strong>、<strong><mark>フリギア</mark></strong>、<strong><mark>パンフィリア</mark></strong>、<strong><mark>エジプト</mark></strong>、<strong><mark>キレネに接するリビア地方</mark></strong>などに住む者もいる。また、<strong><mark>ローマ</mark></strong>から来て滞在中の者、ユダヤ人もいれば、ユダヤ教への改宗者もおり、<strong><mark>クレタ</mark></strong>、<strong><mark>アラビア</mark></strong>から来た者もいるのに、<strong><u><mark>彼らがわたしたちの言葉で</mark></u></strong>神の偉大な業を<strong><u><mark>語っているのを聞こうとは</mark></u></strong>。』人々は皆驚き、とまどい、『いったい、これはどういうことなのか』と互いに言った」（<a href="https://bibleox.com/ja/jp-ni/act/2/#L5-12">使. 2:5-12</a>）</p></blockquote><h2>すべての人が異言の賜物を持っているのではない</h2><ol><li><p><strong>すべての人が</strong>ほかの言葉を知る賜物を受けるのでは<strong>ありません</strong>。</p></li><li><p>異言の賜物を受ける人々は、<strong>さまざまな</strong>言葉を知ります。</p></li><li><p>異言の賜物を含むすべての賜物は、働きの<strong>益となるために</strong>与えられます。</p></li></ol><blockquote><p>「<strong><mark>賜物にはいろいろありますが</mark></strong>、それをお与えになるのは同じ霊です。<strong>務めにはいろいろありますが</strong>、それをお与えになるのは同じ主です。働きにはいろいろありますが、すべての場合にすべてのことをなさるのは同じ神です。一人一人に“霊”の働きが現れるのは、<strong><mark>全体の益となるため</mark></strong>です。</p><p><strong>ある人には</strong>“霊”によって<strong>知恵の言葉</strong>、</p><p><strong>ある人には</strong>同じ“霊”によって知識の言葉が与えられ、</p><p><strong>ある人には</strong>その同じ“霊”によって信仰、</p><p><strong>ある人には</strong>この唯一の“霊”によって病気をいやす力、</p><p><strong>ある人には</strong>奇跡を行う力、</p><p><strong>ある人には</strong>預言する力、</p><p><strong>ある人には</strong>霊を見分ける力、</p><p><strong><mark>ある人には</mark></strong><strong><u><mark>種々の(!)</mark></u><mark>異言</mark></strong>を語る力、</p><p><strong>ある人には</strong>異言を解釈する力が与えられています」（<a href="https://bibleox.com/ja/jp-ni/1kor/12/#L4-10">１コリ. 12:4-10</a>）</p></blockquote><blockquote><p>「神は、教会の中にいろいろな人をお立てになりました。第一に使徒、第二に預言者、第三に教師、次に奇跡を行う者、その次に病気をいやす賜物を持つ者、援助する者、管理する者、<strong><mark>異言を語る者</mark></strong>などです。<em>（ギリシア語 γένη γλωσσῶν —「<u>種々の</u>言葉」）</em></p><p><strong>皆が</strong>使徒であろうか。</p><p><strong>皆が</strong>預言者であろうか。</p><p><strong>皆が</strong>教師であろうか。</p><p><strong>皆が</strong>奇跡を行う者であろうか。</p><p><strong>皆が</strong>病気をいやす賜物を持っているだろうか。</p><p><strong><mark>皆が異言を語るだろうか。</mark></strong></p><p><strong>皆が</strong>それを解釈するだろうか。</p><p>あなたがたは、もっと大きな賜物を受けるよう熱心に努めなさい。そこで、わたしはあなたがたに最高の道を教えます」（<a href="https://bibleox.com/ja/jp-ni/1kor/12/#L28-31">１コリ. 12:28-31</a>）</p></blockquote><h2>使徒がすべての人に宣べ伝えるには、ギリシア語の知識だけでは足りなかった</h2><p>ローマの千人隊長は、使徒が最も広く用いられていた言葉であるギリシア語さえ知っていることに驚いています。つまり、ギリシア語が広く用いられていた（共通語であった）としても、だれもがそれを理解していたわけではないのです。</p><p>民全体から知られ尊敬されていた律法の教師ガマリエルのもとで学び（<a href="https://bibleox.com/ja/jp-ni/act/22/#L3">使. 22:3</a>）、ファリサイ派で最高法院の議員であり（<a href="https://bibleox.com/ja/jp-ni/act/5/#L34">使. 5:34</a>）、ギリシアの哲学者や著作家を引用する（<a href="https://bibleox.com/ja/jp-ni/act/17/#L28">使. 17:28</a> [1]; <a href="https://bibleox.com/ja/jp-ni/tit/1/#L12">テト. 1:12</a> [2]）高い教養を持った使徒パウロが、ローマの千人隊長にギリシア語で話しかけます。千人隊長は、使徒パウロがギリシア語を知っていることに驚きます：</p><blockquote><p>「千人隊長は近寄ってパウロを捕らえ、二本の鎖で縛るように命じた。そして、パウロが何者であるのか、また、何をしたのかと尋ねた。&lt;…&gt; パウロは兵営の中に連れて行かれそうになったとき、『ひと言お話ししてもよいでしょうか』と千人隊長に言った。すると、千人隊長が尋ねた。『<strong><mark>ギリシア語が話せるのか</mark></strong>』」（<a href="https://bibleox.com/ja/jp-ni/act/21/#L33,37">使. 21:33,37</a>）</p></blockquote><p>ローマの千人隊長は、ユダヤ人がローマ帝国で最も広く用いられていた言葉を知っていることに驚いています。それが驚きとなりうるのは、それが<strong>まれなこと</strong>である場合だけです。このように教養ある人がギリシア語を知っていることさえ驚きであるなら、多くが普通の漁師で、無学な普通の人であったほかの使徒たち（<a href="https://bibleox.com/ja/jp-ni/act/4/#L13">使. 4:13</a>）が生まれつきギリシア語を知っていたなどとは、なおさら言えません。しかし問題は、至る所で宣べ伝えるために宣教者（使徒）が言葉を知らなければならないということだけではありません。聞く人もギリシア語を知っていなければならないのです。</p><p>このように、ギリシア語の知識だけでは足りませんでした。それゆえ、イエス・キリストの生涯、復活、教えの生きた証人である使徒たちには、キリストについてのこの証しを、彼らの信仰と共にすべての国の民に伝えることができるよう、言葉の知識を含む超自然的な賜物が必要だったのです。</p><h2>異言を語る人の言うことがだれにも分からなければ、何の益もない</h2><blockquote><p>「だから兄弟たち、<strong>わたしがあなたがたのところに行って異言を語ったとしても</strong>、啓示か知識か預言か教えかによって語らなければ、<strong><mark>あなたがたに何の役に立つでしょう</mark></strong>。&lt;…&gt; 同じように、あなたがたも異言で語って、明確な言葉を口にしなければ、何を話しているか、どうして分かってもらえましょう。<strong>空に向かって語ることになる</strong>からです。世にはいろいろな種類の<strong>言葉</strong>があり、<strong>どれ一つ意味を持たないものはありません</strong>。だから、もしその言葉の意味が分からないとなれば、話し手にとってわたしは外国人であり、わたしにとってその話し手も外国人であることになります。あなたがたの場合も同じで、霊的な賜物を熱心に求めているのですから、<strong><mark>教会を造り上げるために</mark>、それをますます<mark>豊かに</mark>受けるように求めなさい</strong>。だから、異言を語る者は、それを<strong>解釈できるように</strong>祈りなさい。&lt;…&gt; さもなければ、仮にあなたが霊で賛美の祈りを唱えても、教会に来て間もない人は、どうしてあなたの感謝に『アーメン』と言えるでしょうか。あなたが何を言っているのか、彼には分からないからです。あなたが感謝するのは結構ですが、<strong><mark>そのことで他の人が造り上げられるわけではありません</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/1kor/14/#L6,9-13,16-17">１コリ. 14:6,9-13,16-17</a>）</p></blockquote><h2>解釈する者がいなければ、教会で異言を語ってはならない</h2><blockquote><p>「異言を語る者がいれば、二人かせいぜい三人が順番に語り、一人に解釈させなさい。<strong><mark>解釈する者がいなければ、教会では黙っていて</mark></strong>、自分自身と神に対して語りなさい。&lt;…&gt; 神は無秩序の神ではなく、平和の神だからです。聖なる者たちのすべての教会でそうであるように」（<a href="https://bibleox.com/ja/jp-ni/1kor/14/#L27-28,33">１コリ. 14:27-28,33</a>）</p></blockquote><p>そして、預言者たちの務めは宣教でした：</p><blockquote><p>「<strong>ユダとシラスは預言する者でもあったので、いろいろと話をして兄弟たちを励まし</strong>力づけ」（<a href="https://bibleox.com/ja/jp-ni/act/15/#L32">使. 15:32</a>）</p></blockquote><h2>異言よりも預言（宣教と解釈）の賜物を求めるようにとの呼びかけ</h2><blockquote><p>「愛を追い求めなさい。<strong>霊的な賜物、<mark>特に預言するための賜物を熱心に求めなさい</mark></strong>。異言を語る者は、人に向かってではなく、神に向かって語っています。それはだれにも分かりません。彼は霊によって神秘を語っているのです。しかし、預言する者は、人に向かって語っているので、人を<strong>造り上げ</strong>、<strong>励まし</strong>、<strong>慰めます</strong>。異言を語る者が自分を造り上げるのに対して、<strong><mark>預言する者は教会を造り上げます</mark></strong>。あなたがた皆が異言を語れるにこしたことはないと思いますが、<strong><mark>それ以上に、預言できればと思います</mark></strong>。異言を語る者がそれを解釈するのでなければ、教会を造り上げるためには、<strong><mark>預言する者の方がまさっています</mark></strong>。&lt;…&gt; わたしの兄弟たち、こういうわけですから、<strong><mark>預言することを熱心に求めなさい</mark></strong>。そして、異言を語ることを禁じてはなりません」（<a href="https://bibleox.com/ja/jp-ni/1kor/14/#L1-5,39">１コリ. 14:1-5,39</a>）</p></blockquote><h2>異言はやむ</h2><blockquote><p>「愛は決して滅びない。預言は廃れ、異言は<strong>やみ</strong>、知識は廃れよう」（<a href="https://bibleox.com/ja/jp-ni/1kor/13/#L8">１コリ. 13:8</a>）</p></blockquote><h2>愛は最も大いなる賜物であり、それを求めなければならない</h2><blockquote><p>「<strong>たとえ</strong>、人々の<strong><mark>異言</mark></strong>、天使たちの<strong><mark>異言を語ろうとも</mark></strong>、<strong><mark>愛がなければ</mark></strong>、わたしは騒がしいどら、やかましいシンバル。たとえ、預言する賜物を持ち、あらゆる神秘とあらゆる知識に通じていようとも、たとえ、山を動かすほどの完全な信仰を持っていようとも、愛がなければ、<strong><mark>無に等しい</mark></strong>。&lt;…&gt; それゆえ、信仰と、希望と、愛、この三つは、いつまでも残る。<strong>その中で最も大いなるものは、愛である</strong>」（<a href="https://bibleox.com/ja/jp-ni/1kor/13/#L1-2,13">１コリ. 13:1-2,13</a>）</p></blockquote><h2>使徒たちが与えなかった違った霊</h2><blockquote><p><em>「なぜなら、あなたがたは、だれかがやって来てわたしたちが宣べ伝えたのとは</em><strong><em>異なったイエス</em></strong><em>を宣べ伝えても、あるいは、</em><strong><em>自分たちが受けたことのない<mark>違った霊</mark></em></strong><em>や、受け入れたことのない</em><strong><em>違った福音</em></strong><em>を受けることになっても、よく我慢しているからです」（</em><a href="https://bibleox.com/ja/jp-ni/2kor/11/#L4"><em>２コリ. 11:4</em></a><em>）</em></p></blockquote><h2>今日の宣教者は言葉を学ぶ</h2><p>古代において、使徒たちと最初のキリスト者たちは、まだごく小さかった教会が広く広がり、すべての国の民に宣べ伝えることができるよう、特別な必要から外国の言葉を知る賜物を受けました。しかし今日、宣教者は言葉を学ばなければなりません。つまり労苦しなければならないのです。そして今ではそのためのあらゆる手段があります。欠けているのは、望む心だけかもしれません。</p><p>キリストを信じる人々の団体（カリスマ派やペンテコステ派）の中には、異言とその解釈の賜物を持っていると主張する人々がいますが、彼らが外国に行くと、外国人には彼らの言うことが分かりません。それでそのような宣教者たちは、母国語で話し続けるか、教科書や教師の助けを借りて普通の方法で言葉を学ばなければなりません。</p><p>わたしたちの時代には、この賜物はほとんど見られません。正教会には20世紀の聖人、アトスの克肖者パイシオスがいます。彼は母国語（ギリシア語）以外の言葉を学んだことがなく、異言の賜物を持っていると主張したこともありませんでしたが、外国人が彼のもとを訪れたとき、通訳なしに、あるときはフランス語で、またあるときは英語で彼と語り合うことができました。</p><h2>批判への応答</h2><h3>コリントの信徒への手紙一14章の本文についてのさまざまな問い</h3><p>コリントの信徒への手紙の14章については多くの問いが出されるので、単に章全体を順に見ていくのが理にかなっています。これは<a href="https://bibleox.com/ru/ru/w/K5Ou_%D0%98%D0%BD%D1%8B%D0%B5_%D1%8F%D0%B7%D1%8B%D0%BA%D0%B8_%D0%B4%D1%80%D0%B5%D0%B2%D0%BD%D0%B8%D1%85_%D1%85%D1%80%D0%B8%D1%81%D1%82%D0%B8%D0%B0%D0%BD_%D0%B8_%D0%BF%D0%BE%D0%B7%D0%B4%D0%BD%D0%B5%D0%B9%D1%88%D0%B8%D0%B5_%D1%81%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D1%86%D0%B8%D0%B8">別の記事</a>（ロシア語）で行われています。</p><h3>異言がやむのは来るべき世においてだけなのか</h3><p>正教徒は、ペンテコステ派やカリスマ派の人々に対して、異言はやむ（<a href="https://bibleox.com/ja/jp-ni/1kor/13/#L8">１コリ. 13:8</a>）、すなわちこの賜物は終わるという使徒パウロの言葉を指摘します。もちろん、この賜物が完全に消えるわけではありません。正教においては、外国の言葉を語る賜物を持っていたごく少数の現代の聖人が知られているからです。しかし全体としては、最初のキリスト者たちに見られるような大規模な現象は、もはやないでしょう。</p><p>これに対して新しいプロテスタントのペンテコステ派の人々は、異言がやむのはキリストの来臨の後、来るべき世においてだけだと答えます。彼らのうちのある人々は、この意見の根拠を、「<em>完全なものが来たとき</em>」（<a href="https://bibleox.com/ja/jp-ni/1kor/13/#L10">１コリ. 13:10</a>）についての次の言葉に見ています。</p><p>この本文をより広い文脈の中で見てみましょう：</p><blockquote><p>「<strong>愛は決して滅びない</strong>。<strong><mark>預言</mark>は廃れ、<mark>異言</mark>はやみ</strong>、<strong><mark>知識</mark>は廃れよう、<mark>わたしたちの知識は一部分</mark>、<mark>預言も一部分</mark>だから</strong>。<strong><mark>完全なものが来たときには、部分的なものは廃れよう</mark></strong>。幼子だったとき、わたしは幼子のように話し、幼子のように思い、幼子のように考えていた。成人した今、幼子のことを棄てた。わたしたちは、<strong>今は、鏡におぼろに映ったものを見ている</strong>。だがそのときには、顔と顔とを合わせて見ることになる。<strong><mark>わたしは、今は一部しか知らなくとも</mark></strong>、そのときには、はっきり知られているようにはっきり知ることになる。それゆえ、信仰と、希望と、愛、この三つは、いつまでも残る。その中で最も大いなるものは、愛である」（<a href="https://bibleox.com/ja/jp-ni/1kor/13/#L8-13">１コリ. 13:8-13</a>）</p></blockquote><p>使徒は、「完全なものが来たとき」には「部分的なもの」は廃れると言いました。では部分的なものとは何でしょうか。<strong>知識</strong>です。この文で使徒は、「<strong><em>知識</em></strong><em>は廃れよう</em>」という自分の難しい表現を説明し始めたのです。使徒が今伝えなければならないのは、知識そのものが廃れる（つまり、何も知らなくなる）のではなく、今持っているこの部分的な知識が廃れて、完全な知識が来る、という考えです。まさにこの考えを、使徒はさらに展開しています。</p><ol><li><p>使徒は、今すでに知識は<strong>一部分</strong>あり、ほかの知識は預言によって<strong>一部分</strong>示されると言います。</p></li><li><p>「一部分」ではなく、完全な知識が与えられる時が来ます。</p></li><li><p>今、知識は、おぼろな鏡を通して見るように、ぼんやりと受け取られています。</p></li></ol><p>使徒がここで語っているのは知識のことであって、異言の賜物のことではありません。キリスト者たちは外国の言葉を一部分だけ知っていたのではありません。そうでなければ、ほかの部族や国の民に福音を完全に伝えることはできなかったでしょう。彼らは異言の賜物を完全に持っていました。五旬祭のためにエルサレムに来た人々が驚いたのは、まさに、使徒たちが自分たちの言葉で語るのを聞いたことでした（<a href="https://bibleox.com/ja/jp-ni/act/2/#L5-12">使. 2:5-12</a>）。それは一部分ではありませんでした。一部分であったのは知識であり、知識だけでした。使徒がその先で論じているのも、まさに知識についてなのです。</p><p>では、異言の賜物はいつやむのでしょうか。厳密に言えば、ここには書かれていません。ただ、やむと言われているだけです。そして、彼らから20世紀後に生きているわたしたちは、振り返って、これらの言葉がかなり早く成就したことを見ることができます。宣教が広く広がり、キリスト者が非常に多くなったので、今では異言の賜物がそれほど特別に必要ではなくなったときです。特別に必要なのは愛であって、異言の賜物ではありません。それゆえ、それ以来、言葉は学ばれるようになったのです。</p><p>愛だけは永遠においてもやまないという言葉は、終わるものが永遠において終わるということを示しているのではありません。ほかのものはすべていつでも終わりうるのであって、永遠については、愛はそこでも終わらないと言われているだけです。愛が永遠であり、来るべき世においてもやまないということについては、議論の余地はありえません。</p><p>人々は聖書のこの数行を、ペンテコステ派の人々が理解するように理解していたでしょうか。</p><p>たとえば4世紀の金口イオアンは、異言の賜物がやむことは来るべき世ではなく、この世において語られていると考えていました。</p><p><strong>聖金口イオアン（347頃-407）</strong></p><blockquote><p>さて、あらゆる仕方で愛が非常に大いなるものであることを示した後、使徒は再び、もう一つの最も重要な点から、新たな比較によって愛の尊さを高めて、こう言う。「しかし<strong>預言は廃れ、異言はやむ</strong>」。<strong><mark>もしこの二つが信仰のためにもたらされたのなら、信仰が至る所に蒔かれたときには、これらを用いることは今後は余計なことになる</mark>。しかし互いに愛し合うことはやまず、むしろ、この世においても来るべき世においても、さらに進んでいく</strong>。そしてそのときには今よりもいっそう進むのである。この世には、わたしたちの愛を弱める多くのものがあるからである。富、仕事、体の情欲、魂の乱れ。しかしかの世には、そのようなものは何もない。預言と異言が廃れることは驚くに当たらないとしても、知識が廃れるということは、ある人々を当惑させるかもしれない。使徒はこれも付け加えているからである。「知識は廃れよう」。では何か。わたしたちは無知のうちに生きることになるのか。決してそうではない。むしろそのときこそ、わたしたちの知識は強められるのである。それゆえ使徒は、「そのときには、はっきり知られているようにはっきり知ることになる」とも言った。それゆえ、注意して見れば分かるように、知識が預言や異言と同じように廃れると思わないように、「知識は廃れよう」と言った後、使徒は黙っていないで、それが廃れる仕方をも付け加え、すぐにこう続けている。「わたしたちの知識は一部分、預言も一部分だから。完全なものが来たときには、部分的なものは廃れよう」。したがって、廃れるのは知識ではなく、わたしたちの知識が一部分であるという状態なのである。わたしたちはそれだけでなく、はるかに多くを知るようになるからである。</p></blockquote><p>（<a href="https://bibleox.com/en/en/w/chrysostom-homilies-on-first-corinthians-4/#HH-Homily-XXXIV">「コリントの信徒への第一の手紙講話」第34講話</a>、英語。英訳からの訳）</p><p>ほかの引用：<a href="https://bibleox.com/ru/ru/w/ew9Dk6So_%D0%93%D0%BE%D0%B2%D0%BE%D1%80%D0%B5%D0%BD%D0%B8%D0%B5_%D0%BD%D0%B0_%D1%8F%D0%B7%D1%8B%D0%BA%D0%B0%D1%85">異言についての聖師父の引用</a>（ロシア語）</p><h3>人々の異言と天使たちの異言</h3><p>異言とはほかの国の民の外国語であるという引用を示されると、新しいプロテスタントの人々はそれに同意しますが、それに答えて別の引用を示し、天使の言葉の賜物もあるのだと言います：</p><blockquote><p>「たとえ、<strong>人々の異言、<mark>天使たちの</mark>異言を語ろうとも</strong>、愛がなければ、わたしは騒がしいどら、やかましいシンバル」（<a href="https://bibleox.com/ja/jp-ni/1kor/13/#L1">１コリ. 13:1</a>）</p></blockquote><p>しかしこの意見は誤っています。天使は体を持たない霊だからです。天使には発声器官も、舌も、肺も、声帯もありません。空気の振動を生み出し、捉えることによって交わるために、大気（空気）を必要としないのです。したがって、声帯によって発せられるどんな人間の音も、天使の言葉ではありえません。天使には肉と骨の体がないのと同じように（<a href="https://bibleox.com/ja/jp-ni/lk/24/#L39">ルカ. 24:39</a>）、声帯もないからです。</p><p>では、使徒が天使の言葉について語るとき、何を意味しているのでしょうか。これは単なる修辞であり、一方を極端に強調して、それを他方によって引き下げるためのものです。使徒はただ、愛のない賜物は空しい音にすぎないことを示しているのです。コリントの人々は、ほかの国の民の言葉を話すことがすでに特別なことだと考えていたので、使徒はさらに高く上ることにしました。たとえ天使の言葉で語ることができたとしても、愛がなければ何の益にもならない、と。</p><p>これは使徒の修辞にすぎません。このことについては、聖金口イオアンにも読むことができます。</p><p><strong>聖金口イオアン（347頃-407）</strong></p><blockquote><p>さて、<strong>使徒はここで「天使たちの異言」と言っているが、天使に体を与えているのではない</strong>。その意味はこうである。「たとえ天使たちが互いに語り合うのが常であるように語ったとしても、これ（愛）がなければ、わたしは無であり、むしろ重荷であり迷惑である」。こうして（もう一つの例を挙げれば）、使徒が「天上のもの、地上のもの、地下のものがすべて、イエスの御名にひざまずく」（フィリ 2:10）と言うとき、<strong>天使にひざや骨があると考えてこれらのことを言っているのではない</strong>。決してそうではない。わたしたちの間の習わしによって、彼らの熱烈な礼拝を描き出そうとしているのである。同じようにここでも、使徒が「舌（言葉）」と呼ぶのは、肉の器官のことではなく、わたしたちの間で知られている仕方によって、彼らの互いの交わりを示そうとしているのである。</p></blockquote><p>（<a href="https://bibleox.com/en/en/w/chrysostom-homilies-on-first-corinthians-4/#HH-Homily-XXXII">「コリントの信徒への第一の手紙講話」第32講話</a>、英語。英訳からの訳）</p><p><strong>キロスの福者テオドリトス（386頃-457）</strong></p><blockquote><p><strong>天使たちの言葉とは、感覚で捉えられるものではなく、ある霊的な言葉のことである</strong>。天使たちはそれによって万物の神を賛美し、互いに語り合う。イザヤは天使たちが歌うのを聞き、エゼキエル、またダニエル、ゼカリヤ、ミカは天使たちが語り合うのを聞いた。神的な使徒はこれを<strong>誇張して表現し、愛の優越を示そうとした</strong>のである。</p></blockquote><p>（<a href="https://azbyka.ru/otechnik/Feodorit_Kirskij/tolkovanie_na_pervoe_poslanie_k_korinfinam/13#sel=9:83,9:128">「コリントの信徒への第一の手紙注解」13章</a>、ロシア語。ロシア語からの訳）</p><p>キリスト御自身も同じような修辞、すなわち一方を極端に強調して、それを他方によって引き下げる修辞を用いられました：</p><blockquote><p>「人は、たとえ<strong>全世界を手に入れても、自分の命を失ったら</strong>、何の得があろうか。自分の命を買い戻すのに、どんな代価を支払えようか」（<a href="https://bibleox.com/ja/jp-ni/mf/16/#L26">マタ. 16:26</a>）（<a href="https://bibleox.com/ja/jp-ni/mk/8/#L36">マコ. 8:36</a>）<em>（「命」は、ギリシア語原文では ψυχή —「魂」です。）</em></p></blockquote><p>このように、人が天使の言葉を語る賜物を持つということは問題になりません。人は自分の肉によって交わりますが、天使には肉がないからです。天使の言葉についてのこの言及は、修辞にすぎないのです。</p><h3>元ペンテコステ派牧師の証言</h3><p>ペンテコステ派の共同体の元牧師で、後に正教に改宗したパーヴェルは、短い音声メッセージ（11分）の中で、ペンテコステ派における「異言」についての自分の感覚と経験を語っています。彼はかつての経験を、正教において得た経験と比べています：</p><p>音声ファイル（ロシア語）：<a href="https://disk.yandex.ru/d/hHzrMNPi_lVy2w">https://disk.yandex.ru/d/hHzrMNPi_lVy2w</a></p>

  - src: 7PyK_Христианский_храм
    path: Ct15m_キリスト教の聖堂
    title: キリスト教の聖堂
    menu: { parent: "教会/奉神礼", title: "キリスト教の聖堂", priority: 15 }
    references: |-
      <p>こちらも参照（ロシア語）：<a href="https://bibleox.com/ru/ru/w/%D1%85%D1%80%D0%B0%D0%BC-%D0%BE%D0%B1%D1%80%D0%B0%D0%B7-%D0%BD%D0%B5%D0%B1%D0%B5%D1%81%D0%BD%D0%BE%D0%B9-%D1%80%D0%B5%D0%B0%D0%BB%D1%8C%D0%BD%D0%BE%D1%81%D1%82%D0%B8">聖堂は天の現実の像</a></p>
    body: |-
      <blockquote><p>「すると、ファリサイ派のある人々が、群衆の中からイエスに向かって、『先生、お弟子たちを叱ってください』と言った。イエスはお答えになった。『言っておくが、<strong>もしこの人たちが黙れば、石が叫びだす</strong>』」（<a href="https://bibleox.com/ja/jp-ni/lk/19/#L39-40">ルカ. 19:39-40</a>）</p></blockquote><blockquote><p>「わたしの安息日を守り、<strong>わたしの聖所を敬いなさい</strong>。わたしは主である」（<a href="https://bibleox.com/ja/jp-ni/lev/19/#L30">レビ. 19:30</a>; <a href="https://bibleox.com/ja/jp-ni/lev/26/#L2">レビ. 26:2</a>）</p></blockquote><h2>キリストの地上の生涯の間</h2><p>キリストは、聖体機密のために、用意の整った広い部屋に弟子たちを集められます：</p><blockquote><p>「すると、<strong>席が整って</strong>用意のできた<strong>二階の広間</strong>を見せてくれるから、そこにわたしたちのために準備をしておきなさい」（<a href="https://bibleox.com/ja/jp-ni/mk/14/#L15">マコ. 14:15</a>）</p></blockquote><p>教会が造られた後、キリスト者たちは神殿に集まります：</p><blockquote><p>「そして、<strong><em><mark>毎日</mark></em></strong><em>ひたすら心を一つにして</em><strong><em><mark>神殿に参り</mark></em></strong>」（<a href="https://bibleox.com/ja/jp-ni/act/2/#L46">使. 2:46</a>）</p></blockquote><blockquote><p>「<strong><em><mark>絶えず神殿の境内にいて</mark></em></strong><em>、神をほめたたえていた</em>」（<a href="https://bibleox.com/ja/jp-ni/lk/24/#L53">ルカ. 24:53</a>）</p></blockquote><h2>キリストの昇天の後</h2><p>キリスト者たちは絶えず神殿に通っていました：</p><blockquote><p><em>「絶えず</em><strong><em><mark>神殿の境内に</mark></em></strong><em>いて、神をほめたたえていた」（</em><a href="https://bibleox.com/ja/jp-ni/lk/24/#L53"><em>ルカ. 24:53</em></a><em>）</em></p></blockquote><blockquote><p><em>「そして、毎日ひたすら心を一つにして</em><strong><em><mark>神殿に参り</mark></em></strong><em>、</em><strong><em>家ごとに集まってパンを裂き</em></strong><em>、喜びと真心をもって一緒に食事をし」（</em><a href="https://bibleox.com/ja/jp-ni/act/2/#L46"><em>使. 2:46</em></a><em>）</em></p></blockquote><blockquote><p><em>「ペトロとヨハネが、午後三時の祈りの時に</em><strong><em><mark>神殿に</mark>上って行った</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/act/3/#L1"><em>使. 3:1</em></a><em>）</em></p></blockquote><blockquote><p><em>「さて、わたしはエルサレムに帰って来て、</em><strong><em><mark>神殿で</mark>祈っていたとき</em></strong><em>、我を忘れた状態になり」（</em><a href="https://bibleox.com/ja/jp-ni/act/22/#L17"><em>使. 22:17</em></a><em>）</em></p></blockquote><blockquote><p><em>「確かめていただけば分かることですが、私が</em><strong><em>礼拝のためエルサレムに上ってから</em></strong><em>、まだ十二日しかたっていません。</em><strong><em><mark>神殿でも</mark></em></strong><em>会堂でも町の中でも、この私がだれかと論争したり、群衆を扇動したりするのを、だれも見た者はおりません」（</em><a href="https://bibleox.com/ja/jp-ni/act/24/#L11-12"><em>使. 24:11-12</em></a><em>）</em></p></blockquote><p>キリスト者たちは、自分たちの特別な場所にも集まっていました：</p><blockquote><p><em>「二人は、</em><strong><em>丸一年の間そこの<mark>教会に</mark>一緒にいて</em></strong><em>多くの人を教えた。このアンティオキアで、弟子たちが初めてキリスト者と呼ばれるようになったのである」（</em><a href="https://bibleox.com/ja/jp-ni/act/11/#L26"><em>使. 11:26</em></a><em>）</em></p></blockquote><blockquote><p><em>「まず第一に、あなたがたが</em><strong><em>教会で集まる際</em></strong><em>、お互いの間に仲間割れがあると聞いています。&lt;…&gt; それでは、一緒に集まっても、主の晩餐を食べることにならないのです。なぜなら、食事のとき各自が勝手に自分の分を食べてしまい、空腹の者がいるかと思えば、酔っている者もいるという始末だからです。</em><strong><em>あなたがたには、飲んだり食べたりする家がないのですか</em></strong><em>。それとも、</em><strong><em><mark>神の教会</mark>を見くびり</em></strong><em>、貧しい人々に恥をかかせようというのですか」（</em><a href="https://bibleox.com/ja/jp-ni/1kor/11/#L18-22"><em>１コリ. 11:18-22</em></a><em>）</em></p></blockquote><blockquote><p><em>「婦人たちは、</em><strong><em><mark>教会では</mark></em></strong><em>黙っていなさい。婦人たちには語ることが許されていません。律法も言っているように、婦人たちは従う者でありなさい。何か知りたいことがあったら、</em><strong><em>家で自分の夫に聞きなさい</em></strong><em>。</em><strong><em>婦人にとって<mark>教会の中で</mark>発言するのは、恥ずべきことです</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/1kor/14/#L34-35"><em>１コリ. 14:34-35</em></a><em>）</em></p></blockquote><h2>天の聖所の預言的な描写</h2><p>ヨハネの黙示録における天の聖所の描写</p><p><strong>天の聖所を測れという命令</strong></p><blockquote><p><em>「それから、わたしは杖のような物差しを与えられて、こう告げられた。『立って</em><strong><em><mark>神の神殿</mark>と祭壇とを測り</em></strong><em>、また、そこで礼拝している者たちを数えよ』」（</em><a href="https://bibleox.com/ja/jp-ni/otkr/11/#L1"><em>黙. 11:1</em></a><em>）</em></p></blockquote><p><strong>玉座（宝座）</strong></p><blockquote><p><em>「二十四人の長老は、</em><strong><em><mark>玉座に</mark>着いておられる方</em></strong><em>の前にひれ伏して、世々限りなく生きておられる方を礼拝し、自分たちの冠を玉座の前に投げ出して言った」（</em><a href="https://bibleox.com/ja/jp-ni/otkr/4/#L10"><em>黙. 4:10</em></a><em>）</em></p></blockquote><blockquote><p><em>「神の御前で、座に着いていた二十四人の長老は、ひれ伏して神を礼拝し」（</em><a href="https://bibleox.com/ja/jp-ni/otkr/11/#L16"><em>黙. 11:16</em></a><em>）</em></p></blockquote><p><strong>祭壇</strong></p><blockquote><p><em>「また、別の天使が来て、手に金の香炉を持って</em><strong><em><mark>祭壇</mark></em></strong><em>のそばに立つと、この天使に多くの香が渡された。すべての聖なる者たちの祈りに添えて、</em><strong><em>玉座の前にある</em></strong><em>金の</em><strong><em><mark>祭壇</mark></em></strong><em>に献げるためである」（</em><a href="https://bibleox.com/ja/jp-ni/otkr/8/#L3"><em>黙. 8:3</em></a><em>）</em></p></blockquote><blockquote><p><em>「それから、天使が香炉を取り、それに</em><strong><em><mark>祭壇</mark></em></strong><em>の火を満たして地上へ投げつけると、雷、さまざまな音、稲妻、地震が起こった」（</em><a href="https://bibleox.com/ja/jp-ni/otkr/8/#L5"><em>黙. 8:5</em></a><em>）</em></p></blockquote><blockquote><p><em>「第六の天使がラッパを吹いた。すると、神の御前にある金の</em><strong><em><mark>祭壇</mark></em></strong><em>の四本の角から一つの声が聞こえた」（</em><a href="https://bibleox.com/ja/jp-ni/otkr/9/#L13"><em>黙. 9:13</em></a><em>）</em></p></blockquote><p><strong>七枝の燭台</strong></p><blockquote><p><em>「玉座からは、稲妻、さまざまな音、雷が起こった。また、</em><strong><em>玉座の前には、<mark>七つのともし火</mark>が燃えていた</em></strong><em>。これは神の七つの霊である」（</em><a href="https://bibleox.com/ja/jp-ni/otkr/4/#L5"><em>黙. 4:5</em></a><em>）</em></p></blockquote><p><strong>炉儀（香を焚くこと）</strong></p><blockquote><p><em>「また、別の天使が来て、</em><strong><em>手に金の香炉を持って</em></strong><em>祭壇のそばに立つと、この天使に</em><strong><em>多くの<mark>香</mark>が渡された</em></strong><em>。すべての聖なる者たちの祈りに添えて、玉座の前にある金の祭壇に献げるためである。&lt;…&gt; それから、</em><strong><em>天使が香炉を取り</em></strong><em>、それに祭壇の火を満たして地上へ投げつけると、雷、さまざまな音、稲妻、地震が起こった」（</em><a href="https://bibleox.com/ja/jp-ni/otkr/8/#L3,5"><em>黙. 8:3,5</em></a><em>）</em></p></blockquote><h2>神は聖所を敬うよう命じられた</h2><p>聖堂は<a href="https://bibleox.com/ru/ru/w/%D1%85%D1%80%D0%B0%D0%BC-%D0%BE%D0%B1%D1%80%D0%B0%D0%B7-%D0%BD%D0%B5%D0%B1%D0%B5%D1%81%D0%BD%D0%BE%D0%B9-%D1%80%D0%B5%D0%B0%D0%BB%D1%8C%D0%BD%D0%BE%D1%81%D1%82%D0%B8">天の現実の像</a>です。神はこの像を敬うよう命じられました：</p><blockquote><p>「わたしの安息日を守り、<strong>わたしの聖所を敬いなさい</strong>。わたしは主である」（<a href="https://bibleox.com/ja/jp-ni/lev/19/#L30">レビ. 19:30</a>）</p></blockquote><blockquote><p>「あなたたちはわたしの安息の日を守り、<strong>わたしの聖所を敬いなさい</strong>。わたしは主である」（<a href="https://bibleox.com/ja/jp-ni/lev/26/#L2">レビ. 26:2</a>）</p></blockquote><p>新約の聖堂は、神学者ヨハネの黙示録に描かれた像に従って整えられています。</p><h2>批判への応答</h2><h3>使徒たちが神殿に通ったのは、理解していなかったからなのか</h3><p>使徒たちが信仰の問題において、すべてをよく理解していなかったこともありました。たとえば彼らは、キリストがエルサレムで王になろうとしておられると考え（<a href="https://bibleox.com/ja/jp-ni/mk/10/#L37-39">マコ 10:37-39</a>）、御自分の苦しみと復活についてのキリストの言葉が分からず、怖くて尋ねられませんでした（<a href="https://bibleox.com/ja/jp-ni/mk/9/#L31-32">マコ 9:31-32</a>; <a href="https://bibleox.com/ja/jp-ni/lk/9/#L45">ルカ 9:45</a>）。</p><p>しかしこれはすべて、キリストの復活の日に（<a href="https://bibleox.com/ja/jp-ni/in/20/#L21-23">ヨハ 20:21-23</a>）、また復活から五十日目に（<a href="https://bibleox.com/ja/jp-ni/act/2/#L1-4">使 2:1-4</a>）、聖霊の賜物が彼らに送られるまでのことでした。さらに復活の後、キリストは聖書を悟らせるために彼らの心の目を開かれました（<a href="https://bibleox.com/ja/jp-ni/lk/24/#L45">ルカ 24:45</a>）。すでに復活の前に、キリストは使徒たちに、反論できないような知恵を授けると約束しておられました（<a href="https://bibleox.com/ja/jp-ni/lk/21/#L15">ルカ 21:15</a>）。後に使徒は、神がすべての知恵と理解とを与えて、恵みを自分たちの上にあふれさせてくださったと伝えています（<a href="https://bibleox.com/ja/jp-ni/ef/1/#L8">エフェ 1:8</a>）。使徒パウロは、自分は話し振りは素人（言葉で表現するのが苦手）でも、知識はそうではないと伝えています（<a href="https://bibleox.com/ja/jp-ni/2kor/11/#L6">２コリ 11:6</a>）。</p><p>プロテスタントの人々が、信仰の問題において使徒たちよりも「高い」悟りを持っていることを示したいとき、彼らは使徒たちの上に聖霊が降る前のさまざまな出来事を引き合いに出します。しかしこれは正しくありません。教会が造られ整えられるのはその後であり、そのときには、使徒たちが信仰を誤解するということはもはやないからです。</p><p>このように、聖霊が送られた後、使徒たちは信仰の問題を理解しており、知識に欠けるところはありませんでした。たとえ何らかの誤解があったとしても、主はいなくなられたのではなく、使徒たちを導かれました。たとえば、主は幻によって使徒ペトロに、百人隊長コルネリウス、すなわちユダヤ人でない人に洗礼を授けるべきことを示されました。それは当時の教会の一部の人々には当惑を引き起こしたのですが。</p><h3>神は聖堂においてではなく、霊と真理をもって礼拝されなければならないのか</h3><p>聖書に従うなら、この会話は聖堂についてではなく、礼拝の場所についてです。</p><blockquote><p>「女は言った。『主よ、あなたは預言者だとお見受けします。わたしどもの先祖はこの山で礼拝しましたが、あなたがたは、<strong>礼拝すべき<u>場所</u>はエルサレムにある</strong>と言っています』」（<a href="https://bibleox.com/ja/jp-ni/in/4/#L19-20">ヨハ 4:19-20</a>）</p></blockquote><p>サマリアの女は、その問いによってキリストを枠の中に置こうとします。どこで礼拝すべきか：</p><ul><li><p>ゲリジム山で。</p></li><li><p>エルサレムの神殿で。</p></li></ul><p>しかしキリストは、人々が山でもエルサレムでもなく、霊と真理をもって礼拝する時が来る（そして今がその時である）と言われます：</p><blockquote><p>「イエスは言われた。『婦人よ、わたしを信じなさい。<strong><u>あなたがたが、この山でもエルサレムでもない所で、父を礼拝する時が来る</u></strong>。あなたがたは知らないものを礼拝しているが、わたしたちは知っているものを礼拝している。救いはユダヤ人から来るからだ。しかし、<strong><u>まことの礼拝をする者たちが、霊と真理をもって父を礼拝する時が来る。今がその時である</u></strong>。なぜなら、父はこのように礼拝する者を求めておられるからだ』」（<a href="https://bibleox.com/ja/jp-ni/in/4/#L21-23">ヨハ 4:21-23</a>）</p></blockquote><p>ご覧のとおり、ここでは聖堂についての話はありません。もしだれかがこれは聖堂についてのことだと考えるなら、山で祈ることも禁じるべきでしょう。キリストは山についても語っておられるからです。そうすると、聖堂を禁じる人々は山も禁じることになります。山に住んでいるのか、では祈るな、と。しかしもちろん、これは理にかなっていません。</p><p>また、キリストはこの礼拝の時がすでに来たと言っておられることにも注意すべきです。それにもかかわらず、キリストはエルサレムの神殿に来られ、そこを父の家、祈りの家と呼び、そこでの祈りを何も妨げることがないよう配慮を示しておられます。</p><p>つまり、霊と真理をもって礼拝する時がすでに来たとしても、それは神殿を廃止しませんでした。この家がキリストによって見捨てられたのは、イスラエルの大部分が自分たちの救い主を拒んだ後、キリストがぶどう園を以前の雇われ人（旧約の祭司職）から取り上げ、ほかの人々、すなわち使徒たちにぶどう園を与え、御自分が退けた人々に、お前たちの家は見捨てられて荒れ果てる、つまり神の恵みがそこを去ると言われたときでした：</p><blockquote><p>「見よ、<strong><u>お前たちの家は見捨てられて荒れ果てる</u></strong>」（<a href="https://bibleox.com/ja/jp-ni/mf/23/#L38">マタ. 23:38</a>）</p></blockquote><p>その象徴となったのが、キリストの十字架上の死の後に裂けた岩と、裂けた垂れ幕でした：</p><blockquote><p>「そのとき、<strong><u>神殿の垂れ幕が上から下まで真っ二つに裂け、地震が起こり、岩が裂け</u></strong>」（<a href="https://bibleox.com/ja/jp-ni/mf/27/#L51">マタ. 27:51</a>）</p></blockquote><p>それ以来、キリスト者たちは宇宙のどこででも祈り、至る所で聖体機密において新しいいけにえを献げました。建物の中でも、建物の外でも。</p><h3>なぜ聖堂が必要なのか。垂れ幕が裂けた（マタ 27:51）のだから、神は神殿を去られたのではないか</h3><p>救いのために聖堂（石の建物としての）は必要ではありません。正教会の多くの聖人は荒れ野で救われました。しかし救いのためには機密にあずかることが必要であり、機密は奉神礼において行われ、そのためには自然な理由から建物が必要なのです。とはいえ、必要な場合には、正教会は建物なしでも行います。</p><p>建物がある以上、教会はそれを神にささげられた場所、すなわち聖堂と見なします。この場所で人々は神の名を呼び求め、ここで機密において神の恵みが現れ、ここで聖体機密においてキリスト御自身が臨在されます。それゆえ正教徒は、こうした場所を神が現れる場所として特別に敬います。神御自身が、御自分が現れる場所を敬うよう求めておられ（<a href="https://bibleox.com/ja/jp-ni/ish/3/#L5">出. 3:5</a>）、聖所を敬うことも求めておられるからです（<a href="https://bibleox.com/ja/jp-ni/lev/19/#L30">レビ. 19:30</a>; <a href="https://bibleox.com/ja/jp-ni/lev/26/#L2">レビ. 26:2</a>）。</p><p>旧約の神殿の裂けた垂れ幕は、旧約の教会が廃止されたことを指し示しています。それは、エルサレムの神殿が、旧約の教会（イスラエル）が神と出会う場所として神に見捨てられたことを指し示しているのです。ぶどう園は旧約の教会から取り上げられ（<a href="https://bibleox.com/ja/jp-ni/mf/21/#L43">マタ. 21:43</a>）、契約と祭司職を変えられた（<a href="https://bibleox.com/ja/jp-ni/evr/7/#L12">ヘブ. 7:12</a>）キリストによって造られた新約の教会に与えられました。</p><p>新約の教会は、旧約の教会の見捨てられた神殿を用いず、そこで奉神礼を行わず、神がそこで自分に現れることを期待しません。</p><h3>神殿は一つであり、それは破壊されたのだから、聖堂を建ててはならないのか</h3><p>神殿が破壊されたのは初めてではありませんでした。それはすでに第二の神殿でした。そしてその前には、移動式の神殿である臨在の幕屋があり、イスラエル人はそれを持ってシナイの荒れ野を移動しました。神殿が最初にネブカドネツァルによって破壊されたとき、それは神が神殿での礼拝の可能性を退けられたことを意味したでしょうか。そうでないなら、後にローマ人が再びそれを行ったとき、なぜそうなるべきなのでしょうか。</p><p>キリストを拒んだユダヤ人たちは、エルサレムの神殿においてだけ祈り、神を礼拝することができると考えていました。彼らは初の致命者である首輔祭ステファノを最高法院の裁きに呼び出し、この場所が破壊され、慣習が変えられると教えていると訴えました（<a href="https://bibleox.com/ja/jp-ni/act/6/#L13-14">使 6:13-14</a>）。首輔祭の弁明の演説は、先祖たちの歴史を詳しく語ることによって、彼らが至る所で神に祈り、いけにえを献げていたこと、すなわち彼らがどこにいても神が共におられたことを示すことにありました（<a href="https://bibleox.com/ja/jp-ni/act/7/#L2-53">使 7:2-53</a>）。</p><p>結論として、彼はこの神殿もまた、先祖ダビデの望みと祈りによってソロモンが建てたものであることを指摘します。神は、御自分のために家が建てられる必要はないことを明らかにされたのですが：</p><blockquote><p>「［<strong><u>ダビデ</u></strong>は］神の御心に適い、<strong><u>ヤコブの家のために神の住まいが欲しいと願っていましたが</u></strong>、神のために家を建てたのはソロモンでした。<strong><u>けれども、いと高き方は人の手で造ったようなものにはお住みになりません</u></strong>。これは、預言者も言っているとおりです。『主は言われる。「天はわたしの王座、地はわたしの足台。<strong><u>お前たちは、わたしにどんな家を建ててくれると言うのか。わたしの憩う場所はどこにあるのか</u></strong>」』」（<a href="https://bibleox.com/ja/jp-ni/act/7/#L46-49">使 7:46-49</a>）<em>（「ヤコブの家のために」は一部の写本の読みで、ビザンティン本文（多数派写本）では τῷ θεῷ Ἰακώβ —「ヤコブの神のために」です。）</em></p></blockquote><p>このように、旧い契約が結ばれる前でさえ、義人たちは至る所で祈り、いけにえを献げていました。後に神は、イスラエルのために、一つの神殿と一人の大祭司による中央集権的な礼拝の形を定められました。彼らは地理的に常に近くにいたからです。このような礼拝の形は、神が望まれる一致を確かなものにするためのものでした。</p><p>しかし主が預言に従って（<a href="https://bibleox.com/ja/jp-ni/is/66/#L18-21">イザ 66:18-21</a>）すべての国の民を教会に招かれるとき、主はまた、すべての国の民の間で至る所で奉神礼を行うための条件も造られます。主御自身が大祭司となり（神として至る所に臨在され）、ただ一人の人にではなく多くの使徒たちに恵みを送り、権能をお与えになり（<a href="https://bibleox.com/ja/jp-ni/mf/18/#L18">マタ 18:18</a>）、聖体機密のいけにえをどんな土地にも結びつけず（<a href="https://bibleox.com/ja/jp-ni/lk/22/#L19">ルカ 22:19</a>）、使徒たちを全世界に遣わされるのです（<a href="https://bibleox.com/ja/jp-ni/mk/16/#L15">マコ 16:15</a>）。</p><p>キリスト者の奉神礼は、まさに聖体機密を中心に築かれています。そのために聖堂は必要ではありません。正教徒について、奉神礼を行うには必ず聖堂が必要だと言う人々は、わたしたちが教えていないことをわたしたちについて作り上げているにすぎません。奉神礼は、必要な場合には、どんな場所でも行われます。病院でも、軍隊でも、刑務所でも、船、飛行機、列車での旅の途中でも、森の中でも。</p><p>わたしたちは、救いのために聖堂（石の建物としての）が必要だとは教えていません。正教会の多くの聖人は荒れ野で救われました。しかし救いのためには機密にあずかることが必要であり、機密は奉神礼において行われ、そのためには自然な理由から建物が必要なのです。必要な場合には、正教会は建物なしでも行います。</p><p>建物がある以上、教会はそれを神にささげられた場所、すなわち聖堂と見なします。この場所で人々は神の名を呼び求め、ここで機密において神の恵みが現れ、ここで聖体機密においてキリスト御自身が臨在されます。それゆえ正教徒は、こうした場所を神が現れる場所として特別に敬います。神御自身が、御自分が現れる場所を敬うよう求めておられるからです：</p><blockquote><p>「神が言われた。『ここに近づいてはならない。足から履物を脱ぎなさい。<strong><u>あなたの立っている場所は聖なる土地だから</u></strong>』」（<a href="https://bibleox.com/ja/jp-ni/ish/3/#L5">出. 3:5</a>）</p></blockquote><p>また神は御自分の聖所を敬うことも求めておられます（<a href="https://bibleox.com/ja/jp-ni/lev/19/#L30">レビ. 19:30</a>; <a href="https://bibleox.com/ja/jp-ni/lev/26/#L2">レビ. 26:2</a>）。</p><p>キリストの新約の教会は、エルサレムでだけ、サマリアの山でだけ、あるいは聖堂でだけ礼拝してよいとは教えていません。至る所で神を礼拝し、神に祈ることができるのです。</p><hr><p>正教徒が聖堂を建てるのは、旧い契約に入るためでも、モーセの律法を守るためでもありません。旧い契約は終わり、モーセの律法は廃止されました。</p><p>わたしたちは共同の集まりのための場所を建て、そこで祈り、いけにえを献げます。そのような場所を建てることを禁じた人はだれもいません。</p><p>旧約の神殿は理念として重要です。神は天の現実に倣ってそれを建てるよう命じられました。つまり神殿は、その構想において天のイコンとなるべきものだったのです。</p><p>聖書への必要な指示をすべて含めた詳しい説明（ロシア語）：<a href="https://bibleox.com/ru/ru/w/%D1%85%D1%80%D0%B0%D0%BC-%D0%BE%D0%B1%D1%80%D0%B0%D0%B7-%D0%BD%D0%B5%D0%B1%D0%B5%D1%81%D0%BD%D0%BE%D0%B9-%D1%80%D0%B5%D0%B0%D0%BB%D1%8C%D0%BD%D0%BE%D1%81%D1%82%D0%B8">聖堂は天の現実の像</a></p><p>旧約の時代、神は見えない方であり、天には天使たちだけがいました。</p><p>新約において、キリストなる神は目に見える仕方で天の宝座に着かれ、そこには天使たちのほかに人々も現れます。それゆえ、キリスト者が集まりのための場所を持つようになったとき、彼らはそれを以前と同じ神の構想に従って、聖堂が天を描き出すように整えるのです。</p><p>天が変わったので、聖堂も変わりました。聖堂は今や受肉された神を描き出し、天使たちのほかに、天のほかの住人たち、すなわち義人たちも描かれています。</p><p>神は、プロテスタントの人々がしばしば求めるような空っぽで無意味な場所を造られたことは一度もありません。神は世界そのものを、それを見てその造り主について何かを学ぶように整えられました。つまり世界はわたしたちに宣べ伝えているのです。そして聖堂は、空っぽの白い壁についてではなく、キリストとその天の国について宣べ伝えるように整えられているのです。</p><h3>イコンをたたえる聖堂</h3><p>正教の聖堂は神の名においてだけ建てられます。その中では奉神礼は神に対してだけ行われます。祈りの95%は神に献げられ、残りは神の聖人たち、すなわち天の天使たちと義人たちに献げられます。</p><p>どの聖堂も聖なる記念と結びついています。たとえば、キリストの変容や、キリストの昇天をたたえる聖堂があります。これは、そこで人々が昇天や変容の出来事に祈るということではありません。また、あれこれのイコンが（奇跡的に）与えられたことや、町が敵から救われたことがイコンと結びついていたことを記念する聖堂もあります。これらは聖なる記念です。聖堂が聖なる記念をたたえて名づけられるとき、それはそこで人々がその聖なる記念に祈るということではありません。奉神礼はすべての聖堂で同じなのです。</p>

  - src: чин-порядок-обряд
    path: Or20d_秩序と儀式
    title: 秩序、式、儀式
    menu: { parent: "教会/奉神礼", title: "秩序と儀式", priority: 20 }
    body: |-
      <h2>定義</h2><p><strong>式（儀式）</strong>とは、繰り返されるある行為の定められた順序です。秩序づけられたものは何でも、式と呼ぶことができます。</p><p><strong>奉神礼の式次第</strong>とは、ある奉神礼の内容を順を追って詳しく述べたものです。</p><p>機密もまた、定められた順序、言い換えれば式次第に従って行われます。</p><h2>教会においてはすべてが秩序に従って行われなければならない</h2><blockquote><p>「しかし、すべてを適切に、<strong>秩序正しく</strong>行いなさい」（<a href="https://bibleox.com/ja/jp-ni/1kor/14/#L40">１コリ. 14:40</a>）<em>（ギリシア語 κατὰ τάξιν —「秩序（順序）に従って」）</em></p></blockquote><blockquote><p>「兄弟たち、わたしたちは、わたしたちの主イエス・キリストの名によって命じます。<strong>怠惰な生活をして</strong>、わたしたちから受けた教えに従わないでいるすべての兄弟を避けなさい」（<a href="https://bibleox.com/ja/jp-ni/2sol/3/#L6">２テサ. 3:6</a>）<em>（「怠惰な生活をして」は、ギリシア語原文では ἀτάκτως —「無秩序に、秩序を乱して」です。）</em></p></blockquote><blockquote><p>「ところが、聞くところによると、あなたがたの中には<strong>怠惰な生活をし</strong>、少しも働かず、余計なことをしている者がいるということです」（<a href="https://bibleox.com/ja/jp-ni/2sol/3/#L11">２テサ. 3:11</a>）<em>（ここでもギリシア語原文では ἀτάκτως —「無秩序に」です。）</em></p></blockquote>
