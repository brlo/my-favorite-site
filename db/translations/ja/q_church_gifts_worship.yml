# 「聖書の引用」（ru/q）の日本語訳（jp_q）：「教会／賜物」「教会／奉神礼」
# Загрузка: bin/rails pages:import_translations FILE=db/translations/ja/q_church_gifts_worship.yml [PUBLISH=1] [DRY_RUN=1]
lang: ja
