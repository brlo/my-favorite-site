    body: |-
      <h2>序</h2><p>聖なる義人たちと天使たちは、神々としてではなく、神の友として崇敬されます。それ自体として崇敬されるのではなく、神にあずかっているゆえに、彼らの内に宿る神の恵みのゆえに崇敬されるのです（記事：<a href="https://bibleox.com/ru/ru/w/%D1%87%D0%B5%D0%BB%D0%BE%D0%B2%D0%B5%D0%BA-%D1%85%D1%80%D0%B0%D0%BC-%D0%91%D0%BE%D0%B6%D0%B8%D0%B9">人は神の神殿である</a>）。聖書によれば、誉れは神にだけ帰されるのではありません。人々は神にだけひれ伏すのではありません。神御自身が、神から来る栄光を求めるようわたしたちを招かれました。神は義人たちに栄光を与えると約束し、実際に栄光を与えられました。そして教会は、神に倣って、神の聖なる友たちに栄光を帰しているのです。</p><p>神は聖人たちを通して、その生涯の間にも、またその<strong>遺体</strong>（<a href="https://bibleox.com/ja/jp-ni/4ts/13/#L21">王下. 13:21</a>）、<strong>身の回りの品</strong>（<a href="https://bibleox.com/ja/jp-ni/act/19/#L12">使. 19:12</a>）、<strong>像</strong>（<a href="https://bibleox.com/ja/jp-ni/act/5/#L15-16">使. 5:15-16</a>）を通しても恵みを送られます。それゆえ、これらもすべて崇敬されます。詳しくはそれぞれの記事で：</p><ul><li><p><a href="https://bibleox.com/ru/ru/w/%D0%BF%D0%BE%D1%87%D0%B8%D1%82%D0%B0%D0%BD%D0%B8%D0%B5-%D0%BC%D0%BE%D1%89%D0%B5%D0%B9-%D1%81%D0%B2%D1%8F%D1%82%D1%8B%D1%85">聖人の不朽体（聖遺物）の崇敬</a>。</p></li><li><p><a href="https://bibleox.com/ru/ru/w/%D0%B8%D0%BA%D0%BE%D0%BD%D1%8B-%D0%B8%D0%BA%D0%BE%D0%BD%D0%BE%D0%BF%D0%BE%D1%87%D0%B8%D1%82%D0%B0%D0%BD%D0%B8%D0%B5-%D0%B8%D0%BA%D0%BE%D0%BD%D0%BE%D0%B1%D0%BE%D1%80%D1%87%D0%B5%D1%81%D1%82%D0%B2%D0%BE">聖人のイコンの崇敬</a>。</p></li></ul><h2>誉れは神にだけ帰されるのではない</h2><h3>神への誉れ</h3><blockquote><p>「子は父を、僕は主人を敬うものだ。しかし、わたしが父であるなら<strong><mark>わたしに対する尊敬はどこにあるのか</mark></strong>。わたしが主人であるなら<strong>わたしに対する畏れはどこにあるのか</strong>」（<a href="https://bibleox.com/ja/jp-ni/mal/1/#L6">マラ. 1:6</a>）</p></blockquote><h3>祭司への誉れ</h3><blockquote><p>「主を畏れ、<strong><mark>祭司を尊べ</mark></strong>。規定に従って、祭司にその分け前を納めよ」（<a href="https://bibleox.com/ja/jp-ni/prsir/7/#L31">シラ. 7:31</a>）</p></blockquote><h3>敬虔なキリスト者への誉れ</h3><blockquote><p>「ステファナ、フォルトナト、アカイコが来てくれたので、大変うれしく思っています。この人たちは、あなたがたのいないときに、代わりを務めてくれました。わたしとあなたがたとを元気づけてくれたのです。<strong><mark>このような人たちを重んじてください</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/1kor/16/#L17-18">１コリ. 16:17-18</a>）<em>（ギリシア語 ἐπιγινώσκετε —「認めよ、しかるべく敬え」）</em></p></blockquote><h3>妻への誉れ</h3><blockquote><p>「同じように、夫たちよ、妻を自分よりも弱いものだとわきまえて生活を共にし、命の恵みを共に受け継ぐ者として<strong><mark>尊敬しなさい</mark></strong>。そうすれば、あなたがたの祈りが妨げられることはありません」（<a href="https://bibleox.com/ja/jp-ni/1pet/3/#L7">１ペト. 3:7</a>）</p></blockquote><h3>父と母への誉れ</h3><blockquote><p>「<strong><mark>あなたの父母を敬え</mark></strong>。そうすればあなたは、あなたの神、主が与えられる土地に長く生きることができる」（<a href="https://bibleox.com/ja/jp-ni/ish/20/#L12">出. 20:12</a>）</p></blockquote><h3>老人への誉れ</h3><blockquote><p>「白髪の人の前では起立し、<strong><mark>長老を尊び</mark></strong>、あなたの神を畏れなさい。わたしは主である」（<a href="https://bibleox.com/ja/jp-ni/lev/19/#L32">レビ. 19:32</a>）</p></blockquote><h3>やもめへの誉れ</h3><blockquote><p>「身寄りのないやもめを<strong><mark>大事にしてあげなさい</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/1tim/5/#L3">１テモ. 5:3</a>）<em>（「大事にしてあげなさい」は、ギリシア語原文では τίμα —「敬いなさい」です。）</em></p></blockquote><h3>国家の権力者への誉れ</h3><blockquote><p>「神を畏れ、<strong><mark>皇帝を敬いなさい</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/1pet/2/#L17">１ペト. 2:17</a>）</p></blockquote><blockquote><p>「人は皆、<strong><mark>上に立つ権威</mark></strong>に従うべきです。神に由来しない権威はなく、今ある権威はすべて神によって立てられたものだからです。&lt;…&gt; すべての人々に対して自分の義務を果たしなさい。貢を納めるべき人には貢を納め、税を納めるべき人には税を納め、恐るべき人は恐れ、<strong><mark>敬うべき人は敬いなさい</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/rim/13/#L1,7">ロマ. 13:1,7</a>）</p></blockquote><h3>すべての人への誉れ</h3><blockquote><p>「<strong><mark>すべての人を敬い</mark></strong>、兄弟を愛し、神を畏れ、皇帝を敬いなさい」（<a href="https://bibleox.com/ja/jp-ni/1pet/2/#L17">１ペト. 2:17</a>）</p></blockquote><blockquote><p>「兄弟愛をもって互いに愛し、<strong><mark>尊敬をもって</mark></strong>互いに相手を優れた者と思いなさい」（<a href="https://bibleox.com/ja/jp-ni/rim/12/#L10">ロマ. 12:10</a>）</p></blockquote><h2>聖人たちにひれ伏すこと</h2><p>十戒の第二の戒め（<a href="https://bibleox.com/ja/jp-ni/ish/20/#L4-5">出. 20:4-5</a>; <a href="https://bibleox.com/ja/jp-ni/vtor/5/#L8-9">申. 5:8-9</a>）は、偽りの神々（偶像）を拝むことを禁じています。偽りの神々は本当は神ではなく、その神性は作り事であり、空想であり、偽りです。</p><p>聖人たちは実在しており、神の友であって、神々として拝まれるのではありません。聖人たちにひれ伏すことは、神の友として、神の僕（天使）として、神の母として、彼らへの敬意を表すことです。天使、人、物へのこのようなひれ伏しは聖書の中に見られ、偶像礼拝ではありません。偶像礼拝とは<u>偽りの</u><u>神々</u>を拝むこと、偽りを拝むことだからです。義人たちは、人には人として、天使には天使として、預言者には預言者として、物には物として、絶えずひれ伏しています。これらのどの場合も、彼らは神としてひれ伏しているのではありません。</p><h3>天使たちの姿をとった神にひれ伏す</h3><p>神は現れましたが、三人の天使は、あるがままの神、世界が造られる前からある神ではありません。つまり、これは神の<strong>像</strong>（ギリシア語で εἰκόνα［イコン］）であり、アブラハムは神のイコンの前にひれ伏しているのです。</p><blockquote><p><em>「</em><strong><em>主は［像の姿で］</em></strong><em>マムレの樫の木の所で</em><strong><em>アブラハムに現れた</em></strong><em>（七十人訳ギリシア語 θεὸς —「神」、ヘブライ語 יְהוָ֔ה —「ヤハウェ」）。暑い真昼に、アブラハムは天幕の入り口に座っていた。目を上げて見ると、</em><strong><em>三人の人</em></strong><em>が彼に向かって立っていた。アブラハムはすぐに天幕の入り口から走り出て迎え、</em><strong><em>地にひれ伏して</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/gen/18/#L1-2"><em>創. 18:1-2</em></a><em>）</em></p></blockquote><h3>天使にひれ伏す</h3><blockquote><p><em>「彼は答えた。『いや。わたしは主の軍の将軍である。今、着いたところだ。』ヨシュアは地にひれ伏して</em><strong><em>拝し</em></strong><em>、彼に、『わが主は、この僕に何をお言いつけになるのですか』と言うと」（</em><a href="https://bibleox.com/ja/jp-ni/nav/5/#L14"><em>ヨシュ. 5:14</em></a><em>）</em></p></blockquote><h3>預言者にひれ伏す</h3><blockquote><p><em>「エリコの預言者の仲間たちは目の前で彼を見て、『エリヤの霊がエリシャの上にとどまっている』と言い、彼を迎えに行って、</em><strong><em>その前で地にひれ伏した</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/4ts/2/#L15"><em>王下. 2:15</em></a><em>）</em></p></blockquote><h3>神殿にひれ伏す</h3><blockquote><p><em>「しかしわたしは、深い慈しみをいただいてあなたの家に入り、</em><strong><em>聖なる宮に向かってひれ伏し</em></strong><em>あなたを畏れ敬います」（</em><a href="https://bibleox.com/ja/jp-ni/ps/5/#L8"><em>詩. 5:8</em></a><em>）（七十人訳ギリシア語 προσκυνήσω πρὸς ναὸν ἅγιόν σου —「あなたの聖なる宮に向かってひれ伏します」）</em></p></blockquote><h3>神の足台（神殿）にひれ伏す</h3><blockquote><p><em>「我らの神、主をあがめよ。</em><strong><em>その足台</em></strong><em>（足を載せる台 — 注）</em><strong><em>に向かってひれ伏せ。主は聖なる方</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/ps/99/#L5"><em>詩. 99:5</em></a><em>）（七十人訳ギリシア語 προσκυνεῖτε τῷ ὑποποδίῳ τῶν ποδῶν αὐτοῦ, ὅτι ἅγιός ἐστιν —「その御足の足台にひれ伏せ。それは聖なるものだからである」）</em></p></blockquote><blockquote><p><em>「わたしたちは</em><strong><em>主のいます所に行き御足を置かれる所に向かって伏し拝もう</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/ps/132/#L7"><em>詩. 132:7</em></a><em>）</em></p></blockquote><h3>契約の箱の前にひれ伏す</h3><blockquote><p><em>「ヨシュアは衣服を引き裂き、イスラエルの長老たちと共に、</em><strong><em>主の箱の前で夕方まで地にひれ伏し</em></strong><em>、頭に塵をかぶった」（</em><a href="https://bibleox.com/ja/jp-ni/nav/7/#L6"><em>ヨシュ. 7:6</em></a><em>）</em></p></blockquote><h3>杖にひれ伏す</h3><blockquote><p><em>杖に：「『では、誓ってくれ』と言ったので、ヨセフは誓った。</em><strong><em>イスラエルは、寝台の枕もとで感謝を表した</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/gen/47/#L31"><em>創. 47:31</em></a><em>）。新共同訳の「感謝を表した」は、ヘブライ語原文では וַיִּשְׁתַּחוּ —「ひれ伏した」です。七十人訳では</em><strong><em>杖に</em></strong><em>（ギリシア語 προσεκύνησεν Ισραηλ ἐπὶ τὸ ἄκρον τῆς ῥάβδου αὐτοῦ —「イスラエルは自分の杖の先にひれ伏した」）となっています。</em><a href="https://bibleox.com/ja/jp-ni/evr/11/#L21"><em>ヘブ. 11:21</em></a><em>も参照（新共同訳「杖の先に寄りかかって神を礼拝しました」。ギリシア語原文は προσεκύνησεν ἐπὶ τὸ ἄκρον τῆς ῥάβδου αὐτοῦ —「その杖の先にひれ伏した」で、「寄りかかって」「神を」という語はありません）。</em></p></blockquote><p>さらに多くの例（ロシア語）：<a href="https://bibleox.com/ru/ru/w/%D0%BF%D0%BE%D0%BA%D0%BB%D0%BE%D0%BD%D1%8B">ひれ伏し（伏拝）</a></p><h3>なぜ黙示録で天使は、自分ではなく神を拝むよう命じるのか</h3><p>使徒ヨハネの幻の中では、神が目に見える形ですぐ近くにおられるので、そのような状況で、あたかも天使がそこで最も重要な者であるかのように天使に敬意を示すのは奇妙なことでしょう。この場合、天使は神を拝むよう呼びかけているのです。</p><blockquote><p>「わたしは天使を拝もうとしてその足もとにひれ伏した。すると、天使はわたしにこう言った。<strong>『やめよ。わたしは</strong>、あなたやイエスの証しを守っているあなたの兄弟たちと共に、<strong>仕える者である</strong>。<strong><mark>神を礼拝せよ</mark></strong>。イエスの証しは預言の霊なのだ』」（<a href="https://bibleox.com/ja/jp-ni/otkr/19/#L10">黙. 19:10</a>）</p></blockquote><blockquote><p>「すると、天使はわたしに言った。<strong>『やめよ。わたしは</strong>、あなたや、あなたの兄弟である預言者たちや、この書物の言葉を守っている人たちと共に、<strong>仕える者である</strong>。<strong><mark>神を礼拝せよ</mark></strong>』」（<a href="https://bibleox.com/ja/jp-ni/otkr/22/#L9">黙. 22:9</a>）</p></blockquote><p>別の場合には、天使は預言者ヌンの子ヨシュアのひれ伏しを受け入れています。</p><blockquote><p><em>「彼は答えた。『いや。わたしは主の軍の将軍である。今、着いたところだ。』ヨシュアは地にひれ伏して</em><strong><em>拝し</em></strong><em>、彼に、『わが主は、この僕に何をお言いつけになるのですか』と言うと」（</em><a href="https://bibleox.com/ja/jp-ni/nav/5/#L14"><em>ヨシュ. 5:14</em></a><em>）</em></p></blockquote><h2>聖人たちは誉れの内にある</h2><blockquote><p>「さて、大きな家には金や銀の<strong>器</strong>だけではなく、木や土の器もあります。一方は<strong>貴いことに</strong>、他方は普通のことに用いられます。だから、今述べた諸悪から<strong><mark>自分を清める人は、貴いことに用いられる器になり</mark></strong>、聖なるもの、主人に役立つもの、あらゆる善い業のために備えられたものとなるのです」（<a href="https://bibleox.com/ja/jp-ni/2tim/2/#L20-21">２テモ. 2:20-21</a>）<em>（「貴いこと」は、ギリシア語原文では εἰς τιμήν —「誉れのために」です。）</em></p></blockquote><blockquote><p>「<strong><mark>すべて善を行う者には</mark></strong>、ユダヤ人はもとよりギリシア人にも、<strong><mark>栄光と誉れ</mark>と平和が与えられます</strong>」（<a href="https://bibleox.com/ja/jp-ni/rim/2/#L10">ロマ. 2:10</a>）</p></blockquote><h2>主は義人たちに栄光を与えると約束された</h2><blockquote><p>「<strong>わたしを重んずる者をわたしは<mark>重んじ</mark></strong>、わたしを侮る者をわたしは軽んずる」（<a href="https://bibleox.com/ja/jp-ni/1ts/2/#L30">サム上. 2:30</a>）<em>（七十人訳ギリシア語 τοὺς δοξάζοντάς με δοξάσω —「わたしに栄光を帰す者に、わたしは栄光を与える」）</em></p></blockquote><blockquote><p>「わたしに仕えようとする者は、わたしに従え。そうすれば、わたしのいるところに、わたしに仕える者もいることになる。<strong>わたしに仕える者がいれば、<mark>父はその人を大切にしてくださる</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/in/12/#L26">ヨハ. 12:26</a>）<em>（「大切にしてくださる」は、ギリシア語原文では τιμήσει —「誉れを与える」です。）</em></p></blockquote><blockquote><p>「また、彼らのためだけでなく、彼らの言葉によってわたしを信じる人々のためにも、お願いします。&lt;…&gt; <strong>あなたがくださった<mark>栄光</mark>を、<mark>わたしは彼らに与えました</mark></strong>。わたしたちが一つであるように、彼らも一つになるためです」（<a href="https://bibleox.com/ja/jp-ni/in/17/#L20,22">ヨハ. 17:20,22</a>）</p></blockquote><blockquote><p>「神は前もって知っておられた者たちを、御子の姿に似たものにしようとあらかじめ定められました。&lt;…&gt; 神はあらかじめ定められた者たちを召し出し、召し出した者たちを義とし、<strong>義とされた者たちに<mark>栄光をお与えになった</mark></strong>のです」（<a href="https://bibleox.com/ja/jp-ni/rim/8/#L29-30">ロマ. 8:29-30</a>）</p></blockquote><p>栄光を与えることは、とりわけ、祈りがかなえられることと行いとによってなされます。</p><blockquote><p>「わたしの名によって<strong>願う</strong>ことは、何でも<strong><mark>かなえてあげよう</mark></strong>。<strong><mark>こうして、父は</mark></strong><strong>子</strong>によって<strong><mark>栄光をお受けになる</mark></strong>。わたしの名によってわたしに何かを願うならば、<strong><mark>わたしがかなえてあげよう</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/in/14/#L13-14">ヨハ. 14:13-14</a>）</p></blockquote><p>そして結局、栄光を受けるのは父ですが、子によってです。つまり、子もまた栄光を受けられるのです。</p><h2>神からの栄光を求めること</h2><blockquote><p>「互いに相手からの誉れは受けるのに、<strong><mark>唯一の神からの</mark><mark>誉れ</mark>は求めようとしない</strong>あなたたちには、どうして信じることができようか」（<a href="https://bibleox.com/ja/jp-ni/in/5/#L44">ヨハ. 5:44</a>）<em>（ギリシア語 δόξαν —「栄光」）</em></p></blockquote><blockquote><p>「あなたは、かたくなで心を改めようとせず、<strong><mark>神の</mark></strong>怒りを自分のために蓄えています。この怒りは、神が正しい裁きを行われる怒りの日に現れるでしょう。<strong>神はおのおのの行いに従ってお報いになります</strong>。すなわち、<strong><mark>忍耐強く善を行い、栄光と誉れと</mark>不滅のものを<mark>求める者には</mark>、永遠の命をお与えになり</strong>、反抗心にかられ、真理ではなく不義に従う者には、怒りと憤りをお示しになります」（<a href="https://bibleox.com/ja/jp-ni/rim/2/#L5-8">ロマ. 2:5-8</a>）</p></blockquote><h2>聖人たちの栄光</h2><blockquote><p>「というのは、<strong>多くの子らを<mark>栄光へと導くために</mark></strong>、彼らの救いの創始者を数々の苦しみを通して完全な者とされたのは、万物の目標であり源である方に、ふさわしいことであったからです」（<a href="https://bibleox.com/ja/jp-ni/evr/2/#L10">ヘブ. 2:10</a>）</p></blockquote><blockquote><p>「わたしたちは皆、顔の覆いを除かれて、<strong>鏡のように主の栄光を映し出しながら</strong>、<strong><mark>栄光から栄光へと</mark></strong>、主と同じ姿に<strong><mark>造りかえられていきます</mark></strong>。これは主の霊の働きによることです」（<a href="https://bibleox.com/ja/jp-ni/2kor/3/#L18">２コリ. 3:18</a>）</p></blockquote><blockquote><p>「すべて悪を行う者には、ユダヤ人はもとよりギリシア人にも、苦しみと悩みが下り、<strong><mark>すべて善を行う者には</mark></strong>、ユダヤ人はもとよりギリシア人にも、<strong><mark>栄光</mark>と誉れと平和が与えられます</strong>」（<a href="https://bibleox.com/ja/jp-ni/rim/2/#L9-10">ロマ. 2:9-10</a>）</p></blockquote><blockquote><p>「主は御自分の民の角を高く上げてくださる。それは<strong>主の慈しみに生きるすべての人の<mark>栄誉</mark></strong>。主に近くある民、イスラエルの子らよ。ハレルヤ」（<a href="https://bibleox.com/ja/jp-ni/ps/148/#L14">詩. 148:14</a>）</p></blockquote><h2>教会は義人たちに栄光を帰す</h2><blockquote><p>「<strong>誉れ高き人々をたたえよう</strong>、我々の歴代の先祖たちを。<strong><mark>主は大いなる栄光を現し</mark>、世の初めからその威光を示された</strong>」（<a href="https://bibleox.com/ja/jp-ni/prsir/44/#L1-2">シラ. 44:1-2</a>）</p></blockquote><blockquote><p>「しかし慈悲深い先祖たちの正しい行いは忘れ去られることはなかった。彼らの子らのもとに、良き遺産、孫たちが残る。彼らの子孫は契約を守り、先祖たちに倣ってその子供たちも契約を守る。彼らの子孫はとこしえに続き、<strong><mark>その栄光は消え去ることがない</mark></strong>。<strong>先祖たちのなきがらは安らかに葬られ、その名はいつまでも生き続ける</strong>。<strong>諸国の民はこの先祖たちの知恵を物語り</strong>、<strong><mark>神の民は先祖たちをほめたたえる</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/prsir/44/#L10-15">シラ. 44:10-15</a>）<em>（「神の民は先祖たちをほめたたえる」は、ギリシア語原文では τὸν ἔπαινον ἐξαγγέλλει ἐκκλησία —「教会は彼らの賛美を告げ知らせる」です。）</em></p></blockquote><h2>わたしたちより前の人々の行いと信仰を忘れず、それに倣う必要</h2><blockquote><p>「あなたがたに神の言葉を語った<strong><mark>指導者たちのことを、思い出しなさい</mark></strong>。彼らの生涯の終わりをしっかり見て、<strong><mark>その信仰を見倣いなさい</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/evr/13/#L7">ヘブ. 13:7</a>）</p></blockquote><blockquote><p>「そこで、あなたがたに勧めます。<strong>わたしに<mark>倣う者</mark>になりなさい</strong>」（<a href="https://bibleox.com/ja/jp-ni/1kor/4/#L16">１コリ. 4:16</a>）</p></blockquote><blockquote><p>「兄弟たち、<strong><mark>皆一緒にわたしに倣う者となりなさい</mark>。また、あなたがたと同じように、<mark>わたしたちを模範として歩んでいる人々に目を向けなさい</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/fil/3/#L17">フィリ. 3:17</a>）</p></blockquote><h2>聖人たちの間での生活を慕い求める</h2><blockquote><p>「主に申します。『あなたはわたしの主。あなたのほかにわたしの幸いはありません。』<strong>この地の聖なる人々わたしの愛する尊い人々に申します</strong>」（<a href="https://bibleox.com/ja/jp-ni/ps/16/#L2-3">詩. 16:2-3</a>）<em>（3節のヘブライ語本文は「地にいる聖なる人々、彼らこそ尊い人々、わたしの喜びはすべて彼らにある」とも読むことができ、七十人訳もそのような意味に訳しています。）</em></p></blockquote><h2>黙示録の獣は聖人たちを冒瀆する</h2><h3>獣は天に住む者たちを冒瀆する</h3><blockquote><p><em>「そこで、獣は口を開いて神を冒瀆し、神の名と神の幕屋、</em><strong><em><mark>天に住む者たちを冒瀆した</mark></em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/otkr/13/#L6"><em>黙. 13:6</em></a><em>）</em></p></blockquote><h3>天には義人たちの魂と天使たちが住んでいる</h3><blockquote><p><em>「しかし、</em><strong><em><mark>あなたがたが近づいたのは</mark></em></strong><em>、シオンの山、生ける神の都、</em><strong><em><mark>天のエルサレム</mark>、無数の<mark>天使たち</mark>の祝いの集まり</em></strong><em>、</em><strong><em>天に登録されている長子たちの集会</em></strong><em>、すべての人の審判者である神、</em><strong><em><mark>完全なものとされた正しい人たちの霊</mark></em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/evr/12/#L22-23"><em>ヘブ. 12:22-23</em></a><em>）</em></p></blockquote><h2>反論への応答</h2><h3>教会はどうしてだれが聖人であるかを知るのか。人間が神に代わって決めているのではないか</h3><p>答えは「<a href="https://bibleox.com/ru/ru/w/%D0%BC%D0%BE%D0%BB%D0%B8%D1%82%D0%B2%D1%8B-%D1%81%D0%B2%D1%8F%D1%82%D1%8B%D0%BC">聖人への祈り</a>」の項を参照してください。</p><h3>神は御自分の栄光をだれにも与えない</h3><blockquote><p>「わたしは主、これがわたしの名。<strong>わたしは栄光をほかの神に渡さず</strong>わたしの栄誉を<strong>偶像</strong>に与えることはしない」（<a href="https://bibleox.com/ja/jp-ni/is/42/#L8">イザ. 42:8</a>）</p></blockquote><p>ここで語られているのは偶像、すなわち偽りの神々のことです。神御自身が人々に栄光を与えることを示す引用は、上に数多く挙げました。</p><h2>関連する引用</h2><ol><li><p><a href="https://bibleox.com/ru/ru/w/%D0%BF%D0%BE%D1%87%D0%B8%D1%82%D0%B0%D0%BD%D0%B8%D0%B5-%D0%BC%D0%BE%D1%89%D0%B5%D0%B9-%D1%81%D0%B2%D1%8F%D1%82%D1%8B%D1%85">聖人の不朽体（聖遺物）の崇敬</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/%D0%B8%D0%BA%D0%BE%D0%BD%D1%8B-%D0%B8%D0%BA%D0%BE%D0%BD%D0%BE%D0%BF%D0%BE%D1%87%D0%B8%D1%82%D0%B0%D0%BD%D0%B8%D0%B5-%D0%B8%D0%BA%D0%BE%D0%BD%D0%BE%D0%B1%D0%BE%D1%80%D1%87%D0%B5%D1%81%D1%82%D0%B2%D0%BE">イコンとその崇敬、聖像破壊</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/%D0%BC%D0%BE%D0%BB%D0%B8%D1%82%D0%B2%D1%8B-%D1%81%D0%B2%D1%8F%D1%82%D1%8B%D0%BC">聖人への祈り</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/%D1%87%D0%B5%D0%BB%D0%BE%D0%B2%D0%B5%D0%BA-%D1%85%D1%80%D0%B0%D0%BC-%D0%91%D0%BE%D0%B6%D0%B8%D0%B9">人は神の神殿である</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/%D1%81%D0%BE%D1%81%D1%82%D0%B0%D0%B2-%D1%87%D0%B5%D0%BB%D0%BE%D0%B2%D0%B5%D0%BA%D0%B0">人間の構成</a></p></li></ol>

  - src: молитвы-святым
    path: Ps5r_聖人への祈り
    title: 聖人への祈り
    menu: { parent: "教会/聖人", title: "聖人への祈り", priority: 6 }
    references: |-
      <ol><li><p>神品致命者カルタゴのキプリアヌス（200年頃〜258年）：「<em>心を合わせ、思いを一つにして、互いを覚えよう。</em><strong><em>双方で、いつも互いのために祈ろう</em></strong><em>。互いの愛によって重荷と苦しみを和らげよう。</em><strong><em>もしわたしたちのうちのだれかが、神の速やかな恵みによって先にこの世を去るなら、わたしたちの愛が主の御前で続き、兄弟姉妹のためのわたしたちの祈りが</em></strong><em>父の憐れみの御前で</em><strong><em>やむことのないように</em></strong>」（<a href="https://bibleox.com/en/en/w/cyprian-the-epistles-of-cyprian-2/">流刑中のコルネリウスへの、その信仰告白についての手紙</a>、英語。英訳からの訳）</p></li><li><p>別に述べておくべきことは、不朽体が朽ちないことは、義人を聖人に列するための必要なしるしではないということです。多くの聖人の遺体は朽ちますが、ある義人たちの聖なる遺体が塵にならないばかりか、香りさえ放つことがあり、それは神の奇跡と見なされます。たとえば、スヴィリの克肖者アレクサンドルは16世紀に永眠しましたが、その不朽体は朽ちておらず、彼の名を冠した修道院に安置されています。この問題は本質的なものではありません。遺体が保存されていることそれ自体は、人の聖性を語るものではないからです。それは奇跡それ自体と同様であり、奇跡の報告はさまざまな宗教共同体から届きますが、その性質や源はさまざまであり、単なる欺きや堕落した力の働きであることさえあります。遺体が保存される理由が、埋葬場所の温度や湿度に関係するまったく自然なものであったり、人々の聖性とは関係のない神の摂理の神秘的な働きであったりすることもあります。否定的な例として、<a href="https://azbyka.ru/otechnik/sekty/opyt-sistematicheskago-posobija-pri-polemike-s-staroobrjadtsami-s-kratkim-ocherkom-razvitija-drevnih-sekt-i-russkogo-raskolostaroobrjadchestva/7_6">19世紀の事例</a>（ロシア語）を挙げることができます。そのとき古儀式派は、その地方でよく知られていた三人のイスラム教徒のチェルケス人の遺体を聖人の不朽体と認め（そばには野ウサギと犬の同じような遺体もありました）、その後、信者を欺いたという非難に対して自己弁護をしたのです。</p></li></ol>
    body: |-
      <h2>正教会の理解</h2><p>正教会は、主イエス・キリストが唯一の仲介者であると教えています。しかし、どのような仲介者でしょうか。すべての人のために御自身を<u>贖い</u>として献げられた方です（<a href="https://bibleox.com/ja/jp-ni/1tim/2/#L5-6">１テモ. 2:5-6</a>）。ほかの聖なる人々や天使たちは、だれ一人として贖い主ではありません。しかし、多くの者が祈りにおける共なる執り成し手なのです。</p><blockquote><p>「神は、これほど大きな死の危険からわたしたちを救ってくださったし、また救ってくださることでしょう。<strong>これからも救ってくださるにちがいないと、わたしたちは神に希望をかけています。あなたがたも祈りで援助してください。そうすれば、多くの人のお陰でわたしたちに与えられた恵みについて、多くの人々がわたしたちのために感謝をささげてくれるようになるのです</strong>」（<a href="https://bibleox.com/ja/jp-ni/2kor/1/#L10-11">２コリ. 1:10-11</a>）</p></blockquote><p>神の聖なる義なる友たち、すなわち神の母、天使たち、預言者たち、使徒たち、致命者たち、そのほかの聖人たちもそのような者です。使徒がここで祈りを求められたように、あちらでも祈りを求められるのです。だれもが自分のためだけに神に祈らなければならないという考えは、聖書には無縁のものです。むしろ聖書では、教会全体が互いのために祈り合うよう繰り返し呼びかけられています（<a href="https://bibleox.com/ja/jp-ni/iak/5/#L16">ヤコ. 5:16</a>）[1]。だれもが、偉大な義人や神に選ばれた者でさえ、神への祈りをやめることなく、信じる者たちに自分のために祈ってほしいと願い、自ら信じる者たちのために絶えず祈り、この秩序が将来も守られるよう命じました。これを言い換えれば、互いのための執り成しです。</p><p>わたしたちは教会から知り、聖書によって確かめていますが、義人たちは体から離れると神と共にある命へと移り、神に祈りをささげ続けます。それゆえ、人々がこれらの義人に、地上で体のうちに生きている間に祈りを求めたのとまったく同じように、わたしたちも、彼らが体から離れ、キリストと共にある天での明らかな命へと移った後に、彼らに祈りを求めるのです（<a href="https://bibleox.com/ja/jp-ni/evr/12/#L22-23">ヘブ. 12:22-23</a>）。彼らはより悪い状態にではなく、よりよい状態に移ったからです（<a href="https://bibleox.com/ja/jp-ni/fil/1/#L23">フィリ. 1:23</a>）。わたしたちは、愛は決して滅びないと信じています（<a href="https://bibleox.com/ja/jp-ni/1kor/13/#L8">１コリ. 13:8</a>）。それゆえ、地上で戦っている教会と天で凱旋している教会とから成る教会全体は、一つの教会であり、全体として一つであり、交わり合い、互いのために共に祈り、愛に動かされてそのすべての成員に配慮を示しているのです。わたしたちは、わたしたちの守護天使が神と交わっており（<a href="https://bibleox.com/ja/jp-ni/mf/18/#L10">マタ. 18:10</a>）、救いを受け継ぐ者たちに仕えるために遣わされていること（<a href="https://bibleox.com/ja/jp-ni/evr/1/#L14">ヘブ. 1:14</a>）、そして聖なる義人たちも、神の光の中にとどまりながら、地上で起こっていることを知り、教会のために神に祈りをささげていること（<a href="https://bibleox.com/ja/jp-ni/otkr/6/#L9-11">黙. 6:9-11</a>）を信じ、教会から知り、聖書によって示しています。そして永遠の愛が、天においても地においても、キリストの一つの体の中で、すべての者を互いの交わりと配慮へと動かしているのです。</p><h2>天使たちの祈り</h2><h3>人には守護天使がいる</h3><blockquote><p>「これらの小さな者を一人でも軽んじないように気をつけなさい。言っておくが、<strong>彼らの天使たち</strong>は天でいつもわたしの天の父の御顔を仰いでいるのである」（<a href="https://bibleox.com/ja/jp-ni/mf/18/#L10">マタ. 18:10</a>）</p></blockquote><h3>天使たちは、救われる者たちに配慮するために遣わされている</h3><blockquote><p>「天使たちは皆、奉仕する霊であって、<strong>救いを受け継ぐことになっている人々に仕えるために、遣わされた</strong>のではなかったですか」（<a href="https://bibleox.com/ja/jp-ni/evr/1/#L13-14">ヘブ. 1:13-14</a>）</p></blockquote><h3>天の天使たちは、人の悔い改めを喜ぶ</h3><blockquote><p>「言っておくが、このように、<strong>悔い改める一人の罪人については</strong>、悔い改める必要のない九十九人の正しい人についてよりも<strong>大きな喜びが天にある</strong>。&lt;…&gt; 言っておくが、このように、<strong>一人の罪人が悔い改めれば、神の天使たちの間に喜びがある</strong>」（<a href="https://bibleox.com/ja/jp-ni/lk/15/#L7,10">ルカ. 15:7,10</a>）</p></blockquote><h3>天使は人々のために神の前で執り成す</h3><p>天使は、ユダの町々の住民のために憐れみを願います。</p><blockquote><p>「それに答えて、主の御使いは言った。<strong>『万軍の主よ、いつまでエルサレムとユダの町々を憐れんでくださらないのですか</strong>。あなたの怒りは七十年も続いています。』わたしに語りかけた御使いに、主は優しい言葉、慰めの言葉をもって答えられた」（<a href="https://bibleox.com/ja/jp-ni/zah/1/#L12-13">ゼカ. 1:12-13</a>）</p></blockquote><h3>天使たちとの交わり</h3><blockquote><p>「夜が明けるころ、<strong>御使いたちはロトをせきたてて言った</strong>。『さあ早く、あなたの妻とここにいる二人の娘を連れて行きなさい。さもないと、この町に下る罰の巻き添えになって滅ぼされてしまう』」（<a href="https://bibleox.com/ja/jp-ni/gen/19/#L15">創. 19:15</a>）</p></blockquote><blockquote><p>「さて、主の御使いが来て、オフラにあるテレビンの木の下に座った。これはアビエゼルの人ヨアシュのものであった。その子ギデオンは、ミディアン人に奪われるのを免れるため、酒ぶねの中で小麦を打っていた。<strong>主の御使いは彼に現れて言った</strong>。『勇者よ、主はあなたと共におられます。』<strong>ギデオンは彼に言った</strong>。『わたしの主よ、お願いします。主なる神がわたしたちと共においでになるのでしたら、なぜこのようなことがわたしたちにふりかかったのですか。先祖が、「主は、我々をエジプトから導き上られたではないか」と言って語り伝えた、驚くべき御業はすべてどうなってしまったのですか。今、主はわたしたちを見放し、ミディアン人の手に渡してしまわれました』」（<a href="https://bibleox.com/ja/jp-ni/sud/6/#L11-13">士. 6:11-13</a>）</p></blockquote><blockquote><p>「その名をマノアという一人の男がいた。彼はダンの氏族に属し、ツォルアの出身であった。彼の妻は不妊の女で、子を産んだことがなかった。<strong>主の御使いが彼女に現れて言った</strong>。『あなたは不妊の女で、子を産んだことがない。だが、身ごもって男の子を産むであろう』」（<a href="https://bibleox.com/ja/jp-ni/sud/13/#L2-3">士. 13:2-3</a>）</p></blockquote><blockquote><p>「すると、<strong>天使が天から現れて、イエスを力づけた</strong>」（<a href="https://bibleox.com/ja/jp-ni/lk/22/#L43">ルカ. 22:43</a>）</p></blockquote><blockquote><p>「ユダヤの王ヘロデの時代、アビヤ組の祭司にザカリアという人がいた。&lt;…&gt; すると、<strong>主の天使が現れ</strong>、香壇の右に立った。&lt;…&gt; <strong>天使は言った</strong>。『恐れることはない。ザカリア、あなたの願いは聞き入れられた。あなたの妻エリサベトは男の子を産む。その子をヨハネと名付けなさい。』&lt;…&gt; そこで、<strong>ザカリアは天使に言った</strong>。『何によって、わたしはそれを知ることができるのでしょうか。わたしは老人ですし、妻も年をとっています。』<strong>天使は答えた</strong>。『わたしはガブリエル、神の前に立つ者。あなたに話しかけて、この喜ばしい知らせを伝えるために遣わされたのである』」（<a href="https://bibleox.com/ja/jp-ni/lk/1/#L5,11,13,18-19">ルカ. 1:5,11,13,18-19</a>）</p></blockquote><blockquote><p>「六か月目に、<strong>天使ガブリエルは</strong>、ナザレというガリラヤの町に神から<strong>遣わされた</strong>。ダビデ家のヨセフという人のいいなずけである<strong>おとめのところに</strong>遣わされたのである。そのおとめの名はマリアといった。<strong>天使は、彼女のところに来て言った</strong>。『おめでとう、恵まれた方。主があなたと共におられる。』&lt;…&gt; すると、<strong>天使は言った</strong>。『マリア、恐れることはない。あなたは神から恵みをいただいた。あなたは身ごもって男の子を産むが、その子をイエスと名付けなさい。』&lt;…&gt; <strong>マリアは天使に言った</strong>。『どうして、そのようなことがありえましょうか。わたしは男の人を知りませんのに。』<strong>天使は答えた</strong>。『聖霊があなたに降り、いと高き方の力があなたを包む。だから、生まれる子は聖なる者、神の子と呼ばれる』」（<a href="https://bibleox.com/ja/jp-ni/lk/1/#L26-28,30-31,34-35">ルカ. 1:26-28,30-31,34-35</a>）</p></blockquote><blockquote><p>「その夜、パウロは幻を見た。その中で一人のマケドニア人が立って、『マケドニア州に渡って来て、わたしたちを助けてください』<strong>と言って</strong>パウロに願った」（<a href="https://bibleox.com/ja/jp-ni/act/16/#L9">使. 16:9</a>）</p></blockquote><blockquote><p>「すると、<strong>主の天使がそばに立ち</strong>、光が牢の中を照らした。<strong>天使はペトロのわき腹をつついて起こし</strong>、『急いで起き上がりなさい』<strong>と言った</strong>。すると、鎖が彼の手から外れ落ちた。<strong>天使が</strong>、『帯を締め、履物を履きなさい』<strong>と言ったので</strong>、ペトロはそのとおりにした。また天使は、『上着を着て、ついて来なさい』と言った」（<a href="https://bibleox.com/ja/jp-ni/act/12/#L7-8">使. 12:7-8</a>）</p></blockquote><blockquote><p>「イエス・キリストの黙示。この黙示は、すぐにも起こるはずのことを、神がその僕たちに示すためキリストにお与えになり、そして、<strong>キリストがその天使を送って僕ヨハネにお伝えになった</strong>ものである」（<a href="https://bibleox.com/ja/jp-ni/otkr/1/#L1">黙. 1:1</a>）</p></blockquote><h2>永眠した者たちの祈り</h2><p>預言者バルクは、永眠した義人たちの祈りを聞いてくださるよう神に願います。</p><blockquote><p>「イスラエルの神、全能の主よ、わたしたちは困難と悩みの中であなたに向かって叫びます。主よ、お聞きください。憐れんでください。<strong>わたしたちはあなたに対して罪を犯しました</strong>。あなたは永遠に王座に座する方であり、わたしたちは滅びを免れない者です。<strong>イスラエルの神、全能の主よ、死んだイスラエルの人々</strong><em>（ギリシア語 τῶν τεθνηκότων Ισραηλ —「死んだイスラエルの」）</em><strong>、すなわちあなたに対して罪を犯した者たちの子孫の祈りを、今聞いてください</strong>。先祖たちが神なる主の声に聞き従わなかったので、災いがわたしたちに付きまとっているのです」（<a href="https://bibleox.com/ja/jp-ni/var/3/#L1-4">バル. 3:1-4</a>）</p></blockquote><p>永眠した、族長ヤコブの妻ラケルは、バビロン捕囚の中での自分の息子たちの死と苦しみを嘆きます。そして主は彼女に答え、彼女を慰め、彼らを解放すると約束され、そのとおりになりました。</p><blockquote><p>「主はこう言われる。ラマで声が聞こえる苦悩に満ちて嘆き、泣く声が。<strong>ラケルが息子たちのゆえに泣いている。彼女は慰めを拒む息子たちはもういないのだから</strong>。<strong>主はこう言われる。泣きやむがよい。目から涙をぬぐいなさい。あなたの苦しみは報いられる、と主は言われる</strong>。息子たちは敵の国から帰って来る。あなたの未来には希望がある、と主は言われる。息子たちは自分の国に帰って来る」（<a href="https://bibleox.com/ja/jp-ni/ier/31/#L15-17">エレ. 31:15-17</a>）</p></blockquote><p>この引用は比喩的に理解することも、文字どおりに理解することもできます。</p><h2>義人の祈り</h2><h3>正しい人の祈りは神にいっそう喜ばれる</h3><blockquote><p>「主は逆らう者のいけにえをいとい<strong>正しい人の祈りを喜び迎えられる</strong>」（<a href="https://bibleox.com/ja/jp-ni/pr/15/#L8">箴. 15:8</a>）</p></blockquote><blockquote><p>「主は逆らう者に遠くいますが<strong>従う者の祈りを聞いてくださる</strong>」（<a href="https://bibleox.com/ja/jp-ni/pr/15/#L29">箴. 15:29</a>）</p></blockquote><blockquote><p>「だから、主にいやしていただくために、罪を告白し合い、互いのために祈りなさい。<strong>正しい人の祈りは、大きな力があり、効果をもたらします</strong>」（<a href="https://bibleox.com/ja/jp-ni/iak/5/#L16">ヤコ. 5:16</a>）</p></blockquote><h3>神は、罪の赦しのために正しい人が祈ることを求められる</h3><h4>ヨブ</h4><blockquote><p>「しかし今、雄牛と雄羊を七頭ずつわたしの僕ヨブのところに引いて行き、自分のためにいけにえをささげれば、<strong>わたしの僕ヨブはお前たちのために祈ってくれるであろう。わたしはそれを受け入れる</strong>。お前たちはわたしの僕ヨブのようにわたしについて正しく語らなかったのだが、お前たちに罰を与えないことにしよう」（<a href="https://bibleox.com/ja/jp-ni/iov/42/#L8">ヨブ. 42:8</a>）</p></blockquote><blockquote><p>「神は夢の中でアビメレクに言われた。『わたしも、あなたが全くやましい考えでなしにこの事をしたことは知っている。だからわたしも、あなたがわたしに対して罪を犯すことのないように、彼女に触れさせなかったのだ。直ちに、あの人の妻を返しなさい。<strong>彼は預言者だから、あなたのために祈り、命を救ってくれるだろう。しかし、もし返さなければ、あなたもあなたの家来も皆、必ず死ぬことを覚悟せねばならない</strong>』」（<a href="https://bibleox.com/ja/jp-ni/gen/20/#L6-7">創. 20:6-7</a>）</p></blockquote><h4>預言者モーセ</h4><p>預言者モーセは、神と民全体との間の仲介者でした。</p><blockquote><p>「わたしの言うことを聞きなさい。助言をしよう。神があなたと共におられるように。<strong>あなたが民に代わって神の前に立って</strong>事件について神に述べ」（<a href="https://bibleox.com/ja/jp-ni/ish/18/#L19">出. 18:19</a>）</p></blockquote><p>モーセの願いのおかげで、神は民の罪を赦されました。</p><blockquote><p>「『どうか、あなたの大きな慈しみのゆえに、また、エジプトからここに至るまで、この民を赦してこられたように、この民の罪を赦してください。』主は言われた。<strong>『あなたの言葉のゆえに、わたしは赦そう</strong>』」（<a href="https://bibleox.com/ja/jp-ni/chis/14/#L19-20">民. 14:19-20</a>）</p></blockquote><p>しかし別の時には、神は、モーセの言葉によってさえ赦さないと示されます。</p><blockquote><p>「主はわたしに言われた。<strong>『たとえモーセとサムエルが執り成そうとしても、わたしはこの民を顧みない</strong>。わたしの前から彼らを追い出しなさい』」（<a href="https://bibleox.com/ja/jp-ni/ier/15/#L1">エレ. 15:1</a>）</p></blockquote><p>モーセは、神が決定を変えてくださるよう懇願しました。</p><blockquote><p>「『今は、わたしを引き止めるな。<strong>わたしの怒りは彼らに対して燃え上がっている。わたしは彼らを滅ぼし尽くし</strong>、あなたを大いなる民とする。』<strong>モーセは主なる神をなだめて言った</strong>。『主よ、どうして御自分の民に向かって怒りを燃やされるのですか。あなたが大いなる御力と強い御手をもってエジプトの国から導き出された民ではありませんか。どうしてエジプト人に、「あの神は、悪意をもって彼らを山で殺し、地上から滅ぼし尽くすために導き出した」と言わせてよいでしょうか。どうか、燃える怒りをやめ、<strong>御自分の民にくだす災いを思い直してください</strong>。どうか、あなたの僕であるアブラハム、イサク、イスラエルを思い起こしてください。あなたは彼らに自ら誓って、「わたしはあなたたちの子孫を天の星のように増やし、わたしが与えると約束したこの土地をことごとくあなたたちの子孫に授け、永久にそれを継がせる」と言われたではありませんか。』<strong>主は御自身の民にくだす、と告げられた災いを思い直された</strong>」（<a href="https://bibleox.com/ja/jp-ni/ish/32/#L10-14">出. 32:10-14</a>）</p></blockquote><p>それから、彼は再び民のために執り成しに行きました。</p><blockquote><p>「翌日になって、モーセは民に言った。<strong>『お前たちは大きな罪を犯した。今、わたしは主のもとに上って行く。あるいは、お前たちの罪のために贖いができるかもしれない』</strong>」（<a href="https://bibleox.com/ja/jp-ni/ish/32/#L30">出. 32:30</a>）</p></blockquote><p>そして再び、神の決定を変えました。</p><blockquote><p>「主は人がその友と語るように、顔と顔を合わせてモーセに語られた。モーセは宿営に戻ったが、彼の従者である若者、ヌンの子ヨシュアは幕屋から離れなかった。モーセは主に言った。『あなたはわたしに、「この民を率いて上れ」と言われました。しかし、わたしと共に遣わされる者をお示しになりません。あなたは、また、「わたしはあなたを名指しで選んだ。わたしはあなたに好意を示す」と言われました。』&lt;…&gt; <strong>モーセは主に言った。『もし、あなた御自身が行ってくださらないのなら、わたしたちをここから上らせないでください。』</strong>&lt;…&gt; 主はモーセに言われた。<strong>『わたしは、あなたのこの願いもかなえよう。わたしはあなたに好意を示し</strong>、あなたを名指しで選んだからである』」（<a href="https://bibleox.com/ja/jp-ni/ish/33/#L11-12,15,17">出. 33:11-12,15,17</a>）</p></blockquote><h4>神の人</h4><blockquote><p>「王が神の人に、『どうか、あなたの神、主をなだめ、手が元に戻るように<strong>わたしのために祈ってください</strong>』と言ったので、<strong>神の人が主をなだめると</strong>、王の手は元に戻って、前のようになった」（<a href="https://bibleox.com/ja/jp-ni/3ts/13/#L6">王上. 13:6</a>）</p></blockquote><h2>ほかの人々のための神品の祈り</h2><p>司祭たちがほかの人のために祈ることによって（ここに仲介があります）、罪が赦されることがあります。</p><blockquote><p>「<strong>あなたがたの中で病気の人は、教会の長老を招いて</strong>、主の名によってオリーブ油を塗り、<strong>祈ってもらいなさい</strong>。信仰に基づく祈りは、病人を救い、主がその人を起き上がらせてくださいます。<strong>その人が罪を犯したのであれば、主が赦してくださいます</strong>。だから、主にいやしていただくために、罪を告白し合い、互いのために祈りなさい。正しい人の祈りは、大きな力があり、効果をもたらします」（<a href="https://bibleox.com/ja/jp-ni/iak/5/#L14-16">ヤコ. 5:14-16</a>）</p></blockquote><h2>教会の成員の互いのための祈り</h2><p>神への個人的な祈りだけで十分でしょうか。</p><h3>使徒たちは自分のための祈りを必要としている</h3><blockquote><p>「同時に<strong>わたしたちのためにも祈ってください</strong>」（<a href="https://bibleox.com/ja/jp-ni/kol/4/#L3">コロ. 4:3</a>）</p></blockquote><blockquote><p>「兄弟たち、<strong>わたしたちのためにも祈ってください</strong>」（<a href="https://bibleox.com/ja/jp-ni/1sol/5/#L25">１テサ. 5:25</a>）</p></blockquote><blockquote><p>「終わりに、兄弟たち、<strong>わたしたちのために祈ってください</strong>」（<a href="https://bibleox.com/ja/jp-ni/2sol/3/#L1">２テサ. 3:1</a>）</p></blockquote><blockquote><p>「<strong>わたしたちのために祈ってください</strong>」（<a href="https://bibleox.com/ja/jp-ni/evr/13/#L18">ヘブ. 13:18</a>）</p></blockquote><blockquote><p>「兄弟たち、&lt;…&gt; お願いします。どうか、<strong>わたしのために、わたしと一緒に神に熱心に祈ってください</strong>」（<a href="https://bibleox.com/ja/jp-ni/rim/15/#L30">ロマ. 15:30</a>）</p></blockquote><blockquote><p>「これからも救ってくださるにちがいないと、わたしたちは神に希望をかけています。<strong>あなたがたも祈りで援助してください</strong>。そうすれば、<strong>多くの人のお陰で</strong>わたしたちに与えられた恵みについて、多くの人々がわたしたちのために感謝をささげてくれるようになるのです」（<a href="https://bibleox.com/ja/jp-ni/2kor/1/#L10-11">２コリ. 1:10-11</a>）</p></blockquote><blockquote><p>「というのは、<strong>あなたがたの祈りと</strong>、イエス・キリストの霊の助けとによって、<strong>このことがわたしの救いになると</strong>知っているからです」（<a href="https://bibleox.com/ja/jp-ni/fil/1/#L19">フィリ. 1:19</a>）</p></blockquote><blockquote><p>「<strong>あなたがたの祈りによって</strong>、そちらに行かせていただけるように希望しているからです」（<a href="https://bibleox.com/ja/jp-ni/fm/1/#L22">フィレ. 1:22</a>）</p></blockquote><h3>使徒たちは絶えずキリスト者のために祈っている</h3><blockquote><p>「<strong>祈りの度に、あなたがたのことを思い起こし</strong>、絶えず感謝しています」（<a href="https://bibleox.com/ja/jp-ni/ef/1/#L16">エフェ. 1:16</a>）</p></blockquote><blockquote><p>「<strong>あなたがた一同のために祈る度に</strong>、いつも喜びをもって祈っています」（<a href="https://bibleox.com/ja/jp-ni/fil/1/#L4">フィリ. 1:4</a>）</p></blockquote><blockquote><p>「わたしたちは、<strong>祈りの度に、あなたがたのことを思い起こして</strong>、あなたがた一同のことをいつも神に感謝しています」（<a href="https://bibleox.com/ja/jp-ni/1sol/1/#L2">１テサ. 1:2</a>）</p></blockquote><blockquote><p>「エパフラスが &lt;…&gt; <strong>いつもあなたがたのために熱心に祈っています</strong>」（<a href="https://bibleox.com/ja/jp-ni/kol/4/#L12">コロ. 4:12</a>）</p></blockquote><blockquote><p>「わたしは、<strong>昼も夜も祈りの中で絶えずあなたを思い起こし</strong>」（<a href="https://bibleox.com/ja/jp-ni/2tim/1/#L3">２テモ. 1:3</a>）</p></blockquote><blockquote><p>「わたしは、<strong>祈りの度に、あなたのことを思い起こして</strong>、いつもわたしの神に感謝しています」（<a href="https://bibleox.com/ja/jp-ni/fm/1/#L4">フィレ. 1:4</a>）</p></blockquote><h3>使徒たちは、キリスト者が互いのために祈るよう呼びかけた</h3><blockquote><p>「<strong>互いのために祈りなさい</strong>」（<a href="https://bibleox.com/ja/jp-ni/iak/5/#L16">ヤコ. 5:16</a>）</p></blockquote><blockquote><p>「どのような時にも、“霊”に助けられて祈り、願い求め、<strong>すべての聖なる者たちのために</strong>、絶えず目を覚まして根気よく<strong>祈り続けなさい</strong>」（<a href="https://bibleox.com/ja/jp-ni/ef/6/#L18">エフェ. 6:18</a>）</p></blockquote><blockquote><p>「そこで、まず第一に勧めます。願いと<strong>祈り</strong>と執り成しと感謝とを<strong>すべての人々のためにささげなさい</strong>」（<a href="https://bibleox.com/ja/jp-ni/1tim/2/#L1">１テモ. 2:1</a>）</p></blockquote><h2>教会全体は、交わり合い配慮し合う、キリストのただ一つの体である</h2><h3>教会はキリストの体である</h3><blockquote><p><em>「</em><strong><em>あなたがたはキリストの体であり</em></strong><em>、また、一人一人はその部分です」（</em><a href="https://bibleox.com/ja/jp-ni/1kor/12/#L27"><em>１コリ. 12:27</em></a><em>）</em></p></blockquote><blockquote><p><em>「あなたがたは、</em><strong><em>自分の体がキリストの体の一部だ</em></strong><em>とは知らないのか」（</em><a href="https://bibleox.com/ja/jp-ni/1kor/6/#L15"><em>１コリ. 6:15</em></a><em>）</em></p></blockquote><h3>教会の成員は神にあずかる者となる</h3><blockquote><p>「主イエスは、御自分の持つ神の力によって、命と信心とにかかわるすべてのものを、わたしたちに与えてくださいました。それは、わたしたちを御自身の栄光と力ある業とで召し出してくださった方を認識させることによるのです。この栄光と力ある業とによって、わたしたちは尊くすばらしい約束を与えられています。それは、あなたがたがこれらによって、情欲に染まったこの世の退廃を免れ、<strong>神の本性にあずからせていただくようになるためです</strong>」（<a href="https://bibleox.com/ja/jp-ni/2pet/1/#L3-4">２ペト. 1:3-4</a>）</p></blockquote><h3>体のすべての部分は互いに配慮し合う</h3><blockquote><p>「それで、体に分裂が起こらず、各部分が互いに配慮し合っています。<strong>一つの部分が苦しめば、すべての部分が共に苦しみ</strong>、<strong>一つの部分が尊ばれれば、すべての部分が共に喜ぶ</strong>のです」（<a href="https://bibleox.com/ja/jp-ni/1kor/12/#L25-26">１コリ. 12:25-26</a>）</p></blockquote><h3>使徒たちはいつも教会のために祈っている</h3><blockquote><p>「こういうわけで、そのことを聞いたときから、わたしたちは、<strong><u>絶えず</u>あなたがたのために祈り、願っています</strong>。どうか、“霊”によるあらゆる知恵と理解によって、神の御心を十分悟り」（<a href="https://bibleox.com/ja/jp-ni/kol/1/#L9">コロ. 1:9</a>）</p></blockquote><h2>地上の教会と天上の教会の一致</h2><h3>わたしたちはすでに天上の教会に近づいている</h3><p>将来、復活の後にではなく、すでに今です。</p><blockquote><p>「しかし、<strong>あなたがたが近づいたのは（！）</strong>、シオンの山、生ける神の都、天のエルサレム、無数の天使たちの祝いの集まり、天に登録されている長子たちの集会、すべての人の審判者である神、<strong>完全なものとされた正しい人たちの霊</strong>、新しい契約の仲介者イエス、そして、アベルの血よりも立派に語る注がれた血です」（<a href="https://bibleox.com/ja/jp-ni/evr/12/#L22-24">ヘブ. 12:22-24</a>）<em>（「近づいた」は、ギリシア語原文では προσεληλύθατε —「すでに近づいて来ている」という完了形です。）</em></p></blockquote><h3>分裂はなく、すべての者が互いに配慮し、互いの思いを分かち合っている</h3><blockquote><p>「だから、多くの部分があっても、一つの体なのです。&lt;…&gt; 見栄えのよい部分には、そうする必要はありません。神は、見劣りのする部分をいっそう引き立たせて、体を組み立てられました。<strong>それで、体に分裂が起こらず、各部分が互いに配慮し合っています</strong>。一つの部分が苦しめば、<strong>すべての部分が</strong>共に苦しみ、一つの部分が尊ばれれば、<strong>すべての部分が</strong>共に喜ぶのです」（<a href="https://bibleox.com/ja/jp-ni/1kor/12/#L20,24-26">１コリ. 12:20,24-26</a>）</p></blockquote><blockquote><p>「言っておくが、このように、<strong>悔い改める一人の罪人については</strong>、悔い改める必要のない九十九人の正しい人についてよりも<strong>大きな喜びが天にある</strong>。&lt;…&gt; 言っておくが、このように、<strong>一人の罪人が悔い改めれば、神の天使たちの間に喜びがある</strong>」（<a href="https://bibleox.com/ja/jp-ni/lk/15/#L7,10">ルカ. 15:7,10</a>）</p></blockquote><h3>天にあるものと地にあるものは、キリストにおいて一つにされている</h3><blockquote><p><em>「わたしたちの主イエス・キリストの父である神は、ほめたたえられますように。神は、わたしたちをキリストにおいて、天のあらゆる霊的な祝福で満たしてくださいました。&lt;…&gt; 秘められた計画をわたしたちに知らせてくださいました。これは、前もってキリストにおいてお決めになった神の御心によるものです。こうして、</em><strong><em>時が満ちるに及んで</em></strong><em>、救いの業が完成され、</em><strong><em>あらゆるものが、頭であるキリストのもとに一つにまとめられます。<u>天にあるものも地にあるものも</u>キリストのもとに一つにまとめられるのです</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/ef/1/#L3,9-10"><em>エフェ. 1:3,9-10</em></a><em>）</em></p></blockquote><blockquote><p><em>「こういうわけで、わたしは御父の前にひざまずいて祈ります。御父から、</em><strong><em>天と地にあるすべての家族</em></strong><em>がその名を与えられています」（</em><a href="https://bibleox.com/ja/jp-ni/ef/3/#L14-15"><em>エフェ. 3:14-15</em></a><em>）</em></p></blockquote><blockquote><p><em>「また、御子はその体である教会の頭です。御子は初めの者、死者の中から最初に生まれた方です。こうして、すべてのことにおいて第一の者となられたのです。神は、御心のままに、</em><strong><em>満ちあふれるものを余すところなく御子の内に宿らせ</em></strong><em>、その十字架の血によって平和を打ち立て、</em><strong><em>地にあるものであれ、天にあるものであれ、万物をただ御子によって、御自分と和解させられました</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/kol/1/#L18-20"><em>コロ. 1:18-20</em></a><em>）</em></p></blockquote><blockquote><p><em>「</em><strong><em>キリストが</em></strong><em>死に、そして生きたのは、</em><strong><em>死んだ人にも生きている人にも主となられるためです</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/rim/14/#L9"><em>ロマ. 14:9</em></a><em>）</em></p></blockquote><p>こちらも参照：<a href="https://bibleox.com/ja/ja/w/71cW_教会/">教会：地上の教会と天上の教会の一致、キリストのただ一つの体</a></p><h2>聖人たちは天で神に祈っている</h2><h3>聖なる者たちの祈りは神に喜ばれる</h3><blockquote><p>「巻物を受け取ったとき、四つの生き物と二十四人の長老は、おのおの、竪琴と、<strong>香のいっぱい入った金の鉢</strong>とを手に持って、小羊の前にひれ伏した。<strong>この香は聖なる者たちの祈りである</strong>」（<a href="https://bibleox.com/ja/jp-ni/otkr/5/#L8">黙. 5:8</a>）</p></blockquote><blockquote><p>「また、別の天使が来て、手に金の香炉を持って祭壇のそばに立つと、この天使に多くの香が渡された。<strong>すべての聖なる者たちの祈りに添えて</strong>、玉座の前にある金の祭壇に献げるためである」（<a href="https://bibleox.com/ja/jp-ni/otkr/8/#L3">黙. 8:3</a>）</p></blockquote><blockquote><p>「その後、わたしは、<strong>大群衆の大声のようなものが、天でこう言うのを聞いた。『ハレルヤ。救いと栄光と力とは、わたしたちの神のもの』</strong>」（<a href="https://bibleox.com/ja/jp-ni/otkr/19/#L1">黙. 19:1</a>）</p></blockquote><p>彼らは、地上で起こっていることを知っています。</p><blockquote><p>「小羊が第五の封印を開いたとき、<strong>神の言葉と自分たちがたてた証しのために殺された人々の魂</strong>を、わたしは祭壇の下に見た。彼らは大声でこう叫んだ。<strong>『真実で聖なる主よ、いつまで裁きを行わず、地に住む者にわたしたちの血の復讐をなさらないのですか。』</strong>すると、その一人一人に、白い衣が与えられ、また、自分たちと同じように殺されようとしている兄弟であり、仲間の僕である者たちの数が満ちるまで、なお、しばらく静かに待つようにと告げられた」（<a href="https://bibleox.com/ja/jp-ni/otkr/6/#L9-11">黙. 6:9-11</a>）</p></blockquote><h3>聖人たちはより悪い状態にではなく、よりよい状態に移る</h3><blockquote><p>「この二つのことの間で、板挟みの状態です。一方では、<strong>この世を去って、キリストと共にいたいと熱望しており、<mark>この方がはるかに望ましい</mark></strong>。だが他方では、肉にとどまる方が、あなたがたのためにもっと必要です」（<a href="https://bibleox.com/ja/jp-ni/fil/1/#L23-24">フィリ. 1:23-24</a>）</p></blockquote><h3>体から離れた後も、聖人たちは交わる能力を失わない</h3><p>タボル山での救い主の変容の時、使徒たちは、すでに死んでいた預言者モーセが現れ、キリストがこれから受けられる十字架の苦しみについてキリストと語り合っているのを見ます。つまり、預言者は死んだのですが（<a href="https://bibleox.com/ja/jp-ni/vtor/34/#L7">申. 34:7</a>; <a href="https://bibleox.com/ja/jp-ni/nav/1/#L2">ヨシュ. 1:2</a>）、消え去ったのでも、意識を失ったのでもありません。キリストと<strong>交わっている</strong>のです。</p><blockquote><p><em>「見ると、</em><strong><em>モーセとエリヤが現れ、イエスと語り合っていた</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/mf/17/#L3"><em>マタ. 17:3</em></a><em>）</em></p></blockquote><blockquote><p><em>「祈っておられるうちに、イエスの顔の様子が変わり、服は真っ白に輝いた。見ると、</em><strong><em>二人の人がイエスと語り合っていた。モーセとエリヤである</em></strong><em>。二人は栄光に包まれて現れ、イエスがエルサレムで遂げようとしておられる最期について</em><strong><em>話していた</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/lk/9/#L29-31"><em>ルカ. 9:29-31</em></a><em>）</em></p></blockquote><h3>愛はいつもほかの人々への配慮へと動かす</h3><blockquote><p>「<strong><mark>愛は決して滅びない</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/1kor/13/#L8">１コリ. 13:8</a>）</p></blockquote><h2>反論への応答</h2><h3>唯一の仲介者</h3><h4>短い答え</h4><p>正教徒は、聖人への祈りのゆえに、キリストだけが唯一の仲介者であると主張されて非難されます。答えは、キリストは人々を贖われた唯一の仲介者であるということです。この節の続きにそう語られています。</p><blockquote><p>「神は唯一であり、<strong>神と人との間の<mark>仲介者も</mark>、人であるキリスト・イエスただおひとりなのです</strong>。<strong><mark>この方はすべての人の贖いとして御自身を献げられました</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/1tim/2/#L5-6">１テモ. 2:5-6</a>）</p></blockquote><p>聖人たちは贖い主ではなく、祈りにおける共なる執り成し手です（<a href="https://bibleox.com/ja/jp-ni/iak/5/#L16">ヤコ. 5:16</a>）。すべては意味の問題です。わたしたちの反対者たち（通常はプロテスタント）は、互いの必要のために祈ります。もし彼らが互いのための仲介者であるなら、聖人たちもわたしたちの仲介者です。もし彼らが互いのための共なる執り成し手であるなら、聖人たちもわたしたちの共なる執り成し手です。わたしたちは、ただ彼らにわたしたちのために祈ってくれるよう、神へのわたしたちの祈りに加わってくれるよう願うのです。わたしたちは彼らを神々とは考えず、神々に祈るように彼らに祈るのではありません。まったく同じように、プロテスタントがほかの人々に自分のために祈ってくれるよう頼むとき、彼らは仲間を神々とは考えていません。</p><p>祈りにおける仲介者はありうるでしょうか。聖書から、ありうることがわかります。たとえば、教会の長老たちの祈りによって、ほかの人の罪が赦されることがあります。</p><blockquote><p><em>「あなたがたの中で病気の人は、</em><strong><em><mark>教会の長老を招いて</mark></em></strong><em>、主の名によってオリーブ油を塗り、</em><strong><em><mark>祈ってもらいなさい</mark></em></strong><em>。信仰に基づく祈りは、病人を救い、</em><strong><em>主がその人を起き上がらせてくださいます。</em></strong><strong><em><mark>その人が罪を犯したのであれば、主が赦してくださいます</mark></em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/iak/5/#L14-15"><em>ヤコ. 5:14-15</em></a><em>）</em></p></blockquote><p>否定しようのない執り成しです。このように、聖人への祈りの反対者たちが唱える、キリストが唯一の仲介者であるという言葉（<a href="https://bibleox.com/ja/jp-ni/1tim/2/#L5-6">１テモ. 2:5-6</a>）の理解は正しくありません。引用された節は、祈りにおける仲介者に反対して語っているのではありません。</p><h4>「仲介者」という語について、さらに詳しく</h4><p>翻訳の細かな点もあります。「仲介者」という語は、ギリシア語 μεσίτης の訳です。これは「和解させる者」、双方の和解を助ける人とも訳すことができます。つまり、言い換えれば、キリストは神と人との間の唯一の<strong>和解者</strong>（平和をもたらす者）なのです。このことは、使徒たちによってほかの箇所でもっとはっきりと語られています。</p><blockquote><p>「これらはすべて<strong>神から出ることであって、神は、キリストを通してわたしたちを御自分と<mark>和解させ</mark></strong>、また、<strong>和解のために奉仕する任務</strong>をわたしたちにお授けになりました。つまり、<strong><mark>神はキリストによって世を御自分と和解させ</mark></strong>、人々の罪の責任を問うことなく、<strong>和解の言葉をわたしたちにゆだねられたのです</strong>」（<a href="https://bibleox.com/ja/jp-ni/2kor/5/#L18-19">２コリ. 5:18-19</a>）</p></blockquote><blockquote><p>「わたしの子たちよ、これらのことを書くのは、あなたがたが罪を犯さないようになるためです。<strong><mark>たとえ罪を犯しても</mark>、御父のもとに<mark>弁護者</mark>、正しい方、イエス・キリスト<mark>がおられます</mark></strong>。<strong><mark>この方こそ、わたしたちの罪</mark></strong>、いや、わたしたちの罪ばかりでなく、全世界の罪<strong><mark>を償ういけにえです</mark></strong>。&lt;…&gt; 子たちよ、わたしがあなたがたに書いているのは、<strong><mark>イエスの名によってあなたがたの罪が赦されているからである</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/1in/2/#L1-2,12">１ヨハ. 2:1-2,12</a>）</p></blockquote><p>「仲介者」という語を<strong>和解者</strong>、平和をもたらす者と訳すことは、すでに前に示したとおり、文の終わり、「<em>この方はすべての人の贖いとして御自身を献げられました</em>」（<a href="https://bibleox.com/ja/jp-ni/1tim/2/#L5-6">１テモ. 2:5-6</a>）とも一致しています。御自身をいけにえとして献げることによって、神の前で人類の罪を贖った、そのような平和をもたらす方です。このように、この節は聖人への祈りに反対して語っているのではなく、人類と神との<strong>和解者</strong>としてのキリストについて語っているのです。キリストはまた、人々を互いに<strong>和解させる方</strong>でもあります（<a href="https://bibleox.com/ja/jp-ni/ef/2/#L14">エフェ. 2:14</a>）。</p><h3>「救ってください」という表現について</h3><p>正教徒は、聖人への祈りの中で「救ってください」という表現を認めていると非難されます。ここでもまた、意味の問題です。救いはキリストによってただ一度成し遂げられました。その意味でのほかの救い主はいません。しかし、多くの人が、一人一人の個人的な救いに寄与することができます。そして聖書では、このような表現がしばしば認められています。</p><h4>使徒は救う</h4><blockquote><p><em>「何とかして自分の同胞にねたみを起こさせ、</em><strong><em>その幾人かでも<mark>救いたい</mark></em></strong><em>のです」（</em><a href="https://bibleox.com/ja/jp-ni/rim/11/#L14"><em>ロマ. 11:14</em></a><em>）</em></p></blockquote><blockquote><p><em>「</em><strong><em>すべての人に対してすべてのものになりました。何とかして</em></strong><em>何人かでも</em><strong><em><mark>救う</mark></em></strong><em>ためです」（</em><a href="https://bibleox.com/ja/jp-ni/1kor/9/#L22"><em>１コリ. 9:22</em></a><em>）</em></p></blockquote><h4>妻は救う</h4><blockquote><p><em>「</em><strong><em>妻よ、あなたは夫を<mark>救えるかどうか</mark>、どうして分かるのか</em></strong><em>。</em><strong><em>夫よ、あなたは妻を<mark>救えるかどうか</mark>、どうして分かるのか</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/1kor/7/#L16"><em>１コリ. 7:16</em></a><em>）</em></p></blockquote><h4>ほかの人々を救えという使徒の呼びかけ</h4><blockquote><p><em>「疑いを抱いている人たちを憐れみなさい。ほかの人たちを火の中から引き出して</em><strong><em><mark>助けなさい</mark></em></strong><em>。また、ほかの人たちを用心しながら憐れみなさい。肉によって汚れてしまった彼らの下着さえも忌み嫌いなさい」（</em><a href="https://bibleox.com/ja/jp-ni/iud/1/#L22-23"><em>ユダ. 1:22-23</em></a><em>）（「助けなさい」と訳されている語は、ギリシア語原文では σῴζετε —「救いなさい」です。）</em></p></blockquote><blockquote><p>「自分自身と教えとに気を配りなさい。以上のことをしっかりと守りなさい。そうすれば、あなたは自分自身と、<strong>あなたの言葉を聞く人々とを<mark>救う</mark></strong>ことになります」（<a href="https://bibleox.com/ja/jp-ni/1tim/4/#L16">１テモ. 4:16</a>）</p></blockquote><h4>キリスト以外のだれかが本当に救うことができるのか</h4><p>使徒も、妻も夫も、主イエス・キリストが救い主であるという意味での救い主ではありません。主は、人類を死と地獄から贖い救い出す唯一の方であり、復活と神と共にある永遠の命を与えてくださる方です。しかし、ご覧のとおり、「救う」という表現を使徒たちは認めています。わたしたちはこのような表現の意味を正しく理解しています。人は救いに寄与することができるのです。</p><blockquote><p>「<em>わたしたちは神のために</em><strong><em>力を合わせて働く者</em></strong>であり」（<a href="https://bibleox.com/ja/jp-ni/1kor/3/#L9">１コリ. 3:9</a>）<em>（ギリシア語 θεοῦ συνεργοί —「神の協力者」）</em></p></blockquote><h3>「憐れんでください」という表現について</h3><p>ここでも事情は「救う」という語の場合と同じです（上記参照）。このような言葉は、聖人たちにだけでなく、普通の人々にも向けられます。憐れむとは、憐れみを示すことです。たとえば、義人ヨブは友人たちに言います。</p><blockquote><p>「<strong>憐れんでくれ、わたしを憐れんでくれ</strong>神の手がわたしに触れたのだ。<strong>あなたたちはわたしの友ではないか</strong>」（<a href="https://bibleox.com/ja/jp-ni/iov/19/#L21">ヨブ. 19:21</a>）<em>（七十人訳ギリシア語 ἐλεήσατέ με, ἐλεήσατέ με, ὦ φίλοι —「わたしを憐れんでくれ、わたしを憐れんでくれ、友よ」）</em></p></blockquote><h3>聖人たちはどうして世界中からの祈りを聞くことができるのか</h3><p>聖人への祈りの反対者たちは言います。「<em>神は遍在し全能であるが、聖人たちがそのような性質を持っていないのなら、どうして地球上のさまざまな場所にいる大勢の人々の祈りを聞くことができるのか</em>」。</p><h4>聖人たちは、自分の力ではなく神の力によって預言し、奇跡を行った</h4><p>聖人たちは、神から切り離して、別々に考えられるのではありません。地上で体のうちに生きている間にも神の力が彼らの内に宿っており、天に、キリストと共にある命に移った後には、なおさらそれを失うことはありません。こうして預言者アガボは、全知ではありませんでしたが、全世界に起こる飢饉を予告しました（<a href="https://bibleox.com/ja/jp-ni/act/11/#L28">使. 11:28</a>）。使徒ペトロは全能ではありませんでしたが、タビタを生き返らせました（<a href="https://bibleox.com/ja/jp-ni/act/9/#L40">使. 9:40</a>）。彼らは自分の力ではなく、神の力によってそれを行ったのです。</p><p>聖人たちは、使徒の言葉によれば、より悪い状態にではなく、比べものにならないほどよい状態に移ります（<a href="https://bibleox.com/ja/jp-ni/fil/1/#L23-24">フィリ. 1:23-24</a>）。彼らは失うのではなく、得るのです（<a href="https://bibleox.com/ja/jp-ni/fil/1/#L21">フィリ. 1:21</a>）。彼らは神と一つにされ、神の光と恵みの中にいます。彼らの存在をわたしたちの存在と比べることはできません。彼らは地上で起こっていることを知っています（<a href="https://bibleox.com/ja/jp-ni/otkr/6/#L10">黙. 6:10</a>）。ここで体のうちにあるときでさえ、使徒たちは、霊においてキリスト者と共にいると書いています。</p><h4>使徒は、キリスト者の共同体の状態を、体によってではなく霊によって知る</h4><blockquote><p>「わたしは<strong>体では離れていても、霊ではあなたがたと共にいて</strong>、あなたがたの正しい秩序と、キリストに対する固い信仰とを<strong>見て喜んでいます</strong>」（<a href="https://bibleox.com/ja/jp-ni/kol/2/#L5">コロ. 2:5</a>）</p></blockquote><blockquote><p>「わたしは<strong>体では離れていても霊ではそこにいて、現に居合わせた者のように</strong>、そんなことをした者を<strong>既に裁いてしまっています</strong>。つまり、わたしたちの主イエスの名により、わたしたちの主イエスの力をもって、あなたがたとわたしの霊が集まり、このような者を、その肉が滅ぼされるようにサタンに引き渡したのです。それは主の日に彼の霊が救われるためです」（<a href="https://bibleox.com/ja/jp-ni/1kor/5/#L3-5">１コリ. 5:3-5</a>）</p></blockquote><h4>救われる者には守護天使がいる</h4><p>書かれているとおり、天使たちは救われる者たちに仕えるために遣わされています。</p><blockquote><p>「<strong>天使たちは皆、奉仕する霊であって、救いを受け継ぐことになっている人々に仕えるために、遣わされた</strong>のではなかったですか」（<a href="https://bibleox.com/ja/jp-ni/evr/1/#L14">ヘブ. 1:14</a>）</p></blockquote><p>そして天使たちは神の御顔を仰いでいます（<a href="https://bibleox.com/ja/jp-ni/mf/18/#L10">マタ. 18:10</a>）。天使たちでさえ、わたしたちの祈りを伝えることができるでしょう。わたしたちは聖なる人々にだけでなく、聖なる天使たちにも祈ります。わたしたちのために祈ってくれるよう願い、彼らの労苦と配慮に感謝するのです。</p><p>地上の教会と天上の教会との交わりに反対する人々は、わたしたちに仕えるために遣わされた守護天使に感謝することさえ許しません。守護天使は、わたしたちの声を聞くために、遍在したり全能であったりする必要はないのにです。</p><p>このように教会は、聖人たちが神の光と恵みの中にとどまっていることによって、わたしたちの祈りを聞くと信じています。神との一致が彼らにこの能力を与えます。神御自身が彼らにこの能力をお与えになるのです。ですから、ごく簡単に言えば、聖人たちが祈りを聞くのは、自分の能力によってではなく、神と神の能力によってなのです。</p><h3>教会はどうしてだれが聖人であるかを知るのか。人間が神に代わって決めているのではないか</h3><p>人間が神に代わって決めているのではありません。神が、その約束に従って（<a href="https://bibleox.com/ja/ja/w/Vs4n_聖人の崇敬/">引用</a>）、御自身で聖人たちに栄光を与え、奇跡を現し、彼らの祈りを聞き入れられるのです。教会はただそれを証しし、民の間での聖人の崇敬に秩序を与えるだけです。混乱が起こらないようにするためであり、使徒もそのように命じました。</p><blockquote><p>「<strong>すべてを適切に、秩序正しく行いなさい</strong>」（<a href="https://bibleox.com/ja/jp-ni/1kor/14/#L40">１コリ. 14:40</a>）</p></blockquote><blockquote><p>「ところが、聞くところによると、<strong>あなたがたの中には怠惰な生活をし</strong>、少しも働かず、余計なことをしている者がいるということです」（<a href="https://bibleox.com/ja/jp-ni/2sol/3/#L11">２テサ. 3:11</a>）<em>（「怠惰な生活をし」は、ギリシア語原文では περιπατοῦντας … ἀτάκτως —「無秩序に歩み」です。）</em></p></blockquote><p>義人の聖性についての教会の証しと崇敬の秩序の確立（列聖）は、通常、義人の死よりずっと後に行われます。この問題を検討する際に、義人の地上の生涯だけでなく、義人が天に、神と共にある命に移った後に神がその人について明らかにされたかもしれないことからも出発することができるからです。</p><p>義人の墓で起こる奇跡やいやしについて、義人の祈りによる助けについて、教会の成員から証言が集められます[2]。その人の生涯と信仰の清さが注意深く調べられます。その後、教会は集められた情報を会議で検討し、義人を聖人として崇敬することを承認し、そのための教会の祈祷文やイコンを作り、記憶の日を定めることがあります。これは一部には、教会の民の間ですでに行われている崇敬に秩序を与えること、その崇敬が正しいことを示すこと、そしてそれを奉神礼に取り入れることです。</p><p>しかし、多くの義人については、その聖性を証しする必要はありません。それは聖書と教会の聖伝から明らかだからです。よく知られた聖人の中には、疑いもなく、<a href="https://bibleox.com/ru/ru/w/%D0%91%D0%BE%D0%B3%D0%BE%D1%80%D0%BE%D0%B4%D0%B8%D1%86%D0%B0/">おとめマリア、生神女（神の母）</a>（神が偉大なことをなさった方、<a href="https://bibleox.com/ja/jp-ni/lk/1/#L49">ルカ. 1:49</a>）、祖先たち、預言者たち、使徒たち、彼らが立てた主教・司祭・輔祭たち（たとえば輔祭であり最初の致命者であるステファノ、<a href="https://bibleox.com/ja/jp-ni/act/7/#L55-60">使. 7:55-60</a>）、そして多くの致命者たちがいます。そのうえ、教会は聖なる人々にだけでなく、天使たちにも祈ります。大天使ミカエル、ガブリエル、ほかの多くの天使たち、<a href="https://bibleox.com/ru/ru/w/%D0%B0%D0%BD%D0%B3%D0%B5%D0%BB-%D1%85%D1%80%D0%B0%D0%BD%D0%B8%D1%82%D0%B5%D0%BB%D1%8C/">守護天使</a>にです。天使たちの聖性を証しする必要はありません。彼らは神の知られた僕だからです。</p><h2>大切な注記</h2><p>聖人への祈りを擁護する前に、一つの鍵となる点をしっかりと理解しておかなければなりません。反対者たちには、聖人への祈りの禁止を説明する積極的な部分がないということです。反対者たちの論拠の土台は、「聖書には書かれていない」という一つの言葉から成っています。これは説明の否定的な部分であり、彼らはそれを主張し続けるでしょう。積極的な部分、すなわち禁止についての明確な理解（把握）は彼らにはありません。</p><p>アドベンチストはある程度理解を示すことができます。彼らは、体の死の後に人の魂が生きることを信じていないからです。しかし、アドベンチストでさえ、天使への祈りの禁止を説明することはできません。彼らは（今のところ）天使の存在を否定していないからです。聖書によれば、天使たちは救われる者たちに定められ、人の救いに心を配っています（<a href="https://bibleox.com/ja/jp-ni/evr/1/#L14">ヘブ. 1:14</a>）。なぜ彼らに何も言ってはならないのでしょうか。彼らはそれを説明できません。</p><p>ほかの（新）プロテスタントについて言えば、その大部分は、体から離れた後に人の魂が生きることを信じており、すでに今わたしたちが近づいている天上の教会（<a href="https://bibleox.com/ja/jp-ni/evr/12/#L22-23">ヘブ. 12:22-23</a>）と交わってはならない理由、族長たち、使徒たち、致命者たち、天使たちと語ってはならない理由を、まったく説明することができません。もちろん、何かを持ち出そうとはするでしょうが、それはいつも説得力のないものです。たとえば、聖人たちは神の安息に入ったので、もはや地上の事柄に心を煩わせないのだと言うでしょう。しかしそうすると、神も地上の事柄に心を煩わせないことになってしまいます。神も同じ安息の内におられるからです。説明しようとするほかの試みも、同じようにばかげて見えます。</p><p>聖人に祈る必要は、聖書から暗黙のうちに（段階を追って）導き出されます。つまり、この必要ははっきりと示されているのではなく、含意されているのです。そしてそれは普通のことです。聖書には、すべてが直接に語られているわけではないからです。三位一体としての神についての最も重要な教えも、聖書から暗黙のうちに導き出されています。わたしたちの反対者たちも、聖書から多くのことを暗黙のうちに導き出しています。たとえば、幼児に洗礼を授けてはならないとはどこにも書かれていないのに、彼らは根拠なく授けてはならないと主張し、それが聖書に書かれていないことに困ってはいません。彼らはこの禁止を、聖書のほかの言葉から暗黙のうちに導き出そうとしています。それゆえ、彼らをこの土俵に連れて来て、聖人に祈ることの禁止についての理解を示すよう求めることが、きわめて大切なのです。</p><p>そしてまた、親愛なる友よ、覚えておいてください。聖人への祈りの反対者たちが反対しているのは、決して執り成しの祈りではありません（互いのために祈るとき、彼ら自身が互いの仲介者であることは、彼らがどれほどそれに反論しようとも、たやすく証明できるからです）。彼らが何よりも反対しているのは、<strong>地上の教会と天上の教会との<mark>交わり</mark></strong>であり、聖なる霊たち、すなわち聖なる天使たちや聖なる人々、神の友たちとのあらゆる交わりです。あたかも地上の教会が天上の教会に腹を立てて、話したくないかのように、キリストの体の一つの部分が同じ体の別の部分と交わりたくないかのようです。彼らはただ一言も許すことができず、わたしたちへの配慮に対して守護天使に感謝することさえ許しません。霊的な世界の聖人たちとの交わりのほんのわずかな可能性でも認めてしまえば、まもなく、地上の教会と天上の教会の交わりに属するほかのすべてのことを、一歩一歩認めるほかなくなってしまうからです。それゆえ、問いの一つとして、聖書に非常に広く示されている天使たちとの交わりの可能性を検討する価値があるのです。</p>
