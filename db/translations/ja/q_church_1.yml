    body: |-
      <h2>神はいつも教会と共におられる</h2><p>聖霊は永遠に教会へ遣わされています。</p><blockquote><p>「わたしは父にお願いしよう。父は別の弁護者を遣わして、<strong>永遠にあなたがたと一緒にいるようにしてくださる</strong>」（<a href="https://bibleox.com/ja/jp-ni/in/14/#L16">ヨハ. 14:16</a>）</p></blockquote><p>主イエス・キリストは、いつも教会と共にいると約束されました。</p><blockquote><p>「わたしは<strong>世の終わりまで、いつも</strong>あなたがたと共にいる」（<a href="https://bibleox.com/ja/jp-ni/mf/28/#L20">マタ. 28:20</a>）</p></blockquote><h2>教会は打ち負かされない</h2><p>主は、教会が打ち負かされないという預言を語られます。</p><blockquote><p>「わたしはこの岩の上にわたしの教会を建てる。<strong>陰府の力もこれに対抗できない</strong>」（<a href="https://bibleox.com/ja/jp-ni/mf/16/#L18">マタ. 16:18</a>）<em>（「陰府の力」は、ギリシア語原文では πύλαι ᾅδου —「陰府の門」です。）</em></p></blockquote><h2>真理はいつも教会の中にある</h2><p>真理は永遠に教会と共にあります。</p><blockquote><p>「長老のわたしから、選ばれた婦人とその子たちへ。わたしは、あなたがたを真に愛しています。わたしばかりでなく、真理を知っている人はすべて、あなたがたを愛しています。それは、いつもわたしたちの内にある<strong>真理</strong>によることで、<strong>真理は永遠にわたしたちと共にあります</strong>」（<a href="https://bibleox.com/ja/jp-ni/2in/1/#L1-2">２ヨハ. 1:1-2</a>）</p></blockquote><h2>教会はいつも神に栄光を帰す</h2><p>教会の中で、すべての世代のすべての人が神に栄光を帰します。</p><blockquote><p>「<strong>教会により</strong>、また、キリスト・イエスによって、<strong>栄光が世々限りなく</strong>ありますように、アーメン」（<a href="https://bibleox.com/ja/jp-ni/ef/3/#L21">エフェ. 3:21</a>）</p></blockquote><h2>教会では、キリストが来られるまで聖体礼儀（エウカリスティア）が行われる</h2><blockquote><p>「だから、あなたがたは、この<strong>パン</strong>を食べこの<strong>杯</strong>を飲むごとに、<strong>主が来られるときまで</strong>、主の死を告げ知らせるのです」（<a href="https://bibleox.com/ja/jp-ni/1kor/11/#L26">１コリ. 11:26</a>）</p></blockquote>
