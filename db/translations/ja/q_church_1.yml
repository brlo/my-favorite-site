    title: 教会には初めから真理の充満が与えられた
    title_sub: 教会に初めから与えられた真理の充満についての聖書の引用
    menu: { parent: "教会", title: "教会——真理の充満", priority: 7 }
    body: |-
      <h2>真の教えは、すでに一度教会に与えられた</h2><blockquote><p>「愛する人たち、わたしたちが共にあずかる救いについて書き送りたいと、ひたすら願っておりました。あなたがたに手紙を書いて、<strong>聖なる者たちに<mark>一度</mark>伝えられた信仰のために戦うこと</strong>を、勧めなければならないと思ったからです」（<a href="https://bibleox.com/ja/jp-ni/iud/1/#L3">ユダ. 1:3</a>）</p></blockquote><blockquote><p>「<strong><mark>初めから聞いていたことを、心にとどめなさい</mark></strong>。<strong><mark>初めから聞いていたことが、あなたがたの内にいつもあるならば</mark></strong>、あなたがたも御子の内に、また御父の内にいつもいるでしょう」（<a href="https://bibleox.com/ja/jp-ni/1in/2/#L24">１ヨハ. 2:24</a>）</p></blockquote><p>それゆえ、教会は充満と呼ばれています。</p><blockquote><p>「神はまた、すべてのものをキリストの足もとに従わせ、キリストをすべてのものの上にある頭として<strong>教会</strong>にお与えになりました。教会はキリストの体であり、すべてにおいてすべてを満たしている方の<strong><mark>満ちておられる場</mark></strong>です」（<a href="https://bibleox.com/ja/jp-ni/ef/1/#L22-23">エフェ. 1:22-23</a>）<em>（「満ちておられる場」と訳されている語は、ギリシア語原文では πλήρωμα —「充満」です。）</em></p></blockquote><p>教会はこの真理を確立します。</p><blockquote><p>「神の家とは、<strong><mark>真理の柱であり土台である</mark></strong>生ける神の教会です」（<a href="https://bibleox.com/ja/jp-ni/1tim/3/#L15">１テモ. 3:15</a>）</p></blockquote><h2>真の教えは、神であるキリスト御自身によって、直接、公に与えられた</h2><p>この教えは、キリストが父から受けて伝えられたものです。</p><blockquote><p>「なぜなら、<strong>わたしはあなたから受けた言葉を彼らに伝え</strong>、彼らはそれを受け入れて、わたしがみもとから出て来たことを本当に知り、あなたがわたしをお遣わしになったことを信じたからです」（<a href="https://bibleox.com/ja/jp-ni/in/17/#L8">ヨハ. 17:8</a>）</p></blockquote><p>キリストが与えられた教えにこそ、とどまらなければなりません。</p><blockquote><p>「だれであろうと、キリストの教えを越えて、これにとどまらない者は、神に結ばれていません。<strong>その教えにとどまっている人にこそ、御父も御子もおられます</strong>」（<a href="https://bibleox.com/ja/jp-ni/2in/1/#L9">２ヨハ. 1:9</a>）</p></blockquote><h2>ほかのことを教えてはならない</h2><blockquote><p>「マケドニア州に出発するときに頼んでおいたように、あなたはエフェソにとどまって、ある人々に命じなさい。<strong><mark>異なる教えを説いたり</mark></strong>、作り話や切りのない系図に心を奪われたりしないようにと。このような作り話や系図は、信仰による神の救いの計画の実現よりも、むしろ無意味な詮索を引き起こします」（<a href="https://bibleox.com/ja/jp-ni/1tim/1/#L3-4">１テモ. 1:3-4</a>）</p></blockquote><blockquote><p>「そして、多くの証人の面前で<strong><mark>わたしから聞いたこと</mark></strong>を、ほかの人々にも教えることのできる<strong>忠実な人たちに<mark>ゆだねなさい</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/2tim/2/#L2">２テモ. 2:2</a>）</p></blockquote><blockquote><p>「あなたがたが、何かにつけわたしを思い出し、<strong><mark>わたしがあなたがたに伝えたとおりに、伝えられた教えを守っている</mark></strong>のは、立派だと思います」（<a href="https://bibleox.com/ja/jp-ni/1kor/11/#L2">１コリ. 11:2</a>）<em>（「伝えられた教え」と訳されている語は、ギリシア語原文では παραδόσεις —「伝承（聖伝）」です。）</em></p></blockquote><blockquote><p>「兄弟たち、わたしがあなたがたに告げ知らせた福音を、ここでもう一度知らせます。これは、あなたがたが受け入れ、生活のよりどころとしている福音にほかなりません。<strong><mark>どんな言葉でわたしが福音を告げ知らせたか、しっかり覚えていれば</mark></strong>、あなたがたはこの福音によって救われます。さもないと、あなたがたが信じたこと自体が、無駄になってしまうでしょう」（<a href="https://bibleox.com/ja/jp-ni/1kor/15/#L1-2">１コリ. 15:1-2</a>）</p></blockquote><blockquote><p>「さて、兄弟たち、主イエスに結ばれた者としてわたしたちは更に願い、また勧めます。<strong>あなたがたは、神に喜ばれるためにどのように歩むべきかを、<mark>わたしたちから学びました</mark></strong>。そして、現にそのように歩んでいますが、どうか、<strong>その歩みを<mark>今後も更に続けてください</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/1sol/4/#L1">１テサ. 4:1</a>）</p></blockquote><blockquote><p>「ですから、兄弟たち、しっかり立って、<strong><mark>わたしたちが説教や手紙で伝えた教えを固く守り続けなさい</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/2sol/2/#L15">２テサ. 2:15</a>）<em>（「教え」と訳されている語は、ギリシア語原文では παραδόσεις —「伝承（聖伝）」です。）</em></p></blockquote><h2>一度与えられた信仰を歪めようとする試みがある</h2><blockquote><p>「教えに適う信頼すべき言葉をしっかり守る人でなければなりません。そうでないと、健全な教えに従って勧めたり、反対者の主張を論破したりすることもできないでしょう。実は、<strong><mark>不従順な者、無益な話をする者、人を惑わす者が多いのです</mark></strong>。特に割礼を受けている人たちの中に、そういう者がいます。その者たちを沈黙させねばなりません。彼らは恥ずべき利益を得るために、教えてはならないことを教え、数々の家庭を覆しています」（<a href="https://bibleox.com/ja/jp-ni/tit/1/#L9-11">テト. 1:9-11</a>）</p></blockquote><blockquote><p>「ただ、エバが蛇の悪だくみで欺かれたように、あなたがたの思いが汚されて、キリストに対する真心と純潔とからそれてしまうのではないかと心配しています。なぜなら、あなたがたは、だれかがやって来て<strong><mark>わたしたちが宣べ伝えたのとは異なったイエスを宣べ伝えても</mark></strong>、あるいは、自分たちが受けたことのない違った霊や、<strong><mark>受け入れたことのない違った福音</mark></strong>を受けることになっても、よく我慢しているからです。&lt;…&gt; こういう者たちは偽使徒、ずる賢い働き手であって、キリストの使徒を装っているのです。だが、驚くには当たりません。サタンでさえ光の天使を装うのです。だから、サタンに仕える者たちが、義に仕える者を装うことなど、大したことではありません。彼らは、自分たちの業に応じた最期を遂げるでしょう」（<a href="https://bibleox.com/ja/jp-ni/2kor/11/#L3-4,13-15">２コリ. 11:3-4,13-15</a>）</p></blockquote><h2>キリストが残された教えの代わりに新しい教えを持ち込む者たちから離れよ</h2><blockquote><p>「<strong>異なる教えを説き</strong>、<strong>わたしたちの主イエス・キリストの健全な言葉にも</strong>、信心に基づく教えにも<strong>従わない者がいれば</strong>、<strong>その者</strong>は高慢で、<strong>何も分からず</strong>、議論や口論に病みつきになっています。そこから、ねたみ、争い、中傷、邪推、絶え間ない言い争いが生じるのです。&lt;…&gt;」（<a href="https://bibleox.com/ja/jp-ni/1tim/6/#L3-5">１テモ. 6:3-5</a>）<em>（ビザンティン本文（多数派写本）では、5節は「<strong>このような人々から<mark>離れなさい</mark></strong>」〔ἀφίστασο ἀπὸ τῶν τοιούτων〕という言葉で終わります。正教会の教会スラヴ語訳やロシア語訳もこの読みに従っています。新共同訳が底本とする校訂本文には、この言葉はありません。）</em></p></blockquote><blockquote><p>「テモテ、<strong>あなたにゆだねられているものを守り</strong>、俗悪な無駄話と、<strong>不当にも知識と呼ばれている</strong>反対論とを<strong><mark>避けなさい</mark></strong>。その知識を鼻にかけ、信仰の道を踏み外してしまった者もいます。恵みがあなたがたと共にあるように」（<a href="https://bibleox.com/ja/jp-ni/1tim/6/#L20-21">１テモ. 6:20-21</a>）</p></blockquote><blockquote><p>「兄弟たち、わたしたちは、わたしたちの主イエス・キリストの名によって命じます。怠惰な生活をして、<strong>わたしたちから受けた教えに従わないでいるすべての兄弟を<mark>避けなさい</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/2sol/3/#L6">２テサ. 3:6</a>）</p></blockquote><blockquote><p>「兄弟たち、あなたがたに勧めます。<strong>あなたがたの学んだ教えに反して</strong>、不和やつまずきをもたらす人々を警戒しなさい。<strong>彼らから<mark>遠ざかりなさい</mark></strong>。<strong>こういう人々は、わたしたちの主であるキリストに仕えないで</strong>、自分の腹に仕えている。そして、うまい言葉やへつらいの言葉によって純朴な人々の心を欺いているのです」（<a href="https://bibleox.com/ja/jp-ni/rim/16/#L17-18">ロマ. 16:17-18</a>）</p></blockquote><blockquote><p>「<strong>この教えを携えずに</strong>あなたがたのところに<strong>来る者は、<mark>家に入れてはなりません</mark></strong>。挨拶してもなりません。そのような者に挨拶する人は、その悪い行いに加わるのです」（<a href="https://bibleox.com/ja/jp-ni/2in/1/#L10-11">２ヨハ. 1:10-11</a>）</p></blockquote><blockquote><p>「しかし、<strong>たとえ</strong>わたしたち自身であれ、<strong>天使であれ</strong>、<strong>わたしたちがあなたがたに告げ知らせたものに反する福音を告げ知らせようとするならば</strong>、<strong><mark>呪われるがよい</mark></strong><em>（ギリシア語 ἀνάθεμα ἔστω —「アナテマであれ」）</em>。わたしたちが前にも言っておいたように、今また、わたしは繰り返して言います。<strong>あなたがたが受けたものに反する福音を告げ知らせる者がいれば、<mark>呪われるがよい</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/gal/1/#L8-9">ガラ. 1:8-9</a>）</p></blockquote><p><strong>アナテマ</strong>（ギリシア語 ἀνάθεμα）— 教会からの破門。</p><h2>聖伝の歪曲（異端）を明るみに出せ</h2><blockquote><p>「実を結ばない暗闇の業に加わらないで、むしろ、それを<strong>明るみに出しなさい</strong>」（<a href="https://bibleox.com/ja/jp-ni/ef/5/#L11">エフェ. 5:11</a>）</p></blockquote><blockquote><p>「教えに適う信頼すべき言葉をしっかり守る人でなければなりません。そうでないと、健全な教えに従って勧めたり、<strong><mark>反対者の主張を論破したり</mark></strong>することもできないでしょう。実は、不従順な者、無益な話をする者、人を惑わす者が多いのです。特に割礼を受けている人たちの中に、そういう者がいます。<strong>その者たちを沈黙させねばなりません</strong>。彼らは恥ずべき利益を得るために、教えてはならないことを教え、数々の家庭を覆しています」（<a href="https://bibleox.com/ja/jp-ni/tit/1/#L9-11">テト. 1:9-11</a>）</p></blockquote><blockquote><p>「<strong>真理のためには、命がけで戦え</strong>。主なる神も、お前に味方して戦ってくださる」（<a href="https://bibleox.com/ja/jp-ni/prsir/4/#L28">シラ. 4:28</a>）</p></blockquote><blockquote><p>「愛する人たち、わたしたちが共にあずかる救いについて書き送りたいと、ひたすら願っておりました。あなたがたに手紙を書いて、<strong>聖なる者たちに一度伝えられた信仰のために戦うこと</strong>を、勧めなければならないと思ったからです」（<a href="https://bibleox.com/ja/jp-ni/iud/1/#L3">ユダ. 1:3</a>）</p></blockquote><h2>真理の霊は何へと導かれるのか</h2><p>聖霊が遣わされて使徒たちの上に降られる前に、キリストは、聖霊が使徒たちに遣わされるとき、キリストが語られたすべてのことを思い起こし、理解するのを助けてくださると約束されます。</p><blockquote><p>「しかし、弁護者、すなわち、父がわたしの名によってお遣わしになる聖霊が、あなたがたにすべてのことを教え、<strong><mark>わたしが話したことをことごとく思い起こさせてくださる</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/in/14/#L26">ヨハ. 14:26</a>）</p></blockquote><blockquote><p>「<strong>言っておきたいことは、まだたくさんあるが、今、あなたがたには理解できない</strong>。しかし、その方、すなわち、<strong><mark>真理の霊が来ると、あなたがたを導いて真理をことごとく悟らせる</mark></strong>。その方は、自分から語るのではなく、聞いたことを語り、また、これから起こることをあなたがたに告げるからである。その方はわたしに栄光を与える。<strong><mark>わたしのものを受けて、あなたがたに告げる</mark></strong>からである」（<a href="https://bibleox.com/ja/jp-ni/in/16/#L12-14">ヨハ. 16:12-14</a>）</p></blockquote>

