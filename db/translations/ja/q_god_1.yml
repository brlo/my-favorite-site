# 「聖書の引用」（ru/q）の日本語訳（jp_q）：「神」（1）
# Загрузка: bin/rails pages:import_translations FILE=db/translations/ja/q_god_1.yml [PUBLISH=1] [DRY_RUN=1]
lang: ja
list: jp_q
pages:
  - src: Христос-Единородный-Сын-Божий
    path: Kq7d_キリスト神の独り子
    title: キリスト — 神の独り子
    meta_desc: 神の独り子についての聖書の引用
    menu: { parent: "神/子", title: "神の独り子", priority: 3 }
    body: |-
      <h2>独り子 — 父のただ一人の御子</h2><p>独り子とは、ただ一人の子という意味です。つまり、神の子のように生まれた者は、ほかに誰もいません。</p><blockquote><p>「<strong>言は肉となって</strong>、わたしたちの間に宿られた。わたしたちはその栄光を見た。それは<strong>父の独り子</strong>としての栄光であって、恵みと真理とに満ちていた」（<a href="https://bibleox.com/ja/jp-ni/in/1/#L14">ヨハ. 1:14</a>）</p></blockquote><blockquote><p>「いまだかつて、神を見た者はいない。父のふところにいる<strong>独り子である神</strong>、この方が神を示されたのである」（<a href="https://bibleox.com/ja/jp-ni/in/1/#L18">ヨハ. 1:18</a>）</p></blockquote><blockquote><p>「<strong>神は、その独り子をお与えになった</strong>ほどに、世を愛された。独り子を信じる者が一人も滅びないで、永遠の命を得るためである」（<a href="https://bibleox.com/ja/jp-ni/in/3/#L16">ヨハ. 3:16</a>）</p></blockquote><blockquote><p>「御子を信じる者は裁かれない。信じない者は既に裁かれている。<strong>神の独り子</strong>の名を信じていないからである」（<a href="https://bibleox.com/ja/jp-ni/in/3/#L18">ヨハ. 3:18</a>）</p></blockquote><blockquote><p>「しかし、時が満ちると、<strong>神は、その御子を</strong>女から、しかも律法の下に生まれた者として<strong>お遣わしになりました</strong>」（<a href="https://bibleox.com/ja/jp-ni/gal/4/#L4">ガラ. 4:4</a>）</p></blockquote><blockquote><p>「神は、<strong>独り子</strong>を世にお遣わしになりました。その方によって、わたしたちが生きるようになるためです。ここに、神の愛がわたしたちの内に示されました」（<a href="https://bibleox.com/ja/jp-ni/1in/4/#L9">１ヨハ. 4:9</a>）</p></blockquote><p>アブラハムが独り子をいけにえとして献げたことは、神の独り子が十字架の上でいけにえとなることの予型です。</p><blockquote><p>「信仰によって、アブラハムは、試練を受けたとき、イサクを献げました。つまり、約束を受けていた者が、<strong>独り子を献げようとした</strong>のです」（<a href="https://bibleox.com/ja/jp-ni/evr/11/#L17">ヘブ. 11:17</a>）</p></blockquote><h2>イエス・キリスト — 長子</h2><p>キリストは長子と呼ばれています。</p><blockquote><p>「神は前もって知っておられた者たちを、御子の姿に似たものにしようとあらかじめ定められました。それは、御子が<strong>多くの兄弟の中で長子</strong>となられるためです」（<a href="https://bibleox.com/ja/jp-ni/rim/8/#L29">ロマ. 8:29</a>）</p></blockquote><blockquote><p>「更にまた、神はその<strong>長子</strong>をこの世界に送るとき、『神の天使たちは皆、彼を礼拝せよ』と言われました」（<a href="https://bibleox.com/ja/jp-ni/evr/1/#L6">ヘブ. 1:6</a>）</p></blockquote><p>なぜキリストは長子なのでしょうか。死者の中から最初に復活された方だからです。</p><blockquote><p>「また、御子はその体である教会の頭です。御子は初めの者、<strong>死者の中から最初に生まれた方</strong>です。こうして、すべてのことにおいて第一の者となられたのです」（<a href="https://bibleox.com/ja/jp-ni/kol/1/#L18">コロ. 1:18</a>）</p></blockquote><blockquote><p>「更に、証人、誠実な方、<strong>死者の中から最初に復活した方</strong>、地上の王たちの支配者、イエス・キリストから恵みと平和があなたがたにあるように。わたしたちを愛し、御自分の血によって罪から解放してくださった方に」（<a href="https://bibleox.com/ja/jp-ni/otkr/1/#L4-5">黙. 1:4-5</a>）</p></blockquote><blockquote><p>「つまり私は、メシアが苦しみを受け、また、<strong>死者の中から最初に復活して</strong>、民にも異邦人にも光を語り告げることになると述べたのです」（<a href="https://bibleox.com/ja/jp-ni/act/26/#L23">使. 26:23</a>）</p></blockquote><h2>ちなみに</h2><p>イスラム教によれば、アッラーは生むことも、生まれることもありません。</p><blockquote><p>「（アッラーは）生むことも、生まれることもない」（クルアーン 112章3節）</p></blockquote>

  - src: Сын-безначальный-начинается
    path: Xr2m_始まりなき神の子が人の子として始まる
    title: 始まりなき神の子が、人の子として始まる
    title_sub: 始まりのない神の子が、人として始まりを受ける（生まれる）ことについての聖書の引用
    meta_desc: 始まりのない神の子がおとめマリアから生まれたことについての聖書の引用
    menu: { parent: "神/子", title: "始まりなき御子の始まり", priority: 4 }
    body: |-
      <h2>神の子には始まりがなく、始まりのあるすべてのものに始まりを与える方である</h2><blockquote><p>「初めに言があった。言は神と共にあった。言は神であった。<strong>万物は言によって成った。成ったもので、言によらずに成ったものは何一つなかった</strong>。&lt;…&gt; 言は肉となって、わたしたちの間に宿られた。わたしたちはその栄光を見た。それは父の独り子としての栄光であって、恵みと真理とに満ちていた」（<a href="https://bibleox.com/ja/jp-ni/in/1/#L1,3,14">ヨハ. 1:1,3,14</a>）</p></blockquote><h2>祭司メルキゼデクは、日々の始まりのない（始まりなき）神の子の似姿である</h2><blockquote><p>「彼には父もなく、母もなく、系図もなく、また、<strong>生涯の初めもなく、命の終わりもなく、神の子に似た者であって</strong>、永遠に祭司です」（<a href="https://bibleox.com/ja/jp-ni/evr/7/#L3">ヘブ. 7:3</a>）</p></blockquote><h2>始まりなき方が始まる</h2><p>始まりのない<a href="https://bibleox.com/ja/ja/w/イエス・キリスト__神/">神</a>が始まりを持たれます。預言のとおり（<a href="https://bibleox.com/ja/jp-ni/is/7/#L14">イザ. 7:14</a>）、おとめから人として生まれるのです。</p><blockquote><p>「しかし、時が満ちると、神は、その御子を<strong>女から</strong>、しかも律法の下に<strong>生まれた者としてお遣わしになりました</strong>」（<a href="https://bibleox.com/ja/jp-ni/gal/4/#L4">ガラ. 4:4</a>）</p></blockquote><blockquote><p>「キリストは、神の身分でありながら、神と等しい者であることに固執しようとは思わず、かえって自分を無にして、<strong>僕の身分になり、人間と同じ者になられました。人間の姿で現れ</strong>、へりくだって、死に至るまで、それも十字架の死に至るまで従順でした」（<a href="https://bibleox.com/ja/jp-ni/fil/2/#L6-8">フィリ. 2:6-8</a>）</p></blockquote><blockquote><p>「初めに言があった。言は神と共にあった。<strong>言は神であった</strong>。万物は言によって成った。成ったもので、言によらずに成ったものは何一つなかった。&lt;…&gt; <strong>言は肉となって</strong>、わたしたちの間に宿られた。わたしたちはその栄光を見た。それは父の独り子としての栄光であって、恵みと真理とに満ちていた」（<a href="https://bibleox.com/ja/jp-ni/in/1/#L1,3,14">ヨハ. 1:1,3,14</a>）</p></blockquote>

  - src: Христос-на-небе
    path: Pw4n_天におられるキリスト
    title: 天におられるキリスト
    meta_desc: キリストが天で父と共におられることを示す聖書の引用
    menu: { parent: "神/子", title: "天におられるキリスト", priority: 6 }
    body: |-
      <blockquote><p>「主イエスは、弟子たちに話した後、<strong>天に上げられ、神の右の座に着かれた</strong>」（<a href="https://bibleox.com/ja/jp-ni/mk/16/#L19">マコ. 16:19</a>）</p></blockquote><blockquote><p>「御子は、神の栄光の反映であり、神の本質の完全な現れであって、万物を御自分の力ある言葉によって支えておられますが、人々の罪を清められた後、<strong>天の高い所におられる大いなる方の右の座にお着きになりました</strong>」（<a href="https://bibleox.com/ja/jp-ni/evr/1/#L3">ヘブ. 1:3</a>）</p></blockquote><blockquote><p>「今述べていることの要点は、<strong>わたしたちにはこのような大祭司が与えられていて、天におられる大いなる方の玉座の右の座に着き</strong>…」（<a href="https://bibleox.com/ja/jp-ni/evr/8/#L1">ヘブ. 8:1</a>）</p></blockquote><blockquote><p>「しかしキリストは、罪のために唯一のいけにえを献げて、<strong>永遠に神の右の座に着き</strong>…」（<a href="https://bibleox.com/ja/jp-ni/evr/10/#L12">ヘブ. 10:12</a>）</p></blockquote><blockquote><p>「信仰の創始者また完成者であるイエスを見つめながら。このイエスは、御自身の前にある喜びを捨て、恥をもいとわないで十字架の死を耐え忍び、<strong>神の玉座の右にお座りになったのです</strong>」（<a href="https://bibleox.com/ja/jp-ni/evr/12/#L2">ヘブ. 12:2</a>）</p></blockquote><blockquote><p>「なぜなら<strong>キリスト</strong>は、まことのものの写しにすぎない、人間の手で造られた聖所にではなく、<strong>天そのものに入り</strong>、今やわたしたちのために神の御前に現れてくださったからです」（<a href="https://bibleox.com/ja/jp-ni/evr/9/#L24">ヘブ. 9:24</a>）</p></blockquote><blockquote><p>「ステファノは聖霊に満たされ、天を見つめ、神の栄光と<strong>神の右に立っておられるイエスとを見て、『天が開いて、人の子が神の右に立っておられるのが見える』と言った</strong>」（<a href="https://bibleox.com/ja/jp-ni/act/7/#L55-56">使. 7:55-56</a>）</p></blockquote>

  - src: Христос-Творец-мира
    path: Lb9s_キリスト世界の創造主
    title: キリスト — 世界の創造主
    meta_desc: イエス・キリストは、世界とその中のすべてのものを造られた方です。
    menu: { parent: "神/子", title: "キリスト — 世界の創造主", priority: 9 }
    body: |-
      <p>子なる神イエス・キリストは、世界の創造主です。</p><blockquote><p>「一方、<strong><mark>御子に向かっては</mark></strong>、こう言われました。『神よ、あなたの玉座は永遠に続き、また、公正の笏が御国の笏である。あなたは義を愛し、不法を憎んだ。それゆえ、神よ、あなたの神は、喜びの油を、あなたの仲間に注ぐよりも多く、あなたに注いだ。』また、こうも言われています。『<strong><mark>主よ、あなたは初めに大地の基を据えた。もろもろの天は、あなたの手の業である</mark></strong>。これらのものは、やがて滅びる。だが、あなたはいつまでも生きている。すべてのものは、衣のように古び廃れる。あなたが外套のように巻くと、これらのものは、衣のように変わってしまう。しかし、あなたは変わることなく、あなたの年は尽きることがない』」（<a href="https://bibleox.com/ja/jp-ni/evr/1/#L8-12">ヘブ. 1:8-12</a>）</p></blockquote><blockquote><p>「御父は、わたしたちを闇の力から救い出して、その<strong>愛する<mark>御子</mark></strong>の支配下に移してくださいました。わたしたちは、この御子によって、贖い、すなわち罪の赦しを得ているのです。御子は、見えない神の姿であり、<strong>すべてのものが造られる前に生まれた方</strong>です。<strong><mark>天にあるものも地にあるものも、見えるものも見えないものも</mark>、王座も主権も、支配も権威も、<mark>万物は御子において造られたからです</mark>。つまり、万物は御子によって、御子のために造られました</strong>。御子はすべてのものよりも先におられ、すべてのものは御子によって支えられています」（<a href="https://bibleox.com/ja/jp-ni/kol/1/#L13-17">コロ. 1:13-17</a>）</p></blockquote><blockquote><p>「言は世にあった。<strong>世は言によって成った</strong>が、世は言を認めなかった」（<a href="https://bibleox.com/ja/jp-ni/in/1/#L10">ヨハ. 1:10</a>）</p></blockquote><blockquote><p>「神は、かつて預言者たちによって、多くのかたちで、また多くのしかたで先祖に語られたが、この終わりの時代には、<strong>御子</strong>によってわたしたちに語られました。神は、この御子を万物の相続者と定め、また、<strong>御子によって世界を創造されました</strong>」（<a href="https://bibleox.com/ja/jp-ni/evr/1/#L1-2">ヘブ. 1:1-2</a>）</p></blockquote><blockquote><p>「信仰によって、わたしたちは、<strong>この世界が神の言葉によって創造され</strong>、従って見えるものは、目に見えているものからできたのではないことが分かるのです」（<a href="https://bibleox.com/ja/jp-ni/evr/11/#L3">ヘブ. 11:3</a>）</p></blockquote>

  - src: СвятойДух-личность
    path: Hd5t_聖霊は人格である
    title: 聖霊は人格である
    meta_desc: 聖霊は常に人格として働かれる。住み、語り、聞き、良しとされ、示される。試され、侮辱され、冒瀆され、欺かれようとし、逆らわれる
    menu: { parent: "神/聖霊", title: "聖霊は人格である", priority: 2 }
    body: |-
      <h2>聖霊は御自身について人称代名詞を用いて語られる</h2><blockquote><p>「ペトロがなおも幻について考え込んでいると、<strong>“霊”がこう言った</strong>。『三人の者があなたを探しに来ている。立って下に行き、ためらわないで一緒に出発しなさい。<strong><mark>わたし</mark>（ἐγὼ）があの者たちをよこしたのだ</strong>』」（<a href="https://bibleox.com/ja/jp-ni/act/10/#L19-20">使. 10:19-20</a>）</p></blockquote><blockquote><p>「彼らが主を礼拝し、断食していると、<strong>聖霊が告げた</strong>。『さあ、バルナバとサウロを<strong><mark>わたし</mark>（μοι）のために</strong>選び出しなさい。<strong>わたしが前もって二人に決めておいた</strong>仕事に当たらせるために』」（<a href="https://bibleox.com/ja/jp-ni/act/13/#L2">使. 13:2</a>）</p></blockquote><h2>聖霊は語られる</h2><blockquote><p>「すると、<strong>“霊”がフィリポに</strong>、『追いかけて、あの馬車と一緒に行け』と<strong>言った</strong>」（<a href="https://bibleox.com/ja/jp-ni/act/8/#L29">使. 8:29</a>）（<a href="https://bibleox.com/ja/jp-ni/act/10/#L19-20">使. 10:19-20</a>）（<a href="https://bibleox.com/ja/jp-ni/act/13/#L2">使. 13:2</a>）</p></blockquote><h2>聖霊は思いを持ち、執り成される</h2><blockquote><p>「人の心を見抜く方は、<strong>“霊”の思い</strong>が何であるかを知っておられます。“霊”は、神の御心に従って、<strong>聖なる者たちのために執り成してくださる</strong>からです」（<a href="https://bibleox.com/ja/jp-ni/rim/8/#L27">ロマ. 8:27</a>）</p></blockquote><h2>聖霊は望むままに働かれる</h2><blockquote><p>「これらすべてのことは、同じ唯一の<strong>“霊”</strong>の働きであって、“霊”は<strong>望むままに</strong>、それを一人一人に分け与えてくださるのです」（<a href="https://bibleox.com/ja/jp-ni/1kor/12/#L11">１コリ. 12:11</a>）</p></blockquote><h2>聖霊は預言者を通して語られる</h2><blockquote><p>「<strong>聖霊は、預言者イザヤを通して</strong>、実に正しくあなたがたの先祖に、<strong>語られました</strong>。『この民のところへ行って言え。あなたたちは聞くには聞くが、決して理解せず、見るには見るが、決して認めない』」（<a href="https://bibleox.com/ja/jp-ni/act/28/#L25-26">使. 28:25-26</a>）</p></blockquote><blockquote><p>「だから、<strong>聖霊がこう言われる</strong>とおりです。『今日、あなたたちが神の声を聞くなら』」（<a href="https://bibleox.com/ja/jp-ni/evr/3/#L7">ヘブ. 3:7</a>）</p></blockquote><h2>人の心から父に向かって叫ばれる</h2><blockquote><p>「あなたがたが子であることは、神が、<strong>『アッバ、父よ』と叫ぶ</strong>御子の<strong>霊</strong>を、わたしたちの心に送ってくださった事実から分かります」（<a href="https://bibleox.com/ja/jp-ni/gal/4/#L6">ガラ. 4:6</a>）</p></blockquote><h2>聞かれる</h2><blockquote><p>「しかし、その方、すなわち、真理の霊が来ると、あなたがたを導いて真理をことごとく悟らせる。その方は、自分から語るのではなく、<strong>聞いたこと</strong>を語り、また、これから起こることをあなたがたに告げるからである」（<a href="https://bibleox.com/ja/jp-ni/in/16/#L13">ヨハ. 16:13</a>）</p></blockquote><h2>良しとされる</h2><blockquote><p>「<strong>聖霊とわたしたちは</strong>、次の必要な事柄以外、一切あなたがたに重荷を負わせないことに<strong>決めました</strong>」（<a href="https://bibleox.com/ja/jp-ni/act/15/#L28">使. 15:28</a>）</p></blockquote><h2>住まわれる</h2><blockquote><p>「あなたがたは、自分が神の神殿であり、<strong>神の霊が自分たちの内に住んでいる</strong>ことを知らないのですか」（<a href="https://bibleox.com/ja/jp-ni/1kor/3/#L16">１コリ. 3:16</a>）</p></blockquote><h2>示される</h2><blockquote><p>「このことによって<strong>聖霊は</strong>、第一の幕屋がなお存続しているかぎり、聖所への道はまだ開かれていないことを<strong>示しておられます</strong>」（<a href="https://bibleox.com/ja/jp-ni/evr/9/#L8">ヘブ. 9:8</a>）</p></blockquote><h2>証しされる</h2><blockquote><p>「<strong>聖霊もまた、わたしたちに</strong>次のように<strong>証ししておられます</strong>」（<a href="https://bibleox.com/ja/jp-ni/evr/10/#L15">ヘブ. 10:15</a>）</p></blockquote><h2>聖霊は試される</h2><blockquote><p>「ペトロは言った。『二人で示し合わせて、<strong>主の霊を試す</strong>とは、何としたことか。見なさい。あなたの夫を葬りに行った人たちが、もう入り口まで来ている。今度はあなたを担ぎ出すだろう』」（<a href="https://bibleox.com/ja/jp-ni/act/5/#L9">使. 5:9</a>）</p></blockquote><h2>侮辱される</h2><blockquote><p>「まして、神の子を足げにし、自分が聖なる者とされた契約の血を汚れたものと見なし、その上、<strong>恵みの霊を侮辱する</strong>者は、どれほど重い刑罰に値すると思いますか」（<a href="https://bibleox.com/ja/jp-ni/evr/10/#L29">ヘブ. 10:29</a>）</p></blockquote><h2>冒瀆される</h2><blockquote><p>「だから、言っておく。人が犯す罪や冒瀆は、どんなものでも赦されるが、<strong>“霊”に対する冒瀆</strong>は赦されない」（<a href="https://bibleox.com/ja/jp-ni/mf/12/#L31">マタ. 12:31</a>）</p></blockquote><h2>人は聖霊を欺こうとする</h2><blockquote><p>「すると、ペトロは言った。『アナニア、なぜ、あなたはサタンに心を奪われ、<strong>聖霊を欺いて</strong>、土地の代金をごまかしたのか』」（<a href="https://bibleox.com/ja/jp-ni/act/5/#L3">使. 5:3</a>）</p></blockquote><h2>逆らわれる</h2><blockquote><p>「かたくなで、心と耳に割礼を受けていない人たち、<strong>あなたがたは、いつも聖霊に逆らっています</strong>。あなたがたの先祖が逆らったように、あなたがたもそうしているのです」（<a href="https://bibleox.com/ja/jp-ni/act/7/#L51">使. 7:51</a>）</p></blockquote>

  - src: Отец-Бог
    path: Ft3q_父は神である
    title: 父は神である
    menu: { parent: "神/父", title: "父は神である", priority: 1 }
    body: |-
      <blockquote><p>「<strong>父である神</strong>が、人の子を認証されたからである」（<a href="https://bibleox.com/ja/jp-ni/in/6/#L27">ヨハ. 6:27</a>）</p></blockquote><blockquote><p>「イエスはお答えになった。『わたしが自分自身のために栄光を求めようとしているのであれば、わたしの栄光はむなしい。<strong>わたしに栄光を与えてくださるのはわたしの父であって</strong>、あなたたちはこの方について、<strong>「我々の神だ」</strong>と言っている』」（<a href="https://bibleox.com/ja/jp-ni/in/8/#L54">ヨハ. 8:54</a>）</p></blockquote><blockquote><p>「わたしたちの主イエス・キリストの<strong>父である神</strong>、慈愛に満ちた父、慰めを豊かにくださる神がほめたたえられますように」（<a href="https://bibleox.com/ja/jp-ni/2kor/1/#L3">２コリ. 1:3</a>）</p></blockquote><blockquote><p>「わたしたちの主イエス・キリストの<strong>父である神</strong>は、ほめたたえられますように。神は、わたしたちをキリストにおいて、天のあらゆる霊的な祝福で満たしてくださいました」（<a href="https://bibleox.com/ja/jp-ni/ef/1/#L3">エフェ. 1:3</a>）</p></blockquote><blockquote><p>「あなたがたは、<strong>父である神</strong>があらかじめ立てられた御計画に基づいて、“霊”によって聖なる者とされ、イエス・キリストに従い、また、その血を注ぎかけていただくために選ばれたのです。恵みと平和が、あなたがたにますます豊かに与えられるように」（<a href="https://bibleox.com/ja/jp-ni/1pet/1/#L2">１ペト. 1:2</a>）</p></blockquote>

  - src: СвятойДух-Бог
    path: Hs9g_聖霊は神である
    title: 聖霊は神である
    menu: { parent: "神/聖霊", title: "聖霊は神である", priority: 1 }
    body: |-
      <h2>アナニアは聖霊を欺いた。それは神を欺いたことである</h2><blockquote><p>「すると、ペトロは言った。『アナニア、なぜ、あなたはサタンに心を奪われ、<strong>聖霊を欺いて</strong>、土地の代金をごまかしたのか。売らないでおけば、あなたのものだったし、また、売っても、その代金は自分の思いどおりになったのではないか。どうして、こんなことをする気になったのか。<strong>あなたは人間を欺いたのではなく、神を欺いたのだ</strong>』」（<a href="https://bibleox.com/ja/jp-ni/act/5/#L3-4">使. 5:3-4</a>）</p></blockquote><h2>神は預言者たちを通して語られた</h2><blockquote><p>「<strong>神は</strong>、かつて<strong>預言者たちによって</strong>、多くのかたちで、また多くのしかたで先祖に<strong>語られた</strong>」（<a href="https://bibleox.com/ja/jp-ni/evr/1/#L1">ヘブ. 1:1</a>）</p></blockquote><blockquote><p>「キリスト・イエスの僕、神の福音のために選び出され、召されて使徒となったパウロから、――この福音は、<strong>神が</strong>既に聖書の中で<strong>預言者を通して約束された</strong>もので」（<a href="https://bibleox.com/ja/jp-ni/rim/1/#L1-2">ロマ. 1:1-2</a>）</p></blockquote><blockquote><p>「しかし、<strong>神はすべての預言者の口を通して予告しておられた</strong>メシアの苦しみを、このようにして実現なさったのです。&lt;…&gt; このイエスは、<strong>神が聖なる預言者たちの口を通して</strong>昔から<strong>語られた</strong>、万物が新しくなるその時まで、必ず天にとどまることになっています」（<a href="https://bibleox.com/ja/jp-ni/act/3/#L18,21">使. 3:18,21</a>）</p></blockquote><h2>預言者たちを通して語られたのは聖霊である</h2><blockquote><p>「彼らが互いに意見が一致しないまま、立ち去ろうとしたとき、パウロはひと言次のように言った。『<strong>聖霊は、預言者イザヤを通して</strong>、実に正しくあなたがたの先祖に、<strong>語られました</strong>。「この民のところへ行って言え。あなたたちは聞くには聞くが、決して理解せず、見るには見るが、決して認めない」』」（<a href="https://bibleox.com/ja/jp-ni/act/28/#L25-26">使. 28:25-26</a>）</p></blockquote><blockquote><p>「だから、<strong>聖霊がこう言われる</strong>とおりです。『今日、あなたたちが神の声を聞くなら』」（<a href="https://bibleox.com/ja/jp-ni/evr/3/#L7">ヘブ. 3:7</a>）</p></blockquote><blockquote><p>「兄弟たち、イエスを捕らえた者たちの手引きをしたあのユダについては、<strong>聖霊がダビデの口を通して預言しています</strong>。この聖書の言葉は、実現しなければならなかったのです」（<a href="https://bibleox.com/ja/jp-ni/act/1/#L16">使. 1:16</a>）</p></blockquote>
