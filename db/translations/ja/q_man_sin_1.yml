    body: |-
      <p>聖書に挙げられている死に至る罪のいくつか：</p><blockquote><p>「あらゆる不義、悪、むさぼり、悪意に満ち、ねたみ、殺意、不和、欺き、邪念にあふれ、陰口を言い、人をそしり、神を憎み、人を侮り、高慢であり、大言を吐き、悪事をたくらみ、親に逆らい、無知、不誠実、無情、無慈悲です。彼らは、<strong>このようなことを行う者が死に値する</strong>という神の定めを知っていながら、自分でそれを行うだけではなく、他人の同じ行為をも是認しています」（<a href="https://bibleox.com/ja/jp-ni/rim/1/#L29-32">ロマ. 1:29-32</a>）<em>（ビザンティン本文（多数派写本）では、29節に「淫行」（πορνείᾳ）、31節に「和解しない者」（ἀσπόνδους）という語が加わっています。）</em></p></blockquote><blockquote><p>「肉の業は明らかです。それは、姦淫、わいせつ、好色、偶像礼拝、魔術、敵意、争い、そねみ、怒り、利己心、不和、仲間争い、ねたみ、泥酔、酒宴、その他このたぐいのものです。以前言っておいたように、ここでも前もって言いますが、<strong>このようなことを行う者は、神の国を受け継ぐことはできません</strong>」（<a href="https://bibleox.com/ja/jp-ni/gal/5/#L19-21">ガラ. 5:19-21</a>）<em>（「仲間争い」は、ギリシア語原文では αἱρέσεις —「異端」です。ビザンティン本文（多数派写本）では、21節に「殺人」（φόνοι）という語が加わっています。）</em></p></blockquote><blockquote><p>「正しくない者が神の国を受け継げないことを、知らないのですか。思い違いをしてはいけない。みだらな者、偶像を礼拝する者、姦通する者、男娼、男色をする者、泥棒、強欲な者、酒におぼれる者、人を悪く言う者、人の物を奪う者は、決して<strong>神の国を受け継ぐことができません</strong>」（<a href="https://bibleox.com/ja/jp-ni/1kor/6/#L9-10">１コリ. 6:9-10</a>）</p></blockquote><blockquote><p>「すべてみだらな者、汚れた者、また貪欲な者、つまり、偶像礼拝者は、<strong>キリストと神との国を受け継ぐことはできません</strong>。このことをよくわきまえなさい」（<a href="https://bibleox.com/ja/jp-ni/ef/5/#L5">エフェ. 5:5</a>）</p></blockquote><blockquote><p>「しかし、おくびょうな者、不信仰な者、忌まわしい者、人を殺す者、みだらな行いをする者、魔術を使う者、偶像を拝む者、すべてうそを言う者、このような者たちに対する報いは、<strong>火と硫黄の燃える池である</strong>。それが、第二の死である」（<a href="https://bibleox.com/ja/jp-ni/otkr/21/#L8">黙. 21:8</a>）</p></blockquote><blockquote><p>「命の木に対する権利を与えられ、門を通って都に入れるように、自分の衣を洗い清める者は幸いである。犬のような者、魔術を使う者、みだらなことをする者、人を殺す者、偶像を拝む者、すべて偽りを好み、また行う者は<strong>都の外にいる</strong>」（<a href="https://bibleox.com/ja/jp-ni/otkr/22/#L14-15">黙. 22:14-15</a>）<em>（「自分の衣を洗い清める者」は一部の写本の読みで、ビザンティン本文（多数派写本）では ποιοῦντες τὰς ἐντολὰς αὐτοῦ —「その戒めを行う者」です。）</em></p></blockquote><blockquote><p>「うそをつく証人は罰を免れることはない。<strong><mark>欺きの発言をすれば逃げおおせることはない</mark></strong>。&lt;…&gt; うそをつく証人は罰を免れることはない。<strong><mark>欺きの発言をする者は滅びる</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/pr/19/#L5,9">箴. 19:5,9</a>）</p></blockquote><p>人が生きていて悔い改めを献げ、キリストの教会に入ることができる間は、すべての罪が赦されえます。人は、体のうちに生きていた間に行ったことによって裁かれます：</p><blockquote><p><em>「なぜなら、わたしたちは皆、キリストの裁きの座の前に立ち、善であれ悪であれ、めいめい</em><strong><em>体を住みかとしていたときに行ったこと</em></strong><em>に応じて、報いを受けねばならないからです」（</em><a href="https://bibleox.com/ja/jp-ni/2kor/5/#L10"><em>２コリ. 5:10</em></a><em>）</em></p></blockquote>

  - src: ADHo_Гордость
    path: Pr1d_高慢
    title: 高慢
    menu: { parent: "人間/罪", title: "高慢", priority: 1 }
    body: |-
      <h2>高慢の断罪</h2><blockquote><p><em>「皆互いに謙遜を身に着けなさい。なぜなら、</em><strong><em>『神は、高慢な者を敵とし</em></strong><em>、謙遜な者には恵みをお与えになる』からです」（</em><a href="https://bibleox.com/ja/jp-ni/1pet/5/#L5"><em>１ペト. 5:5</em></a><em>）（</em><a href="https://bibleox.com/ja/jp-ni/iak/4/#L6"><em>ヤコ. 4:6</em></a><em>）</em></p></blockquote><blockquote><p><em>「</em><strong><em>すべて高慢な心を主はいとわれる</em></strong><em>。子孫は罪なしとされることはない」（</em><a href="https://bibleox.com/ja/jp-ni/pr/16/#L5"><em>箴. 16:5</em></a><em>）</em></p></blockquote><blockquote><p><em>「</em><strong><em>主を畏れることは、悪を憎むこと。傲慢、驕り</em></strong><em>、悪の道暴言をはく口を、わたしは憎む」（</em><a href="https://bibleox.com/ja/jp-ni/pr/8/#L13"><em>箴. 8:13</em></a><em>）</em></p></blockquote><h2>高慢の現れ</h2><blockquote><p><em>「見てもらおうとして、人の前で善行をしないように注意しなさい。さもないと、あなたがたの天の父のもとで報いをいただけないことになる。だから、あなたは施しをするときには、</em><strong><em>偽善者たちが人からほめられようと</em></strong><em>会堂や街角でするように、</em><strong><em>自分の前でラッパを吹き鳴らしてはならない</em></strong><em>。はっきりあなたがたに言っておく。彼らは既に報いを受けている。施しをするときは、右の手のすることを左の手に知らせてはならない。あなたの施しを人目につかせないためである。そうすれば、隠れたことを見ておられる父が、あなたに報いてくださる。祈るときにも、あなたがたは偽善者のようであってはならない。偽善者たちは、</em><strong><em>人に見てもらおうと</em></strong><em>、会堂や大通りの角に立って祈りたがる。はっきり言っておく。彼らは既に報いを受けている。だから、あなたが祈るときは、奥まった自分の部屋に入って戸を閉め、隠れたところにおられるあなたの父に祈りなさい。そうすれば、隠れたことを見ておられるあなたの父が報いてくださる」（</em><a href="https://bibleox.com/ja/jp-ni/mf/6/#L1-6"><em>マタ. 6:1-6</em></a><em>）</em></p></blockquote><blockquote><p><em>「</em><strong><em>自分は正しい人間だとうぬぼれて、他人を見下している</em></strong><em>人々に対しても、イエスは次のたとえを話された。『二人の人が祈るために神殿に上った。一人はファリサイ派の人で、もう一人は徴税人だった。ファリサイ派の人は立って、心の中でこのように祈った。「神様、わたしは</em><strong><em>ほかの人たちのように</em></strong><em>、奪い取る者、不正な者、姦通を犯す者でなく、また、この徴税人のような者でもないことを感謝します。わたしは週に二度断食し、全収入の十分の一を献げています」』」（</em><a href="https://bibleox.com/ja/jp-ni/lk/18/#L9-12"><em>ルカ. 18:9-12</em></a><em>）</em></p></blockquote><blockquote><p><em>「人を裁くな。そうすれば、あなたがたも裁かれることがない。人を罪人だと決めるな。そうすれば、あなたがたも罪人だと決められることがない。赦しなさい。そうすれば、あなたがたも赦される」（</em><a href="https://bibleox.com/ja/jp-ni/lk/6/#L37"><em>ルカ. 6:37</em></a><em>）</em></p></blockquote><blockquote><p><em>「ものの見えない案内人、あなたたちはぶよ一匹さえも漉して除くが、らくだは飲み込んでいる」（</em><a href="https://bibleox.com/ja/jp-ni/mf/23/#L24"><em>マタ. 23:24</em></a><em>）</em></p></blockquote><h2>高慢は悪魔の罪である</h2><blockquote><p>「人の子よ、ティルスの王に対して嘆きの歌をうたい、彼に言いなさい。主なる神はこう言われる。お前はあるべき姿を印章としたものであり知恵に満ち、美しさの極みである。お前は神の園であるエデンにいた。あらゆる宝石がお前を包んでいた。ルビー、黄玉、紫水晶かんらん石、縞めのう、碧玉サファイア、ざくろ石、エメラルド。それらは金で作られた留め金でお前に着けられていた。それらはお前が創造された日に整えられた。<strong>わたしはお前を翼を広げて覆うケルブとして造った</strong>。お前は神の聖なる山にいて火の石の間を歩いていた。お前が創造された日からお前の歩みは無垢であったが<strong>ついに不正がお前の中に見いだされるようになった</strong>。お前の取り引きが盛んになると<strong>お前の中に不法が満ち罪を犯すようになった</strong>。そこで、わたしはお前を神の山から追い出し翼で覆うケルブであるお前を火の石の間から滅ぼした。<strong><mark>お前の心は美しさのゆえに高慢となり</mark>栄華のゆえに知恵を堕落させた</strong>。わたしはお前を地の上に投げ落とし王たちの前で見せ物とした」（<a href="https://bibleox.com/ja/jp-ni/iez/28/#L12-17">エゼ. 28:12-17</a>）</p></blockquote><blockquote><p>「ああ、お前は天から落ちた明けの明星、曙の子よ。お前は地に投げ落とされたもろもろの国を倒した者よ。かつて、<strong><mark>お前は心に思った。『わたしは天に上り王座を神の星よりも高く据え</mark>神々の集う北の果ての山に座し雲の頂に登っていと高き者のようになろう』と</strong>」（<a href="https://bibleox.com/ja/jp-ni/is/14/#L12-14">イザ. 14:12-14</a>）</p></blockquote>

  - src: непрощение
    path: Uf2g_赦さないこと
    title: 赦さないこと
    meta_desc: 赦さない罪、無慈悲と残酷さについての聖書の引用
    menu: { parent: "人間/罪", title: "赦さないこと", priority: 2 }
    body: |-
      <blockquote><p>「<strong>憐れみ深い人々</strong>は、幸いである、その人たちは<strong>憐れみを受ける</strong>」（<a href="https://bibleox.com/ja/jp-ni/mf/5/#L7">マタ. 5:7</a>）</p></blockquote><blockquote><p>「だから、こう祈りなさい。『天におられるわたしたちの父よ、御名が崇められますように。&lt;…&gt; <strong>わたしたちの負い目を赦してください、わたしたちも自分に負い目のある人を赦しましたように</strong>。』&lt;…&gt; <strong>もし人の過ちを赦すなら、あなたがたの天の父もあなたがたの過ちをお赦しになる。しかし、もし人を赦さないなら、あなたがたの父もあなたがたの過ちをお赦しにならない</strong>」（<a href="https://bibleox.com/ja/jp-ni/mf/6/#L9,12,14-15">マタ. 6:9,12,14-15</a>）</p></blockquote><blockquote><p>「人を裁くな。そうすれば、あなたがたも裁かれることがない。人を罪人だと決めるな。そうすれば、あなたがたも罪人だと決められることがない。<strong>赦しなさい。そうすれば、あなたがたも赦される</strong>」（<a href="https://bibleox.com/ja/jp-ni/lk/6/#L37">ルカ. 6:37</a>）</p></blockquote><blockquote><p>「そのとき、ペトロがイエスのところに来て言った。『主よ、<strong>兄弟がわたしに対して罪を犯したなら、何回赦すべきでしょうか</strong>。七回までですか。』イエスは言われた。『あなたに言っておく。七回どころか七の七十倍までも赦しなさい』」（<a href="https://bibleox.com/ja/jp-ni/mf/18/#L21-22">マタ. 18:21-22</a>）</p></blockquote><blockquote><p>「互いに親切にし、憐れみの心で接し、<strong>神がキリストによってあなたがたを赦してくださったように</strong>、<strong>赦し合いなさい</strong>」（<a href="https://bibleox.com/ja/jp-ni/ef/4/#L32">エフェ. 4:32</a>）</p></blockquote><blockquote><p>「<strong>わたしたち</strong>自身も<strong>かつては</strong>、無分別で、不従順で、道に迷い、種々の情欲と快楽のとりことなり、<strong>悪意</strong>とねたみ<strong>を抱いて暮らし</strong>、忌み嫌われ、<strong>憎み合っていたのです</strong>」（<a href="https://bibleox.com/ja/jp-ni/tit/3/#L3">テト. 3:3</a>）</p></blockquote><blockquote><p>「だから、<strong>あなたが祭壇に供え物を献げようとし、兄弟が自分に反感を持っているのをそこで思い出したなら、その供え物を祭壇の前に置き、まず行って兄弟と仲直りをし</strong>、それから帰って来て、供え物を献げなさい。<strong>あなたを訴える人と一緒に道を行く場合、途中で早く和解しなさい</strong>。さもないと、その人はあなたを裁判官に引き渡し、裁判官は下役に引き渡し、あなたは牢に投げ込まれるにちがいない。はっきり言っておく。最後の一クァドランスを返すまで、決してそこから出ることはできない」（<a href="https://bibleox.com/ja/jp-ni/mf/5/#L23-26">マタ. 5:23-26</a>）</p></blockquote><blockquote><p>「<strong>兄弟たち、裁きを受けないようにするためには、互いに不平を言わぬことです</strong>。裁く方が戸口に立っておられます」（<a href="https://bibleox.com/ja/jp-ni/iak/5/#L9">ヤコ. 5:9</a>）</p></blockquote><blockquote><p>「あらゆる不義、悪、むさぼり、悪意に満ち、ねたみ、殺意、<strong>不和</strong>、欺き、邪念にあふれ、陰口を言い、人をそしり、神を憎み、<strong>人を侮り</strong>、<strong>高慢であり</strong>、大言を吐き、悪事をたくらみ、親に逆らい、無知、不誠実、<strong>無情</strong>、<strong>無慈悲です</strong>。彼らは、<strong>このようなことを行う者が死に値する</strong>という神の定めを知っていながら、自分でそれを行うだけではなく、他人の同じ行為をも是認しています」（<a href="https://bibleox.com/ja/jp-ni/rim/1/#L29-32">ロマ. 1:29-32</a>）<em>（ビザンティン本文（多数派写本）では、29節に「淫行」（πορνείᾳ）、31節に「和解しない者」（ἀσπόνδους）という語が加わっています。）</em></p></blockquote><blockquote><p>「肉の業は明らかです。それは、姦淫、わいせつ、好色、偶像礼拝、魔術、敵意、<strong>争い</strong>、そねみ、<strong>怒り</strong>、利己心、<strong>不和</strong>、仲間争い、ねたみ、泥酔、酒宴、その他このたぐいのものです。以前言っておいたように、ここでも前もって言いますが、このようなことを行う者は、<strong>神の国を受け継ぐことはできません</strong>」（<a href="https://bibleox.com/ja/jp-ni/gal/5/#L19-21">ガラ. 5:19-21</a>）</p></blockquote><blockquote><p>「そこで、主君はその家来を呼びつけて言った。<strong>『不届きな家来だ。お前が頼んだから、借金を全部帳消しにしてやったのだ。わたしがお前を憐れんでやったように、お前も自分の仲間を憐れんでやるべきではなかったか。』</strong>そして、主君は怒って、借金をすっかり返済するまでと、家来を牢役人に引き渡した。<strong>あなたがたの一人一人が、心から兄弟を赦さないなら、わたしの天の父もあなたがたに同じようになさるであろう</strong>」（<a href="https://bibleox.com/ja/jp-ni/mf/18/#L32-35">マタ. 18:32-35</a>）</p></blockquote>

  - src: cICd_Ложь_обман
    path: Ly3g_偽り
    title: 偽り（欺き）
    menu: { parent: "人間/罪", title: "偽り", priority: 3 }
    body: |-
      <blockquote><p>「あなたたちは、<strong><mark>悪魔である父</mark></strong>から出た者であって、その父の欲望を満たしたいと思っている。悪魔は最初から人殺しであって、真理をよりどころとしていない。彼の内には真理がないからだ。悪魔が偽りを言うときは、その本性から言っている。<strong><mark>自分が偽り者であり、その父だからである</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/in/8/#L44">ヨハ. 8:44</a>）</p></blockquote><blockquote><p>「うそをつく証人は罰を免れることはない。<strong>欺きの発言をすれば逃げおおせることはない</strong>」（<a href="https://bibleox.com/ja/jp-ni/pr/19/#L5">箴. 19:5</a>）</p></blockquote><blockquote><p>「<strong>隣人に関して偽証してはならない</strong>」（<a href="https://bibleox.com/ja/jp-ni/ish/20/#L16">出. 20:16</a>）</p></blockquote><blockquote><p>「あなたたちは盗んではならない。<strong>うそをついてはならない。互いに欺いてはならない</strong>」（<a href="https://bibleox.com/ja/jp-ni/lev/19/#L11">レビ. 19:11</a>）</p></blockquote><blockquote><p>「今は、そのすべてを、すなわち、怒り、憤り、悪意、そしり、口から出る恥ずべき言葉を捨てなさい。<strong>互いにうそをついてはなりません</strong>。古い人をその行いと共に脱ぎ捨て」（<a href="https://bibleox.com/ja/jp-ni/kol/3/#L8-9">コロ. 3:8-9</a>）</p></blockquote><blockquote><p>「だから、<strong>偽りを捨て、それぞれ隣人に対して真実を語りなさい</strong>。わたしたちは、互いに体の一部なのです」（<a href="https://bibleox.com/ja/jp-ni/ef/4/#L25">エフェ. 4:25</a>）</p></blockquote><blockquote><p>「<strong>不義はすべて罪です</strong>」（<a href="https://bibleox.com/ja/jp-ni/1in/5/#L17">１ヨハ. 5:17</a>）</p></blockquote><blockquote><p>「<strong>うそをつく唇を主はいとわれる</strong>。忠実を尽くす人を主は喜び迎えられる」（<a href="https://bibleox.com/ja/jp-ni/pr/12/#L22">箴. 12:22</a>）</p></blockquote><blockquote><p>「誇り高い者は御目に向かって立つことができず悪を行う者はすべて憎まれます。<strong>主よ、あなたは偽って語る者を滅ぼし</strong>流血の罪を犯す者、欺く者をいとわれます」（<a href="https://bibleox.com/ja/jp-ni/ps/5/#L6-7">詩. 5:6-7</a>）</p></blockquote><blockquote><p>「群れの中に傷のない雄の動物を持っており、それをささげると誓いながら、傷のあるものを主にささげる<strong>偽り者は呪われよ</strong>。わたしは大いなる王で、わたしの名は諸国の間で畏れられている、と万軍の主は言われる」（<a href="https://bibleox.com/ja/jp-ni/mal/1/#L14">マラ. 1:14</a>）</p></blockquote>

  - src: грех-осуждение
