  - src: аборт-грех
    path: Ab7r_中絶
    title: 中絶
    title_sub: 中絶（子供を殺すこと）についての聖書の引用
    meta_desc: 中絶（子供を殺すこと）についての聖書の引用
    menu: { parent: "人間/罪", title: "中絶", priority: 7 }
    body: |-
      <h2>殺人は罪である</h2><blockquote>「<b>殺してはならない</b>」（<a href="https://bibleox.com/ja/jp-ni/ish/20/#L13">出. 20:13</a>）（<a href="https://bibleox.com/ja/jp-ni/vtor/5/#L17">申. 5:17</a>）</blockquote><blockquote>「イエスは言われた。『<b>殺すな</b>』」（<a href="https://bibleox.com/ja/jp-ni/mf/19/#L18">マタ. 19:18</a>）（<a href="https://bibleox.com/ja/jp-ni/mf/5/#L21">マタ. 5:21</a>）（<a href="https://bibleox.com/ja/jp-ni/mk/10/#L19">マコ. 10:19</a>）（<a href="https://bibleox.com/ja/jp-ni/lk/18/#L20">ルカ. 18:20</a>）（<a href="https://bibleox.com/ja/jp-ni/rim/13/#L9">ロマ. 13:9</a>）</blockquote><p>すべての幼子は、まだ母の胎にいても、すでにそこから出ていても、人間です。そして人を殺すことは罪です。古代のキリスト教文書（ディダケー）は、このことを直接言っています：</p><blockquote>「<b>堕胎によって子供を殺してはならない</b>。また生まれた子を殺してはならない」（<a href="https://bibleox.com/en/en/w/Didache/#HH-2">ディダケー</a>、英語。英訳からの訳）</blockquote><h2>幼子も人間である。胎内においても胎外においても</h2><p>聖書は、予定よりずっと早く（妊娠3～4か月で）生まれた者たちを幼子と呼んでいます：</p><blockquote>「そして、一歳の幼児が自分で声を出して話し、<b>妊婦は三、四か月の未熟児を産むが</b>、その子たちは生きて跳ね回る」（<a href="https://bibleox.com/ja/jp-ni/3ezd/6/#L21">３エズ. 6:21</a>）</blockquote><p>生まれたばかりの幼子を殺すことを拒んだ助産婦たちへの称賛：</p><blockquote>「助産婦はいずれも神を畏れていたので、エジプト王が命じたとおりにはせず、<b>男の子も生かしておいた</b>。&lt;…&gt; 神はこの助産婦たちに恵みを与えられた。民は数を増し、甚だ強くなった。助産婦たちは神を畏れていたので、神は彼女たちにも子宝を恵まれた」（<a href="https://bibleox.com/ja/jp-ni/ish/1/#L17,20-21">出. 1:17,20-21</a>）</blockquote><p>預言者洗礼者ヨハネは、生まれる前から、まさに母の胎の中で聖霊に満たされていました。つまり、いつか人間になる「何か」ではなく、預言者ヨハネ自身が、まだ胎内にいるときに神の霊の神殿となるのです。</p><blockquote>「彼は主の御前に偉大な人になり、ぶどう酒や強い酒を飲まず、<b>既に母の胎にいるときから聖霊に満たされていて</b>」（<a href="https://bibleox.com/ja/jp-ni/lk/1/#L15">ルカ. 1:15</a>）</blockquote><p>神が母の胎内で造られたのは、後に人間になった「何か」ではなく、人間そのものであり、その人は後に胎から出て来た、すなわち生まれたにすぎません。そして神は、その人を生まれる前から聖別されました：</p><blockquote>「わたしはあなたを<b>母の胎内に造る</b>前からあなたを知っていた。<b>母の胎から生まれる</b>前にわたしはあなたを聖別し諸国民の預言者として立てた」（<a href="https://bibleox.com/ja/jp-ni/ier/1/#L5">エレ. 1:5</a>）</blockquote><p>多くの苦しみを受けた預言者ヨブも同じことを言っています。神が胎内で造られるのはわたしたちであって、後に人間になる「何か」ではありません：</p><blockquote>「<b>わたしを胎内に造ってくださった方</b>が彼らをもお造りになり我々は同じ方によって<b>母の胎に置かれた</b>のだから」（<a href="https://bibleox.com/ja/jp-ni/iov/31/#L15">ヨブ. 31:15</a>）</blockquote><p>母の胎内での人の発達の過程は、神御自身の創造の業として描かれています。その描き方は、人がすでに存在していて、世に出て来るために衣のように肉をまとわせられる、というものです。ヨブは、発達して後にヨブになった何かの素材について語っているのではありません。彼はすぐに胎芽を自分自身として語っています。あなたは<b>わたしに</b>肉を着せてくださったではありませんか、と。</p><blockquote>「御手をもってわたしを形づくってくださったのに&lt;…&gt; 心に留めてください土くれとしてわたしを造り塵に戻されるのだということを。<b>あなたはわたしを乳のように注ぎ出しチーズのように固め骨と筋を編み合わせそれに皮と肉を着せてくださった</b>。わたしに命と恵みを約束しあなたの加護によってわたしの霊は保たれていました」（<a href="https://bibleox.com/ja/jp-ni/iov/10/#L8-12">ヨブ. 10:8-12</a>）</blockquote><p>預言者ダビデも同じことを描いています：</p><blockquote>「あなたは、わたしの内臓を造り<b>母の胎内にわたしを組み立ててくださった</b>。&lt;…&gt; <b>秘められたところでわたしは造られ</b>深い地の底で織りなされた。あなたには、わたしの骨も隠されてはいない。<b>胎児であったわたしをあなたの目は見ておられた</b>。わたしの日々はあなたの書にすべて記されているまだその一日も造られないうちから」（<a href="https://bibleox.com/ja/jp-ni/ps/139/#L13,15-16">詩. 139:13,15-16</a>）</blockquote>

  - src: колдовство
    path: Wc8f_魔術
    title: 魔術
    menu: { parent: "人間/罪", title: "魔術", priority: 8 }
    body: |-
      <h2>罪である</h2><p>「魔術」の項には、ほかにも次のものがすべて含まれます：</p><ul><li>（あらゆる種類の）占い、</li><li>霊を呼び出すこと、</li><li>（黒魔術、白魔術など、あらゆる種類の）魔法を信じること、</li><li>お守り（赤い糸を含む）の力を信じること、</li><li>まじないをかけた物、</li><li>ホロスコープ（占星術）、</li><li>霊能者に頼ること、</li><li>呪術師、</li><li>魔法使い、</li><li>魔女、</li><li>易者、</li><li>呪文を唱える者、</li><li>「邪視」「呪い」「先祖の呪い」を解くという老婆たち</li><li>など：</li></ul><blockquote>「あなたが、あなたの神、主の与えられる土地に入ったならば、その国々のいとうべき習慣を見習ってはならない。あなたの間に、<b>自分の息子、娘に火の中を通らせる者</b>、<b>占い師</b>、<b>卜者</b>、<b>易者</b>、<b>呪術師</b>、<b>呪文を唱える者</b>、<b>口寄せ</b>、<b>霊媒</b>、<b>死者に伺いを立てる者</b>などがいてはならない。<b>これらのことを行う者をすべて、主はいとわれる</b>。これらのいとうべき行いのゆえに、あなたの神、主は彼らをあなたの前から追い払われるであろう。あなたは、あなたの神、主と共にあって全き者でなければならない。あなたが追い払おうとしているこれらの国々の民は、<b>卜者</b>や<b>占い師に尋ねるが</b>、あなたの神、主はあなたがそうすることをお許しにならない」（<a href="https://bibleox.com/ja/jp-ni/vtor/18/#L9-14">申. 18:9-14</a>）</blockquote><blockquote>「息子や娘に火の中を通らせ、<b>占い</b>や<b>まじないを行い</b>、自らを売り渡して主の目に悪とされることを行い、主の怒りを招いた」（<a href="https://bibleox.com/ja/jp-ni/4ts/17/#L17">王下. 17:17</a>）</blockquote><blockquote>「彼はベン・ヒノムの谷で<b>自分の子らに火の中を通らせ</b>、<b>占い</b>や<b>まじないを行い</b>、<b>魔術</b>や<b>口寄せ</b>、<b>霊媒を用いる</b>など、<b>主の目に悪とされることを数々行って</b>主の怒りを招いた。彼はまた<b>像、彫像を造り</b>、神殿に置いた」（<a href="https://bibleox.com/ja/jp-ni/2par/33/#L6-7">代下. 33:6-7</a>）</blockquote><blockquote>「人々は必ずあなたたちに言う。『<b>ささやきつぶやく口寄せ</b>や、<b>霊媒</b>に伺いを立てよ。民は、命ある者のために、死者によって、自分の神に伺いを立てるべきではないか』と」（<a href="https://bibleox.com/ja/jp-ni/is/8/#L19">イザ. 8:19</a>）<em>（新共同訳はこの節の後半を口寄せを勧める者たちの言葉として訳していますが、ヘブライ語原文の伝統的な読み方では、後半は預言者の反論です。「<b>民は自分の神に伺いを立てるべきではないか</b>。生きている者のために死者に伺いを立てるのか」。）</em></blockquote><blockquote>「あなたたちは、<b>預言者</b>、<b>占い師</b>、<b>夢占い</b>、<b>卜者</b>、<b>魔法使いたち</b>に聞き従ってはならない。彼らは、バビロンの王に仕えるべきではないと言っているが」（<a href="https://bibleox.com/ja/jp-ni/ier/27/#L9">エレ. 27:9</a>）</blockquote><blockquote>「イスラエルの神、万軍の主はこう言われる。あなたたちのところにいる<b>預言者</b>や<b>占い師たち</b>にだまされてはならない。<b>彼らの見た夢に従ってはならない</b>」（<a href="https://bibleox.com/ja/jp-ni/ier/29/#L8">エレ. 29:8</a>）</blockquote><blockquote>「あなたは言わねばならない。主なる神はこう言われる。災いだ、人々の魂を捕らえようとして、<b>どの手首にも呪術のひもを縫い付け</b>、どんな大きさの頭にも合わせて呪術の頭巾を作る女たちよ。お前たちはわたしの民の魂を捕らえ、自分たちの仲間の魂を生かしておこうとする」（<a href="https://bibleox.com/ja/jp-ni/iez/13/#L18">エゼ. 13:18</a>）</blockquote><blockquote>「それゆえ、主なる神はこう言われる。わたしは、お前たちが、人々の魂を鳥を捕らえるように捕らえるために使っている<b>呪術のひも</b>に立ち向かい、それをお前たちの腕から引きちぎり、お前たちが鳥を捕らえるように捕らえた魂を解き放つ」（<a href="https://bibleox.com/ja/jp-ni/iez/13/#L20">エゼ. 13:20</a>）</blockquote><blockquote>「あなたの贖い主あなたを母の胎内に形づくられた方主はこう言われる。わたしは主、万物の造り主。自ら天を延べ、独り地を踏み広げた。<b>むなしいしるしを告げる者を混乱させ</b><b>占い師を狂わせ</b><b>知者を退けてその知識を愚かなものとする</b>」（<a href="https://bibleox.com/ja/jp-ni/is/44/#L24-25">イザ. 44:24-25</a>）</blockquote><blockquote>「わたしはお前の手から<b>呪文</b>を絶ち<b>魔術師</b>はお前の中から姿を消す。わたしはお前の<b>偶像</b>を絶ちお前の中から石柱を絶つ。お前はもはや自分の手で造ったものにひれ伏すことはない。わたしはお前の中から<b>アシェラ像</b>を引き抜き町々を破壊する」（<a href="https://bibleox.com/ja/jp-ni/mih/5/#L11-13">ミカ. 5:11-13</a>）</blockquote><blockquote>「また彼らは人を殺すこと、<b>まじない</b>、みだらな行い、盗みを悔い改めなかった」（<a href="https://bibleox.com/ja/jp-ni/otkr/9/#L21">黙. 9:21</a>）</blockquote><blockquote>「勝利を得る者は、これらのものを受け継ぐ。わたしはその者の神になり、その者はわたしの子となる。しかし、おくびょうな者、不信仰な者、忌まわしい者、人を殺す者、みだらな行いをする者、<b>魔術を使う者</b>、<b>偶像を拝む者</b>、すべてうそを言う者、このような者たちに対する報いは、火と硫黄の燃える池である。それが、第二の死である」（<a href="https://bibleox.com/ja/jp-ni/otkr/21/#L7-8">黙. 21:7-8</a>）</blockquote><blockquote>「犬のような者、<b>魔術を使う者</b>、みだらなことをする者、人を殺す者、偶像を拝む者、すべて偽りを好み、また行う者は都の外にいる」（<a href="https://bibleox.com/ja/jp-ni/otkr/22/#L15">黙. 22:15</a>）</blockquote><h2>呪文を唱える者や呪術師は神の前では何の力もない。彼らは人々を神の罰から救うことはない</h2><blockquote>「その二つのことが一日のうちに、瞬く間にお前に起こり子を失いやもめとなる苦しみがすべてお前に臨む。どれほど<b>呪文</b>を唱えどれほど強い<b>まじない</b>をしても無駄だ」（<a href="https://bibleox.com/ja/jp-ni/is/47/#L9">イザ. 47:9</a>）</blockquote><blockquote>「<b>まじない</b>と<b>呪文</b>の数々をもって立ち向かえ。若い時から労して身につけたものがあるいは役に立ちそれを追い払うことができるかもしれない。助言が多すぎて、お前は弱ってしまった。<b>天にしるしを見る者</b>、<b>星によって占う者</b><b>新月によってお前の運命を告げる者</b>などを立ち向かわせ、お前を救わせてみよ。見よ、<b>彼らはわらにすぎず、火が彼らを焼き尽くし</b>炎の力から自分の命を救い出しえない。この火は体を温める炭火でも傍らに座るための火でもない。呪文を若い時から労して身につけ売り物としてきた者すら、この様だ。彼らはおのおの勝手に迷って行き<b>お前を救う者はひとりもいない</b>」（<a href="https://bibleox.com/ja/jp-ni/is/47/#L12-15">イザ. 47:12-15</a>）</blockquote><h2>闇の力に頼ることは神への裏切り（姦淫）である</h2><blockquote>「お前たち、<b>女まじない師</b>の子らよ<b>姦淫する男</b>と<b>淫行の女</b>との子孫よここに近づくがよい。お前たちは誰を快楽の相手とするのか。誰に向かって大口を開き、舌を出すのか。お前たちは背きの罪が産んだ子ら<b>偽りの子孫ではないか</b>。大木の陰、すべての茂る木の下で<b>身を焦がし</b>谷間や岩の裂け目で子供を屠る者らではないか」（<a href="https://bibleox.com/ja/jp-ni/is/57/#L3-5">イザ. 57:3-5</a>）</blockquote><blockquote>「<b>呪文</b>を唱えるあでやかな遊女の果てしない<b>淫行</b>のゆえに彼女がその<b>呪文</b>によって諸民族を淫行によって国々をとりこにしたゆえに」（<a href="https://bibleox.com/ja/jp-ni/naum/3/#L4">ナホ. 3:4</a>）</blockquote><blockquote>「裁きのために、わたしはあなたたちに近づき直ちに告発する。<b>呪術を行う者</b>、<b>姦淫する者</b>、偽って誓う者雇い人の賃金を不正に奪う者寡婦、孤児、寄留者を苦しめる者わたしを畏れぬ者らを、と万軍の主は言われる」（<a href="https://bibleox.com/ja/jp-ni/mal/3/#L5">マラ. 3:5</a>）</blockquote><h2>キリスト教に改宗した人々は魔術を捨てた</h2><blockquote>「信仰に入った大勢の人が来て、自分たちの悪行をはっきり告白した。また、<b>魔術</b>を行っていた多くの者も、その書物を持って来て、皆の前で焼き捨てた。その値段を見積もってみると、銀貨五万枚にもなった」（<a href="https://bibleox.com/ja/jp-ni/act/19/#L18-19">使. 19:18-19</a>）</blockquote>
