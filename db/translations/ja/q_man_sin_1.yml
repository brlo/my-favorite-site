    menu: { parent: "人間/罪", title: "人を裁くこと", priority: 4 }
    body: |-
      <p>主イエス・キリストは人を裁くことを禁じておられます：</p><blockquote>「<b>人を裁くな</b>。あなたがたも裁かれないようにするためである」（<a href="https://bibleox.com/ja/jp-ni/mf/7/#L1">マタ. 7:1</a>）</blockquote><blockquote>「<b>人を裁くな</b>。そうすれば、あなたがたも裁かれることがない。<b>人を罪人だと決めるな</b>。そうすれば、あなたがたも罪人だと決められることがない。赦しなさい。そうすれば、あなたがたも赦される」（<a href="https://bibleox.com/ja/jp-ni/lk/6/#L37">ルカ. 6:37</a>）</blockquote><p>これらの言葉は、自分自身がより大きな罪に満ちていながら他人を裁く人々に向けられています：</p><blockquote>「兄弟に向かって、『あなたの目からおが屑を取らせてください』と、どうして言えようか。自分の目に丸太があるではないか。<b>偽善者よ、まず自分の目から丸太を取り除け。そうすれば、はっきり見えるようになって、兄弟の目からおが屑を取り除くことができる</b>」（<a href="https://bibleox.com/ja/jp-ni/mf/7/#L4-5">マタ. 7:4-5</a>）</blockquote><p>同時に、主は正しい裁きをするよう教えておられます：</p><blockquote>「うわべだけで裁くのをやめ、<b>正しい裁きをしなさい</b>」（<a href="https://bibleox.com/ja/jp-ni/in/7/#L24">ヨハ. 7:24</a>）</blockquote><blockquote>「だから、<b>無分別な者とならず</b>、主の御心が何であるかを悟りなさい」（<a href="https://bibleox.com/ja/jp-ni/ef/5/#L17">エフェ. 5:17</a>）</blockquote><blockquote>「あなたがたは、何が正しいかを、<b>どうして自分で判断しないのか</b>」（<a href="https://bibleox.com/ja/jp-ni/lk/12/#L57">ルカ. 12:57</a>）</blockquote><p>使徒たちは裁きの必要について語っています：</p><blockquote>「外部の人々を裁くことは、わたしの務めでしょうか。<b>内部の人々をこそ、あなたがたは裁くべきではありませんか</b>。外部の人々は神がお裁きになります。<b>『あなたがたの中から悪い者を除き去りなさい』</b>」（<a href="https://bibleox.com/ja/jp-ni/1kor/5/#L12-13">１コリ. 5:12-13</a>）</blockquote><blockquote>「あなたがたの間で、一人が仲間の者と争いを起こしたとき、聖なる者たちに訴え出ないで、正しくない人々に訴え出るようなことを、なぜするのです。あなたがたは知らないのですか。聖なる者たちが世を裁くのです。世があなたがたによって裁かれるはずなのに、<b>あなたがたにはささいな事件すら裁く力がないのですか</b>。&lt;…&gt; あなたがたを恥じ入らせるために、わたしは言っています。<b>あなたがたの中には、兄弟を仲裁できるような知恵のある者が、一人もいないのですか</b>」（<a href="https://bibleox.com/ja/jp-ni/1kor/6/#L1-2,5">１コリ. 6:1-2,5</a>）</blockquote>

