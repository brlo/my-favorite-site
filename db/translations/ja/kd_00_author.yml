    body: |-
      <h2>生涯</h2><p>初期キリスト教の護教家の一人であり、アリスティデスと並んで最も早いキリスト教の護教家と考えられています。この人物についてのわずかな情報が、カイサリアの主教エウセビオスの『教会史』の中に保存されています。それによれば、クアドラトゥスは、「いくらかの悪しき者たちが、われらの者たちを悩ませようとしていた」ので、キリスト教の信仰を弁明する弁明書を皇帝ハドリアヌスに献上したというのです。エウセビオスは、この弁明書が自分自身のもとにも、その他多くのキリスト者のもとにも伝わっていると記し、その書を「この人物の聡明さと使徒的な正しい信仰とを輝かしく証しするもの」[1]と呼んでいます。</p><p>エウセビオスは『年代記』の中で、クアドラトゥスを「使徒たちの聞き手」[2]と呼び、この弁明書が書かれた年を主の降誕後の124/5年としています。</p><p>エウセビオスは『教会史』の中で、彼らのもとにクアドラトゥスの著作があることに言及し、その著作からの引用を残しています：</p><blockquote><p>わたしたちの救い主のわざは、いつも人々の目の前にありました。それらは真実のものであったからです。主がいやされた人たち、死者の中から立ち上がらされた人たちは、いやされているそのとき、あるいは立ち上がらされているそのときだけ目にされたのではなく、いつも人々の目の前にいました。救い主が地上に滞在しておられた間だけでなく、主がこの世を去って後も、彼らは長いあいだ生き続け、そのうちの何人かは、わたしたちの時代まで至ったのです[3]</p></blockquote><p>（<a href="https://bibleox.com/ja/grc/w/ΕΚΚΛΗΣΙΑΣΤΙΚΗΣ_ΙΣΤΟΡΙΑΣ-4">エウセビオス『教会史』第4巻第3章（ギリシア語原文）</a>）</p>
    references: |-
      <ol><li><p>原語は「ἀποστολικῆς ὀρθοτομίας」。「ὀρθοτομία」は「（言葉を）正しく切り開くこと」という意味の語で、<a href="https://bibleox.com/ja/jp-ni/2tim/2/#L15">２テモ. 2:15</a>の「ὀρθοτομοῦντα」を想起させます。批評版のギリシア語テキストは、ここで「ἀποστολικῆς ὀρθοδοξίας」（使徒的な正統の信仰）と読んでいます。日本語は後者の意味に従い、「使徒的な正しい信仰」としました。</p></li><li><p>原語は「ἀκροατὴς τῶν ἀποστόλων」——使徒たちの話を直接聞いた者、すなわち使徒たちの弟子であることを示す表現です。</p></li><li><p>引用は、本サイトのギリシア語原文ページ（『教会史』第4巻）に従いました。批評版（シュワルツ版、レイク版）では語句がかなり異なります：「τὰ τοῦ Σωτῆρος ἡμῶν ἔργα ἀεὶ παροικοῦντα ἦν…ἦσαν ἐν ὀφθαλμοῖς…καὶ μέχρι τοῦ νῦν ἔνιοι καὶ ἡμῶν περιμένομεν」。また、原文は「救い主が去って後」（ἀπαλλαγέντος）と言いますが、ロシア語版の引用は「復活の後」と訳しています。日本語はいずれも原文に従いました。</p></li></ol><p>翻訳：ロジオン・ヴラソフ（AIツールを併用）。底本：<a href="https://bibleox.com/ja/grc/w/ΕΚΚΛΗΣΙΑΣΤΙΚΗΣ_ΙΣΤΟΡΙΑΣ-4">本サイトのギリシア語原文</a>（エウセビオス『教会史』第4巻）。参照：『教会史』のロシア語訳（アズブカのサイト）、<a href="https://bibleox.com/ja/en/w/eusebius-the-church-history-4">本サイトの英語版『教会史』第4巻</a>。</p>
