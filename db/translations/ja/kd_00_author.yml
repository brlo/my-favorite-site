    title_sub: 1–2世紀
    meta_desc: 最古のキリスト教護教家の一人、クアドラトゥス。エウセビオス（カイサリアの）が伝える生涯と、皇帝ハドリアヌスに献上された弁明書の断片（ギリシア語原文へのリンク付き）。
    menu: { parent: "1世紀", title: "クアドラトゥス、1–2世紀", priority: 4, replace: "クアドラトゥス（1世紀～2世紀）" }
