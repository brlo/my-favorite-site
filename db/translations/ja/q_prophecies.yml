      <h2>キリストの再臨の前の出来事</h2><h3>地上における反キリストの短い支配</h3><blockquote><p>「（神の子が — 注）［サタンを — 注］底なしの淵に投げ入れ、鍵をかけ、その上に封印を施して、千年が終わるまで、もうそれ以上、諸国の民を惑わさないようにした。その後で、竜はしばらくの間、解放されるはずである。&lt;…&gt; この千年が終わると、サタンはその牢から解放され、地上の四方にいる諸国の民、ゴグとマゴグを惑わそうとして出て行き、彼らを集めて戦わせようとする。その数は海の砂のように多い」（<a href="https://bibleox.com/ja/jp-ni/otkr/20/#L3,7-8">黙. 20:3,7-8</a>）</p></blockquote><p><strong>おそらく三年半（ただし文字どおりでなくてもよい）</strong></p><p>女（教会）は三年半の間、反キリストから身を隠します：</p><blockquote><p>「しかし、女には大きな鷲の翼が二つ与えられた。荒れ野にある自分の場所へ飛んで行くためである。女はここで、蛇から逃れて、<strong>一年、その後二年、またその後半年</strong>の間、養われることになっていた」（<a href="https://bibleox.com/ja/jp-ni/otkr/12/#L14">黙. 12:14</a>）</p></blockquote><blockquote><p>「彼はいと高き方に敵対して語りいと高き方の聖者らを悩ます。彼は時と法を変えようとたくらむ。聖者らは彼の手に渡され<strong>一時期、二時期、半時期</strong>がたつ」（<a href="https://bibleox.com/ja/jp-ni/dan/7/#L25">ダニ. 7:25</a>）</p></blockquote><p>反キリストには四十二か月（12+12+12+6）の権威が与えられます：</p><blockquote><p>「この獣にはまた、大言と冒瀆の言葉を吐く口が与えられ、<strong>四十二か月</strong>の間、活動する権威が与えられた」（<a href="https://bibleox.com/ja/jp-ni/otkr/13/#L5">黙. 13:5</a>）</p></blockquote><p>異邦人は四十二か月（12+12+12+6）の間、教会と戦います：</p><blockquote><p>「しかし、神殿の外の庭はそのままにしておけ。測ってはいけない。そこは異邦人に与えられたからである。彼らは、<strong>四十二か月</strong>の間、この聖なる都を踏みにじるであろう」（<a href="https://bibleox.com/ja/jp-ni/otkr/11/#L2">黙. 11:2</a>）</p></blockquote><p>千二百九十日（365+365+365+182、13日足りない）：</p><blockquote><p>「日ごとの供え物が廃止され、憎むべき荒廃をもたらすものが立てられてから、<strong>千二百九十日</strong>が定められている」（<a href="https://bibleox.com/ja/jp-ni/dan/12/#L11">ダニ. 12:11</a>）</p></blockquote><p><strong>選ばれた人たちのために、反キリストの支配の期間は縮められる</strong></p><blockquote><p>「預言者ダニエルの言った憎むべき破壊者が、聖なる場所に立つのを見たら――読者は悟れ――、&lt;…&gt; そのときには、世界の初めから今までなく、今後も決してないほどの大きな苦難が来るからである。<strong>神がその期間を縮めてくださらなければ、だれ一人救われない。しかし、神は選ばれた人たちのために、その期間を縮めてくださるであろう</strong>」（<a href="https://bibleox.com/ja/jp-ni/mf/24/#L15,21-22">マタ. 24:15,21-22</a>）</p></blockquote><p><strong>反キリストは自分を神と偽る</strong></p><blockquote><p>「だれがどのような手段を用いても、だまされてはいけません。なぜなら、まず、神に対する反逆が起こり、不法の者、つまり、滅びの子が出現しなければならないからです。この者は、<strong>すべて神と呼ばれたり拝まれたりするものに反抗して、傲慢にふるまい、ついには、神殿に座り込み、自分こそは神であると宣言するのです</strong>」（<a href="https://bibleox.com/ja/jp-ni/2sol/2/#L3-4">２テサ. 2:3-4</a>）<em>（「不法の者」は、ビザンティン本文（多数派写本）では ὁ ἄνθρωπος τῆς ἁμαρτίας —「<strong>罪の人</strong>」です。）</em></p></blockquote><p><strong>反キリストの支配の終わり</strong></p><p>再臨の直前、神は反キリストの支配を終わらせ、反キリスト自身とサタンを永遠の罰で打たれます：</p><blockquote><p>「すると、天から火が下って来て、彼らを焼き尽くした。そして彼らを惑わした<strong>悪魔</strong>は、火と硫黄の池に投げ込まれた。そこには<strong>あの獣と偽預言者</strong>がいる。そして、この者どもは昼も夜も世々限りなく責めさいなまれる」（<a href="https://bibleox.com/ja/jp-ni/otkr/20/#L9-10">黙. 20:9-10</a>）</p></blockquote><h2>主イエス・キリストの再臨の出来事</h2><h3>天に十字架が現れる</h3><blockquote><p>「そのとき、<strong>人の子の徴が天に現れる</strong>。そして、そのとき、地上のすべての民族は悲しみ、人の子が大いなる力と栄光を帯びて天の雲に乗って来るのを見る」（<a href="https://bibleox.com/ja/jp-ni/mf/24/#L30">マタ. 24:30</a>）</p></blockquote><h3>キリストはすべての聖なる天使たちと共に来られる</h3><p>キリストの再臨は、父の栄光のうちに、すべての聖なる天使たちと共に起こります：</p><blockquote><p><em>「</em><strong><em>人の子は</em></strong><em>、栄光に輝いて</em><strong><em><mark>天使たちを皆</mark>従えて来るとき</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/mf/25/#L31"><em>マタ. 25:31</em></a><em>）（ビザンティン本文（多数派写本）では「<strong>聖なる</strong>天使たちを皆」です。）</em></p></blockquote><blockquote><p><em>「神に背いたこの罪深い時代に、わたしとわたしの言葉を恥じる者は、人の子もまた、</em><strong><em>父の栄光に輝いて<mark>聖なる</mark>天使たちと共に来るときに</em></strong><em>、その者を恥じる」（</em><a href="https://bibleox.com/ja/jp-ni/mk/8/#L38"><em>マコ. 8:38</em></a><em>）</em></p></blockquote><blockquote><p><em>「</em><strong><em>人の子は、父の栄光に輝いて<mark>天使たちと共に</mark>来る</em></strong><em>が、そのとき、それぞれの行いに応じて報いるのである」（</em><a href="https://bibleox.com/ja/jp-ni/mf/16/#L27"><em>マタ. 16:27</em></a><em>）</em></p></blockquote><blockquote><p><em>「アダムから数えて七代目に当たるエノクも、彼らについてこう預言しました。『見よ、</em><strong><em>主は<mark>数知れない聖なる者たちを</mark>引き連れて来られる</em></strong><em>』」（</em><a href="https://bibleox.com/ja/jp-ni/iud/1/#L14"><em>ユダ. 1:14</em></a><em>）</em></p></blockquote><blockquote><p><em>「</em><strong><em>わたしたちの主イエスが、<mark>御自身に属するすべての聖なる者たちと共に</mark>来られるとき</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/1sol/3/#L13"><em>１テサ. 3:13</em></a><em>）</em></p></blockquote><blockquote><p><em>「</em><strong><em>主イエスが<mark>力強い天使たちを率いて</mark>天から来られるとき</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/2sol/1/#L7"><em>２テサ. 1:7</em></a><em>）</em></p></blockquote><blockquote><p><em>「</em><strong><em>わが神なる主は、<mark>聖なる御使いたちと共に</mark></em></strong><em>あなたのもとに</em><strong><em>来られる</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/zah/14/#L5"><em>ゼカ. 14:5</em></a><em>）</em></p></blockquote><h3>キリストは死者の全般的な復活を行われる</h3><p>かつて生きたすべての人、義人と不義な者の全般的な復活：</p><blockquote><p>「更に、<strong>正しい者も正しくない者もやがて復活する</strong>という希望を、神に対して抱いています。この希望は、この人たち自身も同じように抱いております」（<a href="https://bibleox.com/ja/jp-ni/act/24/#L15">使. 24:15</a>）<em>（ビザンティン本文（多数派写本）では「<strong>死者の</strong>復活」（ἀνάστασιν νεκρῶν）です。）</em></p></blockquote><p>復活は、変容した朽ちない体で起こります。義人は太陽のように輝きます：</p><blockquote><p>「そのとき、<strong>正しい人々は</strong>その父の国で<strong>太陽のように輝く</strong>。耳のある者は聞きなさい」（<a href="https://bibleox.com/ja/jp-ni/mf/13/#L43">マタ. 13:43</a>）</p></blockquote><p>キリストの再臨の時までにまだ死を見ていない人々も、復活した人々にふさわしく変えられます：</p><blockquote><p>「<strong>死者の復活</strong>もこれと同じです。蒔かれるときは朽ちるものでも、朽ちないものに復活し、&lt;…&gt; つまり、自然の命の体が蒔かれて、霊の体が復活するのです。自然の命の体があるのですから、霊の体もあるわけです。&lt;…&gt; わたしはあなたがたに神秘を告げます。<strong><mark>わたしたちは皆、眠りにつくわけではありません。わたしたちは皆、今とは異なる状態に変えられます</mark></strong>。最後のラッパが鳴るとともに、<strong><mark>たちまち、一瞬のうちにです</mark></strong>。ラッパが鳴ると、<strong><mark>死者は復活して朽ちない者とされ、わたしたちは変えられます</mark></strong>。<strong>この朽ちるべきものが朽ちないものを着</strong>、この死ぬべきものが死なないものを必ず着ることになります」（<a href="https://bibleox.com/ja/jp-ni/1kor/15/#L42,44,51-53">１コリ. 15:42,44,51-53</a>）</p></blockquote><blockquote><p>「兄弟たち、既に眠りについた人たちについては、希望を持たないほかの人々のように嘆き悲しまないために、ぜひ次のことを知っておいてほしい。イエスが死んで復活されたと、わたしたちは信じています。神は同じように、イエスを信じて眠りについた人たちをも、イエスと一緒に導き出してくださいます。主の言葉に基づいて次のことを伝えます。<strong><mark>主が来られる日まで生き残るわたしたち</mark>が、眠りについた人たちより先になることは、決してありません</strong>。すなわち、合図の号令がかかり、大天使の声が聞こえて、神のラッパが鳴り響くと、<strong><mark>主御自身が天から降って来られます</mark></strong>。すると、<strong><mark>キリストに結ばれて死んだ人たちが、まず最初に復活し</mark></strong>、<strong>それから、<mark>わたしたち生き残っている者</mark>が、空中で主と出会うために、彼らと一緒に雲に包まれて引き上げられます</strong>。このようにして、わたしたちはいつまでも主と共にいることになります」（<a href="https://bibleox.com/ja/jp-ni/1sol/4/#L13-17">１テサ. 4:13-17</a>）</p></blockquote><h3>キリストは天使たちを遣わして、復活したすべての人を集められる</h3><p>天使たちは義人と不義な者を集めます：</p><blockquote><p>「そのとき、人の子は<strong>天使たちを遣わし</strong>、地の果てから天の果てまで、<strong>彼によって選ばれた人たちを</strong>四方から<strong>呼び集める</strong>」（<a href="https://bibleox.com/ja/jp-ni/mk/13/#L27">マコ. 13:27</a>）</p></blockquote><blockquote><p>「<strong>人の子は天使たちを遣わし</strong>、つまずきとなるものすべてと<strong>不法を行う者どもを</strong>自分の国から<strong>集めさせ</strong>」（<a href="https://bibleox.com/ja/jp-ni/mf/13/#L41">マタ. 13:41</a>）</p></blockquote><h3>キリストは判決を下される</h3><blockquote><p>「人の子は、栄光に輝いて天使たちを皆従えて来るとき、<strong>その栄光の座に着く</strong>。そして、すべての国の民がその前に集められると、羊飼いが羊と山羊を分けるように、彼らをより分け、羊を右に、山羊を左に置く。そこで、王は右側にいる人たちに言う。『<strong>さあ、わたしの父に祝福された人たち、</strong>天地創造の時からお前たちのために用意されている<strong>国を受け継ぎなさい</strong>。お前たちは、わたしが飢えていたときに食べさせ、のどが渇いていたときに飲ませ、旅をしていたときに宿を貸し、裸のときに着せ、病気のときに見舞い、牢にいたときに訪ねてくれたからだ。』すると、正しい人たちが王に答える。『主よ、いつわたしたちは、飢えておられるのを見て食べ物を差し上げ、のどが渇いておられるのを見て飲み物を差し上げたでしょうか。いつ、旅をしておられるのを見てお宿を貸し、裸でおられるのを見てお着せしたでしょうか。いつ、病気をなさったり、牢におられたりするのを見て、お訪ねしたでしょうか。』そこで、王は答える。『はっきり言っておく。わたしの兄弟であるこの最も小さい者の一人にしたのは、わたしにしてくれたことなのである。』それから、王は左側にいる人たちにも言う。『<strong>呪われた者ども、わたしから離れ去り</strong>、悪魔とその手下のために用意してある<strong>永遠の火に入れ</strong>。お前たちは、わたしが飢えていたときに食べさせず、のどが渇いたときに飲ませず、旅をしていたときに宿を貸さず、裸のときに着せず、病気のとき、牢にいたときに、訪ねてくれなかったからだ。』すると、彼らも答える。『主よ、いつわたしたちは、あなたが飢えたり、渇いたり、旅をしたり、裸であったり、病気であったり、牢におられたりするのを見て、お世話をしなかったでしょうか。』そこで、王は答える。『はっきり言っておく。この最も小さい者の一人にしなかったのは、わたしにしてくれなかったことなのである。』こうして、この者どもは永遠の罰を受け、正しい人たちは永遠の命にあずかるのである」（<a href="https://bibleox.com/ja/jp-ni/mf/25/#L31-46">マタ. 25:31-46</a>）<em>（「手下」は、ギリシア語原文では ἀγγέλοις —「天使たち」です。）</em></p></blockquote><h3>救われた人々は、キリストと共に永遠の命へと引き上げられる</h3><blockquote><p>「すなわち、合図の号令がかかり、大天使の声が聞こえて、神のラッパが鳴り響くと、主御自身が天から降って来られます。すると、キリストに結ばれて死んだ人たちが、まず最初に復活し、それから、わたしたち生き残っている者が、<strong>空中で主と出会うために、彼らと一緒に雲に包まれて引き上げられます。このようにして、わたしたちはいつまでも主と共にいることになります</strong>」（<a href="https://bibleox.com/ja/jp-ni/1sol/4/#L16-17">１テサ. 4:16-17</a>）</p></blockquote><h3>滅びる者たちは永遠の罰に送られる</h3><blockquote><p>「こうして、<strong>この者どもは永遠の罰を受け</strong>、正しい人たちは永遠の命にあずかるのである」（<a href="https://bibleox.com/ja/jp-ni/mf/25/#L46">マタ. 25:46</a>）</p></blockquote><p>救いも罰も、書かれているとおり、永遠です。</p><h2>再臨の重要な点</h2><h3>再臨は稲妻のようである</h3><p>キリストの再臨は、稲妻のひらめきのように、たちまち全世界のすべての人に知られます：</p><blockquote><p><em>「『見よ、あそこだ』『見よ、ここだ』と</em><strong><em>人々は言うだろうが、出て行ってはならない。また、その人々の後を追いかけてもいけない</em></strong><em>。</em><strong><em>稲妻がひらめいて</em></strong><em>、大空の端から端へと輝くように、</em><strong><em>人の子もその日に現れるからである</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/lk/17/#L23-24"><em>ルカ. 17:23-24</em></a><em>）</em></p></blockquote><blockquote><p><em>「だから、</em><strong><em>人が『見よ、メシアは荒れ野にいる』と言っても</em></strong><em>、行ってはならない。また、『見よ、奥の部屋にいる』と言っても、信じてはならない。</em><strong><em>稲妻が東から西へひらめき渡るように、人の子も来るからである</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/mf/24/#L26-27"><em>マタ. 24:26-27</em></a><em>）</em></p></blockquote><h3>キリストは同じ大人の体で来られる</h3><p>キリストは再び人から生まれるのではなく、すでに持っておられる体、紀元1年に生神女である処女マリアからお生まれになったときに受けられた体で来られます：</p><blockquote><p><em>「こう話し終わると、イエスは彼らが見ているうちに天に上げられたが、雲に覆われて彼らの目から見えなくなった。イエスが離れ去って行かれるとき、彼らは天を見つめていた。すると、白い服を着た二人の人がそばに立って、言った。『ガリラヤの人たち、なぜ天を見上げて立っているのか。</em><strong><em>あなたがたから離れて天に上げられたイエスは、天に行かれるのをあなたがたが見たのと同じ有様で、またおいでになる</em></strong><em>』」（</em><a href="https://bibleox.com/ja/jp-ni/act/1/#L9-11"><em>使. 1:9-11</em></a><em>）</em></p></blockquote><h3>裁きのための来臨</h3><p>主は教えるためではなく、最初に来られたときにすでにお与えになった言葉によって裁くために来られます：</p><blockquote><p><em>「わたしを拒み、わたしの言葉を受け入れない者に対しては、裁くものがある。</em><strong><em>わたしの語った言葉が、終わりの日にその者を<mark>裁く</mark></em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/in/12/#L48"><em>ヨハ. 12:48</em></a><em>）</em></p></blockquote><blockquote><p><em>「人の子は、父の栄光に輝いて天使たちと共に来るが、そのとき、</em><strong><em><mark>それぞれの</mark>行いに応じて<mark>報いる</mark>のである</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/mf/16/#L27"><em>マタ. 16:27</em></a><em>）</em></p></blockquote><blockquote><p><em>「</em><strong><em>人の子は、栄光に輝いて</em></strong><em>天使たちを皆従えて来るとき、その</em><strong><em>栄光の座に着く</em></strong><em>。そして、</em><strong><em>すべての国の民がその前に集められると</em></strong><em>、羊飼いが羊と山羊を分けるように、</em><strong><em><mark>彼らをより分け</mark></em></strong><em>、羊を右に、山羊を左に置く。&lt;…&gt; こうして、</em><strong><em>この者どもは永遠の罰を受け、正しい人たちは永遠の命にあずかるのである</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/mf/25/#L31-33,46"><em>マタ. 25:31-33,46</em></a><em>）</em></p></blockquote><blockquote><p><em>「これは、あなたがたを神の国にふさわしい者とする、</em><strong><em><mark>神の判定が正しい</mark></em></strong><em>という証拠です。あなたがたも、神の国のために苦しみを受けているのです。神は正しいことを行われます。あなたがたを苦しめている者には、苦しみをもって報い、また、苦しみを受けているあなたがたには、わたしたちと共に休息をもって報いてくださるのです。</em><strong><em>主イエスが力強い天使たちを率いて天から来られるとき</em></strong><em>、神はこの報いを実現なさいます。</em><strong><em><mark>主イエスは、燃え盛る火の中を来られます。そして</mark></em></strong><em>神を認めない者や、わたしたちの主イエスの福音に聞き従わない者に、</em><strong><em><mark>罰をお与えになります</mark></em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/2sol/1/#L5-8"><em>２テサ. 1:5-8</em></a><em>）</em></p></blockquote><h3>再臨と裁きは切り離すことができない</h3><p>キリストの再臨の時には、罪人だけでなく、すべての人の裁きが行われます。主はある人々には報い、ほかの人々は罰せられます：</p><blockquote><p><em>「</em><strong><em><mark>人の子は</mark>、栄光に輝いて<mark>天使たちを皆従えて来るとき</mark></em></strong><em>、その</em><strong><em>栄光の座に着く</em></strong><em>。そして、</em><strong><em>すべての国の民がその前に集められると</em></strong><em>、羊飼いが羊と山羊を分けるように、</em><strong><em><mark>彼らをより分け</mark></em></strong><em>、羊を右に、山羊を左に置く。&lt;…&gt; こうして、</em><strong><em><mark>この者どもは永遠の罰を受け、正しい人たちは永遠の命にあずかるのである</mark></em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/mf/25/#L31-33,46"><em>マタ. 25:31-33,46</em></a><em>）</em></p></blockquote><blockquote><p>「わたしはまた、大きな白い玉座と、そこに座っておられる方とを見た。天も地も、その御前から逃げて行き、行方が分からなくなった。わたしはまた、死者たちが、大きな者も小さな者も、玉座の前に立っているのを見た。幾つかの書物が開かれたが、もう一つの書物も開かれた。それは命の書である。<strong><mark>死者たちは、これらの書物に書かれていることに基づき、彼らの行いに応じて裁かれた</mark></strong>。海は、その中にいた死者を外に出した。<strong>死と陰府も、その中にいた死者を出し、彼らはそれぞれ自分の行いに応じて裁かれた</strong>。死も陰府も火の池に投げ込まれた。<strong>この火の池が第二の死である</strong>。その名が命の書に記されていない者は、火の池に投げ込まれた」（<a href="https://bibleox.com/ja/jp-ni/otkr/20/#L11-15">黙. 20:11-15</a>）</p></blockquote><blockquote><p><em>「</em><strong><em><mark>人の子は</mark>、父の栄光に輝いて<mark>天使たちと共に来る</mark></em></strong><em>が、そのとき、</em><strong><em><mark>それぞれの行いに応じて報いるのである</mark></em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/mf/16/#L27"><em>マタ. 16:27</em></a><em>）</em></p></blockquote><blockquote><p>「<strong><mark>人の子は</mark>、栄光に輝いて天使たちを皆従えて来るとき、その栄光の座に着く</strong>。そして、<strong><mark>すべての国の民</mark>がその前に集められると</strong>、羊飼いが羊と山羊を分けるように、<strong>彼らを<mark>より分け</mark></strong>、&lt;…&gt; そこで、<strong><mark>王は右側にいる人たちに言う</mark></strong>。『さあ、<strong><mark>わたしの父に祝福された人たち</mark></strong>、天地創造の時からお前たちのために用意されている国を受け継ぎなさい。』&lt;…&gt; それから、<strong><mark>王は左側にいる人たちにも言う</mark></strong>。『<strong><mark>呪われた者ども</mark></strong>、わたしから離れ去り、悪魔とその手下のために用意してある永遠の火に入れ』」（<a href="https://bibleox.com/ja/jp-ni/mf/25/#L31-32,34,41">マタ. 25:31-32,34,41</a>）</p></blockquote><blockquote><p>「これは、あなたがたを神の国にふさわしい者とする、神の判定が正しいという証拠です。あなたがたも、神の国のために苦しみを受けているのです。神は正しいことを行われます。<strong><mark>あなたがたを苦しめている者には、苦しみをもって報い、また、苦しみを受けているあなたがたには、わたしたちと共に休息をもって報いてくださるのです。主イエスが力強い天使たちを率いて天から来られるとき</mark></strong>、神はこの報いを実現なさいます」（<a href="https://bibleox.com/ja/jp-ni/2sol/1/#L5-7">２テサ. 1:5-7</a>）</p></blockquote><blockquote><p>「また、わたしにこう言った。『この書物の預言の言葉を、秘密にしておいてはいけない。時が迫っているからである。<strong>不正を行う者には、<mark>なお</mark>不正を行わせ、汚れた者は、<mark>なお</mark>汚れるままにしておけ。正しい者には、<mark>なお</mark>正しいことを行わせ、聖なる者は、なお聖なる者とならせよ。見よ、<mark>わたしはすぐに来る</mark>。わたしは、報いを携えて来て、<mark>それぞれの行いに応じて報いる</mark></strong>』」（<a href="https://bibleox.com/ja/jp-ni/otkr/22/#L10-12">黙. 22:10-12</a>）</p></blockquote><h3>すべての人が裁きを受ける</h3><blockquote><p><em>「なぜなら、</em><strong><em><mark>わたしたちは皆、キリストの裁きの座の前に立ち</mark></em></strong><em>、</em><strong><em><mark>善</mark>であれ<mark>悪</mark>であれ</em></strong><em>、めいめい体を住みかとしていたときに</em><strong><em><mark>行ったこと</mark></em></strong><em>に応じて、報いを受けねばならないからです」（</em><a href="https://bibleox.com/ja/jp-ni/2kor/5/#L10"><em>２コリ. 5:10</em></a><em>）</em></p></blockquote><blockquote><p><em>「</em><strong><em>神は、善をも悪をも一切の業を</em></strong><em>、隠れたこともすべて</em><strong><em>裁きの座に引き出されるであろう</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/ekl/12/#L14"><em>コヘ. 12:14</em></a><em>）</em></p></blockquote><blockquote><p>「<strong>今こそ、神の家から裁きが始まる時です。わたしたちがまず裁きを受けるのだとすれば</strong>、神の福音に従わない者たちの行く末は、いったい、どんなものになるだろうか。『正しい人がやっと救われるのなら、不信心な人や罪深い人はどうなるのか』と言われているとおりです」（<a href="https://bibleox.com/ja/jp-ni/1pet/4/#L17-18">１ペト. 4:17-18</a>）</p></blockquote><blockquote><p>「それなのに、なぜあなたは、自分の兄弟を裁くのですか。また、なぜ兄弟を侮るのですか。<strong>わたしたちは皆、神の裁きの座の前に立つのです</strong>」（<a href="https://bibleox.com/ja/jp-ni/rim/14/#L10">ロマ. 14:10</a>）<em>（ビザンティン本文（多数派写本）では「<strong>キリストの</strong>裁きの座」（τῷ βήματι τοῦ Χριστοῦ）です。）</em></p></blockquote><blockquote><p>「自由をもたらす律法によって<strong>いずれは裁かれる者として</strong>、語り、またふるまいなさい」（<a href="https://bibleox.com/ja/jp-ni/iak/2/#L12">ヤコ. 2:12</a>）</p></blockquote><blockquote><p>「人の子は、栄光に輝いて天使たちを皆従えて来るとき、その栄光の座に着く。そして、<strong>すべての国の民がその前に集められると</strong>、羊飼いが羊と山羊を分けるように、彼らをより分け」（<a href="https://bibleox.com/ja/jp-ni/mf/25/#L31-32">マタ. 25:31-32</a>）</p></blockquote><h3>裁きは教会から始まる</h3><blockquote><p><em>「</em><strong><em><mark>今こそ、神の家から裁きが始まる時です</mark></em></strong><em>。</em><strong><em><mark>わたしたちがまず裁きを受けるのだとすれば</mark></em></strong><em>、神の福音に従わない者たちの行く末は、いったい、どんなものになるだろうか。『</em><strong><em>正しい人がやっと救われるのなら</em></strong><em>、不信心な人や罪深い人はどうなるのか』と言われているとおりです」（</em><a href="https://bibleox.com/ja/jp-ni/1pet/4/#L17-18"><em>１ペト. 4:17-18</em></a><em>）</em></p></blockquote><h3>聖なる者たちが世を裁く</h3><blockquote><p>「イエスは一同に言われた。『はっきり言っておく。新しい世界になり、人の子が栄光の座に座るとき、あなたがたも、わたしに従って来たのだから、<strong>十二の座に座ってイスラエルの十二部族を治めることになる</strong>』」（<a href="https://bibleox.com/ja/jp-ni/mf/19/#L28">マタ. 19:28</a>）<em>（「治める」は、ギリシア語原文では κρίνοντες —「<strong>裁く</strong>」です。）</em></p></blockquote><blockquote><p>「だから、わたしの父がわたしに支配権をゆだねてくださったように、わたしもあなたがたにそれをゆだねる。あなたがたは、わたしの国でわたしの食事の席に着いて飲み食いを共にし、<strong>王座に座ってイスラエルの十二部族を治めることになる</strong>」（<a href="https://bibleox.com/ja/jp-ni/lk/22/#L29-30">ルカ. 22:29-30</a>）<em>（「治める」は、ギリシア語原文では κρίνοντες —「<strong>裁く</strong>」です。）</em></p></blockquote><blockquote><p>「あなたがたは知らないのですか。<strong>聖なる者たちが世を裁く</strong>のです。世があなたがたによって裁かれるはずなのに、あなたがたにはささいな事件すら裁く力がないのですか」（<a href="https://bibleox.com/ja/jp-ni/1kor/6/#L2">１コリ. 6:2</a>）</p></blockquote><h3>多くの人は、救いを受けられないことに驚く</h3><p>彼らは自分が救われていると思っていました：</p><blockquote><p><em>「かの日には、</em><strong><em>大勢の者が</em></strong><em>わたしに、『主よ、主よ、わたしたちは御名によって</em><strong><em>預言し</em></strong><em>、御名によって</em><strong><em>悪霊を追い出し</em></strong><em>、御名によって</em><strong><em>奇跡をいろいろ行った</em></strong><em>ではありませんか』と言うであろう。そのとき、わたしはきっぱりとこう言おう。『</em><strong><em>あなたたちのことは全然知らない。</em></strong><em>不法を働く者ども、</em><strong><em>わたしから離れ去れ</em></strong><em>』」（</em><a href="https://bibleox.com/ja/jp-ni/mf/7/#L22-23"><em>マタ. 7:22-23</em></a><em>）</em></p></blockquote><h3>世界の変容</h3><blockquote><p>「わたしはまた、<strong>新しい天と新しい地</strong>を見た。最初の天と最初の地は去って行き、もはや海もなくなった。更にわたしは、聖なる都、新しいエルサレムが、夫のために着飾った花嫁のように用意を整えて、神のもとを離れ、天から下って来るのを見た。そのとき、わたしは玉座から語りかける大きな声を聞いた。『見よ、神の幕屋が人の間にあって、神が人と共に住み、人は神の民となる。神は自ら人と共にいて、その神となり、彼らの目の涙をことごとくぬぐい取ってくださる。もはや死はなく、もはや悲しみも嘆きも労苦もない。最初のものは過ぎ去ったからである。』すると、玉座に座っておられる方が、『<strong><mark>見よ、わたしは万物を新しくする</mark></strong>』と言い、また、『書き記せ。これらの言葉は信頼でき、また真実である』と言われた。また、わたしに言われた。『事は成就した。わたしはアルファであり、オメガである。初めであり、終わりである。渇いている者には、命の水の泉から価なしに飲ませよう』」（<a href="https://bibleox.com/ja/jp-ni/otkr/21/#L1-6">黙. 21:1-6</a>）</p></blockquote><h2>「千年」という表現について</h2><h3>千年とは、キリストの最初の来臨から再臨までの期間の比喩的な名である</h3><p>最初の来臨はすでに起こりました。神の子は受肉されました。以前のもの（神）であることをやめることなく、人ともなられたのです。主は教え、苦しみを受け、復活し、天に座し、教会（地上と天上の、一つの教会）を造り、それを宣教へと遣わされました。キリストの宣教に応え、その教会に入り、救いと天における主との命に達する人々は、その体は死者の体としてまだ地にありながら、<a href="https://bibleox.com/ru/ru/w/%D0%B6%D0%B8%D0%B7%D0%BD%D1%8C-%D0%B4%D1%83%D1%88%D0%B8-%D0%BF%D0%BE%D1%81%D0%BB%D0%B5-%D1%81%D0%BC%D0%B5%D1%80%D1%82%D0%B8-%D1%82%D0%B5%D0%BB%D0%B0">その魂はキリストと共にとどまっている</a>ので、主と共に統治すると言われています。このことは、主イエス・キリストの再臨まで続きます。その時は神のほかにだれも知りません（<a href="https://bibleox.com/ja/jp-ni/act/1/#L7">使. 1:7</a>）。最初の来臨から再臨までのこの期間全体が、比喩的に千年と呼ばれているのです：</p><blockquote><p>「わたしはまた、一人の天使（神の子 — 注）が、底なしの淵の鍵と大きな鎖とを手にして、天から降って来るのを見た。この天使は、悪魔でもサタンでもある、年を経たあの蛇、つまり竜を取り押さえ、<strong>千年の間</strong>縛っておき、底なしの淵に投げ入れ、鍵をかけ、その上に封印を施して、<strong>千年が終わるまで</strong>、もうそれ以上、諸国の民を惑わさないようにした。&lt;…&gt; 彼らは生き返って、キリストと共に千年の間統治した。その他の死者は、<strong>千年たつまで生き返らなかった</strong>。これが第一の復活である。第一の復活にあずかる者は、幸いな者、聖なる者である。この者たちに対して、第二の死は何の力もない。彼らは神とキリストの祭司となって、<strong>千年の間</strong>キリストと共に統治する」（<a href="https://bibleox.com/ja/jp-ni/otkr/20/#L1-6">黙. 20:1-6</a>）</p></blockquote><h3>千年王国説（キリアズム）という異端について</h3><p>千年の間続くキリストの地上の王国についての教えである千年王国説（キリアズム）は、次の理由から、正教のキリスト者には受け入れることができません：</p><ol><li><p><strong>二つの</strong><strong>体の復活</strong>を認めることはできない（主は一つの復活についてだけ教えられた）。</p></li><li><p><strong>二つの</strong><strong>恐るべき審判</strong>を認めることはできない（やはり主は一つの審判についてだけ教えておられる）。</p></li><li><p>地上で世界を支配するための、恐るべき審判の前の<strong>特別な</strong><strong>キリストの来臨</strong>を認めることはできない。</p></li><li><p>天の国とは別の、すでにこの世における何か<strong>特別な千年のキリストの王国</strong>を認めることはできない。</p></li></ol><p>詳しくは：<a href="https://bibleox.com/ru/ru/w/%D1%85%D0%B8%D0%BB%D0%B8%D0%B0%D0%B7%D0%BC/">千年王国説（ロシア語）</a></p><h2>「二つの復活」について</h2><blockquote><p>「わたしはまた、一人の天使（神の子 — 注）が、底なしの淵の鍵と大きな鎖とを手にして、天から降って来るのを見た。この天使は、悪魔でもサタンでもある、年を経たあの蛇、つまり竜を取り押さえ、千年の間縛っておき、底なしの淵に投げ入れ、鍵をかけ、その上に封印を施して、千年が終わるまで、もうそれ以上、諸国の民を惑わさないようにした。&lt;…&gt; 彼らは生き返って、キリストと共に千年の間統治した。その他の死者は、千年たつまで生き返らなかった。<strong>これが第一の復活である</strong>。<strong>第一の復活に</strong>あずかる者は、幸いな者、聖なる者である。この者たちに対して、第二の死は何の力もない。彼らは神とキリストの祭司となって、千年の間キリストと共に統治する」（<a href="https://bibleox.com/ja/jp-ni/otkr/20/#L1-6">黙. 20:1-6</a>）</p></blockquote><h3>第一の復活 — 宣教と洗礼によって神に立ち帰ること</h3><p>主はサタンを縛られました。異教の祭儀はキリスト教によって打ち負かされ、消えていき始めました。人々は、洗礼、聖体機密、教会における生活を通して、神と共にある永遠の命へと霊的に復活する可能性を受けました。永遠の命へのこの霊的な復活が、本文では第一の復活と呼ばれているのです：</p><blockquote><p>「これが<strong>第一の復活</strong>である。第一の復活にあずかる者は、幸いな者、聖なる者である。この者たちに対して、第二の死は何の力もない」（<a href="https://bibleox.com/ja/jp-ni/otkr/20/#L5-6">黙. 20:5-6</a>）</p></blockquote><p>神に立ち帰ることは、死から命へ移ることと呼ばれています：</p><blockquote><p>「<strong>罪のために死んでいたわたしたちをキリストと共に生かし</strong>、――あなたがたの救われたのは恵みによるのです――キリスト・イエスによって共に復活させ、共に天の王座に着かせてくださいました」（<a href="https://bibleox.com/ja/jp-ni/ef/2/#L5-6">エフェ. 2:5-6</a>）</p></blockquote><p>信じる者は死から命へ移っています：</p><blockquote><p>「はっきり言っておく。<strong>わたしの言葉を聞いて、わたしをお遣わしになった方を信じる者は、永遠の命を得</strong>、また、裁かれることなく、<strong>死から命へと移っている</strong>」（<a href="https://bibleox.com/ja/jp-ni/in/5/#L24">ヨハ. 5:24</a>）</p></blockquote><p>信じなかった者は、単に死者と呼ばれています：</p><blockquote><p>「イエスは言われた。『<strong>死んでいる者たちに、自分たちの死者を葬らせなさい</strong>。あなたは行って、神の国を言い広めなさい』」（<a href="https://bibleox.com/ja/jp-ni/lk/9/#L60">ルカ. 9:60</a>）</p></blockquote><h3>第二の復活 — 全般的な審判のための、すべての人の体での復活</h3><p>第二の復活は、すべての人に関わります。それは、全般的な審判のために、かつて生きたすべての人が復活することを意味します。すべての魂は回復された体に戻ります。神を目指したもの（魂と体）がすべて報いを受け、罪を犯したもの（魂と体）がすべて罰を受けるためです。</p><blockquote><p>「更に、<strong>正しい者も正しくない者もやがて復活する</strong>という希望を、神に対して抱いています。この希望は、この人たち自身も同じように抱いております」（<a href="https://bibleox.com/ja/jp-ni/act/24/#L15">使. 24:15</a>）</p></blockquote><h3>「二つの復活」についてさらに</h3><blockquote><p>「<strong>その他の死者は、千年たつまで生き返らなかった。これが第一の復活である</strong>」（<a href="https://bibleox.com/ja/jp-ni/otkr/20/#L5">黙. 20:5</a>）。</p></blockquote><p>第一の復活の期間に、すべての人に復活する時が与えられ、そのためにすべてが与えられました。それでも、死者が復活すべきとき、すなわち千年の全期間にわたって（そのために割り当てられた千年が終わるまで）、ある人々は復活し、ほかの人々は復活しませんでした。</p><p>前者は、まだ体のうちに生きている間に復活しました。つまりキリストに立ち帰ったのです：</p><blockquote><p>「第一の復活にあずかる者は、幸いな者、聖なる者である。この者たちに対して、第二の死は何の力もない。彼らは神とキリストの祭司となって、千年の間キリストと共に統治する」（<a href="https://bibleox.com/ja/jp-ni/otkr/20/#L6">黙. 20:6</a>）。</p></blockquote><p>この人々に対して、<strong>第二の死</strong>は何の力もありません。</p><p>ここにあるのは、全般的な審判のための、すべての人の体での復活です：</p><blockquote><p>「海は、その中にいた死者を外に出した。死と陰府も、その中にいた死者を出し、彼らはそれぞれ自分の行いに応じて裁かれた。死も陰府も火の池に投げ込まれた。この火の池が第二の死である。その名が命の書に記されていない者は、火の池に投げ込まれた」（<a href="https://bibleox.com/ja/jp-ni/otkr/20/#L13-15">黙. 20:13-15</a>）。</p></blockquote><p>火の池に投げ込まれることが<strong>第二の死</strong>です。命の書に記された人々、すなわち20:6で第二の死が何の力もないと言われた人々は、そこに投げ込まれませんでした。</p>

