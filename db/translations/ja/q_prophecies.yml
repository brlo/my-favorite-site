      <h4>参考にした資料（ロシア語）：</h4><ul><li><p><a href="https://azbyka.ru/hiliazm">https://azbyka.ru/hiliazm</a></p></li><li><p><a href="https://azbyka.ru/otechnik/Oleg_Davydenkov/dogmaticheskoe-bogoslovie/13_4_1">https://azbyka.ru/otechnik/Oleg_Davydenkov/dogmaticheskoe-bogoslovie/13_4_1</a></p></li><li><p><a href="https://azbyka.ru/otechnik/Evgenij-Veselov/eshatologija-sekt-protestantskogo-proishozhdenija/#0_42">https://azbyka.ru/otechnik/Evgenij-Veselov/eshatologija-sekt-protestantskogo-proishozhdenija/#0_42</a></p></li><li><p><a href="https://azbyka.ru/otechnik/Aleksandr_Belyaev/skolko-vremeni-prodolzhitsja-tsarstvovanie-antihrista/">https://azbyka.ru/otechnik/Aleksandr_Belyaev/skolko-vremeni-prodolzhitsja-tsarstvovanie-antihrista/</a></p></li></ul>
