    menu: { parent: "預言", title: "異端についての預言", priority: 5 }
    body: |-
      <h2>キリスト教の中に多くの異端が現れる</h2><blockquote><p><em>「</em><strong><em>わたしの名を名乗る者が<mark>大勢</mark>現れ</em></strong><em>、『わたしがそれだ』と言って、</em><strong><em><mark>多くの</mark>人を惑わすだろう</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/mk/13/#L6"><em>マコ. 13:6</em></a><em>）</em></p></blockquote><blockquote><p><em>「</em><strong><em>偽預言者も<mark>大勢</mark>現れ、<mark>多くの</mark>人を惑わす</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/mf/24/#L11"><em>マタ. 24:11</em></a><em>）</em></p></blockquote><blockquote><p><em>「愛する者たち、どの霊も信じるのではなく、神から出た霊かどうかを確かめなさい。</em><strong><em>偽預言者が<mark>大勢</mark></em></strong><em>世に出て来ているからです」（</em><a href="https://bibleox.com/ja/jp-ni/1in/4/#L1"><em>１ヨハ. 4:1</em></a><em>）</em></p></blockquote><h2>異端は非常に広く広まる</h2><blockquote><p><em>「</em><strong><em><mark>その言葉は悪いはれ物のように広がります</mark></em></strong><em>。その中には、ヒメナイとフィレトがいます。彼らは</em><strong><em>真理の道を踏み外し</em></strong><em>、復活はもう起こったと言って、ある人々の信仰を覆しています」（</em><a href="https://bibleox.com/ja/jp-ni/2tim/2/#L17-18"><em>２テモ. 2:17-18</em></a><em>）</em></p></blockquote><blockquote><p><em>「かつて、民の中に（イスラエルの — 注）偽預言者がいました。同じように、あなたがたの中にも（キリスト者の — 注）偽教師が現れるにちがいありません。彼らは、</em><strong><em>滅びをもたらす異端をひそかに持ち込み</em></strong><em>、自分たちを贖ってくださった主を拒否しました。自分の身に速やかな滅びを招いており、しかも、</em><strong><em><mark>多くの</mark>人が彼らのみだらな楽しみを見倣っています。彼らのために真理の道はそしられるのです</em></strong><em>。彼らは</em><strong><em>欲が深く</em></strong><em>、うそ偽りであなたがたを</em><strong><em>食い物にします</em></strong><em>。このような者たちに対する裁きは、昔から怠りなくなされていて、彼らの滅びも滞ることはありません」（</em><a href="https://bibleox.com/ja/jp-ni/2pet/2/#L1-3"><em>２ペト. 2:1-3</em></a><em>）（2節の「みだらな楽しみ」は、テクストゥス・レセプトゥスでは ἀπωλείαις —「<strong>滅びの道</strong>」です。）</em></p></blockquote><h2>異端者の共同体は、教会とその信仰の一致から離れる</h2><blockquote><p><em>「子供たちよ、終わりの時が来ています。反キリストが来ると、あなたがたがかねて聞いていたとおり、今や多くの反キリストが現れています。これによって、終わりの時が来ていると分かります。</em><strong><em>彼らはわたしたちから去って行きましたが、もともと仲間ではなかったのです。<mark>仲間なら、わたしたちのもとにとどまっていたでしょう</mark></em></strong><em>。しかし去って行き、だれもわたしたちの仲間ではないことが明らかになりました」（</em><a href="https://bibleox.com/ja/jp-ni/1in/2/#L18-19"><em>１ヨハ. 2:18-19</em></a><em>）</em></p></blockquote><blockquote><p><em>「彼らはあなたがたにこう言いました。『</em><strong><em>終わりの時には</em></strong><em>、あざける者どもが現れ、不信心な欲望のままにふるまう。』この者たちは、</em><strong><em><mark>分裂を引き起こし</mark></em></strong><em>、この世の命のままに生き、霊を持たない者です」（</em><a href="https://bibleox.com/ja/jp-ni/iud/1/#L18-19"><em>ユダ. 1:18-19</em></a><em>）（テクストゥス・レセプトゥスでは οἱ ἀποδιορίζοντες ἑαυτούς —「<strong>自らを分離する</strong>（信仰の一致から離れる）者たち」です。）</em></p></blockquote><h2>偽教師の目的は、信じる者を教会から奪い、自分の後に従わせること</h2><blockquote><p><em>「わたしが去った後に、</em><strong><em>残忍な狼どもがあなたがたのところへ入り込んで来て群れを荒らすことが、わたしには分かっています。また、あなたがた自身の中からも、<mark>邪説を唱えて</mark>弟子たちを<mark>従わせようとする</mark>者が現れます</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/act/20/#L29-30"><em>使. 20:29-30</em></a><em>）（30節は、ギリシア語原文では τοῦ ἀποσπᾶν τοὺς μαθητὰς ὀπίσω αὐτῶν —「弟子たちを<strong>自分たちの後に引き離して連れて行く</strong>ために」です。）</em></p></blockquote><h2>偽教師の手口</h2><h3>1. 耳に心地よい教え</h3><p>偽教師は、まさに聞く者たちが健全な教えに耐えられず、耳に心地よい教えを求めるために、心地よい教えを考え出します：</p><blockquote><p><em>「</em><strong><em>だれも健全な教えを聞こうとしない</em></strong><em>時が来ます。そのとき、</em><strong><em>人々は自分に都合の良いことを聞こうと、好き勝手に<mark>教師たち</mark>を寄せ集め</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/2tim/4/#L3"><em>２テモ. 4:3</em></a><em>）（「自分に都合の良いことを聞こうと」は、ギリシア語原文では κνηθόμενοι τὴν ἀκοήν —「<strong>耳がかゆくて</strong>」です。）</em></p></blockquote><blockquote><p><em>「しかし、“霊”は次のように明確に告げておられます。</em><strong><em>終わりの時には、<mark>惑わす霊</mark>と、悪霊どもの教えとに心を奪われ、信仰から脱落する者がいます</em></strong><em>。このことは、偽りを語る者たちの偽善によって引き起こされるのです。彼らは自分の良心に焼き印を押されており」（</em><a href="https://bibleox.com/ja/jp-ni/1tim/4/#L1-2"><em>１テモ. 4:1-2</em></a><em>）</em></p></blockquote><h3>2. 見せかけの敬虔</h3><blockquote><p><em>「しかし、</em><strong><em>終わりの時には</em></strong><em>困難な時期が来ることを悟りなさい。そのとき、人々は自分自身を愛し、金銭を愛し、ほらを吹き、高慢になり、神をあざけり、両親に従わず、恩を知らず、神を畏れなくなります。&lt;…&gt; </em><strong><em><mark>信心を装いながら</mark></em></strong><em>、その実、信心の力を否定するようになります。こういう人々を避けなさい。&lt;…&gt; いつも学んでいながら、決して真理の認識に達することができません。ヤンネとヤンブレがモーセに逆らったように、彼らも</em><strong><em>真理に逆らっています。彼らは精神の腐った人間で、信仰の失格者です</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/2tim/3/#L1-2,5,7-8"><em>２テモ. 3:1-2,5,7-8</em></a><em>）</em></p></blockquote><blockquote><p><em>「</em><strong><em>偽預言者</em></strong><em>を警戒しなさい。彼らは</em><strong><em><mark>羊の皮を身にまとって</mark>あなたがたのところに来るが</em></strong><em>、その内側は貪欲な狼である」（</em><a href="https://bibleox.com/ja/jp-ni/mf/7/#L15"><em>マタ. 7:15</em></a><em>）</em></p></blockquote><h3>3. 見せ物としての奇跡</h3><p>使徒たちと初代のキリスト者たちに豊かな奇跡の力が与えられたのは、見せ物のためではなく、益のためでした：</p><blockquote><p><em>「一人一人に“霊”の働きが現れるのは、</em><strong><em>全体の益となるため</em></strong><em>です」（</em><a href="https://bibleox.com/ja/jp-ni/1kor/12/#L7"><em>１コリ. 12:7</em></a><em>）</em></p></blockquote><p>漁師たちの小さな群れは、目撃者として、その短い生涯のうちに全世界に宣教を伝えるために、大きな助けを必要としていました。使徒たちは、これらの賜物がやむことを警告していました：</p><blockquote><p><em>「愛は決して滅びない。</em><strong><em>預言は廃れ、異言はやみ</em></strong><em>、知識は廃れよう」（</em><a href="https://bibleox.com/ja/jp-ni/1kor/13/#L8"><em>１コリ. 13:8</em></a><em>）</em></p></blockquote><p>キリスト御自身が、しるしを求めることを責められました：</p><blockquote><p><em>「イエスはお答えになった。『</em><strong><em>よこしまで神に背いた時代の者たちはしるしを欲しがる</em></strong><em>が、預言者ヨナのしるしのほかには、しるしは与えられない』」（</em><a href="https://bibleox.com/ja/jp-ni/mf/12/#L39"><em>マタ. 12:39</em></a><em>）</em></p></blockquote><p>終わりの時、偽預言者たちはまさに奇跡によって人々を引き込みます：</p><blockquote><p><em>「偽メシアや偽預言者が現れて、</em><strong><em>大きなしるしや不思議な業を行い</em></strong><em>、できれば、選ばれた人たちをも</em><strong><em>惑わそうとする</em></strong><em>からである」（</em><a href="https://bibleox.com/ja/jp-ni/mf/24/#L24"><em>マタ. 24:24</em></a><em>; </em><a href="https://bibleox.com/ja/jp-ni/mk/13/#L22"><em>マコ. 13:22</em></a><em>）</em></p></blockquote><p>その結果、審判の時、多くの信者は、キリストの名によって奇跡を行い、預言し、悪霊を追い出したからこそ自分は救われていると確信しているでしょう。しかし彼らは欺かれ、不法を教えられていたことが分かります。キリストは彼らを知らず、御自分から追い払われます：</p><blockquote><p><em>「かの日には、大勢の者がわたしに、『主よ、主よ、わたしたちは御名によって預言し、御名によって悪霊を追い出し、</em><strong><em>御名によって奇跡をいろいろ行ったではありませんか</em></strong><em>』と言うであろう。そのとき、わたしはきっぱりとこう言おう。『</em><strong><em>あなたたちのことは全然知らない。</em></strong><em>不法を働く者ども、</em><strong><em>わたしから離れ去れ</em></strong><em>』」（</em><a href="https://bibleox.com/ja/jp-ni/mf/7/#L22-23"><em>マタ. 7:22-23</em></a><em>）</em></p></blockquote><h2>偽預言者の見分け方</h2><p>その預言は実現しません：</p><blockquote><p>「その預言者が主の御名によって語っても、そのことが起こらず、<strong>実現しなければ</strong>、それは主が語られたものではない。預言者が勝手に語ったのであるから、恐れることはない」（<a href="https://bibleox.com/ja/jp-ni/vtor/18/#L22">申. 18:22</a>）</p></blockquote><p>しかし、もし預言者や夢占いをする者が何かのしるしや奇跡を示し、あるいはその夢が実現しても、他の神に仕えるように呼びかけるなら、その言葉に耳を貸してはなりません：</p><blockquote><p>「預言者や夢占いをする者があなたたちの中に現れ、<strong>しるしや奇跡を示して、そのしるしや奇跡が言ったとおり実現したとき</strong>、<strong>『あなたの知らなかった他の神々に従い、これに仕えようではないか』と誘われても</strong>、<strong>その預言者や夢占いをする者の言葉に耳を貸してはならない</strong>。あなたたちの神、主はあなたたちを試し、心を尽くし、魂を尽くして、あなたたちの神、主を愛するかどうかを知ろうとされるからである。あなたたちは、あなたたちの神、主に従い、これを畏れ、その戒めを守り、御声を聞き、これに仕え、これにつき従わねばならない」（<a href="https://bibleox.com/ja/jp-ni/vtor/13/#L2-5">申. 13:2-5</a>）<em>（ほかの翻訳では13:1-4。）</em></p></blockquote>

  - src: лжехристос
    path: Fc6t_偽キリスト
    title: 偽キリスト
    title_sub: キリストを名乗る人々について
    meta_desc: 自分をキリストと偽る人々についての聖書の引用
    menu: { parent: "預言", title: "偽キリスト", priority: 6 }
    body: |-
      <h2>はじめに</h2><p>主イエス・キリストは、<a href="https://bibleox.com/ru/ru/w/%D0%BF%D1%80%D0%BE%D1%80%D0%BE%D1%87%D0%B5%D1%81%D1%82%D0%B2%D0%B0-%D0%BE-%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%B5">古代の預言者たちの言葉</a>のとおり、2000年以上前に、最も清い処女マリアから（夫なしに）お生まれになりました。主はすでに少年時代（12歳）に大きな知恵を持ち、エルサレムの神殿の教師たちを驚かせました。30歳まで、イエス・キリストはヨセフに従い、普通の仕事をしておられ、30歳で宣教に出て行かれました。この時期について詳しくは：<a href="https://bibleox.com/ru/ru/w/%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%BE%D1%81-%D0%B6%D0%B8%D0%B7%D0%BD%D1%8C-%D0%B2-%D0%9F%D0%B0%D0%BB%D0%B5%D1%81%D1%82%D0%B8%D0%BD%D0%B5">キリスト — パレスチナでの生涯</a>。</p><p>その後、主イエス・キリストは宣教し、弟子たち（使徒たち）を教え、裏切られ、十字架の上で苦しみを受け、三日目に復活し、40日の間御自分に従う者たちに現れて天の国について教え、それから天に上げられ、神の右に座し、全世界を裁くために、昇天されたのと同じ有様で再び来ると約束されました。そして10日後（復活から50日目）に御自分の教会を造り、聖霊を永遠に教会に遣わされました。</p><h2>偽キリストについて</h2><h3>欺く者たち</h3><p>主イエス・キリスト御自身が、御自分を名乗る欺く者たちが来ること、多くの人がその欺く者たちを信じることを警告されました：</p><blockquote><p>「イエスがオリーブ山で座っておられると、弟子たちがやって来て、ひそかに言った。『おっしゃってください。そのことはいつ起こるのですか。また、あなたが来られて世の終わるときには、どんな徴があるのですか。』イエスはお答えになった。『<strong>人に惑わされないように気をつけなさい。わたしの名を名乗る者が大勢現れ、「わたしがメシアだ」と言って、多くの人を惑わすだろう</strong>』」（<a href="https://bibleox.com/ja/jp-ni/mf/24/#L3-5">マタ. 24:3-5</a>）<em>（「メシア」は、ギリシア語原文では ὁ Χριστός —「<strong>キリスト</strong>」です。）</em></p></blockquote><h2>キリストの来臨について</h2><h3>来臨は稲妻のようである</h3><p>しかし、キリストの再臨は、稲妻のひらめきのように、たちまち全世界のすべての人に知られます：</p><blockquote><p>「『見よ、あそこだ』『見よ、ここだ』と<strong>人々は言うだろうが、出て行ってはならない。また、その人々の後を追いかけてもいけない</strong>。<strong>稲妻がひらめいて</strong>、大空の端から端へと輝くように、<strong>人の子もその日に現れるからである</strong>」（<a href="https://bibleox.com/ja/jp-ni/lk/17/#L23-24">ルカ. 17:23-24</a>）</p></blockquote><blockquote><p>「だから、<strong>人が『見よ、メシアは荒れ野にいる』と言っても</strong>、行ってはならない。また、『見よ、奥の部屋にいる』と言っても、信じてはならない。<strong>稲妻が東から西へひらめき渡るように、人の子も来るからである</strong>」（<a href="https://bibleox.com/ja/jp-ni/mf/24/#L26-27">マタ. 24:26-27</a>）</p></blockquote><h3>すべての天使と共に来られる</h3><p>キリストの再臨は、父の栄光のうちに、すべての聖なる者たちと共に起こります：</p><blockquote><p><em>「</em><strong><em>わが神なる主は、</em></strong><em> </em><strong><em>聖なる御使いたちと共に</em></strong><em>あなたのもとに来られる」（</em><a href="https://bibleox.com/ja/jp-ni/zah/14/#L5"><em>ゼカ. 14:5</em></a><em>）</em></p></blockquote><blockquote><p><em>「</em><strong><em>人の子は</em></strong><em>、栄光に輝いて</em><strong><em>天使たちを皆従えて来るとき</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/mf/25/#L31"><em>マタ. 25:31</em></a><em>）</em></p></blockquote><blockquote><p>「神に背いたこの罪深い時代に、わたしとわたしの言葉を恥じる者は、人の子もまた、<strong>父の栄光に輝いて聖なる天使たちと共に来るときに</strong>、その者を恥じる」（<a href="https://bibleox.com/ja/jp-ni/mk/8/#L38">マコ. 8:38</a>）</p></blockquote><blockquote><p>「<strong>人の子は、父の栄光に輝いて天使たちと共に来る</strong>が、そのとき、それぞれの行いに応じて報いるのである」（<a href="https://bibleox.com/ja/jp-ni/mf/16/#L27">マタ. 16:27</a>）</p></blockquote><blockquote><p><em>「アダムから数えて七代目に当たるエノクも、彼らについてこう預言しました。『見よ、</em><strong><em>主は数知れない聖なる者たちを引き連れて来られる</em></strong><em>』」（</em><a href="https://bibleox.com/ja/jp-ni/iud/1/#L14"><em>ユダ. 1:14</em></a><em>）</em></p></blockquote><blockquote><p><em>「</em><strong><em>わたしたちの主イエスが、御自身に属するすべての聖なる者たちと共に来られるとき</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/1sol/3/#L13"><em>１テサ. 3:13</em></a><em>）</em></p></blockquote><blockquote><p>「<strong>主イエスが力強い天使たちを率いて天から来られるとき</strong>」（<a href="https://bibleox.com/ja/jp-ni/2sol/1/#L7">２テサ. 1:7</a>）</p></blockquote><h3>同じ大人の体で来られる</h3><p>キリストは再び人から生まれるのではなく、すでに持っておられる体、紀元1年に生神女である処女マリアからお生まれになったときに受けられた体で来られます。</p><blockquote><p>「こう話し終わると、イエスは彼らが見ているうちに天に上げられたが、雲に覆われて彼らの目から見えなくなった。イエスが離れ去って行かれるとき、彼らは天を見つめていた。すると、白い服を着た二人の人がそばに立って、言った。『ガリラヤの人たち、なぜ天を見上げて立っているのか。<strong>あなたがたから離れて天に上げられたイエスは、天に行かれるのをあなたがたが見たのと同じ有様で、またおいでになる</strong>』」（<a href="https://bibleox.com/ja/jp-ni/act/1/#L9-11">使. 1:9-11</a>）</p></blockquote><h3>裁きのための来臨</h3><p>主は教えるためではなく、最初に来られたときにすでにお与えになった言葉によって裁くために来られます：</p><blockquote><p>「わたしを拒み、わたしの言葉を受け入れない者に対しては、裁くものがある。<strong>わたしの語った言葉が、終わりの日にその者を裁く</strong>」（<a href="https://bibleox.com/ja/jp-ni/in/12/#L48">ヨハ. 12:48</a>）</p></blockquote><blockquote><p>「人の子は、父の栄光に輝いて天使たちと共に来るが、そのとき、<strong>それぞれの行いに応じて報いるのである</strong>」（<a href="https://bibleox.com/ja/jp-ni/mf/16/#L27">マタ. 16:27</a>）</p></blockquote><blockquote><p>「<strong>人の子は、栄光に輝いて</strong>天使たちを皆従えて来るとき、その<strong>栄光の座に着く</strong>。そして、<strong>すべての国の民がその前に集められると</strong>、羊飼いが羊と山羊を分けるように、<strong>彼らをより分け</strong>、羊を右に、山羊を左に置く。&lt;…&gt; こうして、<strong>この者どもは永遠の罰を受け、正しい人たちは永遠の命にあずかるのである</strong>」（<a href="https://bibleox.com/ja/jp-ni/mf/25/#L31-33,46">マタ. 25:31-33,46</a>）</p></blockquote><blockquote><p>「これは、あなたがたを神の国にふさわしい者とする、<strong>神の判定が正しい</strong>という証拠です。あなたがたも、神の国のために苦しみを受けているのです。神は正しいことを行われます。あなたがたを苦しめている者には、苦しみをもって報い、また、苦しみを受けているあなたがたには、わたしたちと共に休息をもって報いてくださるのです。<strong>主イエスが力強い天使たちを率いて天から来られるとき</strong>、神はこの報いを実現なさいます。<strong>主イエスは、燃え盛る火の中を来られます。そして</strong>神を認めない者や、わたしたちの主イエスの福音に聞き従わない者に、<strong>罰をお与えになります</strong>」（<a href="https://bibleox.com/ja/jp-ni/2sol/1/#L5-8">２テサ. 1:5-8</a>）</p></blockquote>
