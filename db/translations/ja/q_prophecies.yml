    path: Pc1t_キリストについての預言
    title: キリストについての預言
    meta_desc: キリストについての聖書の預言
    menu: { parent: "預言", title: "キリストについての預言", priority: 1 }
    references: |-
      <ol><li><p>https://dssenglishbible.com/scroll4Q80.htm</p></li><li><p>https://dssenglishbible.com/scroll4Q88.htm 脚注を参照。</p></li></ol>
    body: |-
      <h2>預言</h2><ol><li><p>キリストの到来までの日数（<a href="https://bibleox.com/ja/jp-ni/dan/9/#L24-25">ダニ. 9:24-25</a>）。</p></li><li><p>キリストは<strong>第二の</strong>エルサレム神殿（今はもう存在しない）に来られる（<a href="https://bibleox.com/ja/jp-ni/ag/2/#L9">ハガ. 2:9</a>）。</p></li><li><p>キリストは、ユダ族が権力を失うときに来られる（<a href="https://bibleox.com/ja/jp-ni/gen/49/#L10">創. 49:10</a>）。<a href="https://ja.wikipedia.org/wiki/ヘロデ大王">ヘロデ大王</a>は<a href="https://ja.wikipedia.org/wiki/エドム">エドム人</a>（イドマヤ人）、すなわちエサウの子孫であって、ユダヤ人ではありませんでした。彼は、マカバイ家の属するユダヤ人の<a href="https://ja.wikipedia.org/wiki/ハスモン朝">ハスモン朝</a>に取って代わりました。</p></li><li><p>キリストはベツレヘムで生まれる（<a href="https://bibleox.com/ja/jp-ni/mih/5/#L1">ミカ. 5:1</a>。ほかの翻訳では5:2）。</p></li><li><p>キリストはダビデの子孫である（<a href="https://bibleox.com/ja/jp-ni/ps/89/#L4-6,28-30,37">詩. 89:4-6,28-30,37</a>）。</p></li><li><p>キリストは新しい契約を結ばれる（<a href="https://bibleox.com/ja/jp-ni/is/42/#L6">イザ. 42:6</a>）。神とのすべての契約は血によって結ばれましたが、この場合は、イエス・キリスト御自身の血によってです。</p></li><li><p>キリストは銀三十で裏切られる（<a href="https://bibleox.com/ja/jp-ni/zah/11/#L12-13">ゼカ. 11:12-13</a>）。</p></li><li><p>キリストは犯罪人と共に処刑される（<a href="https://bibleox.com/ja/jp-ni/dan/9/#L26">ダニ. 9:26</a>; <a href="https://bibleox.com/ja/jp-ni/is/53/#L12">イザ. 53:12</a>; <a href="https://bibleox.com/ja/jp-ni/zah/12/#L10">ゼカ. 12:10</a>）。</p></li><li><p>その手足が刺し貫かれる（<a href="https://bibleox.com/ja/jp-ni/ps/22/#L17">詩. 22:17</a>）。その方は（槍で）刺し貫かれる（<a href="https://bibleox.com/ja/jp-ni/zah/12/#L10">ゼカ. 12:10</a>）（批判への答えは下を参照）。</p></li><li><p>通りかかる者たちはキリストを嘲って、主に頼んだのなら、主が愛しておられるなら、主に救ってもらうがよい、と言う（<a href="https://bibleox.com/ja/jp-ni/ps/22/#L8-9">詩. 22:8-9</a>）。</p></li><li><p>キリストの処刑の後、エルサレムと神殿は破壊される（<a href="https://bibleox.com/ja/jp-ni/dan/9/#L26">ダニ. 9:26</a>）。</p></li><li><p>キリストの救いの苦難についての預言者イザヤの一つの章全体：<a href="https://bibleox.com/ja/jp-ni/is/53/">イザ. 53</a>：「<strong>彼が刺し貫かれたのはわたしたちの背きのためであり彼が打ち砕かれたのはわたしたちの咎のためであった。彼の受けた懲らしめによってわたしたちに平和が与えられ彼の受けた傷によって、わたしたちはいやされた</strong>。わたしたちは羊の群れ道を誤り、それぞれの方角に向かって行った。そのわたしたちの罪をすべて主は彼に負わせられた。<strong>苦役を課せられて、かがみ込み</strong>彼は口を開かなかった。<strong>屠り場に引かれる小羊のように</strong>毛を刈る者の前に物を言わない羊のように彼は口を開かなかった。捕らえられ、裁きを受けて、彼は命を取られた。彼の時代の誰が思い巡らしたであろうかわたしの民の背きのゆえに、<strong>彼が神の手にかかり</strong>命ある者の地から断たれたことを。彼は不法を働かずその口に偽りもなかったのに<strong>その墓は神に逆らう者と共にされ富める者と共に葬られた</strong>。病に苦しむこの人を打ち砕こうと主は望まれ<strong>彼は自らを償いの献げ物とした</strong>。彼は、子孫が末永く続くのを見る。主の望まれることは彼の手によって成し遂げられる。<strong>彼は自らの苦しみの実りを見それを知って満足する</strong>。<strong>わたしの僕は</strong>、多くの人が正しい者とされるために彼らの罪を自ら負った。それゆえ、わたしは多くの人を彼の取り分とし彼は戦利品としておびただしい人を受ける。<strong>彼が自らをなげうち、死んで罪人のひとりに数えられたからだ</strong>。多くの人の過ちを担い背いた者のために執り成しをしたのはこの人であった」（<a href="https://bibleox.com/ja/jp-ni/is/53/#L5-12">イザ. 53:5-12</a>）</p></li></ol><h2>キリストの苦難の予型</h2><ol><li><p>神は大祭司の聖別の儀式を定められました。大祭司と祭司たちは雄牛に手を置き、それから臨在の幕屋の入り口でそれを屠ります（<a href="https://bibleox.com/ja/jp-ni/ish/29/#L10-11">出. 29:10-11</a>）。同じように、大祭司たちと祭司たちは夜にキリストを捕らえようと謀り（<a href="https://bibleox.com/ja/jp-ni/mf/26/#L45-47">マタ. 26:45-47</a>）、それからエルサレムの町の門の外で処刑しました（<a href="https://bibleox.com/ja/jp-ni/evr/13/#L12">ヘブ. 13:12</a>）。</p></li><li><p>続いて、同じ箇所で。祭壇の角に雄牛の血が塗られ、残りはすべて祭壇の基に流されます（<a href="https://bibleox.com/ja/jp-ni/ish/29/#L12">出. 29:12</a>）。キリストがいけにえとしてささげられた祭壇は十字架でした。キリストの手足は釘で打ちつけられ、それから槍で刺し貫かれ、血が十字架（祭壇）の根もとに流れ落ちたので、十字架はキリストの血で塗られました。</p></li><li><p>聖別の儀式が終わった後、祭壇は神聖なものとなり、祭壇に触れるものはすべて聖なるものとなります（<a href="https://bibleox.com/ja/jp-ni/ish/29/#L37">出. 29:37</a>）。同じように、十字架（祭壇）はキリスト者にとって大いなる聖物となり、水や物や人々を聖別するために用いられます。成聖式で物として用いられ、人々や物の上に手で十字の印が描かれます。</p></li></ol><h2>キリストの苦難の預言</h2><ol><li><p>キリストは御自分を神の子と呼ばれる。</p></li><li><p>その言葉と行いは敵対者たちを暴く。</p></li><li><p>神を御自分の父と呼ばれる。</p></li><li><p>キリストの敵対者たちは主を辱め、責めさいなむ。</p></li><li><p>主を不名誉な死に定める。</p></li></ol><blockquote><p>「<strong>神に従う人は邪魔だから</strong>、だまして陥れよう。<strong>我々のすることに反対し</strong>、<strong>律法に背くといって我々をとがめ</strong>教訓に反するといって<strong>非難する</strong>のだから。神に従う人は、<strong>神を知っていると公言し</strong>、<strong>自らを主の僕と呼んでいる</strong>。彼らの存在は<strong>我々の考えをとがめだてる</strong>。<strong>だから、見るだけで気が重くなる。その生き方が他の者とは異なり、その行動も変わっているからだ。我々を偽り者と見なし、汚れを避けるかのように我々の道を遠ざかる</strong>。神に従う人の最期は幸せだと言い、<strong>神が自分の父であると豪語する</strong>。それなら彼の言葉が真実かどうか見てやろう。生涯の終わりに何が起こるかを確かめよう。<strong>本当に彼が神の子なら、助けてもらえるはずだ。敵の手から救い出されるはずだ</strong>。<strong>暴力と責め苦を加えて彼を試してみよう</strong>。その寛容ぶりを知るために、悪への忍耐ぶりを試みるために。<strong>彼を不名誉な死に追いやろう</strong>。彼の言葉どおりなら、神の助けがあるはずだ。」神を信じない者はこのように考える。だが、それは間違っている。<strong>悪に目がくらんでいるのだ</strong>」（<a href="https://bibleox.com/ja/jp-ni/prs/2/#L12-21">知. 2:12-21</a>）</p><p>ギリシア語原文では παῖδα κυρίου ἑαυτὸν ὀνομάζει —「自らを主の子（僕、息子）と呼んでいる」、εἰ γάρ ἐστιν ὁ δίκαιος υἱὸς θεοῦ —「もし正しい人が<strong>神の子</strong>なら」です。</p></blockquote><h2>反論</h2><h3>手足は刺し貫かれたのか、それとも獅子が砕くのか</h3><p>後代のマソラ本文（<a href="https://bibleox.com/ja/heb-osm/ps/22/#L17">詩. 22:17</a>）には、手足を刺し貫くという言葉がありません。その代わりに「獅子」（כָּאֲרִי、「獅子のように」）という語があります。本文には「砕く」という動詞はまったくなく、獅子の行為が手足とどう関係するのかもはっきりしません。新共同訳は「獅子のようにわたしの手足を砕く」（<a href="https://bibleox.com/ja/jp-ni/ps/22/#L17">詩. 22:17</a>）と訳していますが、「砕く」は補われた言葉です。翻訳によって訳が分かれるのはそのためです。</p><p>しかし、それでも「刺し貫いた」が正しいのです。七十人訳には ὤρυξαν χεῖράς μου καὶ πόδας —「彼らはわたしの手足を刺し貫いた（掘り通した）」とあり（<a href="https://bibleox.com/ja/gr-lxx-byz/ps/21/#L16">詩. 21:16、七十人訳</a>）、古代のクムランの巻物4Q88[2]も手足が刺し貫かれたことを裏づけています。</p><p>さらに、まさに刺し貫くことについて語っている、もう一つの預言があります。それはここで言及されています：</p><blockquote><p>「また、聖書の別の所に、『<strong>彼らは、自分たちの<mark>突き刺した</mark>者を見る</strong>』とも書いてある」（<a href="https://bibleox.com/ja/jp-ni/in/19/#L37">ヨハ. 19:37</a>）</p></blockquote><p>指しているのは次の箇所です：</p><blockquote><p>「わたしはダビデの家とエルサレムの住民に、憐れみと祈りの霊を注ぐ。彼らは、彼ら自らが<strong><mark>刺し貫いた</mark></strong>者であるわたしを見つめ、独り子を失ったように嘆き、初子の死を悲しむように悲しむ」（<a href="https://bibleox.com/ja/jp-ni/zah/12/#L10">ゼカ. 12:10</a>）</p></blockquote><blockquote><p>「וְשָׁפַכְתִּי עַל ־ בֵּית דָּוִיד וְעַל ׀ יוֹשֵׁב יְרוּשָׁלִַם רוּחַ חֵן וְתַחֲנוּנִים וְהִבִּיטוּ אֵלַי אֵת אֲשֶׁר ־ <strong>דָּקָרוּ</strong> וְסָפְדוּ עָלָיו כְּמִסְפֵּד עַל ־ הַיָּחִיד וְהָמֵר עָלָיו כְּהָמֵר עַֽל ־ הַבְּכֽוֹר ׃」（<a href="https://bibleox.com/ja/heb-osm/zah/12/#L10">ゼカ. 12:10</a>）</p></blockquote><p>דָּקָ֑רוּ</p><p>דקר — 刺す、刺し貫く。また、刺される、刺し貫かれる。</p><p>クムランの巻物4Q80[1]も、その方が刺し貫かれたことを裏づけています。</p>

  - src: семь-церквей-апокалипсиса
    path: Sc1a_黙示録の七つの教会
    title: 黙示録の七つの教会
    meta_desc: 黙示録の七つの教会についての聖書の引用
    menu: { parent: "預言", title: "黙示録の七つの教会", priority: 1 }
    body: |-
      <h2>黙示録の諸教会の評価</h2><p>教会の反対者たちが、神学者ヨハネの黙示録2–3章の内容を引き合いに出して、教会はまことの信仰を捨てたという論を立てようとすることがあります（<a href="https://bibleox.com/ja/jp-ni/otkr/2/#L1">黙. 2:1</a>）。そこでは主イエス・キリストが七つの教会に語りかけ、その長所と短所を指摘しておられます。実際には、本文を調べてみると逆なのです。諸教会はキリストの信仰を保っており、そのうちのあるものが責められるとすれば、それはその<strong><mark>行い</mark></strong>のためです。</p><h3>1. <strong>エフェソ</strong></h3><p>✅ 行いのためにほめられる（悪を避けること、偽使徒を見抜くこと、ニコライ派の行いを憎むこと、忍耐、主のための労苦）。</p><p>❌ 初めの愛から離れたことを責められ、そこに立ち帰って「初めのころの<strong><mark>行い</mark></strong>」に立ち戻るように勧められる（<a href="https://bibleox.com/ja/jp-ni/otkr/2/#L5">黙. 2:5</a>）。</p><h3>2. <strong>スミルナ</strong></h3><p>✅ 行いのためにほめられる（苦難、貧しさ、ののしりに耐えること）。将来迫害を受けることを恐れないように呼びかけられる。命の冠が約束される。何も責められていない。</p><h3>3. <strong>ペルガモン</strong></h3><p>✅ 行いのためにほめられる（迫害の脅しのもとでもキリストの信仰を捨てなかった）。</p><p>❌ 偶像に献げた肉を食べ、みだらなことをしていたニコライ派を<strong>追い出さなかった</strong>ことを責められる。それでもペルガモンの教会はキリストの信仰を捨てなかった。「<strong>わたしに対する信仰</strong>を捨てなかった」（<a href="https://bibleox.com/ja/jp-ni/otkr/2/#L13">黙. 2:13</a>）。</p><h3>4. <strong>ティアティラ</strong></h3><p>✅ <strong>信仰</strong>と行い（愛、奉仕、忍耐）のためにほめられる。</p><p>❌ 同じように「イゼベル」を追い出さず、彼女が信じる者たちを惑わして、みだらなことをさせ、偶像に献げた肉を食べさせるのを許したことを責められる（ペルガモンのニコライ派と同じように）。罰せられるのは、イゼベルと姦淫を行う者たちだけである。ほかの者たちはほめられている。「<em>わたしが行くときまで、今持っているものを固く守れ</em>」（<a href="https://bibleox.com/ja/jp-ni/otkr/2/#L25">黙. 2:25</a>）。</p><h3>5. <strong>サルディス</strong></h3><p>✅ 衣を汚さなかった少数の人々だけがほめられる。</p><p>❌ ほかの人々のために、その行いが不完全であることによって、死んだ者にたとえられる。「<em>わたしは、あなたの</em><strong><mark>行い</mark></strong><em>が、わたしの神の前に完全なものとは認めない</em>」（<a href="https://bibleox.com/ja/jp-ni/otkr/3/#L2">黙. 3:2</a>）。目を覚ましていないことを責められる。</p><h3>6. <strong>フィラデルフィア</strong></h3><p>✅ 行いのためにほめられ（力は弱かったが、キリストを否まなかった）、<em>忍耐についてのキリストの言葉</em>を守ったことのためにほめられる（<a href="https://bibleox.com/ja/jp-ni/otkr/3/#L10">黙. 3:10</a>）。「<em>持っているものを固く守りなさい</em>」と勧められる（<a href="https://bibleox.com/ja/jp-ni/otkr/3/#L11">黙. 3:11</a>）。何も責められていない。</p><h3>7. <strong>ラオディキア</strong></h3><p>ほめられていない。</p><p>❌ その行いを責められる。「わたしはあなたの<strong><mark>行い</mark></strong>を知っている。あなたは、冷たくもなく熱くもない」（<a href="https://bibleox.com/ja/jp-ni/otkr/3/#L15">黙. 3:15</a>）。キリストから金と衣と目薬を買うように、また熱心と悔い改めへと勧められる。「<em>熱心に努めよ。悔い改めよ</em>」（<a href="https://bibleox.com/ja/jp-ni/otkr/3/#L19">黙. 3:19</a>）。</p><h2>まとめ</h2><p>つまり、</p><ul><li><p>🟢 スミルナ（2）とフィラデルフィア（6）は、まったく責められていない。</p></li><li><p>🟡 ペルガモン（3）とティアティラ（4）は信仰を保ったが、惑わす者たち（ニコライ派とイゼベル）を追い出さなかったことを責められる。罰せられるのは、まさに偽りの教えに属する者たちである。教会そのものはほめられている。「<strong>わたしに対する信仰</strong>を捨てなかった」（ペルガモン）、「<em>わたしが行くときまで、今持っているものを固く守れ</em>」（ティアティラ）。</p></li><li><p>🟠 エフェソ（1）は敬虔さと信仰を守ったことのためにほめられ、初めの愛から離れたことを責められ、初めのころの<strong>行い</strong>に立ち戻るように勧められる。</p></li><li><p>🟠 サルディス（5）は衣を守った少数の人々のためにほめられ、その<strong>行い</strong>が不完全であることを責められる。</p></li><li><p>🔴 ラオディキア（7）は何もほめられず、その<strong>行い</strong>のなまぬるさを責められ、悔い改めに招かれる。</p></li></ul><h2>結論</h2><ul><li><p>だれも信仰のために責められてはおらず、むしろほとんどすべてがほめられている（1、2、3、4、6）。</p></li></ul><ul><li><p>ある教会は一つの行いの欠けのために責められているが、信仰を保ったことのためにほめられている（3、4）。</p></li></ul><ul><li><p>ほかの教会は行いにもっと重大な欠けがあるが、そこでも信仰は保たれている（1、5）。</p></li></ul><ul><li><p>最後の教会は行いへの無関心（なまぬるさ）のために責められている（7）。</p></li></ul><p>「行い」が信仰をも意味しうると考える人もいるかもしれません。しかし、明らかに信仰を保った教会が行いの欠けのために責められていること（3、4）は、そのような解釈の余地をほとんど残しません。したがって、黙示録の諸教会が責められているのは、その信仰（教え）のためではなく、行いの不完全さのためです。そして、まったく責められていない教会もあるのです。</p>

