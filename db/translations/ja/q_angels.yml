    body: |-
      <h2>天使は体を持たない霊である</h2><blockquote><p>「神は、かつて<strong><mark>天使</mark></strong>のだれに向かって、『わたしがあなたの敵をあなたの足台とするまで、わたしの右に座っていなさい』と言われたことがあるでしょうか。<strong><mark>天使たちは皆</mark>、奉仕する<mark>霊</mark>であって</strong>、救いを受け継ぐことになっている人々に仕えるために、遣わされたのではなかったですか」（<a href="https://bibleox.com/ja/jp-ni/evr/1/#L13-14">ヘブ. 1:13-14</a>）</p></blockquote><blockquote><p>「わたしの手や足を見なさい。まさしくわたしだ。触ってよく見なさい。<strong><mark>亡霊には肉も骨もないが</mark></strong>、あなたがたに見えるとおり、わたしにはそれがある」（<a href="https://bibleox.com/ja/jp-ni/lk/24/#L39">ルカ. 24:39</a>）<em>（「亡霊」は、ギリシア語原文では πνεῦμα —「<strong>霊</strong>」です。）</em></p></blockquote><h2>天使は救われる人々に仕えるために遣わされる</h2><blockquote><p>「神は、かつて<strong><mark>天使</mark></strong>のだれに向かって、『わたしがあなたの敵をあなたの足台とするまで、わたしの右に座っていなさい』と言われたことがあるでしょうか。天使たちは皆、<strong><mark>奉仕する霊であって、救いを受け継ぐことになっている人々に仕えるために、遣わされた</mark></strong>のではなかったですか」（<a href="https://bibleox.com/ja/jp-ni/evr/1/#L13-14">ヘブ. 1:13-14</a>）</p></blockquote><h2>神を畏れる人々と共にいる天使</h2><blockquote><p>「<strong><mark>主の使い</mark>はその周りに陣を敷き主を畏れる人を<mark>守り助けてくださった</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/ps/34/#L8">詩. 34:8</a>）<em>（ほかの翻訳では34:7。）</em></p></blockquote><blockquote><p>「<strong>いと高き神のもとに身を寄せて隠れ</strong>全能の神の陰に宿る人よ主に申し上げよ『わたしの避けどころ、砦わたしの神、依り頼む方』と。神はあなたを救い出してくださる仕掛けられた罠から、陥れる言葉から。&lt;…&gt; <strong>あなたは主を避けどころとしいと高き神を宿るところとした。あなたには災難もふりかかることがなく</strong>天幕には疫病も触れることがない。<strong><mark>主はあなたのために、御使いに命じてあなたの道のどこにおいても守らせてくださる</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/ps/91/#L1-3,9-11">詩. 91:1-3,9-11</a>）</p></blockquote><h2>信じる者たちの天使</h2><blockquote><p>「これらの小さな者を一人でも軽んじないように気をつけなさい。言っておくが、<strong><mark>彼らの天使たち</mark></strong>は天でいつもわたしの天の父の御顔を仰いでいるのである」（<a href="https://bibleox.com/ja/jp-ni/mf/18/#L10">マタ. 18:10</a>）</p></blockquote><h2>天使は死後、義人の魂を導く</h2><blockquote><p>「やがて、この貧しい人は死んで、<strong><mark>天使たちによって</mark></strong>宴席にいるアブラハムのすぐそばに<strong><mark>連れて行かれた</mark></strong>。金持ちも死んで葬られた」（<a href="https://bibleox.com/ja/jp-ni/lk/16/#L22">ルカ. 16:22</a>）<em>（「宴席にいるアブラハムのすぐそば」は、ギリシア語原文では εἰς τὸν κόλπον Ἀβραάμ —「アブラハムのふところへ」です。）</em></p></blockquote><h2>旧約の義人たちとキリスト者たちの天使への信仰</h2><blockquote><p>「千人に一人でもこの人のために<strong>執り成し</strong>その<strong>正しさを示すために遣わされる御使い</strong>があり彼を憐れんで『<strong>この人を免除し、滅亡に落とさないでください</strong>。代償を見つけて来ました』と言ってくれるなら」（<a href="https://bibleox.com/ja/jp-ni/iov/33/#L23-24">ヨブ. 33:23-24</a>）</p></blockquote><blockquote><p>「ペトロの声だと分かると、喜びのあまり門を開けもしないで家に駆け込み、ペトロが門の前に立っていると告げた。人々は、『あなたは気が変になっているのだ』と言ったが、ロデは、本当だと言い張った。彼らは、『<strong>それはペトロを守る天使だろう</strong>』と言い出した」（<a href="https://bibleox.com/ja/jp-ni/act/12/#L14-15">使. 12:14-15</a>）<em>（ギリシア語原文では ὁ ἄγγελός ἐστιν αὐτοῦ —「それは<strong>彼の天使</strong>だ」です。）</em></p></blockquote><h2>主であり神であるイエス・キリスト（人として）の天使</h2><h3>イエス・キリストは、人として、御自分の守護天使によって力づけられた</h3><blockquote><p>「<strong>すると、天使が天から現れて、イエスを力づけた</strong>。イエスは苦しみもだえ、いよいよ切に祈られた。汗が血の滴るように地面に落ちた」（<a href="https://bibleox.com/ja/jp-ni/lk/22/#L43-44">ルカ. 22:43-44</a>）</p></blockquote><h3>キリストの二人の守護天使が主について証しする</h3><h4>一度に二人の天使</h4><blockquote><p>「マリアは墓の外に立って泣いていた。泣きながら身をかがめて墓の中を見ると、イエスの遺体の置いてあった所に、<strong>白い衣を着た二人の天使が見えた。一人は頭の方に、もう一人は足の方に座っていた</strong>」（<a href="https://bibleox.com/ja/jp-ni/in/20/#L11-12">ヨハ. 20:11-12</a>）</p></blockquote><blockquote><p>「中に入っても、主イエスの遺体が見当たらなかった。そのため途方に暮れていると、<strong>輝く衣を着た二人の人がそばに現れた</strong>」（<a href="https://bibleox.com/ja/jp-ni/lk/24/#L3-4">ルカ. 24:3-4</a>）</p></blockquote><blockquote><p>「イエスが離れ去って行かれるとき、彼らは天を見つめていた。すると、<strong>白い服を着た二人の人がそばに立って</strong>」（<a href="https://bibleox.com/ja/jp-ni/act/1/#L10">使. 1:10</a>）</p></blockquote><h4>墓の外に一人の天使</h4><blockquote><p>「すると、大きな地震が起こった。主の<strong>天使</strong>が天から降って近寄り、<strong>石をわきへ転がし、その上に座った</strong>のである」（<a href="https://bibleox.com/ja/jp-ni/mf/28/#L2">マタ. 28:2</a>）</p></blockquote><h4>墓の中に一人の天使</h4><blockquote><p>「<strong>墓の中に入ると、白い長い衣を着た若者</strong>が右手に座っているのが見えたので、婦人たちはひどく驚いた」（<a href="https://bibleox.com/ja/jp-ni/mk/16/#L5">マコ. 16:5</a>）</p></blockquote><h2>天使が使徒を解放する</h2><blockquote><p>「すると、<strong>主の天使がそばに立ち、光が牢の中を照らした。天使はペトロのわき腹をつついて起こし、『急いで起き上がりなさい』と言った</strong>。すると、鎖が彼の手から外れ落ちた。天使が、『帯を締め、履物を履きなさい』と言ったので、ペトロはそのとおりにした。また天使は、『上着を着て、ついて来なさい』と言った。それで、ペトロは外に出てついて行ったが、天使のしていることが現実のこととは思われなかった。幻を見ているのだと思った。第一、第二の衛兵所を過ぎ、町に通じる鉄の門の所まで来ると、門がひとりでに開いたので、そこを出て、ある通りを進んで行くと、急に天使は離れ去った。ペトロは我に返って言った。『今、初めて本当のことが分かった。主が天使を遣わして、ヘロデの手から、またユダヤ民衆のあらゆるもくろみから、わたしを救い出してくださったのだ。』こう分かるとペトロは、マルコと呼ばれていたヨハネの母マリアの家に行った。そこには、大勢の人が集まって祈っていた。門の戸をたたくと、ロデという女中が取り次ぎに出て来た。ペトロの声だと分かると、喜びのあまり門を開けもしないで家に駆け込み、ペトロが門の前に立っていると告げた。人々は、『あなたは気が変になっているのだ』と言ったが、ロデは、本当だと言い張った。彼らは、『<strong>それはペトロを守る天使だろう</strong>』と言い出した」（<a href="https://bibleox.com/ja/jp-ni/act/12/#L7-15">使. 12:7-15</a>）</p></blockquote>

  - src: диавол
    path: Dv1l_悪魔
    title: 悪魔（サタン）
    meta_desc: サタンは神の敵対者であり、自分の意志で神への奉仕から離れ去った人格的な存在、天使（霊）である
    menu: { parent: "天使/堕落した天使", title: "悪魔（サタン）", priority: 1 }
    body: |-
      <h2>悪魔（サタン）は堕落した天使である</h2><p>悪魔は、神によって造られた多くの天使の一人ですが、後に神に仕えることを望まず、すなわち神から離れ去り、堕落しました：</p><blockquote><p>「お前はあるべき姿を印章としたものであり知恵に満ち、美しさの極みである。お前は神の園であるエデンにいた。あらゆる宝石がお前を包んでいた。ルビー、黄玉、紫水晶かんらん石、縞めのう、碧玉サファイア、ざくろ石、エメラルド。それらは金で作られた留め金でお前に着けられていた。それらはお前が創造された日に整えられた。<strong>わたしはお前を翼を広げて覆うケルブとして造った。お前は神の聖なる山にいて火の石の間を歩いていた。お前が創造された日からお前の歩みは無垢であったがついに不正がお前の中に見いだされるようになった</strong>。お前の取り引きが盛んになるとお前の中に不法が満ち<strong>罪を犯すようになった。そこで、わたしはお前を神の山から追い出し</strong>翼で覆うケルブであるお前を火の石の間から滅ぼした。<strong>お前の心は美しさのゆえに高慢となり</strong>栄華のゆえに知恵を堕落させた。<strong>わたしはお前を地の上に投げ落とし</strong>王たちの前で見せ物とした。お前は悪行を重ね、不正な取り引きを行って自分の聖所を汚した。<strong>それゆえ、わたしはお前の中から火を出させお前を焼き尽くさせた</strong>。わたしは見ている者すべての前でお前を地上の灰にした。諸国の民のなかで、お前を知っていた者は皆お前のゆえにぼう然とする。お前は人々に恐怖を引き起こしとこしえに消えうせる」（<a href="https://bibleox.com/ja/jp-ni/iez/28/#L12-19">エゼ. 28:12-19</a>）</p></blockquote><p>神から離れ去ったこのような天使たちは、さまざまな言葉で呼ばれています。悪霊（<a href="https://bibleox.com/ja/jp-ni/mf/8/#L31">マタ. 8:31</a>; <a href="https://bibleox.com/ja/jp-ni/tov/6/#L8">トビ. 6:8</a>）、サタンの使い（<a href="https://bibleox.com/ja/jp-ni/2kor/12/#L7">２コリ. 12:7</a>）、汚れた霊（<a href="https://bibleox.com/ja/jp-ni/mf/10/#L1">マタ. 10:1</a>）、悪鬼（俗に）。サタンはまた、蛇（<a href="https://bibleox.com/ja/jp-ni/gen/3/#L1">創. 3:1</a>; <a href="https://bibleox.com/ja/jp-ni/is/27/#L1">イザ. 27:1</a>; <a href="https://bibleox.com/ja/jp-ni/otkr/12/#L9">黙. 12:9</a>; <a href="https://bibleox.com/ja/jp-ni/otkr/20/#L2">20:2</a>）、竜（<a href="https://bibleox.com/ja/jp-ni/otkr/12/#L9">黙. 12:9</a>; <a href="https://bibleox.com/ja/jp-ni/otkr/20/#L2">20:2</a>）、明けの明星、曙の子（ルシフェル）（<a href="https://bibleox.com/ja/jp-ni/is/14/#L12">イザ. 14:12</a>）、レビヤタン（<a href="https://bibleox.com/ja/jp-ni/is/27/#L1">イザ. 27:1</a>）、この世の支配者（<a href="https://bibleox.com/ja/jp-ni/in/12/#L31">ヨハ. 12:31</a>）、悪い者（<a href="https://bibleox.com/ja/jp-ni/mf/13/#L19">マタ. 13:19</a>）、偽りを言う霊（<a href="https://bibleox.com/ja/jp-ni/3ts/22/#L22">王上. 22:22</a>）とも呼ばれています。悪魔は非人格的な感情でも、人の中の抽象的な衝動でも、寓話でもありません。現実の存在、人格です。悪魔は最初に罪を犯した存在です：</p><blockquote><p>「罪を犯す者は悪魔に属します。<strong>悪魔は初めから罪を犯しているからです</strong>。悪魔の働きを滅ぼすためにこそ、神の子が現れたのです」（<a href="https://bibleox.com/ja/jp-ni/1in/3/#L8">１ヨハ. 3:8</a>）</p></blockquote><h2>悪魔には自分の意志がある</h2><blockquote><p>「こうして彼らは、悪魔に生け捕りにされて<strong>その意のままになっていても</strong>、いつか目覚めてその罠から逃れるようになるでしょう」（<a href="https://bibleox.com/ja/jp-ni/2tim/2/#L26">２テモ. 2:26</a>）</p></blockquote><h2>悪魔は人に悪い思いを吹き込むことによって働く</h2><blockquote><p>「すると、ペトロは言った。『アナニア、<strong>なぜ、あなたはサタンに心を奪われ、聖霊を欺いて</strong>、土地の代金をごまかしたのか』」（<a href="https://bibleox.com/ja/jp-ni/act/5/#L3">使. 5:3</a>）<em>（「心を奪われ」は、ギリシア語原文では ἐπλήρωσεν ὁ σατανᾶς τὴν καρδίαν σου —「サタンがあなたの心を<strong>満たし</strong>」です。）</em></p></blockquote><blockquote><p>「夕食のときであった。<strong>既に悪魔は、イスカリオテのシモンの子ユダに、イエスを裏切る考えを抱かせていた</strong>」（<a href="https://bibleox.com/ja/jp-ni/in/13/#L2">ヨハ. 13:2</a>）</p></blockquote><h2>サタンは天から落ちた</h2><blockquote><p>「わたしは、<strong>サタンが</strong>稲妻のように<strong>天から落ちる</strong>のを見ていた」（<a href="https://bibleox.com/ja/jp-ni/lk/10/#L18">ルカ. 10:18</a>; <a href="https://bibleox.com/ja/jp-ni/iez/28/#L12-19">エゼ. 28:12-19</a>）</p></blockquote><h2>サタンはほかの天使たちを引き連れた</h2><blockquote><p>「<strong>神は、罪を犯した天使たちを容赦せず</strong>、暗闇という縄で縛って地獄に引き渡し、裁きのために閉じ込められました」（<a href="https://bibleox.com/ja/jp-ni/2pet/2/#L4">２ペト. 2:4</a>）</p></blockquote><h2>悪魔のために死が世に入った</h2><blockquote><p>「<strong>悪魔のねたみによって死がこの世に入り</strong>、悪魔の仲間に属する者が死を味わうのである」（<a href="https://bibleox.com/ja/jp-ni/prs/2/#L24">知. 2:24</a>）</p></blockquote><h2>悪魔は人々の敵である。破滅へと引き込む者を探している</h2><blockquote><p>「身を慎んで目を覚ましていなさい。<strong>あなたがたの敵である悪魔</strong>が、ほえたける獅子のように、<strong>だれかを食い尽くそうと探し回っています</strong>」（<a href="https://bibleox.com/ja/jp-ni/1pet/5/#L8">１ペト. 5:8</a>）</p></blockquote><h2>悪魔は人の救いの敵である</h2><blockquote><p>「このたとえの意味はこうである。種は神の言葉である。道端のものとは、御言葉を聞くが、<strong>信じて救われることのないように</strong>、<strong>後から悪魔が来て、その心から御言葉を奪い去る</strong>人たちである」（<a href="https://bibleox.com/ja/jp-ni/lk/8/#L11-12">ルカ. 8:11-12</a>）</p></blockquote><blockquote><p>「主は、主の御使いの前に立つ大祭司ヨシュアと、<strong>その右に立って彼を訴えようとしているサタン</strong>をわたしに示された」（<a href="https://bibleox.com/ja/jp-ni/zah/3/#L1">ゼカ. 3:1</a>）</p></blockquote><h2>悪魔は神の天使を装う</h2><blockquote><p>「だが、驚くには当たりません。<strong>サタンでさえ光の天使を装うのです</strong>」（<a href="https://bibleox.com/ja/jp-ni/2kor/11/#L14">２コリ. 11:14</a>）</p></blockquote><h2>悪魔は、神に従い、悪魔から離れる人々から逃げ去る</h2><blockquote><p>「だから、<strong>神に服従し、悪魔に反抗しなさい。そうすれば、悪魔はあなたがたから逃げて行きます</strong>」（<a href="https://bibleox.com/ja/jp-ni/iak/4/#L7">ヤコ. 4:7</a>）</p></blockquote><h2>悪魔は聖書を知っており、その意味をゆがめて、それによって誘惑する</h2><blockquote><p>「そこで、悪魔はイエスをエルサレムに連れて行き、神殿の屋根の端に立たせて言った。『神の子なら、<strong>ここから飛び降りたらどうだ。というのは、こう書いてあるからだ</strong>。「神はあなたのために天使たちに命じて、あなたをしっかり守らせる。」また、「あなたの足が石に打ち当たることのないように、天使たちは手であなたを支える。」』イエスは、『「あなたの神である主を試してはならない」と言われている』とお答えになった」（<a href="https://bibleox.com/ja/jp-ni/lk/4/#L9-12">ルカ. 4:9-12</a>）</p></blockquote><h2>悪魔は偽りの父である</h2><blockquote><p>「悪魔は最初から人殺しであって、真理をよりどころとしていない。<strong>彼の内には真理がないからだ</strong>。悪魔が偽りを言うときは、その本性から言っている。<strong>自分が偽り者であり、その父だからである</strong>」（<a href="https://bibleox.com/ja/jp-ni/in/8/#L44">ヨハ. 8:44</a>）</p></blockquote><h2>悪魔は不思議な業を行い、天から火を降らせることができる</h2><blockquote><p>「<strong>主はサタンに言われた。『それでは、彼のものを一切、お前のいいようにしてみるがよい</strong>。ただし彼には、手を出すな。』サタンは主のもとから出て行った。&lt;…&gt; 彼が話し終らないうちに、また一人が来て言った。『御報告いたします。<strong>天から神の火が降って、羊も羊飼いも焼け死んでしまいました</strong>。わたしひとりだけ逃げのびて参りました』」（<a href="https://bibleox.com/ja/jp-ni/iov/1/#L12,16">ヨブ. 1:12,16</a>）</p></blockquote><blockquote><p>「不法の者は、<strong>サタンの働きによって現れ、あらゆる偽りの奇跡としるしと不思議な業とを行い</strong>」（<a href="https://bibleox.com/ja/jp-ni/2sol/2/#L9">２テサ. 2:9</a>）</p></blockquote><h2>悪魔は神の天使たちと言い争う</h2><blockquote><p>「大天使ミカエルは、モーセの遺体のことで悪魔と言い争ったとき、あえてののしって相手を裁こうとはせず、『主がお前を懲らしめてくださるように』と言いました」（<a href="https://bibleox.com/ja/jp-ni/iud/1/#L9">ユダ. 1:9</a>）</p></blockquote><h2>堕落した天使たちのために、永遠の苦しみの場所が用意されている</h2><blockquote><p>「それから、王は左側にいる人たちにも言う。『呪われた者ども、わたしから離れ去り、<strong>悪魔とその手下のために用意してある永遠の火</strong>に入れ』」（<a href="https://bibleox.com/ja/jp-ni/mf/25/#L41">マタ. 25:41</a>）<em>（「手下」は、ギリシア語原文では τοῖς ἀγγέλοις αὐτοῦ —「その<strong>天使たち</strong>」です。）</em></p></blockquote><blockquote><p>「そして彼らを惑わした<strong>悪魔は、火と硫黄の池に投げ込まれた</strong>。そこにはあの獣と偽預言者がいる。そして、この者どもは昼も夜も世々限りなく責めさいなまれる」（<a href="https://bibleox.com/ja/jp-ni/otkr/20/#L10">黙. 20:10</a>）</p></blockquote><h3>悪霊どもはこれを知っている</h3><blockquote><p>「突然、彼らは叫んだ。『神の子、かまわないでくれ。<strong>まだ、その時ではないのにここに来て、我々を苦しめるのか</strong>』」（<a href="https://bibleox.com/ja/jp-ni/mf/8/#L29">マタ. 8:29</a>）</p></blockquote><h2>悪霊どもは自由に（自ら進んで）神の御心を求めはしないが、神の命令に背くことはできない</h2><blockquote><p>「人々は皆驚いて、論じ合った。『これはいったいどういうことなのだ。権威ある新しい教えだ。<strong>この人が汚れた霊に命じると、その言うことを聴く</strong>』」（<a href="https://bibleox.com/ja/jp-ni/mk/1/#L27">マコ. 1:27</a>）</p></blockquote><blockquote><p>「そこで、悪霊どもはイエスに、『<strong>我々を追い出すのなら</strong>、あの豚の中にやってくれ』と願った」（<a href="https://bibleox.com/ja/jp-ni/mf/8/#L31">マタ. 8:31</a>）<em>（ビザンティン本文（多数派写本）では「あの豚の群れの中に入ることを<strong>許してくれ</strong>」（ἐπίτρεψον ἡμῖν ἀπελθεῖν）です。）</em></p></blockquote>
