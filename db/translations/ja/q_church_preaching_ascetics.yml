  - src: стыд-показаться-верующим
    path: Sh1m_信者と見られることを恥じること
    title: 信者と見られることを恥じること
    meta_desc: 信者と見られることを恥じることについての聖書の引用
    menu: { parent: "教会/宣教", title: "信者と見られることを恥じる", priority: 1 }
    body: |-
      <h2>キリストのものと呼ばれることを恥じること</h2><blockquote><p>「神に背いたこの罪深い時代に、<strong>わたしとわたしの言葉を恥じる者は</strong>、<strong>人の子もまた</strong>、父の栄光に輝いて聖なる天使たちと共に来るときに、<strong>その者を恥じる</strong>」（<a href="https://bibleox.com/ja/jp-ni/mk/8/#L38">マコ. 8:38</a>）</p></blockquote><blockquote><p>「<strong>わたしとわたしの言葉を恥じる者は</strong>、<strong>人の子も</strong>、自分と父と聖なる天使たちとの栄光に輝いて来るときに、<strong>その者を恥じる</strong>」（<a href="https://bibleox.com/ja/jp-ni/lk/9/#L26">ルカ. 9:26</a>）</p></blockquote><blockquote><p>「お前たちの魂が主の慈しみを喜びとし、<strong>主を賛美することを恥じないように</strong>」（<a href="https://bibleox.com/ja/jp-ni/prsir/51/#L29">シラ. 51:29</a>）</p></blockquote><blockquote><p>「しかし、<strong>おくびょうな者</strong>、不信仰な者、忌まわしい者、人を殺す者、みだらな行いをする者、魔術を使う者、偶像を拝む者、すべてうそを言う者、このような者たちに対する報いは、火と硫黄の燃える池である。それが、第二の死である」（<a href="https://bibleox.com/ja/jp-ni/otkr/21/#L8">黙. 21:8</a>）</p></blockquote><h2>キリストのための苦しみについて</h2><p><a href="https://bibleox.com/ja/ja/w/Sf7x_キリストのための苦しみ/">キリストのための苦しみ</a></p>

  - src: проповедь-споры-о-вере
    path: Ds2p_論争
    title: 論争
    meta_desc: 信仰についての論争のあり方とその期間についての聖書の引用
    menu: { parent: "教会/宣教", title: "論争", priority: 2 }
    body: |-
      <h2>論争のあり方</h2><h3>小羊のように</h3><blockquote><p>「行きなさい。<strong>わたしはあなたがたを遣わす</strong>。それは、狼の群れに<strong><mark>小羊を</mark></strong>送り込むようなものだ。&lt;…&gt; しかし、町に入っても、迎え入れられなければ、広場に出てこう言いなさい。『足についたこの町の埃さえも払い落として、あなたがたに返す。しかし、神の国が近づいたことを知れ』と」（<a href="https://bibleox.com/ja/jp-ni/lk/10/#L3,10-11">ルカ. 10:3,10-11</a>）</p></blockquote><blockquote><p>「<strong>わたしはあなたがたを遣わす</strong>。それは、狼の群れに<strong><mark>羊を</mark></strong>送り込むようなものだ。だから、<strong>蛇のように<mark>賢く</mark></strong>、<strong>鳩のように<mark>素直に</mark>なりなさい</strong>」（<a href="https://bibleox.com/ja/jp-ni/mf/10/#L16">マタ. 10:16</a>）</p></blockquote><h3>柔和と愛</h3><blockquote><p>「心の中でキリストを主とあがめなさい。<strong>あなたがたの抱いている希望について説明を要求する人には、いつでも弁明できるように備えていなさい</strong>」（<a href="https://bibleox.com/ja/jp-ni/1pet/3/#L15">１ペト. 3:15</a>）<em>（新共同訳では、続く16節の初めに「それも、<mark>穏やかに</mark>、敬意をもって」とあります。ギリシア語 μετὰ πραΰτητος καὶ φόβου —「柔和と畏れとをもって」。）</em></p></blockquote><blockquote><p>「人々に、次のことを思い起こさせなさい。支配者や権威者に服し、これに従い、すべての善い業を行う用意がなければならないこと、また、<strong>だれをもそしらず、争いを好まず、寛容で、すべての人に心から<mark>優しく</mark>接しなければならない</strong>ことを」（<a href="https://bibleox.com/ja/jp-ni/tit/3/#L1-2">テト. 3:1-2</a>）<em>（「心から優しく」は、ギリシア語原文では πᾶσαν ἐνδεικνυμένους πραΰτητα —「あらゆる柔和を示して」です。）</em></p></blockquote><blockquote><p>「主の僕たる者は争わず、すべての人に柔和に接し、教えることができ、よく忍び、<strong>反抗する者を<mark>優しく</mark>教え導かねばなりません</strong>。神は彼らを悔い改めさせ、真理を認識させてくださるかもしれないのです」（<a href="https://bibleox.com/ja/jp-ni/2tim/2/#L24-25">２テモ. 2:24-25</a>）<em>（ギリシア語 ἐν πραΰτητι —「柔和をもって」）</em></p></blockquote><blockquote><p>「あなたがたの中で、知恵があり分別があるのはだれか。その人は、<strong>知恵にふさわしい<mark>柔和な</mark>行いを、立派な生き方によって示しなさい</strong>。しかし、あなたがたは、<strong>内心ねたみ深く利己的であるなら、自慢したり、真理に逆らってうそをついたりしてはなりません</strong>」（<a href="https://bibleox.com/ja/jp-ni/iak/3/#L13-14">ヤコ. 3:13-14</a>）</p></blockquote><blockquote><p>「さて、あなたがたの間で面と向かっては弱腰だが、離れていると強硬な態度に出る、と思われている、このわたしパウロが、<strong>キリストの<mark>優しさ</mark>と心の広さとをもって、あなたがたに願います</strong>」（<a href="https://bibleox.com/ja/jp-ni/2kor/10/#L1">２コリ. 10:1</a>）<em>（「優しさ」は、ギリシア語原文では πραΰτητος —「柔和」です。）</em></p></blockquote><blockquote><p>「<strong>そこで、主に結ばれて囚人となっているわたしはあなたがたに勧めます。神から招かれたのですから、その招きにふさわしく歩み、一切高ぶることなく、<mark>柔和で</mark>、寛容の心を持ちなさい</strong>。愛をもって互いに忍耐し」（<a href="https://bibleox.com/ja/jp-ni/ef/4/#L1-2">エフェ. 4:1-2</a>）</p></blockquote><blockquote><p>「<strong>わたしのこの命令は、清い心と正しい良心と純真な信仰とから生じる<mark>愛</mark>を目指すものです</strong>。ある人々はこれらのものからそれて、無益な議論の中に迷い込みました。彼らは、自分の言っていることも主張している事柄についても理解していないのに、律法の教師でありたいと思っています」（<a href="https://bibleox.com/ja/jp-ni/1tim/1/#L5-7">１テモ. 1:5-7</a>）</p></blockquote><blockquote><p>「たとえ、人々の異言、天使たちの異言を語ろうとも、愛がなければ、わたしは騒がしいどら、やかましいシンバル。<strong>たとえ</strong>、預言する賜物を持ち、<strong>あらゆる神秘とあらゆる知識に通じていようとも、たとえ、山を動かすほどの完全な信仰を持っていようとも、<mark>愛がなければ、無に等しい</mark></strong>。<strong>全財産を貧しい人々のために使い尽くそうとも、誇ろうとしてわが身を死に引き渡そうとも、<mark>愛がなければ、わたしに何の益もない</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/1kor/13/#L1-3">１コリ. 13:1-3</a>）<em>（「誇ろうとして」は一部の写本の読みで、ビザンティン本文（多数派写本）では ἵνα καυθήσωμαι —「焼かれるために」です。）</em></p></blockquote><blockquote><p>「<strong><mark>上から出た知恵は、何よりもまず、純真で、更に、温和で、優しく、従順なものです。憐れみと良い実に満ちています。偏見はなく、偽善的でもありません</mark></strong>。義の実は、平和を実現する人たちによって、平和のうちに蒔かれるのです」（<a href="https://bibleox.com/ja/jp-ni/iak/3/#L17-18">ヤコ. 3:17-18</a>）</p></blockquote><h2>愚かな議論を避けよ</h2><blockquote><p>「若いころの情欲から遠ざかり、清い心で主を呼び求める人々と共に、正義と信仰と愛と平和を追い求めなさい。<strong><mark>愚かで無知な議論を避けなさい</mark></strong>。あなたも知っているとおり、<strong>そのような議論は争いのもとになります</strong>。主の僕たる者は<strong>争わず</strong>、すべての人に柔和に接し、教えることができ、よく忍び、反抗する者を優しく教え導かねばなりません。神は彼らを悔い改めさせ、真理を認識させてくださるかもしれないのです」（<a href="https://bibleox.com/ja/jp-ni/2tim/2/#L22-25">２テモ. 2:22-25</a>）</p></blockquote><blockquote><p>「異なる教えを説き、わたしたちの主イエス・キリストの健全な言葉にも、信心に基づく教えにも従わない者がいれば、その者は高慢で、何も分からず、<strong><mark>議論や口論に病みつきになっています</mark>。そこから、ねたみ、争い、中傷、邪推</strong>」（<a href="https://bibleox.com/ja/jp-ni/1tim/6/#L3-4">１テモ. 6:3-4</a>）</p></blockquote><blockquote><p>「これらのことを人々に思い起こさせ、<strong><mark>言葉をあげつらわないように</mark></strong>と、神の御前で厳かに命じなさい。<strong>そのようなことは、何の役にも立たず、聞く者を破滅させるのです</strong>」（<a href="https://bibleox.com/ja/jp-ni/2tim/2/#L14">２テモ. 2:14</a>）</p></blockquote><blockquote><p>「<strong><mark>愚かな議論</mark>、系図の詮索、争い、律法についての論議<mark>を避けなさい</mark>。それは無益で、むなしいものだからです</strong>。<strong><mark>分裂を引き起こす人には</mark>一、二度訓戒し、従わなければ、かかわりを持たないようにしなさい</strong>。あなたも知っているとおり、このような人は心がすっかりゆがんでいて、自ら悪いと知りつつ罪を犯しているのです」（<a href="https://bibleox.com/ja/jp-ni/tit/3/#L9-11">テト. 3:9-11</a>）<em>（「分裂を引き起こす人」は、ギリシア語原文では αἱρετικὸν ἄνθρωπον —「異端の人」です。）</em></p></blockquote>

  - src: наставления
    path: Ex9h_勧め
    title: 勧め
    meta_desc: 互いに勧め、諭し合うことについての聖書の引用
    menu: { parent: "教会/宣教", title: "勧め", priority: 9 }
    body: |-
      <blockquote>「キリストの言葉があなたがたの内に豊かに宿るようにしなさい。知恵を尽くして<b>互いに教え、諭し合い</b>、詩編と賛歌と霊的な歌により、感謝して心から神をほめたたえなさい」（<a href="https://bibleox.com/ja/jp-ni/kol/3/#L16">コロ. 3:16</a>）</blockquote><blockquote>「ですから、あなたがたは、現にそうしているように、<b>励まし合い、お互いの向上に心がけなさい</b>」（<a href="https://bibleox.com/ja/jp-ni/1sol/5/#L11">１テサ. 5:11</a>）</blockquote><blockquote>「あなたがたのうちだれ一人、罪に惑わされてかたくなにならないように、『今日』という日のうちに、<b>日々励まし合いなさい</b>」（<a href="https://bibleox.com/ja/jp-ni/evr/3/#L13">ヘブ. 3:13</a>）</blockquote><blockquote>「<b>互いに愛と善行に励むように心がけ</b>」（<a href="https://bibleox.com/ja/jp-ni/evr/10/#L24">ヘブ. 10:24</a>）</blockquote><blockquote>「ある人たちの習慣に倣って集会を怠ったりせず、むしろ<b>励まし合いましょう</b>。かの日が近づいているのをあなたがたは知っているのですから、ますます励まし合おうではありませんか」（<a href="https://bibleox.com/ja/jp-ni/evr/10/#L25">ヘブ. 10:25</a>）</blockquote><blockquote>「主の僕たる者は<b>争わず、すべての人に柔和に接し</b>、<b>教えることができ</b>、<b>よく忍び</b>、反抗する者を<b>優しく教え導かねばなりません</b>。神は彼らを悔い改めさせ、真理を認識させてくださるかもしれないのです」（<a href="https://bibleox.com/ja/jp-ni/2tim/2/#L24-25">２テモ. 2:24-25</a>）</blockquote>

  - src: апостолы-долго-учили-общины
    path: Al9t_使徒たちは長い間共同体を教えた
    title: 使徒たちは長い間共同体を教えた
    meta_desc: 使徒たちが長い間共同体を教えたことについての聖書の引用
    menu: { parent: "教会/宣教", title: "使徒たちは長く教えた", priority: 9 }
    body: |-
      <p>使徒パウロはアジアの長老たちを3年間教えました：</p><blockquote><p>「だから、<strong>わたしが三年間、あなたがた一人一人に夜も昼も涙を流して教えてきたこと</strong>を思い起こして、目を覚ましていなさい」（<a href="https://bibleox.com/ja/jp-ni/act/20/#L31">使. 20:31</a>）</p></blockquote><p>使徒パウロはエフェソのキリスト者たちを2年3か月教えました：</p><blockquote><p>「パウロは会堂に入って、<strong>三か月間</strong>、神の国のことについて大胆に論じ、人々を説得しようとした。しかしある者たちが、かたくなで信じようとはせず、会衆の前でこの道を非難したので、パウロは彼らから離れ、弟子たちをも退かせ、ティラノという人の講堂で毎日論じていた。このようなことが<strong>二年も</strong>続いたので、アジア州に住む者は、ユダヤ人であれギリシア人であれ、だれもが主の言葉を聞くことになった」（<a href="https://bibleox.com/ja/jp-ni/act/19/#L8-10">使. 19:8-10</a>）</p></blockquote>

  - src: мало-проповедников
    path: Fp10r_宣教者は少ない
    title: 宣教者は少ない
    meta_desc: 宣教者についての聖書の引用
    menu: { parent: "教会/宣教", title: "宣教者は少ない", priority: 10 }
    body: |-
      <blockquote>「あなたたちがわたしの掟に従って歩み、わたしの戒めを忠実に守るならば、&lt;…&gt; あなたたちは敵を追撃し、剣にかけて滅ぼす。<b>あなたたちは五人で百人の敵を</b>、百人で一万の敵を追撃し、剣にかけて滅ぼす。わたしはあなたたちを顧み、あなたたちに子を生ませ、その数を増し、あなたたちとわたしの契約を立てる」（<a href="https://bibleox.com/ja/jp-ni/lev/26/#L3,7-9">レビ. 26:3,7-9</a>）</blockquote><blockquote>「そして、彼らに言われた。『<b>収穫は多いが、働き手が少ない</b>。だから、収穫のために働き手を送ってくださるように、収穫の主に願いなさい』」（<a href="https://bibleox.com/ja/jp-ni/lk/10/#L2">ルカ. 10:2</a>）</blockquote><blockquote>「そこで、弟子たちに言われた。『<b>収穫は多いが、働き手が少ない</b>。だから、収穫のために働き手を送ってくださるように、収穫の主に願いなさい』」（<a href="https://bibleox.com/ja/jp-ni/mf/9/#L37-38">マタ. 9:37-38</a>）</blockquote>

  - src: искушения
    path: Tm18p_誘惑
    title: 誘惑（試練）
    meta_desc: 誘惑（試練）についての聖書の引用
    menu: { parent: "教会/修行", title: "誘惑", priority: 18 }
    body: |-
      <h2>信者は誘惑に備えなければならない</h2><blockquote><p>「<strong><mark>子よ、主に仕えるつもりなら、自らを試練に向けて備えよ</mark></strong>。心を引き締めて、耐え忍べ。災難のときにも、取り乱すな。主に寄りすがり、決して離れるな。そうすれば、豊かな晩年を送ることになる。<strong>身にふりかかる艱難は、すべて甘受せよ。たとえ屈辱を受けても、我慢せよ。金は火で精錬され</strong>、人は屈辱のかまどで陶冶され、神に受け入れられる」（<a href="https://bibleox.com/ja/jp-ni/prsir/2/#L1-5">シラ. 2:1-5</a>）</p></blockquote><h2>誘惑（試練）は益となる</h2><blockquote><p>「<strong>多くの者は清められ、白くされ、練られる</strong>。逆らう者はなお逆らう」（<a href="https://bibleox.com/ja/jp-ni/dan/12/#L10">ダニ. 12:10</a>）</p></blockquote><blockquote><p>「子よ、主に仕えるつもりなら、<strong>自らを試練に向けて備えよ</strong>。心を引き締めて、耐え忍べ。災難のときにも、取り乱すな。主に寄りすがり、決して離れるな。そうすれば、<strong>豊かな晩年を送ることになる</strong>。<strong>身にふりかかる艱難は、すべて甘受せよ</strong>。たとえ屈辱を受けても、我慢せよ。金は火で精錬され、人は屈辱のかまどで陶冶され、神に受け入れられる」（<a href="https://bibleox.com/ja/jp-ni/prsir/2/#L1-5">シラ. 2:1-5</a>）</p></blockquote><blockquote><p>「<strong>わたしの兄弟たち、いろいろな試練に出会うときは、この上ない喜びと思いなさい</strong>。信仰が試されることで忍耐が生じると、あなたがたは知っています。あくまでも忍耐しなさい。そうすれば、完全で申し分なく、何一つ欠けたところのない人になります」（<a href="https://bibleox.com/ja/jp-ni/iak/1/#L2-4">ヤコ. 1:2-4</a>）<em>（「試練」は、ギリシア語原文では πειρασμοῖς —「誘惑、試練」です。）</em></p></blockquote><blockquote><p>「<strong>試練を耐え忍ぶ人は幸いです</strong>。その人は適格者と認められ、神を愛する人々に約束された命の冠をいただくからです」（<a href="https://bibleox.com/ja/jp-ni/iak/1/#L12">ヤコ. 1:12</a>）</p></blockquote><blockquote><p>「<strong>それゆえ、あなたがたは、心から喜んでいるのです。今しばらくの間、いろいろな試練に悩まねばならないかもしれませんが</strong>、あなたがたの信仰は、その試練によって本物と証明され、火で精錬されながらも朽ちるほかない金よりはるかに尊くて、イエス・キリストが現れるときには、称賛と光栄と誉れとをもたらすのです」（<a href="https://bibleox.com/ja/jp-ni/1pet/1/#L6-7">１ペト. 1:6-7</a>）</p></blockquote><blockquote><p>「愛する人たち、<strong>あなたがたを試みるために身にふりかかる火のような試練を</strong>、何か思いがけないことが生じたかのように、<strong>驚き怪しんではなりません</strong>。むしろ、キリストの苦しみにあずかればあずかるほど喜びなさい。それは、キリストの栄光が現れるときにも、喜びに満ちあふれるためです」（<a href="https://bibleox.com/ja/jp-ni/1pet/4/#L12-13">１ペト. 4:12-13</a>）</p></blockquote><h2>神は力以上の誘惑に遭わせることはなさらず、支えを与えてくださる</h2><blockquote><p>「あなたがたを襲った試練で、人間として耐えられないようなものはなかったはずです。神は真実な方です。<strong>あなたがたを耐えられないような試練に遭わせることはなさらず</strong>、試練と共に、<strong>それに耐えられるよう、逃れる道をも備えていてくださいます</strong>」（<a href="https://bibleox.com/ja/jp-ni/1kor/10/#L13">１コリ. 10:13</a>）</p></blockquote><blockquote><p>「<strong>主は、信仰のあつい人を試練から救い出す</strong>一方、正しくない者たちを罰し、裁きの日まで閉じ込めておくべきだと考えておられます」（<a href="https://bibleox.com/ja/jp-ni/2pet/2/#L9">２ペト. 2:9</a>）</p></blockquote><h2>どのように誘惑に打ち勝つか</h2><p>霊的な目覚めと祈りが必要です：</p><blockquote><p>「誘惑に陥らぬよう、<strong>目を覚まして祈っていなさい</strong>。心は燃えても、肉体は弱い」（<a href="https://bibleox.com/ja/jp-ni/mf/26/#L41">マタ. 26:41</a>; <a href="https://bibleox.com/ja/jp-ni/mk/14/#L38">マコ. 14:38</a>; <a href="https://bibleox.com/ja/jp-ni/lk/22/#L40">ルカ. 22:40</a>; <a href="https://bibleox.com/ja/jp-ni/lk/22/#L46">22:46</a>）</p></blockquote><h2>誘惑に陥ること</h2><blockquote><p>「<strong>金持ちになろうとする者は、誘惑</strong>、罠、無分別で有害なさまざまの欲望<strong>に陥ります</strong>。その欲望が、人を滅亡と破滅に陥れます」（<a href="https://bibleox.com/ja/jp-ni/1tim/6/#L9">１テモ. 6:9</a>）</p></blockquote>

  - src: пост
    path: Fs19t_斎
    title: 斎（断食）
    meta_desc: 主イエス・キリスト、預言者たち、使徒たち、洗礼者ヨハネの弟子たち、そして教会は斎（断食）を守った。「断食を伴う祈りは良い」（トビト記12:8、七十人訳）
    menu: { parent: "教会/修行", title: "斎（断食）", priority: 19 }
    body: |-
      <p>修行一般について：</p><blockquote><p>「<strong>競技をする人は皆、すべてに節制します</strong>。彼らは朽ちる<strong>冠を得るために</strong>そうするのですが、<strong>わたしたちは、朽ちない冠を得るために</strong>節制するのです。だから、わたしとしては、やみくもに走ったりしないし、空を打つような拳闘もしません。むしろ、<strong>自分の体を打ちたたいて服従させます。それは</strong>、他の人々に宣教しておきながら、自分の方が<strong>失格者になってしまわないためです</strong>」（<a href="https://bibleox.com/ja/jp-ni/1kor/9/#L25-27">１コリ. 9:25-27</a>）</p></blockquote><p>神は、断食をもって御自分に立ち帰るよう呼びかけておられます：</p><blockquote><p>「主は言われる。『今こそ、<strong>心からわたしに立ち帰れ断食し</strong>、泣き悲しんで』」（<a href="https://bibleox.com/ja/jp-ni/iol/2/#L12">ヨエ. 2:12</a>）</p></blockquote><p>主イエス・キリストは断食をもって宣教を始められました：</p><blockquote><p>「そして<strong>四十日間</strong>、昼も夜も<strong>断食した</strong>後、空腹を覚えられた」（<a href="https://bibleox.com/ja/jp-ni/mf/4/#L2">マタ. 4:2</a>）</p></blockquote><p>主は正しく断食する仕方を教えられました：</p><blockquote><p>「<strong>断食するときには</strong>、あなたがたは偽善者のように沈んだ顔つきをしてはならない。偽善者は、断食しているのを人に見てもらおうと、顔を見苦しくする。はっきり言っておく。彼らは既に報いを受けている」（<a href="https://bibleox.com/ja/jp-ni/mf/6/#L16">マタ. 6:16</a>）</p></blockquote><blockquote><p>「あなたは、<strong>断食するとき</strong>、頭に油をつけ、顔を洗いなさい」（<a href="https://bibleox.com/ja/jp-ni/mf/6/#L17">マタ. 6:17</a>）</p></blockquote><p>預言者ヨハネの弟子たちは断食していました：</p><blockquote><p>「そのころ、ヨハネの弟子たちがイエスのところに来て、『<strong>わたしたちとファリサイ派の人々はよく断食している</strong>のに、なぜ、あなたの弟子たちは断食しないのですか』と言った」（<a href="https://bibleox.com/ja/jp-ni/mf/9/#L14">マタ. 9:14</a>）（<a href="https://bibleox.com/ja/jp-ni/mk/2/#L18">マコ. 2:18</a>）</p></blockquote><p>キリストの弟子たちは、キリストの十字架刑の後に断食することになります：</p><blockquote><p>「イエスは言われた。『花婿が一緒にいる間、婚礼の客は悲しむことができるだろうか。しかし、花婿が奪い取られる時が来る。そのとき、<strong>彼らは断食することになる</strong>』」（<a href="https://bibleox.com/ja/jp-ni/mf/9/#L15">マタ. 9:15</a>）（<a href="https://bibleox.com/ja/jp-ni/mk/2/#L20">マコ. 2:20</a>）（<a href="https://bibleox.com/ja/jp-ni/lk/5/#L35">ルカ. 5:35</a>）</p></blockquote><p>ある種の悪霊は、断食なしには人から追い出すことができません：</p><blockquote><p>「〔しかし、この種のものは、祈りと<strong>断食</strong>によらなければ出て行かない。〕」（<a href="https://bibleox.com/ja/jp-ni/mf/17/#L21">マタ. 17:21</a>）（<a href="https://bibleox.com/ja/jp-ni/mk/9/#L29">マコ. 9:29</a>）<em>（新共同訳はマタ 17:21 を〔　〕に入れ、マコ 9:29 を「祈りによらなければ」としていますが、ビザンティン本文（多数派写本）では、どちらにも「祈りと断食によらなければ」（ἐν προσευχῇ καὶ νηστείᾳ）とあります。）</em></p></blockquote><p>主の神殿にいたやもめは、夜も昼も祈りと断食をもって神に仕えていました：</p><blockquote><p>「夫に死に別れ、八十四歳になっていた。彼女は神殿を離れず、<strong>断食したり祈ったりして、夜も昼も神に仕えていた</strong>」（<a href="https://bibleox.com/ja/jp-ni/lk/2/#L37">ルカ. 2:37</a>）</p></blockquote><p>断食の間に、百人隊長のもとに天使が遣わされました：</p><blockquote><p>「すると、コルネリウスが言った。『四日前の今ごろのことです。わたしが家で午後三時の祈りをしていますと、輝く服を着た人がわたしの前に立って』」（<a href="https://bibleox.com/ja/jp-ni/act/10/#L30">使. 10:30</a>）<em>（ビザンティン本文（多数派写本）では「四日前、わたしはこの時刻まで<strong>断食していました</strong>（ἤμην νηστεύων）。そして午後三時に家で祈っていますと」となっています。）</em></p></blockquote><p>聖霊は断食の間に最初のキリスト者たちと交わられました：</p><blockquote><p>「彼らが<strong>主を礼拝し</strong>、<strong>断食していると</strong>、聖霊が告げた。『さあ、バルナバとサウロをわたしのために選び出しなさい。わたしが前もって二人に決めておいた仕事に当たらせるために』」（<a href="https://bibleox.com/ja/jp-ni/act/13/#L2">使. 13:2</a>）</p></blockquote><p>最初のキリスト者たちは、あらゆる大切な事柄において祈りに断食を加えました：</p><blockquote><p>「また、弟子たちのため教会ごとに長老たちを任命し、<strong>断食して</strong>祈り、彼らをその信ずる主に任せた」（<a href="https://bibleox.com/ja/jp-ni/act/14/#L23">使. 14:23</a>）</p></blockquote><p>断食のために、夫婦はしばらくの間、互いに離れていることができます：</p><blockquote><p>「互いに相手を拒んではいけません。ただ、納得しあったうえで、専ら祈りに時を過ごすためにしばらく別れ、また一緒になるというなら話は別です。あなたがたが自分を抑制する力がないのに乗じて、サタンが誘惑しないともかぎらないからです」（<a href="https://bibleox.com/ja/jp-ni/1kor/7/#L5">１コリ. 7:5</a>）<em>（ビザンティン本文（多数派写本）では「専ら<strong>断食と</strong>祈りに時を過ごすために」（τῇ νηστείᾳ καὶ τῇ προσευχῇ）となっています。）</em></p></blockquote><p>使徒たちは断食において神に仕える者であることを示します：</p><blockquote><p>「あらゆる場合に神に仕える者としてその実を示しています。大いなる忍耐をもって、苦難、欠乏、行き詰まり、鞭打ち、監禁、暴動、労苦、不眠、<strong>飢餓</strong>においても、純真、知識、寛容、親切、聖霊、偽りのない愛……」（<a href="https://bibleox.com/ja/jp-ni/2kor/6/#L4-6">２コリ. 6:4-6</a>）<em>（「飢餓」は、ギリシア語原文では νηστείαις —「断食」です。）</em></p></blockquote><p>使徒は、やむを得ない自己賞賛を自ら恥じつつ（<a href="https://bibleox.com/ja/jp-ni/2kor/11/#L21">２コリ. 11:21</a>）、断食を誇っています：</p><blockquote><p>「苦労し、骨折って、しばしば眠らずに過ごし、飢え渇き、<strong>しばしば食べずにおり</strong>、寒さに凍え、裸でいたこともありました」（<a href="https://bibleox.com/ja/jp-ni/2kor/11/#L27">２コリ. 11:27</a>）<em>（「しばしば食べずにおり」は、ギリシア語原文では ἐν νηστείαις πολλάκις —「しばしば断食し」です。）</em></p></blockquote><p>使徒は、健康がすぐれないために、主教テモテに斎を緩めることを許します：</p><blockquote><p>「<strong>これからは水ばかり飲まないで</strong>、胃のために、また、度々起こる病気のために、ぶどう酒を少し用いなさい」（<a href="https://bibleox.com/ja/jp-ni/1tim/5/#L23">１テモ. 5:23</a>）</p></blockquote><p>善い行い＝祈り＋断食＋施し＋義：</p><blockquote><p>「真実をもって祈りをささげ、正義をもって慈善の業をする方が、不正を行って金持ちとなるよりも、よいことです。金をため込むよりも慈善の業をする方がはるかにすばらしいことなのです」（<a href="https://bibleox.com/ja/jp-ni/tov/12/#L8">トビ. 12:8</a>）<em>（新共同訳は別の本文に従っています。七十人訳の広く用いられている本文では「<strong>断食を伴う祈りは良い</strong>。しかし、その二つにまさるのは、義を伴う施しである。不義を伴う富よりも、義を伴うわずかなものの方が良い。金をため込むよりも施しをする方が良い」となっています。）</em></p></blockquote><p>王であり預言者であるダビデは、災いの時に断食をもって神の前にへりくだりました：</p><blockquote><p>「彼らが病にかかっていたときわたしは粗布をまとって<strong>断食し、魂を苦しめ</strong>胸の内に祈りを繰り返し」（<a href="https://bibleox.com/ja/jp-ni/ps/35/#L13">詩. 35:13</a>）</p></blockquote>

  - src: монашество
    path: Mn24s_修道
    title: 修道
    meta_desc: 修道についての聖書の引用
    menu: { parent: "教会/修行", title: "修道", priority: 24 }
    body: |-
      <h2>修道についての聖書</h2><h3>神に喜ばれることを選ぶ宦官</h3><p>神は、結婚せずに神の掟を守ることに特に心を配る人々を特別に重んじられます。彼らはいわば、ほかの「<em>息子、娘</em>」よりも高められているのです：</p><blockquote><p>「なぜなら、主はこう言われる<strong><mark>宦官が</mark></strong>、わたしの安息日を常に守りわたしの望むことを選び<strong><mark>わたしの契約を固く守るなら</mark></strong>わたしは彼らのために、とこしえの名を与え<strong><mark>息子、娘を持つにまさる記念の名</mark>を</strong>わたしの家、わたしの城壁に刻む。その名は決して消し去られることがない」（<a href="https://bibleox.com/ja/jp-ni/is/56/#L4-5">イザ. 56:4-5</a>）</p></blockquote><blockquote><p>「<strong><mark>子種のない男</mark>でも、悪に手を染めず</strong>、主に対して恨みを抱かぬ者は<strong>幸いである</strong>。その信仰のゆえに<strong><mark>特別な恵み</mark>を受け、主の神殿で栄誉ある役職に就く</strong>」（<a href="https://bibleox.com/ja/jp-ni/prs/3/#L14">知. 3:14</a>）<em>（「子種のない男」は、ギリシア語原文では εὐνοῦχος —「宦官」です。）</em></p></blockquote><h3>戒めを守ることよりも高い完全の道</h3><p>救いの道を求めていた金持ちの青年は、救い主から、そのためには戒めを守らなければならないという確証を受けます。しかし青年はさらに大きなことを尋ねたので、主はさらに大きなこと、すなわち救われるだけでなく完全な者となることを示されました。そのために主は、青年に財産をすべて施して御自分に従うよう呼びかけられたのです：</p><blockquote><p>「イエスは言われた。『<strong><mark>もし完全になりたいのなら</mark>、行って<mark>持ち物を売り払い、貧しい人々に施しなさい</mark>。</strong>そうすれば、天に富を積むことになる。<strong>それから、<mark>わたしに従いなさい</mark></strong>』」（<a href="https://bibleox.com/ja/jp-ni/mf/19/#L21">マタ. 19:21</a>）</p></blockquote><h3>天の国のために自ら宦官となった者</h3><p>修道士はこの世のあらゆる富と執着を捨て、生涯のすべてを神を目指し、神に仕えることにささげます。修道士は、天の国のために自ら欠乏を引き受けた宦官なのです：</p><blockquote><p>「弟子たちは、『夫婦の間柄がそんなものなら、<strong>妻を迎えない方がましです</strong>』と言った。イエスは言われた。『<strong>だれもがこの言葉を受け入れるのではなく、恵まれた者だけである</strong>。結婚できないように生まれついた者、人から結婚できないようにされた者もいるが、<strong><mark>天の国のために結婚しない者</mark>もいる</strong>。<strong>これを受け入れることのできる人は受け入れなさい</strong>』」（<a href="https://bibleox.com/ja/jp-ni/mf/19/#L10-12">マタ. 19:10-12</a>）<em>（ギリシア語原文では εὐνοῦχοι —「宦官」の語が三度用いられており、最後の者は εὐνούχισαν ἑαυτοὺς —「自ら宦官となった」と言われています。）</em></p></blockquote><p>宦官についてのこれらの言葉は、使徒たちが妻を離縁することの禁止を聞いた後に、キリストによって語られました。使徒たちは、それなら結婚しない方がよいと結論しました。主はこの結論に反論されず、ただ、だれもがこの道を選べるわけではないと指摘されただけでした。しかし、できる人は選びなさい、と。つまり、これは修行者の特別な道なのです。</p><h3>使徒の勧め</h3><p>使徒は独身についての考えを、今度ははっきりと繰り返しています：</p><blockquote><p>「そちらから書いてよこしたことについて言えば、<strong>男は女に触れない方がよい</strong>」（<a href="https://bibleox.com/ja/jp-ni/1kor/7/#L1">１コリ. 7:1</a>）</p></blockquote><p>使徒パウロには妻がなく、未婚者とやもめに、自分と同じようにとどまり、新しい夫を求めないようにと勧めて（まさに勧めて）います：</p><blockquote><p>「未婚者とやもめに言いますが、<strong><mark>皆わたしのように独りでいるのがよいでしょう</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/1kor/7/#L8">１コリ. 7:8</a>）</p></blockquote><p>使徒はこの勧めの理由を説明しています：</p><blockquote><p>「しかし、あなたが、結婚しても、罪を犯すわけではなく、未婚の女が結婚しても、罪を犯したわけではありません。ただ、結婚する人たちはその身に苦労を負うことになるでしょう。わたしは、あなたがたにそのような苦労をさせたくないのです。兄弟たち、わたしはこう言いたい。定められた時は迫っています。今からは、妻のある人はない人のように、泣く人は泣かない人のように、喜ぶ人は喜ばない人のように、物を買う人は持たない人のように、世の事にかかわっている人は、かかわりのない人のようにすべきです。この世の有様は過ぎ去るからです。思い煩わないでほしい。<strong><mark>独身の男は、どうすれば主に喜ばれるかと、主のことに心を遣いますが、結婚している男は、どうすれば妻に喜ばれるかと、世の事に心を遣い</mark></strong>、心が二つに分かれてしまいます。<strong>独身の女や未婚の女は、体も霊も聖なる者になろうとして、主のことに心を遣いますが、結婚している女は、どうすれば夫に喜ばれるかと、世の事に心を遣います</strong>。このようにわたしが言うのは、あなたがたのためを思ってのことで、決してあなたがたを束縛するためではなく、品位のある生活をさせて、ひたすら主に仕えさせるためなのです。もし、ある人が自分の相手である娘に対して、情熱が強くなり、その誓いにふさわしくないふるまいをしかねないと感じ、それ以上自分を抑制できないと思うなら、思いどおりにしなさい。罪を犯すことにはなりません。二人は結婚しなさい。しかし、心にしっかりした信念を持ち、無理に思いを抑えつけたりせずに、<strong>相手の娘をそのままにしておこうと決心した人は、そうしたらよいでしょう</strong>。要するに、相手の娘と結婚する人はそれで差し支えありませんが、<strong>結婚しない人の方がもっとよいのです</strong>。妻は夫が生きている間は夫に結ばれていますが、夫が死ねば、望む人と再婚してもかまいません。ただし、相手は主に結ばれている者に限ります。しかし、わたしの考えによれば、<strong><mark>そのままでいる方がずっと幸福です</mark></strong>。わたしも神の霊を受けていると思います」（<a href="https://bibleox.com/ja/jp-ni/1kor/7/#L28-40">１コリ. 7:28-40</a>）</p></blockquote><p>おとめのまま生涯を送ったキリスト者たちは、天においてキリストの行かれる所へはどこへでも従って行きます：</p><blockquote><p>「また、わたしが見ていると、見よ、小羊がシオンの山に立っており、小羊と共に<strong>十四万四千人</strong>の者たちがいて、その額には小羊の名と、小羊の父の名とが記されていた。わたしは、大水のとどろくような音、また激しい雷のような音が天から響くのを聞いた。わたしが聞いたその音は、琴を弾く者たちが竪琴を弾いているようであった。<strong>彼らは、玉座の前</strong>、また四つの生き物と長老たちの前で、<strong>新しい歌のたぐいをうたった</strong>。<strong><mark>この歌は</mark>、地上から贖われた十四万四千人の者たちのほかは、<mark>覚えることができなかった</mark></strong>。<strong>彼らは、女に触れて身を汚したことのない者である。彼らは<mark>童貞</mark>だからである。この者たちは、<mark>小羊の行くところへは、どこへでも従って行く</mark></strong>。この者たちは、神と小羊に献げられる初穂として、人々の中から贖われた者たちで、その口には偽りがなく、とがめられるところのない者たちである」（<a href="https://bibleox.com/ja/jp-ni/otkr/14/#L1-5">黙. 14:1-5</a>）</p></blockquote><h3>最初のキリスト教共同体は共住修道院であった</h3><blockquote><p>「<strong>信者たちは皆一つになって、<mark>すべての物を共有にし</mark></strong>、<strong><mark>財産</mark>や<mark>持ち物を売り</mark>、おのおのの必要に応じて、皆がそれを分け合った</strong>。そして、<strong><mark>毎日</mark>ひたすら心を一つにして<mark>神殿に参り</mark></strong>、家ごとに集まってパンを裂き、喜びと真心をもって一緒に食事をし」（<a href="https://bibleox.com/ja/jp-ni/act/2/#L44-46">使. 2:44-46</a>）</p></blockquote><blockquote><p>「信じた人々の群れは心も思いも一つにし、<strong><mark>一人として持ち物を自分のものだと言う者はなく</mark>、すべてを共有していた</strong>。&lt;…&gt; 信者の中には、一人も貧しい人がいなかった。<strong><mark>土地や家を持っている人が皆、それを売っては代金を持ち寄り</mark>、使徒たちの足もとに置き</strong>、<strong><mark>その金は必要に応じて、おのおのに分配されたからである</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/act/4/#L32,34-35">使. 4:32,34-35</a>）</p></blockquote><blockquote><p>「<strong><mark>ほかの者はだれ一人、あえて仲間に加わろうとはしなかった</mark></strong>。しかし、民衆は彼らを称賛していた」（<a href="https://bibleox.com/ja/jp-ni/act/5/#L13">使. 5:13</a>）</p></blockquote><h2>修道生活の模範</h2><h3>主イエス・キリスト</h3><ul><li><p>結婚しておられませんでした。</p></li><li><p>御自分の家を持っておられませんでした（<a href="https://bibleox.com/ja/jp-ni/mf/8/#L20">マタ. 8:20</a>; <a href="https://bibleox.com/ja/jp-ni/lk/9/#L58">ルカ. 9:58</a>; <a href="https://bibleox.com/ja/jp-ni/mf/19/#L21">マタ. 19:21</a>）。</p></li><li><p>個人のお金を持たず、無欲でした（<a href="https://bibleox.com/ja/jp-ni/mk/12/#L15">マコ. 12:15</a>; <a href="https://bibleox.com/ja/jp-ni/mf/17/#L24-27">マタ. 17:24-27</a>; <a href="https://bibleox.com/ja/jp-ni/mf/19/#L21">マタ. 19:21</a>）。</p></li><li><p>一人で夜通し多く祈られました（<a href="https://bibleox.com/ja/jp-ni/lk/6/#L12">ルカ. 6:12</a>; <a href="https://bibleox.com/ja/jp-ni/mf/6/#L6">マタ. 6:6</a>; <a href="https://bibleox.com/ja/jp-ni/mf/14/#L23,25">マタ. 14:23,25</a>; <a href="https://bibleox.com/ja/jp-ni/mk/14/#L32,35,37,39-41">マコ. 14:32,35,37,39-41</a>）。</p></li><li><p>弟子たちを持っておられました（<a href="https://bibleox.com/ja/jp-ni/lk/6/#L13">ルカ. 6:13</a>; <a href="https://bibleox.com/ja/jp-ni/lk/10/#L1">ルカ. 10:1</a>）。</p></li><li><p>祈りを教え、弟子たちに祈りの型をお与えになりました（<a href="https://bibleox.com/ja/jp-ni/mf/6/#L9">マタ. 6:9</a>）。</p></li><li><p>来る人々を慰め、戒め、教え、導かれました（<a href="https://bibleox.com/ja/jp-ni/mk/6/#L31">マコ. 6:31</a>）。</p></li></ul><h3>生神女おとめマリア</h3><ul><li><p>独身の誓いを立て、形の上では結婚していましたが、夫婦の交わりはありませんでした（「わたしは男の人を知りませんのに」、<a href="https://bibleox.com/ja/ja/w/Th9m_生神女/#HH-生神女はおとめでありおとめであり続ける">詳しく</a>）。</p></li><li><p>財産を持たず、幼い時に神殿で育てられるためにささげられ、その後ヨセフと婚約し、その後、主によって使徒ヨハネに託されました（<a href="https://bibleox.com/ja/jp-ni/in/19/#L27">ヨハ. 19:27</a>）。</p></li></ul><h3>預言者洗礼者ヨハネ</h3><ul><li><p>結婚していませんでした。</p></li><li><p>自分の家を持たず、荒れ野に住んでいました（<a href="https://bibleox.com/ja/jp-ni/lk/1/#L80">ルカ. 1:80</a>）。</p></li><li><p>粗末な手製の衣を着ていました（<a href="https://bibleox.com/ja/jp-ni/mf/3/#L4">マタ. 3:4</a>）。</p></li><li><p>荒れ野で見つかる非常に簡素な物を食べていました（<a href="https://bibleox.com/ja/jp-ni/mf/3/#L4">マタ. 3:4</a>）。</p></li><li><p>手製の衣と見つけた食べ物は、彼がお金を持っていなかったことを示しています。</p></li><li><p>祈りを教え、祈りの型を与えました（<a href="https://bibleox.com/ja/jp-ni/lk/11/#L1">ルカ. 11:1</a>）。</p></li><li><p>弟子たちを持っていました（<a href="https://bibleox.com/ja/jp-ni/mf/11/#L2">マタ. 11:2</a>; <a href="https://bibleox.com/ja/jp-ni/in/1/#L35">ヨハ. 1:35</a>; <a href="https://bibleox.com/ja/jp-ni/in/3/#L25">ヨハ. 3:25</a>）。</p></li><li><p>来る人々を慰め、戒め、教え、導きました（<a href="https://bibleox.com/ja/jp-ni/lk/3/#L18">ルカ. 3:18</a>; <a href="https://bibleox.com/ja/jp-ni/lk/3/#L10-20">ルカ. 3:10-20</a>; <a href="https://bibleox.com/ja/jp-ni/mk/6/#L31">マコ. 6:31</a>）。</p></li></ul><h3>預言者エリヤ</h3><ul><li><p>結婚していませんでした。</p></li><li><p>しばしば荒れ野や洞穴など、未開の環境で暮らしました（<a href="https://bibleox.com/ja/jp-ni/3ts/17/#L3-7">王上. 17:3-7</a>; <a href="https://bibleox.com/ja/jp-ni/3ts/19/#L9">王上. 19:9</a>; <a href="https://bibleox.com/ja/jp-ni/3ts/19/#L4">王上. 19:4</a>）。</p></li><li><p>獣の毛の簡素な衣を着、革帯を締めていました（<a href="https://bibleox.com/ja/jp-ni/4ts/1/#L8">王下. 1:8</a>）。</p></li><li><p>烏が運んで来る簡素な物を食べていました（<a href="https://bibleox.com/ja/jp-ni/3ts/17/#L6">王上. 17:6</a>）。</p></li><li><p>弟子を持っていました（<a href="https://bibleox.com/ja/jp-ni/3ts/19/#L19-21">王上. 19:19-21</a>）。</p></li><li><p>神の命令によって民の不敬虔を戒めました（<a href="https://bibleox.com/ja/jp-ni/3ts/18/#L17-40">王上. 18:17-40</a>）。</p></li></ul><h3>預言者ダニエル</h3><ul><li><p>結婚していませんでした。</p></li><li><p>王の食べ物を断り、簡素な物を食べていました（<a href="https://bibleox.com/ja/jp-ni/dan/1/#L12">ダニ. 1:12</a>）。</p></li><li><p>しばしば祈りました（<a href="https://bibleox.com/ja/jp-ni/dan/6/#L11">ダニ. 6:11</a>）。</p></li><li><p>不敬虔を戒めました（<a href="https://bibleox.com/ja/jp-ni/dan/5/#L17-28">ダニ. 5:17-28</a>）。</p></li></ul><h3>預言者エレミヤ</h3><ul><li><p>神の命令によって結婚しませんでした（<a href="https://bibleox.com/ja/jp-ni/ier/16/#L2">エレ. 16:2</a>）。</p></li><li><p>しばしば監禁や流刑の身となり、孤独のうちに暮らしました（<a href="https://bibleox.com/ja/jp-ni/ier/37/#L15-16">エレ. 37:15-16</a>）。</p></li><li><p>諸国民を教え、戒めました（<a href="https://bibleox.com/ja/jp-ni/ier/1/#L9-10">エレ. 1:9-10</a>）。</p></li></ul>

