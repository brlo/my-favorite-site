    path: Pc30s_平安な心
    title: 平安な心
    menu: { parent: "教会/修行", title: "平安な心", priority: 30 }
    body: |-
      <h2>神の安息について</h2><blockquote><p><em>「この日に神はすべての創造の仕事を離れ、</em><strong><em>安息なさった</em></strong><em>ので、第七の日を神は祝福し、聖別された」（</em><a href="https://bibleox.com/ja/jp-ni/gen/2/#L3"><em>創. 2:3</em></a><em>）</em></p></blockquote><blockquote><p>「イエスはお答えになった。『<strong>わたしの父は今もなお働いておられる。だから、わたしも働くのだ</strong>』」（<a href="https://bibleox.com/ja/jp-ni/in/5/#L17">ヨハ. 5:17</a>）</p></blockquote><blockquote><p><em>「</em><strong><em>信じたわたしたちは、この安息にあずかることができるのです</em></strong><em>。『わたしは怒って誓ったように、「</em><strong><em>彼らを決してわたしの安息にあずからせはしない</em></strong><em>」』と言われたとおりです。もっとも、神の業は天地創造の時以来、既に出来上がっていたのです」（</em><a href="https://bibleox.com/ja/jp-ni/evr/4/#L3"><em>ヘブ. 4:3</em></a><em>; </em><a href="https://bibleox.com/ja/jp-ni/ps/95/#L11"><em>詩. 95:11</em></a><em>; </em><a href="https://bibleox.com/ja/jp-ni/evr/3/#L11"><em>ヘブ. 3:11</em></a><em>）</em></p></blockquote><h2>神の平和</h2><blockquote><p>「<strong><mark>わたしは、平和をあなたがたに残し、わたしの平和を与える</mark>。わたしはこれを、世が与えるように与えるのではない。心を騒がせるな。おびえるな</strong>」（<a href="https://bibleox.com/ja/jp-ni/in/14/#L27">ヨハ. 14:27</a>）</p></blockquote><blockquote><p>「わたしは柔和で謙遜な者だから、<strong>わたしの軛を負い、わたしに学びなさい</strong>。そうすれば、<strong><mark>あなたがたは安らぎを得られる</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/mf/11/#L29">マタ. 11:29</a>）<em>（ギリシア語原文では εὑρήσετε ἀνάπαυσιν ταῖς ψυχαῖς ὑμῶν —「あなたがたの魂に安らぎを見いだす」です。）</em></p></blockquote><blockquote><p>「そうすれば、<strong><mark>あらゆる人知を超える</mark><mark>神の平和</mark>が、あなたがたの心</strong>と考えとをキリスト・イエスによって<strong>守るでしょう</strong>」（<a href="https://bibleox.com/ja/jp-ni/fil/4/#L7">フィリ. 4:7</a>）</p></blockquote><blockquote><p>「なぜなら、<strong>神の安息にあずかった者は</strong>、神が御業を終えて休まれたように、<strong>自分の業を終えて休んだからです</strong>。だから、わたしたちは<strong><mark>この安息にあずかるように努力しようではありませんか</mark></strong>。さもないと、同じ不従順の例に倣って堕落する者が出るかもしれません」（<a href="https://bibleox.com/ja/jp-ni/evr/4/#L10-11">ヘブ. 4:10-11</a>）</p></blockquote><blockquote><p>「主があなたたちのために戦われる。あなたたちは<strong>静かにしていなさい</strong>」（<a href="https://bibleox.com/ja/jp-ni/ish/14/#L14">出. 14:14</a>）</p></blockquote><blockquote><p>「主が、『わたしが自ら同行し、<strong>あなたに安息を与えよう</strong>』と言われると」（<a href="https://bibleox.com/ja/jp-ni/ish/33/#L14">出. 33:14</a>）</p></blockquote><blockquote><p>「わたしの民イスラエルには一つの所を定め、彼らをそこに植え付ける。<strong>民はそこに住み着いて、もはや、おののくことはなく</strong>、昔のように不正を行う者に虐げられることもない」（<a href="https://bibleox.com/ja/jp-ni/1par/17/#L9">代上. 17:9</a>）</p></blockquote><blockquote><p>「わたしは怒り彼らを<strong>わたしの憩いの地</strong>に入れないと誓った」（<a href="https://bibleox.com/ja/jp-ni/ps/95/#L11">詩. 95:11</a>）</p></blockquote>
