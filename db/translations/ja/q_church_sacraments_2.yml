    title: 神品機密（司祭職）
    meta_desc: 神品機密（司祭職）についての聖書の引用
    menu: { parent: "教会/機密", title: "神品機密", priority: 8 }
    body: |-
      <h2>旧約において神が定められた祭司職</h2><p>祭司となるのはアロンの子孫だけです：</p><blockquote><p>「（<strong>アロンとその子ら</strong>に）飾り帯を締め、ターバンを巻く。<strong>彼らの祭司職はこうして、不変の定めにより、彼らのものとなる</strong>。次に、アロンとその子らの任職式を行う」（<a href="https://bibleox.com/ja/jp-ni/ish/29/#L9">出. 29:9</a>）</p></blockquote><p>祭司職は聖なる祭服と共に、油注ぎによって受け継がれます：</p><blockquote><p>「アロンの<strong>祭服は、彼の後を継ぐ子らが聖別の油を注がれ、祭司職に任命されたならば、彼らのものとなる</strong>」（<a href="https://bibleox.com/ja/jp-ni/ish/29/#L29">出. 29:29</a>）</p></blockquote><p>聖なる奉仕に近づいた部外者は死ななければなりませんでした。それを見張ることが祭司職の務めでした：</p><blockquote><p>「あなたはアロンとその子らを監督して、その祭司職を厳守させなさい。<strong>ほかの者がその務めをしようとするならば死刑に処せられる</strong>」（<a href="https://bibleox.com/ja/jp-ni/chis/3/#L10">民. 3:10</a>）</p></blockquote><p>詳しく：</p><blockquote><p>「<strong><mark>主はアロンに言われた。『あなたとあなたの子ら</mark></strong>、ならびにあなたの父祖の家の者らは、共に聖所に関する罪責を負わねばならない。また、<strong>あなたとあなたの子らは</strong>、共に祭司職に関する罪責を負わねばならない。<strong>あなたの同族、すなわちあなたの父祖の部族であるレビ族の者たちをも用いて、身近な助け手とし</strong>、<strong>あなたとあなたの子らと共に掟の幕屋の前で仕えさせなさい</strong>。彼ら［レビ人］はあなたの務めを助け、幕屋全般の務めを果たす。しかし彼らは、聖所の祭具および祭壇に近づいてはならない。彼ら［レビ人］もあなたたち［アロンとその子ら］も、死ぬことのないためである。&lt;…&gt; ただし、祭壇および垂れ幕の奥にかかわる事柄についてはすべて、<strong><mark>あなたとあなたと共にいるあなたの子らが祭司の務めを果たし</mark></strong>、作業をせねばならない。<strong><mark>わたしは祭司職を賜物としてあなたたちに与える。一般の人が近づけば、死刑に処せられる</mark></strong>』」（<a href="https://bibleox.com/ja/jp-ni/chis/18/#L1-3,7">民. 18:1-3,7</a>）</p></blockquote><h2>新約における祭司職の変更</h2><p>主イエス・キリストは新しい契約を結び（<a href="https://bibleox.com/ja/jp-ni/lk/22/#L20">ルカ. 22:20</a>; <a href="https://bibleox.com/ja/jp-ni/evr/8/#L8">ヘブ. 8:8</a>）、律法を変え、祭司職を変えられます（変えるのであって、廃止するのではありません）：</p><blockquote><p>「<strong>祭司制度（ἱερωσύνης）に変更があれば、律法にも必ず変更があるはずです</strong>」（<a href="https://bibleox.com/ja/jp-ni/evr/7/#L12">ヘブ. 7:12</a>）</p></blockquote><p>救い主は使徒たちに聖霊を送り、メルキゼデクの位に従う司祭職の位階を立て、御自身が大祭司となられます：</p><blockquote><p>「イエスは、わたしたちのために先駆者としてそこへ入って行き、<strong>永遠にメルキゼデクと同じような大祭司となられたのです</strong>。このメルキゼデクはサレムの王であり、いと高き神の祭司でしたが、王たちを滅ぼして戻って来たアブラハムを出迎え、そして祝福しました。アブラハムは、メルキゼデクにすべてのものの十分の一を分け与えました。メルキゼデクという名の意味は、まず<strong>「義の王」</strong>、次に「サレムの王」、つまり<strong>「平和の王」</strong>です。彼には父もなく、母もなく、系図もなく、<strong>また、生涯の初めもなく、命の終わりもなく、神の子に似た者であって、永遠に祭司です</strong>」（<a href="https://bibleox.com/ja/jp-ni/evr/6/#L20">ヘブ. 6:20</a>; <a href="https://bibleox.com/ja/jp-ni/evr/7/#L1-3">7:1-3</a>）<em>（「メルキゼデクと同じような」は、ギリシア語原文では κατὰ τὴν τάξιν Μελχισέδεκ —「メルキゼデクの位に従う」です。）</em></p></blockquote><blockquote><p>「今述べていることの要点は、<strong>わたしたちにはこのような大祭司が与えられていて、天におられる大いなる方の玉座の右の座に着き</strong>」（<a href="https://bibleox.com/ja/jp-ni/evr/8/#L1">ヘブ. 8:1</a>）</p></blockquote><h2>教会の位階の形成</h2><p>五旬祭の日に、聖霊は使徒たちと教会の集まり全体、すなわち教会全体に送られます。しかしこの日よりも前に、救い主は使徒たちだけに現れ、彼らだけに聖霊を送り、司祭として罪を赦す権能を彼らに与えられます。つまり位階を立てられるのです：</p><blockquote><p>「イエスは重ねて言われた。『あなたがたに平和があるように。父がわたしをお遣わしになったように、わたしもあなたがたを遣わす。』そう言ってから、<strong>彼らに息を吹きかけて</strong>言われた。『<strong>聖霊を受けなさい。</strong><strong>だれの罪でも、あなたがたが赦せば、その罪は赦される。だれの罪でも、あなたがたが赦さなければ、赦されないまま残る</strong>』」（<a href="https://bibleox.com/ja/jp-ni/in/20/#L21-23">ヨハ. 20:21-23</a>）</p></blockquote><p>旧約の教会においても同じように、罪から清める務めはまさに祭司職にありました：</p><blockquote><p>「責めを負うときには、<strong>彼はその罪を犯したことを告白し</strong>、犯した罪の代償として、群れのうちから雌羊または雌山羊を取り、贖罪の献げ物として主にささげる。<strong>祭司は彼のためにその犯した罪を贖う儀式を行う</strong>」（<a href="https://bibleox.com/ja/jp-ni/lev/5/#L5-6">レビ. 5:5-6</a>）</p></blockquote><h2>新しい位階の権能</h2><p>主は使徒たちに天の国の鍵と、禁じ、また許す（つなぎ、また解く）権能をお与えになります：</p><blockquote><p>「わたしはあなたに天の国の鍵を授ける。<strong>あなたが地上でつなぐことは、天上でもつながれる。あなたが地上で解くことは、天上でも解かれる</strong>」（<a href="https://bibleox.com/ja/jp-ni/mf/16/#L19">マタ. 16:19</a>）</p></blockquote><blockquote><p>「はっきり言っておく。<strong>あなたがたが地上でつなぐことは、天上でもつながれ、あなたがたが地上で解くことは、天上でも解かれる</strong>」（<a href="https://bibleox.com/ja/jp-ni/mf/18/#L18">マタ. 18:18</a>）</p></blockquote><p>使徒たちが司祭職を選び、叙聖しましたが、聖書は、教会を監督する者として長老（司祭）たちを任命したのは聖霊であると言っています：</p><blockquote><p>「パウロはミレトスからエフェソに人をやって、<strong>教会の長老たちを呼び寄せた</strong>。長老たちが集まって来たとき、パウロはこう話した。&lt;…&gt;『どうか、あなたがた自身と群れ全体とに気を配ってください。<strong>聖霊は、神が御子の血によって御自分のものとなさった神の教会の世話をさせるために、あなたがたをこの群れの監督者に任命なさったのです</strong>』」（<a href="https://bibleox.com/ja/jp-ni/act/20/#L17-18,28">使. 20:17-18,28</a>）</p></blockquote><p>これはすべて旧約の預言の成就であり、それについては次に述べます。</p><h2>新約の祭司職についての預言</h2><p>旧約の教会では、祭司はユダヤ人の民、レビ族、アロンの家系からだけ立てられました。しかし新約の教会では、祭司はユダヤ人の民（アロンの家系）からだけでなく、すべての国の民から立てられることになります：</p><blockquote><p>「わたしは彼らの業と彼らの謀のゆえに、<strong>すべての国、すべての言葉の民を集めるために臨む</strong>。彼らは来て、わたしの栄光を見る。わたしは、彼らの間に一つのしるしをおき、彼らの中から生き残った者を諸国に遣わす。すなわち、タルシシュに、弓を巧みに引くプルとルドに、トバルとヤワンに、更に<strong>わたしの名声を聞いたことも、わたしの栄光を見たこともない</strong>、遠い島々に遣わす。彼らはわたしの栄光を国々に伝える。彼らはあなたたちのすべての兄弟を主への献げ物として、馬、車、駕籠、らば、らくだに載せ、あらゆる国民の間からわたしの聖なる山エルサレムに連れて来る、と主は言われる。それは、イスラエルの子らが献げ物を清い器に入れて、主の神殿にもたらすのと同じである、と主は言われる。<strong>わたしは彼らのうちからも祭司とレビ人を立てる、と主は言われる</strong>」（<a href="https://bibleox.com/ja/jp-ni/is/66/#L18-21">イザ. 66:18-21</a>）</p></blockquote><h2>使徒継承と叙聖についての教え</h2><h3>主教の叙聖</h3><p>主教テモテは、使徒の按手と、それ以前にすでに叙聖されていたほかの主教たちの按手とによって、特別な賜物を持っています：</p><blockquote><p>「そういうわけで、<strong><mark>わたしが手を置いたこと</mark><u><mark>によって</mark></u>あなたに与えられている<mark>神の賜物</mark></strong>を、再び燃えたたせるように勧めます」（<a href="https://bibleox.com/ja/jp-ni/2tim/1/#L6">２テモ. 1:6</a>）</p></blockquote><blockquote><p>「<strong>あなたの内にある恵みの<mark>賜物</mark></strong>を軽んじてはなりません。<strong>その賜物は、<mark>長老たちがあなたに手を置いたとき</mark>、預言によって与えられたものです</strong>」（<a href="https://bibleox.com/ja/jp-ni/1tim/4/#L14">１テモ. 4:14</a>）<em>（「長老たち」は、ギリシア語原文では τοῦ πρεσβυτερίου —「長老団（司祭団）」です。）</em></p></blockquote><p>魔術師シモンは、すべてのキリスト者が聖霊を与えるために手を置くことができるわけではないことを見ました。文字どおりには、だれもがそのような権能を持っているわけではないということです。彼は、自分にもそのような権能を与えてもらおうと、使徒たちに賄賂を持って来ました（使徒たちは彼を呪いました）：</p><blockquote><p>「シモンは、<strong>使徒たちが手を置くことで、“霊”が与えられる</strong>のを見、金を持って来て、言った。<strong>『わたしが手を置けば</strong>、<strong><mark>だれでも</mark>聖霊が受けられるように、<mark>わたしにもその力を授けてください</mark>。』</strong>すると、ペトロは言った。『この金は、お前と一緒に滅びてしまうがよい。<strong><mark>神の賜物</mark></strong>を金で手に入れられると思っているからだ』」（<a href="https://bibleox.com/ja/jp-ni/act/8/#L18-20">使. 8:18-20</a>）</p></blockquote><h3>使徒パウロの叙聖</h3><blockquote><p>「彼らが主を礼拝し、断食していると、聖霊が告げた。『さあ、バルナバと<strong><mark>サウロ</mark></strong>をわたしのために選び出しなさい。わたしが前もって二人に決めておいた仕事に当たらせるために。』そこで、彼らは断食して祈り、<strong><mark>二人の上に手を置いて</mark></strong>出発させた」（<a href="https://bibleox.com/ja/jp-ni/act/13/#L2-3">使. 13:2-3</a>）</p></blockquote><h3>輔祭の叙聖</h3><blockquote><p>「使徒たちの前に立たせた。使徒たちは、祈って<strong>彼らの上に手を置いた</strong>」（<a href="https://bibleox.com/ja/jp-ni/act/6/#L6">使. 6:6</a>; <a href="https://bibleox.com/ja/jp-ni/act/21/#L8">21:8</a>）</p></blockquote><h3>叙聖についての教え</h3><p>按手についての使徒の教え：</p><blockquote><p>「種々の洗礼についての<strong>教え</strong>、<strong>手を置く儀式</strong>、死者の復活、永遠の審判など」（<a href="https://bibleox.com/ja/jp-ni/evr/6/#L1-2">ヘブ. 6:1-2</a>）</p></blockquote><p>（司祭職に）急いで叙聖してはならないという警告：</p><blockquote><p>「<strong>性急にだれにでも手を置いてはなりません</strong>。他人の罪に加わってもなりません。いつも潔白でいなさい」（<a href="https://bibleox.com/ja/jp-ni/1tim/5/#L22">１テモ. 5:22</a>）</p></blockquote><h2>主教と長老（司祭）の違い</h2><p>主教（ギリシア語 ἐπίσκοπος —「監督者」「見張る者」）と長老（ギリシア語 πρεσβύτερος —「年長者、共同体の長」）という用語は混用されており、いわば互いに置き換えられる用語です。しかし、どう呼ばれていようと、個々の人々の務めと権能ははっきりと見て取れます。テトスは使徒の仕事を完成させ、クレタで長老たちを立てなければなりませんでした：</p><blockquote><p>「あなたをクレタに残してきたのは、わたしが指示しておいたように、残っている仕事を整理し、<strong>町ごとに長老たちを立ててもらうためです</strong>」（<a href="https://bibleox.com/ja/jp-ni/tit/1/#L5">テト. 1:5</a>）</p></blockquote><p>テモテは自分の長老たちを裁き、信者たちをとがめ、禁じることができました：</p><blockquote><p>「<strong>長老に反対する訴えは</strong>、二人あるいは三人の証人がいなければ、受理してはなりません」（<a href="https://bibleox.com/ja/jp-ni/1tim/5/#L19">１テモ. 5:19</a>）</p></blockquote><blockquote><p>「御言葉を宣べ伝えなさい。折が良くても悪くても励みなさい。<strong>とがめ、戒め</strong>、励ましなさい。忍耐強く、十分に教えるのです」（<a href="https://bibleox.com/ja/jp-ni/2tim/4/#L2">２テモ. 4:2</a>）</p></blockquote><p>このように、テトスとテモテは、たとえ長老と呼ばれていたとしても、今日の理解では主教だったのです。</p><h2>すべての人が祭司なのか</h2><h3>旧約の言葉との並行</h3><p>使徒ペトロは旧約の言葉を繰り返して、すべてのキリスト者を王の系統を引く祭司、聖なる国民と呼びます：</p><blockquote><p>「しかし、<strong>あなたがたは、選ばれた民、<u>王の系統を引く祭司</u>、<u>聖なる国民</u></strong>、神のものとなった民です。それは、あなたがたを暗闇の中から驚くべき光の中へと招き入れてくださった方の力ある業を、あなたがたが広く伝えるためなのです」（<a href="https://bibleox.com/ja/jp-ni/1pet/2/#L9">１ペト. 2:9</a>）</p></blockquote><p>旧約では、同じ言葉がイスラエル全体に向けられています：</p><blockquote><p>「今、もしわたしの声に聞き従いわたしの契約を守るならばあなたたちはすべての民の間にあってわたしの宝となる。世界はすべてわたしのものである。<strong>あなたたちは、わたしにとって<u>祭司の王国</u>、<u>聖なる国民</u>となる</strong>。これが、イスラエルの人々に語るべき言葉である」（<a href="https://bibleox.com/ja/jp-ni/ish/19/#L5-6">出. 19:5-6</a>）</p></blockquote><p>このように、神はすでに旧約のイスラエルを祭司の王国、聖なる国民と呼んでおられます。しかし奉神礼的な意味では、すべてのユダヤ人が祭司だったわけではありません。律法によれば、幕屋に入ることができたのはアロンの祭司職だけであり、ほかの者は幕屋に入れば自分の命で償わなければならない、つまり死ななければなりませんでした（<a href="https://bibleox.com/ja/jp-ni/chis/3/#L10">民. 3:10</a>; <a href="https://bibleox.com/ja/jp-ni/chis/3/#L38">3:38</a>; <a href="https://bibleox.com/ja/jp-ni/chis/18/#L7">18:7</a>）。</p><p>旧約において「祭司の王国」（すべてではない）と「聖なる国民」（すべて）という言葉を区別するなら、使徒の新約の言葉においても同じ区別を認めなければなりません。王の系統を引く祭司（すべてではない）、聖なる国民（すべて）です（<a href="https://bibleox.com/ja/jp-ni/1pet/2/#L9">１ペト. 2:9</a>）。これらの言明は文字どおりにも寓意的にも理解できますが、いずれにせよ、両方の句を結びつけ、それに応じて同じ調子で理解しなければなりません。</p><h3>旧約における万人祭司を立てようとする試み</h3><p>旧約において神は、アロンの子孫だけが祭司になれるという秩序を定められました：</p><blockquote><p>「アロンの祭服は、彼の後を継ぐ子らが聖別の油を注がれ、祭司職に任命されたならば、彼らのものとなる」（<a href="https://bibleox.com/ja/jp-ni/ish/29/#L29">出. 29:29</a>）</p></blockquote><p>アロンの家系からでさえ、すべての者が祭司になれたわけではありません：</p><blockquote><p>「<strong>祭司アロンの子孫のうちで、以上の障害のある者はだれでも、主に燃やしてささげる献げ物の務めをしてはならない</strong>。彼には障害があるから、神に食物をささげる務めをしてはならない。&lt;…&gt; ただし、彼には障害があるから、垂れ幕の前に進み出たり、祭壇に近づいたりして、<strong>わたしの聖所を汚してはならない</strong>。わたしが、それらを聖別した主だからである」（<a href="https://bibleox.com/ja/jp-ni/lev/21/#L21,23">レビ. 21:21,23</a>）</p></blockquote><p>この神の秩序に対して<strong>コラ、ダタン、アビラム、オン</strong>が立ち上がり、アロンの家系からだけでなく民全体から祭司を立てるよう、預言者モーセに要求しました。彼らはまさにあの句（<a href="https://bibleox.com/ja/jp-ni/ish/19/#L5-6">出. 19:5-6</a>）を引き合いに出し、すべての者が聖なる者だと言いました：</p><blockquote><p>「彼らは徒党を組み、モーセとアロンに逆らって言った。『あなたたちは分を越えている。<strong>共同体全体、彼ら全員が聖なる者であって、主がその中におられるのに</strong>、なぜ、あなたたちは主の会衆の上に立とうとするのか』」（<a href="https://bibleox.com/ja/jp-ni/chis/16/#L3">民. 16:3</a>）</p></blockquote><blockquote><p>「主は、あなたとあなたの兄弟であるレビの子らをすべて御自身のそばに近づけられたのだ。<strong>その上、あなたたちは祭司職をも要求するのか</strong>」（<a href="https://bibleox.com/ja/jp-ni/chis/16/#L10">民. 16:10</a>）</p></blockquote><p>その後、神の栄光が現れ、地が反逆者たちを呑み込みました：</p><blockquote><p>「コラは共同体全体を集め、臨在の幕屋の入り口でモーセとアロンに相対した。主の栄光はそのとき、共同体全体に現れた。主はモーセとアロンに仰せになった。『この共同体と分かれて立ちなさい。<strong>わたしは直ちに彼らを滅ぼす</strong>』」（<a href="https://bibleox.com/ja/jp-ni/chis/16/#L19-21">民. 16:19-21</a>）</p></blockquote><p>神は、反逆者たちの献げ物を香炉から捨て、香炉そのものから、後の世代への記念として祭壇の覆いを作るよう言われました：</p><blockquote><p>「祭司アロンの子エルアザルに告げ、焼け跡から香炉を取り出し、<strong>炭火は遠くにまき散らすように言いなさい</strong>。香炉は既に聖なるものとなっている。命を落とした罪人たちの香炉を打ち延ばして板金にし、祭壇の覆いを作りなさい。それらは、主の御前にささげられ、聖なるものとされているからである。<strong>これは、イスラエルの人々に対する警告のしるしとなるであろう</strong>」（<a href="https://bibleox.com/ja/jp-ni/chis/17/#L2-3">民. 17:2-3</a>）<em>（ほかの翻訳では16:37-38。）</em></p></blockquote><blockquote><p>「<strong>これらのことは前例として彼らに起こったのです。それが書き伝えられているのは、時の終わりに直面しているわたしたちに警告するためなのです</strong>」（<a href="https://bibleox.com/ja/jp-ni/1kor/10/#L11">１コリ. 10:11</a>）</p></blockquote><p>使徒ユダも、コラの破滅的な強情を思い起こさせています：</p><blockquote><p>「不幸な者たちです。彼らは『カインの道』をたどり、金もうけのために『バラムの迷い』に陥り、<strong>『コラの反逆』によって滅んでしまうのです</strong>」（<a href="https://bibleox.com/ja/jp-ni/iud/1/#L11">ユダ. 1:11</a>）</p></blockquote><p>終わりの時にそのような人々が立ち上がるという預言も与えられています：</p><blockquote><p>「だれも健全な教えを聞こうとしない時が来ます。そのとき、人々は<strong>自分に都合の良いことを聞こうと、好き勝手に教師たちを寄せ集め</strong>」（<a href="https://bibleox.com/ja/jp-ni/2tim/4/#L3">２テモ. 4:3</a>）</p></blockquote><h3>新約において祭司が立てられることについての預言</h3><p>すでに旧約に、新約においても祭司と奉仕者が立てられるが、それはアロンの家系からだけでなく、すべての国の民からであるという預言がありました：</p><blockquote><p>「<strong>すべての国、すべての言葉の民を集めるために臨む &lt;…&gt; わたしは彼らのうちからも祭司とレビ人を立てる、と主は言われる</strong>」（<a href="https://bibleox.com/ja/jp-ni/is/66/#L18-21">イザ. 66:18-21</a>）</p></blockquote><p>新約は、だれも自分で祭司職を得ることはできないと指摘しています：</p><blockquote><p>「大祭司はすべて人間の中から選ばれ、罪のための供え物やいけにえを献げるよう、<strong>人々のために神に仕える職に任命されています</strong>。大祭司は、自分自身も弱さを身にまとっているので、無知な人、迷っている人を思いやることができるのです。また、その弱さのゆえに、民のためだけでなく、自分自身のためにも、罪の贖いのために供え物を献げねばなりません。また、<strong>この光栄ある任務を、だれも自分で得るのではなく</strong>、<strong>アロンもそうであったように</strong>、神から召されて受けるのです。同じように<strong>キリストも、大祭司となる栄誉を御自分で得たのではなく</strong>、『あなたはわたしの子、わたしは今日、あなたを産んだ』と言われた方が、それをお与えになったのです」（<a href="https://bibleox.com/ja/jp-ni/evr/5/#L1-5">ヘブ. 5:1-5</a>）</p></blockquote><h3>信じて洗礼を受けた魔術師シモンは、聖霊の賜物を授ける賜物を持っていない</h3><p>魔術師シモンは、書かれているとおり、信じて洗礼を受けました：</p><blockquote><p>「<strong>シモン自身も信じて洗礼を受け</strong>、いつもフィリポにつき従い、すばらしいしるしと奇跡が行われるのを見て驚いていた」（<a href="https://bibleox.com/ja/jp-ni/act/8/#L13">使. 8:13</a>）</p></blockquote><p>しかし、すべてのキリスト者が聖霊の賜物を授けられるわけではないことを理解したとき、彼はこの賜物を使徒たちから買い取ろうとしました。使徒たちはそのことのゆえに彼を呪いました：</p><blockquote><p>「<strong><mark>シモン</mark>は、使徒たちが手を置くことで、“霊”が与えられるのを見、金を持って来て</strong>、言った。<strong><mark>『わたしが手を置けば、だれでも聖霊が受けられるように、わたしにもその力を授けてください。』</mark></strong><strong>すると、<mark>ペトロは言った</mark>。『この金は、お前と一緒に滅びてしまうがよい。<mark>神の賜物を金で手に入れられると思っている</mark>からだ</strong>。お前はこのことに何のかかわりもなければ、権利もない。お前の心が神の前に正しくないからだ。この悪事を悔い改め、主に祈れ。そのような心の思いでも、赦していただけるかもしれないからだ。お前は腹黒い者であり、悪の縄目に縛られていることが、わたしには分かっている』」（<a href="https://bibleox.com/ja/jp-ni/act/8/#L18-23">使. 8:18-23</a>）</p></blockquote><p>このことから、すべてのキリスト者が、聖霊を授ける権能と神の賜物を持つ祭司だったわけではないことは明らかです。サマリアの人々に洗礼を授けた輔祭フィリポでさえ、そのような賜物を持っていませんでした（<a href="https://bibleox.com/ja/jp-ni/act/21/#L8">使. 21:8</a>）。そしてこの賜物を持つ人々は、使徒たちの按手（<a href="https://bibleox.com/ja/jp-ni/2tim/1/#L6">２テモ. 1:6</a>）と司祭職の按手（<a href="https://bibleox.com/ja/jp-ni/1tim/4/#L14">１テモ. 4:14</a>）によってそれを受けたのです。</p><p>つまり：</p><ul><li><p>すべての人が、教え、洗礼を授ける任務を受けたのではありません。「だから、あなたがたは<strong>行って</strong>、すべての民を<strong>わたしの弟子にしなさい</strong>。彼らに父と子と聖霊の名によって<strong>洗礼を授け</strong>」（<a href="https://bibleox.com/ja/jp-ni/mf/28/#L19">マタ. 28:19</a>）</p></li><li><p>すべての人が、この命令を受けたのではありません。「わたしの記念として<strong>このように行いなさい</strong>」（<a href="https://bibleox.com/ja/jp-ni/lk/22/#L19">ルカ. 22:19</a>; <a href="https://bibleox.com/ja/jp-ni/1kor/11/#L24">１コリ. 11:24</a>）</p></li><li><p>すべての人に、つなぎ、また解く権能が与えられたのではありません。「あなたがたが地上で<strong>つなぐ</strong>ことは、天上でもつながれ、あなたがたが地上で<strong>解く</strong>ことは、天上でも解かれる」（<a href="https://bibleox.com/ja/jp-ni/mf/18/#L18">マタ. 18:18</a>）</p></li><li><p>すべての人に、罪を赦し、また赦さないままにしておく権能が与えられたのではありません。「だれの罪でも、あなたがたが<strong>赦せば</strong>、その罪は赦される。だれの罪でも、あなたがたが<strong>赦さなければ</strong>、赦されないまま残る」（<a href="https://bibleox.com/ja/jp-ni/in/20/#L23">ヨハ. 20:23</a>）</p></li><li><p>すべての人に、聖霊を授けるために手を置く権能が与えられたのではありません。「<strong>使徒たちが手を置くことで、“霊”が与えられる</strong>」（<a href="https://bibleox.com/ja/jp-ni/act/8/#L18">使. 8:18</a>）</p></li><li><p>使徒が招くよう命じているのは、まさに長老（司祭）たちであり、その祈りと聖なる行為（油を塗ること）によって病人の罪が赦されるのです。「<strong>あなたがたの中で病気の人は、教会の長老を招いて</strong>、主の名によって<strong>オリーブ油を塗り、祈ってもらいなさい</strong>。信仰に基づく祈りは、病人を救い、主がその人を起き上がらせてくださいます。<strong>その人が罪を犯したのであれば、主が赦してくださいます</strong>」（<a href="https://bibleox.com/ja/jp-ni/iak/5/#L14-15">ヤコ. 5:14-15</a>）</p></li></ul><h2>王の系統を引く祭司 — どのように理解すべきか</h2><p>旧約においても新約においても、すべての信者は自分自身の神殿、すなわち自分の体において祭司となるよう招かれています。<a href="https://bibleox.com/ru/q/%D1%87%D0%B5%D0%BB%D0%BE%D0%B2%D0%B5%D0%BA-%D1%85%D1%80%D0%B0%D0%BC-%D0%91%D0%BE%D0%B6%D0%B8%D0%B9">人は神の神殿です</a>。そして祭司とは、この神殿で神にいけにえを献げる者です。使徒ペトロは、王の系統を引く祭司について語る前に、まさにこの考えから始めています：</p><blockquote><p>「あなたがた自身も<strong>生きた石として用いられ、<mark>霊的な家</mark>に造り上げられるようにしなさい。そして聖なる祭司となって</strong>神に喜ばれる<strong>霊的ないけにえを</strong>、イエス・キリストを通して<strong>献げなさい</strong>」（<a href="https://bibleox.com/ja/jp-ni/1pet/2/#L5">１ペト. 2:5</a>）</p></blockquote><p>王の系統を引く祭司について語りながら、使徒ペトロは同じ手紙の中で、牧者たちと、彼らに従う必要についても語っています：</p><blockquote><p>「同じように、若い人たち、<strong>長老に従いなさい</strong> <em>（ギリシア語 πρεσβυτέροις —「長老たちに」）</em>。皆互いに謙遜を身に着けなさい。なぜなら、<strong>『神は、高慢な者を敵とし、謙遜な者には恵みをお与えになる』</strong>からです」（<a href="https://bibleox.com/ja/jp-ni/1pet/5/#L5">１ペト. 5:5</a>）</p></blockquote><p>キリスト者を祭司とする言明がもう一つあります：</p><blockquote><p>「更に、証人、誠実な方、死者の中から最初に復活した方、地上の王たちの支配者、イエス・キリストから恵みと平和があなたがたにあるように。わたしたちを愛し、御自分の血によって罪から解放してくださった方に、<strong>わたしたちを王とし、御自身の父である神に仕える祭司としてくださった方に</strong>、栄光と力が世々限りなくありますように、アーメン」（<a href="https://bibleox.com/ja/jp-ni/otkr/1/#L4-6">黙. 1:4-6</a>; <a href="https://bibleox.com/ja/jp-ni/otkr/5/#L9-10">黙. 5:9-10</a>; <a href="https://bibleox.com/ja/jp-ni/otkr/20/#L6">黙. 20:6</a>）</p></blockquote><p>キリスト者が王であるのと同じ意味で、キリスト者は祭司でもあります。もし今、外の人々を支配していないのなら、外の人々のための祭司でもありません。このような説明は文脈に対して誠実であり、常識にも合っています。</p><p>キリスト者は自分自身の体において王として治めるよう招かれており、自分の理性を体の欲望の上に君臨させ、この神の神殿（自分の体と心）を清めた後、そこで神に喜ばれるいけにえ、すなわち清い思い、言葉、行い、祈り、賛美を献げなければなりません。</p><h2>司祭への敬意</h2><blockquote><p>「よく指導している長老たち、特に御言葉と教えのために労苦している長老たちは<strong>二倍の報酬を受けるにふさわしい</strong>、と考えるべきです」（<a href="https://bibleox.com/ja/jp-ni/1tim/5/#L17">１テモ. 5:17</a>）<em>（「報酬」は、ギリシア語原文では τιμῆς —「尊敬、誉れ」です。）</em></p></blockquote><blockquote><p>「心を尽くして主を敬い、<strong>主の祭司をあがめよ</strong>」（<a href="https://bibleox.com/ja/jp-ni/prsir/7/#L29">シラ. 7:29</a>）</p></blockquote><blockquote><p>「主を畏れ、<strong>祭司を尊べ</strong>。規定に従って、祭司にその分け前を納めよ」（<a href="https://bibleox.com/ja/jp-ni/prsir/7/#L31">シラ. 7:31</a>）</p></blockquote><h2>司祭職に従う必要</h2><blockquote><p>「<strong><mark>指導者たちの言うことを聞き入れ、服従しなさい</mark>。この人たちは、神に申し述べる者として、あなたがたの魂のために心を配っています</strong>。彼らを嘆かせず、喜んでそうするようにさせなさい。そうでないと、あなたがたに益となりません」（<a href="https://bibleox.com/ja/jp-ni/evr/13/#L17">ヘブ. 13:17</a>）</p></blockquote><blockquote><p>「同じように、若い人たち、<strong><mark>長老</mark>に<mark>従いなさい</mark></strong>。皆互いに謙遜を身に着けなさい。なぜなら、<strong>『神は、高慢な者を敵とし、謙遜な者には恵みをお与えになる』</strong>からです」（<a href="https://bibleox.com/ja/jp-ni/1pet/5/#L5">１ペト. 5:5</a>）</p></blockquote><p>旧約では、祭司である裁き手に従わないことは死に値する罪です：</p><blockquote><p>「あなたの神、主に仕えてそこに立つ<strong>祭司あるいは裁判人を無視して</strong>、勝手にふるまう者があれば、その者を<strong>死刑に処し</strong>、イスラエルの中から悪を取り除かねばならない」（<a href="https://bibleox.com/ja/jp-ni/vtor/17/#L12">申. 17:12</a>）</p></blockquote><h2>批判への応答</h2><h3>按手による聖霊の降臨は、シモンの受け止め方にすぎないのか</h3><p>正教徒は、按手によって聖霊を授ける特別な賜物についての聖書の引用を示します。そのような引用の中に、魔術師シモンの例があります。</p><p>魔術師シモンは、すべてのキリスト者が聖霊を与えるために手を置くことができるわけではないことを見ました。文字どおりには、だれもがそのような権能を持っているわけではないということです。彼は、自分にもそのような権能を与えてもらおうと、使徒たちに賄賂を持って来ました（使徒たちは彼を呪いました）：</p><blockquote><p>「シモンは、<strong>使徒たちが手を置くことで、“霊”が与えられる</strong>のを見、金を持って来て、言った。<strong>『わたしが手を置けば</strong>、<strong><mark>だれでも</mark>聖霊が受けられるように、<mark>わたしにもその力を授けてください</mark>。』</strong>すると、ペトロは言った。『この金は、お前と一緒に滅びてしまうがよい。<strong><mark>神の賜物</mark></strong>を金で手に入れられると思っているからだ』」（<a href="https://bibleox.com/ja/jp-ni/act/8/#L18-20">使. 8:18-20</a>）</p></blockquote><p>批判者たちは、これは魔術師シモンの誤った受け止め方にすぎないと言います。彼は魔術師だったので、すべてを誤解したのだ、というのです。</p><p>では使徒パウロも魔術師だったのでしょうか。</p><blockquote><p>「そういうわけで、<strong><mark>わたしが手を置いたことによって</mark>あなたに与えられている<mark>神の賜物</mark></strong>を、再び燃えたたせるように勧めます」（<a href="https://bibleox.com/ja/jp-ni/2tim/1/#L6">２テモ. 1:6</a>）</p></blockquote><blockquote><p>「<strong>あなたの内にある恵みの<mark>賜物</mark></strong>を軽んじてはなりません。<strong>その賜物は、<mark>長老たちがあなたに手を置いたとき</mark>、預言によって与えられたものです</strong>」（<a href="https://bibleox.com/ja/jp-ni/1tim/4/#L14">１テモ. 4:14</a>）</p></blockquote><p>使徒は、神の賜物は自分の按手によると直接言っています。</p><p>しかしシモンの例に戻りましょう。使徒言行録のこの記述は福音記者ルカによって書かれています（<a href="https://bibleox.com/ja/jp-ni/lk/1/#L3">ルカ. 1:3</a>; <a href="https://bibleox.com/ja/jp-ni/act/1/#L1">使. 1:1</a>）。彼は、魔術師シモンによる出来事の誤った理解とされるものについて書いているのではなく、シモンがただそれを見たと書いているのです。では彼は何を見たのでしょうか。福音記者ルカはそれを書いています。「<em>使徒たちが手を置くことで、“霊”が与えられる</em>」—これが彼の見たことです。これを言っているのはシモンではなく、福音記者ルカです。さらに使徒ペトロの言葉から、それが本当にそうであることが明らかになります。使徒はこの神の賜物を授けることができますが、シモンを非難しているのは、まさに<strong>神の賜物</strong>を<strong><u>金で</u></strong>手に入れようと望んだことなのです。</p><h3>使徒パウロは人を通さずに叙聖されたのか</h3><p>正教徒は、使徒パウロが教会によってその奉仕に叙聖されたことを示します：</p><blockquote><p>「彼らが主を礼拝し、断食していると、聖霊が告げた。『さあ、バルナバと<strong><mark>サウロ</mark></strong>をわたしのために選び出しなさい。わたしが前もって二人に決めておいた仕事に当たらせるために。』そこで、彼らは断食して祈り、<strong><mark>二人の上に手を置いて</mark></strong>出発させた」（<a href="https://bibleox.com/ja/jp-ni/act/13/#L2-3">使. 13:2-3</a>）</p></blockquote><p>批判者たちは、使徒パウロは人々によって叙聖されたのではないと反論し、次の節を挙げます：</p><blockquote><p>「<strong><mark>人々からでもなく、人を通してでもなく</mark></strong>、イエス・キリストと、キリストを死者の中から復活させた父である神とによって<strong>使徒とされたパウロ</strong>」（<a href="https://bibleox.com/ja/jp-ni/gal/1/#L1">ガラ. 1:1</a>）</p></blockquote><p>しかしこの主張には根拠がありません。ここで語られているのは選びの仕方だけであって、神の賜物を授けることではないからです。</p><p>サウロに手が置かれる前に、実際に聖霊御自身が彼を選び、書かれているとおり、聖霊が彼を召された奉仕のためにサウロを選び出すよう教会に命じておられます。批判者たちがなぜこの節を挙げるのかは不明です。そこには何の矛盾もないからです。サウロは人々によって選ばれたのでも、人々を通して選ばれたのでもなく、聖霊御自身が彼を選び、奉仕のために彼を選び出すよう教会に命じ、その後に教会がサウロを叙聖するのです：</p><blockquote><p>「彼らが主を礼拝し、断食していると、<strong><mark>聖霊が告げた</mark>。『さあ</strong>、バルナバと<strong><mark>サウロ</mark>をわたしのために<mark>選び出しなさい</mark></strong>。わたしが<strong><mark>前もって</mark>二人に<mark>決めておいた</mark></strong>仕事に当たらせるために。』<strong><mark>そこで</mark></strong>、彼らは断食して祈り、<strong><mark>二人の上に手を置いて</mark></strong>出発させた」（<a href="https://bibleox.com/ja/jp-ni/act/13/#L2-3">使. 13:2-3</a>）<em>（「前もって決めておいた」は、ギリシア語原文では προσκέκλημαι —「召した」です。）</em></p></blockquote><p>このように、選びは聖霊によって行われ、恵みは教会なしにではなく、教会を通して、すなわち教会の奉仕者たちの按手を通して送られるのです。</p><p>批判者たちは、自分たちが作った共同体に最初のキリスト者たちとの直接のつながりがまったくないこと、そして牧者や教師を自分たちの間で独自に選んでいることを正当化しようとしています。明らかに、教会を導き教える権能を神から持っていなかった人々が、だれかにそのような権能を与えることはできませんでした。しかし彼らにとっては、聖霊がそうすることもありえた、すなわち彼ら以前にすでに存在していた教会とまったくつながりなしに、彼らの牧者を奉仕に任命することもありえた、という可能性を示すことが大切なのです。</p><p>しかし、聖霊は御自身の望まれることを何でも自由に行われますが、わたしたちは聖書の中に、神がキリストによって造られた一つの見える教会から切り離して人々を奉仕に任命し、救われた例を一つも見ません。</p><p>神はサウロを選ばれました。そして疑いなく御自身で彼を奉仕に任命することもおできになったのですが、御自分の教会なしにはそうされませんでした。最初の異邦人たち、すなわちエチオピアの宦官（<a href="https://bibleox.com/ja/jp-ni/act/8/#L27">使. 8:27</a>）と百人隊長コルネリウス（<a href="https://bibleox.com/ja/jp-ni/act/10/#L1">使. 10:1</a>）の洗礼においても、同じことが見られます。</p><ol><li><p>エチオピアの宦官は聖書を読んでいましたが、理解していませんでした。<strong>神は御自身で</strong>宦官を教え、洗礼の救いの恵みを授けることもおできになりました。<strong>しかし神はそれを教会から切り離して行われません</strong>。神は宦官のもとに教会を遣わし、教会が彼に聖書を理解することを教え、洗礼において恵みを授けるのです。</p></li><li><p>百人隊長コルネリウスは神に祈り、善い行いをしていました。<strong>神は御自身で</strong>コルネリウスに救いの恵みを授けることもおできになりました。<strong>しかし神はそれを教会から切り離して行われません</strong>。そうではなく、彼のもとに天使を遣わし、（使徒ペトロの姿で）教会を見つけるよう命じられます。使徒が来たときに初めて、聖霊はコルネリウスの上に来られます。聖霊は使徒なしにもっと早く来ることもおできになったのですが、そうはされませんでした。</p></li><li><p>キリスト者を迫害していたサウロ（後の使徒パウロ）は、キリスト者を迫害するためにダマスコへ向かいます。キリストは目をくらませる光として彼に現れ、サウロはキリストに、何をすべきかを尋ねます。キリストなる<strong>神は御自身で</strong>サウロに恵みを与えることもおできになりました。<strong>しかしそれを教会から切り離して行われず</strong>、ダマスコで（使徒アナニアの姿で）教会を見つけるよう命じられます。そしてそこで初めて、教会を通して、使徒はいやし（<a href="https://bibleox.com/ja/jp-ni/act/9/#L17">使. 9:17</a>）、聖霊の恵み（<a href="https://bibleox.com/ja/jp-ni/act/9/#L17">使. 9:17</a>）、そして罪を洗い流した洗礼の救いの恵み（<a href="https://bibleox.com/ja/jp-ni/act/22/#L16">使. 22:16</a>）を受けるのです。</p></li></ol><p>すべての場合において同じであり、特別な使徒の奉仕へのサウロの叙聖においても同じです。神御自身がサウロを選ばれ、神御自身が彼に賜物を授けることもおできになりましたが、御自分の教会から切り離してそうはされません。聖霊は教会に語りかけ、教会がサウロを叙聖するのです（<a href="https://bibleox.com/ja/jp-ni/act/13/#L2-3">使. 13:2-3</a>）。</p><p>このように、教会から離れた団体が、教会から離れた自分たちの牧者の特別な召命を主張することには、聖書の根拠がまったくありません。聖書には、そのような例はまったくないのです。</p><h3>按手は異教から借用されたものなのか</h3><p>自分で教会を作った人々は、まず第一に、キリストによってかつて造られた教会が堕落したことを証明しなければなりません。もし教会が堕落していないのなら、彼らの新しい共同体は必要なく、単にキリストの教会に入ればよいからです。教会の堕落を証明するために、「レッテル貼り」の手法、それもできるだけ恐ろしいレッテルを貼る手法がしばしば用いられます。こうして教会はしばしば、異教の慣習を借用したことによって神から離れて異教に陥ったと非難されます。その慣習として挙げられるのは：</p><ul><li><p>聖なる神殿の存在、</p></li><li><p>聖なる場所、</p></li><li><p>聖なる物、</p></li><li><p>聖なる像、</p></li><li><p>特別な聖なる人々（祭司）、</p></li><li><p>聖なる儀式と機密（神に影響を与えるための処方とされるもの）。その中に按手があります。</p></li></ul><p>これは極めて不条理な非難です。これらはすべて神御自身によって定められたものであり、すべて聖書にはっきりと書かれているからです。ここで異教徒が引き合いに出されるのは、教会にレッテルを貼るためだけです。これらの聖なる建物、場所、物、行為、人々はすべて旧約と新約の聖書の中にあり、それについては別の記事で知ることができます：</p><ul><li><p><a href="https://bibleox.com/ja/ja/w/Sh2r_聖なるもの/">聖なるもの</a></p></li></ul><h4>旧約における按手</h4><p>ヤコブは孫たちの上に手を置いて、祈りと共に彼らを祝福しました：</p><blockquote><p><em>「イスラエルは</em><strong><em>右<mark>手</mark>を伸ばして、弟であるエフライムの<mark>頭の上に置き</mark></em></strong><em>、</em><strong><em>左手をマナセの<mark>頭の上に置いた</mark></em></strong><em>。&lt;…&gt; そして、ヨセフを</em><strong><em><mark>祝福して</mark></em></strong><em>言った。『わたしの先祖アブラハムとイサクがその御前に歩んだ神よ。わたしの生涯を今日まで導かれた牧者なる神よ。わたしをあらゆる苦しみから贖われた</em><strong><em><mark>御使いよ</mark></em></strong><em>。どうか、</em><strong><em><mark>この子供たちの上に祝福をお与えください</mark></em></strong><em>。どうか、わたしの名とわたしの先祖アブラハム、イサクの名が彼らによって覚えられますように。どうか、彼らがこの地上に数多く増え続けますように』」（</em><a href="https://bibleox.com/ja/jp-ni/gen/48/#L14-16"><em>創. 48:14-16</em></a><em>）</em></p></blockquote><p>神は預言者モーセに、按手によってヌンの子ヨシュアを奉仕に任命するよう命じられました：</p><blockquote><p><em>「</em><strong><em><mark>主はモーセに言われた</mark></em></strong><em>。『霊に満たされた人、</em><strong><em><mark>ヌンの子ヨシュアを選んで</mark></em></strong><em>、</em><strong><em><mark>手を彼の上に置き</mark></em></strong><em>』&lt;…&gt; モーセは、主が命じられたとおりに、ヨシュアを選んで祭司エルアザルと共同体全体の前に立たせ、</em><strong><em><mark>手を彼の上に置いて</mark></em></strong><em>、主がモーセを通して命じられたとおりに、彼を職に任じた」（</em><a href="https://bibleox.com/ja/jp-ni/chis/27/#L18,22-23"><em>民. 27:18,22-23</em></a><em>）</em></p></blockquote><blockquote><p>「<strong>ヌンの子ヨシュアは<mark>知恵の霊に満ちていた。モーセが彼の上に手を置いたからである</mark></strong>。イスラエルの人々は彼に聞き従い、主がモーセに命じられたとおり行った」（<a href="https://bibleox.com/ja/jp-ni/vtor/34/#L9">申. 34:9</a>）</p></blockquote><p>神は、按手によってレビ人を神殿での奉仕に任命するよう命じられました：</p><blockquote><p><em>「そして、レビ人を主の御前に進ませ、イスラエルの人々は</em><strong><em><mark>レビ人の上に手を置く</mark></em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/chis/8/#L10"><em>民. 8:10</em></a><em>）</em></p></blockquote><h4>新約における按手</h4><blockquote><p><em>「そういうわけで、</em><strong><em><mark>わたしが手を置いたこと</mark><u><mark>によって</mark></u>あなたに与えられている<mark>神の賜物</mark></em></strong><em>を、再び燃えたたせるように勧めます」（</em><a href="https://bibleox.com/ja/jp-ni/2tim/1/#L6"><em>２テモ. 1:6</em></a><em>）</em></p></blockquote><blockquote><p><em>「</em><strong><em>あなたの内にある恵みの<mark>賜物</mark></em></strong><em>を軽んじてはなりません。</em><strong><em>その賜物は、<mark>長老たちがあなたに手を置いたとき</mark>、預言によって与えられたものです</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/1tim/4/#L14"><em>１テモ. 4:14</em></a><em>）</em></p></blockquote><blockquote><p><em>「種々の洗礼についての</em><strong><em><mark>教え</mark></em></strong><em>、</em><strong><em><mark>手を置く儀式</mark></em></strong><em>、死者の復活、永遠の審判など」（</em><a href="https://bibleox.com/ja/jp-ni/evr/6/#L1-2"><em>ヘブ. 6:1-2</em></a><em>）</em></p></blockquote><p>聖書を学んだ後では、教会が使徒たちの後にこれらの慣習とそれに対する態度を異教徒から取り入れたという非難には驚かされます。使徒たち自身が、自分たちの按手<u>によって</u>与えられた神の賜物について書き、それを教えの一部として語っているのですから。これはすべて新しく考え出されたもの（その仕方自体）ではなく、使徒たち以前に何世紀もの間、同じ環境の中ですでに存在していたものであり、異教徒によってではなく、神御自身によって定められたものなのです。</p><h3>新約では祭司と呼ばれなかったのか</h3><p>「祭司職」という語は新約の文脈に出てきます。キリストは祭司職の変更をもたらされたのであって、その廃止ではありません：</p><blockquote><p>「<strong><mark>祭司制度（ἱερωσύνης）</mark>に変更があれば</strong>、律法にも必ず変更があるはずです」（<a href="https://bibleox.com/ja/jp-ni/evr/7/#L12">ヘブ. 7:12</a>）</p></blockquote><p>キリストは永遠の大祭司となられましたが、祭司が廃止されたのではありません。祭司たちの選びと任命については、預言の中で語られています：</p><blockquote><p>「<strong><mark>すべての国</mark>、すべての言葉の民を集めるために臨む</strong> &lt;…&gt; <strong><mark>わたしは彼らのうちからも祭司</mark>（ἱερεῖς, כֹּהֲנִ֥ים）とレビ人を立てる、と主は言われる</strong>」（<a href="https://bibleox.com/ja/jp-ni/is/66/#L18-21">イザ. 66:18-21</a>）</p></blockquote><p>さらに、だれでもではなく、まさに使徒たちが実際に祭司でした。旧約では、人を罪から清める務めは祭司にありました（<a href="https://bibleox.com/ja/jp-ni/lev/5/#L5-6">レビ. 5:5-6</a>）。それで新約においても、新しい教会の位階が形成される際に、この権能、すなわち罪を赦し、また赦さないままにしておく権能がその位階に与えられるのです：</p><blockquote><p>「イエスは重ねて言われた。『あなたがたに平和があるように。父がわたしをお遣わしになったように、わたしもあなたがたを遣わす。』そう言ってから、<strong>彼らに息を吹きかけて</strong>言われた。『<strong>聖霊を受けなさい。</strong><strong>だれの罪でも、あなたがたが赦せば、その罪は赦される。だれの罪でも、あなたがたが赦さなければ、赦されないまま残る</strong>』」（<a href="https://bibleox.com/ja/jp-ni/in/20/#L21-23">ヨハ. 20:21-23</a>）</p></blockquote><p>最も古いキリスト者たちは、長老たちが祭司でもあったことを確証しています：<a href="https://bibleox.com/ru/ru/w/gq8M_%D0%9D%D0%BE%D0%B2%D0%BE%D0%B7%D0%B0%D0%B2%D0%B5%D1%82%D0%BD%D1%8B%D0%B5_%D0%BF%D1%80%D0%B5%D1%81%D0%B2%D0%B8%D1%82%D0%B5%D1%80%D1%8B__%D1%81%D0%B2%D1%8F%D1%89%D0%B5%D0%BD%D0%BD%D0%B8%D0%BA%D0%B8">引用</a>（ロシア語）。</p>
