    references: |-
      <ol><li><p>「<em>それゆえ、こう言え、と言われている。そして</em><strong><em>神は助けとして律法を与えられた</em></strong><em>と付け加えている。すなわち福音の律法であって、それに耳を傾ける者たちが、</em><strong><em>このような言葉ではない。それのために贈り物をするのは正しくない</em></strong><em>と言うためである。自分の心からだけ語る者たちは偽りを売るのである。しかし、救いをもたらす神のまことの律法、すなわち福音の啓示は、地上に生きる者たちに助けとして与えられており、</em><strong><em>このような言葉</em></strong><em>、すなわち偽預言者たちの言葉ではない。そのうえ、それのために贈り物をする必要もない。少し前に述べたように、ある者たちは魔術師たちの偽りの言葉を金で買うが、天の啓示は望む者に（無償で）差し出されているのである</em>」（<a href="https://azbyka.ru/otechnik/Kirill_Aleksandrijskij/tolkovanie-na-proroka-isaiyu/1">アレクサンドリアのキュリロス（376〜444年）</a>、『イザヤ書注解』、ロシア語訳からの訳）</p></li><li><p><a href="https://ja.wikipedia.org/wiki/聖書のみ">https://ja.wikipedia.org/wiki/聖書のみ</a></p></li><li><p><em>「教会から離れた者は皆、絶えず聖書への敬意を口にしながら、同時に、まもなく聖書の書物そのものさえ歪めるようになるのは、驚くべきことではないだろうか。人々は教会を離れるやいなや、聖書を自己流に解釈し始め、しかも各人が違うように解釈する。キリストは御自分を信じるすべての人の一致のために父なる神に祈られた。使徒たちは心を一つにするよう勧め、信仰の一致について語った。教会なしには、いかなる一致も不可能であることがわかる。またしてもバベルの『言葉の混乱』が起こらずにはいない。教会では、信仰は何千年もの間同じままであり、常に自らに等しい。しかし教会から離れた者たちの間では、それはほとんど毎日変わる。新しい異端者や分派の者が絶えず現れ、その教師たちは各人各様に説く。教会なしには、何よりもまずキリストの教えが滅び、はかない人間の思弁に取って代わられることは明らかである」</em>（<a href="https://azbyka.ru/otechnik/Ilarion_Troitskij/khristianstva-net-bez-tserkvi/#">神品致命者イラリオン（トロイツキー）（1886〜1929年）、『教会なしにキリスト教はない』</a>、ロシア語からの訳）</p></li><li><p>七十人訳：「神は助けとして律法を与えられた。彼らが『この言葉のようではない。これについては贈り物をする必要はない』と言うためである」（<a href="https://bibleox.com/ja/gr-lxx-byz/is/8/#L20">イザ. 8:20、七十人訳</a>、ギリシア語からの訳）。ここで語られているのはモーセ五書だけです。言い回しの違いのほかに、占い師たちが自分の予言に代価を求めることが指摘されています。</p></li></ol><h3>参考資料（ロシア語）</h3><ol><li><p><a href="https://azbyka.ru/otechnik/Nikolaj_Varzhanskij/oruzhie-pravdy/3_1">https://azbyka.ru/otechnik/Nikolaj_Varzhanskij/oruzhie-pravdy/3_1</a></p></li><li><p>聖書の中に「聖書のみ」を示そうとする試みを分析した記事：<a href="https://bibleox.com/ru/ru/w/tynP_%D0%9A%D0%B0%D0%BA_%D0%BF%D1%80%D0%BE%D1%82%D0%B5%D1%81%D1%82%D0%B0%D0%BD%D1%82_%D0%BF%D0%BE%D1%81%D1%82%D1%83%D0%BB%D0%B0%D1%82_%D1%82%D0%BE%D0%BB%D1%8C%D0%BA%D0%BE_%D0%9F%D0%B8%D1%81%D0%B0%D0%BD%D0%B8%D0%B5_%D0%B7%D0%B0%D1%89%D0%B8%D1%89%D0%B0%D0%BB">あるプロテスタントは「聖書のみ」の原理をどのように擁護したか</a>（ロシア語）</p></li><li><p>ソラ・スクリプトゥラの文脈で見た、ペンテコステ派から正教会への道：<a href="https://youtu.be/f3bOTveRdXY?si=0RdgWh51R4aqa14q">https://youtu.be/f3bOTveRdXY?si=0RdgWh51R4aqa14q</a></p></li></ol>
    body: |-
      <h2>序</h2><p>ソラ・スクリプトゥラは、自分の教会を作るために使われる手品です。いかさま師の手品のように、単純だが巧みな手つきが聞き手を惑わし、聞き手は目の前で行われているすり替えに気づきません。聞き手に教えられているのは「聖書のみによる」教えなどではまったくなく、新しい教師の個人的な信仰（意見）に合わないものをすべて退けた、聖書のもう一つの解釈にすぎません。教師の個人的な信仰が聞き手に伝えられ、それがまた一つの人間の伝統となります。しかしこの伝統は伝統とは呼ばれません。そこに手品の種があるのです。聞き手は、自分は聖書のみによって信じているという錯覚を抱きます。以前の異端の団体も同じようにして作られました。聖書と共に使徒たちから直接受けた教会の信仰を退け、互いにみな異なる自分たちの教師の個人的な意見を、すべての上に置いたのです。分派がいくつ生まれようと、その教師たちは聖書から、まったくどんな信仰でも解釈して引き出すことができます。</p><p><strong>神品致命者リヨンのエイレナイオス（130年頃〜202年）</strong></p><blockquote><p>彼らは、福音記者たちや使徒たちの書物からだけ、<strong>ゆがんだ解釈と欺瞞的な説明によって</strong>自分たちの意見の証拠を引き出そうとしているのではない。<strong>律法と預言者についても同じように扱っている</strong>。&lt;…&gt; また彼らのうちのある者たちは、<strong>大いなる狡猾さをもって聖書の部分を自分たちの作り話に合わせ、堅固な信仰を保っていない者たちを真理から捕らえ去る</strong>。&lt;…&gt; 友よ、<strong>これらの者たちが、聖書から自分たちの体系を支えようとして聖書を乱用しながら、自分自身を欺くために用いる方法</strong>が、あなたにはわかるであろう。&lt;…&gt; さて、これら異端者たちの一貫しない意見（<strong>彼らは二人三人いれば</strong>）を見てみよう。<strong>彼らは同じ点を扱いながら一致せず</strong>、事柄においても名においても、<strong>互いに食い違う意見を述べている</strong>。</p></blockquote><p>（<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b1/">『異端反駁』第1巻</a>、英語。英訳からの訳）</p><blockquote><p>このように、<strong>一つの［箇所］について彼らの間には食い違いがあり、同じ聖書について一致しない意見を持っている</strong>。</p></blockquote><p>（<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b4/">『異端反駁』第4巻、35章4</a>、英語。英訳からの訳）</p><p><strong>ストリドンの福者ヒエロニムス（347年頃〜420年）</strong></p><blockquote><p><em>しかし、わたしたちはすでに長く議論し、長引いた論争が聴衆の注意を疲れさせてしまったので、わたしの意見を手短に、包み隠さず言おう。</em><strong><em>わたしたちは、使徒たちによって建てられ、今日まで続いているあの教会にとどまるべきである。もしあなたが、キリスト者と呼ばれる者たちが主イエス・キリストからではなく、ほかのだれか、たとえばマルキオン派、ウァレンティノス派、山の人々や平野の人々などから名を取っていると聞くなら、そこにあるのはキリストの教会ではなく、反キリストの会堂であると確信してよい。彼らが教会の創設の後に起こったという事実そのものが、彼らこそ使徒がその到来を予告した者たちであることの証拠だからである</em></strong><em>。</em><strong><em>そして、自分たちの主張に聖書の権威があると考えて、うぬぼれてはならない。悪魔自身も聖書を引用したのであり、聖書の本質は文字ではなく意味にあるからである。そうでなければ、もしわたしたちが<u>文字</u>に従うなら、わたしたちもまた新しい教義をでっち上げることができる</em></strong><em>。たとえば、靴を履き、上着を二枚持っている者は教会に受け入れてはならない、と主張することもできるのである。</em></p></blockquote><p>（<a href="https://bibleox.com/en/en/w/jerome-the-dialogue-against-the-luciferians/">『ルキフェル派駁論』</a>、英語。英訳からの訳）</p><p><strong>レランスの克肖者ウィンケンティウス（450年以前に没）</strong></p><blockquote><p>わたしたちはまた、ネストリオスの邪悪な思い上がりを非難した。彼は<strong>自分こそが聖書を理解した最初の、そして唯一の者であり、彼以前に神の言葉を解き明かしたすべての教師たち、すなわち全祭司団、全証聖者と致命者たちは無知であったと誇った。彼らのうちのある者は神の律法についての注解を出し</strong>、ほかの者たちはその注解に同意し、あるいはそれを受け入れていたのである。一言で言えば、彼は<strong>全教会が今も誤っており、常に誤っていたと確信をもって主張した</strong>。彼の見るところでは、教会が無知で誤った教師たちに従ってきたし、今も従っているからだというのである。</p></blockquote><p>（<a href="https://bibleox.com/en/en/w/oXFe_For_the_Antiquity_and_Universality_of_the_Catholic_Faith_Against_the_Profane_Novelties_of_All_Heresies/">『備忘録』</a>、英語。英訳からの訳）</p><p>このような言葉をほかにも<a href="https://bibleox.com/ru/ru/w/WxNK_%D0%9F%D1%80%D0%BE%D1%82%D0%B8%D0%B2_Sola_Scriptura/">参照</a>（ロシア語）。</p><h2>ソラ・スクリプトゥラ</h2><p><strong>「ソラ・スクリプトゥラ」</strong>（ラテン語 Sola Scriptura —「聖書のみ」）とは、16世紀に宗教改革者たち（<a href="https://bibleox.com/ru/ru/w/3SlQ_%D0%9F%D1%80%D0%BE%D1%82%D0%B5%D1%81%D1%82%D0%B0%D0%BD%D1%82%D0%B8%D0%B7%D0%BC">プロテスタント</a>（ロシア語）運動を始めた人々、ロシア語）が提唱した教えの組み立て方であり、それによれば、教えを組み立てるための最高の権威は（読む者が主観的に理解した）聖書のみです。</p><p>理論はともかく、プロテスタントや新プロテスタントの間では、「ソラ・スクリプトゥラ」を聖伝の完全な否定と理解することが広まっています。教父たちの遺産の領域で議論する用意のあるプロテスタントは多くなく、正教徒とプロテスタントの論争では、教父たちの著作はもちろん、その名前を挙げることさえ、しばしば激しい拒絶と嘲笑に遭います。プロテスタントの団体では「伝統」という言葉そのものが、「昔の人の言い伝え」（<a href="https://bibleox.com/ja/jp-ni/mf/15/#L2">マタ. 15:2</a>）と同一視されることで否定的な意味を与えられ、使徒たち自身が守るよう命じた使徒的聖伝（<a href="https://bibleox.com/ja/jp-ni/2sol/2/#L15">２テサ. 2:15</a>）、すなわち主と使徒たちによってさまざまな方法で教会に植えられ、教会の中で絶えず守られ、先祖から子孫へと伝えられてきた信仰の存在は、まったく無視されています。</p><h2>ソラ・スクリプトゥラを正当化しようとする試み</h2><p>ソラ・スクリプトゥラの擁護者たちは聖書の言葉を引用し、それが聖書を信仰の最高の、あるいは唯一の権威と見なす必要について語っているかのように示します。しかし実際には、引用される言葉のどれ一つとして、ソラ・スクリプトゥラ、すなわち聖書<strong>のみ</strong>が（そしてそれ以外の何ものも）教えにおいて何か排他的な、最高の、あるいは唯一の役割を持つということについて語ってはいません。</p><p>ソラ・スクリプトゥラを擁護するために、次のような種類の引用が持ち出されます。</p><h3>1. 神の言葉は真理である</h3><p>神がどのような方法で（口頭で、書き物で、幻で、使者すなわち天使、預言者、使徒を通して）伝えることも真理です。</p><blockquote><p>「真理によって、彼らを聖なる者としてください。<strong>あなたの御言葉は真理です</strong>」（<a href="https://bibleox.com/ja/jp-ni/in/17/#L17">ヨハ. 17:17</a>）</p></blockquote><p>わたしたちはこれに異論はありません。神の言葉はすべて真理であり、それは書かれた言葉だけではありません。口頭の伝承もまた神の言葉と呼ばれています。</p><blockquote><p>「わたしたちから<strong>神の言葉を<u>聞いた</u></strong>とき、あなたがたは、それを人の言葉としてではなく、<strong>神の言葉</strong>として受け入れたからです。事実、それは神の言葉であり、また、信じているあなたがたの中に現に働いているものです」（<a href="https://bibleox.com/ja/jp-ni/1sol/2/#L13">１テサ. 2:13</a>）（<a href="https://bibleox.com/ja/jp-ni/1pet/1/#L23-25">１ペト. 1:23-25</a>）</p></blockquote><p>また、聖書がすべて神の霊感によるものであることにも異論はありません。</p><blockquote><p>「<strong>聖書はすべて神の霊の導きの下に書かれ</strong>、人を教え、戒め、誤りを正し、義に導く訓練をするうえに有益です」（<a href="https://bibleox.com/ja/jp-ni/2tim/3/#L16">２テモ. 3:16</a>）</p></blockquote><h3>2. 聖書は信じる者にとって大切である</h3><p>聖書は信じる者にとって大きな意味を持っています。</p><blockquote><p>「<strong>聖書はすべて</strong>神の霊の導きの下に書かれ、人を教え、戒め、誤りを正し、義に導く訓練をするうえに<strong>有益です</strong>」（<a href="https://bibleox.com/ja/jp-ni/2tim/3/#L16">２テモ. 3:16</a>）</p></blockquote><blockquote><p>「あなたたちは聖書の中に永遠の命があると考えて、<strong>聖書を研究している</strong>。ところが、聖書はわたしについて証しをするものだ」（<a href="https://bibleox.com/ja/jp-ni/in/5/#L39">ヨハ. 5:39</a>）</p></blockquote><p>これにも異論はありません。</p><hr><p>これはすべて真実です。正教会は以上のどれにも異論を唱えず、むしろ自らそのすべてを肯定しています。</p><p>しかし、</p><ul><li><p>これらの引用は、真理が聖書の中に<strong>のみ</strong>あり、聖伝は真理ではないということを示してはいません。聖伝についての同じような引用は、ただ無視されています（<a href="https://bibleox.com/ja/ja/w/Ss5q_聖書のみへの反論/">下記</a>「聖伝を守り、それに従って教えよという命令」を参照）。ソラ・スクリプトゥラの支持者たちには、聖伝の必要性を擁護する目的がないからです。</p></li><li><p>これらの引用は、神の啓示の<strong>すべて</strong>が聖書に書き記されており、それゆえ聖伝は捨ててよいということを示してはいません。聖伝を捨てることは、聖書に反する行為です（<a href="https://bibleox.com/ja/jp-ni/2sol/2/#L15">２テサ. 2:15</a>）。</p></li></ul><p>引用されるどの言葉も、「聖書のみ」という概念の「のみ」という語については、まったく何も語っていません。それらはすべて、神の啓示がどのような形で受けられようと、書かれたものであれ、話されたものであれ、目に見える形で示されたものであれ、その必要性と真実性を指し示しているにすぎません。わたしたちはそれを信じており、ここには「ソラ・スクリプトゥラ」は何もありません。</p><h2>ソラ・スクリプトゥラを説く者たちの手品</h2><p>聞き手に、聖書には高い権威があり、聖書に耳を傾けることは神に耳を傾けることと同じだと示した後、聞き手にはまったく気づかれないうちに、すり替えが起こります。神と聖書の代わりに、説教者が語り始め、聖書を自己流に解釈し始めるのです。そして今や聞き手は、聖書の解釈において互いに矛盾する何千もの団体の一つの創始者である説教者の言葉を、神の言葉として受け入れるよう求められます。</p><p>もちろん、説教者は話の中で聖書を引き合いに出し続け、自分の言葉を一連の引用で裏付けますが、ここでの明らかな問題は、こうしてプロテスタンティズムが、神について、神の働きについて、救いの道について、ありとあらゆる教えを何千も生み出したということです。そのうえ、キリスト教のまさに初めから、教会の外の団体は、まさに聖書を歪めることによって、信仰を歪め、人々を自分たちに従わせようとしてきました。悪魔でさえそうして、まさに聖書によってキリストを誘惑したのです。</p><blockquote><p>「次に、悪魔はイエスを聖なる都に連れて行き、神殿の屋根の端に立たせて、言った。『神の子なら、<strong>飛び降りたらどうだ。「神があなたのために天使たちに命じると、あなたの足が石に打ち当たることのないように、天使たちは手であなたを支える」と書いてある</strong>』」（<a href="https://bibleox.com/ja/jp-ni/mf/4/#L5-6">マタ. 4:5-6</a>）</p></blockquote><p>悪魔はまた、神の言葉を口実にして、最初の人々を堕落に導きました。</p><blockquote><p>「主なる神が造られた野の生き物のうちで、最も賢いのは蛇であった。<strong>蛇は女に言った。『園のどの木からも食べてはいけない、などと神は言われたのか。』</strong>女は蛇に答えた。『わたしたちは園の木の果実を食べてもよいのです。でも、園の中央に生えている木の果実だけは、食べてはいけない、触れてもいけない、死んではいけないから、と神様はおっしゃいました。』<strong>蛇は女に言った。『決して死ぬことはない</strong>。それを食べると、目が開け、神のように善悪を知るものとなることを神はご存じなのだ』」（<a href="https://bibleox.com/ja/jp-ni/gen/3/#L1-5">創. 3:1-5</a>）</p></blockquote><p>このように、悪魔も、教会に敵対する団体の創始者たちも、人々を惑わすためにまさに聖書を用いました。それはどのようにして起こるのでしょうか。聖書についての個人的な解釈に、聖書の権威が与えられることによって起こるのです。</p><h2>ソラ・スクリプトゥラの根本的な問題 — 主観主義</h2><p>このような信仰の組み立て方の根本的な問題は、<strong>聖書についての客観的な理解というものは存在しない</strong>ということです。人はだれでも、自分の積み重ねてきた経験、世界観、関心、好みというプリズムを通して聖書を受け取ります。つまり、<strong>主観的に</strong>受け取るのです。簡単に言えば、問題はこうです。<strong>何が聖書に合致し、何が合致しないかを、だれが決めるのか。</strong>ソラ・スクリプトゥラはこの問いに答えていません。まさにそのために、それは実践では実行できない理論にすぎないのです。そして、これは根拠のない主張ではありません。</p><p>ソラ・スクリプトゥラの最初の使用者たち（宗教改革者たち）は、聖書についての自分たちのそれぞれ異なる理解に基づいて、異なる教えを提唱しました。意見の相違は最も重要な問題に関わるものでした。</p><ul><li><p>救い</p></li><li><p>人々の救いへの予定</p></li><li><p>人間の罪深さ</p></li><li><p>信じる者の生活における機密の役割</p></li><li><p>聖体機密（エウカリスティア）におけるキリストの臨在の実在性</p></li><li><p>幼児に洗礼を授けることができるかどうか</p></li><li><p>信じる者の生活におけるイコンの存在</p></li></ul><p>異なる教えは、ただちに異なる団体を生みました。そしてこれはほんの始まりにすぎません。時がたつにつれて、ソラ・スクリプトゥラの使用者たちの間の意見の相違と分裂の数は急速に増え、いくつかの教えと団体から始まって、500年の間に、信仰のありとあらゆる問題について、最も重要な問題、すなわち神とキリストの位格についてさえ、何万もの分裂と意見の相違に達しました。</p><p>このように、ソラ・スクリプトゥラは、概念としては、実践において人間の付け加えをふるい落とし、聖書の各書の著者たちの信仰に到達することを可能にしませんでした。ソラ・スクリプトゥラは、その支持者たちの声高な主張にもかかわらず、多くの新しい人間の付け加え、すなわち新しい伝統が現れる道を開くだけです。これについてはさらに後で述べます。</p><h2>ソラ・スクリプトゥラは多くの伝統を生み出した</h2><p>宗教改革者たちの表明した意図によれば、ソラ・スクリプトゥラは人間の伝統をふるい落とすはずでした。実際には、プロテスタントの新しい団体の創始者は、一人一人が、また一つの人間の伝統の創始者となりました。自分の信仰に聖書の引用の衣を着せただけです。これは、権威ある言葉や文書が現れて以来（<a href="https://bibleox.com/ja/jp-ni/gen/3/#L1,4-5">創. 3:1,4-5</a>）、宗教改革者たちよりずっと前からさまざまな異端の首領たちがしてきたことです。</p><p>新しい指導者の周りに団体ができ、その団体はこの指導者の信仰以外の何ものも受け取らず、守らず、子孫に伝えませんでした。そしてだれかがこの団体に加わりたいと思えば、その人はこの団体の指導者の信仰を受け入れ、この団体が理解するとおりに聖書を理解しなければなりません。人がバプテストのもとに来れば、バプテストの伝統に従って信仰を受け取ります。ペンテコステ派のもとではペンテコステ派の伝統に従って、アドベンチストのもとではアドベンチストの伝統に従って信仰を受け取り、ほかのすべての団体でも同じです。団体は互いの伝統を断罪し合います。バプテストがアドベンチストの団体で教えることも、ペンテコステ派がバプテストの団体で教えることも許されません。</p><p>その結果、こうした団体はすべて、ソラ・スクリプトゥラから出発して、「聖書のみによって」ではまったくなく、厳格に自分たちの伝統に従って信じなければならないというところに行き着きました。すなわち、かつて自分たちの指導者が言ったとおりに、そして団体が伝統として守り、口頭の説教と教師たちの書物によって先祖から子孫へと知識を伝えてきたとおりにです。ただ、これを伝統と呼ぶ習慣がないだけであり、まして「人間の伝統」とは呼びません。この名前は、脅し文句として、教会の聖伝にだけ与えるのが習わしになっています。</p><h2>信仰の源としての団体の指導者</h2><p>もし聖書が何か自己完結した信仰の源であるなら、「聖書のみに基づいて」信仰を確立しようと試みた人はだれもが、ソラ・スクリプトゥラのほかの使用者たちと同じ信仰を持つことになるでしょう。しかし、彼らは皆異なる信仰に行き着きました。つまり、信仰の源も異なるということです。その源とは、団体を創設した<strong>人間</strong>です。その人が信仰を考え出し、自分の追随者たちに伝え、追随者たちは自分たちの指導者の信仰を守っています。</p><h2>事実上、プロテスタントの団体で第一の位置を占めているのは、聖書ではなく自分たちの伝統である</h2><p>こうした団体ではすべて、第一の位置を与えられているのはまさに自分たちの伝統であり、聖書は補助的な道具としてだけ使われ、そこから伝統を正当化するのに役立つ引用が選ばれます。そのような共同体の一つで受けた信仰が実際には聖書にまさり、聖書の本文は、聞き手の周りにシャボン玉を作るため、すなわち、ここでは人々は聖書のみに従って信じているという、気をそらす錯覚を作るためにだけ使われます。その間に聞き手の頭には、説教を通して、まさに彼が身を置いた共同体の伝統が植え付けられていくのです。</p><p>聖書が伝統と矛盾するなら、聖書は簡単に無視されます。たとえば、聖書のどこにも幼児に洗礼を授けてはならないとは書かれておらず、むしろ洗礼の予型（割礼）はまさに幼児に施されていました（<a href="https://bibleox.com/ja/jp-ni/gen/17/#L10-12">創. 17:10-12</a>）。それなのに多くのプロテスタントは、聖書からの間接的な理由を挙げて、幼児洗礼の禁止を主張しています。聖書は、幼児が洗礼なしに救われるとは言っておらず、むしろ救い主は、水と霊とによって生まれなければ、だれも天の国を見ることも、そこに入ることもできないと言われました（<a href="https://bibleox.com/ja/jp-ni/in/3/#L3,5-6">ヨハ. 3:3,5-6</a>）。また旧約においても、洗礼の予型なしには、人は民から断たれなければなりませんでした（<a href="https://bibleox.com/ja/jp-ni/gen/17/#L14">創. 17:14</a>）。ところが多くのプロテスタントは、またしても聖書から間接的な引用を挙げようとしながら、しかしそれ以上に、そのことについての自分たちの推論に頼って、幼児は洗礼なしに救われると教えています。</p><p>自分たちの伝統の中にだけあるものへの信仰を守りながら、彼らは、按手による神品の恵みの伝達についての教会の教えを非難し、按手<strong>によって</strong>神の賜物が伝えられるという、きわめて直接的な言葉（<a href="https://bibleox.com/ja/jp-ni/2tim/1/#L6">２テモ. 1:6</a>; <a href="https://bibleox.com/ja/jp-ni/act/8/#L18">使. 8:18</a>）を簡単に捨ててしまいます。なぜでしょうか。ただ、彼らの伝統が別の信仰を示しているからです。そして伝統が聖書にまさるので、直接的な聖書の本文は捨てられます。この団体でかつて教えられた以外のことを信じてはならないからです。実際はそうなのですが、それをそのような言葉で語ることは許されません。伝統という言葉を使ってはならず（この言葉は教会を攻撃するためにだけ使われます）、ここではまさにこの団体の創始者の信仰だけが伝えられていると公然と言ってはならないのです。</p><h2>不誠実な対比</h2><p>ソラ・スクリプトゥラの支持者たちが作った団体では、次のような対比が広まっています。教会は聖書を捨てて聖伝のみに従って信じているが、プロテスタントの団体はどれも、逆に聖伝を捨てて聖書のみに従って信じている、というものです。</p><p>実際には、</p><ul><li><p>教会は聖伝のみに従って信じているのではなく、聖伝と等しく聖書を用いています。</p></li><li><p>プロテスタントの団体も聖書のみに従って信じているのではなく、自分たちの指導者の信仰だけを正しいと認め、それを伝統として守っています。</p></li></ul><p>このように、ソラ・スクリプトゥラは実践においては存在しません。それは理論の中にだけ存在します。この概念をだれかが具体的に実行すれば、必然的に、また一つの新しい信仰、聖書の新しい理解、新しい団体、そしてその結果として新しい伝統が現れることになります。</p><p>これを証明するのはまったく難しくありません。実験をしてみれば十分です。もしある人がこうした団体の一つに来て、団体が自分たちの知識をその人に伝えず、ただ聖書を手渡すだけなら、その人は聖書だけを読んで、100％この団体の信仰には行き着かないでしょう。その人が彼らの信仰に行き着くのは、ただ一つの場合、すなわち団体がその人に自分たちの信仰を伝える場合だけです。</p><p>正教会は、その教えのすべてを聖書によって裏付けています。しかし、プロテスタントの団体は、聖書についての<strong>教会の理解</strong>に同意せず、その代わりに（黙って）「聖書のみ」ではなく、<strong>自分たちの理解と信仰</strong>を差し出しているのです。</p><h2>ソラ・スクリプトゥラは聖書と真っ向から衝突する</h2><p>ソラ・スクリプトゥラに対する正教会の異論は、「聖書」という語にではなく、「のみ」という語に関わるものです。そしてその異論は、聖書そのものに基づいています。</p><ol><li><p><strong>「ソラ・スクリプトゥラ」は聖書の中にない</strong>。聖書そのものには、聖書のみに基づいて信仰を組み立てよとか、聖書のみを優先せよという要求はありません。だからこそプロテスタントは、聖書の大切さについての引用だけを挙げる（聖伝の大切さについての引用には口を閉ざす）のです。聖書の中には、ソラ・スクリプトゥラについての引用がそもそもないからです。</p></li><li><p><strong>むしろ聖書は、口頭の聖伝を守るよう言っている</strong>。聖伝を守るよう繰り返し求められています。書かれたものだけでなく、使徒たちの口頭の宣教もです（<a href="https://bibleox.com/ja/ja/w/Tr4n_聖伝/">引用</a>）。そして使徒たちは、口頭の宣教を第一の位置に置いています（<a href="https://bibleox.com/ja/jp-ni/2sol/2/#L15">２テサ. 2:15</a>）。</p></li><li><p><strong>聖書は、教会の教師たちから学ぶよう求めている。</strong>神は教会に司祭と教師を立てられ（<a href="https://bibleox.com/ja/jp-ni/1kor/12/#L28">１コリ. 12:28</a>; <a href="https://bibleox.com/ja/jp-ni/ef/4/#L11">エフェ. 4:11</a>）、彼らに教会の群れを導き教えることを委ねられました。ソラ・スクリプトゥラの支持者たちは、教会から学ぶことを拒みます。教会の中で弟子になることを望まず、この人々は自分で自分を教師と称したのです（<a href="https://bibleox.com/ja/jp-ni/2tim/4/#L3">２テモ. 4:3</a>）。</p></li><li><p><strong>聖書は誤って解釈されうる</strong>。聖書は、教会によって堅く立てられていない人々が、聖書を自分の滅びとなるように解釈すると指摘しています（<a href="https://bibleox.com/ja/jp-ni/2pet/3/#L15-16">２ペト. 3:15-16</a>）。ソラ・スクリプトゥラの支持者たちは、教会から学ぶつもりさえありません。教師を退け、教科書だけを取って、彼らは聖書を思いつくままに解釈し、その結果、異なる信仰と教科書（聖書）についての異なる理解を持つ、分裂した膨大な数の団体が存在するに至りました。そして聖書は、教会による教えなしに聖書を自分で解釈することは、聖書の曲解と滅びに至ると言っています（<a href="https://bibleox.com/ja/jp-ni/2pet/3/#L15-16">２ペト. 3:15-16</a>）。</p></li></ol><p>このように、ソラ・スクリプトゥラの支持者たちは、次の点で聖書に反して行動しています。</p><ol><li><p><strong>聖書にないことを教えている</strong>。聖書には「ソラ・スクリプトゥラ」の教えはありません。</p></li><li><p><strong>使徒たちの口頭の聖伝を退けている</strong>。聖書のみが第一の意味を持つと言い、聖書に書かれた使徒たちの言葉に反して行動しています。使徒たちはその中で聖伝を守るよう求め、まず口頭の宣教を、その次に書かれたものを第一の位置に置いているのです（<a href="https://bibleox.com/ja/jp-ni/2sol/2/#L15">２テサ. 2:15</a>）。</p></li><li><p><strong>教会の教導職を退けている</strong>。神によって立てられた教会の教師たちを、聖書に真っ向から反して退けています（<a href="https://bibleox.com/ja/jp-ni/1kor/12/#L28">１コリ. 12:28</a>; <a href="https://bibleox.com/ja/jp-ni/ef/4/#L11">エフェ. 4:11</a>）。</p></li><li><p><strong>教会によって堅く立てられずに聖書を解釈している</strong>。プロテスタントの団体はそれぞれ自分の聖書理解を持ち、団体の各共同体も、さらには共同体の中でも、自分の好きなように聖書を理解することができます。ソラ・スクリプトゥラは、（読む者が理解した）聖書以外のあらゆる教えの源の最高の権威を退けるよう促すからです。ある人が聖書の別の理解を気に入れば、それが真実と見なされることになります。聖書は、たとえプロテスタントの説教者のものであっても、説教者の言葉より上にあるからです。</p></li></ol><h2>ソラ・スクリプトゥラという考えが誤っていることの主要な証拠</h2><p>もしソラ・スクリプトゥラを考え出した目的が、キリスト教世界をできるだけ強く分裂させることであったなら、この考えはきわめて効果的であることがわかりました。しかし、もしそれを考え出した目的が使徒たちの信仰を探し求めることであったなら、ソラ・スクリプトゥラは誤った考えとなりました。それは目的から遠ざけ、多くの伝統と分裂を生み出しただけでした。</p><p>ソラ・スクリプトゥラが誤っていることの主要な証拠は、ソラ・スクリプトゥラの使用者たち自身です。「聖書のみ」という標語のもとに考え出された教えを持つ、互いに矛盾し合う数えきれない団体です。「ソラ・スクリプトゥラ」ほど、キリストを信じる者たちの間に多くの分裂を生み出した考えはほかにありません。そしてそれは、聖書に真っ向から反して行われたのです（<a href="https://bibleox.com/ja/jp-ni/in/17/#L20-21">ヨハ. 17:20-21</a>; <a href="https://bibleox.com/ja/jp-ni/1kor/1/#L10">１コリ. 1:10</a>; <a href="https://bibleox.com/ja/jp-ni/1in/2/#L18-19">１ヨハ. 2:18-19</a>）。</p><blockquote><p>「また、彼らのためだけでなく、彼らの言葉によってわたしを信じる人々のためにも、お願いします。父よ、あなたがわたしの内におられ、わたしがあなたの内にいるように、<strong>すべての人を一つにしてください</strong>。彼らもわたしたちの内にいるようにしてください。<strong>そうすれば、世は</strong>、あなたがわたしをお遣わしになったことを、<strong>信じるようになります</strong>」（<a href="https://bibleox.com/ja/jp-ni/in/17/#L20-21">ヨハ. 17:20-21</a>）</p></blockquote><blockquote><p>「さて、兄弟たち、わたしたちの主イエス・キリストの名によってあなたがたに勧告します。<strong>皆、勝手なことを言わず、仲たがいせず</strong>、心を一つにし思いを一つにして、固く結び合いなさい」（<a href="https://bibleox.com/ja/jp-ni/1kor/1/#L10">１コリ. 1:10</a>）</p></blockquote><blockquote><p>「子供たちよ、終わりの時が来ています。反キリストが来ると、あなたがたがかねて聞いていたとおり、今や多くの反キリストが現れています。これによって、終わりの時が来ていると分かります。彼らはわたしたちから去って行きましたが、もともと仲間ではなかったのです。<strong>仲間なら、わたしたちのもとにとどまっていたでしょう。しかし去って行き</strong>、だれもわたしたちの仲間ではないことが明らかになりました」（<a href="https://bibleox.com/ja/jp-ni/1in/2/#L18-19">１ヨハ. 2:18-19</a>）</p></blockquote><hr><p>16世紀に、宗教改革者ルターがソラ・スクリプトゥラという概念を提唱しました。その後、宗教改革者はそれぞれ、彼らの主張によれば「聖書のみ」（聖書についての自分の理解）に最高の権威を与えて、信仰を組み立て始めました。聖書のみに基づいて信仰を組み立てれば、使徒たちの信仰に行き着くはずだと考えられていました。こうして、まさにこの方法、そしてこの方法だけが、人を使徒たちの信仰に行き着かせると宣言されたのです。しかし結局、その意図に反して、宗教改革者たちは皆、異なる信仰に行き着きました。</p><p>最初、「ソラ・スクリプトゥラ」の方法は、聖書について異なる理解を持つ三つの流れを生みました。ルター派、カルヴァン派、聖公会です。その後この概念は、地球上のどんな人にも、自分の教えを持つ自分の団体を作ることを可能にしました。聖書を手に取りさえすれば十分なのです。こうして、それぞれが自分の信仰と自分の聖書理解を持つ、いわゆる教派が何千も現れました。この過程は今日まで続いています。信仰の違いのために、<strong>ただの人として</strong>歩み（<a href="https://bibleox.com/ja/jp-ni/1kor/3/#L3">１コリ. 3:3</a>）、彼らは皆互いに分かれ、皆が異なる<strong>信仰</strong>、異なる<strong>洗礼</strong>、異なる<strong>神観</strong>を持っています。これはすべて、教会においてあるべき姿に反しています。</p><blockquote><p>「体は一つ、霊は一つです。それは、あなたがたが、一つの希望にあずかるようにと招かれているのと同じです。<strong><mark>主</mark>は一人、<mark>信仰</mark>は一つ、<mark>洗礼</mark>は一つ</strong>」（<a href="https://bibleox.com/ja/jp-ni/ef/4/#L4-5">エフェ. 4:4-5</a>）</p></blockquote><p>神への異なる信仰について、だれもがイエスを信じていると反論する人もいるでしょう。しかし、だれもが神としてのキリストへの使徒的信仰を持っているわけではありません。本性において一つで位格において三つの神、すなわち父と子と聖霊への信仰を否定する、ユニテリアンのプロテスタントも少なくありません。そのうえ、多くの団体は、神について、その御心について、神に喜ばれる方法について、異なる考えを持っています。たとえば、ペンテコステ派やカリスマ派は、自分たちの支離滅裂なつぶやきや床に倒れることが神に喜ばれ、それがすべて聖霊、すなわち神の働きであると信じています。同時に、ほかの団体は、このペンテコステ派の神観を退け、その代わりに自分たちの考えを差し出しています。こうして彼らは神について異なる考えを持ち、時には神について異なる教えを持っているのです。</p><p>聖書を手にして互いに矛盾し合い、「聖書のみによって」また一つの信仰を組み立てたと主張する数えきれない人々こそ、ソラ・スクリプトゥラに対する最も明白な論拠です。「聖書のみ」によって、人々は一つの使徒的信仰への道、「人間の付け加え」から信仰を解放する道を約束されましたが、実際にはこの方法は、人間の付け加えを大量に生み出し、信じる者の一致を望む神の御心に反して（<a href="https://bibleox.com/ja/jp-ni/in/17/#L20-21">ヨハ. 17:20-21</a>; <a href="https://bibleox.com/ja/jp-ni/1kor/1/#L10">１コリ. 1:10</a>; <a href="https://bibleox.com/ja/jp-ni/1in/2/#L18-19">１ヨハ. 2:18-19</a>）、キリスト教世界に数えきれない分裂以外の何ものも与えませんでした。</p><blockquote><p>「また、彼らのためだけでなく、彼らの言葉によってわたしを信じる人々のためにも、お願いします。父よ、あなたがわたしの内におられ、わたしがあなたの内にいるように、すべての人を一つにしてください。<strong><mark>彼らもわたしたちの内にいるようにしてください</mark>。そうすれば、世は</strong>、あなたがわたしをお遣わしになったことを、<strong>信じるようになります</strong>」（<a href="https://bibleox.com/ja/jp-ni/in/17/#L20-21">ヨハ. 17:20-21</a>）</p></blockquote><blockquote><p>「さて、兄弟たち、わたしたちの主イエス・キリストの名によってあなたがたに<strong><mark>勧告します</mark></strong>。<strong><mark>皆、勝手なことを言わず</mark>、<mark>仲たがいせず</mark></strong>、<strong><mark>心を一つにし思いを一つにして</mark>、固く結び合いなさい</strong>」（<a href="https://bibleox.com/ja/jp-ni/1kor/1/#L10">１コリ. 1:10</a>）</p></blockquote><h3>旧約における並行例[3]</h3><p>同じような分裂が、旧約でバベルの町と塔の建設のときに起こりました（<a href="https://bibleox.com/ja/jp-ni/gen/11/#L1-9">創. 11:1-9</a>）。人々は自分たちの力で天まで届く町と塔を建てようと決めましたが（<a href="https://bibleox.com/ja/jp-ni/gen/11/#L4">創. 11:4</a>）、異なる言葉を話すようになり（<a href="https://bibleox.com/ja/jp-ni/gen/11/#L7">創. 11:7</a>）、分かれて散らされました（<a href="https://bibleox.com/ja/jp-ni/gen/11/#L8">創. 11:8</a>）。今もそれと同じです。</p><p>神は教会を造り、聖霊を永遠に教会に遣わし（<a href="https://bibleox.com/ja/jp-ni/in/14/#L16">ヨハ. 14:16</a>）、御自身いつも教会と共にいると約束し（<a href="https://bibleox.com/ja/jp-ni/mf/28/#L20">マタ. 28:20</a>）、教えを口頭で伝え、司祭たち（<a href="https://bibleox.com/ja/jp-ni/act/20/#L17-18,28">使. 20:17-18,28</a>）と教師たち（<a href="https://bibleox.com/ja/jp-ni/1kor/12/#L28">１コリ. 12:28</a>）を立てられました。彼らは口頭で教えましたが、手紙のやり取りもしました。</p><p>十五世紀以上たってから人々がやって来て、教会が保ってきた一部の使徒たち（全員ではない）の手紙だけを教会から取り、まさにこの手紙に反して、打ち負かされることのない教会（<a href="https://bibleox.com/ja/jp-ni/mf/16/#L18">マタ. 16:18</a>）、すなわち神が据えられた<strong>土台</strong>を捨て、使徒たちから受けて教会の中で守られてきた信仰、使徒たちの聖伝（<a href="https://bibleox.com/ja/jp-ni/2sol/2/#L15">２テサ. 2:15</a> その他の<a href="https://bibleox.com/ja/ja/w/Tr4n_聖伝/">箇所</a>）を捨て、神によって立てられた司祭たち（<a href="https://bibleox.com/ja/jp-ni/act/20/#L17-18,28">使. 20:17-18,28</a>）と教師たち（<a href="https://bibleox.com/ja/jp-ni/1kor/12/#L28">１コリ. 12:28</a>）を捨て、神が創設された教会とは別に、独自に、自分の知恵と力によって（歴史学、考古学、言語学などの研究によって）自分の町を建てようと決めました。ほかの建築者たちも彼らに加わります。結局、彼らは異なる言葉を話すようになり、分かれて散らされ、それぞれ自分の言葉で交わる自分の集落を建て始め、<em>「神が設計者であり建設者である堅固な<strong>土台</strong>を持つ都」</em>（<a href="https://bibleox.com/ja/jp-ni/evr/11/#L10">ヘブ. 11:10</a>）に住むことを望まないのです。</p><h2>「聖書のみ」は「のみ」思考に導く</h2><p>「のみ」という語を含む多くの公理を持つプロテスタントの教えは、しばしばその支持者たちを、短く「のみ」思考と呼べるような考え方に導きます。それは彼らの多くに、本文の中の自分の気に入った個々の部分にだけ注意を向けさせ、都合のよい箇所に「のみ」という語を思い描かせます。あたかも自分に「この言葉だけを考慮しなければならない」と言い聞かせて、その上に何かの構築物を建てるかのようです。本文の著者が一つの主題のさまざまな側面を、順々に、あるいは著作の別々の箇所で論じているとき、プロテスタントはしばしば一つのことだけを選び、それを絶対化します。</p><ul><li><p>たとえば、使徒たちは救いのために信仰と行いの両方が必要であると書いています。「のみ」思考は、ここで信仰についての本文の断片を選び、「のみ」という語を差し込ませます。</p></li><li><p>使徒たちは聖書と聖伝の両方が必要であると書いています。「のみ」思考は、ここで聖書の大切さについての本文の断片を選び、「のみ」という語を差し込ませます。</p></li></ul><p>古代の著述家たちの本文を研究する際にも、この考え方はほとんどあらゆることに現れます。</p><ul><li><p>たとえば、聖体機密を説明するとき、著者たちは二つの説明（文字どおりの説明と象徴的な説明）をしますが、プロテスタントは象徴的な説明だけを見ようとし、これらの著者を自分たちの「のみ」の教えの支持者に仕立てようとします。</p></li></ul><p>多くの異端がこの原理によって生まれました。イエス・キリストが人であることは、ただ人にすぎないということを意味するでしょうか。いいえ、この方は神でもあります。では、神であるなら、ただ神にすぎないということでしょうか。いいえ、この方は人でもあります。キリストが父の像であるなら、ただの像（単なる絵）にすぎないということでしょうか。いいえ、この方はまことの神であり、まことの人でもあります。どれほど多くの人がこれにつまずいてきたことか、そして今もつまずいていることか。ここでも同じです。象徴的な説明は文字どおりの説明を退けず、文字どおりの説明は象徴的な説明を退けません。</p><p>正教徒は、聖書と聖伝の両方、信仰と行いの両方の必要性を認め、聖体機密の文字どおりの理解を認めながら、さらに象徴的な意味をも認めることに、何の妨げもありません。多くのプロテスタントは、同じ著者たちのほかの言葉をただ無視して、至るところで「のみ」という語を主張しています。</p><h2>エルサレムの使徒会議と聖書</h2><p>教会が「聖書のみ」の原理によって生きていなかったことの最も明白な証拠の一つは、使徒たちが主宰したエルサレムでの最初の教会会議の出来事です。</p><p>エルサレム会議では、聖書の指示なしに、モーセの律法が廃止されます。割礼、汚れた食物の禁止、安息日の休み、死者に触れることの禁止、異邦人との交わりの禁止などです。この決定は、教会が集まって協議した上で下されました（<a href="https://bibleox.com/ja/jp-ni/act/15/#L22">使. 15:22</a>）。それは聖書なしに行われました。教会の中には聖書の著者である聖霊が生きておられるからです。それゆえ、<strong>会議の決定は「聖書にそう書いてあるからである」という句ではなく</strong>、聖霊と教会の意志を示すことによって確証されています。「<strong><mark>聖霊とわたしたちは、次のことに決めました</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/act/15/#L28-29">使. 15:28-29</a>）。</p><p>つまり、モーセの律法の廃止は、聖霊と教会の決定なのです。これに反対したのは、ファリサイ派から信者になったキリスト者たちでした（<a href="https://bibleox.com/ja/jp-ni/act/15/#L5">使. 15:5</a>）。彼らの側には、聖書のいくつかの明白な言葉がありました（<a href="https://bibleox.com/ja/jp-ni/gen/17/#L14">創. 17:14</a>）。しかし使徒たちの側にあったのは、まさに教会の権威でした。書かれているとおり、彼らは教会全体と共に協議し（<a href="https://bibleox.com/ja/jp-ni/act/15/#L22">使. 15:22</a>）、それから共通の決定を宣言したからです。聖書なしに、ただ自分たちの言葉によって、彼らは聖書に従って律法を守るよう求めた者たちに、律法の廃止を示したのです。</p><p>聖書は、割礼を受けなければならず、割礼を受けない者は民から断たれると言っています（<a href="https://bibleox.com/ja/jp-ni/gen/17/#L14">創. 17:14</a>）。しかし使徒たちは、それを教えるよう指示を与えませんでした。</p><blockquote><p><em>「聞くところによると、わたしたちのうちのある者がそちらへ行き、</em><strong><em><mark>わたしたちから何の指示もないのに</mark></em></strong><em>、いろいろなことを言って、あなたがたを騒がせ動揺させたとのことです」（</em><a href="https://bibleox.com/ja/jp-ni/act/15/#L24"><em>使. 15:24</em></a><em>）</em></p></blockquote><p><em>（ビザンティン本文（多数派写本）ではこの節に、彼らが「<strong>割礼を受け、律法を守れ</strong>」（λέγοντες περιτέμνεσθαι καὶ τηρεῖν τὸν νόμον）と言っていたことが明記されています。新共同訳が底本とする校訂本文には、この言葉はありません。）</em></p><p>しかし、それはやはり聖書に書かれているのです。どのような根拠によって、それを教えてはならないのでしょうか。どの聖書に基づいて、割礼を受けなくてよいと決められたのでしょうか。どの聖書が豚肉を食べることを許したのでしょうか。それは聖書によってではなく、真理を確立する教会全体（<a href="https://bibleox.com/ja/jp-ni/1tim/3/#L15">１テモ. 3:15</a>）の会議の決定によって行われたのです。</p><p>それ以来、エルサレム会議の決定は教会の聖伝となりました。</p><blockquote><p><em>「彼らは方々の町を巡回して、エルサレムの使徒と長老たちが決めた規定を守るようにと、人々に</em><strong><em><mark>伝えた</mark></em></strong><em>」</em><em>（ギリシア語 παρεδίδοσαν —「手渡した、伝えた」。παράδοσις「伝承（聖伝）」と同じ語根）</em><em>（</em><a href="https://bibleox.com/ja/jp-ni/act/16/#L4"><em>使. 16:4</em></a><em>）</em></p></blockquote><hr><p>エルサレムの使徒会議の議長である使徒ヤコブは、演説の中で預言者アモスの言葉を思い起こします。この預言には割礼についての言葉はありません。</p><blockquote><p><em>「その日にはわたしはダビデの倒れた仮庵を復興しその破れを修復し、廃虚を復興して昔の日のように建て直す。こうして、エドムの生き残りの者とわが名をもって呼ばれるすべての国を彼らに所有させよう、と主は言われる。主はこのことを行われる」（</em><a href="https://bibleox.com/ja/jp-ni/am/9/#L11-12"><em>アモ. 9:11-12</em></a><em>）</em></p></blockquote><p>もしこれに基づいてエルサレム会議でなされたことが受け入れられるなら（聖書へのある暗黙の言及と聖霊への言及）、エルサレムの会議だけでなく、正教会のすべての全地公会もまた当然受け入れられるべきです。聖霊は、エルサレム会議のためだけでなく、永遠に教会に遣わされているからです。</p><blockquote><p><em>「わたしは父にお願いしよう。父は別の弁護者を遣わして、</em><strong><em><mark>永遠に</mark>あなたがたと一緒にいるようにしてくださる</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/in/14/#L16"><em>ヨハ. 14:16</em></a><em>）</em></p></blockquote><p>そしてキリスト御自身も、いつも教会と共にいると約束されました。</p><blockquote><p><em>「わたしは</em><strong><em>世の終わりまで、<mark>いつも</mark></em></strong><em>あなたがたと共にいる」（</em><a href="https://bibleox.com/ja/jp-ni/mf/28/#L20"><em>マタ. 28:20</em></a><em>）</em></p></blockquote><p>イコンの崇敬を擁護した第七全地公会を含め、すべての公会では、聖書からはるかに重みのある根拠が示されました。聖霊は今も教会の中におられます。このような論拠に従って、すべての公会が受け入れられなければなりません。</p><h2>教会の教導職</h2><h3>群れは司祭たちに委ねられ、彼らはその監督者である</h3><blockquote><p><em>「教会の長老たちを呼び寄せた。長老たちが集まって来たとき、パウロはこう話した。&lt;…&gt;『どうか、あなたがた自身と群れ全体とに気を配ってください。聖霊は、神が御子の血によって御自分のものとなさった</em><strong><em><mark>神の教会の世話をさせるために</mark></em></strong><em>、</em><strong><em><mark>あなたがたをこの群れの監督者に任命なさったのです</mark></em></strong><em>』」（ギリシア語 ἐπισκόπους —「主教たち」）（</em><a href="https://bibleox.com/ja/jp-ni/act/20/#L17-18,28"><em>使. 20:17-18,28</em></a><em>）</em></p></blockquote><h3>神は教会に教師を立てられた。すべての人が教師なのではない</h3><blockquote><p>「そして、<strong>［キリストは］ある人を使徒、ある人を預言者、ある人を福音宣教者、ある人を牧者、<mark>教師</mark>とされたのです</strong>。こうして、聖なる者たちは奉仕の業に適した者とされ、キリストの体を造り上げてゆき」（<a href="https://bibleox.com/ja/jp-ni/ef/4/#L11-12">エフェ. 4:11-12</a>）</p></blockquote><blockquote><p>「<strong><mark>神は、教会の中にいろいろな人をお立てになりました</mark></strong>。第一に使徒、第二に預言者、第三に<strong><mark>教師</mark></strong>、&lt;…&gt; 皆が使徒であろうか。皆が預言者であろうか。<strong><mark>皆が教師であろうか</mark></strong>。皆が奇跡を行う者であろうか」（<a href="https://bibleox.com/ja/jp-ni/1kor/12/#L28-29">１コリ. 12:28-29</a>）</p></blockquote><h3>教会によって堅く立てられていない人々は、聖書を自分の滅びとなるように解釈する</h3><blockquote><p>「それは、わたしたちの愛する兄弟パウロが、神から授かった知恵に基づいて、あなたがたに書き送ったことでもあります。<strong>彼は、どの手紙の中でもこのことについて述べています。その手紙には難しく理解しにくい個所があって、<mark>無学な人や心の定まらない人は、それを聖書のほかの部分と同様に曲解し、自分の滅びを招いています</mark></strong>」<em>（「心の定まらない」は、ギリシア語 ἀστήρικτοι —「堅く立てられていない、固められていない」）</em>（<a href="https://bibleox.com/ja/jp-ni/2pet/3/#L15-16">２ペト. 3:15-16</a>）</p></blockquote><h2>聖書は誤って解釈されうる</h2><blockquote><p>「それは、わたしたちの愛する兄弟パウロが、神から授かった知恵に基づいて、あなたがたに書き送ったことでもあります。<strong>彼は、どの手紙の中でもこのことについて述べています。その手紙には難しく理解しにくい個所があって、<mark>無学な人や心の定まらない人は、それを聖書のほかの部分と同様に曲解し、自分の滅びを招いています</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/2pet/3/#L15-16">２ペト. 3:15-16</a>）</p></blockquote><p>さらに詳しく：<a href="https://bibleox.com/ja/ja/w/Ip7w_聖書の解釈/">聖書の解釈</a></p><blockquote><p>もしこのような当惑と空虚な言葉が無知から出ているのなら、聖書が彼らに教えるであろう。<strong><mark>異端の作り主である悪魔</mark></strong>は、悪につきまとう悪臭のゆえに、<strong><mark>自分自身の毒をも地に蒔き、純朴な者たちを惑わすための外套として、聖書の言葉を借りる</mark></strong>。こうして彼はエバを欺き、こうして以前の異端を作り上げ、こうして<strong><mark>今の時にアリウスを説き伏せて、以前の異端に反対して語っているように見せかけさせ、自分の異端を人目につかないように持ち込ませた</mark></strong>のである。&lt;…&gt; いったいだれが、かつてこのような教えを聞いたことがあるだろうか。また、<strong>この異端の擁護者や雇われ人たちは、それをどこから、だれから得たのか。学校にいたとき、だれが彼らにこのように解き明かしたのか</strong>。&lt;…&gt; しかし、彼ら自身が今初めてそれを聞いたと認めるのなら、どうしてこの異端が外から来たもので、<strong>わたしたちの父祖からのものではない</strong>ことを否定できようか。しかし、父祖からのものではなく、今日になって明るみに出たものは、祝福されたパウロ（１テモ. 4:1-2; テト. 1:14）が予告したもの、すなわち「終わりの時には、ある人々は健全な信仰から離れ、惑わす霊と悪霊の教えに心を奪われ、偽りを語る者の偽善によって、良心に焼き印を押され、真理から背を向ける」というもの以外の何であろうか。</p></blockquote><p>（<a href="https://bibleox.com/en/en/w/athanasius-four-discourses-against-the-arians-1/">アタナシオス、『アリウス派駁論』第1巻、8</a>、英語。英訳からの訳）</p><h2>聖伝とは何か</h2><p>聖伝とは父なる神の啓示です。父はそれを独り子を通して使徒たちに伝え、使徒たちは教会に伝え、教会はそれを信仰として、言葉（話し言葉と書き言葉）と行いによって、代々伝えていきます。</p><blockquote><p><em>「なぜなら、</em><strong><em>わたしはあなたから<mark>受けた</mark>言葉を彼らに<mark>伝え</mark>、彼らはそれを受け入れて</em></strong><em>、わたしがみもとから出て来たことを本当に知り、あなたがわたしをお遣わしになったことを信じたからです」（</em><a href="https://bibleox.com/ja/jp-ni/in/17/#L8"><em>ヨハ. 17:8</em></a><em>）</em></p></blockquote><blockquote><p><em>「</em><strong><em>あなたがたが、何かにつけわたしを思い出し、わたしがあなたがたに伝えたとおりに、伝えられた<mark>教え</mark>を守っている</em></strong><em>のは、立派だと思います」（</em><a href="https://bibleox.com/ja/jp-ni/1kor/11/#L2"><em>１コリ. 11:2</em></a><em>）（「伝えられた教え」は、ギリシア語原文では παραδόσεις —「伝承（聖伝）」）</em></p></blockquote><h2>聖伝を守り、それに従って教えよという命令</h2><blockquote><p><em>「ですから、兄弟たち、</em><strong><em><mark>しっかり立って</mark></em></strong><em>、わたしたちが</em><strong><em>説教</em></strong><em>や</em><strong><em>手紙</em></strong><em>で伝えた</em><strong><em><mark>教えを固く守り続けなさい</mark></em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/2sol/2/#L15"><em>２テサ. 2:15</em></a><em>）（「教え」は、ギリシア語原文では τὰς παραδόσεις —「伝承（聖伝）」）</em></p></blockquote><blockquote><p><em>「あなたがたが、何かにつけわたしを思い出し、</em><strong><em><mark>わたしがあなたがたに伝えたとおりに、伝えられた教えを守っている</mark></em></strong><em>のは、立派だと思います」（</em><a href="https://bibleox.com/ja/jp-ni/1kor/11/#L2"><em>１コリ. 11:2</em></a><em>）</em></p></blockquote><blockquote><p><em>「兄弟たち、わたしがあなたがたに告げ知らせた福音を、ここでもう一度知らせます。これは、あなたがたが受け入れ、生活のよりどころとしている福音にほかなりません。</em><strong><em><mark>どんな言葉でわたしが福音を告げ知らせたか、しっかり覚えていれば、あなたがたはこの福音によって救われます</mark></em></strong><em>。さもないと、あなたがたが信じたこと自体が、無駄になってしまうでしょう」（</em><a href="https://bibleox.com/ja/jp-ni/1kor/15/#L1-2"><em>１コリ. 15:1-2</em></a><em>）</em></p></blockquote><blockquote><p><em>「そして、多くの証人の面前で</em><strong><em><mark>わたしから聞いたこと</mark></em></strong><em>を、ほかの人々にも教えることのできる</em><strong><em>忠実な人たちに<mark>ゆだねなさい</mark></em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/2tim/2/#L2"><em>２テモ. 2:2</em></a><em>）</em></p></blockquote><blockquote><p><em>「さて、兄弟たち、主イエスに結ばれた者としてわたしたちは更に願い、また</em><strong><em><mark>勧めます</mark></em></strong><em>。</em><strong><em>あなたがたは、神に喜ばれるために<mark>どのように歩むべきかを、わたしたちから学びました</mark></em></strong><em>。そして、現にそのように歩んでいますが、どうか、</em><strong><em><mark>その歩みを今後も更に続けてください</mark></em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/1sol/4/#L1"><em>１テサ. 4:1</em></a><em>）</em></p></blockquote><blockquote><p><em>「愛する人たち、わたしたちが共にあずかる救いについて書き送りたいと、ひたすら願っておりました。あなたがたに手紙を書いて、</em><strong><em><mark>聖なる者たちに一度伝えられた信仰のために戦うこと</mark></em></strong><em>を、勧めなければならないと思ったからです」（</em><a href="https://bibleox.com/ja/jp-ni/iud/1/#L3"><em>ユダ. 1:3</em></a><em>）</em></p></blockquote><blockquote><p><em>「</em><strong><em><mark>教えに適う信頼すべき言葉をしっかり守る人</mark></em></strong><em>でなければなりません。そうでないと、健全な教えに従って勧めたり、反対者の主張を論破したりすることもできないでしょう。実は、</em><strong><em>不従順な者、無益な話をする者、人を惑わす者が多いのです</em></strong><em>。特に割礼を受けている人たちの中に、そういう者がいます。その者たちを沈黙させねばなりません。彼らは恥ずべき利益を得るために、教えてはならないことを教え、数々の家庭を覆しています」（</em><a href="https://bibleox.com/ja/jp-ni/tit/1/#L9-11"><em>テト. 1:9-11</em></a><em>）</em></p></blockquote><blockquote><p><em>「ただ、エバが蛇の悪だくみで欺かれたように、あなたがたの思いが汚されて、キリストに対する真心と純潔とからそれてしまうのではないかと心配しています。なぜなら、あなたがたは、だれかがやって来て</em><strong><em><mark>わたしたちが宣べ伝えたのとは異なったイエスを宣べ伝えても</mark></em></strong><em>、あるいは、自分たちが受けたことのない違った霊や、</em><strong><em><mark>受け入れたことのない違った福音</mark></em></strong><em>を受けることになっても、よく我慢しているからです。&lt;…&gt; こういう者たちは偽使徒、ずる賢い働き手であって、キリストの使徒を装っているのです。だが、驚くには当たりません。サタンでさえ光の天使を装うのです。だから、サタンに仕える者たちが、義に仕える者を装うことなど、大したことではありません。彼らは、自分たちの業に応じた最期を遂げるでしょう」（</em><a href="https://bibleox.com/ja/jp-ni/2kor/11/#L3-4,13-15"><em>２コリ. 11:3-4,13-15</em></a><em>）</em></p></blockquote><blockquote><p><em>「マケドニア州に出発するときに頼んでおいたように、あなたはエフェソにとどまって、ある人々に命じなさい。</em><strong><em><mark>異なる教えを説いたり</mark></em></strong><em>、作り話や切りのない系図に心を奪われたりしないようにと。このような作り話や系図は、信仰による神の救いの計画の実現よりも、むしろ無意味な詮索を引き起こします」（</em><a href="https://bibleox.com/ja/jp-ni/1tim/1/#L3-4"><em>１テモ. 1:3-4</em></a><em>）</em></p></blockquote><h2>聖伝は書かれた文書だけでなく、聞いた言葉でもある</h2><blockquote><p><em>「このようなわけで、わたしたちは絶えず神に感謝しています。なぜなら、</em><strong><em>わたしたちから神の言葉を<mark>聞いた</mark>（！）とき</em></strong><em>、あなたがたは、それを人の言葉としてではなく、神の言葉として受け入れたからです。事実、それは神の言葉であり、また、信じているあなたがたの中に現に働いているものです」（</em><a href="https://bibleox.com/ja/jp-ni/1sol/2/#L13"><em>１テサ. 2:13</em></a><em>）</em></p></blockquote><blockquote><p><em>「キリスト・イエスによって与えられる信仰と愛をもって、</em><strong><em>わたしから<mark>聞いた</mark>（！）健全な言葉を手本としなさい</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/2tim/1/#L13"><em>２テモ. 1:13</em></a><em>）</em></p></blockquote><blockquote><p><em>「そして、多くの証人の面前で</em><strong><em>わたしから<mark>聞いた</mark>（！）こと</em></strong><em>を、ほかの人々にも教えることのできる</em><strong><em>忠実な人たちにゆだねなさい</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/2tim/2/#L2"><em>２テモ. 2:2</em></a><em>）</em></p></blockquote><blockquote><p><em>「ですから、兄弟たち、</em><strong><em>しっかり立って</em></strong><em>、わたしたちが</em><strong><em><mark>説教</mark>（！）</em></strong><em>や</em><strong><em>手紙</em></strong><em>で伝えた</em><strong><em>教えを固く守り続けなさい</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/2sol/2/#L15"><em>２テサ. 2:15</em></a><em>）</em></p></blockquote><blockquote><p><em>「</em><strong><em>初めから聞いていたこと</em></strong><em>を、心にとどめなさい。</em><strong><em>初めから<mark>聞いていた</mark>（！）ことが、あなたがたの内にいつもあるならば、あなたがたも御子の内に、また御父の内にいつもいるでしょう</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/1in/2/#L24"><em>１ヨハ. 2:24</em></a><em>）</em></p></blockquote><blockquote><p><em>「あなたがたが、</em><strong><em>何かにつけわたしを<mark>思い出し</mark>（！）</em></strong><em>、わたしがあなたがたに伝えたとおりに、伝えられた教えを守っているのは、立派だと思います」（</em><a href="https://bibleox.com/ja/jp-ni/1kor/11/#L2"><em>１コリ. 11:2</em></a><em>）</em></p></blockquote><blockquote><p><em>「だから、</em><strong><em>どのように受け、また<mark>聞いた</mark>（！）か思い起こして、それを守り抜き</em></strong><em>、かつ悔い改めよ。もし、目を覚ましていないなら、わたしは盗人のように行くであろう。わたしがいつあなたのところへ行くか、あなたには決して分からない」（</em><a href="https://bibleox.com/ja/jp-ni/otkr/3/#L3"><em>黙. 3:3</em></a><em>）</em></p></blockquote><h2>聖伝の必要性</h2><h3>聖書は、イエス・キリストについてのすべての情報の源ではない</h3><blockquote><p><em>「このほかにも、イエスは弟子たちの前で、多くのしるしをなさったが、それは</em><strong><em>この書物に書かれていない</em></strong><em>。これらのことが書かれたのは、あなたがたが、イエスは神の子メシアであると信じるためであり、また、信じてイエスの名により命を受けるためである」（</em><a href="https://bibleox.com/ja/jp-ni/in/20/#L30-31"><em>ヨハ. 20:30-31</em></a><em>）</em></p></blockquote><blockquote><p><em>「</em><strong><em>イエスのなさったことは、このほかにも、まだたくさんある</em></strong><em>。わたしは思う。その一つ一つを書くならば、世界もその書かれた書物を収めきれないであろう」（</em><a href="https://bibleox.com/ja/jp-ni/in/21/#L25"><em>ヨハ. 21:25</em></a><em>）</em></p></blockquote><h3>按手についての教えは聖書に記されていない</h3><p>どの書簡にも、正しく洗礼を授ける方法や、輔祭、司祭、主教を叙聖する方法についての教えはありません。</p><blockquote><p><em>「だからわたしたちは、死んだ行いの悔い改め、神への信仰、</em><strong><em>種々の洗礼についての教え、手を置く儀式</em></strong><em>、死者の復活、永遠の審判などの</em><strong><em>基本的な教えを学び直すようなことはせず</em></strong><em>、キリストの教えの初歩を離れて、成熟を目指して進みましょう」（</em><a href="https://bibleox.com/ja/jp-ni/evr/6/#L1-2"><em>ヘブ. 6:1-2</em></a><em>）</em></p></blockquote><h3>使徒たちは口頭での交わりを好んだ</h3><blockquote><p><em>「あなたがたに書くことはまだいろいろありますが、</em><strong><em>紙とインクで書こうとは思いません</em></strong><em>。わたしたちの喜びが満ちあふれるように、あなたがたのところに行って親しく話し合いたいものです」（</em><a href="https://bibleox.com/ja/jp-ni/2in/1/#L12"><em>２ヨハ. 1:12</em></a><em>）</em></p></blockquote><blockquote><p><em>「</em><strong><em>あなたに書くことはまだいろいろありますが、インクとペンで書こうとは思いません</em></strong><em>。それよりも、</em><strong><em>近いうちにお目にかかって親しく話し合いたいものです</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/3in/1/#L13-14"><em>３ヨハ. 1:13-14</em></a><em>）</em></p></blockquote><h3>口頭の宣教も書かれた宣教も守らなければならない</h3><p>使徒パウロは、書簡によってだけでなく言葉によって受けた聖伝（使徒たちの教え）を守るよう求めています。</p><blockquote><p><em>「ですから、兄弟たち、しっかり立って、わたしたちが</em><strong><em>説教</em></strong><em>や</em><strong><em>手紙</em></strong><em>で</em><strong><em>伝えた</em></strong><em>教えを固く守り続けなさい」（</em><a href="https://bibleox.com/ja/jp-ni/2sol/2/#L15"><em>２テサ. 2:15</em></a><em>）</em></p></blockquote><blockquote><p><em>「そして、多くの証人の面前で</em><strong><em>わたしから聞いたこと</em></strong><em>を、ほかの人々にも教えることのできる</em><strong><em>忠実な人たちにゆだねなさい</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/2tim/2/#L2"><em>２テモ. 2:2</em></a><em>）</em></p></blockquote><h3>使徒たちの口頭の宣教の長さ</h3><h4>3年</h4><p>使徒パウロは、アジアの司祭たちを三年間、夜も昼も教えました。</p><blockquote><p><em>「だから、わたしが</em><strong><em><mark>三年間</mark>、あなたがた一人一人に夜も昼も涙を流して教えてきた</em></strong><em>ことを思い起こして、目を覚ましていなさい」（</em><a href="https://bibleox.com/ja/jp-ni/act/20/#L31"><em>使. 20:31</em></a><em>）</em></p></blockquote><h4>1年半</h4><p>一年半、コリントの共同体を教えました。</p><blockquote><p><em>「その後、パウロはアテネを去ってコリントへ行った。&lt;…&gt; パウロは</em><strong><em><mark>一年六か月</mark>の間ここにとどまって、人々に神の言葉を教えた</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/act/18/#L1,11"><em>使. 18:1,11</em></a><em>）</em></p></blockquote><h4>2年3か月</h4><p>エフェソでは、まず三か月間会堂で、その後二年間、講堂で弟子たちと共に宣教しました。</p><blockquote><p><em>「パウロは会堂に入って、</em><strong><em>三か月間</em></strong><em>、神の国のことについて大胆に論じ、人々を説得しようとした。しかしある者たちが、かたくなで信じようとはせず、会衆の前でこの道を非難したので、パウロは彼らから離れ、</em><strong><em>弟子たちをも退かせ、ティラノという人の講堂で毎日論じていた</em></strong><em>。</em><strong><em>このようなことが<mark>二年</mark>も続いたので</em></strong><em>、アジア州に住む者は、ユダヤ人であれギリシア人であれ、だれもが主の言葉を聞くことになった」（</em><a href="https://bibleox.com/ja/jp-ni/act/19/#L8-10"><em>使. 19:8-10</em></a><em>）</em></p></blockquote><p>全体で、使徒パウロ一人だけでも、少なくとも30年間宣教しました。紀元33〜34年の回心から、紀元64〜67年の死までです。</p><h2>使徒たちは聖伝を用いた</h2><p>使徒は、聖書には名が記されていない二人のエジプトの魔術師の名を挙げています。</p><blockquote><p><em>「</em><strong><em>ヤンネとヤンブレ</em></strong><em>がモーセに逆らったように、彼らも真理に逆らっています。彼らは精神の腐った人間で、信仰の失格者です」（</em><a href="https://bibleox.com/ja/jp-ni/2tim/3/#L8"><em>２テモ. 3:8</em></a><em>）</em></p></blockquote><p>使徒ユダは、聖書にない論争について語っています。</p><blockquote><p><em>「大天使ミカエルは、</em><strong><em>モーセの遺体のことで悪魔と言い争ったとき</em></strong><em>、あえてののしって相手を裁こうとはせず、『主がお前を懲らしめてくださるように』と言いました」（</em><a href="https://bibleox.com/ja/jp-ni/iud/1/#L9"><em>ユダ. 1:9</em></a><em>）</em></p></blockquote><p>聖書にないエノクの言葉について：</p><blockquote><p><em>「アダムから数えて七代目に当たる</em><strong><em>エノク</em></strong><em>も、彼らについてこう</em><strong><em>預言しました</em></strong><em>。『見よ、主は数知れない聖なる者たちを引き連れて来られる』」（</em><a href="https://bibleox.com/ja/jp-ni/iud/1/#L14"><em>ユダ. 1:14</em></a><em>）</em></p></blockquote><p>使徒パウロは、木のうろに隠れた後でのこぎりで引かれた預言者イザヤについて語っています。</p><blockquote><p>「彼らは石で打ち殺され、<strong>のこぎりで引かれ</strong>、剣で切り殺され、羊の皮や山羊の皮を着て放浪し、暮らしに事欠き、苦しめられ、虐待され」（<a href="https://bibleox.com/ja/jp-ni/evr/11/#L37">ヘブ. 11:37</a>）</p></blockquote><p>福音記者ルカは、目撃者たちから聞いた言葉に基づいて福音書を書き記します。つまり、伝承を書き記すのです。</p><blockquote><p><em>「わたしたちの間で実現した事柄について、</em><strong><em>最初から目撃して</em></strong><em>御言葉のために働いた人々が</em><strong><em>わたしたちに伝えたとおりに</em></strong><em>、物語を書き連ねようと、多くの人々が既に手を着けています。そこで、敬愛するテオフィロさま、わたしもすべての事を初めから詳しく調べていますので、順序正しく書いてあなたに献呈するのがよいと思いました」（</em><a href="https://bibleox.com/ja/jp-ni/lk/1/#L1-3"><em>ルカ. 1:1-3</em></a><em>）</em></p></blockquote><h3>使徒たちは、福音書にない事柄を伝えている</h3><p>使徒パウロは、エフェソの牧者たちとの話の中で、福音書にない救い主キリストの教えを示しています。</p><blockquote><p><em>「あなたがたもこのように働いて弱い者を助けるように、また、</em><strong><em>主イエス御自身が『受けるよりは与える方が幸いである』と言われた</em></strong><em>言葉を思い出すようにと、わたしはいつも身をもって示してきました」（</em><a href="https://bibleox.com/ja/jp-ni/act/20/#L35"><em>使. 20:35</em></a><em>）</em></p></blockquote><p>また、復活したキリストが大勢の人々に現れたことを伝えていますが、これも福音書には書かれていません。</p><blockquote><p><em>「次いで、</em><strong><em>五百人以上もの兄弟たちに同時に現れました</em></strong><em>。そのうちの何人かは既に眠りについたにしろ、大部分は今なお生き残っています。次いで、ヤコブに現れ、その後すべての使徒に現れ」（</em><a href="https://bibleox.com/ja/jp-ni/1kor/15/#L6-7"><em>１コリ. 15:6-7</em></a><em>）</em></p></blockquote><h2>聖伝の大切さ</h2><p>誤った教えは神に導きません。</p><blockquote><p><em>「だれであろうと、</em><strong><em>キリストの教えを越えて、これにとどまらない者は、神に結ばれていません</em></strong><em>。その教えにとどまっている人にこそ、御父も御子もおられます」（</em><a href="https://bibleox.com/ja/jp-ni/2in/1/#L9"><em>２ヨハ. 1:9</em></a><em>）</em></p></blockquote><p>異端（偽りの教え）は神の国を受け継ぎません。</p><blockquote><p><em>「</em><strong><em>仲間争い</em></strong><em>（ギリシア語 αἱρέσεις —「異端」）&lt;…&gt; 以前言っておいたように、ここでも前もって言いますが、このようなことを行う者は、</em><strong><em>神の国を受け継ぐことはできません</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/gal/5/#L20-21"><em>ガラ. 5:20-21</em></a><em>）</em></p></blockquote><h2>新しい教えを持ち込む者たちから離れよ</h2><blockquote><p><em>「</em><strong><em>分裂を引き起こす人</em></strong><em>（ギリシア語 αἱρετικὸν ἄνθρωπον —「異端の人」）には一、二度訓戒し、従わなければ、かかわりを持たないようにしなさい」（</em><a href="https://bibleox.com/ja/jp-ni/tit/3/#L10"><em>テト. 3:10</em></a><em>）</em></p></blockquote><blockquote><p><em>「</em><strong><em>異なる教えを説き</em></strong><em>、わたしたちの主イエス・キリストの健全な言葉にも、信心に基づく教えにも従わない者がいれば、</em><strong><em>その者は高慢で、何も分からず、議論や口論に病みつきになっています</em></strong><em>。そこから、ねたみ、争い、中傷、邪推、絶え間ない言い争いが生じるのです。&lt;…&gt;」（</em><a href="https://bibleox.com/ja/jp-ni/1tim/6/#L3-5"><em>１テモ. 6:3-5</em></a><em>）（ビザンティン本文（多数派写本）では、5節は「</em><strong><em>このような人々から<mark>離れなさい</mark></em></strong><em>」という言葉で終わります。）</em></p></blockquote><blockquote><p><em>「テモテ、</em><strong><em>あなたにゆだねられているものを守り</em></strong><em>、</em><strong><em>俗悪な無駄話と、不当にも知識と呼ばれている反対論とを<mark>避けなさい</mark></em></strong><em>。その知識を鼻にかけ、信仰の道を踏み外してしまった者もいます。恵みがあなたがたと共にあるように」（</em><a href="https://bibleox.com/ja/jp-ni/1tim/6/#L20-21"><em>１テモ. 6:20-21</em></a><em>）</em></p></blockquote><blockquote><p><em>「兄弟たち、わたしたちは、わたしたちの主イエス・キリストの名によって命じます。怠惰な生活をして、</em><strong><em>わたしたちから受けた教えに従わないでいる</em></strong><em></em><strong><em>すべての兄弟を<mark>避けなさい</mark></em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/2sol/3/#L6"><em>２テサ. 3:6</em></a><em>）</em></p></blockquote><blockquote><p><em>「兄弟たち、あなたがたに勧めます。</em><strong><em>あなたがたの学んだ教えに反して、不和やつまずきをもたらす人々を警戒しなさい。彼らから<mark>遠ざかりなさい</mark></em></strong><em>。こういう人々は、わたしたちの主であるキリストに仕えないで、自分の腹に仕えている。そして、うまい言葉やへつらいの言葉によって純朴な人々の心を欺いているのです」（</em><a href="https://bibleox.com/ja/jp-ni/rim/16/#L17-18"><em>ロマ. 16:17-18</em></a><em>）</em></p></blockquote><blockquote><p><em>「</em><strong><em>この教えを携えずにあなたがたのところに来る者は、家に<mark>入れてはなりません</mark></em></strong><em>。挨拶してもなりません。そのような者に挨拶する人は、その悪い行いに加わるのです」（</em><a href="https://bibleox.com/ja/jp-ni/2in/1/#L10-11"><em>２ヨハ. 1:10-11</em></a><em>）</em></p></blockquote><blockquote><p><em>「しかし、たとえわたしたち自身であれ、天使であれ、</em><strong><em>わたしたちがあなたがたに告げ知らせたものに反する福音を告げ知らせようとするならば、呪われるがよい</em></strong><em>。わたしたちが前にも言っておいたように、今また、わたしは繰り返して言います。</em><strong><em>あなたがたが受けたものに反する福音を告げ知らせる者がいれば、<mark>呪われるがよい</mark></em></strong><em>（ギリシア語 ἀνάθεμα ἔστω —「アナテマであれ」）」（</em><a href="https://bibleox.com/ja/jp-ni/gal/1/#L8-9"><em>ガラ. 1:8-9</em></a><em>）</em></p></blockquote><p><strong>アナテマ</strong>（ギリシア語 ἀνάθεμα）— 教会からの破門。</p><h2>聖人を敬い、聖人に倣う必要</h2><blockquote><p><em>「あなたがたに神の言葉を語った</em><strong><em>指導者たちのことを、<mark>思い出しなさい</mark></em></strong><em>。彼らの生涯の終わりをしっかり見て、</em><strong><em><mark>その信仰を見倣いなさい</mark></em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/evr/13/#L7"><em>ヘブ. 13:7</em></a><em>）</em></p></blockquote><blockquote><p><em>「そこで、あなたがたに勧めます。</em><strong><em>わたしに<mark>倣う者</mark>になりなさい</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/1kor/4/#L16"><em>１コリ. 4:16</em></a><em>）</em></p></blockquote><blockquote><p><em>「</em><strong><em><mark>兄弟たち、皆一緒にわたしに倣う者となりなさい</mark>。また、あなたがたと同じように、<mark>わたしたちを模範として歩んでいる人々に目を向けなさい</mark></em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/fil/3/#L17"><em>フィリ. 3:17</em></a><em>）</em></p></blockquote><p>聖人の崇敬について、さらに詳しく：<a href="https://bibleox.com/ru/ru/w/%D0%BF%D0%BE%D1%87%D0%B8%D1%82%D0%B0%D0%BD%D0%B8%D0%B5-%D1%81%D0%B2%D1%8F%D1%82%D1%8B%D1%85-%D0%B2-%D0%91%D0%B8%D0%B1%D0%BB%D0%B8%D0%B8">聖書における聖人の崇敬</a></p><h2>反論への応答</h2><h3>「教えと証しの書に」（イザ. 8:20）</h3><p>ソラ・スクリプトゥラを擁護するために、旧約聖書の次の言葉が引用されます。</p><blockquote><p>「<strong>人々は必ずあなたたちに言う。『ささやきつぶやく口寄せや、霊媒に伺いを立てよ</strong>。民は、命ある者のために、死者によって、自分の神に伺いを立てるべきではないか』と。<strong>そして、教えと証しの書についてはなおのこと、『このような言葉にまじないの力はない』と言うであろう</strong>」（<a href="https://bibleox.com/ja/jp-ni/is/8/#L19-20">イザ. 8:19-20</a>）[4]</p></blockquote><p><em>（新共同訳は20節を、口寄せに頼る人々が律法を軽んじる言葉として訳しています。この論拠に用いられるのは、英語の欽定訳や日本語の口語訳などに見られる別の訳で、ヘブライ語本文に近づけて訳せば「<strong>律法と証しに（尋ねよ）。もし彼らがこの言葉に従って語らないなら、彼らには夜明けがない</strong>」となります。以下はこの訳に基づく論拠への応答です。）</em></p><ol><li><p>ここでは、聖伝に対する聖書の優越については何も語られていません。言うまでもなく、<strong>魔術師と聖書の間では聖書を選ぶべきです</strong>。この箇所が語っているのは、モーセ五書（トーラー）と啓示（預言者の言葉）を、そもそも民の間にいてはならない魔術師や口寄せの言葉と比べることです（<a href="https://bibleox.com/ja/jp-ni/vtor/18/#L9-14">申. 18:9-14</a>）。預言者イザヤは、トーラーと預言の言葉を、魔術師たちを明るみに出すための外的な手段として用いるよう提案し、魔術師たちの言うことと神の言われることとの違いを民に示しているのです。</p></li></ol><ol start="2"><li><p>そのうえ、旧約の時代には、聖書は原理的に聖伝から切り離すことができませんでした。聖伝なしには、聖書を正しく理解することはおろか、正しく読むことさえできませんでした。子音だけで書かれていたからです（<a href="https://bibleox.com/ja/ja/w/Lx7s_福音記者は七十人訳聖書を参照した/">詳しく</a>）。読み方を知らなければ、同じ語をさまざまに読むことができます。語を正しく読むためには、読み方の<strong>伝統</strong>の中にいなければならず、それは聖伝として先祖から子孫へと伝えられてきました。それゆえ、聖書についてのどんな言葉も、聖伝から切り離すことはできないのです。</p></li><li><p>反対者たちには、彼ら自身の命題を思い出させるべきです。「ソラ・スクリプトゥラ」は「ソラ」（のみ）という語、すなわち聖書のみが最高の権威であるということを主張します。しかし、引用された言葉には、聖書の権威のそのような排他性も、「聖書<strong>のみ</strong>」の支持者たちが見たいと思っている「のみ」という語（あるいはそれに類するもの）もありません。聖伝が直接言及されていないという理由だけでここにそれを付け加えるのなら、一貫して、ほかの同様の引用は聖書が言及されていないのだから聖伝のみに基づいて信仰を組み立てるよう提案している、と認めるべきです。</p></li></ol><blockquote><p>「キリスト・イエスによって与えられる信仰と愛をもって、<strong>わたしから<mark>聞いた</mark>健全な言葉を手本としなさい</strong>」（<a href="https://bibleox.com/ja/jp-ni/2tim/1/#L13">２テモ. 1:13</a>）</p></blockquote><blockquote><p><em>「そして、多くの証人の面前で</em><strong><em>わたしから<mark>聞いた</mark>こと</em></strong><em>を、ほかの人々にも教えることのできる</em><strong><em><mark>忠実な人たちにゆだねなさい</mark></em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/2tim/2/#L2"><em>２テモ. 2:2</em></a><em>）</em></p></blockquote><p>聞いた聖伝に従うことは、正しいことと誤ったことを見分けることを可能にするだけでなく、それよりはるかに大きなこと、すなわち神の内にとどまることを可能にします。</p><blockquote><p><em>「</em><strong><em>初めから<mark>聞いていた</mark>ことを、心にとどめなさい</em></strong><em>。</em><strong><em>初めから<mark>聞いていた</mark>ことが、あなたがたの内にいつもあるならば、あなたがたも御子の内に、また御父の内にいつもいるでしょう</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/1in/2/#L24"><em>１ヨハ. 2:24</em></a><em>）</em></p></blockquote><p>主イエス・キリスト御自身も、新約聖書のほとんどすべてがすでに書かれていたときに、聞いたことを守るよう呼びかけておられます。</p><blockquote><p><em>「だから、</em><strong><em>どのように受け、また<mark>聞いた</mark>か思い起こして、それを守り抜き</em></strong><em>、かつ悔い改めよ。もし、目を覚ましていないなら、わたしは盗人のように行くであろう。わたしがいつあなたのところへ行くか、あなたには決して分からない」（</em><a href="https://bibleox.com/ja/jp-ni/otkr/3/#L3"><em>黙. 3:3</em></a><em>）</em></p></blockquote><p>これは、主と使徒たちが「聖伝のみ」を教えているということを意味するでしょうか。まさにこの聖書を書きながら、ここでは聖書に触れることさえなく、聖伝に従うよう求めているのですから。</p><p>これらの節だけを取れば、教会の反対者たちは、まったく同じようにして反対の極端、すなわち「聖伝のみ」という命題を考え出すこともできたでしょう。しかし彼らは使徒たちの聖伝を受けておらず、使徒たちから十五世紀（以上）後に現れ、聖伝を擁護する目的もないので、聖伝についてそのような極端を引き出すことはしません。一方教会は、使徒たちから聖伝と聖書の両方を受けたので、どちらも退けず、また口頭の聖伝を守れという使徒たちの戒めも退けず、聖書と聖伝の両方を等しく真実と見なしているのです。</p><h3>「書かれているもの以上に出ない」（１コリ. 4:6）</h3><blockquote><p>「兄弟たち、あなたがたのためを思い、わたし自身とアポロとに当てはめて、このように述べてきました。それは、<strong>あなたがたがわたしたちの例から</strong>、<strong>『書かれているもの以上に出ない』ことを学ぶためであり</strong>、だれも、一人を持ち上げてほかの一人をないがしろにし、高ぶることがないようにするためです」（<a href="https://bibleox.com/ja/jp-ni/1kor/4/#L6">１コリ. 4:6</a>）</p></blockquote><p>ここで語られているのはある書かれた本文であり、それに基づいて、互いに高ぶってはならないことを理解しなければなりません。どの本文のことでしょうか。同じこの手紙の前の章です。そこでは自分を低く見ることの教えが説かれていました。使徒は、今書いたばかりのこと以上に考えないで、<strong>自分たちの例から、互いに高ぶらないことを学ぶ</strong>よう提案しているのです。</p><p>この手紙は、コリントの共同体に起こった分裂のために書かれました。第2章全体を通して、使徒は自分とアポロの意義を小さくし、キリストを高めました。コリントでパウロにつく者とアポロにつく者とに分かれること（<a href="https://bibleox.com/ja/jp-ni/1kor/3/#L4-7">１コリ. 3:4-7</a>）、教会が党派に分かれることを防ぐためです。分かれようとしていた人々は、教えにおいて異なっていたのではなく（そうであれば、使徒は教えについて語ったでしょう）、互いに対する態度において異なっていました。彼らは教会の教師の名によって分かれました。あたかも教会の中のだれもが、同じ教師のもとで学んだ者とだけ交わり、教会のほかの教師たちの弟子を退けるべきであるかのようにです。この誤った考え方を正すために、使徒は、分裂の名となった名前の意義を小さくしました。すなわち、自分とアポロを低くし、キリストを高めたのです。</p><p>少し後で、使徒は述べてきたことをまとめて、同じことを別の言葉で語り、もはや書かれたものではなく、自分自身に倣うよう呼びかけています。</p><blockquote><p>「<strong><mark>そこで</mark>、あなたがたに勧めます。<mark>わたしに倣う者になりなさい</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/1kor/4/#L16-17">１コリ. 4:16-17</a>）</p></blockquote><p>このように、この引用は、キリスト者が<strong>書かれた使徒の模範を越えて<u>自分自身について</u>考えない</strong>こと、そして自分を低く見るようにという呼びかけに従って、互いに高ぶらず、分かれないことについて語っているのです。</p><h3>使徒や天使であっても、ほかのことを教えるなら聞いてはならないのか</h3><p>ソラ・スクリプトゥラの支持者たちからは、使徒は自分の手紙を自分自身よりも、さらには神の天使よりも上に置いている、という論拠を聞くことがあります。彼らは次の言葉を引き合いに出します。</p><blockquote><p><em>「しかし、</em><strong><em>たとえわたしたち自身であれ、天使であれ</em></strong><em>、わたしたちがあなたがたに告げ知らせたものに</em><strong><em>反する福音を告げ知らせようとするならば、呪われるがよい</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/gal/1/#L8"><em>ガラ. 1:8</em></a><em>）</em></p></blockquote><p>使徒はここで自分自身について語っているのではなく、使徒たちの名を装って共同体に送られた偽の手紙のことを考えています。</p><blockquote><p>「霊や言葉によって、あるいは、<strong>わたしたちから書き送られたという手紙によって</strong>、主の日は既に来てしまったかのように言う者がいても、<strong>すぐに動揺して分別を無くしたり</strong>、慌てふためいたりしないでほしい。だれがどのような手段を用いても、だまされてはいけません。なぜなら、まず、神に対する反逆が起こり、不法の者、つまり、滅びの子が出現しなければならないからです」（<a href="https://bibleox.com/ja/jp-ni/2sol/2/#L2-3">２テサ. 2:2-3</a>）</p></blockquote><p>また使徒は、天使の言葉で語っていると偽り、あたかも天使から預言しているかのように見せかける人々の啓示に耳を傾けないよう教えています。</p><p>手紙が使徒からのものではなく、啓示が天使からのものではないことは、どうすれば見分けられるでしょうか。そこでは別の信仰が伝えられているのです。使徒たちがかつて伝えた信仰ではありません。もちろん使徒は、神が使徒たちに与えられた権威を取り去ろうとしているのではありません。直前の箇所、そして実は手紙全体が、ガラテヤの人々をユダヤ教へと誘惑していた教師たちに対して書かれているのです。</p><blockquote><p>「ああ、物分かりの悪い<strong>ガラテヤの人たち、だれがあなたがたを惑わしたのか</strong>。目の前に、イエス・キリストが十字架につけられた姿ではっきり示されたではないか」（<a href="https://bibleox.com/ja/jp-ni/gal/3/#L1">ガラ. 3:1</a>）</p></blockquote><blockquote><p>「<strong>あなたがたのために苦労したのは、無駄になったのではなかったかと</strong>、あなたがたのことが<strong>心配です</strong>」（<a href="https://bibleox.com/ja/jp-ni/gal/4/#L11">ガラ. 4:11</a>）</p></blockquote><blockquote><p>「あなたがたは、よく走っていました。それなのに、<strong>いったいだれが邪魔をして</strong>真理に従わないようにさせたのですか。&lt;…&gt; <strong>あなたがたをかき乱す者たちは、いっそのこと自ら去勢してしまえばよい</strong>」（<a href="https://bibleox.com/ja/jp-ni/gal/5/#L7,12">ガラ. 5:7,12</a>）</p></blockquote><p>使徒の意図は、自分の群れを偽教師たちから守ることであって、自分自身から、ましてや神の天使たちから守ることではありません。聖なる天使たちは、自分たちが仕えている神の教会を真の道から惑わすことはできません。使徒はただ、自分がかつて伝えた信仰を保たなければならず、別のことを教える者は、たとえ使徒を名乗っても、神の天使を装っても、受け入れてはならないということを明らかにしているのです。</p><hr><p>この引用（１コリ. 4:6）には、意味の三つの段階があります。</p><ol><li><p><strong>これらのこと</strong>をわたしは、あなたがたのために、わたし自身とアポロとに<strong>当てはめて述べた</strong>（μετεσχημάτισα）。<strong>それは（ἵνα）、</strong></p></li><li><p><strong>あなたがたがわたしたちの例から</strong>、［一章前に］書かれているもの以上に［自分について］考えないことを<strong>学ぶため</strong>であり、<strong>それは（ἵνα）、</strong></p></li><li><p>だれも、一人を持ち上げてほかの一人に対して<strong>高ぶる</strong>ことがないようにするためである。</p></li></ol><p>使徒は、自分とアポロをほかの兄弟たちの前で高ぶらない者としてどこで描いたのでしょうか。一章前です。</p><blockquote><p>「ある人が『わたしはパウロにつく』と言い、他の人が『わたしはアポロに』などと言っているとすれば、あなたがたは、ただの人にすぎないではありませんか。<strong>アポロとは何者か。また、パウロとは何者か。この二人は</strong>、あなたがたを信仰に導くためにそれぞれ主がお与えになった分に応じて<strong>仕えた者です</strong>。<strong><mark>わたしは植え、アポロは水を注いだ</mark>。しかし、成長させてくださったのは神です。ですから、大切なのは、<mark>植える者でも水を注ぐ者でもなく</mark></strong>、成長させてくださる神です」（<a href="https://bibleox.com/ja/jp-ni/1kor/3/#L4-7">１コリ. 3:4-7</a>）</p></blockquote><p>使徒は別の手紙でも同じように語り、思いを一つにするよう呼びかけています。</p><blockquote><p>「<strong>互いに思いを一つにし</strong>、<strong><mark>高ぶらず</mark></strong>、<strong>身分の低い人々と交わりなさい</strong>。自分を賢い者とうぬぼれてはなりません」（<a href="https://bibleox.com/ja/jp-ni/rim/12/#L16">ロマ. 12:16</a>）</p></blockquote><p>救い主も同じことを教えられました。</p><ul><li><p>「だれでも高ぶる者は低くされ、へりくだる者は高められる」（<a href="https://bibleox.com/ja/jp-ni/mf/23/#L12">マタ. 23:12</a>）</p></li><li><p>「あなたがたの中で偉くなりたい者は、皆に仕える者になり」（<a href="https://bibleox.com/ja/jp-ni/mk/10/#L43">マコ. 10:43</a>）</p></li></ul><p>このように使徒は、前に自分とアポロについて書いたことを指して、ただ謙遜と一致を呼びかけているだけなのです。</p><p>同じこの手紙の中で、使徒はコリントの人々が伝承を守っていることをほめています。</p><blockquote><p><em>「</em><strong><em>あなたがたが、何かにつけわたしを思い出し、<mark>わたしがあなたがたに伝えたとおりに</mark>、伝えられた<mark>教えを守っている</mark></em></strong><em>のは、立派だと思います」（</em><a href="https://bibleox.com/ja/jp-ni/1kor/11/#L2"><em>１コリ. 11:2</em></a><em>）</em></p></blockquote><p>そして、コリントの人々は、教えられたことを告げ知らされたとおりに保ってさえいれば救われると言っています。</p><blockquote><p><em>「兄弟たち、わたしがあなたがたに告げ知らせた福音を、ここでもう一度知らせます。これは、あなたがたが受け入れ、生活のよりどころとしている福音にほかなりません。</em><strong><em><mark>どんな言葉でわたしが福音を告げ知らせたか、しっかり覚えていれば</mark></em></strong><em>、あなたがたはこの福音によって救われます。さもないと、あなたがたが信じたこと自体が、無駄になってしまうでしょう」（</em><a href="https://bibleox.com/ja/jp-ni/1kor/15/#L1-2"><em>１コリ. 15:1-2</em></a><em>）</em></p></blockquote><p>口頭の伝承についてのほかの多くの言葉も、すでに前に挙げました。そのいくつかを引用しましょう。</p><blockquote><p>「キリスト・イエスによって与えられる信仰と愛をもって、<strong>わたしから<u>聞いた</u>健全な言葉を手本としなさい</strong>」（<a href="https://bibleox.com/ja/jp-ni/2tim/1/#L13">２テモ. 1:13</a>）</p></blockquote><blockquote><p><em>「そして、多くの証人の面前で</em><strong><em>わたしから<u>聞いた</u>こと</em></strong><em>を、ほかの人々にも教えることのできる</em><strong><em>忠実な人たちにゆだねなさい</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/2tim/2/#L2"><em>２テモ. 2:2</em></a><em>）</em></p></blockquote><blockquote><p><em>「</em><strong><em>初めから<u>聞いていた</u>ことを、心にとどめなさい</em></strong><em>。</em><strong><em>初めから<u>聞いていた</u>ことが、あなたがたの内にいつもあるならば、あなたがたも御子の内に、また御父の内にいつもいるでしょう</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/1in/2/#L24"><em>１ヨハ. 2:24</em></a><em>）</em></p></blockquote><h2>結論</h2><p>「聖書のみ」という命題を擁護するために、次のような戦術が使われます。ソラ・スクリプトゥラについての明白な引用がないので、聖書の大切さについての引用を示し、<strong>聖伝の大切さについての引用は無視して口を閉ざす</strong>のです。こうして聞き手は、聖書のみが大切であるという印象を受けるはずだというわけです。</p><p>プロテスタントはしばしば正教徒をこう言って非難します。</p><blockquote><p>— イコンを崇敬せよ、聖人に祈れ、などとどこに書いてあるのか、<strong>聖書の中で示してみなさい</strong>。</p></blockquote><p>わたしたちはそれを示しますが、彼らにこう言います。</p><blockquote><p>— 聖伝も大切です。聖書さえそれを裏付けています。</p></blockquote><p>すると彼らは言います。</p><blockquote><p>— いいや、聖書だけが大切だ。</p></blockquote><p>そこでわたしたちは彼らに尋ねます。</p><blockquote><p>— 聖書だけが大切だ、あるいは聖書は聖伝より大切だ、ということを<strong>聖書の中で示してみなさい</strong>。</p></blockquote><p>彼らにはそれを示すことができません。聖書にはそのような言葉がないからです。イコンについて、聖人への祈りについて、そのような言葉を示せとわたしたちに求めながら、すべては聖書のみの中になければならないと言う、まったく同じ種類の言葉を彼らは示すことができません。彼らは自分自身の要求を満たすことができず、二重の基準を示しているのです。</p><p>彼らは自分でこれを考え出し、自分ですべてを聖書の中で示せとわたしたちに求め、そして自分の原理を聖書の中で示すことができないのです。</p><p>このように、「ソラ・スクリプトゥラ」という命題は自己矛盾しており、それを考え出した人々を使徒的信仰に導くことはなく、かえってキリストを信じる人々の間に何千もの新しい信条と分裂を生み出しました。ソラ・スクリプトゥラは手品として人気を得ましたが、それによって、キリストの教会に無縁などんな人も、自分の言葉に神の権威を与え、自分の意見に基づいて別々の団体を集めようとするのです。</p>
