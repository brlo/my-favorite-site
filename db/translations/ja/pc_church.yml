  path: 正教会（ハリストス正教会）
  title: 正教会
  meta_desc: 正教会とは何か：その名称、構造、ペンテコステから今日までの歴史、全地公会議。
  copy_cover: true
  body: <p><strong>正教会</strong>（ギリシャ語 Ἡ Ὀρθόδοξη Ἐκκλησία、英語 Eastern Orthodox Church、日本語 正教会）とは —</p><ol><li><p>最も単純な意味では、正教の仕方でキリストを信じるすべての人々 — 地上に生きている人々、あるいはすでに天においてキリストと共に生きるために移った人々の集まりです。</p></li><li><p>より複雑ですが深い意味では、頭であるキリスト、そしてその体の肢体として、正教の<strong>信仰</strong>、<strong>秘蹟</strong>、<strong>聖統制</strong>によって結ばれた、正しくキリストを信じるすべての人々からなる、神人的な有機体です。</p></li></ol><h2>名称</h2><p>キリストによって建てられた教会は、初めはキリスト教徒の教会とも正教会とも呼ばれませんでした。信者たちがキリスト教徒と呼ばれるようになったのはその後、同じ1世紀のアンティオキアにおいてです（<a href="https://bibleox.com/ja/jp-ni/act/11/#L26">使 11:26</a>）。キリスト教徒たちが自分たちを<a href="https://bibleox.com/ru/ru/w/%D0%BF%D0%BE%D1%87%D0%B5%D0%BC%D1%83-%D1%86%D0%B5%D1%80%D0%BA%D0%BE%D0%B2%D1%8C-%D0%BF%D1%80%D0%B0%D0%B2%D0%BE%D1%81%D0%BB%D0%B0%D0%B2%D0%BD%D0%B0%D1%8F" lang="ru">「正教の（オルトドクス）」</a>と呼ぶようになったのは2世紀のことです[1]。それは教会の信仰を、異質な共同体（グノーシス主義者たちなど）の信仰と区別するためでした。</p><h2>構造</h2><h3>地方教会[3]</h3><ol><li><p><strong>アルバニア正教会</strong>；</p></li><li><p><strong>アレクサンドリア正教会</strong>；</p></li><li><p><strong>アンティオキア正教会</strong>；</p></li><li><p><strong>ブルガリア正教会</strong>；</p></li><li><p><strong>グルジア正教会</strong>；</p></li><li><p><strong>エルサレム正教会</strong>；</p></li><li><p><strong>キプロス正教会</strong>；</p></li><li><p><strong>コンスタンディヌーポリ総主教庁</strong>；</p></li><li><p><strong>マケドニア正教会 — オフリド大司教区</strong>；</p></li><li><p><strong>ポーランド正教会</strong>；</p></li><li><p><strong>アメリカの正教会</strong>；</p></li><li><p><strong>チェコとスロヴァキアの正教会</strong>；</p></li><li><p><strong>ロシア正教会</strong>；</p></li><li><p><strong>ルーマニア正教会</strong>；</p></li><li><p><strong>セルビア正教会</strong>；</p></li><li><p><strong>ギリシャ正教会</strong>。</p></li></ol><h3>自治教会</h3><ol><li><p><strong>中国ハリストス正教会</strong>；</p></li><li><p><strong>フィンランド正教会</strong>；</p></li><li><p><strong>日本ハリストス正教会</strong>。</p></li></ol><h2>歴史</h2><p>正教会は、主の降誕から33年、キリストの復活から50日目、「五旬祭（ペンテコステ）」と呼ばれる日に成立しました。その日、聖神がエルサレムの家に集まっていたキリストの弟子たち（使徒たち）の集会の上に遣わされました。彼らは全世界に福音を宣べ伝えるために必要な超自然的な賜物を受けました。まもなく使徒たちは全世界へ出て行き、教会の共同体を立て、そこに司祭（長老）を叙任しました。こうして正教会は次第に増し、1世紀の終わりにはローマ帝国の領土に匹敵する広がりに達し、その国境をも越えました。</p><h2>1～4世紀 — 迫害の時代</h2><p>正教会はユダヤ教徒たちによる激しい迫害の時代にありましたが、やがて異教の諸宗教の信徒たち、そして当時異教であったローマ帝国の国家機構も迫害に加わりました。</p><h2>4世紀 — 自由の獲得、神学</h2><p>313年、ローマ帝国において<a href="https://bibleox.com/ru/ru/w/%D0%9C%D0%B8%D0%BB%D0%B0%D0%BD%D1%81%D0%BA%D0%B8%D0%B9_%D1%8D%D0%B4%D0%B8%D0%BA%D1%82_%D0%BE_%D1%81%D0%B2%D0%BE%D0%B1%D0%BE%D0%B4%D0%B5_%D1%85%D1%80%D0%B8%D1%81%D1%82%D0%B8%D0%B0%D0%BD%D1%81%D0%BA%D0%BE%D0%B9_%D0%B2%D0%B5%D1%80%D1%8B_313%D0%B3" lang="ru">ミラノ勅令</a>が発布され、キリスト教を含むすべての宗教への寛容が宣言されました。迫害は終わり、迫害の時代に奪われた建物が正教会に返されました。正教の信仰について詳細に著述し、それを擁護し広めた有名な神学者たちが多数現れました。</p><h2>4～8世紀 — 全地公会議の時代</h2><p>自由を得た後、正教会は、生じた偽りの教えに関わる問題を決定し、教会を平和と一致の中に保つために、すべての司教（長老司祭）の会議を開くことができるようになりました。全教会の司教たちによるこのような会議は「全地公会議」と呼ばれるようになり、それは急性の問題を教会会議的に決定する使徒の実践の継続であり（<a href="https://bibleox.com/ja/jp-ni/act/15/#L6-22">使 15:6-22</a>）、それ以前にも小さな地方会議は行われていました。</p><p>すべての全地公会議は、一度伝えられ教会の中に保たれている信仰と真理を歪めようとする企てに対する正教会の答えでした。たとえば教会には、神についての単純な信仰が与えられていました。神は唯一であり、同時に父は神であり、子は神であり、聖神は神であり、この三者の間に交わりがあり、そのうちの一人だけ（神の子）が時のうちに人々を罪と死から救うために処女マリアから生まれ、ご自分の教会を建てられた、という信仰です。教会は素直な心でこの信仰を受け入れ、保っていました。しかし他の教えを提案する人々が立ち上がるたびに — 今は子の神的な尊厳を、今は聖神のそれを否定し、今は子をイエスから切り離して — 教会は信仰と一致を守るために集まり、誤りを指摘しました。</p><p>集まって信仰を擁護するにあたり、教会は誤った信仰を指摘するだけでなく、正しい信仰を説明し、この信仰のこの部分を歪めようとする企てに対する防壁となる定義を与えることを余儀なくされました。この時代の初めの聖なる司教は、このことについて次のように書いています。</p><p><strong>ポワティエの聖ヒラリオス、司教（315～367頃）</strong></p><blockquote><p>“<strong><em>ただ</em>異端者たちの悪意だけが、許されない事を行うこと、届かぬ高みに登ること、言い表せない対象について語ること、禁じられた探究に着手することを、私たちに強いています。<mark>私たちは、真実の信仰をもって命じられたことを行うことで足りるはずでした。すなわち、父である神を礼拝し、父と共に子である神を尊み、聖神に満たされることです。</mark>しかし今や、私たちは言い表せない神秘を説明するために、私たちの弱い言葉を使わざるを得ません。</strong><em>他人の誤りが、敬虔な信仰をもって私たちの魂の奥深くに保つべきである神秘を、人間の言葉で説明する危険な道を、私たち自身に歩ませているのです。</em>”</p></blockquote><p>（<a href="https://azbyka.ru/otechnik/Ilarij_Piktavijskij/o-troitse/" lang="ru">『<u>至聖三者</u>について』2:2</a>）</p><p>おおむね、聖書自体（聖なる書物の確定した目録として）は、この目録を歪めようとする企てに対する教会の答えとして現れました。</p><p><strong>テルトゥリアヌス（155～220頃）</strong></p><blockquote><p>「この<strong>異端（グノーシス主義 — 注）は聖書のいくつかの（書物）を受け入れない</strong>。そして受け入れるものがあれば、全体としては受け入れず、自分の企てに合わせて挿入や省略によってそれらを歪めています」。</p></blockquote><p>（<a href="https://azbyka.ru/otechnik/Tertullian/o_prescript/" lang="ru">『異端者に対する規定』</a>）</p><p>全地公会議の成果を簡単に：</p><h3>第1回全地公会議 — 第1回ニカイア会議、325年、司教318名</h3><ul><li><p><strong>アリオスの譴責</strong>。キリストは神ではなく、神によって造られた特別な被造物だと教えたアリオスの異端の譴責。</p></li><li><p><strong>信経</strong>。信経の最初の7条が定められました。</p></li><li><p><strong>復活祭を祝う時期</strong>。春分の後の満月の後の最初の主日に復活祭を祝うこと。</p></li></ul><h3>第2回全地公会議 — 第1回コンスタンディヌーポリ会議、381年、司教150名</h3><ul><li><p><strong>マケドニオスの譴責。</strong>聖神は神ではなく、父と子の力だと教えたマケドニオスの異端が譴責されました。</p></li><li><p><strong>信経の完成</strong>。信経にさらに5条が加えられました。</p></li></ul><h3>第3回全地公会議 — エフェソ会議、431年、司教160名</h3><ul><li><p><strong>ネストリオスの譴責</strong>。キリストは普通の人間であり、生まれた後に神が神殿のようにその中に入ったと教えたネストリオスの異端が譴責されました。</p></li><li><p><strong>定義</strong>。キリストは真の神にして真の人。処女マリアは生神女（テオトコス）。</p></li><li><p><strong>信経の変更の禁止</strong>。</p></li></ul><h3>第4回全地公会議 — ハルキドン会議、451年、司教520名</h3><ul><li><p><strong>単性論の譴責</strong>。キリストの人間性は完全に神性に呑み込まれ、彼の中には人的なもの抜きに神性だけが残ったと教えたエウテュケスの異端が譴責されました。</p></li><li><p><strong>定義</strong>。神の子の位格の中に二つの性（神性と人性）が結合しました：<strong>混ぜ合わされることなく変化することなく、分かたれることなく離れることなく</strong>。性は一つに融合せず、結合によっていずれの性も変化せず、結合は分離なく永遠に続きます。</p></li></ul><h3>第5回全地公会議 — 第2回コンスタンディヌーポリ会議、553年、司教165名</h3><ul><li><p><strong>オリゲネスの譴責。</strong>地獄の責め苦が有限であり、最終的にはあらゆる人が救われるという偽りの教えを説いたオリゲネスが譴責されました[2]。</p></li><li><p><strong>著作の譴責</strong>:</p><ul><li><p>モプスエスティアのテオドロスのもの（彼自身もネストリオスの教師として譴責された）；</p></li><li><p>エデッサのイバスのもの（ネストリオス主義の疑い）；</p></li><li><p>キュロスのテオドレトスのもの（アレクサンドリアの聖キュリロスの教えへの批判）。</p></li></ul></li></ul><h3>第6回全地公会議 — 第3回コンスタンディヌーポリ会議、680年、司教170名</h3><ul><li><p><strong>単意論の譴責</strong>。キリストには一つの意志（神性の意志のみ）があると教えた異端が譴責されました。</p></li><li><p><strong>定義</strong>。キリストには神として神的な意志があり、人として人的な意志があります。人的な意志は神的な意志に従順です。</p></li></ul><h3>第7回全地公会議 — 第2回ニカイア会議、787年、司教219名と修道士131名</h3><ul><li><p><strong>聖像破壊主義の譴責</strong>。教会の聖像を偶像と見なし、キリストや聖人たちを描くことも、これらの像を敬うことも許さなかった異端が譴責されました。</p></li></ul><h2>10～11世紀 — ローマ地方教会の離反</h2><p>この時期、ローマの正教の司教たちは信仰の教えを変え、新機軸を導入し、他のすべての教会にそれを承認するよう要求しました。</p><p>ローマ教会の主要な誤りの一つは、聖神が父のみならず子からも発出するという教え（フィリオクエ）でした。これは福音書におけるキリストご自身の直接の言葉とも（<a href="https://bibleox.com/ru/ru/w/f18sRKqQ_%D0%92%D0%BE%D0%B7%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D1%8F_%D0%BF%D1%80%D0%BE%D1%82%D0%B8%D0%B2_%D1%84%D0%B8%D0%BB%D0%B8%D0%BE%D0%BA%D0%B2%D0%B5" lang="ru">詳細</a>）、聖教父たちとも矛盾します。この教えはローマ教会自身が、自らの歴史の中でかつて譴責していたものです。しかしこれを出発点として、ローマでは教会についての教えも変えられ、ローマの司教が全世界の全教会の長とされましたが、これは決して過去にあったことではありません。これに加えてカトリックは、処女マリアの無原罪懐胎、煉獄、功徳の宝庫（そこから出てくる免償）、教位（ex cathedra）からの教えにおけるローマ司教の無誤性についての教えを付け加えました。教会は最初の千年間、このようなことを知らず、告白してもいませんでした。これらはすべて新機軸であり、歪曲であり、異端です。</p><p>残りのすべての正教会（エルサレム、アンティオキア、アレクサンドリア、コンスタンディヌーポリ、グルジア教会）は、これらの新機軸を拒否しました。</p><p>アンティオキア教会は対話を通じて、ローマ教会に新機軸を捨てるよう説得しようとしました（<a href="https://bibleox.com/ru/ru/w/VuAM_%D0%9A%D0%BE%D0%BD%D1%82%D0%B5%D0%BA%D1%81%D1%82_%D1%81%D0%BE%D0%B1%D1%8B%D1%82%D0%B8%D0%B9_1054_%D0%B3%D0%BE%D0%B4%D0%B0" lang="ru">詳細</a>）が、結局、その後の数世紀のうちに分裂は最終的な形となって固まりました。その最終段階となったのが、正教のビザンティン帝国の首都コンスタンディヌーポリに対する第4回カトリック十字軍の攻撃でした。決定的となったのはこの攻撃の性格そのものです。すべてのカトリック十字軍は、ローマ司教の発議によって、エルサレムと聖地をイスラームの征服者から解放するために派遣されました。しかし第4回十字軍の組織者たちは、正教のコンスタンディヌーポリとの間に、その領土の通過に関するすでに慣例となっていた取り決めを持ちながら、突如としてその目的をエルサレムからコンスタンディヌーポリそのものへと変更しました。彼らは裏切りのように攻撃し、占領し、住民を殺害し、聖なるものを略奪し、都市の残骸の上にラテン帝国を打ち立てました — そしてエルサレムへは行きませんでした。</p><p>こうしてローマ教会は、正教の全地教会から完全に離反したのです。</p><p>正教会は、住民の言語に応じてさまざまに呼ばれていました。ギリシャ語を話す住民は教会を正教の（ギリシャ語 ορθοδόξω）あるいは普遍の（ギリシャ語 καθολικός）— しかしより多く正教の — と呼びました。ラテン語を話す住民もまた教会を正教の（ラテン語 ortodox）および普遍の（ラテン語 catholic）と呼びましたが、より多く普遍のと呼びました。ギリシャ語の「καθολικός」という言葉は「フ」の音を伴って「カソリコス」と発音されますが、ラテン語に借用された後、そこでは「ト」の音を通して「カトリック」と発音されるようになりました。</p><p>すべての正教の教会から離れた後、ローマ教会はますます「カトリック」という名でのみ知られるようになり、最終的に「ローマ・カトリック教会」あるいは単に「カトリック教会」という名を受け入れました。</p><h2>11～21世紀</h2><p>正教会は徐々に成長し、新しい地方教会が現れました（セルビア、ポーランドなど[3]）。論戦において教会は、主としてローマ・カトリック教会（RCC）の拡張に対抗するという挑戦、そして近年においては、RCCとの対抗の中で西洋に生まれたプロテスタントの共同体の挑戦と向き合うことになりました。</p><p>教会の信仰を歪めようとする企ては決して止みませんでした。プロテスタントの発生は主として教会についての教えの歪曲でしたが、今日のプロテスタントの共同体は、過去のあらゆる異端をいろいろな順序で組み合わせて含んでいます。全体として、異教的な誤りに至るまでの過去すべての世紀の誤りの回帰が、正教会にとって現代の挑戦です。</p>
  references: <p>翻訳：ロディオン・ヴラソフ（AIツールを使用）。</p><ol><li><p><a href="https://bibleox.com/ru/ru/w/%D0%BF%D0%BE%D1%87%D0%B5%D0%BC%D1%83-%D1%86%D0%B5%D1%80%D0%BA%D0%BE%D0%B2%D1%8C-%D0%BF%D1%80%D0%B0%D0%B2%D0%BE%D1%81%D0%BB%D0%B0%D0%B2%D0%BD%D0%B0%D1%8F" lang="ru">教会はなぜ「正教」と呼ばれるようになったか（ロシア語）</a></p></li><li><p><a href="https://azbyka.ru/otechnik/Georgij_Maksimov/pjatyj-vselenskij-sobor-i-osuzhdenie-origenizma/" lang="ru">第5回全地公会議とオリゲネス主義の譴責（ロシア語）</a></p></li><li><p><a href="http://www.patriarchia.ru/db/organizations/30909/" lang="ru">地方教会と自治教会（ロシア語）</a></p></li></ol><h2>関連資料：</h2><ol><li><p>キリストの教会がいつ「正教」と呼ばれるようになったか：<a href="https://bibleox.com/ru/ru/w/%D0%BF%D0%BE%D1%87%D0%B5%D0%BC%D1%83-%D1%86%D0%B5%D1%80%D0%BA%D0%BE%D0%B2%D1%8C-%D0%BF%D1%80%D0%B0%D0%B2%D0%BE%D1%81%D0%BB%D0%B0%D0%B2%D0%BD%D0%B0%D1%8F" lang="ru">（ロシア語）</a></p></li><li><p>公会議の概要：<a href="https://pravoslavie.ru/104647.html" lang="ru">pravoslavie.ru</a></p></li><li><p>地方教会と自治教会：<a href="http://www.patriarchia.ru/db/organizations/30909/" lang="ru">patriarchia.ru</a></p></li></ol>
