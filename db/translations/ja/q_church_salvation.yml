    body: |-
      <h2>救いとは何か</h2><p>救いとは、神と共にある永遠の命、死からの救い、新しい（変容した）命です。</p><h3>神と共にある永遠の命</h3><blockquote><p>「もし片方の手か足があなたをつまずかせるなら、それを切って捨ててしまいなさい。両手両足がそろったまま永遠の火に投げ込まれるよりは、片手片足になっても<strong>命にあずかる</strong>方がよい」（<a href="https://bibleox.com/ja/jp-ni/mf/18/#L8">マタ. 18:8</a>）</p></blockquote><blockquote><p>「イエスは言われた。『なぜ、善いことについて、わたしに尋ねるのか。善い方はおひとりである。<strong>もし命を得たいのなら</strong>、掟を守りなさい』」（<a href="https://bibleox.com/ja/jp-ni/mf/19/#L17">マタ. 19:17</a>）</p></blockquote><h3>神化（テオシス）</h3><blockquote><p>「主イエスは、<strong>御自分の持つ神の力によって</strong>、命と信心とにかかわるすべてのものを、<strong>わたしたちに与えてくださいました</strong>。それは、わたしたちを御自身の栄光と力ある業とで召し出してくださった方を認識させることによるのです。この栄光と力ある業とによって、わたしたちは尊くすばらしい<strong>約束を与えられています。それは、あなたがたがこれらによって</strong>、情欲に染まったこの世の退廃を免れ、<strong>神の本性にあずからせていただくようになるためです</strong>」（<a href="https://bibleox.com/ja/jp-ni/2pet/1/#L3-4">２ペト. 1:3-4</a>）</p></blockquote><blockquote><p>「キリストは、万物を支配下に置くことさえできる力によって、<strong>わたしたちの卑しい体を、御自分の栄光ある体と同じ形に変えてくださるのです</strong>」（<a href="https://bibleox.com/ja/jp-ni/fil/3/#L21">フィリ. 3:21</a>）</p></blockquote><p><a href="https://bibleox.com/ja/jp-ni/in/17/#L21-23">ヨハ. 17:21-23</a>; <a href="https://bibleox.com/ja/jp-ni/1in/3/#L2">１ヨハ. 3:2</a>; <a href="https://bibleox.com/ja/jp-ni/ps/82/#L6">詩. 82:6</a>; <a href="https://bibleox.com/ja/jp-ni/gal/2/#L20">ガラ. 2:20</a>; <a href="https://bibleox.com/ja/jp-ni/rim/8/#L14,16">ロマ. 8:14,16</a></p><h2>救いの条件</h2><h3>キリストへの正しい信仰</h3><blockquote><p>「あなたがたが十字架につけて殺し、神が死者の中から復活させられたあのナザレの人、<strong>イエス・キリストの名によるものです</strong>。この方こそ、『あなたがた家を建てる者に捨てられたが、隅の親石となった石』です。<strong>ほかのだれによっても、救いは得られません</strong>。<strong>わたしたちが救われるべき名は、天下にこの名のほか、人間には与えられていないのです</strong>」（<a href="https://bibleox.com/ja/jp-ni/act/4/#L10-12">使. 4:10-12</a>）</p></blockquote><blockquote><p>「<strong>信仰がなければ、神に喜ばれることはできません</strong>。神に近づく者は、神が存在しておられること、また、神は御自分を求める者たちに報いてくださる方であることを、信じていなければならないからです」（<a href="https://bibleox.com/ja/jp-ni/evr/11/#L6">ヘブ. 11:6</a>）</p></blockquote><blockquote><p>「だれであろうと、<strong><mark>キリストの教え</mark>を越えて、これにとどまらない者は、神に結ばれていません</strong>。<strong>その教えにとどまっている人にこそ</strong>、御父も御子もおられます」（<a href="https://bibleox.com/ja/jp-ni/2in/1/#L9">２ヨハ. 1:9</a>）</p></blockquote><blockquote><p>「<strong>肉の業</strong>は明らかです。それは、姦淫、&lt;…&gt; <strong><mark>仲間争い</mark></strong><em>（ギリシア語 αἱρέσεις —「異端」）</em>、&lt;…&gt; その他このたぐいのものです。以前言っておいたように、ここでも前もって言いますが、<strong>このようなことを行う者は、<mark>神の国を受け継ぐことはできません</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/gal/5/#L19-21">ガラ. 5:19-21</a>）</p></blockquote><h3>信仰の行い</h3><h4>戒めを守ること</h4><blockquote><p>「もし命を得たいのなら、<strong><mark>掟を守りなさい</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/mf/19/#L17">マタ. 19:17</a>）</p></blockquote><blockquote><p>「そこで、<strong>わたしのこれらの言葉を聞いて<mark>行う</mark>者は皆</strong>、岩の上に自分の家を建てた賢い人に似ている」（<a href="https://bibleox.com/ja/jp-ni/mf/7/#L24">マタ. 7:24</a>）</p></blockquote><blockquote><p>「わたしのもとに来て、<strong>わたしの言葉を聞き、それを<mark>行う</mark>人</strong>が皆、どんな人に似ているかを示そう。それは、地面を深く掘り下げ、岩の上に土台を置いて家を建てた人に似ている。洪水になって川の水がその家に押し寄せたが、しっかり建ててあったので、揺り動かすことができなかった。<strong>しかし、聞いても<mark>行わない</mark>者は、土台なしで地面に家を建てた人に似ている</strong>。川の水が押し寄せると、家はたちまち<strong>倒れ</strong>、その壊れ方がひどかった」（<a href="https://bibleox.com/ja/jp-ni/lk/6/#L47-49">ルカ. 6:47-49</a>）</p></blockquote><blockquote><p>「御言葉を<strong><mark>行う人</mark></strong>になりなさい。自分を欺いて、聞くだけで終わる者になってはいけません。御言葉を聞くだけで行わない者がいれば、その人は生まれつきの顔を鏡に映して眺める人に似ています」（<a href="https://bibleox.com/ja/jp-ni/iak/1/#L22-23">ヤコ. 1:22-23</a>）</p></blockquote><h4><a href="https://bibleox.com/ja/ja/w/71cW_教会/">教会</a>の中で生きる必要</h4><blockquote><p>「キリストが教会の頭であり、<strong><mark>自らその体の救い主である</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/ef/5/#L23">エフェ. 5:23</a>）</p></blockquote><blockquote><p>「<strong><mark>キリストの体である教会</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/kol/1/#L24">コロ. 1:24</a>）</p></blockquote><blockquote><p>「つまり、<strong>一つの霊によって、わたしたちは</strong>、ユダヤ人であろうとギリシア人であろうと、奴隷であろうと自由な身分の者であろうと、<strong><mark>皆一つの体となるために洗礼を受け</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/1kor/12/#L13">１コリ. 12:13</a>）</p></blockquote><blockquote><p>「<strong><mark>洗礼を受けてキリストに結ばれたあなたがたは皆、キリストを着ているからです</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/gal/3/#L27">ガラ. 3:27</a>）</p></blockquote><blockquote><p>「こうして、主は<strong><mark>救われる人々</mark></strong>を日々<strong><mark>仲間に加え一つにされたのである</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/act/2/#L47">使. 2:47</a>）</p></blockquote><h4>洗礼</h4><p>洗礼は「上から生まれること」とも呼ばれます。</p><blockquote><p>「<strong>だれでも<mark>水と霊とによって生まれなければ</mark></strong>、<strong>神の国に入ることはできない</strong>」（<a href="https://bibleox.com/ja/jp-ni/in/3/#L5">ヨハ. 3:5</a>）</p></blockquote><p>さらに詳しく：<a href="https://bibleox.com/ru/ru/w/%D0%BA%D1%80%D0%B5%D1%89%D0%B5%D0%BD%D0%B8%D0%B5">洗礼</a></p><h4>キリストの体と血にあずかること</h4><blockquote><p>「イエスは言われた。『はっきり言っておく。<strong><mark>人の子の肉を食べ、その血を飲まなければ</mark>、あなたたちの内に命はない</strong>。わたしの肉を食べ、わたしの血を飲む者は、永遠の命を得、わたしはその人を<strong>終わりの日に復活させる</strong>』」（<a href="https://bibleox.com/ja/jp-ni/in/6/#L53-54">ヨハ. 6:53-54</a>）</p></blockquote><p>さらに詳しく：<a href="https://bibleox.com/ru/ru/w/%D0%95%D0%B2%D1%85%D0%B0%D1%80%D0%B8%D1%81%D1%82%D0%B8%D1%8F">聖体機密（エウカリスティア）</a></p><h2>救いには信仰だけでなく行いも必要である</h2><h3>行いのない信仰は救わない</h3><blockquote><p>「わたしの兄弟たち、栄光に満ちた、わたしたちの主イエス・キリストを信じながら、人を分け隔てしてはなりません。&lt;…&gt; わたしの兄弟たち、<strong>自分は信仰を持っていると言う者がいても、<mark>行いが伴わなければ、何の役に立つでしょうか。そのような信仰が、彼を救うことができるでしょうか</mark></strong>。もし、兄弟あるいは姉妹が、着る物もなく、その日の食べ物にも事欠いているとき、あなたがたのだれかが、彼らに、『安心して行きなさい。温まりなさい。満腹するまで食べなさい』と言うだけで、体に必要なものを何一つ与えないなら、何の役に立つでしょう。<strong><mark>信仰もこれと同じです。行いが伴わないなら、信仰はそれだけでは死んだものです</mark></strong>。しかし、『あなたには信仰があり、わたしには行いがある』と言う人がいるかもしれません。行いの伴わないあなたの信仰を見せなさい。そうすれば、わたしは行いによって、自分の信仰を見せましょう。あなたは『神は唯一だ』と信じている。結構なことだ。<strong>悪霊どももそう信じて</strong>、おののいています。ああ、愚かな者よ、<strong><mark>行いの伴わない信仰が役に立たない</mark></strong>、ということを知りたいのか」（<a href="https://bibleox.com/ja/jp-ni/iak/2/#L1,14-20">ヤコ. 2:1,14-20</a>）<em>（20節の「役に立たない」（ἀργή）は、ビザンティン本文（多数派写本）では νεκρά —「死んだもの」です。）</em></p></blockquote><h3>キリストの名によって信じただけでなく奇跡さえ行った多くの者が、不法を働いたために滅びる</h3><blockquote><p>「かの日には、<strong>大勢の者</strong>がわたしに、『主よ、主よ、わたしたちは御名によって<strong>預言し</strong>、御名によって<strong>悪霊を追い出し</strong>、御名によって<strong>奇跡をいろいろ行った</strong>ではありませんか』と言うであろう。そのとき、わたしはきっぱりとこう言おう。『<strong>あなたたちのことは全然知らない。<mark>不法を働く者ども</mark>、わたしから<mark>離れ去れ</mark></strong>』」（<a href="https://bibleox.com/ja/jp-ni/mf/7/#L22-23">マタ. 7:22-23</a>）</p></blockquote><h3>裁きは行いに基づいて行われる</h3><blockquote><p>「人の子は、父の栄光に輝いて天使たちと共に来るが、そのとき、<strong><mark>それぞれの行いに応じて報いるのである</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/mf/16/#L27">マタ. 16:27</a>）</p></blockquote><blockquote><p>「なぜなら、<strong><mark>わたしたちは皆</mark></strong>、<strong>キリストの裁きの座の前に立ち</strong>、善であれ悪であれ、<strong><mark>めいめい</mark>体を住みかとしていたときに<mark>行ったことに応じて</mark>、報いを受けねばならないからです</strong>」（<a href="https://bibleox.com/ja/jp-ni/2kor/5/#L10">２コリ. 5:10</a>）</p></blockquote><blockquote><p>「人にではなく主に仕えるように、喜んで仕えなさい。あなたがたも知っているとおり、奴隷であっても自由な身分の者であっても、<strong><mark>善いことを行えば、だれでも主から報いを受けるのです</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/ef/6/#L7-8">エフェ. 6:7-8</a>）</p></blockquote><blockquote><p>「慈しみは、わたしの主よ、あなたのものである、と。<strong><mark>ひとりひとりに、その業に従ってあなたは人間に報いをお与えになる</mark></strong>、と」（<a href="https://bibleox.com/ja/jp-ni/ps/62/#L13">詩. 62:13</a>）</p></blockquote><blockquote><p>「<strong><mark>神はおのおのの行いに従ってお報いになります</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/rim/2/#L6">ロマ. 2:6</a>）</p></blockquote><blockquote><p>「こうして、全教会は、わたしが人の思いや判断を見通す者だということを悟るようになる。<strong><mark>わたしは、あなたがたが行ったことに応じて、一人一人に報いよう</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/otkr/2/#L23">黙. 2:23</a>）</p></blockquote><blockquote><p>「見よ、わたしはすぐに来る。わたしは、報いを携えて来て、<strong><mark>それぞれの行いに応じて報いる</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/otkr/22/#L12">黙. 22:12</a>）</p></blockquote><h3>信仰だけによるのではなく、行いによって義とされる</h3><blockquote><p>「<strong>神がわたしたちの父アブラハムを義とされたのは</strong>、息子のイサクを祭壇の上に献げるという<strong>行いによってではなかったですか</strong>。アブラハムの信仰がその行いと共に働き、信仰が行いによって完成されたことが、これで分かるでしょう。『アブラハムは神を信じた。それが彼の義と認められた』という聖書の言葉が実現し、彼は神の友と呼ばれたのです。これであなたがたも分かるように、<strong><mark>人は行いによって義とされるのであって、信仰だけによるのではありません</mark></strong>。同様に、<strong>娼婦ラハブも</strong>、あの使いの者たちを家に迎え入れ、別の道から送り出してやるという<strong>行いによって、義とされたではありませんか</strong>。魂のない肉体が死んだものであるように、行いを伴わない信仰は死んだものです」（<a href="https://bibleox.com/ja/jp-ni/iak/2/#L21-26">ヤコ. 2:21-26</a>）</p></blockquote><h3>忍耐強く善を行うことによって永遠の命が得られる</h3><blockquote><p>「あなたは、かたくなで心を改めようとせず、神の怒りを自分のために蓄えています。この怒りは、神が正しい裁きを行われる怒りの日に現れるでしょう。<strong>神はおのおのの行いに従ってお報いになります</strong>。すなわち、<strong><mark>忍耐強く善を行い</mark>、栄光と誉れと<mark>不滅のもの</mark>を<mark>求める者には</mark>、<mark>永遠の命</mark>をお与えになり</strong>、反抗心にかられ、真理ではなく不義に従う者には、怒りと憤りをお示しになります」（<a href="https://bibleox.com/ja/jp-ni/rim/2/#L5-8">ロマ. 2:5-8</a>）</p></blockquote><h3>永遠の命を得るために、良い行いに富む</h3><blockquote><p>「善を行い、<strong><mark>良い行いに富み</mark></strong>、物惜しみをせず、喜んで分け与えるように。<strong><mark>真の命を得るために</mark></strong>、未来に備えて自分のために堅固な基礎を築くようにと」（<a href="https://bibleox.com/ja/jp-ni/1tim/6/#L18-19">１テモ. 6:18-19</a>）<em>（「真の命」（τῆς ὄντως ζωῆς）は、ビザンティン本文（多数派写本）では τῆς αἰωνίου ζωῆς —「永遠の命」です。）</em></p></blockquote><h3>善い業のために造られた</h3><p>行いがないことは、自分に対する神の御心に背くことです。善い業がなければ、人は自分の使命を果たさず、自分が造られた目的を果たしません。</p><blockquote><p>「なぜなら、わたしたちは神に造られたものであり、しかも、神が前もって準備してくださった<strong><mark>善い業のために</mark>、キリスト・イエスにおいて<mark>造られた</mark></strong>からです。わたしたちは、その善い業を行って歩むのです」（<a href="https://bibleox.com/ja/jp-ni/ef/2/#L10">エフェ. 2:10</a>）</p></blockquote><h3>神の国は、苦しみを忍耐してキリストに従うことによって受け継がれる</h3><blockquote><p>「もし子供であれば、<strong><mark>相続人</mark></strong>でもあります。神の相続人、しかもキリストと共同の相続人です。<strong><mark>キリストと共に苦しむなら</mark></strong>、共にその栄光をも受けるからです」（<a href="https://bibleox.com/ja/jp-ni/rim/8/#L17">ロマ. 8:17</a>）</p></blockquote><h3>使徒は、福音の宣教（行い）が自分の救いに役立つことを知っている</h3><blockquote><p>「というのは、あなたがたの祈りと、イエス・キリストの霊の助けとによって、<strong>このことがわたしの救いになる</strong><em>（ギリシア語 εἰς σωτηρίαν —「救いに」）</em>と知っているからです」（<a href="https://bibleox.com/ja/jp-ni/fil/1/#L19">フィリ. 1:19</a>）</p></blockquote><h3>キリスト者の義は、律法学者やファリサイ派の人々の義にまさっていなければならない</h3><blockquote><p>「言っておくが、<strong><mark>あなたがたの義が律法学者やファリサイ派の人々の義にまさっていなければ</mark></strong>、あなたがたは<strong><mark>決して天の国に入ることができない</mark></strong>。［このすぐ後に、行いについての言葉が続く］&lt;…&gt; 兄弟に腹を立てる者はだれでも &lt;…&gt; みだらな思いで他人の妻を見る者はだれでも &lt;…&gt; 一切誓いを立ててはならない &lt;…&gt; 悪人に手向かってはならない &lt;…&gt; 敵を愛し、自分を迫害する者のために祈りなさい &lt;…&gt; だから、あなたがたの天の父が完全であられるように、あなたがたも完全な者となりなさい」（<a href="https://bibleox.com/ja/jp-ni/mf/5/#L20,22,28,34,39,44,48">マタ. 5:20,22,28,34,39,44,48</a>）</p></blockquote><p>そして律法学者やファリサイ派の人々は、言うだけで行いません。</p><blockquote><p>「『<strong><mark>律法学者たちやファリサイ派の人々</mark></strong>は、モーセの座に着いている。だから、彼らが言うことは、すべて行い、また守りなさい。しかし、彼らの行いは、見倣ってはならない。<strong><mark>言うだけで、実行しないからである</mark></strong>』」（<a href="https://bibleox.com/ja/jp-ni/mf/23/#L2-3">マタ. 23:2-3</a>）</p></blockquote><p>*信仰が義と認められるのは、行いがあるときです。人は信仰によってだけでなく、行いによっても義とされます（<a href="https://bibleox.com/ja/jp-ni/iak/2/#L21-24">ヤコ. 2:21-24</a>）。</p><h3>行う者が正しい人である</h3><blockquote><p>「子たちよ、だれにも惑わされないようにしなさい。<strong><mark>義を行う者は</mark></strong>、御子と同じように、<strong><mark>正しい人です</mark></strong>。<strong>罪を犯す者は悪魔に属します</strong>。悪魔は初めから罪を犯しているからです」（<a href="https://bibleox.com/ja/jp-ni/1in/3/#L7-8">１ヨハ. 3:7-8</a>）</p></blockquote><h3>正しい人もやっと救われる</h3><p>正しい人とは、神の義に従って行う人です（<a href="https://bibleox.com/ja/jp-ni/iez/33/#L13-16">エゼ. 33:13-16</a>）。罪人とは、神の義に反して行う人、すなわち罪を犯す人です。正しい人でさえやっと救われるのです。論理に従えば、罪人はまったく救われません。</p><blockquote><p>「『<strong><mark>正しい人がやっと救われるのなら</mark></strong>、不信心な人や罪深い人はどうなるのか』と言われているとおりです」（<a href="https://bibleox.com/ja/jp-ni/1pet/4/#L18">１ペト. 4:18</a>）</p></blockquote><h3>神を知っていると公言しながら、行いで神を否定することがある</h3><blockquote><p>「わたしを『主よ、主よ』と呼びながら、<strong>なぜわたしの言うことを<mark>行わない</mark>のか</strong>」（<a href="https://bibleox.com/ja/jp-ni/lk/6/#L46">ルカ. 6:46</a>）</p></blockquote><blockquote><p>「こういう者たちは、<strong>神を知っていると公言しながら、<mark>行いではそれを否定しているのです</mark></strong>。嫌悪すべき人間で、反抗的で、一切の善い業については失格者です」（<a href="https://bibleox.com/ja/jp-ni/tit/1/#L16">テト. 1:16</a>）</p></blockquote><p>神に喜ばれない業の中には、異端（<a href="https://bibleox.com/ja/jp-ni/gal/5/#L20">ガラ. 5:20</a>）や、信じる者たちの間に分裂を作ること（<a href="https://bibleox.com/ja/jp-ni/in/17/#L20-21">ヨハ. 17:20-21</a>; <a href="https://bibleox.com/ja/jp-ni/1kor/1/#L10">１コリ. 1:10</a>）があります。</p><h3>罪人を迷いの道から連れ戻す業は、罪を覆う</h3><p>真に信じる者が隣人を迷いから連れ戻すなら、その業によって多くの罪を覆うことになります。もし救いが信仰だけによって得られるのなら、隣人を迷いから連れ戻すことは隣人を助けるだけで、連れ戻した人には何も与えず、その人の罪を覆うこともないでしょう（すでに信仰によって救われているのなら、なぜ覆う必要があるでしょうか）。</p><blockquote><p>「わたしの兄弟たち、あなたがたの中に<strong>真理から迷い出た者</strong>がいて、だれかがその人を真理へ連れ戻すならば、<strong>罪人を迷いの道から<mark>連れ戻す人は</mark>、その罪人の<mark>魂を死から救い出し</mark>、<mark>多くの罪を覆うことになる</mark></strong>と、知るべきです」（<a href="https://bibleox.com/ja/jp-ni/iak/5/#L19-20">ヤコ. 5:19-20</a>）</p></blockquote><h3>神の安息にあずかるよう努力せよという、信じる者への呼びかけ</h3><p>つまり、努力しなければ、信じる者もあずかれないかもしれないのです。</p><blockquote><p>「だから、わたしたちはこの安息に<strong><mark>あずかるように努力しよう</mark></strong>ではありませんか。さもないと、同じ不従順の例に倣って堕落する者が出るかもしれません」（<a href="https://bibleox.com/ja/jp-ni/evr/4/#L11">ヘブ. 4:11</a>）</p></blockquote><h3>徳と永遠の御国に入ること</h3><p>信じる者は、徳があるとき、実を結ばないままではいません。徳に堅く立つとき、御国に確かに入ることが許されます。そして徳のない者は盲目です。</p><blockquote><p>「だから、あなたがたは、力を尽くして<strong><mark>信仰には徳を</mark></strong>、徳には<strong>知識</strong>を、知識には<strong>自制</strong>を、自制には<strong>忍耐</strong>を、忍耐には<strong>信心</strong>を、信心には<strong>兄弟愛</strong>を、兄弟愛には<strong>愛</strong>を<strong><mark>加えなさい</mark></strong>。<strong><mark>これらのものが備わり、ますます豊かになるならば、あなたがたは怠惰で実を結ばない者とはならず</mark></strong>、わたしたちの主イエス・キリストを知るようになるでしょう。<strong>これらを備えていない者は、視力を失っています。近くのものしか見えず、以前の罪が清められたことを忘れています</strong>。だから兄弟たち、召されていること、選ばれていることを確かなものとするように、<strong><mark>いっそう努めなさい</mark></strong>。これらのことを<strong>実践すれば</strong>、決して罪に陥りません。<strong><mark>こうして、わたしたちの主、救い主イエス・キリストの永遠の御国に確かに入ることができるようになります</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/2pet/1/#L5-11">２ペト. 1:5-11</a>）</p></blockquote><hr><p>このように、行いのない信仰も、信仰のない行いも救いません。</p><h2>洗礼の後も、信じる者はなお罪を犯しうるのであり、自分の内の罪と戦わなければならない</h2><blockquote><p>「もし、<strong>わたしたちが真理の知識を受けた後にも、故意に罪を犯し続けるとすれば</strong>、罪のためのいけにえは、もはや残っていません」（<a href="https://bibleox.com/ja/jp-ni/evr/10/#L26">ヘブ. 10:26</a>）</p></blockquote><blockquote><p>「<strong>自分に罪がないと言うなら、自らを欺いており</strong>、真理はわたしたちの内にありません。自分の罪を公に言い表すなら、神は真実で正しい方ですから、罪を赦し、あらゆる不義からわたしたちを清めてくださいます」（<a href="https://bibleox.com/ja/jp-ni/1in/1/#L8-9">１ヨハ. 1:8-9</a>）</p></blockquote><blockquote><p>「わたしの子たちよ、<strong><mark>これらのことを書くのは、あなたがたが罪を犯さないようになるためです</mark></strong>。たとえ罪を犯しても、御父のもとに弁護者、正しい方、イエス・キリストがおられます」（<a href="https://bibleox.com/ja/jp-ni/1in/2/#L1">１ヨハ. 2:1</a>）</p></blockquote><blockquote><p>「<strong><mark>何が原因で、あなたがたの間に戦いや争いが起こるのですか</mark></strong>。あなたがた自身の内部で争い合う欲望が、その原因ではありませんか」（<a href="https://bibleox.com/ja/jp-ni/iak/4/#L1">ヤコ. 4:1</a>）</p></blockquote><blockquote><p><em>「あなたがたの中で病気の人は、</em><strong><em>教会の長老を招いて</em></strong><em>、主の名によってオリーブ油を塗り、祈ってもらいなさい。</em><strong><em>信仰に基づく祈りは、病人を救い</em></strong><em>、主がその人を起き上がらせてくださいます。</em><strong><em>その人が罪を犯したのであれば、主が<mark>赦してくださいます</mark></em></strong><em>。だから、主にいやしていただくために、罪を告白し合い、</em><strong><em>互いのために祈りなさい。正しい人の祈りは、大きな力があり、効果をもたらします</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/iak/5/#L14-16"><em>ヤコ. 5:14-16</em></a><em>）</em></p></blockquote><blockquote><p><em>「</em><strong><em>正気になって身を正しなさい。<mark>罪を犯してはならない</mark></em></strong><em>。</em><strong><em>神について何も知らない人がいるからです</em></strong><em>。わたしがこう言うのは、あなたがたを恥じ入らせるためです」（</em><a href="https://bibleox.com/ja/jp-ni/1kor/15/#L34"><em>１コリ. 15:34</em></a><em>）</em></p></blockquote><blockquote><p>「互いに親切にし、憐れみの心で接し、神がキリストによってあなたがたを赦してくださったように、<strong><mark>赦し合いなさい</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/ef/4/#L32">エフェ. 4:32</a>）</p></blockquote><p>そしてついに、主イエス・キリストは弟子たちに祈りを与え、その中で罪の赦しを願うよう教えておられます。これは一生に一度だけ唱える祈りではありません。弟子たちがキリストに祈ることを教えてほしいと願い、それに答えてキリストはこの型をお与えになったのです。</p><blockquote><p>「そこで、イエスは言われた。『<strong><mark>祈るときには、こう言いなさい</mark></strong>。「父よ、御名が崇められますように。御国が来ますように。わたしたちに必要な糧を毎日与えてください。<strong><mark>わたしたちの罪を赦してください</mark></strong>、わたしたちも自分に負い目のある人を皆赦しますから。わたしたちを誘惑に遭わせないでください」』」（<a href="https://bibleox.com/ja/jp-ni/lk/11/#L1-4">ルカ. 11:1-4</a>; <a href="https://bibleox.com/ja/jp-ni/mf/6/#L7-13">マタ. 6:7-13</a>）</p></blockquote><h2>救いは一回の行為ではなく、生涯全体の過程である</h2><p>救いを達成する必要（ギリシア語 κατεργάζεσθε —<em>成し遂げる、行う、生み出す、達成する、完成する、従わせる、征服する</em>）</p><blockquote><p>「だから、わたしの愛する人たち、いつも従順であったように、わたしが共にいるときだけでなく、いない今はなおさら従順でいて、<strong>恐れおののきつつ自分の救いを達成するように努めなさい</strong>」（<a href="https://bibleox.com/ja/jp-ni/fil/2/#L12">フィリ. 2:12</a>）</p></blockquote><p>使徒は、洗礼を受けたキリスト者の内にキリストが形づくられるまで、産みの苦しみをしています。つまり、キリストは彼らの内に自動的に、一瞬にして形づくられたのではありません。</p><blockquote><p>「わたしの子供たち、<strong>キリストがあなたがたの内に形づくられるまで、わたしは、もう一度あなたがたを産もうと苦しんでいます</strong>」（<a href="https://bibleox.com/ja/jp-ni/gal/4/#L19">ガラ. 4:19</a>）</p></blockquote><blockquote><p>「わたしは、戦いを立派に戦い抜き、<strong>決められた道を走りとおし</strong>、信仰を守り抜きました」（<a href="https://bibleox.com/ja/jp-ni/2tim/4/#L7">２テモ. 4:7</a>）</p></blockquote><p>救いは約束されているだけで、まだ受けてはいません（「救われる」のであって、「救われている」のではありません）。</p><blockquote><p>「また、わたしの名のために、あなたがたはすべての人に憎まれる。しかし、<strong><mark>最後まで耐え忍ぶ者は</mark></strong>救われる」（<a href="https://bibleox.com/ja/jp-ni/mf/10/#L22">マタ. 10:22</a>）（<a href="https://bibleox.com/ja/jp-ni/mf/24/#L13">マタ. 24:13</a>）</p></blockquote><blockquote><p>「<strong><mark>死に至るまで忠実であれ。そうすれば</mark></strong>、あなたに命の冠を<strong><mark>授けよう</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/otkr/2/#L10">黙. 2:10</a>）</p></blockquote><p>使徒は自分自身を裁きません。神に背く行いを自分には何も知らないとしても、それによって自分を義とせず、神からの裁きを待っています。</p><blockquote><p>「こういうわけですから、<strong>人はわたしたちを</strong>キリストに仕える者、神の秘められた計画をゆだねられた<strong>管理者と考えるべきです</strong>。<strong>この場合、管理者に<mark>要求される</mark>のは<mark>忠実であることです</mark></strong>。わたしにとっては、あなたがたから裁かれようと、人間の法廷で裁かれようと、少しも問題ではありません。<strong><mark>わたしは、自分で自分を裁くことすらしません</mark></strong>。自分には何もやましいところはないが、それでわたしが義とされているわけではありません。<strong><mark>わたしを裁くのは主なのです</mark></strong>。<strong>ですから、主が来られるまでは、先走って何も裁いてはいけません</strong>。主は闇の中に隠されている秘密を明るみに出し、人の心の企てをも明らかにされます。そのとき、おのおのは神からおほめにあずかります」（<a href="https://bibleox.com/ja/jp-ni/1kor/4/#L1-5">１コリ. 4:1-5</a>）</p></blockquote><h3>キリスト教的完全に達すること</h3><p>使徒は、すべてのキリスト者と同じように、朽ちない冠を得るために走り、労苦し、自分自身が失格者とならないかと心配しています。</p><blockquote><p>「競技をする人は皆、すべてに節制します。彼らは朽ちる<strong>冠を得るために</strong>そうするのですが、わたしたちは、<strong>朽ちない</strong>冠を得るために節制するのです。<strong>だから、わたしとしては</strong>、やみくもに<strong>走ったりしないし</strong>、空を打つような拳闘もしません。むしろ、自分の体を打ちたたいて<strong>服従させます</strong>。それは、他の人々に宣教しておきながら、自分の方が<strong><mark>失格者になってしまわない</mark></strong><strong>ためです</strong>」（<a href="https://bibleox.com/ja/jp-ni/1kor/9/#L25-27">１コリ. 9:25-27</a>）</p></blockquote><blockquote><p>「<strong>わたしは、既にそれを得たというわけではなく</strong>、既に完全な者となっているわけでもありません。<strong>何とかして捕らえようと努めているのです</strong>。自分がキリスト・イエスに捕らえられているからです。兄弟たち、<strong>わたし自身は既に捕らえたとは思っていません</strong>。なすべきことはただ一つ、後ろのものを忘れ、前のものに全身を向けつつ、神がキリスト・イエスによって上へ召して、お与えになる賞を得るために、<strong>目標を目指してひたすら走ることです</strong>」（<a href="https://bibleox.com/ja/jp-ni/fil/3/#L12-14">フィリ. 3:12-14</a>）</p></blockquote><h3>救われる者と滅びる者</h3><p>救われつつある者がまだ救われていないように、滅びつつある者もまだ滅びてはいません。どちらも道の途中にあり、どちらも道を変えることができます。救われつつある者もなお滅びに向かうことがあり、滅びつつある者も救いに向かうことがあるのです。</p><blockquote><p>「<strong><mark>救いの道をたどる者</mark></strong>にとっても、<strong><mark>滅びの道をたどる者</mark></strong>にとっても、わたしたちはキリストによって神に献げられる良い香りです」（<a href="https://bibleox.com/ja/jp-ni/2kor/2/#L15">２コリ. 2:15</a>）<em>（ギリシア語原文では τοῖς σῳζομένοις —「救われつつある者たち」、τοῖς ἀπολλυμένοις —「滅びつつある者たち」と、どちらも現在進行の分詞です。）</em></p></blockquote><p>多くの人が天の国に達しようとして、達することができません。</p><blockquote><p>「<strong>狭い戸口から入るように努めなさい</strong>。言っておくが、<strong><mark>入ろうとしても入れない人が多いのだ</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/lk/13/#L24">ルカ. 13:24</a>; <a href="https://bibleox.com/ja/jp-ni/mf/7/#L14">マタ. 7:14</a>; <a href="https://bibleox.com/ja/jp-ni/mf/7/#L13">マタ. 7:13</a>）</p></blockquote><p>多くの信じる者だけでなく、キリストの名によって奇跡を行う者さえ、天の国に達しません。</p><blockquote><p>「かの日には、<strong>大勢の者</strong>がわたしに、『主よ、主よ、わたしたちは御名によって<strong>預言し</strong>、御名によって<strong>悪霊を追い出し</strong>、御名によって<strong>奇跡をいろいろ行った</strong>ではありませんか』と言うであろう。そのとき、わたしはきっぱりとこう言おう。『<strong>あなたたちのことは全然知らない。</strong>不法を働く者ども、<strong>わたしから離れ去れ</strong>』」（<a href="https://bibleox.com/ja/jp-ni/mf/7/#L22-23">マタ. 7:22-23</a>）</p></blockquote><h2>キリストは全世界の審判者である</h2><h3>すべての人が裁きを受ける</h3><blockquote><p>「なぜなら、<strong><mark>わたしたちは皆</mark>、キリストの裁きの座の前に立ち、</strong><strong>善であれ悪であれ</strong>、めいめい体を住みかとしていたときに<strong>行ったこと</strong>に応じて、報いを受けねばならないからです」（<a href="https://bibleox.com/ja/jp-ni/2kor/5/#L10">２コリ. 5:10</a>）</p></blockquote><blockquote><p>「それなのに、なぜあなたは、自分の兄弟を裁くのですか。また、なぜ兄弟を侮るのですか。<strong><mark>わたしたちは皆</mark>、神の裁きの座の前に立つのです</strong>」（<a href="https://bibleox.com/ja/jp-ni/rim/14/#L10">ロマ. 14:10</a>）<em>（「神の」は、ビザンティン本文（多数派写本）では τοῦ Χριστοῦ —「キリストの」です。）</em></p></blockquote><blockquote><p>「自由をもたらす律法によっていずれは<strong><mark>裁かれる者として</mark></strong>、語り、またふるまいなさい」（<a href="https://bibleox.com/ja/jp-ni/iak/2/#L12">ヤコ. 2:12</a>）</p></blockquote><blockquote><p>「<strong>神は、善をも悪をも<mark>一切の業を</mark></strong>、隠れたこともすべて<strong>裁きの座に引き出されるであろう</strong>」（<a href="https://bibleox.com/ja/jp-ni/ekl/12/#L14">コヘ. 12:14</a>）</p></blockquote><blockquote><p>「<strong>人の子は</strong>、栄光に輝いて天使たちを皆従えて来るとき、<strong>その栄光の座に着く</strong>。そして、<strong>すべての<mark>国の民</mark>がその前に集められると</strong>、羊飼いが<strong><mark>羊と山羊を</mark>分けるように、彼らを<mark>より分け</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/mf/25/#L31-32">マタ. 25:31-32</a>）</p></blockquote><h3>裁きは教会から始まる</h3><blockquote><p>「<strong>今こそ、<mark>神の家から</mark>裁きが始まる時です</strong>。<strong><mark>わたしたちがまず裁きを受けるのだとすれば</mark></strong>、神の福音に従わない者たちの行く末は、いったい、どんなものになるだろうか。『<strong>正しい人がやっと救われるのなら</strong>、不信心な人や罪深い人はどうなるのか』と言われているとおりです」（<a href="https://bibleox.com/ja/jp-ni/1pet/4/#L17-18">１ペト. 4:17-18</a>）</p></blockquote><blockquote><p>「わたしにとっては、<strong>あなたがたから裁かれようと、人間の法廷で裁かれようと、少しも問題ではありません。<mark>わたしは、自分で自分を裁くことすらしません</mark></strong>。自分には何もやましいところはないが、<strong>それでわたしが義とされているわけではありません。<mark>わたしを裁くのは主なのです</mark></strong>。ですから、主が来られるまでは、<strong>先走って何も裁いてはいけません</strong>。主は闇の中に隠されている秘密を明るみに出し、人の心の企てをも明らかにされます。そのとき、おのおのは神からおほめにあずかります」（<a href="https://bibleox.com/ja/jp-ni/1kor/4/#L3-5">１コリ. 4:3-5</a>）</p></blockquote><h3>わたしたちは皆、度々罪を犯す</h3><blockquote><p>「<strong>わたしたちは皆、度々過ちを犯すからです</strong>。言葉で過ちを犯さないなら、それは自分の全身を制御できる完全な人です」（<a href="https://bibleox.com/ja/jp-ni/iak/3/#L2">ヤコ. 3:2</a>）</p></blockquote><blockquote><p>「<strong>自分に罪がないと言うなら、自らを欺いており</strong>、真理はわたしたちの内にありません。&lt;…&gt; 罪を犯したことがないと言うなら、それは神を偽り者とすることであり、神の言葉はわたしたちの内にありません」（<a href="https://bibleox.com/ja/jp-ni/1in/1/#L8,10">１ヨハ. 1:8,10</a>）</p></blockquote><h3>多くの人が、救われないことに驚く</h3><p>彼らは、自分は救われていると思っていました。</p><blockquote><p>「かの日には、<strong>大勢の者</strong>がわたしに、『主よ、主よ、わたしたちは御名によって<strong>預言し</strong>、御名によって<strong>悪霊を追い出し</strong>、御名によって<strong>奇跡をいろいろ行った</strong>ではありませんか』と言うであろう。そのとき、わたしはきっぱりとこう言おう。『<strong>あなたたちのことは全然知らない。</strong>不法を働く者ども、<strong>わたしから離れ去れ</strong>』」（<a href="https://bibleox.com/ja/jp-ni/mf/7/#L22-23">マタ. 7:22-23</a>）</p></blockquote><h2>反論への応答</h2><h3>「信じる者は裁かれない」</h3><blockquote><p>「はっきり言っておく。わたしの言葉を聞いて、わたしをお遣わしになった方を信じる者は、永遠の命を得、また、<strong>裁かれることなく</strong>、死から命へと移っている」（<a href="https://bibleox.com/ja/jp-ni/in/5/#L24">ヨハ. 5:24</a>）</p></blockquote><p>手短に言えば、ここで語られているのは、救い主の言葉を真に信じて行う人々（<a href="https://bibleox.com/ja/jp-ni/lk/6/#L47-49">ルカ. 6:47-49</a>; <a href="https://bibleox.com/ja/jp-ni/1in/2/#L17">１ヨハ. 2:17</a>）は、罰のために断罪されることはないということです。しかし、だれがそのように信じて行う人なのかは、キリスト御自身が裁きの時に決められます（<a href="https://bibleox.com/ja/jp-ni/1kor/4/#L3-5">１コリ. 4:3-5</a>）。上に示したとおり、全世界の裁きはまさに教会から始まり（<a href="https://bibleox.com/ja/jp-ni/1pet/4/#L17-18">１ペト. 4:17-18</a>）、すべての人が裁きを受けるからです。<em>（「裁かれる」と訳されている語は、ギリシア語原文では εἰς κρίσιν οὐκ ἔρχεται —「裁きに来ない」で、ここでの κρίσις は文脈上「断罪」の意味です。）</em></p><p>もっと詳しく見てみましょう。</p><p>この言葉は、聖書の中で語られていることすべての文脈の中で理解されるべきです。聖書ではまた、救いには戒めを守ることが必要であり（<a href="https://bibleox.com/ja/jp-ni/lk/6/#L47-49">ルカ. 6:47-49</a>; <a href="https://bibleox.com/ja/jp-ni/1in/2/#L17">１ヨハ. 2:17</a>）、洗礼が必要であり（<a href="https://bibleox.com/ja/jp-ni/in/3/#L5">ヨハ. 3:5</a>）、聖体機密も必要であり（<a href="https://bibleox.com/ja/jp-ni/in/6/#L53-54">ヨハ. 6:53-54</a>）、そのほか多くのことが必要だと語られています。ある引用だけを見て、ほかの引用には目をつぶることはできません。</p><p>そして、救いに必要なほかの事柄を除外することはできないのですから、ここで語られているのは、洗礼によって教会に入り、聖体機密にあずかることによって教会（キリストの体）の中に生き、戒めを守り、神の御心を知ってそれに従って生きる信じる者たちのことです。<strong>もし</strong>彼らがそのように行うなら、断罪のために裁きに来ることはありません。しかし、それはだれでしょうか。審判者であるキリストが知っておられます。それゆえ、まず初めに、すべての人が裁きに来るのであり、そのことはほかの箇所で直接語られています。</p><p>すべての人が裁きを受けます。</p><blockquote><p>「なぜなら、<strong>わたしたちは皆、キリストの裁きの座の前に立ち</strong>、<strong>善</strong>であれ<strong>悪</strong>であれ、めいめい体を住みかとしていたときに<strong>行ったこと</strong>に応じて、報いを受けねばならないからです」（<a href="https://bibleox.com/ja/jp-ni/2kor/5/#L10">２コリ. 5:10</a>）</p></blockquote><p>ここでは、まさに<strong>信じる者たちについて</strong>語られています。</p><blockquote><p>「それなのに、なぜあなたは、自分の<strong>兄弟</strong>を裁くのですか。また、なぜ<strong>兄弟</strong>を侮るのですか。<strong>わたしたちは皆、神の裁きの座の前に立つのです</strong>」（<a href="https://bibleox.com/ja/jp-ni/rim/14/#L10">ロマ. 14:10</a>）</p></blockquote><blockquote><p>「<strong>神は、善をも悪をも一切の業を</strong>、隠れたこともすべて<strong>裁きの座に引き出されるであろう</strong>」（<a href="https://bibleox.com/ja/jp-ni/ekl/12/#L14">コヘ. 12:14</a>）</p></blockquote><p>しかし、すべての人が裁かれると言うだけでは十分ではありません。そのうえ、裁きはまさに教会、すなわち信じる者たちから始まるのです。</p><blockquote><p>「<strong>今こそ、神の家から裁きが始まる時です</strong>。<strong>わたしたちがまず裁きを受けるのだとすれば</strong>、神の福音に従わない者たちの行く末は、いったい、どんなものになるだろうか。『正しい人がやっと救われるのなら、不信心な人や罪深い人はどうなるのか』と言われているとおりです」（<a href="https://bibleox.com/ja/jp-ni/1pet/4/#L17-18">１ペト. 4:17-18</a>）</p></blockquote><p>つまり、信じて行う人（それがだれかは、審判者キリストが決められます）は、断罪のために裁きに来ることはありません。</p><p>次の<strong>大勢の信じる者たち</strong>は、明らかに、自分は救われていて裁きに来ることはないと思っていました。そして彼らは信じていたにもかかわらず、不法を働く者として断罪されます。</p><blockquote><p>「かの日には、<strong>大勢の者</strong>がわたしに、『主よ、<strong>主よ、わたしたちは御名によって預言し</strong>、御名によって<strong>悪霊を追い出し</strong>、御名によって<strong>奇跡をいろいろ行った</strong>ではありませんか』と言うであろう。そのとき、わたしはきっぱりとこう言おう。『<strong>あなたたちのことは全然知らない</strong>。不法を働く者ども、<strong>わたしから離れ去れ</strong>』」（<a href="https://bibleox.com/ja/jp-ni/mf/7/#L22-23">マタ. 7:22-23</a>）</p></blockquote><p>このようにキリストは、裁きの時にすべての人を裁き、彼らをより分けられます。</p><blockquote><p>「<strong>人の子は</strong>、栄光に輝いて天使たちを皆従えて来るとき、<strong>その栄光の座に着く</strong>。そして、<strong>すべての<mark>国の民</mark>がその前に集められると</strong>、羊飼いが<strong><mark>羊と山羊を</mark>分けるように、彼らを<mark>より分け</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/mf/25/#L31-32">マタ. 25:31-32</a>）</p></blockquote><h3>「人は行いによっては義とされない」</h3><blockquote><p>「けれども、<strong>人は<mark>律法の</mark>実行ではなく、ただイエス・キリストへの信仰によって義とされる</strong>と知って、わたしたちもキリスト・イエスを信じました。これは、<strong><mark>律法の</mark>実行ではなく</strong>、キリストへの信仰によって義としていただくためでした。<strong>なぜなら、<mark>律法の</mark>実行によっては、だれ一人として義とされないからです</strong>」（<a href="https://bibleox.com/ja/jp-ni/gal/2/#L16">ガラ. 2:16</a>）</p></blockquote><p>ここで語られているのは、それによっては義とされることのできないモーセの律法の行いのことです。ガラテヤの信徒への手紙ではこれが主要なテーマであり、そのきっかけは、異邦人に割礼が必要かどうかという論争でした。割礼は必要ありません。わたしたちはモーセの律法の行いによってではなく、キリストへの信仰と、キリストへのこの信仰の行いとによって救われるからです（<a href="https://bibleox.com/ja/ja/w/Sv3a_救い/">行いの必要性についての引用</a>を参照）。</p><h3>「恵みにより、信仰によって救われました」</h3><blockquote><p>「罪のために死んでいたわたしたちをキリストと共に生かし、――<strong>あなたがたの救われたのは恵みによるのです</strong>―― &lt;…&gt; 事実、<strong>あなたがたは、恵みにより、信仰によって救われました</strong>。このことは、自らの力によるのではなく、<strong>神の賜物です。</strong><strong>行いによるのではありません</strong>。それは、だれも誇ることがないためなのです」（<a href="https://bibleox.com/ja/jp-ni/ef/2/#L5,8-9">エフェ. 2:5,8-9</a>）</p></blockquote><p>ここで語られているのは、一人一人の個人的な救いのことではなく、救われる<strong>可能性</strong>がこの世に来たこと（この可能性が開かれたこと）についてです。</p><h4>1. 救いの可能性が開かれたことは賜物である</h4><p>キリスト以前には、救われる可能性はありませんでした。キリスト以後、救いが可能となり、救いの手段が造られました。救いの可能性が現れるために、人は何をしたでしょうか。何もしませんでした。人類の罪はただ増えるばかりでした。救いの道の備えは、神から人々への<strong>賜物</strong>として生じました。この賜物は、罪深い人類が受けるに値するものではありませんでした。</p><blockquote><p>「実にキリストは、<strong>わたしたちがまだ弱かったころ、定められた時に、不信心な者のために死んでくださった</strong>。正しい人のために死ぬ者はほとんどいません。善い人のために命を惜しまない者ならいるかもしれません。しかし、<strong><mark>わたしたちがまだ罪人であったとき、キリストがわたしたちのために死んでくださったことにより、神はわたしたちに対する愛を示されました</mark></strong>。それで今や、わたしたちはキリストの血によって義とされたのですから、キリストによって神の怒りから救われるのは、なおさらのことです」（<a href="https://bibleox.com/ja/jp-ni/rim/5/#L6-9">ロマ. 5:6-9</a>）</p></blockquote><h4>2. 救いの手段は賜物である</h4><p>また、救いの道に踏み出し、救いの手段を受けるために、一人一人の人に必要なのはまさに信仰です。人は教会に導き入れられ、洗礼によって新たに生まれ、傅膏（ふこう）機密によって聖霊の賜物を受け、聖体機密によってキリストと一つにされます。これはすべて信仰によって<strong>無償で与えられる</strong>ものです。人はこの賜物を前もって受けるに値する者となるよう求められてはいません。</p><h4>3. 救いへの道は、神の助けによって（<a href="https://bibleox.com/ja/jp-ni/1kor/15/#L10">１コリ. 15:10</a>）、人の行いによって（<a href="https://bibleox.com/ja/jp-ni/rim/2/#L5-8">ロマ. 2:5-8</a>）、生涯を通して（<a href="https://bibleox.com/ja/jp-ni/otkr/2/#L10">黙. 2:10</a>）歩まれる</h4><p>続いて、キリストにおいて生まれることの目的が語られます。それは善い業です。</p><blockquote><p>「なぜなら、わたしたちは神に造られたものであり、しかも、神が前もって準備してくださった<strong><mark>善い業</mark>のために、キリスト・イエスにおいて造られたからです</strong>。わたしたちは、その善い業を行って歩むのです」（<a href="https://bibleox.com/ja/jp-ni/ef/2/#L10">エフェ. 2:10</a>）</p></blockquote><p>聖書のほかの箇所で語られているとおり、これらの善い業なしには救われることはできません。行いの伴わない信仰は死んだものであり（<a href="https://bibleox.com/ja/jp-ni/iak/2/#L20">ヤコ. 2:20</a>）、人は行いによって義とされるのであって、信仰だけによるのではなく（<a href="https://bibleox.com/ja/jp-ni/iak/2/#L24">ヤコ. 2:24</a>）、すべての人が裁かれ（<a href="https://bibleox.com/ja/jp-ni/2kor/5/#L10">２コリ. 5:10</a>）、その裁き自体も行いに従って行われるからです（<a href="https://bibleox.com/ja/jp-ni/2kor/5/#L10">２コリ. 5:10</a>; <a href="https://bibleox.com/ja/jp-ni/ef/6/#L7-8">エフェ. 6:7-8</a>）。</p><p>このように、人類にひとたび開かれた救いは、信仰によってだけでなく行いによっても自分のものとしなければならず、それは上にすでに示したとおり、一つの過程であり、しかも困難な過程であって、多くの人はその目標に達しないのです。</p><blockquote><p>「<strong>狭い戸口から入るように努めなさい</strong>。言っておくが、<strong><mark>入ろうとしても入れない人が多いのだ</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/lk/13/#L24">ルカ. 13:24</a>; <a href="https://bibleox.com/ja/jp-ni/mf/7/#L14">マタ. 7:14</a>; <a href="https://bibleox.com/ja/jp-ni/mf/7/#L13">マタ. 7:13</a>）</p></blockquote><h3>賢い盗賊は信じることができただけで、何の行いもしなかったのか</h3><p>盗賊は、旧約のイスラエルの一員として、神との旧い契約のうちにあって、救い主への信仰によって救われます。しかも、何かを行うこともできたのです。</p><p>なぜ旧い契約のうちにあってなのでしょうか。キリストは聖霊によって洗礼を授けると書かれており（<a href="https://bibleox.com/ja/jp-ni/lk/3/#L16">ルカ. 3:16</a>; <a href="https://bibleox.com/ja/jp-ni/mf/3/#L11">マタ. 3:11</a>; <a href="https://bibleox.com/ja/jp-ni/mk/1/#L8">マコ. 1:8</a>）、キリストは昇天の後に聖霊を遣わすと約束されたからです（<a href="https://bibleox.com/ja/jp-ni/in/16/#L7">ヨハ. 16:7</a>; <a href="https://bibleox.com/ja/jp-ni/in/14/#L16">ヨハ. 14:16</a>; <a href="https://bibleox.com/ja/jp-ni/in/14/#L26">ヨハ. 14:26</a>; <a href="https://bibleox.com/ja/jp-ni/in/7/#L38-39">ヨハ. 7:38-39</a>）。すなわち五旬祭（ペンテコステ）にです。盗賊に悔い改めと洗礼が宣べ伝えられたことは何も書かれておらず、盗賊の上に聖霊が降ったことも何も書かれていません（のちのほかの古代のキリスト者たちの場合とは違います）。このように、賢い盗賊は、教会が形づくられる前に、洗礼と聖体の機密なしに、まだ旧い契約のうちにあって救われたのです。</p><p>しかし、盗賊もまた一つの行いをしました。自分に下された罰を、自分が本当に受けるべきものとして謙遜に受け入れ、悔い改めにふさわしい実を結んだのです（<a href="https://bibleox.com/ja/jp-ni/mf/3/#L8">マタ. 3:8</a>）。</p><blockquote><p>「<strong>我々は、自分のやったことの報いを受けているのだから、当然だ</strong>。しかし、この方は何も悪いことをしていない」（<a href="https://bibleox.com/ja/jp-ni/lk/23/#L41">ルカ. 23:41</a>）</p></blockquote><p>神に不平を言わず、ほかに責める相手を探さず、人を断罪せずに、苦しみを謙遜に忍ぶことは、キリスト者の行いです（<a href="https://bibleox.com/ja/jp-ni/pr/3/#L11">箴. 3:11</a>）。わたしたちの先祖は堕落した後、自分ではなくほかの者を、そして一部は神をさえ責め始めました。</p><blockquote><p>「アダムは答えた。『<strong>あなたがわたしと共にいるようにしてくださった女が、木から取って与えたので、食べました</strong>。』主なる神は女に向かって言われた。『何ということをしたのか。』女は答えた。『<strong>蛇がだましたので、食べてしまいました</strong>』」（<a href="https://bibleox.com/ja/jp-ni/gen/3/#L12-13">創. 3:12-13</a>）</p></blockquote><p>しかし盗賊は自分を責め、罰を負いました。これは行いであり、しかもキリスト教の精神にまことにふさわしい行いです。</p><p>盗賊であった彼は、偉大な者の一人として栄光を受けるのではなく、救い主の右や左に備えられた座を受けるのでもありませんが（<a href="https://bibleox.com/ja/jp-ni/mk/10/#L40">マコ. 10:40</a>）、信仰によって、そして少なくとも自分が行うことのできたこの小さな行いによって救われます。ですから、盗賊にもやはり信仰だけでなく行いがあるのです。</p><p>また注目すべきなのは、盗賊が自分で自分を救われた者と宣言しているのではなく、キリストが彼について判決を下しておられることです。盗賊の言葉には、救いの確信はまったく見られません。むしろ彼は、自分が神と共にある永遠の命に達しないことを悟っており、それゆえ、憐れみへのつつましい希望だけを抱いて、キリストが御国に入られるとき（盗賊自身の考えでは、そのとき自分はそこにいないのですが）自分を思い出してくださるよう願っているのです。</p><h3>「主の名を呼び求める者はだれでも救われる」</h3><blockquote><p>「『主の名を呼び求める者はだれでも救われる』のです」（<a href="https://bibleox.com/ja/jp-ni/rim/10/#L13">ロマ. 10:13</a>）</p></blockquote><blockquote><p>「主の名を呼び求める者は皆、救われる」（<a href="https://bibleox.com/ja/jp-ni/act/2/#L21">使. 2:21</a>）</p></blockquote><p>救いにはただ主を呼び求めるだけで十分なのか、どのように呼び求めようと、何をしようと、だれもが結局救われるのか、という考えで戸惑うことがあるかもしれません。実際には、ここでの「だれでも」という語は、ユダヤ人だけでなく、どの民族の人でも救われることができるという意味です。</p><p>使徒はこの言葉を引用しているだけです。もともとこの言葉は、旧約で、将来についての預言としてユダヤ人に語られたものでした。そして今、使徒は語られたことを思い起こし、この言葉が成就する時が来たことを指摘しているのです。旧約では、この言葉は預言者ヨエルによって語られました。</p><blockquote><p>「しかし、<strong>主の御名を呼ぶ者は皆、救われる</strong>。主が言われたようにシオンの山、エルサレムには逃れ場があり主が呼ばれる残りの者はそこにいる」（<a href="https://bibleox.com/ja/jp-ni/iol/3/#L5">ヨエ. 3:5</a>）</p></blockquote><p>預言者の言葉は、神はイスラエル人だけを救われると確信していたイスラエルの民に向けられています。そしてイスラエルの民に、イスラエル人だけでなく、神を呼び求める者はだれでも（どの民族も）救われる時が来るという預言が与えられるのです。</p><p>つまり、これは神がイスラエルの民とだけ結ばれた旧い契約の言葉であり、新しい契約は、神がすべての民族を招き入れられた教会との契約です。教会では、もはや民族は問題にならないからです（<a href="https://bibleox.com/ja/jp-ni/kol/3/#L11">コロ. 3:11</a>）。文脈からもまっすぐにわかるとおり、ここで語られているのはまさにこのこと、すなわち救いには民族は関係ないということです。</p><blockquote><p>「聖書にも、『<strong>主を信じる者は</strong>、だれも失望することがない』と書いてあります。<strong><mark>ユダヤ人とギリシア人の区別はなく</mark></strong>、すべての人に同じ主がおられ、御自分を呼び求めるすべての人を豊かにお恵みになるからです。『<strong><mark>主の名を呼び求める者はだれでも救われる</mark></strong>』のです」（<a href="https://bibleox.com/ja/jp-ni/rim/10/#L11-13">ロマ. 10:11-13</a>）</p></blockquote><p>聖書のほかの部分は、その必要性を失いません。</p><p>どうすれば救われるのでしょうか。戒めを守りなさい、と主は言われます。</p><blockquote><p>「もし命を得たいのなら、<strong>掟を守りなさい</strong>」（<a href="https://bibleox.com/ja/jp-ni/mf/19/#L17">マタ. 19:17</a>）</p></blockquote><p>これは、神を呼び求めることについての言葉によって取り消されるでしょうか。もちろん取り消されません。</p><p>水と霊とによって生まれない者は神の国を見ることも、そこに入ることもできないと言われています。これも取り消されません。</p><blockquote><p>「イエスは答えて言われた。『はっきり言っておく。人は、新たに生まれなければ、<strong>神の国を見ることはできない</strong>。』&lt;…&gt; イエスはお答えになった。『はっきり言っておく。だれでも水と霊とによって生まれなければ、<strong>神の国に入ることはできない</strong>』」（<a href="https://bibleox.com/ja/jp-ni/in/3/#L3,5">ヨハ. 3:3,5</a>）</p></blockquote><p>聖体機密についての言葉も取り消されません。それなしには、人は自分の内に命を持つことができず、終わりの日に（神と共にある命へと）復活させられることもできません。</p><blockquote><p>「イエスは言われた。『はっきり言っておく。<strong>人の子の肉を食べ、その血を飲まなければ、</strong><strong>あなたたちの内に命はない</strong>。わたしの肉を食べ、わたしの血を飲む者は、永遠の命を得、<strong>わたしはその人を終わりの日に復活させる</strong>』」（<a href="https://bibleox.com/ja/jp-ni/in/6/#L53-54">ヨハ. 6:53-54</a>）</p></blockquote><p>ニコライ派や多くの異端者たちも神を呼び求めます。しかし、異端者や分派の者として、彼らは御国を失うよう断罪されています。</p><blockquote><p><em>「肉の業は明らかです。それは、姦淫、わいせつ、好色、偶像礼拝、魔術、敵意、争い、そねみ、怒り、利己心、</em><strong><em>不和</em></strong><em>*、</em><strong><em>仲間争い</em></strong><em>（ギリシア語 αἱρέσεις —「異端」）、ねたみ、泥酔、酒宴、その他このたぐいのものです。以前言っておいたように、ここでも前もって言いますが、このようなことを行う者は、神の国を受け継ぐことはできません」（</em><a href="https://bibleox.com/ja/jp-ni/gal/5/#L19-21"><em>ガラ. 5:19-21</em></a><em>）</em></p><p><strong><em>*不和（διχοστασίαι）— 分裂、分かれ離れること。</em></strong></p></blockquote><p>つまり、「だれでも」とは、ユダヤ人だけでなく、どの民族の人でも、という意味です。使徒は教会についてこう語っています。</p><blockquote><p>「今は、そのすべてを、すなわち、怒り、憤り、悪意、そしり、口から出る恥ずべき言葉を捨てなさい。&lt;…&gt; 造り主の姿に倣う新しい人を身に着け、日々新たにされて、真の知識に達するのです。そこには、<strong><mark>もはや、ギリシア人とユダヤ人</mark>、割礼を受けた者と受けていない者、<mark>未開人、スキタイ人</mark>、奴隷、自由な身分の者の区別はありません</strong>。キリストがすべてであり、すべてのもののうちにおられるのです」（<a href="https://bibleox.com/ja/jp-ni/kol/3/#L8,10-11">コロ. 3:8,10-11</a>）</p></blockquote><h3>「身代わりのいけにえ」</h3><p>信仰のみによる（行いなしの）救いの教えの支持者たちの中には、「身代わりのいけにえ」という救いの理論を語る人々がいます。それは次のような意味です。イサクが生きるために、イサクの代わりに小羊がいけにえとして献げられたように、罪人が生きるために、罪深い人間の代わりにキリストがいけにえとして献げられた。こうして、父なる神は御子の上に怒りを注がれるので、信じる罪人に対してはもはや怒っておられない。そして今や、信じる罪人には、神と共にある命への妨げは何もない、というのです。</p><p>身代わりのいけにえという考えは、真理と何の関係もないように思われます。それは、問題は神の側にある（神が罪人に怒っておられる）という誤った前提から出発しています。そして神を正すために（それ自体なんと大胆な考えでしょう）、御子が死ななければならない。人間のほうはまったく自分を正す必要がない。神は御子に対して怒られ、こうして（あたかも神の側にあるかのような）問題が取り除かれるからだ、というのです。このような理論は、常識に反するので、真理として受け入れることはできません。問題が神の側にないことは明らかです。汚れたものは何一つ、神と共にある永遠の命に入ることはできないのです。</p><blockquote><p>「この都には、それを照らす太陽も月も、必要でない。&lt;…&gt; しかし、<strong>汚れた者、忌まわしいことと偽りを行う者はだれ一人、決して都に入れない</strong>。小羊の命の書に名が書いてある者だけが入れる」（<a href="https://bibleox.com/ja/jp-ni/otkr/21/#L23,27">黙. 21:23,27</a>）</p></blockquote>

  - src: спасутся-не-все
    path: Nt2b_すべての人が救われるわけではない
    title: すべての人が救われるわけではない
    title_sub: すべての人が救われるわけではないことを示す聖書の引用
    meta_desc: 「この世に蒔かれた人々がすべて救われるわけではない」（エズラ記（ラテン語）8:41）
    menu: { parent: "教会/救い", title: "すべての人が救われるわけではない", priority: 9 }
    body: |-
      <h2>多くの人が救われない</h2><blockquote><p>「狭い戸口から入るように努めなさい。言っておくが、入ろうとしても<strong>入れない人が<mark>多い</mark>のだ</strong>」（<a href="https://bibleox.com/ja/jp-ni/lk/13/#L24">ルカ. 13:24</a>）</p></blockquote><blockquote><p>「狭い門から入りなさい。<strong>滅びに通じる門は広く</strong>、その道も広々として、<strong>そこから入る者が<mark>多い</mark></strong>。しかし、<strong>命に通じる門はなんと狭く</strong>、その道も細いことか。<strong>それを見いだす者は少ない</strong>」（<a href="https://bibleox.com/ja/jp-ni/mf/7/#L13-14">マタ. 7:13-14</a>）</p></blockquote><h2>信じる者がだれでも救われるわけではない</h2><blockquote><p>「<strong>わたしに向かって、『主よ、主よ』と<mark>言う者が皆</mark>、天の国に入るわけではない</strong>。わたしの天の父の御心を行う者だけが入るのである」（<a href="https://bibleox.com/ja/jp-ni/mf/7/#L21">マタ. 7:21</a>）</p></blockquote><blockquote><p>「かの日には、大勢の者がわたしに、『主よ、主よ、わたしたちは御名によって<strong>預言し</strong>、御名によって<strong>悪霊を追い出し</strong>、御名によって<strong>奇跡をいろいろ行った</strong>ではありませんか』と言うであろう。そのとき、わたしはきっぱりとこう言おう。『<strong><mark>あなたたちのことは全然知らない。不法を働く者ども、わたしから離れ去れ</mark></strong>』」（<a href="https://bibleox.com/ja/jp-ni/mf/7/#L22-23">マタ. 7:22-23</a>）</p></blockquote><blockquote><p>「農夫が地に多くの種を蒔き、多くの苗を植えるが、時が来ても、蒔かれたものがすべて無事に芽を出すわけでなく、植えられたものがすべて根づくわけでもない。それと同じく、この世に蒔かれた人々が<strong>すべて救われるわけではない</strong>」（<a href="https://bibleox.com/ja/jp-ni/3ezd/8/#L41">３エズ. 8:41</a>）</p></blockquote>
