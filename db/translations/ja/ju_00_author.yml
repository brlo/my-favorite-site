    title: ユスティノス（哲学者）、2世紀
    title_sub: 致命者（〜100-165）、哲学者
    meta_desc: 2世紀のキリスト教護教家、ユスティノス（哲学者、致命者）の生涯と信仰：ロゴスの教え、三一の神、モーセの律法の意味、洗礼と聖体、復活と終末、そして古代の教父たちの証し。
    menu: { parent: "2世紀", title: "ユスティノス（哲学者）、致命者（〜100-165）", priority: 2, replace: "哲学者ユスティノス殉教者（～100-165）" }
    update: true
    body: |-
      <p>ユスティノスの著作をギリシア語原文で読むには<a href="https://bibleox.com/ja/grc/w/Ιουστίνος-ο-Φιλόσοφος-Μάρτυς">こちら</a>。ほかの言語への切り替えは、著作の一覧の上でもできます。</p><p><strong>記憶日</strong>：6月1日（新暦6月14日）</p><h2>生涯</h2><p>サマリアの古い都シケムに生まれました。ユスティノスの両親は、異邦人であるギリシア人でした。聖なる方は、幼いときから、深い知性と、学問への愛と、真理を知ることへの燃えるような渇望とによって際立っていました。彼はギリシア哲学のさまざまな流れ——ストア派、ペリパトス派、ピタゴラス派、プラトン派——を完璧に会得し、これらの異邦の教えのどれ一つとして、真の神を知る道を開くものはないと確信するに至りました。</p><p>あるとき、都の外の静かな場所を散歩しながら、真理を知る道をどこに求めるべきかを考えていたとき、ある老人に出会いました。その人は、長い対話の中で、キリストの教えの本質をユスティノスに明らかにし、生のすべての問いの解決を聖書の中に求めるようにと助言しました。</p><p>30歳のとき、ユスティノスは聖なる洗礼を受けました（133年と137年の間）。そのとき以来、聖なる方は、自分の賜物と広範な哲学的知識を、異邦人たちの中での福音の告げ知らせに捧げました。彼はローマ帝国を巡り歩き、あらゆるところで救いの信仰の種を蒔き始めました。ユスティノスは、キリスト教の哲学を宣べ伝える学び舎を開きました。彼は、キリストの教えの真理と救いの力を一貫して擁護し、異邦の思惟（たとえば、キニコ派の哲学者クレセンセスとの問答において）も、キリスト教の異端的な歪曲（とりわけ、グノーシス主義者マルキオンの教えに反対して発言しました）も、説得力をもって反駁しました。</p><p>155年頃、アントニヌス・ピウス帝（138-161）がキリスト者たちへの迫害を開始したとき、聖なるユスティノスは、不当にも死刑に処されたキリスト者たち——プトレマイオスとルキウス、そして第三の人の名は知られていません——を擁護する『弁明書』を、自ら皇帝に献げました。『弁明書』の中で彼は、キリスト者たちに対して着せられる告発の偽りを、「不当に憎まれ、迫害されているキリスト者たちの名において」証明しました。</p><p>エフェソでは、聖なるユスティノスと、ラビであるトリュフォンとの問答が行われました。キリストの哲学者は、旧約の預言の書に基づいて、キリスト教の信仰の真理を証明しました。この論争は、聖なるユスティノスが『ユダヤ人トリュフォンとの対話』という著作の中で叙述しています。</p><p>聖なるユスティノスの『第二の弁明書』は、ローマの元老院に向けられていました。それは161年、マルクス・アウレリウス（161-180）の即位の直後に書かれました。彼の弁明書の中には、異邦人たちにとっては、まさに哲学がキリスト教の先駆者であったという思想が初めて現れます。興味深いことに、ここには、当時受け入れられていた洗礼と聖体の実践についての情報も含まれています。ユスティノスの筆に属するものとして、今日まで伝わっていない大きな著作、いわゆる「すべての異端への反駁（シンタグマ）」もあります。</p><p>イタリアへと帰る途上、聖なるユスティノスは、使徒たちのように、あらゆるところで福音を宣べ伝え、多くの人をキリストの信仰へと立ち帰らせました。『ユスティノスの行為録』によれば、ローマに滞在していた日々に、彼とその六人の弟子たちは逮捕され、クイントゥス・ユニウス・ルストゥクス（163-168）——ストア派の哲学者であり、皇帝マルクス・アウレリウスの教師であった人物——総督の裁判の前に立ちました。致命者が従っている教えについての総督の問いに、彼は答えました。「わたしはあらゆる教えを知ろうと努めました。しかし、偽りの智慧を好む人たちには受け入れられないけれども、キリスト者たちの真の教えに身を委ねたのです」。ユスティノスは、「世界の造り主であり、すべての被造物の創造者である神」を、また「預言者たちが、その方が人類への救いの告げ知らせ、善い教えの教師として来るであろうと前もって告げ知らせていた、神の若い子、主イエス・キリスト」への信仰を告白しました。ユスティノスとその弟子たちが、決然として自分をキリスト者と告白した後、総督ルストゥクスは、鞭打ちと処刑の後に天に上がると確信しているかと尋ねました。「耐え抜くなら、忍耐によって望んでいます。しかし、正しく生きた人たちの上にも、神の恵みが留まることを知っています」——と致命者は答えました。総督の脅しにもかかわらず、致命者たちは偶像への献げ物をすることを拒み、その後に鞭打たれ、首を切られました。</p><p>ユスティノスの死への、キニコ派のクレセンセスの関与についての、文学の中に広まっている意見は、これについてのエウセビオス（カイサリアの）の証言に基づいています。しかし、『ユスティノスの行為録』を含むあらゆる確かな情報源がこれについて沈黙しているので、ユスティノスに敵対していたクレセンセスが、彼の逮捕と死に関与していたかどうかを決定することはできません。</p><h2>信仰</h2><h3>ユスティノス致命者が、キリスト者の老人から受け取ったキリストの信仰を明らかにする</h3><blockquote><p>誰も答えませんでした。そこでわたしは語り始めました。</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2D_ユダヤ人トリュフォンとの対話">『ユダヤ人トリュフォンとの対話』</a>）</p><h2>神</h2><h3>神の限りない性質</h3><blockquote><p>むしろ、自分の国の中に——それがどんなものであれ——留まっておられます。明確に見て、聞いておられます。目によってでも、耳によってでもなく、語り難い力によって。そうすれば、その方はすべてを見、すべてを知っておられます。そして、わたしたちの誰もその方から隠れていません。その方は動かず、ある場所によっても、世界全体によってさえも測られません。なぜなら、その方は、世界が造られる前に存在しておられたからです。</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2D_ユダヤ人トリュフォンとの対話">『ユダヤ人トリュフォンとの対話』</a>）</p><h3>神の名</h3><blockquote><p>しかし、万物の父、生まれない方には、確定した名がありません。もしある名で呼ばれるなら、彼より先に立って彼に名を与えた誰かがいることになるからです。父、神、造り主、主、御主という言葉は、名ではなく、その恵みと業から取った呼び名です。そして彼の子——ただ彼だけが固有に子と呼ばれ、言葉（ロゴス）と呼ばれる方——は、被造物に先立って彼と共にあり、彼から生まれ、初めに彼が万物を造り整えたとき、共におられました。</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2C2_弁明書第二">『弁明書 第二』</a>）</p><h3>神は同質である</h3><blockquote><p>すなわち、すべての被造物に先立つ始まりとして、神がご自身からある理性ある力を生み出されたこと。この力は、聖なる霊によって、主の栄光とも、子とも、知恵とも、御使いとも、神とも、主とも、言葉とも呼ばれています。そしてその方ご自身が「軍勢の長」と呼んでおられます。その方が人の姿のうちにヨシュアに現れたとき。その方には、これらすべての呼び名があります。父の意志への奉仕のゆえに、そして父の意志によっての誕生のゆえに。わたしたち自身の中に、これに似たものを見ないでしょうか。わたしたちは、何か言葉を発するとき、それを生み出しますが、しかし切り離すことによってではありません。そうすれば、言葉を発するときに、わたしたちの中の言葉は減ることになるでしょうから。同じように、わたしたちは、火からもう一つの火が生じるのを見ます。しかしそれによって、点火したものは減らず、同じままでありながら、そこから点火されたものは実際に存在し、点火したものを減らすことなく輝くのです。わたしの証人は、知恵の言葉であり、その方ご自身であり、父から生まれた神である言葉、そして知恵、そして力、そして生んだ方の栄光です。それはソロモンを通してこう語っています。「わたしがあなたたちに、毎日起こることを告げ知らせるなら、昔から存在するものを数え上げましょう。主はわたしを、その方の道の始まりとして、その業のために造られました。その方はわたしを、世の前に、初めに、地を造られる前に、淵を造られる前に、水の源々が生じる前に、山々が堅く据えられる前に基礎づけられました。すべての丘に先立って、その方はわたしを生み出します。</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2D_ユダヤ人トリュフォンとの対話">『ユダヤ人トリュフォンとの対話』</a>）</p><h3>神には一つの意志がある</h3><blockquote><p>——聖書に向かって——とわたしは言いました。わたしは、聖書の中でアブラハムに、ヤコブに、モーセに現れたと提示され、神と呼ばれる方が、万物の造り主なる神とは異なる方であることを——数において異なるのであって、意志において異なるのではありません。わたしは主張します。</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2D_ユダヤ人トリュフォンとの対話">『ユダヤ人トリュフォンとの対話』</a>）</p><h3>神は三位である</h3><blockquote><p>私たちが正しくこの方を礼拝していることを、これから証明いたします。人々は、不変で永遠なる神、万物の父の後に、十字架につけられた人間に第二の位を与えることを、私たちの狂気だと非難します。しかし彼らは、ここに含まれている秘義を知らないのです。</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2C1_弁明書第一">『弁明書 第一』</a>）</p><h3>神の子は、父から分離した神ではない</h3><blockquote><p>しかし、証明されています。御使いたちは存在し、常に留まっており、自分たちが生じたものへと再び解かれることはありません。そして、預言の言葉が神とも——これは完全に証明されています——御使いとも呼ぶあの力が、ただ名においてだけで（太陽の光のように）別のものとみなされているのではなく、数において別のものであることについては、わたしはすでに簡潔に論じました。</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2D_ユダヤ人トリュフォンとの対話">『ユダヤ人トリュフォンとの対話』</a>）</p><h3>神の子は、神から特別な仕方で生まれた</h3><blockquote><p>しかし、わたしたちが、神の言葉である彼が、神から特別な仕方で、普通の誕生を超えて生まれたと言うなら、先に述べたとおり、エルメスを神からの使者である言葉と呼ぶあなたたちと、これを共有させましょう。そして、キリストが十字架につけられたと反論する人がいるなら、これも先に挙げた、あなたたちのいうゼウスの子たちと共有されることです。</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2C1_弁明書第一">『弁明書 第一』</a>）</p><h3>人として神がおとめから生まれた</h3><blockquote><p>——その方についても「見よ、おとめは腹の中に孕み、子を生む」と語られています——とわたしは言いました。イザヤが語っていた方、すなわちイザヤがその方のことがおとめから生まれるはずであったと語っていた方でないなら、聖なる霊は誰について「見よ、主ご自身がしるしを与えます。見よ、おとめは腹の中に孕み、子を生む」と叫んだのでしょうか。もしその方が、すべてのほかの初生の子たちのように交わりから生まれるはずであったなら、なぜ神ご自身が、すべての初生の子たちに共通ではないしるしを与えると言われたのでしょうか。しかし、真にしるしであるもの、全人類の信仰の主題であるべきもの——すべての被造物の中の初生の子がおとめの胎から自分の肉を取り、真に若い子となること——について、イザヤは、預言の霊を通して、あなたたちに叙述したような、異なる仕方で前もって告げ知らせました。それが成就するときに、それが万物の造り主の力と意志によって起こったことを知るためです。ちょうど、エバがアダムの一つの肋骨から生み出され、ほかのすべての動物たちが初めに神の言葉によって造られたのと同じように。しかし、あなたたちはここでも、プトレマイオス——エジプトの王——のもとであなたたちの長老たちが行った訳を歪める勇気を持ち、聖書の中には、彼らが訳したとおりではなく、「見よ、若い女は腹の中に孕む」と語られていると言っています。あたかも、女が男との交わりから生むなら、大いなることが示されたかのように。これはすべての若い女たちが行うことです。不妊の者たちを除いては。しかし、望まれるなら、神は、これらの者たちさえも生むことができるようにする力を持っています。サムエルの母は、以前は生まなかったのに、神の意志によって生みました。聖なる族長アブラハムの妻についても、そして洗礼者ヨハネを生んだエリサベトについても、そしてあるほかの人たちについても同じことが言えます。それゆえ、あなたたちは、神が望むものをすべて成し遂げることができないと考えるべきではありません。</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2D_ユダヤ人トリュフォンとの対話">『ユダヤ人トリュフォンとの対話』</a>）</p><blockquote><p>実際、先のユダヤ戦争では、叛乱の指導者バル・コクバが、イエス・キリストを否認して冒涜の言葉を吐かない限り、キリスト者だけを恐ろしい刑罰にかけるよう命令しました。この預言者たちの書物の中で私たちは、イエスなる私たちのキリストが来ること、おとめから生まれて成長すること、あらゆる病気とあらゆる患いを癒やし、死人を復活させること、憎まれ、わかられないままであり、十字架につけられて死に、復活して天に昇り、神の子であること、また神の子と呼ばれることを予告したのを見出します。さらに、ある人たちが彼によってあらゆる国民にこれらのことを宣べ伝えるために遣わされ、ユダヤ人よりもむしろ異邦人のほうに多くの人々が彼を信じること、これも預言されていました。これらのことは彼が現れる前、最初は5000年、次いで3000年、さらに2000年、1000年、そしてまた800年前に預言されたのです。なぜなら、世代の継起に応じて、次々と預言者たちが現れていたからです。</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2C1_弁明書第一">『弁明書 第一』</a>）</p><blockquote><p>。もしある人と交わったなら、その人はもはやおとめではないからです。神の力がそのおとめに降り、これに影を垂れて、おとめのまま身ごもるようにしたのです。そして当時そのおとめのもとに遣わされた神の御使いたちは、こう告げ知らせました。「見よ、あなたは聖霊によって身ごもり、男の子を産む</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2C1_弁明書第一">『弁明書 第一』</a>）</p><h3>キリストは神である</h3><blockquote><p>あなたは、このキリストが世の前に存在する神であり、その後に生まれることを喜ばれ、人となられたと言っています。そして、その方が人たちから生まれたただの人間ではない、と。これはわたしには奇妙であるばかりでなく、不合理に見えます。</p><p>…</p><p>——わたしは知っています——とわたしは答えました——これが奇妙に見えるのは、特に、あなたたちの種族の中の、その方たちが神聖なものを理解し、行うことを決して望まず、あなたたちの教師たちの伝承だけに従ってきた人たちにとって。神ご自身がこれを告げ知らせておられるのですから。しかし、トリュフォンよ——とわたしは続けました——わたしの証明は、その方が神のキリストであるという点で、無益ではありません。たとえわたしが、その方が神であるとして、初めから、万物の造り主の子として存在し、おとめから人として生まれたことを証明できなかったとしても。</p><p>…</p><p>わたしたちの種族の中には、皆さん——とわたしは語りました——その方をキリストと認めながら、その方を、人たちから生まれたただの人間と呼ぶ人たちがいます。わたしは彼らに同意しませんし、同意することもないでしょう。たとえわたしと同じ考えを持つ大多数がこれを語るようになっても。キリストご自身が、わたしたちに、人間の教えを信じるのではなく、至福ある預言者たちによって告げ知らせれたもの、そしてその方ご自身が授けたものを信じるようにと命じられたのですから。</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2D_ユダヤ人トリュフォンとの対話">『ユダヤ人トリュフォンとの対話』</a>）</p><blockquote><p>ん。子のほかにはいません。また子を知る者もいません。父と、子が現す者たちのほかにはいません。」（<a href="https://bibleox.com/ja/jp-ni/mf/11/#L27">マタ. 11:27</a>） 神のロゴスは神の子です。これは前に述べたとおりです。また、この方は御使いとも使徒とも呼ばれます。知るべきことをすべて宣言し、明かされることを明かすために遣わされるからです。主ご自身が言われたとおりです。「わたしを聞く者は、わたしを遣わした方を聞くのです。」（<a href="https://bibleox.com/ja/jp-ni/lk/10/#L16">ルカ. 10:16</a>） これはモーセの書物からも明らかです。そこにはこう書かれています。「神の御使いが、炎の燃える茨の中からモーセに言われました。『わたしは在りて在るもの、アブラハムの神、イサクの神、ヤコブの神、あなたの父祖たちの神である。エジプトへ行って、わたしの民を連れ出しなさい。』」（<a href="https://bibleox.com/ja/jp-ni/ish/3/#L2">出. 3:2</a>、<a href="https://bibleox.com/ja/jp-ni/ish/3/#L6">出. 3:6</a>、<a href="https://bibleox.com/ja/jp-ni/ish/3/#L10">出. 3:10</a>） その後に続くことは、望むなら同じ書物から知ることができます。ここですべてを書き写すことは不可能です。 これらの言葉は、イエス・キリストが神の子であり、神の使徒であることの証しとして書かれています。この方は昔はロゴスであり、ときには火の形で、ときには御使いたちの姿で現れましたが、今は神の御心によって人となり、人類のために、悪霊たちが狂ったユダヤ人たちを通してこの方に負わせたすべての苦しみを忍ばれました。ユダヤ人たちは、モーセの書物に「神の御使いが、炎の燃える茨の中からモーセに言われました。『わたしは在りて在るもの、アブラハムの神、イサクの神、ヤコブの神である』」（<a href="https://bibleox.com/ja/jp-ni/ish/3/#L2">出. 3:2</a>、<a href="https://bibleox.com/ja/jp-ni/ish/3/#L6">出. 3:6</a>） と明確に書かれているにもかかわらず、こう語った方は万物の父であり創造主であると主張しています。それゆえ、預言の霊は彼らを咎めて言います。「イスラエルはわたしを知らず、民はわたしを理解しません。」（<a href="https://bibleox.com/ja/jp-ni/is/1/#L3">イザ. 1:3</a>） またイエスも、前に示したとおり、彼らの間におられたとき言われました。「父を知る者はいません。子のほかにはいません。また子を知る者もいません。父と、子が現す者たちのほかにはいません。」（<a href="https://bibleox.com/ja/jp-ni/mf/11/#L27">マタ. 11:27</a>） こうして、モーセと語ったのは常に万物の父であると考え続けたユダヤ人は、実際に彼と語った方が神の子であり、御使いとも使徒とも呼ばれる方であるのに、預言の霊とキリストご自身から、父をも知らず、子をも知らないと正当に咎められています。子を父と言う者たちは、父をも知らないこと、そして万物の父には子があることを知らないことを、明らかに示しているからです。この子は、神の初めて生まれたロゴスであり、同時に神でもあります。この方は昔、火の姿で、また御使いの姿でモーセや他の預言者たちに現れましたが、今は、前に述べたとおり、あなたがたの統治の時代に、父の御心によって、おとめから人となり、この方を信じる者たちの救いのために、辱めを受けることと苦しむことをも忍ばれました。それは、死んで、よみがえ</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2C1_弁明書第一">『弁明書 第一』</a>）</p><h3>キリストは神であり人である</h3><blockquote><p>ます。そうすれば、あなたたちは、その方を、上から来られた神としても、人の中に存在した人間としても認めることになるでしょう。そして再び来られるとき、刺し貫いた人たちはその方を見て泣くであろうときに。これらの言葉です。「天は神の栄光を告げ知らせ、空はその方の手の業を告げ知らせる。日は日に言葉を吐き出し、夜は夜に知識を告げ知ら</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2D_ユダヤ人トリュフォンとの対話">『ユダヤ人トリュフォンとの対話』</a>）</p><blockquote><p>ん。子のほかにはいません。また子を知る者もいません。父と、子が現す者たちのほかにはいません。」（<a href="https://bibleox.com/ja/jp-ni/mf/11/#L27">マタ. 11:27</a>） 神のロゴスは神の子です。これは前に述べたとおりです。また、この方は御使いとも使徒とも呼ばれます。知るべきことをすべて宣言し、明かされることを明かすために遣わされるからです。主ご自身が言われたとおりです。「わたしを聞く者は、わたしを遣わした方を聞くのです。」（<a href="https://bibleox.com/ja/jp-ni/lk/10/#L16">ルカ. 10:16</a>） これはモーセの書物からも明らかです。そこにはこう書かれています。「神の御使いが、炎の燃える茨の中からモーセに言われました。『わたしは在りて在るもの、アブラハムの神、イサクの神、ヤコブの神、あなたの父祖たちの神である。エジプトへ行って、わたしの民を連れ出しなさい。』」（<a href="https://bibleox.com/ja/jp-ni/ish/3/#L2">出. 3:2</a>、<a href="https://bibleox.com/ja/jp-ni/ish/3/#L6">出. 3:6</a>、<a href="https://bibleox.com/ja/jp-ni/ish/3/#L10">出. 3:10</a>） その後に続くことは、望むなら同じ書物から知ることができます。ここですべてを書き写すことは不可能です。 これらの言葉は、イエス・キリストが神の子であり、神の使徒であることの証しとして書かれています。この方は昔はロゴスであり、ときには火の形で、ときには御使いたちの姿で現れましたが、今は神の御心によって人となり、人類のために、悪霊たちが狂ったユダヤ人たちを通してこの方に負わせたすべての苦しみを忍ばれました。ユダヤ人たちは、モーセの書物に「神の御使いが、炎の燃える茨の中からモーセに言われました。『わたしは在りて在るもの、アブラハムの神、イサクの神、ヤコブの神である』」（<a href="https://bibleox.com/ja/jp-ni/ish/3/#L2">出. 3:2</a>、<a href="https://bibleox.com/ja/jp-ni/ish/3/#L6">出. 3:6</a>） と明確に書かれているにもかかわらず、こう語った方は万物の父であり創造主であると主張しています。それゆえ、預言の霊は彼らを咎めて言います。「イスラエルはわたしを知らず、民はわたしを理解しません。」（<a href="https://bibleox.com/ja/jp-ni/is/1/#L3">イザ. 1:3</a>） またイエスも、前に示したとおり、彼らの間におられたとき言われました。「父を知る者はいません。子のほかにはいません。また子を知る者もいません。父と、子が現す者たちのほかにはいません。」（<a href="https://bibleox.com/ja/jp-ni/mf/11/#L27">マタ. 11:27</a>） こうして、モーセと語ったのは常に万物の父であると考え続けたユダヤ人は、実際に彼と語った方が神の子であり、御使いとも使徒とも呼ばれる方であるのに、預言の霊とキリストご自身から、父をも知らず、子をも知らないと正当に咎められています。子を父と言う者たちは、父をも知らないこと、そして万物の父には子があることを知らないことを、明らかに示しているからです。この子は、神の初めて生まれたロゴスであり、同時に神でもあります。この方は昔、火の姿で、また御使いの姿でモーセや他の預言者たちに現れましたが、今は、前に述べたとおり、あなたがたの統治の時代に、父の御心によって、おとめから人となり、この方を信じる者たちの救いのために、辱めを受けることと苦しむことをも忍ばれました。それは、死んで、よみがえ</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2C1_弁明書第一">『弁明書 第一』</a>）</p><blockquote><p>それゆえ、誰かによって語られた善いものはすべて、わたしたちキリスト者たちのものです。わたしたちは、神の次に、生まれない語り難い神の言葉を敬い愛しているからです。言葉もまたわたしたちのために人となり、わたしたちの苦しみに与る者となり、わたしたちにいやしを与えるためです。</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2C2_弁明書第二">『弁明書 第二』</a>）</p><h3>キリスト（人の体と魂）は、全体において神に属する</h3><blockquote><p>わたしたちのために現れたキリストは、全体において言葉であったからです。</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2C2_弁明書第二">『弁明書 第二』</a>）</p><h2>モーセの律法</h2><h3>キリストは、父の意志を成し遂げるために律法を成し遂げた</h3><blockquote><p>——認めましたし、今も認めます——とわたしは答えました。しかし、わたしは、その方がこれらの設けをすべて、その方ご自身がそれらによって義とされるために行ったとは主張していません。父——万物の造り主、主、神——の意志による経営を成し遂げるためです。</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2D_ユダヤ人トリュフォンとの対話">『ユダヤ人トリュフォンとの対話』</a>）</p><h3>モーセの律法は取り消された</h3><blockquote><p>そうすることによってのみ、わたしたちは、その方を、将来を見る人類を愛する方、あらゆるものに満足される方、正義の裁き手、善い方と認めることができるのです。もしこれに何か異論があるなら、答えてください。皆さん、この事柄についてどう考えていますか。</p><p>誰も答えませんでした。そこでわたしは語り始めました。トリュフォンよ、あなたと、改宗者になろうと望む人たちに、あの老人から聞いた神の教えを語りましょう。あなたたちは見ます。元素たちは無為に留まることなく、安息日を守りません。生まれたとおりのままに留まりなさい。もしアブラハムの前には割礼が必要なく、モーセの前には安息日と祭りと供え物が必要なかったなら、今も——父の御心によって、神の子イエス・キリストが、アブラハムの家系からおとめから、罪なしに生まれた今——それらは必要ありません。そしてアブラハム自身、まだ包皮のないうちに、神に対して持っていた信仰のゆえに義とされ、祝福を受けたと聖書は示しています。割礼は彼が受けたときでも、ただの印としてであって、義とされるためではありませんでした。これを認めるように聖書と事柄そのものがわたしたちに強いるのです。それゆえ、その民についてこう言われたのは正当です。「第八日のうちに割礼を受けないすべての魂は、その民の中から滅ぼされるであろう」（<a href="https://bibleox.com/ja/jp-ni/gen/17/#L14">創. 17:14</a>）。そして女たちの肉の割礼への無能力は、この割礼が、義の業としてではなく、印として与えられたことを証明しています。神は女たちも、すべての聖なる徳あることを行うことができるように造られました。わたしたちは見ます。男と女の体の構成は異なっています。しかし、両者が義あるいは不義であるのはこの基礎の上ではなく、敬虔と徳に対する関係においてだと知っています</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2D_ユダヤ人トリュフォンとの対話">『ユダヤ人トリュフォンとの対話』</a>）</p><h3>モーセの律法の真の意味は象徴的で、永遠であり、キリスト者たちが成し遂げる</h3><blockquote><p>しかし、神が無分別な人たちによって偽りに非難される——あたかもその方が、いつもすべての人に同じ義を教えておられなかったかのように——ことは、あなたたち自身の不敬虔に帰せられるべきです。多くの律法的な設けが無分別で、神にふさわしくないように見えるのは、恵みを受けず、それらを通して、不敬虔で魂の病んでいるあなたたちの民が神によって回帰と霊的悔い改めに召されたこと、そしてモーセの死の後に語られた預言が永遠であることを会得できなかった人たちのことです。このことについては詩篇の中でも語られています、皆さん。しかし、神の命令によって智慧を得たわたしたちがそれらを「蜜よりも、蜜の滴りの甘いものよりも甘い」と認めることは、死さえもわたしたちを主の名から離れさせないという事実から明らかです（<a href="https://bibleox.com/ja/jp-ni/ps/19/#L11">詩. 19:11</a>）。神を信じるわたしたちが「異邦人たちからわたしたちを守るように」とその方に祈ることは、すべての人に知られています（<a href="https://bibleox.com/ja/jp-ni/ps/17/#L14">詩. 17:14</a>）。すなわち、その方を信じる人の中の一人が象徴的に語る悪い偽りの霊たちから、という意味です。そしてわたしたちは常に、イエス・キリストを通して、敬虔に無縁で、かつてわたしたちが拝していた霊たちから守られるようにと、神に祈ります。キリストを通して神に立ち帰った後に、わたしたちが穢れのないものであるように、とのためで</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2D_ユダヤ人トリュフォンとの対話">『ユダヤ人トリュフォンとの対話』</a>）</p><h3>モーセの律法の理由</h3><blockquote><p>——さらに、あなたに尋ねましょう。神はあなたたちの父たちに供え物と献げ物を行うように命じられました。その方がそれらを必要としておられたからですか。それとも、彼らのかたくなさと偶像礼拝への傾きのゆえにですか。</p><p>…</p><p>——聖書は、後者を認めることを強います——とトリュフォンは言いました。</p><p>…</p><p>さらに、あなたたちの民の罪と偶像礼拝のゆえに、神が献げ物を献げるようにと命じたこと——それらが必要だからではなく——については、十二預言者の中の一人アモスを通して、神がこれについて語ることをお聞きください。</p><p>…</p><p>23</a>）。それゆえ、神はあなたたちからの献げ物を受け取らないのです。そして初めから献げ物を立てられたのは、それらが必要だったからではなく、あなたたちの罪のゆえにです。そしてエルサレムと呼ばれる神殿さえ、神は自分の家として認められました。そこで少なくとも神を敬えば、偶像礼拝しないようにとのためです。これはイザヤの言葉によって裏付けら</p><p>…</p><p>それゆえ、もしあなたたちの民のかたくなさのゆえに、割礼がアブラハムから始まり、安息日と献げ物と供え物と祭りがモーセの時代から始まったことが証明されているなら、これらすべては、神の子キリストの到来——その方は父の意志によって、アブラハムの家系から、おとめから、ユダとダビデの部族から生まれ、永遠の律法として、全世界のための新しい契約として来られると預言された方——と共に止まるはずであったでしょう。</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2D_ユダヤ人トリュフォンとの対話">『ユダヤ人トリュフォンとの対話』</a>）</p><blockquote><p>そして、あなたたちの罪と父たちの罪のゆえに、神が——先に言ったとおり、それらを覚えさせるために——安息日を守ることをあなたたちに課し、ほかの命令を課したこと、そして神があなたたちの中の何人かを異邦人のために生かしておいたこと、その方が異邦人たちの中で冒涜されないために——これについては、その方ご自身の言葉があなたたちに証明できるでしょう。エゼキエルを通してこう語られています。「わたしは主、あなたたちの神である。わたしの命令に歩み、わたしの律を守り、エジプトの慣わしに結び付かず、わたしの安息日を聖化せよ。</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2D_ユダヤ人トリュフォンとの対話">『ユダヤ人トリュフォンとの対話』</a>）</p><p>預言者たちは、民の堕落、神への礼拝の捨て方、偶像礼拝への転向のゆえに、安息日を思い起こさせていました：</p><blockquote><p>皆さん、とわたしは答えました。わたしはほかの預言の言葉も省略しましたが、それは、それらがわたしに矛盾するからではありません。しかし、神がすべての預言者たちを通して、モーセを通して命じたのと同じものを命じるなら、それは、あなたたちのかたくなさと神に対する感謝しなさのゆえに、神が同じものを繰り返されるからです。そうすれば少なくともそのことによって、いつかあなたたちが悔い改めてその方に喜ばれるように。子どもたちを霊たちへの献げ物として殺さないように。「泥棒たちの分有者とならず、贈り物を愛し、報いを追い求めず、みなしごを守らず、やもめの裁きに近づかず、手のすべてが血の仕事に満ちないように」（<a href="https://bibleox.com/ja/jp-ni/is/1/#L23">イザ. 1:23</a>、<a href="https://bibleox.com/ja/jp-ni/is/1/#L15">イザ. 1:15</a>）。「シオンの娘たちは、目くばせをしながら、自分たちの服を引きずりながら、かたくなに歩いた」（<a href="https://bibleox.com/ja/jp-ni/is/3/#L16">イザ. 3:16</a>）。「すべての人が迷った、と神は叫ばれる。すべての人が無用なものとなった。智慧ある人はいない、ただ一人もい</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2D_ユダヤ人トリュフォンとの対話">『ユダヤ人トリュフォンとの対話』</a>、28）</p><blockquote><p>そしてなぜ彼らに割礼が与えられたかについては、わたしは先にくわしく説明しました。そして、もしこれまでの言葉があなたたちを説かないなら、この主題をさらに探究します。あなたたちは知っています。モーセの前には、正しい人は誰も、今わたしたちの間で語られているこれらの設けの中の一つも守るための命令を守らず、受け取りませんでした。アブラハムから始まった割礼を除いては。</p><p>——知っています——とその人は言いました。そして、彼らが救われることを認めます。</p><p>——理解してください——とわたしは再び言いました——これらすべての類の命令は、モーセを通して、あなたたちの民のかたくなさのゆえに、神からあなたたちに与えられました。すなわち、あなたたちが、これらの数多くの設けを通して、あらゆる業において常に神を自分の目の前に置き、無敬虔な不敬虔な業に決心しないようにするためです。神はあなたたちに、自分の身に赤い布片を着るようにと命じられました。それを通して神を忘れないためです。そしてさらに、文字が描かれた、小さな羊皮紙の破片からなるアマレットを着けるようにと命じられました。それらの文字は、もちろん、わたしたちが考えるには、聖なるものでした。これは神の側からは、その方についての絶え間ない記憶へのあなたたちの喚起であり、同時にあなたたちの魂の中での責めでもありました。しかし、あなたたちは神への礼拝の記憶を少しも保ちませんでした。むしろこれを通して、偶像に仕えないようにと説かれることさえありませんでした。エリヤの時代には、バアルに膝を曲げなかった人たちを数えるとき、神はただ七千人だけを名指ししました。</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2D_ユダヤ人トリュフォンとの対話">『ユダヤ人トリュフォンとの対話』</a>）</p><h3>安息日ではなく、生涯を神に献げる</h3><blockquote><p>ん。貧しい人たちは福音を告げ知らせ、盲人は見ます。しかし、あなたたちは理解しません。もう第二の割礼が必要になっていますが、あなたたちは自分の肉の割礼について多く考えます。新しい律法は、常に守るべき安息日を守るようにとあなたたちに命じています。しかし、あなたたちは一日に留まって、この命令がなぜあなたたちに与えられたのかを考えずに、自分が敬虔だと考えます。さらに、種なしパンを食べるなら、神の御心を成し遂げたと言いますが、わたしたちの主なる神はこれによって喜ばれるのではありません。あなたたちの中の誰かが、誓いを破ることや盗みにおいて罪あるなら、もはや罪を犯しませんように。姦淫する人なら、悔い改めなさい。そうすれば、その人は神の真の、喜ばれる安息日を守ることになります。穢れた手を持つ人がいるなら、洗いなさい。そうすれば清くなるでしょ</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2D_ユダヤ人トリュフォンとの対話">『ユダヤ人トリュフォンとの対話』</a>）</p><h3>復活の日は安息日よりも偉大である</h3><blockquote><p>続けることができます、皆さん、とわたしは言いました。第八日が第七日よりも多く、このように神によって告げ知らされる神秘を含んでいたことを証明することは。しかし、わたしがほかの主題へと逸れているように見えるのを避けるために——理解してください、願わくは——割礼の血は無効にされ、わたしたちは救いの血を信じました。今は別の契約、シオンから出て来た別の律があります。イエス・キリストは、望むすべての人を割礼されます。かつて予告されたとおり、「石の小刀」によって、「聖なる民、信実を守る民、真実に執着する民、平和を守る民」となるように。</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2D_ユダヤ人トリュフォンとの対話">『ユダヤ人トリュフォンとの対話』</a>）</p><p>ローマ帝国では、この週の日は太陽の日と呼ばれていました：</p><blockquote><p>私たちが受けるすべての恵みについて、私たちは、御子イエス・キリストを通して、また聖霊を通して、万物の造り主を讃美します。「太陽の日」と呼ばれる日には、都市に住む者も村に住む者も、すべての者が一つの場所に集まります。 そして、時間の許す限り、使徒たちの記録、あるいは預言者たちの書物が読まれます。それから、読む者が読み終えると、長が言葉によって教え、これらの美しい事柄に倣うようにと勧めます。その後、私たちは皆が共に立ち上がり、祈りを捧げます。祈りを終えると、前に述べたとおり、パンとぶどう酒と水が運ばれ、長も同じように、自分にできる限り、祈りと感謝を捧げます。民は「アーメン」という言葉で同意を表し、各人への分配と、感謝が捧げられた賜物へのあずかりが行われ、不在の者たちには、輔祭たちを通してそれが送られます。 余裕のある者で、望む者は、それぞれが自分の判断で、与えたいものを与えます。集められたものは長のもとに保管されます。長は、みなしごややもめのため、また病気やその他の理由で困窮している人すべてのため、囚われている人のため、遠くから来た旅人のために、言うならば、必要の中にある人すべてのことを心にかけていま</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2C1_弁明書第一">『弁明書 第一』</a>）</p><h2>救い（ソテリオロギア）</h2><h3>神は人たちを救うために人となられた</h3><blockquote><p>この教えをわたしたちに授けたのは、イエス・キリストです。神から生まれた唯一の固有の子、彼の言葉、初生の子、力であり、その御心によって人となられた方——人類を変化させ回復するためにです。</p><p>…</p><p>ことを、明らかに示しているからです。この子は、神の初めて生まれたロゴスであり、同時に神でもあります。この方は昔、火の姿で、また御使いの姿でモーセや他の預言者たちに現れましたが、今は、前に述べたとおり、あなたがたの統治の時代に、父の御心によって、おとめから人となり、この方を信じる者たちの救いのために、辱めを受けることと苦しむことをも忍ばれました。それは、死んで、よみがえ</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2C1_弁明書第一">『弁明書 第一』</a>）</p><blockquote><p>それゆえ、誰かによって語られた善いものはすべて、わたしたちキリスト者たちのものです。わたしたちは、神の次に、生まれない語り難い神の言葉を敬い愛しているからです。言葉もまたわたしたちのために人となり、わたしたちの苦しみに与る者となり、わたしたちにいやしを与えるためです。</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2C2_弁明書第二">『弁明書 第二』</a>）</p><h3>救いのためには信仰と業が必要である</h3><blockquote><p>私たちに伝えられているのはこうです。神は、人間からの物質的な献げ物を必要とされない、と。私たちが見る通り、すべてを私たちに与えておられるのは、ほかならぬ神ご自身なのですから。私たちは教えられ、確信し、信じています。神に喜ばれるのは、御自身の完全性、すなわち節制と正義と隣人愛と、どんな固有の名によっても呼ばれない神にふさわしいすべてのものにおいて、神に倣う人々だけである、と。また私たちは、神が御自分の善意によって、初めに、形なき物質からすべてを人間のために造られたこと、そして人間がその行いによって神のご計画にふさわしい者とみなされるなら、朽ちることと苦しみとから解放されて、神と共に生き、神と共に治める者とされることを学んでいます。神が初めに、私たちがまだ存在しなかったときに私たちを造られたように、同じように、彼に喜ばれることを選んだ人々を、その選択のゆえに、不朽と、神との交わりとに相応しい者としてくださるだろうと、私たちは考えます。初めに私たちが造られたことは、私たちの業ではありませんでした。しかし、彼に喜ばれることに従うことを私たちが選び取るように、彼は、私たちに授けてくださった理性的な能力によって、私たちを説き、信仰へと導いてくださるのです。そして、すべての人間にとって大切なのは、この教えを知ることを妨げられないことであり、むしろこれに注意を向けるよう促されることだ、と私は考えます。人間の法律には成し遂げられなかったことを、神のロゴスは成し遂げたはずでした。悪霊たちが、各人の中にある多様な悪への傾きを味方につけて、数多くの偽りと不敬虔との告発を撒き散らささえしなければ、ですが。その告発のうち、どれ一つとして私たちに通用するものはありません。</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2C1_弁明書第一">『弁明書 第一』</a>）</p><blockquote><p>す。肉においてアブラハムの種子から出た人たちが——たとえ罪人で不信仰で神に服従しない人たちであっても——疑いなくその方の永遠の王国を与えられると考えながら。その不当性は、聖書そのものによって証明されています。そうでなければ、イザヤはこう語らなかったでしょう。「そして、もし万軍の主がわたしたちに種子を残してくださらなかったなら、わたしたちはソドムとゴモラのようになっていたでしょう」（<a href="https://bibleox.com/ja/jp-ni/is/1/#L9">イザ. 1:9</a>）。そしてエゼキヤ「ノアとヤコブとダニエルが、自分の子たちあるいは娘たちのために願い出るなら、彼らに与えられないであろう。しかし、父は子のゆえに滅びず、子は父のゆえに滅びません。しかし、各人は自分自身の罪のゆえに滅び、各人は自分自身の正しい業によって救われます」（<a href="https://bibleox.com/ja/jp-ni/iez/14/#L14">エゼ. 14:14</a>、<a href="https://bibleox.com/ja/jp-ni/iez/18/#L20">エゼ. 18:20</a>）。そしてイザヤはさらにこう言います。「彼らは、わたしに逆らった人たちの部分を見るであろう。彼らの虫は眠らず、彼らの火は消えないであろう。そして彼らは、すべての肉に対する見せしめとなるであろう」（<a href="https://bibleox.com/ja/jp-ni/is/66/#L24">イザ. 66:24</a>）。そして、わたしたちの主は、その方を遣わされた父と万物の主の意志によって、こう言わないでしょう。「東からも西からも来るであろう。そしてアブラハムと、イサクと、ヤコブと共に、天の御国の中で座に着く。しかし御国の子たちは外の暗さの中へと追い出されるであろう」（<a href="https://bibleox.com/ja/jp-ni/mf/8/#L11">マタ. 8:11-12</a>）。しかしながら、わたしがすでに証明したとおり、悪いものとして前もって知られ、そのようなものとなる人たち——御使いたちと人間たち——は、神の罪のゆえにではなく、各人の自分自身の罪のゆえに不敬虔となるのです。その人が現れるとおり</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2D_ユダヤ人トリュフォンとの対話">『ユダヤ人トリュフォンとの対話』</a>）</p><h3>すべての人は悪への傾きを持っている</h3><blockquote><p>人間の法律には成し遂げられなかったことを、神のロゴスは成し遂げたはずでした。悪霊たちが、各人の中にある多様な悪への傾きを味方につけて、数多くの偽りと不敬虔との告発を撒き散らささえしなければ、ですが。その告発のうち、どれ一つとして私たちに通用するものはありません。</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2C1_弁明書第一">『弁明書 第一』</a>）</p><h3>人たちは善いものと悪いものを見分ける能力を持っている</h3><blockquote><p>そうすればほかの人たちも、わたしたちの業について知り、善いものについての偽りの意見と無知から解放されることができます。彼らは自分自身の罪によって刑罰に値します。</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2C2_弁明書第二">『弁明書 第二』</a>）</p><h3>罪の中での悔い改めの必要性</h3><blockquote><p>。すなわち、自分の罪の中で悔いる人は、神からその赦しを受け取るでしょう。しかし、あなたたちが自分自身を惑わしているのと同じようにではありません。そしてこの点であなたたちに似たほかの何人かの人たちも。彼らは言います。わたしたちは罪人ではあるが、神を知っている。そして主は、わたしたちのために罪をみなさないだろう、と。このことの証明として、わたしたちは、ダビデの、自分の高慢から生じた、ある背きを持っています。それは、後に赦されました</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2D_ユダヤ人トリュフォンとの対話">『ユダヤ人トリュフォンとの対話』</a>）</p><h2>機密</h2><h3>洗礼（新しい生）は水と信仰を通して</h3><blockquote><p>。キリスト——すべての被造物の中の初生の子——は、水と信仰によって、その方によって再生された新しい種族の始まりともなりました。そして十字架の神秘を含む木によって。ちょうど、ノアが自分の家族と共に水の上に浮かびながら、木の上で救われたのと同じように</p><p>…</p><p>。わたしは意味しています。水と信仰と木を通して、整えられ、自分の罪の中で悔い改める人たちが、来る神の裁きを避けるであろうことを</p><p>…</p><p>後、どのような道を通して自分の罪の赦しと、約束された善いものの遺産への望みを受け取ることができるかを知ろうと努めるべきです。そして、この道のほかには道はありません。すなわち、わたしたちのキリストを知り、イザヤが告げ知らせた、罪の赦しのためのあの洗礼で洗礼を受けること。そしてその後に、罪なしに生きるこ</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2D_ユダヤ人トリュフォンとの対話">『ユダヤ人トリュフォンとの対話』</a>）</p><blockquote><p>これを省けば、私の説明が誠実でないと思われるかもしれないからです。私たちの教えと語ることが真実であると納得し、信じて、それに沿って生きることができると約束する人は、過去の罪の赦しを神に請い願うように、祈りと断食をもって教えられます。私たちも彼らと共に祈り、断食します。それから、私たちは彼らを水のある場所へ導きます。彼らは、私たち自身が新しく生まれたのと同じように新しく生まれます。すなわち、万物の父であり主である神と、私たちの救い主イエス・キリストと、聖霊の御名によって、そのとき水で洗われるのです。キリストが言われたからです。「新しく生まれなければ、天の御国に入ることはできません。</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2C1_弁明書第一">『弁明書 第一』</a>）</p><blockquote><p>次に、私たちがキリストによって新しくされた後に、どのように自分自身を神に献げたのかを述べます。これを省けば、私の説明が誠実でないと思われるかもしれないからです。私たちの教えと語ることが真実であると納得し、信じて、それに沿って生きることができると約束する人は、過去の罪の赦しを神に請い願うように、祈りと断食をもって教えられます。私たちも彼らと共に祈り、断食します。それから、私たちは彼らを水のある場所へ導きます。彼らは、私たち自身が新しく生まれたのと同じように新しく生まれます。すなわち、万物の父であり主である神と、私たちの救い主イエス・キリストと、聖霊の御名によって、そのとき水で洗われるのです。キリストが言われたからです。「新しく生まれなければ、天の御国に入ることはできません。」（<a href="https://bibleox.com/ja/jp-ni/in/3/#L3">ヨハ. 3:3</a>） 一度生まれた者が、生んだ母の胎の中へ再び入ることができないのは、誰の目にも明らかです。また、罪を犯した者が悔い改めることによって、どのように罪から解放されるかについては、前に述べたとおり、預言者イザヤを通して告げられています。こう言われています。「身を洗い、清くなりなさい。あなたがたの魂から悪事を取り除き、善を成すことを学び、みなしごのために正義を行い、やもめを弁護しなさい。さあ、来て、共に論じ合いましょう、と主は言われます。あなたがたの罪が緋色のようであっても、わたしは羊毛のように白くし、真紅のようであっても、雪のように白くしましょう。もしわたしの言うことを聞かないなら、剣があなたがたを食い尽くします。主の口がこれを言われたのですから。」（<a href="https://bibleox.com/ja/jp-ni/is/1/#L16">イザ. 1:16-20</a>） そして、このような行いの理由として、私たちは使徒たちから次のことを受け継ぎました。私たちは自分の最初の誕生について知らず、父母の結びつきを通して、必要に迫られて湿った種から生まれ、悪い習慣と堕落した生き方の中で育ちました。それゆえ、必要と無知の子であり続けるのではなく、自由と知識の子となり、過去の罪の赦しを得るために、再び生まれようと望み、罪を悔い改める者の上に、水の中で、万物の父であり主である神の御名が呼びかけられます。この御名だけを、洗いを受ける者を水盤へ導く者が唱えます。なぜなら、誰も表現しがたい神の御名を言い表すことができないからです。もしだれかがあえてその御名があると言おうとするなら、その人は恐るべき狂気を示すことになるでしょう。そして、この洗いは「光照」と呼ばれます。これらのことを学ぶ者が、知性において照らされるからです。 さらに、ポンティウス・ピラトのもとで十字架につけられたイエス・キリストの御名によって、また、イエスにまつわるすべてのことを預言者たちを通して予告した聖霊の御名によって、照らされる者は洗われ</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2C1_弁明書第一">『弁明書 第一』</a>、61章）</p><h3>聖体は、イエス・キリストの真の体と血である</h3><blockquote><p>なぜなら、私たちはこれを普通のパンとして、あるいは普通の飲み物として受けるのではなく、私たちの救い主イエス・キリストが神のロゴスによって肉となり、私たちの救いのために肉と血を持たれたのと同じように、この方のロゴスの祈りを通して感謝が捧げられたこの食べ物から、私たちの血と肉がその養いを受けるのであり、この食べ物は――私たちが教えられたとおり――肉となったイエスの肉と血なのです。使徒たちは、彼らが書いた記録――「福音書」と呼ばれているもの――の中で、自分たちにこのように命じられたと私たちに伝えています。イエスはパンを取り、感謝を捧げて言われました。</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2C1_弁明書第一">『弁明書 第一』</a>、65-67章）</p><blockquote><p>それゆえ、神が過越祭として殺すようにと命じられた小羊の神秘は、キリストの前型でした。その血によって、信じる人たちは、その方への信仰の分量に応じて、自分の家——すなわち自分自身——に油を注ぐのです。神が造られたあの像、すなわちアダムは、神の息吹の住まいでした。</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2D_ユダヤ人トリュフォンとの対話">『ユダヤ人トリュフォンとの対話』</a>）</p><h3>聖体における神への血のない献げ物</h3><blockquote><p>それゆえ、神は、イエス・キリストが行うようにと命じられた、その方の名によってのすべての献げ物——すなわち、パンと杯の聖体の中で、キリスト者たちが地のあらゆる場所で献げるもの——が、その方に喜ばれることを前もって証しされました。そして、あなたたちが献げる献げ物、そしてあなたたちのあの司祭たちを通して献げられるものは、その方が退けられます。</p><p>…</p><p>。わたしは同意します。ふさわしい人たちによって献げられる祈りと感謝だけが、完全な献げ物であり、神に喜ばれるものです。キリスト者たちが献げるようにと教えられているのはまさにこれであり、しかも、乾いたものと液体のものを受け取るときの記憶と共にです。それによって彼らは、神の子が彼らのために負われた受難を思い起こすのです</p><p>…</p><p>その方は異邦人たちにも好意を示され、わたしたちの献げ物はあなたたちのものよりもその方に喜ばれるのですから。</p><p>…</p><p>そして小麦の粉の供え物——らい病人から清められた人たちのために献げるようにと命じられたもの——は、わたしたちの主イエス・キリストが、人々のために負われた受難の記憶のために献げるようにと命じられた、聖体のパンの前型でした。</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2D_ユダヤ人トリュフォンとの対話">『ユダヤ人トリュフォンとの対話』</a>）</p><blockquote><p>私たちは万物の造り主を礼拝しており、教えられたとおり、神は血も献酒も香も必要とされないと言い、あらゆる献げ物において、力の及ぶ限り、祈りと感謝の言葉によって神を頌めているのですから。私たちが学んでいるのは、神にふさわしい唯一の尊敬の仕方はこうだ、ということです。すなわち、私たちの食物のために神が与えてくださったものを火で焼き尽くすのではなく、自分たちの用のためと、必要としている人々のために献げ、神に対しては、感謝の思いを込めて、言葉による荘厳な奉仕と歌をもって、私たちが造られたこと、私たちの生活のためのすべての賜物、さまざまな産物の種類、季節の移り変わりについて感謝を捧げ、また、神への信仰によって、私たちが朽ちないものへの復活を得られますようにと、祈りを捧げることです。このことについての私たちの教師はイエス・キリストです。この方こそ、このために生まれ、ユダヤの総督ポンティウス・ピラトゥスのもとで、ティベリウス・カエサルの治世に十字架につけられました。そして私たちは、この方が真の神ご自身の御子であることを知っており、御父に次いで第二にこの方を、第三に預言の霊を置きます。私たちが正しくこの方を礼拝していることを、これから証明いたします。</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2C1_弁明書第一">『弁明書 第一』</a>）</p><h3>聖体についての言葉</h3><blockquote><p>。「遠くにいる人たちよ、わたしが行ったことを聞け。近くにいる人たちはわたしの力を知る。シオンの中で不義の人たちは懼れ、不敬虔な人たちの上に恐れが襲う。あなたたちに永遠の住まいについて誰が告げ知らせるのでしょうか。正義のうちに歩む人、真実を語る人、不義を憎む人、贈り物から自分の手を引き遠ざける人、血の不正な裁きを聞かないように自分の耳を塞ぐ人、不敬虔なものを見ないように自分の目を閉じる人。その人は高い岩の洞窟の中で住むであろう。パンはその人に与えられ、その人の水は確かであろう。あなたたちは栄光のうちに王を見るであろう。そしてあなたたちの目は遠くを見るであろう。あなたの魂は神への恐れを考えを抱くであろう</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2D_ユダヤ人トリュフォンとの対話">『ユダヤ人トリュフォンとの対話』</a>）</p><blockquote><p>それは、真理を学んだ私たちが、行いによっても善良な国民であり、戒めを守る者であると認められ、永遠の救いを得るためです。祈りを終えると、私たちは互いに接吻を交わして挨拶します。それから、兄弟たちの長のもとに、パンと、水とぶどう酒の杯が運ばれます。長はこれを受け取ると、子と聖霊の御名を通して、万物の父に賛美と栄光を捧げ、神が私たちをこれを受けるに相応しい者としてくださったことを、詳しく感謝をささげます。彼が祈りと感謝を終えると、そこにいる民は皆、「アーメン」と言って同意を表します。「アーメン」はヘブライ語の言葉で、「そのようになりますように」の意味です。長の感謝と民全体の同意の後、私たちが輔祭と呼ぶ人たちが、その場にいる各人に、感謝が捧げられたパンと、ぶどう酒と水とを分け与え、不在の者たちのもとへもそれを運びます。</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2C1_弁明書第一">『弁明書 第一』</a>）</p><h3>礼拝における式</h3><blockquote><p>私たちが学んでいるのは、神にふさわしい唯一の尊敬の仕方はこうだ、ということです。すなわち、私たちの食物のために神が与えてくださったものを火で焼き尽くすのではなく、自分たちの用のためと、必要としている人々のために献げ、神に対しては、感謝の思いを込めて、言葉による荘厳な奉仕と歌をもって、私たちが造られたこと、私たちの生活のためのすべての賜物、さまざまな産物の種類、季節の移り変わりについて感謝を捧げ、また、神への信仰によって、私たちが朽ちないものへの復活を得られますようにと、祈りを捧げることです。このことについての私たちの教師はイエス・キリストです。この方こそ、このために生まれ、ユダヤの総督ポンティウス・ピラトゥスのもとで、ティベリウス・カエサルの治世に十字架につけられました。そして私たちは、この方が真の神ご自身の御子であることを知っており、御父に次いで第二にこの方を、第三に預言の霊を置きます。私たちが正しくこの方を礼拝していることを、これから証明いたします。</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2C1_弁明書第一">『弁明書 第一』</a>）</p><h2>聖なる人たちと聖なるものの敬い</h2><h3>御使いたちを敬う</h3><blockquote><p>しかし、最も真実なる神、義と節制とその他すべての美徳の父であり、あらゆる悪から清いお方については、そうではありません。私たちが礼拝し、崇めるのは、この御父と、御父のもとから出て来て、この教えを私たちに伝えてくださった御子、御子に従い、御子に似せられた他の善き御使いたちの群れ、さらに預言の霊です。これは、言葉と真理とをもって尊敬を捧げることであり、また、私たち自身が教えられたように、学ぼうと望むすべての人に隠しだてなく教えることでもあります。</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2C1_弁明書第一">『弁明書 第一』</a>）</p><h3>十字架を敬う</h3><blockquote><p>十字架は、預言者が予告したとおり、キリストの力と権威の最も大きな象徴です。これは、私たちの観察の及ぶ物事からも見て取れます。世界のすべての物事を考えてみてください。この形なしに何かが成り立ち、互いに結び合うことができるでしょうか。船に「帆」と呼ばれる戦利品の標が損なわれず立っていなければ、海を渡ることはできません。十字形なしに土地を耕すこともできません。地を掘る人たちも職人たちも、この形を持つ道具によってでなければ、仕事をすることはできません。また、人の姿は、理性のない動物たちの姿と、直立して両手を伸ばすことができるという点でのみ異なっています。そして人の顔には、額から伸びたいわゆる鼻があります。この生き物の呼吸はそれによって行われますが、この鼻は、十字の形のほかの何ものでもありません。これについて預言者はこう言っています。</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2C1_弁明書第一">『弁明書 第一』</a>）</p><blockquote><p>全体を焼くようにと命じられた小羊は、キリストが受難するはずであった、あの十字架の受難の象徴でした。小羊を焼くとき、それが十字架の形に置かれるからです。一本の串がその直後を、下の端から頭へと通ります。そしてもう一本が肩の上を横切ります。</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2D_ユダヤ人トリュフォンとの対話">『ユダヤ人トリュフォンとの対話』</a>）</p><h2>死後の行方</h2><h3>魂の死後の存在</h3><blockquote><p>ることと苦しむことをも忍ばれました。それは、死んで、よみがえることによって死を打ち勝つためです。 また、茨の中からモーセに語られた言葉、「わたしは在りて在るもの、アブラハムの神、イサクの神、ヤコブの神、あなたの父祖たちの神である」（<a href="https://bibleox.com/ja/jp-ni/ish/3/#L6">出. 3:6</a>） が意味するのは、彼らが死んでもなお存在し続け、キリストご自身に属する人間である、ということです。なぜなら、彼らはすべての人間の中で最初に、神を探し求めることに励んだ人たちだからです。アブラハ</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2C1_弁明書第一">『弁明書 第一』</a>）</p><p>老人（ユスティノスをキリスト教へと立ち帰らせた人）：</p><blockquote><p>あなたはこのことからこれを知るでしょう。魂はそれ自体が命であるか、あるいは命を受け取るだけであるか、どちらかです。魂が命であるなら、それは自分自身ではなく、ほかの何かを生かすことになります。ちょうど運動が、自分自身よりも、むしろほかの何かを動かすように。しかし、魂が生きていることを否定する人はいないでしょう。もし生きているなら、命であるからではなく、命に与っているからです。何かに与っているものは、それが与っているものとは異なるのです。魂は命に与っています。なぜなら、神が魂が生きることを望まれるからです。そしてそのゆえに、いつか命が絶えることがあり得ます。神が、もはや生きないことを望まれるなら。命であることは魂に固有ではなく、神に固有だからです。しかし、人が常に存在するわけではなく、人の体が常に魂と結び合わされているわけではないように、その結び付きが解かれるべきときに、魂は体を去り、人はもはや存在しません。同じように、魂から、もはや存在すべきでないときに、命の息吹が取り去られ、魂はもはや存在せず、自分が取り去られた同じところへと帰って行くのです。</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2D_ユダヤ人トリュフォンとの対話">『ユダヤ人トリュフォンとの対話』</a>）</p><p>ユスティノス：</p><blockquote><p>わたしを獅子の口から、そしてわたしの謙虚さを独角獣の角から救ってください」——も、その方の本性が何であるか、そしてその方の上に何が起こるはずであったかを指し示し、前もって告げ知らせていました。わたしが先に言ったとおり、その方は、万物の父のもとでの独り子でした。父から、言葉として、そして力として真に生まれた方です。そしてその後に、おとめから人となられました。その方の使徒たちの記録から知っているとおり。その方が十字架の上で死なれたことについても、先に言及しました。「わたしの魂を剣から、わたしの独り子を犬の足から解放してください。わたしを獅子の口から、そしてわたしの謙虚さを独角獣の角から救ってください」は、同じように示していました。その方がどの苦しみから死なれるはずであったかを、すなわち、十字架の磔から。「独角獣の角から」という言葉は、十字架の像を指し示していることを、わたしはすでにあなたたちに説明しました。しかし、その方の魂が、剣から、獅子の口から、犬の足から解放されるようにというその方の願いは、誰もその方の魂を捕らえないようにという祈りでした。そうすれば、わたしたちも、生を去るときに、同じことを、あの神に求めるように。その方は、あらゆる厚かましい悪い御使いを退けることができ、その方がわたしたちの魂を捕らえないようにされます。そして、魂の存在については、わたしは、あなたたちに証明しました。占い女がサウルの要求によってサムエルの魂を呼び出したという事実によって。しかし、同じような正しい人たちと預言者たちの魂もすべて、あの占い女の中で、この事柄そのものから現れる、あの力の権威に服していたように見えます。それゆえ、神は自分の子を通して、わたしたちに、常に正しいものであるように努め、終わりのときに、わたしたちの魂がこのような力に服さないように祈ることを教えています。</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2D_ユダヤ人トリュフォンとの対話">『ユダヤ人トリュフォンとの対話』</a>）</p><blockquote><p>。「神がより多くを与えた人から、より多くを求められる」（<a href="https://bibleox.com/ja/jp-ni/lk/12/#L48">ルカ. 12:48</a>）。かつての統治者たちのそれぞれの終わりを見てください。彼らは万人共通の死に死にました。もし死が感覚のない状態に至ることなら、それはすべての悪人にとって利益でしょう。しかし、生きてきたすべての人のうちに感覚が留まり、すべての人に永遠の刑罰が迫っているなら、わたしが言うことが真実であると確信し、信じることをためらわないでください。実際、ネクロマンシー、汚されていない少年たちによる占い、人間の魂の呼び出し、魔術師たちが呼ぶ夢の導き手や守護精霊、これらのことに携わる人たちのすべての業——それらが、魂が死後も感覚を保つことをあなたたちに説得させるでしょう。死者の魂に取り憑かれ、下へと突き進む人たち——すべての人が狂人、憑依者と呼ぶ人たち——によっても。そして、あなたたちが呼ぶアムピロコス、ドドナ、ピュティアの神託とそのほかの類似のものによっても。エンペドクレスとピタゴラスとプラトンとソクラテスという書き手たちの教えによっても。ホメロスの溝と、死者を見るためのオデュッセウスの降下と、同じことを語ったほかの人たちの意見によっても。少なくとも彼らと同じように、わたしたちの言葉も聞いてください。わたしたちは彼らに劣らず神を信じています。いや、より多く信じています。わたしたちは、死んで土に帰ったわたしたちの体を再び受け取ることを望んでいるからです。神にとって不可能なことは何もない、と確信しているからで</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2C1_弁明書第一">『弁明書 第一』</a>）</p><h3>清算（魂の死後の試練）</h3><blockquote><p>わたしを獅子の口から、そしてわたしの謙虚さを独角獣の角から救ってください」——も、その方の本性が何であるか、そしてその方の上に何が起こるはずであったかを指し示し、前もって告げ知らせていました。わたしが先に言ったとおり、その方は、万物の父のもとでの独り子でした。父から、言葉として、そして力として真に生まれた方です。そしてその後に、おとめから人となられました。その方の使徒たちの記録から知っているとおり。その方が十字架の上で死なれたことについても、先に言及しました。「わたしの魂を剣から、わたしの独り子を犬の足から解放してください。わたしを獅子の口から、そしてわたしの謙虚さを独角獣の角から救ってください」は、同じように示していました。その方がどの苦しみから死なれるはずであったかを、すなわち、十字架の磔から。「独角獣の角から」という言葉は、十字架の像を指し示していることを、わたしはすでにあなたたちに説明しました。しかし、その方の魂が、剣から、獅子の口から、犬の足から解放されるようにというその方の願いは、誰もその方の魂を捕らえないようにという祈りでした。そうすれば、わたしたちも、生を去るときに、同じことを、あの神に求めるように。その方は、あらゆる厚かましい悪い御使いを退けることができ、その方がわたしたちの魂を捕らえないようにされます。そして、魂の存在については、わたしは、あなたたちに証明しました。占い女がサウルの要求によってサムエルの魂を呼び出したという事実によって。しかし、同じような正しい人たちと預言者たちの魂もすべて、あの占い女の中で、この事柄そのものから現れる、あの力の権威に服していたように見えます。それゆえ、神は自分の子を通して、わたしたちに、常に正しいものであるように努め、終わりのときに、わたしたちの魂がこのような力に服さないように祈ることを教えています。</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2D_ユダヤ人トリュフォンとの対話">『ユダヤ人トリュフォンとの対話』</a>）</p><h3>正しい人たちの魂はより良い場所にいて神を見、罪人たちの魂は別の場所で苦しむ</h3><p>ユスティノスは、キリスト教への自分の回帰について語り、キリスト者の老人の言葉を挙げます：</p><blockquote><p>——いいえ、世界そのものが、わたしたちが見たとおり、始まりを受け取ったからです。</p><p>——しかし同時に、わたしは、魂たちが消滅するとは主張しません。それは悪い人たちにとって大いに有利なことでしょうから。それでは、彼らはどうなるのでしょうか。敬虔な人たちの魂はより良い場所にあり、悪い無法な人たちの魂はより悪い場所にあり、ここで裁きの時を待っています。それゆえ、神を見るにふさわしいと認められた人たちは、もはや死にません。そしてほかの人たちは、神が望まれる限りにおいて、存在し刑罰を受けます。</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2D_ユダヤ人トリュフォンとの対話">『ユダヤ人トリュフォンとの対話』</a>）</p><blockquote><p>ます。主の口がこれを言われたのですから。」（<a href="https://bibleox.com/ja/jp-ni/is/1/#L16">イザ. 1:16-20</a>） 「剣があなたがたを食い尽くします」という言葉は、従わない人たちが剣で殺されるという意味ではありません。神の剣とは火であり、悪を行おうと決める者たちは、その火の薪となるのです。だからこそ、「剣があなたがたを食い尽くします。主の口がこれを言われたのですから」と言われているのです。もし預言者が、切ってすぐに役目を終える剣のことを語っていたなら、「食い尽くす」とは言わなかったでしょう。そしてプラトンも、「選ぶ者に責めがあり、神には責めがない」と語るとき、これを預言者モーセから借りて語ったのです。 モーセはすべてのギリシアの著述家たちより古</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2C1_弁明書第一">『弁明書 第一』</a>）</p><blockquote><p>ルキウスが「まさに」と答えると、彼もまた刑場へ連れて行くように命じました。ルキウスは、そのことに感謝さえしました。彼は、このような悪い支配者たちから解放され、天の父であり王のもとへと旅立つことを知っていたからです。さらに第三の人が進み出て、同じように死刑の判決を受けました。</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2C2_弁明書第二">『弁明書 第二』</a>）</p><h3>キリスト者たちは神と共にある生に至る</h3><blockquote><p>よくご留意ください。私たちがこう申し上げるのは、あなた方のためなのです。取り調べの際に否認することは、私たちの手の内にあるのですから。ただ、私たちは偽りによって生きたくないだけです。私たちは永遠で清い命を望み、万物の父であり創造者である神のもとにとどまることを求めて、私たちの信仰を告白することに急いでいます。神に仕える忠実さと、悪の入り込む余地のない神のもとでの命への愛とを、自分の行いによって神の前に証しした人々こそ、このような報いに達することができる、と確信し、信じているからです。これこそ、簡潔に言えば、私たちが期待し、キリストから学び、教えていることです。プラトンもまた、罪人たちはラダマンテュスとミーノスのもとに来て裁かれ、彼らによって罰せられるだろうと言いました。私たちも同じことを主張します。</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2C1_弁明書第一">『弁明書 第一』</a>）</p><h3>キリストは、生きている人たちと死んだ人たちの裁き手である</h3><blockquote><p>このキリストが生きている人たちと死んだ人たちすべての裁き手であることを。同じように、ナタンもダビデにその方についてこう語りました。</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2D_ユダヤ人トリュフォンとの対話">『ユダヤ人トリュフォンとの対話』</a>）</p><h3>ゲヘナは苦しみの場所である</h3><blockquote><p>。しかし、殺した後、魂も体もゲヘナに投げ込むことのできる方を恐れなさい」（<a href="https://bibleox.com/ja/jp-ni/lk/12/#L4">ルカ. 12:4-5</a>）とも言われたことを知っているからです。ゲヘナとは、不正に生きた人たち、そして神がキリストを通して教えたことが起きると信じようとしなかった人たちが苦しめられる場所で</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2C1_弁明書第一">『弁明書 第一』</a>）</p><h3>陰府の中の永遠の刑罰</h3><blockquote><p>わたしたちは、至るところでまず、あなたたちが立てた役人たちに税と課役を支払うよう努めています。彼の命令がそうだからです。あるとき、何人かが彼のもとに来て尋ねました。カエサルに税を納めるべきでしょうか。彼は答えた。「わたしに言いなさい。このコインには誰の姿が刻まれているか」。彼らは言いました。カエサルのものです。彼は彼らに答えた。「それなら、カエサルのものはカエサルに、神のものは神に納めなさい」（<a href="https://bibleox.com/ja/jp-ni/mf/22/#L19">マタ. 22:19-21</a>）。それゆえ、わたしたちはただ一人の神を拝しますが、そのほかの点では、あなたたちを人間の王たちと指導者たちとして認め、喜んであなたたちに仕え、あなたたちが王の権威のもとで健全な判断をも与えられるようにと祈っています。しかし、あなたたちがわたしたちの祈りと率直な説明に耳を傾けないとしても、わたしたちは何の害も受けません。わたしたちは、各人が自分の業に応じて永遠の火で罰され、神から受けた力のぶんだけ報告を求められると信じ、いや、完全に確信しているからです。キリストはこう言われました。「神がより多くを与えた人から、より多くを求められる」（<a href="https://bibleox.com/ja/jp-ni/lk/12/#L48">ルカ. 12:48</a>）。かつての統治者たちのそれぞれの終わりを見てください。彼らは万人共通の死に死にました。もし死が感覚のない状態に至ることなら、それはすべての悪人にとって利益でしょう。しかし、生きてきたすべての人のうちに感覚が留まり、すべての人に永遠の刑罰が迫っているなら、わたしが言うことが真実であると確信し、信じることをためらわないでください。実際、ネクロマンシー、汚されていない少年たちによる占い、人間の魂の呼び出し、魔術師たちが呼ぶ夢の導き手や守護精霊、これらのことに携わる人たちのすべての業——それらが、魂が死後も感覚を保つことをあなたたちに説得させるでしょう。死者の魂に取り憑かれ、下へと突き進む人たち——すべての人が狂人、憑依者と呼ぶ人たち——によっても。そして、あなたたちが呼ぶアムピロコス、ドドナ、ピュティアの神託とそのほかの類似のものによっても。エンペドクレスとピタゴラスとプラトンとソクラテスという書き手たちの教えによっても。ホメロスの溝と、死者を見るためのオデュッセウスの降下と、同じことを語ったほかの人たちの意見によっても。少なくとも彼らと同じように、わたしたちの言葉も聞いてください。わたしたちは彼らに劣らず神を信じています。いや、より多く信じています。わたしたちは、死んで土に帰ったわたしたちの体を再び受け取ることを望んでいるからです。神にとって不可能なことは何もない、と確信しているからで</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2C1_弁明書第一">『弁明書 第一』</a>）</p><blockquote><p>わたしたちは、あなたたちと同じ本性を持ち、あなたたちの兄弟であるにもかかわらず——あなたたちはそれを認めようとせず、自分たちの偽りの威光のゆえに認めたくないのですが——。すなわち、無法で節制のない人たちが永遠の火で罰され、徳ある人たち、キリストのように生きた人たちが、苦しみのない状態で神と共に生きると信じている人たち以外には——わたしはキリスト者となった人たちのことを言っています——どこでも、父や隣人や息子や友人や兄弟や夫や妻から何らかの悪徳を正されようとする人たちは、みな、意志の頑固さと快楽への執着と善に対する無関心によって、そして、いつもわたしたちに敵対し、ウルビクスのような裁判官たちを持っている悪霊たちの奴隷として、狂ったようにわたしたちを死に至らしめるそのような支配者たちに仕立て上げられるのです。しかし、ウルビクスのもとで起きたことのすべてを説明するために、何が起こったかをあなたたちに語りましょう。</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2C2_弁明書第二">『弁明書 第二』</a>）</p><blockquote><p>せん。ちょうど、わたしが、あなたたちが認めていない聖書の箇所からキリストについての証明を挙げようと努めなかったように。先に、預言者エレミヤとエズラとダビデから挙げた箇所です。しかし、あなたたちが今日まで認めている箇所によって証明しました。もしあなたたちの教師たちがこれらの箇所を理解していたなら、確信しなさい、彼らはそれらを消し去ったでしょう。彼らが、イザヤの死に関わる箇所について行ったように。あなたたちは、木の鋸でその人を引き裂いた人です。そしてこれ自体が、キリストについての神秘を指し示していました。その方は、あなたたちの民を二つに分けるはずでした。すなわち、ふさわしい人たちを、聖なる族長たちと預言者たちと共に永遠の王国の中で報いるため。そしてほかの人たちを、すべての民から出た、信じない悔い改めない人たちと共に、その方がすでに言われたとおり、消えることのない火の中の苦しみへと送るため。「東からも西からも来るであろう。そしてアブラハムと、イサクと、ヤコブと共に天の御国の中で座に着く。しかし御国の子たちは外の暗さの中へと追い出されるであろう」（<a href="https://bibleox.com/ja/jp-ni/mf/8/#L11">マタ. 8:11-12</a>）。そしてこれを、わたしはあなたたちに言いました——とわたしは付け加えました——わたしが、真理を語ることだけを考えており、誰も恐れずにこれを語ったでしょう。たとえあなたたちが今、わたしを引き裂いたとしても。わたしは、わたしの同国人たち——サマリヤ人たちのことです——の誰のことも見ませんでした。書面による願い出の中で、カエサルにこう語ったとき。彼らが惑わされていることを。自分の同族のシモン、魔術師を信じながら。彼らは、あらゆる支配と権威と力の上に、その人を神として敬って</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2D_ユダヤ人トリュフォンとの対話">『ユダヤ人トリュフォンとの対話』</a>）</p><h3>刑罰は正義である</h3><blockquote><p>しかし、哲学者たちとされる人たちが言うのと同じことを、誰かが言わないようにしましょう。すなわち、わたしたちが不敬虔な人たちが永遠の火の中で罰されると語ることは空しい言葉であり、かかしにすぎず、わたしたちは恐れによってのみ人々に徳ある生き方を勧めているのであって、それが善く美しいからではない、と。これに短く答えましょう。もしそうでないなら、神は存在しないか、あるいは存在しても人を配慮しておられないか、徳も悪徳も無であるか、先に言ったとおり、立法者たちが自分の良い掟を破る者たちを罰するのは不当だ、ということになります。しかし彼らは不当ではなく、彼らの父は言葉を通して、自分が行うのと同じことを行うように彼らを教えておられます。それゆえ、彼らに倣う人たちも不当なことをしていません。もし誰かが人々の間の異なる律法をわたしたちに突きつけて言うなら、ある人たちにとってこれは善いとされ、あれは悪いとされるが、ほかの人たちには、これらの人たちが悪いとするものが善いとされ、その反対に、あちらで善いとされるものがここでは悪いとされる、と。</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2C2_弁明書第二">『弁明書 第二』</a>）</p><h2>終末論</h2><h3>キリストの到来は二つだけである</h3><blockquote><p>——それなら、神の言葉がわたしたちに認めるように強いるなら——預言に従って、キリストの二つの到来があるはずであること、一つはその方が苦しむ者として、栄えなく、姿のないものとして現れるとき、もう一つは、すべての人の裁き手として栄光のうちに来られるとき——これが先に挙げた聖書の箇所から証明されているなら——わたしたちは、神の言葉が、エリヤを、恐るべき偉大な日の前駆者として告げ知らせたことを認めるべきではないでしょうか。すなわち、その方の第二の到来の前駆者として。</p><p>——はい——とトリュフォンは答えました。</p><p>——そしてわたしたちの主は——とわたしは言いました——その教えの中で、同じことであると教えました。エリヤも来るであろうと言われたとき。そしてわたしたちは、これが成就することを知っています。わたしたちの主イエス・キリストが栄光と共に天から来られるとき。その方の最初の現れの前にも、前駆者がありました。すなわち、エリヤのうちにあった神の霊が、後に、あなたたちの民の中の預言者ヨハネを通して働いたのです。その人の後には、あなたたちの中に、ほかの預言者は現れませんでした。その人はヨルダンの川のところに座りながら、叫びました。「わたしは悔い改めのためにあなたたちに水で洗礼を施します。しかし、わたしよりも強い方が来られます。その方の履物を担ぐのにわたしはふさわしくありません。その方は、あなたたちに聖なる霊と火で洗礼を施されるであろう。その方の手には箕があり、その方は自分の脱穀場を整え、小麦を倉に集め、藁を消えることのない火で焼くであろう」（<a href="https://bibleox.com/ja/jp-ni/mf/3/#L11">マタ. 3:11-12</a>）。この預言者ご自身を、あなたたちの王ヘロデが牢の中に投れました。そして、その方の誕生の日の祝いの間に、その方の兄弟の娘が舞踊によってその方を喜ばせたとき、彼は、彼女が何でも望むものを求めることを許しました。母は少女に、牢の中にいるヨハネの頭を求めるようにと教えました。そして彼女の願いのゆえに、王は、皿の上にヨハネの頭を持って来るようにと送り命じました。それゆえ、わたしたちのキリストも、まだ地の上に生きておられたとき、キリストの前にエリヤが来るはずだと主張する人たちにこう語られました。「エリヤは来るであろう。そしてすべてを整えるであろう。しかし、わたしはあなたたちに言う。エリヤはすでに来た。そして彼らはその方を知らず、自分たちが望むことをその方に対して行った」。そしてさらにこう書かれています</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2D_ユダヤ人トリュフォンとの対話">『ユダヤ人トリュフォンとの対話』</a>）</p><blockquote><p>これらのことも前もって予告されていたことを、私が証明しましょう。預言者エゼキエルはこう語っています。「つなぎ目がつなぎ目に、骨が骨に結び合わされ、肉が再び生え育つでしょう。」（<a href="https://bibleox.com/ja/jp-ni/iez/37/#L7">エゼ. 37:7-8</a>） さらにこう言われています。「すべての膝は主の前に屈み、すべての舌は主を賛美するでしょう。」（<a href="https://bibleox.com/ja/jp-ni/is/45/#L23">イザ. 45:23</a>） 不敬虔な者たちがどのような感覚のうちに、どのように苦しまされるかについても、同じように語られた言葉を聞いてく</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2C1_弁明書第一">『弁明書 第一』</a>）</p><h3>キリストの第二の到来は、復活、裁き、刑罰、報いのために行われる</h3><blockquote><p>これらのことも前もって予告されていたことを、私が証明しましょう。預言者エゼキエルはこう語っています。「つなぎ目がつなぎ目に、骨が骨に結び合わされ、肉が再び生え育つでしょう。」（<a href="https://bibleox.com/ja/jp-ni/iez/37/#L7">エゼ. 37:7-8</a>） さらにこう言われています。「すべての膝は主の前に屈み、すべての舌は主を賛美するでしょう。」（<a href="https://bibleox.com/ja/jp-ni/is/45/#L23">イザ. 45:23</a>） 不敬虔な者たちがどのような感覚のうちに、どのように苦しまされるかについても、同じように語られた言葉を聞いてください。こう語られて</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2C1_弁明書第一">『弁明書 第一』</a>）</p><h3>キリストの第二の到来は、至近の瞬間に起こり得る</h3><blockquote><p>あなたたちは同音異義の言葉によって惑わされています。主の律法が「穢れのない」と呼ばれている場所では、あなたたちは、モーセの後に来るはずの律法ではなく、モーセ自身によって与えられた律法を考えています。しかし、神は「新しい律法と新しい契約」を与えることを約束されています。そして「神よ、あなたの裁きを王に」という詩篇を、あなたたちはソロモンについてのものとしています。彼が王であったからです。しかし、詩篇の言葉は明確に、永遠の王——すなわちキリスト——について宣べ伝えています。キリストは、王、司祭、神、主、御使い、そして人、軍勢の長、石、生まれ来る若者として呼ばれ、まず苦しみを負い、その後に天に上がり、再び栄光と共に来ること、そして最後に、永遠の王国を持つ方であると呼ばれているのですから。わたしはこれをすべての聖書からあなたたちに証明しています。そして、わたしが言ったことをあなたたちが理解できるように、詩篇の言葉を挙げましょう。次のとおりです。「神よ、あなたの裁きを王に、あなたの義を王の子に与えてください。その方はあなたの民を義をもって裁き、あなたの貧しい人たちを分別をもって裁くためです。山々は民のために平和を、丘は義を受け取るように。その方は民の貧しい人たちを裁き、貧しい人たちの子たちを救い、欺く人を卑しめられるであろう。その方は太陽と共に留まり、月の前に、世々限りなく。その方は毛の上の雨のように、地に滴る雫のように来られるであろう。その方の日々の中で、義は立ち上り、月が取り去られない限り、平和の豊かさが。そしてその方は海から海まで、川から地の果てまで統治されるであろう。エチオピア人たちはその方の前に倒れ、その方の敵たちは地を舐めるであろう。タルシシュの王たちは、島々は献げ物を持って来る。テバとサバの王たちは、献げ物を持って来る。そして地のすべての王たちはその方を拝し、すべての民はその方に仕える。なぜなら、その方は貧しい人を強い者から、貧しい人を助け手のない者から解放されたからです。その方は貧しい人と乏しい人を憐み、貧しい人たちの魂を救う。その方はその魂たちを欺きと不正から救い出す。そしてその方の名は彼らの前で尊ばれるであろう。そしてその方は生き、アラビアの黄金がその方に与えられるであろう。そして人たちはその方のために常に祈り、終日、その方を祝福するであろう。地の上には豊かな実りがあり、山々の頂にはその方は高く上げられるであろう。レバノンにはその実りが実り、地の草のように都の中で開花するであろう。その方の名は世々限りなく祝福され、太陽の前に、その名は留まるであろう。そして地の部族はすべて、その方によって祝福され、すべての民はその方を讃めるであろう。主なる神、イスラエルの神は祝福されています。</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2D_ユダヤ人トリュフォンとの対話">『ユダヤ人トリュフォンとの対話』</a>）</p><blockquote><p>た。そして「彼は諸国民の望みとなる」という言葉は、あらゆる国民の中から人々が彼の再臨を待ち望むようになることを示しています。これは皆さん自身も見て、事実によって確かめることができます。人類のあらゆる民族の中に、ユダヤで十字架につけられた方を待ち望む人々がいるのですから。その方が死んだ直後に、ユダヤの地はあなた方に戦利品として引き渡されまし</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2C1_弁明書第一">『弁明書 第一』</a>）</p><h3>ユスティノスは、キリストが自分の生のうちに裁きに来ると考えていた</h3><p>この世代が救われること、あるいはおそらく、まだ生まれていない人たちさえもが救われること。彼はそう考えています：</p><blockquote><p>わたしたちにおいて、悪い霊たちの長は蛇とサタンと悪魔と呼ばれています。これはわたしたちの書を調べることからも知ることができます。彼は、自分の軍勢のすべてと、彼に従う人たちと共に、キリストが預言されたとおり、無限の時代のあいだ苦しむために火の中へ送られるであろう。そして、神がこのことを実行に移すことを引き延ばされるのは、人類のためです。彼は、ある人たちが悔い改めを通して救われることを前もって知っておられるからです。</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2C1_弁明書第一">『弁明書 第一』</a>）</p><h3>キリストは天において王となられた</h3><blockquote><p>彼より前の時代にも、彼と同時代の人たちのうちにも、十字架につけられることによって異邦人たちに喜びをもたらした者は誰もいませんでした。しかし私たちのイエス・キリストは、十字架につけられ、死んだのち復活し、天に昇って王として統治しています。そして使徒たちによってあらゆる国民の中で彼の名において宣べ伝えられた事柄によって、彼に約束された朽ちないものを待ち望む人々に喜びがもたらされているのです。</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2C1_弁明書第一">『弁明書 第一』</a>）</p><h3>キリストの永遠の王国</h3><blockquote><p>です。しかし、あなたたちが今日まで認めている箇所によって証明しました。もしあなたたちの教師たちがこれらの箇所を理解していたなら、確信しなさい、彼らはそれらを消し去ったでしょう。彼らが、イザヤの死に関わる箇所について行ったように。あなたたちは、木の鋸でその人を引き裂いた人です。そしてこれ自体が、キリストについての神秘を指し示していました。その方は、あなたたちの民を二つに分けるはずでした。すなわち、ふさわしい人たちを、聖なる族長たちと預言者たちと共に永遠の王国の中で報いるため。そしてほかの人たちを、すべての民から出た、信じない悔い改めない人たちと共に、その方がすでに言われたとおり、消えることのない火の中の苦しみへと送るため。「東からも西からも来るであろう。そしてアブラハムと、イサクと、ヤコブと共に天の御国の中で座に着く。しかし御国の子たちは外の暗さの中へと追い出されるであろう」（<a href="https://bibleox.com/ja/jp-ni/mf/8/#L11">マタ. 8:11-12</a>）。そしてこれを、わたしはあなたたちに言いました——とわたしは付け加えました——わたしが、真理を語ることだけを考えており、誰も恐れずにこれを語ったでしょう。たとえあなたたちが今、わたしを引き裂いたとしても。わたしは、わたしの同国人たち——サマリヤ人たちのことです——の誰のことも見ませんでした。書面による願い出の中で、カエサルにこう語ったとき。彼らが惑わされていることを。自分の同族のシモン、魔術師を信じ</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2D_ユダヤ人トリュフォンとの対話">『ユダヤ人トリュフォンとの対話』</a>）</p><h3>キリストの王国は、人間の王国ではない</h3><p>致命者ユスティノスは、ローマの権威への手紙の中で、キリスト者たちを擁護し、支配者たちを安らげています。キリスト者たちが待ち望んでいるあの王国はローマを脅かさない、これに脅威を見るべきではない、なぜならそれは人間の王国ではないからです、と：</p><blockquote><p>私たちが御国を待ち望んでいると聞くとき、あなた方は、私たちが人間的な何かの王国について語っていると思い込むかもしれませんが、それは無駄な思い違いです。私たちが語っているのは、神と共に治めることです。それが分かるのは、あなた方が私たちを尋問するとき、私たち自身がキリスト者であると告白することからです。この告白をする者には死刑が待っていると知っていながら、です。もし私たちが人間的な王国を待ち望んでいるのなら、滅びを避けるために否認したことでしょうし、待ち望むものを手にするために身を隠そうと努力したことでしょう。しかし私たちの望みは、今のものに向けられてはいません。それゆえ、私たちが殺されるときにも動じません。すべての者が必ず死すべきことを知っているからです。</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2C1_弁明書第一">『弁明書 第一』</a>）</p><h3>キリストの第二の到来の前の千年</h3><p>ユスティノスの時代には、破壊されたエルサレムにユダヤ人たちが帰ることは、依然として禁じられていました：</p><blockquote><p>」（<a href="https://bibleox.com/ja/jp-ni/is/64/#L9">イザ. 64:9-11</a>） エルサレムが予告されたとおりに荒廃したことは、あなたがたの知るとおりです。また、この都が荒れ果てること、ユダヤ人の誰もそこに住むことを許されないことについては、預言者イザヤによってこう語られました。「彼らの地は荒れ果てています。敵たちは彼らの目の前でその地を食い尽くします。そして彼らの誰も、そこに住む者とはならないでしょう。」（<a href="https://bibleox.com/ja/jp-ni/is/1/#L7">イザ. 1:7</a>） そして、誰もそこにいないようにあなたがたが見張っていること、また入ろうとして捕らえられたユダヤ人には死刑が定められていることを、あなたがたはよく知って</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2C1_弁明書第一">『弁明書 第一』</a>）</p><p>ユスティノスは、エルサレムがユダヤ人たちの蜂起の結果、ローマ人たちによって破壊され、ユダヤ人たちにはエルサレムに住むことが禁じられ、キリスト者たちに対しては残酷な迫害が行われているときに、これについて語っています。ユスティノスはエルサレムの復興と、その中でのキリスト者たちの王国について語りますが、しかし同時に、千年の王国についての言葉を異なって理解するキリスト者たちがいることも言及しています：</p><blockquote><p>あなたは聖書に厳格に従おうと、あらゆる仕方で自分を守ろうとしている、と。それなら言いなさい。あなたたちは本当に、エルサレムのこの場所が再建されることを認めていますか。そして、あなたたちの民が集まり、キリストと共に、族長たちと、預言者たちと、あなたたちの種族から信じた人たちと、同様に、あなたたちのキリストの到来の前に改宗者となった人たちと共に、至福に至ることを望んでいますか。それとも、あなたは、この問答の中で勝者として現れるために、このような認め方に逃げ込んだのですか。</p><p>——わたしはトリュフォンよ、あれほど不幸ではありません——とわたしは答えました——自分が考えているものとは別のことを語るほどには。そしてわたしは、あなたに先に説明しました。わたしと多くのほかの人たちはこれを告げ知らせていることを。あなたたちが完全に確信しているとおり、これが起こるであろうことを。しかし、わたしがあなたに言ったとおり、清く敬虔な心構えを持つキリスト者たちの中に、これを認めない多くの人たちがいます。しかし、キリスト者という名だけを帯びて、実際には無敬虔な不敬虔な異端者である人たちについては、わたしはあなたに示しました。彼らは完全に冒涜的な、無敬虔な、狂ったことを教えていると。しかし、あなたたちは知っていただくために、これをあなたたちだけの前で語っているのではないことを、わたしは、自分の力が許す限り、これらの対話の全体を書物の中で叙述します。その中に、わたしは、あなたたちの前で述べているのと同じ思想を入れます。なぜなら、わたしは、人たちに、あるいは人の教えにではなく、神とその教えに従うことを望むからです。もしあなたたちが、キリスト者と呼ばれながら、これを認めず、アブラハムの神、イサクの神、ヤコブの神を褻る勇気さえ持ち、死者の復活を認めず、自分たちの魂が死の後にすぐに天に取られると考える人たちに出会うなら、彼らをキリスト者と考えないでください。ちょうど、あらゆる健全な判断を持つ人が、サドカイ人たちを、あるいはそれに類する「異端」——ゲニストたち、メリストたち、ハディレヤ人たち、エリヤ人たち、パリサイ人たち、洗礼者たち（わたしが自分の考えを語るのを悪しんで受け取らないでください）——を、ただ名においてのみ、ただ口においてのみ神を拝し、その方ご自身が言われるとおり、心においてその方から遠く離れている、ユダヤ人たち、そしてアブラハムの子たちとは考えないように。しかし、わたしと、すべての点において分別あるキリスト者たちは、体の復活と、エルサレムの中の千年が起こることを知っています。エルサレムは、エゼキヤとイザヤとほかの預言者たちが告げ知らせるように、建てられ、飾られ、大いなるものとなるのです。</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2D_ユダヤ人トリュフォンとの対話">『ユダヤ人トリュフォンとの対話』</a>）</p><p>大事なことです。留意すべきです。使徒ヨハネ（黙示録の作者）に学んだ人たちを含む、I世紀の聖なる教父たちは、エルサレムの中でのキリスト者たちの千年の王国について発言していません。II世紀の作者がI世紀の使徒の孫たちに帰する証し（引用）には、キリストの王国は地の上ではなく、天にあるであろうと語られています。およそIII世紀から、教会は、黙示録の中の千年の王国についての言葉は、使徒ヨハネの観りが示されている黙示録のほかの大部分と同じように、寓意的に理解されるべきだと明確に証ししています。この千年の期間は、主イエス・キリストの第一の到来から第二の到来までの全時間です。引用：<a href="https://bibleox.com/ja/en/w/Millennium-against-Chiliasm">千年の王国（キリズムに反対して）（英語）</a>。</p><p>またユスティノスは、キリスト者たちが待ち望んでいるのは、まさにキリストの第二の到来であること（千年の王国ではなく）、この到来はいつでも起こり得ること、キリストの到来のうち前に残されているのはただ一つだけであること、キリスト者たちが期待しているのは永遠の（千年のではない）王国であって、それは人間の王国に似ていないこと、キリストご自身がすでに天において王となられたことを告げ知らせています。キリストの第二の到来のときには、残されているすべての出来事が起こるはずです。すなわち、すべての人たちのただ一度のすべての復活、ただ一度のすべての裁き、罪人たちの刑罰、正しい人たちへの報い、これらすべてのものの永遠の状態への移行。</p><p>別に、この引用について言わなければなりません：</p><blockquote><p>彼らは完全に冒涜的な、無敬虔な、狂ったことを教えていると。しかし、あなたたちは知っていただくために、これをあなたたちだけの前で語っているのではないことを、わたしは、自分の力が許す限り、これらの対話の全体を書物の中で叙述します。その中に、わたしは、あなたたちの前で述べているのと同じ思想を入れます。なぜなら、わたしは、人たちに、あるいは人の教えにではなく、神とその教えに従うことを望むからです。もしあなたたちが、キリスト者と呼ばれながら、これを認めず、アブラハムの神、イサクの神、ヤコブの神を褻る勇気さえ持ち、死者の復活を認めず、自分たちの魂が死の後にすぐに天に取られると考える人たちに出会うなら、彼らをキリスト者と考えないでください。</p></blockquote><p>ユスティノスは哲学者でした。ここで彼は、プラトンの思想を受け入れ、加工している、当時のグノーシス主義の教えを責めています。そのような教えのいくつかでは、体は精神のための牢獄であり、神からの離脱の帰結とされます。最終的には、これらの精神たちのすべてが、神と共にいる、見えない精神たちの形での、初めの状態へと帰ることが期待されています。哲学者ユスティノスがここで責めているのは、まさにこの古い哲学の教えです。</p><p>正しい人たちの魂が、死の後に、天の父であり王のもとへ（天において王となられたキリストのもとへ）旅立つことを、彼は別の箇所で率直に認めています：</p><blockquote><p>ルキウスが「まさに」と答えると、彼もまた刑場へ連れて行くように命じました。ルキウスは、そのことに感謝さえしました。彼は、このような悪い支配者たちから解放され、天の父であり王のもとへと旅立つことを知っていたからです。さらに第三の人が進み出て、同じように死刑の判決を受けました。</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2C2_弁明書第二">『弁明書 第二』</a>）</p><blockquote><p>——いいえ、世界そのものが、わたしたちが見たとおり、始まりを受け取ったからです。</p><p>——しかし同時に、わたしは、魂たちが消滅するとは主張しません。それは悪い人たちにとって大いに有利なことでしょうから。それでは、彼らはどうなるのでしょうか。敬虔な人たちの魂はより良い場所にあり、悪い無法な人たちの魂はより悪い場所にあり、ここで裁きの時を待っています。それゆえ、神を見るにふさわしいと認められた人たちは、もはや死にません。そしてほかの人たちは、神が望まれる限りにおいて、存在し刑罰を受けます。</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2D_ユダヤ人トリュフォンとの対話">『ユダヤ人トリュフォンとの対話』</a>）</p><h3>ただ一度のすべての復活とただ一度のすべての裁き</h3><blockquote><p>。その方から離れないように。なぜなら、その方の真理と知恵の言葉は、太陽の力よりも強く燃え、輝き、心と精神の深さの中へと進むからです。それゆえ、聖書は語っています。「太陽の上に、その方の名は上るであろう」と。そしてゼカリヤもこう語っています。「日の出、その方の名は」（<a href="https://bibleox.com/ja/jp-ni/zah/6/#L12">ゼカ. 6:12</a>）。そしてその方は、その方についてこう語りました。「部族ごとに泣くであろう」（<a href="https://bibleox.com/ja/jp-ni/zah/12/#L12">ゼカ. 12:12</a>）。もしその方が、第一の到来のときに——栄えない、姿のない、低められたその方の到来——あれほど輝き、あれほどの力を持たれたなら、その方が知られない民は一つもなく、あらゆる民からの人たちが、あらゆるところで悔い改め、以前の悪い生き方から立ち帰ったほどに。悪霊たちさえ、その方の名に服従し、すべての支配と王国が、死んだすべての人たちの名よりも、その方の名を震えさせるほどに。それなら、その方の栄光ある到来のときに、その方は、その方を憎み、不当にもその方から離れた人たちすべてを打たないのでしょうか。そして、その方の追随者たちを安らげ、彼らにすべての期待される善いものを与えないのでしょうか。それゆえ、わたしたちには、このキリストを通して聞くことも、理解することも、救われることも、そして父に属するすべてのものを知ることが与えられました。それゆえ、その方はキリストに言われました。「あなたにとって重要なのは、わたしの僕と呼ばれることです。ヤコブの部族を立て、イスラエルの離散を帰らせるため。わたしは、あなたを民の光とした。あなたが、地の果てまでの彼らの救いとなるためである」（<a href="https://bibleox.com/ja/jp-ni/is/49/#L6">イザ. 49</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2D_ユダヤ人トリュフォンとの対話">『ユダヤ人トリュフォンとの対話』</a>）</p><h3>復活において、人たちは健康な姿で立ち上がる</h3><blockquote><p>た。しかし彼らは、このような業を見て、それらを魔術的な惑わしと考え、その方を魔術師であり民の欺き手と呼ぶ勇気を持ちました。しかし、その方はこれを、その後にその方を信じることになる人たちを説得するために行われました。すなわち、誰かが何らかの体の不完全さを持っていても、その方が伝えられた命令を行うなら、その方は第二の到来のときに、その人を完全な姿で生き返らせ、不死で、朽ちないで、悲しみのないものとするであろう、</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2D_ユダヤ人トリュフォンとの対話">『ユダヤ人トリュフォンとの対話』</a>）</p><h3>自分の体のうちでの復活</h3><blockquote><p>い。わたしたちは彼らに劣らず神を信じています。いや、より多く信じています。わたしたちは、死んで土に帰ったわたしたちの体を再び受け取ることを望んでいるからです。神にとって不可能なことは何もない、と確信しているからで</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2C1_弁明書第一">『弁明書 第一』</a>）</p><h2>雑多の問い</h2><h3>誰が救われ得て、誰が救われ得ないか</h3><p>聖なるユスティノスの考えでは、良心の弱さのゆえに、モーセの律法の守りを離れることを恐れるキリスト者たちも救われ得ます。ユスティノスは、そのような人は、ほかのキリスト者たち（律法を守らない人たち）から分離せず、誰にも律法を守るようにと教えず、強いないなら、救われ得ると考えています：</p><blockquote><p>——わたしの考えるには、トリュフォンよ——とわたしは言いました——そのような人は救われるでしょう。ただし、同じものを守るように、ほかの人たち——すなわち、キリストを通して迷いから割礼された異邦人たち——を、あらゆる仕方で引きずろうと努めず、また、あの設けを守らないなら、彼らは救われ得ないと主張しなければ。ちょうどあなたが対話の初めにしたように。すなわち、わたしがそれらを守らなければ救われないと言ったときに。</p><p>——なぜあなたは言ったのですか。「わたしの考えるには、そのような人は救われるでしょう」と。そのような人たちにとって救いが不可能であると言う人たちがいるのですか。</p><p>——います、トリュフォンよ——とわたしは答えました。彼らは、そのような人たちとの対話においても、食事においてもさえ交わりを持つことを恐れます。しかし、わたしは彼らに同意しません。もし誰かが霊の弱さのゆえに、今守ることができるモーセの設けの中のいくつかを守りたいと望むなら——わたしの考えでは、それらはあなたたちのかたくなさのために与えられたものです——それと同時にキリストに望みを置き、正義と聖性の永遠で本性的な掟を行うなら、キリスト者たちと、信じる人たちと共に生きるなら、しかし、わたしがすでに言ったように、彼らに、自分自身のように割礼を受け、安息日を守るなど、引きずらないなら——そのような人たちを受け入れ、親戚や兄弟として、彼らとすべての点で交わりを持つべきだとわたしは考えます。しかし、トリュフォンよ、もしあなたたちの種族の中の誰かが、このキリストを信じると言いながら、キリストを信じた異邦人たちに、モーセの律法に従って生きるように、あらゆる仕方で強いるか、あるいは彼らとの生における交わりを望まないなら、そのような人たちをわたしも受け入れません。しかし、キリストなる神の告白と律法の守りを結び付けるように、彼らによって説かれた人たちは、救われることができるとわたしは考えます。しかし、その方を信じ、キリストと認めた後に、何らかの理由でユダヤの律法へと立ち帰り、キリストを退け、死の前に悔い改めなかった人たちは、わたしの考えるには、決して救われません。また、アブラハムの種子から出て来た、律法に従って生きる人たちのうち、自分の死の前にこのキリストを信じなかった人たちも救われません。特に、このキリスト自身を信じる人たちを呪い、救いに至り、火の刑罰から解放されるために呪い続けている人たち。憐み、人間愛、神の憐みの測り知れない豊かさは——エゼキヤの言葉によれば——罪を悔いる人を、正しい穢れのない人として受け取ります。しかし、敬虔から、あるいは義から不敬虔と無法へと落ちる人を、罪人、不正な人、不敬虔な人として認めます。それゆえ、わたしたちの主イエス・キリストは言われたのです。「わたしがあなたたちを見出す点において、その点においてわたしはあなたたちを裁く」。</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2D_ユダヤ人トリュフォンとの対話">『ユダヤ人トリュフォンとの対話』</a>）</p><blockquote><p>——わたしに言いなさい——とトリュフォンは尋ねました。モーセによって与えられた律法に従って生きた人たちは、ヤコブ、ハノク、ノアのように、死者の復活のうちに生きるのでしょうか、それとも生きないのでしょうか。</p><p>——皆さん——とわたしは答えました——わたしがエゼキヤの言葉を挙げたとき——「ノアとダニエルとヤコブが、子たちと娘たちのために願い出るなら、彼らに与えられない」（<a href="https://bibleox.com/ja/jp-ni/iez/14/#L14">エゼ. 14:14</a>）——しかし、各人は明らかに、自分自身の義によって救われる——、わたしは、モーセの律法に従って生きた人たちも救われると言いました。なぜなら、モーセの律法の中では、それに聞き従う人たちに、本性において良いもの、聖なるもの、正しいものを行うように命じられているからです。そしてその上で、民のかたくなさのゆえに律法されたものを行うようにと命じられています。律法の下にあった人たちはこれを行いました。それゆえ、普遍的で、本性的な、永遠の善を行った人たちは神に喜ばれるので、彼らもまた、その前に生きた正しい人たち、ノア、ハノク、ヤコブ、ほかの人たちと同じように、復活のときには、わたしたちのキリストを通して救われるでしょう。キリストを、明けの星と月の前に存在し、その後に受肉し、ダビデの家系からのおとめから生まれることを喜ばれた神の子として認めた人たちと共に</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2D_ユダヤ人トリュフォンとの対話">『ユダヤ人トリュフォンとの対話』</a>）</p><h3>自由と運命</h3><blockquote><p>私たちは預言者たちから、それぞれの行いの値に応じて罰と苦難あるいは良い報いが与えられると学び、これを真実として告げます。もしそうでなく、すべてのことが運命によって起きるのであれば、私たちのうちにはまったく自由がなくなってしまいます。運命によって一人は善良に、もう一人は悪に定められているのであれば、前者は称賛に値せず、後者は責められないことになります。さらに、人類が自由な選択によって悪を避け、善を選ぶ力を持たないのであれば、人間は何をなそうとも、何についても責めを負いません。しかし、人間が自由な選択によって正しく歩むこともつまずくこともできるということは、次のように証明できます。同じ一人の人間が正反対の事柄へと移っていくのを、私たちは見るからです。もしその人の善良さや悪が運命によって定められているのであれば、彼はその正反対の両方に及ぶことはできず、幾度も変化することもできなかったでしょう。そうでなければ、ある人たちは善く、ある人たちは悪いということもなかったはずです。そうであれば、運命こそが悪の原因であって、運命はみずからに反することをなすと言うしかなくなるからです。さもなければ、先に述べた命題――すなわち、徳も悪徳も存在せず、善い悪いはただ意見によって区別されるにすぎないという命題――を真実として認めるしかありません。しかし真実の言葉（ロゴス）が示すとおり、これは最大の不敬と不法です。ところで、避けがたい運命として私たちが認めるのは、このことです。</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2C1_弁明書第一">『弁明書 第一』</a>）</p><blockquote><p>それは明らかに全く不合理です。そして人間は運命によって行動するのでも、起きることに耐えるのでもなく、各人が自分の選択によって善を行い、あるいは罪を犯すとわたしたちは考えます。ソクラテスのような善い人たちが迫害され、投獄され、サルダナパロスやエピクロスやその同類が豊かさと栄誉の中で繁栄して見えるのは、悪霊たちの働きによるのです。しかしストア派はこれを理解せず、すべてが運命の必然によって起きると教えました。けれども神は初めに、御使いたちと人間を自由意志をもって造られたので、彼らは自分の罪のゆえに、正義に従って永遠の火の中で刑罰を負うのです。</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2C2_弁明書第二">『弁明書 第二』</a>）</p><h3>七十人訳を優先していた</h3><blockquote><p>——しかし、わたしはあなたたちの教師たちには同意しません——とわたしは言いました。彼らは、プトレマイオス——エジプトの王——のときに、あの七十人の長老たちが正しく訳したことを認めず、自分たちで訳そうと努めているのですから。そして、あなたたちは知っておくべきです。彼らは、プトレマイオスのもとで長老たちが行った訳の中から、この磔にされた方の神性、人間性、そして十字架の死について預言されていたことを明らかに証しする、多くの聖書の箇所を全く消し去りました。わたしはこのような争論の中でこれらの箇所を挙げません。あなたたちの民のすべてがそれらを退けることを知っているからです。しかし、わたしは、あなたたちがまだ認める聖書の箇所に基づいて、自分の探究を進めます。しかし、わたしがあなたたちに挙げた箇所は何であれ、あなたたちはそれらを認めました。ただ「見よ、おとめは腹の中に孕む」という言葉に対して立ち上がり、「若い女は孕む」と語られていると主張したことを除いては。しかし、わたしは、この預言がエゼキヤではなく——あなたたちが教えられたように——このわたしのキリストに関わるものであることを証明すると約束しました。そして今、これに取りかかります。</p><p>——お願いします——とトリュフォンは言いました。まず、少なくとも、あなたが、わたしたちの中で全く消し去られたと語るあの聖書の箇所のいくつかを提示してください、と。</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2D_ユダヤ人トリュフォンとの対話">『ユダヤ人トリュフォンとの対話』</a>）</p><blockquote><p>彼らの預言は、預言者たちがみずからユダヤ語で書物にまとめ、語られたときのままの形で、その時代ごとにユダヤを治めていた王たちが入念に保管していました。しかし、エジプトの王プトレマイオスが図書館を設立し、すべての人々の著作を集めようとしたとき、これらの預言についても耳にして、当時ユダヤを治めていたヘロデのもとに使者を送り、預言の書を送ってくれるよう頼みました。ヘロデ王はこれらの書物を、前述のとおりユダヤ語で書かれたままの形で送りました。ところがエジプト人たちにはその内容が分からなかったので、プトレマイオスは再び使者を送り、それをギリシア語に翻訳する人々を送ってほしいと頼みました。こうして実現し、その書物はエジプト人たちのもとに今日まで留まり、また世界中のあらゆるユダヤ人のところにも伝わっています。</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2C1_弁明書第一">『弁明書 第一』</a>）</p><h3>福音書を「使徒たちの記録」、使徒たちの書物と呼んでいた</h3><blockquote><p>モーセはこれを蛇と呼び、ヨブとゼカリヤは悪魔と呼び、イエスはこれをサタンと呼ばれました。この名が、その人が行った業から造られ、与えられたことを示しながら。なぜなら、「サタ」はユダヤ人たちとシリア人たちの言葉の中で、離反者を意味し、「ナス」は訳の中で蛇の名であるからです。両方の言葉から一つの名が組み立てられます。サタナスと。この悪魔は、イエスがヨルダンの川から出て、声がその方に語りかけたすぐ後に——「あなたはわたしの子である。わたしは今日、あなたを生んだ」——、使徒たちの記録の中に書かれているとおり、その方のもとに来て試み、さらに言いました。「わたしを拝せ」と。しかし、キリストはその人に答えられました。「わたしから離れよ、サタンよ。あなたの神なる主を拝し、その方のみに仕えよ」（<a href="https://bibleox.com/ja/jp-ni/ps/2/#L7">詩. 2:7</a>、<a href="https://bibleox.com/ja/jp-ni/mf/4/#L9">マタ. 4:9-10</a>）。その人がアダムを惑わしたので、キリストに対しても何かができると考えたのです。「わたしのすべての骨は水のように広がり、分離しました。わたしの心は、わたしの内臓の中で溶ける蝋のようになりました」——これらの言葉は、その方を捕らえるためにあの山、オリーブの山へと彼らが出て行ったあの夜に起こったことについての預言です。その方の使徒たちとその追随者たちによって作られた記録の中には——わたしはこう言っています——、その方から、血の雫のように汗が流れたと語られています。その方が祈り、言っていたときに。「もしこれが可能なら、この杯を過ぎさせてください」と。このとき、その方の心は震え、その骨も震えました。心は、その方の内臓の中で溶ける蝋に似せられていました。わたしたちが知るように、父の意志によって、その子が、わたしたちのために、このような苦しみを実際に耐えておられたこと</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2D_ユダヤ人トリュフォンとの対話">『ユダヤ人トリュフォンとの対話』</a>）</p><h3>「黙示録」の書を認めていた</h3><blockquote><p>す。「主の日は千年のようである」（<a href="https://bibleox.com/ja/jp-ni/2pet/3/#L8">２ペト. 3:8</a>）。さらに、わたしたちの中には、ヨハネという名の人がいました。キリストの使徒たちの中の一人です。彼に示された黙示の中で、彼は預言しました。わたしたちのキリストを信じる人たちは、エルサレムの中で千年生きること、そしてその後に、すべての人たちの一般的な、一言で言えば、永遠の復活が起こること、そしてその後に裁きが来ることを。わたしたちの主も言われたとおりです。「彼らは妻を娶らず、嫁がず、御使いたちと同じであり、神の復活の子として」（<a href="https://bibleox.com/ja/jp-ni/lk/20/#L35">ルカ. 20:35-</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2D_ユダヤ人トリュフォンとの対話">『ユダヤ人トリュフォンとの対話』</a>）</p><h3>異端者たち</h3><blockquote><p>——しかし、とトリュフォンは反論しました。わたしは聞いています。イエスを告白し、キリスト者と呼ばれると言う多くの人たちが、偶像に献げられたものを食べ、それから何の害もないと主張している、と。</p><p>——確かに、そのような人たちがいます——とわたしは言いました。彼らは自分をキリスト者と宣言し、十字架につけられたイエスを主でありキリストであると認めながら、その方の教えではなく、偽りの霊たちの教えを宣べ伝えています。しかしこのことのゆえに、わたしたち、イエス・キリストの真で清い教えの弟子たちは、信仰において強く、その方が告げ知らせた望みにおいて堅固になります。なぜなら、その方の名によって行われるであろうとその方が預言されたことの成就を、わたしたちは自分自身で業の中に見ているからです。その方は言われました。「多くの人がわたしの名によって来る。外は羊の皮を着、内は貪欲な狼である」。「分裂と異端が起こるであろう」（<a href="https://bibleox.com/ja/jp-ni/1kor/11/#L19">１コリ. 11:19</a>）。「偽りの預言者たちに注意しなさい。彼らはあなたたちのもとに来る。外は羊の皮を着、内は貪欲な狼である」。「多くの偽キリストが立ち上がり、信じる人たちの中の多くを惑わすであろう」（<a href="https://bibleox.com/ja/jp-ni/mf/24/#L5">マタ. 24:5</a>）。それゆえ、皆さん、イエスの名によって来て、無敬虔で冒涜的なことを語り行うようにと教えた人たちが、今も昔も多くいました。わたしたちは彼らを、その教えや意見が初めに由来した人たちの名によって知っています。彼らの各人は、それぞれの仕方で、万物の父と、その方の到来を前もって告げられたキリストと、アブラハムの神、イサクの神、ヤコブの神を褻るようにと教えるからです。わたしたちは彼らの誰とも交わりません。彼らが無敬虔で、不敬虔で、不正で無法な人たちであり、イエスを拝さず、ただ口においてのみその方を告白していることを知っているからです。彼らは自分をキリスト者と呼んでいます。異邦人たちが神の名を偶像の上に書き、無敬虔な無敬虔な秘儀に与るのと同じよう</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2D_ユダヤ人トリュフォンとの対話">『ユダヤ人トリュフォンとの対話』</a>）</p><blockquote><p>-37</a>）。一人の神を拝すべきことについては、彼はこう説得されます。「最も大きな掟はこれである。お前の神なる主を拝し、ただ主にのみ仕えよ。お前の心をすべてで、お前の力をすべてで、お前を造られた主、神に」（<a href="https://bibleox.com/ja/jp-ni/vtor/6/#L13">申. 6:13</a>）。ある人が彼のもとに来て、「良い教師よ」と言ったとき、彼は答えて言いました。「善い方はただ一人、すべてを造られた神だけである」（<a href="https://bibleox.com/ja/jp-ni/mf/19/#L17">マタ. 19:17</a>）。もし、キリストが教えたとおりに生きない人がいたなら、その人は、キリストの教えを舌で言っているにもかかわらず、キリスト者ではないことが知られるでしょう。彼は、ただ語る者ではなく、業を行う者たちが救われると教えたからです。彼はこう言われました。「わたしに向かって主よ、主よと言う者がみな天の御国に入るのではなく、天にいますわたしの父の御心を行う者が入る。わたしを聞いて、わたしの言うことを行う人は、わたしを遣わされた方を聞いているのである。多くの人がわたしに言うであろう。主よ、主よ、わたしたちはあなたの名によって食べ、飲み、奇跡を行ったではないか。そのときわたしは彼らに言うであろう。わたしから離れよ、無法を働く者たちよ。そのとき、正しい人たちが太陽のように輝き、不正な人たちが永遠の火に送られるようになると、泣き叫び、歯ぎしりするであろう。多くの人がわたしの名によって来る。外は羊の皮を着、内は貪欲な狼である。しかし、あなたたちは彼らの業によって彼らを知るであろう。良い実を結ばない木はすべて切り倒されて火に投げ込まれる」（<a href="https://bibleox.com/ja/jp-ni/mf/7/#L21">マタ. 7:21</a>、<a href="https://bibleox.com/ja/jp-ni/lk/10/#L16">ルカ. 10:16</a>、<a href="https://bibleox.com/ja/jp-ni/lk/13/#L26">ルカ. 13:26-27</a>、<a href="https://bibleox.com/ja/jp-ni/mf/13/#L42">マタ. 13:42-43</a>、<a href="https://bibleox.com/ja/jp-ni/mf/7/#L15">マタ. 7:15-16</a>、<a href="https://bibleox.com/ja/jp-ni/mf/7/#L19">マタ. 7:19</a>）。そして、わたしたちは、彼の教えに従って生きず、ただキリスト者と呼ばれている人たちが、あなたたちによって</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2C1_弁明書第一">『弁明書 第一』</a>）</p><h3>修道生活</h3><blockquote><p>のです。わたしはすべての民の中からそのような人たちを指し示す覚悟があります。乱れから立ち帰り、貞潔を学んだ、数えきれない人たちについて語る必要があるでしょうか。キリストは正しい人たちや貞潔な人たちを悔い改めに招いたのではなく、不敬虔な人たち、節制のない人たち、不正な人たちを招いたのです。彼ご自身がこう言われ</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2C1_弁明書第一">『弁明書 第一』</a>）</p><h3>偽りの預言者たちも奇跡を行い得る</h3><blockquote><p>彼らは万物の造り主、父である神を栄光に包み、その方から遣わされたキリスト、その子について告げ知らせたからです。しかし、偽りの預言者たちは、偽りの霊と穢れの霊に満たされて、これを行いませんでしたし、行っていません。彼らはむしろ、人々を驚かせるためにある奇跡を行うことを敢えてし、偽りの霊たちと霊たちの栄誉を広めます。しかし、あなたはまず何よりも、光の門があなたに開かれるようにと祈りなさい。</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2D_ユダヤ人トリュフォンとの対話">『ユダヤ人トリュフォンとの対話』</a>）</p><h3>物を神々と考えていた異邦人たちを責める</h3><blockquote><p>私たちは、人間が作り、神殿に置いて神々と名付けた者たちのために、数多くのいけにえを献げず、花の花輪を捧げません。彼らは魂を持たず、死んでおり、神の姿を持たないことを、私たちは知っているからです（神が、一部の人々が「礼拝のために神をこのような姿に表した」と言うそのような像に似ているとは、私たちは考えません）。それらの像は、人々の前に現れた悪霊たちの名と姿を持っているにすぎません。しかも、職人が素材を手にかけ、彫り、削り、鋳造し、鍛えるようす、しばしば用をなさなくなった器から、技術によってただ形を変え、望みの姿を与えて、彼らが神と呼ぶものを作り出すようすは、あなた方自身がご存じですから、いまさらお話しするまでもないでしょう。私たちがこれを、理性に反するだけでなく神への侮辱と考えるのは、言葉にし難い栄光と姿とを持たれる神の名が、朽ちること、絶えず手入れを必要とするものに結びつけられるからです。また、これらの職人たちが放埒な人々であり、詳しくは列挙しませんが、あらゆる悪徳に耽っており、自分の仕事を手伝う自分の召使のおとめたちさえ汚していることは、あなた方もよくご存じです。なんという惑溺でしょうか。</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2C1_弁明書第一">『弁明書 第一』</a>）</p><h3>偶像が神と似ていないことを責める</h3><blockquote><p>私たちは、人間が作り、神殿に置いて神々と名付けた者たちのために、数多くのいけにえを献げず、花の花輪を捧げません。彼らは魂を持たず、死んでおり、神の姿を持たないことを、私たちは知っているからです（神が、一部の人々が「礼拝のために神をこのような姿に表した」と言うそのような像に似ているとは、私たちは考えません）。それらの像は、人々の前に現れた悪霊たちの名と姿を持っているにすぎません。しかも、職人が素材を手にかけ、彫り、削り、鋳造し、鍛えるようす、しばしば用をなさなくなった器から、技術によってただ形を変え、望みの姿を与えて、彼らが神と呼ぶものを作り出すようすは、あなた方自身がご存じですから、いまさらお話しするまでもないでしょう。私たちがこれを、理性に反するだけでなく神への侮辱と考えるのは、言葉にし難い栄光と姿とを持たれる神の名が、朽ちること、絶えず手入れを必要とするものに結びつけられるからです。また、これらの職人たちが放埒な人々であり、詳しくは列挙しませんが、あらゆる悪徳に耽っており、自分の仕事を手伝う自分の召使のおとめたちさえ汚していることは、あなた方もよくご存じです。</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2C1_弁明書第一">『弁明書 第一』</a>）</p><h3>断食</h3><blockquote><p>これを省けば、私の説明が誠実でないと思われるかもしれないからです。私たちの教えと語ることが真実であると納得し、信じて、それに沿って生きることができると約束する人は、過去の罪の赦しを神に請い願うように、祈りと断食をもって教えられます。私たちも彼らと共に祈り、断食します。それから、私たちは彼らを水のある場所へ導きます。</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2C1_弁明書第一">『弁明書 第一』</a>）</p><h3>国の律に聞き従う</h3><blockquote><p>わたしたちは、至るところでまず、あなたたちが立てた役人たちに税と課役を支払うよう努めています。彼の命令がそうだからです。あるとき、何人かが彼のもとに来て尋ねました。カエサルに税を納めるべきでしょうか。彼は答えた。「わたしに言いなさい。このコインには誰の姿が刻まれているか」。彼らは言いました。</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Ju2C1_弁明書第一">『弁明書 第一』</a>）</p><h2>古代の著者たちと聖なる教父たちの、ユスティノスについての証し</h2><h3>テルトゥリアヌス（〜155-220）</h3><blockquote><p>わたしたちが、語り、反駁した主題について、恣意的な作り物を用いたなどと、だれかに責められるとは考えません。それらの主題については、聖なる照らされた人たち——異端の祖たちの先達でもあり、同時代人でもあった人たち——が語り、反駁しています。ユスティノス、哲学者にして致命者。ミルティアデス、教会たちの擁護者。エイレナイオス、このような教えのすべてを探究した学ある人。わたしたちのプロクロス、老いたるまでの貞潔の人、キリストの告白の名誉と栄光。神が、信仰のほかの労苦においても、そしてわたしの前に置かれたこの仕事においても、わたしが彼らに並ぶことを賜りますように。</p></blockquote><h3>メトディオス（オリュンピアの）、致命者（〜260-312）</h3><p>ユスティノスを、徳において使徒たちから遠くない男と呼んでいます：</p><blockquote><p>ユスティノス・ネアポリタス——時においても徳においても使徒たちから遠くない男——は、死すべきものが相続されるが、命は相続されず、肉は死ぬが天の御国は生きる、と語っています。</p></blockquote><h3>エピファニオス（キプロスの）、主教（〜315-403）</h3><p>致命者ユスティノス（哲学者）を、聖なる方、神の友と呼んでいます：</p><blockquote><p>タティアノス。タティアノスは、聖なる致命者にして哲学者であるユスティノスの同時代人でした。そして、致命者にして哲学者であるユスティノスの死の後に、マルキオンの弟子となり、その教義によって堕落し、彼と同じことを教え、マルキオンに付け加えるものさえ付け加えました。彼はメソポタミアの出であると語られています。……これらの者の後に、あるタティアノスが立ち上がりました。あるいは、彼らの時代に生きていた人、あるいは彼らの後に自分の空しい教えを提出した人。彼は初めには、エリン人たちの出であり、エリンの教養を持っていたので、ユスティノス（哲学者）の同時代人でした。聖なる人、神の友——サマリヤからキリストを信じた人。このユスティノスは、サマリヤ人であり、キリストを信じ、偉大な労苦を成し遂げ、徳ある生を現し、ついに、ルストゥクス総督とアドリアヌス帝のもとで、キリストのゆえに致命を受け、若い年齢——すなわち三十歳——のうちに完全な栄冠を授けられました。</p></blockquote><h3>ヒエロニムス（ストリドンの）、修道士（〜347-419）</h3><p>ユスティノス（哲学者）の著作を、イグナティオス（テオフォロス）、ポリュカルポス（スミルナの）、エイレナイオス（リヨンの）の著作と並べて置きながら、テルトゥリアヌスは脇に置きます：</p><blockquote><p>しかし、わたしたちの語りが、すでに水下の岩々と危険な場所から抜け出たので、帆を広げて、その方のエピロゴイへと進まなければなりません。その中で、その人は、自分を専門家と考えながら、テルトゥリアヌスを証人として呼び、ペタウィオの主教ヴィクトリヌスの言葉を挙げます。テルトゥリアヌスについては、その人が教会の人ではなかったと言うほかには何も語りません。そしてヴィクトリヌスについては、福音書記者たちについて主張するのと同じことを主張します。すなわち、彼らは主の兄弟たちについて語ったのであって、マリヤの子たちについてではなく、わたしたちが先に示した意味での、本性ではなく親族による兄弟たちについて語った、と。しかし、わたしたちは、つまらないことについて論じています。真理の泉を残して、意見の小さな流れを追いかけながら。わたしは、あなたに、古代の書き手たちの列全体を挙げることができないでしょうか。イグナティオス、ポリュカルポス、エイレナイオス、ユスティノス致命者、そしてほかの多くの使徒的で学ある人たち。彼らは、エビオンにたいして、そしてテオドトスにたいして、ビザンティオンにたいして、ヴァレンティノスにたいして、同じ仕方で論じながら、知恵に満ちた著作を書いたのです。</p></blockquote><blockquote><p>ユスティノス、パレスチナの都ネアポリスの出の哲学者、プリスクスとバキウスの子は、キリストの教えの益のために熱心に労働しました。……ついに、ユスティノスは、キリスト者であったことで告発され、クレセンセスの尽力によって、キリストのために自分の血を注ぎました。</p></blockquote><h3>テオドレトス（キュロスの）（386-457）</h3><p>ユスティノスを聖なる人たちの列に置き、彼が致命者たちの群れを飾ると言い、真理の力強い告げ知らせ手と呼んでいます：</p><blockquote><p>聖なる教父たちの誰が、この同じ教えを宣言しなかったでしょうか。……そして彼の教師アレクサンドロスは、これらの教義〔神について〕のために戦いました。同じような人たちとして、エウスタティオス、メレティオス、フラウィアノス——東方の燈——がいます。エフライム、聖なる霊の琴——日々、恵みの水の流れをもって、シリアの民を潤す人。ヨハネ（クリュソストモス）とアッティコス（コンスタンティノポリスの）——真理の力強い告げ知らせ手たち。そして、これらの中で最も古い人たち、イグナティオス、ポリュカルポス、エイレナイオス、ユスティノス、ヒッポリュトス。そのうちの大部分の人たちは、主教たちの中で輝くばかりでなく、致命者たちの群れをも飾っています。</p></blockquote>
    references: |-
      <p>翻訳原則：本ページは本サイトのロシア語版ページからの翻訳です。ユスティノスの著作からの引用は、すべて本サイトの日本語訳（『弁明書 第一』『弁明書 第二』『ユダヤ人トリュフォンとの対話』）によるもので、該当箇所のリンクを付けました。テルトゥリアヌス、メトディオス、エピファニオス、ヒエロニムス、テオドレトスの言葉は、ロシア語訳を参照して訳しました（本サイトにこれらの日本語訳はありません）。「使徒たちの記録」という呼び方は、ユスティノスが福音書に与えた名前です。人名は本サイトの日本語訳の伝統に従います：ユスティノス（哲学者）、トリュフォン、ポンティウス・ピラトゥス、アントニヌス・ピウス、マルクス・アウレリウス、クレセンセス、エウセビオス（カイサリアの）。</p><p>翻訳：ロジオン・ヴラソフ（AIツールを併用）。</p>
