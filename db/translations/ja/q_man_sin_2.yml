    body: |-
      <h2>異端の定義</h2><p><strong>異端</strong>（古代ギリシア語 <a href="https://bibleox.com/ru/words/%CE%B1%CE%B9%CF%81%CE%B5%CF%83%CE%B9%CF%82">αἵρεσις</a> — 方向、教え、学派、選択）とは、先行する教えの考えに基づいて、たいていそれに対立して後から生じた別の教えです。異端の支持者たちは、自分たちが分かれ出た教えを誤りと見なし、相手からも同じ反応を受けます。</p><p>聖書の文脈では、教えのどんな重大な歪曲も異端と見なされました：</p><ul><li><p><strong>ファリサイ派</strong> — 救いについての誤った教え。彼らは多くの点で、救いを外的な規定の正確な遵守に帰着させていました。</p></li><li><p><strong>サドカイ派</strong> — 霊的な現実についての誤った教え。彼らは霊的な現実、すなわち体の死後の魂の生、霊と天使の存在、死者の復活を否定しました。</p></li><li><p><strong>ヒメナイとフィレトの教え</strong> — 復活についての誤った教え。彼らは復活はすでに過去に起こったと教えました。</p></li><li><p><strong>ニコライ派</strong> — 道徳生活についての誤った教え。彼らは肉体の放縦を許しました。</p></li></ul><p>これらの異端はすべて神についての教えに直接関わるものではなく、教えのほかの点に関わるものですが、それでも異端なのです。</p><h2>異端は救いを奪う罪である</h2><blockquote><p>「肉の業は明らかです。それは、姦淫、わいせつ、好色、偶像礼拝、魔術、敵意、争い、そねみ、怒り、利己心、不和、<strong><mark>仲間争い</mark></strong>、ねたみ、泥酔、酒宴、その他このたぐいのものです。以前言っておいたように、ここでも前もって言いますが、<strong>このようなことを行う者は、<mark>神の国を受け継ぐことはできません</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/gal/5/#L19-21">ガラ. 5:19-21</a>）<em>（「仲間争い」は、ギリシア語原文では αἱρέσεις —「<strong>異端</strong>」です。「不和」は διχοστασίαι —「分裂」です。）</em></p></blockquote><blockquote><p>「兄弟たち、あなたがたに勧めます。<strong>あなたがたの学んだ教えに反して</strong>、<strong>不和やつまずきをもたらす人々を警戒しなさい</strong>。彼らから遠ざかりなさい。<strong>こういう人々は、<mark>わたしたちの主であるキリストに仕えないで</mark></strong>、自分の腹に仕えている。そして、うまい言葉やへつらいの言葉によって純朴な人々の心を欺いているのです」（<a href="https://bibleox.com/ja/jp-ni/rim/16/#L17-18">ロマ. 16:17-18</a>）</p></blockquote><p>誤った教えは神へと導きません：</p><blockquote><p><em>「だれであろうと、</em><strong><em><mark>キリストの教えを越えて</mark>、これにとどまらない者は、<mark>神に結ばれていません</mark></em></strong><em>。その教えにとどまっている人にこそ、御父も御子もおられます」（</em><a href="https://bibleox.com/ja/jp-ni/2in/1/#L9"><em>２ヨハ. 1:9</em></a><em>）</em></p></blockquote><blockquote><p>「<strong>よこしまな考えは人を神から遠ざけ</strong>、主の力は、試そうとする愚か者の罪深さを暴く」（<a href="https://bibleox.com/ja/jp-ni/prs/1/#L3">知. 1:3</a>）</p></blockquote><h2>イエス・キリストの反対者たちは、キリストの教えを異端の一つと受け止めた</h2><p>キリストの使徒たちを訴える者たちは、キリストの教えをナザレ人の異端と呼んでいます（キリストはナザレで育たれました、<a href="https://bibleox.com/ja/jp-ni/in/1/#L45-46">ヨハ. 1:45-46</a>）：</p><blockquote><p>「実は、この男は疫病のような人間で、世界中のユダヤ人の間に騒動を引き起こしている者、<strong>『ナザレ人の分派』</strong>の主謀者であります」（<a href="https://bibleox.com/ja/jp-ni/act/24/#L5">使. 24:5</a>）<em>（ギリシア語 τῆς τῶν Ναζωραίων αἱρέσεως —「ナザレ人の<strong>異端</strong>の」）</em></p></blockquote><p>使徒たちは、ファリサイ派とサドカイ派が自分たちの教えを異端と見なしていることを認めています：</p><blockquote><p>「しかしここで、はっきり申し上げます。私は、<strong>彼らが『分派』と呼んでいるこの道に従って</strong>、先祖の神を礼拝し、また、律法に則したことと預言者の書に書いてあることを、ことごとく信じています」（<a href="https://bibleox.com/ja/jp-ni/act/24/#L14">使. 24:14</a>）<em>（ギリシア語 ἣν λέγουσιν αἵρεσιν —「彼らが<strong>異端</strong>と呼んでいる」）</em></p></blockquote><p>最高法院では、キリストの教えは多くの教えの一つと見なされています。ファリサイ派のガマリエルは新しい教えの例を挙げます：</p><blockquote><p>「ところが、民衆全体から尊敬されている<strong>律法の教師で、ファリサイ派に属するガマリエルという人</strong>が、議場に立って、使徒たちをしばらく外に出すように命じ、それから、議員たちにこう言った。『イスラエルの人たち、あの者たちの取り扱いは慎重にしなさい。<strong>以前にも<mark>テウダが</mark>、自分を何か偉い者のように言って<mark>立ち上がり</mark>、その数四百人くらいの男が彼に従ったことがあった</strong>。彼は殺され、従っていた者は皆散らされて、跡形もなくなった。<strong>その後、住民登録の時、ガリラヤの<mark>ユダが立ち上がり</mark>、民衆を率いて反乱を起こしたが</strong>、彼も滅び、つき従った者も皆、ちりぢりにさせられた』」（<a href="https://bibleox.com/ja/jp-ni/act/5/#L34-37">使. 5:34-37</a>）</p></blockquote><p>こちらも参照：<a href="https://bibleox.com/ja/jp-ni/lk/23/#L2">ルカ 23:2</a>、<a href="https://bibleox.com/ja/jp-ni/in/7/#L12">ヨハ 7:12</a>。</p><h3>なぜキリストの教えは異端ではないのか</h3><p>手短に言えば、キリストが神であり（<a href="https://bibleox.com/ru/ru/w/%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%BE%D1%81-%D0%91%D0%BE%D0%B3">引用</a>）、真理であり（<a href="https://bibleox.com/ja/jp-ni/in/14/#L6">ヨハ. 14:6</a>）、立法者である（「昔の人は…と命じられている。しかし、わたしは言っておく…」 — <a href="https://bibleox.com/ja/jp-ni/mf/5/#L21-22">マタ. 5:21-22</a>）からです。</p><p>キリストの教えが偽りで分離したものと受け止められるのは、イエスをキリストとも神とも考えず、イエスがアブラハム、イサク、ヤコブと語られたまさにその神であり立法者であること（<a href="https://bibleox.com/ja/jp-ni/ish/3/#L15">出. 3:15</a>; <a href="https://bibleox.com/ja/jp-ni/in/8/#L25">ヨハ. 8:25</a>）、イスラエルに律法を与え（<a href="https://bibleox.com/ja/jp-ni/gal/3/#L19">ガラ. 3:19</a>）、イスラエルに預言者たちを遣わされた方であること（<a href="https://bibleox.com/ja/jp-ni/mf/23/#L34">マタ. 23:34</a>）を信じない人々だけです。イエス・キリストは神であるので、立法者として来られ、御自身が与えられた秩序を変え、御自分のぶどう園をほかの人々に与えられたのです（<a href="https://bibleox.com/ja/jp-ni/lk/20/#L16">ルカ. 20:16</a>; <a href="https://bibleox.com/ja/jp-ni/mk/12/#L9">マコ. 12:9</a>）。</p><p>それゆえ、キリストの教えを異端と見なすのはキリストを信じない人々だけであり、キリストを信じる人々はその教えを唯一の真の教えと見なします（<a href="https://bibleox.com/ja/jp-ni/2in/1/#L9">２ヨハ. 1:9</a>; <a href="https://bibleox.com/ja/jp-ni/in/3/#L36">ヨハ. 3:36</a>）。しかしキリストと使徒たちは、自分たちの後に偽りの教えが現れるが、教会に一度伝えられたものは守らなければならないと警告しました：</p><blockquote><p>「聖なる者たちに<strong>一度</strong>伝えられた信仰のために戦うことを」（<a href="https://bibleox.com/ja/jp-ni/iud/1/#L3">ユダ. 1:3</a>）</p></blockquote><h3>イエス・キリストについて語るというだけで、どんな教えも真実なのか</h3><p>使徒たちは、ほかの人々が異なったイエス、異なった福音を宣べ伝え、違った霊を与えることがありうると警告しています：</p><blockquote><p>「<strong>ただ</strong>、&lt;…&gt; <strong>心配しています</strong>。なぜなら、あなたがたは、だれかがやって来て<strong>わたしたちが宣べ伝えたのとは異なったイエスを宣べ伝えても</strong>、あるいは、自分たちが受けたことのない<strong>違った霊</strong>や、受け入れたことのない<strong>違った福音</strong>を受けることになっても、よく我慢しているからです」（<a href="https://bibleox.com/ja/jp-ni/2kor/11/#L3-4">２コリ. 11:3-4</a>）</p></blockquote><h2>異端についての預言</h2><h3>キリスト教の中に多くの異端が生じる</h3><blockquote><p>「<strong>わたしの名を名乗る者が<mark>大勢</mark>現れ</strong>、『わたしがそれだ』と言って、<strong><mark>多くの</mark>人を惑わすだろう</strong>」（<a href="https://bibleox.com/ja/jp-ni/mk/13/#L6">マコ. 13:6</a>）</p></blockquote><blockquote><p><em>「</em><strong><em>偽預言者も<mark>大勢</mark>現れ、<mark>多くの</mark>人を惑わす</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/mf/24/#L11"><em>マタ. 24:11</em></a><em>）</em></p></blockquote><blockquote><p><em>「愛する者たち、どの霊も信じるのではなく、神から出た霊かどうかを確かめなさい。</em><strong><em>偽預言者が<mark>大勢</mark></em></strong><em>世に出て来ているからです」（</em><a href="https://bibleox.com/ja/jp-ni/1in/4/#L1"><em>１ヨハ. 4:1</em></a><em>）</em></p></blockquote><p><a href="https://bibleox.com/en/en/w/Didache/">ディダケー</a>（英語、1～2世紀）にも指摘があります：</p><blockquote><p>「<strong>終わりの日々には、偽預言者と堕落させる者が増え</strong>、羊は狼に変わり、愛は憎しみに変わるからである」（<a href="https://bibleox.com/en/en/w/Didache/#HH-16">ディダケー 16</a>、英語。英訳からの訳）</p></blockquote><h3>異端は非常に広く広がる</h3><blockquote><p><em>「</em><strong><em><mark>その言葉は悪いはれ物のように広がります</mark></em></strong><em>。その中には、ヒメナイとフィレトがいます。彼らは</em><strong><em>真理の道を踏み外し</em></strong><em>、復活はもう起こったと言って、ある人々の信仰を覆しています」（</em><a href="https://bibleox.com/ja/jp-ni/2tim/2/#L17-18"><em>２テモ. 2:17-18</em></a><em>）</em></p></blockquote><blockquote><p><em>「かつて、民（イスラエル — 注）の中に偽預言者がいました。同じように、あなたがた（キリスト者 — 注）の中にも偽教師が現れるにちがいありません。彼らは、</em><strong><em>滅びをもたらす異端をひそかに持ち込み</em></strong><em>、自分たちを贖ってくださった主を拒否しました。自分の身に速やかな滅びを招いており、しかも、</em><strong><em><mark>多くの</mark>人が彼らのみだらな楽しみを見倣っています。彼らのために真理の道はそしられるのです</em></strong><em>。彼らは</em><strong><em>欲が深く</em></strong><em>、うそ偽りであなたがたを</em><strong><em>食い物にします</em></strong><em>。このような者たちに対する裁きは、昔から怠りなくなされていて、彼らの滅びも滞ることはありません」（</em><a href="https://bibleox.com/ja/jp-ni/2pet/2/#L1-3"><em>２ペト. 2:1-3</em></a><em>）</em></p></blockquote><h3>異端者の共同体は教会とその信仰の一致から離れる</h3><blockquote><p><em>「子供たちよ、終わりの時が来ています。反キリストが来ると、あなたがたがかねて聞いていたとおり、今や多くの反キリストが現れています。これによって、終わりの時が来ていると分かります。</em><strong><em>彼らはわたしたちから去って行きましたが、もともと仲間ではなかったのです。<mark>仲間なら、わたしたちのもとにとどまっていたでしょう</mark></em></strong><em>。しかし去って行き、だれもわたしたちの仲間ではないことが明らかになりました」（</em><a href="https://bibleox.com/ja/jp-ni/1in/2/#L18-19"><em>１ヨハ. 2:18-19</em></a><em>）</em></p></blockquote><blockquote><p><em>「彼らはあなたがたにこう言いました。『</em><strong><em>終わりの時には</em></strong><em>、あざける者どもが現れ、不信心な欲望のままにふるまう。』この者たちは、</em><strong><em><mark>分裂を引き起こし</mark></em></strong><em>、この世の命のままに生き、霊を持たない者です」（</em><a href="https://bibleox.com/ja/jp-ni/iud/1/#L18-19"><em>ユダ. 1:18-19</em></a><em>）（ギリシア語 οἱ ἀποδιορίζοντες —「自ら分かれる者たち」）</em></p></blockquote><h3>偽教師の目的は、信者を教会から盗み出し、自分の後に従わせることである</h3><blockquote><p><em>「わたしが去った後に、</em><strong><em>残忍な狼どもがあなたがたのところへ入り込んで来て群れを荒らすことが、わたしには分かっています。また、あなたがた自身の中からも、<mark>邪説を唱えて</mark>弟子たちを<mark>従わせようとする者が現れます</mark></em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/act/20/#L29-30"><em>使. 20:29-30</em></a><em>）</em></p></blockquote><h3>偽教師の手口</h3><h4>耳に心地よい教え</h4><p>偽教師たちは耳に心地よい教えを考え出します。まさに聞き手たちが、健全な教えに耐えられず、耳に心地よい教えを求めるからです：</p><blockquote><p><em>「</em><strong><em>だれも健全な教えを聞こうとしない</em></strong><em>時が来ます。そのとき、人々は</em><strong><em>自分に都合の良いことを聞こうと</em></strong><em>、</em><strong><em>好き勝手に<mark>教師たち</mark>を寄せ集め</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/2tim/4/#L3"><em>２テモ. 4:3</em></a><em>）</em></p></blockquote><blockquote><p><em>「しかし、“霊”は次のように明確に告げておられます。</em><strong><em>終わりの時には、<mark>惑わす霊</mark>と、悪霊どもの教えとに<mark>心を奪われ</mark>、信仰から脱落する者がいます</em></strong><em>。このことは、偽りを語る者たちの偽善によって引き起こされるのです。彼らは自分の良心に焼き印を押されており」（</em><a href="https://bibleox.com/ja/jp-ni/1tim/4/#L1-2"><em>１テモ. 4:1-2</em></a><em>）</em></p></blockquote><h4>偽りの敬虔</h4><blockquote><p><em>「しかし、</em><strong><em>終わりの時には</em></strong><em>困難な時期が来ることを悟りなさい。そのとき、人々は自分自身を愛し、金銭を愛し、ほらを吹き、高慢になり、神をあざけり、両親に従わず、恩を知らず、神を畏れなくなります。&lt;…&gt; </em><strong><em><mark>信心を装いながら</mark></em></strong><em>、その実、信心の力を否定するようになります。こういう人々を避けなさい。&lt;…&gt; いつも学んでいながら、決して真理の認識に達することができません。ヤンネとヤンブレがモーセに逆らったように、彼らも</em><strong><em>真理に逆らっています。彼らは精神の腐った人間で、信仰の失格者です</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/2tim/3/#L1-2,5,7-8"><em>２テモ. 3:1-2,5,7-8</em></a><em>）</em></p></blockquote><blockquote><p><em>「</em><strong><em>偽預言者</em></strong><em>を警戒しなさい。彼らは</em><strong><em><mark>羊の皮を身にまとって</mark>あなたがたのところに来るが</em></strong><em>、その内側は貪欲な狼である」（</em><a href="https://bibleox.com/ja/jp-ni/mf/7/#L15"><em>マタ. 7:15</em></a><em>）</em></p></blockquote><h4>奇跡</h4><p>使徒たちと古代のキリスト者たちには、見せ物のためではなく益のために、奇跡を行う力が豊かに与えられました：</p><blockquote><p>「一人一人に“霊”の働きが現れるのは、<strong>全体の益となるため</strong>です」（<a href="https://bibleox.com/ja/jp-ni/1kor/12/#L7">１コリ. 12:7</a>）</p></blockquote><p>少数の漁師たちが、短い生涯のうちに全世界に宣教を広めるには、大きな助けが必要でした。使徒たちは、これらの賜物がやむと警告しました：</p><blockquote><p>「愛は決して滅びない。<strong>預言は廃れ、異言はやみ</strong>、知識は廃れよう」（<a href="https://bibleox.com/ja/jp-ni/1kor/13/#L8">１コリ. 13:8</a>）</p></blockquote><p>キリスト御自身が、奇跡を求めることを非難されました：</p><blockquote><p>「イエスはお答えになった。『<strong>よこしまで神に背いた時代の者たちはしるしを欲しがるが</strong>、預言者ヨナのしるしのほかには、しるしは与えられない』」（<a href="https://bibleox.com/ja/jp-ni/mf/12/#L39">マタ. 12:39</a>）</p></blockquote><p>終わりの時には、偽預言者たちはまさに奇跡によって人々を惑わします：</p><blockquote><p>「偽メシアや偽預言者が現れて、<strong>大きなしるしや不思議な業を行い</strong>、できれば、選ばれた人たちをも<strong>惑わそうとする</strong>からである」（<a href="https://bibleox.com/ja/jp-ni/mf/24/#L24">マタ. 24:24</a>; <a href="https://bibleox.com/ja/jp-ni/mk/13/#L22">マコ. 13:22</a>）</p></blockquote><p>その結果、裁きの時、多くの信者は、キリストの名によって奇跡を行い、預言し、悪霊を追い出したからこそ自分は救われると確信しているでしょう。しかし彼らは惑わされ、不法を教えられていたことが分かります。キリストは彼らを知らず、御自分のもとから追い払われます：</p><blockquote><p>「かの日には、大勢の者がわたしに、『主よ、主よ、わたしたちは御名によって預言し、御名によって悪霊を追い出し、<strong>御名によって奇跡をいろいろ行ったではありませんか</strong>』と言うであろう。そのとき、わたしはきっぱりとこう言おう。『<strong>あなたたちのことは全然知らない</strong>。不法を働く者ども、<strong>わたしから離れ去れ</strong>』」（<a href="https://bibleox.com/ja/jp-ni/mf/7/#L22-23">マタ. 7:22-23</a>）</p></blockquote><h2>1世紀の異端の例</h2><h3>ファリサイ派</h3><p>使徒たちはファリサイ派の教えを異端（分離した誤った教え）と呼びました：</p><blockquote><p>「ところが、<strong>ファリサイ派</strong>から信者になった人が数名立って、『異邦人にも<strong>割礼</strong>を受けさせて、<strong>モーセの律法を守るように</strong>命じるべきだ』と言った」（<a href="https://bibleox.com/ja/jp-ni/act/15/#L5">使. 15:5</a>）<em>（ギリシア語 τῆς αἱρέσεως τῶν Φαρισαίων —「ファリサイ派の<strong>異端</strong>の」）</em></p></blockquote><p>ファリサイ派出身の信者たちは、救われるためには異邦人も割礼を受け、モーセの律法を守らなければならないと考えていました。</p><p>福音記者マタイも、ファリサイ派とサドカイ派の教えの危険を指摘しています：</p><blockquote><p>「イエスは彼らに、『<strong>ファリサイ派とサドカイ派の人々のパン種によく注意しなさい</strong>』と言われた。&lt;…&gt;『パンについて言ったのではないことが、どうして分からないのか。ファリサイ派とサドカイ派の人々のパン種に注意しなさい。』そのときようやく、弟子たちは、イエスが注意を促されたのは、パン種のことではなく、<strong>ファリサイ派とサドカイ派の人々の教え</strong>のことだと悟った」（<a href="https://bibleox.com/ja/jp-ni/mf/16/#L6,11-12">マタ. 16:6,11-12</a>）</p></blockquote><h3>サドカイ派</h3><p>使徒たちはサドカイ派の教えを異端（分離した誤った教え）と呼びました：</p><blockquote><p>「そこで、大祭司とその仲間の<strong>サドカイ派</strong>の人々は皆立ち上がり、ねたみに燃えて」（<a href="https://bibleox.com/ja/jp-ni/act/5/#L17">使. 5:17</a>）<em>（ギリシア語 ἡ οὖσα αἵρεσις τῶν Σαδδουκαίων —「サドカイ派の<strong>異端</strong>」）</em></p></blockquote><p>サドカイ派の教えは、死者の復活、死後の魂の生、そして一般に天使と霊の存在を否定していました：</p><blockquote><p>「<strong>復活はないと言っているサドカイ派の人々が</strong>、イエスのところへ来て尋ねた。&lt;…&gt; イエスは言われた。『あなたたちは聖書も神の力も知らないから、<strong>そんな思い違いをしているのではないか</strong>。&lt;…&gt; <strong>死者が復活することについては、モーセの書</strong>の『柴』の個所で、神がモーセにどう言われたか、<strong>読んだことがないのか</strong>。「わたしはアブラハムの神、イサクの神、ヤコブの神である」とあるではないか。神は死んだ者の神ではなく、生きている者の神なのだ。<strong>あなたたちは大変な思い違いをしている</strong>』」（<a href="https://bibleox.com/ja/jp-ni/mk/12/#L18,24,26-27">マコ. 12:18,24,26-27</a>）</p></blockquote><blockquote><p>「<strong>サドカイ派は復活も天使も霊もないと言い</strong>、ファリサイ派はこのいずれをも認めているからである」（<a href="https://bibleox.com/ja/jp-ni/act/23/#L8">使. 23:8</a>）</p></blockquote><p>ファリサイ派はサドカイ派と論争しました：</p><blockquote><p>「パウロは、<strong>議員の一部がサドカイ派、一部がファリサイ派であることを知って</strong>、議場で声を高めて言った。『兄弟たち、わたしは生まれながらのファリサイ派です。死者が復活するという望みを抱いていることで、わたしは裁判にかけられているのです。』パウロがこう言ったので、<strong>ファリサイ派とサドカイ派との間に論争が生じ、最高法院は分裂した</strong>。サドカイ派は復活も天使も霊もないと言い、ファリサイ派はこのいずれをも認めているからである」（<a href="https://bibleox.com/ja/jp-ni/act/23/#L6-8">使. 23:6-8</a>）</p></blockquote><h3>ヒメナイとフィレトの教え</h3><p>真理の道を踏み外したヒメナイとフィレトの教え。踏み外したということは、以前はキリスト者だったということです。今や彼らは復活について誤って教えています。これは明らかに異端であり、広がっていくものであり、そこから離れなければなりません：</p><blockquote><p>「俗悪な無駄話を避けなさい。そのような話をする者はますます不信心になっていき、<strong>その言葉は悪いはれ物のように広がります。その中には、ヒメナイとフィレトがいます。彼らは真理の道を踏み外し、復活はもう起こったと言って</strong>、ある人々の信仰を覆しています。しかし、神が据えられた堅固な基礎は揺るぎません。そこには、『主は御自分の者たちを知っておられる』と、また『<strong>主の名を呼ぶ者は皆、不義から身を引くべきである</strong>』と刻まれています」（<a href="https://bibleox.com/ja/jp-ni/2tim/2/#L16-19">２テモ. 2:16-19</a>）</p></blockquote><h3>ニコライ派</h3><p>主イエス・キリストはニコライ派の教えを憎まれます。つまり、明らかにその教えは異端です：</p><blockquote><p>「同じように、あなたのところにも<strong>ニコライ派の教えを奉ずる者たち</strong>がいる」（<a href="https://bibleox.com/ja/jp-ni/otkr/2/#L15">黙. 2:15</a>）<em>（一部の写本（公認本文 Textus Receptus）では、この節の終わりに「<strong>わたしはそれを憎む</strong>」（ὃ μισῶ）という言葉があります。）</em></p></blockquote><blockquote><p>「だが、あなたには取り柄もある。<strong>ニコライ派の者たちの行いを憎んでいることだ。わたしもそれを憎んでいる</strong>」（<a href="https://bibleox.com/ja/jp-ni/otkr/2/#L6">黙. 2:6</a>）</p></blockquote><h2>2世紀の異端の例</h2><p>聖致命者哲学者ユスティノス（100頃-165）は、自分をキリスト者と呼び、イエス・キリストを主と認めながら、迷いの霊の教え、すなわち分離した偽りの教え（異端）を宣べ伝える人々がいると書いています：</p><blockquote><p><em>このように、</em><strong><em>自分をキリスト者と告白し、十字架につけられたイエスを主ともキリストとも認めながら、その教えではなく迷いの霊の教えを教える人々</em></strong><em>がいるという事実は &lt;…&gt; わたしたちは彼らと何の共通点も持たない</em></p></blockquote><p>（<a href="https://bibleox.com/en/en/w/Justin_Martyr-Dialogue_with_Trypho/#HH-35">「トリュフォンとの対話」35</a>、英語。英訳からの訳）</p><p>致命者聖イレネオス（リヨン、130頃-202）も、数えきれないキリスト教の異端について書いています。たとえば、哲学者ユスティノスの弟子タティアノスについて書いています。彼はユスティノスの致命の前には異端を語りませんでしたが、その後、自分の教えを考え出しました：</p><blockquote><p>1. わたしたちが述べた異端者たちからは、すでに数多くの異端の多くの分派が形づくられている。これは、<strong>彼らの多く、いや、すべての者と言ってもよいが、自分自身が教師となることを望み、自分が関わっていた特定の異端から分かれ出ようとすることから生じる。まったく異なる見解の体系から一つの教義を形づくり、さらにほかのものからほかのものを作り出して、何か新しいことを教えると言い張り、自分が生み出すことのできたどんな種類の見解であれ、その考案者であると宣言する</strong>のである。一例を挙げよう。サトゥルニノスとマルキオンから出た、エンクラテイス派（節制派）と呼ばれる人々は、<strong>結婚に反対して説き</strong>、こうして神の最初の創造をないがしろにし、人類の繁殖のために男と女を造られた方を間接的に非難した。彼らの中に数えられる者たちのある者は、<strong>動物の食物を断つことも持ち込み</strong>、こうして万物を造られた神に対して恩知らずであることを示した。<strong>彼らはまた、最初に造られた者の救いを否定する</strong>。しかしこの見解は、彼らの間でつい最近考え出されたものである。タティアノスという人が最初にこの冒瀆を持ち込んだ。彼はユスティノスの聞き手であり、ユスティノスと共にいた間はそのような見解を表明しなかった。しかしユスティノスの致命の後、彼は教会から分かれ、自分は教師であるという思いに興奮し、思い上がって、あたかもほかの者よりも優れているかのように、自分独特の教義を作り上げた。彼はウァレンティノスの追随者たちのように、ある見えないアイオーンの体系を考え出し、マルキオンやサトゥルニノスのように、結婚は腐敗と淫行にほかならないと宣言した。しかしアダムの救いの否定は、まったく彼自身による見解であった。</p><p>2. またほかの者たちは、バシレイデスとカルポクラテスに従って、乱交と多妻を持ち込み、偶像に献げられた肉を食べることにも無頓着で、神はそのような事柄をあまり重んじないと主張している。しかし、なぜ続ける必要があろうか。<strong>何らかの仕方で真理から離れ落ちたすべての者を挙げることは、実行不可能な試みだからである</strong>。</p></blockquote><p>（<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b1/#HH-28">「異端反駁」第1巻28章</a>、英語。英訳からの訳）</p><h2>教会は一つの信仰、一致と同じ思いである</h2><h3>教会には一つの信仰がある</h3><blockquote><p>「体は一つ、霊は一つです。それは、あなたがたが、一つの希望にあずかるようにと招かれているのと同じです。主は一人、<strong>信仰は一つ</strong>、洗礼は一つ」（<a href="https://bibleox.com/ja/jp-ni/ef/4/#L4-5">エフェ. 4:4-5</a>）</p></blockquote><h3>同じ思いを持つようにとの戒め</h3><blockquote><p><em>「</em><strong><em>互いに<mark>思いを一つにし</mark></em></strong><em>、高ぶらず、</em><strong><em>身分の低い人々と交わりなさい</em></strong><em>。自分を賢い者とうぬぼれてはなりません」（</em><a href="https://bibleox.com/ja/jp-ni/rim/12/#L16"><em>ロマ. 12:16</em></a><em>）</em></p></blockquote><blockquote><p><em>「さて、兄弟たち、わたしたちの主イエス・キリストの名によってあなたがたに勧告します。</em><strong><em><mark>皆、勝手なことを言わず</mark></em></strong><em>、仲たがいせず、</em><strong><em>心を一つにし<mark>思いを一つにして</mark>、固く結び合いなさい</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/1kor/1/#L10"><em>１コリ. 1:10</em></a><em>）（「皆、勝手なことを言わず」は、ギリシア語原文では ἵνα τὸ αὐτὸ λέγητε πάντες —「皆が同じことを語るように」です。）</em></p></blockquote><p>同じ思いについてのほかの引用：<a href="https://bibleox.com/ru/ru/w/%D0%95%D0%B4%D0%B8%D0%BD%D0%BE%D0%BC%D1%8B%D1%81%D0%BB%D0%B8%D0%B5">同じ思い</a></p><h3>一致を望まれる神の御心</h3><p>主は、使徒たちの言葉によって御自分を信じる人々の一致を望んでおられます</p><blockquote><p>「また、彼らのためだけでなく、<strong>彼らの言葉によってわたしを信じる人々のためにも、お願いします。父よ、あなたがわたしの内におられ、わたしがあなたの内にいるように、<mark>すべての人を一つにしてください</mark></strong>。彼らもわたしたちの内にいるようにしてください」（<a href="https://bibleox.com/ja/jp-ni/in/17/#L20-21">ヨハ. 17:20-21</a>）</p></blockquote><h2>異端に抵抗する必要</h2><blockquote><p>「<strong>真理のためには、命がけで戦え</strong>。主なる神も、お前に味方して戦ってくださる」（<a href="https://bibleox.com/ja/jp-ni/prsir/4/#L28">シラ. 4:28</a>）</p></blockquote><blockquote><p>「愛する人たち、わたしたちが共にあずかる救いについて書き送りたいと、ひたすら願っておりました。あなたがたに手紙を書いて、<strong>聖なる者たちに一度伝えられた信仰のために戦うことを</strong>、勧めなければならないと思ったからです」（<a href="https://bibleox.com/ja/jp-ni/iud/1/#L3">ユダ. 1:3</a>）</p></blockquote><blockquote><p>「実を結ばない暗闇の業に加わらないで、<strong>むしろ、それを明るみに出しなさい</strong>」（<a href="https://bibleox.com/ja/jp-ni/ef/5/#L11">エフェ. 5:11</a>）</p></blockquote><h2>悪魔はいつも教会と戦う</h2><blockquote><p>「主なる神は、蛇に向かって言われた。&lt;…&gt;『<strong>お前と女、お前の子孫と女の子孫の間にわたしは敵意を置く</strong>。彼はお前の頭を砕きお前は彼のかかとを砕く』」（<a href="https://bibleox.com/ja/jp-ni/gen/3/#L14-15">創. 3:14-15</a>）</p></blockquote><blockquote><p>「竜は、自分が地上へ投げ落とされたと分かると、男の子を産んだ女の後を追った。&lt;…&gt; <strong>竜は女に対して激しく怒り、その子孫の残りの者たち</strong>、すなわち、神の掟を守り、イエスの証しを守りとおしている者たちと<strong>戦おうとして出て行った</strong>」（<a href="https://bibleox.com/ja/jp-ni/otkr/12/#L13,17">黙. 12:13,17</a>）</p></blockquote><h2>批判への応答</h2><h3>あなたがたは奇跡を熱心に求めていない</h3><p>異端の支持者たちは、しばしば奇跡、いやし、悪霊払いによって人々を自分たちの団体に引き寄せようとします。そのために彼らは次の引用を用います：</p><blockquote><p>「愛を追い求めなさい。<strong>霊的な賜物</strong>、特に預言するための賜物を<strong>熱心に求めなさい</strong>」（<a href="https://bibleox.com/ja/jp-ni/1kor/14/#L1">１コリ. 14:1</a>）</p></blockquote><p>この同じ引用によって、彼らは教会が熱心でなく、それゆえ教会には奇跡の大規模な現れがないと非難します。</p><p>しかし、使徒たちと古代のキリスト者たちには、見せ物のためではなく益のために、奇跡を行う力が豊かに与えられたのです：</p><blockquote><p>「一人一人に“霊”の働きが現れるのは、<strong>全体の益となるため</strong>です」（<a href="https://bibleox.com/ja/jp-ni/1kor/12/#L7">１コリ. 12:7</a>）</p></blockquote><p>少数の漁師たちが、短い生涯のうちに全世界に宣教を広めるには、大きな助けが必要でした。使徒たちは、これらの賜物が終わると警告しました：</p><blockquote><p>「愛は決して滅びない。<strong>預言は廃れ、異言はやみ</strong>、知識は廃れよう」（<a href="https://bibleox.com/ja/jp-ni/1kor/13/#L8">１コリ. 13:8</a>）</p></blockquote><p>キリスト御自身が、奇跡を求めることを非難されました：</p><blockquote><p>「<strong>よこしまで神に背いた時代の者たちはしるしを欲しがるが</strong>、預言者ヨナのしるしのほかには、しるしは与えられない」（<a href="https://bibleox.com/ja/jp-ni/mf/12/#L39">マタ. 12:39</a>）</p></blockquote><p>終わりの時には、偽預言者たちはまさに奇跡によって人々を惑わします：</p><blockquote><p>「偽メシアや偽預言者が現れて、<strong>大きなしるしや不思議な業を行い</strong>、できれば、選ばれた人たちをも<strong>惑わそうとする</strong>からである」（<a href="https://bibleox.com/ja/jp-ni/mf/24/#L24">マタ. 24:24</a>; <a href="https://bibleox.com/ja/jp-ni/mk/13/#L22">マコ. 13:22</a>）</p></blockquote><p>その結果、裁きの時、多くの信者は、キリストの名によって奇跡を行い、預言し、悪霊を追い出したから自分は救われると確信しているでしょう。しかし彼らは惑わされ、不法を教えられていたことが分かります。キリストは彼らを知らず、御自分のもとから追い払われます：</p><blockquote><p>「かの日には、大勢の者がわたしに、『主よ、主よ、わたしたちは御名によって預言し、御名によって悪霊を追い出し、<strong>御名によって奇跡をいろいろ行ったではありませんか</strong>』と言うであろう。そのとき、わたしはきっぱりとこう言おう。『<strong>あなたたちのことは全然知らない</strong>。不法を働く者ども、<strong>わたしから離れ去れ</strong>』」（<a href="https://bibleox.com/ja/jp-ni/mf/7/#L22-23">マタ. 7:22-23</a>）</p></blockquote><h3>あなたがたには愛がない</h3><p>教会から離れた団体の支持者たちとの会話では、しばしば防御反応として、議論されている話題から離れ、相手の人格とその性質の議論に移ろうとすることが用いられます。たいていそれは難しい質問の後に起こります。あなたがどれほど気配りをし、礼儀正しくしても、次のことで非難されるかもしれません：</p><ul><li><p>人を裁いている。</p></li><li><p>高慢である。</p></li><li><p>愛がない。</p></li></ul><p><strong>人を裁いている</strong> — 異端の中では救われることができないと言うからです。しかし、使徒がそう言っており（<a href="https://bibleox.com/ja/jp-ni/gal/5/#L20">ガラ. 5:20</a>）、1世紀から始まる聖師父たちもそう言っています（<a href="https://bibleox.com/ru/ru/w/7Ut6v4xr_%D0%A1%D0%BF%D0%B0%D1%81%D0%B5%D0%BD%D0%B8%D0%B5_%D0%B2%D0%BE%D0%B7%D0%BC%D0%BE%D0%B6%D0%BD%D0%BE_%D1%82%D0%BE%D0%BB%D1%8C%D0%BA%D0%BE_%D0%B2_%D0%A6%D0%B5%D1%80%D0%BA%D0%B2%D0%B8">引用</a>（ロシア語））。主は人を罪人だと決めるなという戒めをお与えになりましたが（<a href="https://bibleox.com/ja/jp-ni/lk/6/#L37">ルカ. 6:37</a>）、他方で、正しい裁きをするようにとも言われました（<a href="https://bibleox.com/ja/jp-ni/in/7/#L24">ヨハ. 7:24</a>）。</p><p><strong>高慢である</strong> — <a href="https://bibleox.com/ru/ru/w/X7l9DcTY_%D0%A1%D0%BF%D0%B0%D1%81%D0%B5%D0%BD%D0%B8%D0%B5_%D0%B2%D0%BE%D0%B7%D0%BC%D0%BE%D0%B6%D0%BD%D0%BE_%D1%82%D0%BE%D0%BB%D1%8C%D0%BA%D0%BE_%D0%B2_%D0%A6%D0%B5%D1%80%D0%BA%D0%B2%D0%B8">救いはキリストの教会においてのみ可能である</a>、<a href="https://bibleox.com/ja/ja/w/71cW_教会/">一つの、見える、一致した教会において</a>と言うからです。しかし、聖書もそう言っています。キリストは体（教会）の救い主であり（<a href="https://bibleox.com/ja/jp-ni/ef/5/#L23">エフェ. 5:23</a>）、キリストなしにはだれも救われないと（<a href="https://bibleox.com/ru/ru/w/%D0%98%D0%B8%D1%81%D1%83%D1%81_%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%BE%D1%81-%D0%B5%D0%B4%D0%B8%D0%BD%D1%81%D1%82%D0%B2%D0%B5%D0%BD%D0%BD%D1%8B%D0%B9-%D1%81%D0%BF%D0%B0%D1%81%D0%B8%D1%82%D0%B5%D0%BB%D1%8C-%D1%87%D0%B5%D0%BB%D0%BE%D0%B2%D0%B5%D1%87%D0%B5%D1%81%D1%82%D0%B2%D0%B0">引用</a>）。聖師父たちも同じことを言っています（<a href="https://bibleox.com/ru/ru/w/7Ut6v4xr_%D0%A1%D0%BF%D0%B0%D1%81%D0%B5%D0%BD%D0%B8%D0%B5_%D0%B2%D0%BE%D0%B7%D0%BC%D0%BE%D0%B6%D0%BD%D0%BE_%D1%82%D0%BE%D0%BB%D1%8C%D0%BA%D0%BE_%D0%B2_%D0%A6%D0%B5%D1%80%D0%BA%D0%B2%D0%B8">引用</a>（ロシア語））。</p><p><strong>愛</strong>について言えば、疑いなく、キリスト者は柔和で、へりくだり、いつも愛から行動しなければなりません。しかし、それはどのような愛でありうるし、あるべきなのでしょうか。わたしたちは、主イエス・キリストと使徒たちを愛が欠けていると非難することはできません。それでも、聖書には次のような教えが見られます：</p><blockquote><p>「わが子よ、主の諭しを拒むな。主の懲らしめを避けるな。かわいい息子を懲らしめる父のように<strong>主は愛する者を<mark>懲らしめられる</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/pr/3/#L11-12">箴. 3:11-12</a>）</p></blockquote><blockquote><p>「なぜなら、<strong>主は愛する者を<mark>鍛え</mark></strong>、子として受け入れる者を皆、鞭打たれるからである」（<a href="https://bibleox.com/ja/jp-ni/evr/12/#L6">ヘブ. 12:6</a>）</p></blockquote><blockquote><p>「<strong>わたしは愛する者を皆、<mark>叱ったり</mark>、鍛えたりする</strong>。だから、熱心に努めよ。悔い改めよ」（<a href="https://bibleox.com/ja/jp-ni/otkr/3/#L19">黙. 3:19</a>）</p></blockquote><blockquote><p>「見よ、幸いなのは神の<strong><mark>懲らしめ</mark></strong>を受ける人。<strong>全能者の戒めを拒んではならない</strong>。彼は傷つけても、包み打っても、その御手で癒してくださる」（<a href="https://bibleox.com/ja/jp-ni/iov/5/#L17-18">ヨブ. 5:17-18</a>）</p></blockquote><p>それゆえ、すべての叱責を憎しみの現れと受け取るなら、わたしたちは、自ら偽りを明らかにしただけでなく、ほかの人々にもそうするよう呼びかけた神と使徒たちを、憎しみのゆえに非難することになることを覚えておかなければなりません：</p><blockquote><p>「実を結ばない暗闇の業に加わらないで、むしろ、<strong><mark>それを明るみに出しなさい</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/ef/5/#L11">エフェ. 5:11</a>）</p></blockquote><p>あれこれの教えの偽りを示そうとする試みは、憎しみの現れであるとは限りません（実際に高慢と憎しみからそうする人もいるでしょうが）。それは愛の現れ、隣人への配慮、その救いを願う思いの現れでもありうるのです：</p><blockquote><p>「わたしの兄弟たち、あなたがたの中に<strong>真理から迷い出た者がいて</strong>、だれかがその人を真理へ連れ戻すならば、<strong>罪人を迷いの道から連れ戻す人は、その罪人の魂を死から救い出し、多くの罪を覆うことになる</strong>と、知るべきです」（<a href="https://bibleox.com/ja/jp-ni/iak/5/#L19-20">ヤコ. 5:19-20</a>）</p></blockquote><p>決してだれも侮辱しないように、また会話を人物の議論へとそらさせないように努めなければなりません。そこではしばしば互いに裁き合うことが始まるからです。人の性質についてではなく、教えについて語らなければなりません。</p>

  - src: грех-раскол
    path: Sc12m_分裂
    title: 分裂（離教）
    meta_desc: 分裂（離教）の罪についての聖書の引用
    menu: { parent: "人間/罪", title: "分裂", priority: 12 }
    body: |-
      <h2>教会の目に見える一致を望むキリストと使徒たちの意志</h2><blockquote><p><em>「また、彼らのためだけでなく、彼らの言葉によってわたしを信じる人々のためにも、</em><strong><em><mark>お願いします</mark></em></strong><em>。父よ、あなたがわたしの内におられ、わたしがあなたの内にいるように、</em><strong><em><mark>すべての人を一つにしてください</mark></em></strong><em>。</em><strong><em>彼らもわたしたちの内にいるようにしてください。そうすれば、<mark>世は、あなたがわたしをお遣わしになったことを、信じるようになります</mark></em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/in/17/#L20-21"><em>ヨハ. 17:20-21</em></a><em>）</em></p></blockquote><blockquote><p>「さて、兄弟たち、わたしたちの主イエス・キリストの名によってあなたがたに<strong><mark>勧告します</mark></strong>。<strong><mark>皆、勝手なことを言わず</mark></strong>、<strong><mark>仲たがいせず</mark></strong>、<strong><mark>心を一つにし</mark><mark>思いを一つにして</mark>、固く結び合いなさい</strong>。わたしの兄弟たち、実はあなたがたの間に争いがあると、クロエの家の人たちから知らされました。<strong>あなたがたはめいめい、『わたしはパウロにつく』『わたしはアポロに』『わたしはケファに』『わたしはキリストに』などと言い合っているとのことです。キリストは幾つにも分けられてしまったのですか</strong>。パウロがあなたがたのために十字架につけられたのですか。あなたがたはパウロの名によって洗礼を受けたのですか」（<a href="https://bibleox.com/ja/jp-ni/1kor/1/#L10-13">１コリ. 1:10-13</a>）「ある人が『わたしはパウロにつく』と言い、他の人が『わたしはアポロに』などと言っているとすれば、<strong>あなたがたは、ただの人にすぎないではありませんか</strong>」（<a href="https://bibleox.com/ja/jp-ni/1kor/3/#L4">１コリ. 3:4</a>）<em>（「皆、勝手なことを言わず」は、ギリシア語原文では ἵνα τὸ αὐτὸ λέγητε πάντες —「皆が同じことを語るように」、「仲たがいせず」は μὴ ᾖ ἐν ὑμῖν σχίσματα —「あなたがたの間に分裂（σχίσματα）がないように」です。）</em></p></blockquote><p>神は、分裂がなく、すべての者が互いに配慮し、共に苦しみ、共に喜ぶように、体（教会）の部分を組み立てられました：</p><blockquote><p>「つまり、<strong>一つの霊によって、わたしたちは</strong>、ユダヤ人であろうとギリシア人であろうと、奴隷であろうと自由な身分の者であろうと、<strong>皆一つの体となるために洗礼を受け</strong>、皆一つの霊をのませてもらったのです。<strong>体は、一つの部分ではなく、多くの部分から成っています</strong>。&lt;…&gt; <strong><mark>目が手に向かって「お前は要らない」とは言えず、また、頭が足に向かって「お前たちは要らない」とも言えません</mark></strong>。それどころか、体の中でほかよりも弱く見える部分が、かえって必要なのです。わたしたちは、体の中でほかよりも恰好が悪いと思われる部分を覆って、もっと恰好よくしようとし、見苦しい部分をもっと見栄えよくしようとします。見栄えのよい部分には、そうする必要はありません。<strong><mark>神は</mark></strong>、見劣りのする部分をいっそう引き立たせて、<strong><mark>体を組み立てられました</mark></strong>。<strong><mark>それで、体に分裂が起こらず</mark></strong>、各部分が互いに配慮し合っています。<strong>一つの部分が苦しめば、すべての部分が共に苦しみ、一つの部分が尊ばれれば、すべての部分が共に喜ぶのです</strong>」（<a href="https://bibleox.com/ja/jp-ni/1kor/12/#L13-14,21-26">１コリ. 12:13-14,21-26</a>）</p></blockquote><p>体のこれらのさまざまな部分とは何でしょうか。教会におけるさまざまな務めと賜物です：</p><blockquote><p>「<strong>体は一つでも、多くの部分から成り、体のすべての部分の数は多くても、体は一つであるように</strong>、キリストの場合も同様である。&lt;…&gt; <strong>体は、一つの部分ではなく、多くの部分から成っています</strong>。&lt;…&gt; <strong>あなたがたはキリストの体であり、また、一人一人はその部分です</strong>。<strong>神は、教会の中にいろいろな人をお立てになりました</strong>。第一に<strong>使徒</strong>、第二に<strong>預言者</strong>、第三に<strong>教師</strong>、次に<strong>奇跡を行う者</strong>、その次に病気をいやす<strong>賜物</strong>を持つ者、援助する者、管理する者、異言を語る者などです。<strong>皆が使徒であろうか。皆が預言者であろうか。皆が教師であろうか。皆が奇跡を行う者であろうか。皆が病気をいやす賜物を持っているだろうか。皆が異言を語るだろうか。皆がそれを解釈するだろうか</strong>」（<a href="https://bibleox.com/ja/jp-ni/1kor/12/#L12,14,27-30">１コリ. 12:12,14,27-30</a>）</p></blockquote><p>このように神は、体に分裂がないように、これらすべての務めと賜物を整えられました。使徒は手紙の初めでそれを防いでいます（<a href="https://bibleox.com/ja/jp-ni/1kor/1/#L10-13">１コリ. 1:10-13</a>）。つまり神は一致を望まれるだけでなく（<a href="https://bibleox.com/ja/jp-ni/in/17/#L20-21">ヨハ. 17:20-21</a>）、それに配慮しておられるのです。ここで、神によって務めに任命された使徒は、目に見える一致に配慮し、コリントの人々に目に見える分裂を作ることを禁じています。</p><h2>教会における分裂は、人の神の国への道を閉ざす罪である</h2><blockquote><p>「<em>肉の業は明らかです。それは、姦淫、わいせつ、好色、偶像礼拝、魔術、敵意、争い、そねみ、怒り、利己心、</em><strong><mark>不和</mark></strong><mark>*</mark>、<em>仲間争い、ねたみ、泥酔、酒宴、その他このたぐいのものです。以前言っておいたように、ここでも前もって言いますが、このようなことを行う者は、</em><strong><em><mark>神の国を受け継ぐことはできません</mark></em></strong>」（<a href="https://bibleox.com/ja/jp-ni/gal/5/#L19-21">ガラ. 5:19-21</a>）</p><p><strong><mark>*不和（διχοστασίαι）</mark> — 分裂、二つに分かれること。</strong>（「仲間争い」は、ギリシア語原文では αἱρέσεις —「異端」です。）</p></blockquote><blockquote><p>「兄弟たち、あなたがたに勧めます。あなたがたの学んだ教えに反して、<strong><mark>不和</mark>やつまずきをもたらす人々を警戒しなさい</strong>。彼らから遠ざかりなさい。<strong><mark>こういう人々は、わたしたちの主であるキリストに仕えないで</mark></strong>、自分の腹に仕えている。そして、うまい言葉やへつらいの言葉によって純朴な人々の心を欺いているのです」（<a href="https://bibleox.com/ja/jp-ni/rim/16/#L17-18">ロマ. 16:17-18</a>）<em>（「不和」は、ギリシア語原文では τὰς διχοστασίας —「分裂」です。）</em></p></blockquote><h2>分裂についての預言</h2><blockquote><p>「<em>彼ら［使徒たち］はあなたがたにこう言いました。『</em><strong><em>終わりの時には、あざける者どもが現れ</em></strong><em>、不信心な欲望のままにふるまう。』この者たちは、</em><strong>分裂を引き起こし</strong><em>（ギリシア語 οἱ ἀποδιορίζοντες —「自ら分かれる者たち」）、この世の命のままに生き、霊を持たない者です</em>」（<a href="https://bibleox.com/ja/jp-ni/iud/1/#L18-19">ユダ. 1:18-19</a>）</p></blockquote><blockquote><p>「子供たちよ、終わりの時が来ています。反キリストが来ると、あなたがたがかねて聞いていたとおり、<strong><mark>今や多くの反キリストが現れています</mark></strong>。これによって、終わりの時が来ていると分かります。<strong><mark>彼らはわたしたちから去って行きましたが、もともと仲間ではなかったのです。仲間なら、わたしたちのもとにとどまっていたでしょう</mark></strong>。しかし去って行き、だれもわたしたちの仲間ではないことが明らかになりました」（<a href="https://bibleox.com/ja/jp-ni/1in/2/#L18-19">１ヨハ. 2:18-19</a>）</p></blockquote><h2>分裂の例</h2><blockquote><p>「わたしは教会に少しばかり書き送りました。ところが、指導者になりたがっている<strong>ディオトレフェス</strong>は、わたしたちを受け入れません。だから、そちらに行ったとき、彼のしていることを指摘しようと思います。<strong>彼は、悪意に満ちた言葉でわたしたちをそしるばかりか、兄弟たちを受け入れず、受け入れようとする人たちの邪魔をし、教会から追い出しています</strong>」（<a href="https://bibleox.com/ja/jp-ni/3in/1/#L9-10">３ヨハ. 1:9-10</a>）</p></blockquote><h2>使徒たちは分裂の試みを防いだ</h2><blockquote><p>「わたしの兄弟たち、実はあなたがたの間に争いがあると、クロエの家の人たちから知らされました。あなたがたはめいめい、『<strong>わたしはパウロにつく』『わたしはアポロに』『わたしはケファに』『わたしはキリストに』などと言い合っているとのことです。キリストは幾つにも分けられてしまったのですか</strong>。パウロがあなたがたのために十字架につけられたのですか。あなたがたはパウロの名によって洗礼を受けたのですか」（<a href="https://bibleox.com/ja/jp-ni/1kor/1/#L11-13">１コリ. 1:11-13</a>）</p></blockquote><blockquote><p>「さて、兄弟たち、わたしたちの主イエス・キリストの名によってあなたがたに<strong>勧告します</strong>。<strong>皆、勝手なことを言わず、仲たがいせず</strong>、心を一つにし思いを一つにして、固く結び合いなさい」（<a href="https://bibleox.com/ja/jp-ni/1kor/1/#L10">１コリ. 1:10</a>）</p></blockquote><blockquote><p>「それで、<strong>体に分裂が起こらず</strong>、各部分が互いに配慮し合っています」（<a href="https://bibleox.com/ja/jp-ni/1kor/12/#L25">１コリ. 12:25</a>）</p></blockquote>
