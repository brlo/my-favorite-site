    title: 弁明書 第一
    title_sub: ローマ皇帝に献げられた
    meta_desc: 2世紀のキリスト教護教家ユスティノス（哲学者）がローマ皇帝アントニヌス・ピウスに献げた弁明書（第一）：キリスト教の信仰と実践を擁護し、哲学と預言者の証しをもって示す。ギリシア語原文（マルコヴィッチ校訂版の章立て）からの翻訳と注。
    menu: { parent: "著作", title: "弁明書 第一", priority: 1 }
