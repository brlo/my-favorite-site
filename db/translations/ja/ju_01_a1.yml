    body: |-
      <h2>1</h2><p>皇帝ティトス・アエリウス・ハドリアヌス・アントニヌス・ピウス・アウグストゥス・カエサル、その御子で哲学者のヴェリッシムス殿、カエサルの実子でピウスの養子、学問を愛する哲学者ルキウス殿、尊き元老院、そしてローマ民の全体に向かって、諸民族のうちで不当に憎まれ、虐げられている人々のために、私の言葉と請願を捧げます[1]。私自身もその一人であるユスティノスは、父プリスクスの息子であり、祖父バキウスの孫で、シリア・パレスチナのフラウィア・ネアポリスの出身です。</p><h2>2</h2><p>真に敬虔で哲学を愛する人々は、真実だけを尊び、これを愛すべきであり、先祖伝来の意見が劣ったものである場合には、それに従うことを退けなければなりません。これこそ、理性が教える義務です。健全な理性は、不正な行いをした人々や教えた人々に従わないよう求めるだけでなく、真理を愛する者には、たとえ死が脅かそうとも、あらゆる手段を尽くし、自らの命にまさって、言葉にも行いにも正しさを守るよう努めることを求めます。あなた方は敬虔な人々であり、哲学者と呼ばれ、どこででも公正と学問の守り手とうたわれています。いま、あなた方が実際にそうであるかどうかが明らかにされるのです。私たちがこの書面であなた方に申し上げるのは、お世辞のためでも、あなた方を喜ばせるためでもありません。厳密で入念な調査に基づいて私たちを裁いていただくこと、偏見や、迷信深い人々への迎合に動かされることなく、無分別な衝動や、長くあなた方の間に定着した悪い評判に流されることのないように、と願うためです。もしそうでなければ、あなた方は自分自身に対する判決を下すことになるだけでしょう。私たちのほうは、悪い行いで有罪とされ、悪人であると証明されない限り、誰からも害を受けないと確信しています。あなた方は私たちを殺すことはできても、害を加えることはできないのです。</p><h2>3</h2><p>しかし、この言葉が誰かに無分別で大胆なものと受け取られないように、私たちは、キリスト者たちが何について告発されているのかを調査していただきたいのです。そして告発が事実であることが分かれば、然るべき罰を与えていただければよいのです。しかし誰も何一つ有罪と証明できないなら、健全な理性は、ただ一つの悪い評判をもって罪のない人々を――あるいは、理性によらず情念によって事を運ぼうとするあなた方自身をこそ――侮辱することを許しません。分別のある人は誰でも、こう言うでしょう。公正の最良かつ唯一のあり方は、治められる者が自分の生活と教えについて非難の余地のない申し開きをすることにあり、他方、治める者は、暴力と専横によらず、敬虔と知恵とに導かれて判決を下すべきである、と。そうすれば、為政者も治められる民も幸福を享受できるのです。昔の人がどこかでこう言っています。「為政者も民も哲学しなければ、国家は幸福になりえない」と。そこで私たちの務めは、私たちの生活と教えをすべての人の審査に委ねることです。私たちのことを何も知らない人々のゆえに、その人々が自分の盲目のうちに行う罪のために、私たち自身が罰を受けることのないようにするためです。そしてあなた方の務めは、理性が要求するように、私たちを聴き、良い裁判者であることを示すことです。真理を知った後に正しいことを行かなければ、神の前に釈明できないことになるでしょうから。</p><h2>4</h2><p>ただ名前だけによっては、その名に結びついた行いとは別に、何が善く何が悪いかを決めることはできません。そして実のところ、私たちが告発の根拠とされるその名から見る限り、私たちは最も優れた人々です。しかし、悪事で有罪とされる場合に、名だけを口実に赦しを乞うことは不正だと私たちが考えるように、他方、私たちがこの名によっても、市民としての生によっても何の罪も犯していないなら、罪のない人々を不正に罰することによって、あなた方自身が正当にも罰を受けることのないよう、心を砕くのはあなた方の務めです。名だけから称賛も罰も生まれるはずはなく、行いにおいて立派なものか卑しいものかが証明されて初めて生まれるのです。あなた方は、あなた方の側で告発された者を、有罪が確定する前には罰しません。それなのに私たちについては、ただ名を受け取るだけで有罪の証拠とするのです。しかも名だけに着目するなら、罰せられるべきはむしろ私たちの告発者のほうです。私たちはキリスト者であることで告発されていますが、すぐれたものを憎むことは不正です[2]。また、被告の誰かが名を否認して、自分はキリスト者ではないと言うだけで、あなた方は悪事の証拠が何もないかのように彼を釈放します。しかし誰かが自分をキリスト者であると公言すれば、その告白だけを理由に罰します。正義が求めるのは、告白する者にも否認する者にも、その生活を調べることであり、行いそのものによって、それぞれがどのような人であるかを明らかにすることです。実際、教師であるキリストから、御自分を否認しないようにと教えを受けた人々は、尋問のときにその固さをもって他の人々への奨励となる模範を示しますが、同じように、悪い生活を送っている人々も、深く考えずにすべてのキリスト者を不敬虔と不法とで告発しようとする人々に口実を与えているのかもしれません。しかしこれも不正です。哲学においても、その名と服装を身にまといながら、その身分にふさわしいことを何一つしない人々がいます。そしてあなた方もよくご存じのとおり、意見も教えもまったく異なる古代の教師たちが、みな同じ「哲学者」という一つの名で呼ばれてきました。その中には無神論を教えた者さえいました。さらに詩人たちは、ゼウスが自らの子らとの間で犯した不品行を語って笑いものにしていますが、彼らの寓話にふける者たちにあなた方は沈黙を課しません。それどころか、あなた方の神々を巧みに侮辱する者たちに、賞と栄誉を与えているのです。</p><h2>5</h2><p>これはいったい何を意味するのでしょうか。私たちは何の悪事も犯さず、このような無神論的な教えも持たないと公言しているのに、あなた方は裁判としての調査を行わず、分別のない情念に流され、悪霊（ダイモニア）の唆しによって、考えることも配慮することもなしに私たちを処刑するのです。しかし真実を語らなければなりません。昔から悪霊たちは姿を現しては、女性たちを汚し、少年たちを堕落させ、人々に驚くべき恐怖をもたらしました。そのため、彼らの仕業を理性で判断しなかった人々は、恐怖に捕らえられ、これが悪霊であることを知らないまま、彼らを神々と呼び、それぞれの悪霊が自分で選んだ名を与えたのです。ところがソクラテスが、真の理性と探究とに導かれてこれを明らかにし、人々を悪霊から引き離そうと決意すると、悪霊たちは今度は悪の中に生きる人々を利用して、「新しい神々を導入した」という口実で、ソクラテスを無神論者で不敬虔な者として死罪に処させました。悪霊たちは私たちに対しても、まったく同じことをしているのです。なぜなら、このことは、ギリシア人の間ではソクラテスを通してロゴス（λόγος）[3]によって断罪されただけでなく、異国人の間でも、目に見える姿を取り、人となり、イエス・キリストと名乗られたロゴスそのものによって断罪されたからです。このロゴスを信じる私たちは、このような行いをした霊々は善い存在であるどころか、悪くて不敬虔な悪霊であり、その行いのゆえに、美徳を愛する人間にすら及ばない存在であると言うのです。</p><h2>6</h2><p>それゆえに、私たちは無神論者と呼ばれるのです。そして私たちは、このようなまやかしの神々については無神論者であることを認めます。しかし、最も真実なる神、義と節制とその他すべての美徳の父であり、あらゆる悪から清いお方については、そうではありません。私たちが礼拝し、崇めるのは、この御父と、御父のもとから出て来て、この教えを私たちに伝えてくださった御子、御子に従い、御子に似せられた他の善き御使いたちの群れ、さらに預言の霊です。これは、言葉と真理とをもって尊敬を捧げることであり、また、私たち自身が教えられたように、学ぼうと望むすべての人に隠しだてなく教えることでもあります。</p><h2>7</h2><p>しかし誰かがこう言うかもしれません。取り調べのために連行された人々の中に、実際に罪人がいた、と。確かにあなた方は、被告ひとりひとりの生活を調べた上で、多くの人々をしばしば有罪にしています。しかしその裁きは、他の者たちが先に有罪とされたからという理由によるものではありません。一般に私たちはこう認めます。ギリシア人の間では、各自が好みのままに教えた人々が、その教えが互いに一致しないにもかかわらず、一つの名、「哲学者」と呼ばれるのとまったく同じように、異国人の間でも、真に賢者である人々にも、ただそう見せかけるだけの人々にも、一つの共通の名が当てられ、すべてがキリスト者と呼ばれるのだ、と。それゆえ私たちは、あなた方に告発された人々はその行いによって裁かれ、有罪とされた者は罪人として、キリスト者だからという理由でなく罰せられ、罪のないことが明らかになった者は、何も悪いことをしていないキリスト者として釈放されるよう、お願いするのです。告発者たちを罰していただこうとは、もう求めません。彼らにとっては、自分自身の不正と、真理を知らないことだけですでに十分な罰なのですから。</p><h2>8</h2><p>よくご留意ください。私たちがこう申し上げるのは、あなた方のためなのです。取り調べの際に否認することは、私たちの手の内にあるのですから。ただ、私たちは偽りによって生きたくないだけです。私たちは永遠で清い命を望み、万物の父であり創造者である神のもとにとどまることを求めて、私たちの信仰を告白することに急いでいます。神に仕える忠実さと、悪の入り込む余地のない神のもとでの命への愛とを、自分の行いによって神の前に証しした人々こそ、このような報いに達することができる、と確信し、信じているからです。これこそ、簡潔に言えば、私たちが期待し、キリストから学び、教えていることです。プラトンもまた、罪人たちはラダマンテュスとミーノスのもとに来て裁かれ、彼らによって罰せられるだろうと言いました。私たちも同じことを主張します。ただ私たちによれば、それを行うのはキリストであり、彼らの魂は同じ体と結び合わされて、プラトンが言うような1000年の間だけでなく、永遠の刑罰に引き渡される、という点で違います[4]。もしこれは信じがたく、不可能だと誰かが言うなら、せいぜい、私たちがどんな罪にも有罪とされていない限り、この誤りはそれほど重大な結果を伴わない、私たち自身だけに関わるものだ、ということです。</p><h2>9</h2><p>私たちは、人間が作り、神殿に置いて神々と名付けた者たちのために、数多くのいけにえを献げず、花の花輪を捧げません。彼らは魂を持たず、死んでおり、神の姿を持たないことを、私たちは知っているからです（神が、一部の人々が「礼拝のために神をこのような姿に表した」と言うそのような像に似ているとは、私たちは考えません）。それらの像は、人々の前に現れた悪霊たちの名と姿を持っているにすぎません。しかも、職人が素材を手にかけ、彫り、削り、鋳造し、鍛えるようす、しばしば用をなさなくなった器から、技術によってただ形を変え、望みの姿を与えて、彼らが神と呼ぶものを作り出すようすは、あなた方自身がご存じですから、いまさらお話しするまでもないでしょう。私たちがこれを、理性に反するだけでなく神への侮辱と考えるのは、言葉にし難い栄光と姿とを持たれる神の名が、朽ちること、絶えず手入れを必要とするものに結びつけられるからです。また、これらの職人たちが放埒な人々であり、詳しくは列挙しませんが、あらゆる悪徳に耽っており、自分の仕事を手伝う自分の召使のおとめたちさえ汚していることは、あなた方もよくご存じです。なんという惑溺でしょうか。みだらな人間が礼拝のために神々を作り、作り直し、同じような人間が、神々を安置する神殿の守り手に立てられているのです。人間が神々の守り手であると考え、また言うことさえ不敬虔であるにもかかわらず、です。</p><h2>10</h2><p>私たちに伝えられているのはこうです。神は、人間からの物質的な献げ物を必要とされない、と。私たちが見る通り、すべてを私たちに与えておられるのは、ほかならぬ神ご自身なのですから。私たちは教えられ、確信し、信じています。神に喜ばれるのは、御自身の完全性、すなわち節制と正義と隣人愛と、どんな固有の名によっても呼ばれない神にふさわしいすべてのものにおいて、神に倣う人々だけである、と。また私たちは、神が御自分の善意によって、初めに、形なき物質からすべてを人間のために造られたこと、そして人間がその行いによって神のご計画にふさわしい者とみなされるなら、朽ちることと苦しみとから解放されて、神と共に生き、神と共に治める者とされることを学んでいます。神が初めに、私たちがまだ存在しなかったときに私たちを造られたように、同じように、彼に喜ばれることを選んだ人々を、その選択のゆえに、不朽と、神との交わりとに相応しい者としてくださるだろうと、私たちは考えます。初めに私たちが造られたことは、私たちの業ではありませんでした。しかし、彼に喜ばれることに従うことを私たちが選び取るように、彼は、私たちに授けてくださった理性的な能力によって、私たちを説き、信仰へと導いてくださるのです。そして、すべての人間にとって大切なのは、この教えを知ることを妨げられないことであり、むしろこれに注意を向けるよう促されることだ、と私は考えます。人間の法律には成し遂げられなかったことを、神のロゴスは成し遂げたはずでした。悪霊たちが、各人の中にある多様な悪への傾きを味方につけて、数多くの偽りと不敬虔との告発を撒き散らささえしなければ、ですが。その告発のうち、どれ一つとして私たちに通用するものはありません。</p><h2>11</h2><p>私たちが御国を待ち望んでいると聞くとき、あなた方は、私たちが人間的な何かの王国について語っていると思い込むかもしれませんが、それは無駄な思い違いです。私たちが語っているのは、神と共に治めることです。それが分かるのは、あなた方が私たちを尋問するとき、私たち自身がキリスト者であると告白することからです。この告白をする者には死刑が待っていると知っていながら、です。もし私たちが人間的な王国を待ち望んでいるのなら、滅びを避けるために否認したことでしょうし、待ち望むものを手にするために身を隠そうと努力したことでしょう。しかし私たちの望みは、今のものに向けられてはいません。それゆえ、私たちが殺されるときにも動じません。すべての者が必ず死すべきことを知っているからです。</p><h2>12</h2><p>公共の平和については、私たちはあらゆる人にまさって、あなた方の助けとなり、その推進に貢献しています。なぜなら私たちは、悪人も、貪欲な者も、悪事を企てる者も、美徳ある人も同様に、神から隠れることはできないこと、また、各人が自分の行いの質に応じて、永遠の刑罰か救いのどちらかを受けること、という教えを堅持しているからです。もしすべての人々がこれを知っていたら、誰ひとり、自分が永遠の火の刑罰に行くことを知りながら、ほんの一時の命のために悪を選ぶことはせず、あらゆる手段で自分を制し、神からの賜物を得、刑罰を避けるために美徳をもって自分を飾り立てたことでしょう。人々は、あなた方の定めた法律と刑罰の恐ろしさから罪を隠そうとするのではありません。あなた方のような人間からは逃げおおせられると知っていて、罪を犯すのです。しかし、神からは、なされた行為だけでなく、意図までも何一つ隠せないと知り、確信していたなら、少なくとも刑罰の恐ろしさから、あらゆる手段を尽くして正しく振る舞おうと努めたはずです。あなた方もこれには同意なさるでしょう。それなのに、あなた方はあたかも、すべての人が美徳に生きるようになり、罰すべき者がいなくなってしまうのを恐れているかのようです。しかしそんなことは、良い為政者ではなく、処刑人にふさわしい心がけです。もっともこれこそ、前に私が言ったとおり、理性に反して生きる人々からいけにえと奉仕とを要求する悪霊たちの仕業にほかならない、と私は確信しています。しかし敬虔と哲学を愛するあなた方は、理性に反することはなさらないでしょう。もしそれでもあなた方が、分別のない人々のように、慣習を真理に優先させるというなら、なしうる限りなさるがよいでしょう。意見を真理に優先させる為政者の権力など、荒れ野にいる盗賊のそれと変わりません。そしてあなた方の企てが成就しないことは、ロゴスそのものが告げています。御父なる神の次に、すべての支配者の中で最も王的で、最も正義な方であるあのロゴスが、です。すべての人が、父の貧しさや苦しみや無名を相続することを嫌うように、理性ある人は、ロゴスが選ぶことを禁めるものを選びません。これらのことがすべて起こると、私たちの教師、万物の父であり主である神の御子にして使徒[5]、イエス・キリストが予言しました。私たちがキリスト者という名を受けたのも、この方からです。それゆえ私たちは、この方から学んだすべてのことにおいて一層確信を持っています。この方が前もって起こると予言されたことは、事実として起こりつつあるのが見られるからです。ある出来事を前もって告げ、それを予言されたとおり正確に起こしてみせることは、神の業なのですから。だから、私たちが正しく真実なことを請うているのだという考えのもとに、私はここで立ち止まり、それ以上何も付け加えないでもよいのですが、無知に囚われた魂を突然変えることは容易ではないことを知っているので、真理を愛する人々を説き伏せるために、いくつかの言葉を付け加えることにしました。真理が示されれば、無知を追い払うことが不可能でないことを知っているからです。</p><h2>13</h2><p>分別のある人の中に、私たちが無神論者ではないと認めない人がいるでしょうか。私たちは万物の造り主を礼拝しており、教えられたとおり、神は血も献酒も香も必要とされないと言い、あらゆる献げ物において、力の及ぶ限り、祈りと感謝の言葉によって神を頌めているのですから。私たちが学んでいるのは、神にふさわしい唯一の尊敬の仕方はこうだ、ということです。すなわち、私たちの食物のために神が与えてくださったものを火で焼き尽くすのではなく、自分たちの用のためと、必要としている人々のために献げ、神に対しては、感謝の思いを込めて、言葉による荘厳な奉仕と歌をもって、私たちが造られたこと、私たちの生活のためのすべての賜物、さまざまな産物の種類、季節の移り変わりについて感謝を捧げ、また、神への信仰によって、私たちが朽ちないものへの復活を得られますようにと、祈りを捧げることです。このことについての私たちの教師はイエス・キリストです。この方こそ、このために生まれ、ユダヤの総督ポンティウス・ピラトゥスのもとで、ティベリウス・カエサルの治世に十字架につけられました。そして私たちは、この方が真の神ご自身の御子であることを知っており、御父に次いで第二にこの方を、第三に預言の霊を置きます[6]。私たちが正しくこの方を礼拝していることを、これから証明いたします。人々は、不変で永遠なる神、万物の父の後に、十字架につけられた人間に第二の位を与えることを、私たちの狂気だと非難します。しかし彼らは、ここに含まれている秘義を知らないのです。私はその秘義をあなた方に示しましょう。どうか入念に耳を傾けてください。</p><h2>14</h2><p>しかし、まず前もって警告しておきます。私がすでに指摘した悪霊たちがあなた方を惑わし、私たちの言葉を受け取り、理解することからさえ遠ざけることのないように、戒めてください。（悪霊たちはあなた方を隷属と奉仕の中に留めておこうとし、夢に現れる姿や、魔法の呪いをもって、自分の救いのために少しも努めないすべての人を虜にしようとしているのです。）私たちもまた、ロゴスを信じるや否や、彼らから離れました。今や御子によって、唯一の、生まれない神[7]に従っています。以前は姦淫を楽しみましたが、今はただ貞潔を愛します。以前は魔法の術を用いましたが、今は善く、生まれない神に自分を委ねました。以前は富と財産を得ることを何よりも気にかけましたが、今は持っているものを共有に振り入れ、必要とするすべての人と分かち合います。以前は互いに憎み、殺し合い、慣習の違いのゆえに、異国人と同じ炉端を囲むことを望みませんでした。しかし今は、キリストの出現の後、彼らと共に暮らしています。そして敵のために祈り、私たちを不当に憎む人々を説き伏せるよう努めています。彼らがキリストの立派な教えに従って生きるなら、万物を治める神から、私たちと同じ賜物を確かに受ける望みを持つことができるように、と。しかし、私が自分の考えであなた方を惑わしていると思われないように、証明を述べる前に、キリストご自身の教えからの抜粋をいくつか挙げることにしました。そして、力ある君主であるあなた方が、私たちがこれを真実に学び、かつ教えているかどうかを調べていただくべきです。この方の教えは簡潔で、冗長なものではありませんでした。この方は詭弁家ではなかったからです。この方の言葉は、神の力だったのです。</p><h2>15</h2><p>貞潔について、彼はこのように語りました。「女を見て欲情を抱く者は、すでに心の中で神の前においてその女と姦淫したのだ」（<a href="https://bibleox.com/ja/jp-ni/mf/5/#L28">マタ. 5:28</a>）。また、「右の目があなたをつまずかせるなら、えぐり出して捨てなさい。片目のままで天の御国に入るほうが、両目を持っていて永遠の火に投げ込まれるより、あなたにはよい」（<a href="https://bibleox.com/ja/jp-ni/mf/5/#L29">マタ. 5:29-30</a>）。さらに、「ほかの男のもとから離れられた女を妻にする者は、姦淫を犯す」（<a href="https://bibleox.com/ja/jp-ni/lk/16/#L18">ルカ. 16:18</a>）。さらに、「人によって去勢された者がいる。また、天の御国のために自分から去勢者になった者がいる。しかし、これを堪えられる者はみなではない」（<a href="https://bibleox.com/ja/jp-ni/mf/19/#L12">マタ. 19:12</a>）。人間の律に従って二度目の結婚に入る人たちが、わたしたちの教師においては罪を犯した人たちとみなされるように、女を見て欲情を抱く人たちも同じです。なぜなら、実際に姦淫を行う者だけが彼によって退けられるのではなく、姦淫を望む者も退けられるからです。神にとっては、業だけではなく願いも知られているのです。そして、60歳、70歳の多くの男たちと女たちがいます。幼いときからキリストの弟子となり、貞潔のうちに生きているのです。わたしはすべての民の中からそのような人たちを指し示す覚悟があります。乱れから立ち帰り、貞潔を学んだ、数えきれない人たちについて語る必要があるでしょうか。キリストは正しい人たちや貞潔な人たちを悔い改めに招いたのではなく、不敬虔な人たち、節制のない人たち、不正な人たちを招いたのです。彼ご自身がこう言われました。「わたしは正しい人を招くために来たのではなく、罪人を悔い改めに招くために来たのです」（<a href="https://bibleox.com/ja/jp-ni/lk/5/#L32">ルカ. 5:32</a>）。天の父は罪人の悔い改めを望み、その刑罰を望まれないのですから。すべての人への愛について彼はこのように教えました。「あなたたちが自分を愛してくれる人たちを愛しているなら、何の新しいことがあるでしょうか。姦淫者たちも同じことをしているのです。しかしわたしは言う。あなたたちの敵のために祈り、あなたたちを憎む人たちを愛し、あなたたちを呪う人たちを祝福し、あなたたちを虐待する人たちのために祈りなさい」（<a href="https://bibleox.com/ja/jp-ni/mf/5/#L46">マタ. 5:46-47</a>、<a href="https://bibleox.com/ja/jp-ni/mf/5/#L44">マタ. 5:44</a>、<a href="https://bibleox.com/ja/jp-ni/lk/6/#L28">ルカ. 6:28</a>）。[8]そして、必要とする人と分かち合うこと、誇示のために何もしないことについて、彼はこのように語りました。「求める者にはみな与えなさい。借りたいと望む者を退けてはならない。受け取りを期待する人たちに貸すなら、何の新しいことがあるでしょうか。徴税人たちも同じことをしています。あなたたちは、虫が食い、錆がつき、盗人が掘り抜く地上の財を蓄えることをしないで、虫も錆も食い尽くすことのない天に財を蓄えなさい。人が全世界を得ても、自分の命を失えば、何の益がありましょうか。そして、その命の身代金を何で払うことができましょうか。だから、虫も錆も食い尽くすことのない天に財を蓄えなさい」（<a href="https://bibleox.com/ja/jp-ni/mf/5/#L42">マタ. 5:42</a>、<a href="https://bibleox.com/ja/jp-ni/lk/6/#L34">ルカ. 6:34</a>、<a href="https://bibleox.com/ja/jp-ni/mf/6/#L19">マタ. 6:19-21</a>、<a href="https://bibleox.com/ja/jp-ni/mk/8/#L36">マコ. 8:36-37</a>）。「あなたたちの父が恵み深く憐み深いように、あなたたちも恵み深く憐み深い者となりなさい」（<a href="https://bibleox.com/ja/jp-ni/lk/6/#L36">ルカ. 6:36</a>）。「あなたたちの太陽が、不正な人たちの上にも、正しい人たちの上にも、悪い人たちの上にも昇るようにと命じる。食べることや身を包むことについて心配してはならない。あなたたちは鳥や獣よりも優れていないか。神は彼らをも養われる。だから、食べることや身を包むことについて心配してはならない。天のあなたの父は、あなたたちがこれらのものを必要としていることをご存じだからである。天の御国を求めなさい。そうすれば、これらのものはみなあなたたちに加えられるであろう。どこに財があるか、そこに人の心があるからである。そして、これを人々に見られるためにはしないこと。そうでなければ、天のあなたの父から報いがない」（<a href="https://bibleox.com/ja/jp-ni/mf/5/#L45">マタ. 5:45</a>、<a href="https://bibleox.com/ja/jp-ni/mf/6/#L25">マタ. 6:25-26</a>、<a href="https://bibleox.com/ja/jp-ni/mf/6/#L32">マタ. 6:32-33</a>、<a href="https://bibleox.com/ja/jp-ni/lk/12/#L34">ルカ. 12:34</a>、<a href="https://bibleox.com/ja/jp-ni/mf/6/#L1">マタ. 6:1</a>）。</p><h2>16</h2><p>無分別でなく、すべての人に仕え、怒らないでいることについて、彼の言葉は次のとおりです。「あなたに平手打ちをした者に、もう片方の頬を向けなさい。また、あなたのシャツや上着を取ろうとする者を引き留めてはならない。怒る者は火の責めに値する。あなたに一里を行けと強いる者とは二里を共に行きなさい。あなたたちの良い業が人々の前で輝くようにしなさい。そうすれば、人々はそれを見て、天にいますあなたの父を讃めるであろう」（<a href="https://bibleox.com/ja/jp-ni/mf/5/#L39">マタ. 5:39-40</a>、<a href="https://bibleox.com/ja/jp-ni/mf/5/#L22">マタ. 5:22</a>、<a href="https://bibleox.com/ja/jp-ni/mf/5/#L41">マタ. 5:41</a>、<a href="https://bibleox.com/ja/jp-ni/mf/5/#L16">マタ. 5:16</a>）。[9]わたしたちは争いを起こしてはなりません。彼も、わたしたちが悪い人たちの追随者であることを望んではいません。しかし彼は、忍耐と柔和によって、すべての人を恥辱ある業から、悪への偏りから引き離すようにと、わたしたちに勧めました。これは、わたしたちの中の多くの人たちによって示すことができます。彼らは、厚かましく凶暴な人たちでしたが、変化しました。隣人たちの厳格な生活をよく見たことによって、あるいは同行する人たちの中に見た、辱めに耐える不思議な忍耐によって、あるいは、事業の中で交わった人たちの品性を経験から知ったことによってです。誓いを全く立てず、真実を語ることについて、彼はこう命じました。「全く誓ってはならない。あなたたちの言葉は、是は是、非は非となるようにしなさい。これを超えるものは悪い者からです」（<a href="https://bibleox.com/ja/jp-ni/mf/5/#L34">マタ. 5:34-37</a>）。一人の神を拝すべきことについては、彼はこう説得されます。「最も大きな掟はこれである。お前の神なる主を拝し、ただ主にのみ仕えよ。お前の心をすべてで、お前の力をすべてで、お前を造られた主、神に」（<a href="https://bibleox.com/ja/jp-ni/vtor/6/#L13">申. 6:13</a>）。[10]ある人が彼のもとに来て、「良い教師よ」と言ったとき、彼は答えて言いました。「善い方はただ一人、すべてを造られた神だけである」（<a href="https://bibleox.com/ja/jp-ni/mf/19/#L17">マタ. 19:17</a>）。もし、キリストが教えたとおりに生きない人がいたなら、その人は、キリストの教えを舌で言っているにもかかわらず、キリスト者ではないことが知られるでしょう。彼は、ただ語る者ではなく、業を行う者たちが救われると教えたからです。彼はこう言われました。「わたしに向かって主よ、主よと言う者がみな天の御国に入るのではなく、天にいますわたしの父の御心を行う者が入る。わたしを聞いて、わたしの言うことを行う人は、わたしを遣わされた方を聞いているのである。多くの人がわたしに言うであろう。主よ、主よ、わたしたちはあなたの名によって食べ、飲み、奇跡を行ったではないか。そのときわたしは彼らに言うであろう。わたしから離れよ、無法を働く者たちよ。そのとき、正しい人たちが太陽のように輝き、不正な人たちが永遠の火に送られるようになると、泣き叫び、歯ぎしりするであろう。多くの人がわたしの名によって来る。外は羊の皮を着、内は貪欲な狼である。しかし、あなたたちは彼らの業によって彼らを知るであろう。良い実を結ばない木はすべて切り倒されて火に投げ込まれる」（<a href="https://bibleox.com/ja/jp-ni/mf/7/#L21">マタ. 7:21</a>、<a href="https://bibleox.com/ja/jp-ni/lk/10/#L16">ルカ. 10:16</a>、<a href="https://bibleox.com/ja/jp-ni/lk/13/#L26">ルカ. 13:26-27</a>、<a href="https://bibleox.com/ja/jp-ni/mf/13/#L42">マタ. 13:42-43</a>、<a href="https://bibleox.com/ja/jp-ni/mf/7/#L15">マタ. 7:15-16</a>、<a href="https://bibleox.com/ja/jp-ni/mf/7/#L19">マタ. 7:19</a>）。そして、わたしたちは、彼の教えに従って生きず、ただキリスト者と呼ばれている人たちが、あなたたちによっても罰されることを求めます。</p><h2>17</h2><p>わたしたちは、至るところでまず、あなたたちが立てた役人たちに税と課役を支払うよう努めています。彼の命令がそうだからです。あるとき、何人かが彼のもとに来て尋ねました。カエサルに税を納めるべきでしょうか。彼は答えた。「わたしに言いなさい。このコインには誰の姿が刻まれているか」。彼らは言いました。カエサルのものです。彼は彼らに答えた。「それなら、カエサルのものはカエサルに、神のものは神に納めなさい」（<a href="https://bibleox.com/ja/jp-ni/mf/22/#L19">マタ. 22:19-21</a>）。それゆえ、わたしたちはただ一人の神を拝しますが、そのほかの点では、あなたたちを人間の王たちと指導者たちとして認め、喜んであなたたちに仕え、あなたたちが王の権威のもとで健全な判断をも与えられるようにと祈っています。しかし、あなたたちがわたしたちの祈りと率直な説明に耳を傾けないとしても、わたしたちは何の害も受けません。わたしたちは、各人が自分の業に応じて永遠の火で罰され、神から受けた力のぶんだけ報告を求められると信じ、いや、完全に確信しているからです。キリストはこう言われました。「神がより多くを与えた人から、より多くを求められる」（<a href="https://bibleox.com/ja/jp-ni/lk/12/#L48">ルカ. 12:48</a>）。かつての統治者たちのそれぞれの終わりを見てください。彼らは万人共通の死に死にました。もし死が感覚のない状態に至ることなら、それはすべての悪人にとって利益でしょう。しかし、生きてきたすべての人のうちに感覚が留まり、すべての人に永遠の刑罰が迫っているなら、わたしが言うことが真実であると確信し、信じることをためらわないでください。実際、ネクロマンシー、汚されていない少年たちによる占い、人間の魂の呼び出し、魔術師たちが呼ぶ夢の導き手や守護精霊、これらのことに携わる人たちのすべての業——それらが、魂が死後も感覚を保つことをあなたたちに説得させるでしょう。死者の魂に取り憑かれ、下へと突き進む人たち——すべての人が狂人、憑依者と呼ぶ人たち——によっても。そして、あなたたちが呼ぶアムピロコス、ドドナ、ピュティアの神託とそのほかの類似のものによっても。エンペドクレスとピタゴラスとプラトンとソクラテスという書き手たちの教えによっても。ホメロスの溝と、死者を見るためのオデュッセウスの降下と、同じことを語ったほかの人たちの意見によっても。少なくとも彼らと同じように、わたしたちの言葉も聞いてください。わたしたちは彼らに劣らず神を信じています。いや、より多く信じています。わたしたちは、死んで土に帰ったわたしたちの体を再び受け取ることを望んでいるからです。神にとって不可能なことは何もない、と確信しているからです。</p><h2>18</h2><p>もしわたしたちが体の中に存在せず、誰かがわたしたちに、人の種の小さな一滴から、わたしたちが目にする骨と筋と肉が形成されると語ったなら、よく考える人にとって、これよりも信じがたいことがあるでしょうか。仮定して語りましょう。あなたたちは今の姿では存在せず、あなたたちの親たちから生まれなかったとしましょう。もし誰かがあなたたちに人の種子と人の姿の形を示し、そこからそのような存在が生じたと主張したなら、実際に見ていなければ、あなたたちはそれを信じたでしょうか。信じなかったということを否定する人はいないと思います。同じように、あなたたちの不信は、復活する死人をまだ見ていないことから生じています。しかし、小さな一滴からあなたたちが今のような姿になると、以前には信じなかったでしょうが、今はこれが行われるのを見ています。それと同じように判断してください。人の体は、種子のように崩れて土に帰ったとしても、神の命令によって、その時が来れば復活し、不朽のものとされるのです。</p><h2>19</h2><p>何でも生じたものに帰るという者たちが彼に帰している力が、神にふさわしいどのような力なのか、わたしは言い得ません。それを超えて、神ご自身は何もそれ以上にすることができない、というのです。しかし、わたしにはこれだけが見えます。彼らは、自分自身も世界全体も、このような物質からできていると、いつか自分たちがこのような姿になることを信じなかったであろうということです。それゆえ、わたしたちは、わたしたちの本性には、また人間には不可能なことでも信じるほうが、ほかの人たちと同じように不信であるよりは良いことだと考えます。わたしたちの教師であるイエス・キリストが、「人には不可能なことも、神には可能である」（<a href="https://bibleox.com/ja/jp-ni/lk/18/#L27">ルカ. 18:27</a>）と言われ、また、「あなたたちを殺す者たちを恐れてはならない。彼らはその後、それ以上何もすることができないからである。しかし、殺した後、魂も体もゲヘナに投げ込むことのできる方を恐れなさい」（<a href="https://bibleox.com/ja/jp-ni/lk/12/#L4">ルカ. 12:4-5</a>）とも言われたことを知っているからです。ゲヘナとは、不正に生きた人たち、そして神がキリストを通して教えたことが起きると信じようとしなかった人たちが苦しめられる場所です。</p><h2>20</h2><p>シビュラとヒュスタスペスは、朽ちるものが火によって滅ぼされると語りました。いわゆるストア派の哲学者たちは、神ご自身も火に溶け、そのような変化の後に再び世界が生じると主張しています。わたしたちは、万物の造り主である神は、変化する物たちよりも優れていると考えます。それなら、わたしたちがあることを、あなたたちが敬う詩人たちや哲学者たちと一致するように語り、別のことを、彼らよりもより完全に、神にふさわしく語り、しかも証しを持っているのはわたしたちだけであるなら、なぜわたしたちは誰よりも不当に憎まれるのでしょうか。すべてのことが神によって整えられ造られたと言うとき、わたしたちはプラトンの教えを語っていることが知られます。世界が火で焼かれると言うとき、ストア派の意見に従って語っています。悪人たちの魂が死後も感覚を持ち、罰され、善い人たちの魂は罰から解放されて至福のうちに生きると教えるとき、哲学者たちと同じことを語っています。人手の業を拝してはならないと言うとき、喜劇詩人メナンドロスや同じ考えのほかの人たちと同じことを語っています。彼らは、作者は作品よりも優れていると言いました。</p><h2>21</h2><p>そして、わたしたちが、神の初生の子である言葉、わたしたちの教師イエス・キリストが、交わりなしに生まれ、十字架につけられ、死んで、復活して天に上げられたと言うとき、わたしたちは、あなたたちがいわゆるゼウスの子たちについて語ることと異なる何かを持ち出しているのではありません。あなたたちが敬う書き手たちの語るとおり、ゼウスの子たちがどれほど多くいたか、あなたたちは知っています。エルメス——解説する言葉であり、すべての人の教師。アスクレピオス——医者でもあり、雷に打たれて天に上がった。ディオニュソス——引き裂かれた。ヘラクレス——労苦から逃れるために火の中に飛び込んだ。レダから生まれたディオスクロイ、ダナエから生まれたペルセウス、人間から生まれながらペガソスの馬に乗って天に上がったベレロフォンテス。アリアドネや、彼女と同じように星の間に置かれたほかの人たちについては言うまでもありません。それに、あなたたちはどうして、死んだ皇帝たちを永遠に不死とし、焼かれたカエサルが薪の山から天に上がるのを見たと、誓って確言する何人かの人を立てようとするのでしょうか。いわゆるゼウスの子たちについて語られる業については、知っている人たちには語る必要はありません。ただこれだけ言えば十分です。それらは道徳を堕落させ、あなたたちの青年たちに害を与えるために書かれたのです。皆が、神々に倣うことは良いことだと考えるからです。貞潔な魂から、このような神々についての考えは遠ざかりませんように。すなわち、彼らの言うところの、すべての親であり最も主要なゼウスが父殺しであり、同じような父殺しの子であったこと、悪く卑しい快楽の偏りに引きずられて、ガニュメデスのもとに、そして姦淫した多くの女たちのもとに降ったこと、彼の子たちも同じような業を行ったこと——これを信じることです。これは、先にわたしが言ったとおり、悪霊たちがしたことです。そしてわたしたちは、聖なる生き方と徳によって神に近づく者だけが不死に至ると教えられています。不正に生きて悔い改めない人たちについては、彼らが永遠の火の中で苦しむことをわたしたちは信じています。</p><h2>22</h2><p>しかし、イエスと呼ばれる神の子は、たとえただの人間としてのみ存在したとしても、その知恵によって神の子と呼ばれるにふさわしいでしょう。あなたたちの書き手たちは皆、神を人間の父とも、神々の父とも呼ぶのですから。しかし、わたしたちが、神の言葉である彼が、神から特別な仕方で、普通の誕生を超えて生まれたと言うなら、先に述べたとおり、エルメスを神からの使者である言葉と呼ぶあなたたちと、これを共有させましょう。そして、キリストが十字架につけられたと反論する人がいるなら、これも先に挙げた、あなたたちのいうゼウスの子たちと共有されることです。彼らは苦しみを受けたのですから。彼らの受難は、語られるところでは、死に至るものでありながら、同じではありませんでした。彼らはそれぞれ異なっていました。それゆえ、彼はその受難の特殊性においても、彼らに何ら劣らず、むしろ優れていることを、わたしは証明するでしょう。わたしが弁明の予備的な部分で成し遂げようと望んだこと、あるいはすでに証明したことです。なぜなら、業から、誰がより優れているかが示されるからです。彼がおとめから生まれたと言うなら、これもペルセウスと共有されるものと考えなさい。彼が足の不自由な人たち、病で動けない人たち、生まれつき盲人だった人たちをいやし、死者を生き返らせたと告げるとき、これもアスクレピオスの業について語られることと同じだと示す必要があります。</p><h2>23</h2><p>しかし、あなたたちに知っておいていただきたいのです。真実なのは、わたしたちがキリストと、彼に先立った預言者たちから教えられて主張することだけです。そしてこれは、あなたたちのすべての書き手よりも古いのです。わたしたちの言葉を信じなければなりません。彼らと似たことを言うからではなく、真実を言うからです。この教えをわたしたちに授けたのは、イエス・キリストです。神から生まれた唯一の固有の子、彼の言葉、初生の子、力であり、その御心によって人となられた方——人類を変化させ回復するためにです。そして、彼が人間の中に人として生まれる前に、ある人たち——先に述べた悪霊たちのことです——詩人たちを通して、後の詩人たちが自分たちで作った物語の中で描いたことを、あたかも事実であったかのように前もって語りました。彼らが、わたしたちに着せられるけれども何の証人も証しもない、恥辱ある不敬虔な業を作り上げたのと同じ仕方でです。この主張に対して、次のような論拠を示しましょう。</p><h2>24</h2><p>第一に、わたしたちはギリシア人たちと似たことを言うにもかかわらず、キリストという名のゆえにだけ憎まれ、何の罪もないのに犯罪者として死に渡されます。一方、別の場所では、ほかの人たちが木々や川を拝し、鼠や猫やワニや多くのほかの無理性の動物たちを拝しています。しかも、すべての人たちが同じ物を敬っているのではなく、民ごとに異なる敬いの物があるので、すべての人が、ほかの人たちの目には不敬虔なのです。同じものを拝しないからです。そして、あなたたちがわたしたちに着せることができる罪はただこれだけです。すなわち、わたしたちはあなたたちの神々を拝せず、死者に献酒と香料を献げず、その像に花環や献げ物を献げないことです。しかし、あなたたちは自分でもよく知っています。同じ物が、ある人たちには神として拝され、ある人たちにはただの獣と見なされ、ある人たちには合法的な献げ物として用いられていることを。</p><h2>25</h2><p>第二に、わたしたちは、すべての民の人たちでしたが、以前はセメレの子ディオニュソスや、レトの子アポロンを拝していました。彼らの愛の行いについては語るのも恥です。同じようにペルセポネとアフロディテを——彼女たちはアドニスのことで狂乱した人たちで、あなたたちはその秘儀を執り行っているのですから——、あるいはアスクレピオスや、いわゆるほかの神々を拝していました。しかし今、たとえこのことのために死が脅かそうとも、わたしたちはイエス・キリストを通して、彼らすべてを軽蔑し、生まれない神、情欲のない神に身を献げました。この神は——わたしたちは再び確信します——不純な情欲によってアンティオペやほかの女たちのもとに、あるいはガニュメデスのもとに降らず、テミスを通して百手の巨人から得た助けによって解放される必要もなく、そのことの報いに、愛人のブリセイスのためにアキレウスに多くのギリシア人を滅ぼさせることも望まれませんでした。これらの神話を信じる人たちがわたしたちにはいたわしい。わたしたちはそれを霊たちの業と認めています。</p><h2>26</h2><p>第三に、キリストが天に上げられた後、霊たちは、自分たちを神々と呼ぶ何人かの人たちを立ち上げました。そして彼らはあなたたちに迫害されなかったばかりでなく、名誉をも与えられました。その一人がサマリヤのシモン、ギトンという村の出身です。彼は、彼を通して働く霊たちの力によって、クラウディオス・カエサルのとき、あなたたちの王の都ローマで魔術的な奇跡を行い、それゆえ神と認められ、神としてあなたたちから像を与えられました。この像はテベレ川のほとり、二つの橋の間に立てられ、ラテン語で「聖なる神シモンに」という銘が刻まれています。そして、ほぼすべてのサマリヤ人たち、そしてほかの民からも何人かが、彼を最初の神と認め、拝しています。そして、そのときどこにでも彼と共に歩き、以前は淫売宿に住んでいたヘレナという女を、彼から最初に出た思い（エンノイア）と呼んでいます。さらに、カッパレテイア村出身のもう一人のサマリヤ人メナンドロス、シモンの弟子が、霊たちの影響のもとに、アンティオキアで魔術の業によって多くの人を惑わしました。彼は自分の追随者たちに、彼らは死なないとまで確言しました。今でも、そのような考えを抱く彼の弟子たちがいます。さらに、ポントスのマルキオンがいます。彼は今日でも、彼を信じる人たちに、造り主よりも高い別の神を認めるようにと教えています。彼は霊たちの助けによって、すべての民から多くの人に神を冒涜させることに成功し、全世界の造り主である神を退け、彼よりも高い、彼よりも大きなことをした別の神を告白させています。このような人たちから出て来た人たちは皆、先に言ったとおり、キリスト者と呼ばれています。哲学者たちの中で、教えを同じくしない人たちが、哲学から取った共通の名を帯びるのと同じです。彼らが、民の間に語られるあの恥辱ある業——灯し火を消すこと、互いの交わり、人の肉を食べること——を行うかどうか、わたしは知りません。しかし、彼らを少なくともその教えのために迫害し殺さないことを、わたしは知っています。ところで、わたしは、これまでのすべての異端に反対して書いた著作を持っています。あなたたちがそれを持つことを望むなら、お渡しします。</p><h2>27</h2><p>わたしたちは、誰のことも煩わせず、自分たちも罪を犯さないように、次のような考えを抱いています。すなわち、生まれたばかりの赤子を捨てることは悪い人たちの業である、と。まず、そのような子たちのほとんどすべて——わたしたちが見るとおり——女の子だけでなく男の子までもが、姦淫に用いられます。昔の人たちは、語られるところでは、牛や山羊や羊の群れを、また放牧される馬を飼っていたそうですが、今では子どもたちだけがこの恥辱ある業のために用いられています。そして、すべての民の中に、この嫌悪すべきことに仕える、多くの両性具有者と男色者がいます。あなたたちは彼らから給料、贈り物、税を取っていますが、彼らをあなたたちの地から根絶やかにすべきなのです。そして、彼らを利用する人たちのうちの誰かが、不敬虔で無恥な交わりを超えて、そのときが来れば、自分の息子や親戚や兄弟とも交わります。自分の子どもたちや妻をこの業に渡す人たちもいます。さらには、ある人たちが逆自然の乱れのために自分自身を明らかに歪めており、そのような秘儀を神々の母に帰しています。それに加えて、あなたたちが拝する各神々には、蛇が描かれています。大きな神秘的な象徴として。そして、あなたたちが公然と行い、敬うこれらの不品行を、わたしたちが神聖な光が消えて見えなくなるときに行うのだと、わたしたちに着せます。しかし、このような中傷は、これらの罪に全く無関係なわたしたちを害しません。むしろ害を受けるのは、それを行い、わたしたちに偽って着せる人たちです。</p><h2>28</h2><p>わたしたちにおいて、悪い霊たちの長は蛇とサタンと悪魔と呼ばれています。これはわたしたちの書を調べることからも知ることができます。彼は、自分の軍勢のすべてと、彼に従う人たちと共に、キリストが預言されたとおり、無限の時代のあいだ苦しむために火の中へ送られるであろう。そして、神がこのことを実行に移すことを引き延ばされるのは、人類のためです。彼は、ある人たちが悔い改めを通して救われることを前もって知っておられるからです。ある人たちは、おそらくまだ生まれてもいません。そして、初めに神は人類を、真実を選び、善を行う能力のある理性ある存在として造りました。それは、誰の前にも神に対して言い訳が残らないようにするためです。すべての人が理性あるものとして、観想する能力のあるものとして造られたのですから。もし誰かが、神がこのことを配慮しておられると信じないなら、その人は、直接的ではないにせよ、神の存在を退けるか、あるいは、神は存在するけれども悪を楽しんでおり、石のように存在しておられる、徳も悪徳も存在せず、人々の意見によってのみ一方が善とされ、他方が悪とされている、と言わなければなりません。これこそ最大の不敬虔と無法です。</p><h2>29</h2><p>私たちが子どもを捨て置くことをはばかる理由には、もう一つあります。すなわち、捨てられた子がすぐに拾われなければ死んでしまい、私たちが人殺しとなってしまうことのないようにするためです。私たちは結婚するとしても、それは子どもを養育するためでなければしませんし、結婚を退けるのであれば、生涯を貞潔のうちに過ごします。恥ずべき交わりが私たちにとって何らかの機密[11]であるわけではないことを皆さんに証明するために――先日、私たちの仲間の一人がアレクサンドリアの総督フェリクスに請願書を提出し、外科医に去勢を施してもらう許可を求めました。当地の外科医たちは、総督の許可なしにはそれを行ってはならないと言っていたからです。フェリクスがどうしても請願書に署名しようとしなかったので、この青年は独身のままとどまり、みずからの良心の証しと、同じ考えを持つ者たちの承認とに満足しました。ここで、つい最近亡くなったアンティノオス[12]にも触れておくのが適切だと思われます。彼は、何者であり、どこから来たのかを人々が知りながらも、すべての人に恐れをもって神として崇められたのです。</p><h2>30</h2><p>もし誰かが私たちにこう反論するなら――「私たちがキリストと呼ぶ者も、人間から生まれた一人の人間であり、私たちが奇蹟と呼ぶ業を魔術によって行い、それゆえに神の子と見えたのかもしれない。何がそれを妨げるというのか」――、今ここで私は証明を示します。言葉だけの主張に頼るのではなく、それらの出来事が起きる前に将来を預言した人たちによって、やむをえず納得させられているからです。私たちは、出来事が預言されたとおりに成し遂げられ、また今も成し遂げられつつあるのを、みずからの目で見ているのですから。この証明こそ、皆さんにとっても最も偉大で最も真実な証拠と思われることでしょう。</p><h2>31</h2><p>ユダヤ人の間には、神の預言者たちがいました。預言の霊は彼らを通して、将来の出来事が起きる前にそれを予告したのです。彼らの預言は、預言者たちがみずからユダヤ語で書物にまとめ、語られたときのままの形で、その時代ごとにユダヤを治めていた王たちが入念に保管していました。しかし、エジプトの王プトレマイオスが図書館を設立し、すべての人々の著作を集めようとしたとき、これらの預言についても耳にして、当時ユダヤを治めていたヘロデのもとに使者を送り、預言の書を送ってくれるよう頼みました。ヘロデ王はこれらの書物を、前述のとおりユダヤ語で書かれたままの形で送りました。ところがエジプト人たちにはその内容が分からなかったので、プトレマイオスは再び使者を送り、それをギリシア語に翻訳する人々を送ってほしいと頼みました。こうして実現し、その書物はエジプト人たちのもとに今日まで留まり、また世界中のあらゆるユダヤ人のところにも伝わっています。しかしユダヤ人たちは読んではいるものの、そこに書かれていることの意味を理解せず、私たちを敵、対抗者と見なして、皆さんと同じように、可能なときにはいつでも私たちを殺し、苦しめています。そのことは皆さんもよくご存じでしょう。実際、先のユダヤ戦争では、叛乱の指導者バル・コクバが、イエス・キリストを否認して冒涜の言葉を吐かない限り、キリスト者だけを恐ろしい刑罰にかけるよう命令しました。この預言者たちの書物の中で私たちは、イエスなる私たちのキリストが来ること、おとめから生まれて成長すること、あらゆる病気とあらゆる患いを癒やし、死人を復活させること、憎まれ、わかられないままであり、十字架につけられて死に、復活して天に昇り、神の子であること、また神の子と呼ばれることを予告したのを見出します。さらに、ある人たちが彼によってあらゆる国民にこれらのことを宣べ伝えるために遣わされ、ユダヤ人よりもむしろ異邦人のほうに多くの人々が彼を信じること、これも預言されていました。これらのことは彼が現れる前、最初は5000年、次いで3000年、さらに2000年、1000年、そしてまた800年前に預言されたのです。なぜなら、世代の継起に応じて、次々と預言者たちが現れていたからです。</p><h2>32</h2><p>モーセは預言者たちの最初の者として、そのままの言葉でこう言いました。「ユダから君主は絶えず、そのももの間からの指導者は去らず、彼に留め置かれた者が来るまで。彼こそは諸国民の望みであり、彼は自分の子ろばをぶどうの木につなぎ、その衣をぶどうの房の血で洗う」（<a href="https://bibleox.com/ja/jp-ni/gen/49/#L10">創. 49:10-11</a>）[13]。今、皆さんは注意深く調べて、ユダヤ人がみずからの君主と王を持っていたのがいつの時代までかを確かめることができます。それは、私たちの教師であり、いまだ理解されていなかった預言の解き明かし手であるイエス・キリストが現れるまでのことでした。聖なる神なる預言の霊がモーセを通して預言されたとおり、「ユダから君主は絶えず、彼に留め置かれた王国が来るまで」（<a href="https://bibleox.com/ja/jp-ni/gen/49/#L10">創. 49:10</a>）。ユダはユダヤ人の始祖であり、彼らはそこからユダヤ人という名を得ました。キリストが現れた後、あなた方がユダヤ人の上に王となり、彼らの全土を手に入れました。そして「彼は諸国民の望みとなる」という言葉は、あらゆる国民の中から人々が彼の再臨を待ち望むようになることを示しています。これは皆さん自身も見て、事実によって確かめることができます。人類のあらゆる民族の中に、ユダヤで十字架につけられた方を待ち望む人々がいるのですから。その方が死んだ直後に、ユダヤの地はあなた方に戦利品として引き渡されました。「自分の子ろばをぶどうの木につなぎ、その衣をぶどうの房の血に洗う」という言葉は、キリストに起きるはずの出来事と、彼がなすはずの業とを示す象徴でした。当時、ある村の入り口に、子ろばがぶどうの木につながれて立っていました。キリストは弟子たちにそれを自分のもとへ連れて来るように命じ、連れて来られると、彼はそれに乗ってエルサレムに入りました。そこにはユダヤ人の大いなる神殿があったのですが、それはのちにあなた方によって破壊されました。その後、彼は十字架につけられました。預言の残りの言葉が成就するためです。「その衣をぶどうの房の血に洗う」という言葉は、彼が受けるはずの受難――みずからの血によって彼を信じる者たちを清めること――を予告していました。神の霊が預言者を通して「その着物」と呼ばれるものは、彼を信じる人々であり、その中に神からの種である言葉、すなわちロゴスが宿っているのです。そして「ぶどうの房の血」と語られるものは、現れるはずの方が血を持つこと、しかしそれは人間の種からではなく神の力から来ることをほのめかしています。すべての父であり主である神の次に置かれた第一の力であり、子である方は、肉を受け取って人となった言葉（ロゴス）です。そのありかたについては、のちほど述べましょう。ぶどうの木の血を人間が作ったのではなく神が作ったのと同じように、この血も人間の種からではなく神の力から生じること、それがここでほのめかされているのです。先に述べたとおりです。そして、もう一人の預言者イザヤが、同じことを別の言葉で預言してこう言いました。「ヤコブから星が昇り、エッサイの根から花が生え出る。その腕にこそ、国民たちは望みを置く」（<a href="https://bibleox.com/ja/jp-ni/chis/24/#L17">民. 24:17</a>、<a href="https://bibleox.com/ja/jp-ni/is/11/#L1">イザ. 11:1</a>、<a href="https://bibleox.com/ja/jp-ni/is/11/#L10">イザ. 11:10</a>）。昇った輝く星、エッサイの根から生え出た花――これがキリストです。神の力によって、ユダの父であるヤコブの種から出たおとめから生まれたからです。ヤコブは先に述べたとおりユダヤ人の始祖であり、預言の言葉によればエッサイがその先祖であり、彼は世代の継起にしたがってヤコブとユダの子なのです。</p><h2>33</h2><p>さらに、イザヤがはっきりした言葉で、キリストがおとめから生まれると預言したことをお聞きください。こう言われています。「見よ、おとめが身ごもって男の子を産む。その名は『我らと共にいる神』と呼ばれる」（<a href="https://bibleox.com/ja/jp-ni/is/7/#L14">イザ. 7:14</a>）。人間の理解には信じがたく不可能に思えることを、神は預言の霊によって、これから起きると預言されたのです。それは、実現したときに人々が不信にとどまることなく、預言されていたがゆえに信じるようになるためです。しかし、今引用した預言を理解しないで、私たちが詩人たちに責めを負わせてきたのと同じ責めを私たちに負わせる人が出ないように――すなわち、ゼウスが情欲の求めに従って女のもとに降りていったと言う詩人たちに、私たちが責めを負わせているのと同じことについて――、その言葉を説明しておきましょう。「見よ、おとめが身ごもる」という言葉は、おとめが交わりなしに身ごもることを意味します。もしある人と交わったなら、その人はもはやおとめではないからです。神の力がそのおとめに降り、これに影を垂れて、おとめのまま身ごもるようにしたのです。そして当時そのおとめのもとに遣わされた神の御使いたちは、こう告げ知らせました。「見よ、あなたは聖霊によって身ごもり、男の子を産む。その子は『いと高き者の子』と呼ばれる。あなたはその名をイエスと呼ぶ。彼が民を罪から救うからである」（<a href="https://bibleox.com/ja/jp-ni/lk/1/#L31">ルカ. 1:31-32</a>、<a href="https://bibleox.com/ja/jp-ni/mf/1/#L21">マタ. 1:21</a>）。これは、私たちの救い主イエス・キリストに関するすべてを記録した人たちの述べるところであり、私たちは彼らを信じます。というのも、先に挙げたイザヤを通しても、預言の霊はキリストが先に述べたとおりに生まれると預言していたからです。ですから、神の霊と力を、神の初生の子でもある言葉（ロゴス）[14]以外の何ものかとして理解することはできません。これは先述の預言者モーセが示したとおりです。この言葉こそ、おとめに降り、これに影を垂れて、交わりによらず、力によって身ごもらせたのです。イエスという名は、ユダヤ語からギリシア語に訳せば「救い主」の意味です。それゆえ御使いもおとめに言ったのです。「あなたはその名をイエスと呼ぶ。彼が民を罪から救うからである」（<a href="https://bibleox.com/ja/jp-ni/mf/1/#L21">マタ. 1:21</a>）。預言者たちが神の言葉（ロゴス）以外の何ものかによって感づかされるのではないということは、皆さんも同感してくださるでしょう。</p><h2>34</h2><p>さらに、もう一人の預言者ミカが、彼がどこで生まれるはずであったかについても預言したことをお聞きください。こう言われています。「ベツレヘムよ、ユダの地よ、ユダの支配者のうちでまったく取るに足らないものではない。お前から、わたしの民を牧する支配者が出る」（<a href="https://bibleox.com/ja/jp-ni/mih/5/#L2">ミカ. 5:2</a>）。ユダヤの地には、エルサレムから35スタディオン（約6キロ）離れた村が一つあり、イエス・キリストはそこで生まれました。このことは、ユダヤにおけるあなた方の最初の統治者であったキリニウスの時に行われた課税の台帳からも知ることができます。</p><h2>35</h2><p>さらに、キリストが生まれた後、成人に達するまで他の人々に知られないままであったこと――実際にそのとおりになったのです――については、その予告をお聞きください。「わたしたちのために一人の子どもが生まれ、一人の若者が与えられ、その権威は彼の肩の上にある」（<a href="https://bibleox.com/ja/jp-ni/is/9/#L5">イザ. 9:5</a>）。この言葉は十字架の力を意味しています。十字架につけられた彼は、その肩を十字架の木に負わせられたのです。このことは、のちの論述の中でより明らかに示されるでしょう。そして再び、同じ預言者イザヤが預言の霊に感づかされてこう言いました。「わたしは手を差し伸べた。従わず、逆らう民に、良くない道を歩む者たちに。今や彼らはわたしに裁きを求め、神に近づく大胆さを示す」（<a href="https://bibleox.com/ja/jp-ni/is/65/#L2">イザ. 65:2-3</a>）[15]。さらに別の言葉で、もう一人の預言者を通してこう言われています。「彼らはわたしの手と足を刺し、わたしの着物についてくじを引いた」（<a href="https://bibleox.com/ja/jp-ni/ps/22/#L17">詩. 22:17</a>、<a href="https://bibleox.com/ja/jp-ni/ps/22/#L19">詩. 22:19</a>）。これらの言葉を語った王であり預言者であるダビデには、そのようなことは何一つ起きませんでした。しかしイエス・キリストは、彼に逆らい、彼がキリストではないと言ったユダヤ人たちによって、両手を広げて十字架につけられたのです。また預言者の言うとおり、彼らは彼を辱めて裁判の座に座らせ、「わたしたちを裁け」と言いました。「わたしの手と足を刺した」という言葉は、十字架で彼の手と足に打ち込まれた釘のことを指しています。十字架刑の後、彼らはその着物についてくじを引き、十字架につけた者たちの間で分けました。これらのことが実際に起きたことは、ポンティウス・ピラトゥスの時に作成された記録[16]から知ることができます。さらに、もう一人の預言者ゼファニヤ[17]の預言の言葉を引きますが、そこではっきりと、キリストが子ろばに乗ってエルサレムに入ると予告されています。言葉はこうです。「シオンの娘よ、大いに喜べ。エルサレムの娘よ、叫び告げよ。見よ、お前の王がお前に来る。柔和な方、ろばに乗り、ろばの子、荷負けの若ろばに乗って」（<a href="https://bibleox.com/ja/jp-ni/zah/9/#L9">ゼカ. 9:9</a>）。</p><h2>36</h2><p>預言者たちの言葉が、あたかも本人の口調で語られるように聞こえるとき、それが感づかされた本人たちみずからの言葉ではなく、彼らを動かす神の言葉（ロゴス）の言葉だと考えないでください。彼はあるとき、これから起きることを未来を予告する者の形で語り、あるとき、すべての主であり父である神の口調で語り、あるとき、キリストの口調で、またあるとき、主あるいはその父に応答する民の口調で語ります。このことは皆さん自身の作家たちにも見られます。一人の書き手が全体を書いていながら、語る人物たちを登場させているのですから。ユダヤ人たちは預言者たちの書物を持ちながらこのことを理解せず、キリストが現れたときに彼を認めませんでした。さらに、彼がすでに現れたと語り、預言されたとおり彼がユダヤ人たちの手によって十字架につけられたことを証明する私たちを憎んでいます。</p><h2>37</h2><p>このことも皆さんにはっきりするように、父の口調でイザヤを通して語られた言葉があります。「牛はその所有者を知り、ろばはその主人の飼い葉桶を知る。しかしイスラエルはわたしを知らず、わたしの民は理解しなかった。ああ、罪ある民よ、罪に満ちた民よ、邪悪な種よ、不法の子らよ。お前たちは主を捨てた」（<a href="https://bibleox.com/ja/jp-ni/is/1/#L3">イザ. 1:3-4</a>）。さらに別のところで、同じ預言者がやはり父の口調でこう言います。「わたしのためにどんな家を建てるのか、と主は言われる。天はわたしの玉座であり、地はわたしの足の踏み台である」（<a href="https://bibleox.com/ja/jp-ni/is/66/#L1">イザ. 66:1</a>）。さらに別のところではこうです。「お前たちの新月祭と安息日を、わたしの魂は憎む。大いなる断食と休みの日の疲れを、わたしは耐えがたいものとする。わたしの前に現れるために来ても、わたしは聞かない。お前たちの手は血に満ちているからだ。小麦の粉や香料をわたしに献げても、それはわたしの忌み嫌うもの。羊の脂と牛の血を、わたしは望まない。誰がお前たちの手にこれを求めたのか。不正のあらゆる縄目を解き、暴力的な契約の結び目を断ち切り、家もなく裸の者を覆い、飢える者に自分のパンを分け与えよ」（<a href="https://bibleox.com/ja/jp-ni/is/1/#L11">イザ. 1:11-17</a>、<a href="https://bibleox.com/ja/jp-ni/is/58/#L6">イザ. 58:6-7</a>）[18]。これで、預言者たちが神の口調で語る教えがどのようなものであるか、皆さんも判断できるでしょう。</p><h2>38</h2><p>預言の霊がキリストの口調で語るとき、その言葉はこのようなものです。「わたしは手を差し伸べた。従わず、逆らう民に、良くない道を歩む者たちに」（<a href="https://bibleox.com/ja/jp-ni/is/65/#L2">イザ. 65:2-3</a>）。さらにこうです。「わたしはわたしの背を鞭打ちに委ね、ほおを平手打ちに委ねた。辱めの唾を吐かれることに、わたしは顔を背けなかった。主はわたしを助けてくださった。それゆえ、わたしは恥を見ることもない。わたしはみずからの顔を固い石のようになし、辱めを受けることはないと知った。わたしを義とする方は近くおられるのだから」（<a href="https://bibleox.com/ja/jp-ni/is/50/#L6">イザ. 50:6-8</a>）。さらにこう語ります。「彼らはわたしの着物についてくじを引き、わたしの手と足を刺した。わたしは横たわり、眠り、そののち立ち上がった。主がわたしを支えてくださったからである」（<a href="https://bibleox.com/ja/jp-ni/ps/22/#L17">詩. 22:17-19</a>、<a href="https://bibleox.com/ja/jp-ni/ps/3/#L6">詩. 3:6</a>）。さらにこう語ります。「彼らは唇で語り、頭を振って言った。『彼みずからを救え』と」（<a href="https://bibleox.com/ja/jp-ni/ps/22/#L8">詩. 22:8</a>、<a href="https://bibleox.com/ja/jp-ni/mf/27/#L40">マタ. 27:40-42</a>）。これらすべてがユダヤ人たちの手によってキリストの上に起きたことは、皆さん自身が知ることができます。彼が十字架につけられたとき、彼らは唇を動かし、頭を振って言ったのです。「死人を復活させたのだから、自分自身を救えるはずだ」と。</p><h2>39</h2><p>そして預言の霊が、これから起きることを予告して語るときは、こう語ります。「シオンから律法が出て、主の言葉がエルサレムから出る。彼は国民の間を裁き、多くの民を戒める。彼らは自分の剣を鋤に、自分の槍を鎌に打ち直し、民は民に向かって剣を上げず、もはや戦いを学ぶこともない」（<a href="https://bibleox.com/ja/jp-ni/is/2/#L3">イザ. 2:3-4</a>）。これが実際にそのとおりになったことは、私たちが証明できます。エルサレムから世界に出て行った人々が12人いました。しかも無学で、話す力もない人々でした。それなのに神の力によって、全人類に向かって、自分たちがキリストによって遣わされ、すべての人に神の言葉を教えるようにと命じられたことを宣べ伝えたのです。そして、かつて互いに殺し合っていた私たちは、今では敵に対して戦いを仕掛けないだけでなく、尋問する者たちに嘘をつき欺かないために、喜んでキリストを告白して死ぬのです。この際、私たちは「舌は誓ったが、心は誓っていない」[19]という言葉を使うこともできるでしょう。しかしながら、皆さんに誓願を立てて登録された兵士たちは、みずからの命よりも、両親よりも、祖国よりも、すべての身内よりもその言葉を重んじて守り通しています。皆さんは彼らに朽ちることのない報いを何一つ与えることができないにもかかわらず、です。それなのに、朽ちないものを切に望む私たちが、その望むものを、与えうる方から得るためにすべてのことを忍ばないとすれば、なんと滑稽なことでしょう。</p><h2>40</h2><p>さらに、彼の教えを宣べ伝え、彼の現れを告げ知らせた人々についても、どのように預言されていたかをお聞きください。先述の王であり預言者であるダビデは、預言の霊によってこう語りました。「日は日に言葉を語り伝え、夜は夜に知識を知らせる。彼らの声が聞こえないような言葉も言語もない。彼らの声は全地に渡り、その言葉は世界の果てにまで及ぶ。太陽のために彼は幕屋を置かれた。太陽は、その住まいから出て行く花婿のように喜び、道を走り抜ける巨人のようである」（<a href="https://bibleox.com/ja/jp-ni/ps/19/#L3">詩. 19:3-6</a>）。さらに、同じダビデの他の預言の言葉にも触れておくことが有益で適切だと思われます。そこから、預言の霊が人々にどのように生きるように命じるか、また、ユダヤの王ヘロデ、ユダヤ人たち自身、そして彼らの間であなた方の統治者であったピラトゥスがその兵士たちとともにキリストに対して陰謀を企てたこと、あらゆる民族の中から人々が彼を信じること、神が彼をみずからの子と呼ぶこと、すべての敵を彼の足もとに服従させると約束されたこと、さらに、悪霊たちが、あらゆることの父であり主である神の力と、キリストご自身の力から、可能な限り逃れようとすること、そして、裁きの日が来る前に、神がすべての人を悔い改めに招かれること、これらのことを知ることができます。こう語られています。「いましめきものに従って歩まず、罪ある者の道に立たず、あざける者の座に着かない、さいわいな人。主の律法に喜びを見出し、昼も夜もその律法について省みる人。彼は水路のそばに植えられた木のようで、その季節に実を結び、その葉は枯れず、そのなすことはすべて成功する。いましめきものはそうではない。彼らは風に吹き散らされる塵のようである。それゆえ、いましめきものは裁きの中に立つことができず、罪ある者は正しい者の集会の中に立つことができない。主は正しい人の道を知っておられる。いましめきものの道は滅びに至る」（<a href="https://bibleox.com/ja/jp-ni/ps/1/#L1">詩. 1:1-6</a>）。「なぜ、異邦の民は騒ぎ立ち、諸国民はむなしいことを企てるのか。地の王たちは立ち上がり、支配者たちは共に集まって、主に、また神に油注がれたキリストに立ち向かい、『彼らの縄目を断ち切り、その軛をわたしたちから解き捨てよう』と言う。天に座する方は笑い、主は彼らをあざけられる。そのとき、主は憤って彼らに語り、激しい怒りをもって彼らを動揺させる。『わたしはその方から王として聖なる山シオンに据えられた。わたしは主の定めを宣べ伝える。主はわたしに言われた。「お前はわたしの子。わたしは今日、お前を産んだ。求めよ。わたしは国々をお前の受け継ぐ財産として、地の果てをお前の所有として与えよう。お前は鉄の杖で彼らを牧し、陶器の器のように彼らを打ち砕く」』（<a href="https://bibleox.com/ja/jp-ni/ps/2/#L1">詩. 2:1-9</a>）。「だから、王たちよ、賢明であれ。地の裁き人たちよ、教えを受けよ。主を畏れをもって仕え、おののきをもって喜べ。主が怒りを発し、その憤りが突然燃え上がって、お前たちが正しい道から滅び去ることがないように、教えを受け入れよ。彼に寄り頼む者はみなさいわいである」（<a href="https://bibleox.com/ja/jp-ni/ps/2/#L10">詩. 2:10-12</a>）。</p><h2>41</h2><p>さらに、もう一つの預言において、預言の霊は同じダビデを通して、キリストが十字架刑の後に王として統治することを告げ知らせ、こう語りました。「主に向かって歌え、全地よ。日々その救いを告げ伝えよ。主は大いなる方、大いに讃められる方、すべての神々の上に畏れられる方である。異邦の神々はみな悪霊の偶像であり、主はもろもろの天を造られた。輝きと讃美がみ顔の前にあり、聖なる住まいにおける強さと賛美がある。世々の父なる主に栄光を帰せよ。恵みを受け、み顔の前に進み出て、その聖なる庭で礼拝せよ。全地よ、み顔の前に畏れ従え。据えられて、揺れ動くことがないように。国民の間に喜びがあれ。主は十字架の木から王として統治された」（<a href="https://bibleox.com/ja/jp-ni/ps/96/#L1">詩. 96:1-10</a>）[20]。</p><h2>42</h2><p>しかし、預言の霊がまだ起きていない将来のことを、すでに起きたことのように語るときがあります。これは先に私が引いた言葉の中にも見られることです。読む者が誤解を言い訳にしないように、この点についても明らかにしておきましょう。彼にとって確実に知られている将来のことは、すでに起きたことのように予告されるのです。このように受け取るべきであることは、注意を向ければお分かりになるでしょう。先に引いた言葉をダビデが語ったのは、キリストが人となって十字架につけられる1500年も前のことでした。彼より前の時代にも、彼と同時代の人たちのうちにも、十字架につけられることによって異邦人たちに喜びをもたらした者は誰もいませんでした。しかし私たちのイエス・キリストは、十字架につけられ、死んだのち復活し、天に昇って王として統治しています。そして使徒たちによってあらゆる国民の中で彼の名において宣べ伝えられた事柄によって、彼に約束された朽ちないものを待ち望む人々に喜びがもたらされているのです。</p><h2>43</h2><p>しかし、私が先に述べたことから、あらかじめ知られているがゆえに預言された出来事は、みな運命の必然によって起きると私たちが言っているのだと、誰かが結論することがないように、この点についても解き明かしましょう。私たちは預言者たちから、それぞれの行いの値に応じて罰と苦難あるいは良い報いが与えられると学び、これを真実として告げます。もしそうでなく、すべてのことが運命によって起きるのであれば、私たちのうちにはまったく自由がなくなってしまいます。運命によって一人は善良に、もう一人は悪に定められているのであれば、前者は称賛に値せず、後者は責められないことになります。さらに、人類が自由な選択によって悪を避け、善を選ぶ力を持たないのであれば、人間は何をなそうとも、何についても責めを負いません。しかし、人間が自由な選択によって正しく歩むこともつまずくこともできるということは、次のように証明できます。同じ一人の人間が正反対の事柄へと移っていくのを、私たちは見るからです。もしその人の善良さや悪が運命によって定められているのであれば、彼はその正反対の両方に及ぶことはできず、幾度も変化することもできなかったでしょう。そうでなければ、ある人たちは善く、ある人たちは悪いということもなかったはずです。そうであれば、運命こそが悪の原因であって、運命はみずからに反することをなすと言うしかなくなるからです。さもなければ、先に述べた命題――すなわち、徳も悪徳も存在せず、善い悪いはただ意見によって区別されるにすぎないという命題――を真実として認めるしかありません。しかし真実の言葉（ロゴス）が示すとおり、これは最大の不敬と不法です。ところで、避けがたい運命として私たちが認めるのは、このことです。すなわち、善を選ぶ者には値する報いが、その正反対を選ぶ者にはそれに相応しい罰が備わっているということです。なぜなら神は、人間を、選択によって働くことができない木や四足の獣のような他の被造物と同じようには造られなかったからです。もしそうであれば、人間はみずから善を自由に選ぶのではなく、そのように造られた存在なのだから、報いや讃美に値することはなく、また、悪い者であったとしても、それがみずからによる悪ではなく、造られた以上のあり方をすることができないのであれば、罰に値しないはずです。</p><h2>44</h2><p>このことを私たちに教えたのは、預言の聖霊です。聖霊はモーセを通して、最初に造られた人に神が次のように言われたと証しています。「見よ、あなたの顔の前に善と悪がある。善を選びなさい。」（<a href="https://bibleox.com/ja/jp-ni/vtor/30/#L15">申. 30:15</a>、<a href="https://bibleox.com/ja/jp-ni/vtor/30/#L19">申. 30:19</a>）[21] また、別の預言者イザヤを通しても、まるで万物の父であり主である神の口から語られるかのように、このことについて次のように言われています。「身を洗い、清くなりなさい。あなたがたの魂から悪事を取り除き、善を成すことを学び、みなしごのために正義を行い、やもめを弁護しなさい。さあ、来て、共に論じ合いましょう、と主は言われます。あなたがたの罪が緋色のようであっても、わたしは羊毛のように白くし、真紅のようであっても、雪のように白くしましょう。もし従うことを喜び、わたしの言うことを聞くなら、地の良い物を食べるでしょう。しかし、もしわたしの言うことを聞かないなら、剣があなたがたを食い尽くします。主の口がこれを言われたのですから。」（<a href="https://bibleox.com/ja/jp-ni/is/1/#L16">イザ. 1:16-20</a>） 「剣があなたがたを食い尽くします」という言葉は、従わない人たちが剣で殺されるという意味ではありません。神の剣とは火であり、悪を行おうと決める者たちは、その火の薪となるのです。だからこそ、「剣があなたがたを食い尽くします。主の口がこれを言われたのですから」と言われているのです。もし預言者が、切ってすぐに役目を終える剣のことを語っていたなら、「食い尽くす」とは言わなかったでしょう。そしてプラトンも、「選ぶ者に責めがあり、神には責めがない」と語るとき、これを預言者モーセから借りて語ったのです。[22] モーセはすべてのギリシアの著述家たちより古いからです。また、哲学者たちや詩人たちが、魂の不死、死後の罰、天にあるものの観想など、それに類する事柄について語ったことは、いずれも彼らが預言者たちから受け取ったものです。預言者たちを通してこそ、彼らはこれらのことを理解し、語ることができたのです。それゆえ、すべての人の中に真理の種があるように思われます。しかし彼らはそれを正確には理解していません。互いに矛盾することを語ることによって、それが明らかになっています。ですから、将来の出来事が予告されたと言うとき、私たちは、それらが運命の必然によって起こると言っているのではありません。神は、すべての人の将来の行いを前もって知り、人がそれぞれその行いの値に応じて報いを受けるべきことをご自分の中で定めておられます。そして、その行いの値に応じて人たちが神から受けるであろうことを、預言の霊を通して予告されるのです。このことによって神は、人類を常に新たな注意と努力へと呼び招き、人たちに対するご配慮とご摂理を示しておられます。しかし悪い悪霊たちの働きによって、『ヒュスタスペスの書』[23]や『シビュラの書』や預言者たちの書物を読もうとする者には死刑が定められています。恐れによって、読む人たちを善を学ぶことから遠ざけ、自分たちの奴隷のままにとどめようとするためです。しかし悪霊たちは、これを永遠に実現しておくことはできませんでした。私たち自身が恐れずにそれらの書物を読むだけでなく、あなたがたにも見て取れるとおり、すべての人の心にかなうものだと確信して、それらをあなたがたの判断のために差し出しているからです。たとえこのことで少数の人を説き得たとしても、私たちの得る益はきわめて大きいものです。良き労働者として、主から報いを受けるのですから。</p><h2>45</h2><p>万物の父なる神が、死者の中から復活させたキリストを天に上げ、この方に敵対する悪霊たちを打ち負かすときまで、また、神が前もって知っておられる正しく徳にかなう人たちの数が満ちるまで――神はその人たちのために、ご自分の定めをまだ実現しておられないのです――、この方を天にとどめておかれるであろうことについては、預言者ダビデの言葉を聞いてください。その言葉は次のとおりです。「主はわたしの主に言われました。『わたしの右に座りなさい。わたしがあなたの敵をあなたの足台とするときまで。』主はエルサレムから力の杖をあなたに送られます。そしてあなたは、敵たちの中で統治するでしょう。力の日には権威があなたと共にあり、聖なる者たちの輝きのうちにあります。わたしは明けの明星の前に、胎からあなたを生んだのです。」（<a href="https://bibleox.com/ja/jp-ni/ps/110/#L1">詩. 110:1-3</a>） 「エルサレムから力の杖をあなたに送られる」という言葉に前もって示されているのは、この方の使徒たちがエルサレムから出て行って至る所で宣べ伝えた、力に満ちた教えのことです。キリストの名を教える者にも、ただこの名を告白する者にも死刑が定められていますが、私たちは至る所で、自らこの名を受け入れ、他の人たちにも教えています。しかし、もしあなたがたも敵意をもってこれらの言葉を読むなら、前に述べたとおり、殺すこと以上の何もできません。それは私たちに何の害ももたらしません。しかし、不正に私たちを迫害しながら悔い改めないあなたがたと、すべての人のために、火の中の永遠の苦しみを用意しているのです。</p><h2>46</h2><p>しかし、私たちの教えから人々を遠ざけるために、誰かが無分別な反論を持ち出さないように、この難問を先に解いておきましょう。すなわち、「私たちの言うところでは、キリストは150年前にキュレニオ[24]の時代に生まれ、その少し後にポンティウス・ピラトゥスのもとで、私たちがこの方に帰す教えを授けた。そうだとすれば、キリストより前に生まれたすべての人たちは皆、まったく責めがないことになるではないか」という反論です。私たちは、キリストが神の初めて生まれた方であると教えられています。また、この方が全人類があずかっている言葉（ロゴス）であることは、前に述べたとおりです。言葉に従って生きた人たちは、無神論者とみなされていたとしても、キリスト者です。ギリシア人の間ではソクラテスとヘラクレイトス、そして彼らと同じような人たちがそうであり、ギリシア人以外の民の中ではアブラハム、ハナニヤ、アザルヤ、ミサエル、そしてエリヤと、その他多くの人がそうでした。彼らの行いや名を列挙するのは退屈なことだと私は知っていますから、ここでは控えておきます。それゆえ、キリスト以前に生きて言葉に背いて生きた人たちは、不敬虔な者、キリストに敵対する者、そして言葉に従って生きる人たちを殺した者たちでした。言葉に従って生きた人たち、また今言葉に従って生きている人たちは、キリスト者であり、恐れを知らず、穏やかです。では、言葉の力によって、万物の父であり主なる神の御心のままに、この方はなぜおとめを通して人として生まれ、イエスと名付けられ、十字架につけられ、死に、よみがえり、天に昇られたのでしょうか。それは、私がすでにこれほど詳しく語ってきたことの中から、考える人には理解できます。この件を今あらためて展開する必要はないので、ここでは、より必要な事柄の証明へと進むことにします。</p><h2>47</h2><p>ユダヤの地の荒廃についても、預言の霊が語った言葉を聞いてください。その言葉は、起こったことに驚く民の口を借りたものとして語られています。「シオンは荒れ果て、エルサレムは荒野と化しました。私たちの聖所である家は呪いとなり、父祖たちが祝福した栄光は火で焼き尽くされ、その栄えあるものはすべて打ち倒されました。あなたはこれをすべて耐え忍び、沈黙して、私たちを激しく打ちのめされました。」（<a href="https://bibleox.com/ja/jp-ni/is/64/#L9">イザ. 64:9-11</a>） エルサレムが予告されたとおりに荒廃したことは、あなたがたの知るとおりです。また、この都が荒れ果てること、ユダヤ人の誰もそこに住むことを許されないことについては、預言者イザヤによってこう語られました。「彼らの地は荒れ果てています。敵たちは彼らの目の前でその地を食い尽くします。そして彼らの誰も、そこに住む者とはならないでしょう。」（<a href="https://bibleox.com/ja/jp-ni/is/1/#L7">イザ. 1:7</a>）[25] そして、誰もそこにいないようにあなたがたが見張っていること、また入ろうとして捕らえられたユダヤ人には死刑が定められていることを、あなたがたはよく知っています。</p><h2>48</h2><p>私たちのキリストがあらゆる病いを癒し、死者をよみがえらせると、どんな言葉で予告されていたかを聞いてください。その言葉は次のとおりです。「この方が来られるときには、足の不自由な者は鹿のように跳ね、口のきけない者の舌ははっきりと語るでしょう。盲人は見えるようになり、らい病人は清められ、死者はよみがえって歩くでしょう。」（<a href="https://bibleox.com/ja/jp-ni/is/35/#L5">イザ. 35:5-6</a>）[26] この方がこれらのことを実際になさったことは、ポンティウス・ピラトゥスのもとで作成された記録から知ることができます。こうして、この方がこの方に望みをかける人たちと共に殺されることも、預言の霊によって前もって告げ知らされていました。イザヤによって語られた言葉を聞いてください。こう語られています。「見よ、正しい者が滅びようとしていますが、心に留める者は誰もいません。正しい人たちが取り除かれていくのに、それを思う者もいません。正しい方は不義の前から取り去られ、その墓は平和のうちに置かれるでしょう。この方は私たちの中から取り去られたのです。」（<a href="https://bibleox.com/ja/jp-ni/is/57/#L1">イザ. 57:1-2</a>）</p><h2>49</h2><p>また、同じイザヤによって、この方を待ち望んでいなかった異邦人の民がこの方を礼拝し、常に待ち望んでいたユダヤ人は、この方が来られたときにこの方を知らないでいる、と語られたことを聞いてください。この言葉は、キリストご自身の口を借りたものとして語られています。「わたしは、わたしについて尋ねなかった者たちに現れました。わたしを探さなかった者たちによって見いだされました。見よ、わたしはここにいる、と、わたしの名を呼び求めなかった民に言いました。わたしは従わず、逆らう民に、良くない道を歩み、自分の罪の後に従って進む人たちに向かって、両手を伸ばしました。この民は、わたしの顔の前でわたしを怒らせる民です。」（<a href="https://bibleox.com/ja/jp-ni/is/65/#L1">イザ. 65:1-3</a>） そして実際、預言を手にし、常にキリストの到来を待ち望んでいたユダヤ人は、この方を知りませんでした。知らなかっただけでなく、この方を拒んだのです。しかし、この方の使徒たちがエルサレムから出て行ってこの方について宣べ伝え、預言を伝えるまでは、キリストについて何も聞いたことのなかった異邦人たちは、喜びと信仰をもって偶像から離れ、キリストを通して生まれない神に自分たちを献げました。キリストを告白する人たちについて悪口雑言が広められること、また、この方を辱める人たち、古い習慣を守ることが良いことだと考える人たちこそ嘆かわしい者となることが、前もって知られていたことについては、イザヤが短い言葉で語ったものを聞いてください。こう語られています。「甘いものを苦いものと呼び、苦いものを甘いものと呼ぶ者たちは、災いだ。」（<a href="https://bibleox.com/ja/jp-ni/is/5/#L20">イザ. 5:20</a>）</p><h2>50</h2><p>さらに、私たちのために人となられたこの方が苦しみと辱めを忍ばれ、また栄光と共に再び来られるであろうことについても、預言を聞いてください。次のとおりです。「この方の魂は死に引き渡され、この方は不義の者たちと共に数えられました。それゆえ、この方は多くの人の罪を担い、不義の者たちを憐れまれるでしょう。見よ、わたしの僕は知恵を持つでしょう。この方は高く上げられ、大いに誉れを受けるでしょう。多くの者があなたに驚き恐れたように、あなたの姿は人々から辱められ、あなたの栄光は人々から隠されるでしょう。すると多くの民は驚き、王たちは口を閉ざすでしょう。この方について告げ知らされていなかった者たち、聞いたことのなかった者たちが、理解するようになるからです。主よ、誰が私たちに聞いたことを信じましたか。主の御腕は誰に明らかにされたのですか。私たちはこの方を、幼子のように、渇いた地の中の根のように告げ伝えました。この方には姿もなく、栄光もありませんでした。私たちはこの方を見ましたが、この方には見とれるべき姿も美しさもなく、その姿は辱められ、人の子らよりも見劣りするものでした。この方は病みを忍ぶことのできる、傷に打たれた人です。御顔は背けられ、嘲られ、蔑まれました。この方は私たちの罪を担い、私たちのために苦しまれます。しかし私たちは、この方が病みのうちにあり、傷と苦しみのうちにあると考えていました。しかし実は、この方は私たちの不義のゆえに刺し貫かれ、私たちの罪のゆえに打ち砕かれたのです。平和をもたらす懲らしめがこの方の上にあり、その傷によって私たちは癒されました。私たちは皆、羊のように迷い、それぞれの人は自分の道にさまよいました。そして主は、私たちの罪のゆえに、この方を引き渡されました。この方は苦しみの間、口を開かれません。羊のように屠り場へ引かれて行き、毛を刈る者の前で声もなく黙っている子羊のように、この方は口を開かれませんでした。辱めのうちに、この方の裁きは取り上げられました。」（<a href="https://bibleox.com/ja/jp-ni/is/53/#L12">イザ. 53:12</a>、<a href="https://bibleox.com/ja/jp-ni/is/52/#L13">イザ. 52:13-15</a>、<a href="https://bibleox.com/ja/jp-ni/is/53/#L1">イザ. 53:1-8</a>） この方が十字架につけられると、親しくしていた人たちは皆、この方を捨て、この方を否認しました。しかし後になって、死者の中からよみがえって彼らに現れ、これらすべてが予告されている預言を読むようにと教えられました。そして彼らが、この方が天に昇って行かれるのを見て信じ、この方から天から送られた力を受けると、人類のあらゆる民の中へ出て行って、これらのことを教えました。そして「使徒」と呼ばれるようになったのです。</p><h2>51</h2><p>さらに、このように苦しむ方の出自が誰にも語り尽くせないものであり、この方が敵たちの上に王として統治されることを、私たちに示すために、預言の霊はこう語りました。「誰がこの方の出自を語り尽くせるでしょう。この方の命は地から取り去られるからです。彼らの不義のゆえに、この方は死へ引かれて行かれました。わたしは悪い者たちをこの方の墓のためとし、富める者たちをこの方の死のためとします。この方は不義を行うことなく、その口には偽りも見いだされなかったからです。主はこの方を傷から清めることを喜ばれます。この方を罪のための献げ物として与えるなら、あなたがたの魂は長く続く子孫を見るでしょう。主は、この方の魂を苦しみから救い出し、この方に光を示し、知性をもって形造り、多くの者に豊かに仕えた正しい方を義とすることを望まれます。この方は私たちの罪を担われるでしょう。それゆえ、この方は多くの者を相続し、力ある者たちの戦利品を分けるでしょう。この方の魂が死に引き渡され、不義の者たちと共に数えられ、この方が多くの人の罪を担い、彼らの不義のゆえに引き渡された、そのことのゆえにです。」（<a href="https://bibleox.com/ja/jp-ni/is/53/#L8">イザ. 53:8-12</a>） また、この方が天に昇られることも、前もって言われていたとおりであることを聞いてください。こう語られています。「天の門を高く上げよ。栄光の王が入れるように、門よ、開かれよ。この栄光の王は誰か。力強い主、強大な主です。」（<a href="https://bibleox.com/ja/jp-ni/ps/24/#L7">詩. 24:7-8</a>） そして、この方が栄光と共に天から再び来られることについても聞いてください。これについて預言者エレミヤによって語られた言葉があります。その言葉は次のとおりです。「見よ、人の子のように、この方は天の雲に乗って来られる。その御使いたちがこの方と共にいます。」（<a href="https://bibleox.com/ja/jp-ni/dan/7/#L13">ダニ. 7:13</a>）[27]</p><h2>52</h2><p>ですから、すでに起こったすべてのことが起こる前に預言者たちによって予告されていたことを私たちが証明する以上、同じように予告されていながら、まだこれから起こることになる事柄も、必ず起こると信じなければなりません。なぜなら、前もって予告され、誰も知らなかった出来事がそのように実現したのですから、残りのことも、知らず、信じない人たちがいたとしても、同じように実現するでしょう。預言者たちはキリストの二つの到来を予告しました。一つはすでに過ぎたもので、栄えない、苦しむ人の姿で来られたもの。もう一つは、告げ伝えられているとおり、栄光と共に天から来られるもので、そのときこの方は御使いたちの軍勢に囲まれ、かつて生きたすべての人たちの体をよみがえらせ、ふさわしい者たちの体は朽ちないものに包まれ、不敬虔な者たちの体は、永遠に感覚を持つものとして、悪い悪霊たちと共に永遠の火へ送られるのです。これらのことも前もって予告されていたことを、私が証明しましょう。預言者エゼキエルはこう語っています。「つなぎ目がつなぎ目に、骨が骨に結び合わされ、肉が再び生え育つでしょう。」（<a href="https://bibleox.com/ja/jp-ni/iez/37/#L7">エゼ. 37:7-8</a>） さらにこう言われています。「すべての膝は主の前に屈み、すべての舌は主を賛美するでしょう。」（<a href="https://bibleox.com/ja/jp-ni/is/45/#L23">イザ. 45:23</a>）[28] 不敬虔な者たちがどのような感覚のうちに、どのように苦しまされるかについても、同じように語られた言葉を聞いてください。こう語られています。「彼らの虫は尽きることなく、彼らの火は消えることがないでしょう。そして彼らは、何の益も得られないときに悔い改めるでしょう。」（<a href="https://bibleox.com/ja/jp-ni/is/66/#L24">イザ. 66:24</a>） そして、栄光のうちに来られるこの方を見たとき、ユダヤの民が何を言い、何をするかについては、預言者ゼカリヤによってこのように預言されています。「わたしは四つの風に命じて、散らされた子らを集めさせます。北風に命じて連れて来させ、南風には引きとめさせません。」（<a href="https://bibleox.com/ja/jp-ni/zah/2/#L10">ゼカ. 2:10</a>）[29] さらにこう語られています。「そのとき、エルサレムには大いなる嘆きがあります。口や唇の嘆きではなく、心の嘆きです。人々は自分の衣服を引き裂くのではなく、思いを引き裂くでしょう。部族ごとに泣き悲しみ、そのとき、自分たちが突き刺した方を見つめ、言うでしょう。『主よ、なぜあなたは私たちをあなたの道から迷わせられたのですか。私たちの父祖たちが祝福した栄光は、私たちにとって嘲りのものとなりました。』」（<a href="https://bibleox.com/ja/jp-ni/zah/12/#L10">ゼカ. 12:10-12</a>）（<a href="https://bibleox.com/ja/jp-ni/is/63/#L17">イザ. 63:17</a>、<a href="https://bibleox.com/ja/jp-ni/is/64/#L10">イザ. 64:10</a>）</p><h2>53</h2><p>私は他にも多くの預言を挙げることができますが、控えておきます。聞き、理解する耳を持つ人たちを説得するには、これらの預言でも十分だと考えるからです。そのような人たちは、私たちが、いわゆるゼウスの子らについての神話のように、ただ言うだけで、その言葉の証明ができないというのではないことを、自分でも理解できると思います。十字架につけられた人のことを、生まれない神の初めて生まれた方であり、全人類の上に裁きを行う方だと、私たちがどうして信じたでしょうか。この方が来て人となった以前に、この方についての証しが前もって予告されており、それがまったくそのとおりに実現したのを見いだしたからです。すなわち、ユダヤの地が荒廃したこと、あらゆる民族の人たちがこの方の使徒たちの教えによってこの方を信じ、誤りの中で生きてきた古い習慣を捨てたこと。私たちは自分たち自身でこれを見て知っており、また、異邦人の中から出たキリスト者が、ユダヤ人とサマリア人の中から出たキリスト者よりも数多く、熱心であることも知っています。預言の霊は、その他のすべての民を異邦人と呼び、ユダヤの民とサマリアの民はイスラエル、ヤコブの家と呼ばれます。そして、信じる者がユダヤ人やサマリア人よりも異邦人の中から多く出るであろうと予告された預言を挙げましょう。これについてこう語られています。「産み産まなかった不妊の女よ、喜び叫べ。産みの痛みを知らなかった女よ、歓びの声を上げよ。夫を持つ女よりも、独り者の子供の方がはるかに多いからです。」（<a href="https://bibleox.com/ja/jp-ni/is/54/#L1">イザ. 54:1</a>） なぜなら、すべての民は真の神から遠く離れ、自分の手の業に仕えていました。ユダヤ人とサマリア人は、預言者たちを通して与えられた神の言葉を持ち、常にキリストを待ち望んでいたのに、この方が来られたとき、ほんの少数の者を除いて、この方を知りませんでした。その少数の者たちについては、聖なる預言の霊がイザヤを通して、彼らが救われると前もって告げています。霊はまるで彼ら自身の口から語るようにして、こう言いました。「もし主が私たちに種を残しておられなかったなら、私たちはソドムとゴモラのようになっていたでしょう。」（<a href="https://bibleox.com/ja/jp-ni/is/1/#L9">イザ. 1:9</a>） モーセの書に伝えられるとおり、ソドムとゴモラは不敬虔な人たちの都市でした。神は火と硫黄をもって彼らを焼き滅ぼされたので、住民の誰も救われませんでした。ただ一人、カルデアの出身でロトという名の他国人だけが救われ、娘たちも共に救われました。（<a href="https://bibleox.com/ja/jp-ni/gen/19/#L24">創. 19:24-25</a>） 望む者は今日でも、彼らの国全体が荒れ果て、焼き尽くされ、実らない土地のままであるのを見ることができます。そして、異邦人の中から出た信じる者たちが、より熱心で、より堅固な信仰の持主として前もって知られていたことを示すために、預言者イザヤによって語られた言葉を挙げます。彼はこう言いました。「イスラエルは心で包皮を切りませんでした。しかし異邦人は肉で包皮を切りませんでした。」（<a href="https://bibleox.com/ja/jp-ni/ier/9/#L25">エレ. 9:25</a>）[30] これほど多くの明確な証しは、空しい意見に従わず、情念に動かされない、真理を愛する人たちにとって、正当な納得と信仰を生み出すものとなるでしょう。</p><h2>54</h2><p>詩人たちの作った神話を教える人たちは、それを学ぶ若者たちに何の証明も示しません。そして私たちは、それらすべては悪い悪霊たちの働きによって、人類を欺き、堕落させるために語られたものだと述べます。悪霊たちは、キリストが来ること、不敬虔な人たちが火で罰せられることを預言者たちが予告しているのを聞くと、多くの人を「ゼウスから生まれた子ら」と呼ばせるように仕向けました。そうすることで、キリストについて語られることを、詩人たちが語った物語のような、不思議なおとぎ話だと人々に思わせようとしたのです。これは、ギリシア人の間でも、また、預言者たちの言葉の伝聞から、キリストを信じる者が特に多くなるだろうと聞いていた、他のすべての民の間でも広められました。そして、彼らが預言者たちの言葉を聞いても正確に理解せず、迷う者として、私たちのキリストについて語られたことにだけ似せものを作ったことを、私は明らかにしましょう。預言者モーセは、前に述べたとおり、すべての著述家の中で最も古い人です。そして、前に言及したとおり、モーセを通して次のような預言が語られました。「ユダから支配者が絶えることなく、そのももの間から指導者が絶えることはない。彼に留め置かれた者が来るまで。この方は諸国民の望みとなる。この方は自分の子ろばをぶどうの木に繋ぎ、その衣服をぶどうの実の血で洗われるでしょう。」（<a href="https://bibleox.com/ja/jp-ni/gen/49/#L10">創. 49:10-11</a>） 悪霊たちは、これらの預言の言葉を聞くと、ディオニュソスがゼウスから生まれたと語り、彼がぶどうの発明者であると伝え、彼の秘儀の中にろばを据え、彼が引き裂かれて天に昇ったと教えました。そしてモーセの預言には、来るべき方が神の子であるのかどうか、また、子馬に乗ったままで地にとどまるのか、それとも天に昇るのかが明確に示されていませんでした。また「子馬」という語は、ろばの子を意味することも馬の子を意味することもできました。そこで彼らは、預言されている方が、自分の到来のしるしとしてろばの子を現すのか馬の子を現すのかを知らず、この方が前に述べたとおり神の子なのか、人の子なのかも知らないまま、ベレロフォンテスについて、人から生まれた人間でありながら、ペガソスという馬に乗って天に昇ったと宣言したのです。さらに、別の預言者イザヤから、キリストがおとめから生まれる（<a href="https://bibleox.com/ja/jp-ni/is/7/#L14">イザ. 7:14</a>）と、自らの力によって天に昇ると語られたことを聞くと、同じことをペルセウスについても語りました。そして、上に引いた預言の中で、「巨人のように力強く、道を走り出る者である」（<a href="https://bibleox.com/ja/jp-ni/ps/19/#L5">詩. 19:5</a>）[31]と前もって語られていることを知ると、ヘラクレスは力強く、全地を巡り回ったと言いました。また、この方について、あらゆる病いを癒し、死者をよみがえらせるという預言を再び聞くと、アスクレピオスを登場させました。</p><h2>55</h2><p>しかし、いわゆるゼウスの子らの中の誰についても、彼らは十字架につけられることを現しませんでした。十字架について語られていることは、すべて前に述べたとおり象徴的に語られていたので、彼らにはそれを思いつくことさえなかったのです。十字架は、預言者が予告したとおり、キリストの力と権威の最も大きな象徴です。これは、私たちの観察の及ぶ物事からも見て取れます。世界のすべての物事を考えてみてください。この形なしに何かが成り立ち、互いに結び合うことができるでしょうか。船に「帆」と呼ばれる戦利品の標が損なわれず立っていなければ、海を渡ることはできません。十字形なしに土地を耕すこともできません。地を掘る人たちも職人たちも、この形を持つ道具によってでなければ、仕事をすることはできません。また、人の姿は、理性のない動物たちの姿と、直立して両手を伸ばすことができるという点でのみ異なっています。そして人の顔には、額から伸びたいわゆる鼻があります。この生き物の呼吸はそれによって行われますが、この鼻は、十字の形のほかの何ものでもありません。これについて預言者はこう言っています。「私たちの顔の前の息は、キリストなる主です。」（<a href="https://bibleox.com/ja/jp-ni/pier/4/#L20">哀. 4:20</a>） そして、この形の力は、あなたがた自身の象徴にも現れています。私が言うのは、軍旗と戦利品のことです。あなたがたは至る所でこれらを携えて祝賀の行進を行い、その中に自分たちの権威と力のしるしを示しています。あなたがた自身は、それについて何も考えていないのですが。また、亡くなられた皇帝たちの像も同じ十字の形の上に据えられ、銘文の中で彼らを神々と呼んでいます。このように、私たちは言葉によって、また目に見える形によって、できる限りあなたがたを説得しました。ですから、たとえあなたがたが信じないとしても、私たちにもう責めはないと知っています。私たちの側では、なすべきことはすべて為され、果たされたのですから。</p><h2>56</h2><p>キリストが現れる前に、いわゆる「ゼウスの子ら」がいたと言っただけでは、悪い悪霊たちは満足しませんでした。この方が現れて人々の中に住まわれた後、彼らは、この方について預言者たちがどのように予告したかを知り、あらゆる民の中でこの方が信じられ、待ち望まれているのを見ると、前に私が述べたとおり、今度は別の人たち、すなわちサマリア出身のシモンとメナンドロスを立てました。彼らは魔術的な不思議な業によって多くの人を惑わし、今日でもなお惑わし続けています。シモンは、前に述べたとおり、あなたがたの王都ローマで、クラウディウス・カエサルの治世に現れ、神聖な元老院とローマの民を大いに驚かせました。彼は神と認められ、あなたがたが神として礼拝している他の神々と同じように、その栄誉として彫像を建てられたのです。それで私たちは、この私たちの弁明を、神聖な元老院とあなたがたの民が、あなたがたと共に検討してくださるようにお願いします。シモンの教えに染まっている人がいれば、真理を知り、迷いから逃れることができるようにです。そしてあなたがたは、もしそうすることが望みであれば、彼の彫像を取り壊してください。</p><h2>57</h2><p>悪霊たちは、不敬虔な者たちへの罰としての火の苦しみがないと、人々を信じ込ませることができません。キリストが来られたとき、この方が知られないままとどまるようにできなかったのと同じです。彼らにできるのはただ、情念と悪い習慣の中で育ち、空しい意見に固執して道理にかなわず生きている人たちに、私たちを滅ぼし、憎むように仕向けることだけです。私たちは、彼らを憎むどころか、前に述べたとおり彼らを憐れみ、悔い改めへと導こうと説得したいと望んでいるのですが。私たちは死を恐れません。死ぬことは必ず起こることとして知られており、新しいことは何もなく、物事の現在のあり方の中では、すべて同じことが繰り返されるからです。もし一年だけでもこの世の物事を楽しむことに飽きてしまう人たちがいるなら、その人たちは私たちの教えに耳を傾けるべきです。そうすれば、苦しみと欠乏から永遠に解放されて生きることができるのですから。しかしもし、死の後には何もないと信じず、死ぬ人は感覚のない状態へ移ると考えているなら、彼らはこの世の苦しみと欠乏から私たちを解放するという役に立つことをしてくれています。しかし同時に、彼ら自身が悪い人たち、人間を憎む者たち、空しい意見に従う者たちであることを示しています。彼らが私たちを殺すのは、私たちに自由をもたらすためではなく、私たちから命と楽しみを奪うためだからです。</p><h2>58</h2><p>そして、ポントスのマルキオンも、前に述べたとおり、悪い悪霊たちによって立てられました。彼は今日もなお、天にあるもの地にあるものすべての造り主である神を認めないように、また、預言者たちによって予告されたキリスト、その御子を認めないように教えています。その代わりに、万物の造り主のほかに、別の何者かの神を、同じように別の子をも宣べ伝えているのです。そして多くの人たちが、真理を知っているただ一人の人としてこの人を信じ、私たちを嘲笑しています。しかし彼らは、自分たちの意見について何の証明も持っていません。子羊のように狼に引きずられて無分別に、不敬虔な教えと悪霊たちの餌食となっているのです。なぜなら、悪霊と呼ばれる者たちは、人たちを造り主である神と、その初めて生まれた方であるキリストなる神から引き離すことだけに励んでいるからです。地から高く上がることができない人たちを、彼らは地上の物、人手で造られた物に釘づけにしてきましたし、今も釘づけにし続けています。そして、神なるものを観想しようとする人たちを、気づかれないように引き戻します。その人たちが健全な知性を持たず、清く情念のない生き方をしていないなら、不敬虔の中へと投げ込むのです。</p><h2>59</h2><p>また、プラトンが私たちの教師たち、すなわち預言者たちに与えられた語りから、神が形のない物質を変えて世界を造ったという言葉を借りたことを、あなたがたが知るように、モーセを通して語られた言葉そのものを聞いてください。モーセは、前に示したとおり、ギリシアの著述家たちよりも古い最初の預言者です。モーセを通して、預言の霊は、神が初めに何によって、どのように世界を形造ったかを示し、こう言いました。「初めに神は天と地を創造しました。地は見えない状態にあり、闇が深淵の上にあり、神の霊が水の上を動いていました。そして神は言われました。『光あれ』。すると、そのようになりました。」（<a href="https://bibleox.com/ja/jp-ni/gen/1/#L1">創. 1:1-3</a>） こうして、プラトンも、彼と同じことを言う人たちも、私たち自身も、神の言葉（ロゴス）によって全宇宙が、モーセが前に描いた物質から造られたことを学びました。そしてあなたがたも確信することができます。さらに、あなたがたの詩人たちが「エレブス」と呼んでいるものさえ、前にモーセによって語られていたことを、私たちは知っています。[32]</p><h2>60</h2><p>また、プラトンが『ティマイオス』の中で神の子について自然学的に語っていること――すなわち、神がこの方を宇宙の中に「Χ（カイ）」の文字のような形に置かれた、と語られること――についても、彼は同じようにモーセから借りています。モーセの書物には、イスラエルの人々がエジプトから出て荒れ野にいたとき、毒ある獣――マムシやアスピス、あらゆる種類の蛇――が彼らに襲いかかって民を滅ぼし、モーセが神の霊感と働きによって銅を取り、十字の形に造って聖なる幕屋に置き、民に言った、と記されています。「もしあなたがたがこの形を見て信じるなら、それによって救われるでしょう。」（<a href="https://bibleox.com/ja/jp-ni/chis/21/#L9">民. 21:9</a>） すると、モーセが書いたとおり、蛇たちは死ぬようになり、民はこの手段によって死を免れました。プラトンはこれを読みましたが、正確に理解せず、それが十字の形であることを見抜かず、「Χ」の文字の形だけを見て、第一の神の次に位する力が宇宙の中に「Χ」の文字のような形で置かれている、と言ったのです。また、彼が「第三」について言及するのは、すでに述べたとおり、モーセによって語られた「神の霊が水の上を動いていた」（<a href="https://bibleox.com/ja/jp-ni/gen/1/#L2">創. 1:2</a>） という言葉を読んだことからです。すなわち、彼は第二の位を神のロゴスに与えます。このロゴスは、彼の言葉では、宇宙の中に「Χ」の文字のような形で置かれています。そして第三の位を、水の上を動いていたと言われる霊に与え、「第三は第三の周りにある」と言うのです。 さて、預言の霊がモーセを通して、来たるべき焼き尽くしについてどのように告げたかを聞いてください。こう言っています。「永遠の火が降って来て、最も深い底に至るまで焼き尽くすでしょう。」[33] それで、私たちが他の人たちと同じ意見を持っているのではなく、すべての人たちが私たちの教えを模倣して繰り返しているのです。私たちの中では、これらのことは、文字の形さえ知らない人たち、教育を受けておらず、言葉は野蛮だけれども、心は賢明で信仰に満ちている人たちから聞き、学ぶことができます。中には、盲人となって目の光を失った人たちさえいます。このことから、これらの事柄が人間の知恵によるのではなく、神の力によって語られたことを理解することができます。</p><h2>61 — 洗礼の施行について</h2><p>次に、私たちがキリストによって新しくされた後に、どのように自分自身を神に献げたのかを述べます。これを省けば、私の説明が誠実でないと思われるかもしれないからです。私たちの教えと語ることが真実であると納得し、信じて、それに沿って生きることができると約束する人は、過去の罪の赦しを神に請い願うように、祈りと断食をもって教えられます。私たちも彼らと共に祈り、断食します。それから、私たちは彼らを水のある場所へ導きます。彼らは、私たち自身が新しく生まれたのと同じように新しく生まれます。すなわち、万物の父であり主である神と、私たちの救い主イエス・キリストと、聖霊の御名によって、そのとき水で洗われるのです。キリストが言われたからです。「新しく生まれなければ、天の御国に入ることはできません。」（<a href="https://bibleox.com/ja/jp-ni/in/3/#L3">ヨハ. 3:3</a>）[34] 一度生まれた者が、生んだ母の胎の中へ再び入ることができないのは、誰の目にも明らかです。また、罪を犯した者が悔い改めることによって、どのように罪から解放されるかについては、前に述べたとおり、預言者イザヤを通して告げられています。こう言われています。「身を洗い、清くなりなさい。あなたがたの魂から悪事を取り除き、善を成すことを学び、みなしごのために正義を行い、やもめを弁護しなさい。さあ、来て、共に論じ合いましょう、と主は言われます。あなたがたの罪が緋色のようであっても、わたしは羊毛のように白くし、真紅のようであっても、雪のように白くしましょう。もしわたしの言うことを聞かないなら、剣があなたがたを食い尽くします。主の口がこれを言われたのですから。」（<a href="https://bibleox.com/ja/jp-ni/is/1/#L16">イザ. 1:16-20</a>） そして、このような行いの理由として、私たちは使徒たちから次のことを受け継ぎました。私たちは自分の最初の誕生について知らず、父母の結びつきを通して、必要に迫られて湿った種から生まれ、悪い習慣と堕落した生き方の中で育ちました。それゆえ、必要と無知の子であり続けるのではなく、自由と知識の子となり、過去の罪の赦しを得るために、再び生まれようと望み、罪を悔い改める者の上に、水の中で、万物の父であり主である神の御名が呼びかけられます。この御名だけを、洗いを受ける者を水盤へ導く者が唱えます。なぜなら、誰も表現しがたい神の御名を言い表すことができないからです。もしだれかがあえてその御名があると言おうとするなら、その人は恐るべき狂気を示すことになるでしょう。そして、この洗いは「光照」と呼ばれます。これらのことを学ぶ者が、知性において照らされるからです。[35] さらに、ポンティウス・ピラトのもとで十字架につけられたイエス・キリストの御名によって、また、イエスにまつわるすべてのことを預言者たちを通して予告した聖霊の御名によって、照らされる者は洗われるのです。</p><h2>62</h2><p>また、悪霊たちは、預言者によって告げ知らされたこの洗いを聞くと、自らの神殿に入る者、灌酒の供え物や燻香を捧げるために近づこうとする者に、身に水を振りかけるように仕向けました。さらに、彼らに奉献された神殿に入る前に、人々が赴いて全身を洗うことさえさせています。祭司たちが、神殿に入って礼拝しようとする者に履物を脱ぐように命じるのも、悪霊たちは、上に述べた預言者モーセに起こった出来事から学んで、これを模倣として仕向けたのです。モーセがエジプトへ行き、そこにいるイスラエルの民を連れ出すように命じられたとき、彼は母方のおじの羊の群れをアラビアの地で飼っていましたが、そのとき、私たちのキリストが、茨の燃える火の中から彼に語りかけられました。「履物を脱ぎ、近くに来て、聞きなさい。」（<a href="https://bibleox.com/ja/jp-ni/ish/3/#L5">出. 3:5</a>） 彼は履物を脱ぎ、近づいて、エジプトへ行き、そこにいるイスラエルの民を連れ出すようにという命令を聞き、火の中で語りかけたキリストから大いなる力を受け、行って民を連れ出しました。偉大で不思議な業を行いながらです。それらの業を知りたければ、彼の書物から詳しく知ることができます。</p><h2>63</h2><p>ユダヤ人たちは皆、今日に至るまで、名のない神がモーセと語ったと教えています。それゆえ、預言の霊は、前に述べた預言者イザヤを通して彼らを咎め、こう言いました。「牛はその飼い主を知り、ろばはその主人のまぐさ槽を知ります。しかしイスラエルはわたしを知らず、民はわたしを理解しません。」（<a href="https://bibleox.com/ja/jp-ni/is/1/#L3">イザ. 1:3</a>） 同様に、イエス・キリストも、ユダヤ人が父とは誰か、子とは誰かを知らないことを咎めて、こう言われました。「父を知る者はいません。子のほかにはいません。また子を知る者もいません。父と、子が現す者たちのほかにはいません。」（<a href="https://bibleox.com/ja/jp-ni/mf/11/#L27">マタ. 11:27</a>） 神のロゴスは神の子です。これは前に述べたとおりです。また、この方は御使いとも使徒とも呼ばれます。知るべきことをすべて宣言し、明かされることを明かすために遣わされるからです。主ご自身が言われたとおりです。「わたしを聞く者は、わたしを遣わした方を聞くのです。」（<a href="https://bibleox.com/ja/jp-ni/lk/10/#L16">ルカ. 10:16</a>） これはモーセの書物からも明らかです。そこにはこう書かれています。「神の御使いが、炎の燃える茨の中からモーセに言われました。『わたしは在りて在るもの、アブラハムの神、イサクの神、ヤコブの神、あなたの父祖たちの神である。エジプトへ行って、わたしの民を連れ出しなさい。』」（<a href="https://bibleox.com/ja/jp-ni/ish/3/#L2">出. 3:2</a>、<a href="https://bibleox.com/ja/jp-ni/ish/3/#L6">出. 3:6</a>、<a href="https://bibleox.com/ja/jp-ni/ish/3/#L10">出. 3:10</a>）[36] その後に続くことは、望むなら同じ書物から知ることができます。ここですべてを書き写すことは不可能です。 これらの言葉は、イエス・キリストが神の子であり、神の使徒であることの証しとして書かれています。この方は昔はロゴスであり、ときには火の形で、ときには御使いたちの姿で現れましたが、今は神の御心によって人となり、人類のために、悪霊たちが狂ったユダヤ人たちを通してこの方に負わせたすべての苦しみを忍ばれました。ユダヤ人たちは、モーセの書物に「神の御使いが、炎の燃える茨の中からモーセに言われました。『わたしは在りて在るもの、アブラハムの神、イサクの神、ヤコブの神である』」（<a href="https://bibleox.com/ja/jp-ni/ish/3/#L2">出. 3:2</a>、<a href="https://bibleox.com/ja/jp-ni/ish/3/#L6">出. 3:6</a>） と明確に書かれているにもかかわらず、こう語った方は万物の父であり創造主であると主張しています。それゆえ、預言の霊は彼らを咎めて言います。「イスラエルはわたしを知らず、民はわたしを理解しません。」（<a href="https://bibleox.com/ja/jp-ni/is/1/#L3">イザ. 1:3</a>） またイエスも、前に示したとおり、彼らの間におられたとき言われました。「父を知る者はいません。子のほかにはいません。また子を知る者もいません。父と、子が現す者たちのほかにはいません。」（<a href="https://bibleox.com/ja/jp-ni/mf/11/#L27">マタ. 11:27</a>） こうして、モーセと語ったのは常に万物の父であると考え続けたユダヤ人は、実際に彼と語った方が神の子であり、御使いとも使徒とも呼ばれる方であるのに、預言の霊とキリストご自身から、父をも知らず、子をも知らないと正当に咎められています。子を父と言う者たちは、父をも知らないこと、そして万物の父には子があることを知らないことを、明らかに示しているからです。この子は、神の初めて生まれたロゴスであり、同時に神でもあります。この方は昔、火の姿で、また御使いの姿でモーセや他の預言者たちに現れましたが、今は、前に述べたとおり、あなたがたの統治の時代に、父の御心によって、おとめから人となり、この方を信じる者たちの救いのために、辱めを受けることと苦しむことをも忍ばれました。それは、死んで、よみがえることによって死を打ち勝つためです。 また、茨の中からモーセに語られた言葉、「わたしは在りて在るもの、アブラハムの神、イサクの神、ヤコブの神、あなたの父祖たちの神である」（<a href="https://bibleox.com/ja/jp-ni/ish/3/#L6">出. 3:6</a>） が意味するのは、彼らが死んでもなお存在し続け、キリストご自身に属する人間である、ということです。なぜなら、彼らはすべての人間の中で最初に、神を探し求めることに励んだ人たちだからです。アブラハムはイサクの父、イサクはヤコブの父でした。モーセも同じように書いています。</p><h2>64</h2><p>悪霊たちが、モーセによって言われたことを模倣して、プロセルピナをゼウスの娘であるとし、水の源に彼女の像を立てるように仕向けたことについては、上に述べたことから理解することができます。モーセは、前に書いたとおりこう言っています。「初めに神は天と地を創造しました。地は見えない状態で、整えられておらず、神の霊が水の上を動いていました。」（<a href="https://bibleox.com/ja/jp-ni/gen/1/#L1">創. 1:1-2</a>） それゆえ、水の上を動いていたと言われる神の霊に倣って、悪霊たちはプロセルピナをゼウスの娘であると宣したのです。同様に、ミネルウァも、同じような企てをもって、結びつきによるのではなくゼウスの娘であるとされました。神が自分のロゴスによって世界を思いなし、造られたことを彼らが知っていたので、ミネルウァを最初の思惟として現したのです。しかし、思惟の形を女性の姿で表すのは、私たちにはきわめて笑うべきことです。同様に、「ゼウスの子」と呼ばれる他の神々も、彼らの行いそのものによって告発されています。</p><h2>65 — 洗礼の日の礼拝</h2><p>このように、教えに納得し、同意した者を洗った後、私たちは彼を「兄弟」と呼ばれる人たちが集まる場所へ連れて行き、自分たちのため、洗礼を受けた者のため、そしてあらゆる場所にいる他のすべての人々のために、心を尽くして共通の祈りを捧げます。それは、真理を学んだ私たちが、行いによっても善良な国民であり、戒めを守る者であると認められ、永遠の救いを得るためです。祈りを終えると、私たちは互いに接吻を交わして挨拶します。それから、兄弟たちの長[37]のもとに、パンと、水とぶどう酒の杯が運ばれます。長はこれを受け取ると、子と聖霊の御名を通して、万物の父に賛美と栄光を捧げ、神が私たちをこれを受けるに相応しい者としてくださったことを、詳しく感謝をささげます。彼が祈りと感謝を終えると、そこにいる民は皆、「アーメン」と言って同意を表します。「アーメン」はヘブライ語の言葉で、「そのようになりますように」の意味です。長の感謝と民全体の同意の後、私たちが輔祭と呼ぶ人たちが、その場にいる各人に、感謝が捧げられたパンと、ぶどう酒と水とを分け与え、不在の者たちのもとへもそれを運びます。</p><h2>66 — 聖体（エウカリスティア）についての教え</h2><p>この食べ物は、私たちの間で「エウカリスティア」（感謝）と呼ばれています。これにあずかることは、私たちの教えの真実を信じ、罪の赦しと新しく生まれることのための洗いを受け、キリストがお伝えになったとおりに生きている者以外には許されていません。なぜなら、私たちはこれを普通のパンとして、あるいは普通の飲み物として受けるのではなく、私たちの救い主イエス・キリストが神のロゴスによって肉となり、私たちの救いのために肉と血を持たれたのと同じように、この方のロゴスの祈りを通して感謝が捧げられたこの食べ物から、私たちの血と肉がその養いを受けるのであり、この食べ物は――私たちが教えられたとおり――肉となったイエスの肉と血なのです。使徒たちは、彼らが書いた記録[38]――「福音書」と呼ばれているもの――の中で、自分たちにこのように命じられたと私たちに伝えています。イエスはパンを取り、感謝を捧げて言われました。「これは私を記念して行いなさい。これは私の体です。」（<a href="https://bibleox.com/ja/jp-ni/mf/26/#L26">マタ. 26:26</a>、<a href="https://bibleox.com/ja/jp-ni/lk/22/#L19">ルカ. 22:19</a>） 同じように、杯を取り、感謝を捧げて言われました。「これは私の血です。」（<a href="https://bibleox.com/ja/jp-ni/mf/26/#L28">マタ. 26:28</a>、<a href="https://bibleox.com/ja/jp-ni/lk/22/#L20">ルカ. 22:20</a>） そして、彼らだけにこれを与えられました。この同じことを、悪い悪霊たちは模倣としてミトラの秘儀において行わせました。秘儀に入る者の奉献の際には、そこでパンと水の杯が備えられるのです。それをあなたがたは知っているか、知ることができるでしょう。</p><h2>67 — 復活の日（日曜日）の礼拝について</h2><p>その時以来、私たちは互いの間で、これらのことを常に思い起こし合っています。私たちの中の余裕のある者は、貧しい人すべてを助け、私たちは常に互いに一つになって暮らしています。私たちが受けるすべての恵みについて、私たちは、御子イエス・キリストを通して、また聖霊を通して、万物の造り主を讃美します。「太陽の日」と呼ばれる日には、都市に住む者も村に住む者も、すべての者が一つの場所に集まります。[39] そして、時間の許す限り、使徒たちの記録、あるいは預言者たちの書物が読まれます。それから、読む者が読み終えると、長が言葉によって教え、これらの美しい事柄に倣うようにと勧めます。その後、私たちは皆が共に立ち上がり、祈りを捧げます。祈りを終えると、前に述べたとおり、パンとぶどう酒と水が運ばれ、長も同じように、自分にできる限り、祈りと感謝を捧げます。民は「アーメン」という言葉で同意を表し、各人への分配と、感謝が捧げられた賜物へのあずかりが行われ、不在の者たちには、輔祭たちを通してそれが送られます。 余裕のある者で、望む者は、それぞれが自分の判断で、与えたいものを与えます。集められたものは長のもとに保管されます。長は、みなしごややもめのため、また病気やその他の理由で困窮している人すべてのため、囚われている人のため、遠くから来た旅人のために、言うならば、必要の中にある人すべてのことを心にかけています。 「太陽の日」に私たちが皆で集会を開くのは、その日こそ、神が闇と物質に変化をもたらして世界を造られた最初の日であり、私たちの救い主イエス・キリストが同じ日に死者の中から復活された日だからです。この方はサトゥルヌスの日の前日に十字架につけられ、サトゥルヌスの日の翌日、すなわち「太陽の日」に、使徒たちと弟子たちに現れ、私たちがあなたがたにも示し、考えていただきたいと申し上げたこれらのことを教えられました。</p><h2>68</h2><p>もしこれらのことがあなたがたに、道理と真実にかなっていると思われるなら、これを尊重してください。無意味なものと思われるなら、無意味なものとして軽んじなさい。ただし、何の罪もない人々を、敵のように死刑に処することはなさらないでください。私たちはあなたがたに前もって言います。あなたがたがこの不正の中に留まるなら、来るべき神の裁きから逃れることはできません。そして私たちは、「神にかなうことがなされますように」と呼びかけます。また、あなたがたの父である、最も高貴な皇帝ハドリアヌス帝の書簡に基づいて、私たちの嘆願書のとおりに裁くようにと命じられたいと要求することもできたのですが、私たちはむしろ、ハドリアヌス帝の裁定に従うからという理由ではなく、自分たちが公正なことを求めていると確信しているがゆえに、この嘆願と私たちの件の説明を書きました。なお、ハドリアヌス帝の書簡の写しを添付しておきます。このことについても、私たちが真実を語っていることを、あなたがたが見てお分かりになるようにです。</p><p>以下がその写しです。</p><h2>69 — ハドリアヌス帝からミヌキウス・フンダヌスへの手紙</h2><p>私は、あなたの前任者である、最も高名なセレニウス・グラニアヌス[40]が私に宛てて書いた手紙を受け取りました。無実の人々が不安に陥れないため、また告発者たちが悪事を働く機会を与えないためにも、私に届けられたこの件を調査なしで過ごすつもりはありません。それで、もし私たちの臣民が諸州において、キリスト者に対する自分たちの訴えを固く主張し、法廷でそれを証明できるのであれば、彼らがそうすることを私は禁じません。ただし、大げさな要求や叫びに頼ることは許しません。誰かが告発を望むなら、あなたがその件について裁きを下す方が、はるかに公正だからです。それゆえ、誰かが告発をし、前述の人々が法律に反することを行っているという証拠を示すなら、その罪に応じて刑罰を定めなさい。そして、ヘラクレスにかけて、これは特に心に留めなさい。もしだれかが単なる誣告によってキリスト者の誰かを告発しようとするなら、あなたはその誣告者に対して、その悪質な行為に見合った、最も厳しい処置を取るようにしなさい。</p><h2>70 — アントニヌス帝からアシアの総会への手紙</h2><p>皇帝カエサル、ティトゥス・アエリウス・ハドリアヌス・アントニヌス・アウグストゥス・ピウス、最高神祇官、護民官権を得て15年目、3度目のコンスル、祖国の父[41]が、アシアの総会に挨拶を送ります。 私は、神々自らが、このような人々が逃れることのないように取り計らってくださるはずだと考えていました。神々にその力があるなら、彼らを礼拝しない者たちを、神々ご自身がむしろ罰されるでしょう。それなのに、あなたがたはこのような人々を苦しめ、彼らの考え方を無神論者の思想として告発し、私たちが証明することのできない他の事柄まで彼らの罪に加えています。 しかし、彼らにとっては、訴えられていることのために死へ赴くと思われることこそ、彼らに有利なのです。あなたがたが要求することに同意するよりも、むしろいのちを死に委ねることによって、彼らはあなたがたに勝利を収めます。 また、過去に起きた地震や今起きている地震については、言い立てるべきではありません。その際、あなたがたは臆病な者になります。自分たちを彼らと比べてみるなら――彼らの方が、あなたがたよりも神に深く確信を寄せているからです。そのようなとき、あなたがたは神々を顧みないかのように見え、神殿を疎かにし、神への礼拝を認めようとしません。だからこそ、神に仕える人々を憎み、死に至るまで迫害するのです。 このような人々については、他の州の総督たちも、私の最も神聖な父に書き送りました。父は、彼らがローマの政府に反することを企てていると判明しない限り、このような人々を決して騒がせないように、と返答しました。私のところにも多くの者が彼らについて知らせてきましたが、私も父の判断に従って返答しました。 しかし、もしだれかが、このような人々の誰かを、ただそういう者だという理由だけで法廷に告発するなら、被告発された者は、たとえ実際にそのような者であることが判明しても、告発から自由とされ、告発した者が刑罰を受けるようにしなさい。</p><h2>71 — マルクス・アウレリウス帝から元老院への手紙――キリスト者が勝利の原因であったと証言して</h2><p>皇帝カエサル、マルクス・アウレリウス・アントニヌス、ゲルマニクス、パルティクス、サルマティクスが、ローマの民と神聖な元老院に挨拶を送ります。私はあなたがたに、私の目的の重要性と、疲れ果て、消耗した私がカルヌントゥムで、9ローママイルの距離を置いて74個大隊に包囲されたことから、私がドイツの国境でどんな成果を収めたかを報告しました。[42] 敵が間近に迫ると、斥候が私たちに知らせ、私たちの将軍ポンペイヤヌスは、私たちの知っていることを確かめてくれました。すなわち、私たちの目前に97万7千人の混成軍がいる、というのです。私はこの大軍に包囲され、手元には、第一、第十、そして二重（ジェミナ）の諸軍団からなる限られた部隊しかありませんでした。 そこで私は、自分と自分の軍勢を、無数のバルバロイつまり敵と比べて、祖国の神々に祈りを捧げました。 しかし、神々に顧みられなかった私は、私たちの中で「キリスト者」と呼ばれる人たちを呼び寄せ、調べたところ、その数がきわめて多く、大群であることを知りました。私は彼らに怒りを向けましたが、これは決してなすべきことではありませんでした。後になって、私は彼らの力を知ったからです。 彼らは戦いを、矢を備えることなく、武器なく、角笛を吹き鳴らすことなく始めました。彼らの良心に宿っている神への敬意から、そのような備えは彼らにとって忌み嫌うものだからです。したがって、私たちが無神論者だと思い込んでいる人たちが、良心の中に神を宿らせている、と認めるべきでしょう。 彼らは地面に身を伏せ、私のためだけでなく、そこに立っている全軍のために、今の渇きと飢えから私たちが救われるようにと、祈り始めました。私たちは5日間、水がないために一滴も水を飲んでいませんでした。私たちはドイツの中心部、敵の領域内にいたからです。 キリスト者たちが地面に身を伏せ、私の知らない神に祈り始めると同時に、天から水が降ってきました。私たちには最も爽やかな雨として、しかしローマの敵には燃え上がる雹として。そして私たちはただちに、祈りに伴って神の臨在があることを認めました。それは打ち勝たれず、打ち破られない神です。 このことから、これからはこのような人たちがキリスト者であることを許し、彼らがそのような武器を祈りによって手に入れ、私たちに敵対することがないようにしましょう。私は、このような人たちが、キリスト者であるという理由で告発されないように命じます。 もしだれかが、キリスト者がキリスト者であるという罪状で訴えるなら、キリスト者として訴えられ、自分もそうだと認める者が、キリスト者であるということのほかには何も告発されていないことを、明確に立証されるようにしたい。そして、その者を訴えた者は、生きたまま火刑に処されなければなりません。 キリスト者が自分から申告し、それが確かめられた場合には、州を治める長官は、そのキリスト者に撤回を強いたり、自由を奪ったりしてはなりません。 さらに、これらのことが元老院の決議によって確認されるように望みます。そして、この私の命令をトラヤヌスの広場に掲示して、誰もが読めるようにするように命じます。長官ウィトラシウス・ポッリオが、これを周囲のすべての州に送るように取り計らい、この命令を利用し、所有したいと望む者が誰であっても、私が公布した文書から写しを取ることを妨げられないようにするでしょう。</p>
    references: |-
      <ol><li><p>ヴェリッシムス：後に皇帝マルクス・アウレリウスとなる人物の幼年時の呼び名と一般に同定されます。ルキウス：ハドリアヌス帝が最初に養子としたアエリウス・カエサルの実子で、後に皇帝ルキウス・ウェルスとなる人物とされます。</p></li><li><p>キリスト者（クリスティアノイ）：原語では「善良な人々（クレーストイ）」と音が通じています。「すぐれたものを憎むことは不正である」という言い回しには、この語呂合わせの響きがかすかに残っています。</p></li><li><p>ロゴス（λόγος）：「言葉」「理性」を意味するギリシア語。ここでは、ソクラテスを通して人々を導いた「理性」としてのロゴスと、人となってイエス・キリストと呼ばれた神の「言葉」としてのロゴスが、同じロゴスとして語られています。</p></li><li><p>ラダマンテュスとミーノス：プラトンの対話篇（『ゴルギアス』など）に登場する冥界の裁き主。プラトンは、死んだ魂が千年の期間を経て裁かれると説きました。</p></li><li><p>使徒（アポストロス）：「遣わされた者」の意。ここでは十二使徒という意味ではなく、御父から遣わされた御子という意味で用いられています。</p></li><li><p>第二・第三の順序：御父・御子・預言の霊という順で神を語る表現は、後に教会で「三位一体」として定式化される信仰のごく初期の証言です。</p></li><li><p>生まれない神：原語の表現は「生まれざる者」の意で、生まれずに存在される御父を指します。御子は御父から生まれるお方であり、この対比が初期教会の神学の基本の言い回しでした。</p></li><li><p>「姦淫者たちも同じことをしているのです」の語は、マタイの本文では「徴税人」です。ユスティノスが用いた「使徒の記録」の読みでは「姦淫者」となっています。</p></li><li><p>「怒る者は火の責めに値する」はマタイ5:22の言葉です。本文では怒りについて「裁きに値する」と語り、「火のゲヘナに値する」と言われるのは兄を「愚か者」と呼ぶ場合ですが、ユスティノスの読みでは短く「火の責めに値する」となっています。</p></li><li><p>この言葉は申命記6:13の言葉（マタイ4:10でイエスが引用）です。ユスティノスはこれをここで「最も大きな掟」として提示しています（マタイ22:38の言い回し）。</p></li><li><p>機密（ミステリオン）：ここでは「秘密の儀礼」の意。当時、キリスト者が密儀において不道徳な行為を行うという中傷が流布しており、ユスティノスはそれを否定する。</p></li><li><p>アンティノオス：皇帝ハドリアヌスに寵愛された青年。130年ごろナイル川で溺死すると、ハドリアヌスは彼を神として祀り、彼の名を冠した都市（アンティノオポリス）をエジプトに建設した。出自を知られながら神とされたこの例を、ユスティノスは偶像礼拝の証拠として挙げる。</p></li><li><p>創世記49章10節の引用は七十人訳の読み（「彼に留め置かれた者が来るまで」）による。新共同訳は「シロが来るまで、彼のために諸民族は従う」と訳す。「シロ」は「彼に属するもの」とも解され、メシアの到来を示す語と理解されてきた。</p></li><li><p>ユスティノスは、ルカ1章35節の「霊と力」を、神の初生の子である言葉（ロゴス）と同一視する。これは彼の神学の特徴的な解釈である。</p></li><li><p>引用の結びの語（「今や彼らはわたしに裁きを求め、神に近づく大胆さを示す」）は、イザヤ58:2の語句（彼らはわたしに裁きを問い、神に近づくことを望む）を合わせた合成引用で、新共同訳のイザヤ65:2-3には対応する語がありません。</p></li><li><p>『ポンティウス・ピラトゥスの記録』：総督ピラトゥスが皇帝に提出した公式報告書（アクタ）を指すと思われる。当時のローマでは統治者の報告書が公文書庫に保管されており、ユスティノスは読者に、公的記録から十字架刑の事実を確認できると述べる。文書は現存しない。</p></li><li><p>この引用は、ユスティノスが挙げる預言者ゼファニヤではなく、ゼカリヤ書9章9節からのもの（マタイ21章5節も同一の引用）。預言者名の誤記憶と考えられる。</p></li><li><p>この引用は合成です。前半（新月祭と安息日…羊の脂と牛の血）はイザヤ1:11-17、結び（不正の縄目を解き、家もなく裸の者を覆い、飢える者にパンを分け与えよ）はイザヤ58:6-7によります。</p></li><li><p>「舌は誓ったが、心は誓っていない」：古代ギリシア・ローマ世界に流布していた格言。誓いを外形だけのものとして、破ってもかまわないとする考え方。ユスティノスは、キリスト者はこのような理屈に頼らず、嘘をつかないために喜んで死ぬと述べる。</p></li><li><p>「主は十字架の木から王として統治された」：七十人訳詩編95編10節の「木から」という語はヘブライ語テキストや新共同訳（「主は王として統治される」）にはなく、十字架を指すと解される。ユスティノスはこの読みを、十字架刑から始まるキリストの統治の預言として重視する。</p></li><li><p>この言葉は申命記30章15節、19節（「見よ、わたしは今日、あなたの前に生と死、善と悪を置く」「生を選びなさい」）を基にした自由な引用です。</p></li><li><p>プラトンの言葉は『国家』第10巻（617e）に由来します。ユスティノスは、これが預言者モーセからの借用だと主張します。</p></li><li><p>ヒュスタスペスは古代ペルシアの預言者とされる人物で、その名を冠した書物は当時流布していました。『シビュラの書』は、ギリシア・ローマ世界の女預言者シビュラの名を冠した予言集で、初代教会でも広く読まれました。</p></li><li><p>キュレニオは、イエスの誕生のときに住民登録を行ったシリアの総督です（ルカによる福音書2章2節）。ユスティノスは、キリストの誕生からこの弁明の執筆までを150年ほどとしています。</p></li><li><p>この言葉はイザヤ書1章7節に基づきますが、「彼らの誰もそこに住む者とはならない」という結びはイザヤ書本文になく、ユスティノスがエルサレムの現状に当てはめて加えたものと考えられます。</p></li><li><p>「死者はよみがえって歩く」という句は、イザヤ書35章の七十人訳本文にはありません。イエスの癒しの業の伝承（マタイによる福音書11章5節「死人はよみがえる」）との関連で加えられたと考えられます。</p></li><li><p>ユスティノスはこの言葉を預言者エレミヤのものとして引いていますが、実際にはダニエル書7章13節の言葉です。</p></li><li><p>「すべての膝は主の前に屈み、すべての舌は主を賛美する」という言葉はイザヤ書45章23節からのものです。エゼキエル書にはこの語がありません。</p></li><li><p>「四つの風に命じて散らされた子らを集めさせます」という言葉は、ゼカリヤ書2章6節（「四つの天の風のように散らされた」）や8章7-8節を思わせる表現ですが、正典本文にそのままの形では見られません。続く嘆きの言葉も、ゼカリヤ書12章10-12節に、イザヤ書63章17節・64章11節を自由に組み合わせたものです。</p></li><li><p>ユスティノスはこの言葉を預言者イザヤのものとして引いていますが、実際にはエレミヤ書9章26節（七十人訳「異邦人はみな肉で割礼を受けたが、イスラエルの家は心で包皮を切っていない」）に基づく自由な引用です。</p></li><li><p>「巨人のように力強く、道を走り出る者である」は七十人訳詩編18編5節の言葉（太陽が「力ある者のようにその道を走る」という比喩）に基づきます。ユスティノスの引用はわずかに異なる形を伝えています。</p></li><li><p>「エレブス」（Ἔρεβος）は、ギリシア神話における原初の闇、あるいは闇を神格化した者の名です。</p></li><li><p>この「永遠の火」の言葉は、正典のモーセ五書には見当たりません。初代教会にはモーセの名で伝わる外典があり、ユスティノスはそこから引用したと考えられます。</p></li><li><p>キリストの言葉はヨハネによる福音書3章3節の引用です。新共同訳では「人は新しく生まれなければ、神の国を見ることができない」となっており、ユスティノスの引用は「入る」という表現で独自の形を伝えています。</p></li><li><p>この洗いの名称「光照」（φωτίσμος、フォティスモス）は、初代教会で洗礼を指して用いられた言葉です。洗礼を受ける者が心を照らされると考えられていました。</p></li><li><p>「在りて在るもの」は出エジプト記3章14節の七十人訳の表現「エゴー・エイミ・ホ・オン（ἐγώ εἰμι ὁ ὤν）」に基づきます。新共同訳では「わたしはあるという者だ」と訳されます。</p></li><li><p>「長」と訳されるギリシア語「プロエストース」（先頭に立つ者）は、礼拝を主宰する主教または司祭に当たります。</p></li><li><p>「記録」はギリシア語「アポムネーマタ」（ἀπομνημονεύματα、回想録）の訳で、ユスティノスが福音書を指して用いた表現です。</p></li><li><p>「太陽の日」は現在の日曜日に当たります（ラテン語の dies Solis）。後に出てくる「サトゥルヌスの日」は土曜日のことです。</p></li><li><p>ミヌキウス・フンダヌスはハドリアヌス帝治下のアシア州の執政官（プロコンスル）で、その前任者がセレニウス・グラニアヌスです。この手紙は133年ごろのものと考えられています。</p></li><li><p>「護民官権を得て15年目」は皇帝の正式称号の一部で、アントニヌス・ピウスの即位（138年）から15年目、147年ごろに当たります。「最高神祇官」はローマ国教の最高司祭、「祖国の父」（パテル・パトリエ）も皇帝の正式な称号です。</p></li><li><p>この手紙は、172年ごろドナウ戦線で起きたとされる「雨の奇跡」（後に第12軍団「雷鳴軍団」の伝承として有名になる出来事）を伝えますが、現代の研究者の多くは、この文面をユスティノスの門弟か後世のキリスト者の手によるものと見ています。</p></li></ol><p>翻訳：ロジオン・ヴラソフ（AIツールを併用）。底本：ギリシア語原文（M. マルコヴィッチ校訂版による章立て；この作品は本サイトにギリシア語原文ページがなく、外部の校訂版に従います）。訳出にあたっては本サイトのロシア語版と英語版（ANF）を参照しました。聖書の引用はユスティノス自身の用いた語句（おおむね七十人訳）に従って訳し、新共同訳と異なる箇所は注で説明します。引用箇所のリンクは新共同訳の当該箇所を指します。</p>
