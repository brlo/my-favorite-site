    path: Ig1R_ローマの教会への手紙
    title: ローマの教会への手紙
    meta_desc: アンティオキアの聖イグナティオス（テオフォロス）がローマの教会に宛てた手紙。殉教への願いを語る。ギリシア語原文からの翻訳と注。
    menu: { parent: "手紙", title: "ローマの教会への手紙", priority: 4 }
    body: |-
      <h2>0</h2><p>イグナティオス、またの名をテオフォロスより、いと高き父と、その独り子イエス・キリストの偉大さのうちに憐れみを受けた教会へ。存在するすべてのものを望まれた方の御心により、私たちの神イエス・キリストの愛に従って、愛され、照らされた教会、ローマ人の地方において首座を占める教会[1]、神にふさわしく、誉れにふさわしく、幸いと呼ばれるにふさわしく、賞賛にふさわしく、成就にふさわしく、清さにふさわしい教会、愛において首座を占め[2]、キリストの名を帯び、父の名を帯びる教会[3]へ。私はこの教会に、父の子イエス・キリストの名によって挨拶を送ります。肉においても霊においてもこの方のあらゆる掟に結ばれ、分け隔てなく神の恵みに満たされ、あらゆる異質な色から濾し清められた人々[4]に、私たちの神イエス・キリストのうちに、汚れのない心からの喜びを祈ります。</p>
      <h2>1</h2><p>1. 私は神に祈って、神にふさわしいあなたがたの顔を見ることを許されました。願っていた以上のものを受けたのです。私はキリスト・イエスにあって縛られた身で、あなたがたに挨拶することを望んでいます。もし私が終わりまで（走り抜くに）ふさわしい者とされることが御心であるなら。</p><p>2. 始まりはよく整いました。もし私が、自分の分け前を妨げられることなく受け取る恵みを得るならばです。しかし、あなたがたの愛が私に害を与えるのではないかと、私は恐れています。あなたがたにとっては、望むことをするのはたやすいことですが、あなたがたが私を惜しむなら、私にとって神に到達するのは難しいからです。</p>
      <h2>2</h2><p>1. 私は、あなたがたが人に取り入るのではなく、神に喜ばれることを望んでいます[5]。実際、あなたがたは神に喜ばれています。私が神に到達するこのような機会は二度とありませんし、あなたがたも、もし沈黙を守ってくれるなら、これにまさるよい業に名を記されることはないでしょう。あなたがたが私について沈黙するなら、私は神の言葉となります。しかしもし私の肉を愛するなら、私はまたただの声となるでしょう[6]。</p><p>2. 祭壇がまだ備えられているうちに、私が神への注ぎの供え物とされること[7]、それ以上のものを私に与えようとしないでください。それは、あなたがたが愛のうちに合唱隊となって、キリスト・イエスにあって父に歌うためです。神はシリアの主教を、日の昇る所から日の沈む所へと呼び寄せて、そこに見いだされるにふさわしい者とされた、と。世から神のもとへ沈むことはよいことです。神のうちへと昇るためです。</p>
      <h2>3</h2><p>1. あなたがたはだれをもねたんだことがなく、ほかの人々を教えてきました。私が望むのは、あなたがたが弟子たちを教えながら命じていることが、（私について）確かなものとなることです。</p><p>2. ただ、私が内からも外からも力を受けるよう祈ってください。それは、私が語るだけでなく望む者となり、キリスト者と呼ばれるだけでなく、実際にそう見いだされるためです。もし私がそう見いだされるなら、キリスト者と呼ばれることもでき、私が世から見えなくなるときにこそ、忠実な者となるでしょう。</p><p>3. 目に見えるもので善いものは一つもありません[8]。私たちの神イエス・キリストも、父のうちにおられる今、いっそうはっきりと現れておられるのです。キリスト教は、説得の業ではなく、偉大さの業です。世から憎まれるときにこそそうなのです[9]。</p>
      <h2>4</h2><p>1. 私はすべての教会に書き送り、すべての人に告げています。もしあなたがたが妨げさえしなければ、私は神のために喜んで死ぬのだ、と。お願いです。私に時宜を得ない好意を示さないでください。私を獣の餌とならせてください。獣を通して神に到達することができるのです。私は神の小麦です。獣の歯にひかれて、キリストの清いパンとなるのです。</p><p>2. むしろ獣をなだめてください。獣が私の墓となり、私の体を何一つ残さないように。そうすれば、私が眠りについた後、だれかの重荷となることもありません。世が私の体さえ見なくなるとき、そのとき私は真にイエス・キリストの弟子となるでしょう。これらの道具（獣）によって私が神へのいけにえとして見いだされるよう、私のためにキリストに祈ってください。</p><p>3. 私はペトロやパウロのようにあなたがたに命じるのではありません。彼らは使徒であり、私は罪に定められた者です。彼らは自由な者であり、私は今に至るまで奴隷です。しかし、もし私が苦しみを受けるなら、私はイエス・キリストによって自由の身とされた者となり[10]、この方のうちに自由な者として復活するでしょう。今、私は縛られて、何ものをも欲しないことを学んでいます。</p>
      <h2>5</h2><p>1. シリアからローマまで、陸でも海でも、夜も昼も、私は獣と戦っています。十頭の豹、すなわち一隊の兵士たちに縛られているのです。彼らは親切にされればされるほど、いっそう悪くなります[11]。しかし彼らの不正によって、私はいっそう弟子として学んでいます。けれども、それで私が義とされているわけではありません[12]。</p><p>2. 私のために備えられている獣たちのことを私は喜びとしたいものです。そして獣たちが速やかに私に向かってくることを祈ります。私は獣たちをなだめて、速やかに私を食い尽くすようにさせましょう。ある人々に対してしたように、怖がって手を出さないことがないように。もし獣たちが嫌がって望まないなら、私が無理にでもそうさせましょう。</p><p>3. 私を許してください。何が私にとって益となるのか、私は知っています。今、私は弟子となり始めています。見えるものも見えないものも、何一つ私をねたんで、私がイエス・キリストに到達するのを妨げることがありませんように。火も、十字架も、獣の群れも、切り裂かれることも、引き裂かれることも、骨が散らされることも、手足を切り刻まれることも、全身を挽きつぶされることも、悪魔のひどい責め苦も、私に襲いかかってくるがよい。ただ私がイエス・キリストに到達しさえすれば。</p>
      <h2>6</h2><p>1. 世の果てまで[13]も、この世の王国も、私には何の益にもなりません。地の果てまで治めるよりも、キリスト・イエスへと死ぬほうが、私にとってはよいのです[14]。私たちのために死なれたあの方を、私は求めます。私たちのために復活されたあの方を、私は望みます。産みの苦しみが私に迫っています[15]。</p><p>2. 兄弟たち、私を許してください。私が生きることを妨げないでください。私が死ぬことを望まないでください。神のものとなろうとしている者を世に引き渡したり、物質によって欺いたりしないでください。私が清い光を受けることを許してください。そこに着いたとき、私は（真の）人となるでしょう。</p><p>3. 私の神の受難に倣う者となることを、私に許してください。だれでも自分のうちにこの方を持っている者は、私が何を望んでいるかを悟り、私を締めつけているものを知って、私の思いを共にしてください。</p>
      <h2>7</h2><p>1. この世の支配者は私を奪い去り、神へと向かう私の思いを損なおうとしています。ですから、そこにいるあなたがたのうちのだれも、彼に手を貸してはなりません。むしろ私の側に、すなわち神の側につきなさい。イエス・キリストを口にしながら、世を欲してはなりません。ねたみがあなたがたのうちに住みついてはなりません。</p><p>2. たとえ私がそちらに着いてからあなたがたに頼んだとしても、私の言うことを聞き入れないでください。むしろ、今あなたがたに書いているこの言葉に従ってください。私は生きているうちにあなたがたに書いていますが、死ぬことを恋い慕っているのです。私の愛（エロース）は十字架につけられました[16]。私のうちには、物質を愛する火はありません。ただ生きた水[17]が私のうちで語り、内から私に「父のもとに来なさい」と言っています。</p><p>3. 私は朽ちる食べ物にも、この世の快楽にも喜びを感じません。私が望むのは神のパン、すなわちダビデの子孫から出たイエス・キリストの肉です。また私は飲み物として、この方の血を望みます。それは朽ちることのない愛です。</p>
      <h2>8</h2><p>1. 私はもはや人間に従って生きることを望みません。あなたがたが望んでくれるなら、そうなるでしょう。望んでください。あなたがたも（神に）望まれるために。</p><p>2. 私は短い手紙であなたがたにお願いします。私を信じてください。イエス・キリストが、私が真実を語っていることをあなたがたに明らかにしてくださるでしょう。この方は偽りのない口であり、この口を通して父は真実に語られたのです[18]。</p><p>3. 私が到達できるよう、私のために祈ってください。私はあなたがたに肉に従ってではなく、神の御心に従って書きました。もし私が苦しみを受けるなら、それはあなたがたが私に好意を持ってくれたからです。もし私が退けられるなら、それはあなたがたが私を憎んだからです。</p>
      <h2>9</h2><p>1. あなたがたの祈りのうちに、シリアの教会を覚えてください。この教会は今、私に代わって神を牧者としています。イエス・キリストだけが、そしてあなたがたの愛が、この教会の主教となるでしょう。</p><p>2. 私自身は、その教会の者と呼ばれることを恥じています。私はその値打ちもない者であり、彼らのうちで最も小さい者、月足らずで生まれた者[19]だからです。しかし、もし神に到達するなら、私は何者かとなる憐れみを受けたのです。</p><p>3. 私の霊と、私を旅人としてではなくイエス・キリストの名によって迎えてくれた諸教会の愛とが、あなたがたに挨拶を送ります。私の通る道筋にない教会さえも、町から町へと私を送り届けてくれたのです。</p>
      <h2>10</h2><p>1. 私はこの手紙を、スミルナから、まことに幸いなエフェソの人々に託して書いています。私のそばには、ほかの人々と共に、私にとって慕わしい名を持つクロコスもいます。</p><p>2. 私より先に、神の栄光のためにシリアからローマへ行った人々のことは、あなたがたももう知っていると思います。私がもう近くまで来ていることを、彼らに知らせてください。彼らは皆、神にもあなたがたにもふさわしい人々です。あらゆる点で彼らを安らがせてやるのが、あなたがたにはふさわしいことです。</p><p>3. 私はこれを、九月の朔日の九日前[20]に書きました。イエス・キリストの忍耐のうちに、終わりまでお元気で。</p>
    references: |-
      <ol><li><p>ἥτις καὶ προκάθηται ἐν τόπῳ χωρίου Ῥωμαίων。ローマとその周辺の地域において（教会を）治め、座長を務める、の意。ローマの教会の格別の地位を言うものと解する学者もいます。</p></li><li><p>προκαθημένη τῆς ἀγάπης。「愛において首位に立つ」とも、「愛の集い（諸教会の交わり）を司る」とも解されます。ローマの教会は、困窮している他の教会の兄弟たちへの慈善でよく知られていました。</p></li><li><p>χριστώνυμος, πατρώνυμος。古いラテン語訳、シリア語訳、アルメニア語訳は χριστόνομος「キリストの律法を持つ」と読んでいます。</p></li><li><p>異質な色、すなわち偽りの教えから濾し清められた人々、の意。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/gal/1/#L10">ガラ. 1:10</a> 参照。</p></li><li><p>あなたがたが私の殉教を妨げずに黙っていてくれるなら、私の死そのものが神の言葉（神についての証し）となる。しかし私の命を惜しむなら、私は意味のない声にとどまる、の意。シリア語訳は「私は神の言葉となるだろう」と読んでいます。</p></li><li><p>σπονδισθῆναι —「注ぎの供え物として注がれる」。<a href="https://bibleox.com/ja/jp-ni/fil/2/#L17">フィリ. 2:17</a>、<a href="https://bibleox.com/ja/jp-ni/2tim/4/#L6">２テモ. 4:6</a> 参照。</p></li><li><p>古いラテン語訳、シリア語訳、アルメニア語訳はこの後に「見えるものは一時的であり、見えないものは永遠に続く」（<a href="https://bibleox.com/ja/jp-ni/2kor/4/#L18">２コリ. 4:18</a>）を加えていますが、ギリシア語本文にはありません。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/in/15/#L18-19">ヨハ. 15:18-19</a> 参照。</p></li><li><p>ἀπελεύθερος —「解放奴隷」。<a href="https://bibleox.com/ja/jp-ni/1kor/7/#L22">１コリ. 7:22</a> 参照。</p></li><li><p>護衛の兵士たちの厳しさを和らげようとして、キリスト者たちが彼らに贈り物をしていたことを指すと考えられます。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/1kor/4/#L4">１コリ. 4:4</a> 参照。</p></li><li><p>τὰ πέρατα τοῦ κόσμου。写本によっては τὰ τερπνὰ τοῦ κόσμου「世の楽しみ」。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/mf/16/#L26">マタ. 16:26</a>、<a href="https://bibleox.com/ja/jp-ni/fil/1/#L21">フィリ. 1:21</a> 参照。</p></li><li><p>ὁ τοκετός —「出産」。殉教による天の命への誕生を指しています。古いラテン語訳は「利得」（lucrum）と訳しています。</p></li><li><p>ὁ ἐμὸς ἔρως ἐσταύρωται。この世のものへの私の欲望は十字架につけられ、死んだ、の意（ガラ. 5:24、6:14 参照）。古くから「私の愛する方（キリスト）は十字架につけられた」とも解され、そのように引用されてきました。</p></li><li><p>生きた水 — 殉教へと励ます聖霊のこと（<a href="https://bibleox.com/ja/jp-ni/in/4/#L10">ヨハ. 4:10</a>、<a href="https://bibleox.com/ja/jp-ni/in/7/#L38">ヨハ. 7:38</a> 参照）。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/in/14/#L6">ヨハ. 14:6</a>、<a href="https://bibleox.com/ja/jp-ni/evr/6/#L18">ヘブ. 6:18</a> 参照。</p></li><li><p>ἔκτρωμα —「月足らずで生まれた者」。<a href="https://bibleox.com/ja/jp-ni/1kor/15/#L8-9">１コリ. 15:8-9</a> 参照。</p></li><li><p>ローマ暦の「九月の朔日（カレンダエ）の九日前」、すなわち8月24日。</p></li></ol>
      <p>翻訳：ロジオン・ヴラソフ（AIツールを併用）。底本：ギリシア語本文（<a href="https://bibleox.com/ja/grc/w/ΙγνΘ_Ρωμ">本サイトのギリシア語版</a>。明らかな脱落はライトフット版・ホームズ版で補った）。参照：ロシア語訳（『初期教会教父選集』ブリュッセル、1988年）、英訳（Roberts–Donaldson）、仏訳（Genoude、1837年）。聖書の引用は新共同訳による。</p>
