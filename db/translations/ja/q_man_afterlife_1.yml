      <h3>役に立つ情報</h3><ol><li><p><a href="https://azbyka.ru/otechnik/Nikolaj_Varzhanskij/oruzhie-pravdy/20_1">https://azbyka.ru/otechnik/Nikolaj_Varzhanskij/oruzhie-pravdy/20_1</a>（ロシア語）</p></li></ol>
    body: |-
      <h2>体と魂</h2><h3>迫害する者は魂を殺すことができない</h3><p>主イエス・キリストは、迫害する者を恐れるなと言われます。彼らは体を殺すことはできても、魂を殺すことはできないからです。彼らは魂を害することができません。死後の魂の存在を否定する人々は、魂は体と共に死ぬと主張します。それはもちろん、迫害する者が体だけでなく魂も殺すということになりますが、これはキリストの言葉に反します：</p><blockquote><p>「<strong>体は殺しても、<mark>魂を殺すことのできない</mark>者どもを恐れるな</strong>。むしろ、魂も体も地獄で滅ぼすことのできる方を恐れなさい」（<a href="https://bibleox.com/ja/jp-ni/mf/10/#L28">マタ. 10:28</a>）</p></blockquote><blockquote><p>「友人であるあなたがたに言っておく。<strong>体を殺しても、その後、それ以上何もできない者どもを恐れてはならない</strong>」（<a href="https://bibleox.com/ja/jp-ni/lk/12/#L4">ルカ. 12:4</a>）</p></blockquote><h3>タボル山に現れた、永眠した預言者モーセの魂</h3><p>タボル山での救い主の変容の時、使徒たちは、すでに死んでいた預言者モーセが現れ、キリストの前にある十字架の苦しみについてキリストと語り合うのを見ます。つまり、預言者は死にましたが（<a href="https://bibleox.com/ja/jp-ni/vtor/34/#L7">申. 34:7</a>; <a href="https://bibleox.com/ja/jp-ni/nav/1/#L2">ヨシュ. 1:2</a>）（<a href="#HH-神は預言者モーセを復活させたのか">注解</a>を参照）、消え去ったのでも意識を失ったのでもなく、キリストと<strong>語り合っている</strong>のです：</p><blockquote><p>「見ると、<strong><mark>モーセ</mark>とエリヤが<mark>現れ、イエスと語り合っていた</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/mf/17/#L3">マタ. 17:3</a>）</p></blockquote><blockquote><p>「祈っておられるうちに、イエスの顔の様子が変わり、服は真っ白に輝いた。見ると、<strong>二人の人がイエスと語り合っていた。モーセとエリヤである</strong>。二人は栄光に包まれて現れ、イエスがエルサレムで遂げようとしておられる最期について<strong>話していた</strong>」（<a href="https://bibleox.com/ja/jp-ni/lk/9/#L29-31">ルカ. 9:29-31</a>）</p></blockquote><h3>死後の生についての使徒の言葉</h3><p>使徒パウロは、地上の幕屋（体）が滅びても、わたしたちには天に住みかがあると言っています：</p><blockquote><p>「<strong>わたしたちの地上の住みかである幕屋が滅びても</strong>、<strong>神によって建物が備えられている</strong>ことを、わたしたちは知っています。人の手で造られたものではない<strong>天にある永遠の住みか</strong>です。&lt;…&gt; この幕屋に住むわたしたちは重荷を負ってうめいておりますが、<strong>それは、地上の住みかを脱ぎ捨てたいからではありません</strong>。死ぬはずのものが命に飲み込まれてしまうために、<strong>天から与えられる住みかを上に着たいからです</strong>」（<a href="https://bibleox.com/ja/jp-ni/2kor/5/#L1,4">２コリ. 5:1,4</a>）</p></blockquote><hr><p>別の箇所、おそらく最も重要な箇所の一つで、使徒は、神と共にある生活へと目に見える仕方で移るために、できるだけ早く死にたいと書き、死を「利益」と呼んでいます。しかしもし使徒が死後に消え去るか眠りに落ちるのなら、彼は何も得ず、ただ（意識を）失うだけです。その場合、急いで死んで無活動へと移ることには意味がありません。地上の体のうちに生きて、宣べ伝え、教会を整え、神と交わり、教会を助ける（<strong><mark>できるだけ長く教会を離れない</mark></strong> — これは不死の魂についての教えに反対する人々がいつも無視する主要な考えです*）方が正しいでしょう。しかし使徒は、天で神と共にある生活へと移ることを知っているので、体のうちにある地上の生活からできるだけ早く解き放たれたいと願っているのです：</p><blockquote><p>「わたしにとって、生きるとはキリストであり、<strong>死ぬことは利益なのです</strong>。けれども、肉において生き続ければ、実り多い働きができ、どちらを選ぶべきか、わたしには分かりません。この二つのことの間で、板挟みの状態です。一方では、<strong>この世を去って、キリストと共にいたいと熱望しており、この方がはるかに望ましい</strong>。だが他方では、肉にとどまる方が、あなたがたのためにもっと必要です」（<a href="https://bibleox.com/ja/jp-ni/fil/1/#L21-24">フィリ. 1:21-24</a>）</p></blockquote><p>*死後の魂の存在を否定する人々は、たいてい示された注解の論点を無視して、こう言います。「<em>使徒は眠りの中で時がどれほど過ぎ去ったかに気づかず、すぐにキリストと共に復活の中で目覚めるのだ</em>」。しかし、もし使徒がすぐにキリストと共にある生活へと移るのではなく、無意識の無活動へと移るだけなら、急いで<strong>教会を離れる</strong>ことには意味がありません。使徒はまさにそこで、体にとどまる方が教会にとってもっと必要だと書いているのですから。</p><hr><p>体を離れれば主と共にいると使徒は信じており、それで再び、むしろ体を離れることを望んでいます。使徒は、体に住んでいるときも体を離れるときも、神に喜ばれることが大切だと指摘しています：</p><blockquote><p>「<strong>体を住みかとしているかぎり、主から離れていること</strong>も知っています。&lt;…&gt; わたしたちは、心強い。そして、<strong>体を離れて、主のもとに住むことをむしろ望んでいます</strong>。だから、体を住みかとしていても、体を離れているにしても、ひたすら主に喜ばれる者でありたい」（<a href="https://bibleox.com/ja/jp-ni/2kor/5/#L6,8-9">２コリ. 5:6,8-9</a>）</p></blockquote><p>使徒は神殿の中にいるように体の中にいますが（<a href="https://bibleox.com/ru/q/%D1%87%D0%B5%D0%BB%D0%BE%D0%B2%D0%B5%D0%BA-%D1%85%D1%80%D0%B0%D0%BC-%D0%91%D0%BE%D0%B6%D0%B8%D0%B9">人間は神の神殿</a>）、間もなく体を離れ、そこから出て行かなければなりません：</p><blockquote><p>「わたしは、<strong>自分がこの体を仮の宿としている間</strong>、あなたがたにこれらのことを思い出させて、奮起させるべきだと考えています。わたしたちの主イエス・キリストが示してくださったように、<strong>自分がこの仮の宿を間もなく離れなければならない</strong>ことを、わたしはよく承知しているからです」（<a href="https://bibleox.com/ja/jp-ni/2pet/1/#L13-14">２ペト. 1:13-14</a>）</p></blockquote><p>使徒は、体のままでも体を離れてでも、意識を持って天にいることができたと書いています：</p><blockquote><p>「わたしは、キリストに結ばれていた一人の人を知っていますが、その人は十四年前、第三の天にまで引き上げられたのです。<strong>体のままか、体を離れてかは知りません</strong>。神がご存じです」（<a href="https://bibleox.com/ja/jp-ni/2kor/12/#L2">２コリ. 12:2</a>）</p></blockquote><p>使徒は魂の永遠性を指し示しています：</p><blockquote><p>「だから、わたしたちは落胆しません。たとえ<strong>わたしたちの『外なる人』は衰えていくとしても、わたしたちの『内なる人』は日々新たにされていきます</strong>。&lt;…&gt; わたしたちは見えるものではなく、見えないものに目を注ぎます。見えるものは過ぎ去りますが、<strong>見えないものは永遠に存続するからです</strong>」（<a href="https://bibleox.com/ja/jp-ni/2kor/4/#L16,18">２コリ. 4:16,18</a>）</p></blockquote><h3>裁きを受けるのは、体の外ではなく<strong>体のうちに</strong>生きていた間に行ったことである</h3><p>神は、体のうちに生きていた間に行われた行いだけを裁かれます：</p><blockquote><p>「なぜなら、わたしたちは皆、キリストの裁きの座の前に立ち、善であれ悪であれ、めいめい<strong>体を住みかとしていたときに行ったこと</strong>に応じて、報いを受けねばならないからです」（<a href="https://bibleox.com/ja/jp-ni/2kor/5/#L10">２コリ. 5:10</a>）</p></blockquote><h3>旧約の言及</h3><p>人の死を、体だけでなく魂の消滅でもあると考える人々は、誤って考えています：</p><blockquote><p>「<strong>彼らはこう言い合うが、その考えは誤っている</strong>。『我々の一生は短く、労苦に満ちていて、人生の終わりには死に打ち勝つすべがない。我々の知るかぎり、陰府から戻って来た人はいない。我々は偶然に生まれ、死ねば、まるで存在しなかったかのようになる。鼻から出る息は煙にすぎず、人の考えは心臓の鼓動から出る火花にすぎない。<strong>それが消えると体は灰になり、魂も軽い空気のように消えうせる</strong>』」（<a href="https://bibleox.com/ja/jp-ni/prs/2/#L1-3">知. 2:1-3</a>）</p></blockquote><p>さらに：</p><blockquote><p>「<strong>よこしまな考えは人を神から遠ざけ</strong>、主の力は、試そうとする愚か者の罪深さを暴く」（<a href="https://bibleox.com/ja/jp-ni/prs/1/#L3">知. 1:3</a>）</p></blockquote><blockquote><p>「<strong>神に従う人の魂は神の手で守られ</strong>、もはやいかなる責め苦も受けることはない。<strong>愚か者たちの目には彼らは死んだ者と映り</strong>、この世からの旅立ちは災い、<strong>自分たちからの離別は破滅に見えた</strong>。<strong>ところが</strong><strong>彼らは平和のうちにいる</strong>」（<a href="https://bibleox.com/ja/jp-ni/prs/3/#L1-3">知. 3:1-3</a>）</p></blockquote><h2>死後の生を否定するサドカイ派への叱責</h2><p>ユダヤ人のすべての党派（ファリサイ派、サドカイ派、エッセネ派など）のうち、人は死後に消え去ると信じていたのは一つだけ、サドカイ派でした（<a href="https://bibleox.com/ja/jp-ni/act/23/#L8">使. 23:8</a>）。そして主は、彼らを思い違いと聖書を知らないことのゆえに厳しく叱責されます：</p><blockquote><p>「イエスはお答えになった。『あなたたちは<strong>聖書も神の力も知らないから</strong>、<strong>思い違いをしている</strong>』」（<a href="https://bibleox.com/ja/jp-ni/mf/22/#L29">マタ. 22:29</a>）</p></blockquote><blockquote><p>「<strong>神は死んだ者の神ではなく、生きている者の神なのだ</strong>。<strong>あなたたちは大変な思い違いをしている</strong>」（<a href="https://bibleox.com/ja/jp-ni/mk/12/#L27">マコ. 12:27</a>）</p></blockquote><h2>イエス・キリストの人間としての魂</h2><p>主イエス・キリストは、体の死後、魂において陰府に降られました：</p><blockquote><p>「あなたは<strong>わたしの魂を陰府に渡すことなく</strong>あなたの慈しみに生きる者に墓穴を見させず」（<a href="https://bibleox.com/ja/jp-ni/ps/16/#L10">詩. 16:10</a>）（<a href="https://bibleox.com/ja/jp-ni/act/2/#L27">使. 2:27</a>）</p></blockquote><blockquote><p>「そして、キリストの復活について前もって知り、『<strong>彼は陰府に捨てておかれず</strong>、その体は朽ち果てることがない』と語りました」（<a href="https://bibleox.com/ja/jp-ni/act/2/#L31">使. 2:31</a>）<em>（ビザンティン本文（多数派写本）では「<strong>彼の魂</strong>（ἡ ψυχὴ αὐτοῦ）は陰府に捨てておかれず、彼の肉は朽ち果てることがない」となっています。）</em></p></blockquote><p>陰府でキリストは、世界的な洪水の時からそこにいた霊（魂）たちに宣べ伝えられました：</p><blockquote><p>「キリストも、罪のためにただ一度苦しまれました。正しい方が、正しくない者たちのために苦しまれたのです。あなたがたを神のもとへ導くためです。<strong>キリストは、肉では死に渡されましたが、霊では生きる者とされたのです</strong>。そして、霊においてキリストは、<strong>捕らわれていた霊たちのところへ行って宣教されました</strong>。この霊たちは、<strong>ノアの時代に箱舟が作られていた間</strong>、神が忍耐して待っておられたのに従わなかった者です」（<a href="https://bibleox.com/ja/jp-ni/1pet/3/#L18-20">１ペト. 3:18-20</a>）</p><p>「彼らは、生きている者と死んだ者とを裁こうとしておられる方に、申し開きをしなければなりません。<strong>死んだ者にも福音が告げ知らされたのは</strong>、彼らが、人間の見方からすれば、肉において裁かれて死んだようでも、神との関係で、霊において生きるようになるためなのです」（<a href="https://bibleox.com/ja/jp-ni/1pet/4/#L5-6">１ペト. 4:5-6</a>）</p></blockquote><blockquote><p>「そこで、『高い所に昇るとき、捕らわれ人を連れて行き、人々に賜物を分け与えられた』と言われています。<strong>『昇った』というのですから、低い所、地上に降りておられたのではないでしょうか</strong>」（<a href="https://bibleox.com/ja/jp-ni/ef/4/#L8-9">エフェ. 4:8-9</a>）<em>（「低い所、地上に」は、ギリシア語原文では εἰς τὰ κατώτερα μέρη τῆς γῆς —「地の低い所に」です。ビザンティン本文（多数派写本）では「<strong>まず</strong>（πρῶτον）地の低い所に降りておられた」となっています。）</em></p></blockquote><p>結局、キリストは死者と生者の主です：</p><blockquote><p>「<strong><u>キリスト</u>が死に、そして生きたのは、<u>死んだ人</u>にも<u>生きている人</u>にも主となられるためです</strong>」（<a href="https://bibleox.com/ja/jp-ni/rim/14/#L9">ロマ. 14:9</a>）<em>（ビザンティン本文（多数派写本）では「死に、<strong>復活し</strong>、そして生きた」となっています。）</em></p></blockquote><h2>死後、天における義人たちの生</h2><p>キリストのために殺された人々の魂は天でキリストと共に生き、地上で起こっていることを知っています（彼らの血の復讐はまだなされていません）：</p><blockquote><p>「小羊が第五の封印を開いたとき、<strong>神の言葉と自分たちがたてた証しのために殺された人々の魂</strong>を、わたしは祭壇の下に見た。彼らは大声でこう叫んだ。<strong>『真実で聖なる主よ、いつまで裁きを行わず、地に住む者にわたしたちの血の復讐をなさらないのですか。』</strong>すると、<strong>その一人一人に、白い衣が与えられ</strong>、また、<strong>自分たちと同じように殺されようとしている兄弟であり</strong>、仲間の僕である者たちの<strong>数が満ちるまで</strong>、なお、しばらく静かに待つようにと告げられた」（<a href="https://bibleox.com/ja/jp-ni/otkr/6/#L9-11">黙. 6:9-11</a>）</p></blockquote><h2>キリストのための致命者たちは天に住んでいる</h2><blockquote><p>「兄弟たちは、小羊の血と<strong>自分たちの証しの言葉</strong>とで、彼に打ち勝った。<strong>彼らは、死に至るまで命を惜しまなかった</strong>。このゆえに、<strong>もろもろの天と、その中に住む者たちよ</strong>、喜べ。地と海とは不幸である。悪魔は怒りに燃えて、お前たちのところへ降って行った。残された時が少ないのを知ったからである」（<a href="https://bibleox.com/ja/jp-ni/otkr/12/#L11-12">黙. 12:11-12</a>）</p></blockquote><p>義人たちは天に住んでおり、地上に生きるわたしたちも、すでに今、天の勝利の教会、義人たちの霊に近づいています：</p><blockquote><p>「しかし、<strong>あなたがたが近づいたのは</strong>、シオンの山、生ける神の都、<strong>天のエルサレム</strong>、無数の天使たちの祝いの集まり、<strong>天に登録されている長子たちの集会</strong>、すべての人の審判者である神、<strong>完全なものとされた正しい人たちの霊</strong>」（<a href="https://bibleox.com/ja/jp-ni/evr/12/#L22-23">ヘブ. 12:22-23</a>）</p></blockquote><p>童貞を守った人々は、キリストの行かれる所へはどこへでも従って行きます：</p><blockquote><p>「彼らは、<strong>女に触れて身を汚したことのない者</strong>である。彼らは<strong>童貞</strong>だからである。この者たちは、<strong>小羊の行くところへは、どこへでも従って行く</strong>。この者たちは、神と小羊に献げられる初穂として、人々の中から贖われた者たちで、その口には偽りがなく、<strong>とがめられるところのない者たちである</strong>」（<a href="https://bibleox.com/ja/jp-ni/otkr/14/#L4-5">黙. 14:4-5</a>）</p></blockquote><p>死者たちは裁かれ、陰府はその中にいた死者を出します：</p><blockquote><p>「<strong>わたしはまた、死者たちが</strong>、大きな者も小さな者も、玉座の前に立っているのを見た。幾つかの書物が開かれたが、もう一つの書物も開かれた。それは命の書である。<strong>死者たちは</strong>、これらの書物に書かれていることに基づき、彼らの行いに応じて<strong>裁かれた</strong>。海は、その中にいた死者を外に出した。<strong>死と陰府も、その中にいた死者を出し</strong>、彼らはそれぞれ自分の行いに応じて裁かれた」（<a href="https://bibleox.com/ja/jp-ni/otkr/20/#L12-13">黙. 20:12-13</a>）</p></blockquote><h2>批判への応答</h2><h3>神は預言者モーセを復活させたのか</h3><p>正教徒は、死後の魂の意識ある存在を擁護するために、預言者モーセは死んだにもかかわらず（<a href="https://bibleox.com/ja/jp-ni/vtor/34/#L7">申. 34:7</a>; <a href="https://bibleox.com/ja/jp-ni/nav/1/#L2">ヨシュ. 1:2</a>）、現れてキリストと<strong>語り合っている</strong>という論拠を挙げます：</p><blockquote><p>「見ると、<strong><mark>モーセ</mark>とエリヤが<mark>現れ、イエスと語り合っていた</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/mf/17/#L3">マタ. 17:3</a>）</p></blockquote><p>正教会に反対する人々、特にアドヴェンティストは、これに答えて、それは神が預言者モーセを取り上げて復活させたからだと言います。彼らが引き合いに出すのは聖書ではなく、外典「モーセの昇天」です（エレン・ホワイトの言葉を直接引き合いに出すことはできないので）。</p><p>わたしたちは（そして彼らも）外典を権威ある文書とは認めません。しかし問題は、この外典の中にさえ、少なくとも現存する部分には、預言者モーセの復活についての言葉がないということです。反対に、そこではモーセに、自分は「<em>先祖たちの眠り</em>」へと去って行くという言葉が帰されています（<a href="https://azbyka.ru/otechnik/Biblia2/apokrificheskie-apokalipsisy/15#sel=15:41,15:57;27:1,27:7">出典</a>、ロシア語）。</p><p>さらに、預言者の復活は聖書に反します。死者の中から最初に生まれた方は、まさにキリストだからです：</p><blockquote><p>「しかし、実際、キリストは死者の中から復活し、<strong>眠りについた人たちの初穂となられました</strong>」（<a href="https://bibleox.com/ja/jp-ni/1kor/15/#L20">１コリ. 15:20</a>）</p></blockquote><p>またわたしたちは、人々のうちだれ一人（この言葉は人々に向けられています）天に上った者はなく、預言者たちのだれも天に上らなかったことを知っています：</p><blockquote><p>「<strong>天から降って来た者、すなわち人の子のほかには、天に上った者は<mark>だれもいない</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/in/3/#L13">ヨハ. 3:13</a>）</p></blockquote><blockquote><p>「兄弟たち、先祖ダビデについては、彼は死んで葬られ、その墓は今でもわたしたちのところにあると、はっきり言えます。&lt;…&gt; <strong>ダビデは天に昇りませんでした</strong>」（<a href="https://bibleox.com/ja/jp-ni/act/2/#L29,34">使. 2:29,34</a>）</p></blockquote><p>キリストの十字架のいけにえと復活の前には、すべての人が死後に陰府に降ったことについて、詳しく：</p><p><a href="https://bibleox.com/ru/ru/w/9VFT_%D0%94%D0%BE_%D0%B6%D0%B5%D1%80%D1%82%D0%B2%D1%8B_%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%BE%D0%B2%D0%BE%D0%B9_%D0%B2%D0%B5%D1%82%D1%85%D0%BE%D0%B7%D0%B0%D0%B2%D0%B5%D1%82%D0%BD%D1%8B%D0%B5_%D0%BF%D1%80%D0%B0%D0%B2%D0%B5%D0%B4%D0%BD%D0%B8%D0%BA%D0%B8_%D1%81%D1%85%D0%BE%D0%B4%D0%B8%D0%BB%D0%B8_%D0%B2_%D0%B0%D0%B4">キリストのいけにえの前、旧約の義人たちは陰府に降った</a></p><h3>魂の生についての教えは、「決して死ぬことはない」という悪魔の言葉を信じることなのか</h3><p>魂についての教えに反対する人々（アドヴェンティスト）は、正教徒を次のように非難します。神は「死ぬ」と言われ、悪魔は「死なない」と言った。したがって死後の魂の生を信じることは、「死なない」という悪魔の言葉を信じることだ、というのです。それに応じて、体の死後の魂の生を信じる人々は、悪魔の偽りを信じていると彼らに非難されます。</p><p>非難は声高ですが、この考えそのものには深刻な矛盾があり、文脈との関係にも問題があります。神は単に「死ぬ」と言われたのではなく、禁じられた木の実を食べるその日に死ぬと言われたのです：</p><blockquote><p>「主なる神は人に命じて言われた。『園のすべての木から取って食べなさい。<strong>ただし、善悪の知識の木からは、決して食べてはならない。<mark>食べると必ず死んでしまう</mark></strong>』」（<a href="https://bibleox.com/ja/jp-ni/gen/2/#L16-17">創. 2:16-17</a>）<em>（ヘブライ語原文では בְּיוֹם אֲכָלְךָ מִמֶּנּוּ מוֹת תָּמוּת —「<strong>それを食べるその日に</strong>、必ず死ぬ」です。）</em></p></blockquote><p>魂の生についての教えに反対する人々は、「死ぬ」という言葉を最も単純で直接的な仕方で、体の死と人のすべての生命活動の終わり、その存在（少なくとも意識ある存在）の終わりとして理解します。</p><p>人々がその実を食べた日に、そのような意味での死が起こったでしょうか。いいえ、アダムはずっと後、930歳で死にました（<a href="https://bibleox.com/ja/jp-ni/gen/5/#L5">創. 5:5</a>）。これは何を意味するでしょうか。神は別の死について語っておられたということです。そして悪魔はその別の死を否定したのです。</p><p>もしそうでないなら、神は人々が実を食べたその日に死ぬと言われたとき偽りを言われ、悪魔は彼らが死なないと言って真実を言ったことになってしまいます。実際、粗雑な肉体的な意味での死は、その日には起こらなかったからです。しかし、神（道であり、真理であり、命である方 — <a href="https://bibleox.com/ja/jp-ni/in/14/#L6">ヨハ. 14:6</a>）が偽りを言い、悪魔（偽り者であり、偽りの父である者 — <a href="https://bibleox.com/ja/jp-ni/in/8/#L44">ヨハ. 8:44</a>）が真実を言ったなどとは、決して認めることはできません。しかし、魂についての教えに反対する人々の解釈は、まさにこの結論に至るのです。</p><p>この袋小路から抜け出すために、彼らは必ず、句の一部を寓意的に解釈し直さなければなりません：</p><ul><li><p>死そのものは文字どおりに理解し、</p></li><li><p>しかし死の日は文字どおりには理解しない。</p></li></ul><p>正教会の解釈には、このような欠点はありません：</p><ul><li><p>死の日は文字どおりに理解され、</p></li><li><p>死そのものも文字どおりに理解されます。ただし、人の霊的な状態に関してです。とはいえ、体の状態にも変化が起こりました。少なくとも、人々は自分たちが裸であることを見ました。</p></li></ul><p>わたしたちの始祖は本当にその日に死にました。しかしこの死は消滅ではなく、神から離れた状態であり、罪深いすべての人がその状態の中にあります。キリストなる神御自身が、神なしの生の状態を死と呼んでおられます：</p><blockquote><p>「ほかに、弟子の一人がイエスに、『主よ、まず、父を葬りに行かせてください』と言った。イエスは言われた。『わたしに従いなさい。<strong><mark>死んでいる者たちに</mark>、自分たちの死者を葬らせなさい</strong>』」（<a href="https://bibleox.com/ja/jp-ni/mf/8/#L21-22">マタ. 8:21-22</a>）</p></blockquote><blockquote><p>「はっきり言っておく。わたしの言葉を聞いて、わたしをお遣わしになった方を信じる者は、永遠の命を得、また、裁かれることなく、<strong><mark>死から</mark>命へと移っている</strong>」（<a href="https://bibleox.com/ja/jp-ni/in/5/#L24">ヨハ. 5:24</a>）</p></blockquote><blockquote><p>「サルディスにある教会の天使にこう書き送れ。『神の七つの霊と七つの星とを持っている方が、次のように言われる。「わたしはあなたの行いを知っている。<strong><mark>あなたが生きているとは名ばかりで、実は死んでいる</mark></strong>」』」（<a href="https://bibleox.com/ja/jp-ni/otkr/3/#L1">黙. 3:1</a>）</p></blockquote><p>使徒たちも同じことを言っています。人々は死んだ者として生きていました：</p><blockquote><p>「さて、あなたがたは、以前は<strong><mark>自分の過ちと罪のために死んでいたのです</mark></strong>。この世を支配する者、かの空中に勢力を持つ者、すなわち、不従順な者たちの内に今も働く霊に従い、<strong><mark>過ちと罪を犯して歩んでいました</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/ef/2/#L1-2">エフェ. 2:1-2</a>）</p></blockquote><blockquote><p>「身寄りがなく独り暮らしのやもめは、神に希望を置き、昼も夜も願いと祈りを続けますが、放縦な生活をしているやもめは、<strong><mark>生きていても死んでいるのと同然です</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/1tim/5/#L5-6">１テモ. 5:5-6</a>）</p></blockquote><p>つまり、死んだ状態は堕落の直後にアダムとエバに臨んだのです。それは神なしの内的な生の状態です。そしてこの意味で、悪魔は彼らが死なないと言ったとき偽りを言ったのです。彼らは神が言われたとおり、その日に死にました。</p><p>このように、これらの非難は自己矛盾しており、聖書の文脈から切り離されているので、真剣なものではありません。</p>

