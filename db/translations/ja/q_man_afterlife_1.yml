    title: 地獄 — 苦しみには終わりがない
    meta_desc: 地獄の苦しみに終わりがないことについての聖書の引用
    menu: { parent: "人間/死後", title: "苦しみには終わりがない", priority: 5 }
    body: |-
      <h2>定義</h2><p>地獄 — キリストの栄光の再臨と最後の審判の後に、罪に定められた罪人たちがとどまる場所として。最後の審判の後には、この運命を変えることはもはやできません。罪に定められた者たちの苦しみも、義人たちの至福も、等しく永遠に続きます。</p><h2>地獄の苦しみには終わりがない</h2><blockquote><p>「その苦しみの煙は、<strong>世々限りなく</strong>立ち上り、獣とその像を拝む者たち、また、だれでも獣の名の刻印を受ける者は、<strong>昼も夜も安らぐことはない</strong>」（<a href="https://bibleox.com/ja/jp-ni/otkr/14/#L11">黙. 14:11</a>）</p></blockquote><blockquote><p>「両方の目がそろったまま地獄に投げ込まれるよりは、一つの目になっても神の国に入る方がよい。<strong>地獄では蛆が尽きることも、火が消えることもない</strong>」（<a href="https://bibleox.com/ja/jp-ni/mk/9/#L47-48">マコ. 9:47-48</a>）</p></blockquote><blockquote><p>「そして彼らを惑わした悪魔は、火と硫黄の池に投げ込まれた。そこにはあの獣と偽預言者がいる。そして、<strong>この者どもは昼も夜も世々限りなく責めさいなまれる</strong>」（<a href="https://bibleox.com/ja/jp-ni/otkr/20/#L10">黙. 20:10</a>）</p></blockquote><blockquote><p>「多くの者が地の塵の中の眠りから目覚める。ある者は永遠の生命に入りある者は<strong>永久に続く恥と憎悪の的となる</strong>」（<a href="https://bibleox.com/ja/jp-ni/dan/12/#L2">ダニ. 12:2</a>）</p></blockquote><blockquote><p>「こうして、<strong>この者どもは永遠の罰を受け</strong>、正しい人たちは永遠の命にあずかるのである」（<a href="https://bibleox.com/ja/jp-ni/mf/25/#L46">マタ. 25:46</a>）</p></blockquote><blockquote><p>「しかし、聖霊を冒瀆する者は<strong>永遠に赦されず</strong>、<strong>永遠に罪の責めを負う</strong>」（<a href="https://bibleox.com/ja/jp-ni/mk/3/#L29">マコ. 3:29</a>）</p></blockquote><blockquote><p>「主イエスは、燃え盛る火の中を来られます。そして神を認めない者や、わたしたちの主イエスの福音に聞き従わない者に、罰をお与えになります。彼らは、主の面前から退けられ、その栄光に輝く力から切り離されて、<strong>永遠の破滅という刑罰を受けるでしょう</strong>」（<a href="https://bibleox.com/ja/jp-ni/2sol/1/#L8-9">２テサ. 1:8-9</a>）</p></blockquote><blockquote><p>「この者たちは、干上がった泉、嵐に吹き払われる霧であって、<strong>彼らには深い暗闇が用意されているのです</strong>」（<a href="https://bibleox.com/ja/jp-ni/2pet/2/#L17">２ペト. 2:17</a>）<em>（ビザンティン本文（多数派写本）では、この節の終わりに εἰς αἰῶνα —「<strong>永遠に</strong>」という言葉があります。）</em></p></blockquote><blockquote><p>「種々の洗礼についての<strong>教え</strong>、手を置く儀式、死者の復活、<strong>永遠の審判</strong>など」（<a href="https://bibleox.com/ja/jp-ni/evr/6/#L1-2">ヘブ. 6:1-2</a>）</p></blockquote><blockquote><p>「神は正しいことを行われます。あなたがたを苦しめている者には、苦しみをもって報い、また、苦しみを受けているあなたがたには、わたしたちと共に休息をもって報いてくださるのです。主イエスが力強い天使たちを率いて天から来られるとき、神はこの報いを実現なさいます。主イエスは、燃え盛る火の中を来られます。そして神を認めない者や、わたしたちの主イエスの福音に聞き従わない者に、罰をお与えになります。彼らは、主の面前から退けられ、その栄光に輝く力から切り離されて、<strong>永遠の破滅という刑罰を受けるでしょう</strong>」（<a href="https://bibleox.com/ja/jp-ni/2sol/1/#L6-9">２テサ. 1:6-9</a>）</p></blockquote><h2>神の御心を知らなかった者も罰を受ける</h2><blockquote><p>「主人の思いを知りながら何も準備せず、あるいは主人の思いどおりにしなかった僕は、ひどく鞭打たれる。しかし、<strong>知らずにいて鞭打たれるようなことをした者は、打たれても少しで済む</strong>。すべて多く与えられた者は、多く求められ、多く任された者は、更に多く要求される」（<a href="https://bibleox.com/ja/jp-ni/lk/12/#L47-48">ルカ. 12:47-48</a>）</p></blockquote><h2>批判への応答</h2><h3>地獄の終わりのない苦しみについての教えは、人々をキリストから遠ざけるのか</h3><p>これは論拠ではありません。罪人は一般に、罪に対する罰について聞くのを好みません。では、罪に対して至福を約束すべきでしょうか。同じように、罪を愛する人は、次のような教えを聞くのを好みません：</p><ul><li><p>悔い改めについて、</p></li><li><p>罪を捨てることについて、</p></li><li><p>生活を改めることについて、</p></li><li><p>キリストだけが唯一の救い主であり、ほかの道は救いに至らないことについて（<a href="https://bibleox.com/ja/jp-ni/act/4/#L12">使. 4:12</a>）、</p></li><li><p>敵を愛すること、復讐を捨てること、負債を赦すこと、自分を憎む者に善を行うことについて（<a href="https://bibleox.com/ja/jp-ni/mf/5/#L44">マタ. 5:44</a>; <a href="https://bibleox.com/ja/jp-ni/lk/6/#L27">ルカ. 6:27</a>; <a href="https://bibleox.com/ja/jp-ni/lk/6/#L35">ルカ. 6:35</a>）、</p></li><li><p>富の追求を捨てることについて（<a href="https://bibleox.com/ja/jp-ni/mf/19/#L24">マタ. 19:24</a>）、</p></li><li><p>一夫一婦制について（<a href="https://bibleox.com/ja/jp-ni/mf/19/#L10">マタ. 19:10</a>）。</p></li></ul><p>しかしもちろん、これは、これらすべてを捨てるべきだということではありません。ではなぜそうではないのでしょうか。それが真理だからです。もし人がこれらの言葉に耳を傾けないなら、罰についての警告は本当に成就します。それはむなしい言葉ではなかったのです。わたしたちは、そのようなことがその人に起こらないように警告するのです。永遠の苦しみについても同じです。もしそれが真の教えであるなら、罪人にとって聞きたくないことを取り除いて真理を修正する必要がどこにあるでしょうか。</p><blockquote><p>「だれも健全な教えを聞こうとしない時が来ます。そのとき、人々は自分に都合の良いことを聞こうと、<strong>好き勝手に教師たちを寄せ集め</strong>」（<a href="https://bibleox.com/ja/jp-ni/2tim/4/#L3">２テモ. 4:3</a>）</p></blockquote><p>教えるときには、人々が聞きたいことからではなく、真理から出発すべきです：</p><blockquote><p>「あなたがたに手紙を書いて、<strong>聖なる者たちに一度伝えられた信仰のために戦うことを</strong>、勧めなければならないと思ったからです」（<a href="https://bibleox.com/ja/jp-ni/iud/1/#L3">ユダ. 1:3</a>）</p></blockquote>
