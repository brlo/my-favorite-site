      <h3>関連資料：</h3><ol><li><p><a href="https://azbyka.ru/otechnik/Oleg_Stenyaev/ekzamen-bez-prava-na-peresdachu-ili-kak-projti-mytarstva/#0_6">https://azbyka.ru/otechnik/Oleg_Stenyaev/ekzamen-bez-prava-na-peresdachu-ili-kak-projti-mytarstva/#0_6</a>（ロシア語）</p></li></ol>
    body: |-
      <h2>死後の試練（関所）について簡単に</h2><p><a href="https://azbyka.ru/mytarstva">死後の試練（関所）</a>（ロシア語）とは、人の死後、堕落した天使たちがその魂を手に入れようとするという正教会の教えです。こうして魂は恐ろしい試練を受け、その中で神の天使たちは義人の魂を守り、神のもとへ導こうと努めます。この教えは象徴的、比喩的に、いくつかの関所として表現され、その一つ一つで魂はあれこれの情欲について試されます。この場合、天使たちは神の正義を成し遂げる器です。</p><h2>邪悪な日によく抵抗し、すべてを成し遂げて、しっかりと立つ</h2><p>悪魔は空中に勢力を持つ者です：</p><blockquote><p>「さて、あなたがたは、以前は自分の過ちと罪のために死んでいたのです。この世を支配する者、<strong><mark>かの空中に勢力を持つ者</mark></strong>、すなわち、不従順な者たちの内に今も働く霊に従い、過ちと罪を犯して歩んでいました」（<a href="https://bibleox.com/ja/jp-ni/ef/2/#L1-2">エフェ. 2:1-2</a>）</p></blockquote><p>邪悪な日（死の日）にすべてに打ち勝つために、備えなければなりません：</p><blockquote><p>「<strong><mark>悪魔の策略に対抗して立つことができるように、神の武具を身に着けなさい</mark></strong>。わたしたちの戦いは、血肉を相手にするものではなく、支配と権威、暗闇の世界の支配者、<strong><mark>天にいる悪の諸霊を相手にするものなのです</mark></strong>。だから、<strong><mark>邪悪な日によく抵抗し</mark></strong>、<strong><mark>すべてを成し遂げて、しっかりと立つことができるように</mark></strong>、神の武具を身に着けなさい」（<a href="https://bibleox.com/ja/jp-ni/ef/6/#L11-13">エフェ. 6:11-13</a>）</p></blockquote><h2>神の許しなしに悪魔は義人に触れることができず、義人を手に入れる許しを得る方法を探している</h2><p>悪魔は、人を手に入れるために、どのようにその人を訴えたり中傷したりするかを探しています：</p><blockquote><p>「サタンは答えた。『皮には皮を、と申します。まして命のためには全財産を差し出すものです。手を伸ばして彼の骨と肉に触れてごらんなさい。面と向かってあなたを呪うにちがいありません。』主はサタンに言われた。『<strong><mark>それでは、彼をお前のいいようにするがよい。ただし、命だけは奪うな</mark></strong>』」（<a href="https://bibleox.com/ja/jp-ni/iov/2/#L4-6">ヨブ. 2:4-6</a>）<em>（ギリシア語 μόνον τὴν ψυχὴν αὐτοῦ διαφύλαξον —「ただ彼の魂を守れ」、ヘブライ語 נַפְשׁוֹ —「彼の魂」）</em></p></blockquote><blockquote><p>「大天使ミカエルは、<strong><mark>モーセの遺体のことで悪魔と言い争ったとき</mark></strong>、あえてののしって相手を裁こうとはせず、『主がお前を懲らしめてくださるように』と言いました」（<a href="https://bibleox.com/ja/jp-ni/iud/1/#L9">ユダ. 1:9</a>）</p></blockquote><h2>悪魔はいつも、だれを食い尽くそうかと探している</h2><blockquote><p>「身を慎んで目を覚ましていなさい。<strong>あなたがたの敵である悪魔が、ほえたける獅子のように、だれかを食い尽くそうと探し回っています</strong>」（<a href="https://bibleox.com/ja/jp-ni/1pet/5/#L8">１ペト. 5:8</a>）</p></blockquote><h2>天使たちは救いを受け継ぐ人々に仕えるために遣わされる</h2><blockquote><p>「神は、かつて天使のだれに向かって、『わたしの右に座っていなさい…』と言われたことがあるでしょうか。&lt;…&gt; <strong>天使たちは皆、奉仕する霊であって、救いを受け継ぐことになっている人々に仕えるために、遣わされたのではなかったですか</strong>」（<a href="https://bibleox.com/ja/jp-ni/evr/1/#L13-14">ヘブ. 1:13-14</a>）</p></blockquote><h2>天使たちは死後、義人の魂を「運ぶ」</h2><p>魂は、体から離れた後、移動します。魂は、将来住む場所への道をたどらなければなりません。</p><p>天使たちは義人ラザロの魂を世話しましたが、金持ちについてはそうは言われていません：</p><blockquote><p>「ある金持ちがいた。いつも紫の衣や柔らかい麻布を着て、毎日ぜいたくに遊び暮らしていた。この金持ちの門前に、ラザロというできものだらけの貧しい人が横たわり、その食卓から落ちる物で腹を満たしたいものだと思っていた。犬もやって来ては、そのできものをなめた。やがて、<strong><mark>この貧しい人は死んで、天使たちによって</mark></strong>宴席にいるアブラハムのすぐそばに<strong><mark>連れて行かれた</mark></strong>。<strong>金持ちも死んで葬られた</strong>。そして、<strong>金持ちは陰府でさいなまれながら</strong>目を上げると、宴席でアブラハムとそのすぐそばにいるラザロとが、はるかかなたに見えた。そこで、大声で言った。『父アブラハムよ、わたしを憐れんでください。ラザロをよこして、指先を水に浸し、わたしの舌を冷やさせてください。わたしはこの炎の中でもだえ苦しんでいます。』しかし、アブラハムは言った。『子よ、思い出してみるがよい。<strong>お前は生きている間に良いものをもらっていたが、ラザロは反対に悪いものをもらっていた。今は、ここで彼は慰められ、お前はもだえ苦しむのだ</strong>。そればかりか、わたしたちとお前たちの間には大きな淵があって、ここからお前たちの方へ渡ろうとしてもできないし、そこからわたしたちの方に越えて来ることもできない』」（<a href="https://bibleox.com/ja/jp-ni/lk/16/#L19-26">ルカ. 16:19-26</a>）<em>（「宴席にいるアブラハムのすぐそば」は、ギリシア語原文では εἰς τὸν κόλπον Ἀβραάμ —「アブラハムのふところに」です。）</em></p></blockquote><p>罪深い魂は突然取り去られます：</p><blockquote><p>「こう自分に言ってやるのだ。『さあ、これから先何年も生きて行くだけの蓄えができたぞ。ひと休みして、食べたり飲んだりして楽しめ』と。しかし神は、『<strong><mark>愚かな者よ、今夜、お前の命は取り上げられる</mark></strong>。お前が用意した物は、いったいだれのものになるのか』と言われた。<strong>自分のために富を積んでも、神の前に豊かにならない者はこのとおりだ</strong>」（<a href="https://bibleox.com/ja/jp-ni/lk/12/#L19-21">ルカ. 12:19-21</a>）<em>（「命」は、ギリシア語原文では ψυχή —「魂」です。直訳では「今夜、お前の魂はお前から取り立てられる」。）</em></p></blockquote><h2>死の時に悪魔はキリストのもとに来るが、キリストを訴えるものを何も持っていない</h2><p>死の前日、キリストは悪魔が近づいていることを語られますが、悪魔はキリストの内に自分のものを何も持たず、キリストを罪で訴えることができません：</p><blockquote><p>「もはや、あなたがたと多くを語るまい。<strong><mark>世の支配者が来るからである。だが、彼はわたしをどうすることもできない</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/in/14/#L30">ヨハ. 14:30</a>）<em>（ギリシア語原文では ἐν ἐμοὶ οὐκ ἔχει οὐδέν —「彼はわたしの内に何も持っていない」です。）</em></p></blockquote><p>しかしほかの人々についてはそうではありません：</p><blockquote><p>「<strong><mark>罪を犯す者は悪魔に属します</mark></strong>。悪魔は初めから罪を犯しているからです」（<a href="https://bibleox.com/ja/jp-ni/1in/3/#L8">１ヨハ. 3:8</a>）</p></blockquote><h2>キリストは雲に乗り、空中を通って天に上られた</h2><blockquote><p>「こう話し終わると、<strong><mark>イエスは彼らが見ているうちに天に上げられたが、雲に覆われて彼らの目から見えなくなった</mark></strong>。<strong><mark>イエスが離れ去って行かれるとき</mark></strong>、彼らは天を見つめていた。すると、白い服を着た二人の人がそばに立って」（<a href="https://bibleox.com/ja/jp-ni/act/1/#L9-10">使. 1:9-10</a>）</p></blockquote><h2>同じようにキリストは再び来られる</h2><blockquote><p>「しかし、わたしたちの本国は天にあります。<strong><mark>そこから主イエス・キリストが救い主として来られるのを、わたしたちは待っています</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/fil/3/#L20">フィリ. 3:20</a>）</p></blockquote><blockquote><p>「言った。『ガリラヤの人たち、なぜ天を見上げて立っているのか。<strong><mark>あなたがたから離れて天に上げられたイエスは、天に行かれるのをあなたがたが見たのと同じ有様で、またおいでになる</mark></strong>』」（<a href="https://bibleox.com/ja/jp-ni/act/1/#L11">使. 1:11</a>）</p></blockquote>

  - src: ад
    path: Hl3d_地獄
    title: 地獄（陰府）
    meta_desc: 地獄、ゲヘナ、火の池、永遠の火、外の暗闇、牢。聖書では、これらの言葉はたいてい苦しみの場所を意味します。この場所はさまざまな言葉で呼ばれることがありますが、その本質は変わらず、苦しみの場所であり続けます。
    menu: { parent: "人間/死後", title: "地獄", priority: 3 }
    body: |-
      <h2>定義</h2><p>地獄はさまざまに理解することができます。</p><ol><li><p>陰府（ハデス） — 全体的な復活と最後の審判まで、死者の魂がとどまる場所として。</p></li><li><p>地獄（ゲヘナ） — キリストの栄光の再臨、全体的な復活、最後の審判の後に、復活した罪に定められた罪人たち（すなわち、その魂と体が共に）がとどまる場所として。最後の審判の後には、この運命を変えることはもはやできません。罪に定められた者たちの苦しみも、義人たちの至福も、等しく永遠に続きます。</p></li></ol><h2>地獄、ゲヘナ、火の池、永遠の火、外の暗闇、牢 — 苦しみの場所</h2><p>聖書では、地獄はたいてい苦しみの場所を意味します。この場所はさまざまな言葉で呼ばれることがありますが、その本質は変わらず、苦しみの場所であり続けます。地獄では人々は苦しめられます：</p><blockquote><p>「だが、御国の子らは、<strong>外の暗闇に追い出される</strong>。そこで泣きわめいて歯ぎしりするだろう」（<a href="https://bibleox.com/ja/jp-ni/mf/8/#L12">マタ. 8:12</a>）</p></blockquote><blockquote><p>「王は側近の者たちに言った。『この男の手足を縛って、<strong>外の暗闇にほうり出せ。そこで泣きわめいて歯ぎしりするだろう</strong>』」（<a href="https://bibleox.com/ja/jp-ni/mf/22/#L13">マタ. 22:13</a>）</p></blockquote><blockquote><p>「<strong>この役に立たない僕を外の暗闇に追い出せ。そこで泣きわめいて歯ぎしりするだろう</strong>」（<a href="https://bibleox.com/ja/jp-ni/mf/25/#L30">マタ. 25:30</a>）</p></blockquote><p>キリスト御自身が、審判者として、だれがどこへ行くかを決められます：</p><blockquote><p>「それから、王は左側にいる人たちにも言う。『<strong>呪われた者ども、わたしから離れ去り、悪魔とその手下のために用意してある永遠の火に入れ</strong>』」（<a href="https://bibleox.com/ja/jp-ni/mf/25/#L41">マタ. 25:41</a>）</p></blockquote><blockquote><p>「人々を警戒しなさい。あなたがたは地方法院に引き渡され、会堂で鞭打たれるからである。&lt;…&gt; 体は殺しても、魂を殺すことのできない者どもを恐れるな。<strong>むしろ、魂も体も地獄で滅ぼすことのできる方を恐れなさい</strong>。&lt;…&gt; しかし、人々の前でわたしを知らないと言う者は、<strong>わたしも</strong>天の父の前で、その人を<strong>知らないと言う</strong>。わたしが来たのは地上に平和をもたらすためだ、と思ってはならない。平和ではなく、剣をもたらすために来たのだ。&lt;…&gt; また、<strong>自分の十字架を担ってわたしに従わない者は、わたしにふさわしくない</strong>」（<a href="https://bibleox.com/ja/jp-ni/mf/10/#L17,28,33-34,38">マタ. 10:17,28,33-34,38</a>）<em>（「地獄」は、ギリシア語原文では γέεννα —「ゲヘナ」です。）</em></p></blockquote><p>人は死後、新しい家へ行きます。そしてこの出来事は泣くに値します：</p><blockquote><p>「人は<strong>永遠の家</strong>へ去り、泣き手は町を巡る」（<a href="https://bibleox.com/ja/jp-ni/ekl/12/#L5">コヘ. 12:5</a>）</p></blockquote><p>死後、人には裁きが待っています：</p><blockquote><p>「また、人間には<strong>ただ一度死ぬことと、その後に裁きを受けることが定まっている</strong>ように」（<a href="https://bibleox.com/ja/jp-ni/evr/9/#L27">ヘブ. 9:27</a>）</p></blockquote><p>陰府では、その住人たちに意識ある存在があります。バビロンの王を、陰府のすべての住人が迎えました：</p><blockquote><p>「そのとき、あなたはバビロンの王に対して、この嘲りの歌をうたう。ああ、虐げる者は滅びその抑圧は終わった。&lt;…&gt; <strong>地下では、陰府が騒ぎを起こすお前が来るのを迎えて</strong>。そして、亡霊たちを呼び覚ます地上では、すべてつわものであった者らを。また、その王座から立ち上がらせる諸国の王であった者らを皆。<strong>彼らはこぞってお前を迎え、そして言う。『お前も我々のように無力にされた</strong>。お前も我々と同じようになった』」（<a href="https://bibleox.com/ja/jp-ni/is/14/#L4,9-10">イザ. 14:4,9-10</a>）</p></blockquote><p>主は、体の死後、世界的な洪水の時からそこにいた霊たちに宣べ伝えるために、陰府に降られました：</p><blockquote><p>「キリストも、罪のためにただ一度苦しまれました。正しい方が、正しくない者たちのために苦しまれたのです。あなたがたを神のもとへ導くためです。<strong>キリストは、肉では死に渡されましたが、霊では生きる者とされたのです</strong>。そして、霊においてキリストは、<strong>捕らわれていた霊たちのところへ行って宣教されました</strong>。この霊たちは、<strong>ノアの時代に箱舟が作られていた間</strong>、神が忍耐して待っておられたのに従わなかった者です」（<a href="https://bibleox.com/ja/jp-ni/1pet/3/#L18-20">１ペト. 3:18-20</a>）</p></blockquote><blockquote><p>「そこで、『高い所に昇るとき、捕らわれ人を連れて行き、人々に賜物を分け与えられた』と言われています。<strong>『昇った』というのですから、低い所、地上に降りておられたのではないでしょうか</strong>」（<a href="https://bibleox.com/ja/jp-ni/ef/4/#L8-9">エフェ. 4:8-9</a>）<em>（「低い所、地上に」は、ギリシア語原文では εἰς τὰ κατώτερα μέρη τῆς γῆς —「地の低い所に」です。ビザンティン本文（多数派写本）では「<strong>まず</strong>（πρῶτον）地の低い所に降りておられた」となっています。）</em></p></blockquote><p>キリストの魂は陰府に捨てておかれませんでした。<u>体</u>が地（墓）に捨てておかれなかったのではなく、<u>魂</u>が陰府に捨てておかれなかったのです：</p><blockquote><p>「そして、キリストの復活について前もって知り、『<strong>彼は陰府に捨てておかれず</strong>、その体は朽ち果てることがない』と語りました」（<a href="https://bibleox.com/ja/jp-ni/act/2/#L31">使. 2:31</a>）<em>（ビザンティン本文（多数派写本）では「<strong>彼の魂</strong>（ἡ ψυχὴ αὐτοῦ）は陰府に捨てておかれず、彼の肉は朽ち果てることがない」となっています。）</em></p></blockquote><p>死者たちは見られ、死者たちは裁かれ、陰府は死者を出します：</p><blockquote><p>「<strong>わたしはまた、死者たちが</strong>、大きな者も小さな者も、玉座の前に立っているのを見た。幾つかの書物が開かれたが、もう一つの書物も開かれた。それは命の書である。<strong>死者たちは</strong>、これらの書物に書かれていることに基づき、彼らの行いに応じて<strong>裁かれた</strong>。海は、その中にいた死者を外に出した。<strong>死と陰府も、その中にいた死者を出し</strong>、彼らはそれぞれ自分の行いに応じて裁かれた」（<a href="https://bibleox.com/ja/jp-ni/otkr/20/#L12-13">黙. 20:12-13</a>）</p></blockquote>

  - src: ад-бесконечность-мучений
