    title: アンティオキアのイグナティオス（テオフォロス）、1世紀
    title_sub: 致命者（35年頃〜107年）、アンティオキアの主教
    menu: { title: "アンティオキアのイグナティオス、致命者（〜35-107）" }
    meta_desc: アンティオキアの聖イグナティオス（テオフォロス、神を担う者）の生涯、七つの手紙、そしてその手紙に表れた古代教会の信仰。
    body: |-
      <p>イグナティオスの著作をギリシア語原文で読むには<a href="https://bibleox.com/ja/grc/w/Ιγνάτιος_Θεοφόρος_Αντιοχείας">こちら</a>。ほかの言語への切り替えは、著作の一覧の上でもできます。</p><p><strong>記憶日</strong>：12月20日（新暦1月2日）、1月29日（新暦2月11日）</p><h2>生涯</h2><p>イグナティオスの生涯について知られていることは多くありません。キリストが腕に抱いて祝福された幼子（<a href="https://bibleox.com/ja/jp-ni/mf/18/#L2-5">マタ. 18:2-5</a>）こそイグナティオスであったという言い伝えがありますが、多くの研究者はこれを後代の伝説と考えています。</p><p>手紙の文体から、彼をシリア人であったと考える人もいます。明らかなのは、彼が非ユダヤ人出身の、あるいは少なくともユダヤ教の文化の中で育ったのではない、最初期のキリスト教著作家の一人であったことです。カイサリアのエウセビオスの『教会史』によれば、彼はトラヤヌス帝の治世にアンティオキアで捕らえられ、処刑のためにローマへ送られました。その道中、彼は通過した町々の教会共同体（エフェソ、マグネシア、トラレス、フィラデルフィア、スミルナ、ローマ）に七通の手紙を書き、そのうちの<a href="https://bibleox.com/ja/ja/w/Ig1P_ポリュカルポスへの手紙">一通</a>はスミルナの主教ポリュカルポスに宛てたものです。ローマに着くと、107年12月20日、彼は獅子に投げ与えられて殉教しました。</p><p>ポリュカルポスは、イグナティオスからの手紙について次のように書いています。</p><blockquote><p>「あなたがたもイグナティオスも、<strong>私に手紙で</strong>、もしだれかがシリアへ行くなら、あなたがたの手紙もそこへ届けてほしいと<strong>頼んできました</strong>」（<a href="https://bibleox.com/ja/en/w/Plk_Ph#HH-13">ポリュカルポス『フィリピの信徒への手紙』13章（英語）</a>）</p></blockquote><p>ポリュカルポスはイグナティオスの手紙と、彼について知られていることを集め、それを書き写して広めました。</p><blockquote><p>「<strong>イグナティオスが私たちに送ってきた手紙と、私たちの手もとにあるほかの手紙とを、あなたがたの求めに応じて送ります</strong>。それらはこの手紙に添えてあります。あなたがたはそこから大きな益を受けることができるでしょう。そこには信仰と忍耐と、私たちの主にかなうあらゆる教えがあるからです。<strong>イグナティオス自身と、彼と共にいる人々について確かなことを知ったら、私たちに知らせてください</strong>」（<a href="https://bibleox.com/ja/en/w/Plk_Ph#HH-13">ポリュカルポス『フィリピの信徒への手紙』13章（英語）</a>）</p></blockquote><p>カイサリアのエウセビオス（3–4世紀）もイグナティオスについて詳しく書いており、その七通の手紙を挙げて、一部を「そのまま」引用しています。</p><blockquote><p>5. こうして彼は、ポリュカルポスのいたスミルナに滞在していたとき、一通の手紙を<strong>エフェソ</strong>の教会に書き、その牧者オネシモに言及しました。もう一通はマイアンドロス河畔の<strong>マグネシア</strong>の教会に宛てたもので、そこでは主教ダマスに言及しています。さらに<strong>トラレス</strong>の教会にも書き、そこを治めていたのはポリュビオスであったと記しています。</p><p>6. これらに加えて、彼は<strong>ローマ</strong>の教会にも書き、自分のために執り成しをして、待ち望んでいる殉教の希望を奪わないでほしいと願っています。今述べたことの証拠として、その手紙からごく短い部分を引用しておくのがよいでしょう。彼は文字どおり次のように書いています。</p><p>〈手紙の大部分を引用〉</p><p>10. 彼は以上の教会に、前述の町から書き送りました。スミルナを離れてからは、トロアスから<strong>フィラデルフィア</strong>の人々と、<strong>スミルナ</strong>の教会、とりわけその教会を指導していた<strong>ポリュカルポス</strong>に書き送りました。彼はポリュカルポスを使徒的な人物とよく知っていたので、まことの善い牧者として、アンティオキアの自分の群れを彼に託し、熱心に配慮してくれるよう求めています。</p><p>11. 同じ人はスミルナの人々に書き送る中で、キリストについて、どこから得たのかは知りませんが、次のような言葉を述べています。「私は、この方が復活の後にも肉のうちにおられたことを知っており、またそう信じています。この方がペトロと共にいた人々のところに来られたとき、彼らにこう言われました。『わたしに触れてよく見なさい。わたしが体のない悪霊ではないことが分かるだろう』。すると彼らはすぐにこの方に触れて、信じました」（『スミルナの教会への手紙』<a href="https://bibleox.com/ja/ja/w/Ig1S_スミルナの教会への手紙#HH-3">3:1-2</a>）。</p></blockquote><p>（<a href="https://bibleox.com/ja/en/w/eusebius-the-church-history-3#HH-Ignatius-and-His-Epistles">エウセビオス『教会史』3巻36章（英語）</a>）</p><p>エウセビオスはさらに、失われたリヨンのエイレナイオス（2世紀）の文書から一節を引いています。そこでエイレナイオスは、イグナティオスのローマの教会への手紙を引用しています。</p><blockquote><p>12. <strong>エイレナイオスも</strong>彼の殉教を知っており、<strong>その手紙に言及して</strong>次のように言っています。「神への証しのゆえに獣に定められた私たちの一人が［<strong>ローマの教会への手紙で</strong>］言ったように、『私は神の小麦であり、獣の歯にひかれて、神の清いパンとなる』[1]」。</p><p>13. ポリュカルポスも、彼の名で伝えられているフィリピの信徒への手紙の中で、同じことに触れています。</p></blockquote><p>（<a href="https://bibleox.com/ja/en/w/eusebius-the-church-history-3#HH-Ignatius-and-His-Epistles">エウセビオス『教会史』3巻36章（英語）</a>）</p><p>聖<a href="https://bibleox.com/ja/en/w/3v5Z_Jerome_of_Stridon_4th_c">ストリドンのヒエロニムス</a>（347年頃–419年）も、イグナティオスの手紙を挙げています。</p><blockquote><p>イグナティオスは、使徒ペトロから数えて三代目のアンティオキアの教会の主教で、ローマへ送られる途中、ヨハネの弟子ポリュカルポスが主教であったスミルナに着くと、<strong>エフェソの人々</strong>に一通、<strong>マグネシアの人々</strong>に一通、<strong>トラレスの人々</strong>に一通、<strong>ローマの人々</strong>に一通の手紙を書きました。そこを発ってからは、<strong>フィラデルフィアの人々</strong>と<strong>スミルナの人々</strong>に、また特に<strong>ポリュカルポス</strong>に書き送り、アンティオキアの教会を彼に託しました。</p></blockquote><p>（ヒエロニムス『著名者列伝』16章、<a href="https://azbyka.ru/otechnik/Ieronim_Stridonskij/o_znamenityh/1_9#sel=63:1,63:52">ロシア語訳</a>）</p><h2>信仰</h2><h3>キリストは神である</h3><blockquote><p>「医者はただ一人です。<strong>肉においてまた霊において、生まれた方でありまた生まれざる方、<mark>人のうちにおられる神</mark>、死のうちにある真の命、マリアからの方でありまた神からの方、初めは苦しみを受けうる方であり、今は苦しみを受けない方、<mark>私たちの主イエス・キリスト</mark></strong>です」（『エフェソの教会への手紙』<a href="https://bibleox.com/ja/ja/w/Ig1E_エフェソの教会への手紙#HH-7">7:2</a>）</p></blockquote><blockquote><p>「<strong><mark>私たちの神イエス・キリスト</mark></strong>は、神の計らい（オイコノミア）に従って、マリアの胎に宿られました。それはダビデの子孫からであり、また聖霊からでした」（『エフェソの教会への手紙』<a href="https://bibleox.com/ja/ja/w/Ig1E_エフェソの教会への手紙#HH-18">18:2</a>）</p></blockquote><blockquote><p>「こうして、あらゆる魔術は解かれ、悪のあらゆる束縛は消え去りました。無知は取り除かれ、古い王国は滅ぼされました。<strong><mark>神が人として現れ</mark></strong>、永遠の命の新しさをもたらされたからです」（『エフェソの教会への手紙』<a href="https://bibleox.com/ja/ja/w/Ig1E_エフェソの教会への手紙#HH-19">19:3</a>）</p></blockquote><blockquote><p>「目に見えるもので善いものは一つもありません。<strong><mark>私たちの神イエス・キリスト</mark></strong>も、父のうちにおられる今、いっそうはっきりと現れておられるのです」（『ローマの教会への手紙』<a href="https://bibleox.com/ja/ja/w/Ig1R_ローマの教会への手紙#HH-3">3:3</a>）</p></blockquote><blockquote><p>「私は、あなたがたをこれほど賢くしてくださった<strong><mark>神イエス・キリスト</mark></strong>をたたえます。私は知りました。あなたがたが揺るがない信仰のうちに整えられ、肉においても霊においても、いわば主イエス・キリストの十字架に釘づけられ、キリストの血によって愛のうちに堅く据えられていることを。あなたがたは私たちの主について、確信に満たされています。この方は肉によれば真実にダビデの家系から出た方です」（『スミルナの教会への手紙』<a href="https://bibleox.com/ja/ja/w/Ig1S_スミルナの教会への手紙#HH-1">1:1</a>）</p></blockquote><blockquote><p>「シリアに行くにふさわしい者とされるはずの人に挨拶を送ります。恵みがいつも彼と共に、また彼を遣わすポリュカルポスと共にありますように。<strong><mark>私たちの神イエス・キリスト</mark></strong>のうちに、あなたがたがいつも健やかであるよう祈ります」（『ポリュカルポスへの手紙』<a href="https://bibleox.com/ja/ja/w/Ig1P_ポリュカルポスへの手紙#HH-8">8:2-3</a>）</p></blockquote><h3>神はマリアから生まれた</h3><blockquote><p>「医者はただ一人です。<strong>肉においてまた霊において、<mark>生まれた方</mark>でありまた生まれざる方、<mark>人のうちにおられる神</mark>、死のうちにある真の命、<mark>マリアからの方</mark>でありまた神からの方、初めは苦しみを受けうる方であり、今は苦しみを受けない方、<mark>私たちの主イエス・キリスト</mark></strong>です」（『エフェソの教会への手紙』<a href="https://bibleox.com/ja/ja/w/Ig1E_エフェソの教会への手紙#HH-7">7:2</a>）</p></blockquote><h3>聖体（エウカリスティア）は象徴ではなく、イエス・キリストのまことの肉と血である</h3><p>イグナティオスは異端者たちを、聖体が苦しみを受け、父によって復活させられたイエス・キリストの肉であることを信じない、と非難しています。異端者たちが、聖体はキリストの肉の象徴にすぎない、ということを信じなかったとは考えられません。象徴を信じないというのは、考えること自体がばかげています。彼らが信じなかったのは、聖体のうちにあるのが苦しみを受けて復活したキリストの肉そのものである、ということなのです。そのことが次のように語られています。</p><blockquote><p>「だれも思い違いをしてはなりません。天上のものも、天使たちの栄光も、見えるものと見えない支配者たちも、<strong><mark>もしキリストの血を信じないなら、彼らにも裁きがあります</mark></strong>。「受け入れることのできる者は受け入れなさい」。〈…〉彼ら（異端者たち）は聖体と祈りから遠ざかっています。<strong><mark>聖体が、私たちの罪のために苦しみを受け、父がその慈しみによって復活させられた、私たちの救い主イエス・キリストの肉である</mark></strong>ことを認めないからです。こうして、<strong>神の賜物に反論する者たちは</strong>、論争のうちに<strong>死んでいきます</strong>」（『スミルナの教会への手紙』<a href="https://bibleox.com/ja/ja/w/Ig1S_スミルナの教会への手紙#HH-6">6:1</a>、<a href="https://bibleox.com/ja/ja/w/Ig1S_スミルナの教会への手紙#HH-7">7:1</a>）</p></blockquote><h3>キリスト者は自分がすでに救われたとは考えない</h3><blockquote><p>「<strong><mark>始まりはよく整いました。</mark><u><mark>もし</mark></u><mark>私が、自分の分け前を妨げられることなく受け取る恵みを得るならばです</mark></strong>。しかし、あなたがたの愛が私に害を与えるのではないかと、私は恐れています。あなたがたにとっては、望むことをするのはたやすいことですが、あなたがたが私を惜しむなら、<strong><mark>私にとって神に到達するのは難しい</mark></strong>からです。〈…〉<strong><mark>私が到達できるよう、私のために祈ってください</mark></strong>。私はあなたがたに肉に従ってではなく、神の御心に従って書きました。もし私が苦しみを受けるなら、それはあなたがたが私に好意を持ってくれたからです。もし私が退けられるなら、それはあなたがたが私を憎んだからです。〈…〉私自身は、<strong>その教会の者と呼ばれることを恥じています。私はその値打ちもない者であり、彼らのうちで最も小さい者、月足らずで生まれた者だからです</strong>。しかし、<strong><u><mark>もし</mark></u><mark>神に到達するなら、私は何者かとなる憐れみを受けたのです</mark></strong>。私の霊と、私を旅人としてではなくイエス・キリストの名によって迎えてくれた諸教会の愛とが、あなたがたに挨拶を送ります」（『ローマの教会への手紙』<a href="https://bibleox.com/ja/ja/w/Ig1R_ローマの教会への手紙#HH-1">1:2</a>、<a href="https://bibleox.com/ja/ja/w/Ig1R_ローマの教会への手紙#HH-8">8:3</a>、<a href="https://bibleox.com/ja/ja/w/Ig1R_ローマの教会への手紙#HH-9">9:2-3</a>）</p></blockquote><h3>キリスト者は行いによって知られる</h3><blockquote><p>「信仰を告白する者はだれも罪を犯さず、愛を得た者はだれも憎みません。「木はその実によって明らかになる」。同じように、<strong><mark>キリストのものであると告白する者たちは、</mark><u><mark>その行いによって明らかになります</mark></u></strong>。今は告白することが肝心なのではなく、終わりまで信仰の力のうちに見いだされることが肝心なのです。<strong><mark>語りながら（キリスト者で）ないよりは、黙っていても（キリスト者で）あるほうがよいのです</mark></strong>。教えることはよいことです、語る者が行うのであれば」（『エフェソの教会への手紙』<a href="https://bibleox.com/ja/ja/w/Ig1E_エフェソの教会への手紙#HH-14">14:2</a>、<a href="https://bibleox.com/ja/ja/w/Ig1E_エフェソの教会への手紙#HH-15">15:1</a>）</p></blockquote><blockquote><p>「洗礼をあなたがたの武具とし、信仰を兜、愛を槍、忍耐を全身の武具として保ちなさい。<strong><mark>あなたがたの行いを預け金としなさい。それにふさわしい払い戻しを受けるためです</mark></strong>」（『ポリュカルポスへの手紙』<a href="https://bibleox.com/ja/ja/w/Ig1P_ポリュカルポスへの手紙#HH-6">6:2</a>）</p></blockquote><h3>キリストのための苦しみは、神に近いことのしるし</h3><blockquote><p>「なぜ私は自分自身を死に、火に、剣に、獣に引き渡したのでしょうか。いいえ、<strong>剣に近い者は神に近く、獣の間にいる者は神の間にいるのです。ただイエス・キリストの名においてです</strong>。この方と共に苦しむために、私はすべてを耐え忍んでいます。完全な人となられたこの方が、私を強めてくださるのです」（『スミルナの教会への手紙』<a href="https://bibleox.com/ja/ja/w/Ig1S_スミルナの教会への手紙#HH-4">4:2</a>）</p></blockquote><h3>主教、司祭、輔祭なしに教会はない</h3><p>つまり、二人か三人がただ集まっただけでは、それは教会ではありません。</p><blockquote><p>「同じように、すべての人は<strong><mark>輔祭たち</mark>をイエス・キリストのように<mark>敬い</mark>なさい。また<mark>主教</mark>を父の型として、<mark>司祭たち</mark>を神の会議として、使徒たちの集まりとして敬いなさい。<mark>これらを抜きにしては、教会と呼ばれるものはありません</mark>。</strong>あなたがたがこのことをそのとおりに心得ていると、私は確信しています。〈…〉ですから、あなたがたに勧めます――いいえ、私ではなく、イエス・キリストの愛が勧めるのです。キリスト者の食物だけを用い、異質な草、すなわち異端を避けなさい。<strong>彼らは、信用されようとして、自分たちの教えにイエス・キリストを織り交ぜます。それは、致死の毒を蜜入りの葡萄酒に混ぜて与えるようなものです。何も知らない者は、それを喜んで受け取り、悪い快楽のうちに死を受けるのです</strong>」（『トラレスの教会への手紙』<a href="https://bibleox.com/ja/ja/w/Ig1T_トラレスの教会への手紙#HH-3">3:1</a>、<a href="https://bibleox.com/ja/ja/w/Ig1T_トラレスの教会への手紙#HH-6">6:1-2</a>）</p></blockquote><blockquote><p>「イエス・キリストが父に従ったように、皆、<strong>主教</strong>に従いなさい。使徒たちに従うように<strong>司祭団</strong>に従いなさい。<strong>輔祭たち</strong>を神の掟として敬いなさい。<strong>主教を抜きにして、教会に関わることをだれも何一つ行ってはなりません</strong>（<a href="https://bibleox.com/ja/ja/w/聖使徒規則#HH-三十九">聖使徒規則第39条</a>参照）。主教のもとで、あるいは主教が委ねた人のもとで行われる聖体を、確かなものと見なしなさい。<strong><u><mark>主教が姿を現す所に、会衆もいなければなりません。イエス・キリストがおられる所に、公なる教会があるのと同じです</mark></u></strong>。主教を抜きにして、洗礼を授けることも、愛餐（アガペー）を行うことも許されていません。しかし主教がよしとすることは、神にも喜ばれることです。それは、あなたがたが行うすべてのことが、揺るぎなく確かなものとなるためです。〈…〉神と主教とを知ることはよいことです。主教を敬う者は神に敬われ、<strong><mark>主教に隠れて何かを行う者は悪魔に仕えているのです</mark></strong>」（『スミルナの教会への手紙』<a href="https://bibleox.com/ja/ja/w/Ig1S_スミルナの教会への手紙#HH-8">8:1-2</a>、<a href="https://bibleox.com/ja/ja/w/Ig1S_スミルナの教会への手紙#HH-9">9:1</a>）</p></blockquote><blockquote><p>「<strong><mark>主教に心を向けなさい。神もあなたがたに心を向けてくださるためです</mark></strong>。<strong>主教と司祭たちと輔祭たちに従う人々のために、私は自分の命を差し出します。彼らと共に、神のうちに私の分け前を得ることができますように</strong>。互いに共に労し、共に戦い、共に走り、共に苦しみ、共に眠り、共に起きなさい。神の家の管理者、側近、しもべとして。〈…〉私たちの神イエス・キリストのうちに、あなたがたがいつも健やかであるよう祈ります。この方のうちに、神の一致と主教の見守りとのうちにとどまりなさい。〈…〉もしだれかが、主の肉に敬意を表して、純潔のうちにとどまることができるなら、誇ることなくとどまりなさい。<strong><mark>もし誇るなら、その人は滅び、主教よりも上に知られようとするなら、その人は損なわれています</mark></strong>」（『ポリュカルポスへの手紙』<a href="https://bibleox.com/ja/ja/w/Ig1P_ポリュカルポスへの手紙#HH-6">6:1</a>、<a href="https://bibleox.com/ja/ja/w/Ig1P_ポリュカルポスへの手紙#HH-8">8:3</a>、<a href="https://bibleox.com/ja/ja/w/Ig1P_ポリュカルポスへの手紙#HH-5">5:2</a>）</p></blockquote><h3>三つの位階の聖職（主教、司祭、輔祭）</h3><p>聖イグナティオスは、シリアの教会が主教なしに残されたと書いています。司祭は大勢いたのに、シリアの主教はイグナティオスただ一人で、彼は今や捕らえられ、処刑のためにローマへ送られているのです。司祭たちが自分たちだけで主教を立てることはできなかったことは明らかです。もしできたのなら、すぐにそうしていたはずで、シリアが主教なしに残されることはなかったでしょう。</p><blockquote><p>「あなたがたの祈りのうちに、<strong><mark>シリアの教会を覚えてください。この教会は今、私に代わって神を牧者としています</mark>。イエス・キリストだけが、そしてあなたがたの愛が、この教会の主教となるでしょう</strong>」（『ローマの教会への手紙』<a href="https://bibleox.com/ja/ja/w/Ig1R_ローマの教会への手紙#HH-9">9:1</a>）</p></blockquote><p>特に注目すべきなのは、主教がいつも単数形で、司祭と輔祭が複数形で語られていることです（<a href="https://bibleox.com/ru/ru/w/трёхчинная-священническая-иерархия#HH-Тертуллиан-155-220">テルトゥリアヌスも同様です（ロシア語）</a>）。つまり、各地の教会の上には一人の頭、すなわち主教がいて、そのもとに大勢の司祭（文字どおりには「彼の司祭たち」）と輔祭たちが仕えていたのです。</p><blockquote><p>「私はこの教会に、イエス・キリストの血のうちに挨拶を送ります。この血は永遠の、変わることのない喜びです。とりわけ、人々が<strong><mark>主教と、主教と共にいる司祭たちと輔祭たち</mark></strong>、すなわちイエス・キリストの御心に従って任じられた人々と一つであるならば、そうです。この人々を、主は御自分の意志によって、聖霊のうちに堅く立てられたのです。〈…〉ですから、一つの聖体（エウカリスティア）にあずかるよう努めなさい。私たちの主イエス・キリストの肉は一つであり、その血による一致のための杯も一つ、祭壇も一つです。同じように、<strong><mark>主教も一人であって、司祭団と、私の同労のしもべである輔祭たちと共に</mark></strong>います。それは、あなたがたが何を行うにしても、神に従って行うためです。〈…〉私はあなたがたの間にいたとき叫びました。大きな声で、神の声で語りました。「<strong><mark>主教と司祭団と輔祭たち</mark></strong>に心を向けなさい」と。〈…〉もしあなたがたが望むなら、神の名のためにこれを行うことは不可能ではありません。すでに最も近くの諸教会は<strong><mark>主教たち</mark>を、ほかの教会は<mark>司祭たちや輔祭たち</mark></strong>を遣わしたのです」（<a href="https://bibleox.com/ja/ja/w/Ig1F_フィラデルフィアの教会への手紙#HH-0">『フィラデルフィアの教会への手紙』序</a>、『フィラデルフィアの教会への手紙』<a href="https://bibleox.com/ja/ja/w/Ig1F_フィラデルフィアの教会への手紙#HH-4">4章</a>、<a href="https://bibleox.com/ja/ja/w/Ig1F_フィラデルフィアの教会への手紙#HH-7">7:1</a>、<a href="https://bibleox.com/ja/ja/w/Ig1F_フィラデルフィアの教会への手紙#HH-10">10:3</a>）</p></blockquote><p>ほかの箇所でも同じです。一人の主教（キリストや父なる神にたとえられる）と、そのもとにいる大勢の司祭たち（使徒たちにたとえられる）と輔祭たちです。</p><blockquote><p>「同じように、すべての人は<strong><mark>輔祭たち</mark>をイエス・キリストのように<mark>敬い</mark>なさい。また<mark>主教</mark>を父の型として、<mark>司祭たち</mark>を神の会議として、使徒たちの集まりとして敬いなさい。</strong>あなたがたがこのことをそのとおりに心得ていると、私は確信しています。これらを抜きにしては、教会と呼ばれるものはありません。」（『トラレスの教会への手紙』<a href="https://bibleox.com/ja/ja/w/Ig1T_トラレスの教会への手紙#HH-3">3:1</a>）</p></blockquote><blockquote><p>「イエス・キリストが父に従ったように、皆、<strong><mark>主教</mark></strong>（一人の――注）に従いなさい。使徒たちに従うように<strong><mark>司祭団</mark></strong>に従いなさい。<strong><mark>輔祭たち</mark></strong>を神の掟として敬いなさい。<strong>主教を抜きにして、教会に関わることをだれも何一つ行ってはなりません</strong>。主教のもとで、あるいは主教が委ねた人のもとで行われる聖体を、確かなものと見なしなさい。主教が姿を現す所に、会衆もいなければなりません。イエス・キリストがおられる所に、公なる教会があるのと同じです。主教を抜きにして、洗礼を授けることも、愛餐（アガペー）を行うことも許されていません。しかし主教がよしとすることは、神にも喜ばれることです。それは、あなたがたが行うすべてのことが、揺るぎなく確かなものとなるためです。〈…〉神と主教とを知ることはよいことです。主教を敬う者は神に敬われ、主教に隠れて何かを行う者は悪魔に仕えているのです」（『スミルナの教会への手紙』<a href="https://bibleox.com/ja/ja/w/Ig1S_スミルナの教会への手紙#HH-8">8:1-2</a>、<a href="https://bibleox.com/ja/ja/w/Ig1S_スミルナの教会への手紙#HH-9">9:1</a>）</p></blockquote><blockquote><p>「主教に心を向けなさい。神もあなたがたに心を向けてくださるためです。<strong>主教と司祭たちと輔祭たちに従う人々のために、私は自分の命を差し出します。彼らと共に、神のうちに私の分け前を得ることができますように</strong>。互いに共に労し、共に戦い、共に走り、共に苦しみ、共に眠り、共に起きなさい。神の家の管理者、側近、しもべとして。〈…〉私たちの神イエス・キリストのうちに、あなたがたがいつも健やかであるよう祈ります。この方のうちに、神の一致と<strong>主教</strong>の見守りとのうちにとどまりなさい。〈…〉もしだれかが、主の肉に敬意を表して、純潔のうちにとどまることができるなら、誇ることなくとどまりなさい。もし誇るなら、その人は滅び、主教よりも上に知られようとするなら、その人は損なわれています」（『ポリュカルポスへの手紙』<a href="https://bibleox.com/ja/ja/w/Ig1P_ポリュカルポスへの手紙#HH-6">6:1</a>、<a href="https://bibleox.com/ja/ja/w/Ig1P_ポリュカルポスへの手紙#HH-8">8:3</a>、<a href="https://bibleox.com/ja/ja/w/Ig1P_ポリュカルポスへの手紙#HH-5">5:2</a>）</p></blockquote><h3>十字架はキリストとキリスト者の道具</h3><blockquote><p>「あなたがたは父の神殿の石であり、父なる神の建物のために備えられ、<strong><mark>十字架であるイエス・キリストの起重機</mark>によって</strong>、聖霊を綱として用いて<strong><mark>高みへと引き上げられている</mark></strong>からです。あなたがたの信仰はあなたがたを引き上げるもの、愛は神へと導き上る道です」（『エフェソの教会への手紙』<a href="https://bibleox.com/ja/ja/w/Ig1E_エフェソの教会への手紙#HH-9">9:1</a>）</p></blockquote><h3>教会の一致の尊さ</h3><blockquote><p>「<strong><mark>一致に心を配りなさい。それにまさるものは何もありません</mark></strong>」（『ポリュカルポスへの手紙』<a href="https://bibleox.com/ja/ja/w/Ig1P_ポリュカルポスへの手紙#HH-1">1:2</a>）</p></blockquote><blockquote><p>「「…<strong><mark>一致を愛しなさい</mark>。分裂を避けなさい</strong>。イエス・キリストが御自分の父に倣ったように、あなたがたもイエス・キリストに倣う者となりなさい」と。ですから私は、一致のために整えられた人間として、自分の務めを果たしました。<strong>分裂と怒りのある所に、神は住まわれません</strong>。しかし、<strong>悔い改めるすべての人を主は<mark>赦されます。もし彼らが神の一致へと</mark>、主教の会議へと<mark>立ち帰るなら</mark>です</strong>」（『フィラデルフィアの教会への手紙』<a href="https://bibleox.com/ja/ja/w/Ig1F_フィラデルフィアの教会への手紙#HH-7">7:2</a>、<a href="https://bibleox.com/ja/ja/w/Ig1F_フィラデルフィアの教会への手紙#HH-8">8:1</a>）</p></blockquote><blockquote><p>「私は神に最もふさわしい名をいただき、身に帯びているこの鎖のうちに<strong>諸教会をたたえて歌っています。そして諸教会のうちに、</strong>私たちの絶えることのない命である<strong>イエス・キリストの<mark>肉と霊との一致</mark></strong>、何ものにもまさる<strong><mark>信仰と愛との一致</mark></strong>があるようにと祈っています」（『マグネシアの教会への手紙』<a href="https://bibleox.com/ja/ja/w/Ig1M_マグネシアの教会への手紙#HH-1">1:2</a>）</p></blockquote><blockquote><p>「<strong><mark>あなたがたを分裂させうるものが、あなたがたの間に何一つあってはなりません</mark>。<mark>主教</mark>と、上に立つ人々と<mark>一つになりなさい</mark></strong>。それが不朽のしるしとなり、教えとなるのです」（『マグネシアの教会への手紙』<a href="https://bibleox.com/ja/ja/w/Ig1M_マグネシアの教会への手紙#HH-6">6:2</a>）</p></blockquote><blockquote><p>「主教に従い、また互いに従いなさい。イエス・キリストが父に従い、使徒たちがキリストと父とに従ったように。<strong>それは<mark>肉と霊の一致</mark>があるためです</strong>」（『マグネシアの教会への手紙』<a href="https://bibleox.com/ja/ja/w/Ig1M_マグネシアの教会への手紙#HH-13">13:2</a>）</p></blockquote><blockquote><p>「私があなたがたの間に分裂を見いだしたというのではありません。むしろ、ふるい分けによる清めを見いだしたのです。<strong>神のもの、イエス・キリストのものである人々は皆、主教と共にいます。<mark>悔い改めて教会の一致に戻ってくる人々も、神のものとなり</mark></strong>、イエス・キリストに従って生きる者となるでしょう。私の兄弟たち、思い違いをしてはなりません。<strong>分裂を起こす者に従う者は、神の国を受け継ぐことができません</strong>」（『フィラデルフィアの教会への手紙』<a href="https://bibleox.com/ja/ja/w/Ig1F_フィラデルフィアの教会への手紙#HH-3">3:1-3</a>）</p></blockquote><blockquote><p>「<strong>自分たちだけで行うことを理にかなったことのように見せようとしてはなりません</strong>。むしろ共に集まって、一つの祈り、一つの願い、一つの思い、愛と汚れのない喜びのうちにある一つの希望を持ちなさい」（『マグネシアの教会への手紙』<a href="https://bibleox.com/ja/ja/w/Ig1M_マグネシアの教会への手紙#HH-7">7:1</a>）</p></blockquote><h3>修道生活</h3><blockquote><p>「もしだれかが、主の肉に敬意を表して、純潔のうちにとどまることができるなら、誇ることなくとどまりなさい」（『ポリュカルポスへの手紙』<a href="https://bibleox.com/ja/ja/w/Ig1P_ポリュカルポスへの手紙#HH-5">5:2</a>）</p></blockquote><h3>異端と分裂のうちでは救われない</h3><blockquote><p>「ですから、<strong>真理の光の子たちよ、<mark>分裂と悪い教えを避けなさい</mark>。羊飼いのいる所に、羊のようについて行きなさい</strong>。信用できそうな多くの狼たちが、悪い快楽によって、神へと向かって走る人々を虜にしようとしています。しかし、あなたがたが一致しているなら、彼らのつけ入る余地はありません。<strong>悪い草を避けなさい。それはイエス・キリストが育てないものです。<mark>それらは父が植えられたものではないからです</mark></strong>。私があなたがたの間に分裂を見いだしたというのではありません。むしろ、ふるい分けによる清めを見いだしたのです。<strong><mark>神のもの、イエス・キリストのものである人々は皆、主教と共にいます</mark></strong>。悔い改めて教会の一致に戻ってくる人々も、神のものとなり、イエス・キリストに従って生きる者となるでしょう。私の兄弟たち、思い違いをしてはなりません。<strong><mark>分裂を起こす者に従う者は、神の国を受け継ぐことができません。異なる考えに従って歩む者は、（キリストの）受難にあずかろうとしていないのです</mark></strong>。〈…〉<strong>分裂と怒りのある所に、神は住まわれません</strong>。しかし、悔い改めるすべての人を<strong>主は赦されます。もし彼らが神の一致へと、主教の会議へと立ち帰るならです</strong>」（『フィラデルフィアの教会への手紙』<a href="https://bibleox.com/ja/ja/w/Ig1F_フィラデルフィアの教会への手紙#HH-2">2章</a>、<a href="https://bibleox.com/ja/ja/w/Ig1F_フィラデルフィアの教会への手紙#HH-3">3章</a>、<a href="https://bibleox.com/ja/ja/w/Ig1F_フィラデルフィアの教会への手紙#HH-8">8:1</a>）</p></blockquote><blockquote><p>「私の兄弟たち、思い違いをしてはなりません。家庭を壊す者たちは神の国を受け継ぐことがありません。肉においてこのようなことを行う者たちが死んだのなら、ましてや、<strong><mark>イエス・キリストがそのために十字架につけられた神への信仰を、悪い教えによって損なう者はなおさらです。そのような者は汚れた者となって、消えることのない火に行くでしょう。彼の言うことを聞く者も同様です</mark></strong>。そのために、主は頭に香油を受けられたのです。それは教会に不朽の香りを吹き込むためでした。<strong>この世の支配者の教えの悪臭を身に塗ってはなりません。彼があなたがたを、目の前に置かれた命から引き離し、捕らえていくことのないためです</strong>」（『エフェソの教会への手紙』<a href="https://bibleox.com/ja/ja/w/Ig1E_エフェソの教会への手紙#HH-16">16章</a>、<a href="https://bibleox.com/ja/ja/w/Ig1E_エフェソの教会への手紙#HH-17">17:1</a>）</p></blockquote><h3>異端者から離れること</h3><blockquote><p>「ですから、<strong><mark>死をもたらす実を結ぶ悪いひこばえを避けなさい</mark></strong>。だれかがそれを味わえば、たちまち死んでしまいます。<strong><mark>彼らは父が植えられたものではないからです</mark></strong>。もし父が植えられたものであったなら、彼らは十字架の枝として現れ、その実は朽ちないものであったでしょう」（『トラレスの教会への手紙』<a href="https://bibleox.com/ja/ja/w/Ig1T_トラレスの教会への手紙#HH-11">11:1-2</a>）</p></blockquote><h3>体を離れた後の魂の命</h3><blockquote><p>「<strong>世から神のもとへ沈むことはよいことです。神のうちへと昇るためです</strong>。〈…〉もし私が（キリスト者として）見いだされるなら、キリスト者と呼ばれることもでき、<strong><mark>私が世から見えなくなるときにこそ</mark>、忠実な者<mark>となるでしょう</mark></strong>。<strong><mark>目に見えるもので善いものは一つもありません</mark></strong>。〈…〉今、私は弟子となり始めています。<strong><mark>見えるものも見えないものも、何一つ私をねたんで、私がイエス・キリストに到達するのを妨げることがありませんように</mark></strong>。〈…〉神のものとなろうとしている者を<strong>世に引き渡したり</strong>、物質によって欺いたりしないでください。<strong>私が清い光を受けることを許してください。<mark>そこに着いたとき、私は（真の）人となるでしょう</mark></strong>。〈…〉私は生きているうちにあなたがたに書いていますが、死ぬことを恋い慕っているのです。私の愛は十字架につけられました。私のうちには、物質を愛する火はありません。ただ生きた水が<strong><mark>私のうちで語り、内から私に「父のもとに来なさい」と言っています</mark></strong>」（『ローマの教会への手紙』<a href="https://bibleox.com/ja/ja/w/Ig1R_ローマの教会への手紙#HH-2">2:2</a>、<a href="https://bibleox.com/ja/ja/w/Ig1R_ローマの教会への手紙#HH-3">3:2-3</a>、<a href="https://bibleox.com/ja/ja/w/Ig1R_ローマの教会への手紙#HH-5">5:3</a>、<a href="https://bibleox.com/ja/ja/w/Ig1R_ローマの教会への手紙#HH-6">6:2</a>、<a href="https://bibleox.com/ja/ja/w/Ig1R_ローマの教会への手紙#HH-7">7:2</a>）</p></blockquote><h3>ユダヤの律法の廃止</h3><blockquote><p>「<strong><mark>もし私たちが今もなおユダヤ教に従って生きているなら、恵みを受けていないことを自ら認めることになるからです</mark></strong>。最も神聖な預言者たちはキリスト・イエスに従って生きました。そのために迫害されたのです。彼らはこの方の恵みに導かれて、従わない者たちに、神はただ一人であり、御子イエス・キリストを通して御自身を現されたことを確信させました。この御子は沈黙から出てきた神の言葉です。〈…〉古い慣習のうちに生きていた人々が新しい希望へと至り、<strong><mark>もはや安息日を守らず、主の日に従って生きている</mark></strong>のなら――その日に、この方とこの方の死とを通して私たちの命も昇ったのです。<strong>ある人々はこの死を否定しますが</strong>、この秘義を通して私たちは信仰を受け、私たちのただ一人の教師イエス・キリストの弟子として見いだされるために、耐え忍んでいるのです。〈…〉それゆえ、<strong>この方の弟子となった私たちは、キリスト教に従って生きることを学びましょう</strong>。この名以外の名で呼ばれる者は、神のものではありません。ですから、<strong><mark>古くなって酸っぱくなった悪いパン種を取り除き、新しいパン種、すなわちイエス・キリストに変わりなさい</mark></strong>。この方によって塩味をつけられなさい。あなたがたのうちのだれかが腐ることのないためです。あなたがたは、そのにおいによって見分けられるでしょう。<strong><mark>イエス・キリストを口にしながらユダヤ教に従って生きるのは筋違いです</mark>。キリスト教がユダヤ教を信じたのではなく、ユダヤ教がキリスト教を信じたのです</strong>。そのキリスト教へと、神を信じたあらゆる言葉の民が集められたのです」（『マグネシアの教会への手紙』<a href="https://bibleox.com/ja/ja/w/Ig1M_マグネシアの教会への手紙#HH-8">8:1-2</a>、<a href="https://bibleox.com/ja/ja/w/Ig1M_マグネシアの教会への手紙#HH-9">9:1</a>、<a href="https://bibleox.com/ja/ja/w/Ig1M_マグネシアの教会への手紙#HH-10">10:1-3</a>）</p></blockquote><blockquote><p>「もし<strong><mark>だれかがあなたがたにユダヤ教を説き明かすなら、その人の言うことを聞いてはなりません</mark>。割礼を受けていない人からユダヤ教を聞くよりは、割礼を受けた人からキリスト教を聞くほうがよいのです</strong>。しかし、もしどちらもイエス・キリストについて語らないなら、彼らは私にとって墓碑であり、死者の墓であって、その上にはただ人間の名が刻まれているにすぎません」（『フィラデルフィアの教会への手紙』<a href="https://bibleox.com/ja/ja/w/Ig1F_フィラデルフィアの教会への手紙#HH-6">6:1</a>）</p></blockquote><h3>地獄での終わりのない苦しみ</h3><blockquote><p>「肉においてこのようなことを行う者たちが死んだのなら、ましてや、イエス・キリストがそのために十字架につけられた神への信仰を、悪い教えによって損なう者はなおさらです。そのような者は汚れた者となって、<strong><mark>消えることのない火</mark>に行くでしょう</strong>。彼の言うことを聞く者も同様です」（『エフェソの教会への手紙』<a href="https://bibleox.com/ja/ja/w/Ig1E_エフェソの教会への手紙#HH-16">16:2</a>）</p></blockquote><h3>「聖書のみ」によって信仰を築こうとする人々への非難</h3><p>イグナティオスは、旧約聖書から証明されないことは信じないと言って論争し、示されてもなお本文の意味について言い争う人々について語っています。彼は、確かに書かれてはいるが、自分にとっての「古い記録」（最も大切なもの）はイエス・キリストとその信仰であると答えます。その信仰を、聖イグナティオスは使徒たちとその弟子たちから直接受けたのです。</p><blockquote><p>「私はイエス・キリストの恵みを信じています。この方は、あなたがたからあらゆる縄目を解いてくださるでしょう。あなたがたに勧めます。<strong><mark>何事も党派心からではなく、キリストに学んだことに従って行いなさい</mark></strong>。<strong><mark>私はある人々がこう言うのを聞きました</mark>。「<mark>もし古い記録の中に見いださないなら、福音においても信じない</mark></strong>」と。<strong>そこで私が「それは書かれている」と言うと、彼らは「それこそ証明を要することだ」と答えました。<mark>しかし私にとっての古い記録は、イエス・キリストです</mark></strong>。侵すことのできない記録とは、この方の十字架と死と復活、<strong><mark>そしてこの方による信仰です</mark></strong>。これらのうちに、あなたがたの祈りによって、私は義とされたいのです」（『フィラデルフィアの教会への手紙』<a href="https://bibleox.com/ja/ja/w/Ig1F_フィラデルフィアの教会への手紙#HH-8">8:1-2</a>）</p></blockquote><h2>テキストの年代について</h2><p>イグナティオスの手紙には、短い版、中くらいの版、長い版という複数の形が伝わっています。中くらいの版が最も古く、最も広く知られています。3–4世紀にカイサリアのエウセビオスが挙げているのも、この手紙の集成です。</p><p>個々の手紙は、それ以前にも言及されています。たとえば2世紀に、イグナティオスと同時代のスミルナのポリュカルポスは、イグナティオスからの手紙について書いています。</p><blockquote><p>「あなたがたもイグナティオスも、<strong>私に手紙で</strong>、もしだれかがシリアへ行くなら、あなたがたの手紙もそこへ届けてほしいと<strong>頼んできました</strong>」（<a href="https://bibleox.com/ja/en/w/Plk_Ph#HH-13">ポリュカルポス『フィリピの信徒への手紙』13章（英語）</a>）</p></blockquote><p>ポリュカルポスはイグナティオスの手紙と、彼について知られていることを集め、それを書き写して広めました。</p><blockquote><p>「<strong>イグナティオスが私たちに送ってきた手紙と、私たちの手もとにあるほかの手紙とを、あなたがたの求めに応じて送ります</strong>。それらはこの手紙に添えてあります。あなたがたはそこから大きな益を受けることができるでしょう。そこには信仰と忍耐と、私たちの主にかなうあらゆる教えがあるからです。<strong>イグナティオス自身と、彼と共にいる人々について確かなことを知ったら、私たちに知らせてください</strong>」（<a href="https://bibleox.com/ja/en/w/Plk_Ph#HH-13">ポリュカルポス『フィリピの信徒への手紙』13章（英語）</a>）</p></blockquote><p>現存する最古のギリシア語写本（5世紀）は、先にポリュカルポスが言及したスミルナの教会への手紙のものです。ローマの教会への手紙のギリシア語写本はかなり後代のものしか残っていませんが、5世紀のシリア語訳と古アルメニア語訳があります。また、ローマの教会、スミルナの教会、ポリュカルポス、トラレスの教会、フィラデルフィアの教会への手紙には、4世紀のコプト語訳もあります。</p><p>カイサリアのエウセビオス（3–4世紀）は、リヨンのエイレナイオス（2世紀）の失われた文書を引用しており、その中でエイレナイオスはイグナティオスのローマの教会への手紙を引いています。</p><blockquote><p>12. エイレナイオスも彼の殉教を知っており、その手紙に言及して次のように言っています。「神への証しのゆえに獣に定められた私たちの一人が言ったように、『<strong>私は神の小麦であり、獣の歯にひかれて、神の清いパンとなる</strong>』」（『ローマの教会への手紙』<a href="https://bibleox.com/ja/ja/w/Ig1R_ローマの教会への手紙#HH-4">4:1</a>）。</p></blockquote><p>（<a href="https://bibleox.com/ja/en/w/eusebius-the-church-history-3#HH-Ignatius-and-His-Epistles">エウセビオス『教会史』3巻36章（英語）</a>）</p><p>エウセビオスは中くらいの版の本文を引用しています。エウセビオスの引用と、今日伝わっている本文とを比べることができます。違いには下線を引きました（二つの語が加わっているだけで、内容は変わりません。拷問の種類が挙げられています）。</p><table class="custom-table"><colgroup></colgroup><tbody><tr><td><p><strong>エウセビオスの『教会史』から</strong></p><p>ἀπὸ Συρίας μέχρι Ῥώμης θηριομαχῶ διὰ γῆς καὶ θαλάσσης, νυκτὸς καὶ ἡμέρας, ἐνδεδεμένος δέκα λεοπάρδοις, ὅ ἐστιν στρατιωτικὸν τάγμα, οἳ καὶ εὐεργετούμενοι χείρονες γίνονται, ἐν δὲ τοῖς ἀδικήμασιν αὐτῶν μᾶλλον μαθητεύομαι· ἀλλ' οὐ παρὰ τοῦτο δεδικαίωμαι. ὀναίμην τῶν θηρίων τῶν ἐμοὶ ἑτοίμων, ἃ καὶ εὔχομαι σύντομά μοι εὑρεθῆναι· ἃ καὶ κολακεύσω συντόμως με καταφαγεῖν, οὐχ ὥσπερ τινῶν δειλαινόμενα οὐχ ἥψαντο, κἂν αὐτὰ δὲ ἄκοντα μὴ θέλῃ, ἐγὼ προσβιάσομαι. συγγνώμην μοι ἔχετε· τί μοι συμφέρει, ἐγὼ γινώσκω, νῦν ἄρχομαι μαθητὴς εἶναι. μηδέν με ζηλώσαι τῶν ὁρατῶν καὶ ἀοράτων, ἵνα Ἰησοῦ Χριστοῦ ἐπιτύχω· πῦρ καὶ σταυρὸς θηρίων τε συστάσεις, <strong><u>___</u></strong> σκορπισμοὶ ὀστέων, συγκοπαὶ μελῶν, ἀλεσμοὶ ὅλου τοῦ σώματος, κολάσεις τοῦ διαβόλου εἰς ἐμὲ ἐρχέσθωσαν, μόνον ἵνα Ἰησοῦ Χριστοῦ ἐπιτύχω</p><p><a href="https://bibleox.com/ja/grc/w/ΕΚΚΛΗΣΙΑΣΤΙΚΗΣ_ΙΣΤΟΡΙΑΣ-3#HH-36">ギリシア語原文</a></p></td><td><p><strong>イグナティオスの手紙から</strong></p><p>Ἀπὸ Συρίας μέχρι Ῥώμης θηριομαχῶ, διὰ γῆς καὶ θαλάσσης, νυκτὸς καὶ ἡμέρας, δεδεμένος δέκα λεοπάρδοις, ὅ ἐστιν στρατιωτικὸν τάγμα· οἳ καὶ εὐεργετούμενοι χείρους γίνονται. ἐν δὲ τοῖς ἀδικήμασιν αὐτῶν μᾶλλον μαθητεύομαι, ἀλλ' οὐ παρὰ τοῦτο δεδικαίωμαι. ὀναίμην τῶν θηρίων τῶν ἐμοὶ ἡτοιμασμένων καὶ εὔχομαι σύντομά μοι εὑρεθῆναι· ἃ καὶ κολακεύσω, συντόμως με καταφαγεῖν, οὐχ ὥσπερ τινῶν δειλαινόμενα οὐχ ἥψαντο. κἂν αὐτὰ δὲ ἄκοντα μὴ θελήσῃ, ἐγὼ προσβιάσομαι. συγγνώμην μοι ἔχετε· τί μοι συμφέρει, ἐγὼ γινώσκω, νῦν ἄρχομαι μαθητὴς εἶναι. μηθέν με ζηλώσαι τῶν ὁρατῶν καὶ ἀοράτων, ἵνα Ἰησοῦ Χριστοῦ ἐπιτύχω. πῦρ καὶ σταυρὸς θηρίων τε συστάσεις, <strong><u>ἀνατομαί, διαιρέσεις</u></strong>, σκορπισμοὶ ὀστέων, συγκοπὴ μελῶν, ἀλεσμοὶ ὅλου τοῦ σώματος, κακαὶ κολάσεις τοῦ διαβόλου ἐπ' ἐμὲ ἐρχέσθωσαν, μόνον ἵνα Ἰησοῦ Χριστοῦ ἐπιτύχω</p><p><a href="https://bibleox.com/ja/grc/w/ΙγνΘ_Ρωμ#HH-5">ギリシア語原文</a>（日本語訳：『ローマの教会への手紙』<a href="https://bibleox.com/ja/ja/w/Ig1R_ローマの教会への手紙#HH-5">5:3</a>）</p></td></tr></tbody></table><p>短い版の手紙の集成も、偽作として現れたとは限りません。古代には、よく知られた作品を短くまとめて書き直すという習慣がありました。たとえば2世紀に、殉教者ユスティノスの弟子タティアノスは、四つの福音書を一つにまとめた『ディアテッサロン』を作りました。この作品は広く知られ、長く教会で読まれ、ときには福音書の代わりに読まれることさえあったので、後には福音書そのものの朗読に戻すためにこれを退けなければなりませんでした。『ディアテッサロン』は偽作として意図されたのではなく、補助的な作品として作られ、そのようなものとして広まったのです。</p><p>『ディアテッサロン』が存在するからといって、福音書が偽物だということにはなりませんし、福音書の成立が2世紀に下げられるわけでもありません。『ディアテッサロン』自身も1世紀の作品だと主張してはいません。これは2世紀の作品です。</p><p>致命者イグナティオスの著作は、研究者の間でかなり高い信頼を得ています。詳しくは<a href="https://azbyka.ru/otechnik/Ignatij_Antiohijskij/ignatij-antiokhijskij-episkop-muchenik-i-proiskhozhdenie-episkopata/5">こちら（ロシア語）</a>。</p>
    references: |-
      <ol><li><p>『ローマの教会への手紙』<a href="https://bibleox.com/ja/ja/w/Ig1R_ローマの教会への手紙#HH-4">4:1</a>。エイレナイオスとエウセビオスの引用では「神の清いパン」、手紙の本文では「キリストの清いパン」となっています。</p></li></ol>
      <p>ロシア語版のページからの翻訳：ロジオン・ヴラソフ（AIツールを併用）。イグナティオスの手紙の引用は、本サイトのギリシア語原文からの日本語訳による。ポリュカルポス、エウセビオス、ヒエロニムスの引用はギリシア語・ラテン語原文から訳し、ロシア語訳と照合した。</p>
