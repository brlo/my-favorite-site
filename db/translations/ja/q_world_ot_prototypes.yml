pages:
  - src: интересные-животные
    path: An1m_興味深い動物
    title: 興味深い動物
    meta_desc: 古代の興味深い動物についての聖書の引用
    menu: { parent: "世界", title: "興味深い動物", priority: 1 }
    body: |-
      <p>卵を産む、飛ぶ蛇：</p><blockquote>「ネゲブの獣についての託宣。彼らはその富をろばの背に宝をらくだのこぶに載せてほえたける雌獅子や雄獅子蝮や、<b>飛び回る炎の蛇</b>が住む悩みと苦しみの道を経て益を与えることのない国に赴く」（<a href="https://bibleox.com/ja/jp-ni/is/30/#L6">イザ. 30:6</a>）</blockquote><blockquote>「<b>ふくろう</b>は、そこに巣を作って卵を産み卵をかえして、雛を翼の陰に集める。そこに鳶も、雌も雄も共に集まる」（<a href="https://bibleox.com/ja/jp-ni/is/34/#L15">イザ. 34:15</a>。ヘブライ語 קִפּוֹז の意味ははっきりせず、ロシア語の宗務院訳ではここは「<b>飛ぶ蛇</b>」となっています）</blockquote><blockquote>「ペリシテの民よ、だれも喜んではならないお前を打った鞭が折られたからといって。蛇の根から蝮が出る。その子は<b>炎のように飛び回る</b>」（<a href="https://bibleox.com/ja/jp-ni/is/14/#L29">イザ. 14:29</a>）<em>（ヘブライ語原文では שָׂרָף מְעוֹפֵף —「飛ぶ炎の蛇」です。）</em></blockquote><p>翼のあるとかげ：</p><blockquote>「<b>羽のある昆虫</b>はすべて汚れたものであり、食べてはならない」（<a href="https://bibleox.com/ja/jp-ni/vtor/14/#L19">申. 14:19</a>）<em>（ヘブライ語原文では שֶׁרֶץ הָעוֹף —「飛ぶ、這うもの」です。）</em></blockquote><p>描写が恐竜に似ているベヘモット：</p><blockquote>「見よ、<b>ベヘモット</b>を。お前を造ったわたしはこの獣をも造った。これは牛のように草を食べる。見よ、腰の力と腹筋の勢いを。<b>尾は杉の枝のようにたわみ</b>腿の筋は固く絡み合っている。骨は青銅の管骨組みは鋼鉄の棒を組み合わせたようだ。これこそ神の傑作造り主をおいて剣をそれに突きつける者はない。&lt;…&gt; そてつの影は彼を覆い川辺の柳は彼を包む。川が押し流そうとしても、彼は動じない。ヨルダンが口に流れ込んでも、ひるまない。まともに捕えたり罠にかけてその鼻を貫きうるものがあろうか」（<a href="https://bibleox.com/ja/jp-ni/iov/40/#L15-19,22-24">ヨブ. 40:15-19,22-24</a>）</blockquote><p>描写が恐竜に似ているレビヤタン：</p><blockquote>「お前は<b>レビヤタンを鉤にかけて</b>引き上げその舌を縄で捕えて屈服させることができるか。お前はその鼻に綱をつけ顎を貫いてくつわをかけることができるか。彼がお前に繰り返し憐れみを乞い丁重に話したりするだろうか。彼がお前と契約を結び永久にお前の僕となったりするだろうか。お前は彼を小鳥のようにもてあそび娘たちのためにつないでおくことができるか。お前の仲間は彼を取り引きにかけ商人たちに切り売りすることができるか。<b>お前はもりで彼の皮をやすで頭を傷だらけにすることができるか</b>」（<a href="https://bibleox.com/ja/jp-ni/iov/40/#L25-31">ヨブ. 40:25-31</a>）<em>（ほかの翻訳では41:1-7。）</em></blockquote><blockquote>「勝ち目があると思っても、落胆するだけだ。<b>見ただけでも打ちのめされるほどなのだから</b>。&lt;…&gt; <b>彼のからだの各部についてわたしは黙ってはいられない。力のこもった背と見事な体格について</b>。誰が彼の身ごしらえを正面から解き上下の顎の間に押し入ることができようか。誰がその顔の扉を開くことができようか。<b>歯の周りには殺気がある。背中は盾の列封印され、固く閉ざされている。その盾は次々と連なって風の吹き込む透き間もない。一つの盾はその仲間に結びつきつながりあって、決して離れない</b>。彼がくしゃみをすれば、<b>両眼は曙のまばたきのように、光を放ち始める。口からは火炎が噴き出し火の粉が飛び散る。煮えたぎる鍋の勢いで鼻からは煙が吹き出る。喉は燃える炭火口からは炎が吹き出る。首には猛威が宿り顔には威嚇がみなぎっている</b>。筋肉は幾重にも重なり合いしっかり彼を包んでびくともしない。心臓は石のように硬く石臼のように硬い。<b>彼が立ち上がれば神々もおののき取り乱して、逃げ惑う。剣も槍も、矢も投げ槍も彼を突き刺すことはできない。鉄の武器も麦藁となり青銅も腐った木となる。弓を射ても彼を追うことはできず石投げ紐の石ももみ殻に変わる。彼はこん棒を藁と見なし投げ槍のうなりを笑う。彼の腹は鋭い陶器の破片を並べたよう。打穀機のように土の塊を砕き散らす。彼は深い淵を煮えたぎる鍋のように沸き上がらせ海をるつぼにする。彼の進んだ跡には光が輝き深淵は白髪をなびかせる。この地上に、彼を支配する者はいない。彼はおののきを知らぬものとして造られている。驕り高ぶるものすべてを見下し誇り高い獣すべての上に君臨している</b>」（<a href="https://bibleox.com/ja/jp-ni/iov/41/#L1,4-26">ヨブ. 41:1,4-26</a>）<em>（ほかの翻訳では41:9,12-34。）</em></blockquote>

  - src: прообраз-крестной-жертвы-Авраам-и-Исаак
    path: Ai1s_アブラハムとイサク
    title: キリストの十字架のいけにえ — アブラハムとイサク
    meta_desc: アブラハムが息子イサクをささげたことの予型的な意味についての聖書の引用
    menu: { parent: "旧約/予型", title: "十字架のいけにえ — アブラハムとイサク", priority: 1 }
    body: |-
      <p>キリストの十字架のいけにえの旧約における予型は、イサクの奉献です。アブラハム（父）がイサク（独り子）をいけにえとして献げます：</p><blockquote>「神は命じられた。『<b>あなたの息子、あなたの愛する独り子</b>イサクを連れて、モリヤの地に行きなさい。わたしが命じる<b>山の一つに登り、彼を焼き尽くす献げ物としてささげなさい</b>』」（<a href="https://bibleox.com/ja/jp-ni/gen/22/#L2">創. 22:2</a>）</blockquote><blockquote>「神は、<b>その独り子をお与えになったほどに</b>、世を愛された」（<a href="https://bibleox.com/ja/jp-ni/in/3/#L16">ヨハ. 3:16</a>）</blockquote><p>イサクは、自分がその上でささげられるものを背負って山に登ります：</p><blockquote>「アブラハムは、焼き尽くす献げ物に用いる薪を取って、<b>息子イサクに背負わせ</b>、自分は火と刃物を手に持った。二人は一緒に歩いて行った」（<a href="https://bibleox.com/ja/jp-ni/gen/22/#L6">創. 22:6</a>）</blockquote><blockquote>「こうして、彼らはイエスを引き取った。イエスは、<b>自ら十字架を背負い</b>、いわゆる『されこうべの場所』、すなわちヘブライ語でゴルゴタという所へ向かわれた。そこで、彼らはイエスを十字架につけた」（<a href="https://bibleox.com/ja/jp-ni/in/19/#L16-18">ヨハ. 19:16-18</a>）</blockquote><p>アブラハムはイサクを祭壇の上に置きました：</p><blockquote>「神がわたしたちの父アブラハムを義とされたのは、<b>息子のイサクを祭壇の上に献げる</b>という行いによってではなかったですか」（<a href="https://bibleox.com/ja/jp-ni/iak/2/#L21">ヤコ. 2:21</a>）</blockquote><blockquote>「このイエスを神は、お定めになった計画により、あらかじめご存じのうえで、あなたがたに引き渡されたのですが、あなたがたは律法を知らない者たちの手を借りて、<b>十字架につけて殺してしまったのです</b>」（<a href="https://bibleox.com/ja/jp-ni/act/2/#L23">使. 2:23</a>）</blockquote><p>祭壇の上でのように、十字架の上で人類の救いが成し遂げられます：</p><blockquote>「<b>十字架を通して</b>、両者を一つの体として神と和解させ、<b>十字架によって敵意を滅ぼされました</b>」（<a href="https://bibleox.com/ja/jp-ni/ef/2/#L16">エフェ. 2:16</a>）</blockquote>

  - src: крест-Моисей
    path: Mo2s_十字架モーセ
    title: 十字架 — モーセ
    meta_desc: 丘の上で十字架の形に立ったモーセの予型的な意味についての聖書の引用
    menu: { parent: "旧約/予型", title: "十字架 — モーセ", priority: 2 }
    body: |-
      <h2>アマレクとの戦い</h2><p>イエス・キリストの十字架の救いのいけにえの予型は、旧約の出来事、すなわちユダヤ人の民とアマレクとの戦いです。そこでは、丘の上で祈っていた預言者モーセが手を上げているとユダヤ人が優勢になり（<a href="https://bibleox.com/ja/jp-ni/ish/17/#L11">出. 17:11</a>）、疲れて手を下ろすと民は敵に押され始めました。ユダヤ人とアマレクとの戦いの間、丘の上の預言者モーセの手をアロンとフルが支えます（<a href="https://bibleox.com/ja/jp-ni/ish/17/#L11-12">出. 17:11-12</a>）。戦いは一日中続き、モーセはそれほど長く手を上げ続けることができなかったので、アロンとフルがモーセを助けました。座るための石を下に置き、両側から手を支えたのです。アロンが一方の手を、フルがもう一方の手を（言ってみれば、釘がキリストの手を支えたように）。こうしてモーセは、この姿勢のまま丘の上に（キリストの十字架が丘の上にあったように）日の沈むまでとどまりました（<a href="https://bibleox.com/ja/jp-ni/ish/17/#L12">出. 17:12</a>）（キリストと同じように）。こうなります：</p><ul><li><p>ヨシュア（ギリシア語 Ἰησοῦς —「イエス」、ユダヤ人の指揮官の名）の軍勢が［<em>教会の指導者イエス・キリストの軍勢もまた</em>］</p></li></ul><ul><li><p>十字架の助けによってアマレクを打ち破った［<em>キリストも十字架によって勝利を得られたように</em>（<a href="https://bibleox.com/ja/jp-ni/ef/2/#L16">エフェ. 2:16</a>）］。</p></li></ul><ul><li><p>その十字架をモーセが丘の上で形づくり［<em>ゴルゴタのキリストの十字架もまた</em>］、</p></li></ul><ul><li><p>モーセはこの姿勢で支えられていた［<em>キリストも十字架の上で支えられていたように</em>］</p></li></ul><ul><li><p>日の沈むまで［<em>キリストと同じように</em>］。</p></li></ul>

  - src: еврейский-стан-крест
    path: Cm3p_十字架イスラエルの宿営
    title: 十字架 — イスラエルの宿営
    meta_desc: イスラエルの宿営の十字架形の配置についての聖書の引用
    menu: { parent: "旧約/予型", title: "十字架 — イスラエルの宿営", priority: 3 }
    body: |-
      <p>神はイスラエルの宿営における部族の配置を定められます。部族はこのように宿営し、このように行進しなければなりません。イスラエルの宿営は十字架の形をなしています。</p><ul><li><p>宿営の中心には臨在の幕屋があります：</p></li></ul><blockquote><p>「イスラエルの人々は、それぞれ家系の印を描いた旗を掲げて宿営する。<strong>臨在の幕屋の周りに、距離を置いて宿営する</strong>」（<a href="https://bibleox.com/ja/jp-ni/chis/2/#L2">民. 2:2</a>）</p></blockquote><p>レビ族も宿営の中心に置かれます：</p><blockquote><p>「臨在の幕屋は、<strong>レビ人の宿営に囲まれて全宿営の中央を行進する</strong>。宿営しているときと同じように、それぞれの宿営は、その旗印の下に行進する」（<a href="https://bibleox.com/ja/jp-ni/chis/2/#L17">民. 2:17</a>）</p></blockquote><ul><li><p>東にはユダ族、次にイサカル族、次にゼブルン族：</p></li></ul><blockquote><p>「<strong>東側の正面に</strong>宿営する者は、<strong>ユダ</strong>の宿営の旗の下に部隊ごとに位置をとる。&lt;…&gt; それと共に宿営するのは<strong>イサカル</strong>族で &lt;…&gt; 同じく<strong>ゼブルン</strong>族」（<a href="https://bibleox.com/ja/jp-ni/chis/2/#L3,5,7">民. 2:3,5,7</a>）</p></blockquote><ul><li><p>南にはルベン族、次にシメオン族、次にガド族：</p></li></ul><blockquote><p>「<strong>南に</strong>宿営する者は、<strong>ルベン</strong>の宿営の旗の下に部隊ごとに位置をとる。&lt;…&gt; それと共に宿営するのは<strong>シメオン</strong>族で &lt;…&gt; 同じく<strong>ガド</strong>族」（<a href="https://bibleox.com/ja/jp-ni/chis/2/#L10,12,14">民. 2:10,12,14</a>）</p></blockquote><ul><li><p>西にはエフライム族（ヨセフから）、次にマナセ族（ヨセフから）、次にベニヤミン族：</p></li></ul><blockquote><p>「<strong>西に</strong>宿営する者は、<strong>エフライム</strong>の宿営の旗の下に部隊ごとに位置をとる。&lt;…&gt; それと共に宿営するのは<strong>マナセ</strong>族で &lt;…&gt; 同じく<strong>ベニヤミン</strong>族」（<a href="https://bibleox.com/ja/jp-ni/chis/2/#L18,20,22">民. 2:18,20,22</a>）</p></blockquote><ul><li><p>北にはダン族、次にアシェル族、次にナフタリ族：</p></li></ul><blockquote><p>「<strong>北に</strong>宿営する者は、<strong>ダン</strong>の宿営の旗の下に部隊ごとに位置をとる。&lt;…&gt; それと共に宿営するのは<strong>アシェル</strong>族で &lt;…&gt; 同じく<strong>ナフタリ</strong>族」（<a href="https://bibleox.com/ja/jp-ni/chis/2/#L25,27,29">民. 2:25,27,29</a>）</p></blockquote><p><strong><em>* </em></strong><em>このような配置には13の宿営（1+3+3+3+3）が必要ですが、ヤコブには12人の息子しかいませんでした。ここにはすべての部族が挙げられていますが、ヨセフの一つの部族の代わりに、宿営にはその息子たちの二つの部族、マナセとエフライムがあります。</em></p><h2>十字架の各辺は、中心に最も近い部族の名で数えられた</h2><p>まずユダの宿営の数が示されます：</p><blockquote><p>「東側の正面に宿営する者は、ユダの宿営の旗の下に部隊ごとに位置をとる。&lt;…&gt; その部隊に登録された者の数は<strong>七万四千六百人</strong>」（<a href="https://bibleox.com/ja/jp-ni/chis/2/#L3-4">民. 2:3-4</a>）</p></blockquote><p>次にユダに続く部族の人数が挙げられます：</p><blockquote><p>「その部隊に登録された者の数は<strong>五万四千四百人</strong>」（<a href="https://bibleox.com/ja/jp-ni/chis/2/#L6">民. 2:6</a>）</p></blockquote><blockquote><p>「その部隊に登録された者の数は<strong>五万七千四百人</strong>」（<a href="https://bibleox.com/ja/jp-ni/chis/2/#L8">民. 2:8</a>）</p></blockquote><p>それからすべてが合計され、（中心に最も近い）ユダの宿営と呼ばれます。その数にはすでに三つの宿営すべてが含まれています：</p><blockquote><p>「部隊ごとに登録された者で、<strong>ユダの宿営に属する者は総勢十八万六千四百人</strong>で、彼らが先頭を行進する」（<a href="https://bibleox.com/ja/jp-ni/chis/2/#L9">民. 2:9</a>）</p></blockquote><p>同じことが十字架のほかのすべての辺について繰り返されます。</p><h2>宿営は十字架の形で宿営し、また行進した</h2><blockquote><p>「<strong>宿営しているときと同じように、それぞれの宿営は、その旗印の下に行進する</strong>。&lt;…&gt; イスラエルの人々は、すべて主がモーセに命じられたとおりに行い、<strong>それぞれの旗の下に宿営し、またそれぞれ氏族ごとに</strong>、家系に従って<strong>行進した</strong>」（<a href="https://bibleox.com/ja/jp-ni/chis/2/#L17,34">民. 2:17,34</a>）</p></blockquote>

  - src: крест-и-крещение-переход-через-море
    path: Cb4s_十字架と洗礼海を渡ること
    title: 十字架と洗礼 — 海を渡ること
    meta_desc: 葦の海を渡ったことの予型的な意味についての聖書の引用
    menu: { parent: "旧約/予型", title: "十字架と洗礼 — 海を渡ること", priority: 4 }
    body: |-
      <p>ユダヤ人の民がエジプトの捕囚から葦の海の底を通って渡ったことは、洗礼（<a href="https://bibleox.com/ja/jp-ni/1kor/10/#L2">１コリ. 10:2</a>）、罪の奴隷状態から出ることの予型です。預言者モーセは葦の海の水に元の場所へ戻るよう命じます（<a href="https://bibleox.com/ja/jp-ni/ish/14/#L26-27">出. 14:26-27</a>）。神は預言者モーセに、杖を上げて海を分けるよう言われ（<a href="https://bibleox.com/ja/jp-ni/ish/14/#L16,21">出. 14:16,21</a>）、民が向こう岸に渡ったとき、モーセは手で水に元の場所へ戻るよう命じることになりました（<a href="https://bibleox.com/ja/jp-ni/ish/14/#L26-27">出. 14:26-27</a>）。論理的に言えば、これは前の分ける動きとは対照的に、横の動きで行われます。その結果、十字架ができます：</p><ul><li><p>「前」の、分ける縦の動き。</p></li><li><p>「後」の、合わせる横の動き。</p></li></ul><p>その結果が十字架です（この「｜」とこの「—」で「＋」になります）。十字架によってユダヤ人は奴隷状態から救われました。わたしたちも同じように、洗礼の水に浸されることにより、キリストの十字架によって罪の奴隷状態から救われるのです。</p>

  - src: крест-Иаков
    path: Jb5l_十字架ヤコブの祝福
    title: 十字架 — ヤコブの祝福
    meta_desc: ヤコブの十字架形の祝福の予型的な意味についての聖書の引用
    menu: { parent: "旧約/予型", title: "十字架 — ヤコブの祝福", priority: 5 }
    body: |-
      <p>ヤコブによる孫たちへの十字架形の祝福。ヨセフは息子たちを連れて来て、それぞれを父の対応する手の真正面に立たせましたが、ヤコブは手を交差させて逆に置きました：</p><blockquote>「ヨセフは二人の息子のうち、エフライムを自分の右手でイスラエルの左手に向かわせ、マナセを自分の左手でイスラエルの右手に向かわせ、二人を近寄らせた。イスラエルは右手を伸ばして、弟であるエフライムの頭の上に置き、左手をマナセの頭の上に置いた。つまり、マナセが長男であるのに、彼は<b>両手を交差して置いた</b>のである」（<a href="https://bibleox.com/ja/jp-ni/gen/48/#L13-14">創. 48:13-14</a>）</blockquote>

  - src: EMRx_Крест__буква_тау
    path: Tw6l_十字架タウの文字
    title: 十字架 — タウの文字「𐤕」
    title_sub: 預言者エゼキエルの幻に見られる、初期のキリスト者が指で額に描いた十字架のしるしの像
    menu: { parent: "旧約/予型", title: "十字架 — タウの文字", priority: 6 }
    references: |-
      <h3>関連資料</h3><ul><li><p><a href="https://www.pravoslavie.ru/110001.html">https://www.pravoslavie.ru/110001.html</a>（ロシア語）</p></li></ul>
    body: |-
      <p><strong>預言者エゼキエルの幻の中で、書記はある人々の額に「𐤕」（フェニキア文字のタウ）のしるしを付けることになっていました。</strong></p><p>預言者エゼキエルは、神にとって忌まわしいユダヤ人の行いの幻を見ます。そのために神は、書記を先頭にして処刑者たちを彼らのもとに遣わされます。書記は、それらすべての忌まわしいことを神と同じように嫌悪する人々の額にしるしを付けます。神の命令により、この印を持つ者には罰が及びません。</p><blockquote><p>「主は彼に言われた。『都の中、エルサレムの中を巡り、<strong>その中で行われているあらゆる忌まわしいことのゆえに、嘆き悲しんでいる者の額に印を付けよ。</strong>』また、他の者たちに言っておられるのが、わたしの耳に入った。『彼の後ろについて都の中を巡れ。打て。&lt;…&gt; しかし、<strong>あの印のある者に近づいてはならない</strong>』」（<a href="https://bibleox.com/ja/jp-ni/iez/9/#L4-6">エゼ. 9:4-6</a>）</p></blockquote><p>ヘブライ語では「印を付けよ」は「הִתְוִיתָ <strong>תָּו</strong>」［ヒトウィータ・タウ］と書かれています。</p><p>文字どおりには「<strong>תָּ</strong>（タウの文字）を描け」と訳すことができます。しかし預言者エゼキエルが生まれたのは、ユダヤ人がまだフェニキア文字、あるいはフェニキア文字から派生した古ヘブライ文字を使っていた時代であり、そこではタウの文字はこのように書かれます：<strong> </strong>「𐤕」。したがって、文字どおりには「<strong>𐤕を描け</strong>」と書かれているのです。</p><p>同じように、初期のキリスト者たちは額に十字架を描きました：<a href="https://bibleox.com/ru/ru/w/%D0%BA%D1%80%D0%B5%D1%81%D1%82%D0%BD%D0%BE%D0%B5-%D0%B7%D0%BD%D0%B0%D0%BC%D0%B5%D0%BD%D0%B8%D0%B5">十字を描くこと</a>（ロシア語）</p><hr><p>ユダヤ人は、およそキリスト降誕前10世紀から7世紀まで、フェニキア文字（フェニキア文字から派生した古ヘブライ文字）を用いていました。つまり、それはバビロン捕囚の前に用いられていたのです。ユダヤ人は16年にわたって何段階かに分けてバビロンに連れ去られました（<a href="https://en.wikipedia.org/wiki/Babylonian_captivity">前598～582年</a>、英語）。</p><p>預言者エゼキエルは<a href="https://en.wikipedia.org/wiki/Ezekiel">前622年頃～前570年頃</a>（英語）（全部で52年）に生きました。</p><p><a href="https://azbyka.ru/days/sv-iezekiil">25歳</a>（ロシア語）のとき、彼は自分の民と共に捕囚として連れ去られました。</p><p>つまり、彼はフェニキア文字がまだ用いられていた間に生まれ、教育を受けたのです。</p><p><a href="https://en.wikipedia.org/wiki/Ezekiel">30歳</a>（英語）のとき、彼の預言者としての務めが始まります（<a href="https://bibleox.com/ja/jp-ni/iez/1/#L1">エゼ. 1:1</a>）。</p><p>この時、エゼキエルは自分の預言の書を書きます。</p><p>わたしたちが関心を持っているのは8-9章に描かれた出来事で、それはさらに1年2か月後に起こります（<a href="https://bibleox.com/ja/jp-ni/iez/8/#L1">エゼ. 8:1</a>）。</p><p>いずれにせよ、わたしたちは前7世紀から6世紀の境目、バビロン捕囚のまさに初め、ユダヤ人の間で新しい文字が徐々に形づくられ始めたばかりの時期に行き着きます。文字は一度に変わったのではありません。それは捕囚の中で長い期間をかけて起こりました。</p><p>おそらく預言者は、ユダヤ人の民に理解されていたフェニキア文字をまだ使っており、それに応じてタウをこのように「𐤕」と書いたのでしょう。そしてこれが正しいなら、書記は人々の額に「𐤕」の記号を付けて罰から救うことになっていたのであり、それはまたわたしたちに主の十字架の救いの意味を指し示しているのです。</p>
