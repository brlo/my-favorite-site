  - src: Дидахе
    path: Dd1A_ディダケー十二使徒の教え
    title: ディダケー（十二使徒の教え）
    title_sub: 十二使徒を通して異邦人に伝えられた主の教え（1世紀末〜2世紀初め）
    meta_desc: 最古の教会規定書ディダケー（十二使徒の教え）：二つの道、洗礼、断食、主の祈り、聖体、使徒と預言者、主教と輔祭、終わりの時。ギリシア語原文からの翻訳と注。
    menu: { parent: "教え", title: "ディダケー（十二使徒の教え）", priority: 1 }
    body: |-
      <h2>1</h2><p>1. 道は二つあります。一つは命の道、一つは死の道です[1]。二つの道の違いは大きいのです。</p><p>2. 命の道とはこれです。第一に、あなたを造られた神を愛しなさい。第二に、隣人を自分のように愛しなさい[2]。自分にされたくないことはすべて、あなたも人にしてはなりません[3]。</p><p>3. これらの言葉の教えは次のとおりです[4]。あなたがたを呪う者を祝福し、敵のために祈り、あなたがたを迫害する者のために断食しなさい[5]。自分を愛してくれる人を愛したところで、どんな恵みがあるでしょうか。異邦人でさえ、同じことをしているではありませんか。しかし、あなたがたは自分を憎む者を愛しなさい。そうすれば、敵を持つことはないでしょう[6]。</p><p>4. 肉と体の欲を断ちなさい[7]。だれかがあなたの右の頬を打つなら、もう一方の頬も向けなさい。そうすれば、あなたは完全な者となります。だれかがあなたに一ミリオン行くように強いるなら、一緒に二ミリオン行きなさい。だれかがあなたの上着を取るなら、下着も与えなさい。だれかがあなたのものを取っても、取り返そうとしてはなりません。あなたにはそれができないのですから[8]。</p><p>5. 求める者にはだれにでも与え、取り返そうとしてはなりません。父は、ご自分の賜物からすべての人に与えられることを望んでおられるからです。掟に従って与える者は幸いです。その人には罪がないからです。受け取る者は災いです。必要があって受け取るなら、その人には罪がありません。しかし必要もないのに受け取る者は、何のために、何に使うために受け取ったのか、その責任を問われます。そして獄に入れられて自分のしたことを調べられ、最後の一クァドランスを返すまで、そこから出ることはできません[9]。</p><p>6. しかし、これについてもまた言われています。「だれに与えるべきかがわかるまで、あなたの施しはあなたの手の中で汗をかくままにしておきなさい」[10]。</p>
      <h2>2</h2><p>1. 教えの第二の掟は次のとおりです[11]。</p><p>2. 殺してはならない。姦淫してはならない。少年を堕落させてはならない。みだらな行いをしてはならない。盗んではならない。魔術を行ってはならない。毒や薬を用いてはならない。胎児を堕ろして殺してはならない。生まれた子を殺してはならない[12]。隣人のものを欲してはならない。</p><p>3. 偽りの誓いをしてはならない。偽証してはならない。悪口を言ってはならない。悪を根に持ってはならない。</p><p>4. 二心の者、二枚舌の者であってはならない。二枚舌は死の罠だからである。</p><p>5. あなたの言葉は偽りであってはならず、むなしいものであってもならない。行いで満たされていなければならない。</p><p>6. 貪欲な者、略奪する者、偽善者、悪意のある者、高慢な者であってはならない。隣人に対して悪いはかりごとをめぐらしてはならない。</p><p>7. どんな人をも憎んではならない。ある人々を戒め、ある人々のために祈り、ある人々を自分の命よりも愛しなさい[13]。</p>
      <h2>3</h2><p>1. わが子よ、あらゆる悪と、悪に似たものすべてから逃れなさい[14]。</p><p>2. 怒りっぽい者となってはならない。怒りは殺人へ導くからである。ねたむ者、争い好きな者、激しやすい者となってもならない。これらすべてから殺人が生まれるからである[15]。</p><p>3. わが子よ、欲情を抱く者となってはならない。欲情はみだらな行いへ導くからである。下品な言葉を口にする者、目を高く上げる者[16]となってもならない。これらすべてから姦淫が生まれるからである。</p><p>4. わが子よ、鳥占いをする者となってはならない。それは偶像礼拝へ導くからである。呪文を唱える者、占星術師、清めの呪術を行う者となってはならない。それらを見たいと思ってもならない。これらすべてから偶像礼拝が生まれるからである。</p><p>5. わが子よ、うそつきとなってはならない。うそは盗みへ導くからである。金銭に執着する者、虚栄を求める者となってもならない。これらすべてから盗みが生まれるからである。</p><p>6. わが子よ、不平を言う者となってはならない。それは冒瀆へ導くからである。わがままな者、悪い考えを抱く者となってもならない。これらすべてから冒瀆が生まれるからである。</p><p>7. 柔和な者でありなさい。柔和な者は地を受け継ぐからである[17]。</p><p>8. 寛容で、あわれみ深く、悪意がなく、穏やかで、善良であり、聞いた言葉にいつもおののく者でありなさい[18]。</p><p>9. 自分を高くしてはならない。自分の魂に厚かましさを許してはならない。あなたの魂は高ぶる者たちと結びついてはならず、正しい者、へりくだった者たちと交わりなさい。</p><p>10. 身に起こる出来事を、善いものとして受け入れなさい。神なしには何事も起こらないことを知っているのだから。</p>
      <h2>4</h2><p>1. わが子よ、あなたに神の言葉を語る人を、夜も昼も覚えていなさい。そしてその人を主のように敬いなさい。主の主権が語られる所に、主はおられるからである[19]。</p><p>2. 聖なる人々の顔を日ごとに求めなさい。彼らの言葉に憩うためである。</p><p>3. 分裂を望んではならない。争う者たちを和解させなさい。正しく裁きなさい。過ちを戒めるのに、人を分け隔ててはならない。</p><p>4. そうなるのかならないのかと、心を二つに分けてはならない[20]。</p><p>5. 受け取るときには手を伸ばし、与えるときには手を引っ込める者となってはならない[21]。</p><p>6. あなたの手で得たものがあるなら、あなたの罪の贖いとして与えなさい[22]。</p><p>7. 与えることをためらってはならない。与えるときに不平を言ってはならない。報いをよく返してくださる方がだれであるかを、あなたは知るようになるからである。</p><p>8. 困っている人から顔を背けてはならない。すべてのものを兄弟と分かち合い、自分のものだと言ってはならない[23]。不死のものにおいて共にあずかる者であるなら、死ぬべきものにおいてはなおさらである。</p><p>9. 息子や娘から手を引いてはならない。幼い頃から神を畏れることを教えなさい[24]。</p><p>10. 同じ神に望みを置いているあなたの奴隷や女奴隷に、怒りにまかせて命じてはならない。彼らが、あなたと彼らの両方の上におられる神を畏れなくなることのないためである。神は人を分け隔てして招くために来られるのではなく、霊が備えた人々を招くために来られるのだから。</p><p>11. 奴隷であるあなたがたは、神の似姿である主人に、恥じらいと畏れをもって従いなさい[25]。</p><p>12. あらゆる偽善と、主に喜ばれないことすべてを憎みなさい。</p><p>13. 決して主の掟を捨ててはならない。受けたものを守り、それに加えることも、それから取り去ることもしてはならない[26]。</p><p>14. 教会の集まりで、自分の過ちを告白しなさい[27]。悪い良心のまま祈りに臨んではならない。これが命の道である。</p>
      <h2>5</h2><p>1. 死の道とはこれである。何よりもまず、それは悪く、呪いに満ちている。殺人、姦淫、欲情、みだらな行い、盗み、偶像礼拝、魔術、毒や薬、略奪、偽証、偽善、二心、欺き、高慢、悪意、わがまま、貪欲、下品な言葉、ねたみ、厚かましさ、高ぶり、うぬぼれ[28]。</p><p>2. 善い人々を迫害する者、真理を憎む者、偽りを愛する者、義の報いを知らない者、善にも正しい裁きにも結びつかない者、善のためではなく悪のために目を覚ましている者。柔和と忍耐は彼らから遠く、むなしいものを愛し、報酬を追い求め、貧しい人をあわれまず、虐げられた人のために労苦せず、自分を造られた方を知らず、子を殺し、神の造られたものを滅ぼし[29]、困っている人から顔を背け、苦しんでいる人を虐げ、富む者の弁護者となり、貧しい者の不法な裁き手となる、罪にまみれた者たち。子らよ、これらすべてから救われますように。</p>
      <h2>6</h2><p>1. だれもあなたをこの教えの道から迷わせることのないよう、気をつけなさい。そのような者は、神によらずにあなたを教えているのである[30]。</p><p>2. もし主の軛をすべて負うことができるなら、あなたは完全な者となるでしょう[31]。しかしできないなら、できることをしなさい。</p><p>3. 食べ物については、負えるだけのものを負いなさい。ただし偶像に献げられた物には十分に気をつけなさい。それは死んだ神々への礼拝だからである[32]。</p>
      <h2>7</h2><p>1. 洗礼については、このように洗礼を授けなさい。まずこれらすべてのことを前もって教えた上で[33]、父と子と聖霊の名によって[34]、生きた水の中で[35]洗礼を授けなさい。</p><p>2. 生きた水がないなら、ほかの水で洗礼を授けなさい。冷たい水でできないなら、温かい水で授けなさい。</p><p>3. どちらもないなら、頭に三度、父と子と聖霊の名によって水を注ぎなさい[36]。</p><p>4. 洗礼の前には、洗礼を授ける者も受ける者も、またできるならほかの人々も、前もって断食しなさい。洗礼を受ける者には、一日か二日前から断食するよう命じなさい[37]。</p>
      <h2>8</h2><p>1. あなたがたの断食は、偽善者たちと同じであってはならない。彼らは週の二日目と五日目に断食するからである[38]。あなたがたは四日目と準備の日に断食しなさい[39]。</p><p>2. また偽善者たちのように祈ってはならない[40]。主が福音の中で命じられたように、このように祈りなさい。「天におられる私たちの父よ、御名が聖とされますように。御国が来ますように。御心が天におけるように地にも行われますように。私たちの日ごとの糧を今日もお与えください。私たちの負い目をお赦しください。私たちも自分に負い目のある人を赦します。私たちを誘惑に遭わせず、悪しき者からお救いください。力と栄光とは、世々限りなくあなたのものだからです」[41]。</p><p>3. 一日に三度、このように祈りなさい[42]。</p>
      <h2>9</h2><p>1. 聖体（エウカリスティア）[43]については、このように感謝をささげなさい。</p><p>2. まず杯について。「私たちの父よ、あなたの僕（パイス）[44]ダビデの聖なるぶどうの木[45]のゆえに、あなたに感謝します。あなたはそれを、あなたの僕イエスを通して私たちに知らせてくださいました。あなたに栄光が世々限りなくありますように」。</p><p>3. 裂かれたパンについて。「私たちの父よ、あなたが、あなたの僕イエスを通して私たちに知らせてくださった命と知識のゆえに、あなたに感謝します。あなたに栄光が世々限りなくありますように。</p><p>4. この裂かれたパンが山々の上に散らばっていたのに、集められて一つとなったように、あなたの教会も地の果てからあなたの御国へと集められますように[46]。栄光と力とは、イエス・キリストを通して、世々限りなくあなたのものだからです」。</p><p>5. 主の名によって洗礼を受けた者のほかは、だれもあなたがたの聖体から食べたり飲んだりしてはならない。主もこれについて、「聖なるものを犬に与えてはならない」と言われたからである[47]。</p>
      <h2>10</h2><p>1. 満ち足りた後[48]、このように感謝をささげなさい。</p><p>2. 「聖なる父よ、あなたが私たちの心に宿らせてくださった聖なる御名のゆえに、またあなたの僕イエスを通して私たちに知らせてくださった知識と信仰と不死のゆえに、あなたに感謝します。あなたに栄光が世々限りなくありますように。</p><p>3. 全能の主よ、あなたは御名のために万物を造り、人々が楽しむように食べ物と飲み物を与えて、彼らがあなたに感謝するようにされました。また私たちには、あなたの僕を通して、霊の食べ物と飲み物[49]と永遠の命とを恵んでくださいました。</p><p>4. 何よりも、あなたが力ある方であることを、あなたに感謝します。あなたに栄光が世々限りなくありますように。</p><p>5. 主よ、あなたの教会を思い起こしてください。それをあらゆる悪から救い、あなたの愛のうちに完全なものとし、聖とされたその教会を四方の風から集めて[50]、あなたがそのために備えられたあなたの御国へと導いてください。力と栄光とは、世々限りなくあなたのものだからです。</p><p>6. 恵みが来ますように。この世が過ぎ去りますように。ダビデの神にホサナ[51]。だれでも聖なる者は来なさい。そうでない者は悔い改めなさい[52]。マラナ・タ[53]。アーメン」。</p><p>7. 預言者たちには、望むだけ感謝をささげることを許しなさい[54]。</p>
      <h2>11</h2><p>1. ですから、だれかがやって来て、先に述べたこれらすべてのことをあなたがたに教えるなら、その人を受け入れなさい。</p><p>2. しかし教える者自身が道を外れ、これを覆すために別の教えを説くなら、その人に聞き従ってはならない。しかし主の義と知識を増し加えるためであれば、その人を主のように受け入れなさい。</p><p>3. 使徒と預言者[55]については、福音の定めに従って、このように行いなさい。</p><p>4. あなたがたのもとに来る使徒は皆、主のように受け入れられなければならない[56]。</p><p>5. しかし、一日しかとどまってはならない。必要があれば、もう一日とどまってもよい。しかし三日とどまるなら、その者は偽預言者である。</p><p>6. 使徒は出発するとき、次に宿を取る所までのパンのほかは何も受け取ってはならない。もし金銭を求めるなら、その者は偽預言者である[57]。</p><p>7. 霊において語る預言者を、試したり裁いたりしてはならない。すべての罪は赦されるが、この罪は赦されないからである[58]。</p><p>8. しかし霊において語る者がすべて預言者なのではなく、主の生き方を身につけている者だけが預言者である。ですから、その生き方によって偽預言者と預言者とが見分けられるのである[59]。</p><p>9. 霊において食卓を用意するように命じる預言者はだれでも、自分ではそれを食べない。もし食べるなら、その者は偽預言者である。</p><p>10. 真理を教える預言者でも、教えていることを自分で行わないなら、その者は偽預言者である。</p><p>11. 試され、真実であると認められた預言者が、教会のこの世における奥義のために何かを行っても[60]、自分が行っていることを行うよう人々に教えないなら、あなたがたの間で裁かれてはならない。その人の裁きは神のもとにあるからである。昔の預言者たちも同じように行ったのである。</p><p>12. しかし、だれかが霊において「私に金銭を、あるいはほかの何かをくれ」と言うなら、その者に聞き従ってはならない。しかし、困窮しているほかの人々のために与えるように言うなら、だれもその人を裁いてはならない。</p>
      <h2>12</h2><p>1. 主の名によって来る者は皆、受け入れなさい[61]。その後で、その人を試して知るようになりなさい。あなたがたは右も左も見分ける分別を持っているはずだからである。</p><p>2. 来た人が旅の途中の者なら、できるだけ助けなさい。しかしその人は、必要があっても、二日か三日しかあなたがたのもとにとどまってはならない。</p><p>3. あなたがたのもとに住みつこうとする者が職人であるなら、働いて食べるべきである[62]。</p><p>4. 職を持たないなら、あなたがたの分別によって、キリスト者が怠けてあなたがたの間で暮らすことのないように配慮しなさい。</p><p>5. そうしようとしない者は、キリストを売り物にする者（キリスト商人）である[63]。そのような者たちに気をつけなさい。</p>
      <h2>13</h2><p>1. あなたがたのもとに住みつこうとする真の預言者は皆、自分の食べ物を受けるに値する[64]。</p><p>2. 同じように、真の教師も、働き手と同じく、自分の食べ物を受けるに値する。</p><p>3. ですから、ぶどう搾り場と脱穀場の産物、牛と羊の初物をすべて取り、その初物を預言者たちに与えなさい[65]。彼らはあなたがたの大祭司だからである[66]。</p><p>4. 預言者がいないなら、貧しい人々に与えなさい。</p><p>5. パンを作るときは、その初物を取り、掟に従って与えなさい。</p><p>6. 同じように、ぶどう酒や油の瓶を開けたときは、その初物を取って預言者たちに与えなさい。</p><p>7. 金銭や衣服やあらゆる財産についても、その初物を、あなたがよいと思うだけ取って、掟に従って与えなさい。</p>
      <h2>14</h2><p>1. 主の日[67]ごとに集まって、パンを裂き、感謝をささげなさい[68]。その前にあなたがたの過ちを告白しなさい。あなたがたのいけにえが清いものとなるためである[69]。</p><p>2. 仲間と争いのある者はだれでも、和解するまでは、あなたがたと一緒に集まってはならない。あなたがたのいけにえが汚されないためである[70]。</p><p>3. これこそ、主が言われたいけにえだからである。「どこにおいても、いつでも、私に清いいけにえを献げよ。私は大いなる王であると主は言う。私の名は諸国の間で驚くべきものである」[71]。</p>
      <h2>15</h2><p>1. ですから、主にふさわしい主教たちと輔祭たちを[72]、あなたがた自身のために選んで立てなさい[73]。柔和で、金銭に執着せず、誠実で、試された人々をです[74]。彼らもまた、預言者や教師たちの奉仕を、あなたがたのために果たしているからである[75]。</p><p>2. ですから彼らを軽んじてはならない。彼らは、預言者や教師たちと共に、あなたがたの間で敬われている人々だからである。</p><p>3. 怒りによってではなく平和のうちに、福音にあるとおりに、互いに戒め合いなさい[76]。隣人に対して過ちを犯した者とは、悔い改めるまで、だれも口をきいてはならず、あなたがたの間でその人の話を聞いてもならない。</p><p>4. あなたがたの祈りと施しとすべての行いを、私たちの主の福音にあるとおりに行いなさい[77]。</p>
      <h2>16</h2><p>1. あなたがたの命のために目を覚ましていなさい。ともし火を消してはならない。腰の帯を解いてはならない[78]。用意していなさい。私たちの主が来られる時を、あなたがたは知らないからである[79]。</p><p>2. たびたび集まって、あなたがたの魂にふさわしいことを求めなさい。終わりの時に完全な者とされていなければ、信仰の全期間もあなたがたの益にはならないからである[80]。</p><p>3. 終わりの日々には、偽預言者たちと堕落させる者たちが増え、羊は狼に変わり、愛は憎しみに変わるからである[81]。</p><p>4. 不法が増すと、人々は互いに憎み合い、迫害し、裏切るようになる。そのとき、世を惑わす者が神の子のようにして現れ[82]、しるしと不思議な業を行い、地は彼の手に渡される。彼は、世の始まりから一度も行われたことのない不法を行う[83]。</p><p>5. そのとき、人間という被造物は試練の火の中に入り[84]、多くの者がつまずいて滅びる。しかし自分の信仰のうちに耐え忍ぶ者は、呪われた方ご自身によって救われる[85]。</p><p>6. そのとき、真理のしるしが現れる。第一に、天が開かれるしるし[86]、次にラッパの音のしるし、第三に死者の復活である[87]。</p><p>7. しかし、すべての死者ではない。「主が来られる。すべての聖なる者たちも主と共に」と言われているとおりである[88]。</p><p>8. そのとき世は、主が天の雲に乗って来られるのを見るであろう[89]。</p>
    references: |-
      <ol><li><p>『ディダケー』（ギリシア語で「教え」）は、正式には『十二使徒の教え』、あるいは『十二使徒を通して異邦人に伝えられた主の教え』と呼ばれます。1世紀末から2世紀初めに、シリアかパレスチナで書かれたと考えられる最古の教会規定書です。長く失われていましたが、1873年にニコメディアの府主教フィロテオス・ブリエンニオスが、コンスタンティノープルで1056年の写本（エルサレム写本）の中に見つけ、1883年に出版しました。1–6章は「二つの道」と呼ばれる、洗礼を受ける人のための道徳の教え、7–10章は洗礼・断食・祈り・聖体、11–15章は巡回する使徒や預言者、主教と輔祭について、16章は終わりの時についての教えです。二つの道について <a href="https://bibleox.com/ja/jp-ni/vtor/30/#L15">申. 30:15</a>、<a href="https://bibleox.com/ja/jp-ni/ier/21/#L8">エレ. 21:8</a>、<a href="https://bibleox.com/ja/jp-ni/mf/7/#L13-14">マタ. 7:13-14</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/mf/22/#L37-39">マタ. 22:37-39</a>、<a href="https://bibleox.com/ja/jp-ni/vtor/6/#L5">申. 6:5</a>、<a href="https://bibleox.com/ja/jp-ni/lev/19/#L18">レビ. 19:18</a> 参照。</p></li><li><p>いわゆる黄金律の否定形です。主は肯定の形で教えられました（<a href="https://bibleox.com/ja/jp-ni/mf/7/#L12">マタ. 7:12</a>、<a href="https://bibleox.com/ja/jp-ni/lk/6/#L31">ルカ. 6:31</a>）。否定の形は <a href="https://bibleox.com/ja/jp-ni/tov/4/#L15">トビ. 4:15</a> にあります。</p></li><li><p>1:3の後半から2:1までは、福音書の言葉を集めた部分です。「二つの道」の教えを伝えるほかの文書（『バルナバの手紙』18–20章など）にはこの部分がないので、後から加えられたと考える研究者もいます。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/mf/5/#L44">マタ. 5:44</a>、<a href="https://bibleox.com/ja/jp-ni/lk/6/#L27-28">ルカ. 6:27-28</a> 参照。迫害する者のために断食するという言葉は、福音書にはなく、ディダケーだけに見られます。ロシア語訳ではここも「祈りなさい」となっています。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/mf/5/#L46-47">マタ. 5:46-47</a>、<a href="https://bibleox.com/ja/jp-ni/lk/6/#L32-33">ルカ. 6:32-33</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/1pet/2/#L11">１ペト. 2:11</a> 参照。ロシア語訳が底本とした刊本では「肉と世の欲」となっています。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/mf/5/#L39-41">マタ. 5:39-41</a>、<a href="https://bibleox.com/ja/jp-ni/mf/5/#L48">マタ. 5:48</a>、<a href="https://bibleox.com/ja/jp-ni/lk/6/#L29-30">ルカ. 6:29-30</a> 参照。「ミリオン」はローマの距離の単位（約1.5キロ）。「それができない」とは、キリスト者として力ずくで取り返したり訴え出たりすることはできない、という意味と考えられます。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/mf/5/#L26">マタ. 5:26</a>、<a href="https://bibleox.com/ja/jp-ni/lk/12/#L59">ルカ. 12:59</a> 参照。クァドランスはローマの最小の銅貨です。</p></li><li><p>出典ははっきりしません。<a href="https://bibleox.com/ja/jp-ni/prsir/12/#L1">シラ. 12:1</a> が近い意味の言葉です。</p></li><li><p>十戒の後半、すなわち隣人に対する掟の説明です（<a href="https://bibleox.com/ja/jp-ni/ish/20/#L13-17">出. 20:13-17</a>、<a href="https://bibleox.com/ja/jp-ni/mf/19/#L18-19">マタ. 19:18-19</a> 参照）。</p></li><li><p>φαρμακεύσεις は、毒を盛ることと、堕胎薬などの薬を用いることの両方を指す語です。堕胎と嬰児殺しをはっきり禁じる、キリスト教の最も古い証言の一つです（5:2 も参照）。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/iud/1/#L22-23">ユダ. 1:22-23</a>、<a href="https://bibleox.com/ja/jp-ni/lev/19/#L17">レビ. 19:17</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/1sol/5/#L22">１テサ. 5:22</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/mf/5/#L21-22">マタ. 5:21-22</a> 参照。</p></li><li><p>ὑψηλόφθαλμος —「目を高く上げる者」。みだらな目で人を見回す者のことと考えられます（「高慢な者」と取る解釈もあります）。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/mf/5/#L5">マタ. 5:5</a>、<a href="https://bibleox.com/ja/jp-ni/ps/37/#L11">詩. 37:11</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/is/66/#L2">イザ. 66:2</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/evr/13/#L7">ヘブ. 13:7</a> 参照。「主の主権（κυριότης）が語られる所」とは、主について説教される所のことです。</p></li><li><p>διψυχήσεις —「心が二つに分かれる、ためらう」。神の裁きが来るのか来ないのか、祈りが聞かれるのか聞かれないのか、と疑うことと考えられます。<a href="https://bibleox.com/ja/jp-ni/iak/1/#L6-8">ヤコ. 1:6-8</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/prsir/4/#L31">シラ. 4:31</a> 参照。</p></li><li><p>直訳は「あなたの罪の贖いを与えるでしょう」。施しによる罪の贖いについて <a href="https://bibleox.com/ja/jp-ni/dan/4/#L24">ダニ. 4:24</a>、<a href="https://bibleox.com/ja/jp-ni/pr/16/#L6">箴. 16:6</a>、<a href="https://bibleox.com/ja/jp-ni/1pet/4/#L8">１ペト. 4:8</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/act/4/#L32">使. 4:32</a> 参照。</p></li><li><p>「手を引く」とは、しつけを怠ることです。<a href="https://bibleox.com/ja/jp-ni/pr/13/#L24">箴. 13:24</a>、<a href="https://bibleox.com/ja/jp-ni/ef/6/#L4">エフェ. 6:4</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/ef/6/#L5">エフェ. 6:5</a>、<a href="https://bibleox.com/ja/jp-ni/kol/3/#L22">コロ. 3:22</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/vtor/4/#L2">申. 4:2</a>、<a href="https://bibleox.com/ja/jp-ni/otkr/22/#L18-19">黙. 22:18-19</a> 参照。</p></li><li><p>ἐν ἐκκλησίᾳ —「教会で、集会で」。信徒の集まりの前で罪を告白する、古い習わしです（<a href="#HH-14">14:1</a>、<a href="https://bibleox.com/ja/jp-ni/iak/5/#L16">ヤコ. 5:16</a> 参照）。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/gal/5/#L19-21">ガラ. 5:19-21</a>、<a href="https://bibleox.com/ja/jp-ni/rim/1/#L29-31">ロマ. 1:29-31</a> 参照。</p></li><li><p>「神の造られたものを滅ぼす者」とは、堕胎する者のことと考えられます（2:2 参照）。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/mf/24/#L4">マタ. 24:4</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/mf/11/#L29-30">マタ. 11:29-30</a>、<a href="https://bibleox.com/ja/jp-ni/mf/19/#L21">マタ. 19:21</a> 参照。</p></li><li><p>偶像に献げられた肉について <a href="https://bibleox.com/ja/jp-ni/act/15/#L28-29">使. 15:28-29</a>、<a href="https://bibleox.com/ja/jp-ni/1kor/8/#L4-13">１コリ. 8:4-13</a>、<a href="https://bibleox.com/ja/jp-ni/1kor/10/#L25-28">１コリ. 10:25-28</a> 参照。「負えるだけのもの」が何を指すか（ユダヤ教の食物規定か、断食や節制か）ははっきりしません。</p></li><li><p>1–6章の「二つの道」の教えは、洗礼の前に洗礼志願者に教えられるものでした。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/mf/28/#L19">マタ. 28:19</a> 参照。</p></li><li><p>「生きた水」とは、川や泉の流れる水のことです。<a href="https://bibleox.com/ja/jp-ni/act/8/#L36-38">使. 8:36-38</a> 参照。</p></li><li><p>水を注ぐ洗礼について述べる最も古い証言ですが、それはあくまで、浸す水がないときの例外として認められています。三度注ぐのは、三位の名に合わせたものです。</p></li><li><p>洗礼の前の断食について、殉教者ユスティノス『第一弁明』61章も述べています。</p></li><li><p>ここで「偽善者たち」とは、月曜日と木曜日に断食していたユダヤ教徒（ファリサイ派）のことです（<a href="https://bibleox.com/ja/jp-ni/lk/18/#L12">ルカ. 18:12</a> 参照）。</p></li><li><p>「四日目」は水曜日、「準備の日」（παρασκευή）は安息日の前日、すなわち金曜日です。正教会は今も水曜日と金曜日の斎（ものいみ）を守っています（<a href="https://bibleox.com/ja/ja/w/聖使徒規則#HH-六十九">聖使徒規則第69条</a>参照）。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/mf/6/#L5">マタ. 6:5</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/mf/6/#L9-13">マタ. 6:9-13</a>、<a href="https://bibleox.com/ja/jp-ni/lk/11/#L2-4">ルカ. 11:2-4</a> 参照。マタイによる福音書の主の祈りとほぼ同じですが、「負い目」は単数形で、結びの頌栄（「力と栄光とは……」）が付いています。頌栄を伴う主の祈りの最も古い証言です。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/ps/55/#L18">詩. 55:18</a>、<a href="https://bibleox.com/ja/jp-ni/dan/6/#L11">ダニ. 6:11</a> 参照。</p></li><li><p>εὐχαριστία —「感謝」。9–10章の祈りが聖体の祈りそのものか、聖体に先立つ食事（愛餐）の祈りかについては、研究者の間で意見が分かれています。14章でははっきりと、主の日の聖体が語られています（<a href="#HH-14">14:1</a>）。杯が先に挙げられていることについて <a href="https://bibleox.com/ja/jp-ni/lk/22/#L17-20">ルカ. 22:17-20</a>、<a href="https://bibleox.com/ja/jp-ni/1kor/10/#L16">１コリ. 10:16</a> 参照。</p></li><li><p>παῖς —「子」とも「僕（しもべ）」とも訳せる語です。ダビデもイエスも「あなたの僕」と呼ばれています（<a href="https://bibleox.com/ja/jp-ni/act/4/#L25">使. 4:25</a>、<a href="https://bibleox.com/ja/jp-ni/act/4/#L27">使. 4:27</a> 参照）。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/in/15/#L1">ヨハ. 15:1</a>、<a href="https://bibleox.com/ja/jp-ni/ps/80/#L9">詩. 80:9</a> 参照。アレクサンドリアのクレメンスも、キリストを「ダビデのぶどうの木」と呼んでいます（『救われる富者は誰か』29章）。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/in/11/#L52">ヨハ. 11:52</a>、<a href="https://bibleox.com/ja/jp-ni/is/11/#L12">イザ. 11:12</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/mf/7/#L6">マタ. 7:6</a> 参照。洗礼を受けた者だけが聖体にあずかることについての、最も古い証言です。</p></li><li><p>「満ち足りた後」とあるので、聖体が食事と共に行われていたと考えられます（<a href="https://bibleox.com/ja/jp-ni/1kor/11/#L20-25">１コリ. 11:20-25</a> 参照）。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/1kor/10/#L3-4">１コリ. 10:3-4</a>、<a href="https://bibleox.com/ja/jp-ni/in/6/#L27">ヨハ. 6:27</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/mf/24/#L31">マタ. 24:31</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/mf/21/#L9">マタ. 21:9</a>、<a href="https://bibleox.com/ja/jp-ni/mf/21/#L15">マタ. 21:15</a> 参照。福音書では「ダビデの子にホサナ」です。</p></li><li><p>聖体にあずかる人々への招きの言葉です。正教会の聖体礼儀でも、領聖の前に「聖なるものは聖なる者に」と唱えられます。</p></li><li><p>アラム語で「主よ、来てください」の意味です（<a href="https://bibleox.com/ja/jp-ni/1kor/16/#L22">１コリ. 16:22</a>、<a href="https://bibleox.com/ja/jp-ni/otkr/22/#L20">黙. 22:20</a> 参照）。</p></li><li><p>預言者たちは、決まった言葉に縛られず、自分の言葉で感謝の祈りをささげることが許されていました。</p></li><li><p>ここでいう「使徒」と「預言者」は、十二使徒だけでなく、諸教会を巡回して福音を伝えた人々のことです（<a href="https://bibleox.com/ja/jp-ni/ef/4/#L11">エフェ. 4:11</a> 参照）。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/mf/10/#L40">マタ. 10:40</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/mf/10/#L9-10">マタ. 10:9-10</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/mf/12/#L31-32">マタ. 12:31-32</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/mf/7/#L15-20">マタ. 7:15-20</a> 参照。</p></li><li><p>ποιῶν εἰς μυστήριον κοσμικὸν ἐκκλησίας — 意味のはっきりしない句です。旧約の預言者たちが行ったような象徴的な行動（たとえば <a href="https://bibleox.com/ja/jp-ni/os/1/#L2">ホセ. 1:2</a>）を指すとも、キリストと教会とを表す禁欲的な「霊的結婚」を指すとも考えられています（<a href="https://bibleox.com/ja/jp-ni/ef/5/#L32">エフェ. 5:32</a> 参照）。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/ps/118/#L26">詩. 118:26</a>、<a href="https://bibleox.com/ja/jp-ni/mf/21/#L9">マタ. 21:9</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/2sol/3/#L10">２テサ. 3:10</a> 参照。</p></li><li><p>χριστέμπορος —「キリストを商う者」。この語はここに初めて現れます。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/mf/10/#L10">マタ. 10:10</a>、<a href="https://bibleox.com/ja/jp-ni/1tim/5/#L18">１テモ. 5:18</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/chis/18/#L12-13">民. 18:12-13</a>、<a href="https://bibleox.com/ja/jp-ni/vtor/18/#L3-4">申. 18:3-4</a> 参照。</p></li><li><p>旧約で初物が祭司に与えられたように、預言者たちに与えなさいという意味です。</p></li><li><p>κατὰ κυριακὴν κυρίου —「主の主の日ごとに」。主の日、すなわち日曜日のことです（<a href="https://bibleox.com/ja/jp-ni/otkr/1/#L10">黙. 1:10</a>、<a href="https://bibleox.com/ja/jp-ni/act/20/#L7">使. 20:7</a> 参照）。</p></li><li><p>パンを裂き感謝をささげること、すなわち聖体のことです。</p></li><li><p>θυσία —「いけにえ」。聖体をいけにえと呼ぶ最も古い証言の一つです。正教会は聖体礼儀を「無血のいけにえ」と呼んでいます。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/mf/5/#L23-24">マタ. 5:23-24</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/mal/1/#L11">マラ. 1:11</a>、<a href="https://bibleox.com/ja/jp-ni/mal/1/#L14">マラ. 1:14</a> 参照（自由な引用です）。</p></li><li><p>ディダケーには司祭（長老）が出てきません。ここでいう「主教（エピスコポス）」が、イグナティオスの手紙のような一人の主教か、司祭たちと同じ人々かははっきりしません。いずれにせよ、巡回する預言者や教師から、その土地に定住する聖職者へと移っていく時期を示しています。</p></li><li><p>χειροτονήσατε — もとは「手を挙げて選ぶ」という意味の語で、後に「按手して叙聖する」という意味になりました。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/1tim/3/#L1-13">１テモ. 3:1-13</a>、<a href="https://bibleox.com/ja/jp-ni/tit/1/#L7-9">テト. 1:7-9</a> 参照。</p></li><li><p>λειτουργοῦσι … τὴν λειτουργίαν —「奉仕（レイトゥルギア）を行う」。後に聖体礼儀を表す言葉です。ロシア語訳では、続く2節も「預言者と使徒たちと共に」となっていますが、ギリシア語本文は「預言者と教師たち」です。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/mf/18/#L15-17">マタ. 18:15-17</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/mf/6/#L1-18">マタ. 6:1-18</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/lk/12/#L35">ルカ. 12:35</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/mf/24/#L42">マタ. 24:42</a>、<a href="https://bibleox.com/ja/jp-ni/mf/25/#L13">マタ. 25:13</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/evr/10/#L25">ヘブ. 10:25</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/mf/24/#L10-12">マタ. 24:10-12</a>、<a href="https://bibleox.com/ja/jp-ni/mf/7/#L15">マタ. 7:15</a> 参照。</p></li><li><p>κοσμοπλανής —「世を惑わす者」、すなわち反キリストのことです。<a href="https://bibleox.com/ja/jp-ni/2sol/2/#L3-4">２テサ. 2:3-4</a>、<a href="https://bibleox.com/ja/jp-ni/2sol/2/#L9">２テサ. 2:9</a>、<a href="https://bibleox.com/ja/jp-ni/mf/24/#L24">マタ. 24:24</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/mf/24/#L21">マタ. 24:21</a>、<a href="https://bibleox.com/ja/jp-ni/dan/12/#L1">ダニ. 12:1</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/1pet/4/#L12">１ペト. 4:12</a>、<a href="https://bibleox.com/ja/jp-ni/1kor/3/#L13">１コリ. 3:13</a> 参照。</p></li><li><p>ὑπ’ αὐτοῦ τοῦ καταθέματος —「呪われた者そのものによって」。写本の読みです。「呪われた方」とは、私たちのために呪いとなられたキリストのこととする解釈が有力です（<a href="https://bibleox.com/ja/jp-ni/gal/3/#L13">ガラ. 3:13</a> 参照）。ἀπ’（「……から」）と直す刊本もあり、ロシア語訳はそれに従って「彼の呪いから救われる」と訳しています。</p></li><li><p>ἐκπέτασις —「広げること、開くこと」。天が開かれることとも、人の子のしるし（<a href="https://bibleox.com/ja/jp-ni/mf/24/#L30">マタ. 24:30</a>）とも、広げられた腕の形、すなわち十字架のしるしとも解されます。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/mf/24/#L31">マタ. 24:31</a>、<a href="https://bibleox.com/ja/jp-ni/1sol/4/#L16">１テサ. 4:16</a>、<a href="https://bibleox.com/ja/jp-ni/1kor/15/#L52">１コリ. 15:52</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/zah/14/#L5">ゼカ. 14:5</a>、<a href="https://bibleox.com/ja/jp-ni/1sol/3/#L13">１テサ. 3:13</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/mf/24/#L30">マタ. 24:30</a>、<a href="https://bibleox.com/ja/jp-ni/dan/7/#L13">ダニ. 7:13</a> 参照。写本はここで終わっており、結びの部分は失われています。4世紀の『使徒憲章』7巻32章は、この後に裁きについての言葉を続けています。</p></li></ol>
      <p>翻訳：ロジオン・ヴラソフ（AIツールを併用）。底本：<a href="https://bibleox.com/ja/grc/w/ΔΙΔΑΧΗ">本サイトのギリシア語本文</a>（エルサレム写本、1056年。レイク版、1912年、Open Apostolic Fathers による校訂）。参照：ロシア語訳（『モスクワ総主教庁誌』1975年11号）、レイクの英訳。聖書の引用は新共同訳による。</p>
