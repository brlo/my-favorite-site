    menu: { parent: "人間/徳", title: "感謝", priority: 5 }
    body: |-
      <blockquote>「いつも喜んでいなさい。絶えず祈りなさい。<b>どんなことにも感謝しなさい。これこそ、キリスト・イエスにおいて、神があなたがたに望んでおられることです</b>」（<a href="https://bibleox.com/ja/jp-ni/1sol/5/#L16-18">１テサ. 5:16-18</a>）</blockquote><blockquote>「あなたがたはすべてのことに富む者とされて惜しまず施すようになり、その施しは、<b>わたしたちを通じて神に対する感謝の念を引き出します</b>」（<a href="https://bibleox.com/ja/jp-ni/2kor/9/#L11">２コリ. 9:11</a>）</blockquote><blockquote>「なぜなら、この奉仕の働きは、聖なる者たちの不足しているものを補うばかりでなく、<b>神に対する多くの感謝を通してますます盛んになるからです</b>」（<a href="https://bibleox.com/ja/jp-ni/2kor/9/#L12">２コリ. 9:12</a>）</blockquote><blockquote>「キリストに根を下ろして造り上げられ、教えられたとおりの信仰をしっかり守って、<b>あふれるばかりに感謝しなさい</b>」（<a href="https://bibleox.com/ja/jp-ni/kol/2/#L7">コロ. 2:7</a>）</blockquote><blockquote>「そして、何を話すにせよ、行うにせよ、すべてを主イエスの名によって行い、イエスによって、父である神に<b>感謝しなさい</b>」（<a href="https://bibleox.com/ja/jp-ni/kol/3/#L17">コロ. 3:17</a>）</blockquote><blockquote>「どんなことでも、思い煩うのはやめなさい。<b>何事につけ、感謝を込めて祈りと願いをささげ</b>、求めているものを神に打ち明けなさい」（<a href="https://bibleox.com/ja/jp-ni/fil/4/#L6">フィリ. 4:6</a>）</blockquote><blockquote>「卑わいな言葉や愚かな話、下品な冗談もふさわしいものではありません。それよりも、<b>感謝を表しなさい</b>」（<a href="https://bibleox.com/ja/jp-ni/ef/5/#L4">エフェ. 5:4</a>）</blockquote><blockquote>「目を覚まして<b>感謝を込め、ひたすら祈りなさい</b>」（<a href="https://bibleox.com/ja/jp-ni/kol/4/#L2">コロ. 4:2</a>）</blockquote><blockquote>「なぜなら、神を知りながら、神としてあがめることも<b>感謝することもせず</b>、かえって、むなしい思いにふけり、心が鈍く暗くなったからです」（<a href="https://bibleox.com/ja/jp-ni/rim/1/#L21">ロマ. 1:21</a>）</blockquote><blockquote>「そのとき、人々は自分自身を愛し、金銭を愛し、ほらを吹き、高慢になり、神をあざけり、両親に従わず、<b>恩を知らず</b>、神を畏れなくなります」（<a href="https://bibleox.com/ja/jp-ni/2tim/3/#L2">２テモ. 3:2</a>）</blockquote><p>感謝には、今持っている良いもので満足することが含まれます：</p><blockquote>「もっとも、<b>信心は、満ち足りることを知る者には、大きな利得の道です</b>。&lt;…&gt; <b>食べる物と着る物があれば、わたしたちはそれで満足すべきです</b>。金持ちになろうとする者は、誘惑、罠、無分別で有害なさまざまの欲望に陥ります。その欲望が、人を滅亡と破滅に陥れます」（<a href="https://bibleox.com/ja/jp-ni/1tim/6/#L6,8-9">１テモ. 6:6,8-9</a>）</blockquote><blockquote>「物欲しさにこう言っているのではありません。<b>わたしは、自分の置かれた境遇に満足することを習い覚えたのです</b>。<b>貧しく暮らすすべも、豊かに暮らすすべも知っています</b>。満腹していても、空腹であっても、物が有り余っていても不足していても、いついかなる場合にも対処する秘訣を授かっています」（<a href="https://bibleox.com/ja/jp-ni/fil/4/#L11-12">フィリ. 4:11-12</a>）</blockquote><blockquote>「こういう者たちは、<b>自分の運命について不平不満を鳴らし</b>、欲望のままにふるまい、大言壮語し、利益のために人にこびへつらいます」（<a href="https://bibleox.com/ja/jp-ni/iud/1/#L16">ユダ. 1:16</a>）</blockquote>

  - src: Незлобие-милосердие-прощение
    path: Ml6c_悪意のなさ
    title: 悪意のなさ（憐れみ）
    menu: { parent: "人間/徳", title: "悪意のなさ", priority: 6 }
    body: |-
      <blockquote><p>「<strong><mark>愛する人たち、自分で復讐せず</mark>、神の怒りに任せなさい</strong>。『「復讐はわたしのすること、わたしが報復する」と主は言われる』と書いてあります」（<a href="https://bibleox.com/ja/jp-ni/rim/12/#L19">ロマ. 12:19</a>）</p></blockquote><blockquote><p>「<strong><mark>悪に報いたい、と言ってはならない</mark>。主に望みをおけ</strong>、主があなたを救ってくださる」（<a href="https://bibleox.com/ja/jp-ni/pr/20/#L22">箴. 20:22</a>）</p></blockquote>
