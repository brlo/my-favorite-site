    path: Lv1e_愛
    title: 愛
    menu: { parent: "人間/徳", title: "愛", priority: 1 }
    body: |-
      <h2>神と隣人への愛は最も大いなる戒めである</h2><blockquote><p>「イエスはお答えになった。『第一の掟は、これである。「イスラエルよ、聞け、わたしたちの神である主は、唯一の主である。<strong><mark>心を尽くし</mark></strong>、精神を尽くし、思いを尽くし、力を尽くして、<strong><mark>あなたの神である主を愛しなさい</mark></strong>。」第二の掟は、これである。「<strong><mark>隣人を自分のように愛しなさい</mark></strong>。」この二つにまさる掟はほかにない』」（<a href="https://bibleox.com/ja/jp-ni/mk/12/#L29-31">マコ. 12:29-31</a>）（<a href="https://bibleox.com/ja/jp-ni/vtor/6/#L5">申. 6:5</a>）（<a href="https://bibleox.com/ja/jp-ni/lev/19/#L18">レビ. 19:18</a>）</p></blockquote><blockquote><p>「すると、ある律法の専門家が立ち上がり、イエスを試そうとして言った。『先生、<strong>何をしたら、永遠の命を受け継ぐことができるでしょうか</strong>。』イエスが、『律法には何と書いてあるか。あなたはそれをどう読んでいるか』と言われると、彼は答えた。『「<strong><mark>心を尽くし</mark></strong>、精神を尽くし、力を尽くし、思いを尽くして、<strong><mark>あなたの神である主を愛しなさい</mark></strong>、また、<strong><mark>隣人を自分のように愛しなさい</mark></strong>」とあります。』イエスは言われた。『正しい答えだ。それを実行しなさい。そうすれば命が得られる』」（<a href="https://bibleox.com/ja/jp-ni/lk/10/#L25-28">ルカ. 10:25-28</a>）</p></blockquote><h2>何よりもまず愛</h2><blockquote><p>「<strong><mark>たとえ</mark></strong>、人々の異言、天使たちの異言を語ろうとも、<strong><mark>愛がなければ</mark></strong>、わたしは騒がしいどら、やかましいシンバル。たとえ、預言する賜物を持ち、あらゆる神秘とあらゆる知識に通じていようとも、たとえ、山を動かすほどの完全な信仰を持っていようとも、愛がなければ、<strong><mark>無に等しい</mark></strong>。全財産を貧しい人々のために使い尽くそうとも、誇ろうとしてわが身を死に引き渡そうとも、愛がなければ、わたしに何の益もない」（<a href="https://bibleox.com/ja/jp-ni/1kor/13/#L1-3">１コリ. 13:1-3</a>）</p></blockquote><blockquote><p>「<strong><mark>愛を支配しようと財宝などを差し出す人があればその人は必ずさげすまれる</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/pp/8/#L7">雅. 8:7</a>）</p></blockquote><h2>愛は永遠である</h2><blockquote><p>「<strong><mark>愛は決して滅びない</mark></strong>。預言は廃れ、異言はやみ、知識は廃れよう」（<a href="https://bibleox.com/ja/jp-ni/1kor/13/#L8">１コリ. 13:8</a>）</p></blockquote><blockquote><p>「わたしを刻みつけてくださいあなたの心に、印章としてあなたの腕に、印章として。愛は死のように強く熱情は陰府のように酷い。火花を散らして燃える炎。<strong><mark>大水も愛を消すことはできない洪水もそれを押し流すことはできない</mark></strong>。愛を支配しようと財宝などを差し出す人があればその人は必ずさげすまれる」（<a href="https://bibleox.com/ja/jp-ni/pp/8/#L6-7">雅. 8:6-7</a>）</p></blockquote><h2>愛とはどのようなものでありうるか</h2><blockquote><p>「愛は<strong>忍耐強い</strong>。愛は<strong>情け深い</strong>。<strong>ねたまない</strong>。愛は<strong>自慢せず</strong>、<strong>高ぶらない</strong>。<strong>礼を失せず</strong>、<strong>自分の利益を求めず</strong>、<strong>いらだたず</strong>、<strong>恨みを抱かない</strong>。<strong>不義を喜ばず</strong>、<strong>真実を喜ぶ</strong>。<strong>すべてを忍び</strong>、<strong>すべてを信じ</strong>、<strong>すべてを望み</strong>、<strong>すべてに耐える</strong>」（<a href="https://bibleox.com/ja/jp-ni/1kor/13/#L4-7">１コリ. 13:4-7</a>）</p></blockquote><blockquote><p>「<strong>わが子よ、主の諭しを拒むな。主の懲らしめを避けるな。かわいい息子を懲らしめる父のように<mark>主は愛する者を懲らしめられる</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/pr/3/#L11-12">箴. 3:11-12</a>）</p></blockquote><blockquote><p>「なぜなら、<strong><mark>主は愛する者を鍛え</mark></strong>、子として受け入れる者を皆、鞭打たれるからである」（<a href="https://bibleox.com/ja/jp-ni/evr/12/#L6">ヘブ. 12:6</a>）</p></blockquote><blockquote><p>「<strong><mark>わたしは愛する者を皆、叱ったり、鍛えたりする</mark></strong>。だから、熱心に努めよ。悔い改めよ」（<a href="https://bibleox.com/ja/jp-ni/otkr/3/#L19">黙. 3:19</a>）</p></blockquote><blockquote><p>「裁かれるとすれば、それは、<strong>わたしたちが世と共に罪に定められることがないようにするための、主の懲らしめなのです</strong>」（<a href="https://bibleox.com/ja/jp-ni/1kor/11/#L32">１コリ. 11:32</a>）</p></blockquote><blockquote><p>「見よ、<strong>幸いなのは神の懲らしめを受ける人</strong>。全能者の戒めを拒んではならない。彼は傷つけても、包み打っても、その御手で癒してくださる」（<a href="https://bibleox.com/ja/jp-ni/iov/5/#L17-18">ヨブ. 5:17-18</a>）</p></blockquote><blockquote><p>「わたしを刻みつけてくださいあなたの心に、印章としてあなたの腕に、印章として。<strong><mark>愛</mark></strong>は死のように強く<strong><mark>熱情は陰府のように酷い</mark></strong>。<strong><mark>火花を散らして燃える炎</mark></strong>。大水も愛を消すことはできない洪水もそれを押し流すことはできない。愛を支配しようと財宝などを差し出す人があればその人は必ずさげすまれる」（<a href="https://bibleox.com/ja/jp-ni/pp/8/#L6-7">雅. 8:6-7</a>）</p></blockquote>

  - src: смирение
    path: Hm2l_謙遜
    title: 謙遜
    meta_desc: 謙遜についての聖書の引用
    menu: { parent: "人間/徳", title: "謙遜", priority: 2 }
    body: |-
      <p><strong>謙遜</strong>（へりくだった心）は高慢に対立する徳です。</p><ul><li><p>神の被造物として、自分に対する<strong>神の御心</strong>を穏やかに受け入れること。</p></li><li><p>小さな事においても大きな事においても、神と、その定めと摂理とに従うこと。</p></li><li><p>自分について控えめに考え、神に信頼し、神に希望を置くこと。</p></li></ul><h2>主はへりくだる者の神である</h2><blockquote><p><em>「あなたの力は人の数によるものではなく、あなたの主権は強者に頼るものでもありません。</em><strong><em><mark>あなたは虐げられた者の神</mark></em></strong><em>、小さき者の助け主、弱き者の支え、見捨てられた者の守り、希望を失った者の救い主」（</em><a href="https://bibleox.com/ja/jp-ni/iudf/9/#L11"><em>ユデ. 9:11</em></a><em>）（「虐げられた者」は、ギリシア語原文では ταπεινῶν —「へりくだった者、低い者」です。）</em></p></blockquote><h2>謙遜の戒め</h2><p>主イエス・キリストは、御自分から謙遜を学ぶよう呼びかけておられます：</p><blockquote><p>「疲れた者、重荷を負う者は、だれでも<strong>わたしのもとに来なさい</strong>。休ませてあげよう。わたしは柔和で<strong><mark>謙遜な</mark></strong>者だから、わたしの軛を<strong>負い</strong>、<strong>わたしに<mark>学びなさい</mark></strong>。そうすれば、あなたがたは安らぎを得られる」（<a href="https://bibleox.com/ja/jp-ni/mf/11/#L28-29">マタ. 11:28-29</a>）</p></blockquote><blockquote><p>「互いに思いを一つにし、高ぶらず、<strong><mark>身分の低い人々と交わりなさい</mark></strong>。自分を賢い者とうぬぼれてはなりません」（<a href="https://bibleox.com/ja/jp-ni/rim/12/#L16">ロマ. 12:16</a>）</p></blockquote><blockquote><p>「人よ、何が善であり<strong>主が何をお前に求めておられるか</strong>はお前に告げられている。正義を行い、慈しみを愛し<strong><mark>へりくだって神と共に歩むこと</mark></strong>、これである」（<a href="https://bibleox.com/ja/jp-ni/mih/6/#L8">ミカ. 6:8</a>）</p></blockquote><blockquote><p>「心の包皮を切り捨てよ。<strong><mark>二度とかたくなになってはならない</mark></strong>*」（<a href="https://bibleox.com/ja/jp-ni/vtor/10/#L16">申. 10:16</a>）</p><p>*「かたくなになる」は、ヘブライ語原文では「首を固くする」です。首の固い民とは、神の前に頭を垂れず、へりくだらない民のことです。</p></blockquote><h2>生神女はその謙遜のゆえに神に選ばれた</h2><blockquote><p>「<strong>身分の低い、この主のはしためにも<mark>目を留めてくださった</mark></strong>からです。今から後、いつの世の人もわたしを幸いな者と言うでしょう」（<a href="https://bibleox.com/ja/jp-ni/lk/1/#L48">ルカ. 1:48</a>）</p><p>ギリシア語原文では ἐπέβλεψεν ἐπὶ τὴν ταπείνωσιν —「はしための<strong>謙遜</strong>（低さ）に目を留められた」です。</p></blockquote><h2>神はへりくだる者に恵みをお与えになる</h2><blockquote><p>「同じように、若い人たち、長老に従いなさい。皆互いに謙遜を身に着けなさい。なぜなら、<strong>『神は、高慢な者を敵とし、<mark>謙遜な者には恵みをお与えになる</mark>』</strong>からです。だから、<strong>神の力強い御手の下で<mark>自分を低くしなさい</mark>。そうすれば、かの時には高めていただけます</strong>」（<a href="https://bibleox.com/ja/jp-ni/1pet/5/#L5-6">１ペト. 5:5-6</a>）</p></blockquote><blockquote><p>「もっと豊かな恵みをくださる。それで、こう書かれています。『神は、<strong>高慢な者を敵とし、<mark>謙遜な者には恵みをお与えになる</mark></strong>』」（<a href="https://bibleox.com/ja/jp-ni/iak/4/#L6">ヤコ. 4:6</a>）</p></blockquote><blockquote><p>「<strong>主は不遜な者を嘲り<mark>へりくだる人に恵みを賜る</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/pr/3/#L34">箴. 3:34</a>）</p></blockquote><blockquote><p>「子よ、何事をなすにも柔和であれ。そうすれば、施しをする人にもまして愛される。<strong>偉くなればなるほど、<mark>自らへりくだれ。そうすれば、主は喜んで受け入れてくださる</mark></strong>。&lt;…&gt; 主の威光は壮大。<strong><mark>主はへりくだる人によってあがめられる</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/prsir/3/#L17-20">シラ. 3:17-20</a>）</p></blockquote><blockquote><p>「高慢には軽蔑が伴い<strong>謙遜には知恵が伴う</strong>」（<a href="https://bibleox.com/ja/jp-ni/pr/11/#L2">箴. 11:2</a>）</p></blockquote><h2>神はへりくだる者を救われる</h2><blockquote><p>「主は打ち砕かれた心に近くいまし<strong><mark>悔いる霊を救ってくださる</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/ps/34/#L19">詩. 34:19</a>）</p><p>七十人訳（<a href="https://bibleox.com/ja/gr-lxx-byz/ps/33/#L18">詩. 33:18、七十人訳</a>）では τοὺς ταπεινοὺς τῷ πνεύματι σώσει —「霊において<strong>へりくだる者</strong>を救われる」です。</p></blockquote><blockquote><p>「主は御自分の民を喜び<strong><mark>貧しい人を救いの輝きで装われる</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/ps/149/#L4">詩. 149:4</a>）<em>（「貧しい人」は、ヘブライ語原文では עֲנָוִים —「へりくだった人々」です。）</em></p></blockquote><blockquote><p>「主を畏れて<strong><mark>身を低くすれば</mark></strong>富も名誉も<strong><mark>命も</mark></strong>従って来る」（<a href="https://bibleox.com/ja/jp-ni/pr/22/#L4">箴. 22:4</a>）</p></blockquote><h2>神はへりくだる者を高められる</h2><blockquote><p>「<strong><mark>主は貧しい人々を励まし</mark></strong>逆らう者を地に倒される」（<a href="https://bibleox.com/ja/jp-ni/ps/147/#L6">詩. 147:6</a>）<em>（ヘブライ語原文では מְעוֹדֵד עֲנָוִים —「へりくだった人々を支え起こされる」です。）</em></p></blockquote><blockquote><p>「主は御自分の民を喜び<strong><mark>貧しい人を</mark>救いの輝きで<mark>装われる</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/ps/149/#L4">詩. 149:4</a>）</p></blockquote><blockquote><p>「主を畏れることは諭しと知恵。<strong><mark>名誉に先立つのは謙遜</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/pr/15/#L33">箴. 15:33</a>）</p></blockquote><blockquote><p>「破滅に先立つのは心の驕り。<strong><mark>名誉に先立つのは謙遜</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/pr/18/#L12">箴. 18:12</a>）</p></blockquote><blockquote><p>「主を畏れて<strong><mark>身を低くすれば</mark></strong>富も<strong><mark>名誉</mark></strong>も命も従って来る」（<a href="https://bibleox.com/ja/jp-ni/pr/22/#L4">箴. 22:4</a>）</p></blockquote><blockquote><p>「驕る者は低くされ<strong><mark>心の低い人は誉れを受けるようになる</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/pr/29/#L23">箴. 29:23</a>）</p></blockquote><h2>神はへりくだる者の祈りを聞かれる</h2><blockquote><p>「主よ、<strong><mark>あなたは貧しい人に耳を傾けその願いを聞き</mark></strong>、彼らの心を確かにし」（<a href="https://bibleox.com/ja/jp-ni/ps/10/#L17">詩. 10:17</a>）<em>（「貧しい人」は、ヘブライ語原文では עֲנָוִים —「へりくだった人々」です。）</em></p></blockquote><blockquote><p>「<strong><mark>謙虚な人の祈りは、雲を突き抜けて行き</mark></strong>、それが主に届くまで、彼は慰めを得ない」（<a href="https://bibleox.com/ja/jp-ni/prsir/35/#L17">シラ. 35:21</a>）</p></blockquote><blockquote><p>「<strong><mark>わたしが顧みるのは苦しむ人</mark></strong>、霊の砕かれた人わたしの言葉におののく人」（<a href="https://bibleox.com/ja/jp-ni/is/66/#L2">イザ. 66:2</a>）</p></blockquote><blockquote><p>「しかし、打ち砕かれた魂と<strong><mark>へりくだった霊によって、わたしたちが受け入れられますように</mark></strong>」（<a href="https://bibleox.com/ja/gr-lxx-byz/dan/3/#L39">ダニ. 3:39、七十人訳</a>。アザリヤの祈り。ギリシア語からの訳：ἀλλ᾿ ἐν ψυχῇ συντετριμμένῃ καὶ πνεύματι τεταπεινωμένῳ προσδεχθείημεν。この箇所は新共同訳のダニエル書にはありません）</p></blockquote><blockquote><p>「しかし、神の求めるいけにえは打ち砕かれた霊。<strong>打ち砕かれ<mark>悔いる心を神よ、あなたは侮られません</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/ps/51/#L19">詩. 51:19</a>）</p><p>七十人訳（<a href="https://bibleox.com/ja/gr-lxx-byz/ps/50/#L17">詩. 50:17、七十人訳</a>）では、心は「打ち砕かれ、<strong>へりくだった</strong>」（συντετριμμένην καὶ τεταπεινωμένην）心です。</p></blockquote><h2>神はへりくだる者を慰められる</h2><blockquote><p>「しかし、<strong><mark>気落ちした者を力づけてくださる神は</mark></strong>、テトスの到着によってわたしたちを慰めてくださいました」（<a href="https://bibleox.com/ja/jp-ni/2kor/7/#L6">２コリ. 7:6</a>）</p><p>ギリシア語原文では ὁ παρακαλῶν τοὺς ταπεινούς —「<strong>へりくだった者</strong>を慰める方」です。</p></blockquote><blockquote><p>「主は高くいましても<strong><mark>低くされている者を見ておられます</mark></strong>。遠くにいましても傲慢な者を知っておられます」（<a href="https://bibleox.com/ja/jp-ni/ps/138/#L6">詩. 138:6</a>）</p></blockquote><h2>神はへりくだる者を守られる</h2><blockquote><p>「主を求めよ。主の裁きを行い、<strong><mark>苦しみに耐えてきた</mark></strong>この地のすべての人々よ恵みの業を求めよ、苦しみに耐えることを求めよ。<strong><mark>主の怒りの日にあるいは、身を守られるであろう</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/sof/2/#L3">ゼファ. 2:3</a>）<em>（「苦しみに耐えてきた」「苦しみに耐えること」は、ヘブライ語原文では עַנְוֵי —「へりくだった者たち」、עֲנָוָה —「謙遜」です。）</em></p></blockquote><blockquote><p>「<strong>主は、諸国民を根こそぎにし</strong>、<strong><mark>代わりに、身分の低い人々を植え付けられた</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/prsir/10/#L15">シラ. 10:15</a>）</p></blockquote><blockquote><p>「<strong><mark>わたしはお前の中に苦しめられ、卑しめられた民を残す</mark></strong>。彼らは<strong>主の名を避け所とする</strong>」（<a href="https://bibleox.com/ja/jp-ni/sof/3/#L12">ゼファ. 3:12</a>）</p></blockquote><h2>神はへりくだる者と共に住まわれる</h2><blockquote><p>「高く、あがめられて、永遠にいましその名を聖と唱えられる方がこう言われる。<strong><mark>わたしは</mark></strong>、高く、聖なる所に<strong><mark>住み打ち砕かれて、へりくだる霊の人と共にあり</mark></strong>へりくだる霊の人に命を得させ打ち砕かれた心の人に命を得させる」（<a href="https://bibleox.com/ja/jp-ni/is/57/#L15">イザ. 57:15</a>）</p></blockquote><h2>謙遜についてのたとえ</h2><h3>婚宴での席の選び方について</h3><blockquote><p>「イエスは、招待を受けた客が上席を選ぶ様子に気づいて、彼らにたとえを話された。『婚宴に招待されたら、<strong><mark>上席に着いてはならない</mark></strong>。あなたよりも身分の高い人が招かれており、あなたやその人を招いた人が来て、「この方に席を譲ってください」と言うかもしれない。そのとき、あなたは恥をかいて末席に着くことになる。招待を受けたら、むしろ<strong><mark>末席に行って座りなさい</mark></strong>。そうすると、あなたを招いた人が来て、「さあ、もっと上席に進んでください」と言うだろう。そのときは、同席の人みんなの前で面目を施すことになる』」（<a href="https://bibleox.com/ja/jp-ni/lk/14/#L7-10">ルカ. 14:7-10</a>）</p></blockquote><h3>徴税人とファリサイ派の人</h3><blockquote><p>「<strong>ところが、徴税人は<mark>遠くに立って</mark>、<mark>目を天に上げようともせず</mark></strong>、胸を打ちながら言った。『神様、<strong><mark>罪人</mark></strong>のわたしを憐れんでください。』言っておくが、義とされて家に帰ったのは、この人であって、あのファリサイ派の人ではない。<strong>だれでも高ぶる者は低くされ、<mark>へりくだる者は高められる</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/lk/18/#L13-14">ルカ. 18:13-14</a>）</p></blockquote><blockquote><p>「二人の人が祈るために神殿に上った。一人はファリサイ派の人で、もう一人は徴税人だった。ファリサイ派の人は立って、心の中でこのように祈った。『神様、わたしはほかの人たちのように、奪い取る者、不正な者、姦通を犯す者でなく、また、この徴税人のような者でもないことを感謝します。わたしは週に二度断食し、全収入の十分の一を献げています。』<strong>ところが、徴税人は<mark>遠くに立って</mark>、<mark>目を天に上げようともせず</mark></strong>、胸を打ちながら言った。『神様、<strong><mark>罪人</mark></strong>のわたしを憐れんでください。』言っておくが、義とされて家に帰ったのは、この人であって、あのファリサイ派の人ではない。だれでも<strong>高ぶる者は低くされ</strong>、<strong><mark>へりくだる者は高められる</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/lk/18/#L10-14">ルカ. 18:10-14</a>）</p></blockquote>

  - src: милостыня
    path: Al3m_施し
    title: 施し
    meta_desc: 施しをする必要についての聖書の引用
    menu: { parent: "人間/徳", title: "施し", priority: 3 }
    body: |-
      <h2>施し、貧しい人への愛、気前のよさ</h2><blockquote><p>「あなたの神、主が与えられる土地で、どこかの町に<strong>貧しい同胞</strong>が一人でもいるならば、その貧しい同胞に対して心をかたくなにせず、<strong>手を閉ざすことなく</strong>、<strong>彼に手を大きく開いて</strong>、必要とするものを十分に貸し与えなさい。『七年目の負債免除の年が近づいた』と、よこしまな考えを持って、<strong>貧しい同胞を見捨て</strong>、物を断ることのないように注意しなさい。その同胞があなたを主に訴えるならば、あなたは罪に問われよう。彼に必ず与えなさい。また与えるとき、心に未練があってはならない。このことのために、あなたの神、主はあなたの手の働きすべてを祝福してくださる。<strong>この国から貧しい者がいなくなることはないであろう</strong>。それゆえ、わたしはあなたに命じる。この国に住む同胞のうち、生活に苦しむ貧しい者に<strong>手を大きく開きなさい</strong>」（<a href="https://bibleox.com/ja/jp-ni/vtor/15/#L7-11">申. 15:7-11</a>）</p></blockquote><blockquote><p>「<strong>施すべき相手に善行を拒むな</strong>あなたの手にその力があるなら。出直してくれ、明日あげよう、と友に言うなあなたが今持っているなら」（<a href="https://bibleox.com/ja/jp-ni/pr/3/#L27-28">箴. 3:27-28</a>）</p></blockquote><blockquote><p>「<strong>貧しい人に援助の手を差し伸べよ</strong>。そうすれば、お前は豊かに祝福される。<strong>生きとし生けるもの、すべてに恵みを施せ</strong>。<strong>また、死者にも思いやりを示せ</strong>」（<a href="https://bibleox.com/ja/jp-ni/prsir/7/#L32-33">シラ. 7:32-33</a>）</p></blockquote><blockquote><p>「真実をもって祈りをささげ、正義をもって慈善の業をする方が、不正を行って金持ちとなるよりも、よいことです。金をため込むよりも慈善の業をする方がはるかにすばらしいことなのです。<strong>慈善の業は、死を遠ざけ、すべての罪を清めます</strong>。慈善を行う者は、幸せな人生を送ることができます」（<a href="https://bibleox.com/ja/jp-ni/tov/12/#L8-9">トビ. 12:8-9</a>）<em>（8節は七十人訳の広く用いられている本文では「断食を伴う祈りは良い。しかし、その二つにまさるのは、義を伴う施しである」となっています。）</em></p></blockquote><blockquote><p>「ただ、<strong>器の中にある物を人に施せ</strong>。<strong>そうすれば、あなたたちにはすべてのものが清くなる</strong>」（<a href="https://bibleox.com/ja/jp-ni/lk/11/#L41">ルカ. 11:41</a>）</p></blockquote><blockquote><p>「<strong>憐れみ深い人々は、幸いである、その人たちは憐れみを受ける</strong>」（<a href="https://bibleox.com/ja/jp-ni/mf/5/#L7">マタ. 5:7</a>）</p></blockquote>

  - src: Единомыслие
    path: Lk4m_同じ思い
    title: 同じ思い（一致）
    meta_desc: 同じ思いを持つこと（一致）についての聖書の引用
    menu: { parent: "人間/徳", title: "同じ思い", priority: 4 }
    body: |-
      <h2>知恵は兄弟たちの同じ思いと一致によって飾られる</h2><blockquote><p>「<strong>知恵</strong>は自分自身をほめたたえ、その民の中で誇らしげに歌う。いと高き方の御前での集会で知恵は語り、天の万軍を前に誇らかに歌う。『わたしはいと高き方の口から出て、霧のように大地を覆った &lt;…&gt;』」（<a href="https://bibleox.com/ja/jp-ni/prsir/24/#L1-3">シラ. 24:1-3</a>）</p><p>「<strong>わたしは三つのものによって飾られ</strong>、主の前にも人の前にも美しく立った。<strong>兄弟たちの<mark>一致</mark></strong>、<strong>隣人たちの<mark>友情</mark></strong>、<strong>互いに<mark>心を合わせる</mark>妻と夫</strong>」（<a href="https://bibleox.com/ja/gr-lxx-byz/prsir/25/#L1">シラ. 25:1、七十人訳</a>。ギリシア語からの訳：Ἐν τρισὶν ὡραίσθην καὶ ἀνέστην ὡραία ἔναντι κυρίου καὶ ἀνθρώπων· ὁμόνοια ἀδελφῶν…）。ギリシア語本文では、知恵が引き続き自分自身について語っています。新共同訳はこの節を「わたしを大いに喜ばす三つのもの」と訳しています（<a href="https://bibleox.com/ja/jp-ni/prsir/25/#L1">シラ. 25:1</a>）。</p></blockquote><h2>教会に一致と同じ思いが与えられるようにとの祈り</h2><blockquote><p>「父よ、あなたがわたしの内におられ、わたしがあなたの内にいるように、<strong><mark>すべての人を一つにしてください</mark></strong>。彼らもわたしたちの内にいるようにしてください。<strong>そうすれば、世は</strong>、あなたがわたしをお遣わしになったことを、<strong>信じるようになります</strong>。あなたがくださった栄光を、わたしは彼らに与えました。<strong><mark>わたしたちが一つであるように、彼らも一つになるためです</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/in/17/#L21-22">ヨハ. 17:21-22</a>）</p></blockquote><blockquote><p>「忍耐と慰めの源である神が、あなたがたに、キリスト・イエスに倣って<strong>互いに<mark>同じ思い</mark>を抱かせ</strong>」（<a href="https://bibleox.com/ja/jp-ni/rim/15/#L5">ロマ. 15:5</a>）</p></blockquote><h2>同じ思いを持つようにとの戒め</h2><p>神からの賜物は、人の意志に反して与えられるのではありません。たとえば、愛は神の賜物です（<a href="https://bibleox.com/ja/jp-ni/1in/4/#L7-8">１ヨハ. 4:7-8</a>; <a href="https://bibleox.com/ja/jp-ni/gal/5/#L22-23">ガラ. 5:22-23</a>; <a href="https://bibleox.com/ja/jp-ni/rim/5/#L5">ロマ. 5:5</a>）。それでも愛は人に押しつけられるのではなく、来た後も、その人の意志に反してとどまるのではありません。だれもが愛を得るために労苦し（<a href="https://bibleox.com/ja/jp-ni/1kor/13/#L1-2,13">１コリ. 13:1-2,13</a>; <a href="https://bibleox.com/ja/jp-ni/kol/3/#L14">コロ. 3:14</a>）、自分の意志を愛の行いへと傾けなければならず（<a href="https://bibleox.com/ja/jp-ni/in/13/#L34">ヨハ. 13:34</a>; <a href="https://bibleox.com/ja/jp-ni/in/15/#L12">ヨハ. 15:12</a>; <a href="https://bibleox.com/ja/jp-ni/in/15/#L17">ヨハ. 15:17</a>; <a href="https://bibleox.com/ja/jp-ni/1pet/1/#L22">１ペト. 1:22</a>）、神はこの努力に応えて、賜物を与え、守ってくださるのです（<a href="https://bibleox.com/ja/jp-ni/pr/21/#L31">箴. 21:31</a>）。</p><p>同じ思いも神から来ます。キリストと使徒たちはそれを神に祈り求めたからです（<a href="https://bibleox.com/ja/jp-ni/in/17/#L21-22">ヨハ. 17:21-22</a>; <a href="https://bibleox.com/ja/jp-ni/rim/15/#L5">ロマ. 15:5</a>）。愛と同じ思いの賜物は聖霊によって教会に与えられましたが、教会にいるだれもが労苦によってこの賜物を得、守らなければなりません。信者の一人一人が、愛に対しても同じ思いに対しても罪を犯しうるのです。それゆえ、一人一人が愛と同じ思いを守るよう呼びかけられています：</p><blockquote><p>「<strong>互いに<mark>思いを一つにし</mark></strong>、高ぶらず、<strong>身分の低い人々と交わりなさい</strong>。自分を賢い者とうぬぼれてはなりません」（<a href="https://bibleox.com/ja/jp-ni/rim/12/#L16">ロマ. 12:16</a>）</p></blockquote><blockquote><p>「さて、兄弟たち、わたしたちの主イエス・キリストの名によってあなたがたに勧告します。<strong>皆、勝手なことを言わず</strong>、仲たがいせず、<strong>心を一つにし<mark>思いを一つにして</mark>、固く結び合いなさい</strong>」（<a href="https://bibleox.com/ja/jp-ni/1kor/1/#L10">１コリ. 1:10</a>）</p></blockquote><blockquote><p>「終わりに、兄弟たち、喜びなさい。完全な者になりなさい。励まし合いなさい。<strong><mark>思いを一つにしなさい</mark></strong>。平和を保ちなさい。そうすれば、愛と平和の神があなたがたと共にいてくださいます」（<a href="https://bibleox.com/ja/jp-ni/2kor/13/#L11">２コリ. 13:11</a>）</p></blockquote><blockquote><p>「<strong><mark>同じ思いとなり</mark></strong>、同じ愛を抱き、<strong><mark>心を合わせ、思いを一つにして</mark></strong>、わたしの喜びを満たしてください」（<a href="https://bibleox.com/ja/jp-ni/fil/2/#L2">フィリ. 2:2</a>）</p></blockquote><blockquote><p>「終わりに、<strong>皆<mark>心を一つに</mark></strong>、同情し合い、兄弟を愛し、憐れみ深く、謙虚になりなさい」（<a href="https://bibleox.com/ja/jp-ni/1pet/3/#L8">１ペト. 3:8</a>）</p></blockquote><h2>反論への応答</h2><h3>あなたがたの間に仲間争いも避けられない</h3><blockquote><p>「あなたがたの間で、だれが適格者かはっきりするためには、<strong>仲間争い</strong>（αἱρέσεις）も避けられないかもしれません」（<a href="https://bibleox.com/ja/jp-ni/1kor/11/#L19">１コリ. 11:19</a>）</p></blockquote><p>原文では、「仲間争い」の代わりに「異端」（ギリシア語 αἱρέσεις）という語があります。つまり、あなたがたの間に異端もなければならない、ということです。これは単に異端が生じることについての預言です。異端を生み出す者は、使徒の言葉によれば、神の国を受け継ぐことができません：</p><blockquote><p>「肉の業は明らかです。それは、&lt;…&gt; <strong>仲間争い</strong>（αἱρέσεις —「異端」）&lt;…&gt; その他このたぐいのものです。以前言っておいたように、ここでも前もって言いますが、このようなことを行う者は、<strong>神の国を受け継ぐことはできません</strong>」（<a href="https://bibleox.com/ja/jp-ni/gal/5/#L19-21">ガラ. 5:19-21</a>）</p></blockquote>

  - src: благодарение
