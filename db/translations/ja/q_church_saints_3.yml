    path: Rl6c_聖人の不朽体の崇敬
    title: 聖人の不朽体（聖遺物）の崇敬
    title_sub: 聖なる義人たちの遺体の崇敬
    meta_desc: 義人たちの遺体についての聖書の引用
    menu: { parent: "教会/聖人", title: "不朽体の崇敬", priority: 7 }
    references: |-
      <ol><li><p>すべての生き物は、自分の体を造るために、土の中にあるものを食べるか、土から養われているものを食べるかしています。</p></li></ol>
    body: |-
      <h2>なぜ聖なる義人たちの不朽体が崇敬されるのか</h2><p>聖なる義人たちの不朽体は、義人たち自身が一般に崇敬されるのと同じ理由で崇敬されます（これについては次の記事で詳しく論じています：<a href="https://bibleox.com/ja/ja/w/Vs4n_聖人の崇敬/">聖人の崇敬</a>）。すなわち、彼らが神にあずかっているゆえに、彼らの内に神の恵みが働いているゆえに崇敬されるのです（<a href="https://bibleox.com/ru/ru/w/%D1%87%D0%B5%D0%BB%D0%BE%D0%B2%D0%B5%D0%BA-%D1%85%D1%80%D0%B0%D0%BC-%D0%91%D0%BE%D0%B6%D0%B8%D0%B9">人は神の神殿である</a>）。義人は全体として崇敬されるのであって、その一部分だけが崇敬されるのではありません（<a href="https://bibleox.com/ru/ru/w/%D1%81%D0%BE%D1%81%D1%82%D0%B0%D0%B2-%D1%87%D0%B5%D0%BB%D0%BE%D0%B2%D0%B5%D0%BA%D0%B0">人間の本性の構成</a>）。<strong>魂</strong>だけでなく、<strong>体</strong>も（<a href="https://bibleox.com/ja/jp-ni/4ts/13/#L21">王下. 13:21</a>）、さらには義人の<strong>身の回りの品</strong>（<a href="https://bibleox.com/ja/jp-ni/act/19/#L12">使. 19:12</a>）や<strong>像</strong>（<a href="https://bibleox.com/ja/jp-ni/act/5/#L15">使. 5:15</a>）も崇敬されます。神はそれらを通して恵みを与え、奇跡やいやしを行われるのです。</p><p>聖人たちは<strong>神にあずかっているゆえに、また彼らの内に神の恵みが働いているゆえに崇敬される</strong>のであり、神は聖人たちの生きている体を通してだけでなく、死んだ体を通しても恵みを与えられるのですから（<a href="https://bibleox.com/ja/jp-ni/4ts/13/#L21">王下. 13:21</a>）、聖人たちの体は、生きている間だけでなく、死後（体が魂から離れた後）も、恵みのゆえに崇敬されるのです。</p><p>神は御自分の友たちの体の遺骸を忌み嫌われません。神は義人たちの遺骸を顧み（<a href="https://bibleox.com/ja/jp-ni/ps/34/#L20-21">詩. 34:20-21</a>; <a href="https://bibleox.com/ja/jp-ni/in/19/#L33,36">ヨハ. 19:33,36</a>）、それを通して働き続けられます（<a href="https://bibleox.com/ja/jp-ni/4ts/13/#L21">王下. 13:21</a>）。携香女（けいこうじょ）たちも遺骸を忌み嫌いませんでした。救い主の死から三日目に、彼女たちはキリストの亡骸に香油を塗るために墓を開けに行きました（<a href="https://bibleox.com/ja/jp-ni/mk/16/#L1-3">マコ. 16:1-3</a>）。モーセの律法は、近親以外の者が死者の体に触れることを禁じていたにもかかわらずです（<a href="https://bibleox.com/ja/jp-ni/lev/21/#L1-4">レビ. 21:1-4</a>）。</p><h2>よくある質問</h2><h3>なぜ不朽体は土の中ではなく教会堂の中にあるのか</h3><p><strong>教会堂は</strong>義人の遺骸のための<strong>墓なのです</strong>。不朽体は教会堂の中で、石棺（聖骨箱、櫃）に納めて保たれています。人は土であるから土に返るという神の言葉（<a href="https://bibleox.com/ja/jp-ni/gen/3/#L19">創. 3:19</a>）は、土から造られた人の体[1]が再び土になる、すなわち腐敗して崩れ、もともとそうであったもの、すなわち土に再びなるということを意味しています。</p><p>多くの義人は、文字どおり土の中に葬られたのではありません。むしろ義人たちは、義人を何か特別な方法で葬ろうとし、しばしば埋葬のために部屋を選びました。</p><ol><li><p><strong>アブラハムは、そのために特別に買い取った洞穴に家族を葬りました</strong>。しかも彼は住民に頼んで埋葬の場所を探し、彼らは自分たちの墓地の中から<strong>最も良い</strong>ものを提供しました（<a href="https://bibleox.com/ja/jp-ni/gen/23/#L2-6">創. 23:2-6</a>）。結局アブラハムは、自分が指し示した洞穴を自分の所有地として願い求めて買い取り（<a href="https://bibleox.com/ja/jp-ni/gen/23/#L7-13,17-20">創. 23:7-13,17-20</a>）、そこに親族を葬りました。この同じ洞穴に、アブラハム自身も（<a href="https://bibleox.com/ja/jp-ni/gen/25/#L9-10">創. 25:9-10</a>）、その妻サラも（<a href="https://bibleox.com/ja/jp-ni/gen/23/#L19">創. 23:19</a>）、イサクとその妻リベカも（<a href="https://bibleox.com/ja/jp-ni/gen/49/#L1,29-33">創. 49:1,29-33</a>）、ヤコブとその妻レアも（<a href="https://bibleox.com/ja/jp-ni/gen/49/#L1,29-33">創. 49:1,29-33</a>; <a href="https://bibleox.com/ja/jp-ni/gen/50/#L12-13">創. 50:12-13</a>）葬られました。</p></li><li><p><strong>主イエス・キリストは、岩に掘られた特別な部屋に葬られました</strong>。それは金持ちのアリマタヤのヨセフが自分のために掘ったものでした（<a href="https://bibleox.com/ja/jp-ni/mf/27/#L57,60">マタ. 27:57,60</a>; <a href="https://bibleox.com/ja/jp-ni/mk/15/#L46">マコ. 15:46</a>; <a href="https://bibleox.com/ja/jp-ni/lk/23/#L50-53">ルカ. 23:50-53</a>; <a href="https://bibleox.com/ja/jp-ni/in/19/#L41">ヨハ. 19:41</a>）。神御自身が初めからまさにそのように定め、預言者イザヤを通して予告しておられたのです。「<em>その墓は神に逆らう者と共にされ富める者と共に葬られた</em>」（<a href="https://bibleox.com/ja/jp-ni/is/53/#L9">イザ. 53:9</a>）。</p></li><li><p><strong>古代のキリスト者たちは、しばしば義人をカタコンベの特別な部屋に葬り</strong>、不朽体のそばで奉神礼を行いました（<a href="https://bibleox.com/ru/ru/w/%D0%BF%D0%BE%D1%87%D0%B8%D1%82%D0%B0%D0%BD%D0%B8%D0%B5-%D0%BC%D0%BE%D1%89%D0%B5%D0%B9-%D1%86%D0%B8%D1%82%D0%B0%D1%82%D1%8B-%D1%81%D0%B2%D1%8F%D1%82%D1%8B%D1%85#HH-%D0%9E%D0%B1%D1%89%D0%B8%D0%BD%D0%B0-%D0%9F%D0%BE%D0%BB%D0%B8%D0%BA%D0%B0%D1%80%D0%BF%D0%B0-%D0%A1%D0%BC%D0%B8%D1%80%D0%BD%D1%81%D0%BA%D0%BE%D0%B3%D0%BE-II-%D0%B2%D0%B5%D0%BA">例</a>、ロシア語）。</p></li><li><p>300年後の4世紀に、キリスト教に安全な時代が来ると、聖人たちの遺骸は教会堂の中に葬られるようになりました。義人ヨセフのように石棺に納めたり（<a href="https://bibleox.com/ja/jp-ni/gen/50/#L26">創. 50:26</a>、<a href="https://bibleox.com/ru/ru/w/%D0%BF%D0%BE%D1%87%D0%B8%D1%82%D0%B0%D0%BD%D0%B8%D0%B5-%D0%BC%D0%BE%D1%89%D0%B5%D0%B9-%D1%86%D0%B8%D1%82%D0%B0%D1%82%D1%8B-%D1%81%D0%B2%D1%8F%D1%82%D1%8B%D1%85#HH-%D0%93%D1%80%D0%B8%D0%B3%D0%BE%D1%80%D0%B8%D0%B9-%D0%9D%D0%B8%D1%81%D1%81%D0%BA%D0%B8%D0%B9-%D1%81%D0%B2%D1%8F%D1%82%D0%B8%D1%82%D0%B5%D0%BB%D1%8C-331-394">例</a>、ロシア語）、教会堂の主要部分（至聖所）の下の特別な部屋（地下聖堂）に納めたり、特別な独立した部屋（殉教者記念堂）を建てたりしたのです（<a href="https://bibleox.com/ru/ru/w/%D0%BF%D0%BE%D1%87%D0%B8%D1%82%D0%B0%D0%BD%D0%B8%D0%B5-%D0%BC%D0%BE%D1%89%D0%B5%D0%B9-%D1%86%D0%B8%D1%82%D0%B0%D1%82%D1%8B-%D1%81%D0%B2%D1%8F%D1%82%D1%8B%D1%85#HH-%D0%90%D0%BC%D0%B2%D1%80%D0%BE%D1%81%D0%B8%D0%B9-%D0%9C%D0%B5%D0%B4%D0%B8%D0%BE%D0%BB%D0%B0%D0%BD%D1%81%D0%BA%D0%B8%D0%B9-%D1%81%D0%B2%D1%8F%D1%82%D0%B8%D1%82%D0%B5%D0%BB%D1%8C-397">例</a>、ロシア語）。</p></li></ol><p>このように、<strong>最も古い時代から、義人たちは義人を土の中にではなく、特別な部屋に葬ってきました</strong>。今日の教会でも同じことが行われています。義人の遺骸は、石棺に納められて特別な部屋、すなわち奉神礼が行われる教会堂に置かれるのです。</p><p>どちらの方法をとるにしても、本質は同じです。</p><ul><li><p>聖人の遺骸を納めた石棺を置くために殉教者記念堂を建て、そこに教会が集まって奉神礼を行う。</p></li><li><p>あるいは逆に、奉神礼を行うために教会堂を建て、そこに聖人の遺骸を納めた石棺を置く。</p></li></ul><p>教会はそのごく初期の時代から、聖人たちの棺を納めるための部屋を建て、そこで奉神礼を行ってきました。</p><h3>遺骸の移送</h3><p>義人の遺骸の移送は、聖書の中で一度ならず行われており、何の非難も受けていません。たとえば、族長ヨセフはエジプトで石棺（聖骨箱、櫃）に納められて葬られ（<a href="https://bibleox.com/ja/jp-ni/gen/50/#L26">創. 50:26</a>）、のちに預言者モーセと民は、ヨセフ自身が願った場所に葬るために、40年以上にわたってヨセフの遺骸を荒れ野で運びました。詳しくは下記の「聖書の中の遺骸についての出来事」を参照してください。</p><h3>不朽体の分割</h3><p>最も古い時代から、聖なる義人たちの遺骸は、最も残酷な拷問（切り刻まれる、焼かれる）の後で、完全な姿ではなく、すべての部分が一度にそろわないまま教会に届けられました（<a href="https://bibleox.com/ja/jp-ni/mf/14/#L11">マタ. 14:11</a>; <a href="https://bibleox.com/ja/jp-ni/mk/6/#L28">マコ. 6:28</a>）。そして神はその後も、遺骸が集められていてもいなくても、義人の遺骸を通して働かれました。教会自身は、義人の遺骸が完全に保たれている場合には、教会堂に置かれた特別な棺（石棺、聖骨箱）の中で完全なまま保っています。分割は、自然災害や敵の襲撃の際に遺骸を救うために、やむをえず起こることがありました。また時には、ほかの場所で義人を崇敬するために、遺骸からごく小さな一片、かけらが取られることもあります。</p><h2>人の遺骸に対する神の態度</h2><h3>神は義人たちの遺骸を守られる</h3><blockquote><p>「<strong><mark>主に従う人</mark></strong>には災いが重なるが主はそのすべてから救い出し<strong><mark>骨の一本も損なわれることのないように彼を守ってくださる</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/ps/34/#L20-21">詩. 34:20-21</a>）</p></blockquote><blockquote><p>「イエスのところに来てみると、既に死んでおられたので、<strong>その足は折らなかった</strong>。&lt;…&gt; <strong>これらのことが起こったのは、『<mark>その骨は一つも砕かれない</mark>』という聖書の言葉が実現するためであった</strong>」（<a href="https://bibleox.com/ja/jp-ni/in/19/#L33,36">ヨハ. 19:33,36</a>）</p></blockquote><p>ここに、聖人たちの遺骸に対する神御自身の態度を見ることができます。それでも神は時に、義人たちが拷問され、首をはねられることさえ許されます（望まれるのではありません）。預言者洗礼者ヨハネの場合がそうでした（<a href="https://bibleox.com/ja/jp-ni/mf/14/#L11">マタ. 14:11</a>; <a href="https://bibleox.com/ja/jp-ni/mk/6/#L28">マコ. 6:28</a>）。しかし神は、分けられた聖人たちの遺骸を通しても恵みを与えられます。</p><h3>神は罪人たちの遺骸を辱めに渡される</h3><blockquote><p>「<strong><mark>神は人に媚びる者たちの骨をまき散らされた</mark></strong>。彼らは恥を受けた。神が彼らを退けられたからである」（<a href="https://bibleox.com/ja/gr-lxx-byz/ps/52/#L5">詩. 52:5、七十人訳</a>）<em>（ギリシア語からの訳：ὁ θεὸς διεσκόρπισεν ὀστᾶ ἀνθρωπαρέσκων）</em></p></blockquote><h2>神は義人の亡骸を通して働き続けられる</h2><p>預言者エリシャの遺骸に触れたことによって、死んだ人が生き返りました。そばで祈りがささげられている様子はないにもかかわらずです。</p><blockquote><p><em>「人々がある人を葬ろうとしていたとき、その部隊を見たので、彼をエリシャの墓に投げ込んで立ち去った。</em><strong><em><mark>その人はエリシャの骨に触れると生き返り</mark></em></strong><em>、自分の足で立ち上がった」（</em><a href="https://bibleox.com/ja/jp-ni/4ts/13/#L21"><em>王下. 13:21</em></a><em>）</em></p></blockquote><h2>神は義人が身に着けていた物を通して働き続けられる</h2><p>使徒の衣服によるいやし：</p><blockquote><p>「<strong><mark>彼が身に着けていた手ぬぐいや前掛けを持って行って</mark></strong>病人に当てると、病気はいやされ、悪霊どもも出て行くほどであった」（<a href="https://bibleox.com/ja/jp-ni/act/19/#L12">使. 19:12</a>）</p></blockquote><h2>神は義人の像（影）を通して働かれる</h2><p>使徒の影によるいやし：</p><blockquote><p>「<strong>人々は病人を大通りに運び出し</strong>、担架や床に寝かせた。<strong>ペトロが通りかかるとき、せめてその影だけでも病人のだれかにかかるようにした</strong>。また、エルサレム付近の町からも、群衆が病人や汚れた霊に悩まされている人々を連れて集まって来たが、<strong>一人残らずいやしてもらった</strong>」（<a href="https://bibleox.com/ja/jp-ni/act/5/#L15-16">使. 5:15-16</a>）</p></blockquote><h2>聖人にひれ伏すこと</h2><p>十戒の第二の戒め（<a href="https://bibleox.com/ja/jp-ni/ish/20/#L2-3">出. 20:2-3</a>; <a href="https://bibleox.com/ja/jp-ni/vtor/5/#L6-7">申. 5:6-7</a>）は、偽りの神々（偶像）を拝むことを禁じています。偽りの神々は、偽りであるうえに、存在もしません。</p><p>しかし聖人たちは存在しており、神の友であって、神々として拝まれるのではありません。聖人とその遺骸にひれ伏すことは、神の友としての彼らへの敬意を表すことです。天使、人、物へのこのようなひれ伏しは聖書の中に見られ、偶像礼拝ではありません。偶像礼拝とは<u>偽りの</u><u>神々</u>を拝むことだからです。義人たちは絶えず、人に、さまざまな物に、天使にひれ伏しています。ほかの人々も預言者たちにひれ伏しています。</p><h4><strong>天使たちの姿をとった神にひれ伏す</strong></h4><blockquote><p><em>「目を上げて見ると、</em><strong><em>三人の人</em></strong><em>が彼に向かって立っていた。アブラハムはすぐに天幕の入り口から走り出て迎え、</em><strong><em>地にひれ伏して</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/gen/18/#L2"><em>創. 18:2</em></a><em>）</em></p></blockquote><h4><strong>天使にひれ伏す</strong></h4><blockquote><p><em>「彼は答えた。『いや。わたしは主の軍の将軍である。今、着いたところだ。』ヨシュアは地にひれ伏して</em><strong><em>拝し</em></strong><em>、彼に、『わが主は、この僕に何をお言いつけになるのですか』と言うと」（</em><a href="https://bibleox.com/ja/jp-ni/nav/5/#L14"><em>ヨシュ. 5:14</em></a><em>）</em></p></blockquote><h4><strong>預言者にひれ伏す</strong></h4><blockquote><p><em>「エリコの預言者の仲間たちは目の前で彼を見て、『エリヤの霊がエリシャの上にとどまっている』と言い、彼を迎えに行って、</em><strong><em>その前で地にひれ伏した</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/4ts/2/#L15"><em>王下. 2:15</em></a><em>）</em></p></blockquote><h4><strong>神殿にひれ伏す</strong></h4><blockquote><p><em>「しかしわたしは、深い慈しみをいただいてあなたの家に入り、</em><strong><em>聖なる宮に向かってひれ伏し</em></strong><em>あなたを畏れ敬います」（</em><a href="https://bibleox.com/ja/jp-ni/ps/5/#L8"><em>詩. 5:8</em></a><em>）（七十人訳ギリシア語 προσκυνήσω πρὸς ναὸν ἅγιόν σου —「あなたの聖なる宮に向かってひれ伏します」）</em></p></blockquote><h4><strong>神の足台にひれ伏す</strong></h4><blockquote><p><em>「我らの神、主をあがめよ。</em><strong><em>その足台</em></strong><em>（足を載せる台 — 注）</em><strong><em>に向かってひれ伏せ。主は聖なる方</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/ps/99/#L5"><em>詩. 99:5</em></a><em>）（七十人訳ギリシア語 προσκυνεῖτε τῷ ὑποποδίῳ τῶν ποδῶν αὐτοῦ —「その御足の足台にひれ伏せ」）</em></p></blockquote><blockquote><p><em>「わたしたちは</em><strong><em>主のいます所に行き御足を置かれる所に向かって伏し拝もう</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/ps/132/#L7"><em>詩. 132:7</em></a><em>）</em></p></blockquote><h4><strong>契約の箱の前にひれ伏す</strong></h4><blockquote><p><em>「ヨシュアは衣服を引き裂き、イスラエルの長老たちと共に、</em><strong><em>主の箱の前で夕方まで地にひれ伏し</em></strong><em>、頭に塵をかぶった」（</em><a href="https://bibleox.com/ja/jp-ni/nav/7/#L6"><em>ヨシュ. 7:6</em></a><em>）</em></p></blockquote><h4><strong>杖にひれ伏す</strong></h4><blockquote><p><em>杖に：「『では、誓ってくれ』と言ったので、ヨセフは誓った。</em><strong><em>イスラエルは、寝台の枕もとで感謝を表した</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/gen/47/#L31"><em>創. 47:31</em></a><em>）。「感謝を表した」は、ヘブライ語原文では וַיִּשְׁתַּחוּ —「ひれ伏した」です。七十人訳では</em><strong><em>杖に</em></strong><em>（ギリシア語 προσεκύνησεν Ισραηλ ἐπὶ τὸ ἄκρον τῆς ῥάβδου αὐτοῦ —「イスラエルは自分の杖の先にひれ伏した」）となっています。</em><a href="https://bibleox.com/ja/jp-ni/evr/11/#L21"><em>ヘブ. 11:21</em></a><em>も参照。</em></p></blockquote><p>さらに多くの例（ロシア語）：<a href="https://bibleox.com/ru/ru/w/%D0%BF%D0%BE%D0%BA%D0%BB%D0%BE%D0%BD%D1%8B">ひれ伏し（伏拝）</a></p><h2>聖書の中の遺骸についての出来事</h2><h3>葬りの三日目に、携香女たちは墓を開けて主イエス・キリストの聖なる体に触れるために出かけた</h3><blockquote><p>「安息日が終わると、マグダラのマリア、ヤコブの母マリア、サロメは、<strong>イエスに油を塗りに行くために香料を買った</strong>。そして、週の初めの日の朝ごく早く、日が出るとすぐ墓に行った。彼女たちは、<strong>『だれが墓の入り口からあの石を転がしてくれるでしょうか』</strong>と話し合っていた」（<a href="https://bibleox.com/ja/jp-ni/mk/16/#L1-3">マコ. 16:1-3</a>）</p></blockquote><blockquote><p>「そして、週の初めの日の明け方早く、<strong>準備しておいた香料を持って墓に行った</strong>」（<a href="https://bibleox.com/ja/jp-ni/lk/24/#L1">ルカ. 24:1</a>）</p></blockquote><blockquote><p>「さて、安息日が終わって、週の初めの日の明け方に、マグダラのマリアともう一人のマリアが、<strong>墓を見に行った</strong>」（<a href="https://bibleox.com/ja/jp-ni/mf/28/#L1">マタ. 28:1</a>）</p></blockquote><blockquote><p>「週の初めの日、朝早く、まだ暗いうちに、マグダラのマリアは<strong>墓に行った</strong>。そして、墓から石が取りのけてあるのを見た」（<a href="https://bibleox.com/ja/jp-ni/in/20/#L1">ヨハ. 20:1</a>）</p></blockquote><h3>遺骸の移送</h3><h4>ヨセフ</h4><p>ヨセフ（ヤコブの子）は、のちに自分の遺骸をエジプトから、神が与えると約束された地へ運んでくれるよう願います。</p><blockquote><p>「ヨセフは兄弟たちに言った。『わたしは間もなく死にます。しかし、神は必ずあなたたちを顧みてくださり、この国からアブラハム、イサク、ヤコブに誓われた土地に導き上ってくださいます。』それから、<strong>ヨセフ</strong>はイスラエルの息子たちにこう言って誓わせた。『神は、必ずあなたたちを顧みてくださいます。そのときには、<strong>わたしの骨をここから携えて上ってください</strong>』」（<a href="https://bibleox.com/ja/jp-ni/gen/50/#L24-25">創. 50:24-25</a>）</p></blockquote><p>ヨセフは死に、エジプトで葬られ、石棺（聖骨箱、櫃）に納められます。</p><blockquote><p>「<strong>ヨセフ</strong>はこうして、百十歳で死んだ。人々は<strong>エジプトで</strong>彼のなきがらに薬を塗り、防腐処置をして、<strong>ひつぎに納めた</strong>」（<a href="https://bibleox.com/ja/jp-ni/gen/50/#L26">創. 50:26</a>）<em>（七十人訳ギリシア語 καὶ ἔθαψαν αὐτὸν καὶ ἔθηκαν ἐν τῇ σορῷ —「彼を葬り、棺（石棺）に納めた」）</em></p></blockquote><p>預言者モーセはヨセフの願いを果たします。</p><blockquote><p>「神は民を、葦の海に通じる荒れ野の道に迂回させられた。イスラエルの人々は、隊伍を整えてエジプトの国から上った。<strong>モーセはヨセフの骨を携えていた</strong>。ヨセフが、『神は必ずあなたたちを顧みられる。そのとき、わたしの骨をここから一緒に携えて上るように』と言って、イスラエルの子らに固く誓わせたからである」（<a href="https://bibleox.com/ja/jp-ni/ish/13/#L18-19">出. 13:18-19</a>）</p></blockquote><p>預言者モーセとイスラエルの民は、ヨセフの遺骸と共に、<strong>40年以上</strong>シナイ半島を旅しました。のちに、ヌンの子ヨシュアがヨセフの遺骸をシケムに葬ります（<a href="https://bibleox.com/ja/jp-ni/nav/24/#L32">ヨシュ. 24:32</a>）。</p><p>シナイの荒れ野を通る40年の旅、すなわちエジプトの奴隷状態から約束の地へのイスラエルの移動が、人々を罪の奴隷状態から神の約束された天の国へと導く新約の教会の生活の予型であることを考えれば、教会の生活のこの全期間を通して、神の民はいつも義人の不朽体を携えていたことになります。旧約における教会の型は、自分の国に達するまで、いつも義人の不朽体を携えていたのです。</p><h4>サウル</h4><p>サウルはペリシテ人に殺され、ヤベシュの住民は遺体を焼いて、骨を町の木の下に葬りました。</p><blockquote><p>「彼らはサウルの武具をアシュトレト神殿に納め、その遺体をベト・シャンの城壁にさらした。ギレアドのヤベシュの住民は、ペリシテ軍のサウルに対する仕打ちを聞いた。戦士たちは皆立って、夜通し歩き、<strong>サウルとその息子たちの遺体をベト・シャンの城壁から取り下ろし</strong>、ヤベシュに持ち帰って<strong>火葬に付し、彼らの骨を拾ってヤベシュのぎょりゅうの木の下に葬り</strong>、七日間、断食した」（<a href="https://bibleox.com/ja/jp-ni/1ts/31/#L10-13">サム上. 31:10-13</a>）（<a href="https://bibleox.com/ja/jp-ni/1par/10/#L12">代上. 10:12</a>）</p></blockquote><p>ダビデはサウルの遺骸をベニヤミンの地に移し、サウルの父の遺骸と共に葬ります。</p><blockquote><p>「ダビデはギレアドのヤベシュの人々のところへ行って、<strong>サウルの骨</strong>とその子ヨナタンの骨を<strong>受け取った</strong>。&lt;…&gt; ダビデはそこから<strong>サウルの骨</strong>とその子ヨナタンの骨を<strong>運び</strong>、人々は今回さらされた者たちの骨を集め、<strong>サウルとその子ヨナタンの骨と共に</strong>ベニヤミンの地ツェラにある<strong>サウルの父キシュの墓に葬った</strong>。人々は王の命令をすべて果たした。この後、神はこの国の祈りにこたえられた」（<a href="https://bibleox.com/ja/jp-ni/2ts/21/#L12-14">サム下. 21:12-14</a>）</p></blockquote><h3>埋葬が遅れた例</h3><p>ヤコブは77日以上たってから葬られました。</p><blockquote><p>「ヨセフは父の顔に伏して泣き、口づけした。ヨセフは自分の侍医たちに、父のなきがらに薬を塗り、防腐処置をするように命じたので、医者はイスラエルにその処置をした。そのために<strong>四十日</strong>を費やした。この処置をするにはそれだけの日数が必要であった。<strong>エジプト人は七十日の間喪に服した</strong>。&lt;…&gt;『実は、父がわたしに誓わせて、「わたしは間もなく死ぬ。そのときは、<strong>カナンの土地に用意してある墓にわたしを葬ってくれ</strong>」と申しました。ですから、どうか父を葬りに行かせてください。わたしはまた帰って参ります。』&lt;…&gt; 一行はヨルダン川の東側にあるゴレン・アタドに着き、そこで非常に荘厳な葬儀を行った。父の追悼の儀式は<strong>七日間</strong>にわたって行われた」（<a href="https://bibleox.com/ja/jp-ni/gen/50/#L1-3,5,10">創. 50:1-3,5,10</a>）</p></blockquote><h3>預言者は、別の預言者の遺骸と共に葬られることを願う</h3><blockquote><p>「<strong>老預言者</strong>は、神の人のなきがらを抱えてろばの背に乗せ、自分の町に持ち帰り、彼を弔い、葬った。老預言者は自分の墓にそのなきがらを納め、『なんと不幸なことよ、わが兄弟』と言って彼を弔った。埋葬の後、老預言者は息子たちに言った。<strong>『わたしが死んだら、神の人を葬った墓にわたしを葬り、あの人の骨のそばにわたしの骨を納めてくれ』</strong>」（<a href="https://bibleox.com/ja/jp-ni/3ts/13/#L29-31">王上. 13:29-31</a>）</p></blockquote><h2>ヤコブは妻の遺骸を敬う</h2><blockquote><p>「ラケルは死んで、エフラタ、すなわち今日のベツレヘムへ向かう道の傍らに葬られた。<strong>ヤコブは、彼女の葬られた所に記念碑を立てた</strong>。それは、ラケルの葬りの碑として今でも残っている」（<a href="https://bibleox.com/ja/jp-ni/gen/35/#L19-20">創. 35:19-20</a>）</p></blockquote><h2>ヨシヤ王は預言者の遺骸を敬う</h2><p>ヨシヤについては、彼の前にも後にも彼のような王はいなかったと言われています。心を尽くし、魂を尽くし、力を尽くして神に立ち帰ったからです（<a href="https://bibleox.com/ja/jp-ni/4ts/23/#L25">王下. 23:25</a>）。ユダの王ヨシヤは幼いころから神に従順であり、成人すると、自分の国から異教を清め始めました。異教の像、祭壇、香をたくための異教の高台、異教の聖なる森を破壊し、偶像の祭司たちの奉仕を禁じ、魔術師や死者を呼び出す者たちを一掃し、エルサレムの神の神殿から異教の物を取り除いて修理し、聖書の書物を見つけ、それが民の前で読まれ、民は神との契約に入れられました。ヨシヤは異教の聖所を破壊しただけでなく、人の骨をまき散らしてそれを汚そうとしました。</p><blockquote><p>「王はエルサレムの東、つまり滅びの山の南にあった聖なる高台を汚した。これはイスラエルの王ソロモンが、シドン人の憎むべき神アシュトレトのため、モアブ人の憎むべき神ケモシュのため、アンモン人の忌むべき神ミルコムのために築いたものであった。彼は石柱を砕き、アシェラ像を切り倒し、<strong>人の骨でその場所を満たした</strong>」（<a href="https://bibleox.com/ja/jp-ni/4ts/23/#L13-14">王下. 23:13-14</a>）</p></blockquote><p>ヨシヤはヤロブアムの古い偶像を破壊し、そこにあった墓を汚しました。</p><blockquote><p>「彼はまたベテルにあった祭壇と、イスラエルに罪を犯させたネバトの子ヤロブアムが造った聖なる高台、すなわちその祭壇と聖なる高台を取り壊し、更に聖なる高台を焼いて粉々に砕き、アシェラ像を焼き捨てた。<strong>ヨシヤは振り向いて、山に墓があるのを見、その墓の骨を取りにやり、その骨を祭壇の上で焼いて祭壇を汚した</strong>。かつて神の人がこのことを告げたが、その神の人の告げた主の言葉のとおりになった」（<a href="https://bibleox.com/ja/jp-ni/4ts/23/#L15-16">王下. 23:15-16</a>）</p></blockquote><p>しかし、ある記念碑に出会い、それがこれらの出来事を予告した預言者の墓であると知ると、彼はその遺骸を敬意をもって扱います。しかも、記念碑があること自体が、それ以前から預言者が崇敬されていたことを証ししています。</p><blockquote><p>「ヨシヤは、<strong>『あそこに見える石碑は何か』</strong>と言った。町の人々は、<strong>『神の人の墓です</strong>。この人はユダから来て、あなたがベテルの祭壇になさったことを予告しました』と答えたので、彼は、<strong><mark>『そのままにしておくがよい。だれもその骨に触れるな』と言った。こうして人々は、サマリアから来た預言者の骨とともに彼の骨をそのままにしておいた</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/4ts/23/#L17-18">王下. 23:17-18</a>）</p></blockquote><p>この同じ神の人が、以前にこのことが起こると予告していました。</p><blockquote><p>「その人は主の言葉に従って祭壇に向かって呼びかけた。『祭壇よ、祭壇よ、主はこう言われる。「見よ、<strong>ダビデの家に男の子が生まれる。その名はヨシヤという。彼は、お前の上で香をたく聖なる高台の祭司たちを、お前の上でいけにえとしてささげ、人の骨をお前の上で焼く</strong>」』」（<a href="https://bibleox.com/ja/jp-ni/3ts/13/#L2">王上. 13:2</a>）</p></blockquote><h2>シモンは家族の遺骸を敬う</h2><p>大祭司<a href="https://en.wikipedia.org/wiki/Jonathan_Apphus">ヨナタン</a>（英語）（<a href="https://bibleox.com/ja/jp-ni/1mak/10/#L20">１マカ. 10:20</a>; <a href="https://bibleox.com/ja/jp-ni/1mak/11/#L57">１マカ. 11:57</a>）はバスカマに葬られました。のちに、その兄弟の大祭司シモン（<a href="https://bibleox.com/ja/jp-ni/1mak/13/#L36,42">１マカ. 13:36,42</a>）は、その遺骸を先祖の町モデインに移します。そこには以前にユダが葬られていました（<a href="https://bibleox.com/ja/jp-ni/1mak/9/#L19">１マカ. 9:19</a>）。シモンは大きな建造物を建て、それによって家族の遺骸を敬おうとします。</p><blockquote><p>「バスカマ近くに来たとき、トリフォンは<strong>ヨナタンを殺害し、そこに埋めた</strong>。&lt;…&gt; シモンは人を遣わして、<strong>兄弟ヨナタンの遺骨を取って来させ、それを先祖の町モデインに葬った</strong>。全イスラエルはヨナタンのために激しく胸を打ち、何日にもわたって嘆き悲しんだ。シモンは、父と兄弟たちの墓の上に記念碑を建てたが、それは裏も表も滑らかに磨かれた石で飾られ、高くそびえたっていた。また父母と四人の兄弟のために、互いに向き合う七つのピラミッドを建立した。更にそのピラミッドと調和した巨大な石柱を周囲に建て、これらの石柱の一本一本に<strong>永遠の名を記念して</strong>、甲冑を彫り込み、海路を行く者が皆見ることのできるよう、甲冑の傍らに船を刻んだ。彼がモデインに作ったこの<strong>墓碑</strong>は今日に至るまで残っている」（<a href="https://bibleox.com/ja/jp-ni/1mak/13/#L23,25-30">１マカ. 13:23,25-30</a>）</p></blockquote><h2>関連する引用</h2><ol><li><p><a href="https://bibleox.com/ja/ja/w/Vs4n_聖人の崇敬/">聖人の崇敬</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/%D0%B8%D0%BA%D0%BE%D0%BD%D1%8B-%D0%B8%D0%BA%D0%BE%D0%BD%D0%BE%D0%BF%D0%BE%D1%87%D0%B8%D1%82%D0%B0%D0%BD%D0%B8%D0%B5-%D0%B8%D0%BA%D0%BE%D0%BD%D0%BE%D0%B1%D0%BE%D1%80%D1%87%D0%B5%D1%81%D1%82%D0%B2%D0%BE">イコンとその崇敬、聖像破壊</a></p></li><li><p><a href="https://bibleox.com/ja/ja/w/Ps5r_聖人への祈り/">聖人への祈り</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/%D1%87%D0%B5%D0%BB%D0%BE%D0%B2%D0%B5%D0%BA-%D1%85%D1%80%D0%B0%D0%BC-%D0%91%D0%BE%D0%B6%D0%B8%D0%B9">人は神の神殿である</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/%D1%81%D0%BE%D1%81%D1%82%D0%B0%D0%B2-%D1%87%D0%B5%D0%BB%D0%BE%D0%B2%D0%B5%D0%BA%D0%B0">人間の構成</a></p></li></ol>

  - src: страдание-за-Христа
    path: Sf7x_キリストのための苦しみ
    title: キリストのための苦しみ
    menu: { parent: "教会/聖人", title: "キリストのための苦しみ", priority: 27 }
    body: |-
      <h2>キリスト者には、信じることだけでなく、キリストのために苦しむことも与えられている</h2><blockquote><p>「あなたがたは一つの霊によってしっかり立ち、心を合わせて福音の信仰のために共に戦っており、どんなことがあっても、反対者たちに脅されてたじろぐことはないのだと。このことは、反対者たちに、彼ら自身の滅びとあなたがたの<strong>救い</strong>を<strong>示すもの</strong>です。これは神によることです。つまり、<strong><mark>あなたがたには、キリストを信じることだけでなく、キリストのために苦しむことも、恵みとして与えられているのです</mark></strong>。あなたがたは、わたしの戦いをかつて見、今またそれについて聞いています。<strong><mark>その同じ戦いをあなたがたは戦っているのです</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/fil/1/#L27-30">フィリ. 1:27-30</a>）</p></blockquote><h2>キリストのための迫害についての預言</h2><blockquote><p>「『僕は主人にまさりはしない』と、わたしが言った言葉を思い出しなさい。<strong>人々がわたしを迫害したのであれば、あなたがたをも<mark>迫害するだろう</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/in/15/#L20">ヨハ. 15:20</a>）</p></blockquote><blockquote><p>「義のために迫害される人々は、幸いである、天の国はその人たちのものである。<strong>わたしのために<mark>ののしられ、迫害され</mark>、身に覚えのないことであらゆる悪口を浴びせられるとき、あなたがたは幸いである</strong>。喜びなさい。大いに喜びなさい。<strong>天には大きな報いがある</strong>。あなたがたより前の預言者たちも、同じように迫害されたのである」（<a href="https://bibleox.com/ja/jp-ni/mf/5/#L10-12">マタ. 5:10-12</a>）</p></blockquote><blockquote><p>「<strong>人々に憎まれるとき、また、人の子のために追い出され、<mark>ののしられ</mark>、汚名を着せられるとき、あなたがたは幸いである</strong>。その日には、喜び踊りなさい。<strong>天には大きな報いがある</strong>。この人々の先祖も、預言者たちに同じことをしたのである」（<a href="https://bibleox.com/ja/jp-ni/lk/6/#L22-23">ルカ. 6:22-23</a>）</p></blockquote><h2>預言の成就</h2><p>使徒たちは、キリストのために苦しんだことを喜びました。</p><blockquote><p>「それで使徒たちは、<strong>イエスの名のために<mark>辱めを受けるほどの者にされたことを喜び</mark></strong>、最高法院から出て行き」（<a href="https://bibleox.com/ja/jp-ni/act/5/#L41">使. 5:41</a>）</p></blockquote><blockquote><p>「わたしたちはキリストのために愚か者となっているが、あなたがたはキリストを信じて賢い者となっています。わたしたちは弱いが、あなたがたは強い。あなたがたは尊敬されているが、わたしたちは侮辱されています。<strong>今の今まで</strong>わたしたちは、飢え、渇き、着る物がなく、虐待され、身を寄せる所もなく、苦労して自分の手で稼いでいます。<strong><mark>侮辱されては</mark></strong>祝福し、<strong><mark>迫害されては</mark></strong>耐え忍び、<strong><mark>ののしられては</mark></strong>優しい言葉を返しています。今に至るまで、わたしたちは世の屑、すべてのものの滓とされています」（<a href="https://bibleox.com/ja/jp-ni/1kor/4/#L10-13">１コリ. 4:10-13</a>）</p></blockquote><h2>キリストのための苦しみを恐れるなという呼びかけ</h2><blockquote><p>「愛する人たち、あなたがたを試みるために身にふりかかる<strong>火のような試練を</strong>、何か思いがけないことが生じたかのように、<strong>驚き怪しんではなりません</strong>。むしろ、キリストの苦しみにあずかればあずかるほど喜びなさい。それは、キリストの栄光が現れるときにも、喜びに満ちあふれるためです。<strong><mark>あなたがたはキリストの名のために非難されるなら、幸いです</mark></strong>。栄光の霊、すなわち神の霊が、あなたがたの上にとどまってくださるからです。あなたがたのうちだれも、人殺し、泥棒、悪者、あるいは、他人に干渉する者として、苦しみを受けることがないようにしなさい。しかし、<strong><mark>キリスト者として苦しみを受けるのなら、決して恥じてはなりません</mark>。むしろ、キリスト者の名で呼ばれることで、神をあがめなさい</strong>」（<a href="https://bibleox.com/ja/jp-ni/1pet/4/#L12-16">１ペト. 4:12-16</a>）</p></blockquote><blockquote><p>「もし、善いことに熱心であるなら、だれがあなたがたに害を加えるでしょう。しかし、<strong>義のために苦しみを受けるのであれば、幸いです</strong>。人々を恐れたり、心を乱したりしてはいけません」（<a href="https://bibleox.com/ja/jp-ni/1pet/3/#L13-14">１ペト. 3:13-14</a>）</p></blockquote><h2>キリストのための迫害に耐えることへの報いの約束</h2><p>キリストのための苦しみは救いのしるしです。</p><blockquote><p>「あなたがたは一つの霊によってしっかり立ち、心を合わせて福音の信仰のために共に戦っており、どんなことがあっても、<strong>反対者たちに脅されてたじろぐことはない</strong>のだと。このことは、反対者たちに、彼ら自身の滅びとあなたがたの<strong>救い</strong>を<strong>示すもの</strong>です。これは神によることです。つまり、あなたがたには、キリストを信じることだけでなく、<strong>キリストのために苦しむことも</strong>、恵みとして与えられているのです。あなたがたは、わたしの戦いをかつて見、今またそれについて聞いています。<strong>その同じ戦いをあなたがたは戦っているのです</strong>」（<a href="https://bibleox.com/ja/jp-ni/fil/1/#L27-30">フィリ. 1:27-30</a>）</p></blockquote><p>キリストと共に苦しむ者は、キリストと共に栄光も受けます。</p><blockquote><p>「もし子供であれば、相続人でもあります。神の相続人、しかもキリストと共同の相続人です。<strong>キリストと共に苦しむなら、共にその栄光をも受けるからです</strong>」（<a href="https://bibleox.com/ja/jp-ni/rim/8/#L17">ロマ. 8:17</a>）</p></blockquote><p>キリストと共に死ぬ者は、キリストと共に生き、キリストと共に支配します。そしてキリストは、御自分を否む者を否まれます。</p><blockquote><p>「イエス・キリストのことを思い起こしなさい。わたしの宣べ伝える<strong>福音</strong>によれば、この方は、ダビデの子孫で、死者の中から復活されたのです。<strong>この福音のためにわたしは苦しみを受け、ついに犯罪人のように鎖につながれています</strong>。しかし、神の言葉はつながれていません。&lt;…&gt; 次の言葉は真実です。<strong>『わたしたちは、キリストと共に死んだのなら、キリストと共に生きるようになる。耐え忍ぶなら、キリストと共に支配するようになる。キリストを否むなら、キリストもわたしたちを否まれる』</strong>」（<a href="https://bibleox.com/ja/jp-ni/2tim/2/#L8-12">２テモ. 2:8-12</a>）</p></blockquote><p>主に結ばれて死ぬ人は幸いです。</p><blockquote><p>「また、わたしは天からこう告げる声を聞いた。『書き記せ。「<strong>今から後、主に結ばれて死ぬ人は幸いである</strong>」と。』“霊”も言う。『然り。彼らは労苦を解かれて、安らぎを得る。その行いが報われるからである』」（<a href="https://bibleox.com/ja/jp-ni/otkr/14/#L13">黙. 14:13</a>）</p></blockquote><p>キリストのために殺された人々の魂は、天でキリストと共に生きています。</p><blockquote><p>「小羊が第五の封印を開いたとき、<strong>神の言葉と自分たちがたてた証しのために殺された人々の魂</strong>を、わたしは祭壇の下に見た。彼らは大声でこう叫んだ。<strong>『真実で聖なる主よ、いつまで裁きを行わず、地に住む者にわたしたちの血の復讐をなさらないのですか。』</strong>すると、<strong>その一人一人に、白い衣が与えられ</strong>、また、<strong>自分たちと同じように殺されようとしている兄弟であり</strong>、仲間の僕である者たち<strong>の数が満ちるまで</strong>、なお、しばらく静かに待つようにと告げられた」（<a href="https://bibleox.com/ja/jp-ni/otkr/6/#L9-11">黙. 6:9-11</a>）</p></blockquote>
