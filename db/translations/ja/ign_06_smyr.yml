    path: Ig1S_スミルナの教会への手紙
    title: スミルナの教会への手紙
    meta_desc: アンティオキアの聖イグナティオス（テオフォロス）がスミルナの教会に宛てた手紙。キリストの受肉と聖体の真実を語る。ギリシア語原文からの翻訳と注。
    menu: { parent: "手紙", title: "スミルナの教会への手紙", priority: 5 }
    body: |-
      <h2>0</h2><p>イグナティオス、またの名をテオフォロス[1]より、父なる神と愛するイエス・キリストの教会へ。あらゆる賜物のうちに憐れみを受け、信仰と愛とに満たされ、どの賜物にも欠けることがなく、神に最もふさわしく、聖なるものを担う、アジアのスミルナにある教会へ。汚れのない霊と神の言葉のうちに、心からの喜びを送ります。</p>
      <h2>1</h2><p>1. 私は、あなたがたをこれほど賢くしてくださった神イエス・キリストをたたえます。私は知りました。あなたがたが揺るがない信仰のうちに整えられ、肉においても霊においても、いわば主イエス・キリストの十字架に釘づけられ、キリストの血によって愛のうちに堅く据えられていることを。あなたがたは私たちの主について、確信に満たされています。この方は肉によれば真実にダビデの家系から出た方[2]、神の御心と力によれば神の子であり、真実に処女から生まれ、「正しいことをすべて行う」ために[3]ヨハネから洗礼を受けられました。</p><p>2. この方はポンティオ・ピラトと領主ヘロデ[4]のもとで、私たちのために肉において真実に釘づけられました。その実から、すなわち神に祝福されたこの方の受難から、私たちは生まれたのです。それは、この方が復活によって、ユダヤ人のうちにも異邦人のうちにもいる御自分の聖なる信実な人々のために、御自分の教会の一つの体のうちに[5]、世々にわたって旗を掲げるためでした[6]。</p>
      <h2>2</h2><p>この方は、私たちが救われるために、これらすべての苦しみを私たちのために受けられたのです。そして真実に苦しみを受けられたように、真実に御自身を復活させられました。ある不信仰な者たちが言うように、苦しみを受けたのは見せかけにすぎない[7]というのではありません。見せかけにすぎないのは彼ら自身です。彼らが考えているとおりのことが、彼らの身に起こるでしょう。彼らは体を持たない、悪霊のような者となるのです。</p>
      <h2>3</h2><p>1. 私は、この方が復活の後にも肉のうちにおられたことを知っており、またそう信じています。</p><p>2. この方がペトロと共にいた人々のところに来られたとき、彼らにこう言われました。「わたしに触れてよく見なさい。わたしが体のない悪霊ではないことが分かるだろう」[8]。すると彼らはすぐにこの方に触れて、信じました。この方の肉と霊とに堅く結ばれたのです。そのため彼らは死をも軽んじ、死にまさる者として見いだされました。</p><p>3. 復活の後、この方は肉を持つ者として彼らと共に食べ、また飲まれました[9]。霊においては父と一つであられたのですが。</p>
      <h2>4</h2><p>1. 愛する人々よ、私がこれらのことを勧めるのは、あなたがたもそのとおりであることを知っているからです。しかし私は、人の姿をした獣たちからあなたがたを前もって守りたいのです。あなたがたは彼らを迎え入れてはならないばかりか、できることなら出会ってもなりません。ただ、彼らのために祈りなさい。なんとかして彼らが悔い改めるように。それは難しいことですが、私たちの真の命であるイエス・キリストは、それをなす力を持っておられます。</p><p>2. もしこれらのことが、私たちの主によって見せかけだけで行われたのなら、私が縛られているのも見せかけにすぎないことになります。なぜ私は自分自身を死に、火に、剣に、獣に引き渡したのでしょうか。いいえ、剣に近い者は神に近く、獣の間にいる者は神の間にいるのです。ただイエス・キリストの名において、この方と共に苦しむために、私はすべてを耐え忍んでいます。完全な人となられたこの方[10]が、私を強めてくださるのです。</p>
      <h2>5</h2><p>1. ある人々は知らずにこの方を否定しています。いや、むしろ彼らのほうがこの方から否定されたのです[11]。彼らは真理の弁護者ではなく、死の弁護者です。預言も、モーセの律法も、今に至るまで福音も、私たち一人一人の苦しみも、彼らを説得することはできませんでした。</p><p>2. 彼らは私たちについても同じように考えているのです[12]。もし、だれかが私をほめながら、私の主が肉を担っておられることを認めず、主を冒涜するなら、それが私に何の益になるでしょう。こう言う者は、主を完全に否定したのであり、自分自身が屍を担う者[13]なのです。</p><p>3. 彼らの名は信仰のないものなので、私はそれを書き記すことはしないことにしました。彼らが受難へと――それは私たちの復活です――悔い改めて立ち帰るまでは、彼らのことを思い出すことさえ私にはありませんように。</p>
      <h2>6</h2><p>1. だれも思い違いをしてはなりません。天上のものも、天使たちの栄光も、見えるものと見えない支配者たちも[14]、もしキリストの血を信じないなら、彼らにも裁きがあります。「受け入れることのできる者は受け入れなさい」[15]。地位がだれをも高ぶらせてはなりません。すべては信仰と愛であり、これにまさるものは何もないのです。</p><p>2. 私たちに来たイエス・キリストの恵みについて異なる考えを抱いている者たちを、よく見なさい。彼らがどれほど神の御心に逆らっているかを。彼らは愛を気にかけません。やもめのことも、孤児のことも、苦しんでいる人のことも、縛られている人や解放された人のことも、飢えている人や渇いている人のことも気にかけないのです。</p>
      <h2>7</h2><p>1. 彼らは聖体（エウカリスティア）と祈りから遠ざかっています。聖体が、私たちの罪のために苦しみを受け、父がその慈しみによって復活させられた、私たちの救い主イエス・キリストの肉であることを認めないからです[16]。こうして、神の賜物に反論する者たちは、論争のうちに死んでいきます。彼らにとっては、愛餐（アガペー）を守る[17]ほうが益であったでしょう。そうすれば彼らも復活したでしょうに。</p><p>2. このような者たちからは遠ざかり、ひそかにも公にも彼らについて語らず、むしろ預言者たちに、とりわけ福音に心を向けるのがふさわしいのです。福音のうちに、受難は私たちに明らかにされ、復活は成し遂げられています。分裂を、悪の始まりとして避けなさい。</p>
      <h2>8</h2><p>1. イエス・キリストが父に従ったように、皆、主教に従いなさい。使徒たちに従うように司祭団に従いなさい。輔祭たちを神の掟として敬いなさい。主教を抜きにして、教会に関わることをだれも何一つ行ってはなりません。主教のもとで、あるいは主教が委ねた人のもとで行われる聖体を、確かなものと見なしなさい。</p><p>2. 主教が姿を現す所に、会衆もいなければなりません。イエス・キリストがおられる所に、公なる教会[18]があるのと同じです。主教を抜きにして、洗礼を授けることも、愛餐（アガペー）を行うこと[19]も許されていません。しかし主教がよしとすることは、神にも喜ばれることです。それは、あなたがたが行うすべてのことが、揺るぎなく確かなものとなるためです。</p>
      <h2>9</h2><p>1. まだ神へと悔い改める時のあるうちに、私たちが正気に立ち帰るのは理にかなったことです。神と主教とを知ることはよいことです。主教を敬う者は神に敬われ、主教に隠れて何かを行う者は悪魔に仕えているのです。</p><p>2. ですから、あらゆることがあなたがたにとって恵みのうちに満ちあふれますように。あなたがたはそれにふさわしいからです。あなたがたはあらゆる点で私を安らがせてくれました。イエス・キリストもあなたがたを安らがせてくださいますように。私が不在のときも、そばにいるときも、あなたがたは私を愛してくれました。神があなたがたの報いです。神のためにすべてを耐え忍ぶなら、あなたがたは神に到達するでしょう。</p>
      <h2>10</h2><p>1. 神の言葉のために私について来たフィロンとレオス・アガトプスを、神の奉仕者として迎えてくれたことは、よいことでした。彼らも、あなたがたがあらゆる仕方で彼らを安らがせてくれたことについて、あなたがたのために主に感謝しています。あなたがたにとって、何一つむだになることはありません。</p><p>2. 私の霊と私の鎖とは、あなたがたのための身代わりの命です[20]。あなたがたはこの鎖を軽蔑せず、恥じることもありませんでした[21]。完全な希望であるイエス・キリストも、あなたがたを恥じることはないでしょう。</p>
      <h2>11</h2><p>1. あなたがたの祈りは、シリアのアンティオキアの教会にまで届きました。私はそこから、神に最もふさわしい鎖に縛られて来て、すべての人に挨拶を送っています。私はそこの者である値打ちもなく、彼らのうちで最も小さい者ですが、御心によってふさわしい者とされました。それは私の良心によるのではなく、神の恵みによるのです。この恵みが完全に私に与えられ、あなたがたの祈りによって私が神に到達することを願っています。</p><p>2. ですから、地においても天においてもあなたがたの業が完全なものとなるよう、あなたがたの教会は、神の誉れのために神の使節を選び[22]、シリアに行って、彼らが平和を得て、本来の偉大さを取り戻し、彼ら自身の体（共同体）が回復されたことを、共に喜ぶのがふさわしいのです。</p><p>3. あなたがたのうちのだれかを手紙と共に遣わし、神によって彼らにもたらされた凪を共にたたえさせるのは、神にふさわしいことだと私には思われました。あなたがたの祈りによって、彼らはすでに港に着いたのです。あなたがたは完全な者なのですから、完全なことを考えなさい[23]。あなたがたが善いことを行おうと望むなら、神はいつでもそれを与えてくださるのです。</p>
      <h2>12</h2><p>1. トロアスにいる兄弟たちの愛が、あなたがたに挨拶を送ります。私はそのトロアスから、ブッロスに託してあなたがたに書いています。彼は、あなたがたが、あなたがたの兄弟であるエフェソの人々と共に私に付けて送ってくれた人で、あらゆる点で私を安らがせてくれました。神への奉仕の生きた手本である彼に、皆が倣ってくれればよいのに。恵みが、あらゆる点で彼に報いてくださいますように。</p><p>2. 私は、神にふさわしい主教と、神にふさわしい司祭団と、私の同労のしもべである輔祭たちと、あなたがた一人一人、また皆に、イエス・キリストの名において、またこの方の肉と血において、肉と霊とにおけるこの方の受難と復活において、神とあなたがたとの一致のうちに挨拶を送ります。恵みと憐れみと平和と忍耐とが、いつもあなたがたにありますように。</p>
      <h2>13</h2><p>1. 私は、私の兄弟たちの家族に、その妻子と共に挨拶を送ります。また、やもめと呼ばれているおとめたち[24]にも挨拶を送ります。父の力のうちに、お元気で。私と共にいるフィロンが、あなたがたに挨拶を送ります。</p><p>2. 私はタウイアの家族に挨拶を送ります。彼女が、肉においても霊においても、信仰と愛とのうちに堅く据えられるよう祈ります。私にとって慕わしい名を持つアルケーにも、比類のないダフノスにも、エウテクノスにも、そしてすべての人に名を挙げて挨拶を送ります。神の恵みのうちに、お元気で。</p>
    references: |-
      <ol><li><p>イグナティオスはトロアスから、輔祭ブッロスに託してこの手紙をスミルナに送りました（<a href="#HH-12">12:1</a>）。キリストの受肉と受難を固く信じていることをほめた後、キリストの誕生・受難・復活の真実を否定する仮現論者（ドケティスト）を退け（2–7章）、主教に従うよう勧め（8–9章）、最後に感謝と挨拶を述べています（10–13章）。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/rim/1/#L3-4">ロマ. 1:3-4</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/mf/3/#L15">マタ. 3:15</a> 参照。</p></li><li><p>ガリラヤの領主ヘロデ・アンティパス（<a href="https://bibleox.com/ja/jp-ni/lk/3/#L1">ルカ. 3:1</a>、<a href="https://bibleox.com/ja/jp-ni/lk/23/#L7">ルカ. 23:7</a> 参照）。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/ef/2/#L16">エフェ. 2:16</a> 参照。</p></li><li><p>σύσσημον —「旗じるし」。<a href="https://bibleox.com/ja/jp-ni/is/49/#L22">イザ. 49:22</a> 参照。十字架にかけられ復活したキリストのもとに、諸国民が集められることを言っています。</p></li><li><p>τὸ δοκεῖν —「見せかけ」。<a href="https://bibleox.com/ja/ja/w/Ig1T_トラレスの教会への手紙#HH-10">『トラレスの教会への手紙』10章</a> の注を参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/lk/24/#L39">ルカ. 24:39</a> 参照。イグナティオスはこの言葉を、ルカ福音書とは少し異なる形で引いています。口伝によるとも、外典の文書によるとも考えられています（ヒエロニムスは「ナザレ人の福音書」を、オリゲネスは「ペトロの教え」を挙げています）。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/lk/24/#L42-43">ルカ. 24:42-43</a>、<a href="https://bibleox.com/ja/jp-ni/act/10/#L41">使. 10:41</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/ef/4/#L13">エフェ. 4:13</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/mf/10/#L33">マタ. 10:33</a> 参照。</p></li><li><p>私たちの苦しみ（殉教）も、見せかけにすぎないと考えている、の意。</p></li><li><p>σαρκοφόρος「肉を担う者」と νεκροφόρος「屍を担う者」とをかけた言葉遊びです。</p></li><li><p>天使の位階を含む、天上の力のことです。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/mf/19/#L12">マタ. 19:12</a> 参照。</p></li><li><p>仮現論者たちは、聖体がキリストの受難を受け、父によって復活させられたまことの肉であることを認めませんでした。聖体がキリストの体の「象徴」であることなら、だれでも認めることができます。彼らが退けたのは、それがまことの肉であるということなのです（<a href="https://bibleox.com/ja/jp-ni/in/6/#L54">ヨハ. 6:54</a> 参照）。</p></li><li><p>ἀγαπᾶν。直訳は「愛すること」ですが、ここでは聖体の祭儀と結びついた「愛餐（アガペー）を守る」の意と解しました。文脈は聖体について語っており、「復活するため」という目的は、主の肉と血を受ける者は終わりの日に復活させられるという言葉（<a href="https://bibleox.com/ja/jp-ni/in/6/#L54">ヨハ. 6:54</a>）に対応しています。また、同じ語は <a href="#HH-8">8:2</a> で、主教の許しなしに行ってはならない愛餐を指して用いられています。主教の許しがなければ「愛する」ことができないというのは意味をなさないので、そこでは明らかに愛餐のことです。</p></li><li><p>ἡ καθολικὴ ἐκκλησία。「普遍的な、全体としての教会」。現存する文献でこの表現が使われているのは、ここが最初です。ニケア・コンスタンティノープル信経の日本正教会訳では「公なる教会」と訳されています。</p></li><li><p>ἀγάπην ποιεῖν —「愛餐（アガペー）を行う」。当時、聖体（パンを裂くこと）と結びついて行われていた教会の共同の食事です。</p></li><li><p>ἀντίψυχον。<a href="https://bibleox.com/ja/ja/w/Ig1E_エフェソの教会への手紙#HH-21">『エフェソの教会への手紙』21:1</a> の注を参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/2tim/1/#L16">２テモ. 1:16</a> 参照。</p></li><li><p>θεοπρεσβευτής —「神の使節」。χειροτονῆσαι（選ぶ）については <a href="https://bibleox.com/ja/ja/w/Ig1F_フィラデルフィアの教会への手紙#HH-10">『フィラデルフィアの教会への手紙』10:1</a> の注を参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/fil/3/#L15">フィリ. 3:15</a> 参照。</p></li><li><p>やもめとして教会に登録され、奉仕に当たっていた女性たちの中に、おとめも含まれていたことを示しています（<a href="https://bibleox.com/ja/jp-ni/1tim/5/#L3-10">１テモ. 5:3-10</a> 参照）。</p></li></ol>
      <p>翻訳：ロジオン・ヴラソフ（AIツールを併用）。底本：ギリシア語本文（<a href="https://bibleox.com/ja/grc/w/ΙγνΘ_Σμ">本サイトのギリシア語版</a>。明らかな脱落はライトフット版・ホームズ版で補った）。参照：ロシア語訳（『初期教会教父選集』ブリュッセル、1988年）、英訳（Roberts–Donaldson）、仏訳（Genoude、1837年）。聖書の引用は新共同訳による。</p>
