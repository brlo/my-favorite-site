    body: |-
      <p>クレメンスの著作をギリシア語原文で読むには<a href="https://bibleox.com/ja/grc/w/Κλήμης_Ρώμης">こちら</a>。ほかの言語への切り替えは、著作の一覧の上でもできます。</p><p><strong>記憶日</strong>：11月25日（新暦12月8日）</p><h2>生涯</h2><p>主の降誕後の1世紀に生まれました。古代の教会では、最も重要で傑出したキリスト教の聖人の一人として尊ばれ、使徒ペトロとパウロの弟子でした。おそらくこの人こそ、使徒パウロがフィリピの信徒への手紙に名を挙げているクレメンスでしょう（<a href="https://bibleox.com/ja/jp-ni/fil/4/#L3">フィリ. 4:3</a>）。</p><p>ある作者たち（テルトゥリアヌス、ストリドンのヒエロニムス、キプロスのエピファニオス）は、クレメンスが使徒ペトロによって主教に叙任されたと主張しています。しかしながら、その奉仕と死について確かな記録は何も伝わっていません。たとえば、2世紀の80年代か90年代、リヨンの致命者エイレナイオスは、ローマの主教たちの中で殉教の死を遂げたのは聖テレスフォロス（127/8〜137/8）ただ一人だと断言しています。しかし4世紀以降、クレメンスは数多くの伝説の主人公となりました。6世紀以降には、ヘルソネソ（クリミア）における殉教の物語が広く知られ、聖人の崇敬は後になってルーシにも広まることになります。</p><p>今日、その人格と奉仕についての最も鮮明で、疑いの余地のない証しの一つは、現存する（写本によって伝わる）コリントの共同体への手紙です。現地のキリスト者の間に叛乱が起こったのに際して、聖クレメンスがこれを記しました。作者の権威に加えて、この手紙は彼の熱意と愛と霊的な知恵を示しています。</p><p>2世紀のエイレナイオス（リヨンの）は、この手紙についてこう書いています：</p><blockquote><p>3. 祝福された使徒たちは、教会を建てて整えた後、主教職の奉仕をリノスに託しました。このリノスのことを、パウロはテモテへの手紙で言及しています。リノスの後をアネンクレトスが継ぎ、その後、使徒たちから三番目の位置で、<strong>クレメンスが主教職を受けました。彼は祝福された使徒たちを見て、彼らと交わり、使徒たちの宣教をまだ耳に持ち、彼らの聖伝を目の前に持っていた</strong>のです。ただし彼は一人ではありませんでした。そのときなお多くの人が残っており、使徒たちから教育を受けていました。<strong><mark>このクレメンスの在任中</mark>、コリントの兄弟たちの間に小さからぬ意見の不一致が起こったとき、<mark>ローマの教会はコリント人に極めて有益な手紙を書き送りました</mark>。平和へと勧め、彼らの信仰を回復させ、使徒たちから最近受け取った聖伝を告げ知らせるためでした</strong>。この聖伝が宣べ伝えるのは、天と地の造り主である、唯一の全能なる神です。</p></blockquote><p>（<a href="https://bibleox.com/ja/en/w/irenaeus-against-heresies-b3#HH-3">エイレナイオス『異端反駁』3巻3章3節（英語）</a>）</p><h2>信仰</h2><h3>救いには信仰だけでなく行いが必要である</h3><p>救いについて、クレメンスには異なる言葉があります。行いによって義とされるとも語り、信仰によって義とされるとも語り、救いのためには神の御心を求め、それを行うことが必要だとも語っています。</p><p>今、わたしたちはこれらの言葉を和解させてみましょう。</p><p>まず、クレメンスは行いによって義とされることについて語ります：</p><blockquote><p>一致を着け、謙虚になり、節制し、あらゆる囁きと中傷から自分を遠ざけましょう。言葉ではなく、<strong><mark>行いによって義とされる</mark></strong>のですから。</p></blockquote><p>この言葉は偽善に対して語られています。救いのためには、徳をただ語るのではなく、<u>徳である</u>ことが必要なのです。クレメンスがこの手紙を書いた理由は、使徒たちが立てた司祭たちに対する徹底的な叛乱でした。クレメンスは叛乱者の偽善を指弾します。彼は、教会を分裂させながらただ平和を語る人たちを退け、<u>行いのうちで</u>平和を保つ人たちに加わるようにと呼びかけます：</p><blockquote><p>ですから、この方の御心から脱走しないことが、義なのです。<strong>無知で悟りのない、高ぶり、<mark>おのが言葉の華やかさを誇る</mark>人たちに反対する方が、神に反対するよりましです。</strong>主イエス・キリスト——その血がわたしたちのために渡された御方——を畏れ敬いましょう。<strong>わたしたちの指導者たちを敬い、司祭たちを尊び</strong>、若者たちを神への畏れの教育で育てましょう。……</p><p>…</p><p>ですから、<strong>敬虔と共に平和を保つ人たちと結び付き、<mark>偽善をもって平和を望む</mark>人たちとは結び付かないようにしましょう</strong>。</p><p>…</p><p><strong>キリストは謙虚な者の御方だからです。御自分の小さな群れの上に高ぶる者たちの御方ではありません</strong>。</p></blockquote><p>それで、救いのためには、わたしたちには真実の行いが必要であり、言葉だけでは足りないのです。救いのためには、徳であるように見えるのではなく、徳であることが必要なのです。</p><hr><p>真実の行いの必要性を語った後、クレメンスはもう一つの極端を断ち切ります。すなわち、わたしたちは自分自身によって、自分の行いだけによって救われるのではなく、信仰によって救われるのだと言います。つまり、行いそのものはそれだけでは救いに至らせません。キリストを信じない人は、たとえ善い行いを持っていても、キリストなしには自分自身で救われることはありません：</p><blockquote><p>わたしたちもまた、この方の御心によってキリスト・イエスのうちに召されましたが、<strong><mark>自分たち自身によって義とされるのではありません</mark></strong>。<strong>わたしたちの知恵によって、悟りによって、敬虔によって、聖なる心のうちでなし遂げた<mark>行い</mark>によってではなく</strong>、<strong><mark>信仰によってです</mark></strong>。全能なる神が、永遠の初めからすべての人を義としてこられたのは、この信仰によってなのです。</p></blockquote><hr><p>その下で、クレメンスは救いの主題に再び戻り、今度は全体の図を描きます。救いのためには、1）信仰、2）神の御心を求めること、3）そしてその実行が必要です。</p><blockquote><p>ですから、<strong><mark>わたしたちは競技しましょう</mark></strong>。忍ぶ者たちの数のうちに見出され、<strong><mark>約束された賜物に与るために</mark></strong>。親愛な皆さん、<strong><mark>これはどのように成るのでしょうか</mark></strong>。わたしたちの思いが忠実に神に向かって堅く立っているなら。この方の喜ばれ、受け入れられる事を求めるなら。<strong><mark>この方の穢れのない御心に属する事を成し遂げ</mark></strong>、真実の道に従うなら。あらゆる不義と悪、貪欲、分裂、悪意と策略、囁きと中傷、神を憎む事、高慢と誇大、空しい栄光ともてなしをしない心を、自分たちから投げ捨てるなら。なぜなら、これらの事を行う者たちは、<strong><mark>神にとって忌み嫌われるもの</mark></strong>だからです。「これらの事を行う者たちだけでなく、これらの事に同意する者たちも」。</p></blockquote><p>善い行いがなければ、わたしたちは判罰されます：</p><blockquote><p>見なさい、親愛な皆さん。<strong><mark>この方のこれほど多くの恩恵が、わたしたち全員の裁きとなってしまわないように</mark></strong>。<strong><mark>この方にふさわしく生きず</mark></strong>、<strong><mark>一致のうちに、御前で善い事を</mark></strong>、この方の喜ばれる事を行わないならば。（<a href="https://bibleox.com/ja/ja/w/Kl1C1_コリントの教会への手紙第一#HH-21">『コリントの教会への手紙 第一』21:1</a>）</p></blockquote><hr><p>救いについてのすべての引用を、順に並べます：</p><blockquote><p>ですから、すべてのものがこの方に見られ、聞かれているのですから、この方を畏れ、<strong><mark>悪業の汚れた欲を捨てましょう</mark></strong>。そうすれば、この方の慈しみをもって、来るべき裁きから覆い隠されるのです。</p><p>…</p><p>一致を着け、謙虚になり、節制し、あらゆる囁きと中傷から自分を遠ざけましょう。言葉ではなく、<strong><mark>行いによって義とされる</mark></strong>のですから。</p><p>…</p><p>わたしたちもまた、この方の御心によってキリスト・イエスのうちに召されましたが、<strong><mark>自分たち自身によって義とされるのではありません</mark></strong>。<strong>わたしたちの知恵によって、悟りによって、敬虔によって、聖なる心のうちでなし遂げた<mark>行い</mark>によってではなく</strong>、<strong><mark>信仰によってです</mark></strong>。全能なる神が、永遠の初めからすべての人を義としてこられたのは、この信仰によってなのです。</p><p>…</p><p><strong>では、兄弟たち、わたしたちは何をすべきでしょうか。</strong>善を行うことをやめ、愛を捨ててしまいましょうか。断じていけません。主がこのような事がわたしたちの上に起こることをお許しになるはずがありません。それどころか、切実な熱意をもって、<strong>あらゆる善い業を成し遂げましょう</strong>。</p><p>…</p><p>見届けましょう。<strong>すべての正しい者たちは善行によって飾られました</strong>。主御自身も善行によって御自分を飾って喜ばれました。このような模範を持っていますから、怠けることなくこの方の御心へと進み出ましょう。<strong>全身の力を尽くして、正義の業を行いましょう</strong>。</p><p>…</p><p><strong>忠実な働き手は、自分の労働のパンを胸を張って受け取ります</strong>。<strong>怠け者で気力を失った者は、自分に仕事を割り当てた人をまともに見ることができません</strong>。ですから、わたしたちは<strong>善を行うことへ熱心でなければなりません</strong>。すべてのものはこの方から来るのですから。この方はわたしたちに前もって預言されました。「見よ、主は来られる。この方の報いは御前を進む。<strong>各人に、その人の業に応じて返される</strong>。」（<a href="https://bibleox.com/ja/jp-ni/is/40/#L10">イザ. 40:10</a>、<a href="https://bibleox.com/ja/jp-ni/is/62/#L11">イザ. 62:11</a>；<a href="https://bibleox.com/ja/jp-ni/otkr/22/#L12">黙. 22:12</a>）</p><p>…</p><p>ですから、<strong><mark>わたしたちは競技しましょう</mark></strong>。忍ぶ者たちの数のうちに見出され、<strong><mark>約束された賜物に与るために</mark></strong>。親愛な皆さん、<strong><mark>これはどのように成るのでしょうか</mark></strong>。わたしたちの思いが忠実に神に向かって堅く立っているなら。この方の喜ばれ、受け入れられる事を求めるなら。<strong><mark>この方の穢れのない御心に属する事を成し遂げ</mark></strong>、真実の道に従うなら。あらゆる不義と悪、貪欲、分裂、悪意と策略、囁きと中傷、神を憎む事、高慢と誇大、空しい栄光ともてなしをしない心を、自分たちから投げ捨てるなら。なぜなら、これらの事を行う者たちは、<strong><mark>神にとって忌み嫌われるもの</mark></strong>だからです。「これらの事を行う者たちだけでなく、これらの事に同意する者たちも」。</p><p>…</p><p>これがその道です、親愛な皆さん。<strong><mark>この道によって、わたしたちはわたしたちの救いを見出します</mark></strong>。イエス・キリストです。わたしたちのすべての献げ物の大司祭、わたしたちの軟弱さの守り手であり助け手。</p><p>…</p><p>では、この方の敵とはだれでしょうか。悪なる者たちです。この方の御心に反対する者たちです。</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Kl1C1_コリントの教会への手紙第一">『コリントの教会への手紙 第一』</a>）</p><h3>主教たちは使徒たちの継承者である</h3><blockquote><p><em>わたしたちの使徒たちもまた、わたしたちの主イエス・キリストを通して知っていました。主教の名分について争いが起こるだろうと。それでこの理由のゆえに、完全な先見を受け取って、<strong><mark>前述の人たちを立て、その後に法を加えました</mark></strong>。彼らが眠りに就いたなら、<strong><mark>他の、試しに合った人たちが、彼らの奉仕を引き継ぐようにと</mark></strong>。</em></p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Kl1C1_コリントの教会への手紙第一#HH-44">『コリントの教会への手紙 第一』44:1-2</a>）</p><h3>皆が司祭なのではない</h3><blockquote><p><strong><mark>皆が総督なのではありません。皆が千夫長や百夫長や五十夫長でも、その次の階級でもありません。各人が自分の班のうちで</mark></strong>、王と指導者たちによって命じられた事を成し遂げるのです。</p></blockquote><blockquote><p>ですから、わたしたちの体全体がキリスト・イエスのうちに救われますように。<strong><mark>そして各人が、その人がその賜物のうちに立てられたとおりに、隣人に服従しますように</mark></strong>。</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Kl1C1_コリントの教会への手紙第一#HH-37">『コリントの教会への手紙 第一』37:3</a>、<a href="https://bibleox.com/ja/ja/w/Kl1C1_コリントの教会への手紙第一#HH-38">『コリントの教会への手紙 第一』38:1</a>）</p><h3>聖職の位階：三つの位（主教、司祭、輔祭）</h3><p>ローマのクレメンスは、聖職の三つの位すべてに言及しています。主教、司祭、そして輔祭です。しかし同時に、一つの場所で挙げる位は決して二つを超えません。しかし、旧約聖書について語り、それを新約に投影する箇所があります。そこで彼は教会の四つの位を挙げます。大司祭、司祭、レビ人、そして在俗の人です。その後、クレメンスは直ちに、信徒たちは自分の奉仕の場所を越えてはならないと呼びかけます。このことから、ローマのクレメンスは聖職の奉仕の三つの位を知っていたと考えることができます。</p><blockquote><p>これらの事がわたしたちには明らかですから、神聖な知識の深さへと身をかがめながら、主が定められた時節に成し遂げるようにと命じられたすべての事を、秩序に従って行うべきです。<strong>献げ物と<mark>奉仕</mark>は成し遂げられるようにと、<mark>この方は</mark>、意のままに、あるいは無秩序に起こるようには命じられませんでした。定められた<mark>時節と時刻</mark>のうちにです</strong>。そして、<strong><mark>どこで、だれによって成し遂げられるべきかも</mark></strong>、この方御自身が最高の御心をもって定められました。すべての事が聖善に起こって、喜びのうちで受け入れられるものとなり、この方の御心にかなうためです。</p><p>それで、定められた時節に自分の献げ物をする人たちは、受け入れられ、祝福されています。主の律に従うのですから、間違うことはありません。<strong><mark>大司祭</mark>には、その人に与えられた固有の奉仕があります。<mark>司祭たち</mark>には固有の場所が割り当てられています。<mark>レビ人たち</mark>には固有の奉仕が課されています。<mark>在俗の人</mark>は、在俗の人の戒めに結ばれています</strong>。</p><p>兄弟たち、わたしたち各人は<strong>自分の班のうちで、良い良心をもって、厳粛さのうちに神を喜ばせる</strong>ようにしましょう。<strong><mark>自分の奉仕に定められた規範から外れないように</mark></strong>。</p><p>兄弟たち、献げ物は、いつもの献げ物も、誓願のいけにえも、罪のためと過ちのためのいけにえも、どこででもささげられるのではありません。エルサレムでのみです。そこでも、どこででもささげられるのではなく、神殿の前の祭壇のところで、ささげられるものが大司祭と前述の奉仕者たちによって点検されてからです。</p><p><strong><mark>それで、この方の御心にふさわしいことの外で何かを行う人たちは、死という刑罰を負います</mark></strong>。</p><p>見なさい、兄弟たち。わたしたちは、より多くの知識に値するものとされたぶんだけ、<strong>より大きな危険に置かれている</strong>のです。</p><p><strong><mark>使徒たちは</mark>、<mark>わたしたちの主イエス・キリストから</mark>福音を聞きました</strong>。イエス・キリストは神から遣わされました。</p><p><strong><mark>キリストは神から、使徒たちはキリストから</mark></strong>。<strong>この二つのことは、神の御心に従って、秩序正しく成りました</strong>。</p><p>それで、使徒たちは命令を受け、わたしたちの主イエス・キリストの復活によって確信を得て、神の言葉のうちに信仰を与えられ、<strong>聖霊の確信をもって出て行き、神の国が来ようとしていることを宣べ伝えました</strong>。</p><p><strong>そして、土地々々と都々で宣べ伝えながら、彼らは<mark>初めの信じる人たち</mark>を、霊によって試し、<mark>将来信じる人たちのために主教と輔祭に立てました</mark></strong>。</p><p><strong><mark>これは新しい設置ではありません</mark></strong>。ずっと以前から、主教たちと輔祭たちについて書かれていたのですから。<strong>聖書はこう言います</strong>。「わたしは彼らの主教たちを正義のうちに、彼らの輔祭たちを信仰のうちに立てるであろう。」（<a href="https://bibleox.com/ja/jp-ni/is/60/#L17">イザ. 60:17</a>）</p><p><strong><mark>キリストのうちに神からこの仕事を託された人たちが、前述の人たちを立てたとして</mark></strong>、それが何ほど不思議でしょうか。祝福された「その全家のうちに忠実な僕」モーセ（<a href="https://bibleox.com/ja/jp-ni/evr/3/#L2">ヘブ. 3:2</a>、<a href="https://bibleox.com/ja/jp-ni/evr/3/#L5">ヘブ. 3:5</a>；<a href="https://bibleox.com/ja/jp-ni/chis/12/#L7">民. 12:7</a>）も、自分に命じられたすべての事を聖なる書に記しました。その他の預言者たちもこの方に従い、この方が立てた律例を証しして固めました。</p><p><strong>司祭職についての<mark>嫉みが生じ</mark>、諸々の部族が、どの部族がその栄光ある名で飾られるかについて騒乱を起こしたとき</strong>、この方は十二の部族の長たちに、各部族の名が書かれた笏を自分に提出するように命じました。それを受け取って束ね、部族の長たちの指輪で封印し、証しの幕屋の中の神の卓の上に置きました。幕屋を閉ざし、鍵も同じように笏も封印しました。そして彼らに言いました。「兄弟たちよ、どの部族の笏が芽を出すなら、神はその部族を選び、その部族を司祭として御もとに仕えさせるのです。」朝になると、この方は全イスラエル——六十万の男たち——を召集し、部族の長たちに封印を見せ、証しの幕屋を開いて笏を取り出しました。そしてアロンの笏が、芽を出したばかりでなく、実をつけているのが見出されました。<strong>どう考えますか、親愛な皆さん。<mark>モーセはこの事が起ころうとしていることを前もって知らなかったのでしょうか。知っていました。むしろ確かに知っていました</mark>。しかしイスラエルの中に騒乱が起こらないように</strong>、真実で唯一の御方の名が栄光を受けるように、こうされたのです（<a href="https://bibleox.com/ja/jp-ni/in/17/#L3">ヨハ. 17:3</a>）。この方に栄光がありますように、世々限りなく。アーメン。</p><p>わたしたちの使徒たちもまた、わたしたちの主イエス・キリストを通して知っていました。主教の名分について争いが起こるだろうと。それでこの理由のゆえに、完全な先見を受け取って、<strong><mark>前述の人たちを立て、その後に法を加えました</mark></strong>。彼らが眠りに就いたなら、他の、試しに合った人たちが、彼らの奉仕を引き継ぐようにと。それで、あの使徒たちによって、あるいはその後に、教会全体が同意して立派な人たちによって立てられ、キリストの羊群に謙虚さをもって、静かに、忠実に仕え、長い間、すべての人からの証しを受けてきた人たちを、<strong><mark>奉仕から落とすのは不正だと</mark></strong>、わたしたちは考えます。</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Kl1C1_コリントの教会への手紙第一#HH-40">『コリントの教会への手紙 第一』40:1-5</a>、<a href="https://bibleox.com/ja/ja/w/Kl1C1_コリントの教会への手紙第一#HH-41">『コリントの教会への手紙 第一』41:1-4</a>、<a href="https://bibleox.com/ja/ja/w/Kl1C1_コリントの教会への手紙第一#HH-42">『コリントの教会への手紙 第一』42:1-5</a>、<a href="https://bibleox.com/ja/ja/w/Kl1C1_コリントの教会への手紙第一#HH-43">『コリントの教会への手紙 第一』43:1-6</a>、<a href="https://bibleox.com/ja/ja/w/Kl1C1_コリントの教会への手紙第一#HH-44">『コリントの教会への手紙 第一』44:1-3</a>）</p><p>司祭たちの上には指導者がいます（輔祭については別の場所で語られています）：</p><blockquote><p>ですから、この方の御心から脱走しないことが、義なのです。<strong>無知で悟りのない、高ぶり、<mark>おのが言葉の華やかさを誇る</mark>人たちに反対する方が、神に反対するよりましです。</strong>主イエス・キリスト——その血がわたしたちのために渡された御方——を畏れ敬いましょう。<strong>わたしたちの指導者たちを敬い、司祭たちを尊び</strong>、若者たちを神への畏れの教育で育てましょう。……</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Kl1C1_コリントの教会への手紙第一#HH-21">『コリントの教会への手紙 第一』21:4-6</a>）</p><h3>聖職は恵みを帯びている</h3><p>この点についての言葉はそれほど明白ではありませんが、それでも当然のこととして受け止められます。クレメンスは、司祭たちに対する叛乱を鎮めるためにコリントの人たちに手紙を書きました。彼は、使徒たちによって立てられ、キリストの羊群に謙虚に仕えてきた人たちのもとへ立ち返るようにと呼びかけます。謙虚さを繰り返し強調しながら、彼は、平和を保ち、恵みを持っている司祭たちに加わるようにと、何度も何度も呼びかけています：</p><blockquote><p>ですから、わたしたちは聖なる部分ですから、聖なるものに属するすべての事を行いましょう。<strong>中傷から逃れ</strong>、汚れて不敬な交わり、酔い、新奇を好む欲、卑しい情欲、憎むべき姦淫と<strong>憎むべき高慢</strong>から逃れましょう。「神は高慢な者たちに敵対し、<strong><u><mark>謙虚な者たち</mark></u>に恵みを与えられる</strong>」と言われているからです。ですから、<strong><mark>神から恵みを与えられた人たちと結び付きましょう</mark></strong>。一致を着け、謙虚になり、節制し、あらゆる囁きと中傷から自分を遠ざけましょう。言葉ではなく、行いによって義とされるのですから。（<a href="https://bibleox.com/ja/jp-ni/pr/3/#L34">箴. 3:34</a>；<a href="https://bibleox.com/ja/jp-ni/iak/4/#L6">ヤコ. 4:6</a>；<a href="https://bibleox.com/ja/jp-ni/1pet/5/#L5">１ペト. 5:5</a>）</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Kl1C1_コリントの教会への手紙第一#HH-30">『コリントの教会への手紙 第一』30:1-3</a>）</p><blockquote><p>ですから、<strong>敬虔と共に平和を保つ人たちと結び付き、<mark>偽善をもって平和を望む</mark>人たちとは結び付かないようにしましょう</strong>。</p><p>…</p><p><strong>キリストは謙虚な者の御方だからです。御自分の小さな群れの上に高ぶる者たちの御方ではありません</strong>。</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Kl1C1_コリントの教会への手紙第一#HH-15">『コリントの教会への手紙 第一』15:1</a>、<a href="https://bibleox.com/ja/ja/w/Kl1C1_コリントの教会への手紙第一#HH-16">『コリントの教会への手紙 第一』16:1</a>）</p><blockquote><p>わたしたちの使徒たちもまた、わたしたちの主イエス・キリストを通して知っていました。主教の名分について争いが起こるだろうと。それでこの理由のゆえに、完全な先見を受け取って、<strong><mark>前述の人たちを立て、その後に法を加えました</mark></strong>。彼らが眠りに就いたなら、他の、試しに合った人たちが、彼らの奉仕を引き継ぐようにと。それで、あの使徒たちによって、あるいはその後に、教会全体が同意して立派な人たちによって立てられ、キリストの羊群に謙虚さをもって、静かに、忠実に仕え、長い間、すべての人からの証しを受けてきた人たちを、<strong><mark>奉仕から落とすのは不正だと</mark></strong>、わたしたちは考えます。</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Kl1C1_コリントの教会への手紙第一#HH-44">『コリントの教会への手紙 第一』44:1-3</a>）</p><p>ローマのクレメンスの呼びかけは、使徒パウロがロマ書の中で語る言葉と呼応しています：</p><blockquote><p>「互いに思いを一つにし、高ぶらず、<strong><mark>身分の低い人々と交わりなさい</mark></strong>。自分を賢い者とうぬぼれてはなりません。」（<a href="https://bibleox.com/ja/jp-ni/rim/12/#L16">ロマ. 12:16</a>）</p></blockquote><h3>教会の見える一致を守る</h3><blockquote><p>ですから、わたしたちが敵対者の何かの罠によって過ちを犯し、悪を行ってしまったなら、赦されるように願いましょう。そして騒乱と分裂の首謀者となった人たちも、共通の希望を心に留めるべきです。なぜなら、畏れと愛をもって生きる人たちは、<strong><mark>隣人が不幸に陥るよりも、自分が不幸に陥ることを望みます</mark></strong>。わたしたちに伝えられた善く正しい一致に判罰が下るよりも、<strong><mark>自分自身への判罰を選ぶのです</mark></strong>。人にとっては、自分の過ちを告白することの方が、自分の心を硬くすることより善いのです。神の僕モーセに叛いた人たちの心が硬くなったように。彼らの裁きは明らかになりました。彼らは「生きたまま陰府に下り」、「死が彼らを飼う」となったのです。（<a href="https://bibleox.com/ja/jp-ni/chis/16/">民. 16</a>）</p><p>…</p><p>では、あなたがたの間でだれが勇気ある人でしょうか。だれが慈しみ深い人でしょうか。だれが愛の確信を満たされた人でしょうか。その人は言いなさい。「<strong><mark>わたしのせいで騒乱と争いと分裂が起こるなら、わたしは退きます</mark></strong>。あなたがたの望む場所へ去ります。民の命じる事を何でも行います。ただ、キリストの羊群が、立っている司祭たちと共に平和であるように。」この事を行った人は、キリストのうちで自分のために大きい名声を得るでしょう。あらゆる場所がその人を受け入れるでしょう。「主のものは地であり、その満ちるところすべて」だからです（<a href="https://bibleox.com/ja/jp-ni/ps/24/#L1">詩. 24:1</a>）。神の悔いることのない生き方を生きる人たちは、この事を行いました。そして行うでしょう。</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Kl1C1_コリントの教会への手紙第一#HH-51">『コリントの教会への手紙 第一』51:1-4</a>、<a href="https://bibleox.com/ja/ja/w/Kl1C1_コリントの教会への手紙第一#HH-54">『コリントの教会への手紙 第一』54:1-4</a>）</p><h3>聖職者への服従の呼びかけ</h3><p>『コリントの教会への手紙』が書かれたのは、使徒たちが立てた司祭たちに対して、ある人たちが叛乱を起こしたからです。クレメンスはまず、かつての聖職者への服従のゆえにコリントの人たちを讃めます：</p><blockquote><p>あなたがたは何事においても人をえこひいきせず、神の律法に従って歩み、指導者たちに従い、あなたがたの間の司祭たちに、当然帰すべき尊栄をささげていました。</p><p>…</p><p>あなたがたは皆、謙虚な心を保ち、何ひとつ誇ることがなく、むしろ人に従う立場であって、従わせる立場ではありませんでした。与えることを喜び、受け取ることを喜びとはしませんでした。</p><p>…</p><p>かくして、深く豊潤な平和がすべての人に与えられ、善を行うことへの飽くことなき渇望が生まれ、聖霊の満ちあふれる注ぎがすべての人の上にありました。</p><p>…</p><p>すべての騒乱も、すべての分裂も、あなたがたには憎むべきものでした。</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Kl1C1_コリントの教会への手紙第一#HH-1">『コリントの教会への手紙 第一』1:3</a>、<a href="https://bibleox.com/ja/ja/w/Kl1C1_コリントの教会への手紙第一#HH-2">『コリントの教会への手紙 第一』2:1-6</a>）</p><p>しかし、その後、彼は叛乱を責め、使徒たちが立てた司祭たちへの服従を呼びかけます：</p><blockquote><p><strong><mark>こうして「名誉なき者たちが名誉ある者たちに向かって立ち上がり」ました。誉れなき者が誉れある者に、無知な者が賢い者に、若い者が長老たちに向かってです</mark></strong>。それゆえ、正義と平和は遠くへ去って行きました。<strong><mark>各人が神の畏れを捨て、その信仰において目がかすみ</mark></strong>、この方の戒めの律に従って歩まず、キリストにふさわしく生きず、各人が悪しき心の欲のままに歩み、不義で不敬虔な嫉みを受け入れたからです——死はまさにそれによって世に入ったのです。（<a href="https://bibleox.com/ja/jp-ni/prs/2/#L24">知. 2:24</a>）</p><p>…</p><p>ですから、この方の御心から脱走しないことが、義なのです。<strong>無知で悟りのない、高ぶり、<mark>おのが言葉の華やかさを誇る</mark>人たちに反対する方が、神に反対するよりましです。</strong>主イエス・キリスト——その血がわたしたちのために渡された御方——を畏れ敬いましょう。<strong>わたしたちの指導者たちを敬い、司祭たちを尊び</strong>、若者たちを神への畏れの教育で育てましょう。……</p><p>…</p><p>兄弟たちよ、<strong><mark>神に聞き従う方が義であり、聖なることです</mark></strong>。誇大と騒乱を抱えた、汚れた嫉みの首謀者たちに従うことではありません。なぜなら、<strong><mark>わたしたちが無分別にも、争いと騒乱へと矢を放ち</mark></strong>、わたしたちを善いものから引き剥がそうとする人々の欲に自らを託すなら、ただの損害ではなく、大きな危険に陥ることになるからです。</p><p>…</p><p>ですから、わたしたちが敵対者の何かの罠によって過ちを犯し、悪を行ってしまったなら、赦されるように願いましょう。そして騒乱と分裂の首謀者となった人たちも、共通の希望を心に留めるべきです。なぜなら、畏れと愛をもって生きる人たちは、<strong><mark>隣人が不幸に陥るよりも、自分が不幸に陥ることを望みます</mark></strong>。わたしたちに伝えられた善く正しい一致に判罰が下るよりも、<strong><mark>自分自身への判罰を選ぶのです</mark></strong>。人にとっては、自分の過ちを告白することの方が、自分の心を硬くすることより善いのです。神の僕モーセに叛いた人たちの心が硬くなったように。彼らの裁きは明らかになりました。彼らは「生きたまま陰府に下り」、「死が彼らを飼う」となったのです。（<a href="https://bibleox.com/ja/jp-ni/chis/16/">民. 16</a>）</p><p>…</p><p>では、あなたがたの間でだれが勇気ある人でしょうか。だれが慈しみ深い人でしょうか。だれが愛の確信を満たされた人でしょうか。その人は言いなさい。「<strong><mark>わたしのせいで騒乱と争いと分裂が起こるなら、わたしは退きます</mark></strong>。あなたがたの望む場所へ去ります。民の命じる事を何でも行います。ただ、キリストの羊群が、立っている司祭たちと共に平和であるように。」この事を行った人は、キリストのうちで自分のために大きい名声を得るでしょう。あらゆる場所がその人を受け入れるでしょう。「主のものは地であり、その満ちるところすべて」だからです（<a href="https://bibleox.com/ja/jp-ni/ps/24/#L1">詩. 24:1</a>）。神の悔いることのない生き方を生きる人たちは、この事を行いました。そして行うでしょう。</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Kl1C1_コリントの教会への手紙第一#HH-3">『コリントの教会への手紙 第一』3:3-4</a>、<a href="https://bibleox.com/ja/ja/w/Kl1C1_コリントの教会への手紙第一#HH-14">『コリントの教会への手紙 第一』14:1-2</a>、<a href="https://bibleox.com/ja/ja/w/Kl1C1_コリントの教会への手紙第一#HH-21">『コリントの教会への手紙 第一』21:4-6</a>、<a href="https://bibleox.com/ja/ja/w/Kl1C1_コリントの教会への手紙第一#HH-51">『コリントの教会への手紙 第一』51:1-4</a>、<a href="https://bibleox.com/ja/ja/w/Kl1C1_コリントの教会への手紙第一#HH-54">『コリントの教会への手紙 第一』54:1-4</a>）</p><h3>叛乱者たちは偽善をもって平和を語る</h3><blockquote><p>ですから、<strong>敬虔と共に平和を保つ人たちと結び付き、<mark>偽善をもって平和を望む</mark>人たちとは結び付かないようにしましょう</strong>。</p><p>…</p><p><strong>キリストは謙虚な者の御方だからです。御自分の小さな群れの上に高ぶる者たちの御方ではありません</strong>。</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Kl1C1_コリントの教会への手紙第一#HH-15">『コリントの教会への手紙 第一』15:1</a>、<a href="https://bibleox.com/ja/ja/w/Kl1C1_コリントの教会への手紙第一#HH-16">『コリントの教会への手紙 第一』16:1</a>）</p><h3>キリスト者たちも時に罪を犯した</h3><p>キリスト者たちは時に罪を犯しました。互いに対してさえも：</p><blockquote><p>あなたがたは聖善な心を満たし、善い熱意と敬虔な信頼とをもって、全能の神に向かって手を伸ばし、時に無意識に罪を犯したことを思い、この方があわれんでくださるようにと願い求めました。</p><p>…</p><p>あなたがたは真実で無垢であり、互いに恨みを抱くことはありませんでした。</p><p>…</p><p>隣人の過ちを悲しみ、その欠けたところを自分自身の欠けとして受け止めていました。</p><p>…</p><p><strong><mark>こうして「名誉なき者たちが名誉ある者たちに向かって立ち上がり」ました。誉れなき者が誉れある者に、無知な者が賢い者に、若い者が長老たちに向かってです</mark></strong>。それゆえ、正義と平和は遠くへ去って行きました。<strong><mark>各人が神の畏れを捨て、その信仰において目がかすみ</mark></strong>、この方の戒めの律に従って歩まず、キリストにふさわしく生きず、各人が悪しき心の欲のままに歩み、不義で不敬虔な嫉みを受け入れたからです——死はまさにそれによって世に入ったのです。（<a href="https://bibleox.com/ja/jp-ni/prs/2/#L24">知. 2:24</a>）</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Kl1C1_コリントの教会への手紙第一#HH-2">『コリントの教会への手紙 第一』2:3-6</a>、<a href="https://bibleox.com/ja/ja/w/Kl1C1_コリントの教会への手紙第一#HH-3">『コリントの教会への手紙 第一』3:3-4</a>）</p><h3>共同体が救われるようにと気を配る（まだ救われていない）</h3><blockquote><p><strong><mark>昼も夜も、あなたがたにとって競技が行われていました。それは兄弟全体のためのもので</mark></strong>、あわれみと良心のうちに、<strong><mark>この方の選ばれた人々の数</mark></strong>が<strong><mark>救われるためのものでした</mark></strong>。</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Kl1C1_コリントの教会への手紙第一#HH-2">『コリントの教会への手紙 第一』2:4</a>）</p><h3>聖なる人たちは体と別れた後も生きており、聖なる場所にいる</h3><p>ペトロとパウロは、聖なる場所へと移りました：</p><blockquote><p>ペトロは、不義の嫉みのゆえに、一つの苦でも二つの苦でもなく、多くの苦難を耐え、このように証しを果たして、<strong><mark>当然の栄光の場所へと旅立って行きました</mark></strong>。パウロは嫉みと争いのゆえに、忍耐の賞を示しました。彼は七度鎖を担い、追放され、石で打たれ、東方にも西方にも宣明者となって、その信仰の勇壮な名声を得ました。世界全体に正義を教え、西方の果てまで至り、指導者たちの前で証しを果たし、こうして<strong><mark>この世から解き放たれて、聖なる場所へと旅立ちました</mark></strong>。忍耐の最大の模範となったのです。</p><p>…</p><p><strong><mark>聖善に生きたこれらの男たちと共に</mark></strong>、<strong><mark>選ばれた人々の大いなる群れ</mark></strong>が集められました。彼らは嫉みのゆえに多くの凌辱と拷問を耐え、わたしたちの中で最も美しい模範となりました。</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Kl1C1_コリントの教会への手紙第一#HH-5">『コリントの教会への手紙 第一』5:4-7</a>、<a href="https://bibleox.com/ja/ja/w/Kl1C1_コリントの教会への手紙第一#HH-6">『コリントの教会への手紙 第一』6:1</a>）</p><h3>神の御心への服従の呼びかけ（反カルヴァン主義）</h3><blockquote><p>ですから、<strong><mark>御自分の威厳にして栄光ある御心に聞き従い</mark></strong>、あわれみと御善とを願い求める者となってひれ伏し、御慈しみのもとへ立ち帰りましょう。そして、むなしい労苦と争いと、死へと至らせる嫉みとを捨てましょう。</p></blockquote><p>（<a href="https://bibleox.com/ja/ja/w/Kl1C1_コリントの教会への手紙第一#HH-9">『コリントの教会への手紙 第一』9:1</a>）</p>
