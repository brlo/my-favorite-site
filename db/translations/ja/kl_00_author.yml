    title_sub: 致命者（〜101年頃）、ローマの主教、使徒たちの弟子
    meta_desc: ローマの聖クレメンス（†101年頃）——ローマの主教、使徒時代の教父の一人——の生涯と著作、そしてその書簡が証しする古代教会の信仰。
    menu: { parent: "1世紀", title: "クレメンス（ローマの）、致命者（〜101年頃）", priority: 10, replace: "ローマのクレメンス、殉教者 (†~101)" }
    copy_cover: true
