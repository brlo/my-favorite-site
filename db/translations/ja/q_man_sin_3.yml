# 「聖書の引用」（ru/q）の日本語訳（jp_q）：「人間／罪」（3）
# Загрузка: bin/rails pages:import_translations FILE=db/translations/ja/q_man_sin_3.yml [PUBLISH=1] [DRY_RUN=1]
lang: ja
