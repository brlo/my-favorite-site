pages:
  - src: матерщина
    path: Fl14l_汚い言葉
    title: 汚い言葉（卑語）
    menu: { parent: "人間/罪", title: "汚い言葉", priority: 14 }
    body: |-
      <h2>汚い言葉（卑語）は罪である</h2><blockquote><p>「<strong>悪い言葉</strong>を一切口にしてはなりません。ただ、聞く人に恵みが与えられるように、その人を造り上げるのに役立つ言葉を、必要に応じて語りなさい」（<a href="https://bibleox.com/ja/jp-ni/ef/4/#L29">エフェ. 4:29</a>）</p></blockquote><blockquote><p>「あなたがたの間では、聖なる者にふさわしく、みだらなことやいろいろの汚れたこと、あるいは貪欲なことを口にしてはなりません。<strong>卑わいな言葉</strong>や愚かな話、下品な冗談もふさわしいものではありません。それよりも、感謝を表しなさい」（<a href="https://bibleox.com/ja/jp-ni/ef/5/#L3-4">エフェ. 5:3-4</a>）</p></blockquote><blockquote><p>「今は、そのすべてを、すなわち、怒り、憤り、悪意、そしり、<strong>口から出る恥ずべき言葉</strong>を捨てなさい」（<a href="https://bibleox.com/ja/jp-ni/kol/3/#L8">コロ. 3:8</a>）</p></blockquote><blockquote><p>「悪をもって悪に、侮辱をもって侮辱に報いてはなりません。かえって祝福を祈りなさい。祝福を受け継ぐためにあなたがたは召されたのです。<strong>『命を愛し、幸せな日々を過ごしたい人は、舌を制して、悪を言わず、唇を閉じて、偽りを語らず』</strong>」（<a href="https://bibleox.com/ja/jp-ni/1pet/3/#L9-10">１ペト. 3:9-10</a>）</p></blockquote><blockquote><p>「しかし、<strong>舌</strong>を制御できる人は一人もいません。<strong>舌は、疲れを知らない悪で、死をもたらす毒に満ちています。わたしたちは舌で、父である主を賛美し、また、舌で、神にかたどって造られた人間を呪います</strong>。<strong><mark>同じ口から賛美と呪いが出て来るのです。わたしの兄弟たち、このようなことがあってはなりません</mark></strong>。泉の同じ穴から、甘い水と苦い水がわき出るでしょうか。&lt;…&gt; <strong><mark>あなたがたの中で、知恵があり分別があるのはだれか。その人は、知恵にふさわしい柔和な行いを、立派な生き方によって示しなさい</mark></strong>。しかし、あなたがたは、内心ねたみ深く利己的であるなら、自慢したり、真理に逆らってうそをついたりしてはなりません。そのような知恵は、上から出たものではなく、地上のもの、この世のもの、悪魔から出たものです。ねたみや利己心のあるところには、混乱やあらゆる悪い行いがあるからです」（<a href="https://bibleox.com/ja/jp-ni/iak/3/#L8-11,13-16">ヤコ. 3:8-11,13-16</a>）</p></blockquote><h2>卑語の何が問題なのか</h2><p>卑語（攻撃的な語彙）の問題は、人が悪く、攻撃的で、危険で、手ごわい者に見られたい、そうありたいと望むことにあります。悪い語彙は、この目的を達成する方法の一つにすぎません。それには悪い感情、目つき、身ぶり、服装、入れ墨、習慣、そのほかあらゆる自己表現の手段が加わります。しかし言葉に戻りましょう。</p><p>言葉は音から成っています。音の組み合わせそれ自体は何も意味せず、悪くも良くもありません。たとえば「アムサダル」という言葉を考え出したとしましょう。「アムサダル」はまだ何も意味しないので、悪いとも良いとも見なされません。しかし社会があれこれの言葉に意味を込めると、人は状況に応じて、またその状況でどんな人に見られたいかに応じて、意味を持った言葉を選びます。礼儀正しく丁寧でありたいとき、人は丁寧な語彙、すなわち心地よい意味が込められ、わたしたちの穏やかな心構え、謙遜、親切さなどを示す言葉を用います。しかし手ごわく、危険で、悪く、攻撃的に見られたいとき、人は攻撃的な語彙、すなわち攻撃的で、下品で、そのほか否定的な意味が込められた言葉に頼ります。それによって、その人には悪い行いを控えさせるような教養も気分もないことがすぐに分かります。その人は周りの人々に、危険で、悪く、攻撃的で、不安定で、落ち着きがなく、何も良いところのない人間に見られたいのです。</p><p>さらに、人がそのような悪い状態に慣れると、喫煙や飲酒のように、あらゆる罪深い情欲のように、それに依存するようになります。その結果、その人は自分をこの悪い状態に持ち込み、内的にそれを育てるために、さまざまな行動をとるかもしれません。一人でいるときにも汚い言葉を口にし、悪い音楽を聴き、自分自身と周りの空間を陰気な象徴で満たすのです。つまり、これはすべて悪い状態に向かう動きであり、自分の内に悪意の状態、怒りの情欲を育てることです。しかし主イエス・キリストはわたしたちにこう教えておられます：</p><blockquote><p>「しかし、わたしは言っておく。<strong>兄弟に腹を立てる者はだれでも裁きを受ける</strong>。<strong>兄弟に『ばか』（侮辱の言葉 — 注）と言う者は、最高法院に引き渡され、『愚か者』と言う者は、火の地獄に投げ込まれる</strong>」（<a href="https://bibleox.com/ja/jp-ni/mf/5/#L22">マタ. 5:22</a>）<em>（ビザンティン本文（多数派写本）では「<strong>理由もなく</strong>（εἰκῇ）兄弟に腹を立てる者は」となっています。）</em></p></blockquote><blockquote><p>「<strong>柔和な人々は、幸いである、その人たちは地を受け継ぐ</strong>」（<a href="https://bibleox.com/ja/jp-ni/mf/5/#L5">マタ. 5:5</a>）</p></blockquote><p>また使徒は言っています：</p><blockquote><p>「<strong>無慈悲、憤り、怒り、わめき、そしりなどすべてを、一切の悪意と一緒に捨てなさい</strong>」（<a href="https://bibleox.com/ja/jp-ni/ef/4/#L31">エフェ. 4:31</a>）</p></blockquote><p>そして預言者は：</p><blockquote><p>「<strong>怒りを解き、憤りを捨てよ</strong>。自分も悪事を謀ろうと、いら立ってはならない」（<a href="https://bibleox.com/ja/jp-ni/ps/37/#L8">詩. 37:8</a>）</p></blockquote><p>ここで愚かな冗談についても述べておく価値があります：</p><blockquote><p>「卑わいな言葉や愚かな話、<strong>下品な冗談もふさわしいものではありません</strong>。それよりも、感謝を表しなさい」（<a href="https://bibleox.com/ja/jp-ni/ef/5/#L4">エフェ. 5:4</a>）</p></blockquote><blockquote><p>「<strong>今笑っている人々は、不幸である、あなたがたは悲しみ泣くようになる</strong>」（<a href="https://bibleox.com/ja/jp-ni/lk/6/#L25">ルカ. 6:25</a>）</p></blockquote>

  - src: Злословие
    path: Ev16s_悪口
    title: 悪口（そしり）
    menu: { parent: "人間/罪", title: "悪口", priority: 16 }
    body: |-
      <h2>悪口（侮辱）</h2><blockquote><p>「<strong>悪事は口に親しみ</strong>欺きが舌を御している」（<a href="https://bibleox.com/ja/jp-ni/ps/50/#L19">詩. 50:19</a>）</p></blockquote><blockquote><p>「彼らののどは開いた墓のようであり、彼らは舌で人を欺き、その唇には蝮の毒がある。<strong>口は、呪い</strong>と苦味<strong>で満ち</strong>」（<a href="https://bibleox.com/ja/jp-ni/rim/3/#L13-14">ロマ. 3:13-14</a>）</p></blockquote><blockquote><p>「<strong>だれをもそしらず</strong>、争いを好まず、寛容で、すべての人に心から優しく接しなければならないことを」（<a href="https://bibleox.com/ja/jp-ni/tit/3/#L2">テト. 3:2</a>）</p></blockquote><blockquote><p>「<strong>ののしられてもののしり返さず</strong>、苦しめられても人を脅さず、正しくお裁きになる方にお任せになりました」（<a href="https://bibleox.com/ja/jp-ni/1pet/2/#L23">１ペト. 2:23</a>）</p></blockquote><blockquote><p>「だから、<strong>悪意</strong>、偽り、偽善、ねたみ、<strong>悪口をみな捨て去って</strong>」（<a href="https://bibleox.com/ja/jp-ni/1pet/2/#L1">１ペト. 2:1</a>）</p></blockquote><blockquote><p>「今は、そのすべてを、すなわち、怒り、憤り、悪意、<strong>そしり</strong>、口から出る恥ずべき言葉を捨てなさい」（<a href="https://bibleox.com/ja/jp-ni/kol/3/#L8">コロ. 3:8</a>）</p></blockquote><h3>神に対して</h3><blockquote><p>「イスラエル人を母に持つこの男が主の御名を口にして冒瀆した。人々は彼をモーセのところに連行した。&lt;…&gt; あなたはイスラエルの人々に告げなさい。<strong>神を冒瀆する者はだれでも、その罪を負う</strong>。主の御名を呪う者は死刑に処せられる。共同体全体が彼を石で打ち殺す。神の御名を呪うならば、寄留する者も土地に生まれた者も同じく、死刑に処せられる」（<a href="https://bibleox.com/ja/jp-ni/lev/24/#L11,15-16">レビ. 24:11,15-16</a>）</p></blockquote><h3>両親に対して</h3><blockquote><p>「<strong>自分の父あるいは母を呪う者は</strong>、必ず死刑に処せられる」（<a href="https://bibleox.com/ja/jp-ni/ish/21/#L17">出. 21:17</a>）</p></blockquote><blockquote><p>「<strong>『父母を軽んずる者は、呪われる。』</strong>民は皆、『アーメン』と言わねばならない」（<a href="https://bibleox.com/ja/jp-ni/vtor/27/#L16">申. 27:16</a>）</p></blockquote><blockquote><p>「<strong>父母を呪う者</strong>彼の灯は闇のただ中で消える」（<a href="https://bibleox.com/ja/jp-ni/pr/20/#L20">箴. 20:20</a>）</p></blockquote><h3>隣人に対して</h3><blockquote><p>「兄弟たち、<strong>悪口を言い合ってはなりません</strong>。兄弟の悪口を言ったり、自分の兄弟を裁いたりする者は、律法の悪口を言い、律法を裁くことになります。もし律法を裁くなら、律法の実践者ではなくて、裁き手です」（<a href="https://bibleox.com/ja/jp-ni/iak/4/#L11">ヤコ. 4:11</a>）</p></blockquote><h3>権威者と支配者に対して</h3><blockquote><p>「<strong>神をののしってはならない</strong>。<strong>あなたの民の中の代表者を呪ってはならない</strong>」（<a href="https://bibleox.com/ja/jp-ni/ish/22/#L27">出. 22:27</a>）<em>（七十人訳 22:27：θεοὺς οὐ κακολογήσεις καὶ ἄρχοντας τοῦ λαοῦ σου οὐ κακῶς ἐρεῖς —「神々（裁き手たち）をののしってはならない。あなたの民の支配者たちを悪く言ってはならない」）</em></p></blockquote><blockquote><p>「しかし、同じようにこの夢想家たちも、身を汚し、権威を認めようとはせず、<strong>栄光ある者たちをあざけるのです</strong>」（<a href="https://bibleox.com/ja/jp-ni/iud/1/#L8">ユダ. 1:8</a>）</p></blockquote><blockquote><p>「特に、汚れた情欲の赴くままに肉に従って歩み、権威を侮る者たちを、そのように扱われるのです。彼らは、厚かましく、わがままで、<strong>栄光ある者たちをそしってはばかりません</strong>」（<a href="https://bibleox.com/ja/jp-ni/2pet/2/#L10">２ペト. 2:10</a>）</p></blockquote>

  - src: Татуировки
    path: Tt18p_入れ墨とピアス
    title: 入れ墨、ピアス
    meta_desc: 入れ墨とピアスについての聖書の引用
    menu: { parent: "人間/罪", title: "入れ墨、ピアス", priority: 18 }
    body: |-
      <p>入れ墨と体を傷つけることは、神によって禁じられています：</p><blockquote>「あなたたちは、あなたたちの神、主の子らである。死者を悼むために<b>体を傷つけたり</b>、額をそり上げてはならない」（<a href="https://bibleox.com/ja/jp-ni/vtor/14/#L1">申. 14:1</a>）</blockquote><blockquote>「もみあげをそり落としたり、ひげの両端をそってはならない。死者を悼んで<b>身を傷つけたり、入れ墨をしてはならない</b>。わたしは主である」（<a href="https://bibleox.com/ja/jp-ni/lev/19/#L27-28">レビ. 19:27-28</a>）</blockquote><blockquote>「こういうわけで、兄弟たち、神の憐れみによってあなたがたに勧めます。<b>自分の体を神に喜ばれる聖なる生けるいけにえとして献げなさい</b>。これこそ、あなたがたのなすべき礼拝です。あなたがたはこの世に倣ってはなりません。むしろ、心を新たにして自分を変えていただき、何が神の御心であるか、何が善いことで、神に喜ばれ、また完全なことであるかをわきまえるようになりなさい」（<a href="https://bibleox.com/ja/jp-ni/rim/12/#L1-2">ロマ. 12:1-2</a>）</blockquote><blockquote>「主はモーセに言われた。<b>アロンの子である祭司たちに告げて</b>こう言いなさい。&lt;…&gt; また、頭髪の一部をそり上げたり、ひげの両端をそり落としたり、<b>身を傷つけたりしてはならない</b>」（<a href="https://bibleox.com/ja/jp-ni/lev/21/#L1,5">レビ. 21:1,5</a>）</blockquote>

  - src: oGj1_Взятки
    path: Br19b_賄賂
    title: 賄賂（罪）
    title_sub: 贈収賄
    menu: { parent: "人間/罪", title: "賄賂", priority: 19 }
    body: |-
      <blockquote><p>「<strong>あなたは賄賂を取ってはならない。賄賂は、目のあいている者の目を見えなくし、正しい人の言い分をゆがめるからである</strong>」（<a href="https://bibleox.com/ja/jp-ni/ish/23/#L8">出. 23:8</a>）</p></blockquote><blockquote><p>「裁きを曲げず、偏り見ず、<strong>賄賂を受け取ってはならない。賄賂は賢い者の目をくらませ、正しい者の言い分をゆがめるからである</strong>」（<a href="https://bibleox.com/ja/jp-ni/vtor/16/#L19">申. 16:19</a>）</p></blockquote><blockquote><p>「賢者さえも、虐げられれば狂い<strong>賄賂をもらえば理性を失う</strong>」（<a href="https://bibleox.com/ja/jp-ni/ekl/7/#L7">コヘ. 7:7</a>）</p></blockquote><blockquote><p>「<strong>神に逆らう者は</strong>人のふところから<strong>賄賂を取り裁きの道を曲げる</strong>」（<a href="https://bibleox.com/ja/jp-ni/pr/17/#L23">箴. 17:23</a>）</p></blockquote><blockquote><p>「王が正しい裁きによって国を安定させても<strong>貢ぎ物を取り立てる者がこれを滅ぼす</strong>」（<a href="https://bibleox.com/ja/jp-ni/pr/29/#L4">箴. 29:4</a>）</p></blockquote><blockquote><p>「サムエルは年老い、イスラエルのために裁きを行う者として息子たちを任命した。&lt;…&gt; しかし、<strong>この息子たちは父の道を歩まず、不正な利益を求め、賄賂を取って</strong>裁きを曲げた」（<a href="https://bibleox.com/ja/jp-ni/1ts/8/#L1,3">サム上. 8:1,3</a>）</p></blockquote><blockquote><p>「神を無視する者の一族に子は生まれず<strong>賄賂を好む者の天幕は火に焼き尽くされる</strong>。彼は苦しみをはらみ、災いを生む。その腹は欺きをはぐくむ」（<a href="https://bibleox.com/ja/jp-ni/iov/15/#L34-35">ヨブ. 15:34-35</a>）</p></blockquote><blockquote><p>「わたしの魂を<strong>罪ある者</strong>の魂と共にわたしの命を流血を犯す者の命と共に取り上げないでください。<strong>彼らの手は汚れた行いに馴れその右の手には奪った物が満ちています</strong>」（<a href="https://bibleox.com/ja/jp-ni/ps/26/#L9-10">詩. 26:9-10</a>）<em>（「奪った物」は、ヘブライ語原文では שֹׁחַד —「<strong>賄賂</strong>」です。）</em></p></blockquote><blockquote><p>「彼らは<strong>欲が深く</strong>、うそ偽りであなたがたを食い物にします。このような者たちに対する裁きは、昔から怠りなくなされていて、彼らの滅びも滞ることはありません。&lt;…&gt; 不義を行う者は、不義にふさわしい報いを受けます。彼らは、昼間から享楽にふけるのを楽しみにしています。彼らは汚れやきずのようなもので、あなたがたと宴席に連なるとき、はめを外して騒ぎます。その目は絶えず姦通の相手を求め、飽くことなく罪を重ねています。彼らは心の定まらない人々を誘惑し、<strong>その心は強欲におぼれ</strong>、呪いの子になっています。彼らは、正しい道から離れてさまよい歩き、<strong>ボソルの子バラムが歩んだ道をたどったのです。バラムは不義のもうけを好み</strong>」（<a href="https://bibleox.com/ja/jp-ni/2pet/2/#L3,13-15">２ペト. 2:3,13-15</a>）</p></blockquote>

  - src: yD3R_Воровство
    path: Th19f_盗み
    title: 盗み
    menu: { parent: "人間/罪", title: "盗み", priority: 19 }
    body: |-
      <blockquote><p>「<strong>正しくない者が神の国を受け継げないことを、知らないのですか。思い違いをしてはいけない</strong>。みだらな者、偶像を礼拝する者、姦通する者、男娼、男色をする者、<strong><mark>泥棒</mark></strong>、強欲な者、酒におぼれる者、人を悪く言う者、人の物を奪う者は、<strong><mark>決して神の国を受け継ぐことができません</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/1kor/6/#L9-10">１コリ. 6:9-10</a>）</p></blockquote><blockquote><p>「<strong>盗みを働いていた者は、今からは盗んではいけません</strong>。むしろ、労苦して自分の手で正当な収入を得、困っている人々に分け与えるようにしなさい」（<a href="https://bibleox.com/ja/jp-ni/ef/4/#L28">エフェ. 4:28</a>）</p></blockquote><blockquote><p>「<strong><mark>主なるわたしは正義を愛し、献げ物の強奪を憎む</mark></strong>。まことをもって彼らの労苦に報いとこしえの契約を彼らと結ぶ」（<a href="https://bibleox.com/ja/jp-ni/is/61/#L8">イザ. 61:8</a>）</p></blockquote><blockquote><p>「彼はわたしに言った。『これは全地に向かって出て行く呪いである。<strong>すべての盗人はその一方の面に記されている呪いに従って一掃される</strong>。また偽って誓う者も、他の面の呪いに従って一掃される。』わたしがこれを送り出す、と万軍の主は言われる。それは盗人の家にわが名によって偽りの誓いをする者の家に入りその家の中に宿り梁も石ももろともに滅ぼし尽くす」（<a href="https://bibleox.com/ja/jp-ni/zah/5/#L3-4">ゼカ. 5:3-4</a>）</p></blockquote><blockquote><p>「<strong>盗み</strong>、殺し、姦淫し、偽って誓い、バアルに香をたき、知ることのなかった異教の神々に従いながら、<strong>わたしの名によって呼ばれるこの神殿に来てわたしの前に立ち</strong>、『救われた』と言うのか。お前たちはあらゆる忌むべきことをしているではないか」（<a href="https://bibleox.com/ja/jp-ni/ier/7/#L9-10">エレ. 7:9-10</a>）</p></blockquote><blockquote><p>「神はこれらすべての言葉を告げられた。&lt;…&gt; <strong>盗んではならない</strong>」（<a href="https://bibleox.com/ja/jp-ni/ish/20/#L1,15">出. 20:1,15</a>）</p></blockquote><blockquote><p>「主はモーセに仰せになった。&lt;…&gt;『あなたたちは<strong>盗んではならない</strong>。うそをついてはならない。互いに欺いてはならない』」（<a href="https://bibleox.com/ja/jp-ni/lev/19/#L1,11">レビ. 19:1,11</a>）</p></blockquote><hr><blockquote><p>「また、<strong><mark>悪人に向かって、わたしが、『お前は必ず死ぬ』と言ったとしても、もし彼がその過ちから立ち帰って</mark></strong>正義と恵みの業を行うなら、すなわち、<strong><mark>その悪人が質物を返し、奪ったものを償い、命の掟に従って歩き</mark></strong>、不正を行わないなら、<strong><mark>彼は必ず生きる</mark></strong>。死ぬことはない。<strong>彼の犯したすべての過ちは思い起こされず、正義と恵みの業を行った者は必ず生きる</strong>」（<a href="https://bibleox.com/ja/jp-ni/iez/33/#L14-16">エゼ. 33:14-16</a>）</p></blockquote><blockquote><p>「<strong><mark>しかし、ザアカイは立ち上がって、主に言った。『主よ、わたしは財産の半分を貧しい人々に施します。また、だれかから何かだまし取っていたら、それを四倍にして返します。』</mark></strong>イエスは言われた。『<strong><mark>今日、救いがこの家を訪れた</mark></strong>。この人もアブラハムの子なのだから。人の子は、失われたものを捜して救うために来たのである』」（<a href="https://bibleox.com/ja/jp-ni/lk/19/#L8-10">ルカ. 19:8-10</a>）</p></blockquote>

  - src: человекоугодие
    path: Mp20l_人にへつらうこと
    title: 人にへつらうこと（えこひいき）
    menu: { parent: "人間/罪", title: "人にへつらうこと", priority: 20 }
    body: |-
      <blockquote>「わたしの兄弟たち、栄光に満ちた、わたしたちの主イエス・キリストを信じながら、<b>人を分け隔てしてはなりません</b>。あなたがたの集まりに、金の指輪をはめた立派な身なりの人が入って来、また、汚らしい服装の貧しい人も入って来るとします。<b>その立派な身なりの人に特別に目を留めて、『あなたは、こちらの席にお掛けください』と言い、貧しい人には、『あなたは、そこに立っているか</b>、わたしの足もとに座るかしていなさい』と言うなら、あなたがたは、自分たちの中で差別をし、誤った考えに基づいて判断を下したことになるのではありませんか。&lt;…&gt; もしあなたがたが、聖書に従って、『隣人を自分のように愛しなさい』という最も尊い律法を実行しているのなら、それは結構なことです。しかし、<b>人を分け隔てするなら、あなたがたは罪を犯すことになり</b>、律法によって違犯者と断定されます」（<a href="https://bibleox.com/ja/jp-ni/iak/2/#L1-4,8-9">ヤコ. 2:1-4,8-9</a>）</blockquote><blockquote>「奴隷たち、どんなことについても肉による主人に従いなさい。<b>人にへつらおうとしてうわべだけで仕えず</b>、主を畏れつつ、真心を込めて従いなさい」（<a href="https://bibleox.com/ja/jp-ni/kol/3/#L22">コロ. 3:22</a>）</blockquote><blockquote>「奴隷たち、キリストに従うように、恐れおののき、真心を込めて、肉による主人に従いなさい。<b>人にへつらおうとして、うわべだけで仕えるのではなく</b>、キリストの奴隷として、心から神の御心を行い、人にではなく主に仕えるように、喜んで仕えなさい」（<a href="https://bibleox.com/ja/jp-ni/ef/6/#L5-7">エフェ. 6:5-7</a>）</blockquote><blockquote>「恐れるべきでないところで、彼らは大いに恐れた。<b>神が人にへつらう者たちの骨を散らされたからである</b>。彼らは恥を受けた。神が彼らを退けられたからである」（<a href="https://bibleox.com/ja/gr-lxx-byz/ps/52/#L5">詩. 52:5、七十人訳</a>）<em>（ギリシア語からの訳：ὁ θεὸς διεσκόρπισεν ὀστᾶ ἀνθρωπαρέσκων。ヘブライ語本文に従う新共同訳 53:6 では「人にへつらう者」の語はありません。）</em></blockquote><blockquote>「いつまであなたたちは不正に裁き<b>神に逆らう者の味方をするのか</b>」（<a href="https://bibleox.com/ja/jp-ni/ps/82/#L2">詩. 82:2</a>）<em>（ヘブライ語原文では וּפְנֵי רְשָׁעִים תִּשְׂאוּ —「悪しき者の顔を立てる（えこひいきする）」です。）</em></blockquote><blockquote>「あなたたちは不正な裁判をしてはならない。<b>あなたは弱い者を偏ってかばったり、力ある者におもねってはならない</b>。同胞を正しく裁きなさい」（<a href="https://bibleox.com/ja/jp-ni/lev/19/#L15">レビ. 19:15</a>）</blockquote><blockquote>「これらもまた、賢人の言葉である。<b>裁判でえこひいきをするのは良くない</b>」（<a href="https://bibleox.com/ja/jp-ni/pr/24/#L23">箴. 24:23</a>）</blockquote><blockquote>「<b>人を偏り見るのはよくない</b>。だれでも一片のパンのために罪を犯しうる」（<a href="https://bibleox.com/ja/jp-ni/pr/28/#L21">箴. 28:21</a>）</blockquote><blockquote>「主は正義の胸当てを着け、<b>偽りのない裁き</b>の兜をかぶり」（<a href="https://bibleox.com/ja/jp-ni/prs/5/#L18">知. 5:18</a>）</blockquote><blockquote>「しかし、以下の事柄は恥じる必要がない。<b>他人の思惑を気にして罪を犯してはならない</b>。いと高き方の律法と契約、不信仰な者への正しい裁きを恥じるな」（<a href="https://bibleox.com/ja/jp-ni/prsir/42/#L1-2">シラ. 42:1-2</a>）<em>（ギリシア語 μὴ λάβῃς πρόσωπον τοῦ ἁμαρτάνειν —「人の顔色をうかがって罪を犯すな」）</em></blockquote><blockquote>「わたしも、あなたたちを民のすべてに軽んじられる価値なき者とした。あなたたちがわたしの道を守らず<b>人を偏り見つつ</b>教えたからだ」（<a href="https://bibleox.com/ja/jp-ni/mal/2/#L9">マラ. 2:9</a>）</blockquote><blockquote>「こういう者たちは、自分の運命について不平不満を鳴らし、欲望のままにふるまい、大言壮語し、<b>利益のために人にこびへつらいます</b>」（<a href="https://bibleox.com/ja/jp-ni/iud/1/#L16">ユダ. 1:16</a>）<em>（ギリシア語 θαυμάζοντες πρόσωπα ὠφελείας χάριν —「利益のために人の顔をほめそやす」）</em></blockquote>

  - src: грех-гомосексуализм
    path: Hm25s_同性愛
    title: 同性愛（男色）
    meta_desc: 同性愛の罪、同性愛者の行為についての聖書
    menu: { parent: "人間/罪", title: "同性愛", priority: 25 }
    body: |-
      <p>同性愛は罪であり、神の前に忌まわしいことです：</p><blockquote>「女と寝るように男と寝てはならない。それはいとうべきことである」（<a href="https://bibleox.com/ja/jp-ni/lev/18/#L22">レビ. 18:22</a>）</blockquote><blockquote>「女と寝るように男と寝る者は、両者共にいとうべきことをしたのであり、必ず死刑に処せられる。彼らの行為は死罪に当たる」（<a href="https://bibleox.com/ja/jp-ni/lev/20/#L13">レビ. 20:13</a>）</blockquote><p>同性愛は恥ずべき情欲であり、その報いを受けます：</p><blockquote>「それで、神は彼らを<b>恥ずべき情欲</b>にまかせられました。<b>女は自然の関係を自然にもとるものに変え、同じく男も、女との自然の関係を捨てて、互いに情欲を燃やし、男どうしで恥ずべきことを行い、その迷った行いの当然の報いを身に受けています</b>。彼らは神を認めようとしなかったので、神は彼らを無価値な思いに渡され、そのため、<b>彼らはしてはならないことをするようになりました</b>。&lt;…&gt; 彼らは、<b>このようなことを行う者が死に値する</b>という神の定めを知っていながら、自分でそれを行うだけではなく、<b>他人の同じ行為をも是認しています</b>」（<a href="https://bibleox.com/ja/jp-ni/rim/1/#L26-28,32">ロマ. 1:26-28,32</a>）</blockquote><p>同性愛は死に至る罪です：</p><blockquote>「<b>正しくない者が神の国を受け継げないことを、知らないのですか</b>。思い違いをしてはいけない。みだらな者、偶像を礼拝する者、姦通する者、男娼、<b>男色をする者</b>、泥棒、強欲な者、酒におぼれる者、人を悪く言う者、人の物を奪う者は、決して神の国を受け継ぐことができません」（<a href="https://bibleox.com/ja/jp-ni/1kor/6/#L9-10">１コリ. 6:9-10</a>）</blockquote><p>同性愛は不法であり、戒めによって禁じられ、神からの健全な教えに反します：</p><blockquote>「すなわち、次のことを知って用いれば良いものです。律法は、正しい者のために与えられているのではなく、<b>不法な者</b>や不従順な者、不信心な者や罪を犯す者、神を畏れぬ者や俗悪な者、父を殺す者や母を殺す者、人を殺す者、みだらな行いをする者、<b>男色をする者</b>、誘拐する者、偽りを言う者、偽証する者のために与えられ、そのほか、<b>健全な教えに反すること</b>があれば、そのために与えられているのです。今述べたことは、祝福に満ちた神の栄光の福音に一致しており、わたしはその福音をゆだねられています」（<a href="https://bibleox.com/ja/jp-ni/1tim/1/#L9-11">１テモ. 1:9-11</a>）</blockquote><p>ソドムとゴモラは同性愛の罪のゆえに滅ぼされました：</p><blockquote>「彼らがまだ床に就かないうちに、<b>ソドムの町の男たち</b>が、若者も年寄りもこぞって押しかけ、家を取り囲んで、わめきたてた。『<b>今夜、お前のところへ来た連中はどこにいる。ここへ連れて来い。なぶりものにしてやるから</b>。』ロトは、戸口の前にたむろしている男たちのところへ出て行き、後ろの戸を閉めて、言った。『どうか、皆さん、乱暴なことはしないでください。』&lt;…&gt; 二人の客はそのとき、手を伸ばして、ロトを家の中に引き入れて戸を閉め、戸口の前にいる男たちに、老若を問わず、目つぶしを食わせ、戸口を分からなくした。二人の客はロトに言った。『ほかに、あなたの身内の人がこの町にいますか。あなたの婿や息子や娘などを皆連れてここから逃げなさい。<b>実は、わたしたちはこの町を滅ぼしに来たのです。大きな叫びが主のもとに届いたので、主は、この町を滅ぼすためにわたしたちを遣わされたのです</b>』」（<a href="https://bibleox.com/ja/jp-ni/gen/19/#L4-7,10-13">創. 19:4-7,10-13</a>）<em>（「なぶりものにしてやる」は、ヘブライ語原文では וְנֵדְעָה אֹתָם —「彼らを知ろう（彼らと関係を持とう）」です。）</em></blockquote><blockquote>「ソドムやゴモラ、またその周辺の町は、この天使たちと同じく、みだらな行いにふけり、<b>不自然な肉の欲の満足を追い求めたので、永遠の火の刑罰を受け、見せしめにされています</b>」（<a href="https://bibleox.com/ja/jp-ni/iud/1/#L7">ユダ. 1:7</a>）</blockquote><p>神がヘブライ人に約束された地から、諸国の民は同性愛の罪のゆえに追い出されました：</p><blockquote>「わたしが、今日命じることを守りなさい。見よ、<b>わたしはあなたの前から、アモリ人、カナン人、ヘト人、ペリジ人、ヒビ人、エブス人を追い出す</b>」（<a href="https://bibleox.com/ja/jp-ni/ish/34/#L11">出. 34:11</a>）</blockquote><blockquote>「<b>女と寝るように男と寝てはならない</b>。それはいとうべきことである。&lt;…&gt; あなたたちは以上のいかなる性行為によっても、身を汚してはならない。<b>これらはすべて、あなたたちの前からわたしが追放しようとしている国々が行って、身を汚していることである</b>」（<a href="https://bibleox.com/ja/jp-ni/lev/18/#L22,24">レビ. 18:22,24</a>）</blockquote><blockquote>「<b>女と寝るように男と寝る者は、両者共にいとうべきことをしたのであり</b>、必ず死刑に処せられる。彼らの行為は死罪に当たる。&lt;…&gt; <b>あなたたちの前からわたしが追い払おうとしている国の風習に従ってはならない。彼らの行為はすべてわたしの嫌悪するものである</b>」（<a href="https://bibleox.com/ja/jp-ni/lev/20/#L13,23">レビ. 20:13,23</a>）</blockquote>

  - src: XBGN_Трансвестизм
    path: Tv26s_異性装
    title: 異性装
    menu: { parent: "人間/罪", title: "異性装", priority: 26 }
    body: |-
      <p><strong>異性装</strong>（トランスヴェスティズム。ラテン語 <em>trans</em> —「越えて」と <em>vestitus</em> —「着ている」から）とは、伝統的に異性のものとされる服を着ようとする、人の強迫的な欲求です。</p><blockquote><p><em>「</em><strong><em>女は男の着物を身に着けてはならない。男は女の着物を着てはならない</em></strong><em>。このようなことをする者をすべて、あなたの神、主はいとわれる」（</em><a href="https://bibleox.com/ja/jp-ni/vtor/22/#L5"><em>申. 22:5</em></a><em>）</em></p></blockquote>

  - src: родовые-грехи
    path: Ac50s_先祖の罪
    title: 先祖の罪
    menu: { parent: "人間/罪", title: "先祖の罪（そのような罪はない）", priority: 500 }
    body: |-
      <p>先祖の罪というものはありません。この概念は、たいてい、いわゆる「民間療法師」、霊能者、呪術師によって考え出され、用いられています。教会には原罪という概念がありますが、それは別の概念です（<a href="https://bibleox.com/ru/ru/w/7XucD5kC_%D0%92%D1%81%D0%B5%D0%BE%D0%B1%D1%89%D0%BD%D0%BE%D1%81%D1%82%D1%8C_%D0%BF%D0%B5%D1%80%D0%B2%D0%BE%D1%80%D0%BE%D0%B4%D0%BD%D0%BE%D0%B3%D0%BE_%D0%B3%D1%80%D0%B5%D1%85%D0%B0">引用</a>（ロシア語）を参照）。原罪から人を完全に解き放つのは教会の聖なる洗礼だけであって、呪術師や霊能者ではありません。彼らは神、主イエス・キリストの受肉の前にもいましたが、キリストが行われたことを行いはしませんでした。</p><p>神はそれぞれの人に、その人自身の罪について問われます。しかし、両親の正しい生活の結果も、両親の悪徳に満ちた生活の結果も、子供たちに及びます。それは、親が（アルコールや麻薬で）自分の健康を損なうと、それによって子供の健康を害するのと同じです。とはいえ、親が健康を損なったことについて子供に罪はありません。神の前で、子供は親のアルコール依存について何の責任も負いません。</p><p>この考えは、次の聖書の言葉から詳しく理解することができます：</p><blockquote><p>「<strong>お前たちがイスラエルの地で、このことわざを繰り返し口にしているのはどういうことか。『先祖が酸いぶどうを食べれば子孫の歯が浮く』と</strong>。わたしは生きている、と主なる神は言われる。お前たちはイスラエルにおいて、このことわざを二度と口にすることはない。すべての命はわたしのものである。父の命も子の命も、同様にわたしのものである。<strong>罪を犯した者、その人が死ぬ。<mark>もし、ある人が正しく、正義と恵みの業を行うなら</mark></strong>、すなわち、山の上で偶像の供え物を食べず、イスラエルの家の偶像を仰ぎ見ず、隣人の妻を犯さず、生理中の女性に近づかず、人を抑圧せず、負債者の質物を返し、力ずくで奪わず、飢えた者に自分のパンを与え、裸の者に衣服を着せ、利息を天引きして金を貸さず、高利を取らず、不正から手を引き、人と人との間を真実に裁き、<strong><mark>わたしの掟に従って歩み、わたしの裁きを忠実に守るなら、彼こそ正しい人で、彼は必ず生きる</mark></strong>、と主なる神は言われる。<strong><mark>彼に生まれた息子が乱暴者で</mark></strong>、これらの事の一つでも行う人の血を流し、自分自身はこれらすべての事の一つですら行わず、かえって山の上で偶像の供え物を食べ、隣人の妻を犯し、貧しい者、乏しい者を抑圧し、力ずくで奪い、質物を返さず、偶像を仰ぎ見て忌まわしいことを行い、利息を天引きして金を貸し、高利を取るならば、<strong><mark>彼は生きることができようか。彼は生きることはできない</mark></strong>。彼はこれらの忌まわしいことをしたのだから、<strong><mark>必ず死ぬ。その死の責任は彼にある</mark></strong>。<strong><mark>ところで、その人にまた息子が生まれ、彼が父の行ったすべての過ちを見て省み、このような事を行わないなら</mark></strong>、すなわち、山の上で偶像の供え物を食べず、イスラエルの家の偶像を仰ぎ見ず、隣人の妻を犯さず、人を抑圧せず、質物を取らず、力ずくで奪わず、飢えた者に自分のパンを与え、裸の者に衣服を着せ、貧しい者の抑圧から手を引き、天引きの利息や高利を取らず、<strong><mark>わたしの裁きを行い、わたしの掟に従って歩むなら、彼は父の罪のゆえに死ぬことはない。必ず生きる</mark></strong>。<strong><mark>彼の父は搾取を行い</mark></strong>、兄弟のものを力ずくで奪い、自分の民の中で善くない事をしたので、<strong><mark>自分の罪のゆえに死んだのである</mark></strong>。<strong><mark>それなのにお前たちは、『なぜ、子は父の罪を負わないのか』と言う。しかし、その子は正義と恵みの業を行い、わたしの掟をことごとく守り、行ったのだから、必ず生きる。罪を犯した本人が死ぬのであって、子は父の罪を負わず、父もまた子の罪を負うことはない。正しい人の正しさはその人だけのものであり、悪人の悪もその人だけのものである</mark></strong>。<strong><mark>悪人であっても、もし犯したすべての過ちから離れて、わたしの掟をことごとく守り、正義と恵みの業を行うなら、必ず生きる。死ぬことはない。彼の行ったすべての背きは思い起こされることなく、行った正義のゆえに生きる</mark></strong>。わたしは悪人の死を喜ぶだろうか、と主なる神は言われる。彼がその道から立ち帰ることによって、生きることを喜ばないだろうか。<strong><mark>しかし、正しい人でも、その正しさから離れて不正を行い、悪人がするようなすべての忌まわしい事を行うなら、彼は生きることができようか。彼の行ったすべての正義は思い起こされることなく、彼の背信の行為と犯した過ちのゆえに彼は死ぬ</mark></strong>。それなのにお前たちは、『主の道は正しくない』と言う。聞け、イスラエルの家よ。わたしの道が正しくないのか。正しくないのは、お前たちの道ではないのか。正しい人がその正しさから離れて不正を行い、そのゆえに死ぬなら、それは彼が行った不正のゆえに死ぬのである。しかし、悪人が自分の行った悪から離れて正義と恵みの業を行うなら、彼は自分の命を救うことができる。彼は悔い改めて、自分の行ったすべての背きから離れたのだから、必ず生きる。死ぬことはない。それなのにイスラエルの家は、『主の道は正しくない』と言う。イスラエルの家よ、わたしの道が正しくないのか。正しくないのは、お前たちの道ではないのか。それゆえ、イスラエルの家よ。わたしはお前たちひとりひとりをその道に従って裁く、と主なる神は言われる。悔い改めて、お前たちのすべての背きから立ち帰れ。罪がお前たちをつまずかせないようにせよ」（<a href="https://bibleox.com/ja/jp-ni/iez/18/#L2-30">エゼ. 18:2-30</a>）</p></blockquote><p>しかし人々はしばしば、それでも親の罪の咎は子供たちに伝わるという考えを抱きます。この考えは、次の聖書の節を読んだ後に生じます：</p><blockquote><p>「わたしは主、あなたの神。わたしは熱情の神である。<strong><u>わたしを否む者には</u>、父祖の罪を子孫に三代、四代までも問うが</strong>、わたしを愛し、わたしの戒めを守る者には、幾千代にも及ぶ慈しみを与える」（<a href="https://bibleox.com/ja/jp-ni/ish/20/#L5-6">出. 20:5-6</a>）<em>（「わたしを否む者」は、ヘブライ語原文では לְשֹׂנְאָי —「わたしを憎む者たち」です。）</em></p></blockquote><p>これは、代々にわたって神を憎み続ける人々について語っています。「<strong><u>わたしを憎む者たち</u>の三代、四代まで</strong>」。そのような人々は神への憎しみのゆえに罰せられます。なぜでしょうか。主は父、祖父、曾祖父の憎しみを忍ばれましたが、この憎しみがすでに3代目、4代目まで続いているので、忍耐が終わり、罰がそのような人々に臨むのです。</p><p>シリアの克肖者聖エフレム：</p><blockquote><p>5-6、13-14、16-17、22-26節。山の上で神は戒めを与えて言われる。わたしは主であり、わたしを憎む者たちについては、父祖の罪を子孫に三代、四代まで問う。<strong><mark>神はその寛容によって悪人を、またその息子と孫を忍ばれる。しかし彼らが悔い改めないなら、四代目の者がその悪において父祖たちと同じようになるやいなや、その頭に罰を下されるのである</mark></strong>。</p></blockquote><p>（<a href="https://azbyka.ru/otechnik/Efrem_Sirin/tolkovanie-na-knigu-iskhod/20">「出エジプト記注解」20章</a>、ロシア語。ロシア語からの訳）</p>
