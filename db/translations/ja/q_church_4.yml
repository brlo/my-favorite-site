lang: ja
list: jp_q
pages:
  - src: анания-и-сапфира
    path: As9k_アナニアとサフィラ
    title: アナニアとサフィラ
    meta_desc: アナニアとサフィラへの罰をどう理解するかについての聖書の引用
    menu: { parent: "教会", title: "アナニアとサフィラ", priority: 28 }
    body: |-
      <p>教会の生活の初めに、主は教会の中の生活の清さを特に厳しく見守っておられます。こうして、教会を欺こうとしたために、夫と妻（アナニアとサフィラ）は使徒の言葉によって倒れて死にます。</p><blockquote><p>「ところが、<strong>アナニア</strong>という男は、妻の<strong>サフィラ</strong>と相談して<strong>土地を売り</strong>、妻も承知のうえで、<strong>代金をごまかし</strong>、その一部を持って来て使徒たちの足もとに置いた。すると、ペトロは言った。『<strong>アナニア、なぜ、あなたはサタンに心を奪われ、聖霊を欺いて、土地の代金をごまかしたのか</strong>。売らないでおけば、あなたのものだったし、また、売っても、その代金は自分の思いどおりになったのではないか。どうして、こんなことをする気になったのか。<strong>あなたは人間を欺いたのではなく、神を欺いたのだ</strong>。』<strong>この言葉を聞くと、アナニアは倒れて息が絶えた</strong>。そのことを耳にした人々は皆、非常に恐れた。若者たちが立ち上がって死体を包み、運び出して葬った。それから三時間ほどたって、アナニアの妻がこの出来事を知らずに入って来た。ペトロは彼女に話しかけた。『あなたたちは、あの土地をこれこれの値段で売ったのか。言いなさい。』彼女は、『はい、その値段です』と言った。ペトロは言った。『二人で示し合わせて、主の霊を試すとは、何としたことか。見なさい。あなたの夫を葬りに行った人たちが、もう入り口まで来ている。今度はあなたを担ぎ出すだろう。』すると、<strong>彼女はたちまちペトロの足もとに倒れ、息が絶えた。青年たちは入って来て、彼女の死んでいるのを見ると、運び出し、夫のそばに葬った</strong>。教会全体とこれを聞いた人は皆、非常に恐れた」（<a href="https://bibleox.com/ja/jp-ni/act/5/#L1-11">使. 5:1-11</a>）</p></blockquote><p>旧約の教会でも同じでした。その教会の生活の初めに、ある男が安息日の休みを破ったために死をもって罰せられました。</p><blockquote><p>「イスラエルの人々が荒れ野にいたときのこと、<strong>ある男が安息日に薪を拾い集めているところを見つけられた</strong>。見つけた人々は、彼をモーセとアロンおよび共同体全体のもとに連れて来たが、どうすべきか、示しが与えられていなかったので、留置しておいた。<strong>主はモーセに言われた。『その男は必ず死刑に処せられる</strong>。共同体全体が宿営の外で彼を石で打ち殺さねばならない。』共同体全体は、主がモーセに命じられたとおり、彼を宿営の外に連れ出して石で打ち殺したので、彼は死んだ」（<a href="https://bibleox.com/ja/jp-ni/chis/15/#L32-36">民. 15:32-36</a>）</p></blockquote><p>のちにユダヤ人は、祭司たちでさえ（<a href="https://bibleox.com/ja/jp-ni/iez/22/#L26">エゼ. 22:26</a>）、繰り返し安息日を破りましたが（<a href="https://bibleox.com/ja/jp-ni/neem/13/#L15-16,18">ネヘ. 13:15-16,18</a>; <a href="https://bibleox.com/ja/jp-ni/iez/20/#L13,16,21,24">エゼ. 20:13,16,21,24</a>; <a href="https://bibleox.com/ja/jp-ni/iez/22/#L8">エゼ. 22:8</a>; <a href="https://bibleox.com/ja/jp-ni/iez/23/#L38">エゼ. 23:38</a>）、そのときには、ただちに死をもって罰する代わりに、安息日が破られるのを防ごうとする努力がなされました。</p><blockquote><p>「そこで、安息日の始まる前に、エルサレムの城門の辺りが暗くなってくると、<strong>わたしはその扉を閉じるように命じ、安息日が過ぎるまでそれを開けないように言いつけた</strong>。そしてわたしの部下をその門の前に立たせ、<strong>安息日には荷物が決して運び込まれないようにした</strong>。そのため、取り引きする人やあらゆるものを売る人が、エルサレムの外で夜を過ごすことも一度ならずあった。わたしは彼らを戒めて、『なぜ城壁の前で夜を過ごすのか。繰り返すならば、お前たちを処罰する』と言った。そのとき以来、彼らは安息日には来なくなった。<strong>またわたしはレビ人に、身を清めて門を守り、安息日を聖とするように命じた</strong>」（<a href="https://bibleox.com/ja/jp-ni/neem/13/#L19-22">ネヘ. 13:19-22</a>）</p></blockquote><blockquote><p>「<strong>主はわたしにこう言われた</strong>。『行って、ユダの王たちが出入りする<strong>民の子らの門や、エルサレムのすべての門に立ち</strong>、彼らに言うがよい。これらの門を入るユダの王たち、ユダのすべての者、<strong>エルサレムのすべての住民よ</strong>、主の言葉を聞け。主はこう言われる。<strong>あなたたちは、慎んで、安息日に荷を運ばないようにしなさい。エルサレムのどの門からも持ち込んではならない。また安息日に、荷をあなたたちの家から持ち出してはならない。どのような仕事もしてはならない。安息日を聖別しなさい</strong>』」（<a href="https://bibleox.com/ja/jp-ni/ier/17/#L19-22">エレ. 17:19-22</a>）</p></blockquote>

  - src: DZxa_Действие_благодати_через_недостойных
    path: Gu4w_ふさわしくない者を通して働く恵み
    title: ふさわしくない者を通して働く恵み
    menu: { parent: "教会", title: "ふさわしくない者を通して働く恵み", priority: 299 }
    body: |-
      <h2>大祭司カイアファ</h2><p>キリストを殺そうとしている人を通して、預言が語られます。自分の考えからではなく、ただ彼がその年の大祭司であったからです。</p><blockquote><p>「彼らの中の一人で、その年の大祭司であった<strong><mark>カイアファ</mark></strong>が言った。『あなたがたは何も分かっていない。<strong>一人の人間が民の代わりに死に、国民全体が滅びないで済む方が、あなたがたに好都合だとは考えないのか。』<mark>これは、カイアファが自分の考えから話したのではない。その年の大祭司であったので預言して</mark>、イエスが国民のために死ぬ、と言ったのである</strong>」（<a href="https://bibleox.com/ja/jp-ni/in/11/#L49-51">ヨハ. 11:49-51</a>）</p></blockquote><h2>イスカリオテのユダ</h2><blockquote><p>「イエスは<strong>十二人の弟子を呼び寄せ</strong>、<strong><mark>汚れた霊に対する権能をお授けになった。汚れた霊を追い出し、あらゆる病気や患いをいやすためであった</mark></strong>。十二使徒の名は次のとおりである。まずペトロと呼ばれるシモンとその兄弟アンデレ、ゼベダイの子ヤコブとその兄弟ヨハネ、フィリポとバルトロマイ、トマスと徴税人のマタイ、アルファイの子ヤコブとタダイ、熱心党のシモン、それにイエスを裏切った<strong>イスカリオテの<mark>ユダ</mark></strong>である。イエスはこの十二人を派遣するにあたり、次のように命じられた。&lt;…&gt;『<strong>病人をいやし、死者を生き返らせ、重い皮膚病を患っている人を清くし、悪霊を追い払いなさい</strong>。ただで受けたのだから、ただで与えなさい』」（<a href="https://bibleox.com/ja/jp-ni/mf/10/#L1-5,8">マタ. 10:1-5,8</a>）</p></blockquote><blockquote><p>「弟子の一人で、後にイエスを裏切る<strong>イスカリオテの<mark>ユダ</mark></strong>が言った。&lt;…&gt; 彼がこう言ったのは、貧しい人々のことを心にかけていたからではない。彼は<strong><mark>盗人であって</mark></strong>、金入れを預かっていながら、その中身をごまかしていたからである」（<a href="https://bibleox.com/ja/jp-ni/in/12/#L4,6">ヨハ. 12:4,6</a>）</p></blockquote><h2>神の誠実は人の不誠実にまさる</h2><blockquote><p>「それはいったいどういうことか。<strong>彼らの中に不誠実な者たちがいたにせよ、その不誠実のせいで、神の誠実が無にされるとでもいうのですか。決してそうではない</strong>。人はすべて偽り者であるとしても、神は真実な方であるとすべきです。『あなたは、言葉を述べるとき、正しいとされ、裁きを受けるとき、勝利を得られる』と書いてあるとおりです」（<a href="https://bibleox.com/ja/jp-ni/rim/3/#L3-4">ロマ. 3:3-4</a>）</p></blockquote><h2>司祭の責任</h2><blockquote><p>「すべて多く与えられた者は、多く求められ、<strong>多く任された者は、更に多く要求される</strong>」（<a href="https://bibleox.com/ja/jp-ni/lk/12/#L48">ルカ. 12:48</a>）</p></blockquote>

  - src: 2R3w_Требования_к_ставленнику_в_епископы_пресвитеры_диаконы
    path: Qb8e_主教司祭輔祭の候補者に求められる条件
    title: 主教・司祭・輔祭の候補者に求められる条件
    title_sub: 主教の候補者に求められる条件
    menu: { parent: "教会", title: "主教に求められる条件", priority: 300 }
    body: |-
      <p><em>新共同訳では、ἐπίσκοπος（主教）は「監督」、πρεσβύτερος（司祭）は「長老」、διάκονος（輔祭）は「奉仕者」と訳されています。</em></p><h2>比較の一覧表</h2><table class="custom-table"><colgroup></colgroup><tbody><tr><td><p><strong>テモテ</strong>（エフェソの町、１テモ. 1:3）</p><p>（<a href="https://bibleox.com/ja/jp-ni/1tim/3/#L1-13"><u>１テモ. 3:1-13</u></a>）</p></td><td><p><strong>テトス</strong>（クレタ島、テト. 1:5）</p><p>（<a href="https://bibleox.com/ja/jp-ni/tit/1/#L5-9"><u>テト. 1:5-9</u></a>）</p></td></tr><tr><td><p>非のうちどころがない</p></td><td><p>非難される点がない</p><p>神から任命された管理者として、非難される点がない</p></td></tr><tr><td><p>一人の妻の夫</p></td><td><p>一人の妻の夫</p></td></tr><tr><td><p>節制する</p></td><td><p>自分を制する</p></td></tr><tr><td><p>分別がある</p></td><td><p>分別がある</p></td></tr><tr><td><p>礼儀正しい</p></td><td><p>清い</p></td></tr><tr><td><p> </p></td><td><p>正しい</p></td></tr><tr><td><p>客を親切にもてなす</p></td><td><p>客を親切にもてなす</p></td></tr><tr><td><p>よく教えることができる</p></td><td><p>教えに適う信頼すべき言葉をしっかり守り、健全な教えに従って勧めたり、反対者の主張を論破したりすることができる</p></td></tr><tr><td><p>酒におぼれない</p></td><td><p>酒におぼれない</p></td></tr><tr><td><p>乱暴でない</p></td><td><p>乱暴でない</p></td></tr><tr><td><p>争いを好まない</p></td><td><p>わがままでない</p></td></tr><tr><td><p>金銭に執着しない</p></td><td><p>恥ずべき利益をむさぼらない</p></td></tr><tr><td><p>寛容である</p></td><td><p>すぐに怒らない</p></td></tr><tr><td><p>自分の家庭をよく治める</p></td><td><p> </p></td></tr><tr><td><p>常に品位を保って子供たちを従順な者に育てている（自分の家庭を治めることを知らない者に、どうして神の教会の世話ができるでしょうか）</p></td><td><p>その子供たちも信者であって、放蕩を責められたり、不従順であったりしない</p></td></tr><tr><td><p>信仰に入って間もない人ではない。高慢になって悪魔と同じ裁きを受けかねないから</p></td><td><p> </p></td></tr><tr><td><p>教会以外の人々からも良い評判を得ている。そうでなければ、中傷され、悪魔の罠に陥りかねないから</p></td><td><p>善を愛する</p></td></tr></tbody></table><h2>引用</h2><blockquote><p>「この言葉は真実です。『<strong>監督</strong>（主教）の職を求める人がいれば、その人は良い仕事を望んでいる。』</p><p>だから、<strong>監督</strong>（主教）は、</p><ul><li><p>非のうちどころがなく、</p></li><li><p>一人の妻の夫であり、</p></li><li><p>節制し、</p></li><li><p>分別があり、</p></li><li><p>礼儀正しく、</p></li><li><p>客を親切にもてなし、</p></li><li><p>よく教えることができなければなりません。</p></li><li><p>また、酒におぼれず、</p></li><li><p>乱暴でなく、</p></li><li><p>寛容で、</p></li><li><p>争いを好まず、</p></li><li><p>金銭に執着せず、</p></li><li><p>自分の家庭をよく治め、</p></li><li><p>常に品位を保って子供たちを従順な者に育てている人でなければなりません。自分の家庭を治めることを知らない者に、どうして神の教会の世話ができるでしょうか。</p></li><li><p>監督は、信仰に入って間もない人ではいけません。それでは高慢になって悪魔と同じ裁きを受けかねないからです。</p></li><li><p>更に、監督は、教会以外の人々からも良い評判を得ている人でなければなりません。そうでなければ、中傷され、悪魔の罠に陥りかねないからです。</p></li></ul><p>同じように、<strong>奉仕者</strong>（輔祭）たちも</p><ul><li><p>品位のある人でなければなりません。</p></li><li><p>二枚舌を使わず、</p></li><li><p>大酒を飲まず、</p></li><li><p>恥ずべき利益をむさぼらず、</p></li><li><p>清い良心の中に信仰の秘められた真理を持っている人でなければなりません。</p></li><li><p>この人々もまず審査を受けるべきです。その上で、非難される点がなければ、奉仕者の務めに就かせなさい。</p></li></ul><p><strong>婦人の奉仕者たち</strong><em>（ギリシア語 γυναῖκας —「女たち」、すなわち輔祭の妻たちとも理解されます）</em>も同じように</p><ul><li><p>品位のある人でなければなりません。</p></li><li><p>中傷せず、</p></li><li><p>節制し、</p></li><li><p>あらゆる点で忠実な人でなければなりません。</p></li></ul><p><strong>奉仕者</strong>（輔祭）は</p><ul><li><p>一人の妻の夫で、</p></li><li><p>子供たちと自分の家庭をよく治める人でなければなりません。</p></li></ul><p>というのも、奉仕者の仕事を立派に果たした人々は、良い地位を得、キリスト・イエスへの信仰によって大きな確信を得るようになるからです」</p><p>（<a href="https://bibleox.com/ja/jp-ni/1tim/3/#L1-13">１テモ. 3:1-13</a>）</p></blockquote><blockquote><p>「あなたをクレタに残してきたのは、わたしが指示しておいたように、残っている仕事を整理し、町ごとに<strong>長老たち</strong><em>（ギリシア語 πρεσβυτέρους —「司祭たち」）</em>を立ててもらうためです。長老は、</p><ul><li><p>非難される点がなく、</p></li><li><p>一人の妻の夫であり、</p></li><li><p>その子供たちも信者であって、放蕩を責められたり、不従順であったりしてはなりません。</p></li></ul><p><strong>監督</strong>（主教）は</p><ul><li><p>神から任命された管理者であるので、非難される点があってはならないのです。</p></li><li><p>わがままでなく、</p></li><li><p>すぐに怒らず、</p></li><li><p>酒におぼれず、</p></li><li><p>乱暴でなく、</p></li><li><p>恥ずべき利益をむさぼらず、</p></li><li><p>かえって、客を親切にもてなし、</p></li><li><p>善を愛し、</p></li><li><p>分別があり、</p></li><li><p>正しく、</p></li><li><p>清く、</p></li><li><p>自分を制し、</p></li><li><p>教えに適う信頼すべき言葉をしっかり守る人でなければなりません。そうでないと、健全な教えに従って勧めたり、反対者の主張を論破したりすることもできないでしょう」</p></li></ul><p>（<a href="https://bibleox.com/ja/jp-ni/tit/1/#L5-9">テト. 1:5-9</a>）</p></blockquote>

  - src: DeTG_Повторный_брак
    path: Rm5y_再婚
    title: 再婚
    menu: { parent: "教会", title: "再婚", priority: 1000 }
    references: |-
      <p>教会での奉仕のためにやもめを選ぶこと：</p><blockquote><p>「やもめとして登録するのは、六十歳未満の者ではなく、<strong>一人の夫の妻</strong>であった人」（<a href="https://bibleox.com/ja/jp-ni/1tim/5/#L9">１テモ. 5:9</a>）</p></blockquote><p>さらに詳しく（ロシア語）：</p><ul><li><p><a href="https://azbyka.ru/otechnik/Mihail_Zheltov/tserkovnoe-blagoslovenie-povtornyh-brakov/">https://azbyka.ru/otechnik/Mihail_Zheltov/tserkovnoe-blagoslovenie-povtornyh-brakov/</a></p></li></ul>
    body: |-
      <h2>キリスト教の理想</h2><p>キリスト教の理想は、生涯ただ一度の結婚です。</p><h2>信徒への譲歩</h2><p>妻または夫が死んだ場合、新しい結婚は勧められてはいませんが（キリスト者は死後の生命と死者の全体的な復活を信じているからです）、使徒が語った譲歩として許されています。人が何か重い罪に陥り、ついにはまったく滅びてしまうことのないようにするためです。</p><blockquote><p>「<strong>未婚者とやもめに言いますが</strong>、皆わたしのように独りでいるのがよいでしょう。しかし、<strong>自分を抑制できなければ結婚しなさい。<mark>情欲に身を焦がすよりは、結婚した方がましだからです</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/1kor/7/#L8-9">１コリ. 7:8-9</a>）</p></blockquote><blockquote><p>「だから、わたしが望むのは、<strong>若いやもめは再婚し</strong>、子供を産み、家事を取りしきり、反対者に悪口の機会を一切与えないことです」（<a href="https://bibleox.com/ja/jp-ni/1tim/5/#L14">１テモ. 5:14</a>）</p></blockquote><p>救い主もまた、離縁の禁止について語りながら、淫行（姦淫）の場合を例外とされます。</p><blockquote><p>「『妻を離縁する者は、離縁状を渡せ』と命じられている。しかし、わたしは言っておく。<strong>不法な結婚でもないのに</strong>妻を離縁する者はだれでも、その女に姦通の罪を犯させることになる。離縁された女を妻にする者も、姦通の罪を犯すことになる」（<a href="https://bibleox.com/ja/jp-ni/mf/5/#L31-32">マタ. 5:31-32</a>）<em>（「不法な結婚でもないのに」は、ギリシア語原文では παρεκτὸς λόγου πορνείας —「淫行の理由以外で」です。）</em></p></blockquote><p>こうして、配偶者が死んだ場合、あるいは不貞を働いた場合には、新しい結婚が可能です。しかしそれも際限なくではなく、譲歩としてだけ、さらに二回までです。</p><p>同様の考え方から、教会はこれらの理由にいくつかのほかの理由も加えました。たとえば配偶者による命の危険<a href="https://azbyka.ru/otechnik/dokumenty/osnovy-sotsialnoj-kontseptsii-russkoj-pravoslavnoj-tserkvi/#0_10_3">など</a>です（ロシア語）。</p><h2>神品には、一度だけ結婚した者を選ばなければならない</h2><p>このことに触れておくのは、一つの結婚にとどまることが、実際により尊い生き方と見なされていることを知るためです。</p><blockquote><p>「だから、<strong>監督</strong>（主教）<strong>は、非のうちどころがなく、一人の妻の夫であり</strong>、節制し、分別があり、礼儀正しく、客を親切にもてなし、よく教えることができなければなりません」（<a href="https://bibleox.com/ja/jp-ni/1tim/3/#L2">１テモ. 3:2</a>）</p></blockquote><blockquote><p>「<strong>奉仕者</strong>（輔祭）<strong>は一人の妻の夫で</strong>、子供たちと自分の家庭をよく治める人でなければなりません」（<a href="https://bibleox.com/ja/jp-ni/1tim/3/#L12">１テモ. 3:12</a>）</p></blockquote><blockquote><p>「あなたをクレタに残してきたのは、わたしが指示しておいたように、残っている仕事を整理し、<strong>町ごとに長老たち</strong><em>（ギリシア語 πρεσβυτέρους —「司祭たち」）</em><strong>を立ててもらうためです</strong>。<strong>長老は、非難される点がなく、一人の妻の夫であり</strong>、その子供たちも信者であって、放蕩を責められたり、不従順であったりしてはなりません」（<a href="https://bibleox.com/ja/jp-ni/tit/1/#L5-6">テト. 1:5-6</a>）</p></blockquote>
