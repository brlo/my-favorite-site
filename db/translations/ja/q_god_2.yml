  - src: Иисус_Христос-единственный-спаситель-человечества
    path: Tg3v_イエスキリスト救い主
    title: イエス・キリスト — 救い主
    meta_desc: イエス・キリストがすべての人の救い主であり、すべての人がキリストに招かれているが、すべての人が救われるのではないことを示す聖書の引用
    menu: { parent: "神/子", title: "キリスト — 救い主", priority: 3 }
    body: |-
      <p>この記事では、イエス・キリストが救い主であることだけでなく、どのような救い主であるか、すなわち、すべての人の救い主であることを示します。すべての人がキリストに招かれていますが、すべての人が救われるのではありません。</p><h2>異教の神々は神ではない</h2><p>ほかに神はいません。</p><blockquote><p>「そこで、偶像に供えられた肉を食べることについてですが、世の中に偶像の神などはなく、また、<strong>唯一の神以外にいかなる神もいない</strong>ことを、わたしたちは知っています」（<a href="https://bibleox.com/ja/jp-ni/1kor/8/#L4">１コリ. 8:4</a>）</p></blockquote><p>異教徒たちがかつて仕えていたものは神ではありません。</p><blockquote><p>「ところで、あなたがたはかつて、神を知らずに、<strong>もともと神でない神々</strong>に奴隷として仕えていました」（<a href="https://bibleox.com/ja/jp-ni/gal/4/#L8">ガラ. 4:8</a>）</p></blockquote><p>偽りの神々：</p><blockquote><p>「皆さん、なぜ、こんなことをするのですか。わたしたちも、あなたがたと同じ人間にすぎません。あなたがたが、<strong>このような偶像を離れて、生ける神に立ち帰るように</strong>、わたしたちは福音を告げ知らせているのです。この神こそ、天と地と海と、そしてその中にあるすべてのものを造られた方です」（<a href="https://bibleox.com/ja/jp-ni/act/14/#L15">使. 14:15</a>）</p></blockquote><p>かつて、すべての国の民は神の道ではなく、自分たちの道を歩んでいました。</p><blockquote><p>「神は過ぎ去った時代には、<strong>すべての国の人が思い思いの道を行くままにしておかれました</strong>」（<a href="https://bibleox.com/ja/jp-ni/act/14/#L16">使. 14:16</a>）</p></blockquote><p>同様の引用はこちらにも多くあります：<a href="https://bibleox.com/ja/ja/w/phBYjemy_神は唯一である/">神は唯一である</a></p><h2>キリストを拒むことは、神を拒むことである</h2><blockquote><p>「<strong>わたしを拒む者は、わたしを遣わされた方を拒むのである</strong>」（<a href="https://bibleox.com/ja/jp-ni/lk/10/#L16">ルカ. 10:16</a>）</p></blockquote><blockquote><p>「<strong>わたしを憎む者は、わたしの父をも憎んでいる</strong>」（<a href="https://bibleox.com/ja/jp-ni/in/15/#L23">ヨハ. 15:23</a>）</p></blockquote><blockquote><p>「<strong>御子を認めない者はだれも、御父に結ばれていません</strong>。御子を公に言い表す者は、御父にも結ばれています」（<a href="https://bibleox.com/ja/jp-ni/1in/2/#L23">１ヨハ. 2:23</a>）</p></blockquote><blockquote><p>「だれであろうと、<strong>キリストの教えを越えて</strong>、<strong>これにとどまらない者は、神に結ばれていません</strong>。その教えにとどまっている人にこそ、御父も御子もおられます」（<a href="https://bibleox.com/ja/jp-ni/2in/1/#L9">２ヨハ. 1:9</a>）</p></blockquote><blockquote><p>「御子を信じる人は永遠の命を得ているが、<strong>御子に従わない者は、命にあずかることがないばかりか、神の怒りがその上にとどまる</strong>」（<a href="https://bibleox.com/ja/jp-ni/in/3/#L36">ヨハ. 3:36</a>）</p></blockquote><h2>キリストへの信仰なしに救われることはできない</h2><blockquote><p>「この人が良くなって、皆さんの前に立っているのは、あなたがたが十字架につけて殺し、神が死者の中から復活させられたあのナザレの人、<strong>イエス・キリストの名によるもの</strong>です。この方こそ、『あなたがた家を建てる者に捨てられたが、隅の親石となった石』です。<strong>ほかのだれによっても、救いは得られません</strong>。<strong>わたしたちが救われるべき名は、天下にこの名のほか、人間には与えられていないのです</strong>」（<a href="https://bibleox.com/ja/jp-ni/act/4/#L10-12">使. 4:10-12</a>）</p></blockquote><blockquote><p>「<strong>信仰がなければ、神に喜ばれることはできません</strong>。神に近づく者は、神が存在しておられること、また、神は御自分を求める者たちに報いてくださる方であることを、信じていなければならないからです」（<a href="https://bibleox.com/ja/jp-ni/evr/11/#L6">ヘブ. 11:6</a>）</p></blockquote><h2>異端と教会からの分離は救いを失わせる</h2><p>異端を作り出す者は神の国を受け継ぎません。</p><blockquote><p>「肉の業は明らかです。それは、姦淫、わいせつ、好色、偶像礼拝、魔術、敵意、争い、そねみ、怒り、利己心、<strong>不和</strong>*、<strong>仲間争い</strong>*、ねたみ、泥酔、酒宴、その他このたぐいのものです。以前言っておいたように、ここでも前もって言いますが、このようなことを行う者は、<strong>神の国を受け継ぐことはできません</strong>」（<a href="https://bibleox.com/ja/jp-ni/gal/5/#L19-21">ガラ. 5:19-21</a>）</p><p><strong><em>*新共同訳で「不和」「仲間争い」と訳されている語は、ギリシア語原文ではそれぞれ διχοστασίαι（分裂、分離）と αἱρέσεις（異端）です（<a href="https://bibleox.com/ja/gr-lxx-byz/gal/5/#L20">ガラ. 5:20</a>）。</em></strong></p></blockquote><p>教会の中に分裂を引き起こす者は、主イエス・キリストに仕えていません。</p><blockquote><p>「兄弟たち、あなたがたに勧めます。あなたがたの学んだ教えに反して、<strong>不和やつまずきをもたらす人々を警戒しなさい</strong>。彼らから遠ざかりなさい。<strong>こういう人々は、わたしたちの主であるキリストに仕えないで</strong>、自分の腹に仕えている。そして、うまい言葉やへつらいの言葉によって純朴な人々の心を欺いているのです」（<a href="https://bibleox.com/ja/jp-ni/rim/16/#L17-18">ロマ. 16:17-18</a>）</p><p>「不和」と訳されている語は、ギリシア語原文では διχοστασίας（分裂）です。</p></blockquote><blockquote><p>「彼ら［使徒たち］はあなたがたにこう言いました。『終わりの時には、あざける者どもが現れ、不信心な欲望のままにふるまう。』この者たちは、<strong>分裂を引き起こし</strong><em>（ギリシア語 ἀποδιορίζοντες、「分け隔てる者」、すなわち信仰の一致から自分を切り離す者）</em>、この世の命のままに生き、霊を持たない者です」（<a href="https://bibleox.com/ja/jp-ni/iud/1/#L18-19">ユダ. 1:18-19</a>）</p></blockquote><p>教会はキリストの体であり、キリストは体の救い主です。</p><blockquote><p>「こうして、主は<strong>救われる人々を日々仲間に加え一つにされた</strong>のである」（<a href="https://bibleox.com/ja/jp-ni/act/2/#L47">使. 2:47</a>）</p></blockquote><blockquote><p>「<strong>キリストの体である教会</strong>」（<a href="https://bibleox.com/ja/jp-ni/kol/1/#L24">コロ. 1:24</a>）</p></blockquote><blockquote><p>「キリストが教会の頭であり、自らその<strong>体の救い主</strong>である」（<a href="https://bibleox.com/ja/jp-ni/ef/5/#L23">エフェ. 5:23</a>）</p></blockquote><h2>すべての人が裁きを受ける</h2><blockquote><p>「なぜなら、<strong>わたしたちは皆、キリストの裁きの座の前に立ち</strong>、<strong>善であれ悪であれ</strong>、めいめい体を住みかとしていたときに<strong>行ったことに応じて</strong>、報いを受けねばならないからです」（<a href="https://bibleox.com/ja/jp-ni/2kor/5/#L10">２コリ. 5:10</a>）</p></blockquote><blockquote><p>「<strong>神は、善をも悪をも一切の業を</strong>、隠れたこともすべて<strong>裁きの座に引き出されるであろう</strong>」（<a href="https://bibleox.com/ja/jp-ni/ekl/12/#L14">コヘ. 12:14</a>）</p></blockquote><h3>裁きは教会から始まる</h3><blockquote><p>「<strong>今こそ、神の家から裁きが始まる時です。わたしたちがまず裁きを受けるのだとすれば</strong>、神の福音に従わない者たちの行く末は、いったい、どんなものになるだろうか。『<strong>正しい人がやっと救われるのなら</strong>、不信心な人や罪深い人はどうなるのか』と言われているとおりです」（<a href="https://bibleox.com/ja/jp-ni/1pet/4/#L17-18">１ペト. 4:17-18</a>）</p></blockquote><h3>わたしたちは皆、多くの罪を犯す</h3><blockquote><p>「<strong>わたしたちは皆、度々過ちを犯す</strong>からです。言葉で過ちを犯さないなら、それは自分の全身を制御できる完全な人です」（<a href="https://bibleox.com/ja/jp-ni/iak/3/#L2">ヤコ. 3:2</a>）</p></blockquote><blockquote><p>「<strong>自分に罪がないと言うなら、自らを欺いており</strong>、真理はわたしたちの内にありません。&lt;…&gt; 罪を犯したことがないと言うなら、それは神を偽り者とすることであり、神の言葉はわたしたちの内にありません」（<a href="https://bibleox.com/ja/jp-ni/1in/1/#L8,10">１ヨハ. 1:8,10</a>）</p></blockquote><h3>多くの人が、救われないことに驚く</h3><p>彼らは自分が救われていると思っていました。</p><blockquote><p>「かの日には、<strong>大勢の者</strong>がわたしに、『主よ、主よ、わたしたちは御名によって<strong>預言し</strong>、御名によって<strong>悪霊を追い出し</strong>、御名によって<strong>奇跡をいろいろ行った</strong>ではありませんか』と言うであろう。そのとき、わたしはきっぱりとこう言おう。『<strong>あなたたちのことは全然知らない</strong>。不法を働く者ども、<strong>わたしから離れ去れ</strong>』」（<a href="https://bibleox.com/ja/jp-ni/mf/7/#L22-23">マタ. 7:22-23</a>）</p></blockquote><h2>多くの人は救われない</h2><h3>すべての人が救われるのではない</h3><blockquote><p>「狭い戸口から入るように努めなさい。言っておくが、<strong>入ろうとしても入れない人が多いのだ</strong>」（<a href="https://bibleox.com/ja/jp-ni/lk/13/#L24">ルカ. 13:24</a>）</p></blockquote><blockquote><p>「狭い門から入りなさい。<strong>滅びに通じる門は広く</strong>、その道も広々として、<strong>そこから入る者が多い</strong>。しかし、<strong>命に通じる門はなんと狭く</strong>、その道も細いことか。<strong>それを見いだす者は少ない</strong>」（<a href="https://bibleox.com/ja/jp-ni/mf/7/#L13-14">マタ. 7:13-14</a>）</p></blockquote><blockquote><p>「<strong>わたしに向かって、『主よ、主よ』と言う者が皆、天の国に入るわけではない</strong>。わたしの天の父の御心を行う者だけが入るのである」（<a href="https://bibleox.com/ja/jp-ni/mf/7/#L21">マタ. 7:21</a>）</p></blockquote><blockquote><p>「農夫が地に多くの種を蒔き、多くの苗を植えるが、時が来ても、蒔かれたものがすべて無事に芽を出すわけでなく、植えられたものがすべて根づくわけでもない。それと同じく、<strong>この世に蒔かれた人々がすべて救われるわけではない</strong>」（<a href="https://bibleox.com/ja/jp-ni/3ezd/8/#L41">３エズ. 8:41</a>）</p></blockquote><h3>救われる者は少ない</h3><blockquote><p>「すると、『主よ、<strong>救われる者は少ないのでしょうか</strong>』と言う人がいた。イエスは一同に言われた。『狭い戸口から入るように努めなさい。<strong>言っておくが、入ろうとしても入れない人が多いのだ</strong>』」（<a href="https://bibleox.com/ja/jp-ni/lk/13/#L23-24">ルカ. 13:23-24</a>）</p></blockquote><blockquote><p>「狭い門から入りなさい。<strong>滅びに通じる門は広く</strong>、その道も広々として、<strong>そこから入る者が多い</strong>。しかし、<strong>命に通じる門はなんと狭く</strong>、その道も細いことか。<strong>それを見いだす者は少ない</strong>」（<a href="https://bibleox.com/ja/jp-ni/mf/7/#L13-14">マタ. 7:13-14</a>）</p></blockquote><blockquote><p>「かの日には、<strong>大勢の者</strong>がわたしに、『主よ、主よ、わたしたちは御名によって預言し、御名によって悪霊を追い出し、御名によって奇跡をいろいろ行ったではありませんか』と言うであろう。そのとき、わたしはきっぱりとこう言おう。『<strong>あなたたちのことは全然知らない。不法を働く者ども、わたしから離れ去れ</strong>』」（<a href="https://bibleox.com/ja/jp-ni/mf/7/#L22-23">マタ. 7:22-23</a>）</p></blockquote><blockquote><p>「<strong>小さな群れ</strong>よ、恐れるな。あなたがたの父は喜んで神の国をくださる」（<a href="https://bibleox.com/ja/jp-ni/lk/12/#L32">ルカ. 12:32</a>）</p></blockquote><blockquote><p>「不正を行う者には、なお不正を行わせ、汚れた者は、なお汚れるままにしておけ。正しい者には、なお正しいことを行わせ、<strong>聖なる者は、なお聖なる者とならせよ</strong>。見よ、わたしはすぐに来る。わたしは、報いを携えて来て、<strong>それぞれの行いに応じて報いる</strong>」（<a href="https://bibleox.com/ja/jp-ni/otkr/22/#L11-12">黙. 22:11-12</a>）</p></blockquote>

  - src: Христос-жертва
    path: Ns8q_キリストいけにえ
    title: キリスト — いけにえ
    meta_desc: キリストのいけにえについての聖書の引用
    menu: { parent: "神/子", title: "キリスト — いけにえ", priority: 5 }
    body: |-
      <h2>神の子がいけにえとなることは、世界の創造の前からあらかじめ知られていた</h2><blockquote><p>「きずや汚れのない小羊のようなキリストの尊い血によるのです。キリストは、<strong>天地創造の前からあらかじめ知られていましたが</strong>、この終わりの時代に、あなたがたのために現れてくださいました」（<a href="https://bibleox.com/ja/jp-ni/1pet/1/#L19-20">１ペト. 1:19-20</a>）</p></blockquote><h2>アブラハムの祝福</h2><blockquote><p>「キリストは、わたしたちのために呪いとなって、わたしたちを律法の呪いから贖い出してくださいました。『木にかけられた者は皆呪われている』と書いてあるからです。それは、<strong>アブラハムに与えられた祝福が、キリスト・イエスにおいて異邦人に及ぶため</strong>であり、また、わたしたちが、約束された“霊”を信仰によって受けるためでした」（<a href="https://bibleox.com/ja/jp-ni/gal/3/#L13-14">ガラ. 3:13-14</a>）</p></blockquote><h2>贖い</h2><blockquote><p>「知ってのとおり、<strong>あなたがたが</strong>先祖伝来のむなしい生活から<strong>贖われたのは</strong>、金や銀のような朽ち果てるものにはよらず、<strong>きずや汚れのない小羊のようなキリストの尊い血によるのです</strong>」（<a href="https://bibleox.com/ja/jp-ni/1pet/1/#L18-19">１ペト. 1:18-19</a>）</p></blockquote><blockquote><p>「<strong>キリストは、わたしたちのために呪いとなって、わたしたちを律法の呪いから贖い出してくださいました</strong>。『木にかけられた者は皆呪われている』と書いてあるからです」（<a href="https://bibleox.com/ja/jp-ni/gal/3/#L13">ガラ. 3:13</a>）</p></blockquote><blockquote><p>「<strong>キリストも、多くの人の罪を負うためにただ一度身を献げられた</strong>後、二度目には、罪を負うためではなく、御自分を待望している人たちに、救いをもたらすために現れてくださるのです」（<a href="https://bibleox.com/ja/jp-ni/evr/9/#L28">ヘブ. 9:28</a>）</p></blockquote><h2>和解</h2><blockquote><p>「実に、<strong>キリストはわたしたちの平和であります。二つのものを一つにし</strong>、<strong>御自分の肉において敵意という隔ての壁を取り壊し</strong>、規則と戒律ずくめの律法を廃棄されました。こうしてキリストは、双方を御自分において一人の新しい人に造り上げて平和を実現し、<strong>十字架を通して、両者を一つの体として神と和解させ、十字架によって敵意を滅ぼされました</strong>」（<a href="https://bibleox.com/ja/jp-ni/ef/2/#L14-16">エフェ. 2:14-16</a>）</p></blockquote><blockquote><p>「敵であったときでさえ、<strong>御子の死によって神と和解させていただいた</strong>のであれば、和解させていただいた今は、御子の命によって救われるのはなおさらです」（<a href="https://bibleox.com/ja/jp-ni/rim/5/#L10">ロマ. 5:10</a>）</p></blockquote><blockquote><p>「これらはすべて神から出ることであって、<strong>神は、キリストを通してわたしたちを御自分と和解させ</strong>、また、和解のために奉仕する任務をわたしたちにお授けになりました」（<a href="https://bibleox.com/ja/jp-ni/2kor/5/#L18">２コリ. 5:18</a>）</p></blockquote><blockquote><p>「つまり、<strong>神はキリストによって世を御自分と和解させ</strong>、人々の罪の責任を問うことなく、和解の言葉をわたしたちにゆだねられたのです」（<a href="https://bibleox.com/ja/jp-ni/2kor/5/#L19">２コリ. 5:19</a>）</p></blockquote><blockquote><p>「その十字架の血によって平和を打ち立て、地にあるものであれ、天にあるものであれ、<strong>万物をただ御子によって、御自分と和解させられました</strong>」（<a href="https://bibleox.com/ja/jp-ni/kol/1/#L20">コロ. 1:20</a>）</p></blockquote><blockquote><p>「しかし今や、<strong>神は御子の肉の体において、その死によってあなたがたと和解し、御自身の前に聖なる者</strong>、きずのない者、<strong>とがめるところのない者としてくださいました</strong>」（<a href="https://bibleox.com/ja/jp-ni/kol/1/#L22">コロ. 1:22</a>）</p></blockquote><h2>神との一致</h2><blockquote><p>「<strong>キリストも、罪のためにただ一度苦しまれました</strong>。正しい方が、正しくない者たちのために苦しまれたのです。<strong>あなたがたを神のもとへ導くためです</strong>」（<a href="https://bibleox.com/ja/jp-ni/1pet/3/#L18">１ペト. 3:18</a>）</p></blockquote><h2>聖体（キリストの体と血にあずかること）</h2><blockquote><p>「わたしたちには一つの祭壇があります。幕屋に仕えている人たちは、それから食べ物を取って食べる権利がありません。なぜなら、罪を贖うための動物の血は、大祭司によって聖所に運び入れられますが、その体は宿営の外で焼かれるからです。それで、<strong>イエスもまた、御自分の血で民を聖なる者とするために</strong>、門の外で<strong>苦難に遭われたのです</strong>」（<a href="https://bibleox.com/ja/jp-ni/evr/13/#L10-12">ヘブ. 13:10-12</a>）</p></blockquote><blockquote><p>「一同が食事をしているとき、イエスはパンを取り、賛美の祈りを唱えて、それを裂き、弟子たちに与えながら言われた。『取って食べなさい。これはわたしの体である。』また、杯を取り、感謝の祈りを唱え、彼らに渡して言われた。『<strong>皆、この杯から飲みなさい。これは、罪が赦されるように、多くの人のために流されるわたしの血、契約の血である</strong>』」（<a href="https://bibleox.com/ja/jp-ni/mf/26/#L26-28">マタ. 26:26-28</a>）</p></blockquote><blockquote><p>「感謝の祈りをささげてそれを裂き、『<strong>これは、あなたがたのためのわたしの体である</strong>。わたしの記念としてこのように行いなさい』と言われました。また、食事の後で、杯も同じようにして、『この杯は、わたしの血によって立てられる新しい契約である』」（<a href="https://bibleox.com/ja/jp-ni/1kor/11/#L24-25">１コリ. 11:24-25</a>）</p></blockquote><h2>新しい契約</h2><blockquote><p>「感謝の祈りをささげてそれを裂き、『これは、あなたがたのためのわたしの体である。わたしの記念としてこのように行いなさい』と言われました。また、食事の後で、杯も同じようにして、『<strong>この杯は、わたしの血によって立てられる新しい契約である</strong>』」（<a href="https://bibleox.com/ja/jp-ni/1kor/11/#L24-25">１コリ. 11:24-25</a>）</p></blockquote><h2>御国</h2><blockquote><p>「<strong>キリストが死に、そして生きたのは、死んだ人にも生きている人にも主となられるためです</strong>」（<a href="https://bibleox.com/ja/jp-ni/rim/14/#L9">ロマ. 14:9</a>）</p></blockquote><p>父の御心、預言、約束を成就するため</p><blockquote><p>「わたしは言う。キリストは<strong>神の真実を現すために</strong>、割礼ある者たちに仕える者となられたのです。それは、<strong>先祖たちに対する約束を確証されるため</strong>であり」（<a href="https://bibleox.com/ja/jp-ni/rim/15/#L8">ロマ. 15:8</a>）</p></blockquote><h2>模範</h2><blockquote><p>「あなたがたが召されたのはこのためです。というのは、<strong>キリストもあなたがたのために苦しみを受け、その足跡に続くようにと、模範を残された</strong>からです」（<a href="https://bibleox.com/ja/jp-ni/1pet/2/#L21">１ペト. 2:21</a>）</p></blockquote><blockquote><p>「<strong>その一人の方はすべての人のために死んでくださった。その目的は、生きている人たちが、もはや自分自身のために生きるのではなく、自分たちのために死んで復活してくださった方のために生きることなのです</strong>」（<a href="https://bibleox.com/ja/jp-ni/2kor/5/#L15">２コリ. 5:15</a>）</p></blockquote><h2>イスラム教徒からの質問</h2><h3>憐れみ深い神がただ赦すことができるなら、なぜいけにえが必要なのか</h3><p>キリスト教徒が信じる神は、愛と呼ばれています。</p><blockquote><p>「愛することのない者は神を知りません。<strong>神は愛だからです</strong>。&lt;…&gt; わたしたちは、わたしたちに対する神の愛を知り、また信じています。<strong>神は愛です</strong>。愛にとどまる人は、神の内にとどまり、神もその人の内にとどまってくださいます」（<a href="https://bibleox.com/ja/jp-ni/1in/4/#L8,16">１ヨハ. 4:8,16</a>）</p></blockquote><p>神は、御自分の被造物を救うために御自身をいけにえとして献げることによってこそ、被造物への愛を示されます。神御自身がこう言われたからです。</p><blockquote><p>「<strong><mark>友のために自分の命を捨てること、これ以上に大きな愛はない</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/in/15/#L13">ヨハ. 15:13</a>）</p></blockquote><p>こうして神は、いけにえとなる愛によって、救おうと望まれる人々を御自分のもとへ引き寄せられます。</p><blockquote><p>「<strong>わたしは地上から上げられる［十字架にかけられる］とき、すべての人を自分のもとへ引き寄せよう</strong>。イエスは、<strong>御自分がどのような死を遂げるかを示そうとして</strong>、こう言われたのである」（<a href="https://bibleox.com/ja/jp-ni/in/12/#L32-33">ヨハ. 12:32-33</a>）</p></blockquote><p>しかし、全知の神は救いを賢明に整えられます。愛のほかに、神の正義を満たすことについても語ることができます。神は憐れみ深いだけでなく、正しい方でもあるからです。神は、知恵、憐れみ、正義、愛のすべてを一度に結び合わせることを知っておられます。</p>

  - src: Христос-искупитель
    path: Wf6k_キリスト贖い主
    title: キリスト — 贖い主
    meta_desc: 「あなたは、屠られて、あらゆる種族と言葉の違う民、あらゆる民族と国民の中から、御自分の血で、神のために人々を贖われ」（黙 5:9）
    menu: { parent: "神/子", title: "キリスト — 贖い主", priority: 10 }
    body: |-
      <p>アダムの罪によって、全人類が罪に定められました。</p><blockquote><p>「そこで、<strong>一人の罪によってすべての人に有罪の判決が下された</strong>ように、一人の正しい行為によって、すべての人が義とされて命を得ることになったのです」（<a href="https://bibleox.com/ja/jp-ni/rim/5/#L18">ロマ. 5:18</a>）</p></blockquote><p>キリストは人類の呪いを御自身に負われました。</p><blockquote><p>「キリストは、わたしたちのために呪いとなって、わたしたちを律法の呪いから贖い出してくださいました。『木にかけられた者は皆呪われている』と書いてあるからです」（<a href="https://bibleox.com/ja/jp-ni/gal/3/#L13">ガラ. 3:13</a>）</p></blockquote><p>キリストは御自分の血によって人を贖われました。</p><blockquote><p>「知ってのとおり、<strong>あなたがたが先祖伝来のむなしい生活から贖われたのは</strong>、金や銀のような朽ち果てるものにはよらず、きずや汚れのない小羊のような<strong>キリストの尊い血によるのです</strong>」（<a href="https://bibleox.com/ja/jp-ni/1pet/1/#L18-19">１ペト. 1:18-19</a>）</p></blockquote><blockquote><p>「そして、彼らは新しい歌をうたった。『あなたは、巻物を受け取り、その封印を開くのにふさわしい方です。あなたは、屠られて、あらゆる種族と言葉の違う民、あらゆる民族と国民の中から、<strong>御自分の血で、神のために人々を贖われ</strong>』」（<a href="https://bibleox.com/ja/jp-ni/otkr/5/#L9">黙. 5:9</a>）</p></blockquote>

  - src: Христос-судья
    path: Jm2r_キリスト審判者
    title: キリスト — 審判者
    meta_desc: 「わたしたちは皆、キリストの裁きの座の前に立ち、善であれ悪であれ、めいめい体を住みかとしていたときに行ったことに応じて、報いを受けねばならない」（２コリ 5:10）
    menu: { parent: "神/子", title: "キリスト — 審判者", priority: 12 }
    body: |-
      <h2>イエス・キリストは最後の審判で、すべての人を裁かれる</h2><blockquote><p>「<strong>人の子</strong>は、父の栄光に輝いて天使たちと共に来るが、そのとき、<strong>それぞれの行いに応じて報いる</strong>のである」（<a href="https://bibleox.com/ja/jp-ni/mf/16/#L27">マタ. 16:27</a>）</p></blockquote><blockquote><p>「<strong>人の子</strong>は、栄光に輝いて天使たちを皆従えて来るとき、その栄光の座に着く。そして、すべての国の民がその前に集められると、羊飼いが羊と山羊を分けるように、<strong>彼らをより分け</strong>」（<a href="https://bibleox.com/ja/jp-ni/mf/25/#L31-32">マタ. 25:31-32</a>）</p></blockquote><blockquote><p>「また、父はだれをも裁かず、<strong>裁きは一切子に任せておられる</strong>」（<a href="https://bibleox.com/ja/jp-ni/in/5/#L22">ヨハ. 5:22</a>）</p></blockquote><blockquote><p>「つまり、<strong>ナザレのイエス</strong>のことです。神は、聖霊と力によってこの方を油注がれた者となさいました。イエスは、方々を巡り歩いて人々を助け、悪魔に苦しめられている人たちをすべていやされたのですが、それは、神が御一緒だったからです。&lt;…&gt; そしてイエスは、<strong>御自分が生きている者と死んだ者との審判者として神から定められた者であること</strong>を、民に宣べ伝え、力強く証しするようにと、わたしたちにお命じになりました」（<a href="https://bibleox.com/ja/jp-ni/act/10/#L38,42">使. 10:38,42</a>）</p></blockquote><blockquote><p>「それは、<strong>先にお選びになった一人の方によって、この世を正しく裁く</strong>日をお決めになったからです。神は<strong>この方を死者の中から復活させて</strong>、すべての人にそのことの確証をお与えになったのです」（<a href="https://bibleox.com/ja/jp-ni/act/17/#L31">使. 17:31</a>）</p></blockquote><blockquote><p>「なぜなら、わたしたちは皆、<strong>キリストの裁きの座</strong>の前に立ち、善であれ悪であれ、めいめい体を住みかとしていたときに行ったことに応じて、報いを受けねばならないからです」（<a href="https://bibleox.com/ja/jp-ni/2kor/5/#L10">２コリ. 5:10</a>）</p></blockquote><blockquote><p>「神の御前で、そして、<strong>生きている者と死んだ者を裁くために来られるキリスト・イエス</strong>の御前で、その出現とその御国とを思いつつ、厳かに命じます」（<a href="https://bibleox.com/ja/jp-ni/2tim/4/#L1">２テモ. 4:1</a>）</p></blockquote><h2>すべての人が裁きを受ける</h2><blockquote><p>「なぜなら、<strong><mark>わたしたちは皆</mark>、キリストの裁きの座の前に立ち</strong>、<strong>善であれ悪であれ</strong>、めいめい体を住みかとしていたときに<strong>行ったことに応じて</strong>、報いを受けねばならないからです」（<a href="https://bibleox.com/ja/jp-ni/2kor/5/#L10">２コリ. 5:10</a>）</p></blockquote><blockquote><p>「それなのに、なぜあなたは、自分の兄弟を裁くのですか。また、なぜ兄弟を侮るのですか。<strong><mark>わたしたちは皆</mark>、神の裁きの座の前に立つのです</strong>」（<a href="https://bibleox.com/ja/jp-ni/rim/14/#L10">ロマ. 14:10</a>）</p></blockquote><blockquote><p>「<strong><mark>自由をもたらす律法によっていずれは裁かれる者として</mark></strong>、語り、またふるまいなさい」（<a href="https://bibleox.com/ja/jp-ni/iak/2/#L12">ヤコ. 2:12</a>）</p></blockquote><blockquote><p>「<strong>神は</strong>、善をも悪をも<strong><mark>一切の業</mark>を</strong>、隠れたこともすべて<strong>裁きの座に引き出されるであろう</strong>」（<a href="https://bibleox.com/ja/jp-ni/ekl/12/#L14">コヘ. 12:14</a>）</p></blockquote><blockquote><p>「<strong>人の子</strong>は、栄光に輝いて天使たちを皆従えて来るとき、<strong>その栄光の座に着く</strong>。そして、<strong><mark>すべての国の民</mark>がその前に集められると</strong>、羊飼いが<strong><mark>羊と山羊を分ける</mark></strong>ように、<strong>彼らを<mark>より分け</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/mf/25/#L31-32">マタ. 25:31-32</a>）</p></blockquote><h2>裁きは教会から始まる</h2><blockquote><p>「<strong>今こそ、<mark>神の家から</mark>裁きが始まる時です</strong>。<strong><mark>わたしたちがまず裁きを受けるのだとすれば</mark></strong>、神の福音に従わない者たちの行く末は、いったい、どんなものになるだろうか。『<strong>正しい人がやっと救われるのなら</strong>、不信心な人や罪深い人はどうなるのか』と言われているとおりです」（<a href="https://bibleox.com/ja/jp-ni/1pet/4/#L17-18">１ペト. 4:17-18</a>）</p></blockquote><blockquote><p>「わたしにとっては、<strong>あなたがたから裁かれようと、人間の法廷で裁かれようと、少しも問題ではありません。<mark>わたしは、自分で自分を裁くことすらしません</mark></strong>。自分には何もやましいところはないが、<strong>それでわたしが義とされているわけではありません。<mark>わたしを裁くのは主なのです</mark></strong>。ですから、<strong>主が来られるまでは、先走って何も裁いてはいけません</strong>。主は闇の中に隠されている秘密を明るみに出し、人の心の企てをも明らかにされます。そのとき、おのおのは神からおほめにあずかります」（<a href="https://bibleox.com/ja/jp-ni/1kor/4/#L3-5">１コリ. 4:3-5</a>）</p></blockquote><h2>キリストは、人が体のうちに生きていた間に行ったことを裁かれる</h2><blockquote><p>「なぜなら、わたしたちは皆、キリストの裁きの座の前に立ち、善であれ悪であれ、めいめい<strong><mark>体を住みかとしていたときに行ったこと</mark>に応じて、報いを受け</strong>ねばならないからです」（<a href="https://bibleox.com/ja/jp-ni/2kor/5/#L10">２コリ. 5:10</a>）</p></blockquote><p>裁きは、体のうちに行われた地上の行いに基づいて下されます。</p><blockquote><p>「それから、王は左側にいる人たちにも言う。『<strong>呪われた者ども、わたしから離れ去り、悪魔とその手下のために用意してある永遠の火に入れ。お前たちは、わたしが飢えていたときに食べさせず</strong>、のどが渇いたときに飲ませず、旅をしていたときに宿を貸さず、裸のときに着せず、病気のとき、牢にいたときに、訪ねてくれなかったからだ。』すると、彼らも答える。『主よ、いつわたしたちは、あなたが飢えたり、渇いたり、旅をしたり、裸であったり、病気であったり、牢におられたりするのを見て、お世話をしなかったでしょうか。』そこで、王は答える。『はっきり言っておく。<strong>この最も小さい者の一人にしなかったのは、わたしにしてくれなかったことなのである。』こうして、この者どもは永遠の罰を受け、正しい人たちは永遠の命にあずかるのである</strong>」（<a href="https://bibleox.com/ja/jp-ni/mf/25/#L41-46">マタ. 25:41-46</a>）</p></blockquote>

  - src: отвержение-Христа-отвержение-Бога
    path: Ry7p_キリストを拒むことは神を拒むこと
    title: キリストを拒むことは、神を拒むことである
    menu: { parent: "神/子", title: "キリストを拒むことは神を拒むこと", priority: 13 }
    body: |-
      <blockquote><p>「<strong>わたしを拒む者は、わたしを遣わされた方を拒むのである</strong>」（<a href="https://bibleox.com/ja/jp-ni/lk/10/#L16">ルカ. 10:16</a>）</p></blockquote><blockquote><p>「<strong>わたしを憎む者は、わたしの父をも憎んでいる</strong>」（<a href="https://bibleox.com/ja/jp-ni/in/15/#L23">ヨハ. 15:23</a>）</p></blockquote><blockquote><p>「<strong>御子を認めない者はだれも、御父に結ばれていません</strong>。御子を公に言い表す者は、御父にも結ばれています」（<a href="https://bibleox.com/ja/jp-ni/1in/2/#L23">１ヨハ. 2:23</a>）</p></blockquote><blockquote><p>「だれであろうと、<strong>キリストの教えを越えて</strong>、<strong>これにとどまらない者は、神に結ばれていません</strong>。その教えにとどまっている人にこそ、御父も御子もおられます」（<a href="https://bibleox.com/ja/jp-ni/2in/1/#L9">２ヨハ. 1:9</a>）</p></blockquote><blockquote><p>「御子を信じる人は永遠の命を得ているが、<strong>御子に従わない者は、命にあずかることがないばかりか、神の怒りがその上にとどまる</strong>」（<a href="https://bibleox.com/ja/jp-ni/in/3/#L36">ヨハ. 3:36</a>）</p></blockquote>

  - src: Христос-безгрешен
    path: Ze4b_キリストは罪のない方
    title: キリストは罪のない方である
    menu: { parent: "神/子", title: "キリストは罪のない方", priority: 14 }
    body: |-
      <blockquote><p>「<strong>罪と何のかかわりもない方</strong>を、神はわたしたちのために罪となさいました」（<a href="https://bibleox.com/ja/jp-ni/2kor/5/#L21">２コリ. 5:21</a>）</p></blockquote><blockquote><p>「この大祭司は、わたしたちの弱さに同情できない方ではなく、<strong>罪を犯されなかったが</strong>、あらゆる点において、わたしたちと同様に試練に遭われたのです」（<a href="https://bibleox.com/ja/jp-ni/evr/4/#L15">ヘブ. 4:15</a>）</p></blockquote><blockquote><p>「このように聖であり、<strong>罪なく、汚れなく、罪人から離され</strong>、もろもろの天よりも高くされている大祭司」（<a href="https://bibleox.com/ja/jp-ni/evr/7/#L26">ヘブ. 7:26</a>）</p></blockquote><blockquote><p>「永遠の“霊”によって、御自身を<strong>きずのないもの</strong>として神に献げられたキリスト」（<a href="https://bibleox.com/ja/jp-ni/evr/9/#L14">ヘブ. 9:14</a>）</p></blockquote><blockquote><p>「<strong>御子には罪がありません</strong>」（<a href="https://bibleox.com/ja/jp-ni/1in/3/#L5">１ヨハ. 3:5</a>）</p></blockquote><blockquote><p>「もはや、あなたがたと多くを語るまい。<strong>世の支配者</strong>が来るからである。だが、<strong>彼はわたしをどうすることもできない</strong>」（<a href="https://bibleox.com/ja/jp-ni/in/14/#L30">ヨハ. 14:30</a>）</p><p>ギリシア語原文では ἐν ἐμοὶ οὐκ ἔχει οὐδέν、すなわち「<strong>彼はわたしの内に何も持っていない</strong>」です。キリストの内には、世の支配者が足場とできるもの（罪）が何一つないのです。</p></blockquote><blockquote><p>「あなたたちのうち、<strong>いったいだれが、わたしに罪があると責めることができるのか</strong>。わたしは真理を語っているのに、なぜわたしを信じないのか」（<a href="https://bibleox.com/ja/jp-ni/in/8/#L46">ヨハ. 8:46</a>）</p></blockquote><blockquote><p>「<strong>彼は不法を働かず</strong>その口に偽りもなかったのに、その墓は神に逆らう者と共にされ、富める者と共に葬られた」（<a href="https://bibleox.com/ja/jp-ni/is/53/#L9">イザ. 53:9</a>）</p></blockquote>
