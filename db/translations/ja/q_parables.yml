  - src: притча-о-виноградарях
    path: Wv1n_悪い農夫たち
    title: 悪い農夫たちのたとえ
    meta_desc: 悪い農夫たちについてのイエス・キリストのたとえ
    menu: { parent: "たとえ話", title: "悪い農夫たち", priority: 1 }
    body: |-
      <p>悪い農夫たちについてのイエス・キリストのたとえ：</p><blockquote>「もう一つのたとえを聞きなさい。ある家の主人がぶどう園を作り、垣を巡らし、その中に搾り場を掘り、見張りのやぐらを立て、これを農夫たちに貸して旅に出た。さて、収穫の時が近づいたとき、収穫を受け取るために、僕たちを農夫たちのところへ送った。だが、農夫たちはこの僕たちを捕まえ、一人を袋だたきにし、一人を殺し、一人を石で打ち殺した。また、他の僕たちを前よりも多く送ったが、農夫たちは同じ目に遭わせた。そこで最後に、『わたしの息子なら敬ってくれるだろう』と言って、主人は自分の息子を送った。農夫たちは、その息子を見て話し合った。『これは跡取りだ。さあ、殺して、彼の相続財産を我々のものにしよう。』そして、息子を捕まえ、ぶどう園の外にほうり出して殺してしまった。さて、ぶどう園の主人が帰って来たら、この農夫たちをどうするだろうか。」彼らは言った。「その悪人どもをひどい目に遭わせて殺し、ぶどう園は、季節ごとに収穫を納めるほかの農夫たちに貸すにちがいない。」&lt;…&gt; 祭司長たちやファリサイ派の人々はこのたとえを聞いて、イエスが自分たちのことを言っておられると気づき」（<a href="https://bibleox.com/ja/jp-ni/mf/21/#L33-41,45">マタ. 21:33-41,45</a>）</blockquote>

  - src: притча-о-работниках-в-винограднике
    path: Lv2y_ぶどう園の労働者
    title: ぶどう園の労働者のたとえ
    meta_desc: ぶどう園の労働者についてのたとえ
    menu: { parent: "たとえ話", title: "ぶどう園の労働者", priority: 2 }
    body: |-
      <p>ぶどう園で働いたさまざまな労働者に同じ賃金が払われたことについてのイエス・キリストのたとえ：</p><blockquote>「天の国は次のようにたとえられる。ある家の主人が、ぶどう園で働く労働者を雇うために、夜明けに出かけて行った。主人は、一日につき一デナリオンの約束で、労働者をぶどう園に送った。また、九時ごろ行ってみると、何もしないで広場に立っている人々がいたので、『あなたたちもぶどう園に行きなさい。ふさわしい賃金を払ってやろう』と言った。それで、その人たちは出かけて行った。主人は、十二時ごろと三時ごろにまた出て行き、同じようにした。五時ごろにも行ってみると、ほかの人々が立っていたので、『なぜ、何もしないで一日中ここに立っているのか』と尋ねると、彼らは、『だれも雇ってくれないのです』と言った。主人は彼らに、『あなたたちもぶどう園に行きなさい』と言った。夕方になって、ぶどう園の主人は監督に、『労働者たちを呼んで、最後に来た者から始めて、最初に来た者まで順に賃金を払ってやりなさい』と言った。そこで、五時ごろに雇われた人たちが来て、一デナリオンずつ受け取った。最初に雇われた人たちが来て、もっと多くもらえるだろうと思っていた。しかし、彼らも一デナリオンずつであった。それで、受け取ると、主人に不平を言った。『最後に来たこの連中は、一時間しか働きませんでした。まる一日、暑い中を辛抱して働いたわたしたちと、この連中とを同じ扱いにするとは。』主人はその一人に答えた。『友よ、あなたに不当なことはしていない。あなたはわたしと一デナリオンの約束をしたではないか。自分の分を受け取って帰りなさい。わたしはこの最後の者にも、あなたと同じように支払ってやりたいのだ。自分のものを自分のしたいようにしては、いけないか。それとも、わたしの気前のよさをねたむのか。』このように、後にいる者が先になり、先にいる者が後になる」（<a href="https://bibleox.com/ja/jp-ni/mf/20/#L1-16">マタ. 20:1-16</a>）</blockquote><p><em>（ビザンティン本文（多数派写本）では、7節の終わりに「そうすれば、ふさわしいものを受け取るだろう」が、16節の終わりに「<strong>招かれる人は多いが、選ばれる人は少ない</strong>」（πολλοὶ γάρ εἰσιν κλητοί, ὀλίγοι δὲ ἐκλεκτοί）が加わります。また、新共同訳の「九時ごろ」「十二時ごろと三時ごろ」「五時ごろ」は、ギリシア語原文ではユダヤ式の時刻で「第三時」「第六時と第九時」「第十一時」です。）</em></p>

  - src: о-мытаре-и-фарисее
    path: Pt2c_ファリサイ派の人と徴税人
    title: ファリサイ派の人と徴税人
    title_sub: たとえ
    meta_desc: ファリサイ派の人と徴税人のたとえ
    menu: { parent: "たとえ話", title: "ファリサイ派の人と徴税人", priority: 2 }
    body: |-
      <blockquote><p>「二人の人が祈るために神殿に上った。<strong>一人はファリサイ派の人で、もう一人は徴税人だった</strong>。ファリサイ派の人は立って、心の中でこのように祈った。『神様、わたしはほかの人たちのように、奪い取る者、不正な者、姦通を犯す者でなく、また、この徴税人のような者でもないことを感謝します。わたしは週に二度断食し、全収入の十分の一を献げています。』ところが、徴税人は遠くに立って、目を天に上げようともせず、胸を打ちながら言った。『神様、罪人のわたしを憐れんでください。』言っておくが、義とされて家に帰ったのは、この人であって、あのファリサイ派の人ではない。だれでも高ぶる者は低くされ、へりくだる者は高められる」（<a href="https://bibleox.com/ja/jp-ni/lk/18/#L10-14">ルカ. 18:10-14</a>）</p></blockquote>

  - src: о_милосердном_самарянине
    path: Gs3m_善いサマリア人
    title: 善いサマリア人
    meta_desc: 善いサマリア人のたとえとその解説
    menu: { parent: "たとえ話", title: "善いサマリア人", priority: 3 }
    body: |-
      <h2>たとえ</h2><blockquote><p>「しかし、彼［律法の専門家］は自分を正当化しようとして、『では、わたしの隣人とはだれですか』と言った。イエスはお答えになった。『ある人がエルサレムからエリコへ下って行く途中、追いはぎに襲われた。追いはぎはその人の服をはぎ取り、殴りつけ、半殺しにしたまま立ち去った。ある祭司がたまたまその道を下って来たが、その人を見ると、道の向こう側を通って行った。同じように、レビ人もその場所にやって来たが、その人を見ると、道の向こう側を通って行った。ところが、旅をしていたあるサマリア人は、そばに来ると、その人を見て憐れに思い、近寄って<strong><mark>傷</mark>に油とぶどう酒を注ぎ、包帯をして</strong>、<strong>自分の<mark>ろば</mark>に乗せ</strong>、<strong><mark>宿屋</mark>に連れて行って介抱した</strong>。そして、翌日になると、デナリオン銀貨二枚を取り出し、宿屋の主人に渡して言った。「この人を介抱してください。費用がもっとかかったら、帰りがけに払います。」さて、あなたはこの三人の中で、だれが追いはぎに襲われた人の隣人になったと思うか。』律法の専門家は言った。『その人を助けた人です。』そこで、イエスは言われた。『行って、あなたも同じようにしなさい』」（<a href="https://bibleox.com/ja/jp-ni/lk/10/#L29-37">ルカ. 10:29-37</a>）</p></blockquote><h2>たとえの解説</h2><h3>司祭ゲオルギイ・マクシモフ</h3><blockquote><p>善いサマリア人のたとえ — それは何について語っているのでしょうか。</p><p>今日、福音書の朗読で、わたしたちは善いサマリア人のたとえを聞きました。初めに、このたとえが語られた状況が述べられています。ある律法の専門家がキリストを試そうとしてやって来て、「何をしたら救われるでしょうか」と尋ねました。聖師父たちが説明しているように、彼は、モーセの律法に反するものとして示すことのできる言葉をキリストから引き出そうと望んでいたのです。しかしイエスは、彼の心を見抜いて、「律法には何と書いてあるか」と尋ねられます。すると彼は答えます。神と隣人を愛せよ、と。主は彼に言われます。正しい答えだ。それを実行しなさい、と。これによって主は、その人の狡猾なたくらみをたちまち打ち砕き、その質問のばかばかしさを示されました。自分の質問の答えをすでに知っているのなら、なぜ尋ねるのか、と。</p><p>しかし、福音記者が言うように「自分を正当化しようとして」、つまり、自分が狡猾さからではなく、分からないから質問しているのだと見せるために、律法の専門家は尋ねます。「では、わたしの隣人とはだれですか」。そして主は、善いサマリア人のたとえで彼に答え、その終わりに尋ねられます。このたとえに出てきた人たちのうち、だれが追いはぎの被害に遭った人の隣人だったと思うか、と。そして質問した人は、サマリア人が隣人であったと認めざるをえません。</p><p>主の最初の答えから、聖フェオファン隠修者が言ったように、救いに必要なことはすべて聖書から学ぶことができる、ということが分かります。しかし、この人はさらに、旧約の聖書には一義的な答えがなかった質問をします。するとキリストは、彼の良心そのものが、どう振る舞うのが正しいかを証ししていることを示されます。わたしたちは皆、この良心の声によって、どう振る舞うのが正しいか、また逆に、どのような行いが間違っていて神に喜ばれないかを、すでに知っています。ここには、復活の後、キリストの恐るべき審判で、わたしたちがどのように裁かれるかの象徴があります。多くの聖人たちが言ったように、そのとき人の良心がその人に不利な証言をします。つまり、人は自分自身の告発者、自分自身の検察官となるのです。ですから、その審判では、「わたしはしていない、知らなかった」というような言い争いや反論はありません。この律法学者の良心が証ししたように、一人ひとりの良心が証しするからです。わたしたちは、それが神に喜ばれないことを知っていましたし、良心に従ってどう振る舞うのが正しかったかも知っていました。そして、もし間違った振る舞いをしたのなら、良心はわたしたちが自分を正当化することを許さないでしょう。</p><p>主が語られたたとえは、その文字どおりの意味では、ユダヤ人たちが考えていたように、同族の者や考えを同じくする者だけを隣人と見なしてはならない、と語っています。キリストは律法学者に、当時のユダヤ人が皆よそ者と見なしていた人でさえ隣人でありうることを、彼自身の良心が証ししていると示されたのです。だからこそ主は、ユダヤ人が軽蔑していたサマリア人を例に挙げられました。同時に主はこのたとえで、まさに愛と憐れみと善の行いこそが、わたしたちをも、善を行う相手のどんな人にとっても隣人にすることができる、と示しておられます。</p><p>このたとえの霊的な理解については、福者フェオフィラクトの解説によれば、追いはぎに襲われた人とは全人類のことです。追いはぎとは悪魔と悪霊どもです。傷ついた人のそばを通り過ぎた祭司とレビ人は旧い律法を意味しています。律法は何が善で何が悪かを説明することはできましたが、人を救いはしませんでした。そして最後に、サマリア人の姿で、ここには主イエス・キリスト御自身が現れておられます。</p><p>サマリア人が傷ついた人を連れて行く宿屋は教会を意味し、宿屋の主人は教会の牧者たちです。サマリア人が傷ついた人の手当てのために渡す二デナリオンは、旧約と新約です。古代の貨幣に王の像が刻まれていたように、旧約と新約にも等しく、天の王であるわたしたちの主の像が刻まれているのです。彼が傷ついた人の傷に油とぶどう酒を注いで手当てしたことは、教会の機密を意味しています。油は傅膏機密、ぶどう酒は聖体機密です。それを行ったのが宿屋の主人ではなくサマリア人であったことは、機密を行う方は牧者たちではなく、キリスト御自身であることを示しています。最後に、「この人の治療にこの二デナリオン以上の費用がかかったら、後で払います」というサマリア人の言葉は、教会の多くの牧者たちが自分の群れのために引き受けた労苦と出費を指しています。聖人伝からご存じのように、多くの人がそのために財産だけでなく、健康も、命そのものもささげました。主は再臨の時に戻って来られるとき、そのすべてに百倍にして報いてくださるでしょう。</p><p>この福音の言葉によって教えられて、わたしたちもキリストの教会にしっかりとどまり、聖書から学び、憐れみの業を行うよう努めましょう。善を行うことは、わたしたちの魂に光をもたらし、わたしたちをキリストに似た者とします。主が全人類とわたしたちに憐れみを示されたように、助けを必要としている人や災難に陥った人に憐れみを示すとき、わたしたちも少しは主に似た者となるのです。そして、この道を歩むなら、主がわたしたち皆を見たいと望んでおられる所、すなわち天の国にたどり着くでしょう。</p></blockquote><p>（ロシア語からの訳。<a href="https://vk.com/wall293099986_47857">出典、ロシア語</a>）</p>

  - src: притча-о-двух-сынах
    path: Ts3s_二人の息子
    title: 二人の息子のたとえ
    meta_desc: 二人の息子についてのイエス・キリストのたとえ
    menu: { parent: "たとえ話", title: "二人の息子", priority: 3 }
    body: |-
      <p>二人の息子についてのイエス・キリストのたとえ：</p><blockquote>「ある人に息子が二人いたが、彼は兄のところへ行き、『子よ、今日、ぶどう園へ行って働きなさい』と言った。兄は『いやです』と答えたが、後で考え直して出かけた。弟のところへも行って、同じことを言うと、弟は『お父さん、承知しました』と答えたが、出かけなかった。この二人のうち、どちらが父親の望みどおりにしたか。」彼らが「兄の方です」と言うと、イエスは言われた。「はっきり言っておく。徴税人や娼婦たちの方が、あなたたちより先に神の国に入るだろう」（<a href="https://bibleox.com/ja/jp-ni/mf/21/#L28-31">マタ. 21:28-31</a>）</blockquote>

  - src: Притча_о_блудном_сына
    path: Ps3n_放蕩息子
    title: 放蕩息子のたとえ
    meta_desc: 放蕩息子についての聖書のたとえ
    menu: { parent: "たとえ話", title: "放蕩息子", priority: 3 }
    body: |-
      <blockquote><p>「また、イエスは言われた。『ある人に息子が二人いた。弟の方が父親に、「お父さん、わたしが頂くことになっている財産の分け前をください」と言った。それで、父親は財産を二人に分けてやった。何日もたたないうちに、下の息子は全部を金に換えて、遠い国に旅立ち、そこで放蕩の限りを尽くして、財産を無駄遣いしてしまった。何もかも使い果たしたとき、その地方にひどい飢饉が起こって、彼は食べるにも困り始めた。それで、その地方に住むある人のところに身を寄せたところ、その人は彼を畑にやって豚の世話をさせた。彼は豚の食べるいなご豆を食べてでも腹を満たしたかったが、食べ物をくれる人はだれもいなかった。そこで、彼は我に返って言った。「父のところでは、あんなに大勢の雇い人に、有り余るほどパンがあるのに、わたしはここで飢え死にしそうだ。ここをたち、父のところに行って言おう。『お父さん、わたしは天に対しても、またお父さんに対しても罪を犯しました。もう息子と呼ばれる資格はありません。雇い人の一人にしてください』と。」そして、彼はそこをたち、父親のもとに行った。ところが、まだ遠く離れていたのに、父親は息子を見つけて、憐れに思い、走り寄って首を抱き、接吻した。息子は言った。「お父さん、わたしは天に対しても、またお父さんに対しても罪を犯しました。もう息子と呼ばれる資格はありません。」しかし、父親は僕たちに言った。「急いでいちばん良い服を持って来て、この子に着せ、手に指輪をはめてやり、足に履物を履かせなさい。それから、肥えた子牛を連れて来て屠りなさい。食べて祝おう。この息子は、死んでいたのに生き返り、いなくなっていたのに見つかったからだ。」そして、祝宴を始めた。ところで、兄の方は畑にいたが、家の近くに来ると、音楽や踊りのざわめきが聞こえてきた。そこで、僕の一人を呼んで、これはいったい何事かと尋ねた。僕は言った。「弟さんが帰って来られました。無事な姿で迎えたというので、お父上が肥えた子牛を屠られたのです。」兄は怒って家に入ろうとはせず、父親が出て来てなだめた。しかし、兄は父親に言った。「このとおり、わたしは何年もお父さんに仕えています。言いつけに背いたことは一度もありません。それなのに、わたしが友達と宴会をするために、子山羊一匹すらくれなかったではありませんか。ところが、あなたのあの息子が、娼婦どもと一緒にあなたの身上を食いつぶして帰って来ると、肥えた子牛を屠っておやりになる。」すると、父親は言った。「子よ、お前はいつもわたしと一緒にいる。わたしのものは全部お前のものだ。だが、お前のあの弟は死んでいたのに生き返った。いなくなっていたのに見つかったのだ。祝宴を開いて楽しみ喜ぶのは当たり前ではないか」』」（<a href="https://bibleox.com/ja/jp-ni/lk/15/#L11-32">ルカ. 15:11-32</a>）</p></blockquote>

  - src: притча-о-званных-на-пир
    path: Wf4t_婚宴に招かれた人々
    title: 婚宴に招かれた人々のたとえ
    meta_desc: 婚宴に招かれた人々についてのイエス・キリストのたとえ
    menu: { parent: "たとえ話", title: "婚宴に招かれた人々", priority: 4 }
    body: |-
      <p>婚宴に招かれた人々についてのイエス・キリストのたとえ：</p><blockquote>「天の国は、ある王が王子のために婚宴を催したのに似ている。王は家来たちを送り、婚宴に招いておいた人々を呼ばせたが、来ようとしなかった。そこでまた、次のように言って、別の家来たちを使いに出した。『招いておいた人々にこう言いなさい。「食事の用意が整いました。牛や肥えた家畜を屠って、すっかり用意ができています。さあ、婚宴においでください。」』しかし、人々はそれを無視し、一人は畑に、一人は商売に出かけ、また、他の人々は王の家来たちを捕まえて乱暴し、殺してしまった。そこで、王は怒り、軍隊を送って、この人殺しどもを滅ぼし、その町を焼き払った。そして、家来たちに言った。『婚宴の用意はできているが、招いておいた人々は、ふさわしくなかった。だから、町の大通りに出て、見かけた者はだれでも婚宴に連れて来なさい。』そこで、家来たちは通りに出て行き、見かけた人は善人も悪人も皆集めて来たので、婚宴は客でいっぱいになった。王が客を見ようと入って来ると、婚礼の礼服を着ていない者が一人いた。王は、『友よ、どうして礼服を着ないでここに入って来たのか』と言った。この者が黙っていると、王は側近の者たちに言った。『この男の手足を縛って、外の暗闇にほうり出せ。そこで泣きわめいて歯ぎしりするだろう。』招かれる人は多いが、選ばれる人は少ない」（<a href="https://bibleox.com/ja/jp-ni/mf/22/#L2-14">マタ. 22:2-14</a>）</blockquote>

  - src: притча_о_выборе_места_на_свадьбе
    path: Cp5w_婚宴での席の選び方
    title: 婚宴での席の選び方
    meta_desc: 婚宴での席の選び方についてのたとえ
    menu: { parent: "たとえ話", title: "婚宴での席の選び方", priority: 5 }
    body: |-
      <blockquote><p>「婚宴に招待されたら、<strong>上席に着いてはならない</strong>。あなたよりも身分の高い人が招かれており、あなたやその人を招いた人が来て、『この方に席を譲ってください』と言うかもしれない。そのとき、<strong>あなたは恥をかいて末席に着くことになる</strong>。招待を受けたら、むしろ<strong>末席に行って座りなさい</strong>。そうすると、あなたを招いた人が来て、『<strong>さあ、もっと上席に進んでください</strong>』と言うだろう。<strong>そのときは、同席の人みんなの前で面目を施すことになる</strong>。<strong><mark>だれでも高ぶる者は低くされ、へりくだる者は高められる</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/lk/14/#L8-11">ルカ. 14:8-11</a>）</p></blockquote>

  - src: притча_о_богаче_и_Лазаре
    path: Rl10z_金持ちとラザロ
    title: 金持ちとラザロ
    title_sub: たとえ
    meta_desc: 金持ちとラザロのたとえ
    menu: { parent: "たとえ話", title: "金持ちとラザロ", priority: 10 }
    body: |-
      <blockquote><p>「ある金持ちがいた。いつも紫の衣や柔らかい麻布を着て、毎日ぜいたくに遊び暮らしていた。この金持ちの門前に、ラザロというできものだらけの貧しい人が横たわり、その食卓から落ちる物で腹を満たしたいものだと思っていた。犬もやって来ては、そのできものをなめた。やがて、この貧しい人は死んで、天使たちによって宴席にいるアブラハムのすぐそばに連れて行かれた。金持ちも死んで葬られた。そして、金持ちは陰府でさいなまれながら目を上げると、宴席でアブラハムとそのすぐそばにいるラザロとが、はるかかなたに見えた。そこで、大声で言った。『父アブラハムよ、わたしを憐れんでください。ラザロをよこして、指先を水に浸し、わたしの舌を冷やさせてください。わたしはこの炎の中でもだえ苦しんでいます。』しかし、アブラハムは言った。『子よ、思い出してみるがよい。お前は生きている間に良いものをもらっていたが、ラザロは反対に悪いものをもらっていた。今は、ここで彼は慰められ、お前はもだえ苦しむのだ。そればかりか、わたしたちとお前たちの間には大きな淵があって、ここからお前たちの方へ渡ろうとしてもできないし、そこからわたしたちの方に越えて来ることもできない。』金持ちは言った。『父よ、ではお願いです。わたしの父親の家にラザロを遣わしてください。わたしには兄弟が五人います。あの者たちまで、こんな苦しい場所に来ることのないように、よく言い聞かせてください。』しかし、アブラハムは言った。『お前の兄弟たちにはモーセと預言者がいる。彼らに耳を傾けるがよい。』金持ちは言った。『いいえ、父アブラハムよ、もし、死んだ者の中からだれかが兄弟のところに行ってやれば、悔い改めるでしょう。』アブラハムは言った。『もし、モーセと預言者に耳を傾けないのなら、たとえ死者の中から生き返る者があっても、その言うことを聞き入れはしないだろう』」（<a href="https://bibleox.com/ja/jp-ni/lk/16/#L19-31">ルカ. 16:19-31</a>）<em>（「宴席にいるアブラハムのすぐそば」は、ギリシア語原文では εἰς τὸν κόλπον Ἀβραάμ —「<strong>アブラハムのふところ</strong>へ」です。23節も同様に ἐν τοῖς κόλποις αὐτοῦ —「そのふところに」で、「宴席」という語はありません。）</em></p></blockquote>

  - src: притча-о-двух-рабах-_благоразумном-и-злом
    path: Tw10s_二人の僕
    title: 二人の僕のたとえ
    meta_desc: 忠実で賢い僕と悪い僕のたとえ
    menu: { parent: "たとえ話", title: "二人の僕", priority: 10 }
    body: |-
      <p>「主人がその家の使用人たちの上に立てて、時間どおり彼らに食事を与えさせることにした忠実で賢い僕は、いったいだれであろうか。主人が帰って来たとき、言われたとおりにしているのを見られる僕は幸いである。はっきり言っておくが、主人は彼に全財産を管理させるにちがいない。しかし、それが悪い僕で、主人は遅いと思い、仲間を殴り始め、酒飲みどもと一緒に食べたり飲んだりしているとする。もしそうなら、その僕の主人は予想しない日、思いがけない時に帰って来て、彼を厳しく罰し、偽善者たちと同じ目に遭わせる。そこで泣きわめいて歯ぎしりするだろう」（<a href="https://bibleox.com/ja/jp-ni/mf/24/#L45-51">マタ. 24:45-51</a>）<em>（「厳しく罰し」は、ギリシア語原文では διχοτομήσει αὐτόν —「彼を<strong>二つに切り裂き</strong>」です。）</em></p>

  - src: притча-о-десяти-девах-мудрых-и-неразумных
    path: Tv10n_十人のおとめ
    title: 十人のおとめのたとえ
    title_sub: 十人のおとめについての福音書のたとえ
    meta_desc: 賢いおとめと愚かなおとめについての福音書のたとえ
    menu: { parent: "たとえ話", title: "十人のおとめ", priority: 10 }
    body: |-
      <blockquote><p>「そこで、天の国は次のようにたとえられる。十人のおとめがそれぞれともし火を持って、花婿を迎えに出て行く。そのうちの五人は愚かで、五人は賢かった。愚かなおとめたちは、ともし火は持っていたが、油の用意をしていなかった。賢いおとめたちは、それぞれのともし火と一緒に、壺に油を入れて持っていた。ところが、花婿の来るのが遅れたので、皆眠気がさして眠り込んでしまった。真夜中に『花婿だ。迎えに出なさい』と叫ぶ声がした。そこで、おとめたちは皆起きて、それぞれのともし火を整えた。愚かなおとめたちは、賢いおとめたちに言った。『油を分けてください。わたしたちのともし火は消えそうです。』賢いおとめたちは答えた。『分けてあげるほどはありません。それより、店に行って、自分の分を買って来なさい。』愚かなおとめたちが買いに行っている間に、花婿が到着して、用意のできている五人は、花婿と一緒に婚宴の席に入り、戸が閉められた。その後で、ほかのおとめたちも来て、『御主人様、御主人様、開けてください』と言った。しかし主人は、『はっきり言っておく。わたしはお前たちを知らない』と答えた」（<a href="https://bibleox.com/ja/jp-ni/mf/25/#L1-12">マタ. 25:1-12</a>）<em>（ビザンティン本文（多数派写本）では、2節は「そのうちの五人は<strong>賢く</strong>、五人は<strong>愚か</strong>であった」の順です。）</em></p></blockquote>

  - src: притча-о-трёх-рабах-и-талантах-5-2-1
    path: Tl15t_タラントン
    title: タラントンのたとえ（5、2、1）
    meta_desc: 五タラントン、二タラントン、一タラントンを預かった三人の僕のたとえ
    menu: { parent: "たとえ話", title: "タラントン（5、2、1）", priority: 15 }
    body: |-
      <blockquote>「天の国はまた次のようにたとえられる。ある人が旅行に出かけるとき、僕たちを呼んで、自分の財産を預けた。それぞれの力に応じて、一人には五タラントン、一人には二タラントン、もう一人には一タラントンを預けて旅に出かけた。早速、五タラントン預かった者は出て行き、それで商売をして、ほかに五タラントンをもうけた。同じように、二タラントン預かった者も、ほかに二タラントンをもうけた。しかし、一タラントン預かった者は、出て行って穴を掘り、主人の金を隠しておいた。さて、かなり日がたってから、僕たちの主人が帰って来て、彼らと清算を始めた。まず、五タラントン預かった者が進み出て、ほかの五タラントンを差し出して言った。『御主人様、五タラントンお預けになりましたが、御覧ください。ほかに五タラントンもうけました。』主人は言った。『忠実な良い僕だ。よくやった。お前は少しのものに忠実であったから、多くのものを管理させよう。主人と一緒に喜んでくれ。』次に、二タラントン預かった者も進み出て言った。『御主人様、二タラントンお預けになりましたが、御覧ください。ほかに二タラントンもうけました。』主人は言った。『忠実な良い僕だ。よくやった。お前は少しのものに忠実であったから、多くのものを管理させよう。主人と一緒に喜んでくれ。』ところで、一タラントン預かった者も進み出て言った。『御主人様、あなたは蒔かない所から刈り取り、散らさない所からかき集められる厳しい方だと知っていましたので、恐ろしくなり、出かけて行って、あなたのタラントンを地の中に隠しておきました。御覧ください。これがあなたのお金です。』主人は答えた。『怠け者の悪い僕だ。わたしが蒔かない所から刈り取り、散らさない所からかき集めることを知っていたのか。それなら、わたしの金を銀行に入れておくべきであった。そうしておけば、帰って来たとき、利息付きで返してもらえたのに。さあ、そのタラントンをこの男から取り上げて、十タラントン持っている者に与えよ。だれでも持っている人は更に与えられて豊かになるが、持っていない人は持っているものまでも取り上げられる。この役に立たない僕を外の暗闇に追い出せ。そこで泣きわめいて歯ぎしりするだろう』」（<a href="https://bibleox.com/ja/jp-ni/mf/25/#L14-30">マタ. 25:14-30</a>）</blockquote>

  - src: притча-об-овцах-и-козлах-по-разную-сторону-от-Господа
    path: Sg20s_羊と山羊
    title: 羊と山羊
    meta_desc: 主の右と左に分けられる羊と山羊のたとえ
    menu: { parent: "たとえ話", title: "羊と山羊", priority: 20 }
    body: |-
      <blockquote>「人の子は、栄光に輝いて天使たちを皆従えて来るとき、その栄光の座に着く。そして、すべての国の民がその前に集められると、羊飼いが羊と山羊を分けるように、彼らをより分け、羊を右に、山羊を左に置く。そこで、王は右側にいる人たちに言う。『さあ、わたしの父に祝福された人たち、天地創造の時からお前たちのために用意されている国を受け継ぎなさい。お前たちは、わたしが飢えていたときに食べさせ、のどが渇いていたときに飲ませ、旅をしていたときに宿を貸し、裸のときに着せ、病気のときに見舞い、牢にいたときに訪ねてくれたからだ。』すると、正しい人たちが王に答える。『主よ、いつわたしたちは、飢えておられるのを見て食べ物を差し上げ、のどが渇いておられるのを見て飲み物を差し上げたでしょうか。いつ、旅をしておられるのを見てお宿を貸し、裸でおられるのを見てお着せしたでしょうか。いつ、病気をなさったり、牢におられたりするのを見て、お訪ねしたでしょうか。』そこで、王は答える。『はっきり言っておく。わたしの兄弟であるこの最も小さい者の一人にしたのは、わたしにしてくれたことなのである。』それから、王は左側にいる人たちにも言う。『呪われた者ども、わたしから離れ去り、悪魔とその手下のために用意してある永遠の火に入れ。お前たちは、わたしが飢えていたときに食べさせず、のどが渇いたときに飲ませず、旅をしていたときに宿を貸さず、裸のときに着せず、病気のとき、牢にいたときに、訪ねてくれなかったからだ。』すると、彼らも答える。『主よ、いつわたしたちは、あなたが飢えたり、渇いたり、旅をしたり、裸であったり、病気であったり、牢におられたりするのを見て、お世話をしなかったでしょうか。』そこで、王は答える。『はっきり言っておく。この最も小さい者の一人にしなかったのは、わたしにしてくれなかったことなのである。』こうして、この者どもは永遠の罰を受け、正しい人たちは永遠の命にあずかるのである」（<a href="https://bibleox.com/ja/jp-ni/mf/25/#L31-46">マタ. 25:31-46</a>）<em>（ビザンティン本文（多数派写本）では、31節は「<strong>聖なる</strong>天使たちを皆従えて」（πάντες οἱ ἅγιοι ἄγγελοι）です。）</em></blockquote>
