    path: Vu3d_教会目に見える一致
    title: 教会 — 目に見える一致
    meta_desc: 「ほかの者はだれ一人、あえて仲間に加わろうとはしなかった。しかし、民衆は彼らを称賛していた」（使徒言行録 5:13）
    menu: { parent: "教会", title: "教会の境界", priority: 3 }
    body: |-
      <h2>序</h2><p>まず大切なのは、聖書には、自分で教会を作って自分をその牧者と称することの実例も根拠も、ただの一つもないということです。キリストは目に見える一つの教会を造られ、その一致を望むと言われました。</p><h2>教会の目に見える一致を望むキリストと使徒たちの意志</h2><blockquote><p>「また、彼らのためだけでなく、彼らの言葉によってわたしを信じる人々のためにも、<strong><mark>お願いします</mark></strong>。父よ、あなたがわたしの内におられ、わたしがあなたの内にいるように、<strong><mark>すべての人を一つにしてください</mark></strong>。<strong>彼らもわたしたちの内にいるようにしてください。そうすれば、<mark>世は、あなたがわたしをお遣わしになったことを、信じるようになります</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/in/17/#L20-21">ヨハ. 17:20-21</a>）</p></blockquote><blockquote><p>「さて、兄弟たち、わたしたちの主イエス・キリストの名によってあなたがたに<strong><mark>勧告します</mark></strong>。<strong><mark>皆、勝手なことを言わず</mark></strong>、<strong><mark>仲たがいせず</mark></strong>、<strong><mark>心を一つにし思いを一つにして</mark>、固く結び合いなさい</strong>。わたしの兄弟たち、実はあなたがたの間に争いがあると、クロエの家の人たちから知らされました。<strong>あなたがたはめいめい、『わたしはパウロにつく』『わたしはアポロに』『わたしはケファに』『わたしはキリストに』などと言い合っているとのことです。キリストは幾つにも分けられてしまったのですか</strong>。パウロがあなたがたのために十字架につけられたのですか。あなたがたはパウロの名によって洗礼を受けたのですか」（<a href="https://bibleox.com/ja/jp-ni/1kor/1/#L10-13">１コリ. 1:10-13</a>）<em>（「皆、勝手なことを言わず」は、ギリシア語原文では τὸ αὐτὸ λέγητε πάντες —「皆が同じことを語り」、「仲たがいせず」は μὴ ᾖ ἐν ὑμῖν σχίσματα —「あなたがたの間に分裂（シスマ）がないように」です。）</em>「ある人が『わたしはパウロにつく』と言い、他の人が『わたしはアポロに』などと言っているとすれば、<strong>あなたがたは、ただの人にすぎないではありませんか</strong>」（<a href="https://bibleox.com/ja/jp-ni/1kor/3/#L4">１コリ. 3:4</a>）</p></blockquote><p>神は、体（教会）の部分を、分裂がなく、皆が互いに配慮し合い、共に苦しみ、共に喜ぶように組み立てられました。</p><blockquote><p>「つまり、<strong>一つの霊によって、わたしたちは</strong>、ユダヤ人であろうとギリシア人であろうと、奴隷であろうと自由な身分の者であろうと、<strong>皆一つの体となるために洗礼を受け</strong>、皆一つの霊をのませてもらったのです。<strong>体は、一つの部分ではなく、多くの部分から成っています</strong>。&lt;…&gt; <strong><mark>目が手に向かって『お前は要らない』とは言えず、また、頭が足に向かって『お前たちは要らない』とも言えません</mark></strong>。それどころか、体の中でほかよりも弱く見える部分が、かえって必要なのです。わたしたちは、体の中でほかよりも恰好が悪いと思われる部分を覆って、もっと恰好よくしようとし、見苦しい部分をもっと見栄えよくしようとします。見栄えのよい部分には、そうする必要はありません。<strong><mark>神は</mark></strong>、見劣りのする部分をいっそう引き立たせて、<strong><mark>体を組み立てられました</mark></strong>。それで、<strong><mark>体に分裂が起こらず</mark></strong>、各部分が互いに配慮し合っています。<strong>一つの部分が苦しめば、すべての部分が共に苦しみ、一つの部分が尊ばれれば、すべての部分が共に喜ぶのです</strong>」（<a href="https://bibleox.com/ja/jp-ni/1kor/12/#L13-14,21-26">１コリ. 12:13-14,21-26</a>）</p></blockquote><p>体のこのさまざまな部分とは何でしょうか。教会におけるさまざまな奉仕と賜物です。</p><blockquote><p>「<strong>体は一つでも、多くの部分から成り、体のすべての部分の数は多くても、体は一つである</strong>ように、キリストの場合も同様である。&lt;…&gt; <strong>体は、一つの部分ではなく、多くの部分から成っています</strong>。&lt;…&gt; <strong>あなたがたはキリストの体であり、また、一人一人はその部分です</strong>。<strong>神は、教会の中にいろいろな人をお立てになりました</strong>。第一に<strong>使徒</strong>、第二に<strong>預言者</strong>、第三に<strong>教師</strong>、次に<strong>奇跡を行う者</strong>、その次に病気をいやす<strong>賜物</strong>を持つ者、援助する者、管理する者、異言を語る者などです。<strong>皆が使徒であろうか。皆が預言者であろうか。皆が教師であろうか。皆が奇跡を行う者であろうか。皆が病気をいやす賜物を持っているだろうか。皆が異言を語るだろうか。皆がそれを解釈するだろうか</strong>」（<a href="https://bibleox.com/ja/jp-ni/1kor/12/#L12,14,27-30">１コリ. 12:12,14,27-30</a>）</p></blockquote><p>このように神は、体に分裂が起こらないように、これらすべての奉仕と賜物を組み立てられました。使徒は手紙の初めで、その分裂を防いでいます（<a href="https://bibleox.com/ja/jp-ni/1kor/1/#L10-13">１コリ. 1:10-13</a>）。つまり、神は一致を望まれる（<a href="https://bibleox.com/ja/jp-ni/in/17/#L20-21">ヨハ. 17:20-21</a>）だけでなく、一致に心を配っておられるのです。ここでは、神によって奉仕に立てられた使徒が目に見える一致に心を配り、コリントの人々に目に見える分裂を作ることを禁じています。</p><p>一致はキリストの意志なのですから、救われるのは神の御心を行う者であるということを理解するのが大切です（<a href="https://bibleox.com/ja/jp-ni/mf/7/#L21">マタ. 7:21</a>）。</p><h2>反キリストたちはキリストの意志に背き、公然と教会の境界の外へ出て行く</h2><p>反キリストたちは使徒たちの共同体から出て行きます。</p><blockquote><p>「子供たちよ、終わりの時が来ています。反キリストが来ると、あなたがたがかねて聞いていたとおり、<strong>今や<mark>多くの反キリストが現れています</mark></strong>。これによって、終わりの時が来ていると分かります。<strong><mark>彼らはわたしたちから去って行きましたが、もともと仲間ではなかったのです。仲間なら、わたしたちのもとにとどまっていたでしょう</mark></strong>。しかし去って行き、だれもわたしたちの仲間ではないことが明らかになりました」（<a href="https://bibleox.com/ja/jp-ni/1in/2/#L18-19">１ヨハ. 2:18-19</a>）</p></blockquote><p>彼らはキリストに仕えて<u>いません</u>。</p><blockquote><p>「兄弟たち、あなたがたに勧めます。あなたがたの学んだ教えに反して、<strong><mark>不和</mark>やつまずき<mark>をもたらす人々を警戒しなさい</mark></strong>。彼らから遠ざかりなさい。<strong><mark>こういう人々は、わたしたちの主であるキリストに仕えないで</mark></strong>、自分の腹に仕えている。そして、うまい言葉やへつらいの言葉によって純朴な人々の心を欺いているのです」（<a href="https://bibleox.com/ja/jp-ni/rim/16/#L17-18">ロマ. 16:17-18</a>）</p></blockquote><h2>教会の初めからの目に見える一致</h2><h3>外の者は離れている</h3><p>教会には、まさに初めから、まったくはっきりとした目に見える境界がありました。</p><blockquote><p>「<strong>ほかの者は</strong>だれ一人、あえて仲間に加わろうとはしなかった。しかし、民衆は彼らを称賛していた」（<a href="https://bibleox.com/ja/jp-ni/act/5/#L13">使. 5:13</a>）</p></blockquote><h3>共有の財産</h3><p>教会は一枚岩の共同体でした。</p><blockquote><p>「信じた人々の群れは<strong>心も思いも一つにし</strong>、一人として持ち物を自分のものだと言う者はなく、<strong>すべてを共有していた</strong>」（<a href="https://bibleox.com/ja/jp-ni/act/4/#L32">使. 4:32</a>）</p></blockquote><h3>争点を共に解決する</h3><p>教会には共通の問題があり、それをまったくはっきりとした目に見える会議（公会）に集まって、共に解決します。</p><blockquote><p>「そこで、<strong>使徒たちと長老たちは、この問題について協議するために集まった</strong>。&lt;…&gt; そこで、<strong>使徒たちと長老たちは、教会全体と共に</strong>、自分たちの中から人を選んで、パウロやバルナバと一緒にアンティオキアに派遣することを決定した。選ばれたのは、バルサバと呼ばれるユダおよびシラスで、兄弟たちの中で指導的な立場にいた人たちである」（<a href="https://bibleox.com/ja/jp-ni/act/15/#L6,22">使. 15:6,22</a>）</p></blockquote><h3>共通の規則</h3><p>教会には、すべての人に共通の、はっきりとした規則があります。</p><blockquote><p>「彼らは<strong>方々の町を巡回して</strong>、<strong>エルサレムの使徒と長老たちが決めた規定を守るようにと、人々に伝えた</strong>。こうして、教会は信仰を強められ、日ごとに人数が増えていった」（<a href="https://bibleox.com/ja/jp-ni/act/16/#L4-5">使. 16:4-5</a>）</p></blockquote><h3>党派に分かれることの禁止</h3><p>教会では、分かれようとするどんな試みもやめさせられます。</p><blockquote><p>「さて、兄弟たち、わたしたちの主イエス・キリストの名によってあなたがたに<strong><mark>勧告します</mark></strong>。<strong><mark>皆、勝手なことを言わず</mark></strong>、<strong><mark>仲たがいせず</mark></strong>、<strong><mark>心を一つにし思いを一つにして</mark>、固く結び合いなさい</strong>。わたしの兄弟たち、実はあなたがたの間に争いがあると、クロエの家の人たちから知らされました。<strong>あなたがたはめいめい、『わたしはパウロにつく』『わたしはアポロに』『わたしはケファに』『わたしはキリストに』などと言い合っているとのことです。キリストは幾つにも分けられてしまったのですか</strong>。パウロがあなたがたのために十字架につけられたのですか。あなたがたはパウロの名によって洗礼を受けたのですか」（<a href="https://bibleox.com/ja/jp-ni/1kor/1/#L10-13">１コリ. 1:10-13</a>）「ある人が『わたしはパウロにつく』と言い、他の人が『わたしはアポロに』などと言っているとすれば、<strong>あなたがたは、ただの人にすぎないではありませんか</strong>」（<a href="https://bibleox.com/ja/jp-ni/1kor/3/#L4">１コリ. 3:4</a>）</p></blockquote><h3>一つの信仰と機密</h3><p>教会には、すべての人に共通の、はっきりとした信仰がただ一つあります。</p><blockquote><p>「主は一人、<strong>信仰は一つ</strong>、洗礼は一つ」（<a href="https://bibleox.com/ja/jp-ni/ef/4/#L5">エフェ. 4:5</a>）</p></blockquote><blockquote><p>「だれであろうと、<strong>キリストの教えを越えて、これにとどまらない者は、神に結ばれていません</strong>。その教えにとどまっている人にこそ、御父も御子もおられます」（<a href="https://bibleox.com/ja/jp-ni/2in/1/#L9">２ヨハ. 1:9</a>）</p></blockquote><p>救い主が言われるとおり、信仰は使徒たちの言葉によるものです。</p><blockquote><p>「また、彼らのためだけでなく、<strong>彼らの言葉によってわたしを信じる</strong>人々のためにも、お願いします」（<a href="https://bibleox.com/ja/jp-ni/in/17/#L20">ヨハ. 17:20</a>）</p></blockquote><p>教会は、将来、一つの信仰から離れようとする人々が現れることを知っていました。この人々は教会とは呼ばれません。</p><blockquote><p>「彼ら［使徒たち］はあなたがたにこう言いました。『終わりの時には、あざける者どもが現れ、不信心な欲望のままにふるまう。』この者たちは、<strong>分裂を引き起こし</strong><em>（ギリシア語 ἀποδιορίζοντες —「分け隔てる者」、すなわち信仰の一致から自分を切り離す者）</em>、この世の命のままに生き、霊を持たない者です」（<a href="https://bibleox.com/ja/jp-ni/iud/1/#L18-19">ユダ. 1:18-19</a>）</p></blockquote><h3>一つの聖職位階</h3><blockquote><p>「パウロはミレトスからエフェソに人をやって、教会の長老たちを呼び寄せた。長老たちが集まって来たとき、パウロはこう話した。&lt;…&gt;『どうか、あなたがた自身と群れ全体とに気を配ってください。<strong>聖霊は</strong>、神が御子の血によって御自分のものとなさった<strong>神の教会の世話をさせるために、あなたがたをこの群れの監督者に任命なさったのです</strong>』」（<a href="https://bibleox.com/ja/jp-ni/act/20/#L17-18,28">使. 20:17-18,28</a>）<em>（「監督者」と訳されている語は、ギリシア語原文では ἐπισκόπους —「主教たち」です。）</em></p></blockquote><p><a href="https://bibleox.com/ru/ru/w/%D0%A2%D0%B0%D0%B8%D0%BD%D1%81%D1%82%D0%B2%D0%BE-%D0%A1%D0%B2%D1%8F%D1%89%D0%B5%D0%BD%D1%81%D1%82%D0%B2%D0%B0">神品機密</a>について、さらに詳しく。</p><hr><p>このように、教会はまったくはっきりとした目に見える共同体（有機体）であり、ただ一つの共通の使徒的信仰を持ち、すべての人に共通の規則を持ち、使徒たちによって立てられ、すべてにおいて一致している指導者たちのもとにあり、その成員の間には隔てがありません。</p><h2>教会の境界と聖体機密（エウカリスティア）</h2><p>旧約の教会は、新約の教会とは違い、キリストの体とは呼ばれませんでした。新約の教会は、神秘的な神人的有機体、<a href="https://bibleox.com/ja/ja/w/71cW_教会/">キリストの体</a>です。それゆえ、教会の境界は、体の境界があるところにあります。人間の体の境界はどこにあるでしょうか。血が巡っているところが体です。巡っていないところは体ではありません。血がなければ、人の各部分に命はありません。切り離された手は、もはや体の一部ではありません。血の流れを受けないので、まもなく腐ってしまいます。真の交わり（領聖）があるところに、体、すなわち教会があります。</p><blockquote><p>「わたしたちが神を賛美する賛美の杯は、<strong>キリストの血にあずかること</strong>ではないか。わたしたちが裂くパンは、<strong>キリストの体にあずかること</strong>ではないか。<strong>パンは一つだから、わたしたちは大勢でも一つの体です。皆が一つのパンを分けて食べるからです</strong>」（<a href="https://bibleox.com/ja/jp-ni/1kor/10/#L16-17">１コリ. 10:16-17</a>）</p></blockquote><blockquote><p>「<strong>あなたがたはキリストの体であり</strong>、また、一人一人はその部分です」（<a href="https://bibleox.com/ja/jp-ni/1kor/12/#L27">１コリ. 12:27</a>）</p></blockquote><blockquote><p>「しかしあなたがたは、以前は遠く離れていたが、今や、キリスト・イエスにおいて、<strong>キリストの血によって近い者となったのです</strong>」（<a href="https://bibleox.com/ja/jp-ni/ef/2/#L13">エフェ. 2:13</a>）</p></blockquote><p>だからこそ、人は教会においてのみ救われるのです。キリストは<a href="https://bibleox.com/ja/ja/w/71cW_教会/">体、すなわち教会</a>の救い主だからです。</p><blockquote><p>「<strong>キリストが教会の頭であり</strong>、<strong>自らその体の救い主である</strong>ように、夫は妻の頭だからです」（<a href="https://bibleox.com/ja/jp-ni/ef/5/#L23">エフェ. 5:23</a>）</p></blockquote><p><a href="https://bibleox.com/ru/ru/w/%D0%95%D0%B2%D1%85%D0%B0%D1%80%D0%B8%D1%81%D1%82%D0%B8%D1%8F">聖体機密（エウカリスティア）</a>について、さらに詳しく。</p><h3>神品致命者アンティオキアの主教イグナティオス（1世紀）、<a href="https://bibleox.com/en/en/w/IgnAn_Sm/">『スミルナの信徒への手紙』</a>（英語）より：</h3><blockquote><p>「第8章。…… 主教なしに、だれも教会に関わることを何一つ行ってはならない。<strong>主教によって、あるいは主教が委ねた者によって［行われる］聖体礼儀（エウカリスティア）を、正しいものと見なしなさい</strong>」<em>（英訳からの訳）</em></p></blockquote>

