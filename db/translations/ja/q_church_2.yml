    menu: { parent: "教会", title: "教会——主教は互いに等しい", priority: 7 }
    body: |-
      <p>使徒たちと主教たちは、互いに等しい者です。使徒たちは、自分たちのうちだれがいちばん偉いかと、しばしば議論しました。キリストは彼らに、互いの上に立つ権力を求めないようにと言われました。</p><blockquote><p>「<strong>弟子たちの間で、自分たちのうちだれがいちばん偉いかという議論が起きた</strong>。&lt;…&gt; 言われた。『&lt;…&gt; あなたがた皆の中で最も小さい者こそ、最も偉い者である』」（<a href="https://bibleox.com/ja/jp-ni/lk/9/#L46,48">ルカ. 9:46,48</a>）</p></blockquote><blockquote><p>「<strong>また、使徒たちの間に、自分たちのうちでだれがいちばん偉いだろうか、という議論も起こった</strong>。そこで、イエスは言われた。『異邦人の間では、王が民を支配し、民の上に権力を振るう者が守護者と呼ばれている。<strong>しかし、あなたがたはそれではいけない。あなたがたの中でいちばん偉い人は、いちばん若い者のようになり</strong>、上に立つ人は、仕える者のようになりなさい』」（<a href="https://bibleox.com/ja/jp-ni/lk/22/#L24-26">ルカ. 22:24-26</a>）</p></blockquote><blockquote><p>「彼ら［使徒たち］は黙っていた。<strong>途中でだれがいちばん偉いかと議論し合っていたからである</strong>。イエスが座り、十二人を呼び寄せて言われた。『<strong>いちばん先になりたい者は、すべての人の後になり、すべての人に仕える者になりなさい</strong>』」（<a href="https://bibleox.com/ja/jp-ni/mk/9/#L34-35">マコ. 9:34-35</a>）</p></blockquote><p>使徒ヤコブとヨハネが、御国でキリストの右と左に座らせてほしいと願ったとき、ほかの使徒たちはこれに腹を立てました。キリストは彼ら全員に、互いの上に立つ権力を求めないようにと言われました。</p><blockquote><p>「そこで、イエスは一同を呼び寄せて言われた。『あなたがたも知っているように、異邦人の間では支配者たちが民を支配し、偉い人たちが権力を振るっている。<strong>しかし、あなたがたの間では、そうであってはならない</strong>。あなたがたの中で偉くなりたい者は、皆に仕える者になり、いちばん上になりたい者は、皆の僕になりなさい』」（<a href="https://bibleox.com/ja/jp-ni/mf/20/#L25-27">マタ. 20:25-27</a>）</p></blockquote><p>同様の箇所：<a href="https://bibleox.com/ja/jp-ni/mk/10/#L41-44">マコ. 10:41-44</a>。ほかのすべての正教会から離れたローマ教会は、使徒ペトロの特別な権能を引き合いに出します。</p><blockquote><p>「わたしはあなた［ペトロ］に天の国の鍵を授ける。<strong>あなたが地上でつなぐことは、天上でもつながれる</strong>。あなたが地上で解くことは、天上でも解かれる」（<a href="https://bibleox.com/ja/jp-ni/mf/16/#L19">マタ. 16:19</a>）</p></blockquote><p>しかし、この権能はすべての使徒に与えられています。</p><blockquote><p>「はっきり言っておく。<strong>あなたがた［使徒たち］が地上でつなぐことは、天上でもつながれ</strong>、あなたがたが地上で解くことは、天上でも解かれる」（<a href="https://bibleox.com/ja/jp-ni/mf/18/#L18">マタ. 18:18</a>）</p></blockquote><blockquote><p>「そう言ってから、彼ら［使徒たち］に息を吹きかけて言われた。『聖霊を受けなさい。<strong>だれの罪でも、あなたがたが赦せば、その罪は赦される</strong>。だれの罪でも、あなたがたが赦さなければ、赦されないまま残る』」（<a href="https://bibleox.com/ja/jp-ni/in/20/#L22-23">ヨハ. 20:22-23</a>）</p></blockquote><p>意味深いことに、主が（そしてその後でほかの者たちの）足を洗われたのは、まさに使徒ペトロでした。こうして主は模範を示し、権力を愛することを戒められたのです。</p><blockquote><p>「ところで、主であり、師であるわたしがあなたがたの足を洗ったのだから、あなたがたも互いに足を洗い合わなければならない。<strong>わたしがあなたがたにしたとおりに、あなたがたもするようにと、模範を示したのである</strong>」（<a href="https://bibleox.com/ja/jp-ni/in/13/#L14-15">ヨハ. 13:14-15</a>）</p></blockquote><p>のちに使徒パウロは、人々の前で使徒ペトロを非難します（<a href="https://bibleox.com/ja/jp-ni/gal/2/#L11">ガラ. 2:11</a>）。エルサレムでの最初の使徒会議では、使徒ヤコブが議長を務めます（<a href="https://bibleox.com/ja/jp-ni/act/15/#L13,19">使. 15:13,19</a>）。また使徒ペトロ自身も、ローマだけでなく、たとえばアンティオキアにも主教を立てました。</p><p>使徒たちの弟子たちは、主教は使徒の継承者であると書いています。使徒に関わることはすべて、主教にも関わります。このことについての使徒の弟子たちと古代キリスト教徒たちの言葉（ロシア語）：<a href="https://bibleox.com/ru/ru/w/qeuY_%D0%95%D0%BF%D0%B8%D1%81%D0%BA%D0%BE%D0%BF%D1%8B__%D0%BF%D1%80%D0%B5%D0%B5%D0%BC%D0%BD%D0%B8%D0%BA%D0%B8_%D0%B0%D0%BF%D0%BE%D1%81%D1%82%D0%BE%D0%BB%D0%BE%D0%B2">主教は使徒の継承者</a>（ロシア語）</p>

  - src: церковь-новый-израиль
    path: Ni5t_教会新しいイスラエル
    title: 教会 — 新しいイスラエル
    menu: { parent: "教会", title: "教会——新しいイスラエル", priority: 10 }
    body: |-
      <h2>キリストは教会の根である</h2><blockquote><p>「あなたがたは、<strong><mark>主キリスト・イエス</mark></strong>を受け入れたのですから、キリストに結ばれて歩みなさい。<strong><mark>キリストに根を下ろして</mark></strong>（ἐρριζωμένοι）造り上げられ、教えられたとおりの信仰をしっかり守って、あふれるばかりに感謝しなさい」（<a href="https://bibleox.com/ja/jp-ni/kol/2/#L6-7">コロ. 2:6-7</a>）</p></blockquote><blockquote><p>「<strong><mark>わたし、イエス</mark></strong>は使いを遣わし、諸教会のために以上のことをあなたがたに証しした。<strong><mark>わたしは、ダビデのひこばえ</mark></strong>、その一族、輝く明けの明星である」（<a href="https://bibleox.com/ja/jp-ni/otkr/22/#L16">黙. 22:16</a>）<em>（「ひこばえ」と訳されている語は、ギリシア語原文では ῥίζα —「根」です。ἐγώ εἰμι ἡ ῥίζα —「わたしは根である」。）</em></p></blockquote><h3>キリストはまた、枝を養うぶどうの木である</h3><blockquote><p>「<strong><mark>わたしはまことのぶどうの木</mark></strong>、わたしの父は農夫である。わたしにつながっていながら、実を結ばない枝はみな、父が取り除かれる。しかし、実を結ぶものはみな、いよいよ豊かに実を結ぶように手入れをなさる。わたしの話した言葉によって、あなたがたは既に清くなっている。<strong>わたしにつながっていなさい</strong>。わたしもあなたがたにつながっている。ぶどうの枝が、木につながっていなければ、自分では実を結ぶことができないように、あなたがたも、わたしにつながっていなければ、実を結ぶことができない。<strong><mark>わたしはぶどうの木、あなたがたはその枝である</mark></strong>。人がわたしにつながっており、わたしもその人につながっていれば、その人は豊かに実を結ぶ。わたしを離れては、あなたがたは何もできないからである。<strong>わたしにつながっていない人がいれば、枝のように外に投げ捨てられて枯れる</strong>。そして、集められ、火に投げ入れられて焼かれてしまう」（<a href="https://bibleox.com/ja/jp-ni/in/15/#L1-6">ヨハ. 15:1-6</a>）</p></blockquote><h3>キリストはまた、教会の頭である</h3><blockquote><p>「また、<strong>御子はその体である教会の<mark>頭</mark>です</strong>。御子は初めの者、死者の中から最初に生まれた方です。こうして、すべてのことにおいて第一の者となられたのです」（<a href="https://bibleox.com/ja/jp-ni/kol/1/#L18">コロ. 1:18</a>）</p></blockquote><blockquote><p>「神はまた、すべてのものをキリストの足もとに従わせ、キリストをすべてのものの上にある<strong><mark>頭</mark></strong>として<strong>教会</strong>にお与えになりました。教会は<strong>キリストの体</strong>であり、すべてにおいてすべてを満たしている方の満ちておられる場です」（<a href="https://bibleox.com/ja/jp-ni/ef/1/#L22-23">エフェ. 1:22-23</a>）</p></blockquote><blockquote><p>「<strong><mark>頭</mark>であるキリストにしっかりと付いていないのです。この頭の働きにより、体全体は</strong>、節と節、筋と筋とによって支えられ、結び合わされ、神に育てられて成長してゆくのです」（<a href="https://bibleox.com/ja/jp-ni/kol/2/#L19">コロ. 2:19</a>）</p></blockquote><h2>イスラエルの一部（枝）は、キリスト（根）から離れ落ちた</h2><p>イスラエルの一部は離れ落ち、異邦の諸民族が根（キリスト）に接ぎ木されました。切り離されたユダヤ人は、根の切り離された部分ではなく、折り取られた枝と呼ばれています。</p><blockquote><p>「麦の初穂が聖なるものであれば、練り粉全体もそうであり、根が聖なるものであれば、枝もそうです。しかし、<strong><mark>ある枝が折り取られ</mark></strong>、<strong>野生のオリーブであるあなたが、その代わりに接ぎ木され</strong>、<strong><mark>根から豊かな養分を受けるようになった</mark></strong>からといって、折り取られた枝に対して誇ってはなりません。誇ったところで、あなたが根を支えているのではなく、根があなたを支えているのです」（<a href="https://bibleox.com/ja/jp-ni/rim/11/#L16-18">ロマ. 11:16-18</a>）</p></blockquote><blockquote><p>「イザヤも大胆に、『<strong>わたしは、わたしを探さなかった者たちに見いだされ</strong>、わたしを尋ねなかった者たちに自分を現した』と言っています。<strong><u><mark>しかし、イスラエルについては</mark></u></strong>、<strong><mark>『わたしは、不従順で反抗する民に、一日中手を差し伸べた』と言っています</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/rim/10/#L20-21">ロマ. 10:20-21</a>）</p></blockquote><blockquote><p>「では、尋ねよう。<strong>神は御自分の民を退けられたのであろうか。決してそうではない。わたしもイスラエル人で</strong>、アブラハムの子孫であり、ベニヤミン族の者です。&lt;…&gt; しかし、神は彼に何と告げているか。『<strong>わたしは、バアルにひざまずかなかった七千人を自分のために残しておいた</strong>』と告げておられます。<strong>同じように、現に今も</strong>、恵みによって<strong><mark>選ばれた者が残っています</mark></strong>。&lt;…&gt; では、どうなのか。イスラエルは求めているものを得ないで、<strong><mark>選ばれた者がそれを得たのです。他の者はかたくなにされたのです</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/rim/11/#L1,4-5,7">ロマ. 11:1,4-5,7</a>）</p></blockquote><h2>折り取られた枝（イスラエルの一部）の代わりに、新しい枝（ほかのすべての民族）が根に接ぎ木される</h2><blockquote><p>「エシュルンはしかし、肥えると足でけった。お前は肥え太ると、かたくなになり<strong>造り主なる神を捨て</strong>、救いの岩を侮った。彼らは他の神々に心を寄せ主にねたみを起こさせいとうべきことを行って、主を怒らせた。彼らは神ならぬ悪霊に犠牲をささげ新しく現れ、先祖も知らなかった無縁の神々に犠牲をささげた。<strong>お前は自分を産み出した岩を思わず</strong>産みの苦しみをされた神を忘れた。主はこれを見て御自分の息子、娘への憤りのゆえに彼らを退けて、言われた。<strong><mark>わたしは、わたしの顔を隠して彼らの行く末を見届けよう</mark>。彼らは逆らう世代</strong>真実のない子らだ。彼らは神ならぬものをもってわたしのねたみを引き起こしむなしいものをもってわたしの怒りを燃えたたせた。それゆえ、<strong><mark>わたしは民ならぬ者をもって彼らのねたみを引き起こし</mark></strong>愚かな国をもって彼らの怒りを燃えたたせる」（<a href="https://bibleox.com/ja/jp-ni/vtor/32/#L15-21">申. 32:15-21</a>）</p></blockquote><blockquote><p>「<strong>見よ、わたしがイスラエルの家、ユダの家と<mark>新しい契約</mark>を結ぶ日が来る</strong>、と主は言われる。<strong>この契約は、かつてわたしが彼らの先祖の手を取ってエジプトの地から導き出したときに結んだ<mark>ものではない</mark>。わたしが彼らの主人であったにもかかわらず、<mark>彼らはこの契約を破った</mark></strong>、と主は言われる。しかし、来るべき日に、わたしがイスラエルの家と結ぶ契約はこれである、と主は言われる。すなわち、わたしの律法を<strong>彼らの胸の中に授け、彼らの心にそれを記す。わたしは彼らの神となり、<mark>彼らはわたしの民となる</mark></strong>。そのとき、人々は隣人どうし、兄弟どうし、『主を知れ』と言って教えることはない。彼らはすべて、小さい者も大きい者もわたしを知るからである、と主は言われる。わたしは彼らの悪を赦し、再び彼らの罪に心を留めることはない。主はこう言われる。太陽を置いて昼の光とし月と星の軌道を定めて夜の光とし海をかき立て、波を騒がせる方その御名は万軍の主。これらの定めがわたしの前から退くことがあろうとも、と主は言われる。イスラエルの子孫は永遠に絶えることなく、わたしの民である。主はこう言われる。もし、上においては、天が測られ下においては、地の基が究められるならわたしがイスラエルのすべての子孫を彼らのあらゆる行いのゆえに拒むこともありえようと主は言われる」（<a href="https://bibleox.com/ja/jp-ni/ier/31/#L31-37">エレ. 31:31-37</a>）</p></blockquote><blockquote><p>「麦の初穂が聖なるものであれば、練り粉全体もそうであり、根が聖なるものであれば、枝もそうです。しかし、ある枝が折り取られ、<strong><mark>野生のオリーブであるあなたが、その代わりに接ぎ木され</mark></strong>、<strong><mark>根から豊かな養分を受けるようになった</mark></strong>からといって、折り取られた枝に対して誇ってはなりません。誇ったところで、あなたが根を支えているのではなく、根があなたを支えているのです」（<a href="https://bibleox.com/ja/jp-ni/rim/11/#L16-18">ロマ. 11:16-18</a>）</p></blockquote><blockquote><p>「わたしに尋ねようとしない者にもわたしは、尋ね出される者となりわたしを求めようとしない者にも見いだされる者となった。<strong><mark>わたしの名を呼ばない民にもわたしはここにいる、ここにいると言った</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/is/65/#L1">イザ. 65:1</a>）</p></blockquote><blockquote><p>「わたしは彼女を地に蒔き<strong>ロ・ルハマ（憐れまれぬ者）を憐れみ</strong><strong><mark>ロ・アンミ（わが民でない者）に向かって『あなたはアンミ（わが民）』と言う</mark></strong>。彼は、『わが神よ』とこたえる」（<a href="https://bibleox.com/ja/jp-ni/os/2/#L25">ホセ. 2:25</a>）</p></blockquote><blockquote><p>「神はわたしたちを憐れみの器として、<strong><mark>ユダヤ人からだけでなく、異邦人の中からも召し出してくださいました</mark></strong>。<strong>ホセアの書にも、次のように述べられています。『<mark>わたしは、自分の民でない者をわたしの民と呼び、愛されなかった者を愛された者と呼ぶ</mark>。</strong>『あなたたちは、わたしの民ではない』と言われたその場所で、<strong><mark>彼らは生ける神の子らと呼ばれる</mark></strong>』」（<a href="https://bibleox.com/ja/jp-ni/rim/9/#L24-26">ロマ. 9:24-26</a>）</p></blockquote><h2>教会では、もはや民族は問題にならない</h2><p>使徒は <a href="https://bibleox.com/ja/jp-ni/rim/11/#L16-18">ロマ. 11:16-18</a> で、一方の極端、すなわちユダヤ人を軽んじ、彼らの上に自分を高めることを打ち砕いています。もう一方の極端は、彼らの前にひれ伏すことです。その中間の道は、教会には民族の区別がないということです。教会では皆が互いに兄弟であり、教会に加わる人は皆、民族にかかわらず、また神がどこで、どのような者として生まれるように定められたかにかかわらず、兄弟となります。</p><blockquote><p>「そこには、<strong><mark>もはや、ギリシア人とユダヤ人</mark></strong>、割礼を受けた者と受けていない者、<strong><mark>未開人</mark></strong>、<strong><mark>スキタイ人</mark></strong>、<strong>奴隷、自由な身分の者の区別はありません</strong>。キリストがすべてであり、すべてのもののうちにおられるのです」（<a href="https://bibleox.com/ja/jp-ni/kol/3/#L11">コロ. 3:11</a>）</p></blockquote><h2>教会では、ユダヤ人と異邦人の間に区別は<strong><u>ない</u></strong></h2><blockquote><p>「議論を重ねた後、ペトロが立って彼らに言った。『兄弟たち、ご存じのとおり、ずっと以前に、神はあなたがたの間でわたしをお選びになりました。それは、異邦人が、わたしの口から福音の言葉を聞いて信じるようになるためです。人の心をお見通しになる神は、わたしたちに与えてくださったように異邦人にも聖霊を与えて、彼らをも受け入れられたことを証明なさったのです。また、彼らの心を信仰によって清め、<strong>わたしたちと彼らとの間に<mark>何の差別をもなさいませんでした</mark></strong>』」（<a href="https://bibleox.com/ja/jp-ni/act/15/#L7-9">使. 15:7-9</a>）</p></blockquote><blockquote><p>「しかしあなたがたは、以前は遠く離れていたが、今や、キリスト・イエスにおいて、キリストの血によって近い者となったのです。実に、キリストはわたしたちの平和であります。<strong><mark>二つのものを一つにし</mark></strong>、<strong>御自分の肉において敵意という隔ての壁を取り壊し</strong>、規則と戒律ずくめの律法を廃棄されました。こうしてキリストは、<strong><mark>双方を御自分において一人の新しい人に造り上げて</mark></strong>平和を実現し、十字架を通して、<strong><mark>両者を一つの体として</mark></strong><strong>神と</strong><strong><mark>和解させ</mark></strong>、十字架によって敵意を滅ぼされました。&lt;…&gt; それで、<strong><mark>このキリストによってわたしたち両方の者が</mark></strong>一つの霊に結ばれて、<strong><mark>御父に近づくことができるのです</mark></strong>。&lt;…&gt; 使徒や預言者という土台の上に建てられています。<strong>そのかなめ石はキリスト・イエス御自身であり</strong>」（<a href="https://bibleox.com/ja/jp-ni/ef/2/#L13-16,18,20">エフェ. 2:13-16,18,20</a>）</p></blockquote><h2>イスラエルの民は、救い主がこの世に来られるために選ばれた。この目的は果たされた</h2><p><a href="https://bibleox.com/ru/ru/w/%D0%B2%D0%B5%D1%82%D1%85%D0%B8%D0%B9-%D0%B7%D0%B0%D0%B2%D0%B5%D1%82#HH-%D0%9E%D0%B1%D0%B5%D1%89%D0%B0%D0%BD%D0%B8%D0%B5-%D0%BF%D1%80%D0%B8%D1%88%D0%B5%D1%81%D1%82%D0%B2%D0%B8%D1%8F-%D0%A1%D0%BF%D0%B0%D1%81%D0%B8%D1%82%D0%B5%D0%BB%D1%8F">旧約 — 救い主の来臨の約束</a></p><h2>アブラハムの子とは、信じる者たちである</h2><blockquote><p>「それは、『アブラハムは神を信じた。それは彼の義と認められた』と言われているとおりです。だから、<strong><mark>信仰によって生きる人々こそ、アブラハムの子である</mark></strong>とわきまえなさい。聖書は、神が異邦人を信仰によって義となさることを見越して、『あなたのゆえに<strong>異邦人は皆</strong>祝福される』という福音をアブラハムに予告しました。それで、<strong>信仰によって生きる人々は、信仰の人アブラハムと共に祝福されています。律法の実行に頼る者はだれでも、呪われています</strong>。『律法の書に書かれているすべての事を絶えず守らない者は皆、呪われている』と書いてあるからです」（<a href="https://bibleox.com/ja/jp-ni/gal/3/#L6-10">ガラ. 3:6-10</a>）</p></blockquote><h2>ユダヤ人とは、外見上ではなく、霊的に（内面で）そうである者である</h2><blockquote><p>「<strong>外見上のユダヤ人がユダヤ人ではなく</strong>、また、肉に施された外見上の割礼が割礼ではありません。<strong><mark>内面が</mark>ユダヤ人である者こそユダヤ人であり</strong>、文字ではなく“霊”によって心に施された割礼こそ割礼なのです。その誉れは人からではなく、神から来るのです」（<a href="https://bibleox.com/ja/jp-ni/rim/2/#L28-29">ロマ. 2:28-29</a>）</p></blockquote><blockquote><p>「<strong><mark>割礼の有無は問題ではなく</mark></strong>、大切なのは、新しく創造されることです」（<a href="https://bibleox.com/ja/jp-ni/gal/6/#L15">ガラ. 6:15</a>）<em>（ビザンティン本文（多数派写本）では、この節は「<strong>キリスト・イエスにあっては</strong>（ἐν γὰρ Χριστῷ Ἰησοῦ）、割礼も無割礼も何の力もなく」と始まります。）</em></p></blockquote><h2><u>すべての</u>民族から立てられる新約の祭司職についての預言</h2><p>旧約の教会では、祭司はユダヤ人の中から、レビ族の中から、アロンの家系の中からだけ立てられました。しかし新約の教会では、ユダヤ人（アロンの家系）からだけでなく、すべての民族から祭司が立てられます。</p><blockquote><p>「わたしは彼らの業と彼らの謀のゆえに、<strong><u><mark>すべての</mark></u><mark>国、すべての言葉の民を集めるために臨む</mark></strong>。彼らは来て、わたしの栄光を見る。わたしは、彼らの間に一つのしるしをおき、彼らの中から生き残った者を諸国に遣わす。すなわち、タルシシュに、弓を巧みに引くプルとルドに、トバルとヤワンに、更に<strong>わたしの名声を聞いたことも、わたしの栄光を見たこともない</strong>、遠い島々に遣わす。彼らはわたしの栄光を国々に伝える。彼らはあなたたちのすべての兄弟を主への献げ物として、馬、車、駕籠、らば、らくだに載せ、あらゆる国民の間からわたしの聖なる山エルサレムに連れて来る、と主は言われる。それは、イスラエルの子らが献げ物を清い器に入れて、主の神殿にもたらすのと同じである、と主は言われる。<strong><mark>わたしは彼らのうちからも祭司とレビ人を立てる</mark>、と主は言われる</strong>」（<a href="https://bibleox.com/ja/jp-ni/is/66/#L18-21">イザ. 66:18-21</a>）</p></blockquote>

  - src: Церковь-возвышение-над-миром
    path: Rw8m_教会世から高く上る
    title: 教会 — 世から高く上る
    meta_desc: 福音を宣べ伝えながらも、教会が世と混ざり合わないようにする必要
    menu: { parent: "教会", title: "教会——世から高く上る", priority: 13 }
    body: |-
      <blockquote><p>「<strong>世も世にあるものも、愛してはいけません</strong>。世を愛する人がいれば、御父への愛はその人の内にありません。なぜなら、すべて世にあるもの、<strong>肉の欲、目の欲、生活のおごり</strong>は、御父から出ないで、世から出るからです」（<a href="https://bibleox.com/ja/jp-ni/1in/2/#L15-16">１ヨハ. 2:15-16</a>）</p></blockquote><blockquote><p>「<strong>無知であったころの欲望に引きずられることなく</strong>、従順な子となり」（<a href="https://bibleox.com/ja/jp-ni/1pet/1/#L14">１ペト. 1:14</a>）</p></blockquote><p>今の世の姿ではなく、神の像に向かって努める必要：</p><blockquote><p>「<strong>あなたがたはこの世に倣ってはなりません</strong>。むしろ、心を新たにして自分を変えていただき、<strong>何が神の御心であるか</strong>、何が善いことで、神に喜ばれ、また完全なことであるかを<strong>わきまえるようになりなさい</strong>」（<a href="https://bibleox.com/ja/jp-ni/rim/12/#L2">ロマ. 12:2</a>）</p></blockquote>

  - src: храм-образ-небесной-реальности
    path: Th4h_教会堂天の現実の象徴
    title: 教会堂 — 天の現実の象徴
    menu: { parent: "教会", title: "教会堂——天の現実の象徴", priority: 14 }
    body: |-
      <h2>見えないものの見える象徴</h2><h3>宇宙</h3><p>神は、見えるものを通して見えないものが知られるように世界を造られました。人が見える被造物を眺めることによって、見えない創造主を知るようになるためです。</p><blockquote><p>「なぜなら、<strong>神について知りうる事柄は、彼らにも明らかだからです</strong>。<strong>神がそれを示されたのです</strong>。世界が造られたときから、<strong>目に見えない</strong>神の性質、つまり神の永遠の力と神性は被造物に現れており、<strong>これを通して神を知ることができます</strong>。従って、彼らには弁解の余地がありません」（<a href="https://bibleox.com/ja/jp-ni/rim/1/#L19-20">ロマ. 1:19-20</a>）</p></blockquote><h3>神殿</h3><p>目に見える地上の神殿は、目に見えない天の現実の象徴です。預言者には、山で示された型に従って神殿を整えるようにという命令が与えられます。</p><blockquote><p>「<strong>わたしのための聖なる所</strong>を彼らに造らせなさい。わたしは彼らの中に住むであろう。<strong>わたしが示す作り方に正しく従って</strong>、<strong>幕屋</strong>とそのすべての祭具を<strong>作りなさい</strong>。&lt;…&gt; <strong>あなたはこの山で示された作り方に従い、注意して作りなさい</strong>」（<a href="https://bibleox.com/ja/jp-ni/ish/25/#L8-9,40">出. 25:8-9,40</a>）</p></blockquote><p>使徒は、神殿がまことの聖所の象徴として整えられたことを指摘しています。</p><blockquote><p>「なぜならキリストは、<strong>まことのものの写しにすぎない、人間の手で造られた聖所</strong><em>（ギリシア語 ἀντίτυπα —「似姿、写し」）</em>にではなく、天そのものに入り、今やわたしたちのために神の御前に現れてくださったからです」（<a href="https://bibleox.com/ja/jp-ni/evr/9/#L24">ヘブ. 9:24</a>）</p></blockquote><blockquote><p>「わたしたちの先祖には、荒れ野に証しの<strong>幕屋</strong>がありました。これは、<strong>見たままの形に</strong>造るようにとモーセに言われた方のお命じになったとおりのものでした」（<a href="https://bibleox.com/ja/jp-ni/act/7/#L44">使. 7:44</a>）</p></blockquote><h2>旧約：神殿には神と天使たちだけ</h2><h3>見えない神</h3><p>神の命令によって建てられた旧約の神殿では、最も大切な場所に、聖なる物を納めた箱（契約の箱）だけが置かれていました。その蓋の上、二つのケルビムの間で、神は御自身を現し、語られました。</p><blockquote><p>「<strong>わたしは掟の箱の上の一対のケルビムの間、すなわち贖いの座の上からあなたに臨み</strong>、わたしがイスラエルの人々に命じることをことごとく<strong>あなたに語る</strong>」（<a href="https://bibleox.com/ja/jp-ni/ish/25/#L22">出. 25:22</a>）</p></blockquote><h3>聖なる天使たち</h3><p>神殿は至るところ、天使（ケルビム）の像で満たされていました。</p><h4>箱の蓋の上のケルビム</h4><blockquote><p>「<strong>打ち出し作りで一対のケルビムを作り</strong>、<strong>贖いの座の両端</strong>、すなわち、一つを一方の端に、もう一つを他の端に付けなさい。一対のケルビムを贖いの座の一部としてその両端に作る。一対のケルビムは顔を贖いの座に向けて向かい合い、翼を広げてそれを覆う」（<a href="https://bibleox.com/ja/jp-ni/ish/25/#L18-20">出. 25:18-20</a>）</p></blockquote><h4>箱の左右のケルビム</h4><blockquote><p>「ソロモンはオリーブ材で<strong>二体のケルビムを作り、内陣に据えた</strong>。その高さは十アンマであった。&lt;…&gt; <strong>ソロモンはこのケルビムを神殿の奥に置いた</strong>。二体のケルビムはそれぞれ翼を広げ、一方のケルビムの翼が一方の壁に触れ、もう一方のケルビムの翼も、もう一方の壁に触れていた。また、それぞれの内側に向かった翼は接し合っていた」（<a href="https://bibleox.com/ja/jp-ni/3ts/6/#L23,27">王上. 6:23,27</a>）</p></blockquote><h4>垂れ幕のケルビム</h4><blockquote><p>「彼は、青の織物、深紅の織物、緋の織物、麻の織物で<strong>垂れ幕</strong>を作ったが、<strong>それにもケルビムの縫い取りを施した</strong>」（<a href="https://bibleox.com/ja/jp-ni/2par/3/#L14">代下. 3:14</a>）（<a href="https://bibleox.com/ja/jp-ni/1mak/1/#L22">１マカ. 1:22</a>）</p></blockquote><h4>神殿の壁のケルビム</h4><blockquote><p>「<strong>神殿の周囲の壁面はすべて</strong>、内側の部屋も外側の部屋も、<strong>ケルビム</strong>となつめやしと花模様<strong>の浮き彫りが施されていた</strong>」（<a href="https://bibleox.com/ja/jp-ni/3ts/6/#L29">王上. 6:29</a>）</p></blockquote><p>神殿の構造について詳しく（ロシア語）：<a href="https://bibleox.com/ru/ru/w/%D0%B8%D0%B5%D1%80%D1%83%D1%81%D0%B0%D0%BB%D0%B8%D0%BC%D1%81%D0%BA%D0%B8%D0%B9-%D1%85%D1%80%D0%B0%D0%BC">エルサレムの神殿</a></p><h2>新約：教会堂には神、天使たち、義人たちの魂</h2><h3>天の現実が変わった</h3><p>神は人となり、目に見える者となり、苦しみを受け、復活し、天に昇り、<u>目に見える姿で</u>玉座に着かれました（<a href="https://bibleox.com/ja/jp-ni/mk/16/#L19">マコ. 16:19</a>; <a href="https://bibleox.com/ja/jp-ni/ef/1/#L20-21">エフェ. 1:20-21</a>; <a href="https://bibleox.com/ja/jp-ni/otkr/3/#L21">黙. 3:21</a>）。</p><h3>神であるキリスト</h3><blockquote><p>「主イエスは、弟子たちに話した後、天に上げられ、<strong><mark>神の右の座に着かれた</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/mk/16/#L19">マコ. 16:19</a>）</p></blockquote><blockquote><p>「神は、この力をキリストに働かせて、キリストを死者の中から復活させ、<strong><mark>天において御自分の右の座に着かせ</mark></strong>、すべての支配、権威、勢力、主権の上に置き、今の世ばかりでなく、来るべき世にも唱えられるあらゆる名の上に置かれました」（<a href="https://bibleox.com/ja/jp-ni/ef/1/#L20-21">エフェ. 1:20-21</a>）</p></blockquote><blockquote><p>「勝利を得る者を、わたしは<strong>自分の座</strong>に共に座らせよう。わたしが勝利を得て、<strong><mark>わたしの父と共にその玉座に着いた</mark></strong>のと同じように」（<a href="https://bibleox.com/ja/jp-ni/otkr/3/#L21">黙. 3:21</a>）</p></blockquote><h3>聖なる天使たち</h3><blockquote><p>「また、別の<strong>天使</strong>が来て、手に金の香炉を持って祭壇のそばに立つと、この天使に多くの香が渡された。すべての聖なる者たちの祈りに添えて、玉座の前にある金の祭壇に献げるためである」（<a href="https://bibleox.com/ja/jp-ni/otkr/8/#L3">黙. 8:3</a>）</p></blockquote><blockquote><p>「そして、この神殿から、七つの災いを携えた七人の<strong>天使</strong>が出て来た。天使たちは、輝く清い亜麻布の衣を着て、胸に金の帯を締めていた」（<a href="https://bibleox.com/ja/jp-ni/otkr/15/#L6">黙. 15:6</a>）</p></blockquote><h3>聖なる義人たちの魂</h3><blockquote><p>「小羊が第五の封印を開いたとき、<strong>神の言葉と自分たちがたてた証しのために殺された人々の魂を、わたしは祭壇の下に見た</strong>。彼らは大声でこう叫んだ。『真実で聖なる主よ、いつまで裁きを行わず、地に住む者にわたしたちの血の復讐をなさらないのですか。』すると、その一人一人に、<strong>白い衣</strong>が与えられ、また、<strong>自分たちと同じように殺されようとしている兄弟であり</strong>、仲間の僕である者たち<strong>の数が満ちるまで</strong>、なお、しばらく静かに待つようにと告げられた」（<a href="https://bibleox.com/ja/jp-ni/otkr/6/#L9-11">黙. 6:9-11</a>）</p></blockquote><blockquote><p>「また、わたしが見ていると、見よ、<strong>小羊</strong>がシオンの山に立っており、<strong>小羊と共に十四万四千人の者たち</strong>がいて、その額には小羊の名と、小羊の父の名とが記されていた。&lt;…&gt; 彼らは、玉座の前、また四つの生き物と長老たちの前で、新しい歌のたぐいをうたった。この歌は、<strong>地上から贖われた</strong>十四万四千人の者たちのほかは、覚えることができなかった。彼らは、<strong>女に触れて身を汚したことのない者である</strong>。彼らは童貞だからである。この者たちは、<strong>小羊の行くところへは、どこへでも従って行く</strong>。この者たちは、神と小羊に献げられる初穂として、人々の中から贖われた者たちで、その口には偽りがなく、とがめられるところのない者たちである」（<a href="https://bibleox.com/ja/jp-ni/otkr/14/#L1,3-5">黙. 14:1,3-5</a>）</p></blockquote><h3>歌</h3><blockquote><p>「すると、突然、この天使に天の大軍が加わり、神を賛美して言った。『いと高きところには栄光、神にあれ、地には平和、御心に適う人にあれ』」（<a href="https://bibleox.com/ja/jp-ni/lk/2/#L13-14">ルカ. 2:13-14</a>）</p></blockquote><blockquote><p>「また、わたしが見ていると、見よ、<strong>小羊</strong>がシオンの山に立っており、<strong>小羊と共に十四万四千人の者たち</strong>がいて、その額には小羊の名と、小羊の父の名とが記されていた。&lt;…&gt; 彼らは、玉座の前、また四つの生き物と長老たちの前で、<strong>新しい歌のたぐいをうたった</strong>」（<a href="https://bibleox.com/ja/jp-ni/otkr/14/#L1,3">黙. 14:1,3</a>）</p></blockquote><h3>天の神殿を測れという命令</h3><blockquote><p>「それから、わたしは杖のような物差しを与えられて、こう告げられた。『立って<strong><mark>神の神殿</mark>と祭壇とを測り</strong>、また、そこで礼拝している者たちを数えよ』」（<a href="https://bibleox.com/ja/jp-ni/otkr/11/#L1">黙. 11:1</a>）</p></blockquote><h3>玉座</h3><blockquote><p>「二十四人の長老は、<strong>玉座に着いておられる方</strong>の前にひれ伏して、世々限りなく生きておられる方を礼拝し、自分たちの冠を玉座の前に投げ出して言った」（<a href="https://bibleox.com/ja/jp-ni/otkr/4/#L10">黙. 4:10</a>）</p></blockquote><blockquote><p>「神の御前で、座に着いていた二十四人の長老は、ひれ伏して神を礼拝し」（<a href="https://bibleox.com/ja/jp-ni/otkr/11/#L16">黙. 11:16</a>）</p></blockquote><h3>祭壇</h3><blockquote><p>「また、別の天使が来て、手に金の香炉を持って<strong>祭壇</strong>のそばに立つと、この天使に多くの香が渡された。すべての聖なる者たちの祈りに添えて、<strong>玉座の前</strong>にある金の<strong>祭壇</strong>に献げるためである」（<a href="https://bibleox.com/ja/jp-ni/otkr/8/#L3">黙. 8:3</a>）</p></blockquote><blockquote><p>「それから、天使が香炉を取り、それに<strong>祭壇</strong>の火を満たして地上へ投げつけると、雷、さまざまな音、稲妻、地震が起こった」（<a href="https://bibleox.com/ja/jp-ni/otkr/8/#L5">黙. 8:5</a>）</p></blockquote><blockquote><p>「第六の天使がラッパを吹いた。すると、神の御前にある金の<strong>祭壇</strong>の四本の角から一つの声が聞こえた」（<a href="https://bibleox.com/ja/jp-ni/otkr/9/#L13">黙. 9:13</a>）</p></blockquote><h3>七枝の燭台</h3><blockquote><p>「玉座からは、稲妻、さまざまな音、雷が起こった。また、<strong>玉座の前には、七つのともし火が燃えていた</strong>。これは神の七つの霊である」（<a href="https://bibleox.com/ja/jp-ni/otkr/4/#L5">黙. 4:5</a>）</p></blockquote><h3>香をたくこと</h3><blockquote><p>「また、別の天使が来て、手に<strong>金の香炉</strong>を持って祭壇のそばに立つと、この天使に<strong>多くの香</strong>が渡された。すべての聖なる者たちの祈りに添えて、玉座の前にある金の祭壇に献げるためである。&lt;…&gt; それから、<strong>天使が香炉を取り</strong>、それに祭壇の火を満たして地上へ投げつけると、雷、さまざまな音、稲妻、地震が起こった」（<a href="https://bibleox.com/ja/jp-ni/otkr/8/#L3,5">黙. 8:3,5</a>）</p></blockquote><h3>天の現実の象徴としての神殿についてのリヨンのエイレナイオス（2世紀）の言葉</h3><p>神殿が天の現実の象徴として整えられていることを、リヨンの聖エイレナイオス（2世紀）が確証しています。エイレナイオスは神学者ヨハネの黙示録を引き、地上のものが、神によって造られた天のものの象徴であるのはふさわしいことだと述べています。</p><blockquote><p><em>このように、神はこれら［の奉仕］を必要とされないが、わたしたちが実を結ばない者とならないよう、わたしたち自身の益のためにそれを行うことを望まれる。同じように御言葉も、民が神に仕えることを学ぶために、御自分はそれを必要とされないにもかかわらず、献げ物をささげることについての掟そのものを民にお与えになった。それゆえ、</em><strong><em>わたしたちもまた、祭壇に供え物を</em></strong><em>たびたび、絶え間なく</em><strong><em>ささげること</em></strong><em>が、神の御心なのである。</em></p><p><strong><em><mark>祭壇は天にある</mark></em></strong><em>（わたしたちの祈りと献げ物はそこへ向けられているからである）。</em><strong><em><mark>神殿もまた</mark></em></strong><em>［そこにある］。ヨハネが黙示録で「天にある神の神殿が開かれた」（</em>黙. 11:19<em>）と言っているとおりである。幕屋もまた［そこにある］。「見よ、神の幕屋が人の間にあって、神が人と共に住む」（</em>黙. 21:3<em>）と言われているからである。さて、民は贈り物、献げ物、すべてのいけにえを、型として受けた。それは山でモーセに示されたとおりであり、唯一同じ神からであって、その御名は今、教会においてすべての民の間で崇められている。しかし、</em><strong><em><mark>わたしたちの周りに広がるあの地上のものが、天のものの型であることはふさわしい</mark></em></strong><em>。ただし、［どちらも］同じ神によって造られたものである。</em><strong><em>なぜなら、ほかのどのような方法でも、神は霊的なものの似姿を［わたしたちの理解に合わせて］示すことができなかったからである</em></strong><em>。</em></p></blockquote><p>（<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b4/">『異端反駁』第4巻、18-19章</a>、英語。英訳からの訳）</p><h2>神は神殿を敬うよう命じられた</h2><p>神殿は<a href="https://bibleox.com/ja/ja/w/Th4h_教会堂天の現実の象徴/">天の現実の象徴</a>です。神はこの象徴を敬うよう命じられました。</p><blockquote><p>「わたしの安息日を守り、<strong>わたしの聖所を敬いなさい</strong>。わたしは主である」（<a href="https://bibleox.com/ja/jp-ni/lev/19/#L30">レビ. 19:30</a>）</p></blockquote><blockquote><p>「あなたたちはわたしの安息の日を守り、<strong>わたしの聖所を敬いなさい</strong>。わたしは主である」（<a href="https://bibleox.com/ja/jp-ni/lev/26/#L2">レビ. 26:2</a>）</p></blockquote><p>新約の教会堂は、神学者ヨハネの黙示録に示された姿に倣って整えられています。</p>
