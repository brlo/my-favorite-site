    path: Ig1F_フィラデルフィアの教会への手紙
    title: フィラデルフィアの教会への手紙
    meta_desc: アンティオキアの聖イグナティオス（テオフォロス）がフィラデルフィアの教会に宛てた手紙。ギリシア語原文からの翻訳と注。
    menu: { parent: "手紙", title: "フィラデルフィアの教会への手紙", priority: 7 }
    body: |-
      <h2>0</h2><p>イグナティオス、またの名をテオフォロス[1]より、アジアのフィラデルフィアにある、父なる神と主イエス・キリストの教会へ。憐れみを受け、神との一致のうちに堅く据えられ、私たちの主の受難を分け隔てなく喜び、その復活によってあらゆる憐れみのうちに確信に満たされている教会へ。私はこの教会に、イエス・キリストの血のうちに挨拶を送ります[2]。この血は永遠の、変わることのない喜びです。とりわけ、人々が主教と、主教と共にいる司祭たちと輔祭たち、すなわちイエス・キリストの御心に従って任じられた人々と一つであるならば、そうです。この人々を、主は御自分の意志によって、聖霊のうちに堅く立てられたのです。</p>
      <h2>1</h2><p>1. 私の知るところでは、あなたがたの主教は、共同体に属する奉仕の務めを、自分自身から得たのでも、人間を通して得たのでもなく[3]、虚栄によって得たのでもなく、父なる神と主イエス・キリストの愛のうちに得たのです。私は彼の寛容さに心を打たれました。彼は沈黙していながら、むなしいことを語る者たちよりも多くのことをなしうるのです。</p><p>2. 彼は竪琴が弦と合わさるように、掟と調和しています。それゆえ私の魂は、神へと向かう彼の思いを幸いなものとたたえます。私は、その思いが徳にあふれ完全なものであることを知りました。生ける神のあらゆる寛容のうちにある、彼の揺るがなさと、怒ることのない穏やかさを知ったのです。</p>
      <h2>2</h2><p>1. ですから、真理の光の子たちよ、分裂と悪い教えを避けなさい。羊飼いのいる所に、羊のようについて行きなさい。</p><p>2. 信用できそうな多くの狼たちが[4]、悪い快楽によって、神へと向かって走る人々を虜にしようとしています。しかし、あなたがたが一致しているなら、彼らのつけ入る余地はありません。</p>
      <h2>3</h2><p>1. 悪い草を避けなさい。それはイエス・キリストが育てないものです。それらは父が植えられたものではないからです[5]。私があなたがたの間に分裂を見いだしたというのではありません。むしろ、ふるい分けによる清めを見いだしたのです[6]。</p><p>2. 神のもの、イエス・キリストのものである人々は皆、主教と共にいます。悔い改めて教会の一致に戻ってくる人々も、神のものとなり、イエス・キリストに従って生きる者となるでしょう。</p><p>3. 私の兄弟たち、思い違いをしてはなりません。分裂を起こす者に従う者は、神の国を受け継ぐことができません[7]。異なる考えに従って歩む者は、（キリストの）受難にあずかろうとしていないのです[8]。</p>
      <h2>4</h2><p>ですから、一つの聖体（エウカリスティア）にあずかるよう努めなさい。私たちの主イエス・キリストの肉は一つであり、その血による一致のための杯も一つ[9]、祭壇も一つです。同じように、主教も一人であって、司祭団と、私の同労のしもべである輔祭たちと共にいます。それは、あなたがたが何を行うにしても、神に従って行うためです。</p>
      <h2>5</h2><p>1. 私の兄弟たち、私はあなたがたを愛するあまり、心のすべてを注ぎ出しています。大いに喜びながら、あなたがたを守ろうとしています。しかし、それは私ではなく、イエス・キリストがなさるのです。私はこの方のうちに縛られていますが、まだ完成されていない者として[10]、いっそう恐れています。しかし、あなたがたの祈りが、私を神のもとで完全な者としてくれるでしょう。それは、私が憐れみによって与えられた分け前に到達するためです。私は、イエスの肉に寄りすがるように福音に、教会の司祭団に寄りすがるように使徒たちに寄りすがっています[11]。</p><p>2. 私たちは預言者たちも愛しましょう。彼らも福音に向けて告げ知らせ、この方に希望を置き、この方を待ち望んでいたからです[12]。彼らはこの方を信じて救われ、イエス・キリストとの一致のうちにありました。彼らは愛すべき、驚嘆すべき聖なる人々であり、イエス・キリストから証しを受け、共通の希望である福音のうちに数えられています。</p>
      <h2>6</h2><p>1. もしだれかがあなたがたにユダヤ教を説き明かすなら、その人の言うことを聞いてはなりません。割礼を受けていない人からユダヤ教を聞くよりは、割礼を受けた人からキリスト教を聞くほうがよいのです。しかし、もしどちらもイエス・キリストについて語らないなら、彼らは私にとって墓碑であり、死者の墓であって、その上にはただ人間の名が刻まれているにすぎません。</p><p>2. ですから、この世の支配者の悪だくみと罠を避けなさい。彼の考えに苦しめられて、愛のうちに弱ることのないためです。むしろ、皆が分かたれない心で共に集まりなさい。</p><p>3. 私は自分の神に感謝しています。私はあなたがたに対してやましいところがなく、私が小さなことでも大きなことでも、だれかに重荷を負わせたと、ひそかにであれ公然とであれ、誇れる人はだれもいないからです[13]。私が語りかけたすべての人々について、私の言葉が彼らにとって不利な証しとならないよう祈っています[14]。</p>
      <h2>7</h2><p>1. ある人々が肉に従って私を欺こうとしたとしても、霊は神から出たものなので欺かれることがありません。霊はどこから来てどこへ行くかを知っており[15]、隠れたことをあらわにするのです[16]。私はあなたがたの間にいたとき叫びました。大きな声で、神の声で語りました。「主教と司祭団と輔祭たちに心を向けなさい」と。</p><p>2. ある人々は、私がある人たちの分裂をあらかじめ知っていて、こう言ったのだと疑いました。しかし、私がその方のために縛られているその方が、私の証人です。私は人間の肉からそれを知ったのではありません。霊が告げ知らせて、こう言ったのです。「主教を抜きにして何も行ってはならない。あなたがたの肉を神の神殿として守りなさい[17]。一致を愛しなさい。分裂を避けなさい。イエス・キリストが御自分の父に倣ったように、あなたがたもイエス・キリストに倣う者となりなさい」と。</p>
      <h2>8</h2><p>1. ですから私は、一致のために整えられた人間として、自分の務めを果たしました。分裂と怒りのある所に、神は住まわれません。しかし、悔い改めるすべての人を主は赦されます。もし彼らが神の一致へと、主教の会議へと立ち帰るならです。私はイエス・キリストの恵みを信じています。この方は、あなたがたからあらゆる縄目を解いてくださるでしょう。</p><p>2. あなたがたに勧めます。何事も党派心からではなく[18]、キリストに学んだことに従って行いなさい。私はある人々がこう言うのを聞きました。「もし古い記録[19]の中に見いださないなら、福音においても信じない」と。そこで私が「それは書かれている」と言うと、彼らは「それこそ証明を要することだ」[20]と答えました。しかし私にとっての古い記録は、イエス・キリストです。侵すことのできない記録とは、この方の十字架と死と復活、そしてこの方による信仰です[21]。これらのうちに、あなたがたの祈りによって、私は義とされたいのです。</p>
      <h2>9</h2><p>1. 祭司たちもよいものです。しかし、至聖所を委ねられた大祭司はさらにまさっています[22]。この方だけが神の隠されたことを委ねられているのです。この方こそ父の門であり[23]、アブラハム、イサク、ヤコブも、預言者たちも、使徒たちも、教会も、この門を通って入るのです。これらすべては神の一致へと向かっています。</p><p>2. しかし福音には、何か格別なものがあります。それは救い主、私たちの主イエス・キリストの来臨、その受難と復活です。愛すべき預言者たちはこの方を告げ知らせましたが、福音は不朽の完成なのです。あなたがたが愛のうちに信じるなら、これらはすべて共によいものです。</p>
      <h2>10</h2><p>1. あなたがたの祈りと、キリスト・イエスにあってあなたがたが抱いている深い憐れみによって、シリアのアンティオキアの教会が平和を得たことが、私に知らされました。ですから、神の教会であるあなたがたは、輔祭を一人選んで[24]、神の使節としてそこへ遣わし、共に集まった人々と一緒に喜び、御名をたたえさせるのがふさわしいのです。</p><p>2. このような奉仕にふさわしい者とされる人は、イエス・キリストにあって幸いです。あなたがたも栄光を受けるでしょう。</p><p>3. もしあなたがたが望むなら、神の名のためにこれを行うことは不可能ではありません。すでに最も近くの諸教会は主教たちを、ほかの教会は司祭たちや輔祭たちを遣わしたのです。</p>
      <h2>11</h2><p>1. キリキアの輔祭フィロンについて言えば、彼は評判のよい人で、今も神の言葉のうちに、選ばれた人レオス・アガトプスと共に私に仕えてくれています。アガトプスはこの世の生活を捨てて、シリアから私について来たのです。彼らはあなたがたについても証ししています。私も、あなたがたが彼らを迎えてくれたことについて、主があなたがたを迎えてくださったように、あなたがたのために神に感謝しています。しかし、彼らを侮った人々は、イエス・キリストの恵みのうちに贖われますように。</p><p>2. トロアスにいる兄弟たちの愛が、あなたがたに挨拶を送ります。私はそのトロアスから、ブッロスに託してあなたがたにこの手紙を書いています。ブッロスは、誉れのしるしとして、エフェソとスミルナの人々から私と共に遣わされた人です。主イエス・キリストが彼らを重んじてくださいますように。彼らは肉において、魂において、霊において[25]、信仰と愛と一致のうちに、この方に希望を置いています。私たちの共通の希望であるキリスト・イエスのうちに、お元気で。</p>
    references: |-
      <ol><li><p>イグナティオスはスミルナを発ってトロアスに着き、そこから、途中で通過してきたリディアのフィラデルフィア（<a href="https://bibleox.com/ja/jp-ni/otkr/3/#L7">黙. 3:7</a> 参照）の教会にこの手紙を書きました（<a href="#HH-11">11:2</a>）。主教への従順と分裂を避けること（1–4章）、福音にユダヤ教を混ぜないこと（5–9章）を勧め、平和を取り戻したアンティオキアへ使者を送るよう頼んでいます（10–11章）。</p></li><li><p>キリストの血のうちに、すなわち、御自分の血によって私たちを贖い、愛の絆で結び合わせたキリストのうちに、の意。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/gal/1/#L1">ガラ. 1:1</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/mf/7/#L15">マタ. 7:15</a>、<a href="https://bibleox.com/ja/jp-ni/in/10/#L12">ヨハ. 10:12</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/mf/15/#L13">マタ. 15:13</a>、<a href="https://bibleox.com/ja/ja/w/Ig1T_トラレスの教会への手紙#HH-11">『トラレスの教会への手紙』11:1</a> 参照。</p></li><li><p>ἀποδιϋλισμός —「濾し分けること」。偽りの教えに従う人々が離れていったことを、教会が異質な雑草からふるい清められたことと見ています。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/1kor/6/#L9-10">１コリ. 6:9-10</a>、<a href="https://bibleox.com/ja/ja/w/Ig1E_エフェソの教会への手紙#HH-16">『エフェソの教会への手紙』16:1</a> 参照。</p></li><li><p>キリストは御自分の受難によって教会を建てられたので、教会の一致を壊す者はその受難に背いている、の意。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/1kor/10/#L16-17">１コリ. 10:16-17</a> 参照。</p></li><li><p>ἀναπάρτιστος —「まだ完成されていない」。長い校訂本や古いラテン語訳、アルメニア語訳に基づく読み方です。</p></li><li><p>福音にはキリスト御自身が肉において臨在しておられるかのように、使徒たちは今も教会の司祭団として生きているかのように、それに寄りすがる、の意。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/lk/24/#L25-27">ルカ. 24:25-27</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/2kor/11/#L9">２コリ. 11:9</a>、<a href="https://bibleox.com/ja/jp-ni/2kor/12/#L13">２コリ. 12:13</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/ja/w/Ig1T_トラレスの教会への手紙#HH-12">『トラレスの教会への手紙』12:3</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/in/3/#L8">ヨハ. 3:8</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/1kor/2/#L10">１コリ. 2:10</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/1kor/3/#L16-17">１コリ. 3:16-17</a>、<a href="https://bibleox.com/ja/jp-ni/1kor/6/#L19">6:19</a> 参照。</p></li><li><p>κατ᾽ ἐριθείαν —「党派心から」。<a href="https://bibleox.com/ja/jp-ni/fil/2/#L3">フィリ. 2:3</a> 参照。</p></li><li><p>ἀρχεῖα —「記録、公文書」。ここでは旧約聖書のことです。ユダヤ教の影響を受けた人々は、キリストの誕生と受難についての福音の真理を、古い預言から証明するよう求めていました。</p></li><li><p>πρόκειται —「それこそが問題だ、証明を要することだ」。</p></li><li><p>キリストによってもたらされた信仰、すなわちキリストの教え。</p></li><li><p>祭司たちは旧約の祭司、大祭司はキリストを指します（<a href="https://bibleox.com/ja/jp-ni/evr/4/#L14">ヘブ. 4:14</a>、<a href="https://bibleox.com/ja/jp-ni/evr/9/#L7">ヘブ. 9:7</a> 参照）。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/in/10/#L7">ヨハ. 10:7</a>、<a href="https://bibleox.com/ja/jp-ni/in/10/#L9">10:9</a> 参照。</p></li><li><p>χειροτονῆσαι — 原義は「手を挙げて（選ぶ）」。ここでは共同体が使者を選ぶことを言っています。後にこの語は叙聖（按手）を表す教会用語となりました。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/1sol/5/#L23">１テサ. 5:23</a> 参照。</p></li></ol>
      <p>翻訳：ロジオン・ヴラソフ（AIツールを併用）。底本：ギリシア語本文（<a href="https://bibleox.com/ja/grc/w/ΙγνΘ_Φιλ">本サイトのギリシア語版</a>。明らかな脱落はライトフット版・ホームズ版で補った）。参照：ロシア語訳（『初期教会教父選集』ブリュッセル、1988年）、英訳（Roberts–Donaldson）、仏訳（Genoude、1837年）。聖書の引用は新共同訳による。</p>
