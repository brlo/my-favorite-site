  - src: Христос-титулы
    path: Ub5c_キリストの称号
    title: キリストの称号
    meta_desc: イエス・キリストの称号を示す聖書の引用
    menu: { parent: "神/子", title: "キリストの称号", priority: 15 }
    body: |-
      <p>イスラム教徒にとって重要なのは、聖書が、イスラム教では明らかに神だけに帰せられる多くの称号を、キリストに帰していることです。創造者、聖なる者、王の王、最初の者、変わらない者、力ある者などです。</p><ul><li><p><strong>創造者</strong>（ハーリク、ٱلْخَـٰلِقُ） – <a href="https://bibleox.com/ja/jp-ni/in/1/#L3,10">ヨハ. 1:3,10</a>; <a href="https://bibleox.com/ja/jp-ni/evr/1/#L1-2">ヘブ. 1:1-2</a>; <a href="https://bibleox.com/ja/jp-ni/evr/11/#L3">ヘブ. 11:3</a>; <a href="https://bibleox.com/ja/jp-ni/evr/1/#L8-12">ヘブ. 1:8-12</a>; <a href="https://bibleox.com/ja/jp-ni/kol/1/#L13-17">コロ. 1:13-17</a>;</p></li></ul><ul><li><p><strong>王の王</strong>（マーリク・アル＝ムルク、مالك الملك） – <a href="https://bibleox.com/ja/jp-ni/otkr/17/#L14">黙. 17:14</a>; <a href="https://bibleox.com/ja/jp-ni/otkr/19/#L16">黙. 19:16</a>;</p></li></ul><ul><li><p>支配する者（カッハール、ٱلْقَهَّـٰرُ） – <a href="https://bibleox.com/ja/jp-ni/otkr/17/#L14">黙. 17:14</a>; <a href="https://bibleox.com/ja/jp-ni/otkr/19/#L16">黙. 19:16</a>;</p></li></ul><ul><li><p><strong>聖なる者</strong>（クッドゥース、ٱلْقُدُّوسُ） – <a href="https://bibleox.com/ja/jp-ni/otkr/3/#L7">黙. 3:7</a>; <a href="https://bibleox.com/ja/jp-ni/otkr/6/#L10">6:10</a>; <a href="https://bibleox.com/ja/jp-ni/evr/7/#L26">ヘブ. 7:26</a>; <a href="https://bibleox.com/ja/jp-ni/act/3/#L14">使. 3:14</a>;</p></li></ul><ul><li><p>柔和な者（ハリーム、ٱلْحَلِيمُ） – <a href="https://bibleox.com/ja/jp-ni/ier/11/#L19">エレ. 11:19</a>; <a href="https://bibleox.com/ja/jp-ni/mf/11/#L29">マタ. 11:29</a>; <a href="https://bibleox.com/ja/jp-ni/mf/21/#L5">マタ. 21:5</a>;</p></li></ul><ul><li><p>初め、<strong>最初の者</strong>（アウワル、الأول） – <a href="https://bibleox.com/ja/jp-ni/in/1/#L1-3">ヨハ. 1:1-3</a>; <a href="https://bibleox.com/ja/jp-ni/otkr/1/#L17">黙. 1:17</a>; <a href="https://bibleox.com/ja/jp-ni/otkr/2/#L8">黙. 2:8</a>; <a href="https://bibleox.com/ja/jp-ni/otkr/22/#L13">黙. 22:13</a>;</p></li></ul><ul><li><p>終わり、最後の者（アーヒル、الأخر） – <a href="https://bibleox.com/ja/jp-ni/otkr/1/#L17">黙. 1:17</a>; <a href="https://bibleox.com/ja/jp-ni/otkr/2/#L8">黙. 2:8</a>; <a href="https://bibleox.com/ja/jp-ni/otkr/22/#L13">黙. 22:13</a>;</p></li></ul><ul><li><p><strong>変わらない者</strong>（サマド、الصمد） – <a href="https://bibleox.com/ja/jp-ni/evr/13/#L8">ヘブ. 13:8</a>; <a href="https://bibleox.com/ja/jp-ni/evr/1/#L10-12">ヘブ. 1:10-12</a>;</p></li></ul><ul><li><p>生きている者（ハイイ、الحي） – <a href="https://bibleox.com/ja/jp-ni/otkr/1/#L18">黙. 1:18</a>; <a href="https://bibleox.com/ja/jp-ni/act/3/#L15">使. 3:15</a>;</p></li></ul><ul><li><p>救い主（ムハイミン、ٱلْمُهَيْمِنُ） – <a href="https://bibleox.com/ja/jp-ni/in/4/#L42">ヨハ. 4:42</a>; <a href="https://bibleox.com/ja/jp-ni/lk/1/#L47">ルカ. 1:47</a>; <a href="https://bibleox.com/ja/jp-ni/lk/2/#L11">ルカ. 2:11</a>; <a href="https://bibleox.com/ja/jp-ni/act/5/#L31">使. 5:31</a>; <a href="https://bibleox.com/ja/jp-ni/act/13/#L23">使. 13:23</a>; <a href="https://bibleox.com/ja/jp-ni/ef/5/#L23">エフェ. 5:23</a>; <a href="https://bibleox.com/ja/jp-ni/fil/3/#L20">フィリ. 3:20</a>; <a href="https://bibleox.com/ja/jp-ni/1tim/1/#L1">１テモ. 1:1</a>; <a href="https://bibleox.com/ja/jp-ni/2tim/1/#L10">２テモ. 1:10</a>; <a href="https://bibleox.com/ja/jp-ni/tit/1/#L4">テト. 1:4</a>; <a href="https://bibleox.com/ja/jp-ni/tit/2/#L13">テト. 2:13</a>; <a href="https://bibleox.com/ja/jp-ni/tit/3/#L6">テト. 3:6</a>; <a href="https://bibleox.com/ja/jp-ni/2pet/1/#L1">２ペト. 1:1</a>; <a href="https://bibleox.com/ja/jp-ni/2pet/1/#L11">２ペト. 1:11</a>; <a href="https://bibleox.com/ja/jp-ni/2pet/2/#L20">２ペト. 2:20</a>; <a href="https://bibleox.com/ja/jp-ni/2pet/3/#L18">２ペト. 3:18</a>; <a href="https://bibleox.com/ja/jp-ni/1in/4/#L14">１ヨハ. 4:14</a>;</p></li></ul><ul><li><p>光（ヌール、النور） – <a href="https://bibleox.com/ja/jp-ni/in/1/#L9">ヨハ. 1:9</a>; <a href="https://bibleox.com/ja/jp-ni/in/12/#L46">ヨハ. 12:46</a>; <a href="https://bibleox.com/ja/jp-ni/in/12/#L35-36">ヨハ. 12:35-36</a>;</p></li></ul><ul><li><p>相続者（ワーリス、الوارث） – <a href="https://bibleox.com/ja/jp-ni/evr/1/#L2">ヘブ. 1:2</a>; <a href="https://bibleox.com/ja/jp-ni/mf/21/#L38">マタ. 21:38</a>; <a href="https://bibleox.com/ja/jp-ni/2tim/4/#L1">２テモ. 4:1</a>; <a href="https://bibleox.com/ja/jp-ni/2pet/1/#L11">２ペト. 1:11</a>; <a href="https://bibleox.com/ja/jp-ni/rim/8/#L17">ロマ. 8:17</a>;</p></li></ul><ul><li><p>真理（ハック、الحق） – <a href="https://bibleox.com/ja/jp-ni/in/14/#L6">ヨハ. 14:6</a>; <a href="https://bibleox.com/ja/jp-ni/otkr/3/#L7">黙. 3:7</a>;</p></li></ul><ul><li><p>開く者（ファッターフ、ٱلْفَتَّاحُ） – <a href="https://bibleox.com/ja/jp-ni/otkr/3/#L7-8">黙. 3:7-8</a>;</p></li></ul><ul><li><p>よみがえらせる者（バーイス、ٱلْبَاعِثُ） – <a href="https://bibleox.com/ja/jp-ni/in/5/#L21">ヨハ. 5:21</a>; <a href="https://bibleox.com/ja/jp-ni/in/6/#L54">ヨハ. 6:54</a>;</p></li></ul><ul><li><p><strong>力ある者</strong>（ジャッバール、ٱلْجَبَّارُ） – <a href="https://bibleox.com/ja/jp-ni/evr/1/#L3">ヘブ. 1:3</a>; <a href="https://bibleox.com/ja/jp-ni/otkr/1/#L8">黙. 1:8</a>; <a href="https://bibleox.com/ja/jp-ni/mf/28/#L18">マタ. 28:18</a>.</p></li></ul>

  - src: Христос-не-архангел-Михаил
    path: Va9h_キリストは大天使ミカエルではない
    title: キリストは大天使ミカエルではない
    meta_desc: 全体主義的な宗派「エホバの証人」の教えへの反論
    menu: { parent: "神/子", title: "キリストは大天使ミカエルではない", priority: 16 }
    body: |-
      <h2>序</h2><p>まず説明しておかなければならないのは、この意見（キリストは大天使ミカエルであるという意見）が、全体主義的な宗派「<a href="https://ja.wikipedia.org/wiki/エホバの証人">エホバの証人</a>」の中にあるということです。エホバの証人は自分たちの教えを裏付けるために、大きな歪曲を含む独自の聖書翻訳を作りました（<a href="https://azbyka.ru/otechnik/sekty/rassuzhdaja-so-svideteljami-iegovy-pri-pomoshhi-pisanija/4_7"><em>エホバの証人の「新世界訳」についての専門家の評価</em></a>、ロシア語）。セブンスデー・アドベンチストもまた、旧約聖書に大天使ミカエルとして現れる者は神の子イエス・キリストであると考えています。</p><h2>「天使」という言葉の二つの意味</h2><p>聖書の中には、<em>天使</em>という言葉の二つの意味が見られます。働きと本性です。</p><p>天使の<strong>働き</strong>とは、遣わされることです。この古代ギリシア語の語は文字どおりそういう意味だからです。ἄγγελος［アンゲロス］— 使者、知らせを伝える者。ヘブライ語 ‏מלאך‏‎ — 使者。</p><p>天使の<strong>本性</strong>とは、体のない霊です。天使とは、神によって造られた、体を持たない（無形の）霊的な存在、言い換えれば霊です。これらの霊は人間より前に造られ、自由と理性を与えられました。その中のある者たちは神に従って生きることを望まず、神から離れましたが、それでも天使と呼ばれています（<a href="https://bibleox.com/ja/jp-ni/mf/25/#L41">マタ. 25:41</a>）。つまり、働きの種類にかかわらない本性があるのです。遣わされていてもいなくても、天使は天使です。それが本性です。こうして、人から生まれたまったく具体的な人間、すなわち預言者洗礼者ヨハネが天使と呼ばれています（<a href="https://bibleox.com/ja/jp-ni/mal/3/#L1">マラ. 3:1</a>; <a href="https://bibleox.com/ja/jp-ni/mf/11/#L10">マタ. 11:10</a>; <a href="https://bibleox.com/ja/jp-ni/mk/1/#L2">マコ. 1:2</a>; <a href="https://bibleox.com/ja/jp-ni/lk/7/#L27">ルカ. 7:27</a>）。同じ意味で、同じ箇所で、キリスト御自身が契約の天使と呼ばれています（<a href="https://bibleox.com/ja/jp-ni/mal/3/#L1">マラ. 3:1</a>）。<em>（新共同訳はこの語を「使者」と訳しています。「見よ、わたしは使者を送る」「契約の使者」。しかしギリシア語本文では、どちらの箇所にも ἄγγελος が用いられています。τὸν ἄγγελόν μου —「わたしの天使」、ὁ ἄγγελος τῆς διαθήκης —「契約の天使」<a href="https://bibleox.com/ja/gr-lxx-byz/mal/3/#L1">マラ. 3:1、七十人訳</a>。）</em>これで決着がつきます。では、引用に移りましょう。</p><h2>天使は皆、仕える霊であるが、キリストは玉座に着いておられる</h2><p>使徒パウロは、神の子を天使たちよりはるかに優れた方と呼んでいます（<a href="https://bibleox.com/ja/jp-ni/evr/1/#L4">ヘブ. 1:4</a>）。神は御子に語りかけるようには天使たちに語りかけないからです（<a href="https://bibleox.com/ja/jp-ni/evr/1/#L5">ヘブ. 1:5</a>）。天使たちは皆、神の子を礼拝します（<a href="https://bibleox.com/ja/jp-ni/evr/1/#L6">ヘブ. 1:6</a>）。パウロは、天使たちについての神の言葉と神の子についての神の言葉の違いを指摘しています。前者は仕える者であり、後者は玉座に着いている支配者です（<a href="https://bibleox.com/ja/jp-ni/evr/1/#L7-8">ヘブ. 1:7-8</a>、<a href="https://bibleox.com/ja/jp-ni/evr/1/#L13">ヘブ. 1:13</a>）。また、造られたものはすべて一時的であるが、すべてを造られた神の子は決して過ぎ去らないことを指摘しています（<a href="https://bibleox.com/ja/jp-ni/evr/1/#L10-12">ヘブ. 1:10-12</a>）。そしてついに、天使たちは例外なく皆仕える霊であるが、御子は父と共に玉座に着いておられると、はっきり述べられています。</p><blockquote><p>「<strong>神は、かつて天使のだれに向かって</strong>、『わたしがあなたの敵をあなたの足台とするまで、<strong>わたしの右に座っていなさい</strong>』と言われたことがあるでしょうか。<strong>天使たちは皆、奉仕する霊</strong>であって、救いを受け継ぐことになっている人々に仕えるために、遣わされたのではなかったですか」（<a href="https://bibleox.com/ja/jp-ni/evr/1/#L13-14">ヘブ. 1:13-14</a>）</p></blockquote><p>御子は仕えられる方であり、御子は父と共に治めておられます。</p><h2>人類は神の前にひざまずくが、すべての被造物はキリストの前にひざまずく</h2><p>神は、すべてのひざは御自分の前にかがむと言われます（<a href="https://bibleox.com/ja/jp-ni/rim/14/#L11">ロマ. 14:11</a>）。それと同時に、人間だけでなく、すべての被造物がキリストの前にひざまずきます（<a href="https://bibleox.com/ja/jp-ni/fil/2/#L10">フィリ. 2:10</a>）。天使たちも同様です（<a href="https://bibleox.com/ja/jp-ni/evr/1/#L6">ヘブ. 1:6</a>）。</p><h2>世界は天使にではなく、キリストに従わされている</h2><blockquote><p>「<strong>神は、わたしたちが語っている来るべき世界を、天使たちに従わせるようなことはなさらなかった</strong>のです」（<a href="https://bibleox.com/ja/jp-ni/evr/2/#L5">ヘブ. 2:5</a>）</p></blockquote><p>しかし、世界はキリストに従わされています。</p><blockquote><p>「『神は、すべてをその足の下に服従させた』からです」（<a href="https://bibleox.com/ja/jp-ni/1kor/15/#L27">１コリ. 15:27</a>）</p></blockquote><blockquote><p>「神はまた、すべてのものをキリストの足もとに従わせ、キリストをすべてのものの上にある頭として教会にお与えになりました」（<a href="https://bibleox.com/ja/jp-ni/ef/1/#L22">エフェ. 1:22</a>）</p></blockquote><blockquote><p>「すべてのものを、その足の下に従わせられました。」「すべてのものを彼に従わせられた」と言われている以上、この方に従わないものは何も残っていないはずです」（<a href="https://bibleox.com/ja/jp-ni/evr/2/#L8">ヘブ. 2:8</a>）</p></blockquote><h2>全能者、王の王、主の主</h2><p>こうして、天使たちは皆仕える霊であるのに対し、神の子イエス・キリストは、神が繰り返し呼ばれているのと同じ名、すなわち全能者、王の王、主の主と呼ばれていることが確かめられました。預言者たちは<strong>神</strong>を主の主と呼んでいます（<a href="https://bibleox.com/ja/jp-ni/ps/136/#L2-3">詩. 136:2-3</a>）。使徒たちは<strong>神</strong>を主の主、王の王と呼んでいます（<a href="https://bibleox.com/ja/jp-ni/1tim/6/#L15-16">１テモ. 6:15-16</a>）。使徒たちは<strong>イエス・キリスト</strong>を主の主、王の王（<a href="https://bibleox.com/ja/jp-ni/otkr/17/#L14">黙. 17:14</a>; <a href="https://bibleox.com/ja/jp-ni/otkr/19/#L16">19:16</a>）、また全能者（<a href="https://bibleox.com/ja/jp-ni/otkr/1/#L8">黙. 1:8</a>）と呼んでいます。王の王の上にほかの王はいません。主の主の上にほかの主はいません。全能者の上に、全能者を支える者はいません。この方御自身がすべてを支えておられるからです。大天使ミカエルは天使の軍勢の長です。キリストは、天使たちも大天使ミカエル自身も含めて、世界のまさにすべてのものの長です。</p><h2>神（ヤハウェ）は御自身で預言者たちを遣わされたが、キリストは、遣わしたのは御自分だと言われる</h2><p>重要なのは、キリストが、イスラエルに多くの預言者を遣わしたのは御自分だと指摘しておられることです（<a href="https://bibleox.com/ja/jp-ni/mf/23/#L34">マタ. 23:34</a>）。そして聖書は、預言者たちに語り、彼らをイスラエルに遣わしたのは、天使を通してではなく、神御自身であったと告げています（<a href="https://bibleox.com/ja/jp-ni/ish/3/#L12">出. 3:12</a>; <a href="https://bibleox.com/ja/jp-ni/mal/3/#L19,23">マラ. 3:19,23</a>; <a href="https://bibleox.com/ja/jp-ni/sud/6/#L8">士. 6:8</a>; <a href="https://bibleox.com/ja/jp-ni/2par/25/#L15">代下. 25:15</a>; <a href="https://bibleox.com/ja/jp-ni/1ts/15/#L1">サム上. 15:1</a>; <a href="https://bibleox.com/ja/jp-ni/2ts/12/#L1">サム下. 12:1</a>; <a href="https://bibleox.com/ja/jp-ni/2ts/12/#L24-25">サム下. 12:24-25</a>; <a href="https://bibleox.com/ja/jp-ni/3ezd/1/#L32">３エズ. 1:32</a>）。つまり、キリストは神、ヤハウェなのです。神が預言者たちと交わるとき、仲介者はいませんでした。</p><h2>父から生まれた神の子が、天使たちを造られた</h2><p>キリストは、天使たちも含めて、見えるものと見えないものすべての創造主です（<a href="https://bibleox.com/ja/jp-ni/kol/1/#L13-17">コロ. 1:13-17</a>）。つまり、もしキリストが天使であったなら、御自分をも造らなければならなかったことになります。</p><h2>「ミカエル」という名の語源</h2><p>ミカエルはヘブライ語の名で、ヘブライ語の ‏מי כמו אלוהים‏‎（ミ・クモ・エロヒム、縮めて「ミ・カ・エル」）から来ており、文字どおりには「誰が神のようであろうか」という意味です。つまり、誰も神と等しくはなく、誰も神と比べることはできないということです。しかしキリストは、神と等しい方でありながら、神の身分におられます（<a href="https://bibleox.com/ja/jp-ni/fil/2/#L6">フィリ. 2:6</a>）。</p><h2>旧い契約は天使たちを通して与えられ、新しい契約は主によって宣べ伝えられた</h2><p>使徒パウロは、旧い契約と新しい契約の違いを指摘しています。旧い契約は天使たちを通して与えられ（<a href="https://bibleox.com/ja/jp-ni/evr/2/#L2">ヘブ. 2:2</a>）、新しい契約は主御自身が自ら宣べ伝えられました（<a href="https://bibleox.com/ja/jp-ni/evr/2/#L3">ヘブ. 2:3</a>）。つまり、少なくとも天使たちを通してではありません。</p><h2>人となった神は、御自身を天使たちに示された</h2><blockquote><p>「信心の秘められた真理は確かに偉大です。すなわち、キリストは<strong>肉において現れ</strong>、“霊”において義とされ、<strong>天使たちに見られ</strong><em>（ギリシア語 ὤφθη ἀγγέλοις —「天使たちに現れた」）</em>、異邦人の間で宣べ伝えられ、世界中で信じられ、栄光のうちに上げられた」（<a href="https://bibleox.com/ja/jp-ni/1tim/3/#L16">１テモ. 3:16</a>）</p><p>新共同訳の「キリストは」という語はギリシア語本文にはなく、本文は Ὃς（「その方は」）で、直前の節の「生ける神」を受けています（詳しくは<a href="https://bibleox.com/ja/ja/w/イエス・キリスト__神/">イエス・キリストは神である</a>を参照）。</p></blockquote><p>いまだかつて神を見た者はなく（<a href="https://bibleox.com/ja/jp-ni/in/1/#L18">ヨハ. 1:18</a>）、神は近寄り難い光の中に住まわれ、人は神を見ることができません（<a href="https://bibleox.com/ja/jp-ni/1tim/6/#L16">１テモ. 6:16</a>）。しかし、まことの人として生まれることによって（<a href="https://bibleox.com/ja/jp-ni/in/1/#L14">ヨハ. 1:14</a>）、神はキリストにおいてすべての人に見えるようになられます。人は霊的な世界の住人（天使）を肉の目で見ることはできませんが、キリストは、サタンが天から落ちるのを見ていたと言われます（<a href="https://bibleox.com/ja/jp-ni/lk/10/#L18">ルカ. 10:18</a>）。また、天使たちはさまざまな時に、さまざまな場所で、さまざまな人に現れますが、聖書はこの出来事（天使が現れること自体）に何の意味も持たせていません。つまり、「彼は天使たちに御自身を示した」というようなことは言いません。現れた、それだけです。</p><h2>天使たちは造られたが、神の子は生まれた。しかも単に生まれたのではない。独り子のように父なる神から生まれた者は、ほかに誰もいない</h2><p>神の子は造られたのではなく神から生まれたのであり、造られたものはすべて、その後に御子によって造られたことが示されています（<a href="https://bibleox.com/ja/jp-ni/kol/1/#L15-16">コロ. 1:15-16</a>）。そして神の子は独り子です（<a href="https://bibleox.com/ja/jp-ni/in/1/#L18">ヨハ. 1:18</a>）。つまり、独り子のように父の子である者は、ほかに誰もいないということです。わたしたちは「造られた」と「生まれた」という言葉を区別します。何でも造ることはできますが、生むことができるのは自分と同じもの、同じ本性のものだけです。魚は魚を生み、人は人を生み、神は神を生みます。オリーブの木がオレンジを実らせることはありません。</p><h2>結論</h2><p>キリストは大天使ミカエルではなく、神です。そして繰り返し、はっきりと神と呼ばれています。聖書はそれを明白に述べています：<a href="https://bibleox.com/ja/ja/w/イエス・キリスト__神/">イエス・キリストは神である</a></p><blockquote><p>「<strong>わたしの民よ、聞け</strong>、わたしは語る。イスラエルよ、わたしはお前を告発する。<strong>わたしは神、わたしはお前の神</strong>」（<a href="https://bibleox.com/ja/jp-ni/ps/50/#L7">詩. 50:7</a>）</p></blockquote>

  - src: Христос-жизнь-в-Палестине
    path: Qc1j_キリストパレスチナでの生涯
    title: キリスト — パレスチナでの生涯
    meta_desc: パレスチナにおけるイエス・キリストの生涯についての聖書の引用
    menu: { parent: "神/子", title: "キリスト — パレスチナでの生涯", priority: 17 }
    references: |-
      <p><em>* この記事は、キリストがどこか遠く、インドへ行って知恵を学んだという考えへの反論として重要です。</em></p>
    body: |-
      <h2>イエス・キリストはベツレヘムで生まれる</h2><blockquote><p>「イエスは、ヘロデ王の時代に<strong>ユダヤのベツレヘムでお生まれになった</strong>」（<a href="https://bibleox.com/ja/jp-ni/mf/2/#L1">マタ. 2:1</a>; <a href="https://bibleox.com/ja/jp-ni/lk/2/#L4-7">ルカ. 2:4-7</a>）</p></blockquote><p><em>預言のとおりに：</em><a href="https://bibleox.com/ja/jp-ni/mf/2/#L5"><em>マタ. 2:5</em></a><em>; </em><a href="https://bibleox.com/ja/jp-ni/in/7/#L42"><em>ヨハ. 7:42</em></a><em>; </em><a href="https://bibleox.com/ja/jp-ni/mih/5/#L1"><em>ミカ. 5:1</em></a><em>。</em></p><h2>エジプトへの逃避</h2><p>誕生の後、ヨセフとおとめマリアは幼子イエスをヘロデ王の迫害から隠すために、数年間エジプトへ連れて行きます（<a href="https://bibleox.com/ja/jp-ni/mf/2/#L16">マタ. 2:16</a>）。</p><blockquote><p>「ヨセフは起きて、夜のうちに幼子とその母を連れて<strong>エジプトへ去り、ヘロデが死ぬまでそこにいた</strong>」（<a href="https://bibleox.com/ja/jp-ni/mf/2/#L14-15">マタ. 2:14-15</a>）</p></blockquote><p><em>預言のとおりに：</em><a href="https://bibleox.com/ja/jp-ni/mf/2/#L15"><em>マタ. 2:15</em></a><em>; </em><a href="https://bibleox.com/ja/jp-ni/os/11/#L1"><em>ホセ. 11:1</em></a><em>。</em></p><h2>ナザレへの帰還</h2><p>その後、一家はナザレにあるヨセフの家（<a href="https://bibleox.com/ja/jp-ni/lk/2/#L4">ルカ. 2:4</a>）に戻ります。</p><blockquote><p>「『起きて、子供とその母親を連れ、イスラエルの地に行きなさい。この子の命をねらっていた者どもは、死んでしまった。』そこで、ヨセフは起きて、<strong>幼子とその母を連れて、イスラエルの地へ帰って来た</strong>。&lt;…&gt; <strong>ガリラヤ地方</strong>に引きこもり、<strong>ナザレ</strong>という町に行って住んだ」（<a href="https://bibleox.com/ja/jp-ni/mf/2/#L20-23">マタ. 2:20-23</a>）</p></blockquote><p><em>預言のとおりに：</em><a href="https://bibleox.com/ja/jp-ni/mf/2/#L23"><em>マタ. 2:23</em></a><em>、おそらく：</em><a href="https://bibleox.com/ja/jp-ni/sud/13/#L5"><em>士. 13:5</em></a><em>。</em></p><h2>毎年のエルサレム詣で</h2><p>イエス・キリストは毎年、両親や親類、知人と共にエルサレムの神殿へ行かれました（<a href="https://bibleox.com/ja/jp-ni/lk/2/#L43-44">ルカ. 2:43-44</a>）。</p><blockquote><p>「さて、<strong>両親は過越祭には毎年エルサレムへ旅をした</strong>。イエスが十二歳になったときも、<strong>両親は祭りの慣習に従って都に上った</strong>」（<a href="https://bibleox.com/ja/jp-ni/lk/2/#L41-42">ルカ. 2:41-42</a>）</p></blockquote><p>12歳までに、少年イエスはすでに大きな知恵を持っておられ、エルサレムの神殿の教師たちを驚かせました。</p><blockquote><p>「さて、両親は過越祭には毎年エルサレムへ旅をした。<strong>イエスが十二歳になったとき</strong>も、両親は祭りの慣習に従って都に上った。&lt;…&gt; 三日の後、イエスが<strong>神殿の境内で学者たちの真ん中に座り、話を聞いたり質問したりしておられる</strong>のを見つけた。<strong>聞いている人は皆、イエスの賢い受け答えに驚いていた</strong>」（<a href="https://bibleox.com/ja/jp-ni/lk/2/#L41-42,46-47">ルカ. 2:41-42,46-47</a>）</p></blockquote><p>12歳以後も、キリストは両親に従ってナザレで暮らされました。</p><blockquote><p>「それから、イエスは一緒に下って行き、<strong>ナザレに帰り、両親に仕えてお暮らしになった</strong>」（<a href="https://bibleox.com/ja/jp-ni/lk/2/#L51">ルカ. 2:51</a>）</p></blockquote><h2>ナザレからカファルナウムへの移住：宣教の始まり</h2><p>30歳に達し、預言者ヨハネから洗礼を受けて初めて、キリストはナザレを離れ、宣教を始めるためにカファルナウムに移られます。</p><blockquote><p>「イエスは、ヨハネが捕らえられたと聞き、ガリラヤに退かれた。そして、<strong>ナザレを離れ、ゼブルンとナフタリの地方にある湖畔の町カファルナウムに来て住まわれた</strong>」（<a href="https://bibleox.com/ja/jp-ni/mf/4/#L12-13">マタ. 4:12-13</a>）</p></blockquote><p><em>預言のとおりに：</em><a href="https://bibleox.com/ja/jp-ni/mf/4/#L14-16"><em>マタ. 4:14-16</em></a><em>; </em><a href="https://bibleox.com/ja/jp-ni/is/8/#L23"><em>イザ. 8:23</em></a><em>–</em><a href="https://bibleox.com/ja/jp-ni/is/9/#L1"><em>9:1</em></a></p><h2>重要な点</h2><h3>ガリラヤの人々は、イエスが大工の息子であることをよく知っている</h3><p>ガリラヤでの宣教の間、人々はイエス・キリストを、普通の大工、大工の息子としてよく知っています。</p><blockquote><p>「<strong>この人は、大工ではないか</strong>。マリアの息子で、ヤコブ、ヨセ、ユダ、シモンの兄弟ではないか。姉妹たちは、ここで我々と一緒に住んでいるではないか。」このように、人々はイエスにつまずいた」（<a href="https://bibleox.com/ja/jp-ni/mk/6/#L3">マコ. 6:3</a>）</p></blockquote><blockquote><p>「<strong>この人は大工の息子ではないか</strong>。母親はマリアといい、兄弟はヤコブ、ヨセフ、シモン、ユダではないか」（<a href="https://bibleox.com/ja/jp-ni/mf/13/#L55">マタ. 13:55</a>）</p></blockquote><h3>律法を守るための定期的な神殿詣で</h3><p>律法を守るために、キリストは年に3回エルサレムの神殿に行かなければなりませんでした。</p><blockquote><p>「<strong>年に三度、男子はすべて</strong>、主なる神の御前に出ねばならない」（<a href="https://bibleox.com/ja/jp-ni/ish/23/#L17">出. 23:17</a>）</p></blockquote><blockquote><p>「<strong>年に三度、男子はすべて</strong>、主なるイスラエルの神、主の御前に出ねばならない」（<a href="https://bibleox.com/ja/jp-ni/ish/34/#L23">出. 34:23</a>）</p></blockquote><blockquote><p>「<strong>男子はすべて、年に三度、すなわち除酵祭、七週祭、仮庵祭に</strong>、あなたの神、主の御前、主の選ばれる場所に出ねばならない。ただし、何も持たずに主の御前に出てはならない」（<a href="https://bibleox.com/ja/jp-ni/vtor/16/#L16">申. 16:16</a>）</p></blockquote><h3>キリストは律法を成就された</h3><blockquote><p>「わたしが来たのは<strong>律法</strong>や預言者を廃止するためだ、と思ってはならない。<strong>廃止するためではなく、完成するためである</strong>」（<a href="https://bibleox.com/ja/jp-ni/mf/5/#L17">マタ. 5:17</a>）</p></blockquote><blockquote><p>「しかし、イエスはお答えになった。『今は、止めないでほしい。<strong>正しいことをすべて行うのは、我々にふさわしいことです</strong>』」（<a href="https://bibleox.com/ja/jp-ni/mf/3/#L15">マタ. 3:15</a>）</p></blockquote><blockquote><p>「<strong>人の子は、聖書に書いてあるとおりに、去って行く</strong>。だが、人の子を裏切るその者は不幸だ。生まれなかった方が、その者のためによかった」（<a href="https://bibleox.com/ja/jp-ni/mf/26/#L24">マタ. 26:24</a>）（<a href="https://bibleox.com/ja/jp-ni/mk/14/#L21">マコ. 14:21</a>）</p></blockquote><blockquote><p>「イエスは言われた。『<strong>わたしについてモーセの律法と預言者の書と詩編に書いてある事柄は、必ずすべて実現する</strong>。これこそ、まだあなたがたと一緒にいたころ、言っておいたことである』」（<a href="https://bibleox.com/ja/jp-ni/lk/24/#L44">ルカ. 24:44</a>）</p></blockquote><blockquote><p>「しかし、時が満ちると、神は、その御子を<strong>女から、しかも律法の下に生まれた者として</strong>お遣わしになりました」（<a href="https://bibleox.com/ja/jp-ni/gal/4/#L4">ガラ. 4:4</a>）</p></blockquote><h3>宣教のために成人の年齢を待つ</h3><p>キリストは30歳になるまで宣教と奇跡を控えておられました。神の定めと確立された伝統により、公の奉仕は30歳から始められたからです（<a href="https://bibleox.com/ja/jp-ni/chis/4/#L3">民. 4:3</a>）。それゆえ、律法を廃止するためではなく完成するために来られたキリスト（<a href="https://bibleox.com/ja/jp-ni/mf/5/#L17">マタ. 5:17</a>）は、30歳まで待ってから宣教に出られました。</p><blockquote><p>「<strong>イエスが宣教を始められたときはおよそ三十歳であった</strong>。イエスはヨセフの子と思われていた」（<a href="https://bibleox.com/ja/jp-ni/lk/3/#L23">ルカ. 3:23</a>）</p></blockquote><p>キリストは御自分の時が来るのを待っておられました。</p><blockquote><p>「イエスは母に言われた。『婦人よ、わたしとどんなかかわりがあるのです。<strong>わたしの時はまだ来ていません</strong>』」（<a href="https://bibleox.com/ja/jp-ni/in/2/#L4">ヨハ. 2:4</a>）</p></blockquote><blockquote><p>「人々はイエスを捕らえようとしたが、手をかける者はいなかった。<strong>イエスの時はまだ来ていなかったからである</strong>」（<a href="https://bibleox.com/ja/jp-ni/in/7/#L30">ヨハ. 7:30</a>）</p></blockquote><blockquote><p>「イエスは神殿の境内で教えておられたとき、宝物殿の近くでこれらのことを話された。しかし、だれもイエスを捕らえなかった。<strong>イエスの時がまだ来ていなかったからである</strong>」（<a href="https://bibleox.com/ja/jp-ni/in/8/#L20">ヨハ. 8:20</a>）</p></blockquote><blockquote><p>「そこで、イエスは言われた。『<strong>わたしの時はまだ来ていない</strong>。しかし、あなたがたの時はいつも備えられている』」（<a href="https://bibleox.com/ja/jp-ni/in/7/#L6">ヨハ. 7:6</a>）</p></blockquote><blockquote><p>「あなたがたは祭りに上って行くがよい。わたしはこの祭りには上って行かない。<strong>まだ、わたしの時が来ていないからである</strong>」（<a href="https://bibleox.com/ja/jp-ni/in/7/#L8">ヨハ. 7:8</a>）</p></blockquote><blockquote><p>「しかし、わたしには受けねばならない洗礼がある。<strong>それが終わるまで、わたしはどんなに苦しむことだろう</strong>」（<a href="https://bibleox.com/ja/jp-ni/lk/12/#L50">ルカ. 12:50</a>）</p></blockquote><blockquote><p>「イエスはこれらのことを話してから、天を仰いで言われた。『<strong>父よ、時が来ました</strong>。あなたの子があなたの栄光を現すようになるために、子に栄光を与えてください』」（<a href="https://bibleox.com/ja/jp-ni/in/17/#L1">ヨハ. 17:1</a>）</p></blockquote>

  - src: молитва-Иисусу-Христу
    path: Ye8w_イエスキリストへの祈り
    title: イエス・キリストへの祈り
    menu: { parent: "神/子", title: "イエス・キリストへの祈り", priority: 50 }
    body: |-
      <h2>イエス・キリストに祈ってよいのか</h2><p>もちろん、よいのです。しかしこの戒めを、わたしたちは聖書からではなく、聖伝から受けています。</p><h2>聖書だけに基づいて、イエス・キリストに祈らなければならないと主張できるか</h2><p>聖書には、イエス・キリストに祈れという戒めはありません。ただし、<a href="https://bibleox.com/ja/gr-lxx-byz/in/14/#L14">ヨハ. 14:14</a> にはある示唆があります（ギリシア語本文 ἐάν τι αἰτήσητέ με —「もし<strong>わたしに</strong>何かを願うなら」。新共同訳もこのように訳しています：「<a href="https://bibleox.com/ja/jp-ni/in/14/#L14">わたしの名によってわたしに何かを願うならば</a>」）。</p><p>イエス・キリストは父に祈られ（<a href="https://bibleox.com/ja/jp-ni/mk/14/#L36">マコ. 14:36</a>; <a href="https://bibleox.com/ja/jp-ni/lk/22/#L42">ルカ. 22:42</a>）、「主の祈り」を与えられました（<a href="https://bibleox.com/ja/jp-ni/mf/6/#L9">マタ. 6:9</a>; <a href="https://bibleox.com/ja/jp-ni/lk/11/#L2">ルカ. 11:2</a>）。つまり、父に祈ることを教えられたのです。</p><p>聖伝なしに、聖書だけに基づいて（もちろん聖書についての自分の理解に基づいて）信仰を築く人々も、イエス・キリストへの祈りを否定することはできません。そこで彼らは、イエス・キリストに祈る実例があるのだから、キリストに祈ってよいのだと言います。しかし、その実例を示すことさえしばしば難しいのです。非常にまれだからですが、もちろん実例はあります。たとえば：</p><blockquote><p>「人々が石を投げつけている間、ステファノは<strong>主に呼びかけて</strong>（ἐπικαλούμενον）、『<strong>主イエスよ</strong>、わたしの霊をお受けください』と言った」（<a href="https://bibleox.com/ja/jp-ni/act/7/#L59">使. 7:59</a>）</p></blockquote><h2>反論</h2><h3>「わたしの名によって願う」</h3><p>プロテスタントは、戒めはこの節にあると指摘して反論します。</p><blockquote><p>「<strong>わたしの名によって</strong>わたしに何かを願うならば、わたしがかなえてあげよう」（<a href="https://bibleox.com/ja/jp-ni/in/14/#L14">ヨハ. 14:14</a>）</p></blockquote><p>しかし、同じ告別の説教の中で、主イエス・キリストは父に願うよう教えておられます。</p><blockquote><p>「その日には、あなたがたはもはや、わたしに何も尋ねない。はっきり言っておく。あなたがたがわたしの名によって何かを<strong><mark>父に願うならば</mark></strong>、父はお与えになる」（<a href="https://bibleox.com/ja/jp-ni/in/16/#L23">ヨハ. 16:23</a>）</p></blockquote>

  - src: f18sRKqQ_Возражения_против_филиокве
    path: Fx3n_フィリオクェへの反論
    title: 「フィリオクェ」への反論
    menu: { parent: "神/聖霊", title: "「フィリオクェ」への反論", priority: 4 }
    references: |-
      <ol><li><p>たとえば2世紀に、殉教者ユスティノスがこのことについて書いています。</p><blockquote><p>しかし、生まれざる万物の父には、<strong>名は与えられていない</strong>。どのような名で呼ばれるにしても、その方は、名を与える者を自分より年長の者として持つことになるからである。父、神、創造者、主、主人という言葉は名ではなく、その方の善い業と働きから導き出された呼び名である。</p></blockquote><p>（<a href="https://bibleox.com/en/en/w/Justin_Philosopher-Apology_2/">第二弁明</a>、6章、英語。英訳からの訳）</p></li></ol>
    body: |-
      <h2>フィリオクェ — 用語</h2><p>「フィリオクェ」とは、聖霊は父からだけでなく「子からも」（ラテン語 Filioque）発出するというカトリック教会の教えです。</p><p>司祭ゲオルギー・マクシモフによるフィリオクェへの詳しい反論の動画（ロシア語）：<a href="https://rutube.ru/video/c1878056726d0e041ba83802090cf308/">Rutube</a>、<a href="https://youtu.be/xuOSiS8zCO4">YouTube</a>。</p><h2>聖霊は父から発出する</h2><p>わたしたちは神の本性を知りませんが、神の子イエス・キリストは知っておられます。</p><blockquote><p>「すべてのことは、父からわたしに任せられています。父のほかに子を知る者はなく、子と、<strong>子が示そうと思う者</strong>のほかには、父を知る者はいません」（<a href="https://bibleox.com/ja/jp-ni/mf/11/#L27">マタ. 11:27</a>）</p></blockquote><p>キリストは神の啓示を使徒たちに与えられました。</p><blockquote><p>「もはや、わたしはあなたがたを僕とは呼ばない。僕は主人が何をしているか知らないからである。わたしはあなたがたを友と呼ぶ。<strong>父から聞いたことをすべてあなたがたに知らせた</strong>からである」（<a href="https://bibleox.com/ja/jp-ni/in/15/#L15">ヨハ. 15:15</a>）</p></blockquote><p>神の子は、聖霊は父から発出すると言われました。</p><blockquote><p>「わたしが<strong>父のもとから</strong>あなたがたに遣わそうとしている弁護者、すなわち、<strong><mark>父のもとから出る</mark>真理の霊</strong>が来るとき、その方がわたしについて証しをなさるはずである」（<a href="https://bibleox.com/ja/jp-ni/in/15/#L26">ヨハ. 15:26</a>）</p></blockquote><p>父、子、聖霊は名ではありません。神には固有の名はありません。名は、上に立つ者によって与えられるものです。神より上に立つ者はいません[1]。</p><p>父、子、聖霊という言葉は、これらの神の位格が互いにどのような関係にあるかを指し示すものにすぎません。</p><ul><li><p><strong>父</strong>は<strong>生む</strong>ので、父です。しかし生まれないので、子ではありません。発出しないので、聖霊ではありません。</p></li><li><p><strong>子</strong>は<strong>生まれる</strong>ので、子です。しかし生まないので、父ではありません。また発出しないので、聖霊ではありません。</p></li><li><p><strong>聖霊</strong>は生まれもせず、生みもしないので、父でも子でもありません。発出するので、聖霊です。</p></li></ul><p>それぞれの位格には、互いを区別することのできる区別（位格的特性）が一つだけあります。これらの言葉（父、子、聖霊）は、これらの特性を指し示すことを可能にしてくれます。</p><hr><p>わたしたちがこの世界で目にする神の働きは、神の本性そのものではなく、神の<strong>働き（エネルギア）</strong>にすぎず、わたしたちはそれを恵みとも呼びます。</p><p>万物の原因は父だけです。父だけが、子の存在の原因であり、聖霊の存在の原因です。原因はただ一つであり、二つでも三つでもありません。</p><p>同時に、父はすべてにおいて子と聖霊に等しく、ただ<strong>生まれざること</strong>によってのみ異なります。</p><p>子は、ただ<strong>生まれること</strong>によってのみ、父と聖霊から異なります。</p><p>同様に、聖霊は、ただ<strong>発出</strong>によってのみ、父と子から異なります。</p><p>これらは<strong>位格的特性</strong>と呼ばれます。そして、すべての位格の本性的特性は同一です。本性は一つだからです。神は唯一であり、位格は三つです。そして、それぞれの位格には、ほかの位格との<strong>一つの</strong>区別があります。</p><h2>「フィリオクェ」支持者の反論</h2><h3>「わたしと父とは一つである」</h3><p>聖霊が父からだけでなく子からも発出するというカトリックの教えの証拠として、次の引用が挙げられます。</p><blockquote><p>「わたしと父とは一つである」（<a href="https://bibleox.com/ja/jp-ni/in/10/#L30">ヨハ. 10:30</a>）</p></blockquote><p>また、同様の言葉も挙げられます。</p><blockquote><p>「しかし、その方、すなわち、<strong>真理の霊</strong>が来ると、あなたがたを導いて真理をことごとく悟らせる。その方は、自分から語るのではなく、聞いたことを語り、また、これから起こることをあなたがたに告げるからである。その方はわたしに栄光を与える。<strong>わたしのものを受けて</strong>、あなたがたに告げるからである」（<a href="https://bibleox.com/ja/jp-ni/in/16/#L13-14">ヨハ. 16:13-14</a>）</p></blockquote><blockquote><p>「<strong>父が持っておられるものはすべて、わたしのものである</strong>。だから、わたしは、『その方がわたしのものを受けて、あなたがたに告げる』と言ったのである」（<a href="https://bibleox.com/ja/jp-ni/in/16/#L15">ヨハ. 16:15</a>）</p></blockquote><p>しかし、もし「わたしと父とは一つである」という言葉から、聖霊は「子からも」発出するということになるなら、聖霊は御自身からも発出する、つまり聖霊は聖霊から発出するということにもなります。父と子だけでなく、聖霊もまた父と子と「一つ」だからです。聖霊もまた、父と子が持っておられるすべてのものを持っておられます。</p><p>提示された論法が論理的に成り立つのは、聖霊が神ではなく、何かの輝き、愛の感情にすぎず、神ではない場合だけでしょう。しかしその場合には、聖霊の神性を否定する、もう一つの大きな誤りになってしまいます。</p><p>提示された論法に従うなら、次のどちらかを認めなければならないことになります。</p><ul><li><p>「一つ」であるのは父と子だけで、聖霊は別の何か（愛の感情、輝きにすぎないもの）である。</p></li><li><p>あるいは、聖霊は父から、子から、そして……聖霊から発出する。</p></li></ul><p>聖霊が聖霊からも発出するという主張を一貫して受け入れるなら、ほかにも多くの不合理な結論が出てきます。たとえば、子は父（まさにそのゆえに父と呼ばれる方）からだけでなく、すべての位格から生まれ、子自身も自分を生むということです。しかし、子は生まれるゆえに子と呼ばれ、父は生むゆえに父と呼ばれます。同様に、霊は発出するゆえに霊と呼ばれるのです。</p><p>「フィリオクェ」の支持者が、聖霊は御自身から発出すると認める用意がないのなら、この引用は別のことについて語っており、「フィリオクェ」の擁護には適さないと認めるべきです。この表現をもっと詳しく見てみましょう。</p><h3>「わたしのものを受けて」</h3><blockquote><p>「その方はわたしに栄光を与える。<strong>わたしのものを受けて</strong>、あなたがたに<strong><mark>告げる</mark></strong>からである。父が持っておられるものはすべて、わたしのものである。だから、わたしは、『<strong>その方がわたしのものを受けて</strong>、あなたがたに<strong><mark>告げる</mark></strong>』と言ったのである」（<a href="https://bibleox.com/ja/jp-ni/in/16/#L14-15">ヨハ. 16:14-15</a>）</p></blockquote><p>ここで語られているのは、聖霊が何を<strong>告げる</strong>かということ、すなわち聖霊はキリストに矛盾しないということです。神には一つの知と一つの意志があります。神の子は弟子たちに、聖霊は何か別の教えを与えることはない、聖霊もまた神から語られるからだと前もって告げておられるのです。キリストの後、モンタノスが現れて自分を聖霊の受肉であると称し、キリストの教えではなく自分の教えを説きました。著名なキリスト教神学者テルトゥリアヌスも、モンタノスの教えに引き込まれました。</p><h3>神の子は、息を吹きかけて聖霊を遣わされる</h3><p>使徒たちに現れたキリストは、彼らに息を吹きかけ、聖霊を受けるよう勧められます。</p><blockquote><p>「イエスは重ねて言われた。『あなたがたに平和があるように。父がわたしをお遣わしになったように、わたしもあなたがたを遣わす。』そう言ってから、<strong>彼らに息を吹きかけて言われた。『聖霊を受けなさい』</strong>」（<a href="https://bibleox.com/ja/jp-ni/in/20/#L21-22">ヨハ. 20:21-22</a>）</p></blockquote><p>この引用は、子が聖霊の源であることを意味するのではなく、聖霊が時の中で（わたしたちの地上の教会の歴史、救いの営みの中で）、子によって父から遣わされることを意味しています。つまり、以前には遣わされていなかったが（もちろん常に存在し、父から発出しておられた）、今、時の中で父から教会へと遣わされるのです。キリスト御自身が、その数章前でこう言っておられるとおりです。</p><blockquote><p>「<strong><mark>わたしが父のもとから</mark>あなたがたに<mark>遣わそうとしている</mark>弁護者、すなわち、<mark>父のもとから出る</mark>真理の霊</strong>が来るとき、その方がわたしについて証しをなさるはずである」（<a href="https://bibleox.com/ja/jp-ni/in/15/#L26">ヨハ. 15:26</a>）</p></blockquote><p>神の子は、聖霊を遣わすのは御自分であるが、父のもとから遣わすと言われます。聖霊は父から発出するからです。つまり、聖霊の発出の原因は父だけであり、子ではありません。</p><h2>歴史的背景</h2><p>教会は初めから常に、聖霊はまさに父から発出すると教えてきました（<a href="https://bibleox.com/ru/ru/w/cLrG_%D0%9F%D1%80%D0%BE%D1%82%D0%B8%D0%B2_%D0%A4%D0%B8%D0%BB%D0%B8%D0%BE%D0%BA%D0%B2%D0%B5_Filioque/">引用</a>、ロシア語）。</p><p>8世紀、西方で、聖霊がさらに「子からも」発出するという考えが生まれます。西方においても、この考えは791年にアクィレイア総主教パウリヌスによって断罪されています。</p><p>11世紀、信仰と教会の構造についての見方の歪曲のために、一つの共同体、すなわちローマの共同体（今日のローマ・カトリック教会）が正教会から離れます。</p><p>ローマでは、フランク王シャルルマーニュの政治的圧力のもとで、教えが変えられました。</p><ol><li><p>全地公会で採択され、全地公会が変更を禁じた「信経」を、独断で変更しました（<a href="https://bibleox.com/en/en/w/councils-the-third-ecumenical-council-the-council-of-ephesus-431/">第三全地公会、規則7</a>、英語）。</p></li><li><p>そこに、教会がかつて教えたことのないもの、すなわちフィリオクェ（聖霊は父からだけでなく子からも発出する）を付け加えました。</p></li><li><p>教会全体に対する教皇の不可謬の首位を主張し、教会全体にそれを受け入れるよう要求しました。そのようなものはかつて存在したことがなく、聖書に明らかに反しています（頭はキリストです。<a href="https://bibleox.com/ja/jp-ni/ef/1/#L22">エフェ. 1:22</a>）。歴史的にも、教皇が教会の頭であったことは一度もなく、全地公会が一度もローマで開かれたことはありません。キリスト御自身が、使徒たちに誰がいちばん偉いかを求めることを禁じ、それについての彼らの議論をやめさせられました（<a href="https://bibleox.com/ja/jp-ni/mk/9/#L34">マコ. 9:34</a>; <a href="https://bibleox.com/ja/jp-ni/mf/20/#L25-28">マタ. 20:25-28</a>）。</p></li></ol><p>この大規模な歴史的出来事を評価するためには、<strong>イタリアの政治状況</strong>を理解することがきわめて重要です。</p><p><strong>5世紀から</strong>、ローマは非常に深刻な異民族の侵入に苦しみ、教皇座はしばしばきわめて不安定な状態にありました。ビザンティンは西方の前線に注意を払う余裕がますますなくなり、ほかの方面に力を集中していました。こうしてローマ教皇は、時とともに事実上、宗教的権力だけでなく国家的権力をも代表するようになりました。</p><p><strong>8世紀から9世紀への変わり目</strong>に、教皇たちは自分たちの地位を守るために、ビザンティン皇帝からフランク王シャルルマーニュ（748年頃〜814年）へと、政治的に大きく方向転換します。</p><p><strong>800年</strong>、教皇レオ3世はシャルルを神聖ローマ帝国の継承者として宣言し、戴冠し、承認します。</p><p>教皇がそもそもそのような権限を持っているという主張を正当化するために、いくつかの偽造文書が作られました。</p><ul><li><p><strong>コンスタンティヌスの寄進状</strong> – <a href="https://ja.wikipedia.org/wiki/コンスタンティヌスの寄進状">https://ja.wikipedia.org/wiki/コンスタンティヌスの寄進状</a></p></li><li><p><strong>偽イシドルス教令集</strong> – <a href="https://en.wikipedia.org/wiki/Pseudo-Isidorean_Decretals">https://en.wikipedia.org/wiki/Pseudo-Isidorean_Decretals</a>（英語）</p></li></ul><p>この一歩は、教皇たちにさらなる一歩を求める状況を生み出しました。</p><p>コンスタンティノープルが帝国の中心であったのは、皇帝がそこにいたからだけでなく、コンスタンティノープルの主導で、全地公会がコンスタンティノープルそのものかその近郊で開かれていたからでもあります。</p><p>再び帝国の中心（政治的だけでなく宗教的な中心）になりたいという願いは、ローマに、公会と神学の確立の主導権を握ることを求めました。しかし、公会は大規模な異端があるときにだけ開かれるものであり、当時はそのような異端はありませんでした。そこで西方では、「古いスペインの箱」から<strong>7〜8世紀のフィリオクェの教え</strong>を取り出し、政治的に押し通して正式に「信経」に入れ、さらに教会における教皇の全面的な首位を勝手に宣言し、教会全体にこれらすべての策略を認めるよう要求したのです。</p><p>重要なのは、この信経への付加が、それ以前に西方ですでに断罪されていたこと（791年、アクィレイア総主教パウリヌスによって）、そしてフランク王に戴冠した教皇レオ3世自身が、「信経」へのフィリオクェの付加を認めることを拒んだことです。</p><p>それにもかかわらず、抵抗を押し切って9世紀末までにローマで「フィリオクェ」が受け入れられ、それはまず「フォティオスの分裂」を、のちには1054年のコンスタンティノープルでの対立を招きました。</p><p>これらの出来事から、復活させられたスペインの「<strong>フィリオクェ」の教えは口実にすぎなかった</strong>ことがわかります。それは教会に対する権力を確立するためのものでした。フィリオクェはそれ自体が目的ではありませんでした。まったく具体的な目的のために復活させられたのです。</p><p><strong>前例が必要だったのです</strong>。教皇は全地公会なしに独断で教義上の真理を宣言し、自分の「不可謬の」新説を教会全体に受け入れるよう要求できる、という前例が。</p><p>神学的にも歴史的にも根拠のない、この教皇の権力の主張は、ほかのすべての地方教会によって断固として退けられました。</p>
