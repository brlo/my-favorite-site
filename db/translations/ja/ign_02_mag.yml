  - src: ИгнАн_Мг
    path: Ig1M_マグネシアの教会への手紙
    title: マグネシアの教会への手紙
    meta_desc: アンティオキアの聖イグナティオス（テオフォロス）がマグネシアの教会に宛てた手紙。ギリシア語原文からの翻訳と注。
    menu: { parent: "手紙", title: "マグネシアの教会への手紙", priority: 2 }
    body: |-
      <h2>0</h2><p>イグナティオス、またの名をテオフォロスより、私たちの救い主キリスト・イエスにあって、父なる神の恵みのうちに祝福された、マイアンドロス河畔のマグネシアにある教会へ。私はこの方にあってこの教会に挨拶を送り、父なる神とイエス・キリストのうちに、心からの喜びを祈ります。</p>
      <h2>1</h2><p>1. 神に従うあなたがたの愛がまことによく整っていることを知って、私は喜び、イエス・キリストへの信仰のうちにあなたがたに語りかけようと決めました。</p><p>2. 私は神に最もふさわしい名[1]をいただき、身に帯びているこの鎖のうちに諸教会をたたえて歌っています。そして諸教会のうちに、私たちの絶えることのない命であるイエス・キリストの肉と霊との一致、何ものにもまさる信仰と愛との一致、そして何よりも大切なイエスと父との一致があるようにと祈っています。</p><p>3. この方のうちにあって、この世の支配者のあらゆる攻撃に耐え、それを逃れるならば、私たちは神に到達するでしょう。</p>
      <h2>2</h2><p>私は、神にふさわしいあなたがたの主教ダマス、ふさわしい司祭たちバッソスとアポロニオス、そして私の同労のしもべである輔祭ゾティオンを通して、あなたがたに会うことを許されました。ゾティオンのことを私は喜びとしたいものです。彼は神の恵みに従うように主教に、イエス・キリストの律法に従うように司祭団に従っているからです。</p>
      <h2>3</h2><p>1. あなたがたも、主教が若いことにつけ込んではなりません[2]。父なる神の力に従って、あらゆる敬意を彼に払うべきです。私が知るところでは、聖なる司祭たちも、彼の見た目の若さを軽んじることなく、神において賢い者として彼に従っています。しかし、それは彼にではなく、イエス・キリストの父、すべての者の主教に従っているのです。</p><p>2. ですから、私たちを望まれたこの方の誉れのために、偽りなく聞き従うのがふさわしいのです。目に見えるこの主教を欺く者は、実は目に見えない方を欺こうとしているのです[3]。このような場合、問題は肉に対してではなく、隠れたことを知っておられる神に対してなのです。</p>
      <h2>4</h2><p>ですから、キリスト者と呼ばれるだけでなく、実際にキリスト者であることがふさわしいのです。ある人々は、主教の名を口にしながら、彼を抜きにしてすべてを行っています。このような人々は、良心に従っているとは私には思えません。掟に従って確かな仕方で集まっていないからです[4]。</p>
      <h2>5</h2><p>1. 物事には終わりがあり、死と命という二つのものが同時に私たちの前に置かれていて、各自が自分の場所へ行こうとしています。</p><p>2. 二種類の貨幣があり、一つは神のもの、もう一つはこの世のもので、それぞれに固有の刻印が押されているように、不信仰な者たちはこの世の刻印を、信じる者たちは愛のうちに、イエス・キリストを通して父なる神の刻印を帯びています。この方を通して、この方の受難にあずかって死ぬことを自ら進んで選ぶのでなければ、この方の命は私たちのうちにありません[5]。</p>
      <h2>6</h2><p>1. 先に名を挙げた人々のうちに、私はあなたがたの群れ全体を信仰のうちに見て、愛しました。それで勧めます。神と心を一つにして、すべてを行うよう努めなさい。主教は神の位に、司祭たちは使徒たちの会議の位に就いて座を占め、私にとって最も親しい輔祭たちはイエス・キリストへの奉仕を託されているのです。この方は世々の前から父のもとにおられ、終わりの時に現れたのです。</p><p>2. ですから、皆が神と同じ心を受けて互いに敬い合いなさい。だれも隣人を肉に従って見てはならず、イエス・キリストにあって常に互いに愛し合いなさい。あなたがたを分裂させうるものが、あなたがたの間に何一つあってはなりません。主教と、上に立つ人々と一つになりなさい。それが不朽のしるしとなり、教えとなるのです[6]。</p>
      <h2>7</h2><p>1. 主が父と一つであって、御自身によっても使徒たちによっても、父を離れては何もなさらなかったように[7]、あなたがたも主教と司祭たちを離れては何も行ってはなりません。また、自分たちだけで行うことを理にかなったことのように見せようとしてはなりません[8]。むしろ共に集まって、一つの祈り、一つの願い、一つの思い、愛と汚れのない喜びのうちにある一つの希望を持ちなさい。その喜びこそイエス・キリストであり、この方にまさるものは何もありません。</p><p>2. 皆が、一つの神殿、一つの祭壇、ただ一人のイエス・キリストのもとへ走り寄るように集まりなさい。この方はただ一人の父から出て、一人の方のうちにおられ、一人の方のもとへと帰られたのです。</p>
      <h2>8</h2><p>1. 異なる教えや、古くて役に立たない作り話に惑わされてはなりません[9]。もし私たちが今もなおユダヤ教に従って生きているなら、恵みを受けていないことを自ら認めることになるからです。</p><p>2. 最も神聖な預言者たちはキリスト・イエスに従って生きました。そのために迫害されたのです。彼らはこの方の恵みに導かれて、従わない者たちに、神はただ一人であり、御子イエス・キリストを通して御自身を現されたことを確信させました。この御子は沈黙から出てきた神の言葉であり[10]、あらゆる点で御自分を遣わした方の御心にかないました。</p>
      <h2>9</h2><p>1. 古い慣習のうちに生きていた人々が新しい希望へと至り、もはや安息日を守らず、主の日[11]に従って生きているのなら――その日に、この方とこの方の死とを通して私たちの命も昇ったのです。ある人々はこの死を否定しますが、この秘義を通して私たちは信仰を受け、私たちのただ一人の教師イエス・キリストの弟子として見いだされるために、耐え忍んでいるのです――</p><p>2. どうして私たちが、この方を離れて生きることができるでしょうか。預言者たちも霊においてこの方の弟子であり、この方を教師として待ち望んでいたのです。そのため、彼らが正しく待ち望んでいた方は、来られたときに彼らを死者の中から起こされたのです[12]。</p>
      <h2>10</h2><p>1. ですから、私たちはこの方の慈しみに無感覚であってはなりません。もしこの方が私たちの行いをそのまま私たちに返されるなら[13]、私たちはもはや存在しないでしょう。それゆえ、この方の弟子となった私たちは、キリスト教[14]に従って生きることを学びましょう。この名以外の名で呼ばれる者は、神のものではありません。</p><p>2. ですから、古くなって酸っぱくなった悪いパン種を取り除き、新しいパン種、すなわちイエス・キリストに変わりなさい[15]。この方によって塩味をつけられなさい。あなたがたのうちのだれかが腐ることのないためです。あなたがたは、そのにおいによって見分けられるでしょう。</p><p>3. イエス・キリストを口にしながらユダヤ教に従って生きるのは筋違いです。キリスト教がユダヤ教を信じたのではなく、ユダヤ教がキリスト教を信じたのです。そのキリスト教へと、神を信じたあらゆる言葉の民が集められたのです[16]。</p>
      <h2>11</h2><p>愛する人々よ、私がこれを書くのは、あなたがたのうちのだれかがそうなっていると知ったからではありません。あなたがたより小さい者として、あなたがたが虚栄の釣り針にかからないよう、前もって守りたいのです。むしろ、ポンティオ・ピラトが総督であったときに起こった誕生と受難と復活について、確信を持っていてください。これらは私たちの希望であるイエス・キリストによって、真実に、また確かに行われたことです。あなたがたのうちのだれも、この希望からそれることがありませんように。</p>
      <h2>12</h2><p>私がふさわしい者であるなら、あらゆる点であなたがたを喜びとしたいものです。私は縛られていますが、解き放たれているあなたがたの一人にも及びません。あなたがたが高ぶっていないことを私は知っています。あなたがたは自分のうちにイエス・キリストを持っているからです。むしろ私があなたがたをほめると、あなたがたが恥じ入ることを知っています。「正しい人は自分自身を訴える者である」[17]と書いてあるとおりです。</p>
      <h2>13</h2><p>1. ですから、主と使徒たちの教えのうちに堅く立つよう努めなさい。それは、あなたがたが行うすべてのことが、肉と霊において、信仰と愛において、子と父と霊において、初めにも終わりにも、うまく運ぶためです。最もふさわしいあなたがたの主教と、あなたがたの司祭団という見事に編まれた霊的な冠と、神に従う輔祭たちと共に。</p><p>2. 主教に従い、また互いに従いなさい。イエス・キリストが父に従い、使徒たちがキリストと父とに従ったように。それは肉と霊の一致があるためです[18]。</p>
      <h2>14</h2><p>あなたがたが神に満たされていることを知っているので、手短に勧めました。あなたがたの祈りのうちに私を覚えてください。私が神に到達するためです。またシリアの教会のことも覚えてください。私はその教会の者と呼ばれるにふさわしくありません。シリアの教会があなたがたの教会を通して露に潤されるにふさわしい者とされるために、私は神のうちに一つにされたあなたがたの祈りと愛とを必要としているのです。</p>
      <h2>15</h2><p>エフェソの人々[19]が神の栄光のためにスミルナに来ていて、あなたがたに挨拶を送ります。私もそのスミルナからあなたがたに書いています。彼らは、あなたがたと同様に、スミルナの人々の主教ポリュカルポスと共に、あらゆる点で私を安らがせてくれました。ほかの諸教会も、イエス・キリストの誉れのうちにあなたがたに挨拶を送ります。神と心を一つにし、分かたれることのない霊――それはイエス・キリストです――を持って、お元気で。</p>
    references: |-
      <ol><li><p>θεοπρεπέστατον ὄνομα。キリストのために縛られた者、殉教へ向かう者という名誉ある呼び名を指すと考えられます。「神を担う者」（テオフォロス）という名のことだと解する人もいます。</p></li><li><p>νεωτερικὴ τάξις —「若さ（見た目の若い年齢）」。マグネシアの主教ダマスが若かったことを指します（<a href="https://bibleox.com/ja/jp-ni/1tim/4/#L12">１テモ. 4:12</a> 参照）。主教職が新しい制度であることを指すと解する学者もいます。</p></li><li><p>目に見えない主教とは、父なる神のこと（3:1「すべての者の主教」）。</p></li><li><p>主教と司祭たちを抜きにして、別に集まっていることを指します。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/rim/6/#L3-5">ロマ. 6:3-5</a> 参照。</p></li><li><p>主教との一致は、不朽の命の姿を映すしるしであり、それを人々に教えるものでもある、の意と解されています。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/in/5/#L19">ヨハ. 5:19</a>、<a href="https://bibleox.com/ja/jp-ni/in/5/#L30">5:30</a>、<a href="https://bibleox.com/ja/jp-ni/in/8/#L28">ヨハ. 8:28</a> 参照。</p></li><li><p>主教と司祭たちを離れた別の集まりのことです。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/1tim/1/#L4">１テモ. 1:4</a>、<a href="https://bibleox.com/ja/jp-ni/1tim/4/#L7">4:7</a>、<a href="https://bibleox.com/ja/jp-ni/tit/1/#L14">テト. 1:14</a> 参照。</p></li><li><p>λόγος ἀπὸ σιγῆς προελθών。神の永遠の沈黙ののちに、御言葉が世に現れたという意味です（<a href="https://bibleox.com/ja/ja/w/Ig1E_エフェソの教会への手紙#HH-19">『エフェソの教会への手紙』19:1</a>、<a href="https://bibleox.com/ja/jp-ni/rim/16/#L25-26">ロマ. 16:25-26</a> 参照）。後代の写本（ロシア語訳はこれに従う）では「永遠の言葉であって、沈黙から出たのではない」（λόγος ἀΐδιος οὐκ ἀπὸ σιγῆς προελθών）と読みます。グノーシス主義者は「沈黙」（シゲー）を神的存在の一つとしていたため、それと混同されないよう改められたと考えられます。</p></li><li><p>κυριακή — 主の日、すなわち日曜日（<a href="https://bibleox.com/ja/jp-ni/otkr/1/#L10">黙. 1:10</a>）。一部の写本では「主の命に従って生きる」（κατὰ κυριακὴν ζωήν）。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/mf/27/#L52-53">マタ. 27:52-53</a> 参照。</p></li><li><p>直訳は「もしこの方が私たちのするとおりに私たちに倣うなら」。私たちの罪に応じて報いられるなら、の意（<a href="https://bibleox.com/ja/jp-ni/ps/130/#L3">詩. 130:3</a> 参照）。</p></li><li><p>Χριστιανισμός。「キリスト教」という語は、現存する文献ではイグナティオスの手紙に初めて現れます（<a href="https://bibleox.com/ja/ja/w/Ig1R_ローマの教会への手紙#HH-3">『ローマの教会への手紙』3:3</a>、<a href="https://bibleox.com/ja/ja/w/Ig1F_フィラデルフィアの教会への手紙#HH-6">『フィラデルフィアの教会への手紙』6:1</a> 参照）。「キリスト者」という呼び名については <a href="https://bibleox.com/ja/jp-ni/act/11/#L26">使. 11:26</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/1kor/5/#L7-8">１コリ. 5:7-8</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/is/66/#L18">イザ. 66:18</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/pr/18/#L17">箴. 18:17</a>（七十人訳による。新共同訳はヘブライ語本文から訳しているため表現が異なる）。</p></li><li><p>外なる一致と内なる一致（<a href="https://bibleox.com/ja/jp-ni/ef/4/#L4">エフェ. 4:4</a> 参照）。</p></li><li><p>イグナティオスのためにスミルナに来ていたエフェソのキリスト者たち（<a href="https://bibleox.com/ja/ja/w/Ig1E_エフェソの教会への手紙#HH-1">『エフェソの教会への手紙』1:3</a>、<a href="https://bibleox.com/ja/ja/w/Ig1E_エフェソの教会への手紙#HH-2">『エフェソの教会への手紙』2:1</a> 参照）。</p></li></ol>
      <p>翻訳：ロジオン・ヴラソフ（AIツールを併用）。底本：ギリシア語本文（<a href="https://bibleox.com/ja/grc/w/ΙγνΘ_Μαγ">本サイトのギリシア語版</a>。明らかな脱落はライトフット版・ホームズ版で補った）。参照：ロシア語訳（『初期教会教父選集』ブリュッセル、1988年）、英訳（Roberts–Donaldson）、仏訳（Genoude、1837年）。聖書の引用は新共同訳による。</p>
