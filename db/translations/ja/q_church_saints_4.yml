    path: Ic8v_イコンの崇敬
    title: イコンの崇敬
    meta_desc: イコンの崇敬についての聖書の引用
    menu: { parent: "教会/聖人", title: "イコンの崇敬", priority: 8 }
    references: |-
      <ol><li><p>たとえば、神は神殿に牛の像を作るよう命じられましたが（<a href="https://bibleox.com/ja/jp-ni/3ts/7/#L25">王上. 7:25</a>; <a href="https://bibleox.com/ja/jp-ni/2par/4/#L3-4">代下. 4:3-4</a>; <a href="https://bibleox.com/ja/jp-ni/2par/4/#L15">代下. 4:15</a>）、牛を神と呼ぶことはもはや偶像礼拝です（<a href="https://bibleox.com/ja/jp-ni/ish/32/#L4">出. 32:4</a>; <a href="https://bibleox.com/ja/jp-ni/3ts/12/#L28">王上. 12:28</a>; <a href="https://bibleox.com/ja/jp-ni/2par/13/#L8">代下. 13:8</a>）。古代の人々は子牛の像そのものを神と考えましたが、神は物質ではなく、まして子牛ではありません。つまりここでは、像も、その意味も偽りなのです。似たようなことは別の場合にも見られます。神は青銅の蛇を造るよう命じられ（<a href="https://bibleox.com/ja/jp-ni/chis/21/#L8-9">民. 21:8-9</a>）、のちにキリストは、それが御自分の十字架の苦しみの像であったことを指摘されます（<a href="https://bibleox.com/ja/jp-ni/in/3/#L14">ヨハ. 3:14</a>）。それにもかかわらず、神の命令によって造られた像が偽りの意味で満たされ、ネフシュタンとして崇められ始めたとき、これもまた偶像礼拝として断ち切られました（<a href="https://bibleox.com/ja/jp-ni/4ts/18/#L4">王下. 18:4</a>）。このように、最初の場合には人々は像を歪め（神は子牛ではない）、二番目の場合には意味を歪めたのです（蛇はキリストの苦しみの像であって、当時の人々の一部が考え出したネフシュタンではない）。</p></li><li><p>それゆえ、偶像についてではない手紙が、突然、偶像についての警告で終わっているのです（<a href="https://bibleox.com/ja/jp-ni/1in/5/#L21">１ヨハ. 5:21</a>）。すなわち、一般的な意味で、偽りに従わないようにという呼びかけで終わっているのです。克肖者ユスティン（ポポヴィチ）はこれについてこう述べています。「<em>キリストのほかにどんな神でも認め、告白し、宣べ伝えることは、偶像礼拝にほかならない。まことに偶像礼拝とは、唯一のまことの神、主イエス・キリストを礼拝する代わりに、何らかの偶像を礼拝することである。偶像礼拝は、最も粗野で、低俗で、野蛮な迷信的祭儀から、最も高尚な象徴主義に至るまで、すべてを含んでいる。偶像礼拝では、石や木、動物、惑星、彫像だけでなく、人間も、英雄も、（善と悪の）霊も、発見も、思想も、情念も、文化も、政治も、科学も、哲学も、芸術も、偶像礼拝者が自分の意志でまことの神であり主であるイエス・キリストに対置する（すなわち、その代わりに置く）あらゆるものが、神々として崇められる。それゆえ、新約の真理の『雷の子』である聖神学者ヨハネは、そのすばらしい良き知らせを次の言葉で結んでいるのである。</em><strong><em>子たちよ、偶像を避けなさい</em></strong><em>。偶像礼拝から身を守りなさい。アーメン</em>」（<a href="https://azbyka.ru/otechnik/Iustin_Popovich/tolkovanie-na-pervoe-sobornoe-poslanie-ioanna-bogoslova/"><u>聖神学者使徒ヨハネの第一公同書簡注解</u></a>、ロシア語。ロシア語からの訳）。</p></li></ol>
    body: |-
      <p>正教徒は偶像礼拝のかどで非難されています。イコンは偶像と呼ばれ、イコンの崇敬は偶像礼拝と呼ばれます。この記事では、聖書に従ってイコンの崇敬というテーマをたどりながら、これらの非難を検討します。</p><p>まず短い答えを示し、次に批判をもう少し詳しく見て、最後に聖書の検討を伴う最も詳しい答えを示します。</p><h2>イコン崇敬の最も短い弁明</h2><p>神の受肉以前の時代、旧約のイスラエルのために律法を定めるとき、神は御自分の像を示されず、また偽りの神々（偶像）の像を造ることもそれを崇めることも禁じられました（<a href="https://bibleox.com/ja/jp-ni/ish/20/#L4-5">出. 20:4-5</a>; <a href="https://bibleox.com/ja/jp-ni/vtor/5/#L8-9">申. 5:8-9</a>; <a href="https://bibleox.com/ja/jp-ni/vtor/4/#L15-19">申. 4:15-19</a>）。しかし神は、御自分の聖なる僕たちを描くよう命じられ（<a href="https://bibleox.com/ja/jp-ni/ish/25/#L1">出. 25:1</a>; <a href="https://bibleox.com/ja/gr-lxx-byz/ish/26/#L1">26:1</a>; <a href="https://bibleox.com/ja/jp-ni/ish/25/#L18-20">25:18-20</a>）、預言者たちは像のある聖なる物の前にひれ伏しました（<a href="https://bibleox.com/ja/jp-ni/nav/7/#L6">ヨシュ. 7:6</a>; <a href="https://bibleox.com/ja/jp-ni/ps/5/#L8">詩. 5:8</a>）。正教徒は、像のある聖なる物の崇敬に対して、預言者たちとまったく同じ態度をとっているのです。</p><p>そのうえ、神の計画によって、神殿そのものが天のイコンです（<a href="https://bibleox.com/ja/jp-ni/ish/25/#L8-9,40">出. 25:8-9,40</a>; <a href="https://bibleox.com/ja/jp-ni/evr/9/#L24">ヘブ. 9:24</a>; <a href="https://bibleox.com/ja/jp-ni/act/7/#L44">使. 7:44</a>）。神は神殿を敬うよう命じられ（<a href="https://bibleox.com/ja/jp-ni/lev/19/#L30">レビ. 19:30</a>; <a href="https://bibleox.com/ja/jp-ni/lev/26/#L2">26:2</a>）、神殿は敬われ、人々はその前にひれ伏しました（<a href="https://bibleox.com/ja/jp-ni/ps/5/#L8">詩. 5:8</a>; <a href="https://bibleox.com/ja/jp-ni/ps/99/#L5">99:5</a>; <a href="https://bibleox.com/ja/jp-ni/ps/132/#L7">132:7</a>）。これこそが正教の崇敬です。像を崇敬することによって、わたしたちは原型を崇敬するのです。</p><p>預言者たちによる像のある聖なる物の崇敬に対して、だれかが当てはめようとするどんな正当化も、正教の崇敬にも当てはまります（それは同一のものだからです）。同じように、だれかが正教の崇敬に向けようとするどんな断罪も、預言者たちの崇敬にも向けられることになります。</p><p>ここでの問題は、像やその崇敬ではまったくありません。偶像とは神についてのあらゆる偽りの観念なのですから、問題は、1) 像そのものと、2) 崇敬する者がそれに込める意味とが、真理に対してどのような関係にあるかということです。二つのうち少なくとも一つが根本的に偽りであれば、それは偶像礼拝となり[1]、人を真理から遠ざけます。まさにそこに問題があるのです。偶像は神に導かず、神についての偽りの観念はまことの神に導きません。偽りは真理に導かず、真理から遠ざけるからです[2]。</p><p>この主張を、イコン崇敬の反対者との対話で簡単に確かめてみましょう。</p><p><strong>イコンの反対者</strong>：物の前にひれ伏すことは偶像礼拝だ。</p><p><strong>正教徒</strong>：では、像のある神殿や契約の箱の前にひれ伏した神の預言者たちは、偶像礼拝者になったのですか。</p><p><strong>反対者</strong>：神は描けと言われただけで、崇敬せよとも、ひれ伏せとも言われなかった。</p><p><strong>正教徒</strong>：では、預言者たちはしてはならないこと、書かれていないこと、命じられていないことをしたのですか。つまり、偶像礼拝に陥ったのですか。</p><p><strong>反対者</strong>：預言者たちは神殿や契約の箱そのものにひれ伏したのではなく、そのひれ伏しを神に向けていたのだ。</p><p><strong>正教徒</strong>：まさにそのとおりです。正教徒も、木や絵の具にではなく、描かれている人にひれ伏しているのであり、教えもそう語っています。像を通して原型を崇敬するのであって、預言者たちがしたのと同じです。何の違いもありません。</p><p>こうした具合です。この規則はいつでも通用します。預言者たちの崇敬と正教の崇敬との間に違いはないからです。では、この問題をもっと詳しく検討してみましょう。</p><h2>イコンの反対者は言う。「神の言葉ははっきりと、像を造るなと言っている。それなのにあなたがたは造っている」</h2><p><strong>答え</strong>：これは、神だけを描くことについての、モーセの律法の旧約の禁止です。それは文脈から明らかです。</p><ul><li><p>最初の4つの戒めは、まさに<strong>神について</strong>のものです（<a href="https://bibleox.com/ja/jp-ni/ish/20/#L4-5">出. 20:4-5</a>; <a href="https://bibleox.com/ja/jp-ni/vtor/5/#L8-9">申. 5:8-9</a>）。</p></li><li><p>禁止を定める際に、神はその理由を示しておられます。律法が与えられたとき、神はまさに<strong>御自分の像</strong>を示されませんでした（<a href="https://bibleox.com/ja/jp-ni/vtor/4/#L15-19">申. 4:15-19</a>）。あなたがたは神を見なかったのだから、神を描くな、ということです。</p></li></ul><p>このように、禁止は神の像に関わるものです。しかし神の聖なる僕たちについては、神は描くことを禁じなかったばかりか、命じさえされ（<a href="https://bibleox.com/ja/jp-ni/ish/25/#L1">出. 25:1</a>; <a href="https://bibleox.com/ja/gr-lxx-byz/ish/26/#L1">26:1</a>）、義人たちはこれらの像のある神殿と聖なる物にひれ伏しました（<a href="https://bibleox.com/ja/jp-ni/nav/7/#L6">ヨシュ. 7:6</a>; <a href="https://bibleox.com/ja/jp-ni/ps/5/#L8">詩. 5:8</a>; <a href="https://bibleox.com/ja/jp-ni/ps/99/#L5">99:5</a>; <a href="https://bibleox.com/ja/jp-ni/ps/132/#L7">132:7</a>）。</p><p>旧約の教会にはイコンがあり、崇敬されていました。何よりもまず、<strong>旧約の神殿そのものがイコンなのです</strong>。地上の建物として、神の初めからの計画によって、それは天で起こっていることの像となるはずでした。神が預言者モーセに神殿を建てるよう命じられたのは、神殿を必要とされたからではなく（神はそれを必要とされませんでした：<a href="https://bibleox.com/ja/jp-ni/is/66/#L1">イザ. 66:1</a>; <a href="https://bibleox.com/ja/jp-ni/ps/50/#L13">詩. 50:13</a>; <a href="https://bibleox.com/ja/jp-ni/is/1/#L11">イザ. 1:11</a>）、まさに天のイコンとして、預言者に示された天の現実の像として神殿を造るよう命じられたのです（<a href="https://bibleox.com/ja/jp-ni/ish/25/#L8-9,40">出. 25:8-9,40</a>; <a href="https://bibleox.com/ja/jp-ni/evr/9/#L24">ヘブ. 9:24</a>; <a href="https://bibleox.com/ja/jp-ni/act/7/#L44">使. 7:44</a>）。神はこのイコンを敬うよう命じておられます（<a href="https://bibleox.com/ja/jp-ni/lev/19/#L30">レビ. 19:30</a>; <a href="https://bibleox.com/ja/jp-ni/lev/26/#L2">26:2</a>）。預言者ダビデはそれにひれ伏しています（<a href="https://bibleox.com/ja/jp-ni/ps/5/#L8">詩. 5:8</a>; <a href="https://bibleox.com/ja/jp-ni/ps/99/#L5">99:5</a>; <a href="https://bibleox.com/ja/jp-ni/ps/132/#L7">132:7</a>）。邪悪な王たちが神殿に異教の偶像を置いたとき（<a href="https://bibleox.com/ja/jp-ni/4ts/21/#L3-7">王下. 21:3-7</a>）、すなわち天の現実の像を損なったとき、神は神殿を退けられました（<a href="https://bibleox.com/ja/jp-ni/4ts/23/#L27">王下. 23:27</a>）。</p><p>神殿が天のイコンであるからこそ、新約において神殿は（内部の構造と像において）変化を受けます。天の現実もまた変わるからです。旧約では、天の現実には<strong>天使たちだけ</strong>が霊的に目に見える仕方で住んでいました。神はまったく見えない非物質的な方であり、人々はまだ天の命に達していませんでした（<a href="https://bibleox.com/ru/ru/w/9VFT_%D0%94%D0%BE_%D0%B6%D0%B5%D1%80%D1%82%D0%B2%D1%8B_%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%BE%D0%B2%D0%BE%D0%B9_%D0%B2%D0%B5%D1%82%D1%85%D0%BE%D0%B7%D0%B0%D0%B2%D0%B5%D1%82%D0%BD%D1%8B%D0%B5_%D0%BF%D1%80%D0%B0%D0%B2%D0%B5%D0%B4%D0%BD%D0%B8%D0%BA%D0%B8_%D1%81%D1%85%D0%BE%D0%B4%D0%B8%D0%BB%D0%B8_%D0%B2_%D0%B0%D0%B4">詳しく</a>）。</p><p>新約において、いやむしろ主イエス・キリストの来臨と共に、大きな変化が起こりました。</p><ol><li><p><strong>神は</strong>その人性において<strong>目に見える方となられました</strong>（<a href="https://bibleox.com/ja/jp-ni/in/1/#L18">ヨハ. 1:18</a>; <a href="https://bibleox.com/ja/jp-ni/1in/1/#L1-2">１ヨハ. 1:1-2</a>）。</p></li><li><p><strong>神は目に見える姿で天の玉座に着かれました</strong>（<a href="https://bibleox.com/ja/jp-ni/ef/1/#L20-21">エフェ. 1:20-21</a>; <a href="https://bibleox.com/ja/jp-ni/otkr/3/#L21">黙. 3:21</a>）。</p></li><li><p><strong>天に人々が現れました。</strong>彼らは主イエス・キリストと共にある命に達する可能性を受けたのです（<a href="https://bibleox.com/ja/jp-ni/otkr/6/#L9-11">黙. 6:9-11</a>; <a href="https://bibleox.com/ja/jp-ni/otkr/14/#L1,3-5">14:1,3-5</a>）。</p></li><li><p><strong>神は新しい契約を結ばれます</strong>（<a href="https://bibleox.com/ja/jp-ni/ier/31/#L31">エレ. 31:31</a>; <a href="https://bibleox.com/ja/jp-ni/evr/8/#L8">ヘブ. 8:8</a>; <a href="https://bibleox.com/ja/jp-ni/lk/22/#L20">ルカ. 22:20</a>; <a href="https://bibleox.com/ja/jp-ni/1kor/11/#L25">１コリ. 11:25</a>）。<strong>旧い契約はモーセの律法と共に終わりました</strong>（<a href="https://bibleox.com/ja/jp-ni/rim/7/#L6">ロマ. 7:6</a>; <a href="https://bibleox.com/ja/jp-ni/gal/3/#L21-25">ガラ. 3:21-25</a>; <a href="https://bibleox.com/ja/jp-ni/ef/2/#L14-16">エフェ. 2:14-16</a>）。神を描くことの禁止は効力を失います。それはモーセの律法の一部であり、モーセの律法はキリストの来臨と共に廃止されたからです（<a href="https://bibleox.com/ru/ru/w/%D0%91%D0%B8%D0%B1%D0%BB%D0%B8%D1%8F-%D0%97%D0%B0%D0%BA%D0%BE%D0%BD-%D0%9C%D0%BE%D0%B8%D1%81%D0%B5%D1%8F-%D0%BE%D1%82%D0%BC%D0%B5%D0%BD%D0%B0">詳しく</a>）。</p></li></ol><p>こうして、旧約の神殿は旧約の天の現実の像でしたが、その天の現実は新約において変わりました。以前のものはもはや存在しません。そして神殿は神の初めからの計画によって天の現実の像であったのですから、その現実が変わった後では、古いものを描くことにはもはや意味がありません。それゆえ、キリスト者は最も古い時代から新しい天の現実を描き、すべての頭に、明らかに天の玉座に着かれたイエス・キリスト（神）の像を置き、その周りに、その聖なる僕たちの像を置いてきました。今やそれは天使たちだけでなく、人々でもあります。</p><p>キリストのいけにえの後のエルサレムの神殿の損傷は、象徴的な出来事です。</p><blockquote><p>「そのとき、<strong>神殿の垂れ幕が上から下まで真っ二つに裂け、地震が起こり、岩が裂け</strong>、墓が開いて、<strong>眠りについていた多くの聖なる者たちの体が生き返った。そして、イエスの復活の後、墓から出て来て</strong>、聖なる都に入り、多くの人々に現れた」（<a href="https://bibleox.com/ja/jp-ni/mf/27/#L51-53">マタ. 27:51-53</a>）</p></blockquote><p>そして70年代に、神殿はローマ人によって完全に破壊され、その後のすべての千年紀にわたって、天の現実の新しい像、すなわち正教の教会堂に場所を譲ったのです。</p><img src="https://res.bibleox.com/s/img/image/simple/686bea5b5f47da2505d3ae31/s_p_pjRHeoFaUpKPoyEH.jpg"><p>［<a href="https://res.bibleox.com/s/img/image/simple/686bea5b5f47da2505d3ae31/m_p_pjRHeoFaUpKPoyEH.jpg">拡大</a>］［<a href="https://res.bibleox.com/s/img/image/simple/686cf7375f47da2505d3ae4f/m_p_MOsOWI2vEXUj5ELf.jpg">別版</a>］</p><img src="https://res.bibleox.com/s/img/image/simple/686d23425f47da2505d3ae55/s_p_LzqgbhnIsbqtghoc.jpg"><p>［<a href="https://res.bibleox.com/s/img/image/simple/686d23425f47da2505d3ae55/m_p_LzqgbhnIsbqtghoc.jpg">拡大</a>］</p><p>古代のイコンをさらに見る（ロシア語）：<a href="https://bibleox.com/ru/ru/w/%D0%B4%D1%80%D0%B5%D0%B2%D0%BD%D0%B8%D0%B5-%D0%B8%D0%BA%D0%BE%D0%BD%D1%8B">古代のイコン</a></p><p>旧約の天の現実の像が古くなっただけでなく、旧い契約そのもの、その不可欠な一部であるモーセの律法も古くなり、今では意味を失いました。神を描くことの禁止のほかにも、新約ではもはや適用されない規定がたくさんあります。</p><blockquote><p>「<strong>主の御名を呪う者は死刑に処せられる</strong>。共同体全体が彼を石で打ち殺す。神の御名を呪うならば、寄留する者も土地に生まれた者も同じく、<strong>死刑に処せられる</strong>」（<a href="https://bibleox.com/ja/jp-ni/lev/24/#L16">レビ. 24:16</a>）</p></blockquote><p>神の名を冒瀆することは、<strong>第三の戒め</strong>に対する罪です。モーセの律法による罰は死です（<a href="https://bibleox.com/ja/jp-ni/lev/24/#L16">レビ. 24:16</a>）。知られている限り、イコンの反対者たちは、神を冒瀆した人を殺すべきだとは教えていません。彼らは「これは神の言葉だ」と言ってその引用を示し、神を描くことについての旧約の禁止を守るよう要求しますが、冒瀆者を死刑にせよという戒めも神の言葉であり、同じようにはっきりと書かれているのに、それは行いません。なぜでしょうか。モーセの律法は廃止されたからです。</p><p><strong>第四の戒め</strong>は、安息日の休み、すなわち労働を控えることを定めています（<a href="https://bibleox.com/ja/jp-ni/ish/20/#L8-10">出. 20:8-10</a>; <a href="https://bibleox.com/ja/jp-ni/vtor/5/#L12-15">申. 5:12-15</a>; <a href="https://bibleox.com/ja/jp-ni/lev/19/#L3">レビ. 19:3</a>; <a href="https://bibleox.com/ja/jp-ni/lev/19/#L30">レビ. 19:30</a>）。モーセの律法による罰は死です。これも神の言葉であり、同じようにはっきりと書かれていますが、イコンの反対者たちは安息日の休みを破った人を殺すべきだとは教えず、その大部分は安息日の休みそのものさえ守っていません。なぜでしょうか。モーセの律法は廃止されたからです。</p><p>このように、受肉した神を描くことを禁じるということは、次のことを意味します。</p><ol><li><p><strong>ユダヤ教化すること</strong>：モーセの律法に従って生き続けること（ちなみに、ある人々が<a href="https://bibleox.com/ru/ru/w/ozcY_%D0%9E_%D0%B4%D0%B5%D1%81%D1%8F%D1%82%D0%B8%D0%BD%D0%B5">十分の一</a>（ロシア語）を集めているのも同じ理由からです）。</p></li><li><p><strong>神の受肉を間接的に否定すること</strong>：キリストが神であることを否定するか、キリストが目に見える方であることを否定すること。</p></li></ol><p>では、この問題をさらに詳しく検討しましょう。</p><h2>モーセの律法の第二の戒め</h2><p>イコンの反対者たちは、イコンを<a href="https://bibleox.com/ru/ru/w/10-%D0%B7%D0%B0%D0%BF%D0%BE%D0%B2%D0%B5%D0%B4%D0%B5%D0%B9">モーセの律法</a>の第二の戒めへの違反と見なしています。</p><blockquote><ol start="2"><li><p>「<strong>あなたはいかなる像も造ってはならない</strong>。上は天にあり、下は地にあり、また地の下の水の中にある、<strong>いかなるものの形も造ってはならない</strong>。<strong>あなたはそれらに向かってひれ伏したり</strong>、それらに仕えたりしてはならない」（<a href="https://bibleox.com/ja/jp-ni/ish/20/#L4-5">出. 20:4-5</a>; <a href="https://bibleox.com/ja/jp-ni/vtor/5/#L8-9">申. 5:8-9</a>）</p></li></ol></blockquote><p>モーセの十戒は2つの部分（2枚の板）に分かれています。</p><ul><li><p>神への愛についての4つの戒め。</p></li><li><p>隣人への愛についての6つの戒め。</p></li></ul><p>第二の戒めは神への愛の表れに属しており、あらゆる像やひれ伏しを禁じているのではなく、唯一のまことの神の代わりに神々として崇める物を造ることを禁じています。言い換えれば、<strong>この</strong><strong>戒めは<u>偽りの</u><u>神々</u>を拝むことを禁じている</strong>のです。だからこそ、聖書の中には、この戒めに矛盾しない像もひれ伏しも見られるのです。これについては、さらに後で述べます。</p><h3>「像を造ってはならない」</h3><h4>神は御自分の神殿に像を造るよう命じられる</h4><p>第二の戒めによって像は禁じられていますが、この戒めを与えた同じ神が、今度は御自分の神殿（幕屋）に、幕屋の幕や至聖所に通じる垂れ幕にケルビムの像を造り、契約の箱の蓋の上に金のケルビムの彫像を造るよう命じておられます。</p><blockquote><p>「<strong>主はモーセに仰せになった</strong>。&lt;…&gt; <strong>幕屋は<mark>十枚の幕</mark>で造りなさい</strong>。亜麻のより糸、青、紫、緋色の毛糸を使い、<strong>意匠家の描いたケルビムの模様を織り込みなさい</strong>」（<a href="https://bibleox.com/ja/jp-ni/ish/25/#L1">出. 25:1</a>; <a href="https://bibleox.com/ja/gr-lxx-byz/ish/26/#L1">26:1</a>、ギリシア語からの訳）</p></blockquote><blockquote><p>「<strong>青、紫、緋色の毛糸、亜麻のより糸で<mark>垂れ幕</mark>を作りなさい</strong>。<strong>それにケルビムの模様を織り込みなさい</strong>」（<a href="https://bibleox.com/ja/gr-lxx-byz/ish/26/#L31">出. 26:31</a>、ギリシア語からの訳）</p></blockquote><blockquote><p>「<strong>打ち出し作りで一対のケルビムを作り</strong>、<strong><mark>贖いの座の両端</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/ish/25/#L18">出. 25:18</a>）</p></blockquote><p><em>（出エジプト記26章は、このサイトの新共同訳のデータに含まれていないため、七十人訳から訳しています。）</em></p><p>ソロモンが建てた後の神殿には、さらに多くのさまざまな像や彫像がありました。</p><blockquote><p>「彼は、青の織物、深紅の織物、緋の織物、麻の織物で<strong><mark>垂れ幕</mark></strong>を作ったが、<strong>それにもケルビムの縫い取りを施した</strong>」（<a href="https://bibleox.com/ja/jp-ni/2par/3/#L14">代下. 3:14</a>）</p></blockquote><blockquote><p>「彼は、<strong><mark>至聖所の中に</mark>二体のケルビムを</strong>鋳物で造り、それを金で覆った」（<a href="https://bibleox.com/ja/jp-ni/2par/3/#L10">代下. 3:10</a>）</p></blockquote><blockquote><p>「ソロモンはオリーブ材で<strong>二体のケルビムを作り、<mark>内陣</mark>に据えた</strong>。その高さは十アンマであった」（<a href="https://bibleox.com/ja/jp-ni/3ts/6/#L23">王上. 6:23</a>）</p></blockquote><p>神殿の詳しい構造（ロシア語）：<a href="https://bibleox.com/ru/ru/w/%D0%B8%D0%B5%D1%80%D1%83%D1%81%D0%B0%D0%BB%D0%B8%D0%BC%D1%81%D0%BA%D0%B8%D0%B9-%D1%85%D1%80%D0%B0%D0%BC">エルサレムの神殿</a></p><p>神殿の祭具を作るために、神は職人に聖霊の賜物を与えられました。</p><blockquote><p>「主はモーセにこう仰せになった。見よ、わたしはユダ族のフルの孫、ウリの子ベツァルエルを名指しで呼び、<strong>彼に神の霊を満たし、どのような工芸にも知恵と英知と知識をもたせ</strong>、金、銀、青銅による細工に意匠をこらし、宝石をはめ込み、木に彫刻するなど、すべての工芸をさせる」（<a href="https://bibleox.com/ja/jp-ni/ish/31/#L1-5">出. 31:1-5</a>）</p></blockquote><h4>神は蛇の像を造るよう命じられた</h4><p>神はまた、青銅の蛇を造るよう命じ、それを見る人々が蛇にかまれても奇跡的に救われるようにされました。</p><blockquote><p>「主はモーセに言われた。『<strong>あなたは炎の蛇を造り</strong>、旗竿の先に掲げよ。蛇にかまれた者がそれを見上げれば、命を得る』」（<a href="https://bibleox.com/ja/jp-ni/chis/21/#L8">民. 21:8</a>）</p></blockquote><p>非常に大切なのは、この蛇がイエス・キリストの像であり、キリストの将来の十字架の苦しみを指し示すものであったことです。</p><blockquote><p>「そして、<strong>モーセが荒れ野で蛇を上げたように、人の子も上げられねばならない</strong>。それは、信じる者が皆、人の子によって永遠の命を得るためである」（<a href="https://bibleox.com/ja/jp-ni/in/3/#L14-15">ヨハ. 3:14-15</a>）</p></blockquote><p>この蛇は、のちにヒゼキヤ王によって打ち砕かれました。イスラエル人が蛇そのものを神と見なし始め、まことの神とは何の関係もない偽りの名（ネフシュタン）をそれに与えたからです。彼らはまことの神を捨て、第二の戒めを破ったのです。</p><blockquote><p>「聖なる高台を取り除き、石柱を打ち壊し、アシェラ像を切り倒し、モーセの造った青銅の蛇を打ち砕いた。イスラエルの人々は、このころまで<strong>これを<mark>ネフシュタン</mark>と呼んで、これに香をたいていた</strong>からである」（<a href="https://bibleox.com/ja/jp-ni/4ts/18/#L4">王下. 18:4</a>）</p></blockquote><h3>像にひれ伏してはならない</h3><p>像にひれ伏すことは禁じられていますが、義人たちは絶えず、人に、さまざまな物に、天使にひれ伏しています。ほかの人々も預言者たちにひれ伏しています。これらのひれ伏しは偽りの神々（偶像）に対してなされたものではないので、だれも彼らを偶像礼拝のかどで断罪しません。</p><h4>天使たちの姿をとった神にひれ伏す</h4><p>アブラハムは、三人の人の姿をとった神にひれ伏します。</p><blockquote><p><em>「</em><strong><em>主は［像の姿で］</em></strong><em>マムレの樫の木の所で</em><strong><em>アブラハムに現れた</em></strong><em>（七十人訳ギリシア語 θεὸς —「神」、ヘブライ語 יְהוָ֔ה —「ヤハウェ」）。暑い真昼に、アブラハムは天幕の入り口に座っていた。目を上げて見ると、</em><strong><em>三人の人</em></strong><em>が彼に向かって立っていた。アブラハムはすぐに天幕の入り口から走り出て迎え、</em><strong><em>地にひれ伏して</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/gen/18/#L1-2"><em>創. 18:1-2</em></a><em>）</em></p></blockquote><p>なぜ神は像の姿で現れたのでしょうか。神は本性において見えない方であり、だれも神を見たことがないからです（<a href="https://bibleox.com/ja/jp-ni/1tim/6/#L16">１テモ. 6:16</a>; <a href="https://bibleox.com/ja/jp-ni/in/1/#L18">ヨハ. 1:18</a>）。</p><h4>天使にひれ伏す</h4><p>まず注意すべきなのは、天使は霊であり（<a href="https://bibleox.com/ja/jp-ni/evr/1/#L13-14">ヘブ. 1:13-14</a>）、霊には肉も骨もない（<a href="https://bibleox.com/ja/jp-ni/lk/24/#L39">ルカ. 24:39</a>）ということです。つまり、天使もまた人の姿で人々に現れるのです。したがって、だれかが天使にひれ伏すなら、その人は<strong>見えない霊（天使）の見える像にひれ伏している</strong>のです。</p><blockquote><p><em>「彼は答えた。『いや。わたしは主の軍の将軍である。今、着いたところだ。』ヨシュアは地にひれ伏して</em><strong><em>拝し</em></strong><em>、彼に、『わが主は、この僕に何をお言いつけになるのですか』と言うと」（</em><a href="https://bibleox.com/ja/jp-ni/nav/5/#L14"><em>ヨシュ. 5:14</em></a><em>）</em></p></blockquote><h4>預言者にひれ伏す</h4><blockquote><p><em>「エリコの預言者の仲間たちは目の前で彼を見て、『エリヤの霊がエリシャの上にとどまっている』と言い、彼を迎えに行って、</em><strong><em>その前で地にひれ伏した</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/4ts/2/#L15"><em>王下. 2:15</em></a><em>）</em></p></blockquote><h4>神殿にひれ伏す</h4><p>ダビデは神殿にひれ伏しました。神殿はそれ自体が天のイコンであり（<a href="https://bibleox.com/ja/jp-ni/lev/19/#L30">レビ. 19:30</a>; <a href="https://bibleox.com/ja/jp-ni/lev/26/#L2">26:2</a>）、聖なる天使たちの像で満たされていました（<a href="https://bibleox.com/ja/jp-ni/ish/25/#L1">出. 25:1</a>; <a href="https://bibleox.com/ja/gr-lxx-byz/ish/26/#L1">26:1</a>）。</p><blockquote><p>「しかしわたしは、深い慈しみをいただいてあなたの家に入り、<strong>聖なる宮に向かってひれ伏し</strong>あなたを畏れ敬います」（<a href="https://bibleox.com/ja/jp-ni/ps/5/#L8">詩. 5:8</a>）<em>（七十人訳ギリシア語 προσκυνήσω πρὸς ναὸν ἅγιόν σου —「あなたの聖なる宮に向かってひれ伏します」）</em></p></blockquote><p>そして神は、神殿を敬うよう命じられました（<a href="https://bibleox.com/ja/jp-ni/lev/19/#L30">レビ. 19:30</a>; <a href="https://bibleox.com/ja/jp-ni/lev/26/#L2">26:2</a>）。</p><h4>神の足台（神殿）にひれ伏す</h4><blockquote><p>「我らの神、主をあがめよ。<strong>その足台</strong>（足を載せる台、すなわち神殿 — 注）<strong>に向かってひれ伏せ。主は聖なる方</strong>」（<a href="https://bibleox.com/ja/jp-ni/ps/99/#L5">詩. 99:5</a>）<em>（七十人訳ギリシア語 προσκυνεῖτε τῷ ὑποποδίῳ τῶν ποδῶν αὐτοῦ —「その御足の足台にひれ伏せ」）</em></p></blockquote><blockquote><p>「わたしたちは<strong>主のいます所に行き御足を置かれる所に向かって伏し拝もう</strong>」（<a href="https://bibleox.com/ja/jp-ni/ps/132/#L7">詩. 132:7</a>）</p></blockquote><h4>契約の箱の前にひれ伏す</h4><p>ヌンの子ヨシュアは、聖なるケルビムの彫像がある契約の箱の前にひれ伏しました。</p><blockquote><p><em>「ヨシュアは衣服を引き裂き、イスラエルの長老たちと共に、</em><strong><em>主の箱の前で夕方まで地にひれ伏し</em></strong><em>、頭に塵をかぶった」（</em><a href="https://bibleox.com/ja/jp-ni/nav/7/#L6"><em>ヨシュ. 7:6</em></a><em>）</em></p></blockquote><h4>杖にひれ伏す</h4><blockquote><p><em>杖に：「『では、誓ってくれ』と言ったので、ヨセフは誓った。</em><strong><em>イスラエルは、寝台の枕もとで感謝を表した</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/gen/47/#L31"><em>創. 47:31</em></a><em>）。「感謝を表した」は、ヘブライ語原文では וַיִּשְׁתַּחוּ —「ひれ伏した」です。七十人訳では</em><strong><em>杖に</em></strong><em>（ギリシア語 προσεκύνησεν Ισραηλ ἐπὶ τὸ ἄκρον τῆς ῥάβδου αὐτοῦ —「イスラエルは自分の杖の先にひれ伏した」）となっています。</em><a href="https://bibleox.com/ja/jp-ni/evr/11/#L21"><em>ヘブ. 11:21</em></a><em>も参照。</em></p></blockquote><p>さらに多くの例（ロシア語）：<a href="https://bibleox.com/ru/ru/w/%D0%BF%D0%BE%D0%BA%D0%BB%D0%BE%D0%BD%D1%8B">ひれ伏し（伏拝）</a></p><h3>偶像への異教の信仰は第二の戒めを破る</h3><p>偶像への異教の信仰は第二の戒めを破ることにつながります。それは<u>どの場合にも</u>、存在しない<u>偽りの</u><u>神</u>を拝むことを求めるからです。モレク、バアル、ゼウス、ユピテル、ペルーンは存在しません。それらは偽りの神々です。</p><p>偶像への異教の信仰には、最も広まっているものから順に、三つの種類があります。</p><ol><li><p><strong>偶像が神そのものである</strong>。異教徒が造った物（偶像）が、それ自体として神である。</p></li><li><p><strong>偶像は偽りの神の像である</strong>。その神はあたかも遠くにいるかのようだが、こういう姿をしているはずだとされる。</p></li><li><p><strong>偶像は</strong>（神格化された）<strong>自然の力を</strong><strong>考え出して描いた像</strong>である。海、風、雨、火、大地など。</p></li></ol><p>三つのどの場合も、<u>存在しない</u><u>偽りの</u><u>神</u>が崇められています。これは偽りへの信仰です。</p><p>聖書の中で出会うのは、まさに第一の種類です。聖書のページにその描写を見いだすことのできる最も広まった異教の信仰は、<u>物そのもの（物質）を神格化すること</u>です。異教徒は手近な材料から自分のために神を造ることも、すでに存在している自然の物や現象を神格化することもできました。動物、木、石、山、太陽、星、風、海、雷雨などの物質です。預言者たちは偶像礼拝を糾弾し、異教徒が一本の木の一部で食べ物を調理し、同じ木の別の部分を自分の神と呼んだと言っています。</p><blockquote><p><em>「彼は林の中で力を尽くし</em><strong><em>樅を切り、柏や樫の木を選び</em></strong><em>また、樅の木を植え、雨が育てるのを待つ。</em><strong><em>木は薪になるもの。人はその一部を取って体を温め一部を燃やしてパンを焼きその木で<mark>神を造って</mark>それにひれ伏し木像に仕立ててそれを拝むのか</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/is/44/#L14-15"><em>イザ. 44:14-15</em></a><em>）</em></p></blockquote><blockquote><p><em>「そのとき、ラバンは羊の毛を刈りに出かけていたので、</em><strong><em>ラケルは父の家の守り神の像を盗んだ</em></strong><em>。&lt;…&gt; 父の家が恋しくて去るのなら、去ってもよい。しかし、</em><strong><em>なぜ<mark>わたしの守り神を盗んだ</mark>のか</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/gen/31/#L19,30"><em>創. 31:19,30</em></a><em>）</em></p></blockquote><blockquote><p><em>「航海に出て荒波を越え行こうとする人は、自分を運ぶ船よりももろい</em><strong><em>船首の木の像に助けを求める</em></strong><em>。&lt;…&gt; こうして、</em><strong><em><mark>刻まれた像が</mark></em></strong><em>支配者たちの命令で</em><strong><em><mark>礼拝されるようになり</mark></em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/prs/14/#L1,16"><em>知. 14:1,16</em></a><em>）</em></p></blockquote><blockquote><p><em>「王は言った。</em><strong><em>『ベルが生きた神だとは思わないのか。毎日どれほど食べたり飲んだりしているか、見えないのか』</em></strong><em>」（</em><a href="https://bibleox.com/ja/ru/dan/14/#L6"><em>ベルと竜（ダニ. 14:6）</em></a><em>、ロシア語の宗務院訳からの訳。この箇所は新共同訳のデータには含まれていません）</em></p></blockquote><blockquote><p><em>「偶像に供え物をしても無駄ではないか。</em><strong><em><mark>食べることもかぐこともできないのだから</mark></em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/prsir/30/#L19"><em>シラ. 30:19</em></a><em>）</em></p></blockquote><blockquote><p><em>「あのパウロは</em><strong><em><mark>『手で造ったものなどは神ではない』</mark></em></strong><em>と言って、エフェソばかりでなくアジア州のほとんど全地域で、多くの人を説き伏せ、たぶらかしている。</em><strong><em>これでは、我々の仕事の評判が悪くなってしまうおそれがあるばかりでなく（！）</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/act/19/#L24-27"><em>使. 19:24-27</em></a><em>）</em></p></blockquote><p>聖書のほかの同様の箇所（ロシア語）：<a href="https://bibleox.com/ru/ru/w/%D1%8F%D0%B7%D1%8B%D1%87%D0%B5%D1%81%D0%BA%D0%B0%D1%8F-%D0%B2%D0%B5%D1%80%D0%B0-%D0%B2-%D0%B8%D0%B4%D0%BE%D0%BB%D0%B0">偶像への異教の信仰</a></p><p>古代の哲学者たちは、考える人々として、自分たちの異教の信仰を弁護する中で、人の手で加工された物質が神でありえないことに気づくようになりました。彼らは、それは神の像にすぎない、あるいは自然の力を考え出して描いた像にすぎない、と別の判断を述べることもできました。しかし第二の戒めはやはり破られています。彼らはまことの神ではなく、<strong>偽りの神</strong>を拝んでいるからです。</p><p>異教の神が偽りであるのは、その名や像のためだけではありません。神についての偽りは、神々の数、その能力、その本質的な特性、そして何よりも、戒めの中に現される被造物に対する神の御心にも現れます。</p><p>わかりやすくするために、項目ごとに比べてみましょう。</p><h4>異教の神々</h4><ul><li><p>偽りの名（モレク、バアル、ゼウス、ペルーンなど）</p></li><li><p>偽りの姿（さまざまな人間に似た像）</p></li><li><p>偽りの能力（限られている。多くの異教の神々はそれぞれ異なる能力を持っている）</p></li><li><p>偽りの意志（まことの神が戒めの中に示された意志ではない）</p></li><li><p>偽りの本質的特性（永遠でも、遍在でも、全知でも、無限でも、不死でも、聖でもない）</p></li><li><p>別の（偽りの）場所へ、別の（偽りの）道によって招く</p></li></ul><h4>正教会が信じる神</h4><ul><li><p>聖書にあるまことの神の名（在る者、父、子、聖霊、イエス・キリスト、そして<a href="https://bibleox.com/ja/ja/w/CZmA_神の御名/">そのほか</a>）</p></li><li><p>神御自身が世に御自分を現された像（アブラハムのもとの三人の天使 — <a href="https://bibleox.com/ja/jp-ni/gen/18/#L1-2"><em>創. 18:1-2</em></a>、鳩 — <a href="https://bibleox.com/ja/jp-ni/lk/3/#L22"><em>ルカ. 3:22</em></a>、そしてついに、神の子が本当になられた人の姿、すなわちイエス・キリスト）</p></li><li><p>宇宙の全能の創造主が描かれる</p></li><li><p>神の戒めを果たすよう招く方（キリストは、戒めの書かれた開いた書物を持った姿で描かれる）</p></li><li><p>十字架の道を通して御自分と共にある命へと招く神が描かれる（キリストは十字の光輪をつけて十字架の上に描かれる）</p></li></ul><p>このように、異教徒は像を神、あるいは（偽りの）神の像と考えますが、正教会はまことの神を描き、物そのもの（イコン）を神とは考えません。</p><p>正教会はまた、神の友たち、すなわちおとめマリア、生神女、天使たち、使徒たち、義人たちを描きます。これは偽りではありません。彼らは皆実在しています。そして、これらの聖なる人々や天使たち自身も、その像も、神々とは見なされていません。</p><p>正教会のすべてのイコンは、福音書や十字架と同等に、聖なる物として崇敬されています。その崇敬は、まことの神と、神の実在する友たちに向けられているのです。</p><h3>第二の戒めの理由</h3><p>このように、神は聖人たちの像を造ることを禁じなかったばかりか、造るよう命じさえされましたが（<a href="https://bibleox.com/ja/jp-ni/ish/25/#L1">出. 25:1</a>; <a href="https://bibleox.com/ja/gr-lxx-byz/ish/26/#L1">26:1</a>）、第二の戒めによって御自分の像を造ることは禁じられました。神はその禁止の理由を説明しておられます。神が律法を与えたとき、<strong>御自分の</strong>像を何も示されなかったのは、イスラエル人が<strong>神を</strong>描こうとし、その後、唯一のまことの神の代わりに像や彫像そのものに神々として仕え始めることがないようにするためでした。</p><blockquote><p>「あなたたちは自らよく注意しなさい。<strong>主がホレブで火の中から語られた日、<mark>あなたたちは何の形も見なかった</mark></strong>。<strong><mark>堕落して、自分のためにいかなる形の像も造ってはならない</mark></strong>。男や女の形も、地上のいかなる獣の形も、空を飛ぶ翼のあるいかなる鳥の形も、地上を這ういかなる動物の形も、地下の海に住むいかなる魚の形も。また目を上げて天を仰ぎ、太陽、月、星といった天の万象を見て、<strong><mark>これらに惑わされ、ひれ伏し仕えてはならない</mark></strong>。それらは、あなたの神、主が天の下にいるすべての民に分け与えられたものである」（<a href="https://bibleox.com/ja/jp-ni/vtor/4/#L15-19">申. 4:15-19</a>）</p></blockquote><p>この警告は非常に根拠のあるものでした。当時、地球全体が異教であり、そのような偶像を拝んでいたからです。今日では、異教徒が自分の手で造った製品を文字どおり神と考えていたということを、わざわざ説明しなければならないほどです。</p><h2>キリストの来臨と共に変化が起こる</h2><h3>1. 旧い契約とモーセの律法は終わる</h3><blockquote><p>「しかし今は、わたしたちは、<strong>自分を縛っていた律法に対して死んだ者となり</strong>、律法から解放されています。その結果、文字に従う古い生き方ではなく、“霊”に従う新しい生き方で仕えるようになっているのです」（<a href="https://bibleox.com/ja/jp-ni/rim/7/#L6">ロマ. 7:6</a>）</p></blockquote><blockquote><p>「こうして<strong>律法は、わたしたちをキリストのもとへ導く養育係となったのです</strong>。わたしたちが信仰によって義とされるためです。しかし、信仰が現れたので、<strong>もはや、わたしたちはこのような養育係の下にはいません</strong>」（<a href="https://bibleox.com/ja/jp-ni/gal/3/#L24-25">ガラ. 3:24-25</a>）</p></blockquote><blockquote><p>「実に、キリストはわたしたちの平和であります。二つのものを一つにし、御自分の肉において敵意という隔ての壁を取り壊し、<strong>規則と戒律ずくめの律法を廃棄されました</strong>。こうしてキリストは、双方を御自分において一人の新しい人に造り上げて平和を実現し」（<a href="https://bibleox.com/ja/jp-ni/ef/2/#L14-15">エフェ. 2:14-15</a>）</p></blockquote><p><strong>キリストは新しい契約を結び、それによってモーセの律法と共に旧い契約を終わらせられます</strong>（<a href="https://bibleox.com/ja/jp-ni/rim/7/#L6">ロマ. 7:6</a>; <a href="https://bibleox.com/ja/jp-ni/gal/3/#L21-25">ガラ. 3:21-25</a>; <a href="https://bibleox.com/ja/jp-ni/ef/2/#L14-16">エフェ. 2:14-16</a>）。神を描くことの禁止はモーセの律法の一部であり、モーセの律法はキリストの来臨と共に廃止されました（<a href="https://bibleox.com/ru/ru/w/%D0%91%D0%B8%D0%B1%D0%BB%D0%B8%D1%8F-%D0%97%D0%B0%D0%BA%D0%BE%D0%BD-%D0%9C%D0%BE%D0%B8%D1%81%D0%B5%D1%8F-%D0%BE%D1%82%D0%BC%D0%B5%D0%BD%D0%B0">詳しく</a>）。モーセを通して神が与えた戒めは、その文字どおりの意味を失います。わたしたちは安息日の休みを守らず（安息日の休みを破る者を殺しもせず）、動物をいけにえとしてささげず、割礼を受けず、ユダヤ教の祭りを祝わず、十分の一を納めず、モーセの律法のほかの非常に多くの命令も果たしません。旧い契約とモーセの律法はそのようなものとしては廃止され、新約の信じる者たちは、文字ではなく霊に仕える者となるよう招かれているのです（<a href="https://bibleox.com/ja/jp-ni/2kor/3/#L6">２コリ. 3:6</a>）。すなわち、あれこれの神の定めの理由を理解し、その意味に分け入り、戒めの本質を守るということです。</p><p>第二の戒めの文字どおりの意味は、神だけを描くことを禁じており、神の聖なる僕たちを描くことは禁じていませんでした（<a href="https://bibleox.com/ja/jp-ni/ish/25/#L1">出. 25:1</a>; <a href="https://bibleox.com/ja/gr-lxx-byz/ish/26/#L1">26:1</a>）。</p><p>第二の戒めの本質は、<strong><u>偽りの</u><u>神々</u>を拝まないこと</strong>です。</p><p>したがって、正教会が聖人たちを描くのは、それがかつて禁じられたことがなく、むしろ命じられさえしたからであり（<a href="https://bibleox.com/ja/jp-ni/ish/25/#L1">出. 25:1</a>; <a href="https://bibleox.com/ja/gr-lxx-byz/ish/26/#L1">26:1</a>）、義人たちがそれらの像の前にひれ伏したからです（<a href="https://bibleox.com/ja/jp-ni/nav/7/#L6">ヨシュ. 7:6</a>; <a href="https://bibleox.com/ja/jp-ni/ps/5/#L8">詩. 5:8</a>）。一方、神を描くことは、だれも神を見たことがなかったので、旧約においてだけモーセの律法によって禁じられていました。そしてモーセの律法は廃止されたのですから、モーセの律法の一部としての神を描くことの禁止も廃止されたのです。</p><h3>2. 神は人の本性をとって（受肉して）目に見える方となられた</h3><p>旧約において神は、民が律法を受けたとき御自分の像を示されなかったことを説明して、御自分を描くことを禁じておられます（<a href="https://bibleox.com/ja/jp-ni/vtor/4/#L15-19">申. 4:15-19</a>）。しかし、新しい契約を結び、新しい教えを与えるにあたって（<a href="https://bibleox.com/ja/jp-ni/ef/2/#L15">エフェ. 2:15</a>）、神は御自身を現し、その人の本性において目に見える方となり、モーセの律法を廃止されました。それゆえ今や、聖人たちだけでなく、神御自身をも、神が御自分を現された姿で描くことができるのです。</p><blockquote><p>「<strong><em>いまだかつて、神を見た者はいない</em></strong><em>。父のふところにいる独り子である神、この方が神を</em><strong><em>示された</em></strong><em>のである</em>」（<a href="https://bibleox.com/ja/jp-ni/in/1/#L18">ヨハ. 1:18</a>）</p></blockquote><blockquote><p>「<em>初めからあったもの、わたしたちが聞いたもの、</em><strong><em>目で見たもの、よく見て</em></strong><em>、手で触れたものを伝えます。すなわち、</em><strong><em>命の言について</em></strong><em>。この命は現れました。</em><strong><em>御父と共にあったが、わたしたちに現れたこの永遠の命</em></strong><em>を、わたしたちは見て、あなたがたに証しし、伝えるのです</em>」（<a href="https://bibleox.com/ja/jp-ni/1in/1/#L1-2">１ヨハ. 1:1-2</a>）</p></blockquote><h3>3. 天の現実が変わる</h3><p>神殿は、地上の建物として、神の計画によって初めから天の現実の像でした。神が預言者モーセに神殿を建てるよう命じられたのは、神が神殿を必要とされたからではなく（神はそれを必要とされませんでした：<a href="https://bibleox.com/ja/jp-ni/is/66/#L1">イザ. 66:1</a>; <a href="https://bibleox.com/ja/jp-ni/ps/50/#L13">詩. 50:13</a>; <a href="https://bibleox.com/ja/jp-ni/is/1/#L11">イザ. 1:11</a>）、まさに天のイコンとして、預言者に示された天の現実の像として神殿を造るよう命じられたのです（<a href="https://bibleox.com/ja/jp-ni/ish/25/#L8-9,40">出. 25:8-9,40</a>; <a href="https://bibleox.com/ja/jp-ni/evr/9/#L24">ヘブ. 9:24</a>）。旧約には一つの天の現実があり、新約には別の天の現実があります。以前には、天の現実には<strong>天使たちだけ</strong>が霊的に目に見える仕方で住んでいました。神はまったく非物質的で見えない方であり（神の子はまだ目に見える人の本性をとっておられませんでした）、人々はまだ天の命に達しておらず、死後は陰府に下っていたからです（<a href="https://bibleox.com/ru/ru/w/9VFT_%D0%94%D0%BE_%D0%B6%D0%B5%D1%80%D1%82%D0%B2%D1%8B_%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%BE%D0%B2%D0%BE%D0%B9_%D0%B2%D0%B5%D1%82%D1%85%D0%BE%D0%B7%D0%B0%D0%B2%D0%B5%D1%82%D0%BD%D1%8B%D0%B5_%D0%BF%D1%80%D0%B0%D0%B2%D0%B5%D0%B4%D0%BD%D0%B8%D0%BA%D0%B8_%D1%81%D1%85%D0%BE%D0%B4%D0%B8%D0%BB%D0%B8_%D0%B2_%D0%B0%D0%B4">詳しく</a>）。</p><p>しかし、キリストの来臨の後、変化が起こります。</p><ol><li><p><strong>神であるキリストは、目に見える姿で天の玉座に着かれました</strong>（<a href="https://bibleox.com/ja/jp-ni/ef/1/#L20-21">エフェ. 1:20-21</a>; <a href="https://bibleox.com/ja/jp-ni/otkr/3/#L21">黙. 3:21</a>）。</p></li><li><p>（キリスト御自身のほかに）<strong>天に人々が現れました</strong>。彼らは天でキリストと共にある命への道を得たのです（<a href="https://bibleox.com/ja/jp-ni/otkr/6/#L9-11">黙. 6:9-11</a>; <a href="https://bibleox.com/ja/jp-ni/otkr/14/#L1,3-5">黙. 14:1,3-5</a>; <a href="https://bibleox.com/ja/jp-ni/evr/12/#L22-24">ヘブ. 12:22-24</a>）。</p></li></ol><p>天の現実は変わりました。以前のものはもはや存在しません。エルサレムの神殿は、現在の天の現実ではなく、過去の天の現実の像となりました。それゆえ、キリスト者は最も古い時代から新しい天の現実を描き、すべての頭に、明らかに天の玉座に着かれたイエス・キリスト（神）の像を置き、その周りに、今や人々をも含むその聖なる僕たちを置いてきたのです。</p><p>キリストのいけにえの後のエルサレムの神殿の損傷は、象徴的な出来事です。</p><blockquote><p>「そのとき、<strong>神殿の垂れ幕が上から下まで真っ二つに裂け、地震が起こり、岩が裂け</strong>、墓が開いて、<strong>眠りについていた多くの聖なる者たちの体が生き返った。そして、イエスの復活の後、墓から出て来て</strong>、聖なる都に入り、多くの人々に現れた」（<a href="https://bibleox.com/ja/jp-ni/mf/27/#L51-53">マタ. 27:51-53</a>）</p></blockquote><p>そして70年代に、神殿はローマ人によって完全に破壊され、その後のすべての千年紀にわたって、天の現実の新しい像、すなわち正教の教会堂に場所を譲ったのです。</p><img src="https://res.bibleox.com/s/img/image/simple/686bea5b5f47da2505d3ae31/s_p_pjRHeoFaUpKPoyEH.jpg"><p>［<a href="https://res.bibleox.com/s/img/image/simple/686bea5b5f47da2505d3ae31/m_p_pjRHeoFaUpKPoyEH.jpg">拡大</a>］［<a href="https://res.bibleox.com/s/img/image/simple/686cf7375f47da2505d3ae4f/m_p_MOsOWI2vEXUj5ELf.jpg">別版</a>］</p><img src="https://res.bibleox.com/s/img/image/simple/686d23425f47da2505d3ae55/s_p_LzqgbhnIsbqtghoc.jpg"><p>［<a href="https://res.bibleox.com/s/img/image/simple/686d23425f47da2505d3ae55/m_p_LzqgbhnIsbqtghoc.jpg">拡大</a>］</p><p>古代のイコンをさらに見る（ロシア語）：<a href="https://bibleox.com/ru/ru/w/%D0%B4%D1%80%D0%B5%D0%B2%D0%BD%D0%B8%D0%B5-%D0%B8%D0%BA%D0%BE%D0%BD%D1%8B">古代のイコン</a></p><h2>神は御自分のイコンを造られた</h2><p>いまだかつて神を見た者はいません。</p><blockquote><p>「<strong><mark>いまだかつて、神を見た者はいない</mark></strong>。父のふところにいる独り子である神、この方が神を示されたのである」（<a href="https://bibleox.com/ja/jp-ni/in/1/#L18">ヨハ. 1:18</a>）</p></blockquote><p>それでも神は、何度も像（イコン）の姿で現れました。</p><h3>神は三人の天使の姿でアブラハムに現れた</h3><p>三人の天使は、あるがままの神、世界が造られる前からある神ではありません。つまり、これは神の<strong>像</strong>（ギリシア語で εἰκόνα［イコン］）であり、アブラハムは神のイコンの前にひれ伏しているのです。</p><blockquote><p>「<strong>主は［像の姿で］</strong>マムレの樫の木の所で<strong>アブラハムに現れた</strong>（七十人訳ギリシア語 θεὸς —「神」、ヘブライ語 יְהוָ֔ה —「ヤハウェ」）。暑い真昼に、アブラハムは天幕の入り口に座っていた。目を上げて見ると、<strong>三人の人</strong>が彼に向かって立っていた。アブラハムはすぐに天幕の入り口から走り出て迎え、<strong>地にひれ伏して</strong>」（<a href="https://bibleox.com/ja/jp-ni/gen/18/#L1-2">創. 18:1-2</a>）</p></blockquote><p>アブラハムが三人の天使の姿をとった神の像にひれ伏したとき、彼は神に仕えたのでしょうか、それとも神の像に仕えたのでしょうか。明らかに神にです。</p><h3>神は目に見える姿でヤコブと格闘された</h3><blockquote><p>「ヤコブは独り後に残った。そのとき、何者かが夜明けまでヤコブと格闘した。&lt;…&gt; その人は言った。『お前の名はもうヤコブではなく、これからはイスラエルと呼ばれる。<strong>お前は神と</strong>人と<strong>闘って</strong>勝ったからだ。』&lt;…&gt; ヤコブは、『<strong>わたしは顔と顔とを合わせて神を見たのに、なお生きている</strong>』と言って、その場所をペヌエル（神の顔）と名付けた」（<a href="https://bibleox.com/ja/jp-ni/gen/32/#L25,29,31">創. 32:25,29,31</a>）</p></blockquote><h3>神は像を通して預言者モーセと語られた</h3><blockquote><p>「主はこう言われた。『聞け、わたしの言葉を。<strong>あなたたちの間に預言者がいれば主なるわたしは幻によって自らを示し</strong>夢によって彼に語る。<strong>わたしの僕モーセはそうではない</strong>。彼はわたしの家の者すべてに信頼されている。<strong>口から口へ、わたしは彼と語り合うあらわに、謎によらずに。主の姿を彼は仰ぎ見る</strong>。あなたたちは何故、畏れもせずわたしの僕モーセを非難するのか』」（<a href="https://bibleox.com/ja/jp-ni/chis/12/#L6-8">民. 12:6-8</a>）</p></blockquote><h3>神は鳩のようにイエス・キリストの上に降られた</h3><blockquote><p>「<strong>聖霊が鳩のように目に見える姿でイエスの上に降って来た</strong>。すると、『あなたはわたしの愛する子、わたしの心に適う者』という声が、天から聞こえた」（<a href="https://bibleox.com/ja/jp-ni/lk/3/#L22">ルカ. 3:22</a>; <a href="https://bibleox.com/ja/jp-ni/mf/3/#L16">マタ. 3:16</a>; <a href="https://bibleox.com/ja/jp-ni/mk/1/#L10">マコ. 1:10</a>; <a href="https://bibleox.com/ja/jp-ni/in/1/#L32">ヨハ. 1:32</a>）</p></blockquote><h3>人は神のイコンである</h3><blockquote><p>「<strong>神は御自分にかたどって</strong>（εἰκόνα — イコン、像）<strong>人を創造された。神にかたどって</strong>創造された。男と女に創造された」（<a href="https://bibleox.com/ja/jp-ni/gen/1/#L27">創. 1:27</a>）</p></blockquote><blockquote><p>「これはアダムの系図の書である。神は人を創造された日、<strong>神に似せて</strong>（εἰκόνα — イコン）<strong>これを造られ</strong>」（<a href="https://bibleox.com/ja/jp-ni/gen/5/#L1">創. 5:1</a>）</p></blockquote><blockquote><p>「人の血を流す者は人によって自分の血を流される。<strong>人は神にかたどって</strong>（εἰκόνι — イコン）<strong>造られたからだ</strong>」（<a href="https://bibleox.com/ja/jp-ni/gen/9/#L6">創. 9:6</a>）</p></blockquote><blockquote><p>「神は人間を不滅な者として創造し、<strong>御自分の本性の似姿</strong>（εἰκόνα）<strong>として造られた</strong>」（<a href="https://bibleox.com/ja/jp-ni/prs/2/#L23">知. 2:23</a>）</p></blockquote><h2>イエス・キリストは父なる神の像（イコン）である</h2><blockquote><p>「互いにこのことを心がけなさい。それは<strong>キリスト・イエス</strong>にもみられるものです。<strong>キリストは、神の身分でありながら</strong>、神と等しい者であることに固執しようとは思わず」（<a href="https://bibleox.com/ja/jp-ni/fil/2/#L5-6">フィリ. 2:5-6</a>）<em>（「神の身分」は、ギリシア語原文では ἐν μορφῇ θεοῦ —「神の形において」です。）</em></p></blockquote><blockquote><p>「御子は、<strong>神の栄光の反映であり、神の本質の完全な現れであって</strong>、万物を御自分の力ある言葉によって支えておられますが、人々の罪を清められた後、天の高い所におられる大いなる方の右の座にお着きになりました」（<a href="https://bibleox.com/ja/jp-ni/evr/1/#L3">ヘブ. 1:3</a>）</p></blockquote><blockquote><p>「この世の神が、信じようとはしないこの人々の心の目をくらまし、<strong>神の似姿</strong>（εἰκὼν）<strong>であるキリスト</strong>の栄光に関する福音の光が見えないようにしたのです」（<a href="https://bibleox.com/ja/jp-ni/2kor/4/#L4">２コリ. 4:4</a>）</p></blockquote><blockquote><p>「光の中にある聖なる者たちの相続分に、あなたがたがあずかれるようにしてくださった御父に感謝するように。御父は、わたしたちを闇の力から救い出して、<strong>その愛する御子</strong>の支配下に移してくださいました。&lt;…&gt; <strong>御子は、見えない神の姿</strong>（εἰκὼν）<strong>であり</strong>、すべてのものが造られる前に生まれた方です」（<a href="https://bibleox.com/ja/jp-ni/kol/1/#L12-15">コロ. 1:12-15</a>）</p></blockquote><blockquote><p>「フィリポが『主よ、<strong>わたしたちに御父をお示しください</strong>。そうすれば満足できます』と言うと、イエスは言われた。『フィリポ、こんなに長い間一緒にいるのに、わたしが分かっていないのか。<strong>わたしを見た者は、父を見たのだ</strong>。なぜ、「わたしたちに御父をお示しください」と言うのか』」（<a href="https://bibleox.com/ja/jp-ni/in/14/#L8-9">ヨハ. 14:8-9</a>）</p></blockquote><h3>父の像を敬わない者は父を敬わない</h3><blockquote><p>「すべての人が、父を敬うように、子をも敬うようになるためである。<strong>子を敬わない者は、子をお遣わしになった父をも敬わない</strong>」（<a href="https://bibleox.com/ja/jp-ni/in/5/#L23">ヨハ. 5:23</a>）</p></blockquote><h3>父の像を拒む者は父を持たない</h3><blockquote><p>「<strong>御子を認めない者はだれも、御父に結ばれていません</strong>。御子を公に言い表す者は、御父にも結ばれています」（<a href="https://bibleox.com/ja/jp-ni/1in/2/#L23">１ヨハ. 2:23</a>）</p></blockquote><h3>父の像を憎む者は父を憎む</h3><blockquote><p>「<strong>わたしを憎む者は、わたしの父をも憎んでいる</strong>。&lt;…&gt; だが今は、その業を見たうえで、<strong>わたしとわたしの父を憎んでいる</strong>」（<a href="https://bibleox.com/ja/jp-ni/in/15/#L23-24">ヨハ. 15:23-24</a>）</p></blockquote><h3>すべての被造物は父の像の前にひざまずかなければならない</h3><blockquote><p>「こうして、<strong>天上のもの、地上のもの、地下のものがすべて、イエスの御名にひざまずき</strong>」（<a href="https://bibleox.com/ja/jp-ni/fil/2/#L10">フィリ. 2:10</a>）</p></blockquote><h2>神は聖人たちの像を通していやされる</h2><p>神は、聖なる使徒たちが残した衣服を通してだけでなく（<a href="https://bibleox.com/ja/jp-ni/act/19/#L12">使. 19:12</a>）、<em>さらには</em>使徒の像（影）を通してさえ、人々にいやしを与えておられます。</p><blockquote><p>「<strong>人々は病人を大通りに運び出し</strong>、担架や床に寝かせた。<strong>ペトロが通りかかるとき、せめてその影だけでも病人のだれかにかかるようにした</strong>。また、エルサレム付近の町からも、群衆が病人や汚れた霊に悩まされている人々を連れて集まって来たが、<strong>一人残らずいやしてもらった</strong>」（<a href="https://bibleox.com/ja/jp-ni/act/5/#L15-16">使. 5:15-16</a>）</p></blockquote><h2>神は偶像礼拝者に答えられない</h2><blockquote><p><em>「それは、</em><strong><em>偶像のゆえにわたしから離れ去った</em></strong><em>イスラエルの家の心をすべて、わたしが捕らえるためである」（</em><a href="https://bibleox.com/ja/jp-ni/iez/14/#L5"><em>エゼ. 14:5</em></a><em>）</em></p></blockquote><blockquote><p><em>「また、自分の子供を献げ物として火の中を通らせ、</em><strong><em>すべての偶像によって今日に至るまで自らを汚している</em></strong><em>。それなのに、イスラエルの家よ、わたしはお前たちの求めに応じられようか。わたしは生きている、と主なる神は言われる。</em><strong><em>わたしは決してお前たちの求めには応じない</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/iez/20/#L31"><em>エゼ. 20:31</em></a><em>）</em></p></blockquote><p>しかし、イコンの反対者たちは通常、イコンを崇敬する正教徒が神と交わることができることを認めています。けれども聖書には、神は偶像礼拝者に答えないと書かれているのです。</p><h2>イコンは救うことができるか</h2><p>正教徒は、だれかが「イコンが救った」「イコンがいやした」といった表現を使うことがあるために非難されます。救い、いやすのは神であり、わたしたちは普通「イコンが救った」といった表現は使いませんが、イコンの材料そのものではなく、神がその材料を通していやし、救われたという意味であれば、そのような表現も許されます。</p><h3>使徒は救う</h3><blockquote><p>「何とかして自分の同胞にねたみを起こさせ、<strong>その幾人かでも救いたい</strong>のです」（<a href="https://bibleox.com/ja/jp-ni/rim/11/#L14">ロマ. 11:14</a>）</p></blockquote><blockquote><p>「<strong>すべての人に対してすべてのものになりました。何とかして</strong>何人かでも<strong>救う</strong>ためです」（<a href="https://bibleox.com/ja/jp-ni/1kor/9/#L22">１コリ. 9:22</a>）</p></blockquote><h3>妻は救う</h3><blockquote><p>「<strong>妻よ、あなたは夫を救えるかどうか、どうして分かるのか</strong>。<strong>夫よ、あなたは妻を救えるかどうか、どうして分かるのか</strong>」（<a href="https://bibleox.com/ja/jp-ni/1kor/7/#L16">１コリ. 7:16</a>）</p></blockquote><h3>人々を救えという使徒の呼びかけ</h3><blockquote><p>「疑いを抱いている人たちを憐れみなさい。ほかの人たちを火の中から引き出して<strong>助けなさい</strong>。また、ほかの人たちを用心しながら憐れみなさい。肉によって汚れてしまった彼らの下着さえも忌み嫌いなさい」（<a href="https://bibleox.com/ja/jp-ni/iud/1/#L22-23">ユダ. 1:22-23</a>）<em>（「助けなさい」は、ギリシア語原文では σῴζετε —「救いなさい」です。）</em></p></blockquote><blockquote><p>「自分自身と教えとに気を配りなさい。以上のことをしっかりと守りなさい。そうすれば、あなたは自分自身と、<strong>あなたの言葉を聞く人々とを救う</strong>ことになります」（<a href="https://bibleox.com/ja/jp-ni/1tim/4/#L16">１テモ. 4:16</a>）</p></blockquote><h3>キリスト以外のだれかが本当に救うことができるのか</h3><p>使徒も、妻も夫も、主イエス・キリストが救い主であるという意味での救い主ではありません。主は、人類を死と地獄から贖い救い出す唯一の方であり、復活と神と共にある永遠の命を与えてくださる方です。しかし、ご覧のとおり、「救う」という表現を使徒たちは認めています。わたしたちはこのような表現の意味を正しく理解しています。人は救いに寄与することができるのです。「<em>わたしたちは神のために</em><strong><em>力を合わせて働く者</em></strong>であり」（<a href="https://bibleox.com/ja/jp-ni/1kor/3/#L9">１コリ. 3:9</a>）。</p><p>イコンも同じです。救うのはイコンではなく、神が救われるのです。神は物を通して恵みを送られます。聖書には、そのような例が数多くあり、それについては後で述べます。</p><h2>「イコンは霊的世界への窓である」という表現について</h2><p>イコンはいわば<strong>霊的世界への窓</strong>です。この表現には何の神秘的な意味もなく、比喩的な表現です。イコンを見ることによって、わたしたちはまるで窓を通して見るように、見えない霊的世界をのぞき込むのだということを意味しているにすぎません。</p><p>霊的なものは見えませんが、イコン画家は象徴を用いて、見えないものをイコンの上に目に見える形で描きます。たとえば、聖人たちの内に神の恵みがあることは頭の周りの光輪として描かれ、影がないことは神の光の内にとどまっていること（それは普通の光ではなく、影を落としません）を意味し、手の示す身振り、衣服の色、衣服の特別なしるし（生神女の三つの星）、周りの物、建物、そして空間全体の中に意味が込められています。これらすべてを見ることによって、わたしたちは見えない霊的世界について何かを知るのです。だからこそ時に、イコンはいわば霊的世界への窓であるという表現が使われるのです（<a href="https://monastery.ru/propovedi/okno-v-dukhovnyy-mir/">詳しく</a>、ロシア語）。</p><p>なぜこのことを特に説明しなければならないのでしょうか。正教会の反対者たちが、非難を組み立てる材料を探して、ただ非難を考え出し、それを自分の追随者たちに吹き込み、正教会への憎しみを彼らの中に育てているのに、何度も出会うからです。たとえば、正教徒を卑しい魔術師として描こうとして、教会の反対者たちは、正教徒はあたかも何かのエネルギーの出入り口を通してのように、イコンを通して神とつながっているのであり、それゆえ神と交わるためにイコンを必要としているのだ、という考えを作り出します。これはすべてまったくの偽りです。</p><p>正教会は、イコンがあるかどうかにかかわらず、どこででも祈るよう信じる者たちに呼びかけています。イコンは、教育と祈りのための補助的な手段にすぎません。祈りの中で、イコンは思いを集中させ、散らされないよう、気を取られないよう助けてくれます。イコンはまた、そこに描かれている人への敬意を表す手段でもあります。イコンを含むさまざまな物は、神が人々に恵みを分け与える手段となることがあります。これについては次の節で述べます。</p><h2>物と像を通しての神の働き</h2><p>正教徒は、神から直接だけでなく、物や像を通しても神の助けを期待しているとして非難されます。しかし、この信仰も聖書に矛盾しません。聖書の中で、神は物や像を通して何度も働かれました。</p><h3>不朽体</h3><p>遺骸（不朽体）を通しての復活。ここには、だれの信仰も、祈りも見られません。死んだ人が預言者の遺骸に偶然触れたことのほかには何もないのです。</p><blockquote><p><em>「</em><strong><em>人々がある人を葬ろうとしていたとき</em></strong><em>、その部隊を見たので、彼をエリシャの墓に投げ込んで立ち去った。その人は</em><strong><em><mark>エリシャの骨</mark>に触れると生き返り、自分の足で立ち上がった</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/4ts/13/#L21"><em>王下. 13:21</em></a><em>）</em></p></blockquote><h3>衣服</h3><blockquote><p><em>「</em><strong><em>彼が身に着けていた<mark>手ぬぐいや前掛け</mark>を持って行って病人に当てると、病気はいやされ</em></strong><em>、悪霊どもも出て行くほどであった」（</em><a href="https://bibleox.com/ja/jp-ni/act/19/#L12"><em>使. 19:12</em></a><em>）</em></p></blockquote><h3>像</h3><blockquote><p>「<strong>人々は病人を大通りに運び出し</strong>、担架や床に寝かせた。<strong>ペトロが通りかかるとき、せめてその影だけでも病人のだれかにかかるようにした</strong>。また、エルサレム付近の町からも、群衆が病人や汚れた霊に悩まされている人々を連れて集まって来たが、<strong>一人残らずいやしてもらった</strong>」（<a href="https://bibleox.com/ja/jp-ni/act/5/#L15-16">使. 5:15-16</a>）</p></blockquote><h3>水</h3><blockquote><p><em>「〔彼らは、水が動くのを待っていた。それは、主の使いがときどき池に降りて来て、</em><strong><em><mark>水</mark>が動くことがあり</em></strong><em>、</em><strong><em>水が動いたとき、真っ先に水に入る者は</em></strong><em>、どんな病気にかかっていても、</em><strong><em>いやされた</em></strong><em>からである。〕」（</em><a href="https://bibleox.com/ja/jp-ni/in/5/#L4"><em>ヨハ. 5:4</em></a><em>）（新共同訳はこの節を〔　〕に入れ、後代の付加としていますが、ビザンティン本文（多数派写本）では本文の一部です。）</em></p></blockquote><h3>さらに</h3><p><a href="https://bibleox.com/ru/ru/w/%D0%98%D1%81%D1%86%D0%B5%D0%BB%D0%B5%D0%BD%D0%B8%D1%8F">いやし</a></p><h2>イコンの崇敬についての正教会の教え</h2><h3>第七全地公会（ニカイア、787年）の367人の聖なる教父によるイコン崇敬の教義</h3><blockquote><p>わたしたちの告白を手短に述べれば、わたしたちは、書かれたものであれ口頭であれ、わたしたちに伝えられた教会のすべての伝統を変えることなく守っている。<strong>その一つが、福音の宣教の歴史に一致する絵画的な描写を作ることである。それは多くの点で有益な伝統であるが、とりわけ、神の言の受肉が、単なる幻ではなく実際のものとして示されるという点で有益である。これらは互いに指し示し合い、疑いもなく互いに意味し合っているからである</strong>。それゆえ、わたしたちは王の道に従い、わたしたちの聖なる教父たちの神に霊感を受けた権威と、普遍の教会の伝統（周知のとおり、聖霊が教会に宿っておられるからである）とに従って、あらゆる確かさと正確さをもって次のように定める。<strong><mark>尊く命を与える十字架の形と同じように、尊く聖なるイコンも</mark></strong>、絵画やモザイクやその他のふさわしい材料によって、神の聖なる教会堂に、聖なる器や祭服や垂れ幕に、また家々や道端の絵の中に掲げられるべきである。すなわち、<strong>わたしたちの主であり神であり救い主であるイエス・キリストの像、わたしたちの汚れなき女主人である生神女の像、尊い天使たちの像、すべての聖人たちとすべての敬虔な人々の像</strong>である。というのは、それらが芸術的な描写によって見られることが多ければ多いほど、<strong><mark>人々はそれだけ容易にその原型の記憶へと引き上げられ、それを慕い求めるようになるからである。そしてこれらには、しかるべき挨拶と尊敬の伏拝（ἀσπασμὸν καὶ τιμητικὴν προσκύνησιν）がささげられるべきであって、神の本性にだけふさわしい信仰のまことの礼拝（λατρείαν）がささげられるべきではない</mark></strong>。<strong>しかし、尊く命を与える十字架の形や福音書やほかの聖なる物に対するのと同じように、これらにも、古来の敬虔な習慣に従って、香と灯火をささげることができる</strong>。なぜなら、<strong><mark>像に払われる誉れは、その像が表すものへと移るのであり、イコンを崇敬する者は、そこに描かれている者を崇敬するのだからである</mark></strong>。こうして、わたしたちの聖なる教父たちの教え、すなわち地の果てから果てまで福音を受け入れた普遍の教会の伝統が、確かなものとされるのである。</p></blockquote><p>（<a href="https://bibleox.com/en/en/w/councils-the-seventh-ecumenical-council-the-second-council-of-nicaea-787/">第七全地公会：第二ニカイア公会（787年）</a>、英語。英訳からの訳）</p><h3>コンスタンティノープル総主教エレミア（1576年）</h3><blockquote><p>聖人の崇敬について述べ、聖人たちが信仰によってどのように神の恵みと助けを受けたかを考えるなら、聖人たちの記憶を保つことはわたしたちの信仰を強めるのに有益であると言う、すべての章の最後である第二十一章に対して、わたしたちはこう言う。<strong>呼び求めることは、主として唯一の神に対してふさわしく、それは卓越して、本来的に神に属する。一方、聖人たちに対してなされる呼びかけは本来の意味でのものではなく、いわば付随的に、恵みによって彼らに向けられるものである。というのは、彼らを呼び求める者たちに耳を傾けるのはペトロやパウロではなく、彼らの持つ恵みだからである</strong>。主の言葉のとおりである。「わたしは世の終わりまで、いつもあなたがたと共にいる」（マタ. 28:20）。</p><p>神のごときパウロは、神を呼び求めることについてローマの信徒に書き送り、「信じたことのない方を、どうして呼び求められよう」（ロマ. 10:14）と言っている。これによって、わたしたちが信じた方、すなわち神だけを呼び求めなければならないことを示しているのである。そして<strong>わたしたちもまた、本来の意味では唯一の神に呼びかけていることは、神秘的な奉神礼の中で「天にいますわれらの父よ」などと叫ぶことから明らかである。また別の箇所では「万軍の主よ、われらと共にいたまえ。悲しみの中であなたのほかに助け手はないからである」、さらに「あなたのほかに神を知らない」と叫ぶ。しかしわたしたちは、すべての聖人を仲介者とし、とりわけ主の母を、そして彼女と共に天使と聖人の群れを仲介者とし、彼らを教会堂や奉献や呼びかけや聖なるイコンによって敬う。それは相対的にであって、礼拝としてではない。なぜなら、<mark>わたしたちは、礼拝が卓越して唯一の神にふさわしいこと、神のほかにはだれをも神と認めてはならず、「異教の神」（詩. 81:10）にひれ伏してはならないことを知っているからである</mark></strong>。わたしたちは、相対的な崇敬によって神格化に陥ることを恐れるくらいなら、むしろ自分自身が聖人になることを望まないであろう。そのようなことがあってはならない。というのは、<strong><mark>聖なるイコンに相対的にひれ伏さないことは不敬虔であり、キリストの教会とその子らに無縁のことだからである。イコンに払われる誉れは原型へと移るからである</mark></strong>。バシレイオスが言うとおりである。わたしたちは、すべての聖人をわたしたちの仲介者、執り成し手と認め、今の世においてだけでなく、来るべき世においても、ある仲介があると言う。天使たちと聖人たちが、そして彼らに劣らず世の女主人が、ある人々のために願うからである。しかし、すべての人のためにではなく、罪の内に死んだ者のためには決してない。神はそのような者に対しては憐れみを完全に閉ざしておられるからであり、それゆえ彼らについて次のように示されたのである。「たとえノア、ダニエル、ヨブがいても、息子も娘も救い出すことはできない」（エゼ. 14:14,18）。すべての者は、執り成しが受け入れられる者たち、すなわち悔い改めによって生涯の終わりを迎えたが、まだ罪の汚れを洗い清めることができなかった者たちのためにだけ、しかも裁きがまだ続いている間だけ、神に願うであろう。この光景が終わり、それぞれが定められた罰の場所に連れて行かれた後には、執り成しは不可能であり、存在しないであろう。この執り成しは今も行われ、教会で宣べられている。わたしたちは聖人たちを、わたしたちの女主人を、聖なる天使たちを呼び求める。わたしたちの女主人にはこのように、「至聖なる女主人、生神女よ、われら罪人のために祈りたまえ」。聖なる天使たちには、「聖なる天使と天使首のすべての天の軍勢よ、われら罪人のために祈りたまえ」。同じように、主の預言者であり前駆者であり洗礼者である者、栄光ある使徒たち、預言者たち、致命者たち、克肖者たち、牧者たち、全世界の教師たち、そしてそのほかのすべての聖人たちを呼び求める。わたしたちはまた、聖なる女性たちの群れに、われら罪人のために祈ってくれるよう願う。わたしたちは神に願う。神がその恵みと、十字架の打ち負かされることのない、理解を超えた神の力とによって、神に仕え、告白と悔い改めの内にとどまり、魂の目が照らされることを願うわたしたちを憐れみ、わたしたちが罪の内に眠って死に至ることなく、敵がわたしたちに打ち勝つことのないようにしてくださるようにと。こうして、わたしたちが述べたすべての者の執り成しによって、わたしたちは神に、わたしたちを憐れみ、悪しき者の罠から奪い取ってくださるよう祈るのである。</p></blockquote><p>（<a href="https://azbyka.ru/otechnik/konfessii/otvety-lyuteranam/#0_25">ルター派への第一の回答</a>、ロシア語。ロシア語からの訳）</p><p>イコンの崇敬を詳しく検討した、ルター派へのより長い第二の回答もあります：<a href="https://azbyka.ru/otechnik/konfessii/otvety-lyuteranam/#0_34">第二の回答</a>（ロシア語）。</p><p>そして短い第三の回答：<a href="https://azbyka.ru/otechnik/konfessii/otvety-lyuteranam/#0_41">第三の回答</a>（ロシア語）。</p><h3>正教信仰についての東方正教会総主教たちの書簡（1723年）</h3><blockquote><p>聖なるイコンについて、また聖人たちの崇敬について、わたしたちはどのように考えるべきか。</p><p>聖人たちは執り成し手であり、普遍の教会によってそう認められているので（上記第八条で述べたとおり）、今や次のことを述べる時である。わたしたちは<strong><mark>彼らを神の友として、また万物の神にわたしたちのために祈る者として敬う</mark></strong>。そしてわたしたちが彼らに払う誉れには二つある。一つの仕方は、わたしたちがヒュペルドゥリアと呼ぶもので、それによって神の言の母を敬う。生神女はまことに唯一の神の僕ではあるが、三位の一つを肉によって生んだ者として、神の母でもある。それゆえ彼女は、天使たちにも聖人たちにも比べるものがなく、それらを超える者としてほめたたえられる。それゆえまた、わたしたちは彼女にヒュペルドゥリアの崇敬をささげるのである。もう一つの仕方は、わたしたちがドゥリアと呼ぶもので、それによって聖なる天使たち、使徒たち、預言者たち、致命者たち、そしてつまるところすべての聖人たちを崇敬する、いやむしろ敬う。さらに、<strong>わたしたちは、わたしたちの救い主が世を救う受難を受けられた、尊く命を与える十字架の木を崇敬し敬う。また命を与える十字架のしるし、わたしたちを非理性から救い出したベツレヘムの飼い葉桶、されこうべの場所（ゴルゴタ）、命を与える墓、そのほかの聖なる崇敬の対象を崇敬し敬う。また聖なる福音書も、機密を行うための聖なる器も、無血のいけにえが行われる器も敬う。そして毎年の記念、民衆の祭り、聖なる建物や献げ物によって、わたしたちは聖人たちに敬意を表し、彼らを敬う</strong>。<strong>そしてまた、わたしたちは、わたしたちの主イエス・キリスト、至聖なる生神女、すべての聖人たちのイコン、さらに、ある祖先や預言者たちに現れたとおりの聖なる天使たちのイコンを崇敬し、敬い、それに接吻する。わたしたちはまた、至聖なる聖霊を</strong>、鳩の姿で現れたとおりに描く。</p><p><strong>そして、もしある人々が、わたしたちは聖人たちや聖人たちのイコンやそのほかのものを崇敬することによって偶像礼拝を犯していると言うなら、わたしたちはそれを愚かで軽率なことと見なす。わたしたちは、三位の唯一の神だけをラトリア（礼拝）によって拝み、それ以外のだれをも拝まないからである</strong>。しかし聖人たちを、わたしたちは二つの理由によって敬う。第一に、神との関係のゆえに、すなわち神のゆえに彼らを敬う。そして彼ら自身のゆえに、すなわち彼らが神の生きた像であるゆえに敬う。彼ら自身のゆえになされるものは、ドゥリアと定められている。<strong><mark>しかし聖なるイコンを、わたしたちは相対的に崇敬する。それに払われる誉れはその原型へと向けられるからである。イコンを崇敬する者は、イコンを通して原型を崇敬するのである。そしてイコンに払われる誉れは、描かれている者への誉れから少しも分けられたり切り離されたりせず、同じ者に対してなされるのである。王の使節に対してなされるものと同じように</mark></strong>。</p><p>そして彼らが自分たちの新説を支持するために聖書から持ち出すものは、彼らの望むようには彼らを助けず、むしろわたしたちに合致するように見える。というのは、<strong>わたしたちは聖書を読むとき、その機会と人物、例と原因を吟味するからである。それゆえ、神御自身がある時には「あなたは自分のために偶像も、いかなる像も造ってはならない。それらにひれ伏したり、それらに仕えたりしてはならない」（出. 20:4-5; 申. 5:8-9）と言われ、別の時にはケルビムを造るよう命じておられる（出. 25:18）のを見るとき</strong>、さらに牛や獅子が神殿に置かれていた（王上. 7:29）のを見るとき、わたしたちはこれらのことの意味を軽率に考えはしない。信仰は確信の中にあるのではなく、すでに述べたように、機会やほかの事情を考慮して、<strong><mark>わたしたちは同じことの正しい解釈に達する。そして、「あなたは自分のために偶像も、いかなる像も造ってはならない」とは、「異国の神々を拝んではならない」（出. 20:3）、いやむしろ「偶像礼拝をしてはならない」と言うのと同じことであると結論する</mark></strong>。こうして、使徒の時代から教会で守られてきた、聖なるイコンを相対的に崇敬する習慣も保たれ、ラトリアの礼拝は神だけにとっておかれ、神が自ら矛盾して語っておられるようには見えないのである。&lt;…&gt; また、イコンを崇敬するのは正しくないと言ったとして彼らが持ち出す聖人たちについて言えば、わたしたちは、彼らがむしろわたしたちを助けていると結論する。彼らはその鋭い論争の中で、聖なるイコンをラトリアによって崇敬する者たちに対しても、亡くなった親族のイコンを教会に持ち込む者たちに対しても非難し、そうする者たちをアナテマに付したのであって、聖人たちや聖なるイコンや尊い十字架や、すでに述べたそのほかのものの正しい崇敬に対して非難したのではない。とりわけ、聖なるイコンは使徒の時代から教会にあり、信者たちによって崇敬されてきたのであって、それは非常に多くの人によって記録され、宣べ伝えられている。彼らと共に、また彼らの後に、第七聖全地公会はあらゆる異端の厚かましさを恥じ入らせているのである。</p><p>この公会は、聖なるイコンと前述のものを崇敬すべきであることを、最もはっきりとわたしたちに理解させているからである。そして<strong><mark>この公会は、イコンをラトリアによって崇敬する者たちも、正教徒がイコンを崇敬することによって偶像礼拝を犯していると言う者たちも、アナテマに付し、破門に処している。それゆえわたしたちも、公会と共に、聖人であれ天使であれイコンであれ十字架であれ聖人の不朽体であれ聖なる器であれ福音書であれ、上は天にあるものであれ、地にあるものであれ、海にあるものであれ、何であれラトリアによって崇敬する者たちをアナテマに付し、ラトリアによる礼拝を三位の唯一の神にだけ帰する。そしてわたしたちは、イコンの崇敬はイコンへのラトリアであると言い、教会が伝えたようにイコンを崇敬せず、十字架と聖人たちを敬わない者たちをアナテマに付す</mark></strong>。</p><p>さて、わたしたちは聖人たちと聖なるイコンを、述べたとおりの仕方で崇敬し、わたしたちの教会堂を飾るためにそれらを描く。それらが無学な者たちの書物となり、彼らが聖人たちの徳に倣い、それを思い起こし、愛を増し加え、主を主権者であり父として、聖人たちをその僕として、わたしたちの助け手であり仲介者として、いつも呼び求めることに目を覚ましているためである。</p></blockquote><p>（<a href="https://bibleox.com/en/en/w/VQcM_Eastern_Orthodox_Confession_of_Faith_1672_1732/">総主教たちの書簡、問4</a>、英語。英訳からの訳）</p><h2>批判への応答</h2><h3>あなたがたは神の十戒の一つを取り除いている</h3><p>あなたがたは安息日の休みについての<a href="https://bibleox.com/ru/ru/w/10-%D0%B7%D0%B0%D0%BF%D0%BE%D0%B2%D0%B5%D0%B4%D0%B5%D0%B9/#HH-4">第四の</a>戒めを守っていますか。土曜日には何の仕事もしないのですか。土曜日に働く兄弟姉妹を殺していますか。冒瀆や偶像礼拝のゆえに彼らを殺していますか。もしそうしていないのなら、どのような理由からですか。あなたがたは神の戒めを取り除いているのではありませんか。あなたがた自身は第四の戒めを果たしていないのに、第二の戒めを果たすよう要求していることは、なぜ無視されるのでしょうか。</p><p>モーセの律法は廃止されました。キリスト者はキリストに従います。第二の戒めは明らかに像とその崇敬を禁じてはいませんでした。神は御自分の神殿に像を造るよう命じ、神殿を敬うよう命じ、預言者たちは像のある聖なる物の前にひれ伏したからです。この戒めは神を描くことを禁じ、また偶像礼拝（偽りの神々を崇め、それに仕えること）を禁じたのです。</p><h3>あなたがたは、イスラエル人がネフシュタンに香をたいたように、イコンに香をたいている</h3><p>イスラエル人の誤りは、香をたいたことにあったのではなく（神御自身が香をたくことを定められました）、ネフシュタンと名づけた偽りの神を考え出し、神に仕える代わりに、自分たちが考え出したネフシュタンに仕え始めたことにありました。イスラエル人にいつも起こっていたように、彼らは明らかに物そのものを神と見なしていたのです（<a href="https://bibleox.com/ru/ru/w/%D1%8F%D0%B7%D1%8B%D1%87%D0%B5%D1%81%D0%BA%D0%B0%D1%8F-%D0%B2%D0%B5%D1%80%D0%B0-%D0%B2-%D0%B8%D0%B4%D0%BE%D0%BB%D0%B0/#HH-%D0%AF%D0%B7%D1%8B%D1%87%D0%BD%D0%B8%D0%BA%D0%B8-%D0%B8%D0%B7%D1%80%D0%B0%D0%B8%D0%BB%D1%8C%D1%82%D1%8F%D0%BD%D0%B5-%D1%81%D1%87%D0%B8%D1%82%D0%B0%D0%BB%D0%B8-%D0%B1%D0%BE%D0%B3%D0%BE%D0%BC-%D1%81%D0%B0%D0%BC%D0%BE-%D0%B8%D0%B7%D0%B4%D0%B5%D0%BB%D0%B8%D0%B5-%D0%B0-%D1%82%D0%B0%D0%BA%D0%B6%D0%B5-%D1%81%D1%82%D0%B8%D1%85%D0%B8%D0%B8">詳しく</a>、ロシア語）。名前だけでなく、ネフシュタンに喜ばれる方法も考え出され、その後に考え出されたネフシュタンの意志（戒め）が続きました。これが偶像礼拝、すなわち偽りの神々に仕えることです。それは神から、そして神の御心に従う生活から遠ざけ、ネフシュタンの意志（すなわちその作り手の意志）に従う生活へと導きます。</p><p>正教徒はまことの神を描き、神をその固有の名で呼び、神の戒めを果たし、物（イコン）を神と見なさず、イコンにではなく神にひれ伏し、香をたいています。これは偶像礼拝ではありません。ネフシュタンに仕えた者たちの場合とは違って、ここには偽りの神々も、偽りの神々への奉仕もないからです。</p><h3>神は描けと言われたが、崇敬せよとは言われなかった</h3><p>そうではありません。聖書の中に、神が像を造ることもそれを崇敬することも命じられたことを見ることができます。聖書にはまた、像を崇敬する実践もあります。</p><p>神は神殿を敬うよう言われました。神殿は神御自身の計画によって天の現実の像（イコン）です。預言者ダビデは像のある神殿の前にひれ伏し、預言者ヌンの子ヨシュアは像のある契約の箱の前にひれ伏しました。このように、神は像を崇敬するよう命じられ、預言者たちは像のある聖なる物を崇敬し、その前にひれ伏したのです。疑いもなく、預言者たちはこの崇敬を神に向けていました。すなわち、像を崇敬することによって原型を崇敬していたのです。正教のキリスト者もまったく同じことをしています。</p><h3>念のためにイコンをやめてはどうかという提案</h3><p>わたしたちの説明を聞いた後、イコン崇敬の反対者たちはしばしば、わたしたちのイコン崇敬は許されるものだと認めながらも、わたしたちの皆が教会の教えを十分に知っているわけではなく、やはりイコンを偶像のように扱っている人もいるのだから、誘惑を避けるためにイコンを取り除いた方がよい、と言います。</p><p>わたしたちはこれに同意しません。イコンは必要であり、それに対する誤った態度は、啓蒙によって、正しい信仰の説明によって取り除かれなければならないからです。</p><p>聖書を誤解する人もいますが、だからといって、誘惑を避けるために聖書をやめなければならないわけではありません。それはただ、啓蒙と聖書の言葉の正しい説明の必要へとわたしたちを導くだけです。</p><h3>歴史と教父の聖伝に関する批判への応答</h3><p><a href="https://bibleox.com/ru/ru/w/%D0%B8%D0%BA%D0%BE%D0%BD%D1%8B-%D0%BF%D0%BE%D1%87%D0%B8%D1%82%D0%B0%D1%8E%D1%82#HH-%D0%9A%D1%80%D0%B8%D1%82%D0%B8%D0%BA%D0%B0">イコンは崇敬されている — 批判</a>（ロシア語）</p><h2>結論</h2><p>このように、わたしたちは、イコンの崇敬を偽りの神々（偶像）を拝むことと同一視する人々は誤っており、正教徒を偶像礼拝のかどで非難することは、信じる者たちに対する不当な非難であり、正教の信仰についての歪められた観念であると信じています。</p><p>イコンは、神について、人々について、出来事についての正しい説明であり、思い起こさせるものにすぎず、神として崇敬されるのでも、神の代わりに崇敬されるのでもありません。わたしたちは神に関わるものに初歩的な敬意を示しているのです。人々が自分の国の旗を、特別な布のためではなく国そのものへの敬意から敬い、大統領の肖像を、紙や絵の具の質のためではなく大統領自身のために敬い、十字架と福音書を、珍しい種類の木や書物の材質のためではなく、その十字架の上でわたしたちの救いのために神が十字架につけられ、その書物に神の救いの言葉が書き記されているがゆえに敬うのと同じです。</p><p>イコンは、人々が神と神の母と神の友たちに敬意を示すのを助けるためのものです。イコンは祈りの間に集中するのを助け、思いを神に向けるのを助けることができます。</p><p>時に、わたしたちの意志によってではまったくなく、神御自身がイコンやほかの物を通して奇跡やいやしを現されます。それは当然、その物を特別に崇敬するという考えにわたしたちを導きます。しかしそれは神の代わりにではなく、神のゆえにです。かつて神が預言者モーセに、聖なる土地に対する畏敬の必要について語られたのと同じです。</p><blockquote><p>「<strong><mark>足から履物を脱ぎなさい</mark>。あなたの立っている<mark>場所は聖なる土地</mark>だから</strong>」（<a href="https://bibleox.com/ja/jp-ni/ish/3/#L5">出. 3:5</a>）</p></blockquote><p>預言者ダビデも聖なるものに対して畏敬を抱き、それにひれ伏しました。</p><blockquote><p>「我らの神、主をあがめよ。<strong>その足台</strong>（足を載せる台 — 注）<strong>に向かって<mark>ひれ伏せ</mark>。<mark>主は聖なる方</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/ps/99/#L5">詩. 99:5</a>）</p></blockquote><p>そしてそのような畏敬を持たなかった者たちに、神は死の罰を下されました。</p><blockquote><p>「［ベルシャツァル王よ、あなたは］天の主に逆らって、<strong>その神殿の祭具を持ち出させ</strong>、あなた御自身も、貴族も、後宮の女たちも皆、<strong>それで飲みながら</strong> &lt;…&gt; その同じ夜、<strong>カルデア人の王ベルシャツァルは殺された</strong>」（<a href="https://bibleox.com/ja/jp-ni/dan/5/#L23,30">ダニ. 5:23,30</a>）</p></blockquote><p>ですから、もっと簡単に言えば、<strong>偽りの</strong>神、あるいは<strong>偽りの</strong>神を指し示すものが崇敬されるとき、それは偶像礼拝、すなわち<u>偽りの</u><u>神</u>（偶像）を崇め拝むことになります。正教会は人々や物や像に対するそのような宗教的崇敬を教えておらず、それを断罪しています。</p><p>まことの神を崇敬することは、神に関わるすべてのものを崇敬することへと導きます。神は神として崇敬され、神の友たちや忠実な僕たちは、神としてではなく、神の友たちや忠実な僕たちとして崇敬されます。王は王として敬われ、王の近臣たちは王としてではなく近臣として敬われます。このような崇敬には、<u>偽りの</u><u>神</u>はありません。これが正教会の教える信仰です。</p><h2>関連する引用</h2><ol><li><p><a href="https://bibleox.com/ja/ja/w/Vs4n_聖人の崇敬/">聖人の崇敬</a></p></li><li><p><a href="https://bibleox.com/ja/ja/w/Rl6c_聖人の不朽体の崇敬/">聖人の不朽体の崇敬</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/%D0%92%D1%8B%D0%B1%D0%BE%D1%80_%D0%BC%D0%B5%D1%81%D1%82%D0%B0_%D0%BA%D0%B0%D0%BA_%D1%84%D0%BE%D1%80%D0%BC%D0%B0_%D0%BF%D0%BE%D1%87%D0%B8%D1%82%D0%B0%D0%BD%D0%B8%D1%8F">崇敬の一つの形としての場所の選択</a>（ロシア語）</p></li><li><p><a href="https://bibleox.com/ja/ja/w/Ps5r_聖人への祈り/">聖人への祈り</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/%D1%87%D0%B5%D0%BB%D0%BE%D0%B2%D0%B5%D0%BA-%D1%85%D1%80%D0%B0%D0%BC-%D0%91%D0%BE%D0%B6%D0%B8%D0%B9">人は神の神殿である</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/%D1%81%D0%BE%D1%81%D1%82%D0%B0%D0%B2-%D1%87%D0%B5%D0%BB%D0%BE%D0%B2%D0%B5%D0%BA%D0%B0">人間の構成</a></p></li></ol>
