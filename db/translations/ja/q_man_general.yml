    path: Cm3h_人間の本性の構成
    title: 人間の本性の構成
    title_sub: 人間の本性の構成についての聖書の引用
    meta_desc: 人間の本性の構成についての聖書の引用
    menu: { parent: "人間", title: "人間の本性の構成", priority: 3 }
    body: |-
      <p>人間の本性の構成：</p><ol><li><p>肉の体</p></li><li><p>魂</p></li><li><p>霊（魂の力）</p></li></ol><h2>肉</h2><blockquote><p>「わたしも皆と同じく死すべき人間であり、土で造られた最初の人の子孫である。<strong>母の胎内で肉となり</strong>、十か月、血の中で形を整えた。男性の種と夫婦の楽しみによってである」（<a href="https://bibleox.com/ja/jp-ni/prs/7/#L1-2">知. 7:1-2</a>）</p></blockquote><h2>魂と霊</h2><blockquote><p>「どうか、平和の神御自身が、あなたがたを<strong>全く</strong>聖なる者としてくださいますように。また、あなたがたの<strong>霊</strong>も<strong>魂</strong>も<strong>体</strong>も何一つ欠けたところのないものとして守り、わたしたちの主イエス・キリストの来られるとき、非のうちどころのないものとしてくださいますように」（<a href="https://bibleox.com/ja/jp-ni/1sol/5/#L23">１テサ. 5:23</a>）</p></blockquote><blockquote><p>「彼はひとり、<strong>その肉</strong>の痛みに耐え<strong>魂</strong>の嘆きを忍ぶだけだ」（<a href="https://bibleox.com/ja/jp-ni/iov/14/#L22">ヨブ. 14:22</a>）</p></blockquote><blockquote><p>「神よ、あなたはわたしの神。わたしはあなたを捜し求め<strong>わたしの魂</strong>はあなたを渇き求めます。あなたを待って、<strong>わたしのからだ</strong>は乾ききった大地のように衰え水のない地のように渇き果てています」（<a href="https://bibleox.com/ja/jp-ni/ps/63/#L2">詩. 63:2</a>）<em>（「からだ」は、ヘブライ語原文では בְּשָׂרִי —「わたしの肉」です。）</em></p></blockquote><blockquote><p>「主の庭を慕って、<strong>わたしの魂</strong>は絶え入りそうです。命の神に向かって、<strong>わたしの身</strong>も心も叫びます」（<a href="https://bibleox.com/ja/jp-ni/ps/84/#L3">詩. 84:3</a>）<em>（「身」は、ヘブライ語原文では בְשָׂרִי —「わたしの肉」です。）</em></p></blockquote><blockquote><p>「慈しみ深い人は<strong>自分の魂</strong>を益し残酷な者は<strong>自分の身</strong>に煩いを得る」（<a href="https://bibleox.com/ja/jp-ni/pr/11/#L17">箴. 11:17</a>）<em>（「身」は、ヘブライ語原文では שְׁאֵרוֹ —「自分の肉」です。）</em></p></blockquote><h2>人が死ぬとき、魂は体から離れる</h2><blockquote><p>「<strong>体は殺しても、魂を殺すことのできない者ども</strong>を恐れるな」（<a href="https://bibleox.com/ja/jp-ni/mf/10/#L28">マタ. 10:28</a>）（<a href="https://bibleox.com/ja/jp-ni/lk/12/#L4">ルカ. 12:4</a>）</p></blockquote><blockquote><p>「エウティコという青年が、窓に腰を掛けていたが、パウロの話が長々と続いたので、ひどく眠気を催し、眠りこけて三階から下に<strong>落ちてしまった</strong>。起こしてみると、<strong>もう死んでいた</strong>。パウロは降りて行き、彼の上にかがみ込み、抱きかかえて言った。『<strong>騒ぐな。まだ生きている</strong>』」（<a href="https://bibleox.com/ja/jp-ni/act/20/#L9-10">使. 20:9-10</a>）</p><p>ギリシア語原文では ἡ γὰρ ψυχὴ αὐτοῦ ἐν αὐτῷ ἐστιν —「彼の<strong>魂</strong>は彼の内にあるからだ」です。</p></blockquote><h2>死後、人の肉は朽ちるが、魂は存在し続ける</h2><blockquote><p>「そして、キリストの復活について前もって知り、『<strong>彼</strong>は陰府に捨てておかれず、<strong>その体</strong>は朽ち果てることがない』と語りました」（<a href="https://bibleox.com/ja/jp-ni/act/2/#L31">使. 2:31</a>）<em>（ビザンティン本文（多数派写本）では「<strong>彼の魂</strong>（ἡ ψυχὴ αὐτοῦ）は陰府に捨てておかれず、<strong>彼の肉</strong>（ἡ σὰρξ αὐτοῦ）は朽ち果てることがない」となっています。）</em></p></blockquote><p><a href="https://bibleox.com/ru/q/%D0%B6%D0%B8%D0%B7%D0%BD%D1%8C-%D0%B4%D1%83%D1%88%D0%B8-%D0%BF%D0%BE%D1%81%D0%BB%D0%B5-%D1%81%D0%BC%D0%B5%D1%80%D1%82%D0%B8-%D1%82%D0%B5%D0%BB%D0%B0">人間の魂の不死</a>についての引用。</p><h2>復活のとき、人自身のかつての肉が回復され、魂が戻ってその肉と再び結ばれる</h2><blockquote><p>「わたしは知っているわたしを贖う方は生きておられついには塵の上に立たれるであろう。<mark>この皮膚</mark>が損なわれようとも<strong><mark>この身をもって</mark>わたしは神を仰ぎ見るであろう。<mark>このわたしが仰ぎ見るほかならぬこの目で見る</mark></strong>。腹の底から焦がれ、はらわたは絶え入る」（<a href="https://bibleox.com/ja/jp-ni/iov/19/#L25-27">ヨブ. 19:25-27</a>）</p><p>七十人訳（<a href="https://bibleox.com/ja/gr-lxx-byz/iov/19/#L26">ヨブ. 19:26、七十人訳</a>）では ἀναστήσαι τὸ δέρμα μου —「わたしの<strong>皮膚をよみがえらせてくださるように</strong>」です。</p></blockquote>

  - src: человек-образ-Бога
    path: Im4g_人間は神の像
    title: 人間は神の像である
    meta_desc: 神の像としての人間についての聖書の引用
    menu: { parent: "人間", title: "人間は神の像", priority: 4 }
    body: |-
      <h2>人間は神の像と肖として構想された</h2><blockquote><p>「神は言われた。『<strong>我々にかたどり</strong>、<strong>我々に似せて</strong>、人を造ろう…』」（<a href="https://bibleox.com/ja/jp-ni/gen/1/#L26">創. 1:26</a>）</p></blockquote><p>しかし、人間は像（かたどり）においてだけ創造されます：</p><blockquote><p>「神は<strong>御自分にかたどって</strong>人を<strong>創造された</strong>。<strong>神にかたどって創造された</strong>。男と女に創造された」（<a href="https://bibleox.com/ja/jp-ni/gen/1/#L27">創. 1:27</a>）</p></blockquote><blockquote><p>「これはアダムの系図の書である。神は人を創造された日、<strong>神に似せてこれを造られ</strong>」（<a href="https://bibleox.com/ja/jp-ni/gen/5/#L1">創. 5:1</a>）</p><p>教会スラヴ語訳が従う七十人訳（<a href="https://bibleox.com/ja/gr-lxx-byz/gen/5/#L1">創. 5:1、七十人訳</a>）では、κατ᾿ εἰκόνα θεοῦ ἐποίησεν αὐτόν —「<strong>神の像にかたどって</strong>これを造られた」です。</p></blockquote><blockquote><p>「人の血を流す者は人によって自分の血を流される。<strong>人は神にかたどって造られたからだ</strong>」（<a href="https://bibleox.com/ja/jp-ni/gen/9/#L6">創. 9:6</a>）</p></blockquote><h3>人間における神の像</h3><p>永遠の存在：</p><blockquote><p>「神は人間を不滅な者として創造し、<strong>御自分の本性の似姿として造られた</strong>」（<a href="https://bibleox.com/ja/jp-ni/prs/2/#L23">知. 2:23</a>）<em>（「本性」は ἰδιότητος という読みによるもので、別の写本では ἀϊδιότητος —「<strong>永遠性</strong>」です。教会スラヴ語訳とロシア語訳はこちらに従っています。すなわち「御自分の永遠性の像として造られた」。）</em></p></blockquote><h3>人間における神の肖</h3><p>人間は神に似た者となるよう招かれているにすぎません：</p><blockquote><p>「わたしは柔和で謙遜な者だから、わたしの軛を負い、<strong>わたしに学びなさい</strong>。そうすれば、あなたがたは<strong>安らぎを得られる</strong>」（<a href="https://bibleox.com/ja/jp-ni/mf/11/#L29">マタ. 11:29</a>）</p></blockquote><blockquote><p>「神は前もって知っておられた者たちを、<strong>御子の姿に似たものにしよう</strong>とあらかじめ定められました。それは、御子が多くの兄弟の中で長子となられるためです」（<a href="https://bibleox.com/ja/jp-ni/rim/8/#L29">ロマ. 8:29</a>）</p></blockquote>

  - src: человек-храм-Божий
    path: Tm5g_人間は神の神殿
    title: 人間は神の神殿である
    menu: { parent: "人間", title: "人間は神の神殿", priority: 5 }
    body: |-
      <blockquote><p>「知らないのですか。<strong>あなたがたの体は、神からいただいた聖霊が宿ってくださる神殿であり</strong>、あなたがたはもはや自分自身のものではないのです」（<a href="https://bibleox.com/ja/jp-ni/1kor/6/#L19">１コリ. 6:19</a>）</p></blockquote><blockquote><p>「神の神殿を壊す者がいれば、神はその人を滅ぼされるでしょう。神の神殿は聖なるものだからです。<strong>あなたがたはその神殿なのです</strong>」（<a href="https://bibleox.com/ja/jp-ni/1kor/3/#L17">１コリ. 3:17</a>）</p></blockquote><blockquote><p>「あなたがたは、<strong>自分が神の神殿であり</strong>、神の霊が自分たちの内に住んでいることを知らないのですか」（<a href="https://bibleox.com/ja/jp-ni/1kor/3/#L16">１コリ. 3:16</a>）</p></blockquote><blockquote><p>「神の神殿と偶像にどんな一致がありますか。<strong>わたしたちは生ける神の神殿なのです</strong>。神がこう言われているとおりです。『<strong>わたしは彼らの間に住み、巡り歩く</strong>。そして、彼らの神となり、彼らはわたしの民となる』」（<a href="https://bibleox.com/ja/jp-ni/2kor/6/#L16">２コリ. 6:16</a>）</p></blockquote><blockquote><p>「それでユダヤ人たちは、『この神殿は建てるのに四十六年もかかったのに、あなたは三日で建て直すのか』と言った。イエスの言われる神殿とは、<strong>御自分の体のこと</strong>だったのである」（<a href="https://bibleox.com/ja/jp-ni/in/2/#L20-21">ヨハ. 2:20-21</a>）</p></blockquote><blockquote><p>「キリストは御子として神の家を忠実に治められるのです。もし確信と希望に満ちた誇りとを持ち続けるならば、<strong>わたしたちこそ神の家なのです</strong>」（<a href="https://bibleox.com/ja/jp-ni/evr/3/#L6">ヘブ. 3:6</a>）</p></blockquote><blockquote><p>「キリストにおいて、この建物全体は組み合わされて成長し、主における聖なる神殿となります。キリストにおいて、<strong>あなたがたも共に建てられ、霊の働きによって神の住まいとなるのです</strong>」（<a href="https://bibleox.com/ja/jp-ni/ef/2/#L21-22">エフェ. 2:21-22</a>）</p></blockquote>

  - src: расы-и-народы
    path: Rn6p_人種と民族
    title: 人種と民族
    title_sub: 人種と民族についての聖書の引用
    meta_desc: 人類の起源、人種と民族についての聖書の引用
    menu: { parent: "人間", title: "人種と民族", priority: 6 }
    body: |-
      <p>初めに神はアダムを造られました：</p><blockquote><p>「<strong>主なる神は</strong>、土（アダマ）の塵で<strong>人（アダム）を形づくり</strong>、その鼻に命の息を吹き入れられた。人はこうして生きる者となった」（<a href="https://bibleox.com/ja/jp-ni/gen/2/#L7">創. 2:7</a>）</p></blockquote><p>それから、アダムのあばら骨からエバを造られました：</p><blockquote><p>「人はあらゆる家畜、空の鳥、野のあらゆる獣に名を付けたが、<strong>自分に合う助ける者は見つけることができなかった</strong>。&lt;…&gt; そして、<strong>人から抜き取ったあばら骨で女を造り上げられた</strong>。主なる神が彼女を人のところへ連れて来られると」（<a href="https://bibleox.com/ja/jp-ni/gen/2/#L20-22">創. 2:20-22</a>）</p></blockquote><p>アダムには多くの子供が生まれました：</p><blockquote><p>「アダムは、<strong>セトが生まれた後</strong>八百年生きて、<strong>息子や娘をもうけた</strong>」（<a href="https://bibleox.com/ja/jp-ni/gen/5/#L4">創. 5:4</a>）</p></blockquote><p>セトの後（つまり、すでに三人の男の子、<a href="https://bibleox.com/ja/jp-ni/gen/4/#L1">カイン</a>、<a href="https://bibleox.com/ja/jp-ni/gen/4/#L2">アベル</a>、<a href="https://bibleox.com/ja/jp-ni/gen/4/#L25">セト</a>が生まれていました）、さらに息子や娘が生まれました。しかし創世記の記者は、彼らにそれ以上注意を払いません。彼の目は、読者にとって大切だと考える物語の細部にだけ向けられているからです。その後には、（ユダヤ人の伝統に従って）父を通してたどる、カインからとセトからの個々の系譜だけが挙げられています。カインからは、楽器を発明した者（<a href="https://bibleox.com/ja/jp-ni/gen/4/#L21">創. 4:21</a>）、武器を作った者（<a href="https://bibleox.com/ja/jp-ni/gen/4/#L22">創. 4:22</a>）、一夫多妻を始めた者（<a href="https://bibleox.com/ja/jp-ni/gen/4/#L19">創. 4:19</a>）に至る系譜が述べられています。セトからノアまでの父祖の何人かが挙げられています（<a href="https://bibleox.com/ja/jp-ni/gen/5/#L6-29">創. 5:6-29</a>）。セトは多くの息子や娘をもうけましたが（<a href="https://bibleox.com/ja/jp-ni/gen/5/#L7">創. 5:7</a>）、そのうちの一人、エノシュだけが挙げられています（<a href="https://bibleox.com/ja/jp-ni/gen/4/#L26">創. 4:26</a>）。ほかの人々についても同様です。やがて人々は増え、神を忘れ、まず罪に、それから洪水の水に沈みます。ノアの家族以外のすべての人が死にます。そして今や、すべての人種はノアの家族から出るのです（<a href="https://bibleox.com/ja/jp-ni/gen/9/#L19">創. 9:19</a>）。ノアはセム、ハム、ヤフェトをもうけました：</p><blockquote><p>「ノアは五百歳になったとき、セム、ハム、ヤフェトをもうけた」（<a href="https://bibleox.com/ja/jp-ni/gen/5/#L32">創. 5:32</a>）</p></blockquote><blockquote><p>「ノアには三人の息子、セム、ハム、ヤフェトが生まれた」（<a href="https://bibleox.com/ja/jp-ni/gen/6/#L10">創. 6:10</a>）</p></blockquote><blockquote><p>「まさにこの日、ノアも、息子のセム、ハム、ヤフェト、ノアの妻、この三人の息子の嫁たちも、箱舟に入った」（<a href="https://bibleox.com/ja/jp-ni/gen/7/#L13">創. 7:13</a>）</p></blockquote><blockquote><p>「箱舟から出たノアの息子は、セム、ハム、ヤフェトであった。ハムはカナンの父である」（<a href="https://bibleox.com/ja/jp-ni/gen/9/#L18">創. 9:18</a>）</p></blockquote><p>ハム：</p><blockquote><p>「ハムの子孫は、クシュ、エジプト、プト、カナンであった」（<a href="https://bibleox.com/ja/jp-ni/gen/10/#L6">創. 10:6</a>）</p></blockquote><blockquote><p>「ハムの子らは、クシュ、エジプト、プト、カナン」（<a href="https://bibleox.com/ja/jp-ni/1par/1/#L8">代上. 1:8</a>）</p></blockquote><p><strong>クシュ</strong> — エチオピア（黒人）。<strong>エジプト</strong>（ヘブライ語 מִצְרַיִם —「ミツライム」） — エジプト（浅黒い人々）。<strong>プト</strong> — リビア（白人）。<strong>カナン</strong> — 肥沃な三日月地帯の西部（黒人ではない）。ノアが呪うのはまさに彼です（<a href="https://bibleox.com/ja/jp-ni/gen/9/#L25,27">創. 9:25,27</a>）。シュメール人（黒人ではない）もクシュの子孫（ニムロド — <a href="https://bibleox.com/ja/jp-ni/gen/10/#L8">創. 10:8</a>）から出ました。［<a href="https://www.youtube.com/watch?v=JPGyRZqSZkY">詳しい分析（ロシア語）</a>］<strong><em>注</em></strong><em>：アダムの息子たちは自分の姉妹を妻としました。神の「増えよ」という戒めを果たすには、ほかに方法がなかったのです。さらに、ノアの孫たちにも同じような状況が生じました。洪水の後、地上のすべての人は最も近い親族同士だったのです。近親婚が禁じられるのはずっと後、預言者モーセの時代です。ユダヤ人の民は、兄と妹、すなわちアブラハムとサラから出ています（</em><a href="https://bibleox.com/ja/jp-ni/gen/20/#L12"><em>創. 20:12</em></a><em>）。この記事の残りの部分はまだ手を加える必要があります。諸民族と人種の祖先について聖書に見られる情報を、これから記述しなければなりません。</em></p>

