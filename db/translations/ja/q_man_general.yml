    menu: { parent: "人間", title: "教育", priority: 7 }
    body: |-
      <blockquote><p>「子よ、<strong>若いときから教訓を受け入れよ</strong>。白髪になるまでに、<strong>知恵を見いだすように</strong>。耕し、種蒔く農夫のように、知恵に近づき、その豊かな実りを待ち望め。知恵を得るには、しばらく苦労するが、やがて、その実を味わうだろう。<strong>教訓を受け入れない者にとって、知恵はなんと忌まわしいことか</strong>。愚かな者は、知恵の中に踏みとどまれない。力試しの石のように、知恵は重荷となって彼を苦しめ、彼はすぐにそれをほうり出す」（<a href="https://bibleox.com/ja/jp-ni/prsir/6/#L18-21">シラ. 6:18-21</a>）</p></blockquote><blockquote><p>「<strong>いつまで浅はかな者は浅はかであることに愛着をもち</strong>不遜な者は不遜であることを好み愚か者は知ることをいとうのか。&lt;…&gt; <strong>浅はかな者は座して死に至り愚か者は無為の内に滅びる</strong>」（<a href="https://bibleox.com/ja/jp-ni/pr/1/#L22,32">箴. 1:22,32</a>）</p></blockquote><blockquote><p>「貧乏でも、完全な道を歩む人は唇の曲がった<strong>愚か者</strong>よりも幸いだ。知識がなければ欲しても不毛だ。あまり足を急がせると過ちを犯す。<strong>人は無知によって自分の道を滅ぼす</strong>。しかも主に対して心に憤りをもつ」（<a href="https://bibleox.com/ja/jp-ni/pr/19/#L1-3">箴. 19:1-3</a>）</p></blockquote><blockquote><p>「<strong>心を得た人は自分の魂を愛する</strong>。英知を守る人は幸いを見いだす」（<a href="https://bibleox.com/ja/jp-ni/pr/19/#L8">箴. 19:8</a>）</p></blockquote><blockquote><p>「怠け者の畑の傍らを<strong>意志の弱い者</strong>のぶどう畑の傍らを、通ってみた。見よ、<strong>いらくさが一面に茂り</strong>あざみが覆い尽くし、石垣は崩れていた」（<a href="https://bibleox.com/ja/jp-ni/pr/24/#L30-31">箴. 24:30-31</a>）<em>（「意志の弱い者」は、ヘブライ語原文では חֲסַר־לֵב —「心（分別）の欠けた者」です。）</em></p></blockquote><blockquote><p>「<strong>自分自身と教えとに気を配りなさい。以上のことをしっかりと守りなさい</strong>。そうすれば、あなたは自分自身と、あなたの言葉を聞く人々とを救うことになります」（<a href="https://bibleox.com/ja/jp-ni/1tim/4/#L16">１テモ. 4:16</a>）</p></blockquote><blockquote><p>「<strong>民の愚かな者よ、気づくがよい</strong>。<strong>無知な者よ</strong>、いつになったら目覚めるのか」（<a href="https://bibleox.com/ja/jp-ni/ps/94/#L8">詩. 94:8</a>）</p></blockquote><blockquote><p>「諭しを愛する人は知識を愛する。<strong>懲らしめを憎む者は愚かだ</strong>」（<a href="https://bibleox.com/ja/jp-ni/pr/12/#L1">箴. 12:1</a>）</p></blockquote><blockquote><p>「<strong>浅はかな者は座して死に至り</strong>愚か者は無為の内に滅びる」（<a href="https://bibleox.com/ja/jp-ni/pr/1/#L32">箴. 1:32</a>）</p></blockquote><blockquote><p>「<strong>浅はかな者は無知を嗣業とし</strong>熟慮ある人は知識をその冠とする」（<a href="https://bibleox.com/ja/jp-ni/pr/14/#L18">箴. 14:18</a>）</p></blockquote><blockquote><p>「知恵ある人の冠はその富。<strong>愚か者の冠はその無知</strong>」（<a href="https://bibleox.com/ja/jp-ni/pr/14/#L24">箴. 14:24</a>）</p></blockquote><blockquote><p>「<strong>うそ</strong>は、人間にとって醜い汚点、<strong>教養のない人間は、絶えずそれを口にする</strong>」（<a href="https://bibleox.com/ja/jp-ni/prsir/20/#L24">シラ. 20:24</a>）</p></blockquote><blockquote><p>「<strong>教訓を真心から望むことが知恵の始まりであり</strong>、<strong>教訓に心を配ることは知恵への愛である</strong>。この愛は知恵の命じる掟を守ることである。掟を守ることは不滅を保障し」（<a href="https://bibleox.com/ja/jp-ni/prs/6/#L17-18">知. 6:17-18</a>）</p></blockquote><blockquote><p>「ヤンネとヤンブレがモーセに逆らったように、彼らも<strong>真理に逆らっています</strong>。彼らは精神の腐った人間で、<strong>信仰の失格者です</strong>」（<a href="https://bibleox.com/ja/jp-ni/2tim/3/#L8">２テモ. 3:8</a>）</p></blockquote><blockquote><p>「彼は、どの手紙の中でもこのことについて述べています。その手紙には難しく理解しにくい個所があって、<strong>無学な</strong>人や心の定まらない人は、それを<strong>聖書のほかの部分と同様に曲解し、自分の滅びを招いています</strong>」（<a href="https://bibleox.com/ja/jp-ni/2pet/3/#L16">２ペト. 3:16</a>）</p></blockquote>

  - src: человек-труд
    path: Wk8l_労働
    title: 労働
    title_sub: 働くことの必要についての聖書の引用
    meta_desc: 働くことの必要についての聖書の引用
    menu: { parent: "人間", title: "労働", priority: 8 }
    body: |-
      <blockquote><p>「<strong><mark>お前は顔に汗を流してパンを得る</mark></strong>土に返るときまで。お前がそこから取られた土に。塵にすぎないお前は塵に返る」（<a href="https://bibleox.com/ja/jp-ni/gen/3/#L19">創. 3:19</a>）</p></blockquote><blockquote><p>「しかし、兄弟たち、なおいっそう励むように<strong><mark>勧めます</mark></strong>。そして、<strong>わたしたちが命じておいたように</strong>、落ち着いた生活をし、自分の仕事に励み、<strong><mark>自分の手で働くように</mark></strong>努めなさい」（<a href="https://bibleox.com/ja/jp-ni/1sol/4/#L10-11">１テサ. 4:10-11</a>）</p></blockquote><blockquote><p>「その後、<strong>パウロ</strong>はアテネを去ってコリントへ行った。&lt;…&gt; <strong>職業が同じであったので</strong>、彼らの家に住み込んで、一緒に仕事をした。<strong><mark>その職業はテント造りであった</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/act/18/#L1,3">使. 18:1,3</a>）</p></blockquote><blockquote><p>「今の今までわたしたちは、飢え、渇き、着る物がなく、虐待され、身を寄せる所もなく、<strong><mark>苦労して自分の手で稼いでいます</mark></strong>。侮辱されては祝福し、迫害されては耐え忍び」（<a href="https://bibleox.com/ja/jp-ni/1kor/4/#L11-12">１コリ. 4:11-12</a>）</p></blockquote><blockquote><p>「盗みを働いていた者は、今からは盗んではいけません。<strong><mark>むしろ、労苦して自分の手で正当な収入を得</mark></strong>、困っている人々に分け与えるようにしなさい」（<a href="https://bibleox.com/ja/jp-ni/ef/4/#L28">エフェ. 4:28</a>）</p></blockquote><blockquote><p>「<strong>わたしは、他人の金銀や衣服をむさぼったことはありません</strong>。ご存じのとおり、<strong><mark>わたしはこの手で、わたし自身の生活のためにも</mark>、共にいた人々のためにも働いたのです</strong>。あなたがたもこのように働いて弱い者を助けるように、また、主イエス御自身が『受けるよりは与える方が幸いである』と言われた言葉を思い出すようにと、わたしはいつも身をもって示してきました」（<a href="https://bibleox.com/ja/jp-ni/act/20/#L33-35">使. 20:33-35</a>）</p></blockquote><blockquote><p>「わたしたちの宣教は、迷いや不純な動機に基づくものでも、また、ごまかしによるものでもありません。&lt;…&gt; あなたがたが知っているとおり、わたしたちは、相手にへつらったり、<strong>口実を設けてかすめ取ったりはしませんでした</strong>。そのことについては、神が証ししてくださいます。&lt;…&gt; 兄弟たち、わたしたちの労苦と骨折りを覚えているでしょう。わたしたちは、<strong><mark>だれにも負担をかけまいとして、夜も昼も働きながら</mark></strong>、神の福音をあなたがたに宣べ伝えたのでした」（<a href="https://bibleox.com/ja/jp-ni/1sol/2/#L3,5,9">１テサ. 2:3,5,9</a>）</p></blockquote><blockquote><p>「<strong>また、だれからもパンをただでもらって食べたりはしませんでした。むしろ、だれにも負担をかけまいと、<mark>夜昼大変苦労して、働き続けたのです</mark>。</strong>援助を受ける権利がわたしたちになかったからではなく、あなたがたがわたしたちに倣うように、身をもって模範を示すためでした。実際、あなたがたのもとにいたとき、わたしたちは、<strong>『働きたくない者は、食べてはならない』</strong>と命じていました」（<a href="https://bibleox.com/ja/jp-ni/2sol/3/#L8-10">２テサ. 3:8-10</a>）</p></blockquote><blockquote><p>「<strong><mark>骨の折れる仕事</mark></strong>や、いと高き方が定められた畑仕事を、<strong><mark>嫌ってはならない</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/prsir/7/#L15">シラ. 7:15</a>）</p></blockquote><blockquote><p>「<strong><mark>働いて</mark></strong>、すべてに満ち足りている人の方が、パンを得る手だてを持たず、見栄を張って生きる人に<strong><mark>まさる</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/prsir/10/#L27">シラ. 10:27</a>）</p></blockquote><blockquote><p>「彼が怠けないように、熱心に仕事をさせよ。<strong><mark>怠惰は多くの悪行を教える</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/prsir/33/#L28-29">シラ. 33:28-29</a>）</p></blockquote><blockquote><p>「<strong>怠け者</strong>の畑の傍らを意志の弱い者のぶどう畑の傍らを、通ってみた。見よ、いらくさが一面に茂りあざみが覆い尽くし、石垣は崩れていた」（<a href="https://bibleox.com/ja/jp-ni/pr/24/#L30-31">箴. 24:30-31</a>）</p></blockquote>

  - src: болезни
    path: Ds9s_病気
    title: 病気
    title_sub: 病気と、信者がそれをどう受け止めるべきかについての聖書の引用
    meta_desc: 病気と、信者がそれをどう受け止めるべきかについての聖書の引用
    menu: { parent: "人間", title: "病気", priority: 9 }
    body: |-
      <h2>最初のキリスト者たちも病気にかかった</h2><p>テモテ（エフェソの主教）は胃を患っており、使徒パウロが病気のゆえに斎を緩めるよう言うほどでした：</p><blockquote><p>「<strong>これからは水ばかり飲まないで</strong>、<strong>胃のために、また、度々起こる病気のために</strong>、ぶどう酒を少し用いなさい」（<a href="https://bibleox.com/ja/jp-ni/1tim/5/#L23">１テモ. 5:23</a>）</p></blockquote><p>使徒パウロ自身も、高ぶらないように病を与えられました：</p><blockquote><p>「また、あの啓示された事があまりにもすばらしいからです。それで、そのために思い上がることのないようにと、<strong>わたしの身に一つのとげが与えられました</strong>。それは、<strong>思い上がらないように</strong>、わたしを痛めつけるために、サタンから送られた使いです」（<a href="https://bibleox.com/ja/jp-ni/2kor/12/#L7">２コリ. 12:7</a>）</p></blockquote><p>エパフロディト（使徒パウロの同労者）は病気になり、死にかけました：</p><blockquote><p>「ところでわたしは、<strong>エパフロディト</strong>をそちらに帰さねばならないと考えています。彼はわたしの兄弟、協力者、戦友であり、また、あなたがたの使者として、わたしの窮乏のとき奉仕者となってくれましたが、しきりにあなたがた一同と会いたがっており、<strong>自分の病気があなたがたに知られたこと</strong>を心苦しく思っているからです。実際、<strong>彼はひん死の重病にかかりましたが</strong>、神は彼を憐れんでくださいました。彼だけでなく、わたしをも憐れんで、悲しみを重ねずに済むようにしてくださいました。&lt;…&gt; わたしに奉仕することであなたがたのできない分を果たそうと、彼はキリストの業に命をかけ、<strong>死ぬほどの目に遭ったのです</strong>」（<a href="https://bibleox.com/ja/jp-ni/fil/2/#L25-27,30">フィリ. 2:25-27,30</a>）</p></blockquote><p>使徒パウロは、罪を犯しているキリスト者を、病に打たれるようサタンに引き渡します：</p><blockquote><p>「現に居合わせた者のように、そんなことをした者を既に裁いてしまっています。&lt;…&gt; <strong>このような者を、その肉が滅ぼされるようにサタンに引き渡したのです。それは主の日に彼の霊が救われるためです</strong>」（<a href="https://bibleox.com/ja/jp-ni/1kor/5/#L3,5">１コリ. 5:3,5</a>）</p></blockquote><p>聖体機密にふさわしくないままであずかったことが、多くのキリスト者を病気、衰弱、さらには死に至らせました：</p><blockquote><p>「そのため、<strong>あなたがたの間に弱い者や病人がたくさんおり</strong>、多くの者が死んだのです」（<a href="https://bibleox.com/ja/jp-ni/1kor/11/#L30">１コリ. 11:30</a>）</p></blockquote><p>旧約の義人たちも病気にかかりました</p><blockquote><p>「<em>イサクは年をとり、</em><strong><em>目がかすんで見えなくなってきた</em></strong><em>…」</em>（<a href="https://bibleox.com/ja/jp-ni/gen/27/#L1">創. 27:1</a>）</p></blockquote><h2>体の苦しみの益</h2><h3>罪から離れる助けとなる</h3><blockquote><p>「キリストは肉に苦しみをお受けになったのですから、あなたがたも同じ心構えで武装しなさい。<strong>肉に苦しみを受けた者は、罪とのかかわりを絶った者なのです</strong>」（<a href="https://bibleox.com/ja/jp-ni/1pet/4/#L1">１ペト. 4:1</a>）</p></blockquote><h3>高慢から守る</h3><blockquote><p>「また、<strong>あの啓示された事があまりにもすばらしいからです。それで、そのために思い上がることのないようにと、わたしの身に一つのとげが与えられました。それは、思い上がらないように、わたしを痛めつけるために、サタンから送られた使いです</strong>」（<a href="https://bibleox.com/ja/jp-ni/2kor/12/#L7">２コリ. 12:7</a>）</p></blockquote><h3>正気に立ち返らせる</h3><blockquote><p>「<strong>こうして、さすがの彼の高慢も完膚なきまでに砕かれ、神の鞭の一打ちごとに痛みも増し加わり、神の力を思い知ることとなった</strong>」（<a href="https://bibleox.com/ja/jp-ni/2mak/9/#L11">２マカ. 9:11</a>）</p></blockquote><h2>神は病によって罰することがおできになる</h2><p>神は不法と罪のゆえに罰することがおできになります：</p><blockquote><p>「なぜ傷口を見て叫ぶのか。<strong>お前の痛みはいやされない</strong>。<strong>お前の悪が甚だしく罪がおびただしいのでわたしがお前にこうしたのだ</strong>」（<a href="https://bibleox.com/ja/jp-ni/ier/30/#L15">エレ. 30:15</a>）</p></blockquote><p>神は、モーセを非難したミリアム（アロンとモーセの姉）を重い皮膚病で罰せられました：</p><blockquote><p>「あなたたちは何故、畏れもせずわたしの僕モーセを非難するのか。」<strong>主は、彼らに対して憤り</strong>、去って行かれ、雲は幕屋を離れた。そのとき、見よ、<strong>ミリアムは重い皮膚病にかかり、雪のように白くなっていた</strong>。アロンはミリアムの方を振り向いた。見よ、彼女は重い皮膚病にかかっていた」（<a href="https://bibleox.com/ja/jp-ni/chis/12/#L8-10">民. 12:8-10</a>）</p></blockquote><p>イスラエルの民は、神への礼拝から離れたために疫病に見舞われました：</p><blockquote><p>「イスラエルはこうして、ペオルのバアルを慕ったので、<strong>主はイスラエルに対して憤られた</strong>。&lt;…&gt; <strong>この災害で死んだ者は二万四千人であった</strong>」（<a href="https://bibleox.com/ja/jp-ni/chis/25/#L3,9">民. 25:3,9</a>）</p></blockquote><p>救い主は、病気の原因として罪を指摘しておられます：</p><blockquote><p>「その後、イエスは、神殿の境内でこの人に出会って言われた。『<strong>あなたは良くなったのだ。もう、罪を犯してはいけない。さもないと、もっと悪いことが起こるかもしれない</strong>』」（<a href="https://bibleox.com/ja/jp-ni/in/5/#L14">ヨハ. 5:14</a>）</p></blockquote><p>神は憐れみ、病から守ることもおできになります</p><blockquote><p>「<em>言われた。『</em><strong><em>もしあなたが、あなたの神、主の声に必ず聞き従い</em></strong><em>、彼の目にかなう正しいことを行い、彼の命令に耳を傾け、すべての掟を守るならば、</em><strong><em>わたしがエジプト人に下した病をあなたには下さない</em></strong><em>。わたしはあなたをいやす主である』</em>」（<a href="https://bibleox.com/ja/jp-ni/ish/15/#L26">出. 15:26</a>）</p></blockquote><h2>すべての病気が罪から来るのではない</h2><blockquote><p>「さて、イエスは通りすがりに、生まれつき目の見えない人を見かけられた。弟子たちがイエスに尋ねた。『ラビ、この人が生まれつき目が見えないのは、だれが罪を犯したからですか。本人ですか。それとも、両親ですか。』イエスはお答えになった。『<strong>本人が罪を犯したからでも、両親が罪を犯したからでもない。神の業がこの人に現れるためである</strong>』」（<a href="https://bibleox.com/ja/jp-ni/in/9/#L1-3">ヨハ. 9:1-3</a>）</p></blockquote><p>こちらも参照：<a href="https://bibleox.com/ru/q/%D0%BC%D0%B5%D0%B4%D0%B8%D1%86%D0%B8%D0%BD%D0%B0">医療</a>。</p><h2>ディダケー — 1～2世紀のキリスト教文書</h2><blockquote><p>「<strong>あなたの身に起こることはすべて善いこととして受け入れなさい。神なしには何事も起こらないことを知って</strong>」</p></blockquote><p>（<a href="https://bibleox.com/en/en/w/Didache/#HH-3">ディダケー、3章</a>、英語。英訳からの訳）</p>

