    menu: { parent: "人間", title: "借金生活", priority: 10 }
    body: |-
      <blockquote><p>「金持ちが貧乏な者を支配する。<strong><mark>借りる者は貸す者の奴隷となる</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/pr/22/#L7">箴. 22:7</a>）</p></blockquote><blockquote><p>「手を打って誓うな、負債の保証をするな。<strong><mark>償うための物があなたになければ敷いている寝床まで取り上げられるであろう</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/pr/22/#L26-27">箴. 22:26-27</a>）</p></blockquote><blockquote><p>「もっとも、<strong>信心は、満ち足りることを知る者には、大きな利得の道です</strong>。なぜならば、わたしたちは、何も持たずに世に生まれ、世を去るときは何も持って行くことができないからです。<strong><mark>食べる物と着る物があれば、わたしたちはそれで満足すべきです</mark></strong>。金持ちになろうとする者は、誘惑、罠、無分別で有害なさまざまの欲望に陥ります。その欲望が、人を滅亡と破滅に陥れます。<strong><mark>金銭の欲は、すべての悪の根です</mark></strong>。金銭を追い求めるうちに信仰から迷い出て、さまざまのひどい苦しみで突き刺された者もいます」（<a href="https://bibleox.com/ja/jp-ni/1tim/6/#L6-10">１テモ. 6:6-10</a>）</p></blockquote><blockquote><p>「金銭に執着しない生活をし、<strong><mark>今持っているもので満足しなさい</mark></strong>。神御自身、『わたしは、決してあなたから離れず、決してあなたを置き去りにはしない』と言われました」（<a href="https://bibleox.com/ja/jp-ni/evr/13/#L5">ヘブ. 13:5</a>）</p></blockquote>

  - src: медицина
    path: Md11c_医療
    title: 医療
    meta_desc: 医療と薬についての聖書の引用
    menu: { parent: "人間", title: "医療", priority: 11 }
    body: |-
      <p>預言者イザヤは、薬になるものによる治療を認めています：</p><blockquote><p>「イザヤが、『<strong>干しいちじくを取って来るように</strong>』と言うので、<strong>人々がそれを取って来て患部に当てると</strong>、ヒゼキヤは回復した」（<a href="https://bibleox.com/ja/jp-ni/4ts/20/#L7">王下. 20:7</a>）</p></blockquote><p>神は植物を造られ、そのうちのあるものに薬効を持たせられました：</p><blockquote><p>「医者をその仕事のゆえに敬え。主が医者を造られたのだから。いやしの業はいと高き方から授かり、それによって、王からは褒美を受ける。医者はその博識によって高い身分を与えられ、権勢ある人々の前で驚嘆される。<strong>主は大地から薬を造られた</strong>。分別ある人は薬を軽んじたりはしない」（<a href="https://bibleox.com/ja/jp-ni/prsir/38/#L1-4">シラ. 38:1-4</a>）</p></blockquote><p>医者にかかるときにも神に希望を置くこと：</p><blockquote><p>「<em>子よ、</em><strong><em>病気になったら放置せず、主に祈れ。そうすれば、主は治してくださる</em></strong><em>。過ちを犯すな。手を汚すな。あらゆる罪から心を清めよ。&lt;…&gt; </em><strong><em>その上で、医者にも助けを求めよ。主が医者を造られたのだから。彼を去らせるな。お前には彼が必要なのだ</em></strong><em>。医者の手によって病気が治る時もある。医者もまた主に祈り求めているのだ。病人の苦しみを和らげ、命を永らえさせる治療に成功することを」</em>（<a href="https://bibleox.com/ja/jp-ni/prsir/38/#L9-14">シラ. 38:9-14</a>）</p></blockquote><p>医者だけにすべての希望を置くのは誤りです：</p><blockquote><p>「その病の中にあっても、彼は主を求めず、医者に頼った」（<a href="https://bibleox.com/ja/jp-ni/2par/16/#L12">代下. 16:12</a>）</p></blockquote><p>使徒であり福音記者であるルカは医者でした：</p><blockquote><p>「愛する医者ルカ」（<a href="https://bibleox.com/ja/jp-ni/kol/4/#L14">コロ. 4:14</a>）</p></blockquote>

  - src: все-люди-грешны
    path: As12n_すべての人は罪人である
    title: すべての人は罪人である
    title_sub: 原罪の普遍性についての聖書の引用
    meta_desc: 原罪の普遍性についての聖書の引用
    menu: { parent: "人間", title: "すべての人は罪人", priority: 12 }
    references: |-
      <p>詳しく：</p><ul><li><p><a href="https://azbyka.ru/grex-pervorodnyj">https://azbyka.ru/grex-pervorodnyj</a>（ロシア語）</p></li></ul>
    body: |-
      <p><strong>原罪</strong> —</p><p>1) アダムとエバの始祖の罪。</p><p>2) 人間の本性の損傷。人間の本性は今や罪深い思い、言葉、行いへと引き寄せられています（悪をしたいと望み、善を行うには意志の努力が必要です）。この状態は生まれるときに子孫に受け継がれます。主イエス・キリストを除くすべての人にです。</p><h2>受胎の時から、すべての人は始祖（アダムとエバ）から罪深さを受け継ぐ</h2><blockquote><p>「汚れたものから清いものを引き出すことができましょうか。<strong>だれひとりできないのです</strong>」（<a href="https://bibleox.com/ja/jp-ni/iov/14/#L4">ヨブ. 14:4</a>）</p></blockquote><blockquote><p>「では、どうなのか。わたしたちには優れた点があるのでしょうか。全くありません。既に指摘したように、ユダヤ人もギリシア人も<strong>皆、罪の下にあるのです</strong>。次のように書いてあるとおりです。『<strong>正しい者はいない。一人もいない</strong>。悟る者もなく、神を探し求める者もいない。皆迷い、だれもかれも役に立たない者となった。善を行う者はいない。ただの一人もいない』」（<a href="https://bibleox.com/ja/jp-ni/rim/3/#L9-12">ロマ. 3:9-12</a>）</p></blockquote><blockquote><p>「人は<strong>皆、罪を犯して</strong>神の栄光を受けられなくなっていますが」（<a href="https://bibleox.com/ja/jp-ni/rim/3/#L23">ロマ. 3:23</a>）</p></blockquote><blockquote><p>「このようなわけで、<strong>一人の人によって罪が世に入り</strong>、罪によって死が入り込んだように、<strong>死はすべての人に及んだのです。すべての人が罪を犯したからです</strong>」（<a href="https://bibleox.com/ja/jp-ni/rim/5/#L12">ロマ. 5:12</a>）<em>（「すべての人が罪を犯したからです」の「からです」は、ギリシア語原文では ἐφ᾿ ᾧ で、「その人（アダム）において」とも理解されます。）</em></p></blockquote><blockquote><p>「<strong>一人の人の不従順によって多くの人が罪人とされた</strong>ように、一人の従順によって多くの人が正しい者とされるのです」（<a href="https://bibleox.com/ja/jp-ni/rim/5/#L19">ロマ. 5:19</a>）</p></blockquote><blockquote><p>「わたしたちは、律法が霊的なものであると知っています。しかし、<strong>わたしは肉の人であり、罪に売り渡されています</strong>。&lt;…&gt;『内なる人』としては神の律法を喜んでいますが、<strong>わたしの五体にはもう一つの法則があって心の法則と戦い</strong>、<strong>わたしを、五体の内にある罪の法則のとりこにしている</strong>のが分かります」（<a href="https://bibleox.com/ja/jp-ni/rim/7/#L14,22-23">ロマ. 7:14,22-23</a>）</p></blockquote><blockquote><p>「わたしたちも<strong>皆</strong>、こういう者たちの中にいて、以前は肉の欲望の赴くままに生活し、肉や心の欲するままに行動していたのであり、ほかの人々と同じように、<strong>生まれながら神の怒りを受けるべき者でした</strong>」（<a href="https://bibleox.com/ja/jp-ni/ef/2/#L3">エフェ. 2:3</a>）</p></blockquote><blockquote><p>「わたしは咎のうちに産み落とされ<strong>母がわたしを身ごもったときもわたしは罪のうちにあったのです</strong>」（<a href="https://bibleox.com/ja/jp-ni/ps/51/#L7">詩. 51:7</a>）</p></blockquote><blockquote><p>「<strong>人の心は何にもまして、とらえ難く病んでいる</strong>。誰がそれを知りえようか」（<a href="https://bibleox.com/ja/jp-ni/ier/17/#L9">エレ. 17:9</a>）</p></blockquote><h2>成長するにつれて、すべての人は自分自身の罪深さをも身につける</h2><blockquote><p>「善のみ行って<strong>罪を犯さないような人間</strong>はこの地上にはいない」（<a href="https://bibleox.com/ja/jp-ni/ekl/7/#L20">コヘ. 7:20</a>）</p></blockquote><blockquote><p>「実際には、<strong>生まれてきた人の中で不敬虔なふるまいをしなかった者は一人もいません</strong>。信仰を告白する人の中にさえ、罪を犯さなかった人はいません」（<a href="https://bibleox.com/ja/jp-ni/3ezd/8/#L35">３エズ. 8:35</a>）</p></blockquote><blockquote><p>「<strong>自分に罪がないと言うなら、自らを欺いており</strong>、真理はわたしたちの内にありません」（<a href="https://bibleox.com/ja/jp-ni/1in/1/#L8">１ヨハ. 1:8</a>）</p></blockquote><blockquote><p>「<strong>罪を犯さない者は一人もいません</strong>」（<a href="https://bibleox.com/ja/jp-ni/2par/6/#L36">代下. 6:36</a>）</p></blockquote><blockquote><p>「決してそうではない。<strong>人はすべて偽り者である</strong>としても、神は真実な方であるとすべきです。『あなたは、言葉を述べるとき、正しいとされ、裁きを受けるとき、勝利を得られる』と書いてあるとおりです」（<a href="https://bibleox.com/ja/jp-ni/rim/3/#L4">ロマ. 3:4</a>）</p></blockquote><blockquote><p>「次のように書いてあるとおりです。『<strong>正しい者はいない。一人もいない</strong>』」（<a href="https://bibleox.com/ja/jp-ni/rim/3/#L10">ロマ. 3:10</a>）</p></blockquote><blockquote><p>「しかし、<strong>聖書はすべてのものを罪の支配下に閉じ込めたのです</strong>。それは、神の約束が、イエス・キリストへの信仰によって、信じる人々に与えられるようになるためでした」（<a href="https://bibleox.com/ja/jp-ni/gal/3/#L22">ガラ. 3:22</a>）</p></blockquote><h2>神は悔い改めと改善へと招いておられる</h2><blockquote><p>「さて、神はこのような無知な時代を、大目に見てくださいましたが、<strong><mark>今はどこにいる人でも皆悔い改めるようにと、命じておられます</mark></strong>。それは、先にお選びになった一人の方によって、この世を正しく裁く日をお決めになったからです。神はこの方を死者の中から復活させて、すべての人にそのことの確証をお与えになったのです」（<a href="https://bibleox.com/ja/jp-ni/act/17/#L30-31">使. 17:30-31</a>）</p></blockquote><blockquote><p>「すると、ペトロは彼らに言った。『<strong><mark>悔い改めなさい。めいめい、イエス・キリストの名によって洗礼を受け、罪を赦していただきなさい</mark></strong>。そうすれば、賜物として聖霊を受けます』」（<a href="https://bibleox.com/ja/jp-ni/act/2/#L38">使. 2:38</a>）</p></blockquote><blockquote><p>「<strong><mark>信じて洗礼を受ける者は救われるが</mark></strong>、<strong><mark>信じない者は滅びの宣告を受ける</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/mk/16/#L16">マコ. 16:16</a>）</p></blockquote><p>神は、御自身が2000年前に造られた<a href="https://bibleox.com/ja/ja/w/71cW_教会/"><strong>正教会</strong></a>を通して救いへと招いておられます。正教会には<a href="https://bibleox.com/ja/ja/w/Bp1t_洗礼/"><strong>洗礼</strong></a>によって入ります。</p>

  - src: Исцеления
    path: Hl13g_いやし
    title: いやし
    meta_desc: 物、遺骸（不朽体）、水、衣服を通して、また直接に起こったいやし
    menu: { parent: "人間", title: "いやし", priority: 13 }
    body: |-
      <h2>遺骸（不朽体）を通して</h2><blockquote><p>「人々がある人を葬ろうとしていたとき、その部隊を見たので、彼をエリシャの墓に投げ込んで立ち去った。その人は<strong>エリシャの骨</strong>に触れると生き返り、自分の足で立ち上がった」（<a href="https://bibleox.com/ja/jp-ni/4ts/13/#L21">王下. 13:21</a>）</p></blockquote><h2>水を通して</h2><blockquote><p>「〔彼らは、水が動くのを待っていた。それは、主の使いがときどき池に降りて来て、<strong>水が動くことがあり</strong>、水が動いたとき、真っ先に水に入る者は、どんな病気にかかっていても、いやされたからである。〕」（<a href="https://bibleox.com/ja/jp-ni/in/5/#L4">ヨハ. 5:4</a>）<em>（新共同訳はこの節を〔　〕に入れていますが、ビザンティン本文（多数派写本）では本文の一部です。）</em></p></blockquote><h2>衣服を通して</h2><blockquote><p>「<strong>彼が身に着けていた手ぬぐいや前掛けを持って行って</strong>病人に当てると、病気はいやされ、悪霊どもも出て行くほどであった」（<a href="https://bibleox.com/ja/jp-ni/act/19/#L12">使. 19:12</a>）</p></blockquote><h2>使徒の像（影）を通して</h2><blockquote><p>「<strong>人々は病人を大通りに運び出し</strong>、担架や床に寝かせた。<strong>ペトロが通りかかるとき、せめてその影だけでも病人のだれかにかかるようにした</strong>。また、エルサレム付近の町からも、群衆が病人や汚れた霊に悩まされている人々を連れて集まって来たが、<strong>一人残らずいやしてもらった</strong>」（<a href="https://bibleox.com/ja/jp-ni/act/5/#L15-16">使. 5:15-16</a>）</p></blockquote><h2>直接、神の言葉によって</h2><blockquote><p>「ですから、わたしの方からお伺いするのさえふさわしくないと思いました。<strong>ひと言おっしゃってください。そして、わたしの僕をいやしてください</strong>。&lt;…&gt; 使いに行った人たちが家に帰ってみると、その部下は元気になっていた」（<a href="https://bibleox.com/ja/jp-ni/lk/7/#L7,10">ルカ. 7:7,10</a>）</p></blockquote><h2>物を通しての恵みの働き</h2><blockquote><p>「<strong>杖</strong>を高く上げ、手を海に向かって差し伸べて、海を二つに分けなさい。そうすれば、イスラエルの民は海の中の乾いた所を通ることができる」（<a href="https://bibleox.com/ja/jp-ni/ish/14/#L16">出. 14:16</a>）</p></blockquote>

  - src: христианин-раб-Бога
    path: Sv14g_キリスト者は神の僕
    title: キリスト者は神の僕（奴隷）である
    menu: { parent: "人間", title: "キリスト者は神の僕", priority: 14 }
    body: |-
      <p>キリスト者は自分たちを神の僕、文字どおりには奴隷（ギリシア語 δοῦλοι）と呼びます。キリストなる神の御心を行おうと努めているからです。キリスト者はキリストに仕え、キリストの奴隷であり、自分の意志をキリストに従わせます。しかもそれを自発的に行います。キリストは、その奴隷であることが恥ではないような方です。世界の造り主の奴隷であることも恥ではありません。そしてキリスト者が目指すキリストの国においては、王の王の従順な奴隷であることは、むしろ誉れなのです。<em>（訳注：新共同訳は δοῦλος を多くの場合「僕」と訳していますが、ところどころで「奴隷」とも訳しています。）</em></p><blockquote><p>「<strong><mark>主人が帰って来たとき、目を覚ましているのを見られる僕たちは幸いだ</mark></strong>。はっきり言っておくが、主人は帯を締めて、この僕たちを食事の席に着かせ、そばに来て<strong>給仕してくれる</strong>」（<a href="https://bibleox.com/ja/jp-ni/lk/12/#L37">ルカ. 12:37</a>）</p></blockquote><h2>キリストは御自分の僕と名乗るよう命じておられる</h2><blockquote><p>「あなたがたも同じことだ。自分に命じられたことをみな果たしたら、<strong><mark>『わたしどもは取るに足りない僕です</mark></strong>。しなければならないことをしただけです』と言いなさい」（<a href="https://bibleox.com/ja/jp-ni/lk/17/#L10">ルカ. 17:10</a>）</p></blockquote><blockquote><p>「<strong>あなたがたは、わたしを</strong>『先生』とか<strong>『<mark>主</mark>』とか呼ぶ</strong>。<strong><mark>そのように言うのは正しい</mark>。わたしはそうである</strong>」（<a href="https://bibleox.com/ja/jp-ni/in/13/#L13">ヨハ. 13:13</a>）</p></blockquote><blockquote><p>「『<strong>僕は主人にまさりはしない</strong>』と、わたしが言った言葉を思い出しなさい。人々がわたしを迫害したのであれば、あなたがたをも迫害するだろう。わたしの言葉を守ったのであれば、あなたがたの言葉をも守るだろう」（<a href="https://bibleox.com/ja/jp-ni/in/15/#L20">ヨハ. 15:20</a>）</p></blockquote><h2>使徒たちはキリストの僕であるよう命じている</h2><blockquote><p>「奴隷たち、キリストに従うように、恐れおののき、真心を込めて、肉による主人に従いなさい。人にへつらおうとして、うわべだけで仕えるのではなく、<strong>キリストの奴隷として、</strong>心から神の御心を行い」（<a href="https://bibleox.com/ja/jp-ni/ef/6/#L5-6">エフェ. 6:5-6</a>）</p></blockquote><blockquote><p>「というのは、<strong>主によって召された奴隷は</strong>、主によって自由の身にされた者だからです。同様に、主によって召された自由な身分の者は、<strong>キリストの奴隷なのです</strong>」（<a href="https://bibleox.com/ja/jp-ni/1kor/7/#L22">１コリ. 7:22</a>）</p></blockquote><blockquote><p>「自由な人として生活しなさい。しかし、その自由を、悪事を覆い隠す手だてとせず、<strong>神の僕として</strong>行動しなさい」（<a href="https://bibleox.com/ja/jp-ni/1pet/2/#L16">１ペト. 2:16</a>）</p></blockquote><h2>使徒たちは自分をキリストの僕と呼んでいる</h2><blockquote><p>「こんなことを言って、今わたしは人に取り入ろうとしているのでしょうか。それとも、神に取り入ろうとしているのでしょうか。あるいは、何とかして人の気に入ろうとあくせくしているのでしょうか。もし、今なお人の気に入ろうとしているなら、わたしは<strong>キリストの僕</strong>ではありません」（<a href="https://bibleox.com/ja/jp-ni/gal/1/#L10">ガラ. 1:10</a>）</p></blockquote><blockquote><p>「<strong>神の僕</strong>、イエス・キリストの使徒<strong>パウロ</strong>から――わたしが使徒とされたのは、神に選ばれた人々の信仰を助け、彼らを信心に一致する真理の認識に導くためです」（<a href="https://bibleox.com/ja/jp-ni/tit/1/#L1">テト. 1:1</a>）</p></blockquote><blockquote><p>「<strong>イエス・キリストの僕で</strong>、ヤコブの兄弟である<strong>ユダ</strong>から、父である神に愛され、イエス・キリストに守られている召された人たちへ」（<a href="https://bibleox.com/ja/jp-ni/iud/1/#L1">ユダ. 1:1</a>）</p></blockquote><blockquote><p>「<strong>神と主イエス・キリストの僕であるヤコブ</strong>が、離散している十二部族の人たちに挨拶いたします」（<a href="https://bibleox.com/ja/jp-ni/iak/1/#L1">ヤコ. 1:1</a>）</p></blockquote><blockquote><p>「<strong>イエス・キリストの僕であり、使徒であるシメオン・ペトロから</strong>、わたしたちの神と救い主イエス・キリストの義によって、わたしたちと同じ尊い信仰を受けた人たちへ」（<a href="https://bibleox.com/ja/jp-ni/2pet/1/#L1">２ペト. 1:1</a>）</p></blockquote><blockquote><p>「<strong>キリスト・イエスの僕</strong>、神の福音のために選び出され、召されて使徒となった<strong>パウロ</strong>から」（<a href="https://bibleox.com/ja/jp-ni/rim/1/#L1">ロマ. 1:1</a>）</p></blockquote><blockquote><p>「<strong>あなたがたの一人、キリスト・イエスの僕エパフラスが</strong>、あなたがたによろしくと言っています。彼は、あなたがたが完全な者となり、神の御心をすべて確信しているようにと、いつもあなたがたのために熱心に祈っています」（<a href="https://bibleox.com/ja/jp-ni/kol/4/#L12">コロ. 4:12</a>）</p></blockquote><h2>生神女は自分を主のはしためと呼んでいる</h2><blockquote><p>「マリアは言った。『<strong>わたしは主のはしためです</strong>。お言葉どおり、この身に成りますように。』そこで、天使は去って行った」（<a href="https://bibleox.com/ja/jp-ni/lk/1/#L38">ルカ. 1:38</a>）</p></blockquote><h2>旧約において神は信者たちを御自分の僕と呼ばれた</h2><blockquote><p>「それゆえ、主なる神はこう言われる。見よ、<strong>わたしの僕ら</strong>は糧を得るがお前たちは飢える。見よ、わたしの僕らは飲むことができるがお前たちは渇く。見よ、<strong>わたしの僕ら</strong>は喜び祝うがお前たちは恥を受ける。見よ、<strong>わたしの僕ら</strong>は心の喜びに声をあげるがお前たちは心の痛みに叫びをあげ魂を砕かれて泣き叫ぶ」（<a href="https://bibleox.com/ja/jp-ni/is/65/#L13-14">イザ. 65:13-14</a>）</p></blockquote><blockquote><p>「ヤコブから子孫をユダからわたしの山々を継ぐ者を引き出そう。わたしの選んだ者らがそれを継ぎ<strong>わたしの僕ら</strong>がそこに住むであろう」（<a href="https://bibleox.com/ja/jp-ni/is/65/#L9">イザ. 65:9</a>）</p></blockquote><h2>預言者たちと信者たちは自分を神の僕と呼んだ</h2><blockquote><p>「<strong>わたしはあなたの僕</strong>、<strong>あなたのはしための子</strong>、弱く、はかない命の人間です。裁きと律法とをまだわきまえていません」（<a href="https://bibleox.com/ja/jp-ni/prs/9/#L5">知. 9:5</a>）</p></blockquote><blockquote><p>「そこでわたしは反論した。『天にいます神御自ら、わたしたちにこの工事を成功させてくださる。<strong>その僕であるわたしたち</strong>は立ち上がって町を再建する。あなたたちには、エルサレムの中に領分もなければ、それに対する権利も記録もない』」（<a href="https://bibleox.com/ja/jp-ni/neem/2/#L20">ネヘ. 2:20</a>）</p></blockquote><blockquote><p>「<strong>彼らはあなたの僕</strong>、あなたの民です。あなたが大いなる力と強い御手をもって贖われた者です」（<a href="https://bibleox.com/ja/jp-ni/neem/1/#L10">ネヘ. 1:10</a>）</p></blockquote><blockquote><p>「そして、誓いを立てて言った。『万軍の主よ、<strong>はしための苦しみ</strong>を御覧ください。<strong>はしため</strong>に御心を留め、忘れることなく、男の子をお授けくださいますなら、その子の一生を主におささげし、その子の頭には決してかみそりを当てません』」（<a href="https://bibleox.com/ja/jp-ni/1ts/1/#L11">サム上. 1:11</a>）</p></blockquote><blockquote><p>「<strong>僕たちよ</strong>、主をほめたたえよ。主をほめ歌い、世々限りなくあがめよ」（<a href="https://bibleox.com/ja/gr-lxx-byz/dan/3/#L85">ダニ. 3:85、七十人訳</a>。三人の若者の歌。ギリシア語からの訳：εὐλογεῖτε, δοῦλοι, τὸν κύριον。この箇所は新共同訳のダニエル書にはありません）</p></blockquote><blockquote><p>「すると彼らは、こう答えました。『<strong>わたしどもは天地を創造された主の僕です</strong>』」（<a href="https://bibleox.com/ja/jp-ni/2ezd/6/#L12">２エズ. 6:12</a>）<em>（新共同訳では「エズラ記（ギリシア語）」。）</em></p></blockquote><h2>主人を愛する奴隷もいた</h2><blockquote><p>「自由の身としてあなたのもとを去らせるときは、何も持たずに去らせてはならない。&lt;…&gt; もしその奴隷が<strong>あなたとあなたの家族を愛し</strong>、あなたと共にいることを喜び、『<strong>わたしはあなたのもとから出て行きたくありません</strong>』と言うならば」（<a href="https://bibleox.com/ja/jp-ni/vtor/15/#L13,16">申. 15:13,16</a>）</p></blockquote>

  - src: 3QXG_Одежда
    path: Cl15t_服装
    title: 服装
    menu: { parent: "人間", title: "服装", priority: 15 }
    body: |-
      <p>服装について、旧約には次のような禁止があります：</p><blockquote><p>「<strong>女は男の着物を身に着けてはならない。男は女の着物を着てはならない</strong>。このようなことをする者をすべて、あなたの神、主はいとわれる」（<a href="https://bibleox.com/ja/jp-ni/vtor/22/#L5">申. 22:5</a>）</p></blockquote><p>明らかに、この禁止は<a href="https://bibleox.com/ru/ru/w/XBGN_%D0%A2%D1%80%D0%B0%D0%BD%D1%81%D0%B2%D0%B5%D1%81%D1%82%D0%B8%D0%B7%D0%BC">倒錯</a>に向けられています。人が意図的に異性のように見せようとする場合や、何らかの異常な状態にある場合です。</p><hr><p>新約には、頭を覆うことについての言葉があります：</p><blockquote><p>「<strong>女はだれでも祈ったり、預言したりする際に、頭に物をかぶらないなら</strong>、その頭を侮辱することになります。それは、髪の毛をそり落としたのと同じだからです」（<a href="https://bibleox.com/ja/jp-ni/1kor/11/#L5">１コリ. 11:5</a>）</p></blockquote><p>現代の世界では、女性用のズボンを含め、女性のためのさまざまな服装が考え出されていますが、教会の伝統は、参禱者の身なりについて一定の規則を採り入れています（慎み深いものであるべきです）。女性はスカートをはき、頭を覆い、化粧はできるだけ控えめにして来ることが勧められ、男性には適度に体を覆う服装が勧められます（半ズボンとタンクトップは聖堂にはふさわしくない服装です）。これは神の前にきちんとした姿で立つため（内面の秩序は外面の秩序を排除しません）、また、祈るために聖堂に来た隣人たちの気を、挑発的な身なりによって散らさないためです。</p><p>伝統を守るのに何らかの実際上の困難があるとき、女性はときどきスカーフなどを持参し、聖堂に入る前にズボンの上に巻きます。</p><p>ときには、この伝統を守らない人に対して、ある参禱者がふさわしくない反応をすることがあります。その人は悪意からではなく、単に好奇心から、あるいはそれを知らずに祈るために聖堂に入って来たのです。そのような参禱者は、人々を怖がらせたり追い払ったりしないよう、ましてや無礼な態度をとらないよう求められています。</p>
