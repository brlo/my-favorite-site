    body: |-
      <h2>アブラハムとの契約</h2><h3>約束</h3><blockquote><p>「主はアブラムに言われた。『あなたは生まれ故郷父の家を離れてわたしが示す地に行きなさい。<strong>わたしはあなたを大いなる国民にし</strong><strong>あなたを祝福し</strong>、<strong>あなたの名を高める</strong><strong>祝福の源となるように</strong>。<strong>あなたを祝福する人をわたしは祝福し</strong><strong>あなたを呪う者をわたしは呪う</strong>。<strong>地上の氏族はすべてあなたによって祝福に入る</strong>』」（<a href="https://bibleox.com/ja/jp-ni/gen/12/#L1-3">創. 12:1-3</a>）</p></blockquote><h3>契約</h3><blockquote><p>「これがあなたと結ぶわたしの契約である。<strong>あなたは多くの国民の父となる</strong>。あなたは、もはやアブラムではなく、アブラハムと名乗りなさい。あなたを多くの国民の父とするからである。わたしは、あなたをますます繁栄させ、<strong>諸国民の父とする</strong>。<strong>王となる者たちがあなたから出るであろう</strong>。<strong>わたしは、あなたとの間に、また後に続く子孫との間に契約を立て</strong>、<strong>それを永遠の契約とする</strong>。そして、<strong>あなたとあなたの子孫の神となる</strong>。わたしは、あなたが滞在しているこのカナンのすべての土地を、<strong>あなたとその子孫に、永久の所有地として与える</strong>。<strong>わたしは彼らの神となる</strong>。」神はまた、アブラハムに言われた。「だからあなたも、わたしの契約を守りなさい、あなたも後に続く子孫も。あなたたち、およびあなたの後に続く子孫と、わたしとの間で守るべき契約はこれである。すなわち、<strong>あなたたちの男子はすべて、割礼を受ける</strong>。包皮の部分を切り取りなさい。<strong>これが、わたしとあなたたちとの間の契約のしるしとなる</strong>。いつの時代でも、あなたたちの男子はすべて、直系の子孫はもちろんのこと、家で生まれた奴隷も、外国人から買い取った奴隷であなたの子孫でない者も皆、生まれてから八日目に<strong>割礼を受けなければならない</strong>。あなたの家で生まれた奴隷も、買い取った奴隷も、必ず割礼を受けなければならない。それによって、わたしの契約はあなたの体に記されて永遠の契約となる。包皮の部分を切り取らない無割礼の男がいたなら、その人は民の間から断たれる。わたしの契約を破ったからである。」神はアブラハムに言われた。「あなたの妻サライは、名前をサライではなく、サラと呼びなさい。わたしは彼女を祝福し、彼女によってあなたに男の子を与えよう。わたしは彼女を祝福し、諸国民の母とする。諸民族の王となる者たちが彼女から出る」（<a href="https://bibleox.com/ja/jp-ni/gen/17/#L4-16">創. 17:4-16</a>）</p></blockquote><h3>シナイの契約</h3><blockquote><p>「それゆえ、イスラエルの人々に言いなさい。わたしは主である。わたしはエジプトの重労働の下からあなたたちを導き出し、<strong>奴隷の身分から救い出す</strong>。腕を伸ばし、大いなる審判によってあなたたちを贖う。そして、<strong>わたしはあなたたちをわたしの民とし</strong>、<strong>わたしはあなたたちの神となる</strong>。あなたたちはこうして、わたしがあなたたちの神、主であり、あなたたちをエジプトの重労働の下から導き出すことを知る。<strong>わたしは、アブラハム、イサク、ヤコブに与えると手を上げて誓った土地にあなたたちを導き入れ、その地をあなたたちの所有として与える</strong>。わたしは主である」（<a href="https://bibleox.com/ja/jp-ni/ish/6/#L6-8">出. 6:6-8</a>）</p></blockquote><h2>救い主の到来の約束</h2><h3>最初の人々に</h3><blockquote><p>「主なる神は、蛇に向かって言われた。『このようなことをしたお前はあらゆる家畜、あらゆる野の獣の中で呪われるものとなった。お前は、生涯這いまわり、塵を食らう。<strong>お前と女、<mark>お前の子孫と女の子孫</mark>の間にわたしは敵意を置く</strong>。彼はお前の頭を砕きお前は彼のかかとを砕く』」（<a href="https://bibleox.com/ja/jp-ni/gen/3/#L14-15">創. 3:14-15</a>）</p></blockquote><h3>アブラハムに</h3><blockquote><p>「御使いは言った。『わたしは自らにかけて誓う、と主は言われる。あなたがこの事を行い、自分の独り子である息子すら惜しまなかったので、<strong>あなたを豊かに祝福し、あなたの子孫を</strong>天の星のように、海辺の砂のように<strong>増やそう</strong>。<strong>あなたの子孫は敵の城門を勝ち取る</strong>。<strong><mark>地上の諸国民はすべて、あなたの子孫によって祝福を得る</mark></strong>。あなたがわたしの声に聞き従ったからである』」（<a href="https://bibleox.com/ja/jp-ni/gen/22/#L16-18">創. 22:16-18</a>）</p></blockquote><h3>イサクに</h3><blockquote><p>「そのとき、主がイサクに現れて言われた。『エジプトへ下って行ってはならない。わたしが命じる土地に滞在しなさい。あなたがこの土地に寄留するならば、<strong>わたしはあなたと共にいて</strong><strong>あなたを祝福し</strong>、<strong>これらの土地をすべてあなたとその子孫に与え</strong>、あなたの父アブラハムに誓ったわたしの誓いを成就する。<strong>わたしはあなたの子孫を</strong>天の星のように<strong>増やし</strong>、<strong>これらの土地をすべてあなたの子孫に与える</strong>。<strong><mark>地上の諸国民はすべて、あなたの子孫によって祝福を得る</mark></strong>。アブラハムがわたしの声に聞き従い、わたしの戒めや命令、掟や教えを守ったからである』」（<a href="https://bibleox.com/ja/jp-ni/gen/26/#L2-5">創. 26:2-5</a>）</p></blockquote><h3>ヤコブに</h3><blockquote><p>「わたしは、あなたの父祖アブラハムの神、イサクの神、主である。<strong>あなたが今横たわっているこの土地を、あなたとあなたの子孫に与える</strong>。<strong>あなたの子孫は大地の砂粒のように多くなり</strong>、西へ、東へ、北へ、南へと広がっていくであろう。<strong><mark>地上の氏族はすべて、あなたとあなたの子孫によって祝福に入る</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/gen/28/#L13-14">創. 28:13-14</a>）</p></blockquote><h2>イスラエルの民との契約</h2><blockquote><p>「あなたたちは見たわたしがエジプト人にしたことまた、あなたたちを鷲の翼に乗せてわたしのもとに連れて来たことを。今、<strong><mark>もし</mark>わたしの声に聞き従いわたしの契約を守るならばあなたたちはすべての民の間にあってわたしの宝となる</strong>。世界はすべてわたしのものである。&lt;…&gt; 民は皆、一斉に答えて、『わたしたちは、主が語られたことをすべて、<strong>行います</strong>』と言った」（<a href="https://bibleox.com/ja/jp-ni/ish/19/#L4-5,8">出. 19:4-5,8</a>）</p></blockquote><blockquote><p>「しかし、<strong>もしあなたが彼の声に聞き従い、わたしの語ることをすべて行うならば</strong>、わたしはあなたの敵に敵対し、仇に仇を報いる」（<a href="https://bibleox.com/ja/jp-ni/ish/23/#L22">出. 23:22</a>）</p></blockquote><blockquote><p>「契約の書を取り、民に読んで聞かせた。彼らが、『わたしたちは主が語られたことをすべて<strong>行い、守ります</strong>』と言うと、モーセは血を取り、民に振りかけて言った。『見よ、<strong>これは主がこれらの言葉に基づいてあなたたちと結ばれた契約の血である</strong>』」（<a href="https://bibleox.com/ja/jp-ni/ish/24/#L7-8">出. 24:7-8</a>）</p></blockquote><h2>イスラエルが神から離れたこと</h2><blockquote><p>「主はモーセに仰せになった。『直ちに下山せよ。あなたがエジプトの国から導き上った民は堕落し、<strong>早くもわたしが命じた道からそれて</strong>、若い雄牛の鋳像を造り、それにひれ伏し、いけにえをささげて、「イスラエルよ、これこそあなたをエジプトの国から導き上った神々だ」と叫んでいる』」（<a href="https://bibleox.com/ja/jp-ni/ish/32/#L7-8">出. 32:7-8</a>）</p></blockquote><blockquote><p>「まことに、<strong>わが民</strong>は二つの悪を行った。<strong>生ける水の源であるわたしを捨てて</strong>無用の水溜めを掘った。水をためることのできないこわれた水溜めを」（<a href="https://bibleox.com/ja/jp-ni/ier/2/#L13">エレ. 2:13</a>）</p></blockquote><blockquote><p>「<strong>わが民</strong>は木に託宣を求めその枝に指示を受ける。淫行の霊に惑わされ<strong>神のもとを離れて淫行にふけり</strong>山々の頂でいけにえをささげ丘の上で香をたく。樫、ポプラ、テレビンなどの木陰が快いからだ。お前たちの娘は淫行にふけり嫁も姦淫を行う」（<a href="https://bibleox.com/ja/jp-ni/os/4/#L12-13">ホセ. 4:12-13</a>）</p></blockquote><blockquote><p>「牛は飼い主を知りろばは主人の飼い葉桶を知っている。しかし、<strong>イスラエルは知らずわたしの民は見分けない</strong>。<strong>災いだ、罪を犯す国、咎の重い民悪を行う者の子孫、堕落した子らは。彼らは主を捨てイスラエルの聖なる方を侮り</strong>、背を向けた。<strong>何故、お前たちは背きを重ねなおも打たれようとするのか頭は病み、心臓は衰えているのに。頭から足の裏まで、満足なところはない</strong>。打ち傷、鞭のあと、生傷はぬぐわれず、包まれず油で和らげてもらえない」（<a href="https://bibleox.com/ja/jp-ni/is/1/#L3-6">イザ. 1:3-6</a>）</p></blockquote><blockquote><p>「主よ、御目は真実を求めておられるではありませんか。彼らを打たれても、彼らは痛みを覚えず彼らを打ちのめされても<strong>彼らは懲らしめを受け入れず</strong>その顔を岩よりも固くして<strong>立ち帰ることを拒みました</strong>」（<a href="https://bibleox.com/ja/jp-ni/ier/5/#L3">エレ. 5:3</a>）</p></blockquote><blockquote><p>「かつて、神がソドムとゴモラを覆したようにわたしはお前たちを覆した。お前たちは炎の中から取り出された燃えさしのようになった。しかし、<strong>お前たちはわたしに帰らなかった</strong>と主は言われる」（<a href="https://bibleox.com/ja/jp-ni/am/4/#L11">アモ. 4:11</a>）</p></blockquote><h3>神は、何のためにイスラエルを約束の地から追い出すかを警告された</h3><h4>警告</h4><p>ユダヤ人の民は、神に約束された地を受けるのは自分たちの義のためではないと警告されていました。以前の諸国の民は、その罪の量が満ちあふれたために神の地から追い出されます。イスラエルは、同じように罪を犯すなら、神は彼らをも御自分の地から追い出すという警告と共に、この神の地に導き入れられるのです：</p><blockquote><p>「あなたが行って所有する土地に、あなたの神、主があなたを導き入れ、<strong>多くの民、すなわちあなたにまさる数と力を持つ七つの民、ヘト人、ギルガシ人、アモリ人、カナン人、ペリジ人、ヒビ人、エブス人をあなたの前から追い払い</strong>」（<a href="https://bibleox.com/ja/jp-ni/vtor/7/#L1">申. 7:1</a>; <a href="https://bibleox.com/ja/jp-ni/nav/3/#L10">ヨシュ. 3:10</a>; <a href="https://bibleox.com/ja/jp-ni/ish/3/#L8,17">出. 3:8,17</a>）、</p><p>「<strong><mark>あなたの神、主があなたの前から彼らを追い出されるとき、あなたは、『わたしが正しいので、主はわたしを導いてこの土地を得させてくださった』と思ってはならない</mark></strong>。この国々の民が神に逆らうから、主があなたの前から彼らを追い払われるのである。<strong><mark>あなたが正しく、心がまっすぐであるから、行って、彼らの土地を得るのではなく</mark></strong>、<strong><mark>この国々の民が神に逆らうから、あなたの神、主が彼らを追い払われる。またこうして、主はあなたの先祖、アブラハム、イサク、ヤコブに誓われたことを果たされるのである</mark></strong>。<strong><mark>あなたが正しいので、あなたの神、主がこの良い土地を与え、それを得させてくださるのではないことをわきまえなさい。あなたはかたくなな民である</mark></strong>。<strong>あなたは荒れ野で、あなたの神、主を怒らせたことを思い起こし、忘れてはならない</strong>。あなたたちは、エジプトの国を出た日からここに来るまで主に背き続けてきた。ホレブにいたとき、あなたたちが主を怒らせたので、主はあなたたちに向かって激しく憤り、<strong>滅ぼそうとされた</strong>」（<a href="https://bibleox.com/ja/jp-ni/vtor/9/#L4-8">申. 9:4-8</a>）</p></blockquote><blockquote><p>「あなたたちがかつて住んでいたエジプトの国の風習や、<strong>わたしがこれからあなたたちを連れて行くカナンの風習に従ってはならない</strong>。その掟に従って歩んではならない。&lt;…&gt; <strong>あなたたちは以上のいかなる性行為によっても、身を汚してはならない。これらはすべて、あなたたちの前からわたしが追放しようとしている国々が行って、身を汚していることである</strong>。これらの行為によってこの土地は汚され、わたしはこの地をその罪のゆえに罰し、この地はそこに住む者を吐き出したのである。<strong><mark>あなたたちはわたしの掟と法とを守り</mark></strong>、土地に生まれた者であろうと、あなたたちのもとに寄留する者であろうと、以上に挙げたいとうべきことを一切してはならない。あなたたちがこれから向かう土地の住民はこれらすべてのいとうべきことをしたため、その土地は汚れている。<strong><mark>あなたたちもその土地を汚すならば、先住民を吐き出したと同じように、土地があなたたちを吐き出すであろう</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/lev/18/#L3,24-28">レビ. 18:3,24-28</a>）</p></blockquote><blockquote><p>「しかし、<strong><mark>もしあなたの神、主の御声に聞き従わず</mark></strong>、今日わたしが命じるすべての戒めと掟を忠実に守らないならば、これらの呪いはことごとくあなたに臨み、実現するであろう。&lt;…&gt; <strong>もし、この書に記されているこの律法の言葉をすべて忠実に守らず</strong>、この尊く畏るべき御名、あなたの神、主を畏れないならば、&lt;…&gt; <strong>主は、かつてあなたたちを幸いにして、人数を増やすことを喜ばれたように、今は滅ぼし絶やすことを喜ばれる。<mark>あなたたちは、あなたが入って行って得る土地から引き抜かれる</mark>。</strong>主は地の果てから果てに至るまで、すべての民の間にあなたを散らされる。あなたも先祖も知らなかった、木や石で造られた他の神々に仕えるようになり」（<a href="https://bibleox.com/ja/jp-ni/vtor/28/#L15,58,63-64">申. 28:15,58,63-64</a>）</p></blockquote><h4>イスラエルの民は、罪のために以前に追い出された諸国の民よりも悪いことを行い、同じように追い出された</h4><blockquote><p>「しかし彼らはこれに聞き従わず、マナセに惑わされて、<strong><mark>主がイスラエルの人々の前で滅ぼされた諸国の民よりも更に悪い事を行った</mark></strong>。主はその僕である預言者たちを通してこう告げられた。『ユダの王マナセはこれらの忌むべき事を行い、<strong><mark>かつてアモリ人の行ったすべての事より、更に悪い事を行い</mark></strong>、その偶像によってユダにまで罪を犯させた…』」（<a href="https://bibleox.com/ja/jp-ni/4ts/21/#L9-11">王下. 21:9-11</a>）</p></blockquote><blockquote><p>「ああ、なんと災いなことか、お前は、と主なる神は言われる。すべての悪事の後に、&lt;…&gt; お前の姦淫は他の女たちとは逆である。だれも、お前を誘って姦淫したのではない。お前が報酬を支払われるのではなく、お前の方から報酬を支払っているところが逆である。<strong>それゆえ、姦淫の女よ、主の言葉を聞け</strong>。&lt;…&gt; お前は、自分の夫と息子たちを捨てた母の娘であり、自分の夫と息子たちを捨てた姉妹たちの一人である。<strong>お前の母はヘト人、父はアモリ人である。お前の姉はサマリアであり、彼女とその娘たちはお前の北に住んでいる。また、お前の南に住んでいるお前の妹はソドムとその娘たちである。</strong><strong><mark>お前は彼女たちの道を歩んで、忌まわしいことを行ったばかりでなく、やがて、すべての道において、彼女たちよりもいっそう堕落した</mark>。</strong>わたしは生きている、と主なる神は言われる。<strong><mark>お前の妹であるソドムも、その娘たちも、お前とお前の娘たちが行ったようなことはしなかった</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/iez/16/#L23,34-35,45-48">エゼ. 16:23,34-35,45-48</a>）</p></blockquote><p>イエス・キリストの十字架刑の前、ユダヤ人の民が受けた最大の罰は約70年続きました。バビロン捕囚です。しかしキリストを拒み、殺した後、ユダヤ人の民は約2000年の間自分たちの地から追い出され、神殿は今日に至るまで再建されていません。</p><h2>旧い契約の終わり</h2><p><a href="https://bibleox.com/ru/ru/w/%D0%92%D0%B5%D1%82%D1%85%D0%B8%D0%B9-%D0%97%D0%B0%D0%B2%D0%B5%D1%82-%D0%BA%D0%BE%D0%BD%D0%B5%D1%86">旧約 — その終わり</a></p>

