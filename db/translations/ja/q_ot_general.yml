    path: Op1p_旧約の祭司職
    title: 旧約の祭司職
    meta_desc: 旧約の祭司職についての聖書の引用
    body: |-
      <h2>祭司への任職</h2><h3>儀式</h3><p>任職は油注ぎによって行われます（<a href="https://bibleox.com/ja/jp-ni/ish/28/#L41">出. 28:41</a>）。任職には聖なる祭服が必要であり（<a href="https://bibleox.com/ja/jp-ni/ish/28/#L2-3">出. 28:2-3</a>）、それは職と共に受け継がれます（<a href="https://bibleox.com/ja/jp-ni/ish/29/#L29">出. 29:29</a>）。</p><h3>祭司はアロンの子孫だけ</h3><p>祭司になれたのは、アロン（預言者モーセの兄）とその子孫だけでした（<a href="https://bibleox.com/ja/jp-ni/ish/28/#L1">出. 28:1</a>; <a href="https://bibleox.com/ja/jp-ni/ish/28/#L4">出. 28:4</a>; <a href="https://bibleox.com/ja/jp-ni/ish/29/#L9">出. 29:9</a>）。部外者が祭司の務めを行おうとすれば、死刑に処せられることになっていました（<a href="https://bibleox.com/ja/jp-ni/chis/3/#L10">民. 3:10</a>）。</p><h3>候補者への要求</h3><h4>祭司には体の障害があってはならない</h4><blockquote><p>「アロンに告げなさい。あなたの子孫のうちで、障害のある者は、代々にわたって、神に食物をささげる務めをしてはならない。<strong>だれでも、障害のある者</strong>、すなわち、<strong>目</strong>や<strong>足の不自由な者</strong>、<strong>鼻に欠陥のある者</strong>、手足の不釣り合いの者、<strong>手足の折れた者</strong>、<strong>背中にこぶのある者</strong>、<strong>目が弱く欠陥のある者</strong>、<strong>できもの</strong>や<strong>疥癬のある者</strong>、<strong>睾丸のつぶれた者</strong>など、祭司アロンの子孫のうちで、<strong>以上の障害のある者はだれでも</strong>、主に燃やしてささげる献げ物の務めをしてはならない。彼には障害があるから、<strong>神に食物をささげる務めをしてはならない</strong>」（<a href="https://bibleox.com/ja/jp-ni/lev/21/#L17-21">レビ. 21:17-21</a>）</p></blockquote><h3>義務</h3><p>髪とひげを伸ばさなければなりません：</p><blockquote><p>「主はモーセに言われた。<strong>アロンの子である祭司たちに告げて</strong>こう言いなさい。&lt;…&gt; また、<strong>頭髪の一部をそり上げたり、ひげの両端をそり落としたり</strong>、身を傷つけたり<strong>してはならない</strong>」（<a href="https://bibleox.com/ja/jp-ni/lev/21/#L1,5">レビ. 21:1,5</a>）</p></blockquote><p>離縁された女を妻にしてはなりません：</p><blockquote><p>「<strong>遊女となって身を汚した女、あるいは離縁された女をめとってはならない</strong>。祭司は神に属する聖なる者だからである」（<a href="https://bibleox.com/ja/jp-ni/lev/21/#L7">レビ. 21:7</a>）</p></blockquote><p>死者に触れてはなりませんが、亡くなった近親に触れることは許されています：</p><blockquote><p>「主はモーセに言われた。アロンの子である祭司たちに告げてこう言いなさい。<strong>親族の遺体に触れて身を汚してはならない</strong>。<strong>ただし、近親</strong>、すなわち、父母、息子、娘、兄弟、および同居している未婚の姉妹の<strong>場合は許される</strong>。<strong>間違っても、親族の遺体に触れて、身を汚すことがあってはならない</strong>」（<a href="https://bibleox.com/ja/jp-ni/lev/21/#L1-4">レビ. 21:1-4</a>）<em>（1節と4節は、ヘブライ語原文では「民の中の死者のために身を汚してはならない」「民の長である者として身を汚し、汚れた者となってはならない」です。）</em></p></blockquote><h3>大祭司の義務</h3><p>大祭司は、亡くなった近親にさえ触れてはなりません：</p><blockquote><p>「<strong>同僚の祭司たちの上位に立ち</strong>、聖別の油を頭に注がれ、祭司の職に任ぜられ、そのための祭服を着る身となった者は、髪をほどいたり、衣服を裂いたりしてはならない。<strong>自分の父母の遺体であっても、近づいて身を汚してはならない</strong>」（<a href="https://bibleox.com/ja/jp-ni/lev/21/#L10-11">レビ. 21:10-11</a>）</p></blockquote><p>その妻は、結婚したことのない処女でなければなりません：</p><blockquote><p>「<strong>祭司は処女をめとらねばならない。やもめ、離縁された女、遊女となって身を汚した女などをめとってはならない。一族から処女をめとらねばならない</strong>」（<a href="https://bibleox.com/ja/jp-ni/lev/21/#L13-14">レビ. 21:13-14</a>）</p></blockquote><p>頭を覆っていなければなりません：</p><blockquote><p>「同僚の祭司たちの上位に立ち、聖別の油を頭に注がれ、祭司の職に任ぜられ、そのための祭服を着る身となった者は、<strong>髪をほどいたり</strong>、衣服を裂いたりしてはならない」（<a href="https://bibleox.com/ja/jp-ni/lev/21/#L10">レビ. 21:10</a>）<em>（「髪をほどく」は、ヘブライ語原文では אֶת־רֹאשׁוֹ לֹא יִפְרָע —「頭をあらわにしてはならない」とも訳されます。）</em></p></blockquote>
