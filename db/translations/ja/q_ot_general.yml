    menu: { parent: "旧約", title: "律法の中で最も重要なこと", priority: 2 }
    body: |-
      <h2>最も重要なこと</h2><ul><li><p>正義</p></li></ul><ul><li><p>慈悲</p></li></ul><ul><li><p>信仰</p></li></ul><h2>主であり神であるイエス・キリストの教え</h2><blockquote><p>「律法学者たちとファリサイ派の人々、あなたたち偽善者は不幸だ。薄荷、いのんど、茴香の十分の一は献げるが、<strong>律法の中で最も重要な正義、慈悲、誠実</strong>はないがしろにしているからだ。これこそ行うべきことである。もとより、十分の一の献げ物もないがしろにしてはならないが」（<a href="https://bibleox.com/ja/jp-ni/mf/23/#L23">マタ. 23:23</a>）<em>（「誠実」は、ギリシア語原文では πίστιν —「信仰、誠実」です。）</em></p></blockquote><blockquote><p>「『先生、<strong>律法の中で、どの掟が最も重要でしょうか</strong>。』イエスは言われた。『「心を尽くし、精神を尽くし、思いを尽くして、<strong>あなたの神である主を愛しなさい</strong>。」<strong>これが最も重要な第一の掟である</strong>。第二も、これと同じように重要である。「<strong>隣人を自分のように愛しなさい</strong>。」<strong>律法全体と預言者は、この二つの掟に基づいている</strong>』」（<a href="https://bibleox.com/ja/jp-ni/mf/22/#L36-40">マタ. 22:36-40</a>）</p></blockquote><h2>使徒たちにおいて</h2><blockquote><p>「<strong>律法全体は、『隣人を自分のように愛しなさい』という一句によって全うされるからです</strong>」（<a href="https://bibleox.com/ja/jp-ni/gal/5/#L14">ガラ. 5:14</a>）</p></blockquote><h2>預言者たちにおいて</h2><blockquote><p>「人よ、何が善であり主が何をお前に求めておられるかはお前に告げられている。<strong>正義を行い</strong>、<strong>慈しみを愛し</strong><strong>へりくだって神と共に歩むこと</strong>、これである」（<a href="https://bibleox.com/ja/jp-ni/mih/6/#L8">ミカ. 6:8</a>）</p></blockquote><blockquote><p>「神のもとに立ち帰れ。<strong>愛と正義</strong>を保ち<strong>常にあなたの神を待ち望め</strong>」（<a href="https://bibleox.com/ja/jp-ni/os/12/#L7">ホセ. 12:7</a>）</p></blockquote><blockquote><p>「主の言葉を聞け、イスラエルの人々よ。主はこの国の住民を告発される。この国には、<strong>誠実さも慈しみも神を知ることもない</strong>からだ」（<a href="https://bibleox.com/ja/jp-ni/os/4/#L1">ホセ. 4:1</a>）</p></blockquote><blockquote><p>「<strong>わたしが喜ぶのは愛であって</strong>いけにえではなく<strong>神を知ることであって</strong>焼き尽くす献げ物ではない」（<a href="https://bibleox.com/ja/jp-ni/os/6/#L6">ホセ. 6:6</a>）</p></blockquote><blockquote><p>「万軍の主はこう言われる。<strong>正義と真理に基づいて裁き</strong>互いにいたわり合い、<strong>憐れみ深くあり</strong>」（<a href="https://bibleox.com/ja/jp-ni/zah/7/#L9">ゼカ. 7:9</a>）</p></blockquote><blockquote><p>「<strong>主は正義を愛される</strong>。主の慈しみに生きる人を見捨てることなくとこしえに見守り主に逆らう者の子孫を断たれる」（<a href="https://bibleox.com/ja/jp-ni/ps/37/#L28">詩. 37:28</a>）</p></blockquote><blockquote><p>「<strong>主は恵みの業と裁きを愛し</strong>地は主の慈しみに満ちている」（<a href="https://bibleox.com/ja/jp-ni/ps/33/#L5">詩. 33:5</a>）</p><p>七十人訳（<a href="https://bibleox.com/ja/gr-lxx-byz/ps/32/#L5">詩. 32:5、七十人訳</a>）では ἀγαπᾷ ἐλεημοσύνην καὶ κρίσιν —「<strong>憐れみ</strong>（施し）と裁きを愛される」です。</p></blockquote><h2>その他</h2><blockquote><p>「ただ、<strong>器の中にある物を人に施せ</strong>。<strong>そうすれば、あなたたちにはすべてのものが清くなる</strong>」（<a href="https://bibleox.com/ja/jp-ni/lk/11/#L41">ルカ. 11:41</a>）</p></blockquote><blockquote><p>「水が燃え盛る火を消すように、<strong>施しの業は、罪を償う</strong>」（<a href="https://bibleox.com/ja/jp-ni/prsir/3/#L30">シラ. 3:30</a>）</p></blockquote>

  - src: 10-заповедей
    path: Tc4m_十戒
    title: 十戒
    title_sub: 神が預言者モーセに与えられた十の戒めについての聖書の引用
    meta_desc: 神が預言者モーセに与えられた十の戒めについての聖書の引用
    menu: { parent: "旧約", title: "十戒", priority: 4 }
    body: |-
      <h2>神が石の板に記して預言者モーセに与えられた十の戒め</h2><p>神の命令はこれらの戒めに限られていたのではありませんが、石の板に記されて与えられたのは、まさにこれらの命令でした。</p><h3>1</h3><blockquote><p>「<strong>わたしは主、あなたの神</strong>、あなたをエジプトの国、奴隷の家から導き出した神である。<strong>あなたには、わたしをおいてほかに神があってはならない</strong>」（<a href="https://bibleox.com/ja/jp-ni/ish/20/#L2-3">出. 20:2-3</a>; <a href="https://bibleox.com/ja/jp-ni/vtor/5/#L6-7">申. 5:6-7</a>; <a href="https://bibleox.com/ja/jp-ni/lev/19/#L2">レビ. 19:2</a>）</p></blockquote><h3>2</h3><blockquote><p>「<strong>あなたはいかなる像も造ってはならない</strong>。上は天にあり、下は地にあり、また地の下の水の中にある、いかなるものの形も造ってはならない。あなたはそれらに向かってひれ伏したり、それらに仕えたりしてはならない」（<a href="https://bibleox.com/ja/jp-ni/ish/20/#L4-5">出. 20:4-5</a>; <a href="https://bibleox.com/ja/jp-ni/vtor/5/#L8-9">申. 5:8-9</a>; <a href="https://bibleox.com/ja/jp-ni/lev/19/#L4">レビ. 19:4</a>）<em>（「像」は、ヘブライ語原文では פֶסֶל —「刻んだ偶像」です。）</em></p></blockquote><h3>3</h3><blockquote><p>「<strong>あなたの神、主の名をみだりに唱えてはならない</strong>。みだりにその名を唱える者を主は罰せずにはおかれない」（<a href="https://bibleox.com/ja/jp-ni/ish/20/#L7">出. 20:7</a>; <a href="https://bibleox.com/ja/jp-ni/vtor/5/#L11">申. 5:11</a>; <a href="https://bibleox.com/ja/jp-ni/lev/19/#L12">レビ. 19:12</a>）</p></blockquote><h3>4</h3><blockquote><p>「<strong>安息日を心に留め、これを聖別せよ</strong>。六日の間働いて、何であれあなたの仕事をし、七日目は、あなたの神、主の安息日であるから、いかなる仕事もしてはならない。あなたも、息子も、娘も、男女の奴隷も、家畜も、あなたの町の門の中に寄留する人々も同様である」（<a href="https://bibleox.com/ja/jp-ni/ish/20/#L8-10">出. 20:8-10</a>; <a href="https://bibleox.com/ja/jp-ni/vtor/5/#L12-15">申. 5:12-15</a>; <a href="https://bibleox.com/ja/jp-ni/lev/19/#L3">レビ. 19:3</a>; <a href="https://bibleox.com/ja/jp-ni/lev/19/#L30">レビ. 19:30</a>; <a href="https://bibleox.com/ja/jp-ni/ier/17/#L21">エレ. 17:21</a>; <a href="https://bibleox.com/ja/jp-ni/neem/13/#L15-18">ネヘ. 13:15-18</a>）</p></blockquote><h3>5</h3><blockquote><p>「<strong>あなたの父母を敬え</strong>。そうすればあなたは、あなたの神、主が与えられる土地に長く生きることができる」（<a href="https://bibleox.com/ja/jp-ni/ish/20/#L12">出. 20:12</a>; <a href="https://bibleox.com/ja/jp-ni/vtor/5/#L16">申. 5:16</a>; <a href="https://bibleox.com/ja/jp-ni/lev/19/#L3">レビ. 19:3</a>）</p></blockquote><h3>6</h3><blockquote><p>「<strong>殺してはならない</strong>」（<a href="https://bibleox.com/ja/jp-ni/ish/20/#L13">出. 20:13</a>; <a href="https://bibleox.com/ja/jp-ni/vtor/5/#L17">申. 5:17</a>; <a href="https://bibleox.com/ja/jp-ni/lev/19/#L17-18">レビ. 19:17-18</a>）</p></blockquote><h3>7</h3><blockquote><p>「<strong>姦淫してはならない</strong>」（<a href="https://bibleox.com/ja/jp-ni/ish/20/#L14">出. 20:14</a>; <a href="https://bibleox.com/ja/jp-ni/vtor/5/#L18">申. 5:18</a>; <a href="https://bibleox.com/ja/jp-ni/lev/19/#L20">レビ. 19:20</a>）</p></blockquote><h3>8</h3><blockquote><p>「<strong>盗んではならない</strong>」（<a href="https://bibleox.com/ja/jp-ni/ish/20/#L15">出. 20:15</a>; <a href="https://bibleox.com/ja/jp-ni/vtor/5/#L19">申. 5:19</a>; <a href="https://bibleox.com/ja/jp-ni/lev/19/#L11">レビ. 19:11</a>; <a href="https://bibleox.com/ja/jp-ni/lev/19/#L13">レビ. 19:13</a>）</p></blockquote><h3>9</h3><blockquote><p>「<strong>隣人に関して偽証してはならない</strong>」（<a href="https://bibleox.com/ja/jp-ni/ish/20/#L16">出. 20:16</a>; <a href="https://bibleox.com/ja/jp-ni/vtor/5/#L20">申. 5:20</a>; <a href="https://bibleox.com/ja/jp-ni/lev/19/#L11">レビ. 19:11</a>）</p></blockquote><h3>10</h3><blockquote><p>「<strong>隣人の家を欲してはならない</strong>。隣人の妻、男女の奴隷、牛、ろばなど隣人のものを一切欲してはならない」（<a href="https://bibleox.com/ja/jp-ni/ish/20/#L17">出. 20:17</a>; <a href="https://bibleox.com/ja/jp-ni/vtor/5/#L21">申. 5:21</a>; <a href="https://bibleox.com/ja/jp-ni/lev/19/#L17">レビ. 19:17</a>）</p></blockquote><h2>解説</h2><p><a href="https://bibleox.com/ru/ru/w/Z1BU_%D0%98%D0%B7%D1%8A%D1%8F%D1%81%D0%BD%D0%B5%D0%BD%D0%B8%D0%B5_%D0%B4%D0%B5%D1%81%D1%8F%D1%82%D0%B8_%D0%B7%D0%B0%D0%BF%D0%BE%D0%B2%D0%B5%D0%B4%D0%B5%D0%B9/">十戒の解説（ロシア語）</a></p>

  - src: женщина-ветхий-завет
    path: Wm7l_モーセの律法における女性
    title: モーセの律法における女性
    meta_desc: 旧約における女性についての聖書の引用
    menu: { parent: "旧約", title: "モーセの律法における女性", priority: 7 }
    body: |-
      <p>律法はおおむね、女性に特有の生活状況や、男女の関係におけるさまざまな状況を描いています。その中で、次の領域を挙げることができます：</p><ul><li><p>出産（<a href="https://bibleox.com/ja/jp-ni/lev/12/">レビ. 12</a>）</p></li></ul><ul><li><p>出血（<a href="https://bibleox.com/ja/jp-ni/lev/15/#L19-30">レビ. 15:19-30</a>、<a href="https://bibleox.com/ja/jp-ni/lev/18/#L19">レビ. 18:19</a>、<a href="https://bibleox.com/ja/jp-ni/lev/20/#L18">レビ. 20:18</a>）</p></li></ul><ul><li><p>裸（<a href="https://bibleox.com/ja/jp-ni/lev/18/">レビ. 18</a>）</p></li></ul><ul><li><p>男性との関係、夫の選択（<a href="https://bibleox.com/ja/jp-ni/lev/19/#L20">レビ. 19:20</a>、<a href="https://bibleox.com/ja/jp-ni/lev/21/#L7-14">レビ. 21:7-14</a>、<a href="https://bibleox.com/ja/jp-ni/chis/5/#L12-31">民. 5:12-31</a>、<a href="https://bibleox.com/ja/jp-ni/chis/36/">民. 36</a>）</p></li></ul><ul><li><p>誓願（<a href="https://bibleox.com/ja/jp-ni/lev/27/#L3-8">レビ. 27:3-8</a>、<a href="https://bibleox.com/ja/jp-ni/chis/6/">民. 6</a>、<a href="https://bibleox.com/ja/jp-ni/chis/30/#L4-17">民. 30:4-17</a>）</p></li></ul><ul><li><p>罪に陥ること（<a href="https://bibleox.com/ja/jp-ni/lev/19/#L20">レビ. 19:20</a>、<a href="https://bibleox.com/ja/jp-ni/lev/20/#L10-21">レビ. 20:10-21</a>）</p></li></ul><p>これらの領域を、挙げた順に一つずつ見ていきましょう。</p><h2>出産</h2><p>子供が生まれた後、律法は女性に一定の日数の清めを定めており、それは生まれた子供の性別によって異なります。男の子が生まれた後、女性は7日間汚れていると見なされ、33日間の清めが課されます。その間、聖なる物に触れたり、聖所に来たりしてはなりません（<a href="https://bibleox.com/ja/jp-ni/lev/12/#L2-4">レビ. 12:2-4</a>）。女の子の場合、これらの日数はそれに応じて倍になります（<a href="https://bibleox.com/ja/jp-ni/lev/12/#L5">レビ. 12:5</a>）。</p><h2>出血</h2><p>まず、律法は人の体からのどんな漏出もその人を汚れたものにすると言っていることに触れておく価値があります：</p><blockquote><p>「イスラエルの人々に告げてこう言いなさい。もし、尿道の炎症による漏出があるならば、その人は汚れている」（<a href="https://bibleox.com/ja/jp-ni/lev/15/#L2">レビ. 15:2</a>）<em>（ヘブライ語原文では אִישׁ אִישׁ כִּי יִהְיֶה זָב מִבְּשָׂרוֹ —「だれでも体（肉）から漏出がある人は」です。）</em></p></blockquote><p>それでも、明らかな理由から、女性については別に、かなり詳しく述べられています。</p><p>全体として、出血がある間、女性は汚れており、その後7日間の清めが課されます。いつも出血があるなら、いつも汚れています。汚れている女性は夫と交わってはならず、もしそうなれば、夫も妻とまったく同じように汚れ、夫にも妻と同じ規定が適用されます。出血のある女性が寝たり座ったりした物はすべて汚れ、それに触れた者は夕方まで汚れます。清めの日々の後、二羽の山鳩か家鳩の献げ物をささげなければならず（<a href="https://bibleox.com/ja/jp-ni/lev/15/#L29-30">レビ. 15:29-30</a>）、その後、女性は清いと見なされます。</p><p>女性と出血に関するほかの規定もありますが、それらは以下の節で取り上げます。</p><h2>裸</h2><blockquote><p>「肉親の女性に近づいてこれを犯してはならない。わたしは主である」（<a href="https://bibleox.com/ja/jp-ni/lev/18/#L6">レビ. 18:6</a>）<em>（ヘブライ語原文では לְגַלּוֹת עֶרְוָה —「裸をあらわにする」です。）</em></p></blockquote><p>この章では男性（父）の裸にも触れられていますが、論理的には、主として、血縁だけではないさまざまな親族関係にある女性の裸をあらわにすることの禁止が挙げられています：</p><blockquote><p>「嫁を犯してはならない。彼女は息子の妻である。彼女を犯してはならない」（<a href="https://bibleox.com/ja/jp-ni/lev/18/#L15">レビ. 18:15</a>）</p></blockquote><p>すでに述べた出血についての律法の規定に戻って、夫に対するこの禁止にも触れておきましょう：</p><blockquote><p>「月経の汚れを持つ女性に近づいて、これを犯してはならない」（<a href="https://bibleox.com/ja/jp-ni/lev/18/#L19">レビ. 18:19</a>）</p></blockquote><h2>男性との関係、夫の選択</h2><p>男が別の男と婚約している女奴隷を誘惑した場合、自由な女性（つまり奴隷でない女性）を誘惑した場合（<a href="https://bibleox.com/ja/jp-ni/vtor/22/#L25">申. 22:25</a>）とは違って、死刑には処せられず、ただ賠償の献げ物、すなわち雄羊を携えて行かなければなりません（<a href="https://bibleox.com/ja/jp-ni/lev/19/#L20-21">レビ. 19:20-21</a>）。</p><p>夫婦は、夫婦の交わりの後、夕方まで汚れていると見なされます（<a href="https://bibleox.com/ja/jp-ni/lev/15/#L18">レビ. 15:18</a>）。</p><p>祭司の妻になれたのは処女だけで（<a href="https://bibleox.com/ja/jp-ni/lev/21/#L13">レビ. 21:13</a>）、やもめ、離縁された女、身を汚した女、遊女はなれませんでした。</p><p>男の相続人がいないために女性が土地を相続する場合、その女性は父の部族の者とだけ結婚することができました（<a href="https://bibleox.com/ja/jp-ni/chis/36/#L8">民. 36:8</a>）。相続地がほかの部族に移らないためです。</p><p>夫が妻の姦淫を疑った場合にどうすべきかを述べた規定さえあります（<a href="https://bibleox.com/ja/jp-ni/chis/5/#L12-31">民. 5:12-31</a>）。</p><h2>誓願（神への約束）</h2><p>神に何らかの誓願を立てる人々がおり、そのうちのある人々はナジル人と呼ばれました（混同しないように。イエス・キリストがナザレ人と呼ばれたのは、ナザレの出身だったからです）。彼らは、ぶどうから作られたものを飲んだり食べたりしないこと、髪を切らないこと、死体に近づかないことを約束しました。このような誓願は、一定期間のためにも、生涯のためにも立てることができました。ここでこれに触れるのは、男性も女性もナジル人であったという事実を強調するためにすぎません。</p><p>律法は売ったものを買い戻すことを許しており（<a href="https://bibleox.com/ja/jp-ni/lev/25/#L25">レビ. 25:25</a>）、それと類比的に、聖所での奉仕によって自分の生涯を神にささげた者にも値が定められています。ここで、男性と女性の生涯が異なって評価されていることに気づくことができます。たとえば、20歳から60歳までの男性は聖所のシェケルで銀50シェケル、女性は30シェケルと評価されます（<a href="https://bibleox.com/ja/jp-ni/lev/27/#L3-4">レビ. 27:3-4</a>）。A. P. ロプーヒンは、この違いを、それぞれの場合に聖所にささげられた人の労働能力が等しくないことによって説明しています。その人には聖所のための肉体労働、すなわち薪を割ったり、水を運んだりすることが求められたからです。</p><blockquote><p>「人が主に誓願を立てるか、物断ちの誓いをするならば、その言葉を破ってはならない。すべて、口にしたとおり、実行しなければならない」（<a href="https://bibleox.com/ja/jp-ni/chis/30/#L3">民. 30:3</a>）<em>（ほかの翻訳では30:2。）</em></p></blockquote><p>このように、誓った者は自分の誓いを果たさなければなりませんが、女性については留保があります。妻が誓いや誓願を立てた場合、それを聞いた夫はこの誓いを無効にすることができ、それは立てられなかったものと見なされます。同じように、父も、若い娘の誓いを聞いたなら、それを無効にすることができます。</p><h2>罪に陥ること</h2><p>罪に陥ることに重い罰を課す多くの律法が述べられています。たとえば：</p><ul><li><p>姦淫（<a href="https://bibleox.com/ja/jp-ni/lev/20/#L10-12">レビ. 20:10-12</a>）、</p></li><li><p>獣姦（特に女性について述べられています：<a href="https://bibleox.com/ja/jp-ni/lev/20/#L16">レビ. 20:16</a>、<a href="https://bibleox.com/ja/jp-ni/lev/18/#L23">レビ. 18:23</a>）、</p></li><li><p>男色（<a href="https://bibleox.com/ja/jp-ni/lev/20/#L13">レビ. 20:13</a>）など。</p></li></ul><p>律法に対するこのような罪は死刑によって罰せられました。</p>

  - src: Ветхий-Завет-конец
    path: Oe9d_旧約の終わり
    title: 旧約 — その終わり
    meta_desc: 旧い契約が終わり、ユダヤ教の規定が廃止されたことを示す聖書の引用
    menu: { parent: "旧約", title: "旧約 — その終わり", priority: 9 }
    body: |-
      <h2>新しい契約があるということ</h2><p>ユダヤ人の民が破った彼らとの契約の代わりに、新しい民と新しい契約が結ばれるという旧約の預言：</p><blockquote><p>「<strong>エシュルンはしかし、肥えると足でけった</strong>。お前は肥え太ると、かたくなになり<strong>造り主なる神を捨て</strong>、救いの岩を侮った。<strong>彼らは他の神々に心を寄せ主にねたみを起こさせ</strong>いとうべきことを行って、主を怒らせた。<strong>彼らは神ならぬ悪霊に犠牲をささげ新しく現れ、先祖も知らなかった無縁の神々に犠牲をささげた</strong>。お前は自分を産み出した岩を思わず産みの苦しみをされた神を忘れた。主はこれを見て御自分の息子、娘への憤りのゆえに彼らを退けて、言われた。<strong>わたしは、わたしの顔を隠して彼らの行く末を見届けよう</strong>。彼らは逆らう世代真実のない子らだ。彼らは<strong>神ならぬものをもってわたしのねたみを引き起こし</strong>むなしいものをもってわたしの怒りを燃えたたせた。それゆえ、<strong>わたしは民ならぬ者をもって彼らのねたみを引き起こし</strong>愚かな国をもって彼らの怒りを燃えたたせる」（<a href="https://bibleox.com/ja/jp-ni/vtor/32/#L15-21">申. 32:15-21</a>）</p></blockquote><blockquote><p>「見よ、<strong>わたしがイスラエルの家、ユダの家と新しい契約を結ぶ日が来る</strong>、と主は言われる。この契約は、かつてわたしが彼らの先祖の手を取ってエジプトの地から導き出したときに結んだものではない。<strong>わたしが彼らの主人であったにもかかわらず、彼らはこの契約を破った</strong>、と主は言われる。<strong>しかし、来るべき日に、わたしがイスラエルの家と結ぶ契約はこれである</strong>、と主は言われる。すなわち、わたしの律法を彼らの胸の中に授け、彼らの心にそれを記す。<strong>わたしは彼らの神となり、彼らはわたしの民となる</strong>。&lt;…&gt; これらの定めがわたしの前から退くことがあろうとも、と主は言われる。<strong>イスラエルの子孫は永遠に絶えることなく、わたしの民である</strong>。主はこう言われる。もし、上においては、天が測られ下においては、地の基が究められるなら<strong>わたしがイスラエルのすべての子孫を</strong>彼らのあらゆる行いのゆえに<strong>拒むこともありえよう</strong>と主は言われる」（<a href="https://bibleox.com/ja/jp-ni/ier/31/#L31-33,36-37">エレ. 31:31-33,36-37</a>）<em>（36節は、ヘブライ語原文では「もしこれらの定めがわたしの前から退くなら、イスラエルの子孫もわたしの前で永遠に民であることをやめる」です。）</em></p></blockquote><blockquote><p>「<strong>わたしに尋ねようとしない者にもわたしは、尋ね出される者となり</strong><strong>わたしを求めようとしない者にも見いだされる者となった</strong>。<strong>わたしの名を呼ばない民にも</strong>わたしはここにいる、ここにいると言った」（<a href="https://bibleox.com/ja/jp-ni/is/65/#L1">イザ. 65:1</a>）</p></blockquote><blockquote><p>「わたしは彼女を地に蒔きロ・ルハマ（憐れまれぬ者）を憐れみ<strong>ロ・アンミ（わが民でない者）に向かって『あなたはアンミ（わが民）』と言う。彼は、『わが神よ』とこたえる</strong>」（<a href="https://bibleox.com/ja/jp-ni/os/2/#L25">ホセ. 2:25</a>）<em>（ほかの翻訳では2:23。）</em></p></blockquote><h2>旧い契約の終わりについて</h2><blockquote><p>「事実、神はイスラエルの人々を非難して次のように言われています。『「見よ、わたしがイスラエルの家、またユダの家と、<strong><mark>新しい</mark></strong>契約を結ぶ時が来る」と、主は言われる。』&lt;…&gt; 神は『新しいもの』と言われることによって、<strong><mark>最初の契約は古びてしまったと宣言されたのです</mark></strong>。<strong>年を経て古びたものは、間もなく消えうせます</strong>」（<a href="https://bibleox.com/ja/jp-ni/evr/8/#L8,13">ヘブ. 8:8,13</a>）</p></blockquote><blockquote><p>「しかし、彼ら［ユダヤ人］の考えは鈍くなってしまいました。今日に至るまで、<strong><mark>古い</mark>契約が読まれる際に、この覆いは除かれずに掛かったまま</strong>なのです。それは<strong>キリストにおいて取り除かれる</strong>ものだからです。このため、今日に至るまでモーセの書が読まれるときは、いつでも彼らの心には覆いが掛かっています。しかし、主の方に向き直れば、覆いは取り去られます」（<a href="https://bibleox.com/ja/jp-ni/2kor/3/#L14-16">２コリ. 3:14-16</a>）</p></blockquote><blockquote><p>「神はわたしたちに、<strong><mark>新しい</mark>契約に仕える資格、文字ではなく霊に仕える資格を与えてくださいました</strong>。文字は殺しますが、霊は生かします」（<a href="https://bibleox.com/ja/jp-ni/2kor/3/#L6">２コリ. 3:6</a>）</p></blockquote><blockquote><p>「しかし今は、わたしたちは、自分を縛っていた律法に対して死んだ者となり、<strong>律法から解放されています</strong>。その結果、<strong>文字に従う<mark>古い</mark>生き方ではなく</strong>、“霊”に従う新しい生き方で仕えるようになっているのです」（<a href="https://bibleox.com/ja/jp-ni/rim/7/#L6">ロマ. 7:6</a>）</p></blockquote><blockquote><p>「信仰が現れる前には、<strong>わたしたちは律法の下で監視され</strong>、この信仰が啓示されるようになるまで閉じ込められていました。こうして<strong>律法は、わたしたちをキリストのもとへ導く養育係となったのです</strong>。わたしたちが信仰によって義とされるためです。しかし、信仰が現れたので、<strong><mark>もはや、わたしたちはこのような養育係の下にはいません</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/gal/3/#L23-25">ガラ. 3:23-25</a>）</p></blockquote><h3>キリスト教の自由を悪に用いないようにとの警告：</h3><blockquote><p>「<strong>兄弟たち、あなたがたは、自由を得るために召し出されたのです。ただ、この自由を、肉に罪を犯させる機会とせずに</strong>、愛によって互いに仕えなさい」（<a href="https://bibleox.com/ja/jp-ni/gal/5/#L13">ガラ. 5:13</a>）</p></blockquote>

  - src: языческая-вера-в-идола
    path: Pi50d_偶像への異教の信仰
    title: 偶像への異教の信仰
    title_sub: 偶像への異教の信仰についての聖書の引用
    meta_desc: 偶像への異教の信仰についての聖書の引用
    menu: { parent: "旧約", title: "偶像への異教の信仰", priority: 50 }
    body: |-
      <h2>偶像への異教の信仰の種類</h2><p>偶像への異教の信仰には三つの種類があります。古代に最も広まっていたものから順に挙げます：</p><ol><li><p><strong>偶像が神そのものである</strong>。異教徒自身が作った物が神である。</p></li><li><p><strong>偶像は</strong>、そのような姿をしているはずの、遠くにいる神の<strong>像である</strong>。</p></li><li><p><strong>偶像は</strong>、神格化された自然の要素（海、風、雨、火、大地）の<strong>考え出された像である</strong>。</p></li></ol><p>三つの場合すべてにおいて、<u>存在しない</u><u>偽りの神</u>が拝まれています。これは偽りへの信仰です。</p><p>聖書に見られるのはまさに第一の種類、すなわち最も広まっていた異教の信仰、<u>物そのもの（物質）の神格化</u>です。</p><h2>異教徒は作られた物そのものを神と考える</h2><blockquote><p>「わたしはお前に昔から知らせ事が起こる前に告げておいた。<strong>これらのことを起こしたのは、わたしの偶像だこれを命じたのは、わたしの木像と鋳像だ</strong>とお前に言わせないためだ」（<a href="https://bibleox.com/ja/jp-ni/is/48/#L5">イザ. 48:5</a>）</p></blockquote><blockquote><p>「神々の像は金や銀で覆われ、その舌は職人が磨き上げたものであり、<strong>まやかしにすぎず、口を利くこともできません</strong>。おしゃれな娘にでもしてやるように、人々は金で冠を作り、神々の像の頭に載せています。ときには<strong>祭司たちが、神々の像から金や銀をくすねて自分のものとし</strong>、その一部を神殿娼婦に与えることもあります。<strong>神々の像は、人間にするように、衣で飾られますが</strong>、もともと銀や金や木でできていて、<strong>さびと虫食いから身を守れないのです</strong>。紫の衣をまとってはいますが、自分の上に神殿の埃が積もるために、<strong>顔をふいてもらう有様です</strong>。また、地方総督のように笏を持ってはいますが、<strong>自分に対して罪を犯す者を殺すことができません</strong>。右手に短剣や斧を持ってはいますが、<strong>戦争や盗賊から身を守ることもできません</strong>。このように、<strong>それらの像が神でないことははっきりしているのですから(!)</strong>、恐れてはなりません。&lt;…&gt; また、王に危害を加えた者を死刑にするとき城門を閉ざすように、<strong>祭司たちは神殿を扉と鍵とかんぬきで固めて、盗賊に略奪されないようにします</strong>。&lt;…&gt; 神々の像は、あたかも神殿の梁のようなもので、<strong>よく言われるように、その内部は虫に食われています。地からわいた虫が体や衣をかじっても、何も感じません</strong>。その顔は神殿に漂う煙で黒ずんでいます。<strong>その体や頭の上を、こうもりやつばめ、小鳥が飛び交い、猫までやって来ます。このようなことで、それらの像が神でないことは分かるはずですから</strong>、恐れてはなりません。&lt;…&gt; <strong>鋳型に流し込まれたときも、何も感じていませんでした</strong>。莫大な値段で買い求められますが、それらは息をしていません。歩けないので<strong>人間の肩に担がれ</strong>、自分の不名誉をさらけ出し、それに仕える者でさえ恥ずかしい思いをしています。というのは、<strong>神々の像は地面に倒されると、もう自分では立ち上がれず、まっすぐに立たされても自分では動けず、傾けられても身を起こせないからです</strong>。&lt;…&gt; 金銀で覆った木彫りの像は、山から切り出された石と同じであり、それに仕える者は恥をかくことになるでしょう。それなのに、いったいどうして、それらの像を神であると考えたり、宣言したりすることができるのでしょうか。&lt;…&gt; <strong>神々の像は彫り物師や飾り職によって造られたもので、職人が造ろうと思う以外のものにはなりません</strong>。神々の像を造る者でさえ、人より長生きするわけではありません。だから、どうして彼らの手になった物が神になれるでしょうか。&lt;…&gt; 戦争や災難から<strong>自分を救えない</strong>像など神ではないと、どうして悟らないのでしょうか。それらは、金銀で覆った木彫にすぎないから、まやかしだということが、やがて分かるでしょう。<strong>それらの像は神ではなく、人間の手で造られた物であり、それらに神の働きをする力は少しもない</strong>ことが、あらゆる民族や王たちに明らかになるでしょう。&lt;…&gt; 金銀で覆った木彫りの神々の像の置かれた<strong>神殿が火事になると</strong>、祭司たちは逃げて生き延びますが、中の梁と一緒に<strong>神々の像は燃え尽きてしまいます</strong>。&lt;…&gt; <strong>金銀で覆った木彫りの神々の像は、盗賊や略奪者から身を守ることは決してできません</strong>。&lt;…&gt; 結局、<strong>それらの像が神であることを示す証拠は何一つないのですから</strong>、恐れてはなりません。金銀で覆った木彫りの神々の像は、<strong>きゅうり畑のかかしと同じで</strong>、何も守ることができません。&lt;…&gt; ですから、偶像を持たない正しい人の方がまさっています。辱めを受けることがないからです」（<a href="https://bibleox.com/ja/jp-ni/pos/1/#L7-72">エレ手紙. 1:7-72</a>）</p></blockquote><h2>異教化したイスラエル人は、作られた物そのもの、また自然の要素を神と考えた</h2><blockquote><p>「偶像を形づくる者は皆、無力で彼らが慕うものも役に立たない。彼ら自身が証人だ。<strong>見ることも、知ることもなく</strong>、恥を受ける。無力な神を造り役に立たない偶像を鋳る者はすべてその仲間と共に恥を受ける。職人も皆、人間にすぎず皆集まって立ち、恐れ、恥を受ける。鉄工は金槌と炭火を使って仕事をする。槌でたたいて形を造り、強い腕を振るって働くが飢えれば力も減り、水を飲まなければ疲れる。木工は寸法を計り、石筆で図を描きのみで削り、コンパスで図を描き人の形に似せ、人間の美しさに似せて作り神殿に置く。彼は林の中で力を尽くし<strong>樅を切り</strong>、柏や樫の木を選びまた、樅の木を植え、雨が育てるのを待つ。<strong>木は薪になるもの。人はその一部を取って体を温め一部を燃やしてパンを焼きその木で神を造ってそれにひれ伏し木像に仕立ててそれを拝むのか</strong>。また、木材の半分を燃やして火にし肉を食べようとしてその半分の上であぶり食べ飽きて身が温まると『ああ、温かい、炎が見える』などと言う。<strong>残りの木で神を、自分のための偶像を造りひれ伏して拝み、祈って言う。『お救いください、あなたはわたしの神』と(!)</strong>。彼らは悟ることもなく、理解することもない。目はふさがれていて見えず心もふさがれていて、目覚めることはない。反省することもなく、知識も英知もなく『<strong>わたしは半分を燃やして火にしその炭火でパンを焼き、肉をあぶって食べた</strong>。残りの木で忌むべきものを造ったり<strong>木の切れ端を拝んだりできようか</strong>』とは言わない」（<a href="https://bibleox.com/ja/jp-ni/is/44/#L9-19">イザ. 44:9-19</a>）</p></blockquote><blockquote><p>「神を知らない人々は皆、生来むなしい。彼らは目に見えるよいものを通して、存在そのものである方を知ることができず、作品を前にしても作者を知るに至らなかった。かえって<strong>火や風や素早く動く空気、星空や激しく流れる水、天において光り輝くものなどを、宇宙の支配者、神々と見なした</strong>。&lt;…&gt; <strong>命のないものに望みをかける人々は惨めだ。彼らは、人の手で造られたものを神々と呼ぶ(!)</strong>。技術の生み出した金銀の作品、<strong>動物の像</strong>、昔の人が加工した役に立たない石などを。一人のきこりが手ごろな木を切り出し、その皮をすべて念入りにはぎ、巧みに手を加えて、<strong>生活に役立つ器具を造り上げた。仕事に使った木材の余りを燃やして、食事を準備し、空腹を満たそうとした。そのまた残りの、何の役にも立たないねじ曲がった、節目だらけの木片を、仕事の合間に取り上げて注意深く彫った。暇つぶしとして巧みに形を整え</strong>、<strong>それを人の姿に造り上げた(!)</strong>［神の姿にではなく］。<strong>取るに足りない何かの動物に似せ</strong>、朱を使って表面を赤く色づけ、汚れをすべて塗り隠した。ふさわしい住みかをしつらえ、壁の中に据え置いて、<strong>金具で固定した。こうして、木像が落ちないように工夫した</strong>。<strong>その像が自分では何もできないことを彼は知っていたからである</strong>。それは像にすぎず、人の助けを必要とする。財産、結婚、子供のことで彼はその像に祈り、魂のないものに語りかけるのを恥としない。その弱い像に健康を願い、<strong>命のないもの</strong>に命を乞い、<strong>全く経験のないもの</strong>に助けを求め、<strong>自分の足さえ使えないもの</strong>に旅の安全を祈る。商売や事業や仕事の成功のために、<strong>手を差し伸べる力もないものに彼は力を求める</strong>」（<a href="https://bibleox.com/ja/jp-ni/prs/13/#L1-19">知. 13:1-19</a>）</p></blockquote><blockquote><p>「航海に出て荒波を越え行こうとする人は、自分を運ぶ船よりももろい<strong>船首の木の像に助けを求める</strong>。&lt;…&gt; しかし<strong>人の手で造られた</strong>偶像は、その作者と共に呪われる。作者はそれを造ったからであり、<strong>偶像は朽ちるものなのに神と呼ばれたからである</strong>。&lt;…&gt; それは人間の虚栄によって世に入って来た。だから速やかに滅びるように定められている。息子の予期せぬ若死にに打ちのめされた父親が、<strong>あまりにも早く取り去られたわが子の肖像を造り、死んでしまった人間を今や神としてあがめ</strong>［像を］、家の者たちに儀式や犠牲を義務づけた。時とともに神を汚すしきたりが力を得、法として守られるようになった。こうして、<strong>刻まれた像が(!)支配者たちの命令で礼拝されるようになり</strong>、遠くに住んでいるために、直接支配者たちを見て敬うことのできない人々は、離れたところにいる彼らの姿を表すために、尊敬すべき王に生き写しの肖像を造り上げた。その場にいない者を、あたかもいるかのように熱心にへつらいあがめるためである。偶像造りの野心は、王を知らない人々をも駆り立てて、偶像崇拝を広めさせた。彼は権力者に取り入るため、<strong>腕を振るって肖像を実際よりも美しいものに造り上げた。多くの人は職人の見事なわざに引かれ、先程まで人間として敬っていた者を、今や、礼拝の対象と見なすようになった</strong>［以前は偉人の像を敬っていた］。このことは人の生涯にとって罠となった。災難や権力に支配された人々が、<strong>神聖な名を石や木に与えたから</strong>」（<a href="https://bibleox.com/ja/jp-ni/prs/14/#L1,8,14-21">知. 14:1,8,14-21</a>）</p></blockquote><p>シナイ山のふもとで、イスラエル人は文字どおり神を造ってくれと願いました：</p><blockquote><p>「モーセが山からなかなか下りて来ないのを見て、民がアロンのもとに集まって来て、『さあ、<strong>我々に先立って進む神々を造ってください</strong>。エジプトの国から我々を導き上った人、あのモーセがどうなってしまったのか分からないからです』と言うと、アロンは彼らに言った。『あなたたちの妻、息子、娘らが着けている金の耳輪をはずし、わたしのところに持って来なさい。』&lt;…&gt; 彼はそれを受け取ると、<strong>のみで型を作り、若い雄牛の鋳像を造った</strong>。すると彼らは、『イスラエルよ、<strong>これこそ</strong>あなたをエジプトの国から導き上った<strong>あなたの神々だ</strong>』と言った。&lt;…&gt; 彼らはわたしに、『<strong>我々に先立って進む神々を造ってください</strong>。我々をエジプトの国から導き上った人、あのモーセがどうなってしまったのか分からないからです』と言いましたので」（<a href="https://bibleox.com/ja/jp-ni/ish/32/#L1-2,4,23">出. 32:1-2,4,23</a>）</p></blockquote><blockquote><p>「モーセは主のもとに戻って言った。『ああ、この民は大きな罪を犯し、<strong>金の神を造りました</strong>』」（<a href="https://bibleox.com/ja/jp-ni/ish/32/#L31">出. 32:31</a>）</p></blockquote><p>彼らは神にではなく蛇に香をたき、それに名をつけました。つまり神を考え出したのです：</p><blockquote><p>「聖なる高台を取り除き、石柱を打ち壊し、アシェラ像を切り倒し、モーセの造った<strong>青銅の蛇</strong>を打ち砕いた。イスラエルの人々は、このころまで<strong>これをネフシュタンと呼んで、これに香をたいていた</strong>からである」（<a href="https://bibleox.com/ja/jp-ni/4ts/18/#L4">王下. 18:4</a>）</p></blockquote><p>彼らは神々を盗みました（盗んだのは作られた物にすぎませんが）。つまり物そのものが神々と呼ばれているのです：</p><blockquote><p>「父の家が恋しくて去るのなら、去ってもよい。しかし、<strong>なぜわたしの守り神を盗んだのか</strong>。」ヤコブはラバンに答えた。「わたしは、あなたが娘たちをわたしから奪い取るのではないかと思って恐れただけです。<strong>もし、あなたの守り神がだれかのところで見つかれば、その者を生かしてはおきません</strong>。我々一同の前で、わたしのところにあなたのものがあるかどうか調べて、取り戻してください。」ヤコブは、ラケルがそれを<strong>盗んでいた</strong>ことを知らなかったのである」（<a href="https://bibleox.com/ja/jp-ni/gen/31/#L30-32">創. 31:30-32</a>）<em>（「守り神」は、ヘブライ語原文では אֱלֹהָי —「わたしの神々」です。）</em></p></blockquote><p>手で造られ、拝まれた神々は禁じられています：</p><blockquote><p>「偶像を仰いではならない。<strong>神々の偶像を鋳造してはならない</strong>。わたしはあなたたちの神、主である」（<a href="https://bibleox.com/ja/jp-ni/lev/19/#L4">レビ. 19:4</a>）</p></blockquote><blockquote><p>「この国は偶像に満たされ<strong>手の業、指の造った物にひれ伏す</strong>」（<a href="https://bibleox.com/ja/jp-ni/is/2/#L8">イザ. 2:8</a>）</p></blockquote><h2>イスラエルで偶像が造られた理由</h2><blockquote><p>「ヤロブアムは心に思った。『<strong>今、王国は、再びダビデの家のものになりそうだ</strong>［これが偶像を造った理由である］。この民がいけにえをささげるためにエルサレムの主の神殿に上るなら、この民の心は再び彼らの主君、ユダの王レハブアムに向かい、彼らはわたしを殺して、ユダの王レハブアムのもとに帰ってしまうだろう。』彼はよく考えたうえで、<strong>金の子牛を二体造り</strong>、人々に言った。『あなたたちはもはやエルサレムに上る必要はない。<strong>見よ、イスラエルよ、これがあなたをエジプトから導き上ったあなたの神である</strong>。』彼は一体をベテルに、もう一体をダンに置いた。&lt;…&gt; ヤロブアムはユダにある祭りに倣って第八の月の十五日に祭りを執り行い、自ら祭壇に上った。ベテルでこのように行って、彼は<strong>自分の造った子牛にいけにえをささげ</strong>［いけにえは雄牛そのものにささげられた］、自分の造った聖なる高台のための祭司をベテルに立てた」（<a href="https://bibleox.com/ja/jp-ni/3ts/12/#L26-29,32">王上. 12:26-29,32</a>）<em>（28節は、ヘブライ語原文では הִנֵּה אֱלֹהֶיךָ יִשְׂרָאֵל אֲשֶׁר הֶעֱלוּךָ —「見よ、イスラエルよ、あなたを導き上った<strong>あなたの神々</strong>だ」で、動詞も複数形です。二頭の子牛は二つの神であり、一つの神の二つの像ではありません。）</em></p></blockquote><h2>バビロンでは、青銅の物そのもの、また動物を神と考えた</h2><blockquote><p>「バビロンの人々には<strong>ベルという偶像があり</strong>、毎日、上等の小麦粉十二アルタバ、羊四十匹、ぶどう酒六メトレテスがささげられていた。<strong>王はそれをあがめ、毎日拝みに行っていた</strong>が、ダニエルは自分の神を拝んでいた。王は彼に言った。『なぜ、ベルを拝まないのか。』彼は答えた。『わたしは手で造られた偶像を拝まず、天と地を造り、すべての肉なるものを支配しておられる生ける神を拝むからです。』王は言った。『<strong>ベルが生ける神だとは思わないのか。毎日どれほど食べたり飲んだりしているか、見ないのか</strong>。』ダニエルは笑って言った。『王よ、惑わされてはなりません。これは中は粘土、外は青銅で、何一つ食べたり飲んだりしたことはありません。』&lt;…&gt;［ベルの祭司たちは隠し入り口から入って供え物を食べていたが、ダニエルは床に灰をまいてその足跡を王に示した］&lt;…&gt; そこで王は彼らを殺し、ベルをダニエルに渡した。ダニエルはそれとその神殿を打ち壊した。<strong>その地にはまた大きな竜がいて、バビロンの人々はそれをあがめていた</strong>。王はダニエルに言った。『<strong>これも青銅だとは言えまい。見よ、これは生きていて、食べたり飲んだりしている。これが生ける神であることを否定できまい</strong>。だから、これを拝め。』ダニエルは言った。『わたしはわたしの神、主を拝みます。主こそ生ける神だからです。王よ、お許しください。剣も棍棒も使わずに、この竜を殺してみせましょう。』王は言った。『許す。』そこでダニエルは、ピッチと脂肪と毛を取って一緒に煮て団子を作り、<strong>竜の口に投げ込むと、竜は破裂した</strong>。ダニエルは言った。『あなたがたが拝んでいたものを見よ』」（<a href="https://bibleox.com/ja/ru/dan/14/#L3-28">ベルと竜（ダニ. 14:3-28）</a>。ロシア語の宗務院訳からの訳、要約を含む）</p></blockquote><h2>偶像は何もできず、それ自体が世話を必要とする</h2><p>偶像が何もできないことに、絶えず注意が向けられています：</p><blockquote><p>「偶像に供え物をしても無駄ではないか。<strong>食べることもかぐこともできないのだから</strong>」（<a href="https://bibleox.com/ja/jp-ni/prsir/30/#L19">シラ. 30:19</a>）</p></blockquote><blockquote><p>「これらの災いに遭っても殺されずに残った人間は、自分の手で造ったものについて悔い改めず、なおも、悪霊どもや、<strong>金、銀、銅、石、木それぞれで造った偶像を礼拝することをやめなかった。このような偶像は、見ることも、聞くことも、歩くこともできないものである</strong>」（<a href="https://bibleox.com/ja/jp-ni/otkr/9/#L20">黙. 9:20</a>）</p></blockquote><p>しかし、もし偶像が単なる像にすぎないなら、それが何もできないと言う必要はなかったでしょう。異教徒自身が笑って言ったでしょう。もちろんできない、ただの像なのだから、と。</p><h2>偶像なしには、偶像への奉仕は行われない</h2><blockquote><p>「お前たちイスラエルの家よ、主なる神はこう言われる。<strong>おのおの自分の偶像のもとに行き、それに仕えよ</strong>。その後、お前たちは必ずわたしに聞き従い、二度と偶像に贈り物をささげて、わたしの聖なる名を汚すことはなくなる」（<a href="https://bibleox.com/ja/jp-ni/iez/20/#L39">エゼ. 20:39</a>）</p></blockquote><h2>新約における偶像について</h2><p>偶像そのものが神と考えられています：</p><blockquote><p>「そのいきさつは次のとおりである。デメトリオという銀細工師が、アルテミスの神殿の模型を銀で造り、職人たちにかなり利益を得させていた。彼は、この職人たちや同じような仕事をしている者たちを集めて言った。『諸君、御承知のように、この仕事のお陰で、我々はもうけているのだが、諸君が見聞きしているとおり、あのパウロは<strong>「手で造ったものなどは神ではない」</strong>と言って、エフェソばかりでなくアジア州のほとんど全地域で、多くの人を説き伏せ、たぶらかしている。<strong>これでは、我々の仕事の評判が悪くなってしまうおそれがあるばかりでなく(!)</strong>、偉大な女神アルテミスの神殿もないがしろにされ、アジア州全体、全世界があがめるこの女神の御威光さえも失われてしまうだろう』」（<a href="https://bibleox.com/ja/jp-ni/act/19/#L24-27">使. 19:24-27</a>）</p></blockquote><h2>まことの神は偶像を拝む者に答えられない</h2><blockquote><p>「また、自分の子供を献げ物として火の中を通らせ、<strong>すべての偶像によって今日に至るまで自らを汚している</strong>。それなのに、イスラエルの家よ、わたしはお前たちの求めに応じられようか。わたしは生きている、と主なる神は言われる。<strong>わたしは決してお前たちの求めには応じない</strong>」（<a href="https://bibleox.com/ja/jp-ni/iez/20/#L31">エゼ. 20:31</a>）</p></blockquote><blockquote><p>「それは、<strong>偶像のゆえにわたしから離れ去った</strong>イスラエルの家の心をすべて、わたしが捕らえるためである」（<a href="https://bibleox.com/ja/jp-ni/iez/14/#L5">エゼ. 14:5</a>）</p></blockquote><h2>その他</h2><blockquote><p>「偶像を考えつくことから姦淫が始まり、偶像を造り出すことによって生活が堕落する」（<a href="https://bibleox.com/ja/jp-ni/prs/14/#L12">知. 14:12</a>）</p></blockquote><blockquote><p>「実体のない偶像を礼拝することは、諸悪の始まりと源、そして結末である」（<a href="https://bibleox.com/ja/jp-ni/prs/14/#L27">知. 14:27</a>）</p></blockquote><blockquote><p>「彼らは魂のない偶像に依り頼み、不当な誓いをしても罰せられるとは思わない」（<a href="https://bibleox.com/ja/jp-ni/prs/14/#L29">知. 14:29</a>）</p></blockquote><blockquote><p>「わたしは異国の者を迎え撃ちに出て行った。彼はその偶像によってわたしを呪った」（<a href="https://bibleox.com/ja/gr-lxx-byz/ps/151/#L6">詩. 151:6、七十人訳</a>。ギリシア語からの訳：ἐξῆλθον εἰς συνάντησιν τῷ ἀλλοφύλῳ, καὶ ἐπικατηράσατό με ἐν τοῖς εἰδώλοις αὐτοῦ。この詩編は新共同訳にはありません）</p></blockquote>

