    body: |-
      <h2>0</h2><p>ポリュカルポス[1]と、彼と共にいる司祭たちから、フィリピに寄留する[2]神の教会へ。全能の神と、私たちの救い主イエス・キリストから、あわれみと平和とが、あなたがたに豊かに与えられますように。</p>
      <h2>1</h2><p>1. 私たちの主イエス・キリストのうちに、私はあなたがたと共に大いに喜びました。あなたがたは真の愛の写し[3]を迎え入れ、ふさわしいやり方で、聖なる者にふさわしい鎖につながれた人々を送り出したからです[4]。その鎖は、神と私たちの主とによって真に選ばれた人々の冠です。</p><p>2. また、昔から宣べ伝えられてきたあなたがたの信仰の堅い根が、今に至るまでとどまり、私たちの主イエス・キリストへと実を結んでいるからです[5]。この方は私たちの罪のために、死にまで至ることを耐え忍ばれました。神は陰府の苦しみを解いて、この方を復活させられました[6]。</p><p>3. あなたがたはこの方を見たことがないのに信じ、言葉に尽くせない、栄光に満ちた喜びにあふれています[7]。多くの人々がこの喜びに入ることを願っています。あなたがたは知っているのです。あなたがたが恵みによって救われたのであって、行いによるのではなく[8]、イエス・キリストを通して神の御心によるのだということを。</p>
      <h2>2</h2><p>1. ですから、腰に帯を締めて[9]、恐れと真理のうちに神に仕えなさい[10]。むなしい無駄話と多くの人々の迷いとを捨て、私たちの主イエス・キリストを死者の中から復活させ、この方に栄光と[11]ご自分の右の座とをお与えになった方を信じなさい。天にあるものも地にあるものも、すべてはこの方に服従させられ[12]、息あるものはみなこの方に仕えています[13]。この方は、生きている者と死んだ者とを裁く方として来られます[14]。神は、この方に従わない者たちに、この方の血の責任を問われるでしょう[15]。</p><p>2. この方を死者の中から復活させた方は、私たちをも復活させてくださいます[16]。もし私たちがその御心を行い、その掟のうちを歩み、この方が愛されたものを愛し、あらゆる不義、貪欲、金銭への執着、悪口、偽証から遠ざかるならばです。悪をもって悪に、侮辱をもって侮辱に[17]、こぶしをもってこぶしに、呪いをもって呪いに報いることをせず、</p><p>3. 主が教えて言われたことを思い起こすならばです。「人を裁くな。あなたがたも裁かれないためである。赦しなさい。そうすれば、あなたがたも赦される。あわれみなさい。あわれみを受けるためである。あなたがたは自分の量る秤で量り返される」[18]。また、「貧しい人々と、義のために迫害される人々は幸いである。神の国はその人たちのものである」[19]。</p>
      <h2>3</h2><p>1. 兄弟たち、私が義についてこのことをあなたがたに書くのは、自分から買って出たからではなく、あなたがたが先に私に求めてきたからです。</p><p>2. 私も、また私のような他のだれも、祝福された、栄光あるパウロの知恵に及ぶことはできません。彼はあなたがたのところにいたとき、当時の人々の面前で、真理の言葉を正確に、また確かに教えました。また離れていたときには、あなたがたに手紙を書き送りました[20]。その手紙を深く読むなら、あなたがたは、与えられた信仰のうちに建て上げられることができるでしょう。</p><p>3. この信仰は「私たちすべての母」[21]であり、希望がそれに続き、神とキリストと隣人とへの愛がそれに先立ちます[22]。だれでもこれらのうちにとどまるなら、義の掟を満たしたことになります。愛を持つ者は、あらゆる罪から遠いからです。</p>
      <h2>4</h2><p>1. 金銭への執着は、あらゆる災いの始まりです[23]。ですから、私たちは何も世に持って来なかったし、何かを持って出ることもできない[24]ことを知って、義の武具で身を固めましょう[25]。そしてまず私たち自身が、主の掟のうちを歩むよう自らを教えましょう。</p><p>2. それから、私たちの妻たちにも教えましょう。与えられた信仰と愛と純潔のうちに歩み、まことを尽くして自分の夫を慕い、すべての人をあらゆる節制のうちに分け隔てなく愛し、子どもたちを神を畏れる教えで育てるようにと。</p><p>3. やもめたちには、主への信仰について慎み深く、すべての人のために絶えず執り成しの祈りをし、あらゆる中傷、悪口、偽証、金銭への執着、あらゆる悪から遠く離れているように教えましょう。彼女たちが神の祭壇であること[26]、神はすべてをくまなく調べられ、思いも考えも心の秘密も、何一つ神に隠されてはいないこと[27]を知るようにと。</p>
      <h2>5</h2><p>1. 神は侮られることがない[28]ことを知っているのですから、私たちはその掟と栄光とにふさわしく歩まなければなりません。</p><p>2. 同じように輔祭たちも、神の義の前で非難されるところのない者でなければなりません[29]。人の奉仕者ではなく、神とキリストの奉仕者としてです。中傷する者、二枚舌の者[30]ではなく、金銭に執着せず、何事にも節制し、あわれみ深く、勤勉で、すべての者の奉仕者（ディアコノス）となられた主の真理に従って歩む者でなければなりません[31]。もし私たちが今の世でこの方に喜ばれるなら、来るべき世をも受けることになります。この方は、私たちを死者の中から復活させると約束してくださいました。また、私たちがこの方にふさわしく生活するなら[32]、この方と共に支配することにもなる、と[33]。ただし、私たちが信じているならばです。</p><p>3. 同じように若者たちも、すべてにおいて非難されるところのない者であり、何よりもまず純潔に心を配り、あらゆる悪から自分を制していなければなりません。この世にある欲を断ち切るのはよいことです。あらゆる欲は霊に逆らって戦うからです[34]。そして「みだらな者も、男娼も、男色をする者も、神の国を受け継ぐことはできません」[35]。道に外れたことを行う者も同様です。ですから、これらすべてから遠ざかり、神とキリストに従うように司祭たちと輔祭たちに従わなければなりません[36]。おとめたちは、傷のない清い良心のうちに歩まなければなりません。</p>
      <h2>6</h2><p>1. 司祭たちもまた、あわれみ深く、すべての人に慈しみを示し、迷い出たものを連れ戻し[37]、病んでいる者をすべて見舞い、やもめやみなしごや貧しい者をなおざりにしてはなりません。いつも神の前でも人の前でも善いことに心を配り[38]、あらゆる怒り、えこひいき、不正な裁きから遠ざかり、あらゆる金銭への執着から遠く離れ、だれかについての悪い噂をすぐに信じこまず、裁きにおいて厳しすぎてはなりません。私たちは皆、罪の負債を負っていることを知っているからです。</p><p>2. ですから、もし私たちが、主に赦していただきたいと願うなら、私たちも赦さなければなりません[39]。私たちは主であり神である方の目の前にいるからです。そして、すべての人は「キリストの裁きの座の前に立ち」、一人一人が自分について申し述べなければなりません[40]。</p><p>3. ですから、主ご自身が命じられたとおりに、また私たちに福音を告げ知らせた使徒たちや、私たちの主の到来をあらかじめ告げた預言者たちが命じたとおりに、恐れとあらゆる敬虔とをもって主に仕えましょう。善いことに熱心であり、つまずきと偽の兄弟たちとから遠ざかりましょう。また、偽善をもって主の名を担い、むなしい人々を迷わせる者たちからも遠ざかりましょう。</p>
      <h2>7</h2><p>1. 「イエス・キリストが肉において来られたことを告白しない者はすべて、反キリストです」[41]。十字架の証しを告白しない者は、悪魔から出た者です[42]。主の言葉を自分の欲望に合わせてねじ曲げ、復活も裁きもないと言う者、その者はサタンの長子です[43]。</p><p>2. ですから、多くの人々のむなしさと偽りの教えとを捨てて、初めから私たちに伝えられた言葉に立ち帰りましょう[44]。身を慎んで祈り[45]、断食に励み、すべてを見通される神に、私たちを誘惑に遭わせないでくださいと[46]願い求めましょう。主が言われたとおりです。「心は燃えても、肉体は弱い」[47]。</p>
      <h2>8</h2><p>1. ですから、私たちの希望と私たちの義の保証[48]とに、絶えずしっかりとどまりましょう。それはキリスト・イエスです。この方は十字架の木の上で、自らその身に私たちの罪を担われ[49]、罪を犯したことがなく、その口には偽りがなかった[50]方です。むしろこの方は、私たちのために、私たちがこの方のうちに生きるために、すべてを耐え忍ばれました。</p><p>2. ですから、この方の忍耐に倣う者となりましょう。そして、もし私たちがこの方の名のために苦しみを受けるなら、この方をたたえましょう。この方はご自身によって、この模範[51]を私たちに示してくださり、私たちはそれを信じたのです。</p>
      <h2>9</h2><p>1. ですから、あなたがたすべてに勧めます。義の言葉に聞き従い、あらゆる忍耐を尽くしなさい。その忍耐を、あなたがたは祝福されたイグナティオス、ゾシモス、ルフォス[52]のうちに目の当たりにしました。それだけでなく、あなたがたの中のほかの人々のうちにも、パウロ自身とほかの使徒たちのうちにも見たのです。</p><p>2. これらの人々は皆、むなしく走ったのではなく[53]、信仰と義のうちに走ったのであり、苦しみを共にした主のもとで、自分たちにふさわしい場所にいるのだと確信していなさい[54]。彼らは今の世を愛したのではなく[55]、私たちのために死に、私たちのために神によって復活させられた方を愛したのです。</p>
      <h2>10</h2><p>1. ですから[56]、これらのことのうちに堅く立ち、主の模範に従いなさい。信仰において堅固で揺るがず、兄弟愛を持ち、互いに愛し合い、真理のうちに結ばれ、主の柔和をもって互いに仕え合い[57]、だれをも軽んじてはなりません。</p><p>2. 善を行うことができるときには、先延ばしにしてはなりません[58]。施しは死から救うからです[59]。皆、互いに従い合い[60]、異邦人の間で非の打ちどころのない生活をしなさい[61]。それは、あなたがたが善い行いによって自らも称賛を受け、主の名もあなたがたのゆえに冒瀆されることがないためです。</p><p>3. 主の名を冒瀆させる者は災いです[62]。ですから、すべての人に慎みを教えなさい。あなたがた自身も、その慎みのうちに生活しているのです。</p>
      <h2>11</h2><p>1. 私は、かつてあなたがたのもとで司祭とされたウァレンス[63]のことで、ひどく心を痛めています。彼は自分に与えられた職務[64]を、これほどまでにわきまえていないのです。ですから、あなたがたに勧めます。貪欲を避け、純潔で誠実でありなさい。あらゆる悪から遠ざかりなさい[65]。</p><p>2. このようなことで自分を治めることのできない者が、どうしてほかの人にそれを説くことができるでしょうか。だれでも貪欲から遠ざからないなら、偶像礼拝によって汚され[66]、主の裁きを知らない異邦人の一人として裁かれることになります。それとも私たちは、パウロが教えているように、聖なる者たちが世を裁く[67]ことを知らないのでしょうか。</p><p>3. しかし私は、祝福されたパウロが労苦したあなたがた、彼の手紙の初めに［ほめられている］あなたがた[68]の間に、そのようなことを何一つ感じ取ったことも、聞いたこともありません。彼はすべての教会の中であなたがたを誇っているのです[69]。当時、主を知っていたのはその諸教会だけで、私たちはまだ知らなかったのです[70]。</p><p>4. ですから兄弟たち、私は彼と彼の妻のことで深く悲しんでいます。主が彼らに真の悔い改めを与えてくださいますように。あなたがたも、このことにおいて慎み深くありなさい。そのような者たちを敵とは見なさず[71]、苦しんでいる、迷い出た肢体として呼び戻し、あなたがた全員の体を救いなさい。このようにすれば、あなたがたは自分自身を建て上げることになるのです[72]。</p>
      <h2>12</h2><p>1. 私は確信しています。あなたがたは聖なる書物によく通じていて、何一つあなたがたに隠されてはいません。しかし私には、それは与えられていません[73]。ただ、これらの書物に言われているとおりです。「怒っても、罪を犯してはならない」[74]。また、「日が暮れるまで怒ったままでいてはならない」[75]。これを心に留める人は幸いです。あなたがたはそうしていると、私は信じています。</p><p>2. 私たちの主イエス・キリストの神であり父である方と、永遠の大祭司[76]、神の子イエス・キリストご自身が、あなたがたを信仰と真理のうちに、またあらゆる柔和のうちに、怒ることなく、忍耐と寛容と辛抱と純潔のうちに建て上げてくださいますように。そして、あなたがたに、ご自分の聖なる者たちの間での受け継ぐ分と割り当て[77]とを与えてくださいますように。私たちにも、あなたがたと共に、また天の下にいて、私たちの主であり神であるイエス・キリスト[78]と、この方を死者の中から復活させたその父とを、これから信じるすべての人々にも与えてくださいますように。</p><p>3. すべての聖なる者たちのために祈りなさい。王たちや権威ある者たちや支配者たちのためにも[79]、あなたがたを迫害し憎む者たちのため[80]、十字架の敵たちのためにも[81]祈りなさい。それは、あなたがたの実がすべての人に明らかになり[82]、あなたがたがこの方のうちに完全な者となるためです[83]。</p>
      <h2>13</h2><p>1. あなたがたもイグナティオスも、私に手紙で、もしだれかがシリアへ行くなら、あなたがたの手紙もそこへ届けてほしいと頼んできました[84]。私はよい機会を得たら、そうしましょう。私自身が行くか、あなたがたのためにも使者として遣わす者によってです。</p><p>2. イグナティオスが私たちに送ってきた手紙と、私たちの手もとにあるほかの手紙とを、あなたがたの求めに応じて送ります。それらはこの手紙に添えてあります[85]。あなたがたはそこから大きな益を受けることができるでしょう。そこには信仰と忍耐と、私たちの主にかなうあらゆる教えがあるからです。イグナティオス自身と、彼と共にいる人々について確かなことを知ったら、私たちに知らせてください[86]。</p>
      <h2>14</h2><p>1. 私はこれらのことを、クレスケンス[87]によってあなたがたに書きました。彼のことは先にもあなたがたに推薦しましたが、今も推薦します。彼は私たちの間で非難されるところなく過ごしました。あなたがたの間でも同じであると信じています。彼の姉妹も、あなたがたのところに来たときには、よく迎えてください。私たちの主イエス・キリストのうちに健やかでありなさい。恵みがあなたがたすべてと共にありますように。アーメン。</p>
    references: |-
      <ol><li><p>ポリュカルポスはスミルナの主教。アンティオキアの主教イグナティオスがローマへ護送される途中、スミルナとフィリピを通ったすぐ後（110年頃）に、フィリピの教会の求めに応じてこの手紙を書きました。ポリュカルポス自身の著作で残っているのはこの手紙だけです。リヨンのエイレナイオスは、この手紙からポリュカルポスの信仰と真理の宣教を知ることができると書いています（<a href="https://bibleox.com/ja/ja/w/Pk1A_スミルナのポリュカルポス1世紀2世紀#HH-生涯">本サイトのポリュカルポスのページ</a>参照）。</p></li><li><p>παροικούσῃ —「寄留している、仮住まいをしている」。地上のキリスト者は旅人であり、仮住まいの身であるという考えです（<a href="https://bibleox.com/ja/jp-ni/1pet/1/#L1">１ペト. 1:1</a>、<a href="https://bibleox.com/ja/jp-ni/1pet/1/#L17">１ペト. 1:17</a>、<a href="https://bibleox.com/ja/jp-ni/1pet/2/#L11">１ペト. 2:11</a> 参照）。『ポリュカルポスの殉教』の冒頭も同じ言い方をしています。</p></li><li><p>μιμήματα τῆς ἀληθοῦς ἀγάπης —「真の愛の写し（似姿）」。キリストの愛に倣って鎖につながれた人々、すなわちフィリピを通ってローマへ送られた囚人たちのことです。</p></li><li><p>イグナティオスとその同行者たち（<a href="#HH-9">9:1</a>）のことです。彼らはトロアスからネアポリスを経てフィリピを通りました（<a href="https://bibleox.com/ja/ja/w/Ig1P_ポリュカルポスへの手紙#HH-8">『ポリュカルポスへの手紙』8:1</a>参照）。鎖を誇りとし、霊の真珠と呼ぶのはイグナティオス自身の言葉づかいでもあります（<a href="https://bibleox.com/ja/ja/w/Ig1E_エフェソの教会への手紙#HH-11">『エフェソの教会への手紙』11:2</a>）。</p></li><li><p>フィリピの教会は、50年頃パウロが建てたヨーロッパ最初の教会の一つです（<a href="https://bibleox.com/ja/jp-ni/act/16/#L12-40">使. 16:12-40</a>、<a href="https://bibleox.com/ja/jp-ni/fil/1/#L5">フィリ. 1:5</a> 参照）。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/act/2/#L24">使. 2:24</a> 参照。ポリュカルポスは「陰府（ハデス）の苦しみ」と書いていますが、使徒言行録の多くの写本では「死の苦しみ」です（新共同訳もそれに従っています）。「陰府の」は、ベザ写本などの読みと一致します。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/1pet/1/#L8">１ペト. 1:8</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/ef/2/#L8-9">エフェ. 2:8-9</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/1pet/1/#L13">１ペト. 1:13</a>、<a href="https://bibleox.com/ja/jp-ni/ef/6/#L14">エフェ. 6:14</a> 参照。新共同訳では「心を引き締め」と訳されていますが、ギリシア語は直訳すると「腰に帯を締め」です。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/ps/2/#L11">詩. 2:11</a> 参照（詩編では「主に仕え」）。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/1pet/1/#L21">１ペト. 1:21</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/1kor/15/#L28">１コリ. 15:28</a>、<a href="https://bibleox.com/ja/jp-ni/fil/2/#L10">フィリ. 2:10</a>、<a href="https://bibleox.com/ja/jp-ni/fil/3/#L21">フィリ. 3:21</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/ps/150/#L6">詩. 150:6</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/act/10/#L42">使. 10:42</a>、<a href="https://bibleox.com/ja/jp-ni/2tim/4/#L1">２テモ. 4:1</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/gen/9/#L5">創. 9:5</a>、<a href="https://bibleox.com/ja/jp-ni/lk/11/#L50-51">ルカ. 11:50-51</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/2kor/4/#L14">２コリ. 4:14</a>、<a href="https://bibleox.com/ja/jp-ni/1kor/6/#L14">１コリ. 6:14</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/1pet/3/#L9">１ペト. 3:9</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/mf/7/#L1-2">マタ. 7:1-2</a>、<a href="https://bibleox.com/ja/jp-ni/lk/6/#L36-38">ルカ. 6:36-38</a>、<a href="https://bibleox.com/ja/jp-ni/mf/6/#L14">マタ. 6:14</a> 参照。ポリュカルポスは主の言葉を、福音書の言い回しを組み合わせて自由に引いています。ローマのクレメンスの『コリントの教会への手紙』13:2 にもよく似た引用があります。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/mf/5/#L3">マタ. 5:3</a>、<a href="https://bibleox.com/ja/jp-ni/mf/5/#L10">マタ. 5:10</a>、<a href="https://bibleox.com/ja/jp-ni/lk/6/#L20">ルカ. 6:20</a> 参照。</p></li><li><p>ギリシア語の「手紙」は複数形です。フィリピの信徒への手紙のほかにも失われた手紙があったのか、テサロニケの信徒への手紙などマケドニアの諸教会に宛てた手紙も含めて言っているのかは、はっきりしません（<a href="#HH-11">11:3</a>参照）。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/gal/4/#L26">ガラ. 4:26</a> 参照。パウロは天のエルサレムを「私たちの母」と呼んでいますが、ポリュカルポスはこれを信仰に当てはめています。</p></li><li><p>信仰・希望・愛について <a href="https://bibleox.com/ja/jp-ni/1kor/13/#L13">１コリ. 13:13</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/1tim/6/#L10">１テモ. 6:10</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/1tim/6/#L7">１テモ. 6:7</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/rim/6/#L13">ロマ. 6:13</a>、<a href="https://bibleox.com/ja/jp-ni/2kor/6/#L7">２コリ. 6:7</a>、<a href="https://bibleox.com/ja/jp-ni/ef/6/#L11">エフェ. 6:11</a> 参照。</p></li><li><p>教会に養われ、絶えず祈りをささげるやもめたちを、ささげ物の置かれる「神の祭壇」にたとえています。後の著作家たちにも同じたとえが見られます（テルトゥリアヌス『妻へ』1:7 など）。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/evr/4/#L12-13">ヘブ. 4:12-13</a>、<a href="https://bibleox.com/ja/jp-ni/1kor/14/#L25">１コリ. 14:25</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/gal/6/#L7">ガラ. 6:7</a> 参照。</p></li><li><p>輔祭の資格について <a href="https://bibleox.com/ja/jp-ni/1tim/3/#L8-13">１テモ. 3:8-13</a> 参照。</p></li><li><p>δίλογοι —「二枚舌の」。<a href="https://bibleox.com/ja/jp-ni/1tim/3/#L8">１テモ. 3:8</a> と同じ語です。</p></li><li><p>「奉仕者」と訳した語はディアコノス、すなわち「輔祭」と同じ語です。主ご自身が「すべての人に仕える者」となられたことについて <a href="https://bibleox.com/ja/jp-ni/mk/9/#L35">マコ. 9:35</a>、<a href="https://bibleox.com/ja/jp-ni/mf/20/#L28">マタ. 20:28</a> 参照。</p></li><li><p>πολιτευσώμεθα —「市民として生活する」。<a href="https://bibleox.com/ja/jp-ni/fil/1/#L27">フィリ. 1:27</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/2tim/2/#L12">２テモ. 2:12</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/1pet/2/#L11">１ペト. 2:11</a>、<a href="https://bibleox.com/ja/jp-ni/gal/5/#L17">ガラ. 5:17</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/1kor/6/#L9-10">１コリ. 6:9-10</a> 参照。</p></li><li><p>ここで主教が挙げられていないのは、当時のフィリピの教会に主教がいなかったか（あるいは空位であったか）、主教も含めて「司祭たち」と呼んでいるかのどちらかと考えられます。イグナティオスは主教・司祭・輔祭の三つをはっきり区別しています（<a href="https://bibleox.com/ja/ja/w/Ig1S_スミルナの教会への手紙#HH-8">『スミルナの教会への手紙』8:1</a>参照）。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/iez/34/#L4">エゼ. 34:4</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/rim/12/#L17">ロマ. 12:17</a>、<a href="https://bibleox.com/ja/jp-ni/2kor/8/#L21">２コリ. 8:21</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/mf/6/#L12">マタ. 6:12</a>、<a href="https://bibleox.com/ja/jp-ni/mf/6/#L14-15">マタ. 6:14-15</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/rim/14/#L10">ロマ. 14:10</a>、<a href="https://bibleox.com/ja/jp-ni/rim/14/#L12">ロマ. 14:12</a>、<a href="https://bibleox.com/ja/jp-ni/2kor/5/#L10">２コリ. 5:10</a> 参照。新共同訳のローマの信徒への手紙14:10は「神の裁きの座」ですが、ポリュカルポスは多くの写本（ビザンティン本文）と同じく「キリストの裁きの座」と書いています。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/1in/4/#L2-3">１ヨハ. 4:2-3</a>、<a href="https://bibleox.com/ja/jp-ni/2in/1/#L7">２ヨハ. 1:7</a> 参照。キリストがまことの肉をとったことを否定し、その受難を見せかけにすぎないと考える仮現論者（ドケティスト）のことです。イグナティオスも同じ人々と戦いました（<a href="https://bibleox.com/ja/ja/w/Ig1S_スミルナの教会への手紙#HH-2">『スミルナの教会への手紙』2章</a>、<a href="https://bibleox.com/ja/ja/w/Ig1T_トラレスの教会への手紙#HH-10">『トラレスの教会への手紙』10章</a>参照）。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/1in/3/#L8">１ヨハ. 3:8</a>、<a href="https://bibleox.com/ja/jp-ni/in/8/#L44">ヨハ. 8:44</a> 参照。「十字架の証し」とは、キリストが十字架上でまことに苦しみを受け、死なれたことを指します。</p></li><li><p>エイレナイオスによれば、ポリュカルポスはローマで異端者マルキオンに「私を知っていますか」と問われたとき、「知っているとも、サタンの長子を知っている」と答えました（<a href="https://bibleox.com/ja/ja/w/Pk1M_ポリュカルポスの殉教#HH-モスクワ写本による結び">『ポリュカルポスの殉教』モスクワ写本による結び</a>参照）。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/1in/2/#L24">１ヨハ. 2:24</a>、<a href="https://bibleox.com/ja/jp-ni/iud/1/#L3">ユダ. 1:3</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/1pet/4/#L7">１ペト. 4:7</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/mf/6/#L13">マタ. 6:13</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/mf/26/#L41">マタ. 26:41</a>、<a href="https://bibleox.com/ja/jp-ni/mk/14/#L38">マコ. 14:38</a> 参照。</p></li><li><p>ἀρραβών —「手付け金、保証」。<a href="https://bibleox.com/ja/jp-ni/2kor/1/#L22">２コリ. 1:22</a>、<a href="https://bibleox.com/ja/jp-ni/ef/1/#L14">エフェ. 1:14</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/1pet/2/#L24">１ペト. 2:24</a> 参照。新共同訳の「十字架にかかって」は、ギリシア語では「木の上で」です。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/1pet/2/#L22">１ペト. 2:22</a>、<a href="https://bibleox.com/ja/jp-ni/is/53/#L9">イザ. 53:9</a> 参照。</p></li><li><p>ὑπογραμμός —「手本、なぞるための下書き」。<a href="https://bibleox.com/ja/jp-ni/1pet/2/#L21">１ペト. 2:21</a> 参照。</p></li><li><p>ゾシモスとルフォスは、イグナティオスと共にローマへ送られた殉教者たちと考えられています。ここでポリュカルポスは、イグナティオスをすでに殉教した人として語っていますが、<a href="#HH-13">13:2</a>では彼の消息を尋ねています。そのため、13–14章はイグナティオスが通った直後に書かれた別の短い手紙で、1–12章は少し後に書かれたと考える研究者もいます。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/fil/2/#L16">フィリ. 2:16</a>、<a href="https://bibleox.com/ja/jp-ni/gal/2/#L2">ガラ. 2:2</a> 参照。</p></li><li><p>ローマのクレメンスも、ペトロとパウロについて「ふさわしい栄光の場所へ行った」と書いています（『コリントの教会への手紙』5:4、5:7）。</p></li><li><p>パウロを見捨てたデマスについての言葉 <a href="https://bibleox.com/ja/jp-ni/2tim/4/#L10">２テモ. 4:10</a> 参照。</p></li><li><p>ギリシア語の写本はすべて9章の途中で終わっており、9章と13章はエウセビオス『教会史』3巻36章の引用によってギリシア語で伝わっています。10–12章、14章、13章の終わりは古いラテン語訳によってのみ残っているので、ここからはラテン語訳から訳しています。</p></li><li><p>mansuetudine domini alterutri praestolantes —「主の柔和をもって互いに待ち受ける（仕える）」。ラテン語訳のもとになったギリシア語ははっきりしません。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/pr/3/#L28">箴. 3:28</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/tov/4/#L10">トビ. 4:10</a>、<a href="https://bibleox.com/ja/jp-ni/tov/12/#L9">トビ. 12:9</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/1pet/5/#L5">１ペト. 5:5</a>、<a href="https://bibleox.com/ja/jp-ni/ef/5/#L21">エフェ. 5:21</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/1pet/2/#L12">１ペト. 2:12</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/is/52/#L5">イザ. 52:5</a>、<a href="https://bibleox.com/ja/jp-ni/rim/2/#L24">ロマ. 2:24</a> 参照。イグナティオスも同じ言葉を引いています（<a href="https://bibleox.com/ja/ja/w/Ig1T_トラレスの教会への手紙#HH-8">『トラレスの教会への手紙』8:2</a>）。</p></li><li><p>ウァレンスはフィリピの司祭でしたが、妻と共に金銭にからむ罪（おそらく教会の財産の横領）を犯したようです。この手紙が何度も金銭への執着を戒めているのは、この事件のためと考えられます。</p></li><li><p>locus（ギリシア語では τόπος）—「場所、地位」。ここでは司祭の職務のことです。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/1sol/5/#L22">１テサ. 5:22</a> 参照。</p></li><li><p>貪欲を偶像礼拝とすることについて <a href="https://bibleox.com/ja/jp-ni/ef/5/#L5">エフェ. 5:5</a>、<a href="https://bibleox.com/ja/jp-ni/kol/3/#L5">コロ. 3:5</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/1kor/6/#L2">１コリ. 6:2</a> 参照。</p></li><li><p>qui estis in principio epistulae eius — 直訳は「彼の手紙の初めにいるあなたがた」。パウロがフィリピの信徒への手紙の冒頭で彼らのために感謝していること（<a href="https://bibleox.com/ja/jp-ni/fil/1/#L3-11">フィリ. 1:3-11</a>）を指すと考えられます。「福音の初めから」（<a href="https://bibleox.com/ja/jp-ni/fil/4/#L15">フィリ. 4:15</a>）を指すとする読み方もあります。</p></li><li><p>パウロがこう書いているのは、実際にはテサロニケの教会についてです（<a href="https://bibleox.com/ja/jp-ni/2sol/1/#L4">２テサ. 1:4</a>）。ポリュカルポスは同じマケドニアの諸教会をまとめて思い起こしているのかもしれません。</p></li><li><p>フィリピの教会はパウロによって50年頃に建てられましたが、スミルナの教会はそれより後にできたことを指しています。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/2sol/3/#L15">２テサ. 3:15</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/1kor/12/#L26">１コリ. 12:26</a> 参照。</p></li><li><p>謙遜の言葉です。「（あなたがたに書くことは）私には与えられていない」と読む解釈もあります。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/ps/4/#L5">詩. 4:5</a> 参照。ポリュカルポスはギリシア語訳（七十人訳）の詩編を引いています。新共同訳はヘブライ語本文から訳しているので「おののいて罪を離れよ」となっています。パウロもエフェソの信徒への手紙4:26で、七十人訳のこの言葉を引いています。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/ef/4/#L26">エフェ. 4:26</a> 参照。ポリュカルポスは詩編とパウロの手紙を並べて「これらの書物」と呼び、パウロの手紙を聖書として引いています。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/evr/6/#L20">ヘブ. 6:20</a>、<a href="https://bibleox.com/ja/jp-ni/evr/7/#L3">ヘブ. 7:3</a> 参照。ポリュカルポスは殉教の直前の祈りでも、キリストを「永遠で天上の大祭司」と呼んでいます（<a href="https://bibleox.com/ja/ja/w/Pk1M_ポリュカルポスの殉教#HH-14">『ポリュカルポスの殉教』14:3</a>）。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/kol/1/#L12">コロ. 1:12</a>、<a href="https://bibleox.com/ja/jp-ni/act/26/#L18">使. 26:18</a> 参照。</p></li><li><p>et deum —「また神である」。一部のラテン語写本にはこの語がありません（ロシア語訳でも省かれています）が、ライトフット版などの校訂本はこれを本文としています。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/1tim/2/#L1-2">１テモ. 2:1-2</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/mf/5/#L44">マタ. 5:44</a>、<a href="https://bibleox.com/ja/jp-ni/lk/6/#L27-28">ルカ. 6:27-28</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/fil/3/#L18">フィリ. 3:18</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/1tim/4/#L15">１テモ. 4:15</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/iak/1/#L4">ヤコ. 1:4</a>、<a href="https://bibleox.com/ja/jp-ni/kol/2/#L10">コロ. 2:10</a> 参照。</p></li><li><p>イグナティオスは諸教会に、迫害が止んだアンティオキアの教会に使者や手紙を送るよう頼んでいました（<a href="https://bibleox.com/ja/ja/w/Ig1F_フィラデルフィアの教会への手紙#HH-10">『フィラデルフィアの教会への手紙』10:1</a>、<a href="https://bibleox.com/ja/ja/w/Ig1S_スミルナの教会への手紙#HH-11">『スミルナの教会への手紙』11:2</a>、<a href="https://bibleox.com/ja/ja/w/Ig1P_ポリュカルポスへの手紙#HH-7">『ポリュカルポスへの手紙』7:2</a>、<a href="https://bibleox.com/ja/ja/w/Ig1P_ポリュカルポスへの手紙#HH-8">『ポリュカルポスへの手紙』8:1</a>）。</p></li><li><p>これはイグナティオスの手紙が集められたことを伝える最も古い証言です。ここで言う「イグナティオスが私たちに送ってきた手紙」は、スミルナの教会とポリュカルポスに宛てた手紙（<a href="https://bibleox.com/ja/ja/w/Ig1S_スミルナの教会への手紙#HH-1">『スミルナの教会への手紙』1章</a>、<a href="https://bibleox.com/ja/ja/w/Ig1P_ポリュカルポスへの手紙#HH-1">『ポリュカルポスへの手紙』1章</a>）のことです。この節までのギリシア語本文はエウセビオス『教会史』3巻36章に引かれています。</p></li><li><p>この最後の一文はラテン語訳だけに残っています。イグナティオスの殉教についての知らせがまだ届いていないことがうかがえます（<a href="#HH-9">9:1</a>の注参照）。</p></li><li><p>テモテへの第二の手紙に出てくるクレスケンス（<a href="https://bibleox.com/ja/jp-ni/2tim/4/#L10">２テモ. 4:10</a>）と同じ人かどうかはわかりません。</p></li></ol>
      <p>翻訳：ロジオン・ヴラソフ（AIツールを併用）。底本：<a href="https://bibleox.com/ja/grc/w/Επιστολή-Πολυκάρπου-προς-Φιλιππησίους">本サイトのギリシア語版</a>（レイク版、1912年。Open Apostolic Fathers による校訂）。1–9章と13章はギリシア語本文、10–12章、14章、13章の結びは古いラテン語訳から訳した。参照：ロシア語訳（『初期教会教父選集』ブリュッセル、1988年）、ライトフット版とホームズ版の英訳。聖書の引用は新共同訳による。</p>
  - src: окружное-послание-Церкви-Смирнской-о-Поликарпе
    path: Pk1M_ポリュカルポスの殉教
    title: ポリュカルポスの殉教
    title_sub: スミルナの教会がポリュカルポスの殉教について諸教会に送った回状（2世紀）
    meta_desc: 聖ポリュカルポスの殉教を伝えるスミルナの教会の回状。ギリシア語原文からの翻訳と注。
    menu: { parent: "手紙", title: "ポリュカルポスの殉教", priority: 2 }
    body: |-
      <h2>0</h2><p>スミルナに寄留する神の教会[1]から、フィロメリオン[2]に寄留する神の教会、またあらゆる所にある聖なる公の教会[3]のすべての信徒の群れへ。父なる神と私たちの主イエス・キリストからの、あわれみと平和と愛とが、あなたがたに豊かに与えられますように。</p>
      <h2>1</h2><p>1. 兄弟たち、私たちはあなたがたに、殉教者たちと、祝福されたポリュカルポスについて書き送ります。彼は、いわば自分の殉教[4]によって迫害に封印をし、それを終わらせたのです。これに先立って起こったことのほとんどすべては、主が私たちに、福音にかなう殉教[5]を上から示すために起こったからです。</p><p>2. 彼は、主がそうなさったように、引き渡されるのを待っていました。それは、私たちも自分のことだけでなく、隣人のことにも目を留めて[6]、彼に倣う者となるためです。自分だけが救われることを望むのではなく、すべての兄弟たちが救われることを望むのは、真実で揺るぎない愛のしるしだからです。</p>
      <h2>2</h2><p>1. 神の御心に従って起こったすべての殉教は、祝福された、気高いものです。私たちはいっそう敬虔な者として、すべてを支配する力を神に帰さなければならないからです。</p><p>2. 彼らの気高さ、忍耐、主への愛に、驚かない者がいるでしょうか。彼らは鞭で引き裂かれ、体の内側の静脈や動脈までが見えるほどになりながら、耐え忍びました。そばに立つ人々さえあわれんで嘆き悲しむほどでした。ある者たちは、だれ一人うめき声も嘆き声も上げないほどの気高さに達しました。こうして彼らは私たちすべてに示したのです。キリストの殉教者たちは、責め苦を受けていたその時、肉体を離れていた[7]のだということ、いや、むしろ主がそばに立って彼らと語り合っておられたのだということを。</p><p>3. 彼らはキリストの恵みに心を向け、この世の責め苦を見下し、ただ一時によって永遠の命を買い取りました[8]。非情な拷問者たちの火も、彼らには冷たいものでした。彼らは、決して消えることのない永遠の火から逃れることを目の前に見ていたからです。また心の目で、耐え忍んだ者たちのために取っておかれている良いもの、すなわち「耳が聞きもせず、目が見もせず、人の心に思い浮かびもしなかった」[9]ものを見上げていました。それは彼らに主によって示されていたのです。彼らはもはや人間ではなく、すでに天使となっていたからです。</p><p>4. 同じように、獣に投げ与えられる刑を宣告された者たちも、恐ろしい罰を耐え忍びました。とがった貝殻[10]の上に寝かされ、ほかにもさまざまな責め苦で痛めつけられました。暴君[11]は、できることなら、絶え間ない罰によって彼らを否認へと向かわせようとしたのです。</p>
      <h2>3</h2><p>1. 悪魔は彼らに対してさまざまなたくらみをめぐらしました。しかし神に感謝します。悪魔はすべての者に打ち勝つことはできなかったのです[12]。最も気高いゲルマニコスは、自らの忍耐によって、ほかの人々の臆する心を励ましました。彼は見事に獣と戦いました。総督[13]が彼を説き伏せようとして、自分の年齢をあわれむようにと言ったとき、彼は獣を力ずくで自分に引き寄せました。彼らの不正で不法な生き方から、少しでも早く解き放たれたいと望んだのです[14]。</p><p>2. そこで群衆はみな、神に愛され神を敬うキリスト者の種族の気高さに驚いて、「無神論者どもを除け[15]。ポリュカルポスを探し出せ」と叫び立てました。</p>
      <h2>4</h2><p>1. しかし一人、クイントスという名のフリギア人で、最近フリギアから来た者は、獣を見て臆してしまいました。この人こそ、自分自身とほかの何人かを、自ら進んで名乗り出るように駆り立てた者でした。総督はしきりに説き伏せて、彼に誓いを立てさせ、いけにえを献げさせました。ですから兄弟たち、私たちは自分から進んで名乗り出る者たちをほめはしません。福音はそのように教えていないからです[16]。</p>
      <h2>5</h2><p>1. 最も驚くべき人ポリュカルポスは、初めにこれを聞いたとき、うろたえることなく、町にとどまろうとしました。しかし多くの人々が、ひそかに町を出るよう彼を説き伏せました。そこで彼は、町からそう遠くない小さな農園に退き、わずかな人々と共に過ごしました。夜も昼も、ほかに何もせず、すべての人のために、また全世界の諸教会のために祈っていました。それが彼のいつもの習慣でした。</p><p>2. 捕らえられる三日前、祈っているうちに彼は幻を見ました。自分の枕が火に焼かれているのを見たのです。彼は振り向いて、共にいた人々に言いました。「私は生きたまま焼かれなければならない」。</p>
      <h2>6</h2><p>1. 彼を探す者たちがなお追ってきたので、彼は別の農園に移りました。するとすぐに、彼を探す者たちがやって来ました[17]。彼を見つけられなかったので、彼らは二人の若い奴隷を捕らえ、そのうちの一人が拷問を受けて白状しました。彼を裏切った者たちが身内の者だったので[18]、彼が身を隠しおおせることはできなかったのです。</p><p>2. 警察長官[19]は、ちょうどヘロデという名を割り当てられていた者でしたが[20]、彼を急いで競技場に引き出そうとしていました。それは、ポリュカルポスがキリストにあずかる者となって自分の受けるべき分を全うし、彼を裏切った者たちがユダその人の罰を受けるためでした。</p>
      <h2>7</h2><p>1. そこで彼らはその若い奴隷を連れて、金曜日[21]の夕食の頃、捕吏[22]と騎兵たちがいつもの武器を持って、強盗に向かうかのように[23]出て行きました。夜遅く、皆で押し寄せると、彼が小さな家の屋上の部屋で横になっているのを見つけました。彼はそこからも別の場所へ逃れることができましたが、「神の御心が行われますように」[24]と言って、そうしようとはしませんでした。</p><p>2. 彼らが来たと聞くと、彼は降りて行って彼らと語り合いました。居合わせた者たちは、彼の年齢と落ち着きに驚き、これほどの老人を捕らえるのに、あれほど躍起になる必要があったのかと驚きました。彼はすぐに、その時刻であったにもかかわらず、彼らが望むだけ食べたり飲んだりできるように食卓を用意させました[25]。そして、心おきなく祈るために一時間の猶予を与えてくれるよう頼みました。</p><p>3. 彼らが許すと、彼は立って[26]祈りました。神の恵みに満たされていたので、二時間にわたって黙ることができず、聞いていた者たちは驚嘆し、多くの者は、これほど神にふさわしい老人のもとに来たことを悔やみました。</p>
      <h2>8</h2><p>1. 彼は、かつて自分とかかわりを持ったすべての人々、小さな者も大きな者も、名のある者も名のない者も、また全世界の公の教会全体を思い起こして、ようやく祈りを終えました。出発の時が来ると、人々は彼をろばに乗せて町へ連れて行きました[27]。その日は大いなる安息日[28]でした。</p><p>2. 警察長官ヘロデとその父ニケテスが彼を出迎え、彼を自分たちの馬車[29]に乗せ換え、そばに座って説き伏せようとして言いました。「『皇帝は主[30]』と言い、いけにえを献げ、そのほかのことをして、命を救うことの何が悪いのか」。彼は初めは答えませんでしたが、彼らがしつこく迫ると、「あなたがたが勧めることを、私はするつもりはありません」と言いました。</p><p>3. 彼らは説き伏せることができないとわかると、ひどい言葉を浴びせ、大急ぎで彼を引きずり降ろしたので、馬車から降りるときに彼はすねをすりむきました。しかし彼は振り向きもせず、何事もなかったかのように、進んで急ぎ足で歩き、競技場へと引かれて行きました。競技場はひどい騒ぎで、だれの声も聞こえないほどでした。</p>
      <h2>9</h2><p>1. ポリュカルポスが競技場に入って行くと、天から声がありました。「強くあれ、ポリュカルポス。雄々しくあれ」[31]。語った者の姿はだれも見ませんでしたが、その声は、居合わせた私たちの仲間たちが聞きました。</p><p>2. それから彼が引き出されると、ポリュカルポスが捕らえられたと聞いて大騒ぎになりました。総督は、引き出された彼に、ポリュカルポス本人かと尋ねました。彼がそうだと認めると、総督は否認するよう説き伏せようとして言いました。「自分の年齢を恥じよ」。そのほか、彼らがいつも言うようなことを言いました。「皇帝の守護霊（テュケー）[32]にかけて誓え。考えを改めよ。『無神論者どもを除け』と言え」。するとポリュカルポスは、競技場にいる不法な異邦人の群衆全体を厳しい顔つきで見渡し、彼らに向かって手を振り、うめいて天を仰ぎ、「無神論者どもを除け」と言いました[33]。</p><p>3. 総督がなおも迫って、「誓え。そうすれば釈放してやる。キリストをののしれ」と言うと、ポリュカルポスは言いました。「八十六年間[34]、私はこの方にお仕えしてきましたが、この方は私に何一つ悪いことをなさいませんでした。私を救ってくださった私の王を、どうして冒瀆することができるでしょうか」。</p>
      <h2>10</h2><p>1. 総督がなおも迫って、「皇帝の守護霊にかけて誓え」と言うと、彼は答えました。「あなたが言うように、私が皇帝の守護霊にかけて誓うなどと空しく思い込み、私がだれであるかを知らないふりをするのなら、はっきり聞きなさい。私はキリスト者です。キリスト教の教えを学びたいのなら、一日を与えて聞きなさい」。</p><p>2. 総督は言いました。「民衆を説き伏せてみよ」[35]。ポリュカルポスは言いました。「あなたには、言葉をかける値打ちがあると考えました。私たちは、神によって立てられた支配者たちや権威ある者たちに、私たちを損なわないかぎり、ふさわしい敬意を払うよう教えられているからです[36]。しかしあの者たちには、弁明するだけの値打ちがあるとは思いません」。</p>
      <h2>11</h2><p>1. 総督は言いました。「私には獣がいる。考えを改めないなら、おまえを獣に投げ与える」。彼は言いました。「呼びなさい。より善いものからより悪いものへと考えを改めることは、私たちにはできません。しかし、悪から義へと改めるのはよいことです」。</p><p>2. 総督は再び彼に言いました。「獣を見下すのなら、考えを改めないかぎり、火で焼き尽くしてやる」。ポリュカルポスは言いました。「あなたは、しばらく燃えてまもなく消える火で脅しています。来るべき裁きと永遠の罰の火、不敬虔な者たちのために取っておかれている火を、あなたは知らないのです[37]。しかし、なぜぐずぐずしているのですか。望むことをしなさい」。</p>
      <h2>12</h2><p>1. これらのことや、ほかにも多くのことを語りながら、彼は勇気と喜びに満たされ、その顔は恵みにあふれていました[38]。こうして彼は、自分に向けて語られたことにうろたえて崩れるどころか、逆に総督のほうが驚き呆れ、自分の伝令を競技場の真ん中に遣わして、三度こう触れさせました。「ポリュカルポスは自らキリスト者であると告白した」。</p><p>2. 伝令がこう告げると、スミルナに住む異邦人とユダヤ人の群衆はみな、抑えきれない怒りに燃えて大声で叫びました。「こいつは不敬虔の教師[39]、キリスト者どもの父、我らの神々を倒す者、多くの者に神々にいけにえを献げるな、拝むなと教えている者だ」。彼らはこう言って叫び立て、アジア州祭司長[40]フィリッポスに、ポリュカルポスにライオンを放つよう求めました。しかしフィリッポスは、獣の見せ物はもう終わったので、それは許されないと言いました。</p><p>3. そこで彼らは、ポリュカルポスを生きたまま焼くよう、一斉に叫ぶことにしました。枕についての幻が実現しなければならなかったからです。彼は祈っているときに枕が燃えているのを見て、振り向いて、共にいた信徒たちに預言して言いました。「私は生きたまま焼かれなければならない」。</p>
      <h2>13</h2><p>1. これらのことは、語られるよりも速く、あっという間に起こりました。群衆はすぐに仕事場や浴場から薪や柴を集めてきました。とりわけユダヤ人たちが、彼らの習いのとおり、熱心にそれを手伝いました。</p><p>2. 薪の山が整えられると、彼は自分で上着をすべて脱ぎ、帯を解き、履物も脱ごうとしました。以前はそうする必要がありませんでした。信徒たちが皆、だれが先に彼の肌に触れるかと、いつも競い合っていたからです[41]。彼はその善い生き方のゆえに、殉教の前から、あらゆる誉れをもって敬われていたのです[42]。</p><p>3. すぐに、火刑のために用意された道具が彼の周りに置かれました。彼らが彼を釘で打ちつけようとすると、彼は言いました。「このままにしておきなさい。火を耐え忍ぶ力を与えてくださる方は、あなたがたが釘で固めなくても、私が火の中で身動きせずにとどまる力を与えてくださるでしょう」。</p>
      <h2>14</h2><p>1. そこで彼らは彼を釘で打ちつけはせず、縛りつけました。彼は両手を背中に回して縛られ、大きな群れから選び出されてささげ物とされる立派な雄羊のように、神に喜ばれる焼き尽くす献げ物として整えられました[43]。そして天を仰いで言いました。「主よ、全能の神よ、あなたの愛する、ほめたたえられるべき子（パイス）[44]イエス・キリストの父よ。私たちはこの方を通して、あなたを知る知識を受けました。天使たちと諸々の力と、すべての被造物と、あなたの前に生きる義人たちのすべての種族の神よ。</p><p>2. 私はあなたをほめたたえます。あなたは私をこの日、この時にふさわしい者とし、殉教者たちの数に加わって、あなたのキリストの杯[45]にあずからせてくださいました。それは、聖霊による朽ちないもののうちに、魂と体とが永遠の命へと復活するため[46]です。どうか今日、私が彼らと共に、あなたの前に、豊かで喜ばれるいけにえとして受け入れられますように。偽りのない、まことの神よ、あなたがあらかじめ備え、あらかじめ示し、そして成し遂げてくださったとおりに。</p><p>3. それゆえ、またすべてのことのゆえに、私はあなたを賛美し、あなたをほめたたえ、あなたに栄光を帰します。永遠で天上の大祭司[47]、あなたの愛する子イエス・キリストを通して。この方を通して、この方と聖霊と共に、あなたに栄光が、今も、また来るべき世々にもありますように[48]。アーメン」。</p>
      <h2>15</h2><p>1. 彼が「アーメン」と唱えて祈りを終えると、火の係の者たちが火をつけました。大きな炎が燃え上がったとき、私たちは不思議を見ました。見ることを許された私たちです。私たちは、起こったことをほかの人々に伝えるために守られたのです。</p><p>2. 火は、風をはらんだ船の帆のように丸天井の形をつくり、殉教者の体を円く囲みました。彼はその真ん中にいましたが、焼かれる肉のようではなく、焼かれるパン[49]のように、また炉の中で精錬される金や銀のように[50]見えました。そして私たちは、乳香か、何かほかの高価な香料が香っているような、えも言われぬ芳しい香りを感じたのです[51]。</p>
      <h2>16</h2><p>1. ついに不法な者たちは、彼の体が火で焼き尽くされないのを見て、とどめを刺す役人[52]に、近寄って短剣で刺すよう命じました。役人がそうすると、鳩[53]と大量の血が流れ出て[54]、火を消してしまいました。群衆は皆、不信仰な者たちと選ばれた者たちとの間には、これほどの違いがあるのかと驚きました。</p><p>2. 最も驚くべき人ポリュカルポスも、その選ばれた者たちの一人でした。彼は私たちの時代において、使徒的で預言的な教師であり、スミルナの公の教会[55]の主教でした。彼の口から出たすべての言葉は、実現したか、また実現するでしょう。</p>
      <h2>17</h2><p>1. しかし、ねたみ深くそねみ深い悪い者、義人の種族に敵対する者は、彼の殉教の偉大さと、初めから非の打ちどころのなかった生き方とを見、また彼が朽ちない冠を受け[56]、だれも異を唱えることのできない賞を得たのを見て、私たちが彼の亡骸を引き取ることさえできないようにたくらみました。多くの人々がそうすることを、彼の聖なる肉にあずかる[57]ことを望んでいたのです。</p><p>2. そこで悪い者は、ヘロデの父でアルケーの兄弟であるニケテスをそそのかして、長官[58]に、彼の体を渡さないよう願い出させました。「彼らが十字架につけられた者を捨てて、この者を拝み始めるといけないから」と言うのです。ユダヤ人たちもそそのかし、強く迫りました。彼らは、私たちが彼を火の中から引き取ろうとしているのを見張っていたのです[59]。彼らは知らなかったのです。全世界の救われる人々の救いのために苦しみを受けられた方、罪人たちのための罪のない方であるキリストを、私たちが捨てることは決してできず、ほかのだれかを拝むこともできないということを。</p><p>3. 私たちはこの方を神の子として拝みますが、殉教者たちは、主の弟子また主に倣う者として、ふさわしく愛するのです[60]。彼らが自分の王であり教師である方に、比べるもののない忠誠を示したからです。私たちも彼らの仲間となり、共に弟子となることができますように。</p>
      <h2>18</h2><p>1. 百人隊長は、ユダヤ人たちが争いを起こしたのを見て、彼らの習慣どおり、遺体を真ん中に置いて[61]焼きました。</p><p>2. こうして私たちは後で、高価な宝石よりも尊く、金よりも精錬された彼の骨を拾い集め、ふさわしい場所に納めました[62]。</p><p>3. 私たちが力の及ぶかぎりそこに集まり、喜びと楽しみのうちに、彼の殉教の日を誕生日として祝うこと[63]を、主はかなえてくださるでしょう。それは、すでに戦い終えた人々を記念し、これから戦う人々を鍛え備えるためです。</p>
      <h2>19</h2><p>1. 祝福されたポリュカルポスについては以上のとおりです。彼はフィラデルフィアから来た人々と共に、スミルナで殉教した十二人目の者でした[64]が、ただ彼だけがすべての人に記憶され、異邦人さえ至る所で彼のことを語るほどです。彼は名高い教師であっただけでなく、際立った殉教者でもありました。キリストの福音にかなって成し遂げられた彼の殉教に、すべての人が倣いたいと願っています。</p><p>2. 彼は忍耐によって不正な支配者に打ち勝ち、こうして朽ちない冠を受けて、使徒たちとすべての義人たちと共に喜び、神であり父である方に栄光を帰し、私たちの主イエス・キリストをほめたたえています[65]。この方は私たちの魂の救い主、私たちの体の舵取り、全世界の公の教会の牧者です[66]。</p>
      <h2>20</h2><p>1. あなたがたは、起こったことをもっと詳しく知らせてほしいと求めました。しかし私たちは今のところ、私たちの兄弟マルキオン[67]によって要点だけをお知らせします。これを知ったら、この手紙をさらに遠くの兄弟たちにも送り届けてください。それは彼らもまた、ご自分の僕たちの中から選びをなさる主をたたえるためです。</p><p>2. その恵みと賜物とによって、私たちすべてを永遠の御国に導き入れることのできる方に、その子（パイス）、独り子イエス・キリストを通して、栄光と誉れと力と偉大さが世々限りなくありますように[68]。すべての聖なる者たちによろしく伝えてください。私たちと共にいる者たちが、あなたがたによろしくと言っています。この手紙を書いたエウアレストス[69]も、家族一同と共によろしくと言っています。</p>
      <h2>21</h2><p>祝福されたポリュカルポスが殉教したのは、クサンティコスの月の初めの二日、すなわち三月のカレンダエの七日前[70]、大いなる安息日、第八時[71]のことでした。彼が捕らえられたのはヘロデによってであり、それは大祭司[72]がトラレスのフィリッポス、総督がスタティウス・クアドラトゥス[73]の時であり、永遠に王として治めておられるのはイエス・キリストです。この方に、栄光と誉れと偉大さと永遠の王座とが、代々にわたってありますように。アーメン。</p>
      <h2>22</h2><p>1. 兄弟たち、イエス・キリストの福音の言葉に従って歩み、あなたがたが健やかであるよう祈ります。この方と共に、聖なる選ばれた者たちの救いのために、父なる神と聖霊とに栄光がありますように。祝福されたポリュカルポスが殉教したように、私たちもイエス・キリストの御国で、彼の足跡に従う者として見いだされますように[74]。</p><p>2. これは、ポリュカルポスの弟子エイレナイオスの写本から、エイレナイオスと共に暮らしたことのあるガイオスが書き写したものです。そして私ソクラテスが、コリントでガイオスの写本から書き写しました。恵みがすべての人と共にありますように。</p><p>3. さらに私ピオニオス[75]が、先の写本から書き写しました。後で明らかにするように、祝福されたポリュカルポスが啓示によって示してくれたので、私はこれを探し求め、時を経てほとんど朽ちかけていたものを集めたのです。主イエス・キリストが私をも、ご自分の選ばれた者たちと共に天の御国に集めてくださいますように。この方に、父と聖霊と共に、栄光が世々限りなくありますように。アーメン。</p>
      <h2>モスクワ写本による結び</h2><p>1. これは、エイレナイオスの著作から、エイレナイオスと共に暮らしたことのあるガイオスが書き写したものです。エイレナイオスは聖ポリュカルポスの弟子でした[76]。</p><p>2. このエイレナイオスは、主教ポリュカルポスが殉教した頃ローマにいて、多くの人々を教えました。彼の著作は数多く伝わっており、どれも非常に優れた、きわめて正しいものです。その中で彼はポリュカルポスについて、彼から学んだと述べています。</p><p>3. 彼はあらゆる異端を十分に論駁し、聖人から受け継いだとおりに、教会の公なる規範を伝えました。彼はまた、こういうことも語っています。いつか、マルキオン派と呼ばれる人々の祖であるマルキオンが、聖ポリュカルポスに出会って「ポリュカルポスよ、私たちを認めよ」と言ったとき、彼はマルキオンに言いました。「認めるとも。サタンの長子だと認める」[77]。</p><p>4. エイレナイオスの著作には、次のことも記されています。ポリュカルポスがスミルナで殉教したその日その時刻に、ローマの町にいたエイレナイオスは、ラッパのような声が「ポリュカルポスは殉教した」と言うのを聞いたというのです。</p><p>5. こうして、すでに述べたように、エイレナイオスのこれらの著作からガイオスが書き写し、ガイオスの写本からイソクラテスがコリントで書き写しました。そして私ピオニオスが、聖ポリュカルポスの啓示によってそれを探し求め、イソクラテスの写本から再び書き写しました。時を経てほとんど朽ちかけていたものを集めたのです。主イエス・キリストが私をも、ご自分の選ばれた者たちと共に天上の御国に集めてくださいますように。この方に、父と子と聖霊と共に、栄光が世々限りなくありますように。アーメン。</p>
    references: |-
      <ol><li><p>この手紙は、ポリュカルポスの殉教（155年または156年の2月23日）の後まもなく、スミルナの教会が書き送ったものです。殉教者の最期を伝える記録としては、聖書以外で最も古いものです。カイサリアのエウセビオスは、その大部分を『教会史』4巻15章に引用しています。スミルナ（現在のトルコのイズミル）はアジア州の港町で、ヨハネの黙示録の七つの教会の一つです（<a href="https://bibleox.com/ja/jp-ni/otkr/2/#L8-11">黙. 2:8-11</a>）。</p></li><li><p>フィロメリオンは、フリギアの町（現在のトルコのアクシェヒル）で、スミルナから東に約400キロの所にありました。この教会がスミルナの教会に、殉教の詳しい知らせを求めていたのです（20:1）。</p></li><li><p>καθολικὴ ἐκκλησία —「公なる（普遍の）教会」。この言葉はイグナティオスの手紙に初めて現れます（<a href="https://bibleox.com/ja/ja/w/Ig1S_スミルナの教会への手紙#HH-8">『スミルナの教会への手紙』8:2</a>）。ここでは全世界に広がる教会という意味です。異端の集まりに対して「正しい教会」という意味でも使われます（16:2 参照）。</p></li><li><p>μαρτυρία —「証し」。もとは法廷で証言することを指す言葉ですが、この時代にはすでに、血を流してキリストを証しすること、すなわち「殉教」を意味するようになっていました。「殉教者」（μάρτυς）ももとは「証人」の意味です。</p></li><li><p>「福音にかなう殉教」とは、主キリストの受難に似た殉教のことです。この手紙は、ポリュカルポスの最期と主の受難との共通点を繰り返し指摘しています（身内の裏切り 6:2、ヘロデという名の役人 6:2、強盗に向かうように 7:1、ろばに乗って町へ 8:1、など）。また自分から名乗り出ることを戒めています（<a href="#HH-4">4章</a>）。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/fil/2/#L4">フィリ. 2:4</a> 参照。</p></li><li><p>「肉体を離れていた」（直訳は「肉体から旅立っていた」）。<a href="https://bibleox.com/ja/jp-ni/2kor/5/#L8">２コリ. 5:8</a> 参照。</p></li><li><p>本サイトのギリシア語本文の読みです。ほかの写本と多くの校訂本では「永遠の刑罰から自分を買い戻した」となっています（ロシア語訳もこれに従っています）。どちらの読みでも、一時の苦しみと永遠とが対比されています。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/1kor/2/#L9">１コリ. 2:9</a> 参照。</p></li><li><p>κήρυκες — とげのある巻き貝。拷問の道具として使われました。</p></li><li><p>原文では主語が明示されていませんが、文脈から、悪魔（3:1）または総督を指すと考えられます。</p></li><li><p>「すべての者に打ち勝つことはできなかった」とも「だれにも打ち勝つことはできなかった」とも読める表現です。すぐ後でクイントスの否認が語られるので（4章）、前者の意味に訳しました。</p></li><li><p>ἀνθύπατος —「総督（プロコンスル）」。元老院が治める属州の長官で、アジア州の総督はこのときスタティウス・クアドラトゥスでした（<a href="#HH-21">21章</a>）。</p></li><li><p>獣に飛びかからせることで、早く世を去ろうとしたのです。イグナティオスも、獣が自分をすぐに食い尽くしてくれるようにと願っています（<a href="https://bibleox.com/ja/ja/w/Ig1R_ローマの教会への手紙#HH-5">『ローマの教会への手紙』5:2</a>）。</p></li><li><p>キリスト者は、ローマの神々も皇帝も拝まなかったので、異教徒から「無神論者（アテオイ）」と呼ばれました。</p></li><li><p>主は迫害のときに逃げるよう教えられました（<a href="https://bibleox.com/ja/jp-ni/mf/10/#L23">マタ. 10:23</a>）。主ご自身も、時が来るまでは身を避けられました（<a href="https://bibleox.com/ja/jp-ni/in/7/#L1">ヨハ. 7:1</a>）。古代の教会は、自分から進んで役人に名乗り出ることを戒め、捕らえられるのを待つべきだと考えました。クイントスの故郷フリギアからは、少し後に、殉教を求めて熱狂したモンタノス派が起こっています。</p></li><li><p>ポリュカルポスが少し前までいた、最初の農園に来たのです。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/mf/10/#L36">マタ. 10:36</a> 参照。</p></li><li><p>εἰρήναρχος —「平和を守る長官」。町の治安を受け持つ役人で、犯罪人を捕らえ、尋問して、総督の前に引き出すのが務めでした。</p></li><li><p>主の受難のときのヘロデ王と同じ名を「割り当てられていた」（κεκληρωμένος、「くじで得た」）と言い、ここにも主の受難との符合を見ています。</p></li><li><p>παρασκευή —「準備の日」。安息日の前日、すなわち金曜日のことで、主が十字架につけられた曜日でもあります。</p></li><li><p>διωγμῖται —「追跡する者」。町の治安を守る、警察長官の配下の者たちです。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/mf/26/#L55">マタ. 26:55</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/act/21/#L14">使. 21:14</a>、<a href="https://bibleox.com/ja/jp-ni/mf/6/#L10">マタ. 6:10</a> 参照。</p></li><li><p>敵をもてなすことについて <a href="https://bibleox.com/ja/jp-ni/4ts/6/#L22">王下. 6:22</a>、<a href="https://bibleox.com/ja/jp-ni/rim/12/#L20">ロマ. 12:20</a> 参照。</p></li><li><p>モスクワ写本では「東を向いて立って」となっています。古代のキリスト者は立って、東を向いて祈るのが習わしでした。</p></li><li><p>主のエルサレム入城と比べています（<a href="https://bibleox.com/ja/jp-ni/mf/21/#L2-7">マタ. 21:2-7</a>）。</p></li><li><p>「大いなる安息日」が何を指すかははっきりしません。主の受難のときの安息日（<a href="https://bibleox.com/ja/jp-ni/in/19/#L31">ヨハ. 19:31</a>）との符合を示しているとも、ユダヤ教の何らかの祭りの日、あるいは過越祭の前の安息日を指しているとも考えられています（21章も参照）。</p></li><li><p>καροῦχα — 屋根のある上等の馬車で、高官や婦人が乗るものでした。</p></li><li><p>κύριος —「主」。異教徒にとって、皇帝を「主」（ドミヌス）と呼ぶことは当然の礼儀でしたが、キリスト者にとっては、主はただ一人、イエス・キリストです（<a href="https://bibleox.com/ja/jp-ni/1kor/8/#L5-6">１コリ. 8:5-6</a>、<a href="https://bibleox.com/ja/jp-ni/1kor/12/#L3">１コリ. 12:3</a>、<a href="https://bibleox.com/ja/jp-ni/fil/2/#L11">フィリ. 2:11</a>）。ギリシア語訳の旧約聖書では、「主」という言葉は神の名を表しています。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/nav/1/#L6-9">ヨシュ. 1:6-9</a>、<a href="https://bibleox.com/ja/jp-ni/vtor/31/#L6-7">申. 31:6-7</a> 参照。</p></li><li><p>τύχη —「運、幸運」。皇帝の守護霊（ゲニウス）と同一視され、これにかけて誓うことは皇帝を神として礼拝することを意味しました。</p></li><li><p>総督は、キリスト者を「無神論者」と呼んで否認させようとしましたが、ポリュカルポスは同じ言葉を、群衆、すなわちまことの神を知らない異教徒たちに向けて言ったのです。</p></li><li><p>ポリュカルポスは86歳であったか、少なくとも幼児洗礼を受けてから86年たっていたと考えられます。ここから、彼の生年は69/70年頃と推定されています。</p></li><li><p>総督は、民衆の怒りに引きずられながらも、ポリュカルポスを救おうとしています。主を赦そうとしたピラトとよく似ています。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/rim/13/#L1-7">ロマ. 13:1-7</a>、<a href="https://bibleox.com/ja/jp-ni/1pet/2/#L13-17">１ペト. 2:13-17</a>、<a href="https://bibleox.com/ja/jp-ni/tit/3/#L1">テト. 3:1</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/mf/25/#L41">マタ. 25:41</a>、<a href="https://bibleox.com/ja/jp-ni/2sol/1/#L8-9">２テサ. 1:8-9</a> 参照。</p></li><li><p>ステファノの顔が天使の顔のように見えたことと比べています（<a href="https://bibleox.com/ja/jp-ni/act/6/#L15">使. 6:15</a>）。</p></li><li><p>本サイトのギリシア語本文の読みです。モスクワ写本とエウセビオスでは「アジアの教師」となっています（ロシア語訳はこちらに従っています）。</p></li><li><p>ἀσιάρχης —「アシアルケース」。アジア州の諸都市の連合を代表し、皇帝礼拝をつかさどり、見せ物や競技を主催した高官です（使徒言行録19:31にも出てきます）。21章では「大祭司」と呼ばれています。</p></li><li><p>人々は彼の体に触れて、祝福を受けようとしたのです。</p></li><li><p>ἐκεκόσμητο —「飾られていた」。この動詞 κοσμέω には「敬う、とくに死者に礼を尽くす」という意味もあります。ここでは、ポリュカルポスが生前からあらゆる徳で飾られ、そのために信徒たちにあらゆる誉れをもって敬われていたことを言っています。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/gen/22/#L13">創. 22:13</a>、<a href="https://bibleox.com/ja/jp-ni/rim/12/#L1">ロマ. 12:1</a> 参照。</p></li><li><p>παῖς —「子」とも「僕（しもべ）」とも訳せる語です。使徒言行録で、主イエスは「聖なる僕」と呼ばれています（<a href="https://bibleox.com/ja/jp-ni/act/4/#L27">使. 4:27</a>、<a href="https://bibleox.com/ja/jp-ni/act/4/#L30">使. 4:30</a>）。この祈りは古代の聖体礼儀の祈りとよく似た言葉づかいをしています。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/mf/20/#L22-23">マタ. 20:22-23</a>、<a href="https://bibleox.com/ja/jp-ni/mk/10/#L38-39">マコ. 10:38-39</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/in/5/#L29">ヨハ. 5:29</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/evr/4/#L14">ヘブ. 4:14</a>、<a href="https://bibleox.com/ja/jp-ni/evr/7/#L24-26">ヘブ. 7:24-26</a> 参照。ポリュカルポスはフィリピの教会への手紙でもキリストを「永遠の大祭司」と呼んでいます（<a href="https://bibleox.com/ja/ja/w/Pk1F_フィリピの教会への手紙#HH-12">『フィリピの教会への手紙』12:2</a>）。</p></li><li><p>モスクワ写本とエウセビオスの読みです。ほかの写本では「この方と共に、あなたと聖霊とに栄光が」となっています。</p></li><li><p>パンにたとえていることに、聖体（エウカリスティア）への暗示を見る研究者もいます。イグナティオスも、自分が獣の歯にひかれて「キリストの清いパン」となることを願いました（<a href="https://bibleox.com/ja/ja/w/Ig1R_ローマの教会への手紙#HH-4">『ローマの教会への手紙』4:1</a>）。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/pr/17/#L3">箴. 17:3</a>、<a href="https://bibleox.com/ja/jp-ni/1pet/1/#L7">１ペト. 1:7</a> 参照。また、炉の中で守られた三人の若者の話も思い起こさせます（<a href="https://bibleox.com/ja/jp-ni/dan/3/#L19-27">ダニ. 3:19-27</a>）。</p></li><li><p>キリストの香りについて <a href="https://bibleox.com/ja/jp-ni/2kor/2/#L15">２コリ. 2:15</a> 参照。</p></li><li><p>κομφέκτωρ — ラテン語 confector から来た語で、競技場で、死にきれなかった人や獣にとどめを刺す役人のことです。</p></li><li><p>「鳩」はエウセビオスの引用にはありません。後の時代に加えられた言葉か、別の語（たとえば「（短剣の）柄のあたりから」περὶ στύρακα）が写し誤られたものと考える研究者が多くいます。</p></li><li><p>主のわき腹から血と水が流れ出たことと比べています（<a href="https://bibleox.com/ja/jp-ni/in/19/#L34">ヨハ. 19:34</a>）。</p></li><li><p>ここで「公の教会」は、全世界の教会という意味だけでなく、異端の集まりに対する正しい教会、すなわち正統の教会という意味でも使われています。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/1kor/9/#L25">１コリ. 9:25</a>、<a href="https://bibleox.com/ja/jp-ni/2tim/4/#L8">２テモ. 4:8</a>、<a href="https://bibleox.com/ja/jp-ni/iak/1/#L12">ヤコ. 1:12</a> 参照。</p></li><li><p>κοινωνῆσαι τῷ ἁγίῳ αὐτοῦ σαρκίῳ —「彼の聖なる肉にあずかる」。聖なる亡骸を手もとに持ち、それにあずかることを望んだのです。殉教者の遺骸（不朽体）を敬うことについての最も古い証言の一つです（18:2 も参照）。</p></li><li><p>ἄρχων —「長官、支配者」。総督のことを指していると考えられます。</p></li><li><p>主の墓の番をさせるようにピラトに願い出たユダヤ人たちと比べています（<a href="https://bibleox.com/ja/jp-ni/mf/27/#L62-66">マタ. 27:62-66</a>）。</p></li><li><p>キリストには礼拝（προσκυνοῦμεν）を、殉教者たちには愛を、と区別しています。殉教者たちへの崇敬は、キリストへの礼拝と同じものではなく、キリストに倣った人々への愛と尊敬なのです。</p></li><li><p>「真ん中に」が何を意味するのかは、古代からはっきりしませんでした。一部の写本では「火の真ん中に」となっています。遺体を人々の前にさらし、公のものとして取り上げたのだと考える研究者もいます。</p></li><li><p>殉教者の不朽体を敬うことについての、最も古い証言です。</p></li><li><p>γενέθλιος ἡμέρα —「誕生日」。殉教者の死の日を、天における新しい命の誕生の日として、毎年記念することについての最も古い証言です。教会は今も、聖人の記憶日をその人の永眠の日に祝っています。</p></li><li><p>フィラデルフィアは、スミルナの東にあるアジア州の町です。このとき殉教した十二人のうち、多くがフィラデルフィアの人々だったと考えられます。</p></li><li><p>ロシア語訳が底本とした写本では「全能の、神であり父である方」となっています。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/1pet/2/#L25">１ペト. 2:25</a> 参照。</p></li><li><p>この手紙を書いた（口述した）人です。2世紀の異端者マルキオンとは別人です。ラテン語訳では「マルキアノス」、一部の写本では「マルコス」となっています。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/iud/1/#L24-25">ユダ. 1:24-25</a> 参照。</p></li><li><p>エウアレストスは、マルキオンの言葉を書き取った筆記者と考えられます。</p></li><li><p>マケドニア暦のクサンティコスの月の二日は、ローマ暦の三月のカレンダエ（一日）の七日前、すなわち2月23日に当たります。この日は今も、正教会でポリュカルポスの記憶日です（新暦3月8日）。写本によっては「五月の」「四月の」となっています。年は155年または156年と考えられています。</p></li><li><p>今の午後二時頃です。モスクワ写本では、主の十字架上の死の時刻に合わせて「第九時」となっています（<a href="https://bibleox.com/ja/jp-ni/mf/27/#L46">マタ. 27:46</a>）。</p></li><li><p>アジア州の皇帝礼拝をつかさどる大祭司で、12:2 のアジア州祭司長と同じ人です。</p></li><li><p>ルキウス・スタティウス・クアドラトゥス。碑文などから、154–156年頃にアジア州の総督であったことが知られています。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/1pet/2/#L21">１ペト. 2:21</a> 参照。</p></li><li><p>スミルナの司祭であった殉教者ピオニオス（250年殉教）の名で、4世紀に『ポリュカルポス伝』が書かれました。この結びの言葉は、その伝記の作者によるものと考えられています。</p></li><li><p>モスクワ写本（11–13世紀）は、22章の結びの代わりにこの文を伝えています。ここで初めてエイレナイオスとポリュカルポスとの関係が詳しく語られます。</p></li><li><p>エイレナイオス『異端反駁』3巻3章4節（<a href="https://bibleox.com/ja/en/w/irenaeus-against-heresies-b3#HH-3">英語</a>）にも記されています。ポリュカルポス自身も、仮現論者を「サタンの長子」と呼んでいます（<a href="https://bibleox.com/ja/ja/w/Pk1F_フィリピの教会への手紙#HH-7">『フィリピの教会への手紙』7:1</a>）。</p></li></ol>
      <p>翻訳：ロジオン・ヴラソフ（AIツールを併用）。底本：<a href="https://bibleox.com/ja/grc/w/Μαρτύριο_του_Αγίου_Πολυκάρπου_Επισκόπου_Σμύρνης">本サイトのギリシア語本文</a>。参照：ロシア語訳（『初期教会教父選集』ブリュッセル、1988年。注の一部も参考にした）、ライトフット版とホームズ版の英訳。聖書の引用は新共同訳による。</p>
