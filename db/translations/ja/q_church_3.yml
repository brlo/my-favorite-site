    body: |-
      <h2>旧約聖書における十字架の予型</h2><ol><li><p><a href="https://bibleox.com/ru/ru/w/%D0%BF%D1%80%D0%BE%D0%BE%D0%B1%D1%80%D0%B0%D0%B7-%D0%BA%D1%80%D0%B5%D1%81%D1%82%D0%BD%D0%BE%D0%B9-%D0%B6%D0%B5%D1%80%D1%82%D0%B2%D1%8B-%D0%90%D0%B2%D1%80%D0%B0%D0%B0%D0%BC-%D0%B8-%D0%98%D1%81%D0%B0%D0%B0%D0%BA">十字架上のキリストのいけにえ — アブラハムとイサク</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/%D0%BA%D1%80%D0%B5%D1%81%D1%82-%D0%9C%D0%BE%D0%B8%D1%81%D0%B5%D0%B9">十字架 — モーセ</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/%D0%B5%D0%B2%D1%80%D0%B5%D0%B9%D1%81%D0%BA%D0%B8%D0%B9-%D1%81%D1%82%D0%B0%D0%BD-%D0%BA%D1%80%D0%B5%D1%81%D1%82">十字架 — ヘブライ人の宿営</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/%D0%BA%D1%80%D0%B5%D1%81%D1%82-%D0%B8-%D0%BA%D1%80%D0%B5%D1%89%D0%B5%D0%BD%D0%B8%D0%B5-%D0%BF%D0%B5%D1%80%D0%B5%D1%85%D0%BE%D0%B4-%D1%87%D0%B5%D1%80%D0%B5%D0%B7-%D0%BC%D0%BE%D1%80%D0%B5">十字架と洗礼 — 海を渡る</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/%D0%BA%D1%80%D0%B5%D1%81%D1%82-%D0%98%D0%B0%D0%BA%D0%BE%D0%B2">十字架 — ヤコブの祝福</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/EMRx_%D0%9A%D1%80%D0%B5%D1%81%D1%82__%D0%B1%D1%83%D0%BA%D0%B2%D0%B0_%D1%82%D0%B0%D1%83">十字架 — 預言的な幻の中で信じる者の額に記される文字タウ</a></p></li></ol><h2>十字架 — 勝利と和解の道具</h2><blockquote><p>「肉に割礼を受けず、罪の中にいて死んでいたあなたがたを、神はキリストと共に生かしてくださったのです。神は、わたしたちの一切の罪を赦し、規則によってわたしたちを訴えて不利に陥れていた証書を破棄し、<strong>これを十字架に釘付けにして取り除いてくださいました。そして、もろもろの支配と権威の武装を解除し</strong>、<strong>キリストの勝利の列に従えて</strong>、公然とさらしものになさいました」（<a href="https://bibleox.com/ja/jp-ni/kol/2/#L13-15">コロ. 2:13-15</a>）<em>（「キリストの勝利の列に従えて」は、ギリシア語原文では θριαμβεύσας αὐτοὺς ἐν αὐτῷ —「それ（十字架）によって、あるいは御自身において、彼らに凱旋して」です。）</em></p></blockquote><blockquote><p>「<strong>十字架を通して</strong>、両者を一つの体として神と<strong>和解させ、十字架によって敵意を滅ぼされました</strong>」（<a href="https://bibleox.com/ja/jp-ni/ef/2/#L16">エフェ. 2:16</a>）</p></blockquote><blockquote><p>「<strong>その十字架の血によって平和を打ち立て</strong>、地にあるものであれ、天にあるものであれ、万物をただ御子によって、御自分と和解させられました」（<a href="https://bibleox.com/ja/jp-ni/kol/1/#L20">コロ. 1:20</a>）</p></blockquote><h2>十字架は祭壇であり、偉大な聖なるものである</h2><p>主イエス・キリストは、十字架という祭壇の上で、御自身をいけにえとして献げられました。</p><blockquote><p>「キリストも、多くの人の罪を負うためにただ一度身を献げられた」（<a href="https://bibleox.com/ja/jp-ni/evr/9/#L28">ヘブ. 9:28</a>）</p></blockquote><p>このことを裏付けるのが、十字架上のキリストのいけにえの旧約における予型、すなわちイサクの献供です。アブラハム（父）がイサク（独り子）をいけにえとして献げます。</p><blockquote><p>「神は命じられた。『<strong>あなたの息子、あなたの愛する独り子</strong>イサクを連れて、モリヤの地に行きなさい。わたしが命じる山の一つに登り、<strong>彼を焼き尽くす献げ物としてささげなさい</strong>』」（<a href="https://bibleox.com/ja/jp-ni/gen/22/#L2">創. 22:2</a>）</p></blockquote><blockquote><p>「神は、<strong>その独り子をお与えになったほどに</strong>、世を愛された」（<a href="https://bibleox.com/ja/jp-ni/in/3/#L16">ヨハ. 3:16</a>）</p></blockquote><p>イサクは、自分がその上で献げられることになるものを、山へ運び上げます。</p><blockquote><p>「アブラハムは、焼き尽くす献げ物に用いる薪を取って、<strong>息子イサクに背負わせ</strong>、自分は火と刃物を手に持った。二人は一緒に歩いて行った」（<a href="https://bibleox.com/ja/jp-ni/gen/22/#L6">創. 22:6</a>）</p></blockquote><blockquote><p>「こうして、彼らはイエスを引き取った。イエスは、<strong>自ら十字架を背負い</strong>、いわゆる『されこうべの場所』、すなわちヘブライ語でゴルゴタという所へ向かわれた。そこで、彼らはイエスを十字架につけた」（<a href="https://bibleox.com/ja/jp-ni/in/19/#L16-18">ヨハ. 19:16-18</a>）</p></blockquote><h3>アブラハムはイサクを祭壇の上に置いた</h3><blockquote><p>「神がわたしたちの父アブラハムを義とされたのは、<strong>息子のイサクを祭壇の上に献げる</strong>という行いによってではなかったですか」（<a href="https://bibleox.com/ja/jp-ni/iak/2/#L21">ヤコ. 2:21</a>）</p></blockquote><blockquote><p>「このイエスを神は、お定めになった計画により、あらかじめご存じのうえで、あなたがたに引き渡されたのですが、<strong>あなたがたは</strong>律法を知らない者たちの手を借りて、<strong>十字架につけて殺してしまったのです</strong>」（<a href="https://bibleox.com/ja/jp-ni/act/2/#L23">使. 2:23</a>）</p></blockquote><p>十字架の上で、祭壇の上でのように、人類の救いが成し遂げられます。</p><blockquote><p>「<strong>十字架を通して</strong>、両者を一つの体として神と和解させ、<strong>十字架によって敵意を滅ぼされました</strong>」（<a href="https://bibleox.com/ja/jp-ni/ef/2/#L16">エフェ. 2:16</a>）</p></blockquote><h3>祭壇は至聖なるものである</h3><blockquote><p>「七日の間、祭壇のために罪の贖いの儀式を行って、聖別すれば、<strong>祭壇は神聖なものとなる。祭壇に触れるものはすべて、聖なるものとなる</strong>」（<a href="https://bibleox.com/ja/jp-ni/ish/29/#L37">出. 29:37</a>）<em>（「神聖なもの」と訳されている語は、ヘブライ語原文では קֹדֶשׁ קָדָשִׁים —「至聖なるもの（聖の聖）」です。）</em></p></blockquote><h2>福音書</h2><blockquote><p>「イエスは彼を見つめ、慈しんで言われた。『あなたに欠けているものが一つある。行って持っている物を売り払い、貧しい人々に施しなさい。そうすれば、天に富を積むことになる。それから、わたしに従いなさい』」（<a href="https://bibleox.com/ja/jp-ni/mk/10/#L21">マコ. 10:21</a>）<em>（ビザンティン本文（多数派写本）では、最後の言葉は「<strong>十字架を負って</strong>、わたしに従いなさい」〔ἄρας τὸν σταυρόν〕です。正教会の教会スラヴ語訳やロシア語訳もこの読みに従っています。）</em></p></blockquote><blockquote><p>「それから、群衆を弟子たちと共に呼び寄せて言われた。『わたしの後に従いたい者は、自分を捨て、<strong>自分の十字架を背負って</strong>、わたしに従いなさい』」（<a href="https://bibleox.com/ja/jp-ni/mk/8/#L34">マコ. 8:34</a>）</p></blockquote><blockquote><p>「また、<strong>自分の十字架を担って</strong>わたしに従わない者は、わたしにふさわしくない」（<a href="https://bibleox.com/ja/jp-ni/mf/10/#L38">マタ. 10:38</a>）</p></blockquote><blockquote><p>「それから、弟子たちに言われた。『わたしについて来たい者は、自分を捨て、<strong>自分の十字架を背負って</strong>、わたしに従いなさい』」（<a href="https://bibleox.com/ja/jp-ni/mf/16/#L24">マタ. 16:24</a>）</p></blockquote><blockquote><p>「それから、イエスは皆に言われた。『わたしについて来たい者は、自分を捨て、日々、<strong>自分の十字架を背負って</strong>、わたしに従いなさい』」（<a href="https://bibleox.com/ja/jp-ni/lk/9/#L23">ルカ. 9:23</a>）</p></blockquote><blockquote><p>「<strong>自分の十字架を背負って</strong>ついて来る者でなければ、だれであれ、わたしの弟子ではありえない」（<a href="https://bibleox.com/ja/jp-ni/lk/14/#L27">ルカ. 14:27</a>）</p></blockquote><blockquote><p>「言った。『神殿を打ち倒し、三日で建てる者、神の子なら、自分を救ってみろ。そして<strong>十字架から降りて来い</strong>』」（<a href="https://bibleox.com/ja/jp-ni/mf/27/#L40">マタ. 27:40</a>）</p></blockquote><blockquote><p>「『他人は救ったのに、自分は救えない。イスラエルの王だ。<strong>今すぐ十字架から降りるがいい</strong>。そうすれば、信じてやろう』」（<a href="https://bibleox.com/ja/jp-ni/mf/27/#L42">マタ. 27:42</a>）</p></blockquote><blockquote><p>「<strong>十字架から降りて</strong>自分を救ってみろ」（<a href="https://bibleox.com/ja/jp-ni/mk/15/#L30">マコ. 15:30</a>）</p></blockquote><blockquote><p>「メシア、イスラエルの王、<strong>今すぐ十字架から降りるがいい</strong>。それを見たら、信じてやろう。」一緒に十字架につけられた者たちも、イエスをののしった」（<a href="https://bibleox.com/ja/jp-ni/mk/15/#L32">マコ. 15:32</a>）</p></blockquote><h2>使徒</h2><blockquote><p>「信仰の創始者また完成者であるイエスを見つめながら。このイエスは、御自身の前にある喜びを捨て、恥をもいとわないで<strong>十字架の死を耐え忍び</strong>、神の玉座の右にお座りになったのです」（<a href="https://bibleox.com/ja/jp-ni/evr/12/#L2">ヘブ. 12:2</a>）</p></blockquote><blockquote><p>「しかし、このわたしには、わたしたちの<strong>主</strong>イエス・キリストの<strong>十字架</strong>のほかに、<strong>誇るもの</strong>が決してあってはなりません。この十字架によって、世はわたしに対し、わたしは世に対してはりつけにされているのです」（<a href="https://bibleox.com/ja/jp-ni/gal/6/#L14">ガラ. 6:14</a>）</p></blockquote><blockquote><p>「なぜなら、キリストがわたしを遣わされたのは、洗礼を授けるためではなく、福音を告げ知らせるためであり、しかも、<strong>キリストの十字架がむなしいものになってしまわぬように</strong>、言葉の知恵によらないで告げ知らせるためだからです」（<a href="https://bibleox.com/ja/jp-ni/1kor/1/#L17">１コリ. 1:17</a>）</p></blockquote><blockquote><p>「<strong>十字架の言葉は、滅んでいく者にとっては愚かなもの</strong>ですが、わたしたち救われる者には神の力です」（<a href="https://bibleox.com/ja/jp-ni/1kor/1/#L18">１コリ. 1:18</a>）</p></blockquote><blockquote><p>「肉において人からよく思われたがっている者たちが、ただ<strong>キリストの十字架のゆえに迫害されたくない</strong>ばかりに、あなたがたに無理やり割礼を受けさせようとしています」（<a href="https://bibleox.com/ja/jp-ni/gal/6/#L12">ガラ. 6:12</a>）</p></blockquote><blockquote><p>「兄弟たち、このわたしが、今なお割礼を宣べ伝えているとするならば、今なお迫害を受けているのは、なぜですか。そのようなことを宣べ伝えれば、<strong>十字架のつまずき</strong>もなくなっていたことでしょう」（<a href="https://bibleox.com/ja/jp-ni/gal/5/#L11">ガラ. 5:11</a>）</p></blockquote><blockquote><p>「<strong>十字架を通して</strong>、両者を一つの体として神と<strong>和解させ、十字架によって敵意を滅ぼされました</strong>」（<a href="https://bibleox.com/ja/jp-ni/ef/2/#L16">エフェ. 2:16</a>）</p></blockquote><blockquote><p>「何度も言ってきたし、今また涙ながらに言いますが、<strong>キリストの十字架に敵対して歩んでいる者が多いのです</strong>」（<a href="https://bibleox.com/ja/jp-ni/fil/3/#L18">フィリ. 3:18</a>）</p></blockquote><blockquote><p>「<strong>その十字架の血によって平和を打ち立て</strong>、地にあるものであれ、天にあるものであれ、万物をただ御子によって、御自分と和解させられました」（<a href="https://bibleox.com/ja/jp-ni/kol/1/#L20">コロ. 1:20</a>）</p></blockquote><blockquote><p>「規則によってわたしたちを訴えて不利に陥れていた証書を破棄し、<strong>これを十字架に釘付けにして</strong>取り除いてくださいました」（<a href="https://bibleox.com/ja/jp-ni/kol/2/#L14">コロ. 2:14</a>）</p></blockquote>

  - src: заповеди-блаженств
    path: Bt7g_真福九端
    title: 真福九端
    meta_desc: 真福九端（山上の説教の「幸い」）についての聖書の引用
    menu: { parent: "教会", title: "真福九端", priority: 16 }
    body: |-
      <h2>主イエス・キリストが山上の説教で与えられた九つの幸い（真福九端）</h2><ol><li><p>「<strong>心の貧しい人々</strong>は、幸いである、天の国はその人たちのものである」（<a href="https://bibleox.com/ja/jp-ni/mf/5/#L3">マタ. 5:3</a>; <a href="https://bibleox.com/ja/jp-ni/lk/6/#L20">ルカ. 6:20</a>）<em>（「心の貧しい」は、ギリシア語原文では οἱ πτωχοὶ τῷ πνεύματι —「霊において貧しい」、すなわち謙遜な人々です。）</em></p></li><li><p>「<strong>悲しむ人々</strong>は、幸いである、その人たちは慰められる」（<a href="https://bibleox.com/ja/jp-ni/mf/5/#L4">マタ. 5:4</a>; <a href="https://bibleox.com/ja/jp-ni/lk/6/#L21">ルカ. 6:21</a>）</p></li><li><p>「<strong>柔和な人々</strong>は、幸いである、その人たちは地を受け継ぐ」（<a href="https://bibleox.com/ja/jp-ni/mf/5/#L5">マタ. 5:5</a>）</p></li><li><p>「<strong>義に飢え渇く人々</strong>は、幸いである、その人たちは満たされる」（<a href="https://bibleox.com/ja/jp-ni/mf/5/#L6">マタ. 5:6</a>; <a href="https://bibleox.com/ja/jp-ni/lk/6/#L21">ルカ. 6:21</a>; <a href="https://bibleox.com/ja/jp-ni/lk/6/#L25">ルカ. 6:25</a>）</p></li><li><p>「<strong>憐れみ深い人々</strong>は、幸いである、その人たちは憐れみを受ける」（<a href="https://bibleox.com/ja/jp-ni/mf/5/#L7">マタ. 5:7</a>; <a href="https://bibleox.com/ja/jp-ni/lk/6/#L24">ルカ. 6:24</a>）</p></li><li><p>「<strong>心の清い人々</strong>は、幸いである、その人たちは神を見る」（<a href="https://bibleox.com/ja/jp-ni/mf/5/#L8">マタ. 5:8</a>）</p></li><li><p>「<strong>平和を実現する人々</strong>は、幸いである、その人たちは神の子と呼ばれる」（<a href="https://bibleox.com/ja/jp-ni/mf/5/#L9">マタ. 5:9</a>）</p></li><li><p>「<strong>義のために迫害される人々</strong>は、幸いである、天の国はその人たちのものである」（<a href="https://bibleox.com/ja/jp-ni/mf/5/#L10">マタ. 5:10</a>; <a href="https://bibleox.com/ja/jp-ni/lk/6/#L22">ルカ. 6:22</a>）</p></li><li><p>「<strong>わたしのためにののしられ、迫害され、身に覚えのないことであらゆる悪口を浴びせられるとき</strong>、あなたがたは幸いである。喜びなさい。大いに喜びなさい。天には大きな報いがある。あなたがたより前の預言者たちも、同じように迫害されたのである」（<a href="https://bibleox.com/ja/jp-ni/mf/5/#L11-12">マタ. 5:11-12</a>; <a href="https://bibleox.com/ja/jp-ni/lk/6/#L22-23">ルカ. 6:22-23</a>; <a href="https://bibleox.com/ja/jp-ni/lk/6/#L26">ルカ. 6:26</a>）</p></li></ol><h2>そのほかの戒め</h2><ol><li><p>「<strong>敵を愛し</strong>」（<a href="https://bibleox.com/ja/jp-ni/lk/6/#L27">ルカ. 6:27</a>; <a href="https://bibleox.com/ja/jp-ni/mf/5/#L44">マタ. 5:44</a>）</p></li><li><p>「あなたがたを<strong>憎む者に親切にしなさい</strong>」（<a href="https://bibleox.com/ja/jp-ni/lk/6/#L27">ルカ. 6:27</a>; <a href="https://bibleox.com/ja/jp-ni/mf/5/#L44">マタ. 5:44</a>）</p></li><li><p>「<strong>悪口を言う者に祝福を祈り</strong>」（<a href="https://bibleox.com/ja/jp-ni/lk/6/#L28">ルカ. 6:28</a>; <a href="https://bibleox.com/ja/jp-ni/mf/5/#L44">マタ. 5:44</a>）</p></li><li><p>「あなたがたを<strong>侮辱する者のために祈りなさい</strong>」（<a href="https://bibleox.com/ja/jp-ni/lk/6/#L28">ルカ. 6:28</a>; <a href="https://bibleox.com/ja/jp-ni/mf/5/#L44">マタ. 5:44</a>）</p></li><li><p>「あなたの<strong>頬を打つ者</strong>には、もう一方の頬をも<strong>向けなさい</strong>」（<a href="https://bibleox.com/ja/jp-ni/lk/6/#L29">ルカ. 6:29</a>）</p></li><li><p>「上着を<strong>奪い取る者</strong>には、下着をも<strong>拒んではならない</strong>」（<a href="https://bibleox.com/ja/jp-ni/lk/6/#L29">ルカ. 6:29</a>; <a href="https://bibleox.com/ja/jp-ni/mf/5/#L40">マタ. 5:40</a>）</p></li><li><p>「<strong>求める</strong>者には、だれにでも<strong>与えなさい</strong>」（<a href="https://bibleox.com/ja/jp-ni/lk/6/#L30">ルカ. 6:30</a>; <a href="https://bibleox.com/ja/jp-ni/lk/6/#L38">ルカ. 6:38</a>; <a href="https://bibleox.com/ja/jp-ni/mf/5/#L42">マタ. 5:42</a>）</p></li><li><p>「あなたの持ち物を<strong>奪う</strong>者から<strong>取り返そうとしてはならない</strong>」（<a href="https://bibleox.com/ja/jp-ni/lk/6/#L30">ルカ. 6:30</a>）</p></li><li><p>「<strong>人にしてもらいたいと思うことを、人にもしなさい</strong>」（<a href="https://bibleox.com/ja/jp-ni/lk/6/#L31">ルカ. 6:31</a>）</p></li><li><p>「あなたがたの父が憐れみ深いように、あなたがたも<strong>憐れみ深い者となりなさい</strong>」（<a href="https://bibleox.com/ja/jp-ni/lk/6/#L36">ルカ. 6:36</a>）</p></li><li><p>「<strong>人を裁くな</strong>。そうすれば、あなたがたも裁かれることがない」（<a href="https://bibleox.com/ja/jp-ni/lk/6/#L37">ルカ. 6:37</a>）</p></li><li><p>「<strong>人を罪人だと決めるな</strong>。そうすれば、あなたがたも罪人だと決められることがない」（<a href="https://bibleox.com/ja/jp-ni/lk/6/#L37">ルカ. 6:37</a>）</p></li><li><p>「<strong>赦しなさい</strong>。そうすれば、あなたがたも赦される」（<a href="https://bibleox.com/ja/jp-ni/lk/6/#L37">ルカ. 6:37</a>）</p></li><li><p>「<strong>与えなさい</strong>。そうすれば、あなたがたにも与えられる。押し入れ、揺すり入れ、あふれるほどに量りをよくして、ふところに入れてもらえる。あなたがたは自分の量る秤で量り返されるからである」（<a href="https://bibleox.com/ja/jp-ni/lk/6/#L38">ルカ. 6:38</a>）</p></li><li><p>「あなたは、兄弟の目にあるおが屑は見えるのに、なぜ自分の目の中の丸太に気づかないのか。自分の目にある丸太を見ないで、兄弟に向かって、『さあ、あなたの目にあるおが屑を取らせてください』と、どうして言えるだろうか。偽善者よ、<strong>まず自分の目から丸太を取り除け</strong>。そうすれば、はっきり見えるようになって、兄弟の目にあるおが屑を取り除くことができる」（<a href="https://bibleox.com/ja/jp-ni/lk/6/#L41-42">ルカ. 6:41-42</a>）</p></li><li><p>「あなたがたも聞いているとおり、昔の人は『殺すな。人を殺した者は裁きを受ける』と命じられている。しかし、わたしは言っておく。<strong>兄弟に腹を立てる者はだれでも裁きを受ける</strong>。兄弟に『ばか』と言う者は、最高法院に引き渡され、『愚か者』と言う者は、火の地獄に投げ込まれる」（<a href="https://bibleox.com/ja/jp-ni/mf/5/#L21-22">マタ. 5:21-22</a>）<em>（ビザンティン本文（多数派写本）では「<strong>理由なく</strong>（εἰκῇ）兄弟に腹を立てる者」となっています。）</em></p></li><li><p>「だから、あなたが祭壇に供え物を献げようとし、兄弟が自分に反感を持っているのをそこで思い出したなら、その供え物を祭壇の前に置き、<strong>まず行って兄弟と仲直りをし</strong>、それから帰って来て、供え物を献げなさい。あなたを訴える人と一緒に道を行く場合、途中で早く<strong>和解しなさい</strong>。さもないと、その人はあなたを裁判官に引き渡し、裁判官は下役に引き渡し、あなたは牢に投げ込まれるにちがいない。はっきり言っておく。最後の一クァドランスを返すまで、決してそこから出ることはできない」（<a href="https://bibleox.com/ja/jp-ni/mf/5/#L23-26">マタ. 5:23-26</a>）</p></li><li><p>「あなたがたも聞いているとおり、『姦淫するな』と命じられている。しかし、わたしは言っておく。<strong>みだらな思いで他人の妻を見る者はだれでも、既に心の中でその女を犯したのである</strong>」（<a href="https://bibleox.com/ja/jp-ni/mf/5/#L27-28">マタ. 5:27-28</a>）<em>（「他人の妻」と訳されている語は、ギリシア語原文では γυναῖκα —「女」です。）</em></p></li><li><p>「『妻を離縁する者は、離縁状を渡せ』と命じられている。しかし、わたしは言っておく。<strong>不法な結婚でもないのに妻を離縁する者はだれでも、その女に姦通の罪を犯させることになる</strong>。<strong>離縁された女を妻にする者も、姦通の罪を犯すことになる</strong>」（<a href="https://bibleox.com/ja/jp-ni/mf/5/#L31-32">マタ. 5:31-32</a>）<em>（「不法な結婚でもないのに」は、ギリシア語原文では παρεκτὸς λόγου πορνείας —「不品行（淫行）の理由以外で」です。）</em></p></li><li><p>「また、あなたがたも聞いているとおり、昔の人は、『偽りの誓いを立てるな。主に対して誓ったことは、必ず果たせ』と命じられている。しかし、わたしは言っておく。<strong>一切誓いを立ててはならない</strong>。天にかけて誓ってはならない。そこは神の玉座である。地にかけて誓ってはならない。そこは神の足台である。エルサレムにかけて誓ってはならない。そこは大王の都である。また、あなたの頭にかけて誓ってはならない。髪の毛一本すら、あなたは白くも黒くもできないからである。あなたがたは、『然り、然り』『否、否』と言いなさい。それ以上のことは、悪い者から出るのである」（<a href="https://bibleox.com/ja/jp-ni/mf/5/#L33-37">マタ. 5:33-37</a>）</p></li><li><p>「あなたがたも聞いているとおり、『目には目を、歯には歯を』と命じられている。しかし、わたしは言っておく。<strong>悪人に手向かってはならない</strong>。だれかがあなたの右の頬を打つなら、左の頬をも向けなさい。あなたを訴えて下着を取ろうとする者には、上着をも取らせなさい。だれかが、一ミリオン行くように強いるなら、一緒に二ミリオン行きなさい。求める者には与えなさい。あなたから借りようとする者に、背を向けてはならない」（<a href="https://bibleox.com/ja/jp-ni/mf/5/#L38-42">マタ. 5:38-42</a>）</p></li><li><p>「だから、<strong>あなたがたの天の父が完全であられるように、あなたがたも完全な者となりなさい</strong>」（<a href="https://bibleox.com/ja/jp-ni/mf/5/#L48">マタ. 5:48</a>）</p></li></ol>

  - src: отношение-Церкви-к-государству
    path: Sg3p_教会と国家権力との関係
    title: 教会と国家（権力）との関係
    meta_desc: 世俗の（国家の）権力に対する教会の態度についての聖書の引用
    menu: { parent: "教会", title: "教会と国家（権力）との関係", priority: 18 }
    body: |-
      <h2>権力者のための祈り</h2><blockquote><p>「そこで、まず第一に<strong>勧めます</strong>。願いと<strong><mark>祈り</mark></strong>と執り成しと感謝とをすべての人々のためにささげなさい。<strong><mark>王たちやすべての高官のためにも</mark></strong>ささげなさい。わたしたちが常に信心と品位を保ち、平穏で落ち着いた生活を送るためです。これは、わたしたちの救い主である神の御前に良いことであり、喜ばれることです。神は、すべての人々が救われて真理を知るようになることを望んでおられます」（<a href="https://bibleox.com/ja/jp-ni/1tim/2/#L1-4">１テモ. 2:1-4</a>）</p></blockquote><h2>国家の権力への服従</h2><blockquote><p>「人々に、次のことを思い起こさせなさい。<strong><mark>支配者や権威者に服し、これに従い</mark></strong>、すべての善い業を行う用意がなければならないこと、また、だれをもそしらず、争いを好まず、寛容で、すべての人に<strong>心から優しく</strong>接しなければならないことを」（<a href="https://bibleox.com/ja/jp-ni/tit/3/#L1-2">テト. 3:1-2</a>）</p></blockquote><blockquote><p>「<strong>主のために、<mark>すべて人間の立てた制度に従いなさい</mark></strong>。それが、<strong><mark>統治者</mark></strong>としての<strong><mark>皇帝</mark></strong>であろうと、あるいは、悪を行う者を処罰し、善を行う者をほめるために、皇帝が派遣した<strong><mark>総督</mark></strong>であろうと、服従しなさい」（<a href="https://bibleox.com/ja/jp-ni/1pet/2/#L13-14">１ペト. 2:13-14</a>）</p></blockquote><blockquote><p>「すべての人を敬い、兄弟を愛し、神を畏れ、<strong><mark>皇帝を敬いなさい</mark></strong>。召し使いたち、心からおそれ敬って<strong>主人に従いなさい</strong>。<strong>善良で寛大な主人にだけでなく、無慈悲な主人にもそうしなさい</strong>。不当な苦しみを受けることになっても、神がそうお望みだとわきまえて苦痛を耐えるなら、<strong>それは御心に適うことなのです</strong>」（<a href="https://bibleox.com/ja/jp-ni/1pet/2/#L17-19">１ペト. 2:17-19</a>）</p></blockquote><blockquote><p>「パウロは言った。『兄弟たち、その人が大祭司だとは知りませんでした。確かに<strong><mark>「あなたの民の指導者を悪く言うな」</mark></strong>と書かれています』」（<a href="https://bibleox.com/ja/jp-ni/act/23/#L5">使. 23:5</a>）</p></blockquote><blockquote><p>「ソドムやゴモラ、またその周辺の町は、この天使たちと同じく、みだらな行いにふけり、不自然な肉の欲の満足を追い求めたので、永遠の火の刑罰を受け、見せしめにされています。しかし、同じようにこの夢想家たちも、身を汚し、<strong><mark>権威を認めようとはせず、栄光ある者たちをあざけるのです</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/iud/1/#L7-8">ユダ. 1:7-8</a>）</p></blockquote><p>神に由来しない権威はなく、今ある権威は神によって立てられたものである — <strong>使徒は、異教の祭儀のあるローマ帝国に生きながら、こう言っています</strong>。</p><blockquote><p>「<strong>人は皆、上に立つ権威に従うべきです</strong>。<strong>神に由来しない権威はなく</strong>、<strong><mark>今ある権威はすべて神によって立てられたものだからです</mark></strong>。従って、権威に逆らう者は、神の定めに背くことになり、背く者は自分の身に裁きを招くでしょう。実際、支配者は、善を行う者にはそうではないが、悪を行う者には恐ろしい存在です。あなたは権威者を恐れないことを願っている。それなら、善を行いなさい。そうすれば、権威者からほめられるでしょう。権威者は、あなたに善を行わせるために、<strong>神に仕える者なのです</strong>。しかし、もし悪を行えば、恐れなければなりません。権威者はいたずらに剣を帯びているのではなく、<strong>神に仕える者として、悪を行う者に怒りをもって報いるのです</strong>。だから、怒りを逃れるためだけでなく、良心のためにも、<strong>これに従うべきです</strong>」（<a href="https://bibleox.com/ja/jp-ni/rim/13/#L1-5">ロマ. 13:1-5</a>）</p></blockquote><p>キリストは、ピラトの権限が上から与えられたものであることを指摘されます。</p><blockquote><p>「イエスは答えられた。『<strong><mark>神から与えられていなければ、わたしに対して何の権限もないはずだ</mark></strong>。だから、わたしをあなたに引き渡した者の罪はもっと重い』」（<a href="https://bibleox.com/ja/jp-ni/in/19/#L11">ヨハ. 19:11</a>）<em>（「神から」は、ギリシア語原文では ἄνωθεν —「上から」です。）</em></p></blockquote><h2>国家の権力に従うことの限界</h2><blockquote><p>「しかし、ペトロとヨハネは答えた。『<strong>神に従わないであなたがたに従うことが、神の前に正しいかどうか</strong>、考えてください』」（<a href="https://bibleox.com/ja/jp-ni/act/4/#L19">使. 4:19</a>）</p></blockquote><blockquote><p>「ペトロとほかの使徒たちは答えた。『<strong>人間に従うよりも、神に従わなくてはなりません</strong>』」（<a href="https://bibleox.com/ja/jp-ni/act/5/#L29">使. 5:29</a>）</p></blockquote><h2>税</h2><blockquote><p>「<strong>あなたがたが貢を納めているのも</strong>そのためです。権威者は神に仕える者であり、そのことに励んでいるのです。<strong>すべての人々に対して自分の義務を果たしなさい。貢を納めるべき人には貢を納め、税を納めるべき人には税を納め、恐るべき人は恐れ、敬うべき人は敬いなさい</strong>」（<a href="https://bibleox.com/ja/jp-ni/rim/13/#L6-7">ロマ. 13:6-7</a>）</p></blockquote><h2>旧約聖書</h2><blockquote><p>「<strong>わが子よ、主を、そして王を、畏れよ</strong>。変化を求める者らと関係を持つな」（<a href="https://bibleox.com/ja/jp-ni/pr/24/#L21">箴. 24:21</a>）</p></blockquote><h3>神は異国の王たちを罰のために「雇われる」</h3><blockquote><p>「<strong>主は、あなたとあなたの民と父祖の家の上に</strong>、エフライムがユダから分かれて以来、臨んだことのないような日々を臨ませる。<strong>アッシリアの王がそれだ</strong>。&lt;…&gt; その日には、<strong><mark>わたしの主は大河のかなたでかみそりを雇われる</mark>。アッシリアの王がそれだ</strong>。頭髪も足の毛もひげもそり落とされる」（<a href="https://bibleox.com/ja/jp-ni/is/7/#L17,20">イザ. 7:17,20</a>）</p></blockquote><h3>神はユダヤの民に、バビロンの王ネブカドネツァルに従うよう命じられる</h3><blockquote><p>「今やわたしは、<strong>これらの国を、すべて<mark>わたしの僕</mark>バビロンの王ネブカドネツァルの手に与え</strong>、野の獣までも彼に与えて仕えさせる。諸国民はすべて彼とその子と、その孫に仕える。しかし、彼の国にも終わりの時が来れば、多くの国々と大王たちが彼を奴隷にするであろう。<strong>バビロンの王ネブカドネツァルに仕えず、バビロンの王の軛を首に負おうとしない国や王国があれば、<mark>わたしは剣</mark>、飢饉、疫病<mark>をもってその国を罰する</mark>、と主は言われる。<mark>最後には彼の手をもって滅ぼす</mark></strong>。あなたたちは、預言者、占い師、夢占い、卜者、魔法使いたちに聞き従ってはならない。彼らは、バビロンの王に仕えるべきではないと言っているが、それは偽りの預言である。彼らに従えば、あなたたちは国土を遠く離れることになる。わたしはあなたたちを追い払い、滅ぼす。<strong>しかし、<mark>首を差し出してバビロンの王の軛を負い、彼に仕えるならば、わたしはその国民を国土に残す</mark>、と主は言われる。そして耕作をさせ、そこに住まわせる</strong>。」ユダの王ゼデキヤにも、わたしは同じような言葉をすべて語った。「<strong><mark>首を差し出して、バビロンの王の軛を負い、彼とその民に仕えよ。そうすれば命を保つことができる</mark></strong>。どうして、あなたもあなたの民も、剣、飢饉、疫病などで死んでよいであろうか。主がバビロンの王に仕えようとしない国に宣言されたように、バビロンの王に仕えるな、と言っている預言者たちの言葉に従ってはならない。彼らはあなたたちに偽りの預言をしているのだ」（<a href="https://bibleox.com/ja/jp-ni/ier/27/#L6-14">エレ. 27:6-14</a>）</p></blockquote><p>一方、バビロンの王ネブカドネツァルは、もちろん偶像礼拝者でした（<a href="https://bibleox.com/ja/jp-ni/dan/3/#L1-6">ダニ. 3:1-6</a>）。彼に従うとは、外的な事柄、すなわち土地や富などに対する彼のこの世の権力を認めることを意味しました。ネブカドネツァルがユダヤ人に偶像を拝むよう強い始めたとき、退けられたのは、まさにこの不敬虔な命令でした。</p><blockquote><p>「王は彼らに言った。『シャドラク、メシャク、アベド・ネゴ、<strong>お前たちがわたしの神に仕えず、わたしの建てた金の像を拝まないというのは本当か</strong>』」（<a href="https://bibleox.com/ja/jp-ni/dan/3/#L14">ダニ. 3:14</a>）</p></blockquote><p>彼らは彼を王と認めていますが、従うことは拒みます。</p><blockquote><p>「シャドラク、メシャク、アベド・ネゴはネブカドネツァル王に答えた。『このお定めにつきまして、お答えする必要はございません。わたしたちのお仕えする神は、その燃え盛る炉や<strong><mark>王様</mark></strong>の手からわたしたちを救うことができますし、必ず救ってくださいます。そうでなくとも、御承知ください。<strong><mark>わたしたちは王様の神々に仕えることも</mark>、お建てになった金の像を拝むことも、決していたしません</strong>』」（<a href="https://bibleox.com/ja/jp-ni/dan/3/#L16-18">ダニ. 3:16-18</a>）</p></blockquote><p>そのために彼らは炉に投げ込まれました。</p><blockquote><p>「彼らは上着、下着、帽子、その他の衣服を着けたまま縛られ、<strong>燃え盛る炉に投げ込まれた</strong>。王の命令は厳しく、炉は激しく燃え上がっていたので、噴き出る炎はシャドラク、メシャク、アベド・ネゴを引いて行った男たちをさえ焼き殺した。シャドラク、メシャク、アベド・ネゴの三人は縛られたまま燃え盛る炉の中に落ち込んで行った」（<a href="https://bibleox.com/ja/jp-ni/dan/3/#L21-23">ダニ. 3:21-23</a>）</p></blockquote><p>そして神の天使が、彼らを無傷のまま守りました。</p><blockquote><p>「しかし<strong>主の天使</strong>が、アザリヤと共にいる者たちと一緒に炉の中に降りて来て、火の炎を炉から吹き払い、炉の中を、露を含んだ風が吹き抜けるようにした。<strong>火は彼らにまったく触れず</strong>、彼らを苦しめることも、悩ますこともなかった」（<a href="https://bibleox.com/ja/gr-lxx-byz/dan/3/#L49-50">ダニ. 3:49-50</a>）<em>（この箇所はダニエル書のギリシア語本文にだけ伝えられており、新共同訳の本文にはありません。七十人訳、ギリシア語からの訳。）</em></p></blockquote><p>若者たちが背いたのは、ほかの神々に仕えよという、王のこのただ一つの命令だけでした。</p><blockquote><p>「間もなく王は驚きの色を見せ、急に立ち上がり、側近たちに尋ねた。『あの三人の男は、縛ったまま炉に投げ込んだはずではなかったか。』彼らは答えた。『王様、そのとおりでございます。』&lt;…&gt; <strong>ネブカドネツァル王は言った。『シャドラク、メシャク、アベド・ネゴの神をたたえよ。彼らは<mark>王の命令に背き</mark></strong>、体を犠牲にしても自分の神に依り頼み、<strong><mark>自分の神以外にはいかなる神にも仕えず、拝もうともしなかったので</mark></strong>、この僕たちを、神は御使いを送って救われた。わたしは命令する。いかなる国、民族、言語に属する者も、シャドラク、メシャク、アベド・ネゴの神をののしる者があれば、その体は八つ裂きにされ、その家は破壊される。まことに人間をこのように救うことのできる神はほかにはない』」（<a href="https://bibleox.com/ja/jp-ni/dan/3/#L24,28-29">ダニ. 3:24,28-29</a>）</p></blockquote><h3>神は異国の王たちから救われた</h3><blockquote><p>「それゆえ、主はアッシリアの王についてこう言われる。彼がこの都に入城することはない。またそこに矢を射ることも、盾を持って向かって来ることも、都に対して土塁を築くこともない。彼は来た道を引き返し、この都に入城することはない、と主は言われる。<strong>わたしはこの都を守り抜いて救う。わたし自らのために、わが僕ダビデのために</strong>。」その夜、<strong>主の御使いが現れ、アッシリアの陣営で十八万五千人を撃った</strong>。朝早く起きてみると、彼らは皆死体となっていた。アッシリアの王センナケリブは、そこをたって帰って行き、ニネベに落ち着いた」（<a href="https://bibleox.com/ja/jp-ni/4ts/19/#L32-36">王下. 19:32-36</a>）</p></blockquote><h3>罰と救いは、民の敬虔にかかっていた</h3><blockquote><p>「彼らは言った。『<strong>立ち帰って、悪の道と悪事を捨てよ。そうすれば、主がお前たちと先祖に与えられた地に、とこしえからとこしえまで住むことができる。<mark>他の神々に従って行くな。彼らに仕え、ひれ伏してはならない。お前たちの手が造った物でわたしを怒らせるならば、わたしはお前たちに災いをくだす</mark></strong>。』<strong><mark>しかし、お前たちはわたしに従わなかった</mark>、と主は言われる。お前たちは自分の手で造った物をもって、わたしを怒らせ、災いを招いた</strong>。それゆえ、万軍の主はこう言われる。<strong><mark>お前たちがわたしの言葉に聞き従わなかったので</mark></strong>、見よ、わたしはわたしの僕バビロンの王ネブカドレツァルに命じて、北の諸民族を動員させ、彼らにこの地とその住民、および周囲の民を襲わせ、<strong>ことごとく滅ぼし尽くさせる</strong>、と主は言われる。<strong>そこは人の驚くところ、嘲るところ、とこしえの廃虚となる</strong>。わたしは、そこから喜びの声、祝いの声、花婿の声、花嫁の声、挽き臼の音、ともし火の光を絶えさせる。この地は全く廃虚となり、人の驚くところとなる。<strong>これらの民はバビロンの王に七十年の間仕える。七十年が終わると、わたしは、バビロンの王とその民</strong>、またカルデア人の地を<strong>その罪のゆえに罰する</strong>、と主は言われる。そして、そこをとこしえに荒れ地とする」（<a href="https://bibleox.com/ja/jp-ni/ier/25/#L5-12">エレ. 25:5-12</a>）</p></blockquote><blockquote><p>「<strong>あなたの心の願いをかなえ</strong>あなたの計らいを実現させてくださるように」（<a href="https://bibleox.com/ja/jp-ni/ps/20/#L5">詩. 20:5</a>）</p></blockquote>

  - src: отцами_и_учителями_не_называться
    path: Df6c_父や教師と呼ばれてはならない
    title: 「父」「教師」と呼ばれてはならない
    menu: { parent: "教会", title: "「父」「教師」と呼ばれてはならない", priority: 22 }
    body: |-
      <h2>キリストは、教師や父と呼ばれてはならないと命じられる</h2><blockquote><p>「『律法学者たちやファリサイ派の人々は、モーセの座に着いている。&lt;…&gt; そのすることは、すべて人に見せるためである。聖句の入った小箱を大きくしたり、衣服の房を長くしたりする。宴会では上座、会堂では上席に座ることを<strong>好み</strong>、また、広場で挨拶されたり、<strong>『先生』と呼ばれたりすることを好む</strong>。<strong>だが、あなたがたは<mark>『先生』と呼ばれてはならない</mark></strong><em>（ギリシア語 Ῥαββί —「ラビ」、すなわち「わたしの先生」）</em>。あなたがたの師は一人だけで、あとは皆兄弟なのだ。<strong><mark>また、地上の者を『父』と呼んではならない</mark></strong>。あなたがたの父は天の父おひとりだけだ』」（<a href="https://bibleox.com/ja/jp-ni/mf/23/#L2,5-9">マタ. 23:2,5-9</a>）</p></blockquote><p>これは、体の一部を切り取ること（<a href="https://bibleox.com/ja/jp-ni/mf/5/#L29-30">マタ. 5:29-30</a>）や、キリストが平和ではなく剣をもたらし、家族を分けるために来られたということ（<a href="https://bibleox.com/ja/jp-ni/mf/10/#L34-35">マタ. 10:34-35</a>）と同じように、文字どおりの意味で言われているのではありません。ここでは謙遜の教えが与えられています。信じる者たちが「ラビ、ラビ」と呼ばれることを求めず（<a href="https://bibleox.com/ja/jp-ni/mf/23/#L7">マタ. 23:7</a>）、そのような呼び名を受けても高ぶらず、自分を高くせず、最高の権威、まことの父、まことの教師は神であることをわきまえるためです。</p><p>文脈から出発して、意味を正しく理解することが大切です。そうでなければ、子どもさえ自分の親を父と呼べないことになってしまいます。神は戒めの中で親をそう呼んでおられるのに（<a href="https://bibleox.com/ja/jp-ni/vtor/5/#L16">申. 5:16</a>）。同じように、どんな教師も教師と呼ばれてはならないことになりますが、教会には確かに教師がいます。聖書から、これらの言葉が避けられていなかったことがわかります。</p><h2>教師</h2><h3>キリストはファリサイ派のニコデモをイスラエルの教師と呼ばれる</h3><blockquote><p>「イエスは答えて言われた。『<strong><mark>あなたはイスラエルの教師</mark></strong>でありながら、こんなことが分からないのか』」（<a href="https://bibleox.com/ja/jp-ni/in/3/#L10">ヨハ. 3:10</a>）</p></blockquote><h3>使徒は、自分が教師に任命されたと言う</h3><blockquote><p>「この福音のために、<strong><mark>わたしは</mark></strong>宣教者、使徒、<strong><mark>教師</mark></strong>に任命されました」（<a href="https://bibleox.com/ja/jp-ni/2tim/1/#L11">２テモ. 1:11</a>）</p></blockquote><blockquote><p>「この方はすべての人の贖いとして御自身を献げられました。これは定められた時になされた証しです。<strong><mark>わたしは</mark></strong>、その証しのために宣教者また使徒として、すなわち異邦人に信仰と真理を説く<strong><mark>教師</mark></strong>として任命されたのです。わたしは真実を語っており、偽りは言っていません」（<a href="https://bibleox.com/ja/jp-ni/1tim/2/#L6-7">１テモ. 2:6-7</a>）</p></blockquote><h3>神は教会に教師を立てられた</h3><blockquote><p>「<strong><mark>神は</mark>、教会の中にいろいろな人を<mark>お立てになりました</mark></strong>。第一に使徒、第二に預言者、第三に<strong><mark>教師</mark></strong>、次に奇跡を行う者、その次に病気をいやす賜物を持つ者、援助する者、管理する者、異言を語る者などです」（<a href="https://bibleox.com/ja/jp-ni/1kor/12/#L28">１コリ. 12:28</a>）</p></blockquote><blockquote><p>「そして、ある人を使徒、ある人を預言者、ある人を福音宣教者、ある人を牧者、<strong><mark>教師</mark></strong>と<strong><mark>されたのです</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/ef/4/#L11">エフェ. 4:11</a>）</p></blockquote><blockquote><p>「奉仕の賜物を受けていれば、奉仕に専念しなさい。また、<strong><mark>教える人は</mark></strong>教えに」（<a href="https://bibleox.com/ja/jp-ni/rim/12/#L7">ロマ. 12:7</a>）</p></blockquote><blockquote><p>「実際、<strong><mark>あなたがたは今ではもう教師となっているはずなのに</mark></strong>、再びだれかに神の言葉の初歩を教えてもらわねばならず、また、固い食物の代わりに、乳を必要とする始末だからです」（<a href="https://bibleox.com/ja/jp-ni/evr/5/#L12">ヘブ. 5:12</a>）</p></blockquote><h3>教師の責任についての警告</h3><blockquote><p>「わたしの兄弟たち、<strong><mark>あなたがたのうち多くの人が教師になってはなりません</mark>。わたしたち教師がほかの人たちより厳しい裁きを受けることになると、あなたがたは知っています</strong>。わたしたちは皆、度々過ちを犯すからです。言葉で過ちを犯さないなら、それは自分の全身を制御できる完全な人です」（<a href="https://bibleox.com/ja/jp-ni/iak/3/#L1-2">ヤコ. 3:1-2</a>）</p></blockquote><h2>父</h2><h3>使徒は自分を父と呼び、信じる者たちを子と呼ぶ</h3><blockquote><p>「こんなことを書くのは、あなたがたに恥をかかせるためではなく、<strong><mark>愛する自分の子供として</mark></strong>諭すためなのです。キリストに導く養育係があなたがたに一万人いたとしても、<strong><mark><u>父親</u>が大勢いるわけではない。福音を通し、キリスト・イエスにおいてわたしがあなたがたをもうけたのです</mark></strong>。&lt;…&gt; テモテをそちらに遣わしたのは、このことのためです。彼は、<strong><mark>わたしの愛する子</mark></strong>で、主において忠実な者であり、至るところのすべての教会でわたしが教えているとおりに、キリスト・イエスに結ばれたわたしの生き方を、あなたがたに思い起こさせることでしょう」（<a href="https://bibleox.com/ja/jp-ni/1kor/4/#L14-15,17">１コリ. 4:14-15,17</a>）</p></blockquote><blockquote><p>「<strong><mark>わたしの子供たち</mark></strong>、キリストがあなたがたの内に形づくられるまで、わたしは、<strong>もう一度あなたがたを産もうと苦しんでいます</strong>」（<a href="https://bibleox.com/ja/jp-ni/gal/4/#L19">ガラ. 4:19</a>）</p></blockquote><blockquote><p>「<strong><mark>わたしの子たちよ</mark></strong>、これらのことを書くのは、あなたがたが罪を犯さないようになるためです。たとえ罪を犯しても、御父のもとに弁護者、正しい方、イエス・キリストがおられます」（<a href="https://bibleox.com/ja/jp-ni/1in/2/#L1">１ヨハ. 2:1</a>）</p></blockquote><blockquote><p>「<strong><mark>子たちよ</mark></strong>、言葉や口先だけではなく、行いをもって誠実に愛し合おう」（<a href="https://bibleox.com/ja/jp-ni/1in/3/#L18">１ヨハ. 3:18</a>）</p></blockquote><blockquote><p>「<strong><mark>自分の子供たちが</mark></strong>真理に歩んでいると聞くほど、うれしいことはありません」（<a href="https://bibleox.com/ja/jp-ni/3in/1/#L4">３ヨハ. 1:4</a>）</p></blockquote><blockquote><p>「<strong>監禁中にもうけた</strong><strong><mark>わたしの子</mark></strong>オネシモのことで、頼みがあるのです」（<a href="https://bibleox.com/ja/jp-ni/fm/1/#L10">フィレ. 1:10</a>）</p></blockquote><h3>アブラハムは信じる者たちの父である</h3><blockquote><p>「従って、信仰によってこそ世界を受け継ぐ者となるのです。恵みによって、アブラハムのすべての子孫、つまり、単に律法に頼る者だけでなく、彼の信仰に従う者も、確実に約束にあずかれるのです。<strong><mark>彼はわたしたちすべての父です</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/rim/4/#L16">ロマ. 4:16</a>）</p></blockquote><blockquote><p>「だから、<strong>信仰によって生きる人々こそ、アブラハムの子である</strong>とわきまえなさい」（<a href="https://bibleox.com/ja/jp-ni/gal/3/#L7">ガラ. 3:7</a>）</p></blockquote><blockquote><p>「アブラムが九十九歳になったとき、主はアブラムに現れて言われた。『わたしは全能の神である。あなたはわたしに従って歩み、全き者となりなさい。&lt;…&gt; これがあなたと結ぶわたしの契約である。<strong>あなたは多くの国民の<mark>父となる</mark></strong>。あなたは、もはやアブラムではなく、アブラハムと名乗りなさい。<strong>あなたを<mark>多くの国民の父</mark>とするからである</strong>』」（<a href="https://bibleox.com/ja/jp-ni/gen/17/#L1,4-5">創. 17:1,4-5</a>）</p></blockquote><blockquote><p>「アブラハムは、割礼を受ける前に信仰によって義とされた証しとして、割礼の印を受けたのです。こうして彼は、<strong><mark>割礼のないままに信じるすべての人の父となり</mark></strong>、彼らも義と認められました。更にまた、彼は割礼を受けた者の<strong>父</strong>、すなわち、単に割礼を受けているだけでなく、<strong><mark>わたしたちの父</mark></strong>アブラハムが割礼以前に持っていた信仰の模範に従う人々の父ともなったのです。&lt;…&gt; 『<strong><mark>わたしはあなたを多くの民の父と定めた</mark></strong>』と書いてあるとおりです。死者に命を与え、存在していないものを呼び出して存在させる神を、アブラハムは信じ、その御前でわたしたちの父となったのです」（<a href="https://bibleox.com/ja/jp-ni/rim/4/#L11-12,17">ロマ. 4:11-12,17</a>）</p></blockquote><h3>神は父と母についての戒めを与えられる</h3><blockquote><p>「<strong><mark>あなたの父母を敬え</mark></strong>。そうすればあなたは、あなたの神、主が与えられる土地に長く生きることができる」（<a href="https://bibleox.com/ja/jp-ni/ish/20/#L12">出. 20:12</a>）</p></blockquote><blockquote><p>「<strong><mark>あなたの父母を敬え</mark></strong>。<strong>あなたの神、主が命じられたとおりに</strong>。そうすればあなたは、あなたの神、主が与えられる土地に長く生き、幸いを得る」（<a href="https://bibleox.com/ja/jp-ni/vtor/5/#L16">申. 5:16</a>）</p></blockquote><blockquote><p>「『殺すな、姦淫するな、盗むな、偽証するな、奪い取るな、<strong><mark>父母を敬え</mark></strong>』という掟をあなたは知っているはずだ」（<a href="https://bibleox.com/ja/jp-ni/mk/10/#L19">マコ. 10:19</a>）</p></blockquote><blockquote><p>「『<strong><mark>父と母を敬いなさい</mark></strong>。』これは約束を伴う最初の掟です」（<a href="https://bibleox.com/ja/jp-ni/ef/6/#L2">エフェ. 6:2</a>）</p></blockquote><h3>使徒は父たちに呼びかける</h3><blockquote><p>「<strong><mark>父親たち</mark></strong>、子供を怒らせてはなりません。主がしつけ諭されるように、育てなさい」（<a href="https://bibleox.com/ja/jp-ni/ef/6/#L4">エフェ. 6:4</a>）</p></blockquote><blockquote><p>「<strong><mark>父親たち</mark></strong>、子供をいらだたせてはならない。いじけるといけないからです」（<a href="https://bibleox.com/ja/jp-ni/kol/3/#L21">コロ. 3:21</a>）</p></blockquote><blockquote><p>「<strong><mark>父たちよ、わたしがあなたがたに書いているのは</mark></strong>、あなたがたが、初めから存在なさる方を知っているからである。若者たちよ、わたしがあなたがたに書いているのは、あなたがたが悪い者に打ち勝ったからである」（<a href="https://bibleox.com/ja/jp-ni/1in/2/#L13">１ヨハ. 2:13</a>）</p></blockquote><h2>神は、正しい意味で（本性によってではなく恵みによって）、「教師」や「父」だけでなく「神々」と呼ぶことさえ許される</h2><blockquote><p>「わたしは言った『<strong>あなたたちは神々なのか</strong>皆、いと高き方の子らなのか』と。しかし、あなたたちも人間として死ぬ。君侯のように、いっせいに没落する」（<a href="https://bibleox.com/ja/jp-ni/ps/82/#L6-7">詩. 82:6-7</a>）<em>（新共同訳はこれを問いの形に訳していますが、ヘブライ語原文 אֱלֹהִים אַתֶּם も七十人訳 θεοί ἐστε も、「<strong>あなたたちは神々である</strong>」という断言です。キリスト御自身も、次の箇所でこの言葉を断言として引用しておられます。）</em></p></blockquote><blockquote><p>「そこで、イエスは言われた。『あなたたちの律法に、「わたしは言う。<strong>あなたたちは神々である</strong>」と書いてあるではないか。神の言葉を受けた人たちが、「神々」と言われている。そして、聖書が廃れることはありえない』」（<a href="https://bibleox.com/ja/jp-ni/in/10/#L34-35">ヨハ. 10:34-35</a>）</p></blockquote><p>とはいえ、キリストは、わたしたちが自分を僕と呼ぶよう戒めを与えておられます（<a href="https://bibleox.com/ja/jp-ni/lk/17/#L10">ルカ. 17:10</a>）。</p><h2>関連するテーマ</h2><p>キリスト者を神の僕（奴隷）と呼ぶことへの反論について（ロシア語）：<a href="https://bibleox.com/ru/ru/w/%D1%85%D1%80%D0%B8%D1%81%D1%82%D0%B8%D0%B0%D0%BD%D0%B8%D0%BD-%D1%80%D0%B0%D0%B1-%D0%91%D0%BE%D0%B3%D0%B0">キリスト者 — 神の僕</a></p>
