    body: |-
      <h2>神は聖書を通して語られる</h2><blockquote><p>「この福音は、<strong>神が既に聖書の中で預言者を通して</strong>約束されたもので」（<a href="https://bibleox.com/ja/jp-ni/rim/1/#L2">ロマ. 1:2</a>）</p></blockquote><blockquote><p>「兄弟たち、イエスを捕らえた者たちの手引きをしたあのユダについては、<strong>聖霊がダビデの口を通して預言しています</strong>。この<strong>聖書</strong>の言葉は、実現しなければならなかったのです」（<a href="https://bibleox.com/ja/jp-ni/act/1/#L16">使. 1:16</a>）</p></blockquote><blockquote><p>「<strong>聖書はすべて神の霊の導きの下に書かれ</strong>、人を教え、戒め、誤りを正し、義に導く訓練をするうえに有益です」（<a href="https://bibleox.com/ja/jp-ni/2tim/3/#L16">２テモ. 3:16</a>）<em>（「神の霊の導きの下に書かれ」は、ギリシア語原文では θεόπνευστος —「神の息を吹き込まれた」です。）</em></p></blockquote><h2>使徒たちの宣教は神の言葉である</h2><blockquote><p>「サラミスに着くと、ユダヤ人の諸会堂で<strong><mark>神の言葉</mark>を告げ知らせた</strong>。二人は、ヨハネを助手として連れていた」（<a href="https://bibleox.com/ja/jp-ni/act/13/#L5">使. 13:5</a>）</p></blockquote><blockquote><p>「ところが、テサロニケのユダヤ人たちは、ベレアでも<strong>パウロによって<mark>神の言葉</mark>が宣べ伝えられている</strong>ことを知ると、そこへも押しかけて来て、群衆を扇動し騒がせた」（<a href="https://bibleox.com/ja/jp-ni/act/17/#L13">使. 17:13</a>）</p></blockquote><blockquote><p>「このようなわけで、わたしたちは絶えず神に感謝しています。なぜなら、<strong>わたしたちから<mark>神の言葉</mark>を聞いたとき、あなたがたは、それを人の言葉としてではなく、<mark>神の言葉</mark>として受け入れたからです</strong>。事実、それは神の言葉であり、また、信じているあなたがたの中に現に働いているものです」（<a href="https://bibleox.com/ja/jp-ni/1sol/2/#L13">１テサ. 2:13</a>）</p></blockquote><h2>聖書を読めという救い主の戒め</h2><blockquote><p>「あなたたちは聖書の中に永遠の命があると考えて、<strong>聖書を研究している</strong>。ところが、聖書はわたしについて証しをするものだ」（<a href="https://bibleox.com/ja/jp-ni/in/5/#L39">ヨハ. 5:39</a>）<em>（「研究している」と訳されている ἐρευνᾶτε は、ギリシア語では命令形「調べよ」とも読むことができ、古代の教父たちや教会スラヴ語訳はそのように理解しています。）</em></p></blockquote><blockquote><p>「イエスはお答えになった。『<strong>あなたたちは聖書も</strong>神の力も<strong>知らないから、思い違いをしている</strong>』」（<a href="https://bibleox.com/ja/jp-ni/mf/22/#L29">マタ. 22:29</a>; <a href="https://bibleox.com/ja/jp-ni/mk/12/#L24">マコ. 12:24</a>）</p></blockquote><h2>聖書を読むことは救いに有益である</h2><blockquote><p>「また、自分が幼い日から<strong>聖書</strong>に親しんできたことをも知っているからです。<strong>この書物は</strong>、キリスト・イエスへの信仰を通して<strong>救いに導く知恵を、あなたに与えることができます</strong>」（<a href="https://bibleox.com/ja/jp-ni/2tim/3/#L15">２テモ. 3:15</a>）</p></blockquote><h2>聖書が廃れることはありえない</h2><blockquote><p>「聖書が廃れることはありえない」（<a href="https://bibleox.com/ja/jp-ni/in/10/#L35">ヨハ. 10:35</a>）</p></blockquote><h3>聖書は歴史への記念ではなく、今日の人のために書かれた</h3><blockquote><p>「かつて書かれた事柄は、<strong>すべてわたしたちを教え導くためのものです</strong>。それでわたしたちは、聖書から忍耐と慰めを学んで希望を持ち続けることができるのです」（<a href="https://bibleox.com/ja/jp-ni/rim/15/#L4">ロマ. 15:4</a>）</p></blockquote><h2>聖書を理解すること</h2><blockquote><p>「<strong>聖書の預言は何一つ、自分勝手に解釈すべきではない</strong>ということです。なぜなら、預言は、決して人間の意志に基づいて語られたのではなく、人々が<strong>聖霊に導かれて</strong>神からの言葉を語ったものだからです」（<a href="https://bibleox.com/ja/jp-ni/2pet/1/#L20-21">２ペト. 1:20-21</a>）</p></blockquote><h3>使徒たちは聖書を知っていたが、救い主の説明を必要とした</h3><blockquote><p>「そして、モーセとすべての預言者から始めて、<strong>聖書全体にわたり、御自分について書かれていることを説明された</strong>」（<a href="https://bibleox.com/ja/jp-ni/lk/24/#L27">ルカ. 24:27</a>; <a href="https://bibleox.com/ja/jp-ni/lk/24/#L32">24:32</a>）</p></blockquote><h3>神は使徒たちに、聖書を悟る力を与えられた</h3><blockquote><p>「そしてイエスは、<strong>聖書を悟らせるために彼らの心の目を開いて</strong>」（<a href="https://bibleox.com/ja/jp-ni/lk/24/#L45">ルカ. 24:45</a>）</p></blockquote><h3>使徒たちは会堂でユダヤ人に、聖書を正しく理解することを教えた</h3><blockquote><p>「兄弟たちは、直ちに夜のうちにパウロとシラスをベレアへ送り出した。二人はそこへ到着すると、ユダヤ人の会堂に入った。ここのユダヤ人たちは、テサロニケのユダヤ人よりも素直で、非常に熱心に御言葉を受け入れ、<strong>そのとおりかどうか、毎日、聖書を調べていた</strong>」（<a href="https://bibleox.com/ja/jp-ni/act/17/#L10-11">使. 17:10-11</a>）</p></blockquote><h3>聖書のすべてが分かりやすいわけではない。無知な者は聖書を曲解する</h3><blockquote><p>「彼は、どの<strong>手紙</strong>の中でもこのことについて述べています。その手紙には<strong>難しく理解しにくい個所があって</strong>、無学な人や心の定まらない人は、それを聖書のほかの部分と同様に曲解し、自分の滅びを招いています」（<a href="https://bibleox.com/ja/jp-ni/2pet/3/#L16">２ペト. 3:16</a>）</p></blockquote><h3>ユダヤ人アポロは、聖書によってイエスがキリストであることを証明した</h3><blockquote><p>「彼が<strong>聖書に基づいて、メシアはイエスであると公然と立証し</strong>、激しい語調でユダヤ人たちを説き伏せたからである」（<a href="https://bibleox.com/ja/jp-ni/act/18/#L28">使. 18:28</a>）</p></blockquote>

  - src: толкование-писания
    path: Ip7w_聖書の解釈
    title: 聖書の解釈
    title_sub: 聖書を正しく理解することについての聖書の引用
    meta_desc: 聖書を正しく理解することについての聖書の引用
    menu: { parent: "教会/聖書", title: "聖書の解釈", priority: 2 }
    body: |-
      <h2>聖書を読むことは救いに有益である</h2><p>使徒パウロは、聖書を学ぶことが救われる助けになりうると言います。</p><blockquote><p>「また、自分が幼い日から<strong>聖書に親しんできたことをも知っているからです。この書物は</strong>、キリスト・イエスへの信仰を通して<strong>救いに導く知恵を、あなたに与えることができます</strong>」（<a href="https://bibleox.com/ja/jp-ni/2tim/3/#L15">２テモ. 3:15</a>）</p></blockquote><p>しかし、教会による教えがなければ、聖書の誤った解釈は人を滅びに導きかねません。</p><blockquote><p>「それは、わたしたちの愛する兄弟パウロが、神から授かった知恵に基づいて、あなたがたに書き送ったことでもあります。彼は、<strong>どの手紙の中でも</strong>このことについて述べています。その手紙には難しく理解しにくい個所があって、<strong>無学な人や<mark>心の定まらない人</mark></strong><em>（ギリシア語 ἀστήρικτοι —「堅く立てられていない、固められていない」）</em>は、<strong>それを<mark>聖書</mark>のほかの部分と同様に<mark>曲解し、自分の滅びを招いています</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/2pet/3/#L15-16">２ペト. 3:15-16</a>）</p></blockquote><h2>聖書を正しく解釈する必要</h2><h3>聖霊によって書かれたものは、聖霊を担う者によって理解される</h3><p>聖霊に導かれた人々によって書かれたものは、同じ聖霊に導かれた同じような人々によってのみ、正しく理解されます。</p><blockquote><p>「こうして、<strong>わたしたちには、預言の言葉はいっそう確かなものとなっています</strong>。夜が明け、明けの明星があなたがたの心の中に昇るときまで、暗い所に輝くともし火として、<strong>どうかこの預言の言葉に留意していてください</strong>。何よりもまず心得てほしいのは、<strong>聖書の預言は何一つ、自分勝手に解釈すべきではない</strong>ということです。なぜなら、預言は、決して人間の意志に基づいて語られたのではなく、<strong>人々が聖霊に導かれて神からの言葉を語ったものだからです</strong>」（<a href="https://bibleox.com/ja/jp-ni/2pet/1/#L19-21">２ペト. 1:19-21</a>）</p></blockquote><h3>聖書の誤った解釈は滅びに導きかねない</h3><p>教会によって堅く立てられていない無知な人々は、聖書を自分の滅びとなるように解釈します。</p><blockquote><p>「それは、わたしたちの愛する兄弟パウロが、神から授かった知恵に基づいて、あなたがたに書き送ったことでもあります。彼は、<strong>どの手紙の中でも</strong>このことについて述べています。その手紙には難しく理解しにくい個所があって、<strong>無学な人や<mark>心の定まらない人</mark></strong><em>（ギリシア語 ἀστήρικτοι —「堅く立てられていない、固められていない」）</em>は、<strong>それを<mark>聖書</mark>のほかの部分と同様に<mark>曲解し、自分の滅びを招いています</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/2pet/3/#L15-16">２ペト. 3:15-16</a>）</p></blockquote><p>また、聖書を学ぶこと自体も、使徒がすでに自分の宣教によって直接教えたことに対する、一種の付け加えとしてだけ勧められています。</p><blockquote><p>「だがあなたは、<strong>自分が学んで確信したことから離れてはなりません</strong>。あなたは、それをだれから学んだかを知っており、<strong>また*</strong>、自分が幼い日から聖書に親しんできたことをも知っているからです。この書物は、キリスト・イエスへの信仰を通して救いに導く知恵を、あなたに与えることができます」（<a href="https://bibleox.com/ja/jp-ni/2tim/3/#L14-15">２テモ. 3:14-15</a>）</p></blockquote><p><strong>*また</strong> — それまでに述べたことに加えて、という意味です。つまり、聖書の知識は、土台、すなわち使徒から受けた教えに加えるものとして有益だということです。次の節がこの考えを裏付けています。</p><blockquote><p>「<strong>聖書</strong>はすべて神の霊の導きの下に書かれ、<strong>人を教え</strong>、戒め、誤りを正し、義に導く訓練をするうえに<strong>有益です</strong>」（<a href="https://bibleox.com/ja/jp-ni/2tim/3/#L16">２テモ. 3:16</a>）</p></blockquote><p>つまり、聖書はそれだけで独立したものとして立っているのではなく、主教テモテにとって、教え、戒め、誤りを正し、義に導くという働き、すなわち使徒的信仰（聖伝）を<strong>伝える</strong>働きのための有益な道具として役立つのです。</p><blockquote><p>「<strong>教えに適う信頼すべき言葉をしっかり守る人</strong>でなければなりません。そうでないと、健全な教えに従って勧めたり、反対者の主張を論破したりすることもできないでしょう。実は、<strong>不従順な者、無益な話をする者、人を惑わす者が多いのです</strong>。特に割礼を受けている人たちの中に、そういう者がいます。その者たちを沈黙させねばなりません。彼らは恥ずべき利益を得るために、教えてはならないことを教え、数々の家庭を覆しています」（<a href="https://bibleox.com/ja/jp-ni/tit/1/#L9-11">テト. 1:9-11</a>）</p></blockquote><h3>使徒たちはキリストを誤解した</h3><blockquote><p>「弟子たちは向こう岸に行ったが、パンを持って来るのを忘れていた。イエスは彼らに、『ファリサイ派とサドカイ派の人々のパン種によく注意しなさい』と言われた。弟子たちは、『これは、パンを持って来なかったからだ』と論じ合っていた。イエスはそれに気づいて言われた。『信仰の薄い者たちよ、なぜ、パンを持っていないことで論じ合っているのか。<strong>まだ、分からないのか</strong>。覚えていないのか。パン五つを五千人に分けたとき、残りを幾籠に集めたか。また、パン七つを四千人に分けたときは、残りを幾籠に集めたか。<strong>パンについて言ったのではないことが、どうして分からないのか</strong>。ファリサイ派とサドカイ派の人々のパン種に注意しなさい。』そのときようやく、弟子たちは、イエスが注意を促されたのは、パン種のことではなく、ファリサイ派とサドカイ派の人々の教えのことだと悟った」（<a href="https://bibleox.com/ja/jp-ni/mf/16/#L5-12">マタ. 16:5-12</a>）</p></blockquote><h3>エチオピアの宦官は聖書を理解できなかった</h3><blockquote><p>「すると、“霊”がフィリポに、『追いかけて、あの馬車と一緒に行け』と言った。フィリポが走り寄ると、預言者イザヤの書を朗読しているのが聞こえたので、『読んでいることがお分かりになりますか』と言った。宦官は、『<strong>手引きしてくれる人がなければ、どうして分かりましょう</strong>』と言い、馬車に乗ってそばに座るようにフィリポに頼んだ」（<a href="https://bibleox.com/ja/jp-ni/act/8/#L29-31">使. 8:29-31</a>）</p></blockquote><h3>キリストは使徒たちに聖書の預言を説明された</h3><blockquote><p>「そこで、イエスは言われた。『ああ、物分かりが悪く、心が鈍く預言者たちの言ったことすべてを信じられない者たち、メシアはこういう苦しみを受けて、栄光に入るはずだったのではないか。』そして、<strong>モーセとすべての預言者から始めて、聖書全体にわたり、御自分について書かれていることを説明された</strong>」（<a href="https://bibleox.com/ja/jp-ni/lk/24/#L25-27">ルカ. 24:25-27</a>）</p></blockquote><h2>旧約聖書</h2><h3>聖書を解釈する必要</h3><p>旧約では、聖書はただ民の前で読まれただけではなく、祭司エズラがほかの賢者たちと共に、民が理解できるように解釈を加えました。</p><blockquote><p>「書記官エズラは、このために用意された木の壇の上に立ち、その右にマティトヤ、シェマ、&lt;…&gt; 彼らは神の律法の書を翻訳し、<strong>意味を明らかにしながら読み上げたので</strong>、<strong>人々はその朗読を理解した</strong>」（<a href="https://bibleox.com/ja/jp-ni/neem/8/#L4,8">ネヘ. 8:4,8</a>）</p></blockquote>

  - src: Предание
    path: Tr4n_聖伝
    title: 聖伝
    meta_desc: 使徒の教え、すなわち聖伝を厳格に守り、しっかり保つ必要についての聖書の引用
    menu: { parent: "教会/聖書", title: "聖伝", priority: 3 }
    body: |-
      <h2>聖伝とは何か</h2><p>聖伝とは父なる神の啓示です。父はそれを独り子を通して使徒たちに伝え、使徒たちはそれを教会のほかの人々に伝え、教会はそれを言葉（話し言葉と書き言葉）と行いによって、代々伝えていきます。</p><blockquote><p>「なぜなら、<strong>わたしはあなたから受けた言葉を彼らに伝え、彼らはそれを受け入れて</strong>、わたしがみもとから出て来たことを本当に知り、あなたがわたしをお遣わしになったことを信じたからです」（<a href="https://bibleox.com/ja/jp-ni/in/17/#L8">ヨハ. 17:8</a>）</p></blockquote><blockquote><p>「<strong>あなたがたが、何かにつけわたしを思い出し、わたしがあなたがたに伝えたとおりに、伝えられた教えを守っている</strong>のは、立派だと思います」（<a href="https://bibleox.com/ja/jp-ni/1kor/11/#L2">１コリ. 11:2</a>）<em>（「伝えられた教え」と訳されている語は、ギリシア語原文では παραδόσεις —「伝承（聖伝）」です。）</em></p></blockquote><h2>聖伝は書かれた文書だけでなく、信仰を伝える話し言葉でもある</h2><blockquote><p>「このようなわけで、わたしたちは絶えず神に感謝しています。なぜなら、<strong>わたしたちから<mark>神の言葉を聞いた（！）</mark>とき</strong>、あなたがたは、それを人の言葉としてではなく、神の言葉として受け入れたからです。事実、それは神の言葉であり、また、信じているあなたがたの中に現に働いているものです」（<a href="https://bibleox.com/ja/jp-ni/1sol/2/#L13">１テサ. 2:13</a>）</p></blockquote><blockquote><p>「キリスト・イエスによって与えられる信仰と愛をもって、<strong>わたしから聞いた（！）健全な言葉を手本としなさい</strong>」（<a href="https://bibleox.com/ja/jp-ni/2tim/1/#L13">２テモ. 1:13</a>）</p></blockquote><blockquote><p>「そして、多くの証人の面前で<strong>わたしから聞いた（！）こと</strong>を、ほかの人々にも教えることのできる<strong>忠実な人たちにゆだねなさい</strong>」（<a href="https://bibleox.com/ja/jp-ni/2tim/2/#L2">２テモ. 2:2</a>）</p></blockquote><blockquote><p>「ですから、兄弟たち、<strong>しっかり立って</strong>、わたしたちが<strong>説教（！）</strong>や<strong>手紙</strong>で<strong>伝えた教えを固く守り続けなさい</strong>」（<a href="https://bibleox.com/ja/jp-ni/2sol/2/#L15">２テサ. 2:15</a>）<em>（「伝えた教え」は、ギリシア語原文では τὰς παραδόσεις —「伝承（聖伝）」、「説教」は διὰ λόγου —「言葉によって」です。）</em></p></blockquote><blockquote><p>「<strong>初めから聞いていたこと</strong>を、心にとどめなさい。<strong>初めから聞いていた（！）ことが、あなたがたの内にいつもあるならば、あなたがたも御子の内に、また御父の内にいつもいるでしょう</strong>」（<a href="https://bibleox.com/ja/jp-ni/1in/2/#L24">１ヨハ. 2:24</a>）</p></blockquote><blockquote><p>「あなたがたが、<strong>何かにつけわたしを思い出し（！）</strong>、わたしがあなたがたに伝えたとおりに、伝えられた教えを守っているのは、立派だと思います」（<a href="https://bibleox.com/ja/jp-ni/1kor/11/#L2">１コリ. 11:2</a>）</p></blockquote><blockquote><p>「だから、<strong>どのように受け、また聞いた（！）か思い起こして、それを守り抜き</strong>、かつ悔い改めよ。もし、目を覚ましていないなら、わたしは盗人のように行くであろう。わたしがいつあなたのところへ行くか、あなたには決して分からない」（<a href="https://bibleox.com/ja/jp-ni/otkr/3/#L3">黙. 3:3</a>）</p></blockquote><h2>使徒たちは聖伝を用いた</h2><p>使徒は、聖書には名が記されていない二人のエジプトの魔術師の名を挙げています。</p><blockquote><p>「<strong>ヤンネとヤンブレ</strong>がモーセに逆らったように、彼らも真理に逆らっています。彼らは精神の腐った人間で、信仰の失格者です」（<a href="https://bibleox.com/ja/jp-ni/2tim/3/#L8">２テモ. 3:8</a>）</p></blockquote><p>使徒ユダは、聖書にない論争について語っています。</p><blockquote><p>「<strong>大天使ミカエルは、モーセの遺体のことで悪魔と言い争ったとき</strong>、あえてののしって相手を裁こうとはせず、『主がお前を懲らしめてくださるように』と言いました」（<a href="https://bibleox.com/ja/jp-ni/iud/1/#L9">ユダ. 1:9</a>）</p></blockquote><p>聖書にないエノクの言葉について：</p><blockquote><p>「アダムから数えて七代目に当たる<strong>エノク</strong>も、彼らについてこう<strong>預言しました</strong>。『<strong>見よ、主は数知れない聖なる者たちを引き連れて来られる</strong>』」（<a href="https://bibleox.com/ja/jp-ni/iud/1/#L14">ユダ. 1:14</a>）</p></blockquote><p>使徒パウロは、木のうろに隠れた後でのこぎりで引かれた預言者イザヤについて語っています。</p><blockquote><p>「彼らは石で打ち殺され、<strong>のこぎりで引かれ</strong>、剣で切り殺され、羊の皮や山羊の皮を着て放浪し、暮らしに事欠き、苦しめられ、虐待され」（<a href="https://bibleox.com/ja/jp-ni/evr/11/#L37">ヘブ. 11:37</a>）</p></blockquote><p>福音記者ルカは、目撃者たちから聞いた言葉に基づいて福音書を書き記します。つまり、伝承を書き記すのです。</p><blockquote><p>「わたしたちの間で実現した事柄について、<strong>最初から目撃して</strong>御言葉のために働いた人々が<strong>わたしたちに伝えたとおりに</strong>、物語を書き連ねようと、多くの人々が既に手を着けています。そこで、敬愛するテオフィロさま、わたしもすべての事を初めから詳しく調べていますので、順序正しく書いてあなたに献呈するのがよいと思いました」（<a href="https://bibleox.com/ja/jp-ni/lk/1/#L1-3">ルカ. 1:1-3</a>）</p></blockquote><h3>使徒たちは、福音書にない事柄を伝えている</h3><p>使徒パウロは、エフェソの牧者たちとの話の中で、福音書にない救い主キリストの教えを示しています。</p><blockquote><p>「あなたがたもこのように働いて弱い者を助けるように、また、<strong>主イエス御自身が『受けるよりは与える方が幸いである』と言われた</strong>言葉を思い出すようにと、わたしはいつも身をもって示してきました」（<a href="https://bibleox.com/ja/jp-ni/act/20/#L35">使. 20:35</a>）</p></blockquote><p>また、復活したキリストが大勢の人々に現れたことを伝えていますが、これも福音書には書かれていません。</p><blockquote><p>「次いで、<strong>五百人以上もの兄弟たちに同時に現れました</strong>。そのうちの何人かは既に眠りについたにしろ、大部分は今なお生き残っています。次いで、ヤコブに現れ、その後すべての使徒に現れ」（<a href="https://bibleox.com/ja/jp-ni/1kor/15/#L6-7">１コリ. 15:6-7</a>）</p></blockquote><h2>聖伝の大切さ</h2><p>誤った教えは神に導きません。</p><blockquote><p>「だれであろうと、<strong>キリストの教えを越えて、これにとどまらない者は、神に結ばれていません</strong>。その教えにとどまっている人にこそ、御父も御子もおられます」（<a href="https://bibleox.com/ja/jp-ni/2in/1/#L9">２ヨハ. 1:9</a>）</p></blockquote><p>異端（偽りの教え）は神の国を受け継ぎません。</p><blockquote><p>「<strong>仲間争い</strong> &lt;…&gt; 以前言っておいたように、ここでも前もって言いますが、このようなことを行う者は、<strong>神の国を受け継ぐことはできません</strong>」（<a href="https://bibleox.com/ja/jp-ni/gal/5/#L20-21">ガラ. 5:20-21</a>）<em>（「仲間争い」と訳されている語は、ギリシア語原文では αἱρέσεις —「異端」です。）</em></p></blockquote><h2>聖伝の必要性</h2><p>聖書は、イエス・キリストについてのすべての情報の源ではありません。</p><blockquote><p>「このほかにも、イエスは弟子たちの前で、多くのしるしをなさったが、それは<strong>この書物に書かれていない</strong>。これらのことが書かれたのは、あなたがたが、イエスは神の子メシアであると信じるためであり、また、信じてイエスの名により命を受けるためである」（<a href="https://bibleox.com/ja/jp-ni/in/20/#L30-31">ヨハ. 20:30-31</a>）</p></blockquote><blockquote><p>「<strong>イエスのなさったことは、このほかにも、まだたくさんある</strong>。わたしは思う。その一つ一つを書くならば、世界もその書かれた書物を収めきれないであろう」（<a href="https://bibleox.com/ja/jp-ni/in/21/#L25">ヨハ. 21:25</a>）</p></blockquote><p>どの書簡にも、正しく洗礼を授ける方法や、輔祭、司祭、主教を叙聖する方法についての教えはありません。</p><blockquote><p>「だからわたしたちは、死んだ行いの悔い改め、神への信仰、<strong>種々の洗礼についての教え、手を置く儀式</strong>、死者の復活、永遠の審判などの<strong>基本的な教えを学び直すようなことはせず</strong>、キリストの教えの初歩を離れて、成熟を目指して進みましょう」（<a href="https://bibleox.com/ja/jp-ni/evr/6/#L1-2">ヘブ. 6:1-2</a>）</p></blockquote><p>上にすでに示したとおり、使徒たちはある事柄を口頭で伝えることを望みました。</p><blockquote><p>「あなたがたに書くことはまだいろいろありますが、<strong>紙とインクで書こうとは思いません</strong>。わたしたちの喜びが満ちあふれるように、あなたがたのところに行って親しく話し合いたいものです」（<a href="https://bibleox.com/ja/jp-ni/2in/1/#L12">２ヨハ. 1:12</a>）</p></blockquote><blockquote><p>「<strong>あなたに書くことはまだいろいろありますが、インクとペンで書こうとは思いません</strong>。それよりも、<strong>近いうちにお目にかかって親しく話し合いたいものです</strong>」（<a href="https://bibleox.com/ja/jp-ni/3in/1/#L13-14">３ヨハ. 1:13-14</a>）</p></blockquote><p>使徒パウロは、書簡によってだけでなく言葉によって受けた聖伝（使徒たちの教え）を守るよう求めています。</p><blockquote><p>「ですから、兄弟たち、しっかり立って、わたしたちが<strong>説教</strong>や手紙で<strong>伝えた</strong>教えを固く守り続けなさい」（<a href="https://bibleox.com/ja/jp-ni/2sol/2/#L15">２テサ. 2:15</a>）</p></blockquote><blockquote><p>「そして、多くの証人の面前で<strong>わたしから聞いたこと</strong>を、ほかの人々にも教えることのできる<strong>忠実な人たちにゆだねなさい</strong>」（<a href="https://bibleox.com/ja/jp-ni/2tim/2/#L2">２テモ. 2:2</a>）</p></blockquote><h3>使徒たちの口頭の宣教の長さ</h3><p>使徒パウロは、アジアの司祭たちを三年間、夜も昼も教えました。</p><blockquote><p>「だから、わたしが<strong><mark>三年間</mark>、あなたがた一人一人に夜も昼も涙を流して教えてきた</strong>ことを思い起こして、目を覚ましていなさい」（<a href="https://bibleox.com/ja/jp-ni/act/20/#L31">使. 20:31</a>）</p></blockquote><p>一年半、コリントの共同体を教えました。</p><blockquote><p>「その後、パウロはアテネを去ってコリントへ行った。&lt;…&gt; パウロは<strong><mark>一年六か月</mark>の間ここにとどまって、人々に神の言葉を教えた</strong>」（<a href="https://bibleox.com/ja/jp-ni/act/18/#L1,11">使. 18:1,11</a>）</p></blockquote><p>エフェソでは、まず三か月間会堂で、その後二年間、講堂で弟子たちと共に宣教しました。</p><blockquote><p>「パウロは会堂に入って、<strong>三か月間</strong>、神の国のことについて大胆に論じ、人々を説得しようとした。しかしある者たちが、かたくなで信じようとはせず、会衆の前でこの道を非難したので、パウロは彼らから離れ、<strong>弟子たちをも退かせ、ティラノという人の講堂で毎日論じていた</strong>。<strong>このようなことが<mark>二年</mark>も続いたので</strong>、アジア州に住む者は、ユダヤ人であれギリシア人であれ、だれもが主の言葉を聞くことになった」（<a href="https://bibleox.com/ja/jp-ni/act/19/#L8-10">使. 19:8-10</a>）</p></blockquote><p>全体で、使徒パウロ一人だけでも、少なくとも30年間宣教しました。紀元33〜34年の回心から、紀元64〜67年の死までです。</p><h2>聖伝を守り、それに従って教えよという命令</h2><blockquote><p>「マケドニア州に出発するときに頼んでおいたように、あなたはエフェソにとどまって、ある人々に命じなさい。<strong>異なる教えを説いたり</strong>、作り話や切りのない系図に心を奪われたりしないようにと。このような作り話や系図は、信仰による神の救いの計画の実現よりも、むしろ無意味な詮索を引き起こします」（<a href="https://bibleox.com/ja/jp-ni/1tim/1/#L3-4">１テモ. 1:3-4</a>）</p></blockquote><blockquote><p>「そして、多くの証人の面前で<strong>わたしから聞いたこと</strong>を、ほかの人々にも教えることのできる<strong>忠実な人たちにゆだねなさい</strong>」（<a href="https://bibleox.com/ja/jp-ni/2tim/2/#L2">２テモ. 2:2</a>）</p></blockquote><blockquote><p>「ですから、兄弟たち、<strong>しっかり立って</strong>、わたしたちが<strong>説教</strong>や<strong>手紙</strong>で<strong>伝えた教えを固く守り続けなさい</strong>」（<a href="https://bibleox.com/ja/jp-ni/2sol/2/#L15">２テサ. 2:15</a>）</p></blockquote><blockquote><p>「あなたがたが、何かにつけわたしを思い出し、わたしがあなたがたに伝えたとおりに、<strong>伝えられた教えを守っている</strong>のは、立派だと思います」（<a href="https://bibleox.com/ja/jp-ni/1kor/11/#L2">１コリ. 11:2</a>）</p></blockquote><blockquote><p>「兄弟たち、わたしがあなたがたに告げ知らせた福音を、ここでもう一度知らせます。これは、あなたがたが受け入れ、生活のよりどころとしている福音にほかなりません。<strong>どんな言葉でわたしが福音を告げ知らせたか、しっかり覚えていれば</strong>、あなたがたはこの福音によって救われます。さもないと、あなたがたが信じたこと自体が、無駄になってしまうでしょう」（<a href="https://bibleox.com/ja/jp-ni/1kor/15/#L1-2">１コリ. 15:1-2</a>）</p></blockquote><blockquote><p>「愛する人たち、わたしたちが共にあずかる救いについて書き送りたいと、ひたすら願っておりました。あなたがたに手紙を書いて、<strong>聖なる者たちに一度伝えられた信仰のために戦うこと</strong>を、勧めなければならないと思ったからです」（<a href="https://bibleox.com/ja/jp-ni/iud/1/#L3">ユダ. 1:3</a>）</p></blockquote><blockquote><p>「さて、兄弟たち、主イエスに結ばれた者としてわたしたちは更に<strong>願い</strong>、また勧めます。<strong>あなたがたは、神に喜ばれるためにどのように歩むべきかを、わたしたちから学びました</strong>。そして、現にそのように歩んでいますが、どうか、<strong>その歩みを今後も更に続けてください</strong>」（<a href="https://bibleox.com/ja/jp-ni/1sol/4/#L1">１テサ. 4:1</a>）</p></blockquote><blockquote><p>「<strong>教えに適う信頼すべき言葉をしっかり守る人</strong>でなければなりません。そうでないと、健全な教えに従って勧めたり、反対者の主張を論破したりすることもできないでしょう。実は、<strong>不従順な者、無益な話をする者、人を惑わす者が多いのです</strong>。特に割礼を受けている人たちの中に、そういう者がいます。その者たちを沈黙させねばなりません。彼らは恥ずべき利益を得るために、教えてはならないことを教え、数々の家庭を覆しています」（<a href="https://bibleox.com/ja/jp-ni/tit/1/#L9-11">テト. 1:9-11</a>）</p></blockquote><blockquote><p>「ただ、エバが蛇の悪だくみで欺かれたように、あなたがたの思いが汚されて、キリストに対する真心と純潔とからそれてしまうのではないかと心配しています。なぜなら、あなたがたは、だれかがやって来て<strong>わたしたちが宣べ伝えたのとは異なったイエスを宣べ伝えても</strong>、あるいは、自分たちが受けたことのない違った霊や、<strong>受け入れたことのない違った福音</strong>を受けることになっても、よく我慢しているからです。&lt;…&gt; こういう者たちは偽使徒、ずる賢い働き手であって、キリストの使徒を装っているのです。だが、驚くには当たりません。サタンでさえ光の天使を装うのです。だから、サタンに仕える者たちが、義に仕える者を装うことなど、大したことではありません。彼らは、自分たちの業に応じた最期を遂げるでしょう」（<a href="https://bibleox.com/ja/jp-ni/2kor/11/#L3-4,13-15">２コリ. 11:3-4,13-15</a>）</p></blockquote><h2>新しい教えを持ち込む者たちから離れよ</h2><blockquote><p>「<strong>分裂を引き起こす人</strong><em>（ギリシア語 αἱρετικὸν ἄνθρωπον —「異端の人」）</em>には一、二度訓戒し、従わなければ、<strong>かかわりを持たないようにしなさい</strong>」（<a href="https://bibleox.com/ja/jp-ni/tit/3/#L10">テト. 3:10</a>）</p></blockquote><blockquote><p>「<strong>異なる教えを説き</strong>、わたしたちの主イエス・キリストの健全な言葉にも、信心に基づく教えにも従わない者がいれば、<strong>その者は高慢で、何も分からず、議論や口論に病みつきになっています</strong>。そこから、ねたみ、争い、中傷、邪推、絶え間ない言い争いが生じるのです。&lt;…&gt;」（<a href="https://bibleox.com/ja/jp-ni/1tim/6/#L3-5">１テモ. 6:3-5</a>）<em>（ビザンティン本文（多数派写本）では、5節は「<strong>このような人々から離れなさい</strong>」〔ἀφίστασο ἀπὸ τῶν τοιούτων〕という言葉で終わります。新共同訳が底本とする校訂本文には、この言葉はありません。）</em></p></blockquote><blockquote><p>「テモテ、<strong>あなたにゆだねられているものを守り</strong>、<strong>俗悪な無駄話と、不当にも知識と呼ばれている反対論とを避けなさい</strong>。その知識を鼻にかけ、信仰の道を踏み外してしまった者もいます。恵みがあなたがたと共にあるように」（<a href="https://bibleox.com/ja/jp-ni/1tim/6/#L20-21">１テモ. 6:20-21</a>）</p></blockquote><blockquote><p>「兄弟たち、わたしたちは、わたしたちの主イエス・キリストの名によって命じます。怠惰な生活をして、<strong>わたしたちから受けた教えに従わないでいる</strong><strong>すべての兄弟を避けなさい</strong>」（<a href="https://bibleox.com/ja/jp-ni/2sol/3/#L6">２テサ. 3:6</a>）<em>（「教え」は、ギリシア語原文では παράδοσιν —「伝承（聖伝）」です。）</em></p></blockquote><blockquote><p>「兄弟たち、あなたがたに勧めます。<strong>あなたがたの学んだ教えに反して、不和やつまずきをもたらす人々を警戒しなさい。彼らから遠ざかりなさい</strong>。こういう人々は、わたしたちの主であるキリストに仕えないで、自分の腹に仕えている。そして、うまい言葉やへつらいの言葉によって純朴な人々の心を欺いているのです」（<a href="https://bibleox.com/ja/jp-ni/rim/16/#L17-18">ロマ. 16:17-18</a>）</p></blockquote><blockquote><p>「<strong>この教えを携えずにあなたがたのところに来る者は、家に入れてはなりません</strong>。挨拶してもなりません。そのような者に挨拶する人は、その悪い行いに加わるのです」（<a href="https://bibleox.com/ja/jp-ni/2in/1/#L10-11">２ヨハ. 1:10-11</a>）</p></blockquote><blockquote><p>「しかし、たとえわたしたち自身であれ、天使であれ、<strong>わたしたちがあなたがたに告げ知らせたものに反する福音を告げ知らせようとするならば、呪われるがよい</strong><em>（ギリシア語 ἀνάθεμα ἔστω —「アナテマであれ」）</em>。わたしたちが前にも言っておいたように、今また、わたしは繰り返して言います。<strong>あなたがたが受けたものに反する福音を告げ知らせる者がいれば、呪われるがよい</strong>」（<a href="https://bibleox.com/ja/jp-ni/gal/1/#L8-9">ガラ. 1:8-9</a>）</p></blockquote><p><strong>アナテマ</strong>（ギリシア語 ἀνάθεμα）— 教会からの破門。</p><h2>聖人を敬い、聖人に倣う必要</h2><blockquote><p>「あなたがたに神の言葉を語った<strong>指導者たちのことを、<mark>思い出しなさい</mark></strong>。彼らの生涯の終わりをしっかり見て、<strong><mark>その信仰を見倣いなさい</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/evr/13/#L7">ヘブ. 13:7</a>）</p></blockquote><blockquote><p>「そこで、あなたがたに勧めます。<strong>わたしに<mark>倣う者</mark>になりなさい</strong>」（<a href="https://bibleox.com/ja/jp-ni/1kor/4/#L16">１コリ. 4:16</a>）</p></blockquote><blockquote><p>「<strong><mark>兄弟たち、皆一緒にわたしに倣う者となりなさい</mark>。また、あなたがたと同じように、<mark>わたしたちを模範として歩んでいる人々に目を向けなさい</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/fil/3/#L17">フィリ. 3:17</a>）</p></blockquote><p>聖人の崇敬について、さらに詳しく：<a href="https://bibleox.com/ru/ru/w/%D0%BF%D0%BE%D1%87%D0%B8%D1%82%D0%B0%D0%BD%D0%B8%D0%B5-%D1%81%D0%B2%D1%8F%D1%82%D1%8B%D1%85-%D0%B2-%D0%91%D0%B8%D0%B1%D0%BB%D0%B8%D0%B8">聖書における聖人の崇敬</a></p><h2>聖伝の歪曲（異端）を明るみに出せ</h2><blockquote><p>「<strong>真理のためには、命がけで戦え</strong>。主なる神も、お前に味方して戦ってくださる」（<a href="https://bibleox.com/ja/jp-ni/prsir/4/#L28">シラ. 4:28</a>）</p></blockquote><blockquote><p>「愛する人たち、わたしたちが共にあずかる救いについて書き送りたいと、ひたすら願っておりました。あなたがたに手紙を書いて、<strong>聖なる者たちに一度伝えられた信仰のために戦うこと</strong>を、勧めなければならないと思ったからです」（<a href="https://bibleox.com/ja/jp-ni/iud/1/#L3">ユダ. 1:3</a>）</p></blockquote><blockquote><p>「実を結ばない暗闇の業に加わらないで、<strong>むしろ、それを明るみに出しなさい</strong>」（<a href="https://bibleox.com/ja/jp-ni/ef/5/#L11">エフェ. 5:11</a>）</p></blockquote>

  - src: FoSK_Причины_написания_посланий
    path: Re9p_書簡が書かれた理由
    title: 書簡が書かれた理由
    title_sub: 使徒パウロが書簡を書いた理由
    menu: { parent: "教会/聖書", title: "書簡が書かれた理由", priority: 10 }
    body: |-
      <ol><li><p><a class="kanon" href="https://bibleox.com/ja/jp-ni/rim/1/">使徒パウロのローマの信徒への手紙</a> — 使徒は、ローマに着く前にあらかじめ手紙を送る。</p></li><li><p><a class="kanon" href="https://bibleox.com/ja/jp-ni/1kor/1/">コリントの信徒への手紙一</a> — 近親相姦の者、党派を作ること、晩餐の際の無秩序、異言の賜物によって自分を高めることへの叱責。</p></li><li><p><a class="kanon" href="https://bibleox.com/ja/jp-ni/2kor/1/">コリントの信徒への手紙二</a> — 自分の使徒職の証明、献金の勧め。</p></li><li><p><a class="kanon" href="https://bibleox.com/ja/jp-ni/gal/1/">ガラテヤの信徒への手紙</a> — キリスト者にも割礼が必要だという偽りの教えへの叱責。</p></li><li><p><a class="kanon" href="https://bibleox.com/ja/jp-ni/ef/1/">エフェソの信徒への手紙</a> — 神の奥義の観想についての交わり、悲しむ者への慰め。</p></li><li><p><a class="kanon" href="https://bibleox.com/ja/jp-ni/fil/1/">フィリピの信徒への手紙</a> — 使徒を最も愛した教会への挨拶の手紙。</p></li><li><p><a class="kanon" href="https://bibleox.com/ja/jp-ni/kol/1/">コロサイの信徒への手紙</a> — 偽りの教え、そしてグノーシス主義、哲学、ユダヤ教の偽りの教えの混合に対して。</p></li><li><p><a class="kanon" href="https://bibleox.com/ja/jp-ni/1sol/1/">テサロニケの信徒への手紙一</a> — 死者の行く末についての慰め、道徳的な病のいやし。</p></li><li><p><a class="kanon" href="https://bibleox.com/ja/jp-ni/2sol/1/">テサロニケの信徒への手紙二</a> — 再臨についての教えの解明。</p></li><li><p><a class="kanon" href="https://bibleox.com/ja/jp-ni/1tim/1/">テモテへの手紙一</a> — エフェソで偽教師たちが力を増していたときの支えと教え。</p></li><li><p><a class="kanon" href="https://bibleox.com/ja/jp-ni/2tim/1/">テモテへの手紙二</a> — 死を前にした使徒の遺言。</p></li><li><p><a class="kanon" href="https://bibleox.com/ja/jp-ni/tit/1/">テトスへの手紙</a> — クレタの人々の間でテトスに権威を与える。</p></li><li><p><a class="kanon" href="https://bibleox.com/ja/jp-ni/fm/1/">フィレモンへの手紙</a> — フィレモンを、その奴隷オネシモと和解させたいという願い。</p></li><li><p><a class="kanon" href="https://bibleox.com/ja/jp-ni/evr/1/">ヘブライ人への手紙</a> — キリスト者がユダヤ教に戻ってしまうこと、旧い契約に対する新しい契約の優越の証し、悲しみに耐えるようキリスト者を励ますこと。</p></li></ol>
