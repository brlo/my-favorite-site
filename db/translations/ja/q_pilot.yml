    path: Sc3t_救いはキリストの教会においてのみ可能である
    title: 救いはキリストの教会においてのみ可能である
    menu: { parent: 教会, title: 教会だけに救いがある, priority: 2 }
    body: |-
      <h2>祈りや預言や奇跡は、救いのしるしではない</h2><blockquote><p>「<strong><mark>わたしに向かって、『主よ、主よ』と言う者が皆、天の国に入るわけではない</mark></strong>。わたしの天の父の御心を行う者だけが入るのである。かの日には、大勢の者がわたしに、『主よ、主よ、わたしたちは御名によって<strong>預言し</strong>、御名によって<strong>悪霊を追い出し</strong>、御名によって<strong>奇跡をいろいろ行った</strong>ではありませんか』と言うであろう。そのとき、わたしはきっぱりとこう言おう。『<strong><mark>あなたたちのことは全然知らない</mark></strong>。不法を働く者ども、わたしから離れ去れ』」（<a href="https://bibleox.com/ja/jp-ni/mf/7/#L21-23">マタ. 7:21-23</a>）</p></blockquote><blockquote><p>「イエスは言われた。『<strong>惑わされないように気をつけなさい。わたしの名を名乗る者が大勢現れ</strong>、「わたしがそれだ」とか、「時が近づいた」とか言うが、<strong>ついて行ってはならない</strong>』」（<a href="https://bibleox.com/ja/jp-ni/lk/21/#L8">ルカ. 21:8</a>）（<a href="https://bibleox.com/ja/jp-ni/mf/24/#L5">マタ. 24:5</a>）（<a href="https://bibleox.com/ja/jp-ni/mk/13/#L6">マコ. 13:6</a>）</p></blockquote><h2>救われるためには、キリストの体（<a href="https://bibleox.com/ru/q/%D0%A6%D0%B5%D1%80%D0%BA%D0%BE%D0%B2%D1%8C">教会</a>）の一員でなければならない</h2><p>教会はキリストの体です。</p><blockquote><p><em>「</em><strong><em>キリストの<mark>体</mark>である<mark>教会</mark></em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/kol/1/#L24"><em>コロ. 1:24</em></a><em>）</em></p></blockquote><p>キリストは体、すなわち教会の救い主です。</p><blockquote><p><em>「キリストが教会の頭であり、自らその</em><strong><em><mark>体の救い主</mark></em></strong><em>である」（</em><a href="https://bibleox.com/ja/jp-ni/ef/5/#L23"><em>エフェ. 5:23</em></a><em>）</em></p></blockquote><p>救いへの門はキリストです。</p><blockquote><p>「<strong><mark>わたしは門である。わたしを通って入る者は救われる</mark></strong>。その人は、門を出入りして牧草を見つける。盗人が来るのは、盗んだり、屠ったり、滅ぼしたりするためにほかならない。わたしが来たのは、羊が命を受けるため、しかも豊かに受けるためである」（<a href="https://bibleox.com/ja/jp-ni/in/10/#L9-10">ヨハ. 10:9-10</a>）</p></blockquote><p>主は、救われる人々を加えて、一つ（一つの全体）にされました。</p><blockquote><p><em>「こうして、主は</em><strong><em><mark>救われる人々を日々仲間に加え一つにされた</mark></em></strong><em>のである」（</em><a href="https://bibleox.com/ja/jp-ni/act/2/#L47"><em>使. 2:47</em></a><em>）</em></p><p>「一つに」と訳されているギリシア語は ἐπὶ τὸ αὐτό（「一つに」「同じ一つのところに」）で、少し前の「<strong>信者たちは皆一つになって</strong>」（<a href="https://bibleox.com/ja/jp-ni/act/2/#L44">使. 2:44</a>）と同じ言葉です。主は救われる人々を、ばらばらのままではなく、一つの全体に加えられました。キリストは信じる者が一つになることを望まれ（<a href="https://bibleox.com/ja/jp-ni/in/17/#L21">ヨハ. 17:21</a>）、使徒たちはその一致のために戦いました（<a href="https://bibleox.com/ja/jp-ni/1kor/1/#L10">１コリ. 1:10</a>）。</p></blockquote><p>体の外にいる者は実を結ぶことができず、投げ捨てられ、火に投げ入れられます。</p><blockquote><p>「<strong><mark>わたしにつながっていなさい</mark>。わたしもあなたがたにつながっている。<mark>ぶどうの枝が、木につながっていなければ、自分では実を結ぶことができない</mark>ように</strong>、あなたがたも、わたしにつながっていなければ、実を結ぶことができない。わたしはぶどうの木、あなたがたはその枝である。人がわたしにつながっており、わたしもその人につながっていれば、その人は豊かに実を結ぶ。<strong>わたしを離れては、あなたがたは何もできない</strong>からである。<strong><mark>わたしにつながっていない人がいれば、枝のように外に投げ捨てられて</mark></strong>枯れる。そして、<strong>集められ、火に投げ入れられて焼かれてしまう</strong>」（<a href="https://bibleox.com/ja/jp-ni/in/15/#L4-6">ヨハ. 15:4-6</a>）</p></blockquote><blockquote><p>「この方こそ、『あなたがた家を建てる者に捨てられたが、隅の親石となった石』です。<strong><mark>ほかのだれによっても、救いは得られません</mark></strong>。わたしたちが救われるべき名は、天下にこの名のほか、人間には与えられていないのです」（<a href="https://bibleox.com/ja/jp-ni/act/4/#L11-12">使. 4:11-12</a>）</p></blockquote><p>キリストと共にいない者は、キリストに敵対しています。</p><blockquote><p>「<strong>わたしに味方しない者はわたしに敵対し</strong>、わたしと一緒に集めない者は散らしている」（<a href="https://bibleox.com/ja/jp-ni/lk/11/#L23">ルカ. 11:23</a>）</p></blockquote><h2>キリストの体（教会）に加わること</h2><h3>洗礼</h3><blockquote><p><em>「つまり、</em><strong><em>一つの霊によって、わたしたちは</em></strong><em>、ユダヤ人であろうとギリシア人であろうと、奴隷であろうと自由な身分の者であろうと、</em><strong><em>皆<mark>一つの体となるために洗礼を受け</mark></em></strong><em>、皆一つの霊をのませてもらったのです」（</em><a href="https://bibleox.com/ja/jp-ni/1kor/12/#L13"><em>１コリ. 12:13</em></a><em>）</em></p></blockquote><h3>聖体（領聖）</h3><blockquote><p><em>「わたしたちが神を賛美する賛美の杯は、キリストの血にあずかることではないか。わたしたちが裂く</em><strong><em>パン</em></strong><em>は、</em><strong><em>キリストの体にあずかること</em></strong><em>ではないか。</em><strong><em>パンは一つだから、わたしたちは大勢でも<mark>一つの体</mark>です。<mark>皆が一つのパンを分けて食べるからです</mark></em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/1kor/10/#L16-17"><em>１コリ. 10:16-17</em></a><em>）</em></p></blockquote><h2>箱舟は、旧約における救いの予型である</h2><blockquote><p>「主は言われた。『<strong>わたしは人を創造したが、これを地上からぬぐい去ろう</strong>。人だけでなく、家畜も這うものも空の鳥も。わたしはこれらを造ったことを後悔する。』&lt;…&gt; この地は神の前に堕落し、不法に満ちていた。神は地を御覧になった。見よ、それは堕落し、すべて肉なる者はこの地で堕落の道を歩んでいた。神はノアに言われた。『すべて肉なるものを終わらせる時がわたしの前に来ている。彼らのゆえに不法が地に満ちている。見よ、<strong>わたしは地もろとも彼らを滅ぼす</strong>。<strong><mark>あなたはゴフェルの木の箱舟を造りなさい</mark></strong>。箱舟には小部屋を幾つも造り、内側にも外側にもタールを塗りなさい。&lt;…&gt; 見よ、<strong>わたしは地上に洪水をもたらし、命の霊をもつ、すべて肉なるものを天の下から滅ぼす</strong>。<strong><mark>地上のすべてのものは息絶える</mark></strong>。わたしはあなたと契約を立てる。<strong>あなたは妻子や嫁たちと共に箱舟に入りなさい</strong>。また、すべて命あるもの、すべて肉なるものから、二つずつ箱舟に連れて入り、あなたと共に生き延びるようにしなさい。それらは、雄と雌でなければならない。それぞれの鳥、それぞれの家畜、それぞれの地を這うものが、二つずつあなたのところへ来て、生き延びるようにしなさい。更に、食べられる物はすべてあなたのところに集め、あなたと彼らの食糧としなさい。』ノアは、すべて神が命じられたとおりに果たした」（<a href="https://bibleox.com/ja/jp-ni/gen/6/#L7,11-14,17-22">創. 6:7,11-14,17-22</a>）</p></blockquote><blockquote><p>「<strong>地上で動いていた肉なるものはすべて</strong>、鳥も家畜も獣も地に群がり這うものも人も、<strong>ことごとく息絶えた</strong>。<strong>乾いた地のすべてのもののうち、その鼻に命の息と霊のあるものはことごとく死んだ</strong>。<strong>地の面にいた生き物はすべて</strong>、人をはじめ、家畜、這うもの、空の鳥に至るまで<strong>ぬぐい去られた</strong>。<strong><mark>彼らは大地からぬぐい去られ、ノアと、彼と共に箱舟にいたものだけが残った</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/gen/7/#L21-23">創. 7:21-23</a>）</p></blockquote><blockquote><p>「ノアの時代に<strong><mark>箱舟</mark></strong>が作られていた間 &lt;…&gt; <strong><mark>この箱舟に乗り込んだ数人、すなわち八人だけが水の中を通って救われました</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/1pet/3/#L20">１ペト. 3:20</a>）</p></blockquote><h3>旧約の出来事は、わたしたちを教えるために書かれた</h3><blockquote><p><em>「</em><strong><em>これらのことは前例として彼らに起こったのです。それが書き伝えられているのは</em></strong><em>、時の終わりに直面している</em><strong><em>わたしたちに警告するためなのです</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/1kor/10/#L11"><em>１コリ. 10:11</em></a><em>）</em></p><p>「前例として」と訳されている語は、ギリシア語原文では τυπικῶς、すなわち「予型（ひな型）として」です。</p></blockquote><h2>反論</h2><h3>「あなたがたは高慢から、『自分たちだけが救われ、ほかの人は救われない』と言っている」</h3><p>かつて神は、預言者モーセを通して旧約の教会を造り、そこに御心にかなう秩序を定められました。その後、その隣に、移住させられた多くの民から成るサマリア人が現れました。彼らは預言者モーセの五つの巻物（律法）に基づき、後の時代の著者たち（預言者たち）の巻物を受け入れずに、独自の秩序をもつ自分たちだけの別の宗教共同体を造り、自分たちなりに神を信じ、メシアを待っていました。キリストはサマリアの女にこう答えておられます。</p><blockquote><p>「<strong>あなたがたは知らないものを礼拝しているが</strong>、わたしたちは知っているものを礼拝している。<strong>救いはユダヤ人から来るからだ</strong>」（<a href="https://bibleox.com/ja/jp-ni/in/4/#L22">ヨハ. 4:22</a>）</p></blockquote><p>キリストがこう言われたのは高慢からでしょうか。それとも、勝手に造られ、書物から勝手に考え出された信仰をもつ共同体の中では、本当に救われることができないからでしょうか。</p><p>使徒が、肉の業を行う者、すなわち異端や分裂を行う者は神の国を受け継ぐことができないと言うとき、それは高慢から言っているのでしょうか。それとも、そのような罪を抱えたままでは本当に神の国を受け継ぐことができないからでしょうか。</p><blockquote><p><em>「</em><strong><em>肉の業は明らかです</em></strong><em>。それは、姦淫、わいせつ、好色、偶像礼拝、魔術、敵意、争い、そねみ、怒り、利己心、</em><strong><em><mark>不和、仲間争い</mark></em></strong><em>、ねたみ、泥酔、酒宴、その他このたぐいのものです。以前言っておいたように、ここでも前もって言いますが、このようなことを行う者は、</em><strong><em><mark>神の国を受け継ぐことはできません</mark></em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/gal/5/#L19-21"><em>ガラ. 5:19-21</em></a><em>）</em></p><p><strong><em><mark>新共同訳で「不和」「仲間争い」と訳されている語は、ギリシア語原文ではそれぞれ διχοστασίαι（分裂）と αἱρέσεις（異端）です</mark></em></strong><em>（</em><a href="https://bibleox.com/ja/gr-lxx-byz/gal/5/#L20"><em>ガラ. 5:20</em></a><em>）。</em></p></blockquote><p>プロテスタントは、ここに高慢を見ています。それは、キリストを自分の個人的な救い主として認めるだけで、すでに救いを得たとする、彼らが考え出した教え、つまり今ここで、信仰のみによって救われるという教えのためです。正教徒はこの教えを持たず、したがって救いについてまったく異なる考え方をしています（<a href="https://bibleox.com/ru/ru/w/%D1%81%D0%BF%D0%B0%D1%81%D0%B5%D0%BD%D0%B8%D0%B5#HH-%D0%A3%D1%81%D0%BB%D0%BE%D0%B2%D0%B8%D1%8F-%D1%81%D0%BF%D0%B0%D1%81%D0%B5%D0%BD%D0%B8%D1%8F">詳しくはこちら、ロシア語</a>）。</p><p><a href="https://bibleox.com/ru/ru/w/%D0%9F%D1%80%D0%B0%D0%B2%D0%BE%D1%81%D0%BB%D0%B0%D0%B2%D0%BD%D0%B0%D1%8F-%D0%A6%D0%B5%D1%80%D0%BA%D0%BE%D0%B2%D1%8C">正教会</a>（ロシア語）に来ても、わたしたちはまだ救われたのではなく、救われつつあるのです。教会に来た人が皆救われるのではなく、救いの手段を用いて、罪深い情欲を根絶し、福音の徳を身につけながら、熱心に自分自身と取り組む人だけが救われるのです。正教会にとどまることは、救いの条件の一つにすぎません。救いを求める人には誰でも、救いの手段が必要です。病人には薬が、大海の真ん中でおぼれかけている人には船が必要です。同じように、罪深い情欲に病むすべての人が、罪の深淵に沈まずに地上の生の海を渡り切り、神と共にある生に達するためには、<strong>救いの手段、すなわち正しい信仰と恵みに満ちた機密</strong>が必要です。これらの救いの手段は、神によって神の救いの箱舟、すなわち正教会の中に置かれています。この箱舟は、神であるイエス・キリスト御自身が2000年前に来られて、自ら造られたものです。</p><p>最近になって普通の人々が勝手に造った共同体は、信じる者の一致についての神の御心にまっこうから反しており、救いの手段を持たないばかりか、かえってその別個の存在そのものによって、人々を重い罪の状態、すなわち異端と分裂という死に至る罪へと導いています（<a href="https://bibleox.com/ja/jp-ni/gal/5/#L19-21">ガラ. 5:19-21</a>）。</p><p>信じる者の一致についてのキリストと使徒たちの意志にまっこうから反して、自分たちの「教会」を造り、信じる者を分裂させること、それこそが高慢の現れです。</p><blockquote><p><em>「また、彼らのためだけでなく、彼らの言葉によってわたしを信じる人々のためにも、</em><strong><em><mark>お願いします</mark></em></strong><em>。父よ、あなたがわたしの内におられ、わたしがあなたの内にいるように、</em><strong><em><mark>すべての人を一つにしてください</mark></em></strong><em>。</em><strong><em>彼らもわたしたちの内にいるようにしてください。そうすれば、<mark>世は、あなたがわたしをお遣わしになったことを、信じるようになります</mark></em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/in/17/#L20-21"><em>ヨハ. 17:20-21</em></a><em>）</em></p></blockquote><blockquote><p><em>「さて、兄弟たち、わたしたちの主イエス・キリストの名によってあなたがたに</em><strong><em><mark>勧告します</mark></em></strong><em>。</em><strong><em><mark>皆、勝手なことを言わず</mark>、<mark>仲たがいせず</mark></em></strong><em>、</em><strong><em><mark>心を一つにし思いを一つにして</mark></em></strong><em>、固く結び合いなさい」（</em><a href="https://bibleox.com/ja/jp-ni/1kor/1/#L10"><em>１コリ. 1:10</em></a><em>）</em></p><p>「仲たがいせず」と訳されている箇所は、ギリシア語原文では「あなたがたの間に分裂（σχίσματα）がないように」です。</p></blockquote><p>言うまでもなく、キリストに敵対し、自分たちの「教会」を造りながら救われることはできません。使徒も、肉の業に従い、異端や分裂の中にいては天の国を受け継ぐことができないと言っています。</p><blockquote><p><em>「</em><strong><em>肉の業は明らかです</em></strong><em>。それは、姦淫、わいせつ、好色、偶像礼拝、魔術、敵意、争い、そねみ、怒り、利己心、</em><strong><em><mark>不和（分裂）、仲間争い（異端）</mark></em></strong><em>、ねたみ、泥酔、酒宴、その他このたぐいのものです。以前言っておいたように、ここでも前もって言いますが、このようなことを行う者は、</em><strong><em><mark>神の国を受け継ぐことはできません</mark></em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/gal/5/#L19-21"><em>ガラ. 5:19-21</em></a><em>）</em></p></blockquote><p>使徒は、分裂を引き起こす人々は主イエス・キリストに仕えていないと、はっきり言っています。</p><blockquote><p><em>「兄弟たち、あなたがたに勧めます。あなたがたの学んだ教えに反して、</em><strong><em><mark>不和（分裂）やつまずきをもたらす人々を警戒しなさい</mark></em></strong><em>。彼らから遠ざかりなさい。</em><strong><em><mark>こういう人々は、わたしたちの主であるキリストに仕えないで</mark></em></strong><em>、自分の腹に仕えている。そして、うまい言葉やへつらいの言葉によって純朴な人々の心を欺いているのです」（</em><a href="https://bibleox.com/ja/jp-ni/rim/16/#L17-18"><em>ロマ. 16:17-18</em></a><em>）</em></p><p>「不和」と訳されている語は、ギリシア語原文では διχοστασίας（分裂）です。</p></blockquote><p>キリストに逆らって行動する人の後について行って、どうして救われることができるでしょうか。</p><p>そのうえ、異端と分裂だけが罪なのではありません。ほかにも多くの<a href="https://bibleox.com/ru/ru/w/%D1%81%D0%BC%D0%B5%D1%80%D1%82%D0%BD%D1%8B%D0%B9-%D0%B3%D1%80%D0%B5%D1%85">死に至る罪</a>があります。酒におぼれる人に、聖書に書かれているとおり（<a href="https://bibleox.com/ja/jp-ni/1kor/6/#L9">１コリ. 6:9</a>）、泥酔という死に至る罪の中にとどまっていては天の国を受け継ぐことができないと警告することは、高慢な行いでしょうか。あるいは、人殺しや盗人、魔術を行う者、みだらな者、うそつきに同じことを言うことは。もしそれが高慢ではなく、わたしたちがこうした死に至る罪について警告すべきであるなら（<a href="https://bibleox.com/ja/jp-ni/ef/5/#L11">エフェ. 5:11</a>）、正直に言えば、異端者や分裂者にも警告すべきです。なぜなら異端と分裂は、泥酔や殺人などと同じ死に至る罪の一覧に入っており、その中にとどまる人は天の国を受け継ぐことができないからです。</p><p>では、人はどうすればこの罪の状態から抜け出せるのでしょうか。最近普通の人が造った共同体にとどまることをやめ、同じその人が最近考え出したその共同体の信仰を捨てることです。そして、主イエス・キリストが造られた正教会に入り、正教の信仰を身につけることです。それは、キリストが使徒たちに教え、使徒たちが正教会の中に託し、教会に永遠に遣わされた聖霊によって、キリストの教会の中に変わることなく保たれている信仰です。</p><blockquote><p><em>「わたしは父にお願いしよう。父は別の弁護者を遣わして、</em><strong><em><mark>永遠に</mark>あなたがたと一緒にいるようにしてくださる</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/in/14/#L16"><em>ヨハ. 14:16</em></a><em>）</em></p></blockquote><blockquote><p><em>「わたしは世の終わりまで、</em><strong><em><mark>いつも</mark>あなたがたと共にいる</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/mf/28/#L20"><em>マタ. 28:20</em></a><em>）</em></p></blockquote>
