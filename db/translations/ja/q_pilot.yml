  - src: спасающихся-мало
    path: Sk5j_救われる者は少ない
    title: 救われる者は少ない
    meta_desc: 信じる者が少ないだけでなく、信じる者の中でも救われる者は少ない
    menu: { parent: 教会/救い, title: 救われる者は少ない, priority: 5 }
    body: |-
      <h2>救われる者は少ない</h2><blockquote><p>「すると、『主よ、<strong>救われる者は少ないのでしょうか</strong>』と言う人がいた。イエスは一同に言われた。『狭い戸口から入るように努めなさい。言っておくが、<strong>入ろうとしても入れない人が多いのだ</strong>』」（<a href="https://bibleox.com/ja/jp-ni/lk/13/#L23-24">ルカ. 13:23-24</a>）</p></blockquote><blockquote><p>「狭い門から入りなさい。<strong>滅びに通じる門は広く</strong>、その道も広々として、<strong>そこから入る者が多い</strong>。しかし、<strong>命に通じる門はなんと狭く</strong>、その道も細いことか。<strong>それを見いだす者は少ない</strong>」（<a href="https://bibleox.com/ja/jp-ni/mf/7/#L13-14">マタ. 7:13-14</a>）</p></blockquote><blockquote><p>「かの日には、<strong>大勢の者</strong>がわたしに、『主よ、主よ、わたしたちは御名によって預言し、御名によって悪霊を追い出し、御名によって奇跡をいろいろ行ったではありませんか』と言うであろう。そのとき、わたしはきっぱりとこう言おう。『<strong>あなたたちのことは全然知らない。不法を働く者ども、わたしから離れ去れ</strong>』」（<a href="https://bibleox.com/ja/jp-ni/mf/7/#L22-23">マタ. 7:22-23</a>）</p></blockquote><blockquote><p>「<strong>小さな群れ</strong>よ、恐れるな。あなたがたの父は喜んで神の国をくださる」（<a href="https://bibleox.com/ja/jp-ni/lk/12/#L32">ルカ. 12:32</a>）</p></blockquote><blockquote><p>「王は側近の者たちに言った。『この男の手足を縛って、外の暗闇にほうり出せ。そこで泣きわめいて歯ぎしりするだろう。』招かれる人は多いが、<strong>選ばれる人は少ない</strong>」（<a href="https://bibleox.com/ja/jp-ni/mf/22/#L13-14">マタ. 22:13-14</a>）</p></blockquote><h2>旧約における、救われる者が少なかった例</h2><blockquote><p>「神は、罪を犯した天使たちを容赦せず、暗闇という縄で縛って地獄に引き渡し、裁きのために閉じ込められました。また、神は<strong>昔の人々を容赦しないで</strong>、不信心な者たちの世界に洪水を引き起こし、義を説いていた<strong><mark>ノアたち八人を保護なさった</mark></strong>のです。また、神は<strong>ソドムとゴモラの町を灰にし、滅ぼし尽くして罰し</strong>、それから後の不信心な者たちへの見せしめとなさいました。しかし神は、不道徳な者たちのみだらな言動によって悩まされていた<strong>正しい人ロトを、助け出されました</strong>。なぜなら、この正しい人は、彼らの中で生活していたとき、毎日よこしまな行為を見聞きして正しい心を痛めていたからです。主は、信仰のあつい人を試練から救い出す一方、正しくない者たちを罰し、裁きの日まで閉じ込めておくべきだと考えておられます」（<a href="https://bibleox.com/ja/jp-ni/2pet/2/#L4-9">２ペト. 2:4-9</a>）</p></blockquote><blockquote><p>「<strong>これらのことは前例として彼らに起こったのです。それが書き伝えられているのは</strong>、時の終わりに直面している<strong>わたしたちに警告するためなのです</strong>」（<a href="https://bibleox.com/ja/jp-ni/1kor/10/#L11">１コリ. 10:11</a>）</p><p>「前例として」と訳されている語は、ギリシア語原文では τυπικῶς、すなわち「予型（ひな型）として」です（<a href="https://bibleox.com/ja/gr-lxx-byz/1kor/10/#L11">１コリ. 10:11</a>）。</p></blockquote>

  - src: Писание-не-под-диктовку
    path: Dk7t_聖書は神の口述筆記ではない
    title: 聖書は神の口述筆記ではない
    menu: { parent: 教会/聖書, title: 聖書は神の口述筆記ではない, priority: 5 }
    body: |-
      <p>聖書の言葉は神の霊の導き（霊感）によって書かれたものですが、神が口述し、それをそのまま書き取ったものではありません。書き手も、鉛筆のような意志のない道具として神の手の中にあったのではありません。羊飼いであった預言者は素朴な言葉で書き、王宮出身の預言者は高い教養のある人として書いています。どちらも、それぞれの生活にふさわしいたとえを用いています。たとえば、使徒パウロについて、ほかの使徒は、その手紙には理解しにくいところがあると書いています。</p><blockquote><p>「彼は、どの手紙の中でもこのことについて述べています。その手紙には<strong>難しく理解しにくい個所があって</strong>…」（<a href="https://bibleox.com/ja/jp-ni/2pet/3/#L16">２ペト. 3:16</a>）</p></blockquote><p>また、使徒パウロ自身も、自分は知識においてではなく、言葉においては素人であると言っています。</p><blockquote><p>「たとえ、<strong>話し振りは素人でも</strong>、知識はそうではない」（<a href="https://bibleox.com/ja/jp-ni/2kor/11/#L6">２コリ. 11:6</a>）</p></blockquote><p>つまり、知識には欠けるところがなくても、彼は自分にできるように書いているのです。実際、使徒パウロは教育を受けたファリサイ派の人として、込み入った論理の構文を用いています。それどころか、使徒たちは時に、自分自身の考えとして書いていることをはっきり述べています。</p><blockquote><p>「未婚の人たちについて、わたしは<strong>主の指示を受けてはいませんが</strong>、主の憐れみにより信任を得ている者として、<strong>意見を述べます</strong>」（<a href="https://bibleox.com/ja/jp-ni/1kor/7/#L25">１コリ. 7:25</a>）</p></blockquote><p>むしろ、聖書は神と人との共同の働き（協働、シネルギア）であると言うほうが正確です。</p><blockquote><p>「わたしたちは神のために<strong>力を合わせて働く者</strong>（συνεργοί［シュネルゴイ］、「共に働く者」）であり、あなたがたは神の畑、神の建物なのです」（<a href="https://bibleox.com/ja/jp-ni/1kor/3/#L9">１コリ. 3:9</a>）</p></blockquote>

  - src: евангелисты-обращаются-к-Септуагинте
    path: Lx7s_福音記者は七十人訳聖書を参照した
    title: 福音記者は七十人訳聖書を参照した
    title_sub: 使徒と福音記者は七十人訳聖書（旧約聖書のギリシア語訳）を参照していた
    meta_desc: 使徒と福音記者が七十人訳聖書を参照していたことを示す聖書の引用
    menu: { parent: 教会/聖書, title: 福音記者は七十人訳聖書を参照した, priority: 7 }
    references: |-
      <ol><li><p><a href="https://dssenglishbible.com/scroll4Q80.htm">https://dssenglishbible.com/scroll4Q80.htm</a>（英語）</p></li><li><p><a href="https://dssenglishbible.com/scroll4Q88.htm">https://dssenglishbible.com/scroll4Q88.htm</a>（英語、脚注を参照）</p></li></ol>
    body: |-
      <h2>七十人訳聖書（LXX）とは</h2><p><strong>七十人訳聖書</strong>（ラテン語 Septuaginta「七十」、略して LXX）は、紀元前3〜2世紀に、70人（72人）のユダヤ人の翻訳者によってヘブライ語から古代ギリシア語に訳された旧約聖書です。</p><p>このギリシア語本文のほかに、ヘブライ語の本文、すなわちマソラ本文があります。</p><p><strong>マソラ本文</strong>とは、旧約聖書のヘブライ語本文で、紀元後7〜10世紀に母音記号が付け加えられたものです。母音記号とは何でしょうか。簡単に言えば、語の上や下に付けられた点や線のことで、語に欠けている母音や読み方の特徴を示し、正しく読めるようにするものです。これらの記号は発音区別符号と呼ばれます。ヘブライ語の本文は子音字だけで書かれていたので、正しく読めたのは、読み方の伝統（聖伝）を知っている人だけでした。母音記号は、本文の読み方を一つに定めるために付けられたのです。</p><p>七十人訳聖書が重要なのは、それがユダヤ人自身によって、しかもユダヤの民がイエスをキリストであり神であると認めることを拒む前に準備された本文だからです。つまり当時はまだ、聖書の中に主イエス・キリストの居場所がますます少なくなるように聖書を理解する必要がなかったのです。また、どんな翻訳も常に解釈であることを考慮しなければなりません。この場合、七十人訳聖書は、その言語と伝統を受け継ぐ人々が、多くの人には読めないヘブライ語から、多くの人に理解できるギリシア語へと行った、解釈を兼ねた翻訳です。</p><p><em>なお、日本語の新共同訳の旧約聖書はマソラ本文から訳されています。そのため以下では、七十人訳の読みをギリシア語から直接訳して示します。</em></p><h2>「おとめ」か「若い女」か</h2><p>福音記者マタイは、キリストがおとめから生まれるというイザヤの預言を引用しています。</p><blockquote><p>「見よ、<strong>おとめ</strong>（ギリシア語 παρθένος）が身ごもって男の子を産む。その名はインマヌエルと呼ばれる。」この名は、「神は我々と共におられる」という意味である（<a href="https://bibleox.com/ja/jp-ni/mf/1/#L23">マタ. 1:23</a>）</p></blockquote><p>七十人訳によれば、キリストはおとめから生まれることになっています。</p><blockquote><p>「それゆえ、主御自身があなたたちにしるしを与えられる。見よ、<strong>おとめ</strong>（ギリシア語 παρθένος）が身ごもって男の子を産む。あなたはその名をインマヌエルと呼ぶ」（<a href="https://bibleox.com/ja/gr-lxx-byz/is/7/#L14">イザ. 7:14、七十人訳</a>、ギリシア語からの訳）</p></blockquote><p>一方、マソラ本文では、キリストは未婚の若い女から生まれることになっています。ヘブライ語では עַלְמָ֗ה［アルマー］です。新共同訳もここを「おとめ」と訳していますが（<a href="https://bibleox.com/ja/jp-ni/is/7/#L14">イザ. 7:14</a>）、ヘブライ語のこの語は「処女」に限らず「若い女」を意味します。</p><h2>「杖」か「寝台の枕もと」か</h2><p>使徒パウロは、ヘブライ人への手紙（！）の中で、ヤコブが自分の杖の先に向かって伏し拝んだことを思い起こしています。</p><blockquote><p>「信仰によって、ヤコブは死に臨んで、ヨセフの息子たちの一人一人のために祝福を祈り、<strong>杖</strong>（ギリシア語 ῥάβδου）<strong>の先に</strong>寄りかかって神を礼拝しました」（<a href="https://bibleox.com/ja/jp-ni/evr/11/#L21">ヘブ. 11:21</a>）</p></blockquote><p>七十人訳によれば、ヤコブは杖の先に向かって伏し拝みました。</p><blockquote><p>「彼は『わたしに誓ってくれ』と言い、ヨセフは彼に誓った。イスラエルは<strong>自分の杖</strong>（ギリシア語 ῥάβδου）<strong>の先に</strong>向かって伏し拝んだ」（<a href="https://bibleox.com/ja/gr-lxx-byz/gen/47/#L31">創. 47:31、七十人訳</a>、ギリシア語からの訳）</p></blockquote><p>一方、マソラ本文では、ヤコブは寝台の枕もとに向かって伏し拝んだことになっています。ヘブライ語では מִּטָּֽה［ミッター］です。新共同訳もこの読みに従っています。</p><blockquote><p>「イスラエルは、<strong>寝台の枕もと</strong>で感謝を表した」（<a href="https://bibleox.com/ja/jp-ni/gen/47/#L31">創. 47:31</a>）</p></blockquote><h2>主イエス・キリストの系図の中のカイナム</h2><p>福音記者ルカは救い主の系図を記し、シェラとアルパクシャドの間にカイナム（カイナン）の名を挙げています。</p><blockquote><p>「セルグ、レウ、ペレグ、エベル、シェラ、<strong>カイナム</strong>、アルパクシャド、セム、ノア、レメク、メトシェラ、エノク、イエレド、マハラルエル、ケナン、エノシュ、セト、アダム。そして神に至る」（<a href="https://bibleox.com/ja/jp-ni/lk/3/#L35-38">ルカ. 3:35-38</a>）</p></blockquote><p>七十人訳聖書にはカイナン（130＋330年）が出てきます。彼はアルパクシャドから生まれ、シェラをもうけました。</p><blockquote><p>「アルパクシャドは百三十五年生きて、<strong>カイナン</strong>（ギリシア語 Καιναν）<strong>をもうけた</strong>。アルパクシャドはカイナンをもうけた後、四百三十年生きて、息子や娘をもうけ、そして死んだ。<strong>カイナンは百三十年生きて、シェラをもうけた</strong>。カイナンはシェラをもうけた後、三百三十年生きて、息子や娘をもうけ、そして死んだ」（<a href="https://bibleox.com/ja/gr-lxx-byz/gen/11/#L12-13">創. 11:12-13、七十人訳</a>、ギリシア語からの訳）</p></blockquote><p>マソラ本文では、アルパクシャド（35＋403年）がすぐにシェラをもうけ、カイナンはまったく出てきません。</p><blockquote><p>「アルパクシャドが三十五歳になったとき、シェラが生まれた。アルパクシャドは、シェラが生まれた後四百三年生きて、息子や娘をもうけた」（<a href="https://bibleox.com/ja/jp-ni/gen/11/#L12-13">創. 11:12-13</a>）</p></blockquote><p>同じことは、その一つ前の章にも見られます（<a href="https://bibleox.com/ja/jp-ni/gen/10/#L22,24">創. 10:22,24</a>、<a href="https://bibleox.com/ja/gr-lxx-byz/gen/10/#L22,24">七十人訳</a>）。</p><h2>「目の見えない人に視力の回復」か「つながれている人に解放」か</h2><p>福音記者ルカは、預言者イザヤの預言を七十人訳に従って引用しています。</p><blockquote><p>「主の霊がわたしの上におられる。貧しい人に福音を告げ知らせるために、主がわたしに油を注がれたからである。主がわたしを遣わされたのは、捕らわれている人に解放を、<strong>目の見えない人に視力の回復</strong>を告げ、圧迫されている人を自由にし、主の恵みの年を告げるためである」（<a href="https://bibleox.com/ja/jp-ni/lk/4/#L18-19">ルカ. 4:18-19</a>）</p></blockquote><p>七十人訳聖書のこの箇所には「目の見えない人に視力の回復」（ギリシア語 τυφλοῖς ἀνάβλεψιν）という句があります。</p><blockquote><p>「主の霊がわたしの上にある。主がわたしに油を注がれたからである。貧しい人に福音を告げ知らせるために、主はわたしを遣わされた。心の打ち砕かれた人をいやし、捕らわれている人に解放を、<strong>目の見えない人に視力の回復</strong>を告げ、主の恵みの年と報いの日を告げ、悲しむすべての人を慰めるために」（<a href="https://bibleox.com/ja/gr-lxx-byz/is/61/#L1-2">イザ. 61:1-2、七十人訳</a>、ギリシア語からの訳）</p></blockquote><p>一方、マソラ本文では「つながれている人には解放」となっています。ヘブライ語では אֲסוּרִים פְּקַח ־ קֽוֹחַ［アスーリーム・ペカハ・コアハ］です。</p><blockquote><p>「主はわたしに油を注ぎ、主なる神の霊がわたしをとらえた。わたしを遣わして、貧しい人に良い知らせを伝えさせるために。打ち砕かれた心を包み、捕らわれ人には自由を、<strong>つながれている人には解放</strong>を告知させるために。主が恵みをお与えになる年、わたしたちの神が報復される日を告知して、嘆いている人々を慰め」（<a href="https://bibleox.com/ja/jp-ni/is/61/#L1-2">イザ. 61:1-2</a>）</p></blockquote><p>しかもマソラ本文では、同じことが言葉を変えて繰り返されることになります。「<em>捕らわれ人には自由を、つながれている人には解放を</em>」。</p><h2>手足を刺し貫いたのか、それとも獅子が砕くのか</h2><p>七十人訳聖書には、キリストについてのこのような預言があります。</p><blockquote><p>「大勢の犬がわたしを取り囲み、悪を行う者の群れがわたしを囲んだ。<strong>彼らはわたしの手と足を刺し貫いた</strong>」（<a href="https://bibleox.com/ja/gr-lxx-byz/ps/21/#L16">詩. 21:16、七十人訳</a>、ギリシア語からの訳：ὤρυξαν χεῖράς μου καὶ πόδας）</p></blockquote><p>後代のマソラ本文には、キリストの手足が刺し貫かれるという言葉がありません。その代わりに「獅子」という語があります。それでいて「砕く」「かみ裂く」という動詞は本文にまったくなく、獅子の動作が手足とどう結びつくのかもはっきりしません。新共同訳はこの読みに従い、動詞を補っています。</p><blockquote><p>「犬どもがわたしを取り囲み、さいなむ者が群がってわたしを囲み、<strong>獅子のようにわたしの手足を砕く</strong>」（<a href="https://bibleox.com/ja/jp-ni/ps/22/#L17">詩. 22:17</a>）</p></blockquote><p>しかし、やはり「刺し貫いた」が正しいのです。古代のクムラン写本 4Q88[2] も、手足が刺し貫かれたことを裏付けています。</p><p>さらに、まさに「刺し貫いた」ことについての預言がもう一つあります。それはここで言及されています。</p><blockquote><p><em>「また、聖書の別の所に、『彼らは、自分たちの</em><strong><em><mark>突き刺した</mark>者を見る</em></strong><em>』とも書いてある」（</em><a href="https://bibleox.com/ja/jp-ni/in/19/#L37"><em>ヨハ. 19:37</em></a><em>）</em></p></blockquote><p>これは次の箇所を指しています。</p><blockquote><p><em>「わたしはダビデの家とエルサレムの住民に、憐れみと祈りの霊を注ぐ。彼らは、彼ら自らが</em><strong><em><mark>刺し貫いた</mark></em></strong><em>者であるわたしを見つめ、独り子を失ったように嘆き、初子の死を悲しむように悲しむ」（</em><a href="https://bibleox.com/ja/jp-ni/zah/12/#L10"><em>ゼカ. 12:10</em></a><em>）</em></p></blockquote><blockquote><p><em>「וְשָׁפַכְתִּי עַל ־ בֵּית דָּוִיד וְעַל ׀ יוֹשֵׁב יְרוּשָׁלִַם רוּחַ חֵן וְתַחֲנוּנִים וְהִבִּיטוּ אֵלַי אֵת אֲשֶׁר ־ </em><strong><em>דָּקָרוּ</em></strong><em> וְסָפְדוּ עָלָיו כְּמִסְפֵּד עַל ־ הַיָּחִיד וְהָמֵר עָלָיו כְּהָמֵר עַֽל ־ הַבְּכֽוֹר ׃」（</em><a href="https://bibleox.com/ja/heb-osm/zah/12/#L10"><em>ゼカ. 12:10</em></a><em>）</em></p></blockquote><p>דָּקָ֑רוּ</p><p>דקר — 刺す、刺し通す。また、刺される、刺し貫かれる。</p><p>クムラン写本 4Q80[1] も、刺し貫かれたことを裏付けています。</p>

