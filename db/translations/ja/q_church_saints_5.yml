      <h3>関連資料</h3><ol><li><p><strong>神の母についての正教会の教えの解説 // </strong>聖イグナティ（ブリャンチャニノフ）、URL: <a href="https://azbyka.ru/otechnik/Ignatij_Brjanchaninov/asketicheskaya_propoved/54">https://azbyka.ru/otechnik/Ignatij_Brjanchaninov/asketicheskaya_propoved/54</a>（ロシア語）</p></li><li><p><strong>福なるマリアの永遠の処女性 // </strong>ストリドンの福者ヒエロニムス（347年頃〜419年）、URL: <a href="https://bibleox.com/en/en/w/jerome-the-perpetual-virginity-of-blessed-mary/">https://bibleox.com/en/en/w/jerome-the-perpetual-virginity-of-blessed-mary/</a>（英語）</p></li></ol>
    body: |-
      <h2>前提となる一般的な問い</h2><p>この記事は、<strong>キリストは神である</strong>という事実から出発しています（<a href="https://bibleox.com/ja/ja/w/イエス・キリスト__神/">引用</a>）。</p><p>おとめマリアは聖人の崇敬についての教えに基づいて崇敬されます。ですから、まず<a href="https://bibleox.com/ja/ja/w/Vs4n_聖人の崇敬/">聖人の崇敬</a>と<a href="https://bibleox.com/ja/ja/w/Ps5r_聖人への祈り/">聖人への祈り</a>を証明しておく価値があります。</p><p>しかしここでは、おとめマリアを聖人の一人として単に崇敬することの根拠ではなく、<strong>神の聖なる僕であり友である者たちの中で最も偉大な者</strong>として、イエス・キリストの母として（すなわち、イエス・キリストは神であるから神の母として）特別に崇敬することの根拠を示します。</p><h2>生神女を特別に崇敬する理由</h2><ol><li><p><strong>神の言葉に対するおとめマリアの特別な注意深さ。</strong></p></li><li><p><strong>神への完全な謙遜な従順。</strong></p></li><li><p><strong>神に選ばれたこと</strong>。宇宙のだれ一人として、その人性において神を産むという誉れを神から与えられた者はいません。功績は彼女が産んだことにあるのではなく、神がマリアの性質を前もって知り（<a href="https://bibleox.com/ja/jp-ni/rim/8/#L29">ロマ. 8:29</a>）、その性質のゆえに彼女を選ばれたことにあります。この選びによって、神は彼女の偉大さを指し示しておられるのです。</p></li><li><p><strong>神の子は、おとめマリアを御自分の母として敬われる。</strong>ほかのだれも（宇宙のほかのどんな存在も）神の子の母ではありません。</p></li><li><p><strong>預言の成就</strong>：「今から後、いつの世の人もわたしを幸いな者と言うでしょう」（<a href="https://bibleox.com/ja/jp-ni/lk/1/#L48">ルカ. 1:48</a>）。すなわち、人々のすべての世代が（γενεαί — ゲネアイ）。神はおとめマリアに偉大なことをなさいました。「<em>力ある方が、</em><strong><em>わたしに<mark>偉大なこと</mark>をなさいましたから</em></strong><em>。その御名は尊く</em>」（<a href="https://bibleox.com/ja/jp-ni/lk/1/#L49">ルカ. 1:49</a>）。</p></li></ol><h2>謙遜のゆえに選ばれた</h2><blockquote><p>「そこで、マリアは言った。『わたしの魂は主をあがめ、わたしの霊は救い主である神を喜びたたえます。<strong><mark>身分の低い</mark>、この主のはしためにも目を留めてくださったからです</strong>。今から後、いつの世の人もわたしを幸いな者と言うでしょう』」（<a href="https://bibleox.com/ja/jp-ni/lk/1/#L46-48">ルカ. 1:46-48</a>）<em>（「身分の低い」は、ギリシア語原文では ταπείνωσιν —「低さ、謙遜」です。）</em></p></blockquote><p>預言者の中で最も偉大な者の父（ザカリア）でさえ、不信仰、いやむしろ不信や疑いのために、大天使によって罰せられました（<a href="https://bibleox.com/ja/jp-ni/lk/1/#L20">ルカ. 1:20</a>）。しかし神の母は、自分について定められたことを従順に受け入れ、謙遜に答えました。</p><blockquote><p>「わたしは主のはしためです。<strong><mark>お言葉どおり、この身に成りますように</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/lk/1/#L38">ルカ. 1:38</a>）</p></blockquote><p>謙遜の大切さについて：</p><blockquote><p><em>「あなたの力は人の数によるものではなく、あなたの主権は強者に頼るものでもありません。</em><strong><em><mark>あなたは虐げられた者の神</mark></em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/iudf/9/#L11"><em>ユデ. 9:11</em></a><em>）（「虐げられた者」は、ギリシア語原文では ταπεινῶν —「へりくだる者、低い者」です。）</em></p></blockquote><blockquote><p>「<strong>偉くなればなるほど、自らへりくだれ</strong>。そうすれば、主は喜んで受け入れてくださる。&lt;…&gt; 主の威光は壮大。主はへりくだる人によってあがめられる」（<a href="https://bibleox.com/ja/jp-ni/prsir/3/#L18,20">シラ. 3:18,20</a>）</p></blockquote><p>謙遜についての大切な引用（ロシア語）：<a href="https://bibleox.com/ru/ru/w/%D1%81%D0%BC%D0%B8%D1%80%D0%B5%D0%BD%D0%B8%D0%B5">謙遜</a></p><h2>神の言葉の最も注意深い聞き手</h2><blockquote><p>「わが子よ、<strong><mark>あなたの心をわたしにゆだねよ。喜んでわたしの道に目を向けよ</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/pr/23/#L26">箴. 23:26</a>）</p></blockquote><blockquote><p>「しかし、<strong>マリアは<mark>これらの出来事をすべて</mark><mark>心に</mark>納めて、思い巡らしていた</strong>」（<a href="https://bibleox.com/ja/jp-ni/lk/2/#L19">ルカ. 2:19</a>）<em>（ギリシア語 πάντα συνετήρει τὰ ῥήματα ταῦτα —「これらの言葉をすべて守っていた」）</em></p></blockquote><blockquote><p>「母は<strong><mark>これらのことをすべて</mark><mark>心に</mark>納めていた</strong>」（<a href="https://bibleox.com/ja/jp-ni/lk/2/#L51">ルカ. 2:51</a>）</p></blockquote><blockquote><p><em>「しかし、イエスは言われた。『むしろ、</em><strong><em>幸いなのは</em></strong><em>神の言葉を</em><strong><em>聞き</em></strong><em>、それを</em><strong><em>守る</em></strong><em>人である』」（</em><a href="https://bibleox.com/ja/jp-ni/lk/11/#L27-28"><em>ルカ. 11:27-28</em></a><em>）</em></p></blockquote><p>聖イグナティ（ブリャンチャニノフ）が言うとおり、彼女は神の教えの最も注意深く忠実な聞き手であり、実行者であることを示しました。</p><blockquote><p>永遠のおとめがすべての聖なる人々にまさるのは、神人の母となったからであり、また<strong>神人が宣べ伝えた教えの最も忠実で、最も注意深い聞き手であり、実行者であった</strong>からである。</p></blockquote><p>（<a href="https://azbyka.ru/otechnik/Ignatij_Brjanchaninov/asketicheskaya_propoved/54">神の母についての正教会の教えの解説</a>、ロシア語。ロシア語からの訳）</p><h2>彼女は神であるキリストの母となった</h2><p>神の母を特別に崇敬する理由の一つは、彼女が（その人性における）神の母であるという事実です。ほかのだれも、宇宙のどの存在も、神の母ではないからです。神の戒めは、わたしたちに両親を敬うよう義務づけています（<a href="https://bibleox.com/ru/ru/w/10-%D0%B7%D0%B0%D0%BF%D0%BE%D0%B2%D0%B5%D0%B4%D0%B5%D0%B9#HH-5">第五の戒め</a>）。それゆえ、神であるキリスト御自身が生神女を御自分の母として敬い、その後に続いて、キリストを信じる弟子たちも彼女を敬うのです。</p><h3>おとめマリアは神の子を産んだ</h3><p>女から真に生まれたのは、まさに神の独り子でした。</p><blockquote><p>「しかし、時が満ちると、<strong>神は、<mark>その御子</mark>（独り子）を<mark>女から</mark></strong>、しかも律法の下に<strong><mark>生まれた者として</mark>お遣わしになりました</strong>」（<a href="https://bibleox.com/ja/jp-ni/gal/4/#L4">ガラ. 4:4</a>）</p></blockquote><p>独り子、神の言は、真に受肉されました。</p><blockquote><p>「<strong><mark>言は肉となって</mark></strong>、わたしたちの間に宿られた。わたしたちはその栄光を見た。それは<strong>父の独り子</strong>としての栄光であって、恵みと真理とに満ちていた」（<a href="https://bibleox.com/ja/jp-ni/in/1/#L14">ヨハ. 1:14</a>）</p></blockquote><p>大天使ガブリエルは、おとめマリアの子をはっきりと神の子と呼んでいます。</p><blockquote><p>「天使は答えた。『聖霊があなたに降り、いと高き方の力があなたを包む。だから、生まれる子は聖なる者、<strong><mark>神の子</mark></strong>と呼ばれる』」（<a href="https://bibleox.com/ja/jp-ni/lk/1/#L35">ルカ. 1:35</a>）</p></blockquote><h3>おとめマリアは神の子の母である</h3><p>預言者洗礼者ヨハネの母である義なるエリサベトは、おとめマリアをはっきりと神の母と呼んでいます。</p><blockquote><p>「<strong><mark>わたしの主のお母さま</mark></strong>がわたしのところに来てくださるとは、どういうわけでしょう」（<a href="https://bibleox.com/ja/jp-ni/lk/1/#L43">ルカ. 1:43</a>）</p></blockquote><blockquote><p>「家に入ってみると、幼子は<strong><mark>母</mark></strong>マリアと共におられた。彼らはひれ伏して幼子を拝み」（<a href="https://bibleox.com/ja/jp-ni/mf/2/#L11">マタ. 2:11</a>）</p></blockquote><blockquote><p>「<strong><mark>イエスは、母</mark></strong>とそのそばにいる愛する弟子<strong><mark>とを見て</mark></strong>、<strong><mark>母に</mark></strong>、『婦人よ、御覧なさい。あなたの子です』と言われた」（<a href="https://bibleox.com/ja/jp-ni/in/19/#L26">ヨハ. 19:26</a>）</p></blockquote><blockquote><p>「しかし、<strong><mark>母は</mark></strong>召し使いたちに、『この人が何か言いつけたら、そのとおりにしてください』と言った」（<a href="https://bibleox.com/ja/jp-ni/in/2/#L5">ヨハ. 2:5</a>）</p></blockquote><blockquote><p>「三日目に、ガリラヤのカナで婚礼があって、<strong><mark>イエスの母</mark></strong>がそこにいた」（<a href="https://bibleox.com/ja/jp-ni/in/2/#L1">ヨハ. 2:1</a>）</p></blockquote><p>（<a href="https://bibleox.com/ja/jp-ni/mf/2/#L14">マタ. 2:14</a>; <a href="https://bibleox.com/ja/jp-ni/mf/2/#L20">マタ. 2:20</a>; <a href="https://bibleox.com/ja/jp-ni/mf/2/#L21">マタ. 2:21</a>; <a href="https://bibleox.com/ja/jp-ni/mf/12/#L46">マタ. 12:46</a>; <a href="https://bibleox.com/ja/jp-ni/mk/3/#L31">マコ. 3:31</a>; <a href="https://bibleox.com/ja/jp-ni/lk/2/#L33">ルカ. 2:33</a>; <a href="https://bibleox.com/ja/jp-ni/lk/2/#L34">ルカ. 2:34</a>; <a href="https://bibleox.com/ja/jp-ni/lk/2/#L43">ルカ. 2:43</a>; <a href="https://bibleox.com/ja/jp-ni/lk/2/#L48">ルカ. 2:48</a>; <a href="https://bibleox.com/ja/jp-ni/lk/2/#L51">ルカ. 2:51</a>; <a href="https://bibleox.com/ja/jp-ni/lk/8/#L19">ルカ. 8:19</a>; <a href="https://bibleox.com/ja/jp-ni/in/2/#L3">ヨハ. 2:3</a>; <a href="https://bibleox.com/ja/jp-ni/in/2/#L12">ヨハ. 2:12</a>; <a href="https://bibleox.com/ja/jp-ni/in/19/#L25">ヨハ. 19:25</a>; <a href="https://bibleox.com/ja/jp-ni/in/19/#L26">ヨハ. 19:26</a>; <a href="https://bibleox.com/ja/jp-ni/act/1/#L14">使. 1:14</a>）</p><p>神の子が永遠に人となられたのなら（そしてそれは真実です）、おとめマリアは永遠に神の子の母となったのです。</p><h3>神の子はおとめマリアの子である</h3><blockquote><p>「<strong><mark>男の子が生まれるまで</mark></strong>マリアと関係することはなかった。そして、その子をイエスと名付けた」（<a href="https://bibleox.com/ja/jp-ni/mf/1/#L25">マタ. 1:25</a>）<em>（ビザンティン本文（多数派写本）では「彼女が<strong>その初子である男の子を産むまで</strong>」〔ἕως οὗ ἔτεκεν τὸν υἱὸν αὐτῆς τὸν πρωτότοκον〕です。）</em></p></blockquote><h3>おとめマリアは生神女である</h3><p>おとめマリアはイエス・キリストを産みました。</p><p>神の子イエス・キリストは<a href="https://bibleox.com/ja/ja/w/イエス・キリスト__神/">わたしたちの神</a>です。</p><p>おとめマリアが産んだ方は<a href="https://bibleox.com/ja/ja/w/イエス・キリスト__神/">わたしたちの神</a>です。つまり、彼女は神を産んだ者、すなわち生神女（神を産んだ者）なのです。</p><p>おとめマリアは、時間と空間の外に存在する永遠の神の本性を産んだのではなく、神の子の人の本性を産みました。それは<a href="https://bibleox.com/ja/ja/w/Xr2m_始まりなき神の子が人の子として始まる/">始まりを持ち</a>、その存在のまさに初めから、完全に神の子（神）の位格に属していたのです。</p><p>手短に言えば、おとめマリアはその人性において神を産んだのです。</p><p>しかし、生神女の偉大さは、まさに彼女が神の母となるよう選ばれたことにあります。功績は産んだことにあるのではありません。多くの人が子を産むからです。そうではなく、神がマリアの性質を前もって知り（<a href="https://bibleox.com/ja/jp-ni/rim/8/#L29">ロマ. 8:29</a>）、かつて存在したすべての人々の中から、ほかのだれでもなく、まさにおとめマリアを選ばれたことにあるのです。</p><h2>生神女はおとめであり、おとめであり続ける</h2><h3>イエス・キリストの誕生前のマリアの処女性</h3><p>おとめマリアは義なるヨセフと夫婦の関係を持ちませんでした。ヨセフと婚約していたので（<a href="https://bibleox.com/ja/jp-ni/lk/1/#L27">ルカ. 1:27</a>）、夫婦の関係を持たないのに、どうして自分に子が生まれることがありうるのか、彼女にはわかりませんでした。</p><blockquote><p>「マリアは天使に言った。『どうして、そのようなことがありえましょうか。<strong><mark>わたしは男の人を知りませんのに</mark></strong>』」（<a href="https://bibleox.com/ja/jp-ni/lk/1/#L34">ルカ. 1:34</a>）</p></blockquote><p>また注目すべきなのは、この問いは、おとめマリアが処女性を守るという誓いを神に立てていた場合にだけ意味をなすということです。そうでなければ、おとめマリアがそれまで義なるヨセフと夫婦の関係を持っていなかったとしても、神の天使が彼女に子が生まれると告げたとき、明らかに彼女は神に従い、予告が実現するように夫と夫婦の関係を持てばよかったはずです。しかし、もしおとめマリアが処女の生活を送ると神に約束していたのなら、すぐに次の問いが生じます。「神に立てた誓いを破ってはならないのに（<a href="https://bibleox.com/ja/jp-ni/chis/30/#L3">民. 30:3</a>）、どうして子が生まれることがありうるのか」。</p><p>天使は、マリアに予告されたことは、夫なしに、神の力の奇跡的な働きによって起こると答えました。</p><blockquote><p>「天使は答えた。『<strong>聖霊があなたに降り、いと高き方の力があなたを包む</strong>。だから、生まれる子は聖なる者、神の子と呼ばれる』」（<a href="https://bibleox.com/ja/jp-ni/lk/1/#L35">ルカ. 1:35</a>）</p></blockquote><p>イエス・キリストは、人々の考えの中でだけヨセフの子でした。</p><blockquote><p>「イエスが宣教を始められたときはおよそ三十歳であった。<strong>イエスはヨセフの子と<mark>思われていた</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/lk/3/#L23">ルカ. 3:23</a>）</p></blockquote><p>実際には、キリストはヨセフからではなく、聖霊の力によって宿られたのです。</p><h3>イエス・キリストの誕生後のマリアの処女性</h3><p>マリアの永遠の処女性（今日に至るまでの処女性）、すなわち彼女からただ一人の子だけが生まれるという預言。その子とはイエス・キリスト、すなわち神であり、神は門を通るように、おとめマリア、生神女を通してわたしたちの世界に入られたのです。</p><blockquote><p>「それから、彼はわたしを東に面した聖所の外の門の方へ連れ戻した。門は閉じられていた。主はわたしに言われた。『<strong><mark>この門は閉じられたままにしておく</mark>。開いてはならない。<mark>だれもここを通ってはならない。イスラエルの神、主がここから入られたからである。それゆえ、閉じられたままにしておく</mark></strong>』」（<a href="https://bibleox.com/ja/jp-ni/iez/44/#L1-2">エゼ. 44:1-2</a>）</p></blockquote><p>このように、おとめマリアはイエス・キリストのほかには子を産みませんでした。そして同時に、マリアの処女性は損なわれなかったのです。</p><p>また注目すべきなのは、十字架につけられた日に、キリストが御自分の母の世話を、愛する弟子である神学者ヨハネに委ねておられることです（<a href="https://bibleox.com/ja/jp-ni/in/19/#L26-27">ヨハ. 19:26-27</a>）。これは、おとめマリアの唯一の子であるキリストのほかに、彼女の世話をしなければならないはずの夫もほかの子もいなかったことを示しています。</p><p>義なるヨセフは、キリストの降誕の時にすでに年老いており、それゆえキリストが十字架につけられる時にはとうに亡くなっていました。そして実際、イエス・キリストの幼少期の記述の後、ヨセフはもはや聖書に言及されていません。</p><p>おとめマリアがヨハネに委ねられたのは、まさに彼がほかの使徒たちよりも長く地上に生きることになっていたからです。主御自身が、使徒ペトロはキリストのために苦しみを受けるが、使徒ヨハネはずっと長く生きることを示しておられます（<a href="https://bibleox.com/ja/jp-ni/in/21/#L22">ヨハ. 21:22</a>）。知られているとおり、ヨハネは使徒たちの中で最も若く、1世紀の終わりまで地上で働きましたが、ほかの使徒たちは致命の死を遂げました。それによって使徒ヨハネは、ほかのだれよりも長くおとめマリアの世話をすることができたのです。</p><p>この事実もまた、おとめマリアには彼女の世話をすることのできるほかの子がいなかったことを示しています。</p><h2>すべての世代が生神女を幸いな者と呼ぶ</h2><p>生神女は幸いな者と呼ばれます。神は彼女に偉大なことをなさいました。</p><blockquote><p>「<strong>身分の低い</strong>、この主のはしためにも目を留めてくださったからです。今から後、<strong><mark>いつの世の人もわたしを幸いな者と言うでしょう（μακαριοῦσίν）</mark></strong>、<strong>力ある方が、わたしに<mark>偉大なことをなさいました</mark></strong>から。その御名は尊く」（<a href="https://bibleox.com/ja/jp-ni/lk/1/#L48-49">ルカ. 1:48-49</a>）</p></blockquote><p>同じような言葉が、キリスト御自身についても見られます。</p><blockquote><p>「王の名がとこしえに続き太陽のある限り、その名が栄えますように。国々の民は皆、彼によって祝福を受け<strong>彼を幸いな人と呼びますように（μακαριοῦσιν）</strong>」（<a href="https://bibleox.com/ja/jp-ni/ps/72/#L17">詩. 72:17</a>）</p></blockquote><h2>キリストと御自分の母との特別な関係</h2><h3>神の子は、おとめマリアを御自分の母として敬われる</h3><p>神の子は律法の下に生まれました。</p><blockquote><p>「神は、その御子（独り子）を女から、<strong><mark>しかも律法の下に生まれた者として</mark></strong>お遣わしになりました」（<a href="https://bibleox.com/ja/jp-ni/gal/4/#L4">ガラ. 4:4</a>）</p></blockquote><p>神は父と母を敬うよう命じておられます。</p><blockquote><p>「<strong>あなたの父<mark>母を敬え</mark></strong>。そうすればあなたは、あなたの神、主が与えられる土地に長く生きることができる」（<a href="https://bibleox.com/ja/jp-ni/ish/20/#L12">出. 20:12</a>; <a href="https://bibleox.com/ja/jp-ni/vtor/5/#L16">申. 5:16</a>; <a href="https://bibleox.com/ja/jp-ni/ish/21/#L17">出. 21:17</a>; <a href="https://bibleox.com/ja/jp-ni/lev/20/#L9">レビ. 20:9</a>; <a href="https://bibleox.com/ja/jp-ni/ish/21/#L15">出. 21:15</a>）</p></blockquote><blockquote><p>「『&lt;…&gt; <strong>父<mark>母を敬え</mark></strong>』という掟をあなたは知っているはずだ」（<a href="https://bibleox.com/ja/jp-ni/lk/18/#L20">ルカ. 18:20</a>）</p></blockquote><blockquote><p>「更に、イエスは言われた。『あなたたちは自分の言い伝えを大事にして、よくも<strong>神の掟</strong>をないがしろにしたものである。&lt;…&gt; それなのに、あなたたちは言っている。「もし、だれかが父または母に対して、「あなたに差し上げるべきものは、何でもコルバン、つまり神への供え物です」と言えば、その人はもはや父または<strong><mark>母に対して何もしないで済むのだ</mark></strong>」と』」（<a href="https://bibleox.com/ja/jp-ni/mk/7/#L9,11-12">マコ. 7:9,11-12</a>）</p></blockquote><p>宇宙のどの存在も、おとめマリアのほかには、神の子の母ではありません。この点で、天使と人々の中のだれも、おとめマリアより上にはいません。神の子御自身、神御自身が、彼女を御自分の母として敬っておられるからです。</p><h3>キリストは御自分の母の言うことを聞かれる</h3><p>キリストは、宣教と奇跡（御自分の栄光を現すこと）の時はまだ来ていないと指摘されますが、母の願いのゆえに最初の奇跡を行われます。</p><blockquote><p>「ぶどう酒が足りなくなったので、<strong>母がイエスに、『ぶどう酒がなくなりました』と言った</strong>。イエスは母に言われた。<strong><mark>『婦人よ、わたしとどんなかかわりがあるのです。わたしの時はまだ来ていません。』</mark></strong>しかし、母は召し使いたちに、『この人が何か言いつけたら、そのとおりにしてください』と言った。&lt;…&gt; <strong>イエスが、『水がめに水をいっぱい入れなさい』と言われると、召し使いたちは、かめの縁まで水を満たした。イエスは、『さあ、それをくんで宴会の世話役のところへ持って行きなさい』と言われた</strong>。召し使いたちは運んで行った。&lt;…&gt; <strong><mark>イエスは、この最初のしるしを</mark></strong>ガリラヤのカナで<strong><mark>行って、その栄光を現された</mark></strong>。それで、弟子たちはイエスを信じた」（<a href="https://bibleox.com/ja/jp-ni/in/2/#L3-5,7-8,11">ヨハ. 2:3-5,7-8,11</a>）</p></blockquote><h3>キリストは御自分の母を気遣われる</h3><p>十字架の残酷な苦しみの中で、キリストは御自分の母に配慮を示されます。</p><blockquote><p><em>「イエスは、母とそのそばにいる愛する弟子とを見て、</em><strong><em>母に、『婦人よ、御覧なさい。あなたの子です』と言われた。それから弟子に言われた。『見なさい。あなたの母です。』そのときから、<mark>この弟子はイエスの母を自分の家に引き取った</mark></em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/in/19/#L26-27"><em>ヨハ. 19:26-27</em></a><em>）</em></p></blockquote><h3>キリストと御自分の母との個人的な関係の性格</h3><p>最も恐ろしい時、十字架の上で恐ろしい体の苦しみ、裏切り、弟子たちの逃亡、人としての見捨てられた感覚（三時の「<em>エロイ、エロイ、レマ、サバクタニ。」これは、「わが神、わが神、</em><strong><em>なぜわたしをお見捨てになったのですか</em></strong><em>」という意味である</em>」<a href="https://bibleox.com/ja/jp-ni/mk/15/#L34">マコ. 15:34</a>）に耐えながら、主は最後まで御自分に従ってきた母を気遣われます。</p><p>この最も苦しい時に、主は御自分の母に注意を向け、母に特別な配慮を示し、母を愛する弟子に委ねられます。それも単に「彼女の面倒を見てくれ、世話をしてくれ」というのではなく、「あなたの母」として受け入れよ、というのです。</p><blockquote><p>「イエスは、母とそのそばにいる愛する弟子とを見て、母に、『婦人よ、御覧なさい。あなたの子です』と言われた。それから弟子に言われた。<strong>『見なさい。あなたの母です。』</strong>そのときから、この弟子はイエスの母を自分の家に引き取った」（<a href="https://bibleox.com/ja/jp-ni/in/19/#L26-27">ヨハ. 19:26-27</a>）</p></blockquote><p>注目しましょう。キリストが「ここにわたしの母、わたしの兄弟がいる」（<a href="https://bibleox.com/ja/jp-ni/mf/12/#L48-50">マタ. 12:48-50</a>）と言って指し示したあの人々は皆、キリストを独りにしましたが（<a href="https://bibleox.com/ja/jp-ni/in/16/#L32">ヨハ. 16:32</a>）、母は最後までキリストと共にいたのです。</p><blockquote><p>「だが、あなたがたが散らされて自分の家に帰ってしまい、<strong>わたしをひとりきりにする</strong>時が来る。いや、既に来ている。しかし、わたしはひとりではない。父が、共にいてくださるからだ」（<a href="https://bibleox.com/ja/jp-ni/in/16/#L32">ヨハ. 16:32</a>）</p></blockquote><blockquote><p>「わたしをお遣わしになった方は、わたしと共にいてくださる。<strong>わたしをひとりにしてはおかれない</strong>。<strong>わたしは、いつもこの方の御心に適うことを行うからである</strong>」（<a href="https://bibleox.com/ja/jp-ni/in/8/#L29">ヨハ. 8:29</a>）</p></blockquote><p>そしてキリストも、同じ理由で御自分の母を独りにされなかったのです。</p><h3>神の母が最後までキリストと共にいたことは大切か</h3><p>使徒パウロも死を前にして、同じような見捨てられる経験をしました。</p><blockquote><p>「あなたも知っているように、<strong>アジア州の人々は皆、わたしから離れ去りました。</strong>その中にはフィゲロとヘルモゲネスがいます」（<a href="https://bibleox.com/ja/jp-ni/2tim/1/#L15">２テモ. 1:15</a>）</p></blockquote><blockquote><p>「デマスは<strong>この世を愛し、わたしを見捨てて</strong>テサロニケに行ってしまい、クレスケンスはガラテヤに、テトスはダルマティアに行っているからです。<strong>ルカだけがわたしのところにいます</strong>」（<a href="https://bibleox.com/ja/jp-ni/2tim/4/#L10-11">２テモ. 4:10-11</a>）</p></blockquote><p>神の母は、まさに初めから最後まで、すべてにおいて神に対して注意深く、従順で、忠実でした。彼女はいつも神と共にあり、今も共にあるのです。</p><h2>反論への応答</h2><h3>しかし「生神女」という語は聖書にない</h3><p>「三位一体」という語も聖書にはありませんが、それがどうしたというのでしょう。聖書は、「生神女」という語が語っていることと同じことを語っています。おとめマリアはイエス・キリストの母です。イエス・キリストは神です。おとめマリアはイエス・キリストを産みました。すなわち、明らかにその人性において、神を産んだのです。彼女から生まれた方は神です。おとめマリアは神を産んだ者、手短に言えば生神女なのです。</p><h3>「あなたを宿した胎は幸い」</h3><p>人々は生神女を、その血縁のゆえに、キリストを産み育てたゆえにほめたたえましたが、キリスト御自身はこの理解を正され（強調点を置かれ）、神の言葉に対する特別な注意深さと神への完全な謙遜な従順のゆえに、御自分の母が偉大であることを指し示されました。</p><blockquote><p>「イエスがこれらのことを話しておられると、ある女が群衆の中から声高らかに言った。<strong>『なんと幸いなことでしょう、あなたを宿した胎、あなたが吸った乳房は。』</strong>しかし、イエスは言われた。『むしろ、<strong><mark>幸いなのは</mark></strong>神の言葉を<strong><mark>聞き</mark></strong>、それを<strong><mark>守る</mark></strong>人である』」（<a href="https://bibleox.com/ja/jp-ni/lk/11/#L27-28">ルカ. 11:27-28</a>）</p></blockquote><blockquote><p>「しかし、<strong>マリアは<mark>これらの出来事をすべて</mark>心に納めて、思い巡らしていた</strong>」（<a href="https://bibleox.com/ja/jp-ni/lk/2/#L19">ルカ. 2:19</a>）</p></blockquote><blockquote><p>「それから、イエスは一緒に下って行き、ナザレに帰り、両親に仕えてお暮らしになった。<strong>母は<mark>これらのことをすべて</mark></strong>心に<strong><mark>納めていた</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/lk/2/#L51">ルカ. 2:51</a>）</p></blockquote><h3>「わたしの母とはだれか。わたしの兄弟とはだれか」</h3><p>ここでもキリストは強調点を置いておられます。おとめマリアの偉大さは、人々が考えていたような血縁にあるというより、神の御心を無条件に果たしたことにあるのです。</p><blockquote><p>「そこで、ある人がイエスに、『御覧なさい。母上と御兄弟たちが、お話ししたいと外に立っておられます』と言った。しかし、イエスはその人にお答えになった。<strong>『わたしの母とはだれか。わたしの兄弟とはだれか。』</strong>そして、弟子たちの方を指して言われた。『見なさい。ここにわたしの母、わたしの兄弟がいる。<strong><mark>だれでも、わたしの天の父の御心を行う人が、わたしの兄弟、姉妹、また母である</mark></strong>』」（<a href="https://bibleox.com/ja/jp-ni/mf/12/#L47-50">マタ. 12:47-50</a>）</p></blockquote><h3>「男の子が生まれるまでマリアと関係することはなかった」（マタ. 1:25）</h3><blockquote><p>「<strong>男の子が生まれる<mark>まで</mark>マリアと関係することはなかった</strong>。そして、その子をイエスと名付けた」（<a href="https://bibleox.com/ja/jp-ni/mf/1/#L25">マタ. 1:25</a>）<em>（ギリシア語 ἕως οὗ —「〜まで」）</em></p></blockquote><p>「生まれるまで関係することはなかった」という表現は、キリストの誕生の後に彼が彼女と「関係した」ことを意味しません。これは聖書によく見られる表現で、その後に何かが変わったことを意味するものではありません。</p><p>たとえば：</p><blockquote><p>「あなたがたに命じておいたことをすべて守るように教えなさい。<strong>わたしは世の終わり<mark>まで</mark>、いつもあなたがたと共にいる</strong>」（<a href="https://bibleox.com/ja/jp-ni/mf/28/#L20">マタ. 28:20</a>）<em>（ギリシア語 ἕως —「〜まで」）</em></p></blockquote><p>— しかし、世の終わりの後も、明らかにキリストは御自分を信じる者たちと共におられます。</p><blockquote><p>「イエスは言われた。『<strong>光は、いましばらく、あなたがたの間にある</strong>。暗闇に追いつかれないように、光のあるうちに歩きなさい。暗闇の中を歩く者は、自分がどこへ行くのか分からない。光の子となるために、<strong>光のある<mark>うちに</mark>、光を信じなさい</strong>。』イエスはこれらのことを話してから、立ち去って彼らから身を隠された」（<a href="https://bibleox.com/ja/jp-ni/in/12/#L35-36">ヨハ. 12:35-36</a>）</p></blockquote><p>— しかし、キリストの昇天の後も、光（キリスト）を信じなければなりません。</p><blockquote><p>「キリストは<strong>すべての敵を御自分の足の下に置く<mark>まで</mark>、国を支配されること</strong>になっているからです」（<a href="https://bibleox.com/ja/jp-ni/1kor/15/#L25">１コリ. 15:25</a>）</p></blockquote><p>— しかし、敵が置かれた後も、明らかにキリストは支配されます（<a href="https://bibleox.com/ja/jp-ni/lk/1/#L33">ルカ. 1:33</a>; <a href="https://bibleox.com/ja/jp-ni/2pet/1/#L11">２ペト. 1:11</a>）。</p><blockquote><p>「わが主に賜った主の御言葉。<strong>『わたしの右の座に就くがよい。わたしはあなたの敵をあなたの足台としよう』</strong>」（<a href="https://bibleox.com/ja/jp-ni/ps/110/#L1">詩. 110:1</a>）<em>（ヘブライ語原文では「あなたの敵をあなたの足台とする<strong>まで</strong>（עַד）、わたしの右の座に就け」です。）</em></p></blockquote><p>— しかし、敵がその足の下に置かれた後も、明らかにキリストは父の右に座られる、すなわち支配されます。</p><blockquote><p>「ティアティラの人たちの中にいて、この女の教えを受け入れず、サタンのいわゆる奥深い秘密を知らないあなたがたに言う。わたしは、あなたがたに別の重荷を負わせない。ただ、<strong>わたしが行くとき<mark>まで</mark>、今持っているものを固く守れ</strong>」（<a href="https://bibleox.com/ja/jp-ni/otkr/2/#L24-25">黙. 2:24-25</a>）</p></blockquote><p>— しかし、キリストの来臨の後も、明らかに徳と信仰を固く守らなければなりません。</p><blockquote><p>「サウルの娘ミカルは、<strong>子を持つことのないまま、死の日を迎えた</strong>」（<a href="https://bibleox.com/ja/jp-ni/2ts/6/#L23">サム下. 6:23</a>）<em>（七十人訳ギリシア語 ἕως —「死の日まで」）</em></p></blockquote><p>— しかし、死の後も、明らかにミカルには子がありませんでした。</p><p>次のような聖書の箇所にも注意を払う価値があります。</p><blockquote><p>「『見よ、わたしの選んだ僕。わたしの心に適った愛する者。この僕にわたしの霊を授ける。彼は異邦人に正義を知らせる。彼は争わず、叫ばず、その声を聞く者は大通りにはいない。<strong>正義を勝利に導く<mark>まで</mark>、彼は傷ついた葦を折らず、くすぶる灯心を消さない</strong>』」（<a href="https://bibleox.com/ja/jp-ni/mf/12/#L18-20">マタ. 12:18-20</a>）<em>（ギリシア語 ἕως ἂν —「〜まで」）</em></p></blockquote><h3>彼女は初子を産んだ — それならほかにも子がいたのか</h3><p>聖書では、生神女の子は初子と呼ばれています。</p><blockquote><p>「<strong>男の子が</strong>生まれるまでマリアと関係することはなかった。そして、その子をイエスと名付けた」（<a href="https://bibleox.com/ja/jp-ni/mf/1/#L25">マタ. 1:25</a>）<em>（ビザンティン本文では「その<mark>初子*</mark>である男の子を産むまで」）</em></p></blockquote><p>*「初子」という語はシナイ写本とバチカン写本にはなく、新共同訳もこれに従っています。しかし、この語はルカ 2:7 にあります。</p><blockquote><p>「<strong><mark>初めての子</mark>を産み</strong>、布にくるんで飼い葉桶に寝かせた。宿屋には彼らの泊まる場所がなかったからである」（<a href="https://bibleox.com/ja/jp-ni/lk/2/#L7">ルカ. 2:7</a>）<em>（ギリシア語 πρωτότοκον —「初子」）</em></p></blockquote><p>正教会の教えに反対する人々は、これをおとめマリアにはほかの子もいたことのしるしと考え、「<em>初子がいるのなら、ほかの子もいるはずだ</em>」と言います。この考えが誤りであることは、聖書自身が示しています。</p><p>神御自身が聖書の中で<strong>「初子」という語の定義、すなわちすべての肉の胎を開くもの</strong>を示しておられます。</p><blockquote><p>「人であれ、家畜であれ、主にささげられる生き物の<strong><mark>初子</mark></strong>はすべて、あなたのものとなる。ただし、<strong><mark>人の初子</mark></strong>は必ず贖わねばならない。また、汚れた家畜の<strong><mark>初子</mark></strong>も贖わねばならない」（<a href="https://bibleox.com/ja/jp-ni/chis/18/#L15">民. 18:15</a>）<em>（「初子」は、ヘブライ語原文では כָּל־פֶּטֶר רֶחֶם —「胎を開くすべてのもの」です。）</em></p></blockquote><blockquote><p>「<strong><mark>初めに胎を開くものはすべて</mark></strong>、わたしのものである。あなたの家畜である牛や羊の初子が雄であるならば、すべて別にしなければならない。ただし、ろばの初子の場合は、小羊をもって贖わねばならない。もし贖わない場合は、その首を折りなさい。<strong><mark>あなたの初子のうち、男の子はすべて</mark></strong>贖わねばならない。何も持たずに、わたしの前に出てはならない」（<a href="https://bibleox.com/ja/jp-ni/ish/34/#L19-20">出. 34:19-20</a>）</p></blockquote><p>すべての初子は神に属しています。それゆえ：</p><ol><li><p>人の初子は神殿に連れて来て、祭司たちから贖い戻さなければなりませんでした。</p></li><li><p>清い動物の初子は神殿に連れて来て引き渡され、殺されて神へのいけにえとしてささげられました。</p></li><li><p>汚れた動物の初子はいけにえとしてささげることができなかったので、贖わなければなりませんでした。</p></li></ol><p>人であれ家畜であれ、最初の子が生まれるとすぐ、それは神への献げ物として連れて来られるか、贖われなければなりませんでした。そして、その瞬間にはこの生まれたばかりの子は一人っ子であることは明らかですが、神はそれを初子と呼んでおられます。胎を開いたからです。つまり、<strong>一人っ子はすべて初子です</strong>が、初子がすべて一人っ子であるわけではありません[2]。</p><p>そして、もし教会の教えに反対する人々のように、兄弟や姉妹がいる者だけが初子と呼ばれると考えるなら、最初の子を産んだ人々は祭司にこう言わなければならないことになります。「二人目が生まれるまで待ってください。そうすればこの子が初子と呼ばれるでしょう。今のところこの子は初子ではなく一人っ子なので、神のもとに連れて来て贖う必要はありません」。しかし、このばかげた考えもまた聖書と常識に反しています。独り子である救い主は、まさに初子についてのこの律法に従って神殿に連れて来られたからです。</p><blockquote><p>「さて、<strong>モーセの律法に定められた</strong>彼らの清めの期間が過ぎたとき、<strong>両親はその子を主に献げるため、エルサレムに連れて行った</strong>」（<a href="https://bibleox.com/ja/jp-ni/lk/2/#L22">ルカ. 2:22</a>）</p></blockquote><p>ここで主イエス・キリストが<strong>一人っ子</strong>であることは明らかですが、それでも<strong>初子</strong>として神殿に連れて来られています。つまり、この場合の初子とは、神の言葉に従えば、すべての肉の胎を開くものを意味しているのであって、母にほかの子が生まれたかどうかを示しているのではないのです。</p><h3>イエス・キリストの兄弟たち</h3><p>聖書には、キリストに兄弟がいたと書かれています。</p><blockquote><p>「この人は大工の息子ではないか。母親はマリアといい、<strong>兄弟は</strong>ヤコブ、ヨセフ、シモン、ユダではないか」（<a href="https://bibleox.com/ja/jp-ni/mf/13/#L55">マタ. 13:55</a>）</p></blockquote><blockquote><p>「<strong>兄弟たちも</strong>、イエスを信じていなかったのである」（<a href="https://bibleox.com/ja/jp-ni/in/7/#L5">ヨハ. 7:5</a>）</p></blockquote><blockquote><p>「イエスの母と<strong>兄弟たち</strong>が来て外に立ち、人をやってイエスを呼ばせた」（<a href="https://bibleox.com/ja/jp-ni/mk/3/#L31">マコ. 3:31</a>）</p></blockquote><blockquote><p>「わたしたちには、他の使徒たちや<strong>主の兄弟たち</strong>やケファのように、信者である妻を連れて歩く権利がないのですか」（<a href="https://bibleox.com/ja/jp-ni/1kor/9/#L5">１コリ. 9:5</a>）</p></blockquote><p>ここで言われているのは、ヨセフの最初の結婚による兄弟たち、あるいは単に親類のことです。親類はだれでも単に兄弟と呼ばれます。たとえば、ロトはアブラハムの甥でしたが、聖書では彼の兄弟とも呼ばれています。</p><blockquote><p>「ソドムに住んでいた<strong>アブラムの<mark>甥</mark>ロト</strong>も、財産もろとも連れ去られた」（<a href="https://bibleox.com/ja/jp-ni/gen/14/#L12">創. 14:12</a>）</p></blockquote><blockquote><p>「アブラムはロトに言った。『<strong>わたしたちは<mark>親類どうし</mark>だ</strong>。わたしとあなたの間ではもちろん、お互いの羊飼いの間でも争うのはやめよう』」（<a href="https://bibleox.com/ja/jp-ni/gen/13/#L8">創. 13:8</a>）<em>（「親類どうし」は、ヘブライ語原文では אֲנָשִׁים אַחִים、七十人訳ギリシア語では ἀδελφοὶ —「兄弟」です。）</em></p></blockquote><p>マリアが後見人としてヨセフと婚約したとき、ヨセフはすでに年老いていました。マリアは夫なしでいることができなかったからです。もしマリアが知られた夫を持たないうちにキリストが彼女から生まれたなら、律法によれば彼女は石で打ち殺されなければならなかったでしょう（<a href="https://bibleox.com/ja/jp-ni/vtor/22/#L20-21">申. 22:20-21</a>）。だれもが、彼女が不品行な（婚外の）関係を持ったと思ったでしょうから。それゆえ主は、マリアに夫がいるように取り計らわれましたが、彼女は夫なしに、聖霊が降ることによって奇跡的に身ごもったのです（<a href="https://bibleox.com/ja/jp-ni/mf/1/#L18-25">マタ. 1:18-25</a>; <a href="https://bibleox.com/ja/jp-ni/lk/1/#L34-35">ルカ. 1:34-35</a>）。</p><p>イエスの幼少期の後、婚約者ヨセフはもはや聖書に言及されていませんが、おとめマリアはイエス・キリストに最後まで、十字架の苦しみまで付き従い（<a href="https://bibleox.com/ja/jp-ni/in/19/#L25-26">ヨハ. 19:25-26</a>）、復活の後、五旬祭の日の前にも言及されています（<a href="https://bibleox.com/ja/jp-ni/act/1/#L14">使. 1:14</a>）。</p><p>キリストは御自分の母を、愛する弟子ヨハネに委ねられます（<a href="https://bibleox.com/ja/jp-ni/in/19/#L27">ヨハ. 19:27</a>）。明らかに、その時までにヨセフはすでに亡くなっていたのです。</p><p>つまり、イエス・キリストの兄弟たちとは単に親類のことであって、決しておとめマリアのほかの子どもたちではありません。</p><p>そして預言ははっきりと、おとめマリアからは主イエス・キリストだけが生まれると語っています。</p><blockquote><p><em>「それから、彼はわたしを東に面した聖所の外の門の方へ連れ戻した。門は閉じられていた。主はわたしに言われた。『</em><strong><em><mark>この門は閉じられたままにしておく</mark>。開いてはならない。<mark>だれもここを通ってはならない。イスラエルの神、主がここから入られたからである。それゆえ、閉じられたままにしておく</mark></em></strong><em>』」（</em><a href="https://bibleox.com/ja/jp-ni/iez/44/#L1-2"><em>エゼ. 44:1-2</em></a><em>）</em></p></blockquote><h3>初子</h3><p>キリストがおとめマリアの初子と呼ばれている節があります。</p><blockquote><p>「男の子が生まれるまでマリアと関係することはなかった。そして、その子をイエスと名付けた」（<a href="https://bibleox.com/ja/jp-ni/mf/1/#L25">マタ. 1:25</a>）<em>（ビザンティン本文では「その<strong>初子</strong>である男の子」）</em></p></blockquote><blockquote><p>「<strong>初めての子</strong>を産み、布にくるんで飼い葉桶に寝かせた。宿屋には彼らの泊まる場所がなかったからである」（<a href="https://bibleox.com/ja/jp-ni/lk/2/#L7">ルカ. 2:7</a>）</p></blockquote><p>ある人々は、ここに、初子のほかに二人目、三人目の子も彼女に生まれたことのしるしを見たいと思っています。</p><p>しかし、「初子」という語は、その子が最初に生まれたということだけを意味しています。子の数を示しているのではありません。聖書の中で、この語はまさにそのように用いられています。後に子が生まれたかどうかにかかわらず、「胎を開く」ものはすべて初子と呼ばれるのです。</p><blockquote><p>「人であれ、家畜であれ、主にささげられる生き物の<strong><mark>初子</mark></strong>はすべて、あなたのものとなる。ただし、<strong><mark>人の初子</mark></strong>は必ず贖わねばならない。また、汚れた家畜の初子も贖わねばならない」（<a href="https://bibleox.com/ja/jp-ni/chis/18/#L15">民. 18:15</a>）</p></blockquote><blockquote><p>「<strong><mark>初めに胎を開くものはすべて</mark></strong>、わたしのものである。あなたの家畜である牛や羊の初子が雄であるならば、すべて別にしなければならない。ただし、ろばの初子の場合は、小羊をもって贖わねばならない。もし贖わない場合は、その首を折りなさい。あなたの<strong><mark>初子</mark></strong>のうち、男の子はすべて贖わねばならない。何も持たずに、わたしの前に出てはならない」（<a href="https://bibleox.com/ja/jp-ni/ish/34/#L19-20">出. 34:19-20</a>）</p></blockquote><p>母の一人っ子（ただ一人生まれた子）はすべてその母の初子ですが、初子がすべて一人っ子であるわけではありません。</p><p>このように、この語は、おとめマリアにキリストのほかに子がいたことを支持しません。また、おとめマリアが義なるヨセフと夫婦の関係を持ったことも支持しません。主イエス・キリストはおとめマリアの唯一の子です。さらに詳しく[2]。</p><h3>おとめマリアがキリストを信じなかったとは、どこにも書かれていない</h3><p>教会の批判者たちはしばしば、おとめマリアは自分の子が人々の救い主、約束されたメシア、キリストであることを信じなかったという考えを繰り返します。しかしそれはまったくの偽りです。聖書にはそのような言葉はありません。キリストを信じなかったと言われているのは、兄弟たち（異母兄弟、ヨセフの最初の結婚による子たち）だけです。</p><blockquote><p>「<strong>兄弟たちも、イエスを信じていなかった</strong>のである」（<a href="https://bibleox.com/ja/jp-ni/in/7/#L5">ヨハ. 7:5</a>）</p></blockquote><p>これは十分予想できたことでした。彼らはヨセフの最初の結婚による子たちだったからです。彼らはすでに大人であり、少年イエスが育つのを見ていました。それゆえ、キリストのほかの同郷人（ガリラヤの住民）と同じように、彼らにとって信じることは難しかったのです（<a href="https://bibleox.com/ja/jp-ni/mf/13/#L54-58">マタ. 13:54-58</a>）。しかし後に、兄弟たちも信じました（<a href="https://bibleox.com/ja/jp-ni/act/1/#L14">使. 1:14</a>; <a href="https://bibleox.com/ja/jp-ni/gal/1/#L19">ガラ. 1:19</a>）。</p><h3>王の母は女王である</h3><p>批判者たちは、教会が生神女を女王（天の女王）と呼ぶことを非難します。しかし王の母はまさに女王です。</p><blockquote><p>「諸国の王女、あなたがめでる女たちの中から<strong><mark>オフィルの金で身を飾った王妃があなたの右に立てられる</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/ps/45/#L10">詩. 45:10</a>）</p></blockquote><p>使徒たちは、御国でキリストの右と左に座る権利を拒まれました。</p><blockquote><p>「しかし、<strong><mark>わたしの右や左にだれが座るかは</mark>、わたしの決めることではない。それは、定められた人々に許されるのだ</strong>」（<a href="https://bibleox.com/ja/jp-ni/mk/10/#L40">マコ. 10:40</a>）</p></blockquote><p>使徒たちが「座る」のでないなら、だれが座るのでしょうか。正教会では「最後の審判」のイコンに、キリストのそばに、まさに生神女（右）と預言者洗礼者ヨハネ（左）が、女から生まれた者のうちで最も偉大な者として描かれています（<a href="https://bibleox.com/ja/jp-ni/mf/11/#L11">マタ. 11:11</a>）。</p><h3>「至聖なる生神女よ、われらを救いたまえ」という言葉</h3><p>ここでは意味を正しく理解する必要があります。救い主は一人ですが、救いの業における協力者はたくさんいます。</p><blockquote><p>「わたしたちは神のために<strong><mark>力を合わせて働く者</mark></strong>であり、あなたがたは神の畑、神の建物なのです」（<a href="https://bibleox.com/ja/jp-ni/1kor/3/#L9">１コリ. 3:9</a>）</p></blockquote><p>使徒は人々を救おうとしています。</p><blockquote><p><em>「</em><strong><em>すべての人に対してすべてのものになりました。何とかして</em></strong><em>何人かでも</em><strong><em><mark>救う</mark></em></strong><em>ためです」（</em><a href="https://bibleox.com/ja/jp-ni/1kor/9/#L22"><em>１コリ. 9:22</em></a><em>）</em></p></blockquote><blockquote><p><em>「何とかして自分の同胞にねたみを起こさせ、</em><strong><em>その幾人かでも<mark>救いたい</mark></em></strong><em>のです」（</em><a href="https://bibleox.com/ja/jp-ni/rim/11/#L14"><em>ロマ. 11:14</em></a><em>）</em></p></blockquote><p>妻は夫を救うことができ、夫は妻を救うことができます。</p><blockquote><p><em>「</em><strong><em>妻よ、あなたは夫を<mark>救えるかどうか</mark>、どうして分かるのか</em></strong><em>。</em><strong><em>夫よ、あなたは妻を<mark>救えるかどうか</mark>、どうして分かるのか</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/1kor/7/#L16"><em>１コリ. 7:16</em></a><em>）</em></p></blockquote><p>人々を救えという使徒の呼びかけ：</p><blockquote><p><em>「疑いを抱いている人たちを憐れみなさい。ほかの人たちを火の中から引き出して</em><strong><em><mark>助けなさい</mark></em></strong><em>。また、ほかの人たちを用心しながら憐れみなさい。肉によって汚れてしまった彼らの下着さえも忌み嫌いなさい」（</em><a href="https://bibleox.com/ja/jp-ni/iud/1/#L22-23"><em>ユダ. 1:22-23</em></a><em>）（「助けなさい」は、ギリシア語原文では σῴζετε —「救いなさい」です。）</em></p></blockquote><blockquote><p>「自分自身と教えとに気を配りなさい。以上のことをしっかりと守りなさい。そうすれば、あなたは自分自身と、<strong>あなたの言葉を聞く人々とを<mark>救う</mark></strong>ことになります」（<a href="https://bibleox.com/ja/jp-ni/1tim/4/#L16">１テモ. 4:16</a>）</p></blockquote><h3>「生神女の僕」という言葉</h3><p>ここでも救いの場合と同じです。意味を正しく理解しなければなりません。</p><p>わたしたちは生神女に神として仕えるのではありませんが、彼女に仕えます。もし神の母がわたしたちに何かを頼まれたなら、わたしたちは喜んで彼女に仕えるでしょう。キリスト者がそれ以外の振る舞いをすることなど想像できるでしょうか。</p><p>聖書には、義人たちが、唯一の神の僕であり続けながら、神だけでなくほかの者の僕（奴隷）とも自分を呼んでいる箇所があります。</p><p>使徒たちはキリスト者の僕です。</p><blockquote><p>「わたしたちは、自分自身を宣べ伝えるのではなく、主であるイエス・キリストを宣べ伝えています。<strong><mark>わたしたち自身は</mark></strong>、イエスのために<strong><mark>あなたがたに仕える僕なのです</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/2kor/4/#L5">２コリ. 4:5</a>）<em>（ギリシア語 δούλους —「奴隷」）</em></p></blockquote><p>預言者たちを迫害からかくまった神を畏れる人オバドヤは、自分を預言者エリヤの僕と呼び、エリヤを自分の主人と呼んでいます。</p><blockquote><p>「<em>アハブは宮廷長オバドヤを呼び寄せた――オバドヤは心から主を畏れ敬う人で、イゼベルが主の預言者を切り殺したとき、百人の預言者を救い出し、五十人ずつ洞穴にかくまい、パンと水をもって養った――。&lt;…&gt; オバドヤが道を歩いていると、エリヤが彼に会いに来た。オバドヤはそれがエリヤだと分かって、ひれ伏し、「あなたは、</em><strong><em>エリヤさま</em></strong><em>ではありませんか」と言った。エリヤは彼に言った。「そうです。あなたの主君のもとに行って、エリヤがここにいる、と言ってください。」オバドヤは言った。「わたしにどんな罪があって、あなたは</em><strong><em><mark>僕</mark></em></strong><em>をアハブの手に渡し、殺そうとなさるのですか。&lt;…&gt; しかし、わたしがあなたを離れれば、主の霊はあなたをわたしの知らないところに連れて行くでしょう。わたしがアハブに知らせに行っても、あなたが見つからなければ、わたしは殺されます。</em><strong><em><mark>僕</mark></em></strong><em>は幼いころから、主を畏れ敬っております」</em>（<a href="https://bibleox.com/ja/jp-ni/3ts/18/#L3-4,7-9,12">王上. 18:3-4,7-9,12</a>）<em>（「エリヤさま」は、ヘブライ語原文では אֲדֹנִי אֵלִיָּהוּ —「わが主人エリヤ」です。）</em></p></blockquote><h3>生神女は葬られた後によみがえらされた</h3><p>生神女の崇敬に反対する人々は、主イエス・キリストが御自分の母をよみがえらせたという正教会の聖伝に、あたかもそれが何か不可能なことであるかのように反対し、よみがえらされたのはキリストだけだと考えています。しかし、聖書の側から見て、これには何の問題もありません。キリストの復活の後、多くの聖人たちがよみがえらされたからです（この復活の性質をどのように理解するにしても）。</p><blockquote><p>「そのとき、神殿の垂れ幕が上から下まで真っ二つに裂け、地震が起こり、岩が裂け、墓が開いて、<strong><mark>眠りについていた多くの聖なる者たちの体が生き返った</mark>。そして、イエスの復活の後、墓から出て来て</strong>、聖なる都に入り、多くの人々に現れた」（<a href="https://bibleox.com/ja/jp-ni/mf/27/#L51-53">マタ. 27:51-53</a>）</p></blockquote><p>主が御自分の復活の後に多くの聖人たちを生き返らせたのなら、まして御自分の受肉のために選び、奇跡を行うときにその言うことを聞き、愛する弟子に委ねて気遣われた御自分の母を、生き返らせることがおできにならないはずがあるでしょうか。</p><p>生神女のよみがえりについての聖伝を裏付けるものとして、最も古い時代から教会が聖人たちの遺骸を敬虔に扱ってきたにもかかわらず（<a href="https://bibleox.com/ru/ru/w/%D0%BF%D0%BE%D1%87%D0%B8%D1%82%D0%B0%D0%BD%D0%B8%D0%B5-%D0%BC%D0%BE%D1%89%D0%B5%D0%B9-%D1%86%D0%B8%D1%82%D0%B0%D1%82%D1%8B-%D1%81%D0%B2%D1%8F%D1%82%D1%8B%D1%85">詳しく</a>、ロシア語）、主イエス・キリストの遺骸がないのと同じように（主は復活されたからです）、教会には生神女の遺骸がないという事情にも注目する価値があります。</p>
