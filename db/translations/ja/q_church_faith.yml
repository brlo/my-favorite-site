  - src: апостольская-вера
    path: Ap4f_使徒的信仰
    title: 使徒的信仰
    meta_desc: イエス・キリストへの使徒的信仰の必要性についての聖書の引用
    menu: { parent: "教会/信仰", title: "使徒的信仰", priority: 1 }
    body: |-
      <p>主イエス・キリストは、使徒たちの言葉による御自分への信仰について語っておられます。</p><blockquote><p>「彼らのために、わたしは自分自身をささげます。彼らも、真理によってささげられた者となるためです。また、彼らのためだけでなく、<strong>彼らの<mark>言葉によって</mark>わたしを信じる人々のためにも、お願いします。</strong>父よ、あなたがわたしの内におられ、わたしがあなたの内にいるように、<strong>すべての人を一つにしてください</strong>。彼らもわたしたちの内にいるようにしてください。そうすれば、世は、あなたがわたしをお遣わしになったことを、信じるようになります」（<a href="https://bibleox.com/ja/jp-ni/in/17/#L19-21">ヨハ. 17:19-21</a>）</p></blockquote><p>使徒たちは、一度伝えられた信仰を守る必要を繰り返し指摘しました：［<a href="https://bibleox.com/ja/ja/w/Tr4n_聖伝/">聖伝</a>］ *このページは改訂待ちです</p>

  - src: вера-во-Христа-для-всех-народов
    path: Fa6g_キリストへの信仰はすべての人のために
    title: キリストへの信仰はすべての人のために
    meta_desc: イエス・キリストへの使徒的信仰と、この信仰によるすべての民族の救いについての聖書の引用
    menu: { parent: "教会/信仰", title: "キリストへの信仰はすべての人のために", priority: 2 }
    body: |-
      <h2>すべての民族がキリストへの信仰に招かれている — 新約聖書の言葉</h2><p>キリストは使徒たちを、すべての民族、部族、どんな言葉を話す人々にも、全世界に、福音を宣べ伝えるために遣わされます。</p><blockquote><p>「<strong>だから、あなたがたは行って、すべての民をわたしの弟子にしなさい。彼らに父と子と聖霊の名によって洗礼を授け、あなたがたに命じておいたことをすべて守るように教えなさい</strong>。わたしは世の終わりまで、いつもあなたがたと共にいる」（<a href="https://bibleox.com/ja/jp-ni/mf/28/#L19-20">マタ. 28:19-20</a>）</p></blockquote><blockquote><p>「わたしたちはこの方により、その御名を広めて<strong>すべての異邦人を信仰による従順へと導くために</strong>、恵みを受けて使徒とされました」（<a href="https://bibleox.com/ja/jp-ni/rim/1/#L5">ロマ. 1:5</a>）</p></blockquote><blockquote><p>「神は、わたしの<strong>福音</strong>すなわちイエス・キリストについての<strong>宣教</strong>によって、あなたがたを強めることがおできになります。この福音は、世々にわたって隠されていた、秘められた計画を啓示するものです。その計画は今や現されて、永遠の神の命令のままに、預言者たちの書き物を通して、<strong>信仰による従順に導くため、すべての異邦人に知られるようになりました</strong>」（<a href="https://bibleox.com/ja/jp-ni/rim/16/#L25-26">ロマ. 16:25-26</a>）</p></blockquote><blockquote><p>「そして、<strong>御国のこの福音はあらゆる民への証しとして、全世界に宣べ伝えられる</strong>。それから、終わりが来る」（<a href="https://bibleox.com/ja/jp-ni/mf/24/#L14">マタ. 24:14</a>）</p></blockquote><blockquote><p>「わたしはまた、別の天使が空高く飛ぶのを見た。この天使は、<strong>地上に住む人々、あらゆる国民、種族、言葉の違う民、民族に告げ知らせるために</strong>、永遠の福音を携えて来て」（<a href="https://bibleox.com/ja/jp-ni/otkr/14/#L6">黙. 14:6</a>）</p></blockquote><h2>すべての民族がキリストへの信仰に招かれている — 旧約聖書の言葉</h2><p>アブラハムの子孫によって（その子孫の一人を通して）すべての民族が祝福されるという、アブラハムへの約束：</p><blockquote><p>「<strong>地上の諸国民はすべて</strong>、あなたの子孫によって祝福を得る。あなたがわたしの声に聞き従ったからである」（<a href="https://bibleox.com/ja/jp-ni/gen/22/#L18">創. 22:18</a>）</p></blockquote><p>すべての民族がまことの神に立ち帰るという預言：</p><blockquote><p>「主よ、あなたがお造りになった<strong>国々はすべて</strong>御前に進み出て伏し拝み、御名を尊びます」（<a href="https://bibleox.com/ja/jp-ni/ps/86/#L9">詩. 86:9</a>）</p></blockquote><blockquote><p>「すべての王が彼の前にひれ伏し<strong>すべての国が</strong>彼に仕えますように」（<a href="https://bibleox.com/ja/jp-ni/ps/72/#L11">詩. 72:11</a>）</p></blockquote><blockquote><p>「王の名がとこしえに続き太陽のある限り、その名が栄えますように。<strong>国々の民は皆、彼によって祝福を受け</strong>彼を幸いな人と呼びますように」（<a href="https://bibleox.com/ja/jp-ni/ps/72/#L17">詩. 72:17</a>）</p></blockquote><blockquote><p>「<strong>すべての国よ</strong>、主を賛美せよ。すべての民よ、主をほめたたえよ」（<a href="https://bibleox.com/ja/jp-ni/ps/117/#L1">詩. 117:1</a>）</p></blockquote><blockquote><p>「わたしは彼らの業と彼らの謀のゆえに、<strong>すべての国、すべての言葉の民</strong>を集めるために臨む。彼らは来て、わたしの栄光を見る。わたしは、彼らの間に一つのしるしをおき、彼らの中から生き残った者を諸国に遣わす。すなわち、タルシシュに、弓を巧みに引くプルとルドに、トバルとヤワンに、更にわたしの名声を聞いたことも、わたしの栄光を見たこともない、遠い島々に遣わす。彼らはわたしの栄光を国々に伝える。彼らはあなたたちのすべての兄弟を主への献げ物として、馬、車、駕籠、らば、らくだに載せ、<strong>あらゆる国民の間から</strong>わたしの聖なる山エルサレムに連れて来る、と主は言われる。それは、イスラエルの子らが献げ物を清い器に入れて、主の神殿にもたらすのと同じである、と主は言われる。<strong>わたしは彼らのうちからも祭司</strong>とレビ人を<strong>立てる</strong>、と主は言われる」（<a href="https://bibleox.com/ja/jp-ni/is/66/#L18-21">イザ. 66:18-21</a>）</p></blockquote><blockquote><p>「<strong>地の果てのすべての人々よ</strong>わたしを仰いで、<strong>救いを得よ</strong>。わたしは神、ほかにはいない」（<a href="https://bibleox.com/ja/jp-ni/is/45/#L22">イザ. 45:22</a>）</p></blockquote><blockquote><p>「わたしはあなたを国々の光とし<strong>わたしの救いを地の果てまで、もたらす者とする</strong>」（<a href="https://bibleox.com/ja/jp-ni/is/49/#L6">イザ. 49:6</a>）</p></blockquote><blockquote><p>「あなたの道をこの地が知り<strong>御救いをすべての民が知るために</strong>」（<a href="https://bibleox.com/ja/jp-ni/ps/67/#L3">詩. 67:3</a>）</p></blockquote><blockquote><p>「権威、威光、王権を受けた。<strong>諸国、諸族、諸言語の民は皆</strong>、彼に仕え彼の支配はとこしえに続きその統治は滅びることがない」（<a href="https://bibleox.com/ja/jp-ni/dan/7/#L14">ダニ. 7:14</a>）</p></blockquote><blockquote><p>「国々に主の栄光を語り伝えよ<strong>諸国の民に</strong>その驚くべき御業を」（<a href="https://bibleox.com/ja/jp-ni/1par/16/#L24">代上. 16:24</a>）</p></blockquote><blockquote><p>「こうして、<strong>地上のすべての民が</strong>、主こそ神であって、ほかに神のないことを知るに至るように」（<a href="https://bibleox.com/ja/jp-ni/3ts/8/#L60">王上. 8:60</a>）</p></blockquote><blockquote><p>「諸国の民をことごとく揺り動かし<strong>諸国のすべての民の財宝をもたらし</strong>この神殿を栄光で満たす、と万軍の主は言われる」（<a href="https://bibleox.com/ja/jp-ni/ag/2/#L7">ハガ. 2:7</a>）<em>（「財宝」と訳されているヘブライ語 חֶמְדַּת は「慕わしいもの」とも読むことができ、教会の伝統では「すべての民の慕い求める方」、すなわちメシアについての預言と理解されてきました。）</em></p></blockquote><blockquote><p>「大地が草の芽を萌えいでさせ園が蒔かれた種を芽生えさせるように<strong>主なる神はすべての民の前で恵みと栄誉を芽生えさせてくださる</strong>」（<a href="https://bibleox.com/ja/jp-ni/is/61/#L11">イザ. 61:11</a>）</p></blockquote><h2>ほかの民族の信仰は救いをもたらさない</h2><p>イエス・キリストへの使徒的信仰は救いをもたらします。ほかの民族の信仰は救いをもたらしません。</p><blockquote><p>「神は過ぎ去った時代には、<strong>すべての国の人が思い思いの道を行くままにしておかれました</strong>」（<a href="https://bibleox.com/ja/jp-ni/act/14/#L16">使. 14:16</a>）</p></blockquote><p>さらに詳しく：<a href="https://bibleox.com/ja/ja/w/phBYjemy_神は唯一である/">ほかの民族の神々は神ではない</a></p><p>同時に、イエス・キリストへの使徒的信仰と、この信仰による救いは、例外なくすべての人に開かれています。</p>

  - src: суд
    path: Jd5h_裁き
    title: 裁き
    menu: { parent: "教会/信仰", title: "裁き", priority: 5 }
    body: |-
      <h2>イエス・キリストは最後の審判ですべての人を裁かれる</h2><blockquote><p>「<strong>人の子は</strong>、父の栄光に輝いて天使たちと共に来るが、そのとき、<strong>それぞれの行いに応じて報いるのである</strong>」（<a href="https://bibleox.com/ja/jp-ni/mf/16/#L27">マタ. 16:27</a>）</p></blockquote><blockquote><p>「<strong>人の子は</strong>、栄光に輝いて天使たちを皆従えて来るとき、その栄光の座に着く。そして、すべての国の民がその前に集められると、羊飼いが羊と山羊を分けるように、<strong>彼らをより分け</strong>」（<a href="https://bibleox.com/ja/jp-ni/mf/25/#L31-32">マタ. 25:31-32</a>）</p></blockquote><blockquote><p>「また、父はだれをも裁かず、<strong>裁きは一切子に任せておられる</strong>」（<a href="https://bibleox.com/ja/jp-ni/in/5/#L22">ヨハ. 5:22</a>）</p></blockquote><blockquote><p>「つまり、<strong>ナザレのイエス</strong>のことです。神は、聖霊と力によってこの方を油注がれた者となさいました。イエスは、方々を巡り歩いて人々を助け、悪魔に苦しめられている人たちをすべていやされたのですが、それは、神が御一緒だったからです。&lt;…&gt; そしてイエスは、<strong>御自分が生きている者と死んだ者との審判者として神から定められた者であること</strong>を、民に宣べ伝え、力強く証しするようにと、わたしたちにお命じになりました」（<a href="https://bibleox.com/ja/jp-ni/act/10/#L38,42">使. 10:38,42</a>）</p></blockquote><blockquote><p>「それは、<strong>先にお選びになった一人の方によって、この世を正しく裁く日</strong>をお決めになったからです。神は<strong>この方を死者の中から復活させて</strong>、すべての人にそのことの確証をお与えになったのです」（<a href="https://bibleox.com/ja/jp-ni/act/17/#L31">使. 17:31</a>）</p></blockquote><blockquote><p>「なぜなら、わたしたちは皆、<strong>キリストの裁きの座</strong>の前に立ち、善であれ悪であれ、めいめい体を住みかとしていたときに行ったことに応じて、報いを受けねばならないからです」（<a href="https://bibleox.com/ja/jp-ni/2kor/5/#L10">２コリ. 5:10</a>）</p></blockquote><blockquote><p>「<strong>神の御前で、そして、生きている者と死んだ者を裁くために来られるキリスト・イエスの御前で</strong>、その出現とその御国とを思いつつ、厳かに命じます」（<a href="https://bibleox.com/ja/jp-ni/2tim/4/#L1">２テモ. 4:1</a>）</p></blockquote><h2>すべての人が裁きを受ける</h2><blockquote><p>「なぜなら、<strong><mark>わたしたちは皆</mark>、キリストの裁きの座の前に立ち、</strong><strong>善であれ悪であれ</strong>、めいめい体を住みかとしていたときに<strong>行ったこと</strong>に応じて、報いを受けねばならないからです」（<a href="https://bibleox.com/ja/jp-ni/2kor/5/#L10">２コリ. 5:10</a>）</p></blockquote><blockquote><p>「それなのに、なぜあなたは、自分の兄弟を裁くのですか。また、なぜ兄弟を侮るのですか。<strong><mark>わたしたちは皆</mark>、神の裁きの座の前に立つのです</strong>」（<a href="https://bibleox.com/ja/jp-ni/rim/14/#L10">ロマ. 14:10</a>）<em>（「神の」は、ビザンティン本文（多数派写本）では τοῦ Χριστοῦ —「キリストの」です。）</em></p></blockquote><blockquote><p>「自由をもたらす律法によっていずれは<strong><mark>裁かれる者として</mark></strong>、語り、またふるまいなさい」（<a href="https://bibleox.com/ja/jp-ni/iak/2/#L12">ヤコ. 2:12</a>）</p></blockquote><blockquote><p>「<strong>神は、善をも悪をも<mark>一切の業を</mark></strong>、隠れたこともすべて<strong>裁きの座に引き出されるであろう</strong>」（<a href="https://bibleox.com/ja/jp-ni/ekl/12/#L14">コヘ. 12:14</a>）</p></blockquote><blockquote><p>「<strong>人の子は</strong>、栄光に輝いて天使たちを皆従えて来るとき、<strong>その栄光の座に着く</strong>。そして、<strong><mark>すべての国の民</mark>がその前に集められると</strong>、羊飼いが<strong><mark>羊と山羊を</mark>分けるように、彼らを<mark>より分け</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/mf/25/#L31-32">マタ. 25:31-32</a>）</p></blockquote><h2>裁きは教会から始まる</h2><blockquote><p>「<strong>今こそ、<mark>神の家から</mark>裁きが始まる時です</strong>。<strong><mark>わたしたちがまず裁きを受けるのだとすれば</mark></strong>、神の福音に従わない者たちの行く末は、いったい、どんなものになるだろうか。『<strong>正しい人がやっと救われるのなら</strong>、不信心な人や罪深い人はどうなるのか』と言われているとおりです」（<a href="https://bibleox.com/ja/jp-ni/1pet/4/#L17-18">１ペト. 4:17-18</a>）</p></blockquote><blockquote><p>「わたしにとっては、<strong>あなたがたから裁かれようと、人間の法廷で裁かれようと、少しも問題ではありません。<mark>わたしは、自分で自分を裁くことすらしません</mark></strong>。自分には何もやましいところはないが、<strong>それでわたしが義とされているわけではありません。<mark>わたしを裁くのは主なのです</mark></strong>。ですから、主が来られるまでは、<strong>先走って何も裁いてはいけません</strong>。主は闇の中に隠されている秘密を明るみに出し、人の心の企てをも明らかにされます。そのとき、おのおのは神からおほめにあずかります」（<a href="https://bibleox.com/ja/jp-ni/1kor/4/#L3-5">１コリ. 4:3-5</a>）</p></blockquote><h2>キリストは、人が体のうちに生きている間に行ったことを裁かれる</h2><blockquote><p>「なぜなら、わたしたちは皆、キリストの裁きの座の前に立ち、善であれ悪であれ、めいめい<strong><mark>体を住みかとしていたときに行ったこと</mark>に応じて、報いを受けねばならない</strong>からです」（<a href="https://bibleox.com/ja/jp-ni/2kor/5/#L10">２コリ. 5:10</a>）</p></blockquote><p>裁きは、体において行われた地上の行いに基づいて行われます。</p><blockquote><p>「それから、王は左側にいる人たちにも言う。『<strong>呪われた者ども、わたしから離れ去り、悪魔とその手下のために用意してある永遠の火に入れ。お前たちは、わたしが飢えていたときに食べさせず</strong>、のどが渇いたときに飲ませず、旅をしていたときに宿を貸さず、裸のときに着せず、病気のとき、牢にいたときに、訪ねてくれなかったからだ。』すると、彼らも答える。『主よ、いつわたしたちは、あなたが飢えたり、渇いたり、旅をしたり、裸であったり、病気であったり、牢におられたりするのを見て、お世話をしなかったでしょうか。』そこで、王は答える。『はっきり言っておく。<strong>この最も小さい者の一人にしなかったのは、わたしにしてくれなかったことなのである。』こうして、この者どもは永遠の罰を受け、正しい人たちは永遠の命にあずかるのである</strong>」（<a href="https://bibleox.com/ja/jp-ni/mf/25/#L41-46">マタ. 25:41-46</a>）</p></blockquote>

  - src: бездетность
    path: Ch7i_子がないこと
    title: 子がないこと
    meta_desc: 子がないことへの向き合い方についての聖書の引用
    menu: { parent: "教会/信仰", title: "子がないこと", priority: 7 }
    body: |-
      <p>ここで語られているのは、子を持ちたいと願いながら、不妊のために持つことのできない人々のことです。</p><blockquote><p>「<strong>子を産めない体でも</strong>身を慎み、不義の関係を持たない<strong>女は幸いである</strong>。<strong>神の訪れのとき、彼女は豊かな実りを受ける</strong>」（<a href="https://bibleox.com/ja/jp-ni/prs/3/#L13">知. 3:13</a>）</p></blockquote><blockquote><p>「<strong>子がなくても、徳のある方がまさる</strong>。<strong>徳はいつまでも忘れられることがなく、神にも</strong>人にも<strong>認められるからだ</strong>」（<a href="https://bibleox.com/ja/jp-ni/prs/4/#L1">知. 4:1</a>）<em>（「いつまでも忘れられることがなく」は、ギリシア語原文では ἀθανασία γάρ ἐστιν ἐν μνήμῃ αὐτῆς —「その記憶の中に不死がある」です。）</em></p></blockquote>

  - src: предопределение
    path: Pd9j_予定運命
    title: 予定（運命）
    meta_desc: 予定、言い換えれば運命についての聖書の引用
    menu: { parent: "教会/信仰", title: "予定（運命）", priority: 8 }
    body: |-
      <h2>神はすべての人が救われることを望んでおられる</h2><blockquote><p>「これは、<strong><mark>わたしたちの救い主である神</mark></strong>の御前に良いことであり、喜ばれることです。<strong><mark>神は、すべての人々が救われて</mark></strong>真理を知るようになることを<strong><u><mark>望んでおられます</mark></u></strong>」（<a href="https://bibleox.com/ja/jp-ni/1tim/2/#L3-4">１テモ. 2:3-4</a>）</p></blockquote><blockquote><p>「あるいは、<strong><u><mark>神の憐れみがあなたを悔い改めに導く</mark></u></strong>ことも知らないで、その豊かな慈愛と寛容と忍耐とを軽んじるのですか。<strong><mark>あなたは、かたくなで心を改めようとせず、</mark><u><mark>神の怒りを自分のために蓄えています</mark></u><mark>。この怒りは、神が正しい裁きを行われる怒りの日に現れるでしょう</mark></strong>。神はおのおのの行いに従ってお報いになります。すなわち、忍耐強く善を行い、栄光と誉れと不滅のものを求める者には、永遠の命をお与えになり、反抗心にかられ、真理ではなく不義に従う者には、怒りと憤りをお示しになります」（<a href="https://bibleox.com/ja/jp-ni/rim/2/#L4-8">ロマ. 2:4-8</a>）</p></blockquote><h2>救いは強制によって起こるのではなく、求める者に開かれる</h2><blockquote><p>「信仰がなければ、神に喜ばれることはできません。神に近づく者は、神が存在しておられること、また、<strong><mark>神は御自分を求める者たちに報いてくださる方であること</mark></strong>を、信じていなければならないからです」（<a href="https://bibleox.com/ja/jp-ni/evr/11/#L6">ヘブ. 11:6</a>）</p></blockquote><blockquote><p><em>「</em><strong><em>わたしは主に求め主は答えてくださった</em></strong><em>。脅かすものから常に救い出してくださった。</em><strong><em><mark>主を仰ぎ見る人は光と輝き</mark></em></strong><em>辱めに顔を伏せることはない」（</em><a href="https://bibleox.com/ja/jp-ni/ps/34/#L5-6"><em>詩. 34:5-6</em></a><em>）</em></p></blockquote><blockquote><p><em>「わたしを愛する人をわたしも愛し</em><strong><em><mark>わたしを捜し求める人はわたしを見いだす</mark></em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/pr/8/#L17"><em>箴. 8:17</em></a><em>）</em></p></blockquote><blockquote><p><em>「主はすべての心を探り、すべての考えの奥底まで見抜かれるからである。</em><strong><em><mark>もし主を求めるなら、主はあなたに御自分を現してくださる</mark></em></strong><em>。もし主を捨てるならば、主はあなたをとこしえに拒み続けられる」（</em><a href="https://bibleox.com/ja/jp-ni/1par/28/#L9"><em>代上. 28:9</em></a><em>）</em></p></blockquote><blockquote><p>「あるいは、神の憐れみがあなたを悔い改めに導くことも知らないで、その豊かな慈愛と寛容と忍耐とを軽んじるのですか。あなたは、かたくなで心を改めようとせず、神の怒りを自分のために蓄えています。この怒りは、神が正しい裁きを行われる怒りの日に現れるでしょう。<strong><mark>神はおのおのの行いに従ってお報いになります</mark></strong>。すなわち、<strong><mark>忍耐強く善を行い、栄光と誉れと不滅のものを</mark><u><mark>求める者には</mark></u><mark>、</mark><u><mark>永遠の命</mark></u><mark>をお与えになり</mark>、反抗心にかられ、真理ではなく</strong>不義に従う者には、<strong>怒りと憤りをお示しになります</strong>」（<a href="https://bibleox.com/ja/jp-ni/rim/2/#L4-8">ロマ. 2:4-8</a>）</p></blockquote><h2>神は罪人の滅びを悲しみ、できるだけ多くの罪人を救おうとされる</h2><blockquote><p>「<strong><u><mark>わたしは悪人の死を喜ぶだろうか</mark></u></strong>、と主なる神は言われる。<strong><mark>彼がその道から立ち帰ることによって、生きることを喜ばないだろうか</mark></strong>。&lt;…&gt; それなのにお前たちは、『主の道は正しくない』と言う。聞け、イスラエルの家よ。<strong>わたしの道が正しくないのか。正しくないのは、お前たちの道ではないのか</strong>。&lt;…&gt; それゆえ、イスラエルの家よ。わたしはお前たちひとりひとりをその道に従って裁く、と主なる神は言われる。<strong><mark>悔い改めて、お前たちのすべての背きから立ち帰れ。罪がお前たちをつまずかせないようにせよ</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/iez/18/#L23,25,30">エゼ. 18:23,25,30</a>）</p></blockquote><blockquote><p>「彼らに言いなさい。わたしは生きている、と主なる神は言われる。<strong><u><mark>わたしは悪人が死ぬのを喜ばない</mark></u><mark>。むしろ、悪人がその道から立ち帰って生きることを喜ぶ</mark></strong>。立ち帰れ、立ち帰れ、お前たちの悪しき道から。イスラエルの家よ、<strong><mark>どうしてお前たちは死んでよいだろうか</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/iez/33/#L11">エゼ. 33:11</a>）</p></blockquote><blockquote><p>「イエスはお答えになった。『<strong><mark>医者を必要とするのは</mark>、健康な人ではなく<mark>病人である</mark>。<mark>わたしが来たのは</mark>、正しい人を<mark>招くためではなく</mark>、<mark>罪人を招いて悔い改めさせるためである</mark></strong>』」（<a href="https://bibleox.com/ja/jp-ni/lk/5/#L31-32">ルカ. 5:31-32</a>）</p></blockquote><blockquote><p>「ある人たちは、遅いと考えているようですが、<strong><mark>主は約束の実現を遅らせておられるのではありません</mark></strong>。<strong><mark>そうではなく、一人も滅びないで皆が悔い改めるようにと、あなたがたのために忍耐しておられるのです</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/2pet/3/#L9">２ペト. 3:9</a>）<em>（ギリシア語原文では μὴ βουλόμενός τινας ἀπολέσθαι —「だれも滅びることを<u>望まず</u>」です。）</em></p></blockquote><h2>人が滅びるのは、自分の意志を神に向けようとしないためである</h2><blockquote><p>「エルサレム、エルサレム、預言者たちを殺し、自分に遣わされた人々を石で打ち殺す者よ、めん鳥が雛を羽の下に集めるように、<strong><mark>わたしはお前の子らを何度集めようと</mark><u><mark>したことか</mark></u></strong>。<strong><mark>だが、お前たちは</mark><u><mark>応じようとしなかった</mark></u></strong>」（<a href="https://bibleox.com/ja/jp-ni/mf/23/#L37">マタ. 23:37</a>）<em>（ギリシア語原文では ἠθέλησα … καὶ οὐκ ἠθελήσατε —「わたしは<u>望んだ</u>……しかしあなたがたは<u>望まなかった</u>」です。）</em></p></blockquote><blockquote><p>「光が世に来たのに、人々はその行いが悪いので、<strong><mark>光よりも闇の方を</mark><u><mark>好んだ</mark></u></strong>。それが、もう裁きになっている。<strong><mark>悪を行う者は皆、光を</mark><u><mark>憎み</mark></u></strong>、その行いが明るみに出されるのを恐れて、<strong><mark>光の方に</mark><u><mark>来ない</mark></u></strong>からである。しかし、真理を行う者は光の方に来る。その行いが神に導かれてなされたということが、明らかになるために」（<a href="https://bibleox.com/ja/jp-ni/in/3/#L19-21">ヨハ. 3:19-21</a>）</p></blockquote><blockquote><p>「あるいは、<strong><mark>神の憐れみがあなたを悔い改めに導く</mark></strong>ことも知らないで、その豊かな慈愛と寛容と忍耐とを軽んじるのですか。<strong><mark>あなたは、かたくなで心を改めようとせず、神の怒りを自分のために蓄えています。この怒りは、神が正しい裁きを行われる怒りの日に現れるでしょう</mark></strong>。神はおのおのの行いに従ってお報いになります。すなわち、忍耐強く善を行い、栄光と誉れと不滅のものを求める者には、永遠の命をお与えになり、<strong><mark>反抗心にかられ、真理ではなく</mark></strong>不義に従う者には、怒りと憤りをお示しになります」（<a href="https://bibleox.com/ja/jp-ni/rim/2/#L4-8">ロマ. 2:4-8</a>）</p></blockquote><h2>神は、前もって<strong>知っておられた</strong>（すなわち、彼らが選ぶことをあらかじめ知っておられた）者たちを救いへと予定された</h2><p>予定は、人の行いとかかわりなく起こるのではありません。神は時間の外におられるので、人の行いをあらかじめ知っておられ、まさにこの知（予知）に基づいて予定されるのです。これが鍵となる点です。予定は行き当たりばったりに起こるのではなく、まさに一人一人の行いを考慮して起こります。神は時間の外におられるので、その行いがなされる<strong>前に</strong>知っておられるのです。</p><blockquote><p>「<strong>神は<mark>前もって知っておられた</mark>者たちを</strong><em>（ギリシア語 προέγνω —「あらかじめ知った」）</em>、御子の姿に似たものにしようと<strong><mark>あらかじめ定められました</mark></strong>。それは、御子が多くの兄弟の中で長子となられるためです。<strong>神はあらかじめ定められた者たちを召し出し</strong>、召し出した者たちを義とし、義とされた者たちに栄光をお与えになったのです」（<a href="https://bibleox.com/ja/jp-ni/rim/8/#L29-30">ロマ. 8:29-30</a>）</p></blockquote><blockquote><p>「イエス・キリストの使徒ペトロから、ポントス、ガラテヤ、カパドキア、アジア、ビティニアの各地に離散して仮住まいをしている選ばれた人たちへ。あなたがたは、<strong>父である神が<mark>あらかじめ立てられた御計画に基づいて</mark></strong>、“霊”によって聖なる者とされ、イエス・キリストに従い、また、その血を注ぎかけていただくために<strong><mark>選ばれた</mark></strong>のです」（<a href="https://bibleox.com/ja/jp-ni/1pet/1/#L1-2">１ペト. 1:1-2</a>）<em>（「あらかじめ立てられた御計画」は、ギリシア語原文では κατὰ πρόγνωσιν θεοῦ πατρός —「父なる神の<strong>予知</strong>に従って」です。）</em></p></blockquote><blockquote><p>「<strong>人間は皆、大地からのもの</strong>、アダムは土から造られた。<strong>主は、<mark>あふれるばかりの知識によって</mark></strong>、人々に違いをつくり、<strong>それぞれに、異なった道を<mark>歩ませられた</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/prsir/33/#L10-11">シラ. 33:10-11</a>）</p></blockquote><blockquote><p>「異邦人たちはこれを聞いて喜び、主の言葉を賛美した。そして、<strong>永遠の命を得るように定められている人は皆、信仰に入った</strong>」（<a href="https://bibleox.com/ja/jp-ni/act/13/#L48">使. 13:48</a>）</p></blockquote><h2>人の運命は神の御手の中にある</h2><p><em>（ロシア語の宗務院訳では、ギリシア語 κρίματα やヘブライ語 מִשְׁפָּט —「裁き、定め」— がしばしば「運命」と訳されています。新共同訳はこの語を「裁き」「定め」と訳しています。）</em></p><blockquote><p>「恵みの御業は神の山々のよう<strong>あなたの<mark>裁き</mark>は大いなる深淵</strong>。主よ、あなたは人をも獣をも救われる」（<a href="https://bibleox.com/ja/jp-ni/ps/36/#L7">詩. 36:7</a>）</p></blockquote><blockquote><p>「<strong><mark>人の一歩一歩</mark>を定めるのは主である</strong>。人は自らの道について何を理解していようか」（<a href="https://bibleox.com/ja/jp-ni/pr/20/#L24">箴. 20:24</a>）</p></blockquote><blockquote><p>「支配者の御機嫌をうかがう者は多い。しかし、<strong>人を<mark>裁く</mark>のは主である</strong>」（<a href="https://bibleox.com/ja/jp-ni/pr/29/#L26">箴. 29:26</a>）</p></blockquote><blockquote><p>「陶器職人がその手にある粘土を、<strong>思うままに形づくるように</strong>、<strong>造り主は御手の内にある人間を</strong>、思うままに裁かれる」（<a href="https://bibleox.com/ja/jp-ni/prsir/33/#L13">シラ. 33:13</a>）</p></blockquote><blockquote><p>「これもまた万軍の主から出たことである。<strong>主の計らいは驚くべきもので</strong>大いなることを成し遂げられる」（<a href="https://bibleox.com/ja/jp-ni/is/28/#L29">イザ. 28:29</a>）</p></blockquote><blockquote><p>「ああ、神の富と知恵と知識のなんと深いことか。<strong>だれが、神の<mark>定め</mark>を究め尽くし</strong>、神の道を理解し尽くせよう」（<a href="https://bibleox.com/ja/jp-ni/rim/11/#L33">ロマ. 11:33</a>）</p></blockquote><h2>神はイエス・キリストの十字架の苦しみを予定された</h2><blockquote><p>「事実、この都でヘロデとポンティオ・ピラトは、異邦人やイスラエルの民と一緒になって、あなたが油を注がれた聖なる僕イエスに逆らいました。そして、実現するようにと<strong>御手</strong>と御心によって<strong><mark>あらかじめ定められていたこと</mark></strong>を、すべて行ったのです」（<a href="https://bibleox.com/ja/jp-ni/act/4/#L27-28">使. 4:27-28</a>）</p></blockquote><h2>神は使徒パウロを前もって選ばれた</h2><blockquote><p>「アナニアは言いました。『わたしたちの先祖の神が、あなたを<strong><mark>お選びになった</mark></strong>。それは、御心を悟らせ、あの正しい方に会わせて、その口からの声を聞かせるためです』」（<a href="https://bibleox.com/ja/jp-ni/act/22/#L14">使. 22:14</a>）<em>（「お選びになった」は、ギリシア語原文では προεχειρίσατο —「前もって定めた、前もって任命した」です。）</em></p></blockquote><h2>反論への応答</h2><h3>神がすべての人を救いたいと望みながら、すべての人が救われないのなら、神は全能ではない</h3><p>愛は自由な感情です。強制して愛させることはできません。神は、御自分の被造物が神を愛することができるよう望んでおられ、それゆえ、神を自由に選ぶことも選ばないことも、神を愛することも憎むこともできる可能性を被造物に与えておられます。</p><p>神はすべての人を救うことができるでしょうか。できます。神はすべての人が救われることを望んでおられるでしょうか。望んでおられます。ただし、ある状態において、すなわち神への愛を持っている状態においてです。神は、神を憎む者たちを、神と共にある永遠の命へと無理に定めることを望まれません。それゆえ、神は望まないことをなさらないのです。これは神を全能でない者とするでしょうか。いいえ。神はだれにも愛することを強制しようとは望まれないからです。</p><p>愛である神は、人々に、神を自由に愛することも憎むこともできる可能性を与えることがおできになるでしょうか。おできになります。そして、もし選択の自由を与えることができないのなら、神は全能と言えるでしょうか。</p>

  - src: Авраам-отец-верующих
    path: Ab2k_アブラハム信じる者の父
    title: アブラハム — 信じる者の父
    meta_desc: 信じる者の父としてのアブラハムについての聖書の引用
    menu: { parent: "教会/信仰", title: "アブラハム — 信じる者の父", priority: 25 }
    body: |-
      <p>アブラハムは律法なしに、しかも割礼を受ける前に、義とされました。</p><blockquote><p>「同じようにダビデも、行いによらずに神から義と認められた人の幸いを、次のようにたたえています。『不法が赦され、罪を覆い隠された人々は、幸いである。主から罪があると見なされない人は、幸いである。』では、この幸いは、割礼を受けた者だけに与えられるのですか。それとも、割礼のない者にも及びますか。わたしたちは言います。<strong>『アブラハムの信仰が義と認められた』のです。どのようにしてそう認められたのでしょうか。割礼を受けてからですか。それとも、割礼を受ける前ですか。割礼を受けてからではなく、割礼を受ける前のことです</strong>。アブラハムは、割礼を受ける前に信仰によって義とされた証しとして、割礼の印を受けたのです。こうして彼は、<strong>割礼のないままに信じるすべての人の父となり</strong>、彼らも義と認められました。更にまた、彼は割礼を受けた者の父、すなわち、単に割礼を受けているだけでなく、わたしたちの父アブラハムが割礼以前に持っていた信仰の模範に従う人々の父ともなったのです。<strong>神はアブラハムやその子孫に世界を受け継がせることを約束されたが、その約束は、律法に基づいてではなく、信仰による義に基づいてなされたのです</strong>。律法に頼る者が世界を受け継ぐのであれば、信仰はもはや無意味であり、約束は廃止されたことになります。実に、律法は怒りを招くものであり、律法のないところには違犯もありません。従って、信仰によってこそ世界を受け継ぐ者となるのです。恵みによって、<strong>アブラハムのすべての子孫、つまり、単に律法に頼る者だけでなく、彼の信仰に従う者も、確実に約束にあずかれるのです。彼はわたしたちすべての父です。『わたしはあなたを多くの民の父と定めた』と書いてあるとおりです</strong>。死者に命を与え、存在していないものを呼び出して存在させる神を、アブラハムは信じ、その御前でわたしたちの父となったのです」（<a href="https://bibleox.com/ja/jp-ni/rim/4/#L6-17">ロマ. 4:6-17</a>）</p></blockquote><blockquote><p>「アブラムが九十九歳になったとき、主はアブラムに現れて言われた。『わたしは全能の神である。あなたはわたしに従って歩み、全き者となりなさい。&lt;…&gt; これがあなたと結ぶわたしの契約である。<strong>あなたは多くの国民の父となる</strong>。あなたは、もはやアブラムではなく、アブラハムと名乗りなさい。<strong>あなたを多くの国民の父とするからである</strong>』」（<a href="https://bibleox.com/ja/jp-ni/gen/17/#L1,4-5">創. 17:1,4-5</a>）</p></blockquote><p>信じる者たちはアブラハムの子です。</p><blockquote><p>「それは、『アブラハムは神を信じた。それは彼の義と認められた』と言われているとおりです。だから、<strong>信仰によって生きる人々こそ、アブラハムの子である</strong>とわきまえなさい。聖書は、神が異邦人を信仰によって義となさることを見越して、<strong>『あなたのゆえに異邦人は皆祝福される』という福音をアブラハムに予告しました</strong>。それで、<strong>信仰によって生きる人々は、信仰の人アブラハムと共に祝福されています</strong>。律法の実行に頼る者はだれでも、呪われています。『律法の書に書かれているすべての事を絶えず守らない者は皆、呪われている』と書いてあるからです。律法によってはだれも神の御前で義とされないことは、明らかです。なぜなら、『正しい者は信仰によって生きる』からです。律法は、信仰をよりどころとしていません。『律法の定めを果たす者は、その定めによって生きる』のです。キリストは、わたしたちのために呪いとなって、わたしたちを律法の呪いから贖い出してくださいました。『木にかけられた者は皆呪われている』と書いてあるからです。それは、<strong>アブラハムに与えられた祝福が、キリスト・イエスにおいて異邦人に及ぶためであり</strong>、また、わたしたちが、約束された“霊”を信仰によって受けるためでした。兄弟たち、分かりやすく説明しましょう。人の作った遺言でさえ、法律的に有効となったら、だれも無効にしたり、それに追加したりはできません。ところで、アブラハムとその子孫に対して約束が告げられましたが、<strong>その際、多くの人を指して『子孫たちとに』とは言われず、一人の人を指して『あなたの子孫とに』と言われています。この『子孫』とは、キリストのことです</strong>。&lt;…&gt; 洗礼を受けてキリストに結ばれたあなたがたは皆、キリストを着ているからです。&lt;…&gt; <strong>あなたがたは、もしキリストのものだとするなら、とりもなおさず、アブラハムの子孫であり</strong>、約束による相続人です」（<a href="https://bibleox.com/ja/jp-ni/gal/3/#L6-16,27,29">ガラ. 3:6-16,27,29</a>）</p></blockquote><blockquote><p>「あなたを祝福する人をわたしは祝福しあなたを呪う者をわたしは呪う。<strong>地上の氏族はすべてあなたによって祝福に入る</strong>」（<a href="https://bibleox.com/ja/jp-ni/gen/12/#L3">創. 12:3</a>）</p></blockquote><blockquote><p>「それは、<strong>アブラハムに与えられた祝福が、キリスト・イエスにおいて異邦人に及ぶためであり</strong>、また、わたしたちが、約束された“霊”を<strong>信仰によって</strong>受けるためでした」（<a href="https://bibleox.com/ja/jp-ni/gal/3/#L14">ガラ. 3:14</a>）</p></blockquote><h2>アブラハムの子らについてのイエス・キリストの言葉</h2><blockquote><p>「『我々の父はアブラハムだ』などと思ってもみるな。言っておくが、<strong>神はこんな石からでも、アブラハムの子たちを造り出すことがおできになる</strong>」（<a href="https://bibleox.com/ja/jp-ni/mf/3/#L9">マタ. 3:9</a>; <a href="https://bibleox.com/ja/jp-ni/lk/3/#L8">ルカ. 3:8</a>）</p></blockquote><h2>教会は新しいイスラエルである</h2><blockquote><p>「しかし、あなたがたは、選ばれた民、王の系統を引く祭司、聖なる国民、神のものとなった民です。それは、あなたがたを暗闇の中から驚くべき光の中へと招き入れてくださった方の力ある業を、あなたがたが広く伝えるためなのです。<strong>あなたがたは、『かつては神の民ではなかったが、今は神の民であり、憐れみを受けなかったが、今は憐れみを受けている』のです</strong>」（<a href="https://bibleox.com/ja/jp-ni/1pet/2/#L9-10">１ペト. 2:9-10</a>）</p></blockquote><p>さらに詳しく：<a href="https://bibleox.com/ja/ja/w/Ni5t_教会新しいイスラエル/">教会 — 新しいイスラエル</a></p>
