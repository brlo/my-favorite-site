    title: 洗礼
    meta_desc: 罪からの洗い清めと、神と共にある永遠の命のための霊的な誕生である洗礼についての聖書の引用
    menu: { parent: "教会/機密", title: "洗礼", priority: 1 }
    references: |-
      <ol><li><p>首司祭ディミトリー・ヴラディコフ：「神の言葉によって、神は疑いなく人の魂に働きかけられます。神の言葉は人の魂に大転換をもたらし、悔い改めと真の生活へと呼び招くことができます。しかし、<strong>罪からの清めと、罪と戦う力とを与えるものではありません</strong>。それゆえ神の言葉は機密を廃するものではなく、機密に取って代わることもできません。使徒ペトロの話を聞いたエルサレムの人々は、<strong>罪の赦しのために洗礼を受けなければなりませんでした</strong>（使徒言行録2:38-41）。罪人がキリストに立ち帰る過程において、<strong>神の言葉は、神がその人の内に信仰と悔い改めを生み出される手段</strong>なので、使徒たちは、神が『真理の言葉によってわたしたちを生んでくださいました』（ヤコブの手紙1:18）、キリスト者は『神の言葉によって新たに生まれた』（ペトロの手紙一1:23）、すなわち罪の眠りから目覚めさせられたと言いました。しかし『神の言葉によって新たに生まれた』者は、まだ罪から清められていません。それゆえ、水と霊とによって生まれなければならないのです。洗礼盤から出るとき、その人は罪の汚れを洗い流され、義と聖性を愛するようになり、『上から』生まれ、『再生の洗い』を受けます。神の言葉による再生は、洗礼における再生に取って代わるのではなく、そこへと導くのです。主教フェオファンは書いています。『（罪人の回心の）道はこうである。まず（神の言葉を）聞くこと、次に聞くことからの信仰、そして最後に洗礼と傅膏における聖霊の印である』」（<a href="https://azbyka.ru/otechnik/Dimitrij_Vladykov/pravoslavnaja-tserkov-i-sektanty/1_86">https://azbyka.ru/otechnik/Dimitrij_Vladykov/pravoslavnaja-tserkov-i-sektanty/1_86</a>、ロシア語。ロシア語からの訳）</p></li></ol>
    body: |-
      <h2>洗礼機密の本質</h2><p><strong>洗礼</strong>（「上からの誕生」「霊的な誕生」）は教会において行われる機密であり、その中で人は：</p><ol><li><p>罪から洗い清められ（<a href="https://bibleox.com/ja/jp-ni/act/2/#L38">使. 2:38</a>; <a href="https://bibleox.com/ja/jp-ni/1kor/6/#L11">１コリ. 6:11</a>; <a href="https://bibleox.com/ja/jp-ni/act/22/#L16">使. 22:16</a>）、</p></li><li><p>霊的に生まれ（<a href="https://bibleox.com/ja/jp-ni/in/3/#L3,5-6">ヨハ. 3:3,5-6</a>; <a href="https://bibleox.com/ja/jp-ni/1kor/15/#L44">１コリ. 15:44</a>; <a href="https://bibleox.com/ja/jp-ni/1kor/15/#L47-50">15:47-50</a>; <a href="https://bibleox.com/ja/jp-ni/1kor/15/#L53">15:53</a>; <a href="https://bibleox.com/ja/jp-ni/gal/3/#L27">ガラ. 3:27</a>）、</p></li><li><p>救いの恵みを受け（<a href="https://bibleox.com/ja/jp-ni/2kor/6/#L1">２コリ. 6:1</a>）、</p></li><li><p>教会に加えられます（<a href="https://bibleox.com/ja/jp-ni/1kor/12/#L13">１コリ. 12:13</a>）。</p></li></ol><h3>罪の赦し</h3><blockquote><p>「今、何をためらっているのです。立ち上がりなさい。その方の名を唱え、<strong>洗礼を受けて<mark>罪を洗い清めなさい</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/act/22/#L16">使. 22:16</a>）</p></blockquote><blockquote><p>「あなたがたの中にはそのような者もいました。しかし、主イエス・キリストの名とわたしたちの神の霊によって<strong><mark>洗われ</mark></strong>、<strong>聖なる者とされ</strong>、<strong>義とされています</strong>」（<a href="https://bibleox.com/ja/jp-ni/1kor/6/#L11">１コリ. 6:11</a>）</p></blockquote><blockquote><p>「すると、ペトロは彼らに言った。『悔い改めなさい。<strong>めいめい</strong>、イエス・キリストの名によって<strong>洗礼を受け、<mark>罪を赦していただきなさい</mark></strong>。そうすれば、賜物として聖霊を受けます』」（<a href="https://bibleox.com/ja/jp-ni/act/2/#L38">使. 2:38</a>）</p></blockquote><h3>水と霊とによる誕生</h3><blockquote><p>「イエスは答えて言われた。『はっきり言っておく。人は、<strong>新たに生まれなければ</strong>、神の国を見ることはできない。』&lt;…&gt; イエスはお答えになった。『はっきり言っておく。だれでも<strong>水と霊とによって<mark>生まれなければ</mark></strong>、神の国に入ることはできない。<strong>肉から生まれたものは肉である</strong>。<strong><mark>霊から生まれたものは霊である</mark></strong>』」（<a href="https://bibleox.com/ja/jp-ni/in/3/#L3,5-6">ヨハ. 3:3,5-6</a>）<em>（「新たに生まれる」は、ギリシア語原文では γεννηθῇ ἄνωθεν —「上から生まれる」です。）</em></p></blockquote><p><em>ほかの引用は下の「</em><a href="#HH-幼児洗礼"><em>幼児洗礼</em></a><em>」にあります。</em></p><h3>キリストの体に加わること</h3><blockquote><p>「つまり、一つの霊によって、わたしたちは、ユダヤ人であろうとギリシア人であろうと、奴隷であろうと自由な身分の者であろうと、<strong><mark>皆一つの体となるために洗礼を受け</mark></strong>、皆一つの霊をのませてもらったのです」（<a href="https://bibleox.com/ja/jp-ni/1kor/12/#L13">１コリ. 12:13</a>）</p></blockquote><h3>神の国に入ることができるようになる</h3><blockquote><p>「イエスはお答えになった。『はっきり言っておく。<strong>だれでも水と霊とによって生まれなければ、<mark>神の国に入る</mark>ことはできない</strong>』」（<a href="https://bibleox.com/ja/jp-ni/in/3/#L5">ヨハ. 3:5</a>）</p></blockquote><h3>救われることができるようになる</h3><blockquote><p>「この水で前もって表された<strong><mark>洗礼</mark></strong>は、今やイエス・キリストの復活によってあなたがたをも<strong><mark>救う</mark></strong>のです。洗礼は、肉の汚れを<strong>取り除くこと</strong>ではなくて、神に正しい良心を願い求めることです」（<a href="https://bibleox.com/ja/jp-ni/1pet/3/#L21">１ペト. 3:21</a>）（<a href="https://bibleox.com/ja/jp-ni/tit/3/#L5">テト. 3:5</a>）</p></blockquote><h2>洗礼機密の制定</h2><blockquote><p><em>「わたしは天と地の一切の権能を授かっている。だから、あなたがたは</em><strong><em>行って</em></strong><em>、すべての民をわたしの弟子にしなさい。</em><strong><em>彼らに父と子と聖霊の名によって洗礼を授け</em></strong><em>」</em>（<a href="https://bibleox.com/ja/jp-ni/mf/28/#L18-19">マタ. 28:18-19</a>）</p></blockquote><h2>洗礼機密の素材は水である</h2><p>水による、水の中での洗礼：</p><blockquote><p>「道を進んで行くうちに、彼らは<strong>水のある所に来た</strong>。宦官は言った。『<strong>ここに水があります。洗礼を受けるのに、何か妨げがあるでしょうか</strong>。』〔フィリポが、『真心から信じておられるなら、差し支えありません』と言うと、宦官は、『イエス・キリストは神の子であると信じます』と答えた。〕そして、車を止めさせた。<strong>フィリポと宦官は二人とも水の中に入って行き</strong>、<strong>フィリポは宦官に洗礼を授けた</strong>。彼らが<strong>水の中から上がると</strong>、主の霊がフィリポを連れ去った」（<a href="https://bibleox.com/ja/jp-ni/act/8/#L36-39">使. 8:36-39</a>）<em>（37節は一部の写本にのみあり、新共同訳は〔　〕に入れています。教会スラヴ語訳とロシア語訳では本文に含まれています。）</em></p></blockquote><blockquote><p>「わたしたちと同様に聖霊を受けたこの人たちが、<strong>水で洗礼を受ける</strong>のを、いったいだれが妨げることができますか」（<a href="https://bibleox.com/ja/jp-ni/act/10/#L47">使. 10:47</a>）</p></blockquote><h2>洗礼についての旧約の預言</h2><blockquote><p>「<em>わたしが</em><strong><em>清い水をお前たちの上に振りかけるとき、お前たちは清められる。わたしはお前たちを、すべての汚れ</em></strong><em>とすべての偶像から清める。わたしはお前たちに新しい心を与え、お前たちの中に新しい霊を置く</em>」（<a href="https://bibleox.com/ja/jp-ni/iez/36/#L25-28">エゼ. 36:25-28</a>）</p></blockquote><blockquote><p>「<em>主は再び我らを憐れみ我らの咎を抑え</em><strong><em>すべての罪を海の深みに投げ込まれる</em></strong>」（<a href="https://bibleox.com/ja/jp-ni/mih/7/#L19">ミカ. 7:19</a>）</p></blockquote><blockquote><p>「<em>その日、ダビデの家とエルサレムの住民のために、</em><strong><em>罪と汚れを洗い清める一つの泉</em></strong><em>が開かれる</em>」（<a href="https://bibleox.com/ja/jp-ni/zah/13/#L1">ゼカ. 13:1</a>）</p></blockquote><h2>洗礼の条件</h2><h3>信仰</h3><p>神、すなわち父と子と聖霊への信仰が必要です（<a href="https://bibleox.com/ja/jp-ni/mf/28/#L19">マタ. 28:19</a>）：</p><blockquote><p>「道を進んで行くうちに、彼らは水のある所に来た。宦官は言った。<strong>『ここに水があります。洗礼を受けるのに、何か妨げがあるでしょうか。』</strong>〔<strong>フィリポが、『真心から信じておられるなら、差し支えありません』と言うと</strong>、宦官は、<strong>『イエス・キリストは神の子であると信じます』</strong>と答えた。〕そして、車を止めさせた。フィリポと宦官は二人とも水の中に入って行き、<strong>フィリポは宦官に洗礼を授けた</strong>」（<a href="https://bibleox.com/ja/jp-ni/act/8/#L36-38">使. 8:36-38</a>）</p></blockquote><h3>悔い改め</h3><p>罪の悔い改めが必要です：</p><blockquote><p>「すると、ペトロは彼らに言った。『<strong>悔い改めなさい</strong>。めいめい、イエス・キリストの名によって洗礼を受け、罪を赦していただきなさい。そうすれば、賜物として聖霊を受けます』」（<a href="https://bibleox.com/ja/jp-ni/act/2/#L38">使. 2:38</a>）</p></blockquote><h2>幼児洗礼</h2><h3>すべての人は霊的に生まれなければならない</h3><p>すべての人は一般に、神と共にある永遠の命のために霊的な誕生を必要としています：</p><blockquote><p>「また、<strong>天上の体と地上の体があります</strong>」（<a href="https://bibleox.com/ja/jp-ni/1kor/15/#L40">１コリ. 15:40</a>）</p></blockquote><blockquote><p>「<strong>自然の命の体があるのですから、霊の体もあるわけです</strong>」（<a href="https://bibleox.com/ja/jp-ni/1kor/15/#L44">１コリ. 15:44</a>）</p></blockquote><blockquote><p>「<strong>肉から生まれたものは肉である</strong>。霊から生まれたものは霊である」（<a href="https://bibleox.com/ja/jp-ni/in/3/#L6">ヨハ. 3:6</a>）</p></blockquote><p>アダムの朽ちる体を受け継ぐ者は、神の国に入ることができません：</p><blockquote><p>「<strong>最初の人は土ででき、地に属する者であり</strong>、第二の人は天に属する者です。<strong>土からできた者たちはすべて、土からできたその人に等しく</strong>、天に属する者たちはすべて、天に属するその人に等しいのです。わたしたちは、<strong>土からできたその人の似姿となっているように</strong>、天に属するその人の似姿にもなるのです。兄弟たち、わたしはこう言いたいのです。<strong>肉と血は神の国を受け継ぐことはできず</strong>、<strong>朽ちるものが朽ちないものを受け継ぐことはできません</strong>」（<a href="https://bibleox.com/ja/jp-ni/1kor/15/#L47-50">１コリ. 15:47-50</a>）</p></blockquote><p>それゆえ、アダムから朽ちるべき性質を受けた者は皆死にますが、洗礼においてキリストと結ばれた者は生かされます。</p><blockquote><p>「つまり、<strong>アダムによってすべての人が死ぬ</strong>ことになったように、<strong>キリストによってすべての人が生かされる</strong>ことになるのです」（<a href="https://bibleox.com/ja/jp-ni/1kor/15/#L22">１コリ. 15:22</a>）</p></blockquote><blockquote><p>「それともあなたがたは知らないのですか。<strong>キリスト・イエスに結ばれるために洗礼を受けた</strong>わたしたちが皆、またその死にあずかるために洗礼を受けたことを。&lt;…&gt; もし、わたしたちが<strong>キリストと一体になってその死の姿にあやかる</strong>ならば、<strong>その復活の姿にもあやかれる</strong>でしょう」（<a href="https://bibleox.com/ja/jp-ni/rim/6/#L3,5">ロマ. 6:3,5</a>）</p></blockquote><p>死ぬべきものはすべて、死なないものを着なければなりません：</p><blockquote><p>「<strong>この朽ちるべきものが朽ちないものを着</strong>、<strong>この死ぬべきものが死なないものを必ず着る</strong>ことになります」（<a href="https://bibleox.com/ja/jp-ni/1kor/15/#L53">１コリ. 15:53</a>）</p></blockquote><p>すなわち、洗礼においてキリストを着るのです：</p><blockquote><p>「<strong>洗礼を受けてキリストに結ばれたあなたがたは皆、キリストを着ている</strong>からです」（<a href="https://bibleox.com/ja/jp-ni/gal/3/#L27">ガラ. 3:27</a>）</p></blockquote><h3>すべての人は原罪から洗い清められなければならない</h3><p>また、すべての人は一般に、わたしたちの始祖から罪深さを受け継いでいます。つまり、<a href="https://bibleox.com/ru/q/%D0%B2%D1%81%D0%B5-%D0%BB%D1%8E%D0%B4%D0%B8-%D0%B3%D1%80%D0%B5%D1%88%D0%BD%D1%8B">幼児もそれを持っている</a>のです：</p><blockquote><p>「汚れたものから清いものを引き出すことができましょうか。<strong>だれひとりできないのです</strong>」（<a href="https://bibleox.com/ja/jp-ni/iov/14/#L4">ヨブ. 14:4</a>）</p></blockquote><blockquote><p>「わたしは咎のうちに産み落とされ<strong>母がわたしを身ごもったときもわたしは罪のうちにあったのです</strong>」（<a href="https://bibleox.com/ja/jp-ni/ps/51/#L7">詩. 51:7</a>）</p></blockquote><blockquote><p>「このようなわけで、<strong>一人の人によって罪が世に入り</strong>、罪によって死が入り込んだように、<strong>死はすべての人に及んだのです。すべての人が罪を犯したからです</strong>」（<a href="https://bibleox.com/ja/jp-ni/rim/5/#L12">ロマ. 5:12</a>）<em>（「すべての人が罪を犯したからです」の「からです」は、ギリシア語原文では ἐφ᾿ ᾧ で、「その人（アダム）において」とも理解されます。）</em></p></blockquote><blockquote><p><em>「</em><strong><em>一人の人の不従順によって多くの人が罪人とされた</em></strong><em>ように、一人の従順によって多くの人が正しい者とされるのです」（</em><a href="https://bibleox.com/ja/jp-ni/rim/5/#L19"><em>ロマ. 5:19</em></a><em>）</em></p></blockquote><blockquote><p>「<strong>わたしは自分の望む善は行わず、望まない悪を行っている</strong>。もし、わたしが望まないことをしているとすれば、それをしているのは、もはやわたしではなく、<strong>わたしの中に住んでいる罪なのです</strong>。それで、善をなそうと思う自分には、いつも悪が付きまとっているという法則に気づきます。『内なる人』としては神の律法を喜んでいますが、<strong>わたしの五体にはもう一つの法則があって心の法則と戦い、わたしを、五体の内にある罪の法則のとりこにしているのが分かります</strong>。わたしはなんと惨めな人間なのでしょう。<strong>死に定められたこの体から、だれがわたしを救ってくれるでしょうか</strong>」（<a href="https://bibleox.com/ja/jp-ni/rim/7/#L19-24">ロマ. 7:19-24</a>）</p></blockquote><blockquote><p><em>「わたしたちは、律法が霊的なものであると知っています。しかし、</em><strong><em>わたしは肉の人であり、罪に売り渡されています</em></strong><em>。&lt;…&gt;『内なる人』としては神の律法を喜んでいますが、</em><strong><em>わたしの五体にはもう一つの法則があって心の法則と戦い</em></strong><em>、</em><strong><em>わたしを、五体の内にある罪の法則のとりこにしている</em></strong><em>のが分かります」（</em><a href="https://bibleox.com/ja/jp-ni/rim/7/#L14,22-23"><em>ロマ. 7:14,22-23</em></a><em>）</em></p></blockquote><blockquote><p><em>「わたしたちも</em><strong><em>皆</em></strong><em>、こういう者たちの中にいて、以前は肉の欲望の赴くままに生活し、肉や心の欲するままに行動していたのであり、ほかの人々と同じように、</em><strong><em>生まれながら神の怒りを受けるべき者でした</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/ef/2/#L3"><em>エフェ. 2:3</em></a><em>）</em></p></blockquote><h3>使徒たちは家族全体（家ごと）に洗礼を授けた</h3><blockquote><p>「もっとも、<strong>ステファナの家の人たちにも洗礼を授けましたが</strong>、それ以外はだれにも授けた覚えはありません」（<a href="https://bibleox.com/ja/jp-ni/1kor/1/#L16">１コリ. 1:16</a>）</p></blockquote><blockquote><p>「そして、<strong>彼女も家族の者も洗礼を受けた</strong>」（<a href="https://bibleox.com/ja/jp-ni/act/16/#L15">使. 16:15</a>）</p></blockquote><blockquote><p>「『先生方、救われるためにはどうすべきでしょうか。』二人は言った。『主イエスを信じなさい。そうすれば、あなたも家族も救われます。』そして、看守とその家の人たち全部に主の言葉を語った。まだ真夜中であったが、看守は二人を連れて行って打ち傷を洗ってやり、<strong>自分も家族の者も皆すぐに洗礼を受けた</strong>」（<a href="https://bibleox.com/ja/jp-ni/act/16/#L30-33">使. 16:30-33</a>）</p></blockquote><p>使徒はすべての人に洗礼を受けるよう呼びかけ、約束は彼ら（大人）だけでなく、その子供たちにも与えられていると言います：</p><blockquote><p>「すると、ペトロは彼らに言った。『<strong>悔い改めなさい</strong>。<strong>めいめい</strong>、イエス・キリストの名によって<strong>洗礼を受け</strong>、罪を赦していただきなさい。そうすれば、賜物として聖霊を受けます。<strong>この<u>約束</u>は、あなたがたにも、<u>あなたがたの子供にも</u></strong>、遠くにいるすべての人にも、つまり、わたしたちの神である主が招いてくださる者ならだれにでも、与えられているものなのです』」（<a href="https://bibleox.com/ja/jp-ni/act/2/#L38-39">使. 2:38-39</a>）</p></blockquote><p>ここでは文字どおり幼児のことが語られています。ここで言われている<strong>約束</strong>が何であるかを理解するには、文脈を見なければなりません。この章は、五旬祭の日に教会の集まりの上に聖霊が降ったことを語っています。この出来事を説明して、使徒ペトロは預言者ヨエルを通して与えられた約束を指し示します：</p><blockquote><p>「すると、<strong>一同は聖霊に満たされ</strong> &lt;…&gt; すると、<strong>ペトロ</strong>は十一人と共に立って、声を張り上げ、話し始めた。&lt;…&gt;『<strong>そうではなく、これこそ預言者<u>ヨエル</u>を通して言われていたことなのです</strong>。「神は言われる。終わりの時に、<strong>わたしの霊をすべての人に注ぐ</strong>。すると、あなたたちの息子と娘は預言し、若者は幻を見、老人は夢を見る。」』&lt;…&gt; 人々はこれを聞いて大いに心を打たれ、ペトロとほかの使徒たちに、『兄弟たち、わたしたちはどうしたらよいのですか』と言った。すると、ペトロは彼らに言った。『<strong>悔い改めなさい。めいめい、イエス・キリストの名によって洗礼を受け</strong>、罪を赦していただきなさい。そうすれば、賜物として聖霊を受けます。<strong><u>この約束は、あなたがたにも、あなたがたの子供にも</u>、遠くにいるすべての人にも</strong>、つまり、わたしたちの神である主が招いてくださる者ならだれにでも、与えられているものなのです』」（<a href="https://bibleox.com/ja/jp-ni/act/2/#L4,14-17,37-39">使. 2:4,14-17,37-39</a>）</p></blockquote><p>このように、使徒ペトロは預言者ヨエルを引用しています。預言者ヨエル自身のもとで、この約束を見てみましょう：</p><blockquote><p>「シオンで角笛を吹きわが聖なる山で鬨の声をあげよ。この国に住む者は皆、おののけ。主の日が来る、主の日が近づく。&lt;…&gt; シオンで角笛を吹き断食を布告し、聖会を召集せよ。<strong>民を呼び集め、会衆を聖別し長老を集合させよ。幼子、<u>乳飲み子</u>を呼び集め</strong>花婿を控えの間から花嫁を祝いの部屋から呼び出せ。祭司は神殿の入り口と祭壇の間で泣き主に仕える者は言うがよい。『主よ、あなたの民を憐れんでください。あなたの嗣業である民を恥に落とさず国々の嘲りの種としないでください。「彼らの神はどこにいるのか」となぜ諸国の民に言わせておかれるのですか。』<strong><u>そのとき主は御自分の国を強く愛しその民を深く憐れまれた</u></strong>。&lt;…&gt; その後<strong><u>わたしはすべての人にわが霊を注ぐ</u></strong>。あなたたちの息子や娘は預言し老人は夢を見、若者は幻を見る」（<a href="https://bibleox.com/ja/jp-ni/iol/2/#L1,15-18">ヨエ. 2:1,15-18</a>; <a href="https://bibleox.com/ja/jp-ni/iol/3/#L1">3:1</a>）</p></blockquote><p>これがその約束です。長老から乳飲み子まで、民全体がこの聖会に呼び集められます。そして神は、この呼び集められた民全体の上に聖霊を注ぐと約束されました。「すべての人に」（直訳では「すべての肉に」）と書かれているとおりです。したがって、使徒が、約束は聞き手たちだけでなく、その子供たちにも、遠くにいる人々にも与えられていると言うとき、文脈に従えば、子供たちとは文字どおり幼児のことなのです。</p><h3>ほかの人々の信仰による神の恵みの働き</h3><p>幼児が洗礼を受けるとき、その代父母の信仰が働くことがあります。聖書には、神の恵みがほかの人々の信仰によってある人々に働いた例が数多くあります：</p><h4>救い主は親の信仰によって子供たちをいやされる</h4><p>神は親の信仰によって子供たちの内に働かれます：</p><ul><li><p>信仰は父親に求められますが、悪霊から解放されるのは息子です（<a href="https://bibleox.com/ja/jp-ni/mk/9/#L17-24">マコ. 9:17-24</a>）。</p></li><li><p>信仰は父親に求められますが、生き返らされ、いやされるのはヤイロの娘です（<a href="https://bibleox.com/ja/jp-ni/lk/8/#L41-42,49-55">ルカ. 8:41-42,49-55</a>）。</p></li><li><p>母親が信じますが、悪霊から解放されるのはカナンの女の娘です（<a href="https://bibleox.com/ja/jp-ni/mf/15/#L22-28">マタ. 15:22-28</a>）。</p></li><li><p>父親が信じますが、いやされるのは王の役人の息子です（<a href="https://bibleox.com/ja/jp-ni/in/4/#L46-50">ヨハ. 4:46-50</a>）。</p></li></ul><h4>近しい人々の信仰によるいやし（恵みの働き）の例</h4><ul><li><p>百人隊長が信じますが、いやされるのはその僕です（<a href="https://bibleox.com/ja/jp-ni/mf/8/#L10,13">マタ. 8:10,13</a>）。</p></li><li><p>友人たちが信じますが、いやされるのは中風の仲間です（<a href="https://bibleox.com/ja/jp-ni/mk/2/#L5">マコ. 2:5</a>）。ここで大切なのは、ほかの人々の信仰によって、その人の<strong>罪も赦された</strong>ということです。</p></li></ul><p>詳しく：<a href="https://bibleox.com/ja/ja/w/Gf3o_ほかの人々の信仰と祈りによる神の働き/">ほかの人々の信仰と祈りによる神の働き</a></p><h3>生まれてくる息子を神にささげる誓願</h3><p>親たちは、すでに生まれた幼子（8日目に）だけでなく、まだ神に願い求めている子供さえも神にささげました。預言者サムエルはこのようにして生まれました：</p><blockquote><p>「そして、誓いを立てて言った。『万軍の主よ、はしための苦しみを御覧ください。はしために御心を留め、忘れることなく、男の子をお授けくださいますなら、<strong>その子の一生を主におささげし、その子の頭には決してかみそりを当てません</strong>』」（<a href="https://bibleox.com/ja/jp-ni/1ts/1/#L11">サム上. 1:11</a>）</p></blockquote><h2>洗礼の旧約における予型</h2><h3>割礼</h3><p>旧約の割礼は新約の洗礼の予型です：</p><blockquote><p>「あなたがたはキリストにおいて、<strong>手によらない割礼</strong>、つまり肉の体を脱ぎ捨てる<strong>キリストの割礼を受け、洗礼によって、キリストと共に葬られ</strong>、また、キリストを死者の中から復活させた神の力を信じて、キリストと共に復活させられたのです」（<a href="https://bibleox.com/ja/jp-ni/kol/2/#L11-12">コロ. 2:11-12</a>）</p></blockquote><p>旧約の割礼の制定。割礼は神との取り決め（契約）に入ることであり、幼児は生後8日目からこれに入りました：</p><blockquote><p>「あなたたち、およびあなたの後に続く子孫と、わたしとの間で守るべき契約はこれである。すなわち、あなたたちの男子はすべて、割礼を受ける。包皮の部分を切り取りなさい。<strong>これが、わたしとあなたたちとの間の契約のしるしとなる</strong>。<strong>いつの時代でも、あなたたちの男子はすべて</strong>、直系の子孫はもちろんのこと、家で生まれた奴隷も、外国人から買い取った奴隷であなたの子孫でない者も皆、<strong>生まれてから八日目に割礼を受けなければならない</strong>」（<a href="https://bibleox.com/ja/jp-ni/gen/17/#L10-12">創. 17:10-12</a>）</p></blockquote><h3>海の底を通って奴隷の地から脱出したこと</h3><p>ヘブライ人が紅海の底を通ってエジプトの奴隷状態から脱出したことは、新約の洗礼の予型です。民全体が奴隷状態から脱出し、幼児を含む民全体がモーセへの洗礼を受けました：</p><blockquote><p>「兄弟たち、次のことはぜひ知っておいてほしい。わたしたちの先祖は<strong>皆、雲の下におり、皆、海を通り抜け、皆、雲の中、海の中で、モーセに属するものとなる洗礼を授けられ</strong>、皆、同じ霊的な食物を食べ、皆が同じ霊的な飲み物を飲みました。彼らが飲んだのは、自分たちに離れずについて来た霊的な岩からでしたが、この岩こそキリストだったのです」（<a href="https://bibleox.com/ja/jp-ni/1kor/10/#L1-4">１コリ. 10:1-4</a>）</p></blockquote><p>これらの像には直接の意味があります：</p><blockquote><p>「<em>これらのことは前例として彼らに起こったのです。</em><strong><em>それが書き伝えられているのは、時の終わりに直面しているわたしたちに警告するためなのです</em></strong>」（<a href="https://bibleox.com/ja/jp-ni/1kor/10/#L11">１コリ. 10:11</a>）</p></blockquote><h2>血による洗礼</h2><p>血による洗礼とは、キリストのための致命（殉教）の死です。これはジハードや神風特攻のような行為を意味するのではありません。致命者は生きることを望み、だれの命も脅かしません。ただキリストへの信仰のゆえに命を奪われるのです。このような人々は、水による洗礼がなくても、救いだけでなく、天においてキリストと共に特別な栄光にあずかります。</p><h3>キリストは来るべき御自分の苦しみと死を洗礼と呼ばれる</h3><blockquote><p>「イエスはお答えになった。『あなたがたは、自分が何を願っているか、分かっていない。このわたしが飲もうとしている杯を飲むことができるか。』二人が、『できます』と言うと、イエスは言われた。『確かに、あなたがたはわたしの杯を飲むことになる。しかし、わたしの右と左にだれが座るかは、わたしの決めることではない。それは、わたしの父によって定められた人々に許されるのだ』」（<a href="https://bibleox.com/ja/jp-ni/mf/20/#L22-23">マタ. 20:22-23</a>）<em>（ビザンティン本文（多数派写本）では、この箇所にさらに「このわたしが受ける洗礼を受けることができるか」「わたしが受ける洗礼を受けることになる」という言葉があります。<a href="https://bibleox.com/ja/jp-ni/mk/10/#L38-39">マコ. 10:38-39</a>も参照。）</em></p></blockquote><h3>キリストのために殺された人々は天で白い衣を与えられる</h3><blockquote><p><em>「小羊が第五の封印を開いたとき、</em><strong><em>神の言葉と自分たちがたてた証し*のために殺された人々の魂を、わたしは祭壇の下に見た</em></strong><em>。彼らは大声でこう叫んだ。『真実で聖なる主よ、いつまで裁きを行わず、地に住む者にわたしたちの血の復讐をなさらないのですか。』すると、</em><strong><em>その一人一人に、白い衣が与えられ</em></strong><em>、また、自分たちと同じように殺されようとしている兄弟であり、仲間の僕である者たちの数が満ちるまで、なお、しばらく静かに待つようにと告げられた」（</em><a href="https://bibleox.com/ja/jp-ni/otkr/6/#L9-11"><em>黙. 6:9-11</em></a><em>）</em></p></blockquote><p>*ギリシア語では、致命者は μάρτυς（証人）という語で呼ばれます。致命者はその行いによって、キリストと復活への揺るぎない信仰を証しし、それがしばしばほかの人々がキリストへの信仰を受け入れるきっかけとなりました。</p><h3>致命者と迫害についてのキリストの言葉</h3><blockquote><p>「だから、<strong>だれでも人々の前で自分をわたしの仲間であると言い表す者は、わたしも天の父の前で、その人をわたしの仲間であると言い表す</strong>。しかし、人々の前でわたしを知らないと言う者は、わたしも天の父の前で、その人を知らないと言う」（<a href="https://bibleox.com/ja/jp-ni/mf/10/#L32-33">マタ. 10:32-33</a>）</p></blockquote><blockquote><p>「言っておくが、<strong>だれでも人々の前で自分をわたしの仲間であると言い表す者は、人の子も神の天使たちの前で、その人を自分の仲間であると言い表す</strong>」（<a href="https://bibleox.com/ja/jp-ni/lk/12/#L8">ルカ. 12:8</a>）</p></blockquote><blockquote><p>「<strong>義のために迫害される人々は、幸いである、天の国はその人たちのものである</strong>。わたしのためにののしられ、<strong>迫害され、身に覚えのないことであらゆる悪口を浴びせられるとき</strong>、あなたがたは幸いである。喜びなさい。大いに喜びなさい。<strong>天には大きな報いがある</strong>。あなたがたより前の預言者たちも、同じように迫害されたのである」（<a href="https://bibleox.com/ja/jp-ni/mf/5/#L10-12">マタ. 5:10-12</a>）</p></blockquote><h2>洗礼の後も信者は罪を犯しうるので、自分の内の罪と戦わなければならない</h2><blockquote><p>「もし、わたしたちが<strong>真理の知識を受けた後にも、故意に罪を犯し続けるとすれば</strong>、罪のためのいけにえは、もはや残っていません」（<a href="https://bibleox.com/ja/jp-ni/evr/10/#L26">ヘブ. 10:26</a>）</p></blockquote><blockquote><p>「<strong>自分に罪がないと言うなら、自らを欺いており</strong>、真理はわたしたちの内にありません。自分の罪を公に言い表すなら、神は真実で正しい方ですから、罪を赦し、あらゆる不義からわたしたちを清めてくださいます」（<a href="https://bibleox.com/ja/jp-ni/1in/1/#L8-9">１ヨハ. 1:8-9</a>）</p></blockquote><blockquote><p>「わたしの子たちよ、<strong><mark>これらのことを書くのは、あなたがたが罪を犯さないようになるためです</mark></strong>。たとえ罪を犯しても、御父のもとに弁護者、正しい方、イエス・キリストがおられます」（<a href="https://bibleox.com/ja/jp-ni/1in/2/#L1">１ヨハ. 2:1</a>）</p></blockquote><blockquote><p>「<strong><mark>何が原因で、あなたがたの間に戦いや争いが起こるのですか</mark></strong>。あなたがた自身の内部で争い合う欲望が、その原因ではありませんか」（<a href="https://bibleox.com/ja/jp-ni/iak/4/#L1">ヤコ. 4:1</a>）</p></blockquote><blockquote><p><em>「あなたがたの中で病気の人は、</em><strong><em>教会の長老を招いて</em></strong><em>、主の名によってオリーブ油を塗り、祈ってもらいなさい。</em><strong><em>信仰に基づく祈りは、病人を救い</em></strong><em>、主がその人を起き上がらせてくださいます。</em><strong><em>その人が<mark>罪を犯したのであれば、主が赦してくださいます</mark></em></strong><em>。だから、主にいやしていただくために、罪を告白し合い、</em><strong><em>互いのために祈りなさい。正しい人の祈りは、大きな力があり、効果をもたらします</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/iak/5/#L14-16"><em>ヤコ. 5:14-16</em></a><em>）</em></p></blockquote><blockquote><p><em>「</em><strong><em>正気になって身を正しなさい。<mark>罪を犯してはならない</mark></em></strong><em>。</em><strong><em>神について何も知らない人がいるからです</em></strong><em>。わたしがこう言うのは、あなたがたを恥じ入らせるためです」（</em><a href="https://bibleox.com/ja/jp-ni/1kor/15/#L34"><em>１コリ. 15:34</em></a><em>）</em></p></blockquote><blockquote><p>「互いに親切にし、憐れみの心で接し、神がキリストによってあなたがたを赦してくださったように、<strong><mark>赦し合いなさい</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/ef/4/#L32">エフェ. 4:32</a>）</p></blockquote><p>最後に、主イエス・キリストは弟子たちに祈りをお与えになり、その中で罪の赦しを願うことを教えておられます。これは生涯に一度だけ唱える一回限りの祈りではありません。弟子たちがキリストに祈ることを教えてくださるよう願い、キリストはそれに答えてこの型をお与えになったのです：</p><blockquote><p>「そこで、イエスは言われた。『<strong><mark>祈るときには、こう言いなさい</mark></strong>。「父よ、御名が崇められますように。御国が来ますように。わたしたちに必要な糧を毎日与えてください。<strong><mark>わたしたちの罪を赦してください</mark></strong>、わたしたちも自分に負い目のある人を皆赦しますから。わたしたちを誘惑に遭わせないでください」』」（<a href="https://bibleox.com/ja/jp-ni/lk/11/#L1-4">ルカ. 11:1-4</a>; <a href="https://bibleox.com/ja/jp-ni/mf/6/#L7-13">マタ. 6:7-13</a>）</p></blockquote><h2>批判への応答</h2><h3>水と霊とによる誕生についての言葉（ヨハ 3:5）で、水は霊を意味するのか</h3><p>新しいプロテスタントの人々は、救いのために水と霊とによって生まれる必要があるという救い主の言葉を寓意的に説明し、水は霊を意味すると言います。彼らは次の二つの節を結びつけます：</p><blockquote><p>「イエスはお答えになった。『はっきり言っておく。だれでも<strong><mark>水</mark>と霊とによって生まれなければ</strong>、神の国に入ることはできない』」（<a href="https://bibleox.com/ja/jp-ni/in/3/#L5">ヨハ. 3:5</a>）</p></blockquote><blockquote><p>「わたしを信じる者は、聖書に書いてあるとおり、<strong>その人の内から<mark>生きた水が川となって</mark>流れ出るようになる。』イエスは、御自分を信じる人々が受けようとしている<mark>“霊”について言われた</mark></strong>のである。イエスはまだ栄光を受けておられなかったので、“霊”がまだ降っていなかったからである」（<a href="https://bibleox.com/ja/jp-ni/in/7/#L38-39">ヨハ. 7:38-39</a>）</p></blockquote><p>しかし水を霊と理解するなら、同語反復（同じことの余計な繰り返し）になってしまいます。そうすると、キリストは、霊と霊とによって生まれなければならないと言われたことになります。この話の中で霊について直接語るのがふさわしかったのなら、なぜさらに寓意に訴える必要があったでしょうか。また寓意だとしても、「<em>霊の水によって</em>」あるいは「<em>水</em><strong><em><u>すなわち</u></em></strong><em>霊によって</em>」（同じ意味になります）と言わなければならなかったはずです。ところが実際には、霊<strong><u>と</u></strong>、もう一つ別のもの、すなわち水とによって生まれなければならないことになっているのです。</p><p>さらに、聖書からもよく知られているように、使徒たちは再生を文字どおり水の中で行いました。つまり、洗礼における水は常に本物の水でしたが、腹から（直訳）川が流れ出たことは、だれにも一度もありませんでした。</p><p>したがって、使徒たちは水の中で洗礼を授け、洗礼は聖霊によって成し遂げられたのですから、わたしたちは水と霊とによる誕生についての救い主の言葉を、使徒たちが行ったそのとおりの仕方、すなわち水と霊とによる仕方に当てはまるものと理解します。つまりこの理解は、水の中で洗礼を授けた使徒的な実践に客観的に結びついているのです。古代の教会は、洗礼を水と切り離して純粋に頭の中のこととして理解したことは一度もなく、父と子と聖霊の名を呼び求めながら聖別された水に三度浸すこととして理解していました。</p><h3>洗礼を受けるには悔い改めなければならないが、幼児は悔い改めることができないので、洗礼を受けられないのか</h3><p>教会から離れたいくつかの団体は、教会が幼児を洗礼に受け入れていることを非難します。彼らは、使徒が聞き手たちにまず悔い改め、それから洗礼を受けるよう呼びかけている聖書の節を挙げます：</p><blockquote><p>「すると、ペトロは彼らに言った。『<strong>悔い改めなさい</strong>。<strong>めいめい</strong>、イエス・キリストの名によって<strong>洗礼を受け</strong>、罪を赦していただきなさい。そうすれば、賜物として聖霊を受けます。この約束は、あなたがたにも、あなたがたの子供にも、遠くにいるすべての人にも、つまり、わたしたちの神である主が招いてくださる者ならだれにでも、与えられているものなのです』」（<a href="https://bibleox.com/ja/jp-ni/act/2/#L38-39">使. 2:38-39</a>）</p></blockquote><p>悔い改めの要求は大人に関するものです。幼児には個人的な罪がないので、悔い改めの要求を当てはめるのは困難です。つまり、幼児は洗礼を受ける必要がありますが、個人的な罪がないので、存在しないものを悔い改める必要もないのです。</p><p>全体として、この非難は非常に奇妙に聞こえます。そこからは、幼児がキリストを着る（洗礼を受ける — <a href="https://bibleox.com/ja/jp-ni/gal/3/#L27">ガラ. 3:27</a>）ためには、まず罪を犯さなければならず、罪を犯すまでは悔い改めることができず、したがって決して洗礼を受けられない、という結論になります。ある種の不条理が生じます。キリストとの一致の可能性を得るためには、まずキリストに対して罪を犯さなければならない、というのです。もちろん、これは大きな誤りです。洗礼はすべての人に必要ですが、悔い改めが必要なのは罪を犯した人だけです。</p><p>預言者ヨハネによる悔い改めの洗礼は、キリストへの洗礼と同じではありませんが（<a href="https://bibleox.com/ja/jp-ni/act/19/#L4">使. 19:4</a>）、この推論が正しいことを確かめさせてくれます。預言者ヨハネは悔い改めのために洗礼を授けていましたが、キリストが彼のもとに来られると、キリストは悔い改めることなく、すぐに水に入られます。キリストには罪がないので、悔い改めの洗礼を悔い改めなしに受けられるのです。幼児も同じです。キリストは、悔い改めの洗礼を受けられるようになるために罪を得る必要はありませんでした。幼児も同じです。すべての人が洗礼に招かれていますが、悔い改めるのは、悔い改めるべきことがある人だけです。</p><h3>洗礼を受けるには信仰が必要だが、幼児は信仰を告白できないので、洗礼を受けられないのか</h3><p>教会から離れた団体は、主が、人々は信じて洗礼を受けるべきだと言われた別の聖書の節も挙げます：</p><blockquote><p>「<strong>信じて洗礼を受ける者は</strong>救われるが、信じない者は滅びの宣告を受ける」（<a href="https://bibleox.com/ja/jp-ni/mk/16/#L16">マコ. 16:16</a>）</p></blockquote><p>このように、救いの必要条件には、<strong>信仰</strong>を得ることと<strong>洗礼</strong>を受けることが含まれます。これらの条件を満たさなければ、人は救われることができません。しかし、信仰の要求を幼児に当てはめるのは困難です。それゆえ幼児は代父母の信仰によって洗礼を受けるのであり、それにも聖書的な根拠があります（<a href="#HH-ほかの人々の信仰による神の恵みの働き">詳しく</a>）。</p><p>また、次の言葉に特に注意を払うべきです。信じない者は滅びの宣告を受ける。では、幼児は信じることができないので、滅びの宣告を受けることになるのでしょうか。</p><blockquote><p>「信じて洗礼を受ける者は救われるが、<strong>信じない者は滅びの宣告を受ける</strong>」（<a href="https://bibleox.com/ja/jp-ni/mk/16/#L16">マコ. 16:16</a>）</p></blockquote><p>要するに、この節の信仰の要求は大人にだけ関わるものなのです。洗礼そのものは、救い主がほかの箇所で言われたとおり（<a href="https://bibleox.com/ja/jp-ni/in/3/#L3,5-6">ヨハ. 3:3,5-6</a>）、幼児を含むすべての人に必要です。幼児は、代父母の信仰によって（<a href="#HH-ほかの人々の信仰による神の恵みの働き">詳しく</a>）洗礼においてすでにキリストを着た者として（<a href="https://bibleox.com/ja/jp-ni/gal/3/#L27">ガラ. 3:27</a>）成長していきます。幼児の能力が育つにつれて、代父母によって信仰を強められていきます。そして、もし不幸が起こり、幼児が痛ましい状況で亡くなったとしても、洗礼を受けた者として天の国と、キリストと共にある永遠の命にあずかるのです。</p><p>救い主の言葉の順序（信じて洗礼を受ける）について言えば、逆の順序もあります：</p><blockquote><p>「洗礼者ヨハネが<strong>荒れ野に現れて</strong>、罪の赦しを得させるために<strong>悔い改めの洗礼を宣べ伝えた</strong>」（<a href="https://bibleox.com/ja/jp-ni/mk/1/#L4">マコ. 1:4</a>）<em>（ギリシア語原文では ὁ βαπτίζων ἐν τῇ ἐρήμῳ καὶ κηρύσσων —「荒れ野で洗礼を授け、そして宣べ伝えた」です。）</em></p></blockquote><p>それなら、ここでも、まず悔い改めの洗礼が与えられ、それから宣教が聞かれたと認めるべきでしょう。</p><h3>しかしキリストは30歳になって初めて洗礼を受けられたのではないか</h3><p>預言者洗礼者ヨハネの洗礼は、キリストへの洗礼ではありません。すでにヨハネの洗礼を受けていた人々に、使徒パウロは改めてキリストへの洗礼を授けました：</p><blockquote><p>「彼らに、『信仰に入ったとき、聖霊を受けましたか』と言うと、彼らは、『いいえ、聖霊があるかどうか、聞いたこともありません』と言った。パウロが、『<strong>それなら、どんな洗礼を受けたのですか</strong>』と言うと、『<strong>ヨハネの洗礼です</strong>』と言った。そこで、パウロは言った。『<strong>ヨハネは</strong>、自分の後から来る方、つまりイエスを信じるようにと、民に告げて、<strong>悔い改めの洗礼を授けたのです</strong>。』<strong>人々はこれを聞いて主イエスの名によって洗礼を受けた。パウロが彼らの上に手を置くと、聖霊が降り</strong>、その人たちは異言を話したり、預言をしたりした」（<a href="https://bibleox.com/ja/jp-ni/act/19/#L2-6">使. 19:2-6</a>）</p></blockquote><p>そのうえ、この点でキリストに倣わず、30歳で洗礼を受けもせず、自分の子供たちには、幼児期ではないにせよ、30歳の誕生日を待たずに8～12歳で洗礼を授けている人々からこのような非難を聞くのは奇妙です。もし教会を非難する人が、洗礼の年齢においてキリスト（ヨハネによるキリストの洗礼）に倣わなければならないと考えるなら、その人は洗礼を受けるために30歳まで待たなければならないことになるでしょう。しかしこれは間違いです。預言者ヨハネによる悔い改めの洗礼は、キリストへの洗礼ではないからです（<a href="https://bibleox.com/ja/jp-ni/act/19/#L2-6">使. 19:2-6</a>）。キリストが30歳まで待たれたのは、洗礼を受けるためではなく、御自分の奉仕（<a href="https://bibleox.com/ja/jp-ni/chis/4/#L3">民. 4:3</a>）、宣教へと出て行き、御自分の栄光を現すためでした。キリストの宣教は預言者ヨハネの証しから始まりました。ヨハネは、洗礼を受けるために自分のもとに来られたイエスを、キリストとして指し示したのです。ヨハネは預言者です。彼はいつ、救い主の到来についての預言の成就を指し示すでしょうか。いつ救い主を指し示すでしょうか。救い主が御自分の奉仕に出て行く準備ができたとき、すなわち30歳のときです（<a href="https://bibleox.com/ja/jp-ni/chis/4/#L3">民. 4:3</a>）。</p><h3>しかし賢い盗賊は洗礼を受ける間もなかったのに救われたのではないか</h3><p>それは、主がまだ洗礼の機密を制定しておられなかった時のことでした。信じて悔い改めた盗賊は、水による洗礼なしに救われました。それはちょうど、旧約の義人たちが、新約の教会が造られる前に救われたのと同じです。新約の教会は、キリストの十字架刑から52日（2+40+10）後に初めて現れることになるのです。</p><p><strong>洗礼は水と霊とによる誕生である</strong></p><blockquote><p>「イエスはお答えになった。『はっきり言っておく。<strong>だれでも<mark>水と霊とによって生まれなければ</mark>、神の国に入ることはできない</strong>』」（<a href="https://bibleox.com/ja/jp-ni/in/3/#L5">ヨハ. 3:5</a>）</p></blockquote><p><strong>キリストは聖霊によって洗礼を授けられる</strong></p><blockquote><p>「そこで、ヨハネは皆に向かって言った。『わたしはあなたたちに水で洗礼を授けるが、わたしよりも優れた方が来られる。わたしは、その方の履物のひもを解く値打ちもない。<strong><mark>その方は、聖霊と火であなたたちに洗礼をお授けになる</mark></strong>』」（<a href="https://bibleox.com/ja/jp-ni/lk/3/#L16">ルカ. 3:16</a>）（<a href="https://bibleox.com/ja/jp-ni/mf/3/#L11">マタ. 3:11</a>）（<a href="https://bibleox.com/ja/jp-ni/mk/1/#L8">マコ. 1:8</a>）</p></blockquote><p><strong>キリストが去って行かれるまで、聖霊は来られない</strong></p><blockquote><p>「しかし、実を言うと、わたしが去って行くのは、あなたがたのためになる。<strong><mark>わたしが去って行かなければ、弁護者はあなたがたのところに来ないからである</mark></strong>。わたしが行けば、弁護者をあなたがたのところに送る」（<a href="https://bibleox.com/ja/jp-ni/in/16/#L7">ヨハ. 16:7</a>）（<a href="https://bibleox.com/ja/jp-ni/in/14/#L16">ヨハ. 14:16</a>）（<a href="https://bibleox.com/ja/jp-ni/in/14/#L26">ヨハ. 14:26</a>）（<a href="https://bibleox.com/ja/jp-ni/in/7/#L38-39">ヨハ. 7:38-39</a>）</p></blockquote><blockquote><p>「<strong><mark>わたしが父のもとからあなたがたに遣わそうとしている弁護者</mark></strong>、すなわち、父のもとから出る真理の霊<strong><mark>が来るとき</mark></strong>、その方がわたしについて証しをなさるはずである」（<a href="https://bibleox.com/ja/jp-ni/in/15/#L26">ヨハ. 15:26</a>）</p></blockquote><blockquote><p>「わたしは、父が約束されたものをあなたがたに送る。<strong>高い所からの力に覆われるまでは、都にとどまっていなさい</strong>」（<a href="https://bibleox.com/ja/jp-ni/lk/24/#L49">ルカ. 24:49</a>）</p></blockquote><p><strong>復活の後、キリストはまだ父のもとに上っておられなかった</strong></p><blockquote><p>「イエスは言われた。『わたしにすがりつくのはよしなさい。<strong><mark>まだ父のもとへ上っていないのだから</mark></strong>。わたしの兄弟たちのところへ行って、こう言いなさい。「わたしの父であり、あなたがたの父である方、また、わたしの神であり、あなたがたの神である方のところへわたしは上る」と』」（<a href="https://bibleox.com/ja/jp-ni/in/20/#L17">ヨハ. 20:17</a>）</p></blockquote><p><strong>約束された聖霊による洗礼は、キリストの復活から50日後に初めて行われた</strong></p><blockquote><p>「テオフィロさま、わたしは先に第一巻を著して、イエスが行い、また教え始めてから、お選びになった使徒たちに聖霊を通して指図を与え、天に上げられた日までのすべてのことについて書き記しました。イエスは苦難を受けた後、御自分が生きていることを、数多くの証拠をもって使徒たちに示し、<strong>四十日にわたって彼らに現れ</strong>、神の国について話された。<strong>そして、彼らと食事を共にしていたとき、こう命じられた。『エルサレムを離れず、前にわたしから聞いた、父の約束されたものを待ちなさい。<mark>ヨハネは水で洗礼を授けたが、あなたがたは間もなく聖霊による洗礼を授けられるからである</mark>』</strong>」（<a href="https://bibleox.com/ja/jp-ni/act/1/#L1-5">使. 1:1-5</a>）</p></blockquote><blockquote><p>「&lt;…&gt; イエスは苦難を受けた後、御自分が生きていることを、数多くの証拠をもって使徒たちに示し、<strong><mark>四十日にわたって彼らに現れ</mark></strong>、神の国について話された。<strong>そして、彼らと食事を共にしていたとき、こう命じられた。『エルサレムを離れず、前にわたしから聞いた、父の約束されたものを待ちなさい。ヨハネは水で洗礼を授けたが、あなたがたは<mark>間もなく</mark>聖霊による洗礼を授けられるからである。』</strong>&lt;…&gt;『あなたがたの上に聖霊が降ると、あなたがたは力を受ける。そして、エルサレムばかりでなく、ユダヤとサマリアの全土で、また、地の果てに至るまで、わたしの証人となる。』こう話し終わると、イエスは彼らが見ているうちに天に上げられたが、雲に覆われて彼らの目から見えなくなった」（<a href="https://bibleox.com/ja/jp-ni/act/1/#L1-5,8-9">使. 1:1-5,8-9</a>）</p></blockquote><blockquote><p>「<strong>五旬祭の日が来て</strong>、一同が一つになって集まっていると、&lt;…&gt; そして、<strong><mark>炎のような舌が分かれ分かれに現れ、一人一人の上にとどまった。すると、一同は聖霊に満たされ</mark></strong>、“霊”が語らせるままに、ほかの国々の言葉で話しだした」（<a href="https://bibleox.com/ja/jp-ni/act/2/#L1,3-4">使. 2:1,3-4</a>）</p></blockquote><p>ただし、キリストの復活のまさにその日にも聖霊を送ることが語られていますが、洗礼については何も言われていません。それは、罪を赦し、また赦さないままにしておく権能の授与と共に、司祭の位階が立てられたことでした：</p><blockquote><p>「<strong>週の初めの日、朝早く、まだ暗いうちに、マグダラのマリアは墓に行った</strong>。&lt;…&gt; <strong>その日、すなわち週の初めの日の夕方</strong>、弟子たちはユダヤ人を恐れて、自分たちのいる家の戸に鍵をかけていた。<strong>そこへ、イエスが来て</strong>真ん中に立ち、『あなたがたに平和があるように』と言われた。&lt;…&gt; <strong>そう言ってから、彼らに息を吹きかけて言われた。『聖霊を受けなさい』</strong>」（<a href="https://bibleox.com/ja/jp-ni/in/20/#L1,19,22">ヨハ. 20:1,19,22</a>）</p></blockquote><h3>「子供たちがキリストのもとに来るのを妨げてはならない」</h3><p>教会から離れた団体は、洗礼なしには救いがありえないという教会の教え（<a href="https://bibleox.com/ja/jp-ni/in/3/#L3,5-6">ヨハ. 3:3,5-6</a>）が幼児の救いを妨げていると、教会を非難します。それによって教会は、幼児がキリストのもとに来るのを許していないというのです。彼らは次の節を引き合いに出します：</p><blockquote><p>「イエスに触れていただくために、<strong>人々は乳飲み子までも連れて来た</strong>。弟子たちは、これを見て叱った。しかし、イエスは乳飲み子たちを呼び寄せて言われた。『<strong>子供たちをわたしのところに来させなさい。妨げてはならない</strong>。神の国はこのような者たちのものである』」（<a href="https://bibleox.com/ja/jp-ni/lk/18/#L15-16">ルカ. 18:15-16</a>）</p></blockquote><p>実のところ、この節はまさに幼児洗礼の反対者たちを明らかにしています。</p><p>この聖書の場面では、文字どおり何が起こっているのでしょうか。</p><ol><li><p><strong>母親たちが幼子をキリストのもとに連れて来る</strong>。主に祝福していただくためです。</p></li><li><p><strong>弟子たちが母親たちの前に立ちはだかり</strong>、幼子をキリストのもとに連れて来ることを禁じる。</p></li><li><p><strong>主は母親たちに道を開かれ</strong>、御自分のもとに幼子を連れて来るのを妨げないよう弟子たちに言われ、幼子たちを祝福される（<a href="https://bibleox.com/ja/jp-ni/mk/10/#L16">マコ. 10:16</a>）。</p></li></ol><p>教会の反対者たちは何をしているでしょうか。</p><ol><li><p>母親たちは、生まれた時から自分の幼子をキリストと結びつけたいと願っています（わたしたちは、分派を離れた母親たちから直接これを知っています）。</p></li><li><p>教会の反対者たちは母親たちの前に立ちはだかり、聖書がキリストを着ることと呼んでいる洗礼（<a href="https://bibleox.com/ja/jp-ni/gal/3/#L27">ガラ. 3:27</a>）を、文字どおり禁じています。</p></li></ol><p>教会は何をしているでしょうか。</p><ol><li><p>教会は、母親たちを幼子と共にキリストのもとへ招きます。</p></li><li><p>母親たちが幼子を連れて来ると、教会は洗礼、聖体機密、聖なるものを通して幼子をキリストと結びつけ、祝福を与えます。</p></li></ol><p>教会の反対者たちはすべてを逆さまにしています。母親と幼子をキリストのもとに来るよう招く教会の呼びかけを、彼らはキリストとの一致の妨げと呼び、母親が幼子に洗礼を受けさせることへの自分たちの禁止を、子供たちがキリストのもとに来るのを「妨げないこと」と呼んでいるのです。</p><p>もし幼児が洗礼なしに救われるのであれば、教会の教えは、キリストが幼児を救われることを少しも妨げません。しかし、キリストが洗礼なしにはだれも神の国に入ることはできないと言われたことを考えれば（<a href="https://bibleox.com/ja/jp-ni/in/3/#L3,5-6">ヨハ. 3:3,5-6</a>）、幼児に洗礼を授けることを分派の人々が禁じるのは、幼児の救いを大いに妨げているのです。</p><h3>罪の赦しは信仰を得たときに起こり、水に浸されるときではないのか</h3><p>多くの新しいプロテスタントの人々は、水による洗礼を単なる証し（一種のしるし）と呼び、人の再生と罪の赦しはそれ以前、すなわちその人が信じて自分の罪を神に詫びたときにすぐ起こると考えています。しかし聖書の中でわたしたちは、まさに水による洗礼において人が再生し、罪が洗い流されること、まさにこれこそが人にとって救いとなることを見ます。</p><p>サウロ（後の使徒パウロ）はキリストによって目を見えなくされ、すぐにキリストを<strong>信じます</strong>。しかしそれは罪の赦しにはつながりませんでした。サウロは、水による洗礼を受けて罪から洗い清められるために、ダマスコへ遣わされます：</p><blockquote><p>「『主よ、あなたはどなたですか』と尋ねると、『わたしは、あなたが迫害しているナザレのイエスである』と答えがありました。&lt;…&gt;『<strong><mark>主よ、どうしたらよいでしょうか</mark></strong>』と申しますと、主は、『立ち上がって<strong>ダマスコへ行け</strong>。しなければならないことは、すべてそこで知らされる』と言われました。わたしは、その光の輝きのために目が見えなくなっていましたので、一緒にいた人たちに手を引かれて、ダマスコに入りました。ダマスコには<a href="https://bibleox.com/ru/ru/w/%D0%90%D0%BD%D0%B0%D0%BD%D0%B8%D1%8F-%D0%B5%D0%BF%D0%B8%D1%81%D0%BA%D0%BE%D0%BF-%D0%94%D0%B0%D0%BC%D0%B0%D1%81%D0%BA%D0%B0-I-%D0%B2%D0%B5%D0%BA">アナニア</a>（ロシア語）という人がいました。律法に従って生活する信仰深い人で、そこに住んでいるすべてのユダヤ人の中で評判の良い人でした。この人がわたしのところに来て、そばに立ってこう言いました。『兄弟サウル、元どおり見えるようになりなさい。』するとそのとき、わたしはその人が見えるようになったのです」（<a href="https://bibleox.com/ja/jp-ni/act/22/#L8,10-13">使. 22:8,10-13</a>）</p></blockquote><p>信じたサウロは、洗礼によって罪から洗い清められる必要があります：</p><blockquote><p>「今、何をためらっているのです。立ち上がりなさい。その方の名を唱え、<strong><mark>洗礼を受けて罪を洗い清めなさい</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/act/22/#L16">使. 22:16</a>）</p></blockquote><p>別の箇所では、洗礼は（単に証しするのではなく）救うと直接言われています：</p><blockquote><p>「この水で前もって表された<strong><mark>洗礼</mark></strong>は、今やイエス・キリストの復活によってあなたがたをも<strong><mark>救う</mark></strong>のです。洗礼は、肉の汚れを取り除くことではなくて、神に正しい良心を願い求めることです」（<a href="https://bibleox.com/ja/jp-ni/1pet/3/#L21">１ペト. 3:21</a>）（<a href="https://bibleox.com/ja/jp-ni/tit/3/#L5">テト. 3:5</a>）</p></blockquote><h3>人はキリストについての宣教によって霊的に生まれるのか</h3><p>機密における神の働きを否定する新しいプロテスタントの人々は、洗礼の水における人の霊的な誕生も否定します。それを否定して、彼らは、この「水と霊とによる」誕生（<a href="https://bibleox.com/ja/jp-ni/in/3/#L3,5">ヨハ. 3:3,5</a>）そのものは宣教の瞬間にだけ起こり、ほかはすべて荘厳な象徴的儀式にすぎないと教えます。この考えを裏づけるために、彼らは次のような引用を挙げます：</p><blockquote><p>「御父は、御心のままに、<strong>真理の言葉によってわたしたちを生んでくださいました</strong>。それは、わたしたちを、いわば造られたものの初穂となさるためです」（<a href="https://bibleox.com/ja/jp-ni/iak/1/#L18">ヤコ. 1:18</a>）</p></blockquote><blockquote><p>「あなたがたは、朽ちる種からではなく、朽ちない種から、すなわち、<strong>神の変わることのない生きた言葉によって新たに生まれたのです</strong>。こう言われているからです。『人は皆、草のようで、その華やかさはすべて、草の花のようだ。草は枯れ、花は散る。しかし、主の言葉は永遠に変わることがない。』<strong>これこそ、あなたがたに福音として告げ知らされた言葉なのです</strong>」（<a href="https://bibleox.com/ja/jp-ni/1pet/1/#L23-25">１ペト. 1:23-25</a>）</p></blockquote><p>神は、聞く人の魂に働きかけて、教会による福音の宣教を助けられます。この宣教は人の内に大転換をもたらし、悔い改めへと呼び招き、命の道へと導くことができます。神の言葉は、人を罪の眠りから目覚めさせ、悔い改めを起こし、信仰を生み出す手段です[1]。しかしこの宣教は、まだ人を罪から清めることはなく、水による再生の洗い（<a href="https://bibleox.com/ja/jp-ni/ef/5/#L25-26">エフェ. 5:25-26</a>; <a href="https://bibleox.com/ja/jp-ni/tit/3/#L5">テト. 3:5</a>）における水と霊とによる霊的な誕生（<a href="https://bibleox.com/ja/jp-ni/in/3/#L3,5">ヨハ. 3:3,5</a>）を与えるものではありません。</p><p>ほかの箇所では、罪の赦しのためには、水の中で行われる洗礼の機密を受けなければならないとはっきり言われています：</p><blockquote><p>「今、何をためらっているのです。<strong>立ち上がりなさい</strong>。その方の名を唱え、<strong><mark>洗礼を受けて罪を洗い清めなさい</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/act/22/#L16">使. 22:16</a>）</p></blockquote><p>信仰と悔い改めのない人は洗礼に受け入れられません。それゆえ、まず神の言葉を聞くことが必要であり、次に聞くことからの信仰（<a href="https://bibleox.com/ja/jp-ni/rim/10/#L17">ロマ. 10:17</a>）、そしてその後に初めて、水と霊とによる誕生、罪からの清め、洗礼と傅膏における聖霊の印があるのです。</p><p>まず使徒は神の言葉を宣べ伝え、宣教を聞いた人々が<em>心を打たれた</em>とき、罪の赦しのために洗礼を受けるよう彼らに呼びかけます：</p><blockquote><p>「人々は<strong><mark>これを聞いて</mark></strong>大いに<strong><mark>心を打たれ</mark></strong>、ペトロとほかの使徒たちに、<strong>『兄弟たち、わたしたちはどうしたらよいのですか』</strong>と言った。すると、ペトロは彼らに言った。『<strong>悔い改めなさい。<mark>めいめい</mark></strong>、イエス・キリストの名によって<strong><mark>洗礼を受け</mark></strong>、<strong><mark>罪を赦していただきなさい</mark></strong>。そうすれば、賜物として聖霊を受けます』」（<a href="https://bibleox.com/ja/jp-ni/act/2/#L37-38">使. 2:37-38</a>）</p></blockquote><h3>「洗礼は肉の汚れを取り除くことではなく、誓約である」のか</h3><blockquote><p>「この水で前もって表された洗礼は、今やイエス・キリストの復活によってあなたがたをも救うのです。洗礼は、肉の汚れを取り除くことではなくて、<strong>神に正しい良心を願い求めること（ἐπερώτημα）</strong>です」（<a href="https://bibleox.com/ja/jp-ni/1pet/3/#L21">１ペト. 3:21</a>）</p></blockquote><p>いくつかの翻訳（たとえばロシア語の宗務院訳）では、この箇所は「約束」あるいは「誓約」と訳されており、英語の NKJV は「神に対する正しい良心の応答」としています。新共同訳は原文に沿って「願い求めること」と訳しています。この違いは根本的なものです。「約束」には機密はなく、神から何も受けません。反対に、神に約束を差し出すのです。しかしわたしたちが神に願い求めるとき、神の側からの働き（機密）が期待されます。（神の側からの）罪の赦しによって、過去の罪に重荷を負わされていない、正しく清い良心が得られるのです（<a href="https://bibleox.com/ja/jp-ni/evr/9/#L14">ヘブ. 9:14</a>）。そして、プロテスタントの人々が考えるように水に浸されることにおいて何も成し遂げられないのなら、そもそもなぜ神に何かを願い求めるのでしょうか。神がここで何もお与えにならないのなら。</p><p>使徒ペトロの手紙はギリシア語で書かれました。スラヴ語も知っていたギリシア人である聖なる兄弟キリルとメフォディは、ἐπερώτημα を約束ではなく、問い求め（願い）、すなわち正しい良心を神に願い求めることと訳しました。</p><p>また、古代のキリスト者の一人で、ギリシア人であり教会の主教であった神学者グリゴリイ（4世紀）も、これは神の働き、すなわち願いに応じて人に正しい良心が与えられることについてであると書いています（<a href="https://azbyka.ru/otechnik/Grigorij_Bogoslov/slova-izd-2007-g/40">第40講話「聖なる洗礼について」</a>、ロシア語）。</p><p>そして全体として、新約の本文では、この語（とその動詞）は決して約束とは訳されず、問いかけ、質問と訳されています。</p><ul><li><p>ἐπερωτῆσαι — 尋ねる（マタ 22:46）</p></li><li><p>ἐπερωτῶσιν — 尋ねる（マコ 7:5）</p></li><li><p>ἐπερωτῆσαι — 尋ねる（マコ 9:32）</p></li><li><p>Ἐπερωτήσω — 尋ねよう（マコ 11:29）</p></li><li><p>ἐπερωτῆσαι — 質問する（マコ 12:34）</p></li><li><p>ἐπερωτῶντα — 質問している（ルカ 2:46）</p></li><li><p>Ἐπερωτῶ — 尋ねたい（ルカ 6:9）</p></li><li><p>Ἐπερωτηθεὶς — 尋ねられて（ルカ 17:20）</p></li><li><p>ἐπερωτᾶν — 質問する（ルカ 20:40）</p></li><li><p>ἐπερωτήσατε — 尋ねなさい（ヨハ 9:23）</p></li><li><p>ἐπερωτήσας — 尋ねて（使 23:34）</p></li><li><p>ἐπερωτῶσιν — 尋ねない者たちに（ロマ 10:20）</p></li><li><p>ἐπερωτάτωσαν — 尋ねなさい（１コリ 14:35）</p></li><li><p>ἐπερώτημα — 問い求め（教会スラヴ語訳）（１ペト 3:21）</p></li></ul><p>つまり、約束の場合のように人が神に何かを差し出すのではありません。人はただ願い求めるだけで、与えるのは神なのです（「<strong><mark>わたしたちの良心を…清めて</mark></strong>」と直接書かれています。<a href="https://bibleox.com/ja/jp-ni/evr/9/#L14">ヘブ. 9:14</a>）。</p><p>使徒は、洗礼は体から汚れを洗い落とすのではなく（肉の汚れを取り除くことではなく）、内的に罪から洗い清めるのだと指摘しています。つまりそれは機密、すなわち大切で、目から隠され、完全には理解も説明もできないものなのです。</p><p>これはすべて水に対する霊の働きによって起こります。それゆえ主イエス・キリストは、人は霊によってだけでなく、水と霊とによって生まれると言われたのです：</p><blockquote><p>「イエスは答えて言われた。『はっきり言っておく。人は、新たに生まれなければ、神の国を見ることはできない。』&lt;…&gt; イエスはお答えになった。『はっきり言っておく。<strong>だれでも水と霊とによって生まれなければ、神の国に入ることはできない</strong>。肉から生まれたものは肉である。霊から生まれたものは霊である』」（<a href="https://bibleox.com/ja/jp-ni/in/3/#L3,5-6">ヨハ. 3:3,5-6</a>）</p></blockquote><p>さらに、使徒は結論として、洗礼は救うと言っています：</p><blockquote><p>「この水で前もって表された<strong><mark>洗礼</mark></strong>は、今やイエス・キリストの復活によってあなたがたをも<strong><mark>救う</mark></strong>のです」（<a href="https://bibleox.com/ja/jp-ni/1pet/3/#L21">１ペト. 3:21</a>）</p></blockquote><p>新しいプロテスタントの人々（バプテスト派）は、これに根本的に同意しません。彼らにとって洗礼は荘厳な約束にすぎず、形式であって、救いをもたらすものではありません。しかし使徒は、洗礼こそが<strong>救う</strong>と言っているのです。</p><p>彼らは、信仰と悔い改めを得た瞬間に罪の赦しを受けると考えていますが、使徒パウロは、信じたにもかかわらず、その後、罪を洗い清めるために洗礼を受けるよう言われました：</p><blockquote><p>「今、何をためらっているのです。<strong>立ち上がりなさい</strong>。その方の名を唱え、<strong><mark>洗礼を受けて罪を洗い清めなさい</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/act/22/#L16">使. 22:16</a>）</p></blockquote><p>ここでも同じことが言われています：</p><blockquote><p>「すると、ペトロは彼らに言った。『悔い改めなさい。<strong><mark>めいめい</mark></strong>、イエス・キリストの名によって<strong><mark>洗礼を受け</mark></strong>、<strong><mark>罪を赦していただきなさい</mark></strong>。そうすれば、賜物として聖霊を受けます』」（<a href="https://bibleox.com/ja/jp-ni/act/2/#L38">使. 2:38</a>）</p></blockquote><h3>罪から清めるのは洗礼ではなく神の言葉なのか</h3><blockquote><p>「夫たちよ、キリストが教会を愛し、教会のために御自分をお与えになったように、妻を愛しなさい。キリストがそうなさったのは、<strong>言葉を伴う水の洗いによって、教会を清めて</strong>聖なるものとし」（<a href="https://bibleox.com/ja/jp-ni/ef/5/#L25-26">エフェ. 5:25-26</a>）</p></blockquote><p>キリストは教会を聖なるものとするために、教会のために御自分をお与えになりました。どのようにして教会を清めるのでしょうか。<em>—「水の洗いによって」</em>、すなわち聖なる洗礼によってです。そこでは水に三度浸すとともに、父と子と聖霊の名によって、という言葉が唱えられます（<a href="https://bibleox.com/ja/jp-ni/mf/28/#L19">マタ. 28:19</a>）。ここで語られているのは、まさにこの言葉です。そして、一方（水）も、他方（父と子と聖霊についての言葉）も除くことはできません。別の仕方で解釈するのは、言葉を文脈から引き離すことになります。ここで語られているのは、<em>水の洗い</em>に際して唱えられる言葉なのです。</p><h3>百人隊長コルネリウスについて。聖霊は洗礼なしに与えられるのか</h3><p>カリスマ派の分派の支持者たちは、単に祈りによって聖霊を受けるという自分たちの教えを擁護します。その擁護のために、彼らは、聖霊が洗礼の前に降った、ただ一度の例を挙げます：</p><blockquote><p>「ペトロがこれらのことをなおも話し続けていると、御言葉を聞いている一同の上に聖霊が降った」（<a href="https://bibleox.com/ja/jp-ni/act/10/#L44">使. 10:44</a>）</p></blockquote><p>これは、異邦人であった百人隊長コルネリウスの話です。彼らに洗礼を授けてよいのか、異邦人を教会に受け入れてよいのかは、明らかではありませんでした。</p><p>それゆえ主は、異邦人も教会に入ってよいことを示すために、特別な啓示をお与えになります。</p><ol><li><p>神は異邦人コルネリウスに、聖霊ではなく天使を遣わし、救われるために教会に向かい、使徒を招いてその話を聞くようにという知らせを伝えさせます。</p></li><li><p>使徒ペトロには同じ幻が三度示されます。宗教的に汚れた食べ物が彼のもとに降りて来て、声が屠って食べるよう命じます。声はこう説明します。「神が清めた物を、清くないなどと、あなたは言ってはならない」（<a href="https://bibleox.com/ja/jp-ni/act/10/#L15">使. 10:15</a>）</p></li><li><p>使徒が来て宣べ伝え始めると、聞いていた異邦人の上に聖霊が降ります。</p></li></ol><p>こうしたことすべての後、ユダヤ人出身のキリスト者たちは、起こったことに驚きます。どうして聖霊が異邦人の上に降るということがありうるのでしょうか。</p><blockquote><p>「割礼を受けている信者で、ペトロと一緒に来た人は皆、<strong>聖霊の賜物が異邦人の上にも注がれるのを見て</strong>、大いに驚いた」（<a href="https://bibleox.com/ja/jp-ni/act/10/#L45">使. 10:45</a>）</p></blockquote><p>そしてすべては異邦人の洗礼で終わります。神御自身がそれを指し示されたので、今や彼らはためらいなく洗礼を受けることができたのです：</p><blockquote><p>「『わたしたちと同様に聖霊を受けたこの人たちが、<strong>水で洗礼を受けるのを、いったいだれが妨げることができますか</strong>』と言った。<strong>そして、イエス・キリストの名によって洗礼を受けるようにと、その人たちに命じた</strong>。それから、コルネリウスたちは、ペトロになお数日滞在するようにと願った」（<a href="https://bibleox.com/ja/jp-ni/act/10/#L47-48">使. 10:47-48</a>）</p></blockquote><p>このように、これは聖霊が洗礼の前に来られた唯一の例です。洗礼の代わりにではなく、洗礼の前にです。洗礼はいずれにせよ行われるからです。そしてこの特別な聖霊の降臨には、例外的な理由があります。神である聖霊が、異邦人を教会に受け入れてよいことを示されるのです。</p><p>人の上に聖霊が降ることそのものは、洗礼とは別の機密です（<a href="https://bibleox.com/ja/ja/w/Ch2r_傅膏機密/">詳しく</a>）。</p><h3>宦官は使徒なしに聖霊を受けたのか</h3><p>この問いは<a href="https://bibleox.com/ja/ja/w/Ch2r_傅膏機密/">傅膏機密</a>の主題に属します。フィリポと宦官の場合（<a href="https://bibleox.com/ja/jp-ni/act/8/#L39">使. 8:39</a>）には、非常に重要な細かい点があります。</p><p>ロシア語の宗務院訳と教会スラヴ語訳では、この節は「聖霊が宦官の上に降り、主の天使がフィリポを連れ去った」となっています。しかし、最も古い解釈者たちを含む大多数の解釈者は、その中には聖金口イオアンもいますが、この本文を聖霊の降臨についての句（αγιον επεπεϲεν επι τον ευνουχον αγγελοϲ δε）なしに引用しています。そこでは単にこう言われています（新共同訳も、英語の NKJV やほとんどの英訳も、このように読んでいます）：</p><blockquote><p><em>主の霊<s>が宦官の上に降り、天使</s>がフィリポを連れ去った。</em></p></blockquote><p>これらの言葉のないシナイ写本（4世紀）：</p><blockquote><p><em>καὶ ἐκέλευσεν στῆναι τὸ ἅρμα,</em></p><p><em>καὶ κατέβησαν ἀμφότεροι εἰς τὸ ὕδωρ,</em></p><p><em>ὁ τε Φίλιππος καὶ ὁ εὐνοῦχος,</em></p><p><em>καὶ ἐβάπτισεν αὐτόν.</em></p><p><em>ὅτε δὲ ἀνέβησαν ἐκ τοῦ ὕδατος,</em></p><p><strong><em>πνεῦμα Κυρίου ἥρπασεν τὸν Φίλιππον</em></strong><em>,</em></p><p><em>καὶ οὐκ εἶδεν αὐτὸν οὐκέτι ὁ εὐνοῦχος·</em></p><p><em>ἐπορεύετο γὰρ τὴν ὁδὸν αὐτοῦ χαίρων.</em></p><p><em>Φίλιππος δὲ εὑρέθη εἰς Ἄζωτον,</em></p><p><em>καὶ διερχόμενος εὐηγγελίζετο τὰς πόλεις πάσας,</em></p><p><em>ἕως τοῦ ἐλθεῖν αὐτὸν εἰς Καισάριαν.（使 8:39-40）</em></p></blockquote><p>これらの言葉のないヴァティカン写本（4世紀）：</p><blockquote><p><em>και εκελευϲε ϲτηναι το αρμα και κατεβηϲαν αμφοτεροι ειϲ το υδωρ ο τε φιλιπποϲ και ο ευνουχοϲ και εβαπτιϲεν αυτον</em></p><p><em>οτε δε ανεβηϲαν εκ του υδατοϲ </em><strong><em>πνευμα κ̅υ̅ ηρπαϲεν το̅ φιλιππον</em></strong><em> και ουκ ειδε̅ αυτον ουκετι ο ευνουχοϲ επορευετο γαρ αυτου την οδον χαιρων</em></p></blockquote><p>聖金口イオアンはこのように引用しています（聖霊の降臨についての言葉なしに）：</p><blockquote><p><em>Ὅτε δὲ ἀνέβησαν ἀπὸ τοῦ ὕδατος, </em><strong><em>Πνεῦμα Κυρίου ἥρπασε τὸν Φίλιππον</em></strong><em>, καὶ οὐκ εἶδεν αὐτὸν οὐκ ἔτι ὁ εὐνοῦχος.</em></p></blockquote><p>（<a href="https://bibleox.com/el/grc/w/dNiR_%E1%BD%89%CE%BC%CE%B9%CE%BB%CE%AF%CE%B1%CE%B9_%CE%B5%E1%BC%B0%CF%82_%CF%84%E1%BD%B0%CF%82_%CE%A0%CF%81%CE%AC%CE%BE%CE%B5%CE%B9%CF%82_%CF%84%E1%BF%B6%CE%BD_%E1%BC%88%CF%80%CE%BF%CF%83%CF%84%CF%8C%CE%BB%CF%89%CE%BD#HH-%CE%9F%CE%9C%CE%99%CE%9B%CE%99%CE%91-%CE%99%CE%98%CD%B4">In acta apostolorum, ΟΜΙΛΙΑ ΙΘ</a>、ギリシア語）</p><p>主教ミハイル（ルージン）の注解：</p><blockquote><p><strong>聖霊が宦官の上に降り、主の天使がフィリポを連れ去った</strong>：この箇所がこのように読まれるのは、ごく少数の古代ギリシア語写本と翻訳（わたしたちのスラヴ語訳とロシア語訳はこれに従っています）、そしてごく少数の古代の解釈者においてだけである。大部分の写本と翻訳、そして解釈者（その中には聖金口とフェオフィラクトもいる）においては、こう読まれている。聖霊がフィリポを連れ去った。これがある写本における付加なのか、ほかの写本における脱落なのかを決めるのは難しいが、前者の方がより確からしい。その場合、それは宦官が聖霊を受けたことについて記者が沈黙していることによって説明される。</p></blockquote><p>（<a href="https://azbyka.ru/biblia/in/?Act.8:39&amp;r">出典</a>、ロシア語。ロシア語からの訳）</p><h2>いくつかの注記</h2><h3>幼児も信じることができる</h3><p>幼児も、自分の信仰を証しして質問に答えることはできないとしても、信じ、聖霊に満たされることができると考える十分な理由があります。</p><p>預言者ダビデは幼い時から神に信頼していました：</p><blockquote><p>「<strong>わたしを母の胎から取り出しその乳房にゆだねてくださった</strong>のはあなたです。母がわたしをみごもったときからわたしはあなたにすがってきました。母の胎にあるときから、あなたはわたしの神」（<a href="https://bibleox.com/ja/jp-ni/ps/22/#L10-11">詩. 22:10-11</a>）<em>（「その乳房にゆだねてくださった」は、ヘブライ語原文では מַבְטִיחִי עַל־שְׁדֵי אִמִּי —「母の乳房の上でわたしに信頼させてくださった」です。）</em></p></blockquote><p>預言者ヨハネは、生まれる前から救い主との出会いを感じ取り、それを喜びます：</p><blockquote><p>「そのころ、<strong>マリア（キリストを身ごもっている — 注）</strong>は出かけて、急いで山里に向かい、ユダの町に行った。そして、ザカリアの家に入ってエリサベトに挨拶した。マリアの挨拶をエリサベトが聞いたとき、<strong>その胎内の子（預言者ヨハネ — 注）がおどった</strong>。エリサベトは聖霊に満たされて」（<a href="https://bibleox.com/ja/jp-ni/lk/1/#L39-41">ルカ. 1:39-41</a>）</p></blockquote><p>キリストは、一人の子供を御自分の前に立たせて、御自分を信じる「これらの小さな者」について語られます。</p><blockquote><p>「そこで、イエスは<strong><mark>一人の子供</mark>を呼び寄せ</strong>、彼らの中に立たせて、言われた。『はっきり言っておく。心を入れ替えて子供のようにならなければ、決して天の国に入ることはできない。<strong>自分を低くして、この子供のようになる人</strong>が、天の国でいちばん偉いのだ。<strong>わたしの名のためにこのような一人の子供を受け入れる者</strong>は、わたしを受け入れるのである。しかし、<strong><mark>わたしを信じる</mark>これらの小さな者の一人をつまずかせる者は</strong>、大きな石臼を首に懸けられて、深い海に沈められる方がましである』」（<a href="https://bibleox.com/ja/jp-ni/mf/18/#L2-6">マタ. 18:2-6</a>）</p></blockquote><p>子供たちは、キリストのエルサレム入城のときにキリストを賛美しました：</p><blockquote><p>「他方、祭司長たちや、律法学者たちは、イエスがなさった不思議な業を見、<strong>境内で子供たちまで叫んで、『ダビデの子にホサナ』と言うのを聞いて</strong>腹を立て、イエスに言った。『子供たちが何と言っているか、聞こえるか。』イエスは言われた。『聞こえる。あなたたちこそ、「幼子や乳飲み子の口に、あなたは賛美を歌わせた」という言葉をまだ読んだことがないのか』」（<a href="https://bibleox.com/ja/jp-ni/mf/21/#L15-16">マタ. 21:15-16</a>）</p></blockquote><h3>だれかが洗礼なしに救われうるとは言われていない</h3><p>聖書には、だれかが洗礼なしに救われうるという指摘はありません。しかし、洗礼なしにはだれも神の国に入ることはできないと言われています（<a href="https://bibleox.com/ja/jp-ni/in/3/#L3,5-6">ヨハ. 3:3,5-6</a>）。</p>

  - src: миропомазание
    path: Ch2r_傅膏機密
    title: 傅膏機密
    title_sub: 正教会の七つの機密の一つ
    menu: { parent: "教会/機密", title: "傅膏機密", priority: 2 }
    references: |-
      <ol><li><p>主教たちは、いくつかの機密を行うことを司祭たちに委ねることができました。主教の意志なしには、これは起こりえませんでした。1世紀の聖人で、使徒たちの弟子であるアンティオキアの主教イグナティオスはこう書いています。「キリスト・イエスが父に従われたように、皆、主教に従いなさい。また使徒たちに従うように司祭団に従いなさい。輔祭たちを神の定めとして敬いなさい。<strong>主教なしには、だれも教会に関わることを何一つ行ってはなりません</strong>。<strong>主教によって、あるいは主教が委ねた者によって行われる聖体礼儀だけを、正しいものと見なしなさい</strong>。主教が現れる所には会衆もいなければなりません。キリスト・イエスがおられる所に公同の教会があるのと同じように。<strong>主教なしに洗礼を授けることも、愛餐を行うことも許されません</strong>。しかし主教が是認することは何であれ、神にも喜ばれることであり、行われることがすべて確かで有効なものとなるのです。&lt;…&gt; 神と主教とを敬うのは良いことです。主教を敬う者は神に敬われています。主教に知られずに何かを行う者は、（実際には）悪魔に仕えているのです」（<a href="https://bibleox.com/en/en/w/IgnAn_Sm/#HH-8">「スミルナの教会への手紙」8-9章</a>、英語。英訳からの訳）</p></li></ol><p>油を注ぐことは旧約において広く行われていました。王、預言者、祭司が油を注がれました。大いなる聖物であった特別な油によって、神殿とそのすべての器具が油を注がれ、聖別されました。油を塗ることは、キリストの宣教の時にも、その後にも行われました：</p><blockquote><p>「十二人は出かけて行って、悔い改めさせるために宣教した。そして、多くの悪霊を追い出し、<strong>油を塗って</strong>多くの病人をいやした」（<a href="https://bibleox.com/ja/jp-ni/mk/6/#L12-13">マコ. 6:12-13</a>）</p></blockquote><blockquote><p>「あなたがたの中で病気の人は、教会の長老を招いて、<strong>主の名によってオリーブ油を塗り</strong>、祈ってもらいなさい。信仰に基づく祈りは、病人を救い、主がその人を起き上がらせてくださいます。その人が罪を犯したのであれば、主が赦してくださいます」（<a href="https://bibleox.com/ja/jp-ni/iak/5/#L14-15">ヤコ. 5:14-15</a>）</p></blockquote><p>こちらも参照：<a href="https://azbyka.ru/miropomazanie">https://azbyka.ru/miropomazanie</a>（ロシア語）</p>
    body: |-
      <h2>定義</h2><p><strong>傅膏機密</strong>（聖霊の賜物を受けること）は教会の七つの機密の一つであり、その中で人は、霊的な道を歩み、成長するための力（聖霊の賜物）を受けます。傅膏機密は洗礼機密と共に、その直後に行われます。</p><p>もともとこの機密は、祈りと共に使徒が手を置くこと（按手）によって行われていました。その後、しかしまだ使徒たちの時代に、按手は、聖膏（特別に聖別された油）を人に塗ることに置き換えられました。おそらくそれは、ほかの機密と同じように、使徒や主教だけでなく、主教からその権限を与えられた司祭もこの機密を行えるようにするためでした[1]。主教が聖膏を準備して司祭に渡し、司祭がこの機密を行います。これについては、<a href="#HH-1-2世紀から按手は聖膏による塗油に置き換えられた">下の</a>該当する節で詳しく述べます。</p><h2>聖霊の賜物を授ける機密についての指摘</h2><p>使徒ペトロの説教。</p><p>使徒ペトロは罪の赦しのための洗礼へと呼びかけ、それから加えて、聖霊の賜物を受ける必要について語ります：</p><blockquote><p>「すると、ペトロは彼らに言った。『悔い改めなさい。<strong><mark>めいめい、イエス・キリストの名によって洗礼を受け</mark></strong>、罪を赦していただきなさい。<strong><u><mark>そうすれば</mark></u><mark>、賜物として聖霊を受けます</mark></strong>』」（<a href="https://bibleox.com/ja/jp-ni/act/2/#L38">使. 2:38</a>）<em>（ギリシア語原文では καὶ λήψεσθε τὴν δωρεὰν τοῦ ἁγίου πνεύματος —「そして聖霊の賜物を受けるであろう」です。）</em></p></blockquote><h2>聖霊の賜物は使徒たちの按手によって授けられる</h2><p>福音記者ルカは使徒言行録の中で、「使徒たちが手を置くことで、“霊”が与えられ」た（<a href="https://bibleox.com/ja/jp-ni/act/8/#L18">使. 8:18</a>）と直接言っています。これはシモンの言葉ではなく、使徒言行録の著者である福音記者ルカの言葉です。さらにその先で、使徒ペトロは聖霊の賜物を授けることを神の賜物として直接語り、その賜物を金で手に入れようとたくらんだシモンを叱責します：</p><blockquote><p>「ペトロとヨハネが人々の上に手を置くと、彼らは聖霊を受けた。シモンは、<strong><mark>使徒たちが手を置くことで、“霊”が与えられる</mark></strong>のを見、金を持って来て、言った。『わたしが手を置けば、だれでも聖霊が受けられるように、わたしにもその力を授けてください。』すると、ペトロは言った。『この金は、お前と一緒に滅びてしまうがよい。<strong>神の賜物を金で手に入れられると思っている</strong>からだ』」（<a href="https://bibleox.com/ja/jp-ni/act/8/#L17-20">使. 8:17-20</a>）</p></blockquote><p>使徒パウロはエフェソで洗礼を授けます。洗礼の直後に、彼は聖霊の賜物を授けるために手を置きます：</p><blockquote><p>「そこで、パウロは言った。『ヨハネは、自分の後から来る方、つまりイエスを信じるようにと、民に告げて、悔い改めの洗礼を授けたのです。』人々はこれを聞いて主イエスの名によって<strong><mark>洗礼を受けた</mark></strong>。<strong><mark>パウロが彼らの上に手を置くと、聖霊が降り</mark></strong>、その人たちは異言を話したり、預言をしたりした」（<a href="https://bibleox.com/ja/jp-ni/act/19/#L4-6">使. 19:4-6</a>）</p></blockquote><h2>聖霊の賜物を授けることは洗礼とは別の機密である</h2><p>サマリアの人々は洗礼を受けましたが、聖霊はその後、使徒たちの按手の後に来られました。</p><p>サマリアの人々の洗礼は成し遂げられていました。この洗礼に何か問題があったとはどこにも言われていません。反対に、「洗礼を受けていただけで」、霊はまだ彼らの上に降っていなかったと、はっきり述べられています。使徒たちがサマリアの人々のことを聞いたとき、使徒の一人がサマリアの人々のところへ行かなければならないことが明らかになりました。彼らが洗礼を受けるだけでなく（それはフィリポにもできました）、聖霊の賜物をも受けるためです（それはフィリポにはできませんでした。聖霊の賜物を授けることができるのは、使徒たちと、使徒たちがこの賜物を授けた人々、すなわち主教たちだけだからです）。</p><blockquote><p>「フィリポはサマリアの町に下って、人々にキリストを宣べ伝えた。&lt;…&gt; しかし、フィリポが神の国とイエス・キリストの名について福音を告げ知らせるのを人々は信じ、男も女も<strong><mark>洗礼を受けた</mark></strong>。&lt;…&gt; エルサレムにいた使徒たちは、サマリアの人々が神の言葉を受け入れたと聞き、<strong>ペトロとヨハネをそこへ行かせた。二人はサマリアに下って行き、<mark>聖霊を受けるようにとその人々のために祈った。人々は主イエスの名によって</mark><u><mark>洗礼を受けていただけで</mark></u><mark>、聖霊はまだだれの上にも降っていなかったからである</mark></strong>。<strong>ペトロとヨハネが人々の上に<u><mark>手を置くと</mark></u><mark>、彼らは聖霊を受けた</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/act/8/#L5,12,14-17">使. 8:5,12,14-17</a>）</p></blockquote><h2>1-2世紀から按手は聖膏による塗油に置き換えられた</h2><p>もともとこの機密は、使徒たちと主教たちの按手によって行われていました。その後、おそらくキリスト教に改宗する人々の数が増えたため、主教がすべてのキリスト者に手を置くことは非常に困難になりました。そこで、特別な油（聖膏）を聖別し、それを司祭に渡して、主教の按手の代わりに傅膏機密において塗油を行うという慣行が確立されました。</p><p>このようにして機密が行われていたことを示すものは、聖書そのものにも、最も古いキリスト教著作家たちの何人かにも見られます。</p><blockquote><p>「わたしたちとあなたがたとをキリストに固く結び付け、<strong>わたしたちに油を注いでくださった</strong>のは、神です。神はまた、わたしたちに証印を押して、保証としてわたしたちの心に“霊”を与えてくださいました」（<a href="https://bibleox.com/ja/jp-ni/2kor/1/#L21-22">２コリ. 1:21-22</a>）</p></blockquote><blockquote><p>「しかし、<strong>あなたがたは聖なる方から油を注がれているので</strong>、皆、真理を知っています」（<a href="https://bibleox.com/ja/jp-ni/1in/2/#L20">１ヨハ. 2:20</a>）</p></blockquote><blockquote><p>「しかし、いつもあなたがたの内には、<strong>御子から注がれた油</strong>がありますから、だれからも教えを受ける必要がありません。<strong>この油</strong>が万事について教えます。それは真実であって、偽りではありません。だから、教えられたとおり、御子の内にとどまりなさい」（<a href="https://bibleox.com/ja/jp-ni/1in/2/#L27">１ヨハ. 2:27</a>）</p></blockquote><p><strong>アンティオキアの聖テオフィロス（2世紀）</strong></p><blockquote><p>12. あなたがわたしを嘲って「キリスト者」と呼ぶことについて言えば、あなたは自分が何を言っているのか分かっていません。第一に、油を注がれたものは心地よく、役に立ち、決して軽蔑すべきものではないからです。どんな船が、まず（油を）塗られることなく、役に立ち、航海に耐えうるでしょうか。どんな城や家が、油を塗られずに美しく、役に立つでしょうか。また、どんな人が、この世に生まれ出るとき、あるいは体育場に入るとき、油を塗られないでしょうか。&lt;…&gt; それゆえ、<strong>わたしたちがキリスト者と呼ばれるのは、神の油を注がれているからなのです</strong>。</p></blockquote><p>（<a href="https://bibleox.com/en/en/w/theophilus-theophilus-to-autolycus/">「アウトリュコスへ」</a>、英語。英訳からの訳）</p><p>ほかの引用も参照：</p><ul><li><p><a href="https://bibleox.com/ru/ru/w/PAKJ0qG7_%D0%9F%D0%BE%D0%BD%D1%8F%D1%82%D0%B8%D0%B5_%D0%BE_%D1%82%D0%B0%D0%B8%D0%BD%D1%81%D1%82%D0%B2%D0%B5_%D0%BC%D0%B8%D1%80%D0%BE%D0%BF%D0%BE%D0%BC%D0%B0%D0%B7%D0%B0%D0%BD%D0%B8%D1%8F">傅膏機密の概念</a>（ロシア語）</p></li><li><p><a href="https://azbyka.ru/otechnik/Makarij_Bulgakov/pravoslavno-dogmaticheskoe-bogoslovie-tom2/24">https://azbyka.ru/otechnik/Makarij_Bulgakov/pravoslavno-dogmaticheskoe-bogoslovie-tom2/24</a>（ロシア語）</p></li></ul><h2>批判への応答</h2><h3>しかし百人隊長コルネリウスの上には、使徒の按手なしに聖霊が降ったのではないか</h3><p>使徒ペトロの宣教の間にコルネリウスの家の人々の上に聖霊が降ったことは、使徒の按手なしに、しかも洗礼の前に聖霊が来られた<strong>唯一の</strong>例です。この例外的な出来事の前には一連の異常な出来事があり、それは神がこうして教会に異邦人（ユダヤ人でない人々）を受け入れる準備をさせておられたことを示しています。それまでは、異邦人を受け入れる可能性はまったく自明ではなく、その後も論争を引き起こしました。このような特別な聖霊の降臨によって、神は次のことを示されました：</p><ol><li><p>異邦人（ユダヤ人でない人々）を教会に受け入れてよいこと。</p></li><li><p>神は、これを疑うことや、人々を誤った判断のゆえに非難することの可能性を除かれました。神はこれを使徒なしに行われたのではありません（霊はすぐに来られたのではなく、まず天使が遣わされ、使徒を探し出すよう命じました）。しかし聖霊御自身が使徒の按手の前に来られ、異邦人の受け入れについての神の御心をはっきりと表されたのです。</p></li></ol><p>大切なのは、聖霊の降臨が洗礼の機密の必要を取り除くものではないということです。使徒は、コルネリウスの家の人々の上に聖霊が降った直後に、洗礼を授けています：</p><blockquote><p>「さて、カイサリアにコルネリウスという人がいた。『イタリア隊』と呼ばれる部隊の百人隊長で、&lt;…&gt; そこで、ペトロは口を開きこう言った。『神は人を分け隔てなさらないことが、よく分かりました。』&lt;…&gt; <strong>ペトロがこれらのことをなおも話し続けていると、御言葉を聞いている<mark>一同の上に聖霊が降った</mark></strong>。&lt;…&gt; 異邦人が異言を話し、また神を賛美しているのを、聞いたからである。そこでペトロは、『わたしたちと同様に<strong>聖霊を受けた</strong>この人たちが、水で洗礼を受けるのを、いったいだれが妨げることができますか』と言った。そして、イエス・キリストの名によって<strong><mark>洗礼を受けるようにと、その人たちに命じた</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/act/10/#L1,34,44,46-48">使. 10:1,34,44,46-48</a>）</p></blockquote><p>このことをさらに詳しく確かめたい人のために、詳しい説明をします。</p><p>教会が存在し始めた頃、異邦人を受け入れることはほとんど不可能でした。宣教はユダヤ人にだけ開かれていました（<a href="https://bibleox.com/ja/jp-ni/act/11/#L19"><u>使. 11:19</u></a>; <a href="https://bibleox.com/ja/jp-ni/act/11/#L1,18"><u>使. 11:1,18</u></a>; <a href="https://bibleox.com/ja/jp-ni/act/14/#L27"><u>使. 14:27</u></a>; <a href="https://bibleox.com/ja/jp-ni/act/15/#L4"><u>使. 15:4</u></a>; <a href="https://bibleox.com/ja/jp-ni/act/15/#L7"><u>使. 15:7</u></a>）。教会にはまだ、異邦人（すなわちユダヤ人でない人々）を受け入れてよいかどうかについての共通の理解がありませんでした。</p><p>最も近い弟子の一人である使徒ペトロでさえ、特別な準備を必要としました。汚れた食べ物についての同じ幻が、一度ではなく三度示され、神が清めた物を汚れたものと見なしてはならないと命じられたのです（<a href="https://bibleox.com/ja/jp-ni/act/10/#L15">使. 10:15</a>; <a href="https://bibleox.com/ja/jp-ni/act/11/#L9">使. 11:9</a>）。</p><p>こうして使徒ペトロはコルネリウスのもとに来て、宣教が始まると、コルネリウスの家の人々の上に聖霊が降ります。降臨の後、使徒はすぐに彼らに水で洗礼を授けます。ローマの百人隊長コルネリウスの洗礼の後、ユダヤ人出身のキリスト者たちは、起こったことに驚きます：</p><blockquote><p>「割礼を受けている信者で、ペトロと一緒に来た人は皆、聖霊の賜物が異邦人の上にも注がれるのを見て、大いに驚いた」（<a href="https://bibleox.com/ja/jp-ni/act/10/#L45">使. 10:45</a>）</p></blockquote><p>エルサレムでは、使徒ペトロは異邦人に洗礼を授けたことを非難されますが、神からの啓示とコルネリウスの上への聖霊の降臨についての彼の話を聞いて、人々は静まります（<a href="https://bibleox.com/ja/jp-ni/act/11/#L1,18">使. 11:1,18</a>）。その後でさえ、この問題は完全には解決されないままでした。使徒ペトロはアンティオキアにいます。そこへエルサレムから、使徒ヤコブのもとからキリスト者たちも来ます（<a href="https://bibleox.com/ja/jp-ni/gal/2/#L12">ガラ. 2:12</a>）。すると、アンティオキアのユダヤ人たちは使徒ペトロと共に、異邦人と交わっていると見られないように、エルサレムから来た人々から身を隠し始めます。</p><p>このように、教会に異邦人を受け入れる特別な準備が大いに必要であったことは、容易に分かります。</p><p>1. 使徒でさえ、三度にわたって特別に教えられる必要がありました。</p><p>2. キリスト者の目撃者たちは起こったことに衝撃を受け、ほかの人々の前で弁明しなければなりませんでした。</p><p>3. 使徒たちとの論争が起こり、エルサレムで公会議全体が招集されました。</p><p>神が超自然的に介入され、御自身で、使徒の按手なしに異邦人の上に来られたにもかかわらず、こうしたことすべてが起こったのです。それにもかかわらず強い抵抗が起こります。それがなかったら、どうなっていたでしょうか。</p><p>このように、主は教会に異邦人を受け入れることを教えるために、ただ一度だけ例外的な仕方で行動されるのです。</p><p>この特別な出来事は洗礼を廃止しませんでした。使徒はすぐにコルネリウスの家の人々に洗礼を授けました。</p><p>出来事の連鎖全体に特に注意を払うべきです。その要点は、神は御自身が望まれるとおりに行動することがおできになるのは当然であっても…教会なしには行動されない、ということです。</p><p>自分たちのキリスト教団体の創始者たちは、ここに自分で自分を任命した集まりのための抜け道だけを見ることを好み、聖霊は福音の宣教から単純に受けられると証明しようとします。しかし彼らは、完全に独立して行動することがおできになり、コルネリウスとその家の人々の上に来るのに使徒を必要とされない聖霊が、教会なしにはそうされなかったという事実を、まったく無視しています。</p><p>コルネリウスの義と、その祈りと施しを御覧になって、神は彼に聖霊の賜物をではなく、まず天使を遣わされ、天使はコルネリウスに教会を見つけるよう命じます。そして、使徒の姿で教会が来たとき、聖霊の賜物を授ける権能を与えられた者が来たとき、そのとき初めて聖霊はコルネリウスの上に来られるのです。</p><p>このように、聖霊は教会なしに来ることがおできになりますが、そうはされません。聖書の中には、そのような例は一度もありません。ほかのすべての場合、霊は洗礼の前には来られませんでした。</p><p>洗礼の際の聖霊の降臨とは、洗礼の過程で手が置かれ、聖霊が来られたということです。今日も同じことが行われています。洗礼の際に、その直後に傅膏も行われるのです。</p><p>洗礼は霊的な誕生、教会に入ること、体に加わることと呼ばれます。聖霊の賜物を送ることは、そのようには呼ばれません。洗礼は、使徒が言うように、救います。では水だけが救うのでしょうか。もちろん、水を通しての霊の働きもあります。洗礼の水に浸されることにおける霊的な誕生は、聖霊なしには起こりません。しかし、聖霊の賜物を授ける機密は別のものです。ですからここでも、使徒はこれらを霊の別々の働きとして論じています：</p><blockquote><p>「つまり、<strong>一つの霊によって、わたしたちは</strong>、ユダヤ人であろうとギリシア人であろうと、奴隷であろうと自由な身分の者であろうと、皆一つの体となるために<strong><mark>洗礼を受け</mark></strong>、皆<strong>一つの霊を<mark>のませてもらった</mark></strong>のです」（<a href="https://bibleox.com/ja/jp-ni/1kor/12/#L13">１コリ. 12:13</a>）</p></blockquote><p>1) 霊によって<strong>洗礼を受け</strong>、そして(!)</p><p>2) 霊を<strong>のませてもらった</strong>。</p><p>どちらも聖霊によって成し遂げられます。霊の働きなしに水から生まれる人はいません。</p><p>そして、もしこれらが別々の概念であったなら、水からの誕生を天の国を見、そこに入るための条件とする必要はなかったでしょう。単に「霊によって」と言えば十分だったはずです。しかし救い主は誕生について語るとき、両方を一緒に語っておられます。水と霊とによって、と。水も霊も省いておられないのです。</p><h3>使徒だけが聖霊の賜物を授けられるなら、なぜ輔祭フィリポによる洗礼の後にエチオピアの宦官の上に聖霊が降るのか</h3><p>フィリポと宦官の場合（<a href="https://bibleox.com/ja/jp-ni/act/8/#L39">使. 8:39</a>）には、非常に重要な細かい点があります。</p><p>ロシア語の宗務院訳と教会スラヴ語訳では、この節は「聖霊が宦官の上に降り、主の天使がフィリポを連れ去った」となっています。しかし、最も古い解釈者たちを含む大多数の解釈者は、その中には聖金口イオアンもいますが、この本文を聖霊の降臨についての句（αγιον επεπεϲεν επι τον ευνουχον αγγελοϲ δε）なしに引用しています。そこでは単にこう言われています（新共同訳も、英語の NKJV やほとんどの英訳も、このように読んでいます）：</p><blockquote><p>主の霊<s>が宦官の上に降り、天使</s>がフィリポを連れ去った。</p></blockquote><p>これらの言葉のないシナイ写本（4世紀）：</p><blockquote><p>καὶ ἐκέλευσεν στῆναι τὸ ἅρμα,</p><p>καὶ κατέβησαν ἀμφότεροι εἰς τὸ ὕδωρ,</p><p>ὁ τε Φίλιππος καὶ ὁ εὐνοῦχος,</p><p>καὶ ἐβάπτισεν αὐτόν.</p><p>ὅτε δὲ ἀνέβησαν ἐκ τοῦ ὕδατος,</p><p><strong>πνεῦμα Κυρίου ἥρπασεν τὸν Φίλιππον</strong>,</p><p>καὶ οὐκ εἶδεν αὐτὸν οὐκέτι ὁ εὐνοῦχος·</p><p>ἐπορεύετο γὰρ τὴν ὁδὸν αὐτοῦ χαίρων.</p><p>Φίλιππος δὲ εὑρέθη εἰς Ἄζωτον,</p><p>καὶ διερχόμενος εὐηγγελίζετο τὰς πόλεις πάσας,</p><p>ἕως τοῦ ἐλθεῖν αὐτὸν εἰς Καισάριαν.（使 8:39-40）</p></blockquote><p>これらの言葉のないヴァティカン写本（4世紀）：</p><blockquote><p>και εκελευϲε ϲτηναι το αρμα και κατεβηϲαν αμφοτεροι ειϲ το υδωρ ο τε φιλιπποϲ και ο ευνουχοϲ και εβαπτιϲεν αυτον</p><p>οτε δε ανεβηϲαν εκ του υδατοϲ <strong>πνευμα κ̅υ̅ ηρπαϲεν το̅ φιλιππον</strong> και ουκ ειδε̅ αυτον ουκετι ο ευνουχοϲ επορευετο γαρ αυτου την οδον χαιρων</p></blockquote><p>これらの言葉のないアレクサンドリア写本（5世紀）：</p><blockquote><p>και εκελευϲεν ϲτηναι το αρμα και κατεβηϲαν αμφοτεροι ειϲ το υδωρ ο τε φιλιπποϲ και ο ευνουχοϲ και εβαπτιϲεν αυτον</p><p>οτε δε ανεβηϲαν εκ του υδατοϲ <strong>π̅ν̅α̅ κ̅υ̅ ηρπαϲεν τον φιλιππο̅</strong> και ουκ ειδεν αυτον ουκετι ο ευνουχοϲ επορευετο γαρ την οδο̅ αυτου χαιρων</p><p>φιλιπποϲ δε ευρεθη ειϲ αζωτον και διερχομενοϲ ταϲ πολειϲ παϲαϲ εωϲ του ελθειν αυτο̅ ειϲ καιϲαριαν</p></blockquote><p>聖金口イオアンはこのように引用しています（聖霊の降臨についての言葉なしに）：</p><blockquote><p>Ὅτε δὲ ἀνέβησαν ἀπὸ τοῦ ὕδατος, <strong>Πνεῦμα Κυρίου ἥρπασε τὸν Φίλιππον</strong>, καὶ οὐκ εἶδεν αὐτὸν οὐκ ἔτι ὁ εὐνοῦχος.</p></blockquote><p>（<a href="https://bibleox.com/el/grc/w/dNiR_%E1%BD%89%CE%BC%CE%B9%CE%BB%CE%AF%CE%B1%CE%B9_%CE%B5%E1%BC%B0%CF%82_%CF%84%E1%BD%B0%CF%82_%CE%A0%CF%81%CE%AC%CE%BE%CE%B5%CE%B9%CF%82_%CF%84%E1%BF%B6%CE%BD_%E1%BC%88%CF%80%CE%BF%CF%83%CF%84%CF%8C%CE%BB%CF%89%CE%BD#HH-%CE%9F%CE%9C%CE%99%CE%9B%CE%99%CE%91-%CE%99%CE%98%CD%B4">In acta apostolorum, ΟΜΙΛΙΑ ΙΘ</a>、ギリシア語）</p>

  - src: исповедь
    path: Cf5n_痛悔機密
    title: 痛悔機密（告解）
    meta_desc: 痛悔機密（告解）と悔い改めについての聖書の引用
    menu: { parent: "教会/機密", title: "痛悔機密", priority: 5 }
    body: |-
      <h2>旧約における罪の告白</h2><p>旧約の教会において、神御自身が、神殿で祭司の前で告白すること、そして祭司を通して罪から清められることを定められます：</p><blockquote><p>「責めを負うときには、<strong>彼はその罪を犯したことを告白し</strong>、<strong>犯した罪の代償として</strong>、群れのうちから雌羊または雌山羊を取り、<strong>贖罪の献げ物として主にささげる</strong>。<strong>祭司は彼のためにその犯した罪を贖う儀式を行う</strong>」（<a href="https://bibleox.com/ja/jp-ni/lev/5/#L5-6">レビ. 5:5-6</a>）</p></blockquote><blockquote><p>「罪を隠している者は栄えない。<strong>告白して罪を捨てる者は憐れみを受ける</strong>」（<a href="https://bibleox.com/ja/jp-ni/pr/28/#L13">箴. 28:13</a>）</p></blockquote><h2>新約における罪の告白</h2><h3>司祭職には罪を赦す権能がある</h3><p>神は祭司職の変更をもたらされます（<a href="https://bibleox.com/ru/q/%D0%A2%D0%B0%D0%B8%D0%BD%D1%81%D1%82%D0%B2%D0%BE-%D0%A1%D0%B2%D1%8F%D1%89%D0%B5%D0%BD%D1%81%D1%82%D0%B2%D0%B0">詳しく</a>、ロシア語）：</p><blockquote><p>「<strong>祭司制度に変更があれば</strong>、律法にも必ず変更があるはずです」（<a href="https://bibleox.com/ja/jp-ni/evr/7/#L12">ヘブ. 7:12</a>）</p></blockquote><p>神は新しい司祭職に、罪を赦す権能をお与えになります：</p><blockquote><p>「わたしはあなたに天の国の鍵を授ける。あなたが地上でつなぐことは、天上でもつながれる。<strong>あなたが地上で解くことは、天上でも解かれる</strong>」（<a href="https://bibleox.com/ja/jp-ni/mf/16/#L19">マタ. 16:19</a>）</p></blockquote><blockquote><p>「はっきり言っておく。あなたがたが地上でつなぐことは、天上でもつながれ、<strong>あなたがたが地上で解くことは、天上でも解かれる</strong>」（<a href="https://bibleox.com/ja/jp-ni/mf/18/#L18">マタ. 18:18</a>）</p></blockquote><blockquote><p>「そう言ってから、彼らに息を吹きかけて言われた。『聖霊を受けなさい。<strong>だれの罪でも、あなたがたが赦せば、その罪は赦される。だれの罪でも、あなたがたが赦さなければ、赦されないまま残る</strong>』」（<a href="https://bibleox.com/ja/jp-ni/in/20/#L22-23">ヨハ. 20:22-23</a>）</p></blockquote><p>司祭職の祈りによって罪が赦されます：</p><blockquote><p>「あなたがたの中で病気の人は、<strong>教会の長老を招いて</strong>、主の名によってオリーブ油を塗り、<strong>祈ってもらいなさい</strong>。信仰に基づく祈りは、病人を救い、主がその人を起き上がらせてくださいます。<strong>その人が罪を犯したのであれば、主が赦してくださいます</strong>」（<a href="https://bibleox.com/ja/jp-ni/iak/5/#L14-15">ヤコ. 5:14-15</a>）<em>（「長老」は、ギリシア語原文では πρεσβυτέρους で、教会では司祭を指します。）</em></p></blockquote><p>司祭職は教会の監督者として任命されています：</p><blockquote><p>「パウロはミレトスからエフェソに人をやって、<strong>教会の長老たち</strong>を呼び寄せた。長老たちが集まって来たとき、パウロはこう話した。&lt;…&gt;『どうか、あなたがた自身と群れ全体とに気を配ってください。<strong>聖霊は、神が御子の血によって御自分のものとなさった神の教会の世話をさせるために、あなたがたをこの群れの監督者に任命なさったのです</strong>』」（<a href="https://bibleox.com/ja/jp-ni/act/20/#L17-18,28">使. 20:17-18,28</a>）<em>（「御子の血によって」は、ギリシア語原文では διὰ τοῦ αἵματος τοῦ ἰδίου —「御自分の血によって」です（ビザンティン本文では διὰ τοῦ ἰδίου αἵματος）。）</em></p></blockquote><h3>告白は教会の中で保たれている</h3><p>旧約と新約の境目に、人々は預言者洗礼者ヨハネのもとに来て、同じように自分の罪を告白しました：</p><blockquote><p>「洗礼者ヨハネが荒れ野に現れて、<strong>罪の赦しを得させるために</strong>悔い改めの洗礼を宣べ伝えた。<strong>ユダヤの全地方</strong>とエルサレムの住民は皆、<strong>ヨハネのもとに来て</strong>、<strong>罪を告白し</strong>、ヨルダン川で彼から洗礼を受けた」（<a href="https://bibleox.com/ja/jp-ni/mk/1/#L4-5">マコ. 1:4-5</a>）</p></blockquote><p>告白は教会の中で保たれています：</p><blockquote><p>「<strong>信仰に入った</strong>大勢の人が来て、<strong>自分たちの悪行をはっきり告白した</strong>」（<a href="https://bibleox.com/ja/jp-ni/act/19/#L18">使. 19:18</a>）</p></blockquote><h3>信者は、真の信仰を得た後も、新たな罪の赦しを必要とする</h3><p>真の信者は、隣人を偽りの道から立ち帰らせることができ、それによって自分の多くの罪を覆うことができます：</p><blockquote><p>「わたしの兄弟たち、あなたがたの中に<strong>真理から迷い出た者がいて</strong>、だれかがその人を真理へ連れ戻すならば、<strong>罪人を迷いの道から<mark>連れ戻す人</mark>は、その罪人の魂を死から救い出し、<mark>多くの罪を覆う</mark></strong>ことになると、知るべきです」（<a href="https://bibleox.com/ja/jp-ni/iak/5/#L19-20">ヤコ. 5:19-20</a>）</p></blockquote><blockquote><p>「<strong>あなたがたの中で</strong>病気の人は、教会の長老を招いて、主の名によってオリーブ油を塗り、祈ってもらいなさい。信仰に基づく祈りは、病人を救い、主がその人を起き上がらせてくださいます。<strong><mark>その人が罪を犯したのであれば、主が赦してくださいます</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/iak/5/#L14-15">ヤコ. 5:14-15</a>）</p></blockquote><h2>主は悔い改める者を退けられない</h2><p>神は、罪人がどれほど大きな罪を犯したとしても、いつでもその悔い改めを受け入れる用意がおありです</p><blockquote><p>「しかし、神の求めるいけにえは<strong>打ち砕かれた霊。打ち砕かれ悔いる心を神よ、あなたは侮られません</strong>」（<a href="https://bibleox.com/ja/jp-ni/ps/51/#L19">詩. 51:19</a>）</p></blockquote><blockquote><p>「<strong>わたしのもとに来る人を、わたしは決して追い出さない</strong>」（<a href="https://bibleox.com/ja/jp-ni/in/6/#L37">ヨハ. 6:37</a>）</p></blockquote>

  - src: венчание-брак
    path: Mr9g_婚配機密
    title: 婚配機密（結婚）
    title_sub: 正教会の七つの機密の一つ
    menu: { parent: "教会/機密", title: "婚配機密", priority: 9 }
    body: |-
      <h2>定義</h2><p><a href="https://azbyka.ru/brak"><strong>婚配機密</strong></a>（ロシア語）は教会の七つの機密の一つであり、その中で、夫と妻の相互の愛に基づく自由意志による夫婦の結びつきの上に、キリストとその教会との霊的な結びつきにかたどって、神の祝福が呼び求められます。</p><h2>聖書の引用</h2><p>結婚においては、神によって行われる機密が起こります：</p><blockquote><p>「主なる神は言われた。『人が独りでいるのは良くない。彼に合う助ける者を造ろう。』&lt;…&gt; そして、人から抜き取ったあばら骨で女を造り上げられた。主なる神が彼女を人のところへ連れて来られると、&lt;…&gt; こういうわけで、<strong>男は父母を離れて女と結ばれ、<mark>二人は一体となる</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/gen/2/#L18,22,24">創. 2:18,22,24</a>）</p></blockquote><blockquote><p>「ファリサイ派の人々が近寄って、『夫が妻を離縁することは、律法に適っているでしょうか』と尋ねた。イエスを試そうとしたのである。イエスは、『モーセはあなたたちに何と命じたか』と問い返された。彼らは、『モーセは、離縁状を書いて離縁することを許しました』と言った。イエスは言われた。『あなたたちの心が頑固なので、このような掟をモーセは書いたのだ。しかし、天地創造の初めから、神は人を男と女とにお造りになった。それゆえ、人は父母を離れてその妻と結ばれ、二人は一体となる。だから<strong><mark>二人はもはや別々ではなく、一体である</mark>。従って、<mark>神が結び合わせてくださったもの</mark>を、人は離してはならない</strong>』」（<a href="https://bibleox.com/ja/jp-ni/mk/10/#L2-9">マコ. 10:2-9</a>）</p></blockquote><blockquote><p>「あなたがたは、自分の体がキリストの体の一部だとは知らないのか。キリストの体の一部を娼婦の体の一部としてもよいのか。決してそうではない。娼婦と交わる者はその女と一つの体となる、ということを知らないのですか。<strong>『二人は一体となる』と言われています</strong>」（<a href="https://bibleox.com/ja/jp-ni/1kor/6/#L15-16">１コリ. 6:15-16</a>）</p></blockquote><blockquote><p>「そのように夫も、自分の体のように妻を愛さなくてはなりません。妻を愛する人は、自分自身を愛しているのです。&lt;…&gt;『それゆえ、人は父と母を離れてその妻と結ばれ、<strong>二人は一体となる。』この神秘は偉大です</strong>。わたしは、キリストと教会について述べているのです。いずれにせよ、あなたがたも、それぞれ、妻を自分のように愛しなさい。妻は夫を敬いなさい」（<a href="https://bibleox.com/ja/jp-ni/ef/5/#L28,31-33">エフェ. 5:28,31-33</a>）<em>（ギリシア語原文では τὸ μυστήριον τοῦτο μέγα —「この機密（神秘）は大いなるものである」です。正教会では μυστήριον が「機密」と訳されます。）</em></p></blockquote><h2>1世紀における教会による結婚の祝福について</h2><h3>神を帯びる者（テオフォロス）聖イグナティオス（37頃-107）</h3><blockquote><p>「結婚する男女は、<strong>主教の同意を得て結ばれる</strong>のがふさわしい。その結婚が自分の欲望によるのではなく、神に従ったものとなるためである」</p></blockquote><p>（<a href="https://bibleox.com/en/en/w/IgnAn_Pol/#HH-5">「ポリュカルポスへの手紙」5</a>、英語。英訳からの訳）</p>

  - src: елеосвящение-соборование
    path: Un10c_聖傅機密
    title: 聖傅機密（病者の塗油）
    title_sub: 正教会の七つの機密の一つ
    menu: { parent: "教会/機密", title: "聖傅機密", priority: 10 }
    references: |-
      <h3>関連資料</h3><ol><li><p><a href="https://azbyka.ru/otechnik/Spravochniki/spravochnik-pravoslavnogo-cheloveka-chast-2-tainstva-pravoslavnoj-tserkvi/8">https://azbyka.ru/otechnik/Spravochniki/spravochnik-pravoslavnogo-cheloveka-chast-2-tainstva-pravoslavnoj-tserkvi/8</a>（ロシア語）</p></li><li><p><a href="https://rutube.ru/video/0cdbef5d0a4511e665f1ffccc9dc1ef3/?r=plwd">https://rutube.ru/video/0cdbef5d0a4511e665f1ffccc9dc1ef3/?r=plwd</a>（ロシア語）</p></li></ol>
    body: |-
      <p><a href="https://azbyka.ru/soborovanie-eleosvyashhenie"><strong>聖傅機密</strong></a><strong>（病者の塗油）</strong>（ロシア語）は、司祭の会（やむを得ない場合は一人の司祭）によって病人の上に行われる教会の機密です。祈りと聖別された油による塗油を通して、体と魂の病をいやす、いやしと清めの恵みを病人の上に呼び求めることにあります。</p><p><strong>聖書の引用：</strong></p><blockquote><p>「あなたがたの中で病気の人は、<strong>教会の長老を招いて</strong>、<strong>主の名によって<mark>オリーブ油を塗り</mark>、祈ってもらいなさい</strong>。<strong>信仰に基づく祈りは、病人を救い</strong>、主がその人を起き上がらせてくださいます。<strong>その人が罪を犯したのであれば、主が赦してくださいます</strong>」（<a href="https://bibleox.com/ja/jp-ni/iak/5/#L14-15">ヤコ. 5:14-15</a>）<em>（「長老」は、ギリシア語原文では πρεσβυτέρους で、教会では司祭を指します。）</em></p></blockquote><blockquote><p>「十二人は出かけて行って、悔い改めさせるために宣教した。そして、多くの悪霊を追い出し、<strong><mark>油を塗って多くの病人をいやした</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/mk/6/#L12-13">マコ. 6:12-13</a>）</p></blockquote><blockquote><p>「イエスは十二人の弟子を呼び寄せ、汚れた霊に対する<strong>権能をお授けになった</strong>。汚れた霊を<strong>追い出し</strong>、<strong>あらゆる病気</strong>や<strong>患い</strong>を<strong>いやすため</strong>であった」（<a href="https://bibleox.com/ja/jp-ni/mf/10/#L1">マタ. 10:1</a>）</p></blockquote><blockquote><p>「<strong>病人をいやし</strong>、死者を生き返らせ、重い皮膚病を患っている人を清くし、悪霊を追い払いなさい。<strong>ただで受けたのだから、ただで与えなさい</strong>」（<a href="https://bibleox.com/ja/jp-ni/mf/10/#L8">マタ. 10:8</a>）</p></blockquote>
