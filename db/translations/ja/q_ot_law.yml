  - src: смертные-грехи-в-вз
    path: Cs1o_旧約で死罪に当たる罪
    title: 旧約で死罪に当たる罪
    meta_desc: 旧約で死刑に処せられた罪
    menu: { parent: "旧約/律法", title: "旧約で死罪に当たる罪", priority: 1 }
    body: |-
      <p>旧約で死刑に処せられることになっていた行為：</p><ul><li><p>他の神々に仕えるように誘うこと：<a href="https://bibleox.com/ja/jp-ni/vtor/13/#L7-11">申. 13:7-11</a></p></li><li><p>偽りの神に犠牲をささげること：<a href="https://bibleox.com/ja/jp-ni/ish/22/#L19">出. 22:19</a></p></li><li><p>子供を偶像へのいけにえとしてささげること：<a href="https://bibleox.com/ja/jp-ni/lev/20/#L2">レビ. 20:2</a></p></li><li><p>冒涜：<a href="https://bibleox.com/ja/jp-ni/lev/24/#L16">レビ. 24:16</a></p></li><li><p>魔術：<a href="https://bibleox.com/ja/jp-ni/lev/20/#L27">レビ. 20:27</a>; <a href="https://bibleox.com/ja/jp-ni/ish/22/#L17">出. 22:17</a></p></li><li><p>偽りの預言と、民を神から離れさせること：<a href="https://bibleox.com/ja/jp-ni/vtor/13/#L6">申. 13:6</a>; <a href="https://bibleox.com/ja/jp-ni/vtor/18/#L20">申. 18:20</a></p></li><li><p>安息日を破ること：<a href="https://bibleox.com/ja/jp-ni/ish/31/#L14-15">出. 31:14-15</a>; <a href="https://bibleox.com/ja/jp-ni/ish/35/#L2">出. 35:2</a></p></li></ul><ul><li><p>殺人：<a href="https://bibleox.com/ja/jp-ni/ish/21/#L12">出. 21:12</a>; <a href="https://bibleox.com/ja/jp-ni/lev/24/#L17">レビ. 24:17</a>; <a href="https://bibleox.com/ja/jp-ni/lev/24/#L21">レビ. 24:21</a>; <a href="https://bibleox.com/ja/jp-ni/chis/35/#L16">民. 35:16</a>; <a href="https://bibleox.com/ja/jp-ni/chis/35/#L17">民. 35:17</a>; <a href="https://bibleox.com/ja/jp-ni/chis/35/#L18">民. 35:18</a>; <a href="https://bibleox.com/ja/jp-ni/chis/35/#L21">民. 35:21</a>; <a href="https://bibleox.com/ja/jp-ni/chis/35/#L31">民. 35:31</a></p></li><li><p>父や母を呪うこと：<a href="https://bibleox.com/ja/jp-ni/ish/21/#L17">出. 21:17</a>; <a href="https://bibleox.com/ja/jp-ni/lev/20/#L9">レビ. 20:9</a></p></li></ul><ul><li><p>父や母を打つこと：<a href="https://bibleox.com/ja/jp-ni/ish/21/#L15">出. 21:15</a></p></li></ul><ul><li><p>人を誘拐すること、また奴隷として売ること：<a href="https://bibleox.com/ja/jp-ni/ish/21/#L16">出. 21:16</a>; <a href="https://bibleox.com/ja/jp-ni/vtor/24/#L7">申. 24:7</a></p></li></ul><ul><li><p>人を殺した、突く癖のある牛を見張らなかったこと：<a href="https://bibleox.com/ja/jp-ni/ish/21/#L29">出. 21:29</a></p></li></ul><ul><li><p>強姦：<a href="https://bibleox.com/ja/jp-ni/vtor/22/#L25">申. 22:25</a></p></li></ul><ul><li><p>姦淫（姦淫を行った両者が死刑に処せられる）：<a href="https://bibleox.com/ja/jp-ni/lev/20/#L10">レビ. 20:10</a>; <a href="https://bibleox.com/ja/jp-ni/lev/20/#L11">レビ. 20:11</a>; <a href="https://bibleox.com/ja/jp-ni/lev/20/#L12">レビ. 20:12</a>; <a href="https://bibleox.com/ja/jp-ni/vtor/22/#L22">申. 22:22</a>; <a href="https://bibleox.com/ja/jp-ni/vtor/22/#L25">申. 22:25</a></p></li><li><p>近親者との肉の交わり：<a href="https://bibleox.com/ja/jp-ni/lev/20/#L11-21">レビ. 20:11-21</a></p></li></ul><ul><li><p>祭司の娘の淫行 — 娘は焼き殺される：<a href="https://bibleox.com/ja/jp-ni/lev/21/#L9">レビ. 21:9</a></p></li></ul><ul><li><p>男色：<a href="https://bibleox.com/ja/jp-ni/lev/20/#L13">レビ. 20:13</a>; <a href="https://bibleox.com/ja/jp-ni/lev/20/#L15">レビ. 20:15</a>; <a href="https://bibleox.com/ja/jp-ni/lev/20/#L16">レビ. 20:16</a></p></li><li><p>獣姦：<a href="https://bibleox.com/ja/jp-ni/ish/22/#L18">出. 22:18</a></p></li><li><p>祭司や裁判人に従わないこと：<a href="https://bibleox.com/ja/jp-ni/vtor/17/#L8-12">申. 17:8-12</a></p></li><li><p>一般の人（祭司でない者）が幕屋に入ること：<a href="https://bibleox.com/ja/jp-ni/chis/3/#L10">民. 3:10</a>; <a href="https://bibleox.com/ja/jp-ni/chis/3/#L38">民. 3:38</a>; <a href="https://bibleox.com/ja/jp-ni/chis/18/#L7">民. 18:7</a></p></li><li><p>部外者があえて祭司の務めを行うこと：<a href="https://bibleox.com/ja/jp-ni/chis/3/#L10">民. 3:10</a></p></li></ul><ul><li><p>一般の人（レビ人でない者）が幕屋を運ぶこと：<a href="https://bibleox.com/ja/jp-ni/chis/1/#L51">民. 1:51</a></p></li></ul><ul><li><p>山に登ること（境界を越えること）：<a href="https://bibleox.com/ja/jp-ni/ish/19/#L12">出. 19:12</a></p></li></ul><p>このほかに：</p><ul><li><p>イスラエル人を誘惑してペオルの偶像に仕えさせたミディアンの子供と女たちを殺せという命令：<a href="https://bibleox.com/ja/jp-ni/chis/31/#L15-17">民. 31:15-17</a></p></li></ul><ul><li><p>アマレクの民を、男も女も、子供も乳飲み子も殺せという命令：<a href="https://bibleox.com/ja/jp-ni/1ts/15/#L3">サム上. 15:3</a></p></li></ul><p><em>（新共同訳の節番号は、ほかの翻訳と異なる場合があります。たとえば申. 13:7-11 はほかの翻訳では13:6-10、出. 22:17-19 は22:18-20 です。）</em></p>

  - src: прикосновение-к-мертвецу
    path: Td4d_死者に触れること
    title: 死者に触れること
    meta_desc: モーセの律法における死者に触れることの禁止についての聖書の引用
    menu: { parent: "旧約/律法", title: "死者に触れること", priority: 4 }
    body: |-
      <h2>旧約における死者に触れることの禁止</h2><p>死体に触れると、人は汚れた者になりました。しかし親族は、亡くなった近親に触れても汚れることはありませんでした：</p><blockquote><p>「主はモーセに言われた。アロンの子である祭司たちに告げてこう言いなさい。<strong>親族の遺体に触れて身を汚してはならない</strong>。<strong>ただし、近親</strong>、すなわち、父母、息子、娘、兄弟、および同居している未婚の姉妹の<strong>場合は許される</strong>。<strong>間違っても、親族の遺体に触れて、身を汚すことがあってはならない</strong>」（<a href="https://bibleox.com/ja/jp-ni/lev/21/#L1-4">レビ. 21:1-4</a>）<em>（1節と4節は、ヘブライ語原文では「<strong>民の中の死者のために</strong>身を汚してはならない」「民の長である者として身を汚し、汚れた者となってはならない」です。禁じられているのは親族ではなく、一般の死者に触れることです。）</em></p></blockquote><blockquote><p>「しかし、<strong>人の死体に触れて汚れた者たち</strong>がいて、彼らは、その日に過越祭を祝うことができなかった」（<a href="https://bibleox.com/ja/jp-ni/chis/9/#L6">民. 9:6</a>）</p></blockquote><blockquote><p>「すべて、<strong>死者の体に触れて</strong>身を清めない者は、主の幕屋を汚す。その者はイスラエルから断たれる。清めの水が彼の上に振りかけられないので、<strong>彼は汚れており</strong>、汚れがなお、その身のうちにとどまっているからである」（<a href="https://bibleox.com/ja/jp-ni/chis/19/#L13">民. 19:13</a>）</p></blockquote><blockquote><p>「<strong>祭司は、死人の出た家に入って自分の身を汚してはならない</strong>。ただし父、母、息子、娘、兄弟、および未婚の姉妹の場合は、身を汚してもよい」（<a href="https://bibleox.com/ja/jp-ni/iez/44/#L25">エゼ. 44:25</a>）<em>（ヘブライ語原文では אֶל־מֵת אָדָם לֹא יָבוֹא —「死んだ人に近づいてはならない」です。）</em></p></blockquote><blockquote><p>「ハガイは言った。『もし、<strong>死体に触れて汚れた人</strong>が、これらのものの何かに触れたとする。これらのものは汚れるだろうか。』祭司たちは答えて、『<strong>汚れる</strong>』と言った」（<a href="https://bibleox.com/ja/jp-ni/ag/2/#L13">ハガ. 2:13</a>）</p></blockquote><h2>義人の遺骸に触れること</h2><p>旧約の時代、預言者エリシャの聖なる遺骸（不朽体）に触れて、死者が生き返りました：</p><blockquote><p>「人々がある人を葬ろうとしていたとき、その部隊を見たので、彼をエリシャの墓に投げ込んで立ち去った。<strong>その人はエリシャの骨に触れると生き返り</strong>、自分の足で立ち上がった」（<a href="https://bibleox.com/ja/jp-ni/4ts/13/#L21">王下. 13:21</a>）</p></blockquote><h2>ユダヤ教の規定の廃止</h2><blockquote><p>「聖霊とわたしたちは、<strong>次の必要な事柄以外、一切あなたがたに重荷を負わせないことに決めました</strong>。すなわち、偶像に献げられたものと、血と、絞め殺した動物の肉と、みだらな行いとを避けることです。以上を慎めばよいのです。健康を祈ります」（<a href="https://bibleox.com/ja/jp-ni/act/15/#L28-29">使. 15:28-29</a>）</p></blockquote><blockquote><p>「また、<strong>異邦人で信者になった人たちについては、わたしたちは既に手紙を書き送りました。それは、偶像に献げた肉と、血と、絞め殺した動物の肉とを口にしないように、また、みだらな行いを避けるようにという決定です</strong>」（<a href="https://bibleox.com/ja/jp-ni/act/21/#L25">使. 21:25</a>）<em>（ビザンティン本文（多数派写本）では「…彼らはそのようなことを何も守る必要はなく、ただ偶像に献げた肉と…を避けるように」と、「何も守る必要はない」という言葉が加わります。）</em></p></blockquote><p>詳しくは：<a href="https://bibleox.com/ru/ru/w/%D0%91%D0%B8%D0%B1%D0%BB%D0%B8%D1%8F-%D0%97%D0%B0%D0%BA%D0%BE%D0%BD-%D0%9C%D0%BE%D0%B8%D1%81%D0%B5%D1%8F-%D0%BE%D1%82%D0%BC%D0%B5%D0%BD%D0%B0">ユダヤ教の規定の廃止</a></p><h2>新約における死者に触れること</h2><p>主イエス・キリストは、ヤイロの亡くなった娘に触れられました：</p><blockquote><p>「そして、<strong>子供の手を取って</strong>、『タリタ、クム』と言われた。これは、『少女よ、わたしはあなたに言う。起きなさい』という意味である」（<a href="https://bibleox.com/ja/jp-ni/mk/5/#L41">マコ. 5:41</a>）</p></blockquote><p>律法によれば、キリストが十字架の上で亡くなられたとき、すでに死んだ方として、触れることはできませんでした。それができたのは、近親である生神女だけでした（<a href="https://bibleox.com/ja/jp-ni/lev/21/#L1-4">レビ. 21:1-4</a>）。しかしわたしたちは、神学者ヨハネ、ニコデモ、アリマタヤのヨセフを責めないばかりか、何も恐れずにわたしたちの救い主に仕えたことをほめたたえます：</p><blockquote><p>「<strong>ヨセフ</strong>はイエスの遺体を受け取ると、きれいな亜麻布に包み、岩に掘った自分の新しい墓の中に納め、墓の入り口には大きな石を転がしておいて立ち去った」（<a href="https://bibleox.com/ja/jp-ni/mf/27/#L59-60">マタ. 27:59-60</a>）</p></blockquote><blockquote><p>「<strong>ヨハネの弟子たち</strong>はこのことを聞き、やって来て、遺体を引き取り、墓に納めた」（<a href="https://bibleox.com/ja/jp-ni/mk/6/#L29">マコ. 6:29</a>）</p></blockquote><blockquote><p>「そして、百人隊長に確かめたうえ、遺体を<strong>ヨセフ</strong>に下げ渡した。ヨセフは亜麻布を買い、イエスを十字架から降ろしてその布で巻き、岩を掘って作った墓の中に納め、墓の入り口には石を転がしておいた」（<a href="https://bibleox.com/ja/jp-ni/mk/15/#L45-46">マコ. 15:45-46</a>）</p></blockquote><blockquote><p>「こうして、イエスについて書かれていることがすべて実現した後、<strong>人々はイエスを木から降ろし、墓に葬りました</strong>」（<a href="https://bibleox.com/ja/jp-ni/act/13/#L29">使. 13:29</a>）</p></blockquote><p>使徒は死んだ青年に触れます：</p><blockquote><p>「エウティコという青年が、窓に腰を掛けていたが、パウロの話が長々と続いたので、ひどく眠気を催し、眠りこけて三階から下に落ちてしまった。起こしてみると、<strong>もう死んでいた</strong>。パウロは降りて行き、<strong>彼の上にかがみ込み、抱きかかえて</strong>言った。『騒ぐな。まだ生きている』」（<a href="https://bibleox.com/ja/jp-ni/act/20/#L9-10">使. 20:9-10</a>）</p></blockquote>

  - src: закваска
    path: Lv15n_パン種
    title: パン種
    meta_desc: 聖書におけるパン種のたとえについての引用
    menu: { parent: "旧約/律法", title: "パン種", priority: 15 }
    body: |-
      <h2>パン種 — すべてに影響を及ぼす小さなもの</h2><p>新約の聖書において、パン種の像は、それ自体として悪いものや良いものとして<u>ではなく</u>、小さな部分が残りのすべてにどのように影響を及ぼすかを示すために用いられています。粉に入れるパン種はわずかですが、最後には全体を膨らませます。</p><p>パン種のほかに、主はしばしば塩の像にも言及されます。塩もまた、ほかのすべてに影響を及ぼします（腐敗から守ります）：</p><blockquote><p>「<strong>あなたがたは地の塩である</strong>。だが、塩に塩気がなくなれば、その塩は何によって塩味が付けられよう。もはや、何の役にも立たず、外に投げ捨てられ、人々に踏みつけられるだけである」（<a href="https://bibleox.com/ja/jp-ni/mf/5/#L13">マタ. 5:13</a>）</p></blockquote><blockquote><p>「塩は良いものである。だが、塩に塩気がなくなれば、あなたがたは何によって塩に味を付けるのか。<strong>自分自身の内に塩を持ちなさい</strong>。そして、互いに平和に過ごしなさい」（<a href="https://bibleox.com/ja/jp-ni/mk/9/#L50">マコ. 9:50</a>）</p></blockquote><p>同時に、塩はパン種と同じように、旧約のいけにえに用いられました：</p><blockquote><p>「<strong>穀物の献げ物にはすべて塩をかける</strong>。あなたの神との契約の塩を献げ物から絶やすな。<strong>献げ物にはすべて塩をかけてささげよ</strong>」（<a href="https://bibleox.com/ja/jp-ni/lev/2/#L13">レビ. 2:13</a>）</p></blockquote><h2>パン種の肯定的な意味</h2><h3>パン種 — 天の国</h3><p>主イエス・キリストはパン種を天の国にたとえられます。ここでも、小さなものがすべてに影響を及ぼすのです：</p><blockquote><p>「また、別のたとえをお話しになった。『<strong><mark>天の国はパン種に似ている</mark></strong>。女がこれを取って三サトンの粉に混ぜると、やがて全体が膨れる』」（<a href="https://bibleox.com/ja/jp-ni/mf/13/#L33">マタ. 13:33</a>）</p></blockquote><blockquote><p>「また言われた。『<strong><mark>神の国を何にたとえようか。パン種に似ている</mark></strong>。女がこれを取って三サトンの粉に混ぜると、やがて全体が膨れる』」（<a href="https://bibleox.com/ja/jp-ni/lk/13/#L20-21">ルカ. 13:20-21</a>）</p></blockquote><h2>パン種の否定的な意味</h2><h3>パン種 — 異端の教え</h3><p>主イエス・キリストは使徒たちに、ファリサイ派とサドカイ派の教えの有害さを指摘されます。小さなものがどのようにすべてに影響を及ぼしうるかを示すために、パン種の像を用いられます：</p><blockquote><p>「イエスは彼らに、『<strong>ファリサイ派とサドカイ派の人々の<mark>パン種</mark>によく注意しなさい</strong>』と言われた。&lt;…&gt; 『パンについて言ったのではないことが、どうして分からないのか。ファリサイ派とサドカイ派の人々のパン種に注意しなさい。』そのときようやく、弟子たちは、イエスが注意を促されたのは、パン種のことではなく、<strong>ファリサイ派とサドカイ派の人々の<mark>教え</mark></strong>のことだと悟った」（<a href="https://bibleox.com/ja/jp-ni/mf/16/#L6,11-12">マタ. 16:6,11-12</a>）</p></blockquote><h3>パン種 — 偽善</h3><p>別の時、何千もの人々の前で、キリストは再びパン種の像を用いて、ファリサイ派の際立った特徴、すなわち偽善の有害さを指摘されます。ここでも偽善は、すべてに影響を及ぼす小さなものなのです：</p><blockquote><p>「とかくするうちに、数えきれないほどの群衆が集まって来て、足を踏み合うほどになった。イエスは、まず弟子たちに話し始められた。『<strong>ファリサイ派の人々の<mark>パン種</mark>に注意しなさい</strong>。それは<strong><mark>偽善</mark></strong>である』」（<a href="https://bibleox.com/ja/jp-ni/lk/12/#L1">ルカ. 12:1</a>）</p></blockquote><h3>パン種 — 共同体の中の悔い改めない淫行者</h3><p>使徒パウロは、コリントの共同体が悔い改めない淫行者を自分たちの中に置いていることを、パン種の像を用いて責めています。淫行者は共同体の小さな一部ですが、共同体全体に影響を及ぼしうるのです：</p><blockquote><p>「現に聞くところによると、あなたがたの間にみだらな行いがあり、しかもそれは、異邦人の間にもないほどのみだらな行いで、ある人が父の妻をわがものとしているとのことです。&lt;…&gt; あなたがたが誇っているのは、よくない。<strong><mark>わずかなパン種が練り粉全体を膨らませる</mark></strong>ことを、知らないのですか。<strong>いつも新しい練り粉のままでいられるように、古いパン種をきれいに取り除きなさい</strong>。現に、あなたがたはパン種の入っていない者なのです。キリストが、わたしたちの過越の小羊として屠られたからです。だから、古いパン種や<strong><mark>悪意と邪悪のパン種</mark></strong>を用いないで、パン種の入っていない、純粋で真実のパンで過越祭を祝おうではありませんか」（<a href="https://bibleox.com/ja/jp-ni/1kor/5/#L1,6-8">１コリ. 5:1,6-8</a>）</p></blockquote><p>使徒は、パン種一般ではなく、悪意と邪悪のパン種を取り除くこと、すなわち悔い改めない淫行者を共同体から追い出すことを勧めています（<a href="https://bibleox.com/ja/jp-ni/1kor/5/#L9,11">１コリ. 5:9,11</a>）。ここで使徒は旧約の意味を明らかにしているのであり、パンについて語っているのではありません：</p><blockquote><p>「<strong><mark>いつも新しい練り粉のままでいられるように</mark></strong>、古いパン種をきれいに取り除きなさい。現に、<strong><mark>あなたがた</mark>は</strong>パン種の入っていない者なのです。キリストが、わたしたちの過越の小羊として屠られたからです。だから、古いパン種や悪意と邪悪のパン種を用いないで、パン種の入っていない、純粋で真実のパンで過越祭を祝おうではありませんか」（<a href="https://bibleox.com/ja/jp-ni/1kor/5/#L7-8">１コリ. 5:7-8</a>）<em>（7節は、ギリシア語原文では ἵνα ἦτε νέον φύραμα —「<strong>あなたがたが</strong>新しい練り粉となるために」です。）</em></p></blockquote><blockquote><p>「パンについて言ったのではないことが、どうして分からないのか」（<a href="https://bibleox.com/ja/jp-ni/mf/16/#L11">マタ. 16:11</a>）</p></blockquote><h3>パン種 — 共同体をユダヤ教へ引き込む人</h3><p>使徒パウロは、救われるためにはモーセの律法を守らなければならないと教える人々が自分たちの中にいる危険について、パン種の像を用いてガラテヤの共同体に警告しています：</p><blockquote><p>「律法によって義とされようとするなら、あなたがたはだれであろうと、キリストとは縁もゆかりもない者とされ、いただいた恵みも失います。わたしたちは、義とされた者の希望が実現することを、“霊”により、信仰に基づいて切に待ち望んでいるのです。&lt;…&gt; <strong><mark>わずかなパン種が練り粉全体を膨らませるのです</mark></strong>。あなたがたが決して別な考えを持つことはないと、わたしは主をよりどころとしてあなたがたを信頼しています。<strong><mark>あなたがたを惑わす者</mark></strong>は、だれであろうと、裁きを受けます。&lt;…&gt; <strong>あなたがたをかき乱す者たちは、いっそのこと自ら去勢してしまえばよい</strong>」（<a href="https://bibleox.com/ja/jp-ni/gal/5/#L4-5,9-10,12">ガラ. 5:4-5,9-10,12</a>）</p></blockquote>

  - src: Библия-Закон-Моисея-отмена
    path: Ab21l_モーセの律法の廃止
    title: モーセの律法の廃止
    meta_desc: モーセの律法の廃止についての聖書の引用
