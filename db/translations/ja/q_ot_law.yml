    menu: { parent: "旧約/律法", title: "安息日と主日（日曜日）", priority: 26 }
    body: |-
      <h2>安息日</h2><h3>神は安息日を聖別された</h3><p>世界の創造の後、神は第七の日（安息日）を聖別されましたが、戒めは定められませんでした：</p><blockquote><p>「この日に神は<strong>すべての創造の仕事を離れ、安息なさった</strong>ので、<strong>第七の日を神は祝福し</strong>、<strong>聖別された</strong>」（<a href="https://bibleox.com/ja/jp-ni/gen/2/#L3">創. 2:3</a>）</p></blockquote><p>そのすぐ近くには、神がほかの命令をお与えになる箇所が数多くあります：</p><blockquote><p>「<strong>神は彼らを祝福して言われた</strong>。『産めよ、増えよ…』」（<a href="https://bibleox.com/ja/jp-ni/gen/1/#L28">創. 1:28</a>）</p></blockquote><blockquote><p>「<strong>神は言われた</strong>。『見よ、全地に生える、種を持つ草と種を持つ実をつける木を、すべてあなたたちに与えよう。それがあなたたちの食べ物となる』」（<a href="https://bibleox.com/ja/jp-ni/gen/1/#L29">創. 1:29</a>）</p></blockquote><blockquote><p>「<strong>主なる神は人に命じて言われた</strong>。『園のすべての木から取って食べなさい。ただし、善悪の知識の木からは、決して食べてはならない…』」（<a href="https://bibleox.com/ja/jp-ni/gen/2/#L16-17">創. 2:16-17</a>）</p></blockquote><p>しかし、安息日についての命令は与えられていません。創造のすべての日の後、休まれたのは神であって人ではない、と言われています。それどころか、神は人を働かせるためにエデンの園に置かれました：</p><blockquote><p>「また土を耕す人もいなかった。&lt;…&gt; 主なる神は、東の方のエデンに園を設け、自ら形づくった人をそこに置かれた。&lt;…&gt; 主なる神は人を連れて来て、エデンの園に住まわせ、人がそこを<strong>耕し</strong>、守るようにされた」（<a href="https://bibleox.com/ja/jp-ni/gen/2/#L5,8,15">創. 2:5,8,15</a>）</p></blockquote><p>神がとどまっておられるあの永遠の神の安息（<a href="https://bibleox.com/ja/jp-ni/gen/2/#L3">創. 2:3</a>）に、人々が入ることができるのは将来のことにすぎません。しかもすべての人ではなく、神御自身が入れてくださる人々だけです：</p><blockquote><p>「<strong>信じたわたしたちは、この安息にあずかることができるのです</strong>。『わたしは怒って誓ったように、「<strong>彼らを決してわたしの安息にあずからせはしない</strong>」』と言われたとおりです。もっとも、神の業は天地創造の時以来、既に出来上がっていたのです」（<a href="https://bibleox.com/ja/jp-ni/evr/4/#L3">ヘブ. 4:3</a>; <a href="https://bibleox.com/ja/jp-ni/ps/95/#L11">詩. 95:11</a>; <a href="https://bibleox.com/ja/jp-ni/evr/3/#L11">ヘブ. 3:11</a>）</p></blockquote><h3>安息日に仕事を控えるという戒めの出現</h3><p>安息日の休みの戒めは、預言者モーセの時代、イスラエルの民との契約の締結の際に、神によって初めて定められました：</p><blockquote><p>「安息日を心に留め、これを聖別せよ。<strong>六日の間働いて、何であれあなたの仕事をし</strong>、<strong>七日目は</strong>、あなたの神、主の安息日であるから、<strong>いかなる仕事もしてはならない</strong>。あなたも、息子も、娘も、男女の奴隷も、家畜も、あなたの町の門の中に寄留する人々も同様である」<em>（</em><a href="https://bibleox.com/ja/jp-ni/ish/20/#L8-10"><em>出. 20:8-10</em></a><em>; </em><a href="https://bibleox.com/ja/jp-ni/vtor/5/#L12-15"><em>申. 5:12-15</em></a><em>; </em><a href="https://bibleox.com/ja/jp-ni/lev/19/#L3"><em>レビ. 19:3</em></a><em>; </em><a href="https://bibleox.com/ja/jp-ni/lev/19/#L30"><em>レビ. 19:30</em></a><em>）</em></p></blockquote><h3>安息日の休みの戒めが定められた理由</h3><p>戒めの理由は、戒めの言葉のすぐ後に示されています。その理由とは、イスラエルの民のエジプトの捕囚からの脱出です。</p><blockquote><p>「七日目は、あなたの神、主の安息日であるから、いかなる仕事もしてはならない。&lt;…&gt; あなたは<strong><mark>かつてエジプトの国で奴隷であったが</mark></strong>、あなたの神、主が力ある御手と御腕を伸ばして<strong><mark>あなたを導き出された</mark></strong>ことを思い起こさねばならない。<strong><mark>そのために、あなたの神、主は</mark></strong>安息日を守るよう<strong><mark>命じられたのである</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/vtor/5/#L14-15">申. 5:14-15</a>）</p></blockquote><p>神は彼らに「安息日」を与えられました。つまり、以前にはなかったものを与えられたのです：</p><blockquote><p>「<strong>わたしは、彼らをエジプトの地から<mark>連れ出し</mark></strong>、荒れ野に導いた。<strong>そして、彼らにわたしの掟を与え</strong>、わたしの裁きを示した。人がそれを行えば、それによって生きることができる。<strong>また、わたしは、彼らにわたしの安息日を<mark>与えた</mark></strong>。これは、わたしと彼らとの間のしるしとなり、わたしが彼らを聖別する主であることを、彼らが知るためであった」（<a href="https://bibleox.com/ja/jp-ni/iez/20/#L10-12">エゼ. 20:10-12</a>）</p></blockquote><blockquote><p>「<strong>我々の神、主は、ホレブで我々と契約を結ばれた。主はこの契約を我々の先祖と結ばれたのではなく</strong>、今ここに生きている<strong>我々すべてと結ばれた</strong>」（<a href="https://bibleox.com/ja/jp-ni/vtor/5/#L2-3">申. 5:2-3</a>）</p></blockquote><p>神が第七の日を祝福されたことを示す、もう一つの説明もあります：</p><blockquote><p>「七日目は、あなたの神、主の安息日であるから、いかなる仕事もしてはならない。&lt;…&gt; 六日の間に主は天と地と海とそこにあるすべてのものを造り、<strong><mark>七日目に休まれたから、主は</mark></strong>安息日を<strong><mark>祝福して</mark></strong>聖別されたのである」（<a href="https://bibleox.com/ja/jp-ni/ish/20/#L10-11">出. 20:10-11</a>; <a href="https://bibleox.com/ja/jp-ni/gen/2/#L3">創. 2:3</a>）</p></blockquote><p>しかし、この説明は関連を示してはいますが、ここで述べられているのはまさに安息日の祝福の理由、すなわち「<strong>主は…祝福して</strong>」（<a href="https://bibleox.com/ja/jp-ni/ish/20/#L10-11">出. 20:10-11</a>）であって、命令の理由ではありません。一方、もう一つの箇所では、まさに命令の理由が最もはっきりと示されています：「<strong>奴隷であったが &lt;…&gt; 導き出された &lt;…&gt; そのために…命じられた</strong>」（<a href="https://bibleox.com/ja/jp-ni/vtor/5/#L14-15">申. 5:14-15</a>）。</p><p>このように、安息日の休みは、神の安息との関連が示されてはいますが、イスラエルの民がエジプトの捕囚から解放されたことのゆえに定められたのです。</p><h3>戒めの律法は廃止されている</h3><p>律法はキリストの到来の時まで与えられました：</p><blockquote><p><em>「では、</em><strong><em><mark>律法</mark></em></strong><em>とはいったい何か。律法は、</em><strong><em><mark>約束を与えられたあの子孫が来られるときまで</mark></em></strong><em>、違犯を明らかにするために</em><strong><em><mark>付け加えられた</mark></em></strong><em>もので、天使たちを通し、仲介者の手を経て制定されたものです」（</em><a href="https://bibleox.com/ja/jp-ni/gal/3/#L19"><em>ガラ. 3:19</em></a><em>）</em></p></blockquote><p>戒めの律法は、キリストの教えによって廃棄されました：</p><blockquote><p><em>「実に、キリストはわたしたちの平和であります。二つのものを一つにし、御自分の肉において敵意という隔ての壁を取り壊し、</em><strong><em><mark>規則と戒律ずくめの律法を廃棄されました</mark></em></strong><em>。こうしてキリストは、双方を御自分において一人の新しい人に造り上げて平和を実現し、十字架を通して、両者を一つの体として神と和解させ、十字架によって敵意を滅ぼされました」（</em><a href="https://bibleox.com/ja/jp-ni/ef/2/#L14-16"><em>エフェ. 2:14-16</em></a><em>）</em><em>（ロシア語の宗務院訳では「戒めの律法を<strong>教えによって</strong>廃棄し」（ἐν δόγμασιν）です。）</em></p></blockquote><p>キリスト者は律法から解放されています：</p><blockquote><p><em>「しかし今は、わたしたちは、</em><strong><em>自分を縛っていた律法に対して<mark>死んだ者となり</mark></em></strong><em>、</em><strong><em><mark>律法から解放されています</mark></em></strong><em>。その結果、</em><strong><em>文字に従う古い生き方ではなく</em></strong><em>、“霊”に従う新しい生き方で仕えるようになっているのです」（</em><a href="https://bibleox.com/ja/jp-ni/rim/7/#L6"><em>ロマ. 7:6</em></a><em>）</em></p></blockquote><p>モーセの律法の廃止についての詳しい説明：<a href="https://bibleox.com/ru/ru/w/%D0%91%D0%B8%D0%B1%D0%BB%D0%B8%D1%8F-%D0%97%D0%B0%D0%BA%D0%BE%D0%BD-%D0%9C%D0%BE%D0%B8%D1%81%D0%B5%D1%8F-%D0%BE%D1%82%D0%BC%D0%B5%D0%BD%D0%B0">モーセの律法の廃止</a></p><h3>キリストは、安息日の休みを破ったという非難から使徒たちを弁護された</h3><p>ファリサイ派の人々は、主と使徒たちが安息日の休みを破ったと責めます。キリストは使徒たちを罪のない者と呼ばれます：</p><blockquote><p>「ファリサイ派の人々がこれを見て、イエスに、『<strong>御覧なさい。あなたの弟子たちは、安息日にしてはならないことをしている</strong>』と言った。&lt;…&gt; 『<strong>もし</strong>、「わたしが求めるのは憐れみであって、いけにえではない」という言葉の意味を<strong>知っていれば、あなたたちは<mark>罪もない人たち</mark>をとがめなかったであろう</strong>』」（<a href="https://bibleox.com/ja/jp-ni/mf/12/#L2,7">マタ. 12:2,7</a>）</p></blockquote><h3>使徒は、安息日の休みを守らないことでキリスト者を裁くことを禁じる</h3><blockquote><p>「だから、あなたがたは食べ物や飲み物のこと、また、祭りや新月や<strong><mark>安息日</mark></strong>のことで<strong>だれにも<mark>批評されてはなりません</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/kol/2/#L16">コロ. 2:16</a>）</p></blockquote><h2>主日（日曜日）</h2><h3>主が現れられた日</h3><ol><li><p>主イエス・キリストは週の初めの日、すなわち日曜日に復活し、トマスのいない弟子たちに現れられました（<a href="https://bibleox.com/ja/jp-ni/in/20/#L19">ヨハ. 20:19</a>）。</p></li><li><p>日曜日に、主は携香女たち（<a href="https://bibleox.com/ja/jp-ni/mf/28/#L1,9">マタ. 28:1,9</a>）、マグダラのマリア（<a href="https://bibleox.com/ja/jp-ni/mk/16/#L9">マコ. 16:9</a>）、使徒ペトロ（<a href="https://bibleox.com/ja/jp-ni/lk/24/#L34">ルカ. 24:34</a>）、使徒クレオパとルカ（<a href="https://bibleox.com/ja/jp-ni/lk/24/#L13-32">ルカ. 24:13-32</a>）に現れられました。</p></li><li><p>トマスのために、救い主はちょうど一週間後、再び主の日に現れられます（<a href="https://bibleox.com/ja/jp-ni/in/20/#L26">ヨハ. 20:26</a>）。</p></li></ol><h3>集会と聖体礼儀（エウハリスティア）を行う日</h3><p>使徒たちはトロアスに一週間滞在しましたが、七日のうち、奉神礼とパンを裂くために集まったのは、安息日ではなく日曜日でした：</p><blockquote><p>「わたしたちは、除酵祭の後フィリピから船出し、五日でトロアスに来て彼らと落ち合い、七日間そこに滞在した（<strong>彼らは七日間ずっとトロアスにいた — 注</strong>）。週の初めの日、わたしたちがパンを裂くために集まっていると（<strong>彼らは七日間そこにいたが、パンを裂くために集まったのはまさに日曜日である — 注</strong>）、パウロは翌日出発する予定で人々に話をしたが、その話は夜中まで続いた。わたしたちが集まっていた階上の部屋には、たくさんのともし火がついていた（<strong>盛大な集会 — 注</strong>）。&lt;…&gt; そして、また上に行って、パンを裂いて食べ、夜明けまで長い間話し続けてから出発した」（<a href="https://bibleox.com/ja/jp-ni/act/20/#L6-11">使. 20:6-11</a>）。</p></blockquote><p>使徒は、日曜日（集会の日）に、困窮している人々を助けるために少しずつお金を取っておくように頼んでいます：</p><blockquote><p>「わたしがそちらに着いてから初めて募金が行われることのないように、<strong>週の初めの日にはいつも、各自収入に応じて、幾らかずつでも手もとに取って置きなさい</strong>」（<a href="https://bibleox.com/ja/jp-ni/1kor/16/#L2">１コリ. 16:2</a>）</p></blockquote><h2>反論</h2><p>教会から離れたいくつかの団体（主としてセブンスデー・アドベンチストの分派）は、戒め（<a href="https://bibleox.com/ja/jp-ni/kol/2/#L16">コロ. 2:16</a>）に反して、教会が安息日の休みを守らないことばかりでなく、日曜日をより盛大に祝うことをも非難し、日曜日を祝うべきではないと言います。</p><p>正教会では、人は生涯のすべての日に善い行いをするよう召されていますが、特別な日（土曜日、そしてとりわけ日曜日）は、個人的な善い行いだけでなく、<strong>共同の業</strong>（ギリシア語 λειτουργία — レイトゥルギア、奉神礼）を行うことによって祝われます。日曜日は、奉神礼のための共同の集会によって祝われるのです。奉神礼はほかの日にも行われますが、土曜日、そしてとりわけ日曜日には、特別な、より盛大な奉神礼が行われます。</p><p>キリスト者にとって最も重要な出来事は、キリストのパスハ、すなわち主イエス・キリストの死者の中からの復活です。この日は祭りの中の祭り、祝いの中の祝いと呼ばれます。なぜなら：</p><blockquote><p>「そして、キリストが復活しなかったのなら、わたしたちの宣教は無駄であるし、あなたがたの信仰も無駄です。&lt;…&gt; <strong>そして、キリストが復活しなかったのなら、あなたがたの信仰はむなしく</strong>、あなたがたは今もなお罪の中にあることになります」（<a href="https://bibleox.com/ja/jp-ni/1kor/15/#L14,17">１コリ. 15:14,17</a>）</p></blockquote><p>すでに上で示したとおり、使徒たちはまさに日曜日に奉神礼を行っていました。この日は、復活された主と出会う喜びの日となりました。最初のキリスト者たちも同じようにしていました：<a href="https://bibleox.com/ru/ru/w/%D0%95%D0%B2%D1%85%D0%B0%D1%80%D0%B8%D1%81%D1%82%D0%B8%D1%8F_%D0%B2_%D0%B2%D0%BE%D1%81%D0%BA%D1%80%D0%B5%D1%81%D0%B5%D0%BD%D1%8C%D0%B5">日曜日の聖体礼儀（ロシア語）</a></p><p>また彼らは、皇帝コンスタンティヌス（4世紀）が休日を土曜日から日曜日に移したと非難します（<a href="https://bibleox.com/ja/jp-ni/act/20/#L6-11">使. 20:6-11</a>）。しかし、皇帝コンスタンティヌスは、週の中で最初の休日として日曜日を定めたのであって、土曜日については何の指示も出していません（<a href="https://bibleox.com/ru/ru/w/%D0%92%D0%BE%D1%81%D0%BA%D1%80%D0%B5%D1%81%D0%B5%D0%BD%D1%8C%D0%B5_%D0%B2%D1%8B%D1%85%D0%BE%D0%B4%D0%BD%D0%BE%D0%B9_%D0%A3%D0%BA%D0%B0%D0%B7_%D0%B8%D0%BC%D0%BF%D0%B5%D1%80%D0%B0%D1%82%D0%BE%D1%80%D0%B0_%D0%9A%D0%BE%D0%BD%D1%81%D1%82%D0%B0%D0%BD%D1%82%D0%B8%D0%BD%D0%B0">詳しくは、ロシア語</a>）。この勅令以前、ローマ帝国には一般的な週の休日はありませんでした。</p><p>したがって、この批判は、控えめに言っても根拠がありません。</p>

  - src: вино
    path: Wn20e_ぶどう酒
    title: ぶどう酒
    meta_desc: ぶどう酒についての聖書の引用
    menu: { parent: "旧約/律法", title: "ぶどう酒", priority: 200 }
    body: |-
      <h2>主イエス・キリストはぶどう酒を飲まれた</h2><blockquote><p>「<strong>人の子が来て、飲み食いすると</strong>、『見ろ、大食漢で<strong>大酒飲み</strong>だ。徴税人や罪人の仲間だ』と言う。しかし、知恵の正しさは、その働きによって証明される」（<a href="https://bibleox.com/ja/jp-ni/mf/11/#L19">マタ. 11:19</a>）<em>（ビザンティン本文（多数派写本）では「その働きによって」ではなく ἀπὸ τῶν τέκνων αὐτῆς —「<strong>その子らによって</strong>」です。）</em></p></blockquote><blockquote><p>「はっきり言っておく。神の国で新たに飲むその日まで、<strong>ぶどうの実から作ったものを飲むことはもう決してあるまい</strong>」（<a href="https://bibleox.com/ja/jp-ni/mk/14/#L25">マコ. 14:25</a>）</p></blockquote><h2>主はガリラヤのカナの婚礼で水からぶどう酒を造られた</h2><blockquote><p>「世話役は<strong>ぶどう酒に変わった水の味見をした</strong>。このぶどう酒がどこから来たのか、水をくんだ召し使いたちは知っていたが、世話役は知らなかったので、花婿を呼んで」（<a href="https://bibleox.com/ja/jp-ni/in/2/#L9">ヨハ. 2:9</a>）</p></blockquote><h2>病気のため、テモテは少しぶどう酒を飲むように勧められる</h2><blockquote><p>「これからは水ばかり飲まないで、胃のために、また、度々起こる病気のために、<strong>ぶどう酒を少し用いなさい</strong>」（<a href="https://bibleox.com/ja/jp-ni/1tim/5/#L23">１テモ. 5:23</a>）</p></blockquote><h2>注</h2><p>罪であるのは食べ物を食べることではなく、大食と美食です。罪であるのはぶどう酒を飲むことではなく、酩酊です。</p>
