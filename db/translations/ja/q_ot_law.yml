    body: |-
      <h2>モーセの律法の廃止についての詳しい説明</h2><p>聖師父の言葉の引用への序文を参照してください：<a href="https://bibleox.com/ru/ru/w/%D0%9E%D1%82%D0%BC%D0%B5%D0%BD%D0%B0_%D0%97%D0%B0%D0%BA%D0%BE%D0%BD%D0%B0_%D0%9C%D0%BE%D0%B8%D1%81%D0%B5%D1%8F/">モーセの律法の廃止について（ロシア語）</a></p><h2>モーセの律法は廃止されている</h2><blockquote><p>「しかし今は、わたしたちは、<strong>自分を縛っていた律法に対して<mark>死んだ者となり</mark></strong>、<strong><mark>律法から解放されています</mark></strong>。その結果、<strong>文字に従う古い生き方ではなく</strong>、“霊”に従う新しい生き方で仕えるようになっているのです」（<a href="https://bibleox.com/ja/jp-ni/rim/7/#L6">ロマ. 7:6</a>）</p></blockquote><h3>もはや養育係（律法）の下にはいない</h3><blockquote><p>「しかし、聖書はすべてのものを罪の支配下に閉じ込めたのです。それは、神の約束が、イエス・キリストへの信仰によって、信じる人々に与えられるようになるためでした。<strong><mark>信仰が現れる前には</mark>、わたしたちは律法の下で監視され</strong>、この信仰が啓示されるようになるまで閉じ込められていました。こうして<strong>律法は、<mark>わたしたちをキリストのもとへ導く養育係となったのです</mark></strong>。わたしたちが信仰によって義とされるためです。しかし、信仰が現れたので、<strong><mark>もはや、わたしたちはこのような養育係の下にはいません</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/gal/3/#L22-25">ガラ. 3:22-25</a>）</p></blockquote><blockquote><p>「つまり、こういうことです。<strong>相続人は、<mark>未成年である間は</mark></strong>、全財産の所有者であっても僕と何ら変わるところがなく、<strong>父親が定めた期日までは</strong>後見人や管理人の<strong>監督の下にいます</strong>。&lt;…&gt; しかし、今は神を知っている、いや、むしろ神から知られているのに、なぜ、あの無力で頼りにならない支配する諸霊の下に逆戻りし、<strong>もう一度改めて奴隷として仕えようとしているのですか。あなたがたは、いろいろな日（聖フェオファンによれば、<u>安息日のことを言っている</u>）、月、時節、年などを守っています</strong>。あなたがたのために苦労したのは、無駄になったのではなかったかと、あなたがたのことが心配です。わたしに答えてください。<strong><mark>律法の下にいたいと思っている人たち</mark></strong>、あなたがたは、律法の言うことに耳を貸さないのですか。&lt;…&gt;（女奴隷と自由な身の女から生まれたアブラハムの息子たちの話が語られる — 注）けれども、あのとき、<strong>肉によって生まれた者（律法との比較！ — 注）が、“霊”によって生まれた者を迫害したように、今も同じようなことが行われています</strong>。しかし、聖書に何と書いてありますか。『女奴隷とその子を追い出せ。<strong>女奴隷から生まれた子は、断じて自由な身の女から生まれた子と一緒に相続人になってはならないからである</strong>』と書いてあります。要するに、兄弟たち、<strong><mark>わたしたちは、女奴隷の子ではなく、自由な身の女から生まれた子なのです</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/gal/4/#L1-2,9-11,21,29-31">ガラ. 4:1-2,9-11,21,29-31</a>）<em>（「支配する諸霊」は、ギリシア語原文では τὰ ἀσθενῆ καὶ πτωχὰ στοιχεῖα —「無力で貧しい<strong>初歩の教え</strong>（原理）」です。）</em></p></blockquote><h2>律法の廃止についての公会議の決定</h2><p>最初の使徒の公会議は、キリスト者がユダヤ教の律法の規定を守る必要はないと決定しました：</p><blockquote><p>「ところが、<strong><mark>ファリサイ派から信者になった人</mark>が数名立って</strong>、『異邦人にも割礼を受けさせて、<strong><mark>モーセの律法を守るように命じるべきだ</mark></strong>』と言った。そこで、使徒たちと長老たちは、この問題について協議するために集まった」（<a href="https://bibleox.com/ja/jp-ni/act/15/#L5-6">使. 15:5-6</a>）</p><p>ギリシア語原文では τινες τῶν ἀπὸ τῆς αἱρέσεως τῶν Φαρισαίων —「ファリサイ派の<strong>異端</strong>（分派）の何人か」です。</p></blockquote><blockquote><p>「聞くところによると、<strong>わたしたちのうちのある者がそちらへ行き</strong>、<strong><mark>わたしたちから何の指示もないのに</mark></strong>、いろいろなことを言って、<strong>あなたがたを<mark>騒がせ</mark>動揺させた</strong>とのことです」（<a href="https://bibleox.com/ja/jp-ni/act/15/#L24">使. 15:24</a>）<em>（ビザンティン本文（多数派写本）では「<strong>割礼を受け、律法を守れと言って</strong>」が加わります：λέγοντες περιτέμνεσθαι καὶ τηρεῖν τὸν νόμον。）</em></p></blockquote><blockquote><p>「<strong><mark>聖霊とわたしたちは、次の必要な事柄以外、一切あなたがたに重荷を負わせないことに決めました</mark>。すなわち、偶像に献げられたものと、血と、絞め殺した動物の肉と、みだらな行いとを避けることです</strong>。以上を慎めばよいのです。健康を祈ります」（<a href="https://bibleox.com/ja/jp-ni/act/15/#L28-29">使. 15:28-29</a>）</p></blockquote><blockquote><p>「また、<strong>異邦人で信者になった人たちについては、わたしたちは既に手紙を書き送りました。それは、偶像に献げた肉と、血と、絞め殺した動物の肉とを口にしないように、また、みだらな行いを避けるようにという決定です</strong>」（<a href="https://bibleox.com/ja/jp-ni/act/21/#L25">使. 21:25</a>）<em>（ビザンティン本文（多数派写本）では「<strong>彼らはそのようなことを何も守る必要はなく</strong>」が加わります。）</em></p></blockquote><blockquote><p>「彼らは方々の町を巡回して、<strong>エルサレムの使徒と長老たちが決めた規定を守るようにと、人々に伝えた</strong>」（<a href="https://bibleox.com/ja/jp-ni/act/16/#L4">使. 16:4</a>）</p></blockquote><h2>使徒たちと最初のキリスト者たちは、モーセの律法によって生きていなかった</h2><h3>律法を持たない人に対しては、律法を持たない人のようになった（つまり律法を守らなかった）</h3><blockquote><p>「ユダヤ人に対しては、ユダヤ人のようになりました。ユダヤ人を得るためです。律法に支配されている人に対しては、わたし自身はそうではないのですが、律法に支配されている人のようになりました。律法に支配されている人を得るためです。また、わたしは神の律法を持っていないわけではなく、<strong><mark>キリストの律法に従っている</mark></strong>のですが、<strong><mark>律法を持たない人に対しては、律法を持たない人のようになりました</mark></strong>。律法を持たない人を得るためです」（<a href="https://bibleox.com/ja/jp-ni/1kor/9/#L20-21">１コリ. 9:20-21</a>）</p></blockquote><h3>輔祭ステファノは、律法を変えることを教えたと訴えられた</h3><blockquote><p>「そして、偽証人を立てて、次のように訴えさせた。『この男は、この聖なる場所と<strong><mark>律法</mark>をけなして</strong>、一向にやめようとしません。わたしたちは、彼がこう言っているのを聞いています。「あのナザレの人イエスは、この場所を破壊し、<strong><mark>モーセが我々に伝えた慣習を変えるだろう</mark></strong>」』」（<a href="https://bibleox.com/ja/jp-ni/act/6/#L13-14">使. 6:13-14</a>）</p></blockquote><h3>使徒パウロは、律法によらずに神を礼拝するよう教えたと訴えられた</h3><blockquote><p>「『この男は、<strong><mark>律法に違反するようなしかたで神をあがめるようにと、人々を唆しております</mark></strong>』と言った」（<a href="https://bibleox.com/ja/jp-ni/act/18/#L13">使. 18:13</a>）</p></blockquote><blockquote><p>「兄弟よ、ご存じのように、幾万人ものユダヤ人が信者になって、皆熱心に律法を守っています。この人たちがあなたについて聞かされているところによると、あなたは異邦人の間にいる全ユダヤ人に対して、『<strong><mark>子供に割礼を施すな</mark></strong>。<strong><mark>慣習に従うな</mark></strong>』と言って、<strong><mark>モーセから離れるように教えている</mark></strong>とのことです」（<a href="https://bibleox.com/ja/jp-ni/act/21/#L20-21">使. 21:20-21</a>）</p></blockquote><p>もし使徒パウロがユダヤ教を宣べ伝えているのなら、なぜユダヤ人は彼を迫害するのでしょうか。彼が律法から離れたからこそ、迫害するのです：</p><blockquote><p>「<strong>この自由を得させるために、キリストはわたしたちを自由の身にしてくださったのです</strong>。だから、しっかりしなさい。<strong><mark>奴隷の軛に二度とつながれてはなりません</mark></strong>。&lt;…&gt; 兄弟たち、<strong>このわたしが、今なお割礼を宣べ伝えているとするならば、<mark>今なお迫害を受けているのは、なぜですか</mark></strong>（彼が迫害されるのは、まさに割礼を宣べ伝えないからです。もし割礼を宣べ伝えていたなら、十字架のつまずきはなくなっていたでしょう — 注）。そのようなことを宣べ伝えれば、十字架のつまずきもなくなっていたことでしょう」（<a href="https://bibleox.com/ja/jp-ni/gal/5/#L1,11">ガラ. 5:1,11</a>）</p></blockquote><p>あるキリスト者たちは、迫害されないように、ユダヤ人の前で律法の下にいるふりをします：</p><blockquote><p>「<strong>肉において人からよく思われたがっている者たち</strong>が、<strong>ただキリストの十字架のゆえに迫害されたくないばかりに</strong>、あなたがたに無理やり割礼を受けさせようとしています」（<a href="https://bibleox.com/ja/jp-ni/gal/6/#L12">ガラ. 6:12</a>）</p></blockquote><h3>キリスト者は割礼を受けない</h3><blockquote><p>「<strong>割礼を受けている者が召されたのなら、割礼の跡を無くそうとしてはいけません</strong>。<strong>割礼を受けていない者が召されたのなら、割礼を受けようとしてはいけません</strong>。<strong>割礼の有無は問題ではなく</strong>、大切なのは神の掟を守ることです」（<a href="https://bibleox.com/ja/jp-ni/1kor/7/#L18-19">１コリ. 7:18-19</a>）</p></blockquote><blockquote><p>「キリスト・イエスに結ばれていれば、<strong>割礼の有無は問題ではなく</strong>、愛の実践を伴う信仰こそ大切です」（<a href="https://bibleox.com/ja/jp-ni/gal/5/#L6">ガラ. 5:6</a>）</p></blockquote><blockquote><p>「<strong>割礼の有無は問題ではなく</strong>、大切なのは、新しく創造されることです」（<a href="https://bibleox.com/ja/jp-ni/gal/6/#L15">ガラ. 6:15</a>）</p></blockquote><blockquote><p>「そこには、もはや、ギリシア人とユダヤ人、<strong>割礼を受けた者と受けていない者</strong>、未開人、スキタイ人、奴隷、自由な身分の者の区別はありません。キリストがすべてであり、すべてのもののうちにおられるのです」（<a href="https://bibleox.com/ja/jp-ni/kol/3/#L11">コロ. 3:11</a>）</p></blockquote><h3>動物のいけにえをささげない</h3><blockquote><p>「ここで、まず、『<strong>あなたはいけにえ、献げ物、焼き尽くす献げ物、罪を贖うためのいけにえ</strong>、つまり律法に従って献げられるものを<strong>望みもせず、好まれもしなかった</strong>』と言われ、次いで、『御覧ください。わたしは来ました。御心を行うために』と言われています。<strong>第二のものを立てるために、最初のものを廃止されるのです</strong>。&lt;…&gt; 『「それらの日の後、わたしが彼らと結ぶ契約はこれである」と、主は言われる。「わたしの律法を彼らの心に置き、彼らの思いにそれを書きつけよう。もはや彼らの罪と不法を思い出しはしない。」』<strong>罪と不法の赦しがある以上、罪を贖うための供え物は、もはや必要ではありません</strong>」（<a href="https://bibleox.com/ja/jp-ni/evr/10/#L8-9,16-18">ヘブ. 10:8-9,16-18</a>）</p></blockquote><h3>安息日の休みを守らない</h3><blockquote><p>「だから、あなたがたは食べ物や飲み物のこと、また、祭りや新月や<strong>安息日</strong>のことで<strong>だれにも批評されてはなりません</strong>」（<a href="https://bibleox.com/ja/jp-ni/kol/2/#L16">コロ. 2:16</a>）</p></blockquote><blockquote><p>「そのころ、<strong>ある安息日に</strong>イエスは麦畑を通られた。弟子たちは空腹になったので、<strong>麦の穂を摘んで食べ始めた</strong>。ファリサイ派の人々がこれを見て、イエスに、『御覧なさい。あなたの弟子たちは、安息日にしてはならないことをしている』と言った。&lt;…&gt; もし、『わたしが求めるのは憐れみであって、いけにえではない』という言葉の意味を知っていれば、あなたたちは<strong>罪もない人たちをとがめなかったであろう</strong>」（<a href="https://bibleox.com/ja/jp-ni/mf/12/#L1-2,7">マタ. 12:1-2,7</a>）</p></blockquote><h3>外国人と交わり、自らも外国人である</h3><blockquote><p>「そして、話しながら家に入ってみると、大勢の人が集まっていたので、彼らに言った。『<strong>あなたがたもご存じのとおり、ユダヤ人が外国人と交際したり、外国人を訪問したりすることは、律法で禁じられています</strong>。<strong>けれども、神はわたしに、どんな人をも清くない者とか、汚れている者とか言ってはならないと、お示しになりました</strong>』」（<a href="https://bibleox.com/ja/jp-ni/act/10/#L27-28">使. 10:27-28</a>）</p></blockquote><h3>死者に触れる</h3><p>主イエス・キリストは、ヤイロの亡くなった娘に触れられました：</p><blockquote><p>「そして、<strong>子供の手を取って</strong>、『タリタ、クム』と言われた。これは、『少女よ、わたしはあなたに言う。起きなさい』という意味である」（<a href="https://bibleox.com/ja/jp-ni/mk/5/#L41">マコ. 5:41</a>）</p></blockquote><p>律法によれば、キリストが十字架の上で亡くなられたとき、すでに死んだ方として、触れることはできませんでした。それができたのは、近親である生神女だけでした（<a href="https://bibleox.com/ja/jp-ni/lev/21/#L1-4">レビ. 21:1-4</a>）。しかしわたしたちは、神学者ヨハネ、ニコデモ、アリマタヤのヨセフを責めないばかりか、何も恐れずにわたしたちの救い主に仕えたことをほめたたえます。</p><blockquote><p>「<strong>ヨセフ</strong>はイエスの遺体を受け取ると、きれいな亜麻布に包み、岩に掘った自分の新しい墓の中に納め、墓の入り口には大きな石を転がしておいて立ち去った」（<a href="https://bibleox.com/ja/jp-ni/mf/27/#L59-60">マタ. 27:59-60</a>）</p></blockquote><blockquote><p>「<strong>ヨハネの弟子たち</strong>はこのことを聞き、やって来て、遺体を引き取り、墓に納めた」（<a href="https://bibleox.com/ja/jp-ni/mk/6/#L29">マコ. 6:29</a>）</p></blockquote><blockquote><p>「そして、百人隊長に確かめたうえ、遺体を<strong>ヨセフ</strong>に下げ渡した。ヨセフは亜麻布を買い、イエスを十字架から降ろしてその布で巻き、岩を掘って作った墓の中に納め、墓の入り口には石を転がしておいた」（<a href="https://bibleox.com/ja/jp-ni/mk/15/#L45-46">マコ. 15:45-46</a>）</p></blockquote><blockquote><p>「こうして、イエスについて書かれていることがすべて実現した後、人々はイエスを木から降ろし、墓に葬りました」（<a href="https://bibleox.com/ja/jp-ni/act/13/#L29">使. 13:29</a>）</p></blockquote><h3>主は姦淫の罪に問われた女を去らせる</h3><p>律法は姦淫に対して石打ちを命じています（レビ. 20:10）が、主は女を姦淫の罪に定めず、去らせられました：</p><blockquote><p>「女が、『主よ、だれも』と言うと、イエスは言われた。『<strong><mark>わたしもあなたを罪に定めない。行きなさい。これからは、もう罪を犯してはならない</mark></strong>』」（<a href="https://bibleox.com/ja/jp-ni/in/8/#L11">ヨハ. 8:11</a>）</p></blockquote><h3>主は御自分の血を飲むように命じられる</h3><p>神は血を飲むことを禁じておられます（創. 9:4、レビ. 3:17、レビ. 7:26、レビ. 17:14、申. 12:16）が、最後の晩餐で、飲みなさい、これはわたしの血である、と言って弟子たちに杯を与えられます：</p><blockquote><p>「一同が食事をしているとき、イエスはパンを取り、賛美の祈りを唱えて、それを裂き、弟子たちに与えながら言われた。『取って食べなさい。これはわたしの体である。』また、杯を取り、感謝の祈りを唱え、彼らに渡して言われた。『<strong><mark>皆、この杯から飲みなさい。これは</mark></strong>、罪が赦されるように、多くの人のために流される<strong><mark>わたしの血</mark></strong>、契約の血である』」（<a href="https://bibleox.com/ja/jp-ni/mf/26/#L26-28">マタ. 26:26-28</a>）<em>（ビザンティン本文（多数派写本）では「<strong>新しい</strong>契約の血」です：τὸ τῆς καινῆς διαθήκης。）</em></p></blockquote><h3>主はユダ族から大祭司となられた</h3><p>律法は、祭司はレビ族のアロンの家からだけ出るように命じています：</p><blockquote><p><em>「飾り帯を締め、ターバンを巻く。</em><strong><em>彼らの祭司職はこうして、不変の定めにより、彼らのものとなる</em></strong><em>。次に、</em><strong><em>アロンとその子ら</em></strong><em>の任職式を行う」（</em><a href="https://bibleox.com/ja/jp-ni/ish/29/#L9"><em>出. 29:9</em></a><em>）</em></p></blockquote><blockquote><p><em>「</em><strong><em>アロンの祭服は</em></strong><em>、彼の後を継ぐ子らが</em><strong><em>聖別の油を注がれ、祭司職に任命されたならば</em></strong><em>、</em><strong><em>彼らのものとなる</em></strong><em>」（</em><a href="https://bibleox.com/ja/jp-ni/ish/29/#L29"><em>出. 29:29</em></a><em>）</em></p></blockquote><p>しかし主は、ユダ族にお生まれになって大祭司となられました：</p><blockquote><p>「というのは、<strong><mark>わたしたちの主がユダ族出身であること</mark></strong>は明らかですが、<strong>この部族についてはモーセは、祭司に関することを何一つ述べていない</strong>からです」（<a href="https://bibleox.com/ja/jp-ni/evr/7/#L14">ヘブ. 7:14</a>）</p></blockquote><h3>まことの過越のいけにえは神殿の外でささげられる</h3><p>過越のいけにえは、エルサレムの神殿でしかささげることができませんでした：</p><blockquote><p>「<strong>過越のいけにえを屠ることができるのは、あなたの神、主が与えられる町のうちのどこででもよいのではなく</strong>、ただ、あなたの神、主がその名を置くために選ばれる場所でなければならない。夕方、太陽の沈むころ、あなたがエジプトを出た時刻に過越のいけにえを屠りなさい」（<a href="https://bibleox.com/ja/jp-ni/vtor/16/#L5-6">申. 16:5-6</a>）</p></blockquote><blockquote><p>「それで、イエスもまた、御自分の血で民を聖なる者とするために、<strong><mark>門の外で苦難に遭われたのです</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/evr/13/#L12">ヘブ. 13:12</a>）</p></blockquote><h2>十戒もモーセの律法なのか</h2><h3>モーセを通して与えられた神の律法 — レビ記のすべての命令</h3><p>神の多くの命令を挙げているレビ記は、<a href="https://bibleox.com/ru/ru/w/10-%D0%B7%D0%B0%D0%BF%D0%BE%D0%B2%D0%B5%D0%B4%D0%B5%D0%B9">石の板の戒め</a>をも含めて、それらを<strong>モーセを通して定められた主の律法</strong>と呼んでいます：</p><blockquote><p>「<strong><mark>以上は、主が</mark></strong>シナイ山において<strong><mark>モーセを通して</mark></strong>、御自分とイスラエルの人々との間に<strong><mark>定められた掟と法と律法である</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/lev/26/#L46">レビ. 26:46</a>）</p></blockquote><h3>神は御自分のすべての命令を律法と呼ばれる</h3><p>たとえば、マナを集めるという命令も神の律法です：</p><blockquote><p>「主はモーセに言われた。『見よ、わたしはあなたたちのために、天からパンを降らせる。<strong><mark>民は出て行って、毎日必要な分だけ集める</mark></strong>。わたしは、彼らが<strong><mark>わたしの指示どおりにする</mark></strong>かどうかを試す。』</p><p>…</p><p>主はモーセに言われた。『あなたたちは、いつまで<strong><mark>わたしの戒めと教えを</mark></strong>拒み続けて、守らないのか』」（<a href="https://bibleox.com/ja/jp-ni/ish/16/#L4,28">出. 16:4,28</a>）</p><p>ヘブライ語原文では、4節は הֲיֵלֵךְ בְּתוֹרָתִי —「<strong>わたしの律法</strong>（トーラー）に歩むかどうか」、28節の「教え」は תּוֹרֹתָי —「<strong>わたしの律法</strong>」です。</p></blockquote><p>出エジプト記16、24、31、34、35章、申命記4、6、10章。</p><h3>新しい律法は、もはや石の板にではなく、心に記される</h3><p>石の板に記されたものは「律法」と呼ばれています：</p><blockquote><p>「しかし、来るべき日に、わたしがイスラエルの家と結ぶ契約はこれである、と主は言われる。すなわち、<strong>わたしの<mark>律法</mark>を彼らの胸の中に授け、<mark>彼らの心にそれを記す</mark></strong>。わたしは彼らの神となり、彼らはわたしの民となる」（<a href="https://bibleox.com/ja/jp-ni/ier/31/#L33">エレ. 31:33</a>）</p></blockquote><blockquote><p>「<strong>あなたがたは、キリストがわたしたちを用いてお書きになった手紙として</strong>公にされています。墨ではなく生ける神の霊によって、<strong><mark><u>石の板</u>ではなく人の心の板に</mark>、書きつけられた手紙です</strong>」（<a href="https://bibleox.com/ja/jp-ni/2kor/3/#L3">２コリ. 3:3</a>）</p></blockquote><h3>キリストは十戒を区別せずに戒めについて語られる</h3><blockquote><p>「あなたがたも聞いているとおり、昔の人は『<strong>殺すな</strong>。人を殺した者は裁きを受ける』と命じられている。</p><p>あなたがたも聞いているとおり、『<strong>姦淫するな</strong>』と命じられている。</p><p>また、あなたがたも聞いているとおり、昔の人は、『<strong><mark>偽りの誓いを立てるな</mark></strong>。主に対して誓ったことは、必ず果たせ』と命じられている。</p><p>あなたがたも聞いているとおり、『<strong><mark>目には目を、歯には歯を</mark></strong>』（出. 21:24）と命じられている。</p><p>あなたがたも聞いているとおり、『<strong><mark>隣人を愛し</mark></strong>（レビ. 19:18）、<strong>敵を憎め</strong>』と命じられている」（<a href="https://bibleox.com/ja/jp-ni/mf/5/#L21,27,33,38,43">マタ. 5:21,27,33,38,43</a>）</p></blockquote><h3>使徒たちは十戒を単に律法と呼ぶ</h3><p>使徒ヤコブは、「殺すな」という戒めを破る者は律法の違犯者であると言います：</p><blockquote><p>「律法全体を守ったとしても、一つの点でおちどがあるなら、すべての点について有罪となるからです。『姦淫するな』と言われた方は、『殺すな』とも言われました。そこで、<strong>たとえ姦淫はしなくても、<mark>人殺し</mark>をすれば、あなたは<mark>律法の違犯者</mark>になるのです</strong>」（<a href="https://bibleox.com/ja/jp-ni/iak/2/#L10-11">ヤコ. 2:10-11</a>）</p></blockquote><h2>律法は救わない</h2><h3>律法は来るべきものの影であり、罪を思い起こさせるもの</h3><blockquote><p>「いったい、<strong>律法には、やがて来る良いことの<mark>影</mark>があるばかりで、そのものの実体はありません</strong>。従って、律法は年ごとに絶えず献げられる同じいけにえによって、神に近づく人たちを完全な者にすることはできません。もしできたとするなら、礼拝する者たちは一度清められた者として、もはや罪の自覚がなくなるはずですから、いけにえを献げることは中止されたはずではありませんか。ところが実際は、これらのいけにえによって<strong><mark>年ごとに罪の記憶がよみがえって来る</mark></strong>のです」（<a href="https://bibleox.com/ja/jp-ni/evr/10/#L1-3">ヘブ. 10:1-3</a>）</p></blockquote><h3>律法は救うことができない — 律法の知識も行いも</h3><blockquote><p>「それでは、律法は神の約束に反するものなのでしょうか。決してそうではない。<strong>万一、人を生かすことができる律法が与えられたとするなら、確かに人は律法によって義とされたでしょう</strong>」（<a href="https://bibleox.com/ja/jp-ni/gal/3/#L21">ガラ. 3:21</a>）</p></blockquote><h3>律法の文字を果たしても救われない</h3><blockquote><p>「言っておくが、あなたがたの義が律法学者やファリサイ派の人々の義にまさっていなければ、あなたがたは決して天の国に入ることができない」（<a href="https://bibleox.com/ja/jp-ni/mf/5/#L20">マタ. 5:20</a>）</p></blockquote><blockquote><p>「<strong>たとえ</strong>、人々の異言、天使たちの異言を語ろうとも、<strong>愛がなければ、わたしは騒がしいどら、やかましいシンバル</strong>。たとえ、預言する賜物を持ち、あらゆる神秘とあらゆる知識に通じていようとも、たとえ、山を動かすほどの完全な信仰を持っていようとも、愛がなければ、無に等しい。<strong>全財産を貧しい人々のために使い尽くそうとも、誇ろうとしてわが身を死に引き渡そうとも、愛がなければ、わたしに何の益もない</strong>」（<a href="https://bibleox.com/ja/jp-ni/1kor/13/#L1-3">１コリ. 13:1-3</a>）<em>（ビザンティン本文（多数派写本）では「誇ろうとして」ではなく ἵνα καυθήσωμαι —「<strong>焼かれるために</strong>わが身を引き渡そうとも」です。）</em></p></blockquote><h3>律法を破ることは罪の宣告に至る</h3><blockquote><p>「律法を知らないで罪を犯した者は皆、この律法と関係なく滅び、また、律法の下にあって罪を犯した者は皆、律法によって裁かれます。律法を聞く者が神の前で正しいのではなく、これを実行する者が、義とされるからです」（<a href="https://bibleox.com/ja/jp-ni/rim/2/#L12-13">ロマ. 2:12-13</a>）</p></blockquote><h3>律法全体を果たさない者は呪われている</h3><blockquote><p>「律法の実行に頼る者はだれでも、呪われています。『<strong><mark>律法の書に書かれているすべての事を絶えず守らない者は皆、呪われている</mark></strong>』と書いてあるからです。律法によってはだれも神の御前で義とされないことは、明らかです。なぜなら、『正しい者は信仰によって生きる』からです。律法は、信仰をよりどころとしていません。『律法の定めを果たす者は、その定めによって生きる』のです」（<a href="https://bibleox.com/ja/jp-ni/gal/3/#L10-12">ガラ. 3:10-12</a>）</p></blockquote><h3>律法はだれも完全にしなかった</h3><blockquote><p>「その結果、一方では、<strong>以前の掟が、その弱く無益なために廃止されました</strong>。――<strong><mark>律法が何一つ完全なものにしなかったからです</mark></strong>――しかし、他方では、もっと優れた希望がもたらされました。わたしたちは、この希望によって神に近づくのです」（<a href="https://bibleox.com/ja/jp-ni/evr/7/#L18-19">ヘブ. 7:18-19</a>）</p></blockquote><h2>では、なぜモーセの律法が必要なのか</h2><h3>律法は罪の自覚を与える</h3><blockquote><p>「なぜなら、律法を実行することによっては、だれ一人神の前で義とされないからです。<strong>律法によっては、<mark>罪の自覚</mark>しか生じないのです</strong>」（<a href="https://bibleox.com/ja/jp-ni/rim/3/#L20">ロマ. 3:20</a>）</p></blockquote><blockquote><p>「<strong>律法が入り込んで来たのは、<mark>罪が増し加わるため</mark>でありました</strong>。しかし、罪が増したところには、恵みはなおいっそう満ちあふれました」（<a href="https://bibleox.com/ja/jp-ni/rim/5/#L20">ロマ. 5:20</a>）</p></blockquote><h3>律法は罪人を抑える（罪人に必要である）</h3><blockquote><p>「すなわち、次のことを知って用いれば良いものです。<strong>律法は</strong>、正しい者のために<strong>与えられているのではなく</strong>、<strong><mark>不法な者</mark></strong>や不従順な者、不信心な者や罪を犯す者、神を畏れぬ者や俗悪な者、父を殺す者や母を殺す者、人を殺す者」（<a href="https://bibleox.com/ja/jp-ni/1tim/1/#L9">１テモ. 1:9</a>）</p></blockquote><h3>律法は救い主の必要を悟らせる（救い主を待ち望ませる）</h3><blockquote><p>「『内なる人』としては神の律法を喜んでいますが、わたしの五体にはもう一つの法則があって心の法則と戦い、わたしを、五体の内にある罪の法則のとりこにしているのが分かります。<strong>わたしはなんと惨めな人間なのでしょう。死に定められたこの体から、<mark>だれが</mark>わたしを救ってくれるでしょうか</strong>」（<a href="https://bibleox.com/ja/jp-ni/rim/7/#L22-24">ロマ. 7:22-24</a>）</p></blockquote><h2>律法は永遠ではない</h2><h3>律法は成就するまで続く</h3><blockquote><p>「はっきり言っておく。<strong><mark>すべてのことが実現し</mark></strong>、天地が消えうせるまで、律法の文字から一点一画も消え去ることはない」（<a href="https://bibleox.com/ja/jp-ni/mf/5/#L18">マタ. 5:18</a>）</p></blockquote><h3>キリストは律法を成就し、それによって廃止された</h3><blockquote><p>「わたしが来たのは律法や預言者を廃止するためだ、と思ってはならない。廃止するためではなく、<strong><mark>完成するため</mark></strong>である」（<a href="https://bibleox.com/ja/jp-ni/mf/5/#L17">マタ. 5:17</a>）</p></blockquote><h2>キリストは律法の時代を終わらせる</h2><h3>モーセのような預言者の到来の預言</h3><p>モーセの律法が定められるとすぐに、将来モーセのような預言者、すなわち<strong>立法者</strong>が来ること、その方に聞き従わなければならないことが語られます。これはキリストについて言われたのです：</p><blockquote><p>「あなたの神、主はあなたの中から、あなたの同胞の中から、<strong><mark>わたしのような預言者</mark></strong>を立てられる。<strong><mark>あなたたちは彼に聞き従わねばならない</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/vtor/18/#L15">申. 18:15</a>）</p></blockquote><blockquote><p>「モーセは言いました。『あなたがたの神である主は、<strong><mark>あなたがたの同胞の中から、わたしのような預言者をあなたがたのために立てられる。彼が語りかけることには、何でも聞き従え</mark></strong>』」（<a href="https://bibleox.com/ja/jp-ni/act/3/#L22">使. 3:22</a>）</p></blockquote><blockquote><p>「このモーセがまた、イスラエルの子らにこう言いました。『<strong><mark>神は、あなたがたの兄弟の中から、わたしのような預言者をあなたがたのために立てられる</mark></strong>』」（<a href="https://bibleox.com/ja/jp-ni/act/7/#L37">使. 7:37</a>）</p></blockquote><p>そして神御自身が、同じ言葉でこれを確証されます：</p><blockquote><p>「すると、雲が現れて彼らを覆い、雲の中から声がした。『これはわたしの愛する子。<strong><mark>これに聞け</mark></strong>』」（<a href="https://bibleox.com/ja/jp-ni/mk/9/#L7">マコ. 9:7</a>）（<a href="https://bibleox.com/ja/jp-ni/mf/17/#L5">マタ. 17:5</a>）（<a href="https://bibleox.com/ja/jp-ni/lk/9/#L35">ルカ. 9:35</a>）</p></blockquote><h3>キリストは律法を「あなたたちの」律法と呼ばれる</h3><blockquote><p>「<strong><mark>あなたたちの</mark>律法</strong>には、二人が行う証しは真実であると書いてある」（<a href="https://bibleox.com/ja/jp-ni/in/8/#L17">ヨハ. 8:17</a>）</p></blockquote><blockquote><p>「そこで、イエスは言われた。『<strong><mark>あなたたちの</mark>律法</strong>に、「わたしは言う。あなたたちは神々である」と書いてあるではないか』」（<a href="https://bibleox.com/ja/jp-ni/in/10/#L34">ヨハ. 10:34</a>）</p></blockquote><h3>律法は洗礼者ヨハネまで続いた</h3><blockquote><p>「彼が活動し始めたときから今に至るまで、天の国は力ずくで襲われており、激しく襲う者がそれを奪い取ろうとしている。<strong>すべての預言者と律法が預言したのは、ヨハネの時<mark>まで</mark>である</strong>」（<a href="https://bibleox.com/ja/jp-ni/mf/11/#L12-13">マタ. 11:12-13</a>）</p></blockquote><h3>律法は到来の時まで与えられた</h3><blockquote><p>「では、<strong>律法</strong>とはいったい何か。<strong>律法は、<mark>約束を与えられたあの子孫が来られるときまで</mark>、違犯を明らかにするために付け加えられた（！）もので</strong>、天使たちを通し、仲介者の手を経て制定されたものです」（<a href="https://bibleox.com/ja/jp-ni/gal/3/#L19">ガラ. 3:19</a>）</p></blockquote><h3>戒めの律法は教えによって廃棄された</h3><blockquote><p>「実に、キリストはわたしたちの平和であります。二つのものを一つにし、御自分の肉において敵意という隔ての壁を取り壊し、<strong><mark>規則と戒律ずくめの律法を廃棄されました</mark></strong>。こうしてキリストは、双方を御自分において一人の新しい人に造り上げて平和を実現し、十字架を通して、両者を一つの体として神と和解させ、十字架によって敵意を滅ぼされました」（<a href="https://bibleox.com/ja/jp-ni/ef/2/#L14-16">エフェ. 2:14-16</a>）</p><p>ギリシア語原文では τὸν νόμον τῶν ἐντολῶν ἐν δόγμασιν καταργήσας で、ロシア語の宗務院訳では「戒めの律法を<strong>教えによって</strong>廃棄し」と訳されています（ἐν δόγμασιν）。</p></blockquote><h3>律法について論じ合うことは、今や無益である</h3><blockquote><p>「愚かな議論、系図の詮索、<strong>争い、律法についての論議を避けなさい</strong>。<strong>それは無益で、むなしいものだからです</strong>」（<a href="https://bibleox.com/ja/jp-ni/tit/3/#L9">テト. 3:9</a>）</p></blockquote><h3>奴隷の軛 — モーセの律法</h3><blockquote><p>「この自由を得させるために、キリストはわたしたちを自由の身にしてくださったのです。だから、しっかりしなさい。<strong><mark>奴隷の軛</mark>に二度とつながれてはなりません</strong>」（<a href="https://bibleox.com/ja/jp-ni/gal/5/#L1">ガラ. 5:1</a>）</p></blockquote><h3>キリストの軛は別のもの — 軽い</h3><blockquote><p>「疲れた者、重荷を負う者は、だれでもわたしのもとに来なさい。休ませてあげよう。わたしは柔和で謙遜な者だから、<strong>わたしの軛を負い、<mark>わたしに学びなさい</mark></strong>。そうすれば、あなたがたは安らぎを得られる。<strong><mark>わたしの軛は負いやすく、わたしの荷は軽いからである</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/mf/11/#L28-30">マタ. 11:28-30</a>）</p></blockquote><h3>新しい律法 — キリストの律法 — は愛である</h3><blockquote><p>「愛は隣人に悪を行いません。だから、<strong><mark>愛は律法を全うするものです</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/rim/13/#L10">ロマ. 13:10</a>）</p></blockquote><blockquote><p>「<strong>律法全体は、『隣人を自分のように<mark>愛しなさい</mark>』という一句によって全うされる</strong>からです」（<a href="https://bibleox.com/ja/jp-ni/gal/5/#L14">ガラ. 5:14</a>）</p></blockquote><h3>律法についての長い議論の後で — 信仰と愛</h3><blockquote><p>「神に願うことは何でもかなえられます。わたしたちが神の掟を守り、御心に適うことを行っているからです。<strong>その掟とは、神の子イエス・キリストの名を<mark>信じ</mark></strong>、<strong><mark>この方がわたしたちに命じられたように</mark>、互いに<mark>愛し合う</mark>ことです</strong>」（<a href="https://bibleox.com/ja/jp-ni/1in/3/#L22-23">１ヨハ. 3:22-23</a>）</p></blockquote><blockquote><p>「互いに重荷を担いなさい。そのようにしてこそ、<strong><mark>キリストの律法を全うすることになるのです</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/gal/6/#L2">ガラ. 6:2</a>）</p></blockquote><blockquote><p>「割礼を受ける人すべてに、もう一度はっきり言います。そういう人は律法全体を行う義務があるのです。<strong><mark>律法によって義とされようとするなら、あなたがたはだれであろうと、キリストとは縁もゆかりもない者とされ</mark>、いただいた恵みも失います。わたしたちは、義とされた者の希望が実現することを、“霊”により、<mark>信仰に基づいて切に待ち望んでいるのです</mark></strong>。キリスト・イエスに結ばれていれば、割礼の有無は問題ではなく、<strong><mark>愛の実践を伴う信仰</mark></strong>こそ大切です」（<a href="https://bibleox.com/ja/jp-ni/gal/5/#L3-6">ガラ. 5:3-6</a>）</p></blockquote><blockquote><p>「<strong><mark>兄弟たち、あなたがたは、自由を得るために召し出されたのです</mark></strong>。ただ、この自由を、肉に罪を犯させる機会とせずに、<strong><mark>愛</mark>によって互いに仕えなさい</strong>」（<a href="https://bibleox.com/ja/jp-ni/gal/5/#L13">ガラ. 5:13</a>）</p></blockquote><h3>死は、モーセの律法を破ることからではなく、信仰がないことから来る</h3><blockquote><p>「御子と結ばれている人にはこの命があり、神の子と結ばれていない人にはこの命がありません」（<a href="https://bibleox.com/ja/jp-ni/1in/5/#L12">１ヨハ. 5:12</a>）<em>（ギリシア語原文では ὁ ἔχων τὸν υἱὸν ἔχει τὴν ζωήν —「御子を<strong>持つ</strong>者は命を持つ」です。）</em></p></blockquote><h3>救いは、モーセの律法の行いとは関係なく来た</h3><blockquote><p>「ところが今や、<strong><mark>律法とは関係なく</mark></strong>、しかも律法と預言者によって立証されて、<strong>神の義が示されました</strong>。すなわち、イエス・キリストを信じることにより、信じる者すべてに与えられる神の義です。そこには何の差別もありません」（<a href="https://bibleox.com/ja/jp-ni/rim/3/#L21-22">ロマ. 3:21-22</a>）</p></blockquote><blockquote><p>「従って、<strong>今や、<mark>キリスト・イエスに結ばれている者</mark>は、罪に定められることはありません</strong>。<strong><mark>キリスト・イエスによって命をもたらす霊の法則が</mark>、罪と死との法則から<mark>あなたを解放した</mark></strong>からです」（<a href="https://bibleox.com/ja/jp-ni/rim/8/#L1-2">ロマ. 8:1-2</a>）<em>（ビザンティン本文（多数派写本）では1節に「<strong>肉に従ってではなく、霊に従って歩む</strong>」（μὴ κατὰ σάρκα περιπατοῦσιν ἀλλὰ κατὰ πνεῦμα）が加わります。また2節の「法則」は、ギリシア語原文ではどちらも νόμος —「律法」です。）</em></p></blockquote><h3>律法に従う生活は肉に従う生活である</h3><blockquote><p>「あなたがたに一つだけ確かめたい。<strong><mark>あなたがたが“霊”を受けたのは、律法を行ったからですか</mark></strong>。それとも、福音を聞いて信じたからですか。あなたがたは、それほど物分かりが悪く、<strong>“霊”によって始めたのに、<mark>肉によって仕上げようとするのですか</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/gal/3/#L2-3">ガラ. 3:2-3</a>）</p></blockquote><h3>霊に従う生活は、律法に従う生活よりも高い</h3><blockquote><p>「わたしが言いたいのは、こういうことです。<strong>霊の導きに従って歩みなさい</strong>。そうすれば、決して肉の欲望を満足させるようなことはありません。&lt;…&gt; <strong>しかし、霊に導かれているなら、<mark>あなたがたは、律法の下にはいません</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/gal/5/#L16,18">ガラ. 5:16,18</a>）</p></blockquote><blockquote><p>「これに対して、霊の結ぶ実は愛であり、喜び、平和、寛容、親切、善意、誠実、柔和、節制です。<strong><mark>これらを禁じる掟はありません</mark></strong>」（<a href="https://bibleox.com/ja/jp-ni/gal/5/#L22-23">ガラ. 5:22-23</a>）<em>（「掟」は、ギリシア語原文では νόμος —「律法」です：「これらに反する律法はありません」。）</em></p></blockquote>

