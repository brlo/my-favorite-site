  - src: ИгнАн_Еф
    path: Ig1E_エフェソの教会への手紙
    title: エフェソの教会への手紙
    meta_desc: アンティオキアの聖イグナティオス（テオフォロス）がエフェソの教会に宛てた手紙。ギリシア語原文からの翻訳と注。
    menu: { parent: "手紙", title: "エフェソの教会への手紙", priority: 1 }
    body: |-
      <h2>0</h2><p>イグナティオス[1]、またの名をテオフォロス[2]より、父なる神の満ちあふれる偉大さのうちに祝福され、世々の前から[3]、変わることなく揺るがない永続する栄光へと常に定められ、真の受難において、父と私たちの神イエス・キリストの御心によって一つにされ選ばれた、アジアのエフェソにある、まことに幸いな教会へ。イエス・キリストにあって、また汚れのない喜びのうちに、心からの挨拶を送ります。</p>
      <h2>1</h2><p>1. 神において深く愛されているあなたがたの名を、私は受け入れました。それは、私たちの救い主キリスト・イエスへの信仰と愛に基づく正しい本性によって、あなたがたが得た名です。あなたがたは神に倣う者であり、神の血[4]によって燃え立たされ、同じ家族にふさわしい務めを完全に果たしました。</p><p>2. 私が共通の名と希望のために[5]シリアから縛られて来たこと、そしてあなたがたの祈りによってローマで獣と戦うことを遂げ、それを遂げることによって弟子となることができるよう[6]望んでいることを聞いて、あなたがたは急いで私に会いに来てくれたのです。</p><p>3. こうして私は神の名によって、あなたがたの大勢の人々を、言い尽くせない愛の人であり、肉においてあなたがたの主教であるオネシモ[7]のうちに迎えました。あなたがたがイエス・キリストに従って彼を愛し、皆が彼に似る者となるよう、私は祈ります。このような主教を持つにふさわしいあなたがたに、それを恵んでくださった方はほめたたえられますように。</p>
      <h2>2</h2><p>1. 私の同労のしもべ[8]であり、神に従うあなたがたの輔祭で、あらゆることにおいて祝福されたブッロスについては、彼があなたがたと主教との誉れのために、ここにとどまってくれるよう願っています。また、神にもあなたがたにもふさわしいクロコスは、あなたがたの愛の生きた手本[9]として私が迎えた人ですが、あらゆる点で私を安らがせてくれました。イエス・キリストの父が、オネシモ、ブッロス、エウプロス、フロントンとともに、彼をも慰めてくださいますように。私は彼らを通して、あなたがた皆を愛のうちに見たのです。</p><p>2. もし私がふさわしい者であるなら、いつまでもあなたがたのことを喜びとしたいものです[10]。それゆえ、あなたがたを栄光あるものとしてくださったイエス・キリストを、あらゆる仕方であがめるのがふさわしいのです。それは、あなたがたが一つの従順のうちに整えられ、主教と司祭団[11]に従って、すべてにおいて聖なる者となるためです[12]。</p>
      <h2>3</h2><p>1. 私はひとかどの者であるかのように、あなたがたに命じているのではありません。たとえこの名のために縛られていても、まだイエス・キリストにあって完成されてはいないからです。今ようやく弟子となり始めたばかりで、私の学友[13]であるあなたがたに語りかけているのです。むしろ私の方こそ、信仰と訓戒と忍耐と寛容とによって、あなたがたから油を塗られて備えられる[14]べきでした。</p><p>2. しかし、愛があなたがたについて沈黙することを許さないので、あなたがたが神の御心[15]と一つになって歩むよう、先んじて勧めることにしたのです。なぜなら、私たちの分かたれることのない命であるイエス・キリストは父の御心であり、同じように、地の果てにまで立てられた主教たちも、イエス・キリストの御心のうちにあるからです。</p>
      <h2>4</h2><p>1. それゆえ、あなたがたも主教の思いと一つになって歩むのがふさわしく、実際あなたがたはそうしています。名高く神にふさわしいあなたがたの司祭団は、竪琴に弦が合わさるように主教と結び合わされているからです。こうして、あなたがたの一致と調和した愛のうちに、イエス・キリストが歌われています。</p><p>2. あなたがた一人一人も合唱隊となりなさい。それは、一致のうちに調和し、一つとなって神の調べ[16]を受け、イエス・キリストを通して一つの声で父に歌うためです。そうすれば父はあなたがたに耳を傾け、あなたがたの善い行いによって、あなたがたが御子の肢体であることを認めてくださいます。ですから、あなたがたが非の打ちどころのない一致のうちにあることは有益です。それは、いつも神にもあずかるためです。</p>
      <h2>5</h2><p>1. 私はわずかの間に、あなたがたの主教とこれほどの――人間的なものではなく霊的な――親しい交わりを得ました。それならば、教会がイエス・キリストと、またイエス・キリストが父と結ばれているように、主教とこのように深く結ばれ、すべてが一致のうちに調和しているあなたがたは、どれほど幸いであることでしょう。</p><p>2. だれも思い違いをしてはなりません。祭壇の内側[17]にいない者は、神のパン[18]を欠いています。一人か二人の祈りでさえこれほどの力を持つのなら[19]、主教と全教会の祈りはなおさらではありませんか。</p><p>3. ですから、共に集まらない者は、すでに高ぶっており、自分で自分を（教会から）分け隔てたのです。こう書かれているからです。「神は、高慢な者を敵とされる」[20]。それゆえ私たちは、神に従う者となるために、主教に逆らわないよう努めましょう。</p>
      <h2>6</h2><p>1. 主教が沈黙している[21]のを見れば見るほど、いっそう彼を畏れ敬いなさい。家の主人が自分の家の管理のために遣わす者はだれでも、遣わした方御自身のように迎えなければならないからです[22]。ですから、主教を主御自身のように仰ぎ見なければならないことは明らかです。</p><p>2. 実際、オネシモ自身も、神におけるあなたがたのよい秩序を大いにほめています。あなたがたは皆、真理に従って生きており、あなたがたの間にはどんな異端も住みついていない、それどころか、イエス・キリストについて真理のうちに語る者以外には、だれの言うことにも耳を貸さない、と。</p>
      <h2>7</h2><p>1. ある人々は、悪い偽りをもって（キリストの）名を持ち歩きながら、神にふさわしくない別のことを行うのを常としています。あなたがたは彼らを野獣のように避けなければなりません。彼らは狂った犬であり、ひそかにかみつく者たちだからです。彼らは癒やしがたい者なので、あなたがたは警戒しなければなりません。</p><p>2. 医者はただ一人です。肉においてまた霊において、生まれた方でありまた生まれざる方[23]、人のうちにおられる神[24]、死のうちにある真の命、マリアからの方でありまた神からの方、初めは苦しみを受けうる方であり、今は苦しみを受けない方、私たちの主イエス・キリストです。</p>
      <h2>8</h2><p>1. ですから、だれにもあなたがたを欺かせてはなりません。もっとも、あなたがたはすっかり神のものなので、欺かれてはいません。あなたがたを苦しめうるような争いが、あなたがたの間に何一つ根を下ろしていないのなら、あなたがたはまさしく神に従って生きているのです。私はあなたがたのための身代わりの捧げ物[25]です。世々に名高い教会であるあなたがたエフェソの人々のために、私は自分をささげます。</p><p>2. 肉の人は霊のことを行うことができず、霊の人も肉のことを行うことができません。それは、信仰が不信仰のことを、不信仰が信仰のことを行えないのと同じです。しかし、あなたがたが肉において行うことさえ、霊的なのです。あなたがたはすべてをイエス・キリストにあって行っているからです。</p>
      <h2>9</h2><p>1. しかし私は、ある人々がそこから[26]やって来て、悪い教えを持ち込んだことを知りました。けれども、あなたがたは彼らがあなたがたの間に種を蒔くことを許さず、彼らの蒔くものを受け入れないように耳をふさぎました。あなたがたは父の神殿の石[27]であり、父なる神の建物のために備えられ、十字架であるイエス・キリストの起重機によって、聖霊を綱として用いて高みへと引き上げられているからです。あなたがたの信仰はあなたがたを引き上げるもの、愛は神へと導き上る道です。</p><p>2. ですから、あなたがたは皆、共に旅する者であり、神を担う者、神殿を担う者、キリストを担う者、聖なるものを担う者[28]であって、あらゆることにおいてイエス・キリストの掟で飾られています。私もあなたがたのことを喜び、この手紙を通してあなたがたと語り合い、共に喜ぶことを許されました。あなたがたが人間的な生き方においては、ただ神のほかに何ものも愛さないからです。</p>
      <h2>10</h2><p>1. ほかの人々[29]のためにも絶えず祈りなさい。彼らにも悔い改めの希望があり、神に至ることができるからです。ですから、少なくともあなたがたの行いから、彼らが学ぶことができるようにしてやりなさい。</p><p>2. 彼らの怒りには柔和をもって、彼らの大言壮語には謙遜をもって、彼らの冒涜には祈りをもって、彼らの迷いには信仰に堅く立つことをもって、彼らの粗暴さには穏やかさをもって応じなさい。彼らに仕返しをしようと躍起になってはなりません。</p><p>3. 寛容によって、彼らの兄弟であることを示しましょう。そして主に倣う者となるよう努めましょう――だれがより多く不当な扱いを受け、だれがより多く奪われ、だれがより多く退けられるかを競って[30]。それは悪魔の雑草[31]があなたがたのうちに一本も見いだされず、あなたがたが完全な清さと慎みのうちに、肉においても霊においても、イエス・キリストのうちにとどまるためです。</p>
      <h2>11</h2><p>1. 今は終わりの時です。ですから、私たちは恥じ入り、神の寛容を恐れましょう。それが私たちにとって裁きとならないためです。来るべき怒りを恐れるか、今ある恵みを愛するか、そのどちらかです。ただ、真の命のためにキリスト・イエスのうちに見いだされさえすればよいのです。</p><p>2. この方を離れては、何一つあなたがたにふさわしいものはありません。私はこの方のうちに鎖を身に帯びています。この鎖は霊的な真珠[32]であり、あなたがたの祈りによって、この鎖を帯びたまま私が復活することができますように。その祈りに私がいつもあずかる者でありますように。こうして私が、イエス・キリストの力によって常に使徒たちと心を一つにしてきたエフェソのキリスト者たちの分け前のうちに見いだされますように。</p>
      <h2>12</h2><p>1. 私は自分が何者であり、だれに書いているのかを知っています。私は罪に定められた者、あなたがたは憐れみを受けた者。私は危険の中にある者、あなたがたは堅く立てられた者です。</p><p>2. あなたがたは、神のもとへと殺されていく者たちの通り道[33]です。あなたがたは、聖別され、証しを立て、まことに幸いなパウロと共に秘義にあずかる者です。私が神に到達するとき、彼の足跡のうちに見いだされますように。彼は、どの手紙においても[34]、キリスト・イエスにあってあなたがたのことを覚えています。</p>
      <h2>13</h2><p>1. ですから、神への感謝の祭儀（聖体）[35]と賛美のために、もっと頻繁に集まるよう努めなさい。あなたがたがしばしば共に集まるとき、サタンの力は打ち砕かれ、彼のもたらす滅びは、あなたがたの信仰の一致のうちに解き放たれて消え去ります。</p><p>2. 平和にまさるものは何もありません。平和によって、天上のものと地上のものとのあらゆる戦いが無力にされるのです。</p>
      <h2>14</h2><p>1. あなたがたがイエス・キリストに対して信仰と愛とを完全に持っているなら、これらのことは何一つあなたがたに隠されてはいません。信仰と愛とは命の初めと終わりです。初めは信仰、終わりは愛です。この二つが一つとなったものは神であり[36]、そのほかのすべての善いことはこれに従ってきます。</p><p>2. 信仰を告白する者はだれも罪を犯さず、愛を得た者はだれも憎みません。「木はその実によって明らかになる」[37]。同じように、キリストのものであると告白する者たちは、その行いによって明らかになります。今は告白することが肝心なのではなく、終わりまで信仰の力のうちに見いだされることが肝心なのです。</p>
      <h2>15</h2><p>1. 語りながら（キリスト者で）ないよりは、黙っていても（キリスト者で）あるほうがよいのです。教えることはよいことです、語る者が行うのであれば。ですから、教師はただ一人です。この方が「仰せになると、そのように成った」[38]のです。そしてこの方が沈黙のうちになさったことも、父にふさわしいのです。</p><p>2. イエスの言葉を真に自分のものとした者は、その沈黙をも聞くことができます。それは完全な者となり、語ることによって行い、沈黙することによって知られるためです。</p><p>3. 主に隠されていることは何もありません。私たちの秘めたことさえ、主の近くにあります。ですから、主が私たちのうちに住んでおられるものとして、すべてを行いましょう。それは私たちが主の神殿となり[39]、主が私たちのうちにおられる私たちの神となるためです。実際そのとおりであり、それは私たちの目の前に現れるでしょう。そのゆえに、私たちが主を愛するのは当然なのです。</p>
      <h2>16</h2><p>1. 私の兄弟たち、思い違いをしてはなりません。家庭を壊す者たち[40]は神の国を受け継ぐことがありません。</p><p>2. 肉においてこのようなことを行う者たちが死んだのなら、ましてや、イエス・キリストがそのために十字架につけられた神への信仰を、悪い教えによって損なう者はなおさらです。そのような者は汚れた者となって、消えることのない火に行くでしょう。彼の言うことを聞く者も同様です。</p>
      <h2>17</h2><p>1. そのために、主は頭に香油を受けられたのです[41]。それは教会に不朽の香りを吹き込むためでした。この世の支配者[42]の教えの悪臭を身に塗ってはなりません。彼があなたがたを、目の前に置かれた命から引き離し、捕らえていくことのないためです。</p><p>2. 私たちはなぜ、神の知識、すなわちイエス・キリストを受けていながら、皆が賢くならないのでしょうか。なぜ、主が真に送ってくださった賜物を知らずに、愚かにも滅んでいくのでしょうか。</p>
      <h2>18</h2><p>1. 私の霊は十字架のための身代わりの捧げ物です。十字架は、信じない者にはつまずきですが、私たちには救いであり永遠の命です[43]。「知恵のある人はどこにいる。論客はどこにいる」[44]。賢いと言われる者たちの誇りはどこにあるのでしょう。</p><p>2. 私たちの神イエス・キリストは、神の計らい（オイコノミア）に従って、マリアの胎に宿られました。それはダビデの子孫からであり[45]、また聖霊からでした。この方は生まれ、洗礼を受けられましたが、それは御自分の受難によって水を清めるためでした[46]。</p>
      <h2>19</h2><p>1. この世の支配者には、マリアの処女性とその出産、また同じように主の死も隠されていました。これらは、神の沈黙のうちに成し遂げられた、高らかに告げ知らされるべき三つの秘義[47]です。</p><p>2. では、それはどのようにして世々に現されたのでしょうか。天に一つの星が輝きました[48]。それはすべての星にまさって輝き、その光は言い表しがたく、その新しさは驚きをもたらしました。ほかのすべての星々は、太陽や月とともに、その星を囲む合唱隊となりましたが、その星の光はすべてにまさっていました。そして、自分たちとは似ていないこの新しいものがどこから来たのかと、動揺が起こりました。</p><p>3. こうして、あらゆる魔術は解かれ、悪のあらゆる束縛は消え去りました。無知は取り除かれ、古い王国は滅ぼされました。神が人として現れ、永遠の命の新しさをもたらされたからです。神のもとで完全に備えられていたことが、始まりを迎えたのです。それ以来、死の滅びが図られていたために、万物は揺り動かされました。</p>
      <h2>20</h2><p>1. もしイエス・キリストが、あなたがたの祈りによって私をふさわしい者としてくださり、それが御心であるなら、あなたがたに書こうとしている第二の小さな書[49]において、私が語り始めた、新しい人イエス・キリストに関する神の計らいについて、さらに明らかにしましょう。それは、この方への信仰と愛、この方の受難と復活についてです。</p><p>2. とりわけ、主が私に啓示してくださるなら、そうしましょう。あなたがたが一人残らず、皆共に、恵みのうちに名を連ねて、一つの信仰のうちに、また肉によればダビデの家系から出た人の子にして神の子であるイエス・キリストのうちに集まり、心を乱されることなく主教と司祭団に従い、一つのパンを裂いていることを。このパンは不死の薬[50]、死なないための解毒剤であり、イエス・キリストのうちにいつまでも生きさせるものです。</p>
      <h2>21</h2><p>1. 私は、あなたがたのために、またあなたがたが神の誉れのためにスミルナに遣わしてくれた人々のために、自分の命を差し出す者[51]です。私はそのスミルナからあなたがたにこの手紙を書いています。主に感謝し、あなたがたを愛するようにポリュカルポスを愛しながら。イエス・キリストがあなたがたを覚えておられるように、私のことも覚えていてください。</p><p>2. シリアの教会のために祈ってください。私はそこから縛られてローマへ連れて行かれます。私はそこの信徒たちの中で最も小さい者ですが、神の誉れのために見いだされるにふさわしい者とされました。父なる神と、私たちの共通の希望であるイエス・キリストのうちに、お元気で。</p>
    references: |-
      <ol><li><p>エフェソの教会は、イグナティオスが護送の途中でスミルナに着いたとき、主教オネシモ、輔祭ブッロス、クロコス、エウプロス、フロントンを遣わして彼を見舞いました（<a href="#HH-1">1章</a>、<a href="#HH-2">2章</a>、<a href="#HH-21">21章</a>）。この手紙でイグナティオスはその愛に感謝し、心を一つにして主教と司祭団に従うこと（3–6章）、偽りの教えを避けること（7–10章）を勧め、キリストの受肉と受難の神秘について語ります。手紙はスミルナで書かれました（<a href="#HH-21">21:1</a>）。</p></li><li><p>ギリシア語 Θεοφόρος —「神を担う者」。イグナティオス自身は、同じ語をすべてのキリスト者に用いています（<a href="#HH-9">9:2</a>）。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/ef/1/#L4-5">エフェ. 1:4-5</a>、<a href="https://bibleox.com/ja/jp-ni/ef/1/#L11">エフェ. 1:11</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/act/20/#L28">使. 20:28</a> 参照。イグナティオスはキリストを「私たちの神」と呼び（序、<a href="#HH-18">18:2</a>）、その血を「神の血」と言います。</p></li><li><p>キリストの名（キリスト者という名）のために。</p></li><li><p>イグナティオスは、殉教によってこそ真の弟子となると考えています（<a href="https://bibleox.com/ja/ja/w/Ig1R_ローマの教会への手紙#HH-4">『ローマの教会への手紙』4:2</a>、<a href="https://bibleox.com/ja/ja/w/Ig1R_ローマの教会への手紙#HH-5">『ローマの教会への手紙』5:3</a>）。一部の写本や古代訳（ロシア語訳・英訳もこれに従う）は、ここに「私たちのために御自分を神への供え物、いけにえとして献げた方の」（<a href="https://bibleox.com/ja/jp-ni/ef/5/#L2">エフェ. 5:2</a>）を加えていますが、ギリシア語本文にはありません。</p></li><li><p>「肉において」（ἐν σαρκί）は本サイトのギリシア語本文では抜け落ちていますが、標準的な校訂本（ライトフット、ホームズ）にあります。目に見える主教という意味で、見えない主教であるキリストと対比されています（<a href="https://bibleox.com/ja/ja/w/Ig1M_マグネシアの教会への手紙#HH-3">『マグネシアの教会への手紙』3:1-2</a>、<a href="https://bibleox.com/ja/ja/w/Ig1R_ローマの教会への手紙#HH-9">『ローマの教会への手紙』9:1</a>）。</p></li><li><p>σύνδουλος。イグナティオスは輔祭をこう呼んでいます（<a href="https://bibleox.com/ja/ja/w/Ig1M_マグネシアの教会への手紙#HH-2">『マグネシアの教会への手紙』2章</a>、<a href="https://bibleox.com/ja/ja/w/Ig1F_フィラデルフィアの教会への手紙#HH-4">『フィラデルフィアの教会への手紙』4章</a>、<a href="https://bibleox.com/ja/ja/w/Ig1S_スミルナの教会への手紙#HH-12">『スミルナの教会への手紙』12:2</a>）。</p></li><li><p>ἐξεμπλάριον — ラテン語 exemplarium からの借用語で、「あなたがたの愛を体現する者」の意。</p></li><li><p>ὀναίμην —「益を得たい、喜びとしたい」。主教オネシモ（Ὀνήσιμος「有益な者」）の名にかけた言葉遊びで、パウロもフィレモンへの手紙で同じ言葉遊びをしています（<a href="https://bibleox.com/ja/jp-ni/fm/1/#L20">フィレ. 1:20</a>）。</p></li><li><p>πρεσβυτέριον — 主教のもとにある司祭（πρεσβύτεροι、原義は「長老」）の集まり。イグナティオスの手紙には、主教・司祭・輔祭の三つの位階がはっきりと現れています。</p></li><li><p>一部の訳（ロシア語訳・英訳）はここに「同じ心、同じ思いで固く結び合わされ、皆が同じことを語るように」（<a href="https://bibleox.com/ja/jp-ni/1kor/1/#L10">１コリ. 1:10</a>）を加えていますが、ギリシア語本文にはありません。</p></li><li><p>συνδιδασκαλῖται —「共に学ぶ者」。「共に教える者」と解する訳もあります。</p></li><li><p>ὑπαλειφθῆναι — 競技者が試合の前に油を塗られるように、備えられること。</p></li><li><p>γνώμη —「考え、意向、計らい」。</p></li><li><p>χρῶμα — 音楽用語で「調子、音色」。皆が神の調子を受けて一つになって歌う、というたとえです。</p></li><li><p>一つの祭壇を囲んで主教のもとに集まる教会の交わりのうちに、の意（<a href="https://bibleox.com/ja/ja/w/Ig1M_マグネシアの教会への手紙#HH-7">『マグネシアの教会への手紙』7:2</a>、<a href="https://bibleox.com/ja/ja/w/Ig1T_トラレスの教会への手紙#HH-7">『トラレスの教会への手紙』7:2</a>、<a href="https://bibleox.com/ja/ja/w/Ig1F_フィラデルフィアの教会への手紙#HH-4">『フィラデルフィアの教会への手紙』4章</a>）。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/in/6/#L33">ヨハ. 6:33</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/mf/18/#L19-20">マタ. 18:19-20</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/pr/3/#L34">箴. 3:34</a>（七十人訳による。新共同訳はヘブライ語本文から訳しているため表現が異なる）。<a href="https://bibleox.com/ja/jp-ni/iak/4/#L6">ヤコ. 4:6</a>、<a href="https://bibleox.com/ja/jp-ni/1pet/5/#L5">１ペト. 5:5</a> にも引用されています。</p></li><li><p>自分の権威を主張しない柔和な主教のこと。イグナティオスは沈黙を徳として重んじています（<a href="#HH-15">15:1-2</a>、<a href="https://bibleox.com/ja/ja/w/Ig1F_フィラデルフィアの教会への手紙#HH-1">『フィラデルフィアの教会への手紙』1:1</a>）。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/mf/21/#L33-37">マタ. 21:33-37</a>、<a href="https://bibleox.com/ja/jp-ni/in/13/#L20">ヨハ. 13:20</a>、<a href="https://bibleox.com/ja/jp-ni/mf/10/#L40">マタ. 10:40</a> 参照。</p></li><li><p>γεννητὸς καὶ ἀγέννητος — 人としてはマリアから生まれ、神としては始まりを持たない方、の意。後の神学用語では御子は父から「生まれた」と言われるため、アタナシオス（『教会会議について』47）はこの箇所を γενητὸς καὶ ἀγένητος「（人として）造られた方にして（神として）造られざる方」の意味に解し、正統的な表現であると弁明しています。</p></li><li><p>古代の引用（アタナシオス、テオドレトス）や一部の写本では「肉において来られた神」（ἐν σαρκὶ γενόμενος θεός）。</p></li><li><p>περίψημα — 原義は「拭い取った屑」（<a href="https://bibleox.com/ja/jp-ni/1kor/4/#L13">１コリ. 4:13</a>「すべてのものの滓」）。当時は「私はあなたがたのために身をささげる者」という献身の決まり文句としても用いられました。<a href="#HH-18">18:1</a> にも出てきます。</p></li><li><p>偽りの教師たちがどこから来たのかは示されていません。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/ef/2/#L20-22">エフェ. 2:20-22</a>、<a href="https://bibleox.com/ja/jp-ni/1pet/2/#L5">１ペト. 2:5</a> 参照。石を高みへ引き上げる起重機が十字架、その綱が聖霊にたとえられています。</p></li><li><p>異教の祭りの行列で神像や祠を担いで歩く人々の姿を用いて、キリスト者は自分のうちに神と神殿とキリストを担っていると言っています（<a href="https://bibleox.com/ja/jp-ni/1kor/3/#L16">１コリ. 3:16</a>）。イグナティオス自身の呼び名「テオフォロス」と同じ語です。</p></li><li><p>信じていない人々、迷っている人々のこと。</p></li><li><p>不当な扱いを受けることにおいて主に倣う競争をせよ、の意（<a href="https://bibleox.com/ja/jp-ni/1kor/6/#L7">１コリ. 6:7</a>）。この句を主について言ったものと解し、「だれがこの方以上に不当な扱いを受けたか」と訳す読み方もあります。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/mf/13/#L25">マタ. 13:25</a>、<a href="https://bibleox.com/ja/ja/w/Ig1T_トラレスの教会への手紙#HH-6">『トラレスの教会への手紙』6:1</a>、<a href="https://bibleox.com/ja/ja/w/Ig1F_フィラデルフィアの教会への手紙#HH-3">『フィラデルフィアの教会への手紙』3:1</a> 参照。</p></li><li><p>鎖を装身具の真珠にたとえています。</p></li><li><p>神のもとへと殺されていく者たちはエフェソを通って行きました。パウロもエフェソの長老たちに別れを告げてエルサレムへ向かいました（<a href="https://bibleox.com/ja/jp-ni/act/20/#L17-38">使. 20:17-38</a>）。イグナティオスも今その道を歩んでいます。</p></li><li><p>パウロは多くの手紙でエフェソに触れており（<a href="https://bibleox.com/ja/jp-ni/1kor/15/#L32">１コリ. 15:32</a>、<a href="https://bibleox.com/ja/jp-ni/1kor/16/#L8">16:8</a>、<a href="https://bibleox.com/ja/jp-ni/1tim/1/#L3">１テモ. 1:3</a>、<a href="https://bibleox.com/ja/jp-ni/2tim/1/#L18">２テモ. 1:18</a>、<a href="https://bibleox.com/ja/jp-ni/2tim/4/#L12">4:12</a>）、エフェソの信徒への手紙そのものもあります。</p></li><li><p>εὐχαριστία — 原義は「感謝」。ここでは教会が共に集まって行う聖体（エウカリスティア）の祭儀を指します（<a href="https://bibleox.com/ja/ja/w/Ig1F_フィラデルフィアの教会への手紙#HH-4">『フィラデルフィアの教会への手紙』4章</a>、<a href="https://bibleox.com/ja/ja/w/Ig1S_スミルナの教会への手紙#HH-7">『スミルナの教会への手紙』7:1</a>、<a href="https://bibleox.com/ja/ja/w/Ig1S_スミルナの教会への手紙#HH-8">『スミルナの教会への手紙』8:1</a>）。</p></li><li><p>信仰と愛とが一つに結ばれるところに神がおられる、の意（<a href="https://bibleox.com/ja/jp-ni/1in/4/#L16">１ヨハ. 4:16</a>）。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/mf/12/#L33">マタ. 12:33</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/ps/33/#L9">詩. 33:9</a>（七十人訳では32:9）。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/1kor/3/#L16">１コリ. 3:16</a>、<a href="https://bibleox.com/ja/jp-ni/1kor/6/#L19">6:19</a> 参照。</p></li><li><p>οἰκοφθόροι — 姦淫を行う者たち（<a href="https://bibleox.com/ja/jp-ni/1kor/6/#L9-10">１コリ. 6:9-10</a>）。イグナティオスはこれを、神の家（教会）を損なう偽りの教師たちに当てはめています。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/mf/26/#L7">マタ. 26:7</a>、<a href="https://bibleox.com/ja/jp-ni/mk/14/#L3">マコ. 14:3</a> 参照。</p></li><li><p>悪魔のこと（<a href="https://bibleox.com/ja/jp-ni/in/12/#L31">ヨハ. 12:31</a>、<a href="https://bibleox.com/ja/jp-ni/1kor/2/#L6-8">１コリ. 2:6-8</a>）。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/1kor/1/#L18">１コリ. 1:18</a>、<a href="https://bibleox.com/ja/jp-ni/1kor/1/#L23">1:23</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/1kor/1/#L20">１コリ. 1:20</a> 参照。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/rim/1/#L3">ロマ. 1:3</a>、<a href="https://bibleox.com/ja/jp-ni/2tim/2/#L8">２テモ. 2:8</a> 参照。</p></li><li><p>キリストは御自分の洗礼と受難によって水を聖別し、私たちの洗礼の水とされました。</p></li><li><p>τρία μυστήρια κραυγῆς — 直訳は「叫びの三つの秘義」。神の沈黙のうちに、すなわち永遠の計らいのうちに成し遂げられ、後に全世界に高らかに告げ知らされた秘義、の意。悪魔はキリストの死そのものを知らなかったのではなく、それが神の計らいであることを知らなかったのです（<a href="https://bibleox.com/ja/jp-ni/1kor/2/#L7-8">１コリ. 2:7-8</a>）。</p></li><li><p><a href="https://bibleox.com/ja/jp-ni/mf/2/#L2">マタ. 2:2</a>、<a href="https://bibleox.com/ja/jp-ni/mf/2/#L9-10">2:9-10</a> 参照。</p></li><li><p>イグナティオスはこの書を書くことなく殉教したと考えられています。</p></li><li><p>φάρμακον ἀθανασίας — 聖体のパンのこと（<a href="https://bibleox.com/ja/jp-ni/in/6/#L50-51">ヨハ. 6:50-51</a>、<a href="https://bibleox.com/ja/jp-ni/in/6/#L54">6:54</a>、<a href="https://bibleox.com/ja/jp-ni/in/6/#L58">6:58</a>）。</p></li><li><p>ἀντίψυχον —「身代わりの命」。あなたがたのために自分の命を差し出す、の意（<a href="https://bibleox.com/ja/ja/w/Ig1S_スミルナの教会への手紙#HH-10">『スミルナの教会への手紙』10:2</a>、<a href="https://bibleox.com/ja/ja/w/Ig1P_ポリュカルポスへの手紙#HH-2">『ポリュカルポスへの手紙』2:3</a>、<a href="https://bibleox.com/ja/ja/w/Ig1P_ポリュカルポスへの手紙#HH-6">『ポリュカルポスへの手紙』6:1</a>）。</p></li></ol>
      <p>翻訳：ロジオン・ヴラソフ（AIツールを併用）。底本：ギリシア語本文（<a href="https://bibleox.com/ja/grc/w/ΙγνΘ_Εφ">本サイトのギリシア語版</a>。明らかな脱落はライトフット版・ホームズ版で補った）。参照：ロシア語訳（『初期教会教父選集』ブリュッセル、1988年）、英訳（Roberts–Donaldson）、仏訳（Genoude、1837年）。聖書の引用は新共同訳による。</p>
