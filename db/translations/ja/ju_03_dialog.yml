    title: ユダヤ人トリュフォンとの対話
    meta_desc: ユスティノス（哲学者）とユダヤ人トリュフォンとの対話（エフェソ、135年頃）：旧約聖書の預言からキリストと新しい契約を示し、律法と割礼と安息日の意味を論じる。ギリシア語原文からの翻訳と注。
