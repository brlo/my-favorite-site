    body: |-
      <h2>『対話』について</h2><p>『ユダヤ人トリュフォンとの対話』は、聖ユスティノスがキリスト教の信仰に対するもう一つの敵——ユダヤ教——に向けて行った護教的活動の実りです。ユダヤ教は最初からキリスト教に対して敵意を抱いていましたが、ユスティノスの時代には、その敵意はいっそう強く、残忍なものとなりました。新しい信仰が日ごとに広まって行ったこと、そしてエルサレムの破壊の後にユダヤ人たちが置かれていた政治的な抑圧は、キリストの追随者たち、特に割礼を受けた者たちに対するユダヤ人たちの昔からの憎しみを極度に刺激しました。彼らは会堂の中で、祈りの後に、キリスト者たちに対する荘厳な呪いの言葉を唱え（対話16・47・96・108・117・137章）、彼らの不道徳についての無稽の噂を広めることに最も熱心に加担しました。ユスティノスの言葉によれば、彼らは選ばれた人たちをすべての国々に遣わし、キリスト者たちの新しい教えは無敬虔な異端であると告げ知らせ、異邦人の間にほかの中傷を広めました。ユダヤ人たちは、キリスト者たちを神からの背教者、モーセの律法への裏切り者と見なしていたので、機会さえあれば彼らを死刑に処しようとしていました。ユダヤ人たちがローマ人に対してバル・コクバのもとで蜂起したときも実際そうでしたが、ローマの政府だけがその願いの実行を妨げていました（対話16章）。</p><p>このようなユダヤ教のキリスト教に対する敵対的な態度は、ユスティノスの注意を惹かずにはいられませんでした。教師たちは、ユダヤ人たちがキリスト者たちと交わり、宗教的な対話を持つことを禁じていたにもかかわらず、ユスティノスは哲学者の外套を着て、旅の間に幾度もユダヤ人たちと出会い、その中のより分別ある人たち——たとえばトリュフォンのような人——と、キリスト教と、そのユダヤ教に対する関係について問答を交わしました。ユダヤ教に対するユスティノスの護教的な熱意の文書による記念物は、『ユダヤ人トリュフォンとの対話』として保存されています。</p><p>この著作の真実性は何ら疑いの余地がありません。エウセビオス（カイサリアの）は、ユスティノスの著作の中にユダヤ人たちに反対する対話を帰し、その内容を示し、伝わっている対話にあるのと同じ形の言葉を引用しています（『教会史』4巻18章）。教会史家はこう証言しています。ユスティノスは、ユダヤ人たちに反対する対話も書きました。それは彼がエフェソで、当時のユダヤ人の間で最も名高いトリュフォンと交わしたものです。この対話の中で彼は、神の恵みがどのように彼を信仰の教えへと回帰させたか、以前いかに熱心に哲学の主題に取り組んだか、いかに燃えるような熱意をもって真理を求めたかを語っています。また、ユダヤ人たちがキリストの教えに対して陰謀を企てたことについて語り、次の言葉でトリュフォンにこれを証明しています。あなたたちは自分の悪い業を悔い改めなかったばかりでなく、そのときエルサレムからある人たちを選び、全地に遣わして、無敬虔なキリスト教の異端が現れたと告げ知らせ、わたしたちを知らない人たちが皆繰り返すあの中傷を広めました。こうしてあなたたちは、自分自身の不義においてだけでなく、すべての人たちの不義においても罪を負っています、と。ユスティノスは、預言の賜物が彼の時代にも教会の中で輝いていたことについても書き、ヨハネの黙示にも言及し、それがこの使徒のものであることをはっきりと語っています。さらにいくつかの預言の言葉を挙げ、ユダヤ人たちがそれらを聖書から消し去ったことでトリュフォンを責めています。</p><p>エウセビオスのこの証言は、対話そのものの中に含まれる指示、およびユスティノスに属する諸弁明書との緊密な内的な類縁によって裏付けられます。対話の著者は自分をサマリヤ人と呼び、キリスト教への回帰の前にはプラトンの哲学の追随者であったと語り、以前に書いてローマ皇帝に献げた護教の著作に言及しています（対話2・120章、弁明書第一26章・第二12章参照）——致命者ユスティノスにふさわしい特徴です。これに加えて、対話と諸弁明書との間には、文体や護教の手法と証明だけでなく、著者の同一性を示すいくつかの特異な特徴においても類似があります。たとえば、対話でも弁明書でも福音書は「使徒たちの記録（アポムネーマタ）」と呼ばれており、この呼び方はほかの教会の著者たちには見られません。また、七十人訳や正典の福音書の本文からしばしば外れる旧約・新約の言葉の引用は、弁明書と対話とで互いに似ています。対話の真実性に反対して、その中のある旧約の引用が七十人訳の本文から外れ、ユスティノスより後の時代に生きたテオドティオンやシンマコスの訳に近い形で挙げられているという論拠は、学者たち（クレードナーとゼミッシュ）の説明によって除かれています。すなわち、ユスティノスの手元にあったのは、キリスト教の手によっていくらか整えられた七十人訳の本文であり、そのような本文の見本をテオドティオンとシンマコスも自分たちの著作で用いていた、というものです。</p><p>ここで問われるのは、伝わる聖ユスティノスの対話の中に、トリュフォンというユダヤ人と交わした実際の対話の叙述を見るべきか、あるいは対話の形式は、キリスト教と、そのユダヤ教に対する関係についての思想を叙述するために自由に選ばれた形式であったか、ということです。多くの学者（たとえばルンペ、リュケ、メーラー）は前者を主張し、ほかの人たち（クレリック、デュパン）は後者のほうが可能性が高いと見なしました。しかしエウセビオスは、ユスティノスとトリュフォンとの対話が実際にあったことを証言しています（『教会史』4巻18章）。対話そのものの中で、著者は自分がユダヤ人と交わした対話を叙述する意図を仄めかしています（80章）。真理の道から迷った人たちの回帰に対する聖ユスティノスの熱意——それについて彼自身が第二弁明書の中で証言しています——を考えれば、キリスト教の信仰の利益のために、ユダヤ人たちと対話する機会を求め、見出さなかったとは考えられません。そのような機会の一つが、ユスティノスに対話を書き記すように促したのです。もちろん、この著作は実際の対話の正確な写し、文字通りの再現ではありません。トリュフォンというユダヤ人については確かな情報はありません。エウセビオスは彼を当時のユダヤ人の間で最も名高い人と呼びますが、トリュフォンは名高いラビ、ラビ・アキバの師あるいは同輩であったタルフォと同一人物だという、これに基づく推測は、トリュフォンが対話の中で幾度もユダヤの教師たちに対立させられていること（9・38・62章）によって反駁されます。対話の初めに、トリュフォン自身が自分の身分と生活の状況についていくつかの詳細を語っています。最後の戦争——ユダヤ人とローマ人との間で燃え上がったもの——のとき、彼は自分の祖国を去り、ギリシアに住み着き、おおむねコリントで暮らし、哲学の研究に身を捧げました（1章）。おそらく同じ目的のために、トリュフォンはエフェソにも来ました。エウセビオスの証言によれば、そこで彼とユスティノスとの出会いと対話が行われたのです。</p><p>散歩のとき、ユスティノスの哲学者の外套がトリュフォンの注意を惹きました。トリュフォンは最初の挨拶の言葉の後に、自分も哲学に関心があることを示しました。ユスティノスは、トリュフォンが異邦の賢者たちのもとで、モーセと預言者たちの聖なる書物の中にはるかに完全に、より優れて存在するものを求めていることに驚きを隠さず、自分が哲学の体系を遍歴した後、愛をもってプラトンの哲学にとどまり、しかしある老人との対話を通してその不十分さを知り、キリストとその教えの中に安らぎを見出したことを語りました。ユスティノスのこの最後の告げ知らせがトリュフォンの残念に思う心と、彼の仲間たちの軽率な笑いを引き起こしたとき、ユスティノスはキリスト教の真理と神聖性を証明することに取りかかりました（1-9章）。こうして対話は始まります。夜のために中断された後、それは翌日、夕方まで続きました。著作は、あるマルクス・ポンペイウスに献げられています（8・141章）。142章から成り、多くの中断、離脱、傍らの問い、繰り返しにもかかわらず、序論のほかに三つの部分を含んでいます。第一に、聖ユスティノスは、キリスト者たちがモーセの律法を行わないというトリュフォンの責めに対して、イエス・キリストの到来の後には、旧約の儀礼の律法はその拘束力と意味を失い、新しい律法によって置き換えられたことを証明します（10-47章）。預言者たち（イザヤとエレミヤ）は、すべての人のための、すべての時代の新しい契約の設けを預言しました。それによって、ユダヤ人たちだけに、その心のかたくなさのゆえに与えられた古い契約は取り消されます。罪の赦しはユダヤの洗礼によってではなく与えられ、義は外的な儀礼の業の中ではなく、心の内的な清めの中にあります。ユダヤの割礼は無条件的に必要ではありません。そうでなければ包皮のないままの族長たちが神に喜ばれることはあり得なかったでしょう。安息日、献げ物、供え物についても同じことが言われます。古い律法は新しい律法の型であり、律法の前に生きた人たちも、律法の下に生きた人たちも、キリストを通して救われます。キリストの中で預言者たちのすべての予告が成就しました。キリストの二重の到来は彼らによって告げられました。一つは低められた到来——彼が人々のために苦しんだとき。もう一つは、彼が全き栄光をもって来るとき。それゆえ、イエス・キリストが十字架の上で苦しみと死を受けたことに、何らつまずく必要はありません。第二に、ユスティノスは聖書に基づいて、イエス・キリストの神聖性、その受肉、受難、復活、天への上昇についての教えを叙述し証明します（48-108章）。ここでユスティノスは族長たちへの神の顕現を示します。そこでは神の御使いは、造り主なる神と区別されながら、同時に神性の特性をもって現れます。彼は、火から点火される火という類比によって、父から神の言葉が生まれる神秘を説明し、おとめからのキリストの誕生についてのイザヤの預言（7:14）をくわしく叙述し、モーセの上げられた両手、ヨセフの祝福、木の上に上げられた蛇の中の十字架の前型を明らかにし、詩篇21と預言者ヨナの歴史からキリストの復活を証明します。第三に、ユスティノスは、異邦人たちがキリストの教会に召されることについての預言を挙げて説明し、キリストを信じる人たちが霊的なイスラエルとなったこと、神の約束がすべて彼らに向けられていることを示し、ヤコブの結婚——彼には別の種子が約束されました——、ノアの箱船と彼が子たちに与えた祝福の中の教会の前型を叙述します（109-141章）。</p><p>この論議が終わったとき、トリュフォンは対話のゆえにユスティノスに感謝し、彼らは互いの善意の中で別れました（142章）。対話が書かれた時期を正確に決定することはできませんが、対話そのものから、ユスティノスがそれを弁明書の後に書いたことは見て取れます。同じ時代にほぼ書かれた著作——ヒエラポリスの主教であり雄弁家であったアポリナリスと、ミルティアデスによる、ユダヤ人たちに反対する著作——は伝わっていないので、聖ユスティノスの対話は、キリスト教の護教学の非常に重要な記念物を成しています。その中でユスティノスは、教会の教師たちの中で最初に、キリストとその恵みの御国についての預言と前型を集めて説明しました。彼は弁明書の中でもこれらにかなり取り組みますが、ここではユダヤ人と問答しているので、そのすべてをくわしく叙述しています。なお、この著作では、最初の試みとして当然のことながら、預言的意味を本来持たない旧約の箇所を預言的に解釈する説明に出会います。また、護教家がユダヤ教との闘いの中で、キリストへと導く乳母としての旧約の設けについての使徒パウロの見解を、すべての場所で守り切れなかったことも理解できます。</p><h2>1</h2><p>ある朝、クシストスの並木道を散歩していたとき、ほかの人たちを連れた一人がわたしに出会って言いました。「挨拶します、哲学者よ」。そしてこの言葉の後に、すぐにわたしの方へ向き直り、わたしの隣を歩き始めました。その仲間たちも同じことをしました。わたしも挨拶を返し、何の用件で私のもとにお越しかと尋ねました。</p><p>——コリントのソクラテスの追随者から、アルゴスで聞きました。あなたのような服を着ている人たちを軽んじたり侮ったりしてはならず、あらゆる尊敬を示し、対話を交わるべきだ、と。もしかすると、そのような交わりから、その人に、あるいはわたしに何らかの益があるかもしれません。どちらかが益を受けるなら、両者にとって良いことです。だからこそ、このような服を着た人を見ると、喜んでその人に近づくのです。同じ理由で、今も喜んであなたに話しかけました。そしてこの人たちも、あなたから何か有益なものを聞くことを望んで、わたしについて来ているのです。——とその人は言いました。</p><p>——では、あなたはどなたですか、人間の中で最も優れた方よ。——とわたしは笑いながら言いました。</p><p>彼は率直に自分の名と出身をわたしに語りました。わたしはトリュフォンと呼ばれています、とその人は言いました。わたしは割礼を受けたユダヤ人です。最後の戦争のときに祖国を去り、ギリシアに住み着き、おおむねコリントで暮らしています。</p><p>——では、どうしてあなたは、哲学から、あなたの律の授け方と預言者たちから受け取るほどの益を受け取ることができるのでしょうか——とわたしは尋ねました。</p><p>——なぜできませんか——とその人は答えました。哲学者たちはいつも神について語っているのではありませんか。彼らのすべての論議は、その方の唯一性と摂理を主題としているのではないでしょうか。神性の本性を探究することが、哲学の真の課題ではないでしょうか。</p><p>——もちろん、そのとおりだとわたしたちは考えます——とわたしは言いました。しかし、哲学者たちの多くは、神が一人なのか多数なのか、その摂理がわたしたち一人一人に及ぶのか否かには、まるで関心を持ちません。まるでこの認識が幸福に何ら導かないかのように。彼らはむしろ、神は世界について、しかし一般的にのみ、存在の種と類について摂理され、わたしやあなたや各人について配慮されない——たとえわたしたちが昼も夜も祈り続けても——と証明しようと努めるほどです。彼らのそのような考察が何に向かっているかは容易に理解できます。それは、教師たちにも追随者たちにも、罰を恐れず、神から何らの報いも期待せずに、自分の好きなことをし、好きなことを語る無怖れと自由を与えるのです。そして、いつも同じことが続くであろう——わたしもあなたも、良くも悪くもならずに、今のように再び生きるであろう——と主張する人たちが、何を望み、何を恐れ得るでしょうか。しかし、ほかの人たちは、魂は不死であり無形であるという考えから出発して、悪いことをしたとしても刑罰を受けることはないと考えます。無形のものは苦しみに及ばないからです。そして、魂が不死であるなら、それは神から何も必要としない、と。</p><p>そのときトリュフォンは、心地よい微笑と共に言いました。</p><p>——では、あなたはこのことについてどう考えますか。神についてのあなたの意見は何ですか。あなたの哲学はどのようなものですか。わたしたちに語ってください。</p><h2>2</h2><p>——わたしの考えていることを語りましょう、とわたしは答えました。哲学は真に、神の目に最も偉大で貴重な所有物です。哲学だけがわたしたちを神のもとへ導き、その方に喜ばれる者とするのです。そして、心を哲学に向けている人たちこそ真に聖なるのです。しかし多くの人たちは、哲学が何であるか、どのような目的で人々に送られたのかを会得していません。そうでなければ、プラトン派もストア派もペリパトス派も観想論者もピタゴラス派も存在しなかったでしょう。この知識はただ一つだからです。なぜ哲学が多くの学派に分かれたのか、その理由を今語りましょう。最初に哲学に取り組み、それによって名高いものとなった人たちには、真理を自分で探究しない追随者たちが生じました。彼らは教師たちの勇気と節制に、その教えの新しさと共に感銘を受けただけで、各人が自分の教師から聞いたものを真理として受け取りました。そして彼らは今度は自分の追随者たちに同じような、そしてそれに類する観念を伝え、それぞれ、その教えの祖の名のもとに知られるようになったのです。同じように、わたし自身も、最初にその中の一つを知ろうと望んだとき、ストア派の教師のもとに身を委ねました。しかし彼とかなり長く過ごした後、神についてのわたしの認識は少しも増し加わらなかったので（彼自身それを持っておらず、必要とも考えていなかったのですから）、彼のもとを去り、ペリパトス派と呼ばれる人のもとへ向かいました。彼は自分では利口な人だと思っている人で、わたしの居合わせを数日受け入れ、その後、わたしに報酬を定めるようにと要求しました。それは、わたしたちの対話がわたしたちにとって無益にならないためであると言って。この理由のゆえに、わたしは彼のもとも去りました。彼を哲学者という名にふさわしくない者と考えたからです。しかし、わたしの魂は、哲学の本質であり最も主要な主題であるものを知ることを渇望していたので、自分の智慧を大いに誇る人、名高いピタゴラス派のもとに行きました。わたしが彼の聴講者であり弟子になりたいという望みを告げたとき、彼はわたしに尋ねました。お前は音楽と天文学と幾何学を学んだことがあるか。あるいは、感覚的なものから魂を引き離し、それを知的なものへと整えるもの——魂がその本質において美と善を観想できるようにするもの——に徹底的に取り組んだことがなければ、幸福に導く学問から何かを理解できると考えているのか、と。それから彼は、これらの知識の有益さとその研究の必要性について多くを語り、わたしがそれらを知らないと認めるとすぐに、わたしを送り返しました。当然のことながら、わたしは望みが崩れたことを悲しみました。その人はある程度の知識を持つ人だと考えていたのですから。しかし一方で、それらの学問のためにどれほど多くの時を費やさなければならないかを考えて、わたしは長い延期に決心を下しませんでした。この困難の中で、プラトン派も試してみようという考えがわたしに浮かびました。彼らも大いなる名声を享受していたからです。名高いプラトン派の中の一人、分別ある人が、つい最近わたしたちの都に来ました。彼とわたしは長く取り組み、わたしは向上し、日ごとに速やかな進歩を遂げました。無形のものについてのプラトンの教えはわたしを強く魅了し、イデアの理論はわたしの思考に翼を与えました。まもなく、わたしは智者になったように見え、自分の無分別の中で、まもなく神そのものを観想できると望みました。プラトンの哲学の目的はまさにそれだからです。</p><h2>3</h2><p>このような心の状態の中で、ある日、深い静けさに身を委ね、人間の痕跡から一切遠ざかることが決されたとき、わたしは海の近くのある場所へ向かいました。わたしが自分自身と独りになりたいと思ったその場所に近づいたとき、姿かたちも立派で、心地よさと威厳のある身のこなしを備えた、年老いた老人が、わたしから遠くない距離でついて来るのが見えました。彼の方に向き直り、わたしは足を止めて、彼をじっと見つめました。</p><p>——わたしを知っていますか——とその人は尋ねました。</p><p>——いいえ——とわたしは言いました。</p><p>——では、なぜわたしを見つめるのですか——とその人は言いました。</p><p>——あなたが同じ場所でわたしに出会ったことに驚いています——とわたしは答えました。ここで人間の誰かに会うとは予期していませんでした。</p><p>——わたしは家の者たちのうちのある人たちのことが心配なのです——とその人は答えました。彼らは出かけて行ったので、わたしはここに来て、どこからか現れないかと見ているのです。ところであなたはなぜここにいるのですか。</p><p>——わたしは、心を何物にも妨げられず、中断を恐れずに自分自身と対話できる散歩を愛しています——とわたしは言いました。これらの場所は知的な営みに大変適しています。</p><p>——では、あなたは知的考察の愛好者であって、業と真理の愛好者ではないのですね。より活動的な智者になろうと努めるのであって、ソフィストにはならないのですね——とその人は言いました。</p><p>——それでは、理性が万物を支配していること、そして理性を自分の支えとし、それによって支えられている人が、ほかの人たちの迷いと志向を見て、彼らが健全なことを何も行わず、神に喜ばれることを何も行っていないのを見ることができる、ということを証明する営みのほかに、何がより優れているでしょうか——とわたしは答えました。哲学と健全な理性なしには、誰も智慧を持つことはできません。それゆえ、すべての人は哲学すべきであり、これを最重要で最も優れた業とし、ほかのことを第二、第三とするべきです。そして、何かが哲学と共に行われるなら、それは適度に、尊敬に値する仕方で行われます。しかし哲学なしには、それに取り組む人たちにとって害があり卑しいものです。</p><p>——それでは、哲学は幸福をもたらすのですか——とその人は尋ねました。</p><p>——まさにそのとおりです——とわたしは言いました。そして哲学だけが。</p><p>——しかし哲学とは何でしょうか。それはどのような幸福をもたらすのですか。妨げるものが何もなければ、わたしに語ってください——とその人は言いました。</p><p>——哲学とは、存在するものについての知識であり、真理の認識です——とわたしは答えました。そして幸福とは、この知識と智慧の報いです。</p><p>——では、あなたは何を神と呼ぶのですか——とその人は尋ねました。</p><p>——常に同じものであるままであり、ほかの存在の存在の原因であるものこそ、真に神です。これが老人へのわたしの答えでした。そして彼はそれを喜んで聞きました。それから彼は再びわたしに尋ねました。</p><p>——知識というのは、異なる物たちのための共通の呼び名ではありませんか。すべての技術において、その中の一つに通じた人は知り手と呼ばれます。軍を率いる技術、航海術、医術のように。しかし、神に属するものと人間に属するものに関しては同じではありません。神に属するものと人間に属するものについて、また、それらの中の神聖なものと正義あるものについて、わたしたちに認識を与える知識はあるでしょうか。</p><p>——もちろんあります——とわたしは答えました。</p><p>——どのようなものでしょうか。わたしたちが音楽や算術や天文学などを知り得るのと同じように、神と人を知ることができるでしょうか。</p><p>——決してできません——とわたしは言いました。</p><p>——それなら、あなたはわたしの問いに不当に答えました——とその人は反論しました。なぜなら、ある知識はわたしたちが経験や考察を通して獲得するものであり、ある知識は観ることによって受け取られるものだからです。もし誰かがあなたに言ったなら——インドには、ほかのすべてのものとは本性において異なる、しかしこのような、あるいはあのような、多様で色とりどりの動物がいる、と——あなたはそれを見ない限り、それについての知識を持たず、目撃者から聞かない限り、それについて何も語ることができないでしょう。</p><p>——もちろんそのとおりです——とわたしは答えました。</p><p>——それなら、哲学者たちは、どうして神について正しく考えること、あるいは語ることができるのでしょうか。彼らは神についての知識を持たず、その方を見ず、その方についても聞いていないのですから——とその人は尋ねました。</p><p>——もちろん、父なる方よ——とわたしは答えました。神性は、ほかの生きているものたちのように目で見られるものではありません。それはただ、プラトンが語るように、知性によって把握されます。そしてわたしはそのことを信じています。</p><h2>4</h2><p>——しかし、わたしたちの知性の中には、以前に感覚を通して知らされていないものを把握するほどの本性と規模を持つ力があるのでしょうか。あるいは、聖なる霊によって教えられなければ、人の知性は神を見ることになるのでしょうか——とその人は尋ねました。</p><p>——プラトンは、これが知性の眼である、そしてそのためにわたしたちに与えられたのだと語っています。すなわち、それが清いとき、わたしたちはそれを通して、真に存在するものを観想できるというのです。それは、知性によって把握されるすべてのものの泉であり、色も、形も、大きさも、目に見えるものは何も持たず、自己自身と同一の存在であり、あらゆる本質を超える、語り難い、説明し難い唯一の、美しく善いものです。そしてそれは、類縁と、その方を見たいという望みのゆえに、高貴な魂たちの中に突然現れるのです——とわたしは答えました。</p><p>——それでは、わたしたちは神との間にどのような類縁を持っているのでしょうか。まさか、魂も神聖で不死であり、あの至高の知性の一部分なのでしょうか。その知性がそのように神を見るように、わたしたちもまた、わたしたちの知性によって神性を把握し、それによってすでに至福に至るのでしょうか——とその人は尋ねました。</p><p>——まさにそのとおりです——とわたしは言いました。</p><p>——すべての動物の魂もその方を把握するのでしょうか。それとも、人の魂は一つの類のものであり、馬やロバの魂は別の類のものなのでしょうか——とその人は尋ねました。</p><p>——いいえ——とわたしは答えました。魂はすべての中で同じです。</p><p>——それなら、馬たちもロバたちも神を見るのでしょうか。あるいは、いつかその方を見たことがあるのでしょうか——とその人は言いました。</p><p>——いいえ——とわたしは答えました。人間の中でもほんのわずかの人たちだけがその方を見ます。ただ正しく生きた人たちだけ、正義とあらゆる徳によって清められた人たちだけです。</p><p>——それなら、人はその方との類縁のゆえに、あるいは知性を持っていることのゆえにではなく、節制と正義があることのゆえに、神を見るのですね——とその人は反論しました。</p><p>——はい、そうです——とわたしは言いました。そのうえ、その方について考える能力を授けられていることのゆえにでもあります。</p><p>——では、山羊や羊たちは誰かを神と拝するのでしょうか——とその人は言いました。</p><p>——誰も——とわたしは言いました。</p><p>——あなたの論じ方では、これらの動物たちも神を見るのでしょうか——とその人は尋ねました。</p><p>——いいえ、それらの体がそれを妨げるようなものだからです。</p><p>——もしこれらの動物たちが語ることができたなら、それらは、より正義をもって、わたしたちの体を責めるでしょう、と確信しなさい。しかし今はこれを許し、あなたの言うとおりにしておきましょう。それなら、わたしに言いなさい。魂は、体の中にあるときに神を見るのでしょうか、それとも体から解放されるときにそうするのでしょうか——とその人は言いました。</p><p>——人間の形のうちに存在している間にも、魂は知性によって神を観想できます。しかしそれは特に、体から離れて独立に存在するときに、それが全体的に、常に愛していたものに至るのです——とわたしは言いました。</p><p>——魂は、再び人の体と結び合わされるとき、それを覚えているのでしょうか——とその人は尋ねました。</p><p>——そうは思いません——とわたしは言いました。</p><p>——それなら、神を見た魂にとって何の益があるでしょうか。その方を見た人は、その方を見なかった人に対して、魂がその方を見たことさえ覚えていないなら、どのような優位を持っているのでしょうか——とその人は言いました。</p><p>——言い得ません——とわたしは答えました。</p><p>——そして、この観りにふさわしくないと認められた人たちは、何を受けるのでしょうか——とその人は尋ねました。</p><p>——彼らは、ある動物たちの体の中に、まるで牢の中に投げ込まれます。そしてこれが彼らの刑罰です——とわたしは言いました。</p><p>——彼らは、まさにこのことのゆえにこのような体の中に投げ込まれたこと、そして罪を犯したことを知っているのでしょうか——とその人は尋ねました。</p><p>——そうは思いません。</p><p>——これらの魂にとっては、刑罰から何の益もないように見えます。そして、刑罰を自覚しないなら、彼らが刑罰を受けているとは言えないでしょう——とその人は言いました。</p><p>——もちろん、できません。</p><p>——それなら、魂たちは神を見ませんし、ほかの体たちへと移りません。そうでなければ、彼らは自分がこのように刑罰を受けていることを知り、その後、最も軽い罪さえ犯すのを恐れたでしょう。しかしわたしは、魂たちには、神が何であるか、そして正義と敬虔が善であることを理解する能力があることは認めます——とその人は続けました。</p><p>——正当なことを言っています——とわたしは言いました。</p><h2>5</h2><p>——そしてこれらの哲学者たちは、このような事柄については何も知りません。魂が何であるかさえ語ることができないのですから。</p><p>——それは不当に見えます。</p><p>——そうでなければ、魂を不死と呼ぶべきではありません。魂が不死であるなら、始まりもないはずです。</p><p>——あるプラトン派の人たちの考えでは、魂は始まりがなく不死です。</p><p>——そして、世界そのものも始まりがないとあなたは呼ぶのですか。</p><p>——ある人たちはこれを主張しますが、わたしは彼らに同意しません。</p><p>——正当なことをしています。なぜなら、あれほどの堅さと抵抗力を持ち、複合的で変化する、日ごとに壊れ、日ごとに新しくなる体が、ある原因なしに生じたと考える根拠がどこにあるでしょうか。しかし、もし始まりを持つなら、魂たちも必然的に始まりを受け取り、存在し尽くすことがあり得ます。それらは人とほかの動物たちのために造られたのですから。たとえ、あなたの考えるように、体と共にではなく別々に生じたとしても。</p><p>——それは正しいように見えます。</p><p>——それなら、魂たちは不死ではありません。</p><p>——いいえ、世界そのものが、わたしたちが見たとおり、始まりを受け取ったからです。</p><p>——しかし同時に、わたしは、魂たちが消滅するとは主張しません。それは悪い人たちにとって大いに有利なことでしょうから。それでは、彼らはどうなるのでしょうか。敬虔な人たちの魂はより良い場所にあり、悪い無法な人たちの魂はより悪い場所にあり、ここで裁きの時を待っています。それゆえ、神を見るにふさわしいと認められた人たちは、もはや死にません。そしてほかの人たちは、神が望まれる限りにおいて、存在し刑罰を受けます。</p><p>——あなたは何を言っているのですか。それは、プラトンが『ティマイオス』の中で世界について教えるのと同じことではありませんか。すなわち、世界は始まりを受け取ったゆえに破壊され得るのですが、しかし破壊されず、死の運命に服しません。神がそのように望まれるからです、と。魂についても、そして一般にすべての物についても、これと同じことが当てはまるとは思いませんか。なぜなら、神の後に存在する、あるいは存在するであろうすべてのものは、朽ちる本性を持ち、破壊され消滅し得るからです。ただ神だけが、始まりがなく、破壊され得ない方です。そのことのゆえにこそ、その方は神なのです。そして、その方の後のすべてのものは、始まりを持ち、破壊に服します。それゆえ、魂たちは死すべきものであり、刑罰に服します。魂たちが始まりのないものであるなら、罪を犯さず、愚かさに染まらず、臆病になったり勇ましくなったりせず、豚や蛇や犬の中へと自発的に移り住むこともなく、それに強制されることもあり得なかったでしょうから。始まりのないものだけが、始まりのないものと似ており、それと同一です。そして一方を、力においても、名誉においても、他方より高く置くことはできません。それゆえ、多くの始まりのない存在が存在することは不可能です。その間に何らかの差異があるなら、どれほど探しても差異の原因を見出し得ないからです。しかし、すべてのものの上に思想を無限に広げれば、すべての苦労の後に、ついに一つの始まりのないものの上に立ち止まり、これを万物の原因と呼ぶことになるでしょう。プラトンもピタゴラスも——わたしたちにとって哲学の壁であり砦となった智者たち——これを知らなかったのでしょうか。</p><h2>6</h2><p>——わたしにとっては、プラトンもピタゴラスも——そして彼らの考えを分かつ、ほかの誰も——どうでもよいことです——と老人は答えました。しかし真理は次のとおりです。あなたはこのことからこれを知るでしょう。魂はそれ自体が命であるか、あるいは命を受け取るだけであるか、どちらかです。魂が命であるなら、それは自分自身ではなく、ほかの何かを生かすことになります。ちょうど運動が、自分自身よりも、むしろほかの何かを動かすように。しかし、魂が生きていることを否定する人はいないでしょう。もし生きているなら、命であるからではなく、命に与っているからです。何かに与っているものは、それが与っているものとは異なるのです。魂は命に与っています。なぜなら、神が魂が生きることを望まれるからです。そしてそのゆえに、いつか命が絶えることがあり得ます。神が、もはや生きないことを望まれるなら。命であることは魂に固有ではなく、神に固有だからです。しかし、人が常に存在するわけではなく、人の体が常に魂と結び合わされているわけではないように、その結び付きが解かれるべきときに、魂は体を去り、人はもはや存在しません。同じように、魂から、もはや存在すべきでないときに、命の息吹が取り去られ、魂はもはや存在せず、自分が取り去られた同じところへと帰って行くのです。</p><h2>7</h2><p>——では、人はどの教師を信頼すべきでしょうか。あるいは、どこから助けを期待すべきでしょうか。これらの哲学者たちの中にも真理がないのですから——とわたしは尋ねました。</p><p>——かつて、これらの哲学者とされる人たちの誰よりもはるかに古い人たちがいました——と老人は言いました。彼らは至福ある人たち、正しい人たち、神に喜ばれた人たちであり、聖なる霊によって語り、今日成就している将来のことを預言しました。彼らは預言者たちと呼ばれています。彼らだけが真理を人々に呼びかけ、告げ知らせました。誰に対しても憚らず、栄誉に引きずられず、ただ聖なる霊に満たされていたときに聞き、見たことを語りました。彼らの書物は今日も存在しています。そして、それらを信仰をもって読む人は、万物の始まりと終わりについて、また哲学者が知っておくべきことについて、多くの教えを受け取るでしょう。彼らは自分の語りの中で証明に訴えませんでした。なぜなら、それらの言葉はあらゆる証明を超え、真理の確かな証人だからです。すでに成就した出来事、そして今成就しつつある出来事そのものが、彼らの証言を受け入れることを強います。また、彼らが行った奇跡のゆえに、彼らは信じられるに値します。彼らは万物の造り主、父である神を栄光に包み、その方から遣わされたキリスト、その子について告げ知らせたからです。しかし、偽りの預言者たちは、偽りの霊と穢れの霊に満たされて、これを行いませんでしたし、行っていません。彼らはむしろ、人々を驚かせるためにある奇跡を行うことを敢えてし、偽りの霊たちと霊たちの栄誉を広めます。しかし、あなたはまず何よりも、光の門があなたに開かれるようにと祈りなさい。この事柄は、神とそのキリストが理解を与えてくださらなければ、誰にも見ることも理解することもできないのですから。</p><h2>8</h2><p>これらのことと、今繰り返すには時でないほかの多くのことを語って、老人は去りました。彼は、その言葉について熟考するようにとわたしに助言しながら。そしてわたしは、彼を二度と見ませんでした。しかし、わたしの心の中にすぐに火が燃え上がり、預言者たちへの愛、そしてキリストの友であるあの人たちへの愛がわたしを包みました。そして彼の言葉について自分自身と熟考しながら、わたしは、この哲学こそ唯一の、堅固で有益な哲学であることを見ました。このようにして、わたしは哲学者になりました。わたしは、すべての人がわたしと同じ考えを持ち、救い主の教えから背かないでいてくれたらと願います。それはある恐れを心に注ぎ、真の道から迷った人たちを打つ力を持つと共に、その教えに従って生きる人たちにとって、最も甘美な安らぎとなっているからです。それゆえ、もしあなたが自分自身のことを少しでも気にかけていて、自分の救いを望み、神に望みを置いているなら、あなたは今、労苦を忌み避けないならば、キリストなる神を知り、完全な弟子となって、至福に至ることが容易にできます。これらの言葉のとき、わたしの最も親愛なる人よ、トリュフォンの仲間たちは笑いました。そしてトリュフォン自身が微笑んで言いました。</p><p>——あなたが語ったことの中の何かは、わたしも認めます。そして神聖なものへのあなたの熱意に驚いています。しかし、偽りの言葉に惑わされ、何の値打ちもない人たちに従うよりも、プラトンの哲学かほかの誰かの哲学に従い、忍耐と節制と貞潔の労苦のうちに生きるほうが、あなたのためであったでしょう。もしあなたがあの哲学の原理に忠実であり続け、非難されない生き方をしていたなら、より良い分についての望みがまだ残っていたでしょう。しかし今、あなたは神を捨て、自分の望みを人に置きました。あなたのためにどんな救いの手段が残っているでしょうか。それゆえ、もしあなたがわたしの言うことを聞きたいなら（わたしはすでにあなたを友人として見ていますから）、まず割礼を受け、その後に、律法されたとおりに、安息日と祭りと神の新月の祭りを守り、一般に、律法の中に書かれていることをすべて行いなさい。そうすれば、おそらく、神から憐みがあなたにあるでしょう。キリストについては、もしその方が生まれてどこかにいるとしても、その方はほかの人たちにとっては知られず、自分自身をも知らず、何らの力も持っていません。エリヤが来て、その方に油を注ぎ、その方をすべての人に告げ知らせるまでは。しかし、あなたたちキリスト者たちは偽りの噂を受け入れ、あるキリストを思い描き、その方のゆえにこれほど無分別にも自分の生を滅ぼしているのです。</p><p>——あなたには赦しのあることです、人よ——とわたしは答えました。そしてこれが赦されるように。あなたは自分の知らないことを言っており、聖書を理解しない教師たちに従い、思い浮かぶことを闇雲に語っているのですから。しかし、もしあなたが、わたしたちが迷いに引きずり込まれてはおらず、キリストを告白し続けることを、たとえそのために人々からあらゆる辱めが降りかかろうとも、最も残酷な専制者が離れるようにと強いようとも、証明することを望むなら——ここにとどまるなら、わたしはあなたに証明しましょう。わたしたちは、空しい神話を、証明のない言葉を信じたのではないことを。聖なる霊に満たされ、力と恵みに富む教えを信じたのだということを。</p><h2>9</h2><p>これに対して、トリュフォンの仲間たちは再び笑い、ふさわしくない叫びを上げました。そこでわたしは立ち上がって、彼らのもとから去ろうとしました。しかしトリュフォンはわたしの服をつかみ、わたしが自分の約束を果たさない限り、わたしを離さないと言いました。</p><p>——それなら、あなたの仲間たちに、そのように騒ぎ立ててふさわしくない振る舞いをしないようにと言いなさい。聞きたいなら、静かに聞かせなさい。あるいは、もっと重要な用件があるなら、わたしたちのもとを去らせなさい。そしてわたしたちは、歩き、休みながら、対話を続けましょう——とわたしは答えました。</p><p>トリュフォンはこの提案に同意しました。そしてわたしたちは彼と共にわきへと行くことにし、クシストスの真ん中の広場に到着しました。彼の仲間たちのうちの二人は、わたしたちの熱意を笑いながら、そこを離れました。わたしたちが、両側に石の腰掛のある場所に着いたとき、トリュフォンの仲間たちは反対側に座って、彼らの中の一人が持ち出した、以前のユダヤの戦争について語り合い始めました。</p><h2>10</h2><p>彼らが語り終えたとき、わたしは再び彼らに向かって語り始めました。</p><p>——皆さん、あなたたちはわたしたちを何について責めているのですか。律法に従って生きないことについてですか。あなたたちの父たちのように肉を割礼しないこと、あなたたちのように安息日を守らないことですか。それとも、わたしたちの生き方と品性を非難しているのですか。すなわち、わたしたちが人の肉を食べ、宴の後に灯し火を消し、無法な交わりに身を委けるという中傷を、あなたたちも信じたのでしょうか。それとも、わたしたちがこのような教えに従い、あなたたちの考えでは偽りである思想を抱いていることだけを責めているのですか。</p><p>——後者のことがわたしには驚くべきことです——とトリュフォンは言いました。しかし、多くの人たちがあなたたちについて上げている中傷については、それは人の本性に反するので、信じるに値しません。しかし、いわゆる福音書の中にある、あなたたちの規範は、わたしの考えるには、誰にも行い得ないほど偉大で驚くべきものです。わたしはそれらを読むように努めました。しかし特にわたしたちを当惑させるのはこれです。あなたたちは自分の敬虔を打ち出し、自分たちをほかの人たちよりも優れた者と考えています。しかしその生き方においては、彼らと何ら異ならず、異邦人たちを超えていません。あなたたちは祭りも安息日も守らず、割礼を持たず、自分の望みを十字架につけられた人に置きながら、それでも、神の命令を行わずに、神から善いものを受け取ることを望んでいるのです。あなたは読まなかったのですか。「第八日のうちに割礼を受けない魂は、その民の中から滅ぼされるであろう」と。この命令は、異邦人にも、金で買われた者たちにも及びます。しかし、あなたたちはこの契約を、その後の命令と共に軽蔑しました。それでも、神を知っていると、わたしたちを説き聞かせようとしています。神を恐れる人たちが行う義務の中の一つも行わずに。もしあなたがこのことで自分を守り、律法を守らないのに、わたしたちが何かを望み得る仕方をわたしたちに示すことができるなら、わたしたちはそれをあなたから大きな喜びをもって聞くでしょう。そしてそのとき、同じ仕方でほかのことも探究することができます。——とトリュフォンは言いました。</p><h2>11</h2><p>——トリュフォンよ、わたしたちが見るすべてのものを造り整えた方のほかには、今も昔も、常に他の神は存在しません——とわたしは彼に語り始めました。そして、ある神がわたしたちの神で、別の神があなたたちの神であるのではなく、同じ神を認めます。その方は堅い腕と高い腕であなたたちの父たちをエジプトの地から連れ出された方です。わたしたちは、あなたたちが望みを置いている方——アブラハムの神、イサクの神、ヤコブの神——のほかには、ほかの誰に望みを置きません。ほかに存在しないのですから。しかし、わたしたちの望みはモーセを通してでも、律法を通してでもありません。そうでなければ、あなたたちとわたしたちの間に差異はなかったでしょう。しかしトリュフォンよ、わたしは読みました。いつか最後の律法と、ほかのすべてのものよりも堅い契約が来るべきであり、神の遺産を受け取ろうと望むすべての人たちがそれを守るべきである、と。ホリブにおいて与えられた律法は、すでに古い律法であり、あなたたちユダヤ人たちだけのためのものです。しかしわたしが語っているものは、一般にすべての人のためのものです。律法の上に置かれた新しい律法は最も古いものを取り消し、後の契約は同じように前の契約を無効にします。わたしたちには、永遠の完全な律法と確かな契約が与えられています。それはキリストです。その方の後には、もはや律法も、設けも命令もありません。イザヤが何を語っているか、あなたは読まなかったのですか。「わたしに聞け。わたしの民よ、わたしに聞け。わたしに注意を向けよ、民の君主たちよ。わたしから律法が出て、わたしの裁きは民の光として出るであろう。わたしの義は速やかに近づき、わたしの救いは出て行くであろう。そして民たちはわたしの腕に望みを置くであろう」（<a href="https://bibleox.com/ja/jp-ni/is/51/#L4">イザ. 51:4-5</a>）。そしてこの新しい契約について神はエレミヤを通して言われます。「見よ、日々が来る、と主は言われる。そしてわたしはイスラエルの家とユダの家のために新しい契約を結ぶ。それは、わたしが彼らの手を握ってエジプトの地から連れ出すために、彼らの父たちと結んだその日の契約とは異なる」（<a href="https://bibleox.com/ja/jp-ni/ier/31/#L31">エレ. 31:31-32</a>）。それゆえ、神が新しい契約を結ぶことを、しかもそれが民のための光となる契約であることを前もって告げておられ、わたしたちは見て確信するなら——この十字架につけられたイエス・キリストという名によって、人たちが偶像礼拝とほかの不義から神へと立ち帰り、死に至るまで自分の告白の中に留まり、敬虔を守るという事実と、それに伴う奇跡から、すべての人が理解できます。その方こそ新しい律法であり、新しい契約であり、すべての民の中から神からの善いことを待ち望んでいた人たちの望みであることが。そして、この十字架につけられたキリストを通して神のもとに引き寄せられたわたしたちは、真の霊的イスラエルであり、ユダの、ヤコブの、イサクの、アブラハムの家系です。アブラハムは、割礼の中で、自分の信仰のゆえに神から証しと祝福を受け、多くの民の父と呼ばれました。これは、わたしの論議の後の部分で証明されるでしょう。</p><h2>12</h2><p>さらにわたしは、イザヤのほかの言葉を加えました。そこで彼は叫びます。「わたしの言葉に聞け。そうすればあなたの魂は生きる。わたしはあなたたちと永遠の契約を結ぶ。ダビデへの確かな恵みの契約を。見よ、わたしはこれを民への証しとして与える。……あなたを知らない民たちがあなたを呼び求め、あなたを知らない民があなたのもとに走り寄る。あなたの神、イスラエルの聖なる方のゆえに。その方があなたを栄光に包まれるからである」（<a href="https://bibleox.com/ja/jp-ni/is/55/#L3">イザ. 55:3-5</a>）。この律法そのものをあなたたちは軽蔑し、その新しい聖なる契約を退けました。そして今もそれを受け入れず、自分の悪行を悔い改めません。「あなたたちの耳は閉じられ、あなたたちの目は失明し、あなたたちの心は肥え太っています」（<a href="https://bibleox.com/ja/jp-ni/is/6/#L10">イザ. 6:10</a>）。そしてエレミヤは高らかに告げ知らせましたが、あなたたちは聞きません。律の授け方が来られましたが、あなたたちはその方を見ません。貧しい人たちは福音を告げ知らせ、盲人は見ます。しかし、あなたたちは理解しません。もう第二の割礼が必要になっていますが、あなたたちは自分の肉の割礼について多く考えます。新しい律法は、常に守るべき安息日を守るようにとあなたたちに命じています。しかし、あなたたちは一日に留まって、この命令がなぜあなたたちに与えられたのかを考えずに、自分が敬虔だと考えます。さらに、種なしパンを食べるなら、神の御心を成し遂げたと言いますが、わたしたちの主なる神はこれによって喜ばれるのではありません。あなたたちの中の誰かが、誓いを破ることや盗みにおいて罪あるなら、もはや罪を犯しませんように。姦淫する人なら、悔い改めなさい。そうすれば、その人は神の真の、喜ばれる安息日を守ることになります。穢れた手を持つ人がいるなら、洗いなさい。そうすれば清くなるでしょう。</p><h2>13</h2><p>もちろん、イザヤはあなたたちを、殺人とほかの罪からあなたたちを清めるために沐浴に送ったのではありません。海のすべての水をもってしても、それらを洗うことはできません。しかし、彼はふさわしい仕方で、そのときすでに、悔い改める人たちに属する、あの救いの洗礼を告げ知らせていたのです。彼らは、山羊や羊の血によって、あるいは雌牛の灰によって、あるいは小麦の粉の供え物によってではなく、キリストの血と死を通して——その方がまさにそのために死なれたのです——信仰によって清められる人たちです。イザヤはこのことについてこう語っています。「主はすべての民の目の前で、その聖なる腕を明らかにされるであろう。そして地のすべての果ては、神の救いを見るであろう。離れよ、離れよ、離れよ、そこから出て行け。穢れに触れるな。その中から出て行け。主の器具を運ぶ者たちよ、清めよ。あなたたちはとり乱して行くのではないからである。主があなたたちの前を歩み、イスラエルの神があなたたちを集められるからである。見よ、わたしの僕は知恵に満ち、大いに高められ、上げられ、あがめられるであろう。多くの人があなたを見て驚くように、あなたの姿は人々の前で辱められ、あなたの栄光は人々から隠される。そうして多くの民が驚き、王たちは口を閉ざすであろう。彼について告げ知らせなかった人たちは見るであろうし、聞いたことのない人たちは会得するであろう。主よ、誰がわたしたちの耳に聞いたことを信じましたか。主の腕が誰に現されたでしょうか。わたしたちは彼の前で、幼い子として、飢えた地の中の根として告げ知らせました。彼には見た目もなく、美しさもありませんでした。彼の姿は、人の子たちの姿よりも辱められ、軽蔑されていました。彼は打たれた人間であり、病を耐え忍ぶことを知っています。その顔が背けられ、辱められ、軽蔑されたからです。彼はわたしたちの罪を担い、わたしたちのために苦しみます。それなのにわたしたちは、彼が病の中にあり、打たれ、苦しんでいると見なしました。彼はわたしたちの罪のゆえに刺し貫かれ、わたしたちの不義のゆえに打たれ、わたしたちに平安をもたらす懲らしめが彼の上にあり、彼の傷によってわたしたちはいやされました。わたしたちは皆、羊のように迷い、各人が自分の道を歩き回りました。そして主は、わたしたちの罪のゆえに彼を渡された。彼はその苦しみのために口を開きません。羊のように屠りに引かれ、毛を刈る者の前で黙る小羊のように、彼は口を開きません。彼の謙虚さのゆえに、彼から裁きは取り去られました。しかし、彼の由来を誰が語り得ましょうか。彼の命は地から取り去られたからです。民の無法のゆえに彼は死に渡されました。わたしは悪い者たちを彼の墓の代わりに与え、富める者たちを彼の死の代わりに与える。彼は無法を行わず、その口に偽りが見出されなかったからです。主は彼をその傷から清めることを喜ばれます。あなたたちが彼を罪のための献げ物として与えるなら、あなたたちの魂は長く続く子孫を見るであろう。主は苦しみから彼の魂を救い出すことを望まれ、彼に光を示し、知恵をもって彼を形造り、多くの人に益をもたらした正しい人を正しい者とされるであろう。そして彼はわたしたちの罪を担うであろう。それゆえ、彼は多くの人を相続し、力ある者たちの獲物を分ける。彼の魂が死に渡され、無法者たちの中に数えられ、多くの人の罪を担い、彼らの無法のゆえに渡されたことのゆえに。喜べ、産みつけなかった不妊の女よ。歓呼の声を上げよ、産みの苦しみを知らなかった女よ。夫を持つ女よりも、独り寂しい女のほうが、はるかに多くの子を持つからである。主は言われる。あなたの幕屋の場所を広げ、あなたの幕の支えを広げよ。惜しまずに広げよ、あなたの綱を長くし、あなたの杭を堅くせよ。右にも左にも広げよ。あなたの子孫は民を遺産として受け取り、あなたは廃虚となった都を満たすであろう。辱められたことを恐れるな。責められたことに心を乱されるな。あなたは永遠の恥を忘れ、あなたのやもめの非難を覚えることはないでしょうから。主は自分の名を得られたからです。そしてあなたの救い主、イスラエルの神そのものが、全地において呼ばれるであろう。主はあなたを、夫に捨てられ、魂を失った女のように、若いときに憎まれた女のように召されたのですから」（<a href="https://bibleox.com/ja/jp-ni/is/52/#L10">イザ. 52:10-12</a>、<a href="https://bibleox.com/ja/jp-ni/is/52/#L13">イザ. 52:13-15</a>、<a href="https://bibleox.com/ja/jp-ni/is/53/#L1">イザ. 53:1-12</a>、<a href="https://bibleox.com/ja/jp-ni/is/54/#L1">イザ. 54:1-6</a>）。</p><h2>14</h2><p>それゆえ、悔い改めの洗礼と神の認識を通して——このことは、イザヤが語るとおり、神の民の不義のゆえに設けられたのです——、わたしたちは信じ、そして宣言します。わたしたちに前もって告げられたこの洗礼だけが、悔い改める人たちを清めることができ、それこそが命の水です。そしてあなたたちが自分のために掘った溜め池は壊されて、あなたたちにとって何の役にも立ちません。なぜなら、肉と体だけを清める洗礼に何の益があるでしょうか。怒りと財欲から、嫉みから、憎しみから魂を洗いなさい。そうすれば体全体が清くなるのです。これが種なしのパンについても同じ意味です。すなわち、あなたたちが古い悪いパン種の業を行わないようにするためです。しかし、あなたたちはすべてを肉の意味で理解し、魂が詭計とあらゆる悪で満ちているのに、そのような業を行えば敬虔だと考えます。それゆえ、種なしパンを食べる七日の後に、神は新しいパン種をこねるようにとあなたたちに命じました。すなわち、古い悪いものを模倣するのではなく、別の業を行うことです。そして、このことをあなたたちの新しい律の授け方が要求していることを証明するために、先に提示した言葉と、そのとき省略した他のいくつかの言葉をもう一度挙げましょう。イザヤはこう語ります。「わたしに聞け。そうすればあなたの魂は生きる。わたしはあなたたちと永遠の契約を結ぶ。ダビデに約束した、確かな恵みの契約を。見よ、わたしはこれを諸民への証しとし、諸民への指導者と管理者として与える。……あなたを知らなかった国々があなたを呼び求め、あなたを知らなかった民があなたのもとに走り寄る。あなたの神、イスラエルの聖なる方のゆえに。その方があなたを栄光に包まれるからである。神を求めよ、その方を見いだすときに呼び求めよ。その方が近くにいるときに。不敬虔な者はその道を、不義の人はその思いを捨て、主に立ち帰れ。その方が憐みを与えるからである。その方はあなたたちの罪を豊かに赦すからである。わたしの思いは、あなたたちの思いとは異なり、わたしの道はあなたたちの道とは異なる。天が地から遠いように、わたしの道はあなたたちの道から遠く、わたしの思いはあなたたちの思いから遠い。雪が天から降り、雨が降って、地を潤し、肥やし、種をまく者に種を、食べる者にパンを生み出すまで帰らないように、わたしの口から出るわたしの言葉も同じである。わたしが望むことをすべて成し遂げるまで帰らない。わたしの命令は順調に成し遂げられる。あなたたちは喜んで出て行き、歓びに導かれるであろう。山々と丘はあなたたちの到来を待って歓びに跳ね、野の木はすべて枝を打ち鳴らす。いばらの代わりに糸杉が育ち、いらくさの代わりに銀木犀が育つ。そしてそれは主のために、永遠のしるしとなり、絶えることはないであろう」（<a href="https://bibleox.com/ja/jp-ni/is/55/#L3">イザ. 55:3-13</a>）。そして、トリュフォンよ、これらの言葉と、預言者たちのこのような他の言葉は、キリストの最初の来臨に——そのとき彼は栄えない、見るからに卑しい、死すべき者として現れると前もって告げられていました——、また第二の来臨に、彼が栄光と共に天の雲に乗って来るときに向けられています。そのとき、あなたたちの民は、自分たちが刺し貫いた方を見て、知ることになるでしょう。ホセ——十二預言者の中の一人——とダニエルが預言したとおりに。（<a href="https://bibleox.com/ja/jp-ni/os/3/#L5">ホセ. 3:5</a>、<a href="https://bibleox.com/ja/jp-ni/dan/7/#L13">ダニ. 7:13</a>）[1]</p><h2>15</h2><p>それゆえ、イザヤが語る神の真の断食を守ることを学びなさい。そうすれば神に喜ばれるであろう。イザヤはこう告げています。「声を上げて叫べ。惜しまずに、角笛のように声を高くして、わたしの民の罪を、ヤコブの家の不義を告げよ。彼らは日ごとにわたしを尋ね、わたしの道を知ろうと望んでいる。あたかも義を行い、その神の律を捨てていない民のように。彼らは今、わたしに公正な裁きを問い、神に近づくことを望んでいる。言う。わたしたちは断食したのに、なぜあなたはご覧にならないのか。魂を苦しめたのに、なぜあなたはご存じないのか、と。断食の日にあなたたちは楽しみを見出し、働く人たちに重荷を負わせる。見よ、あなたたちは争いとけんかのために断食し、痛手を負う者をこぶしで打つ。あなたたちは今日のように断食するなら、その声は叫びの中に聞こえるであろうか。これは、人がその日、その魂を苦しめる断食として、わたしが選んだことか。お前が首を輪のように曲げ、荒布と灰を敷いて座るとしても、それを断食と呼び、主が喜ばれる日と呼ぶな。わたしが選ぶ断食はこれではない、と主は言われる。それは、不正の縄目をすべて解き、暴力的な契約の結び目をほどき、縛られた者を解放し、不当な荷をことごとく打ち破ること。飢えている人に自分のパンを分け与え、屋根のない貧しい人を家に迎え、裸の者を見たら覆い、自分の肉と骨を軽視しないこと。そうすれば、あなたの光は朝の光のように立ち上り、あなたの傷は速やかに癒える。あなたの義があなたの前に歩み、主の栄光があなたの後ろに集まる。そうすれば、あなたが呼び求めれば、主は応え、あなたが叫ぶなら、その方は『ここにいる』と言われる。もしあなたが、自分の中から重荷を、指を動かすことと悪口を取り去り、飢えている人に魂からパンを与え、圧迫されている魂を満足させるなら、あなたの光は暗闇の中で立ち上り、あなたの暗さは昼のごとくなる。そして主は常にあなたと共にいまし、あなたは満ち足り、あなたの魂は望みのものを得る。あなたの骨は強くされ、整えられた庭のように、水の出る泉のように、水の決して絶えない地のように茂るであろう」（<a href="https://bibleox.com/ja/jp-ni/is/58/#L1">イザ. 58:1-11</a>）。それゆえ、神の言葉がこれらすべての言葉の中で求めるとおりに、心の包皮を切りなさい。（<a href="https://bibleox.com/ja/jp-ni/vtor/10/#L16">申. 10:16</a>）</p><h2>16</h2><p>そして神ご自身がモーセを通して、次の言葉を高らかに宣言されました。「心のかたくなさを切り取り、これ以上首をかたくなにするな。あなたの神である主、支配する者たちの主、偉大で、力強く、恐れられる神は、人の顔を見ないし、贈り物を取らない」（<a href="https://bibleox.com/ja/jp-ni/vtor/10/#L16">申. 10:16-17</a>）。そしてレビ記の中では、「彼らがわたしに対して罪を犯し、わたしを軽視したことのゆえに、また、わたしの前で不実に歩んだことのゆえに、わたしも彼らに対して不実に歩み、彼らを敵の地の中で滅ぼすであろう。そのとき、彼らの包皮のない心は辱めを受ける」（<a href="https://bibleox.com/ja/jp-ni/lev/26/#L40">レビ. 26:40-41</a>）と語られています。アブラハムから受けた肉の割礼は、あなたたちに与えられた印であり、それによってあなたたちがほかの民とわたしたちから区別され、あなたたちだけが、今あなたたちを不当にも襲っているあの災いを耐えることになるように、あなたたちの地が荒らされ、都が火で焼かれ、あなたたちの実りがあなたたちの目の前で敵に食い尽くされ、あなたたちの誰もエルサレムに入ることを敢えてしないように、とのためでした。あなたたちは、割礼のほかには何によってもほかの人たちと区別されません。そして、神が将来を前もって見ておられること、各人にその功績にふさわしい分を用意されることを、あなたたちの誰も否定する勇気はない、わたしの考えるには。それゆえ、あの災いがあなたたちをふさわしく、正義に従って襲ったのです。あなたたちは正しい方を殺し、その前に彼の預言者たちを殺したからです。さらに今、あなたたちは、彼と、彼を遣わされた全能の神、万物の造り主に望みを置く人たちを軽蔑し、自分のできる限りにおいて辱めています。そしてキリストを信じる人たちを、自分たちの会堂の中で呪いの言葉で呪っているのです。あなたたちは現在、自分たちの手でわたしたちを殺す権威を持っていません。今の支配者たちがそれを妨げています。しかし、できたときには、それも行いました。それゆえ、神は預言者イザヤを通してあなたたちに呼びかけます。「見よ、正しい人が滅びるのに、誰も心に留めない。正しい人たちが取り除かれるのに、誰も顧みない。不正の前から正しい人が取り去られ、彼の墓は平安のうちにあります。彼はわたしたちの真ん中から取り去られたのです。あなたたちは無法の子たち、姦淫の子たちをここに引き寄せた。誰を嘲り、誰に向かって口を開き、舌を開いたのか」（<a href="https://bibleox.com/ja/jp-ni/is/57/#L1">イザ. 57:1-4</a>）。</p><h2>17</h2><p>この不義については、ほかの民たちはあなたたちほど責めを負いません。彼らは、正しい方と、わたしたち、彼の追随者たちに対する悪い偏見の中に、あなたたちによって連れ込まれたのですから。あなたたちは、あの唯一の穢れのない正しい人を十字架につけました。その傷によって、彼を通して父のもとに来るすべての人たちはいやされるのです。そして、彼が死者の中から復活し、預言の中で前もって告げられたとおり天に上がったことを知ったとき、あなたたちは自分たちの悪行を悔い改めなかったばかりでなく、エルサレムから全地にわたって、選ばれた人たちを遣わし、無敬虔な異端であるキリスト教が現れたと告げ知らせ、わたしたちについて中傷を広めました。わたしたちを知らない人たちはそれを繰り返しています。それゆえ、あなたたちは自分自身だけの不義の原因ではなく、すべてのほかの人たちの不義の原因です。そしてイザヤは正しく叫びます。「あなたたちのゆえに、わたしの名は民の中で褻られる」（<a href="https://bibleox.com/ja/jp-ni/is/52/#L5">イザ. 52:5</a>）。また、「彼らの魂には災いあれ。彼らは自分自身に対して悪い企てを計った。言う。正しい人を縛りつけよう。彼はわたしたちの役に立たないから、と。そのゆえに、彼らは自分の業の実を食べる。不敬虔な人に災いあれ。悪いことがその手の業に応じて彼を襲う」（<a href="https://bibleox.com/ja/jp-ni/is/3/#L10">イザ. 3:10-11</a>、<a href="https://bibleox.com/ja/jp-ni/prs/2/#L12">知. 2:12</a>）。[2]また別のところでは、「災いあれ、罪を長い縄のように引きずり、不義を牛の輪の皮紐のように引きずる人たちに。彼らは言う。急いで、その方の裁きが近づき、イスラエルの聖なる方の企てが来るように。そうすれば、その方を知るであろう、と。災いあれ、悪を善と言い、善を悪と言う人たちに。闇を光と言い、光を闇と言う人たちに。苦いものを甘いと言い、甘いものを苦いと言う人たちに」（<a href="https://bibleox.com/ja/jp-ni/is/5/#L18">イザ. 5:18-20</a>）。あなたたちは、全地にわたって、神から人々に遣わされたあの唯一の穢れのない正しい光に対して、あの苦い、暗い、偽りの告発を広めるように努めました。彼があなたたちの前に叫んだとき——「聖書の中にこう書かれている。わたしの家は祈りの家である。……ところがあなたたちはそれを盗人のほら穴にした」（<a href="https://bibleox.com/ja/jp-ni/mf/21/#L13">マタ. 21:13</a>）——、彼はあなたたちには役に立たない者に見えたのです。そして彼は神殿の中の両替人たちの卓をひっくり返し、言いました。「災いあれ、あなたたち書記官たちとパリサイ人たち、偽善者たちに。あなたたちは薄荷とレウタの十分の一を献げながら……神への愛と裁きについては顧みない。……外は美しく見えるのに中は死んだ者の骨で満ちている、白く塗られた墓」（<a href="https://bibleox.com/ja/jp-ni/lk/11/#L42">ルカ. 11:42</a>、<a href="https://bibleox.com/ja/jp-ni/mf/23/#L27">マタ. 23:27</a>）。そして書記官たちに：「災いあれ、あなたたち書記官たちに。あなたたちは鍵を持っているのに、自分では入らず、入りたい人たちを妨げている。盲の導き手たちよ」（<a href="https://bibleox.com/ja/jp-ni/lk/11/#L52">ルカ. 11:52</a>、<a href="https://bibleox.com/ja/jp-ni/mf/23/#L16">マタ. 23:16</a>）。</p><h2>18</h2><p>トリュフォンよ、あなたがわたしたちの救い主が授けた教えを読んだと言われたので、わたしがいくつかの彼の簡潔な言葉を預言の言葉に加えたことは、場違いではないと思います。そして「洗え、今は清くなれ。魂から悪事を除け」（<a href="https://bibleox.com/ja/jp-ni/is/1/#L16">イザ. 1:16</a>）——神はこの洗礼で洗い、真の割礼を受けなさいと、このようにあなたたちに命じておられるのです。わたしたちもまた、肉の割礼と安息日と、すべての祭りを守っていたでしょう。それらがなぜ、あなたたちにも命じられたのか——あなたたちの罪と心のかたくなさのゆえに——を知らなければ。</p><p>なぜなら、悪い人たちと霊たちがわたしたちに対して行うあらゆる攻撃を忍耐をもって耐え、言い尽くし難い種類の死と苦しみの中でさえ、わたしたちの苦しめる人たちの憐みのために祈り、新しい律の授け方の命令によって、誰に対してもほんの僅かの仕返しも望まないのであれば、トリュフォンよ、わたしたちにとって何の害ももたらさないもの——肉の割礼、安息日、祭り——を、なぜ守らないでいましょうか。</p><h2>19</h2><p>——これは本当に驚くべきことです。あなたたちはあれほどの災いを耐えながら、今問題になっているそれらのものをすべて守らないのですか。</p><p>——それは、割礼が必要なのは、すべての人ではなく、あなたたちユダヤ人たちだけだからです。先に言ったとおり、あなたたちが、今不当にも耐えているあの災いを受けるようにとのためです。そしてわたしたちは、あなたたちの溜め池から取る無益な洗礼も受け入れません。それは命の洗礼に対しては何ものでもないからです。それゆえ、神は「わたしを捨てた。わたしは生きた水の泉である。しかし彼らは自分のために、水を留めることのできない、壊れた溜め池を掘った」（<a href="https://bibleox.com/ja/jp-ni/ier/2/#L13">エレ. 2:13</a>）と宣言しています。そして、あなたたちは肉の割礼を受けているにもかかわらず、わたしたちの割礼を必要としています。しかし、これを持っているわたしたちは、あなたたちのそれを必要としません。もしあなたたちが考えるように肉の割礼が必要であるなら、神はアダムを包皮のないままに造らなかったでしょう。包皮のないまま献げ物を献げていたアベルの献げ物に顔を向けなかったでしょう。包皮のないままのハノクは神に喜ばれ、見出されないまま神に取られたでしょう。ロトは包皮のないままソドムから救われました。御使いたちと主ご自身が彼を引き出したのですから。ノア——新しい種族の初め——は包皮のないまま、子どもたちと共に箱船に入りました。メルキセデク——至高者の司祭——は包皮のありませんでした。肉の割礼を最初に受けたアブラハムが彼に十分の一を献げ、そしてメルキセデクは彼を祝福しました。その位に従って、神がダビデを通して、永遠の司祭を立てると告げられたのです。（<a href="https://bibleox.com/ja/jp-ni/ps/110/#L4">詩. 110:4</a>）それゆえ、この割礼は、ホセ——十二預言者の中の一人——が言うように、「民は民でなく、群衆は群衆でない」ようにするために、あなたたちだけに必要でした。（<a href="https://bibleox.com/ja/jp-ni/os/1/#L9">ホセ. 1:9</a>）先に挙げた正しい人たちはみな、安息日を守らずに神に喜ばれました。そして彼らの後、アブラハムとモーセまでの彼のすべての子孫は——モーセのときに、あなたたちの民は、荒野の中で子牛を造って、神の前で不敬虔で感謝しない民として現れました——安息日を守りませんでした。それゆえ、神は民の弱さを顧みて、献げ物をただ神の名だけのために献げるようにと命じました。それは、あなたたちが偶像礼拝をしないためでした。しかし、あなたたちはそれを守りませんでした。むしろ自分の子どもたちを霊たちへの献げ物として殺したのです。神はあなたたちに安息日を守ることも命じました。それは、あなたたちが神を覚えているためでした。神の言葉が指し示しているとおりです。「あなたたちが、わたしがあなたたちを救い出した神であることを知るためである」（<a href="https://bibleox.com/ja/jp-ni/ish/6/#L7">出. 6:7</a>）。</p><h2>20</h2><p>神はまた、ある食物を慎むようにとあなたたちに命じました。それは、あなたたちが食べたり飲んだりしているときにも、神を眼前に置いているためです。あなたたちは気まぐれで、神についての認識から離れる傾向があるのですから。モーセが言うとおりです。「民は食べ、飲み、そして戯れのために立ち上がった」（<a href="https://bibleox.com/ja/jp-ni/ish/32/#L6">出. 32:6</a>）。また別のところでは、「ヤコブは食べ、満ち足り、肥やされた。愛された者は後ろを向いた。肥え、太り、広がり、彼を造った神を捨てた」（<a href="https://bibleox.com/ja/jp-ni/vtor/32/#L15">申. 32:15</a>）。しかし、神がノア、正しい人に、血の中にある肉——自分から死んだもの——のほかの、あらゆる動物を食べることを許されたことは、モーセが創世記の中であなたたちに語っています。トリュフォンが「草のように」という言葉で反論しようとしたとき、わたしは先手を取って尋ねました。なぜあなたたちは、「草のように」という言葉を、神が言われた意味で受け取らないのですか。すなわち、草が人への食物として造られたように、動物たちも、人がその肉を食べるように与えられた、と。しかし、あなたたちの言うように、ある植物を食べないのと同じように、そのときノアにも動物を区別するように命じられた、というのですか。この説明は受け入れられません。まず、わたしは、あらゆる穀物が草であり、食物として用いられることを容易に証明できますが、これには留まりません。たとえわたしたちが草の穀物と区別して、すべての植物を食べないと仮定しても、それは、それらが汚れて穢れているからではなく、苦い、あるいは毒のある、あるいは棘のあるものだからです。しかし、甘く、栄養があり、美しい植物はすべて——海に生えるものであれ、地に生えるものであれ——わたしたちは喜んで食べます。それゆえ、次のことが帰結します。神がモーセを通して、汚れて凶暴な動物たちを慎むようにとあなたたちに命じたのは、あなたたちが荒野の中でマナを食べ、神があなたたちのために行われたすべての奇跡を見たにもかかわらず、金の子牛を鋳て、それを拝んだからです。神は常にあなたたちについてこう言われます。「無分別の子たちよ。彼らのうちに信じるものはない」と（<a href="https://bibleox.com/ja/jp-ni/vtor/32/#L20">申. 32:20</a>）。</p><h2>21</h2><p>そして、あなたたちの罪と父たちの罪のゆえに、神が——先に言ったとおり、それらを覚えさせるために——安息日を守ることをあなたたちに課し、ほかの命令を課したこと、そして神があなたたちの中の何人かを異邦人のために生かしておいたこと、その方が異邦人たちの中で冒涜されないために——これについては、その方ご自身の言葉があなたたちに証明できるでしょう。エゼキエルを通してこう語られています。「わたしは主、あなたたちの神である。わたしの命令に歩み、わたしの律を守り、エジプトの慣わしに結び付かず、わたしの安息日を聖化せよ。それらはわたしとあなたたちの間のしるしであり、わたしが主、あなたたちの神であることを、あなたたちが知るためである」。「しかし、あなたたちはわたしを怒らせた。あなたたちの子らはわたしの命令に歩まず、わたしの律を守るように努力しなかった。そして、それらを行う人は、それらによって生きるであろう。しかし彼らはわたしの安息日を穢した。わたしは言った。わたしの怒りを荒野の中で彼らの上に注ぎ、わたしの怒りを彼らの上で成し遂げると。しかし、わたしは行わなかった。その名が、わたしが彼らを連れ出した民たちの目の前で、全く冒涜されないためである。わたしは荒野の中で彼らの上に手を上げた。彼らを異邦人たちの中に散らし、国々の中に吹き散らすようにと。彼らがわたしの律を行わず、わたしの命令を退け、わたしの安息日を穢し、彼らの目が父たちの偶像を追い続けていたことのゆえに。そしてわたしは彼らに、良いものではない命令を、それらによって生きることのない律を与えた。そして彼らをその家の中で穢す。わたしが、胎を開くすべてのものを滅ぼし尽くしに来るときに」（<a href="https://bibleox.com/ja/jp-ni/iez/20/#L19">エゼ. 20:19-26</a>）。</p><h2>22</h2><p>さらに、あなたたちの民の罪と偶像礼拝のゆえに、神が献げ物を献げるようにと命じたこと——それらが必要だからではなく——については、十二預言者の中の一人アモスを通して、神がこれについて語ることをお聞きください。「主の日を望む者たちに災いあれ。その主の日はあなたたちにとって何になるでしょうか。それは闇であり、光ではない。ちょうど、人が獅子から逃げて、熊に出会うようなものである。あるいは、家に入り、壁に手を付けて、蛇に咬まれるようなもの。まことに、主の日は闇であり、光ではないであろうか。彼らにとって何の明るさもない暗さである。わたしはあなたたちの祭りを憎み、嫌い、あなたたちの集会を喜ばない。もしあなたたちがわたしに焼燔の献げ物と献げ物を献げても、わたしは受け入れない。わたしはあなたたちの豊かな献げ物に顔を向けない。わたしから騒がしい歌の群れを取り去れ。あなたたちの琴の音を、わたしは聞かない。裁きが水のように、義が絶えることのない流れのように湧き出るように。イスラエルの家よ、わたしはあなたたちに荒野の中で献げ物と供え物を献げさせたか、と主は言われる。しかし、あなたたちはモロクの幕屋と、あなたたちの神レムファンの星を運び、自分たちのために造った像を。そしてわたしはあなたたちをダマスコの向こうへ移す、と主は言われる。その方の名は全能の神である。シオンで豊かに暮らし、サマリヤの山に頼る人たちに災いあれ。民の指導者たちの名を持つ人たちは、異邦人から初穂を集めた。イスラエルの家は自分自身に向かって上った。ハラアンに全部行って見よ。そこからハマトの大いなる都に下って見よ。そして下って、異邦人のゲットに行き、これらすべての王国の中で最も美しい都へ。それらの境界は、あなたたちの境界よりも広いか。災いあれ、悪い日を待ち望み、近づいて偽りの安息日を祝う人たちに。象牙の寝台に横たわり、自分の寝床で贅沢に過ごし、羊の群れから小羊を、大きな牛から子牛を食べ、琴の音に手拍子をする人たち——彼らは、それが永続するように、逃げ去らないようにと考えたのです——。大いなる杯で酒を飲み、最上の香油を塗る人たち。しかし、ヨセフの破れについて少しも悲しむ人たちではない。それゆえ、今や彼らは捕囚の中で先導者たちと共に移されるであろう。不敬虔な人たちの宴はずり落ち、エフライムから馬のいななきは取り去られるであろう」（<a href="https://bibleox.com/ja/jp-ni/am/5/#L18">アモ. 5:18-27</a>、<a href="https://bibleox.com/ja/jp-ni/am/6/#L1">アモ. 6:1-7</a>）。そしてエレミヤを通してまた、「あなたたちの肉を集め、献げ物を集めて食べよ。わたしがあなたたちの父たちに、彼らをエジプトの地から連れ出すためにその手を握ったその日に、献げ物と供え物についての命令を与えなかったからである」（<a href="https://bibleox.com/ja/jp-ni/ier/7/#L21">エレ. 7:21-22</a>）と。そしてダビデを通して、第49の詩篇の中では、こう言われました。「神なる神々、主は語り、地を呼ばれる。日の昇るところから日の没するところまで。シオンから、完全な美しさの中から。わたしたちの神が来られる。その方は静まらない。その方の前に火が燃え、その方の周りには激しい嵐がある。その方は天に、上に呼びかけ、そして地に、ご自分の民を裁くために。わたしの聖なる者たちを、献げ物においてわたしと契約を結んだ者たちを、その方に集めよ。そして天はその方の義を告げ知らせる。神は裁き手だからである。わたしの民に聞け。わたしは語る。イスラエルよ、わたしはあなたに証しをする。わたしは神、お前の神である。献げ物についてわたしがお前を責めることはない。焼燔の献げ物は常にわたしの前にある。わたしはお前の家からの子牛や、お前の群れからの雄山羊を受け取らない。わたしのものであるから。野の獣も、山の家畜も、雄牛も。天の鳥たちをすべて知っている。そして野の美しさはわたしと共にある。わたしが飢えたとしても、お前に言わない。わたしのものは世界と、それを満たすすべてだからである。わたしは雄牛の肉を食べるでしょうか。山羊の血を飲むでしょうか。神に讃美の献げ物を献げ、至高者に自分の誓いを支払え。苦しみの日にわたしを呼び求めよ。わたしはお前を救い出し、お前はわたしを栄光に包むであろう。しかし罪人に神は言われる。わたしの律を誰のために語るのか。わたしの契約を自分の口で受け取るのか。お前は教えを憎み、わたしの言葉を背後に投げた。泥棒を見たなら、彼と共に走り、姦淫者と共に分け前を置いた。お前の口は悪事に満ち、お前の舌は罠を編んだ。お前は座って兄弟を中傷し、自分の母の子に罪を着せた。お前はこれを行った。そしてわたしは黙していた。お前は、わたしがお前と同じであると考えるほどの不敬虔なことを考えた。わたしはお前を責め、これらのことをお前の目の前に置く。これを理解せよ、神を忘れる者たちよ。その方がお前たちを引き裂き、誰も救い出す者がいないことがないように。讃美の献げ物はわたしを栄光に包む。そしてそこに、わたしが救いを示す道がある」（<a href="https://bibleox.com/ja/jp-ni/ps/50/#L1">詩. 50:1-23</a>）。それゆえ、神はあなたたちからの献げ物を受け取らないのです。そして初めから献げ物を立てられたのは、それらが必要だったからではなく、あなたたちの罪のゆえにです。そしてエルサレムと呼ばれる神殿さえ、神は自分の家として認められました。そこで少なくとも神を敬えば、偶像礼拝しないようにとのためです。これはイザヤの言葉によって裏付けられます。「あなたたちはわたしのためにどのような家を建てるのか、と主は言われる。天はわたしの玉座であり、地はわたしの足の踏み台である」（<a href="https://bibleox.com/ja/jp-ni/is/66/#L1">イザ. 66:1</a>）。</p><h2>23</h2><p>もしこれを認めないなら、不合理な考えに落ちなければなりません。すなわち、エノクの日々と、肉の割礼を知らず、モーセが命じた安息日とほかの設けを守らなかったほかのすべての人たちの日々には、同じ神がおられなかった、とか、あるいは、神は人類がいつも同じ正しい業を行わないことを望まれた、と。そう考えることは明らかに笑うべきであり愚かです。しかし、わたしたちは告白しなければなりません。いつも同じである神は、罪人である人たちのために、これらの業とこれに類するものを命じられたのです。そうすることによってのみ、わたしたちは、その方を、将来を見る人類を愛する方、あらゆるものに満足される方、正義の裁き手、善い方と認めることができるのです。もしこれに何か異論があるなら、答えてください。皆さん、この事柄についてどう考えていますか。</p><p>誰も答えませんでした。そこでわたしは語り始めました。トリュフォンよ、あなたと、改宗者になろうと望む人たちに、あの老人から聞いた神の教えを語りましょう。あなたたちは見ます。元素たちは無為に留まることなく、安息日を守りません。生まれたとおりのままに留まりなさい。もしアブラハムの前には割礼が必要なく、モーセの前には安息日と祭りと供え物が必要なかったなら、今も——父の御心によって、神の子イエス・キリストが、アブラハムの家系からおとめから、罪なしに生まれた今——それらは必要ありません。そしてアブラハム自身、まだ包皮のないうちに、神に対して持っていた信仰のゆえに義とされ、祝福を受けたと聖書は示しています。割礼は彼が受けたときでも、ただの印としてであって、義とされるためではありませんでした。これを認めるように聖書と事柄そのものがわたしたちに強いるのです。それゆえ、その民についてこう言われたのは正当です。「第八日のうちに割礼を受けないすべての魂は、その民の中から滅ぼされるであろう」（<a href="https://bibleox.com/ja/jp-ni/gen/17/#L14">創. 17:14</a>）。そして女たちの肉の割礼への無能力は、この割礼が、義の業としてではなく、印として与えられたことを証明しています。神は女たちも、すべての聖なる徳あることを行うことができるように造られました。わたしたちは見ます。男と女の体の構成は異なっています。しかし、両者が義あるいは不義であるのはこの基礎の上ではなく、敬虔と徳に対する関係においてだと知っています。</p><h2>24</h2><p>続けることができます、皆さん、とわたしは言いました。第八日が第七日よりも多く、このように神によって告げ知らされる神秘を含んでいたことを証明することは。しかし、わたしがほかの主題へと逸れているように見えるのを避けるために——理解してください、願わくは——割礼の血は無効にされ、わたしたちは救いの血を信じました。今は別の契約、シオンから出て来た別の律があります。イエス・キリストは、望むすべての人を割礼されます。かつて予告されたとおり、「石の小刀」によって、「聖なる民、信実を守る民、真実に執着する民、平和を守る民」となるように。（<a href="https://bibleox.com/ja/jp-ni/nav/5/#L2">ヨシュ. 5:2</a>）[3]「神を恐れるすべての人たち、エルサレムの善を見たい人たち、わたしと共に来よ。行こう、主の光のうちに歩もう。その方は自分の民、ヤコブの家を退けられた。行こう、すべての民よ、エルサレムに集まろう。人々の罪のために戦争に包囲されなくなったエルサレムに」[4]。「わたしはわたしを求めない人たちに現れ、わたしに問わない人たちに見出された」と主はイザヤを通して言われます。「わたしは言った。見よ、わたしはここにいる、わたしの名を呼ばなかった民に。わたしは手を差し伸べた。終日、不信仰で服従しない民に、良い道ではなく自分たちの罪の後に歩む民に。この民はわたしの顔の前でわたしを怒らせる」（<a href="https://bibleox.com/ja/jp-ni/is/65/#L1">イザ. 65:1-3</a>）。</p><h2>25</h2><p>わたしたちと共に、遺産の中で少なくとも僅かな分でも持とうと望む人たちがいます。自分自身を義とし、アブラハムの子たちと呼ばれる人たちです。聖なる霊がイザヤを通して、まるで彼らの口から語るかのように叫ばれるとおりです。「天から見下ろし、あなたの聖性と栄光の住まいから見よ。あなたの熱心はどこに、あなたの力はどこにあるのか。あなたの大いなる憐みの豊かさはどこにあるのか。あなたはわたしたちを耐え忍ばれたのに。主よ、あなたはわたしたちの父です。アブラハムはわたしたちを知らず、イスラエルはわたしたちを認めませんでした。しかしあなた、主よ、わたしたちの父です。わたしたちを解放してください。初めからあなたの名がわたしたちの上にありました。主よ、なぜあなたはわたしたちをあなたの道から遠く迷わせ、わたしたちの心をかたくなにして、あなたを恐れさせなかったのですか。あなたの僕たちのために、あなたの所有の部族のために、あなたの聖なる山から僅かな遺産を受け取ることができるように、身をかがめてください。わたしたちは、あなたがわたしたちを支配しておられず、あなたの名がわたしたちの上に呼ばれていなかった初めのようになりました。あなたが天を開くとき、あなたからの恐れが山々に襲い、彼らは火から溶ける蝋のように溶けるでしょう。そして火はあなたの敵対者たちを焼き、あなたの名はあなたの敵対者たちに知られるであろう。民たちはあなたの顔の前で震えるでしょう。あなたが輝かしいことを成し遂げるとき、あなたからの恐れが山々に襲うでしょう。昔からわたしたちは聞かず、わたしたちの目は、あなたのほかには神を見ず、あなたが憐みを待つ人たちのために成し遂げられるわたしたちの業を見ませんでした。その方は義を行う人たちと出会うでしょう。そして彼らはあなたの道を覚えるでしょう。見よ、あなたは怒り、わたしたちは罪を犯しました。そのことからわたしたちは迷い、皆不浄なものとなりました。そしてわたしたちのすべての義は、座っている人の汚れた布のようでした。そしてわたしたちは、自分たちの不義のゆえに、葉のように落ちました。風がわたしたちを運ぶでしょう。そして誰もあなたの名を呼び求めず、誰も、あなたに執着するのを覚えません。あなたがあなたの顔をわたしたちから背け、わたしたちの罪のゆえにわたしたちを渡されたからです。しかし今、主よ、立ち帰ってください。わたしたちは皆あなたの民ですから。あなたの聖性の都は荒れ果てました。シオンは荒野のようになり、エルサレムは呪われました。聖別されたわたしたちの家、神殿、そしてわたしたちの父たちが讃めてきた栄光は火で焼かれ、その輝かしいすべては倒れました。これらすべてのことを、主よ、あなたは許され、沉默し、わたしたちを激しく辱められました」（<a href="https://bibleox.com/ja/jp-ni/is/63/#L15">イザ. 63:15-19</a>、<a href="https://bibleox.com/ja/jp-ni/is/64/#L1">イザ. 64:1-11</a>）。——これはどういう意味ですか、と言いました、トリュフォンは。あなたの言葉では、わたしたちの誰も、神の聖なる山の上で何の遺産も受け取らないのですか。</p><h2>26</h2><p>——そういう意味ではありません、とわたしは答えました。しかし、キリストを迫害し、今も迫害し、悔い改めない人たちは、聖なる山の上で何の遺産も受け取らない、という意味です。しかし、キリストを信じ、自分たちの罪を悔い改めた民たちは、ヤコブから生まれた族長たち、預言者たち、正しい人たちと共に遺産を受け取ります。安息日を守らず、割礼を受けず、祭りを守らないにもかかわらず、疑いなく神の聖なる遺産を受け取るのです。神はイザヤを通してこう言われます。「わたし、主は義のうちにあなたを呼び、あなたの手を取り、あなたを堅くし、あなたを民の契約とし、民の光とする。盲人の目を開き、鎖につながれた者をその鎖から、暗闇の中に座る人たちを牢の家から出させるためである」（<a href="https://bibleox.com/ja/jp-ni/is/42/#L6">イザ. 42:6-7</a>）。さらに、「民のために旗を上げよ。見よ、主は地の果てまで告げ知らせた。シオンの娘たちに言え。見よ、あなたの救い主があなたのもとに来る。その方がその顔の前に報いと業を持って。そしてその方の民は、主によって贖われた聖なる民と呼ばれるであろう。そしてお前は、求められた都、捨てられない都と呼ばれるであろう」（<a href="https://bibleox.com/ja/jp-ni/is/62/#L11">イザ. 62:11-12</a>）。「エドムから来るこの人は誰か。ボスラからの、その衣の紅は何か。この人は、その偉大な力の中で上り、その衣の中で美しい。わたしは義と救いの裁きを語る。なぜあなたの衣は赤いのか。あなたの服は、葡萄の踏み潰しの大桶からのようである。潰された葡萄で満ちた大桶。わたしは一人で踏み、その民の中から誰もわたしと共にいませんでした。わたしは怒りのうちに彼らを踏み、地のように彼らを砕き、彼らの血を地の上に注ぎました。彼らのための仕返しの日が来ました。贖いの年が近づきます。わたしは見た。しかし助け手はいませんでした。わたしは注目した。しかし支える者はいませんでした。それゆえ、わたしの腕はわたしのために救い、わたしの怒りが支える者となりました。わたしは怒りのうちに彼らを踏み、彼らの血を地の上に注ぎました」（<a href="https://bibleox.com/ja/jp-ni/is/63/#L1">イザ. 63:1-6</a>）。</p><h2>27</h2><p>——しかし、なぜあなたは、と言いました、トリュフォンは。預言の中から、自分に有利な箇所だけを引き、安息日を守るようにとはっきり命じている箇所を引き上げないのですか。イザヤの言葉があります。「お前が自分の足を安息日のうちから引き留めるなら、聖なる日に自分の望みを行わないなら、お前が安息日を主に喜ばれる日と呼ぶなら、主の聖なる、栄えある日と呼ぶなら、お前が自分の道から自分の足を引き留め、自分の望みを成し遂げないなら、自分の口から言葉を語らないなら、主を喜ばせるなら——そのとき、お前はヤコブの遺産の上に乗り、お前の父のヤコブの遺産を享受するであろう。主の口がこれを語ったのですから」（<a href="https://bibleox.com/ja/jp-ni/is/58/#L13">イザ. 58:13-14</a>）。</p><p>皆さん、とわたしは答えました。わたしはほかの預言の言葉も省略しましたが、それは、それらがわたしに矛盾するからではありません。しかし、神がすべての預言者たちを通して、モーセを通して命じたのと同じものを命じるなら、それは、あなたたちのかたくなさと神に対する感謝しなさのゆえに、神が同じものを繰り返されるからです。そうすれば少なくともそのことによって、いつかあなたたちが悔い改めてその方に喜ばれるように。子どもたちを霊たちへの献げ物として殺さないように。「泥棒たちの分有者とならず、贈り物を愛し、報いを追い求めず、みなしごを守らず、やもめの裁きに近づかず、手のすべてが血の仕事に満ちないように」（<a href="https://bibleox.com/ja/jp-ni/is/1/#L23">イザ. 1:23</a>、<a href="https://bibleox.com/ja/jp-ni/is/1/#L15">イザ. 1:15</a>）。「シオンの娘たちは、目くばせをしながら、自分たちの服を引きずりながら、かたくなに歩いた」（<a href="https://bibleox.com/ja/jp-ni/is/3/#L16">イザ. 3:16</a>）。「すべての人が迷った、と神は叫ばれる。すべての人が無用なものとなった。智慧ある人はいない、ただ一人もいない。彼らは自分の舌で欺き、彼らの喉は開かれた墓であり、彼らの唇の下にはアスピスの毒がある。彼らの道の中には破れと悲惨がある。そして平和の道を知らなかった」（<a href="https://bibleox.com/ja/jp-ni/ps/14/#L1">詩. 14:1-3</a>）。それゆえ、神が初めに、あなたたちの罪のゆえにこれらの命令をあなたたちに課したように、あなたたちがそれらに執着するか、むしろそれらを増し加えるかのゆえに、同じものを繰り返すことによって、その方への記憶と認識へとあなたたちを駆り立てられるのです。しかし、あなたたちは心のかたくなな民、無分別な民、盲の民、足の不自由な民、「信じるもののない子たち」です。その方ご自身が言われるとおり、「ただ口でその方を敬い、心ではその方から遠く離れている、その方の教えではなく自分の教えを教える」人たちです（<a href="https://bibleox.com/ja/jp-ni/vtor/32/#L20">申. 32:20</a>、<a href="https://bibleox.com/ja/jp-ni/is/29/#L13">イザ. 29:13</a>）。さらに言いましょう。神は、大司祭たちが安息日の日に献げ物を献げて罪を犯すこと、あるいは割礼を受ける人と割礼を施す人が安息日の日に罪を犯すことを望まれたのでしょうか。神は、第八日のうちに生まれた子どもを必ず割礼するようにと命じておられます。たとえそれが安息日であっても。もしその方が、安息日の日に割礼することを不敬虔だと知っておられたなら、安息日の前か後かの日に生まれた子どもに割礼を行うように命じなかったでしょうか。それとも、なぜ神は、モーセの前に生きていた、包皮のないままに正しいと呼ばれ、その方に喜ばれていた人たちに、同じ設けを行うことを教えなかったのでしょうか。</p><h2>28</h2><p>——そして以前にも、わたしたちはあなたからこれを聞いて、注意を払いました——とトリュフォンは言いました。これは、実際のところ、注意に値します。そしてわたしは、ほかの人たちのように、それが神に喜ばれたことだとは言いません。それは、問いに答えることができない人たちの常套句です。</p><p>わたしは聖書から、そして事柄そのものの本性から、自分の証明と勧めを提出しているので、包皮のないわたしの言葉をためらわずに、迷わず信じてください、とわたしは言いました。あなたたちが立ち帰るためには短い時しか残されていません。キリストがその到来によってあなたたちに先立つなら、あなたたちは無益に悔い、無益に泣くことになるでしょう。その方はあなたたちに聞かないのですから。「自分のために新しい畑を耕し、いばらのうちに種を蒔くな。主に向かって割礼を受け、心の包皮を取り去れ」と、エレミヤは民に語っています（<a href="https://bibleox.com/ja/jp-ni/ier/4/#L3">エレ. 4:3-4</a>）。それゆえ、いばらのうちに種を蒔くな、耕されていない地に蒔くな。そこからは実りがあなたたちにありません。キリストを知れ——それが新しい地です。あなたたちの心のための、美しく肥えた地です。「見よ、日々が来る、と主は言われる。わたしは、自分の包皮に割礼を受けたすべての人たちを訪れる。エジプトを、ユダを、エドムを、モアブの子たちを。これらのすべての民は包皮に割礼を受けており、イスラエルの家全体が心において割礼を受けていないからである」（<a href="https://bibleox.com/ja/jp-ni/ier/9/#L25">エレ. 9:25</a>）。見なさい。神は、印として与えられたあの割礼を望んではいません。それはエジプト人たちにも、モアブとエドムの子たちにも無益なのです。しかし、スキュタイであれペルシア人であれ、神とそのキリストについての認識を持ち、その方の永遠の命令を守るなら、その人は美しく有益な割礼を受けた者、神の友です。神は喜びをもってその人の献げ物と供え物を受け取られます。今、皆さん、十二預言者の中の一人マラキを通して、神ご自身が民に語られた言葉を言いましょう。次のとおりです。「わたしはあなたたちを願わない、と主は言われる。そしてあなたたちの手からあなたたちの献げ物を受け取らない。日の昇るところから日の没するところまで、わたしの名は民の中で大きくされ、すべての場所において、わたしの名に献げ物と清い献げ物が献げられるからである。わたしの名は民の中で大きくされている、と主は言われる。しかし、あなたたちはそれを穢している」（<a href="https://bibleox.com/ja/jp-ni/mal/1/#L10">マラ. 1:10-11</a>）。そしてダビデを通して言われました。「わたしが知らなかった民はわたしに仕えるようになり、耳の聞きによってわたしに聞き従うようになった」（<a href="https://bibleox.com/ja/jp-ni/ps/18/#L44">詩. 18:44</a>）。</p><h2>29</h2><p>わたしたちは、すべての民が一つに集まって、神がわたしたちにも顔を向けてくださったことを讃めましょう。栄光の王を通して、万軍の主を通して讃めましょう。その方は異邦人たちにも好意を示され、わたしたちの献げ物はあなたたちのものよりもその方に喜ばれるのですから。それなら、神からの証しがわたしの益となるなら、わたしに割礼は何の必要があるでしょうか。聖なる霊によって洗礼を受けたわたしに、あのような洗礼は何の益があるでしょうか。わたしの考えるには、ほんのわずかでも理性を持つ人たちにさえ、このことで納得させることができます。このような教えは、わたしによって、あるいは人間の業によって作り上げられたのではありません。ダビデがそれを歌い、イザヤがそれを告げ知らせ、ゼカリヤがそれを宣べ伝え、モーセがそれを書きました。トリュフォンよ、あなたはそれを知っていますか。それはあなたたちの書物の中にあります。いや、むしろ、あなたたちのものではなく、わたしたちのものの中にあります。わたしたちはそれを信じ、あなたたちは読むのに、その意味を理解していないからです。神ご自身が設けた、体の割礼を持たないわたしたちを責めないでください。そして、わたしたちが安息日に熱湯を飲むことを恐れないでください。神はその日にも、ほかのすべての日に同じように世界を統治しておられ、大司祭たちにはその日に、ほかの日に献げ物を献げるようにと命じられています。しかも、神ご自身によって証しされた、あの設けの中の一つも守らなかった、多くの正しい人たちがいたのです。</p><h2>30</h2><p>しかし、神が無分別な人たちによって偽りに非難される——あたかもその方が、いつもすべての人に同じ義を教えておられなかったかのように——ことは、あなたたち自身の不敬虔に帰せられるべきです。多くの律法的な設けが無分別で、神にふさわしくないように見えるのは、恵みを受けず、それらを通して、不敬虔で魂の病んでいるあなたたちの民が神によって回帰と霊的悔い改めに召されたこと、そしてモーセの死の後に語られた預言が永遠であることを会得できなかった人たちのことです。このことについては詩篇の中でも語られています、皆さん。しかし、神の命令によって智慧を得たわたしたちがそれらを「蜜よりも、蜜の滴りの甘いものよりも甘い」と認めることは、死さえもわたしたちを主の名から離れさせないという事実から明らかです（<a href="https://bibleox.com/ja/jp-ni/ps/19/#L11">詩. 19:11</a>）。神を信じるわたしたちが「異邦人たちからわたしたちを守るように」とその方に祈ることは、すべての人に知られています（<a href="https://bibleox.com/ja/jp-ni/ps/17/#L14">詩. 17:14</a>）。すなわち、その方を信じる人の中の一人が象徴的に語る悪い偽りの霊たちから、という意味です。そしてわたしたちは常に、イエス・キリストを通して、敬虔に無縁で、かつてわたしたちが拝していた霊たちから守られるようにと、神に祈ります。キリストを通して神に立ち帰った後に、わたしたちが穢れのないものであるように、とのためです。わたしたちは、その方を助け手であり救い主と呼びます。その名の力から、霊たちは震え、今でも、ユダヤの統治者であったポンティウス・ピラトゥスのもとで十字架につけられたイエス・キリストの名によって呼びかけられると、わたしたちに服従します。それゆえ、その方の父がその方にあれほど偉大な力を与えられたことは、すべての人に明らかです。悪霊たちさえ、その方の受けた受難の名と経営に服従しているのですから。</p><h2>31</h2><p>しかし、もしその受難の経営に伴った、そして今も伴っているその力があれほど偉大であるなら、栄光の到来のときには、それはどれほどのものでしょうか。その方は人の子のように、御使いたちに伴われて雲の上に来られます。ダニエルが次の言葉で告げたとおりです。「わたしは見ていた。玉座が置かれ、日の老いたる者が座に着かれた。その方はその服が雪のように白く、頭の髪は清い羊毛のように。その玉座は火の炎のようであり、その玉座の車輪は燃える火であった。その方から火の川が流れ出ていた。千々に千、万々に万がその方に仕え、その方の前に座に着いた。裁きが座に着き、書物が開かれた。わたしはそのとき、角が語る大いなる言葉の声を見ていた。そして獣は殺され、その体は滅ぼされ、火で焼かれるために渡された。ほかの獣たちもその支配を失った。ただし、これらの獣たちの命は、決められた時と時まで延長された。わたしは夜の幻の中で見ていた。見よ、天の雲に乗って来る、人の子のような者がいた。そして日の老いたる者のもとに至り、その方の前に立った。そしてその方の前に立つ者たちがその方に近づけた。そしてその方に支配と栄誉と王権が与えられ、すべての民、諸族、あらゆる言葉がその方に仕える。その支配は取り去られることのない永遠の支配であり、その御国は滅びないであろう。わたしの魂は、わたしの体のうちで怯え、わたしの頭の幻はわたしを動揺させた。わたしは立っている者たちの中の一人に近づき、これらすべてのことについてその方から確かなことを問い求めた。その方はわたしに語り、その言葉の意味をわたしに示した。これらの大いなる獣は、地から消え去る四つの王国である。そして彼らは世の限りまで、いや、世々の世の限りまでも王権を受け取らない。それから、わたしは第四の獣について、まことに知りたいと望みました。それは、すべてのものを砕き、大いに恐るべきものであり、鉄の歯と青銅の爪を持ち、食べ、噛み砕き、残りを足で踏みつけた。そして頭の上の十の角、そして初めの三つの角が倒れたところから生え上がったもう一つの角について。この角には目と語る大いなる言葉の口があり、その姿はほかのものたちよりも大きかった。そしてわたしは、この角が聖なる者たちと戦い、彼らに打ち勝ったことを見た。日の老いたる者が来て、至高者の聖なる者たちの裁きを与えるまで。そして聖なる者たちが至高者の王権を受け取る時が来た。第四の獣について、わたしにはこう告げられました。地の上に第四の王国が生じるであろう。それはすべての王国を超え、全地を食い尽くし、踏みつけ、それを滅ぼす。十の角は、立ち上がる十の王である。彼らの後に来るもう一人は初めの者たちを悪さにおいて超え、三つの王を卑しめ、至高者に反対する言葉を語り、至高者の聖なる者たちを疲れさせ、日と時を変えようと考えるであろう。そして彼らは、時と、時代と、時代の半分まで彼の手に渡される。しかし裁きが座に着き、その支配は取り去られるであろう。それは滅ぼされ、終わりまで消し去られるためである。そして、天の下の王国の王権と支配と威厳は、至高者の聖なる民のために与えられ、彼らが世々限りなく統治するであろう。すべての支配は彼に服従し、聞き従うであろう」。ここに言葉の結びがあります。わたし、ダニエルは、この観りによって大いに震え、わたしの姿は変わった。しかしわたしは、これらのことを自分の心の中に留めました」（<a href="https://bibleox.com/ja/jp-ni/dan/7/#L9">ダニ. 7:9-28</a>）。</p><h2>32</h2><p>わたしがしばらく黙ると、トリュフォンが言いました。——これらのことと、これに類する聖書の箇所によって、わたしたちは、日の老いたる者から人の子として永遠の王国を受け取る、あの栄光ある偉大な方を待ち望んでいます。しかし、あなたたちがキリストと呼ぶこの方は栄えなく辱められ、神の律法の中で定められている、あの最も極端な呪いを受けるに至ったのです。十字架の上で磔にされたのですから。</p><p>もしわたしが、先に挙げた聖書から、その方の姿が栄えないこと、その由来が語り難いこと、その方の死のゆえに富める者たちが滅ぼされること、その傷によってわたしたちがいやされること、その方が羊のように引かれることを証明していなかったなら——そして、その方の到来が二つあること、一つはあなたたちがその方を磔にしたとき、もう一つは「あなたたちは、自分たちが刺し貫いた方を知るとき、あなたたちの部族は部族ごとに、女たちは女だけ、男たちは男だけ泣くであろう」（<a href="https://bibleox.com/ja/jp-ni/zah/12/#L12">ゼカ. 12:12-14</a>）というとき——、わたしの語ることが暗く未知のものであるように見えたでしょう。しかし今、わたしは対話の全過程を通して、あなたたちの聖なる預言の聖書からすべての証しを提示しています。主の恵みによって永遠の救いのために留められたあの種子の中から、あなたたちの中に誰かが見出されることを望みながら。しかし、この問いをあなたたちにいっそう明らかにするために、預言者ダビデによって語られたほかの言葉も挙げましょう。それらからあなたたちは、キリストが聖なる預言の霊によってさえ主と呼ばれていること、万物の主なる父がその方を地から上げ、最後に敵をその方の足の踏み台として置くまで、その方を自分の右の座に着かせることを知るでしょう。これは、わたしたちの主イエス・キリストが死者の中から復活して天に上げられたときから成就しています。しかし同時に、時は終わりへと近づいており、すでに、至高者に対して冒涜的で大胆な言葉を語り、ダニエルの言葉によれば「時と、時代と、時代の半分」（<a href="https://bibleox.com/ja/jp-ni/dan/7/#L25">ダニ. 7:25</a>）まで続く者が、門のところに立っています。そしてあなたたちは、彼がどれほどのあいだ続くかを知らないので、別様に考えています。あなたたちは「時」を百年としています。もしそうなら、無法の人間は少なくとも三百五十年統治することになります。ダニエルの言う「時代」をただ二つの時として受け取るなら。このことを言うことで、わたしは現在の主題から離れました。神があなたたちについて「無分別の子たちよ」と（<a href="https://bibleox.com/ja/jp-ni/vtor/32/#L20">申. 32:20</a>）、さらに「それゆえ、見よ、わたしはこの民にさらに驚くべきことをする。わたしは智慧ある人たちから智慧を取り去り、分別ある人たちの分別を隠す」（<a href="https://bibleox.com/ja/jp-ni/is/29/#L14">イザ. 29:14</a>）と語られたことを信じることによって、あなたたちが自分自身を、そしてあなたたちの言葉を聞くほかの人たちを惑わすことをやめ、キリストの恵みによって智慧を得たわたしたちから学ぶようになるためです。ダビデによって語られたこれらの言葉は次のとおりです。「主はわたしの主に仰せられた。わたしの右の座に座れ。わたしがあなたの敵をあなたの足台とするまで。主はシオンから力の杖をあなたに送られる。あなたの敵の中で統治せよ。あなたの力の日、聖なる光り輝きのうちに、あなたには権威がある。わたしはあなたを、明けの星の前に胎から生んだ。主は誓われ、悔い改められることはない。あなたはメルキセデクの位に従って、世々限りなく司祭である。主はあなたの右にいる。その方が怒りの日に王たちを砕く。民の間で裁き、死体で地を満たす。その方は道の上で泉から飲む。それゆえ、その方は頭を上げられるであろう」（<a href="https://bibleox.com/ja/jp-ni/ps/110/#L1">詩. 110:1-7</a>）。</p><h2>33</h2><p>——この詩篇を、あなたたちはエゼキヤ王についてのものだと解釈しようとしていることを知っています——とわたしは続けました。しかし、詩篇そのものの言葉から、あなたたちの迷いを今証明しましょう。「主は誓われ、悔い改められることはない」「あなたはメルキセデクの位に従って、世々限りなく司祭である」と語られています。エゼキヤは司祭ではなく、神の永遠の司祭でもなかったということでわたしたちに反論する勇気はあなたたちにはありません。そしてこれがわたしたちのイエスについて語られていることは、言葉そのものが示しています。しかし「あなたたちの耳は閉じられ、心は失明しています」（<a href="https://bibleox.com/ja/jp-ni/is/6/#L10">イザ. 6:10</a>）。「主は誓われ、悔い改められることはない」「あなたはメルキセデクの位に従って、世々限りなく司祭である」という言葉において、神は、あなたたちの不信のゆえに、誓いをもって、その方をメルキセデクの位に従って司祭と宣言されました。すなわち、モーセの言葉によれば、メルキセデクが至高者の司祭であり、しかも包皮のない人たちの司祭であり、自分のもとに十分の一を献げて来た割礼を受けたアブラハムを祝福したように、神は、自分の永遠の司祭——聖なる霊が主と呼ぶ方——が包皮のない人たちの司祭となることを宣言されたのです。そして割礼を受けた人たちのうち、その方のもとに来る者たち——すなわち、その方を信じ、祝福を求める者たち——を受け入れ、祝福されるであろう、と。そして、その方がまず謙虚な人として現れ、その後に高められることは、同じ詩篇の結びの言葉から見て取れます。「その方は道の上で泉から飲む」と。そしてその後に、「それゆえ、その方は頭を上げられるであろう」と。</p><h2>34</h2><p>あなたたちの聖書の理解の不足をさらに証明するために、聖なる霊がダビデに吹き込んだ、もう一つの詩篇を思い起こさせましょう。あなたたちはそれを、あなたたちの王であったソロモンについてのものだと考えていますが、それはわたしたちのキリストについても語られています。あなたたちは同音異義の言葉によって惑わされています。主の律法が「穢れのない」と呼ばれている場所では、あなたたちは、モーセの後に来るはずの律法ではなく、モーセ自身によって与えられた律法を考えています。しかし、神は「新しい律法と新しい契約」を与えることを約束されています。そして「神よ、あなたの裁きを王に」という詩篇を、あなたたちはソロモンについてのものとしています。彼が王であったからです。しかし、詩篇の言葉は明確に、永遠の王——すなわちキリスト——について宣べ伝えています。キリストは、王、司祭、神、主、御使い、そして人、軍勢の長、石、生まれ来る若者として呼ばれ、まず苦しみを負い、その後に天に上がり、再び栄光と共に来ること、そして最後に、永遠の王国を持つ方であると呼ばれているのですから。わたしはこれをすべての聖書からあなたたちに証明しています。そして、わたしが言ったことをあなたたちが理解できるように、詩篇の言葉を挙げましょう。次のとおりです。「神よ、あなたの裁きを王に、あなたの義を王の子に与えてください。その方はあなたの民を義をもって裁き、あなたの貧しい人たちを分別をもって裁くためです。山々は民のために平和を、丘は義を受け取るように。その方は民の貧しい人たちを裁き、貧しい人たちの子たちを救い、欺く人を卑しめられるであろう。その方は太陽と共に留まり、月の前に、世々限りなく。その方は毛の上の雨のように、地に滴る雫のように来られるであろう。その方の日々の中で、義は立ち上り、月が取り去られない限り、平和の豊かさが。そしてその方は海から海まで、川から地の果てまで統治されるであろう。エチオピア人たちはその方の前に倒れ、その方の敵たちは地を舐めるであろう。タルシシュの王たちは、島々は献げ物を持って来る。テバとサバの王たちは、献げ物を持って来る。そして地のすべての王たちはその方を拝し、すべての民はその方に仕える。なぜなら、その方は貧しい人を強い者から、貧しい人を助け手のない者から解放されたからです。その方は貧しい人と乏しい人を憐み、貧しい人たちの魂を救う。その方はその魂たちを欺きと不正から救い出す。そしてその方の名は彼らの前で尊ばれるであろう。そしてその方は生き、アラビアの黄金がその方に与えられるであろう。そして人たちはその方のために常に祈り、終日、その方を祝福するであろう。地の上には豊かな実りがあり、山々の頂にはその方は高く上げられるであろう。レバノンにはその実りが実り、地の草のように都の中で開花するであろう。その方の名は世々限りなく祝福され、太陽の前に、その名は留まるであろう。そして地の部族はすべて、その方によって祝福され、すべての民はその方を讃めるであろう。主なる神、イスラエルの神は祝福されています。ただその方だけが奇跡を行われる。そしてその方の栄光の名は、世々の世の限りなく祝福されます。そして全地はその方の栄光で満たされるであろう。そうなりますように、そうなりますように」（<a href="https://bibleox.com/ja/jp-ni/ps/72/#L1">詩. 72:1-20</a>）。この詩篇の終わりにはこう書かれています。「イッサイの子ダビデの祈りは終わった」。ソロモンが栄光ある偉大な王であったこと、そのときにいわゆるエルサレム神殿が建てられたことは知っています。しかし、詩篇の中で語られたことの何も、彼の上には成就しなかったことは明らかです。すべての王たちは彼を拝しませんでした。彼の王国は地の果てまで広がりませんでした。敵たちは彼の前に倒れて地を舐めませんでした。しかしわたしは、列王記の中に彼の業について書かれていることを引き合いに出す勇気があります。すなわち、彼は自分の妻を喜ばせるためにシドンの中で偶像礼拝しました。キリスト者である異邦人たちが、十字架につけられたイエスを通して万物の造り主なる神を知った後に行うのとは異なることです。彼らはむしろ、偶像に拝したり、偶像に献げられたものを食べたりするよりは、あらゆる苦しみと刑罰を、最後の息吹まで耐え抜く用意があります。</p><h2>35</h2><p>——しかし、とトリュフォンは反論しました。わたしは聞いています。イエスを告白し、キリスト者と呼ばれると言う多くの人たちが、偶像に献げられたものを食べ、それから何の害もないと主張している、と。</p><p>——確かに、そのような人たちがいます——とわたしは言いました。彼らは自分をキリスト者と宣言し、十字架につけられたイエスを主でありキリストであると認めながら、その方の教えではなく、偽りの霊たちの教えを宣べ伝えています。しかしこのことのゆえに、わたしたち、イエス・キリストの真で清い教えの弟子たちは、信仰において強く、その方が告げ知らせた望みにおいて堅固になります。なぜなら、その方の名によって行われるであろうとその方が預言されたことの成就を、わたしたちは自分自身で業の中に見ているからです。その方は言われました。「多くの人がわたしの名によって来る。外は羊の皮を着、内は貪欲な狼である」。「分裂と異端が起こるであろう」（<a href="https://bibleox.com/ja/jp-ni/1kor/11/#L19">１コリ. 11:19</a>）[5]。「偽りの預言者たちに注意しなさい。彼らはあなたたちのもとに来る。外は羊の皮を着、内は貪欲な狼である」。「多くの偽キリストが立ち上がり、信じる人たちの中の多くを惑わすであろう」（<a href="https://bibleox.com/ja/jp-ni/mf/24/#L5">マタ. 24:5</a>）。それゆえ、皆さん、イエスの名によって来て、無敬虔で冒涜的なことを語り行うようにと教えた人たちが、今も昔も多くいました。わたしたちは彼らを、その教えや意見が初めに由来した人たちの名によって知っています。彼らの各人は、それぞれの仕方で、万物の父と、その方の到来を前もって告げられたキリストと、アブラハムの神、イサクの神、ヤコブの神を褻るようにと教えるからです。わたしたちは彼らの誰とも交わりません。彼らが無敬虔で、不敬虔で、不正で無法な人たちであり、イエスを拝さず、ただ口においてのみその方を告白していることを知っているからです。彼らは自分をキリスト者と呼んでいます。異邦人たちが神の名を偶像の上に書き、無敬虔な無敬虔な秘儀に与るのと同じように。彼らの中のある人たちはマルキオン派と呼ばれ、ある人たちはヴァレンティノス派、ほかの人たちはバシリデス派、またある人たちはサトゥルニヌス派、あるいは別の名で呼ばれています。各人が自分の教えの祖から名を受け取っています。わたしが初めに言ったように、自分を哲学者と考える人たちの各人が、自分が従う哲学の教えの、学派の父の名を帯びることを必要と考えるのと同じように。それゆえ、わたしたちがイエスが自分の後に来るであろうことを知っていたことを確信するのは、これらのことからだけではありません。その方をキリストとして信じ告白する人たちについてその方が預言した、ほかの多くのことからもです。わたしたちの近い人たちによって殺されるときにわたしたちが耐える、まさにあの苦しみも、その方はわたしたちに預言されました。それゆえ、その方を、いかなる言葉や業によっても責めることはできません。それゆえ、わたしたちはあなたたちのためにも、そしてほかのすべての迫害者たちのためにも、あなたたちがわたしたちと共に悔い改め、キリストなるイエスを褻らないようにと祈ります。その方は、業によって、奇跡によって、今その方の名によって行われていることによって、教えの言葉によって、その方について預言された預言によって、全体において穢れのない無実のものとして証しされました。わたしたちは、あなたたちがその方を信じ、その方の将来の栄光ある到来のうちに救われ、その方によって火の中で裁かれないようにと祈ります。</p><h2>36</h2><p>——それでもよろしい、あなたの言うとおりにしましょう——とトリュフォンは反論しました。キリストが苦しむはずであったこと、その方が石と呼ばれたこと、そしてその方の第一の到来——預言されたとおり、苦しむ者として現れることになっていたもの——の後に栄光と共に来られ、その後にすべての人の裁き手、永遠の王であり司祭であることについて、預言があったとしましょう。しかし、これが預言されたその人なのかを証明しなさい。</p><p>——あなたの望みどおり、トリュフォンよ——とわたしは答えました。あなたが求めている証明は、そのべき場所で提出しましょう。しかし今は、まず、キリストが聖なる霊によって神、また万軍の主と呼ばれ、ヤコブという名で象徴的に呼ばれていることの証明のために、わたしが望む預言を挙げさせてください。あなたたちの解釈者たちは神の言葉によって「無分別な人たち」です。彼らは、これがキリストではなく、自分が建てた神殿の中に証しの幕屋を運び込んだときのソロモンについて語られていると主張していますから。ダビデの詩篇があります。「主のものである地とその満ちたところ、世界とその中に住む人たち。その方はそれを海の上にその基礎を置き、水の上にそれを堅められた。誰が主の山に上るでしょうか。あるいは誰がその方の聖なる場所に立つでしょうか。手は穢れなく、心は清い人、魂を空しく費やさなかった人、そして自分の隣人に偽りに誓わなかった人。その人は主から祝福を、神、自分の救い主から義を享受するであろう。これは、主を求める、ヤコブの神の顔を求める世代のものたちです。門よ、あなたたちの頭を上げよ。永遠の門よ、あなたたち自身が高く上げられるように。栄光の王が入るように。この栄光の王は誰か。力強く戦う主である。門よ、あなたたちの頭を上げよ。永遠の門よ、あなたたち自身が高く上げられるように。栄光の王が入るように。この栄光の王は誰か。万軍の主、その方こそ栄光の王である」（<a href="https://bibleox.com/ja/jp-ni/ps/24/#L1">詩. 24:1-10</a>）。万軍の主はソロモンではなく、わたしたちのキリストであることは、すでに証明されています。その方が死者の中から復活して天に上られたとき、神によって天に立てられた君主たちに、天の門を開くようにと命じられます。栄光の王が上るためです。そして、上られた後に、「父の右の座に着かれた。その方が敵をその足の踏み台として置かれるまで」と、ほかの詩篇の中で語られているとおりです（<a href="https://bibleox.com/ja/jp-ni/ps/110/#L1">詩. 110:1</a>）。天の君主たちは、その方が美しさと名誉と栄光のない姿を持つを見たので、その方を知らずに尋ねました。「この栄光の王は誰か」と。そして聖なる霊が、父の口を通して、あるいは自分自身の口を通して、彼らに答えました。「万軍の主、その方こそ栄光の王である」。誰も同意するでしょう。エルサレム神殿の門に立っていた人たちの中の誰も、ソロモンについて——この王がどれほど栄えていたとしても——、証しの幕屋について「この栄光の王は誰か」と言う勇気を持っていなかったことを。</p><h2>37</h2><p>そして第46の詩篇の中では——とわたしは続けました——キリストについてこう語られています。「神は歓呼の声と共に上られた。主は角笛の音と共に上られた。わたしたちの神を讃めよ、讃めよ。わたしたちの王を讃めよ、讃めよ。神は全地の王だからである。知恵のうちに讃めよ。神は民の上に王となり、神はその聖なる玉座に座しておられる。民の君主たちはアブラハムの神と共に集まった。地の強き者たちは、大いに高められたからである」（<a href="https://bibleox.com/ja/jp-ni/ps/47/#L6">詩. 47:6-10</a>）。そして第98の詩篇の中で、聖なる霊はあなたたちを責め、あなたたちが王として認めない方こそ、サムエルの、アロンの、モーセの、そしてほかのすべての人たちの主であり王であることを示します。詩篇の言葉は次のとおりです。「主が王となられた。民たちは怒るであろう。その方はケルビムの上に座しておられる。地は震えるであろう。主はシオンにおいて偉大であり、すべての民の上に高められる。彼らはあなたの偉大な名を告白するように。その方の名は恐るべきものであるから。そして王の名誉は裁きを愛する。あなたは公正なものを整えられ、ヤコブの中で裁きと義を行われた。わたしたちの主なる神を高めよ。その方の足の踏み台に拝せよ。その方は聖なる方だからである。モーセとアロンはその方の司祭たちの中にあった。サムエルはその名を呼び求める人たちの中にあった。彼らは主を呼び求めた。そしてその方は彼らに聞かれた。その方は雲の柱の中で彼らに語られた。彼らはその方の証しと、その方から与えられた命令を守った。主なる神よ、あなたは彼らに聞かれた。神よ、あなたは彼らに憐みを与え、彼らのすべての企てに対して仕返しされた。わたしたちの主なる神を高めよ。その方の聖なる山の上に拝せよ。主なる神は聖なる方だからである」（<a href="https://bibleox.com/ja/jp-ni/ps/99/#L1">詩. 99:1-9</a>）。</p><h2>38</h2><p>——わたしたちは、わたしたちの師たちが発した、あなたたちの誰とも対話せず、このような主題について問答しないようにという命令に聞き従うときには、善いことをしていました——とトリュフォンは反論しました。なぜなら、あなたは多くの不敬虔なことを語っているからです。あなたは、あの磔にされた方がモーセとアロンと共におられ、雲の柱の中で彼らに語られたこと、その後に人となり、磔にされ、天に上がり、再び地に来られること、そしてその方を拝すべきことを、わたしたちに説こうとしているのですから。</p><p>——わたしは知っています——とわたしは答えました。神の言葉の証しによれば、この造り主の、全能の神の大いなる智慧があなたたちから隠されていることを。それゆえ、わたしはあなたたちへの憐みから、あらゆる努力を尽くしています。あなたたちが、あなたたちにとって奇妙なわたしたちのこの教えを知るように。しかし、そうでなければ、少なくともわたしは裁きの日に無実であるでしょう。あなたたちは、より奇妙に見えるほかの教えも聞くことになるでしょう。心を乱さずに、むしろより快く聞き、探究しなさい。あなたたちの師たちの伝承を軽んじて。預言の霊は、彼らを、神の言葉を理解することができず、自分の教えを教えることにのみ努めていると責めているのですから。第44の詩篇の中では、同じようにキリストについて語られています。「わたしの心は良い言葉を泉のように注ぎ出した。わたしは自分の業を王に語る。わたしの舌は、速やかに書く書記官の筆である。あなたは人の子たちよりも姿において美しい。恵みがあなたの唇の上に注がれている。それゆえ、神はあなたを世々限りなく祝福された。力ある方よ、あなたの剣を自分の股に帯せよ。あなたの輝きと美しさによって。そして義のために、柔和のために、正義のために統治し、そしてあなたの右の御手があなたを不思議な仕方で導くように。力ある方よ、あなたの矢は鋭い。民はあなたの前に倒れるであろう。王の敵たちの心の中に。神よ、あなたの玉座は世々の世の限りなく。あなたの王国の杖は公正の杖である。あなたは義を愛し、不義を憎まれた。それゆえ、神、あなたの神は、あなたの同席者たちよりも喜びの油をもってあなたに油を注がれた。あなたの服はすべて、没薬と桂皮と菖蒲とを帯びて、象牙の家々から香り立つ。あなたを楽しみに包む王の娘たちの中で、あなたの右の座には、黄金の服を着た后がいる。娘よ、聞け、そして見よ。あなたの耳を傾けよ。そしてあなたの民と父の家を忘れよ。そして王があなたの美しさを望むであろう。なぜなら、その方こそあなたの主だからである。そして彼らはその方を拝するであろう。テュロスの娘たちは献げ物と共に来るであろう。民の富める人たちはあなたの顔を求めるであろう。王の娘のすべての栄誉は内にあり、黄金の縁取りで、彩りのうちに飾られている。彼女の乙女たちが王のもとに連れて行かれるであろう。彼女に近い人たちがあなたのもとに連れて行かれる。喜びと歓呼をもって連れて行かれるであろう。王の神殿の中に連れて行かれるであろう。あなたの父たちの代わりに、あなたの子たちが生まれた。あなたは彼らを全地の上の君主たちとされるであろう。わたしはあなたの名を世々に覚える。それゆえ、民たちはあなたを世々の世の限りなく讃めるであろう」（<a href="https://bibleox.com/ja/jp-ni/ps/45/#L2">詩. 45:2-18</a>）。</p><h2>39</h2><p>——あなたたちが、これらの言葉を理解するわたしたちを憎み、わたしたちがあなたたちの常に頑固な偏見についてあなたたちを責めるとしても、何ら驚くには当たりません——とわたしは続けました。エリヤさえ、神と対話しながら、あなたたちについてこう語っています。「主よ、彼らはあなたの預言者たちを殺し、あなたの祭壇を掘り倒しました。そしてわたしひとりだけが残っています。そして彼らはわたしの魂を求めています」（<a href="https://bibleox.com/ja/jp-ni/3ts/19/#L10">王上. 19:10</a>）。神は彼に答えられます。「わたしにはまだ七千人の人が残っています。バアルに膝を曲げなかった人たちです」（<a href="https://bibleox.com/ja/jp-ni/3ts/19/#L18">王上. 19:18</a>）。それゆえ、神があのとき、その七千人のために自分の怒りを抑えられたように、今も、その方は自分の裁きを下されず、下しておられません。その方を知っておられるからです。毎日、ある人たちがキリストなるその方の名によって弟子となり、迷いの道を離れることを。そしてその中の各人は、このキリストの名によって照らされ、その分に応じて賜物を受け取ります。一人は理性の霊を、ほかの人は助言の霊を、第三の人は力の霊を、ある人はいやしの霊を、ある人は予知の霊を、ある人は教えの霊を、またある人は神への恐れの霊を受け取るのです。</p><p>——知っておきなさい——とトリュフォンは言いました。そのように語ると、あなたは正気を失っている、と。</p><p>——聞きなさい、友人よ——とわたしは言いました。わたしは狂っていませんし、正気を失ってもいません。キリストが天への上昇の後に、わたしたちを迷いから、捕らわれた者たちとして解放し、賜物を与えることが預言されていました。これらの言葉です。「その方は高さに上られ、捕らわれを捕らえ、人間に賜物を与えられた」（<a href="https://bibleox.com/ja/jp-ni/ps/68/#L19">詩. 68:19</a>）。それゆえ、わたしたちは、高さに上られたキリストから賜物を受け取った者たちとして、預言の言葉から証明します。あなたたち——自分自身の中で智慧があり、自分の目の中で知識のある人たち——が狂人であり、ただ口においてのみ神とそのキリストを敬っていることを。そしてわたしたちは、全き真理の中で教えられた者たちとして、その方を自分の業によって、認識によって、心によって、死に至るまで敬っているのです。しかし、あなたたちは、おそらくそのほかに、その方をキリストとして認める勇気がないのです。聖書が示すとおりに。目に見える出来事と、その方の名によって行われる業が。あなたたちは、支配者たちからの迫害を恐れているからです。彼らは、偽りの偽りの霊、この蛇の働きによって、キリストの名を告白する人たちを、その方が再び来て、彼らすべてを砕き、各人にその分に応じて返されるまで、迫害し殺し続けるでしょう。</p><p>——今、証明してください——とトリュフォンは言いました。あなたの言葉によれば、磔にされ、天に上げられたその方が、神のキリストであることを。あなたはすでに、先に挙げた聖書の箇所によって十分に証明しました。キリストは苦しむはずであったこと、その方が再び栄光と共に来られること、すべての民の上の永遠の王国を受け取ること、すべての支配がその方に服従すること。しかし証明してください。あなたたちのイエスがまさにその方であることを。</p><p>——皆さん、耳を持つ人たちにとっては、これはすでに、あなたたち自身が認めていることからさえ証明されています。しかし、わたしが難渋していて、求められた証明を提出できないと、あなたたちが考えないように、約束したとおり、そのべき場所でこれを行いましょう。そして今は、始めた語りの継続に移ります。</p><h2>40</h2><p>それゆえ、神が過越祭として殺すようにと命じられた小羊の神秘は、キリストの前型でした。その血によって、信じる人たちは、その方への信仰の分量に応じて、自分の家——すなわち自分自身——に油を注ぐのです。神が造られたあの像、すなわちアダムは、神の息吹の住まいでした。これはあなたたちみなも理解できるでしょう。そして、小羊についてのこの命令も時のためのものであったことは、次のように証明します。神は、どこでも、過越の小羊を殺すことを許されたのは、ただ「その名が呼び出された」場所だけでありました。その方は知っておられたからです。キリストの受難の後には、エルサレムの場所があなたたちの敵に渡される日々が来ること、そして一般にすべての供え物が止むことを。全体を焼くようにと命じられた小羊は、キリストが受難するはずであった、あの十字架の受難の象徴でした。小羊を焼くとき、それが十字架の形に置かれるからです。一本の串がその直後を、下の端から頭へと通ります。そしてもう一本が肩の上を横切ります。小羊の前脚がそれに結ばれているのです。同じように、断食のときの二頭の山羊——命令は同じであり、一頭は放され、もう一頭は殺されました——は、キリストの二重の到来を告げ知らせました。第一の到来——あなたたちの民の長老たちと司祭たちが、その方を追放の山羊として引き出し、その方の上に手を置き、殺したとき。そして第二の到来。あなたたちは、同じエルサレムの場所で、自分たちが辱めた方を知ることになるでしょうから。その方は、悔い改めを望む、そしてイザヤが命じた断食を守る——すなわち、暴力的な契約の縄目を断ち切り、預言者が数え、わたしが言及した命令を守る人たち——すべての罪人のための供え物でした。イエスを信じる人たちが行っていることです。そしてあなたたちは知っています。断食のときに献げる二頭の山羊のこの供え物も、エルサレムのほかの場所では行うことが許されていないことを。</p><h2>41</h2><p>そして小麦の粉の供え物——らい病人から清められた人たちのために献げるようにと命じられたもの——は、わたしたちの主イエス・キリストが、人々のために負われた受難の記憶のために献げるようにと命じられた、聖体のパンの前型でした。わたしたちがあらゆる罪から自分の魂を清める間に。そして同時に、わたしたちが神に感謝するためでもあります。神が人間のために世界とその中にあるすべてを造られたことのために、そしてわたしたちが置かれていた罪からわたしたちを解放し、その方の御心に従って苦しめられた方を通して、支配と権力を完全に砕かれたことのために。それゆえ、神は、あなたたちがそのとき献げていた献げ物について、先に言ったとおり、十二預言者の中の一人マラキを通して言われます。「わたしはあなたたちを願わない、と主は言われる。そしてあなたたちの手からあなたたちの献げ物を受け取らない。日の昇るところから日の没するところまで、わたしの名は民の中で大きくされ、すべての場所において、香料と清い献げ物がわたしの名に献げられるからである。わたしの名は民の中で偉大である、と主は言われる。しかし、あなたたちはそれを穢している」（<a href="https://bibleox.com/ja/jp-ni/mal/1/#L10">マラ. 1:10-11</a>）。そしてわたしたち異邦人たちが、すべての場所で献げる献げ物——すなわち聖体のパンと、また聖体の杯——についても、その方はそのときすでに預言しておられ、わたしたちがその方の名を大きくし、あなたたちがそれを穢することを付け加えています。そして、生まれたばかりの子どもたちは必ず第八日のうちに割礼を受けるようにという、割礼についての命令は、真の割礼の前型でした。わたしたちは、この割礼によって、迷いと罪から切り離されたのです。わたしたちの主イエス・キリストを通して。その方は週の初めの日に、死者の中から復活されました。なぜなら、週の初めの日には、すべての日の中で最初の日でありながら、しかしすべての日の循環のうちに数えられるときには、第八日と呼ばれ、なお第一であり続けるからです。</p><h2>42</h2><p>大司祭の長い服に、命令に従って垂れ下がっていた十二の鈴は、十二の使徒の象徴でした。彼らは永遠の司祭キリストの力によって堅くされ、その声は、神とそのキリストの栄光と恵みをもって、全地を満たしたのです。それゆえ、ダビデは言います。「その声は全地へと渡り、その言葉は世界の果てまで」（<a href="https://bibleox.com/ja/jp-ni/ps/19/#L5">詩. 19:5</a>）。またイザヤも、あたかも使徒たちの口を通すかのように——彼らがキリストに、人たちは彼らの告げ知らせではなく、彼らを遣わされた方の力によって信じたと語るとき——叫びました。「主よ、誰がわたしたちの耳に聞いたことを信じましたか。主の腕が誰に現されたでしょうか。わたしたちは彼の前で、幼い子として、飢えた地の中の根として告げ知らせました」と（<a href="https://bibleox.com/ja/jp-ni/is/53/#L1">イザ. 53:1-2</a>）——そして先にわたしが挙げた預言のほかの言葉を。「わたしたちは彼の前で告げ知らせました」という、多くの人たちの口を通すかのように語られた言葉は、「幼い子として」という付け加えと共に、悪い人たちがその方の僕たちとなり、その方の命令に聞き従うこと、そしてすべてが一人の若い子のようになることを示しています。これは体においても見ることができます。その中には多くの部分があると考えられていますが、それらはすべて共に一つの体と呼ばれ、一つの体であるからです。同じように、数において多くの人たちから成り立っているけれども、一つの全体を形成している民と教会は、一つの名によって示され、呼ばれます。それゆえ、皆さん——とわたしは続けました——モーセのほかのすべての設けを列挙しながら、それらが、キリストの上に起こるはずであったこと、その方への信仰が前もって知られていた人たち、そしてキリストご自身が成し遂げるはずであった業の、前型であり、象徴であり、告げ知らせであったことを証明することができたでしょう。しかし、わたしが列挙したもので十分だと考えるので、順序に従って語りを続けます。</p><h2>43</h2><p>それゆえ、もしあなたたちの民のかたくなさのゆえに、割礼がアブラハムから始まり、安息日と献げ物と供え物と祭りがモーセの時代から始まったことが証明されているなら、これらすべては、神の子キリストの到来——その方は父の意志によって、アブラハムの家系から、おとめから、ユダとダビデの部族から生まれ、永遠の律法として、全世界のための新しい契約として来られると預言された方——と共に止まるはずであったでしょう。先に挙げた預言から見て取れるとおりです。そして、この方を通して神のもとに来たわたしたちは、肉の割礼ではなく、霊的な割礼を受け取りました。ハノクとほかの人たちが守っていたあの割礼です。わたしたちは、神の憐みによって、洗礼を通してこれを受け取りました。わたしたちは罪ある人たちであったからです。そして同様に、すべての人も同じようにこれを受け取ることができます。今、わたしは、わたしたちの注意を引く、キリストの誕生の神秘に向かいます。キリストご自身の由来——それが人たちにとって語り難いことについて——イザヤは、すでにわたしが挙げたように、こう語りました。「誰がその方の由来を語るのか。その方の命は地から取り去られたからである。その方は、わたしの民の罪のゆえに死に渡された」（<a href="https://bibleox.com/ja/jp-ni/is/53/#L8">イザ. 53:8</a>）。これらの言葉の中で、預言の霊は、その方の由来が語り難いことを語りました。その方が、わたしたち人間——罪人——がその方の傷によっていやされるために死ななければならなかった方だからです。さらに、その方を信じる人たちが、その方がどのように生まれ、世界に来るかを知ることができるように、預言の霊は、同じイザヤを通して、その方の誕生について預言しました。「そして主は再びアハズに語られました。あなたの神なる主から、しるしを自分のために求めなさい。深くから、あるいは高くから、と。そしてアハズは言った。わたしは求めず、主を試みません、と。イザヤは言った。聞きなさい、今や、ダビデの家よ。人たちを疲れさせることはあなたたちにとって少ないことでしょうか。なぜあなたたちは神をも疲れさせるのですか。それゆえ、主ご自身があなたたちにしるしを与えます。見よ、おとめは腹の中に孕み、子を生むであろう。そしてその方の名はインマヌエルと呼ばれるであろう。乳と蜜をその方は、悪を退けること、あるいは善を選ぶことを知る前に食べるであろう。その子が悪と善を区別する前に、その方が悪を退け、善を選ぶためである。その子が父を、あるいは母を呼ぶことを知る前に、その方はアッシリアの王の前に、ダマスコの力の財産とサマリヤの戦利品を取るであろう。そして、二人の王のゆえに、あなたが耐えがたく思っている地は捨てられるであろう。しかし神は、あなたの上に、あなたの民の上に、父の家の上に、エフライムがユダから分離された時から、あなたの上に来たことのない日々をもたらされるであろう。アッシリアの王を」（<a href="https://bibleox.com/ja/jp-ni/is/7/#L10">イザ. 7:10-17</a>）。アブラハムの肉の子孫の中で、おとめから生まれたと語られた人は、かつて誰もいませんでした。これはすべての人に知られています。しかし、あなたたちと、あなたたちの師たちが、イザヤの預言の中では「見よ、おとめは腹の中に孕む」とは語られておらず、「見よ、若い女は孕み、子を生む」と語られていると言い、さらにこの預言を、あなたたちの王であったエゼキヤに帰す勇気を持っているので、わたしは、あなたたちを責めるために、短い言葉の中でこれを説明し、わたしたちがキリストとして認める方について語られていることを証明しようと努めます。</p><h2>44</h2><p>このように振る舞うことで、わたしはあなたたちに対して完全に正しいことになります。わたしは証明によってあなたたちを説こうと努めているのですから。しかし、もしあなたたちが心をかたくなに留めるか、キリスト者たちに定められている死の恐れのゆえに、自分の決定において迷っていて、真理を認めたくなければ、あなたたちは自分自身の滅びにおいて罪を負うことになるでしょう。そして、あなたたちがアブラハムの肉の種子であるという根拠から、神がキリストを通して与えると約束された善いものを継ぐと考えるなら、あなたたちは自分自身を欺いています。ただ、霊においてアブラハムの信仰に似せられ、すべての神秘を知った人たちだけが、これらの善いものの中の一つを受け取ります。わたしは意味しています。ある命令は敬虔と正しい生き方のために与えられ、ほかの命令と儀礼は、キリストの神秘に対する関係において、あるいはあなたたちの民のかたくなさへの配慮において命じられたことを。これがそうであることは、神ご自身がエゼキヤの中で示しています。「ノアとヤコブとダニエルが、子たちあるいは娘たちのために願い出るなら、彼らに与えられない」（<a href="https://bibleox.com/ja/jp-ni/iez/14/#L14">エゼ. 14:14</a>）。そしてこの同じ思想をイザヤの中でこう語ります。「主なる神は言われた。彼らは出て行き、わたしに逆らった人たちの死体を見るであろう。なぜなら、彼らの虫は死なず、彼らの火は消えないであろう。そして彼らはすべての肉に対する見せしめとなるであろう」（<a href="https://bibleox.com/ja/jp-ni/is/66/#L24">イザ. 66:24</a>）。それゆえ、あなたたちは、自分たちの魂の中でこのような望みを断ち切った後、どのような道を通して自分の罪の赦しと、約束された善いものの遺産への望みを受け取ることができるかを知ろうと努めるべきです。そして、この道のほかには道はありません。すなわち、わたしたちのキリストを知り、イザヤが告げ知らせた、罪の赦しのためのあの洗礼で洗礼を受けること。そしてその後に、罪なしに生きること。</p><h2>45</h2><p>——わたしが、あなたの考えるには、事柄を明らかにするために必要な言葉を中断しているとしても——とトリュフォンは言いました——まず、わたしの魂の中で満ちあふれている問いを提出させてください。そしてその解決を望んでいます。</p><p>——好きなだけ尋ねなさい——とわたしは言いました。あなたに浮かぶものを、何でも。そして、あなたの問いと答えの後にも、わたしは自分の証明を再開し、終えるように努めます。</p><p>——わたしに言いなさい——とトリュフォンは尋ねました。モーセによって与えられた律法に従って生きた人たちは、ヤコブ、ハノク、ノアのように、死者の復活のうちに生きるのでしょうか、それとも生きないのでしょうか。</p><p>——皆さん——とわたしは答えました——わたしがエゼキヤの言葉を挙げたとき——「ノアとダニエルとヤコブが、子たちと娘たちのために願い出るなら、彼らに与えられない」（<a href="https://bibleox.com/ja/jp-ni/iez/14/#L14">エゼ. 14:14</a>）——しかし、各人は明らかに、自分自身の義によって救われる——、わたしは、モーセの律法に従って生きた人たちも救われると言いました。なぜなら、モーセの律法の中では、それに聞き従う人たちに、本性において良いもの、聖なるもの、正しいものを行うように命じられているからです。そしてその上で、民のかたくなさのゆえに律法されたものを行うようにと命じられています。律法の下にあった人たちはこれを行いました。それゆえ、普遍的で、本性的な、永遠の善を行った人たちは神に喜ばれるので、彼らもまた、その前に生きた正しい人たち、ノア、ハノク、ヤコブ、ほかの人たちと同じように、復活のときには、わたしたちのキリストを通して救われるでしょう。キリストを、明けの星と月の前に存在し、その後に受肉し、ダビデの家系からのおとめから生まれることを喜ばれた神の子として認めた人たちと共に。あのような経営によって、初めから狡猾に振る舞っていた蛇と、それに似せられた御使いたちに打ち勝つためです。死が踏まれ、キリストの第二の到来のときには、その方を信じ、その方に喜ばれるように生きている人たちに対して完全にすべての力を失い、その後には存在しなくなるように。一部の人たちは、裁きと火の判決の中で、絶えず苦しまされるために送られ、ほかの人たちは、苦しみと朽ちることから解放され、悲しみなく、不死のうちに、共に生きるでしょうから。</p><h2>46</h2><p>——しかし、もし誰かが今も——とトリュフォンはわたしに尋ねました——モーセの律法に従って生きたいと望み、共にこの十字架につけられたイエスを信じ、その方が神のキリストであり、すべての人を裁く権威を与えられ、その王国が永遠であることを認めるなら、そのような人も救われることができますか。</p><p>——共に考えましょう——とわたしは言いました。今もモーセによって命じられたすべてのものを守ることが必要かどうかを。</p><p>——いいえ——とその人は答えました。わたしたちは、あなたが言ったように、過越の小羊をどこかほかの場所で殺すことも、断食のときに山羊たちを命じられたとおりに献げることも、すべてのほかの献げ物もできないことを知っています。</p><p>——それなら、自分で言いなさい、願わくは——とわたしは言いました。どのような設けを守ることができるでしょうか。そうすれば、あなたたちは納得するでしょう。これらの永遠の設けを守らず、行わずに、完全に救われることが可能であることを。</p><p>——わたしたちは、安息日を守ることができます——とその人は答えました。割礼を受け、月を守り、モーセによって禁じられたものに触れたなら、あるいは性的な交わりの後に、身を洗うことができます。</p><p>——それなら——とわたしは反論しました——あなたたちの考えでは、アブラハムとイサクとヤコブとノアとヨブと、彼らの前に生きた、そして後に生きた、彼らに似たほかの正しい人たちは——すなわち、アブラハムの妻サラ、イサクの妻リベカ、ヤコブの妻ラケルとレア、そしてほかのそれに似た女たち、神の忠実な僕モーセの母にまで——救われることができますか。彼らは、これらの何ものも守りませんでした。</p><p>——アブラハムとその子孫たちは割礼を受けなかったのですか——とトリュフォンは答えました。</p><p>——知っています——とわたしは言いました。アブラハムとその子孫たちは割礼を受けました。そしてなぜ彼らに割礼が与えられたかについては、わたしは先にくわしく説明しました。そして、もしこれまでの言葉があなたたちを説かないなら、この主題をさらに探究します。あなたたちは知っています。モーセの前には、正しい人は誰も、今わたしたちの間で語られているこれらの設けの中の一つも守るための命令を守らず、受け取りませんでした。アブラハムから始まった割礼を除いては。</p><p>——知っています——とその人は言いました。そして、彼らが救われることを認めます。</p><p>——理解してください——とわたしは再び言いました——これらすべての類の命令は、モーセを通して、あなたたちの民のかたくなさのゆえに、神からあなたたちに与えられました。すなわち、あなたたちが、これらの数多くの設けを通して、あらゆる業において常に神を自分の目の前に置き、無敬虔な不敬虔な業に決心しないようにするためです。神はあなたたちに、自分の身に赤い布片を着るようにと命じられました。それを通して神を忘れないためです。そしてさらに、文字が描かれた、小さな羊皮紙の破片からなるアマレットを着けるようにと命じられました。それらの文字は、もちろん、わたしたちが考えるには、聖なるものでした。これは神の側からは、その方についての絶え間ない記憶へのあなたたちの喚起であり、同時にあなたたちの魂の中での責めでもありました。しかし、あなたたちは神への礼拝の記憶を少しも保ちませんでした。むしろこれを通して、偶像に仕えないようにと説かれることさえありませんでした。エリヤの時代には、バアルに膝を曲げなかった人たちを数えるとき、神はただ七千人だけを名指ししました。そしてイザヤの書の中では、あなたたちが自分の子どもたちを偶像への献げ物として献げたことであなたたちを責めています。しかし、わたしたちは、かつて献げ物を献げていたものたちに献げ物を献げないことのゆえに、最も恐ろしい苦しみを耐え、殺されるときには歓びます。神が自分のキリストを通してわたしたちを生き返らせ、苦しみから解放された、朽ちない不死のものとするという信仰の中で。しかし、わたしたちは知っています。あなたたちの民のかたくなさのゆえに与えられた設けは、義と聖性には何の役にも立たないことを。</p><h2>47</h2><p>——しかし、救われるでしょうか——とトリュフォンは再び尋ねました。これが正しいと自覚しながら、このキリストを認め、この方を信じ、聞き従い、その上で、これらの設けを守ることも望む人は。</p><p>——わたしの考えるには、トリュフォンよ——とわたしは言いました——そのような人は救われるでしょう。ただし、同じものを守るように、ほかの人たち——すなわち、キリストを通して迷いから割礼された異邦人たち——を、あらゆる仕方で引きずろうと努めず、また、あの設けを守らないなら、彼らは救われ得ないと主張しなければ。ちょうどあなたが対話の初めにしたように。すなわち、わたしがそれらを守らなければ救われないと言ったときに。</p><p>——なぜあなたは言ったのですか。「わたしの考えるには、そのような人は救われるでしょう」と。そのような人たちにとって救いが不可能であると言う人たちがいるのですか。</p><p>——います、トリュフォンよ——とわたしは答えました。彼らは、そのような人たちとの対話においても、食事においてもさえ交わりを持つことを恐れます。しかし、わたしは彼らに同意しません。もし誰かが霊の弱さのゆえに、今守ることができるモーセの設けの中のいくつかを守りたいと望むなら——わたしの考えでは、それらはあなたたちのかたくなさのために与えられたものです——それと同時にキリストに望みを置き、正義と聖性の永遠で本性的な掟を行うなら、キリスト者たちと、信じる人たちと共に生きるなら、しかし、わたしがすでに言ったように、彼らに、自分自身のように割礼を受け、安息日を守るなど、引きずらないなら——そのような人たちを受け入れ、親戚や兄弟として、彼らとすべての点で交わりを持つべきだとわたしは考えます。しかし、トリュフォンよ、もしあなたたちの種族の中の誰かが、このキリストを信じると言いながら、キリストを信じた異邦人たちに、モーセの律法に従って生きるように、あらゆる仕方で強いるか、あるいは彼らとの生における交わりを望まないなら、そのような人たちをわたしも受け入れません。しかし、キリストなる神の告白と律法の守りを結び付けるように、彼らによって説かれた人たちは、救われることができるとわたしは考えます。しかし、その方を信じ、キリストと認めた後に、何らかの理由でユダヤの律法へと立ち帰り、キリストを退け、死の前に悔い改めなかった人たちは、わたしの考えるには、決して救われません。また、アブラハムの種子から出て来た、律法に従って生きる人たちのうち、自分の死の前にこのキリストを信じなかった人たちも救われません。特に、このキリスト自身を信じる人たちを呪い、救いに至り、火の刑罰から解放されるために呪い続けている人たち。憐み、人間愛、神の憐みの測り知れない豊かさは——エゼキヤの言葉によれば——罪を悔いる人を、正しい穢れのない人として受け取ります。しかし、敬虔から、あるいは義から不敬虔と無法へと落ちる人を、罪人、不正な人、不敬虔な人として認めます。それゆえ、わたしたちの主イエス・キリストは言われたのです。「わたしがあなたたちを見出す点において、その点においてわたしはあなたたちを裁く」[6]。</p><h2>48</h2><p>——今、わたしたちは知りました——とトリュフォンは言いました——このことについてのあなたの意見を。あなたの語りを、あなたが立ち止まったところから再開し、それを終えなさい。それはわたしには奇妙に見えます。証明することは全く不可能に見えます。あなたは、このキリストが世の前に存在する神であり、その後に生まれることを喜ばれ、人となられたと言っています。そして、その方が人たちから生まれたただの人間ではない、と。これはわたしには奇妙であるばかりでなく、不合理に見えます。</p><p>——わたしは知っています——とわたしは答えました——これが奇妙に見えるのは、特に、あなたたちの種族の中の、その方たちが神聖なものを理解し、行うことを決して望まず、あなたたちの教師たちの伝承だけに従ってきた人たちにとって。神ご自身がこれを告げ知らせておられるのですから。しかし、トリュフォンよ——とわたしは続けました——わたしの証明は、その方が神のキリストであるという点で、無益ではありません。たとえわたしが、その方が神であるとして、初めから、万物の造り主の子として存在し、おとめから人として生まれたことを証明できなかったとしても。しかし、その方が神のキリストであることが完全に証明されたすぐ後に、このキリストが誰であっても——たとえわたしが、その方が前に存在し、父の意志によって、わたしたちに似せられた、肉を持つ人として生まれることを喜ばれたと証明できなくても——この最後の点においてのみ、わたしが迷っていると言うのは正当なことです。しかし、その方が、人たちから生まれた人間としてあなたたちの前に提示され、その方が選びによってキリストとなったことが証明されるなら、その方がキリストであることを否定するのは不当です。わたしたちの種族の中には、皆さん——とわたしは語りました——その方をキリストと認めながら、その方を、人たちから生まれたただの人間と呼ぶ人たちがいます。わたしは彼らに同意しませんし、同意することもないでしょう。たとえわたしと同じ考えを持つ大多数がこれを語るようになっても。キリストご自身が、わたしたちに、人間の教えを信じるのではなく、至福ある預言者たちによって告げ知らせれたもの、そしてその方ご自身が授けたものを信じるようにと命じられたのですから。</p><h2>49</h2><p>——わたしの考えるには——とトリュフォンは言いました——その方が人であり、選びによって油注がれ、キリストとなったと主張する人たちのほうが、あなたたちが教えているように考える人たちよりも正しいことを語っています。わたしたちは皆、キリストが人たちからの人間になるであろうこと、そして来られるときにエリヤによって油注がれることを待ち望んでいるのですから。それゆえ、もしあなたたちが語る方がキリストであることが明らかになるなら、その方を、人たちから生まれた人間として完全に認めなければなりません。そして、エリヤがまだ来ていないので、わたしはその方をキリストとしても認めません。</p><p>——しかし、神の言葉はゼカリヤを通して、エリヤが、あの偉大で恐るべき主の日の前に来るように語ってはいませんか——とわたしは再び尋ねました。</p><p>——もちろんそのとおりです——とその人は答えました。</p><p>——それなら、神の言葉がわたしたちに認めるように強いるなら——預言に従って、キリストの二つの到来があるはずであること、一つはその方が苦しむ者として、栄えなく、姿のないものとして現れるとき、もう一つは、すべての人の裁き手として栄光のうちに来られるとき——これが先に挙げた聖書の箇所から証明されているなら——わたしたちは、神の言葉が、エリヤを、恐るべき偉大な日の前駆者として告げ知らせたことを認めるべきではないでしょうか。すなわち、その方の第二の到来の前駆者として。</p><p>——はい——とトリュフォンは答えました。</p><p>——そしてわたしたちの主は——とわたしは言いました——その教えの中で、同じことであると教えました。エリヤも来るであろうと言われたとき。そしてわたしたちは、これが成就することを知っています。わたしたちの主イエス・キリストが栄光と共に天から来られるとき。その方の最初の現れの前にも、前駆者がありました。すなわち、エリヤのうちにあった神の霊が、後に、あなたたちの民の中の預言者ヨハネを通して働いたのです。その人の後には、あなたたちの中に、ほかの預言者は現れませんでした。その人はヨルダンの川のところに座りながら、叫びました。「わたしは悔い改めのためにあなたたちに水で洗礼を施します。しかし、わたしよりも強い方が来られます。その方の履物を担ぐのにわたしはふさわしくありません。その方は、あなたたちに聖なる霊と火で洗礼を施されるであろう。その方の手には箕があり、その方は自分の脱穀場を整え、小麦を倉に集め、藁を消えることのない火で焼くであろう」（<a href="https://bibleox.com/ja/jp-ni/mf/3/#L11">マタ. 3:11-12</a>）。この預言者ご自身を、あなたたちの王ヘロデが牢の中に投れました。そして、その方の誕生の日の祝いの間に、その方の兄弟の娘が舞踊によってその方を喜ばせたとき、彼は、彼女が何でも望むものを求めることを許しました。母は少女に、牢の中にいるヨハネの頭を求めるようにと教えました。そして彼女の願いのゆえに、王は、皿の上にヨハネの頭を持って来るようにと送り命じました。それゆえ、わたしたちのキリストも、まだ地の上に生きておられたとき、キリストの前にエリヤが来るはずだと主張する人たちにこう語られました。「エリヤは来るであろう。そしてすべてを整えるであろう。しかし、わたしはあなたたちに言う。エリヤはすでに来た。そして彼らはその方を知らず、自分たちが望むことをその方に対して行った」。そしてさらにこう書かれています。「そのとき、弟子たちは、その方が彼らに、洗礼者ヨハネについて語っておられることを理解しました」（<a href="https://bibleox.com/ja/jp-ni/mf/17/#L11">マタ. 17:11-13</a>）。</p><p>——奇妙にわたしには思えます——とトリュフォンは言いました——あなたが語っていること。すなわち、エリヤのうちにあった神の預言の霊が、ヨハネのうちにもあったということを。</p><p>——しかし、あなたは考えないのですか——とわたしは答えました——同じことが、モーセの後に民の指導権を受け取った、ナベの子イエスの場合にも起こったことを。神ご自身がモーセに、イエスの上に手を置くようにと命じられ、言われたときに。「そしてわたしは、あなたのうちにある霊から取り、それをその人の上に置くであろう」（<a href="https://bibleox.com/ja/jp-ni/chis/27/#L18">民. 27:18</a>）。</p><p>——もちろん考えます——とその人は言いました。</p><p>——それなら——とわたしは続けました——神がモーセの生前に、モーセのうちにあった霊から取り、イエスの上に置かれたなら、同じように、エリヤからヨハネへと移すこともできたでしょう。キリストが第一の到来のときに栄えない姿で現れたように、エリヤのうちに常に清さの中で留まっていた霊の最初の現れも、キリストの到来のように、栄えないものとして現れるためです。「主は隠された御手をもってアマレクに対して戦われる」と語られているからです（<a href="https://bibleox.com/ja/jp-ni/ish/17/#L16">出. 17:16</a>）[7]。そして、あなたたちはアマレクが倒れたことを否定しません。しかし、アマレクはキリストの栄光ある到来のときにだけ打たれると言うなら、聖書の実りは何でしょうか。そこでは「主は隠された御手をもってアマレクに対して戦われる」と語られているのです。それゆえ、あなたたちは理解できます。神の隠された力が、磔にされたキリストのうちにあったことを。その方を霊たちも震えさせるのです。地上のすべての支配と権力も。</p><h2>50</h2><p>——わたしの考えるには——とトリュフォンは言いました——あなたは、すべての争われている主題について、多くの人たちとの問答の中にしばしばいたので、今では、何を尋ねられてもすべてに答えることができるのですね。それなら、まず、どのようにして、万物の造り主のほかに、もう一つの神が存在することを証明するかについて答え、その後に、その方がおとめから生まれたことを証明してください。</p><p>——まず、わたしに——とわたしは答えました——わたしたちの主イエス・キリストのためにヨハネ、洗礼者であり預言者が成し遂げた、前駆者の奉仕に関わる、イザヤの預言からいくつかの箇所を挙げさせてください。</p><p>——同意します——とその人は言いました。</p><p>——イザヤは——とわたしは言いました——ヨハネの前駆についてこう語っています。「エゼキヤはイザヤに言った。主の言葉は良い。その方が語られた言葉は良い。わたしの日々の中に平和と真実があるように」（<a href="https://bibleox.com/ja/jp-ni/is/39/#L8">イザ. 39:8</a>）。そして「民を慰めよ。司祭たちは、エルサレムの心に語り、それを慰めよ。その低めは成し遂げられ、その罪は赦されたからである。主の御手から自分の罪の二倍を受け取ったからである。荒野の中で呼び求める者の声。主の道を整えよ。わたしたちの神の路を真っ直ぐにせよ。すべての谷は満たされ、すべての山と丘は低められるであろう。そして曲がったものはすべて真っ直ぐになり、でこぼこなものは平坦な道となるであろう。主の栄光は現れ、すべての肉は神の救いを見るであろう。主が語られたからである。語る者の声。告げ知らせよ。わたしは言った。何を告げ知らせましょうか。すべての肉は草であり、すべての名誉は草の花のようである。草は枯れ、その花は落ちた。しかし主の言葉は世々限りなく留まる。シオンの告げ知らせる者よ、高い山の上に上れ。力をもって自分の声を高めよ。エルサレムの告げ知らせる者よ。高めよ、恐れるな。ユダの都たちに言え。見よ、あなたたちの神である。見よ、主なる神は力と共に来られる。その方の腕はその支配と共に。見よ、その方の報いはその方と共に、その方の業はその方の前に。その方は羊飼いのように自分の群れを養い、その腕をもって小羊たちを集め、腹の中にいる者を慰めるであろう。誰が手をもって水を量ったでしょうか。天を一投の目測で、全地を一握りで。誰が秤で山たちを、分銅で丘たちを告知したでしょうか。誰が主の精神を知り、誰がその方の助言者となり、その方を教えたでしょうか。あるいは、その方と誰が相談し、誰がその方に分別を与えたでしょうか。あるいは、誰がその方に裁きを教えたでしょうか。あるいは、誰がその方に理解の道を開いたでしょうか。すべての民は桶からの一雫のように、分銅の傾きとみなされ、唾としてみなされるであろう。レバノンは焼くには足りず、四足のものは焼燔の献げ物には足りない。すべての民は無に等しく、無とみなされた」（<a href="https://bibleox.com/ja/jp-ni/is/40/#L1">イザ. 40:1-17</a>）。</p><h2>51</h2><p>わたしが語りを止めたとき、トリュフォンは言いました。——あなたが挙げた預言の言葉は、皆さんよ、両義的であり、あなたが証明したいことの証明には何も決定的なものを持っていません。</p><p>——もしあなたたちの種族の中で、ヨハネの後に預言者たちが止まず、今日もいたなら、トリュフォンよ、これらの言葉は両義的なものとして現れたでしょう。しかし、ヨハネが、人たちに悔い改めを告げ知らせるためにキリストの前に来たなら、キリストが、彼がヨルダンの川のところに座っていたときに彼のもとに来て、彼の預言と洗礼を終え、ご自身が福音を告げ知らせ始められたなら——天の御国が近づいたと、そして、書記官たちとパリサイ人たちから多くのことを苦しむはずであり、磔にされ、第三の日に生き返るはずであること、再びエルサレムに現れ、再び自分の弟子たちと共に食べ、飲むことを語られたなら——そして、その方の到来までの間に、異端と偽りの預言者がその方の名のもとに現れること、そしてこれは明らかにすでに成就していることを語られたなら——もしこうであるなら、どのようにしてなお疑うことができるでしょうか。あなたたちは業そのものによって納得することができるのですから。その上で、その方は語られました。あなたたちの種族の中では、もはや一人の預言者も存在しないこと。そして人たちは、神がいつか設けることを約束されたあの新しい契約——すなわち、その方キリスト——がすでに来たことを知ることになるでしょう。その方の言葉はこうです。「律法と預言者は、洗礼者ヨハネのときまでであった。それからこの時から、天の御国は力によって押し開かれ、力ある人たちがそれを奪い取る。そして、知りたいなら、その方が、来るはずであったエリヤである。耳を持って聞く者は聞きなさい」（<a href="https://bibleox.com/ja/jp-ni/lk/16/#L16">ルカ. 16:16</a>、<a href="https://bibleox.com/ja/jp-ni/mf/11/#L14">マタ. 11:14</a>、<a href="https://bibleox.com/ja/jp-ni/mf/17/#L12">マタ. 17:12-13</a>）。</p><h2>52</h2><p>——さらに、族長ヤコブは——とわたしは語り続けました——キリストの到来が二つであること、そしてその方が第一の到来のときに苦しむ者であること、そしてその方の到来の後に、あなたたちの民の中には預言者も王もいないこと、そして、苦しめられたキリストを信じる民たちが、その方の第二の到来を待つことを預言しました。それゆえ、聖なる霊はこれを、たとえ話と隠された仕方で語りました、とわたしは言いました。その方はこう言われました。「ユダよ、あなたの兄弟たちはあなたを讃めました。あなたの手はあなたの敵たちの背の上にあり、あなたの父の子たちがあなたを拝します。ユダは獅子の子。わたしの子よ、若い枝からあなたは上った。横たわって眠った。獅子のように、そして獅子の子のように。誰がその方を起こすでしょうか。ユダから統治者が絶えず、その股から指導者が出続けることはありません。彼に定められたものが来るまで。そしてその方こそ、民たちの望みである。その方は自分の子ロバを葡萄の木に、子ロバを葡萄の木の蔓に結びつけるであろう。その方は自分の服を酒の中で、自分の衣を葡萄の房の血の中で洗うであろう。その方の目は酒から輝き、その方の歯は乳のように白いであろう」（<a href="https://bibleox.com/ja/jp-ni/gen/49/#L8">創. 49:8-12</a>）。そして、あなたたちの種族の中に、その初めからキリストの誕生と受難の時までに、いつか預言者も統治者もいなかったことは、あなたたちはこれほど恥知らずに主張する勇気を持たないでしょうし、証明することもできません。あなたたちは、その方が苦しんだヘロデがアスカロンから来たと言いますが、それでも、あなたたちの種族の中にそのとき大司祭がいたことは否定しません。すなわち、そのときにも、あなたたちの中には、モーセの律法に従って献げ物を献げ、ほかの設けを守る人がいました。そして預言者たちはヨハネまで継続していました。同じように、あなたたちの民がバビロンへと連れ去られたとき、地が征服され、聖なる器具が奪われたときにも、預言者はあなたたちの中で止みませんでした。彼は、あなたたちの民の主、長、統治者でした。預言者たちのうちに働く霊が、あなたたちに王たちを油注ぎ、立てたのですから。しかし、わたしたちのキリスト、イエスがあなたたちの中に現れ、死なれた後には、預言者はいませんでしたし、今もいません。あなたたちは自分自身の王を持つことをやめました。そしてあなたたちの地は荒らされ、捨てられました。「園の中の見張り小屋のように」（<a href="https://bibleox.com/ja/jp-ni/is/1/#L8">イザ. 1:8</a>）。ヤコブの言葉「そしてその方こそ、民たちの望みである」は、象徴的に示していました。キリストの到来が二つであること、そして民たちがその方を信じることを。これを、ついに今日、あなたたちは見ることができます。なぜなら、わたしたち——すべての民から出て来て、キリストへの信仰によって神を敬う者、正しい者となった者たち——は、その方の第二の到来を待ち望んでいるのですから。</p><h2>53</h2><p>——言葉「その方は自分の子ロバを葡萄の木に、子ロバを葡萄の木の蔓に結びつけるであろう」は——とわたしは続けました——その方が第一の到来のときに成し遂げられた業について、そして同時に、その方を信じる民たちについても、前もって示していました。彼らは、首に鞍も輪も持っていなかった子ロバのようでした。このキリストが来て、その方によって遣わされた弟子たちを通して、彼らを自分の教えへと立ち帰らせるまで。そして、その方の教えを受け取った彼らは、その方から約束された善いものを待ち望みながら、すべてを担うために自分の首を屈服させました。そして実際に、わたしたちの主イエス・キリストは、エルサレムに入ろうとされたとき、弟子たちに、ビッファゲという村の入口に子ロバと共に結ばれていた雌ロバを、自分のもとへと引き寄せるようにと命じられ、それに座って、エルサレムに入られました。これがキリストによって成就されることが明確に預言されていたので、この成就の周知の事実は、その方がキリストであることを明らかに証明します。そして、これらのことがすべて成就し、聖書によって示されたにもかかわらず、あなたたちは今日まで心をかたくなに留めています。十二預言者の中の一人ゼカリヤは、これが起こることを預言しました。次の言葉の中で。「大いに歓びなさい、シオンの娘よ。歓呼の声を上げよ、告げ知らせよ、エルサレムの娘よ。見よ、あなたの王はあなたのもとに来る。正義ある者、救う者、柔和な者、貧しい者で、駆獣の上に、そしてロバの子の上に座る方である」（<a href="https://bibleox.com/ja/jp-ni/zah/9/#L9">ゼカ. 9:9</a>）。そして、預言の霊が族長ヤコブと共に、その方が駆獣とその子ロバを所有として持つことを語るとき、そしてさらにその方ご自身が、弟子たちに——わたしがすでに言ったとおり——両方の動物を引き寄せるようにと命じられたとき、これは、その方を信じる人たち——あなたたちの会堂からのものと、異邦人からのもの——についての預言でした。なぜなら、輪を担がなかった小ロバが異邦人たちの象徴であったように、駆獣は、あなたたちの民からの人たちを示していました。あなたたちは、預言者たちを通してあなたたちに課された律法を持っているからです。そして、このキリストそのものが打たれること、その方の弟子たちが散り散りになることも、預言者ゼカリヤによって預言されていました。そしてこれは起こりました。その方の十字架の磔の後に、その方と共にいた弟子たちは散り散りになりました。その方が死者の中から復活し、その方の受難についてこのように預言されていたことを彼らに説かれるまで。このように教えられた彼らは、全世界へと赴き、この教えを告げ知らせました。それゆえ、わたしたちは、その方の信仰と教えにおいて堅固です。預言者たちも、そして、わたしたちが見るように、この磔にされた方の名によって、全世界で神を敬う者となった人たちも、わたしたちを説いているからです。ゼカリヤによってこう語られました。「剣よ、わたしの羊飼いに対して、そしてわたしの民の男に対して立ち上がれ、と万軍の主は言われる。羊飼いを打ち、その羊たちは散り散りになるであろう」（<a href="https://bibleox.com/ja/jp-ni/zah/13/#L7">ゼカ. 13:7</a>）。</p><h2>54</h2><p>——モーセによって伝えられ、族長ヤコブによって語られた言葉「その方は自分の服を酒の中で、自分の衣を葡萄の房の血の中で洗うであろう」は——とわたしは言いました——その方が、その方を信じる人たちを自分の血で洗うことを意味していました。その方の服という名を聖なる霊は、その方を通して自分の罪の赦しを受け取った人たちに与えました。その方の力は常に彼らの中に留まっています。しかし、その方の第二の到来において完全に留まるであろう。言葉「葡萄の房の血」は、神秘をもって示しています。キリストが血を持つことを、しかし人の種子からではなく、神の力から。葡萄の血を人ではなく神が生み出したように、キリストの血もまた、人の種族からではなく、神の力からであることが預言されているからです。そして、わたしが挙げたこの預言は、皆さん、キリストが、普通の人たちのように生まれたただの人間ではないことを示しています。</p><h2>55</h2><p>——もしあなたが、この考えをほかの証明でも裏付けるなら、わたしたちはこのあなたの説明を覚えています——とトリュフォンは答えました。しかし今、あなたの語りをもう一度始め、預言の霊が、万物の造り主のほかに、もう一つの神を認めることを証明してください。太陽と月のことは語らずに。それらについては、聖書が証しするところによれば、神は、異邦人たちが神として拝することを許されました。預言者たちはしばしばこの言葉を用い、語ります。「あなたの神は神々の神であり、支配する者たちの主である」と。そして繰り返し付け加えます。その方は「偉大で、力ある、恐るべき方」であると。これは、それらが本当に神であるという意味で語られているのではありません。聖書は、ただ一人だけが真の神であり、万物を造られた方であり、偽りの神々と支配者たちの主であることを示唆しているのです。そしてこれを示すために、聖なる霊は聖なるダビデを通して言われました。「民の神々」——すなわち、神々とされるもの——「は霊たちの偶像であり、神ではありません」（<a href="https://bibleox.com/ja/jp-ni/ps/96/#L5">詩. 96:5</a>）。そして、それらを造り、拝する人たちに対する呪いを付け加えられました。</p><p>——わたしは、トリュフォンよ——とわたしは言いました——偽りの神々を拝する人たちを裁く聖書の箇所から証明を挙げるつもりはありません。わたしは知っていますから、そこで誰も反論できず、あなたには新しいように見える箇所を挙げましょう。しかし、あなたたちはそれを毎日読んでいます。そしてそこから、あなたたちは理解できるでしょう。神は、あなたたちの悪のゆえに、その方の言葉の中にある智慧を理解する能力を、あなたたちから隠されたことを。ただ、その方が——イザヤが語るとおり——偉大なる憐みの恵みによって救いのために種子を残された人たちを除いては。そうすれば、あなたたちの民は、ソドムとゴモラの住人たちのように完全に滅びないですむのですから。それゆえ、聖なる聖書から提示する箇所に注意を払いなさい。それらは説明を必要としません。それらを聞くだけが必要なのです。</p><h2>56</h2><p>——モーセ、神の至福ある忠実な僕は、マムレの樫の木のもとでアブラハムに現れた方が、神であることを告げ知らせています。この方は、二御使いと共におられる方です。その御使いたちは、常に天の上に留まっておられる、誰にも現れず、決して直接的に対話されない方——わたしたちがこれを万物の造り主であり父と呼ぶ方——によって、ソドムを裁くために遣わされたのです。モーセの言葉は次のとおりです。「神はマムレの樫の木のもとで彼に現れました。そのとき彼は、幕屋の入口に昼過ぎに座っていました。目を上げて見ると、見よ、三人の人たちが彼の前に立っていました。それを見た彼は、幕屋の入口から彼らを迎えに走り、地に伏して拝し、言いました」——そして以下の言葉まで——「そしてアブラハムは朝早く、その方が主の前に立っておられた場所へと急いで行き、ソドムとゴモラの姿、そして周囲の国の姿を見ました。見よ、煙の高い柱のように、地から火の炎が立ち上っていたのです」（<a href="https://bibleox.com/ja/jp-ni/gen/18/#L1">創. 18:1-3</a>、<a href="https://bibleox.com/ja/jp-ni/gen/19/#L27">創. 19:27-28</a>）。これを語り終えて、わたしは、挙げられた言葉を理解したかと尋ねました。彼らは理解したと答えましたが、これらの言葉は、わたしが語ったこと——万物の造り主のほかに、もう一つの神と主が存在する、あるいは聖なる霊によって言及される——の証明には何ら役立たない、と言いました。</p><p>——わたしが主張していること——すなわち、万物の造り主のほかに、もう一つの神と主が存在し、言及されていること——を、聖書を理解するあなたたちに、証明するよう努めましょう——とわたしは言いました。その方は御使いとも呼ばれます。なぜなら、その方は、万物の造り主——その方より高い神は存在しない——が人々に喜ばれることを告げ知らせるからです。そして、わたしが挙げた言葉を繰り返し、トリュフォンに尋ねました。あなたは、聖書が語るとおりに、神がマムレの樫の木のもとでアブラハムに現れたと考えていますか。</p><p>——もちろん——とその人は答えました。</p><p>——そして、その方は、聖なる預言の霊が人たちと呼び、アブラハムが見た、あの三人の中の一人であったのでしょうか——とわたしは尋ねました。</p><p>——いいえ——とトリュフォンは言いました。神はその三人の現れの前にアブラハムに現れました。そして、聖書が人たちと呼ぶ三人は御使いたちでした。二人はソドムを滅ぼすために遣わされ、三人目は、そのために遣わされたとおり、サラに子どもの誕生を告げ知らせ、その後に自分の道へと去りました。</p><p>——では、幕屋の中にいた三人の中の一人——「わたしはあなたのもとに、その時をもって帰って来る。そのときサラに子が生まれるであろう」と言った方——は、どのようにして、サラに子が生まれた後に再び現れ、その言葉を預言の霊が神と呼ぶのでしょうか。わたしが語っていることを理解していただくために、モーセの明確な言葉を聞いてください。「サラが、アブラハムのもとに生まれた、エジプトの女奴隷ハガルの子が、彼女の子イサクと一緒に遊んでいるのを見たとき、アブラハムに言いました。この女奴隷とその子を追い出しなさい。この女奴隷の子は、わたしの子イサクと共に遺産を継ぐことはないであろう、と。この言葉は、彼の子についてのものとして、アブラハムには大いに悲しむべきものでした。しかし神はアブラハムに言われました。この言葉について、その子と女奴隷のことであなたの前に悲しむべきものとなってはならない。サラがあなたに語るすべてのことにおいて、その声に聞き従いなさい。イサクの中に、あなたの子孫が呼ばれるであろうから、と」（<a href="https://bibleox.com/ja/jp-ni/gen/21/#L9">創. 21:9-12</a>）。理解しましたか——とわたしは尋ねました。樫の木のもとで帰って来ることを約束された方——サラがアブラハムに勧めることについて、アブラハムに助言を与えることが必要になることを前もって知っておられた方——は、聖書に従って来られたこと、「神はアブラハムに言われた。この言葉について、その子と女奴隷のことであなたの前に悲しむべきものとなってはならない」という後の言葉が示すとおり、その方が神であることを。</p><p>——理解しました——とトリュフォンは答えました。しかし、このことによって、アブラハムに、またほかの族長たちや預言者たちにも現れた方のほかに、もう一つの神が存在することを、あなたは証明していません。あなたは、わたしたちが、アブラハムの幕屋にいた三人がみな御使いたちであったと、不当に考えていたことを示しただけです。</p><p>——たとえわたしが、あの三人の中の一人が神であることを聖書から証明できなかったとしても——とわたしは反論しました——そして、その方が御使いとも呼ばれることを。先に言ったとおり、その方は、万物の造り主なる神が望まれる方々に、造り主なる神の意志を告げ知らせるからです。しかし、その場合でも、あなたたちは、人の姿のうちに、共にいた二人の御使いたちと同じように、アブラハムの地に現れたこの方が、世界の創造の前にも神であったことを認めるべきでした。あなたたちの民全体がこれを認めているのですから。</p><p>——もちろん——とその人は答えました。わたしたちは今日までそう考えてきました。</p><p>——聖書に向かって——とわたしは言いました。わたしは、聖書の中でアブラハムに、ヤコブに、モーセに現れたと提示され、神と呼ばれる方が、万物の造り主なる神とは異なる方であることを——数において異なるのであって、意志において異なるのではありません。わたしは主張します。その方は、万物を造られた神、その方より高い神の存在しない方が、その方に望まれることだけを行い、語ったのです——あなたたちを説得しようと努めます。</p><p>——それなら証明してください——とトリュフォンは反論しました。そうすれば、わたしたちもこのことについてあなたに同意できます。わたしたちは、あなたが、万物の造り主の意志に逆らうことをその方が行った、あるいは語ったと主張しているとは考えていません。</p><p>——わたしがすでに挙げた聖書が、これをあなたたちに明らかにするでしょう——とわたしは答えました。言葉は次のとおりです。「太陽が地の上に昇ったとき、ロトがソゴルに入った。そして主はソドムの上に、主のもとから天から硫黄と火を降らせ、これらの都と周囲の国全体を滅ぼしました」（<a href="https://bibleox.com/ja/jp-ni/gen/19/#L23">創. 19:23-24</a>）。</p><p>そのとき、トリュフォンと共に残っていた人たちの中の第四の人が言いました。</p><p>——それなら、アブラハムに現れた神そのもののほかに、モーセの聖書は、ソドムへと赴いた二人の御使いたちの中の一人も、主と呼んでいることを認めなければなりません。</p><p>——この根拠だけでも——とわたしは言いました——聖なる霊によって、万物の造り主のほかに、もう一つの主が呼ばれていることを完全に認めるべきです。その方は、モーセにおいてだけではなく、ダビデにおいても主と呼ばれています。後者の中にはこうあります。「主はわたしの主に仰せられた。わたしの右の座に座れ。わたしがあなたの敵をあなたの足台とするまで」——先に挙げたとおりです。そして別のところでは、「神よ、あなたの玉座は世々の世の限りなく。あなたの王国の杖は公正の杖である。あなたは義を愛し、不義を憎まれた。それゆえ、神、あなたの神は、あなたの同席者たちよりも喜びの油をもってあなたに油を注がれた」（<a href="https://bibleox.com/ja/jp-ni/ps/45/#L7">詩. 45:7-8</a>）。それゆえ、わたしに答えなさい。あなたたちは、聖なる霊が、万物の父とそのキリストのほかに、ほかの誰かを神と主と呼ぶと考えていますか。わたしは、二人の御使いたちの中の一人ではなく、彼らと共にいた方——アブラハムに現れた方、神とも呼ばれる方——が聖書の中で主と呼ばれていることを、聖書そのものから証明すると約束しました。</p><p>——証明してください——とトリュフォンは言いました。見なさい、日は過ぎて行きます。そしてわたしたちは、そのような恐ろしい答えをする用意がありません。わたしたちは、このようなことについて調べ、探究し、証明した人を聞いたことがありません。そして、わたしたちは、あなたがすべてのことを聖書に帰するのでなければ、あなたの指摘に耐えなかったでしょう。しかし、あなたはそこから証明を挙げようと努め、宇宙の造り主のほかに、より高い神は存在しないと宣言しています。</p><p>——あなたたちは知っています——とわたしは言いました。聖書はこう語っていることを。「主はアブラハムに言われた。なぜサラは笑ったのか。わたしはまことに生むでしょうか。わたしは年老いたのに。あるいは神に不可能な言葉があるのか。この時をもって、わたしはあなたのもとに帰って来る。そのときサラに子が生まれるであろう、と」（<a href="https://bibleox.com/ja/jp-ni/gen/18/#L13">創. 18:13-14</a>）。そして少し後に、「人たちはそこから立ち上がり、ソドムとゴモラの姿を見つめた。アブラハムは彼らと共に歩み、彼らを送った。そして主は言われた。わたしが行っていることを、わたしの僕アブラハムから隠すまい」（<a href="https://bibleox.com/ja/jp-ni/gen/18/#L16">創. 18:16-17</a>）。そして少し後に、「主は言われた。ソドムとゴモラの叫びが大きくなり、その罪は極めて重い。わたしは下って行って、彼らのもとに届く叫びに応じて、まさにこのように行われているかどうかを見よう。もしそうでなければ、わたしは知るであろう。そして人たちはそこから赴き、ソドムに来た。しかしアブラハムはまだ主の前に立っていた。そしてアブラハムは近づいて言った。あなたはまことに正しい人を不敬虔な人たちと共に滅ぼされますか」とほかの言葉。わたしは、前に自分で書いたことを繰り返す必要はないと考えます。トリュフォンとその仲間たちのために、わたしが証明の基礎とした箇所だけを必ず挙げる必要があります。それゆえ、わたしは後の言葉へと移りました。「主は、アブラハムとの対話を終えるとすぐに去りました。そしてアブラハムは自分の場所へと帰りました。そして二人の御使いたちは夕方にソドムに来ました。しかしロトはソドムの門のところに座っていました」——そして次の言葉まで——「人たちは手を差し伸べてロトを自分たちのもとに、家の中へと引き込み、家の扉を閉じました」。そしてさらに続く言葉はこうです。「御使いたちは彼の手と、彼の妻の手と、彼の娘たちの手を取りました。主が彼を憐まれたからです。彼らが彼らを外に連れ出したとき、彼らは言いました。命を救え、命を救え。後ろを振り向かず、周囲の国全体の中でとどまるな。山へ逃れよ。そうすれば、捕らえられることはないであろう。しかしロトは彼らに言いました。主よ、願わくは。あなたの僕があなたの目の前で恵みを見出し、あなたは、わたしの上で行われるあなたの正義を大いにし、わたしの命を救ってくださいました。しかし、わたしは山へ逃れることができません。災いがわたしを襲い、わたしが死んでしまうでしょうから。見なさい、この都は近くにあり、そこに逃れることができます。そしてそれは小さな都です。わたしはそこに逃れます。それは小さいからです。そしてわたしの魂は生きるであろう、と。そしてその方は彼に言われた。見なさい、わたしはこのことをあなたの顔にも目を向けました。そしてあなたが語った都を、あなたの言葉のゆえに滅ぼしません。急いでそこに逃れよ。わたしは、あなたがそこに入らなければ、その業を行うことができないからです。それゆえ、その方はこの都の名をソゴルと呼ばれました。太陽が地の上に昇ったとき、ロトはソゴルに入りました。そして主はソドムとゴモラの上に、主のもとから天から硫黄と火を降らせ、これらの都と周囲の国全体を滅ぼしました」（<a href="https://bibleox.com/ja/jp-ni/gen/18/#L33">創. 18:33</a>、<a href="https://bibleox.com/ja/jp-ni/gen/19/#L1">創. 19:1-24</a>）。これらの言葉を語り終えて、わたしは尋ねました。皆さん、今や、あの三人の中の一人——その方は神であり、主であり、天にいる存在者に仕えています——が、あの二人の御使いたちの主であることを理解しないのですか。御使いたちがソドムへと赴いたとき、その方は留まって、アブラハムと対話しました。モーセが語っているとおりです。そして対話の後に去られたとき、アブラハムは自分の場所へと帰りました。しかし、その方が（ソドムに）来られたとき、もはや二人の御使いたちはロトと対話していません。その方ご自身が対話しています。言葉が示しているとおりです。その方もまた主であり、天において主から、すなわち万物の造り主から、ソドムとゴモラに対する裁きを成し遂げる任務を受け取ったのです。聖書はこれをこう描いています。「主はソドムとゴモラの上に、主のもとから天から硫黄と火を降らせた」と。</p><h2>57</h2><p>——聖書は明らかに、わたしたちにこれを認めるように強いています——とトリュフォンは言いました。わたしが黙ったとき。しかし、あなた自身も同意するでしょう。語られていること——あの人がアブラハムが整えてくれたものを食べた——について疑うことは可能です、と。</p><p>——もちろん、彼らが食べたと書かれています——とわたしは答えました。しかし、もし三人が食べたと書かれていたなら——本当に御使いたちであった二人だけではなく、彼らは天において、わたしたち人間が用いるものとは異なる食べ物で養われることが知られています。あなたたちの父たちが荒野で養われたマナについて、聖書は「彼らは天使のパンを食べた」と語っています（<a href="https://bibleox.com/ja/jp-ni/ps/78/#L25">詩. 78:25</a>）——その場合には、わたしは、聖書が彼らが食べたと言っているのは、わたしたち自身が火について、それがすべてを食い尽くしたと言うのと同じ意味であろう、と言ったことでしょう。しかし、彼らが歯と顎で咀嚼して食べたと理解するべきでは全くありません。それゆえ、ここでも、わたしたちが比喩的な表現の仕方に少しでも通じているなら、何の困難も見出しません。</p><p>——この困難も除去できます——とトリュフォンは言いました。すなわち、彼らがアブラハムによって整えられたものを用いた、特別な食べ方の意味で。その意味で「食べた」と書かれているのですから。しかし今、この神——アブラハムに現れ、万物の造り主なる神の僕である方——が、どのようにおとめから生まれ、あなたが言ったように、わたしたちすべてと似せられた人となったのかを示してください。</p><p>——まず、トリュフォンよ——とわたしは言いました——この論点についてのいくつかのほかの証明をくわしく叙述させてください。そうすればあなたたちはその真理を信じるようになるでしょう。そしてその後に、あなたが求める説明を与えます。</p><p>——あなたの好きなようにしなさい——とトリュフォンは言いました。そうすれば、わたしにとっても完全に喜ばしい業を成し遂げることになります。</p><h2>58</h2><p>——わたしはあなたたちに聖書を挙げたいと思います——とわたしは言いました。純粋に技術的な証明の展開を気にかけることなく。わたしにはその能力がないからです。しかし、神の聖書を理解する恵みだけが神から与えられています。この恵みによって、わたしはすべての人に、無償で、妬みなしにその分与者となるように説きます。そうすれば、万物の造り主なる神が、わたしの主イエス・キリストを通して行うあの裁きの中で、このことのゆえに裁かれないですむように。</p><p>——この点において、あなたは神に仕えるにふさわしい振る舞いをしています——とトリュフォンは言いました。しかし、わたしの考えるには、あなたは皮肉にも語っています。証明の業を持っていないかのように。</p><p>——もしあなたにそう見えるなら——とわたしは反論しました——そうしておきましょう。しかし、わたしは自分の語ったことの真理の中に確信があります。それよりも、わたしの残りの証明に取りかかりましょう。注意して聞いてください。</p><p>——語りなさい——とその人は言いました。</p><p>——モーセはまた書いています、皆さん——とわたしは続けました——族長たちに現れ、神と呼ばれた方が、御使いとも主とも呼ばれていることを。これからあなたたちは、その方が万物の父に仕えていることを理解するでしょう。あなたたちはすでにこれに同意し、さらに大きな証明によって説かれるなら、完全に確信するようになるでしょうから。神の言葉はモーセを通して、アブラハムの孫ヤコブについて、こう語っています。「そして、羊たちが腹の中で孕む時であったとき、——わたしは自分の目で夢の中で彼らを見ました——見よ、羊と山羊の上に乗って上る雄山羊と雄羊は、白っぽく、まだらに、斑であった。そして神の御使いは夢の中でわたしに言った。ヤコブよ、ヤコブよ。わたしは言った。何でしょうか、主よ。そしてその方は言った。あなたの目を上げて見なさい。羊と山羊の上に乗って上る雄山羊と雄羊は、白っぽく、まだらに、斑である。わたしはラバンがあなたに対して行っていることを見たからである。わたしは神である。あなたが、柱をわたしに油注ぎ、誓いを献げた、神の地であなたに現れた神である。今、立ち上がって、この地から出て行き、あなたの生まれの地へと赴きなさい。わたしはあなたと共にいるであろう」（<a href="https://bibleox.com/ja/jp-ni/gen/31/#L10">創. 31:10-13</a>）。そして別のところでは、同じヤコブについてこう語られています。「その夜に立ち上がり、彼は自分の二人の妻と二人の女奴隷と十一人の子たちを取り、ヤコブの渡しを渡った。そして彼らを取り、流れを渡り、彼のものであるすべてを渡し渡した。ヤコブはひとり残りました。そして一人の人と夜明けまで戦いました。しかし、その方が彼に打ち勝つことができないのを見て、彼の太ももの大きい部分に触れました。そしてヤコブの太ももの大きい部分は、その方が彼と戦っていた間に、萎えた。そしてその方は彼に言われた。わたしを離せ。夜が明けたから。しかし彼は言った。わたしを祝福してくださらないなら、離しません。そしてその方は彼に言われた。あなたの名は何ですか。彼は言った。ヤコブです。そしてその方は彼に言われた。あなたの名はもはやヤコブとは呼ばれず、イスラエルがあなたの名となるであろう。あなたが神と戦い、人たちと共に力ある者となったからである。そしてヤコブはその方に尋ねて言いました。あなたの名をわたしに告げ知らせてください。そしてその方は言われた。なぜあなたはわたしの名を尋ねるのか。そしてその方はそこで彼を祝福しました。そしてヤコブはその場所の名を呼びました。神の観り。なぜなら、わたしは神を顔と顔とで見ました。そしてわたしの魂は歓びました」（<a href="https://bibleox.com/ja/jp-ni/gen/32/#L22">創. 32:22-30</a>）。そしてさらに別のところでは、同じヤコブについて次のように語られています。「ヤコブは、カナンの地の中にあるルザ——すなわちベテル——に来ました。彼自身と、彼と共にいた民全体が。そして彼はそこに祭壇を建て、その場所の名をベエルエルと呼びました。なぜなら、そこで、彼が兄弟のエサウの顔から逃れるときに、神が彼に現れたからです。しかし、レベカの乳母デボラは死に、ベエルエルの下、樫の木の下に葬られました。そしてヤコブはそれに名を付けました。泣きの樫の木と。そして神は再びヤコブに現れました。ルザの中で、彼がシリアのメソポタミアから来たとき。そして彼を祝福されました。そして神は彼に言われました。あなたの名はもはやヤコブとは呼ばれず、イスラエルがあなたの名となるであろう、と。——その方は神と呼ばれています。そして、その方は神であり、神であり続けるであろう。</p><p>彼ら全員が自分の同意を表明したとき、わたしは言いました。</p><p>——わたしは、ヤコブが兄弟のエサウから逃れるときに、この御使い、この神、この主——アブラハムにも人間の姿のうちに現れ、その後に同じ姿のうちにヤコブと戦った方——が現れたことを語る聖書の箇所を挙げる必要があると考えます。これらの言葉です。「そしてヤコブは誓いの井戸から出て、ハランへと赴き、ある場所を見つけて、そこに眠りました。太陽が没したからです。そしてその場所の石を取り、自分の頭の下に置き、その場所で眠り、夢を見ました。そして見よ、地に堅く据えられた梯子があった。その頂は天に達していた。そして神の御使いたちがその上を上り下りしていました。主はその上に座しておられた。そしてその方は言われた。わたしは主、あなたの父アブラハムの神、イサクの神である。恐れるな。あなたが眠っている地を、あなたとあなたの子孫に与えるであろう。そしてあなたの子孫は地の砂のようであり、海へ、南へ、北へ、東へと広がるであろう。そしてあなたの中に、あなたの子孫の中に、地のすべての部族は祝福されるであろう。そして見よ、わたしはあなたと共にいる。あなたが行くあらゆる道の中であなたを守るであろう。そしてあなたをこの地へと帰らせる。あなたが語ったことをすべて成し遂げるまで、あなたを捨てないからである。そしてヤコブは眠りから目覚め、言いました。主はこの場所にいる。そしてわたしは知らなかった、と。そして彼は怯え、言いました。なんと恐ろしいこの場所であることか。これはほかの何ものでもなく、神の家であり、これは天の門である。そしてヤコブは朝早く立ち上がり、自分の頭の下に置いた石を取り、それを柱として据え、その頂に油を注ぎました。そしてヤコブはこの場所の名を呼びました。神の家。しかし、その前には都の名はウランマウスでした」（<a href="https://bibleox.com/ja/jp-ni/gen/28/#L10">創. 28:10-19</a>）。</p><h2>59</h2><p>——では今、この同じ御使い、この神、この主、この人、この人間——アブラハムとヤコブに現れた方——が、燃える炎のうちに、いばらの木の中から現れ、モーセと対話されたことを、出エジプト記の書からも証明させてください——とわたしは続けました。そして彼らが、喜んで、快く聞くと表明したとき、わたしは、出エジプト記という題を持つ書から、次の言葉を挙げました。「長い時が過ぎて、エジプトの王が死んだ。そしてイスラエルの子たちは労苦のうちでうめきました」——そしてほかの言葉——「行きなさい。イスラエルの長老たちを集め、彼らに言いなさい。あなたたちの父たちの神、主がわたしに現れました。アブラハムの神、イサクの神、そしてヤコブの神、と言って。わたしはあなたたちを確かに訪れ、あなたたちにエジプトで起こったことを見ました、と」（<a href="https://bibleox.com/ja/jp-ni/ish/2/#L23">出. 2:23</a>、<a href="https://bibleox.com/ja/jp-ni/ish/3/#L16">出. 3:16</a>）。それからわたしは言いました。皆さん、気づいていますか。モーセが、燃える炎の中で彼と対話した御使いについて語っている方こそ、神であり、その方ご自身が神であることを告げ知らせている——アブラハムの神、イサクの神、そしてヤコブの神であることを。</p><h2>60</h2><p>——わたしたちは、あなたが挙げた言葉からはそれを見ません——とトリュフォンは言いました。わたしたちが見るのは、火の炎の中に現れた方が御使いであり、モーセと対話した方が神であったことです。そうすれば、御使いと神、二人が共に、あの観りの中に現れたことになります。</p><p>——もしそうであったとしても、皆さん——とわたしは答えました。すなわち、御使いと神が共に、あの観りの中でモーセに現れたとしても。しかし、先に挙げた言葉によって証明されたとおり、モーセに「わたしはアブラハムの神、イサクの神、そしてヤコブの神である」と語られた神は、宇宙の造り主ではなく、示されたとおり、アブラハムとヤコブに現れた方、万物の造り主の意志に仕え、ソドムに対する裁きにおいてもその方の助言に仕えた方であるでしょう。それゆえ、もしそこに、あなたたちの言うように、二人——御使いと神——がいたとしても、誰も、たとえほんのわずかでも分別のある人も、万物の造り主であり父が、天の上にあるすべてのものを捨てて、地の小さな一部に現れたと主張する勇気は持たないでしょう。</p><p>——すでに証明されたことです——とトリュフォンは言いました。アブラハムに現れた方が神と主と呼ばれ、天の主から委任を受けて、ソドムの地の上に破壊をもたらしたこと。それゆえ、モーセに現れた方と共に御使いがいたとしても、わたしたちは、いばらの木の中からモーセと対話した神は、造り主なる神ではなく、示されたとおり、アブラハムに、イサクに、ヤコブに現れた方であったことに同意します。その方は、人々に父と万物の造り主の意志を告げ知らせるから、万物の造り主なる神の御使いとも呼ばれているのです。</p><p>——しかし今、トリュフォンよ——とわたしは語り始めました——モーセの観りの中で、御使いと呼ばれ、同時に神である、ただお一人が現れ、モーセに語られたことを示しましょう。聖書はこう語っているからです。「主の御使いがいばらの木の中の火の炎の中で彼に現れました。そして彼は見ました。いばらの木が火で燃えているのに、そのいばらの木自体は焼けていなかった。そしてモーセは言いました。行って、この大いなる観りを見よう。なぜなら、いばらの木が焼けていないからである。しかし主が彼が見るために行くのをご覧になると、主はいばらの木の中から彼を呼ばれた」（<a href="https://bibleox.com/ja/jp-ni/ish/3/#L2">出. 3:2-4</a>）。それゆえ、聖書が、夢の中でヤコブに現れた方を御使いと呼び、その後に、夢の中で彼に現れたこの同じ御使いが「わたしは神である。あなたが兄弟のエサウの顔から逃れるときに、あなたに現れた神である」と言ったと語るように——そしてわたしたちは、アブラハムの時代に、ソドムの破壊について、主が「天におられる主から」あの裁きをもたらしたと読むように（<a href="https://bibleox.com/ja/jp-ni/gen/19/#L24">創. 19:24</a>）——、ここでも、聖書が、主の御使いがモーセに現れたと言い、その後にその方を主であり神と宣言するとき、それは、多くのすでに挙げた証しから見て取れるとおり、世界の上にいる神に仕え、自分の上にほかの神を持たない、ただお一人を意味しているのです。</p><h2>61</h2><p>——しかし、皆さん——とわたしは続けました——聖書からのほかの証しを提示しましょう。すなわち、すべての被造物に先立つ始まりとして、神がご自身からある理性ある力を生み出されたこと。この力は、聖なる霊によって、主の栄光とも、子とも、知恵とも、御使いとも、神とも、主とも、言葉とも呼ばれています。そしてその方ご自身が「軍勢の長」と呼んでおられます。その方が人の姿のうちにヨシュアに現れたとき。その方には、これらすべての呼び名があります。父の意志への奉仕のゆえに、そして父の意志によっての誕生のゆえに。わたしたち自身の中に、これに似たものを見ないでしょうか。わたしたちは、何か言葉を発するとき、それを生み出しますが、しかし切り離すことによってではありません。そうすれば、言葉を発するときに、わたしたちの中の言葉は減ることになるでしょうから。同じように、わたしたちは、火からもう一つの火が生じるのを見ます。しかしそれによって、点火したものは減らず、同じままでありながら、そこから点火されたものは実際に存在し、点火したものを減らすことなく輝くのです。わたしの証人は、知恵の言葉であり、その方ご自身であり、父から生まれた神である言葉、そして知恵、そして力、そして生んだ方の栄光です。それはソロモンを通してこう語っています。「わたしがあなたたちに、毎日起こることを告げ知らせるなら、昔から存在するものを数え上げましょう。主はわたしを、その方の道の始まりとして、その業のために造られました。その方はわたしを、世の前に、初めに、地を造られる前に、淵を造られる前に、水の源々が生じる前に、山々が堅く据えられる前に基礎づけられました。すべての丘に先立って、その方はわたしを生み出します。神は国と荒野と、天の下に住まわれる高地を造りました。その方が天を整えられるとき、わたしはその方と共にいました。そしてその方がその玉座を風の上に定められるとき、上の雲を堅くされるとき、淵の源々を据えられるとき、地の基礎を堅く据えられるとき、わたしはその方と共にいました。すべてを整えて。その方はわたしによって歓ばれ、わたしはその方の前で、常に、毎日歓びました。その方が世界を造り終えて歓ばれ、人の子たちについて歓ばれたからです。それゆえ、わたしの子よ、わたしに聞きなさい。わたしに聞き従う男は至福であり、わたしの道に従う人は至福です。毎日、わたしの門のところで目を覚まし、わたしの入口の敷居を守っている人です。なぜなら、わたしの道は命の道であり、願いは主から整えられているからです。しかし、わたしに逆らう人たちは、自分自身の魂に関して不敬虔であり、わたしを憎む人たちは死を愛しています」（<a href="https://bibleox.com/ja/jp-ni/pr/8/#L22">箴. 8:22-36</a>）[8]。</p><h2>62</h2><p>そして、これと同じことを、皆さん、神の言葉はモーセを通しても宣言しています。あなたたちに示すのです。神が人を造られたときに、示された方に、同じ意味で語られたことを。「わたしたちの像に従い、わたしたちの似姿に従って、人を造ろう。そして彼らが海の魚を、天の鳥を、家畜を、全地を、そして地を這うすべての這うものを支配するように。そして神は人を造られた。神の像に従って彼を造られた。男と女に彼を造られた。そして神は彼らを祝福して言われた。広がり、増し加わり、地を満たし、それを支配しなさい」（<a href="https://bibleox.com/ja/jp-ni/gen/1/#L26">創. 1:26-28</a>）。しかし、わたしが挙げた言葉の思想を、あなたたちの教師たちが語ること——神がご自身に「造ろう」と語られたこと。わたしたちもまた、何かをしようとするときに、自分自身に語るように——、あるいは神が「造ろう」と語られたのは、元素たちに、すなわち人を造られたとわたしたちが提示する地とほかの物質に向かってであった——によって、歪めないように、わたしは、モーセ自身の言葉をもう一度挙げましょう。そこから、神が、自分から数において異なる、理性ある存在に語られたことを、疑いなく知ることができます。言葉は次のとおりです。「そして神は言われた。見よ、アダムは、わたしたちの中の一人のようになった。善と悪を知るために」（<a href="https://bibleox.com/ja/jp-ni/gen/3/#L22">創. 3:22</a>）。「わたしたちの中の一人のように」と語ることで、その方は、互いに共在する人格たちの数を、少なくとも二人を指し示しました。わたしは、あなたたち自身が異端として認めている教えが宣べ伝えること、あるいはその伝道者たちが証明できるとされること——神が御使いたちに語った、そして人の体は御使いたちの創造である——を正当なものとして認めることはできません。しかし、真に父から生まれたこの子こそ、すべての被造物に先立って父と共にあり、父が語りかける方です。聖書がソロモンを通して示すとおり、ソロモンの中で知恵と呼ばれるこの子は、神から生まれ、すべての被造物に先立つ始まりとして生み出されました。そしてその方ご自身が、ヨシュアへの顕現の中で、この真理を告げ知らせます。そして、わたしが語ったことがあなたたちに完全に証明されるように、ヨシュアの書からの次の言葉を聞いてください。「そして、ヨシュアがエリコにいたとき——彼は目を上げて見ると、真向かいに立っている人間が見えた。そしてヨシュアはその方に近づいて言った。あなたはわたしたちの味方ですか。それともわたしたちの敵の側ですか。そしてその方は彼に言った。わたしは主の軍勢の長である。今、わたしは来た。そしてヨシュアは顔を地に伏して、その方に言った。主よ、あなたの僕に何を命じますか。そして主の長はヨシュアに言った。あなたの足から履物を脱ぎなさい。あなたが立っている場所は、聖なる地だからである。そしてエリコは閉ざされ、堅くされて、誰もそこから出て来ませんでした。そして主はヨシュアに言った。見よ、わたしはエリコとその王と、力ある勇者たちをあなたの手に渡す」（<a href="https://bibleox.com/ja/jp-ni/nav/5/#L13">ヨシュ. 5:13-15</a>、<a href="https://bibleox.com/ja/jp-ni/nav/6/#L2">ヨシュ. 6:2</a>）。</p><h2>63</h2><p>——あなたは強く、くわしく証明しています、友人よ——とトリュフォンは言いました。今、その方が、その父の意志によって、おとめから人として生まれ、十字架につけられ、死なれるために身を低められたことを示し、その後に復活して天に上がられたことを証明してください。</p><p>——これはすでに証明されています、皆さん——とわたしは答えました。先に挙げた預言の言葉によって。しかし、わたしはそれらをもう一度繰り返し、あなたたちに説明し、あなたたちをわたしとの同意へと説得するよう努めます。イザヤの言葉——「彼の由来を誰が語り得ましょうか。彼の命は地から取り去られたからです」——は、あなたには、その方が人から由来するものではないことを語っているものとして現れませんか（<a href="https://bibleox.com/ja/jp-ni/is/53/#L8">イザ. 53:8</a>）。語られているとおり、その方は民の罪のゆえに、神によって死に渡されたのですから。そして、彼の血について、モーセも——先に言及したとおり——象徴的に語りました。「その方は自分の服を葡萄の房の血で洗われるであろう」と（<a href="https://bibleox.com/ja/jp-ni/gen/49/#L11">創. 49:11</a>）。彼の血は人の種子からではなく、神の意志から生じたからです。そしてダビデの言葉——「聖なる光り輝きのうちに、わたしはあなたを胎から生んだ。主は誓われ、悔い改められることはない。あなたはメルキセデクの位に従って、世々限りなく司祭である」——は、あなたたちに示しませんか。神であり万物の父である方が、初めから、その方が人の胎からも生まれることを望まれたことを（<a href="https://bibleox.com/ja/jp-ni/ps/110/#L3">詩. 110:3-4</a>）。そして別のところで、すでに挙げた言葉の中で、神は言われます。「神よ、あなたの玉座は世々の世の限りなく。あなたの王国の杖は公正の杖である。あなたは義を愛し、不義を憎まれた。それゆえ、神、あなたの神は、あなたの同席者たちよりも喜びの油をもってあなたに油を注がれた。没薬、貴重な樹脂、そして桂皮が、あなたの服から、あなたを楽しくする象牙の家々から香り立つ。王の娘たちはあなたの名誉の中にいる。あなたの右の座には、黄金の服を着た、彩りの后がいる。聞け、娘よ、見よ、あなたの耳を傾けよ。そしてあなたの民と父の家を忘れよ。そして王があなたの美しさを望むであろう。その方こそあなたの主だからである。そしてあなたはその方を拝するであろう」（<a href="https://bibleox.com/ja/jp-ni/ps/45/#L7">詩. 45:7-12</a>）。これらの言葉は明確に、その方が拝される神でありキリストであることを、これを成し遂げた方によって証しされることを意味しています。これらはまた明確に示しています。神の言葉が、その方を信じる人たちに——彼らは一つの魂、一つの集会、一つの教会です——娘のように、すなわちその方の名から形成され、その方の名を帯びている教会に語りかけることを（わたしたちは皆キリスト者と呼ばれているのですから）、そしてわたしたちに、古い父祖の慣わしを忘れることを教えることを。それらはこう語ります。「聞け、娘よ、見よ、あなたの耳を傾けよ。そしてあなたの民と父の家を忘れよ。そして王があなたの美しさを望むであろう。その方こそあなたの主だからである。そしてあなたはその方を拝するであろう」（<a href="https://bibleox.com/ja/jp-ni/ps/45/#L11">詩. 45:11-12</a>）。</p><h2>64</h2><p>——もしその方が聖書が示すとおりであるなら、その方はあなたたち異邦人たちにとって、主であり、キリストであり、神でありましょう。あなたたちは皆、その方の名からキリスト者と呼ばれているのですから。しかし、わたしたち、その方をも造られた神に仕える者たちにとっては、その方を告白し、拝する必要はありません——とトリュフォンは反論しました。</p><p>——もしわたしも、あなたたちのように、争いに偏り、空しいことに取り組んでいるなら、トリュフォンよ——とわたしは答えました——わたしは今日まであなたたちと対話し続けなかったでしょう。あなたたちはわたしの語ることを理解しようと努めず、何らかの反論をするためにだけ、自分の力を張りつめているのですから。しかし今、わたしは神の裁きを恐れているので、あなたたちの種族の誰についても、決定的な判決を急いで下しません。その人が、主の恵みによって救われ得る人たちの中の一人であるかどうかを考えながら。それゆえ、あなたたちが偽りをもって振る舞うとしても、わたしは引き続き、あなたたちの判断と反論に答えます。これは、わたしの意見を知りたいと望み、これらの主題についてわたしに尋ねる、あなたたちの民のすべての人たちに対しても行っていることです。あなたたちは、わたしが挙げた聖書の箇所から理解できたはずでした。もしそれらに自分の注意を向けていたなら。すなわち、あなたたちの民から救われる人たちは、その方を通して救われること、そしてその方の分の中にあること。それなら、わたしにこのことについて尋ねなかったでしょう。わたしは、ダビデの、すでに語った言葉をもう一度挙げ、あなたたちに、それらを理解する方向に自分の力を向けることを、そして、どうにかしてそれらから逃れたり、反論したりする方向ではなく、求めます。ダビデの言葉は次のとおりです。「主が王となられた。民たちは怒るであろう。その方はケルビムの上に座しておられる。地は震えるであろう。主はシオンにおいて偉大であり、すべての人の上に高められる。彼らはあなたの偉大な名を告白するように。その方の名は恐るべきもので、聖なる方だからである。そして王の名誉は裁きを愛する。あなたは公正なものを整えられ、ヤコブの中で裁きと義を行われた。わたしたちの主なる神を高めよ。その方の足の踏み台に拝せよ。その方は聖なる方だからである。モーセとアロンはその方の司祭たちの中にあった。サムエルはその方の名を呼び求める人たちの中にあった。彼らは主を呼び求めた。そしてその方は彼らに聞かれた。その方は雲の柱の中で彼らに語られた。彼らがその方の証しと、その方が彼らに与えられた命令を守ったからである」（<a href="https://bibleox.com/ja/jp-ni/ps/99/#L1">詩. 99:1-5</a>）。ダビデのほかの言葉もあります。すでに挙げたものです。しかし、あなたたちは無分別にも、ソロモンについて語られているものとしています。「ソロモンについて」という題が付いていることを根拠に。言葉そのものから、それらがソロモンについて語られていないこと、そこに提示される方が太陽に先立って存在すること、そしてあなたたちの民から救われる人たちがその方を通して救われることが見て取れます。言葉は次のとおりです。「神よ、あなたの裁きを王に、あなたの義を王の子に与えてください。その方があなたの民を義をもって裁き、あなたの貧しい人たちを分別をもって裁くためです。山々は民のために平和を、丘は義を受け取るように。その方は民の貧しい人たちを裁き、貧しい人たちの子たちを救い、欺く人を卑しめられるであろう。そしてその方は太陽と共に留まり、月の前に、世々限りなく」——そしてほかの言葉——「太陽の前に、その方の名は留まる。そして地の部族はすべて、その方によって祝福される。すべての民はその方を讃める。主なる神、イスラエルの神は祝福されている。ただその方だけが奇跡を行われる。そしてその方の栄光の名は、世々の世の限りなく祝福される。そして全地はその方の栄光で満たされるであろう。そうなりますように、そうなりますように」（<a href="https://bibleox.com/ja/jp-ni/ps/72/#L1">詩. 72:1-8</a>、<a href="https://bibleox.com/ja/jp-ni/ps/72/#L17">詩. 72:17-19</a>）。そして、ダビデによって語られた、先に言及したほかの言葉を思い起こしてください。そこでは、その方が上の天から来られること、そして同じ場所へと再び帰って来ることが示されています。そうすれば、あなたたちは、その方を、上から来られた神としても、人の中に存在した人間としても認めることになるでしょう。そして再び来られるとき、刺し貫いた人たちはその方を見て泣くであろうときに。これらの言葉です。「天は神の栄光を告げ知らせ、空はその方の手の業を告げ知らせる。日は日に言葉を吐き出し、夜は夜に知識を告げ知らせる。彼らの声が聞かれないような言葉も言語もない。彼らの呼び声は全地に出て行った。そして彼らの言葉は世界の果てまで。その方は太陽の中に自分の幕屋を置かれた。そしてその方は、自分の幕屋から出て行く花婿のように、歓ばれるであろう。道を行く、巨人のように。その方の出は天の果てから、そしてその方の巡りは天の果てまで。そしてその方の暖めから隠れる者はいない」（<a href="https://bibleox.com/ja/jp-ni/ps/19/#L2">詩. 19:2-7</a>）。</p><h2>65</h2><p>——わたしは、これほど多くの聖書の箇所に心を動かされています——とトリュフォンは言いました。イザヤの中の箇所について、何を言えばよいのか分かりません。そこで神は、神が自分の栄光をほかの誰にも与えないと宣言しています。「わたしは主なる神である。これはわたしの名である。そしてわたしの栄光を、わたしの徳を、ほかの誰にも与えない」（<a href="https://bibleox.com/ja/jp-ni/is/42/#L8">イザ. 42:8</a>）。</p><p>——トリュフォンよ——とわたしは言いました——もしあなたがこれらの言葉を挙げながら、単純に、偽りなく立ち止まり、先の言葉を挙げず、後の言葉も付け加えなかったなら、赦せることです。しかし、もしあなたが、わたしの語りを難渋させ、わたしに、聖書は互いに矛盾していると言わせようとしてそうしたのなら、あなたは迷っています。わたしは、これを考えたり言ったりする勇気は決して持ちませんから。もしある聖書の箇所が、そう見えるものとして現れ、あたかも別の箇所と矛盾しているかのように示されるなら、どんな聖書の箇所も別の箇所に矛盾しないと完全に確信しているわたしは、むしろ、自分がその意味を理解していないことを認め、同じように考えるように、聖書の中に矛盾を許す人たちにも説こうと努めます。あなたがこの問いをどのような意図で提出したのか、神がご存じです。しかし、わたしは、その聖書の箇所を、語られたとおりの形で、あなたたちの記憶に浮かべましょう。そうすれば、そこからそのものによって、神は自分の栄光を、キリストにだけ与えることを、あなたたちは確信するでしょう。そして、皆さん、トリュフォンが挙げた言葉に連なり、その後に続く言葉をいくつか付け加えます。わたしはそれらを異なる部分からではなく、一つに結ばれているとおりに挙げます。そしてあなたたちは、注意してわたしに聞きなさい。言葉は次のとおりです。「神なる主はこう語られる。天を造り、それを堅く据えられた方、地とその中にあるものを基礎づけられた方、その中の人たちに息を与え、その中を歩む人たちに霊を与えられた方。わたしは主なる神である。義のうちにあなたを呼び、あなたの手を握り、あなたを堅くする。そしてあなたを民の契約、異邦人の光として与える。盲人の目を開き、縛られた者たちをその縄めから、暗闇の中に座る人たちを牢から出させるためである。わたしは主なる神である。これはわたしの名である。わたしの栄光をほかの誰にも与えず、わたしの徳を偶像たちに与えない。初めからのもの、見よ、これは来た。わたしが告げ知らせる新しいこと。しかし、告げ知らされる前に、それはすでにあなたたちに示されていた。神に新しい歌を歌え。その方の支配は地の果てまで。海に下って行き、その中を渡る人たちよ。島々よ、そしてそれらの上に住む人たちよ。荒野よ、その都と村よ、歓びなさい。ケダルの住民は歓び、岩の上に住む人たちは山の頂から叫ぶであろう。彼らは神に栄光を与え、島々の中でその方の力を告げ知らせるであろう。主なる神、万軍の神は出て行かれる。その方は軍勢を砕き、熱心を起こし、敵たちに対して強く叫ばれるであろう」（<a href="https://bibleox.com/ja/jp-ni/is/42/#L5">イザ. 42:5-12</a>）。これを語り終えて、わたしは尋ねました。皆さん、理解しましたか。神は、自分の栄光を、異邦人の光として立てられた方に与えることを約束され、ほかの誰にも与えないのです。トリュフォンが言うように、神が自分のために栄光を留められるのではありません。</p><p>——わたしたちはこれを理解しました——とトリュフォンは答えました。それゆえ、あなたの語りをさらに続けてください。</p><h2>66</h2><p>それからわたしは、先に立ち止まったところから対話を始めました。すなわち、その方がおとめから生まれるはずであったこと、そしてこの誕生がイザヤによって預言されたことの証明。そして再び彼の預言を挙げました。次のとおりです。「そして主は言葉をもってアハズに向かわれた。あなたの神なる主から、しるしを自分のために求めなさい。深くから、あるいは高くから。そしてアハズは言った。わたしは求めず、主を試みません。そしてイザヤは言いました。聞きなさい、今や、ダビデの家よ。人たちを疲れさせることはあなたたちにとって少ないことでしょうか。なぜあなたたちは神をも疲れさせるのですか。それゆえ、主ご自身があなたたちにしるしを与えます。見よ、おとめは腹の中に孕み、子を生むであろう。そしてその方の名はインマヌエルと呼ばれるであろう。乳と蜜をその方は、悪を退けること、あるいは善を選ぶことを知る前に食べるであろう。なぜなら、その子が悪と善を知る前に、その方は悪を退け、善を選ぶであろうから。その子が父を、あるいは母を呼ぶことを知る前に、その方はアッシリアの王の前に、ダマスコの力の財産とサマリヤの戦利品を取るであろう。そして、二人の王のゆえに、あなたが耐えがたく思っている地は捨てられるであろう。しかし神は、あなたの上に、あなたの民の上に、父の家の上に、エフライムがユダから分離された時から、あなたの上に来たことのない日々をもたらされるであろう。すなわち、アッシリアの王を」（<a href="https://bibleox.com/ja/jp-ni/is/7/#L10">イザ. 7:10-17</a>）。これに付け加えて、わたしは言いました。アブラハムの肉の子孫の中で、おとめから生まれたと語られた人は、わたしたちのキリストのほかには、かつて誰もいませんでした。これはすべての人に知られています。</p><h2>67</h2><p>——聖書はこうは語っていません——とトリュフォンは答えました。「見よ、おとめは腹の中に孕み、子を生む」ではなく、「見よ、若い女は腹の中に孕み、子を生む」と。そしてその後に、あなたが挙げたとおりです。預言の全体はエゼキヤに関わるものです。彼の上で、この預言に従って、後の出来事が成就したのです。エリン人の神話の中では語られています。ペルセウスが、ダナエというおとめから生まれたと。彼らがゼウスと呼ぶ方が、金の形のうちにその中に上った後に。あなたたちは、彼らと似たことを語るのを恥じるべきであり、むしろ、このイエスは、人として、人たちから生まれたことを認めるべきであり、聖書からその方がキリストであることを証明できるなら、律法に適った完全な生き方のゆえに、キリストへと選ばれる名誉を授けられたと主張すべきです。しかし、このような不自然な出来事を語る勇気を持つな。さもなければ、あなたたちはエリン人たちと同じように、正気を失っていると責められることになるでしょう。[9]</p><p>——トリュフォンよ——とわたしは言いました——わたしは、あなたと、一般にすべての人たちを説きたいのです。たとえあなたたちが冗談と嘲りのうちに、さらに悪い言葉を語ったとしても、わたしは自分の意図から離れません。むしろ、あなたたちがわたしを反駁するのに用いる、まさにあの言葉と出来事から、常に聖書の証しの助けによって、わたしが主張していたことの証明を引き出すのです。しかし、あなたは、真理の愛好者にふさわしくない仕方で、不当にも振る舞っています。あなたがすでにわたしたちと同意したこと——いくつかの命令が、あなたたちの民のかたくなさのゆえに、モーセを通して与えられたということを——さえ退けようと努めているのですから。あなたは、その方が律法に適った生き方のゆえに選ばれ、キリストとなったと言いました。ただし、その方がキリストであることが証明できるとして。</p><p>——あなたは、その方が割礼を受け、モーセのほかの設けをも行ったことを認めました——とトリュフォンは言いました。</p><p>——認めましたし、今も認めます——とわたしは答えました。しかし、わたしは、その方がこれらの設けをすべて、その方ご自身がそれらによって義とされるために行ったとは主張していません。父——万物の造り主、主、神——の意志による経営を成し遂げるためです。わたしはまた、その方が、人となること、十字架の上で死ぬこと、あなたたちの民からの人たちがその方に対して行ったすべてのことを耐えることを、自分に引き受けることを受け入れたことも認めます。しかし、トリュフォンよ、あなたは再び、以前に認めたことに同意しません。それなら、わたしに答えなさい。モーセの前に生きていた正しい人たちと族長たち——モーセを通して始まったと聖書が証しする設けの中の一つも守らなかった人たち——は、至福ある人たちの遺産の中で救いを受け取るのでしょうか、それとも受け取らないのでしょうか。</p><p>——聖書は、わたしにこれを肯定的に答えることを強います——とトリュフォンは言いました。</p><p>——さらに、あなたに尋ねましょう。神はあなたたちの父たちに供え物と献げ物を行うように命じられました。その方がそれらを必要としておられたからですか。それとも、彼らのかたくなさと偶像礼拝への傾きのゆえにですか。</p><p>——聖書は、後者を認めることを強います——とトリュフォンは言いました。</p><p>——聖書の中で預言されていますか——とわたしは尋ねました。神が、ホリブの山で与えられたもののほかの、新しい契約を結ぶことを約束されたことが。</p><p>——そしてこれは預言されています——とトリュフォンは答えました。</p><p>——古い契約——とわたしは再び尋ねました——は、あなたたちの父たちに、あれほどの恐れと震えのうちに設けられたのではないでしょうか。彼らは神と対話することができないほどに。</p><p>——はい——とその人は言いました。</p><p>——それなら、なぜ神は——とわたしは尋ねました——別の契約があるであろうことを約束され、それが、恐れも、震えも、稲妻もなしに、前のものとは異なる形で設けられると言われたのでしょうか。これは示しませんか。神はある命令と業を、永遠のものであり、全人類の必要に適ったものとして敬われ、あるものは、あなたたちの民のかたくなさに応じて設けられたものとして命じられたことを。その方ご自身が預言者たちを通して告げ知らせておられるとおりに。</p><p>——そしてこれについては、争いではなく、真理を愛する人なら同意するでしょう——とトリュフォンは答えました。</p><p>——知りません——とわたしは言いました。あなたがほかの人たちを争いの愛好者と呼ぶのか。あなた自身は、この対話の中で、しばしばそのような振る舞いをしています。あなたは何度も、以前に同意したことに反論しているのですから。</p><h2>68</h2><p>——あなたは、とトリュフォンは言いました。信じがたく、ほとんど不可能なこと——すなわち、神が生まれることを望まれ、人となられたということを——証明しようとしているのですね。</p><p>——もしあなたたちの間の思想や論拠を通して——とわたしは答えました——これを証明しようとしているなら、あなたたちはわたしに耐えるべきではありませんでした。しかし、この目的のために、常にこれほど多くの聖書の箇所を挙げ、その意味に入るようにとあなたたちに求めているなら、あなたたちは、神の理性と意志を知ることに対して、心をかたくなにしているのです。しかし、もしあなたたちが以前の考えの中に留まるとしても、わたしにとって何の害もありません。わたしは、あなたたちとの対話の前に持っていたのと同じ考えを保ち、あなたたちのもとを去るでしょう。</p><p>——友人よ——とトリュフォンは言いました。大きな苦労と努力の末に、あなたはこれらの考えに至ったことを考慮してください。それゆえ、わたしたちもまた、提案されるすべてのことをまず試し、その後に、聖書が強いるものに同意すべきです。</p><p>——わたしが求めているのは——とわたしは言いました——あなたたちが、わたしたちの対話の主題を少しも探究しないことではありません。しかし、語ることがなくなったときに、すでに自分の同意を表明したものに再び反論しないことです。</p><p>——これを成し遂げるように努めましょう——とトリュフォンは答えました。</p><p>わたしがすでに提出した問いに——とわたしは語り始めました——いくつかのほかの問いを付け加えます。このような問いによって、わたしは短い時間のうちに、この論議を終えるように努めるのです。</p><p>——尋ねなさい——とトリュフォンは言いました。</p><p>——あなたたちは考えていますか——とわたしは尋ねました——拝されるべき、聖書の中で主と神と呼ばれる、ほかの誰かが存在することを。宇宙の造り主のほかに。そしてキリスト——あなたたちに証明されたとおり、これほど多くの聖書の箇所によって、その方が人となられた方——のほかに。</p><p>——わたしたちはどうしてこれを認め得ましょうか——とトリュフォンは答えました。わたしたちがちょうど、ただ一人の父のほかに、ほかの神が存在するかどうかについて、まさにこの探究を行ったのに。</p><p>——あなたたちにこれについても尋ねる必要があります——とわたしは言いました。あなたたちの意見が、あなたたちが今語っていたものとは異なっていないかを知るために。</p><p>——いいえ、友人よ——とトリュフォンは答えました。</p><p>——それなら、もしあなたたちがこれに完全に同意したなら、そして聖書が「誰がその方の由来を語るのか」と言っているなら、あなたたちは、その方が人の由来によるものではないことを理解するべきではないでしょうか。</p><p>——しかし、どうして聖書は——とトリュフォンは反論しました——ダビデに、その方の股から神が自分のために子を取り、彼に王国を与え、彼を自分の栄光の玉座の上に着かせると言うのですか。</p><p>——もしあの預言——「見よ、おとめは腹の中に孕む」——が、トリュフォンよ、ダビデの家にではなく、十二部族の中のほかの家に向けられていたなら、おそらく、このことは疑わしいものだったでしょう。しかし、まさにその預言がダビデの家に向けられていたので、神がダビデ自身に隠された仕方で語った言葉を、イザヤは、それが成就するはずであったとおりに解説しています。皆さん、知らないのですか——とわたしは語りました——多くの言葉は、隠された仕方で、たとえ話の中で、あるいは秘義の中で、あるいは象徴的な業の中で語られました。そしてそれらは、何かを語ったり行ったりした人たちの後に生きた預言者たちによって解説されたことを。</p><p>——確かに——とトリュフォンは答えました。</p><p>——それなら、もしあなたたちに証明するなら——とわたしは言いました——この預言がエゼキヤではなく、わたしたちのキリストに関わるものだと。そうすれば、わたしは、あなたたちが自分の師たちを信じないようにと、あなたたちに要求する権利を持たないでしょうか。彼らは、プトレマイオス——エジプトの王——のもとであなたたちの七十人の長老たちが行った訳が、いくつかの点で正しくないと主張する勇気を持っています。聖書の中で、彼らの無分別で独断的な意見を明らかに責めている箇所については、彼らは言います。このように書かれてはいない、と。そして、彼らの考えでは、人間的な業に当てはめ、適合させることができるものについては、それはわたしたちのキリストについてではなく、彼らが当てはめたいと考える人について語られている、と言います。それゆえ、今問題になっているあの聖書の箇所を、彼らは、エゼキヤに関わるものと、あなたたちに教えました。彼らが偽っていることを、約束したとおり証明します。しかし、わたしが先に挙げた聖書の箇所を彼らに対立させるとき——それは明確にキリストを苦しむ者として、拝されるべき者として、神として提示しています——彼らは、これがキリストについて語られていることに同意せざるを得ません。しかし、さらに、わたしたちのキリストはキリストではないと語る勇気を持ち、その方は来られること、苦しむこと、統治すること、神として拝されることを主張するのです。それは同じように笑うべきであり、愚かであることを、わたしは証明します。しかし、まず、あなたが今笑うべき仕方で語ったことに答える必要があります。まずこれに答え、その後に残りのことを証明しましょう。</p><h2>69</h2><p>——知っておきなさい、トリュフォンよ——とわたしは語り始めました——いわゆる悪魔が、エリン人の間の神話の中で歪め、広めたあのこと——ちょうど、その方がエジプトにおいて魔術師たちを通して、そしてエリヤの時代に偽りの預言者たちを通して行ったように——は、すべて、わたしの中で聖書の知識と、聖書への信仰を堅くしました。なぜなら、彼らの中で語られること——ディオニュソス、ユピテルの子が、セメレとの交わりから生まれたこと、彼がブドウの発明者であったこと、引き裂かれて死んだ後に復活し、天に上がったこと、そしてその秘儀にロバを導き入れること——を見るとき、悪魔が、先に挙げた、族長ヤコブの、モーセの中に書かれている預言を模倣したのを、わたしは見ないでしょうか。また、ヘラクレスが力があり、全地を巡ったこと、彼がユピテルからアルクメーネのもとに生まれ、死の後に天に上がったことが語られるとき、ここでも、キリストに関わる聖書の箇所の模倣を見ないでしょうか。「力ある方、巨人のように、その方の道を歩むために」（<a href="https://bibleox.com/ja/jp-ni/ps/19/#L6">詩. 19:6</a>）。そしてアスクレピオス——死者を生き返らせ、ほかの病をいやした方——が引き合いに出されるとき、ここでも、キリストについての預言の模倣であると言わないでしょうか。わたしは、キリストがこのことを行うであろうことを示す聖書の箇所を一つも挙げていませんでしたから、必要性から、あなたたちに一つの言葉を思い起こさせましょう。そこから、あなたたちは、聖書が、神についての知識を持たない人たち——すなわち異邦人たち——についてさえ預言したことを理解するでしょう。彼らは目を持っていながら見ず、心を持っていながら会得せず、物質的な像を拝していました。彼らは偶像を捨て、このキリストに望みを置くであろう、と。それはこう読まれます。「歓びなさい、渇えている荒野よ。荒野は歓び、ゆりのように開花するであろう。ヨルダンの荒野は開花し、歓び、レバノンの栄光とカルメルの名誉が与えられるであろう。わたしの民は主の高さと神の栄光を見るであろう。力を取り戻せ、衰えた手よ。そして弛んだ膝よ。心を強くされよ。怯える者たちよ、力を取り戻せ、恐れるな。見よ、わたしたちの神は裁きをもって返され、その方ご自身が来て、わたしたちを救うであろう。そのとき、盲人の目は開かれ、聾者の耳は聞くであろう。そのとき、足の不自由な人は鹿のように跳ね、もごもご話す者の舌は明瞭に語るであろう。なぜなら、水は荒野の中で裂け、流れは渇えた地の中で、そして水のない場所は池に変わるからである。そして渇えた地の上に水の泉があって」（<a href="https://bibleox.com/ja/jp-ni/is/35/#L1">イザ. 35:1-7</a>）。神からの生きた水の泉は、神についての知識を持たない地の中に、すなわち異邦人たちの中に、わたしたちのキリストによって開かれました。その方はあなたたちの民の中に現れ、生まれたときから、肉において盲人、聾者、足の不自由な人たちをいやし、自分の言葉によって、一人が語ること、ほかの人が聞くこと、ほかの人が見ること、その方の意のままに成し遂げました。そして死者さえ生き返らせ、命へと帰らせ、その時代の人たちを、その方についての認識へと業によって駆り立てました。しかし彼らは、このような業を見て、それらを魔術的な惑わしと考え、その方を魔術師であり民の欺き手と呼ぶ勇気を持ちました。しかし、その方はこれを、その後にその方を信じることになる人たちを説得するために行われました。すなわち、誰かが何らかの体の不完全さを持っていても、その方が伝えられた命令を行うなら、その方は第二の到来のときに、その人を完全な姿で生き返らせ、不死で、朽ちないで、悲しみのないものとするであろう、と。</p><h2>70</h2><p>——ミトラー教の秘儀の行者たちが、その方が石から生まれたと言い、その方を信じる人たちを秘義に入れる場所を洞窟と呼ぶとき——とわたしは言いました——、わたしは見ないでしょうか。彼らはこれをダニエルの言葉から借りたのです。「手によらずして、大いなる山から一つの石が切り離れ」と（<a href="https://bibleox.com/ja/jp-ni/dan/2/#L34">ダニ. 2:34</a>）。同じように、イザヤの預言者からも、彼らはすべての言葉において模倣しようと努めました。彼らは、秘義に入った人たちの間にも、正義を守ることについての対話があるように取り計らったのですから。しかし、わたしは、イザヤの言葉をわたしたちに挙げる必要があります。そうすれば、これが真実であるのを見るでしょう。言葉は次のとおりです。「遠くにいる人たちよ、わたしが行ったことを聞け。近くにいる人たちはわたしの力を知る。シオンの中で不義の人たちは懼れ、不敬虔な人たちの上に恐れが襲う。あなたたちに永遠の住まいについて誰が告げ知らせるのでしょうか。正義のうちに歩む人、真実を語る人、不義を憎む人、贈り物から自分の手を引き遠ざける人、血の不正な裁きを聞かないように自分の耳を塞ぐ人、不敬虔なものを見ないように自分の目を閉じる人。その人は高い岩の洞窟の中で住むであろう。パンはその人に与えられ、その人の水は確かであろう。あなたたちは栄光のうちに王を見るであろう。そしてあなたたちの目は遠くを見るであろう。あなたの魂は神への恐れを考えを抱くであろう。書記官はどこにいるのか。助言する者たちはどこにいるのか。小さな民も大きな民も、養われている人たちを数え上げる者はどこにいるのか。彼らはその方と相談せず、声の深さを知らなかった。聞く人に知識はない。民は軽蔑された民である」。この預言の中では、わたしたちのキリストが、その方を信じる人たちのために——その方はまさに彼らのために苦しめられたのです——、その方の受肉の記憶のために造るようにと命じられたパンのこと、そしてその方の血の記憶のために感謝をもって造るようにと命じられた杯のことが語られていることは、明らかです。同じ預言は、わたしたちがこの同じ王を栄光のうちに見ることを示すと共に、その方への信仰が前もって知られていた民が、主への恐れを考えることを、そして自分を聖書の言葉に通じた者と考え、預言を聞いてもそれを会得しない人たちについても語っています。そしてトリュフォンよ、わたしが聞くとき——ペルセウスがおとめから生まれたと——、これも、あの偽りの蛇の作り物であることを理解します。</p><h2>71</h2><p>——しかし、わたしはあなたたちの教師たちには同意しません——とわたしは言いました。彼らは、プトレマイオス——エジプトの王——のときに、あの七十人の長老たちが正しく訳したことを認めず、自分たちで訳そうと努めているのですから。そして、あなたたちは知っておくべきです。彼らは、プトレマイオスのもとで長老たちが行った訳の中から、この磔にされた方の神性、人間性、そして十字架の死について預言されていたことを明らかに証しする、多くの聖書の箇所を全く消し去りました。わたしはこのような争論の中でこれらの箇所を挙げません。あなたたちの民のすべてがそれらを退けることを知っているからです。しかし、わたしは、あなたたちがまだ認める聖書の箇所に基づいて、自分の探究を進めます。しかし、わたしがあなたたちに挙げた箇所は何であれ、あなたたちはそれらを認めました。ただ「見よ、おとめは腹の中に孕む」という言葉に対して立ち上がり、「若い女は孕む」と語られていると主張したことを除いては。しかし、わたしは、この預言がエゼキヤではなく——あなたたちが教えられたように——このわたしのキリストに関わるものであることを証明すると約束しました。そして今、これに取りかかります。</p><p>——お願いします——とトリュフォンは言いました。まず、少なくとも、あなたが、わたしたちの中で全く消し去られたと語るあの聖書の箇所のいくつかを提示してください、と。</p><h2>72</h2><p>——あなたたちの願いを果たしましょう——とわたしは答えました。すなわち、エズラが過越祭の律法について語った説明の中から、彼らは次の言葉を取り去りました。「エズラは民に言った。この過越祭はわたしたちの救い主であり、わたしたちの避難所です。そして、もしあなたたちが考え、わたしたちの心の中に、わたしたちがしるしの上でこの方を辱めること、しかしその後にこの方に望みを置くであろうということが入って来るなら、この場所は永遠に荒らされることはない、と万軍の神は言われます。しかし、もしこの方を信じず、この方の告げ知らせに聞き従わないなら、あなたたちは民たちのための笑い物となるであろう」[10]。そしてエレミヤの言葉からは次のものを取り去りました。「わたしは、屠りに引かれて行く、非の打ちどころのない小羊です。彼らはわたしに対して企てを抱きました。来て、わたしのパンのうちに木を投げ込み、生ける者の地からそれを滅ぼし、その名を、もはや覚えられないようにしよう、と」（<a href="https://bibleox.com/ja/jp-ni/ier/11/#L19">エレ. 11:19</a>）。エレミヤからのこれらの言葉は、ユダヤの会堂の中のいくつかの写本の中に、今日まで留められています。彼らが最近これらを取り去ったからです。そしてこれらの言葉は、ユダヤ人たちがこのキリストについて相談し、その方を十字架で殺すことを決めたことを示すと共に、その方ご自身がここでは、非の打ちどころのない小羊として提示されています。イザヤが、屠りに引かれて行く羊として預言的に呼んだのと同じように。それゆえ、彼らはこれらの言葉からこのような困惑に陥り、その方を褻ることに向かうのです。同じエレミヤの言葉の中から、彼らはまた次のものを取り去りました。「主なる神は、イスラエルの中で眠っている、墓の地の中の死者たちを思い起こされた。そしてその方は彼らのもとに下って行き、自分の救いを彼らに告げ知らせようとされた」（<a href="https://bibleox.com/ja/jp-ni/ier/31/#L16">エレ. 31:16</a>）[11]。</p><h2>73</h2><p>——そしてダビデの第95の詩篇の中から、彼らは次のわずかな言葉を取り去りました。——「木の上から」。なぜなら、「民の中に語れ。主は木の上から王となられた」と語られていたのに、彼らはこう残しました。「民の中に語れ。主は王となられた」と。しかし、神であり主として民の上に王となったと語られた人は、この磔にされた方ただ一人だけです。その方については、同じ詩篇の中で、聖なる霊は、その方が自分の復活によって救われたと語り、その方が民の神々と類似していないことを示しています。なぜなら、それらは霊たちの像だからです。しかし、わたしの言葉を理解していただくために、わたしは詩篇全体を挙げましょう。次のとおりです。「主のために新しい歌を歌え。主を、全地よ、歌え。主を歌い、その方の名を祝福せよ。日から日へ、その方の救いを告げ知らせよ。その方の栄光を民の中に、その方の奇跡をすべての人たちの中に告げ知らせよ。なぜなら、主は偉大であり、大いに讃められる方であり、すべての神々の上に恐るべき方だからである。すべての民の神々は霊たちである。しかし主は天を造られた。その方の前に栄光と名誉があり、その方の聖所の中に聖性と輝きがある。民の一族よ、主に返せ。主に栄光と名誉を返せ。その方の名にふさわしい栄光を主に返せ。献げ物を取り、その方の中庭に入り、その方の聖なる中庭の中で主に拝せよ。全地はその方の顔の前で震えるように。民の中に語れ。主は木の上から王となられた。その方は世界を整えられた。それは動くことのないように。その方は民たちを正義のうちに裁かれるであろう。天は歓び、地は歓びの歓びとし、海とその中を満たすものはすべて震えるように。野は、そしてその中にあるすべてのものは歓び、森のすべての木は主の前に歓びの歓びとするであろう。なぜなら、その方が来られるからである。来て、地を裁くために。その方は世界を正義のうちに、そして民たちをその方の真実のうちに裁かれるであろう」（<a href="https://bibleox.com/ja/jp-ni/ps/96/#L1">詩. 96:1-13</a>）[12]。</p><p>——わたしたちの長師たちが聖書の中から何かを取り去ったかどうか、神がご存じです——とトリュフォンは答えました。しかし、わたしの考えるには、それは信じがたいことです。</p><p>——もちろん——とわたしは言いました——それは信じがたいように見えます。それは、彼らが、地の中でマナに満たされながら行った子牛の鋳造よりも、霊たちへの献げ物として子どもたちを殺すことよりも、あるいは預言者たち自身を殺すことよりも、恐ろしいことだからです。しかし、あなたたちは、わたしが言った、彼らによって密かに取り去られた、あの聖書の箇所を全く聞いたことがないように見えます。けれども、先に挙げたいくつかの聖書の箇所は、あなたたちのもとに留まっているほかの箇所と共に——それらは、あなたたちに提示されます——、探究されている主題の証明には大いに十分です。</p><h2>74</h2><p>——わたしたちは知っています。あなたが、わたしたちの、そしてわたしたちの願いのためにそれらを挙げたことを——とトリュフォンは言いました。しかし、今あなたが挙げたダビデの詩篇については、それを、天と地を造られた父のほかの誰に帰すこともできないとわたしは考えます。しかし、あなたは、それをあの受苦者——あなたがキリストであると証明しようと努めている方——に帰すと主張しています。</p><p>——注意を払ってください、願わくは——とわたしは答えました。わたしがこの詩篇の中で聖なる霊によって語られた言葉を挙げるとき。そうすれば、あなたたちは見るでしょう。わたしも誤って語っておらず、あなたたちはまだ全く惑わされていないことを。そうすれば、あなたたちは自分自身で、聖なる霊の言葉の中の多くのほかのことも理解できるでしょう。「主のために新しい歌を歌え。主を、全地よ、歌え。主を歌い、その方の名を祝福せよ。日から日へ、その方の救いを告げ知らせよ。すべての人たちの中で、その方の奇跡を」（<a href="https://bibleox.com/ja/jp-ni/ps/96/#L1">詩. 96:1-3</a>）。ここで聖なる霊は命じています。全地から、この救いの神秘——すなわち、キリストの受難、それによってその方が彼らを救ったのです——を知った人たちが、神と万物の父に歌うことを止めてはならない、と。なぜなら、彼らは、栄えある恐るべき方、天と地の造り主が、人類のこの救いを成し遂げられたことを知っているからです。すなわち、その方——十字架と受難の後に、全地の上で王とされる名誉を神から授けられた方。そして、その方が入って行く地について、「彼らはわたしを捨て、わたしが彼らのために立てたその日の契約を破るであろう。そしてわたしは彼らを捨て、わたしの顔を彼らから背けるであろう。そして破れが起こり、多くの災いと悲しみがその上に降るであろう。そしてその人はその日に言うであろう。わたしの主がわたしたちと共にいないことのゆえに、これらの災いがわたしの上に降ったのだと。しかし、わたしは、その日に彼らの顔を完全に背けるであろう。彼らが行ったすべての不義のゆえに。なぜなら、彼らはほかの神々のもとへと移ったからである」（<a href="https://bibleox.com/ja/jp-ni/vtor/31/#L16">申. 31:16-18</a>）。</p><h2>75</h2><p>——そして出エジプト記の中で、モーセは、神秘をもって告げ知らせました——わたしたちも知っているとおり——神そのものの名がイエスであったことを。彼の言葉によれば、この名はアブラハムにもヤコブにも示されていなかったのです。こう語られています。「そして主はモーセに言われた。この民に言いなさい。見よ、わたしはわたしの御使いをあなたの顔の前に送る。その方が道の中であなたを守り、わたしがあなたのために整えた地の中へと入らせるために。その方に注意を払い、その方に聞き従いなさい。その方に立ち向かうな。その方があなたを赦さないからである。わたしの名がその方の上にあるからである」（<a href="https://bibleox.com/ja/jp-ni/ish/23/#L20">出. 23:20-21</a>）。それなら、誰があなたたちの父たちをその地の中へと導いたのでしょうか。ついに深く考えなさい。それは、イエスという名を付けられた男であり、以前はアウシという名で呼ばれていた人であったことを。これに注意を払うなら、あなたたちは理解するでしょう。モーセに「わたしの名がその方の上にある」と語った方の名はイエスであったこと。そしてその方はイスラエルとも呼ばれ、またこの呼び名をヤコブへと移しました。そして、預言者たちが、その方の命令を告げ知らせるために遣わされる神の御使いたち、そして使者たちと呼ばれることは、イザヤの言葉から見て取れます。イザヤは「わたしを遣わしてください」と言っていますから（<a href="https://bibleox.com/ja/jp-ni/is/6/#L8">イザ. 6:8</a>）。そして、イエスという名を受け取った人が偉大で力ある預言者であったことは、すべての人に明らかです。それゆえ、わたしたちが、神がアブラハムに、ヤコブに、モーセに、あれほど異なる姿のうちに現れたことを知っているなら、なぜ疑い、その方が万物の父の意志によって、おとめから人として生まれることができたと信じたくないのでしょうか。特に、これほど多くの聖書の箇所を持っているのに。そこから明確に理解できるのです。これも父の意志によって起こったことを。</p><h2>76</h2><p>——そしてダニエルが、永遠の王国を受け取る方を「人の子のよう」と語るとき、これはまさにこのことを示唆しているのではないでしょうか。言葉「人の子のように」は、その方が現れ、人となられたことを示していますが、しかし人の種子からではないことを。そしてその方を「手によらずして切り離された石」と呼ぶとき、その方は同じことを神秘をもって描いています。「手によらずして切り離された」という言葉は、その方が人の業ではなく、その方を生み出された、万物の父なる神の意志の業であることを示しているからです。イザヤの言葉「誰がその方の由来を語るのか」は、その方が語り難い由来を持つことを示しています。人から生まれた人のうちに、語り難い由来を持つ人はいないのですから。そしてモーセの言葉「その方は自分の服を葡萄の血で洗うであろう」は、わたしが何度もあなたたちに言ったとおり、示しませんか。その方は、その方について隠された仕方で預言したこと。すなわち、その方は血を持つけれども、人たちからではないことを。葡萄の血が人によってではなく神によって生み出されたのと同じように。さらに、イザヤがその方を「大いなる評議会の御使い」と呼ぶとき、その方は、その方がその到来の後に教えたものの教師となるはずであったことを預言しなかったのでしょうか。その方だけが、父の大いなる意志を、その方に喜ばれるすべての人たちについて——その意志から離れた人たちと御使いたちについても同じように——公然と告げ知らせました。その方はこう語りました。「東からも西からも来るであろう。そしてアブラハムと、イサクと、ヤコブと共に天の御国の中で座に着く。しかし御国の子たちは外の暗さの中へと追い出されるであろう」（<a href="https://bibleox.com/ja/jp-ni/mf/8/#L11">マタ. 8:11-12</a>）。そしてさらに、「多くの人がその日にわたしに言うであろう。主よ、主よ、わたしたちはあなたの名によって食べ、飲み、預言し、悪霊を追い出したではないか。そしてわたしは彼らに言うであろう。わたしから離れよ」（<a href="https://bibleox.com/ja/jp-ni/lk/13/#L26">ルカ. 13:26-27</a>）。そして、救いにふさわしくない人たちを裁くほかの言葉の中で、その方は宣言されました。「外の暗さへと行け。父がサタンとその御使いたちのために整えたものへ」（<a href="https://bibleox.com/ja/jp-ni/mf/25/#L41">マタ. 25:41</a>）。そしてさらに別の言葉の中で、その方は言われました。「わたしはあなたたちに、蛇の上に、蠍の上に、そしてムカデの上に、敵の全力の上に足を踏み入れる権威を与える」（<a href="https://bibleox.com/ja/jp-ni/lk/10/#L19">ルカ. 10:19</a>）。そして今、わたしたちは、ポンティウス・ピラトゥスのもとで十字架につけられたイエス、わたしたちの主を信じながら、すべての霊たちと悪い霊たちを呼びかけ、彼らをわたしたちの権威の中に留めています。預言者たちを通して、キリストが苦しみ、すべてのものの上で王となることが隠された仕方で預言されたにもかかわらず、誰もこれを理解することができませんでした。その方ご自身が、使徒たちを説かれるまで。すなわち、このことについて聖書の中で明確に預言されていたことを。十字架につけられる前に、その方は言われました。「人の子は多くのことを苦しみ、書記官たちとパリサイ人たちに退けられるはずであり、磔にされ、第三の日に生き返らなければならない」（<a href="https://bibleox.com/ja/jp-ni/lk/18/#L31">ルカ. 18:31</a>、<a href="https://bibleox.com/ja/jp-ni/lk/24/#L7">ルカ. 24:7</a>）。そしてダビデは預言しました。「その方は太陽の前に、月の前に胎から生まれる」（<a href="https://bibleox.com/ja/jp-ni/ps/110/#L3">詩. 110:3</a>）と。そして示しました。その方はキリストであるとして、強く拝されるべき神であることを。</p><h2>77</h2><p>——わたしはあなたに同意します——とトリュフォンは言いました。あれほど多くの証しは、わたしたちの説得に十分であると。しかし、わたしはあなたに注意させたいのです。わたしはあなたの説明を要求しています。あなたは何度もそれを約束しました。それをわたしたちに提示してください。そうすれば、あなたがどうやって、その言葉があなたたちのキリストに関わると証明するかを見ることができます。わたしたちは、それがエゼキヤについて預言されたと言っているのですから。</p><p>——あなたたちの願いを果たしましょう——とわたしは答えました。ただし、まず、あなたたちは、エゼキヤに「父を、あるいは母を呼ぶことを知る前に、その人はダマスコの力の財産とサマリヤの戦利品を、アッシリアの王の前に取る」という言葉が関わると証明してください。あなたたちは、自分の望むように——すなわち、エゼキヤが、アッシリアの王の前でダマスコで、あるいはサマリヤで戦ったというように——それらを説明することは許されないでしょうから。預言の言葉はこう語っています。「若い子が父を、あるいは母を呼ぶことを知る前に、その子はアッシリアの王の前に、ダマスコの力の財産とサマリヤの戦利品を取るであろう」（<a href="https://bibleox.com/ja/jp-ni/is/7/#L16">イザ. 7:16</a>）。もしその預言の霊が、このことを「若い子が父を、あるいは母を呼ぶことを知る前に、ダマスコの力の財産とサマリヤの戦利品を取る」という付け加えと共に語っていなかったなら——しかし、ただ「子を生むであろう。そしてその子はダマスコの力の財産とサマリヤの戦利品を取る」とだけ語ったなら——そのときには、あなたたちは言うことができたでしょう。神はエゼキヤがこれを得ることを知っていたので、預言されたのだ、と。しかし今、預言は付け加えと共に語っています。「若い子が父を、あるいは母を呼ぶことを知る前に、ダマスコの力の財産とサマリヤの戦利品を取る」と。そして、あなたたちは、これがユダヤ人の間の誰かの上にいつか起きたことを証明することはできません。しかし、わたしたちは、これがわたしたちのキリストの上に成就したことを証明することができます。その方が生まれた直後に、アラビアからの魔術師たちが来て、その方を拝したからです。彼らはまず、当時あなたたちの地を統治していたヘロデのもとへと立ち寄りました。その方を、預言は、その人の不敬虔で不敬虔な霊のゆえに、アッシリアの王と呼んでいるのです。聖なる霊は、しばしばたとえ話と類似のうちに語ることを、あなたたちは知っています——とわたしは言いました。エルサレムの民全体に関して行ったように。何度も彼らに叫びながら、「あなたの父はアンモリ人であり、あなたの母はヘト人である」と。</p><h2>78</h2><p>——この王ヘロデは——とわたしは続けました——アラビアからの魔術師たちがそのもとに来て、天に現れた星によって「あなたたちの地の中で王が生まれたことを知りました。そしてわたしたちはその方を拝するために来ました」と言ったとき、あなたたちの民の長老たちから、その方がベツレヘムで生まれたことを知りました。預言者の中にはこのように書かれていると、彼らは言いましたから。「お前、ベツレヘム、ユダの地よ、ユダの長官たちの中で全く小さくなかった。お前から、わたしの民を養うであろう統治者が、わたしのために出て来るであろうから」（<a href="https://bibleox.com/ja/jp-ni/mih/5/#L1">ミカ. 5:1</a>）。それゆえ、アラビアからベツレヘムに来たこれらの魔術師たちは、若い子を拝し、黄金、乳香、没薬の献げ物を持って来ました。それから、ベツレヘムの中での若い子への拝の後に、彼らは顕現を通して、ヘロデのもとに帰らないようにとの命令を受け取りました。そしてマリヤと婚約していたヨセフにも——彼は最初、婚約者が何らかの男との交わりから、すなわち姦淫から孕んだと考えて、婚約者を追い出そうとしました——、顕現の中で、自分の妻を追い出さないようにと命じられました。なぜなら、彼に現れた御使いが言ったとおり、彼女が腹の中に持っているものは聖なる霊によるからです。そこで彼は、怯えて、彼女を追い出しませんでした。しかし、ユダヤの中で、当時、キュレニオのもとでの最初の国勢調査があったので、彼は、自分が住んでいたナザレから、自分の家系の出所であるベツレヘムへと記録のために赴きました。彼はこの国の中に住んでいたユダの部族の出であったからです。そしてその後に、マリヤと共にエジプトへと行き、そこで幼子と共に、彼らが再びユダヤに帰るようにと言われるまで留まるようにと命じられました。そして幼子がベツレヘムの中で生まれる時が来たとき、ヨセフは、その村の中の留まる場所がないために、村の近くのある洞窟の中へと入りました。そして彼らがそこにいたとき、マリヤはキリストを生み、彼を飼葉の桶の中に置きました。アラビアから来た魔術師たちが彼を見出した場所に。わたしは、あなたたちに、すでに思い起こさせました。イザヤが、この洞窟の意味について前もって告げ知らせたことを。そして、今日あなたたちと共に来た人たちのために、この箇所をもう一度挙げます。そしてわたしは、先に挙げたイザヤからの言葉を読み、付け加えました。ミトラー教の秘儀の祭司たちが、これらの言葉のゆえに、悪魔に駆り立てられて、自分たちが「洞窟」と彼らの間で呼ばれる場所の中で秘義に入れると語ったことを。</p><p>しかし、アラビアからの魔術師たちが、ヘロデのもとに、彼が望んだとおりには帰らず、命令に従って別の道によって自分の国へと帰り、ヨセフとマリヤと幼子もまた顕現によってエジプトへと赴いたとき、ヘロデは、魔術師たちが拝しに来た幼子を知らず、一般にベツレヘムの子どもたちをすべて殺すようにと命じました。そしてこの出来事はエレミヤによって預言されました。聖なる霊は彼を通してこう語っているからです。「ラマの中で声が聞かれた。泣き声と多くのうめき声。ラケルは自分の子たちのことで泣き、慰められることを望みませんでした。なぜなら、彼らはいないからです」（<a href="https://bibleox.com/ja/jp-ni/ier/31/#L15">エレ. 31:15</a>）。それゆえ、ラマの中から——すなわちアラビアから（今日でもアラビアにはラマと呼ばれる場所があるのですから）——聞かれるはずであったその声のために、泣き声は、ヤコブ——イスラエルと呼ばれた聖なる族長——の妻ラケルが葬られた場所、すなわちベツレヘムを満たすはずでした。そしてこれは、女たちが自分の殺された子たちのために泣き、このような災いの中で慰めを持たなかったことのゆえに。——イザヤの言葉「ダマスコの力の財産とサマリヤの戦利品を取る」は、キリストが生まれた後に、ダマスコの中に住む、偽りの霊の力に打ち勝つことを示しています。そしてこれが明らかに成就しました。魔術師たち——彼らは、戦利品として、悪魔が行っていたあらゆる悪い業に引きずり込まれていました——は、キリストへの自分の到来と拝によって明確に示しました。彼らは、自分たちを自分の戦利品とした力に立ち上がったことを。そしてこの力は、預言がわたしたちに神秘をもって示したとおり、ダマスコの中に住んでいました。この力は、罪で満ちた不敬虔なものとして、象徴的にサマリヤと呼ばれることは大いにふさわしいです。そして、ダマスコが、アラビアの地に属していたこと、属していること——今では、シロ・フェニキアと呼ばれる国に併合されていますが——は、あなたたちの誰も反駁できません。それゆえ、皆さん、あなたたちが理解していないことを、神から恵みを受け取った人たち——すなわち、わたしたちキリスト者たち——から知ることが良かったでしょう。神聖なものを残して、自分自身の教えをあらゆる仕方で堅めようと努めるのではなく。それゆえ、この恵みはわたしたちへと移されました。イザヤが次の言葉で語るとおりに。「この民はわたしに近づく。口と唇でわたしを敬い、しかしその心はわたしから遠く離れている。しかし、彼らのわたしを敬うことは、人の命令と教えを学ぶことのゆえに、無益である。それゆえ、見よ、わたしはこの民にさらに驚くべきことをする。わたしはその民にさらに驚くべきことをする。わたしは智慧ある人たちから智慧を取り去り、分別ある人たちの分別を滅ぼす」（<a href="https://bibleox.com/ja/jp-ni/is/29/#L13">イザ. 29:13</a>、<a href="https://bibleox.com/ja/jp-ni/is/29/#L14">イザ. 29:14</a>）。</p><h2>79</h2><p>そのときトリュフォンは少し怒りました。しかし、彼の顔から見て取れるとおり、聖書を尊重して、わたしに言いました。</p><p>——神の言葉は聖なるものです。しかし、あなたたちの解釈は、あなたの説明から見て取れるとおり、ねじ曲がっています。いや、むしろ不敬虔です。あなたは、御使いたちが罪を犯し、神から離れたと言っているのですから。</p><p>——皆さん——とわたしは答えました。より柔和な声で、彼を聞く気にさせるために——わたしはあなたの敬畏に驚いています。そして、あなたが、御使いたちが仕えていると書かれているその方に対しても、同じ霊の持ち主であることを願います。ダニエルは語っていますから。「その方は人の子のように日の老いたる者のもとへと引き寄せられ、その方に世々の世の限りなくすべての支配が与えられる」（<a href="https://bibleox.com/ja/jp-ni/dan/7/#L13">ダニ. 7:13-14</a>）。そして、皆さん、知っていただくために——とわたしは語りました——わたしたちが、あなたが責めるあの解釈を、自分の大胆さのためにしたのではないことを、イザヤそのものからの証明を挙げましょう。彼は語っています。悪い御使いたちが、エジプトの国、タニスに、住んでいたこと、住んでいることを。彼の言葉はこうです。「あなたたちに災いあれ、逆らう子たちよ、と主は言われる。あなたたちは助言をしたが、わたしによるものではなく、契約をしたが、わたしの霊によるものではない。罪を罪へと付け加えるために。ファラオの助けを得るために、エジプトへと下るために行く（しかしわたしは尋ねなかった）。エジプト人たちの避けの下で守られるために。ファラオの避けはあなたたちにとって恥となり、エジプト人たちに頼る人たちにとっては辱めとなるであろう。なぜなら、タニスの中には悪い御使いたちの君主たちがいるからである。彼らは民に何の助けももたらさないであろう。それは益と助けのためではなく、恥と辱めのためとなるであろう」（<a href="https://bibleox.com/ja/jp-ni/is/30/#L1">イザ. 30:1-7</a>）。そしてゼカリヤも、あなた自身が言及したように語っています。「悪魔は司祭ヨシュアの右に立って、彼に逆らおうとした。しかし主は言われた。エルサレムを選んだ主があなたを責めるように」（<a href="https://bibleox.com/ja/jp-ni/zah/3/#L1">ゼカ. 3:1-2</a>）。そしてさらに、あなたが語ったように、ヨブの書の中にはこう書かれています。「御使いたちは主の前に立ち現れるために来た。そして悪魔は彼らと共に来た」（<a href="https://bibleox.com/ja/jp-ni/iov/1/#L6">ヨブ. 1:6</a>）。そしてモーセの創世記の初めには、蛇がエバを惑わせ、呪われたことが書かれています。そしてわたしたちは知っています。エジプトの中で、魔術師たちが、忠実な僕モーセを通して神が行われた奇跡を模倣しようと努めたことを。そしてダビデが——あなたたちが知っているとおり——言っています。「民の神々は霊たちである」（<a href="https://bibleox.com/ja/jp-ni/ps/96/#L5">詩. 96:5</a>）。</p><h2>80</h2><p>——わたしはあなたに言いました、皆さんよ——とトリュフォンはこれに答えました。あなたは聖書に厳格に従おうと、あらゆる仕方で自分を守ろうとしている、と。それなら言いなさい。あなたたちは本当に、エルサレムのこの場所が再建されることを認めていますか。そして、あなたたちの民が集まり、キリストと共に、族長たちと、預言者たちと、あなたたちの種族から信じた人たちと、同様に、あなたたちのキリストの到来の前に改宗者となった人たちと共に、至福に至ることを望んでいますか。それとも、あなたは、この問答の中で勝者として現れるために、このような認め方に逃げ込んだのですか。</p><p>——わたしはトリュフォンよ、あれほど不幸ではありません——とわたしは答えました——自分が考えているものとは別のことを語るほどには。そしてわたしは、あなたに先に説明しました。わたしと多くのほかの人たちはこれを告げ知らせていることを。あなたたちが完全に確信しているとおり、これが起こるであろうことを。しかし、わたしがあなたに言ったとおり、清く敬虔な心構えを持つキリスト者たちの中に、これを認めない多くの人たちがいます。しかし、キリスト者という名だけを帯びて、実際には無敬虔な不敬虔な異端者である人たちについては、わたしはあなたに示しました。彼らは完全に冒涜的な、無敬虔な、狂ったことを教えていると。しかし、あなたたちは知っていただくために、これをあなたたちだけの前で語っているのではないことを、わたしは、自分の力が許す限り、これらの対話の全体を書物の中で叙述します。その中に、わたしは、あなたたちの前で述べているのと同じ思想を入れます。なぜなら、わたしは、人たちに、あるいは人の教えにではなく、神とその教えに従うことを望むからです。もしあなたたちが、キリスト者と呼ばれながら、これを認めず、アブラハムの神、イサクの神、ヤコブの神を褻る勇気さえ持ち、死者の復活を認めず、自分たちの魂が死の後にすぐに天に取られると考える人たちに出会うなら、彼らをキリスト者と考えないでください。ちょうど、あらゆる健全な判断を持つ人が、サドカイ人たちを、あるいはそれに類する「異端」——ゲニストたち、メリストたち、ハディレヤ人たち、エリヤ人たち、パリサイ人たち、洗礼者たち（わたしが自分の考えを語るのを悪しんで受け取らないでください）——を、ただ名においてのみ、ただ口においてのみ神を拝し、その方ご自身が言われるとおり、心においてその方から遠く離れている、ユダヤ人たち、そしてアブラハムの子たちとは考えないように。しかし、わたしと、すべての点において分別あるキリスト者たちは、体の復活と、エルサレムの中の千年が起こることを知っています。エルサレムは、エゼキヤとイザヤとほかの預言者たちが告げ知らせるように、建てられ、飾られ、大いなるものとなるのです。</p><h2>81</h2><p>——イザヤはこの千年についてこう語っています。「新しい天と新しい地があろう。そして、前のものは覚えられることなく、心に上らないであろう。しかし、彼らはその中で歓びと歓呼を見出すであろう。わたしが造るもののゆえに。見よ、わたしはエルサレムを歓びとし、わたしの民を歓呼としている。そしてわたしはエルサレムについて歓び、わたしの民について歓呼するであろう。そして、泣き声の声はその中にいっそう聞かれず、叫び声の声も聞かれないであろう。そしてそこには、もはや、自分の時を成し遂げない乳児も老人もいなくなるであろう。なぜなら、若い人は百年の者であり、死んで行く罪人は百年の者であり、呪われるであろう。そして彼らは家を建て、自分たちが住むであろう。そして葡萄園を植え、自分たちでその実を食べ、その酒を飲むであろう。彼らは、ほかの人たちが住むように建てず、ほかの人たちが食べるように植えないであろう。なぜなら、命の木の日のように、わたしの民の日々は長く、その労働の業は増し加わるであろうから。わたしの選んだ者たちは、無益に労働せず、呪いのために子を生むこともないであろう。なぜなら、彼らは正しい種子であり、主によって祝福された子孫であり、その子孫たちは彼らと共にいるであろうから。そして次のことが起こるであろう。わたしは、彼らがまだ呼び求める前に、彼らに聞く。彼らがまだ語っているうちに、わたしは彼らに言う。これは何か、と。そのとき、狼と小羊は共に牧され、獅子は牛のように藁を食べ、蛇はパンのように地を食べるであろう。彼らは、聖なる山の上で悪を行わず、破壊もしないであろう、と主は言われる」（<a href="https://bibleox.com/ja/jp-ni/is/65/#L17">イザ. 65:17-23</a>）。これらの言葉の中で語られていること——「命の木の日のように、わたしの民の日々は長く、その労働の業は」と——から、わたしは続けました——わたしたちは、ここで千年が神秘をもって示されていると理解します。なぜなら、アダムに語られたとき——「どの日においても、その木から食べるなら、その日に死ぬであろう」（<a href="https://bibleox.com/ja/jp-ni/gen/2/#L17">創. 2:17</a>）——、わたしたちは、彼が千年を越えて生きなかったことを知っています。そしてまた、次の言葉も同じことへと導くことを知っています。「主の日は千年のようである」（<a href="https://bibleox.com/ja/jp-ni/2pet/3/#L8">２ペト. 3:8</a>）。さらに、わたしたちの中には、ヨハネという名の人がいました。キリストの使徒たちの中の一人です。彼に示された黙示の中で、彼は預言しました。わたしたちのキリストを信じる人たちは、エルサレムの中で千年生きること、そしてその後に、すべての人たちの一般的な、一言で言えば、永遠の復活が起こること、そしてその後に裁きが来ることを。わたしたちの主も言われたとおりです。「彼らは妻を娶らず、嫁がず、御使いたちと同じであり、神の復活の子として」（<a href="https://bibleox.com/ja/jp-ni/lk/20/#L35">ルカ. 20:35-36</a>）。</p><h2>82</h2><p>——わたしたちのもとには、今日でも預言の賜物があります——とわたしは続けました。そこからあなたたちは理解すべきです。以前にはあなたたちの民の中に存在していたものが、わたしたちのもとへと移されたことを。あなたたちの中で、聖なる預言者たちの中に偽りの預言者たちがいたように、今もわたしたちの中には多くの偽りの教師たちがいます。わたしたちの主が、それらに注意するようにと命じられた人たちです。それゆえ、わたしたちは、あらゆることに対して整えられています。その方が、死者の中からの復活と天への上昇の後に、わたしたちに起こるべきことを前もって知っておられたことを知っているからです。その方は言われました。わたしたちがその方の名のゆえに殺され憎まれること。そして多くの偽りの預言者たちと偽キリストがその方の名のもとに来て、多くの人を惑わすこと。そしてこれは成就しています。多くの人たちが、その方の名のもとに、無敬虔な、冒涜的な、不敬虔な教えを広めたからです。彼らは教えましたし、今日でも教えています。穢れない霊、悪魔がその思いの中に入れ込むことを。このような人たちを、あなたたちと同じように、わたしたちは、迷いから離れるように説こうと努めます。真理を語ることができるのに語らない人は、神によって裁かれると確信しているからです。神ご自身がエゼキヤを通して証しされたとおりです。「わたしはあなたをユダの家の見張り人としました。罪人が罪を犯し、あなたがその人を警告しないなら、その人自身は自分の罪のゆえに滅び、その人の血をわたしはあなたの手から求める。しかし、あなたがその人を警告したなら、あなたは無実である」（<a href="https://bibleox.com/ja/jp-ni/iez/33/#L7">エゼ. 33:7-9</a>）。それゆえ、わたしたちは、聖書に従って、恐れのうちにあなたたちと対話するように努めます。しかし、金への、栄誉への、快楽への情欲によってではありません。誰も、このようなことにおいてわたしたちを責めることはできません。そして、わたしたちは、あなたたちの民の長官たちのように生きたくありません。神が責めておられる人たち。「あなたたちの長官たちは泥棒の分有者であり、贈り物を愛し、報いを追い求める」（<a href="https://bibleox.com/ja/jp-ni/is/1/#L23">イザ. 1:23</a>）。そして、このような人たちがわたしたちの中にもいるとしても、あなたたちは、その人たちのためにキリストと聖書を褻らず、それらを歪めて解釈しないでください。</p><h2>83</h2><p>——それなら、言葉「主はわたしの主に仰せられた。わたしの右の座に座れ。わたしがあなたの敵をあなたの足台とするまで」を、あなたたちの教師たちは、それがエゼキヤに関わるかのように解釈する勇気を持ちました。あたかも、アッシリアの王が彼に脅迫を送ったとき、彼に神殿の右側に座るようにと命じられ、イザヤを通して、敵を恐れないようにと告げ知らせられたかのように。わたしたちは、イザヤによって語られたことがそのとおりに成就したこと、アッシリアの王がエゼキヤの日々のうちにエルサレムの包囲から離れ、主の御使いがアッシリアの陣営の中で十八万五千人にまで殺したことを知っています。そしてこれも認めています。しかし、詩篇がエゼキヤに関わるものではないことは明らかです。それはこう読まれます。「主はわたしの主に仰せられた。わたしの右の座に座れ。わたしがあなたの敵をあなたの足台とするまで。主はエルサレムへと力の杖を送るであろう。そしてあなたの敵たちの中で統治するであろう。聖なる光り輝きのうちに、わたしはあなたを、明けの星の前に胎から生んだ。主は誓われ、悔い改められることはない。あなたはメルキセデクの位に従って、世々限りなく司祭である」（<a href="https://bibleox.com/ja/jp-ni/ps/110/#L1">詩. 110:1-4</a>）。誰が、エゼキヤがメルキセデクの位に従って世々限りなく司祭ではなかったことに同意しないでしょうか。誰が、彼がエルサレムの解放者ではなかったことを知らないでしょうか。誰が、彼がエルサレムへと力の杖を送らず、自分の敵たちの中で統治しなかったことを知らないでしょうか。しかし、神が彼が泣き、うめいているときに敵を彼から取り去られたのです。しかし、わたしたちのイエスは、まだ栄光のうちには来ていませんが、エルサレムへと力の杖を送られました。すべての民のための召しの言葉、悔い改めの言葉を。ダビデの言葉によれば、その方の上で霊たちが統治していた民の上に。「民の神々は霊たちである」（<a href="https://bibleox.com/ja/jp-ni/ps/96/#L5">詩. 96:5</a>）。そしてこの力ある言葉は、多くの人を、彼らが仕えていた霊たちから離れさせるに至りました。そしてその方を通して全能の神を信じるように。なぜなら、民の神々は霊たちだからです。そして言葉「聖なる光り輝きのうちに、わたしはあなたを胎から、明けの星の前に生んだ」は、先に言ったとおり、キリストに関わるものです（<a href="https://bibleox.com/ja/jp-ni/ps/110/#L3">詩. 110:3</a>）。</p><h2>84</h2><p>——その方についても「見よ、おとめは腹の中に孕み、子を生む」と語られています——とわたしは言いました。イザヤが語っていた方、すなわちイザヤがその方のことがおとめから生まれるはずであったと語っていた方でないなら、聖なる霊は誰について「見よ、主ご自身がしるしを与えます。見よ、おとめは腹の中に孕み、子を生む」と叫んだのでしょうか。もしその方が、すべてのほかの初生の子たちのように交わりから生まれるはずであったなら、なぜ神ご自身が、すべての初生の子たちに共通ではないしるしを与えると言われたのでしょうか。しかし、真にしるしであるもの、全人類の信仰の主題であるべきもの——すべての被造物の中の初生の子がおとめの胎から自分の肉を取り、真に若い子となること——について、イザヤは、預言の霊を通して、あなたたちに叙述したような、異なる仕方で前もって告げ知らせました。それが成就するときに、それが万物の造り主の力と意志によって起こったことを知るためです。ちょうど、エバがアダムの一つの肋骨から生み出され、ほかのすべての動物たちが初めに神の言葉によって造られたのと同じように。しかし、あなたたちはここでも、プトレマイオス——エジプトの王——のもとであなたたちの長老たちが行った訳を歪める勇気を持ち、聖書の中には、彼らが訳したとおりではなく、「見よ、若い女は腹の中に孕む」と語られていると言っています。あたかも、女が男との交わりから生むなら、大いなることが示されたかのように。これはすべての若い女たちが行うことです。不妊の者たちを除いては。しかし、望まれるなら、神は、これらの者たちさえも生むことができるようにする力を持っています。サムエルの母は、以前は生まなかったのに、神の意志によって生みました。聖なる族長アブラハムの妻についても、そして洗礼者ヨハネを生んだエリサベトについても、そしてあるほかの人たちについても同じことが言えます。それゆえ、あなたたちは、神が望むものをすべて成し遂げることができないと考えるべきではありません。特に、何かが預言されているなら、預言を歪めたり、曲げたりする勇気を持つな。これによって、あなたたちは自分自身にだけ悪を行うことになります。神を損なうことはありません。</p><h2>85</h2><p>——預言の言葉「門よ、あなたたちの頭を上げよ。永遠の門よ、あなたたち自身が高く上げられるように。栄光の王が入るように」（<a href="https://bibleox.com/ja/jp-ni/ps/24/#L7">詩. 24:7-9</a>）を、あなたたちの中のある人たちはエゼキヤに、ほかの人たちはソロモンに帰す勇気を持っています——とわたしは言いました。しかし、預言の中では、あれとも、これとも、あなたたちの王たちの中のほかの誰ともではなく、わたしたちのあのキリストだけについて語られていることを証明することができます。キリストは、イザヤの、ダビデの、そしてすべての聖書の言葉によれば、美しさと栄光なしに現れました。その方は「万軍の主」です。これがその方に与えられた意志のゆえに。その方は死者の中から復活し、天に上がられました。詩篇と、その方を「万軍の主」と宣言する聖書のほかの箇所が示しているとおりに。そうすれば、あなたたちは、たとえ今でも望むなら、あなたたちの目の前で行われていることから容易に納得できます。あらゆる悪魔が、この神の子——すべての被造物の中の初生の子——の名による呼びかけによって打ち勝たれ、服従するのですから。その方はおとめから生まれ、苦しむ人間となり、あなたたちの民によって、ポンティウス・ピラトゥスのもとで磔にされ、死に、死者の中から復活し、天に上がられた方です。しかし、もしあなたたちが、かつてあなたたちの中にいた人たち——王たちや聖なる人たち、預言者たちや族長たち——の名によって何かを呼びかけるなら、どの悪魔もあなたたちに服従しません。そして、もしあなたたちの中の誰かが、アブラハムの神、イサクの神、ヤコブの神によって呼びかけるなら、おそらく服従するでしょう。しかし、あなたたちの中のある呼びかけの持ち主たちは——とわたしは言いました——異邦人たちのように業によって呼びかけ、香料と包帯を用います。ダビデの詩篇はまた、御使いたちと力ある者たちの存在を証明しています。預言の言葉は、彼らに、門を上げるようにと命じています。父の意志によって死者の中から復活した、万軍の主、イエス・キリストが上るためです。この詩篇を、昨日わたしたちと共にいなかった人たちのために、もう一度繰り返します。わたしは今、昨日わたしが語ったことの大部分を、彼らのために簡潔に挙げます。そして、もしあなたたちにこのことを語るなら——同じことを何度も語ってきたにもかかわらず——、これが場違いではないことを知っています。わたしたちは見ます。太陽、月、そしてほかの星たちは常に同じ道を巡り、時の変化をもたらすことを。同じように、算数に取り組む人は、二つと二つはいくつかと問われると、何度も「四つ」と語ってきたにもかかわらず、やはり「四つ」と繰り返すことをやめません。同じように、周知のほかの事柄についても、常に同じように語り、主張します。その後に、預言の書物に基づいて自分の対話を築いている人が、それらを省き、同じ箇所を繰り返さないこと、そして聖書よりも良いものを作り上げ、語ると考えることは、笑うべきことになるでしょう。それゆえ、わたしが言ったように、天において御使いたちと力ある者たちの存在を証明する言葉は、こう読まれます。「天において主を讃めよ。高さにおいて、その方を讃めよ。その方のすべての御使いたちよ、その方を讃めよ。その方のすべての力ある者たちよ、その方を讃めよ」（<a href="https://bibleox.com/ja/jp-ni/ps/148/#L1">詩. 148:1-2</a>）。</p><p>そのとき、第二の日に来た人たちの中の一人、ムナシオンという名の人が言いました。——そして、あなたがわたしたちのために同じことを繰り返そうと努めていることを、わたしたちも喜んでいます。</p><p>——皆さん、聞いてください——とわたしは言いました。わたしがこれを行うのは、聖書のどのような命令に従っているかを。イエスは、わたしたちに、敵たちさえ愛するようにと命じられました。イザヤもこれをくわしく教えています。その言葉の中には、わたしたちの再生の神秘について、そしてエルサレムの中でのキリストの現れを待ち望み、業によってその方に喜ばれようと努めるすべての人たちについても語られています。イザヤの言葉はこうです。「主の言葉に聞け、その言葉に震える人たちよ。あなたたちを憎み、迫害する人たちに言え。兄弟たちよ、主の名が栄え、そして現れるように、と。その方は、彼らの誇りのときに現れ、彼らは辱められるであろう。都の中からの騒ぎの声、民からの声、高慢な人たちに報いを返される主の声。苦しむ女が子を生む前に、そして痛みの苦しみが来る前に、その女は子を生む前に解放された。誰がこのようなことを聞いたでしょうか。誰がこのようなことを見たでしょうか。地は一日のうちに生んだでしょうか。民は一度に生まれたでしょうか。シオンは苦しみ、しかし子たちを生んだ。しかし、わたしは、生まなかったその女にさえ、この望みを与えた、と主は言われる。見よ、わたしは、生む女と不妊の女を作った、と主は言われる。歓びなさい、エルサレムよ。そして、その方を愛するすべての人たちは歓びの歓びとせよ。それについて泣くすべての人たちは歓びなさい。そうすれば、あなたたちは、その慰めの乳房から飲み、満ち足りるであろう。そして、満ち足りて、その方の栄光の入りのうちで楽しむであろう」（<a href="https://bibleox.com/ja/jp-ni/is/66/#L5">イザ. 66:5-11</a>）。</p><h2>86</h2><p>——聞いてください——とわたしは付け加えました——楽園の中に植えられた命の木と、すべての聖なる人たちの上に起こるはずであった出来事が、聖書が証しするところによれば、その方のことを象徴していたのです。その方は、十字架の磔の後に、栄光のうちに再び来られる方です。モーセは、民を解放するために杖と共に遣わされ、それを手に持って、民の前で海を裂きました。杖によって、彼は石から水を出しました。マラの苦い水の中に木を投げ込み、それを甘くしました。ヤコブは、器の中の水の中に杖を置いて、叔父の羊たちが腹の中で孕むものを得ました。彼は実りを自分のものとしました。同じヤコブは、杖をもって川を渡ったと誇っています。同じ人は、梯子を見たと言いました。そして、その上に聖書が証しするように神が座しておられた。しかし、それは父ではありませんでした。わたしたちは聖書からこれを証明しています。そして、ヤコブがこの同じ場所で石の上に油を注いだとき、その方ご自身から、彼に現れた神から、神のために柱に油を注いだという証しを受け取りました。そしてわたしたちは証明しました。キリストが多くの聖書の箇所において神秘をもって石と呼ばれていることを。また、油によって、あるいは香膏によって、あるいはほかの香り高い軟膏によるあらゆる油注ぎが、聖書の言葉に従って、その方の像であったことを証明しました。「それゆえ、神、あなたの神は、あなたの同席者たちよりも喜びの油をもってあなたに油を注がれた」と（<a href="https://bibleox.com/ja/jp-ni/ps/45/#L8">詩. 45:8</a>）。すべての王たちと油注がれた者たちは、その方から、王たち、油注がれた者たちという呼び名を受け取りました。しかし、その方ご自身が父から受け取った呼び名は、王、キリスト、司祭、御使い、そしてその方が持つ、あるいは持っていた、そのようなほかの名々です。アロンの芽を出した杖は、その方が大司祭であることを示しました。イザヤは預言しました。イッサイの根から杖が生じること——キリストです。そしてダビデは言います。正しい人は「川の流れのところに植えられた木のようであり、その時期に自分の実を与え、その葉は落ちません」と（<a href="https://bibleox.com/ja/jp-ni/ps/1/#L3">詩. 1:3</a>）。そしてさらに、正しい人は「棕櫚のように開花する」と語られています（<a href="https://bibleox.com/ja/jp-ni/ps/92/#L13">詩. 92:13</a>）。神は木のもとでアブラハムに現れました。書かれているとおり、「マムレの樫の木のもとで」です。ヨルダンを渡った後に、民は七十本の柳の木と十二の泉を見つけました。ダビデは、杖と棒によって神からの慰めを受け取ったと言います（<a href="https://bibleox.com/ja/jp-ni/ps/23/#L4">詩. 23:4</a>）。エリシャは木をヨルダンの川の中に投げ込み、底から鉄の斧を引き上げました。預言者の息子たちは、その斧を持って、家を建てるための木を切りに来ました。そこで律法と神の命令を読み、考察するためです。ちょうどわたしたちのキリストが、わたしたちを贖ったように。自分たちが犯した、最も重い罪に沈んでいたわたしたちを、木の上の磔を通して、そして水による聖化を通して。そしてわたしたちを祈りの家、拝の家としたのです。杖は、ユダ——タマルから、偉大な神秘なしではなく生まれた子たちの父——を示しました。</p><h2>87</h2><p>——わたしの言葉が終わったとき、トリュフォンは言いました。——わたしが尋ねるからといって、あなたの語ることを反駁しようとしているとは思わないでください。わたしは、尋ねていることについての教えを望んでいます。それなら言いなさい。もし聖書がイザヤを通して「杖がイッサイの根から出て、花がイッサイの根から出て、その方の上に神の霊が留まる。知恵と分別の霊、助言と力の霊、認識と敬虔の霊が留まる。そして神への恐れの霊がその方を満たす」と語っているなら——そして、あなたが認めるとおり、これらの言葉はキリストに関わるものです——そして、あなたが語るとおり、その方は神として前に存在していたのに、神の意志によって受肉し、おとめから人として生まれたなら——どのようにして、イザヤが数えた、聖なる霊の力によって満たされるその方の前に存在したことを証明できるのでしょうか。まるでその方がそれらを必要としていたかのように。</p><p>——あなたは非常に難解で聡明な問いを提出しました——とわたしは答えました。実際、ここではある困難が提示されています。しかし、その解決を理解していただくために、わたしが語ろうとしていることを聞いてください。聖書は語っています。聖なる霊のこれらの数えられた賜物がその方の上に降ったのは、その方がそれらを必要としていたからではなく、それらがその方の上に留まるはずであったからです。すなわち、その方の中で終わりに至るためです。そうすれば、後には、あなたたちの民の中に、以前のように預言者たちが現れるはずはありません。これをあなたたち自身が見ることができます。その方の後には、あなたたちの中には一人の預言者も全くいませんでしたから。わたしが語ることに注意を払いなさい。すなわち、あなたたちの預言者たちの各人は、神からある一つの力、あるいは別の力を受け取り、わたしたちが聖書から知っている業を行うか、語りました。ソロモンは知恵の霊を持っていました。ダニエルは助言と分別の霊を。モーセは力と敬虔の霊を。エリヤは恐れの霊を。イザヤは認識の霊を。そしてほかの人たちも、各人が一つの力を、あるいはほかの力と共に持っていました。エレミヤ、十二の預言者、ダビデ、そしてあなたたちの中に存在したすべての預言者たちのように。それゆえ、聖なる霊の力は留まりました。すなわち、働くことを止めました。あの方の到来と共に。その方の後に、この経営の中で——彼が人たちの間で成し遂げたもの——それらはあなたたちから遠ざかるはずであり、その方の上に留まり、預言に従って、再び賜物となるはずでした。その方が、あの霊の力の恵みによって、その方を信じる人たちに、各人の分に応じて与える賜物として。「その方は高さに上られ、捕らわれを捕らえ、人間に賜物を与えられた」と聖書は語っています（<a href="https://bibleox.com/ja/jp-ni/ps/68/#L19">詩. 68:19</a>）。そして別の預言の中ではこう語られています。「そしてこのことの後に、わたしはわたしの霊をすべての肉の上に注ぐであろう。わたしの僕たちの上に、わたしの女奴隷たちの上に。そして彼らは預言するであろう」（<a href="https://bibleox.com/ja/jp-ni/iol/3/#L1">ヨエ. 3:1-2</a>）。</p><h2>88</h2><p>そしてわたしたちの中には、神の霊からの賜物を持つ女たちも、男たちも見ることができます。それゆえ、その方が力を必要としていたからではなく、それらがもはや存在しなくなるために、イザヤが数えた力がその方の上に来ることが預言されたのです。これの証しは、すでに言ったように、アラビアの魔術師たちによって行われたことです。彼らは、幼子が生まれるとすぐに、その方に来て拝しました。その方が生まれるとすぐに、すでに自分の力を持っていたからです。そして、ほかのすべての人たちに共通な仕方で成長し、有用なものを用いながら、各時代にふさわしいものを示し、あらゆる種類の食物を食べ、三十年ほど留まったのでしょう。それより多く、あるいは少なく。ヨハネが、その方の到来の前駆者として先に来るまで。わたしがすでに示したとおり、洗礼の道におけるその方の前駆者として。そしてイエスが、ヨハネが洗礼を施していたヨルダンの川のもとに来て、水の中へと下ったとき、ヨルダンの上に火が燃え上がりました。そしてその方が水から出られたとき、聖なる霊が鳩のように、その方の上に降りました。このキリストご自身の使徒たちが書いたとおりに。そしてわたしたちは知っています。その方が川のもとに来られたのは、洗礼や、鳩の形でその方の上に降った霊を必要としていたからではありません。また、その方が生まれること、磔にされることに身を低められたのも、それを必要としていたからではなく、人類のために成し遂げられたのです。人類はアダムから、死と蛇の惑わしに陥りました。各人が自分自身の罪のゆえに悪を行っていたからです。神は、選択の自由と自主権を授けられた御使いたちも、人間たちも、その方が彼らを有能にされたことを行うように望まれ、彼らをこのように造られました。すなわち、もしそれらがその方に喜ばれるものを選ぶなら、その方はそれらを朽ちないものとして、刑罰から解放されたものとして保存するであろう。しかし、悪を行うなら、各人をその方が望まれるとおりに罰するであろう、と。そして、その方がロバに座ってエルサレムに入られたこと——それについて預言されたことをわたしが示したとおり——は、その方がキリストであるための力を与えたのではありません。人たちに、その方がキリストであることを指し示したのです。ちょうど、ヨハネのもとでも、人たちが誰がキリストであるかを知るように、指し示すことが必要であったように。ヨハネがヨルダンのところに座り、悔い改めの洗礼を告げ知らせていたとき、皮の腰帯と駱駝の毛の服だけを着て、バッタと野の蜜以外は何も食べずに。人たちは、その方がキリストであると考えました。しかし、その人は自分で彼らに宣言しました。「わたしはキリストではありません。しかし、呼び求める者の声です。わたしよりも強い方が来られるであろう。その方の履の紐を解くのにわたしはふさわしくない」と。しかし、イエスがヨルダンのもとに来られたとき、その方は、大工ヨセフの子として敬われ、聖書が前もって告げ知らせたとおり、姿のないものとして見え、大工と思われていました。その方が人たちの間で生きながら、大工の業に取り組み、鋤と轡を作り、義と活動的な生き方を人たちに教えたからです。そのとき、聖なる霊が——わたしが先に言ったとおり——人たちのために、鳩の形のうちにその方の上に降りました。そして同時に、天から声が来ました。ダビデを通しても語られた声。あたかも自分の口から語るかのように、父からその方に語られるはずであったことを語った人によって。「あなたはわたしの子である。わたしは今日、あなたを生んだ」（<a href="https://bibleox.com/ja/jp-ni/ps/2/#L7">詩. 2:7</a>）。</p><p>この声は、その方の誕生が、その方が人たちに知られるようになった時から、人たちにとってのものであることを表明していました。</p><h2>89</h2><p>——あなたはよく知っています——とトリュフォンは言いました。わたしたちの民全体がキリストを待ち望んでいること、そして、わたしたちは、あなたが挙げた聖書の箇所がすべてその方について語られていることを認めていることを。そしてわたしは告白します。ナベの子に与えられたイエスという名は、わたしをこれに同意させるように仕向けました。しかし、わたしたちは迷っています。キリストがこれほど栄えなく磔にされるはずであったかどうかを。律法の中にはこう語られているからです。「磔にされるすべての者は呪われる」と。それゆえ、わたしはこれを信じることに大いに迷っています。聖書が、キリストが苦しむはずであったと語っていることは明らかです。しかし、わたしたちは知りたいのです。その方が、律法の中で呪われた類の苦しみを耐えることを証明できるかどうかも。</p><p>——もしあなたたちの民の不義のゆえに——とわたしは答えました——その方が死に渡されることなく、預言者たちが、その方が辱められ、打たれ、無法者たちの中に数えられ、その由来を誰も語り得ない方として、羊のように屠りに引かれると預言していなかったなら、正しく驚くことができたでしょう。しかし、もしこれらがその方を特徴づけ、すべての人にその方を示しているなら、わたしたちがその方を大胆に信じないでいられましょうか。そして、預言者たちの言葉を理解した人たちはすべて言うでしょう。これはその方であり、ほかの人ではない、と。ただ、その方が磔にされたと聞くなら。</p><h2>90</h2><p>——それなら、聖書からわたしたちに教えてください——とトリュフォンは言いました。そうすれば、わたしたちもあなたを信じることになるでしょう。キリストが苦しむこと、羊のように引かれることは、わたしたちは知っています。しかし、その方が磔にされること、律法の中で呪われた、あれほど恥辱ある栄えない死で死ぬこと——証明してください。わたしたちはこれを理解することさえできないのですから。</p><p>——あなたは知っています——とわたしは答えました——預言者たちが、自分の言葉と業を——あなたたちも同意したとおり——たとえ話と前型の中で開示したこと。その中に含まれる真理を覆いながら。そうすれば多くのことは、すべての人に容易に理解されることはありませんでした。真理を見出し、知ろうと努める人たちのために。</p><p>——わたしたちはこれを認めました——と彼らは言いました。</p><p>——それなら聞きなさい——とわたしは言いました——さらに続くことを。モーセが最初に、自分が行ったしるしによって、その方の、見かけ上のあの呪いを示しました。</p><p>——どのようなしるしについて語っているのですか——とトリュフォンは尋ねました。</p><p>——民がアマレクと戦っていたとき——とわたしは答えました——イエスと呼ばれたナベの子が戦いを指揮していました。モーセご自身は、両側に自分の両手を広げて神に祈っていました。アロンとオルは、一日中、彼らを支えていました。彼の疲れから手が下がらないように。もしそれが、十字架を示すあのしるしから、彼が何かを下げたなら、モーセの書物の中に書かれているとおり、民は打ち負かされました。しかし、彼がこの姿のうちに留まったなら、アマレクは同じ程度に打ち負かされました。そして強い方は、十字架から力を持っていたのです。民が勝利を収めたのは、モーセがそのように祈ったからではなく、イエスという名が戦いの前にあった間に、その人が十字架のしるしを作っていたからです。あなたたちの中の誰が知らないでしょうか。あれほど神をなだめる祈りは、泣き声と涙と共に、地への伏しと、膝の跪きと共に行われるあの祈りであることを。このようにして、彼自身も、石の上に座っていたほかの人たちも、祈りを献げませんでした。しかも石さえキリストの象徴でした。わたしがすでに示したとおりです。</p><h2>91</h2><p>——神はまた別の仕方で、十字架の神秘の力を示されました——とわたしは言いました。モーセを通して、その方がヨセフを祝福した祝福の中で語っておられます。「主の祝福から、その人の地は。天の変化から、露から、下の深い泉から、その時期の太陽の巡りがもたらす実りから、月の巡りから、古い山々の頂から、永遠の丘の高さから、そして地の実りの満ちたところから。そして、いばらの木の中に現れた方の御心にあるものが、ヨセフの頭の上に、兄弟たちの中で分離された人の頭の頂に来るように。その方の輝きは初生の雄牛の輝きのようであり、その角は独角獣の角である。その方の角によって、彼は地の果てから民を一度に突き刺すであろう」（<a href="https://bibleox.com/ja/jp-ni/vtor/33/#L13">申. 33:13-17</a>）。しかし、十字架を表現する像のほかの何かの中に、あるいは形の中に、独角獣の角があると言い、証明する人は誰もいないでしょう。なぜなら、ここでは、それは真っ直ぐな木であり、その最も高い部分が、角のような形で高く上がっています。もう一つの木がその上に横切って付けられるとき。そして後者の端々が両側に、一つの角に付けられた角のように見えます。磔にされる人たちが引き上げられる、真ん中に堅く据えられた木も、角のように突き出ており、ほかの角たちと結ばれ、堅く据えられると、角の姿を表しています。そして言葉「その方の角によって、彼は地の果てから民を一度に突き刺すであろう」は、すべての民の中で今日行われていることを明確に描いています。すべての民から出た人たちは、その角によって突き刺されました。すなわち、この神秘を通して突かれました。そして空しい偶像と霊たちから、神の礼拝へと立ち帰りました。しかし、信じない人たちに対しては、同じしるしが滅びと裁きの中で現れます。民がエジプトから出て行ったとき、モーセの両手の伸長の像と、ナベの子に与えられたイエスという名によって、アマレクが打ち負かされ、イスラエルが勝利したのと同じように。そして、蛇の咬みによって、イスラエルに対して用いられた像としるしも、明らかに、信じる人たちの安全のために立てられました。なぜなら、そのときすでに、十字架を担う方を通して蛇への死が前もって告げ知らせられていたからです。そして、その方によって咬まれた人たちが、その方を信じることによって救われること。その方こそ、自分の子を世界へと遣わされた方で、磔にされた方です。なぜなら、預言の霊は、モーセを通して、わたしたちに蛇を信じるように教えたのではありません。その方が、蛇が初めに神によって呪われたことを宣言するとき、そしてイザヤを通して、その方が敵として、偉大な剣によって殺されることを示すとき。剣とはキリストのことです（<a href="https://bibleox.com/ja/jp-ni/is/27/#L1">イザ. 27:1</a>）。</p><h2>92</h2><p>——それゆえ、預言者たちが語り、行ったことを理解するための大いなる恵みを神から受け取っていない人は——とわたしは言いました——、その人の言葉や業を述べ伝えるように見えながら、それらについて説明を与えることができないなら、何の益も受けません。預言者たちを理解しない人たちによって述べ伝えられるなら、多くの人たちの目には軽蔑に値するものと見えるでしょう。もしあなたたちに尋ねたいと望む人がいるなら——ハノクとノアが子たちと共に、そしてそれに似たほかの人たちも、割礼を受けず、安息日を守らずに神に喜ばれたのに、なぜ、これほど多くの世代の後、神は、別の指導者たちと別の律法を通して、アブラハムからモーセまでの人たちを割礼を通して、そしてモーセの後には、割礼とほかの設け——安息日、献げ物、灰、供え物——を通して義とされることを喜ばれたのか、と。あなたたちはこれに何を言うでしょうか。わたしが先に言ったことのほかには。すなわち、神は将来を見る方として、あなたたちの民が正当にもエルサレムから追放されること、そしてあなたたちの誰もそこに入ることを許されないことを知っておられた、と。そして、あなたたちはほかの何ものによっても認められません。ただ肉の割礼によってのみ。そしてアブラハムは、自分の義についての証しを神から、割礼によってではなく、信仰によって受け取りました。彼が割礼を受ける前に、彼についてこう語られているからです。「アブラハムは神を信じた。そしてこれは彼に対して義とみなされた」（<a href="https://bibleox.com/ja/jp-ni/gen/15/#L6">創. 15:6</a>）。そして、わたしたちは——肉において包皮のないままに、キリストを通して神を信じ、自分の獲得者たちにとって有益な割礼、すなわち心の割礼を持っている人たち——神の前に正しく、神に喜ばれるものとして現れることを望んでいます。わたしたちはすでに、その方から、預言の言葉を通してこの証しを受け取っているからです。そして、あなたたちに安息日を守ることと、あなたたちの献げ物を献げることが命じられ、主が場所に神の名で呼ばれることを許されたのは、先に言ったとおり、あなたたちが偶像礼拝せず、神を忘れず、不敬虔な無敬虔なものとならないためでした。あなたたちが常にそうなっていたように。そして、このことのゆえに神が安息日と供え物についての命令をあなたたちに与えられたことは、先の語りの中でわたしがすでに示しました。しかし、今日来た人たちのために、わたしは、わたしのほとんどすべての主張を繰り返すつもりです。もしこうでないなら、神は偽られるでしょう。あたかもその方が将来を前もって見ず、モーセの前には多くの世代の人たちがいたのに、すべての人に同じ義を知り、行うように教えなかったかのように。そして、神は真実で正しい方であり、その方のすべての道は裁きであり、その方の中に不義は存在しない、と語っている聖書は不正なものとなるでしょう（<a href="https://bibleox.com/ja/jp-ni/vtor/32/#L4">申. 32:4</a>）。しかし、聖書が真実であるので、神は、あなたたちが常に無分別で自分自身を愛するままでいることを望まれません。そうすれば、あなたたちは、神に喜ばれるその方と共に、そしてその方によって証しされた方と共に救われるであろうから。わたしがすでに言い、聖なる預言者たちの言葉から証明したとおりに。</p><h2>93</h2><p>なぜなら、その方は、常に、どこでも良いものであるもの、正しいものを、全人類に提供しておられるからです。すべての民は知っています。姦淫、不倫、殺人、そしてそのようなほかのすべての業は悪であることを。そして、これらをすべて行うにもかかわらず、彼らは、このように振る舞うときに罪を犯しているという自覚を免れていません。ただ、穢れない霊の影響から、あるいは育ちの堕落、悪い慣わし、不敬虔な律法のゆえに、本性的な観念を失った人たち、あるいはむしろそれらを消し去り、押し殺した人たちを除いては。しかしながら、このような人たちさえも、自分たちがほかの人たちに対して行うことを、自分たちが耐えることを望まないことが見て取れます。敵意ある良心において、自分たちが行うことで互いを責め合います。それゆえ、わたしたちの主であり救い主であるイエス・キリストによって語られたことは、わたしの考えるには良いことです。すなわち、すべての義と敬虔は二つの命令の中にあるということです。「あなたの神なる主を、お前の心をすべてで、お前の力をすべてで愛せよ。そして、お前の隣人を、自分自身のように愛せよ」（<a href="https://bibleox.com/ja/jp-ni/mf/22/#L37">マタ. 22:37-39</a>）。なぜなら、心をすべてで、力をすべてで神を愛する人は、敬虔な心構えで満たされて、ほかの神を拝せず、神の意志に従って、主なる神ご自身が愛しておられるあの御使いを敬うでしょう。また、隣人を自分自身のように愛する人は、自分が自分に対して望むのと同じ善をその人に望むでしょう。そして、誰も自分自身に対して悪を望みません。それゆえ、隣人を愛する人は、自分が自分に対して望むのと同じことを、その人のために祈り、努めるでしょう。しかし、人の隣人は、ほかの誰でもなく、人です。その人と似せられた理性ある生き物です。それゆえ、すべての義が二つの類に分かれるなら——神に対するものと人たちに対するもの——聖書が語るとおり、「主なる神を心をすべてで、力をすべてで愛し、隣人を自分自身のように愛する」人は、真に正しい人です。しかし、あなたたちは、神にたいしても、預言者たちにたいしても、自分自身にたいしても、良い心構えと愛を示したことは決してありません。むしろ、知られているとおり、あなたたちは常に偶像礼拝者であり、正しい人たちの殺人者として現れてきました。キリストご自身の上に手を置くに至ったほどに。そして今日まで自分の悪の中に留まり、この磔にされた方がキリストであると証明する人たちを呪い続けています。その上で、あなたたちは、その方が、神の敵として、呪われた者として磔にされたと証明しようと努めています。これは、あなたたちの無分別な偏見の帰結です。あなたたちは、モーセが行ったしるしから、その方がキリストであることを理解できるにもかかわらず、そうしたくないのです。そのうえで、わたしたちを難渋に置こうとして、好きな問いをわたしたちに提出します。しかし、自分たちは、ある堅固なキリスト者と対話に入るときに何を言うべきかを知りません。</p><h2>94</h2><p>わたしに言いなさい。神がモーセを通して、上にあるものの像や似姿を、地の上のものの像や似姿を造るなと命じられたのは神ではなかったのですか。そして、その方が荒野の中で、モーセを通して青銅の蛇を作り、それをしるしの上に立てられなかったのですか。蛇たちに咬まれた人たちがそれによって救われながら、しかも、その方は不義の中に罪を負っていません。なぜなら、神はこのことによって神秘を告げ知らせていたからです。すなわち、アダムを背きへと駆り立てた蛇の力を破壊することを示し、このしるし——すなわち十字架——のゆえに死ぬはずであった方を信じる人たちに、蛇の咬みからの救いを与えること。悪い業と偶像礼拝とほかの不義からの。しかし、もしこう理解されるべきでないなら、わたしに説明してください。なぜモーセは青銅の蛇をしるしの上に据え、咬まれた人たちにそれを見るようにと命じたのですか。そして咬まれた人たちはいやされました。しかも、そのとき、その人が、何かのものの似姿を全く造るなと命じていたのに。</p><p>そのとき、第二の日に来た人たちの中のもう一人が言いました。</p><p>——正当なことを言いました。わたしたちはこれを説明できません。わたしはこれについてわたしたちの教師たちに何度も尋ねましたが、誰もわたしに答えを与えませんでした。それゆえ、始めたことを続けなさい。わたしたちは注意して、あなたの神秘の説明を聞いています。それのために、預言者たちの書物も偽りの告発にさらされているのですから。</p><p>——それなら——とわたしは語りました——神が蛇を通してしるしを与えるようにと命じられたのに、その方は罪を負っていないのと同じように、律法の中では磔にされる人たちの上に呪いが置かれているけれども、神のキリストの上には置かれていません。その方によって、神は、呪いに値する行為を行ったすべての人たちを救っておられるのですから。</p><h2>95</h2><p>律法の中では、全人類が呪いに服していると見出されるでしょう。なぜなら、こう語られているからです。「律法の書の中に書かれているこの言葉を行うためにすべてのうちに留まらないすべての人は呪われる」（<a href="https://bibleox.com/ja/jp-ni/vtor/27/#L26">申. 27:26</a>）。誰もこれをすべて完全には行いませんでした。そして、あなたたちはこれに反論する勇気は持ちませんでした。ある人たちはより多く、ほかの人たちはより少なく命令を守りました。それゆえ、この律法の下にある人たちが、すべてを行わなかったために呪いに服していると見出されるなら、偶像礼拝と子どもとの乱れとほかの悪徳において罪を負っているすべての民が、いっそう呪いに値するのではないでしょうか。それなら、もし万物の父が、その方のキリストに、全人類のためにすべての呪いを引き受けることを望まれたなら——その方がその方を磔にして殺された後に生き返らせることを知っておられたなら——なぜあなたたちは、その方を呪われた者として語るのですか。父の意志によってこれを耐えることを望まれた方を。しかし、むしろ自分自身を悲しむのではないでしょうか。その方の父ご自身が、その方が人類のためにこれを耐えるように成し遂げられたのに、あなたたちはこれを神の意志に仕えるために行ったのではありません。あなたたちは、預言者たちを殺すときにも、敬虔な業を行っていなかったのですから。そして、あなたたちの中の誰もこう言わないように。もしその方の父が、人類がその方の傷によって変化するように、その方がこれを耐えることを望まれたなら、わたしたちは何の悪も行っていない、と。もしあなたたちがこのように語るなら——罪の中で悔い改めながら、その方をキリストと認め、その方の命令を守りながら——わたしが言ったとおり、あなたたちに罪の赦しがあります。しかし、もしあなたたちがその方と、その方を信じる人たちを呪い、機会のあるときには殺すなら、あなたたちがその方の上に自分の手を置いたことが、どのようにしてあなたたちに問われることはないでしょうか。不敬虔な、罪ある、完全にかたくなな、正気を失った人たちとして。</p><h2>96</h2><p>そして律法の中に語られていること——「木の上にぶら下がっているすべての人は呪われる」——は、わたしたちの望みを堅くします。磔にされたキリストに依存する望みを。神がこの磔にされた方を呪われるからではなく、神が、あなたたちと、あなたたちに似た人たちが、その方がすべてに先立って存在する方であること、神の永遠の司祭、王、キリストであることを知らずに、行うはずであったことを預言されたからです。これが、あなたたちが見ることができるとおり、成就しています。あなたたちは、自分たちの会堂の中で、その方を通してキリスト者となった人たちを呪っています。そしてほかの民たちも、ただ自分をキリスト者と宣言した人たちを殺すことによって、まさにあの呪いを実行しています。しかし、わたしたちは、その人たち全員に言います。あなたたちはわたしたちの兄弟です。神の真理を知りなさい、と。そして、彼らもあなたたちもわたしたちに耳を傾けず、むしろ、キリストの名から離れることをわたしたちに強いるなら、わたしたちはむしろ、死を好み、耐え抜きます。神が、キリストを通して約束されたすべての善いものをわたしたちに返すと確信しているからです。そしてその上で、わたしたちは、あなたたちのために、キリストから憐みを受け取るようにと祈ります。その方は、敵たちのためにも祈るようにとわたしたちに教えたのですから。「あなたたちの天の父が恵み深く憐み深いように、恵み深く憐み深い者となりなさい」（<a href="https://bibleox.com/ja/jp-ni/lk/6/#L36">ルカ. 6:36</a>）。わたしたちは見ます。全能の神は良く、憐み深い方です。その方は、感謝しない人たちの上にも正しい人たちの上にも、自分の太陽が上るように命じられ、聖なる人たちの上にも悪い人たちの上にも雨を降らせます。その方が教えたとおり、その方が、すべての人たちを裁かれるであろう人たちです（<a href="https://bibleox.com/ja/jp-ni/mf/5/#L45">マタ. 5:45</a>）。</p><h2>97</h2><p>そして、預言者モーセが——アロンとオルが彼の両手を支えていたとき——夕方までこの姿のうちに留まったことは、無益ではありませんでした。なぜなら、主も夕方近くまで木の上に留められ、夕方に葬られたからです。そしてその後に、その方は第三の日に復活されました。ダビデはこのことについてこう告げ知らせました。「わたしは自分の声をもって主に呼び求めました。そしてその方はわたしに、その方の聖なる山から聞いてくださいました。わたしは横たわり、眠りました。そして再び立ち上がりました。主がわたしを支えてくださったからです」（<a href="https://bibleox.com/ja/jp-ni/ps/3/#L6">詩. 3:6-7</a>）。そしてイザヤも、その方がどのように死なれるかを預言しました。「わたしは手を差し伸べた。服従しない、逆らう民に、良い道ではない道を歩む人たちに」（<a href="https://bibleox.com/ja/jp-ni/is/65/#L2">イザ. 65:2</a>）。そして、その方が生き返ることについては、同じイザヤがこう言いました。「その方の墓は、わたしたちの真ん中から取り去られました」（<a href="https://bibleox.com/ja/jp-ni/is/57/#L2">イザ. 57:2</a>）、そして「わたしは富める者たちをその方の死の代わりに与えるであろう」（<a href="https://bibleox.com/ja/jp-ni/is/53/#L9">イザ. 53:9</a>）。そして別のところでは、ダビデが再び、受難と十字架について、神秘的な象徴の言い方で、第21の詩篇の中でこう語りました。「彼らはわたしの手と足を刺しました。わたしのすべての骨を数えました。そして彼ら自身は考え、わたしを見つめました。彼らはわたしの服を自分たちの間で分け、わたしの服の上でくじを引きました」（<a href="https://bibleox.com/ja/jp-ni/ps/22/#L17">詩. 22:17-19</a>）。なぜなら、彼らが、その方を釘によって留めながら、その方を磔にしたとき、「彼らはその方の手と足を刺しました」。そして、その方を磔にした人たちはその方の服を自分たちの間で分け、くじを引いて、各人がくじの決定に、何を取るかを委ねました。しかし、あなたたちは、この詩篇がキリストに関わることを否定しています。すべての点において盲であり、次のことを理解していません。あなたたちの民の中で、油注がれた王と呼ばれた人は誰も、生前に手と足に刺されることはなく、この神秘——すなわち磔——によって死ぬことはありませんでした。このイエスを除いては。</p><h2>98</h2><p>しかし、わたしは詩篇全体を挙げましょう——とわたしは言いました。そうすれば、父へのその方の敬虔についても聞くことができます。そして、その方がすべてのものをその方に帰し、この死からの救いさえもその方に求めること。同時に、この詩篇から、その方に立ち上がった人たちが誰であったかが見えてきます。そして、その方が真に苦しみを感じる人間となったことが明らかです。この詩篇です。「神よ、わたしの神よ、わたしに目を向けてください。なぜあなたはわたしを捨てたのですか。わたしの不義についての言葉は、わたしの救いから遠く離れています。わたしの神よ、わたしは昼にあなたに呼び求めます。しかし、あなたはわたしに聞いてくださいません。夜にも——しかし、わたしの無知のゆえにではありません。しかし、あなたは聖なる場所に住んでおられ、イスラエルの讃美であられます。わたしたちの父たちはあなたに望みを置きました。彼らは望みを置き、あなたは彼らを解放されました。彼らはあなたに呼び求め、救われました。あなたに望みを置き、恥を負いませんでした。しかしわたしは虫であり、人ではありません。人たちの辱めであり、民に退けられた者です。わたしを見る人たちは皆、わたしについて笑い、唇をもって頭を揺らしながら言いました。その方は主に望みを置いた。その方がその方を解放するように。その方がその方を救うように。その方がその方を望んでいるからである。しかし、あなたはわたしを胎から引き出された。あなたは、わたしの母の乳房からのわたしの望みです。わたしは胎からあなたに献げられました。あなたはわたしの神です。わたしの母の胎から。わたしから離れないでください。なぜなら、悲しみは近くにあり、わたしには助け手がいないからです。多くの雄牛たちがわたしを取り囲み、肥えた雄牛たちがわたしを取り囲みました。彼らはわたしにたいして、咆える貪欲な獅子のように口を開きました。わたしのすべての骨は水のように広がり、分離しました。わたしの心は、わたしの内臓の中で溶ける蝋のようになりました。わたしの力は陶器の破片のように枯れ、わたしの舌はわたしの喉に張り付きました。そしてあなたはわたしを死の塵の中へと引き下げました。なぜなら、多くの犬たちがわたしを取り囲み、悪い者たちの集会がわたしを取り囲んだからです。彼らはわたしの手と足を刺しました。わたしのすべての骨を数えました。しかし、彼ら自身は考え、わたしを見つめました。彼らはわたしの服を自分たちの間で分け、わたしの服の上でくじを引きました。しかし主よ、あなたの助けをわたしから取り去らないでください。わたしを守るために転じてください。わたしの魂を剣から、わたしの独り子を犬の足から解放してください。わたしを獅子の口から、そしてわたしの謙虚さを独角獣の角から救ってください。わたしはあなたの名を、わたしの兄弟たちに告げ知らせるであろう。教会の中であなたを歌うであろう。主を恐れる人たちよ、その方を讃めよ。ヤコブのすべての子孫よ、その方を栄光に包め。イスラエルのすべての子孫がその方を恐れますように」（<a href="https://bibleox.com/ja/jp-ni/ps/22/#L2">詩. 22:2-24</a>）。</p><h2>99</h2><p>わたしは証明します——その後に続けてわたしは言いました——この詩篇全体がキリストに関わるものであることを。このために、わたしはそれを再び説明します。その初めの言葉「神よ、わたしの神よ、わたしに目を向けてください。なぜあなたはわたしを捨てたのですか」は、古くから、キリストのときに語られるはずであったことを預言していました。その方は十字架の上で磔にされたとき、言われました。「神よ、神よ、なぜあなたはわたしを捨てたのですか」と。そしてさらに続く言葉「わたしの不義についての言葉は、わたしの救いから遠く離れています。わたしの神よ、わたしは昼にあなたに呼び求めます。しかし、あなたはわたしに聞いてくださいません。夜にも——しかし、わたしの無知のゆえにではありません」は、キリストがどのように、何をするはずであったかを預言していました。なぜなら、その方が磔にされるはずであったあの日、その方は、エルサレム神殿の向かいにある、オリーブと呼ばれる山のもとに、自分の三人の弟子たちを連れて行き、こう祈られました。「父よ、もしこれが可能なら、この杯をわたしから過ぎさせてください」（<a href="https://bibleox.com/ja/jp-ni/mf/26/#L39">マタ. 26:39</a>）。そして自分の祈りを続けました。「しかし、わたしの望むとおりではなく、あなたの望まれるとおりに」。これらの言葉によって、その方が真に苦しみを感じることのできる人間となられたことを示されました。しかし、誰かがこう言わないように。見よ、その方は苦しむであろうことを知らなかった、と。そのすぐ後に、詩篇の中でこう付け加えられています。「しかし、わたしの無知のゆえにではありません」と。神が、アダムに——あなたはどこにいるのかと——あるいはカインに——お前の兄弟アベルはどこにいるのかと——無知のゆえに尋ねたのではなく、各人のありようを責めるために、そしてこれらすべてのことについての知識が聖書を通してわたしたちに届くように尋ねたのと同じように。ここでもキリストは、自分自身の無知ではなく、あの方たちの無知を指し示しています。彼らは、その方がキリストではないと考え、その方を殺し、その方が普通の人間として陰府の中に留まるだろうと考えていました。</p><h2>100</h2><p>続く言葉「しかし、あなたは聖なる場所に住んでおられ、イスラエルの讃美であられます」は、その方が、讃めるべき驚くべき業を行うこと、すなわち、磔の第三の日に死者の中から生き返ることを示していました。父がその方にこれを成し遂げさせたのです。わたしはすでに示しました。キリストがヤコブとイスラエルと呼ばれていること、そしてヨセフとユダの祝福の中で、その方について神秘をもって前もって示されているだけでなく、福音書の中にもこう書かれていること。その方はこう言われました。「すべてのものが父からわたしに委ねられています。そして、父を知る者は子のほかにいません。子を知る者は父と、子が示そうと望む者のほかにはいません」（<a href="https://bibleox.com/ja/jp-ni/mf/11/#L27">マタ. 11:27</a>）。そしてその方は、その方の恵みによって聖書から知ったすべてのものをわたしたちに示されました。わたしたちはその方を、すべての被造物に先立って存在する神の初生の子として認めます。そして族長たちの子として。なぜなら、その方は、その家系からのおとめから受肉し、姿と栄光のない苦しむ者となることを喜ばれたからです。それゆえ、その方は、将来の自分の受難についての対話の中で考えながら、こう語られました。「人の子は多くのことを苦しみ、パリサイ人たちと書記官たちに退けられるはずであり、磔にされ、第三の日に生き返るはずである」（<a href="https://bibleox.com/ja/jp-ni/lk/18/#L31">ルカ. 18:31</a>、<a href="https://bibleox.com/ja/jp-ni/lk/24/#L7">ルカ. 24:7</a>）。ここでその方は自分を人の子と呼ばれました。おとめから——わたしが言ったとおり、ダビデの、ヤコブの、イサクの、アブラハムの家系から出たおとめから——生まれたためです。あるいは、アブラハム自身が、マリヤが家系を辿っている、数えられた人たちの父であったためです。わたしたちは知っています。女たちの親が、彼らの娘たちが生んだ子たちの父であることを。そして、その方の弟子たちの中の一人——以前はシモンと呼ばれていた人——が、その方の父の顕現によって、その方を神の子キリストとして認めたとき、その方はその人の名をペトロに改められました。そして、その方の使徒たちの記録の中に、その方が神の子であると書かれているので、わたしたちもその方を子と呼びます。そして、その方がすべての被造物に先立って存在し、その方の力と意志によって父から出たことを知っています。その方は、預言の書物の中で、知恵とも、日とも、日の出とも、剣とも、杖とも、ヤコブとも、イスラエルとも呼ばれています。わたしたちはまた認めます。その方が、おとめを通して人となられたこと。なぜなら、背きが蛇から始まったのと同じ道において、それが滅ぼされたためです。エバは、おとめであり、無実であったとき、蛇の言葉を受け入れて、服従しないことと死を生み出しました。しかし、マリヤおとめは、御使いガブリエルが、その方に喜びの言葉をもって来たとき——「主の霊がその方の上に来るであろう。そして至高者の力がその方に影を垂れる。それゆえ、その方から生まれる聖なるものは神の子と呼ばれるであろう」——信仰と歓びを受け入れながら、言いました。「あなたの言葉に従って、わたしの上にありますように」（<a href="https://bibleox.com/ja/jp-ni/lk/1/#L35">ルカ. 1:35</a>、<a href="https://bibleox.com/ja/jp-ni/lk/1/#L38">ルカ. 1:38</a>）。そして見なさい。わたしが証明したとおり、これほど多くの聖書の箇所の中で語られている方、あの方がこの女から生まれました。その方を通して、神は蛇と、それに似せられた御使いたちと人たちを打ち、自分の罪の中で悔い改め、その方を信じる人たちを死から解放するのです。</p><h2>101</h2><p>——詩篇の続く言葉「わたしたちの父たちはあなたに望みを置きました。望みを置き、あなたは彼らを解放されました。あなたに呼び求め、救われました。あなたに望みを置き、恥を負いませんでした。しかしわたしは虫であり、人ではありません。人たちの辱めであり、民に退けられた者です」は——とわたしは続けました——その方が、神に望みを置き、その方によって解放された人たちを自分の父たちとして認めることを示しています。彼らは、あのおとめの父たちでした。その方から生まれ、人となったおとめの。その上で、その方は、自分も同じ神によって救われることを示しています。しかし、自分が何かを自分の意志と力によって行うことを誇ってはいません。その方は地の上でもこのように振る舞いました。ある人が「良い教師よ」と言ったとき、その方は答えられました。「なぜあなたはわたしを善いと呼ぶのですか。善い方はただ一人です。それは、わたしの天の父です」（<a href="https://bibleox.com/ja/jp-ni/mf/19/#L17">マタ. 19:17</a>）。言葉「わたしは虫であり、人ではありません。人たちの辱めであり、民に退けられた者です」は、その方の上に何が起こり、その方ご自身と共に何が起こるかを預言していました。辱めは、その方を信じるわたしたちに、あらゆるところから降りかかります。その方は民に退けられた方です。なぜなら、その方があなたたちの民から軽蔑され辱められ、あなたたちがその方に対して企てたことを耐えられたからです。さらに続く言葉——「そしてわたしを見る人たちは皆、わたしについて笑い、唇をもって頭を揺らしながら言いました。その方は主に望みを置いた。その方がその方を救うように。その方がその方を望んでいるからである」——の中で、その方は、その方の上に起こることを預言しておられます。その方の磔を見た人たちの各人は、頭を揺らし、口を歪め、互いに鼻で笑いながら、その方の使徒たちの記録の中にも書かれていることを嘲って言ったからです。「その方は自分を神の子と呼びました。下って歩くように。神がその方を救うように」（<a href="https://bibleox.com/ja/jp-ni/ps/22/#L8">詩. 22:8-9</a>、<a href="https://bibleox.com/ja/jp-ni/mf/27/#L43">マタ. 27:43</a>）。</p><h2>102</h2><p>——出来事はまた、これらの言葉によっても指し示されていました。——とわたしは続けました——「しかし、あなたは、わたしの母の乳房からのわたしの望みです。わたしは胎からあなたに献げられました。あなたはわたしの神です。わたしの母の胎から。多くの雄牛たちがわたしを取り囲み、肥えた雄牛たちがわたしを取り囲みました。彼らはわたしにたいして、咆える貪欲な獅子のように口を開きました。わたしのすべての骨は水のように広がり、分離しました。わたしの心は、わたしの内臓の中で溶ける蝋のようになりました。わたしの力は陶器の破片のように枯れ、わたしの舌はわたしの喉に張り付きました」。「わたしの母の乳房からのわたしの望み」——これらの言葉は、その方がベツレヘムの中で生まれた直後に、王ヘロデが——わたしがすでに言ったように——アラビアから来た魔術師たちからその方について聞いて、その方を殺そうと悪だくみしたことを指し示していました。しかしヨセフは、神の命令によって、その方をマリヤと共に連れて、エジプトへと去りました。父が望まれたからです。その方から生まれた方が、その方が成熟し、その方の教えを告げ知らせた後に殺されることを。しかし、もし誰かがこう言うなら。神はヘロデをより良く殺すことができなかったのでしょうか。それなら、わたしはこれに答えて尋ねます。神は初めに蛇を消滅させることはできなかったのでしょうか。「わたしは、その方と女との間に、そしてその方の種子とその女の種子との間に敵意を置くであろう」と語らないで。あるいは、多くの人たちを一度に造ることはできなかったのでしょうか。しかし、その方が、それがそのようであることが美しいことを知っていたので、御使いたちと人間たちを、正義を行うための自由意志をもって造られました。そして、その方が、彼らが自由意志を用いることを善いと認めた時代の期間を定められました。そして、彼らに自由意志を与えながら、その方は、一般的な、そして個別的な裁きを設けられました。その方が、これが美しいことを知っておられたからです。それゆえ、聖書は塔の建設、そして言語の分離と変化についてこう語っています。「そして主は言われた。見よ、民は一つであり、すべての人の言葉は一つである。そして彼らはこれを行い始めた。そして今、彼らが行おうと決心することについては、彼らに不足することはないであろう」（<a href="https://bibleox.com/ja/jp-ni/gen/11/#L6">創. 11:6</a>）。言葉「わたしの力は陶器の破片のように枯れ、わたしの舌はわたしの喉に張り付きました」も、その方が父の意志によって行うつもりであったことを前もって告げ知らせていました。なぜなら、その方の力ある言葉の力——その方は常に、あなたたちの民のすべての教師たちを、彼らがその方と争ったときに責めていました——は、多くの水を湛えた強い泉に、その水が別の方向へと逸らされたのと同じように留められました。すなわち、その方が沈黙し、ピラトゥスのもとで誰にも何も答えたくなかったときに。その方の使徒たちの記録の中に語られているとおり。イザヤの言葉「主はわたしに、いつわたしが言葉を語るべきかを知るための舌を与える」が実際の実りを持つようにするためです（<a href="https://bibleox.com/ja/jp-ni/is/50/#L4">イザ. 50:4</a>）。言葉「あなたはわたしの神です。わたしから離れないでください」の中で、その方は、わたしたちに、他のことの中でも、万物を造られた神に、すべての人たちが望みを置くべきこと、その方だけから救いと助けを求めるべきことを教えています。ほかの人たちのように、家系や富や力や智慧によって救われ得ると考えないように。あなたたちが常にそうしてきたように。あなたたち——かつて金の子牛を鋳造し、常に自分たちを感謝しない者、正しい人たちの殺人者、自分の家系の高慢な者として示してきた人たち。もしこの子、神の神が、自分が、その方が子であることによっても、力があること、智慧があることによっても救われ得ないことを明確に語るなら——しかし、その方が、イザヤが語るとおり、無垢であり、言葉によってさえ罪を犯さなかったことを示すなら——「その方は無法を行わず、その方の唇に偽りは見出されなかった」（<a href="https://bibleox.com/ja/jp-ni/is/53/#L9">イザ. 53:9</a>）——、それなら、あなたたちは——この望みなしに救いを待ち望んでいるほかの人たちと共に——自分たちが自分自身を欺いているとは考えないのでしょうか。</p><h2>103</h2><p>——詩篇の中でさらに読まれていること——「なぜなら、悲しみは近くにあり、わたしには助け手がいないからです。多くの雄牛たちがわたしを取り囲み、肥えた雄牛たちがわたしを取り囲みました。彼らはわたしにたいして、咆える貪欲な獅子のように口を開きました。わたしのすべての骨は水のように広がり、分離しました」——は、その方の上に起こったことを同じように預言していました。あなたたちの民から、パリサイ人たちと書記官たちの命令によって、オリーブの山から、その方に対して攻撃が向けられたあの夜に、聖書が突き進む雄牛たち、激しい雄牛たちと呼んだ人たちが、その方を取り囲んだのですから。言葉「肥えた雄牛たちがわたしを取り囲みました」は、その方があなたたちの教師たちのもとに引き寄せられたときに、雄牛たちのように振る舞った人たちを意味しています。聖書が彼らを雄牛たちと呼んだのは、雄牛たちが子牛たちの命の作者だからです。雄牛たちが子牛たちの父であるように、あなたたちの教師たちは、その子たちがオリーブの山に上ってその方を捕らえ、自分たちのもとへと連れて来ることの作者でした。言葉「助け手がない」も、出来事を指し示しています。誰もいませんでした。無垢なるその方を助けるために一人の人間も。そして言葉「彼らはわたしにたいして、咆える獅子のように口を開きました」は、その当時のユダヤの王、ヘロデを指し示しています。その方が生まれたときに、その当時のベツレヘムの中で生まれたすべての乳児を殺したヘロデの後継者です。アラビアから来た魔術師たちから聞いた人が、その中に間違いなく含まれているだろうと考えて。しかし、その人は全能の神の意志を知りませんでした。その方はヨセフとマリヤに、幼子と共にエジプトへと行き、顕現の中で自分の国に帰るようにと言われるまでそこに留まるようにと命じられたのです。そこで彼らは、ヘロデ——ベツレヘムの中の乳児たちを殺した人——の死まで、そして彼の後の王権、アルケラオスの王権まで留まりました。彼も、キリストが父の意志によって受け取った経営を十字架の中で成し遂げる前に死にました。そして、アルケラオスを継承したヘロデが、自分に与えられた権威を受け取ったとき、ピラトゥスは、その方に喜ばれるために、縛られたイエスをその人のもとへと送りました。これを前もって知って、神はこう語られました。「彼らはその方をアッシリア人の家の中へと引き渡しました。王のための確かな贈り物として」[13]。あるいは、その方の上で咆える獅子の中で、神は悪魔を理解されたかもしれません。モーセはこれを蛇と呼び、ヨブとゼカリヤは悪魔と呼び、イエスはこれをサタンと呼ばれました。この名が、その人が行った業から造られ、与えられたことを示しながら。なぜなら、「サタ」はユダヤ人たちとシリア人たちの言葉の中で、離反者を意味し、「ナス」は訳の中で蛇の名であるからです。両方の言葉から一つの名が組み立てられます。サタナスと。この悪魔は、イエスがヨルダンの川から出て、声がその方に語りかけたすぐ後に——「あなたはわたしの子である。わたしは今日、あなたを生んだ」——、使徒たちの記録の中に書かれているとおり、その方のもとに来て試み、さらに言いました。「わたしを拝せ」と。しかし、キリストはその人に答えられました。「わたしから離れよ、サタンよ。あなたの神なる主を拝し、その方のみに仕えよ」（<a href="https://bibleox.com/ja/jp-ni/ps/2/#L7">詩. 2:7</a>、<a href="https://bibleox.com/ja/jp-ni/mf/4/#L9">マタ. 4:9-10</a>）。その人がアダムを惑わしたので、キリストに対しても何かができると考えたのです。「わたしのすべての骨は水のように広がり、分離しました。わたしの心は、わたしの内臓の中で溶ける蝋のようになりました」——これらの言葉は、その方を捕らえるためにあの山、オリーブの山へと彼らが出て行ったあの夜に起こったことについての預言です。その方の使徒たちとその追随者たちによって作られた記録の中には——わたしはこう言っています——、その方から、血の雫のように汗が流れたと語られています。その方が祈り、言っていたときに。「もしこれが可能なら、この杯を過ぎさせてください」と。このとき、その方の心は震え、その骨も震えました。心は、その方の内臓の中で溶ける蝋に似せられていました。わたしたちが知るように、父の意志によって、その子が、わたしたちのために、このような苦しみを実際に耐えておられたことを。そして、わたしたちが、その方が神の子として、その方の上に起こっていたことを感じなかったとは語らないようにするためです。言葉「わたしの力は陶器の破片のように枯れ、わたしの舌はわたしの喉に張り付きました」は——すでに言ったとおり——その方の沈黙を前もって告げ知らせていました。だからこそ、あなたたちのすべての教師たちの無分別を常に責めていたその方は、決然として何も答えられなかったのです。</p><h2>104</h2><p>言葉「しかし、あなたはわたしを死の塵の中へと引き下げました。なぜなら、多くの犬たちがわたしを取り囲み、悪い者たちの集会がわたしを取り囲んだからです。彼らはわたしの手と足を刺しました。わたしのすべての骨を数えました。しかし、彼ら自身は考え、わたしを見つめました。わたしの服を自分たちの間で分け、わたしの服の上でくじを引きました」——とわたしがすでに言ったように——不敬虔な人たちの集会が、その方をどの類の死に処するはずであったかを前もって告げ知らせていました。その方は彼らを犬たち、犬飼いと呼んでいます。それによって、犬たちの長たち自身も集まり、その方を告発しようと努めたことを示しながら。これも、その方の使徒たちの記録の中で叙述されています。そして、わたしは示しました。キリストの磔の後に、その方を磔にした人たちが、その方の服を自分たちの間で分けたことを（<a href="https://bibleox.com/ja/jp-ni/ps/22/#L11">詩. 22:11-19</a>）。</p><h2>105</h2><p>——詩篇の中の続く言葉——「しかし主よ、あなたの助けをわたしから取り去らないでください。わたしを守るために転じてください。わたしの魂を剣から、わたしの独り子を犬の足から解放してください。わたしを獅子の口から、そしてわたしの謙虚さを独角獣の角から救ってください」——も、その方の本性が何であるか、そしてその方の上に何が起こるはずであったかを指し示し、前もって告げ知らせていました。わたしが先に言ったとおり、その方は、万物の父のもとでの独り子でした。父から、言葉として、そして力として真に生まれた方です。そしてその後に、おとめから人となられました。その方の使徒たちの記録から知っているとおり。その方が十字架の上で死なれたことについても、先に言及しました。「わたしの魂を剣から、わたしの独り子を犬の足から解放してください。わたしを獅子の口から、そしてわたしの謙虚さを独角獣の角から救ってください」は、同じように示していました。その方がどの苦しみから死なれるはずであったかを、すなわち、十字架の磔から。「独角獣の角から」という言葉は、十字架の像を指し示していることを、わたしはすでにあなたたちに説明しました。しかし、その方の魂が、剣から、獅子の口から、犬の足から解放されるようにというその方の願いは、誰もその方の魂を捕らえないようにという祈りでした。そうすれば、わたしたちも、生を去るときに、同じことを、あの神に求めるように。その方は、あらゆる厚かましい悪い御使いを退けることができ、その方がわたしたちの魂を捕らえないようにされます。そして、魂の存在については、わたしは、あなたたちに証明しました。占い女がサウルの要求によってサムエルの魂を呼び出したという事実によって。しかし、同じような正しい人たちと預言者たちの魂もすべて、あの占い女の中で、この事柄そのものから現れる、あの力の権威に服していたように見えます。それゆえ、神は自分の子を通して、わたしたちに、常に正しいものであるように努め、終わりのときに、わたしたちの魂がこのような力に服さないように祈ることを教えています。十字架の上でその方の霊を吐き出されたとき、その方は言われました。「父よ、わたしの霊をあなたの御手の中に委ねます」——これも記録から知っています（<a href="https://bibleox.com/ja/jp-ni/lk/23/#L46">ルカ. 23:46</a>）。自分の弟子たちに、パリサイ人たちの生き方を超えるようにと勧め、そうでなければ彼らが救われないことを心に留めさせながら、その方は、これらの記録の中に書かれているとおり、こう語られました。「もしあなたたちの義が書記官たちとパリサイ人たちの義を超えなければ、天の御国に入ることはないであろう」（<a href="https://bibleox.com/ja/jp-ni/mf/5/#L20">マタ. 5:20</a>）。</p><h2>106</h2><p>——その方が、父が、その方の願いに応じてすべてのものを与え、その方を死者の中から生き返らせることを知っていたこと——とわたしは続けました——すなわち、その方が、この磔にされた方の神秘を通して、信じる人たちの全種族の憐みのために神を讃めるようにと、神を恐れるすべての人たちに勧めたこと。そして、その方が自分の兄弟たち——彼らは、その方の死者の中からの復活の後に、その方ご自身から確信したのです。すなわち、苦しみの前に、その方が、これを耐える必要性について語っていたこと、そして預言者たちがこのことについて預言していたことを——その方の磔のときに自分の離反を悔いるに至った人たちの中に立たれ、記録が示しているとおり、彼らと共に神を讃められたこと——これらのことのすべては、詩篇の最後の言葉によって描かれていました。「わたしはあなたの名を、わたしの兄弟たちに告げ知らせるであろう。教会の中であなたを歌うであろう。主を恐れる人たちよ、その方を讃めよ。ヤコブのすべての子孫よ、その方を栄光に包め。イスラエルのすべての子孫がその方を恐れますように」（<a href="https://bibleox.com/ja/jp-ni/ps/22/#L23">詩. 22:23-24</a>）。そして、その方が——記録の中でも語られているとおり——使徒たちの中の一人の名をペトロに改められ、同じように、ゼベダイの二人の兄弟、その子たちに、ボアネルゲス、すなわち雷の子たちという名を与えられたことは、その方が、ヤコブにイスラエルという呼び名を与え、アウシにイエスという名を与えたあの同じ方であることを意味していました。この名によって、エジプトから出た人たちの後に残った民が、族長たちに約束された地の中へと導き入れられたのです。そして、その方が、星のように、アブラハムの家系から輝くことについては、モーセが言葉の中で示しました。「ヤコブから星が上り、イスラエルから指導者が」（<a href="https://bibleox.com/ja/jp-ni/chis/24/#L17">民. 24:17</a>）。そして別のところでは、聖書はこう語っています。「見よ、人、その方の名は日の出である」（<a href="https://bibleox.com/ja/jp-ni/zah/6/#L12">ゼカ. 6:12</a>）。それゆえ、その方の誕生のときに天にも星が現れたとき——その方の使徒たちの記録の中に書かれているとおり——アラビアの魔術師たちは、このしるしによってそれを知り、来て、その方を拝しました。</p><h2>107</h2><p>——その方の、磔の第三の日の復活については——とわたしは続けました——記録の中にこう書かれています。あなたたちの種族からの人たちが、その方と論争して、その方に言いました。「わたしたちにしるしを見せてください」。そしてその方は彼らに答えられました。「悪い不敬虔な世代はしるしを求めます。しかし、その方には、預言者ヨナのしるしのほかの、しるしは与えられないであろう」（<a href="https://bibleox.com/ja/jp-ni/mf/12/#L38">マタ. 12:38-40</a>）。これらの言葉はそのときには隠されていました。聴衆がその中から、その方が磔の後に第三の日に生き返ることを理解することはできませんでした。その方はまた、あなたたちの種族を、ニネベの都の人たちよりも不敬虔で不敬虔なものとして提示されました。彼らは、ヨナが、巨大な魚の腹から第三の日に吐き出されたとき、彼らが三日以内に全部滅ぼされることを告げ知らせたとき、すべての生きているものに——人から無理性のものまで——公共の断食を課しました。荒布を着けて、強い叫びと共に、真実の心の悔い改めと共に、不敬虔からの離脱と共に。神が、不敬虔から離れるすべての人たちに憐み深く、人間愛に満ちた方であることを信じながら。この都の王自身さえ、その大臣たちも、荒布を着け、断食と祈りの中に留まり、自分の都が破壊されないようにと祈りました。しかし、ヨナが、自分が告げ知らせたとおりに第三の日に都が破壊されなかったことについて魂を苦しめたとき、神の整えによって、彼のために南瓜が育ちました。その影の下で彼は座り、暑さから守られていました。これは、ヨナが植えも潅水もしなかった、予期しない南瓜でした。しかし、彼に影を与えるために突然生えたのです。そして、神の別の整えによって、それは枯れました。ヨナがこれについて魂を苦しめたとき、神は、ニネベの都が破壊されなかったことについての彼の不当な悲しみの中で、彼を責めました。「あなたは南瓜を憐れみました。あなたはそれに対して労働せず、それを育てず、それは自分の夜のうちに生え、自分の夜のうちに枯れました。そしてわたしは、ニネベを憐れまないでしょうか。偉大なる都、十二万人以上の人たちが住んでいて、自分の右の手と左の手の間の区別を知らない人たち、そして多くの家畜たちがいる都を」（<a href="https://bibleox.com/ja/jp-ni/ion/4/#L10">ヨナ. 4:10-11</a>）。</p><h2>108</h2><p>——これらの出来事は、あなたたちの民のすべての人たちが知っていました——とわたしは続けました。キリストが、あなたたちの前で、ヨナのしるしをあなたたちに与えることを宣言されたとき——このことによって、少なくともその方の死者の中からの復活の後に、あなたたちが自分の悪い業について悔い改め、ニネベの人たちのように涙をもって神に嘆願するように。そうすればあなたたちの都が奪われず、破壊されないように。今破壊されているのに——にもかかわらず、あなたたちは、その方の復活について知っても悔い改めなかったばかりではありません。さらに、わたしがすでに言ったように、選ばれた人たちを全世界に遣わして告げ知らせました。「無敬虔な無法な異端が現れた。あるガリラヤ人イエスを通して。わたしたちが磔にした詐欺師。しかし、その弟子たちが夜に、十字架から降ろされた後にその方が置かれていた墓の中からその方を盗み出し、その方が死者の中から復活して天に上がったと語って、人たちを惑わしている」と。そして、あなたたちはさらに中傷しています。その方が、あの無敬虔な、無法な、不敬虔な業を教えたと。あなたたちが、その方をキリストとして、教師として、神の子として告白する人たちを、全人類の前で告発しているあの業を。そのうえで、あなたたちは今も、あなたたちの都が奪われ、あなたたちの地が荒らされたときに、悔い改めていません。むしろ、さらに、その方とその方を信じる人たちを呪う勇気を持っています。しかし、わたしたちは、あなたたちを、そして、あなたたちからこの意見を受け取った人たちを憎んでいません。むしろ、すべてのあなたたちが今でも悔い改め、万物の恵み深い、憐み深い父——神——から憐みを受け取るようにと祈っています。</p><h2>109</h2><p>——そして、民たちが、エルサレムから始まる、その方の使徒たちによって告げ知らせれた教えを聞いた後に、自分たちが迷いの中で生きていた不敬虔について悔い改めるはずであったこと、そしてその方を彼らから知ることについては——とわたしは続けました——十二預言者の中の一人ミカからのいくつかの言葉を挙げさせてください。次のとおりです。「終わりの日々においては、主の山が、山々の頂に堅く据えられ、丘の上に高められて現れるであろう。そして人たちはそれへと流れるであろう。そして多くの民が来て言うであろう。来よう、主の山に上り、ヤコブの神の家に行こう。そしてその方がわたしたちに道を示されるであろう。そしてわたしたちはその方の路を歩むであろう、と。なぜなら、シオンから律法が出て、主の言葉はエルサレムから出るからである。そしてその方は多くの人たちの間で裁き、遠くの強い民たちを責めるであろう。そして彼らは自分の剣を鋤に、自分の槍を鎌に打ち直すであろう。民が民にたいして剣を上げず、もはや戦いを学ぶこともないであろう。そして各人が自分の葡萄樹の下に、自分のいちじくの木の下に座り、誰もその人を恐れさせることはないであろう。なぜなら、万軍の主の口が語ったからである。なぜなら、すべての民は自分たちの神々の名のもとに歩み、わたしたちは、わたしたちの神の名のもとに世々限りなく歩むであろうから。そしてあの日には——わたしは、打ち砕かれた者を集め、追放された者と、わたしが打った者を受け入れるであろう。そしてわたしは、打ち砕かれた者を残りのものの中に、圧迫された者を強い民の中に置くであろう。そして主は、その日から、そして世々限りなく、シオンの山の上で、彼らの上に王となるであろう」（<a href="https://bibleox.com/ja/jp-ni/mih/4/#L1">ミカ. 4:1-7</a>）。</p><h2>110</h2><p>——皆さん、知っています——とわたしはこれらの言葉の後に続けました——あなたたちの教師たちも、この箇所のすべての言葉をキリストについて理解していることを。わたしはまた知っています。彼らは主張しています。その方はまだ来ていない、と。そして、もし来たとしても、それが誰であるかは知られていない、と。しかし、その方が現れて栄光に包まれるときには、その方が誰であるかが知られるであろう、と。そのとき、これらの言葉の中に語られていることが成就するであろう、と彼らは言います。あたかも預言の言葉からの実りがまだ全くなかったかのように。無分別な人たちよ。彼らは理解していません。すべての聖書の箇所から見て取れることを。キリストの二つの到来が告げ知らされていたことを。一つは、その方が苦しむ者として、栄えなく辱められ、磔にされるものとして提示されるもの。もう一つは、その方が栄光と共に天から来られるもの。無法の人間が、高慢な言葉を至高者にたいしてさえ語り、地の上で、わたしたち——キリスト者たち——にたいして無敬虔な業に取ってかかる勇気を持つときに。わたしたちは、律法から、そしてイエスの使徒たちを通してエルサレムから出て来た教えから、神への礼拝を知り、ヤコブの神へ、イスラエルの神へと走り寄りました。そして、わたしたちの各人は、以前には、戦争と互いの殺戮とあらゆる類の不敬虔で満たされていましたが、全地において、自分の戦争の道具を変えました。わたしたちの剣を鋤に、わたしたちの槍を農業の道具に。そしてわたしたちは、敬虔と、義と、人間愛と、信仰と、望みを耕しています。それらは父ご自身によって、磔にされた方を通して与えられました。そして、各人が自分の葡萄樹の下に座っています。すなわち、わたしたちの各人が一人の正当な妻を持っています。あなたたちは知っていますから、預言の言葉はこう語っていることを。「そしてその方の妻は、実りの多い葡萄樹のように」（<a href="https://bibleox.com/ja/jp-ni/ps/127/#L3">詩. 127:3</a>）。明らかに、誰も、イエスを信じて全地の中で生きているわたしたちを恐れさせ、奴隷にしません。彼らはわたしたちの首を切り、わたしたちを磔にし、獣たちに投げ、牢の中に、火の中へと投げ、あらゆるほかの苦しみに服させるにもかかわらず、しかし、知られているとおり、わたしたちは自分の告白から離れません。しかし、わたしたちがあれほど苦しめられるほどに、ほかの信じる人たちの数、そしてイエスの名によって神を敬う人たちの数は増し加わります。葡萄樹が、誰かがその実りの部分を切り取るなら、再びほかの開花して実りある枝を生み出すのと同じように。わたしたちも正確にこのようです。神と救い主キリストによって植えられた葡萄樹は、その方の民だからです。そして預言の残りの言葉は、その方の第二の到来の中で成就するでしょう。しかし、言葉「打ち砕かれた者と追放された者」——世界からのもの——は、各キリスト者が、あなたたちとほかの人たちの力の及ぶ限りにおいて、自分の所有物からだけでなく、全地からも追放されることを指し示しています。そうすれば、あなたたちは、キリスト者の一人にでも生きることを許しません。あなたたちは、これがあなたたちの民の上に成就したと言います。しかし、もしあなたたちが戦争のゆえに追放されたとしても、あなたたちは、すべての聖書の証しに従って、正義によってこれを耐えました。しかし、わたしたちは——神の真理を知った後に、このような何の背きも行わなかった人たち——神から証しを受け取っています。わたしたちは、最も正しい、唯一の穢れのない無垢なるキリストと共に、地から追い出されることを。なぜなら、イザヤは叫びます。「見よ、正しい人が滅びるのに、誰も心に留めない。そして正しい人たちは取り除かれるのに、誰も顧みない」（<a href="https://bibleox.com/ja/jp-ni/is/57/#L1">イザ. 57:1</a>）。</p><h2>111</h2><p>——わたしはすでに言いました——とわたしは続けました——キリストの二つの到来について、モーセの時代にさえ、断食のときに献げられる山羊の象徴を通して、象徴的に預言されていたことを。そして、同じことが再び神秘をもって前もって告げ知らせられ、提示されました。モーセとイエスが行ったことによって。彼らの一人は、支えられた両手を広げて、夕方まで山の上に留まりました。これは、ほかの何ものでもなく、十字架を描いていました。もう一人——イエスという名に改められた人——は、戦いにおいて指揮を執り、イスラエルは勝利しました。これが、両方の聖なる人たち、神の預言者たちによって行われたと考えることができます。なぜなら、そのうちの一人は、二つの神秘を一緒に提示することができなかったのですから。すなわち、十字架の像と呼び名の像を。この力は、ただあの唯一の方だけに属しているのです。あの方の名さえも、すべての支配は恐れています。苦しみを感じながら。なぜなら、あの方によって破壊されることになるからです。それゆえ、わたしたちの苦しむ者、磔にされたキリストは、律法によって呪われたのではなく、示しました。あの方がただ一人であること、その方への信仰から離れない人たちを救う方であることを。そして、エジプトの中で、エジプトの初生の子たちが滅ぼされたときに救われた人たちは、過越の血によって救われました。その血は、扉の框と、その上の横木の両側に注がれていました。なぜなら、過越祭はキリストでした。あの人が後に献げ物として献げられた方です。イザヤが語るとおりに。「その方は羊のように、屠りに引かれました」（<a href="https://bibleox.com/ja/jp-ni/is/53/#L7">イザ. 53:7</a>）。さらに、あなたたちが、過越祭の日にその方を引き受け、同じように過越祭のときにその方を磔にしたことも書かれています。そして、エジプトの中にいた人たちを過越の血が救ったように、キリストの血も、その方を信じる人たちを死から解放するであろう。もしこの印が扉の上になければ、神は惑わされたのでしょうか。いいえ、とわたしは言います。しかし、その方は、これによって、キリストの血を通して、人類のために救いが行われることを前もって告げ知らせました。なぜなら、エリコの中で、ナベの子イエスによって遣わされた偵察者たちが、遊女ラハブに与えた赤い縄の印も——彼らが彼女に、彼女が彼らを降ろした窓に、その縄を結びつけるようにと命じたとき。敵たちからそれを隠すために——同じように、キリストの血の象徴を表していました。その血によって、すべての民の中の、以前には遊女や無法者であった人たちが、罪の赦しを受け取り、もはや罪を犯さずに、救いを受け取るのです。</p><h2>112</h2><p>——しかし、あなたたちは——とわたしは言いました——これを卑しい仕方で説明しながら、単純に受け取り、語られたものの力を探究せずに、神に大いなる弱さを帰しています。なぜなら、このようにすれば、モーセも律法の破りの罪を負うことになるでしょうから。すなわち、天にあるものの、地の上のものの、海の中のものの、いかなる似姿も造るなと定めながら、その後に自分で青銅の蛇を作り、それをしるしの上に据え、咬まれた人たちにそれを見るようにと命じました。そして彼らは、それを見ながらいやしを受け取ったのです。民が、あの蛇——神が初めに呪われ、イザヤが語るとおり、偉大な剣によって殺されたもの——によってそのとき救われたと考えるべきでしょうか。そして、わたしたちは、あなたたちの教師たちが考えるのと同じように無分別にこれを理解すべきでしょうか。それとも象徴として受け取るべきでしょうか。わたしたちは、十字架につけられたイエスの像に、これを帰さないでしょうか。モーセもまた、両手を広げながら、イエスという名を与えられた人と共に、あなたたちの民に勝利をもたらしたのですから。こうして、少なくとも、わたしたちは、律の授け方が行ったことについて迷わないでしょう。彼は、神の忘却によってではなく、背きと服従しないことの始まりとなった獣へと、民の望みを置くようにと、民を説いたのですから。これは、至福ある預言者が、偉大な思想と神秘をもって行い、語ったことです。そして、すべての預言者たちの言葉と業の中には、その中に含まれる意味を理解するなら、正しく責められるべきものは何もありません。しかし、もしあなたたちのすべての教師たちが、なぜこの場所では雌の駱駝が言及されていないのか、雌の駱駝は何を意味するのか、なぜ供え物の中にはこれほどの小麦の粉とこれほどの油が用いられるのか、ということだけを説明し、卑しく細かく説明しながら、重要で探究に値する主題については語り、解釈する勇気を持たず、さらに、わたしたちの解釈を全く聞かず、わたしたちとの対話に入らないようにと、あなたたちに助言するなら、彼らは、わたしたちの主イエス・キリストが彼らにたいして語られた言葉を、不当にも聞くことになるのではないでしょうか。「白く塗られた墓。外は美しく見えるのに、中は死んだ者の骨で満ちている。あなたたちは薄荷の十分の一を献げながら、駱駝を呑み込む。盲の導き手たちよ」（<a href="https://bibleox.com/ja/jp-ni/mf/23/#L27">マタ. 23:27</a>、<a href="https://bibleox.com/ja/jp-ni/lk/11/#L42">ルカ. 11:42</a>、<a href="https://bibleox.com/ja/jp-ni/mf/23/#L24">マタ. 23:24</a>）。それゆえ、もしあなたたちが、「教師よ、教師よ」と呼ばれることを望みながら自分自身を高く上げている人たちの教えを軽蔑せず、預言の書物に向かって、あれほどの堅固さと心の準備をもって立ち寄らないなら——すなわち、あなたたちの人たちから、預言者たち自身が耐えたのと同じことを耐えるなら——預言の書物から何の益も全く受け取らないでしょう。</p><h2>113</h2><p>——わたしの考えはこうです。イエス——先に何度も語ったとおり、アウシと呼ばれ、カレブと共にカナンの地を探しに行くようにと遣わされたあの人——を、モーセはイエスと呼びました。あなたは、なぜその人がこれを行ったのかの原因を探究せず、迷わず、尋ねません。それゆえ、キリストはあなたから隠されています。そして、読みながらあなたは理解せず、今、イエスがわたしたちのキリストであると聞いても、この名が無益に、偶然にその人に与えられたのではないと考えません。しかし、あなたは、アブラハムの以前の名に一文字の「ア」が付け加えられたのはなぜかを神学的に論じ、サラの名に一文字の「ラ」が付け加えられたのはなぜかを威厳をもって論じます。しかし、ナベの子の父祖的な名アウシがイエスという名に変えられたのはなぜかを、同じように探究しません。その人の名が変えられただけでなく、その人はモーセの後継者ともなりました。エジプトから出て行ったその時代の人たちの中から、その人ただ一人が、生き残った民を聖なる地へと導き入れました。そして、その人がモーセではなく民を聖なる地へと導き入れ、その人と共に入った人たちのくじによってそれを分割したように、イエス・キリストも、人たちの離散を帰らせ、各人に善い地を分割するでしょう。ただし別の仕方で。なぜなら、最初の人が、彼らに暫定的な遺産を与えたのは、その人がキリストなる神でも、神の子でもなかったからです。しかし、イエス・キリストは、聖なる復活の後に、わたしたちに永遠の所有を与えるであろう。最初の人は、あらかじめイエスという名に改められ、その方の霊から力を受け取って、太陽を止めました。わたしは証明しました。イエスがモーセに、アブラハムに、一般にすべての族長たちに現れ、彼らと対話しながら、父の意志を成し遂げたことを。しかし、その方——言います——は、おとめマリヤから人として生まれるために来られ、常に留まっておられます。その方こそ、父がこの方を通して、そしてこの方の中で天と地を更新される方です。その方こそ、エルサレムの中で永遠の光を点す方です。その方こそ、メルキセデクの位に従うサレムの王であり、至高者の永遠の司祭です。最初の人が、知られているとおり、石の小刀を通して、第二の割礼によって民を割礼しました。これは、あの割礼を指し示していました。イエス・キリストご自身が、わたしたちを、石とほかの偶像への奉仕から割礼されたあの割礼です。そして、包皮のない者たちから——すなわち、世界の惑わしから——あらゆる場所で石の小刀によって割礼された多くの人たちを集めました。わたしたちの主イエスの教えによって。預言者たちがキリストを象徴的に石と岩と呼んだことは、わたしはすでに示しました。しかし、石の小刀の下で、わたしたちは、その方の教えを理解すべきです。その方の教えを通して、迷った人たちのこれほど多くの群れが、包皮のない状態から、心の割礼によって割礼されたのですから。この割礼によって、神はそのときイエスに、アブラハムから始まった肉の割礼を持っていた人たちさえも割礼するようにと命じられました。その方が、イエスに、聖なる地に入った人たちを、石の小刀を通して第二の割礼によって割礼するようにと言われたときに。</p><h2>114</h2><p>——時には、聖なる霊の働きによって、将来のものの像が明確に成し遂げられました——とわたしは続けました。そして時には、その方は、将来の出来事を、まるで現在のこと、あるいは過去のことさえについて語っているかのように預言しました。読者たちがこの働き方を知らないなら、預言の言葉を正しく理解することはできないでしょう。わたしの思想を理解していただくために、預言の言葉の中からいくつかを例として挙げましょう。聖なる霊がイザヤを通して語るとき——「その方は羊のように屠りに引かれ、毛を刈る者の前の小羊のように」（<a href="https://bibleox.com/ja/jp-ni/is/53/#L7">イザ. 53:7</a>）——まるで苦しみがすでに成し遂げられていたかのように語っています。そして、「わたしは手を差し伸べた。服従しない、逆らう民に」（<a href="https://bibleox.com/ja/jp-ni/is/65/#L2">イザ. 65:2</a>）と語るとき、そして「主よ、誰がわたしたちの耳に聞いたことを信じましたか」（<a href="https://bibleox.com/ja/jp-ni/is/53/#L1">イザ. 53:1</a>）と語るとき、まるですでに成就した出来事を指し示しているかのように語られています。わたしはすでに示しました。キリストがしばしば石と呼ばれ、ヤコブとイスラエルという名で象徴的に呼ばれていることを。そして再び、「わたしは天をご覧になり、あなたの指の業をご覧になる」（<a href="https://bibleox.com/ja/jp-ni/ps/8/#L4">詩. 8:4</a>）と語られるとき、わたしがここでその方の言葉の業を理解しないなら、あなたたちの教師たちと同じように無分別にこの箇所を理解することになるでしょう。彼らは、万物の父であり、生まれない神が、複合的な存在のように、手と足と指と魂を持っていると考え、そのために、父ご自身がアブラハムとヤコブに現れたと教えているのですから。それゆえ、わたしたちは至福です。石の小刀を通して第二の割礼を受けたわたしたちは。</p><p>なぜなら、あなたたちの最初の割礼は、鉄によって成し遂げられていましたし、今日も成し遂げられています。あなたたちの心が粗いからです。しかし、わたしたちの割礼——数において第二のものであり、あなたたちのものの後に現れたもの——は、鋭い石たちによって、すなわちあの隅の石の使徒たちの言葉によって行われます。その方は、手の助けなしに切り離され、わたしたちを偶像礼拝と一般にすべての罪から割礼する方です。そして、わたしたちの心は悪からこのように割礼されています。あの卓越した石の名のために死ぬことさえ歓びとするほどに。その方は、その方を通して万物の父を愛する心たちの中から生きた水を湧き出させ、命の水を飲みたいと望む人たちを潤す方です。しかし、あなたたちはわたしの言葉を理解しません。あなたたちは、預言に従ってキリストが成し遂げるはずであったことを理解せず、わたしたちが聖書を挙げるときに、わたしたちを信じないからです。エレミヤはこう語ります。「あなたたちに災いあれ。あなたたちは、生きた泉を捨て、自分のために、水を留めることのできない壊れた溜め池を掘ったのですから。シオンの山があるところが、まさに荒野となるでしょうか。わたしが、あなたたちの目の前で、エルサレムに離縁状を与えたからである」（<a href="https://bibleox.com/ja/jp-ni/ier/2/#L13">エレ. 2:13</a>、<a href="https://bibleox.com/ja/jp-ni/ier/3/#L8">エレ. 3:8</a>）。</p><h2>115</h2><p>——しかし、あなたたちはゼカリヤを信じるべきです。彼は、キリストの神秘を象徴的に示し、隠された仕方でそれを告げ知らせているのですから。彼の言葉はこうです。「歓びなさい、そして歓びの歓びとせよ、シオンの娘よ。なぜなら、見よ、わたしは来て、あなたの真ん中に住むであろう、と主は言われる。そして多くの民はあの日に主に結び付くであろう。そして彼らはわたしの民となるであろう。そしてわたしはあなたの真ん中に住むであろう。そして彼らは知るであろう。万軍の主がその方をあなたのもとに遣わされたことを。そして主はユダを相続し、聖なる地の中で自分の分け前を相続し、エルサレムを再び選ぶであろう。すべての肉は主の前に震えるように。なぜなら、その方は、その方の聖なる雲々たちの中から立ち上がられたからである。そしてその方は、わたしに、大いなる司祭ヨシュアを示しました。主の御使いの前に立っている人。そして悪魔がその人の右に立って、その人に逆らおうとしていました。そして主は悪魔に言われた。エルサレムを選んだ主があなたを責めるように。これは、火から引き抜かれた燃えさしではないのか」（<a href="https://bibleox.com/ja/jp-ni/zah/2/#L14">ゼカ. 2:14-15</a>、<a href="https://bibleox.com/ja/jp-ni/zah/2/#L16">ゼカ. 2:16-17</a>、<a href="https://bibleox.com/ja/jp-ni/zah/3/#L1">ゼカ. 3:1-2</a>）。トリュフォンがわたしに反論しようとしたとき、わたしは言いました。待ちなさい。まず、わたしが語っていることを聞いてください。わたしは、あなたが考えているように、バビロンの地の中に——あなたたちの民が捕囚の中で連れ去られた地——ヨシュアという名の司祭は存在しなかったと説明するつもりはありません。もしこれをしたいなら、わたしは証明するでしょう。あなたたちの民の中にヨシュアという司祭はいましたが、預言者が自分の顕現の中で見たのは、彼自身ではなかったことを。悪魔と主の御使いと同じように。彼は、自然な状態の中で自分の目によって彼らを見たのではなく、彼に与えられた顕現の中で、恍惚のうちに彼らを見たのです。しかし今、わたしはこう語ります。先にわたしが語ったとおり、ナベの子が、イエスの名を通して、わたしたちの主が成し遂げるはずであったことを前もって告げ知らせる力と業を成し遂げたように、今も証明します。あなたたちの民の中で、司祭ヨシュアのもとにバビロンで与えられた顕現は、わたしたちの司祭、神、キリスト——万物の父の子——が成し遂げるはずであったことの預言であったことを。わたしには、驚くべきことでした——とわたしは続けました——なぜあなたたちは、その少し前に沈黙し、わたしが、ナベの子が、エジプトから出て行ったその時代の人たちの中の一人として、この世代の若い部分と共に聖なる地に入ったと語ったときに、わたしを中断しなかったのかを。あなたたちは、蝿のように、傷口へと集まり飛んで来ますから。もしある人が千の物について見事に語りながら、あなたたちの気に入らないもの、あるいはあなたたちには理解できないもの、あるいは正確でないものを一つ語ったなら、あなたたちは、見事に語られた多くのものを無視して、わずかな言葉を捕らえ、それを不敬虔と無法として提示しようと努めるのです。それゆえ、あなたたちは、主によって同じ裁きの中で裁かれるでしょう。あなたたちは、自分の大いなる大胆さのゆえに——悪い業のゆえにであれ、あなたたちの偽りの歪んだ解釈のゆえにであれ——はるかに多くの説明を与えることになるでしょう。あなたたちが裁くのと同じ裁きによって、あなたたちを裁くのは正当なことだからです。</p><h2>116</h2><p>しかし、聖なるヨシュアの顕現についての説明を与えるために、わたしは語りを再開し、こう言います。この顕現は、わたしたち——キリストを信じる人たち——に関わるものです。磔にされた大司祭を信じるわたしたち。わたしたちは、不倫と一般にすべての嫌悪すべき業に献げられながら、わたしたちのイエスが父の意志によって与えてくださった恵みによって、わたしたちが着ていた、あらゆる穢れた悪いものを脱ぎ捨てました。悪魔は、わたしたちにたいして立ち上がります。常にわたしたちにたいして働き、すべての人を自分へと引き寄せようと望む方です。しかし、神の御使い、すなわちイエス・キリストを通してわたしたちに送られた神の力は、その方に禁じます。そしてその方はわたしたちから去ります。そして、わたしたちは、まるで火から引き抜かれたかのようです。わたしたちは、以前の罪から解放され、悪魔とそのすべての僕たちがわたしたちのために用意している苦しみと炎から解放されたからです。そして、これからも神の子イエスがわたしたちを解放します。その方は、わたしたちがその方の命令を行うなら、わたしたちのために整えられた服を着せること、そしてわたしたちに永遠の王国を与えることを約束されました。なぜなら、あのヨシュア——預言者が司祭と呼ぶ人——は、穢れた服を着て現れました。なぜなら、語られているとおり、その人は遊女を妻として娶ったからです。そして、火から引き抜かれた燃えさしと呼ばれました。自分の罪の赦しを受け取ったからです。その間に、その人の対抗者である悪魔は禁じられました。同じように、わたしたちは——イエスの名によって、一人の人のように、万物の造り主なる神を信じ、その方の初生の子の名によって——穢れた服たちから、すなわち罪たちから脱ぎ捨てられ、その方の召しの言葉によって試されながら、真の大司祭なる神の家系を成しています。神ご自身が証ししておられるとおり、すべての場所において、民の中で、喜ばれる清い献げ物がその方に献げられていると。しかし、神は、自分の司祭たちのほかの誰からも献げ物を受け取られません。</p><h2>117</h2><p>それゆえ、神は、イエス・キリストが行うようにと命じられた、その方の名によってのすべての献げ物——すなわち、パンと杯の聖体の中で、キリスト者たちが地のあらゆる場所で献げるもの——が、その方に喜ばれることを前もって証しされました。そして、あなたたちが献げる献げ物、そしてあなたたちのあの司祭たちを通して献げられるものは、その方が退けられます。「そしてわたしはあなたたちの手からあなたたちの献げ物を受け取らない。日の昇るところから日の没するところまで、わたしの名は大きくされているからである（民の中で、すべての場所において、わたしの名に香料と清い献げ物が献げられているからである。わたしの名は大きくされているから）」——民の中で、と主は言われます——「しかし、あなたたちはそれを穢している」（<a href="https://bibleox.com/ja/jp-ni/mal/1/#L11">マラ. 1:11-12</a>）。しかし、あなたたちは今も、争いへの愛のゆえに語っています。ここで神は、その当時エルサレムの中に住んでいた、いわゆるイスラエル人たちから献げ物を受け取らないことを示し、その当時離散の中にいたあなたたちの民からの人たちの祈りはその方に喜ばれること、そしてその方は彼らの祈りを献げ物と呼ぶことを。わたしは同意します。ふさわしい人たちによって献げられる祈りと感謝だけが、完全な献げ物であり、神に喜ばれるものです。キリスト者たちが献げるようにと教えられているのはまさにこれであり、しかも、乾いたものと液体のものを受け取るときの記憶と共にです。それによって彼らは、神の子が彼らのために負われた受難を思い起こすのです。その方のこの名は、あなたたちの大司祭たちとあなたたちの民の教師たちが、全世界において穢し、褻ろうと努めた名です。しかし、神は、イエスの名によってキリスト者となったすべての人たちの上に、あなたたちが置いたこれらの穢れた服を、その方がすべての人を生き返らせるときに、わたしたちから公然と取り去るであろう。そして、ある人たちを、永遠の破壊不可能な王国の中で、朽ちない不死の悲しみのないものとし、ほかの人たちを火の中の永遠の苦しみへと送るであろう。しかし、あなたたちとあなたたちの教師たちは、自分自身を欺いています。あの聖書の箇所が、離散の中にいたあなたたちの民からの人たちについて語っている、そして彼らの祈りと献げ物はすべての場所で清く神に喜ばれるものであったと解釈して。知ってください。あなたたちは偽って語っており、あらゆる仕方で自分自身を惑わそうと努めていることを。特に、今でもあなたたちの民が東から西まで離散していないときには。しかし、あなたたちの民の誰も住んでいない民たちがいます。その間に、一つの民もありません。異邦人たちであれ、エリン人たちであれ、ほかの何らかの名で呼ばれる民たち、遊牧する人たち、家のない人たち、牧羊の生き方をして天幕の中に住む人たち——その中では、磔にされたイエスの名によって、万物の父であり造り主への祈りと感謝が献げられないような民は、全くありません。そのうえで、あなたたちは知っています。預言者マラキがこれを語ったときには、あなたたちはまだ、今日のように全地に離散していませんでした。これは聖書からも見て取れます。</p><h2>118</h2><p>それゆえ、あなたたちは、争いへの愛を捨て、あの偉大な裁きの日が来る前に悔い改めるほうが良いでしょう。聖書が預言したとおり——わたしが証明したとおり——あなたたちの部族から、このキリストを刺し貫いた人たちすべてが泣き叫ぶ日が。わたしは、預言「主は誓われました。あなたはメルキセデクの位に従って司祭である」の意味を説明しました。そして、イザヤの預言「その方の墓は取り去られました」がキリスト——葬られ、生き返るはずであった方——に関わることもすでに言いました。わたしは多くのことを語りました。このキリストが生きている人たちと死んだ人たちすべての裁き手であることを。同じように、ナタンもダビデにその方についてこう語りました。「わたしはその人にとって父となり、その人はわたしにとって子となるであろう。そしてわたしは、わたしがその人の前にいた人たちに対して行ったように、わたしの憐みをその人から取り去らないであろう。そしてわたしは、その人をわたしの家の中に、そして世々限りなくその王国の中に据えるであろう」（<a href="https://bibleox.com/ja/jp-ni/2ts/7/#L14">サム下. 7:14-16</a>）。そしてエゼキヤも、家の中での長として、ほかの誰でもなく、このキリストだけを呼んでいます。その方こそ、選ばれた司祭、永遠の王、キリストです。神の子として。そして、イザヤとほかの預言者たちが、その方の第二の到来のときには、祭壇のもとに血の献げ物や献酒が献げられると語っているとは考えないでください。むしろ、真実の霊的なもの——讃美と感謝を。わたしたちは、その方を信じたことにおいて無益ではありませんでしたし、こう教えた人たちによって惑わされてもいません。しかも、これは、神の驚くべき摂理によっても整えられました。わたしたちは、新しい永遠の契約、すなわちキリストの召しを通して、あなたたちよりもより分別ある敬虔なものとなりました。あなたたち——ただ見かけ上で分別があり、神を敬っている人たち、しかし実際にはそうではない人たち——よりも。これに驚きながら、イザヤは言いました。「そして王たちは口を閉ざすであろう。なぜなら、その方について告げ知らせなかった人たちが見るであろうし、聞かなかった人たちが会得するからである。主よ、誰がわたしたちの耳に聞いたことを信じましたか。主の腕は誰に現されたでしょうか」（<a href="https://bibleox.com/ja/jp-ni/is/52/#L15">イザ. 52:15</a>、<a href="https://bibleox.com/ja/jp-ni/is/53/#L1">イザ. 53:1</a>）。これを語りながら、トリュフォンよ——とわたしは付け加えました——わたしは、できる限り、先に自分が語ったことを繰り返そうと努めています。今日あなたと共に来た人たちのために、簡潔に、密に、ですが。</p><p>——良いことをしています——とトリュフォンは言いました。そして、たとえあなたが同じことをさらにくわしく繰り返すとしても、わたしと、ここにいる人たちが、聞くことを大いに喜んでいることを確信しなさい。</p><h2>119</h2><p>——皆さん、考えていますか——とわたしは再び語り始めました——わたしたちは、神の意志によって、これを理解するための恵みを受け取っていなければ、聖書の中でこれをいつか理解できたでしょうか。モーセが語ったことが成就するようにと、これを整えようと望まれた方の意志によって。「彼らは、ほかのものたちでわたしを怒らせ、自分の嫌悪すべきものでわたしを悲しませました。彼らは呼び求めていない霊たちに献げ物を献げました。新しいものと最近のものが現れました。彼らの父たちは呼び求めていなかったものを。お前は、お前を生んだ神を捨て、お前を養う神を忘れた。そして神は見て、熱心を燃やし、その子たちと娘たちの怒りのゆえに悲しまれた。そして言われた。わたしは顔を彼らから背けるであろう。そして彼らに、終わりの日々に何が起こるかを見せるであろう。なぜなら、彼らは歪んだ世代であり、信じるもののない子たちだからである。彼らは、神ではないものによってわたしに熱心を燃やさせ、自分の偶像たちによってわたしを悲しませた。そしてわたしは、民ではないものによって彼らの中に熱心を燃やし、無分別な民によって彼らを悲しませるであろう。なぜなら、わたしの怒りから火が燃え上がり、陰府まで燃え上がるであろう。その方は地とその産物を食い尽くし、山々の基礎を焼くであろう。わたしは彼らの上に災いを集めるであろう」（<a href="https://bibleox.com/ja/jp-ni/vtor/32/#L21">申. 32:21-22</a>）。そして、あの正しい方が殺された後に、わたしたち、別の民は繁栄し、新しい開花する穂のように生え伸びました。預言者たちが言ったとおりです。「そして多くの民は、あの日に、民の中で主のもとへと走り寄り、全地の真ん中で住むであろう」（<a href="https://bibleox.com/ja/jp-ni/zah/2/#L15">ゼカ. 2:15</a>）。そして、わたしたちは民であるばかりでなく、聖なる民でもあります。すでに示したとおり、「そしてその人は、主から解放された聖なる民と呼ばれるであろう」（<a href="https://bibleox.com/ja/jp-ni/is/62/#L12">イザ. 62:12</a>）。それゆえ、わたしたちは、軽蔑された群衆ではなく、異邦の部族でもなく、カリヤ人やフリギア人の民のようなものでもありません。神はわたしたちを選び、その方を求めなかった人たちに現れました。「見よ、わたしは、わたしの名を呼び求めていなかった民のための神である」とその方は言われます（<a href="https://bibleox.com/ja/jp-ni/is/65/#L1">イザ. 65:1</a>）。これがあの民です。神がかつてアブラハムに約束し、多くの民の父とすると言われた民。アラビア人たちやエジプト人たちやエドム人たちのことではなく。なぜなら、イシマエルも偉大な民の父となり、エサウも。アンモン人たちは今日でも偉大な数です。ノアは、アブラハムそのものの父でもあり、一般に全人類の父でもありました。そしてほかの人たちは、あれやこれやの民の祖でした。それなら、ここでキリストはアブラハムに何を多く与えるのでしょうか。</p><p>その方が、自分の声をもって、そのような呼び名をもってその人を召し、その人が住んでいた地から出て行くようにと命じられたことです。そしてその方は、わたしたち全員を同じ声によって召しました。そしてわたしたちは今、自分たちが、地の住人たちのほかの人たちと同じように悪く生きながら、送っていたあの生き方から出て行きました。そしてアブラハムと共に聖なる地を相続し、尽きることのない永遠の中で遺産を受け取るであろう。わたしたちは、その人と同じ信仰によってアブラハムの子だからです。なぜなら、あの人が神の声を信じ、これが彼に対して義とみなされたように、わたしたちも、神の声を信じながら——使徒たちによって再び知らされ、預言者たちによってわたしたちに前もって告げ知らせられたもの——世界の中のすべてのものから、死に至るまで離れました。それゆえ、その方は、その人に、信仰において似た民を、敬虔な、正しい、父を喜ばせる民を約束しました。しかし、あなたたちではありません。「信じるもののない子たち」では。</p><h2>120</h2><p>見なさい、その方が同じことをイサクとヤコブにも約束されたことを。その方はイサクにこう言われました。「あなたの子孫によって、地のすべての民は祝福されるであろう」（<a href="https://bibleox.com/ja/jp-ni/gen/22/#L18">創. 22:18</a>）。そしてヤコブに「お前によって、そしてお前の子孫によって、地のすべての部族は祝福されるであろう」（<a href="https://bibleox.com/ja/jp-ni/gen/28/#L14">創. 28:14</a>）と。その方は、エサウにでも、ルベンにでも、ほかの誰にでもこれを言いませんでした。ただ、キリストが、おとめマリヤを通しての経営によって生じるはずであった人たちだけです。そして、もしあなたがユダの祝福を理解するなら、わたしが語っていることが分かるでしょう。なぜなら、ヤコブから種子が分離し、ユダを、ファレスを、イッサイを、ダビデを通して進むからです。これは、あなたたちの民の中のある人たちが、アブラハムの子として、そしてキリストの分の中で見出されることの印でした。そしてほかの人たちは、アブラハムの子としても、海の岸辺の砂のようになるでしょう。実りのない不毛の砂のように。数において大いに偉大で数え難いけれども、何の実りももたらさず、ただ海の水を呑み込むだけのもの。これによって、あなたたちの民の中の、教えの中の苦味と不敬虔を呑み込み、神の言葉を退ける、あの大いなる数が責められています。ユダについてその方は語ります。「ユダから統治者が絶えず、その方の股から指導者が出続けることはありません。その方のために定められたものが来るまで。そしてその方こそ、民たちの望みである」（<a href="https://bibleox.com/ja/jp-ni/gen/49/#L10">創. 49:10</a>）。これがユダについてではなく、キリストについて語られていることは明らかです。わたしたち、すべての民から出た者たちは、ユダではなく、イエス——あの人があなたたちの父たちをエジプトから連れ出した方——を待ち望んでいるのですから。なぜなら、預言は、キリストの到来の前にこう告げ知らせましたから。「その方のために定められたものが来るまで。そしてその方こそ、民たちの望みである」。それゆえ、その方は来られました。わたしがくわしく示したとおり。そして、その方の名をあなたたちが穢し、全世界で穢そうと努めているあのイエスが、再び雲の上に来られるであろう。わたしは可能です、皆さん——とわたしは続けました——あなたたちと、あなたたちが「その方のために定められたものが来るまで」と語られていると言い解く言葉について争うことは。なぜなら、七十人訳はこう訳していません。「その方のために定められたものが来るまで」とではなく、「定められた方が来るまで」と。しかし、続く言葉——それらはこう読まれます。そしてその方こそ、民たちの望みである——が、その中でキリストについて語られていることを証明しているので、わたしは、わずかな言葉についてあなたたちと争いません。ちょうど、わたしが、あなたたちが認めていない聖書の箇所からキリストについての証明を挙げようと努めなかったように。先に、預言者エレミヤとエズラとダビデから挙げた箇所です。しかし、あなたたちが今日まで認めている箇所によって証明しました。もしあなたたちの教師たちがこれらの箇所を理解していたなら、確信しなさい、彼らはそれらを消し去ったでしょう。彼らが、イザヤの死に関わる箇所について行ったように。あなたたちは、木の鋸でその人を引き裂いた人です。そしてこれ自体が、キリストについての神秘を指し示していました。その方は、あなたたちの民を二つに分けるはずでした。すなわち、ふさわしい人たちを、聖なる族長たちと預言者たちと共に永遠の王国の中で報いるため。そしてほかの人たちを、すべての民から出た、信じない悔い改めない人たちと共に、その方がすでに言われたとおり、消えることのない火の中の苦しみへと送るため。「東からも西からも来るであろう。そしてアブラハムと、イサクと、ヤコブと共に天の御国の中で座に着く。しかし御国の子たちは外の暗さの中へと追い出されるであろう」（<a href="https://bibleox.com/ja/jp-ni/mf/8/#L11">マタ. 8:11-12</a>）。そしてこれを、わたしはあなたたちに言いました——とわたしは付け加えました——わたしが、真理を語ることだけを考えており、誰も恐れずにこれを語ったでしょう。たとえあなたたちが今、わたしを引き裂いたとしても。わたしは、わたしの同国人たち——サマリヤ人たちのことです——の誰のことも見ませんでした。書面による願い出の中で、カエサルにこう語ったとき。彼らが惑わされていることを。自分の同族のシモン、魔術師を信じながら。彼らは、あらゆる支配と権威と力の上に、その人を神として敬っています。</p><h2>121</h2><p>彼らが沈黙したとき、わたしは語り続けました。——皆さん、神はダビデを通して、このキリストについて語るとき、「その方の子孫によって、民は祝福される」とは言いませんでした。むしろ、「その方ご自身によって。その方の名は世々限りなく。太陽の上に上るであろう。そしてすべての民はその方を通して祝福される」（<a href="https://bibleox.com/ja/jp-ni/ps/72/#L17">詩. 72:17</a>）と。そして、もしあらゆる民がキリストを通して祝福されるなら、そして、すべての民から形成されたわたしたちが、このイエスを信じるなら、その方こそキリストであり、わたしたちは、その方を通して祝福された人たちです。神は、書かれているとおり、かつて太陽を拝することを許されました。しかし、太陽への信仰のために死ぬことを決意した人を見出すことはできません。しかし、イエスの名のためにすべてのことを耐え抜くことを決意した人たち、そして決意する人たちが、あらゆる民の中から見られます。その方から離れないように。なぜなら、その方の真理と知恵の言葉は、太陽の力よりも強く燃え、輝き、心と精神の深さの中へと進むからです。それゆえ、聖書は語っています。「太陽の上に、その方の名は上るであろう」と。そしてゼカリヤもこう語っています。「日の出、その方の名は」（<a href="https://bibleox.com/ja/jp-ni/zah/6/#L12">ゼカ. 6:12</a>）。そしてその方は、その方についてこう語りました。「部族ごとに泣くであろう」（<a href="https://bibleox.com/ja/jp-ni/zah/12/#L12">ゼカ. 12:12</a>）。もしその方が、第一の到来のときに——栄えない、姿のない、低められたその方の到来——あれほど輝き、あれほどの力を持たれたなら、その方が知られない民は一つもなく、あらゆる民からの人たちが、あらゆるところで悔い改め、以前の悪い生き方から立ち帰ったほどに。悪霊たちさえ、その方の名に服従し、すべての支配と王国が、死んだすべての人たちの名よりも、その方の名を震えさせるほどに。それなら、その方の栄光ある到来のときに、その方は、その方を憎み、不当にもその方から離れた人たちすべてを打たないのでしょうか。そして、その方の追随者たちを安らげ、彼らにすべての期待される善いものを与えないのでしょうか。それゆえ、わたしたちには、このキリストを通して聞くことも、理解することも、救われることも、そして父に属するすべてのものを知ることが与えられました。それゆえ、その方はキリストに言われました。「あなたにとって重要なのは、わたしの僕と呼ばれることです。ヤコブの部族を立て、イスラエルの離散を帰らせるため。わたしは、あなたを民の光とした。あなたが、地の果てまでの彼らの救いとなるためである」（<a href="https://bibleox.com/ja/jp-ni/is/49/#L6">イザ. 49:6</a>）。</p><h2>122</h2><p>あなたたちは、これらの言葉が、寄留者と改宗者たちについて語られていると考えています。しかし、実際には、これらはわたしたちについて語られています。イエスによって照らされたわたしたちです。なぜなら、キリストは、もちろん、彼らにも証しを与えたでしょう。しかし今、その方ご自身が言われるとおり、「あなたたちは、二重に陰府の子です」（<a href="https://bibleox.com/ja/jp-ni/mf/23/#L15">マタ. 23:15</a>）。しかし、挙げられた預言者たちの言葉は、彼らではなく、わたしたちに関わるものです。聖書がこのように語っている人たちについて。「わたしは、彼らが知らなかった道を、盲人たちを導くであろう。そして彼らは、彼らにとって未知であった路を歩むであろう。そしてわたしは証人である、と主なる神は言われる。そしてわたしが選んだ僕」（<a href="https://bibleox.com/ja/jp-ni/is/42/#L16">イザ. 42:16</a>）。それなら、キリストは誰について証しするのでしょうか。明らかに、信じた人たちについてです。しかし、あなたたちの改宗者たちは、信じないばかりでなく、あなたたちの二倍も、その方の名を褻り、その方を信じるわたしたちを死と苦しみへと引き渡そうと努めています。彼らは、あらゆる点であなたたちに似ようと努めているのですから。そして、別のところでは、その方は叫ばれます。「わたし、主は義のうちにあなたを呼びました。そしてあなたの手を握り、あなたを堅くするであろう。そしてわたしは、あなたを民の契約、異邦人の光として与えるであろう。盲人の目を開き、投獄された者たちをその監禁から出させるために」（<a href="https://bibleox.com/ja/jp-ni/is/42/#L6">イザ. 42:6-7</a>）。そしてこれが、皆さん、キリストについて、そして照らされた異邦人たちについて語られていることです。あるいは、あなたたちは再び、これが律法と改宗者たちについて語られていると言うのでしょうか。</p><p>そのとき、あたかも劇場の中であるかのように、第二の日に来た人たちの中のある人たちが叫びました。</p><p>——何ですか。その方が律法と、律法によって照らされた人たちについて語っていないのですか。それこそが改宗者たちです。</p><p>——違います——とわたしはトリュフォンに向かって言いました。もしあの律法が、異邦人たちを、そしてそれを持っている人たちを照らす力を持っていたなら、新しい契約には何の必要があったでしょうか。神が、新しい契約と永遠の律法と命令を送ると前もって告げ知らせられたので、わたしたちは、ここで、古い契約とその改宗者たちではなく、キリストとその改宗者たちを理解すべきです。すなわち、わたしたち異邦人たち。その方が照らされた人たち。その方が一つの箇所で言われるとおり。「主はこう語られる。喜ばれる時に、わたしはあなたに聞き、救いの日に、あなたを助けた。そしてわたしは、あなたを民の契約として与える。あなたが地を整え、荒れ地を遺産として受け取るために」（<a href="https://bibleox.com/ja/jp-ni/is/49/#L8">イザ. 49:8</a>）。キリストの遺産は何でしょうか。異邦人たちではありませんか。神の契約は何でしょうか。キリストではありませんか。ちょうど、その方が別のところで言われるとおり。「あなたはわたしの子である。わたしは今日、あなたを生んだ。わたしに求めなさい。そしてわたしは、民をあなたの遺産として、そして地の果てをあなたの所有として与えるであろう」（<a href="https://bibleox.com/ja/jp-ni/ps/2/#L7">詩. 2:7-8</a>）。</p><h2>123</h2><p>それゆえ、これらの預言のすべてがキリストと異邦人たちについて語られているように、あなたたちは最初のものについても同じように考えるべきです。改宗者たちには、契約には何の必要もありません。同じ律法が、割礼を受けたすべての人たちの上に置かれているなら。そして、聖書は彼らについてこう語っています。「そして寄留者が彼らに結び付き、ヤコブの家に結び付くであろう」（<a href="https://bibleox.com/ja/jp-ni/ish/12/#L48">出. 12:48</a>）。それに加えて、あなたたちの民に結び付くために割礼を受ける寄留者は、あなたたちの間で生まれた人の一人のようになります。しかし、わたしたちは、民という呼び名を授けられながら、それでも異邦人です。なぜなら、割礼を受けていないからです。また、あなたたちの改宗者たちの目は開かれていて、あなたたちの目はそうではないと考えること、そしてあなたたちが盲であり聾者と呼ばれ、彼らが照らされたと呼ばれることは笑うべきことです。そして、さらに笑うべきことになるでしょう。もしあなたたちが言うなら。律法は異邦人たちに与えられ、あなたたちはこの律法を知らなかった、と。そうでなければ、あなたたちは神の怒りを恐れ、無法な迷った子たちとはならず、その方の絶え間ない言葉を聞くことを恐れたでしょうから。「信じるもののない子たちよ」と。そして「誰がわたしの僕たちのように盲であるでしょうか。そして、それらを所有している人たちのように聾者であるでしょうか。神の僕たちは失明しました。あなたたちはしばしば見たのに、注意を払いませんでした。あなたたちの耳は開かれていたのに、聞きませんでした」（<a href="https://bibleox.com/ja/jp-ni/is/42/#L19">イザ. 42:19-20</a>）。このような神からの讃めは、あなたたちにとって良いものでしょうか。そして、僕たちにとって、その方からのこのような証しはふさわしいでしょうか。あなたたちは、これのようなことを聞くことに恥じていません。そして神の脅しを恐れていません。しかし、あなたたちは無分別で心のかたくなな民です。「それゆえ、見よ、わたしはこの民にさらに驚くべきことをする、と主は言われる。わたしはその民にさらに驚くべきことをする。わたしは智慧ある人たちから智慧を取り去り、分別ある人たちの分別を隠す」（<a href="https://bibleox.com/ja/jp-ni/is/29/#L14">イザ. 29:14</a>）。そして正当なことです。なぜなら、あなたたちは智慧ある者でも分別ある者でもありません。むしろ残酷で偽りな人たちです。あなたたちは、悪を行うことにおいてだけ智慧があります。しかし、あなたたちは、神の隠された意志を知ること、主の確かな契約を見出すこと、あるいは永遠の路を見つけることには力がありません（<a href="https://bibleox.com/ja/jp-ni/ier/4/#L22">エレ. 4:22</a>、<a href="https://bibleox.com/ja/jp-ni/ier/5/#L4">エレ. 5:4-5</a>）。</p><p>それゆえ、その方は言われます。「わたしはイスラエルのために、そしてユダのために、人の種子と家畜の種子を生み出すであろう」（<a href="https://bibleox.com/ja/jp-ni/iez/36/#L37">エゼ. 36:37-38</a>）。そしてイザヤを通して、別のイスラエルについてこう語られます。「あの日には、アッシリア人たちとエジプト人たちの中に第三のイスラエルがいるであろう。主が祝福された地の中で祝福された者として。言う。わたしの民は祝福されるであろう。エジプトの中で、そしてアッシリアの中で。そしてイスラエルはわたしの遺産である」（<a href="https://bibleox.com/ja/jp-ni/is/19/#L24">イザ. 19:24-25</a>）。神がこの民を祝福し、その方をイスラエル、自分の遺産と呼ばれるなら、なぜあなたたちは悔い改めないのでしょうか。自分たちだけがイスラエルであったかのように自分自身を惑わしていることについても。そして、神によって祝福された民を呪していることについても。なぜなら、神がエルサレムと、その周囲の国々に語られたとき、さらに次のことを付け加えられましたから。「そしてわたしは、あなたたちの上に人たちを生み出すであろう。わたしの民、イスラエル。そして彼らはあなたたちを遺産として受け取るであろう。そしてあなたたちは彼らの所有となるであろう。そしてあなたたちは、彼らのもとで、もはや子を持たないことはないであろう」[14]。</p><p>——それなら、どうなのですか——とトリュフォンは言いました。あなたたちはイスラエルなのですか。そして神がこれをあなたたちについて語っておられるのですか。</p><p>——もしあなたたちが、これについて多くの対話を交わしていなかったなら——とわたしはその人に答えました——あなたが無知からこのことを尋ねているのかもしれないと考えたでしょう。しかし、わたしたちはこの問いを考察し、あなたたちがこれに同意したので、あなたが以前に語られたことを知らないとか、再び争いたいとは考えません。むしろ、あなたは、これらの聴衆のために同じ証明を繰り返すようにとわたしを招いているのです。その人が自分の目差しによって同意を表したとき、わたしは語り始めました。イザヤの中では——もしあなたたちが、耳をもって聞くなら——神がキリストについて語り、その方を象徴的にヤコブとイスラエルと呼ばれています。その方はこう語られます。「ヤコブ、わたしの僕。わたしはその方を支えるであろう。イスラエル、わたしの選んだ者。わたしは、わたしの霊をその方の上に置くであろう。そしてその方は、民たちに裁きを告げ知らせるであろう。その方は争わず、叫ばず、誰もその方の声を広場の中で聞きません。折れた葦を折らず、燃えて煙を出す亜麻を消さず、真実をもって出て行くであろう。裁きをもって持ち出すであろう。そして、その方が地の上に裁きを据えるまで、挫けることはありません。そして、その方の名に民たちは望みを置くであろう」（<a href="https://bibleox.com/ja/jp-ni/is/41/#L8">イザ. 41:8-9</a>、<a href="https://bibleox.com/ja/jp-ni/is/42/#L1">イザ. 42:1-4</a>）。それゆえ、この一人のヤコブ——イスラエルとも呼ばれた人——から、あなたたちの種族全体がヤコブとイスラエルと呼ばれるようになったように、わたしたちも——キリストの命令を守っている人たちは、キリストから、神のために生まれた人たち——ヤコブと、イスラエルと、ユダと、ヨセフと、ダビデだけではなく、真の神の子たちとも呼ばれます。そして、実際にそうなのです。</p><h2>124</h2><p>わたしが、わたしたちを神の子たちさえと呼んだことによって彼らが困惑しているのに気づいたので、彼らの問いに先回りして言いました。聞いてください、皆さん。聖なる霊がこの人たちについてどう語っておられるかを。彼らすべてが至高者の子たちであること、そして彼らの集会の中に、このキリストご自身が、全人類に対する裁きを行いながら留まられることが。これらの言葉はダビデによって語られました。あなたたちがそれらを訳しているとおりに。「神は神々の集会の中に立ち、その方は真ん中で神々を裁かれる。いつまで、あなたたちは不正に裁き、罪人たちの顔を上げるのでしょうか。みなしごのための裁きを行い、貧しい人のための裁きを行え。乏しい人を義とし、貧しい人を、悪人たちの手から解放せよ。彼らは知らず、会得しなかった。暗さの中で歩む。地のすべての基礎は動くであろう。わたしは言った。あなたたちは神々であり、あなたたちはすべて至高者の子たちである。しかし、人たちのように死に、君主の一人のように倒れるであろう。立ち上がれ、神よ、地を裁け。あなたがすべての民の中で相続されるからである」（<a href="https://bibleox.com/ja/jp-ni/ps/82/#L1">詩. 82:1-8</a>）。七十人訳の中ではこう語られています。「見よ、あなたたちは人たちのように死に、君主の一人のように倒れるであろう」——人たちの服従しないこと、すなわちアダムとエバと、君主の一人の倒れ、すなわち蛇と呼ばれたその人——エバを惑わしたことから、大いなる背きに落ちた人——を示すために。しかし、わたしが今詩篇を挙げたのはこのためではなく、あなたたちに証明するためでした。すなわち、聖なる霊は、人たちを、彼らがその方の命令を守るなら、神のように無情で不死になり、その方の子たちという呼び名を授けられるように造られたのに、アダムとエバに似せながら自分自身に死をもたらすことで責めているのです。それなら、この詩篇を、あなたたちの好きなように解釈しなさい。それでも、すべての人たちが神となること、至高者の子たちである力を持つこと、そして各人が自分自身のために裁かれ、処されること——アダムとエバのように——は正当なこととして留まるでしょう。そして、キリストも神と呼ばれていることは、すでにくわしく証明されています。</p><h2>125</h2><p>今、皆さん、わたしは続けました——わたしたちから聞きたいのです。イスラエルという名の中の思想は何でしょうか。彼らは沈黙しました。そこでわたしは付け加えました。わたしは、知っていることを語りましょう。知っていることを黙ることは不当だとわたしは考えるからです。そして、もしかするとあなたたちが知っていて、憎みのゆえに、あるいは無能力のゆえに語りたくないかもしれないという疑いに縛られません。わたしは、すべてを単純に、計算なしに述べます。わたしの主が言われたとおりに。「まいた人は種を蒔きに出て行きました。そして一つの粒は道に落ち、ほかの一つはいばらの中に、ほかの一つは石の多い地に、そしてほかの一つは良い地に落ちました」（<a href="https://bibleox.com/ja/jp-ni/mf/13/#L3">マタ. 13:3-8</a>）。それゆえ、わたしたちは、どこかで良い地を見つけることを望みながら語るべきです。このわたしの主は、強く力ある方だからです。その方の到来において、すべての人たちから自分のものを求められるであろう。そして、その方の経営者を処しません。もしその人が、自分の主が力ある方であり、その方の到来において自分のものを求められることを知りながら、受け取ったすべてのものを増やしたなら、しかし何らかの理由で隠さなかったなら。——それなら、イスラエルという名は、力を征服する人を意味します。なぜなら、「イスラ」は、力を征服する人を意味し、「エル」は力を意味するからです。キリストが人となった後にこれを成し遂げることは、戦いの神秘によって預言されていました。ヤコブが戦った方——父の意志の僕としてだけ現れた方、しかし実際には神、すべての被造物に先立って生まれた子——との戦いの中で。その方が人となられたとき、わたしがすでに言ったとおり、悪魔がその方のもとに来ました。すなわち、蛇とサタンと呼ばれる力。その方を試み、転倒させるために、その方から自分への拝を要求しながら。しかし、キリストはその方を打ち、その方を転倒させました。その方が偽りであること、聖書に逆らって神の拝を要求していること、そして神の意志からの離反者となっていることを責めながら。その方はその人に答えられました。「書かれている。お前の神なる主を拝せよ。そしてその方のみに仕えよ」（<a href="https://bibleox.com/ja/jp-ni/mf/4/#L10">マタ. 4:10</a>）。そして悪魔は、打ち負かされ、責められて、去りました。しかし、わたしたちのキリストは、弱さの中に——すなわち、労苦の中に、苦しみの受け取りの中に——その方が磔にされるはずであったときにいるはずでしたから、その方は、ヤコブの太ももへの接触と、萎えの引き起こしを通して、これについての預言を行いました。しかし、その方の名は初めからイスラエルでした。この名において、その方は至福あるヤコブの名を改めました。自分の名をもってその人を祝福しながら。そして、その方を通して父のもとへと走り寄るすべての人たちが祝福されたイスラエルであることを指し示していました。しかし、あなたたちは、これらのことの中の何も理解せず、理解しようと努めず、完全に救われることを望んでいます。ただあなたたちが、肉の由来によってヤコブの子たちだからという理由で。そして、このことにおいてもあなたたちが自分自身を惑わしていることは、わたしはすでにくわしく証明しました。</p><h2>126</h2><p>——もしあなたたちが、トリュフォンよ、あの大いなる評議会の御使いと呼ばれる方、エゼキヤの中で人間と呼ばれる方、ダニエルの中で人の子に似た方、イザヤの中で若い子、ダビデの中でキリストであり拝されるべき神、多くの人たちの中でキリストであり石、ソロモンの中で知恵、モーセの中でヨセフとユダと星、ゼカリヤの中で日の出、そしてさらにイザヤの中で苦しむ者、ヤコブ、イスラエル、杖、花、隅の石、神の子と呼ばれる方が誰であるかを知っていたなら——その方を褻らなかったでしょう。あの方はすでに来られ、生まれ、苦しみ、天に上がられました。そして再び来られるであろう方。そしてそのとき、あなたたちの十二の部族は泣くであろう。もしあなたたちが預言の言葉を理解していたなら、あの方が神であること、唯一の生まれない語り難い神の子であることを退けなかったでしょう。出エジプト記の書の中の、ある箇所では、モーセによってこう語られています。「主はモーセに語り、その方に言われた。わたしは主である。そしてアブラハムに、イサクに、ヤコブに、その方たちの神として現れた。しかし、わたしの名を彼らに告げ知らせなかった。そしてわたしの契約を彼らと結んだ」（<a href="https://bibleox.com/ja/jp-ni/ish/6/#L2">出. 6:2-4</a>）。そして同じ人がさらに言います。「ヤコブと一人の人とが戦った」と主張しながら、これが神であることを。なぜなら、その人は宣言しています。ヤコブが言ったことを。「わたしは神を顔と顔とで見ました。そしてわたしの命は留まりました」と。またモーセは、神がその人と戦い、現れ、その人を祝福した場所が、その人によって「神の観り」と呼ばれたことも書いています。そして、アブラハムにも、モーセの言葉によれば、マムレの樫の木のもとで神が現れました。その人が昼過ぎに自分の幕屋の入口に座っていたときに。その後、これを語って、モーセは付け加えます。「自分の目で見上げると、見よ、三人の人たちが彼の前に立っていました。そして彼らを見て、その人は彼らを迎えに走りました」。少し後に、そのうちの一人がアブラハムに子を約束しました。「なぜサラは笑ったのか。まことにわたしは生むでしょうか。わたしは年老いたのに。神に不可能な言葉があるのか。その時をもって、わたしは時間をもって帰って来るであろう。そしてサラに子が生まれるであろう」と。その後に、彼らはアブラハムのもとから去ります。そして彼らについてさらにこう語られています。「そこから立ち上がって、人たちはソドムの顔を見つめました」。そして、存在しておられる方、かつておられた方は、さらにアブラハムに語られました。「わたしは、わたしの僕アブラハムから、わたしが行おうとしていることを隠しません」。そしてわたしは、モーセのさらに続く言葉を繰り返しました。すでに挙げ、説明したものです。それらによって——とわたしは語りました——聖書の中で神と呼ばれながら、アブラハムに、イサクに、ヤコブに、ほかの族長たちに現れた方が、父と主に服従し、その方の意志に仕えていることが証明されます。さらにわたしは、以前には語らなかったものを付け加えました。同じように、あなたたちの人たちが肉を食べたいと望み、モーセが、ここで御使いと呼ばれる方を信じなかったとき——その方が、神からの満ち足りを彼らに約束したとき——その方は、父から遣わされた神であり御使いでもありながら、これを語り、行いました。聖書が付け加えているとおりです。「そして主はモーセに言われた。主の腕は足りないのでしょうか。あなたは今知るでしょう。わたしの言葉があなたに成就するかどうか」（<a href="https://bibleox.com/ja/jp-ni/chis/11/#L23">民. 11:23</a>）。そして別のところでは（モーセは）こう語っています。「主はわたしに言われた。あなたは、このヨルダンを渡らないであろう。あなたの主なる神——あなたの前を先導する方——が、民たちをその方自身が滅ぼすであろう」（<a href="https://bibleox.com/ja/jp-ni/vtor/31/#L3">申. 31:3</a>）。</p><h2>127</h2><p>あの律の授け方と預言者たちの、これに類するほかの言葉もあります。わたしの考えるには、わたしは十分に示しました。わたしの神が「神はアブラハムから去りました」と、あるいは「神はモーセに語られた」と、あるいは「主は、人たちの子たちが建てた塔を見るために降りました」と、あるいは「神はノアの箱船を外から閉じた」と語るとき、あなたたちは、生まれない神ご自身が、ある場所から降り、あるいは上がられたと考えるべきではないことを。なぜなら、語り難い父、万物の主は、ある場所に来ません。歩まず、眠らず、立ち上がりません。むしろ、自分の国の中に——それがどんなものであれ——留まっておられます。明確に見て、聞いておられます。目によってでも、耳によってでもなく、語り難い力によって。そうすれば、その方はすべてを見、すべてを知っておられます。そして、わたしたちの誰もその方から隠れていません。その方は動かず、ある場所によっても、世界全体によってさえも測られません。なぜなら、その方は、世界が造られる前に存在しておられたからです。しかし、その方が誰かと語ること、誰かによって見られること、地のわずかな部分に現れることは、どのようにして可能でしょう。あなたたちの民が、シナイの中で、その方から遣わされた方の栄光さえ見ることができなかったのに。そして、モーセ自身が、神の栄光で満たされたときに、自分が整えた幕屋の中に入ることができず、司祭が、ソロモンが自分で建てたエルサレムの家の中に箱船を運び込んだときに、神殿の前に立つ力を持っていなかったのに。それゆえ、アブラハムも、イサクも、ヤコブも、ほかの誰も、父と、万物の語り難い主を一般に、そしてキリストそのものを見ませんでした。しかし、彼らが見たのは、その方の意志によって、神であり、その方の子であり、同時に、その方の意志の奉仕におけるその方の御使いである方です。その方の決定によって、おとめから人となるはずであった方、そしてかつて、モーセとの対話の中で、いばらの木の中で、火さえになられた方。もしこうして聖書を理解しないなら、父と万物の主が天におられなかったことになるでしょう。モーセによって語られたときに。「そして主はソドムの上に、主のもとから天から硫黄と火を送りました」（<a href="https://bibleox.com/ja/jp-ni/gen/19/#L24">創. 19:24</a>）。そしてさらに、ダビデによって語られたときに。「門よ、あなたたちの頭を上げよ。永遠の門よ、あなたたち自身が高く上げられるように。栄光の王が入る」（<a href="https://bibleox.com/ja/jp-ni/ps/24/#L7">詩. 24:7-9</a>）。そして「主はわたしの主に仰せられた。わたしの右の座に座れ。わたしがあなたの敵をあなたの足台とするまで」（<a href="https://bibleox.com/ja/jp-ni/ps/110/#L1">詩. 110:1</a>）。</p><h2>128</h2><p>——キリスト——主であり、本性において神であり、神の子である方——が、その力をもって、以前には人として、御使いとして、さらに、いばらの木の中で火の形さえで現れた方が、ソドムに対する裁きの中にも現れたことは、わたしは先にくわしく証明しました。そしてわたしは、いばらの木の中の観りとイエスという名について、出エジプト記から前に引用したすべてのものを繰り返し、付け加えました。考えてください。わたしがこれをしばしば繰り返すのは、無駄話からではありません。わたしは知っているからです。ある人たちが、わたしの説明を先取りして言いたいのです。あの力——万物の父からモーセに、あるいはアブラハムに、あるいはヤコブに現れた力——は、人たちへの接近のゆえに御使いと呼ばれた。その方を通して父からの命令が人たちに告げ知らせられるからです。栄光とも呼ばれた。時には計り知れない観りの中で現れるからです。あるいは人、そして人間とも呼ばれた。父の意志によってこのような姿を引き受けるからです。そして最後に、言葉とも呼ばれた。父から人たちへと伝えられるものをもたらすからです。しかし、この力は、父から離れず、切り離されないものです。地上における太陽の光が——語られるところによれば——天にある太陽から分かれず、切り離されず、太陽が没するときに、光も一緒に消えるのと同じように。父は、望まれるときには、自分の力が出て行くことを許し、望まれるときには、それを自分自身の中へと引き上げるのです。彼らは言います。同じように、その方は御使いたちをも造られる、と。しかし、証明されています。御使いたちは存在し、常に留まっており、自分たちが生じたものへと再び解かれることはありません。そして、預言の言葉が神とも——これは完全に証明されています——御使いとも呼ぶあの力が、ただ名においてだけで（太陽の光のように）別のものとみなされているのではなく、数において別のものであることについては、わたしはすでに簡潔に論じました。あの力が父から、その方の力と意志によって生まれたことを語ったとき。しかし切り離しによってではなく、あたかも父の本質が、分割され砕かれるすべてのほかの物たちのように分離し、分割の前にあったのと同じもののままでいないかのように。そして例として、わたしは、火からほかの火が点火されるのを見るとき、多くの火を点火し得るあの火が少しも減らず、同じままでいるということを取り上げました。</p><h2>129</h2><p>今、わたしは、これを証明するために挙げた聖書の箇所を繰り返します。「主は天から火を降らせた」と語られるとき、預言の言葉は、数において二人を指し示しています。一人は地の上にいる方。聖書が語るには、その方はソドム人たちの叫びを見るために降りました。もう一人は天に留まっている方。地の上にいた主の主。父として、神として、そして、その方が力あること、主であり神であることの作者として。そして再び、聖書が、初めに神が「見よ、アダムは、わたしたちの中の一人のようになった」と言ったと語るとき、言葉「わたしたちの中の一人のように」も数を指し示しています。しかし、真理を語らず、理解できないソフィストたちが解釈しようと努めるのと同じような、象徴的な説明は許されません。そして知恵の書の中にはこう語られています。「わたしがあなたたちに、毎日起こることを告げ知らせるなら、昔から存在するものを数え上げましょう。主はわたしを、その方の道の始まりとして、その業のために造られました。その方はわたしを、世の前に、初めに、淵を造られる前に、水の源々が生じる前に、山々が堅く据えられる前に基礎づけられました。すべての丘に先立って、その方はわたしを生み出します」（<a href="https://bibleox.com/ja/jp-ni/pr/8/#L22">箴. 8:22-36</a>）。これを語って、わたしは付け加えました。聴衆たちよ、理解しています。注意を払っていたならば、聖書の証しによれば、この子がすべての被造物に先立って父から生まれたこと、そして生まれた方が、生んだ方から数において別のものであることを。すべての人にこれに同意できるでしょう。</p><h2>130</h2><p>彼ら全員が自分の同意を表明したとき、わたしは言いました。しかし、今、わたしは、先に言及しなかったいくつかのほかの箇所を提示したいと考えています。それらは、忠実な僕モーセによって隠された仕方で語られています。「天よ、その方と共に歓びなさい。そして神の御使いたちすべてがその方を拝しますように」。そしてさらに続く言葉を付け加えました。「民よ、その方の民たちと共に歓びなさい。そして神の御使いたちすべてがその方の中で堅くされますように。その方は仕返しを行い、その子たちの血の復讐をするであろう。そしてその方の敵たちに報復し、その方を憎む者たちに返すであろう。そして主は、自分の民の地を清めるであろう」（<a href="https://bibleox.com/ja/jp-ni/vtor/32/#L43">申. 32:43</a>）。これらの言葉の中で、その方は宣言しています。わたしたち——民たち——が、その方の民たちと共に歓びます。すなわち、アブラハムと、イサクと、ヤコブと、預言者たちと、そして一般に、あなたたちの民の中でその方に喜ばれたすべての人たちと共に。先にわたしたちが認めたとおりに。しかし、わたしたちは、あなたたちの民のすべての人たちについてこれを理解すべきではありません。イザヤを通して知っているからです。背いた者たちの部分は、虫と消えることのない火で食い尽くされ、不死のまま留まり、すべての肉に対する見せしめとなるであろうと（<a href="https://bibleox.com/ja/jp-ni/is/66/#L24">イザ. 66:24</a>）。その上で、皆さん——とわたしは語りました——同じモーセの聖書から、ほかのいくつかの箇所をあなたたちに提示したいと考えています。そこから、あなたたちもまた理解できます。神が古く、すべての人たちを民へと、言語へと散らされたこと。そして、すべての民の中から、あなたたちの民——無益な、服従しない、不信仰な民——を自分のために選ばれたこと。そして、イエスの意志に聞き従う民のうちの、あらゆる民からの人たち——その方はその方をヤコブとイスラエルと呼ばれます——が、ヤコブであり、イスラエルであるべきであることを。わたしが先にくわしく語ったとおりに。なぜなら、その方が「民よ、その方の民たちと共に歓びなさい」と語られたとき、同じ遺産を彼らに分離し、同じ呼び名を与えているからです。そして、その方が彼らを民たちと呼ぶとき——その方の民たちと共に歓ぶ民たちと呼ぶとき——これはあなたたちの民への非難として語られているのです。あなたたちが、自分の偶像礼拝によってその方を怒らせたように、その方は偶像礼拝者たち自身を、その方の意志を知り、その方のもとで遺産を受け取ることに値するものとされました。</p><h2>131</h2><p>わたしは、神がすべての民を分割したことを示す言葉を挙げましょう。次のとおりです。「あなたの父に尋ねなさい。そしてその人はあなたに告げ知らせるでしょう。あなたの長老たちに尋ねなさい。そして彼らはあなたに言うでしょう。いつ、至高者が民たちを分割したかを、人の子たちを散らされたときを。そして、イスラエルの子たちの数に従って、民たちの境界を据えられたことを。そして、主の分け前は、その方の民ヤコブとなり、その方の遺産の分け前はイスラエルとなったことを」（<a href="https://bibleox.com/ja/jp-ni/vtor/32/#L8">申. 32:8-9</a>）[15]。これに付け加えました。七十人訳はこう訳しています。「神の御使いたちの数に従って、民たちの境界を据えられた」と。しかし、これによってもわたしの証明は少しも減らないので、わたしは、あなたたちの解釈に従って言葉を挙げました。しかし、もしあなたたちが真理を認めたいなら、同意すべきです。わたしたちは、低められた、辱めで満ちた十字架の神秘を通して召された人たちです。告白と服従と敬虔のために、あなたたちの奉仕のゆえに、悪霊たちと悪魔の軍勢によって、死に至るまで苦しみます。そして、わたしたちを救いへと召したキリストから、父が整えた救いについて、言葉によってでさえ離れないために、これらすべてを耐え抜きます。わたしたちは、神に対する関係において、あなたたちよりも確かです。あなたたち——高い腕と偉大なる栄光の顕現によってエジプトから解放された人たち。そのために海があなたたちのために裂かれ、神が、偉大な力と壮麗な戦車を持ってあなたたちを追った人たちを滅ぼした、その上に、あなたたちのために干上がった道が成り(ました)。そして、その方は海を、あなたたちのために干上がらせたのです。（わたしたちは、あなたたちよりも確かに神に属しています。）あなたたち——光の柱があなたたちを照らしました。そうすれば、あなたたちが、世界の中のほかのどの民とも異なって、自分自身の尽きることのない、没しない光を用いることができました。あなたたちのために神は、天の御使いたちに固有なパンを、すなわちマナを食べるために送りました。あなたたちがパンを焼く必要がないように。そして水はマラの中で甘くされました。あなたたちには、磔にされるはずであった方のしるしも、あなたたちを咬んだ蛇たちの中に与えられました。わたしが先に言ったとおりです。神は、その時期に先立ってあなたたちに神秘を与えたからです。しかし、あなたたちは常にその方に対して感謝しないものとして現れてきました。そして、モーセの広げられた両手の像を通して、そしてイエスという名に改められた人を通して、アマレクと戦った方を通して。この出来事について、神は書物の中に記すようにと命じられ、あなたたちの耳の中にイエスの名を入れました。その方が、アマレクの記憶を地の中から滅ぼすと言われたことと共に。しかし知られています。アマレクの記憶は、ナベの子の死の後にも留まっています。しかし、神は宣言しています。磔にされたイエスを通して——その方のすべての業が、これらの象徴の中で前もって示されていました——悪霊たちが滅ぼされることを。そして、その方の名を恐れることになるであろうこと。そして、すべての支配と王国もまた、その方を恐れることになること。そして、あらゆる民から出た、その方を信じる人たちが、敬虔で平和な人たちとして自分自身を示すこと。トリュフォンよ、これは、先にわたしが語ったことによって証明されます。その上で、あなたたちが肉を食べたいと望んだとき、数えることもできないほどの数のウズラが与えられました。神は岩から水をわたしたちに出しました。雲がわたしたちに従い、暑さから影を与え、寒さから守り、別の新しい天の像を前もって告げ知らせました。あなたたちのもとでは、靴の紐もすり減らず、靴自体も磨耗せず、服も古びませんでした。むしろ、子どもたちの成長と共に伸びさえしました。</p><h2>132</h2><p>あれほどの恵みにもかかわらず、あなたたちは子牛を鋳造し、喜んで、よその娘たちと姦淫し、偶像を拝しました。しかも、あなたたちが、あのイエスという名を与えられた人によって、太陽が止まり、ほとんど三十時間のあいだ没しなかったのを見たあれほどの力をもって、地があなたたちに与えられた後のことです。そして、あなたたちのためになされたほかのすべての奇跡を、その時期に見たのです。その中の一つについて、今、言及することが必要だとわたしは考えます。なぜなら、それは、あなたたちがそこから、イエス——わたしたちがキリストとして認める方、神の子——を知ることに導くからです。磔にされ、生き返り、天に上がり、再び来られる方。アダムから始まる、一般にすべての人たちを裁くために。それなら、知りなさい——とわたしは語りました——アシトの都の敵たちが、証しの幕屋を奪い、恐るべき不治の傷に打たれたとき、彼らは、それを、最近出産した雌牛たちが引く戦車の上に載せることに決めました。彼らが、幕屋のゆえに神の力によって打たれたのかどうか、そして神が、それが奪われた場所へとそれを返すことを望まれるかどうかを知ろうとして。そして彼らがこれを行ったとき、雌牛たちは、誰にも導かれずに、幕屋が奪われた場所には向かいませんでした。むしろ、ある人の畑の上へと向かいました。アウシと呼ばれる人の場所へ。前に語られたとおり、イエスという名に改められたあの人と同名の人——人たちを地の中へと導き入れ、彼らの間でそれを分割した人——。雌牛たちがこの畑に来たとき、立ち止まりました。これによっても、あなたたちに示されています。彼らが、力ある名によって導かれたことを。ちょうど、以前、エジプトから出た人たちの中から残った民が、イエスという名を受け取った人——その前にはアウシと呼ばれていた人——によって地の中へと導き入れられたのと同じように。</p><h2>133</h2><p>しかし、あれほどの、そしてそれに類するすべての非日常的な奇跡があなたたちのために行われ、あなたたちがその時期に見たにもかかわらず、あなたたちは預言者たちによって、自分の子どもたちを霊たちへの献げ物としたことさえで責められています。そして、その上で、キリストに立ち上がる勇気を持ったこと、そして今も立ち上がっていること。これらすべての中で、神とそのキリストからの憐みの中であなたたちに救いがありますように。神は、あなたたちのこのような業を前もって見て、預言者イザヤを通してあなたたちをこのように呪われました。「彼らの魂に災いあれ。彼らは自分自身にたいして悪い企てを計りました。言う。正しい方を縛りつけよう。その方はわたしたちにとって無益だから、と。このことのゆえに、彼らは自分の業の実を食べる。不敬虔な人に災いあれ。悪いことがその手の業に応じてその人を襲うであろう。わたしの民よ、あなたたちの圧迫者たちはあなたたちを奪い、取り立てる者たちはあなたたちの上に支配するであろう。わたしの民よ、あなたたちを祝福する人たちがあなたたちを惑わし、あなたたちの道の歩みを乱しています。しかし今、主は自分の民を裁きの中に立て、主ご自身が、民の長老たちと、その君主たちと共に、裁きの中に来られるであろう。なぜあなたたちはわたしの葡萄園を焼き、貧しい人から奪ったものを自分の家の中に置くのですか。なぜあなたたちはわたしの民を圧迫し、柔和な人たちの顔を辱めるのですか」（<a href="https://bibleox.com/ja/jp-ni/is/3/#L10">イザ. 3:10-11</a>、<a href="https://bibleox.com/ja/jp-ni/is/3/#L12">イザ. 3:12-15</a>、<a href="https://bibleox.com/ja/jp-ni/prs/2/#L12">知. 2:12</a>）。そして別のところで、同じ預言者が、同じ目的のためにこう言いました。「災いあれ、罪を長い縄のように引きずり、不義を小牛の轡の皮紐のように引きずる人たちに。彼らは言う。急いで、その方の裁きが近づき、イスラエルの聖なる方の企てが来るように。そうすれば、その方を知るであろう、と。災いあれ、悪を善と言い、善を悪と言う人たちに。闇を光と言い、光を闇と言う人たちに。苦いものを甘いと言い、甘いものを苦いと言う人たちに。災いあれ、自分自身の中で分別ある人たち、自分の目の中で智慧ある人たちに。災いあれ、あなたたちの強い者たちに。酒を飲む人たち、力のものを混ぜる英雄たちに。贈り物のゆえに不敬虔な人を義とし、正しい人からその正義を取り去る人たちに。このことのゆえに、藁が燃える石炭から焼かれ、燃え立つ火の焔から消えるように、その根は腐ったもののようになり、その花は塵のようになるであろう。なぜなら、彼らが、万軍の主の律法を望まなかったからです。しかし、彼らは、イスラエルの聖なる方、主の言葉を怒らせました。そして万軍の主は怒りをもって満たされ、その方の手を彼らの上に置かれました。そしてその方たちは打たれ、山々について怒られました。そして彼らの死体は、広場の真ん中で、糞のようになりました。しかしこれらすべての中で、その方は背かれませんでした。しかし、その手はいっそう高く上げられています」（<a href="https://bibleox.com/ja/jp-ni/is/5/#L18">イザ. 5:18-25</a>）。実際、あなたたちの手は、悪を行うために高く上げられています。なぜなら、あなたたちは、キリストを殺したのに、まだ悔い改めていません。むしろ、わたしたちを憎んでいます——その方を通して、万物の父なる神を信じたわたしたちを——そして、権威を持つときには、殺しています。あなたたちは、絶えず、その方を、そしてその方から出た人たちを呪しています。わたしたちは、すべての人たちのために、そして一般にすべての人間のために祈っているにもかかわらず。わたしたちの主であり教師であるキリストが、これを行うようにとわたしたちに教えたのですから。その方は、わたしたちに、敵たちのためにも祈ること、わたしたちを憎む人たちを愛すること、わたしたちを呪う人たちを祝福することを命じられたのです。</p><h2>134</h2><p>それゆえ、もしあなたたちが、預言者たちの教えと、神そのものによって辱められるなら、無分別で盲のあなたたちの師たちに従うよりも、神に従うほうが、あなたたちにとって良いことだったでしょう。彼らは、あなたたちが今も各人四人、あるいは五人の妻を持つことを許しているのですから。そして、あなたたちの中の誰かが美しい女を見て、その女を持ちたいと望むとき、彼らは、ヤコブとほかの族長たちの業を語り、彼らに似たことを行う人たちが少しも罪を犯さないと主張します。彼らは、この点において不幸であり無分別です。なぜなら、わたしが先に言ったとおり、彼らのそのような業の各々の中で、偉大な神秘の経営が成し遂げられていたのですから。わたしは、ヤコブの結婚の中にあった経営と預言を語りましょう。そうすれば、あなたたちもここから知るでしょう。あなたたちの師たちが常に見てきたのは、神聖な意志——それぞれの業が成し遂げられた神聖な意志——ではなく、むしろ地上的な、破壊的な情欲であったことを。それなら、わたしが語ることに注意を払いなさい。ヤコブの結婚は、キリストを通して成し遂げられるはずであったものの像でした。ヤコブが、二人の姉妹に同時に娶ることは許されませんでした。それゆえ、彼は、ラバンに、その娘たちのために仕え、若いほうで欺かれ、さらに七年仕えました。レアは、あなたたちの民と会堂です。ラケルは、あなたたちの教会です。キリストは、今日まで、その女たちとその僕たちの両方のために仕えています。ノアが、三人目の子の子孫を、二人の子たちの奴隷としたなら、今キリストは、自由な子たちと彼らの奴隷たちの復元のために来られました。その方の命令を守るすべての人たちを、ヤコブのもとに自由な女たちから生まれた子たちと、女奴隷たちから生まれた子たちがすべて同等の名誉の子たちであったのと同じように、同じ権利に値するものとして認めながら。そして彼らの順序に従って、将来を見ることによって、その人たちの各人がどのようなものであるかが預言されました。ヤコブは、まだらで多様な家畜のためにラバンに仕えました。そしてキリストは、あらゆる民から出た多様な人たちのために、十字架への奴隷さえ耐えられました。自分の血と十字架の神秘によって彼らを取得しながら。レアの目は弱く、あなたたちの魂の目は非常に弱いです。ラケルは、ラバンの神々を盗み、今日までそれらを隠しました。そして、わたしたちの父祖的な、物質的な神々は、わたしたちのために滅びました。ヤコブは、全時間、自分の兄弟によって憎まれていました。そしてわたしたちは今、そしてわたしたちの主ご自身も、あなたたちとほかのすべての人たちによって憎まれています。わたしたちは皆、本性において兄弟であるのに。ヤコブはイスラエルと呼ばれました。そしてキリストは、名において、そして事柄の本質においてイエスである方が、証明されたとおり、イスラエルでもあります。</p><h2>135</h2><p>そして、聖書が「わたしは主なる神、イスラエルの聖なる方、あなたたちの王としてイスラエルを示された方です」と語るとき——とわたしは続けました——あなたたちは真に、キリストを永遠の王として理解すべきではないでしょうか。あなたたちは知っています。イサクの子ヤコブは、決して王ではありませんでした。それゆえ、聖書は、ヤコブとイスラエルの王の下で何を考えているかを、わたしたちに説明しながら、こう語ります。「ヤコブ、わたしの僕。わたしはその方を支えるであろう。イスラエル、わたしの選んだ者。わたしの魂はその方を受け入れる。わたしは、わたしの霊をその方の上に置きました。そしてその方は民たちに裁きを出すであろう。その方は叫ばず、その方の声は外で聞かれないであろう。折れた葦をその方は折らず、燃えて煙を出す亜麻を消さず、その方が勝利を持ち出し、裁きを出すまで。そして、その方が地の上に裁きを据えるまで、挫けないであろう。そして、その方の名に民たちは望みを置くであろう」（<a href="https://bibleox.com/ja/jp-ni/is/41/#L8">イザ. 41:8-9</a>、<a href="https://bibleox.com/ja/jp-ni/is/42/#L1">イザ. 42:1-4</a>）。族長ヤコブにではなく、キリストに、異邦人たちが、そしてあなたたち自身さえも望みを置くのでしょうか。それゆえ、聖書がキリストをイスラエルとヤコブと呼ぶように、わたしたちも——キリストの胎から、あたかも切り離されたかのように——真のイスラエルの家系を成しています。しかし、むしろ、聖書の言葉そのものを聞きましょう。「そして、その方は言います。わたしは、ヤコブから、そしてユダから種子を引き出すであろう。そしてそれは、わたしの聖なる山を相続するであろう。そしてわたしの選んだ者たちと、わたしの僕たちはそれを相続し、そこに住むであろう。そして森の中には群れのための囲いがあろう。そしてアコルの谷は、わたしを求めた人たちにとって、家畜のための休みの場所となるであろう。しかし、わたしを捨て、わたしの聖なる山を忘れ、霊たちのために卓を整え、霊への献酒の杯を満たすあなたたちは、わたしはあなたたちを剣に委ねるであろう。あなたたちはすべて殺戮から倒れるでしょう。なぜなら、わたしは呼び求めたのに、あなたたちは聞かなかった。わたしは語ったのに、あなたたちは注意を払わなかった。そしてわたしの前で悪を行い、わたしが望まなかったものを選んだからである」（<a href="https://bibleox.com/ja/jp-ni/is/65/#L9">イザ. 65:9-12</a>）。これらが聖書の言葉です。そして、あなたたちはもちろん自分自身で理解しています。ヤコブからのある別の種子があることを、今語られていることです。そして、誰も、ここであなたたちの民について語られているとは考えないでしょう。ヤコブの子孫が、ヤコブの種子のための始まりを捨てることは不可能だからです。そして、遺産に値しない民として責めた方の後に、その方に同意するかのように、その同じ民にこれを約束するのは不可能だからです。しかし、あそこで預言者が語るとおりに——「そして今、ヤコブの家よ、来よう。主の光のうちに歩もう。なぜなら、その方は自分の民、ヤコブの家を捨てたからである。なぜなら、その方の地は、初めのように、占いと前もっての告げ知らせで満たされたからである」（<a href="https://bibleox.com/ja/jp-ni/is/2/#L5">イザ. 2:5-6</a>）——ここでも、わたしたちは、ユダの二つの種子と二つの家系を理解すべきです。二つのヤコブの家のように。一つは血と肉から生まれ、もう一つは信仰と霊から。</p><h2>136</h2><p>あなたたちは見ます、その方が今、民に語っておられることを。言われた後に——「葡萄の房の上の果粒が見出され、言うであろう。それを損なうな。なぜなら、その上に祝福があるから、と。わたしの僕のためにそのようにするであろう。その方のために、彼らすべてを滅ぼさないであろう」と（<a href="https://bibleox.com/ja/jp-ni/is/65/#L8">イザ. 65:8-9</a>）——その方は付け加えられます。「そしてわたしは、ヤコブから、そしてユダから種子を生み出すであろう」と。明らかに、その方が、その民の上に怒り、彼らの中のごくわずかな数さえ捨てると脅しながら、ほかのある人たちを生み出すことを約束されています。その方は、その方の山の上で住むであろう人たちです。その方について、その方が彼らを蒔き、生み出すと言われたものです。しかし、あなたたちは、その方があなたたちを召すときに、その方を耐えません。その方が語るときに、聞きません。むしろ、主の前で悪を成し遂げさえしました。あなたたちの悪の最も極端な測定は、あの正しい方を憎むことです。あなたたちが殺した方を、そして、その方から自分のありようとなった人たち——敬虔な、正しい、人間愛に満ちた人たち——を憎むことです。それゆえ、「彼らの魂に災いあれ、と主は言われる。なぜなら、彼らは自分自身にたいして悪い企てを計った。言う。正しい方を殺そう。その方はわたしたちにとって無益だから、と」（<a href="https://bibleox.com/ja/jp-ni/is/3/#L10">イザ. 3:10-11</a>、<a href="https://bibleox.com/ja/jp-ni/prs/2/#L12">知. 2:12</a>）。あなたたちは、あなたたちの父たちがそうしたように、バアルへの献げ物を献げませんでした。林の中に、あるいは高い場所で、天の軍勢に献げる煮るものを献げませんでした。しかし、あなたたちは、キリストなる神を受け入れませんでした。なぜなら、その方を知らない人は、神の意志も知らないからです。そして、その方を辱め憎む人は、その方を遣わされた方をも憎み辱めています。そして、その方を信じない人は、預言者たちの告げ知らせを信じていません。彼らは、その方についてすべての人たちに告げ知らせました。</p><h2>137</h2><p>語らないでください、皆さん——とわたしは言いました——あの磔にされた方について悪いことを。そしてその方の傷について褻らないでください。それらによって、すべての人たちは、わたしたちがいやされたように、いやされ得るのですから。もしあなたたちが聖書を信じ、あなたたちのかたくなさの割礼を受け入れるなら、素晴らしいことでしょう。あなたたちが持っている割礼ではありません。あなたたちの中に堅められた意見に従うもの。なぜなら、あなたたちの割礼は、印として与えられたのであって、義の業としてではなかったからです。このことについて聖書がわたしたちを説いています。わたしたちと同意し、神の子について悪戯せず、あなたたちの師たち、パリサイ人たちに従いながら、イスラエルの王について、あなたたちの会堂の長官たちが祈りの後にするようにとあなたたちに教えているように、褻らないでください。なぜなら、神に喜ばれない人たちに触れる人が、あたかも神の瞳のひとみに触れるなら、まして、その方の愛された方に触れる人は、どれほどでしょうか。そして、この方がわたしたちのキリストであることは、十分に証明されています。</p><p>彼らが沈黙したとき、わたしは語り続けました。——今、皆さん、わたしは聖書の中のいくつかの箇所を、七十人訳がそれらを訳したとおりに挙げます。先に、あなたたちがそれらを読むとおりに挙げたとき、わたしは、あなたたちの心のありようを試そうと考えました。こう語る聖書の箇所を挙げながら——「彼らに災いあれ、なぜなら彼らは自分自身にたいして悪い企てを計った。言う」と——わたしは、七十人訳に従って「わたしたちは正しい方を滅ぼそう。その方はわたしたちにとって無益だから」と付け加えました。しかし、対話の初めには、これを、あなたたちが読みたいと望むように挙げました。「わたしたちは正しい方を縛りつけよう。その方はわたしたちにとって無益だから」と。しかし、あなたたちは何かに取り組んでいて、わたしの言葉に注意を払っていなかったようです。今は日が終わりに近づいています。太陽はすでに西にありますから、語られたことに一つの注意を付け加え、結びましょう。すでに語ったことではありますが、わたしは、再びこれに向かうことを正当だと考えます。[16]</p><h2>138</h2><p>——皆さん、知っています——とわたしは言いました——イザヤの中で神がエルサレムに言われたことを。「ノアの洪水のときに、わたしはあなたを救った」と（<a href="https://bibleox.com/ja/jp-ni/is/54/#L9">イザ. 54:9</a>）[17]。神のこれらの言葉は、洪水の中に、救われる人たちの神秘があったことを意味しています。なぜなら、正しいノアは、洪水の中で、ほかの人たちと共に——すなわち、自分の妻と、三人の子たちと、彼らの妻たちと——八人の数を成していました。わたしたちのキリストが、死者の中から立ち上がって現れたあの日の象徴でした。その日は、数において第八日ですが、力において常に第一です。キリスト——すべての被造物の中の初生の子——は、水と信仰によって、その方によって再生された新しい種族の始まりともなりました。そして十字架の神秘を含む木によって。ちょうど、ノアが自分の家族と共に水の上に浮かびながら、木の上で救われたのと同じように。それゆえ、預言者が「ノアの日に、わたしはあなたを救った」と語るとき、神は、ここで、同じようにその方に忠実であり、これらの象徴を持っている民に語っておられるのです。わたしが注目したとおり。そしてモーセも、自分の手の中の杖をもって、あなたたちの民を海の中へと導きました。しかし、あなたたちは、これがあなたたちの民だけについて、あるいは地について語られていると考えます。しかし、聖書は語っています。全地が水に浸され、水が山々の上に十五の肘の高さに上がったことを。そうすれば、明らかに、神は、あなたたちの地についてではなく、その方に聞き従う民についてこれを語っておられました。その方のために、エルサレムの中に安らぎを整えられた民のために。洪水の中のすべての象徴によって先に示されたとおりに。わたしは意味しています。水と信仰と木を通して、整えられ、自分の罪の中で悔い改める人たちが、来る神の裁きを避けるであろうことを。</p><h2>139</h2><p>そして、あなたたちが知らないもう一つの神秘も、ノアの時代の出来事によって前もって告げ知らせられていました。それは次のことです。ノアが自分の二人の子たちを祝福した祝福の中で、自分の孫の上に呪いを語りました。なぜなら、預言の霊は、神がほかの子たちと共に祝福したあの子を呪うことを望まなかったからです。しかし、罪への刑罰は、（父の）裸を笑った子の世代全体へと移るはずでしたから、その人は、その子から始めて、呪いを成し遂げました。しかし、ノアが語ったことの中で、その人は、シムの子孫がカナンの所有物と住居を所有すること、そしてその後に、ヤペトの子孫がシム人たちの所有物と住居を自分のものとすることを預言しました。後者は、カナン人たちから奪ったものです。シムの子孫を奪いながら。シム人たち自身が、カナンの部族からそれらを奪ったように。そして、これがどれほど正確に成就したかを聞きなさい。あなたたちは——シムの部族から出た人たち——神の決定によって、カナンの子たちの地へと行き、それを所有しました。そして知られています。ヤペトの子孫たちが今度は、神の裁きによってあなたたちに攻めかかり、あなたたちの地を取りました。そしてそれを所有しています。これについてこう語られています。「そしてノアは酒から酔いから覚め、自分の若い子がその方に対して行ったことを知り、言いました。カナンは呪われる。奴隷であり、その人の兄弟たちの奴隷となるであろう、と。そしてその人は言いました。シムの神、主は祝福されている。そしてカナンはその方の奴隷となるであろう。神はヤペトを広げ、その人はシムの住居の中に住むであろう。そしてカナンはその方の奴隷となるであろう」（<a href="https://bibleox.com/ja/jp-ni/gen/9/#L24">創. 9:24-27</a>）。それゆえ、二つの民が祝福されました。シムの子たちとヤペトの子たち。そしてまず、シムの子たちには、カナンの住居を所有することが定められました。そしてそこから、同じ所有は、預言に従って、今度はヤペトの子たちが受け取るはずでした。そして一つの民、カナンの民が、あの二つの民に奴隷として委ねられたように、キリストは、全能の父から与えられた権威をもって来られました。人たちを、友好と祝福と悔い改めと共同の生へと召しながら。そして、示されたとおり、彼らに、聖なる人たちの同じ地の中にあるはずの所有を約束しました。それゆえ、あらゆる国々からの人たち——奴隷であれ、自由人であれ——キリストを信じ、その方の言葉の中に、そしてその方の預言者たちの言葉の中に真理を認めるなら、知っています。あの地の中でその方と共にいること、そして永遠の朽ちない遺産を受け取ること。</p><h2>140</h2><p>それゆえ、ヤコブ——その人自身が、わたしが言ったように、キリストの像でした——は、自分の二人の自由な妻たちの二人の女奴隷たちと交わり、彼女たちから子たちをもうけました。キリストが、ヤペトの部族の中にいる、カナンのすべての子孫たちを受け入れ、自由な子たちと同等に、彼らすべてを子として、相続人として持つことを前もって示すためです。わたしたちはまさにそのような人たちです。しかし、あなたたちはこれを理解することができません。あなたたちは、神の生きた水から飲むことができず、「水を留めることのできない壊れた溜め池」から飲むからです（<a href="https://bibleox.com/ja/jp-ni/ier/2/#L13">エレ. 2:13</a>）。聖書が語るとおりに。そして、あなたたちのために、これらの壊れた、水を留めない溜め池を掘ったのは、あなたたちの教師たちです。彼らは、聖書が明確に語るとおり、「人間の命令と教えを教えています」（<a href="https://bibleox.com/ja/jp-ni/is/29/#L13">イザ. 29:13</a>）。そしてそのうえで、彼らは、自分自身をも、あなたたちをも惑わしています。肉においてアブラハムの種子から出た人たちが——たとえ罪人で不信仰で神に服従しない人たちであっても——疑いなくその方の永遠の王国を与えられると考えながら。その不当性は、聖書そのものによって証明されています。そうでなければ、イザヤはこう語らなかったでしょう。「そして、もし万軍の主がわたしたちに種子を残してくださらなかったなら、わたしたちはソドムとゴモラのようになっていたでしょう」（<a href="https://bibleox.com/ja/jp-ni/is/1/#L9">イザ. 1:9</a>）。そしてエゼキヤ「ノアとヤコブとダニエルが、自分の子たちあるいは娘たちのために願い出るなら、彼らに与えられないであろう。しかし、父は子のゆえに滅びず、子は父のゆえに滅びません。しかし、各人は自分自身の罪のゆえに滅び、各人は自分自身の正しい業によって救われます」（<a href="https://bibleox.com/ja/jp-ni/iez/14/#L14">エゼ. 14:14</a>、<a href="https://bibleox.com/ja/jp-ni/iez/18/#L20">エゼ. 18:20</a>）。そしてイザヤはさらにこう言います。「彼らは、わたしに逆らった人たちの部分を見るであろう。彼らの虫は眠らず、彼らの火は消えないであろう。そして彼らは、すべての肉に対する見せしめとなるであろう」（<a href="https://bibleox.com/ja/jp-ni/is/66/#L24">イザ. 66:24</a>）。そして、わたしたちの主は、その方を遣わされた父と万物の主の意志によって、こう言わないでしょう。「東からも西からも来るであろう。そしてアブラハムと、イサクと、ヤコブと共に、天の御国の中で座に着く。しかし御国の子たちは外の暗さの中へと追い出されるであろう」（<a href="https://bibleox.com/ja/jp-ni/mf/8/#L11">マタ. 8:11-12</a>）。しかしながら、わたしがすでに証明したとおり、悪いものとして前もって知られ、そのようなものとなる人たち——御使いたちと人間たち——は、神の罪のゆえにではなく、各人の自分自身の罪のゆえに不敬虔となるのです。その人が現れるとおりのものとして。</p><h2>141</h2><p>しかし、あなたたちが言うことのできる言い訳を持たないように——キリストは必ず磔にされるはずであったとか、あなたたちの民の中に背く者がいるはずであったとか、そうでなければ起こり得なかったとか——わたしは簡潔に語りました。神は、御使いたちと人間たちが、その方の意志に聞き従うことを望まれ、彼らを、正義を行うための自由な力をもって、そして、自分たちが誰によって造られたかを、そして、以前には存在しなかった彼らが、誰を通して存在するかを知るための理性をもって造られることを望まれました。そして、彼らが正しい理性に逆らって行動するときに、その方によって裁かれるようにとの律法をもって。そして、わたしたち自身の罪のゆえに、わたしたちは——人間たちも、御使いたちも——悔い改めることに急がなければ、罪のゆえに責められるでしょう。しかし、もし神の言葉が預言するなら——ある人たち、人間たちと御使いたちが、罰されることを——これは、神が、彼らが間違いなく不敬虔になることを前もって知っておられたからです。その方が彼らをそのように造られたからではありません。それゆえ、望むすべての人たちは、悔い改めるなら、神から憐みを受け取ることができます。そして、聖書は彼らを至福ある者たちと呼んでいます。「至福なことです。主がその人のために罪をみなされない人にとっては」（<a href="https://bibleox.com/ja/jp-ni/ps/32/#L2">詩. 32:2</a>）と。すなわち、自分の罪の中で悔いる人は、神からその赦しを受け取るでしょう。しかし、あなたたちが自分自身を惑わしているのと同じようにではありません。そしてこの点であなたたちに似たほかの何人かの人たちも。彼らは言います。わたしたちは罪人ではあるが、神を知っている。そして主は、わたしたちのために罪をみなさないだろう、と。このことの証明として、わたしたちは、ダビデの、自分の高慢から生じた、ある背きを持っています。それは、後に赦されました。あの人が泣き、書かれているとおりに悲しんだときに。そして、もしそのような人に、悔い改めの前に赦しが与えられなかったなら、しかし、あの偉大な王、油注がれた者、預言者が、あれほど泣き、あれほど振る舞ったときだけに与えられたなら、穢れた、極めて背きに満ちた人たちが、悲しみ泣くことなく、悔い改めないなら、主がその人たちのために罪をみなさないと望むことは、どのようにして可能でしょうか。そして、ウリヤの妻と共にあったダビデのこの一つの背きは、皆さん——とわたしは語りました——族長たちが、不倫のために多くの妻たちを持っていたのではなく、彼らを通して、ある経営と神秘が成し遂げられていたことを証明しています。なぜなら、もしどのような人でも、自分の望む妻を娶ることが許されていたなら、自分がどのように、そしていくつの妻を持ちたいと望むように——あなたたちの同国人たちが全世界で行っているように。彼らがどこに到着しても、あるいは赴くときに、結婚という名の下に女たちを連れて行きながら——そのときは、ましてダビデに許されていたでしょう。</p><p>これを語って、親愛なるマルクス・ポンペイウスよ、わたしは語ることを止めました。</p><h2>142</h2><p>しばらく沈黙した後に、トリュフォンは言いました。あなたたちは見ます。わたしたちは、これらの主題についての対話に意図的に入ったのではありません。そして、わたしは告白します。わたしは、わたしたちの出会いを極めて喜んでいます。そして、わたしのこの友人たちも同じことを感じていると思います。なぜなら、わたしたちは、期待したものよりも多くのものを見出したからです。そして、かつて期待し得たものよりも。しかし、もしこれをより頻繁に行うことができたなら、さらに多くの益を受け取ることになるでしょう。まさにこれらの言葉（聖書）を探究しながら。しかし——とその人は言いました——あなたがわたしたちのもとを去ろうとしていて、日々、船を待っているので、ここから出発するときに、あなたの友人たちとしてわたしたちを覚えていることを労と考えないでください。</p><p>——わたしの側では——とわたしは答えました——もしここに留まっていたなら、日々、同じことをすることを望んだでしょう。しかし今、神の意志と助けによって、船に乗ることを念頭に置いて、わたしは、あなたたちに勧めます。この偉大な業へと立ち帰りなさい。あなたたち自身の救いのために。そして、全能の神のキリストを、あなたたちの教師たちよりも優先するように配慮しなさい。</p><p>この後に、彼らはわたしのもとを去りました。旅行の危険とあらゆる災いから、わたしの救いのために祈りながら。そして、わたしは、彼らのために祈り、言いました。わたしは、あなたたちにこれ以上の善いものを望むことができません。この道において、すべての人に知恵が与えられることを知りながら、わたしたちと共に、疑いなく、わたしたちのイエスが神のキリストであると信じることを。</p>
    references: |-
      <ol><li><p>「刺し貫かれた方を見る」の語そのものはゼカリヤ12:10に由来しますが、イウスティノスはこれをホセとダニエルの預言の枠の中で引用しています（雲に乗って来る人の子＝ダニエル7:13；帰りを呼び招く言葉＝ホセ3:5）。</p></li><li><p>「正しい人を縛りつけよう。彼はわたしたちの役に立たないから」の語は知恵の書2:12に由来し、イウスティノスはここでイザヤの言葉として引用しています（「災いあれ、不敬虔な人に…」の結びはイザヤ3:11です）。</p></li><li><p>「再び石の小刀で割礼せよ」はヨシュア5:2の言葉です（荒野の世代の後に新しい世代に施された割礼）。イウスティノスはこれを「石の小刀」＝キリストの言葉による割礼の預型として読んでいます。</p></li><li><p>「神を恐れる人たち、エルサレムの善を見たい人たちと共に」「戦争に包囲されないエルサレムにすべての民が集まろう」の語は、七十人訳イザヤ2:2-3の語句を合わせたイウスティノスの引用で、本文のままでは正確に特定できません。</p></li><li><p>「分裂と異端が起こるであろう」は、コリントの教会への手紙 第一11:19の言葉（「なおざりにできない分裂があなたがたの間にあるのは当然です」）を、イウスティノスの言葉で表現したものです。</p></li><li><p>この言葉は七十人訳エゼキヤ18:30（「わたしは各人を、その道に従って裁く」）に由来する言い方で、イウスティノスはこれを主の言葉として提示しています。</p></li><li><p>この箇所の七十人訳は「主は隠された御手をもってアマレクに対して戦われる」と読みます。新共同訳（ヘブライ語本文による）では「主は御玉座に手をかかげ」と訳しています。</p></li><li><p>この引用は七十人訳の箴言8:22-36を基礎としますが、冒頭や一部の語句が本文とは異なります。イウスティノスはここで知恵を、父から生まれたロゴスとして読みます。</p></li><li><p>トリュフォンが語る「若い女」はヘブライ語本文の読み（אַלְמָה）です。七十人訳はここを「おとめ」と訳し、イウスティノスはこの訳に従います。</p></li><li><p>この引用は、ラテン語写本にのみ伝わる『エズラ第二書』（4エズラ）第1章によるもので、七十人訳の本文にはありません。</p></li><li><p>この言葉は七十人訳エレミヤ38:16に由来する付加ですが（ヘブライ語本文では31:16に相当）、新共同訳の本文にはありません。ユスティノスは七十人訳の伝統に従っています。</p></li><li><p>「主は木の上から王となられた」の「木の上から」は、七十人訳の伝統による付加で（ラテン教会の伝承でも保持されました）、ヘブライ語本文と新共同訳にはありません。ユスティノスはこれを十字架の受難の予告として読んでいます。</p></li><li><p>この引用は七十人訳イザヤの変体によります。本文の箇所の同定は学説が分かれます。</p></li><li><p>この引用の箇所は、イウスティノスの引用伝承によるもので、批評版では正確に同定できません（イザヤ54章の前後に基づくと考えられます）。</p></li><li><p>七十人訳は「神の御使いたちの数に従って」と訳しています（ヘブライ語本文は「イスラエルの子たちの数に従って」）。ユスティノスはここで両方の読みに言及しています。</p></li><li><p>ユスティノスは、対話の初めでトリュフォンの読み（「縛りつけよう」＝知恵の書2:12の語句）に従って引用し、ここでは七十人訳イザヤ3:10の読み（「滅ぼそう」）を示しています。両方の読みを意図的に並べています。</p></li><li><p>この言葉はイザヤ54:9の七十人訳の文脈によるイウスティノスの要約です（「ノアの洪水のときのように…」）。</p></li></ol><p>翻訳：ロジオン・ヴラソフ（AIツールを併用）。底本：ギリシア語原文（M. マルコヴィッチ校訂版による章立て；この作品は本サイトにギリシア語原文ページがなく、外部の校訂版に従います）。訳出にあたっては本サイトのロシア語版と英語版（ANF）を参照しました。聖書の引用はユスティノス自身の用いた語句（おおむね七十人訳）に従って訳し、新共同訳と異なる箇所は注で説明します。引用箇所のリンクは新共同訳の当該箇所を指します。</p>
