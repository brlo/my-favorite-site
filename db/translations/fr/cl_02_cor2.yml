    title: Deuxième épître aux Corinthiens
    meta_desc: Deuxième épître aux Corinthiens — traduction française
    menu: { parent: Épîtres, title: Aux Corinthiens II, priority: 2 }
    body: |-
      <p>Nous n’avons pas cette épître dans son entier. Quelques savants l’attribuent au pape saint Clément. Leur opinion se fonde sur une grande ressemblance de style et de pensées avec la lettre que nous avons reproduite de ce saint pape. Mais Eusèbe et saint Jérôme ne partagent pas ce sentiment. Ils disent qu’elle n’est point citée par les anciens comme cette lettre dont nous venons de parler, et qu’elle n’a jamais fait autorité dans l’Église. En examinant les raisons qui attaquent et qui défendent son authenticité, on n’en trouve pas d’assez déterminantes pour l’attribuer à saint Clément, pape.</p><p>Nous la rangerons donc aussi parmi les écrits dont les auteurs ne sont pas connus, mais qui méritent d’être distingués des ouvrages apocryphes ou supposés. Cette épître en effet respire la plus saine doctrine, et doit, à ce titre, faire partie de la chaîne de la tradition. Indépendamment de ce mérite, elle est d’une grâce et d’une simplicité remarquables. On y trouve de grandes leçons noblement exprimées. Photius la juge très-propre à inspirer l’amour d’une vie sainte et digne de Dieu.</p><p>Le principal but de l’auteur est d’exhorter ceux à qui il écrit de se convertir. Il le fait en leur représentant la reconnaissance qu’ils doivent à Dieu et à Jésus-Christ, son fils, de les avoir appelés à l’Évangile. Il dit que cette reconnaissance ne consiste pas seulement à le confesser de bouche, mais à faire des œuvres qui lui soient agréables ; que la vie de l’homme se partage en deux temps, le présent et le futur ; que le temps présent est celui des combats auxquels il faut se préparer comme un vaillant athlète ; que c’est le temps destiné à faire pénitence et propre à prévenir les maux qui attendent le pécheur dans le siècle futur, d’autant plus que le jour du Seigneur est incertain. Sans rompre la suite des idées, nous avons reproduit tout ce que cette épître offre de plus instructif et de plus éloquent.</p><h2>SECONDE ÉPÎTRE AUX CORINTHIENS.</h2><p>Mes frères, les sentiments que nous avons sur Dieu nous devons les avoir sur Jésus-Christ, et le regarder comme le juge des vivants et des morts.</p><p>Ne pensons pas autrement de l’auteur de notre salut. Si nous n’avions pas de lui ces hautes idées, nous n’aurions pas non plus à espérer de grandes récompenses. Si nous prêtons l’oreille à ceux qui le rabaissent, nous nous rendons coupables et nous ne savons plus de quelle misère nous avons été tirés, ni de quelle manière, ni par qui, ni à quel degré de gloire nous sommes appelés, et tout ce que Jésus-Christ a daigné souffrir pour nous.</p><p>Comment nous acquitter envers lui ? Il a fait briller sur nous sa lumière ; comme un père il nous a appelés ses enfants ; il nous a sauvés lorsque nous allions périr. Quel était l’égarement de notre esprit ! Nous adorions la pierre, le bois, l’or, l’argent, l’airain, les ouvrages de l’homme. Notre vie était-elle autre chose qu’une mort ?</p><p>C’est Jésus-Christ lui-même qui a éclairé nos ténèbres ; c’est lui qui nous a tendu la main pour nous tirer de cette mort où nous étions plongés sans autre espérance que celle qui vient de lui. Nous n’étions pas encore que déjà il nous avait appelés.</p><p>« Réjouissez-vous, dit le prophète, stérile qui n’enfantiez pas ; poussez des cris de joie, vous qui étiez sans enfants et qui paraissiez abandonnée, vous avez aujourd’hui une postérité plus nombreuse que la femme qui avait un époux. » Cette épouse stérile n’est-ce pas la gentilité dont nous faisions partie ? Ne compte-t-elle pas aujourd’hui plus d’enfants que l’épouse dont les fils portaient le nom d’enfants de Dieu ?</p><p>L’habileté d’un artiste consiste à soutenir non les édifices solides, mais les édifices qui croulent. Nous tombions dans la mer quand Jésus-Christ nous a sauvés ; nous allions périr quand il nous a rappelés à la vie.</p><p>Confessons hautement celui qui nous a fait connaître le Dieu de vérité. Grâce à lui, nous vivons maintenant et nous ne portons plus notre encens à des dieux morts. Mais c’est moins l’hommage des lèvres que celui des œuvres qu’il demande. Fuyez donc l’adultère, la médisance, la jalousie ; ne vous attachez point aux biens d’ici-bas ; soyez unis par les liens de la plus tendre charité. Regardez cette terre comme un lieu d’exil, et vivez ici-bas comme des étrangers. Heureusement notre triste exil est court ! Mais qu’elle est grande et magnifique la promesse que Jésus-Christ nous a faite d’un repos éternel au sein de sa gloire. Il est à nous, mes frères, si nous ne fixons pas ici-bas nos désirs, si nous méprisons tous les biens de ce monde comme indignes d’arrêter un seul de nos regards.</p><p>Nous ne pouvons servir deux maîtres à la fois, Dieu et l’argent ; le Seigneur nous l’a dit. Que nous reviendrait-il de cet indigne partage ? Je vous le demande, que sert à l’homme de gagner l’univers, s’il vient à perdre son âme ?</p><p>Le siècle présent et le siècle futur sont en présence, comme deux ennemis irréconciliables.</p><p>L’un vante le plaisir, l’argent, la ruse ; l’autre y renonce. Peut-il y avoir la moindre alliance entre eux ? Peut-on comparer les biens qu’ils nous promettent ? Les uns sont bornés, fugitifs, périssables ; les autres immenses, solides, incorruptibles. Méprisez ces derniers, et vous trouverez à leur place des feux éternels dont rien ne pourra vous sauver.</p><p>« Quand Noé, quand Job, quand Daniel ressusciteraient, dit le prophète, ils n’affranchiraient pas leurs enfants de la captivité. »</p><p>Si des hommes aussi justes ne peuvent, par leur propre justice, sauver leurs enfants, à quoi faut-il nous attendre, si nous ne conservons pas la pureté et l’innocence du baptême ? Quel avocat pourra plaider notre cause, si les œuvres de justice et de piété ne parlent pas en notre faveur ?</p><p>Nous sommes toujours ici-bas aux prises avec l’ennemi. Dans l’arène nous ne couronnons que l’athlète qui a vaillamment combattu. Une couronne nous est aussi proposée ; celle-ci ne se flétrit point ; elle est immortelle. Élançons-nous tous ensemble vers ce prix placé au bout de la carrière. Dans les luttes des gladiateurs, le combat a ses lois ; celui qui les viole est jeté hors de la lice et battu de verges.</p><p>La condition imposée au Chrétien, dans le combat qu’il doit livrer pour s’assurer l’immortelle couronne, est de conserver son âme pure. Malheur à celui qui la souille !</p><p>« Le ver rongeur qui s’attache à lui, dit le prophète, ne meurt jamais ; le feu qui le dévore ne s’éteint pas ; son supplice est dévoilé aux regards de tous les hommes. »</p><p>Tandis que nous le pouvons encore, hâtons-nous de faire pénitence. Que sommes-nous ? de la boue entre les mains de l’ouvrier. De cette boue il fait un vase ; si le vase, avant d’être fini, se brise entre ses mains, il le refait. Mais s’il l’a mis dans la fournaise avec ses défauts, le mal est irrémédiable.</p><p>Écoutez la voix du Seigneur : « Que rien ne souille votre corps, vous dit-il ; conservez intacte la pureté de votre foi, afin d’obtenir la vie éternelle. »</p><p>Que personne de vous ne dise : « Ce n’est pas cette chair qui sera jugée ; elle ne ressuscitera point. »</p><p>Eh quoi ! mes frères, n’est-ce pas dans cette chair que nous avons été appelés au salut, éclairés des lumières de la foi ? Vous devez donc respecter votre corps comme le temple de Dieu, et croire que c’est dans cette chair que vous ressusciterez ; de même que Jésus-Christ, l’auteur de votre salut, s’est fait chair, de pur esprit qu’il était, de même aussi nous recevrons dans notre chair la récompense qu’il nous promet.</p><p>Aimons-nous tous les uns les autres, pour avoir tous part au royaume de Dieu. Tandis que nous pouvons encore guérir, remettons-nous entre les mains de Dieu, qui veut être notre médecin, et témoignons-lui en même temps notre reconnaissance. Mais ce qu’il veut de nous, c’est une pénitence faite avec un cœur droit ; car rien ne lui échappe : il voit tout ce qui se passe dans le cœur.</p><p>Voulons-nous trouver la paix de l’âme, faisons le bien. Peu la connaissent cette paix. C’est que la plupart préfèrent une volupté passagère aux promesses de la vie future. Alors les terreurs de la conscience sans cesse les agitent. Ils ignorent quelle amertume se trouve au fond des plaisirs du siècle ; quelles délices renferme au contraire la promesse des biens futurs. Si du moins ils se bornaient à se perdre eux-mêmes ! Mais ils cherchent encore à insinuer dans les âmes pures le poison de leurs funestes doctrines. Ils ne voient pas qu’ils se préparent une double condamnation. Pour nous, mes frères, ne chancelons pas dans la foi, soutenons-nous par l’espérance des biens futurs, vivons dans la justice et dans la charité, et soyons prêts à toute heure, puisque nous ne savons pas le moment de l’arrivée du Seigneur.</p>
    references: |-
      <p>Traduction : Antoine-Eugène Genoude, <i>Les Pères de l’Église</i>, t. I, Sapia, 1837, p. 179-183. Texte copié depuis <a href="https://fr.wikisource.org/wiki/Les_P%C3%A8res_de_l%E2%80%99%C3%89glise/Tome_1/Auteurs_inconnus/Saint_Cl%C3%A9ment">Wikisource</a>.</p>
