    body: |-
      <h2>Biographie</h2><p>Marcus Minucius Felix (en latin) naquit en Afrique dans une famille païenne. Il reçut une solide formation de rhéteur et devint avocat à Rome. Il se convertit au christianisme à l’âge adulte, frappé par la doctrine sublime de l’Évangile et par le courage des martyrs chrétiens.</p>
    references: |-
      <p>Traduction : Rodion Vlasov, avec l’aide de l’IA, d’après la <a href="https://bibleox.com/fr/ru/w/%D0%9C%D0%B0%D1%80%D0%BA_%D0%9C%D0%B8%D0%BD%D1%83%D1%86%D0%B8%D0%B9_%D0%A4%D0%B5%D0%BB%D0%B8%D0%BA%D1%81">page de référence en russe</a>.</p>
