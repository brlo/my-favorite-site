    title: "Cyprien de Carthage, IIIe siècle"
    title_sub: "hiéromartyr (~200-258), évêque de Carthage, écrivain ecclésiastique, apologiste"
    meta_desc: "Saint Cyprien de Carthage (~200-258), évêque et hiéromartyr : sa vie, sa doctrine et son traité De l’unité de l’Église."
    update: true
    body: |-
      <h2>Biographie</h2>
      <p>Mémoire : 31 août (13 septembre)</p>
      <p>On sait qu’il fut élevé dans un milieu païen et fit carrière comme juriste. Les circonstances de sa conversion sont inconnues. Il fut établi évêque deux ans après son baptême et se trouva pour ainsi dire aussitôt dans les conditions de la persécution des chrétiens déclenchée par l’empereur Dèce, et fut entraîné dans de graves disputes sur le repentir des apostats.</p>
      <p>Sous la menace des supplices, beaucoup, y compris plusieurs évêques, renièrent le Christ, puis, la persécution terminée, résolurent de revenir à l’Église. Cyprien soutenait avec insistance que seul l’évêque, ou le prêtre établi par lui, peut donner la rémission des péchés (et non les confesseurs, c’est-à-dire ces hommes qui n’avaient pas rejeté leur foi mais qui, pour une raison ou une autre, avaient échappé à la mort), et que la question de la réception d’un évêque tombé ne se règle que par le concile de ses anciens frères. Quant aux sacrements accomplis par un évêque tombé avant sa réception par le concile, ils sont invalides.</p>
      <p>L’affaire alla jusqu’à un grave conflit avec le pape Étienne, conflit qui ne s’aggrava pas davantage, uniquement à cause de l’arrestation et de l’exécution de ce dernier. Quelques années plus tard, Cyprien lui-même fut arrêté, envoyé en exil, puis exécuté.</p>
      <p>Pour en savoir plus sur l’histoire de l’Église de Carthage : <a href="https://azbyka.ru/otechnik/Lopuhin/pravoslavnaja-bogoslovskaja-entsiklopedija-ili-bogoslovskij-entsiklopedicheskij-slovar-tom-9-karmelity-koine/26">l’article de l’Encyclopédie théologique orthodoxe</a></p>
      <h2>La foi</h2>
      <h3>Le caractère interminable des tourments</h3>
      <blockquote><p>Mais rend-on gloire à Dieu, quand on méprise la grandeur et la justice de Dieu au point que les sacrilèges, tandis que Dieu annonce sa colère et son indignation contre ceux qui offrent des sacrifices, <strong>au moment où retentissent contre eux les menaces de châtiments éternels et de <mark>tourments sans fin</mark></strong></p></blockquote>
      <p>(<a href="https://bibleox.com/fr/ru/w/tNaHSPT6_%D0%9F%D0%B8%D1%81%D1%8C%D0%BC%D0%B0_%D0%9A%D0%B8%D0%BF%D1%80%D0%B8%D0%B0%D0%BD%D0%B0_%D0%9A%D0%B0%D1%80%D1%84%D0%B0%D0%B3%D0%B5%D0%BD%D1%81%D0%BA%D0%BE%D0%B3%D0%BE">Lettre à Corneille sur Fortunat et Félicissime, ou Contre les hérétiques (en russe)</a>)</p>
      <blockquote><p>Ainsi donc, ce n’est pas en vain que les verges et les fouets de Dieu ne manquent pas pour frapper ! Et s’ils n’ont servi à rien ici-bas et n’ont ramené personne à Dieu par la grande crainte du châtiment, <strong>il y a dans l’avenir une prison éternelle, un feu inextinguible, <mark>un supplice sans fin</mark>.</strong> De là, les gémissements de ceux qui implorent ne seront pas entendus de Dieu, de même qu’ici ils n’ont pas écouté les menaces du Dieu irrité</p>
      <p>…</p>
      <p>Croyez celui qui donne aux croyants la vie éternelle pour récompense. Croyez celui qui condamnera les incroyants au châtiment éternel dans la flamme de la géhenne. Quelle gloire sera celle de la foi, et quel châtiment celui de l’incrédulité, quand viendra le jour du jugement ? Quelle joie pour les fidèles, et quelle douleur pour les infidèles, de n’avoir pas voulu croire auparavant, quand revenir à la foi n’est plus possible ? <strong><mark>Les condamnés brûleront éternellement dans le feu de la géhenne, tourmentés par une flamme dévorante, et rien n’arrêtera ni n’achèvera leurs tourments</mark></strong>. Les âmes, avec leurs œuvres, seront conservées pour <strong><mark>souffrir dans des supplices sans fin</mark></strong>. Et là, au spectacle perpétuel, sera <strong>celui qui, ici-bas, pour un temps, nous exposait à son propre spectacle</strong>, et <strong>la jouissance passagère des yeux des bêtes</strong>, au temps des persécutions, <strong>sera récompensée par un spectacle permanent</strong>, selon l’assurance de l’Écriture sainte, qui dit : « <strong>car leur ver ne mourra point, et leur feu ne s’éteindra point, et ils seront en opprobre à toute chair</strong> » (Is 66, 24).</p>
      <p>…</p>
      <p><strong><mark>Le supplice du châtiment sera alors sans fruit de repentir, les larmes seront vaines, la prière sans effet. Ils croiront trop tard au châtiment éternel, ceux qui n’ont pas voulu croire à la vie éternelle.</mark></strong></p>
      <p>Prenez donc soin, tant qu’il est possible, de votre sûreté et de votre vie. Nous vous donnons de tout cœur un conseil salutaire. Puisqu’il ne nous est pas permis de haïr, et que nous plaisons à Dieu en ne rendant rien pour les offenses, nous vous exhortons, <strong>tant qu’il en est encore temps, tant qu’il reste encore un peu de ce siècle</strong>, à donner satisfaction à Dieu, à sortir de l’abîme de la sombre superstition vers la pure lumière de la vraie religion. Nous ne sommes pas jaloux de vos avantages et nous ne vous cachons pas les bienfaits divins. Pour votre haine, nous payons de bienveillance, et pour les supplices et les tourments que vous nous infligez, nous vous montrons les chemins du salut. Croyez, et vivez ; réjouissez-vous éternellement avec nous, vous qui nous persécutez pour un temps. <strong><mark>Quand viendra le départ d’ici, il n’y aura plus aucun lieu au repentir, aucune satisfaction réelle</mark></strong>. <strong><mark>Ici, la vie se perd ou se conserve</mark></strong>. Ici, le salut éternel s’assure par le culte rendu à Dieu et par les œuvres de la foi. Et que nul ne soit retenu sur le chemin du salut par ses péchés ou par son âge. Pour celui qui vit encore en ce monde, aucun repentir n’est trop tardif.</p></blockquote>
      <p>(<a href="https://bibleox.com/fr/ru/w/GPb0Tnh8_%D0%9A%D0%BD%D0%B8%D0%B3%D0%B0_%D0%BA_%D0%94%D0%B5%D0%BC%D0%B5%D1%82%D1%80%D0%B8%D0%B0%D0%BD%D1%83__%D0%9A%D0%B8%D0%BF%D1%80%D0%B8%D0%B0%D0%BD_%D0%9A%D0%B0%D1%80%D1%84%D0%B0%D0%B3%D0%B5%D0%BD%D1%81%D0%BA%D0%B8%D0%B9">Livre à Démétrien (en russe)</a>)</p>
      <h3>L’Eucharistie comme sacrifice</h3>
      <blockquote><p><em>Cyprien à Cécilius, son frère, salut. Je sais, frère très aimé, que parmi les évêques établis par Dieu sur les Églises du Seigneur dans le monde entier, la plupart gardent la règle de la vérité évangélique et de la tradition du Seigneur, sans s’écarter vers des nouveautés humaines de ce qu’</em><strong><em>a enseigné le Christ, le Maître, et qu’il a accompli lui-même</em></strong><em>. Mais puisque quelques-uns, dans la consécration du calice du Seigneur et dans sa distribution au peuple, par ignorance ou par simplicité, ne gardent pas ce qu’a accompli et ordonné d’accomplir </em><strong><em>l’Auteur de ce <mark>sacrifice</mark> et Maître, notre Seigneur Jésus-Christ</em></strong><em>, j’ai jugé aussi pieux que nécessaire de t’écrire à ce sujet … Quant à nous, sache-le, nous avons reçu le commandement de garder la tradition du Seigneur dans </em><strong><em><mark>l’oblation du calice du Seigneur</mark></em></strong><em> et de ne rien faire d’autre que ce qui, pour nous, a été accompli dès l’origine par le Seigneur lui-même, c’est-à-dire d’offrir le calice en mémoire de lui, non autrement qu’en le mêlant de vin.</em></p>
      <p><em>…</em></p>
      <p><em>le calice que le Seigneur offrait était mêlé de vin, et ce qu’il a appelé son sang était du vin. D’où il est évident aussi que le sang du Christ n’est pas offert dans le calice quand le vin y manque, et que </em><strong><em><mark>le sacrifice</mark></em></strong><em> du Seigneur ne reçoit pas la sanctification légitime, quand notre oblation et notre </em><strong><em><mark>victime</mark></em></strong><em> ne correspondent pas à la passion du Seigneur. Et comment serions-nous jugés dignes de boire avec le Christ le vin nouveau du fruit de la vigne dans le Royaume de son Père, si, dans le </em><strong><em><mark>sacrifice offert à Dieu le Père et au Christ</mark></em></strong><em>, nous n’offrons pas de vin et ne mêlons pas de vin le calice du Seigneur selon la tradition du Seigneur.</em></p>
      <p><em>…</em></p>
      <p><em>Et combien il est impie, combien il est contraire à Dieu de changer le vin en eau, alors que la transformation de l’eau en vin opérée par le Seigneur aux noces aurait dû nous instruire et nous apprendre </em><strong><em>que, dans les <mark>sacrifices</mark> du Seigneur, il faut avant tout offrir du vin !</em></strong></p>
      <p><em>…</em></p>
      <p><em>Ainsi donc, frère très aimé, il ne faut en aucun cas suivre la coutume de quelques-uns, qui offrent de l’eau dans le calice du Seigneur, même si, avant nous, il y a eu des hommes qui regardaient cela comme légitime. Il faut leur demander : qui ont-ils suivi ? Car si, dans le </em><strong><em><mark>sacrifice</mark></em></strong><em> qu’a accompli le Christ, il faut imiter le Christ, cela signifie qu’il faut, sans aucune contradiction, accomplir ce qu’a accompli le Christ</em></p></blockquote>
      <p>(<a href="https://azbyka.ru/otechnik/Kiprian_Karfagenskij/pysma/">63. Lettre à Cécilius sur le sacrement du calice du Seigneur</a>)</p>
      <blockquote><p><em>Basilide et Martial, souillés par des libelles d’idolâtrie et s’étant avoués coupables d’actions honteuses, ne doivent pas porter la dignité épiscopale ni exercer le ministère du sacerdoce divin ; vous avez en même temps exprimé le désir d’avoir là-dessus notre réponse et, dans votre inquiétude aussi juste qu’inévitable, de recevoir l’appui de notre participation et de l’expression de notre sentiment. Mais à ce désir, ce ne sont pas tant nos conseils qui répondent que les commandements divins : depuis longtemps déjà la parole céleste a déterminé et la loi de Dieu prescrit qui doivent être, et quels ils doivent être, ceux qui servent à l’autel et </em><strong><em><mark>accomplissent les sacrifices divins</mark></em></strong><em>. Dans le livre de l’Exode, Dieu donne à Moïse ce commandement en ces termes : « Que les prêtres qui s’approchent du Seigneur Dieu se sanctifient, de peur que le Seigneur ne les fasse périr » (Ex 19, 22) ; et encore : « Et lorsqu’ils viennent servir à l’autel du sanctuaire, qu’ils n’attirent pas sur eux le péché, afin qu’ils ne meurent pas » (Ex 28, 43). De même, dans le livre du Lévitique, Dieu ordonne et dit : « un homme… si quelque défaut est en lui, </em><strong><em>qu’il ne s’approche pas pour offrir les dons de son Dieu</em></strong><em> » (Lv 21, 17).</em></p></blockquote>
      <p>(<a href="https://azbyka.ru/otechnik/Kiprian_Karfagenskij/pysma/">Lettre au clergé et au peuple d’Espagne sur Basilide et Martial</a>)</p>
      <blockquote><p><em>Moi, mes compagnons et toute la fraternité, nous vous envoyons, frère très aimé, cette lettre en notre place et, vous exprimant par écrit notre joie, nous vous déclarons notre fidèle dévouement d’amour, sans cesser, ici encore, </em><strong><em><mark>dans l’accomplissement du sacrifice</mark> et dans nos prières</em></strong><em>, de rendre grâce à Dieu le Père et au Christ, son Fils, notre Seigneur</em></p></blockquote>
      <p>(<a href="https://azbyka.ru/otechnik/Kiprian_Karfagenskij/pysma/#sel=367:1,367:46">Lettre à Lucius, pape de Rome, à son retour de captivité</a>)</p>
    references: |-
      <p>Les citations des deux traités sont empruntées à la traduction d’Antoine-Eugène Genoude, <i>Les Pères de l’Église</i>, t. 5 bis, Adrien Le Clère et Sapia, 1842, publiée sur ce site. Les citations des <i>Lettres</i> et du <i>Livre à Démétrien</i>, qui n’ont pas de traduction française publiée sur le site, sont traduites du russe.</p><p>Traduction : Rodion Vlasov, avec l’aide de l’IA, d’après la <a href="https://bibleox.com/fr/ru/w/%D0%9A%D0%B8%D0%BF%D1%80%D0%B8%D0%B0%D0%BD_%D0%9A%D0%B0%D1%80%D1%84%D0%B0%D0%B3%D0%B5%D0%BD%D1%81%D0%BA%D0%B8%D0%B9_III_%D0%B2%D0%B5%D0%BA">page de référence en russe</a>.</p>
