    path: Trll_Tertullien_IIe_IIIe_siècle
    title: "Tertullien, IIe–IIIe siècle"
    title_sub: "(~155-220), l’un des plus éminents écrivains et apologistes chrétiens des premiers siècles, fondateur de la patristique latine ; passé ensuite au montanisme"
    meta_desc: "Tertullien (~155-220), apologiste et théologien latin : sa vie, sa doctrine et ses traités."
    update: true
    body: |-
      <p>Tertullien écrivait en latin. Les œuvres de Tertullien en latin se trouvent dans la section suivante : <a href="https://bibleox.com/fr/la/w/Tertullianus/">Tertullien (en latin)</a>. Il convient de garder à l’esprit qu’une partie de ses œuvres fut écrite après qu’il fut tombé dans l’hérésie du montanisme (voir les périodes de la vie de Tertullien ci-dessus).</p><h2>Biographie</h2><h3>Sur le chemin du Christ</h3><p>Tertullien (nom complet : Quintus Septimius Florens Tertullianus) naquit à Carthage, dans la famille d’un officier romain, un centurion, entre les années 150 et 170. Dans sa jeunesse et sa prime jeunesse, il reçut une formation profane complète. De plusieurs sources anciennes, y compris de ses propres écrits, il ressort qu’il connaissait bien la jurisprudence ; qu’il était familier des poètes et des philosophes grecs et latins ; qu’il s’orientait en médecine ; qu’il maîtrisait la langue grecque.</p><p>Malgré toute son instruction, il mena dans sa jeunesse une vie immorale, ordinaire pour ce milieu païen dissolu dans lequel il grandit, fut élevé et parvint à l’âge adulte.</p><p>Tertullien passa la majeure partie de sa vie à Carthage. Comme il ressort de ses œuvres, il admirait l’histoire de cette ville et ses héros. Pendant quelque temps, assez brièvement, Tertullien vécut à Rome : selon toute probabilité, il y exerçait la pratique du droit.</p><p>On pense que sa conversion au christianisme eut lieu vers 190. Dans quelles circonstances il se décida à changer sa vision du monde, qui le conduisit au Christ, cela n’est pas connu avec certitude.</p><p>Ayant reçu le baptême, Tertullien s’unit par les liens du mariage à une jeune chrétienne et vécut avec elle de longues années.</p><p>C’est à cette même période qu’il fut jugé digne d’être ordonné prêtre. Tertullien s’acquittait avec responsabilité de ses devoirs sacerdotaux, comme il convenait à un bon pasteur chrétien.</p><p>Ne limitant pas son activité au soin de son propre troupeau, il déployait tous ses efforts pour répandre la foi parmi les païens, prêchait beaucoup et se consacrait à l’activité littéraire. Les œuvres qu’il composa touchaient aussi bien aux questions de doctrine qu’à celles de la morale et des mœurs.</p><h3>L’activité apologétique</h3><p>Le temps du ministère de Tertullien fut celui des plus rudes épreuves pour l’Église. On persécutait les chrétiens, on les haïssait, on les humiliait, on les frappait, on les torturait, on les suppliciait, on les tuait.</p><p>Et Tertullien, sans épargner son énergie, ne redoutant ni les délateurs, ni les juges, ni les bourreaux et les tortionnaires, prenait si résolument la défense du christianisme qu’on reste étonné qu’il n’ait jamais, de sa vie entière, été jeté dans un cachot ni dans une salle de torture.</p><p>Et cela alors même qu’il ne se cachait pas des persécutions, mais, comme pour les braver, s’adressait à ses adversaires dans les termes les plus vifs, les plus rugueux, parfois même les plus blessants. Ainsi appelait-il les persécuteurs de l’Église de farouches ignorants, des profanateurs des sanctuaires ; il tournait en dérision les cultes et les mystères païens, vouait à l’infamie les idoles et les simulacres ; il menaçait du Jugement de la Justice de Dieu, de la coupe de la colère de Dieu.</p><p>Ses œuvres apologétiques n’en étaient pas moins remplies d’une argumentation théologique et logique rigoureuse.</p><p>Au temps des persécutions, il arrivait souvent que les chrétiens ne fussent pas mis à mort aussitôt convaincus d’appartenir à l’Église, mais fussent soumis à d’horribles coups et tortures, afin de les contraindre à renier publiquement le Christ, à offrir des sacrifices aux dieux païens, à se souiller par le sang des victimes.</p><p>S’opposant catégoriquement à une telle violence, Tertullien expliquait aux bourreaux que si les dieux païens existaient réellement, ce ne sont pas des sacrifices feints, mais des sacrifices volontaires qui leur seraient agréables — à moins, bien sûr, que leurs dieux ne fussent des chicaneurs.</p><p>En outre, il recourait souvent, comme moyen de défense, à des arguments tirés du droit (sa solide formation juridique s’y révélait).</p><p>En appelant au bon sens, Tertullien faisait observer que l’on ne torture pas les criminels pour qu’ils renoncent à leur participation aux forfaits, mais pour qu’ils fassent des aveux véridiques, pour qu’ils s’accusent plutôt de leurs crimes. Les chrétiens, au contraire, sont torturés dans le but qu’ils renoncent à se dire chrétiens : c’est-à-dire qu’ils renoncent à se reconnaître coupables et responsables d’une infraction à la loi. Il y voyait une absurdité.</p><p>Aux accusations portées contre les chrétiens — violation des normes morales, haine du pouvoir et notamment de l’empereur — Tertullien opposait des arguments qui réfutaient les thèses de l’accusation ; il expliquait et démontrait que ce ne sont pas les chrétiens, mais les païens eux-mêmes qui mènent une vie dépravée et attisent la haine dans la société, tandis que les chrétiens demeurent dans l’amour et la prière.</p><p>Outre qu’il défendait le christianisme contre les païens, Tertullien le défendait aussi contre les attaques des fanatiques juifs.</p><h3>La lutte contre les fausses doctrines</h3><p>Il est difficile de surestimer les mérites de Tertullien dans la lutte contre les erreurs. En particulier, il dévoila et démasqua des hérésies aussi célèbres en son temps que celles de Marcion et d’Hermogène.</p><p>Le premier, ne comprenant pas le sens des événements de l’Ancien Testament ni le lien interne entre les deux Alliances, en vint à conclure qu’il y a deux dieux : un dieu mauvais, décrit dans les Livres de l’Ancien Testament, et un dieu bon, le Père de Jésus-Christ.</p><p>Dévoilant pas à pas les erreurs de Marcion, Tertullien montra en quoi consistent la colère de Dieu et la pédagogie de Dieu ; il expliqua que Dieu est Un et Unique, qu’il n’est pas l’auteur du mal et que ses châtiments sont une manifestation de sa colère. Recourant à des arguments amples et ordonnés, s’appuyant sur les Écritures, Tertullien démontra que la colère de Dieu s’abat sur les impies non sans raison et non sans de bonnes fins providentielles.</p><p>Hermogène se tenait sur le terrain du dualisme et blasphémait Dieu en niant la création du monde à partir de rien. Il enseignait que le monde a été créé d’une matière coéternelle à Dieu, car s’il n’en était pas ainsi, Dieu ne serait pas un Seigneur éternel, puisqu’il n’aurait pas d’objet de sa domination qui lui fût coéternel.</p><p>Tertullien répliqua, et avec succès, que si Hermogène avait raison, Dieu serait non absolu, mais limité, et que sa capacité de créer dépendrait non seulement de sa volonté et de ses perfections, mais encore de l’existence d’une matière préexistante. Il s’ensuivrait que, pour réaliser son potentiel créateur, Dieu aurait eu besoin de la matière.</p><h3>La dérive vers le montanisme</h3><p>Le zèle, l’impétuosité, la franchise, la détermination du combattant ardent s’accommodaient difficilement en lui de la faiblesse humaine qui l’entourait. Vers la fin de sa vie, il comparait de plus en plus les usages établis dans l’Église et la conduite de ses membres avec ses propres représentations idéalisées, et, hélas, il trouvait entre eux de plus en plus de discordances.</p><p>Peu à peu, il éprouva du mécontentement à l’égard du genre de vie d’une partie considérable des clercs et des laïcs, et il commença à s’éloigner de l’Église. Habitué à s’exprimer librement, il en vint à s’élever même contre les évêques.</p><p>Dans cette disposition d’esprit, Tertullien rencontra la secte des montanistes, qui s’était répandue à cette époque. On donne comme date approximative de la rupture de Tertullien avec l’Église l’année 213.</p><p>Ancien prêtre païen, Montan, converti au christianisme, ne vécut pas longtemps en fils obéissant de l’Église. S’étant proclamé prophète de Dieu, il trouva de nombreux disciples, forma une communauté et la dirigea. Les représentants de cette secte hérétique se distinguaient par un « ascétisme » excessif, une disposition extatique particulière, un penchant pour le mysticisme et les miracles.</p><p>Très vite, le montanisme se répandit sur le territoire de l’Asie Mineure, puis atteignit les régions occidentales.</p><p>Les montanistes accusaient l’Église de s’écarter des traditions apostoliques, de se refroidir dans la foi, de manquer de charisme prophétique. Imprégné des idées et de l’esprit rebelle des hérétiques, Tertullien se mit à combattre plus activement les usages de l’Église.</p><p>Ainsi se mit-il à exprimer une attitude négative à l’égard du second mariage, puis du mariage en général. Comprenant que la vie conjugale (à de rares exceptions près) ne va pas sans relations charnelles, il en vint à parler du mariage comme d’une fornication tolérée (et cela bien que le Seigneur lui-même ait béni le sacrement du mariage). Même dans son attitude à l’égard de la procréation, on commença à discerner une certaine dépréciation.</p><p>Finalement, Tertullien fut déçu par le montanisme lui-même, après quoi il prit la tête de son propre mouvement religieux.</p><p>Après l’an 220, on perd la trace de Tertullien. C’est avec une grande part d’approximation qu’on fixe l’année de sa mort précisément à cette date.</p><h3>L’héritage littéraire</h3><p>Tertullien nous a laissé un grand nombre d’écrits.</p><p>Une partie d’entre eux, à savoir l’Apologétique, Aux Nations, À Scapula, Contre les Juifs, etc., ont une orientation apologétique.</p><p>Les autres — Contre Marcion en cinq livres, Contre Hermogène, Contre Praxéas, Du Baptême, Témoignage de l’Âme, Des Prescriptions [contre] les hérétiques, Contre les Valentiniens — ont une orientation dogmatico-polémique.</p><p>Au troisième groupe de ses œuvres, celui des écrits moraux et ascétiques, appartiennent : De la Pénitence, De l’Oraison dominicale, Exhortation à la Chasteté, De la Patience, À sa Femme, Aux Martyrs, De l’Ornement des Femmes, etc.</p><h2>La foi</h2><h3>Dieu Trinité — une seule nature, trois personnes</h3><blockquote><p><em>Surtout la doctrine qui se vante de posséder la vérité pure, en s’imaginant que la seule manière légitime de croire à l’unité de Dieu, c’est de confondre dans une seule et même personne et le Père et le Fils et l’Esprit saint ; comme si un seul n’était pas tout, </em><strong><em>quand tout dérive d’un seul</em></strong><em>, en gardant néanmoins le sacrement de l’économie qui </em><strong><em><mark>divise l’Unité en Trinité, où nous distinguons trois personnes, le Père, le Fils et l’Esprit saint</mark></em></strong><em>. Ils sont trois, non pas en essence, mais en degré ; non pas en substance, mais en forme ; non pas en puissance, mais en espèce ; </em><strong><em><mark>tous trois ayant une seule et même substance, une seule et même nature, une seule et même puissance, parce qu’il n’y a qu’un seul Dieu</mark> duquel procèdent ces degrés, ces formes et ces espèces, sous le nom de <mark>Père, de Fils et de Saint-Esprit</mark></em></strong><em>. Comment admettent-ils le nombre en rejetant le partage ? La discussion va le prouver à mesure qu’elle avancera.</em></p><p><em>…</em></p><p><em>Puisque toutes les Ecritures attestent la démonstration et la distinction de la Trinité. De là se tire notre prescription que </em><strong><em>l’être qui parle, celui à qui il parle et de qui il parle, ne peuvent être un seul et même être</em></strong></p><p><em>…</em></p><p><strong><em>Presque tous les psaumes parlent au nom du Christ ; partout <mark>le Fils s’y entretient avec le Père</mark>, c’est-à-dire le Christ avec Dieu. </em></strong><em>Remarque de plus </em><strong><em><mark>l’Esprit saint, parlant comme troisième personne du Père et du Fils</mark></em></strong><em> : « Le Seigneur dit à mon Seigneur : Asseyez-vous à ma droite jusqu’à ce que je réduise vos ennemis à vous servir de marche-pied. » De même, dans Isaïe : « Le Seigneur a dit à Jésus-Christ mon Seigneur. »</em></p><p><em>…</em></p><p><em>Comme à sa personne étaient associées </em><strong><em><mark>une seconde personne, son Fils et son Verbe, puis encore une troisième personne, l’Esprit dans le Verbe</mark></em></strong><em>, voilà pourquoi il emploie le pluriel : « Faisons…..Notre image….. L’un de nous. »</em></p><p><em>…</em></p><p><em>D’ailleurs, </em><strong><em><mark>tout en gardant partout l’unité de substance dans ces trois personnes inséparablement, unies</mark></em></strong></p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/Trll_Contre_Prax%C3%A9as">Contre Praxéas</a>)</p><h3>Le Christ — Dieu parfait et homme parfait (deux natures) en une seule personne</h3><p>L’union ne s’accomplit pas dans les natures, mais dans la personne du Fils de Dieu :</p><blockquote><p><em>Or la chair n’est pas Dieu, car il est dit d’elle : « Ce qui naîtra en elle sera saint et sera appelé Fils de Dieu. » Mais celui qui est né en elle est Dieu, celui dont le psaume dit aussi : « Un Dieu naquit en elle comme homme, et il l’a édifiée par la volonté du Père » (Ps 86, 5). Quel Dieu donc est né en elle ? — [Il est clair que c’est] le Verbe et l’Esprit, lequel, avec le Verbe, est né selon la volonté du Père (de voluntate Patris)95. Ainsi donc, </em><strong><em>le Verbe dans la chair</em></strong><em>. Il faut examiner ensuite de quelle manière le Verbe s’est fait chair : serait-ce en se changeant en chair, ou en s’en revêtant ? Assurément, </em><strong><em><mark>il s’en est revêtu, car il faut croire que Dieu est immuable et ne change point sa forme, puisqu’il est éternel</mark></em></strong><em>. Or le changement est la destruction de ce qui était auparavant, car tout ce qui se change en autre chose cesse d’être ce qu’il était et commence d’être ce qu’il n’était pas. Mais </em><strong><em><mark>Dieu ne cesse pas d’être [Dieu] et ne peut devenir autre</mark></em></strong><em>. Or le Verbe est Dieu, et la parole du Seigneur demeure éternellement (Ps 116, 2), précisément parce qu’il conserve sa forme. S’il n’admet point de changement, il faut donc comprendre que [le Verbe] « s’est fait chair » de telle sorte qu’il subsistait, apparaissait et était visible dans la chair, et se laissait toucher par la chair, puisque tout le reste aussi se perçoit de cette manière. Car si le Verbe s’était fait chair par changement et transformation de substance, Jésus serait déjà une seule substance formée de deux, de la chair et de l’Esprit ; il serait une sorte de mélange, comme l’électrum qui se compose d’or et d’argent, et il ne serait ni « or », c’est-à-dire Esprit, ni « argent », c’est-à-dire chair, puisque l’un, passé dans l’autre, forme un troisième être. Par conséquent, Jésus ne sera pas Dieu non plus, puisque celui qui s’est fait chair a cessé d’être le Verbe ; mais il ne sera pas non plus homme, c’est-à-dire chair, car la chair cesserait d’être elle-même si elle devenait le Verbe. Ainsi, des deux il résulte quelque chose d’intermédiaire, plutôt un troisième terme que l’un et l’autre. Or nous trouvons qu’</em><strong><em><mark>il est appelé expressément Dieu et Homme</mark></em></strong><em>, comme le psaume lui-même le confirme : car </em><strong><em><mark>un Dieu naquit en elle comme homme</mark></em></strong><em> et il l’a édifiée par la volonté du Père (Ps 86, 5). Il est clair qu’</em><strong><em><mark>il est à tous égards Fils de Dieu et Fils de l’homme</mark></em></strong><em>, puisque, sans aucun doute, </em><strong><em><mark>il est Dieu et Homme selon ses deux substances</mark></em></strong><em>, qui se distinguent par leurs propriétés propres, parce que le Verbe n’est rien d’autre que Dieu, et la chair rien d’autre que l’homme. Ainsi l’Apôtre parle de l’une et de l’autre substance : Qui est né de la semence de David selon la chair (ce sera l’Homme et le Fils de l’homme), et qui a été déclaré Fils de Dieu selon l’Esprit (ce sera Dieu et le Verbe de Dieu) (Rm 1, 3-4). </em><strong><em><mark>Nous voyons une double condition, qui ne résulte pas d’un mélange, mais de l’union [des deux natures] en une seule Personne</mark></em></strong><em> ;</em></p></blockquote><p>(<a href="https://azbyka.ru/otechnik/Tertullian/protiv-prakseja/#sel=86:51,86:544">Contre Praxéas (en russe)</a>)</p><h3>La foi seule ne suffit pas au salut</h3><blockquote><p><em>Ici l’audace de quelques impies m’arrête par ces questions : </em><strong><em>« Si la foi suffit, le baptême n’est donc pas nécessaire ? Abraham, qui n’avait été plongé dans aucune eau, devint agréable à Dieu sans autre sacrement que le sacrement de sa foi. »</em></strong><em> Je réponds : les lois qui viennent les dernières obligent et prévalent sur celles qui les ont précédées. Qu’anciennement, avant la passion et la résurrection du Seigneur, la foi toute seule ait suffi pour le salut, d’accord. </em><strong><em>Mais, quand il fallut en outre croire à sa naissance, à sa passion et à sa résurrection, le sacrement primitif <mark>s’accrut du sceau du baptême</mark>, vêtement de notre foi pour ainsi parler, qui auparavant était nue, et qui aujourd’hui ne peut rien sans l’observation de la loi. En effet, <mark>la nécessité du baptême a été imposée ; la forme en a été prescrite</mark> : « Allez, dit le Seigneur aux Apôtres, enseignez toutes les nations, <mark>les baptisant au nom du Père, et du Fils, et du Saint-Esprit</mark>. »</em></strong><em> Cette loi est clairement confirmée par cet autre arrêt définitif : « En vérité, en vérité je vous le dis, si quelqu’un ne renaît de l’eau et de l’Esprit saint, il n’entrera point dans le royaume de Dieu : » double sentence où est écrite la nécessité du baptême.</em><strong><em>Depuis ce moment, tous ceux qui entrèrent dans l’Église furent baptisés</em></strong><em>.</em></p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/Trll_Du_Bapt%C3%AAme">Du Baptême, 13</a>)</p><h3>La nécessité de la Tradition</h3><blockquote><p><em>Demande-moi un témoignage des Ecritures en faveur de ces institutions et de mille autres semblables, tu n’en trouveras aucun. </em><strong><em>Mais on mettra en avant <mark>la tradition qui les consacre, la coutume qui les confirme, la foi qui les observe</mark></em></strong><em>. Puis tu apprendras de toi-même, ou de la bouche de celui qui l’aura découverte, la raison sur laquelle reposent la tradition, la coutume et la foi : en attendant, </em><strong><em>tu croiras qu’il y a certaines lois non écrites auxquelles <mark>tu dois te soumettre</mark></em></strong><em>.</em></p><p><em>…</em></p><p><em>Il sera donc manifeste par ces exemples, </em><strong><em>qu’une tradition non écrite</em></strong><em> et </em><strong><em>confirmée par la coutume, fidèle témoin que c’est une tradition approuvée et se justifiant par la continuation de soi-même</em></strong><em>, peut se défendre et se maintenir dans l’observance.</em></p><p><em>…</em></p><p><em>Demande-la, mais toujours en respectant la tradition, quel qu’en soit l’auteur. </em><strong><em>Considère, non pas l’auteur, mais l’autorité, et principalement l’autorité de la coutume</em></strong><em>. Elle doit être d’autant plus respectée, qu’elle doit servir d’interprète à la raison ; de manière que si Dieu te l’enseigne, tu saches alors, non pas si tu dois observer la coutume, mais pourquoi la raison des observances chrétiennes est plus auguste, puisqu’elles sont maintenues par la nature qui est la première maîtresse de toute discipline.</em></p></blockquote><p>(<a href="https://azbyka.ru/otechnik/Tertullian/o-ventse-voina/">De la Couronne du soldat (en russe)</a>)</p><h3>La réalité du corps et du sang du Christ dans l’Eucharistie</h3><p>La chair rend possible l’union de l’âme avec Dieu. La chair reçoit le corps et le sang du Christ dans l’Eucharistie, afin que l’âme elle aussi soit nourrie de Dieu :</p><blockquote><p><em>Voilà ce que j’avais à dire pour réhabiliter la chair considérée dans l’aspect général de la nature humaine. Voyons maintenant par les dons qui lui appartiennent en propre, combien de prérogatives le nom de chrétien communique devant Dieu à cette frôle et abjecte substance. Certes, il suffirait à la chair que nulle âme ne pût absolument obtenir le salut à moins de croire, pendant qu’elle est dans la chair : </em><strong><em><mark>tant il est vrai que la chair est la base du salut</mark></em></strong><em>. Enfin, quand l’âme est enrôlée au service de Dieu, c’est la chair qui la met à même de recevoir cet honneur. </em><strong><em>C’est la chair en effet qui est lavée pour que l’âme soit purifiée</em></strong><em> ; </em><strong><em>la chair sur laquelle on fait les onctions pour que l’âme soit consacrée</em></strong><em> ; </em><strong><em>la chair qui est marquée <a href="https://bibleox.com/fr/ru/w/YZ74QtL1_%D0%9F%D0%BE%D0%BD%D1%8F%D1%82%D0%B8%D0%B5_%D0%BE_%D0%BA%D1%80%D0%B5%D1%81%D1%82%D0%BD%D0%BE%D0%BC_%D0%B7%D0%BD%D0%B0%D0%BC%D0%B5%D0%BD%D0%B8%D0%B8">du signe sacré (en russe)</a> pour que l’âme soit fortifiée</em></strong><em> ; </em><strong><em>la chair qui est couverte par l’imposition des mains pour que l’âme soit illuminée par l’esprit</em></strong><em> ; </em><strong><em><mark>la chair enfin qui se nourrit du corps et du sang de Jésus-Christ, pour que l’âme s’engraisse de la substance de son Dieu</mark></em></strong><em>. Elles ne peuvent donc être séparées dans la récompense, puisqu’elles sont associées dans le travail.</em></p></blockquote><p>(<a href="https://tertullian.org/russian/de_resurrectione_carnis_rus.htm">De la Résurrection de la chair (en russe)</a>) *<em>Tertullien, quant à lui, ne rejetait pas la notion d’“image” appliquée à l’Eucharistie.</em></p><p>Les Juifs ont déchiré le corps réel du Christ ; de même les fabricants d’idoles, en recevant dans ces mains une parcelle de l’Eucharistie, déchirent le corps réel du Christ :</p><blockquote><p><em>Un homme zélé pour la foi parlerait toute une journée sur cette matière, en gémissant de voir un chrétien quitter les idoles pour venir à l’église ; sortir des ateliers du démon pour entrer dans la maison de Dieu ; lever vers le Dieu créateur des mains qui viennent de créer des idoles ; adorer le Seigneur avec ces mêmes mains qui au dehors se font adorer elles-mêmes dans leurs œuvres ; </em><strong><em><mark>approcher du corps de notre Seigneur des mains qui donnent des corps aux démons</mark></em></strong><strong><em><mark>Le scandale serait moindre s’ils recevaient d’une main étrangère ce qu’ils souillent ; mais ils vont jusqu’à donner aux autres ce qu’ils ont souillé</mark></em></strong><em>. Des faiseurs d’idoles ont été admis dans les ordres sacrés de l’Église. O crime ! </em><strong><em><mark>Les Juifs n’ont trempé qu’une fois leurs mains dans le sang du Sauveur. Pour eux, ils déchirent son corps tous les jours</mark></em></strong><em>. O mains sacrilèges, qu’il faudrait couper ! A ces impies de savoir maintenant si c’est par figure qu’il a été dit. « Si votre main est pour vous un sujet de scandale, coupez-la. » Et quelles mains méritent plus d’être coupées que </em><strong><em><mark>celles qui chaque jour scandalisent le corps de Jésus-Christ</mark></em></strong><em>.</em></p></blockquote><p>(<a href="https://azbyka.ru/otechnik/Tertullian/ob_idolopokl/#0_7">De l’Idolâtrie, 7 (en russe)</a>)</p><h3>La valeur sacrificielle de l’Eucharistie</h3><blockquote><p><em>De même quelques-uns pensent que les jours de stations ils ne doivent point assister aux </em><strong><em><mark>oraisons des sacrifices</mark></em></strong><em>, parce que la station serait rompue par la réception du corps de notre Seigneur. Quoi donc ! </em><strong><em>l’Eucharistie</em></strong><em> devient-elle un obstacle au devoir que nous rendons à Dieu, ou bien nous lie-t-elle davantage au Seigneur ? Ta station ne sera-t-elle pas plus solennelle, si </em><strong><em>tu es debout et sous les armes devant l’autel de Dieu</em></strong><em> ? En recevant le corps du Seigneur, et en le gardant pour l’emporter chez toi, tout est sauf, et </em><strong><em><mark>la participation au sacrifice</mark></em></strong><em>, et l’accomplissement de ta bonne œuvre.</em></p></blockquote><p>(<a href="https://azbyka.ru/otechnik/Tertullian/o_molitve/"><u>Chapitre 19. Des « stations »</u> (en russe)</a>)</p><h3>Les presbytres sont prêtres</h3><blockquote><p><em>Mais pourquoi ne reconnaîtrions-nous pas plutôt dans les exemples primitifs les règlements qui s’accordent avec les nôtres, et dont la forme antique a trouvé sa place dans la nouveauté présente ? Voilà que je vois dans la loi ancienne une restriction apportée à la fréquence des mariages. Il est dit sagement au Lévitique : « <strong>Mes prêtres</strong> ne se marient point à plusieurs. » Qu’est-ce que plusieurs, suis-je en droit de dire, sinon ce qui n’est pas une seule fois ? Ce qui n’est pas l’unité, c’est le nombre. Enfin après l’unité commence le nombre : or l’unité est tout ce qui n’est qu’une fois. Mais il était encore réservé au Christ de compléter la loi sur ce point comme sur les autres. <strong>De là vient que chez nous, à ceux qui sont choisis pour entrer dans les rangs du <mark>sacerdoce</mark>, il est plus clairement et plus formellement prescrit de n’épouser qu’une : femme. Cela est si vrai, que plusieurs à ma connaissance ont été rejetés du sacerdoce pour avoir été mariés plus d’une fois.</strong> — Mais, me diras-tu, les autres peuvent donc se marier, puisque l’exception ne les atteint pas ? <strong>— Quelle serait notre extravagance, si nous nous imaginions qu’il est permis aux <mark>laïques</mark> de faire ce qui est défendu aux <mark>prêtres</mark> ? Les laïques ne sont-ils pas tous prêtres ?</strong> Il est écrit : « Il nous a faits rois et prêtres de Dieu et de son Père. » <strong>C’est l’autorité de l’Église qui a établi <mark>une distinction entre l’Ordre sacerdotal et le peuple</mark> ; elle qui lui assigne un rang et des honneurs particuliers : mais toi, là où l’Ordre ecclésiastique n’a pas son siège distinctif, tu offres le sacrifice, tu baptises, <mark>tu es prêtre, ne fut-ce que pour toi seul</mark>.</strong> Je dis plus. Là où trois fidèles sont rassemblés, quoique laïques, il y a une Église. Chacun en effet vit de sa foi, parce que « Dieu ne fait point acception des personnes, et que ce ne sont pas ceux qui écoutent la loi qui sont justifiés, mais ceux qui la pratiquent, » suivant la déclaration de l’Apôtre.</em></p><p><em>Si donc tu possèdes en toi-même le droit du sacerdoce que tu peux exercer au besoin, tu dois t’assujettir aussi à la loi du sacerdoce partout où besoin est d’exercer le droit du sacerdoce. Tu oses offrir le sacrifice et baptiser, après avoir épousé deux femmes ? Ne sera-ce pas un crime beaucoup plus grand dans un laïque qui a épousé deux femmes de remplir ainsi des fonctions sacerdotales, quand <strong>le prêtre qui a été deux fois marié</strong> est dépouillé du sacerdoce ? — Mais, diras-tu, la nécessité porte avec soi son excuse. Il n’y a pas d’excuse pour la nécessité qui peut ne pas être. N’épouse pas deux femmes, et tu ne t’exposes pas à la nécessité d’administrer ce qui n’est pas permis à l’homme marié deux fois. Dieu veut que nous soyons disposés de manière à pouvoir en tout temps approcher de ses sacrements. « Il n’y a qu’un Dieu, qu’une foi, » et qu’une loi conséquemment. <strong>Si les <mark>laïques, du milieu desquels on choisit les prêtres</mark>, n’observent pas les conditions aux-quelles est soumis le sacerdoce, comment pourra-t-on choisir des <mark>prêtres</mark> parmi les laïques !</strong> <strong>Nous devons donc prévenir le laïque et empêcher qu’il ne se marie deux fois, puisque l’on ne peut élever un laïque au <mark>sacerdoce</mark> que dans le cas où il n’a pas contracté deux mariages.</strong> … Te présenteras-tu donc devant le Seigneur avec autant de femmes que tu en recommandes dans les prières ? <strong>Offriras-tu le saint sacrifice pour deux femmes ? Et cela par les mains d’<mark>un prêtre</mark></strong> qui doit son ordination à sa monogamie, ou même qui a été sanctifié par sa virginité, et qu’entourent des vierges, ou des femmes qui n’ont été mariées qu’une fois ?</em></p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/Trll_Exhortation_%C3%A0_la_Chastet%C3%A9">Exhortation à la Chasteté, chapitre 7</a>)</p><p>Sur la manière dont les hérétiques imitent l’Église, sans avoir en eux-mêmes aucun ordre :</p><blockquote><p><em>40. Si l’on demande qui inspire les hérésiarques, je répondrai que c’est <strong>le démon, dont l’office est de dérober aux hommes la vérité, et qui prend à tâche d’imiter dans les mystères des faux dieux les saintes cérémonies de la religion chrétienne</strong>. Il plonge aussi dans l’eau ses adorateurs, et leur fait croire qu’ils trouveront dans ce bain l’expiation de leurs crimes ; il marque au front les soldats de Mithra lorsqu’on les initie ; il célèbre l’oblation du pain ; il offre une image de la résurrection, et présente à la fois la couronne et le glaive ; il défend à son souverain pontife les secondes noces ; il a même ses vierges. Au reste, si nous examinons les superstitions que Numa a instituées, les fonctions des prêtres, leurs ornements, leurs privilèges, les cérémonies, les vases, et généralement tout ce qui est nécessaire pour les sacrifices, ce qui regarde les expiations et les vœux, nous ne pourrons douter que le démon n’ait voulu copier les rites de la loi mosaïque. Or, <strong>celui qui a affecté d’appliquer au culte des idoles tout ce que nous pratiquons dans la célébration de nos mystères,</strong> n’a pas manqué de faire aussi servir nos livres saints à établir une doctrine sacrilège et ennemie de la nôtre : il a pour cela altéré et le sens, et les termes, et les figures. Il est donc certain que c’est le démon qui a inspiré tous les hérésiarques, et que <strong>l’hérésie ne diffère pas au fond de l’idolâtrie, puisqu’elles ont le même auteur qui les a formées toutes les deux sur le même dessin. Si toutes les hérésies ne supposent pas un dieu ennemi du Créateur, du moins elles représentent celui-ci tout autre qu’il n’est. Or, tout mensonge, toute fausseté qui a pour objet la Divinité, est une espèce d’idolâtrie.</strong></em></p><p><em>41. Je ne dois pas omettre de décrire ici <strong><mark>la conduite des hérétiques, combien elle est frivole</mark>, terrestre, humaine, sans gravité, sans autorité, sans discipline, parfaitement assortie à leur foi</strong>. <strong><mark>On ne sait qui est catéchumène, qui est fidèle</mark></strong> ; ils entrent, ils écoutent, ils prient pêle-mêle, et même avec des païens, s’il s’en présente : ils ne se font pas scrupule de donner les choses saintes aux chiens, et de semer des perles (fausses, à la vérité) devant les pourceaux. <strong><mark>Le renversement de toute discipline, ils l’appellent simplicité, droiture ; et notre attachement à la discipline, ils le traitent d’affectation</mark></strong>. <strong><mark>Ils donnent la paix à tout le monde indifféremment. Opposés les uns aux autres dans leur croyance, tout leur est égal, pourvu qu’ils se réunissent pour triompher de la vérité</mark></strong>. Tous sont enflés d’orgueil, tous promettent la science. Les catéchumènes sont parfaits, avant que d’être instruits. Et leurs femmes, que ne se permettent-elles pas ? elles osent dogmatiser, disputer, exorciser, promettre des guérisons, peut-être baptiser. <strong>Leurs ordinations se font au hasard, par caprice et sans suite. Tantôt ils élèvent des néophytes, tantôt des hommes engagés dans le siècle, tantôt même nos apostats, pour s’attacher par l’ambition ceux qu’ils ne peuvent retenir par la vérité</strong>. <strong>Nulle part on n’avance, comme dans le camp des rebelles où la rébellion tient lieu de mérite</strong>. <strong>Aussi ont-ils aujourd’hui un évêque, et demain un autre ; celui qui est diacre aujourd’hui, sera demain lecteur ; le prêtre redeviendra laïque, car <mark>ils chargent les laïques des fonctions sacerdotales</mark>.</strong></em></p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/Trll_Des_Prescriptions">Des Prescriptions contre les hérétiques</a>)</p><h3>Les trois ordres de la hiérarchie sacerdotale</h3>
      <blockquote>
      <p><em>« Il me reste, pour terminer cette courte matière, à dire quelques mots sur la discipline qu’il faut observer dans l’administration et la réception du baptême. </em><strong><em>Le droit de le conférer appartient au grand-prêtre (summus sacerdos), qui est <mark>l’évêque</mark> ; après lui aux <mark>prêtres</mark> et aux <mark>diacres</mark></em></strong><em>, jamais toutefois sans la permission de l’évêque, par honneur pour l’Église : toutes les fois que cet honneur est maintenu, la paix l’est aussi. Du reste, les laïques ont quelquefois ce pouvoir. Ce qui est communiqué sans réserve (ex aequo) ne peut-il pas l’être de même, saut néanmoins que </em><strong><em><mark>les évêques, les prêtres, les diacres</mark></em></strong><em>, sont appelés les disciples de Jésus-Christ. »</em></p>
      </blockquote>
      <p>(<a href="https://bibleox.com/fr/fr/w/Trll_Du_Bapt%C3%AAme">Du Baptême</a>)</p>
      <h3>Les chrétiens font le signe de la croix sur eux-mêmes et sur les objets</h3>
      <blockquote>
      <p><em>S’agit-il de nous mettre en voyage ou de marcher, d’entrer ou de sortir, de nous habiller, de nous chausser, de descendre au bain, de nous mettre à table, de prendre de la lumière, de nous asseoir, ou d’entrer au lit, quelque chose que nous fassions, </em><strong><em><mark>nous marquons notre front du signe de la croix</mark></em></strong><em> (signaculo terimus).</em></p>
      </blockquote>
      <p>(<a href="https://bibleox.com/fr/fr/w/Trll_De_la_Couronne_du_soldat">De la Couronne du soldat, III</a>)</p>
      <blockquote>
      <p><em>« Voilà ce que j’avais à dire pour réhabiliter la chair considérée dans l’aspect général de la nature humaine. Voyons maintenant par les dons qui lui appartiennent en propre, combien de prérogatives le nom de chrétien communique devant Dieu à cette frôle et abjecte substance. Certes, il suffirait à la chair que nulle âme ne pût absolument obtenir le salut à moins de croire, pendant qu’elle est dans la chair : tant il est vrai que la chair est la base du salut. Enfin, quand l’âme est enrôlée au service de Dieu, c’est la chair qui la met à même de recevoir cet honneur. C’est la chair en effet qui est lavée pour que l’âme soit purifiée ; la chair sur laquelle on fait les onctions pour que l’âme soit consacrée ; </em><strong><em><mark>la chair qui est marquée du signe sacré pour que l’âme soit fortifiée</mark></em></strong><em> ; la chair qui est couverte par l’imposition des mains pour que l’âme soit illuminée par l’esprit ; la chair enfin qui se nourrit du corps et du sang de Jésus-Christ, pour que l’âme s’engraisse de la substance de son Dieu. Elles ne peuvent donc être séparées dans la récompense, puisqu’elles sont associées dans le travail. »</em></p>
      </blockquote>
      <p>(<a href="https://bibleox.com/fr/fr/w/Trll_De_la_R%C3%A9surrection_de_la_chair">De la Résurrection de la chair</a>)</p>
      <blockquote>
      <p><em>Réussirez-vous à vous cacher, lorsque </em><strong><em><mark>vous faites sur votre lit et sur votre corps des signes de croix</mark></em></strong></p>
      </blockquote>
      <p>(<a href="https://bibleox.com/fr/fr/w/Trll_%C3%80_sa_Femme">À sa Femme</a>)</p>
      <h3>La sanctification de la matière (l’eau)</h3>
      <blockquote>
      <p><em>L’Esprit de Dieu qui, avant le création, était porté sur les eaux, nous indiquait d’avance que sa majesté reposerait sur l’eau de la régénération ; car la sainteté ne pouvait être portée que sur une chose sainte, ou bien, la matière qui portait, empruntait sa sanctification à ce qui était porté. Et attendu que toute matière inférieure participe nécessairement aux qualités de celle qui la domine, la substance corporelle devait entrer en communication avec la substance spirituelle, d’autant plus que cette dernière peut aisément par sa subtilité pénétrer et animer sa voisine. Ainsi, </em><strong><em>la nature des eaux, sanctifiée par l’Esprit saint, a conçu par là même le pouvoir de sanctifier l’homme dans ce sacrement</em></strong><em>. Et qu’on ne vienne pas me dire : Est-ce que nous sommes baptisés aujourd’hui dans les mêmes eaux que celles qui furent au commencement du monde ? Non, répondrai-je, elles ne sont pas absolument les mêmes. Elles s’y rapportent toutefois comme des espèces différentes à un genre unique. Or, les attributs du genre se retrouvent dans l’espèce. Aussi baptisés dans la mer ou dans un étang, dans un fleuve ou dans une fontaine, dans un lac ou dans un bassin, qu’importe ? il n’y a sur ce point aucune différence entre ceux que Jean régénère dans le Jourdain et Pierre dans le Tibre. L’eunuque, que Philippe baptisa en chemin d’une eau que le hasard lui offrit, n’emporta ni plus ni moins de grâce. Toute eau naturelle acquiert donc, par l’antique prérogative dont elle fut honorée à son origine, </em><strong><em><mark>la vertu de sanctification dans le sacrement</mark></em></strong><em>, pourvu que Dieu soit invoqué à cet effet. Aussitôt que les paroles se prononcent, </em><strong><em>l’Esprit saint, descendu des cieux, s’arrête sur les eaux qu’il sanctifie par sa fécondité</em></strong><em> ; </em><strong><em><mark>les eaux ainsi sanctifiées s’imprègnent à leur tour de la vertu sanctifiante</mark></em></strong><em>.</em></p>
      <p><em>D’ailleurs, elles ont un rapport direct avec les desseins de Dieu dans cette opération. La tache du péché nous avait souillés ; les eaux nous lavent de ces souillures. Mais comme les péchés ne paroissent pas sur la chair, car personne ne porte à l’extérieur les marques de l’idolâtrie, de l’adultère ou du mensonge, ils impriment leur difformité dans l’ame, où se consomme principalement la faute. C’est l’esprit qui commande ; la chair obéit en esclave. Cependant la faute est commune à tous deux, à l’esprit, parce qu’il commande, à la chair, parce qu’elle obéit. Ainsi, dès que les eaux ont reçu comme une vertu médicinale par l’intervention de l’ange de Dieu, l’ame y est lavée au moyen du corps, et la chair purifiée au moyen de l’esprit.</em></p>
      <p><em>Les Gentils eux-mêmes, tout étrangers qu’ils sont à l’intelligence des choses spirituelles, attribuent à leurs idoles la même efficacité. Mais leurs eaux, vides de vertu, ne sont que mensonge et illusion.</em></p>
      <p><em>…</em></p>
      <p><em>Si donc l’aveuglement des Gentils reconnaît à l’eau, </em><strong><em>par suite de sa destination naturelle, la propriété d’effacer les crimes, avec combien plus de vérité <mark>remplira-t-elle cet office par l’autorité d’un Dieu</mark></em></strong><em>, créateur des éléments et de leurs propriétés ! — La religion, disent-ils, communique à l’eau une vertu salutaire. — Mais quelle plus sainte religion que celle du Dieu vivant !</em></p>
      </blockquote>
      <p>(<a href="https://bibleox.com/fr/fr/w/Trll_Du_Bapt%C3%AAme">Du Baptême</a>)</p>
      <h3>La rémission des péchés dans le baptême d’eau et les autres effets invisibles du baptême</h3>
      <blockquote>
      <p>O dieu pervers sur tous les points, partout convaincu de démence, vain dans chacune de ses opérations ! Dès qu’on l’approche, tout croule sous la main, et son essence, et sa nature, et ses créations, et sa sagesse, tout, jusqu’au sacrement de sa foi. En effet, à quoi bon <strong><mark>le baptême</mark></strong> dans ce culte ? Y verrai-je <strong><mark>une rémission des péchés</mark></strong> ? Comment remettre les péchés, quand on est impuissant à les retenir ? Pour les retenir, il faudrait châtier. <strong><mark>La résurrection après la mort</mark></strong> ? Comment arracher la victime aux bras de la mort, quand on ne l’a pas enchaînée à la mort ? Pour l’enchaîner, il fallait la condamner originairement. <strong><mark>Une régénération de l’homme</mark></strong> ? Mais on ne régénère que quand on a engendré. Point de réitération à qui n’a pas agi une première fois. <strong><mark>La réception de l’Esprit saint</mark></strong> ? Comment conférera-t-il l’Esprit saint, celui qui n’a pas donné l’ame dans le principe ? L’ame est, en quelque façon, le complément de l’esprit. Que fait-il donc ? Il marque de son signe l’homme dont l’empreinte divine n’a jamais été brisée chez lui ; il lave dans son baptême l’homme qui n’a jamais contracté de souillure chez lui ; enfin, dans ce sacrement, où réside le salut tout entier, il plonge une chair déshéritée du salut. Demandez à l’agriculteur d’arroser une terre qui ne lui rapportera aucun fruit, il s’en gardera bien, à moins d’être aussi insensé que le dieu de Marcion.</p>
      </blockquote>
      <p>(<a href="https://bibleox.com/fr/fr/w/Trll_Contre_Marcion_1">Contre Marcion, livre I, 28</a>)</p><h3>Le baptême des enfants avec leurs parrains (répondants)</h3><p>Tertullien est témoin du baptême des enfants et de l’institution des parrains dans l’Église, mais il réfléchit à ce qu’il vaut mieux ne pas se hâter de baptiser les enfants, les vierges et les veuves, car des tentations les attendent. Puisque dans le baptême les péchés sont remis, et que le baptême ne peut être conféré à un homme qu’une seule fois, Tertullien propose de franchir la période dangereuse de la vie, puis de recourir au baptême. Cette manière de voir acquit quelque popularité dans le peuple et fut condamnée au IVe siècle par les saints Pères (Grégoire le Théologien, Basile le Grand, Jean Chrysostome, Grégoire de Nysse, l’auteur des Constitutions apostoliques, voir <a href="https://bibleox.com/fr/ru/w/hHT1sVOS_%D0%9A%D1%80%D0%B5%D1%89%D0%B5%D0%BD%D0%B8%D0%B5_%D0%BC%D0%BB%D0%B0%D0%B4%D0%B5%D0%BD%D1%86%D0%B5%D0%B2/">ici (en russe)</a>). Quoi qu’il en soit, Tertullien consigne un fait historique de l’Église : l’Église baptise les enfants, et de surcroît en présence de parrains qui prennent sur eux l’engagement d’élever l’enfant dans la foi.</p><p>Il convient de relever à part le fait que Tertullien atteste aussi la foi de l’Église en la rémission des péchés dans le baptême d’eau, ce que nient les protestants, pour lesquels ce ne sont là que des signes. C’est précisément la foi en la rémission des péchés dans le baptême d’eau qui poussait Tertullien à proposer d’user de cette rémission le plus tard possible, une fois franchi l’étape de la vie où les hommes commettent de graves péchés. En outre, toute la pensée de Tertullien se fonde sur le fait que les chrétiens peuvent pécher après le baptême, ce que nient également beaucoup de protestants.</p><blockquote><p><em>La bonté de Dieu se distingue à certaines prérogatives. Au reste, toute demande peut tromper ou être trompée. Il est donc plus utile de différer le baptême d’après l’état, la disposition et l’âge de chacun, mais surtout par rapport aux enfants : <strong>pourquoi, en effet, exposer au péril <mark>ceux qui répondent pour eux</mark> ?</strong> La mort ne peut-elle pas les empêcher d’acquitter leurs promesses ? <strong>S’ils vivent</strong>, <strong>le mauvais naturel des enfants</strong> <strong>ne peut-il pas tromper leurs espérances ?</strong> Il est bien vrai que notre Seigneur a dit : « Laissez-les venir à moi ! » Qu’ils viennent donc, mais quand ils seront plus âgés ; qu’ils viennent, mais quand ils auront étudié, et qu’il leur aura été enseigné pourquoi ils viennent ; qu’ils soient marqués du sceau des Chrétiens, mais quand ils auront pu connaître Jésus-Christ. <strong>Pourquoi l’âge de l’innocence <mark>court-il</mark> à la <mark>rémission des péchés</mark> ?</strong> On en use avec plus de précaution pour les choses du siècle : confierons-nous les trésors du ciel à qui nous ne confierions pas ceux de la terre ? Que les enfants apprennent donc à demander le salut, afin qu’il ne semble accordé qu’à ceux qui le demandent. <strong>Les motifs pour ajourner les adultes qui ne sont pas encore engagés dans le mariage, ne sont pas moins décisifs.</strong> <strong>La liberté les expose à trop de tentations</strong>, <strong>les vierges</strong> par la maturité de leur âge, <strong>les veuves</strong> par la privation ; <strong>il faut attendre qu’elles soient mariées</strong> ou <strong>affermies dans la continence</strong>. Si l’on comprenait bien quel est le fardeau du baptême, on craindrait plus de le recevoir que de le différer : la foi parfaite n’a rien à redouter pour le salut.</em></p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/Trll_Du_Bapt%C3%AAme">Du Baptême, chapitre 18</a>)</p><h3>Du culte de la croix et des images</h3><p>Les chrétiens « tiennent pour sacré » le bois de la Croix ; ils sont « prêtres de la Croix » — Tertullien ne récuse pas cette accusation :</p><blockquote><p><em>Quant à </em><strong><em>ceux qui prétendent que nous adorons une croix</em></strong><em>, ils sont de la même religion que nous. La qualité de la Croix est d’être chez nous un étendard de bois. Vous, vous adorez la même matière sous toutes ses transformations. Votre étendard, à vous, a une figure humaine ; le nôtre a sa figure particulière : qu’importent les linéaments, pourvu que la qualité soit identique ? qu’importe la forme, pourvu que le corps du Dieu soit le même ? Si vous disputez sur la différence, y a-t-il grande différence d’une croix à la Pallas athénienne, à la Cérès du Phare, qui n’est autre chose qu’une pièce de bois grossière, informe et sans figure ? Tout poteau dressé en l’air est la moitié d’une croix, et même la moitié la plus forte. Vous nous reprochez d’adorer une croix complète avec son antenne et sa partie supérieure. A merveille. Vous êtes par là même d’autant moins excusables d’adorer un bois mutilé et incomplet, tandis que les autres </em><strong><em>le consacrent</em></strong><em> dans la plénitude de sa forme.</em></p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/Trll_Aux_Nations"><em>Tertullianus.</em> Ad Nationes, I 11-12 // PL. 1. Col. 577-578</a>) (après 197)</p><p>Toutes les images ne tombent pas sous la définition de l’idolâtrie, et toutes ne sont pas interdites :</p><blockquote><p><em>De même quand il dit : « Tu ne feras point d’idole taillée ni aucune image de ce qui est au ciel, ni de ce. qui est sur la terre, ni de ce qui est sous les eaux, » ces défenses songeaient à prévenir l’idolâtrie. Car il ajoute : « Tu ne les adoreras point ; Tu ne les serviras point. » Quant au serpent d’airain, que Moïse façonna dans la suite d’après les ordres du Seigneur, </em><strong><em>étranger à toute pensée d’idolâtrie</em></strong><em>, il était destiné à guérir ceux qu’avaient blessés les serpents. Je te fais grâce du remède divin dont il était l’emblème. De même du chérubin et du séraphin d’or battu qui couvraient le propitiatoire de l’arche d’alliance : décoration innocente, en harmonie avec la majesté de l’arche sainte, et placée là pour des raisons bien différentes du principe idolâtrique qui avait provoqué l’interdiction de toute image taillée, ils ne sont point en contradiction avec la défense précédente, </em><strong><em>puisqu’ils n’ont rien de commun avec les idoles que proscrit la loi</em></strong><em>.</em></p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/Trll_Contre_Marcion_2"><em>Tertullien. </em>Contre Marcion, II 22. Saint-Pétersbourg, 2010, p. 172</a>)</p><p>Ce raisonnement fait écho à la façon dont le culte des icônes fut défendu plus tard (voir <a href="https://bibleox.com/fr/ru/w/%D0%B8%D0%BA%D0%BE%D0%BD%D1%8B-%D0%BF%D0%BE%D1%87%D0%B8%D1%82%D0%B0%D1%8E%D1%82">ci-dessous (en russe)</a> les citations du vénérable Jean Damascène). En toute chose, l’essentiel est le but : l’acte est-il accompli pour la vérité ou pour le mensonge ?</p><blockquote><p><em>Nous avons parlé de la bienfaisante sagesse qui avait présidé à l’institution des sacrifices. Ils étaient destinés à éloigner le peuple du paganisme. Que si Dieu rejeta par la suite ces offrandes : « Qu’ai-je besoin de la multitude de vos sacrifices ? etc. » il voulait nous faire comprendre qu’il n’avait point à ces cérémonies un intérêt personnel : « Je ne boirai plus désormais, dit-il, le sang des taureaux, » parce qu’ailleurs il avait dit : Le « Dieu éternel n’aura ni faim ni soif. » Il a beau abaisser un regard de complaisance sur les victimes d’Abel, et respirer avec délices les holocaustes de Noë, quelle si grande suavité pouvait-il trouver dans les entrailles d’une génisse, ou quel parfum dans l’odeur des victimes consumées par le feu ? Mais </em><strong><em>l’ame pure et craignant le Seigneur </em></strong><em>de ceux qui offraient à l’Eternel les dons de sa munificence, voilà quel était son plus délicieux aliment et le parfum de suavité qui montait vers lui. Qu’importaient à sa félicité les sacrifices de l’univers ? </em><strong><em>H les revendiquait, <mark>seulement à titre</mark> d’<mark>hommages dus à sa majesté</mark>.</em></strong><em> Un client offre à un grand de la terre, ou à un prince qui n’a besoin de rien, un présent quel qu’il soit. La qualité ou la quantité de l’offrande, même la plus vulgaire, déshonore-t-elle l’homme opulent, ou bien </em><strong><em><mark>cette respectueuse déférence réjouit-elle son cœur</mark></em></strong><em> ?</em></p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/Trll_Contre_Marcion_2"><em>Tertullien. </em>Contre Marcion, II 22. Saint-Pétersbourg, 2010, p. 172-173</a>)</p><p>L’image doit correspondre à la vérité :</p><blockquote><p><em>Or, si ces symboles nous désignaient nous-mêmes ( « car nous sommes et les temples de Dieu » et ses autels, et ses flambeaux et ses vases), ils signifiaient aussi en figure que les hommes de Dieu ne doivent pas se couronner. </em><strong><em>L’image devra correspondre à la vérité</em></strong><em>.</em></p></blockquote><p>(<a href="https://azbyka.ru/otechnik/Tertullian/o-ventse-voina/">De la Couronne du soldat (en russe)</a>)</p><p>Après son passage de l’Église au montanisme, Tertullien critique l’Église pour avoir admis les adultères repentants. L’un des arguments invoqués en faveur de leur admission était, semble-t-il, le livre du « <a href="https://bibleox.com/fr/ru/w/%D0%9F%D0%B0%D1%81%D1%82%D1%8B%D1%80%D1%8C_%D0%95%D1%80%D0%BC%D1%8B">Pasteur d’Hermas (en russe)</a> ». Et il est important ici que, critiquant cet écrit, Tertullien, sorti de l’Église, atteste par ses accusations contre l’Église la présence d’images sacrées dans l’Église : celle-ci se sert d’un calice (pour l’Eucharistie) portant l’image du bon Pasteur (le Christ) :</p><blockquote><p><em>Je me rendrais volontiers, si l’Ecriture du Pasteur[4] avait mérité de prendre place parmi les livres canoniques, ou plutôt si le concile de toutes les Églises, même des vôtres, ne l’avait rangée parmi les livres faux ou apocryphes, adultère elle-même et par cette raison défenseur de ses pareils. Va, elle est bien digne de t’initier, puisqu’elle n’a tout au plus pour elle que </em><strong><em><mark>ce pasteur[5], que tu figures sur le calice</mark></em></strong><em>, profanateur lui-même du sacrement chrétien, véritable idole de l’ivresse, asile de la fornication qui suit l’ivresse, et dont tu ne bois rien plus volontiers que la brebis de la seconde pénitence.</em></p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/Trll_De_la_Pudicit%C3%A9">De la Pudicité, 10</a>) (<a href="https://bibleox.com/it/la/w/lq9x_De_Pudicitia/#HH-10:~:text=patrocinabitur%20pastor%2C%20quem%20in%20calice%20depingis">Tertullianus. De Pudicitia, 10 // PL. 2. Col. 1000</a>)</p><p>Aux IIe-IIIe siècles, le Christ était le plus souvent représenté sous les traits du bon Pasteur (<a href="https://bibleox.com/fr/ru/w/%D0%B4%D1%80%D0%B5%D0%B2%D0%BD%D0%B8%D0%B5-%D0%B8%D0%BA%D0%BE%D0%BD%D1%8B">exemples (en russe)</a>).</p><p>Calices eucharistiques ornés d’icônes : <a href="https://bibleox.com/fr/ru/w/%D0%B4%D1%80%D0%B5%D0%B2%D0%BD%D0%B8%D0%B5-%D0%B8%D0%BA%D0%BE%D0%BD%D1%8B">galerie (en russe)</a>.</p><h3>Existence de l’âme, lieu de séjour des âmes des morts</h3><blockquote><p><em>Aussi, que nous proclamions le jugement à venir de Dieu, on se moque de nos prédications, parce que les poètes et les philosophes ont imaginé un tribunal dans les enfers ! Menaçons-nous de feux souterrains, trésor de colère destiné au châtiment du crime ? Quels longs éclats de rire ! La fable aussi fait couler un fleuve de feu dans le séjour des morts. </em><strong><em><mark>Parlons-nous du paradis, ce lieu de voluptés divines, préparé pour recevoir les ames des saints</mark></em></strong><em>, et séparé de notre globe par une portion de la zone de feu ? Les Champs-Elysées se sont emparés de tous les esprits. Je le demande, qui a pu inspirer aux poètes et aux philosophes des fictions si semblables à nos mystères, sinon nos mystères eux-mêmes, d’ailleurs beaucoup plus anciens ? A nos mystères donc la foi et la certitude, puisque l’on croit même ce qui n’en est que l’ombre et l’image !</em></p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/Trll_Apolog%C3%A9tique">Apologétique, 47</a>)</p><h3>Offrandes (sacrifices) pour les défunts</h3><p>Tertullien fait du jour de la mort des martyrs un jour de naissance (dans le Royaume de Dieu). <a href="https://bibleox.com/fr/ru/w/%D0%BE%D0%BA%D1%80%D1%83%D0%B6%D0%BD%D0%BE%D0%B5-%D0%BF%D0%BE%D1%81%D0%BB%D0%B0%D0%BD%D0%B8%D0%B5-%D0%A6%D0%B5%D1%80%D0%BA%D0%B2%D0%B8-%D0%A1%D0%BC%D0%B8%D1%80%D0%BD%D1%81%D0%BA%D0%BE%D0%B9-%D0%BE-%D0%9F%D0%BE%D0%BB%D0%B8%D0%BA%D0%B0%D1%80%D0%BF%D0%B5">C’est ainsi qu’on appelait (en russe)</a> ce jour dans la communauté de Polycarpe de Smyrne. Cyprien de Carthage, évêque de la même région où écrivait Tertullien, appelle ces mêmes assemblées « fêtes des souffrances et jours des martyrs » :</p><blockquote><p><em>Nous faisons annuellement </em><strong><em>des oblations pour les défunts et pour les nativités des martyrs</em></strong><em>.</em></p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/Trll_De_la_Couronne_du_soldat">De la Couronne du soldat</a>)</p><blockquote><p><em>We offer, on one day every year, oblations for the dead as birth-day honours.</em></p></blockquote><p>(<a href="https://tertullian.org/lfc/LFC10-11_de_corona.htm">De corona (en anglais)</a>)</p><blockquote><p><em>Oblationes pro defunctis, pro nataliciis, annua die facimus.</em></p></blockquote><p>(<a href="https://tertullian.org/latin/de_corona.htm">De corona (en latin, la langue de Tertullien)</a>)</p><h3>Millénarisme</h3><p>Tertullien croyait à la doctrine erronée du règne de mille ans à Jérusalem. Pour plus de détails, voir ici : <a href="https://bibleox.com/fr/ru/w/%D1%85%D0%B8%D0%BB%D0%B8%D0%B0%D0%B7%D0%BC">millénarisme (en russe)</a>.</p>
    references: |-
      <p>Les citations sont empruntées à la traduction d’Antoine-Eugène Genoud, <i>Œuvres complètes de Tertullien</i>, Louis Vivès, 1852, publiée sur ce site. Les citations latines et grecques sont reproduites comme dans la page russe ; les passages absents de cette traduction sont rendus d’après la page de référence.</p><p>Traduction : Rodion Vlasov, avec l’aide de l’IA, d’après la <a href="https://bibleox.com/fr/ru/w/%D1%82%D0%B5%D1%80%D1%82%D1%83%D0%BB%D0%BB%D0%B8%D0%B0%D0%BD">page de référence en russe</a>.</p>
