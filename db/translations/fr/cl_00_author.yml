    body: |-
      <p>Les œuvres de Clément de Rome <strong>en grec ancien</strong> : <a href="https://bibleox.com/fr/grc/w/%CE%9A%CE%BB%CE%AE%CE%BC%CE%B7%CF%82_%CE%A1%CF%8E%CE%BC%CE%B7%CF%82/">voir</a>. Le changement de langue est également possible en haut, au-dessus de la liste des œuvres.</p><p><strong>Jour de mémoire</strong> : 25 novembre (8 décembre).</p><h2>Biographie</h2><p>Il naquit au Ier siècle après Jésus-Christ. Dans l’Église ancienne, il était vénéré comme l’un des saints chrétiens les plus importants et les plus éminents ; il fut disciple des apôtres Pierre et Paul. Peut-être est-ce lui qui est mentionné dans l’épître aux Philippiens de l’apôtre Paul (Ph 4, 3).</p><p>Certains auteurs (Tertullien, le bienheureux Jérôme de Stridon et saint Épiphane de Chypre) affirment que Clément fut consacré évêque par l’apôtre Pierre. Aucune donnée fiable sur son ministère et sa mort ne nous est parvenue. Ainsi, dans les années 80 ou 90 du IIe siècle, le hiéromartyr Irénée de Lyon affirmait que, parmi les évêques de Rome, seul saint Télésphore (127/8-137/8) avait subi le martyre. Cependant, à partir du IVe siècle, Clément devint le héros de nombreuses légendes. À partir du VIe siècle, les récits de son martyre à Chersonèse (Crimée) sont largement connus, grâce auxquels la vénération du saint se répandit ensuite en Russie.</p><p>À ce jour, l’un des témoignages les plus éclatants et les plus incontestables de sa personne et de son ministère est l’épître à la communauté de Corinthe parvenue jusqu’à nous (sous forme de copies), écrite par saint Clément à l’occasion de la sédition qui y éclata parmi les chrétiens locaux. Outre l’autorité de l’auteur, l’épître révèle son zèle, son amour et sa sagesse spirituelle.</p><p>Au IIe siècle, le hiéromartyr Irénée de Lyon écrit à propos de cette épître :</p><blockquote><p>3. Les bienheureux apôtres, ayant fondé et organisé l’Église, remirent à Lin le ministère de l’épiscopat. C’est de ce Lin que Paul fait mention dans les épîtres à Timothée. Anaclet lui succède ; après lui, en troisième lieu à partir des apôtres, <strong>reçoit l’épiscopat Clément, qui avait vu les bienheureux apôtres et s’était entretenu avec eux, qui avait encore la prédication des apôtres dans les oreilles et leur tradition devant les yeux</strong> ; au reste, il n’était pas seul, mais beaucoup d’autres demeuraient alors qui avaient été instruits par les apôtres. <strong><mark>Sous ce Clément</mark>, comme une dissension considérable s’était élevée entre les frères de Corinthe, <mark>l’Église de Rome écrivit aux Corinthiens une épître fort utile</mark>, les exhortant à la paix, restaurant leur foi et annonçant la tradition reçue naguère des apôtres</strong>, tradition qui prêche le Dieu unique tout-puissant, Créateur du ciel et de la terre.</p></blockquote><p>(<a href="https://bibleox.com/fr/ru/w/%D0%98%D1%80%D0%B8%D0%BD%D0%B5%D0%B9_%D0%9B%D0%B8%D0%BE%D0%BD%D1%81%D0%BA%D0%B8%D0%B9-%D0%9F%D1%80%D0%BE%D1%82%D0%B8%D0%B2_%D0%B5%D1%80%D0%B5%D1%81%D0%B5%D0%B9-3">Irénée de Lyon, Contre les hérésies, livre III, chap. 3 (en russe)</a>)</p><h2>La foi</h2><h3>Pour le salut, il ne suffit pas de la foi, il faut encore les œuvres</h3><p>Les propos de Clément sur le salut sont divers. Il parle de la justification par les œuvres et de la justification par la foi, ainsi que de la nécessité, pour être sauvé, de chercher et d’accomplir la volonté de Dieu.</p><p>Essayons maintenant de concilier toutes ces paroles.</p><p>Clément parle d’abord de la justification par les œuvres :</p><blockquote><p>Lions-nous étroitement à ceux que Dieu remplit de sa grâce ; que la paix soit comme notre vêtement ; soyons humbles, chastes, attentifs à éviter tout murmure, toute médisance ; <strong><mark>justes en œuvres</mark> et non pas seulement en paroles</strong>.</p></blockquote><p>Ce discours est dirigé contre l’hypocrisie. Pour être sauvé, il faut <u>être</u> vertueux, et non se contenter de parler de la vertu. La cause de l’épître de Clément est une révolte consommée contre les prêtres établis par les apôtres. Clément confond les séditieux en montrant leur hypocrisie. Il invite à se joindre à ceux qui gardent la paix <u>en acte</u>, en rejetant ceux qui ne font que parler de paix tout en divisant l’Église :</p><blockquote><p>Il est donc juste de ne pas se dérober à sa volonté comme des transfuges. <strong>Ce n’est point à des hommes insensés, superbes, <mark>pleins de vanité dans leurs discours</mark>, qu’il faut craindre de déplaire, mais à Dieu</strong>. [Révérons le Seigneur Jésus-Christ, dont le sang a été livré pour nous ; <strong>respectons ceux qui nous gouvernent, honorons nos prêtres</strong>, instruisons les jeunes gens dans la crainte du Seigneur.]</p><p>…</p><p><strong>Attachons-nous étroitement à ceux qui fondent la paix sur la piété, et non à ces hommes qui veulent <mark>une paix fausse et mensongère</mark></strong>.</p><p>…</p><p><strong>Jésus-Christ est avec l’homme qui pense humblement de lui-même, et non avec ceux qui élèvent au-dessus de son troupeau une tête orgueilleuse.</strong></p></blockquote><p>Ainsi, pour le salut, il nous faut des œuvres véritables et non des paroles seulement. Pour être sauvé, il faut être vertueux, et non le paraître.</p><hr><p>Ayant parlé de la nécessité des œuvres véritables, Clément écarte l’autre extrême, en disant que nous ne nous sauvons pas par nous-mêmes, ni par nos seules œuvres, mais par la foi. Autrement dit, nos œuvres, à elles seules, ne conduisent pas au salut. Celui qui ne croit pas au Christ ne sera pas sauvé par lui-même, sans le Christ, quand bien même il aurait de bonnes œuvres :</p><blockquote><p>Et nous aussi, appelés à la connaissance de Jésus-Christ, grâce à cette même volonté, <strong><mark>si nous sommes justifiés</mark>, <u><mark>ce n’est point par nous-mêmes</mark></u></strong>, <strong><u><mark>ni à raison de notre sagesse</mark></u>, de notre intelligence ou de notre piété, ni par aucune <mark>œuvre sainte</mark></strong>, faite avec un cœur pur, <strong><mark>mais par la foi</mark></strong> dont le Dieu tout-puissant s’est toujours servi pour justifier tous ceux qu’il a sauvés.</p></blockquote><hr><p>Plus loin, Clément revient au thème du salut, en décrivant désormais tout le tableau. Pour le salut, il faut : 1) la foi ; 2) la recherche de la volonté de Dieu ; 3) son accomplissement.</p><blockquote><p><strong><mark>Oh ! faisons tous nos efforts</mark></strong> pour être du nombre de ceux qui vivent dans cette attente et <strong><mark>veulent avoir part aux dons qu’il a promis !</mark></strong> <strong><mark>Et comment parviendrons-nous</mark></strong>, mes frères, à ce bonheur<strong><mark> ?</mark></strong></p><p>Nous l’obtiendrons, si notre esprit est toujours ferme dans la foi ;</p><p>si nous cherchons ce qui plaît, ce qui est agréable à Dieu ;</p><p><strong><mark>si nous </mark><u><mark>faisons</mark></u></strong> tout ce qui est conforme à sa volonté sainte ; si nous suivons le chemin de la vérité, rejettant loin de nous l’injustice, l’iniquité, l’avarice, les disputes, les fraudes et les ruses, les murmures et les médisances, la haine de Dieu, l’orgueil et l’ostentation, la fausse gloire et l’amour de la vanité. Car <strong><mark>ceux qui font</mark> le mal sont odieux au Seigneur</strong> ; et non-seulement ceux qui le font, mais encore ceux qui l’approuvent.</p><p>…</p><p><strong><u><mark>Et cette voie</mark></u> <u><mark>où nous trouvons</mark></u> le <u><mark>salut</mark></u>, c’est Jésus-Christ, le pontife qui présente nos offrandes</strong></p></blockquote><p>Sans les bonnes œuvres, nous serons condamnés :</p><blockquote><p>Craignons, mes bien-aimés, <strong>que tant de bienfaits de sa part ne <mark>tournent contre nous</mark>, <mark>si notre vie</mark> n’est pas conforme à sa volonté, <mark>si nous ne faisons point</mark> sous ses yeux ce qu’il lui plaît, dans un esprit d’union et de paix</strong>.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/ClRm_Premi%C3%A8re_%C3%A9p%C3%AEtre_aux_Corinthiens">Première épître aux Corinthiens</a>)</p><hr><p>Toutes les citations sur le salut, à la suite :</p><blockquote><p>Puisque nous pouvons partout voir et entendre ces vérités, craignons le Seigneur ; <strong><mark>renonçons aux désirs impurs, aux œuvres mauvaises</mark></strong>, afin qu’au jugement à venir nous soyons couverts de sa miséricorde.</p><p>…</p><p>Lions-nous étroitement à ceux que Dieu remplit de sa grâce ; que la paix soit comme notre vêtement ; soyons humbles, chastes, attentifs à éviter tout murmure, toute médisance ; <strong><mark>justes en œuvres</mark> et non pas seulement en paroles</strong>.</p><p>…</p><p>Et nous aussi, appelés à la connaissance de Jésus-Christ, grâce à cette même volonté, <strong><mark>si nous sommes justifiés, ce n’est point par nous-mêmes</mark></strong>, <strong><mark>ni</mark></strong> à raison de notre sagesse, de notre intelligence ou de notre piété, ni par aucune <strong><mark>œuvre sainte</mark></strong>, faite avec un cœur pur, <strong><mark>mais par la foi</mark></strong> dont le Dieu tout-puissant s’est toujours servi pour justifier tous ceux qu’il a sauvés.</p><p>…</p><p><strong>Que ferons-nous donc</strong>, mes frères ? Faut-il pour cela cesser de faire le bien, abandonner les œuvres de charité ? Jamais Dieu ne l’approuverait. Portons-nous, au contraire, <strong>avec zèle et ardeur à tous les genres de bonnes œuvres</strong>.</p><p>…</p><p>Comprenons par là que <strong>les bonnes œuvres font l’ornement des justes</strong> ; et Dieu lui-même, après s’être comme paré de ses ouvrages, se réjouit. Puisque nous avons ce modèle sous les yeux, faisons-le revivre en nous, conformons-nous à sa volonté, et <strong>travaillons de toutes nos forces à faire des œuvres de justice</strong>.</p><p>…</p><p><strong>Le bon ouvrier reçoit avec confiance le prix de son travail</strong> ; mais <strong>le lâche, le paresseux n’ose regarder en face le maître qui l’emploie</strong>. <strong>Soyons donc prompts à faire le bien</strong> ; de là dépend tout notre avenir. Car il nous est dit d’avance : « Voici le Seigneur qui vient ; le prix de la victoire est entre ses mains ; <strong>il va rendre à chacun selon ses œuvres</strong>. » (Is 40, 10 ; 62, 11 ; Ap 22, 12)</p><p>…</p><p><strong><mark>Oh ! faisons tous nos efforts</mark></strong> pour être du nombre de ceux qui vivent dans cette attente et <strong><mark>veulent avoir part aux dons qu’il a promis !</mark></strong> <strong><mark>Et comment parviendrons-nous</mark></strong>, mes frères, à ce bonheur<strong><mark> ?</mark></strong></p><p>Nous l’obtiendrons, si notre esprit est toujours ferme dans la foi ;</p><p>si nous cherchons ce qui plaît, ce qui est agréable à Dieu ;</p><p><strong><mark>si nous faisons</mark></strong> tout ce qui est conforme à sa volonté sainte ; si nous suivons le chemin de la vérité, rejettant loin de nous l’injustice, l’iniquité, l’avarice, les disputes, les fraudes et les ruses, les murmures et les médisances, la haine de Dieu, l’orgueil et l’ostentation, la fausse gloire et l’amour de la vanité. Car <strong><mark>ceux qui font</mark> le mal sont odieux au Seigneur</strong> ; et non-seulement ceux qui le font, mais encore ceux qui l’approuvent.</p><p>…</p><p><strong><mark>Et cette voie où nous trouvons le salut, c’est Jésus-Christ, le pontife qui présente nos offrandes</mark></strong></p><p>…</p><p>Et quels sont ces ennemis ? Ceux dont le cœur est mauvais, ceux qui opposent leur volonté à la volonté divine.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/ClRm_Premi%C3%A8re_%C3%A9p%C3%AEtre_aux_Corinthiens">Première épître aux Corinthiens</a>)</p><h3>Les évêques sont les successeurs des apôtres</h3><blockquote><p><em><strong><mark>Les apôtres</mark></strong>, éclairés par Jésus-Christ, ont connu qu’un jour des disputes s’élèveraient dans son Église, au sujet de l’épiscopat ; et voilà pourquoi, d’après cette connaissance certaine qu’ils avaient reçue d’avance, <strong><mark>ils ont établi ceux dont nous avons parlé plus haut</mark>, et ont déterminé un ordre de succession ; <mark>ils ont voulu qu’après leur mort</mark> le ministère et les fonctions qu’ils exerçaient <mark>passassent à des hommes éprouvés</mark></strong>. Les prêtres établis par les apôtres et ceux qui furent choisis depuis par des hommes recommandables avec l’assentiment et l’approbation de toute l’Église, et qui gouvernèrent le troupeau de Jésus-Christ avec une humilité, une modération, une noblesse qui leur a concilié l’estime générale, ces hommes, tel est mon sentiment, ne peuvent sans injustice être exclus de leurs fonctions.</em></p></blockquote><p>(<a href="https://azbyka.ru/otechnik/Kliment_Rimskij/poslanija-k-korinfjanam/#0_45">Première épître aux Corinthiens, chap. XLIV (en russe)</a>)</p><h3>Tous ne sont pas prêtres</h3><blockquote><p>Pour nous, combattons en braves soldats de toutes nos forces, sous ce chef dont les ordres sont toujours justes. Voyons ceux qui portent les armes sous nos princes : avec quel ordre, quelle promptitude, quelle soumission ils exécutent le commandement ! <strong><mark>Tous ne sont pas bons préfets, ni tribuns, ni centurions, ni officiers ; il ne se trouve dans un corps, ni cinquante préfets des soldats, ni cinquante officiers des grades suivants ; mais chacun dans son rang</mark></strong> exécute les ordres du général ou des autres chefs.</p><p>…</p><p>Qu’ainsi se conserve tout ce corps que nous formons en Jésus-Christ ; <strong><mark>que chacun de nous soit soumis à son frère selon la mesure de grâce qui lui a été départie</mark></strong>.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/ClRm_Premi%C3%A8re_%C3%A9p%C3%AEtre_aux_Corinthiens">Première épître aux Corinthiens</a>)</p><h3>La hiérarchie du sacerdoce : trois degrés (évêque, prêtre, diacre)</h3><p>Clément de Rome mentionne les trois degrés du sacerdoce : les évêques, les prêtres et les diacres. Toutefois, en même temps, il n’énumère pas plus de deux degrés. Mais il est des passages où, parlant de l’Ancien Testament, il le projette sur le Nouveau. Et en cet endroit il énumère quatre degrés ecclésiastiques : le souverain pontife, le prêtre, le lévite et le laïc. Aussitôt après, Clément exhorte les fidèles à ne pas sortir de la place de leur ministère. Cela permet de considérer que Clément de Rome connaissait les trois degrés du ministère sacerdotal.</p><blockquote><p>Puisque toutes ces vérités nous ont été dévoilées, puisque nous pénétrons maintenant jusque dans les profondeurs de la science divine, faisons avec ordre tout ce que Dieu nous a prescrit de faire. <strong><mark>Il a voulu</mark> qu’<mark>à des temps marqués, à des heures, à des moments déterminés</mark>, on fît <mark>les offices et les oblations</mark> avec ordre et décence.</strong> Il a même prescrit, d’après sa volonté souveraine, <strong><mark>en quel lieu et par qui serait fait tout ce qui tient à son culte</mark></strong>, afin que toutes les fonctions remplies avec un cœur pur et droit et selon son désir lui fussent agréables. Ainsi donc ceux qui font leurs oblations aux temps marqués sont sûrs d’être agréés, et par là même heureux ; car ils suivent les règles établies par le Seigneur lui-même, et dès lors ils ne peuvent s’égarer. <strong>Chez les Juifs, <mark>le souverain pontife</mark> a des fonctions particulières, <mark>le prêtre</mark> un rang qui lui est propre, <mark>les lévites</mark> un ministère déterminé, <mark>le laïque</mark> des observances qui lui conviennent.</strong></p><p>C’est ainsi, mes frères, que chacun de vous doit, <strong>dans la place où il se trouve, rendre grâce à Dieu</strong>, vivre avec une conscience pure, <strong><mark>sans jamais sortir des règles de son ministère</mark></strong>, ni des bornes de la modestie. Chez les Juifs encore, on n’offre point partout le sacrifice perpétuel, ni le sacrifice pour les vœux, ni le sacrifice pour les péchés et les fautes légères, mais à Jérusalem seulement ; et là même, on ne l’offre pas dans tous les endroits de la ville indistinctement, mais devant le temple, à l’autel, quand la victime a été trouvée bonne par le souverain pontife et les autres prêtres dont nous avons parlé. <strong><mark>Si quelqu’un enfreint les règles que Dieu même a fixées, il est puni de mort.</mark></strong> Vous le comprenez, mes frères : plus les lumières dont nous avons été honorés au sujet du sacrifice l’emportent sur celles des Juifs, plus <strong>il nous faut craindre d’en abuser.</strong></p><p><strong><mark>Les apôtres</mark></strong> nous ont prêché l’Évangile <strong><mark>de la part de notre Seigneur Jésus-Christ</mark></strong>, et Jésus-Christ de la part de Dieu. <strong><mark>Dieu a envoyé Jésus-Christ</mark></strong>, et Jésus-Christ les apôtres ; <strong>tout ici s’est passé régulièrement d’après la volonté du Seigneur</strong>. La mission donnée, <strong><mark>les apôtres</mark></strong> déjà persuadés par le miracle de la résurrection de Jésus-Christ, affermis depuis dans la foi par le Verbe lui-même, pleins des dons de l’Esprit saint, et par là au-dessus de toute crainte, sortirent du Cénacle annonçant l’approche du royaume de Dieu. <strong>Lorsqu’ils annoncèrent la vérité dans les villes et les provinces, ils <mark>éprouvèrent les premiers convertis</mark>, à la faveur des lumières du Saint-Esprit, et les <mark>établirent évêques ou diacres</mark> sur ceux qui devaient croire. Et</strong> <strong><mark>ce n’était pas une innovation</mark></strong>, car depuis longtemps l’Écriture avait parlé d’évêques et de diacres, <strong>puisqu’il est dit quelque part</strong> : « J’affermirai leurs évêques dans la justice et leurs diacres dans la foi. » (Is 60, 17).</p><p>Faut-il s’étonner si <strong><mark>les apôtres, à qui le pouvoir de Jésus-Christ fut confié par le Seigneur lui-même, ont établi ceux dont nous venons de parler</mark></strong>, puisque Moïse, « serviteur fidèle dans toute la maison de Dieu » (He 3, 2.5 ; Nb 12, 7), fut ainsi placé sur toute la maison du Seigneur, et qu’il a consigné dans les livres saints tout ce qui lui fut prescrit ; et il eut en cela pour imitateurs les autres prophètes, qui s’accordent tous à rendre hommage à la sagesse de ses ordonnances. Dans <strong><mark>la rivalité du sacerdoce</mark></strong>, à l’époque de la division des tribus qui se disputaient ce glorieux privilége, Moïse ordonna aux douze chefs de lui présenter des verges sur lesquelles chacun d’eux avait écrit le nom de sa tribu. Moïse les prit, les lia, les marqua du sceau des chefs, et les déposa immédiatement après dans l’arche d’alliance, sur l’autel du Seigneur ; et, les portes fermées, il mit un sceau sur les clés, ainsi qu’il l’avait mis sur les verges, et il dit aux chefs : « Mes frères, la tribu dont la verge aura fleuri sera celle que Dieu choisit pour lui offrir des sacrifices et l’attacher à ce ministère. » Or, le lendemain, au lever du jour, Moïse assemble tout Israël, et, à la vue de six cent mille hommes qui se trouvaient réunis, il montre les sceaux des clés aux chefs des tribus, ouvre le tabernacle d’alliance et tire les verges : et c’est alors qu’on vit que celle d’Aaron n’avait pas seulement des fleurs, mais encore des fruits. <strong>Que pensez-vous de ce prodige ? <mark>Moïse ne l’avait-il pas prévu ? Oui, sans doute</mark>, et il s’en servit pour arrêter la sédition dans le camp d’Israël</strong>, et faire glorifier le nom du seul et vrai Dieu (Jn 17, 3). Gloire soit rendue à ce Dieu dans tous les siècles !</p><p><strong><mark>Les apôtres, éclairés par Jésus-Christ, ont connu</mark></strong> <strong><mark>qu’un jour des disputes s’élèveraient dans son Église, au sujet de l’épiscopat</mark></strong> ; et voilà pourquoi, d’après cette connaissance certaine qu’ils avaient reçue d’avance, <strong><mark>ils ont établi ceux dont nous avons parlé plus haut, et ont déterminé un ordre de succession</mark></strong> ; ils ont voulu qu’après leur mort le ministère et les fonctions qu’ils exerçaient passassent à des hommes éprouvés. <strong>Les prêtres établis par les apôtres et ceux qui furent choisis depuis par des hommes recommandables avec l’assentiment et l’approbation de toute l’Église, et qui gouvernèrent le troupeau de Jésus-Christ avec une humilité, une modération, une noblesse qui leur a concilié l’estime générale, ces hommes, tel est mon sentiment, <mark>ne peuvent sans injustice être exclus de leurs fonctions</mark>.</strong> Nous-mêmes nous ne pourrions, sans nous rendre très-coupables devant Dieu, déposer de l’épiscopat des hommes dont la conduite fut sainte et irréprochable dans l’exercice de leur ministère. Heureux les prêtres qui, parvenus au terme de la carrière, trouvent dans une sainte mort la récompense d’une sainte vie ! ils ne craignent plus de se voir enlever la place qui leur était destinée. Et vous, vous arrachez des ministres du Seigneur d’une vie exemplaire aux fonctions qu’ils exerçaient, non-seulement sans reproche, mais avec honneur !</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/ClRm_Premi%C3%A8re_%C3%A9p%C3%AEtre_aux_Corinthiens">Première épître aux Corinthiens</a>)</p><p>Au-dessus des prêtres il y a un préposé (il est question des diacres en un autre endroit) :</p><blockquote><p>Il est donc juste de ne pas se dérober à sa volonté comme des transfuges. Ce n’est point à des hommes insensés, superbes, pleins de vanité dans leurs discours, qu’il faut craindre de déplaire, mais à Dieu. [Révérons le Seigneur Jésus-Christ, dont le sang a été donné pour nous ; <strong>respectons <mark>nos préposés</mark></strong>, <strong>honorons <mark>nos prêtres</mark></strong>, instruisons nos jeunes gens dans la crainte de Dieu.]</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/ClRm_Premi%C3%A8re_%C3%A9p%C3%AEtre_aux_Corinthiens">Première épître aux Corinthiens</a>)</p><h3>Le sacerdoce possède la grâce</h3><p>Cette affirmation n’est pas si univoque, mais elle demeure néanmoins recevable. Clément écrit sa lettre aux Corinthiens pour mettre fin à la révolte contre les presbytres. Il invite à revenir à ceux qui ont été établis par les apôtres et qui ont servi le troupeau du Christ avec humilité. Mettant sans cesse l’accent sur l’humilité, il ne cesse d’appeler à se joindre aux presbytres qui gardent la paix, à ceux qui ont la grâce :</p><blockquote><p>Puisque nous sommes le partage du Dieu saint, il faut que toutes nos actions tendent à la sainteté ; dès lors <strong>loin de nous</strong> la médisance, l’impureté, l’excès du vin, l’arrogance, toute passion honteuse, l’adultère si odieux, <strong>l’orgueil si détestable</strong>. « Car Dieu, dit l’Écriture, résiste aux superbes et <strong>donne sa grâce <u><mark>aux humbles</mark></u></strong>. » (Pr 41, 34 ; Jc 4, 6 ; 1 P 5, 5) <strong><mark>Lions-nous étroitement à ceux que Dieu remplit de sa grâce</mark></strong> ; que la paix soit comme notre vêtement ; soyons humbles, chastes, attentifs à éviter tout murmure, toute médisance ; justes en œuvres et non pas seulement en paroles.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/ClRm_Premi%C3%A8re_%C3%A9p%C3%AEtre_aux_Corinthiens">Première épître aux Corinthiens, chapitre 30</a>)</p><blockquote><p><strong><mark>Attachons-nous étroitement à ceux qui fondent la paix sur la piété</mark>, et non à ces hommes qui veulent une paix fausse et mensongère</strong>. … <strong><mark>Jésus-Christ est avec </mark><u><mark>l’homme qui pense humblement de lui-même</mark></u>, et non avec ceux qui élèvent au-dessus de son troupeau une tête orgueilleuse</strong>.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/ClRm_Premi%C3%A8re_%C3%A9p%C3%AEtre_aux_Corinthiens">Première épître aux Corinthiens, chapitres 15-16</a>)</p><blockquote><p><strong>Les apôtres</strong>, éclairés par Jésus-Christ, <strong>ont connu qu’un jour des disputes s’élèveraient dans son Église, au sujet de l’épiscopat</strong> ; et voilà pourquoi, d’après cette connaissance certaine qu’ils avaient reçue d’avance, <strong><mark>ils ont établi</mark> ceux dont nous avons parlé plus haut, et <mark>ont déterminé un ordre de succession</mark></strong> ; ils ont voulu qu’après leur mort le ministère et les fonctions qu’ils exerçaient passassent à des hommes éprouvés. <u><mark>Les prêtres établis par les apôtres</mark></u><mark> et ceux qui furent choisis depuis par des hommes recommandables</mark> avec l’assentiment et l’approbation de toute l’Église, et qui <strong><mark>gouvernèrent</mark></strong> le troupeau de Jésus-Christ avec <strong><u><mark>une humilité</mark></u></strong>, une modération, une noblesse qui leur a concilié l’estime générale, ces hommes, tel est mon sentiment, <strong><mark>ne peuvent sans injustice être exclus de leurs fonctions</mark></strong>.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/ClRm_Premi%C3%A8re_%C3%A9p%C3%AEtre_aux_Corinthiens">Première épître aux Corinthiens, chapitre 44</a>)</p><p>À l’appel de Clément de Rome fait écho cette phrase de l’apôtre Paul dans l’épître aux Romains :</p><blockquote><p>« Ayez les mêmes sentiments les uns envers les autres ; n’aspirez point à ce qui est élevé, mais <strong><mark>accommodez-vous aux humbles</mark></strong> ; ne soyez pas sages à vos propres yeux » (Rm 12, 16)</p></blockquote><h3>Le maintien de l’unité visible de l’Église</h3><blockquote><p>Nous tous, qui avons péché par les secrètes surprises de l’ennemi, demandons grâce. <strong>Que les auteurs du schisme consultent l’intérêt de tous. <mark>Ceux qui vivent dans la crainte et dans l’amour de Dieu aiment mieux voir tomber le châtiment sur leurs propres têtes</mark> que sur celles de leurs frères ; <mark>ils préfèrent tourner contre eux-mêmes la sentence de mort</mark>, plutôt que de détruire cette belle et sublime harmonie transmise par nos pères. Ne vaut-il pas mieux avouer sa faute, que d’endurcir son cœur</strong>, à l’exemple de ceux qui se révoltèrent contre Moïse, ce serviteur de Dieu ? Leur punition fut éclatante : ils sont descendus vivants au fond de l’abîme ; la mort les a dévorés (Nb 16).</p><p>…</p><p>Qui d’entre vous est assez généreux, assez humain, assez compatissant pour s’écrier : <strong>Si à cause de moi on se dispute, on se divise, on fait schisme, je cède, je me retire où l’on voudra ; je consens à tout ce que le peuple demande de moi, pourvu que le troupeau de Jésus-Christ, que les prêtres établis pour le gouverner, demeurent dans l’union et dans la paix</strong>. Une gloire immense sera le prix d’une telle conduite ; celui qui saura la tenir est sûr de trouver partout un asile ; car la terre et tout ce qu’elle renferme est au Seigneur (Ps 23, 1). Telle a été et telle sera toujours la conduite de ceux qui vivent de cette vie toute divine qui ne laisse jamais de repentir.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/ClRm_Premi%C3%A8re_%C3%A9p%C3%AEtre_aux_Corinthiens">Épître aux Corinthiens, 1</a>)</p><h3>L’appel à l’obéissance envers le sacerdoce</h3><p>L’épître aux Corinthiens est écrite à cause de la sédition de quelques hommes contre les presbytres établis par les apôtres. Clément loue d’abord les Corinthiens pour leur obéissance passée au sacerdoce :</p><blockquote><p>Vous faisiez tout sans acception de personne ; vous marchiez dans les voies du Seigneur, soumis à vos pasteurs, et rendant à vos vieillards un juste tribut d’hommages.</p><p>…</p><p>Humbles de cœur, exempts de tout orgueil, soumis plutôt que dominateurs, plus portés à donner qu’à recevoir.</p><p>…</p><p>Alors vous jouissiez d’une paix profonde, honorable ; vous éprouviez un désir insatiable de bonnes œuvres.</p><p>…</p><p>La moindre apparence de schisme et de division vous faisait horreur.</p></blockquote><p>Mais il se met ensuite à blâmer la sédition et à exhorter à l’obéissance envers les presbytres établis par les apôtres :</p><blockquote><p><strong><mark>« Les derniers du peuple se soulevèrent contre les grands ; des hommes obscurs, contre ceux qui étaient dans la gloire ; les insensés, contre les sages ; les jeunes gens, contre les vieillards. »</mark> Ah ! si la justice et la paix se sont éloignées, c’est que <mark>la crainte du Seigneur n’habite plus parmi vous ; c’est qu’on s’aveugle au sein même des lumières de la foi</mark></strong> ; c’est qu’on sort de la voie tracée par ses enseignements ; c’est qu’on ne vit plus pour le Christ et d’une manière digne de lui ! Chacun marche au gré de ses passions et fait revivre en soi cette envie inique et impie, à laquelle la mort doit son entrée dans le monde (Sg 2, 24).</p><p>…</p><p>Il est donc juste de ne pas se dérober à sa volonté comme des transfuges. <strong><mark>Ce n’est point à des hommes insensés, superbes, pleins de vanité dans leurs discours, qu’il faut craindre de déplaire, mais à Dieu</mark></strong>. [Vénérons le Seigneur Jésus-Christ, dont le sang a été donné pour nous ; <strong><mark>respectons ceux qui nous sont préposés, honorons les prêtres</mark></strong>, formons les jeunes gens dans la crainte de Dieu.]</p><p>…</p><p><strong><mark>La justice, la piété, nous font un devoir d’obéir à ce Dieu plutôt que de suivre, dans les voies de l’orgueil et de la rébellion, ceux qui ont donné l’exemple d’une détestable jalousie</mark></strong>. <strong><mark>C’est s’exposer non à une perte légère, mais au plus grand péril, que de céder aveuglément à l’impulsion de ces hommes qui poussent aux querelles et aux discordes</mark></strong> pour nous écarter du droit chemin.</p><p>…</p><p>Nous tous, qui avons péché par les secrètes surprises de l’ennemi, demandons grâce. <strong>Que les auteurs du schisme consultent l’intérêt de tous. Ceux qui vivent dans la crainte et dans l’amour de Dieu <mark>aiment mieux voir tomber le châtiment sur leurs propres têtes que sur celles de leurs frères</mark></strong> ; <strong><mark>ils préfèrent tourner contre eux-mêmes la sentence de mort, plutôt que de détruire cette belle et sublime harmonie transmise par nos pères</mark></strong>. Ne vaut-il pas mieux avouer sa faute, que d’endurcir son cœur, à l’exemple de ceux qui se révoltèrent contre Moïse, ce serviteur de Dieu ? Leur punition fut éclatante : ils sont descendus vivants au fond de l’abîme ; la mort les a dévorés (Nb 16).</p><p>…</p><p>Qui d’entre vous est assez généreux, assez humain, assez compatissant <strong><mark>pour s’écrier : Si à cause de moi on se dispute, on se divise, on fait schisme, je cède, je me retire où l’on voudra ; je consens à tout ce que le peuple demande de moi, pourvu que le troupeau de Jésus-Christ, que les prêtres établis pour le gouverner, demeurent dans l’union et dans la paix</mark></strong>. Une gloire immense sera le prix d’une telle conduite ; celui qui saura la tenir est sûr de trouver partout un asile ; car la terre et tout ce qu’elle renferme est au Seigneur (Ps 23, 1).</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/ClRm_Premi%C3%A8re_%C3%A9p%C3%AEtre_aux_Corinthiens">Première épître aux Corinthiens</a>)</p><h3>Les fauteurs de trouble parlent de paix avec hypocrisie</h3><blockquote><p><strong>Attachons-nous étroitement à ceux qui fondent la paix sur la piété, et non à ces hommes qui veulent une paix fausse et mensongère</strong>.</p><p>…</p><p><strong>Jésus-Christ est avec l’homme qui pense humblement de lui-même, et non avec ceux qui élèvent au-dessus de son troupeau une tête orgueilleuse</strong>.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/ClRm_Premi%C3%A8re_%C3%A9p%C3%AEtre_aux_Corinthiens">Première épître aux Corinthiens, chapitre 15</a>)</p><h3>Les chrétiens péchaient parfois</h3><p>Les chrétiens péchaient parfois, y compris les uns envers les autres :</p><blockquote><p>Remplis d’un zèle saint et d’une pieuse ardeur, vous éleviez vos mains vers le Tout-Puissant avec une tendre confiance, <strong>le suppliant de vous pardonner s’il vous échappait <mark>quelques fautes involontaires</mark></strong>.</p><p>…</p><p>On admirait votre candeur, votre simplicité, <strong><mark>votre disposition à pardonner les injures</mark></strong>.</p><p>…</p><p><strong><mark>Vous pleuriez les chutes de vos frères</mark></strong> ; vous vous jugiez coupables de <strong><mark>leurs fautes</mark></strong>.</p><p>…</p><p>« Les derniers du peuple se soulevèrent contre les grands ; des hommes obscurs, contre ceux qui étaient dans la gloire ; les insensés, contre les sages ; les jeunes gens, contre les vieillards. » Ah ! si la justice et la paix se sont éloignées, c’est que la crainte du Seigneur n’habite plus parmi vous ; c’est qu’on s’aveugle au sein même des lumières de la foi ; c’est qu’on sort de la voie tracée par ses enseignements ; c’est qu’on ne vit plus pour le Christ et d’une manière digne de lui ! <strong><mark>Chacun marche au gré de ses passions et fait revivre en soi cette envie inique et impie</mark></strong>, à laquelle la mort doit son entrée dans le monde (Sg 2, 24).</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/ClRm_Premi%C3%A8re_%C3%A9p%C3%AEtre_aux_Corinthiens">Première épître aux Corinthiens</a>)</p><h3>Le souci que la communauté parvienne au salut (elle n’est pas encore sauvée)</h3><blockquote><p>Jour et nuit <strong><mark>vous montriez une tendre sollicitude pour vos frères</mark></strong>, <strong><mark>un désir ardent de voir tous</mark></strong> les élus de Dieu <strong><mark>parvenir au salut</mark></strong> par l’effet de sa miséricorde et par la pureté de leur conscience.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/ClRm_Premi%C3%A8re_%C3%A9p%C3%AEtre_aux_Corinthiens">Première épître aux Corinthiens</a>)</p><h3>Les saints, après la séparation d’avec le corps, sont vivants et se trouvent dans un lieu saint</h3><p>Pierre et Paul sont passés dans un lieu saint :</p><blockquote><p>L’injustice de l’envie a fait passer Pierre par d’innombrables épreuves, qui lui valurent cette couronne du martyre avec laquelle <strong><mark>il est entré dans le séjour de la gloire due à ses combats</mark></strong>. Elle a fait remporter le prix de la patience à Paul, qui fut jeté sept fois en prison, battu de verges et lapidé. Devenu le hérault de l’Évangile, du couchant à l’aurore, il reçut, en récompense de sa foi, une gloire incomparable. Après avoir éclairé le monde entier et s’être avancé jusqu’aux extrémités de l’Occident, il souffrit le martyre par l’ordre des magistrats. C’est ainsi qu’<strong><mark>il abandonna la terre pour aller habiter le séjour même de la sainteté</mark></strong>, nous laissant un sublime exemple de patience.</p><p>…</p><p><strong><mark>À ces hommes d’une vie toute céleste</mark></strong> <strong><mark>vint s’adjoindre une multitude d’élus</mark></strong>, qui furent comme eux en butte à des outrages, à des tourments sans nombre, et comme eux des modèles admirables.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/ClRm_Premi%C3%A8re_%C3%A9p%C3%AEtre_aux_Corinthiens">Première épître aux Corinthiens</a>)</p><h3>Exhortation à se soumettre à la volonté de Dieu (contre le calvinisme)</h3><blockquote><p><strong>Obéissons à cette volonté sainte qui nous comble de biens et d’honneurs</strong> ; implorons humblement la clémence de notre Dieu ; renonçons aux œuvres vaines, à l’esprit de contention et de jalousie qui mène à la mort, pour recourir désormais à la miséricorde divine.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/ClRm_Premi%C3%A8re_%C3%A9p%C3%AEtre_aux_Corinthiens">Première épître aux Corinthiens</a>)</p>
    references: |-
      <p>Les citations de la Première et de la Deuxième épître aux Corinthiens sont empruntées à la traduction d’Antoine-Eugène Genoude, <i>Les Pères de l’Église</i>, t. I, Sapia, 1837, publiée sur ce site. Les passages entre crochets [ ] sont absents de cette traduction et rendus d’après le grec. Les références bibliques suivent la numérotation de la Septante lorsque Clément la suit.</p><p>Traduction : Rodion Vlasov, avec l’aide de l’IA, d’après la <a href="https://bibleox.com/fr/ru/w/%D0%9A%D0%BB%D0%B8%D0%BC%D0%B5%D0%BD%D1%82_%D0%A0%D0%B8%D0%BC%D1%81%D0%BA%D0%B8%D0%B9">page de référence en russe</a>.</p>
  - src: Поликарп_Смирнский
    path: PlKp_Polycarpe_de_Smyrne_Ier_IIe_siècle
    title: "Polycarpe de Smyrne, Ier–IIe siècle"
    title_sub: "hiéromartyr (69-155), évêque de Smyrne, disciple de l’apôtre Jean le Théologien"
    menu: { parent: "Ier siècle", title: "Polycarpe de Smyrne, hiéromartyr (69-155)" }
    meta_desc: "Saint Polycarpe de Smyrne (69-155), évêque et hiéromartyr, disciple de l’apôtre Jean : sa vie, sa doctrine et son épître aux Philippiens."
    update: true
    copy_cover: true
    body: |-
      <p>Les œuvres de Polycarpe de Smyrne <strong>en grec ancien</strong> : <a href="https://bibleox.com/fr/grc/w/%CE%A0%CE%BF%CE%BB%CF%8D%CE%BA%CE%B1%CF%81%CF%80%CE%BF%CF%82_%CE%A3%CE%BC%CF%8D%CF%81%CE%BD%CE%B7%CF%82/">voir</a>. Le passage à d’autres langues est également disponible en haut, au-dessus de la liste des œuvres.</p><p><strong>Jour de mémoire</strong> : 23 février (8 mars).</p><p>Disciple de saint Jean le Théologien, apôtre et évangéliste, et l’un des hommes apostoliques. Maître spirituel, défenseur de la pureté de la foi contre les hérésies. L’un de ses disciples fut Irénée de Lyon, hiéromartyr.</p><h2>Vie</h2><p>Saint Polycarpe, né dans la seconde moitié du Ier siècle, fut disciple de l’apôtre Jean le Théologien. Encore enfant, il resta orphelin et fut adopté par une chrétienne nommée Calliste. Après la mort de celle-ci, il distribua tout son bien aux pauvres et mena une vie austère. Devenu évêque de Smyrne, Polycarpe lutta contre le gnosticisme, étant le théologien le plus estimé d’Asie Mineure.</p><p>Un grand nombre de disciples le suivirent, dont Irénée de Lyon, qui, établi en Occident, devint le transmetteur de la théologie de Polycarpe en Gaule et en Italie. Ainsi <a href="https://bibleox.com/fr/ru/w/%D0%98%D1%80%D0%B8%D0%BD%D0%B5%D0%B9_%D0%9B%D0%B8%D0%BE%D0%BD%D1%81%D0%BA%D0%B8%D0%B9">Irénée de Lyon (en russe)</a> écrit-il au sujet de Polycarpe :</p><blockquote><p><strong>Polycarpe</strong>, qui non seulement <strong>fut instruit par les apôtres et fréquenta un grand nombre de ceux qui avaient vu notre Seigneur, mais encore fut établi par les apôtres évêque de l’Église de Smyrne en Asie</strong>, et que j’ai vu, moi aussi, dans ma première jeunesse — car il vécut longtemps et, dans une vieillesse avancée, termina cette vie par le martyre le plus glorieux et le plus noble —, lui <strong>enseignait toujours</strong> <strong>ce qu’il avait appris des apôtres, ce que l’Église transmet aussi</strong>, et que cela seul est vrai. Toutes les Églises d’Asie en rendent témoignage, ainsi que celles qui ont succédé à Polycarpe jusqu’à aujourd’hui : un tel homme est un témoin bien plus digne de foi et plus sûr de la vérité que Valentin, Marcion et les autres hérétiques. Étant venu à Rome du temps d’Anicet, il ramena à l’Église de Dieu beaucoup de ceux qui étaient tombés dans les hérésies susdites, annonçant qu’il n’avait reçu des apôtres que l’unique vérité transmise par l’Église.</p></blockquote><p>(<a href="https://bibleox.com/fr/ru/w/%D0%98%D1%80%D0%B8%D0%BD%D0%B5%D0%B9_%D0%9B%D0%B8%D0%BE%D0%BD%D1%81%D0%BA%D0%B8%D0%B9-%D0%9F%D1%80%D0%BE%D1%82%D0%B8%D0%B2_%D0%B5%D1%80%D0%B5%D1%81%D0%B5%D0%B9-3">Irénée de Lyon, Contre les hérésies, livre III, ch. 3 (en russe)</a>)</p><p>À saint Polycarpe fut adressée <a href="https://bibleox.com/fr/ru/w/%D0%98%D0%B3%D0%BD%D0%90%D0%BD_%D0%9F%D0%BA">l’une des lettres (en russe)</a> d’<a href="https://bibleox.com/fr/fr/w/vjrY_Ignace_le_Th%C3%A9ophore_Ier_si%C3%A8cle">Ignace le Théophore</a>. Une seule œuvre de Polycarpe lui-même nous est parvenue : l’Épître aux Philippiens. C’est à elle que le hiéromartyr <a href="https://bibleox.com/fr/ru/w/%D0%98%D1%80%D0%B8%D0%BD%D0%B5%D0%B9_%D0%9B%D0%B8%D0%BE%D0%BD%D1%81%D0%BA%D0%B8%D0%B9">Irénée de Lyon (en russe)</a> consacre ces lignes, au IIe siècle :</p><blockquote><p>Il y a une fort utile <strong>lettre de Polycarpe, écrite aux Philippiens</strong>, de laquelle ceux qui le veulent et qui se soucient de leur salut peuvent apprendre à la fois le caractère de sa foi et la prédication de la vérité. De même, l’Église d’Éphèse, fondée par Paul et ayant eu Jean en son sein jusqu’aux temps de Trajan, est un véritable témoin de la tradition apostolique.</p></blockquote><p>(<a href="https://bibleox.com/fr/ru/w/%D0%98%D1%80%D0%B8%D0%BD%D0%B5%D0%B9_%D0%9B%D0%B8%D0%BE%D0%BD%D1%81%D0%BA%D0%B8%D0%B9-%D0%9F%D1%80%D0%BE%D1%82%D0%B8%D0%B2_%D0%B5%D1%80%D0%B5%D1%81%D0%B5%D0%B9-3">Irénée de Lyon, Contre les hérésies, III, 4 (en russe)</a>)</p><p>Il participa à la discussion avec le pape Anicet sur la date de la célébration de Pâques (les communautés d’Asie Mineure la célébraient le 14 nisan, les communautés romaines le premier dimanche après le 14 nisan). Le débat demeura toutefois inachevé, ce qui n’empêcha pas les deux évêques de se séparer en amis. Dans sa quatre-vingt-sixième année, il fut arrêté et, ayant refusé de renier le Christ, brûlé vif. Son martyre fut décrit en détail dans « <a href="https://bibleox.com/fr/ru/w/%D0%BE%D0%BA%D1%80%D1%83%D0%B6%D0%BD%D0%BE%D0%B5-%D0%BF%D0%BE%D1%81%D0%BB%D0%B0%D0%BD%D0%B8%D0%B5-%D0%A6%D0%B5%D1%80%D0%BA%D0%B2%D0%B8-%D0%A1%D0%BC%D0%B8%D1%80%D0%BD%D1%81%D0%BA%D0%BE%D0%B9-%D0%BE-%D0%9F%D0%BE%D0%BB%D0%B8%D0%BA%D0%B0%D1%80%D0%BF%D0%B5">la Lettre circulaire de l’Église de Smyrne (en russe)</a> ».</p><p>C’est là aussi que sont rapportées les paroles de Polycarpe, selon lesquelles il sert le Christ depuis quatre-vingt-six ans :</p><blockquote><p>« Cependant le proconsul insistait et disait : “ Jure, et je te relâcherai ; blasphème le Christ. ” Mais Polycarpe répondit : “ <strong>Voilà quatre-vingt-six ans que je le sers</strong>, et il ne m’a fait aucun mal : comment pourrais-je blasphémer mon Roi, celui qui m’a sauvé ? ” »</p></blockquote><p>(<a href="https://bibleox.com/fr/ru/w/%D0%BE%D0%BA%D1%80%D1%83%D0%B6%D0%BD%D0%BE%D0%B5-%D0%BF%D0%BE%D1%81%D0%BB%D0%B0%D0%BD%D0%B8%D0%B5-%D0%A6%D0%B5%D1%80%D0%BA%D0%B2%D0%B8-%D0%A1%D0%BC%D0%B8%D1%80%D0%BD%D1%81%D0%BA%D0%BE%D0%B9-%D0%BE-%D0%9F%D0%BE%D0%BB%D0%B8%D0%BA%D0%B0%D1%80%D0%BF%D0%B5/">Lettre circulaire de l’Église de Smyrne sur Polycarpe, 45 (en russe)</a>)</p><p>Eusèbe de Césarée (~258-339) écrit sur Polycarpe, en mentionnant et en citant son épître aux Philippiens :</p><blockquote><p>À cette époque, en Asie, <strong>Polycarpe, le compagnon des apôtres</strong>, était particulièrement remarquable : il avait été établi évêque de l’Église de Smyrne par ceux qui avaient vu le Seigneur et qui l’avaient servi.</p><p>…</p><p>13. Et Polycarpe rappelle ce même homme [Ignace le Théophore] dans <strong>son Épître aux Philippiens.</strong> <strong>Citons ses paroles :</strong> « Je vous conjure d’être dociles à ce langage de la vraie justice, de vous exercer de toutes les manières à la patience dont vous avez eu sous les yeux des exemples, non-seulement dans les bienheureux Ignace, Zozime et Rufus, mais encore dans quelques-uns d’entre nous, dans Paul lui-même et dans les autres apôtres ; persuadés comme vous l’êtes que tous ces glorieux martyrs n’ont pas couru en vain, mais selon la foi, mais selon la justice, et qu’ils ont la place qui leur était due dans la société du Seigneur, avec lequel ils ont souffert. Ce n’est pas le siècle présent qu’ils aimaient, mais Jésus-Christ qui est mort pour nous, et que Dieu a ressuscité à cause de nous. » <strong>Et il ajoute ensuite :</strong></p><p>14. « Vous m’avez écrit, vous et Ignace, que si quelqu’un venait en Syrie, j’eusse soin de le charger de mes lettres ; c’est ce que je me propose de faire, si moi ou le député que je vous enverrai nous trouvons une occasion. »</p><p>15. « Je vous fais passer, comme vous l’avez demandé, les lettres qu’Ignace nous a écrites et toutes celles que nous possédions déjà ; elles sont à la suite de celle-ci ; vous en pourrez tirer de grands fruits ; elles renferment des exemples admirables de foi, de patience, en un mot, tout ce qui peut édifier et porter à Dieu. »</p></blockquote><p>(<a href="https://bibleox.com/fr/ru/w/%D0%A6%D0%B5%D1%80%D0%BA%D0%BE%D0%B2%D0%BD%D0%B0%D1%8F_%D0%B8%D1%81%D1%82%D0%BE%D1%80%D0%B8%D1%8F_%D0%BA%D0%BD%D0%B8%D0%B3%D0%B0_3_%E2%80%94_%D0%95%D0%B2%D1%81%D0%B5%D0%B2%D0%B8%D0%B9_%D0%9A%D0%B5%D1%81%D0%B0%D1%80%D0%B8%D0%B9%D1%81%D0%BA%D0%B8%D0%B9">Histoire ecclésiastique, livre III, 36 (en russe)</a>)</p><h2>Hymnographie</h2><p>Tropaire, ton 4 :</p><blockquote><p>Par les mœurs, associé aux apôtres, / et, sur le siège, leur successeur, / tu as trouvé, ô divinement inspiré, / dans l’action l’ascension des visions. / C’est pourquoi, redressant la parole de vérité, / tu as souffert jusqu’au sang pour la foi, / hiéromartyr Polycarpe, / prie le Christ Dieu, // de sauver nos âmes.</p></blockquote><p>Kondak, ton 1 :</p><blockquote><p>Offrant au Seigneur les fruits de la parole, / ô sage Polycarpe, les sacrifices des vertus, / c’est pourquoi tu fus glorifié par Dieu comme un digne hiérarque. / Aussi aujourd’hui, illuminés par tes paroles, / nous chantons ta mémoire digne de louange, // en glorifiant le Seigneur.</p></blockquote><h2>Foi</h2><h3>Les œuvres sont nécessaires au salut</h3><p>Saint Polycarpe, à la suite de l’apôtre Paul (Ep 2, 8-9), dit à l’Église que nous sommes sauvés par la grâce et non par les œuvres : la possibilité du salut est offerte gratuitement aux hommes par le sacrifice de la croix du Seigneur Jésus-Christ et par sa résurrection, et elle n’est pas méritée par nos œuvres. Cependant, ce chemin ouvert gratuitement doit être parcouru : il faut se donner la peine d’accomplir l’œuvre. Aussi n’est-il pas sauvé, celui qui n’accomplit pas la volonté de Dieu et ne marche pas selon les commandements. Ceux-là n’atteindront pas la résurrection pour la vie, mais seront condamnés aux souffrances éternelles :</p><blockquote><p>Jésus-Christ, que vous n’avez pas vu, mais en qui vous croyez, et dont la foi vous fait éprouver des transports d’une joie ineffable, glorieuse, que bien des hommes voudraient partager. Car ils savent que <strong>le salut vous vient de la grâce et non des œuvres</strong>, que vous le devez à la volonté de Dieu par Jésus-Christ.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/PlKp_%C3%89p%C3%AEtre_aux_Philippiens">Épître aux Philippiens, chap. 1</a>)</p><blockquote><p>Le Dieu qui l’a ressuscité d’entre les morts <strong><mark>nous ressuscitera nous-mêmes, </mark><u><mark>si</mark></u><mark> nous faisons sa volonté</mark></strong>, <strong><mark>si nous marchons dans la voie de ses commandements</mark></strong>, <strong>si nous aimons ce qu’il a aimé ; si nous nous abstenons de toute injustice, de toute fraude, de toute avarice, de toute calomnie, de tout faux témoignage, ne rendant point le mal pour le mal, injure pour injure, outrage pour outrage, ni imprécation pour imprécation. N’oublions point les instructions que nous avons reçues du Seigneur : « Ne jugez pas, nous dit-il, et vous ne serez pas jugés ; remettez, et on vous remettra. Soyez miséricordieux, si vous voulez obtenir miséricorde ; on se servira envers vous de la mesure dont vous vous serez servi envers les autres. » Et ailleurs : « Bienheureux les pauvres et ceux qui souffrent persécution pour la justice, car le royaume de Dieu leur appartient. »</strong></p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/PlKp_%C3%89p%C3%AEtre_aux_Philippiens">Épître aux Philippiens, chap. 2</a>)</p><blockquote><p>Nous savons bien qu’on ne se moque pas de lui impunément. Dès lors <strong>marchons d’une manière conforme à ses préceptes, c’est-à-dire à sa volonté</strong>. Que les diacres aussi soient sans reproche aux yeux de sa justice, et n’oublient jamais qu’ils sont ministres de Dieu, de Jésus-Christ, et non des hommes. Qu’ils ne soient dès lors ni calomniateurs, ni doubles en leurs paroles, ni avares ; mais prudents en toutes choses, compatissants, pleins de zèle, <strong><mark>marchant dans la vérité du Seigneur</mark></strong>, qui s’est rendu le serviteur de tous, <strong><mark>qui nous récompensera dans le siècle à venir, si nous avons su lui plaire dans le siècle présent</mark></strong> ; car il nous a promis qu’il nous ressusciterait d’entre les morts et <strong><mark>qu’il nous ferait régner avec lui, si notre vie était pleine de foi et conforme à la sienne</mark></strong>. Que les jeunes gens se montrent de même <strong>irréprochables dans toute leur conduite</strong> ; qu’avant toutes choses ils s’attachent à conserver la pureté des mœurs, <strong>à mettre un frein à toute passion coupable</strong>.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/PlKp_%C3%89p%C3%AEtre_aux_Philippiens">Épître aux Philippiens, chap. 5</a>)</p><h3>L’interprétation de l’Écriture selon la Tradition</h3><blockquote><p>Celui qui nie la vérité du martyre de la croix est un démon ; mais <strong>pour celui qui interprète la parole de Dieu selon ses désirs corrompus</strong>, et ose dire qu’il n’y a ni résurrection, ni jugement, <strong>c’est le fils aîné de Satan</strong>. Quittons les folies, les fausses doctrines de plusieurs, <strong>pour revenir à ce qui nous fut <mark>enseigné</mark> dès le commencement</strong>.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/PlKp_%C3%89p%C3%AEtre_aux_Philippiens">Épître aux Philippiens, 31-32</a>)</p><h3>L’obéissance au sacerdoce</h3><blockquote><p>Il faut bien vous garder de les imiter. Mais <strong>soyez soumis aux prêtres, aux diacres, comme vous l’êtes à Dieu et à Jésus-Christ</strong> ; que les vierges, de leur côté, vivent avec une conscience toujours pure et sans reproche.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/PlKp_%C3%89p%C3%AEtre_aux_Philippiens">Épître aux Philippiens, 24</a>)</p><h3>Les saints défunts vivent déjà au ciel avec le Christ</h3><blockquote><p><em>Car lui (Polycarpe — note), ayant vaincu par la patience le chef inique et ayant ainsi reçu la couronne d’incorruptibilité, </em><strong><em><mark>se réjouissant maintenant avec les Apôtres et tous les justes, il glorifie Dieu</mark></em></strong><em> le Père tout-puissant et bénit notre Seigneur, Sauveur de nos âmes et de nos corps et Pasteur de l’Église catholique universelle</em></p><p><em>…</em></p><p><em>Nous vous souhaitons, frères, de vous affermir et de marcher selon la parole évangélique de Jésus-Christ, à qui soient gloire à Dieu le Père et au Saint-Esprit pour le salut des saints élus ! De même que le bienheureux Polycarpe a accompli son martyre, </em><strong><em><mark>que nous aussi nous soyons trouvés sur ses traces dans le Royaume de Jésus-Christ</mark></em></strong><em>.</em></p></blockquote><p>(<a href="https://bibleox.com/fr/ru/w/%D0%BE%D0%BA%D1%80%D1%83%D0%B6%D0%BD%D0%BE%D0%B5-%D0%BF%D0%BE%D1%81%D0%BB%D0%B0%D0%BD%D0%B8%D0%B5-%D0%A6%D0%B5%D1%80%D0%BA%D0%B2%D0%B8-%D0%A1%D0%BC%D0%B8%D1%80%D0%BD%D1%81%D0%BA%D0%BE%D0%B9-%D0%BE-%D0%9F%D0%BE%D0%BB%D0%B8%D0%BA%D0%B0%D1%80%D0%BF%D0%B5">Lettre encyclique de l’Église de Smyrne sur Polycarpe, 75-85 (en russe)</a>)</p><h3>La venue du Christ pour juger les vivants et les morts</h3><blockquote><p>Tout, en effet, est soumis à Jésus-Christ, au ciel et sur la terre ; tous les esprits lui obéissent ; <strong><mark>il s’avance comme juge des vivants et des morts</mark></strong> ; Dieu redemandera son sang à tout homme qui n’aura pas cru en lui.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/PlKp_%C3%89p%C3%AEtre_aux_Philippiens">Épître aux Philippiens, 6</a>)</p><h3>Tous seront jugés</h3><blockquote><p>Si donc nous demandons à Dieu qu’il nous pardonne, nous devons aussi pardonner. Nous sommes placés sous les regards du Seigneur notre Dieu, et <strong><mark>nous devons tous paraître devant le tribunal de Jésus-Christ</mark></strong>, où <strong><mark>chacun rendra compte pour soi-même</mark></strong>.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/PlKp_%C3%89p%C3%AEtre_aux_Philippiens">Épître aux Philippiens, 27</a>)</p><h3>Les tourments éternels</h3><blockquote><p>Polycarpe répondit : « Tu me menaces d’un feu qui brûle une heure et s’éteint bientôt, car tu ne connais pas <strong><mark>le feu du jugement à venir et du châtiment éternel</mark></strong>, qui est préparé pour les impies. Mais pourquoi tarder ? Fais ce que tu as résolu. »</p></blockquote><p>(<a href="https://bibleox.com/fr/ru/w/%D0%BE%D0%BA%D1%80%D1%83%D0%B6%D0%BD%D0%BE%D0%B5-%D0%BF%D0%BE%D1%81%D0%BB%D0%B0%D0%BD%D0%B8%D0%B5-%D0%A6%D0%B5%D1%80%D0%BA%D0%B2%D0%B8-%D0%A1%D0%BC%D0%B8%D1%80%D0%BD%D1%81%D0%BA%D0%BE%D0%B9-%D0%BE-%D0%9F%D0%BE%D0%BB%D0%B8%D0%BA%D0%B0%D1%80%D0%BF%D0%B5">Lettre encyclique de l’Église de Smyrne sur Polycarpe, 51 (en russe)</a>)</p><h3>S’écarter de ceux qui induisent en erreur</h3><blockquote><p>Ayons une sainte émulation pour le bien ; évitons les scandales, et les faux frères qui confessent le nom du Seigneur avec un cœur hypocrite et <strong>induisent en erreur les esprits légers</strong>.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/PlKp_%C3%89p%C3%AEtre_aux_Philippiens">Épître aux Philippiens, 29</a>)</p><h3>Le jeûne</h3><blockquote><p>Passons les veilles dans la prière, <strong><mark>persévérons dans les jeûnes</mark></strong>, demandons instamment à Dieu qui voit tout de ne pas nous laisser succomber à la tentation, pour me servir ici de ses paroles, car l’esprit est prompt et la chair est faible.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/PlKp_%C3%89p%C3%AEtre_aux_Philippiens">Épître aux Philippiens, 32</a>)</p><h3>La prière pour les autorités</h3><blockquote><p>Priez pour tous les saints, priez aussi <strong>pour les rois, les princes et les puissances</strong>, pour ceux qui vous persécutent, ceux qui vous haïssent, et pour les ennemis de la croix, afin que les fruits de votre foi frappent tous les yeux et qu’alors vous soyez parfaits.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/PlKp_%C3%89p%C3%AEtre_aux_Philippiens">Épître aux Philippiens, 54</a>)</p><h3>Les fidèles vénéraient Polycarpe</h3><blockquote><p>Quand le bûcher fut prêt, Polycarpe ôta tous ses vêtements et, ayant délié sa ceinture, il tenta de se déchausser, ce qu’il ne faisait pas auparavant ; car, à chaque fois, <strong><mark>chaque fidèle s’empressait à l’envi de toucher son corps,</mark> parce que, pour sa vie vertueuse, <mark>une grande vénération lui était rendue dès avant son martyre</mark></strong>.</p></blockquote><p>(<a href="https://bibleox.com/fr/ru/w/%D0%BE%D0%BA%D1%80%D1%83%D0%B6%D0%BD%D0%BE%D0%B5-%D0%BF%D0%BE%D1%81%D0%BB%D0%B0%D0%BD%D0%B8%D0%B5-%D0%A6%D0%B5%D1%80%D0%BA%D0%B2%D0%B8-%D0%A1%D0%BC%D0%B8%D1%80%D0%BD%D1%81%D0%BA%D0%BE%D0%B9-%D0%BE-%D0%9F%D0%BE%D0%BB%D0%B8%D0%BA%D0%B0%D1%80%D0%BF%D0%B5">Lettre encyclique de l’Église de Smyrne sur Polycarpe, 59 (en russe)</a>)</p><h3>Les fidèles vénéraient les reliques de Polycarpe</h3><blockquote><p><em>« Mais lorsque l’envieux, le calomniateur et le méchant adversaire de la race des justes vit la grandeur de son martyre et la vie irréprochable qu’il avait menée dès le commencement ; lorsqu’il vit qu’il était couronné de la couronne d’incorruptibilité et qu’il avait reçu la récompense incontestable, </em><strong><em><mark>il s’efforça d’empêcher que son corps même ne fût enlevé par nous, bien que beaucoup désirassent le faire et avoir part à sa chair sainte</mark></em></strong><em>. Et voici qu’il inspira à Nicétas, père d’Hérode et frère d’Alcé, de s’adresser au proconsul afin qu’il ne livrât point son corps, pour que, </em><strong><em>comme il le disait, abandonnant le Crucifié, nous ne commencions pas à vénérer celui-ci. Cela fut dit sur l’instigation et l’insistance des Juifs, qui nous épièrent, alors que nous allions le retirer du bûcher, sans comprendre que <mark>nous ne pourrons jamais ni abandonner le Christ, qui a souffert pour le salut de tous ceux qui sont sauvés dans le monde, immaculé pour les pécheurs, ni vénérer quelque autre. Car nous l’adorons comme Fils de Dieu ; et les martyrs, comme disciples et imitateurs du Seigneur, nous les aimons comme il convient, pour leur attachement invincible à leur Roi et à leur Maître</mark>.</em></strong><em> Que Dieu nous donne, à nous aussi, d’être leurs compagnons et leurs condisciples ! Le centurion, voyant la chicane des Juifs, plaça </em><strong><em>le corps au milieu, selon leur coutume, et le brûla</em></strong><em>. Et ainsi </em><strong><em><mark>nous avons ensuite recueilli ses os, plus précieux que les pierres précieuses et plus nobles que l’or, et nous les avons déposés là où il convenait. Là, autant qu’il est possible, le Seigneur nous donnera, à nous, réunis dans l’allégresse et la joie, de célébrer le jour de la naissance de son martyr</mark></em></strong><em>, en mémoire de ceux qui ont combattu avant nous, et pour l’instruction et la préparation de ceux qui viendront. Telle fut la vie du bienheureux Polycarpe. Il fut, avec ceux de Philadelphie, </em><strong><em><mark>le douzième martyr de Smyrne</mark></em></strong><em>, mais on se souvient de lui plus que de tous, si bien que les païens eux-mêmes en parlent partout. Il ne fut pas seulement un maître illustre, mais aussi un martyr éminent, </em><strong><em><mark>dont tous désirent imiter le martyre, accompli selon l’Évangile du Christ</mark></em></strong><em>. »</em></p></blockquote><p>(<a href="https://bibleox.com/fr/ru/w/%D0%BE%D0%BA%D1%80%D1%83%D0%B6%D0%BD%D0%BE%D0%B5-%D0%BF%D0%BE%D1%81%D0%BB%D0%B0%D0%BD%D0%B8%D0%B5-%D0%A6%D0%B5%D1%80%D0%BA%D0%B2%D0%B8-%D0%A1%D0%BC%D0%B8%D1%80%D0%BD%D1%81%D0%BA%D0%BE%D0%B9-%D0%BE-%D0%9F%D0%BE%D0%BB%D0%B8%D0%BA%D0%B0%D1%80%D0%BF%D0%B5">Lettre encyclique de l’Église de Smyrne sur Polycarpe (en russe)</a>)</p>
    references: |-
      <p>Les citations de l’Épître aux Philippiens sont empruntées à la traduction d’Antoine-Eugène Genoude, <i>Les Pères de l’Église</i>, t. I, Sapia, 1837, publiée sur ce site. Les citations du Martyre de Polycarpe, d’Eusèbe de Césarée et des hymnes liturgiques, absentes des traductions publiées sur le site, sont traduites du grec.</p><p>Traduction : Rodion Vlasov, avec l’aide de l’IA, d’après la <a href="https://bibleox.com/fr/ru/w/%D0%9F%D0%BE%D0%BB%D0%B8%D0%BA%D0%B0%D1%80%D0%BF_%D0%A1%D0%BC%D0%B8%D1%80%D0%BD%D1%81%D0%BA%D0%B8%D0%B9">page de référence en russe</a>.</p>
  - src: Иустин_Философ_мученик
    path: JsNp_Justin_le_Philosophe_IIe_siècle
    title: "Justin le Philosophe, IIe siècle"
    title_sub: "saint martyr, philosophe (~100-165), originaire de Naplouse (Flavia Neapolis) en Samarie"
    menu: { parent: "IIe siècle", title: "Justin le Philosophe, martyr (~100-165)" }
    meta_desc: "Saint Justin le Philosophe (~100-165), martyr et apologiste : sa vie, sa doctrine, ses Apologies et son Dialogue avec Tryphon."
    update: true
    copy_cover: true
    body: |-
      <p>Les œuvres du martyr Justin <strong>en grec ancien</strong> : <a href="https://bibleox.com/fr/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82-%CE%BF-%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82-%CE%9C%CE%AC%CF%81%CF%84%CF%85%CF%82/">voir</a>. Le passage à d’autres langues est également possible en haut de page, au-dessus de la liste des œuvres.</p><h2>Biographie</h2><p>Mémoire : 1er (14) juin.</p><p>Il naquit à Sichem, l’antique ville de Samarie. Les parents de Justin, des Grecs, étaient païens. Dès l’enfance, le saint se distingua par un esprit profond, l’amour des sciences et un ardent désir de connaître la Vérité. Il étudia à fond les diverses écoles de la philosophie grecque : les stoïciens, les péripatéticiens, les pythagoriciens, les platoniciens, et se convainquit qu’aucune de ces doctrines païennes n’ouvre la voie à la connaissance du vrai Dieu.</p><p>Un jour qu’il se promenait dans un lieu solitaire hors de la ville et se demandait où chercher le chemin de la connaissance de la Vérité, il rencontra un vieillard qui, dans un long entretien, lui révéla l’essence de la doctrine chrétienne et lui conseilla de chercher la solution de toutes les questions de la vie dans les livres de la Sainte Écriture.</p><p>Dans sa trentième année, Justin reçut le saint baptême (entre 133 et 137). À partir de ce moment, il consacra ses dons et ses vastes connaissances philosophiques à la prédication de l’Évangile parmi les païens. Il commença à parcourir l’Empire romain, semant partout les semences de la foi salvatrice. Justin ouvrit une école où il enseignait la philosophie chrétienne. Il défendit avec constance la vérité et la vertu salvifique de la doctrine chrétienne, réfutant avec force aussi bien les spéculations païennes (comme, par exemple, dans sa dispute avec le philosophe cynique Crescent) que les déviations hérétiques du christianisme (il s’opposa notamment à la doctrine de Marcion le gnostique).</p><p>Vers 155, lorsque l’empereur Antonin le Pieux (138-161) déchaîna la persécution contre les chrétiens, saint Justin lui présenta personnellement une « Apologie » en faveur des chrétiens Ptolémée et Lucius, condamnés injustement au supplice, le nom du troisième étant resté inconnu. Dans cette « Apologie », il démontrait la fausseté des accusations portées contre les chrétiens « au nom des chrétiens injustement haïs et persécutés ».</p><p>À Éphèse eut lieu la dispute de saint Justin avec le rabbin Tryphon. Le philosophe chrétien y démontrait la vérité de la doctrine chrétienne à partir des écrits prophétiques de l’Ancien Testament. Cette discussion fut exposée par saint Justin dans son ouvrage « Dialogue avec Tryphon le Juif ».</p><p>La seconde « Apologie » de saint Justin était adressée au Sénat romain. Elle fut écrite en 161, peu après l’avènement de Marc Aurèle (161-180). C’est dans ses apologies qu’apparaît pour la première fois l’idée que, pour les païens, la philosophie fut la préfiguration du christianisme. Il est intéressant de noter que l’on y trouve aussi des indications sur les pratiques du baptême et de l’eucharistie en usage à cette époque. On doit également à la plume de Justin un grand ouvrage contre les gnostiques, aujourd’hui perdu, la « Syntagma contre toutes les hérésies ».</p><p>En revenant en Italie, saint Justin, à l’exemple des Apôtres, prêchait partout l’Évangile et ramenait beaucoup de gens à la foi chrétienne. Selon les « Actes de Justin », pendant son séjour à Rome, il fut arrêté avec six de ses disciples et compara devant le préfet Quintus Junius Rusticus (163-168), philosophe stoïcien et maître de l’empereur Marc Aurèle. Interrogé par le préfet sur la doctrine qu’il professait, le martyr répondit : « Je me suis efforcé de connaître toutes les doctrines, mais je me suis attaché aux vraies doctrines des chrétiens, bien qu’elles déplaisent à ceux qui pensent faussement. » Justin confessa sa foi en Dieu « créateur du monde et auteur de toute créature » et au « Seigneur Jésus-Christ, Enfant de Dieu, dont les prophètes avaient annoncé qu’il viendrait au genre humain comme héraut du salut et maître des bonnes doctrines ». Après que Justin et ses disciples eurent résolument confessé être chrétiens, le préfet Rusticus lui demanda s’il était certain que, après le fouet et le supplice, il monterait au ciel. « Je l’espère, grâce à la patience, si je persévère. Mais je sais que ceux qui ont vécu dans la justice attendent la grâce de Dieu », répondit le martyr. Malgré les menaces du préfet, les martyrs refusèrent d’offrir des sacrifices aux idoles ; ils furent ensuite flagellés et décapités.</p><p>L’opinion répandue dans la littérature selon laquelle le cynique Crescent aurait eu part à la mort de Justin repose sur le témoignage d’Eusèbe de Césarée à ce sujet. Comme toutes les sources dignes de foi, y compris les « Actes de Justin », gardent le silence là-dessus, il est impossible de déterminer si Crescent, hostile à Justin, fut mêlé à son arrestation et à sa mort.</p><h2>Doctrine</h2><h3>Justin le martyr expose la foi chrétienne qu’il a reçue du vieillard chrétien</h3><blockquote><p>Eh bien ! Tryphon, je vais exposer pour vous, et pour ceux qui veulent devenir les disciple du Christ, la doctrine toute divine qu’il nous a enseignée.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Dialogue_avec_Tryphon">Dialogue avec Tryphon</a>)</p><h2>Dieu</h2><h3>Les attributs infinis de Dieu</h3><blockquote><p>Car le Père, le souverain maître de toutes choses, dont le nom est inénarrable, ne va pas d’un lieu à un autre ; il ne marche, ni ne dort ; il demeure dans son séjour qui est partout ; il n’est rien qu’il ne discerne, qu’il n’entende parfaitement sans yeux et sans oreilles ; mais par sa seule vertu ineffable il voit tout, il entend tout ; personne ne lui échappe, <strong>il ne change point de lieu</strong> ; <strong>l’espace, que dis-je ! le monde tout entier, ne peut le contenir</strong>, <strong>car il était avant le monde</strong>.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Dialogue_avec_Tryphon">Dialogue avec Tryphon</a>)</p><h3>Le nom de Dieu</h3><blockquote><p><strong><mark>Le Créateur de l’univers n’a pas de nom, parce qu’il est non engendré. Recevoir un nom suppose en effet quelqu’un de plus ancien qui donne ce nom</mark></strong>. <strong>Ces mots Père, Dieu, Créateur, Seigneur et Maître ne sont pas des noms, mais des appellations motivées par ses bienfaits et ses actions</strong>.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Deuxi%C3%A8me_Apologie">Deuxième Apologie</a>)</p><h3>La consubstantialité de Dieu</h3><blockquote><p>… avant toutes choses <strong>Dieu a engendré de lui-même dès le commencement une vertu, une intelligence que l’Esprit saint appelle la gloire du Seigneur, et désigne souvent par le nom de Fils, de Sagesse, de Dieu, de Seigneur, de Verbe</strong> ; celui à qui l’Écriture donne tous ces titres s’appelle lui-même chef suprême : c’est le nom qu’il a pris quand il s’est montré à Josué, fils de Nun sous une forme humaine, car il a tous ces noms comme ministre des ordres de Dieu le père et <strong>né de ce père par sa volonté</strong>. Ce qui se passe en nous est un exemple de cette génération. La parole que nous proférons <strong><mark>nous l’engendrons sans rien perdre de nous-même</mark></strong>, car la parole qui est en nous, je veux dire la raison, n’en est pas diminuée. C’est encore ce que nous voyons à l’égard du feu. Une flamme naît d’une autre, sans que la première en soit affaiblie ; la seconde existe et brille, sans diminuer celle à qui elle doit son existence et sa clarté. J’ai pour témoin de ce que j’avance <strong>le Verbe divin, le Dieu lui-même engendré du Père de toutes choses</strong>, le Verbe et la sagesse, la vertu et la gloire de ce Père tout-puissant.</p><p>…</p><p>C’est ainsi qu’il s’exprime : « Voici qu’Adam a été fait comme l’un de nous, pour qu’il connaisse le bien et le mal. » Par ces mots : « comme l’un de nous, » il <strong><mark>exprime clairement un nombre de personnes unies étroitement entre elles et fait entendre qu’elles sont au moins deux</mark></strong>.</p><p>…</p><p>La vérité, la voici : c’est que le Fils engendré du Père <strong><mark>était avec lui avant toutes choses</mark></strong>.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Dialogue_avec_Tryphon">Dialogue avec Tryphon</a>)</p><h3>Une seule volonté en Dieu</h3><blockquote><p>Celui qui s’est montré à Abraham, à Jacob, à Moïse, et qui est appelé Dieu par les livres saints, est autre que celui qui a tout créé ; mais je m’explique, <strong><mark>autre par le nombre et non par la volonté</mark></strong>.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Dialogue_avec_Tryphon">Dialogue avec Tryphon</a>)</p><h3>Dieu est Trinité</h3><blockquote><p>Nous adorons justement celui qui nous a enseigné ces choses, et qui a été engendré pour cela, Jésus-Christ qui fut crucifié sous Ponce-Pilate, gouverneur de Judée, au temps de Tibère César, en qui nous voyons <strong>le <mark>fils</mark> du vrai Dieu et que nous mettons au <mark>second rang</mark>, et, en <mark>troisième</mark> lieu, l’<mark>Esprit</mark> prophétique</strong>.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Premi%C3%A8re_Apologie">Première Apologie</a>)</p><h3>Le Fils de Dieu n’est pas un Dieu séparé du Père</h3><blockquote><p>Cette vertu est engendrée du Père par sa volonté et par sa puissance ; <strong><mark>mais ce n’est point par retranchement ou diminution, comme si sa substance était divisée et diminuée</mark></strong>, ainsi que les objets qui se partagent et se divisent cessent d’être ce qu’ils étaient avant le partage et la division.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Dialogue_avec_Tryphon">Dialogue avec Tryphon</a>)</p><h3>Le Fils de Dieu est né de Dieu d’une manière particulière</h3><blockquote><p>Si nous disons que lui, verbe de Dieu, est né de Dieu, par un mode particulier de génération, contrairement à la loi ordinaire.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Premi%C3%A8re_Apologie">Première Apologie</a>)</p><h3>Dieu, en tant qu’homme, est né d’une vierge</h3><blockquote><p>Le prophète Isaïe avait prédit que c’était en effet d’une vierge qu’il devait naître… C’est pourquoi le Seigneur vous donnera lui-même un signe. <strong>Voilà que la <mark>vierge</mark> concevra et enfantera un fils</strong>, et il sera appelé Emmanuel.</p><p>…</p><p>Et c’est encore lui que regarde cette autre prophétie : « Voici qu’une <strong><mark>vierge</mark></strong> concevra et enfantera un fils. » Car si le personnage dont parle Isaïe ne devait ps naître d’une vierge, je demande quel est celui que l’Esprit saint pouvait avoir en vue, quand il s’écriait : « Voici que le Seigneur nous donnera un signe : une vierge concevra dans son sein et enfantera un fils. » <strong>Car si ce fils devait naître comme naissent tous les premiers-nés, c’est-à-dire d’une fille encore vierge, quelle merveille se trouvait dans le signe que Dieu voulait donner ? Pourquoi dit-il que ce signe n’aura rien de commun avec ce qui arrive dans la génération des premiers-nés ?</strong> Mais ce qui était un signe vraiment extraordinaire, ce qui devait être un signe certain pour tous les hommes, c’est que <strong>celui qui existe avant toutes choses, et qu’on appelle le premier-né, prit chair et naquit véritablement d’un sein resté vierge</strong>.</p><p>…</p><p>N’avons-nous pas prouvé <strong>qu’il est le fils unique de Dieu, créateur de toutes choses</strong>, qu’il est la vertu, le Verbe engendré de lui ; <strong>qu’ensuite il s’est fait homme ; qu’il est né d’une <mark>vierge</mark></strong>, comme nous l’apprennent les écrits des apôtres ?</p><p>…</p><p>Ils ont vu celui qui, selon la volonté du Père, est <strong><mark>son fils et Dieu lui-même</mark></strong>, et son ange, parce qu’il exécute ses ordres ; c’est lui <strong>qui <mark>s’est fait homme et a voulu naître d’une vierge</mark></strong>, et qui autrefois s’était entretenu du milieu d’un buisson avec Moïse, sous la forme du feu.</p><p>…</p><p>Ceux qui reconnaissent Jésus-Christ pour le fils de Dieu, existant avant le soleil et les autres astres, <strong>fait chair dans le temps et né d’une vierge</strong> du sang de David.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Dialogue_avec_Tryphon">Dialogue avec Tryphon</a>)</p><blockquote><p>Nous lisons, annoncé dans les livres des prophètes, que Jésus, notre Christ, doit venir, <strong>qu’il <mark>naîtra d’une vierge</mark></strong>, qu’il parviendra à l’âge d’homme, qu’il guérira toute maladie et toute infirmité, qu’il ressuscitera les morts, que, méconnu et persécuté, il sera crucifié, qu’il mourra, qu’il ressuscitera et montera au ciel, qu’il est et sera reconnu <strong>fils de Dieu</strong>, qu’il enverra certains annoncer ces choses dans le monde entier et que ce seront surtout les gentils qui croiront en lui.</p><p>…</p><p><strong><mark>Il naquit, par la vertu de Dieu, d’une vierge</mark></strong>.</p><p>…</p><p>Pourquoi, par la puissance du Verbe, selon la volonté de Dieu, le père et le maître de toutes choses, le Christ <strong>est-il né <mark>homme d’une vierge</mark></strong> et a-t-il été appelé Jésus, pourquoi a-t-il été crucifié, est-il mort, est-il ressuscité, est-il monté au ciel ?</p><p>…</p><p><strong>Le Père de l’univers a un <mark>Fils</mark>, qui est <mark>Verbe, premier-né de Dieu</mark>, et <mark>Dieu</mark></strong>. Il se manifesta d’abord sous la forme du feu et sous une figure incorporelle à Moïse et aux autres prophètes ; et maintenant, au temps de votre empire, comme nous l’avons dit, <strong>il <mark>s’est fait homme, il est né d’une vierge</mark></strong>, suivant la volonté du Père, pour le salut de ceux qui croient en lui ; il voulut bien être compté pour rien et souffrir, afin de vaincre la mort par sa mort et sa résurrection.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Premi%C3%A8re_Apologie">Première Apologie</a>)</p><h4>La Mère de Dieu est demeurée vierge</h4><blockquote><p>« Voici que la vierge sera enceinte, » c’est-à-dire que <strong><mark>la vierge concevra sans commerce humain ; car si ce commerce avait eu lieu avec quelqu’un, elle ne serait plus vierge</mark></strong>. La vertu de Dieu descendant sur la vierge l’a couverte de son ombre et <strong><mark>l’a fait concevoir sans violer sa virginité</mark></strong>.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Premi%C3%A8re_Apologie">Première Apologie</a>)</p><h3>Le Christ — Dieu</h3><blockquote><p>Quoi ! vous prétendez que <strong><mark>votre Christ est Dieu</mark></strong>, qu’il a existé avant les siècles, <strong>qu’il a bien voulu naître, s’incarner</strong>, et qu’il s’est fait homme sans être né de l’homme. Ce n’est pas seulement un paradoxe qui choque toutes les idées reçues, mais encore une absurdité.</p><p>— Oui, je sais que cette doctrine doit paraître étrange à ceux d’entre vous qui ne veulent ni comprendre, ni suivre la parole de Dieu, et qui n’écoutent d’autre voix que leurs docteurs. C’est le reproche que Dieu vous fait lui-même. Quand je ne pourrais vous démontrer que Jésus-Christ est le fils de Dieu créateur de toutes choses, <strong><mark>qu’il existe avant les siècles, qu’il est Dieu lui-même en même temps qu’il est homme né d’une vierge</mark></strong>, il n’en resterait pas moins démontré <strong><mark>qu’il est le Christ de Dieu</mark></strong>.</p><p>…</p><p>Ainsi l’ont jugé quelques hérétiques qui portent le nom de Chrétiens. <strong>Tout en le regardant comme un homme, ils le reconnaissaient pour le Christ. Je ne partage pas leur sentiment, quand ils n’en font qu’un simple mortel, et je ne l’adopterais jamais, quand le plus grand nombre qui pense comme moi viendrait à penser comme eux.</strong> Car le Christ lui-même nous commande de croire non à la parole de l’homme, mais à la parole des prophètes et à la sienne.</p><p>…</p><p>D’après tous ces passages des Écritures, <strong><mark>il est évident qu’il faut l’adorer, qu’il est déclaré Dieu et son Christ</mark></strong> par le témoignage même de celui qui a fait toutes ces merveilles.</p><p>…</p><p>David avait annoncé que celui qui existe avant le soleil et la lune, naîtrait d’un sein mortel, d’après la volonté de son père, et déclaré en même temps qu’il était <strong><mark>le Dieu fort, en sa qualité de Christ</mark></strong>, et devait être adoré.</p><p>…</p><p>Ces paroles de la loi : « Maudit soit celui qui est pendu à une croix ! » confirment notre espérance qui s’attache à Jésus crucifié, au lieu de l’ébranler ; et pourquoi ? C’est que nous y trouvons, non pas une malédiction de la part de Dieu contre Jésus crucifié, mais une prédiction de ce que vous tous et vos semblables deviez faire en refusant de reconnaître <strong>que ce Jésus existe avant les siècles, qu’il est le prêtre éternel du Très-Haut, qu’il est roi, qu’il est le Christ</strong>.</p><p>…</p><p>Et comme nous lisons dans les écrits de ses apôtres qu’il est vraiment fils de Dieu, nous nous plaisons à l’appeler de ce nom et nous comprenons qu’il l’est en effet, puisqu’<strong>il est engendré du Père avant toutes choses</strong>, par la vertu et la volonté de ce Père.</p><p>…</p><p><strong><mark>Que le Christ soit appelé Dieu</mark></strong>, vous avez pu vous en convaincre par les nombreux passages que j’ai cités.</p><p>…</p><p>Et voilà ce que devait faire <strong><mark>le Christ</mark> après s’être fait homme</strong>, comme l’annonce mystérieusement la lutte de Jacob contre le Verbe, qui alors ne lui paraissait qu’un homme, parce qu’il exécutait les ordres de son père, mais qui était <strong><mark>Dieu en sa qualité de premier-né de la création</mark></strong> ?</p><p>…</p><p>Si vous saviez quel est celui qui est appelé <strong>ange du grand conseil</strong> et <strong>homme</strong> par Ézéchiel, <strong>comme le Fils de l’homme</strong> par Daniel, <strong>petit enfant</strong> par Isaïe, <strong>Christ</strong> et <strong>Dieu adorable</strong> par David, <strong>Christ</strong> et <strong>pierre</strong> par un grand nombre de prophètes, <strong>sagesse</strong> par Salomon, <strong>Joseph, Juda, étoile</strong> par Moïse, <strong>orient</strong> par Zacharie, et, de nouveau, par Isaïe, <strong>Passible, Jacob, Israël, sceptre, fleur, grande pierre angulaire</strong> ; oui, dis-je, si vous le connaissiez, vous ne le poursuivriez pas de vos blasphèmes comme vous le faites depuis qu’il est venu, qu’il est né, qu’il a souffert, qu’il est monté aux cieux, lui qui doit revenir un jour. Quels gémissements feront entendre alors vos douze tribus ! Car, si vous aviez l’intelligence de toutes les paroles des prophètes, vous ne pourriez refuser de le connaître comme <strong><mark>Dieu et fils du Dieu unique, incréé, inénarrable</mark></strong>.</p><p>…</p><p>Ainsi donc, ni Abraham, ni Isaac, ni Jacob, ni aucun homme n’a vu le souverain arbitre dont le nom est inénarrable ; le Père de toutes choses et du Christ lui-même ; mais ils ont vu celui qui, selon la volonté du Père, <strong><mark>est son fils et Dieu lui-même</mark></strong>, et son ange, parce qu’il exécute ses ordres ; c’est lui qui <strong>s’est fait homme et a voulu naître d’une vierge</strong>, et qui autrefois s’était entretenu du milieu d’un buisson avec Moïse, sous la forme du feu.</p><p>…</p><p>Il est bien démontré, par toutes les preuves que je vous ai apportées, que <strong><mark>le Christ est véritablement Seigneur, Dieu et fils de Dieu</mark></strong> ; et que, par l’effet de sa puissance, il s’est montré autrefois sous la forme d’un homme et sous celle d’un ange, et avec l’éclat du feu, comme dans le buisson et dans le jugement de Sodôme.</p><p>…</p><p>[<strong>Le Christ</strong>, par l’Esprit Saint, <strong>est appelé Dieu</strong> et Seigneur des vertus, et, par figure, Jacob.]</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Dialogue_avec_Tryphon">Dialogue avec Tryphon</a>)</p><blockquote><p>Or la première puissance, après le Dieu, père et maître de toutes choses c’est <strong><mark>le Fils, son Verbe, qui s’est fait chair et est devenu homme</mark></strong>, comme nous le dirons dans la suite.</p><p>…</p><p>Appeler le Fils Père, c’est prouver que l’on ne connaît pas le Père et que l’on ne sait pas que <strong>le Père de l’univers a un <mark>Fils</mark>, qui est Verbe, <mark>premier-né de Dieu</mark>, et <mark>Dieu</mark></strong>. Il se manifesta d’abord sous la forme du feu et sous une figure incorporelle à Moïse et aux autres prophètes ; et maintenant, au temps de votre empire, comme nous l’avons dit, il <strong><mark>s’est fait homme, il est né d’une vierge</mark></strong>, suivant la volonté du Père, pour le salut de ceux qui croient en lui ; il voulut bien être compté pour rien et souffrir, afin de vaincre la mort par sa mort et sa résurrection.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Premi%C3%A8re_Apologie">Première Apologie</a>)</p><h3>Le Christ — Dieu et homme</h3><blockquote><p>Le prophète vous montre le Christ descendant des cieux et remontant aux cieux, pour vous faire comprendre <strong><mark>qu’il est venu du ciel en qualité de Dieu, qu’il s’est fait homme pour habiter parmi les hommes</mark></strong>, qu’il doit un jour reparaître, que ceux qui l’ont percé le verront et pousseront des gémissements.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Dialogue_avec_Tryphon">Dialogue avec Tryphon</a>)</p><blockquote><p>Car ce n’est pas seulement chez les Grecs et par la bouche de Socrate que le Verbe a fait entendre ainsi la vérité ; mais les barbares aussi ont été éclairés par <strong>le même Verbe</strong>, revêtu d’une forme sensible, <strong>devenu homme et appelé Jésus-Christ</strong>.</p><p>…</p><p>Appeler le Fils Père, c’est prouver que l’on ne connaît pas le Père et que l’on ne sait pas que <strong>le Père de l’univers a un <mark>Fils</mark>, qui est Verbe, <mark>premier-né de Dieu</mark>, et <mark>Dieu</mark></strong>. Il se manifesta d’abord sous la forme du feu et sous une figure incorporelle à Moïse et aux autres prophètes ; et maintenant, au temps de votre empire, comme nous l’avons dit, il <strong><mark>s’est fait homme, il est né d’une vierge</mark></strong>, suivant la volonté du Père, pour le salut de ceux qui croient en lui ; il voulut bien être compté pour rien et souffrir, afin de vaincre la mort par sa mort et sa résurrection.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Premi%C3%A8re_Apologie">Première Apologie</a>)</p><blockquote><p>Car <strong>après Dieu nous adorons et nous aimons le <mark>Verbe</mark> né du <mark>Dieu</mark> non engendré et ineffable</strong>, puisqu’il <strong><mark>s’est fait homme pour nous</mark></strong>, afin de nous guérir de nos maux en y prenant part.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Deuxi%C3%A8me_Apologie">Deuxième Apologie</a>)</p><h3>Le Christ (corps humain et âme) — tout entier à Dieu</h3><blockquote><p>Notre doctrine surpasse toute doctrine humaine, parce que nous avons tout le Verbe dans le Christ qui a paru pour nous, <strong>corps, verbe et âme</strong>.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Deuxi%C3%A8me_Apologie">Deuxième Apologie</a>)</p><h2>La loi de Moïse</h2><h3>Le Christ a accompli la loi pour faire la volonté du Père</h3><blockquote><p>— Oui, repris-je, je l’ai dit et je le dis encore ; mais je n’ai pas prétendu qu’il eût regardé toutes ces observances de la loi comme un moyen de se sanctifier, et que c’est pour cela qu’il s’y était soumis. Tout ce que j’ai voulu dire, c’est qu’il était venu <strong>selon la volonté de son père, le Seigneur, le Dieu de toutes choses, accomplir ses décrets éternels</strong>, et je dis que dans cette vue il a consenti à se faire homme, à mourir sur une croix, à tout souffrir de la part de votre nation.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Dialogue_avec_Tryphon">Dialogue avec Tryphon</a>)</p><h3>La loi de Moïse est abolie</h3><blockquote><p><strong>La loi donnée sur le mont Horeb est ancienne, elle était pour vous seuls ; la nouvelle est pour tous les peuples.</strong> <strong>Substituée à la première, elle l’<mark>abroge</mark> entièrement, comme le Testament nouveau <mark>abolit</mark> celui qui le précède.</strong> <strong>Cette loi tout à la fois éternelle et nouvelle, cet autre Testament qui doit toujours durer, après lequel il n’y a plus ni loi, ni précepte qui oblige, c’est le Christ.</strong></p><p>…</p><p>Voyez-vous les éléments se reposer, <strong><mark>observer le jour du sabbat</mark></strong> ? Restez comme vous êtes nés. <strong><mark>On n’avait pas besoin de circoncision avant Abraham, ni de fêtes, ni de sabbat avant Moïse</mark></strong> : eh bien ! <strong><mark>tout cela est encore moins nécessaire</mark></strong> depuis que Jésus-Christ le fils de Dieu, d’après la volonté de son père, est né sans péché d’une vierge issue du sang d’Abraham. Abraham lui-même, lorsqu’il était encore incirconcis, ne fut-il pas justifié et béni uniquement à cause de sa foi et parce qu’il crut à Dieu, ainsi que vous l’apprend l’Écriture ? Il reçut la circoncision seulement comme un signe et non comme un moyen de salut, l’Écriture et les faits nous obligent à le reconnaître.</p><p>…</p><p>Les gentils qui, touchés de repentir, auront cru en Jésus-Christ, entreront dans l’héritage du Seigneur avec les patriarches, les prophètes et les justes de la race de Jacob, <strong><mark>bien qu’ils n’observent ni la circoncision, ni le sabbat, ni vos fêtes</mark></strong>.</p><p>…</p><p><strong>Et pour avoir fait tiédir de l’eau un jour de sabbat</strong>, a-t-on commis un crime affreux ? Est-ce que Dieu ne gouverne pas le monde ce jour-là comme les autres jours ? Est-ce que les pontifes ne sont pas obligés le jour du sabbat, ainsi que les autres jours de la semaine, de s’occuper du soin des sacrifices ? Encore une fois, cette multitude de justes qui n’avaient observé <strong><mark>aucune des pratiques prescrites par la loi</mark></strong> n’ont-ils pas été loués par le Seigneur et honorés de son témoignage ?</p><p>…</p><p>Mais <strong>qu’on soit Scythe ou Persan, pourvu qu’on ait la connaissance de Dieu et de son Christ</strong>, <strong>pourvu qu’on observe ses commandements éternels</strong>, alors on a la vraie circoncision, la seule utile et glorieuse, celle qui rend nos personnes chères à Dieu et nos dons agréables à ses yeux.</p><p>…</p><p>Comprenez seulement ce que je répète : Le sang de cette circoncision est aboli ; nous croyons à un sang plus efficace. <strong><mark>Une autre alliance, une autre loi est sortie de Sion.</mark></strong></p><p>…</p><p>Comme la circoncision <strong>avait commencé à Abraham</strong>, <strong>le sabbat, les sacrifices, les offrandes, les fêtes à Moïse</strong>, <strong>n’étaient établis qu’à raison de la dureté de votre cœur</strong>, ainsi que nous l’avons démontré ; <strong><mark>elles devaient finir à la venue de celui qui, d’après la volonté de Dieu le père, est né d’une vierge de la race d’Abraham, de la tribu de Juda et du sang de David ; je veux dire à la venue du Christ, le fils de Dieu</mark></strong>, <strong><mark>annoncé au monde entier comme la loi nouvelle, le testament nouveau qui doit paraître un jour</mark></strong>, ainsi que le prouvent les différents oracles que nous avons déjà cités.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Dialogue_avec_Tryphon">Dialogue avec Tryphon</a>)</p><h3>Le sens véritable de la loi de Moïse est figuré et éternel ; les chrétiens l’accomplissent</h3><blockquote><p>N’attribuez qu’à votre perversité les blasphèmes que se permettent contre Dieu <strong>les insensés qui osent dire qu’il n’a pas établi pour tous et en tout temps le même moyen de salut</strong>. En effet, toutes vos pratiques ont été jugées absurdes, indignes de Dieu, par des hommes trop peu éclairés pour juger qu’elles pouvaient servir à ramener dans les voies de la pénitence un peuple comme le vôtre, travaillé de je ne sais quelle maladie d’esprit, et pour comprendre que la loi qui ne parut qu’après Moïse était cependant la loi éternelle. Vous la trouvez annoncée dans un des psaumes (le xviiie) ; <strong>vous y lisez que les préceptes du Seigneur qui donnent la sagesse sont plus doux que le miel le plus délicieux : ce qui le prouve, c’est que nous affronterions la mort plutôt que d’abjurer son saint nom</strong>. <strong>Nous lui demandons avant toute chose, comme on le sait, d’être préservés des ennemis cachés, c’est-à-dire des esprits pervers et trompeurs, comme le prophète le dit en termes <mark>figurés</mark> quand il fait parler dans ce psaume ceux qui croient au Christ</strong>, et pour échapper aux attaques de ces ennemis du culte de Dieu, je veux dire les mauvais génies que nous adorions autrefois, nous demandons au Seigneur par Jésus-Christ, son fils, qu’il nous conserve purs et sans tache, après nous avoir fait connaître la vérité.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Dialogue_avec_Tryphon">Dialogue avec Tryphon</a>)</p><h3>La raison de la loi de Moïse</h3>
      <h4>La raison des sacrifices</h4>
      <blockquote><p>— J’ai une autre question à vous faire, lui dis-je : est-ce parce qu’il en avait besoin, que Dieu a commandé à vos pères de lui offrir des présents et des victimes ? Ou bien était-ce <strong>à cause de la dureté de leur cœur et de leur pente vers l’idolâtrie</strong> ?</p><p>— Les Écritures me forcent encore ici d’être de votre avis.</p><p>…</p><p>Et pour vous convaincre que c’est <strong>à cause des prévarications d’Israël et de son idolâtrie</strong> que Dieu a exigé de lui des sacrifices, et non parce qu’il avait besoin de ses offrandes, écoutez ce qu’il dit lui-même à ce sujet ; c’est ainsi qu’il fait parler Amos, un de vos douze prophètes.</p><p>…</p><p>Ainsi, vous le voyez, si Dieu reçoit de vous des sacrifices, s’il vous commande de lui en offrir, <strong>ce n’est pas qu’il en ait besoin, c’est uniquement à cause de vos péchés</strong>. Et le temple lui-même, appelé le temple de Jérusalem, pourquoi Dieu a-t-il dit que c’était son palais, sa demeure ? Est-ce qu’il en avait besoin ? Non, assurément. Mais il voulait appeler sans cesse votre attention sur lui, pour vous empêcher de tomber dans l’idolâtrie ; vous en avez une preuve bien sensible dans ces paroles d’Isaïe.</p><p>…</p><p><strong>Comme la circoncision avait commencé à Abraham</strong>, <strong>le sabbat, les sacrifices, les offrandes, les fêtes à Moïse</strong>, <strong>n’étaient établis qu’à raison de la dureté de votre cœur</strong>, ainsi que nous l’avons démontré ; elles devaient finir à la venue de celui qui, d’après la volonté de Dieu le père, est né d’une vierge de la race d’Abraham, de la tribu de Juda et du sang de David ; je veux dire à la venue du Christ, le fils de Dieu.</p><p>…</p><p>C’est-à-dire s’il n’a compris que, parmi les observances de la loi, <strong>les unes avaient pour objet le culte de Dieu et la pratique des devoirs de la justice</strong>, que <strong><mark>les autres étaient des figures qui se rapportaient au mystère du Christ, ou n’avaient été données qu’à la raison de la dureté de votre cœur</mark></strong>.</p></blockquote>
      <p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Dialogue_avec_Tryphon">Dialogue avec Tryphon</a>)</p>
      <h4>La raison du sabbat</h4>
      <blockquote><p><strong>Oui, c’est pour vous rappeler vos iniquités et celles de vos pères</strong>, que Dieu <strong>vous a ordonné de célébrer le sabbat</strong> <strong>et vous a imposé tant d’autres observances</strong> ; c’est pour l’instruction des peuples, afin qu’ils ne profanent pas son nom, que Dieu laisse encore subsister quelques-uns d’entre vous, et j’ai pour garant de ce que j’avance ses propres paroles.</p></blockquote>
      <p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Dialogue_avec_Tryphon">Dialogue avec Tryphon</a>)</p>
      <p>Les prophètes rappelaient le sabbat à cause de la corruption du peuple, de l’abandon du culte de Dieu et de son penchant à l’idolâtrie :</p>
      <blockquote><p>— Mes amis, leur répondis-je, si j’ai omis ce passage du prophète, ce n’est point parce qu’il m’était contraire ; mais j’ai supposé que vous aviez compris et que vous comprenez bien, que si Dieu vous a recommandé de suivre les observances prescrites par Moïse, <strong><mark>il n’a cessé en même temps de répéter qu’il ne vous les avait imposées qu’à raison de votre ingratitude et de la dureté de votre cœur</mark></strong>, afin que par elles vous pussiez vous ouvrir une voie de pénitence, un moyen de salut qui vous rende agréables à ses yeux, et qu’on ne vous vît plus désormais immoler vos enfants aux démons, prendre part aux larcins, n’aimer que l’argent, n’agir que par cupidité, refuser justice à l’orphelin, protection à la veuve, et vous présenter devant lui les mains pleines de sang.</p><p>…</p><p>Dans le principe, Dieu vous avait prescrit toutes les observances, uniquement à cause de votre perversité. Eh bien ! c’est à raison de votre persévérance dans la même voie, ou plutôt de votre intention d’y persévérer, <strong><mark>qu’il se sert encore des mêmes pratiques pour vous obliger à vous souvenir de lui et à le reconnaître</mark></strong>.</p></blockquote>
      <p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Dialogue_avec_Tryphon">Dialogue avec Tryphon, 28</a>)</p>
      <h4>La raison générale</h4>
      <blockquote><p>N’est-il pas plus raisonnable de dire que c’est <strong>à cause de vos prévarications</strong> que Dieu a prescrit ces diverses ordonnances, qu’il est l’ami de l’homme, qu’il voit l’avenir, qu’il est bon, qu’il est juste ?</p><p>…</p><p>Elles pouvaient servir à ramener dans les voies de la pénitence <strong>un peuple comme le vôtre, travaillé de je ne sais quelle maladie d’esprit</strong>.</p><p>…</p><p>— N’oubliez pas, repris-je, <strong>que Dieu ne vous a donné tous les préceptes par le ministère de Moïse <mark>qu’à raison de la dureté de votre cœur. Il voulait que toutes ces pratiques fussent autant de moniteurs qui vous remissent sans cesse sa pensée sous les yeux dans toutes vos actions, afin de vous détourner de l’injustice et de l’impiété</mark></strong>. Il vous ordonna même de vous ceindre d’une bandelette qui vous rappelât son souvenir et de porter un phylactère ou membrane de parchemin très-mince, sur laquelle étaient tracés certains caractères que nous regardons comme sacrés. C’était tout à la fois un aiguillon qui réveillait sans cesse en vous la pensée de Dieu, et un reproche fait à votre conscience d’être si prompts à l’oublier ; et toutes ces précautions cependant n’ont pu vous détourner de l’idolâtrie.</p><p>…</p><p>D’un autre côté, nous savons, nous, que <strong>de simples observances, <mark>établies à raison de la dureté du cœur</mark>, ne peuvent produire des œuvres de justice et de piété</strong>.</p></blockquote>
      <p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Dialogue_avec_Tryphon">Dialogue avec Tryphon</a>)</p>
      <h3>Consacrer à Dieu toute sa vie, et non le sabbat</h3>
      <blockquote><p><strong><mark>La nouvelle loi vous ordonne de célébrer un sabbat éternel, et lorsque vous vous êtes reposés un seul jour</mark></strong>, vous vous croyez les plus religieux des hommes. Vous ignorez pourquoi votre sabbat, votre circoncision ont été établis. Parce que vous mangez un pain sans levain, vous vous imaginez avoir accompli toute justice. Ce n’est pas là ce que demande le Seigneur notre Dieu. <strong>Si quelqu’un est parjure ou voleur, qu’il cesse de l’être ; <mark>s’il est adultère, qu’il fasse pénitence ; c’est alors qu’il célébrera le vrai sabbat, le sabbat le plus agréable à Dieu</mark></strong>.</p><p>…</p><p>Car <strong><mark>tous ces justes dont je viens de parler furent agréables à Dieu, bien qu’ils n’aient pas observé vos sabbats non plus</mark></strong>, Abraham et tous ses descendants jusqu’à Moïse, sous lequel votre peuple signala toute sa perversité et son ingratitude par ce veau d’or qu’il fit élever dans le désert. C’est alors que Dieu, s’accommodant à sa légèreté, se fit immoler des victimes pour vous éloigner du culte des idoles ; et cette précaution même vous a si peu préservés de l’idolâtrie, que vous avez été jusqu’à immoler aux démons vos enfants eux-mêmes. <strong>Il a institué le jour du sabbat afin de vous empêcher de perdre le souvenir du vrai Dieu</strong>, et, comme le dit l’Écriture, pour que vous rappeliez sans cesse que c’est le Seigneur qui vous a sauvés.</p></blockquote>
      <p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Dialogue_avec_Tryphon">Dialogue avec Tryphon</a>)</p><h3>Le dimanche est plus grand que le sabbat</h3><blockquote><p>Il y a dans ce choix du <strong><mark>huitième jour</mark></strong> quelque chose de mystérieux, que Dieu veut nous faire entendre par la préférence qu’il lui donne sur le septième ; mais je veux éviter toute digression. Comprenez seulement ce que je répète : Le sang de cette circoncision est aboli ; nous croyons à un sang plus efficace. <strong>Une autre alliance, une autre loi est sortie de Sion.</strong></p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Dialogue_avec_Tryphon">Dialogue avec Tryphon</a>)</p><h4>Les assemblées du dimanche</h4><p>Dans l’Empire romain, ce jour de la semaine s’appelait le jour du soleil :</p><blockquote><p><strong><mark>Le jour qu’on appelle le jour du soleil</mark></strong>, tous, dans les villes et à la campagne, se réunissent dans un même lieu : on lit les mémoires des apôtres et les écrits des prophètes, autant que le temps le permet. Quand le lecteur a fini, celui qui préside fait un discours pour avertir et pour exhorter à l’imitation de ces beaux enseignements. Ensuite nous nous levons tous et nous prions ensemble à haute voix. Puis, comme nous l’avons déjà dit, lorsque la prière est terminée, on apporte du pain avec du vin et de l’eau. Celui qui préside fait monter au ciel les prières et les eucharisties autant qu’il peut, et tout le peuple répond par l’acclamation Amen. Puis a lieu la distribution et le partage des choses consacrées à chacun et l’on envoie leur part aux absents par le ministère des diacres.</p><p>…</p><p><strong><mark>Nous nous assemblons tous le jour du soleil</mark></strong>, parce que c’est le premier jour, où Dieu, tirant la matière des ténèbres, créa le monde, et que, ce même jour, Jésus-Christ notre Sauveur ressuscita des morts. La veille du jour de Saturne, il fut crucifié, et le lendemain de ce jour, c’est-à-dire le jour du soleil, il apparut à ses apôtres et à ses disciples et leur enseigna cette doctrine, que nous avons soumise à votre examen.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Premi%C3%A8re_Apologie">Première Apologie</a>)</p><h2>Le salut (sotériologie)</h2><h3>Dieu s’est fait homme pour sauver les hommes</h3><blockquote><p>Jésus-Christ <strong>seul est proprement le fils de Dieu</strong>, son Verbe, son premier né, sa puissance, et il <strong><mark>s’est fait homme par sa volonté pour nous apporter une doctrine destinée à renouveler et à régénérer le genre humain</mark></strong></p><p>…</p><p><strong>Le Père de l’univers a un <mark>Fils</mark>, qui est <mark>Verbe</mark>, premier-né de Dieu, et <mark>Dieu</mark></strong>. Il se manifesta d’abord sous la forme du feu et sous une figure incorporelle à Moïse et aux autres prophètes ; et maintenant, au temps de votre empire, comme nous l’avons dit, il <strong><mark>s’est fait homme, il est né d’une vierge</mark></strong>, suivant la volonté du Père, <strong><mark>pour le salut de ceux qui croient en lui</mark></strong> ; il voulut bien être compté pour rien et souffrir, <strong><mark>afin de vaincre la mort par sa mort et sa résurrection</mark></strong>.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Premi%C3%A8re_Apologie">Première Apologie</a>)</p><blockquote><p>Car <strong>après Dieu nous adorons et nous aimons le <mark>Verbe</mark> né du <mark>Dieu</mark> non engendré et ineffable</strong>, puisqu’il <strong><mark>s’est fait homme pour nous</mark></strong>, <strong><mark>afin de nous guérir de nos maux en y prenant part</mark></strong>.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Deuxi%C3%A8me_Apologie">Deuxième Apologie</a>)</p><h3>La foi et les œuvres sont nécessaires au salut</h3><blockquote><p>Nous désirons la vie éternelle et incorruptible : nous préférons vivre avec Dieu, le père et le créateur de l’univers. Nous avons hâte de confesser notre foi, persuadés que <strong>ceux-là pourront obtenir ce bonheur, qui auront témoigné à Dieu <mark>par leurs œuvres</mark> qu’ils l’ont suivi et qu’ils ont aspiré à cette vie qui s’écoulera auprès de lui</strong>, inaccessible au mal.</p><p>…</p><p>Dieu sait d’avance tout ce que feront les hommes, et, comme il a décrété de <strong>récompenser chacun <mark>selon ses œuvres</mark></strong>, et de <strong><mark>punir justement les offenses commises contre lui</mark></strong>, il annonce l’avenir par l’Esprit prophétique, afin d’inviter les hommes à comprendre et à se souvenir ; il montre ainsi pour eux sa sollicitude et sa providence.</p><p>…</p><p>Nous désirons la vie éternelle et incorruptible : nous préférons vivre avec Dieu, le père et le créateur de l’univers. Nous avons hâte de confesser notre foi, persuadés que <strong>ceux-là pourront obtenir ce bonheur, qui auront témoigné à Dieu par leurs <mark>œuvres</mark> qu’ils l’ont suivi</strong> et qu’ils ont aspiré à cette vie qui s’écoulera auprès de lui, inaccessible au mal.</p><p>…</p><p><strong>S’ils se montrent <mark>par leurs œuvres</mark> dignes de ses desseins, nous savons qu’ils seront admis à vivre et à régner avec lui</strong>, devenus incorruptibles et impassibles. Car, nous croyons que de même qu’à l’origine il les a faits alors qu’ils n’étaient pas, de même, ceux qui l’auront mérité en choisissant les moyens de lui plaire, jouiront de l’immortalité et de sa société.</p><p>…</p><p>D’après notre doctrine, nul ne peut échapper à Dieu, le méchant, l’avare, le perfide, pas plus que l’honnête homme, mais que <strong>chacun, <mark>selon ses œuvres</mark>, va au châtiment ou au salut éternel</strong>.</p><p>Si tous les hommes avaient cette conviction, personne ne voudrait commettre un crime d’un instant, sachant qu’il encourt le supplice éternel du feu, mais <strong><mark>il se contiendrait complètement</mark>, <mark>il se ferait une parure de toutes les vertus</mark>, <mark>pour obtenir</mark> les biens promis par Dieu et éviter le châtiment</strong>.</p><p>…</p><p><strong>Ceux qui ne vivent pas selon ses préceptes, qu’ils ne soient pas tenus pour chrétiens, quand même ils proclameraient de bouche la doctrine du Christ</strong> ; car <strong><mark>il a promis le salut non à ceux qui disent, mais à ceux qui font</mark></strong>. Il a dit en effet : « <strong>Ce n’est pas celui qui me dit : Seigneur, Seigneur</strong>, qui entrera dans le royaume des cieux, mais celui qui fait la volonté de mon Père qui est dans les cieux[47]. Quiconque m’écoute et fait ce que je dis écoute celui qui m’a envoyé[48]. <strong>Beaucoup me diront : Seigneur, Seigneur</strong>, est-ce qu’en votre nom nous n’avons pas bu et mangé, est-ce que nous n’avons pas fait des miracles ? Et alors je leur dirai : Loin de moi, ouvriers d’iniquité[49]. Alors, il y aura des pleurs et des grincements de dents, lorsque les justes brilleront comme le soleil, tandis que les méchants seront jetés au feu éternel[50]. Beaucoup viendront en mon nom, qui à l’extérieur seront revêtus de peaux de brebis et qui au dedans seront des loups ravissants : <strong><mark>vous les reconnaîtrez à leur œuvres</mark></strong>. Tout arbre qui ne porte pas de bons fruits est coupé et jeté au feu[51]. » Punissez donc ceux qui <strong>ne vivent pas conformément à ces préceptes et qui ne sont chrétiens que de nom</strong> : c’est nous qui vous le demandons.</p><p>…</p><p>Car nous croyons ou plutôt nous sommes convaincus que <strong>chacun, <mark>selon ses œuvres</mark>, sera puni</strong> dans le feu éternel et que <strong><mark>nous rendrons compte à Dieu</mark></strong> dans la mesure des pouvoirs que nous aurons reçus de lui. C’est le Christ qui l’a dit : « Celui à qui Dieu aura plus donné, il lui sera demandé davantage. »</p><p>…</p><p>Pour nous, notre doctrine nous apprend que <strong><mark>ceux là seuls peuvent espérer l’immortalité, qui ressemblent à Dieu par la piété et la sainteté de leur vie</mark></strong>. Quant aux méchants qui ne s’amendent pas, nous croyons qu’ils seront châtiés dans le feu éternel.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Premi%C3%A8re_Apologie">Première Apologie</a>)</p><blockquote><p>Ils vous trompent, ils se trompent eux-mêmes, <strong>quand ils s’imaginent que tous ceux qui sont nés d’Abraham, selon la chair, eussent-ils été pécheurs, incrédules, rebelles à Dieu, auront part au royaume éternel</strong>, bien que l’Écriture assure le contraire ; et s’il en était autrement, est-ce qu’Isaïe aurait dit : « Si le Dieu des armées ne nous eût donné son fils, nous serions devenus comme Sodôme et Gomorrhe. » Est-ce qu’Ézéchiel se serait écrié : « Quand Noé, Jacob, Daniel, interviendraient pour leurs fils, pour leur filles, il ne leur sera point fait grâce. » Ainsi le père ne mourra point à cause de son fils, ni le fils à cause de son père, mais <strong><mark>chacun portera la peine de son péché, comme aussi chacun sera sauvé d’après le bien qu’il aura fait</mark></strong>.</p><p>…</p><p>Dieu, qui voulait que l’ange et l’homme obéissent à sa volonté, les créa libres, afin qu’ils se portassent de leur plein gré à la pratique de la justice, et leur donna en même temps la raison, pour connaître celui dont ils ont reçu l’être et la vie, <strong>à la condition d’<mark>être un jour jugés par lui</mark>, s’ils <mark>agissaient contrairement</mark> à cette raison</strong>.</p><p>…</p><p>Mais <strong><mark>vous n’avez pas voulu recevoir le Christ de Dieu. Qui ne le connaît pas, ignore la pensée de Dieu</mark></strong> ; qui l’outrage, qui le hait, hait et outrage celui qui l’a envoyé ; et <strong><mark>si on ne croit pas en lui, il faut aussi refuser de croire aux oracles des prophètes</mark></strong> qui l’annoncent et qui le prêchent partout.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Dialogue_avec_Tryphon">Dialogue avec Tryphon</a>)</p><h3>Tous les hommes ont une inclination au mal</h3><blockquote><p>Car, ce que n’ont pas pu faire les lois humaines, le Verbe, étant divin, l’eût fait, si les démons n’eussent répandu contre nous des accusations mensongères et impies, appelant à leur aide les passions qui sont <strong><mark>en chacun tout à fait mauvaises et de nature variée</mark></strong>. Ces accusations ne nous atteignent pas.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Premi%C3%A8re_Apologie">Première Apologie</a>)</p><h3>Les hommes ont la capacité de distinguer le bien du mal</h3><blockquote><p>Car l’homme <strong><mark>a par sa nature le pouvoir de connaître le bien et le mal</mark></strong>.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Deuxi%C3%A8me_Apologie">Deuxième Apologie</a>)</p><h3>Nécessité de la pénitence pour les péchés</h3><blockquote><p>Ce qui veut dire simplement qu’en faisant pénitence de ses péchés il en obtiendra le pardon, <strong>et non pas que Dieu vous pardonnera les vôtres, pourvu que <mark>vous ayez connu son saint nom</mark> ; car voilà ce que vous dites, et c’est ainsi que vous vous abusez, vous et ceux qui vous ressemblent sur ce point</strong>. Nous pouvons appeler, en témoignage du sens que nous donnons à ces paroles, la faute même que commit David par un mouvement de vanité : <strong>son péché lui fut remis, il est vrai ; mais c’est parce qu’il <mark>l’a pleuré, qu’il en a gémi</mark></strong>, comme l’atteste l’Écriture. <strong><mark>Or, s’il a fallu que David fît pénitence pour obtenir grâce et miséricorde ; s’il a pleuré, s’il s’est ainsi humilié, ce roi puissant, l’oint, le prophète du Seigneur</mark></strong>, comment des hommes aussi impurs, d’une vie aussi déplorable, peuvent-ils se flatter d’obtenir le pardon de leurs péchés sans les pleurer, sans en gémir ?</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Dialogue_avec_Tryphon">Dialogue avec Tryphon</a>)</p><h2>Les sacrements</h2><h3>Le baptême (la régénération) par l’eau et la foi</h3><blockquote><p>Le Christ, premier-né de la création, était aussi le premier auteur ou le principe de cette race nouvelle <strong>qu’il a régénérée <mark>par l’eau du baptême</mark>, par le mérite de la foi</strong>, et par la vertu du bois, c’est-à-dire par <strong>le mystère de la croix</strong> ; comme Noé, porté sur l’eau, fut sauvé par le bois avec les siens.</p><p>…</p><p>Je veux dire que ceux dont le cœur est bien préparé <strong><mark>par l’eau</mark>, la foi</strong>, le bois, et qui font pénitence, échapperont au jugement à venir.</p><p>…</p><p>Cherchez plutôt par quelle voie vous pourrez obtenir la rémission de vos péchés et renaître à l’espoir des biens promis. <strong><mark>Je n’en vois pas d’autre que celle-ci : la foi en Jésus comme le Messie promis, la rémission des péchés par le baptême qu’avait annoncé Isaïe</mark></strong>, et une vie désormais pure et sans tache.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Dialogue_avec_Tryphon">Dialogue avec Tryphon</a>)</p><h4>Ils renaissent en se lavant dans l’eau</h4><blockquote><p>Ceux qui croient à la vérité de nos enseignements et de notre doctrine promettent d’abord de vivre selon cette doctrine. Alors nous leur apprenons à prier et à demander à Dieu, dans le jeûne, la rémission de leurs péchés, et nous-mêmes, nous prions et nous jeûnons avec eux. Ensuite, <strong>ils sont conduits par nous <mark>au lieu où est l’eau</mark>, et là, <mark>de la même manière que nous avons été régénérés nous-mêmes, ils sont régénérés à leur tour</mark>. Au nom de Dieu le père et le maître de toutes choses, et de Jésus-Christ, notre Sauveur, et du Saint-Esprit, ils sont alors <mark>lavés dans l’eau</mark>.</strong> Car le Christ a dit : « Si vous ne renaissez, vous n’entrerez pas dans le royaume des cieux. »</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Premi%C3%A8re_Apologie">Première Apologie</a>)</p><h4>Le baptême délivre des péchés antérieurs</h4><blockquote><p><em>Nous vous exposerons maintenant </em><strong><em>comment, renouvelés par le Christ, nous nous consacrons à Dieu</em></strong><em>. Si nous omettions ce point dans notre exposition, nous paraîtrions être en faute. Ceux qui croient à la vérité de nos enseignements et de notre doctrine promettent d’abord de vivre selon cette doctrine. Alors nous leur apprenons à prier et </em><strong><em>à demander à Dieu, dans le jeûne, la rémission de leurs péchés, et nous-mêmes, nous prions et nous jeûnons avec eux. Ensuite, ils sont conduits par nous au lieu où est l’eau, et là, de la même manière que nous avons été régénérés nous-mêmes, ils sont régénérés à leur tour. Au nom de Dieu le père et le maître de toutes choses, et de Jésus-Christ, notre Sauveur, et du Saint-Esprit, ils sont alors <mark>lavés dans l’eau</mark>.</em></strong><em> Car le Christ a dit : « Si vous ne renaissez, vous n’entrerez pas dans le royaume des cieux. » Il est bien évident pour tout le monde que ceux qui sont nés une fois ne peuvent pas rentrer dans le sein de leur mère. Le prophète Isaïe, comme nous l’avons dit plus haut, enseigne </em><strong><em><mark>de quelle manière les pécheurs repentants effaceront leurs péchés</mark></em></strong><em>. Il s’exprime en ces termes : « </em><strong><em><mark>Lavez-vous</mark></em></strong><em>, purifiez-vous, enlevez le mal de vos cœurs, apprenez à bien faire, rendez justice à l’orphelin et défendez la veuve ; venez alors et comptons, dit le Seigneur. Vos péchés vous eussent-ils rendus rouges comme la pourpre, je vous rendrai blancs comme la laine ; fussiez-vous rouges comme l’écarlate, je vous rendrai blancs comme la neige. Mais si vous ne m’écoutez pas, le glaive vous dévorera. C’est la bouche du Seigneur qui a parlé. » </em><strong><em>Voici la doctrine que les apôtres nous ont transmise sur ce sujet</em></strong><em>. Dans notre première génération, nous naissons ignorants et selon la loi de la nécessité, d’une semence humide, dans l’union mutuelle de nos parents, et nous venons au monde avec des habitudes mauvaises et des inclinations perverses. Pour que nous ne restions pas ainsi les enfants de la nécessité et de l’ignorance, mais de l’élection et de la science, pour que nous obtenions </em><strong><em><mark>la rémission de nos fautes passées, on invoque dans l’eau sur celui qui veut être régénéré et qui se repent de ses péchés le nom de Dieu le père et le maître de l’univers</mark></em></strong><em>. Cette dénomination seule est précisément celle que prononce le ministre qui conduit au bain celui qui doit être lavé. Peut-on donner en effet un nom au Dieu ineffable, et ne serait-ce pas folie orgueilleuse que d’oser dire qu’il en a un ? </em><strong><em><mark>Cette ablution s’appelle illumination</mark></em></strong><em>, parce que </em><strong><em><mark>ceux qui reçoivent cette doctrine ont l’esprit illuminé</mark></em></strong><em>. Et aussi au nom de Jésus-Christ, qui fut crucifié sous Ponce-Pilate, et au nom de l’Esprit-Saint, qui prédit par les prophètes toute l’histoire de Jésus, est lavé celui qui est illuminé.</em></p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Premi%C3%A8re_Apologie">Première Apologie, chap. 61</a>)</p><h3>L’Eucharistie — le vrai corps et le vrai sang de Jésus-Christ</h3><blockquote><p><strong><em>Nous ne prenons pas cet aliment <mark>comme un pain commun et une boisson commune</mark></em></strong><em>. De même que par la vertu du Verbe de Dieu, Jésus-Christ notre sauveur </em><strong><em>a pris chair et sang</em></strong><em> pour notre salut, ainsi </em><strong><em><mark>l’aliment</mark> consacré par la prière formée des paroles du Christ</em></strong><em>, cet aliment qui doit nourrir par assimilation notre sang et nos chairs, </em><strong><em><mark>est la chair et le sang de Jésus incarné</mark></em></strong></p></blockquote><p>(<a href="https://azbyka.ru/otechnik/Iustin_Filosof/apologia/#sel=95:88,95:115:~:text=65.%20%D0%9F%D0%BE%D1%81%D0%BB%D0%B5%20%D1%82%D0%BE%D0%B3%D0%BE,%D0%BD%D0%B0%20">Première Apologie, 65-67</a>) (en russe)</p><blockquote><p><strong>Le mystère de l’agneau que Dieu ordonna d’immoler à la solennité de Pâques était la figure <mark>du Christ</mark>. À raison de leur foi, <mark>ceux qui croient en lui teignent de son sang leurs maisons, c’est-à-dire eux-mêmes</mark></strong>.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Dialogue_avec_Tryphon">Dialogue avec Tryphon</a>)</p><h3>Le sacrifice non sanglant offert à Dieu dans l’Eucharistie</h3><blockquote><p>Le <strong><mark>sacrifice</mark></strong> offert partout en son nom est celui que <strong><mark>Jésus-Christ a institué et prescrit d’offrir</mark></strong>, je veux dire <strong><mark>le sacrifice eucharistique du pain et du vin, que les Chrétiens offrent en tous lieux</mark></strong> ; aussi lui sont-ils tous agréables, ainsi qu’il le déclare, tandis qu’il rejette vos sacrifices et ceux de vos prêtres</p><p>…</p><p>Je conviens que les prières et les actions de grâce faites par des cœurs purs sont les seuls sacrifices parfaits et agréables au Seigneur ; et voilà ceux en effet que <strong><mark>les Chrétiens ont appris à lui offrir en reconnaissance des aliments qu’ils reçoivent de lui</mark></strong>, et en mémoire de la passion que le fils de Dieu a soufferte pour eux.</p><p>…</p><p>Il a témoigné son amour aux nations : <strong><mark>nos sacrifices lui ont été plus agréables que ceux d’Israël</mark></strong>.</p><p>…</p><p>Que dirai-je encore ? L’offrande prescrite d’une mesure de farine, pour la guérison de la lèpre, ne figurait-elle pas <strong>le pain eucharistique</strong> que <strong>Jésus-Christ <mark>ordonne d’offrir</mark></strong> en mémoire de la passion qu’il a soufferte pour nous guérir de tous nos péchés, et <strong>rendre grâce à Dieu</strong> d’avoir créé en faveur de l’homme et le monde et tout ce qu’il renferme, de nous avoir affranchis de l’iniquité dans laquelle nous étions plongés, enfin d’avoir brisé, anéanti, la puissance de l’enfer, par le bras de celui qui voulut bien pour nous souffrir la mort ?</p><p>…</p><p><strong><mark>Ici le prophète annonce déjà le sacrifice que nous</mark></strong> autres gentils <strong><mark>nous offrons</mark> sur tous les points de la terre, je veux dire <mark>le pain et le calice eucharistiques</mark></strong> ; et il ajoute que par nous son nom est glorifié, tandis que vous le profanez.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Dialogue_avec_Tryphon">Dialogue avec Tryphon</a>)</p><blockquote><p>Reconnaissant, comme l’enseigne notre doctrine, qu’il n’a besoin ni de sang, ni de libations, ni d’encens, <strong>nous le louons</strong> selon notre pouvoir, <strong>par des hymnes de piété</strong> et d’<strong>actions de grâce</strong>, <strong>dans tout ce que nous mangeons</strong>.</p><p>…</p><p><strong><mark>La vraie manière de l’honorer</mark></strong>, selon ce qu’on nous a enseigné, <strong>ce n’est pas de consumer inutilement par le feu</strong> <strong><mark>les choses qu’il a faites pour notre subsistance</mark></strong>, mais <strong><mark>d’en user pour nous</mark></strong> et d’en faire part aux pauvres, et de lui offrir nos hommages solennels et nos hymnes de reconnaissance pour la vie qu’il nous a donnée, et le soin qu’il prend de nous conserver en santé, pour les qualités des choses et les changements des saisons. Nous lui demandons aussi l’immortalité future à cause de la foi que nous avons en lui[23].</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Premi%C3%A8re_Apologie">Première Apologie</a>)</p><h3>Paroles sur l’Eucharistie</h3><blockquote><p>Qui de vous soutiendra les ardeurs éternelles ? Celui qui marche dans les sentiers de la justice et qui rend hommage à la vérité, qui rejette les présents, n’écoute pas les paroles sanguinaires et ferme les yeux pour ne pas voir le mal : celui-là habitera sous la caverne élevée d’une roche inexpugnable ; <strong>l’eau et le pain lui seront constamment donnés</strong>. Vous verrez votre roi dans l’éclat de sa gloire et vous porterez au loin vos regards.</p><p>…</p><p><strong>Il est évident que, dans cette prophétie, il s’agit de ce pain que notre Christ nous a ordonné d’offrir en mémoire du corps qu’il a pris pour le salut de ceux qui croient en lui et en faveur desquels il s’est rendu passible. Il est clair qu’il s’agit aussi du calice sur lequel il a recommandé de prononcer des paroles d’actions de grâce en mémoire de son sang.</strong></p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Dialogue_avec_Tryphon">Dialogue avec Tryphon</a>)</p><h4>Description de la célébration de l’Eucharistie</h4><blockquote><p>Quant à nous, après avoir lavé celui qui croit et s’est adjoint à nous, nous le conduisons dans le lieu où sont assemblés ceux que nous appelons nos frères. Nous faisons avec ferveur des prières communes pour nous, pour l’illuminé, pour tous les autres, en quelque lieu qu’ils soient, afin d’obtenir, avec la connaissance de la vérité, la grâce de pratiquer la vertu et de garder les commandements, et de mériter ainsi le salut éternel. Quand les prières sont terminées, nous nous donnons le baiser de paix. Ensuite, on apporte à celui qui préside l’assemblée des frères du pain et une coupe d’eau et de vin trempé. Il les prend et loue et glorifie le père de l’univers par le nom du Fils et du Saint-Esprit, puis il fait une longue eucharistie pour tous les biens que nous avons reçus de lui. Quand il a terminé les prières et l’eucharistie, tout le peuple présent pousse l’exclamation : Amen. Amen est un mot hébreu qui signifie : ainsi soit-il. Lorsque celui qui préside a fait l’eucharistie, et que tout le peuple a répondu, les ministres que nous appelons diacres distribuent à tous les assistants le pain, le vin et l’eau consacrés, et ils en portent aux absents.</p><p>Nous appelons cet aliment Eucharistie, et personne ne peut y prendre part, s’il ne croit à la vérité de notre doctrine, s’il n’a reçu le bain pour la rémission des péchés et la régénération, et s’il ne vit selon les préceptes du Christ. Car nous ne prenons pas cet aliment comme un pain commun et une boisson commune. De même que par la vertu du Verbe de Dieu, Jésus-Christ notre sauveur a pris chair et sang pour notre salut, ainsi l’aliment consacré par la prière formée des paroles du Christ, cet aliment qui doit nourrir par assimilation notre sang et nos chairs, est la chair et le sang de Jésus incarné : telle est notre doctrine.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Premi%C3%A8re_Apologie">Première Apologie</a>)</p><h3>Les rites du culte</h3><blockquote><p><strong>La vraie manière de l’honorer, selon ce qu’on nous a enseigné, ce n’est pas de consumer inutilement par le feu les choses qu’il a faites pour notre subsistance, mais d’en user pour nous</strong> et d’en faire part aux pauvres, et <strong>de lui offrir</strong> <strong><mark>nos hommages solennels</mark></strong> <strong>et <mark>nos hymnes</mark> de reconnaissance pour la vie qu’il nous a donnée, et le soin qu’il prend de nous conserver en santé, pour les qualités des choses et les changements des saisons. <mark>Nous lui demandons</mark> aussi l’immortalité future à cause de la foi que nous avons en lui[23].</strong></p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Premi%C3%A8re_Apologie">Première Apologie</a>)</p><h2>Le culte des saints et des sanctuaires</h2><h3>Il vénère les anges</h3><blockquote><p>Avec <strong><mark>lui</mark></strong> <strong><mark>nous vénérons, nous adorons</mark></strong>, nous honorons en esprit et en vérité <strong><mark>le fils venu d’auprès de lui</mark></strong>, qui nous a donné ces enseignements, <strong><mark>et l’armée des autres bons anges[10] qui l’escortent et qui lui ressemblent</mark></strong>, <strong><mark>et l’esprit prophétique</mark></strong>. Voilà la doctrine que nous avons apprise[11] et que nous transmettons libéralement à quiconque veut s’instruire.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Premi%C3%A8re_Apologie">Première Apologie</a>)</p><h3>Il vénère la croix</h3><blockquote><p><strong><mark>C’est là, comme parle le prophète, le grand signe de la force et de la puissance du Christ.</mark></strong> Vous en trouvez la preuve dans les objets qui tombent sous vos sens[115]. Réfléchissez, et voyez si rien dans le monde peut exister et former un tout sans ce signe. Peut-on fendre la mer, si ce trophée, sous la forme de la voile, ne s’élève intact sur le navire ? Peut-on labourer sans la croix ? Les pionniers, les manœuvres peuvent-ils travailler sans instruments qui affectent cette forme ? … Vous avez aussi des signes qui disent la puissance de la croix, je veux dire <strong>les étendards et les trophées <mark>qui précèdent partout vos armées</mark>.</strong> <strong>Sans que vous vous en doutiez</strong>, vous montrez que la croix est ainsi le signe de votre puissance et de votre force.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Premi%C3%A8re_Apologie">Première Apologie</a>)</p><blockquote><p>Voyez, en effet, la disposition de ses membres quand on le brûle, n’offre-t-elle pas la figure d’une croix ? une broche le traverse verticalement de la tête aux pieds, tandis qu’une autre broche croise la première en traversant les épaules de l’agneau, et porte attachées sur elle, si je puis parler ainsi, les mains de la victime.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Dialogue_avec_Tryphon">Dialogue avec Tryphon</a>)</p><h2>Le sort après la mort</h2><h3>L’existence des âmes après la mort</h3><blockquote><p>Les paroles que Moïse entendit sortir du buisson : <strong>« Je suis celui qui est, le Dieu d’Abraham, le Dieu d’Isaac, le Dieu de Jacob, le Dieu de tes pères, » prouvent que ces personnages <mark>existaient encore après leur mort, et qu’ils étaient les hommes du Christ.</mark></strong></p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Premi%C3%A8re_Apologie">Première Apologie</a>)</p><p>Le vieillard (celui qui convertit Justin au christianisme) :</p><blockquote><p>Ou l’âme est la vie même, ou seulement elle la reçoit. Si elle est la vie, elle doit la communiquer à un autre objet qu’à elle-même, comme le mouvement qui ne se renferme pas en lui, mais se communique au dehors. <strong><mark>Que l’âme vive, personne ne le nie</mark></strong> ; mais si elle vit, ce n’est pas parce qu’elle est la vie, c’est seulement parce qu’elle y participe. Or, il y a une grande différence entre participer à une chose et être la chose elle-même. <strong>L’âme participe à la vie uniquement parce que Dieu veut qu’elle vive, et si Dieu cessait de le vouloir, elle cesserait d’exister</strong>, car la vie n’appartient pas en propre à l’âme comme elle appartient à Dieu. Qui ne sait pas que l’homme n’existe pas toujours, <strong><mark>que l’âme n’est pas toujours unie au corps, qu’elle l’abandonne quand leur union doit cesser</mark></strong>, et qu’alors l’homme n’est plus ? <strong>Eh bien ! de même si Dieu veut que l’âme finisse, le souffle vital se retire d’elle, elle s’éteint, elle retombe dans le néant d’où elle est sortie.</strong></p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Dialogue_avec_Tryphon">Dialogue avec Tryphon</a>)</p><p>Justin :</p><blockquote><p>… le glaive, la gueule du lion, la puissance du chien, dont il est ici question, désignent une force ennemie qu’il veut repousser ; <strong>il demande qu’elle n’asservisse pas son âme</strong>, et la prière qu’il fait ici à son père est une leçon qui nous apprend <strong><mark>à recourir à Dieu au moment de la mort</mark></strong>, à lui demander qu’il ne permette pas que <strong><mark>l’ange mauvais et audacieux s’empare de notre âme</mark>, <mark>puisqu’il peut l’écarter</mark></strong>. … <strong><mark>L’âme demeure toujours, je vous l’ai déjà prouvé</mark></strong> par ce qui est arrivé à l’âme de Samuel, que la pythonisse évoqua, sur la demande de Saül. Il est à croire que les âmes des justes et des prophètes subissent après leur mort le joug d’une puissance semblable à celle de la pythonisse, comme le prouve le fait même dont je viens de parler.</p><p>Il est évident que tout est ici pour notre instruction, et que Dieu, par son fils, nous apprend à faire tous nos efforts, <strong><mark>à multiplier nos prières à l’heure de la mort, pour empêcher notre âme de tomber sous aucune puissance de cette nature.</mark></strong></p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Dialogue_avec_Tryphon">Dialogue avec Tryphon</a>)</p><blockquote><p>Mais non, <strong>ceux qui ont vécu gardent le sentiment</strong>, et le châtiment éternel les attend. Vous ne devez pas laisser de croire et d’être persuadés que c’est la vérité. La nécromancie, l’inspection du cadavre d’un enfant innocent, l’évocation des âmes humaines, les pratiques de ceux qui, d’après la magie, envoient des songes, ou de ceux qui les assistent, les opérations de ceux qui possèdent cette science, doivent être pour vous une preuve <strong><mark>que les âmes conservent le sentiment après la mort.</mark></strong></p><p>…</p><p>En affirmant l’ordonnance et la création de toutes choses par Dieu, nous paraîtrons enseigner la doctrine de Platon ; l’embrasement universel, celle des stoïciens. En disant que <strong><mark>les âmes des méchants conservent le sentiment après la mort, et subissent la peine de leurs crimes</mark></strong>, que <strong><mark>celles des justes, exemptes de peines, ont un sort heureux</mark></strong>, nous paraîtrons d’accord avec les poètes et les philosophes.</p><p>…</p><p>car Moïse est plus ancien que tous les écrivains grecs. Tout ce que les philosophes et les poètes ont dit <strong><mark>de l’immortalité de l’âme, des châtiments qui suivent la mort, de la contemplation des choses célestes</mark></strong>, et des autres dogmes semblables, ils en ont reçu les principes des prophètes, et c’est ainsi qu’ils ont pu les concevoir et les énoncer. Chez tous on trouve des semences de vérité</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Premi%C3%A8re_Apologie">Première Apologie</a>)</p><h3>Les péages (épreuves de l’âme après la mort)</h3><blockquote><p>… le glaive, la gueule du lion, la puissance du chien, dont il est ici question, désignent une force ennemie qu’il veut repousser ; <strong>il demande qu’elle n’asservisse pas son âme</strong>, et la prière qu’il fait ici à son père est une leçon qui nous apprend <strong><mark>à recourir à Dieu au moment de la mort</mark></strong>, à lui demander qu’il ne permette pas que <strong><mark>l’ange mauvais et audacieux s’empare de notre âme</mark>, <mark>puisqu’il peut l’écarter</mark></strong>. … L’âme demeure toujours, je vous l’ai déjà prouvé par ce qui est arrivé à l’âme de Samuel, que la pythonisse évoqua, sur la demande de Saül. Il est à croire que les âmes des justes et des prophètes subissent après leur mort le joug d’une puissance semblable à celle de la pythonisse, comme le prouve le fait même dont je viens de parler.</p><p>Il est évident que tout est ici pour notre instruction, et que Dieu, par son fils, nous apprend à faire tous nos efforts, <strong><mark>à multiplier nos prières à l’heure de la mort, pour empêcher notre âme de tomber sous aucune puissance de cette nature.</mark></strong></p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Dialogue_avec_Tryphon">Dialogue avec Tryphon</a>)</p><h3>Les âmes des justes sont dans un lieu meilleur et voient Dieu, tandis que les âmes des pécheurs souffrent dans un autre lieu</h3><p>Justin raconte sa conversion au christianisme et rapporte les paroles d’un vieillard chrétien :</p><blockquote><p><strong>Ce n’est pas, reprit le vieillard, que je prétende qu’une seule âme périsse</strong>, car tout l’avantage serait pour les méchants. Que vous dirai-je ? <strong><mark>Les âmes des justes sont appelées à une meilleure vie, et celles des méchants envoyées dans un lieu de souffrances</mark></strong>, où elles attendent le jour du jugement. Celles que <strong><mark>Dieu juge dignes de le voir</mark></strong>, ne meurent point, et les autres sont punies aussi longtemps qu’il plaît à Dieu qu’elles vivent et qu’elles soient punies.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Dialogue_avec_Tryphon">Dialogue avec Tryphon</a>)</p><blockquote><p>Tout ce que les philosophes et les poètes ont dit de <strong><mark>l’immortalité de l’âme, des châtiments qui suivent la mort</mark></strong>, de la contemplation des choses célestes, et des autres dogmes semblables, ils en ont reçu les principes des prophètes, et c’est ainsi qu’ils ont pu les concevoir et les énoncer. Chez tous on trouve des semences de vérité</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Premi%C3%A8re_Apologie">Première Apologie</a>)</p><h4>Les âmes des martyrs vont vers le Père et le Roi des cieux</h4><blockquote><p>Sans autre réponse, Urbicus dit à Lucius : « Tu me parais, toi aussi, être chrétien. — Certainement, » répondit Lucius, et il le fit également emmener. <strong>Le condamné lui rendit grâce : mourir, c’était pour lui être délivré de ces maîtres injustes <mark>pour aller auprès du père et du roi des cieux</mark></strong> (πρὸς τὸν πατέρα καὶ βασιλέα τῶν οὐρανῶν πορεύεσθαι).</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Deuxi%C3%A8me_Apologie">Deuxième Apologie</a>)</p><h3>Les chrétiens parviennent à la vie avec Dieu</h3><blockquote><p>Remarquez que c’est dans votre intérêt que nous parlons ainsi ; car nous pourrions nier quand nous sommes interrogés. Mais nous ne voulons pas acheter la vie au prix d’un mensonge. Nous désirons la vie éternelle et incorruptible : <strong>nous préférons vivre avec Dieu, le père et le créateur de l’univers. <mark>Nous avons hâte de confesser notre foi, persuadés que ceux-là pourront obtenir ce bonheur, qui auront témoigné à Dieu par leurs œuvres qu’ils l’ont suivi et qu’ils ont aspiré à cette vie qui s’écoulera auprès de lui</mark></strong>, inaccessible au mal.</p><p>…</p><p>S’ils se montrent par leurs œuvres dignes de ses desseins, nous savons qu’<strong><mark>ils seront admis à vivre et à régner avec lui</mark>, devenus incorruptibles et impassibles</strong>. Car, nous croyons que de même qu’à l’origine il les a faits alors qu’ils n’étaient pas, de même, ceux qui l’auront mérité en choisissant les moyens de lui plaire, <strong><mark>jouiront de l’immortalité et de sa société</mark></strong>.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Premi%C3%A8re_Apologie">Première Apologie</a>)</p><h3>Le Christ, juge des vivants et des morts</h3><blockquote><p>Je me suis attaché à vous prouver que <strong>le Christ devait aussi juger les vivants et les morts</strong>.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Dialogue_avec_Tryphon">Dialogue avec Tryphon</a>)</p><h3>La géhenne, lieu de tourment</h3><blockquote><p><strong><mark>La géhenne est le lieu où seront punis</mark></strong> ceux qui ont vécu dans l’iniquité et qui n’ont pas cru que Dieu réaliserait ce qu’il avait annoncé par le Christ.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Premi%C3%A8re_Apologie">Première Apologie</a>)</p><h3>Les tourments éternels de l’enfer</h3><blockquote><p>Vous et tous ceux qui nous haïssent injustement, si vous ne vous repentez, <strong><mark>vous serez voués au feu éternel</mark></strong>.</p><p>…</p><p>Nous disons nous aussi que ce jugement sera rendu, mais par le Christ. Les méchants comparaîtront avec leurs corps et leurs âmes, <strong><mark>et leur supplice durera éternellement, et non pas seulement pendant une période de mille ans, comme le prétendait Platon</mark></strong>[14].</p><p>…</p><p>D’après notre doctrine, nul ne peut échapper à Dieu, le méchant, l’avare, le perfide, pas plus que l’honnête homme, mais que <strong><mark>chacun, selon ses œuvres, va au châtiment ou au salut éternel</mark></strong>.</p><p><strong>Si tous les hommes avaient cette conviction, personne ne voudrait commettre un crime d’un instant, sachant qu’il <mark>encourt le supplice éternel du feu</mark></strong>, mais il se contiendrait complètement, il se ferait une parure de toutes les vertus, pour obtenir les biens promis par Dieu et éviter le châtiment.</p><p>…</p><p>Nous croyons ou plutôt nous sommes convaincus que chacun, selon ses œuvres, <strong>sera</strong> <strong><mark>puni dans le feu éternel</mark></strong> et que nous rendrons compte à Dieu dans la mesure des pouvoirs que nous aurons reçus de lui. C’est le Christ qui l’a dit : « Celui à qui Dieu aura plus donné, il lui sera demandé davantage. »[53]</p><p><strong><mark>Si la mort détruisait en nous tout sentiment, ce serait un avantage pour les méchants. Mais non, ceux qui ont vécu gardent le sentiment, et le châtiment éternel les attend</mark></strong>. Vous ne devez pas laisser de croire et d’être persuadés que c’est la vérité.</p><p>…</p><p>Pour nous, notre doctrine nous apprend que ceux là seuls peuvent espérer l’immortalité, qui ressemblent à Dieu par la piété et la sainteté de leur vie. Quant aux méchants qui ne s’amendent pas, nous croyons qu’ils <strong><mark>seront châtiés dans le feu éternel</mark></strong>.</p><p>…</p><p>Nous appelons le chef des démons serpent, satan et diable, comme vous pouvez le voir en lisant nos livres. Il <strong>sera jeté au feu, avec son armée et les hommes qui le suivent, pour y être <mark>éternellement puni</mark></strong> : ainsi l’a prédit le Christ[70].</p><p>…</p><p>Vous et tous ceux qui nous haïssent injustement, si vous ne vous repentez, <strong><mark>vous serez voués au feu éternel</mark></strong>.</p><p>…</p><p>Les prophètes ont annoncé un double avènement du Christ : l’un, qui a déjà eu lieu, comme d’un homme méprisé et passible ; l’autre qui aura lieu, ainsi qu’il est prédit, lorsqu’il viendra du ciel, dans la gloire, avec l’armée de ses anges. Alors, il ressuscitera les corps de tous les hommes qui ont existé, il revêtira les justes d’immortalité, <strong><mark>et il enverra dans le feu éternel les méchants, qui souffriront éternellement avec les démons</mark></strong>.</p><p>…</p><p>Dans quelles <strong>souffrances</strong> et dans quels <strong>châtiments</strong> doivent être les méchants, écoutez ce qui est dit aussi à ce sujet. Voici : « <strong><mark>Leur ver ne cessera pas et leur feu ne s’éteindra pas</mark></strong>. » Et alors ils se repentiront, mais en vain.</p><p>…</p><p><strong>Jamais les démons ne parviendront à persuader que le supplice du feu n’est pas réservé aux impies</strong>, pas plus qu’ils n’ont pu cacher la venue du Christ.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Premi%C3%A8re_Apologie">Première Apologie</a>)</p><blockquote><p>Ceux qui croient que les méchants et les intempérants <strong><mark>seront punis dans le feu éternel</mark></strong> et que les bons qui ont vécu selon le Christ seront heureux avec Dieu, nous voulons dire les chrétiens</p><p>…</p><p>Elle cherchait à ramener aussi son mari à des sentiments meilleurs, lui exposait la doctrine et le menaçait du <strong><mark>feu éternel</mark></strong> réservé à ceux qui vivent dans le mal et contrairement à la saine raison.</p><p>…</p><p>Ils en seront châtiés et punis justement <strong><mark>dans la prison du feu éternel</mark></strong>.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Deuxi%C3%A8me_Apologie">Deuxième Apologie</a>)</p><blockquote><p>Cette grâce qui nous purifie de nos péchés et qui doit nous délivrer de toutes les tribulations à l’avenir, aussi bien que <strong>des feux éternels où Satan et ses ministres voudraient nous plonger</strong> ; car <strong>Jésus, le fils de Dieu, nous a promis de nous en arracher</strong></p><p>…</p><p>Vous avez jeté comme un manteau d’ignominie sur tous ceux qui portent le nom de Jésus et qu’on appelle Chrétiens, mais Dieu le fera disparaître un jour, quand il nous ressuscitera tous, qu’il enverra les uns incorruptibles, immortels, impassibles, dans son royaume éternel, ce royaume qui ne passera point ; <strong>et qu’il précipitera les autres au milieu de feux et de <mark>supplices qui n’auront pas de fin</mark></strong>.</p><p>…</p><p>Il partagera votre nation comme vous avez partagé le corps du prophète ; il recevra les uns, selon leurs mérites, dans son royaume éternel, avec les saints patriarches et les saints prophètes, et <strong>il condamnera les autres à un feu qui ne s’éteindra jamais</strong> ; il les y précipitera avec ceux des autres nations qui leur ressemblent par leur incrédulité et leur endurcissement. C’est lui-même qui l’a déclaré : « Plusieurs, dit-il, viendront d’Orient et d’Occident, et auront part avec Abraham, Isaac et Jacob, au royaume des cieux ; tandis que les enfants du royaume seront jetés dans les ténèbres extérieures. »</p><p>…</p><p>Nous savons d’Isaïe que <strong><mark>les membres des prévaricateurs seront dévorés par les vers et par un feu qui ne s’éteindra jamais ; qu’ils seront indestructibles</mark></strong> pour être un exemple et un spectacle offert à tous les hommes.</p><p>…</p><p>Afin que, par l’économie de ce mystère, le serpent, qui dès le commencement avait exercé sa méchanceté, et les anges devenus semblables à lui, vissent leur puissance anéantie, que les hommes ne craignissent plus la mort, <strong>qu’au second avénement du Christ</strong> elle s’éloignât pour toujours de ceux qui croient en lui et ne cherchent qu’à lui plaire, qu’en un mot elle n’existât plus lorsque les uns <strong><mark>auront subi le jugement et la condamnation qui les enverra au supplice d’un feu éternel</mark></strong>, et que les autres entreront dans cette heureuse immortalité qui les affranchira pour toujours de la souffrance, de la misère et de la corruption.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Dialogue_avec_Tryphon">Dialogue avec Tryphon</a>)</p><h3>Les supplices sont une justice</h3><blockquote><p>On objectera peut-être, avec les prétendus philosophes, que <strong>ce ne sont que des mots et des épouvantails, ce que nous disons du châtiment des méchants dans le feu éternel, et que nous voulons amener les hommes à la vertu par la crainte, et non par l’amour du bien. Je répondrai en peu de mots. Si ces châtiments n’existent pas, il n’y a pas de Dieu ; ou bien, s’il y en a un, il ne s’occupe pas des hommes, il n’y a ni bien ni mal, et, comme nous l’avons dit antérieurement, les législateurs sont injustes, quand ils punissent ceux qui violent leurs sages prescriptions</strong>… Mais non, ils ne sont pas injustes, ni eux ni leur Père, qui nous enseigne par son Verbe à l’imiter, et ceux qui ne leur obéissent pas sont injustes[6].</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Deuxi%C3%A8me_Apologie">Deuxième Apologie</a>)</p><h2>Eschatologie</h2><h3>Les deux seuls avènements du Christ</h3><blockquote><p>Eh bien, repris-je, si nous sommes obligés, d’après l’Écriture, de reconnaître que les prophètes ont prédit <strong><mark>deux avénements du Christ</mark></strong>, <strong><mark>l’un</mark></strong> qui le fera voir sans éclat, sans beauté, exposé à toutes les douleurs, <strong><mark>l’autre</mark></strong> qui nous le montrera environné de gloire et s’avançant comme le juge de tous les hommes, ainsi que nous l’avons prouvé plus haut par tant d’endroits de l’Écriture, comment ne pas voir qu’il s’agit du second avénement dans ces mots de jour grand et terrible, et que c’est de ce dernier avénement qu’Élie est annoncé comme précurseur ?</p><p>…</p><p>Jésus-Christ lui-même, continuai-je, nous apprend qu’Élie doit venir en personne. Mais nous savons qu’il parle du jour où <strong>le Christ viendra du ciel dans toute sa gloire</strong>. <strong>Quant au premier avénement, on peut dire aussi qu’Élie a paru</strong> ; car l’esprit de Dieu qui était en lui s’est manifesté comme précurseur dans la personne de saint Jean, un des prophètes sortis de votre nation et le dernier qui parut parmi vous.</p><p>…</p><p>Insensés ! ils ne comprennent pas ce qui est si clair et si évident, d’après toutes les paroles de l’Écriture, que <strong><mark>deux avénements du Christ</mark> nous sont prédits : <mark>l’un</mark>, dans lequel il sera sans gloire, homme de douleur, couvert d’ignominie, et enfin crucifié ; <mark>l’autre</mark>, où il descendra du ciel dans tout l’appareil de sa majesté</strong>.</p><p>…</p><p>La vigne plantée par le Dieu tout-puissant et par le Dieu sauveur, c’est le peuple qu’il s’est formé. Pour le reste de la prophétie, il aura son effet <strong>au jour du second avénement</strong>.</p><p>…</p><p>Au sujet de <strong>ces deux avénements</strong>, je dois vous rappeler que déjà du temps de Moïse ils avaient été figurés d’une manière mystérieuse par les deux boucs que l’on offrait les jours de jeûne.</p><p>…</p><p>Et ces deux boucs, entièrement pareils, que la loi ordonne d’offrir les jours de jeûne, dont l’un était envoyé dans le désert et l’autre immolé, ne représentent-ils pas <strong><mark>les deux avénements de Jésus-Christ</mark></strong> ? <strong><mark>le premier</mark></strong>, lorsque les anciens du peuple et les prêtres traitèrent Jésus-Christ comme on traitait le bouc émissaire, car ils l’ont traîné hors de la ville, ils ont porté sur lui leurs mains, ils l’ont dévoué à la mort ; <strong><mark>le second</mark></strong>, lorsque vous reconnaîtrez, <strong>dans le lieu même de Jérusalem</strong>, ce Jésus que vous avez accablé d’outrages, et qui était la victime de propitiation pour tous ceux qui veulent faire pénitence, et qui observent le jeûne dont parle Isaïe.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Dialogue_avec_Tryphon">Dialogue avec Tryphon</a>)</p><blockquote><p>Les prophètes ont annoncé <strong><mark>un double avènement du Christ</mark></strong> : <strong><mark>l’un</mark></strong>, qui a déjà eu lieu, comme d’un homme méprisé et passible ; <strong><mark>l’autre</mark></strong> qui aura lieu, ainsi qu’il est prédit, <strong>lorsqu’il viendra du ciel, dans la gloire, avec l’armée de ses anges. Alors, il ressuscitera les corps de tous les hommes qui ont existé, il revêtira les justes d’immortalité, et il enverra dans le feu éternel les méchants, qui souffriront éternellement avec les démons</strong>.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Premi%C3%A8re_Apologie">Première Apologie</a>)</p><h3>Le second avènement du Christ s’accomplit pour la résurrection, le jugement, le châtiment et la récompense</h3><blockquote><p>Les prophètes ont annoncé un double avènement du Christ : l’un, qui a déjà eu lieu, comme d’un homme méprisé et passible ; l’autre qui aura lieu, ainsi qu’il est prédit, <strong><mark>lorsqu’il viendra du ciel, dans la gloire</mark>, avec l’armée de ses anges. Alors, il <mark>ressuscitera</mark> les corps de tous les hommes qui ont existé, il revêtira les justes d’immortalité, et il enverra dans le feu éternel les méchants, qui souffriront éternellement avec les démons</strong>.</p><p>…</p><p><strong>Sachant par les prophètes que le Christ devait venir et que les impies seraient punis par le feu</strong>.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Premi%C3%A8re_Apologie">Première Apologie</a>)</p><h3>Le second avènement du Christ peut survenir d’un moment à l’autre</h3><blockquote><p>Songez-y, <strong>très-peu de temps vous est encore laissé pour venir à nous</strong>. <strong><mark>Si le jour du Christ vous surprend dans votre incrédulité, en vain vos larmes attesteront votre repentir</mark></strong>, vous ne serez pas écoutés.</p><p>…</p><p><strong>Et n’est-ce pas là ce qui s’accomplit depuis que le Christ est ressuscité d’entre les morts et monté aux cieux ? <mark>Le temps court à sa fin</mark> ; il apparaît, il est déjà à la porte</strong> celui qui doit vomir tant de blasphèmes contre le Très-Haut et régner selon Daniel <strong>un temps, puis des temps, et de plus un demi-temps</strong>.</p><p>…</p><p>Car le Christ est ici annoncé avec tous les traits qui le caractérisent, c’est-à-dire et comme roi, et comme prêtre, et comme Dieu, Seigneur, ange, homme, chef d’armée, comme pierre angulaire, comme enfant qui naît, comme homme de douleurs, <strong><mark>puis retournant au ciel, venant ensuite avec gloire, et possédant l’empire éternel</mark></strong>, ainsi que je vous le prouve d’après toutes les Écritures. … <strong>Il jugera</strong> les pauvres d’entre le peuple, il sauvera les fils du pauvre, il brisera l’oppresseur. <strong>Il sera craint</strong> autant que dureront le soleil et la lune <strong>pendant le cours des générations</strong>.</p><p>…</p><p>Voilà pourquoi nous prions pour vous et pour tous ceux qui nous haïssent : nous demandons que touchés de repentir, à notre exemple, vous rentriez en vous-mêmes, vous cessiez vos blasphèmes contre Jésus-Christ, que sa doctrine, les oracles qui l’ont annoncé, les œuvres, et les prodiges qui s’opèrent en son nom vous montrent si pur et si saint ; et que devenus ses disciples, vous <strong>obteniez le salut au jour de son second avénement, lorsqu’il apparaîtra dans toute sa gloire</strong>, au lieu d’entendre de sa bouche la sentence qui vous condamnerait <strong>à un feu éternel</strong>.</p><p>…</p><p>Eh bien ! dit Tryphon, supposons les choses comme vous le dites : j’admets que le Christ soit la pierre angulaire ; je vous accorde que les oracles aient annoncé qu’il devait souffrir, mais qu’<strong><mark>après son premier avénement</mark></strong> <strong><mark>il reparaîtrait environné de gloire, qu’il jugerait tous les hommes, qu’il serait le roi, le prêtre éternel</mark></strong> ; mais prouvez-moi que votre Jésus est bien le Christ que les prophètes ont ainsi annoncé.</p><p>…</p><p>Nous ferions bien, dit alors Tryphon, d’obéir à nos docteurs, qui nous défendent expressément tout rapport avec vous, pour n’être pas exposés à entendre un pareil langage ; car vous proférez là bien des impiétés, quand vous voulez nous persuader que votre crucifié conversa avec Moïse et Aaron, qu’il leur parla du sein de la colonne de nuées, qu’ensuite il s’est fait homme, qu’il a été mis en croix, qui est monté au ciel, qu’il paraîtra de nouveau sur la terre, qu’enfin il faut l’adorer.</p><p>…</p><p>Afin que, par l’économie de ce mystère, le serpent, qui dès le commencement avait exercé sa méchanceté, et les anges devenus semblables à lui, vissent leur puissance anéantie, que les hommes ne craignissent plus la mort, qu’<strong><mark>au second avénement du Christ</mark></strong> elle s’éloignât pour toujours de ceux qui croient en lui et ne cherchent qu’à lui plaire, qu’en un mot elle n’existât plus lorsque les uns <strong><mark>auront subi le jugement et la condamnation qui les enverra au supplice d’un feu éternel</mark></strong>, et que <strong><mark>les autres entreront dans cette heureuse immortalité qui les affranchira pour toujours de la souffrance, de la misère et de la corruption</mark></strong>.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Dialogue_avec_Tryphon">Dialogue avec Tryphon</a>)</p><h4>Tous attendent le second avènement du Christ</h4><blockquote><p>« Il sera l’attente des nations. » Cette parole signifiait que <strong>dans toutes les nations on attendrait son second avènement</strong>. <strong>Or vous pouvez le voir et vous convaincre du fait</strong> : <strong><mark>dans toutes les nations, on espère en ce crucifié de la Judée</mark></strong>, après la mort duquel la patrie des Juifs a été conquise par vos armes et livrée entre vos mains.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Premi%C3%A8re_Apologie">Première Apologie</a>)</p><h3>Justin pense que le Christ viendra juger de son vivant</h3><p>Il pense que cette race sera sauvée, et <strong>peut-être</strong> même ceux qui ne sont pas encore nés :</p><blockquote><p>Nous appelons le chef des démons serpent, satan et diable, comme vous pouvez le voir en lisant nos livres. <strong>Il sera jeté au feu, avec son armée et les hommes qui le suivent, pour y être éternellement puni</strong> : ainsi l’a prédit le Christ[70]. <strong>Si Dieu diffère ce châtiment, c’est à cause des hommes ; car il sait qu’il y en a qui doivent se sauver par la pénitence</strong>, <strong><mark>même parmi ceux qui ne sont pas encore nés</mark></strong>.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Premi%C3%A8re_Apologie">Première Apologie</a>)</p><h3>Le Christ a établi son règne dans le ciel</h3><blockquote><p>Dans une autre prophétie, l’Esprit prophétique annonce par le même David <strong>qu’après avoir été mis en croix, le Christ règnera</strong>. … <strong>Au contraire, notre Jésus-Christ a été crucifié, est mort, est ressuscité, et <mark>il est remonté au ciel où il règne</mark></strong>, et la bonne nouvelle, répandue dans le monde entier par les apôtres, est la joie de ceux qui attendent l’immortalité qu’il a promise.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Premi%C3%A8re_Apologie">Première Apologie</a>)</p><h3>Le Royaume éternel du Christ</h3><blockquote><p>Le fils de Nave ne put donner qu’un héritage passager ; il n’était pas le Christ-Dieu, le fils de Dieu ; mais le Christ, <strong>après la grande résurrection, nous donnera <mark>un héritage qui ne passera point</mark></strong>.</p><p>…</p><p>Jésus, le fils de Dieu, nous a promis … de nous revêtir des habits de gloire qu’il nous a préparés, et <strong>de nous ouvrir <mark>son royaume éternel</mark></strong>, si nous observons ses commandements.</p><p>…</p><p>Il partagera votre nation comme vous avez partagé le corps du prophète ; <strong>il recevra</strong> <strong>les uns</strong>, selon leurs mérites, dans <strong><mark>son royaume éternel</mark>, avec les saints patriarches et les saints prophètes</strong>, et il condamnera les autres à un feu qui ne s’éteindra jamais ; il les y précipitera avec ceux des autres nations qui leur ressemblent par leur incrédulité et leur endurcissement.</p><p>…</p><p>Car le Christ est ici annoncé avec tous les traits qui le caractérisent, c’est-à-dire et comme roi, et comme prêtre, et comme Dieu, Seigneur, ange, homme, chef d’armée, comme pierre angulaire, comme enfant qui naît, comme homme de douleurs, puis <strong><mark>retournant au ciel, venant ensuite avec gloire, et possédant l’empire éternel</mark></strong>, ainsi que je vous le prouve d’après toutes les Écritures. … Il <strong>jugera</strong> les pauvres d’entre le peuple, il sauvera les fils du pauvre, il brisera l’oppresseur. <strong>Il sera craint</strong> autant que dureront le soleil et la lune <strong>pendant le cours des générations</strong>.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Dialogue_avec_Tryphon">Dialogue avec Tryphon</a>)</p><h3>Le Royaume du Christ n’est pas un royaume humain</h3><p>Dans sa lettre au pouvoir romain, Justin, martyr, défend les chrétiens et rassure les gouvernants : le Royaume qu’attendent les chrétiens ne menace pas Rome, et il ne faut y voir aucune menace, car ce n’est pas un royaume humain :</p><blockquote><p>Quand vous entendez dire que nous attendons un royaume, <strong><mark>vous supposez à la légère qu’il s’agit d’un royaume humain. Mais c’est du royaume de Dieu que nous parlons</mark></strong>. Ce qui le prouve, c’est qu’à vos interrogations, nous répondons que nous sommes chrétiens, quand nous savons bien que cet aveu nous vaudra la mort. <strong><mark>Si nous attendions un royaume humain, nous nierions, pour sauver notre vie ; nous nous cacherions, pour ne pas être frustrés dans notre espérance</mark></strong>. Mais notre espérance n’est pas de ce temps présent : <strong>aussi nous ne craignons pas nos bourreaux, et d’ailleurs, de toute façon, ne faut-il pas mourir ?</strong></p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Premi%C3%A8re_Apologie">Première Apologie</a>)</p><h3>Le millénaire avant la seconde venue du Christ</h3><p>Du temps de Justin, il était encore interdit aux Juifs de revenir dans Jérusalem détruite :</p><blockquote><p>Or vous savez bien que, <strong>selon la prophétie, Jérusalem a été réduite en solitude</strong>. Sur la dévastation de la ville et sur la défense faite à tous de retourner l’habiter, le prophète Isaïe s’exprime ainsi : « Leur terre est déserte, et en leur présence, leurs ennemis la dévorent, et pas un seul d’entre eux ne l’habitera. » Vous savez bien qu’<strong>ordre est donné par vous de n’y laisser demeurer personne et de punir de mort tout Juif qu’on surprendra essayant d’y rentrer</strong>.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Premi%C3%A8re_Apologie">Première Apologie</a>)</p><p>Justin parle de cela à une époque où Jérusalem a été détruite par les Romains à la suite des révoltes juives, où il est interdit aux Juifs d’habiter Jérusalem et où les chrétiens subissent de cruelles persécutions. Justin parle de la restauration de Jérusalem et du royaume des chrétiens en elle, mais il mentionne aussi qu’il y a des chrétiens qui comprennent autrement les paroles sur le royaume de mille ans :</p><blockquote><p>… Mais, dites-moi, est-ce de bonne foi que vous avancez que Jérusalem sera rebâtie ? que votre peuple s’y rassemblera, pour y vivre heureux avec le Christ en la compagnie des patriarches, des prophètes et des justes de l’ancienne loi, ou même de ceux d’entre nous qui se convertiraient à votre Christ avant qu’il apparaisse de nouveau ; ou bien est-ce pour mieux montrer votre habileté dans la controverse que vous avez émis une pareille opinion ?</p><p>— Tryphon, je ne suis pas homme à dire ce que je ne pense pas. <strong>Je vous ai déjà fait l’aveu que plusieurs partageaient avec moi ce sentiment ; mais je vous ai dit aussi que beaucoup d’autres dont la doctrine est pure et saine sont d’un avis différent.</strong> Nous ne tenons pas compte de ceux qui se disent Chrétiens, mais qui au fond ne sont que des hérétiques impies ou athées ; je vous ai dit que tout ce qu’ils enseignaient n’était qu’un tissu de blasphèmes aussi impies qu’extravagans ;</p><p>…</p><p>Si vous rencontrez des gens qui se disent Chrétiens et qui, au lieu de suivre ces principes, osent blasphémer le Dieu d’Abraham, le Dieu d’Isaac et de Jacob, et dire <strong>qu’il n’y a pas de résurrection des morts</strong>, mais qu’aussitôt après cette vie les âmes sont reçues dans le ciel, gardez-vous de les considérer comme Chrétiens ; ainsi tout homme de bon sens ne rangera point parmi les Juifs ceux qu’on appelle saducéens, et les sectes semblables connues sous le nom de genistes, de méristes, de galiléens, de hellénistes, de pharisiens, de baptistes.</p><p>…</p><p>Mais, <strong>pour moi et pour les Chrétiens, dont la doctrine est pure sur tous les points, nous savons qu’il y aura une résurrection des corps</strong>, que nous passerons mille ans dans Jérusalem rebâtie, embellie, agrandie comme nous le promettent Isaïe, Ézéchiel et d’autres prophètes.</p><p>…</p><p>Ces paroles : « Les jours de mon peuple égaleront les jours des plus grands arbres, et les œuvres de ses mains ne vieilliront jamais, » ne semblent-elles pas désigner d’une manière mystérieuse une durée de mille ans. Il fut dit à Adam qu’il mourrait, le jour même qu’il aurait mangé du fruit défendu, et nous savons qu’il vécut près de mille ans ? C’est qu’en effet, aux yeux du Seigneur, mille ans sont comme un jour, et ces mots du prophète trouvent encore ici leur application. Ajoutez le témoignage d’un apôtre de Jésus-Christ, un de nos écrivains sacrés, nommé Jean. Il nous annonce, parmi les choses qui lui furent révélées, que <strong>ceux qui auront eu foi en notre Christ passeront mille ans à Jérusalem, <mark>qu’ensuite</mark> <mark>tous les hommes ressusciteront ensemble et en un même moment</mark>, <mark>que cette résurrection sera générale, éternelle</mark>, <mark>et qu’il y aura pour tous un jugement</mark></strong>. Notre Seigneur lui-même nous l’apprend par ces paroles : « Ils ne se marieront point, mais ils seront semblables aux anges en leur qualité d’enfants de Dieu dignes de la résurrection. »</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Dialogue_avec_Tryphon">Dialogue avec Tryphon</a>)</p><p><strong><mark>Important !</mark> </strong>Il faut garder à l’esprit que les saints Pères du Ier siècle, y compris ceux qui avaient été formés par l’apôtre Jean le Théologien (auteur de l’Apocalypse), ne se sont pas exprimés sur le royaume de mille ans des chrétiens à Jérusalem. Il existe un témoignage que l’auteur du IIe siècle rapporte aux petits-fils de l’apôtre au Ier siècle (<a href="https://bibleox.com/fr/ru/w/%D1%85%D0%B8%D0%BB%D0%B8%D0%B0%D0%B7%D0%BC/">citations (en russe)</a>), selon lequel le Royaume du Christ ne sera pas sur la terre, mais au ciel. À partir du IIIe siècle environ, l’Église témoigne clairement que les paroles sur le royaume de mille ans tirées du livre de l’Apocalypse doivent être comprises allégoriquement, comme la majeure partie du reste du livre de l’Apocalypse, où est présentée la vision de l’apôtre Jean. Cette période de mille ans est tout le temps écoulé depuis la première jusqu’à la seconde venue du Seigneur Jésus-Christ. Citations : <a href="https://bibleox.com/fr/ru/w/%D1%85%D0%B8%D0%BB%D0%B8%D0%B0%D0%B7%D0%BC">millénarisme (en russe)</a></p><p>Justin rapporte aussi que les chrétiens attendent précisément la seconde venue du Christ (et non le royaume de mille ans), que cette venue peut se produire à tout moment, qu’il ne reste plus qu’une seule venue du Christ, que les chrétiens attendent le royaume éternel (et non millénaire), qui n’est pas semblable aux royaumes humains, que le Christ lui-même a déjà établi son règne dans le ciel, et qu’à la seconde venue du Christ doivent se produire tous les événements restants : une seule résurrection universelle de tous les hommes, un seul jugement universel, le châtiment des pécheurs, la récompense des justes, le passage de tout cela à l’état éternel.</p><p>Il faut dire un mot à part de cette citation :</p><blockquote><p>Si vous rencontrez des gens qui se disent Chrétiens et qui, au lieu de suivre ces principes, osent blasphémer le Dieu d’Abraham, le Dieu d’Isaac et de Jacob, <strong>et dire qu’il n’y a pas de résurrection des morts, mais qu’aussitôt après cette vie les âmes sont reçues dans le ciel, gardez-vous de les considérer comme Chrétiens</strong> ; ainsi tout homme de bon sens ne rangera point parmi les Juifs ceux qu’on appelle saducéens, et les sectes semblables connues sous le nom de genistes, de méristes, de galiléens, de hellénistes, de pharisiens, de baptistes.</p></blockquote><p>Justin était philosophe. Il dénonce ici les doctrines gnostiques contemporaines, qui empruntent et retravaillent les idées platoniciennes. Dans certaines de ces doctrines, le corps est une prison pour l’esprit, conséquence de la chute loin de Dieu. En fin de compte, on attend le retour de tous ces esprits à leur état originel, sous la forme d’esprits invisibles qui demeurent avec Dieu. C’est précisément cette ancienne doctrine philosophique que condamne ici le philosophe Justin. <a href="https://bibleox.com/fr/ru/w/%D0%98%D1%83%D1%81%D1%82%D0%B8%D0%BD_%D1%84%D0%B8%D0%BB%D0%BE%D1%81%D0%BE%D1%84-%D0%B2%D0%B5%D1%80%D0%B0_%D0%B2_%D0%BF%D0%BE%D1%81%D0%BC%D0%B5%D1%80%D1%82%D0%BD%D1%83%D1%8E_%D1%83%D1%87%D0%B0%D1%81%D1%82%D1%8C_%D1%81_%D0%91%D0%BE%D0%B3%D0%BE%D0%BC">Analyse détaillée et preuves (en russe)</a>.</p><p>Que les âmes des justes, après la mort, aillent vers le Père et le Roi céleste (le Christ, qui a établi son règne dans le ciel), il le reconnaît expressément en un autre endroit :</p><blockquote><p>Sans autre réponse, Urbicus dit à Lucius : « Tu me parais, toi aussi, être chrétien. — Certainement, » répondit Lucius, et il le fit également emmener. <strong>Le condamné lui rendit grâce : mourir, c’était pour lui être délivré de ces maîtres injustes <mark>pour aller auprès du père et du roi des cieux</mark></strong> (πρὸς τὸν πατέρα καὶ βασιλέα τῶν οὐρανῶν πορεύεσθαι).</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Deuxi%C3%A8me_Apologie">Deuxième Apologie</a>)</p><blockquote><p>… <strong>Ce n’est pas, reprit le vieillard, que je prétende qu’une seule âme périsse</strong>, car tout l’avantage serait pour les méchants. Que vous dirai-je ? <strong><mark>Les âmes des justes sont appelées à une meilleure vie, et celles des méchants envoyées dans un lieu de souffrances</mark></strong>, où elles attendent le jour du jugement. <strong><mark>Celles que Dieu juge dignes de le voir</mark></strong>, ne meurent point, et les autres sont punies aussi longtemps qu’il plaît à Dieu qu’elles vivent et qu’elles soient punies.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Dialogue_avec_Tryphon">Dialogue avec Tryphon</a>)</p><h3>Une seule résurrection universelle et un seul jugement universel</h3>
      <blockquote><p>Vous avez jeté comme un manteau d’ignominie sur tous ceux qui portent le nom de Jésus et qu’on appelle Chrétiens, mais Dieu le fera disparaître un jour, quand <strong><mark>il nous ressuscitera tous</mark></strong>, <strong>qu’il enverra les uns incorruptibles</strong>, immortels, impassibles, <strong>dans son royaume éternel, ce royaume qui ne passera point</strong> ; et <strong>qu’il précipitera les autres au milieu de feux et de supplices qui n’auront pas de fin</strong>.</p><p>…</p><p>Si dès <strong>son premier avénement, qui était celui des humiliations et des mépris</strong>, il a déjà jeté tant d’éclat et déployé une si grande force, qu’il a pu se faire connaître de toutes les nations, ramener à la vertu des hommes plongés depuis si longtemps dans le crime, au point que les démons tremblent à son nom ; que les royaumes et les principautés le redoutent plus que toutes les puissances qui ont jamais existé ; comment ne pourrait-il pas, <strong><mark>au jour de son glorieux avénement, renverser ceux qui l’ont poursuivi de leur haine, ou qui l’ont indignement abandonné et introduire dans son repos ses fidèles serviteurs et les combler de tous les biens qu’il leur a promis</mark></strong> ?</p><p>…</p><p>Car notre maître, celui dont je vous parle, viendra, plein de force et de puissance, <strong><mark>redemander à chacun de nous ses propres dons</mark></strong>. Il ne condamnera point l’économe qui aura placé partout l’argent qu’il a reçu, et qui se sera bien gardé de l’enfouir sous aucun prétexte, parce qu’il savait que le maître était sévère et <strong>qu’il devait venir un jour réclamer ce qu’il a confié</strong>.</p><p>…</p><p>Vous ne le poursuivriez pas de vos blasphèmes comme vous le faites depuis qu’il est venu, qu’il est né, qu’il a souffert, qu’il est monté aux cieux, <strong>lui qui doit revenir un jour. Quels gémissements feront entendre alors vos douze tribus !</strong> Car, si vous aviez l’intelligence de toutes les paroles des prophètes, vous ne pourriez refuser de le connaître comme Dieu et fils du Dieu unique, incréé, inénarrable.</p><p>…</p><p>Elle aura cet avantage de vous faire bien connaître ce Jésus que nous reconnaissons pour le Christ et le fils de Dieu ; ce Jésus crucifié, ressuscité, monté aux cieux, et <strong><mark>qui doit venir un jour juger tous les hommes, sans excepter Adam lui-même</mark></strong>.</p></blockquote>
      <p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Dialogue_avec_Tryphon">Dialogue avec Tryphon</a>)</p>
      <h3>Dans la résurrection, les hommes ressuscitent guéris</h3>
      <blockquote><p>Il voulait convaincre ceux qui croiraient en lui que, s’ils étaient fidèles à garder ses préceptes, quelles que soient leurs infirmités corporelles, ils reprendraient un corps pur et intact au jour de son second avénement, qu’ils ressusciteraient immortels, exempts de corruption, impassibles.</p></blockquote>
      <p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Dialogue_avec_Tryphon">Dialogue avec Tryphon</a>)</p>
      <h3>La résurrection dans nos propres corps</h3>
      <blockquote><p>Admettez notre témoignage au même titre que le leur. Nous croyons autant et plus qu’eux en la divinité, et <strong><mark>nous espérons que les morts déposés en terre reprendront leurs corps</mark></strong>, car rien n’est impossible à Dieu.</p><p>…</p><p><strong><mark>De même, vous devez admettre que, dissous dans la terre et réduits à l’état de germes, les corps des hommes peuvent, au temps voulu, par l’ordre de Dieu, ressusciter et revêtir l’incorruptibilité</mark></strong>.</p></blockquote>
      <p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Premi%C3%A8re_Apologie">Première Apologie</a>)</p>
      <h2>Questions diverses</h2>
      <h3>Qui peut être sauvé et qui ne peut l’être</h3>
      <h4>Le salut et ceux qui observent la loi de Moïse</h4>
      <p>Selon saint Justin, peuvent aussi être sauvés les chrétiens qui, par faiblesse de conscience, craignent d’abandonner l’observance de la loi de Moïse. Justin estime qu’un tel homme pourrait être sauvé, à condition seulement qu’il ne se sépare pas des autres chrétiens (qui ne judaïsent pas), qu’il n’instruise personne et ne contraigne personne à judaïser :</p>
      <blockquote><p><strong><mark>À mon avis</mark></strong>, <strong>il le sera, lui répondis-je, pourvu toutefois qu’il ne cherche point à persuader aux autres, c’est-à-dire aux gentils affranchis de l’erreur par Jésus-Christ, qu’ils doivent comme lui pratiquer ces observances ; et qu’il ne soutienne pas que sans elles on ne peut obtenir le salut</strong>, comme vous le prétendiez vous-même, Tryphon, au commencement de cette discussion : car vous m’avez dit formellement que je ne serais pas sauvé, si je n’observais pas la loi.</p><p>Tryphon reprit : — <strong><mark>Mais pourquoi dites-vous : « À mon avis, cet homme sera sauvé, »</mark></strong> <strong>sinon parce que plusieurs pensent qu’il ne le sera pas ?</strong></p><p>— <strong><mark>Oui</mark></strong>, lui dis-je, il en est qui pensent ainsi. <strong>Ils craindraient de s’entretenir, de loger sous le même toit, d’avoir les moindres rapports avec les hommes dont vous parlez.</strong> Je ne partage pas leurs sentiments. <strong>Si quelques-uns d’entre vous veulent encore par faiblesse observer tout ce qu’ils peuvent d’une loi que Moïse n’avait donnée qu’à raison de la dureté du cœur ; s’ils espèrent en même temps en Jésus-Christ et observent les préceptes éternels de justice et de piété, qui sont la base de la loi naturelle, sans refuser de vivre avec les Chrétiens fidèles à Jésus-Christ, et sans chercher à leur persuader de se faire circoncire comme eux et d’observer le sabbat et les autres pratiques de la loi, je pense qu’il faut les recevoir</strong> et communiquer avec eux en toutes choses, comme avec des hommes animés de notre esprit, comme avec des frères. <strong><mark>Pour ceux de votre nation</mark></strong> qui croient, nous disent-ils, <strong><mark>en Jésus-Christ, mais qui veulent obliger les fidèles d’entre les gentils à pratiquer la loi de Moïse</mark>, <mark>et refusent de communiquer avec eux sans cette condition, je ne les recevrais pas comme les autres</mark></strong> ; je crois bien toutefois que ceux qui se laisseraient persuader d’allier l’observance de la loi avec la confession de Jésus-Christ pourraient être sauvés. Mais <strong>quant à ceux qui après avoir reconnu et confessé le Christ auraient passé aux observances légales, n’importe par quel motif, et <mark>cessé de le reconnaître pour le Messie, sans avoir fait pénitence avant de mourir</mark>, je puis vous assurer <mark>qu’il n’y a point de salut pour eux</mark></strong> ni <strong><mark>pour les descendants d’Abraham</mark> <mark>qui vivent selon la loi et meurent sans avoir cru en Jésus-Christ</mark></strong>, je parle surtout de ceux qui ont blasphémé et blasphèment encore contre lui dans leurs synagogues. Mais s’ils le confessent avant leur mort, ils seront assurément sauvés et préservés des feux éternels. Car, dans sa bonté, dans sa miséricorde dont les trésors sont infinis, comme le dit Ézéchiel, Dieu met le pécheur pénitent au même rang que le juste qui a vécu sans péché : il n’en est pas ainsi de celui qui passe des voies de la piété et de la justice dans celles du crime et de l’impiété, Dieu ne le distingue plus du pécheur, de l’homme injuste et impie. C’est pourquoi notre Seigneur Jésus-Christ nous dit : « Je vous jugerai selon les voies où je vous aurai surpris. »</p></blockquote>
      <p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Dialogue_avec_Tryphon">Dialogue avec Tryphon</a>)</p>
      <h4>Comment seront sauvés les justes de l’Ancien Testament</h4>
      <blockquote><p>— Dites-moi, si ceux qui ont vécu selon la loi de Moïse auront part à la vraie vie, comme Hénoch, Jacob, Noé, au jour de la résurrection des morts.</p><p>— Je vous ai déjà cité, lui répondis-je, ces paroles d’Ézéchiel : « Non, quand Noé, Jacob, Daniel demanderaient grâce pour leurs fils et pour leurs filles, ils ne l’obtiendraient pas. » Car <strong>personne ne sera sauvé pour les œuvres de ses pères</strong>. Je vous ai dit aussi que <strong>ceux qui auraient suivi la loi de Moïse pourraient, comme les justes dont vous venez de parler, arriver au salut</strong>. <strong>Car les grands préceptes de justice, de piété que comprend la loi naturelle, se trouvent aussi dans la loi de Moïse et sont obligatoires pour ceux qui vivent sous elle, aussi bien que les pratiques qui ont été données à cause de la dureté de votre cœur</strong>, <strong><mark>et qui furent toujours observées par les enfants de la loi</mark></strong>. Dès lors qu’ils suivaient les préceptes de la loi naturelle, éternelle, universelle, ils sont agréables à Dieu ; et <strong>par Jésus-Christ au jour de la résurrection, Dieu les assimilera aux justes qui les ont précédés, tels que Noé, Hénoch, Jacob et d’autres encore ; ils obtiendront tous le salut avec ceux qui reconnaissent Jésus-Christ pour le fils de Dieu</strong></p></blockquote>
      <p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Dialogue_avec_Tryphon">Dialogue avec Tryphon</a>)</p><h3>Liberté et destin</h3><blockquote><p>Chacun, selon ses œuvres, sera châtié, puni ou récompensé : nous avons appris cette doctrine des prophètes et nous la tenons pour vraie. <strong><mark>S’il n’en était pas ainsi, si tout était l’œuvre du destin, il n’y aurait plus de libre arbitre</mark>. Si c’est le destin qui veut que celui-ci soit bon, et celui-là mauvais, celui-ci n’est pas digne d’éloge ni celui-là de blâme</strong>. Et si l’homme ne peut, par le choix libre de sa volonté, éviter le mal et faire le bien, il n’a aucunement à répondre de ses actions. Mais voici qui prouve que l’homme fait librement le bien et le mal. Nous voyons le même homme passer d’un extrême à l’autre. <strong><mark>S’il était fatalement bon ou mauvais, il n’y aurait pas de ces contradictions dans sa conduite, et il ne changerait pas constamment</mark></strong>. Il n’y aurait ni hommes vertueux ni hommes dépravés, <strong>puisque le destin serait cause en même temps du bien et du mal, et qu’il serait contradictoire à lui-même</strong>. Ou bien encore, il faudrait admettre, comme nous l’avons dit plus haut[108], que le bien et le mal ne sont rien, et que la vertu et le vice sont choses d’opinion. Or la saine raison nous dit que c’est là une impiété et une injustice odieuse. <strong><mark>À nos yeux, le vrai destin inévitable, c’est la juste récompense du bien et le juste châtiment du mal</mark></strong>.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Premi%C3%A8re_Apologie">Première Apologie</a>)</p><blockquote><p>Ce n’est pas non plus par la loi du destin qu’arrive ce que l’homme fait ou souffre : <strong><mark>chacun fait librement le bien ou le mal</mark></strong>. … Non, Dieu a fait au commencement les hommes et les anges maîtres d’eux-mêmes, et c’est pourquoi ils seront punis dans le feu éternel du mal qu’ils auront fait. Toute créature est capable de bien et de mal : on n’aurait aucun mérite, si on ne pouvait choisir entre deux voies.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Deuxi%C3%A8me_Apologie">Deuxième Apologie</a>)</p><h3>Il préférait la Septante</h3><blockquote><p>Si je prouve que la prophétie d’Isaïe regarde notre Christ, et non pas Ézéchias, comme vous le prétendez, <strong>cesserez-vous enfin de vous en rapporter à vos docteurs qui osent soutenir que la version des Septante faite sous Ptolémée, roi d’Égypte, est infidèle en plusieurs endroits ? Car tous les passages qui prouvent évidemment combien leurs interprétations sont insensées, combien ils sont pleins d’eux-mêmes, ils ne craignent pas de dire qu’on les a altérés, qu’ils ne sont pas conformes au texte. Mais trouvent-ils un passage qui leur paraisse susceptible de pouvoir être modifié et amené à signifier une action purement humaine, ils disent que ce passage ne s’entend pas de notre Christ ; ils l’appliquent à tout autre personnage qu’il leur plaît d’imaginer.</strong></p><p>…</p><p><strong>M’en rapporterai-je à vos docteurs, qui prétendent que les soixante-dix vieillards réunis chez Ptolémée, roi d’Égypte, n’entendaient pas les divines Écritures, et qui refusent d’admettre leur interprétation pour nous donner la leur.</strong> Je ne veux pas vous laisser ignorer que <strong>ces docteurs ont retranché de la version faite avec tant de soin par les soixante-dix vieillards chez Ptolémée une foule de passages qui attestent que les divins oracles avaient annoncé que ce Jésus mis en croix était Dieu, était homme ; qu’il serait crucifié, qu’on le ferait mourir.</strong> Comme je sais que tous les vôtres refusent d’admettre ces passages, je crois inutile de m’y arrêter. Je m’attache de préférence à ceux que vous ne contestez pas ; car vous avez reconnu tous ceux que j’ai cités.</p><p>…</p><p>Mais vous autres, que faites-vous ? <strong>Vous osez réformer la version des soixante-dix vieillards</strong> ; vous prétendez qu’ils ont mal traduit le passage qui nous occupe et qu’il faut dire : « Voici qu’une jeune fille enfantera, etc. » Quelle grande merveille serait donc annoncée, s’il s’agissait ici d’une femme qui dût concevoir comme il arrive à toutes celles qui sont encore jeunes, à moins qu’elles ne soient stériles ?</p><p>…</p><p>Je pourrais ici contester avec vous sur les mots que vous rendez de cette manière : « Jusqu’à ce que viennent les choses qui lui sont promises. » <strong>Ce n’est pas ainsi que traduisent les Septante</strong>.</p><p>…</p><p><strong>La version des Septante</strong> porte : « Voici que vous mourez comme des hommes et que vous tombez comme un des rois. »</p><p>…</p><p><strong>Quant aux Septante, ajoutai-je, c’est ainsi qu’ils traduisent</strong> : « Il marqua les limites des peuples selon le nombre des anges du Seigneur. »</p><p>…</p><p>Mes amis, leur dis-je, <strong>je rétablis</strong> un certain passage de l’Écriture, <strong>dans le sens que</strong> <strong>lui donnent les Septante</strong>. Quand je l’ai cité selon le vôtre, j’ai voulu vous mettre à l’épreuve.</p><p>…</p><p>En rappelant le passage où il est dit : « Malheur à eux, car ils prennent des conseils contre eux-mêmes, » <strong>j’ai ajouté, d’après la version des Septante</strong> : « Meure le juste, il nous est inutile ! » Au commencement de cet entretien, j’avais donné votre sens : « Meure le juste, sa vue nous importune ! »</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Dialogue_avec_Tryphon">Dialogue avec Tryphon</a>)</p><h4>Histoire de la Septante</h4><blockquote><p>Or Ptolémée, roi d’Égypte, fonda une bibliothèque où il voulut réunir les ouvrages de tous les écrivains. Ayant eu connaissance de ces prophéties, il fit demander à Hérode, qui régnait alors en Judée, de lui envoyer ces livres[72]. Le roi Hérode les lui envoya, écrits, comme je l’ai dit, en hébreu. Comme personne n’entendait cette langue en Égypte, Ptolémée lui fit demander de lui envoyer des savants pour les traduire en grec. Ces traductions furent faites : elles existent encore en Égypte et on les trouve partout entre les mains des Juifs.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Premi%C3%A8re_Apologie">Première Apologie</a>)</p><h3>Il appelait l’Évangile les mémoires et les écrits des apôtres</h3><blockquote><p>Et comme nous lisons dans <strong>les écrits de ses apôtres</strong> qu’il est vraiment fils de Dieu, nous nous plaisons à l’appeler de ce nom et nous comprenons qu’il l’est en effet, puisqu’il est engendré du Père avant toutes choses, par la vertu et la volonté de ce Père.</p><p>…</p><p>Il s’est tû, il a refusé de répondre, devant Pilate, à tous ceux qui l’interrogeaient, comme nous l’apprenons par <strong>les écrits de ses apôtres</strong>, afin que cette parole d’Isaïe eût aussi son accomplissement.</p><p>…</p><p>Aussitôt que Jésus-Christ eut quitté le fleuve du Jourdain, où se fit entendre sur lui la voix qui avait dit : « Vous êtes mon fils, je vous ai engendré aujourd’hui, » le démon s’approcha de lui pour le tenter, ainsi que nous l’expriment <strong>les livres des apôtres</strong>.</p><p>…</p><p><strong>Dans les livres</strong> qui furent écrits, ainsi que je le soutiens, <strong>par ses apôtres et par leurs disciples</strong>, il est rapporté qu’une sueur qui ressemblait à des gouttes de sang découla de son corps.</p><p>…</p><p>Pourrez-vous trouver des paroles plus claires pour exprimer le genre de mort auquel le Christ devait être condamné par l’assemblée des méchants, que l’Écriture désigne sous les noms de chiens et de chasseurs, faisant ici allusion aux réunions et aux conseils que tinrent, pour le perdre, les chefs du peuple qui avaient juré sa perte ? Quoi de plus conforme au <strong>récit des apôtres</strong> ?</p><p>…</p><p>N’avons-nous pas prouvé qu’il est le fils unique de Dieu, créateur de toutes choses, qu’il est la vertu, le Verbe engendré de lui ; qu’ensuite il s’est fait homme ; qu’il est né d’une vierge, comme nous l’apprennent <strong>les écrits des apôtres</strong> ?</p><p>…</p><p>Lorsque le fils de Dieu rendit l’esprit sur la croix, nous disent <strong>les écrits de ses apôtres</strong>, il s’écria : « Seigneur, je remets mon âme entre vos mains. »</p><p>…</p><p><strong>Ils nous disent encore</strong> de quelle manière il exhortait ses disciples à surpasser en vertu les pharisiens, s’ils voulaient parvenir au salut.</p><p>…</p><p>Alors il parut au milieu des apôtres, qu’il regardait comme ses frères ; et toutes les fois qu’il se trouvait au milieu d’eux, il se mettait à louer le Seigneur, ainsi que le rapportent <strong>leurs écrits</strong>.</p><p>…</p><p>Si vous lui voyez <strong>changer le nom d’un de ses apôtres en celui de Pierre</strong>, et appeler les deux frères, fils de Zébédée, du nom de Boanergès, qui veut dire fils du tonnerre, reconnaissez en lui ce même Dieu qui changea autrefois le nom de Jacob en celui d’Israël.</p><p>…</p><p><strong>Il avait lui-même prédit qu’il ressusciterait trois jours après qu’il aurait été mis en croix</strong>, ainsi que nous l’apprennent les mêmes évangélistes.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Dialogue_avec_Tryphon">Dialogue avec Tryphon</a>)</p><h3>Il reconnaissait le livre de l’Apocalypse</h3><blockquote><p>Ajoutez le témoignage d’<strong>un apôtre de Jésus-Christ, un de nos écrivains sacrés, nommé Jean</strong>. Il nous annonce, parmi les choses qui lui furent révélées, que ceux qui auront eu foi en notre Christ passeront mille ans à Jérusalem, qu’ensuite tous les hommes ressusciteront ensemble et en un même moment, que cette résurrection sera générale, éternelle, et qu’il y aura pour tous un jugement. Notre Seigneur lui-même nous l’apprend par ces paroles : « Ils ne se marieront point, mais ils seront semblables aux anges en leur qualité d’enfants de Dieu dignes de la résurrection. »</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Dialogue_avec_Tryphon">Dialogue avec Tryphon</a>)</p><h3>Les hérétiques</h3><blockquote><p>Et voilà ce qu’on ne verra jamais faire à ceux des gentils auxquels Jésus-Christ a fait connaître le Dieu créateur de l’univers : ils endureraient plutôt toutes les tortures, tous les supplices et jusqu’à la mort la plus cruelle, que de fléchir le genou devant les faux dieux, que de manger seulement des viandes offertes aux idoles.</p><p>Cependant, reprit Tryphon, j’entends dire que <strong>plusieurs de ceux qui confessent le Christ, et qu’on appelle Chrétiens, mangent de ces viandes et prétendent ne contracter aucune souillure</strong>.</p><p><strong><mark>Ce sont des hommes qui, tout en se disant Chrétiens, tout en confessant que Jésus crucifié est le Seigneur et le Christ, ne suivent point sa doctrine, mais celle des esprits de ténèbres</mark></strong> ; et par là même qu’il existe des hommes de ce caractère, nous ses disciples attachés à la doctrine véritable et pure, nous n’en sommes que plus fermes, plus inébranlables dans la foi qu’il nous a enseignée.</p><p>…</p><p><strong><mark>Il y a eu et il existe encore, mes amis, beaucoup de ces hommes qui, sous le nom de Jésus, enseignent les plus monstrueuses impiétés : nous les désignons par le nom des sectes et des hérésies dont ils ont été les auteurs</mark></strong>, car chacun d’eux enseigne à sa manière ses affreux blasphèmes contre le Dieu créateur de toutes choses, contre le Christ, dont ce Dieu avait annoncé la venue, contre le Dieu d’Abraham, d’Isaac et de Jacob. <strong><mark>Nous ne communiquons point avec ces hommes ; nous les savons injustes, impies, athées, sans loi ; ils n’adorent point le Christ, ils ne le confessent qu’en paroles</mark></strong> ; <strong>ils ressemblent aux gentils, qui impriment le nom de Dieu sur les ouvrages de leurs mains ; ils se parent du nom du Christ, et ils participent à des sacrifices impies, abominables</strong>. Les uns s’appellent <strong>marcionites</strong>, les autres <strong>valentiniens</strong>, ceux-ci <strong>basilidiens</strong>, ceux-là <strong>satorniliens</strong>. <strong>Tous portent le nom <mark>du chef de leur secte</mark></strong>, comme ceux qui veulent, ainsi que je l’ai dit plus haut, s’attacher à une école de philosophie, se plaisent à prendre le nom de l’auteur du système qu’ils embrassent.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Dialogue_avec_Tryphon">Dialogue avec Tryphon</a>)</p><blockquote><p>De même que chez les Grecs, tout le monde appelle communément philosophes ceux qui exposent les doctrines qui leur plaisent, quelque contradictoires qu’elles puissent être, ainsi, chez les barbares, ceux qui <strong>sont</strong> ou <strong><mark>passent pour</mark></strong> sages, ont reçu une dénomination commune : <strong>on les appelle tous chrétiens</strong>.</p><p>…</p><p><strong><mark>Ceux qui ne vivent pas selon ses préceptes, qu’ils ne soient pas tenus pour chrétiens, quand même ils proclameraient de bouche la doctrine du Christ</mark></strong> ; car il a promis le salut <strong>non à ceux qui disent, mais à ceux qui font</strong>. Il a dit en effet : « <strong>Ce n’est pas celui qui me dit : Seigneur, Seigneur</strong>, qui entrera dans le royaume des cieux, mais celui qui fait la volonté de mon Père qui est dans les cieux[47]. Quiconque m’écoute et fait ce que je dis écoute celui qui m’a envoyé[48]. Beaucoup me diront : <strong>Seigneur, Seigneur</strong>, est-ce qu’en votre nom nous n’avons pas bu et mangé, est-ce que nous n’avons pas fait des miracles ? Et alors je leur dirai : Loin de moi, ouvriers d’iniquité[49]. Alors, il y aura des pleurs et des grincements de dents, lorsque les justes brilleront comme le soleil, tandis que les méchants seront jetés au feu éternel[50]. Beaucoup viendront en mon nom, qui à l’extérieur seront revêtus de peaux de brebis et qui au dedans seront des loups ravissants : <strong><mark>vous les reconnaîtrez à leur œuvres</mark></strong>. Tout arbre qui ne porte pas de bons fruits est coupé et jeté au feu[51]. » Punissez donc ceux qui <strong>ne vivent pas conformément à ces préceptes et qui ne sont chrétiens que de nom</strong> : c’est nous qui vous le demandons.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Premi%C3%A8re_Apologie">Première Apologie</a>)</p><h3>Le monachisme</h3><blockquote><p>Or <strong><mark>beaucoup d’hommes et de femmes, instruits dès leur enfance dans la loi du Christ, sont restés purs jusqu’à soixante et soixante-dix ans</mark></strong> : je me flatte de vous en citer des exemples dans toutes les classes.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Premi%C3%A8re_Apologie">Première Apologie</a>)</p><h3>Les faux prophètes peuvent opérer des miracles</h3><blockquote><p>Vous ne trouvez rien de semblable chez ces faux prophètes, que remplit l’esprit impur, l’esprit de mensonge. <strong>Ils cherchent à éblouir par des prestiges, et ne célèbrent que l’esprit d’erreur qui les animait, je veux dire le démon</strong>.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Dialogue_avec_Tryphon">Dialogue avec Tryphon</a>)</p><h3>Il accuse les païens qui tenaient les objets pour des dieux</h3><blockquote><p>Si nous n’offrons pas de nombreux sacrifices ni de couronnes de fleurs aux idoles <strong>que les hommes ont façonnées et dressées dans les temples sous le nom de dieux</strong>, c’est que <strong>dans cette matière brute et sans vie, nous ne reconnaissons pas l’aspect de la divinité</strong>. <strong><mark>Nous ne croyons pas en effet que Dieu soit semblable à ces images</mark></strong> que l’on dit faites en son honneur. <strong><mark>Elles portent le nom et sont faites à la ressemblance de ces génies du mal qui apparurent autrefois</mark></strong>. Ne savez-vous pas, sans qu’il soit besoin de vous le dire, comment les artistes travaillent la matière, comment ils la polissent, la taillent, la fondent et la battent ? Souvent, grâce à leur art, des vases d’ignominie, en changeant seulement de forme et de figure, <strong>ont reçu le nom de dieux</strong>.</p><p>…</p><p>Ce sont des débauchés, à vous en croire, qui <strong>créent et façonnent les dieux que vous adorez</strong> ! Vous faites de tels hommes <strong>les gardiens des temples où ils résident</strong>, et vous ne comprenez pas que c’est une impiété que de penser ou de dire que <strong>des hommes soient les gardiens des dieux</strong> !</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Premi%C3%A8re_Apologie">Première Apologie</a>)</p><h3>Il accuse les païens : l’idole n’a aucune ressemblance avec Dieu</h3><blockquote><p>Si nous n’offrons pas de nombreux sacrifices ni de couronnes de fleurs aux idoles que les hommes ont façonnées et dressées dans les temples <strong>sous le nom de dieux, c’est que dans cette matière brute et sans vie, <mark>nous ne reconnaissons pas l’aspect de la divinité</mark></strong>. <strong><mark>Nous ne croyons pas en effet que Dieu soit semblable à ces images que l’on dit faites en son honneur</mark></strong>. <strong>Elles portent <mark>le nom</mark> et <mark>sont faites à la ressemblance</mark> de ces génies du mal</strong> qui apparurent autrefois. Ne savez-vous pas, sans qu’il soit besoin de vous le dire, comment les artistes travaillent la matière, comment ils la polissent, la taillent, la fondent et la battent ? Souvent, grâce à leur art, des vases d’ignominie, <strong>en changeant seulement de forme et de figure</strong>, ont reçu le nom de dieux. Aussi, est-ce à nos yeux une absurdité, que dis-je, un outrage à la divinité, dont la grandeur et la nature sont ineffables, de donner son nom à des œuvres corruptibles et qui ont besoin d’être entretenues par la main de l’homme.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Premi%C3%A8re_Apologie">Première Apologie</a>)</p><h3>Le jeûne</h3><blockquote><p>Ceux qui croient à la vérité de nos enseignements et de notre doctrine promettent d’abord de vivre selon cette doctrine. Alors nous leur apprenons <strong>à prier et à demander à Dieu, <mark>dans le jeûne</mark>, la rémission de leurs péchés, et nous-mêmes, nous prions et <mark>nous jeûnons</mark> avec eux</strong>.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Premi%C3%A8re_Apologie">Première Apologie</a>)</p><h3>Il est soumis aux lois de l’État</h3><blockquote><p><strong>Nous sommes les premiers à payer les tributs et les impôts à ceux que vous préposez à cet office. C’est encore là un précepte du Christ.</strong> En ce temps-là certains d’entre eux vinrent lui demander s’il fallait payer le tribut à César. Il répondit : « Dites-moi, à quelle effigie est frappée cette pièce de monnaie ? — À celle de César », dirent-ils. Et il reprit : « Rendez donc à César ce qui est à César et à Dieu ce qui est à Dieu. »[52]</p><p>Nous n’adorons donc que Dieu seul, mais pour le reste, nous vous obéissons volontiers, vous reconnaissant pour les maîtres et les chefs des peuples, et nous demandons à Dieu qu’avec la puissance souveraine, on voie en vous la sagesse et la raison.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Premi%C3%A8re_Apologie">Première Apologie</a>)</p><h2>Témoignages des écrivains anciens et des saints Pères sur Justin</h2><h3><a href="https://bibleox.com/fr/ru/w/%D1%82%D0%B5%D1%80%D1%82%D1%83%D0%BB%D0%BB%D0%B8%D0%B0%D0%BD">Tertullien (~155-220) (en russe)</a></h3><blockquote><p>On ne nous accusera pas non plus, comme on le fait, d’avoir inventé à plaisir ces matières que des <strong>personnages remarquables par leur sainteté et leurs lumières</strong>, non-seulement nos devanciers, mais contemporains des hérésiarques eux-mêmes, ont exposées et réfutées dans de lumineux traités : témoin <strong>Justin, philosophe et martyr</strong> ; témoin Miltiade, le champion des églises ; témoin Irénée, savant investigateur de toutes ces doctrines ; témoin notre Proculus, vierge jusque dans sa vieillesse et honneur de l’éloquence chrétienne. Fasse le ciel que je les égale dans toutes les œuvres de la foi de même que dans celle-ci !</p></blockquote><p>(<a href="https://azbyka.ru/otechnik/Tertullian/protiv-valentinian/#:~:text=%D0%AF%20%D0%BD%D0%B0%D0%BC%D0%B5%D1%80%D0%B5%D0%BD%20%D0%B2%D0%BE%D0%BE%D1%80%D1%83%D0%B6%D0%B8%D1%82%D1%8C%D1%81%D1%8F,%D0%BF%D1%80%D0%B5%D0%B4%D0%BB%D0%B5%D0%B6%D0%B0%D1%89%D0%B5%D0%BC%D1%83%20%D0%BC%D0%BD%D0%B5%20%D1%82%D1%80%D1%83%D0%B4%D1%83">Contre les Valentiniens, V (en russe)</a>)</p><h3>Méthode d’Olympe, hiéromartyr (~260-312)</h3><p>Il appelle Justin un homme qui ne fut pas loin des apôtres par la vertu :</p><blockquote><p>Justin de Néapolis, homme <strong>peu éloigné des apôtres</strong> et par le temps et <strong>par la vertu</strong>, dit que le mortel est hérité et que la vie hérite, que la chair meurt et que le royaume des cieux vit.</p></blockquote><p>(<a href="https://azbyka.ru/otechnik/Mefodij_Olimpijskij/O_Voskresenii_protiv_Origena/">Sur la résurrection, contre Origène (en russe)</a>)</p><h3>Épiphane de Chypre, saint (~315-403)</h3><p>Il nomme le martyr Justin le Philosophe saint et ami de Dieu :</p><blockquote><p>13. Les tatianites. Tatien fut le contemporain du <strong>saint martyr et philosophe Justin.</strong> Après la mort du martyr et philosophe Justin, devenu disciple de Marcion, il se corrompit par ses dogmes et enseigna comme lui, y ajoutant encore autre chose au-delà de Marcion. On disait qu’il était originaire de Mésopotamie.</p><p>…</p><p>Après ceux-là s’éleva un certain Tatien, soit qu’il ait vécu de leur temps, soit qu’il ait produit encore après eux sa doctrine de paroles creuses. D’abord, comme il descendait des Grecs et possédait la culture grecque, il fut le contemporain de <strong>Justin le Philosophe, homme saint et ami de Dieu</strong>, qui, d’entre les Samaritains, crut au Christ. Car ce Justin était samaritain d’origine ; il crut au Christ, <strong>accomplit de grands exploits, manifesta une vie vertueuse et, enfin, ayant reçu le martyre pour le Christ</strong> de la main des Romains, sous le gouverneur Rusticus et l’empereur Hadrien, <strong>il fut jugé digne de la couronne parfaite</strong> dans la fleur de l’âge, c’est-à-dire à trente ans. Ayant été son contemporain, Tatien, déjà nommé, eut d’abord une bonne orientation et une foi saine, tant qu’il fut avec le <strong>saint Justin martyr</strong>. Mais lorsque saint Justin fut mort, il arriva à Tatien ce qui arrive à un aveugle : si celui qui le conduisait auparavant l’abandonne, dès qu’il rencontre un précipice, sa cécité le fait se précipiter sans retenue, jusqu’à ce qu’il se précipite dans la mort … après la mort de saint Justin, dans les contrées de l’Orient ; et, pendant qu’il y séjournait, il tomba dans de mauvaises opinions et se mit, selon les fables de Valentin, à introduire je ne sais quels éons, je ne sais quels principes et des productions d’en haut.</p></blockquote><p>(<a href="https://azbyka.ru/otechnik/Epifanij_Kiprskij/na-vosemdesjaty-eresej-panarij-ili-kovcheg">Contre les hérésies (en russe)</a>)</p><h3>Jérôme de Stridon, vénérable (~347-419)</h3><p>Il place les écrits de Justin le Philosophe sur le même rang que ceux d’Ignace le Théophore, de Polycarpe de Smyrne et d’Irénée de Lyon, tout en laissant Tertullien de côté :</p><blockquote><p>Mais puisque notre discours a déjà échappé aux rochers sous-marins et aux lieux dangereux, il faut déployer les voiles et nous élancer vers ses épilogues, où, s’imaginant être un connaisseur, il prend à témoin <strong>Tertullien</strong> et cite les paroles de Victorin, évêque de Pettau. De Tertullien je ne dirai rien de plus, sinon qu’il <strong>ne fut pas un homme d’Église</strong>. De Victorin j’affirme la même chose que des évangélistes : qu’ils ont parlé des frères du Seigneur, et non des fils de Marie, et de frères au sens que nous avons exposé plus haut, frères par parenté et non par nature. Mais nous nous entretenons de bagatelles, et, ayant quitté la source de la vérité, nous courons après les ruisselets des opinions. Ne puis-je pas t’opposer <strong>toute une série d’anciens écrivains : Ignace, Polycarpe, Irénée, Justin le Martyr et beaucoup d’autres hommes apostoliques et savants</strong>, qui, contre Hébion et Théodote, Byzance, Valentin, raisonnant là-dessus de la même manière, <strong>ont écrit des ouvrages pleins de sagesse ? Si tu les avais lus un jour, tu serais plus sage</strong>. Mais je crois préférable de répondre brièvement à chaque point en particulier, plutôt que, m’arrêtant trop longtemps, de faire traîner mon ouvrage.</p></blockquote><p>(<a href="https://azbyka.ru/otechnik/Ieronim_Stridonskij/o-prisnodevstve-blazhennoj-marii/">Sur la virginité perpétuelle de la vierge Marie (en russe)</a>)</p><blockquote><p><strong>Justin</strong>, philosophe de Néapolis, ville de Palestine, fils de Priscus Bacchius, <strong>travailla avec zèle au service de la doctrine du Christ</strong>. … Finalement, Justin, accusé d’être chrétien, par les efforts de Crescent <strong>versa son sang pour le Christ</strong>.</p></blockquote><p>(<a href="https://azbyka.ru/otechnik/Ieronim_Stridonskij/o_znamenityh/2">Des hommes illustres (en russe)</a>)</p><h3>Théodoret de Cyr, bienheureux (386-457)</h3><p>Il place Justin au rang des saints, dit qu’il orne le chœur des martyrs et l’appelle un prédicateur retentissant de la vérité :</p><blockquote><p>Lequel <strong>des saints Pères</strong> n’a pas proclamé la même doctrine ?! …</p><p>Et son maître Alexandre combattit pour ces <strong>dogmes [sur Dieu]</strong>. Tels furent aussi Eustathe, Mélèce, Flavien, les flambeaux de l’Orient, Éphrem, la lyre du Saint-Esprit, qui chaque jour arrose de ses flots de grâce le peuple syrien, Jean (Chrysostome) et Attique (de Constantinople), <strong>prédicateurs retentissants de la vérité</strong> ; et, plus anciens que ceux-là, Ignace, Polycarpe, Irénée, <strong>Justin</strong> et Hippolyte, dont la plupart non seulement brillent au nombre des évêques, mais encore <strong>ornent le chœur des martyrs</strong>.</p></blockquote><p>(<a href="https://azbyka.ru/otechnik/Feodorit_Kirskij/pisma/1">Lettres (en russe)</a>)</p>
