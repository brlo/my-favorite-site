      <p>Les citations des Apologies sont empruntées à la traduction de Louis Pautigny, <i>Justin, Apologies</i>, Alphonse Picard et Fils, 1904, celles du <i>Dialogue avec Tryphon</i> à celle d’Antoine-Eugène Genoude, <i>Les Pères de l’Église</i>, t. II, Sapia, 1838, publiées sur ce site. Les passages entre crochets [ ] sont absents de ces traductions et rendus d’après le grec ; les citations des autres Pères et écrivains ecclésiastiques, non traduites sur le site, sont rendues d’après l’original ou la version russe.</p><p>Traduction : Rodion Vlasov, avec l’aide de l’IA, d’après la <a href="https://bibleox.com/fr/ru/w/%D0%98%D1%83%D1%81%D1%82%D0%B8%D0%BD_%D0%A4%D0%B8%D0%BB%D0%BE%D1%81%D0%BE%D1%84_%D0%BC%D1%83%D1%87%D0%B5%D0%BD%D0%B8%D0%BA">page de référence en russe</a>.</p>
