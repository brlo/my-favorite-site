      <h2>Vision I</h2>
      <h3>1</h3>
      <p>1 Celui qui m’a nourri m’a vendu à une certaine Rhodè, à Rome ; après bien des années, je la reconnus et je me mis à l’aimer comme une sœur. 2 Quelque temps après, je la vis qui se baignait dans le fleuve Tibre ; je lui tendis la main et je la tirai du fleuve. En voyant donc sa beauté, je raisonnais dans mon cœur, en disant : « J’aurais été heureux d’avoir une telle femme, et pour la beauté et pour les mœurs. » Je ne formai que ce seul dessein, et rien d’autre. 3 Quelque temps après, comme j’allais à Cumes et que je glorifiais les créatures de Dieu, combien elles sont grandes, magnifiques et puissantes, je m’endormis en marchant. Et un esprit me saisit et m’emporta par un sentier impraticable, où un homme ne pouvait marcher ; le lieu était escarpé et coupé à pic au-dessus des eaux. Ayant donc traversé ce fleuve, j’arrivai dans les lieux plats, je fléchis les genoux et je me mis à prier le Seigneur et à confesser mes péchés. 4 Pendant que je priais, le ciel s’ouvrit, et je vois cette femme que j’avais désirée, qui me saluait du haut du ciel, en disant : « Hermas, réjouis-toi. » 5 Levant les yeux vers elle, je lui dis : « Madame, que fais-tu ici ? » Elle me répondit : « J’ai été enlevée pour accuser tes péchés devant le Seigneur. » 6 Je lui dis : « Maintenant, c’est toi qui m’accuses ? » « Non, dit-elle, mais écoute les paroles que je vais te dire. Le Dieu qui habite dans les cieux, qui a créé de ce qui n’est pas ce qui est, qui a multiplié et fait croître toutes choses en faveur de sa sainte Église, est irrité contre toi, parce que tu as péché contre moi. » 7 Lui répondant, je dis : « J’ai péché contre toi ? En quel lieu, ou quand t’ai-je dit une parole honteuse ? Ne t’ai-je pas toujours regardée comme une déesse ? Ne t’ai-je pas toujours respectée comme une sœur ? Pourquoi me calomnies-tu, femme, par ces choses mauvaises et impures ? » 8 Elle me dit en riant : « Le désir de la malice est monté sur ton cœur. Ne te semble-t-il pas que c’est une mauvaise chose pour un homme juste, si le mauvais désir monte sur son cœur ? C’est un péché, et grand, dit-elle. Car l’homme juste médite des choses justes. En méditant donc des choses justes, sa gloire s’affermit dans les cieux, et il a le Seigneur propice en toute affaire ; mais ceux qui méditent le mal dans leurs cœurs attirent sur eux la mort et la captivité, surtout ceux qui s’attachent à ce siècle, se glorifient de leurs richesses et ne s’attachent pas aux biens à venir. 9 Leurs âmes feront pénitence, ceux qui n’ont point d’espérance, mais qui ont désespéré d’eux-mêmes et de leur vie. Mais toi, prie Dieu, et il guérira tes péchés, et ceux de ta maison et de tous les saints. »</p>
      <h3>2</h3>
      <p>1 Après qu’elle eut dit ces paroles, les cieux se fermèrent ; et moi, j’étais tout entier saisi de frisson et de tristesse. Je me disais en moi-même : « Si ce péché m’est inscrit, comment pourrai-je être sauvé ? Ou comment apaiserai-je Dieu pour mes péchés accomplis ? Ou par quelles paroles interrogerai-je le Seigneur, afin qu’il me soit propice ? » 2 Comme je délibérais ainsi et que je discernais dans mon cœur, je vois devant moi un grand siège blanc, fait de laines couleur de neige ; et vint une femme âgée, dans un vêtement très éclatant, tenant un livre à la main ; elle s’assit seule et me salue : « Hermas, réjouis-toi. » Et moi, triste et pleurant, je dis : « Madame, réjouis-toi. » 3 Et elle me dit : « Pourquoi es-tu sombre, Hermas ? Toi le patient, toi qui ne t’emportes jamais, toi qui toujours riais, pourquoi as-tu l’air si abattu et sans gaieté ? » Et je lui dis : « À cause d’une femme très bonne qui a dit que j’avais péché contre elle. » 4 Et elle dit : « Non, certes, cette chose n’est pas sur le serviteur de Dieu. Mais c’est tout à fait sur ton cœur qu’elle est montée, à son sujet. Il est vrai que chez les serviteurs de Dieu une telle pensée apporte le péché ; car une pensée mauvaise, et qui fait horreur à un esprit tout vénérable et déjà éprouvé, dès qu’elle désire une mauvaise action — et cela surtout chez Hermas, l’homme continent, qui s’abstient de tout désir mauvais et qui est plein de toute simplicité et d’une grande innocence. »</p>
      <h3>3</h3>
      <p>1 Mais ce n’est pas pour cela que Dieu est irrité contre toi, mais afin que tu ramènes ta maison, qui a péché contre le Seigneur et contre vous, leurs parents. Mais, aimant tes enfants, tu n’avertissais pas ta maison, mais tu la laissais se corrompre ; c’est pour cela que le Seigneur est irrité contre toi. Mais il guérira tous les maux qui sont arrivés auparavant dans ta maison ; car à cause de leurs péchés et de leurs iniquités, toi aussi tu as été ruiné dans les affaires de la vie. 2 Mais la grande miséricorde du Seigneur a eu pitié de toi et de ta maison ; il te fortifiera et te fondera dans sa gloire. Toi seulement, ne sois pas négligent, mais prends courage et fortifie ta maison. Car de même que le forgeron, à force de frapper son ouvrage, vient à bout de ce qu’il veut, ainsi la parole juste de chaque jour vient à bout de toute malice. Ne cesse donc pas d’avertir tes enfants. Car je sais que, s’ils font pénitence de tout leur cœur, ils seront inscrits dans les livres de la vie avec les saints. 3 Après qu’elle eut cessé de dire ces paroles, elle me dit : « Veux-tu m’entendre lire ? » Et moi je dis : « Je le veux, Madame. » Elle me dit : « Sois attentif et écoute les gloires de Dieu. » J’entendis des choses grandes et admirables, que je ne fus pas capable de retenir ; car toutes ces paroles étaient terribles, et l’homme ne peut les porter. Je retins donc les dernières paroles ; car elles nous étaient utiles et douces : 4 « Voici, le Dieu des puissances, que j’aime, qui par sa force puissante et sa grande intelligence a créé le monde, qui par son glorieux dessein a revêtu sa création de beauté, qui par sa parole puissante a fixé le ciel et fondé la terre sur les eaux, qui par sa propre sagesse et sa providence a créé sa sainte Église, qu’il a aussi bénie — voici, il transporte les cieux, et les montagnes, les collines et les mers, et tout devient uni pour ses élus, afin de leur tenir la promesse qu’il a faite avec grande gloire et joie, s’ils gardent les lois de Dieu, qu’ils ont reçues avec une grande foi. »</p>
      <h3>4</h3>
      <p>1 Lors donc qu’elle eut achevé de lire et qu’elle se fut levée de son siège, quatre jeunes hommes vinrent, prirent le siège et s’en allèrent vers l’orient. 2 Elle m’appelle, toucha ma poitrine et me dit : « Ma lecture t’a-t-elle plu ? » Et je lui dis : « Madame, ces dernières choses me plaisent, mais les premières sont pénibles et dures. » Et elle me dit : « Ces dernières paroles sont pour les justes ; les premières, pour les païens et les apostats. » 3 Comme elle me parlait, deux hommes parurent, la prirent par les bras et s’en allèrent là où était le siège, vers l’orient. Et elle s’en alla joyeuse, et en s’en allant elle me dit : « Courage, Hermas. »</p><h2>Vision II</h2><h3>5</h3><p>1 Comme je me rendais à Cumes, à la saison où j’y étais allé l’année précédente, chemin faisant, je me souvins de la vision de l’année passée ; et de nouveau un esprit me saisit et m’emporte au même lieu qu’auparavant. 2 Étant donc arrivé au lieu, je fléchis les genoux et je me mis à prier le Seigneur et à glorifier son nom, parce qu’il m’avait jugé digne et m’avait fait connaître mes péchés d’autrefois. 3 Après m’être relevé de la prière, je vois devant moi la femme âgée, celle que j’avais vue l’année précédente, qui marchait et lisait un petit livre ; et elle me dit : « Peux-tu annoncer ces choses aux élus de Dieu ? » Je lui dis : « Madame, je ne puis me souvenir d’autant de choses ; donne-moi plutôt le petit livre, afin que je le copie. » Elle dit : « Prends-le, et tu me le rendras. » 4 Je le pris, et, m’étant retiré en un lieu des champs, je copiai tout lettre pour lettre ; car je ne trouvais pas les syllabes. Comme j’achevais donc les lettres du petit livre, tout à coup le petit livre me fut arraché de la main ; et par qui, je ne le vis pas.</p><h3>6</h3><p>1 Quinze jours après, comme j’avais jeûné et beaucoup interrogé le Seigneur, me fut révélée la connaissance de l’Écriture. Or voici ce qui était écrit : 2 Tes enfants, Hermas, ont rejeté Dieu et blasphémé contre le Seigneur, et ils ont livré leurs parents dans une grande malice ; ils ont été appelés traîtres à leurs parents, et, ayant trahi, ils n’y ont rien gagné ; mais ils ont encore ajouté à leurs péchés les débauches et les mélanges de malice, et ainsi leurs iniquités furent comblées. 3 Mais fais connaître ces paroles à tous tes enfants et à ta femme, qui doit être ta sœur ; car elle aussi ne s’abstient pas de la langue avec laquelle elle fait le mal ; mais, ayant entendu ces paroles, elle s’en abstiendra et obtiendra miséricorde. 4 Après que tu leur auras fait connaître ces paroles, que le Maître m’a commandé de te révéler, alors leur sont remis tous les péchés qu’ils ont commis auparavant, et à tous les saints qui ont péché jusqu’à ce jour, s’ils font pénitence de tout leur cœur et s’ils ôtent de leur cœur les doutes. 5 Car le Maître a juré par sa gloire au sujet de ses élus : si, ce jour étant fixé, il se commet encore un péché, ils n’auront pas de salut ; car la pénitence a un terme pour les justes ; les jours de la pénitence sont accomplis pour tous les saints ; et pour les païens, il y a pénitence jusqu’au dernier jour. 6 Tu diras donc à ceux qui conduisent l’Église de redresser leurs voies dans la justice, afin qu’ils reçoivent pleinement les promesses avec une grande gloire. 7 Demeurez donc, vous qui pratiquez la justice, et ne doutez pas, afin que votre passage se fasse avec les saints anges. Heureux êtes-vous, vous tous qui endurez la grande tribulation qui vient, et vous tous qui ne renierez pas votre vie. 8 Car le Seigneur a juré par la vie de son Fils : ceux qui ont renié leur Christ seront rejetés de leur vie, ceux qui vont maintenant le renier dans les jours qui viennent ; mais à ceux qui ont renié auparavant, dans sa grande compassion, il leur fut propice.</p><h3>7</h3><p>1 Toi donc, Hermas, ne garde plus rancune à tes enfants, et ne délaisse pas ta sœur, afin qu’ils soient purifiés de leurs péchés d’autrefois. Car ils seront instruits par une juste discipline, si toi tu ne leur gardes pas rancune. La rancune produit la mort. Toi, Hermas, tu as eu de grandes tribulations personnelles à cause des transgressions de ta maison, parce que tu ne t’es pas soucié d’eux ; mais tu as été négligent et tu t’es mêlé à tes mauvaises affaires. 2 Mais ce qui te sauve, c’est de ne t’être pas détourné du Dieu vivant, et ta simplicité et ta grande continence ; ces choses t’ont sauvé, si tu y demeures, et elles sauvent tous ceux qui font de telles choses et qui marchent dans l’innocence et la simplicité. Ceux-là prévaudront sur toute malice et demeureront dans la vie éternelle. 3 Heureux tous ceux qui pratiquent la justice. Ils ne périront pas à jamais. 4 Tu diras à Maxime : « Voici que la tribulation est venue ; si tu le veux, renie encore. » Le Seigneur est proche de ceux qui se convertissent, comme il est écrit dans Eldad et Modad, qui prophétisèrent au peuple dans le désert.</p><h3>8</h3><p>1 Or il me fut révélé, frères, pendant que je dormais, par un jeune homme très beau qui me disait : « Cette femme âgée, de qui tu as reçu le petit livre, qui penses-tu qu’elle soit ? » Je dis : « La Sibylle. » « Tu te trompes, dit-il ; ce n’est pas elle. » « Qui est-elle donc ? » dis-je. « L’Église », dit-il. Je lui dis : « Pourquoi donc est-elle âgée ? » « Parce qu’elle a été créée la première de toutes ; c’est pour cela qu’elle est âgée, et c’est à cause d’elle que le monde a été établi. » 2 Ensuite je vis une vision dans ma maison. La femme âgée vint et me demanda si j’avais déjà donné le livre aux presbytres. Je niai l’avoir donné. « Tu as bien fait, dit-elle ; car j’ai des paroles à ajouter. Quand donc j’aurai achevé toutes les paroles, elles seront, par toi, connues de tous les élus. » 3 Tu écriras donc deux petits livres et tu en enverras un à Clément et un à Grapté. Clément donc l’enverra aux villes du dehors, car cela lui a été confié ; Grapté, elle, avertira les veuves et les orphelins. Et toi, tu liras dans cette ville avec les presbytres qui président l’Église.</p><h2>Vision III</h2>
      <h3>9</h3>
      <p>1 Telle est, frères, la vision que j’ai vue. 2 Après avoir jeûné souvent et prié le Seigneur de me manifester la révélation qu’il m’avait promis de me montrer par cette femme âgée, cette nuit même la vieille femme m’apparut et me dit : « Puisque tu es si insatiable et si empressé à tout savoir, va dans le champ où tu cultives l’épeautre, et vers la cinquième heure je me manifesterai à toi et je te montrerai ce qu’il te faut voir. » 3 Je lui demandai : « Madame, en quel lieu du champ ? » « Où tu voudras », dit-elle. Je choisis un lieu beau et retiré. Mais avant que je lui parle et dise le lieu, elle me dit : « J’irai là où tu voudras. » 4 Je me rendis donc, frères, dans le champ, je comptai les heures et j’arrivai au lieu où j’avais décidé qu’elle vînt ; et je vois un banc d’ivoire posé là, et sur le banc était placé un oreiller de lin, et par-dessus une nappe de lin fin, étendue. 5 Voyant ces choses posées et personne dans le lieu, je fus frappé de stupeur ; un tremblement me saisit, mes cheveux se dressèrent, et une sorte de frisson m’envahit, alors que j’étais seul. Revenu donc à moi et me souvenant de la gloire de Dieu, ayant pris courage, je fléchis les genoux et je confessais de nouveau au Seigneur mes péchés, comme auparavant. 6 Elle vint avec six jeunes hommes, que j’avais déjà vus auparavant, et elle se tint auprès de moi et écoutait ma prière et la confession de mes péchés au Seigneur. Et me touchant, elle dit : « Hermas, cesse de tout demander au sujet de tes péchés ; demande aussi au sujet de la justice, afin que tu en reçoives une part pour ta maison. » 7 Et elle me relève par la main, me conduit au banc et dit aux jeunes hommes : « Allez et bâtissez. » 8 Après que les jeunes hommes se furent retirés et que nous fûmes seuls, elle me dit : « Assieds-toi ici. » Je lui dis : « Madame, laisse les presbytres s’asseoir d’abord. » « Ce que je te dis, dit-elle, assieds-toi. » 9 Comme je voulais donc m’asseoir aux places de droite, elle ne me le permit pas, mais elle me fit signe de la main de m’asseoir aux places de gauche. Comme je réfléchissais donc et m’attristais de ce qu’elle ne me l’avait pas permis, elle me dit : « Tu t’attristes, Hermas ? La place de droite est à d’autres, à ceux qui ont déjà plu à Dieu et qui ont souffert pour le nom ; mais à toi il manque beaucoup de choses pour t’asseoir avec eux. Cependant, comme tu demeures dans ta simplicité, demeure, et tu t’assiéras avec eux, ainsi que tous ceux qui feront les œuvres de ceux-là et supporteront ce qu’eux-mêmes ont supporté. »</p>
      <h3>10</h3>
      <p>1 « Qu’ont-ils donc supporté ? » dis-je. « Écoute, dit-elle : les fouets, les prisons, les grandes tribulations, les croix, les bêtes, pour le nom. C’est pourquoi les places de droite du sanctuaire sont à eux, et à quiconque souffre pour le nom ; et les places de gauche sont aux autres. Mais pour les uns et les autres, pour ceux qui sont assis à droite et pour ceux qui sont assis à gauche, les dons sont les mêmes et les promesses les mêmes ; seulement ceux-là sont assis à droite et ont une certaine gloire. 2 Toi, tu désires t’asseoir à droite avec eux, mais tes manques sont nombreux. Tu seras purifié de tes manques ; et tous ceux qui ne sont pas doubles de cœur seront purifiés de tous leurs péchés jusqu’à ce jour. » 3 Ayant dit cela, elle voulut s’en aller ; mais, tombant à ses pieds, je la priai, au nom du Seigneur, de me montrer la vision qu’elle avait promise. 4 Elle me prit de nouveau la main, me relève, me fait asseoir sur le banc, à gauche ; et elle-même s’assit à droite. Et ayant levé une baguette éclatante, elle me dit : « Vois-tu une grande chose ? » Je lui dis : « Madame, je ne vois rien. » Elle me dit : « Toi, ne vois-tu pas devant toi une grande tour qui se bâtit sur les eaux, avec des pierres carrées et éclatantes ? » 5 La tour se bâtissait sur un plan carré, par les six jeunes hommes qui étaient venus avec elle ; et d’autres myriades d’hommes apportaient des pierres, les uns du fond de l’eau, les autres de la terre, et les remettaient aux six jeunes hommes ; et ceux-ci les prenaient et bâtissaient. 6 Toutes les pierres tirées du fond, ils les posaient ainsi dans la construction ; car elles étaient ajustées et s’accordaient par leur jointure avec les autres ; et elles se liaient tellement l’une à l’autre que leur jointure ne paraissait pas. Et la construction de la tour paraissait bâtie d’une seule pierre. 7 Quant aux autres pierres, celles qui étaient apportées de la terre ferme, ils en rejetaient quelques-unes, ils en posaient d’autres dans la construction ; d’autres, ils les brisaient et les jetaient loin de la tour. 8 Et beaucoup d’autres pierres gisaient autour de la tour, et on ne s’en servait pas pour la construction ; car quelques-unes d’entre elles étaient galeuses, d’autres avaient des fentes, d’autres étaient tronquées, d’autres étaient blanches et rondes, ne convenant pas à la construction. 9 Je voyais d’autres pierres jetées loin de la tour, qui venaient sur le chemin et ne demeuraient pas sur le chemin, mais roulaient du chemin dans les lieux sans route ; et d’autres qui tombaient près des eaux sans pouvoir rouler dans l’eau, bien qu’elles voulussent rouler et venir dans l’eau.</p>
      <h3>11</h3>
      <p>1 Après m’avoir montré ces choses, elle voulait s’enfuir. Je lui dis : « Madame, quel profit ai-je à avoir vu ces choses sans savoir ce qu’elles sont ? » Me répondant, elle dit : « Tu es un homme curieux, qui veux savoir ce qui concerne la tour. » « Oui, dis-je, Madame, afin que je l’annonce aux frères, qu’ils en deviennent plus joyeux et qu’en entendant ces choses ils connaissent le Seigneur dans une grande gloire. » 2 Elle dit : « Beaucoup entendront ; et quelques-uns d’entre eux, en entendant, se réjouiront, et quelques-uns pleureront ; mais ceux-là aussi, s’ils entendent et font pénitence, se réjouiront eux aussi. Écoute donc les similitudes de la tour ; car je te révélerai tout. Et ne me donne plus de peine au sujet d’une révélation ; car ces révélations ont une fin, elles sont accomplies. Mais tu ne cesseras pas de demander des révélations, car tu es importun. 3 La tour que tu vois se bâtir, c’est moi, l’Église, qui t’ai apparu maintenant et auparavant. Tout ce que tu voudras, interroge au sujet de la tour, et je te le révélerai, afin que tu te réjouisses avec les saints. » 4 Je lui dis : « Madame, puisque tu m’as jugé une fois digne que tout me soit révélé, révèle. » Elle me dit : « Ce qui pourra t’être révélé te sera révélé. Que seulement ton cœur soit vers Dieu, et ne sois pas double. » Je demandai : « Pourquoi la tour est-elle bâtie sur les eaux, Madame ? » « Je te l’ai déjà dit, dit-elle, et tu le cherches avec soin ; en cherchant, tu trouves la vérité. Pourquoi donc la tour est-elle bâtie sur les eaux, écoute : parce que votre vie a été sauvée par l’eau et le sera. La tour est fondée sur la parole du Tout-Puissant et de son nom glorieux, et elle est tenue par la puissance invisible du Maître. »</p>
      <h3>12</h3>
      <p>1 Répondant, je lui dis : « Madame, cette chose est grande et admirable. Mais les six jeunes hommes qui bâtissent, qui sont-ils, Madame ? » « Ce sont les saints anges de Dieu, les premiers créés, à qui le Seigneur a remis toute sa création, pour la faire croître, la bâtir et dominer sur toute la création ; c’est donc par eux que s’achèvera la construction de la tour. » 2 « Et les autres, ceux qui apportent les pierres, qui sont-ils ? » « Ce sont aussi des saints anges de Dieu ; mais ces six-là les surpassent. La construction de la tour s’achèvera donc, et tous ensemble se réjouiront autour de la tour et glorifieront Dieu, parce que la construction de la tour est achevée. » 3 Je l’interrogeai, disant : « Madame, je voulais savoir quelle est la fin des pierres et leur puissance. » Me répondant, elle dit : « Ce n’est pas que tu sois plus digne que tous, pour que cela te soit révélé. D’autres sont avant toi et meilleurs que toi, à qui ces visions devaient être révélées ; mais afin que le nom de Dieu soit glorifié, cela t’a été révélé et te sera révélé, à cause des hommes au cœur double, qui raisonnent dans leurs cœurs : ces choses sont-elles, ou ne sont-elles pas ? Dis-leur que toutes ces choses sont vraies, que rien n’est hors de la vérité, mais que tout est fort, ferme et fondé. »</p>
      <h3>13</h3>
      <p>1 « Écoute maintenant au sujet des pierres qui entrent dans la construction. Les pierres donc carrées, blanches et s’accordant par leurs jointures, ce sont les apôtres, les évêques, les docteurs et les diacres qui ont marché selon la dignité de Dieu, qui ont exercé l’épiscopat, enseigné et servi avec pureté et dignité les élus de Dieu, les uns endormis, les autres encore vivants ; et toujours ils furent d’accord entre eux, ils eurent la paix entre eux et s’écoutèrent les uns les autres ; c’est pourquoi, dans la construction de la tour, leurs jointures s’accordent. 2 Et ceux qui sont tirés du fond, posés dans la construction et s’accordant par leurs jointures avec les autres pierres déjà bâties, qui sont-ils ? Ce sont ceux qui ont souffert pour le nom du Seigneur. » 3 « Et les autres pierres, celles qui sont apportées de la terre ferme, je veux savoir qui elles sont, Madame. » Elle dit : « Celles qui entrent dans la construction sans avoir été taillées, le Seigneur les a éprouvées, parce qu’elles ont marché dans la droiture du Seigneur et ont accompli ses préceptes. 4 Et celles qui sont amenées et posées dans la construction, qui sont-elles ? Ils sont nouveaux dans la foi et fidèles. Ils sont avertis par les anges de faire le bien, parce qu’on n’a trouvé en eux aucune malice. 5 Et celles qu’ils rejetaient et jetaient, qui sont-elles ? Ce sont ceux qui ont péché et qui veulent faire pénitence ; c’est pourquoi ils n’ont pas été jetés loin, hors de la tour, parce qu’ils seront utiles à la construction, s’ils font pénitence. Ceux donc qui vont faire pénitence, s’ils font pénitence, seront forts dans la foi, s’ils font pénitence maintenant, tandis que la tour se bâtit. Mais si la construction est achevée, ils n’ont plus de place, mais ils seront rejetés ; ils n’ont que ceci, de gésir auprès de la tour. »</p>
      <h3>14</h3>
      <p>1 « Ceux qui sont brisés et jetés loin de la tour, veux-tu le savoir ? Ce sont les fils de l’iniquité : ils ont cru avec hypocrisie, et toute malice ne s’est pas retirée d’eux ; c’est pourquoi ils n’ont pas le salut, parce qu’ils ne sont pas utiles à la construction, à cause de leurs malices. C’est pourquoi ils ont été brisés et rejetés au loin, à cause de la colère du Seigneur, parce qu’ils l’ont irrité. 2 Et les autres, que tu as vus nombreux, gisant sans entrer dans la construction : ceux-là sont les galeux, ceux qui ont connu la vérité mais qui n’y sont pas demeurés. 3 Et ceux qui ont des fentes, qui sont-ils ? Ce sont ceux qui sont les uns contre les autres dans leur cœur et qui ne sont pas en paix entre eux, mais n’ont de la paix que l’apparence ; quand ils se sont séparés les uns des autres, leurs malices demeurent dans leurs cœurs ; ce sont là les fentes que portent les pierres. 4 Et les tronquées, ce sont ceux qui ont cru et qui ont la plus grande part dans la justice, mais qui ont quelques parts d’iniquité ; c’est pourquoi ils sont tronqués et non parfaits. » 5 « Et les blanches et rondes, qui ne conviennent pas à la construction, qui sont-elles, Madame ? » Me répondant, elle dit : « Jusques à quand seras-tu fou et insensé, et interrogeras-tu tout sans rien comprendre ? Ce sont ceux qui ont la foi, mais qui ont aussi la richesse de ce siècle ; quand vient la tribulation, à cause de leur richesse et de leurs affaires, ils renient leur Seigneur. » 6 Et répondant, je lui dis : « Madame, quand donc seront-ils utiles à la construction ? » « Quand, dit-elle, leur sera retranchée la richesse qui les charme, alors ils seront utiles à Dieu. Car de même que la pierre ronde, si elle n’est retranchée et n’enlève quelque chose d’elle-même, ne peut devenir carrée, ainsi ceux qui sont riches en ce siècle, si leur richesse n’est retranchée, ne peuvent devenir utiles au Seigneur. 7 Reconnais d’abord par toi-même : quand tu étais riche, tu étais inutile ; maintenant tu es utile et profitable à la vie. Devenez utiles à Dieu ; car toi aussi, tu prendras de ces mêmes pierres. »</p>
      <h3>15</h3>
      <p>1 « Et les autres pierres, que tu as vues jetées loin de la tour, tombant sur le chemin et roulant du chemin dans les lieux sans route : ce sont ceux qui ont cru, mais qui, par duplicité, abandonnent leur vrai chemin ; s’imaginant pouvoir trouver un meilleur chemin, ils errent et sont misérables, marchant dans les lieux sans route. 2 Et ceux qui tombent dans le feu et brûlent, ce sont ceux qui se sont détournés pour toujours du Dieu vivant, et il ne leur est plus venu à l’esprit de faire pénitence, à cause des désirs de leur débauche et des malices qu’ils ont commises. 3 Et les autres, ceux qui tombent près des eaux sans pouvoir rouler dans l’eau, veux-tu savoir qui ils sont ? Ce sont ceux qui ont entendu la parole et qui veulent être baptisés au nom du Seigneur ; puis, quand leur revient en mémoire la pureté de la vérité, ils font pénitence et se prostituent de nouveau après leurs mauvais désirs. » 4 Elle acheva donc l’explication de la tour. 5 Prenant encore de l’assurance, je l’interrogeai : « Toutes ces pierres rejetées, qui ne conviennent pas à la construction de la tour, ont-elles la pénitence et une place dans cette tour ? » « Elles ont, dit-elle, la pénitence, mais elles ne peuvent convenir à cette tour ; 6 elles conviendront à un autre lieu, beaucoup plus petit, et cela quand elles auront été tourmentées et qu’elles auront accompli les jours de leurs péchés. Et c’est pourquoi elles seront transférées, parce qu’elles ont eu part à la parole du juste. Et alors il leur arrivera d’être transférées de leurs tourments, si les œuvres mauvaises qu’elles ont faites leur montent au cœur. Mais si cela ne leur monte pas au cœur, elles ne sont pas sauvées, à cause de leur dureté de cœur. »</p>
      <h3>16</h3>
      <p>1 Lors donc que je cessai de l’interroger sur toutes ces choses, elle me dit : « Veux-tu voir autre chose ? » Désireux de contempler, je fus tout joyeux à la pensée de voir. 2 Me regardant, elle sourit et me dit : « Vois-tu sept femmes autour de la tour ? » « Je les vois, dis-je, Madame. » « Cette tour est portée par elles, selon l’ordre du Seigneur. 3 Écoute maintenant leurs actions. La première d’entre elles, celle qui tient les mains, s’appelle Foi ; par elle sont sauvés les élus de Dieu. 4 Et la seconde, celle qui est ceinte et agit virilement, s’appelle Continence ; elle est fille de la Foi. Quiconque donc la suivra devient bienheureux dans sa vie, car celui qui s’abstiendra de tout mauvais désir héritera la vie éternelle. » 5 « Et les autres, Madame, qui sont-elles ? » « Elles sont filles les unes des autres ; l’une s’appelle Simplicité, l’autre Science, l’autre Innocence, l’autre Dignité, l’autre Charité. Lors donc que tu auras fait les œuvres de leur mère, tu pourras vivre. » 6 « Je voulais, dis-je, Madame, savoir quelle force a chacune d’elles. » « Écoute, dit-elle, la force qu’elles ont. 7 Elles se tiennent l’une par l’autre, selon qu’elles sont nées. De la Foi naît la Continence, de la Continence la Simplicité, de la Simplicité l’Innocence, de l’Innocence la Dignité, de la Dignité la Science, de la Science la Charité. Leurs œuvres donc sont pures, dignes et divines. 8 Quiconque donc les servira et pourra tenir leurs œuvres aura sa demeure dans la tour, avec les saints de Dieu. » 9 Je l’interrogeais sur les temps : est-ce déjà la consommation ? Elle cria d’une grande voix, disant : « Homme insensé, ne vois-tu pas que la tour se bâtit encore ? Quand donc la tour sera achevée d’être bâtie, ce sera la fin. Mais elle sera vite achevée. Ne m’interroge plus sur rien ; il te suffit de ce rappel et du renouvellement de vos esprits. 10 Mais ce n’est pas à toi seul que ces choses ont été révélées, mais afin que tu les manifestes à tous, 11 après trois jours ; car il te faut d’abord comprendre. Et je te commande d’abord, Hermas, ces paroles que je vais te dire, de les dire toutes aux oreilles des saints, afin qu’ayant entendu et accompli, ils soient purifiés de leurs malices, et toi avec eux. »</p>
      <h3>17</h3>
      <p>1 « Écoutez-moi, mes enfants : je vous ai nourris dans une grande simplicité, innocence et dignité, à cause de la miséricorde du Seigneur, qui a fait tomber la justice sur vous, afin que vous soyez justifiés et sanctifiés de toute malice et de toute perversité ; mais vous, vous ne voulez pas cesser votre malice. 2 Maintenant donc, écoutez-moi : soyez en paix entre vous, visitez-vous les uns les autres, soutenez-vous les uns les autres, et ne jouissez pas seuls des créatures de Dieu avec profusion, mais partagez avec ceux qui sont dans le besoin ; 3 car les uns, par leurs nombreux mets, attirent la maladie sur leur chair et corrompent leur chair ; et ceux qui n’ont pas de mets, leur chair est corrompue, faute d’avoir la nourriture suffisante, et leur corps se corrompt. 4 Cette intempérance donc vous est nuisible, à vous qui avez et qui ne partagez pas avec ceux qui sont dans le besoin. 5 Voyez le jugement qui vient. Vous donc qui avez de l’abondance, cherchez ceux qui ont faim, tandis que la tour n’est pas encore achevée ; car après que la tour sera achevée, vous voudrez faire le bien, et vous n’aurez plus de place. 6 Voyez donc, vous qui vous glorifiez de votre richesse, de peur que ceux qui sont dans le besoin ne gémissent, et que leur gémissement ne monte vers le Seigneur, et que vous ne soyez enfermés avec vos biens hors de la porte de la tour. 7 Maintenant donc, je vous le dis, à vous qui êtes à la tête de l’Église et qui occupez les premières places : ne soyez pas semblables aux sorciers. Les sorciers portent leurs drogues dans des coffrets, mais vous, votre drogue et votre venin, c’est dans votre cœur. 8 Vous êtes endurcis et vous ne voulez pas purifier vos cœurs ni fondre votre pensée en une seule, dans un cœur pur, afin que vous obteniez miséricorde du grand Roi. 9 Voyez donc, mes enfants, de peur que ces dissensions ne vous privent de la vie. 10 Comment voulez-vous instruire les élus du Seigneur, vous qui n’avez pas vous-mêmes de discipline ? Corrigez-vous donc les uns les autres et soyez en paix entre vous, afin que moi aussi, me tenant joyeuse devant le Père, je rende compte pour vous tous au Seigneur. »</p>
      <h3>18</h3>
      <p>1 Lors donc qu’elle eut cessé de parler avec moi, vinrent les six jeunes hommes qui bâtissaient, et ils l’emportèrent vers la tour ; et quatre autres enlevèrent le banc et l’emportèrent aussi vers la tour. Je ne vis pas leur visage, car ils étaient détournés. 2 Et comme elle s’en allait, je l’interrogeais, afin qu’elle me révélât les trois figures sous lesquelles elle m’était apparue. Me répondant, elle dit : « Sur cela, il te faut interroger un autre, pour que cela te soit révélé. » 3 Elle m’apparut, frères, dans la première vision, celle de l’an dernier, très vieille et assise sur un siège. 4 Dans la seconde vision, elle avait le visage plus jeune, mais la chair et les cheveux plus vieux, et elle se tenait debout en me parlant ; elle était plus joyeuse qu’auparavant. 5 Dans la troisième vision, elle était toute jeune et très remarquable par sa beauté, mais elle avait seulement les cheveux plus vieux ; elle était parfaitement joyeuse et assise sur le banc. 6 À cause de cela, j’étais fort attristé de ce que je ne connaissais pas cette révélation, et je vois la vieille femme, dans une vision de la nuit, qui me dit : « Toute question a besoin d’humilité. Jeûne donc, et tu recevras du Seigneur ce que tu demandes. » 7 Je jeûnai donc un jour, et cette nuit même un jeune homme m’apparut et me dit : « Pourquoi demandes-tu aussitôt des révélations dans ta prière ? Prends garde : en demandant beaucoup, tu pourrais nuire à ta chair. 8 Ces révélations te suffisent. Peux-tu voir des révélations plus fortes que celles que tu as vues ? » 9 Répondant, je lui dis : « Seigneur, je ne demande que ceci : que sur les trois figures de la vieille femme il y ait une révélation parfaite. » Me répondant, il dit : « Jusques à quand serez-vous insensés ? Mais vos duplicités et le fait que votre cœur n’est pas tourné vers le Seigneur vous rendent insensés. » 10 Répondant de nouveau, je lui dis : « Mais c’est par toi, Seigneur, que nous les connaîtrons plus exactement. »</p>
      <h3>19</h3>
      <p>1 « Écoute, dit-il, au sujet des figures que tu recherches. 2 Dans la première vision, pourquoi t’apparut-elle vieille et assise sur un siège ? Parce que votre esprit est vieux, déjà flétri et sans force, à cause de vos faiblesses et de vos duplicités ; 3 car de même que les vieillards, n’ayant plus l’espoir de se renouveler, n’attendent rien d’autre que leur sommeil, ainsi vous, amollis par les affaires de la vie, vous vous êtes livrés à la négligence et vous n’avez pas rejeté vos soucis sur le Seigneur ; mais votre pensée s’est brisée et vous avez vieilli dans vos tristesses. » 4 « Je voulais savoir, Seigneur, pourquoi elle était assise sur un siège. » « Parce que tout infirme s’assied sur un siège à cause de son infirmité, afin que l’infirmité de son corps soit soutenue. Tu as la figure de la première vision. »</p>
      <h3>20</h3>
      <p>1 « Dans la seconde vision, tu l’as vue debout, le visage plus jeune et plus joyeux qu’auparavant, mais la chair et les cheveux plus vieux. Écoute aussi, dit-il, cette similitude : 2 quand un vieillard, ayant déjà désespéré de lui-même à cause de son infirmité et de sa pauvreté, n’attend rien d’autre que le dernier jour de sa vie, puis, quand soudain un héritage lui est laissé, l’ayant appris il se lève, et, tout joyeux, il se revêt de force ; il ne repose plus, mais il se tient debout, et son esprit, déjà corrompu par ses actions passées, est renouvelé, et il ne s’assied plus, mais il agit virilement : ainsi vous aussi, ayant entendu la révélation que le Seigneur vous a révélée, 3 parce qu’il a eu compassion de vous, qu’il a renouvelé vos esprits et que vous avez déposé vos faiblesses, et que la force est venue à vous et que vous avez été fortifiés dans la foi, et que le Seigneur, voyant votre affermissement, s’est réjoui ; et c’est pourquoi il vous a manifesté la construction de la tour, et il en manifestera d’autres, si de tout votre cœur vous êtes en paix entre vous. »</p>
      <h3>21</h3>
      <p>1 « Dans la troisième vision, tu l’as vue plus jeune, belle, joyeuse et d’une belle figure ; 2 car de même que, si à un affligé arrive une bonne nouvelle, aussitôt il oublie ses tristesses passées et n’attend rien d’autre que la nouvelle qu’il a entendue, et il se fortifie désormais dans le bien, et son esprit est renouvelé par la joie qu’il a reçue ; ainsi vous aussi, vous avez reçu un renouvellement de vos esprits en voyant ces biens. 3 Et quant à ce que tu l’as vue assise sur un banc : la position est solide, parce que le banc a quatre pieds et qu’il se tient solidement ; car le monde aussi est tenu par quatre éléments. 4 Ceux donc qui ont fait parfaitement pénitence seront nouveaux et fondés, ceux qui ont fait pénitence de tout leur cœur. Tu as reçu la révélation parfaite ; ne demande plus rien au sujet d’une révélation ; mais s’il est nécessaire, cela te sera révélé. »</p><h2>Vision IV</h2>
      <h3>22</h3>
      <p>1 Ce que j’ai vu, frères, vingt jours après la vision précédente, en figure de la tribulation qui vient. 2 J’allais aux champs par le chemin de la plaine. Depuis la voie publique, il y a environ dix stades ; le lieu se parcourt facilement. 3 Marchant donc seul, je supplie le Seigneur d’achever les révélations et les visions qu’il m’a montrées par sa sainte Église, de me fortifier et de donner la pénitence à ses serviteurs qui ont été scandalisés, afin que soit glorifié son nom grand et glorieux, puisqu’il m’a jugé digne de me montrer ses merveilles. 4 Et comme je le glorifiais et lui rendais grâces, comme un bruit de voix me répondit : « N’aie pas le double esprit, Hermas. » Je me mis à raisonner en moi-même et à dire : « Moi, qu’ai-je à avoir le double esprit, moi qui ai été ainsi fondé par le Seigneur et qui ai vu des choses glorieuses ? » 5 Et j’avançai un peu, frères, et voici que je vois une poussière comme montant jusqu’au ciel, et je me mis à dire en moi-même : « Est-ce que des bêtes viennent et soulèvent de la poussière ? » Or elle était à environ un stade de moi. 6 La poussière devenant de plus en plus grande, je soupçonnai qu’il y avait là quelque chose de divin ; le soleil brilla un peu, et voici que je vois une bête immense, comme une sorte de cétacé, et de sa bouche sortaient des sauterelles de feu. Or la bête avait environ cent pieds de long, et sa tête était comme d’argile. 7 Et je me mis à pleurer et à demander au Seigneur qu’il me délivrât d’elle ; et je me rappelai la parole que j’avais entendue : « N’aie pas le double esprit, Hermas. » 8 Ayant donc revêtu, frères, la foi du Seigneur, et m’étant souvenu des grandeurs qu’il m’avait enseignées, je pris courage et je m’exposai à la bête. Or la bête venait avec un tel grondement qu’elle pouvait ravager une ville. 9 J’arrive près d’elle, et ce cétacé si grand s’étend à terre, et il ne faisait rien que tirer la langue, et il ne bougea nullement jusqu’à ce que je l’eusse dépassé. 10 Or la bête avait sur la tête quatre couleurs : noire, puis couleur de feu et de sang, puis d’or, puis blanche.</p>
      <h3>23</h3>
      <p>1 Après que la bête fut passée et que j’eus avancé d’environ trente pieds, voici qu’une vierge vient à ma rencontre, parée comme sortant de la chambre nuptiale, tout en blanc et avec des sandales blanches, voilée jusqu’au front, et son voile était retenu dans une mitre ; elle avait les cheveux blancs. 2 Je connus, d’après les visions précédentes, que c’était l’Église, et je devins plus joyeux. Elle me salue en disant : « Salut à toi, homme. » Et moi, je la saluai à mon tour : « Madame, salut. » 3 Elle me répondit et dit : « Ne t’est-il rien arrivé ? » Je lui dis : « Madame, une bête si grande, capable de faire périr des peuples ! Mais par la force du Seigneur et par sa grande miséricorde, je lui ai échappé. » 4 « Tu as bien échappé, dit-elle, parce que tu as rejeté ton souci sur Dieu et que tu as ouvert ton cœur au Seigneur, croyant que tu ne peux être sauvé par nul autre que par le grand et glorieux nom. C’est pourquoi le Seigneur a envoyé son ange, celui qui est préposé aux bêtes, dont le nom est Thegri, et il a fermé sa bouche, afin qu’elle ne te fît point de mal. Tu as échappé à une grande tribulation à cause de ta foi, et parce qu’ayant vu une si grande bête tu n’as pas eu le double esprit. 5 Va donc et raconte aux élus du Seigneur ses grandeurs, et dis-leur que cette bête est la figure de la grande tribulation qui vient ; si donc vous vous préparez et si vous faites pénitence de tout votre cœur et tournez-vous vers le Seigneur, vous pourrez lui échapper, si votre cœur devient pur et sans tache et si, tous les autres jours de votre vie, vous servez le Seigneur sans reproche. Rejetez vos soucis sur le Seigneur, et lui-même les mènera à bien. 6 Croyez au Seigneur, vous qui avez le double esprit : il peut tout, et il détourne de vous sa colère et il envoie des fouets à vous qui avez le double esprit. Malheur à ceux qui ont entendu ces paroles et qui les ont méprisées : il leur eût été préférable de ne pas naître. »</p>
      <h3>24</h3>
      <p>1 Je l’interrogeai sur les quatre couleurs que la bête avait sur la tête. Et elle me répondit et dit : « Tu es encore curieux de pareilles choses. » Je dis : « Oui, Madame ; fais-moi connaître ce que c’est. » 2 « Écoute, dit-elle : le noir, c’est ce monde-ci, dans lequel vous habitez. 3 La couleur de feu signifie que ce monde doit périr par le sang et par le feu. 4 La partie dorée, c’est vous, qui avez fui ce monde. Car de même que l’or est éprouvé par le feu et devient utile, ainsi vous, qui habitez parmi eux, vous êtes éprouvés. Vous donc qui aurez persévéré et qui aurez été éprouvés par leur feu, vous serez purifiés. De même que l’or rejette sa scorie, ainsi rejetterez-vous toute tristesse et toute angoisse, et vous serez purifiés et utiles à la construction de la tour. 5 La partie blanche, c’est le siècle qui vient, dans lequel habiteront les élus de Dieu ; car ils seront sans tache et purs, ceux qui ont été choisis par Dieu pour la vie éternelle. 6 Toi donc, ne cesse pas de parler aux oreilles des saints. Vous avez aussi la figure de la grande tribulation qui vient. Mais si vous le voulez, elle ne sera rien. Souvenez-vous de ce qui a été écrit plus haut. » 7 Ayant dit cela, elle s’en alla, et je ne vis pas en quel lieu elle alla ; car une nuée se fit. Et moi, je me retournai en arrière, saisi de crainte, croyant que la bête venait.</p><h2>Vision V</h2>
      <h3>25</h3>
      <p>1 Comme j’avais prié dans la maison et que je m’étais assis sur le lit, entra un homme d’aspect glorieux, à la mise de berger, revêtu d’une peau de chèvre blanche, portant une besace sur les épaules et un bâton à la main. Et il me salua, et moi je le saluai en retour. 2 Et aussitôt il s’assit auprès de moi et me dit : « J’ai été envoyé par l’ange très vénérable, afin que j’habite avec toi les jours qui restent de ta vie. » 3 Je crus, moi, qu’il était là pour m’éprouver, et je lui dis : « Mais toi, qui es-tu ? Car moi, dis-je, je connais celui à qui j’ai été remis. » Il me dit : « Tu ne me reconnais pas ? » « Non », dis-je. « Je suis, dit-il, le Pasteur, celui à qui tu as été remis. » 4 Tandis qu’il parlait encore, son aspect changea, et je reconnus que c’était celui à qui j’avais été remis ; et aussitôt je fus tout troublé, la crainte me saisit, et je fus tout entier brisé de tristesse, d’avoir ainsi répondu méchamment et follement. 5 Mais lui, me répondant, dit : « Ne te trouble pas, mais fortifie-toi dans mes préceptes, ceux que je vais t’ordonner. Car j’ai été envoyé, dit-il, pour te montrer de nouveau tout ce que tu as vu auparavant, ces chapitres mêmes qui vous sont utiles. Avant tout, écris mes préceptes et mes similitudes ; le reste, tu l’écriras comme je te le montrerai ; c’est pour cela, dit-il, que je t’ordonne d’écrire d’abord les préceptes et les similitudes, afin que tu les aies sous la main pour les lire et que tu puisses les garder. » 6 J’écrivis donc les préceptes et les similitudes, comme il me l’avait ordonné. 7 Si donc, après les avoir entendus, vous les gardez, si vous y marchez et les pratiquez d’un cœur pur, vous recevrez du Seigneur tout ce qu’il vous a promis ; mais si, après les avoir entendus, vous ne faites pas pénitence et que vous ajoutiez encore à vos péchés, vous recevrez du Seigneur le contraire. Tout cela, le Pasteur, l’ange de la pénitence, m’ordonna de l’écrire ainsi.</p><h2>Précepte I</h2>
      <h3>26</h3>
      <p>1 Avant tout, crois qu’il n’y a qu’un seul Dieu, celui qui a créé et façonné toutes choses, qui les a fait passer du néant à l’être, qui contient tout et qui, seul, n’est contenu par rien. 2 Crois donc en lui et crains-le ; par cette crainte, sois continent. Observe ces choses, et tu rejetteras loin de toi toute malice, tu revêtiras toute vertu de justice, et tu vivras pour Dieu, si tu gardes ce précepte.</p><h2>Précepte II</h2>
      <h3>27</h3>
      <p>1 Il me dit : « Aie la simplicité et deviens sans malice, et tu seras comme les petits enfants, qui ne connaissent pas la malice qui détruit la vie des hommes. 2 D’abord, ne médis de personne et n’écoute pas avec plaisir celui qui médit ; sinon, toi aussi qui écoutes, tu seras coupable du péché de celui qui médit, si tu ajoutes foi à la médisance que tu auras entendue. Car, y ayant cru, toi aussi tu auras quelque chose contre ton frère ; ainsi donc tu seras coupable du péché de celui qui médit. 3 La médisance est mauvaise : c’est un démon instable, qui n’est jamais en paix, mais qui habite toujours dans les dissensions. Tiens-toi donc loin d’elle, et tu auras toujours la prospérité avec tous. 4 Revêts-toi de gravité, en laquelle il n’y a nul achoppement mauvais, mais tout est uni et joyeux. Fais le bien, et du fruit de tes travaux, que Dieu te donne, donne simplement à tous ceux qui sont dans le besoin, sans hésiter : à qui donner et à qui ne pas donner. Donne à tous ; car Dieu veut que l’on donne à tous de ses propres dons. 5 Ceux donc qui reçoivent rendront compte à Dieu de ce qu’ils ont reçu et de ce à quoi ils l’ont destiné ; car ceux qui reçoivent dans l’affliction ne seront pas jugés, mais ceux qui reçoivent avec hypocrisie paieront la peine. 6 Celui qui donne est donc irréprochable : car, ayant reçu du Seigneur ce ministère à accomplir, il l’a accompli simplement, sans rien distinguer, à qui donner ou à qui ne pas donner. Ainsi ce ministère, accompli simplement, est devenu glorieux devant Dieu. Celui donc qui sert Dieu avec cette simplicité vivra. 7 Garde donc ce précepte, comme je te l’ai dit, afin que ta pénitence et celle de ta maison soient trouvées dans la simplicité, avec une innocence pure et sans souillure. »</p><h2>Précepte III</h2>
      <h3>28</h3>
      <p>1 Il me dit encore : « Aime la vérité, et que toute vérité sorte de ta bouche, afin que l’esprit que Dieu a fait habiter dans cette chair soit trouvé vrai devant tous les hommes, et qu’ainsi soit glorifié le Seigneur qui habite en toi, car le Seigneur est véridique en toute parole, et il n’y a en lui aucun mensonge. 2 Ceux donc qui mentent renient le Seigneur et le dépouillent, puisqu’ils ne lui rendent pas le dépôt qu’ils ont reçu. Car ils ont reçu de lui un esprit qui ne ment pas. S’ils le lui rendent mensonger, ils ont souillé le précepte du Seigneur et sont devenus spoliateurs. » 3 Ayant entendu cela, je pleurai beaucoup. Me voyant pleurer, il dit : « Pourquoi pleures-tu ? » « Parce que, dis-je, Seigneur, je ne sais pas si je puis être sauvé. » « Pourquoi ? » dit-il. « Car jusqu’ici, dis-je, Seigneur, dans ma vie, je n’ai pas encore dit une parole vraie, mais j’ai toujours parlé avec fourberie à l’égard de tous, et j’ai fait passer mon mensonge pour vrai devant tous les hommes ; et jamais personne ne m’a contredit, mais on a cru à ma parole. Comment donc, dis-je, Seigneur, puis-je vivre après avoir fait cela ? » 4 « Toi, dit-il, tu penses bien et selon la vérité ; car il te fallait, comme serviteur de Dieu, marcher dans la vérité, et ne pas laisser une mauvaise conscience habiter avec l’esprit de vérité, ni causer de la tristesse à l’esprit vénérable et vrai. » « Jamais, dis-je, Seigneur, je n’ai entendu de telles paroles avec tant de précision. » 5 « Maintenant donc, dit-il, tu les entends ; observe-les, afin que, ces paroles-ci se trouvant vraies, les mensonges que tu as dits auparavant dans tes affaires deviennent eux aussi dignes de foi ; car ils peuvent, eux aussi, devenir dignes de foi. Si tu observes ces choses et si, désormais, tu dis toute la vérité, tu pourras t’assurer la vie ; et quiconque entendra ce précepte et s’abstiendra du mensonge le plus mauvais vivra pour Dieu. »</p><h2>Précepte IV</h2>
      <h3>29</h3>
      <p>1 « Je t’ordonne, dit-il, de garder la chasteté et de ne pas laisser monter sur ton cœur le désir de la femme d’autrui, ni d’une fornication quelconque, ni d’autres représentations mauvaises du même genre ; car, en faisant cela, tu commets un grand péché. Mais te souvenant toujours de ta femme, tu ne pécheras jamais. 2 Car si ce désir monte sur ton cœur, tu pécheras ; et si d’autres désirs, tout aussi mauvais, s’y élèvent, tu commets un péché ; car ce désir est un grand péché pour un serviteur de Dieu. Et si quelqu’un accomplit cette œuvre mauvaise, il se prépare la mort. 3 Prends donc garde, toi : tiens-toi loin de ce désir ; car là où habite la pudeur, l’iniquité ne doit pas monter sur le cœur d’un homme juste. » 4 Je lui dis : « Seigneur, permets-moi de te poser quelques questions. » « Parle », dit-il. « Seigneur, dis-je, si quelqu’un a une femme croyante dans le Seigneur, et qu’il la trouve en adultère, l’homme qui vit avec elle pèche-t-il ? » 5 « Tant qu’il l’ignore, dit-il, il ne pèche pas ; mais si le mari apprend son péché, et que la femme ne fasse pas pénitence, mais persiste dans sa fornication, et que le mari continue de vivre avec elle, il se rend coupable du péché de sa femme et complice de son adultère. » 6 « Que fera donc, dis-je, Seigneur, le mari, si la femme persiste dans cette passion ? » « Qu’il la renvoie, dit-il, et que le mari reste seul. Mais si, après avoir renvoyé sa femme, il en épouse une autre, lui aussi commet l’adultère. » 7 « Et si, dis-je, Seigneur, après qu’il l’a renvoyée, la femme fait pénitence et veut retourner vers son mari, ne sera-t-elle pas reçue ? » 8 « Certes, dit-il, si le mari ne la reçoit pas, il pèche et il attire sur lui un grand péché ; il faut pourtant recevoir celui qui a péché et qui fait pénitence, mais non pas un grand nombre de fois ; car pour les serviteurs de Dieu, la pénitence est une. C’est donc en vue de la pénitence que le mari ne doit pas se remarier. Cette règle s’applique à la femme comme à l’homme. 9 Ce n’est pas seulement en souillant sa chair, dit-il, que l’on commet adultère ; celui qui fait ce que font les païens commet adultère, lui aussi. C’est pourquoi, si quelqu’un persiste dans de telles œuvres et ne fait pas pénitence, tiens-toi loin de lui et ne vis pas avec lui ; sinon, toi aussi, tu as part à son péché. 10 C’est pour cela qu’il vous a été prescrit de rester seuls, homme ou femme ; car en de telles situations, la pénitence est possible. 11 Moi donc, dit-il, je ne donne pas prétexte à ce que cette pratique s’accomplisse ainsi ; c’est pour que celui qui a péché ne pèche plus. Et pour son péché antérieur, il y a quelqu’un qui peut apporter la guérison ; car c’est lui qui a pouvoir sur toutes choses. »</p>
      <h3>30</h3>
      <p>1 Je l’interrogeai de nouveau, disant : « Puisque le Seigneur m’a jugé digne que tu habites toujours avec moi, supporte encore quelques paroles de ma part ; car je ne comprends rien, et mon cœur s’est endurci à cause de mes actions passées. Donne-moi l’intelligence, car je suis tout à fait insensé et je n’entends absolument rien. » 2 Me répondant, il dit : « Moi, dit-il, je suis établi pour la pénitence, et à tous ceux qui font pénitence je donne l’intelligence. Ne te semble-t-il pas, dit-il, que ce soit là de l’intelligence, de faire pénitence ? La pénitence, dit-il, est une grande intelligence ; car celui qui a péché a compris qu’il a fait le mal devant le Seigneur, et l’action qu’il a commise monte sur son cœur, et il fait pénitence et n’accomplit plus le mal, mais il accomplit le bien avec largesse, il humilie son âme et la tourmente de ce qu’elle a péché. Tu vois donc que la pénitence est une grande intelligence. » 3 « C’est pour cela, dis-je, Seigneur, que je m’enquiers de tout auprès de toi avec exactitude : d’abord parce que je suis pécheur, afin de savoir quelles œuvres, en les pratiquant, me feront vivre ; car mes péchés sont nombreux et divers. » 4 « Tu vivras, dit-il, si tu gardes mes préceptes et si tu marches en eux ; et quiconque, ayant entendu ces préceptes, les gardera, vivra pour Dieu. »</p>
      <h3>31</h3>
      <p>1 « Je vais, dis-je, ajouter encore une question, Seigneur. » « Parle », dit-il. « J’ai entendu, dis-je, Seigneur, certains docteurs dire que nous sommes descendus dans l’eau et que nous avons reçu le pardon de nos péchés antérieurs. » 2 Il me dit : « Tu as bien entendu ; car il en est ainsi. Celui qui a reçu le pardon de ses péchés ne devait plus pécher, mais demeurer dans la pureté. 3 Mais puisque tu t’enquiers de tout avec exactitude, je te ferai connaître ceci aussi, sans donner de prétexte à ceux qui vont croire ou à ceux qui croient maintenant au Seigneur. Car ceux qui viennent de croire, ou qui croiront, n’ont pas de pénitence pour leurs péchés, mais ils ont la rémission de leurs péchés antérieurs. 4 C’est donc pour ceux qui ont été appelés avant ces jours que le Seigneur a établi la pénitence ; car le Seigneur, qui connaît les cœurs et qui prévoit tout, a connu la faiblesse des hommes et la fourberie du diable, qui fera quelque mal aux serviteurs de Dieu et usera de malice contre eux. 5 Le Seigneur donc, plein de miséricorde, eut compassion de sa créature et établit cette pénitence ; et c’est à moi que fut donné le pouvoir de cette pénitence. 6 Mais je te le dis, dit-il : après cet appel grand et solennel, si quelqu’un, tenté par le diable, vient à pécher, il a une seule pénitence ; mais s’il pèche coup sur coup et fait pénitence, cela n’est pas profitable à un tel homme ; car il vivra difficilement. » 7 Je lui dis : « J’ai repris vie en entendant de toi ces choses avec tant de précision ; car je sais que, si je n’ajoute plus à mes péchés, je serai sauvé. » « Tu seras sauvé, dit-il, et tous ceux qui feront ainsi. »</p>
      <h3>32</h3>
      <p>1 Je l’interrogeai de nouveau, disant : « Seigneur, puisque tu me supportes encore une fois, indique-moi aussi ceci. » « Parle », dit-il. « Si une femme, dis-je, Seigneur, ou encore un homme vient à mourir, et que l’un d’eux se remarie, celui qui se remarie pèche-t-il ? » 2 « Il ne pèche pas, dit-il ; mais si quelqu’un reste seul, il s’acquiert auprès du Seigneur un honneur plus grand et une grande gloire ; et s’il se remarie, il ne pèche pas non plus. 3 Observe donc la chasteté et la pudeur, et tu vivras pour Dieu. Tout ce que je te dis et te dirai, garde-le dès maintenant, depuis le jour où tu m’as été remis, et j’habiterai dans ta maison. 4 Et il y aura rémission pour tes transgressions passées, si tu gardes mes préceptes ; et il y aura rémission pour tous, s’ils gardent ces préceptes et s’ils marchent dans cette pureté. »</p><h2>Précepte V</h2>
      <h3>33</h3>
      <p>1 « Sois patient, dit-il, et prudent, et tu domineras toutes les œuvres mauvaises, et tu accompliras toute justice. 2 Car si tu es patient, l’Esprit Saint qui habite en toi sera pur, et ne sera pas obscurci par un autre esprit mauvais ; mais, habitant au large, il sera dans l’allégresse et se réjouira avec le vase dans lequel il habite, et il servira Dieu avec une grande allégresse, ayant en lui-même l’abondance. 3 Mais si quelque colère survient, aussitôt l’Esprit Saint, qui est délicat, se trouve à l’étroit, n’ayant pas un lieu pur, et il cherche à s’en aller de ce lieu ; car il est étouffé par l’esprit mauvais, n’ayant pas de lieu où servir le Seigneur comme il veut, souillé qu’il est par la colère. Car le Seigneur habite dans la patience, et le diable dans la colère. 4 Ces deux esprits habitant donc ensemble, cela est nuisible et mauvais pour cet homme en qui ils habitent. 5 Car si tu prends un peu d’absinthe, très peu, et que tu la verses dans une jarre de miel, tout le miel ne disparaît-il pas, et tant de miel n’est-il pas perdu par la plus petite absinthe, qui fait perdre au miel sa douceur, et il n’a plus la même grâce auprès du Maître, parce qu’on l’a mêlé et qu’il a perdu son usage ? Mais si l’absinthe n’est pas jetée dans le miel, le miel se trouve doux et devient utile à son Maître. 6 Tu vois que la patience est plus douce que le miel, qu’elle est utile au Seigneur et qu’il habite en elle. Mais la colère est amère et inutile. Si donc la colère se mêle à la patience, la patience est souillée, et sa prière n’est plus utile à Dieu. » 7 Je voulais, dis-je, Seigneur, connaître l’action de la colère, afin de m’en garder. « Certes, dit-il, si tu ne t’en gardes pas, toi et ta maison, tu as perdu tout ton espoir. Mais garde-toi d’elle ; car je suis avec toi. Et tous s’en abstiendront, tous ceux qui font pénitence de tout leur cœur ; car je serai avec eux et je les garderai ; car ils ont tous été justifiés par l’ange très vénérable. »</p>
      <h3>34</h3>
      <p>1 « Écoute maintenant, dit-il, quelle est l’action de la colère, combien elle est mauvaise, et comment elle renverse mes serviteurs par son action ; et comment elle égare. Mais ceux qui sont pleins de foi, elle ne peut pas même agir sur eux, parce que ma puissance est avec eux ; elle n’égare que ceux qui sont vides et doubles de cœur. 2 Lorsqu’elle voit de tels hommes fermes, elle se jette dans le cœur de cet homme, et pour un rien, l’homme ou la femme s’aigrit à cause des choses de la vie, ou de la nourriture, ou de quelque chicane, ou d’un ami, ou d’un don donné ou reçu, ou de telles choses insensées ; car tout cela est insensé, vain, sot et nuisible aux serviteurs de Dieu. 3 Mais la patience est grande et forte, et elle a une puissance vigoureuse et ferme, qui s’épanouit au large ; elle est joyeuse, elle exulte, elle est sans souci, elle glorifie le Seigneur en tout temps, elle n’a rien d’amer en elle, elle demeure toujours douce et calme. Cette patience donc habite avec ceux qui ont la foi entière. 4 Mais la colère est d’abord sotte, légère et insensée. Puis, de la sottise naît l’amertume, de l’amertume la fureur, de la fureur l’irritation, de l’irritation le ressentiment ; puis ce ressentiment, formé de tant de maux, devient un grand péché et sans remède. 5 Car lorsque ces esprits habitent dans un seul vase, où habite aussi l’Esprit Saint, ce vase ne les contient pas, mais il déborde. 6 L’esprit délicat donc, qui n’a pas l’habitude d’habiter avec un esprit mauvais ni avec la dureté, s’éloigne d’un tel homme et cherche à habiter avec la douceur et le calme. 7 Puis, lorsqu’il s’est retiré de cet homme en qui il habitait, cet homme devient vide de l’esprit juste, et désormais rempli des esprits mauvais, il est dans le désordre en toute action, emporté çà et là par les esprits mauvais, et il est entièrement aveuglé loin de la bonne intelligence. Ainsi en arrive-t-il à tous les colériques. 8 Abstiens-toi donc de la colère et de l’amertume, et tu seras trouvé avec la gravité que le Seigneur aime. Prends donc garde de ne jamais négliger ce précepte ; car si tu te rends maître de ce précepte, tu pourras garder aussi les autres préceptes que je vais t’ordonner. Sois fort en eux et fortifie-toi, et que tous se fortifient, tous ceux qui veulent y marcher. »</p><h2>Précepte VI</h2>
      <h3>35</h3>
      <p>1 « Je t’ai ordonné, dit-il, dans le premier précepte, de garder la foi, la crainte et la continence. » « Oui, Seigneur », dis-je. « Mais maintenant, dit-il, je veux te montrer aussi leurs puissances, afin que tu comprennes laquelle d’entre elles a quelle puissance et quelle action ; car leurs actions sont doubles. Elles s’appliquent donc au juste et à l’injuste. 2 Toi donc, crois au juste, mais ne crois pas à l’injuste ; car le juste a une voie droite, et l’injuste une voie tortueuse. Mais toi, marche dans la voie droite et unie, et laisse la tortueuse. 3 Car la voie tortueuse n’a pas de sentiers, mais elle est impraticable, pleine de nombreux obstacles, raboteuse et épineuse. Elle est donc nuisible à ceux qui y marchent. 4 Mais ceux qui marchent dans la voie droite avancent uniment et sans trébucher ; car elle n’est ni raboteuse ni épineuse. Tu vois donc qu’il est plus avantageux de marcher par cette voie. Tu marcheras, dit-il, et quiconque se tourne vers le Seigneur de tout son cœur y marchera. »</p>
      <h3>36</h3>
      <p>1 « Écoute maintenant, dit-il, ce qui concerne la foi. Il y a deux anges avec l’homme, l’un de la justice et l’autre de la méchanceté. » 2 « Comment donc, dis-je, Seigneur, connaîtrai-je leurs actions, puisque les deux anges habitent avec moi ? » 3 « Écoute, dit-il, et tu les comprendras. L’ange de la justice est délicat, pudique, doux et calme. Quand donc il monte sur ton cœur, aussitôt il te parle de justice, de chasteté, de gravité, de contentement, de toute œuvre juste et de toute vertu glorieuse. Quand toutes ces choses montent dans ton cœur, sache que l’ange de la justice est avec toi. Telles sont donc les œuvres de l’ange de la justice. Aie donc confiance en lui et en ses œuvres. 4 Vois donc aussi les œuvres de cet ange. Avant tout, il est colérique, amer et insensé, et ses œuvres sont mauvaises, renversant les serviteurs de Dieu. Quand donc il monte sur ton cœur, reconnais-le à ses œuvres. » 5 « Comment, dis-je, Seigneur, le reconnaîtrai-je ? Je ne le sais pas. » « Écoute, dit-il. Quand quelque colère ou quelque amertume t’assaille, sache que c’est lui qui est en toi ; puis le désir de multiples actions, et le luxe des festins nombreux, des ivresses et des débauches nombreuses, des mets variés et superflus, et le désir des femmes et des richesses, et un grand orgueil et une jactance, et tout ce qui est proche et semblable à cela : quand donc ces choses montent sur ton cœur, sache que l’ange de la méchanceté est en toi. 6 Toi donc, ayant reconnu ses œuvres, éloigne-toi de lui : elles sont mauvaises et funestes aux serviteurs de Dieu. Tu as donc les actions des deux anges ; comprends-les et crois à l’ange de la justice. 7 Et éloigne-toi de l’ange de la méchanceté, parce que son enseignement est mauvais. Et lorsque les œuvres de l’ange de justice montent au cœur de l’homme, il faut de nécessité qu’il fasse quelque chose de bon. 9 Tu vois donc, dit-il, qu’il est bon de suivre l’ange de la justice et de renoncer à l’ange de la méchanceté. 10 Ce précepte montre ce qui concerne la foi : que tu croies aux œuvres de l’ange de justice, et qu’en les accomplissant tu vives pour Dieu ; mais les œuvres de l’ange de la méchanceté sont funestes ; en ne les faisant donc pas, tu vivras pour Dieu. »</p><h2>Précepte VII</h2>
      <h3>37</h3>
      <p>1 « Crains, dit-il, le Seigneur et garde ses préceptes. En gardant donc les préceptes de Dieu, tu seras puissant en toute action, et ton action sera incomparable. Car en craignant le Seigneur tu feras tout bien ; c’est là la crainte qu’il te faut avoir, et tu seras sauvé. 2 Mais le diable, ne le crains pas ; car en craignant le Seigneur tu domineras le diable, parce qu’il n’y a en lui aucune puissance. Or celui en qui est la puissance glorieuse a aussi la crainte. Car quiconque a la puissance a la crainte ; mais celui qui n’a pas de puissance est méprisé de tous. 3 Crains donc les œuvres du diable, parce qu’elles sont mauvaises. En craignant donc le Seigneur, tu ne les feras pas, mais tu t’en abstiendras. 4 Il y a donc deux craintes. Si tu veux faire le mal, crains le Seigneur, et tu ne le feras pas ; mais si tu veux de nouveau faire le bien, crains le Seigneur, et tu le feras. Ainsi la crainte du Seigneur est forte, grande et glorieuse. Crains donc le Seigneur, et tu vivras pour lui ; et tous ceux qui le craindront et qui garderont ses préceptes vivront pour Dieu. » 5 « Pourquoi, dis-je, Seigneur, as-tu dit de ceux qui gardent ses préceptes : “Ils vivront pour Dieu” ? » « Parce que, dit-il, toute la création craint le Seigneur, mais elle ne garde pas ses préceptes. Ceux donc qui le craignent et qui gardent ses préceptes, leur vie est auprès de Dieu ; mais ceux qui ne gardent pas ses préceptes n’ont pas non plus la vie en lui. »</p><h2>Précepte VIII</h2>
      <h3>38</h3>
      <p>1 « Je t’ai dit, reprit-il, que les créatures de Dieu sont doubles ; car la continence aussi est double. Car il y a des choses dont il faut s’abstenir, et d’autres dont il ne faut pas. » 2 « Fais-moi connaître, dis-je, Seigneur, de quelles choses il faut s’abstenir, et de quelles autres il ne faut pas. » « Écoute, dit-il. Abstiens-toi du mal et ne le fais pas ; mais ne t’abstiens pas du bien, fais-le plutôt. Car si tu t’abstiens de faire le bien, tu commets un grand péché ; mais si tu t’abstiens de faire le mal, tu accomplis une grande justice. Abstiens-toi donc de toute méchanceté en faisant le bien. » 3 « Quelles sont, dis-je, Seigneur, les méchancetés dont il nous faut nous abstenir ? » « Écoute, dit-il : l’adultère et la fornication, l’ivresse, l’iniquité, les festins nombreux, la hauteur d’esprit, l’orgueil, le mensonge, la médisance, l’hypocrisie, la rancune et tout blasphème. 4 Ces œuvres sont les plus mauvaises de toutes dans la vie des hommes. De ces œuvres donc doit s’abstenir le serviteur de Dieu ; car celui qui ne s’en abstient pas ne peut vivre pour Dieu. Écoute donc aussi ce qui suit. » 5 « Y a-t-il encore, dis-je, Seigneur, de mauvaises œuvres ? » « Il y en a beaucoup aussi, dit-il, dont doit s’abstenir le serviteur de Dieu : le vol, le mensonge, le détournement, le faux témoignage, la cupidité, le désir mauvais, la tromperie, la vaine gloire, la jactance, et tout ce qui ressemble à cela. » 6 « Ne te semble-t-il pas que cela soit mauvais ? » « Et très mauvais, dis-je, pour les serviteurs de Dieu. » « De toutes ces choses doit s’abstenir celui qui sert Dieu. Abstiens-toi donc : il te faut t’en abstenir, afin que tu vives pour Dieu et que tu sois inscrit avec ceux qui s’en abstiennent. Voilà de quoi tu dois t’abstenir. 7 Ce dont il ne faut pas que tu t’abstiennes, dit-il, mais que tu fasses, le voici. » 8 « Et des bonnes choses, dis-je, Seigneur, montre-moi la puissance, afin que je marche en elles et que je les serve, afin qu’en les accomplissant je puisse être sauvé. » « Écoute, dit-il, les œuvres des bonnes choses, qu’il te faut accomplir et dont tu ne dois pas t’abstenir. 9 Avant tout, la foi, la crainte du Seigneur, la charité, la concorde, les paroles de justice, la vérité, la constance : rien n’est meilleur que cela dans la vie des hommes. Si quelqu’un garde ces choses et ne s’en abstient pas, il est bienheureux dans sa vie. 10 Puis écoute ce qui suit : servir les veuves, visiter les orphelins et les indigents, racheter de la nécessité les serviteurs de Dieu, être hospitalier (car dans l’hospitalité se trouve parfois l’occasion de faire le bien), ne s’opposer à personne, être calme, se faire le plus petit de tous les hommes, honorer les vieillards, pratiquer la justice, garder la fraternité, supporter l’outrage, être patient, n’avoir pas de rancune, réconforter ceux qui sont abattus dans leur âme, ne pas rejeter ceux qui se sont écartés de la foi, mais les ramener et les rendre courageux, avertir ceux qui pèchent, ne pas accabler les débiteurs ni les indigents, et tout ce qui est semblable à cela. 11 Ne te semble-t-il pas, dit-il, que cela soit bon ? » « Quoi donc, dis-je, Seigneur, est meilleur que cela ? » « Marche donc en elles, dit-il, et ne t’en abstiens pas, et tu vivras pour Dieu. 12 Garde donc ce précepte : si tu fais le bien et que tu ne t’en abstiennes pas, tu vivras pour Dieu, et tous ceux qui font ainsi vivront pour Dieu. Et encore, si tu ne fais pas le mal et que tu t’en abstiennes, tu vivras pour Dieu, et tous vivront pour Dieu, ceux qui garderont ces préceptes et qui y marcheront. »</p><h2>Précepte IX</h2>
      <h3>39</h3>
      <p>1 Il me dit : « Ôte de toi le double esprit, et ne doute en rien lorsque tu demandes quelque chose à Dieu, en disant en toi-même : comment pourrais-je demander au Seigneur et recevoir, moi qui ai tant péché contre lui ? 2 Ne raisonne pas ainsi, mais de tout ton cœur tourne-toi vers le Seigneur et demande-lui sans hésiter, et tu connaîtras sa grande miséricorde : il ne t’abandonnera certes pas, mais il accomplira la demande de ton âme. 3 Car Dieu n’est pas comme les hommes, qui gardent rancune ; lui, il ne garde pas rancune, et il a compassion de sa créature. 4 Toi donc, purifie ton cœur de toutes les vanités de ce siècle et des paroles qui t’ont été dites auparavant, et demande au Seigneur, et tu recevras tout, et tu ne manqueras d’aucune de tes demandes, si tu demandes au Seigneur sans hésiter. 5 Mais si tu hésites en ton cœur, tu ne recevras rien de tes demandes. Car ceux qui doutent de Dieu, ceux-là sont les hommes au double esprit, et ils n’obtiennent absolument rien de leurs demandes. 6 Mais ceux qui sont entiers dans la foi demandent tout, confiants dans le Seigneur, et ils reçoivent, parce qu’ils demandent sans hésiter, sans avoir aucun double esprit. Car tout homme au double esprit, s’il ne fait pénitence, sera difficilement sauvé. 7 Purifie donc ton cœur du double esprit, revêts-toi de la foi, car elle est forte, et crois en Dieu : tout ce que tu demandes, tu le recevras ; et si, ayant demandé un jour quelque chose au Seigneur, tu le reçois plus tard, ne doute pas parce que tu n’as pas reçu aussitôt la demande de ton âme ; car c’est toujours à cause de quelque tentation ou de quelque faute que tu ignores, que tu reçois plus tard ta demande. 8 Toi donc, ne cesse pas de demander ; mais si tu te décourages et doutes en demandant, accuse-toi toi-même, et non celui qui te donne. 9 Vois ce double esprit : il est méchant, insensé, et il déracine beaucoup de gens de la foi, même des gens très fidèles et forts. Car ce double esprit est une fille du diable, et il exerce grande malice contre les serviteurs de Dieu. 10 Méprise donc le double esprit et rends-toi maître de lui en toute chose, ayant revêtu la foi forte et puissante ; car la foi promet tout, elle mène tout à la perfection ; mais le double esprit, qui ne se fie pas à lui-même, échoue dans toutes les œuvres qu’il fait. 11 Tu vois donc, dit-il, que la foi vient d’en haut, du Seigneur, et qu’elle a une grande puissance ; mais le double esprit est un esprit terrestre, qui vient du diable, et il n’a pas de puissance. 12 Toi donc, sers la foi qui a la puissance, et éloigne-toi du double esprit qui n’en a pas, et tu vivras pour Dieu, et tous ceux qui pensent ainsi vivront pour Dieu. »</p><h2>Précepte X</h2>
      <h3>40</h3>
      <p>1 Il dit : « Ôte de toi la tristesse ; car elle est, elle aussi, sœur du double esprit et de la colère. » 2 Je dis : « Comment, Seigneur, est-elle leur sœur ? Car il me semble que la colère est une chose, le double esprit une autre, et la tristesse une autre encore. » Il dit : « Tu es un homme sans intelligence, et tu ne comprends pas que la tristesse est plus méchante que tous les esprits et la plus redoutable pour les serviteurs de Dieu, et que, plus que tous les esprits, elle ruine l’homme, consume l’Esprit Saint, et puis sauve ? » 3 Je dis : « Seigneur, je suis sans intelligence et je ne comprends pas ces similitudes. Car comment peut-elle consumer et de nouveau sauver, je ne le vois pas. » 4 Il dit : « Écoute. Ceux qui n’ont jamais scruté la vérité, ni fait de recherche sur la divinité, mais qui ont seulement cru, et qui sont embrouillés dans les affaires, la richesse, les amitiés païennes et beaucoup d’autres affaires de ce siècle : tous ceux donc qui s’attachent à ces choses ne comprennent pas les similitudes de la divinité ; car ils sont obscurcis par ces occupations, et ils se corrompent, et ils deviennent en friche. 5 De même que les bonnes vignes, quand on les néglige, sont rendues en friche par les épines et les herbes de toute sorte, ainsi les hommes qui ont cru et qui tombent dans ces nombreuses occupations dont j’ai parlé s’écartent de leur bon sens, et ne comprennent absolument rien à la justice ; mais même lorsqu’ils entendent parler de la divinité et de la vérité, ils ne comprennent absolument rien. 6 Mais ceux qui ont la crainte de Dieu, qui scrutent la divinité et la vérité, et qui ont le cœur tourné vers le Seigneur, comprennent plus vite tout ce qu’on leur dit, et ils l’entendent, parce qu’ils ont en eux la crainte du Seigneur ; car là où le Seigneur habite, là aussi est grande l’intelligence. Attache-toi donc au Seigneur, et tu comprendras tout, et tu entendras tout. »</p>
      <h3>41</h3>
      <p>1 Il dit : « Écoute donc, insensé, comment la tristesse consume l’Esprit Saint et puis le sauve. 2 Lorsque l’homme au double esprit entreprend une action et qu’il y échoue à cause de son double esprit, cette tristesse entre en lui, et elle attriste l’Esprit Saint et le consume. 3 Puis, à son tour, quand la colère s’attache à l’homme à propos de quelque chose et qu’il s’aigrit fort, de nouveau la tristesse entre dans le cœur de l’homme qui s’est emporté ; et il s’attriste de l’action qu’il a faite, et il fait pénitence d’avoir fait le mal. 4 Cette tristesse donc semble apporter le salut, parce que celui qui a fait le mal a fait pénitence. Mais ces deux manières d’agir attristent l’esprit : le double esprit, parce qu’il n’a pas réussi dans son action ; la colère, parce qu’elle a fait le mal. L’une et l’autre donc sont attristantes pour l’Esprit Saint, le double esprit et la colère. 5 Ôte donc de toi la tristesse, et n’opprime pas l’Esprit Saint qui habite en toi, de peur qu’il ne prie Dieu et ne s’éloigne de toi. 6 Car l’Esprit de Dieu, qui a été donné à cette chair, ne supporte ni la tristesse ni la détresse. »</p>
      <h3>42</h3>
      <p>1 « Revêts-toi donc de la gaieté, qui a toujours grâce auprès de Dieu et qui lui est agréable, et fais-en tes délices. Car tout homme gai fait le bien, pense le bien et méprise la tristesse. 2 Mais l’homme triste fait toujours le mal : premièrement il fait le mal, parce qu’il attriste l’Esprit Saint, qui a été donné joyeux à l’homme ; deuxièmement, en attristant l’Esprit Saint, il commet l’iniquité, en ne priant pas et en ne se confessant pas au Seigneur. Car jamais la prière de l’homme triste n’a la puissance de monter à l’autel de Dieu. » 3 Je dis : « Pourquoi la prière de l’homme attristé ne monte-t-elle pas à l’autel ? » Il dit : « Parce que la tristesse siège dans son cœur. Mêlée à la prière, la tristesse ne laisse pas la prière monter pure à l’autel. Car de même que le vinaigre et le vin mêlés ensemble n’ont pas la même saveur, ainsi la tristesse, mêlée à l’Esprit Saint, ne produit pas la même prière. 4 Purifie-toi donc de cette tristesse mauvaise, et tu vivras pour Dieu ; et tous vivront pour Dieu, tous ceux qui rejetteront loin d’eux la tristesse et se revêtiront de toute gaieté. »</p><h2>Précepte XI</h2>
      <h3>43</h3>
      <p>1 Il me montra des hommes assis sur un banc, et un autre homme assis sur une chaire, et il me dit : « Vois-tu ceux qui sont assis sur le banc ? » Je dis : « Je les vois, Seigneur. » Il dit : « Ceux-là sont fidèles, et celui qui est assis sur la chaire est un faux prophète, qui perd l’intelligence des serviteurs de Dieu ; il perd ceux qui ont le double esprit, et non les fidèles. 2 Ceux donc qui ont le double esprit viennent à lui comme à un devin, et ils l’interrogent sur ce qui leur arrivera ; et ce faux prophète, n’ayant en lui-même aucune puissance d’esprit divin, leur parle selon leurs questions et selon les désirs de leur malice, et il remplit leurs âmes comme eux-mêmes le veulent. 3 Car lui-même, étant vide, il répond des choses vaines à des hommes vains ; car ce qu’on lui demande, il y répond selon le vide de cet homme. Pourtant il dit aussi quelques paroles vraies : le diable le remplit de son esprit, s’il peut en briser quelqu’un des justes. 4 Ceux donc qui sont forts dans la foi du Seigneur, revêtus de la vérité, ne s’attachent pas à de tels esprits, mais ils s’en tiennent éloignés ; mais ceux qui ont le double esprit et qui font souvent pénitence consultent les devins comme les païens, et s’attirent à eux-mêmes un plus grand péché en idolâtrant ; car celui qui interroge un faux prophète sur quelque affaire est idolâtre, vide de la vérité et insensé. 5 Car tout esprit donné par Dieu ne se laisse pas interroger, mais, ayant en lui la puissance de la divinité, il dit tout de lui-même, parce qu’il est d’en haut, de la puissance de l’Esprit divin. 6 Mais l’esprit qu’on interroge et qui parle selon les désirs des hommes est terrestre et léger, et il n’a pas de puissance ; et il ne parle absolument pas, si on ne l’interroge pas. » 7 Je dis : « Comment donc, Seigneur, un homme saura-t-il lequel d’entre eux est prophète et lequel est faux prophète ? » Il dit : « Écoute, au sujet des deux prophètes ; et comme je vais te le dire, ainsi éprouveras-tu le prophète et le faux prophète. Éprouve d’après la vie l’homme qui a l’esprit divin. 8 Premièrement, celui qui a l’esprit d’en haut est doux, calme, humble ; il s’abstient de toute malice et de tout vain désir de ce siècle ; il se fait inférieur à tous les hommes, et il ne répond rien à quiconque l’interroge ; il ne parle pas non plus en particulier, et ce n’est pas quand l’homme veut parler que parle l’Esprit Saint, mais il parle quand Dieu veut qu’il parle. 9 Quand donc l’homme qui a l’esprit divin entre dans une assemblée d’hommes justes qui ont la foi en l’Esprit divin, et que l’assemblée de ces hommes adresse une prière à Dieu, alors l’ange de l’esprit prophétique, qui se tient auprès de lui, remplit cet homme ; et l’homme, rempli de l’Esprit Saint, parle à la foule, comme le Seigneur le veut. 10 Ainsi donc se manifestera l’esprit de la divinité. Telle est donc la puissance du Seigneur touchant l’esprit de la divinité. 11 Écoute maintenant, dit-il, au sujet de l’esprit terrestre, vide, sans puissance, et qui est insensé. 12 Premièrement, cet homme qui croit avoir l’esprit s’élève lui-même et veut avoir la première place ; et aussitôt il est effronté, impudent, bavard ; il se livre à beaucoup de délices et à beaucoup d’autres tromperies, et il reçoit des salaires pour sa prophétie ; et s’il ne reçoit pas, il ne prophétise pas. Un esprit divin peut-il donc recevoir des salaires et prophétiser ? Il n’est pas possible qu’un prophète de Dieu fasse cela, mais l’esprit de tels prophètes est terrestre. 13 Ensuite, il n’approche absolument pas d’une assemblée d’hommes justes, mais il les fuit ; il s’attache aux hommes au double esprit et vides, et dans un coin il leur prophétise, et il les trompe en leur tenant des discours vains, conformes à leurs désirs ; car c’est à des hommes vains qu’il répond. Car le vase vide, mis avec des vases vides, ne se brise pas, mais ils s’accordent entre eux. 14 Mais quand il entre dans une assemblée pleine d’hommes justes qui ont l’esprit divin, l’esprit s’enfuit de lui, saisi de crainte, et cet homme devient muet et tout brisé, ne pouvant rien dire. 15 Car si tu places parmi les autres vases un vase vide, et que tu veuilles ensuite vider la réserve, ce vase que tu y as mis vide, tu le retrouveras vide. Ainsi les prophètes vides : quand ils viennent parmi les esprits des justes, tels ils sont venus, tels ils se trouvent. 16 Tu as la vie des deux sortes de prophètes. Éprouve donc, d’après les œuvres et la vie, l’homme qui parle par l’esprit qui vient de Dieu et qui a la puissance ; pour celui qui est vide, ne crois rien de ce qu’il dit, car il n’y a en lui aucune puissance : il vient du diable. 18 Écoute donc la similitude que je vais te dire : prends une pierre et jette-la vers le ciel, vois si tu peux la toucher ; ou bien prends un siphon d’eau et fais jaillir un jet vers le ciel, vois si tu peux percer le ciel. » 19 Je dis : « Comment, Seigneur, cela peut-il se faire ? » Il dit : « De même que ces choses sont impossibles, ainsi les esprits terrestres sont impuissants et sans force. 20 Prends donc la puissance qui vient d’en haut : la grêle est un très petit grain, et quand elle tombe sur la tête d’un homme, quel mal elle fait ! Ou bien prends une goutte qui tombe du toit à terre : les plus petites choses qui tombent d’en haut sur la terre ont une grande puissance ; ainsi l’esprit divin, qui vient d’en haut, est puissant. Aie donc foi en cet esprit, et éloigne-toi de l’autre. »</p><h2>Précepte XII</h2>
      <h3>44</h3>
      <p>1 Il me dit : « Écarte de toi tout désir mauvais, et revêts-toi du désir bon et vénérable ; car, revêtu de ce désir, tu haïras le désir mauvais et tu le tiendras en bride comme tu voudras. 2 Car le désir mauvais est sauvage et il est difficile à apprivoiser. Il est redoutable, et par sa sauvagerie il consume grandement les hommes ; surtout si un serviteur de Dieu y tombe et n’est pas sensé, il est consumé par lui d’une manière terrible. Il consume ceux qui n’ont pas le vêtement du désir bon, mais qui sont empêtrés dans ce siècle ; ceux-là donc, il les livre à la mort. » 3 Je dis : « Quelles sont, Seigneur, les œuvres du désir mauvais qui livrent les hommes à la mort ? Fais-les-moi connaître, afin que je m’en écarte. » Il dit : « Écoute, par quelles œuvres le désir mauvais fait mourir les serviteurs de Dieu. »</p>
      <h3>45</h3>
      <p>1 « Avant tout autre, le désir de la femme d’autrui ou de l’homme d’autrui, et le faste de la richesse, et les mets nombreux et vains, et les ivresses, et les autres voluptés nombreuses et insensées ; car toute volupté est insensée et vaine pour les serviteurs de Dieu. 2 Ces désirs donc sont mauvais : ils font mourir les serviteurs de Dieu ; car ce désir mauvais est la fille du diable. Il faut donc s’abstenir des désirs mauvais, afin que, vous en étant abstenus, vous viviez pour Dieu. 3 Mais tous ceux qui seront dominés par eux et ne leur résisteront pas mourront pour toujours ; car ces désirs sont mortels. 4 Toi, revêts-toi du désir de la justice, et, cuirassé de la crainte du Seigneur, résiste-leur ; car la crainte de Dieu habite dans le désir bon. Le désir mauvais, s’il te voit cuirassé de la crainte de Dieu et lui résistant, fuira loin de toi, et il ne t’apparaîtra plus, craignant tes armes. 5 Toi donc, vainqueur et couronné, viens auprès du désir de la justice, et, t’étant livré à lui, fais ce qu’il veut. Si tu sers le désir bon et te soumets à lui, tu pourras dominer le désir mauvais et le soumettre, comme tu voudras. »</p>
      <h3>46</h3>
      <p>1 Je dis : « Je voulais savoir, Seigneur, de quelle manière je dois servir le désir bon. » Il dit : « La vertu, la vérité et la crainte du Seigneur, la foi, la douceur, et tout ce qui leur ressemble de bon : en pratiquant ces choses, tu seras un serviteur agréable à Dieu et tu vivras pour lui. Et quiconque servira le désir bon vivra pour Dieu. » 2 Il acheva donc ces préceptes : « Marche en eux et exhorte ceux qui les entendent, afin que leur pénitence soit pure les jours qui restent de leur vie. 3 Ce ministère que je te donne, accomplis-le avec soin, et tu accompliras beaucoup ; car tu trouveras grâce auprès de ceux qui vont faire pénitence, et ils croiront à tes paroles ; car je serai avec toi et je les forcerai à te croire. » 4 Je lui dis : « Seigneur, ces préceptes sont grands, beaux et glorieux, et ils peuvent réjouir le cœur d’un homme capable de les garder. Mais je ne sais si ces préceptes peuvent être gardés par un homme, car ils sont très durs. » 5 Répondant, il me dit : « Si tu admets d’emblée qu’ils peuvent être gardés, tu les garderas facilement et ils ne seront pas durs ; mais si déjà il monte à ton cœur que tu ne peux pas, que ces préceptes ne peuvent être gardés par un homme, tu ne les garderas pas. 6 Mais maintenant je te le dis : si tu ne les gardes pas, mais que tu les négliges, tu n’auras pas le salut, ni tes enfants, ni ta maison ; puisque déjà tu as jugé toi-même que ces préceptes ne peuvent être gardés par un homme. »</p>
      <h3>47</h3>
      <p>1 Et il me dit cela avec une si grande colère que j’en fus bouleversé et que je le craignis extrêmement ; car sa figure fut changée, au point qu’un homme ne pouvait supporter sa colère. 2 Me voyant tout troublé et bouleversé, il se mit à me parler avec plus de douceur et de sérénité, et il dit : « Insensé, sans intelligence et à l’âme double, ne comprends-tu pas la gloire de Dieu, combien elle est grande, forte et admirable, puisqu’il a créé le monde pour l’homme et lui a donné tout pouvoir de dominer sur toutes choses sous le ciel ? 3 Si donc, dit-il, l’homme est le seigneur de toutes les créatures de Dieu et les domine toutes, ne peut-il pas aussi dominer ces préceptes ? Il le peut, dit-il : l’homme qui a le Seigneur dans son cœur peut dominer toutes choses et tous ces préceptes. 4 Mais ceux qui ont le Seigneur sur les lèvres, tandis que leur cœur est endurci et qu’ils sont loin du Seigneur, pour ceux-là ces préceptes sont durs et impraticables. 5 Vous donc, qui êtes vides et légers dans la foi, mettez le Seigneur dans votre cœur, et vous connaîtrez que rien n’est plus facile. 6 Convertissez-vous, vous qui marchez dans les préceptes du diable, préceptes difficiles, amers, sauvages et impudiques, et ne craignez pas le diable, car il n’y a en lui aucune puissance contre vous ; 7 car je serai avec vous, moi, l’ange de la pénitence, qui le domine. Le diable ne peut qu’effrayer, et sa peur n’a pas de vigueur. Ne le craignez donc pas, et il fuira loin de vous. »</p>
      <h3>48</h3>
      <p>1 Je lui dis : « Seigneur, écoute-moi quelques mots. » Il dit : « Parle, ce que tu veux. » Je dis : « L’homme, Seigneur, est plein de bonne volonté pour garder les préceptes de Dieu, et il n’est personne qui ne demande au Seigneur d’être fortifié dans ses préceptes et de leur être soumis ; mais le diable est dur et il tyrannise les hommes. » 2 Il dit : « Il ne peut dominer les serviteurs de Dieu qui, du fond du cœur, luttent contre lui : il a la force de lutter, mais non celle de terrasser. Si donc vous lui résistez, vaincu, il fuira loin de vous, couvert de honte. Mais tous ceux qui sont vides, dit-il, craignent le diable comme s’il avait de la puissance. 3 Quand un homme a rempli de bon vin un grand nombre de jarres, et que parmi ces jarres quelques-unes sont un peu vides, il vient vers les jarres et ne s’occupe pas des pleines, car il sait qu’elles sont pleines ; il s’occupe des vides, craignant qu’elles ne s’aigrissent ; car vite les jarres vides s’aigrissent, et l’agrément du vin se perd. 4 Ainsi le diable vient aussi vers tous les serviteurs de Dieu pour les éprouver. Tous ceux donc qui sont pleins dans la foi lui résistent avec force, et lui se retire d’auprès d’eux, n’ayant pas de lieu où entrer. Il vient alors vers ceux qui sont vides, et, trouvant place, il entre en eux ; il fait en eux ce qu’il veut, et ils deviennent ses esclaves. »</p>
      <h3>49</h3>
      <p>1 « Et moi, je vous le dis, moi, l’ange de la pénitence : ne craignez pas le diable. Car j’ai été envoyé, dit-il, pour être avec vous qui faites pénitence du fond de votre cœur, et pour vous fortifier dans la foi. 2 Ayez donc foi en Dieu, vous qui, à cause de vos péchés, avez désespéré de votre vie, qui ajoutez à vos péchés et alourdissez votre vie : si vous vous tournez vers le Seigneur du fond de votre cœur, si vous pratiquez la justice les jours qui restent de votre vie et si vous le servez droitement selon sa volonté, il guérira vos péchés passés, et vous aurez la force de dominer les œuvres du diable. La menace du diable, ne la craignez pas du tout : car elle est sans force, comme les nerfs d’un mort. 3 Écoutez-moi donc et craignez celui qui peut tout, sauver et perdre, et gardez ces préceptes, et vous vivrez pour Dieu. » 4 Je lui dis : « Seigneur, maintenant j’ai été fortifié dans tous les commandements du Seigneur, parce que tu es avec moi ; et je sais que tu briseras toute la puissance du diable, et que nous le dominerons et que nous l’emporterons sur toutes ses œuvres. Et j’espère, Seigneur, pouvoir garder ces préceptes que tu m’as ordonnés, le Seigneur me fortifiant. » 5 Il dit : « Tu les garderas si ton cœur devient pur envers le Seigneur ; et tous les garderont, ceux qui purifieront leur cœur des désirs vains de ce siècle, et ils vivront pour Dieu. »</p><h2>Similitude I</h2>
      <h3>50</h3>
      <p>1 Il me dit : « Vous savez, dit-il, que vous habitez sur une terre étrangère, vous les serviteurs de Dieu ; car votre cité est loin de celle-ci. Si donc, dit-il, vous connaissez votre cité, celle que vous devez habiter, pourquoi préparez-vous ici des champs, des installations somptueuses, des édifices et des demeures vaines ? 2 Celui donc qui prépare ces choses pour cette cité-ci ne peut retourner dans sa propre cité. 3 Insensé, homme à l’âme double et malheureux, ne comprends-tu pas que tout cela est étranger et au pouvoir d’un autre ? Car le maître de cette cité dira : “Je ne veux pas que tu habites dans ma cité, mais sors de cette cité, puisque tu n’uses pas de mes lois.” 4 Toi donc, qui as des champs, des maisons et beaucoup d’autres biens, chassé par lui, que feras-tu de ton champ, de ta maison et de tout le reste que tu t’es préparé ? Car le maître de ce pays te dit justement : “Ou bien observes mes lois, ou bien sors de mon pays.” 5 Que vas-tu donc faire, toi qui as une loi dans ta propre cité ? À cause de tes champs et du reste de tes biens, vas-tu renier entièrement ta loi et marcher selon la loi de cette cité ? Prends garde : il n’est pas avantageux de renier ta loi ; car si tu veux retourner dans ta cité, tu ne seras pas reçu, parce que tu as renié la loi de ta cité, et tu en seras exclu. 6 Veille donc, toi : habitant comme en terre étrangère, ne te prépare rien de plus que le nécessaire qui te suffit, et sois prêt, afin que, lorsque le maître de cette cité voudra te chasser parce que tu t’opposes à sa loi, tu sortes de sa cité, que tu ailles dans ta cité et que tu uses de ta loi sans outrage, dans l’allégresse. 7 Veillez donc, vous qui servez le Seigneur et l’avez dans le cœur : faites les œuvres de Dieu, vous souvenant de ses commandements et des promesses qu’il a faites, et croyez qu’il les accomplira, si ses commandements sont gardés. 8 Au lieu de champs, achetez donc des âmes, visitez les orphelins et ne les méprisez pas, et dépensez votre richesse et toutes vos installations en de tels champs et de telles maisons, que vous avez reçues de Dieu. 9 Car le Maître vous a enrichis pour que vous lui rendiez ces services. Il vaut beaucoup mieux acheter de tels champs, des domaines et des maisons, que tu retrouveras dans ta cité lorsque tu y seras arrivé. 10 Cette richesse-là est belle et sainte, n’ayant ni tristesse ni crainte, mais la joie. Ne pratiquez donc pas la richesse des païens ; car elle est nuisible à vous, les serviteurs de Dieu. 11 Pratiquez votre richesse propre ; ne touchez pas au bien d’autrui, ne le désirez pas ; car il est mauvais de désirer les biens d’autrui. Mais fais ton œuvre, et tu seras sauvé. »</p><h2>Similitude II</h2>
      <h3>51</h3>
      <p>1 Comme je me promenais dans mon champ, considérant un ormeau et une vigne et délibérant au sujet de l’ormeau et de la vigne, il me dit : « Que délibères-tu en toi-même touchant l’ormeau et la vigne ? » Je dis : « Je délibère, Seigneur, qu’ils se conviennent parfaitement l’un à l’autre. » 2 « Ces deux arbres, dit-il, sont posés comme figure pour les serviteurs de Dieu. » Je dis : « Je voudrais connaître la figure de ces arbres dont tu parles. » Il dit : « Vois-tu l’ormeau et la vigne ? » Je dis : « Je les vois, Seigneur. » 3 « Cette vigne, dit-il, porte du fruit, mais l’ormeau est un bois stérile ; or cette vigne, si elle ne monte pas sur l’ormeau, ne peut porter beaucoup de fruit, jetée à terre, et le fruit qu’elle porte, elle le porte gâté, n’étant pas suspendue à l’ormeau. Quand donc la vigne s’attache à l’ormeau, elle porte du fruit et par elle-même et par l’ormeau. 4 Tu vois donc que l’ormeau aussi donne beaucoup de fruit, non moins que la vigne, et même davantage. » Je dis : « Comment, Seigneur, davantage ? » Il dit : « Parce que la vigne, suspendue à l’ormeau, donne un fruit abondant et beau, tandis que, jetée à terre, elle en porte peu et pourri. Cette parabole donc s’applique aux serviteurs de Dieu, au pauvre et au riche. » 5 Je dis : « Comment, Seigneur ? Fais-le-moi connaître. » Il dit : « Écoute. Le riche a des biens, mais il est pauvre à l’égard du Seigneur, absorbé qu’il est par sa richesse ; sa prière et sa confession envers le Seigneur sont très petites, et celle qu’il fait est faible, petite et sans aucune force. Quand donc le riche s’attache au pauvre et lui fournit ce qui lui est nécessaire, il croit que, s’il travaille pour le pauvre, il pourra trouver son salaire auprès de Dieu ; car le pauvre est riche en prière et en confession, et sa prière a une grande force auprès de Dieu. Le riche donc fournit au pauvre toutes choses sans hésiter. 6 Et le pauvre, secouru par le riche, prie Dieu et lui rend grâces pour celui qui lui donne ; et celui-ci s’empresse encore à l’égard du pauvre, afin qu’il persévère sans relâche sa vie durant ; car il sait que la prière du pauvre est bien accueillie et riche devant le Seigneur. 7 Tous deux donc accomplissent l’œuvre : le pauvre travaille par la prière, en laquelle il est riche et qu’il a reçue du Seigneur ; il la rend au Seigneur qui le secourt ; et le riche de même, la richesse qu’il a reçue du Seigneur, il la donne au pauvre sans hésiter. Et c’est là une œuvre grande et agréée devant Dieu, parce qu’il a compris ce qu’est sa richesse, qu’il a travaillé pour le pauvre avec les dons du Seigneur et qu’il a accompli droitement son ministère. 8 Aux yeux des hommes, l’ormeau paraît ne pas porter de fruit, et ils ne savent ni ne comprennent que, lorsque la sécheresse survient, l’ormeau, qui a de l’eau, nourrit la vigne, et que la vigne, ayant une eau continuelle, rend le double de fruit, et cela pour l’ormeau aussi. Ainsi les pauvres, en priant le Seigneur pour les riches, donnent plénitude à leurs richesses, et de nouveau les riches, en fournissant aux pauvres ce qui leur est nécessaire, donnent plénitude à leurs prières. 9 Ainsi donc tous deux deviennent participants de l’œuvre juste. Celui qui fait ces choses ne sera pas abandonné de Dieu, mais il sera inscrit dans les livres des vivants. 10 Heureux ceux qui possèdent et qui comprennent que c’est du Seigneur qu’ils sont enrichis ; car celui qui comprend cela pourra aussi faire quelque bien. »</p><h2>Similitude III</h2>
      <h3>52</h3>
      <p>1 Il me montra beaucoup d’arbres qui n’avaient pas de feuilles ; mais ils me paraissaient comme secs, car ils étaient tous semblables. Et il me dit : « Vois-tu ces arbres ? » Je dis : « Je les vois, Seigneur, semblables et secs. » Répondant, il me dit : « Ces arbres que tu vois, ce sont les habitants de ce siècle-ci. » 2 Je dis : « Pourquoi donc, Seigneur, sont-ils comme secs et semblables ? » Il dit : « Parce que ni les justes ni les pécheurs ne se manifestent dans ce siècle-ci, mais ils sont semblables ; car ce siècle-ci est un hiver pour les justes, et ils ne se distinguent pas, puisqu’ils habitent avec les pécheurs. 3 Car de même qu’en hiver les arbres, dépouillés de leurs feuilles, sont semblables, et qu’on ne voit pas lesquels sont secs et lesquels vivants, ainsi dans ce siècle-ci ne se distinguent ni les justes ni les pécheurs, mais tous sont semblables. »</p><h2>Similitude IV</h2>
      <h3>53</h3>
      <p>1 Il me montra de nouveau beaucoup d’arbres, les uns verdoyants, les autres secs, et il me dit : « Vois-tu ces arbres ? » Je dis : « Je les vois, Seigneur : les uns verdoyants, les autres secs. » 2 Il dit : « Ces arbres verdoyants, ce sont les justes qui habiteront dans le siècle qui vient ; car le siècle qui vient est un été pour les justes, et un hiver pour les pécheurs. Quand donc brillera la miséricorde du Seigneur, alors ils seront manifestés. 3 Car de même qu’en été les fruits de chaque arbre se manifestent et qu’on reconnaît ce qu’ils sont, ainsi seront-ils reconnus, tous florissants, dans ce siècle-là. 4 Mais les païens et les pécheurs, ces arbres secs que tu as vus, seront trouvés tels : secs et stériles en ce siècle-là, et ils seront brûlés comme du bois, et il sera manifeste que leur conduite a été mauvaise dans leur vie. Car les pécheurs seront brûlés, parce qu’ils ont péché et n’ont pas fait pénitence ; et les païens seront brûlés, parce qu’ils n’ont pas connu leur Créateur. 5 Toi donc, porte du fruit, afin qu’en cet été-là ton fruit soit connu. Écarte-toi des affaires nombreuses, et tu ne pécheras en rien ; car ceux qui s’occupent de beaucoup de choses commettent aussi beaucoup de péchés, absorbés par leurs affaires et ne servant en rien leur Seigneur. 6 Comment donc, dit-il, un tel homme pourrait-il demander quelque chose au Seigneur et le recevoir, s’il ne sert pas le Seigneur ? Ceux-là ne recevront rien. 7 Mais si quelqu’un ne s’occupe que d’une seule affaire, il peut aussi servir le Seigneur ; car son esprit ne se corrompra pas loin du Seigneur, mais il le servira, ayant son esprit pur. 8 Si donc tu fais ces choses, tu pourras porter du fruit dans le siècle qui vient ; et quiconque fera ces choses portera du fruit. »</p><h2>Similitude V</h2>
      <h3>54</h3>
      <p>1 Je jeûnais et, assis en un certain lieu, je rendais grâces au Seigneur pour tout ce qu’il avait fait pour moi ; je vois le Pasteur assis près de moi, qui me dit : « Pourquoi es-tu venu ici dès l’aube ? » « C’est que, dis-je, Seigneur, j’ai une station. » 2 « Qu’est-ce, dit-il, qu’une station ? Et ce jeûne, dit-il, qu’est-ce que celui que vous observez ? » « Je jeûne, dis-je, Seigneur, comme j’en ai l’habitude. » 3 « Vous ne savez pas, dit-il, jeûner pour le Seigneur, et ce jeûne que vous observez pour lui n’en est pas un : il est inutile. » « Pourquoi, dis-je, Seigneur, dis-tu cela ? » « Je te dis, dit-il, que ce n’est pas là un jeûne agréable et parfait pour le Seigneur. Écoute, dit-il. 4 Dieu ne veut pas d’un tel jeûne, vain ; car en jeûnant ainsi pour Dieu, tu ne fais rien pour ta vie. Mais sers le Seigneur d’un cœur pur ; observe ses commandements en marchant dans ses préceptes, et qu’aucun désir mauvais ne monte dans ton cœur ; aie foi en Dieu : si tu fais ces choses, si tu le crains et si tu t’abstiens de toute chose mauvaise, tu vivras pour Dieu ; et si tu fais ces choses, tu accompliras un grand jeûne, agréable à Dieu. »</p>
      <h3>55</h3>
      <p>1 « Écoute la parabole que je vais te dire, celle qui concerne le jeûne. 2 Quelqu’un avait un champ et beaucoup d’esclaves ; dans une partie du champ il planta une vigne ; et, ayant choisi un esclave fidèle, agréable et honorable, il l’appela et lui dit : « Prends cette vigne que j’ai plantée, entoure-la d’une clôture jusqu’à ce que je vienne ; garde cet ordre de moi, et tu seras libre chez moi. » Et le Maître de l’esclave partit pour l’étranger. 3 Celui-ci parti, l’esclave prit la vigne et l’entoura d’une clôture. Et, ayant achevé la clôture de la vigne, il vit que la vigne était pleine d’herbes. 4 Il réfléchit donc en lui-même et se dit : « J’ai accompli cet ordre du Maître ; je bêcherai désormais cette vigne, et elle sera plus belle, bêchée, et, n’ayant plus d’herbes, elle donnera plus de fruit, n’étant plus étouffée par les herbes. » Alors il bêcha la vigne et arracha les herbes. Et cette vigne devint très belle et florissante, n’ayant plus d’herbes qui l’étouffassent. 5 Après un temps, vint le Maître de l’esclave et du champ, et il entra dans la vigne. Et, voyant la vigne clôturée avec soin, et de plus bêchée, et toutes les herbes arrachées, et les vignes florissantes, il se réjouit fort des travaux de l’esclave. 6 Ayant donc appelé son fils bien-aimé, qu’il avait pour héritier, et ses amis, qu’il avait pour conseillers, il leur dit tout ce qu’il avait ordonné à son esclave et tout ce qu’il avait trouvé accompli. Et ceux-là se réjouirent avec l’esclave du témoignage que le Maître lui rendait. 7 Et il leur dit : « J’avais promis la liberté à cet esclave, s’il gardait mon ordre, celui que je lui avais donné ; il a gardé mon ordre et il a ajouté à la vigne une belle œuvre, et cela m’a fort plu. Pour cette œuvre donc qu’il a faite, je veux le faire cohéritier de mon fils, parce qu’ayant conçu une bonne pensée, il ne s’est pas relâché, mais il l’a accomplie. » 8 Le fils du Maître approuva cette intention, que l’esclave devînt cohéritier avec le fils. 9 Peu de jours après, le Maître fit un festin et lui envoya de ses mets ; celui-ci prit ce qui lui suffisait et distribua le reste à ses compagnons d’esclavage. 10 Et ses compagnons d’esclavage, ayant reçu les mets, se réjouirent et se mirent à prier pour lui, afin qu’il trouvât une grâce plus grande auprès du Maître, parce qu’il les avait ainsi traités. 11 Le Maître entendit toutes ces choses qui s’étaient passées, et de nouveau il se réjouit fort de la conduite de son esclave. Ayant de nouveau convoqué ses amis et son fils, le Maître leur rapporta ce qu’il avait fait au sujet des mets qu’il avait reçus ; et eux approuvèrent encore davantage que l’esclave devînt cohéritier de son fils. »</p>
      <h3>56</h3>
      <p>1 Je dis : « Seigneur, moi, je ne connais pas ces paraboles et je ne puis les comprendre, si tu ne me les expliques pas. » 2 « Je t’expliquerai tout, dit-il, et tout ce que je te dirai. » 3 « Je te montrerai ses commandements. Mais si tu fais quelque bien en dehors du commandement de Dieu, tu t’acquerras une gloire plus grande et tu seras plus glorieux auprès de Dieu que tu ne l’aurais été. Si donc, gardant les commandements de Dieu, tu y ajoutes aussi ces services, tu te réjouiras, si tu les observes selon mon commandement. » 4 Je lui dis : « Seigneur, ce que tu m’ordonneras, je le garderai ; car je sais que tu es avec moi. » « Je serai, dit-il, avec toi, car tu as un tel zèle. » 5 « Ce jeûne, dit-il, si les commandements du Seigneur sont gardés, est fort beau. Voici donc comment tu observeras ce jeûne que tu vas garder : 6 avant tout, garde-toi de toute parole mauvaise et de tout désir mauvais, et purifie ton cœur de toutes les vanités de ce siècle. Si tu gardes ces choses, ce jeûne sera parfait pour toi. 7 Et voici comment tu feras : après avoir accompli ce qui est écrit, le jour où tu jeûnes, tu ne goûteras rien sinon du pain et de l’eau ; et, sur les mets que tu allais manger, ayant calculé le montant de la dépense de ce jour que tu allais faire, tu le donneras à une veuve, à un orphelin ou à un indigent ; et ainsi tu t’humilieras, afin que, par ton humilité, celui qui a reçu remplisse son âme et prie le Seigneur pour toi. 8 Si donc tu accomplis ainsi le jeûne, comme je te l’ai ordonné, ton sacrifice sera agréable à Dieu, et ce jeûne sera inscrit, et le service ainsi accompli est beau, joyeux et bien accueilli par le Seigneur. 9 Voilà ce que tu observeras, toi, avec tes enfants et toute ta maison. Et si tu observes ces choses, tu seras bienheureux ; et tous ceux qui, les ayant entendues, les observeront, seront bienheureux, et tout ce qu’ils demanderont au Seigneur, ils le recevront. »</p>
      <h3>57</h3>
      <p>1 Je le priai instamment de m’expliquer la parabole du champ, du Maître, de la vigne, de l’esclave qui avait clôturé la vigne, des pieux, des herbes arrachées de la vigne, du fils et des amis conseillers ; car j’avais compris que tout cela était une parabole. 2 Il me répondit : « Tu es bien hardi à questionner. Tu ne dois, dit-il, rien demander du tout ; car si quelque chose doit t’être montré, cela te sera montré. » Je lui dis : « Seigneur, tout ce que tu me montreras sans me l’expliquer, c’est en vain que je l’aurai vu, sans comprendre ce que c’est ; de même aussi, si tu me dis des paraboles sans me les expliquer, c’est en vain que j’aurai entendu quelque chose de toi. » 3 Et lui, de nouveau, me répondit : « Celui qui est serviteur de Dieu, dit-il, et qui a son Seigneur dans son cœur, lui demande l’intelligence, et il la reçoit, et il explique toute parabole, et les paroles du Seigneur dites en paraboles lui deviennent connues ; mais ceux qui sont mous et paresseux pour la prière, ceux-là hésitent à demander au Seigneur. 4 Et le Seigneur est plein de miséricorde, et à tous ceux qui lui demandent il donne sans cesse. Mais toi, qui as été fortifié par le saint ange, qui as reçu de lui un tel don de prière et qui n’es pas paresseux, pourquoi ne demandes-tu pas au Seigneur l’intelligence, et ne la reçois-tu pas de lui ? » 5 Je lui dis : « Seigneur, moi, t’ayant avec moi, il m’est nécessaire de te demander et de t’interroger ; car c’est toi qui me montres tout et qui me parles. Mais si, sans toi, je voyais ou j’entendais ces choses, je demanderais au Seigneur qu’il me les expliquât. »</p>
      <h3>58</h3>
      <p>1 « Je t’ai dit, dit-il, et à l’instant encore, que tu es rusé et hardi, à demander les explications des paraboles. Mais puisque tu es si persévérant, je t’expliquerai la parabole du champ et de tout le reste qui suit, afin que tu le fasses connaître à tous. Écoute maintenant, dit-il, et comprends. » 2 « Le champ, c’est ce monde-ci ; le Maître du champ, c’est celui qui a créé toutes choses, qui les a achevées et qui leur a donné la force ; l’esclave, c’est le Fils de Dieu ; les vignes, c’est ce peuple qu’il a lui-même planté. 3 Les pieux, ce sont les saints anges du Seigneur qui retiennent son peuple ; les herbes arrachées de la vigne, ce sont les iniquités des serviteurs de Dieu ; les mets qu’il lui envoya du festin, ce sont les commandements qu’il donna à son peuple par son Fils ; les amis et conseillers, ce sont les saints anges créés les premiers ; le voyage du Maître, c’est le temps qui reste jusqu’à sa venue. » 4 Je lui dis : « Seigneur, tout cela est grand et admirable, et tout est glorieux. Est-ce donc, dis-je, que j’aurais pu comprendre ces choses ? Aucun autre des hommes non plus, fût-il très intelligent, ne peut les comprendre. Encore, dis-je, Seigneur, explique-moi ce que je vais te demander. » 5 « Parle, dit-il, si tu veux quelque chose. » « Pourquoi, dis-je, Seigneur, le Fils de Dieu est-il présenté sous la forme d’un esclave dans la parabole ? »</p>
      <h3>59</h3>
      <p>1 « Écoute, dit-il : ce n’est pas sous la forme d’un esclave que se présente le Fils de Dieu, mais il se présente dans une grande puissance et une seigneurie. » « Comment, dis-je, Seigneur, ne le comprends-je pas ? » 2 « Parce que, dit-il, Dieu a planté la vigne, c’est-à-dire qu’il a créé le peuple et l’a remis à son Fils ; et le Fils a établi les anges sur eux pour les garder ; et lui-même a purifié leurs péchés, ayant beaucoup peiné et supporté bien des fatigues ; car aucune vigne ne peut être bêchée sans peine ni labeur. 3 Lui donc, ayant purifié les péchés du peuple, leur montra les sentiers de la vie, leur donnant la loi qu’il avait reçue de son Père. 4 Écoute comment le Maître a pris pour conseillers son Fils et les anges glorieux au sujet de l’héritage de l’esclave : 5 l’Esprit Saint, celui qui préexiste, celui qui a créé toute la création, a habité dans la chair ; et celle-ci, marchant dans la décence et la pureté, a bien servi l’Esprit, sans souiller l’Esprit en rien. 6 Puis donc qu’elle s’était conduite noblement et saintement, qu’elle avait peiné avec l’Esprit et coopéré en toute chose, et qu’elle s’était comportée avec force et courage, il la choisit pour associée de l’Esprit Saint ; car la conduite de cette chair a plu, parce qu’elle ne s’est pas souillée sur la terre, ayant en elle le Saint. 7 Il prit donc comme conseillers le Fils et les anges glorieux, afin que cette chair aussi, ayant servi l’Esprit sans reproche, eût un lieu de demeure et ne parût pas avoir perdu le salaire de son service ; car toute chair qui sera trouvée sans souillure et sans tache, celle en qui l’Esprit Saint a habité, recevra son salaire. 8 Tu as aussi l’explication de cette parabole. »</p>
      <h3>60</h3>
      <p>1 « Je me suis réjoui, dis-je, Seigneur, en entendant cette explication. » « Écoute maintenant, dit-il : garde ta chair pure et sans souillure, afin que l’esprit qui habite en elle lui rende témoignage et que ta chair soit justifiée. 2 Prends garde que jamais ne monte sur ton cœur cette pensée que ta chair est périssable, et que tu n’en abuses par quelque souillure. Si tu souilles ta chair, tu ne vivras pas. 3 Mais si, dis-je, Seigneur, il y a eu une ignorance antérieure, avant que ces paroles fussent entendues, comment sera sauvé l’homme qui a souillé sa chair ? » « Pour les ignorances antérieures, dit-il, à Dieu seul il est possible de donner la guérison, car toute puissance est à lui, 4 pourvu que désormais tu ne souilles pas ta chair ni l’esprit ; car tous deux sont solidaires, et l’un ne peut être souillé sans l’autre. Garde-les donc purs tous les deux, et tu vivras pour Dieu. »</p><h2>Similitude VI</h2>
      <h3>61</h3>
      <p>1 Assis dans ma maison, je glorifiais le Seigneur pour tout ce que j’avais vu, et je m’entretenais des préceptes, disant qu’ils sont beaux, puissants, joyeux, glorieux et capables de sauver l’âme d’un homme ; et je disais en moi-même : « Heureux serai-je si je marche selon ces préceptes, et quiconque y marchera sera heureux. » 2 Comme je parlais ainsi en moi-même, je le vois soudain assis auprès de moi et me disant ces paroles : « Pourquoi as-tu le double esprit au sujet des préceptes que je t’ai donnés ? Ils sont beaux ; n’aie pas du tout le double esprit, mais revêts-toi de la foi du Seigneur, et tu marcheras en eux ; car moi, je t’affermirai en eux. » 3 Ces préceptes sont utiles à ceux qui vont faire pénitence ; car s’ils ne marchent pas en eux, leur pénitence est vaine. 4 Vous donc qui faites pénitence, rejetez les méchancetés de ce siècle qui vous consument ; mais, revêtus de toute la vertu de justice, vous pourrez garder ces préceptes et ne plus rien ajouter à vos péchés. Marchez donc selon mes préceptes, et vous vivrez pour Dieu. Tout cela vous a été dit par moi. 5 Et après qu’il m’eut ainsi parlé, il me dit : « Allons aux champs, et je te montrerai les pasteurs des brebis. » Je dis : « Allons, Seigneur. » Et nous arrivâmes à une plaine ; et il me montre un jeune berger vêtu d’un habit de couleur safran. 6 Il y paissait un très grand nombre de brebis, et ces brebis semblaient vivre dans la volupté et se livraient à une grande mollesse ; et le berger lui-même était tout joyeux de son troupeau ; et la figure même du berger était fort joyeuse, et il courait parmi les brebis.</p>
      <h3>62</h3>
      <p>1 Et il me dit : « Vois-tu ce berger ? » Je dis : « Je le vois, Seigneur. » Il dit : « Celui-ci est l’ange de la volupté et de la tromperie. Il consume les âmes des serviteurs de Dieu et les détourne de la vérité, les trompant par les désirs mauvais, dans lesquels ils périssent. 2 Car ils oublient les préceptes du Dieu vivant et marchent dans les tromperies et les voluptés vaines, et ils périssent par cet ange, les uns pour la mort, les autres pour la corruption. » 3 Je lui dis : « Seigneur, moi je ne sais pas ce qui est pour la mort et ce qui est pour la corruption. » Il dit : « Écoute : les brebis que tu as vues joyeuses et bondissantes, ce sont ceux qui se sont détachés de Dieu pour toujours et se sont livrés aux désirs de ce siècle. En ceux-là donc il n’y a pas de pénitence qui donne la vie, parce qu’ils ont ajouté à leurs péchés et blasphémé le nom de Dieu. Pour ceux-là donc, c’est la mort. 4 Mais les brebis que tu as vues sans bondir et paissant en un seul lieu, ce sont ceux qui se sont livrés aux voluptés et aux tromperies, mais qui n’ont rien blasphémé contre le Seigneur ; ceux-là donc sont corrompus, loin de la vérité. En eux il y a espoir de pénitence, par laquelle ils peuvent vivre. La corruption a donc espoir de quelque renouvellement, mais la mort a la perdition éternelle. » 5 J’avançai encore un peu, et il me montre un grand berger, sauvage d’aspect, revêtu d’une peau de chèvre blanche ; il avait une besace sur les épaules, un bâton très dur, tout plein de nœuds, et un grand fouet ; et son regard était amer, au point que je le craignis : tel était son regard. 6 Ce berger donc recevait les brebis du jeune berger, celles qui vivaient dans la mollesse et les voluptés, mais sans bondir, et il les jeta dans un lieu escarpé, couvert d’épines et de chardons, en sorte que, à cause des épines et des chardons, les brebis ne pouvaient se dégager, mais s’y empêtraient. 7 Ces brebis donc, empêtrées, paissaient parmi les épines et les chardons, et elles souffraient beaucoup, battues par lui ; et il les chassait çà et là, et il ne leur donnait aucun repos, et ces brebis ne pouvaient se tenir en place.</p>
      <h3>63</h3>
      <p>1 Voyant donc ces brebis ainsi fouettées et malmenées, je m’affligeais à leur sujet, parce qu’elles étaient ainsi tourmentées et n’avaient aucun répit. 2 Je dis au Pasteur qui parlait avec moi : « Seigneur, qui est ce berger, si sans entrailles, si amer, et qui n’a absolument pas pitié de ces brebis ? » Il dit : « Celui-ci est l’ange du châtiment ; il est du nombre des anges justes, mais préposé au châtiment. 3 Il prend donc ceux qui se sont égarés loin de Dieu et qui ont marché selon leurs désirs, et il les châtie de châtiments divers. » 4 Je dis : « Je voudrais, Seigneur, savoir de quelle sorte sont ces châtiments divers. » Il dit : « Écoute les tourments et les châtiments divers. Les tourments sont de cette vie : car ils sont châtiés, les uns par des pertes, les autres par toute sorte de désordre, d’autres sont outragés par des indignes et souffrent en beaucoup d’autres circonstances. 5 Car beaucoup, instables dans leurs desseins, entreprennent beaucoup de choses, et rien absolument ne leur réussit. Et ils disent qu’ils ne prospèrent pas dans leurs actions ; il ne leur monte pas au cœur que ce sont des œuvres mauvaises qu’ils ont faites, mais ils accusent le Seigneur. 6 Quand donc ils sont accablés de toute affliction, alors ils me sont livrés pour une bonne instruction, et ils sont affermis dans la foi du Seigneur, et les jours qui restent de leur vie, ils servent le Seigneur d’un cœur pur. Mais s’ils font pénitence, alors montent à leur cœur les œuvres mauvaises qu’ils ont faites ; et alors ils glorifient Dieu, disant qu’il est un juge juste et que chacun a justement souffert selon ses actions. Et désormais ils servent le Seigneur d’un cœur pur et prospèrent en toute action, recevant du Seigneur tout ce qu’ils demandent ; et alors ils glorifient le Seigneur de ce qu’ils m’ont été livrés, et ils ne souffrent plus rien de mauvais. »</p>
      <h3>64</h3>
      <p>1 Je lui dis : « Seigneur, montre-moi encore ceci. » Il dit : « Que cherches-tu ? » Je dis : « Est-ce que, Seigneur, ceux qui vivent dans la volupté et la tromperie sont tourmentés autant de temps qu’ils ont vécu dans la volupté et la tromperie ? » Il me dit : « Ils sont tourmentés le même temps. » 2 Je dis : « Ils sont tourmentés bien peu, Seigneur ; car il faudrait que ceux qui vivent ainsi dans la volupté et oublient Dieu fussent tourmentés sept fois plus. » 3 Il me dit : « Tu es insensé, et tu ne comprends pas la force du tourment. » Je dis : « Si je comprenais, Seigneur, je ne te demanderais pas de me l’expliquer. » Il dit : « Écoute la force des deux. 4 Le temps de la volupté et de la tromperie est une heure ; mais l’heure du tourment a la force de trente jours. Si donc quelqu’un passe un jour dans la volupté et la tromperie, et un jour dans le tourment, le jour du tourment vaut une année entière. Autant de jours donc quelqu’un vit dans la volupté, autant d’années il est tourmenté. Tu vois donc, dit-il, que le temps de la volupté et de la tromperie est très court, et que celui du châtiment et du tourment est long. »</p>
      <h3>65</h3>
      <p>1 Je dis : « Je n’ai pas encore compris, Seigneur, tout ce qui concerne le temps de la tromperie, de la volupté et du tourment : montre-le-moi plus clairement. » 2 Répondant, il me dit : « Ta folie est obstinée, et tu ne veux pas purifier ton cœur et servir Dieu. Prends garde, dit-il, que le temps ne soit accompli et que tu ne sois trouvé insensé. Écoute donc, dit-il, puisque tu le veux, afin que tu comprennes ces choses. 3 Celui qui vit un jour dans la volupté et la tromperie et fait ce qu’il veut s’est revêtu d’une grande folie et ne comprend pas l’action qu’il fait ; car le lendemain il oublie ce qu’il a fait la veille. Car la volupté et la tromperie n’ont pas de mémoire, à cause de la folie dont elles sont revêtues ; mais le châtiment et le tourment, quand ils se sont attachés à un homme, ne fût-ce qu’un jour, le châtient et le tourmentent jusqu’à une année entière ; car le châtiment et le tourment ont une grande mémoire. 4 Tourmenté donc et châtié une année entière, il se souvient alors de la volupté et de la tromperie, et il reconnaît que c’est à cause d’elles qu’il souffre ces maux. Tout homme donc qui vit dans la volupté et la tromperie est ainsi tourmenté, parce que, possédant la vie, ils se sont livrés à la mort. » 5 Je dis : « Quelles sont, Seigneur, les voluptés nuisibles ? » Il dit : « Toute action est volupté pour l’homme, s’il la fait avec plaisir ; car le coléreux aussi, en satisfaisant sa passion, vit dans la volupté ; et l’adultère, l’ivrogne, le médisant, le menteur, le cupide, le spoliateur, et celui qui fait de semblables choses, en satisfaisant sa propre maladie, vit dans la volupté : il vit donc dans la volupté par son action. 6 Toutes ces voluptés sont nuisibles aux serviteurs de Dieu. C’est donc à cause de ces tromperies que souffrent ceux qui sont châtiés et tourmentés. 7 Mais il y a aussi des voluptés qui sauvent les hommes : car beaucoup, faisant le bien, vivent dans la volupté, emportés par leur propre plaisir. Cette volupté donc est utile aux serviteurs de Dieu, et elle procure la vie à un tel homme ; mais les voluptés nuisibles dont il a été parlé leur procurent des tourments et des châtiments ; et s’ils y persistent et ne font pas pénitence, ils s’attirent la mort. »</p><h2>Similitude VII</h2>
      <h3>66</h3>
      <p>1 Peu de jours après, je le vis dans la même plaine où j’avais aussi vu les bergers, et il me dit : « Que cherches-tu ? » Je dis : « Me voici, Seigneur, pour que tu ordonnes au berger qui châtie de sortir de ma maison, car il m’accable beaucoup. » Il dit : « Il faut que tu sois accablé ; car ainsi, dit-il, l’ange glorieux l’a ordonné à ton sujet : il veut que tu sois éprouvé. » Je dis : « Qu’ai-je donc fait, Seigneur, de si mauvais, pour être livré à cet ange ? » 2 Il dit : « Écoute : tes péchés sont nombreux, mais ils ne sont pas assez grands pour que tu sois livré à cet ange ; mais ta maison a commis de grandes iniquités et de grands péchés, et l’ange glorieux s’est aigri de leurs œuvres, et c’est pour cela qu’il a ordonné que tu sois accablé pendant un temps, afin qu’eux aussi fassent pénitence et se purifient de tout désir de ce siècle. Quand donc ils auront fait pénitence et se seront purifiés, alors l’ange du châtiment s’éloignera de toi. » 3 Je lui dis : « Seigneur, si ceux-là ont fait de telles choses, au point que l’ange glorieux s’est aigri, qu’ai-je fait, moi ? » Il dit : « Autrement, ils ne peuvent être accablés, si toi, la tête de la maison, tu ne l’es pas ; car si tu es accablé, eux aussi, nécessairement, seront accablés ; et si tu es dans la prospérité, ils ne peuvent avoir aucune tribulation. » 4 Je dis : « Mais voici, Seigneur, qu’ils ont fait pénitence de tout leur cœur. » Il dit : « Je le sais, moi aussi, qu’ils ont fait pénitence de tout leur cœur. Penses-tu donc que les péchés de ceux qui font pénitence soient aussitôt remis ? Non pas entièrement : il faut que celui qui fait pénitence éprouve son âme, s’humilie fortement dans toute sa conduite et soit accablé de tribulations diverses ; et s’il supporte les tribulations qui lui surviennent, celui qui a créé et affermi toutes choses aura compassion de lui et lui donnera quelque guérison ; 5 et cela entièrement, s’il voit le cœur de celui qui fait pénitence pur de toute action mauvaise. Or il t’est utile, à toi et à ta maison, d’être maintenant accablés. Mais pourquoi te parler longuement ? Il faut que tu sois accablé, comme l’a ordonné cet ange du Seigneur qui t’a remis entre mes mains ; et rends grâces au Seigneur de ce qu’il t’a jugé digne de te faire connaître d’avance la tribulation, afin que, la connaissant d’avance, tu la supportes avec force. » 6 Je lui dis : « Seigneur, sois avec moi, et je pourrai supporter toute tribulation. » Il dit : « Je serai avec toi ; et je demanderai aussi à l’ange du châtiment qu’il t’accable plus légèrement ; mais tu seras accablé peu de temps, et de nouveau tu seras rétabli dans ta maison. Seulement, persévère à t’humilier et à servir le Seigneur d’un cœur tout pur, toi, tes enfants et ta maison, et marche dans les préceptes que je te donne, et ta pénitence pourra être forte et pure ; 7 et si tu les observes avec ta maison, toute tribulation s’éloignera de toi ; et de tous ceux qui marcheront dans ces préceptes, dit-il, la tribulation s’éloignera. »</p><h2>Similitude VIII</h2>
      <h3>67</h3>
      <p>1 Il me montra un grand saule qui couvrait des plaines et des montagnes, et tous ceux qui sont appelés du nom du Seigneur étaient venus sous l’abri du saule. 2 Or se tenait auprès du saule un ange du Seigneur, très glorieux et d’une taille très élevée, tenant une grande faucille ; il coupait des branches du saule et les donnait au peuple abrité sous le saule ; il leur donnait de petites baguettes, longues d’environ une coudée. 3 Après que tous eurent reçu les baguettes, l’ange déposa la faucille, et cet arbre était sain, tel que je l’avais vu. 4 Je m’étonnais en moi-même, disant : « Comment se fait-il que, tant de branches ayant été coupées, cet arbre soit resté sain, tant de branches ayant été coupées ? » Il dit : « Si tu vois tout, on te fera connaître ce que c’est. » 5 L’ange qui avait distribué les baguettes au peuple les redemandait ; et selon qu’ils les avaient reçues, ainsi ils étaient appelés auprès de lui, et chacun d’eux rendait les baguettes sèches et rongées comme par la teigne ; l’ange ordonna à ceux qui avaient remis de telles baguettes de se tenir à part. 7 D’autres en remettaient de sèches, mais elles n’étaient pas rongées par la teigne ; et il ordonna à ceux-là aussi de se tenir à part. 8 D’autres en remettaient de demi-sèches ; et ceux-là aussi se tenaient à part. 9 D’autres remettaient leurs baguettes demi-sèches et fendillées ; et ceux-là aussi se tenaient à part. 10 D’autres remettaient leurs baguettes vertes et fendillées ; et ceux-là aussi se tenaient à part. 11 D’autres remettaient leurs baguettes moitié sèches et moitié vertes ; et ceux-là aussi se tenaient à part. 12 D’autres apportaient leurs baguettes, dont les deux parts étaient vertes et la troisième sèche ; et ceux-là aussi se tenaient à part. 13 D’autres remettaient les deux parts sèches et la troisième verte ; et ceux-là aussi se tenaient à part. 14 D’autres remettaient leurs baguettes presque entièrement vertes, et il n’y avait qu’un tout petit bout de sec, la pointe même ; mais elles avaient des fentes ; et ceux-là aussi se tenaient à part. 15 Chez d’autres, il y avait un tout petit bout de vert, et le reste des baguettes était sec ; et ceux-là aussi se tenaient à part. 16 D’autres venaient, portant les baguettes vertes telles qu’ils les avaient reçues de l’ange ; et la plus grande partie de la foule remettait de telles baguettes. L’ange s’en réjouit fort ; et ceux-là aussi se tenaient à part. 17 D’autres remettaient leurs baguettes vertes et portant des rejetons ; et ceux-là aussi se tenaient à part ; et de ceux-là l’ange se réjouit fort. 18 D’autres remettaient leurs baguettes vertes et portant des rejetons ; et leurs rejetons portaient comme un fruit ; et ces hommes-là, dont les baguettes se trouvèrent telles, étaient tout joyeux. Et l’ange exultait à leur sujet, et le Pasteur était tout joyeux à leur sujet.</p>
      <h3>68</h3>
      <p>1 L’ange du Seigneur ordonna qu’on apportât des couronnes. Et l’on apporta des couronnes faites comme de palmes, et il couronna les hommes qui avaient remis les baguettes portant des rejetons et quelque fruit, et il les renvoya dans la tour. 2 Et il envoya aussi dans la tour les autres, ceux qui avaient remis les baguettes vertes portant des rejetons, mais dont les rejetons n’avaient pas de fruit, après leur avoir donné des sceaux. 3 Tous ceux qui allaient dans la tour avaient le même vêtement, blanc comme la neige. 4 Et ceux qui avaient remis les baguettes vertes telles qu’ils les avaient reçues, il les renvoya aussi, leur donnant un vêtement et des sceaux. 5 Après que l’ange eut achevé cela, il dit au Pasteur : « Moi, je m’en vais ; toi, tu renverras ceux-ci dans les murs, selon que chacun est digne d’y habiter. Examine avec soin leurs baguettes, et renvoie-les ainsi ; examine avec soin. Prends garde que personne ne t’échappe, dit-il ; et si quelqu’un t’échappe, je les éprouverai moi-même à l’autel. » Ayant dit cela au Pasteur, il s’en alla. 6 Et après le départ de l’ange, le Pasteur me dit : « Prenons les baguettes de tous, et plantons-les, pour voir si quelques-unes d’entre elles pourront vivre. » Je lui dis : « Seigneur, ces baguettes sèches, comment peuvent-elles vivre ? » 7 Il me répondit : « Cet arbre est un saule, et son espèce aime la vie ; si donc on les plante et que les baguettes reçoivent un peu de sève, beaucoup d’entre elles vivront ; ensuite nous essaierons aussi de leur verser de l’eau. Si l’une d’elles peut vivre, je me réjouirai avec elles ; si elle ne vit pas, je ne serai pas trouvé négligent. » 8 Le Pasteur me commanda de les appeler, selon que chacun d’eux s’était tenu. Ils vinrent troupe par troupe, et remettaient les baguettes au Pasteur ; le Pasteur prenait les baguettes et les plantait par troupes, et après les avoir plantées il leur versa beaucoup d’eau, si bien qu’à cause de l’eau on ne voyait plus les baguettes. 9 Et après avoir abreuvé les baguettes, il me dit : « Allons, et dans peu de jours revenons et visitons toutes les baguettes ; car celui qui a créé cet arbre veut que vivent tous ceux qui ont reçu des branches de cet arbre. Et moi aussi j’espère que ces baguettes, ayant reçu de la sève et ayant été abreuvées d’eau, vivront, la plus grande partie d’entre elles. »</p>
      <h3>69</h3>
      <p>1 Je lui dis : « Seigneur, fais-moi connaître ce qu’est cet arbre ; car je suis dans l’embarras à son sujet, parce que, tant de branches ayant été coupées, l’arbre est sain et rien ne paraît en avoir été coupé ; c’est en cela que je suis dans l’embarras. » 2 « Écoute, dit-il : cet arbre grand, qui couvre plaines et montagnes et toute la terre, c’est la loi de Dieu, donnée au monde entier ; et cette loi est le Fils de Dieu, proclamé jusqu’aux extrémités de la terre ; et les peuples qui sont sous l’abri, ce sont ceux qui ont entendu la proclamation et qui ont cru en lui. 3 Et l’ange grand et glorieux, Michel, celui qui a autorité sur ce peuple et qui le gouverne : c’est lui qui leur donne la loi dans le cœur des croyants ; il visite donc ceux à qui il l’a donnée, pour voir s’ils l’ont gardée. 4 Tu vois les baguettes de chacun ; car les baguettes, c’est la loi. Tu vois donc beaucoup de baguettes devenues inutiles, et tu reconnaîtras tous ceux qui n’ont pas gardé la loi ; et tu verras la demeure de chacun. » 5 Je lui dis : « Seigneur, pourquoi les uns, il les a renvoyés dans la tour, et les autres, il te les a laissés ? » « Tous ceux, dit-il, qui ont transgressé la loi qu’ils avaient reçue de lui, il les a laissés en mon pouvoir pour la pénitence ; mais tous ceux qui ont déjà plu à la loi et l’ont gardée, il les tient sous son propre pouvoir. » 6 « Quels sont donc, dis-je, Seigneur, ceux qui sont couronnés et qui vont dans la tour ? » « Tous ceux, dit-il, qui ont lutté contre le diable et l’ont vaincu, ceux-là sont couronnés : ce sont ceux qui ont remis des baguettes vertes portant des rejetons, mais sans fruit sur ces rejetons, et qui ont été affligés pour la loi sans avoir souffert la mort ni renié leur loi. 8 Mais ceux qui les ont remises vertes, telles qu’ils les avaient reçues, sont graves et justes, et ils ont beaucoup marché dans la pureté du cœur et ont gardé les préceptes du Seigneur. Tu connaîtras le reste quand j’aurai examiné ces baguettes plantées et abreuvées. »</p>
      <h3>70</h3>
      <p>1 Et peu de jours après, nous vînmes en ce lieu, et le Pasteur s’assit à la place de l’ange, et moi je me tenais auprès de lui. Et il me dit : « Ceins-toi d’un tablier de grosse toile et sers-moi. » Je me ceignis d’un tablier de grosse toile, fait d’un sac propre. 2 Me voyant ceint et prêt à le servir, il dit : « Appelle les hommes dont les baguettes ont été plantées, selon la troupe, comme chacun avait donné les baguettes. » Et j’allai dans la plaine et les appelai tous ; et tous se tinrent par troupes. 3 Il leur dit : « Que chacun arrache ses propres baguettes et les apporte devant moi. » 4 Les premiers à remettre furent ceux qui avaient eu les baguettes sèches et coupées ; et comme celles-ci se trouvèrent sèches et coupées, il leur ordonna de se tenir à part. 5 Ensuite remirent ceux qui avaient les baguettes sèches et non coupées ; quelques-uns d’entre eux remirent les baguettes vertes, d’autres des sèches et rongées comme par la teigne. Ceux donc qui avaient remis des vertes, il ordonna qu’ils se tinssent avec les premiers. 6 Ensuite remirent ceux qui avaient les demi-sèches et fendillées ; quelques-uns, des vertes portant des rejetons et, sur les rejetons, des fruits tels qu’en avaient ceux qui étaient allés dans la tour couronnés. D’autres remirent des sèches et rongées, d’autres des sèches non rongées, d’autres telles qu’elles étaient, demi-sèches et fendillées. Il ordonna qu’ils se tinssent chacun à part, les uns selon leurs propres troupes, les autres à part.</p>
      <h3>71</h3>
      <p>1 Ensuite remirent ceux qui avaient les baguettes vertes mais fendillées : tous ceux-là les remirent vertes et se tinrent dans leur propre troupe. Et le Pasteur se réjouit à leur sujet, parce que tous avaient changé et avaient déposé leurs fentes. 2 Remirent aussi ceux qui les avaient moitié vertes et moitié sèches ; chez quelques-uns, elles se trouvèrent sèches et rongées, chez d’autres vertes avec des rejetons ; tous ceux-là furent renvoyés chacun vers sa troupe. 3 Ensuite remirent ceux qui avaient les deux parts vertes et la troisième sèche. Beaucoup d’entre eux les remirent vertes, beaucoup demi-sèches, d’autres sèches et rongées ; tous ceux-là se tinrent dans leur propre troupe. 4 Ensuite remirent ceux qui avaient les deux parts sèches et la troisième verte ; beaucoup d’entre eux remirent des demi-sèches, quelques-unes des sèches et rongées, d’autres des demi-sèches et fendillées, et peu les remirent vertes ; tous ceux-là se tinrent dans leur propre troupe. 5 Remirent aussi ceux qui avaient eu leurs baguettes vertes, avec un tout petit bout de sec et des fentes ; parmi eux, quelques-uns remirent des vertes, quelques-uns des vertes avec des rejetons ; ceux-là aussi s’en allèrent dans leur troupe. 6 Ensuite remirent ceux qui avaient un tout petit bout de vert et le reste des parts sec ; leurs baguettes se trouvèrent, pour la plus grande part, vertes avec des rejetons et du fruit sur les rejetons, et d’autres toutes vertes. À ces baguettes le Pasteur se réjouit extrêmement, parce qu’elles s’étaient trouvées ainsi. Et ceux-là s’en allèrent chacun dans sa propre troupe.</p>
      <h3>72</h3>
      <p>1 Après que le Pasteur eut examiné les baguettes de tous, il me dit : « Ne t’ai-je pas dit que cet arbre est plein de vie ? Vois-tu, dit-il, combien ont fait pénitence et ont été sauvés ? » Je dis : « Je vois, Seigneur. » « Afin que tu voies, dit-il, l’abondante compassion du Seigneur, qu’elle est grande et glorieuse, et qu’il a donné un esprit à ceux qui sont dignes de la pénitence. » 2 « Pourquoi donc, dis-je, Seigneur, tous n’ont-ils pas fait pénitence ? » « Ceux dont il a vu le cœur prêt à devenir pur et à le servir de tout leur cœur, à ceux-là il a donné la pénitence ; mais ceux dont il a vu la ruse et la méchanceté, prêts à faire pénitence dans l’hypocrisie, à ceux-là il n’a pas donné la pénitence, de peur qu’ils ne profanent de nouveau son nom. » 3 Je lui dis : « Seigneur, fais-moi connaître maintenant ceux qui ont remis les baguettes, quel est chacun d’eux, et leur demeure, afin qu’ayant entendu, ceux qui ont cru et ont reçu le sceau, et qui l’ont brisé sans le garder intact, reconnaissant leurs propres œuvres, fassent pénitence, reçoivent de toi un sceau et glorifient le Seigneur, de ce qu’il a eu compassion d’eux et t’a envoyé pour renouveler leurs esprits. » 4 « Écoute, dit-il : ceux dont les baguettes se sont trouvées sèches et rongées par la teigne, ce sont les apostats et les traîtres de l’Église, et ceux qui, dans leurs péchés, ont blasphémé le Seigneur, et qui de plus ont eu honte du nom du Seigneur invoqué sur eux. Ceux-là donc ont péri pour toujours devant Dieu. Tu vois que pas un seul d’entre eux n’a fait pénitence, bien qu’ils aient entendu les paroles que tu leur as dites, celles que je t’avais ordonnées : la vie s’est retirée de tels gens. 5 Ceux qui les ont remises sèches et non corrompues, ceux-là aussi sont proches d’eux ; car ils étaient hypocrites et introduisaient des doctrines étrangères et détournaient les serviteurs de Dieu, surtout ceux qui avaient péché, ne leur permettant pas de faire pénitence. Ceux-là donc ont espoir de faire pénitence. 6 Tu vois que beaucoup d’entre eux ont fait pénitence depuis que je leur ai dit mes préceptes ; et ils en feront encore. Mais tous ceux qui ne feront pas pénitence ont perdu leur vie. Et tous ceux d’entre eux qui ont fait pénitence sont devenus bons, et leur demeure a été dans les premiers murs ; quelques-uns même sont montés dans la tour. Tu vois donc, dit-il, que la pénitence des péchés a la vie, et le fait de ne pas faire pénitence, la mort. »</p>
      <h3>73</h3>
      <p>1 « Ceux qui les ont remises demi-sèches et qui avaient en elles des fentes, écoute aussi ce qui les concerne. Ceux dont les baguettes étaient demi-sèches ont le double esprit : ils ne vivent ni ne sont morts. 2 Ceux qui les avaient demi-sèches et fendillées, ceux-là ont le double esprit et sont médisants, et jamais en paix avec eux-mêmes, mais toujours en discorde. Mais à ceux-là aussi, dit-il, la pénitence est proposée. Tu vois, dit-il, que quelques-uns d’entre eux ont fait pénitence ; ceux d’entre eux qui ont fait pénitence auront leur demeure dans la tour ; et tous ceux d’entre eux qui ont tardé à faire pénitence, s’ils demeurent dans leurs actes, mourront de mort. 4 Ceux qui ont remis leurs baguettes vertes et fendillées furent toujours fidèles et bons, mais ils avaient entre eux une certaine jalousie pour la primauté et pour une certaine gloire ; mais tous ceux-là sont insensés, ayant entre eux de la jalousie pour la primauté. 5 Mais ceux-là aussi, ayant entendu mes préceptes, comme ils étaient bons, se purifièrent et firent promptement pénitence. Leur demeure fut donc dans la tour ; mais si quelqu’un retourne de nouveau à la discorde, il sera rejeté de la tour et perdra sa vie. 6 La vie est à tous ceux qui gardent les préceptes du Seigneur ; et dans les préceptes, il n’est pas question de primauté, mais d’humilité pour l’homme. C’est donc en de tels gens qu’est la vie du Seigneur ; mais chez les factieux et les transgresseurs de la loi, la mort. »</p>
      <h3>74</h3>
      <p>1 « Ceux qui ont remis leurs baguettes moitié vertes et moitié sèches, ce sont ceux qui sont empêtrés dans les affaires et qui ne s’attachent pas aux saints ; c’est pourquoi la moitié d’eux vit, et la moitié est morte. 2 Beaucoup donc, ayant entendu mes préceptes, ont fait pénitence ; ceux-là du moins ont leur demeure dans la tour. Mais ceux qui se sont écartés pour toujours n’ont pas de pénitence ; car à cause de leurs affaires ils ont blasphémé le Seigneur et l’ont renié. Ils ont donc perdu leur vie par la méchanceté qu’ils ont pratiquée. 3 Beaucoup d’entre eux ont eu le double esprit. Ceux-là ont encore la pénitence, s’ils font promptement pénitence, et leur demeure sera dans la tour ; s’ils font pénitence plus tard, ils habiteront dans les murs ; s’ils ne font pas pénitence, eux aussi ont perdu leur vie. 4 Ceux qui ont remis les deux parts vertes et la troisième sèche, ce sont ceux qui ont renié de diverses manières. 5 Beaucoup d’entre eux ont fait pénitence et sont allés dans la tour. Beaucoup se sont écartés pour toujours de Dieu : ceux-là ont perdu la vie pour toujours. Quelques-uns d’entre eux ont eu le double esprit et se sont divisés. Ceux-là donc peuvent encore faire pénitence, s’ils font promptement pénitence et ne s’obstinent pas dans leurs plaisirs ; mais s’ils s’obstinent dans leurs actes, eux aussi se préparent la mort. »</p>
      <h3>75</h3>
      <p>1 « Ceux qui ont remis leurs baguettes deux parts sèches et la troisième verte, ce sont ceux qui ont été fidèles, mais qui se sont enrichis et sont devenus glorieux auprès des païens ; ils ont revêtu un grand orgueil et sont devenus hautains, ils ont abandonné la vérité et ne se sont pas attachés aux justes, mais ils ont vécu avec les païens, et cette voie leur est devenue plus douce ; ils ne se sont pas écartés de Dieu, mais ils sont demeurés dans la foi, sans faire les œuvres de la foi. 2 Beaucoup d’entre eux ont donc fait pénitence, et leur demeure a été dans la tour. 3 D’autres, vivant jusqu’au bout avec les païens et se corrompant aux vaines gloires des païens, furent comptés avec eux. 4 D’autres d’entre eux ont eu le double esprit, n’espérant pas être sauvés à cause des actes qu’ils ont commis ; d’autres ont eu le double esprit et ont fait des divisions entre eux. À ceux-là donc, qui ont eu le double esprit à cause de leurs actes, il y a encore une pénitence, afin que leur demeure soit dans la tour ; mais pour ceux qui ne font pas pénitence, mais s’obstinent dans les plaisirs, la mort est proche. »</p>
      <h3>76</h3>
      <p>1 « Ceux qui ont remis leurs baguettes vertes, mais dont les extrémités mêmes étaient sèches et fendillées, ceux-là furent toujours bons, fidèles et glorieux auprès de Dieu, mais ils péchèrent un tout petit peu par de petites convoitises et en ayant de petites rancunes les uns contre les autres ; mais ayant entendu mes paroles, la plus grande partie fit promptement pénitence, et leur demeure fut dans la tour. 2 Quelques-uns d’entre eux eurent le double esprit ; quelques-uns, ayant eu le double esprit, firent une discorde plus grande. En ceux-là donc il y a espoir de pénitence, parce qu’ils furent toujours bons ; mais difficilement l’un d’eux mourra. 3 Ceux qui ont remis leurs baguettes sèches, avec un tout petit peu de vert, ce sont ceux qui ont cru seulement, mais qui ont fait les œuvres de l’iniquité ; ils ne se sont jamais écartés de Dieu, et ils ont porté le nom avec joie, et dans leurs maisons ils ont reçu avec joie les serviteurs de Dieu. Ayant donc entendu cette pénitence, ils ont fait pénitence sans hésiter, et ils pratiquent toute vertu et toute justice. 4 Quelques-uns d’entre eux craignent même, connaissant les actes qu’ils ont commis. De tous ceux-là donc la demeure sera dans la tour. »</p>
      <h3>77</h3>
      <p>1 Et après qu’il eut achevé les explications de toutes les baguettes, il me dit : « Va, et dis à tous de faire pénitence, et ils vivront pour Dieu ; car le Seigneur m’a envoyé, ayant eu compassion, pour donner à tous la pénitence, bien que quelques-uns n’en soient pas dignes à cause de leurs œuvres ; mais le Seigneur, étant patient, veut que soit sauvé l’appel venu par son Fils. » 2 Je lui dis : « Seigneur, j’espère que tous, ayant entendu cela, feront pénitence ; car je suis persuadé que chacun, reconnaissant ses propres œuvres et craignant Dieu, fera pénitence. » 3 Il me répondit : « Tous ceux, dit-il, qui feront pénitence de tout leur cœur et se purifieront de leurs méchancetés et de leurs péchés, recevront du Seigneur la guérison de leurs péchés précédents, s’ils n’ont pas le double esprit à l’égard de ces préceptes, et ils vivront pour Dieu. Mais tous ceux, dit-il, qui ajouteront à leurs péchés et marcheront dans les convoitises de ce siècle, se condamneront eux-mêmes à la mort. 4 Toi donc, marche dans mes préceptes, et tu vivras pour Dieu ; et tous ceux qui y marcheront et les pratiqueront droitement vivront pour Dieu. » 5 Après m’avoir exposé cela et avoir dit toutes choses, il me dit : « Le reste, je te le montrerai dans peu de jours. »</p><h2>Similitude IX</h2>
      <h3>78</h3>
      <p>1 Après que j’eus écrit les préceptes et les similitudes du Pasteur, de l’ange de la pénitence, il vint vers moi et me dit : « Je veux te montrer tout ce que t’a montré l’Esprit Saint qui t’a parlé sous la forme de l’Église ; car cet esprit-là, c’est le Fils de Dieu. 2 Parce que tu étais plus faible dans la chair, cela ne te fut pas manifesté par un ange. Lors donc que tu fus fortifié par l’esprit et que tu eus la force de pouvoir voir même un ange, alors te fut manifestée par l’Église la construction de la tour ; tu as tout vu de belle et digne manière, comme de la part d’une vierge. Maintenant tu vois par un ange, mais par le même esprit. 3 Il faut que tu apprennes tout de moi plus exactement. C’est pour cela aussi que j’ai été donné par l’ange glorieux pour habiter dans ta maison, afin que tu voies tout avec force, sans rien craindre, et non comme auparavant. 4 Et il m’emmena en Arcadie, sur une montagne arrondie en forme de mamelle ; il me fit asseoir au sommet de la montagne et me montra une grande plaine. Autour de la plaine, douze montagnes, ayant chacune un aspect différent. 5 La première était noire comme suie ; la deuxième était nue, sans herbes ; la troisième était pleine de chardons et d’épines ; 6 la quatrième avait des herbes à demi sèches : vertes au sommet, sèches près des racines ; et quelques herbes, quand le soleil brûlait, se desséchaient ; 7 la cinquième montagne avait des herbes vertes, et elle était raboteuse. La sixième montagne était toute remplie de crevasses, les unes petites, les autres grandes ; et les crevasses avaient des herbes, mais ces herbes n’étaient pas fort florissantes : elles étaient plutôt comme flétries. 8 La septième montagne avait des herbes riantes, et toute la montagne était fertile, et toute espèce de bétail et d’oiseaux paissait sur cette montagne ; et plus les bestiaux et les oiseaux mangeaient, plus les herbes de cette montagne verdissaient. La huitième montagne était pleine de sources, et toute espèce de la création du Seigneur buvait aux sources de cette montagne. 9 La neuvième n’avait absolument pas d’eau et était tout entière déserte ; elle avait en elle des bêtes et des reptiles qui font périr les hommes. La dixième montagne avait des arbres très grands et était toute ombragée ; et sous l’ombre des arbres des brebis étaient couchées, se reposant et ruminant. 10 La onzième montagne était fort boisée, et ces arbres étaient chargés de fruits, ornés de fruits divers et variés, en sorte qu’à les voir on désirât manger de leurs fruits. La douzième montagne était toute blanche, et son aspect était riant ; et la montagne était en elle-même très belle.</p>
      <h3>79</h3>
      <p>1 Au milieu de la plaine, il me montra un grand rocher blanc qui s’élevait de la plaine. Et le rocher était plus haut que les montagnes, carré, de façon à pouvoir contenir le monde entier. 2 Ce rocher était ancien, et il avait une porte taillée dans sa masse ; mais le creusement de la porte me semblait récent. Et la porte resplendissait plus que le soleil, si bien que j’admirais l’éclat de la porte. 3 Autour de la porte se tenaient douze vierges. Les quatre qui se tenaient aux angles me semblaient plus glorieuses ; mais les autres aussi étaient glorieuses. Elles se tenaient aux quatre côtés de la porte, deux vierges entre chacune. 4 Elles étaient vêtues de tuniques de lin et ceintes avec élégance, l’épaule droite découverte, comme si elles allaient porter un fardeau. Ainsi étaient-elles prêtes ; car elles étaient fort joyeuses et empressées. 5 Après avoir vu ces choses, je m’étonnais en moi-même de ce que je voyais de grandes et glorieuses choses. Et je restais de nouveau dans l’embarras au sujet des vierges, parce que, si délicates, elles se tenaient virilement, comme si elles allaient soutenir le ciel entier. 6 Et le Pasteur me dit : « Pourquoi raisonnes-tu en toi-même, restes-tu dans l’embarras et attires-tu sur toi le chagrin ? Ce que tu ne peux concevoir, ne l’entreprends pas, puisque tu es sensé, mais demande au Seigneur, afin que, ayant reçu l’intelligence, tu le comprennes. 7 Ce qui est derrière toi, tu ne peux le voir : laisse cela, et ne te tourmente pas ; ce que tu vois, maîtrise-le, et ne t’occupe pas curieusement du reste ; car je te manifesterai tout ce que je te montrerai. Regarde donc le reste. »</p>
      <h3>80</h3>
      <p>1 Je vis six hommes qui étaient venus, grands, glorieux et semblables d’aspect ; et ils appelèrent une foule d’hommes. Et ceux qui étaient venus étaient aussi des hommes grands, beaux et forts ; et les six hommes leur ordonnèrent de bâtir sur le rocher une tour. Et il y avait un grand tumulte de ces hommes venus bâtir la tour, qui couraient çà et là autour de la porte. 2 Et les vierges qui se tenaient autour de la porte disaient aux hommes de se hâter de bâtir la tour ; et les vierges avaient tendu les mains, comme si elles allaient recevoir quelque chose des hommes. 3 Et les six hommes ordonnaient à des pierres de monter d’un abîme et d’aller à la construction de la tour. Et dix pierres montèrent, carrées, brillantes, non taillées. 4 Et les six hommes appelèrent les vierges et leur ordonnèrent de prendre toutes les pierres qui devaient aller à la construction de la tour et de les remettre aux hommes qui devaient bâtir la tour. 5 Et les vierges se passaient l’une à l’autre les dix premières pierres montées de l’abîme et les portaient ensemble une à une.</p>
      <h3>81</h3>
      <p>1 Et de même qu’elles se tenaient ensemble autour de la porte, ainsi portaient-elles : celles qui paraissaient être vigoureuses s’étaient glissées sous les angles du rocher ; et les autres s’étaient glissées sous les flancs du rocher et portaient ainsi toutes les pierres. Et elles les faisaient passer par la porte, comme il leur avait été ordonné, et les remettaient aux hommes dans la tour ; et ceux-ci, ayant les pierres, bâtissaient. 2 Or la construction de la tour se faisait sur le grand rocher et au-dessus de la porte. Ces dix pierres furent donc ajustées et remplirent tout le rocher ; et elles devinrent le fondement de la construction de la tour ; et le rocher et la porte soutenaient toute la tour. 3 Après les dix pierres, vingt autres montèrent de l’abîme ; et celles-ci furent ajustées à la construction de la tour, portées par les vierges comme les précédentes. Après celles-là, trente-cinq montèrent, et toutes furent jetées dans la construction de la tour ; et après celles-là, quarante montèrent, et toutes furent jetées dans la construction de la tour. Il y eut donc quatre rangées dans les fondations de la tour. 4 Et les bâtisseurs aussi s’arrêtèrent un peu. Et de nouveau les six hommes ordonnèrent à la multitude de la foule d’apporter des pierres des montagnes pour la construction de la tour. 5 Elles étaient donc apportées par tous les hommes et remises aux vierges ; et les vierges les faisaient passer par la porte et les remettaient pour la construction de la tour. Et lorsque les pierres bigarrées étaient posées dans la construction, elles devenaient pareillement blanches et changeaient leurs couleurs bigarrées. 6 Certaines pierres étaient remises par les hommes pour la construction et ne devenaient pas brillantes, mais telles qu’elles avaient été posées, telles aussi elles se trouvaient ; car elles n’avaient pas été remises par les vierges ni passées par la porte. Ces pierres donc étaient inconvenantes dans la construction de la tour. 7 Ayant vu ces pierres inconvenantes dans la construction, les six hommes ordonnèrent de les enlever et de les emporter en bas, à leur propre place, d’où elles avaient été apportées. 8 Et ils disent aux hommes qui rapportaient les pierres : « Vous, ne remettez absolument pas de pierres pour la construction ; déposez-les près de la tour, afin que les vierges les fassent passer par la porte et les remettent pour la construction. Car si, disent-ils, elles ne passent pas par la porte entre les mains de ces vierges, elles ne peuvent changer leurs couleurs. Ne vous fatiguez donc pas, disent-ils, en vain. »</p>
      <h3>82</h3>
      <p>1 Et ce jour-là la construction fut achevée, mais la tour ne fut pas terminée ; car elle devait de nouveau être bâtie ; et il y eut une interruption de la construction. Et les six hommes ordonnèrent aux bâtisseurs de se retirer tous un peu et de se reposer ; et aux vierges ils ordonnèrent de ne pas s’éloigner de la tour. Et il me semblait que les vierges avaient été laissées pour garder la tour. 2 Après que tous se furent retirés et eurent pris du repos, je dis au Pasteur : « Pourquoi donc, dis-je, Seigneur, la construction de la tour n’a-t-elle pas été achevée ? » Il dit : « La tour ne peut encore être achevée avant que son maître ne vienne examiner cette construction, afin que, si quelques pierres se trouvent pourries, il les change ; car c’est selon sa volonté que la tour est bâtie. » 3 Je voudrais, dis-je, Seigneur, savoir ce qu’est cette construction, et au sujet de la pierre, de la porte, des montagnes, des vierges, et des pierres montées de l’abîme, non taillées, mais entrées ainsi dans la construction, 4 et pourquoi d’abord dix pierres furent posées dans les fondations, puis vingt, puis trente-cinq, puis quarante ; et au sujet des pierres qui étaient entrées dans la construction et qui ensuite furent enlevées et remises à leur propre place. Sur toutes ces choses, apaise mon âme, Seigneur, et fais-les-moi connaître. » 5 « Si, dit-il, tu n’es pas trouvé d’une curiosité vaine, tu sauras tout ; car dans peu de jours nous viendrons ici, et tu verras ce qui doit encore arriver à cette tour, et tu connaîtras exactement toutes les similitudes. » 6 Et peu de jours après, nous vînmes au lieu où nous nous étions assis, et il me dit : « Allons vers la tour, car le propriétaire de la tour vient pour l’examiner. » Et nous vînmes vers la tour ; et il n’y avait absolument personne autour d’elle, sinon les vierges seules. 7 Et le Pasteur demanda aux vierges si le Maître de la tour était arrivé. Et elles dirent qu’il allait venir pour examiner la construction.</p>
      <h3>83</h3>
      <p>1 Et voici que peu après je vois une troupe de nombreux hommes qui venaient ; et au milieu, un homme de haute taille, au point qu’il dépassait la tour. 2 Et les six hommes qui présidaient à la construction marchaient avec lui, à sa droite et à sa gauche, et tous ceux qui avaient travaillé à la construction étaient avec lui, et beaucoup d’autres, glorieux, l’entouraient. Et les vierges qui gardaient la tour, accourant, l’embrassèrent et se mirent à marcher près de lui autour de la tour. 3 Et cet homme examinait la construction avec soin, au point de palper chaque pierre une à une. Et tenant un bâton à la main, il frappait une à une les pierres qui étaient bâties. 4 Et lorsqu’il frappait, quelques-unes devenaient noires comme suie, quelques-unes tronquées, quelques-unes ni blanches ni noires, quelques-unes raboteuses et ne s’accordant pas avec les autres pierres, quelques-unes couvertes de nombreuses taches ; telles étaient les bigarrures des pierres qui se trouvèrent pourries dans la construction. 5 Il ordonna donc de retirer toutes celles-là de la tour et de les reporter à leur place. 6 Et ceux qui bâtissaient lui demandèrent de quelle montagne il voulait que l’on apportât des pierres et qu’on les mît à leur place. Et il n’ordonna pas qu’on apportât des pierres des montagnes. 7 Et l’on creusa la plaine, et l’on trouva des pierres brillantes, carrées, et quelques-unes aussi rondes. Et toutes les pierres qui se trouvaient dans cette plaine furent apportées et portées par les vierges à travers la porte. 8 Et les pierres carrées furent taillées et mises à la place de celles qui avaient été enlevées ; mais les rondes ne furent pas mises dans la construction, parce qu’elles étaient dures à tailler et qu’elles se taillaient lentement. On les plaça près de la tour, comme devant être taillées et mises dans la construction ; car elles étaient fort brillantes.</p>
      <h3>84</h3>
      <p>1 Ayant donc achevé cela, l’homme glorieux, maître de toute la tour, appela le Pasteur et lui remit toutes les pierres qui gisaient près de la tour, celles qui avaient été rejetées de la construction, et il lui dit : 2 « Nettoie avec soin ces pierres et mets-les dans la construction de la tour, celles qui peuvent s’ajuster aux autres ; et celles qui ne s’ajustent pas, jette-les loin de la tour. » 3 Après avoir ordonné cela au Pasteur, il s’en alla ; et les vierges se tenaient autour de la tour, la gardant. 4 Je dis au Pasteur : « Comment ces pierres peuvent-elles aller à la construction de la tour, puisqu’elles ont été rejetées ? » Répondant, il me dit : « Vois-tu ces pierres ? » « Je les vois, dis-je, Seigneur. » Il dit : « Moi, je taillerai la plus grande partie de ces pierres et je les mettrai dans la construction, et elles s’ajusteront aux autres pierres. » 5 « Comment, dis-je, Seigneur, peuvent-elles, une fois retaillées, remplir le même espace ? » Répondant, il me dit : « Toutes celles qui se trouveront petites seront jetées au milieu de la construction ; et celles qui seront plus grandes seront placées à l’extérieur et les soutiendront. » 6 Après m’avoir dit cela, il me dit : « Allons, et dans deux jours revenons nettoyer ces pierres et les mettre dans la construction ; car tout ce qui est autour de la tour doit être nettoyé, de peur que le Maître ne survienne à l’improviste, ne trouve des choses sales autour de la tour et ne s’en irrite, et que ces pierres n’aillent pas à la construction de la tour, et que je ne paraisse négligent devant le Maître. » 7 Et deux jours après, nous vînmes vers la tour, et il me dit : « Examinons toutes les pierres et voyons celles qui peuvent aller à la construction. » Je lui dis : « Seigneur, examinons. »</p>
      <h3>85</h3>
      <p>1 Et commençant d’abord par les pierres noires, nous les examinâmes ; et elles se trouvèrent telles qu’elles avaient été posées hors de la construction. Et le Pasteur ordonna de les retirer de la tour et de les mettre à part. 2 Ensuite il examina les écaillées ; et en prenant beaucoup d’entre elles, il les tailla et ordonna aux vierges de les prendre et de les jeter dans la construction. Et les vierges les prirent et les placèrent au milieu de la construction de la tour. Et les autres, il ordonna de les mettre avec les noires ; car celles-là aussi se trouvèrent noires. 3 Ensuite il examina celles qui avaient des crevasses ; et parmi elles il en tailla beaucoup et ordonna qu’elles fussent portées par les vierges dans la construction ; et elles furent placées à l’extérieur, parce qu’elles se trouvèrent plus saines. Et les autres, à cause du nombre des crevasses, ne purent être taillées ; pour cette raison donc elles furent rejetées de la construction de la tour. 4 Ensuite il examina les tronquées ; et beaucoup d’entre elles se trouvèrent noires, et quelques-unes avaient de grandes crevasses. Celles-là, il les fit mettre avec les rejetées. Et celles qui restaient d’entre elles, il les nettoya et les tailla, et ordonna de les mettre dans la construction. Et les vierges les prirent et les ajustèrent au milieu de la construction de la tour ; car elles étaient plus faibles. 5 Ensuite il examina celles qui étaient à moitié blanches et à moitié noires ; et beaucoup d’entre elles se trouvèrent noires ; et il ordonna que celles-là aussi fussent enlevées avec les rejetées. Et toutes les autres furent enlevées par les vierges ; car étant blanches, elles furent ajustées par les vierges elles-mêmes à la construction ; et elles furent placées à l’extérieur, parce qu’elles se trouvèrent saines, de sorte qu’elles pouvaient tenir celles qui étaient placées au milieu ; car en elles absolument rien n’était tronqué. 6 Ensuite quelques-unes d’entre elles furent rejetées parce qu’elles ne pouvaient être taillées ; car elles se trouvèrent trop dures. Et les autres d’entre elles furent taillées, enlevées par les vierges et ajustées au milieu de la construction de la tour ; car elles étaient plus faibles. 7 Ensuite il examina celles qui avaient des taches, et parmi elles très peu devinrent noires et furent rejetées vers les autres. Et celles qui restaient se trouvèrent brillantes et saines ; et elles furent ajustées par les vierges à la construction, et elles furent placées à l’extérieur à cause de leur solidité.</p><h3>86</h3>
      <p>1 Ensuite il vint examiner les pierres blanches et rondes, et il me dit : « Que faisons-nous de ces pierres ? » Je dis : « Que sais-je, moi, Seigneur ? » Il dit : « Tu n’as donc aucune idée à leur sujet ? » 2 Je dis : « Seigneur, je n’ai pas cet art, je ne suis pas tailleur de pierre, et je ne puis rien concevoir. » Il dit : « Ne les vois-tu pas extrêmement rondes ? Et si je veux les rendre carrées, il faudra en retrancher beaucoup ; or il faut nécessairement que quelques-unes d’entre elles soient mises dans la construction. » 3 Je dis : « Si donc, Seigneur, la nécessité s’en impose, pourquoi te tourmenter et ne pas choisir pour la construction celles que tu veux, et les y ajuster ? » Il choisit parmi elles les plus grandes et les plus brillantes, et il les tailla ; et les vierges, les ayant prises, les ajustèrent aux parties extérieures de la construction. 4 Quant à celles qui restaient en surplus, elles furent enlevées et déposées dans la plaine d’où on les avait apportées ; et elles ne furent pas rejetées, parce que, dit-il, il reste encore à la tour un peu à construire. Mais le Maître de la tour veut que toutes ces pierres soient ajustées à la construction, car elles sont extrêmement brillantes. 5 On appela douze femmes, très belles de figure, vêtues de noir, la taille ceinte, les épaules découvertes et les cheveux dénoués ; et ces femmes me parurent sauvages. Le Pasteur leur ordonna de prendre les pierres rejetées de la construction et de les emporter dans les montagnes d’où elles avaient aussi été apportées. 6 Et elles, joyeuses, prirent toutes les pierres, les emportèrent et les déposèrent là où elles avaient été prises. Et après que toutes les pierres eurent été enlevées, et qu’il ne restait plus une seule pierre autour de la tour, le Pasteur me dit : « Faisons le tour de la tour, et voyons s’il s’y trouve quelque défaut. » Et je fis le tour avec lui. 7 Et le Pasteur, voyant que la tour était d’une construction fort belle, fut tout joyeux ; car la tour était bâtie de telle sorte qu’en la voyant je désirais sa construction ; elle était bâtie comme si elle était faite d’une seule pierre et n’avait en elle-même aucune jointure. Et la pierre paraissait comme taillée du rocher ; car elle me semblait être d’un seul bloc.</p>
      <h3>87</h3>
      <p>1 Et moi, marchant avec lui, j’étais joyeux de voir de si grands biens. Et le Pasteur me dit : « Va, et apporte de la chaux et des tessons menus, afin que je remplisse les creux des pierres qui ont été enlevées et jetées dans la construction ; car il faut que tout ce qui entoure la tour devienne uni. » Je le lui apportai. Il dit : « Sers-moi, et l’ouvrage sera bientôt achevé. » Il remplit donc les creux des pierres qui étaient entrées dans la construction, et il ordonna de balayer les alentours de la tour et de les rendre nets. 3 Et les vierges, ayant pris des balais, balayèrent et lavèrent à l’eau, et le lieu de la tour devint joyeux et très beau. 4 Le Pasteur me dit : « Tout a été purifié ; si le Seigneur vient visiter la tour, il n’aura rien à nous reprocher touchant la tour. » Ayant dit cela, il voulait se retirer. 5 Et moi, je le saisis par sa besace et je me mis à le conjurer par le Seigneur, afin qu’il m’expliquât ce qu’il m’avait montré. Il me dit : « J’ai peu de loisir, et ensuite je t’expliquerai tout. » Je dis : « Seigneur, moi qui suis seul ici, que ferai-je ? » Il dit : « Tu n’es pas seul. » Je dis : « Confie-moi donc à elles. » Le Pasteur les appelle et leur dit : « Je vous confie cet homme jusqu’à ce que je vienne. » Et il s’en alla. 7 Et moi, j’étais seul avec les vierges. Elles étaient fort joyeuses et se montraient pleines d’égards envers moi, surtout les quatre d’entre elles qui étaient les plus glorieuses.</p>
      <h3>88</h3>
      <p>1 Les vierges me disent : « Le Pasteur ne vient pas ici aujourd’hui. » Je dis : « Que ferai-je donc, moi ? » Elles disent : « Attends-le jusqu’au soir ; et s’il ne vient pas, tu demeureras ici avec nous jusqu’à ce qu’il vienne. » 2 Je leur dis : « Je l’attendrai jusqu’au soir ; mais s’il ne vient pas, je m’en irai dans ma maison et je reviendrai au matin. » Et elles, répondant, me disent : « Tu nous as été remis ; tu ne peux t’éloigner de nous. » 3 Je dis : « Où donc demeurerai-je ? » Elles disent : « Avec nous tu dormiras comme un frère, et non comme un mari ; car tu es notre frère, et désormais nous habiterons avec toi, car nous t’aimons beaucoup. » Et moi, j’avais honte de demeurer avec elles. 4 Et celle qui semblait être la première d’entre elles se mit à me donner des baisers, à me faire tourner autour de la tour et à jouer avec moi. 5 Et moi, comme si j’étais devenu plus jeune, je me mis moi aussi à jouer avec elles ; car les unes formaient des chœurs, les autres dansaient, les autres chantaient. Et moi, le soir venu, je voulais m’en aller dans ma maison ; mais elles ne me laissèrent pas, elles me retinrent ; et je demeurai avec elles cette nuit-là, et je dormis près de la tour. 7 Car les vierges avaient étendu à terre leurs tuniques de lin et m’avaient fait coucher au milieu d’elles ; et elles ne faisaient absolument rien d’autre que prier ; et moi, avec elles, je priais sans relâche, et non moins qu’elles ; et les vierges se réjouissaient de me voir prier ainsi. Et je demeurai là jusqu’au lendemain, jusqu’à la deuxième heure, avec les vierges. 8 Ensuite le Pasteur fut là, et il dit aux vierges : « Ne lui avez-vous fait quelque violence ? » Elles disent : « Interroge-le. » Je lui dis : « Seigneur, je me suis réjoui d’être demeuré avec elles. » Il dit : « De quoi as-tu dîné ? » Je dis : « De paroles du Seigneur, Seigneur, toute la nuit. » Il dit : « T’ont-elles bien reçu ? » Je dis : « Oui, Seigneur. » 9 Il dit : « Maintenant, que veux-tu entendre d’abord ? » Je dis : « Comme tu me l’as montré dès le commencement, Seigneur, je te demande que, selon ce que je t’interrogerai, tu me le fasses connaître. » Il dit : « Comme tu veux, je t’expliquerai, et je ne te cacherai rien du tout. »</p>
      <h3>89</h3>
      <p>1 Je dis : « Avant toutes choses, Seigneur, fais-moi connaître ceci : qu’est-ce que le rocher, et qu’est-ce que la porte ? » Il dit : « Cette pierre et cette porte, c’est le Fils de Dieu. » Je dis : « Comment donc, Seigneur, la pierre est-elle ancienne, et la porte nouvelle ? » Il dit : « Écoute et comprends, homme sans intelligence. 2 Le Fils de Dieu est antérieur à toute sa création, de sorte qu’il fut le conseiller de son Père pour sa création ; c’est pourquoi la pierre est ancienne. » Je dis : « Et la porte, pourquoi est-elle nouvelle, Seigneur ? » 3 Il dit : « Parce qu’il s’est manifesté aux derniers jours de la consommation ; c’est pourquoi la porte est devenue nouvelle, afin que ceux qui doivent être sauvés entrent par elle dans le royaume de Dieu. 4 As-tu vu les pierres qui sont entrées par la porte et qui ont été placées dans la construction de la tour, et celles qui n’y sont pas entrées rejetées de nouveau à leur propre place ? » Je dis : « Je l’ai vu, Seigneur. » Il dit : « Ainsi personne n’entrera dans le royaume de Dieu, s’il ne reçoit son saint nom. 5 Car si tu veux entrer dans une ville, et que cette ville soit ceinte de murailles tout autour et n’ait qu’une seule porte, peux-tu entrer dans cette ville autrement que par la porte qu’elle a ? » Je dis : « Comment cela se pourrait-il autrement, Seigneur ? » Il dit : « Si donc tu ne peux entrer dans la ville autrement que par la porte qu’elle a, de même un homme ne peut entrer dans le royaume de Dieu autrement que par le nom de son Fils bien-aimé. 6 As-tu vu la foule qui bâtissait la tour ? » Je dis : « Je l’ai vue, Seigneur. » Il dit : « Tous ceux-là sont des anges glorieux ; c’est par eux que le Seigneur a été environné d’un rempart. Et la porte, c’est le Fils de Dieu ; c’est là l’unique entrée vers le Seigneur. Nul donc n’entrera auprès de lui, sinon par son Fils. 7 As-tu vu les six hommes et, au milieu d’eux, l’homme glorieux et grand qui marchait autour de la tour et qui rejetait les pierres hors de la construction ? » Je dis : « Je les ai vus, Seigneur. » 8 Il dit : « Cet homme glorieux, c’est le Fils de Dieu, et ces six-là sont les anges glorieux qui le soutiennent à sa droite et à sa gauche. Aucun de ces anges glorieux n’entrera auprès de Dieu sans lui ; celui qui ne reçoit pas son nom n’entrera pas dans le royaume de Dieu. »</p>
      <h3>90</h3>
      <p>1 Je dis : « Et la tour, qu’est-ce que c’est ? » Il dit : « Cette tour, c’est l’Église. » 2 Je dis : « Et ces vierges, qui sont-elles ? » Il dit : « Ce sont des esprits saints ; et autrement un homme ne peut être trouvé dans le royaume de Dieu, si ces vierges ne le revêtent de leur vêtement. Car si tu ne reçois que le nom, tu n’en tireras aucun profit ; car ces vierges sont les puissances du Fils de Dieu. Si tu portes le nom sans porter sa puissance, c’est en vain que tu porteras son nom. 3 Et les pierres que tu as vues rejetées, ce sont ceux qui ont porté le nom, mais qui ne se sont pas revêtus du vêtement des vierges. » Je dis : « Quel est leur vêtement, Seigneur ? » Il dit : « Leurs noms mêmes sont leur vêtement. Celui qui porte le nom du Fils de Dieu doit porter aussi leurs noms ; car le Fils lui-même porte les noms de ces vierges. 4 Toutes les pierres que tu as vues entrer dans la construction de la tour, remises par leurs mains et demeurées dans la construction, celles-là se sont revêtues de la puissance de ces vierges. 5 C’est pourquoi tu vois la tour être devenue un seul bloc avec la pierre ; ainsi ceux qui ont cru au Seigneur par son Fils et qui se revêtent de ces esprits seront un seul esprit, un seul corps, et leurs vêtements n’auront qu’une seule couleur. Ceux qui portent les noms des vierges ont leur demeure dans la tour. » 6 Je dis : « Et les pierres qui ont été rejetées, Seigneur, pourquoi l’ont-elles été ? Car elles ont passé par la porte, et elles ont été placées dans la construction de la tour par les mains des vierges. » Il dit : « Puisque tout te tient à cœur et que tu examines avec soin, écoute ce qui concerne les pierres rejetées. 7 Tous ceux-là ont reçu le nom du Fils de Dieu, et ils ont reçu aussi la puissance de ces vierges. Ayant donc reçu ces esprits, ils furent fortifiés et ils étaient parmi les serviteurs de Dieu ; et ils n’avaient qu’un seul esprit, un seul corps et un seul vêtement ; car ils pensaient les mêmes choses et pratiquaient la justice. 8 Mais après un certain temps, ils furent séduits par les femmes que tu as vues vêtues de noir, les épaules découvertes, les cheveux dénoués et belles ; les voyant, ils les désirèrent et se revêtirent de leur puissance, et ils dépouillèrent les vierges de leur vêtement et de leur puissance. 9 Ceux-là donc furent rejetés de la maison de Dieu ; mais ceux que ne séduisit pas la beauté de ces femmes demeurèrent dans la maison de Dieu. Tu as, dit-il, l’explication des pierres rejetées. »</p>
      <h3>91</h3>
      <p>1 Je dis : « Eh quoi, Seigneur, si ces hommes, étant tels, font pénitence et rejettent les désirs de ces femmes, et reviennent aux vierges, et marchent dans leur puissance et dans leurs œuvres, n’entreront-ils pas dans la maison de Dieu ? » 2 Il dit : « Ils entreront, s’ils rejettent la puissance de ces femmes et marchent dans les œuvres des vierges ; car c’est pour cela aussi qu’il y a eu un répit dans la construction, afin que, s’ils font pénitence, ils aillent à la construction de la tour. Mais s’ils ne font pas pénitence, alors d’autres entreront, et ceux-là seront rejetés pour toujours. » 3 Là-dessus, je rendis grâces au Seigneur de ce qu’il avait eu compassion de tous ceux qui invoquent son nom, et de ce qu’il nous avait envoyé l’ange de la pénitence, à nous qui avions péché contre lui, et de ce qu’il avait renouvelé notre esprit ; et alors que nous étions déjà corrompus et sans espérance de vivre, il a renouvelé notre vie. 4 Je dis : « Maintenant, Seigneur, fais-moi connaître pourquoi la tour n’a pas été bâtie sur la terre, mais sur la pierre et sur la porte. » Il dit : « Tu es encore insensé et sans intelligence ? » Je dis : « Il faut, Seigneur, que je t’interroge sur tout, parce que ce sont choses glorieuses et difficiles à comprendre pour les hommes. » 5 Il dit : « Écoute : le nom du Fils de Dieu est grand, et rien ne peut le contenir, et il soutient le monde entier. Si donc toute la création est soutenue par le Fils de Dieu, que penses-tu de ceux qui sont appelés par lui, qui portent le nom du Fils de Dieu et marchent dans ses préceptes ? 6 Tu vois donc lesquels il soutient : ceux qui portent son nom de tout leur cœur. Il s’est donc fait lui-même leur fondement, et il les soutient avec joie, parce qu’ils n’ont pas honte de le porter. »</p>
      <h3>92</h3>
      <p>1 Je dis : « Fais-moi connaître, Seigneur, les noms des vierges et des femmes qui sont vêtues de noir. » Il dit : « Écoute les noms des vierges les plus fortes, de celles qui se tiennent aux angles. 2 La première, Foi ; la deuxième, Continence ; la troisième, Force ; la quatrième, Patience. Et les autres, qui se tiennent entre celles-là, ont ces noms : Simplicité, Innocence, Pureté, Gaieté, Vérité, Intelligence, Concorde, Charité. Celui qui porte ces noms et le nom du Fils de Dieu entrera dans le royaume de Dieu. Et parmi ces femmes, quatre sont plus puissantes : la première, Incrédulité ; la deuxième, Intempérance ; la troisième, Désobéissance ; la quatrième, Tromperie. Et leurs suivantes : Tristesse, Méchanceté, Débauche, Colère, Mensonge, Folie, Médisance, Haine. Le serviteur de Dieu qui porte ces noms verra le royaume de Dieu, mais il n’y entrera pas. » 4 Je dis : « Et les pierres, Seigneur, qui ont été ajustées à la construction en venant de l’abîme, qui sont-elles ? » Il dit : « Les premières, les dix qui ont été posées dans les fondements, sont la première génération ; les vingt-cinq, la deuxième génération d’hommes justes ; les trente-cinq, les prophètes de Dieu et ses serviteurs ; et les quarante, les apôtres et les docteurs de la prédication du Fils de Dieu. » 5 Je dis : « Pourquoi donc, Seigneur, les vierges ont-elles remis, elles aussi, ces pierres pour la construction de la tour, après les avoir fait passer par la porte ? » 6 Il dit : « Parce que ce sont eux qui, les premiers, ont porté ces esprits, et ils ne se sont nullement séparés les uns des autres, ni les esprits des hommes, ni les hommes des esprits ; mais les esprits demeurèrent avec eux jusqu’à leur dormition. Et s’ils n’avaient pas eu ces esprits avec eux, ils n’auraient pas été utiles à la construction de cette tour. »</p>
      <h3>93</h3>
      <p>1 Je dis : « Explique-moi encore, Seigneur. » Il dit : « Que cherches-tu ? » Je dis : « Pourquoi, Seigneur, les pierres sont-elles montées du fond de l’eau pour être placées dans la tour, alors qu’elles avaient porté ces esprits ? » 2 Il dit : « Il leur fallait monter par l’eau pour être vivifiées ; car elles ne pouvaient entrer autrement dans le royaume de Dieu, si elles ne déposaient la mort de leur vie première. 3 Ces morts donc reçurent eux aussi le sceau du Fils de Dieu et entrèrent dans le royaume de Dieu ; car avant que l’homme porte le nom du Fils de Dieu, il est mort ; mais lorsqu’il reçoit le sceau, il dépose la mort et reprend la vie. 4 Le sceau donc, c’est l’eau : ils descendent donc dans l’eau morts, et ils en remontent vivants. C’est à eux aussi que ce sceau fut prêché, et ils en usèrent afin d’entrer dans le royaume de Dieu. » 5 Je dis : « Pourquoi, Seigneur, les quarante pierres sont-elles montées aussi avec eux de l’abîme, ayant déjà reçu le sceau ? » Il dit : « Parce que ces apôtres et ces docteurs qui ont prêché le nom du Fils de Dieu, s’étant endormis dans la puissance et la foi du Fils de Dieu, l’ont prêché aussi à ceux qui s’étaient endormis avant eux, et ils leur donnèrent eux-mêmes le sceau de la prédication. 6 Ils descendirent donc vivants, et ils remontèrent vivants ; mais ceux qui s’étaient endormis avant eux descendirent morts, et ils remontèrent vivants. 7 C’est par eux donc qu’ils furent vivifiés et qu’ils connurent le nom du Fils de Dieu ; c’est pourquoi ils montèrent aussi avec eux et furent ajustés à la construction de la tour, et ils furent bâtis avec eux sans être taillés ; car ils s’étaient endormis dans la justice et dans une grande pureté ; seule leur manquait ce sceau. Tu as donc aussi leur explication. » Je dis : « Je l’ai, Seigneur. »</p><h3>94</h3>
      <p>1 « Maintenant donc, Seigneur, fais-moi connaître ce qui concerne les montagnes : pourquoi leurs aspects sont-ils multiples et divers ? » Il dit : « Écoute. Ces douze montagnes sont les tribus qui habitent le monde entier. Le Fils de Dieu leur a donc été annoncé par les apôtres. » 2 « Mais pourquoi les montagnes sont-elles diverses, avec un aspect toujours autre, fais-le-moi connaître, Seigneur. » Il dit : « Écoute. Ces douze tribus qui habitent le monde entier sont douze nations ; elles sont diverses par la pensée et par l’esprit. De même que tu as vu les montagnes diverses, ainsi sont aussi ces diversités de l’esprit des nations et leur pensée. Je te montrerai aussi l’action de chacune. » 3 Je dis : « Tout d’abord, Seigneur, fais-moi connaître ceci : pourquoi ces montagnes, étant si diverses, lorsque leurs pierres furent placées dans la construction, devinrent-elles brillantes d’une seule couleur, comme les pierres qui sont montées du fond de l’eau ? » 4 Il dit : « Parce que toutes les nations qui habitent sous le ciel, ayant entendu et cru, ont été appelées du nom du Fils de Dieu. Ayant donc reçu le sceau, elles eurent une seule pensée et un seul esprit, et leur foi devint une, et leur amour devint un ; et avec le nom elles portèrent les esprits des vierges. C’est pourquoi la construction de la tour devint brillante d’une seule couleur, comme le soleil. 5 Mais après qu’ils furent entrés dans le même lieu et devenus un seul corps, quelques-uns d’entre eux se souillèrent et furent rejetés de la race des justes, et redevinrent tels qu’ils étaient auparavant, ou plutôt pires encore. »</p>
      <h3>95</h3>
      <p>1 Je dis : « Comment, Seigneur, sont-ils devenus pires, ayant connu Dieu ? » Il dit : « Celui qui ne connaît pas Dieu et fait le mal a quelque châtiment de sa malice ; mais celui qui a connu Dieu ne doit plus faire le mal, mais faire le bien. 2 Si donc celui qui doit faire le bien fait le mal, ne semble-t-il pas commettre plus de malice que celui qui ne connaît pas Dieu ? C’est pourquoi ceux qui n’ont pas connu Dieu et font le mal sont jugés à mort ; mais ceux qui ont connu Dieu, qui ont vu ses grandeurs et font le mal, seront doublement châtiés et mourront à jamais. C’est ainsi donc que sera purifiée l’Église de Dieu. 3 Tu as vu les pierres enlevées de la tour, livrées aux esprits mauvais et rejetées de là ; et il y aura un seul corps de ceux qui ont été purifiés, de même que la tour est devenue comme faite d’une seule pierre après qu’elle fut purifiée ; ainsi en sera-t-il aussi de l’Église de Dieu, après qu’elle aura été purifiée et que les méchants, les hypocrites, les blasphémateurs, les hommes au double esprit et ceux qui font le mal par diverses malices auront été rejetés. 4 Après que ceux-là auront été rejetés, l’Église de Dieu sera un seul corps, une seule pensée, un seul esprit, une seule foi, un seul amour ; et alors le Fils de Dieu tressaillira et se réjouira en eux, ayant recouvré son peuple pur. » Je dis : « Seigneur, fais-moi connaître pleinement la puissance et les actions de chacune des montagnes, afin que toute âme qui se confie au Seigneur, l’ayant entendu, glorifie son nom grand, admirable et glorieux. » Il dit : « Écoute la diversité des montagnes et des douze nations. »</p>
      <h3>96</h3>
      <p>1 Ceux qui ont cru, venus de la première montagne, la noire, sont tels : des apostats, des blasphémateurs contre le Seigneur et des traîtres envers les serviteurs de Dieu. Pour eux il n’y a pas de pénitence : il y a la mort ; et c’est pourquoi ils sont aussi noirs ; car leur race est sans loi. 2 Ceux qui ont cru, venus de la deuxième montagne, la rase, sont tels : des hypocrites et des docteurs de malice. Ceux-là aussi sont donc semblables aux premiers, n’ayant pas de fruit de justice ; car de même que leur montagne est stérile, ainsi les hommes de cette sorte ont le nom, mais ils sont vides de la foi, et il n’y a en eux aucun fruit de vérité. Pour eux donc la pénitence est ouverte, s’ils font vite pénitence ; mais s’ils tardent, leur mort sera avec celle des premiers. 3 Je dis : « Pourquoi, Seigneur, y a-t-il pénitence pour eux, et non pour les premiers ? Car leurs actions sont à peu près les mêmes. » Il dit : « C’est pourquoi la pénitence leur est ouverte : parce qu’ils n’ont pas blasphémé leur Seigneur et ne sont pas devenus traîtres des serviteurs de Dieu ; mais par le désir du gain ils ont fait l’hypocrite, et chacun a enseigné selon les désirs des hommes qui pèchent. Mais ils porteront quelque peine ; et la pénitence leur est ouverte parce qu’ils ne sont devenus ni blasphémateurs ni traîtres. »</p>
      <h3>97</h3>
      <p>1 Ceux qui ont cru, venus de la troisième montagne, celle qui a des épines et des chardons, sont les uns riches, les autres empêtrés dans beaucoup d’affaires. Les chardons sont les riches, et les épines, ceux qui sont empêtrés dans les affaires multiples et variées : ils ne s’attachent pas aux serviteurs de Dieu, mais ils errent, étouffés par leurs propres actions ; et les riches s’attachent difficilement aux serviteurs de Dieu, craignant d’être blâmés par eux. Ceux-là donc entreront difficilement dans le royaume de Dieu. 3 Car de même qu’il est difficile de marcher pieds nus parmi des chardons, ainsi il est difficile à de tels hommes d’entrer dans le royaume de Dieu. 4 Mais pour tous ceux-là il y a pénitence, et rapide, afin que ce qu’ils n’ont pas accompli dans les temps précédents, ils le rattrapent maintenant dans ces jours et fassent quelque bien. Si donc ils font pénitence et font quelque bien, ils vivront pour Dieu ; mais s’ils persistent dans leurs actions, ils seront livrés à ces femmes qui les feront mourir.</p>
      <h3>98</h3>
      <p>1 Ceux qui ont cru, venus de la quatrième montagne, celle qui a beaucoup d’herbes, les unes vertes au sommet, les autres sèches près des racines, et quelques-unes desséchées par le soleil, sont tels : les uns hommes au double esprit, les autres ayant le Seigneur. 2 C’est pourquoi leurs fondements sont secs et sans force, et leurs paroles seules sont vivantes, mais leurs œuvres sont mortes. Ceux-là ne vivent ni ne sont morts. Ils sont donc semblables aux hommes au double esprit ; car ceux qui ont le double esprit ne sont ni verts ni secs ; car ils ne vivent ni ne sont morts. 3 Car de même que ces herbes, ayant vu le soleil, se sont desséchées, ainsi les hommes au double esprit, lorsqu’ils entendent parler d’une tribulation, à cause de leur lâcheté sacrifient aux idoles et ont honte du nom de leur Seigneur. 4 Ceux-là donc ni ne vivent ni ne sont morts. Mais eux aussi, s’ils font vite pénitence, pourront vivre ; mais s’ils ne font pas pénitence, ils sont déjà livrés aux femmes qui emportent leur vie.</p>
      <h3>99</h3>
      <p>1 Ceux qui ont cru, venus de la cinquième montagne, celle qui a des herbes vertes et qui est raboteuse, sont tels : fidèles, mais lents à apprendre, arrogants et complaisants à eux-mêmes, voulant tout savoir et ne sachant rien du tout. 2 À cause de cette arrogance, l’intelligence s’est retirée d’eux, et une folie insensée est entrée en eux. Ils se louent eux-mêmes comme ayant l’intelligence, et ils veulent être docteurs de leur propre chef, étant insensés. 3 À cause de cette hauteur d’esprit, beaucoup ont été vidés en s’élevant eux-mêmes ; car l’arrogance et la vaine confiance sont un grand démon. Beaucoup d’entre eux donc ont été rejetés ; mais quelques-uns ont fait pénitence, ont cru et se sont soumis à ceux qui ont l’intelligence, reconnaissant leur propre folie. 4 Et pour les autres, ceux de cette sorte, la pénitence est ouverte ; car ils ne sont pas devenus méchants, mais plutôt sots et sans intelligence. Si donc ils font pénitence, ils vivront pour Dieu ; mais s’ils ne font pas pénitence, ils habiteront avec les femmes qui agissent mal envers eux.</p>
      <h3>100</h3>
      <p>1 Ceux qui ont cru, venus de la sixième montagne, celle qui a de grandes et de petites crevasses et, dans les crevasses, des herbes flétries, sont tels. 2 Ceux qui ont les petites crevasses sont ceux qui ont des rancunes les uns contre les autres, et par leurs médisances réciproques ils sont flétris dans la foi ; mais beaucoup d’entre eux ont fait pénitence. Et les autres aussi feront pénitence, quand ils entendront mes préceptes ; car leurs médisances sont petites, et ils feront vite pénitence. 3 Ceux qui ont de grandes crevasses persistent dans leurs médisances et deviennent rancuniers, s’irritant les uns contre les autres ; ceux-là donc ont été rejetés loin de la tour et jugés indignes de sa construction. Ceux-là donc vivront difficilement. 4 Si Dieu, notre Seigneur, qui domine sur tout et qui a le pouvoir sur toute sa création, ne garde pas de ressentiment contre ceux qui confessent leurs péchés, mais leur devient propice, un homme corruptible et plein de péchés gardera-t-il rancune à un homme, comme s’il pouvait le perdre ou le sauver ? 5 Je vous le dis, moi, l’ange de la pénitence : vous tous qui avez ce penchant, déposez-le et faites pénitence, et le Seigneur guérira vos péchés antérieurs, si vous vous purifiez de ce démon ; sinon, vous lui serez livrés pour la mort.</p>
      <h3>101</h3>
      <p>1 Ceux qui ont cru, venus de la septième montagne, où il y a des herbes vertes et riantes, et où toute la montagne était florissante, et où toute espèce de troupeaux et les oiseaux du ciel paissaient les herbes de cette montagne, et les herbes qu’ils paissaient devenaient plus florissantes, sont tels. 2 Ils étaient toujours simples, sans malice et bienheureux, n’ayant rien les uns contre les autres, mais toujours dans l’allégresse au sujet des serviteurs de Dieu, revêtus de l’esprit saint de ces vierges, et toujours pleins de compassion pour tout homme ; et de leurs travaux ils pourvoyaient à tout homme sans faire de reproche et sans hésiter. 3 Le Seigneur donc, voyant leur simplicité et toute leur candeur, les a multipliés dans les travaux de leurs mains et les a remplis de grâce en toute action. 4 Je vous le dis, à vous qui êtes tels, moi, l’ange de la pénitence : demeurez tels, et votre semence ne sera pas effacée jusqu’à l’éternité ; car le Seigneur vous a éprouvés et vous a inscrits dans notre nombre, et toute votre semence habitera avec le Fils de Dieu ; car vous avez reçu de son Esprit.</p><h3>102</h3>
      <p>1 Ceux qui ont cru, venus de la huitième montagne, où il y avait les nombreuses sources et où toute la création du Seigneur s’abreuvait aux sources, sont tels : 2 les apôtres et les docteurs qui ont prêché dans le monde entier, qui ont enseigné avec dignité et sainteté la parole du Seigneur et qui n’ont rien détourné du tout par un désir mauvais, mais ont toujours marché dans la justice et la vérité, selon qu’ils avaient aussi reçu l’Esprit saint. Le passage de tels hommes est donc avec les anges.</p>
      <h3>103</h3>
      <p>1 Ceux qui ont cru, venus de la neuvième montagne, la déserte, celle qui a en elle les reptiles et les bêtes sauvages qui font périr les hommes, sont tels : 2 ceux qui ont les taches sont des diacres qui ont mal exercé leur ministère, qui ont pillé la vie des veuves et des orphelins et se sont procuré des biens par le ministère qu’ils avaient reçu pour l’exercer ; si donc ils demeurent dans le même désir, ils sont morts et il n’y a pour eux aucun espoir de vie ; mais s’ils se convertissent et achèvent saintement leur ministère, ils pourront vivre. 3 Ceux qui ont la gale, ce sont ceux qui ont renié leur Seigneur et sont devenus arides et déserts : ne s’attachant pas aux serviteurs de Dieu, mais vivant à l’écart, ils perdent leurs propres âmes. 4 Car de même qu’une vigne laissée dans quelque enclos, livrée à la négligence, se corrompt, est dévastée par les herbes et, avec le temps, devient sauvage, et n’est plus d’aucun usage à son maître, ainsi de tels hommes ont désespéré d’eux-mêmes et deviennent inutiles à leur Seigneur, étant devenus sauvages. 5 À ceux-là donc la pénitence est donnée ; mais si quelqu’un se trouve avoir renié du fond du cœur, je ne sais s’il peut vivre. 6 Et je ne dis pas cela pour ces jours-ci, comme si quelqu’un, après avoir renié, pouvait encore recevoir la pénitence ; car il est impossible que soit sauvé celui qui va maintenant renier son Seigneur ; mais pour ceux qui ont renié autrefois, il semble que la pénitence soit établie. Si donc quelqu’un est sur le point de faire pénitence, qu’il se hâte avant que la tour soit achevée ; sinon, il sera détruit par les femmes jusqu’à la mort. 7 Et les mutilés, ceux-là sont fourbes et médisants ; et les bêtes sauvages que tu as vues sur la montagne, ce sont eux. Car de même que les bêtes sauvages détruisent l’homme par leur propre venin, ainsi leurs paroles détruisent l’homme et le font périr. 8 Ceux-là donc sont mutilés dans leur foi, à cause de l’action qu’ils portent en eux ; mais quelques-uns ont fait pénitence et ont été sauvés. Et les autres, qui sont tels, peuvent être sauvés s’ils font pénitence ; mais s’ils ne font pas pénitence, ils mourront par ces femmes dont ils ont la puissance.</p>
      <h3>104</h3>
      <p>1 Ceux qui ont cru, venus de la dixième montagne, où il y avait des arbres qui abritaient des brebis, sont tels : 2 les évêques et les hospitaliers, qui ont toujours reçu avec plaisir dans leurs maisons les serviteurs de Dieu, sans hypocrisie ; et les évêques ont toujours, sans relâche, abrité par leur ministère les indigents et les veuves, et se sont toujours conduits saintement. 3 Tous ceux-là donc seront abrités par le Seigneur pour toujours. Ceux donc qui ont fait ces choses sont glorieux auprès de Dieu, et déjà leur place est avec les anges, s’ils persévèrent jusqu’à la fin à servir le Seigneur.</p>
      <h3>105</h3>
      <p>1 Ceux qui ont cru, venus de la onzième montagne, où il y avait des arbres pleins de fruits, ornés de fruits divers et variés, sont tels : 2 ceux qui ont souffert pour le nom du Fils de Dieu, qui ont souffert avec empressement, de tout leur cœur, et qui ont livré leurs âmes. 3 « Pourquoi donc, dis-je, Seigneur, tous les arbres ont-ils des fruits, et quelques-uns de ces fruits sont-ils plus beaux ? » Il dit : « Écoute. Tous ceux qui ont jamais souffert à cause du nom sont glorieux auprès de Dieu, et leurs péchés à tous ont été enlevés, parce qu’ils ont souffert pour le nom du Fils de Dieu. Mais écoute pourquoi leurs fruits sont variés et quelques-uns supérieurs. 4 Tous ceux, dit-il, qui, menés devant l’autorité, ont été interrogés et n’ont pas renié, mais ont souffert avec empressement, ceux-là sont bien plus glorieux auprès du Seigneur ; leur fruit est celui qui est supérieur. Mais tous ceux qui ont été lâches et se sont trouvés dans l’hésitation, et qui ont délibéré dans leurs cœurs s’ils renieraient ou confesseraient, puis ont souffert, leurs fruits sont moindres, parce que cette pensée est montée sur leur cœur ; car cette pensée est mauvaise, qu’un serviteur renie son propre maître. 5 Prenez donc garde, vous qui délibérez de ces choses, que cette pensée ne demeure jamais dans vos cœurs et que vous ne mouriez à Dieu. Mais vous qui souffrez à cause du nom, vous devez glorifier Dieu de ce qu’il vous a jugés dignes de porter ce nom et que tous vos péchés soient guéris. 6 Ainsi donc, estimez-vous bienheureux ; mais considérez comme une grande œuvre que l’un de vous souffre pour Dieu. Le Seigneur vous accorde la vie, et vous ne le comprenez pas ; car vos péchés vous ont accablés, et si vous n’aviez pas souffert à cause du nom du Seigneur, à cause de vos péchés vous seriez morts à Dieu. 7 Je dis cela à vous qui hésitez au sujet du reniement ou de la confession : confessez que vous avez un Seigneur, de peur qu’en reniant vous ne soyez livrés en prison. 8 Si les nations punissent leurs esclaves quand quelqu’un renie son maître, que pensez-vous que le Seigneur vous fera, lui qui a la puissance sur tout ? Ôtez ces pensées de vos cœurs, afin que vous viviez toujours pour Dieu. »</p>
      <h3>106</h3>
      <p>1 Ceux qui ont cru, venus de la douzième montagne, la blanche, sont tels : ils sont comme de petits enfants, auxquels aucune malice ne monte au cœur et qui ne savent pas ce qu’est la méchanceté, mais sont toujours demeurés dans l’enfance. 2 Ceux-là donc habiteront sans hésitation dans le royaume de Dieu, parce qu’en aucune chose ils n’ont souillé les préceptes de Dieu, mais sont demeurés dans l’enfance, tous les jours de leur vie, dans la même pensée. 3 « Vous donc qui demeurerez, dit-il, et qui serez comme les petits enfants, n’ayant pas de malice, vous serez plus glorieux que tous ceux dont il a été parlé auparavant ; car tous les petits enfants sont glorieux auprès de Dieu et les premiers auprès de lui. Bienheureux donc êtes-vous, vous tous qui rejetterez de vous la méchanceté et vous revêtirez de l’innocence : les premiers de tous, vous vivrez pour Dieu. » 4 Après qu’il eut achevé les similitudes des montagnes, je lui dis : « Seigneur, fais-moi connaître maintenant les pierres qui ont été enlevées de la plaine et placées dans la construction à la place des pierres rondes mises dans la construction, et celles qui sont encore rondes. »</p>
      <h3>107</h3>
      <p>1 « Écoute, dit-il, cela aussi, sur toutes ces choses. Les pierres de la plaine qui ont été enlevées et placées dans la construction de la tour à la place de celles qui ont été rejetées, ce sont les racines de la montagne blanche. 2 Puisque donc ceux qui ont cru, venus de la montagne blanche, ont tous été trouvés innocents, le maître de la tour a ordonné que ceux-ci, pris parmi les racines de cette montagne, soient jetés dans la construction de la tour ; car il savait que, si ces pierres entraient dans la construction de la tour, elles demeureraient brillantes et aucune d’elles ne noircirait. 3 Mais s’il en avait ajouté d’autres des autres montagnes, il aurait fallu de nouveau visiter cette tour et la purifier. Or tous ceux-ci ont été trouvés blancs, ceux qui croient et ceux qui croiront ; car ils sont de la même race. Bienheureuse est cette race, car elle est innocente. 4 Écoute maintenant ce qui concerne les pierres rondes et brillantes. Elles aussi sont toutes de la montagne blanche. Mais écoute pourquoi elles ont été trouvées rondes. Leurs richesses les ont un peu obscurcies à l’égard de la vérité et les ont aveuglées ; mais elles ne se sont jamais écartées de Dieu, et aucune parole mauvaise n’est sortie de leur bouche, mais toujours l’équité et la vertu de la vérité. 5 Le Seigneur donc, voyant leur pensée capable de favoriser la vérité et de demeurer bonne, a ordonné que leurs richesses soient retranchées, non toutefois pour les leur ôter entièrement, afin qu’elles puissent faire quelque bien de ce qui leur reste et qu’elles vivent pour Dieu, puisqu’elles sont de bonne race. C’est pourquoi donc elles ont été un peu retranchées et placées dans la structure de cette tour. »</p>
      <h3>108</h3>
      <p>1 « Les autres, qui sont demeurés ronds jusqu’à présent et n’ont pas été ajustés à cette construction, parce qu’ils n’ont pas encore reçu le sceau, ont été remis à leur place ; il faut grandement les retrancher de ce siècle et des vanités de leurs richesses, et alors ils entreront dans le royaume de Dieu. Car il est nécessaire qu’ils entrent dans le royaume de Dieu ; car le Seigneur a béni cette race innocente. De cette race donc, aucun ne périra. Et en effet, si l’un d’entre eux, tenté par le diable très méchant, a commis quelque faute, il reviendra vite à son Seigneur. 3 Moi, l’ange de la pénitence, je vous estime heureux, vous tous dont le trésor est bon et glorieux auprès de Dieu. 4 Je vous le dis donc à vous tous qui avez reçu ce sceau : ayez la simplicité, ne gardez pas le souvenir des offenses, ne demeurez pas dans votre malice ni dans la mémoire amère des offenses ; devenez tous un seul esprit, guérissez ces mauvaises déchirures et ôtez-les de vous, afin que le maître du troupeau se réjouisse de ses brebis. 5 Il se réjouira, si toutes sont trouvées saines et non égarées ; mais malheur aux pasteurs ! 6 Et si les pasteurs eux-mêmes sont trouvés égarés, que diront-ils au maître du troupeau ? Qu’ils ont été égarés par les brebis ? On ne les croira pas ; car c’est une chose incroyable qu’un pasteur souffre quelque chose de la part des brebis ; ils seront plutôt punis à cause de leur mensonge. Et moi aussi je suis pasteur, et il faut de toute nécessité que je rende compte de vous. »</p>
      <h3>109</h3>
      <p>1 « Guérissez-vous donc, pendant que la tour est encore en construction. 2 Le Seigneur habite dans les hommes qui aiment la paix ; car la paix lui est vraiment chère ; mais il est loin des querelleurs et de ceux que leur malice a perdus. Rendez-lui donc l’esprit intact, comme vous l’avez reçu. 3 Si tu donnes au foulon un vêtement neuf et intact, et que tu veuilles le recevoir intact, mais que le foulon te le rende déchiré, le recevras-tu ? Ne t’emporteras-tu pas aussitôt et ne le poursuivras-tu pas de reproches, en disant : “Je t’ai donné un vêtement intact ; pourquoi l’as-tu déchiré et l’as-tu rendu inutile ? Car à cause de la déchirure que tu y as faite, il ne peut plus servir.” Ne diras-tu pas toutes ces paroles au foulon au sujet de la déchirure qu’il a faite à ton vêtement ? 4 Si donc toi, tu t’affliges de ton vêtement et te plains de ne pas le recevoir intact, que penses-tu que le Seigneur te fera, lui qui t’a donné un esprit intact, que tu as rendu tout à fait inutile, en sorte qu’il ne puisse plus servir en rien à son maître ? Car son usage a commencé d’être inutile du jour où tu l’as corrompu. Le Seigneur de cet esprit ne te fera-t-il pas mourir à cause de cette action ? » 5 « Certainement, dis-je, il frappera tous ceux qu’il trouvera demeurer dans le souvenir des offenses. » Il dit : « N’allez pas fouler aux pieds sa clémence, mais plutôt honorez-le de ce qu’il est si patient envers vos fautes et qu’il n’est pas comme vous. Faites donc une pénitence qui vous soit utile. »</p>
      <h3>110</h3>
      <p>1 « Toutes ces choses qui sont écrites ci-dessus, c’est moi, le Pasteur, l’ange de la pénitence, qui les ai montrées et dites aux serviteurs de Dieu. Si donc vous croyez, si vous écoutez mes paroles, si vous marchez en elles et si vous corrigez vos voies, vous pourrez vivre. Mais si vous demeurez dans la malice et le souvenir des offenses, aucun de ceux-là ne vivra pour Dieu. Toutes ces choses que je devais dire vous ont été dites de ma part. » 2 Le Pasteur lui-même me dit : « M’as-tu interrogé sur tout ? » Et je dis : « Oui, Seigneur. » « Pourquoi donc ne m’as-tu pas interrogé sur la forme des pierres placées dans la construction et que nous avons comblées ? » Et je dis : « Je l’ai oublié, Seigneur. » 3 « Écoute maintenant, dit-il, ce qui les concerne. Ce sont ceux qui ont maintenant entendu mes préceptes ; et comme, de toutes leurs entrailles, leur pénitence était bonne et pure et qu’ils pouvaient y demeurer, le Seigneur a ordonné que leurs péchés antérieurs soient effacés. Car ces formes étaient leurs péchés, et elles ont été comblées, afin qu’elles ne parussent plus. »</p><h2>Similitude X</h2>
      <h3>111</h3>
      <p>1 Après que j’eus achevé d’écrire ce livre, l’ange qui m’avait remis à ce Pasteur vint dans la maison où j’étais, s’assit sur le lit, et le Pasteur se tint debout à sa droite. Puis il m’appela et me dit ces paroles : 2 « Je t’ai remis, dit-il, toi et ta maison à ce Pasteur, afin que tu sois par lui protégé de toute vexation et de toute cruauté, et que tu aies succès en toute œuvre et parole bonne, et toute la vertu de l’équité ; marche dans ses préceptes, que je t’ai donnés, et tu pourras dominer toute malice. 3 Car si tu gardes les préceptes de celui-ci, toute convoitise et toute douceur de ce siècle te seront soumises, et le succès en tout bien te suivra. Reçois en toi sa maturité et sa modestie, et dis à tous qu’il est en grand honneur et en grande dignité auprès du Seigneur, qu’il est préposé à une grande puissance et qu’il est puissant dans son office. À lui seul, par tout l’univers, le pouvoir de la pénitence a été confié. Te semble-t-il puissant ? Mais vous, sa maturité et la retenue qu’il a envers vous, vous les méprisez. »</p>
      <h3>112</h3>
      <p>1 Je lui dis : « Interroge-le lui-même, Seigneur : depuis qu’il est dans ma maison, ai-je fait quelque chose contre l’ordre, quelque chose qui l’ait offensé ? » 2 Il dit : « Et moi, je sais que tu n’as rien fait contre l’ordre et que tu ne feras rien. Et c’est pourquoi je te parle ainsi, afin que tu persévères. Car le Pasteur a eu de toi, auprès de moi, une bonne opinion. Toi, tu diras ces paroles aux autres, afin que ceux qui ont fait ou feront pénitence éprouvent les mêmes sentiments que toi, et qu’il en dise du bien devant moi, et moi devant le Seigneur. » 3 Je dis : « Et moi, Seigneur, j’annonce à tout homme les grandeurs du Seigneur ; et j’espère que tous ceux qui ont péché auparavant, s’ils entendent ces choses, feront volontiers pénitence et recouvreront la vie. » 4 Il dit : « Demeure donc dans ce ministère et achève-le. Tous ceux qui accomplissent les préceptes de celui-ci auront la vie, et lui, auprès du Seigneur, un grand honneur. Tous ceux, au contraire, qui n’observent pas les préceptes de celui-ci s’écartent de leur propre vie et se dressent contre lui ; ils ne suivent pas ses préceptes, mais se livrent à la mort, et chacun d’eux se rend coupable de son propre sang. Mais à toi je dis : mets-toi au service de ces préceptes, et tu auras le remède de tes péchés. »</p>
      <h3>113</h3>
      <p>1 « J’ai envoyé ces vierges pour qu’elles habitent avec toi ; car j’ai vu qu’elles sont affables envers toi. Tu les as donc pour aides, afin que tu puisses mieux garder les préceptes de celui-ci ; car il ne se peut pas que, sans ces vierges, ces préceptes soient gardés. Je vois qu’elles sont volontiers avec toi ; mais je leur donnerai l’ordre de ne s’écarter en rien de ta maison. 2 Quant à toi, purifie seulement ta maison ; car elles sont pures, chastes, laborieuses, et toutes ont grâce auprès du Seigneur. Si donc elles trouvent ta maison pure, elles demeureront avec toi. Mais s’il y survient un peu de souillure, aussitôt elles quitteront ta maison ; car ces vierges n’aiment en aucune façon la souillure. » 3 Je lui dis : « J’espère, Seigneur, leur plaire, de sorte qu’elles habitent toujours volontiers dans ma maison. Et de même que celui à qui tu m’as remis ne me blâme pas, elles non plus ne me blâmeront pas. » 4 Il dit au Pasteur : « Je sais que le serviteur de Dieu veut vivre, qu’il gardera ces préceptes et établira les vierges dans la pureté. » 5 Ayant dit cela au Pasteur, il me confia de nouveau à lui, appela les vierges et leur dit : « Puisque je vois que vous habitez volontiers dans la maison de celui-ci, je vous le recommande, lui et sa maison, afin que vous ne vous écartiez jamais de sa maison. » Elles, de leur côté, écoutèrent ces paroles avec plaisir.</p>
      <h3>114</h3>
      <p>1 Il me dit ensuite : « Comporte-toi en homme dans ce ministère, annonce à tout homme les grandeurs du Seigneur, et tu auras grâce en ce ministère. Quiconque donc marchera dans ces préceptes vivra et sera heureux dans sa vie ; quiconque, au contraire, les aura négligés ne vivra pas et sera malheureux dans sa vie. 2 Dis à tous ceux qui peuvent faire le bien de ne pas cesser ; il leur est utile de pratiquer les bonnes œuvres. Mais je dis qu’il faut arracher tout homme à la détresse. Car celui qui est dans le besoin et souffre chaque jour la détresse est dans un grand tourment et une grande nécessité. 3 Celui donc qui arrache à la nécessité l’âme d’un tel homme s’acquiert une grande joie. Car celui qui est tourmenté par une telle détresse est torturé d’un tourment pareil, comme celui qui est dans les liens. Beaucoup, en effet, à cause de telles calamités, ne pouvant les supporter, se donnent la mort. Celui donc qui connaît la calamité d’un tel homme et ne l’en arrache pas commet un grand péché et se rend coupable de son sang. 4 Faites donc de bonnes œuvres, vous tous qui avez reçu du Seigneur, de peur que, tandis que vous tardez à les faire, la construction de la tour ne s’achève. Car c’est à cause de vous que l’ouvrage de sa construction a été interrompu. Si donc vous ne vous hâtez pas à bien faire, la tour sera achevée, et vous serez exclus. » 5 Après qu’il eut achevé de me parler, il se leva du lit et, prenant avec lui le Pasteur et les vierges, il partit ; mais il me dit qu’il renverrait chez moi ce Pasteur et les vierges.</p>
