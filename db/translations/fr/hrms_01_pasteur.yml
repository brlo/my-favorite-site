      <p>Traduction : Rodion Vlasov, avec l’aide de l’IA, d’après le texte grec publié sur le site. Les citations bibliques suivent la traduction Louis Segond (1910). La numérotation des chapitres et des versets est celle de l’édition grecque.</p><p>Le texte source est par endroits lacunaire ou corrompu. Les leçons manifestement fautives sont traduites d’après le sens et, pour les visions, d’après la version latine ; en Vis. I, 4, 2, la fin de la phrase manque dans le grec et nous traduisons « ces dernières paroles sont pour les justes ; les premières, pour les païens et les apostats ». En Précepte IV, 29, la fin du v. 6 et le v. 7, omis par le grec du site, sont rétablis d’après la tradition du texte. Les omissions du grec en Précepte VI (v. 8) et XI (v. 17) ne sont pas comblées et la numérotation y suit le grec. À partir de la Similitude IX (ch. 107), le texte source passe au latin : la fin de l’ouvrage est traduite d’après cette version latine.</p>
