      <h2>Biographie</h2><h3>Notions générales</h3><p>Titus Flavius Clément d’Alexandrie (~150-215) est vénéré par l’Église comme philosophe chrétien, maître de la foi et témoin de la Tradition.</p><p>La date exacte de la naissance de Clément, ainsi que la chronologie de son enfance et de sa jeunesse, nous sont inconnues.</p><p>On affirme qu’il vit le jour dans la seconde moitié du IIe siècle. Selon les diverses estimations, la patrie d’origine de Clément d’Alexandrie serait soit Alexandrie, soit Athènes.</p><p>Il y a lieu de penser que ses parents appartenaient à la noblesse païenne.</p><p>Les œuvres littéraires composées par Clément témoignent d’un niveau de culture élevé. Il est évident que Clément maîtrisait la philosophie et l’art du discours, connaissait la mythologie antique et se mouvait avec aisance parmi les subtilités des mystères païens.</p><p>Il est remarquable qu’aujourd’hui, sur toute une série de questions touchant aux rites païens, les écrits de Clément constituent pour ainsi dire l’unique source première.</p><h3>La vie chrétienne</h3><p>Les renseignements sur les circonstances précises de la conversion de Clément au Christ ne nous sont pas parvenus.</p><p>Certains estiment qu’il s’intéressa d’abord au christianisme moins par désir de suivre le Christ que pour acquérir un surcroît de connaissances. Cependant, s’étant familiarisé de plus près avec la doctrine chrétienne, il en reconnut la vérité et l’incontestable supériorité sur les croyances et la philosophie païennes.</p><p>Afin d’élever son niveau de culture, Clément entreprit des voyages dans divers pays d’Occident et d’Orient (en Italie du Sud, en Palestine, en Syrie), jusqu’à ce qu’il trouvât enfin la paix de l’âme en Égypte.</p><p>Au cours de ses voyages, il rencontra de nombreux hommes dignes de louange, parmi lesquels ceux qui avaient reçu la foi directement des disciples des apôtres.</p><p>Vers l’an 180, peu après son arrivée en Égypte, il fit la connaissance de Pantène, directeur de l’école catéchétique d’Alexandrie. Le rôle de cette école dans le développement de la science théologique et la diffusion de la foi fut si considérable qu’on le compare, pour l’importance, au rôle éminent que joua l’Académie de Platon pour la philosophie.</p><p>Chrétien zélé et cultivé, Pantène sut affermir Clément dans la foi.</p><p>Séjournant à Alexandrie, Clément ne se familiarisa pas seulement avec le christianisme, mais aussi avec la doctrine des gnostiques et avec la littérature judéo-hellénistique. L’œuvre du célèbre penseur Philon d’Alexandrie exerça sur lui une grande influence. Cependant, en tant que chrétien, il demeurait dans les limites de la Tradition de l’Église.</p><p>Vers l’an 189, il fut jugé digne de la charge de maître de l’école d’Alexandrie et devint l’auxiliaire et le collaborateur de Pantène.</p><p>Vers l’an 190, après que Pantène eut quitté Alexandrie, Clément fut élevé à la dignité sacerdotale et prit la direction de l’école.</p><p>Bientôt, il acquit une large notoriété et fut reconnu comme écrivain ecclésiastique et théologien faisant autorité.</p><p>Il fut parmi les premiers à tenter de systématiser les dogmes de la foi et à donner à la théologie une forme scientifique, en soutenant qu’une connaissance approfondie et intime de la foi est nécessaire au développement spirituel. Clément regardait les autres sciences et la philosophie comme un moyen qui favorise le développement et la transformation de la personne. Quant à la philosophie, il la considérait comme un pédagogue qui conduit au Christ.</p><p>Dans ses œuvres, il défendit avec ardeur la vérité de la religion chrétienne, exposa le contenu des dogmes et réfuta l’existence réelle des dieux païens.</p><p>Dans son activité littéraire, il manifesta une érudition considérable. Ses œuvres immortelles renferment de nombreux extraits non seulement de l’Écriture sainte, mais encore de la littérature chrétienne primitive, d’ouvrages tels que la « Didachè », l’épître de Clément de Rome, le « Pasteur » d’Hermas et l’épître de Barnabé.</p><p>Les traités de Clément — le « Protreptique », le « Pédagogue », les « Stromates » et d’autres encore — sont inscrits dans l’histoire de l’Église comme quelques-unes des meilleures œuvres de la pensée chrétienne.</p><h3>Le départ d’Alexandrie</h3><p>En 202, au cours d’une nouvelle persécution des chrétiens, déchaînée sous le règne de Septime Sévère, Clément fut contraint de quitter Alexandrie, qu’il chérissait.</p><p>Le lieu de son séjour ultérieur est inconnu. On suppose qu’il quitta Alexandrie pour se retirer chez l’un de ses disciples, probablement Alexandre, devenu, par la Providence de Dieu, évêque de Césarée de Cappadoce, puis évêque de Jérusalem.</p><p>En 211, Alexandre, alors en captivité, envoya par Clément une lettre à l’Église d’Antioche. Il le décrivit alors comme un homme bienheureux, éprouvé et vertueux. Il y a lieu de penser qu’en l’absence d’Alexandre, Clément prit soin de son troupeau, éclairant et affermissant la communauté orpheline.</p><p>Les renseignements sur les dernières années de sa vie sont extrêmement rares. On situe la mort de Clément d’Alexandrie entre 215 et 217.</p><h2>La foi</h2><h3>La culture du champ de l’Église par l’Écriture et la Tradition — deux moyens équivalents</h3><blockquote><p><em>Si donc la moisson est grande, et qu’il y ait peu d’ouvriers, en vérité, il faut prier pour que le nombre des ouvriers s’accroisse. Or, </em><strong><em>on ensemence de deux manières le champ de l’Église</em></strong><em> ; </em><strong><em>par <mark>la parole</mark> et par les écrits</em></strong><em>. Mais </em><strong><em><mark>de quelque manière</mark> que l’ouvrier du Seigneur sème le divin froment</em></strong><em>, </em><strong><em><mark>de quelque manière</mark> qu’il fasse croître et qu’il moissonne les épis</em></strong><em>, on reconnaîtra <mark>toujours</mark> en lui un ouvrier vraiment divin.</em></p></blockquote><p>(<a href="https://azbyka.ru/otechnik/Kliment_Aleksandrijskij/stromaty-perevod-n-korsunskogo/1">Stromates, livre 1 (en russe)</a>)</p><h3>Nécessité de la Tradition pour une compréhension juste de l’Écriture</h3><blockquote><p><em>Que font donc </em><strong><em>les téméraires qui abordent les discours impies et les transmettent à leurs adhérents ? <mark>Ils corrompent les divines Écritures dont ils abusent</mark></em></strong><em> ; ils se ferment à eux-mêmes l’entrée du ciel ; et ils égarent, loin de la vérité, les victimes qu’ils ont trompées. </em><strong><em><mark>N’ayant pas la clé qui ouvre la porte d’entrée</mark>, pour s’introduire, <mark>comme nous le faisons, en tirant le voile et par la tradition du Seigneur</mark></em></strong><em>, à la clé véritable ils substituent la fausse clé, la clé de derrière, pour parler la langue proverbiale ; ils abattent la porte, ils percent ténébreusement le mur de l’Église, et, sacrilèges violateurs de la vérité, ils se proclament les initiateurs des mystères impies de l’âme.</em></p></blockquote><p>(<a href="https://azbyka.ru/otechnik/Kliment_Aleksandrijskij/stromaty/7_17">Stromates, 7 (en russe)</a>)</p><blockquote><p><strong><em>Les Traditions[1] racontent</em></strong><em> que l’apôtre Mathias répétait par intervalle : « Si le voisin d’un élu vient à pécher, l’élu a péché</em></p><p><em>…</em></p><p><em>Tous les hommes ont donc le même jugement. Les uns, dociles aux décisions du Verbe, s’appuient sur des autorités qui font foi. Les autres, après s’être livrés aux plaisirs déréglés, </em><strong><em>torturent les livres saints pour les ployer à leurs fantaisies.</em></strong><em> Nous ne le dissimulons pas, il faut au zélateur de la vérité une grande force d’âme. Car ceux qui entreprennent les plus grandes choses sont exposés aux chutes les plus terribles, s’ils ne gardent fidèlement </em><strong><em>la règle de la vérité qu’ils ont reçue de la vérité elle-même.</em></strong></p><p><em>…</em></p><p><em>Mais les infortunés qui se sont jetés hors de la voie droite trébuchent, la plupart du temps, dans les questions particulières. Faut-il s’en étonner ? Ils, </em><strong><em><mark>ne possèdent point, dans le discernement du mensonge et de la vérité</mark>, un jugement que l’exercice ait pleinement formé aux déterminations vers le bien. Assurément, s’ils l’avaient, ils ne manqueraient point de se soumettre à l’autorité de l’Église</em></strong><em>. Pareil à ces hommes qui seraient métamorphosés en bêtes, comme il arriva, dit la fable, à ceux qui trempèrent leurs lèvres aux poisons de Circé, quiconque </em><strong><em><mark>regimbe contre la tradition de l’Église</mark></em></strong><em> pour embrasser les opinions humaines, perd au même instant la qualité de créature de Dieu et de serviteur fidèle au Seigneur.</em></p><p><em>…</em></p><p><em>— Mais les hérétiques, me dira-t-on, appellent aussi à leur secours les </em><strong><em>traditions apostoliques</em></strong><em>, — À cela nous répondons qu’ils n’admettent pas tous les livres saints, ni chaque livre dans son intégrité, ni avec le sens que réclament le corps et la contexture de la prophétie. Mais que font-ils ? Ils choisissent à dessein quelques passages obscurs qu’ils « </em><strong><em><mark>ploient à leurs propres opinions</mark></em></strong><em>, </em><strong><em><mark>en se bornant à des mots isolés</mark></em></strong><em>, et en s’arrêtant à la lettre au lieu d’entrer dans l’esprit véritable du texte sacré. Telle est leur tactique ordinaire dans les passages qu’ils allèguent. </em><strong><em><mark>N’envisageant que les mots, ou bien ils en altèrent la signification</mark></em></strong><em>, ou bien ils ignorent quel est le sens légitime, ou bien ils enlèvent à l’autorité qu’ils mettent en avant son intention primitive.</em></p><p><em>…</em></p><p><em>Comme ils n’ont ni étudié les mystères de la connaissance dont l’Église a le dépôt, ni compris l’excellence de la vérité, parce que leur incurie, </em><strong><em>contente de lire à la surface</em></strong><em>, a négligé de pénétrer jusque dans le fond des choses, ils ont dit adieu aux Écritures.</em></p><p><em>…</em></p><p><em>Chez nous l’admission de la vérité part d’un principe certain, afin d’amener la foi à croire ce qu’elle ne croit pas encore.</em></p><p><em>…</em></p><p><em>On appelle vides, non pas seulement les amandes qui ne renferment pas de fruits, mais encore celles qui ne renferment qu’une pulpe inutile. Par une dénomination semblable, nous disons qu’ils sont vides de la volonté de Dieu, </em><strong><em><mark>vides des traditions du Christ</mark></em></strong><em>, les hérétiques qui, non moins amers que l’amande sauvage, se constituent les chefs de leurs propres dogmes, à moins que, grâce à l’évidence de la vérité, ils n’aient été contraints d’en garder quelques-uns qu’ils n’ont pu ni déposer ni soustraire… </em><strong><em>ils opposent par des raisonnements étrangers <mark>les pensées de l’homme aux traditions de Dieu</mark> pour constituer l’hérésie… </em></strong><em>Le Gnostique est donc le seul qui, </em><strong><em>ayant vieilli sur les Écritures et gardant l’inviolable pureté des <mark>dogmes qui lui viennent des apôtres et de l’Église</mark></em></strong><em>, vive d’une vie bien réglée selon l’Évangile et trouve des démonstrations telles qu’il les cherche. Faut-il s’en étonner ? Il s’inspire du Seigneur, de la loi et des prophètes. La vie du Gnostique, en effet, ne me semble qu’un enchaînement d’actions et de paroles </em><strong><em><mark>conformes aux traditions</mark> du Seigneur.</em></strong></p></blockquote><p>(<a href="https://azbyka.ru/otechnik/Kliment_Aleksandrijskij/stromaty/7_17">Stromates, 7 (en russe)</a>)</p><blockquote><p><em>Il faut que les futurs initiés passent par quelques expiations préparatoires avant que les mystères leur soient livrés, afin que </em><strong><em>les traditions erronées fassent place aux traditions véritables</em></strong><em>.</em></p><p><em>…</em></p><p><em>Or, le Christ est tout ensemble le fondement et l’édifice, le principe et la fin de toutes choses. Le principe et la fin de toutes choses, c’est-à-dire la foi et la charité, ne sont pas l’objet de l’enseignement, tandis que </em><strong><em><mark>la connaissance qui nous est communiquée par la tradition suivant la grâce de Dieu</mark>…</em></strong></p></blockquote><p>(<a href="https://azbyka.ru/otechnik/Kliment_Aleksandrijskij/stromaty-perevod-n-korsunskogo/7">Stromates, 7 (en russe)</a>)</p><h3>La vraie chair et le vrai sang du Christ dans l’Eucharistie</h3><p>La manne est le pain du ciel ; mais le Fils de Dieu, le Christ, est le vrai pain du ciel, donné par le Père. Qui a mangé le pain du ciel ordinaire (la manne) est mort ; qui mangera le vrai pain (le Christ) ne mourra pas. De ce vrai pain (du Christ) <strong>notre chair se nourrit</strong> par l’Eucharistie.</p><blockquote><p><strong><em><mark>Il est le pain du ciel</mark></em></strong><em> et la nourriture spirituelle de la vie, abondante pour la nourriture et pour la connaissance, la lumière des hommes, c’est-à-dire de l’Église. Ceux qui ont mangé le pain du ciel (la manne dans le désert — note) sont morts, </em><strong><em>mais celui qui mange le vrai pain spirituel ne mourra pas.</em></strong><strong><em><mark>Le « pain vivant » est le Fils, donné par le Père à ceux qui désirent en manger</mark></em></strong><em>. « Le pain que je donnerai, dit-il, c’est ma chair » (Jn 6, 51), ou bien </em><strong><em><mark>(le pain) dont se nourrit </mark><u><mark>la chair</mark></u><mark> par l’eucharistie</mark></em></strong><em>, ou, ce qui est plus vrai, sa chair est son corps, « qui est l’Église » (cf. Jn 6, 51 ; Ps 77, 24), le « pain du ciel », l’assemblée bénie, parce que les élus, par leur essence même, </em><strong><em><mark>sont issus d’une même nature</mark></em></strong><em> et </em><strong><em><mark>parviendront à la même fin</mark></em></strong><em>.</em></p></blockquote><p>(<a href="https://azbyka.ru/otechnik/Kliment_Aleksandrijskij/izvlechenija-iz-feodota-i-izbrannye-mesta-iz-prorocheskih-knig/#sel=32:3,32:103">« Extraits des œuvres de Théodote et de ce qu’on appelle l’enseignement oriental du temps de Valentin », § 13 (en russe)</a>)</p><p>Le sang qui est dans le Christ sert de breuvage à l’homme :</p><blockquote><p><em>C’est-à-dire qu’il attache au Verbe un peuple simple et nouveau. </em><strong><em>C’est le Verbe qui est la vigne ; comme la vigne produit le <mark>vin</mark>, le Verbe donne son <mark>sang</mark></em></strong><em> ; et </em><strong><em><mark>de ces deux breuvages salutaires à l’homme</mark></em></strong><em>, </em><strong><em>l’un nourrit son corps, l’autre guérit son âme et la sauve</em></strong><em>.</em></p></blockquote><p>(<a href="https://azbyka.ru/otechnik/Kliment_Aleksandrijskij/pedagog/#sel=93:1,94:31;61:47,61:77">Le Pédagogue, livre I, chapitre 4 (en russe)</a>)</p><p>Nous buvons la nature corporelle du sang du Christ (qui rachète et qui sauve), et par là nous sommes délivrés de la mort. Par le sacrement de l’Eucharistie, l’esprit de l’homme s’unit mystérieusement à l’Esprit Saint, et la chair au Logos (au Verbe, au Christ) ; c’est pourquoi le Verbe s’est fait chair (afin que nous puissions nous unir à lui par la manducation) :</p><blockquote><p><em>… la sainte vigne produisit la grappe prophétique, c’est-à-dire le Verbe, dont le </em><strong><em><mark>sang</mark></em></strong><em> mêlé avec l’eau, suivant sa volonté, est le signe de ceux qui de l’erreur sont entrés dans le repos. … </em><strong><em>Le sang du Seigneur est de deux natures, l’un charnel, qui nous rachète de la mort ; l’autre spirituel, qui nous purifie. Boire le sang de Jésus, c’est participer à l’incorruptibilité du Seigneur</em></strong><em>. L’esprit est la force du Verbe, comme le sang est la force de la chair. Comme le vin se mêle avec l’eau, l’esprit est mêlé avec l’homme. </em><strong><em>Ce mélange de l’un et de l’autre, je veux dire du Verbe et de la boisson, s’appelle Eucharistie</em></strong><em>, qui signifie </em><strong><em>actions de grâces</em></strong><em> ; et </em><strong><em><mark>ce sacrement sanctifie l’âme et le corps de ceux qui y participent avec foi</mark></em></strong><em>, lorsque </em><strong><em><mark>la volonté divine a mystiquement mélangé, par l’Esprit et le Verbe</mark></em></strong><em>, ce divin breuvage qui représente l’homme. </em><strong><em><mark>L’esprit, en effet, s’y mêle à l’âme, et le Verbe à la chair</mark></em></strong><em>.</em></p></blockquote><p>(<a href="https://azbyka.ru/otechnik/Kliment_Aleksandrijskij/pedagog/#0_17">Le Pédagogue, livre II, chapitre 2. Comment se comporter à l’égard de la boisson (en russe)</a>)</p><p>Clément compare l’Eucharistie à la nourriture des nouveau-nés. Il montre que, dans le sein de la mère, le sang se change en lait, dont elle nourrit ses enfants. C’est une allusion à l’enseignement de l’Église sur l’Eucharistie : de même que chez la mère le sang devient lait par un changement (une transformation), puis est donné à l’enfant, de même dans l’Église le pain et le vin deviennent le corps et le sang du Christ, puis sont donnés au croyant.</p><p>Parlant ensuite de l’Église elle-même, Clément dit que ce lait (c’est-à-dire la chair et le sang) n’est pas produit par l’Église, mais qu’il est le Christ lui-même, né au milieu des souffrances corporelles, arrosé de son sang précieux. Il s’agit d’un corps réel. La distribution, par l’Église, de la chair et du sang du Christ, il l’appelle un mystère admirable :</p><blockquote><p><em>Le lait est donc semblable en tout à la nourriture spirituelle, qui est douce comme la grâce, nourrissante comme la vie, blanche comme le Christ. </em><strong><em><mark>Nous avons déjà prouvé que le sang du Verbe possède toutes les propriétés du lait</mark></em></strong><em>. Le Christ nous offre son sang de la même manière que le lait est fourni à l’enfant après l’accouchement. Les mamelles, qui se tenaient droites et fermes, il semble qu’elles soient instruites à lui présenter une nourriture facile à prendre, nourriture élaborée précédemment par la nature. C’est ainsi que le fidèle puise le lait du salut. Les mamelles </em><strong><em><mark>ne sont pas pleines d’un lait disposé d’avance</mark>, comme les sources qui contiennent une onde pure : le lait s’y élabore <mark>à mesure que les aliments changent de nature</mark>, et <mark>il en jaillit</mark></em></strong><em>. C’est ainsi que </em><strong><em>Dieu, nourricier et père de tous les êtres engendrés et régénérés, prépare de ses propres mains la nourriture la plus convenable à l’enfant nouveau-né</em></strong><em> ; comme la manne, aliment céleste des hommes, était répandue du haut du ciel pour les anciens hébreux. De là vient sans doute que les nourrices donnent encore aujourd’hui le nom de manne au premier lait qui s’épanche de leur sein. Au reste, les femmes enceintes, lorsqu’elles deviennent mères, donnent naturellement du lait. Notre Seigneur Jésus-Christ, le fruit d’une vierge, n’appelle point heureuses les mamelles d’une femme. Il n’en tire point sa subsistance : mais, envoyé du haut du ciel, comme une rosée, par un père plein de bonté et d’amour pour les hommes, il se donne lui-même aux hommes sages, comme une nourriture spirituelle. </em><strong><em>Ô miracle mystique</em></strong><em> ! Il n’y a qu’un Père, un Verbe, un Saint-Esprit. Ce Dieu unique est le père de tous les êtres, et il est présent par tout. Il n’y a qu’</em><strong><em><mark>une mère</mark></em></strong><em> qui soit vierge, </em><strong><em><mark>c’est l’Église</mark></em></strong><em>, à qui j’aime de donner ce nom. </em></p><p><em>C’est la seule mère qui n’ait point eu de lait parce qu’elle est la seule qui n’ait point été femme. Elle est tout ensemble vierge et mère, pure comme une vierge, tendre comme une mère. </em><strong><em><mark>Elle appelle et réunit autour d’elle ses enfants, qu’elle nourrit du lait de sa parole</mark></em></strong><em> ; </em><strong><em><mark>elle n’a point eu de lait parce que le corps de Jésus-Christ est la nourriture qu’elle donne à ses enfants, à ce peuple nouveau que les souffrances du Seigneur ont produit, dont lui-même a enveloppé le corps naissant et qu’il a lavé de son sang précieux</mark></em></strong><em>. Ô saint enfantement ! ô soins admirables ! </em><strong><em>le Verbe est tout pour l’enfant</em></strong><em> à qui il a donné la naissance. Il est son père et sa </em><strong><em><mark>mère</mark></em></strong><em>, son Pédagogue et sa nourrice. </em><strong><em><mark>« Mangez ma chair, nous dit-il, et buvez mon sang. »</mark></em></strong> <strong><em><mark>C’est la nourriture exquise que le Seigneur nous donne</mark></em></strong><em> : </em><strong><em><mark>il offre sa chair, il verse son sang</mark></em></strong><em>, afin que ses enfants ne manquent de rien pour se nourrir et pour croître.</em></p></blockquote><p>Aussitôt après avoir expliqué la doctrine littérale de l’Eucharistie, Clément propose une manière supplémentaire de la comprendre — symbolique, qui n’abolit point l’interprétation littérale qu’il vient d’exposer. Il précise qu’il présente cet exposé sous un autre angle encore :</p><blockquote><p><strong><em><mark>Désirez-vous de ces mystères une explication moins savante et plus commune ?</mark></em></strong><em> (*</em> <strong><em>plus large</em></strong><em>, grec — κοινότερον δὲ ἴσως, latin — sed fortasse communius, PG 8:301-302 ; angl. — but perchance more generally) </em><strong><em><mark>Écoutez ce que je vais vous dire</mark></em></strong><em>. </em><strong><em>Le Saint-Esprit, qui a formé la chair du Sauveur, est le symbole de la chair…</em></strong></p><p><strong><em>[après avoir expliqué l’Eucharistie de façon réaliste, Clément propose maintenant un sens supplémentaire — symbolique, qu’il développera plus loin…]</em></strong></p></blockquote><p>(<a href="https://azbyka.ru/otechnik/Kliment_Aleksandrijskij/pedagog/#0_7">Le Pédagogue, livre I, chapitre 6. Contre ceux qui pensent que les noms d’« enfants » et de « petits enfants » désignent le premier degré de l’instruction (en russe)</a>)</p><h3>L’unité visible de l’Église</h3><blockquote><p><em>En effet, que </em><strong><em>leurs conciliabules sans autre autorité que celle de l’homme, soient postérieurs à l’Église catholique</em></strong><em>, il ne faut pas de longs arguments pour décider la question. La prédication du Seigneur, manifestée par son Incarnation, commence à Auguste et finit à peu près vers le milieu du règne de Tibère. La prédication de ses apôtres, y compris le ministère de Paul, s’achève sous Néron. Ce ne fut que plus tard, vers l’époque de l’empereur Adrien environ, que parurent les chefs de l’hérésie. Ils se propagèrent jusqu’au règne du premier Antonin, tel que Basilide, par exemple, quoi qu’il se donne pour disciple de Glaucias, qui lui-même, s’il en faut croire les Novateurs, fut l’interprète de Pierre. On dit aussi que Valentin eut pour maître Theudas, disciple de Paul. Quant à Marcion, qui naquit à peu près en même temps que ces derniers, sa vieillesse s’éteignit dans des sectes plus jeunes que la sienne. Avant lui, Simon put entendre un moment les prédications de Pierre. Si ce calcul est juste, la priorité et la légitimité de l’Église attestent manifestement que </em><strong><em>les sectes qui naquirent après elle et celles qui touchent à notre époque, filles du temps, sont marquées du sceau honteux de l’adultère. Il sort de ce qui précède qu’il n’y a qu’une seule Église véritable, l’Église, à laquelle appartient à juste titre l’antériorité, et dans le catalogue de laquelle sont inscrits ceux qui sont justes avec la ferme volonté de l’être.</em></strong><em> Il n’y a qu’un Dieu, qu’un seul Seigneur. Conséquemment la chose éminemment digne de notre vénération ici-bas, se distingue aussi par son unité, </em><strong><em>reflet du principe unique. <mark>L’Église qui est une et que les Novateurs essaient de diviser violemment en une infinité d’Églises, s’unit donc inséparablement dans l’individualité d’une seule et même nature</mark></em></strong><em>. </em><strong><em><mark>Essence, dogme, principe, excellence, nous proclamons une sur chacun de ces points l’Église ancienne, l’Église catholique, dont tous les membres conspirent vers l’unité d’une même foi et qui s’appuie sur les Testaments particuliers, je me trompe, sur le Testament qui conserva son inviolable unité aux diverses époques, où, d’après la volonté d’un seul Dieu et par un seul Seigneur, il convoque sous ses lois les élus et les prédestinés de Dieu</mark></em></strong><em>, parce que Dieu connaissait, par sa prescience, même avant le berceau du monde, que ces élus et ces prédestinés pratiqueraient la justice. Au reste, la dignité de l’Église, non moins que son principe constitutif, repose sur l’unité ; supérieure à tout ce qui existe, elle ne connaît rien sur la terre qui lui ressemble ou qui l’égale. Mais nous nous réservons de traiter ensuite cette matière.</em></p></blockquote><p>(<a href="https://azbyka.ru/otechnik/Kliment_Aleksandrijskij/stromaty/7#sel=228:1,228:333">Stromates, livre 7, XVII. De l’antiquité de la tradition ecclésiastique</a>)</p><h3>Les trois ordres de la hiérarchie ecclésiastique</h3><blockquote><p><em>« “Les premiers d’entre les élus, dit Jean, sont ceux qui se sont élevés jusqu’à la perfection de la connaissance, et qui, membres de l’Église, ont été honorés de la plus grande gloire, juges et administrateurs, choisis indifféremment parmi les Juifs et parmi les Grecs, ils siégent au nombre de vingt-quatre parce que le bienfait de la grâce a été doublé.” </em><strong><em><mark>La hiérarchie de l’Église terrestre</mark> avec son <mark>épiscopat, sa prêtrise, son diaconnat</mark></em></strong><em>, n’est sans doute qu’une image de la gloire angélique… »</em></p></blockquote><p>(<a href="https://azbyka.ru/otechnik/Kliment_Aleksandrijskij/stromaty/6">Stromates VI, XIII</a>)</p><blockquote><p><em>« Les saints livres sont en outre remplis de préceptes qui s’adressent expressément les uns aux </em><strong><em><mark>évêques, les autres aux prêtres, ceux-ci aux diacres</mark></em></strong><em>, ceux-là aux veuves dont nous aurons occasion de parler ailleurs. »</em></p></blockquote><p>(<a href="https://azbyka.ru/otechnik/Kliment_Aleksandrijskij/pedagog/">Le Pédagogue</a>)</p><h3>Les fidèles se nommaient eux-mêmes orthodoxes</h3><blockquote><p><em>« Mais ceux </em><strong><em>que l’on nomme</em></strong><em> </em><strong><em><mark>orthodoxes</mark></em></strong><em> se porteraient-ils vers des œuvres louables, sans savoir ce qu’ils font ? »</em></p></blockquote><blockquote><p><em>And do not </em><strong><em>those who are called <mark>orthodox</mark> apply themselves</em></strong><em> to good works, knowing not what they do?</em></p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/ClAl_Stromates_1">Stromates 1, 9</a>)</p><blockquote><p><em>«1.9.45.6 πάντα ἔπρασσεν; ἐργάζεται δὲ καὶ τὰ κτήνη ἐλαυνόμενα ἀναγκάζοντι τῷ φόβῳ. οὐχὶ δὲ καὶ οἱ </em><strong><em>ὀρθοδοξασταὶ</em></strong><em> καλούμενοι ργοις προσφέρονται καλοῖς, οὐκ εἰδότες ἃ ποιοῦσιν;»</em></p></blockquote><p>(<a href="https://bibleox.com/fr/grc/w/6YGl_%CE%A3%CF%84%CF%81%CF%8E%CE%BC%CE%B1%CF%84%CE%B1_1">Stromates</a>)</p><h3>Il nomme Écriture le livre de la Sagesse de Jésus, fils de Sirach</h3><blockquote><p>déjà, selon l’Écriture : <em>« l’éducation est pour l’homme sensé un ornement d’or »</em> (Si 21, 24)</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/ClAl_P%C3%A9dagogue_3">Le Pédagogue, 3, 11</a>)</p><h3>Les symboles chrétiens sur les anneaux</h3><blockquote><p>Quant à l’anneau qu’il nous est permis d’avoir, il ne faut point le porter au même doigt que les femmes, mais à l’extrémité du petit doigt, afin qu’il n’embarrasse point l’usage de la main et qu’il ne s’en échappe point facilement. Les images qu’on y fait graver, et qui nous servent de sceau, doivent être, de préférence, une colombe, un poisson, un vaisseau aux voiles déployées et rapides ; on y peut encore faire graver une lyre, comme Polycrate, ou une ancre, comme Séleucus ; enfin un homme qui, pêchant au bord des mers, nous rappelle saint Pierre et Moïse. Mais il faut se garder de porter à ses doigts l’image des idoles, dont la pensée seule est un crime. Point d’épée, point d’arc ni de flèche à ceux qui cherchent la paix. Point de vases qui rappellent les festins à ceux qui suivent la tempérance. Surtout n’imitons point ces voluptueux qui font peindre nus ceux ou celles qu’ils aiment, et qui, ayant toujours sous les yeux ces objets de leurs passions, ne peuvent les bannir de leur esprit lors même qu’ils le voudraient.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/ClAl_P%C3%A9dagogue_3">Le Pédagogue, 3, 11</a>)</p>
    references: |-
      <p>Les citations des <i>Stromates</i> sont empruntées à la traduction d’Antoine-Eugène Genoude, <i>Les Pères de l’Église</i>, t. 5, Sapia, 1839 ; celles du <i>Pédagogue</i>, du <i>Discours aux Gentils</i>, de <i>Quel riche peut être sauvé</i> et des <i>Hypotyposes</i>, au t. 4, Sapia, 1839, publiées sur ce site. Les citations des autres auteurs, ainsi que les textes grecs et anglais, sont traduits ou reproduits d’après la page russe. Les références bibliques suivent la numérotation de la Septante lorsque Clément la suit.</p><p>Traduction : Rodion Vlasov, avec l’aide de l’IA, d’après la <a href="https://bibleox.com/fr/ru/w/%D0%9A%D0%BB%D0%B8%D0%BC%D0%B5%D0%BD%D1%82_%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%D0%B8%D0%B9%D1%81%D0%BA%D0%B8%D0%B9">page de référence en russe</a>.</p>
