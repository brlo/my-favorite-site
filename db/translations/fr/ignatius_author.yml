    title: "Ignace le Théophore, Ier siècle"
    title_sub: "hiéromartyr (~35-107), évêque d'Antioche"
    update: true
    body: |-
      <p>La section des œuvres d’Ignace le Théophore <strong>en grec</strong> : <a href="https://bibleox.com/fr/grc/w/%CE%99%CE%B3%CE%BD%CE%AC%CF%84%CE%B9%CE%BF%CF%82_%CE%98%CE%B5%CE%BF%CF%86%CF%8C%CF%81%CE%BF%CF%82_%CE%91%CE%BD%CF%84%CE%B9%CE%BF%CF%87%CE%B5%CE%AF%CE%B1%CF%82">y aller</a>. Le changement de langue est aussi disponible en haut, au-dessus de la liste des œuvres.</p><p><strong>Jours de mémoire</strong> : 20 décembre (2 janvier), 29 janvier (11 février)</p><h2>Biographie</h2><p>On sait peu de choses de la vie d’Ignace. Une tradition veut qu’il ait été cet enfant que le Christ prit dans ses bras et bénit (Mt 18:2-5). Mais la plupart des chercheurs considèrent cela comme une légende.</p><p>Certains pensent qu’il était syrien, d’après le style de la langue de ses épîtres. Il est clair qu’il fut l’un des premiers auteurs chrétiens d’origine non juive, ou du moins non imprégné de la culture de la religion judaïque. Selon l’Histoire ecclésiastique d’Eusèbe de Césarée, il fut arrêté à Antioche sous le règne de Trajan et envoyé à Rome pour y être exécuté. Pendant le voyage, il écrivit sept épîtres aux communautés chrétiennes par lesquelles passait son chemin (Éphèse, Magnésie, Tralles, Philadelphie, Smyrne et Rome), ainsi qu’<a href="https://bibleox.com/fr/fr/w/Ou7X_ÉPÎTRE_À_SAINT_POLYCARPE">une épître</a> <a href="https://bibleox.com/fr/fr/w/PlKp_Polycarpe_de_Smyrne_Ier_IIe_siècle">à Polycarpe de Smyrne</a>. Arrivé à Rome, il fut livré aux lions le 20 décembre 107.</p><p>Polycarpe écrit au sujet d’une lettre d’Ignace :</p><blockquote><p>« <strong>Vous m’avez écrit, vous et Ignace</strong>, que si quelqu’un d’entre nous part pour la Syrie, il y porterait aussi vos lettres » (<a href="https://bibleox.com/fr/fr/w/PlKp_Épître_aux_Philippiens">Polycarpe, Phil. 55</a>)</p></blockquote><p>Polycarpe rassemble les lettres d’Ignace et tout ce que l’on sait de lui, les recopiant et les diffusant :</p><blockquote><p>« <strong>Les épîtres d’Ignace qui nous ont été envoyées, ainsi que les autres</strong>, autant que nous en avons, <strong>nous vous les avons envoyées</strong>, selon votre demande : elles sont jointes à cette même lettre. Vous en retirerez un grand profit, car elles contiennent la foi, la patience et toute édification dans notre Seigneur. <strong>Ce que vous apprendrez de certain sur Ignace lui-même et sur ses compagnons, faites-le-nous savoir</strong> » (<a href="https://bibleox.com/fr/fr/w/PlKp_Épître_aux_Philippiens">Polycarpe, Phil. 57-59</a>)</p></blockquote><p>Eusèbe de Césarée (IIIe-IVe siècle) écrit aussi longuement sur Ignace, énumérant ses 7 épîtres et en citant quelques-unes « mot pour mot » :</p><blockquote><p>5. Ainsi, se trouvant à Smyrne, où était Polycarpe, il écrivit une épître à l’<strong>Église d’Éphèse</strong>, mentionnant son pasteur Onésime ; une autre à <strong>Magnésie</strong> du Méandre (il y mentionne l’évêque Damas), et une autre à <strong>Tralles</strong>, où, selon son récit, gouvernait Polybe.</p><p>6. Il écrivit aussi à l’<strong>Église de Rome</strong>, la suppliant de ne pas intercéder pour lui et de ne pas le priver de l’espérance du martyre désiré. Il vaut la peine de citer un bref extrait à l’appui de ces paroles. Voici son épître mot pour mot :</p><p>&lt;cite la plus grande partie de l’épître&gt;</p><p>10. Ainsi écrivait-il aux Églises énumérées depuis la ville indiquée. Se trouvant déjà hors de Syrie, il écrivit de Troade aux habitants de <strong>Philadelphie</strong> et à <strong>Smyrne</strong> — à l’Église et particulièrement à son chef <strong>Polycarpe</strong>. Le connaissant bien comme un homme apostolique, lui, bon et véritable pasteur, il lui confia son troupeau d’Antioche et le pria de veiller sur lui avec zèle.</p><p>11. Dans sa lettre aux Smyrniotes, il parle du Christ (j’ignore où il a pris ces renseignements) : « Je sais et je crois qu’après la résurrection il est apparu dans la chair. Et lorsqu’il vint à Pierre et à ceux qui étaient avec lui, il leur dit : “Touchez-moi, voyez que je ne suis pas un esprit sans corps.” Ils le touchèrent aussitôt et crurent. »</p></blockquote><p>(<a href="https://bibleox.com/ru/ru/w/%D0%A6%D0%B5%D1%80%D0%BA%D0%BE%D0%B2%D0%BD%D0%B0%D1%8F_%D0%B8%D1%81%D1%82%D0%BE%D1%80%D0%B8%D1%8F_%D0%BA%D0%BD%D0%B8%D0%B3%D0%B0_3_%E2%80%94_%D0%95%D0%B2%D1%81%D0%B5%D0%B2%D0%B8%D0%B9_%D0%9A%D0%B5%D1%81%D0%B0%D1%80%D0%B8%D0%B9%D1%81%D0%BA%D0%B8%D0%B9#HH-36">Histoire de l’Église, livre 3, 36 (en russe)</a>)</p><p>Eusèbe cite aussi un passage d’une épître perdue d’Irénée de Lyon (IIe siècle), où Irénée cite l’épître d’Ignace aux Romains :</p><blockquote><p>12. Son martyre fut connu aussi d’<strong>Irénée ; il mentionne ses épîtres</strong> et dit : « Comme l’a dit [dans l’épître <strong>aux Romains</strong>] un des nôtres, condamné pour la confession de Dieu à être livré aux bêtes : “Je suis le blé de Dieu, et les dents des bêtes me broient pour que je devienne un pain pur”[1].</p><p>13. Polycarpe rappelle la même chose dans son épître aux Philippiens.</p></blockquote><p>(<a href="https://bibleox.com/ru/ru/w/%D0%A6%D0%B5%D1%80%D0%BA%D0%BE%D0%B2%D0%BD%D0%B0%D1%8F_%D0%B8%D1%81%D1%82%D0%BE%D1%80%D0%B8%D1%8F_%D0%BA%D0%BD%D0%B8%D0%B3%D0%B0_3_%E2%80%94_%D0%95%D0%B2%D1%81%D0%B5%D0%B2%D0%B8%D0%B9_%D0%9A%D0%B5%D1%81%D0%B0%D1%80%D0%B8%D0%B9%D1%81%D0%BA%D0%B8%D0%B9#HH-36">Histoire de l’Église, livre 3, 36 (en russe)</a>)</p><p>Les épîtres d’Ignace sont aussi énumérées par saint <a href="https://bibleox.com/ru/ru/w/r6fC_%D0%98%D0%B5%D1%80%D0%BE%D0%BD%D0%B8%D0%BC_%D0%A1%D1%82%D1%80%D0%B8%D0%B4%D0%BE%D0%BD%D1%81%D0%BA%D0%B8%D0%B9_IV_%D0%B2%D0%B5%D0%BA">Jérôme de Stridon (en russe)</a> (~347-419) :</p><blockquote><p>Ignace, troisième évêque de l’Église d’Antioche après l’apôtre Pierre, fut envoyé à Rome et, arrivé à Smyrne, où était évêque Polycarpe, disciple de Jean, écrivit une épître <strong>aux Éphésiens</strong>, une autre – <strong>aux Magnésiens</strong>, la troisième – <strong>aux Tralliens</strong>, la quatrième – <strong>aux Romains</strong>, et, partant de là, il écrivit <strong>aux Philadelphiens</strong>, <strong>aux Smyrniotes</strong> et à <strong>à Polycarpe</strong>, lui confiant l’Église d’Antioche.</p></blockquote><p>(<a href="https://azbyka.ru/otechnik/Ieronim_Stridonskij/o_znamenityh/1_9#sel=63:1,63:52">Des hommes illustres</a>)</p><h2>La foi</h2><h3>Le Christ est Dieu</h3><blockquote><p>« Il n’y a pour eux qu’un seul médecin, <strong>charnel et spirituel, engendré et inengendré, <mark>Dieu fait chair</mark>, dans la mort la vie véritable, né de Marie et de Dieu, d’abord sujet à la souffrance, puis exempt de souffrance, <mark>notre Seigneur Jésus-Christ</mark></strong> » (<a href="https://bibleox.com/fr/fr/w/ahBy_ÉPÎTRE_AUX_ÉPHÉSIENS">Ign. Éph. 32-33</a>)</p></blockquote><blockquote><p>« Car <strong><mark>notre Dieu Jésus-Christ</mark></strong>, par l’économie de Dieu, fut conçu par Marie de la semence de David, mais du Saint-Esprit » (<a href="https://bibleox.com/fr/fr/w/ahBy_ÉPÎTRE_AUX_ÉPHÉSIENS">Ign. Éph. 72</a>)</p></blockquote><blockquote><p>« Dès lors, toute magie commença à tomber, tous les liens du mal à se rompre, l’ignorance à passer, et l’ancien royaume à se dissoudre : car <strong><mark>Dieu</mark></strong><mark> </mark><strong><mark>est apparu à la manière d’un homme</mark></strong> pour le renouvellement de la vie éternelle » (<a href="https://bibleox.com/fr/fr/w/ahBy_ÉPÎTRE_AUX_ÉPHÉSIENS">Ign. Éph. 77</a>)</p></blockquote><blockquote><p>« (Car “les choses visibles sont passagères, … les invisibles sont éternelles” (2 Co 4:18).) <strong><mark>notre Dieu Jésus-Christ</mark></strong> apparaît dans une grande gloire, lorsqu’il est dans le Père » (<a href="https://bibleox.com/fr/fr/w/DKxR_ÉPÎTRE_AUX_ROMAINS">Ign. Rom. 15</a>)</p></blockquote><blockquote><p>« Je rends grâce à <strong><mark>Jésus-Christ Dieu</mark></strong>, qui vous a ainsi rendus sages. Car j’ai appris que vous êtes inébranlablement affermis dans la foi, comme cloués à la croix du Seigneur Jésus-Christ et de corps et d’esprit, affermis dans l’amour par le sang du Christ ; et remplis de foi en notre Seigneur, qui est véritablement de la race de David selon la chair » (<a href="https://bibleox.com/fr/fr/w/LFpN_ÉPÎTRE_AUX_SMYRNIENS">Ign. Smyrn. 2</a>)</p></blockquote><blockquote><p>« Je salue celui qui sera jugé digne d’être envoyé en Syrie. Que la grâce soit toujours avec lui et avec Polycarpe qui l’envoie ! Je désire que vous soyez toujours affermis en <strong><mark>notre Dieu Jésus-Christ</mark></strong> » (<a href="https://bibleox.com/fr/fr/w/Ou7X_ÉPÎTRE_À_SAINT_POLYCARPE">Ign. Polyc. 44</a>)</p></blockquote><h3>Dieu est né de Marie</h3><blockquote><p>« Il n’y a pour eux qu’un seul médecin, <strong>charnel et spirituel, <mark>engendré</mark> et inengendré, <mark>Dieu fait chair</mark>, dans la mort la vie véritable, <mark>de Marie</mark> et de Dieu, d’abord sujet à la souffrance, puis exempt de souffrance, <mark>notre Seigneur Jésus-Christ</mark></strong> » (<a href="https://bibleox.com/fr/fr/w/ahBy_ÉPÎTRE_AUX_ÉPHÉSIENS">Ign. Éph. 32-33</a>)</p></blockquote><h3>L’Eucharistie n’est pas une figure, mais la vraie chair et le vrai sang de Jésus-Christ</h3><p>Ignace le Théophore accuse les hérétiques de ne pas croire que l’Eucharistie est la chair de Jésus-Christ, qui a souffert et que le Père a ressuscitée. Ignace dit que les hérétiques ne le croient pas. Il est difficile d’imaginer que les hérétiques ne croient pas que l’Eucharistie n’est qu’une figure de la chair (au sens symbolique). Ne pas croire au symbole est même absurde à concevoir. Ils ne croient précisément pas que dans l’Eucharistie se trouve la chair souffrante et ressuscitée du Christ, comme il est dit plus bas.</p><blockquote><p><em>Que personne ne se fasse illusion ! Les êtres célestes, la gloire des anges, les puissances visibles et invisibles, eux aussi </em><strong><em><mark>sont soumis au jugement, s’ils ne croient pas au sang du Christ</mark></em></strong><em>. « Que celui qui peut comprendre comprenne »… Ils [les hérétiques] s’éloignent de l’eucharistie et de la prière, parce qu’ils ne reconnaissent pas que </em><strong><em><mark>l’eucharistie est la chair du Sauveur</mark></em></strong><em><mark> </mark></em><strong><em><mark>notre Jésus-Christ, qui a souffert pour nos péchés et que le Père a ressuscitée</mark></em></strong><em>, selon sa bonté. Ainsi, </em><strong><em>rejetant le don de Dieu, ils meurent</em></strong><em> dans leurs disputes.</em></p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/LFpN_ÉPÎTRE_AUX_SMYRNIENS">Épître aux Smyrniotes, chapitre 7</a>)</p><h3>Le chrétien ne se considère pas comme déjà sauvé</h3><blockquote><p>« <strong><mark>Le commencement est bien posé : </mark><u><mark>serai-je jugé digne</mark></u><mark> de la grâce — de recevoir sans obstacle mon lot ?</mark></strong> Car je crains votre amour, qu’il ne me nuise ; car ce que vous voulez faire vous est facile, mais <strong><mark>il m’est difficile d’atteindre Dieu</mark></strong>, si vous me prenez en pitié. <strong><mark>Priez pour moi, afin que j’atteigne</mark></strong>. Ce n’est pas selon la chair que je vous ai écrit cela, mais selon la pensée de Dieu. Si je souffre, c’est que vous m’avez aimé ; si je n’en suis pas jugé digne, c’est que vous m’avez haï &lt;…&gt; Et <strong>j’ai honte d’être appelé l’un de ses membres, car je n’en suis pas digne, étant le dernier d’entre eux et comme un rebut</strong>. <strong><mark>Mais </mark><u><mark>si</mark></u><mark> j’atteins Dieu, je serai quelque chose par sa miséricorde</mark></strong>. Mon esprit vous salue, ainsi que l’amour des Églises qui m’ont reçu au nom de Jésus-Christ, non comme un passant » (<a href="https://bibleox.com/fr/fr/w/DKxR_ÉPÎTRE_AUX_ROMAINS">Ign. Rom. 6, 44, 46-47</a>)</p></blockquote><h3>Le chrétien se reconnaît à ses œuvres</h3><blockquote><p>« Nul, en confessant la foi, ne pèche ; nul, ayant acquis l’amour, ne hait. L’arbre se reconnaît à son fruit : ainsi <strong><mark>ceux qui se confessent chrétiens </mark><u><mark>se manifesteront par leurs œuvres</mark></u></strong>. Il ne s’agit pas maintenant de la confession seule, mais de la force de la foi, si quelqu’un y demeure jusqu’à la fin. <strong><mark>Mieux vaut se taire et être, que parler et ne pas être</mark></strong>. C’est une bonne chose d’enseigner, si celui qui enseigne agit aussi</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/ahBy_ÉPÎTRE_AUX_ÉPHÉSIENS">Ign. Éph. 60-62</a>)</p><blockquote><p>« Que le baptême vous demeure comme un bouclier ; la foi comme un casque ; l’amour comme une lance ; la patience comme une armure complète. <strong><mark>Que votre offrande</mark> soit vos œuvres, <mark>afin que</mark> après <mark>recevoir</mark> ce qui vous revient <mark>de profit</mark></strong>. » (<a href="https://bibleox.com/fr/fr/w/Ou7X_ÉPÎTRE_À_SAINT_POLYCARPE">Ign. Polyc. 33-34</a>)</p></blockquote><h3>La souffrance pour le Christ est un signe de proximité avec Dieu</h3><blockquote><p>« Et pourquoi me suis-je moi-même livré à la mort, au feu, au glaive, aux bêtes féroces ? Non, <strong>qui est près du glaive est près de Dieu, qui est au milieu des bêtes est au milieu de Dieu ; pourvu que ce soit au nom de Jésus-Christ</strong>. Pour participer à ses souffrances, je supporte tout cela, et il me fortifie, car il s’est fait homme parfait</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/LFpN_ÉPÎTRE_AUX_SMYRNIENS">Ign. Smyrn. 12-13</a>)</p><h3>Sans évêque, presbytres et diacres, il n’y a pas d’Église</h3><p>C’est-à-dire qu’une simple réunion ordinaire de deux ou trois personnes n’est pas l’Église :</p><blockquote><p><strong><em>Tous, <mark>honorez</mark> <mark> les diacres</mark>, comme un commandement de Jésus-Christ, et <mark>l’évêque</mark>, comme Jésus-Christ, le Fils de Dieu le Père, <mark>et les presbytres</mark>, comme le conseil de Dieu, comme le collège des apôtres. <mark>Sans eux il n’y a pas d’Église</mark></em></strong><em>. Je suis sûr que vous pensez vous-mêmes ainsi.</em></p><p><em>&lt;…&gt;</em></p><p><em>je vous en prie, non pas moi, mais l’amour de Jésus-Christ : nourrissez-vous d’une seule nourriture chrétienne, et détournez-vous de la plante étrangère, qui est l’hérésie. Au poison de leur doctrine </em><strong><em>les hérétiques mêlent Jésus-Christ, et par là gagnent la confiance : mais ils donnent un poison mortel dans un vin sucré. Celui qui ne sait pas le reçoit volontiers et, avec ce plaisir pernicieux, reçoit la mort.</em></strong></p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/vtsF_ÉPÎTRE_AUX_TRALLIENS">Épître aux Tralliens, chapitre 3, 6</a>)</p><blockquote><p><em>Suivez tous l’évêque, comme Jésus-Christ le Père, et le presbyterium comme les apôtres. Honorez les diacres comme le commandement de Dieu. </em><strong><em>Sans l’évêque, que personne ne fasse rien qui touche à l’Église (</em></strong><a href="https://bibleox.com/ru/ru/w/%D0%9F%D1%80%D0%B0%D0%B2%D0%B8%D0%BB%D0%B0_%D1%81%D0%B2%D1%8F%D1%82%D1%8B%D1%85_%D0%B0%D0%BF%D0%BE%D1%81%D1%82%D0%BE%D0%BB%D0%BE%D0%B2#HH-39"><strong><em>39e règle des Apôtres, en russe</em></strong></a><strong><em>). Seule doit être tenue pour véritable l’eucharistie qui est célébrée par l’évêque, ou par celui à qui il l’aura lui-même confiée. <u><mark>Là où est l’évêque</mark></u><mark>, là doit être aussi le peuple, de même que là où est Jésus-Christ, </mark><u><mark>là est l’Église catholique</mark></u></em></strong><em>. Il n’est pas permis, sans l’évêque, ni de baptiser, ni de célébrer l’agape ; au contraire, ce qu’il approuve est agréable à Dieu, afin que toute chose soit ferme et certaine. C’est une belle chose de connaître Dieu et l’évêque… Celui qui honore l’évêque est honoré de Dieu ; </em><strong><em><mark>celui qui fait quelque chose à l’insu de l’évêque sert le diable</mark></em></strong></p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/LFpN_ÉPÎTRE_AUX_SMYRNIENS">Épître aux Smyrniotes, chapitre 8-9</a>)</p><blockquote><p><strong><em><mark>Soyez attentifs à l’évêque, afin que Dieu aussi soit attentif à vous</mark>. Je suis une victime pour ceux qui obéissent à l’évêque, aux presbytres et aux diacres</em></strong><em>.</em></p><p><strong><em>Et que ma part en Dieu soit la même que la leur.</em></strong><em> Combattez ensemble, faites ensemble votre chemin, souffrez ensemble,</em></p><p><em>reposez-vous ensemble, levez-vous ensemble, comme des économes, des familiers et des serviteurs de Dieu.</em></p><p><em>...</em></p><p><em>Je désire que vous soyez toujours affermis en notre Dieu Jésus-Christ. </em><strong><em>Demeurez par lui dans l’union avec Dieu et l’évêque.</em></strong></p><p><em>...</em></p><p><em>Que celui qui peut demeurer dans la pureté en l’honneur de la chair du Seigneur y demeure sans vanité.</em></p><p><strong><em><mark>S’il devient vaniteux, il est perdu ; et s’il s’estime plus que l’évêque, il est tout à fait perdu.</mark></em></strong></p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/Ou7X_ÉPÎTRE_À_SAINT_POLYCARPE">Épître à Polycarpe</a>)</p><h3>La hiérarchie à trois degrés du sacerdoce (évêque, presbytres et diacres)</h3><p>Saint Ignace écrit que l’Église de Syrie est restée sans évêque, bien que les presbytres soient nombreux, et que l’évêque de Syrie n’était autre qu’Ignace lui-même, arrêté et envoyé à Rome pour y être exécuté. Et il est évident que les presbytres ne peuvent pas établir eux-mêmes un évêque, sinon ils l’auraient fait bientôt et la Syrie ne serait pas restée sans évêque :</p><blockquote><p>« Souvenez-vous dans votre prière de <strong><mark>l’Église de Syrie : à sa tête, à ma place, Dieu est maintenant le pasteur</mark>. Jésus-Christ seul exercera l’épiscopat en elle</strong> et votre amour » (<a href="https://bibleox.com/fr/fr/w/DKxR_ÉPÎTRE_AUX_ROMAINS">Ign. Rom. 45</a>)</p></blockquote><p>Il faut particulièrement remarquer que l’évêque est toujours au singulier, tandis que les presbytres et les diacres sont au pluriel (voir aussi <a href="https://bibleox.com/ru/ru/w/%D1%82%D1%80%D1%91%D1%85%D1%87%D0%B8%D0%BD%D0%BD%D0%B0%D1%8F-%D1%81%D0%B2%D1%8F%D1%89%D0%B5%D0%BD%D0%BD%D0%B8%D1%87%D0%B5%D1%81%D0%BA%D0%B0%D1%8F-%D0%B8%D0%B5%D1%80%D0%B0%D1%80%D1%85%D0%B8%D1%8F#HH-%D0%A2%D0%B5%D1%80%D1%82%D1%83%D0%BB%D0%BB%D0%B8%D0%B0%D0%BD-155-220">chez Tertullien (en russe)</a>). C’est-à-dire que dans chaque lieu il n’y a qu’un seul chef au-dessus de l’Église — l’évêque —, qui a sous son autorité de nombreux presbytres (littéralement : “ses presbytres”), ainsi que des diacres :</p><blockquote><p><em>Je la salue par le sang de Jésus-Christ, qui est une joie éternelle et qui ne cesse pas pour les croyants, surtout s’ils sont en union avec </em><strong><em><mark>l’évêque et ses presbytres et diacres</mark></em></strong><em>, établis par la volonté de Jésus-Christ, et qu’il a, selon son bon plaisir, affermis inébranlablement par son Saint-Esprit. &lt;…&gt; Efforcez-vous donc de n’avoir qu’une seule Eucharistie. Car une seule est la chair de notre Seigneur Jésus-Christ et une seule la coupe pour l’union de son sang, un seul l’autel, comme </em><strong><em><mark>un seul évêque avec le presbytre et les diacres</mark></em></strong><em>, mes co-serviteurs, afin que tout ce que vous faites, vous le fassiez en Dieu. &lt;…&gt; Étant parmi vous, je proclamais à haute voix, je disais d’une voix forte : « Soyez attentifs à </em><strong><em><mark>l’évêque, au presbyterium et aux diacres</mark></em></strong><em> ». &lt;…&gt; Si vous le voulez, cela ne vous est pas impossible à cause du nom de Dieu : car les Églises voisines ont déjà envoyé</em><strong><em><mark> des évêques</mark> et quelques <mark>presbytres et diacres</mark></em></strong></p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/ucbL_ÉPÎTRE_AUX_PHILADELPHIENS">Épître aux Philadelphiens</a>)</p><p>Il en va de même ailleurs : un seul évêque (qu’il compare au Christ) et auprès de lui de nombreux presbytres (qu’il compare aux apôtres) et diacres :</p><blockquote><p><strong><em>Tous, <mark>honorez</mark> <mark> les diacres</mark>, comme un commandement de Jésus-Christ, et <mark>l’évêque</mark>, comme Jésus-Christ, le Fils de Dieu le Père, <mark>et les presbytres</mark>, comme le conseil de Dieu, comme le collège des apôtres. </em></strong>Sans eux il n’y a pas d’Église.<em> Je suis sûr que vous pensez vous-mêmes ainsi.</em></p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/vtsF_ÉPÎTRE_AUX_TRALLIENS">Épître aux Tralliens, chapitre 3, 6</a>)</p><blockquote><p><em>Suivez tous </em><strong><em><mark>l’évêque</mark></em></strong> (un seul — note),<em> comme Jésus-Christ le Père, et </em><strong><em><mark>le presbyterium</mark></em></strong><em>, comme les apôtres. </em><strong><em><mark>Les diacres</mark></em></strong><em>, honorez-les comme le commandement de Dieu. Sans </em><strong><em>l’évêque</em></strong><em>l’évêque, que personne ne fasse rien qui touche à l’Église. Seule doit être tenue pour véritable l’eucharistie qui est célébrée par l’évêque, ou par celui à qui il l’aura lui-même confiée. Là où est l’évêque, là doit être aussi le peuple, de même que là où est Jésus-Christ, là est l’Église catholique. Il n’est pas permis, sans l’évêque, ni de baptiser, ni de célébrer l’agape ; au contraire, ce qu’il approuve est agréable à Dieu, afin que toute chose soit ferme et certaine. C’est une belle chose de connaître Dieu et </em><strong><em>l’évêque</em></strong><em>… Celui qui honore l’évêque</em><strong><em>l’évêque</em></strong><em>, est honoré de Dieu ; celui qui fait quelque chose à l’insu de l’évêque</em><strong><em>l’évêque</em></strong><em>, sert le diable</em></p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/LFpN_ÉPÎTRE_AUX_SMYRNIENS">Épître aux Smyrniotes, chapitre 8-9</a>)</p><blockquote><p><em>Soyez attentifs à l’évêque, afin que Dieu aussi soit attentif à vous. Je suis une victime pour ceux qui obéissent à </em><strong><em> <mark>l’évêque, aux presbytres et aux diacres</mark></em></strong><em>.</em></p><p><em>Et que ma part en Dieu soit la même que la leur. Combattez ensemble, faites ensemble votre chemin, souffrez ensemble,</em></p><p><em>reposez-vous ensemble, levez-vous ensemble, comme des économes, des familiers et des serviteurs de Dieu.</em></p><p><em>...</em></p><p><em>Je désire que vous soyez toujours affermis en notre Dieu Jésus-Christ. Demeurez par lui dans l’union avec Dieu et </em><strong><em>l’évêque.</em></strong></p><p><em>...</em></p><p><em>Que celui qui peut demeurer dans la pureté en l’honneur de la chair du Seigneur y demeure sans vanité.</em></p><p><em>S’il devient vaniteux, il est perdu ; et s’il s’estime plus que </em><strong><em>l’évêque</em></strong><em>, il est tout à fait perdu.</em></p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/Ou7X_ÉPÎTRE_À_SAINT_POLYCARPE">Épître à Polycarpe</a>)</p><h3>La croix — l’instrument du Christ et des chrétiens</h3><blockquote><p>« vous <strong><mark>êtes élevés</mark> en hauteur <mark>par l’instrument</mark> de Jésus-Christ, c’est-à-dire <mark>par la croix</mark></strong>, au moyen de la corde du Saint-Esprit ; votre foi vous attire en haut, et l’amour sert de chemin qui conduit à Dieu » (<a href="https://bibleox.com/fr/fr/w/ahBy_ÉPÎTRE_AUX_ÉPHÉSIENS">Ign. Éph. 40-41</a>)</p></blockquote><h3>La valeur de l’unité de l’Église</h3><blockquote><p>« <strong><mark>Efforce-toi à l’unité, dont rien n’est meilleur</mark></strong>."</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/Ou7X_ÉPÎTRE_À_SAINT_POLYCARPE">Ign. Polyc. 5</a>)</p><blockquote><p>« <strong><mark>aimez l’unité</mark>, fuyez les divisions</strong>, soyez imitateurs de Jésus-Christ, comme lui l’est de son Père ». Ainsi, j’ai fait mon œuvre, comme un homme destiné à l’unité. <strong>Là où il y a division et colère, Dieu n’habite pas</strong>. Du reste, <strong>à tous ceux qui se repentent, le Seigneur <mark>pardonne, s’ils reviennent à l’unité</mark> de Dieu et au conseil de l’évêque</strong>« </p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/ucbL_ÉPÎTRE_AUX_PHILADELPHIENS">Ign. Philad. 27-29</a>)</p><blockquote><p>« Car ayant été jugé digne du nom le plus divin, je porte dans mes liens mêmes <strong>je glorifie les Églises, et je prie pour qu’il y ait en elles <mark>l’unité de chair et d’esprit</mark> en Jésus-Christ</strong>, notre vie éternelle, <strong><mark>l’unité de la foi et de l’amour</mark></strong>« </p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/CF7Z_ÉPÎTRE_AUX_MAGNÉSIENS">Épître aux Magnésiens</a>)</p><blockquote><p>« <strong><mark>Qu’il n’y ait rien entre vous qui puisse vous diviser</mark> ; mais soyez dans <mark>l’unité avec l’évêque</mark></strong> et devant ceux qui sont assis, en image et en doctrine d’incorruptibilité »</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/CF7Z_ÉPÎTRE_AUX_MAGNÉSIENS">Épître aux Magnésiens</a>)</p><blockquote><p>« Obéissez à l’évêque et les uns aux autres, comme Jésus-Christ obéit selon la chair au Père, et les apôtres au Christ, au Père et à l’Esprit, <strong><mark>afin que l’unité soit</mark> à la fois <mark>charnelle et spirituelle</mark></strong>« </p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/CF7Z_ÉPÎTRE_AUX_MAGNÉSIENS">Ign. Magn. 40</a>)</p><blockquote><p>« Ce n’est pas que j’aie trouvé chez vous de la division, mais plutôt une purification rapide. Car <strong>ceux qui sont de Dieu et de Jésus sont avec l’évêque. Et ceux qui, <mark>après s’être repentis, viennent à l’unité de l’Église, seront eux aussi de Dieu</mark></strong>, afin de vivre selon Jésus-Christ. Ne vous faites pas illusion, mes frères ! <strong>Celui qui suit celui qui introduit le schisme n’héritera pas du Royaume de Dieu</strong>« </p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/ucbL_ÉPÎTRE_AUX_PHILADELPHIENS">Ign. Philad. 10-12</a>)</p><blockquote><p>« <strong>Ne pensez pas qu’il en sorte quelque chose de louable, si vous le faites chacun de votre côté</strong> ; mais dans l’assemblée commune, qu’il y ait chez vous une seule prière, un seul pardon, un seul esprit, une seule espérance dans l’amour et dans une joie sans tache »</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/CF7Z_ÉPÎTRE_AUX_MAGNÉSIENS">Ign. Magn. 21</a>)</p><h3>Le monachisme</h3><blockquote><p>Que celui qui peut demeurer dans la pureté en l’honneur de la chair du Seigneur y demeure sans vanité.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/Ou7X_ÉPÎTRE_À_SAINT_POLYCARPE">À Polycarpe, 5</a>)</p><h3>On ne peut être sauvé dans l’hérésie et le schisme</h3><blockquote><p><em>Ainsi, </em><strong><em>enfants de la lumière et de la vérité, <mark>fuyez la division et les mauvaises doctrines</mark>, mais là où est le pasteur, allez-y vous aussi, comme des brebis</em></strong><em>. Car beaucoup de loups, en apparence dignes de confiance, captivent par un plaisir pernicieux ceux qui marchent dans la voie de Dieu ; mais si vous êtes unis, ils n’auront pas de place. </em><strong><em>Éloignez-vous de la mauvaise ivraie, que Jésus-Christ ne cultive pas, car <mark>ils ne sont pas une plantation du Père</mark>. Ce n’est pas que j’aie trouvé chez vous de la division, mais plutôt une purification rapide. Car <mark>ceux qui sont de Dieu et de Jésus sont avec l’évêque</mark></em></strong><em>. Et ceux qui, après s’être repentis, viennent à l’unité de l’Église, seront eux aussi de Dieu, afin de vivre selon Jésus-Christ. Ne vous faites pas illusion, mes frères ! </em><strong><em><mark>Celui qui suit celui qui introduit le schisme n’héritera pas du Royaume de Dieu. Celui qui tient à une doctrine étrangère ne compatit pas à la souffrance du Christ.</mark></em></strong></p><p><em>&lt;…&gt;</em></p><p><strong><em>Là où il y a division et colère, Dieu n’habite pas</em></strong><em>. Du reste, à tous ceux qui se repentent </em><strong><em>le Seigneur pardonne,</em></strong></p><p><strong><em>s’ils reviennent à l’unité de Dieu et au conseil de l’évêque.</em></strong></p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/ucbL_ÉPÎTRE_AUX_PHILADELPHIENS">Épître aux Philadelphiens, 2-3</a>)</p><blockquote><p>Ne vous faites pas illusion, mes frères ! Ceux qui corrompent les maisons n’hériteront pas du Royaume de Dieu. Mais si ceux qui font cela à l’égard de la chair sont soumis à la mort, combien plus — si <strong><mark>quelqu’un corrompt par une mauvaise doctrine la foi de Dieu, pour laquelle Jésus-Christ a été crucifié ? Un tel homme, comme un impur, ira dans le feu inextinguible, ainsi que celui qui l’écoute</mark></strong>.</p><p>Le Seigneur a reçu le parfum sur sa tête afin de parfumer l’Église d’incorruptibilité. <strong>Ne vous oignez donc pas de la doctrine fétide du prince de ce siècle ; qu’il ne vous emmène pas, comme des captifs, loin de la vie qui convient</strong>.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/ahBy_ÉPÎTRE_AUX_ÉPHÉSIENS">Épître aux Éphésiens, chapitre 16, 17</a>)</p><h3>S’éloigner des hérétiques</h3><blockquote><p>« Ainsi, <strong><mark>fuyez les mauvaises plantes</mark>, qui portent un fruit mortel : qui en goûte meurt aussitôt. Car <mark>les hérétiques ne sont pas une plantation du Père</mark></strong>. S’ils l’étaient, ils seraient des rameaux de la croix, et leur fruit serait incorruptible »</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/vtsF_ÉPÎTRE_AUX_TRALLIENS">Ign. Trall. 30-31</a>)</p><blockquote><p>« Ainsi, enfants de la lumière et de la vérité, <strong><mark>fuyez</mark> la division et <mark>les mauvaises doctrines</mark></strong>, mais là où est le pasteur, allez-y vous aussi, comme des brebis. Car beaucoup de loups, en apparence dignes de confiance, captivent par un plaisir pernicieux ceux qui marchent dans la voie de Dieu ; mais si vous êtes unis, ils n’auront pas de place. <strong><mark>Éloignez-vous de la mauvaise ivraie</mark></strong>, que Jésus-Christ ne cultive pas, car ils ne sont pas une plantation du Père. &lt;…&gt; <strong>Celui qui tient à une doctrine étrangère ne compatit pas à la souffrance du Christ</strong>« </p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/ucbL_ÉPÎTRE_AUX_PHILADELPHIENS">Ign. Philad. 7-9, 13</a>)</p><h3>La vie de l’âme après la mort du corps</h3><blockquote><p>« Il m’est beau de me coucher du monde vers Dieu, afin de resplendir en lui &lt;…&gt; Si je me montre vraiment tel [chrétien], je puis aussi en porter le nom, et <strong>alors seulement <mark>puis-je être </mark>vraiment fidèle, <mark>quand le monde ne me verra plus</mark></strong>. Rien de <strong><mark>visible n’est éternel</mark></strong>. Maintenant seulement je commence à être disciple. Ni le visible ni l’invisible, <strong><mark>rien ne m’empêchera de venir à Jésus-Christ</mark></strong>. Je veux être de Dieu : <strong>ne me livrez pas au monde. Laissez-moi aller à la lumière pure : <mark>apparaissant là, je serai un homme de Dieu</mark></strong>. Vivant, je vous écris, brûlant du désir de mourir. Mon amour a été crucifié, et il n’y a en moi aucun feu qui aime la matière, mais une eau vive, <strong>qui parle <mark>en moi, et crie en moi du dedans : “viens au Père” »</mark></strong>« </p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/DKxR_ÉPÎTRE_AUX_ROMAINS">Ign. Rom. 10, 13-14, 29, 34, 39</a>)</p><h3>L’abolition de la loi judaïque</h3><blockquote><p><strong><mark>si nous vivons encore jusqu’ici selon la loi judaïque, nous reconnaissons ouvertement par là que nous n’avons pas reçu la grâce</mark></strong>. Les prophètes les plus divins vécurent dans le Christ Jésus, et c’est pourquoi ils souffrirent aussi la persécution. Inspirés par sa grâce, ils convainquirent les incrédules qu’il n’y a qu’un seul Dieu, manifesté par Jésus-Christ, son Fils, qui est sa Parole éternelle, issue non du silence &lt;…&gt; Ainsi, si ceux qui vivaient dans l’ancien ordre des choses s’approchèrent de l’espérance nouvelle et déjà <strong><mark>ne gardaient plus le sabbat, mais vivaient de la vie de la Résurrection</mark></strong>, en laquelle notre vie aussi a resplendi par lui et par sa mort, — <strong>certains la rejettent</strong>, mais par son mystère nous avons reçu le commencement de la foi, et c’est pour elle que nous souffrons, afin d’être disciples de Jésus-Christ, notre unique Maître &lt;…&gt; C’est pourquoi, <strong>étant devenus ses disciples, apprenons à vivre en chrétiens</strong>. Car celui qui est appelé d’un autre nom, et non de celui-ci, n’est pas de Dieu. Ainsi, <strong><mark>rejetez le mauvais levain, vieilli et corrompu, et changez-vous en un levain nouveau, qui est Jésus-Christ</mark></strong>. Soyez salés en lui, afin que nul d’entre vous ne se corrompe, et que l’odeur ne vous dénonce pas. <strong><mark>Il est absurde d’invoquer Jésus-Christ et de vivre à la juive</mark> ; car ce n’est pas le christianisme qui a cru au judaïsme, mais le judaïsme au christianisme</strong>, dans lequel se sont unies toutes les langues qui ont cru en Dieu.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/CF7Z_ÉPÎTRE_AUX_MAGNÉSIENS">Épître aux Magnésiens, 8-10</a>)</p><blockquote><p>« Mais <strong><mark>si quelqu’un vous prêche le judaïsme, ne l’écoutez pas</mark>. Car mieux vaut entendre le christianisme de la bouche d’un circoncis que le judaïsme de la bouche d’un incirconcis</strong>. Et si ni l’un ni l’autre ne parle de Jésus-Christ, ils sont, à mon avis, des colonnes et des tombeaux de morts, sur lesquels sont écrits seulement des noms d’hommes »</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/ucbL_ÉPÎTRE_AUX_PHILADELPHIENS">Épître aux Philadelphiens, 6</a>)</p><blockquote><p>« Mais si <strong><mark>quelqu’un vous prêche le judaïsme, ne l’écoutez pas</mark></strong>. Car mieux vaut entendre le christianisme de la bouche d’un circoncis que le judaïsme de la bouche d’un incirconcis »</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/ucbL_ÉPÎTRE_AUX_PHILADELPHIENS">Ign. Philad. 19</a>)</p><h3>Les tourments sans fin de l’enfer</h3><blockquote><p>« Mais si ceux qui font cela à l’égard de la chair sont soumis à la mort, combien plus — si quelqu’un corrompt par une mauvaise doctrine la foi de Dieu, pour laquelle Jésus-Christ a été crucifié ? Un tel homme, comme un impur, <strong>ira dans <mark>le feu inextinguible</mark></strong>, ainsi que celui qui l’écoute »</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/ahBy_ÉPÎTRE_AUX_ÉPHÉSIENS">Ign. Éph. 67</a>)</p><h3>Un reproche aux partisans d’une foi bâtie “sur l’Écriture seule”</h3><p>Il parle de gens qui discutent et refusent de croire ce qu’on ne peut pas leur prouver par les Écritures de l’Ancien Testament, et à qui, lorsqu’on le leur montre, ils continuent à disputer du sens du texte. Ignace le Théophore répond que, bien qu’il soit écrit, pour lui l’ancien (le plus important), c’est Jésus-Christ et sa foi, que saint Ignace a reçue directement des apôtres et de leurs successeurs :</p><blockquote><p>« Je crois à la grâce de Jésus-Christ, qu’il vous a déliés de tous les liens. Mais je vous en prie — <strong><mark>ne faites rien par esprit de parti, mais selon la doctrine du Christ</mark></strong>. J’ai <strong><mark>entendu de certains</mark> ces mots : “<mark>si je ne le trouve dans les anciens écrits, je ne crois pas</mark></strong> à ce qui est écrit dans l’Évangile” ; <strong>et quand je leur disais que c’est écrit, ils me répondaient : il faut le prouver. <mark>Mais pour moi, l’ancien, c’est Jésus-Christ</mark></strong>, l’ancien immuable, c’est sa croix, sa mort et sa résurrection, <strong><mark>et sa foi</mark></strong> : voilà de quoi je désire être justifié par votre prière</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/ucbL_ÉPÎTRE_AUX_PHILADELPHIENS">Ign. Philad. 30-32</a>)</p><h2>De la datation des textes</h2><p>Il existe plusieurs versions des textes d’Ignace le Théophore : brève, moyenne et longue. La version moyenne est la plus ancienne et la plus répandue. Ce recueil d’épîtres est mentionné au IIIe-IVe siècle par Eusèbe de Césarée.</p><p>Certaines épîtres sont mentionnées plus tôt encore. Par exemple, au IIe siècle, le contemporain d’Ignace, Polycarpe de Smyrne, écrit au sujet d’une lettre d’Ignace :</p><blockquote><p>« <strong>Vous m’avez écrit, vous et Ignace</strong>, que si quelqu’un d’entre nous part pour la Syrie, il y porterait aussi vos lettres” (Polycarpe, Phil. 55)</p></blockquote><p>Polycarpe rassemble les lettres d’Ignace et tout ce que l’on sait de lui, les recopiant et les diffusant :</p><blockquote><p>« <strong>Les épîtres d’Ignace qui nous ont été envoyées, ainsi que les autres, autant que nous en avons, nous vous les avons envoyées</strong>, selon votre demande : elles sont jointes à cette même lettre. Vous en retirerez un grand profit, car elles contiennent la foi, la patience et toute édification dans notre Seigneur. <strong>Ce que vous apprendrez de certain sur Ignace lui-même et sur ses compagnons, faites-le-nous savoir</strong> » (Polycarpe, Phil. 57-59)</p></blockquote><p>Le plus ancien manuscrit grec conservé (Ve siècle) est l’épître aux Smyrniotes déjà mentionnée plus haut par Polycarpe. Bien que les manuscrits grecs de l’épître aux Romains soient assez tardifs, il existe du Ve siècle des traductions de l’épître aux Romains en syriaque et en arménien ancien. Il existe aussi des traductions coptes du IVe siècle des épîtres suivantes : aux Romains, aux Smyrniotes, à Polycarpe, aux Tralliens, aux Philadelphiens.</p><p>Eusèbe de Césarée (IIIe-IVe siècle) cite une épître perdue d’Irénée de Lyon (IIe siècle), dans laquelle Irénée cite l’épître aux Romains d’Ignace le Théophore :</p><blockquote><p>12. Irénée connut aussi son martyre ; il mentionne ses épîtres et dit : « Comme l’a dit un des nôtres, condamné pour la confession de Dieu à être livré aux bêtes : “<strong>Je suis le blé de Dieu, et les dents des bêtes me broient pour que je devienne un pain pur</strong>” (<a href="https://bibleox.com/fr/fr/w/DKxR_ÉPÎTRE_AUX_ROMAINS">Ign. Rom. 19</a>).</p></blockquote><p>(Histoire de l’Église, livre 3, 36)</p><p>Eusèbe cite le texte moyen. On peut comparer les textes d’Eusèbe et ce que nous avons aujourd’hui. La différence est soulignée (deux mots ajoutés ne changent pas le fond, ils décrivent les sortes de supplices) :</p><table class="custom-table"><colgroup></colgroup><tbody><tr><td><p><strong>D’après l’Histoire d’Eusèbe</strong></p><p>ἀπὸ Συρίας μέχρι Ῥώμης θηριομαχῶ διὰ γῆς καὶ θαλάσσης, νυκτὸς καὶ ἡμέρας, ἐνδεδεμένος δέκα λεοπάρδοις, ὅ ἐστιν στρατιωτικὸν τάγμα, οἳ καὶ εὐεργετούμενοι χείρονες γίνονται, ἐν δὲ τοῖς ἀδικήμασιν αὐτῶν μᾶλλον μαθητεύομαι· ἀλλ' οὐ παρὰ τοῦτο δεδικαίωμαι. ὀναίμην τῶν θηρίων τῶν ἐμοὶ ἑτοίμων, ἃ καὶ εὔχομαι σύντομά μοι εὑρεθῆναι· ἃ καὶ κολακεύσω συντόμως με καταφαγεῖν, οὐχ ὥσπερ τινῶν δειλαινόμενα οὐχ ἥψαντο, κἂν αὐτὰ δὲ ἄκοντα μὴ θέλῃ, ἐγὼ προσβιάσομαι. συγγνώμην μοι ἔχετε· τί μοι συμφέρει, ἐγὼ γινώσκω, νῦν ἄρχομαι μαθητὴς εἶναι. μηδέν με ζηλώσαι τῶν ὁρατῶν καὶ ἀοράτων, ἵνα Ἰησοῦ Χριστοῦ ἐπιτύχω· πῦρ καὶ σταυρὸς θηρίων τε συστάσεις, <strong><u>___</u></strong> σκορπισμοὶ ὀστέων, συγκοπαὶ μελῶν, ἀλεσμοὶ ὅλου τοῦ σώματος, κολάσεις τοῦ διαβόλου εἰς ἐμὲ ἐρχέσθωσαν, μόνον ἵνα Ἰησοῦ Χριστοῦ ἐπιτύχω</p><p><a href="https://bibleox.com/fr/grc/w/%CE%95%CE%9A%CE%9A%CE%9B%CE%97%CE%A3%CE%99%CE%91%CE%A3%CE%A4%CE%99%CE%9A%CE%97%CE%A3_%CE%99%CE%A3%CE%A4%CE%9F%CE%A1%CE%99%CE%91%CE%A3-3#HH-36">https://bibleox.com/ru/grc/w/ΕΚΚΛΗΣΙΑΣΤΙΚΗΣ_ΙΣΤΟΡΙΑΣ-3/#HH-36</a></p></td><td><p><strong>D’après l’épître d’Ignace</strong></p><p>Ἀπὸ Συρίας μέχρι Ῥώμης θηριομαχῶ, διὰ γῆς καὶ θαλάσσης, νυκτὸς καὶ ἡμέρας, δεδεμένος δέκα λεοπάρδοις, ὅ ἐστιν στρατιωτικὸν τάγμα· οἳ καὶ εὐεργετούμενοι χείρους γίνονται. ἐν δὲ τοῖς ἀδικήμασιν αὐτῶν μᾶλλον μαθητεύομαι, ἀλλ ̓ οὐ παρὰ τοῦτο δεδικαίωμαι. ὀναίμην τῶν θηρίων τῶν ἐμοὶ ἡτοιμασμένων καὶ εὔχομαι σύντομά μοι εὑρεθῆναι· ἃ καὶ κολακεύσω, συντόμως με καταφαγεῖν, οὐχ ὥσπερ τινῶν δειλαινόμενα οὐχ ἥψαντο. κἂν αὐτὰ δὲ ἄκοντα μη· θελήσῃ, ἐγὼ προσβιάσομαι. συγγνώμην μοι ἔχετε· τί μοι συμφέρει, ἐγὼ γινώσκω, νῦν ἄρχομαι μαθητὴς εἶναι. μηθέν με ζηλώσαι τῶν ὁρατῶν καὶ ἀοράτων, ἵνα Ἰησοῦ Χριστοῦ ἐπιτύχω. πῦρ καὶ σταυρὸς θηρίων τε συστάσεις, <strong><u>ἀνατομαί, διαιρέσεις</u></strong>, σκορπισμοὶ ὀστέων, συγκοπὴ μελῶν, ἀλεσμοὶ ὅλου τοῦ σώματος, κακαὶ κολάσεις τοῦ διαβόλου ἐπ ̓ ἐμὲ ἐρχέσθωσαν, μόνον ἵνα Ἰησοῦ Χριστοῦ ἐπιτύχω</p><p><a href="https://bibleox.com/fr/grc/w/%CE%99%CE%B3%CE%BD%CE%98_%CE%A1%CF%89%CE%BC#L23-26">https://bibleox.com/ru/grc/w/ΙγνΘ_Ρωμ/#L23-26</a></p></td></tr></tbody></table><p>On peut admettre que le recueil bref des épîtres d’Ignace n’est pas du tout apparu comme un faux. Dans l’Antiquité, il était d’usage de composer de brefs résumés d’œuvres connues. Ainsi, au IIe siècle, le disciple de Justin le Philosophe (Tatien) composa un recueil des quatre Évangiles en une seule œuvre — le Diatessaron. C’est une œuvre connue, qui fut longtemps lue dans l’Église, parfois même à la place des Évangiles, si bien qu’il fallut plus tard mettre fin à cet usage et revenir à la lecture de l’Évangile. Le Diatessaron n’était pas conçu comme un faux, mais simplement comme une œuvre supplémentaire, diffusée précisément de cette manière.</p><p>L’existence du Diatessaron ne prouve pas que les Évangiles soient faux, ne repousse pas la date d’apparition des Évangiles au IIe siècle, et le Diatessaron lui-même ne prétend pas dater du Ier siècle. C’est une œuvre du IIe siècle.</p><p>Les textes du hiéromartyr Ignace jouissent d’une assez grande confiance de la part des chercheurs. Plus d’informations <a href="https://azbyka.ru/otechnik/Ignatij_Antiohijskij/ignatij-antiokhijskij-episkop-muchenik-i-proiskhozhdenie-episkopata/5">ici</a>.</p>
