      <ol><li><p><a href="https://bibleox.com/fr/fr/w/DKxR_ÉPÎTRE_AUX_ROMAINS">Ignace le Théophore, Épître aux Romains, chap. 4, § 3</a></p></li></ol><p>Les renvois aux épîtres (par exemple « Ign. Éph. 32-33 ») suivent la numérotation de l’édition russe ; l’édition française du site n’a pas cette numérotation, c’est pourquoi le lien ouvre l’épître sans pointer un passage précis. Les liens vers « Jérôme de Stridon », l’« Histoire ecclésiastique » d’Eusèbe, les « Règles des Apôtres » et « la hiérarchie à trois degrés » mènent à des pages russes, pas encore traduites.</p><p>Traduction : Rodion Vlasov, avec l’aide de l’IA. Texte de base : l’original russe. Citations bibliques : Louis Segond (1910).</p>
