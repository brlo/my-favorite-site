      <h2>Textes anciens</h2><p>L’œuvre majeure d’Irénée de Lyon, « Contre les hérésies », fut écrite en grec ancien et est aujourd’hui en grande partie perdue. On peut trouver ici les fragments qui en subsistent en grec ancien : <a href="https://bibleox.com/fr/grc/w/Az9E_%E1%BC%9C%CE%BB%CE%B5%CE%B3%CF%87%CE%BF%CF%82_%CE%BA%CE%B1%E1%BD%B6_%E1%BC%80%CE%BD%CE%B1%CF%84%CF%81%CE%BF%CF%80%E1%BD%B4_%CF%84%E1%BF%86%CF%82_%CF%88%CE%B5%CF%85%CE%B4%CF%89%CE%BD%CF%8D%CE%BC%CE%BF%CF%85_%CE%B3%CE%BD%CF%8E%CF%83%CE%B5%CF%89%CF%82_%CE%9A%CE%B1%CF%84%E1%BD%B0_%CE%B1%E1%BC%B1%CF%81%CE%AD%CF%83%CE%B5%CF%89%CE%BD__%CE%92%CE%B9%CE%B2%CE%BB%CE%AF%CE%BF%CE%BD_1">« Contre les hérésies » (en grec ancien)</a></p><p>Toutefois, dans l’Antiquité, cet ouvrage fut traduit en latin. Les traductions modernes sont généralement établies à partir du texte critique latin : <a href="https://bibleox.com/fr/la/w/LATIN-Adversus_haereses_LIBER_I">« Contre les hérésies » (en latin)</a></p><h2>Biographie</h2><p>Irénée de Lyon (grec ancien : Εἰρηναῖος Λουγδούνου ; latin : Irenaeus Lugdunensis)</p><p><strong>Jour de mémoire</strong> : 23 août (5 septembre)</p><h3>Le chemin vers le ministère pastoral</h3><p>On sait peu de choses sur les détails de la vie et du ministère pastoral de saint Irénée de Lyon. Même le lieu et la date de naissance de ce grand saint nous restent cachés derrière le voile de l’histoire. On pense que les parents d’Irénée étaient chrétiens.</p><p>On peut affirmer avec une grande certitude qu’il naquit dans le deuxième quart du IIe siècle. D’après un ensemble de faits indirects, cet événement est daté approximativement de l’an 130.</p><p>D’après les souvenirs d’Irénée lui-même qui nous sont parvenus, il fut, dans son adolescence, en relation avec saint Polycarpe de Smyrne, ami d’Ignace le Théophore, éminent pasteur de l’Église, et disciple de l’évangéliste Jean le Théologien. Le cercle des connaissances d’Irénée comprenait aussi d’autres hommes qui avaient été témoins de la prédication apostolique et des miracles des apôtres.</p><p>La communauté de Polycarpe, dans sa lettre sur le martyre de Polycarpe, écrit qu’Irénée fut son disciple :</p><blockquote><p>« Ceci a été transcrit par Gaïus, qui connaissait Irénée, d’après la copie d’<strong>Irénée, disciple de Polycarpe</strong>. Et moi, Socrate, je l’ai écrit à Corinthe, d’après la copie de Gaïus. »</p></blockquote><p>(<a href="https://bibleox.com/fr/ru/w/%D0%BE%D0%BA%D1%80%D1%83%D0%B6%D0%BD%D0%BE%D0%B5-%D0%BF%D0%BE%D1%81%D0%BB%D0%B0%D0%BD%D0%B8%D0%B5-%D0%A6%D0%B5%D1%80%D0%BA%D0%B2%D0%B8-%D0%A1%D0%BC%D0%B8%D1%80%D0%BD%D1%81%D0%BA%D0%BE%D0%B9-%D0%BE-%D0%9F%D0%BE%D0%BB%D0%B8%D0%BA%D0%B0%D1%80%D0%BF%D0%B5">Lettre circulaire de l’Église de Smyrne sur Polycarpe, 95 (en russe)</a>)</p><p>Son nom grec, ses liens étroits avec l’évêque de Smyrne, sa bonne connaissance de la littérature, de la philosophie et de la poésie grecques, sa familiarité avec les méthodes de la dialectique donnent lieu de penser qu’Irénée était grec d’origine (du reste, certains chercheurs qui ont étudié sa vie et son œuvre admettent qu’il avait des racines syriennes).</p><p>Selon toute vraisemblance, la patrie d’origine d’Irénée est Smyrne ou l’une des régions géographiques qui lui sont proches.</p><p>L’atmosphère spirituelle dans laquelle Irénée grandit exerça sur sa formation l’influence la plus bénéfique.</p><p>L’Église de Smyrne, malgré sa pauvreté (Ap 2, 9), se distinguait par une bonne organisation. Son activité de prédication et de mission se caractérisait par une stricte conformité à l’esprit de l’Évangile et de la Tradition apostolique. Le zèle ardent avec lequel saint Polycarpe de Smyrne s’efforçait de garder et de répandre la foi intacte et pure se transmit avec le temps à son disciple Irénée.</p><h3>Le ministère sacerdotal en Gaule</h3><p>À quel âge et dans quelles circonstances particulières Irénée quitta sa terre natale pour se rendre en Gaule (territoire de la France actuelle), l’histoire ne le dit pas. Une chose est certaine : il se proposait de répandre la prédication et d’affermir la foi parmi la population de ces contrées. On estime que Polycarpe de Smyrne lui-même le bénit pour cette mission. Et cela n’a rien d’étonnant. Car il existait depuis longtemps des relations amicales entre les chrétiens de Smyrne et ceux de Gaule.</p><p>À cette époque, l’évêque Pothin était à la tête de l’Église de Lyon. Ordonné prêtre, Irénée portait auprès de lui avec zèle le fardeau du ministère pastoral ; il était un combattant ardent pour la pureté de la foi et l’auxiliaire de l’évêque en charge.</p><p>Le temps du ministère d’Irénée coïncida avec l’époque des persécutions les plus violentes contre l’Église, tantôt s’apaisant, tantôt renaissant avec une force nouvelle. On dépouillait les chrétiens, on les punissait pour des crimes imaginaires, on les privait de leurs biens, on les battait, on les torturait, on les violait, on les tuait. À ces dangers extérieurs s’ajoutaient des dangers intérieurs, liés à la diffusion des hérésies et des sentiments schismatiques.</p><p>Tout cela exigeait des clercs un amour, un zèle et une responsabilité particuliers devant Dieu et devant le troupeau. Les chrétiens de Lyon, et parmi eux l’évêque Pothin, voyaient précisément en Irénée un tel prêtre.</p><p>À cette période, la secte des montanistes acquit une grande influence. Les adeptes de cette communauté revendiquaient la primauté dans la possession des dons de la grâce. Lorsque les partisans de Montan parvinrent à Rome et commencèrent à semer leurs erreurs parmi les chrétiens de Rome, l’évêque du lieu, Éleuthère, pleinement conscient du danger, déclara qu’il rompait les bonnes relations religieuses avec les partisans de cette hérésie.</p><p>Les martyrs de Lyon, qui portaient le plus vif intérêt à ces événements, adressèrent une lettre à Éleuthère et chargèrent le prêtre Irénée de la lui remettre, ce dont quelques lignes de la même lettre faisaient mention. Dans ces lignes, les martyrs exprimèrent à Irénée leur entière confiance, le nommant leur frère et leur compagnon. Ils y indiquaient aussi que, si la place de prêtre était déterminée uniquement par la justice, Irénée serait le premier d’entre eux.</p><p>La lettre joua un rôle positif. L’évêque de Rome prit en compte les souhaits des fidèles de Lyon et accorda la paix aux égarés.</p><h3>Le ministère épiscopal</h3><p>Après la mort de l’évêque Pothin, âgé de quatre-vingt-dix ans et décédé en captivité en 177 ou 178, saint Irénée, soutenu par le peuple, fut jugé digne d’être élevé sur le siège épiscopal de Lyon.</p><p>L’une des tâches immédiates qu’il se fixa fut de restaurer l’activité de l’Église de Lyon après la récente persécution. La tâche n’était pas aisée : beaucoup de membres de l’Église avaient été martyrisés ou tués, et le mécontentement des païens se faisait encore sentir.</p><p>L’évêque Irénée ne cessait de faire tout ce qui était en son pouvoir pour affermir la foi. Il prêchait beaucoup lui-même et envoyait des prêtres prêcher dans les régions éloignées de la Gaule, notamment à Valence et à Besançon.</p><p>Un autre champ d’action important du nouvel évêque fut la lutte contre le gnosticisme. À cet égard, saint Irénée est reconnu comme la figure la plus éminente de son temps.</p><p>Dans l’ensemble, les fausses doctrines gnostiques constituaient un mélange explosif d’idées chrétiennes altérées, de mythes païens, de doctrines philosophiques et de fantaisies personnelles. De ce fait, toutes se distinguaient par l’obscurité et l’enchevêtrement de leur contenu. La faible intelligibilité des conceptions qui en découlait était présentée comme un mystère. Dans certaines sectes, pour accroître l’atmosphère de mystère ou de mysticisme, on pratiquait de faux miracles. Les adeptes de chaque secte gnostique estimaient que leur « foi » était précisément parfaite. Cela attirait souvent dans leurs rangs des hommes ignorants en matière religieuse et vaniteux.</p><p>Toute cette situation inquiétait et troublait Irénée de Lyon. À chaque occasion favorable, il expliquait à son troupeau en quoi consistait le danger de s’écarter de la foi du Christ et de l’obéissance à l’Église, et il mettait à nu l’absurdité des doctrines gnostiques.</p><p>Défendant la pureté de la foi, il ne se limitait pas au territoire de son diocèse. Ainsi adressa-t-il une lettre au prêtre Florin pour lui signaler ses déviations hérétiques ; comme celui-ci refusait d’écouter ce sage avertissement, Irénée écrivit à l’évêque de Rome pour lui demander de réagir, de prendre d’urgence des mesures et d’éteindre le foyer hérétique.</p><p>Au cours de plusieurs années de son ministère pastoral, il étudia avec soin, décrivit et démasqua un certain nombre de courants gnostiques. Par la suite, ses travaux furent réunis en un seul ouvrage, devenu le patrimoine de l’Église universelle. Le degré de connaissance des idées gnostiques dont fit preuve Irénée de Lyon suscite encore aujourd’hui l’admiration. De nos jours, cet ouvrage est connu du lecteur sous le titre : Dénonciation et réfutation de la gnose au nom menteur (Contre les hérésies).</p><h3>Participation à la controverse sur la Pâque</h3><p>Outre les actions énumérées ci-dessus, saint Irénée est resté dans la mémoire des fidèles comme un partisan du règlement des litiges liés au jour de la célébration de Pâques.</p><p>La question du moment de la célébration de Pâques fut soulevée dès 154. Elle devint alors l’objet d’une discussion entre Polycarpe de Smyrne et l’évêque de Rome Anicet. À la suite de cette discussion, les parties restèrent sur leurs positions, mais cela ne les conduisit pas au conflit.</p><p>La différence des approches tenait à ce que les communautés d’Asie Mineure, s’appuyant sur l’autorité de Jean le Théologien et de l’apôtre Philippe, suivaient la tradition de célébrer Pâques le 14 du mois de Nisan (selon le calendrier lunaire), c’est-à-dire le jour du cycle annuel où Israël célébrait la Pâque de l’Ancien Testament (ce même jour était mis en rapport avec le jour de la mort du Christ sur la Croix). L’Église de Rome, quant à elle, tout en rattachant Pâques au 14 Nisan, ne la célébrait pas un jour quelconque de la semaine, mais strictement le dimanche.</p><p>Sous Irénée, vers 190, une nouvelle dispute éclata à ce sujet : cette fois entre l’évêque de Rome Victor et Polycrate d’Éphèse. La situation engendra des tensions dans les relations entre les hiérarques et menaça de rompre les liens entre les Églises qu’ils dirigeaient. S’étant interposé, Irénée persuada l’évêque de Rome de se réconcilier avec Polycrate, et la paix fut rétablie.</p><p>En 202, Irénée de Lyon subit le martyre.</p><h2>L’héritage littéraire</h2><p>De saint Irénée ne nous sont parvenus que quelques ouvrages : Détection et réfutation de la fausse gnose (Contre les hérésies), Démonstration de la prédication apostolique, Du règne tyrannique de l’Antéchrist. Or il est difficile de surestimer le savoir transmis dans ces œuvres.</p><p>On y trouve avant tout un exposé positif de la doctrine chrétienne. Dans les pages de ces ouvrages, Irénée aborde des chapitres aussi importants de la dogmatique que la doctrine de Dieu, de la Rédemption, de la création du monde, de la chute, de l’Église, des sacrements, de la Tradition, etc.</p><p>D’un autre côté, il donne un tableau cohérent et une description précise des erreurs les plus dangereuses de son temps. Chaque dénonciation s’accompagne d’arguments irréfutables et peut servir, aujourd’hui encore, de manuel toujours actuel dans le combat pour la pureté de la foi.</p><h2>Notice sur les œuvres d’Irénée de Lyon</h2><p>La présente édition réunit toutes les œuvres conservées de saint Irénée de Lyon : la « Détection et réfutation de la fausse gnose » en cinq livres (appelée ordinairement, à l’exemple d’Eusèbe, « père de l’histoire ecclésiastique », et du bienheureux Jérôme, par abréviation « Contre les hérésies ») et la « Démonstration de la prédication apostolique ». Saint Irénée, évêque de Lyon, fut le disciple spirituel de saint Polycarpe de Smyrne, disciple de l’apôtre Jean le Théologien, et il gardait encore sur ses lèvres la voix apostolique vivante et l’esprit de l’enseignement et de la Tradition des apôtres. Il jouissait d’une grande renommée et d’un immense respect dans toute l’Église universelle, et il fut artisan de paix dans la querelle entre Rome et les Églises d’Asie Mineure au sujet de divergences rituelles ; mais il se rendit surtout célèbre par son combat contre les hérétiques les plus dangereux de son temps, les gnostiques. Réfutant avec zèle toutes les fausses doctrines gnostiques qui existaient alors, saint Irénée expose avec une clarté et une profondeur étonnantes l’enseignement apostolique sur Dieu, sur le salut, la rédemption et la résurrection de l’homme, sur l’Eucharistie et sur les destinées dernières de l’univers. En sa personne, nous voyons le défenseur le plus éclatant de l’idée de l’Église, de son importance et de la nécessité d’y appartenir. Très précieux est aussi l’aspect exégétique des œuvres de saint Irénée, auquel une attention particulière a été accordée dans la présente édition : les références à l’Écriture ont été précisées et complétées, et un index des citations bibliques a été établi d’après les œuvres de saint Irénée. L’ancienne traduction russe du protoprêtre P. Preobrajenski est donnée dans une nouvelle rédaction et accompagnée, là où cela est nécessaire, de notes textuelles.</p><p>Pour tous ceux qui désirent posséder un fondement solide de la foi du Seigneur, apostolique et ecclésiale, et boire l’eau du salut aux sources vives.</p><h2>La foi</h2><h3>Dieu — Trinité</h3><blockquote><p><em>Répandus dans tout l’univers, les membres de l’Église, quelques divers que soient les lieux qu’ils habitent, professent tous une seule et même foi, celle qui a été transmise par les apôtres à leurs disciples. Cette foi a pour base </em><strong><em>la croyance en un seul Dieu, Père tout-puissant</em></strong><em>, créateur du ciel, de la terre, de la mer et de tout ce qu’ils renferment ; </em><strong><em>en un seul Jésus-Christ, fils de Dieu</em></strong><em> et fait chair pour notre salut ; </em><strong><em>en un Saint-Esprit</em></strong><em> qui a annoncé, par les prophètes ses organes, les volontés célestes et l’avénement du Dieu né d’une vierge, de ce Dieu qui a souffert, qui est ressuscité d’entre les morts, qui est monté aux cieux avec sa chair, Jésus-Christ notre Seigneur ; ce Dieu qui redescendra un jour du haut des cieux, dans la gloire du Père</em></p></blockquote><p>(<a href="https://azbyka.ru/otechnik/Irinej_Lionskij/protiv-eresej/1">Contre les hérésies, I (en russe)</a>)</p><blockquote><p><em>Nous autres Chrétiens, qui sommes dans le sein de l’Église, nous sommes invariablement fixés à la règle unique de la vérité, qui est la croyance en </em><strong><em>un Dieu tout-puissant</em></strong><em> qui a tout fait par son Verbe, et qui l’a fait de rien ; car l’Écriture dit : « </em><strong><em>La parole</em></strong><em> du Seigneur a raffermi les cieux, et </em><strong><em>de l’esprit</em></strong><em> de sa bouche est sortie toute vertu. » … car le Dieu qui a tout n’a besoin de personne ; il a tout fait par </em><strong><em>son Verbe et par son esprit</em></strong><em>, disposition, administration ; il fait tout, il domine tout</em></p></blockquote><p>(<a href="https://azbyka.ru/otechnik/Irinej_Lionskij/protiv-eresej/1_22">Contre les hérésies, I, 22.1 (en russe)</a>)</p><blockquote><p><strong><em>Dieu</em></strong><em>, qui avait créé les anges, pouvait avoir besoin des anges pour faire ce qu’il voulait faire ? N’avait-il pas avec lui le Verbe et l’Esprit saint avec lesquels il peut tout ? </em><strong><em>Le Verbe ou le Fils, l’Esprit ou la Sagesse, sont toujours avec lui</em></strong><em> ; c’est par eux et avec eux qu’il crée et qu’il agit en liberté ; </em><strong><em>c’est à eux qu’il parle dans l’Écriture, lorsqu’il dit : « Faisons l’homme à notre image et à notre ressemblance. »</em></strong><em> Il a trouvé en lui-même les éléments avec lesquels il a formé les créatures, le modèle sur lequel il les a faites, ainsi que le type de toutes les formes qui font l’ornement de l’univers.</em></p></blockquote><p>(<a href="https://azbyka.ru/otechnik/Irinej_Lionskij/protiv-eresej/4_20#sel=131:121,131:201">Contre les hérésies, IV, 20.1 (en russe)</a>)</p><blockquote><p><em>Mais la voie de ceux qui appartiennent à l’Église parcourt le monde entier, car elle possède la solide tradition des apôtres et nous montre que tous ont une seule et même foi ; en effet, </em><strong><em>tous reçoivent le même Dieu le Père</em></strong><em>, croient à la même économie de l’incarnation du </em><strong><em>Fils de Dieu</em></strong><em>, connaissent le même don de </em><strong><em>l’Esprit</em></strong><em>, observent les mêmes commandements et gardent la même forme d’organisation de l’Église</em></p></blockquote><p>(<a href="https://azbyka.ru/otechnik/Irinej_Lionskij/protiv-eresej/5#sel=109:51,109:116">Contre les hérésies, V, 20.1 (en russe)</a>)</p><blockquote><p><em>Tels seront donc l’ordre et les divers degrés du salut, au dire des anciens prêtres qui ont été les disciples des apôtres ; </em><strong><em>on arrivera au Fils par la grâce de l’Esprit saint ; et on montera ensuite vers le Père par la grâce du Fils</em></strong><em>, parce que le Fils fera ainsi hommage au Père de son œuvre, qui est le salut de l’homme</em></p></blockquote><p>(<a href="https://azbyka.ru/otechnik/Irinej_Lionskij/protiv-eresej/5#sel=109:51,109:116;190:97,190:131">Contre les hérésies, V, 36.2 (en russe)</a>)</p><h3>Le Christ — Dieu</h3><blockquote><p><em>C’est là ce mystère qu’il dit lui avoir été révélé, et qui lui fit voir clairement que </em><strong><em><mark>celui qui a souffert sous Ponce-Pilate, est</mark> le maître souverain de toutes choses ; qu’il est le roi, <mark>le Dieu</mark> et le juge</em></strong><em> ; qu’il reçoit la puissance de celui dont tout émane : « Il s’est humilié lui-même, se rendant obéissant jusqu’à la mort, et jusqu’à la mort de la croix. »</em></p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/IrLn_Contre_les_h%C3%A9r%C3%A9sies_3">Contre les hérésies, III, XII.9</a>)</p><h3>Dieu s’est fait homme en naissant d’une vierge</h3><blockquote><p><em>Notre </em><strong><em><mark>Dieu s’est donc fait homme</mark></em></strong><em> pour notre salut, et il s’est annoncé par un miracle en naissant du sein d’une </em><strong><em><mark>vierge</mark></em></strong><em>. … ainsi le Verbe, qui représentait Adam dans l’œuvre de la régénération spirituelle, devait-il pareillement naître d’une </em><strong><em><mark>femme vierge encore, de Marie</mark>.</em></strong></p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/IrLn_Contre_les_h%C3%A9r%C3%A9sies_3">Contre les hérésies, III, XXI</a>)</p><h3>Le salut n’est possible que dans l’Église</h3><blockquote><p><em>« Et Dieu, comme dit saint Paul, </em><strong><em><mark>a établi</mark></em></strong><em> dans son </em><strong><em><mark>Église</mark></em></strong><em>, premièrement des apôtres, secondement des prophètes, troisièmement des docteurs, » </em><strong><em><mark>et tout le reste de cette hiérarchie que le Saint-Esprit dirige, et dont sont nécessairement exclus tous ceux qui ne marchent pas avec l’Église</mark></em></strong><em>, et qui, par leur conduite criminelle</em><strong><em><mark>, prononcent leur propre condamnation et s’excluent eux-mêmes de la vie éternelle</mark>. Car, là où est l’Église, là est l’Esprit de Dieu ; et là où est l’Esprit de Dieu, là est l’Église et la source de toute grâce : et enfin là est l’esprit de l’Église, c’est-à-dire la vérité même.</em></strong><em> Aussi </em><strong><em><mark>ceux qui ne reçoivent pas les émanations de cet esprit, ne seraient-ils pas admis à boire du lait de vie aux mamelles de cette mère commune, de l’Église, ni à goûter, en se nourrissant du corps du Christ, des eaux de la fontaine ineffable de l’immortalité</mark></em></strong><em> ; mais, pour parler le langage du prophète, ils se creusent des citernes et ne boivent que des eaux fétides et corrompues</em><strong><em><mark> ; ils redoutent la foi de l’Église qui serait leur condamnation</mark></em></strong><em>, et ils rejettent</em><strong><em><mark> l’Esprit</mark></em></strong><em> qui confondrait leur ignorance.</em></p><p><em>2. </em><strong><em>Ceux donc qui se sont ainsi séparés sont condamnés à flotter à tout vent de doctrine, à n’avoir qu’une opinion qui varie selon les temps, ne pouvant avoir d’idée fixe sur aucune chose</em></strong><em> ; sophistes plus occupés à jeter des paroles qu’à rechercher la vérité. Car leurs doctrines, loin d’être comme l’Église, établies sur la pierre et sur une pierre unique, sont bâties sur le sable et présentent les principes les plus opposés.</em></p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/IrLn_Contre_les_h%C3%A9r%C3%A9sies_3">Contre les hérésies, livre 3, chap. XXIV</a>)</p><blockquote><p><em>C’est donc aux évêques et aux prêtres, qui tiennent des mains des apôtres le dépôt de la foi, et qui ont reçu l’ordination d’après l’institution même du Christ, que nous devons nous en rapporter pour les véritables règles de notre croyance. Quant à ceux qui s’éloignent du sein de l’Église, quel que soit le lieu où ils se réunissent, nous devons les tenir pour suspects, </em><strong><em>à l’égal des hérétiques et des gens de mauvaise foi, ou comme des hommes égarés par l’orgueil et ne se complaisant qu’en eux-mêmes ; ou bien enfin comme des hypocrites qui n’ont pour mobile de leur conduite qu’un vil intérêt et une vaine gloire. <mark>Tous ceux-là ont quitté le chemin de la vérité</mark></em></strong><em>. Mais un châtiment particulier est réservé </em><strong><em><mark>aux hérétiques</mark>, qui apportent à l’autel de Dieu un feu étranger, un feu autre que celui destiné au sacrifice, c’est-à-dire des doctrines fausses et impies ; <mark>ils seront frappés de la foudre céleste</mark></em></strong><em>, comme Nadab et Abiud dont parle l’Écriture. </em><strong><em><mark>Pour ceux qui s’élèvent contre la vérité</mark>, qui cherchent à susciter des ennemis à l’Église, <mark>ils seront jetés dans les enfers</mark></em></strong><em> et engloutis dans le sein de la terre, ils subiront le sort de Coré, Dathan et Abiron ; et pour </em><strong><em><mark>ceux qui cherchent à rompre l’unité de l’Église et à opérer des schismes, Dieu leur infligera le même châtiment</mark></em></strong><em> que celui qui frappa Jéroboam.</em></p><p><em>…</em></p><p><strong><em>Il faut donc s’éloigner avec soin de tous ceux qui ne professent pas une foi franche et sincère, <mark>et ne s’attacher qu’à ceux qui restent fidèles à la doctrine des apôtres, ceux dont les discours sont en tout conformes aux lois de la vérité et de la charité</mark></em></strong><em>, et ont pour objet le salut de leurs frères.</em></p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/IrLn_Contre_les_h%C3%A9r%C3%A9sies_4">Contre les hérésies, livre 4, chap. XXVI, 2</a>)</p><h3>La vie de l’âme après la mort</h3><p>On trouve ici également une négation de la transmigration des âmes (il polémique contre le platonisme) :</p><blockquote><p>Dans le passage de l’Évangile où il est parlé du mauvais Riche et de Lazare qui se reposait dans le sein d’Abraham, notre Seigneur nous a enseigné <strong><mark>que les âmes étaient immortelles</mark>, qu’elles ne passaient point d’un corps dans un autre corps, mais qu’elles conservaient les mêmes penchants qu’elles avaient eus pendant leur séjour dans le corps, se ressouvenant de toute leur vie passée</strong>. Il est dit dans le même passage que le Riche reconnaissait Lazare, après la mort, ainsi qu’Abraham, conservant chacun leur individualité, et le Riche conjurant Lazare de venir le soulager dans ses tourments, lui à qui il avait refusé jusqu’aux miettes qui tombaient de sa table, durant la vie ; on y voit encore, ce qui prouve toujours que les âmes se ressouviennent, qu’Abraham se rappelle, non-seulement les actions qui lui sont personnelles, mais encore de celles du mauvais Riche, puisqu’on l’entend recommander l’accomplissement de la loi de Moïse à ceux qui voudraient éviter un semblable avenir, parce qu’ils seraient jugés par celui qui devait ressusciter d’entre les morts. Le Christ nous a donc hautement annoncé qu’il était certain que <strong><mark>les âmes seront immortelles</mark>, qu’elles ne subiront point de transmigration d’un corps dans un autre, qu’elles se ressouviendront de ce qu’elles auront fait pendant leur séjour sur la terre, qu’elles conserveront leur individualité, qui les distingue les unes des autres : il nous apprend aussi que l’esprit de prophétie inspire encore Abraham après la mort, et que <mark>les âmes des morts, même avant le jour du jugement, resteront dans un séjour heureux ou malheureux, selon qu’elles auront mérité ou démérité</mark>.</strong></p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/IrLn_Contre_les_h%C3%A9r%C3%A9sies_2">Contre les hérésies, livre 2, chap. 34, § 1</a>)</p><h3>Les âmes des justes demeurent avec Dieu après la mort</h3>
      <blockquote><p><em>Aussi, c’est pour satisfaire aux besoins de cet amour divin que l’Église </em><strong><em><mark>envoie sans cesse vers Dieu la foule de ses martyrs</mark></em></strong></p></blockquote>
      <p>(<a href="https://bibleox.com/fr/fr/w/IrLn_Contre_les_h%C3%A9r%C3%A9sies_4">Contre les hérésies, livre IV, chapitre 33, § 9</a>)</p>
      <p>Pour en savoir plus : <a href="https://bibleox.com/fr/ru/w/%D0%98%D1%80%D0%B8%D0%BD%D0%B5%D0%B9_%D0%9B%D0%B8%D0%BE%D0%BD%D1%81%D0%BA%D0%B8%D0%B9-%D0%B2%D0%B5%D1%80%D0%B0_%D0%B2_%D0%BF%D0%BE%D1%81%D0%BC%D0%B5%D1%80%D1%82%D0%BD%D1%83%D1%8E_%D1%83%D1%87%D0%B0%D1%81%D1%82%D1%8C_%D1%81_%D0%91%D0%BE%D0%B3%D0%BE%D0%BC">la foi en la destinée posthume auprès de Dieu (en russe)</a></p>
      <h3>La sanctification de la matière créée</h3>
      <blockquote><p><em>« nous, étant lépreux dans nos péchés, </em><strong><em>nous sommes purifiés par <mark>l’eau sainte</mark> et l’invocation du Seigneur</em></strong><em> (διὰ τοῦ ἁγίου ὕδατος καὶ τῆς τοῦ Κυρίου ἐπικλήσεως) de nos péchés passés, renaissant spirituellement, comme des enfants nouveau-nés, ainsi que le Seigneur l’a dit : si quelqu’un ne naît de l’eau et de l’Esprit, il n’entrera pas dans le Royaume des cieux »</em></p></blockquote>
      <p>(Fragments, 33)</p>
      <h3>La réalité du corps et du sang du Christ dans l’Eucharistie</h3>
      <blockquote><p><em>Elle est donc chimérique de tous points l’opinion de ceux qui dédaignent ainsi de reconnaître tous les desseins de Dieu sur nous, qui refusent le salut à l’homme, et nient </em><strong><em>la régénération de la chair</em></strong><em>, disant que la chair n’est pas capable de devenir incorruptible. Or, si cette régénération de la chair ne pouvait pas avoir lieu /alors il serait faux que notre Seigneur nous eût rachetés de son sang ; il ne serait pas vrai </em><strong><em>que le vin fût changé en son sang dans l’Eucharistie, et que le pain qui nous y est donné fût son corps</em></strong><em>. Car, </em><strong><em>le sang suppose les veines et les chairs, et tout ce qui fait partie de la conformation de l’homme, que le verbe de Dieu a bien voulu prendre pour notre salut.</em></strong><em> Il nous a donc réellement rachetés par son sang, selon ces paroles de l’apôtre, « par le sang duquel nous avons été rachetés, et nous avons reçu le pardon de nos péchés. » Et c’est parce que </em><strong><em>nous sommes ses membres, qu’il nous nourrit au moyen des choses créées par lui</em></strong><em> ; c’est pour nous qu’il fait luire son soleil et tomber la pluie quand il veut ; il fait servir à notre usage ce calice, qui est un objet créé, et qui contient son sang, que nous buvons, et qui fortifie notre sang ; et ce pain, créature aussi, qui contient son corps, que vous mangeons, et qui nourrit notre corps.</em></p><p><em>Il faut donc reconnaître </em><strong><em><mark>que le vin et le pain de l’Eucharistie deviennent, par le pouvoir de la parole de Dieu, le corps et le sang de Jésus-Christ</mark></em></strong><em>, et servent ensuite à nourrir et à entretenir la vie dans notre corps ; mais alors, comment peut-on ne pas reconnaître que la chair, ou que notre corps ne puisse également recevoir de Dieu le don de la vie éternelle, </em><strong><em>dès que ce corps se nourrit du corps et du sang du Christ, et devient un de ses membres</em></strong><em>, et comme le dit l’apôtre saint Paul dans l’épître aux Éphésiens : « Parce que nous sommes les membres de « son corps, formés de sa chair et de ses os ? » </em><strong><em><mark>Or, ces paroles ne peuvent s’appliquer à quelque chose de purement incorporel et d’invisible</mark>, (car un esprit n’a ni chair ni os) ; mais elles s’appliquent évidemment à une chose conformée comme l’homme, et qui contient de la chair, des nerfs et des os, pour qui le vin qui est dans le calice, et qui est le sang du Christ, et le pain qui est son corps, deviennent une nourriture</em></strong><em>.</em></p></blockquote>
      <p>(<a href="https://azbyka.ru/otechnik/Irinej_Lionskij/protiv-eresej/5"><u>Dénonciation et réfutation de la fausse gnose, ou “Contre les hérésies” : </u>Livre 5</a>)</p>
      <blockquote><p><em>Mais il n’y a que l’Église qui puisse accomplir le sacrifice dans toute sa pureté, </em><strong><em>en offrant à Dieu, avec des actions de grâces</em></strong><em>, les prémices de ses propres créatures. Les Juifs ne le pourraient pas, leurs mains sont encore souillées du sang innocent. Ils n’ont pas voulu reconnaître le Verbe même, qui est offert chaque jour à Dieu dans le saint sacrifice. Les différentes sectes d’hérétiques n’en sont pas mieux capables que les Juifs ; car, parmi eux, il en est qui ne reconnaissent pas notre Dieu, en supposent un autre, et, en lui offrant les prémices de ses propres dons, nous montrent leur Dieu comme un être avide du bien d’autrui. Si nous voulions parler ici des gnostiques, qui supposent que les choses créées sont le produit d’une révolte, de l’ignorance et de quelque iniquité, ce qu’ils offriraient à Dieu proviendrait de la même souillure ; et ils ne pourraient offrir le sacrifice sans offenser notre souverain Créateur, et cet acte de leur part ressemblerait bien plus à une insulte qu’à une action de grâces. D’ailleurs, comment </em><strong><em><mark>le pain qui est offert en actions de grâces dans le sacrifice serait-il pour eux le corps de notre Seigneur ainsi que son sang</mark></em></strong><em>, puisqu’ils ne le reconnaissent pas pour le fils de Dieu, c’est-à-dire pour son Verbe, par qui tout est fécondé dans la nature, qui fait croître les plantes, qui fait jaillir les fontaines, qui fait germer le blé et fait mûrir la moisson ?</em></p><p><em>Ne prétendent-ils pas encore que l’âme est incapable de résurrection, et que le corps et le sang, en s’unissant à elle, la privent de la vie éternelle ? Qu’ils changent donc de pensées, ou qu’ils s’abstiennent entièrement d’offrir le sacrifice. Quant à nous, notre foi est conforme à la nature de l’Eucharistie, et l’Eucharistie elle-même est conforme à notre foi. Nous reconnaissons, en faisant notre oblation, que les dons que nous offrons à Dieu nous les tenons de sa bonté, et nous avons foi dans </em><strong><em><mark>la double résurrection de la chair et de l’esprit</mark></em></strong><em>, que nous attendons du mérite de l’oblation. Car, de même que </em><strong><em>le pain qui sert au sacrifice est un fruit de la terre, lequel par la toute-puissance de Dieu, il cesse d’être un pain ordinaire et devient l’Eucharistie, ayant en elle deux substances, la substance spirituelle et la substance matérielle, ainsi nos corps, en recevant l’Eucharistie, participent de la nature céleste, deviennent impérissables, et sont marqués du sceau de la résurrection</em></strong><em>.</em></p></blockquote>
      <p>(<a href="https://azbyka.ru/otechnik/Irinej_Lionskij/protiv-eresej/4#sel=120:76,121:101">Contre les hérésies, livre 4</a>)</p><h3>Dans l’Eucharistie, le pain et le vin sont offerts à Dieu en sacrifice</h3><blockquote><p><strong>L’oblation que notre Seigneur a enseigné à l’Église à offrir chaque jour par toute la terre, est un sacrifice de pureté aux yeux de Dieu, et qui lui est agréable ; non pas, nous le répétons, que Dieu ait besoin d’aucun sacrifice, mais parce qu’il veut que l’homme qui fait l’offrande trouve un moyen de salut dans cette offrande même, si elle paraît à Dieu digne d’être agréée. N’est-ce pas en effet par des présents que nous prouvons même aux rois de la terre notre vénération et notre amour ?</strong> <strong>Or, <mark>cette offrande doit être offerte</mark> dans toute simplicité et toute innocence de cœur, comme notre Seigneur nous l’a enseigné</strong>, quand il a dit : « Si donc vous présentez votre offrande à l’autel, et que là vous vous souveniez que votre frère a quelque chose contre vous, laissez là votre offrande devant l’autel, et allez d’abord vous réconcilier avec votre frère, et alors revenant, vous présenterez votre offrande. » <strong>C’est donc là <mark>ces prémices qu’il faut offrir à Dieu</mark></strong> ; car Moïse dit : « Vous ne paraîtrez pas les mains vides devant le Seigneur. » C’est ainsi que l’homme peut offrir à Dieu sa gratitude par l’offrande même du cœur qui la ressent, et en éprouver une glorification spirituelle.</p><p>2. <strong><mark>Et il ne faut pas dire que les oblations aient été abolies ; mais autre chose étaient alors les oblations, autre chose elles sont aujourd’hui : autrefois c’était le peuple qui offrait le sacrifice, aujourd’hui c’est l’Église. Le sacrifice subsiste donc toujours, mais il a changé d’espèce et de forme.</mark></strong></p><p>…</p><p>Nous voyons que, dès le commencement du monde, <strong>les offrandes d’Abel furent agréables au Seigneur, parce qu’il les accompagnait d’un sentiment d’innocence et de justice</strong>, tandis que celles de Caïn ne furent pas regardées d’un œil aussi favorable, parce qu’il avait déjà souillé son cœur en y laissant pénétrer la jalousie et la haine ; ce qui lui attira les justes reproches de Dieu, qui lui dit : « Si tu fais bien, n’en recevras-tu pas le salaire ? Tu as péché : chasse tes mauvaises pensées. » … En effet, il ne suffit pas d’offrir une offrande, quelque pure qu’elle puisse être, si, dans le fond de l’âme, on n’est pas animé d’un sentiment suffisant d’amour et de crainte de Dieu. Ce ne sera pas l’appareil extérieur du sacrifice qui fera oublier à Dieu notre amour intérieur pour le péché : une pareille offrande ne sert à rien ; mais il faut effacer la souillure de l’âme, de peur que, par une prière toute d’hypocrisie, nous ne rendions impossible de notre part tout retour au bien.</p><p>…</p><p><strong>C’est donc parce que l’Église offre le saint sacrifice avec la simplicité du cœur, que ce sacrifice monte vers Dieu comme une offrande pure.</strong></p><p>…</p><p><strong>Ainsi, <mark>ce qui peut rendre notre offrande agréable à Dieu</mark>, c’est notre sentiment de reconnaissance envers lui, c’est une foi pure et sincère, c’est notre ferme espérance jointe à un amour fervent, ce sont enfin toutes les dispositions intérieures.</strong> Mais il n’y a que l’Église qui puisse accomplir le sacrifice dans toute sa pureté, en offrant à Dieu, avec des actions de grâces, <mark>les prémices de ses propres créatures</mark>. Les Juifs ne le pourraient pas, leurs mains sont encore souillées du sang innocent. Ils n’ont pas voulu reconnaître le Verbe même, qui est offert chaque jour à Dieu dans le saint sacrifice. <strong>Les différentes sectes d’hérétiques n’en sont pas mieux capables que les Juifs</strong>.</p><p>…</p><p>D’ailleurs, comment le pain qui est offert en actions de grâces dans le sacrifice serait-il pour eux le corps de notre Seigneur ainsi que son sang, puisqu’ils ne le reconnaissent pas pour le fils de Dieu, c’est-à-dire pour son Verbe, par qui tout est fécondé dans la nature, qui fait croître les plantes, qui fait jaillir les fontaines, qui fait germer le blé et fait mûrir la moisson ?</p><p>…</p><p>Ne prétendent-ils pas encore que l’âme est incapable de résurrection, et que le corps et le sang, en s’unissant à elle, la privent de la vie éternelle ? <strong>Qu’ils changent donc de pensées, ou qu’ils s’abstiennent entièrement d’offrir le sacrifice. Quant à nous, notre foi est conforme à la nature de l’Eucharistie, et l’Eucharistie elle-même est conforme à notre foi.</strong> <strong>Nous reconnaissons, en faisant notre oblation, que <mark>les dons que nous offrons à Dieu nous les tenons de sa bonté</mark></strong>, et nous avons foi dans la double résurrection de la chair et de l’esprit, que nous attendons du mérite de l’oblation. Car, de même que le pain qui sert au sacrifice est un fruit de la terre, lequel par la toute-puissance de Dieu, il cesse d’être un pain ordinaire et devient <strong>l’Eucharistie</strong>, ayant en elle deux substances, la substance spirituelle et la substance matérielle, ainsi nos corps, en recevant <strong>l’Eucharistie</strong>, participent de la nature céleste, deviennent impérissables, et sont marqués du sceau de la résurrection.</p><p>6. <strong><mark>Notre oblation est donc envers Dieu, qui n’a cependant nul besoin de nous</mark>, un moyen d’expression de notre reconnaissance et un moyen de sanctification</strong> … <strong>Dieu veut donc, <mark>sans qu’il en ait nul besoin, que nous fassions de bonnes œuvres</mark>,</strong> afin que nous ne soyons pas sans droit à ses récompenses. <strong>Dans l’ancienne loi, le peuple hébreu eut à observer le précepte qui ordonnait des offrandes, afin qu’il s’accoutumât à la soumission à Dieu ; c’est ainsi qu’il exige de nous <mark>que nos prières et nos oblations montent sans cesse vers son autel</mark>.</strong></p></blockquote><p>(<a href="https://azbyka.ru/otechnik/Irinej_Lionskij/protiv-eresej/4"><u>Contre les hérésies, livre IV, chapitre 18, sur les sacrifices (en russe)</u></a>)</p><h3>Négation de l’idée que la foi et l’amour suffisent au salut et que tout le reste (œuvres, sacrements) est indifférent</h3><blockquote><p><strong><mark>Ils le soutiennent dans leurs écrits</mark></strong>, et ils ne craignent pas d’ajouter que Jésus, parlant mystérieusement à ses apôtres des paroles d’en haut, les ait invités à confier, parmi ceux qui en seraient dignes, la science transcendante ; <strong><mark>que la foi et la charité suffisaient pour le salut. Indifférence pour tout le reste</mark></strong>, justice et injustice, ne sont qu’un mot, rien n’étant mauvais de sa nature.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/IrLn_Contre_les_h%C3%A9r%C3%A9sies_1">Contre les hérésies, I, 25, 5</a>)</p><h3>Nécessité du baptême pour le salut</h3><blockquote><p>Et de même encore que la terre, stérile par elle-même, ne pourrait pas produire sans les humeurs qui la rendent féconde, ainsi nous-mêmes, sans la pluie de la grâce, nous serions demeurés comme un bois desséché et n’aurions pu produire les fruits de la vie éternelle. <strong><mark>L’eau purifie nos corps et les préserve de la corruption ; la grâce de l’Esprit saint purifie nos âmes. L’une et l’autre espèce de purification est nécessaire</mark></strong>, parce que l’une et l’autre contribuent à conserver la vie du corps et de l’âme.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/IrLn_Contre_les_h%C3%A9r%C3%A9sies_3">Contre les hérésies, livre III, chap. 17</a>)</p><blockquote><p>Lorsque l’apôtre Philippe rencontra l’eunuque de la reine d’Éthiopie, qui lisait ce passage de l’Écriture : « Il sera conduit à la mort comme un agneau, il sera muet comme une brebis devant celui qui la tond, il est mort au milieu des angoisses, après un jugement ; » ensuite tout ce qui est relatif à son avènement sur la terre, à sa passion, à toutes les humiliations dont il a été abreuvé par ceux qui ne voulurent pas croire en lui, Philippe n’eut pas de peine à persuader à cet homme que le Christ dont parle le prophète était le même qui a été crucifié sous Ponce-Pilate, et qui a souffert ; et que ce Christ est le fils de Dieu, qui a apporté le salut éternel aux hommes, il le baptisa alors, et puis il le quitta aussitôt. <strong>Cet homme, en effet, n’avait plus rien à apprendre ; car il avait été converti et enseigné par le prophète même.</strong> Il s’était instruit à cette lecture de la connaissance de Dieu, de ses desseins ; il n’ignorait plus qu’une chose, c’était la venue du fils de Dieu. À peine eut-il appris cet événement de la bouche de l’apôtre, qu’il s’en alla rempli de joie ; et bientôt après on l’entendit prêcher la foi du Christ en Éthiopie. Philippe n’eut donc pas de peine, comme nous l’avons dit, à le convertir, parce que la lecture des prophéties l’avait rempli de la crainte de Dieu en le disposant à la foi. C’est ainsi que les apôtres ramenaient au bercail, par leurs prédictions, les brebis égarées du troupeau d’Israël, en prêchant que le Christ qui avait été crucifié n’était autre que le Christ, fils du Dieu vivant ; ils convertissaient en foule ceux qui avaient déjà la crainte de Dieu. Aussi dans un seul jour en convertissaient-ils trois, et quatre et jusqu’à cinq mille.</p></blockquote><p>(<a href="https://azbyka.ru/otechnik/Irinej_Lionskij/protiv-eresej/5_24#sel=13:110275,13:110488">Cinq livres contre les hérésies (en russe)</a>)</p><h3>Le baptême des petits enfants</h3>
      <blockquote><p><em>Le Christ était âgé de trente ans, lorsqu’il reçut le baptême de saint Jean. Ce fut après cela qu’ayant atteint l’âge de l’apostolat, il vint à Jérusalem, se montra publiquement, de manière que chacun put entendre ses enseignements. Mais il n’y avait point deux êtres différents en lui, l’un apparent, et l’autre invisible ; c’était bien lui-même qui s’offrait aux regards de tous. Étant le maître de ses disciples, il avait l’âge d’un maître, se conformant ainsi à toutes les conditions de l’humanité, jusqu’à laquelle il s’était abaissé, et sanctifiant tous les âges par lesquels il avait bien voulu passer. Car <strong>il est venu pour sauver tous les hommes</strong>, tous ceux <strong>qui</strong> <strong><mark>renaissent en Dieu</mark></strong> par sa grâce, tant les <strong>enfants</strong> que les jeunes gens, les hommes faits et les vieillards. C’est pour sanctifier tous les âges de l’homme qu’il a voulu les traverser ; il s’est fait enfant, afin de sanctifier l’enfance ; il s’est fait également adolescent, afin de sanctifier l’adolescence, lui donnant l’exemple de la soumission et de l’obéissance ; il a sanctifié pareillement l’âge mûr, par l’exemple de toutes les vertus et par la prédication de la vérité : c’est ainsi qu’il a parcouru les phases de la vie jusqu’à la mort, « afin qu’il fût le premier-né d’entre les morts, et qu’il eût la primauté en toute chose. » Car il est le prince de la vie, le premier de tous, et marche en avant de tous.</em></p></blockquote>
      <p>(<a href="https://azbyka.ru/otechnik/Irinej_Lionskij/protiv-eresej/2">Contre les hérésies, livre II, chap. 22, 4 (en russe)</a>)</p>
      <p>« La <strong>régénération en Dieu</strong> » est le nom donné au baptême (c’est une expression constante chez les anciens chrétiens). Saint Irénée le dit à la lettre :</p>
      <blockquote><p><em>Ils se sont attachés à nier <strong><mark>le baptême, seul moyen de régénération divine</mark></strong> ; le temps viendra où nous les réfuterons, parce qu’en dernier résultat toute la foi est ainsi rejetée par ces hérésiarques.</em></p></blockquote>
      <p>(<a href="https://bibleox.com/fr/fr/w/IrLn_Contre_les_h%C3%A9r%C3%A9sies_1">Contre les hérésies, I, 21</a>)</p>
      <blockquote><p><em>Ailleurs encore, <strong>lorsqu’il investit ses apôtres du pouvoir de <mark>régénérer le monde</mark></strong>, il leur dit : « Allez donc, enseignez toutes les nations, <strong><mark>les baptisant</mark> au nom du Père, et du Fils, et du Saint-Esprit</strong>. » N’a-t-il pas promis, en effet, de remplir de cet Esprit, vers la fin des temps, ses serviteurs et ses servantes, et de leur donner ainsi le don de prophétie ? L’Esprit saint est donc descendu d’abord sur le fils de Dieu, devenu fils de l’homme</em></p></blockquote>
      <p>(<a href="https://azbyka.ru/otechnik/Irinej_Lionskij/protiv-eresej/3#sel=121:124,121:181">Contre les hérésies, livre III, chap. 17, 1 (en russe)</a>)</p>
      <p>Le même mot s’emploie aussi chez son contemporain saint Justin, martyr :</p>
      <blockquote><p><em>Le Christ, premier-né de la création, était aussi le premier auteur ou le principe de cette race nouvelle <strong>qu’il a <mark>régénérée</mark> par <mark>l’eau du baptême</mark>, par le mérite de la foi</strong></em></p></blockquote>
      <p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Dialogue_avec_Tryphon">Dialogue avec Tryphon</a>)</p>
      <blockquote><p><em>Ensuite, <strong>ils sont conduits par nous au lieu où est l’eau, et là, de la même manière que nous avons été régénérés nous-mêmes, ils sont <mark>régénérés</mark> à leur tour</strong>. Au nom de Dieu le père et le maître de toutes choses, et de Jésus-Christ, notre Sauveur, et du Saint-Esprit, ils sont alors <strong><mark>lavés</mark> dans <mark>l’eau</mark></strong>. Car le Christ a dit : « Si vous ne renaissez, vous n’entrerez pas dans le royaume des cieux. »</em></p></blockquote>
      <p>(<a href="https://bibleox.com/fr/fr/w/JsNp_Premi%C3%A8re_Apologie">Première Apologie</a>)</p>
      <h3>Les autres langues — des langues étrangères</h3>
      <p>Les chrétiens parlaient miraculeusement des langues étrangères :</p>
      <blockquote><p><em>c’est ce qui fait dire à l’apôtre : « Nous prêchons néanmoins la sagesse aux parfaits ; » il appelle parfaits ceux qui ont reçu l’esprit de Dieu, à qui cet esprit a accordé <mark>le don</mark> de <u><mark>toutes</mark></u> <mark>les langues</mark>, comme il les connaît lui-même. Quant à nous, <strong>nous avons connu plusieurs de nos frères en Jésus-Christ qui jouissaient de cette perfection, ayant le don de prophétie et celui <u><mark>des langues</mark></u>, et révélant les pensées les plus cachées des hommes et <mark>expliquant les mystères</mark> de Dieu, <mark>quand cela était utile à faire</mark></strong> ; c’est là les hommes que l’apôtre appelle spirituels, mais il l’entend par l’union de l’esprit avec la chair, et non point purement avec l’esprit.</em></p></blockquote>
      <p>(<a href="https://azbyka.ru/otechnik/Irinej_Lionskij/protiv-eresej/5#sel=34:61,34:151">Contre les hérésies, livre V, chap. 6 (en russe)</a>)</p>
      <p>Il parle ici de l’hérétique qui, par la tromperie et avec l’aide des puissances démoniaques, ne donnait pas un don, mais apprenait (comme le font aujourd’hui les pentecôtistes et les charismatiques) à ouvrir la bouche et à débiter aux gens tout le vain bavardage qui leur vient à l’esprit, en leur persuadant qu’ils prophétisent :</p>
      <blockquote><p><em>Pourquoi ne serait-il pas permis de croire que, lié par un pacte infernal à l’esprit des ténèbres, cet imposteur <strong>n’ait le pouvoir de feindre l’esprit prophétique et de transmettre aux femmes qu’il en croit digne cette même faculté</strong> ? Ces femmes, auxquelles il semble prodiguer ses attentions, ne sont pas les moins élégantes, les moins belles, les moins riches. Quelquefois on le voit leur parler avec tendresse : « Je veux bien, leur dit-il, vous mettre en communion de mes grâces, parce que le créateur se plaît à contempler votre ange et à le contempler toujours. C’est dans nous que réside le siége de votre grandeur ; ne faisons plus qu’un désormais. Je vous donne ma grâce, recevez-la, je vous la donne de ma propre volonté comme une première faveur ; parez-vous comme la fiancée dans l’attente de son bien-aimé ; parez-vous, afin que vous et moi, moi et vous, tous deux, nous n’ayons plus qu’une seule âme. Que le lit nuptial reçoive une semence de lumière ; un époux vous viendra de moi, que votre âme se grandisse pour le comprendre, pour en être comprise, pour être absorbée en lui. <strong>Voici que sur vous ma grâce est descendue, ouvrez la bouche, et prophétisez. — Mais je n’ai jamais prophétisé, et j’en ignore l’art, répond la femme étonnée. » Alors se font sur elle de nouvelles invocations : on la frappe d’étonnement et de stupeur ; on lui donne d’elle-même une haute idée : « — Ouvrez la bouche, que toute parole prononcée par vous soit une prophétie désormais.</strong> » Ainsi hors d’elle-même, et livrée tout entière à l’ivresse de l’orgueil, l’imagination exaltée, le cœur ému, pleine d’audace et cédant pour ainsi à l’impulsion d’un esprit supérieur, <strong>elle prononce à haute voix toutes les paroles folles, incohérentes, impudentes même, qui lui viennent à la bouche</strong>.</em></p></blockquote>
      <p>(<a href="https://bibleox.com/fr/fr/w/IrLn_Contre_les_h%C3%A9r%C3%A9sies_1">Contre les hérésies, livre I, chap. 13, 3</a>)</p><h3>La liberté à l’égard des entraves de la loi de Moïse</h3><blockquote><p>La loi ancienne, faite pour un temps d’esclavage, se contentait de parler à l’âme et de l’instruire au moyen d’images corporelles, l’entraînant comme par force à l’exécution de ce qui était prescrit, afin qu’elle apprit comment il fallait servir Dieu ; mais le Verbe étant venu et ayant opéré la délivrance de l’âme ; celle-ci a communiqué au corps une partie de sa nouvelle pureté. Dans ce nouvel état, il a fallu <strong><mark>que les chaînes même de l’esclavage, auquel l’homme s’était accoutumé, fussent brisées</mark></strong> et <strong><mark>qu’il allât vers Dieu, libre de toute entrave</mark></strong>. Il fallut donner à la liberté la plus grande extension, et rendre d’autant plus grande la soumission volontaire envers Dieu, de peur que l’homme ne vînt à retourner à son ancien état, et ne se montrât indigne des bontés de son libérateur ; il devait désormais avoir pour Dieu l’amour et l’obéissance d’un enfant envers son père ; si cet amour et cette confiance sont les mêmes de la part des enfants et des serviteurs, toutefois ils doivent être à un plus haut degré dans le cœur des enfants, parce que <strong>l’état libre est toujours plus noble et plus grand que l’état d’obéissance passive</strong>.</p><p>…</p><p>Or, ce Dieu est notre Seigneur lui-même, le Verbe de Dieu, <strong><mark>qui a d’abord attiré l’homme vers Dieu, dès le temps de son esclavage, et qui ensuite lui a rendu sa liberté</mark></strong>, afin qu’il puisse mériter le salut éternel ; c’est ce qu’il a voulu dire en parlant à ses disciples : « Je ne vous appellerai plus serviteurs, parce que le serviteur ne sait pas ce que fait son maître. Mais je vous ai donné le nom d’amis, parce que je vous ai fait connaître tout ce que j’ai appris de mon Père. » Par ces mots : je ne vous appellerai plus serviteurs, il déclare qu’<strong><mark>il est l’auteur lui-même de cette ancienne et première loi qui règlait la conduite de l’homme dans son état d’esclavage, et qu’il est également l’auteur de sa délivrance</mark></strong>. Et ensuite par ces mots, le serviteur ne sait pas ce que fait le maître, il veut parler de l’ignorance qui pesait sur l’esprit de l’homme avant sa rédemption. Et en disant de ses disciples qu’ils sont les amis de Dieu, c’est bien dire qu’il est lui-même le Verbe, le Verbe qu’a vu Abraham dans l’inspiration d’une foi ardente, qui lui mérita l’amitié de Dieu même.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/IrLn_Contre_les_h%C3%A9r%C3%A9sies_4">Contre les hérésies, livre IV, chap. 13</a>)</p><blockquote><p><em>Les hommes <strong><mark>ne vivront pas dans la multiplicité des paroles de la loi, mais dans la brièveté (la simplicité) de la foi et de l’amour</mark></strong>, et Isaïe parle ainsi de cela : « Une parole brève et précise dans la justice ; car Dieu accomplira une parole brève sur toute la terre » (Is 10, 22-23). C’est pourquoi l’apôtre Paul dit : « L’amour est l’accomplissement de la loi » (Rm 13, 10) ; <strong><mark>car celui qui aime Dieu a accompli la loi</mark></strong>. Ainsi le Seigneur lui-même, lorsqu’on lui demanda quel était le premier commandement, répondit : « Tu aimeras le Seigneur ton Dieu de tout ton cœur et de toute ta force ; et le second lui est semblable : tu aimeras ton prochain comme toi-même. Toute la loi et les prophètes reposent sur ces deux commandements » (Mc 12, 30 sq. ; Mt 22, 37 sq.). Par la foi en lui, il développe notre amour de Dieu et du prochain, et par là nous devenons pieux, justes et bons ; c’est pourquoi il est dit : « Il a accompli sur la terre une parole brève, dans l’univers ».</em></p><p><em>…</em></p><p><em><strong><mark>Qu’il ne veut pas ramener les rachetés à la législation de Moïse — car la loi a été accomplie par le Christ — mais qu’il faut vivre de la foi et de l’amour qui viennent du Fils de Dieu, selon la nouveauté de cette parole</mark></strong>, Isaïe l’annonce ainsi : « Ne vous souvenez plus des choses d’autrefois, ne méditez pas ce qui s’est produit jadis. Voici que je fais une chose nouvelle : elle est déjà là, et vous la connaîtrez. Je ferai des fleuves dans le désert et des eaux dans la steppe aride, pour abreuver mon peuple élu, le peuple que j’ai acquis pour moi, afin qu’il annonce ma gloire » (Is 43, 19-21). Or, le désert et la steppe étaient autrefois la vocation des païens, car ni le Verbe ne les traversait, ni l’Esprit Saint ne les abreuvait, lui qui a ouvert une voie nouvelle de piété et de justice et fait jaillir d’abondants torrents, c’est-à-dire qui a répandu sur la terre l’Esprit Saint, comme il l’avait promis par les prophètes, en disant que dans les derniers jours il répandrait l’Esprit sur toute la terre.</em></p><p><em>90. Ainsi donc, notre vocation est l’œuvre du renouvellement de l’esprit, et non de notre être ancien, comme l’a prophétisé Jérémie</em></p><p><em>…</em></p><p><em>La première assemblée (c’est-à-dire l’Église) avait pour époux la loi même.</em></p><p><em>…</em></p><p><em>Après que cette vocation nous a donné la vie, et après que Dieu a de nouveau amené à sa perfection en nous la foi d’Abraham en lui, je pense que <strong><mark>nous ne devons plus revenir à la première législation.</mark> Car nous avons reçu le Seigneur de la loi, le Fils de Dieu. Et par la foi en lui nous apprenons à aimer Dieu de tout notre cœur et le prochain comme nous-mêmes</strong>. Or l’amour de Dieu est éloigné de tout péché, et l’amour du prochain ne fait aucun mal au prochain (cf. Rm 13, 10).</em></p><p><em>96. C’est pourquoi <strong><mark>nous n’avons besoin d’aucune loi comme pédagogue</mark></strong> ; voici que nous parlons avec le Père et nous nous tenons devant lui face à face, devenus petits enfants dans le mal et affermis dans la justice et l’honnêteté. Car <strong>la loi ne dira plus : « Tu ne commettras point d’adultère » à celui qui n’éprouve plus jamais de désirs de convoitise pour la femme d’autrui ; la loi ne dira plus : « Tu ne tueras point » à celui qui a écarté de lui toute colère et toute inimitié ; elle ne dira pas : « Tu ne convoiteras point la maison de ton prochain, ni son bœuf, ni son âne » à ceux qui ne se soucient absolument pas des choses terrestres, mais recueillent les fruits célestes ; elle ne dira pas : « Œil pour œil et dent pour dent » (Ex 21, 24) à celui qui ne considère personne comme son ennemi, mais tous comme ses proches ; c’est pourquoi il ne pourra jamais étendre les mains pour se venger. On ne peut exiger la dîme de celui qui apporte à Dieu tout son bien et quitte son père, sa mère et toute sa parenté pour suivre la Parole de Dieu. Et il n’est pas commandé de passer le jour dans le repos et le loisir à celui qui observe chaque jour le sabbat, c’est-à-dire qui, dans le temple de Dieu, qui est le corps de l’homme, rend à Dieu un culte digne et pratique la justice à toute heure. Car « je veux la miséricorde et non le sacrifice, dit-il, et la connaissance de Dieu plutôt que les holocaustes »</strong> (Os 6, 6).</em></p></blockquote><p>(<a href="https://azbyka.ru/otechnik/Irinej_Lionskij/apostolic_preaching/">Démonstration de la prédication apostolique (en russe)</a>)</p><h3>Le sabbat (la justice) en tout temps</h3><blockquote><p>L’Écriture nous apprend que la cérémonie de la circoncision avait été instituée, <strong>non pas comme pouvant donner pareillement la vertu de la perfection</strong>, mais seulement pour servir de signe de ralliement à tous les descendants d’Abraham. En effet, nous y lisons que Dieu dit à ce patriarche : « Tout mâle d’entre vous sera circoncis ; et vous circoncirez votre chair, afin que ce soit là un signe de l’alliance entre moi et vous. » (Gn 17, 10-11). <strong>Ézéchiel parle dans le même sens au sujet du sabbat</strong> : « Je leur ai prescrit encore un jour de <strong>sabbat</strong>, afin qu’ils fussent comme un signe entre moi et eux, et qu’ils connussent que moi je suis le Seigneur qui les sanctifie. » (Ez 20, 12). Dans l’Exode, Dieu dit à Moïse : « Ayez soin de garder le <strong>sabbat</strong> ; car c’est un signe entre moi et vous dans la suite de vos générations. » (Ex 31, 13). <strong>Ces cérémonies ont donc été ordonnées par Dieu seulement pour servir de signe. Mais ces signes avaient leur symbole et leur explication, comme tout ce qui sort de la main du Créateur.</strong> La circoncision de la chair était le signe de la circoncision spirituelle ; ce que l’apôtre explique, quand il dit : « Nous avons été circoncis, non d’une circoncision faite par la main des hommes, mais de la circoncision de Jésus-Christ. » (Col 2, 11). Le prophète avait dit déjà : « Ayez soin de circoncire votre cœur, et ne vous endurcissez pas davantage. » (Dt 10, 16). <strong>Quant au jour du sabbat, il devait être <mark>consacré tout entier au service de Dieu</mark></strong> ; à quoi s’applique le passage suivant de saint Paul : <strong>« Selon qu’il est écrit, <mark>on nous livre pendant toute la durée du jour</mark> à la mort, à cause de vous ; »</strong> (Rm 8, 36), <strong><mark>ce qui veut dire que les ministres de Jésus-Christ rendent à chaque instant témoignage de leurs foi, qu’ils s’y appliquent sans cesse, fuyant la cupidité et la recherche des biens de la terre</mark>.</strong> <strong>Le sabbat, qui était la figure du repos de Dieu après la création, signifiait le repos éternel, dont seront mis en possession ceux qui ont persévéré dans la foi.</strong></p><p>Ce qui prouve encore que ces cérémonies n’étaient qu’un signe et non point un moyen de salut, c’est qu’<strong>Abraham lui-même <mark>ne fut point circoncis et n’observa point la loi du sabbat</mark> ; ce qui n’a pas empêché qu’il n’ait cru en Dieu, que sa foi ne lui ait été imputée à justice</strong>, et qu’il n’ait mérité de jouir de l’amitié de Dieu même (Jc 2, 23). Et d’ailleurs, Dieu ne sauva-t-il pas <strong>Lot</strong> de la ruine de Sodôme, quoiqu’il ne fût pas circoncis ? <strong>Noé</strong> non plus n’était pas circoncis, et cependant il fut choisi de Dieu pour conserver l’espèce humaine lors du déluge.</p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/IrLn_Contre_les_h%C3%A9r%C3%A9sies_4">Contre les hérésies, livre IV, chap. 16, § 1-2</a>)</p><h3>La signification figurative du sabbat</h3><blockquote><p><em>« Offrez à Dieu un sacrifice de louanges, et rendez au Très-Haut vos hommages. Et invoquez-moi au jour de la détresse ; je vous délivrerai, et vous me glorifierez. » (Ps 49, 14-15), – </em><strong><em>On voit donc par les paroles de David que Dieu ne se contente pas de ces sacrifices, au moyen desquels ceux qui sont coupables croient suffisamment se justifier</em></strong><em> ; et il enseigne quelle est la seule manière de se purifier aux yeux de Dieu et de s’élever vers lui. Dieu parle encore de la même manière par la bouche d’Isaïe : « Quel fruit me revient-il de la multitude de vos victimes ? j’en suis rassasié. » (Is 1, 11). Ensuite, </em><strong><em><mark>après avoir exprimé</mark> qu’il ne se contentait ni des holocaustes, ni des sacrifices, ni des oblations, ni des néoménies, ni <mark>du sabbat</mark>, ni des fêtes, ni de toutes les autres cérémonies, <mark>voici ce qu’il prescrit à son peuple</mark> : « Levez-vous, purifiez-vous ; <mark>faites disparaître de devant mes yeux la malice de vos pensées</mark></em></strong><em> : </em><strong><em>cessez de pratiquer l’injustice ; apprenez à faire le bien ; aimez la justice, relevez l’opprimé, protégez l’orphelin, défendez la veuve ; et venez et accusez-moi, dit le Seigneur. » (Is 1, 16-18).</em></strong></p></blockquote><p>(<a href="https://azbyka.ru/otechnik/Irinej_Lionskij/protiv-eresej/4">Contre les hérésies, livre 4, chapitre 17, 1 (en russe)</a>)</p><blockquote><p><em>L’Écriture nous apprend que la cérémonie de la circoncision avait été instituée, non pas comme pouvant donner pareillement la vertu de la perfection, mais seulement pour servir de signe de ralliement à tous les descendants d’Abraham. En effet, nous y lisons que Dieu dit à ce patriarche : « Tout mâle d’entre vous sera circoncis ; et vous circoncirez votre chair, afin que ce soit là un signe de l’alliance entre moi et vous. » (Gn 17, 10-11). Ézéchiel parle dans le même sens au sujet du sabbat : « Je leur ai prescrit encore un jour de sabbat, afin qu’ils fussent comme un signe entre moi et eux, et qu’ils connussent que moi je suis le Seigneur qui les sanctifie. » (Ez 20, 12). Dans l’Exode, Dieu dit à Moïse : « Ayez soin de garder le sabbat ; car c’est un signe entre moi et vous dans la suite de vos générations. » (Ex 31, 13). </em><strong><em><mark>Ces cérémonies ont donc été ordonnées par Dieu seulement pour servir de signe. Mais ces signes avaient leur symbole et leur explication, comme tout ce qui sort de la main du Créateur</mark></em></strong><em>. </em><strong><em>La circoncision de la chair était le signe de la circoncision spirituelle</em></strong><em> ; ce que l’apôtre explique, quand il dit : « Nous avons été circoncis, non d’une circoncision faite par la main des hommes, mais de la circoncision de Jésus-Christ. » (Col 2, 11). Le prophète avait dit déjà : « Ayez soin de circoncire votre cœur, et ne vous endurcissez pas davantage. » (Dt 10, 16). </em><strong><em><mark>Quant au jour du sabbat, il devait être consacré tout entier au service de Dieu</mark> ; à quoi s’applique le passage suivant de saint Paul : « Selon qu’il est écrit, on nous livre pendant toute la durée du jour à la mort, à cause de vous ; » (Rm 8, 36), <mark>ce qui veut dire que les ministres de Jésus-Christ rendent à chaque instant témoignage de leurs foi, qu’ils s’y appliquent sans cesse, fuyant la cupidité et la recherche des biens de la terre</mark></em></strong><em>. </em><strong><em><mark>Le sabbat, qui était la figure du repos de Dieu après la création, signifiait le repos éternel, dont seront mis en possession ceux qui ont persévéré dans la foi.</mark></em></strong></p><p><em>Ce qui prouve encore que </em><strong><em><mark>ces cérémonies n’étaient qu’un signe et non point un moyen de salut</mark></em></strong><em>, c’est qu’</em><strong><em>Abraham lui-même ne fut point circoncis et n’observa point la loi du sabbat ; ce qui n’a pas empêché qu’il n’ait cru en Dieu, que sa foi ne lui ait été imputée à justice</em></strong><em>, et qu’il n’ait mérité de jouir de l’amitié de Dieu même (Jc 2, 23).</em></p></blockquote><p>(<a href="https://azbyka.ru/otechnik/Irinej_Lionskij/protiv-eresej/4">Contre les hérésies, livre 4, chapitre 16 (en russe)</a>)</p><blockquote><p><em>96. Aussi </em><strong><em>n’avons-nous besoin d’aucune loi comme pédagogue</em></strong><em> ; voici que nous parlons avec le Père et que nous nous tenons devant lui face à face, devenus petits enfants dans la malice et affermis dans la justice et la décence. Car la loi ne dira plus : « Tu ne commettras point d’adultère » à celui à qui ne viennent plus de désirs de convoitise pour la femme d’autrui ; et la loi ne dira plus : « Tu ne tueras point » à celui qui a écarté de lui toute colère et toute inimitié ; elle ne dira pas : « Tu ne convoiteras point la maison de ton prochain, ni son bœuf, ni son âne » à ceux qui ne se soucient nullement des choses de la terre, mais recueillent les fruits célestes ; et elle ne dira pas : « Œil pour œil, dent pour dent » (Ex 21, 24) à celui qui ne regarde personne comme son ennemi, mais tous comme ses prochains ; aussi ne pourra-t-il jamais étendre les mains pour la vengeance. On ne saurait exiger la dîme de celui qui apporte à Dieu tout son bien, quitte son père, sa mère et toute sa parenté, et suit la Parole de Dieu. Et </em><strong><em><mark>il n’est pas commandé de passer la journée dans le repos et le loisir à celui qui observe chaque jour le sabbat, c’est-à-dire qui, dans le temple de Dieu, qui est le corps de l’homme, rend à Dieu un culte digne de lui et pratique la justice à toute heure</mark></em></strong><em>. Car « je veux la miséricorde et non le sacrifice, dit-il, et la connaissance de Dieu plutôt que les holocaustes » (Os 6, 6).</em></p></blockquote><p>(<a href="https://azbyka.ru/otechnik/Irinej_Lionskij/apostolic_preaching/">Démonstration de la prédication apostolique (en russe)</a>)</p><h3>Le châtiment éternel</h3><blockquote><p><em>Par cela même que le nouveau Testament a augmenté pour l’homme le trésor de la foi, en lui donnant le moyen de devenir participant de Dieu par la grâce de la rédemption ; ainsi le zèle de l’homme pour se rendre agréable à Dieu en doit être devenu plus ardent, d’autant qu’il nous est ordonné de nous abstenir non-seulement des mauvaises actions, mais encore des mauvaises pensées, des discours inutiles et des paroles oiseuses. </em><strong><em><mark>Et par la même raison, le châtiment sera plus grand</mark></em></strong><em> pour ceux qui ne croient pas au verbe de Dieu, qui méprisent son avénement, et qui, au lieu d’avancer dans la perfection, rebroussent en arrière dans l’ignorance et le péché ; </em><strong><em><mark>leur châtiment, dis-je, de temporaire qu’il était, sera éternel.</mark></em></strong></p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/IrLn_Contre_les_h%C3%A9r%C3%A9sies_4">Contre les hérésies, livre IV, chap. 28, § 2</a>)</p><p>Antithèse :</p><blockquote><p>Et à cet égard, n’est-il pas vrai de dite que les hérétiques, dont nous nous sommes occupés dans ce traité, se mettent en pleine contradiction avec eux-mêmes, puisqu’ils s’élèvent contre le Seigneur même, auquel cependant ils disent avoir foi. Car les vérités applicables au Dieu de nos pères, <strong><u><mark>qui dans l’ancien Testament</mark></u><mark> a châtié ceux qui ne croyaient pas</mark></strong>, qui a frappé les Égyptiens, qui a donné le salut aux croyants, s’appliquent également à notre Seigneur, <strong>qui donne <u><mark>une éternité</mark></u><mark> de punition aux coupables, et une éternité de bonheur à ceux qui sont restés fidèles à sa loi.</mark></strong></p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/IrLn_Contre_les_h%C3%A9r%C3%A9sies_4">Contre les hérésies, livre IV, chap. 28, § 3</a>)</p><h3>Nécessité de la succession apostolique</h3>
      <blockquote><p><em>C’est donc </em><strong><em><mark>aux évêques et aux prêtres, qui tiennent des mains des apôtres le dépôt de la foi, et qui ont reçu l’ordination d’après l’institution même du Christ, que nous devons nous en rapporter pour les véritables règles de notre croyance. Quant à ceux qui s’éloignent du sein de l’Église, quel que soit le lieu où ils se réunissent, nous devons les tenir pour suspects, à l’égal des hérétiques et des gens de mauvaise foi, ou comme des hommes égarés par l’orgueil et ne se complaisant qu’en eux-mêmes</mark> ; ou bien enfin comme des hypocrites qui n’ont pour mobile de leur conduite qu’un vil intérêt et une vaine gloire</em></strong><em>.</em><strong><em> <mark>Tous ceux-là ont quitté le chemin de la vérité. Mais un châtiment particulier est réservé aux hérétiques</mark></em></strong><em>, qui apportent à l’autel de Dieu un feu étranger, un feu autre que celui destiné au sacrifice, c’est-à-dire des doctrines fausses et impies ; ils seront frappés de la foudre céleste, comme Nadab et Abiud dont parle l’Écriture. Pour ceux qui s’élèvent contre la vérité, qui cherchent à susciter des ennemis à l’Église, ils seront jetés dans les enfers et engloutis dans le sein de la terre, ils subiront le sort de Coré, Dathan et Abiron ; et </em><strong><em><mark>pour ceux qui cherchent à rompre l’unité de l’Église et à opérer des schismes, Dieu leur infligera le même châtiment</mark></em></strong><em> que celui qui frappa Jéroboam.</em></p></blockquote>
      <p>(<a href="https://bibleox.com/fr/fr/w/IrLn_Contre_les_h%C3%A9r%C3%A9sies_4">Contre les hérésies, livre IV, chapitre 26, 2</a>)</p>
      <h3>Il faut chercher la vérité dans l’Église</h3>
      <blockquote><p><em>Il résulte de ce que nous avons démontré dans le chapitre qui précède </em><strong><em><mark>qu’il ne faut point chercher la vérité autre part que dans l’Église, où il est facile de s’en instruire</mark>. C’est dans son sein que les apôtres ont placé le riche dépôt qui contient avec abondance tout ce qui appartient à la vérité du Christianisme ; c’est à cette source de vie que chacun peut venir puiser selon ses besoins</em></strong><em> ; c’est là la porte par laquelle on entre dans la carrière du chrétien. Chercher à y entrer par un autre côté, ce serait agir à la manière des voleurs ou des larrons ; c’est pourquoi il faut éviter soigneusement tout contact avec les hérésies, et </em><strong><em>s’instruire avec ardeur de tout ce qui tient à la tradition de la vérité</em></strong><em>. Eh quoi ! s’il s’élevait un dissentiment de quelque importance entre les chrétiens, ne faudrait-il pas avoir recours aux Églises les plus anciennes, celles qui ont reçu leurs instructions des apôtres eux-mêmes. Et s’en rapporter à ce qu’elles décideraient sur le point en litige ? et enfin, si les apôtres ne nous eussent rien transmis par l’écriture, ne faudrait-il pas suivre la tradition telle qu’elle nous a été communiquée par ceux à qui ces mêmes apôtres ont confié l’administration de ces mêmes Églises ? … Car ceux, par exemple, qui ont adopté les erreurs de Valentin n’existaient pas avant Valentin ; ni ceux qui se sont attachés à la secte de Marcion n’étaient pas avant Marcion ; pas plus que toutes les sectes perverses, dont nous avons fait l’énumération, n’existaient avant ceux qui en ont été les auteurs et les propagateurs.</em></p></blockquote>
      <p>(<a href="https://azbyka.ru/otechnik/Irinej_Lionskij/protiv-eresej/3">Contre les hérésies, livre III, chapitre 4 (en russe)</a>)</p><h3>L’autorité de la tradition</h3><blockquote><p><em>Et si </em><strong><em><mark>nous les rappelons à l’autorité de la tradition, qui nous a été transmise par les apôtres, et dont le dépôt est gardé fidèlement par les prêtres des Églises</mark></em></strong><em>, ils nous résistent en disant, qu’étant eux-mêmes doués de plus de sagesse que les prêtres, et même que les apôtres, c’est eux seuls qui ont découvert la vérité tout entière ; que, d’ailleurs, les paroles du Sauveur auraient été altérées et défigurées en passant par la bouche des apôtres ; qu’enfin, les apôtres et le Seigneur lui-même auraient, dans leurs discours, parlé tantôt dans un sens purement terrestre, d’autres fois avec un mélange du céleste et du terrestre, et quelquefois dans un sens entièrement divin. Or, tenir un pareil langage, c’est évidemment blasphémer contre la puissance de Dieu. Il résulte de tout ceci que </em><strong><em>nos adversaires ne veulent s’en rapporter ni aux Écritures ni à la tradition</em></strong><em>.</em></p><p><em>Comme vous le voyez, mon très-cher frère, nous avons ici à lutter contre des hommes qui, semblables à des serpents, se replient de mille manières pour échapper à nos étreintes. Il faut donc que nous leur résistions sur tous les points, dans l’espoir où nous sommes que notre victoire aura pour résultat d’en faire rentrer quelques-uns dans le sein de la vérité. Car s’il est difficile de faire luire tout d’abord la lumière dans une âme en proie aux ténèbres de l’erreur, on peut du moins espérer de lui faire avouer qu’elle est dans l’erreur, et l’amener peu à peu à préférer la vérité.</em></p><p><em>Chapitre 3</em></p><p><em>Examinons maintenant, et </em><strong><em><mark>montrons à ceux qui cherchent la vérité de bonne foi, comment la tradition que l’Église a reçue des apôtres s’est propagée ensuite dans tout le monde chrétien</mark>. Pour cela nous aurons à rappeler quels furent ceux qui furent institués évêques des Églises par les apôtres, quels furent leurs successeurs dans cette fonction jusqu’au temps où nous sommes, et comment ils enseignèrent constamment la même doctrine et la même foi</em></strong><em>. Car il faut admettre que s’il y avait des mystères trop relevés pour être révélés au peuple, les apôtres durent en réserver la connaissance à ceux de leurs disciples qui étaient plus avancés dans la perfection, et auxquels ils confiaient la direction des Églises. Ils voulaient que </em><strong><em><mark>ceux qui devaient leur succéder dans le sacerdoce</mark> fussent parfaits et irréprochables ; car si leur conduite était digne et sage, il en résulterait un bien immense ; au contraire, les plus grands malheurs pour l’Église seraient la conséquence de leur incapacité ou de leur mauvaise conduite</em></strong><em>.</em></p><p><em>Mais, comme il serait trop long de rappeler ici les noms de tous ceux qui ont successivement dirigé chacune des Églises, </em><strong><em><mark>il suffira de rappeler les noms de ceux qui se sont succédé dans la direction de celle de ces Églises qui est la plus ancienne, la plus célèbre, celle qui fut fondée à Rome</mark> par les glorieux apôtres saint Pierre et saint Paul, qui a reçu d’eux-mêmes le précieux dépôt de la tradition et de la foi prêchée chez toutes les nations</em></strong><em> ; et nous laisserons en dehors de la communion des fidèles tous ceux qui, soit pour satisfaire leurs passions ou une vaine gloire, soit par aveuglement, soit par perversité, ont quitté les sentiers de la vérité. Car c’est à cette Église de Rome, à cause de sa primauté, que doivent se rattacher toutes les autres Églises et tous les fidèles répandus sur la terre, </em><strong><em><mark>la considérant comme le principal dépôt de la <i>tradition</i> transmise par les apôtres</mark></em></strong><em>.</em></p><p><em>Les apôtres, après avoir fondé cette Église de Rome, </em><strong><em>en remirent l’administration à Linus, qu’ils en instituèrent évêque</em></strong><em>. Saint Paul, dans ses lettres à Timothée, fait mention de cet évêque Linus. </em><strong><em>Son successeur fut Anaclet</em></strong><em> : après Anaclet ce fut </em><strong><em>Clément</em></strong><em> que l’on investit de l’épiscopat ; celui-ci avait connu les apôtres et conversé avec eux, il avait encore toutes vivantes dans son souvenir leurs prédications et les instructions relatives à la <i>tradition ;</i> et il n’était pas le seul, car il existait encore alors beaucoup d’autres personnages qui avaient reçu les enseignements de la foi de la bouche même des apôtres. C’est sous l’épiscopat de ce même Clément qu’un dissentiment fort grave s’étant élevé entre les chrétiens de Corinthe, il leur adressa de Rome, à cette occasion, plusieurs lettres pleines d’éloquence, où il les rappelait à la paix et à l’union, fortifiait leur foi, et leur rappelait </em><strong><em><mark>les principes de la <i>tradition</i> qu’il avait reçue lui-même des apôtres</mark></em></strong><em>. Il leur annonçait donc un Dieu tout-puissant, créateur du ciel et de la terre, créateur de l’homme, et qui avait puni par le déluge les crimes de la terre ; qui ensuite avait suscité Abraham, avait délivré son peuple du joug des Égyptiens, avait fait entendre sa voix à Moïse et lui avait fait connaître ses commandements ; qui avait aussi envoyé les prophètes et avait préparé l’enfer pour le démon et les anges rebelles. Ce Dieu tout-puissant était le père de notre Seigneur Jésus-Christ, qui était annoncé à toutes les Églises. Tels sont </em><strong><em><mark>les enseignements relatifs à la tradition apostolique</mark></em></strong><em>, qui se trouvent dans ces lettres, où l’on peut vérifier et lire ce que nous disons ici ; car cet écrit est bien plus ancien que les faux docteurs qui voudraient aujourd’hui nous faire croire à un autre Dieu qui serait au-dessus de notre Dieu, le créateur du ciel et de la terre.</em> <strong><em>Le successeur de ce Clément fut Évariste ; à Évariste succéda Alexandre ; Sixte vint ensuite et fut le sixième qui fut nommé depuis les apôtres. Il fut remplacé par Télesphore, qui souffrit glorieusement le martyre ; son successeur fut Hyginus ; à Hyginus succéda Pie, et à Pie Anicet. Soter ayant succédé à Anicet, c’est Éleuthère, le douzième depuis les apôtres, qui se trouve maintenant investi de l’épiscopat</em></strong><em>. </em><strong><em><mark>Par cette succession des évêques, la <i>tradition</i> et le dépôt de la vérité que l’Église a reçus des apôtres ont été transmis jusqu’à nous ; ainsi nous démontrons avec évidence que le dépôt d’une foi unique, la foi du salut, confié aux Églises par les apôtres, s’est conservé jusqu’à nous et nous a été transmis dans toute sa pureté</mark></em></strong>.</p><p><em>Nous pouvons nous étayer aussi de l’autorité de </em><strong><em>saint Polycarpe, qui enseigna ces mêmes doctrines, les seules vraies, et qui en transmit le dépôt à l’Église. Or, saint Polycarpe les tenait des apôtres eux-mêmes ; il avait conversé avec un grand nombre de personnes qui avaient vu notre Seigneur ; il avait été investi par les apôtres de l’épiscopat de Smyrne en Asie ; nous l’y avons vu nous-mêmes dans notre première jeunesse. Il persévéra dans sa foi jusqu’à un âge très-avancé, et il sortit enfin de cette vie, après avoir souffert glorieusement et courageusement le martyre. Tous les prêtres qui sont aujourd’hui en Asie, et qui ont été les successeurs de saint Polycarpe, ont confessé les mêmes doctrines ; or, je pense que le témoignage de saint Polycarpe offre un caractère plus imposant d’autorité et de vérité</em></strong><em> que les protestations de Valentin et de Marcion, et de tous ceux qui partagent leurs dangereuses erreurs. C’est ce même Polycarpe qui, étant venu à Rome sous le pontificat d’Anicet, ramena dans le sein de l’Église un grand nombre de ces hérétiques dont nous avons parlé plus haut, en leur prêchant ces mêmes vérités qu’il tenait des apôtres, et dont il transmettait le dépôt à l’Église naissante. Il existe encore des personnes qui lui ont entendu raconter que saint Jean, disciple de notre Seigneur, étant à Éphèse, alla au bain, mais qu’ayant aperçu l’hérétique Cérinthe, il en sortit précipitamment en s’écriant, « qu’il craignait que les bains ne vinssent à s’écrouler par l’effet de la seule présence de Cérinthe, cet ennemi de la vérité. » On raconte aussi qu’un jour saint Polycarpe ayant rencontré Marcion, celui-ci l’aborda en lui disant : <i>Me connais-tu ?</i> Polycarpe répondit : <i>Je vous connais pour le premier-né de Satan</i>. Ce qui montre combien les apôtres et ensuite leurs disciples ont voulu éviter d’avoir aucune communication, même par la parole, avec ceux qui ont altéré la vérité. C’est le conseil que donne saint Paul lorsqu’il dit : « Fuyez celui qui est hérétique, après le premier ou le second avertissement, sachant qu’un tel homme est perverti, et qu’il pèche, étant condamné par son propre jugement. » Il existe d’ailleurs une excellente épître, adressée par saint Polycarpe aux fidèles de Philippes, dans laquelle ceux qui désirent faire leur salut trouveront une explication parfaite tant du véritable caractère de la foi que de la manière dont la vérité doit être annoncée. Enfin nous avons dans Paul, qui fonda l’Église d’Éphèse, où Jean lui succéda, et où il resta jusqu’au règne de Trajan, un témoin sincère et irréfragable de la tradition transmise par les apôtres.</em></p><p><em>Chapitre 4</em></p><p><em>Il résulte de ce que nous avons démontré dans le chapitre qui précède qu’</em><strong><em>il ne faut point chercher la vérité autre part que dans l’Église, où il est facile de s’en instruire. C’est dans son sein que les apôtres ont placé le riche dépôt qui contient avec abondance tout ce qui appartient à la vérité du Christianisme ; c’est à cette source de vie que chacun peut venir puiser selon ses besoins</em></strong><em> ; c’est là la porte par laquelle on entre dans la carrière du chrétien. Chercher à y entrer par un autre côté, ce serait agir à la manière des voleurs ou des larrons ; c’est pourquoi il faut éviter soigneusement tout contact avec les hérésies, et s’instruire avec ardeur de tout ce qui tient à </em><strong><em><mark>la tradition de la vérité</mark></em></strong><em>. Eh quoi ! s’il s’élevait un dissentiment de quelque importance entre les chrétiens, </em><strong><em>ne faudrait-il pas avoir recours aux Églises les plus anciennes, celles qui ont reçu leurs instructions des apôtres eux-mêmes. Et s’en rapporter à ce qu’elles décideraient sur le point en litige ?</em></strong><em> et enfin, si les apôtres ne nous eussent rien transmis par l’écriture, ne faudrait-il pas </em><strong><em><mark>suivre la tradition telle qu’elle nous a été communiquée par ceux à qui ces mêmes apôtres ont confié l’administration de ces mêmes Églises</mark></em></strong><em> ?</em></p><p><em>C’est sur cette autorité de la tradition que plusieurs nations barbares, qui croient en Jésus-Christ, placent le fondement de leur foi ; elles conservent fidèlement gravés dans leur esprit, </em><strong><em><mark>sans le secours de l’écriture, qui parle aux yeux</mark></em></strong><em>, les commandements relatifs au salut et les principes de l’ancienne tradition ; elles croient en un seul Dieu, créateur du ciel et de la terre et de tout ce qui existe, par l’intervention du Christ, fils de Dieu, du Christ qui, par un amour infini pour sa créature, a bien voulu s’incarner dans le sein de la Vierge, unissant ensemble la nature de Dieu et la nature de l’homme, qui a souffert sous Ponce-Pilate, est remonté au ciel après sa résurrection dans l’éclat de sa gloire, qui doit venir dans toute sa puissance à la fin des temps pour récompenser les justes et punir les méchants, livrant au feu éternel ceux qui ont cherché à obscurcir la vérité, ceux qui ont méprisé le pouvoir du Père et la venue du Fils sur la terre. </em><strong><em><mark>Ceux donc qui, sans le secours des Écritures, ont cru tous ces articles de foi</mark></em></strong><em>, peuvent bien être pour nous des barbares relativement à la différence de leur langage avec le nôtre ; mais, quant à leur sagesse, quant à leur conduite, quant aux principes qu’ils professent, nous devons les considérer comme très-civilisés, car ils savent faire ce qui est agréable à Dieu, et ils vivent dans la justice, dans la chasteté, dans la sagesse. Si quelqu’un venait, en parlant leur langage, leur proposer les rêveries inventées par les hérétiques, vous les verriez fermer aussitôt leurs oreilles à ces discours, et s’enfuir au loin jusqu’à ce qu’ils n’entendissent plus ces blasphèmes impies. Aussi, dans leur profond attachement à la tradition qu’ils ont reçue des apôtres, ils ne supposent même pas qu’on puisse chercher à y porter atteinte, car il n’y a jamais eu parmi eux ni secte ni hérésie.</em></p><p><em>Les hérésies sont d’une date plus récente que l’établissement de l’Église. Car ceux, par exemple, qui ont adopté les erreurs de Valentin n’existaient pas avant Valentin ; ni ceux qui se sont attachés à la secte de Marcion n’étaient pas avant Marcion ; pas plus que toutes les sectes perverses, dont nous avons fait l’énumération, n’existaient avant ceux qui en ont été les auteurs et les propagateurs. Valentin vint à Rome vers le temps de l’épiscopat d’Hyginus ; l’Église de Rome était sous l’administration de l’évêque Pie, lorsqu’il propagea son hérésie ; et il vécut jusqu’à l’avénement d’Anicet à l’épiscopat. Quant à Cerdon, qui était antérieur à Marcion, il vivait à Rome du temps de l’évêque Hyginus, qui fut le huitième depuis les apôtres, il fréquentait l’assemblée des fidèles, et répandait le venin de ses erreurs tantôt en prêchant publiquement, tantôt dans des conférences secrètes ; mais il fut ensuite traduit devant les prêtres pour rendre compte de sa conduite, et fut enfin forcé de se retirer de la société des chrétiens. Marcion, qui suivit Valentin, fit quelques prosélytes au temps d’Anicet, qui était le dixième évêque depuis les apôtres. Quant aux autres hérétiques, connus sous le nom de gnostiques, ils reconnaissaient pour chef Ménandre, disciple de Simon, comme nous l’avons déjà dit ; du reste, chacun d’eux prenait pour patron l’homme dont il professait plus particulièrement les principes. Mais ce fut plus tard, et vers le second âge de l’Église, que toute cette secte des gnostiques professa ouvertement l’hérésie.</em></p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/IrLn_Contre_les_h%C3%A9r%C3%A9sies_3">Contre les hérésies, livre III, chap. 2-4</a>)</p><blockquote><p><em>Tous les hérésiarques, ainsi que nous l’avons clairement exposé dans le troisième livre, </em><strong><em>sont de beaucoup postérieurs aux évêques, auxquels les apôtres avaient remis le gouvernement des Églises</em></strong><em>. Ces hérétiques, qui fermaient volontairement les yeux à la vérité, ont donc été condamnés </em><strong><em>à s’égarer dans toutes les voies de l’erreur, suivant tantôt un chemin, tantôt un autre</em></strong><em> ; et c’est justement par cette raison qu’ils n’ont pu produire un corps de doctrine, et que </em><strong><em><mark>leurs systèmes n’ont laissé que des traces confuses</mark></em></strong><em>. </em><strong><em><mark>Il en est tout autrement de ceux qui vivent dans les doctrines de l’Église ; rien ne leur est caché, parce qu’ils marchent éclairés du flambeau de la foi et de la </mark><u><mark>tradition des apôtres</mark></u></em></strong><em>. Ainsi ils ont tous </em><strong><em>une foi qui est la même</em></strong><em>, qui est ferme et inébranlable ; ils ont </em><strong><em>une même foi en un seul et même Dieu le père</em></strong><em>, dans l’incarnation de son Verbe, et dans le Saint-Esprit l’auteur de tous les dons ; ils croient </em><strong><em>aux mêmes commandements</em></strong><em>, </em><strong><em>observent la même discipline</em></strong><em>, attendent tous le dernier avénement du Christ pour juger le monde, et ils ont </em><strong><em>une même croyance sur le salut auquel participeront également l’âme et le corps</em></strong><em>. D’ailleurs, l’enseignement de l’Église est dans tous les lieux uniforme et le même ; partout elle montre aux hommes la même voie de salut. Et, en effet, le flambeau de la science divine a été remis entre ses mains ; « la sagesse de Dieu, par laquelle les hommes sont sauvés, parle au dehors, sa voix retentit dans les places publiques ; elle crie devant les assemblées, à l’entrée des portes, elle parle au milieu des villes. » Car l’Église prêche partout la vérité, et c’est elle qui est le <i>flambeau à sept branches</i> qui distribue au monde la lumière du Christ.</em></p><p><strong><em><mark>Ceux donc qui ne suivent pas les enseignements de l’Église accusent par là même les saints prêtres, ses ministres, d’ignorance ; mais ils ne voient pas qu’il y a plus d’esprit de religion dans le cœur de l’homme le plus simple que dans l’âme du sophiste effronté et de celui qui blasphême contre Dieu</mark></em></strong><em>. Tels sont tous les hérétiques, qui prétendent découvrir quelque chose par delà la vérité même ; </em><strong><em><mark>on les voit se partager en mille sectes diverses, allant à droite et à gauche, n’ayant jamais un même sentiment sur les mêmes choses, et ressemblant à des aveugles conduisant à l’aventure d’autres aveugles ; ils ne peuvent donc manquer de tomber ensemble dans la fosse de l’ignorance, cherchant toujours et ne trouvant jamais rien</mark></em></strong><em>. Nous devons donc fuir leurs discours et bien prendre garde aux piéges qu’ils nous tendent. </em><strong><em><mark>Que l’Église donc soit notre </mark><u><mark>refuge</mark></u><mark>, et instruisons-nous auprès d’elle des saintes Écritures</mark></em></strong><em> ; l’Église est pour les chrétiens le paradis terrestre de ce monde. « Vous pouvez donc manger de tous les fruits du jardin, » dit l’esprit de Dieu ; </em><strong><em><mark>c’est-à-dire que vous pouvez puiser dans les Écritures votre nourriture spirituelle ; mais il vous est défendu de rechercher les mystères qui sont plus élevés, et de goûter les doctrines des hérétiques</mark></em></strong><em>. Ceux-ci sont d’autant plus coupables en répandant leurs opinions impies, qu’ils reconnaissent avoir la faculté de distinguer le bien et le mal. Ils veulent comprendre plus que ne le peut leur intelligence ; c’est pour cela que l’apôtre recommande « de ne point être sage plus qu’il ne faut, mais d’être sage avec sobriété, » de peur que, venant à manger du fruit de l’arbre défendu de la science, nous ne soyons chassés du paradis de vie, que Dieu réserve pour ceux qui suivent ses commandements, « réunissant tout en Jésus-Christ, comme dans le chef, tant ce qui est dans le ciel que ce qui est sur la terre ; » mais les choses du ciel sont les choses de l’esprit, et ce qui est sur la terre est en rapport avec l’intelligence de l’homme. Le Christ réunit en lui toutes ces choses ; et c’est lui qui unit l’homme à l’esprit et qui place l’esprit dans l’homme ; il gouverne lui-même le guide de l’esprit, et il fait que l’esprit gouverne l’homme ; car c’est par l’esprit que nous voyons, que nous entendons, et que nous parlons.</em></p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/IrLn_Contre_les_h%C3%A9r%C3%A9sies_5">Contre les hérésies — livre V</a>)</p><h3>Certains peuples gardent la foi sans l’Écriture, par la seule Tradition</h3><blockquote><p><em>Il résulte de ce que nous avons démontré dans le chapitre qui précède </em><strong><em>qu’il ne faut point chercher la vérité autre part que dans l’Église, où il est facile de s’en instruire. C’est dans son sein que les apôtres ont placé le riche dépôt qui contient avec abondance tout ce qui appartient à la vérité du Christianisme ; c’est à cette source de vie que chacun peut venir puiser selon ses besoins</em></strong><em> ; c’est là la porte par laquelle on entre dans la carrière du chrétien. Chercher à y entrer par un autre côté, ce serait agir à la manière des voleurs ou des larrons ; c’est pourquoi il faut éviter soigneusement tout contact avec les hérésies, et </em><strong><em><mark>s’instruire avec ardeur de tout ce qui tient à la tradition de la vérité</mark></em></strong><em>. Eh quoi ! </em><strong><em>s’il s’élevait un dissentiment de quelque importance entre les chrétiens, ne faudrait-il pas avoir recours aux Églises les plus anciennes, celles qui ont reçu leurs instructions des apôtres eux-mêmes. Et s’en rapporter à ce qu’elles décideraient sur le point en litige ? et enfin, si les apôtres ne nous eussent rien transmis par l’écriture, ne faudrait-il pas <mark>suivre la tradition</mark> telle qu’elle nous a été communiquée par ceux à qui ces mêmes apôtres ont confié l’administration de ces mêmes Églises ?</em></strong></p><p><strong><em>C’est sur cette autorité de la tradition que plusieurs nations barbares, qui croient en Jésus-Christ, placent le fondement de leur foi ; <mark>elles conservent fidèlement gravés dans leur esprit, sans le secours de l’écriture, qui parle aux yeux, les commandements relatifs au salut et les principes de l’ancienne tradition</mark></em></strong><em> ; elles croient en un seul Dieu, créateur du ciel et de la terre et de tout ce qui existe, par l’intervention du Christ, fils de Dieu, du Christ qui, par un amour infini pour sa créature, a bien voulu s’incarner dans le sein de la Vierge, unissant ensemble la nature de Dieu et la nature de l’homme, qui a souffert sous Ponce-Pilate, est remonté au ciel après sa résurrection dans l’éclat de sa gloire, qui doit venir dans toute sa puissance à la fin des temps pour récompenser les justes et punir les méchants, livrant au feu éternel ceux qui ont cherché à obscurcir la vérité, ceux qui ont méprisé le pouvoir du Père et la venue du Fils sur la terre. </em><strong><em><mark>Ceux donc qui, sans le secours des Écritures, ont cru tous ces articles de foi</mark>, peuvent bien être pour nous des barbares relativement à la différence de leur langage avec le nôtre ; mais, quant à leur sagesse, quant à leur conduite, quant aux principes qu’ils professent, nous devons les considérer comme très-civilisés, car ils savent faire ce qui est agréable à Dieu, et ils vivent dans la justice, dans la chasteté, dans la sagesse</em></strong><em>. Si quelqu’un venait, en parlant leur langage, leur proposer les rêveries inventées par les hérétiques, vous les verriez fermer aussitôt leurs oreilles à ces discours, et s’enfuir au loin jusqu’à ce qu’ils n’entendissent plus ces blasphèmes impies. Aussi, dans leur profond attachement à la tradition qu’ils ont reçue des apôtres, ils ne supposent même pas qu’on puisse chercher à y porter atteinte, car il n’y a jamais eu parmi eux ni secte ni hérésie.</em></p></blockquote><p>(<a href="https://azbyka.ru/otechnik/Irinej_Lionskij/protiv-eresej/3">Contre les hérésies, livre III, chapitre 4 (en russe)</a>)</p><h3>Valeur de l’unité de l’Église et condamnation des divisions</h3><blockquote><p><em>Il condamne encore les faux prophètes qui, n’ayant pas reçu d’en haut le don de prophétie, et n’ayant pas d’ailleurs la crainte de Dieu, mais qui, poussés par l’amour d’une vaine gloire, par un sordide intérêt, ou par les suggestions du malin esprit, font semblant de prophétiser, et mentent contre Dieu.</em></p><p><em>Il </em><strong><em><mark>condamne aussi ceux qui font des schismes, qui sont vains et n’ont pas la crainte de Dieu, ne cherchant que la satisfaction de leur intérêt dans les divisions qu’ils fomentent</mark></em></strong><em> ; ils ne craignent pas de briser et de </em><strong><em><mark>diviser le glorieux corps de Jésus-Christ</mark></em></strong><em>, souvent pour les motifs les plus futiles, et de lui faire tout le mal qui est en leur pouvoir ; </em><strong><em><mark>ils ne parlent que de paix et font toujours la guerre</mark></em></strong><em> ; ils se contenteraient, à les entendre, d’un moucheron, et ils dévorent un chameau. Quel que soit le châtiment qu’on puisse leur infliger, il ne saurait être proportionné </em><strong><em><mark>au mal que font les schismes suscités par eux</mark></em></strong><em>. Le disciple de vérité condamne aussi tous ceux qui sont hors de la vérité, c’est-à-dire qui sont hors de l’Église.</em></p></blockquote><p>(<a href="https://azbyka.ru/otechnik/Irinej_Lionskij/protiv-eresej/4">Contre les hérésies, livre IV, chapitre XXXIII, 7 (en russe)</a>)</p><h3>Simon le magicien — sectaire et initiateur des hérésies</h3>
      <blockquote><p><strong><mark>Simon</mark> fut le père de toutes les <mark>hérésies</mark></strong>. <strong><mark>Voici à quelle occasion il commença à se faire connaître</mark></strong> : Tyr est une ville de Phénicie où Simon avait acheté une esclave appelée Héléna ; il s’en faisait suivre partout, et partout il prêchait qu’elle était la première conception de sa pensée, la mère universelle…</p></blockquote>
      <p>(<a href="https://bibleox.com/fr/fr/w/IrLn_Contre_les_h%C3%A9r%C3%A9sies_1">Contre les hérésies, livre I, chap. 23, § 2</a>)</p>
      <p>En latin :</p>
      <blockquote><p>2. <strong><mark>Simon</mark> autem Samaritanus, ex quo universæ <mark>hæreses</mark></strong> substiterunt, habet hujusmodi <strong><mark>sectæ</mark></strong> materiam. Hic Helenam quandam, quam ipse a Tyro civitate Phœnices quæstuariam cum redemisset, secum circumducebat, dicens hanc esse primam mentis ejus conceptionem, matrem omnium</p></blockquote>
      <p>(<a href="https://bibleox.com/fr/fr/w/IrLn_Contre_les_h%C3%A9r%C3%A9sies_1">source</a>)</p>
      <h3>Les hérétiques se couvrent du nom de Jésus</h3>
      <blockquote><p><em>Nul imposteur n’a osé altérer, mutiler avec tant d’impudence la parole sainte, s’attaquer à Dieu d’une manière plus audacieuse ; </em><strong><em>nous le réfuterons ailleurs, avec l’aide de Dieu, lui opposant ses propres écrits, et les paroles du Seigneur et des apôtres dont il se sert pour donner quelque vraisemblance à sa coupable doctrine</em></strong><em>. Nous en avons parlé ici, c’était une nécessité, afin de vous faire connaître que tous ceux qui, de quelque manière que ce soit, souillent et faussent la vérité, altèrent l’enseignement de l’Église, sont tous les disciples et les continuateurs de Simon le magicien. Si, pour séduire, </em><strong><em>ils n’invoquent pas le nom de leur maître, ils emploient du moins ses pensées. <mark>Ils se servent du nom de Jésus comme d’un moyen pour faire passer plus facilement l’impiété de Simon</mark> : le nom le plus saint sert ainsi d’auxiliaire à la plus dangereuse des erreurs ; il leur faut la douceur et la gloire de ce nom sacré pour déguiser l’amertume de leurs poisons, que distille par eux le serpent de l’apostasie</em></strong><em>.</em></p></blockquote>
      <p>(<a href="https://bibleox.com/fr/fr/w/IrLn_Contre_les_h%C3%A9r%C3%A9sies_1">Contre les hérésies, livre I, chap. 27</a>)</p>
      <h3>S’écarter des discours des hérétiques</h3>
      <blockquote><p><em>Si quelqu’un venait, en parlant leur langage, leur proposer les rêveries inventées par les hérétiques, </em><strong><em><mark>vous les verriez fermer aussitôt leurs oreilles à ces discours, et s’enfuir au loin jusqu’à ce qu’ils n’entendissent plus ces blasphèmes impies</mark></em></strong><em>. Aussi, dans leur profond attachement à la tradition qu’ils ont reçue des apôtres, </em><strong><em><mark>ils ne supposent même pas qu’on puisse chercher à y porter atteinte</mark></em></strong><em>, car il n’y a jamais eu parmi eux ni secte ni hérésie.</em></p></blockquote>
      <p>(<a href="https://azbyka.ru/otechnik/Irinej_Lionskij/protiv-eresej/3_2">Contre les hérésies, livre III, chap. IV (en russe)</a>)</p>
      <blockquote><p><em>Ceux donc qui ne suivent pas les enseignements de l’Église accusent par là même les saints prêtres, ses ministres, d’ignorance ; mais ils ne voient pas qu’il y a plus d’esprit de religion dans le cœur de l’homme le plus simple que dans l’âme du sophiste effronté et de celui qui blasphême contre Dieu. </em><strong><em>Tels sont tous les hérétiques</em></strong><em>, qui prétendent découvrir quelque chose par delà la vérité même ; on les voit se partager en mille sectes diverses, allant à droite et à gauche, n’ayant jamais un même sentiment sur les mêmes choses, et ressemblant à des aveugles conduisant à l’aventure d’autres aveugles ; ils ne peuvent donc manquer de tomber ensemble dans la fosse de l’ignorance, cherchant toujours et ne trouvant jamais rien. </em><strong><em><mark>Nous devons donc fuir leurs discours et bien prendre garde aux piéges qu’ils nous tendent</mark>. Que l’Église donc soit notre refuge, et instruisons-nous auprès d’elle des saintes Écritures</em></strong><em> ; l’Église est pour les chrétiens le paradis terrestre de ce monde.</em></p></blockquote>
      <p>(<a href="https://azbyka.ru/otechnik/Irinej_Lionskij/protiv-eresej/5">Contre les hérésies, livre V, chap. XX (en russe)</a>)</p><h3>Les hérétiques se contredisent entre eux</h3><p>Les hérétiques se contredisent constamment et inventent de nouvelles doctrines :</p><blockquote><p><em>Examinons maintenant le caractère inconstant et flottant des opinions de nos adversaires ; ils sont deux ou trois à peine, et voyez </em><strong><em><mark>comme ils s’accordent peu dans leurs doctrines, comme elle est mobile, comme leurs paroles et leurs dogmes se heurtent, se réprouvent, se réfutent les uns les autres</mark></em></strong><em>.</em></p><p><em>…</em></p><p><strong><em>chacun d’eux enseigne comme il lui plaît</em></strong></p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/IrLn_Contre_les_h%C3%A9r%C3%A9sies_1">Contre les hérésies, I, 11, 1</a>)</p><blockquote><p><em>Or, d’après ce système des hérétiques, chacun d’eux en particulier possèderait cette sagesse, qu’il aurait lui-même inventée ; rêverie sans doute, et dont ils se contentent à la place de la vérité. Or, cette prétendue sagesse aurait été représentée </em><strong><em>tantôt par Valentin, tantôt par Marcion, un jour par Cérinthe, une autre fois par Basilide, et enfin par quiconque vient disputer à tort et à travers contre la foi établie</em></strong><em>. Chacun d’eux, en effet, se mettant au-dessus des règles de la vérité, peut venir impunément, dans sa dépravation, dire que cette vérité réside en lui-même.</em></p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/IrLn_Contre_les_h%C3%A9r%C3%A9sies_3">Contre les hérésies, III, 2, 1</a>)</p><blockquote><p><em>Nos adversaires élèvent encore sur le point capital de cette question quelques vaines objections, réfutées d’avance par les passages de l’Écriture que nous avons rapportés, et qui sont relatifs à l’avènement du Christ. </em><strong><em>Mais, quant à la nature de ces objections, ils ne s’entendent pas entre eux ; les uns parlent d’une manière, les autres d’une autre.</em></strong> <strong><em>Si, cherchant à connaître leur sentiment à cet égard, on questionne en particulier ceux qui passent parmi eux pour les plus habiles</em></strong><em>, l’un vous dira qu’il s’agit du Propator, c’est-à-dire de Bythus ; l’autre, du principe de toutes choses, c’est-à-dire de l’Unigénitus ; un autre, du père commun, c’est-à-dire du Verbe ; celui-ci vous parlera de quelqu’un des Æons qui habitent le Plerum ; celui-là, du Christ ; un autre, du Sauveur. Un plus habile peut-être, après s’être renfermé longtemps dans le silence, vous dira qu’il s’agit d’Horus ; puis un autre, de cette Sophia, qui habite au sein de la plénitude suprême ; enfin celui-ci, de la mère Achamot, qui habite hors du Plerum ; et un dernier vous dira qu’il s’agit du Dieu, créateur du monde. <strong><em><mark>Telles sont leurs diverses opinions sur la nature de Dieu et sur les Écritures</mark></em></strong>.</em></p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/IrLn_Contre_les_h%C3%A9r%C3%A9sies_4">Contre les hérésies, IV, 35, 4</a>)</p><blockquote><p><em>Tous les hérésiarques, ainsi que nous l’avons clairement exposé dans le troisième livre, sont de beaucoup postérieurs aux évêques, auxquels les apôtres avaient remis le gouvernement des Églises. Ces hérétiques, qui fermaient volontairement les yeux à la vérité, ont donc été condamnés à s’égarer dans toutes les voies de l’erreur, suivant tantôt un chemin, tantôt un autre ; et c’est justement par cette raison qu’ils n’ont pu produire un corps de doctrine, et que leurs systèmes n’ont laissé que des traces confuses. </em><strong><em><mark>Il en est tout autrement de ceux qui vivent dans les doctrines de l’Église</mark></em></strong><em> ; rien ne leur est caché, </em><strong><em><mark>parce qu’ils marchent éclairés du flambeau de la foi et de la tradition des apôtres. Ainsi ils ont tous une foi qui est la même, qui est ferme et inébranlable</mark></em></strong><em> ; ils ont une même foi en un seul et même Dieu le père, dans l’incarnation de son Verbe, et dans le Saint-Esprit l’auteur de tous les dons ; ils croient aux mêmes commandements, </em><strong><em><mark>observent la même discipline</mark></em></strong><em>, attendent tous le dernier avénement du Christ pour juger le monde, et ils ont une même croyance sur le salut auquel participeront également l’âme et le corps. D’ailleurs, l’enseignement de l’Église est dans tous les lieux uniforme et le même ; partout elle montre aux hommes la même voie de salut. Et, en effet, le flambeau de la science divine a été remis entre ses mains ; « la sagesse de Dieu, par laquelle les hommes sont sauvés, parle au dehors, sa voix retentit dans les places publiques ; elle crie devant les assemblées, à l’entrée des portes, elle parle au milieu des villes. » Car l’Église prêche partout la vérité, et c’est elle qui est le flambeau à sept branches qui distribue au monde la lumière du Christ.</em></p><p><em><strong>Ceux donc qui ne suivent pas les enseignements de l’Église accusent par là même les saints prêtres, ses ministres, d’ignorance</strong> ; mais ils ne voient pas qu’il y a plus d’esprit de religion dans le cœur de l’homme le plus simple que dans l’âme du sophiste effronté et de celui qui blasphême contre Dieu. <strong><mark>Tels sont tous les hérétiques</mark></strong>, qui prétendent découvrir quelque chose par delà la vérité même ; on les voit se partager en mille sectes diverses, allant à droite et à gauche, <strong><mark>n’ayant jamais un même sentiment sur les mêmes choses</mark></strong>, et ressemblant à des aveugles conduisant à l’aventure d’autres aveugles ; ils ne peuvent donc manquer de tomber ensemble dans la fosse de l’ignorance, cherchant toujours et ne trouvant jamais rien. Nous devons donc fuir leurs discours et bien prendre garde aux piéges qu’ils nous tendent. <strong>Que l’Église donc soit notre refuge, et instruisons-nous auprès d’elle des saintes Écritures</strong> ; l’Église est pour les chrétiens le paradis terrestre de ce monde. « Vous pouvez donc manger de tous les fruits du jardin, » dit l’esprit de Dieu ; c’est-à-dire que vous pouvez puiser dans les Écritures votre nourriture spirituelle ; mais il vous est défendu de rechercher les mystères qui sont plus élevés, et <strong><mark>de goûter les doctrines des hérétiques</mark></strong>.</em></p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/IrLn_Contre_les_h%C3%A9r%C3%A9sies_5">Contre les hérésies, V, 20, 2</a>)</p><h3>La disposition du temple chrétien est semblable à la réalité céleste dans l’Apocalypse de Jean le Théologien</h3><p>La disposition du temple chrétien est semblable à celle du temple céleste (<a href="https://azbyka.ru/biblia/?Apok.11:1,19">Ap 11, 1 et 19</a>) :</p><ul><li><p>trône (Ap 4, 10)</p></li><li><p>autel (Ap 8, 3-5)</p></li><li><p>chandelier à sept branches (Ap 4, 5)</p></li><li><p>encensement (Ap 8, 3 et 5)</p></li><li><p>saints anges (<em>Ap 8, 3</em><em> ; </em><em>Ap 15, 6</em>)</p></li><li><p>hommes saints (Ap 6, 9-11 ; Ap 14, 4-5)</p></li></ul><p>Irénée renvoie à l’Apocalypse de Jean le Théologien, en disant qu’il convient aux choses terrestres d’être les images des choses célestes créées par Dieu :</p><blockquote><p><em>Dieu veut donc, sans qu’il en ait nul besoin, que nous fassions de bonnes œuvres, afin que nous ne soyons pas sans droit à ses récompenses. Dans l’ancienne loi, le peuple hébreu eut à observer le précepte qui ordonnait des offrandes, afin qu’il s’accoutumât à la soumission à Dieu ; c’est ainsi qu’il exige </em><strong><em>de nous</em></strong><em> </em><strong><em>que nos prières et nos oblations montent sans cesse <mark>vers son autel</mark></em></strong><em>,</em></p><p><em> </em><strong><em><mark>cet autel qui est dans les cieux</mark></em></strong><em> (c’est là que doivent monter nos prières et nos offrandes) </em><strong><em><mark>où est aussi le temple</mark></em></strong><em> dont parle saint Jean dans l’Apocalypse, quand il dit : « Et le temple de Dieu fut ouvert dans le ciel ; » et là aussi est le tabernacle, car il ajoute : « Voici le tabernacle de Dieu avec les hommes, et il y demeurera avec eux. » … La cérémonie des offrandes, des oblations et des sacrifices fut donnée au peuple hébreu, comme un type, par Moïse, qui avait reçu sur la montagne les ordres de Dieu, de ce même Dieu dont le nom est maintenant glorifié par son Église dans toutes les nations. </em><strong><em><mark>Ce Dieu a voulu que les choses terrestres au milieu desquelles nous vivons fussent pour nous comme des types des choses célestes</mark></em></strong><em> dont il est également le créateur ; </em><strong><em>car c’était le seul moyen d’établir une comparaison et un rapport entre les unes et les autres</em></strong><em>.</em></p></blockquote><p>(<a href="https://bibleox.com/fr/fr/w/IrLn_Contre_les_h%C3%A9r%C3%A9sies_4"><u>Contre les hérésies, livre IV, chap. 18-19</u></a>)</p>
    references: |-
      <p>Les citations de «Contre les hérésies» sont empruntées à la traduction d’Antoine-Eugène Genoude, <i>Les Pères de l’Église</i>, t. 3, Sapia, 1838, publiée sur ce site. Les citations des autres œuvres d’Irénée, d’Eusèbe et d’autres auteurs, qui n’ont pas de traduction française publiée sur le site, sont traduites du grec ou du russe ; les passages entre crochets [ ] sont ajoutés pour la clarté.</p><p>Traduction : Rodion Vlasov, avec l’aide de l’IA, d’après la <a href="https://bibleox.com/fr/ru/w/%D0%98%D1%80%D0%B8%D0%BD%D0%B5%D0%B9_%D0%9B%D0%B8%D0%BE%D0%BD%D1%81%D0%BA%D0%B8%D0%B9">page de référence en russe</a>.</p>
