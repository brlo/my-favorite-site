    body: |-
      <p>Je me promenais un matin dans les galeries du Xiste, lorsqu’un homme vint à moi avec les personnes qui l’accompagnaient et me dit en m’abordant : « Salut, philosophe ! » et après ces mots, il se mit à marcher à mes côtés. Ses amis en firent autant. Je le saluai à mon tour, et lui demandai ce qu’il me voulait.</p><p>— Lorsque j’étais à Argos, me dit-il, j’appris d’un corinthien, disciple de Socrate, qu’il ne fallait pas dédaigner ou mépriser ceux qui portent votre habit, mais leur témoigner toute sorte d’égards, se lier avec eux et par l’échange des idées s’éclairer mutuellement ; on s’en trouve bien de part et d’autre, quand les services sont ainsi réciproques ; aussi toutes les fois que je rencontre un homme avec l’habit de philosophe, je me plais à l’aborder : voilà pourquoi je me suis empressé de vous adresser la parole. Les personnes qui se trouvaient avec moi m’ont suivi, dans l’espoir de profiter aussi de votre entretien.</p><p>— Et qui êtes-vous donc, ô le plus grand des mortels ? lui dis-je en riant.</p><p>Il me fit connaître, sans détour, son nom et son origine. Je m’appelle Tryphon, me dit-il, je suis Hébreu et circoncis ; chassé de ma patrie par la dernière guerre, je me suis retiré dans la Grèce et je demeure ordinairement à Corinthe.</p><p>— Et qu’espérez-vous de la philosophie ? lui demandai-je ; peut-elle vous être aussi utile que votre législateur et vos prophètes ?</p><p>— Est-ce que les philosophes, reprit Tryphon, ne s’occupent pas uniquement de Dieu ; leurs discussions n’ont-elles pas toutes pour objet son unité, sa providence ? Enfin, si je ne me trompe, la philosophie n’a pas d’autre but que la connaissance de Dieu.</p><p>— Oui, ce devrait être l’objet de toutes ses recherches ; mais qu’il existe plusieurs dieux, ou qu’il n’en existe qu’un seul ; qu’il veille ou non sur chacun de nous, voilà ce que bien peu de philosophes cherchent à savoir, comme si cette connaissance importait peu au bonheur ! Ils s’efforcent seulement de nous persuader que si Dieu prend soin de l’univers, des genres, des espèces ; il ne s’occupe ni de vous, ni de moi, ni d’aucun être en particulier. Ils vous diront même qu’il est fort inutile de le prier jour et nuit. Vous voyez où tendent leurs doctrines ; ils ne cherchent qu’à s’assurer la licence et l’impunité, d’agiter et de suivre les opinions qui leur plaisent, de faire et dire ce qu’ils veulent, n’attendant de la part de Dieu ni châtiment, ni récompense. En effet, que peuvent craindre ou espérer des hommes qui enseignent que rien ne doit changer, que nous serons toujours vous et moi ce que nous sommes aujourd’hui, ni meilleurs ni pires ? D’autres, partant de l’idée que l’âme est spirituelle et immortelle de sa nature, pensent qu’ils n’ont rien à craindre après cette vie, s’ils ont fait le mal ; parce que d’après leurs principes un être immatériel est impassible, et qu’on peut se passer de Dieu puisque l’on ne peut mourir.</p><p>Alors Tryphon me dit avec un sourire gracieux : Et vous, que pensez-vous sur toutes ces questions ? Quelle idée avez-vous de Dieu ? Quelle est votre philosophie, dites-le nous ?</p><p>II. — Je vous dirai tout ce que je pense, lui répondis-je. Assurément la philosophie est le plus grand de tous les biens et le plus précieux devant Dieu, puisqu’elle nous conduit à lui et nous rend agréables à ses yeux ; aussi je regarde comme les plus grands des mortels ceux qui se livrent à cette étude. Mais qu’est-ce que la philosophie ? Descendue du ciel pour éclairer les hommes, d’où vient qu’elle reste cachée à la plupart ? Il ne devrait y avoir ni platoniciens, ni stoïciens, ni péripatéticiens, ni pythagoriciens, ni contemplatifs ; mais il importe, puisque cette science est une, de dire pourquoi nous la voyons ainsi divisée. Ceux qui s’occupèrent les premiers de philosophie se firent un nom célèbre par cette étude ; ils eurent des successeurs qui adoptèrent leur doctrine sans chercher par eux-mêmes la vérité ; frappés de la vertu, de la force d’âme, du langage sublime de leurs maîtres, ils les crurent sur parole, tinrent pour vrai ce qu’ils en avaient reçu, et transmirent à leurs propres disciples ces premières opinions avec celles qui s’en rapprochaient le plus, en conservant le nom donné primitivement au père ou chef de l’école. Je voulus autrefois connaître ces divers systèmes de philosophie. Je m’attachai d’abord à un stoïcien ; mais voyant qu’un long séjour chez lui ne m’avaient rien appris de plus sur Dieu que je n’en savais (faut-il s’en étonner ? il ne le connaissait pas lui-même et ne pensait pas que cette connaissance fût nécessaire), je le quittai pour m’adresser à un péripatéticien, homme très-habile, du moins c’est ce qu’il croyait. Après m’avoir souffert près de lui les premiers jours, il me pria de fixer ce que je voulais lui donner pour ces leçons, afin, disait-il, qu’elles fussent utiles à tous deux. Là-dessus je le quittai, jugeant qu’il n’était rien moins que philosophe. Mais comme je voulais avant tout savoir ce qui fait le fond et l’essence de la philosophie, j’allai trouver un pythagoricien qui était en grande réputation, et il avait lui-même une haute idée de sa sagesse ; je lui exprimai le désir d’être admis au nombre de ses auditeurs et de jouir de son intimité. « Volontiers, me dit-il ; mais savez-vous la musique, l’astronomie, la géométrie ? penseriez-vous comprendre la science qui mène au bonheur sans posséder ces connaissances premières qui dégagent l’âme des objets sensibles, la rendent propre à saisir les choses intellectuelles, à contempler le beau, le vrai dans son essence. » Il me fit le plus grand éloge de ces diverses connaissances et me dit qu’elles étaient indispensables ; mais je lui répondis que je les ignorais complettement, et là-dessus il me congédia. Je fus, comme vous le pensez, fort affligé de me voir ainsi trompé dans mes espérances, d’autant plus que je lui croyais quelque savoir ; mais songeant à tout le temps que me demanderaient ces études, je ne pus supporter l’idée de me voir rejeté si loin de mon but. Je ne savais plus à quoi me résoudre, lorsque je pensai aux platoniciens ; ils étaient en grande vogue. Un des plus célèbres venait d’arriver à Naplouse, c’est avec lui que je me liai principalement ; je gagnais beaucoup à ses conversations, mon esprit grandissait tous les jours. Ce que je pus comprendre des choses immatérielles me transportait, et la contemplation des idées donnait comme des ailes à ma pensée : je croyais être devenu sage en peu de temps, et telle était ma folie, que je conçus l’orgueilleux espoir de voir bientôt Dieu lui-même, car c’est là le but que se propose la philosophie de Platon.</p><p>III. Cette disposition d’esprit me faisait chercher les plus profondes solitudes et fuir toute trace d’hommes, je me retirai donc dans une campagne à peu de distance de la mer ; comme j’approchais de l’endroit que j’avais choisi pour être seul avec moi-même, je m’apperçus qu’un vieillard d’un aspect vénérable, et d’une physionomie pleine de douceur et de gravité, me suivait d’assez près ; je m’arrêtai en me tournant vers lui et je le regardai avec beaucoup d’attention : — Vous me connaissez donc, me dit-il ?</p><p>— Non, lui répondis-je.</p><p>— Pourquoi donc me regarder ainsi ?</p><p>— Je m’étonne, lui répondis-je, de vous voir avec moi dans ce lieu, je m’y croyais seul.</p><p>— Je suis inquiet, me répondit le vieillard, de quelques-uns de mes amis ; ils sont partis pour un long voyage : je n’en ai pas de nouvelles. Je suis venu sur les bords de la mer pour tâcher de les découvrir de quelques côtés. Mais vous, quel motif vous amène en ces lieux ?</p><p>— J’aime, répondis-je, les promenades solitaires où rien ne distrait l’esprit, où l’on peut librement causer avec soi-même. Ces lieux sont bien propres aux graves études.</p><p>— Je le vois, vous êtes philologue, c’est-à-dire ami des mots, et non des œuvres et de la vérité. Vous aimez mieux être un raisonneur qu’un homme d’action.</p><p>— Eh ! lui dis-je, quoi de plus grand et de plus utile que de montrer aux hommes que c’est la raison qui doit commander en nous ; que d’étudier, en la prenant soi-même pour guide et pour appui, les passions et les erreurs qui travaillent les autres ; que de sentir combien leur conduite est insensée et déplaît à Dieu ! Sans la philosophie et sans une droite raison, il n’y a pas de sagesse dans l’homme ; tout homme doit donc s’appliquer à la philosophie, la regarder comme la plus noble, la plus importante des études, et placer les autres au second ou au troisième rang. D’ailleurs celles-ci, selon moi, ne sont utiles, estimables qu’autant qu’un peu de philosophie vient s’y mêler ; mais sans philosophie, elles sont fastidieuses, indignes d’un homme libre et bonnes à être reléguées parmi les arts purement mécaniques.</p><p>— Ainsi, selon vous, la philosophie fait le bonheur ?</p><p>— Oui, lui répondis-je, elle et elle seule.</p><p>— Eh bien ! dites-moi ce que c’est que la philosophie et quel est le bonheur qu’elle procure, si toutefois rien ne vous empêche de nous le dire ?</p><p>— La philosophie, répondis-je, c’est la science de ce qui est, c’est la connaissance du vrai ; et le bonheur, c’est la possession même de cette science, de cette connaissance si précieuse.</p><p>— Mais qu’est-ce que Dieu ? me dit-il.</p><p>— Je définis Dieu, l’être qui est toujours le même et toujours de la même manière, la raison et la cause de tout ce qui existe.</p><p>Le vieillard m’écoutait avec plaisir ; il me fit ensuite cette question :</p><p>— Ce que vous appelez science n’est-ce pas un mot générique qui s’applique à différentes choses ? Ainsi, vous direz d’un homme qui possède un art, qu’il en a la science : par exemple, on dira de lui qu’il a la science du commandement, la science du gouvernement, la science de la médecine. Mais pour les choses qui concernent Dieu et l’homme, existe-t-il une science qui les fasse connaître, qui montre ce qu’elles ont de juste et de divin ?</p><p>— Assurément, lui dis-je.</p><p>— Quoi donc ! il serait aussi facile de connaître Dieu et l’homme que la musique, l’arithmétique, l’astronomie ou quelque autre science semblable ?</p><p>— Oh non ! lui dis-je.</p><p>— Vous n’avez donc pas bien répondu à ma question, reprit-il. Certaines connaissances exigent de l’étude et du travail, d’autres ne demandent que des yeux. Si l’on vous disait qu’il existe dans l’Inde un animal qui ne ressemble à aucun autre, qu’il est de telle ou telle manière, de plusieurs formes, de diverses couleurs, avec tout cela vous ne sauriez pas ce qu’il est, si vous ne le voyiez de vos yeux, et vous n’en pourriez raisonner si vous n’en aviez jamais entendu parler à quelqu’un qui l’ait vu ?</p><p>— Bien certainement, lui dis-je.</p><p>— Comment donc les philosophes peuvent-ils avoir une idée juste de Dieu, ou affirmer quelque chose de vrai sur son être ; car ils ne le connaissent pas, puisque ni leurs yeux, ni leurs oreilles n’ont rien pu leur en apprendre ?</p><p>— Mais, lui répondis-je, on ne peut voir Dieu des yeux du corps comme les autres êtres. L’esprit seul peut le concevoir, ainsi que l’enseigne Platon, dont je professe la doctrine.</p><p>— Mais, reprit le vieillard, dites-moi ce que vous pensez de l’âme. Saisit-elle plus vite les objets que ne le fait l’œil du corps, ou bien peut-elle voir Dieu sans le secours de l’Esprit saint ?</p><p>IV. — Platon nous dit que l’œil de l’âme est doué d’une pénétration si vive, qu’avec lui, et c’est aussi pour cet usage qu’il nous a été donné, nous pouvons voir l’être par excellence, l’auteur de toutes les choses intellectuelles, qui n’a lui-même ni couleur, ni figure, ni étendue, rien en un mot de ce qui tombe sous les sens. Qu’est-ce que Dieu, en effet, sinon l’être au-dessus de toute essence, ineffable, incompréhensible, seul beau, seul bon, remplissant d’une lumière soudaine les âmes pures, à cause de leur affinité avec lui et de leur désir de le voir ?</p><p>— Quelle est donc, reprit le vieillard, cette affinité que vous leur supposez avec Dieu ? L’âme serait-elle immortelle, divine, une partie de cette grande âme qui régit le monde ? Comme elle voit Dieu, nous pouvons donc déjà, par notre esprit, le contempler et être heureux.</p><p>— Oui, certainement, répondis-je.</p><p>— Mais les âmes des animaux peuvent-elles aussi s’élever jusque là, reprit-il, ou bien l’âme de l’homme diffère-t-elle de celle du cheval, de l’âne, etc. ?</p><p>— Nullement. Elle est la même chez tous.</p><p>— Les chevaux et les ânes ont donc vu Dieu ou le verront un jour ?</p><p>— Non, certes. Il est même des hommes, et je parle ici du vulgaire, qui ne le verront pas ; c’est un privilége réservé seulement à l’homme de bien, rendu à sa pureté primitive par la pratique de la justice et de toutes les autres vertus.</p><p>— Ainsi, reprit-il, ce n’est point à cause de son affinité avec Dieu que l’âme le voit, ni même parce qu’elle est une intelligence, mais uniquement parce qu’elle est juste, pure, vertueuse.</p><p>— Dites aussi, lui répondis-je, parce qu’elle a l’idée de Dieu.</p><p>— Mais les chèvres et les brebis peuvent-elles nuire, faire du mal ?</p><p>— Non, sans doute.</p><p>— Eh bien ! d’après votre raisonnement, elles aussi verront Dieu.</p><p>— Point du tout, la conformation de leur corps s’y oppose.</p><p>— Ah ! si ces animaux pouvaient parler, que ne diraient-ils pas de la conformation du nôtre ! Sachez qu’ils auraient bien plus sujet de s’en moquer. Mais laissons là cette discussion. Je veux bien vous accorder tout ce que vous avancez. Répondez à une autre question : Quand est-ce que l’âme voit Dieu ? est-ce pendant qu’elle est unie au corps, ou lorsqu’elle en est séparée ?</p><p>— Lors même qu’elle est enfermée sous cette enveloppe matérielle, lui répondis-je, elle peut déjà embrasser Dieu par la pensée ; mais c’est surtout quand elle sera délivrée de sa prison et rendue à toute sa liberté, qu’elle jouira complettement et pour toujours de l’objet aimé.</p><p>— Rentrée dans l’homme, se souvient-elle de ce qu’elle a vu ?</p><p>— Je ne le pense pas.</p><p>— À quoi lui sert-il donc d’avoir vu Dieu ? Quel avantage a-t-elle sur l’âme qui ne l’a pas vu, si elle ne se souvient même pas d’avoir vu ?</p><p>— Je ne saurais ici vous répondre.</p><p>— Mais quelles peines souffrent les âmes qui ne sont pas jugées dignes de voir Dieu ?</p><p>— Elles sont enfermées dans le corps de quelques bêtes comme dans une prison. Tel est leur châtiment.</p><p>— Mais savent-elles pour quelle raison on les enferme dans ces nouveaux corps, leur a-t-on dit que c’était pour les fautes qu’elles avaient commises ?</p><p>— Je ne pense pas qu’elles le sachent.</p><p>— Alors le châtiment me paraît inutile ; je pourrais même dire qu’elles ne sont pas punies, si elles ne savent pas que c’est ici un châtiment ?</p><p>— Non, sans doute.</p><p>— Ainsi donc ces âmes ne voient point Dieu ; elles ne passent pas non plus dans d’autres corps, car si elles y étaient envoyées elles sauraient que c’est une punition, et elles craindraient désormais de commettre la plus légère faute. Ce que vous dites d’ailleurs qu’elles ont l’idée de Dieu, qu’elles savent qu’il est beau de pratiquer la justice, la piété, je l’admets avec vous.</p><p>— Vous avez raison, lui dis-je.</p><p>V. — Ainsi, ces grands philosophes, reprit le vieillard, ne sauraient répondre à ces diverses questions, ni même dire ce que c’est que l’âme ?</p><p>— Cela est vrai.</p><p>— On ne peut pas dire qu’elle soit immortelle de sa nature, autrement elle serait incréée.</p><p>— Quelques disciples de Platon la croient immortelle et incréée.</p><p>— Mais ne dites-vous pas que le monde lui-même est éternel ?</p><p>— Quelques-uns le prétendent. Pour moi, je ne suis pas de leur avis.</p><p>— Et vous faites bien ; car quelle raison de croire que ce corps dur, solide, compacte, qui change, périt, renaît tous les jours, n’a pas reçu l’existence de quelque cause ? Mais si le monde est créé, il faut bien que les âmes le soient également, et puissent cesser d’être. Si vous dites qu’elles ont été créées à part des corps et non avec eux, vous conviendrez du moins qu’elles ont été faites pour eux.</p><p>— Cela me paraît juste.</p><p>— Dès lors elles ne sont pas immortelles de leur nature.</p><p>— Non, si nous admettons que le monde a été créé.</p><p>— Ce n’est pas, reprit le vieillard, que je prétende qu’une seule âme périsse, car tout l’avantage serait pour les méchants. Que vous dirai-je ? Les âmes des justes sont appelées à une meilleure vie, et celles des méchants envoyées dans un lieu de souffrances, où elles attendent le jour du jugement. Celles que Dieu juge dignes de le voir, ne meurent point, et les autres sont punies aussi longtemps qu’il plaît à Dieu qu’elles vivent et qu’elles soient punies.</p><p>— Ce que vous dites, lui répondis-je, n’est-ce pas ce qu’enseigne Platon d’une manière assez obscure au sujet du monde qu’il dit sujet à la corruption, parce qu’il est créé ; mais qui, cependant, ne doit ni se dissoudre ni périr, parce que la volonté de Dieu s’y oppose ? Voilà je pense ce que vous voulez faire entendre au sujet de l’âme, et en général des autres êtres. Tout ce qui est et sera jamais après Dieu est corruptible de sa nature, et partant peut être détruit et anéanti. Dieu seul est incréé, incorruptible : c’est par là même qu’il est Dieu ; ce qui vient après lui est créé, et par là même périssable : c’est pour cela que des âmes peuvent être punies et mourir. Incréées, elles ne pécheraient point, elles ne donneraient dans aucun excès de folie, elles ne seraient ni lâches ni féroces, elles ne se décideraient point à entrer dans le corps des pourceaux, des serpents, des chiens, et il ne serait pas possible de les y contraindre par-là même qu’elles seraient incréées. Supposez deux êtres incréés, ils sont nécessairement semblables, égaux, ou plutôt ils ne font qu’un ; l’un ne surpasse point l’autre en pouvoir ou en dignité : d’où je conclus qu’il n’existe pas plusieurs êtres incréés ; car, s’il y avait entre eux la moindre différence, toutes les recherches possibles ne pourraient vous en faire découvrir la cause ; votre pensée se perdrait dans l’infini, vous reviendriez après bien des peines inutiles vous rattacher à un seul être incréé, et le reconnaître comme la cause de tous les autres êtres.</p><p>Croyez-vous, ajoutai-je, que Platon, Pythagore, qui sont pour nous comme les remparts de la philosophie, aient ignoré tout ce que nous venons de dire ?</p><p>VI. — Peu m’importe, reprit le vieillard, et Platon et Pythagore, et tous ceux qui partagent leurs idées. Voici la vérité qu’ils n’ont pas comprise et que vous comprendrez facilement. Ou l’âme est la vie même, ou seulement elle la reçoit. Si elle est la vie, elle doit la communiquer à un autre objet qu’à elle-même, comme le mouvement qui ne se renferme pas en lui, mais se communique au dehors. Que l’âme vive, personne ne le nie ; mais si elle vit, ce n’est pas parce qu’elle est la vie, c’est seulement parce qu’elle y participe. Or, il y a une grande différence entre participer à une chose et être la chose elle-même. L’âme participe à la vie uniquement parce que Dieu veut qu’elle vive, et si Dieu cessait de le vouloir, elle cesserait d’exister, car la vie n’appartient pas en propre à l’âme comme elle appartient à Dieu. Qui ne sait pas que l’homme n’existe pas toujours, que l’âme n’est pas toujours unie au corps, qu’elle l’abandonne quand leur union doit cesser, et qu’alors l’homme n’est plus ? Eh bien ! de même si Dieu veut que l’âme finisse, le souffle vital se retire d’elle, elle s’éteint, elle retombe dans le néant d’où elle est sortie.</p><p>VII. — Mais, repris-je, à quels maîtres recourir, quel appui réclamer pour nous soutenir, si ces grands génies eux-mêmes ont ignoré la vérité.</p><p>Il me répondit : — À une époque fort éloignée de la nôtre, bien avant tous vos philosophes vivaient des hommes justes, saints, agréables à Dieu, remplis de son esprit. Inspirés d’en haut, ils annoncèrent tous les événements que nous voyons s’accomplir sous nos yeux. Ces hommes, ce sont les prophètes. Seuls ils ont connu la vérité et l’ont fait connaître. Étrangers à la crainte, exempts de vanité, mais remplis de l’esprit de Dieu, ils publiaient ce qu’ils avaient vu et entendu. Leurs écrits existent encore. Ceux qui les lisent attentivement et sans prévention comprennent le principe et la fin de toutes choses, et savent bientôt tout ce que doit savoir un véritable philosophe. Ils ne discutaient pas quand il fallait parler. Ils étaient les témoins de la vérité, et combien leur témoignage est supérieur à tous les raisonnements ! Les événements passés et ceux qui arrivent tous les jours nous forcent impérieusement de croire à leurs paroles. Ils célébraient la gloire de Dieu le père, le souverain arbitre de l’univers. Ils annonçaient aux hommes celui que Dieu nous a envoyé, c’est-à-dire le Christ, son fils. Vous ne trouvez rien de semblable chez ces faux prophètes, que remplit l’esprit impur, l’esprit de mensonge. Ils cherchent à éblouir par des prestiges, et ne célèbrent que l’esprit d’erreur qui les animait, je veux dire le démon. Mais, avant tout, demandez que les portes de la lumière s’ouvrent pour vous. Qui peut voir et comprendre, si Dieu et son Christ ne lui donnent l’intelligence ?</p><p>VIII. Ainsi me parla le vieillard. Il me dit encore beaucoup d’autres choses qu’il est inutile de rapporter ici, et disparut en me recommandant de méditer ses paroles. Je ne l’ai pas revu depuis, mais un feu secret me dévorait ; je brûlais du désir de connaître les prophètes et les hommes divins amis du Christ. En repassant dans mon esprit tout ce que m’avait dit le vieillard, je pensais que là devait se trouver la seule philosophie utile et certaine. Vous savez maintenant comment et pourquoi je suis philosophe. Je n’ai plus qu’un désir, c’est de voir tous les hommes entrer dans la même voie et ne pas s’éloigner de la doctrine du Sauveur. En elle respire je ne sais quelle majesté terrible, bien capable d’effrayer les hommes qui ont abandonné le droit chemin. Ceux qui méditent cette doctrine y trouvent au contraire le plus délicieux repos. Si vous vous intéressez à vous-mêmes, si avec le désir du salut, vous avez confiance au Dieu qui veut vous le procurer, venez vous instruire à l’école du Christ, faites-vous initier à ses mystères et vous pourrez connaître le bonheur.</p><p>À ces mots, les compagnons de Tryphon poussèrent un grand éclat de rire. Pour lui, il me dit en souriant : — J’applaudis au motif qui vous anime, au zèle tout divin qui vous embrâse ; mais il eût mieux valu rester disciple de Platon ou d’un autre philosophe, et vous appliquer à acquérir la constance, l’empire sur les passions, la sagesse, que de vous laisser prendre à tout ce faux langage et de vous attacher à des hommes méprisables. En demeurant fidèle à vos principes et vivant sans reproche, vous conserviez l’espoir d’une vie meilleure. Mais, quand vous abandonnez Dieu pour croire à la parole d’un homme, quel espoir de salut peut vous rester ? Si vous voulez m’en croire, car je vous regarde déjà comme un ami, faites-vous d’abord circoncire, puis observez le sabbat, les fêtes, les nouvelles lunes comme la loi le prescrit ; en un mot, faites tout ce qu’elle commande, peut-être alors trouverez-vous grâce devant le Seigneur. Si le Christ est né et demeure quelque part, il est inconnu, il ne se connaît pas lui-même et n’a aucun moyen de se faire connaître. Il faut d’abord que le prophète Élie vienne lui donner l’onction sainte et le révèle à la terre. Sur de vains bruits, vous avez rêvé un Christ qui n’est que dans votre imagination, et dupe de vous-même, vous courez aveuglément à votre perte.</p><p>IX. — Puisse le Seigneur vous le pardonner et vous faire grâce, ô Tryphon ! Vous blasphémez ici ce que vous ignorez. Vous croyez sur parole vos docteurs qui n’entendent pas les Écritures, et trompé par leurs fausses interprétations, vous dites au hasard tout ce qui vous vient à l’esprit. Si vous le voulez, je vous montrerai que ce n’est pas nous qui sommes dans l’erreur. Vous comprendrez que rien n’est capable de nous empêcher de confesser le Christ ; non, quand le tyran le plus farouche nous le défendrait, quand nous aurions à redouter tous les genres d’outrage. Je vous ferai voir que notre foi repose, non sur de vaines fables, sur des discours dépourvus de raison, mais sur une parole toute divine, pleine de force, riche de grâce.</p><p>Les compagnons de Tryphon recommencèrent leurs éclats de rire et poussèrent des cris indécents. Alors je me levai pour m’en aller. Mais Tryphon m’arrêta en me retenant par mon manteau, et me dit qu’il ne me laisserait point sortir que je n’eusse acquitté ma promesse.</p><p>— Que vos compagnons cessent donc leur bruit, lui répondis-je, et se comportent autrement : s’ils veulent nous entendre, qu’ils se taisent ; ou si quelque objet plus intéressant les appelle autre part, qu’ils nous laissent. Pour nous, mettons-nous un peu à l’écart et poursuivons en repos notre discussion.</p><p>Tryphon accepte la proposition, et nous fûmes d’avis de nous retirer au milieu du stade qui se trouvait dans le Xiste. Deux de ses compagnons se moquèrent de nous et, après quelques plaisanteries sur le zèle qui nous enflammait, ils s’en allèrent. Quand nous fûmes arrivés dans l’endroit où se trouvent deux rangs de siéges en pierre, les amis de Tryphon qui s’étaient assis d’un côté s’entretinrent quelques instants de la dernière guerre de Judée, sur laquelle l’un d’eux avait amené la conversation.</p><p>X. Lorsqu’ils eurent fini, je pris la parole en ces termes :</p><p>— Mes amis, que nous reprochez-vous ? Est-ce de ne pas vivre selon la loi, de ne pas nous soumettre à la circoncision, ainsi que le faisaient vos pères ; de ne point observer comme vous le jour du sabbat ? ou bien croyez-vous les odieuses calomnies répandues parmi vous contre les mœurs et les habitudes des Chrétiens ; et, s’il faut ici les rappeler, nous aurait-on peints à vos yeux comme des hommes qui mangent de la chair humaine, qui, le repas fini et les lumières éteintes, se livrent aux plus infâmes débauches ; ou bien, enfin, nous condamnez-vous seulement parce que nous suivons la religion du Christ, parce que nous professons une doctrine qui ne vous semble pas la vérité ?</p><p>— Oui, reprit Tryphon, ce que vous venez de dire en dernier lieu est la seule chose qui nous étonne ; pour les discours de la multitude, ils ne méritent pas d’être répétés et répugnent trop à la nature. Je trouve, au contraire, dans le livre que vous appelez Évangile, de très-beaux préceptes de morale, mais si élevés et si sublimes, que je les crois impraticables ; car j’ai eu la curiosité de lire ce livre. Mais n’est-il pas étonnant que des hommes qui se piquent de piété, qui prétendent par là se distinguer des autres, n’en diffèrent en aucune manière et ne vivent pas mieux que les gentils ? En effet, vous n’observez ni les fêtes, ni le sabbat, ni la circoncision ; vous placez votre espérance dans un crucifié, vous ne suivez aucun des préceptes du Seigneur, et vous osez attendre de lui des récompenses ! Ne lisez-vous pas dans le Testament qu’il nous a donné, que tout homme qui n’aura pas été circoncis le huitième jour périra d’entre son peuple ? La loi comprend jusqu’aux étrangers qui vivent parmi nous, jusqu’aux esclaves que l’on achette. Vous ne tenez compte ni du Testament, ni de ses conséquences ! Comment donc nous persuaderez-vous que vous connaissez Dieu, lorsque vous ne faites rien de ce qu’on voit faire à tous ceux qui le craignent ? Montrez-nous, si vous le pouvez, sur quoi se fonde votre espoir quand vous transgressez sa loi ; donnez-nous une raison qui nous satisfasse : alors nous vous écouterons très-volontiers, et c’est avec le même plaisir que nous discuterons tout le reste avec vous.</p><p>XI. Je repris en ces termes : Le seul Dieu véritable, Tryphon, celui qui a toujours été et qui sera toujours, c’est l’auteur de cet univers et du bel ordre qu’on y admire. Nous n’avons pas un autre Dieu que le vôtre, nous adorons avec vous celui dont la main puissante a tiré vos pères de la terre d’Égypte ; c’est en lui que nous espérons comme vous, car il n’y en a point d’autre : c’est le Dieu d’Abraham, d’Isaac et de Jacob ; mais ce n’est ni par Moïse, ni par la loi que nous espérons en lui ; car alors nous serions ce que vous êtes. J’ai lu dans les Écritures que Dieu devait donner une nouvelle loi, un autre Testament qui ne serait jamais aboli ; c’est cette loi, c’est ce Testament que doivent désormais observer ceux qui veulent avoir part à l’héritage céleste. La loi donnée sur le mont Horeb est ancienne, elle était pour vous seuls ; la nouvelle est pour tous les peuples. Substituée à la première, elle l’abroge entièrement, comme le Testament nouveau abolit celui qui le précède. Cette loi tout à la fois éternelle et nouvelle, cet autre Testament qui doit toujours durer, après lequel il n’y a plus ni loi, ni précepte qui oblige, c’est le Christ. N’avez-vous jamais lu ces paroles d’Isaïe : « Écoutez, ô mon peuple, et vous rois de la terre, prêtez l’oreille à ma voix : la loi sortira de ma bouche, ma justice éclairera les peuples ; le juste approche, le Sauveur s’avance, les nations espéreront en moi. » Voilà pour la loi. C’est ainsi que le Seigneur parle du Testament par la bouche de Jérémie : « Voici que les jours viennent, je donnerai un Testament nouveau à la maison d’Israël et à celle de Juda ; ce n’est plus celui que j’avais donné à leurs pères, lorsque je les pris par la main pour les tirer de la terre d’Égypte. »</p><p>Puisque Dieu avait annoncé qu’il donnerait un Testament nouveau, et que ce Testament serait la lumière des nations ; puisque nous voyons les peuples, au nom de Jésus crucifié, abandonner les idoles et toutes les autres voies iniques pour venir au vrai Dieu ; puisque rien, pas même l’aspect de la mort, ne peut les détacher de son culte et les empêcher de confesser son nom, n’avez-vous pas une preuve certaine, d’après les œuvres et les miracles qui s’opèrent, que la nouvelle loi, le nouveau Testament, l’espérance de ceux qui, parmi les nations attendent l’héritage promis, c’est Jésus-Christ lui-même ? Nous sommes aujourd’hui la race spirituelle et véritable d’Israël, de Juda, de Jacob, d’Isaac et d’Abraham qui reçut de Dieu la circoncision, en témoignage de sa foi, qui fut béni et appelé le père d’un grand nombre de nations. Oui, dis-je, nous formons la race sainte qui lui fut promise, nous qui n’avons connu le vrai Dieu que par Jésus crucifié, comme la suite de cette discussion le fera voir.</p><p>XII. Alors je leur citai ces paroles d’Isaïe, qui s’écrie dans un autre endroit : « Écoutez ma voix et vous vivrez, et je vous donnerai le Testament éternel promis à mon serviteur David : je l’ai donné pour témoin aux peuples de la terre. Les nations qui ne te connaissent pas t’invoqueront, les peuples qui t’ignorent se réfugieront vers toi, à cause du Seigneur ton Dieu, le Dieu saint d’Israël qui t’a glorifié. » Et voilà la loi que vous outragez, et voilà le Testament saint et nouveau que vous méprisez ! À cette heure même, vous ne voulez ni le reconnaître, ni faire pénitence : « Vos oreilles sont encore fermées, vos yeux aveuglés et vos cœurs endurcis. » Jérémie annonce hautement le nouveau législateur, et vous n’entendez pas sa voix ; ce législateur est au milieu de vous, et vous ne le voyez pas ; les pauvres reçoivent l’Évangile, les aveugles voient, et vous ne comprenez pas ! Il faut maintenant une circoncision nouvelle, et vous ne vous glorifiez que dans celle de la chair. La nouvelle loi vous ordonne de célébrer un sabbat éternel, et lorsque vous vous êtes reposés un seul jour, vous vous croyez les plus religieux des hommes. Vous ignorez pourquoi votre sabbat, votre circoncision ont été établis. Parce que vous mangez un pain sans levain, vous vous imaginez avoir accompli toute justice. Ce n’est pas là ce que demande le Seigneur notre Dieu. Si quelqu’un est parjure ou voleur, qu’il cesse de l’être ; s’il est adultère, qu’il fasse pénitence ; c’est alors qu’il célébrera le vrai sabbat, le sabbat le plus agréable à Dieu. Si quelqu’un n’a pas les mains pures, qu’il se lave dans l’eau et le voilà purifié.</p><p>XIII. Mais ce n’est pas à de semblables ablutions que vous renvoie Isaïe, pour vous purifier du meurtre ou d’autres crimes semblables ; toute l’eau de la mer ne serait pas capable de les effacer. Mais il annonçait déjà le seul bain salutaire, le seul véritable, celui de la pénitence, ce baptême qui purifie non par le sang des boucs et des brebis, ou par le sacrifice d’une génisse ou par une offrande de farine, mais par la foi au sang de celui qui est mort pour expier le péché. Et n’est-ce pas ce que signifient ces paroles d’Isaïe : « Le Seigneur a déployé son bras aux yeux des nations ; tous les peuples, jusqu’aux confins de la terre, verront le salut qui vient de Dieu. Retirez-vous, retirez-vous ; sortez et ne touchez rien d’impur. Sortez du milieu de la foule, séparez-vous, ô vous qui portez les vases du Seigneur, vous ne marcherez pas en tumulte, le Seigneur précédera vos pas, le Seigneur Dieu d’Israël vous rassemblera. Mon serviteur sera plein d’intelligence, grand et élevé en gloire ; ainsi que plusieurs se sont étonnés, Jérusalem, à la vue de tes ruines, son visage sera sans éclat et sa figure méprisée. Mais la multitude des nations l’admirera, devant lui les rois garderont le silence ; car ceux à qui il n’a point été annoncé verront, ceux qui n’ont point entendu comprendront. Qui croira à notre parole ? Pour qui le bras du Seigneur a-t-il été révélé ? Nous l’avons annoncé comme un faible arbrisseau qui s’élève en la présence du Seigneur, comme un rejeton qui sort d’une terre aride ; il n’a ni éclat, ni beauté, nous l’avons vu, et il était méconnaissable et le plus abandonné des hommes ; homme de douleur, il est familiarisé avec la misère, son visage est obscurci par les opprobres, il a été méprisé et compté pour rien. Il a vraiment lui-même porté nos infirmités ; il a souffert pour nous, nous l’avons vu dans la douleur, chargé de blessures et d’affliction ; il a été blessé à cause de nos iniquités, il a été brisé pour nos crimes ; le châtiment qui doit nous procurer la paix s’est appesanti sur lui, nous avons été guéris par ses meurtrissures. Nous nous sommes tous égarés comme des brebis, chacun de nous se perdait dans sa voie, et le Seigneur a fait tomber sur lui l’iniquité de nous tous ; et lui, dans son affliction, n’a pas ouvert la bouche : il a été conduit à la mort comme un agneau, il est resté muet comme une brebis devant celui qui la tond, il est mort au milieu des angoisses après un jugement. Qui racontera sa génération ? Il a été retranché de la terre des vivants, il a été conduit à la mort pour les iniquités de mon peuple. On lui réservait la sépulture de l’impie, il a été enseveli dans le tombeau du riche, parce qu’il a ignoré l’iniquité et que le mensonge n’a pas souillé sa bouche. Le Seigneur veut guérir ses plaies ; parce qu’il a été livré pour le péché, il verra sortir de lui une race immortelle ; oui, Dieu veut arracher son cœur à la douleur, lui montrer sa lumière, accomplir par lui sa volonté et justifier un grand nombre d’hommes. Oui, dis-je, il portera nos péchés ; mais aussi il possédera un peuple nombreux, il distribuera lui-même la dépouille des justes, et cela parce qu’il a été livré à la mort, qu’il a été mis entre des scélérats, parce qu’il a porté les péchés de tous et qu’il a été livré pour leurs iniquités. Réjouis-toi, stérile qui n’enfante pas ; chante des cantiques de louanges, pousse des cris de joie, toi qui n’avais pas d’enfants. L’épouse abandonnée, a dit le Seigneur, est devenue plus féconde que celle qui a un époux. Étends l’enceinte de tes pavillons, déploie les voiles de tes tentes, n’épargne rien, allonge tes cordages, affermis tes pieux ; pénètre à droite, à gauche, ta postérité héritera des nations et remplira les villes désertes. Ne crains pas, tu ne seras pas confondue, tu n’auras point à rougir, tu ne connaîtras plus la honte ; tu oublieras la confusion de ta jeunesse, tu ne te rappelleras plus l’opprobre de ta viduité. Le Seigneur a signalé son nom. Ton Sauveur, c’est le Dieu d’Israël, qui désormais sera appelé le Dieu de toute la terre. Le Seigneur t’a appelée, comme une femme dans l’abandon et dans la douleur, comme une épouse répudiée dès sa jeunesse. »</p><p>XIV. Si nous croyons, c’est par ce baptême de la pénitence que Dieu lui-même a établi, comme le dit Isaïe, pour effacer les péchés des hommes et nous amener à sa connaissance ; et ce baptême dès longtemps prédit par Isaïe, et seul capable de purifier le pécheur qui se repent, nous publions qu’il est la seule source de la vie.</p><p>Les citernes que vous vous êtes creusées ne peuvent contenir leurs eaux et vous deviennent inutiles. Quel avantage peut résulter pour vous d’un baptême qui ne purifie que le corps ? C’est votre âme qu’il faut affranchir de la colère, de l’avarice, de l’envie, de la haine, et alors vous serez vraiment purs.</p><p>Les pains azymes vous apprennent qu’il faut renoncer aux œuvres anciennes qui naissent d’un mauvais levain ; mais ces figures vous les entendez dans un sens tout charnel. Votre âme serait-elle remplie de fraude et d’injustice, vous ne vous en croiriez pas moins les plus pieux des hommes, parce que vous observez toutes les pratiques extérieures. Dieu ne vous a-t-il pas ordonné d’user d’un levain nouveau, après avoir mangé pendant sept jours des pains azymes ? Que veut-il nous faire entendre par là, sinon qu’il faut sortir de l’ancienne et mauvaise voie, et commencer une vie nouvelle ?</p><p>Pour bien vous convaincre que c’est là ce que demande le nouveau législateur, je répéterai les paroles que j’ai déjà citées, et j’ajouterai celles que j’avais omises ; je les emprunte au prophète Isaïe : « Écoutez-moi, dit le Seigneur, et vous allez vivre ; j’établirai avec vous l’éternelle alliance promise à mon serviteur David ; je l’ai donné pour témoin au peuple, pour guide et pour maître aux nations. Les nations qui ne vous connaissent pas vous invoqueront. Les peuples qui vous ignoraient accourront à vous, à cause du Seigneur votre Dieu, du saint d’Israël qui vous a glorifié. Cherchez le Seigneur pendant qu’il peut être trouvé, invoquez-le pendant qu’il est proche. Que l’impie abandonne sa voie et l’homme inique ses pensées ; qu’ils retournent au Seigneur, il aura pitié d’eux ; il est riche en miséricorde, il vous remettra vos péchés. Mes pensées ne sont pas vos pensées ; mes voies ne sont pas vos voies. Comme la neige et la pluie descendent du ciel et n’y retournent plus, mais pénètrent la terre, la fécondent et font germer la semence, espoir du laboureur, ainsi mes paroles ne reviendront pas à moi sans fruit, elles accompliront mes desseins et prospèreront en tout ce que j’ai voulu ; vous sortirez dans la joie et vous mangerez dans la paix. Dans votre attente, les montagnes et les collines tressailliront d’allégresse, et tous les arbres de la terre animés par la joie agiteront leurs rameaux. Les pins s’élèveront à la place des ronces, le myrte croîtra à la place de l’ortie, et le Seigneur sera connu sous son nom éternel que rien n’effacera. »</p><p>J’ajoutai : Ainsi donc, Tryphon, dans ces prophéties et d’autres semblables, vous trouvez des choses qui se rapportent les unes au premier avénement du Christ quand il parut sous une forme mortelle, sans gloire, et sans beauté ; les autres à son second avénement, lorsqu’il viendra sur les nuées du ciel avec majesté, et que vous verrez, que vous reconnaîtrez celui que vous avez percé, ainsi que Daniel, ainsi qu’Osée, l’un des douze prophètes, l’ont prédit.</p><p>XV. Apprenez encore d’Isaïe quel est le jeûne que Dieu demande de vous et le seul qui lui soit agréable. C’est ainsi que lui parle le Seigneur : « Crie avec force, ne te lasse point. Fais retentir ta voix comme les éclats de la tempête ; annonce à mon peuple ses crimes, à la maison de Jacob ses prévarications. Chaque jour ils m’interrogent et veulent savoir mes vues, et comme un peuple ami de l’innocence et qui n’avait point violé ma loi, ils invoquent ma justice, ils veulent défendre leur cause devant moi. Nous avons jeûné, disent-ils, pourquoi n’avez-vous pas daigné regarder nos jeûnes ? Nous nous sommes humiliés : pourquoi l’avez-vous ignoré ? Parce que vous suivez vos caprices en vos jours de jeûne et que vous écrasez tous ceux qui vous sont soumis. Ne jeûnez-vous que pour susciter des procès, des querelles, et pour frapper impitoyablement vos frères ? Cessez de pareils jeûnes, si vous voulez que le ciel entende vos cris. Est-ce là un jeûne choisi par moi ? Que l’homme soit tous les jours humilié, qu’il courbe sa tête comme un jonc, et qu’il dorme dans un cilice et sur la cendre. Est-ce là un jeûne et un jeûne agréable au Seigneur ? N’y a-t-il pas un jeûne de mon choix ? Rompez les liens de l’iniquité, anéantissez les obligations de vos contrats tyranniques, déchargez de leurs dettes ceux que vous écrasiez ; déchirez toute écriture qui respire l’injustice, partagez votre pain avec celui qui a faim et recevez sous votre toit les pauvres qui sont sans asile : si vous voyez des hommes nus, couvrez-les, et ne méprisez point vos frères qui sont votre propre chair. Alors votre lumière brillera comme l’aurore, votre vêtement en sera tout éclatant. Votre justice marchera devant vous et vous serez environnés de la gloire du Seigneur. Alors vous l’invoquerez, et il vous exaucera ; à votre premier cri, le Seigneur répondra : Me voici. Oui, si vous détruisez l’oppression parmi vous, si vous cessez vos menaces et vos paroles outrageantes, si vous assistez le pauvre avec effusion de cœur, si vous rassasiez sa faim, si vous consolez l’âme abattue ; votre lumière se lèvera dans les ténèbres, et les ténèbres seront pour vous comme un soleil dans son midi. Le Seigneur sera toujours avec vous ; il remplira tous les désirs de votre cœur ; il ranimera vos ossements ; vous serez comme un jardin toujours arrosé, comme une source dont les eaux ne tarissent jamais. »</p><p>Soyez donc, avant tout, circoncis de cœur ; car voilà la véritable circoncision, celle que toutes les paroles des divines Écritures vous recommandent.</p><p>XVI. Dieu vous dit lui-même par la bouche de Moïse : « Ayez soin de circoncire votre cœur, et ne vous endurcissez pas davantage, parce que le Seigneur votre Dieu est lui-même le Seigneur des Seigneurs, le Dieu grand, et puissant, et terrible, qui n’a point d’égard aux personnes ni aux présents. » Et dans le Lévitique : « Parce qu’ils ont prévariqué, qu’ils m’ont méprisé, qu’ils ont marché contre moi, j’ai aussi marché contre eux, je les abandonnerai dans une terre ennemie. Leur cœur incirconcis s’est humilié. »</p><p>La circoncision selon la chair n’était qu’un signe qui devait servir à vous distinguer de nous et des autres peuples, quand la main de Dieu ferait tomber sur vous seul les châtiments que vous subissez justement aujourd’hui ; et quels fléaux plus affreux ? Votre pays n’est plus qu’un désert ; vos villes sont la proie des flammes ; l’étranger, sous vos yeux, dévore vos moissons ; personne de vous ne peut plus entrer dans Jérusalem. Ce qui vous fait reconnaître au milieu de ces désastres, c’est la marque de la circoncision imprimée sur votre chair. Je suis persuadé qu’aucun d’entre vous n’oserait dire que Dieu ignore l’avenir, et ne prépare pas à chacun le sort qu’il mérite. C’est donc à juste titre que tous ces maux vous sont arrivés. Hélas ! vous avez fait mourir le juste ; autrefois vous mettiez à mort ses prophètes, et aujourd’hui vous accablez d’outrages et de mépris ceux qui espèrent en lui et en son père, le Dieu tout-puissant, qui nous l’a envoyé ; vous les chargez de malédictions dans vos synagogues. Toutes les fois que vous avez pu nous égorger, vous l’avez fait. Ce qui enchaîne votre bras, c’est la crainte de ceux qui vous dominent aujourd’hui ; c’est pourquoi Dieu vous crie par la bouche de son prophète Isaïe : « Voyez comme le juste a péri, et personne n’y pense. Le juste a été enlevé du milieu de l’iniquité : il reposera en paix dans sa tombe ; oui, il a été enlevé du milieu de vous. Approchez maintenant, enfants d’iniquité, race d’adultères et de prostituées ! De qui vous êtes-vous joués ? contre qui avez-vous ouvert la bouche et dardé vos langues ? »</p><p>XVII. En fait d’outrages contre le Christ et contre nous qui sommes sortis de lui, aucune nation ne s’est rendue aussi coupable que la vôtre ; vous êtes les auteurs de ces préventions et de ces calomnies qui nous poursuivent partout. Vous avez mis en croix le seul juste, le seul innocent, celui dont les blessures guérissent l’homme qui veut, par lui, aller à Dieu son père. Et, bien que vous sachiez à n’en pas douter qu’il est ressuscité d’entre les morts et remonté aux cieux, comme les prophètes l’avaient annoncé, non-seulement vous n’avez pas fait pénitence, mais vous avez envoyé de Jérusalem, par toute la terre, des gens chargés de présenter les Chrétiens comme une secte impie qui venait de s’élever et de répandre toutes ces calomnies que répètent encore aujourd’hui ceux-mêmes qui ne vous connaissent pas. Vous êtes donc coupables de vos propres crimes et de ceux de tous les hommes que vous avez égarés. Et c’est avec raison que Dieu vous crie par le prophète Isaïe : « À cause de vous, mon nom est blasphémé parmi les nations. » Et plus loin : « Malheur à eux ! ils ont pris parti contre eux-mêmes, lorsqu’ils disaient : Enchaînons le juste, il nous est inutile. Ils mangent aujourd’hui le fruit de leurs œuvres. Malheur donc à l’impie ! il lui arrivera selon ce qu’il aura fait. » Et encore ailleurs : « Malheur à ceux qui traînent l’iniquité comme de longues chaînes, et le péché comme les traits d’un char, et qui osent dire au Seigneur : Qu’il se hâte dans son œuvre, que les conseils du saint d’Israël nous soient manifestés, et nous saurons s’ils sont véritables. Malheur à vous, qui appelez mal le bien et bien le mal ; qui changez les ténèbres en lumière et la lumière en ténèbres, l’amertume en douceur et la douceur en amertume ! » Il n’est que trop vrai que vous avez cherché à répandre les plus odieuses préventions, les plus sombres nuages sur la seule lumière, pure, incorruptible, que Dieu ait fait luire aux yeux des hommes. Elle vous a paru trop importune, la voix de celui qui vous criait : « Il est écrit : Ma maison est une maison de prières, et vous en avez fait une maison de voleurs. » Il fit plus, il a renversé lui-même les tables des changeurs qui s’étaient établis dans le temple. « Malheur à vous ! s’écriait-il, scribes et pharisiens hypocrites, qui payez la dîme de la menthe et du cumin, et qui omettez la justice et les préceptes de l’amour de Dieu. Sépulcres blanchis, qui au dehors paraissent beaux, mais qui au dedans sont pleins d’ossements de morts et de corruption. » Et ailleurs, adressant aux scribes : « Malheur à vous ! scribes, qui après vous être emparés de la clé de la science, n’y êtes point entrés et en avez fermé l’entrée aux autres, chefs aveugles que vous êtes. »</p><p>XVIII. Puisque vous nous avez dit, Tryphon, que vous aviez lu l’Évangile, j’ai cru pouvoir rapprocher quelques paroles du Christ de celles des prophètes. Purifiez-vous donc, éloignez de vous l’iniquité, voilà surtout la purification que Dieu vous recommande, la circoncision qu’il exige de vous. Nous observerions nous-mêmes et votre circoncision selon la chair, et votre sabbat et toutes vos fêtes, si nous ne savions pas que c’est à cause de vos prévarications et de la dureté de vos cœurs que toutes ces pratiques vous ont été prescrites ; car si nous supportons avec tant de courage les persécutions que soulève contre nous la méchanceté des hommes et des démons, si telle est notre constance au milieu des plus cruelles épreuves, en face de la mort et des tortures, que nous prions pour ceux mêmes qui nous traitent si indignement, et que, selon le précepte de notre divin législateur, nous demandons instamment qu’il ne leur arrive aucun mal, comment n’observerions-nous pas, ô Tryphon, ce qui n’a rien de difficile en soi-même, je veux dire et votre circoncision selon la chair, et votre sabbat, et vos fêtes ?</p><p>XIX. Mais comment se fait-il que vous, qui vous soumettez à toutes ces pratiques, vous ne vouliez pas remplir tous ces autres préceptes dont nous parlons ? Voilà ce que nous ne saurions expliquer.</p><p>Votre circoncision n’était pas nécessaire aux autres hommes, mais à vous seulement, qui deviez éprouver les maux que vous souffrez aujourd’hui. Nous n’admettons pas non plus cet inutile baptême qui se fait avec l’eau de vos citernes, il n’a rien de commun avec le baptême qui donne la vie ; et voilà pourquoi Dieu s’écrie que vous l’abandonnez, lui l’unique source vivifiante, pour vous creuser des citernes qui ne retiennent pas leurs eaux. Vous recevez la circoncision de la chair et vous ne connaissez pas la plus nécessaire, celle du cœur ; pour nous, avec celle-ci, nous n’avons pas besoin de la vôtre ; car si elle était indispensable comme vous le prétendez, Dieu n’aurait pas créé Adam incirconcis ; il n’aurait pas agréé les dons d’Abel, les offrandes d’Hénoch, qui n’étaient pas plus circoncis qu’Adam. Hénoch n’eût pas été transporté au ciel, sans laisser aucune trace de lui sur la terre. Loth, tout incirconcis qu’il était, n’aurait pas été sauvé du feu de Sodôme par le Seigneur lui-même et par ses anges ? Noé, ce père d’une race nouvelle, était-il circoncis quand Dieu le fit entrer dans l’arche avec ses fils ? Était-il circoncis, ce grand-prêtre du Très-Haut, Melchisédech, qui reçut la dîme d’Abraham, le premier des hommes que Dieu soumit à la loi de la circoncision et que bénit ensuite ce même Melchisédech, dans lequel Dieu établissait son sacerdoce éternel, ainsi qu’il le déclare par le prophète David ? Je le répète, cette circoncision de la chair n’était nécessaire qu’à vous seuls, parce que le peuple de Dieu ne devait plus être son peuple, ni sa nation sa nation, pour me servir ici des paroles d’Osée, l’un des douze prophètes ; car tous ces justes dont je viens de parler furent agréables à Dieu, bien qu’ils n’aient pas observé vos sabbats non plus, Abraham et tous ses descendants jusqu’à Moïse, sous lequel votre peuple signala toute sa perversité et son ingratitude par ce veau d’or qu’il fit élever dans le désert. C’est alors que Dieu, s’accommodant à sa légèreté, se fit immoler des victimes pour vous éloigner du culte des idoles ; et cette précaution même vous a si peu préservés de l’idolâtrie, que vous avez été jusqu’à immoler aux démons vos enfants eux-mêmes. Il a institué le jour du sabbat afin de vous empêcher de perdre le souvenir du vrai Dieu, et, comme le dit l’Écriture, pour que vous rappeliez sans cesse que c’est le Seigneur qui vous a sauvés.</p><p>XX. S’il vous a aussi commandé de vous abstenir de certaines viandes, c’est qu’il voulait que, même pendant vos repas, vous eussiez sa pensée présente à l’esprit, tant vous étiez prompts à l’oublier, ainsi que le dit Moïse : « Le peuple s’est assis pour manger et pour boire, et s’est levé pour danser. » Et ailleurs : « Le peuple bien-aimé, après s’être engraissé, se révolta ; appesanti, rassasié, enivré, il a délaissé le Dieu son créateur. » Moïse, dans le livre de la Genèse, ne nous a-t-il pas raconté que Dieu permit à Noé, cet homme juste, de manger de toute espèce d’animaux, excepté de la chair qui aurait encore son sang, c’est-à-dire suffoquée ? Tryphon se préparait à m’objecter ces paroles : <i>Ainsi que des plantes</i>. Je le prévins : Et pourquoi, lui dis-je, ne pas prendre ces mots, <i>ainsi que des plantes</i>, dans le sens que Dieu y attachait ? C’est-à-dire que, de même qu’il donnait à l’homme toutes les plantes pour en faire sa nourriture, de même il lui donnait tous les animaux pour en manger. Mais, parce qu’il est certaines herbes dont nous nous abstenons, vous croyez que c’est parce que Dieu aurait prescrit à Noé de faire entre elles une distinction. Ce n’est nullement dans ce sens qu’il faut entendre ce passage. Comme il est trop facile de montrer que toute plante est une herbe, et peut être mangée, je n’insiste pas là-dessus. Mais, si nous ne mangeons pas indistinctement de toutes sortes de plantes, sachez que ce n’est point parce qu’il s’en trouve parmi elles d’impures, d’immondes, mais seulement parce qu’elles sont amères ou pleines d’épines et dangereuses. Alors, nous mangeons de préférence celles qui sont douces, saines, agréables, soit qu’elles viennent dans l’eau ou sur la terre.</p><p>Mais quand Dieu vous a ordonné, par Moïse, de vous abstenir de certains animaux impurs, cruels, rapaces, c’était dans un sens tout différent. C’est parce que, tandis que Dieu faisait tomber sur vous la manne dans le désert et multipliait sous vos yeux les miracles, vous aviez élevé un veau d’or pour l’adorer ; aussi la voix de Dieu vous crie sans cesse, et avec raison : « Vous êtes une race insensée, des enfants infidèles. »</p><p>XXI. Oui, c’est pour vous rappeler vos iniquités et celles de vos pères, que Dieu vous a ordonné de célébrer le sabbat et vous a imposé tant d’autres observances ; c’est pour l’instruction des peuples, afin qu’ils ne profanent pas son nom, que Dieu laisse encore subsister quelques-uns d’entre vous, et j’ai pour garant de ce que j’avance ses propres paroles. Écoutez ce qu’il dit par la bouche d’Ézéchiel :</p><p>« Je suis le Seigneur votre Dieu ; marchez dans la voie de mes commandements, gardez mes préceptes. Abstenez-vous des usages profanes de l’Égypte ; sanctifiez mes jours de sabbat, afin qu’ils soient comme des signes entre vous et moi, et que vous sachiez que c’est moi qui suis votre Seigneur et votre Dieu. Mais vous m’avez aigri contre vous, vos enfants n’ont point marché dans la voie de mes préceptes ; ils n’ont ni révéré ni gardé les commandements que je leur ai donnés, afin que celui qui les observe y trouve la vie, et ils ont violé mes jours de sabbat ; je les ai menacés de répandre ma fureur sur eux dans le désert, et de satisfaire ma colère en les punissant, mais j’ai retenu ma main, je les ai épargnés pour la gloire de mon nom, afin qu’il ne fût pas déshonoré devant les nations témoins de leur délivrance. J’ai levé de nouveau ma main sur eux dans la solitude pour les disperser parmi les nations et les répandre sur la terre, parce qu’ils n’avaient pas observé mes commandements, qu’ils avaient violé mes jours de sabbat, et que leurs yeux s’étaient attachés aux idoles de leurs pères. C’est pourquoi je leur ai donné des préceptes qui n’étaient pas bons et des ordonnances où ils ne trouveront pas la vie. Je les souillerai dans leurs offrandes, lorsque je passerai au milieu d’eux pour détruire tous leurs premiers-nés. »</p><p>XXII. Et pour vous convaincre que c’est à cause des prévarications d’Israël et de son idolâtrie que Dieu a exigé de lui des sacrifices, et non parce qu’il avait besoin de ses offrandes, écoutez ce qu’il dit lui-même à ce sujet ; c’est ainsi qu’il fait parler Amos, un de vos douze prophètes :</p><p>« Malheur à vous qui désirez le jour du Seigneur ! De quoi vous servira-t-il ? ce jour sera les ténèbres et non la lumière. Il se présentera à vous comme à cet homme qui évite un lion pour rencontrer un ours ; comme à celui qui, entrant en sa maison, appuie sa main sur la muraille, et un serpent le mord. Le jour du Seigneur ne sera-t-il pas un jour de ténèbres et non de lumière, une sombre nuit sans clarté ? Je hais, je déteste les jours de fête, je ne puis respirer l’encens de vos solennités. Je ne me complais ni dans vos offrandes, ni dans vos holocaustes ; la graisse de vos victimes ne m’est point agréable. Éloignez de moi le tumulte de vos cantiques, je ne puis entendre le concert de vos instruments. Mais que le jugement se répande comme une eau abondante, et que la justice coule comme un torrent rapide. Maison d’Israël, m’avez-vous offert des victimes et des oblations durant les quarante années que vous avez voyagé dans le désert, dit le Seigneur ? Vous avez porté avec vous la statue de Moloch et les figures de vos idoles, l’étoile de votre dieu Rampha, ouvrage de vos mains : c’est pourquoi je vous transporterai hors de Damas, dit le Seigneur, dont le nom est le Dieu tout-puissant. Malheur à vous qui êtes tranquilles en Sion, et qui vous confiez en la montagne de Samarie ; grands, princes de la nation choisie qui avez vendangé les prémices des nations et entrez avec pompe dans les assemblées d’Israël, passez à Chalané et voyez, et de là allez à Émath la grande, et descendez à Geth, le pays des Philistins. Ces contrées valent-elles plus que vos royaumes ? Leurs limites surpassent-elles les vôtres ? Malheur à vous, qui approchez des jours mauvais et qui célébrez des sabbats trompeurs, qui dormez sur des lits d’ivoire et vous étendez mollement sur votre couche, qui mangez les agneaux choisis et les veaux encore au sein de leur mère, qui chantez aux accords de la lyre, et qui les croyez durables et non fugitifs ; qui buvez le vin dans des coupes, qui vous parfumez des plus riches odeurs, et qui demeurez insensibles à la douleur de Joseph ! C’est pourquoi vous irez en captivité, vos chefs marcheront les premiers vers la terre d’exil. Le théâtre de vos plaisirs changera de face, on y entendra le hennissement des chevaux d’Éphraïm. » Dieu dit ailleurs par la bouche du prophète Jérémie : « Ajoutez vos holocaustes à vos victimes et mangez-en la chair. Car, lorsque j’ai tiré vos pères de la terre d’Égypte, je ne leur ai point parlé d’holocaustes et de victimes. » Écoutez encore ce que Dieu dit par la bouche de David, dans le quarante-neuvième psaume : « Le Dieu des dieux a parlé, et il a appelé la terre depuis l’orient jusqu’au couchant. C’est de Sion que Dieu fera briller la splendeur de sa gloire ; Dieu se manifestera, il sortira de son silence ; un feu dévorant marchera devant lui ; il appellera les cieux et la terre pour juger son peuple. Rassemblez autour de moi mes saints, tous ceux qui ont contracté avec moi une alliance scellée par le sacrifice. Et les cieux annonceront la justice, c’est Dieu lui-même qui est le juge. Écoute, mon peuple, et je parlerai ; Israël, je te rendrai témoignage : je suis le Dieu ton Dieu. Je ne t’accuserai point sur tes sacrifices et sur tes holocaustes, ils sont toujours présents à mes yeux. Qu’ai-je à faire des génisses de tes étables et des boucs de tes troupeaux ? Toutes les bêtes des forêts sont à moi, ainsi que tous les animaux qui paissent sur la montagne ; je connais tous les oiseaux du ciel, et les animaux des champs sont en ma puissance. Si j’avais faim, est-ce à toi que je m’adresserais ? L’univers est à moi et tout ce qu’il renferme. Mangerai-je la chair des taureaux ou boirai-je le sang des boucs ? Offrez à Dieu un sacrifice de louange et rendez vos hommages au Très-Haut ; invoquez-moi au jour de la détresse, je vous délivrerai et vous m’honorerez. Mais Dieu a dit au pécheur : Est-ce à toi qu’il appartient de publier mes décrets ? Pourquoi ta bouche annonce-t-elle mon alliance ? Toi, tu hais ma loi, et tu as rejeté derrière toi ma parole ; quand tu voyais un larron, tu courais à lui, et tu allais prendre ta place à côté de l’adultère ; tu as rassasié ta bouche de malice et ta langue a préparé la fraude ; pendant que tu étais assis, tu parlais contre ton frère, tu couvrais d’opprobre le fils de ta mère. Voilà ce que tu as fait et je me suis tû ! Ton iniquité m’a jugé semblable à toi ; je t’accuserai, j’exposerai tes péchés à tes propres yeux. Comprenez maintenant, vous qui oubliez le Seigneur, de peur que je ne vous saisisse ; et personne ne pourra vous délivrer. Le sacrifice de louange est le culte qui m’honore, c’est la seule voie par laquelle je manifesterai le salut du Très-Haut. »</p><p>Ainsi, vous le voyez, si Dieu reçoit de vous des sacrifices, s’il vous commande de lui en offrir, ce n’est pas qu’il en ait besoin, c’est uniquement à cause de vos péchés. Et le temple lui-même, appelé le temple de Jérusalem, pourquoi Dieu a-t-il dit que c’était son palais, sa demeure ? Est-ce qu’il en avait besoin ? Non, assurément. Mais il voulait appeler sans cesse votre attention sur lui, pour vous empêcher de tomber dans l’idolâtrie ; vous en avez une preuve bien sensible dans ces paroles d’Isaïe : « Quelle maison pourriez-vous me bâtir ? dit le Seigneur. Le ciel est mon trône et la terre mon marchepied. »</p><p>XXIII. Si on n’admet pas tout cela, il faut tomber dans les plus étranges absurdités, il faut dire que le Dieu d’aujourd’hui n’est plus celui du temps d’Hénoch, et des autres justes qui n’ont pas connu la circoncision et qui n’observaient ni le sabbat, ni les autres pratiques de cette nature, puisqu’elles ne remontent qu’à Moïse, ou bien qu’il n’a pas voulu que le moyen de salut fût le même dans tous les temps et pour tous les hommes. Qui ne voit combien de pareilles suppositions sont ridicules et insensées ? N’est-il pas plus raisonnable de dire que c’est à cause de vos prévarications que Dieu a prescrit ces diverses ordonnances, qu’il est l’ami de l’homme, qu’il voit l’avenir, qu’il est bon, qu’il est juste ? S’il en est autrement, répondez-moi, mes amis ; dites-le moi, quelle est votre manière de voir sur le sujet qui nous occupe ? Pas un d’eux ne me répondit. Alors je continuai : Eh bien ! Tryphon, je vais exposer pour vous, et pour ceux qui veulent devenir les disciple du Christ, la doctrine toute divine qu’il nous a enseignée. Voyez-vous les éléments se reposer, observer le jour du sabbat ? Restez comme vous êtes nés. On n’avait pas besoin de circoncision avant Abraham, ni de fêtes, ni de sabbat avant Moïse : eh bien ! tout cela est encore moins nécessaire depuis que Jésus-Christ le fils de Dieu, d’après la volonté de son père, est né sans péché d’une vierge issue du sang d’Abraham. Abraham lui-même, lorsqu’il était encore incirconcis, ne fut-il pas justifié et béni uniquement à cause de sa foi et parce qu’il crut à Dieu, ainsi que vous l’apprend l’Écriture ? Il reçut la circoncision seulement comme un signe et non comme un moyen de salut, l’Écriture et les faits nous obligent à le reconnaître.</p><p>C’est donc avec raison qu’il a été dit que chez le peuple juif quiconque n’aura pas été circoncis le huitième jour sera exclu de la nation. Mais les femmes ne peuvent recevoir la circoncision, preuve certaine qu’elle a été donnée uniquement comme signe et non comme moyen de salut ; car Dieu a fait la femme capable d’observer tous les préceptes de justice et de vertu. Nous voyons à la vérité entre elle et l’homme une conformation différente : toutefois nous savons bien qu’ils ne sont ni l’un ni l’autre justes ou injustes à cause de cette différence, mais qu’ils sont également nés pour la justice et la vertu.</p><p>XXIV. Je pourrais encore, mes amis, vous montrer qu’il y a dans ce choix du huitième jour quelque chose de mystérieux, que Dieu veut nous faire entendre par la préférence qu’il lui donne sur le septième ; mais je veux éviter toute digression. Comprenez seulement ce que je répète : Le sang de cette circoncision est aboli ; nous croyons à un sang plus efficace. Une autre alliance, une autre loi est sortie de Sion. Jésus-Christ circoncit tous ceux qui veulent l’être avec des couteaux de pierre, selon ce qui a été prescrit autrefois, mais uniquement pour les préparer à devenir une nation juste, un peuple fidèle qui conserve la vérité, qui maintienne la paix. Venez, ô vous tous qui craignez Dieu et qui désirez voir les merveilles de la céleste Jérusalem. Venez, approchons de la lumière du Seigneur ; il a délivré son peuple, la maison de Jacob. Accourez toutes, ô nations ; rendons-nous tous ensemble à cette Jérusalem, la Jérusalem qui ne se verra plus assiégée pour les péchés de ses enfants : « Je réponds à des peuples qui naguère ne m’interrogeaient pas, nous dit le Seigneur par la bouche d’Isaïe ; des peuples qui ne me cherchaient pas m’ont trouvé. J’ai dit aux nations qui n’invoquaient pas mon nom : Me voici. J’ai tendu les bras pendant tout le jour à un peuple incrédule qui marche dans les ténèbres à la suite de ses péchés. Le peuple qui excite ma colère est devant moi. »</p><p>XXV. Ceux qui se purifient et se disent enfants d’Abraham désireront avoir avec nous quelque part à son héritage, ainsi que l’Esprit saint le dit en leur nom par la bouche d’Isaïe :</p><p>« Regardez, Seigneur, du haut des cieux, du séjour de votre sainteté et de votre gloire : où est votre zèle, votre puissance, où est cette abondance de miséricorde qui nous a soutenus, Seigneur ? Vous êtes notre père ; Abraham ne sait pas qui nous sommes, Israël ne nous connaît pas. Mais vous, Seigneur, vous êtes notre père, sauvez-nous ; votre nom est dès l’éternité Seigneur, pourquoi nous avez-vous laissés errer loin de votre voie ? Vous avez endurci nos cœurs jusqu’à ne plus vous craindre ; tournez sur nous vos regards, à cause de vos serviteurs et des tribus de votre héritage, afin que de la montagne sainte nous recevions une petite part de cet héritage. Nous sommes devenus comme ces peuples sur lesquels vous n’avez pas régné et qui n’ont pas invoqué votre nom. Si vous ouvrez le ciel, à votre aspect, les montagnes seront ébranlées, elles s’écouleront devant vous comme la cire devant un brasier, et les flammes envelopperont vos ennemis ; ils apprendront à connaître votre nom ; les nations trembleront devant vous : quand vous ferez ces prodiges, l’effroi saisira les montagnes. Depuis l’origine des siècles, nous n’avons pas entendu raconter de semblables prodiges ; aucun œil n’a vu, excepté vous, Seigneur, ce que vous préparez dans votre miséricorde à ceux qui font pénitence. Vous viendrez à la rencontre de ceux qui vivent selon la justice ; ils se souviendront de vos voies, ô Seigneur ! Vous étiez irrité contre nous, nous vous avions offensé ; et voila pourquoi nous avons erré ; nous sommes devenus tous comme un homme impur, et nos œuvres comme un linge souillé. Nous sommes tombés ainsi que la feuille, et nos crimes, semblables à un vent violent, nous ont dispersés. Qui vous invoque aujourd’hui, qui se souvient du Seigneur et s’attache à lui ? Personne. Vous nous avez voilé votre face, vous nous avez livrés au glaive à cause de nos péchés. Regardez-nous maintenant, Seigneur, nous sommes tous votre peuple. La ville de votre saint est devenue déserte, Sion est une solitude, Jérusalem est frappée de malédiction. Votre maison, notre sanctuaire et notre gloire, chantée par nos pères, n’est plus qu’un amas de cendres ; toutes les nations triomphent et viennent fondre sur nous. Et vous l’avez souffert, Seigneur, et vous avez gardé le silence et humilié à ce point notre orgueil ! »</p><p>Alors Tryphon s’écria : — Que dites-vous, voulez-vous faire entendre que personne de nous ne sera admis sur la montagne sainte à partager l’héritage du Seigneur ?</p><p>XXVI. — Ce n’est point là, Tryphon, ce que je veux dire. Je parle de ceux qui ont persécuté le Christ et le persécutent encore, sans vouloir faire pénitence ; ceux-là assurément n’auront aucune part à l’héritage sur la montagne sainte, tandis que les gentils qui, touchés de repentir, auront cru en Jésus-Christ, entreront dans l’héritage du Seigneur avec les patriarches, les prophètes et les justes de la race de Jacob, bien qu’ils n’observent ni la circoncision, ni le sabbat, ni vos fêtes.</p><p>C’est Dieu lui-même qui l’annonce en ces termes par le prophète Isaïe : « Moi, le Seigneur, je t’ai appelé dans les décrets de ma justice ; je te prendrai par la main, je te défendrai, je te donnerai pour signe d’alliance à mon peuple et pour lumière aux nations ; tu ouvriras les yeux aux aveugles, tu briseras les fers des captifs, tu délivreras de la servitude ceux qui étaient assis dans les ténèbres. » Et ailleurs : « Levez l’étendard à la face des nations ; le Seigneur s’est fait entendre aux extrémités de la terre. Dites aux filles de Sion : Voici ton Sauveur, sa récompense est avec lui, et ses miracles le précèdent. Ceux qui viendront seront appelés le peuple saint, le peuple racheté du Seigneur ; et toi, ton nom sera la ville bien-aimée, et non plus la ville délaissée. Qui est celui qui vient d’Édom et de Bosra avec des habits teints de sang ; quel est cet homme beau dans sa parure et qui marche avec tant de majesté ? — Je suis le Verbe qui vient avec des paroles de justice et de salut. — Pourquoi votre robe est-elle rouge, et vos vêtements comme les habits de ceux qui foulent la vendange ? — J’étais seul à fouler le vin, aucun homme d’entre les peuples n’est venu à moi, je les ai brisés dans ma fureur, je les ai foulés comme de la poussière, et j’ai répandu leur sang sur la terre. Voici que pour eux est arrivé le jour de la vengeance ; l’année de la rédemption est venue. J’ai regardé, personne autour de moi pour me secourir ; j’ai cherché, je n’ai pas trouvé un appui. Mon bras alors a été mon sauveur et mon indignation m’a secouru ; j’ai écrasé ce peuple dans ma fureur et j’ai dispersé son sang sur la terre. »</p><p>XXVII. Alors Tryphon, prenant la parole : — Pourquoi, me dit-il, ne vous attachez-vous qu’aux passages qui favorisent votre opinion, et ne parlez-vous pas de ceux qui ordonnent expressément de célébrer le sabbat ? Voici ce que dit le Seigneur par le même Isaïe : « Si vous ne voyagez pas le jour du sabbat, si vous oubliez votre volonté dans ce jour qui m’est consacré, si vous appelez le sabbat du Seigneur vos saintes délices, si vous n’allez pas en ce jour à votre travail ordinaire, si aucune parole mauvaise ne sort de votre bouche ; alors vous vous réjouirez dans le Seigneur, il vous fera jouir des biens de la terre, il vous nourrira dans l’héritage même de Jacob votre père. Le Seigneur a parlé. »</p><p>— Mes amis, leur répondis-je, si j’ai omis ce passage du prophète, ce n’est point parce qu’il m’était contraire ; mais j’ai supposé que vous aviez compris et que vous comprenez bien, que si Dieu vous a recommandé de suivre les observances prescrites par Moïse, il n’a cessé en même temps de répéter qu’il ne vous les avait imposées qu’à raison de votre ingratitude et de la dureté de votre cœur, afin que par elles vous pussiez vous ouvrir une voie de pénitence, un moyen de salut qui vous rende agréables à ses yeux, et qu’on ne vous vît plus désormais immoler vos enfants aux démons, prendre part aux larcins, n’aimer que l’argent, n’agir que par cupidité, refuser justice à l’orphelin, protection à la veuve, et vous présenter devant lui les mains pleines de sang. « Car les filles de Sion, dit le Seigneur, marchait la tête haute, en faisant signe des yeux et déployant de longues tuniques. »</p><p>« Tous se sont égarés, dit encore l’Écriture, tous sont devenus inutiles ; il n’est pas un seul qui comprenne, pas un seul ; leur langue s’est déliée pour le mensonge ; leur gosier est un sépulcre ouvert, leurs lèvres recèlent un poison dévorant, les angoisses et la désolation sont dans leurs voies, ils n’ont pas connu le sentier de la paix. »</p><p>Dans le principe, Dieu vous avait prescrit toutes les observances, uniquement à cause de votre perversité. Eh bien ! c’est à raison de votre persévérance dans la même voie, ou plutôt de votre intention d’y persévérer, qu’il se sert encore des mêmes pratiques pour vous obliger à vous souvenir de lui et à le reconnaître. Vous êtes, ainsi qu’il le dit, un peuple au cœur dur et insensé, un peuple aveugle et incertain dans ses voies, des enfants d’incrédulité qui ne l’adorez que des lèvres et dont le cœur est loin de lui, qui enseignez votre doctrine et non la sienne. Et puis, dites-moi, a-t-il voulu rendre prévaricateurs vos pontifes qui offrent des présents le jour du sabbat, et faire tomber dans le péché ceux qui donnent ou reçoivent la circoncision en ce jour, puisqu’il ordonne de circoncire l’enfant au bout de huit jours, quand même le huitième serait un jour de sabbat. Ne pouvait-il pas placer la circoncision le jour qui suit ou qui précède le sabbat, si c’était un crime de la donner ce jour-là ? ou bien pourquoi n’a-t-il pas imposé toutes ces pratiques à ceux qui furent appelés justes avant Moïse et avant Abraham, et qui, sans elles, n’en furent pas moins agréables à ses yeux ?</p><p>XXVIII. — Vous nous l’avez déjà dit, répondit Tryphon, et nous vous avons écouté attentivement ; car, à vrai dire, la chose mérite cette attention. Il ne faut pas, je crois, se contenter de répondre ici avec le vulgaire : c’est que Dieu l’a ainsi voulu ; car c’est toujours là le refuge de ceux qui ne savent que dire quand on leur fait une question.</p><p>— Eh bien ! lui dis-je, si je ne raisonne que d’après les Écritures et les événements, vous ne devez plus rester incertains ni balancer à me croire, bien que je sois incirconcis. Songez-y, très-peu de temps vous est encore laissé pour venir à nous. Si le jour du Christ vous surprend dans votre incrédulité, en vain vos larmes attesteront votre repentir, vous ne serez pas écoutés. « Préparez la terre nouvelle, dit Jérémie, ne semez pas sur des épines, recevez la circoncision du Seigneur, la circoncision du cœur. » Ne semez donc pas parmi les ronces, sur une terre non labourée et qui ne peut donner de fruits. Reconnaissez le Christ, et alors vos cœurs deviendront une terre riche, féconde, heureusement préparée. « Voici que les jours viennent, dit le Seigneur, je visiterai tous ceux qui sont circoncis, l’Égypte, Juda, Édom, les enfants de Moab ; tous ces peuples sont incirconcis de corps, mais c’est le cœur qui est incirconcis dans la maison d’Israël. » Voyez-vous comme Dieu rejette cette circoncision qui n’était qu’une simple marque distinctive ? A-t-elle beaucoup servi aux Égyptiens, aux fils de Moab, à ceux d’Édom ? Mais qu’on soit Scythe ou Persan, pourvu qu’on ait la connaissance de Dieu et de son Christ, pourvu qu’on observe ses commandements éternels, alors on a la vraie circoncision, la seule utile et glorieuse, celle qui rend nos personnes chères à Dieu et nos dons agréables à ses yeux. Souffrez que je vous cite ces autres paroles qu’il adresse à son peuple par la bouche de Malachie, l’un des douze prophètes : « Mon amour n’est point en vous, dit le Seigneur, et je ne reçois pas vos sacrifices ; car, depuis le lever du soleil jusqu’à son coucher, mon nom est grand parmi les nations ; on offre à mon nom en tout lieu un sacrifice, une oblation pure ; parce qu’aujourd’hui mon nom est en honneur chez tous les peuples ; mais vous le déshonorez, s’écrie le Seigneur. » Il dit encore par la bouche de David : « Un peuple que je ne connaissais pas s’est montré fidèle à ma voix, il a entendu ma parole et l’a suivie. »</p><p>XXIX. Que toutes les nations réunies bénissent ensemble le Seigneur qui nous a visité ; glorifions-le par son fils, le roi de gloire, le Dieu des vertus. Il a témoigné son amour aux nations : nos sacrifices lui ont été plus agréables que ceux d’Israël. Qu’ai-je donc besoin de votre circoncision, si j’ai le témoignage de Dieu même ? À quoi bon votre baptême, si j’ai reçu celui de l’Esprit saint ? Il me semble que ce langage est de nature à persuader ceux qui ont le moins d’intelligence ; et ce langage ne vient pas de moi. Ce n’est point ici la parole de l’homme ; l’art ne l’a point arrangée. Voilà ce que chantait David, ce qu’annonçait Isaïe, ce que publiait Zacharie, ce qui fut écrit par Moïse. Le reconnaissez-vous avec moi, Tryphon ? Ces paroles ne sont-elles pas consignées dans vos livres, ou plutôt dans les nôtres ? Car nous nous attachons à l’esprit de ces livres ; et vous, vous les lisez sans les comprendre. Si nous sommes incirconcis, c’est qu’ainsi Dieu nous a faits ; pourquoi nous le reprocher, pourquoi regarder cet état comme un opprobre ? et pour avoir fait tiédir de l’eau un jour de sabbat, a-t-on commis un crime affreux ? Est-ce que Dieu ne gouverne pas le monde ce jour-là comme les autres jours ? Est-ce que les pontifes ne sont pas obligés le jour du sabbat, ainsi que les autres jours de la semaine, de s’occuper du soin des sacrifices ? Encore une fois, cette multitude de justes qui n’avaient observé aucune des pratiques prescrites par la loi n’ont-ils pas été loués par le Seigneur et honorés de son témoignage ?</p><p>XXX. N’attribuez qu’à votre perversité les blasphèmes que se permettent contre Dieu les insensés qui osent dire qu’il n’a pas établi pour tous et en tout temps le même moyen de salut. En effet, toutes vos pratiques ont été jugées absurdes, indignes de Dieu, par des hommes trop peu éclairés pour juger qu’elles pouvaient servir à ramener dans les voies de la pénitence un peuple comme le vôtre, travaillé de je ne sais quelle maladie d’esprit, et pour comprendre que la loi qui ne parut qu’après Moïse était cependant la loi éternelle. Vous la trouvez annoncée dans un des psaumes (le xviii<sup>e</sup>) ; vous y lisez que les préceptes du Seigneur qui donnent la sagesse sont plus doux que le miel le plus délicieux : ce qui le prouve, c’est que nous affronterions la mort plutôt que d’abjurer son saint nom. Nous lui demandons avant toute chose, comme on le sait, d’être préservés des ennemis cachés, c’est-à-dire des esprits pervers et trompeurs, comme le prophète le dit en termes figurés quand il fait parler dans ce psaume ceux qui croient au Christ, et pour échapper aux attaques de ces ennemis du culte de Dieu, je veux dire les mauvais génies que nous adorions autrefois, nous demandons au Seigneur par Jésus-Christ, son fils, qu’il nous conserve purs et sans tache, après nous avoir fait connaître la vérité. Nous appelons le Christ notre soutien, notre Sauveur, lui dont le nom seul fait trembler les démons. Ne voyez-vous pas qu’en effet, au seul nom de Jésus, crucifié sous Ponce-Pilate, les démons sont chassés et vaincus ? Et quelle preuve plus évidente de la puissance qui lui fut donnée par Dieu le père, que de voir son nom et les mérites de sa passion terrasser les puissances de l’enfer ?</p><p>XXXI. Si telle est la force attachée aux mérites de ses souffrances, quelle est donc celle qu’il déploiera lors de son glorieux avénement !</p><p>Il viendra du haut des nuées comme le Fils de l’homme, a dit Daniel, et les anges formeront son cortége. Écoutez les paroles du prophète : « Je regardais jusqu’à ce que les trônes furent placés, et l’ancien des jours s’assit ; son vêtement était blanc comme la neige, et les cheveux de sa tête comme une laine pure, son trône comme la flamme du feu, et ses roues comme un feu ardent, et un fleuve de feu sortait rapidement de sa face, mille millions le servaient, et dix mille millions étaient devant lui. Le jugement s’assit et les livres furent ouverts. Je regardais à cause de la voix des grandes paroles que la corne proférait, et je vis que la bête fut tuée et que son corps fut déchiré et fut livré pour être dévoré par le feu, et que la puissance des autres bêtes leur fut ôtée, et que le temps de la vie leur fut donné jusqu’à un certain jour et un temps marqué. Je regardais donc en la vision de la nuit, et voici comme le Fils de l’homme qui venait sur les nuées du ciel, et il s’avança jusqu’à l’ancien des jours, et on l’offrit en sa présence, et il lui donna la puissance, l’honneur, et l’empire ; et tous les peuples, tribus et langues le servirent. Sa puissance est une puissance éternelle qui ne sera pas transférée, et son règne ne sera point affaibli. Mon esprit fut saisi d’horreur. Moi, Daniel, je fus effrayé de ces choses, et les visions de ma tête me troublèrent. Je m’approchai de l’un des assistants et lui demandai la vérité de toutes ces choses, et il me donna l’interprétation des paroles et m’enseigna : Ces quatre grandes bêtes sont quatre royaumes qui s’élèveront de la terre, et ils recevront le royaume du Seigneur le Dieu très-haut, et obtiendront le royaume jusqu’au siècle et au siècle des siècles. Après je voulus soigneusement m’enquérir de la quatrième bête qui était très-différente des autres et terrible : ses dents et ses ongles étaient de fer, elle mangeait et brisait, et foulait à ses pieds les restes ; et je m’informai des dix cornes qu’elle avait à la tête et, de l’autre, qui s’était élevée, devant laquelle étaient tombées trois cornes ; et de cette corne qui avait des yeux et une bouche qui proférait de grandes choses, et cette bête était plus grande que les autres. Je regardais, et voici que cette corne faisait la guerre aux saints et prévalait sur eux, jusqu’à ce que l’ancien des jours fût venu et qu’il eût donné son jugement aux saints du Très-Haut. Et le temps vint et les saints obtinrent le royaume, et il dit ainsi : La quatrième bête sera le quatrième royaume, lequel sera plus grand que tous les royaumes et dévorera toute la terre, et la foulera et la brisera. Mais les dix cornes de ce royaume seront les dix rois, et un autre s’élèvera après eux qui sera plus puissant que les premiers, et il humiliera trois rois. Et il parlera orgueilleusement contre le Très-Haut et il brisera ses saints ; et il croira qu’il peut changer les temps et les lois, et les hommes seront livrés en sa main jusqu’à un temps et des temps et la moitié d’un temps ; et le jugement interviendra, afin que la puissance lui soit ôtée et qu’il soit brisé, qu’il soit déchiré jusqu’à la fin, et que le règne et la puissance, et la grandeur du royaume qui est sous le ciel, soient donnés au peuple des saints du Très-Haut dont le peuple est éternel, et tous les rois le serviront et lui obéiront. Ici est la fin de la parole. Moi, Daniel, j’étais fort troublé par mes pensées, et mon visage changea, et je gardais la parole en mon cœur. »</p><p>XXXII. Je m’arrêtai. Alors Tryphon me dit : — Ces passages et d’autres semblables nous forcent de reconnaître qu’un Messie doit venir plein de gloire et de puissance, et qu’il recevra des mains de l’ancien des jours le royaume éternel, en sa qualité de Fils de l’homme ; mais votre Christ, celui que vous appelez de ce nom, a été sans gloire, méprisé, au point d’encourir la dernière des malédictions portée par la loi : il a été mis en croix.</p><p>Je lui répondis : — Si les oracles que j’ai cités n’annonçaient pas qu’il sera sans beauté, qu’on ne pourra raconter sa génération, que les riches mourront à cause de sa mort, que nous serons guéris par ses meurtrissures, qu’il sera conduit à la mort comme un agneau ; si je ne vous avais pas exposé ses deux avénements, l’un où il sera percé par vous, l’autre où vous reconnaîtrez celui que vous avez percé, où toutes vos tribus se lamenteront et mêleront leurs gémissements, où les hommes et les femmes dans leur effroi fuiront de divers côtés, mes paroles pourraient vous paraître obscures et insignifiantes. Aussi, dans toute cette discussion, je ne veux raisonner que d’après les livres que vous regardez comme saints et prophétiques, espérant que le principe de vie confié à ces livres par la grâce du Dieu tout-puissant, pour amener les hommes au salut éternel, opérera la conversion de quelques-uns d’entre vous.</p><p>Et afin de répandre encore plus de clarté sur l’objet de la discussion, je citerai d’autres oracles, ceux du roi David, où vous verrez que l’Esprit saint donne au Christ le nom de Seigneur, qu’il a été rappelé de la terre au ciel par son père, le maître de toutes choses, et placé par lui à sa droite jusqu’à ce qu’il ait réduit ses ennemis à lui servir de marchepied ; et n’est-ce pas là ce qui s’accomplit depuis que le Christ est ressuscité d’entre les morts et monté aux cieux ? Le temps court à sa fin ; il apparaît, il est déjà à la porte celui qui doit vomir tant de blasphèmes contre le Très-Haut et régner selon Daniel un temps, puis des temps, et de plus un demi-temps. Comme vous ignorez la durée de son règne, vous vous figurez tout autre chose. Par le mot <i>temps</i>, vous entendes une durée de cent années, et d’après votre calcul, il faudrait que l’homme d’iniquité régnât au moins trois cent cinquante ans, en comptant pour deux siècles le pluriel <i>tempora</i> employé par le prophète. Ce n’est pas sans dessein que je me suis permis cette digression ; j’ai voulu qu’une fois convaincus que vous n’êtes que des enfants sans intelligence, comme le dit le Seigneur, et bien persuadés de la vérité de ces autres paroles : « Je ferai un prodige pour remuer ce peuple, je détruirai la sagesse des sages ; j’obscurcirai l’intelligence de ceux qui se croient habiles, » vous cessiez enfin de vous tromper vous-mêmes et ceux qui vous écoutent, pour ne plus suivre d’autres maîtres que ceux à qui la grâce de Jésus-Christ a communiqué la véritable sagesse. Or, voici les paroles de David :</p><p>« Le Seigneur a dit à mon Seigneur : Asseyez-vous à ma droite, jusqu’à ce que je réduise vos ennemis à me servir de marchepied. L’Éternel va faire sortir de Sion le sceptre de votre autorité ; vous établirez votre empire au milieu de vos ennemis, les peuples vous obéiront au jour de votre force ; au milieu de la splendeur de vos saints, je vous ai engendré avant l’aurore. L’Éternel l’a juré, il ne révoquera jamais son serment ; vous êtes le prêtre éternel selon l’ordre de Melchisédech. Le Seigneur est assis à votre droite, il écrasera les rois au jour de sa colère. Il jugera les nations, il multipliera la mort, il brisera la tête de celui qui a dominé la terre, il boira en passant l’eau du torrent : c’est pourquoi il lèvera la tête. »</p><p>XXXIII. Je sais que vous osez dire qu’il ne s’agit ici que du roi Ézéchias ; mais les paroles mêmes du texte vont vous prouver combien vous êtes dans l’erreur. Il est dit : « L’Éternel l’a juré, il ne révoquera jamais son serment ; » et puis : « Vous êtes le prêtre éternel selon l’ordre de Melchisédech. » Rappelez-vous encore ce qui suit et ce qui précède. Oserez-vous dire qu’Ézéchias ait été prêtre et prêtre éternel ? Ne voyez-vous pas que ces paroles n’ont de sens qu’autant qu’elles s’appliquent à notre Jésus ? Mais vos oreilles sont fermées, et vos cœurs aveuglés. C’est à cause de votre incrédulité que le Seigneur a recours au serment, lorsqu’il déclare que le Christ est le pontife selon l’ordre de Melchisédech ; voici le sens de ses paroles : De même que Melchisédech, appelé prêtre du très-haut par Moïse, fut le prêtre des incirconcis, et bénit Abraham qui avait reçu la circoncision et lui offrit la dîme, de même Dieu déclare que son prêtre éternel, appelé Seigneur par l’Esprit saint, sera le prêtre des incirconcis, et qu’il se plaira à recevoir et à bénir ceux des circoncis qui viendront à lui, c’est-à-dire qui croiront à sa parole et demanderont sa bénédiction. La fin du psaume vous annonce que d’abord il sera pauvre et humilié, puis élevé en gloire ; car voyez ce rapprochement : « Il boira en chemin de l’eau du torrent, et c’est pour cela qu’il lèvera la tête. »</p><p>XXXIV. Mais je veux vous prouver que vous n’entendez en aucune manière les divines Écritures. L’Esprit saint a dicté au roi-prophète un autre psaume, qui ne peut encore s’entendre que du Christ, et dont vous voulez faire l’application à Salomon qui fut aussi un de vos rois. Il suffit de l’équivoque d’un mot pour vous faire illusion. Parce qu’on y lit celui-ci : « La loi pure du Seigneur, » à l’instant vous croyez qu’il s’agit non de la loi donnée après Moïse, mais de la loi publiée par le ministère de ce législateur, bien que dans ce psaume Dieu vous déclare qu’il donnera une loi nouvelle, un testament nouveau. Et parce que vous lisez ensuite ces mots : <i>Donnez votre jugement au roi</i>, comme en effet Salomon fut roi, vous voulez que ce psaume le concerne, lors même que les paroles font entendre si clairement qu’il s’agit d’un roi dont le règne sera éternel, ce qui ne peut s’entendre que du Christ. Car le Christ est ici annoncé avec tous les traits qui le caractérisent, c’est-à-dire et comme roi, et comme prêtre, et comme Dieu, Seigneur, ange, homme, chef d’armée, comme pierre angulaire, comme enfant qui naît, comme homme de douleurs, puis retournant au ciel, venant ensuite avec gloire, et possédant l’empire éternel, ainsi que je vous le prouve d’après toutes les Écritures. Mais pour mieux me faire comprendre, je vais vous citer le psaume tout entier :</p><p>« Seigneur, donnez au roi votre jugement, et au fils du roi votre justice. Il jugera votre peuple dans la justice et vos pauvres dans l’équité. Les montagnes produiront la paix au peuple, et les collines la justice ; il jugera les pauvres d’entre le peuple, il sauvera les fils du pauvre, il brisera l’oppresseur. Il sera craint autant que dureront le soleil et la lune pendant le cours des générations ; il descendra comme la pluie sur l’herbe nouvellement coupée, comme les gouttes de la rosée sur la terre. La justice se lèvera en ces jours, et l’abondance et la paix ; et leur durée égalera celle des astres dans le ciel ; il dominera de la mer jusqu’à la mer, des fleuves jusqu’aux extrémités de la terre ; les habitants du désert se prosterneront devant lui, et ses ennemis baiseront la poussière de ses pieds. Les rois de Tarse et les îles lointaines lui apporteront des présents, les princes de l’Arabie et de Saba lui apporteront des offrandes, tous les rois de la terre l’adoreront, et les nations lui seront assujetties, parce qu’il arrachera le pauvre des mains du puissant, le pauvre qui n’avait point d’appui ; il sera bon au pauvre et à l’indigent, il sauvera les âmes des pauvres. Il les délivrera de l’usure et des violences, leur sang sera précieux devant lui. Il vivra, et l’or de l’Arabie lui sera donné. Il sera l’objet de tous les vœux, on le bénira à jamais. Il sera affermi sur la terre, il s’élèvera sur le haut des montagnes ; et les fruits croîtront, ils se multiplieront au sein des villes comme l’herbe de la prairie. Son nom sera béni dans tous les siècles, son nom durera autant que le soleil ; toutes les nations de la terre seront bénies en lui, toutes les nations le glorifieront. Béni soit le Seigneur, le Dieu d’Israël, qui seul opére les merveilles ! Béni soit à jamais le nom de sa gloire ; toute la terre sera remplie de sa majesté ! Qu’il soit ainsi, qu’il soit ainsi. »</p><p>À la fin de ce psaume, on lit ces paroles : « Ici finissent les hymnes de David, fils de Jessé. » Je conviens avec vous que Salomon fut un grand roi, qu’il a jeté un grand éclat, que sous lui fut bâti ce superbe édifice que vous appelez le temple de Jérusalem. Mais il est évident qu’on ne peut lui appliquer aucune des paroles de ce psaume. Tout l’univers l’a-t-il adoré ? A-t-il étendu son empire jusqu’aux extrémités de la terre ? Tous ses ennemis se sont-ils prosternés devant lui ? Les rois sont-ils venus baiser la poussière de ses pieds ? Permettez-moi de rapporter ce qu’il est dit de lui dans le livre des Rois. N’y lisez-vous pas que, pour plaire à une femme qu’il aimait, il adora les dieux de Sidon ? Et voilà ce qu’on ne verra jamais faire à ceux des gentils auxquels Jésus-Christ a fait connaître le Dieu créateur de l’univers : ils endureraient plutôt toutes les tortures, tous les supplices et jusqu’à la mort la plus cruelle, que de fléchir le genou devant les faux dieux, que de manger seulement des viandes offertes aux idoles.</p><p>XXXV. — Cependant, reprit Tryphon, j’entends dire que plusieurs de ceux qui confessent le Christ, et qu’on appelle Chrétiens, mangent de ces viandes et prétendent ne contracter aucune souillure.</p><p>Je lui répondis : — Ce sont des hommes qui, tout en se disant Chrétiens, tout en confessant que Jésus crucifié est le Seigneur et le Christ, ne suivent point sa doctrine, mais celle des esprits de ténèbres ; et par là même qu’il existe des hommes de ce caractère, nous ses disciples attachés à la doctrine véritable et pure, nous n’en sommes que plus fermes, plus inébranlables dans la foi qu’il nous a enseignée. Car nous voyons de nos propres yeux se réaliser ce qu’il avait lui-même prédit : « Plusieurs viendront en mon nom couverts de peaux de brebis, mais au dedans ce sont des loups ravissants. » Ailleurs il est dit : « Qu’il y aurait des schismes et des hérésies. » Dans un autre endroit vous lisez encore ces paroles : « Gardez-vous des faux prophètes qui viendront à vous couverts d’une peau de brebis, loups ravissants au dedans ; » et enfin : « On verra s’élever plusieurs antechrists, plusieurs faux prophètes qui séduiront un grand nombre de fidèles. » Il y a eu et il existe encore, mes amis, beaucoup de ces hommes qui, sous le nom de Jésus, enseignent les plus monstrueuses impiétés : nous les désignons par le nom des sectes et des hérésies dont ils ont été les auteurs, car chacun d’eux enseigne à sa manière ses affreux blasphèmes contre le Dieu créateur de toutes choses, contre le Christ, dont ce Dieu avait annoncé la venue, contre le Dieu d’Abraham, d’Isaac et de Jacob. Nous ne communiquons point avec ces hommes ; nous les savons injustes, impies, athées, sans loi ; ils n’adorent point le Christ, ils ne le confessent qu’en paroles ; ils ressemblent aux gentils, qui impriment le nom de Dieu sur les ouvrages de leurs mains ; ils se parent du nom du Christ, et ils participent à des sacrifices impies, abominables. Les uns s’appellent marcionites, les autres valentiniens, ceux-ci basilidiens, ceux-là satorniliens. Tous portent le nom du chef de leur secte, comme ceux qui veulent, ainsi que je l’ai dit plus haut, s’attacher à une école de philosophie, se plaisent à prendre le nom de l’auteur du système qu’ils embrassent.</p><p>Nous sommes certains que Jésus-Christ voyait dans l’avenir ce qui arriverait après lui ; témoins les paroles que nous avons citées, et ses prédictions sur le sort réservé à ceux qui croient en lui et confessent son nom ; car il nous avait annoncé tout ce que nous avons à souffrir aujourd’hui de la part de nos proches, qui nous font une guerre à outrance et nous mettent à mort, de sorte qu’on ne peut le trouver en défaut sur rien de ce qu’il a dit ou fait. Voilà pourquoi nous prions pour vous et pour tous ceux qui nous haïssent : nous demandons que touchés de repentir, à notre exemple, vous rentriez en vous-mêmes, vous cessiez vos blasphèmes contre Jésus-Christ, que sa doctrine, les oracles qui l’ont annoncé, les œuvres, et les prodiges qui s’opèrent en son nom vous montrent si pur et si saint ; et que devenus ses disciples, vous obteniez le salut au jour de son second avénement, lorsqu’il apparaîtra dans toute sa gloire, au lieu d’entendre de sa bouche la sentence qui vous condamnerait à un feu éternel.</p><p>XXXVI. — Eh bien ! dit Tryphon, supposons les choses comme vous le dites : j’admets que le Christ soit la pierre angulaire ; je vous accorde que les oracles aient annoncé qu’il devait souffrir, mais qu’après son premier avénement il reparaîtrait environné de gloire, qu’il jugerait tous les hommes, qu’il serait le roi, le prêtre éternel ; mais prouvez-moi que votre Jésus est bien le Christ que les prophètes ont ainsi annoncé.</p><p>— Volontiers, lui dis-je ; j’arriverai en temps et lieu aux preuves que vous me demandez. Mais, dans ce moment, permettez-moi de nouvelles réflexions sur les prophéties qui nous apprennent que le Christ a été appelé Seigneur et Dieu des vertus, Dieu de Jacob ; et que vos docteurs sont des insensés, pour me servir de l’expression de l’Écriture, lorsqu’ils prétendent que toutes ces paroles doivent s’entendre, non du Christ, mais de Salomon, parce que celui-ci fit transporter l’arche d’alliance dans le temple qu’il avait élevé. Le psaume que je vais citer est de David : « La terre et tout ce qu’elle renferme est au Seigneur, l’univers et tout ce qui l’habite est à lui ; c’est lui qui l’a affermi au milieu des mers et qui l’a élevé au-dessus des fleuves. Qui montera sur les montagnes du Seigneur ? qui s’arrêtera dans son sanctuaire ? Celui qui a les mains innocentes et le cœur pur, qui n’a pas reçu son âme en vain, qui n’a jamais été parjure ; celui-là recevra la bénédiction du Seigneur, et obtiendra la miséricorde de Dieu son Sauveur. Telle est la race de ceux qui cherchent le Seigneur, qui cherchent votre présence, Dieu de Jacob. Ouvrez-vous, ô portes ! ouvrez-vous, portes éternelles, et le roi de gloire entrera. Quel est-il ce roi de gloire ? C’est le Seigneur, le fort, le puissant dans les combats. Ouvrez-vous ? portes, ouvrez-vous, portes éternelles, et le roi de gloire entrera. Quel est-il ce roi de gloire ? C’est le Seigneur, le Dieu des vertus : c’est lui qui est le roi de gloire. »</p><p>Je vous ai déjà montré que Salomon n’était pas le Seigneur des vertus. Ce psaume ne peut s’entendre que de notre Christ, qui remonta vers les cieux après sa résurrection. Alors Dieu commanda aux princes de la milice céleste rangés par ordre d’ouvrir les portes du ciel, afin que le roi de gloire y fît son entrée, et que s’élevant jusqu’au trône de son père, il vînt s’asseoir à sa droite, jusqu’à ce qu’il ait réduit ses ennemis à lui servir de marchepied, ainsi que nous l’avons dit ailleurs. Mais les puissances du ciel, ne le reconnaissant pas dans l’état pauvre, humble, abject où elles le voient, demandent et s’écrient : « Quel est donc ce roi de gloire ? » Alors l’Esprit saint leur répond au nom de Dieu le père et en son propre nom : « Le Seigneur, le Dieu des vertus, c’est lui qui est le roi de gloire. » De tous ceux qui se trouvaient à la porte du temple qui osa faire l’application de ces paroles, <i>quel est ce roi de gloire</i>, soit à l’arche d’alliance, soit à Salomon, dont le règne fut d’ailleurs si glorieux ? Personne, vous en conviendrez avec moi.</p><p>XXXVII. Les transports d’allégresse qu’exprime le psaume quarante-sixième se rapportent encore au Christ : « Dieu s’élève au bruit des acclamations, le Seigneur s’élève au son de la trompette. Chantez notre Dieu, chantez, célébrez notre roi ; célébrez-le, parce que Dieu est le roi de la terre ; chantez, comprenez ses merveilles. Dieu règne sur les nations, il est assis sur le trône de sa sainteté. Les princes des peuples se sont unis au Dieu d’Abraham, parce que les forts, suivant Dieu, sont grandement élevés sur la terre. »</p><p>Dans le psaume quatre-vingt-dix-huitième, l’Esprit saint, parmi les reproches qu’il vous adresse, déclare que celui que vous refusez de reconnaître pour roi est bien le roi, le Seigneur de Samuel, d’Aaron et de Moïse, et de tous les patriarches. Voici les paroles de ce psaume : « Jéhovah a régné, que les peuples tremblent ! Il est assis sur les chérubins ; que la terre soit émue ! Jéhovah est grand en Sion, il est élevé au-dessus de tous les peuples ; que tous confessent son nom, son nom grand, saint et terrible. La force du roi chérit la justice ; c’est vous qui en avez établi les lois ; vous avez rendu vos jugements et la justice au milieu de Jacob. Célébrez le Seigneur notre Dieu, prosternez-vous devant son marchepied, car il est le saint. Moïse et Aaron ont été ses ministres. Samuel est de ceux qui invoquent son nom. Ils invoquaient le Seigneur, dit l’Écriture, et il les exauçait, et du milieu d’une colonne de nuages il parlait avec eux, parce qu’ils gardaient ses oracles et observaient les lois qu’il leur avait données. Jéhovah notre Dieu, tu les exauçais : tu fus propice à leurs prières et tu vengeas les outrages dont on les accablait. Exaltez Jéhovah notre Dieu prosternez-vous devant sa sainte montagne ; il est le saint, Jéhovah notre Dieu. »</p><p>XXXVIII. — Nous ferions bien, dit alors Tryphon, d’obéir à nos docteurs, qui nous défendent expressément tout rapport avec vous, pour n’être pas exposés à entendre un pareil langage ; car vous proférez là bien des impiétés, quand vous voulez nous persuader que votre crucifié conversa avec Moïse et Aaron, qu’il leur parla du sein de la colonne de nuées, qu’ensuite il s’est fait homme, qu’il a été mis en croix, qui est monté au ciel, qu’il paraîtra de nouveau sur la terre, qu’enfin il faut l’adorer.</p><p>— Je sais, lui répondis-je, et les divines Écritures me l’apprennent, que ce grand mystère de la sagesse du Dieu tout-puissant et créateur de tous les êtres vous est encore caché ; aussi je vous plains du fond de mon cœur, et pénétré pour vous de la plus vive compassion, je tâche autant qu’il est en moi de faire entrer dans votre esprit ces vérités qui, je le sais, heurtent de front toutes vos idées. Je fais en sorte d’être au moins trouvé sans reproche au jour du jugement. Mais vous entendrez bien d’autres choses encore plus contraires à vos préjugés. Loin de vous en irriter, prêtez-moi une oreille plus attentive ; interrogez-moi avec plus d’empressement. Laissez là l’enseignement de vos maîtres ; c’est à eux que le Saint-Esprit fait le reproche de ne pouvoir comprendre la doctrine de Dieu et de vouloir avant tout enseigner la leur.</p><p>Voici ce qui est encore dit du Christ dans le psaume quarante-quatrième : « Mon cœur ne contient plus l’heureuse parole, c’est au roi que j’adresse mes cantiques, ma langue obéit comme la plume à l’écrivain rapide ; vous surpassez en beauté les plus beaux des enfants des hommes ; la grâce est répandue sur vos lèvres, parce que le Seigneur vous a béni pour l’éternité. Armez-vous de votre glaive, ô le plus puissant des rois ; revêtez-vous de votre éclat et de votre gloire, et dans votre majesté marchez à la victoire ; montez sur le char de la vérité, de la clémence et de la justice, et votre droite se signalera par des merveilles ; les flèches sont brûlantes ; les peuples tomberont à vos pieds, elles perceront au cœur les ennemis de mon roi. Votre trône, ô Dieu, est un trône éternel ; le sceptre de l’équité est le sceptre de votre empire ; vous aimez la justice et vous haïssez l’iniquité ; c’est pourquoi, ô Dieu, votre Dieu vous a sacré d’une onction de joie, au-dessus de tous ceux qui doivent y participer. La myrrhe, l’ambre et le sandal s’exhalent de vos vêtements et des palais d’ivoire qui font vos délices ; les filles des rois font votre gloire. La reine, votre épouse, est restée debout à votre droite revêtue de l’or d’Ophir ; écoutez, ô ma fille, voyez et prêtez une oreille attentive, et oubliez votre peuple et la maison de votre père, et le roi sera épris de votre beauté ; c’est lui qui est votre Dieu, prosternez-vous devant lui, les filles de Tyr viendront vous offrir des présents et les grands de la terre imploreront vos regards ; toute la gloire de la fille du roi vient de son cœur ; ses vêtements sont resplendissants d’or et de broderie ; à sa suite paraîtront une multitude de vierges ; ô roi, les compagnes de la vierge vous seront présentées. On les amènera avec joie, avec allégresse ; on les introduira dans le palais du roi. À la place de vos pères, il vous est né des enfants : vous les établirez princes sur toute la terre ; ils perpétueront le souvenir de votre nom, et les peuples vous glorifieront dans les siècles et dans l’éternité. »</p><p>XXXIX. Il n’est pas étonnant, continuai-je, que vous poursuiviez de votre haine des hommes qui comprennent le sens de ces paroles et qui réfutent si victorieusement celui que veulent y attacher vos cœurs endurcis. Élie, parlant au Seigneur, disait de vous : « Seigneur, ils ont mis à mort vos prophètes et renversé vos autels ; je suis resté seul, et ils me cherchent pour m’ôter la vie. » Et Dieu lui répondit : « Il me reste encore sept mille hommes qui n’ont pas fléchi le genou devant Baal. » C’est en leur faveur, comme vous le voyez, que Dieu, à cette époque, ne fit point éclater sa colère. Eh bien ! s’il a retenu et s’il retient encore aujourd’hui les coups de sa justice, c’est qu’il sait que tous les jours quelques-uns des vôtres peuvent sortir des voies de l’erreur et embrasser la doctrine de Jésus-Christ. Après les avoir éclairés par son fils, il répand sur eux ses dons selon qu’il les en juge dignes. L’un reçoit le don de sagesse, l’autre d’intelligence ; celui-là l’esprit de force, celui-ci la vertu de guérir, cet autre la connaissance de l’avenir ; les uns ont la science, les autres la crainte de Dieu !</p><p>— Mais savez-vous bien, s’écria Tryphon, que vous perdez la raison, que vous êtes frappé de folie ?</p><p>— Non, mon ami, lui répondis-je, je ne suis pas dans le délire, je ne déraisonne pas. Écoutez-moi : n’a-t-il pas été prédit que le Christ, lorsqu’il serait monté au ciel, nous emmènerait à sa suite, loin des voies de l’erreur, et répandrait sur nous ses dons ? D’ailleurs, voici les paroles mêmes de la prophétie : « Il est monté au plus haut des cieux, traînant après lui de nombreux captifs ; et ses dons, il les a répandus sur les hommes. » C’est à la faveur de ces dons répandus sur nous par le Christ, après son retour vers les cieux, que nous pouvons vous prouver, les prophéties à la main, que vous qui êtes sages à vos yeux et qui ne croyez qu’à votre prudence, vous êtes seuls dans le délire ; que c’est des lèvres seulement que vous honorez Dieu et son Christ ; pour nous qui sommes en possession de toute la vérité, c’est par nos œuvres que nous l’honorons ; c’est de cœur, c’est d’esprit, c’est par le sacrifice même de notre vie, s’il le fallait. Qui vous empêche donc de reconnaître que Jésus est bien le Messie, le Christ promis, ainsi que vous pouvez vous en convaincre et par les divines Écritures que vous avez entre les mains, et par les événements qui s’accomplissent sous vos yeux, et par les prodiges qui s’opèrent en son nom ? Peut-être craignez-vous les persécutions des princes qui, poussés par l’esprit mauvais, l’esprit de ténèbres ou le serpent, mettent à mort ceux qui confessent le nom de Jésus-Christ et ne cesseront de les poursuivre jusqu’à ce qu’il apparaisse de nouveau, qu’il détruise tous ses ennemis et qu’il rende à chacun selon ses œuvres.</p><p>— Non, dit Tryphon, nous n’avons pas cette crainte ; nous voulons seulement des preuves qui nous convainquent que celui qui, selon vous, fut crucifié et s’éleva vers le ciel, est bien le Christ de Dieu. Je vous accorde que les Écritures nous annoncent la venue d’un Messie qui doit souffrir, reparaître environné de gloire, recevoir de son père un empire éternel sur toutes les nations, s’assujettir tous les peuples ; vous nous l’avez assez prouvé par tous les passages des livres saints que vous nous avez cités. Montrez-nous enfin que votre Jésus est bien ce Christ promis.</p><p>— Pour ceux qui veulent comprendre, lui dis-je, la chose est déjà prouvée par vos concessions mêmes ; ne nous croyez pas embarrassés et dans l’impuissance de vous donner les preuves directes que vous demandez. Je vous les donnerai quand il sera temps, ainsi que je vous l’ai promis. Pour le moment, je reprends la suite de mes idées.</p><p>XL. Le mystère de l’agneau que Dieu ordonna d’immoler à la solennité de Pâques était la figure du Christ. À raison de leur foi, ceux qui croient en lui teignent de son sang leurs maisons, c’est-à-dire eux-mêmes. Car cette figure d’argile, je veux dire ce corps d’Adam, que Dieu façonna, est la demeure de l’âme que le souffle de Dieu y fit descendre, ainsi que vous le comprenez sans peine. La loi qui ordonnait de sacrifier un agneau n’avait été donnée que pour un temps, et voilà comme je le prouve. Dieu ne permit pas que l’agneau paschal fût immolé ailleurs que dans l’endroit où son nom est invoqué. Cependant il savait bien qu’après la mort du Christ, Jérusalem serait livrée à ses ennemis et qu’avec elle finiraient les sacrifices ; mais cet agneau que la loi ordonne de brûler tout entier, n’était-il pas la figure du sacrifice de la croix, que le Christ devait souffrir ? Voyez, en effet, la disposition de ses membres quand on le brûle, n’offre-t-elle pas la figure d’une croix ? une broche le traverse verticalement de la tête aux pieds, tandis qu’une autre broche croise la première en traversant les épaules de l’agneau, et porte attachées sur elle, si je puis parler ainsi, les mains de la victime.</p><p>Et ces deux boucs, entièrement pareils, que la loi ordonne d’offrir les jours de jeûne, dont l’un était envoyé dans le désert et l’autre immolé, ne représentent-ils pas les deux avénements de Jésus-Christ ? le premier, lorsque les anciens du peuple et les prêtres traitèrent Jésus-Christ comme on traitait le bouc émissaire, car ils l’ont traîné hors de la ville, ils ont porté sur lui leurs mains, ils l’ont dévoué à la mort ; le second, lorsque vous reconnaîtrez, dans le lieu même de Jérusalem, ce Jésus que vous avez accablé d’outrages, et qui était la victime de propitiation pour tous ceux qui veulent faire pénitence, et qui observent le jeûne dont parle Isaïe ; ce jeûne, tout spirituel, qui consiste à déchirer les contrats, les obligations usuraires et tyranniques, et à pratiquer fidèlement tous les devoirs que parcourt le prophète et que j’ai rappelés d’après lui, devoirs que ne manquent pas d’observer ceux qui croient en Jésus-Christ. Vous savez aussi que ce sacrifice de deux boucs, que la loi prescrivait d’offrir les jours de jeûne, devait se faire à Jérusalem et non ailleurs.</p><p>XLI. Que dirai-je encore ? L’offrande prescrite d’une mesure de farine, pour la guérison de la lèpre, ne figurait-elle pas le pain eucharistique que Jésus-Christ ordonne d’offrir en mémoire de la passion qu’il a soufferte pour nous guérir de tous nos péchés, et rendre grâce à Dieu d’avoir créé en faveur de l’homme et le monde et tout ce qu’il renferme, de nous avoir affranchis de l’iniquité dans laquelle nous étions plongés, enfin d’avoir brisé, anéanti, la puissance de l’enfer, par le bras de celui qui voulut bien pour nous souffrir la mort ?</p><p>Aussi vous savez comme Dieu lui-même parle des sacrifices que vous lui offriez autrefois. Je répète les paroles du prophète Malachie que j’ai déjà citées : « Mon amour n’est pas en vous, dit le Seigneur, et je ne recevrai plus de présents de votre main ; car, depuis le lever du soleil jusqu’à son coucher, mon nom est grand parmi les nations, voilà qu’on sacrifie en tous lieux et une oblation pure est offerte à mon nom, parce que mon nom est grand parmi les nations, dit le Seigneur. Mais vous, vous l’avez profané. » Ici le prophète annonce déjà le sacrifice que nous autres gentils nous offrons sur tous les points de la terre, je veux dire le pain et le calice eucharistiques ; et il ajoute que par nous son nom est glorifié, tandis que vous le profanez. Remarquez encore ce que la loi prescrivait au sujet de la circoncision : elle voulait qu’elle fût donnée le huitième jour, et figurait par là la véritable circoncision qui nous délivre du péché et de l’erreur, par notre Seigneur Jésus-Christ, ressuscité le lendemain du sabbat. Or, le jour d’après le sabbat, qui se trouve le premier dans l’ordre des jours dont se compose le cercle de la semaine, en est aussi appelé le huitième, sans cesser d’en être le premier.</p><p>XLII. Que dirons-nous des douze sonnettes attachées à la robe du grand-prêtre ? Ne pourrait-on pas dire qu’elles représentaient les douze apôtres que la vertu de Jésus-Christ, le pontife éternel, avait attachés à sa personne, et dont la voix a rempli le monde entier et de la gloire de Dieu et de la grâce de son Christ ? ce qui faisait dire à David : « Leur voix a retenti par toute la terre, et leurs paroles se sont fait entendre jusqu’aux extrémités du monde. » Isaïe, parlant au nom des apôtres que les hommes avaient cru, non à leurs paroles, mais à la puissance de celui qui les avait envoyés, s’exprime en ces termes : « Seigneur, qui a cru à nos paroles, à qui la force de Dieu s’est-elle révélée ? Nous avons prêché devant lui, et nous avons été comme un jeune enfant ou plutôt comme une faible plante dans une terre aride. » Ces paroles et celles qui suivent font partie de la prophétie que nous avons déjà citée. Mais remarquez ce passage. L’Écriture parle d’abord au nom de plusieurs : « Nous avons annoncé en sa présence. » Puis elle ajoute au singulier : « Comme un jeune enfant. » Elle nous fait voir d’avance ce qui s’est réalisé depuis. Des hommes difficiles et durs sont devenus tout à coup humbles, soumis, dociles à ses ordres, et cette docilité ne faisait plus de tous qu’un enfant. Ainsi, dans le corps humain, vous distinguez plusieurs membres qui tous réunis ne forment qu’un seul corps et n’ont pas d’autre nom. Et ce que je dis du corps de l’homme on peut le dire d’un peuple, d’une assemblée. C’est une agrégation de plusieurs personnes désignées par un nom générique, comme ne formant plus qu’une seule et même chose.</p><p>Je pourrais ainsi, mes amis, parcourir toutes les pratiques instituées par Moïse, et vous montrer qu’elles n’ont été que des signes, des figures, des prophéties de ce qui devait arriver au Christ et à ceux qui croiraient en lui, et qui étaient connus d’avance, ou des œuvres que le Christ devait lui-même opérer. Mais je crois en avoir dit assez pour vous convaincre de cette vérité. Je reprends la suite de mon discours.</p><p>XLIII. Comme la circoncision avait commencé à Abraham, le sabbat, les sacrifices, les offrandes, les fêtes à Moïse, n’étaient établis qu’à raison de la dureté de votre cœur, ainsi que nous l’avons démontré ; elles devaient finir à la venue de celui qui, d’après la volonté de Dieu le père, est né d’une vierge de la race d’Abraham, de la tribu de Juda et du sang de David ; je veux dire à la venue du Christ, le fils de Dieu, annoncé au monde entier comme la loi nouvelle, le testament nouveau qui doit paraître un jour, ainsi que le prouvent les différents oracles que nous avons déjà cités.</p><p>Pour nous, qui devons au Christ le bonheur de connaître Dieu, nous avons reçu non la circoncision de la chair, mais celle de l’esprit qu’Hénoch et les autres justes ont observée ; nous l’avons reçue dans le baptême, grâce à la miséricorde divine qui nous a affranchis du péché ; et vous pouvez tous la recevoir comme nous. Mais puisque la discussion exige que nous entrions dans le mystère de la naissance du Christ, j’aborde ce sujet. Isaïe nous dit que sa génération est ineffable. « Qui pourrait la raconter ? s’écrie-t-il. Il a été enlevé à la terre, les iniquités de mon peuple l’ont conduit à la mort. » Ainsi, l’Esprit saint lui-même vous déclare que la génération de celui qui doit mourir pour guérir les pécheurs par ses meurtrissures ne peut être racontée ; mais comment est-il né, comment a-t-il paru dans le monde ? Pour l’apprendre à ceux qui croient en lui, voici comme l’Esprit saint a prédit, par la bouche du même prophète, ce qui s’est accompli : « Alors le Seigneur parla encore à Achaz et lui dit : Demande un prodige au Seigneur ton Dieu, au plus profond de l’abîme ou au plus haut des cieux. Achaz répondit : Je me tairai, je ne tenterai point le Seigneur. Le prophète s’écria : Écoutez, maison de David, n’est-ce donc pas assez pour vous de lasser la patience des hommes, faut-il encore que vous lassiez celle de mon Dieu ? C’est pourquoi le Seigneur vous donnera lui-même un signe. Voilà que la vierge concevra et enfantera un fils, et il sera appelé Emmanuel ; il se nourrira de lait et de miel jusqu’à ce qu’il sache rejeter le mal et choisir le bien. Avant que l’enfant puisse discerner le bien du mal, qu’il réprouve le mal et choisisse le bien : avant que l’enfant sache appeler son père et sa mère, il détruira la puissance de Damas, et emportera les dépouilles de Samarie devant le roi des Assyriens ; et cette terre que vous détestez, à cause de ces deux rois, sera abandonnée ; le Seigneur amènera, par les armes du roi d’Assyrie, sur vous et sur votre peuple, et sur la maison de votre père, des jours tels qu’on en aura jamais vu de semblables depuis la séparation d’Éphraïm et de Juda. » Excepté notre Christ, il n’est pas un seul descendant d’Abraham qui soit né ou qu’on ait fait naître d’une vierge, tout le monde en convient. Mais comme vous et vos docteurs vous osez assurer que le texte ne dit pas : « Voilà qu’une <i>vierge</i>, » mais, « qu’une <i>jeune fille</i> concevra dans son sein et enfantera son fils ; » comme vous prétendez d’ailleurs que la prophétie ne peut s’entendre que d’Ézéchias, un de vos rois, je vais essayer de vous montrer en peu de mots qu’il s’agit ici d’un vierge et que la prophétie regarde celui que nous reconnaissons pour le Christ.</p><p>XLIV. Je vous parle dans vos intérêts ; vous ne me ferez pas un crime, je l’espère, de recourir à toutes ces preuves pour tâcher de vous convaincre ; mais si par obstination ou par pusillanimité, à cause de la peine de mort portée contre les Chrétiens, vous persistez à repousser la vérité, il est évident que vous serez vous-mêmes les auteurs de votre perte. Vous êtes entièrement dans l’erreur, si vous vous croyez, parce que vous descendez d’Abraham selon la chair, appelés à recueillir l’héritage des biens que Dieu promet, par son Christ, d’après les divins oracles. Aucun homme, quand il serait de la race d’Abraham, ne peut avoir part à cet héritage, s’il n’a été l’imitateur de la foi, s’il n’a eu l’intelligence de toutes les vérités cachées, c’est-à-dire s’il n’a compris que, parmi les observances de la loi, les unes avaient pour objet le culte de Dieu et la pratique des devoirs de la justice, que les autres étaient des figures qui se rapportaient au mystère du Christ, ou n’avaient été données qu’à la raison de la dureté de votre cœur ; et vous avez la preuve de ce que j’avance dans les paroles du prophète Ézéchiel ; c’est Dieu lui-même qui parle : « Quand Noé, quand Jacob et Daniel me prieraient de faire grâce à leurs fils et à leurs filles, ils ne l’obtiendraient pas. » C’est dans le même sens qu’il dit encore par la bouche d’Isaïe : « Le Seigneur Dieu a dit : Ils sortiront et verront les cadavres des prévaricateurs ; leur ver ne mourra point, leur feu ne s’éteindra jamais, et toute chair aura ce spectacle sous les yeux. » Renoncez donc à de vaines espérances, cherchez plutôt par quelle voie vous pourrez obtenir la rémission de vos péchés et renaître à l’espoir des biens promis.</p><p>Je n’en vois pas d’autre que celle-ci : la foi en Jésus comme le Messie promis, la rémission des péchés par le baptême qu’avait annoncé Isaïe, et une vie désormais pure et sans tache.</p><p>XLV. — Pardonnez-moi, me dit Tryphon, si j’interromps la suite de vos idées. J’ai besoin de vous faire ici une question, souffrez que d’abord je vous l’adresse.</p><p>— Faites-moi, lui dis-je, toutes celles que vous voudrez, selon qu’elles vous viendront à l’esprit. Après vos questions et mes réponses, je tâcherai de reprendre la suite de mon discours et de finir.</p><p>— Dites-moi, si ceux qui ont vécu selon la loi de Moïse auront part à la vraie vie, comme Hénoch, Jacob, Noé, au jour de la résurrection des morts. — Je vous ai déjà cité, lui répondis-je, ces paroles d’Ézéchiel : « Non, quand Noé, Jacob, Daniel demanderaient grâce pour leurs fils et pour leurs filles, ils ne l’obtiendraient pas. » Car personne ne sera sauvé pour les œuvres de ses pères. Je vous ai dit aussi que ceux qui auraient suivi la loi de Moïse pourraient, comme les justes dont vous venez de parler, arriver au salut. Car les grands préceptes de justice, de piété que comprend la loi naturelle, se trouvent aussi dans la loi de Moïse et sont obligatoires pour ceux qui vivent sous elle, aussi bien que les pratiques qui ont été données à cause de la dureté de votre cœur, et qui furent toujours observées par les enfants de la loi. Dès lors qu’ils suivaient les préceptes de la loi naturelle, éternelle, universelle, ils sont agréables à Dieu ; et par Jésus-Christ au jour de la résurrection, Dieu les assimilera aux justes qui les ont précédés, tels que Noé, Hénoch, Jacob et d’autres encore ; ils obtiendront tous le salut avec ceux qui reconnaissent Jésus-Christ pour le fils de Dieu, existant avant le soleil et les autres astres, fait chair dans le temps et né d’une vierge du sang de David, afin que, par l’économie de ce mystère, le serpent, qui dès le commencement avait exercé sa méchanceté, et les anges devenus semblables à lui, vissent leur puissance anéantie, que les hommes ne craignissent plus la mort, qu’au second avénement du Christ elle s’éloignât pour toujours de ceux qui croient en lui et ne cherchent qu’à lui plaire, qu’en un mot elle n’existât plus lorsque les uns auront subi le jugement et la condamnation qui les enverra au supplice d’un feu éternel, et que les autres entreront dans cette heureuse immortalité qui les affranchira pour toujours de la souffrance, de la misère et de la corruption.</p><p>XLVI. — Mais dites-moi, reprit Tryphon, ceux qui voudraient encore aujourd’hui observer la loi de Moïse en même temps qu’ils croiraient en Jésus-Christ crucifié, et le reconnaîtraient pour le Christ de Dieu qui doit juger tous les hommes et dont l’empire est éternel, seraient-ils sauvés ?</p><p>— Mais voyons d’abord, lui dis-je, s’il est possible à présent d’observer tous les préceptes de la loi. — Non, assurément, répondit Tryphon. Nous reconnaissons avec vous qu’on ne peut immoler qu’à Jérusalem l’agneau paschal, que la loi ne veut pas qu’on offre ailleurs les deux boucs dans les jours de jeûne et qu’on fasse hors de son temple les autres oblations.</p><p>Alors je repris : — Dites-moi, je vous prie, quelles sont les observances de la loi qu’il est possible de suivre, et vous serez convaincus qu’on peut se sauver sans accomplir ces préceptes que vous croyez être ceux de la justice éternelle.</p><p>— On peut encore, dit Tryphon, observer le sabbat, la circoncision, les nouvelles lunes, les purifications prescrites quand on a touché quelque objet d’impur ou rempli le devoir conjugal.</p><p>— Mais, lui dis-je, Abraham, Isaac, Jacob, Noé, Job et tous les autres justes qui ont vécu avant ou après ces patriarches, Sara, l’épouse d’Abraham, et Rebecca, l’épouse d’Isaac, Rachel et Lia, les épouses de Jacob, et les autres femmes, jusqu’à la mère de Moïse, ce fidèle serviteur de Dieu, n’ont pu suivre les observances de la loi. Selon vous, seraient-ils exclus du salut ?</p><p>— Abraham n’a-t-il pas été circoncis et tous ceux qui sont venus après lui ? répliqua Tryphon.</p><p>— Je sais bien, lui dis-je, qu’Abraham et ses descendants ont reçu la circoncision. Mais je vous ai déjà dit pourquoi elle leur avait été donnée, et je me suis là-dessus beaucoup étendu. Mais si tout ce que j’ai dit sur ce point n’a pu vous convaincre, nous examinerons encore cette question. Vous savez que de tous les justes, aucun jusqu’à Moïse n’observa et ne fut obligé d’observer une seule des pratiques dont il s’agit, sauf la circoncision qui remonte à Abraham.</p><p>— Nous le savons bien, dit Tryphon, et nous reconnaissons que ces justes sont sauvés.</p><p>— N’oubliez pas, repris-je, que Dieu ne vous a donné tous les préceptes par le ministère de Moïse qu’à raison de la dureté de votre cœur. Il voulait que toutes ces pratiques fussent autant de moniteurs qui vous remissent sans cesse sa pensée sous les yeux dans toutes vos actions, afin de vous détourner de l’injustice et de l’impiété. Il vous ordonna même de vous ceindre d’une bandelette qui vous rappelât son souvenir et de porter un phylactère ou membrane de parchemin très-mince, sur laquelle étaient tracés certains caractères que nous regardons comme sacrés. C’était tout à la fois un aiguillon qui réveillait sans cesse en vous la pensée de Dieu, et un reproche fait à votre conscience d’être si prompts à l’oublier ; et toutes ces précautions cependant n’ont pu vous détourner de l’idolâtrie. En effet, du temps d’Élie, Dieu comptant ceux qui n’avaient pas fléchi le genou devant Baal, n’en trouva que sept mille qui lui fussent restés fidèles ; plus tard il vous reproche par la bouche d’Isaïe d’avoir immolé vos enfants mêmes aux idoles ? Nous, au contraire, plutôt que de leur sacrifier comme nous le faisions autrefois, nous endurons les plus cruels supplices. Nous condamne-t-on à la mort, nous nous livrons à la joie, parce que nous sommes persuadés que Dieu nous ressuscitera par son Christ et que nous serons incorruptibles, impassibles, immortels. D’un autre côté, nous savons, nous, que de simples observances, établies à raison de la dureté du cœur, ne peuvent produire des œuvres de justice et de piété.</p><p>XLVII. — Mais, dit Tryphon, si quelqu’un persuadé de cette vérité voulait encore garder les observances légales, bien qu’il reconnût Jésus-Christ pour le Christ, qu’il crût en lui et obéît à sa parole, sera-t-il sauvé ?</p><p>— À mon avis, il le sera, lui répondis-je, pourvu toutefois qu’il ne cherche point à persuader aux autres, c’est-à-dire aux gentils affranchis de l’erreur par Jésus-Christ, qu’ils doivent comme lui pratiquer ces observances ; et qu’il ne soutienne pas que sans elles on ne peut obtenir le salut, comme vous le prétendiez vous-même, Tryphon, au commencement de cette discussion : car vous m’avez dit formellement que je ne serais pas sauvé, si je n’observais pas la loi.</p><p>Tryphon reprit : — Mais pourquoi dites-vous : « À mon avis, cet homme sera sauvé, » sinon parce que plusieurs pensent qu’il ne le sera pas ?</p><p>— Oui, lui dis-je, il en est qui pensent ainsi. Ils craindraient de s’entretenir, de loger sous le même toit, d’avoir les moindres rapports avec les hommes dont vous parlez. Je ne partage pas leurs sentiments. Si quelques-uns d’entre vous veulent encore par faiblesse observer tout ce qu’ils peuvent d’une loi que Moïse n’avait donnée qu’à raison de la dureté du cœur ; s’ils espèrent en même temps en Jésus-Christ et observent les préceptes éternels de justice et de piété, qui sont la base de la loi naturelle, sans refuser de vivre avec les Chrétiens fidèles à Jésus-Christ, et sans chercher à leur persuader de se faire circoncire comme eux et d’observer le sabbat et les autres pratiques de la loi, je pense qu’il faut les recevoir et communiquer avec eux en toutes choses, comme avec des hommes animés de notre esprit, comme avec des frères. Pour ceux de votre nation qui croient, nous disent-ils, en Jésus-Christ, mais qui veulent obliger les fidèles d’entre les gentils à pratiquer la loi de Moïse, et refusent de communiquer avec eux sans cette condition, je ne les recevrais pas comme les autres ; je crois bien toutefois que ceux qui se laisseraient persuader d’allier l’observance de la loi avec la confession de Jésus-Christ pourraient être sauvés. Mais quant à ceux qui après avoir reconnu et confessé le Christ auraient passé aux observances légales, n’importe par quel motif, et cessé de le reconnaître pour le Messie, sans avoir fait pénitence avant de mourir, je puis vous assurer qu’il n’y a point de salut pour eux ni pour les descendants d’Abraham qui vivent selon la loi et meurent sans avoir cru en Jésus-Christ, je parle surtout de ceux qui ont blasphémé et blasphèment encore contre lui dans leurs synagogues. Mais s’ils le confessent avant leur mort, ils seront assurément sauvés et préservés des feux éternels. Car, dans sa bonté, dans sa miséricorde dont les trésors sont infinis, comme le dit Ézéchiel, Dieu met le pécheur pénitent au même rang que le juste qui a vécu sans péché : il n’en est pas ainsi de celui qui passe des voies de la piété et de la justice dans celles du crime et de l’impiété, Dieu ne le distingue plus du pécheur, de l’homme injuste et impie. C’est pourquoi notre Seigneur Jésus-Christ nous dit : « Je vous jugerai selon les voies où je vous aurai surpris. »</p><p>XLVIII. — Nous savons, dit Tryphon, ce que vous pensez sur ce point ; reprenez la discussion où vous l’avez laissée, et tâchez d’en finir. Vous me paraissez soutenir un paradoxe singulier et qui ne peut s’appuyer d’aucune preuve. Quoi ! vous prétendez que votre Christ est Dieu, qu’il a existé avant les siècles, qu’il a bien voulu naître, s’incarner, et qu’il s’est fait homme sans être né de l’homme. Ce n’est pas seulement un paradoxe qui choque toutes les idées reçues, mais encore une absurdité.</p><p>— Oui, je sais que cette doctrine doit paraître étrange à ceux d’entre vous qui ne veulent ni comprendre, ni suivre la parole de Dieu, et qui n’écoutent d’autre voix que leurs docteurs. C’est le reproche que Dieu vous fait lui-même. Quand je ne pourrais vous démontrer que Jésus-Christ est le fils de Dieu créateur de toutes choses, qu’il existe avant les siècles, qu’il est Dieu lui-même en même temps qu’il est homme né d’une vierge, il n’en resterait pas moins démontré qu’il est le Christ de Dieu. Après vous l’avoir prouvé comme je l’ai fait, si je ne vous démontrais pas aussi clairement ce que je viens d’ajouter, c’est-à-dire qu’il a précédé les siècles, qu’il a voulu prendre une chair, se faire homme et tout souffrir pour obéir à la volonté de son père, tout ce que vous pourriez dire, c’est que je me trompe sur ce point, mais vous ne pourriez vous refuser à reconnaître en lui le Christ promis. Ne paraîtrait-il qu’un homme né d’entre les hommes, n’ayant rien de plus que le caractère d’une élection sainte qui le montre comme le Christ de Dieu, du moins devez-vous reconnaître en lui ce caractère. Ainsi l’ont jugé quelques hérétiques qui portent le nom de Chrétiens. Tout en le regardant comme un homme, ils le reconnaissaient pour le Christ. Je ne partage pas leur sentiment, quand ils n’en font qu’un simple mortel, et je ne l’adopterais jamais, quand le plus grand nombre qui pense comme moi viendrait à penser comme eux. Car le Christ lui-même nous commande de croire non à la parole de l’homme, mais à la parole des prophètes et à la sienne.</p><p>XLIX. Tryphon reprit : — L’opinion de ceux qui ne font de Jésus-Christ qu’un homme marqué du sceau de l’élection divine à la faveur de l’onction qu’il a reçue et par elle devenu le Christ, paraît bien plus probable que celle que vous défendez, et nous aussi nous attendons un Christ qui ne sera qu’un homme né d’entre les hommes et qui recevra l’onction sainte des mains d’Élie, quand celui-ci viendra. Bien que Jésus vous paraisse le Christ, vous ne devez toujours voir en lui qu’un homme, né comme les autres hommes. Mais comme Élie n’a pas paru, je ne peux pas même admettre que ce Jésus soit le Christ.</p><p>— Voilà votre avis, Tryphon. Mais répondez-moi, le prophète Zacharie ne dit-il pas qu’Élie doit venir avant le grand et terrible jour du Seigneur ?</p><p>— Oui, certainement, me répondit-il.</p><p>— Eh bien, repris-je, si nous sommes obligés, d’après l’Écriture, de reconnaître que les prophètes ont prédit deux avénements du Christ, l’un qui le fera voir sans éclat, sans beauté, exposé à toutes les douleurs, l’autre qui nous le montrera environné de gloire et s’avançant comme le juge de tous les hommes, ainsi que nous l’avons prouvé plus haut par tant d’endroits de l’Écriture, comment ne pas voir qu’il s’agit du second avénement dans ces mots de <i>jour grand et terrible</i>, et que c’est de ce dernier avénement qu’Élie est annoncé comme précurseur ?</p><p>— Oui, je vous l’accorde encore, me dit-il.</p><p>— Jésus-Christ lui-même, continuai-je, nous apprend qu’Élie doit venir en personne. Mais nous savons qu’il parle du jour où le Christ viendra du ciel dans toute sa gloire. Quant au premier avénement, on peut dire aussi qu’Élie a paru ; car l’esprit de Dieu qui était en lui s’est manifesté comme précurseur dans la personne de saint Jean, un des prophètes sortis de votre nation et le dernier qui parut parmi vous. Car voici ce qu’il disait assis sur les bords du Jourdain : « Je baptise dans l’eau pour la pénitence ; mais celui qui doit venir après moi et dont je ne suis pas digne de porter les souliers est plus puissant que moi ; celui-là vous baptisera dans l’esprit et dans le feu. Il tiendra le van à sa main, et il nettoiera son aire, et il amassera son froment dans le grenier, et il brûlera la paille dans un feu qui ne s’éteindra jamais. »</p><p>Votre roi Hérode l’avait fait jeter dans les fers ; mais lorsqu’il célébrait le jour de sa naissance, la fille de son frère l’ayant charmé par sa manière de danser, il l’obligea de lui demander tout ce qu’elle voudrait. La jeune princesse, d’après le conseil de sa mère, demanda la tête de Jean. Le roi l’envoya couper et la fit apporter dans un bassin.</p><p>Jésus notre maître, quand il a paru sur la terre, dit-il à ceu qui prétendaient comme vous qu’Élie devait précéder le Christ :</p><p>« Oui, Élie doit venir et rétablir Israël ; mais je vous déclare qu’Élie est déjà venu, et ils ne l’ont pas connu, et ils ont fait contre lui tout ce qu’ils ont voulu. » Il est écrit qu’alors ses disciples comprirent qu’il leur avait parlé de Jean-Baptiste.</p><p>— Vous me paraissez encore, reprit Tryphon, blesser les idées reçues, quand vous dites que l’esprit de Dieu qui était dans Élie fut aussi dans Jean-Baptiste.</p><p>— Est-ce que vous ne savez pas, lui dis-je, que c’est précisément ce qui est arrivé à Jésus, fils de Nave, qui fut chargé après Moïse de conduire le peuple d’Israël ? Est-ce que Dieu lui-même, lorsqu’il ordonna à Moise de lui imposer les mains, n’a pas dit en propres termes : « Et moi ? je transporterai sur lui l’Esprit saint qui est en toi ? »</p><p>— Oui, dit Tryphon.</p><p>— Ainsi, continuai-je, de même que du vivant de Moïse Dieu transporta sur le fils de Nave l’esprit qui était en lui, de même Dieu a pu transporter celui d’Élie sur Jean. Le premier avénement du Christ était sans gloire ; ainsi devait être le premier avénement de l’esprit précurseur, qui restait toujours en Élie pur et intact. Il est dit que Dieu combat Amalech d’une main invisible ; qu’Amalech ait été vaincu, vous ne le nierez pas. Mais si on prétend qu’il ne doit succomber qu’au jour où le Christ viendra dans sa gloire, pourquoi l’Écriture dit-elle que la main invisible du Seigneur poursuit Amalech ? Il faut donc reconnaître que la vertu de Dieu était cachée dans le Christ crucifié, qui fait trembler les démons et toutes les puissances et principautés de la terre. Ainsi la vertu d’Élie était cachée dans Jean-Baptiste.</p><p>L. — On voit bien, me dit Tryphon, que vous avez une longue habitude de la controverse, et qu’il vous est souvent arrivé de discuter avec toutes sortes de personnes et sur toutes sortes de sujets. Voilà pourquoi vous êtes toujours prêt à répondre.</p><p>Mais dites-moi donc comment vous pourriez prouver qu’il existe un autre Dieu que le Dieu créateur de toutes choses. Vous essayerez ensuite de me démontrer comment il a pu s’abaisser jusqu’à naître d’une vierge et se faire homme comme nous.</p><p>— Très-volontiers, lui dis-je ; mais permettez-moi de vous citer d’abord les paroles d’Isaïe sur la fonction de précurseur que le prophète Jean-Baptiste a remplie parmi vous avant la venue de Jésus-Christ.</p><p>— Je vous écoute, me dit-il.</p><p>Voici comment Isaïe parle de la mission de Jean qui précéda le Christ :</p><p>Ézéchiel dit à Isaïe : « La parole du Seigneur est juste ; que la vérité et la paix subsistent pendant mon règne. Console-toi, console-toi, mon peuple, dit le Seigneur ton Dieu. Prêtres, parlez au cœur de Jérusalem, et appelez-la par son nom ; ses maux sont finis, son iniquité lui est pardonnée, elle a reçu du Seigneur des grâces qui surpassent ses crimes. On entend la voix de celui qui crie dans le désert : Préparez la voie du Seigneur, rendez droits les sentiers. Toute vallée sera comblée, toute montagne et toute colline sera abaissée, les chemins tortueux seront redressés, ceux qui étaient raboteux seront applanis ; la gloire du Seigneur sera révélée, le Seigneur va parler, toute la terre verra le Sauveur. Une voix m’ordonne de crier, et j’ai répondu : Que dirai-je par mes cris ? Tous les mortels ne sont que de l’herbe et toute leur beauté ressemble à la fleur des champs. Le Seigneur a répandu un souffle brûlant ; l’herbe de la prairie s’est desséchée, la fleur est tombée. Oui, les peuples sont comme l’herbe de la prairie. L’herbe sèche, la fleur tombe, mais la parole de notre Dieu subsiste dans l’éternité. Montez sur le sommet de la montagne, vous qui évangélisez Sion ; criez encore plus haut, ne craignez pas ; dites aux villes de Juda : Voici votre Dieu ! Et voilà que le Seigneur paraît revêtu de force ; son bras signale sa puissance ; le prix de sa victoire est en ses mains, ses œuvres le précèdent et l’annoncent. Il gouverne ses troupeaux comme un pasteur vigilant ; il rassemble ses agneaux, il les presse dans ses bras, il les réchauffe sur son sein ; il porte lui-même les brebis pleines. Qui a mesuré les eaux dans le creux de sa main, et qui la tenant étendue a pesé les cieux ? Qui a soutenu de trois doigts la masse de la terre ? qui a mis les collines en équilibre ? Qui a aidé l’esprit du Seigneur ? Qui est entré dans son conseil ? Qui l’a conduit ? Qui a-t-il consulté ? Qui l’a instruit ? Qui lui a enseigné les voies de la justice ? De qui tient-il la science ? Qui lui a ouvert les routes de la sagesse ? Les nations sont devant lui comme une goutte d’eau dans un vase d’airain, un grain de sable dans une balance ; les îles sont comme la poudre légère. Le Liban et ses forêts ne suffiraient pas au feu de ses autels. Tous les animaux de la terre ne seraient point un sacrifice digne de lui. Tous les peuples sont devant lui comme s’ils n’existaient pas. »</p><p>LI. Quand j’eus finis, Tryphon reprit : — Tous les mots de cette prophétie sont ambigus ; je n’y vois rien qui revienne à la question.</p><p>— Oui, lui dis-je, si le ministère prophétique n’avait pas cessé chez vous depuis Jean-Baptiste, vous pourriez trouver obscures les paroles que je viens de citer et qui se rapportent à Jésus-Christ.</p><p>Mais si Jean l’a précédé, prêchant aux hommes le baptême de la pénitence ; si Jésus-Christ vint à lui sur les bords du Jourdain et mit fin à sa prédication et à son baptême ; s’il commença lui-même à prêcher l’Évangile, annonçant aux hommes que le royaume de Dieu était proche ; qu’il aurait à souffrir de la part des scribes et des pharisiens, qu’il fallait qu’il fût crucifié et qu’il ressuscitât ; qu’il reparaîtrait dans Jérusalem, où il retrouverait ses disciples et vivrait avec eux ; mais qu’il s’élèverait dans l’intervalle de faux prêtres, de faux prophètes abusant de son nom pour tromper les peuples : si tout cela s’accomplit, ainsi que tout le monde peut le voir, comment douter encore lorsque les événements parlent si haut ?</p><p>Il avait annoncé clairement que désormais il ne s’élèverait plus de prophètes parmi vous. Et pour convaincre les hommes que le Testament nouveau promis dès longtemps, et qui n’était autre que lui-même en sa qualité de Christ, venait d’apparaître, voici ce qu’il disait aux Juifs : « La loi et les prophètes ont existé jusqu’à Jean. Depuis ce temps le royaume de Dieu souffre violence, et les violents seuls le ravissent ; et si vous voulez l’entendre, il est lui-même Élie qui doit venir. Que celui qui a des oreilles pour entendre, entende. »</p><p>LII. Le patriarche Jacob avait aussi prédit les deux avénements du Christ ; il avait annoncé qu’on le verrait dans le premier en proie à la douleur, et qu’ensuite il n’existerait plus chez vous ni rois, ni prophètes ; que les gentils, pleins de foi en Jésus souffrant et humilié, vivraient dans l’attente de son second avénement. C’est bien là ce que l’esprit prophétique exprimait d’une manière symbolique et mystérieuse. Alors je rapportai ses propres paroles :</p><p>« Juda, tes enfants te loueront ; ta main sera sur la tête de tes ennemis ; les enfants de ton père s’humilieront devant toi. Juda est comme un jeune lion. Mon fils, tu t’es levé pour le butin, et dans ton repos tu dors comme le lion et la lionne : qui osera le réveiller ? Le sceptre ne sortira pas de Juda, ni le prince de sa postérité, jusqu’à ce que vienne celui à qui appartient le sceptre, et qui est l’attente des nations. Il liera son ânon à la vigne, à la vigne, le fils de son ânesse ; et il lavera son manteau dans le vin, et sa robe dans le sang de la vigne. Ses yeux seront plus rouges que le vin et ses dents plus blanches que le lait. »</p><p>Or, depuis les premiers temps jusqu’à l’époque où Jésus-Christ est né et a souffert, votre nation a toujours eu des princes et des prophètes. Vous n’oseriez, vous ne pourriez soutenir le contraire. Si vous dites qu’Hérode, sous le règne duquel Jésus-Christ a souffert, était d’Ascalon, vous convenez cependant qu’il y avait chez vous un prince des prêtres. Vous aviez donc même alors un pontife qui offrait des sacrifices selon la loi de Moïse, et qui en suivait toutes les observances, tandis que la succession des prophètes se continuait jusqu’à Jean qui fut le dernier, comme elle s’était perpétuée jusqu’à l’époque où la terre de Juda fut ravagée, les vases sacrés enlevés, votre peuple emmené captif à Babylone. La nation eut toujours quelques prophètes qui en étaient comme les maîtres, les chefs, les princes. L’esprit qui était en eux sacrait les rois et les établissait sur vous. Mais, depuis que notre Seigneur Jésus-Christ a paru au milieu de votre peuple et que vous l’avez mis à mort, vous avez cessé d’avoir des prophètes. La nation n’a plus de rois, votre pays est entièrement dévasté et ressemble à une demeure abandonnée. La prédiction des deux avénements du Christ se trouve dans ces paroles de Jacob : <i>Il sera l’attente des nations</i>. Elles annoncent d’une manière mystérieuse que les gentils croiront en lui. Et vous le voyez, de toutes les nations nous formons un nouveau peuple, un peuple saint qui adore le vrai Dieu par la foi en Jésus-Christ dont nous attendons le second avénement.</p><p>LIII. Ces autres paroles : « Il liera son âne à la vigne, et le fils de l’ânesse au cep de la vigne, » étaient tout à la fois et une figure et une prédiction de ce qu’il fit lors du premier avénement, et de la conversion des gentils qui devaient croire en lui. Jusqu’au moment où Jésus-Christ instruisit les nations, elles étaient comme l’ânon qui n’a jamais porté de bât et qui ne connaît pas le joug. Il leur envoya ses apôtres pour les instruire et les plier au joug de sa loi ; elles l’ont porté avec tant de docilité, qu’on les a vues disposées à tout souffrir dans l’attente des biens promis.</p><p>Pour Jésus-Christ notre Seigneur, il a véritablement paru sur une ânesse. Rappelez-vous ce qu’il fit lorsqu’il approchait de Jérusalem : il envoya ses disciples lui chercher une ânesse qui était attachée avec son ânon à l’entrée d’un bourg appelé Betphagé ; et quand ils l’eurent amenée, il monta dessus et entra dans la ville. L’action de Jésus-Christ, réalisant aux yeux de tout le monde les prophéties qui concernent le Christ, ne prouvait-elle pas évidemment qu’il était lui-même le Christ promis ? Et quand il accomplit ainsi tous les oracles et qu’on vous le prouve les Écritures à la main, vos cœurs restent toujours endurcis ! Ce que nous venons de dire avait été prédit en ces termes par Zacharie, un des douze prophètes : « Tressaille d’allégresse, fille de Sion ! pousse des cris de joie, fille de Jérusalem ! voilà que ton roi viendra vers toi, juste et sauveur, doux et pauvre, monté sur une ânesse et sur le fils de l’ânesse. »</p><p>Remarquez ces paroles de l’Esprit saint, qui dit formellement comme le patriarche Jacob, que le Christ se servira de l’ânesse et de l’ânon, et l’ordre donné par Jésus-Christ de lui amener l’un et l’autre, et vous comprendrez ce que signifiait cette ânesse. N’était-ce pas la figure de ceux de la synagogue qui devaient un jour, comme les gentils, croire en lui ?</p><p>Car, de même que l’ânon inaccoutumé au joug représentait les gentils, de même l’ânesse habituée à porter le bât figurait la nation juive. La loi donnée par les prophètes, qu’était-ce autre chose qu’un joug qui vous était imposé ? Zacharie avait encore prédit que le Christ serait frappé et ses disciples dispersés. N’est-ce pas ce qui est arrivé ? Lorsque Jésus fut mis en croix, ceux qui étaient avec lui prirent la fuite. Ils ne reparurent qu’après sa résurrection, lorsqu’il leur montra que celui qui devait ainsi souffrir d’après les prophètes, c’était lui-même. Alors ils furent forcés de croire, et ils partirent pour le faire connaître au monde entier. Et voilà pourquoi nous sommes si fermes dans sa foi et dans sa doctrine. Ne trouvons-nous pas en effet le plus puissant motif de croire et dans les prophéties et dans la conversion de ceux que nous voyons aujourd’hui par toute la terre amenés à la connaissance du vrai Dieu, au nom de Jésus crucifié ? Mais citons les paroles mêmes de Zacharie : « Glaive, lève-toi sur mon pasteur, sur l’homme de mon peuple, dit le Seigneur des armées. Frappe le pasteur, et ses brebis seront dispersées. »</p><p>LIV. Remarquez ces paroles de la prophétie de Jacob rapportées par Moïse : « Il lavera sa robe dans le vin et son manteau dans le sang de la vigne ; » elles signifient qu’il devait purifier, par son sang, ceux qui croient en son nom. Par sa robe, l’Esprit saint désigne ceux qui ont reçu de lui la rémission de leurs péchés, qu’il remplit toujours de son esprit, et qu’il revêtira de sa gloire au jour de son second avénement. Mais pourquoi ces mots : « Le sang de la vigne ? » N’est-ce pas pour nous faire entendre d’une manière ingénieuse que Jésus-Christ tire son sang, non de l’homme, mais de la vertu de Dieu, car ce n’est pas l’homme qui produit le sang de la vigne, et le prophète annonce qu’il en sera de même du sang du Christ, qu’il viendra, non de l’homme, mais de Dieu.</p><p>Cette prophétie vous prouve donc, mes amis, que le Christ n’est point né de l’homme comme nous naissons tous.</p><p>LV. — Nous admettrons votre explication, dit Tryphon, quand vous l’appuierez d’autres preuves ; mais pour le moment sortez de cette digression et prouvez-nous que l’Esprit saint reconnaît une autre Dieu que le créateur de l’univers. N’allez pas nous parler du soleil et de la lune que les nations, l’Écriture, adoraient comme des dieux. Il ne faut pas prendre à la lettre ce langage des prophètes : « Ton Dieu est le Dieu des dieux, le Seigneur des seigneurs, » le désignant toutefois par les attributs de grand, de fort, de terrible ; les prophètes ne veulent pas dire pour cela que les astres soient des dieux. L’Écriture nous fait seulement entendre que, parmi les êtres que la crédulité humaine regardait comme des dieux et des seigneurs, il n’y a qu’un seul vrai Dieu, qu’un seul véritable Seigneur, celui qui a tout créé ; et pour nous le prouver, l’Esprit saint nous dit par David : « Les dieux des nations, c’est-à-dire ceux qu’elles honorent sous ce nom, ne sont pas des dieux, mais des simulacres des démons. » Le prophète exprime ensuite combien il déteste et ceux qui les fabriquent et ceux qui les adorent.</p><p>— Mon intention, repris-je, n’était pas de vous citer ces passages qui condamnent, je le sais, tous ceux qui se livrent à l’idolâtrie ; les preuves que je veux vous donner sont sans réplique : elles vous paraîtront nouvelles, et cependant vous les lisez tous les jours. Rien ne prouve mieux que la mauvaise disposition de votre cœur a fait pour vous des divines Écritures un livre scellé. Vous n’y voyez pas la sagesse divine renfermée dans chaque parole. J’en excepte un petit nombre que Dieu, dans son infinie miséricorde, a laissé parmi vous comme une semence de salut, pour me servir du langage d’Isaïe, afin que votre race ne pérît pas tout entière, comme celle de Sodôme et de Gomorrhe. Prêtez donc toute votre attention aux paroles des saintes Écritures que je vais vous citer ; elles n’exigent point d’explication, elles n’ont besoin que d’être écoutées.</p><p>LVI. Voyez quel nom Moïse, ce saint et fidèle serviteur du Très-Haut, donne à celui qui se fit voir à Abraham près du chêne de Mambré et qui était accompagné de deux anges, envoyés, comme lui, pour prononcer le jugement de Sodôme, par l’être qui réside au plus haut des cieux, que personne n’a vu, qui n’a parlé directement, lui-même, à personne, et que nous appelons le père, le créateur de toutes choses. Moïse déclare en propres termes qu’il est Dieu ; voici comme il s’exprime : « Or, Dieu apparut en la vallée de Mambré à Abraham, assis à l’entrée de sa tente, durant la chaleur du jour. Et comme il levait les yeux, trois hommes parurent debout près de lui, et aussitôt qu’il les eut apperçus, il courut au-devant d’eux dès l’entrée de sa tente, et il adora, s’inclinant vers la terre ; » et plus bas : « Abraham se levant dès le matin s’en alla au lieu où il s’était trouvé avec le Seigneur, et il regarda Sodôme et Gomorrhe et toute la terre de cette contrée, et il vit une flamme monter de la terre comme la vapeur d’une fournaise. » Quand j’eus fini, je demandai à mes interlocuteurs s’ils avaient saisi le sens de ces paroles. — Oui, répondirent-ils ; mais elles ne prouvent pas qu’il existe, ou que le Saint-Esprit ait dit qu’il existât un autre Dieu, un autre Seigneur que le créateur de toutes choses.</p><p>— Puisque vous comprenez si bien les Écritures, leur dis-je, je vais essayer de vous prouver d’après leur témoignage la vérité de ce que j’avance, c’est-à-dire qu’après le créateur de l’univers, il existe une autre personne qu’on appelle Dieu et Seigneur, et qui est réellement l’un et l’autre ; elle est aussi parfois désignée sous le nom d’ange, parce qu’elle annonce aux hommes tout ce que veut leur annoncer le Dieu créateur, au-dessus duquel il n’est pas d’autre Dieu. Je citai de nouveau le passage, et je demandai à Tryphon : Pensez-vous, d’après ces paroles de l’Écriture, que ce soit Dieu qui ait apparu à Abraham sous le chêne de Mambré ?</p><p>— Oui, sans doute, répondit-il.</p><p>— Était-il un de ceux qui apparurent à Abraham au nombre de trois et que l’Esprit saint désigne sous le nom d’hommes ?</p><p>— Nullement, répondit-il ; Dieu se fit voir au patriarche avant l’apparition des trois personnages. L’Écriture les appelle du nom d’hommes, mais ils étaient des anges. Deux furent envoyés pour détruire Sodôme ; l’autre vint annoncer à Sara qu’elle aurait un fils. Ce message rempli, il disparut.</p><p>— Mais, lui dis-je, comment se fait-il que celui des trois qui avait dit devant la tente : <i>Je reviendrai vers toi, lorsque l’heure en sera venue, et alors il naîtra un fils à Sara</i>, ait reparu, en effet, après la naissance du fils de Sara, et que dans le même passage l’Esprit saint déclare qu’il était Dieu ? Pour vous faire comprendre encore plus clairement ma pensée, je vais vous citer les paroles mêmes de Moïse : « Et Sara ayant vu le fils d’Agar, servante égyptienne, jouant avec son fils Isaac, elle dit à Abraham : Chasse cette servante et son fils ; car le fils de la servante ne sera point héritier avec mon fils Isaac. Abraham écouta ceci avec peine, à cause de son fils. Mais Dieu lui dit : Que cette parole sur l’enfant et sur sa servante ne te paraisse pas dure, et quelque chose que dise Sara, écoute sa voix ; car c’est d’Isaac que ta postérité prendra son nom. »</p><p>Ne voyez-vous pas que celui qui près du chêne avait promis de revenir, parce qu’il prévoyait que son intervention serait nécessaire pour persuader à Abraham de condescendre aux volontés de Sara, revint, en effet, comme le dit l’Écriture, et qu’il est vraiment Dieu, ainsi que le prouvent ces paroles : « Dieu dit à Abraham : Que cette parole sur l’enfant et sur ta servante ne te paraisse pas dure. »</p><p>C’est par ces questions que je pressais mes interlocuteurs.</p><p>— Très-bien, dit Tryphon. Mais tout ce que vous venez de dire ne prouve nullement qu’il existe un autre Dieu que celui qui se montra à Abraham, aux autres patriarches et aux prophètes. Vous nous avez seulement fait voir que nous avions eu tort de prendre pour trois anges les trois personnages qui se trouvaient avec Abraham sous sa tente.</p><p>— Si je ne pouvais, Tryphon, vous montrer par les Écritures que l’un d’eux était le Dieu qu’elles appellent quelquefois du nom d’ange, parce qu’il est chargé de porter aux hommes les ordres du souverain créateur, vous seriez excusable de penser ici comme votre nation à l’égard de celui qui parut au monde sous une forme humaine, ainsi qu’il s’était fait voir à Abraham accompagné de deux anges, bien qu’il fût Dieu et précédât les siècles.</p><p>— Avons-nous pu jusqu’alors, me dit-il, avoir un autre sentiment ?</p><p>— Eh bien ! lui répondis-je, je vais vous prouver, en m’appuyant toujours sur les Écritures, que celui qui s’est montré à Abraham, à Jacob, à Moïse, et qui est appelé Dieu par les livres saints, est autre que celui qui a tout créé ; mais je m’explique, autre par le nombre et non par la volonté[1]. Car je déclare qu’il n’a jamais rien fait qui ne fût parfaitement conforme à la volonté du Dieu créateur, au-dessus duquel il n’y a pas d’autre Dieu.</p><p>— Voilà ce qu’il faut nous prouver, reprit Tryphon, si vous voulez que nous nous rangions à votre avis ; nous sommes déjà persuadés que celui dont vous parlez a toujours fidèlement suivi dans ce qu’il a dit, et fait les ordres du créateur de toutes choses.</p><p>— Le passage suivant de l’Écriture, lui répondis-je, va vous mettre en quelque sorte la vérité sous les yeux : « Le soleil, est-il dit, se levait sur la terre, quand Loth parvint à Ségor. Le Seigneur fit donc pleuvoir sur Sodôme et Gomorrhe le soufre et le feu du ciel ; il détruisit ces cités et toute la contrée qui les environne. »</p><p>Un des quatre auditeurs restés avec Tryphon prit ici la parole : — Outre le Dieu qui apparut à Abraham, il faut donc aussi, dit-il, donner ce nom à l’un des deux anges qui allèrent à Sodôme ; car l’Esprit saint, parlant par la bouche de Moïse, l’appelle aussi Seigneur.</p><p>— Ce n’est pas seulement, lui dis-je, pour cette raison qu’il faut reconnaître ce qui est, c’est-à-dire que l’Esprit saint appelle du nom de Seigneur un autre que le créateur de toutes choses ; s’il l’a déclaré par la bouche de Moïse, il le dit encore par celle de David ; car il le fait parler en ces termes : « Le Seigneur a dit à mon Seigneur : Asseyez-vous à ma droite, jusqu’à ce que je réduise vos ennemis à vous servir de marchepied. » Et dans un autre endroit : « Votre trône, ô Dieu, est un trône éternel, le sceptre de l’équité est le sceptre de votre empire. Vous aimez la justice et vous haïssez l’iniquité : c’est pourquoi, ô Dieu, votre Dieu vous a sacré d’une onction de joie, au-dessus de tous ceux qui veulent y participer. »</p><p>Montrez-moi, si vous le pouvez, que l’Esprit saint donne les noms de Dieu et de Seigneur à un autre qu’au Dieu créateur de l’univers et à son Christ ; car je vais vous prouver, et toujours d’après l’Écriture, que ce n’est pas l’un des deux anges qui se dirigeaient sur Sodôme qu’elle appelle Seigneur, mais bien celui qui était avec eux et que Moïse nous dit être le Dieu que vit Abraham.</p><p>— Hâtez-vous de le prouver, dit Tryphon ; car, vous le voyez, le jour baisse, et nous ne nous sommes pas préparés à vous répondre sur un sujet aussi difficile. Outre cela, nous n’avons jamais eu affaire à quelqu’un qui sût creuser les choses, les discuter, les développer comme vous le faites. Grâce à l’Écriture sainte dont vous vous êtes toujours fait un appui, nous vous avons laissé discourir à notre gré ; c’est d’elle en effet que vous cherchez à tirer toutes vos preuves, et d’ailleurs vous déclarez qu’il n’est point de Dieu au-dessus du créateur de l’univers.</p><p>— Vous connaissez, leur dis-je, ces paroles de l’Écriture : « Et le Seigneur dit à Abraham : Pourquoi Sara a-t-elle ri, disant : Est-il vrai qu’étant vieille je puisse enfanter ? Y a-t-il quelque chose d’impossible à Dieu ? Je reviendrai vers toi, selon ma parole, en ce temps et tu vivras et Sara aura un fils. » Plus loin nous lisons : « Après que ceux-ci se furent levés, ils tournèrent leurs yeux vers Sodôme et Gomorrhe, et Abraham allait avec eux les conduisant. Et le Seigneur dit : Puis-je cacher à Abraham, mon fils, ce que je vais faire ? » Et un peu après : « le Seigneur a dit : Le cri de Sodôme et de Gomorrhe s’est multiplié et leur péché s’est aggravé devant moi. Je descendrai et je verrai s’ils ont accompli en leurs œuvres la clameur venue jusqu’à moi, et s’il est ainsi je le saurai. Et ils partirent de là, et ils s’en allèrent vers Sodôme. Or, Abraham était encore devant le Seigneur, et s’approchant du Seigneur, il dit : Perdrez-vous l’innocent avec le coupable ? » Nous ne répéterons pas les paroles qui suivent, nous les avons déjà citées ; mais il importe de rappeler celles qui m’ont servi à convaincre Tryphon et ses amis ; les voici : « Le Seigneur disparut quand il eut cessé de parler à Abraham, et Abraham retourna en sa demeure ; sur le soir arrivèrent deux anges à Sodôme, et Loth était assis à la porte de la ville. » Et ce qui suit jusqu’à cet endroit : « Et voilà que les étrangers avancèrent leurs mains, et faisant rentrer Loth en la maison, ils fermèrent la porte. » Je passe encore pour arriver à cette partie du récit : « Ils prirent sa main et la main de sa femme et la main de ses deux filles, parce que Dieu leur faisait grâce, et ils l’emmenèrent et le mirent hors de la ville ; et là ils lui dirent : Sauve ta vie, ne regarde point derrière toi, et ne t’arrête point dans toute cette contrée ; mais sauve-toi en la montagne, de peur que tu ne périsses avec les autres. Et Loth leur répondit : Mon Seigneur, je vous prie, puisque votre serviteur a trouvé grâce devant vous et que vous avez manifesté votre miséricorde sur moi, afin de sauver ma vie ; or, je ne puis me retirer en la montagne, où le mal me surprendra et où je mourrai ; il y a près d’ici une ville où je puis m’enfuir : elle est petite, et je serai sauvé ; n’est-elle pas très-petite, et elle sauvera ma vie. Et le Seigneur lui répondit : Voilà que j’ai écouté encore ta prière, et je ne détruirai point la ville pour laquelle tu as parlé. Hâte-toi, sauve-toi là ; car je ne pourrai rien faire, jusqu’à que tu y sois parvenu. C’est pourquoi cette ville fut appelée Ségor (petite). Le soleil se levait sur la terre quand Loth parvint en Ségor. Le Seigneur fit donc pleuvoir sur Sodôme et Gomorrhe le soufre et le feu du ciel, et il détruisit ces cités et toute la contrée qui les environne. »</p><p>Mes citations finies, j’ajoutai : Ne voyez-vous pas maintenant, mes amis, que l’un de ces trois personnages désignés par les noms de Seigneur et de Dieu, exécutant les ordres de celui qui est dans les cieux, était le Seigneur des deux anges ? car lorsque ceux-ci furent partis pour Sodôme, il resta seul avec Abraham, et lui adressa les paroles que rapporte Moïse. Quand il eut disparu après cet entretien, Abraham retourna dans sa maison ; à peine y fut-il arrivé, qu’il vit non plus les deux anges, mais le personnage mystérieux dont nous parlons, conversant avec Loth : et c’était le Seigneur, recevant du Seigneur qui est dans les cieux, c’est-à-dire du créateur de l’univers, la mission de faire tomber sur Sodôme et Gomorrhe les fléaux retracés par l’Écriture en ces termes : « Le Seigneur fit pleuvoir sur Sodôme et Gomorrhe le soufre et le feu du ciel. »</p><p>LVII. Je me tus et Tryphon prit la parole : — Nous sommes évidemment forcés par les livres saints d’admettre tout ce que vous venez de dire ; mais comment expliquerez-vous ce passage, où il est raconté qu’ils mangèrent les mets qu’avait préparés Abraham et qu’il servit devant eux ? C’est je pense une difficulté qui mérite d’être proposée, vous en conviendrez-vous même.</p><p>— Oui, répondis-je, il est écrit qu’ils mangèrent. En supposant que ceci s’entende des trois personnages et non pas de deux seulement, je veux dire de ceux qui étaient véritablement des anges et qui se nourrissent dans le ciel d’aliments qui ne sont pas, comme il est évident, les mêmes que les nôtres ; car l’Écriture, en parlant de la manne qui nourrissait vos pères dans le désert, dit qu’ils mangeaient le pain des anges ; en supposent, dis-je, que tous trois aient mangé, j’entendrais ces mots de l’Écriture, <i>ils mangèrent</i>, de la même manière que nous disons du feu, « il a tout dévoré, » et non pas comme s’ils avaient fait usage de la bouche et des dents pour manger les mets qui leur étaient servis. Ceci ne doit pas nous arrêter un moment, si nous avons la plus légère idée du style métaphorique.</p><p>— Oui, dit Tryphon, la difficulté n’est plus aussi grande, s’il faut distinguer la manière de manger, et ne pas prendre à la lettre ces paroles de l’Écriture : « Ils mangèrent ce qui leur fut servi par Abraham. » Mais hâtez-vous donc de nous prouver que le Dieu qui apparut à Abraham et que vous nous présentez comme le ministre du Dieu créateur de l’univers est né d’une vierge, s’est fait homme, a souffert tout ce que nous pouvons souffrir. Car voilà ce que vous avez avancé.</p><p>— Pour bien établir ce point essentiel et vous rendre la vérité palpable, permettez-moi, Tryphon, quelques autres développements préliminaires ; je répondrai ensuite directement à ce que vous me demandez.</p><p>Tryphon me répondit : — Faites comme vous l’entendrez, pourvu que vous répondiez à la question.</p><p>LVIII. — Je ne vous citerai que les livres saints, lui dis-je ; je ne veux pas ici étaler un vain appareil de mots, uniquement pour faire parade d’éloquence ; d’ailleurs je n’ai pas ce talent : Dieu m’a seulement donné la grâce de comprendre les Écritures. Je vous conjure tous d’entrer avec moi en partage de cette grâce, puisqu’elle vous est offerte d’une manière si généreuse et si désintéressée. Et si je vous fais cette invitation, c’est pour n’être pas moi même condamné au jour du jugement que le Dieu créateur doit faire subir à tous les hommes par notre Seigneur Jésus-Christ.</p><p>— Votre conduite ici est bien digne de respect, me dit Tryphon ; mais vous me paraissez blesser un peu la vérité, lorsque vous dites que vous ne possédez point le talent de la parole et l’art de bien dire. — Soit, lui dis-je, si vous voulez que je le possède ; mais ce que je vous ai dit à cet égard, c’est bien ce que je pense. J’entre dans le développement de mes autres preuves, donnez-moi toute votre attention.</p><p>— Parlez, répondit-il.</p><p>— Le Dieu qui se fit voir aux patriarches est souvent appelé ange et Seigneur ; c’est ainsi que le désigne Moïse. Et pourquoi, mes chers amis ? C’est afin que vous sachiez qu’il est le ministre du Dieu créateur. Vous en convenez avec moi, et plus vous avancerez, plus vous rencontrerez de nouvelles preuves de cette vérité. L’Esprit saint racontant par Moïse ce qui était arrivé à Jacob, petit-fils d’Abraham, s’exprime en ces termes : « Lorsque le temps de la conception des brebis fut venu, je levai les yeux et je vis en songe les boucs et les béliers monter sur les chèvres et les béliers ; ils étaient marqués de blanc, tachetés, et de couleur cendrée. Et l’ange me dit en songe : Jacob, Jacob ! Et moi je répondis : Qu’y a-t-il, Seigneur ? Et il me dit : Lève les yeux et vois les boucs et les béliers marqués de blanc, tachetés de couleur cendrée, s’approcher des femelles ; car j’ai vu tout ce que t’a fait Laban. Je suis le Dieu qui me suis montré à toi dans ce lieu qui appartient au Seigneur, où tu as imprimé une marque en répandant l’huile sur la pierre et fait un vœu. Maintenant donc sors de cette terre, lève-toi et retourne dans la terre de ta naissance. »</p><p>Dans un autre endroit, l’Esprit saint dit encore au sujet de Jacob : « S’étant levé pendant la nuit, il prit ses deux femmes et ses deux servantes et ses onze enfants, franchit le torrent et fit passer tout ce qu’il possédait. Il demeurera seul et voilà qu’un ange lutta avec lui jusqu’au matin, et quand cet ange vit qu’il ne pouvait le vaincre, il toucha le nerf de sa cuisse qui aussitôt se sécha ; et il lui dit : Laisse moi, car voici l’aube du jour. Jacob répondit : Je ne te laisserai point, si tu ne me bénis. Celui-ci lui dit : Quel est ton nom ? Le patriarche répondit : Jacob. L’ange lui dit : Ton nom ne sera plus Jacob, mais Israël ; car tu as été fort contre Dieu, combien plus tu seras fort contre les hommes ! Alors Jacob lui demanda quel était son nom et il répondit : Pourquoi demandes-tu mon nom ? Et il le bénit, et Jacob appela cet endroit <i>vision de Dieu</i>, disant : J’ai vu le Seigneur face à face, et mon âme s’est réjouie. »</p><p>Ailleurs, l’Écriture dit encore du même Jacob : « Jacob vint donc à Luza, qui est dans la terre de Chanaan et surnommée Béthel ; il vint, lui et tout le peuple qui était avec lui, et il éleva là un autel et il appela ce lieu du nom de Béthel. Car Dieu lui apparut là quand il fuyait son frère Esaü. Alors mourut Débora, la nourrice de Rebecca, et elle fut ensevelie au pied de Béthel sous un chêne, et le nom de ce lieu fut le <i>chêne de pleurs</i>. Or, Dieu apparut encore à Jacob dans Luza, quand il arriva de Mésopotamie de Syrie, et il le bénit lui disant : Ton nom ne sera plus Jacob, mais Israël. »</p><p>Vous le voyez, celui qui apparut à Jacob est appelé Dieu ; il l’est, en effet, et le sera toujours. Ils firent tous un mouvement de tête, pour indiquer qu’ils approuvaient mon explication, et je continuai : Il importe, je crois, de citer encore ici l’endroit de l’Écriture qui nous apprend comment se fit voir à Jacob fuyant devant son frère Esaü, celui qui est désigné tout à la fois sous les noms d’ange de Dieu et de Seigneur, qui se montra à Abraham et lutta contre ce même Jacob sous l’apparence d’un homme ; voici le passage :</p><p>« Or, Jacob, parti de Bersabée, poursuivait son chemin vers Haran.</p><p>« Et arrivé en un lieu où il voulait se reposer, après le coucher du soleil, il prit des pierres qui étaient là et les mit sous sa tête, et dormit en ce même lieu.</p><p>« Et il vit en songe une échelle posée sur la terre et dont le sommet touchait le ciel, et des anges de Dieu qui montaient et descendaient par elle ;</p><p>« Et le Seigneur appuyé sur l’échelle, lui disant : Je suis le Seigneur Dieu d’Abraham ton père et le Dieu d’Isaac. Je te donnerai la terre sur laquelle tu dors, à toi et à ta postérité.</p><p>« Et ta postérité sera comme la poussière de la terre, et sera multipliée en Occident et en Orient, au septentrion et au midi ; et toutes les tribus de la terre seront bénies en toi et en ta postérité.</p><p>« Et je te garderai partout où tu iras, et je te ramènerai en cette terre ; et je ne te délaisserai point jusqu’à ce que j’aie accompli tout ce que j’ai dit.</p><p>« Quand Jacob fut éveillé de son sommeil, il dit : Véritablement le Seigneur est en ce lieu ci, et je ne le savais pas.</p><p>« Et plein d’effroi, il dit : Que ce lieu est terrible ! C’est ici la maison de Dieu et la porte du ciel.</p><p>« Et Jacob, se levant le matin, prit la pierre qu’il avait mise sous sa tête, et l’éleva comme un monument, et y répandit de l’huile.</p><p>« Et il appela Béthel la ville qui avait auparavant le nom de Luza. »</p><p>LIX. Quand j’eus fini, je leur demandai la permission de citer un autre passage : Souffrez, leur dis-je, que je vous montre d’après le livre de l’Exode cet ange, ce Dieu, ce Seigneur, cet homme que virent Abraham et Isaac, apparaissant à Moïse au milieu d’un buisson ardent et conversant avec lui. — Volontiers, s’écrièrent-ils ; loin de vous trouver importun, nous vous écoutons avec plaisir.</p><p>— Voici, leur dis-je, ce que nous lisons dans l’Exode :</p><p>« Et il advint longtemps après que le roi d’Égypte mourut, et les enfants d’Israël gémirent, à cause de la multitude des travaux dont on les accablait. » Et ce qui suit jusqu’à ces paroles : « Va et assemble les anciens d’Israël, et tu leur diras : Le Seigneur, Dieu de vos pères, m’est apparu ; le Dieu d’Abraham, le Dieu d’Isaac et le Dieu de Jacob, disant : Je vous ai visités et j’ai vu toutes les choses qui vous sont arrivées en Égypte. »</p><p>Sur ces paroles je fis cette réflexion : Vous voyez, mes amis, que celui que Moïse regarde comme un ange qui conversait avec lui du milieu d’un buisson ardent déclare à son serviteur Moïse ce qu’il était, c’est-à-dire le Dieu d’Abraham, d’Isaac et de Jacob.</p><p>LX. — Nous ne comprenons pas ce passage comme vous, me dit Tryphon ; nous croyons plutôt que c’est un ange qui se montrait au milieu du feu et que c’est Dieu qui parlait à Moïse, de sorte qu’ils étaient deux dans la vision, Dieu et un ange.</p><p>— Eh bien ! répondis-je, admettons ce que vous dites là, c’est-à-dire que Dieu et un ange se sont fait voir en même temps dans cette circonstance. Vous m’accorderez que celui qui dit à Moïse : « Je suis le Dieu d’Abraham, etc., » n’est pas, comme je l’ai prouvé plus haut, le Dieu créateur de l’univers ; mais le Dieu qui se fit voir à Abraham et à Jacob, le Dieu ministre des volontés de celui qui a tout fait, le Dieu qui vint exécuter les décrets que sa justice avait portés sur Sodôme. Ainsi donc, en supposant avec vous qu’ils fussent deux dans cette vision, Dieu et un ange, qui oserait dire que le Dieu père et créateur de toutes choses ait quitté les hauteurs des cieux pour apparaître sur un petit coin de la terre ?</p><p>— Quand il serait prouvé, me dit Tryphon, que celui qui apparut à Abraham et qui est appelé Dieu et Seigneur aurait reçu du Dieu créateur, qui réside dans le ciel, la mission de punir la terre de Sodôme, qui empêche d’admettre qu’un ange était avec le Dieu qui parlait à Moïse ? Nous n’en conviendrons pas moins que ce Dieu n’est pas le Dieu créateur de l’univers ; mais celui qui apparut à Abraham, à Isaac, à Jacob, et qui est appelé l’ange du Dieu créateur, nom qui lui convient si bien, puisqu’il est chargé de faire connaître aux hommes la volonté du Dieu tout-puissant.</p><p>— Je vais plus loin, Tryphon, je vous prouverai qu’ils n’étaient pas deux dans la vision ; que celui qui est appelé du nom d’ange, et qui est Dieu, était seul quand il s’est montré à Moïse et s’est entretenu avec lui. Voici comme s’exprime l’Écriture :</p><p>« L’ange du Seigneur lui apparut dans une flamme de feu au milieu d’un buisson, et il voyait que le buisson brûlait et ne consumait point. Moïse dit donc : J’irai et je verrai cette grande vision, et pourquoi le buisson ne se consume pas. Mais le Seigneur, voyant qu’il venait pour regarder, l’appela du milieu du buisson. »</p><p>Ainsi que nous l’avons vu, l’Écriture appelle du nom d’ange celui qui apparut en songe à Jacob, et nous apprend après ce qu’est cet ange par ces paroles : « Je suis le Dieu qui t’apparut quand tu fuyais devant Esaü ton frère ; » elle nous dit, à l’époque d’Abraham, qu’il est le Seigneur qui portait de la part du Seigneur résidant au plus haut des cieux la sentence prononcée contre Sodôme. De même, dans la circonstance dont il s’agit, l’Écriture nous dit bien que l’ange du Seigneur apparut à Moïse, mais elle déclare ensuite que cet ange est Dieu et Seigneur, ne parlant ici que de celui qui nous est montré dans une foule d’endroits comme le ministre du Très-Haut, qui ne connaît point de Dieu au-dessus de lui.</p><p>LXI. Je vous prouverai, mes amis, par d’autres témoignages de l’Écriture, qu’avant toutes choses Dieu a engendré de lui-même dès le commencement une vertu, une intelligence que l’Esprit saint appelle la gloire du Seigneur, et désigne souvent par le nom de Fils, de Sagesse, de Dieu, de Seigneur, de Verbe ; celui à qui l’Écriture donne tous ces titres s’appelle lui-même chef suprême : c’est le nom qu’il a pris quand il s’est montré à Josué, fils de Nun sous une forme humaine, car il a tous ces noms comme ministre des ordres de Dieu le père et né de ce père par sa volonté. Ce qui se passe en nous est un exemple de cette génération. La parole que nous proférons nous l’engendrons sans rien perdre de nous-même, car la parole qui est en nous, je veux dire la raison, n’en est pas diminuée. C’est encore ce que nous voyons à l’égard du feu. Une flamme naît d’une autre, sans que la première en soit affaiblie ; la seconde existe et brille, sans diminuer celle à qui elle doit son existence et sa clarté. J’ai pour témoin de ce que j’avance le Verbe divin, le Dieu lui-même engendré du Père de toutes choses, le Verbe et la sagesse, la vertu et la gloire de ce Père tout-puissant. Écoutons ce que la Sagesse, le Verbe, dit par la bouche de Salomon :</p><p>« Lorsque je vous aurai annoncé ce qui arrive chaque jour, je reprendrai les choses depuis le commencement des siècles. Le Seigneur m’a possédée au commencement de ses voies ; avant ses œuvres j’étais. Dès l’éternité j’ai été sacrée ; dès le commencement, avant que la terre fût. Les abîmes n’étaient pas et j’étais engendrée, les sources étaient sans eaux. Les montagnes n’étaient pas encore affermies, j’étais engendré avant les collines. Le Seigneur n’avait pas fait la terre et les fleuves et les montagnes. Lorsqu’il étendait les cieux, j’étais là ; lorsqu’il entourait l’abîme d’une digue ; lorsqu’il suspendait les nuées ; lorsqu’il fermait les sources de l’abîme ; lorsqu’il donnait à la mer des limites et les eaux ne les dépasseront pas ; lorsqu’il posait les fondements de la terre, alors j’étais auprès de lui ; nourri par lui, j’étais tous les jours ses délices, me jouant sans cesse devant lui, me jouant dans l’univers ; et mes délices sont d’habiter avec les enfants des hommes. Maintenant donc, mes enfants, écoutez moi : Heureux ceux qui suivent mes voies ! Écoutez mes leçons et soyez sages, ne perdez pas une de mes paroles. Heureux l’homme qui m’écoute, qui passe les jours à l’entrée de ma maison et qui veille au seuil de ma porte ! Celui qui me trouve, trouve la vie ; son salut viendra du Seigneur. Mais celui qui péche contre moi est le meurtrier de son âme, tous ceux qui me haïssent aiment la mort. »</p><p>LXII. Et cette vérité nous l’apprenons encore de l’Esprit-saint parlant par Moise, lorsqu’il nous montre, au moment de la création de l’homme, Dieu le père s’adressant en ces termes à celui que l’Écriture nous a fait voir comme Dieu en d’autres circonstances :</p><p>« Faisons l’homme à notre ressemblance et à notre image ; qu’il ait l’empire sur les poissons de la mer, sur les oiseaux du ciel, sur les troupeaux, sur toute la terre et tous les reptiles qui rampent sur sa surface. » Et Dieu fit l’homme, il le fit à sa ressemblance ; il fit l’homme et la femme et il les bénit en disant : « Croissez et multipliez, remplissez la terre et régnez sur elle. » Ne changez pas le sens des paroles que je viens de citer ; ne dites pas, comme vos docteurs, que, par ce mot <i>faisons</i>, Dieu s’est parlé à lui-même ; comme il vous arrive souvent de vous dire sur le point d’agir : Faisons cela. Ou bien que, s’adressant aux éléments, c’est-à-dire à la terre, et aux autres corps dont celui de l’homme est formé, Dieu leur ait dit <i>faisons</i> ; je vais vous citer un autre passage de Moïse qui lèvera toute équivoque, vous verrez que Dieu s’adresse ici à une autre intelligence bien distincte de lui-même. C’est ainsi qu’il s’exprime : « Voici qu’Adam a été fait comme l’un de nous, pour qu’il connaisse le bien et le mal. » Par ces mots : « comme l’un de nous, » il exprime clairement un nombre de personnes unies étroitement entre elles et fait entendre qu’elles sont au moins deux. Croyez-vous que j’admette ce qu’avance l’hérésie professée parmi vous ? Comment les maîtres qui l’enseignent pourraient-ils nous prouver que Dieu parle ici aux anges, et que le corps de l’homme est l’ouvrage de ces derniers ? La vérité, la voici : c’est que le Fils engendré du Père était avec lui avant toutes choses, et que le Père s’entretenait avec son fils, ce fils que Salomon appelle la Sagesse de Dieu, que l’Écriture nous montre, par le même Salomon, comme le principe de toutes choses et comme engendré de Dieu, et qui s’est révélé lui-même sous ces traits à Josué, fils de Nun.</p><p>Pour qu’il ne reste dans votre esprit aucun nuage sur la vérité que je soutiens, écoutez ces paroles tirées du livre de Josué : « Comme Josué était dans les champs de la ville de Jéricho, il leva les yeux et vit un homme debout devant lui, tenant une épée nue ; et Josué alla vers lui et lui dit : Es-tu avec nous ou avec nos ennemis ? Celui-ci lui répondit : Je suis le chef de l’armée du Seigneur et maintenant je viens. Josué tomba prosterné contre terre et l’adorant, il dit : Que dit mon Seigneur à son serviteur ? Ôte, dit-il, la chaussure de tes pieds, car le lieu où tu es est saint. Et Josué fit ce qui lui était commandé. Or, Jéricho était fermée et fortifiée dans la crainte des enfants d’Israël, et personne n’osait sortir ni entrer. Et le Seigneur dit à Josué : Voilà que j’ai livré en ta main Jéricho et tous ses guerriers. »</p><p>LXIII. — Rien de plus fort que tous ces témoignages, me dit Tryphon. Il reste un point à établir, c’est que ce fils de Dieu ait bien voulu naître d’une vierge selon la volonté de son père, se faire homme, souffrir le supplice de la croix et mourir, pour ressusciter ensuite et remonter aux cieux. Veuillez maintenant nous le prouver.</p><p>— Ce que vous voulez de moi, mes amis, leur répondis-je, je l’ai déjà fait par toutes les prophéties que j’ai cités et que je vais rappeler et développer de nouveau pour votre instruction. Puissé-je faire passer dans vos esprits toute la conviction du mien ! Je l’essaierai.</p><p>Ces paroles d’Isaïe : « Qui racontera sa génération ? Il a été retranché de la terre des vivants, » ne signifient-elles pas que celui que Dieu a livré à la mort pour les iniquités du peuple n’est pas né de l’homme ? Moïse, parlant de son sang, dit d’une manière mystérieuse qu’il lavera sa robe dans le sang du raisin ; n’est-ce pas nous faire entendre que ce sang lui viendra, non de l’homme, mais de la volonté de Dieu ? Et dans ces paroles de David : « Je vous ai engendré par ma pensée d’un sein mortel avant l’aurore dans la splendeur des cieux. L’Éternel l’a juré, il ne révoquera jamais son serment, vous êtes le prêtre éternel selon l’ordre de Melchisédech, » ne comprenez-vous pas que Dieu annonce qu’il avait résolu de le faire naître un jour du sein d’une femme. Dans un autre passage déjà cité, le Dieu créateur de toutes choses parle de lui en ces termes : « Votre trône, ô Dieu, est un trône éternel ; le sceptre de l’équité est le sceptre de votre empire. Vous aimez la justice et vous haïssez l’iniquité ; c’est pourquoi, ô Dieu, votre Dieu vous a sacré d’une onction de joie, au-dessus de tous ceux qui doivent y participer. La myrrhe, l’ambre et le sandal s’exhalent de vos vêtements, et des palais d’ivoire où les filles des rois font vos délices et votre gloire. La reine, votre épouse, est restée à votre droite, revêtue de l’or d’Ophir. Écoutez, ô ma fille, prêtez une oreille attentive, oubliez votre peuple et la maison de votre père, et le roi sera épris de votre beauté. C’est lui qui est votre Dieu, prosternez-vous devant lui. » D’après tous ces passages des Écritures, il est évident qu’il faut l’adorer, qu’il est déclaré Dieu et son Christ par le témoignage même de celui qui a fait toutes ces merveilles. Tous ceux qui croient en lui n’ont qu’une âme, ne forment qu’une même synagogue, une même Église ; et cette Église qui s’est établie en son nom, qui a pris son nom même, car nous sommes tous appelés Chrétiens, nous est présentée sous le nom de fille par l’Écriture, ainsi que les paroles que nous venons de citer vous l’apprennent en même temps qu’elles vous invitent à laisser dans l’oubli les anciennes pratiques de vos pères. « Écoutez, ô ma fille, nous dit le Seigneur par son prophète, et prêtez une oreille attentive ; oubliez votre peuple et la maison de votre père, et le roi sera épris de votre beauté. C’est lui qui est votre Dieu. Présentez-vous devant lui. »</p><p>— Oui, me dit Tryphon, pour vous autres qui êtes sortis d’entre les gentils et qui avez pris son nom, je veux bien qu’il soit votre Seigneur, votre Dieu, votre Christ, qu’il ait tous les titres dont parle l’Écriture ; mais nous, qui adorons le Dieu qui l’a fait, qu’avons-nous besoin de le reconnaître et de l’adorer ?</p><p>— Si je me laissais conduire comme vous autres, Tryphon, par la légèreté et l’amour de la dispute, je cesserais en ce moment tout entretien avec vous ; car ce qui vous préoccupe c’est moins le désir de comprendre que celui de trouver des objections. Comme je crains la justice de Dieu, je ne veux rien prononcer sur le sort d’un seul d’entre vous ; je ne dis point s’il sera retranché ou non d’entre ceux qui pourraient se sauver par la grâce du Seigneur des armées ; mais vous n’agissez pas ici comme vous le devriez. Quelle que soit votre conduite, je continuerai de répondre à tout ce qu’il vous plaira de me proposer ou de m’objecter. J’agirai donc envers vous comme je le fais envers tous ceux qui veulent discuter avec moi ou me demander des explications sur les points qui nous occupent en ce moment.</p><p>Si vous aviez réfléchi sur les dernières citations que je viens de faire, vous auriez compris que les élus d’entre vous n’ont pu se sauver que par le Christ, qu’ils sont à lui, et vous ne me feriez point à ce sujet de nouvelles difficultés. Faut-il vous rappeler les paroles de David, que j’ai citées plus haut ? Alors tâchez de comprendre, au lieu de chercher de mauvais détours et de vaines subtilités. Voici les paroles de David : « Jéhovah règne, que les peuples tremblent ; il est assis sur les chérubins, que la terre soit émue. Jéhovah est grand en Sion, il est élevé au-dessus de tous les peuples ; que tous célèbrent son nom, ce nom grand, saint et terrible. La force du roi chérit la justice : c’est vous, ô Dieu, qui en avez établi les lois ; vous avez rendu vos jugements et la justice au milieu de Jacob. Célébrez Jéhovah notre Dieu ; prosternez-vous devant son marchepied, car il est saint. Moïse et Aaron ont été ses ministres ; Samuel a invoqué son nom : ils adressaient au Seigneur, et le Seigneur leur répondait ; il leur parlait du milieu de la colonne de feu, et ils gardaient ses oracles et observaient ses lois. »</p><p>J’ai cité d’autres paroles de David que vous rapportez à tort au roi Salomon, parce qu’on lui en a fait l’application. Ces paroles mêmes suffisent pour prouver qu’elles ne peuvent s’entendre de ce prince, mais seulement de celui qui existe avant les siècles, et que si vous êtes sauvés, vous ne le serez que par lui. Voici comme s’exprime le prophète : « Seigneur, donnez au roi vos jugements et au fils du roi votre justice, il jugera votre peuple dans la justice et vos pauvres dans l’équité ; les montagnes produiront la paix au peuple et les collines la justice ; il jugera les pauvres d’entre le peuple, il sauvera le fils du pauvre, il brisera l’oppresseur, il sera craint autant que dureront le soleil et la lune, pendant le cours des générations. » Et le reste du psaume jusqu’à ces mots : « Son nom durera autant que le soleil, toutes les nations de la terre seront bénies en lui, toutes les nations le glorifieront. Béni soit le Seigneur, le Dieu d’Israël, qui seul opère les merveilles ! Béni soit à jamais le nom de sa gloire, toute la terre sera remplie de sa majesté ! Qu’il soit ainsi, qu’il soit ainsi. » Rappelez-vous également ces autres paroles de David déjà citées. Le prophète vous montre le Christ descendant des cieux et remontant aux cieux, pour vous faire comprendre qu’il est venu du ciel en qualité de Dieu, qu’il s’est fait homme pour habiter parmi les hommes, qu’il doit un jour reparaître, que ceux qui l’ont percé le verront et pousseront des gémissements. Citons de nouveau cette prophétie : « Les cieux racontent la gloire de Dieu et le firmament annonce l’œuvre de ses mains ; le jour parle au jour et la nuit à la nuit. Il n’est point de discours, point de langage dans lequel on n’entende cette voix ; son éclat s’est répandu dans tout l’univers, il a retenti jusqu’aux extrémités de la terre. Dieu a placé le pavillon du soleil au milieu des cieux, semblable à un nouvel époux qui sort de son lit nuptial, cet astre s’élance comme un géant dans sa carrière ; il part des extrémités de l’aurore et il s’abaisse aux bornes du couchant ; rien ne se dérobe à la chaleur de ses rayons. »</p><p>LXV. — Je vous avoue, me dit Tryphon, que l’autorité de tous ces passages est fort imposante ; mais je ne sais comment les concilier avec d’autres où Dieu déclare qu’il ne cédera sa gloire à personne ; il le dit formellement dans Isaïe : « Je suis le Seigneur Dieu, c’est mon nom ; je ne céderai à nul autre ni ma gloire, ni mes attributions. »</p><p>— Si c’est de bonne foi, lui dis-je, que vous vous êtes arrêté après ces paroles, sans rappeler d’abord celles qui précèdent et sans y rattacher celles qui suivent, on peut vous le pardonner ; mais si vous avez voulu me dresser un piége et me forcer à dire que les Écritures se contredisent, vous vous êtes trompé, je n’oserai jamais ni le dire ni même penser que vous ayez eu cette intention. Quand on vient me proposer de semblables passages qui paraissent en contredire d’autres, j’avoue ingénuement que je ne les comprends pas, persuadé comme je le suis que l’Écriture ne peut être opposée à elle-même, et je tâche d’amener à mon sentiment ceux qui pourraient avoir cette pensée. Dans quelle intention avez-vous proposé cette difficulté ? Dieu le sait. Je veux vous rappeler tout le passage tel qu’il est, et vous comprendrez que Dieu ne communique sa gloire à personne qu’à son Christ. Ainsi donc, mes amis, je reprendrai plus haut quelques paroles auxquelles se rattache et d’où découle le passage que vient de citer Tryphon, comme aussi je rappellerai celles qui suivent ce passage et qui s’y lient étroitement. Les paroles que je cite ici, je ne vais pas les prendre de différents côtés, je les cite telles qu’elles se trouvent dans leur liaison et dans leur ensemble ; les voici, veuillez m’écouter : « C’est ici la parole du Seigneur, du Dieu qui a créé et étendu les cieux, qui affermit la terre et la couvre de fruits, qui donne le souffle aux animaux et la vie aux hommes. Moi le Seigneur, je t’ai appelé dans les décrets de ma justice, je te prendrai par la main, je te défendrai, je te donnerai pour signe d’alliance à mon peuple et pour lumière aux nations. Tu ouvriras les yeux des aveugles, tu briseras les fers des captifs, tu délivreras de la servitude ceux qui étaient assis dans les ténèbres. Je suis moi-même mon nom, je ne donnerai point ma gloire à un autre, et à des idoles les louanges qui me sont dues ; ce que je vous ai prédit n’est-il pas arrivé ? Je vous annonce des événements nouveaux, écoutez avant qu’ils arrivent ; chantez au Seigneur des cantiques, que ces louanges soient publiées d’un bout à l’autre ; que la mer et sa vaste étendue retentissent de sa gloire. Îles, habitants des îles, chantez, chantez le Seigneur ; que le désert et les villes élèvent leurs voix. Cédar qui habitez les palais, ville de Pétra, faites entendre ses louanges, poussez des cris d’allégresse du haut des montagnes. Mortels, portez-lui vos hommages ; annoncez sa gloire dans les îles. Le Seigneur, Dieu des vertus, sortira de son silence ; il ranimera son zèle comme un guerrier qui marche au combat ; il élève sa voix, il jette des cris et fond sur ses ennemis. » Ma citation finie, je les interpellai : Eh bien ! mes amis ne voyez-vous pas que Dieu déclare qu’il communiquera sa gloire, mais pas à d’autres qu’à celui qu’il a établi pour être la lumière des nations, et qu’il n’est pas vrai de dire avec Tryphon qu’il renferme cette gloire en lui seul ?</p><p>— Oui, nous l’avons bien compris, dit Tryphon ; achevez de démontrer ce qui vous reste à prouver.</p><p>LXVI. Alors, reprenant la suite des idées que j’avais interrompues et par lesquelles j’avais commencé à prouver que le Christ est né d’une vierge, et que le prophète Isaïe avait prédit que c’était en effet d’une vierge qu’il devait naître, je crus devoir citer de nouveau cette prédiction, conçue en ces termes : « Alors le Seigneur parla encore à Achaz et lui dit : Demande un prodige au Seigneur ton Dieu, au plus profond de l’abîme ou au plus haut des cieux. Achaz répondit : Je me tairai, je ne tenterai pas le Seigneur. Le prophète s’écria : Écoutez, maison de David ; n’est-ce pas assez pour vous de lasser la patience des hommes, faut-il que vous lassiez encore celle de mon Dieu ? C’est pourquoi le Seigneur vous donnera lui-même un signe. Voilà que la vierge concevra et enfantera un fils, et il sera appelé Emmanuel ; il se nourrira de lait et de miel, jusqu’à ce qu’il sache rejeter le mal et choisir le bien. Avant que l’enfant puisse nommer son père et sa mère, la puissance de Damas sera détruite et les dépouilles de Samarie seront portées en triomphe devant Assur, et cette terre que vous détestez sera abandonnée par ses deux rois. Prince, le Seigneur amènera, par les armes du roi d’Assyrie, sur vous et sur votre peuple et sur la maison de votre père, des jours tels qu’on n’en a jamais vu de semblables depuis la séparation d’Éphraïm et de Juda. » Alors j’ajoutai : — N’est-il pas évident pour tout le monde qu’il n’est personne du sang d’Abraham, excepté Jésus notre Christ, qui soit né ou bien qu’on ait dit être né d’une vierge ?</p><p>LXVII. — L’Écriture, reprit Tryphon, ne dit pas : « Voilà qu’une <i>vierge</i> concevra et enfantera un fils, » mais « voilà qu’une <i>jeune fille</i>, etc. » La suite est bien conforme à ce que vous avez dit ; quant à la prophétie elle s’entend d’Ézéchias, car tout ce qui s’y trouve s’est réalisé dans sa personne. On raconte d’ailleurs quelque chose de semblable dans les fables des Grecs ; n’y lit-on pas que celui qu’on appelle Jupiter s’approcha d’une vierge nommée Danaé, et descendit en elle en prenant la forme d’une pluie d’or, et que c’est ainsi que vint au monde un certain Persée ? Ne devriez-vous pas avoir honte de vous rencontrer avec les Grecs ? Il serait mieux, je pense, de convenir que votre Jésus est un homme né d’entre les hommes, et que s’il est vraiment le Christ et que vous puissiez le prouver par les Écritures, c’est un honneur qu’il a mérité par sa parfaite soumission à la loi et l’admirable pureté de sa vie ; mais ne venez pas nous débiter avec confiance de pareilles chimères, de semblables prodiges, si vous ne voulez pas qu’on vous accuse de tomber dans toutes les extravagances des Grecs.</p><p>— Il est une chose, Tryphon, dont je veux que vous soyez bien persuadé ainsi que tout le monde, c’est que lors même que vous enchéririez sur vos sarcasmes et vos plaisanteries, vous ne pourriez tant soit peu m’ébranler. De tout ce que vous venez de dire pour tâcher de me réfuter, je tirerai de nouvelles preuves en faveur de ma cause et je les fortifierai du témoignage des Écritures. Mais vous ne procédez pas en véritable ami de la vérité : nous étions tombés d’accord sur ce point, que plusieurs observances de la loi ne vous avaient été imposées par Moïse qu’à raison de la dureté de votre cœur, et vous voulez maintenant rétracter ce que vous aviez admis ! Car vous venez de nous dire que c’est pour avoir vécu conformément à la loi, que Jésus a été marqué du sceau de l’élection divine et qu’il est devenu le Christ, s’il est toutefois possible de démontrer qu’il le soit.</p><p>— Mais, reprit Tryphon, ne nous avez-vous pas dit vous-même qu’il avait reçu la circoncision et observé les autres préceptes de la loi de Moïse ?</p><p>— Oui, repris-je, je l’ai dit et je le dis encore ; mais je n’ai pas prétendu qu’il eût regardé toutes ces observances de la loi comme un moyen de se sanctifier, et que c’est pour cela qu’il s’y était soumis. Tout ce que j’ai voulu dire, c’est qu’il était venu selon la volonté de son père, le Seigneur, le Dieu de toutes choses, accomplir ses décrets éternels, et je dis que dans cette vue il a consenti à se faire homme, à mourir sur une croix, à tout souffrir de la part de votre nation. Mais, Tryphon, puisque vous revenez sur ce que vous avez admis, répondez-moi : les justes et les patriarches qui ont vécu avant Moïse, et qui par conséquent n’ont pu observer une loi que l’Écriture ne fait remonter qu’à lui, seront-ils sauvés, auront-ils part ou non à l’héritage des saints ?</p><p>— Ils seront sauvés, répondit-il, les Écritures m’obligent de l’admettre.</p><p>— J’ai une autre question à vous faire, lui dis-je : est-ce parce qu’il en avait besoin, que Dieu a commandé à vos pères de lui offrir des présents et des victimes ? Ou bien était-ce à cause de la dureté de leur cœur et de leur pente vers l’idolâtrie ?</p><p>— Les Écritures me forcent encore ici d’être de votre avis.</p><p>Alors je repris : — Dites-moi si Dieu avait promis ou non de donner un Testament nouveau, après celui qui fut donné sur le mont Oreb.</p><p>Il me répondit que les Écritures l’annonçaient formellement.</p><p>— Mais l’ancien Testament, continuai-je, ne fut-il pas donné à vos pères au milieu d’un si grand appareil de terreur et d’effroi, qu’ils ne pouvaient entendre la voix de Dieu, ni même souffrir qu’il leur parlât ?</p><p>— Je l’avoue, me dit-il.</p><p>— Pourquoi donc, lui dis-je, Dieu a-t-il promis de donner un nouveau Testament, et annoncé qu’il ne le donnerait plus comme le premier, au milieu de l’appareil terrible du tonnerre et des éclairs ? Ne voulait-il pas nous montrer quelle différence il mettait entre la loi éternelle faite pour tous les hommes, et la loi propre à votre peuple et accommodée à la dureté de son cœur, comme il le déclare par les prophètes.</p><p>— Tous ceux qui aiment la vérité, me répondit Tryphon, seront nécessairement de votre avis ; vous ne trouverez d’opposition que de la part de ceux qui ne cherchent qu’à disputer.</p><p>— Et comment, répliquai-je, pouvez-vous faire ici le procès aux esprits contentieux, quand vous les imitez ? car vous rétractez ce que vous avez admis.</p><p>LXVIII. — Le tort n’est pas de mon côté, mais du vôtre, me dit Tryphon ; vous voulez nous faire croire ce qui est incroyable, impossible. Peut-on supposer qu’un Dieu se soit abaissé jusqu’à naître et se faire homme ?</p><p>— Si je ne m’appuyais pour le prouver, lui dis-je, que sur les raisonnements de l’homme, sur de vains systèmes, vous auriez raison de ne pas m’écouter. Mais si je raisonne d’après les Écritures, si je vous cite non pas un passage, mais une multitude de passages qui établissent cette vérité ; si je ne me borne pas à vous les citer une fois, mais plusieurs, vous conjurant de les comprendre, vous vous raidissez contre la parole et la volonté de Dieu qu’il faudrait plutôt apprendre à connaître, vous endurcissez vos cœurs. En persévérant dans les dispositions où je vous vois, c’est à vous-mêmes que vous faites tort. Vous ne me nuisez en rien, car je resterai ce que j’étais avant de vous avoir rencontré et je prendrai congé de vous.</p><p>— Mais comprenez, mon ami, me dit Tryphon, que vous n’êtes arrivé là qu’après beaucoup de travail et d’étude. Il nous faut donc aussi examiner longtemps cette grande question, et ne donner notre assentiment que lorsque l’Écriture nous y force.</p><p>— Je ne vous demande pas non plus, mes amis, d’admettre sans le plus sérieux examen tout ce qui fait l’objet de nos discussions. Mais ce que je vous demande, c’est de ne pas vous rétracter ni revenir sans cesse sur vos pas, lorsque vous n’avez plus rien à dire.</p><p>— C’est ce que nous tâcherons de faire, me dit Tryphon.</p><p>— Outre les questions que je vous ai proposées, lui répondis-je, j’en ai d’autres encore à vous adresser ; peut-être par cette voie parviendrai-je plus vite à terminer la discussion.</p><p>— Faites-les, me dit Tryphon.</p><p>— Croyez-vous qu’il soit dit dans les Écritures qu’il faille adorer un autre Seigneur, un autre Dieu que le créateur de l’univers, et son Christ qui s’est fait homme, comme je vous l’ai prouvé par tant de passages ?</p><p>— Comment vous répondre ici affirmativement, me dit Tryphon, quand tout à l’heure nous agitions la grande question de savoir s’il existait un autre Dieu que le père de toutes choses ?</p><p>— N’est-il pas nécessaire que je sache de vous si vous n’avez pas maintenant sur Dieu d’autres sentiments que ceux que vous aviez tout à l’heure ?</p><p>— Ils n’ont pas changé. Ce fut toute la réponse de Tryphon.</p><p>— Puisque l’Écriture vous dit, en parlant du Christ : « Qui racontera sa génération ? » Et que vous admettez le sens de ces paroles, ne devez-vous pas comprendre qu’il n’est pas né de l’homme ?</p><p>— Mais pourquoi, reprit Tryphon, est-il dit à David dans l’Écriture que Dieu se choisira un fils né de lui, qu’il lui donnera l’empire, qu’il le placera sur le trône de sa gloire ?</p><p>— Oui, Tryphon, si cet oracle d’Isaïe : « Une vierge conçut, » s’adressait à une autre maison des douze tribus qu’à celle de David, il pourrait y avoir quelque doute ; mais comme la prophétie concerne la famille de ce roi, que fait Isaïe ? La chose que Dieu avait annoncée à David d’une manière mystérieuse, il l’expose clairement telle qu’elle devait arriver. Peut-être ne savez-vous pas que plusieurs événements annoncés d’abord d’une manière obscure, sous le voile de la parabole ou du mystère, ou figurés par quelques actions symboliques, sont ensuite éclaircis et développés par d’autres prophètes qui viennent après les personnages dont les paroles ou les actions n’étaient dans le principe qu’une légère ébauche de ces événements à venir ?</p><p>— Oui, c’est très-vrai, s’écria Tryphon.</p><p>— Si je prouve que la prophétie d’Isaïe regarde notre Christ, et non pas Ézéchias, comme vous le prétendez, cesserez-vous enfin de vous en rapporter à vos docteurs qui osent soutenir que la version des Septante faite sous Ptolémée, roi d’Égypte, est infidèle en plusieurs endroits ? Car tous les passages qui prouvent évidemment combien leurs interprétations sont insensées, combien ils sont pleins d’eux-mêmes, ils ne craignent pas de dire qu’on les a altérés, qu’ils ne sont pas conformes au texte. Mais trouvent-ils un passage qui leur paraisse susceptible de pouvoir être modifié et amené à signifier une action purement humaine, ils disent que ce passage ne s’entend pas de notre Christ ; ils l’appliquent à tout autre personnage qu’il leur plaît d’imaginer. C’est ainsi qu’ils ont dit que les paroles qui nous occupent se rapportaient à Ézéchias ; mais je vous montrerai comme je vous l’ai promis la fausseté de leur assertion. Leur opposons-nous les endroits de l’Écriture qui montrent si clairement que le Christ doit souffrir, qu’il faut l’adorer, qu’il est Dieu ? l’évidence les force de convenir qu’il s’agit ici du Christ ; mais ils osent dire que le nôtre n’est pas ce Christ promis ; que du reste ils ne contestent pas que celui-ci ne vienne un jour, qu’il ne doive souffrir, régner et être adoré comme Dieu. Je vous ferai voir aussi combien ce langage est ridicule et insensé. Mais je suis pressé de répondre d’abord à ces assertions aussi peu raisonnables que vous avez tout-à-l’heure émises. J’arriverai ensuite aux preuves qu’il nous reste à vous donner.</p><p>LXIX. Sachez donc, Tryphon, que toutes les fables répandues parmi les Grecs, par celui que nous appelons le démon, et qui ne sont que des altérations de nos livres saints, que les prodiges qu’il a opérés par les magiciens d’Égypte et par les faux prophètes du temps d’Élie, ne servent qu’à me confirmer dans ma foi aux divines Écritures et dans la manière dont je les entends. Lorsqu’on me dit que Bacchus est né de Jupiter et de Sémélé, qu’il est l’inventeur de la vigne, qu’il fut mis en pièces, qu’il mourut, qu’après il ressuscita et remonta au ciel, que le vin est employé dans la célébration de ses mystères : est-ce que je ne retrouve pas là l’oracle de Jacob, que rapporte Moïse, mais imité, falsifié par le démon ? Lorsqu’on me raconte qu’il exista un héros invincible du nom d’Hercule, qu’il parcourut toute la terre, qu’il naquit de Jupiter et d’Alcmène, qu’il est monté au ciel après avoir souffert la mort, est-ce que je ne reconnais pas encore ici la trace du démon ? Est-ce que je ne vois pas bien qu’il a cherché à contrefaire cet endroit où l’Écriture nous présente le Christ s’élançant comme un géant infatigable pour fournir sa carrière ?</p><p>Et si on me parle d’un certain Esculape ressuscitant les morts, guérissant toutes sortes de maladies, puis-je m’empêcher de m’écrier : c’est encore ici une altération des oracles qui concernent le Christ ?</p><p>Je n’ai encore fait mention d’aucun de ces oracles qui annoncent les prodiges du Christ, je dois au moins vous en citer un ; vous verrez comment l’Écriture s’adresse aux hommes qui étaient, comme un véritable désert, sous le rapport de la connaissance de Dieu, je veux dire les gentils, qui avaient des yeux et ne voyaient pas, de l’intelligence et ne comprenaient pas, et adoraient des dieux faits de main d’hommes ; vous verrez, dis-je, comment l’Écriture leur annonce qu’ils laisseront là leurs idoles pour croire au Christ. Voici la prophétie qui les regarde :</p><p>« Le désert se réjouira, la solitude sera dans l’allégresse et fleurira comme un lys, elle germera de toutes parts ; ses hymnes, ses transports témoigneront sa joie ; la gloire du Liban lui est donnée, ainsi que la beauté du Carmel. Connaissez la gloire du Seigneur et la grandeur de mon Dieu. Fortifiez les mains languissantes, affermissez les genoux tremblants. Dites aux cœurs chancelants : Fortifiez-vous et ne craignez point, voilà que votre Dieu amènera la vengeance due à sa gloire ; il vient lui-même et vous sauvera. Alors les yeux des aveugles et les oreilles des sourds seront ouverts, le boiteux sera agile comme le cerf, la langue du muet sera prompte et rapide ; alors les rochers du désert seront brisés, des fleuves arroseront la solitude. La terre la plus aride est devenue un lac, des fontaines jaillissantes arrosent des terres arides ; là où habitaient les serpents s’élèvera la verdure des roseaux et des joncs. Oui, on verra une source d’eau vive au sein d’une terre desséchée. » Et cette source qui a jailli au milieu de la terre aride des gentils, si nous considérons quelle était leur ignorance du vrai Dieu, n’est-ce pas Jésus-Christ qui d’abord a paru au milieu de vous guérissant les aveugles de naissance, les sourds, les boiteux, faisant par la seule vertu de sa parole marcher celui-ci, entendre celui-là, voir cet autre ? Il fit plus encore : il rappelait les morts à la vie ; il essayait, à force de prodiges, de réveiller l’attention des hommes qui vivaient alors pour les obliger à le reconnaître. Mais ceux-ci attribuaient à la magie les miracles qu’ils lui voyaient opérer. Ils osaient dire que c’était un magicien, un imposteur qui trompait le peuple.</p><p>Mais savez-vous quel motif le portait encore à opérer ces prodiges ? Il voulait convaincre ceux qui croiraient en lui que, s’ils étaient fidèles à garder ses préceptes, quelles que soient leurs infirmités corporelles, ils reprendraient un corps pur et intact au jour de son second avénement, qu’ils ressusciteraient immortels, exempts de corruption, impassibles.</p><p>LXX. Quand ceux qui racontent les mystères du dieu Mithra nous disent qu’il est né d’une pierre et appellent caverne le lieu où l’on dit qu’il initie lui-même à son culte ceux qui croient en lui, puis-je encore ici m’empêcher de reconnaître une imitation de cet endroit où Daniel nous montre une pierre se détachant sans effort d’une haute montagne, et de la prophétie d’Isaïe dont ils ont même essayé d’imiter les paroles ? Car les adorateurs de Mithra ont aussi voulu qu’on tînt chez eux des discours sur la pratique de la justice. Mais citons les paroles d’Isaïe, vous comprendrez mieux la vérité de ce que j’avance :</p><p>« Peuples éloignés, apprenez ce que j’ai fait ; peuples voisins, reconnaissez ma puissance. Les impies ont été saisis d’effroi dans Sion, la terreur a été parmi les hypocrites. Qui de vous soutiendra les ardeurs éternelles ? Celui qui marche dans les sentiers de la justice et qui rend hommage à la vérité, qui rejette les présents, n’écoute pas les paroles sanguinaires et ferme les yeux pour ne pas voir le mal : celui-là habitera sous la caverne élevée d’une roche inexpugnable ; l’eau et le pain lui seront constamment donnés. Vous verrez votre roi dans l’éclat de sa gloire et vous porterez au loin vos regards. Votre âme méditera la crainte du Seigneur. Où est le savant ? où est celui qui entreprend de donner des conseils ? Qui compte ceux qui sont nourris ? Les petits et les grands ? Ils n’ont pu entrer en conseil avec lui, ni comprendre la profondeur de ses paroles : de sorte qu’ils n’ont rien su. Peuple vicieux, qui ne comprend pas quand on lui parle. »</p><p>Il est évident que, dans cette prophétie, il s’agit de ce pain que notre Christ nous a ordonné d’offrir en mémoire du corps qu’il a pris pour le salut de ceux qui croient en lui et en faveur desquels il s’est rendu passible. Il est clair qu’il s’agit aussi du calice sur lequel il a recommandé de prononcer des paroles d’actions de grâce en mémoire de son sang.</p><p>La même prophétie ne nous annonce-t-elle pas que nous verrons un jour ce roi dans toute sa gloire ? Ne nous dit-elle pas que le peuple qui devait croire en lui, et que le prophète voyait déjà, s’appliquerait à méditer la crainte du Seigneur, que c’était un fait connu d’avance ? Enfin, les mêmes oracles peuvent-ils élever plus haut la voix pour vous dire que ceux qui croient entendre les Écritures ne les comprennent pas lors même qu’on les leur explique.</p><p>Pour moi, quand j’entends raconter que Persée est né d’une vierge, je comprends, Tryphon, que c’est un passage de nos livres saints que l’astucieux serpent a tenté d’imiter.</p><p>LXXI. M’en rapporterai-je à vos docteurs, qui prétendent que les soixante-dix vieillards réunis chez Ptolémée, roi d’Égypte, n’entendaient pas les divines Écritures, et qui refusent d’admettre leur interprétation pour nous donner la leur.</p><p>Je ne veux pas vous laisser ignorer que ces docteurs ont retranché de la version faite avec tant de soin par les soixante-dix vieillards chez Ptolémée une foule de passages qui attestent que les divins oracles avaient annoncé que ce Jésus mis en croix était Dieu, était homme ; qu’il serait crucifié, qu’on le ferait mourir. Comme je sais que tous les vôtres refusent d’admettre ces passages, je crois inutile de m’y arrêter. Je m’attache de préférence à ceux que vous ne contestez pas ; car vous avez reconnu tous ceux que j’ai cités. Vous n’avez élevé de difficulté que sur le mot <i>vierge</i> de cette prophétie : « Voilà qu’une <i>vierge</i> concevra, etc. » Vous prétendez qu’on doit dire : « Voilà qu’une <i>jeune fille</i>. » Je vous ai promis de vous prouver que cette prophétie doit s’entendre non d’Ézéchias, comme vous l’avancez, mais uniquement de notre Christ, et c’est aussi cette preuve que je vais vous donner.</p><p>Mais avant, me dit Tryphon, citez-nous donc, nous vous en prions, quelques-uns des passages retranchés, dites-vous, par nos docteurs.</p><p>— Vous le désirez, lui répondis-je, je vais vous satisfaire. De l’endroit où Esdras parle de la loi portée sur la pâque, ils ont retranché ces mots : « Et Esdras dit au peuple : Cette pâque, c’est notre Sauveur et notre refuge. Si vous saviez, s’il entrait dans votre esprit qu’il arrivera que nous l’humilierons par la croix ? Si du moins dans la suite nous espérions en lui, ce lieu ne serait pas désolé pour toujours, nous dit le Dieu des vertus. Mais si vous ne croyez pas à sa parole, si vous ne l’écoutez pas lorsqu’elle vous sera annoncée, vous serez le jouet des nations. » De Jérémie, ils ont supprimé ces mots : « Je suis comme un agneau que l’on porte au lieu du sacrifice. Voici ce qu’ils méditaient contre moi ; ils disaient : Venez, donnons-lui du bois au lieu de pain. Retranchons-le de la terre des vivants et que son nom s’efface à jamais. » Ce passage se lit encore dans quelques-uns des exemplaires conservés par vos synagogues ; car il n’y a pas longtemps qu’il a été retranché.</p><p>Quand on prouve aux Juifs, d’après ce passage, que leur projet était de crucifier le Christ et de le faire mourir ; quand on leur montre d’ailleurs l’identité de ce même passage avec celui d’Isaïe qui nous présente le Messie conduit à la mort comme une brebis, ils se trouvent dans un étrange embarras et vous les voyez recourir aux injures et aux blasphèmes. N’oublions pas cet autre endroit de Jérémie qu’ils ont également supprimé : « Le Seigneur Dieu s’est souvenu de ses morts d’Israël, qui sont endormis dans la terre des tombeaux, et il est descendu vers eux pour leur évangéliser son salut. »</p><p>LXXIII. Du quatre-vingt-quinzième psaume de David, ils ont fait disparaître ces deux mots : « par le bois. » Le texte portait : « Dites aux nations : Le Seigneur a régné par le bois. » Ils ont laissé : « Dites aux nations : Le Seigneur a régné. » Voyez s’il est un seul Israélite dont on ait pu dire, comme de Dieu et du Seigneur, qu’il a régné sur les nations, excepté ce Jésus crucifié et ensuite ressuscité, affranchi de la mort comme l’atteste l’Esprit saint dans le même psaume. Il déclare encore qu’il n’a rien de commun avec les dieux des nations ; que ceux-ci ne sont que des simulacres qui représentent les démons. Pour que vous compreniez bien le sens du psaume, je vais vous le citer tout entier.</p><p>Le voici : « Chantez à Jéhovah un nouveau cantique ; que toute la terre entonne des hymnes à Jéhovah. Célébrez Jéhovah, bénissez son nom, annoncez de jour en jour que notre salut vient de lui. Racontez sa gloire parmi les nations, et ses merveilles au milieu de tous les peuples. Jéhovah est grand, il est digne de toutes nos louanges, il est terrible par dessus tous les dieux. Tous les dieux des nations ne sont que de vains simulacres, mais Jéhovah a fait les cieux. La gloire et la majesté marchent devant lui ; la force et la splendeur sont dans son sanctuaire. Apportez à Jéhovah famille des nations, apportez à Jéhovah la gloire et la puissance. Apportez à Jéhovah la gloire due à son nom ; apportez votre offrande, entrez dans ses parvis. Courbez-vous devant Jéhovah dans la splendeur de son sanctuaire ; habitants de la terre, tremblez en sa présence. Dites parmi les nations : Jéhovah règne, la terre sera affermie et ne sera point ébranlée ; il va juger les peuples selon sa justice. Que les cieux s’en réjouissent, que la terre tressaille, que la mer mugisse avec tout ce qu’elle renferme. Que les campagnes et tout ce qui les habite soient dans l’allégresse, que les arbres des forêts tressaillent de joie devant Jéhovah ; il vient, il vient juger la terre ; il jugera l’univers dans sa justice et les peuples dans sa vérité. »</p><p>Tryphon me répondit : — Dieu seul peut savoir si les princes du peuple ont retranché, comme vous le dites, quelque passage des Écritures ; du reste, la chose me paraît incroyable.</p><p>— Ainsi doit-elle vous paraître, lui répondis-je ; car ils ont commis un crime bien plus affreux que lorsqu’ils élevèrent un veau d’or, après avoir été nourris par la manne dans le désert ; que lorsqu’ils immolèrent leurs enfants au démon, que lorsqu’ils firent mourir les prophètes eux-mêmes ; mais supposez que je ne vous ai point parlé des passages qu’ils ont frauduleusement supprimés, est-ce que tant d’autres déjà cités, indépendamment de ceux que nous citerons plus tard et que vous admettez avec nous, ne suffisent pas et au delà pour établir la vérité des points que nous discutons en ce moment ?</p><p>LXXIV. — Oui, dit Tryphon, nous le savons, c’est sur notre demande que vous avez cité tous ces passages ; mais le dernier psaume de David, dont vous venez de parler, ne peut s’appliquer, il me semble, qu’au Dieu créateur du ciel et de la terre ; vous, au contraire, vous prétendez qu’il se rapporte à cet homme de douleur que vous voulez donner pour le Christ.</p><p>— Faites attention, je vous prie, lui répondis-je, à la manière dont j’emploie les paroles de l’Esprit saint qui se trouvent dans ce psaume, et vous verrez que nous ne cherchons pas à vous tromper ou à nous tromper nous-mêmes. Quand vous m’aurez quitté et que vous serez livré à vos propres réflexions, vous comprendrez par vous-même que ce passage comme tant d’autres ne peut s’entendre que du Christ. « Chantez à Jéhovah un cantique nouveau ! Que toute la terre entonne des hymnes à Jéhovah. Chantez Jéhovah, bénissez son nom, annoncez de jour en jour que notre salut vient à lui : racontez ses merveilles à toutes les nations. » Que fait ici l’Esprit saint ? Il exhorte tous les peuples de la terre qui ont le bonheur de connaître le mystère du salut, c’est-à-dire le passion du Christ, par laquelle Dieu les a sauvés, à chanter sans cesse des hymnes en l’honneur du Dieu créateur et père de toutes choses, à publier qu’il mérite nos louanges, qu’il est le Dieu grand et terrible ; que c’est lui qui a tout créé, que c’est de lui que nous vient le salut, c’est-à-dire le Christ qui fut mis en croix, qui a souffert la mort et qui règne maintenant sur le monde. Car il est venu remplacer l’alliance rendue vaine par l’impiété de vos pères. Témoin ce passage :</p><p>« Et ce peuple, s’élevant en tumulte, se prostituera à des dieux étrangers dans la terre où il va entrer pour y habiter. Il me délaissera et rendra vaine l’alliance que j’ai établie avec lui. Et ma fureur s’embrasera contre lui en ce jour, et je le délaisserai, et je lui cacherai ma face, et il sera en proie à tous les maux, et toutes les afflictions l’envahiront, de sorte qu’il dira en ce jour : Parce que Dieu n’est pas avec nous, ces maux m’ont envahi. Et moi je cacherai et je célerai ma face en ce jour, à cause de tous les maux qu’il a faits, parce qu’il a suivi des dieux étrangers. »</p><p>Moïse publie dans le livre de l’Exode, et toujours d’une manière mystérieuse, que Jésus-Christ est le nom même de Dieu, ce nom qui ne fut révélé ni à Abraham, ni à Jacob, et dont nous avons le secret. C’est ainsi qu’il s’exprime :</p><p>LXXV. « Dieu dit à Moïse : Voilà que j’enverrai mon ange devant vous, afin qu’il vous précède et vous garde en votre voie et qu’il vous introduise au lieu que je vous ai préparé. Respectez-le, et écoutez sa voix et ne le méprisez point, car il ne vous pardonnera point parce que mon nom est en lui. » Par qui vos pères ont-ils été introduits dans la terre-promise ? N’est-ce point par celui qui fut surnommé Jésus et qui s’appelait auparavant Ausès ? Réfléchissez et vous comprendrez que Jésus fut aussi le nom de celui qui dit à Moïse : « Mon nom est en lui. » Il s’appelait encore Israël, surnom qu’il donna à Jacob. On désigne sous le nom d’anges et d’apôtres, les prophètes qui sont envoyés pour porter ses ordres, ainsi que nous l’apprenons par ces paroles d’Isaïe : « Envoyez-moi, Seigneur. » Or, n’était-il pas le grand prophète, le prophète par excellence, celui qui reçut le nom de Jésus ? S’il a pu se montrer sous tant de formes à Abraham, à Jacob, à Isaac, ainsi que nous le savons, pouvons-nous un moment douter ou refuser de croire qu’il ait pu naître d’une vierge et se faire homme, pour se conformer à la volonté de son père, surtout quand une multitude de passages nous prouvent que ce mystère s’est accompli comme tant d’autres, en vertu de la même volonté ?</p><p>LXXVI. Et ces paroles : <i>comme le fils de l’homme</i>, par lesquelles Daniel désigne celui qui reçut l’empire éternel, ne font-elles pas entendre ce que nous voulons établir, c’est-à-dire qu’il est homme, qu’on a vu en lui un homme, sans qu’il soit pour cela né de l’homme ? Que signifie cette pierre mystérieuse détachée d’elle-même ? Que tout est ici l’ouvrage, non pas de l’homme, mais de la volonté de Dieu, le père tout-puissant, qui seul a engendré celui que désignent ces paroles : <i>Comme le fils de l’homme</i>. Et celles d’Isaïe : « Qui racontera sa génération ? » ne signifient-elles pas, en d’autres termes, qu’elle ne peut être racontée et que par conséquent elle n’est pas l’ouvrage de l’homme ; car il n’est pas d’homme né de son semblable, dont on ne puisse faire connaître l’origine.</p><p>Au sujet de la robe qu’il lave « dans le sang de la vigne, » ainsi que s’exprime Moïse, nous ne répéterons pas ce que nous avons déjà dit plusieurs fois : que par là le prophète nous annonçait d’une manière mystérieuse que le sang du Christ ne vient pas plus de l’homme que le sang du raisin, mais de Dieu seul. Lorsque Isaïe l’appelle l’ange du grand conseil, ne fait-il pas connaître d’avance qu’il sera le maître et le précepteur des nations, comme il l’est en effet par la doctrine qu’il est venu leur annoncer ? Car le grand conseil du Père sur tous ceux qui lui ont été et qui lui seront agréables, comme sur les hommes et les anges rebelles à sa volonté, n’a été hautement révélé que par Jésus ; témoins ces paroles : « Je vous déclare que plusieurs viendront d’Orient et d’Occident et s’assoiront avec Abraham, Isaac et Jacob dans le royaume des cieux ; mais les enfants du royaume seront jetés dans les ténèbres extérieures, et plusieurs me diront en ce jour : Seigneur, Seigneur, n’avons-nous pas prophétisé en votre nom, chassé les démons et fait grand nombre de prodiges ? Et alors je leur dirai : « Retirez-vous de moi. » Par ces autres paroles, où se trouve la condamnation de ceux qui seront jugés indignes du salut, nous apprenons à connaître quelle doit être la sentence du juge : « Allez, leur dira-t-il, pliez dans les ténèbres extérieures que le Père a préparées pour Satan et pour ses anges. » Ailleurs, il s’adresse en ces termes à ses disciples : « Voici que je vous donne la puissance de marcher sur les serpents, sur les scorpions et les scolopendres, et de fouler aux pieds toutes les forces de l’ennemi. » En effet, nous qui croyons en Jésus-Christ crucifié sous Ponce-Pilate ne réduisons-nous pas sous notre puissance, par les exorcismes tous les démons, tous les génies mauvais ? Les prophètes avaient prédit d’une manière mystérieuse que le Christ devait souffrir et régner ensuite sur toutes choses, et personne n’avait compris le sens de leurs oracles jusqu’au jour où il les dévoila lui-même à ses apôtres ; car il leur avait dit, bien avant d’être attaché à la croix : « Il faut que le Fils de l’homme souffre toutes ces choses, qu’il soit rejeté par les scribes et les pharisiens, qu’on le mette à mort et qu’il ressuscite le troisième jour. » David avait annoncé que celui qui existe avant le soleil et la lune, naîtrait d’un sein mortel, d’après la volonté de son père, et déclaré en même temps qu’il était le Dieu fort, en sa qualité de Christ, et devait être adoré.</p><p>LXXVII. — Je conviens avec vous, dit Tryphon, que toutes ces raisons sont d’un grand poids et bien capables de persuader ; mais revenez à ce passage dont vous nous avez promis l’explication, je ne vous en fais pas grâce. Montrez-nous comment vous pouvez en tirer une preuve en faveur de votre Christ ; car nous prétendons que ce passage ne peut s’entendre que d’Ézéchias.</p><p>— Volontiers, Tryphon, lui répondis-je, je vais me conformer à vos désirs ; mais auparavant, prouvez-moi qu’il ait été dit d’Ézéchias qu’avant de pouvoir nommer son père et sa mère, il s’était emparé à la vue du roi des Assyriens de la puissance de Damas et des dépouilles de Samarie. Vous prétendez qu’Ézéchias fit la guerre à Samarie et à Damas, à la vue du roi des Assyriens ; je ne vous laisserai pas donner cette interprétation arbitraire ; car voici ce que dit le prophète : « Avant que l’enfant ait appris à nommer son père et sa mère, il s’emparera de la puissance de Damas et de Samarie, etc. » Si, au lieu d’ajouter : « Avant de pouvoir connaître son père et sa mère, etc., » l’Esprit saint s’était contenté de dire : « Elle enfantera un fils qui se rendra maître de Damas et de Samarie, » vous pourriez peut-être dire que Dieu, qui connaissait d’avance les victoires que devait remporter Ézéchias, les avait annoncées ; mais il ajoute ces mots : « Avant que l’enfant ait appris à nommer son père et sa mère. » Citez-nous quelqu’un de votre nation à qui chose semblable soit arrivée ; vous ne le pouvez pas ; pour nous, il nous est facile de montrer que notre Christ a réalisé la prophétie. À peine est-il né, que des mages partis de l’Arabie viennent d’adorer après s’être présentés d’abord à Hérode qui régnait sur votre contrée, et qui est ici désigné sous le nom du roi des Assyriens, à cause de son impiété et de la perversité de son cœur : vous savez que l’Esprit saint emploie souvent ces comparaisons et ces paraboles, pour exprimer de pareilles dispositions. Quand il accable de reproches Jérusalem et tout son peuple, ne dit-il pas en style figuré : « Ton père est Amorhéen et ta mère Chétéenne. »</p><p>LXXVIII. Lorsque les mages venus d’Arabie eurent dit à Hérode : « Une étoile que nous avons vue dans le ciel nous a fait comprendre qu’il était né un roi dans votre contrée et nous sommes venus l’adorer, » que fit ce prince ? Il interrogea les anciens du peuple, et ceux-ci lui répondirent qu’en effet un prophète avait dit au sujet de Bethléem : « Et toi, Bethléem, terre de Juda, tu n’es pas la plus petite entre les principautés de Juda ; de toi sortira un chef qui conduira mon peuple. » Mais quand les mages arrivés dans cette ville eurent adoré l’enfant et lui eurent offert des présents d’or, d’encens et de myrrhe, Dieu les avertit de ne pas retourner vers Hérode. C’est ainsi qu’avant leur arrivée, Joseph, l’époux de Marie, qui voulait la renvoyer parce qu’il croyait qu’elle avait conçu d’un homme et qu’elle était adultère, fut averti par une vision de ne pas suivre cette pensée. Il apprit de l’ange qui lui apparut que ce n’était pas de l’homme, mais de l’Esprit saint qu’elle avait conçu ; et Joseph, frappé de crainte, se garda bien de la renvoyer. Le recensement qui se fit pour la première fois en Judée sous Cyrenius l’obligea de se rendre de Nazareth, où il demeurait, à Bethléem, lieu de sa naissance, pour s’y faire inscrire ; car il était de la tribu de Juda qui habitait cette contrée. Il reçut l’ordre ensuite de se retirer en Égypte et d’y demeurer avec Marie et l’enfant, jusqu’à ce que Dieu les avertît de retourner en Judée. L’enfant naquit donc à Bethléem, dans une espèce de grotte, près de ce bourg où Joseph n’avait pu trouver à se loger ; c’est dans cette grotte que Marie mit au monde le Christ et qu’elle le coucha dans une crèche, et c’est là que les mages venus d’Arabie le trouvèrent. Je vous ai déjà montré qu’Isaïe avait parlé de cette espèce de grotte d’une manière mystérieuse et figurée.</p><p>Alors je citai de nouveau la prophétie d’Isaïe et j’ajoutai que le démon, pour l’imiter, supposa que le dieu Mithra initiait à ses mystères dans un lieu désigné sous le nom de caverne, et le fit publier par les prêtres de ce dieu. Les mages ne revinrent point trouver Hérode, comme il les en avait priés ; ils étaient retournés dans leur patrie par un autre chemin ; Joseph et Marie, de leur côté, s’étaient réfugiés en Égypte avec l’enfant, pour obéir à l’ordre qu’ils avaient reçu d’en haut. Hérode, ne pouvant dès lors parvenir à connaître où était l’enfant que les mages étaient venus adorer, ordonna que tous ceux qui étaient nés vers la même époque dans Bethléem fussent mis à mort. Et voilà ce qui avait été annoncé par Jérémie, à qui l’Esprit saint fait dire bien avant l’événement : « Une voix a été entendue dans Rama : Il y aura des pleurs et des gémissements. <i>Rachel pleure ses fils, et n’a pas voulu être consolée, parce qu’ils ne sont plus</i>. » Ainsi donc, par cette voix qui devait se faire entendre de Rama, c’est-à-dire de l’Arabie, où l’on trouve encore une ville de ce nom, était annoncé ce long gémissement qui devait remplir le lieu où Rachel, femme du patriarche Jacob surnommé Israël, fut ensevelie, je veux dire Bethléem, lorsque les mères eurent à pleurer leurs enfants égorgés, et à pleurer sans pouvoir se consoler de leur mort. Ces paroles d’Isaïe : « Il renversera la puissance de Damas et s’emparera des dépouilles de Samarie, » voulaient dire que le Christ, aussitôt après sa naissance, triompherait des démons adorés à Damas ; et n’est-ce pas ce qui est arrivé, comme le prouve l’événement ? Car les mages que le démon avait enlevés ainsi qu’une dépouille et poussait au mal, quand il les tenait en son pouvoir, abandonnèrent, dès qu’ils eurent connu le Christ, cette puissance funeste établie à Damas, comme le dit l’Écriture en termes mystérieux. Cette même puissance injuste et rebelle est justement appelée Samarie par similitude dans nos livres saints ; et qui de vous oserait dire que Samarie n’est pas et n’a pas toujours été une ville d’Arabie, bien qu’elle fasse partie aujourd’hui de la contrée qu’on appelle syrophœnicienne ? Mes amis, dans l’ignorance où vous êtes, que ne venez-vous vous instruire à l’école de ceux dont Dieu a daigné ouvrir l’intelligence, je veux parler ici des Chrétiens. Vous faites d’inutiles efforts pour établir votre doctrine au mépris de celle de Dieu ; car c’est à nous que la grâce a été transférée, comme le dit Isaïe :</p><p>« Parce que ce peuple en m’approchant m’honore du bout des lèvres et que son cœur est loin de moi, parce que son culte repose sur la loi et la science des hommes, c’est pourquoi voici ce que je ferai pour donner à ce peuple un signe merveilleux, un prodige : Je détruirai la sagesse des sages ; j’obscurcirai l’intelligence de ceux qui se croient habiles. »</p><p>LXXIX. Alors, Tryphon, avec un accent de colère retenu par le respect qu’il portait aux Écritures, mais qui se trahissait par l’air de son visage, me dit : — La parole de Dieu est sainte ; mais vos interprétations, comme on peut le voir par tout ce que vous venez de dire, sont arrangées avec trop d’art, ou plutôt, sont impies. Quoi ! vous dites que des anges ont fait le mal et abandonné le Seigneur.</p><p>Alors je baissai la voix pour mieux disposer son esprit à m’entendre et je lui dis : — J’admire ici, Tryphon, votre piété, et je vous demande de la reporter avant tout sur le Dieu à qui obéissent les anges, et que Daniel nous montre comme le Fils de l’homme devant le trône de l’ancien des jours recevant de lui l’empire pour les siècles des siècles. Mais afin de vous convaincre, Tryphon, que nous n’aurions pas osé donner de nous-mêmes l’interprétation dont vous vous plaignez, j’invoquerai le témoignage d’Isaïe : il vous dira qu’à Tanis, en Égypte, de mauvais anges habitaient autrefois et habitent encore aujourd’hui. Écoutez ses paroles :</p><p>« Malheur à vous, enfants rebelles, dit le Seigneur, qui formez vos desseins sans moi, qui ourdissez des trames criminelles et qui ajoutez l’iniquité à l’iniquité, qui voulez descendre en Égypte sans mes ordres, qui vous confiez à la force de Pharaon et vous reposez à l’ombre de l’Égypte ! la force de Pharaon sera votre confusion, votre repos à l’ombre de l’Égypte sera votre honte. À Tanis, il y a des princes, et ce sont de mauvais anges. En vain ils travailleront pour le peuple, il ne leur sera d’aucun secours ; et loin de les secourir, il sera poux eux un sujet de confusion et de honte. » Zacharie dit aussi, comme vous l’avez rappelé vous-même : « Que Satan était à la droite du grand-prêtre Jésus pour s’opposer à lui. Et que Jéhovah dit à Satan : Le Seigneur te confondra, le Seigneur qui a choisi Jérusalem. »</p><p>Ne lit-on pas dans le livre de Job, et je cite ici vos propres paroles : <i>Que des anges se tenaient debout devant le Seigneur et que Satan se trouvait avec eux ?</i> Moïse ne raconte-t-il, pas au commencement de la Genèse, que le serpent trompa Ève et fut maudit ? Ne savez-vous pas que les magiciens d’Égypte essayaient d’imiter les prodiges que Dieu opérait par Moïse, enfin n’ignorez-vous pas que David appelle démons les dieux des gentils ?</p><p>LXXX. — Je vous ai déjà dit, reprit Tryphon, que vous saviez habilement prendre toutes vos précautions pour vous tirer d’embarras quand vous citez l’Écriture, et vous mettre en lieu de sûreté. Mais, dites-moi, est-ce de bonne foi que vous avancez que Jérusalem sera rebâtie ? que votre peuple s’y rassemblera, pour y vivre heureux avec le Christ en la compagnie des patriarches, des prophètes et des justes de l’ancienne loi, ou même de ceux d’entre nous qui se convertiraient à votre Christ avant qu’il apparaisse de nouveau ; ou bien est-ce pour mieux montrer votre habileté dans la controverse que vous avez émis une pareille opinion ?</p><p>— Tryphon, je ne suis pas homme à dire ce que je ne pense pas. Je vous ai déjà fait l’aveu que plusieurs partageaient avec moi ce sentiment ; mais je vous ai dit aussi que beaucoup d’autres dont la doctrine est pure et saine sont d’un avis différent. Nous ne tenons pas compte de ceux qui se disent Chrétiens, mais qui au fond ne sont que des hérétiques impies ou athées ; je vous ai dit que tout ce qu’ils enseignaient n’était qu’un tissu de blasphèmes aussi impies qu’extravagans ; et pour que vous soyez bien convaincu que ce n’est pas seulement devant vous que je m’exprime comme je l’ai fait, je composerai un ouvrage selon mes faibles talents qui reproduira toutes les discussions que nous avons eues ensemble et dans lequel je professerai toutes les doctrines que je professe en votre présence ; car je déclare qu’il ne faut pas s’attacher à l’homme ou à sa doctrine, mais à Dieu et à tout ce qu’il enseigne. Si vous rencontrez des gens qui se disent Chrétiens et qui, au lieu de suivre ces principes, osent blasphémer le Dieu d’Abraham, le Dieu d’Isaac et de Jacob, et dire qu’il n’y a pas de résurrection des morts, mais qu’aussitôt après cette vie les âmes sont reçues dans le ciel, gardez-vous de les considérer comme Chrétiens ; ainsi tout homme de bon sens ne rangera point parmi les Juifs ceux qu’on appelle saducéens, et les sectes semblables connues sous le nom de genistes, de méristes, de galiléens, de hellénistes, de pharisiens, de baptistes. Souffrez que je vous dise tout ce que je pense, il ne comptera pas non plus parmi les Juifs ceux qui ne sont Juifs et enfants d’Abraham que de nom et qui honorent seulement Dieu des lèvres, tandis que leur cœur est loin de lui, ainsi qu’il s’en plaint lui-même. Mais, pour moi et pour les Chrétiens, dont la doctrine est pure sur tous les points, nous savons qu’il y aura une résurrection des corps, que nous passerons mille ans dans Jérusalem rebâtie, embellie, agrandie comme nous le promettent Isaïe, Ézéchiel et d’autres prophètes.</p><p>LXXXI. — Écoutez ce que dit Isaïe sur ce règne de mille ans :</p><p>« Je vais créer de nouveaux cieux et de nouvelles terres, et le passé ne sera plus dans ma mémoire et ne s’élèvera plus sur mon cœur. Réjouissez-vous pour l’éternité, soyez dans l’allégresse ; je vais créer une Jérusalem toute de délices, et un peuple pour la joie. J’aimerai mon peuple, je trouverai ma joie dans Jérusalem. On n’y entendra plus ni plainte, ni clameur, on n’y verra point de vieillard ou d’enfant qui n’accomplisse ses jours, la vie de l’enfant sera aussi précieuse que celle du vieillard, et le pécheur à tous les âges sera maudit. Mon peuple bâtira des maisons et les habitera, il plantera des vignes et en recueillera le fruit. Mes élus n’abandonneront plus leur maison et leurs vignes à des étrangers. Les jours de mon peuple égaleront les jours des plus grands arbres. Les œuvres de ses mains ne vieilliront jamais. Ses travaux ne seront pas vains. Les femmes n’enfanteront plus dans le trouble. Race bénie du Seigneur, leur postérité le sera avec eux. Je les exaucerai avant leur prière et je les écouterai encore. Le loup et l’agneau se joueront ensemble, le lion et le taureau iront aux mêmes pâturages, la poussière sera l’aliment du serpent. Aucun de ces animaux, dit le Seigneur, ne nuira ni ne donnera la mort, sur toute la montagne sainte. » Ces paroles : « Les jours de mon peuple égaleront les jours des plus grands arbres, et les œuvres de ses mains ne vieilliront jamais, » ne semblent-elles pas désigner d’une manière mystérieuse une durée de mille ans. Il fut dit à Adam qu’il mourrait, le jour même qu’il aurait mangé du fruit défendu, et nous savons qu’il vécut près de mille ans ? C’est qu’en effet, aux yeux du Seigneur, mille ans sont comme un jour, et ces mots du prophète trouvent encore ici leur application. Ajoutez le témoignage d’un apôtre de Jésus-Christ, un de nos écrivains sacrés, nommé Jean. Il nous annonce, parmi les choses qui lui furent révélées, que ceux qui auront eu foi en notre Christ passeront mille ans à Jérusalem, qu’ensuite tous les hommes ressusciteront ensemble et en un même moment, que cette résurrection sera générale, éternelle, et qu’il y aura pour tous un jugement. Notre Seigneur lui-même nous l’apprend par ces paroles :</p><p>« Ils ne se marieront point, mais ils seront semblables aux anges en leur qualité d’enfants de Dieu dignes de la résurrection. »</p><p>LXXXII. Le don de prophétie subsiste encore parmi nous ; de là vous pouvez comprendre vous-mêmes que les prérogatives dont vous jouissiez autrefois nous ont été transférées. Mais comme vous avez eu de saints et de faux prophètes, nous avons aussi des hommes d’une haute vertu et de faux docteurs. C’est pourquoi notre maître nous a recommandé de nous tenir sur nos gardes, pour éviter toute espèce de surprise, puisque nous sommes certains qu’il connaissait tout ce qui devait nous arriver quand il serait ressuscité d’entre les morts et remonté aux cieux. Il nous avait annoncé qu’on nous ferait mourir, que nous serions en but à la haine à cause de son nom ; qu’il s’élèverait plusieurs faux Christs, plusieurs faux prophètes qui séduiraient un grand nombre de fidèles. N’est-ce pas ce qui est arrivé ? Plusieurs ont altéré la vérité et sont venus, au nom du Christ, nous débiter je ne sais combien d’impiétés, de blasphèmes et de mensonges. Tout ce que l’esprit impur, c’est-à-dire le démon, a pu leur suggérer, ils l’ont enseigné et l’enseignent encore aujourd’hui. Et nous leur disons tout ce que nous vous répétons à vous-mêmes pour tâcher de les arracher à l’erreur. Car nous avons toujours en perspective ce jugement que doit subir tout homme qui peut enseigner la vérité et qui ne le fait pas. C’est Dieu lui-même qui nous le dit en ces termes par le prophète Ézéchiel : « Je t’ai établi sentinelle dans la maison d’Israël ; quand le pécheur a commis l’iniquité, si tu ne l’avertis point, il mourra dans son péché, mais je te redemanderai son sang ; si tu l’invites à se convertir, ton âme sera sauvée. » C’est la crainte des jugements de Dieu qui nous porte à discourir sur les livres saints, et nous n’écoutons ici ni l’avarice, ni la vaine gloire, ni l’amour du plaisir. Je ne crois pas, d’ailleurs, que personne puisse nous reprocher d’agir par aucun de ces motifs. Nous nous gardons bien de nous conduire comme les chefs de notre peuple, à qui le Seigneur adresse ce reproche : « Vos chefs s’associent aux brigands, ils aiment les présents et recherchent un salaire. » Et quand il se trouverait parmi nous des hommes de ce caractère, serait-ce un motif de blasphémer contre le Christ, et de fausser partout le sens des Écritures ?</p><p>LXXXIII. Prenons ces paroles : « Le Seigneur a dit à mon Seigneur : Asseyez-vous à ma droite, jusqu’à ce que je réduise vos ennemis à vous servir de marchepied. » Voyez le sens que vos docteurs leur ont donné ; ils ont osé dire qu’elles s’entendaient d’Ézéchias et signifiaient que Dieu lui avait ordonné de s’asseoir dans le temple du côté droit, lorsqu’il reçut un message menaçant du roi d’Assyrie et que Dieu lui fit annoncer par Isaïe de bannir toute crainte. Nous savons, nous reconnaissons que l’événement justifia les paroles d’Isaïe, que le roi d’Assyrie au temps d’Ézéchias fut contraint de lever le siége de Jérusalem, que cent quatre-vingt-cinq mille Assyriens furent égorgés dans leur camp par l’ange du Seigneur ; mais il est évident qu’il ne s’agit pas d’Ézéchias dans ce psaume. Témoins les paroles qui le composent : « Le Seigneur a dit à mon Seigneur : Asseyez-vous à ma droite, jusqu’à ce que je réduise vos ennemis à vous servir de marchepied. Il étendra sur Sion le sceptre de son autorité ; il dominera au milieu de ses ennemis. Je vous ai engendré avant l’aurore, au milieu de la splendeur des saints. Le Seigneur l’a juré, il ne révoquera pas son serment. Vous êtes le prêtre éternel selon l’ordre de Melchisédech. »</p><p>Ézéchias a-t-il été prêtre éternel selon l’ordre de Melchisédech ? Qui oserait le dire ? Est-ce bien lui d’ailleurs qui a délivré Jérusalem, qui a étendu sur cette ville la puissance de son sceptre, qui a porté la terreur au milieu du camp des Assyriens ? Ne sait-on pas qu’il pleurait et se lamentait, que c’est Dieu qui, touché de ses larmes et de ses prières, dissipa les ennemis ? Mais celui qui a véritablement étendu sur Jérusalem le sceptre de son autorité, c’est notre Christ même avant son règne de gloire, quand il a appelé au salut et invité à la pénitence toutes les nations que les démons tenaient sous leur empire, comme le dit David, « les démons sont les dieux de nations. » Combien a été puissante la parole du Verbe ? Elle a fait abandonner à une multitude d’hommes le culte des démons, elle les a affranchis de ce honteux esclavage. Par elle, ils ont été amenés à croire au Dieu créateur et à reconnaître leurs dieux pour ce qu’ils étaient, c’est-à-dire pour de véritables démons.</p><p>À l’égard de ces paroles : « Je vous ai engendré avant l’aurore dans la splendeur des saints, » nous avons déjà dit qu’elles ne pouvaient s’entendre que du Christ.</p><p>LXXXIV. Et c’est encore lui que regarde cette autre prophétie : « Voici qu’une vierge concevra et enfantera un fils. » Car si le personnage dont parle Isaïe ne devait ps naître d’une vierge, je demande quel est celui que l’Esprit saint pouvait avoir en vue, quand il s’écriait : « Voici que le Seigneur nous donnera un signe : une vierge concevra dans son sein et enfantera un fils. » Car si ce fils devait naître comme naissent tous les premiers-nés, c’est-à-dire d’une fille encore vierge, quelle merveille se trouvait dans le signe que Dieu voulait donner ? Pourquoi dit-il que ce signe n’aura rien de commun avec ce qui arrive dans la génération des premiers-nés ? Mais ce qui était un signe vraiment extraordinaire, ce qui devait être un signe certain pour tous les hommes, c’est que celui qui existe avant toutes choses, et qu’on appelle le premier-né, prit chair et naquit véritablement d’un sein resté vierge. Aussi Dieu le donna-t-il d’avance, ce signe merveilleux, l’annonçant par son Esprit saint de différentes manières, comme je vous l’ai déjà montré, afin que l’événement arrivé, on y reconnût la même puissance, la même volonté que le Créateur de toutes choses signala, quand il fit naître Ève d’une côte d’Adam, quand d’une seule parole il donna l’être à tout ce qui existe. Mais vous autres, que faites-vous ? Vous osez réformer la version des soixante-dix vieillards ; vous prétendez qu’ils ont mal traduit le passage qui nous occupe et qu’il faut dire : « Voici qu’une jeune fille enfantera, etc. » Quelle grande merveille serait donc annoncée, s’il s’agissait ici d’une femme qui dût concevoir comme il arrive à toutes celles qui sont encore jeunes, à moins qu’elles ne soient stériles ? Et même celles-ci, Dieu ne peut-il pas les rendre fécondes, s’il le veut ? n’est-ce pas le prodige qu’il opéra en faveur de la mère de Samuel, de la femme du saint patriarche Abraham, d’Élisabeth, mère de saint Jean et d’autres encore ? Vous ne devez donc pas douter que Dieu ne puisse le faire s’il veut.</p><p>Et lorsqu’il a annoncé qu’il réaliserait dans la suite sa volonté par un fait, comment osez-vous altérer la prophétie, ou lui donner une fausse interprétation qui la détourne de son véritable sens ? Songez-y, vous ne faites ici de tort qu’à vous seuls, vous ne pouvez nuire à Dieu.</p><p>LXXXV. Parlerai-je de cet autre prophétie : « Ouvrez donc vos portes, ô princes ! élevez-vous, portes éternelles ; donnez entrée au roi de gloire. » C’est encore une de ces prophéties que vous osez par vos perfides interprétations détourner de leur véritable sens. Les uns l’appliquent à Ézéchias, les autres à Salomon ; mais elle ne s’entend ni de l’un, ni de l’autre, ni d’aucun de nos rois ; il est facile de montrer qu’elle ne peut regarder que notre Christ. Il a paru sans éclat et sans beauté, comme le disent Isaïe, David et toutes les Écritures. Il est le Seigneur des vertus, grâce à la volonté de Dieu le père qui l’a revêtu de cette prérogative ; il est ressuscité d’entre les morts et remonté aux cieux, ainsi que l’avaient annoncé le livre des psaumes et les autres Écritures qui le proclamaient le Dieu des vertus.</p><p>Voulez-vous vous convaincre que ce titre lui appartient ? Vous en avez un moyen facile : voyez ce qui se passe sous vos yeux. N’est-ce point par le nom de ce fils du Très-Haut, de ce premier-né de la création qui naquit d’une vierge, qui fut homme de douleur, que votre peuple a crucifié et fait mourir sous Ponce-Pilate, qui est ressuscité et remonté aux cieux. N’est-ce pas, dis-je, par la vertu de son nom, que le démon, interpellé dans nos exorcismes, s’enfuit et par sa fuite atteste sa défaite ? Interpellez le malin esprit par quelqu’autre nom que vous voudrez, soit de vos rois, soit de vos justes, soit des prophètes ou des patriarches, et vous verrez s’il s’avoue vaincu.</p><p>Toutefois, en invoquant le nom de votre Dieu, le Dieu d’Abraham, le Dieu d’Isaac, le Dieu de Jacob, peut-être parviendrez-vous à le soumettre. Pour vos exorcistes, quels moyens emploient-ils ? Des moyens tout humains, ainsi que je vous l’ai dit, c’est-à-dire des charmes, des amulettes, à la manière des gentils. Mais revenons à la prophétie de David ; c’est aux anges, aux vertus des cieux, que s’adresse l’Esprit saint qui parle dans cette prophétie : il leur ordonne d’ouvrir les portes éternelles, afin de laisser entrer le Seigneur même des vertus, Jésus-Christ, ressuscité d’entre les morts par la volonté de son Père. N’est-ce pas ce que démontrent aussi clairement que tout le reste les paroles mêmes du prophète ? Je les citerai de nouveau en faveur de ceux qui n’étaient point à notre conférence d’hier ; c’est pour eux que je reprends sommairement beaucoup de choses qui ont été dites dans cet entretien. Et si je les rappelle après m’y être longtemps arrêté, je ne crois rien faire en cela de déraisonnable. Trouve-t-on ridicule que le soleil, la lune, les autres astres, parcourent toujours la même route et ramènent toujours les mêmes raisons ; qu’un arithméticien, à qui l’on demande combien font deux et deux, réponde quatre, bien qu’il ait déjà fait plusieurs fois cette réponse ; que l’on continue d’assurer toujours dans les mêmes termes qu’une chose est vraie et certaine, quand on a pu l’assurer une fois avec certitude ? Non, sans doute ; ce qu’on pourrait trouver ridicule, c’est qu’un homme qui ne raisonne que d’après les livres saints les abandonnât un seul moment, ne revînt pas sans cesse aux mêmes passages, quand les mêmes objections reviennent sans cesse, et qu’il pût se flatter de tirer de son propre fonds quelque chose de meilleur que les divines Écritures. Mais voici les paroles par lesquelles le Seigneur, ainsi que je l’ai dit, nous annonce que dans le ciel résident avec lui des anges et des vertus : « Vous qui habitez les cieux, chantez le Seigneur ; chantez-le, vous qui résidez dans les hauteurs du firmament. Louez-le, vous qui êtes ses anges ; louez-le, vous tous qui êtes ses armées et ses puissances. »</p><p>Alors un Juif nommé Mnaseas, du nombre des auditeurs qui nous étaient arrivés le lendemain, s’éleva pour me remercier d’avoir bien voulu reprendre en faveur des nouveaux venus ce que j’avais dit la veille.</p><p>— Les divines Écritures m’en font un devoir, lui répondis-je. Jésus-Christ nous prescrit d’aimer même nos ennemis. Isaïe nous l’avait recommandé dans le long discours où il annonce le grand mystère de notre régénération, dont les effets s’étendent à tous ceux qui vivent dans l’espoir que le Christ reparaîtra au milieu de Jérusalem, et qui cherchent à lui plaire par leurs œuvres. Voici dans quels termes parle le prophète :</p><p>« Écoutez la parole du Seigneur, vous qui tremblez à sa voix. Vos frères vous haïssent ; ils vous rejettent à cause de mon nom, disant : Que la gloire du Seigneur se montre, nous la verrons à votre joie ! Mais ils seront confondus. Voix de tumulte dans la ville, voix du temple, voix du Seigneur qui tire vengeance de ses ennemis. Une mère a enfanté avant d’être en travail, elle a mis au monde un fils avant le temps de la douleur. Qui jamais a ouï rien de tel ? Qui jamais a rien vu de semblable ? La terre produit-elle en un jour ? Une nation se forme-t-elle tout d’un coup ? Cependant Sion a conçu et a mis au monde ses enfants. Moi qui fais enfanter les autres, ne pourrais-je pas enfanter moi-même ? dit le Seigneur. Moi qui donne une postérité aux autres, je serais stérile ! Réjouissez-vous avec Jérusalem, tressaillez d’allégresse avec elle, vous tous qui pleurez sur elle ; vous serez remplis de ses consolations, vous serez inondés du torrent de ses délices, vous jouirez de l’éclat de sa gloire. »</p><p>LXXXVI. Cette citation finie j’ajoutai : Apprenez, mes amis, que celui dont l’Écriture nous annonce le retour glorieux après sa mort sur une croix, non-seulement accomplit tous les jours les prophéties, mais encore réalise les différentes figures qui l’annonçaient. Ces figures, c’est l’arbre de vie planté dans le paradis terrestre, ce sont les différents traits qui devaient signaler la vie de tous les justes.</p><p>Quand Dieu envoie Moïse délivrer son peuple, il lui ordonne de prendre une verge, et Moïse paraît devant le peuple, cette verge à la main. C’est avec cette verge qu’il sépare les eaux de la mer. Par elle il fait jaillir de l’eau d’un rocher. À la faveur du bois qu’il jette dans l’eau appelée Merra, il la rend douce d’amère qu’elle était. C’est avec des verges ou baguettes placées sur des ruisseaux que Jacob rendit fécondes les brebis de son oncle maternel et s’enrichit de leur fécondité. C’est dans sa verge ou bâton qu’il se glorifie quand il parle du fleuve qu’il a pu traverser. Il raconte qu’il vit en songe une échelle. L’Écriture nous montre Dieu lui-même appuyé sur le haut de l’échelle, et nous avons prouvé que ce Dieu n’était pas Dieu le père. Quand Jacob eut versé de l’huile sur une pierre en cet endroit, le Dieu qu’il avait vu lui déclara que c’était à lui-même qu’il venait de consacrer cette pierre.</p><p>Que le Christ ait été figuré par le symbole mystérieux d’une pierre, c’est ce que nous avons prouvé par une multitude de témoignages. Nous avons montré qu’il faut également le voir dans toutes les onctions faites soit avec de l’huile, soit avec de la myrrhe, soit avec un mélange de parfums préparés pour cet usage. L’Écriture ne dit-elle pas en parlant du Christ : « C’est pourquoi, ô Dieu ! votre Dieu vous a sacré d’une onction de joie, au-dessus de tous ceux qui doivent y participer. » Car les rois et tous ceux qui sont appelés christs ont reçu de lui le nom de christs et de rois, comme lui-même a reçu de son père les titres de roi, de Christ, de prêtre, d’ange, en un mot tout ce qu’il a possédé. La verge d’Aaron fleurit et il est déclaré pontife. Une tige doit naître de la racine de Jessé, et le prophète Isaïe nous annonce que cette tige c’est le Christ. À quoi David compare-t-il le juste ? À un arbre planté près du courant des eaux, qui donne des fruits en son temps et dont les feuilles ne tombent point. Ailleurs, il est encore dit du juste qu’il fleurira comme un palmier. C’est d’un arbre que Dieu se fit voir à Abraham, comme le dit l’Écriture, en parlant du chêne de Mambré : Que rencontre le peuple après avoir franchi le Jourdain ? Soixante-dix saules et douze fontaines ? Où David dit-il que Dieu lui a fait trouver sa consolation ? Dans sa houlette et dans son bâton. Élisée laisse tomber dans le Jourdain le fer de sa cognée, et avec le bois jeté dans le fleuve il rappelle le fer à la surface. Ce fer sert aux enfants des prophètes à couper le bois qui devait entrer dans la construction de l’édifice où ils voulaient enseigner et méditer la loi et les commandements du Seigneur. N’est-ce pas ainsi que le poids énorme de nos péchés nous avait plongés dans l’abîme ? Alors le Christ, par le bois sur lequel il a été attaché et par l’eau qui purifie nos souillures, nous a délivrés et s’est formé une maison de prière et d’adoration. C’est encore une verge qui servit à montrer que Judas était le père de ceux qu’il eut de Thamar sous le voile d’un grand mystère.</p><p>LXXXVII. Ici Tryphon m’interrompit : — Si je vous arrête, me dit-il, ne croyez pas que je cherche à détruire l’effet de vos paroles, ou que je questionne pour le plaisir de questionner ; non, c’est uniquement pour m’instruire. Expliquez-moi donc ce passage de l’Écriture ; c’est Isaïe qui s’exprime en ces termes : « Un rejeton naîtra de la tige de Jessé, une fleur s’élèvera de ses racines ; l’esprit de Dieu reposera sur lui, esprit de sagesse et d’intelligence, esprit de conseil et de force, esprit de science et de piété ; il sera rempli de la crainte du Seigneur. » Vous avez appliqué ces paroles à votre Christ ; cependant vous dites qu’il est Dieu, qu’il a précédé toutes choses, que pour obéir à la volonté de Dieu son père, il s’est fait chair, il est né d’une vierge. Mais comment me prouverez-vous qu’avant de se faire homme il ait existé, puisqu’il n’arrive à sa perfection que par les dons de l’Esprit saint énumérés dans la prophétie, et qu’il semble en avoir besoin ?</p><p>— Votre question, lui répondis-je, est fort subtile et très-adroite : le passage présente en effet quelque difficulté ; mais voyez comme tout s’explique ; suivez-moi bien. L’Écriture ne dit pas que tous ces dons descendraient sur lui, comme s’il en eût besoin ; mais qu’ils devaient s’y reposer, c’est-à-dire trouver leur terme en sa personne ; de sorte qu’on ne verrait plus de prophète s’élever chez vous comme autrefois, et c’est bien ce qui est arrivé, comme vous pouvez vous en convaincre par vos propres yeux. Depuis Jésus-Christ, on ne voit plus de prophètes chez vous ; et afin qu’il vous reste clairement démontré que tous ceux qui l’ont précédé, avec une ou deux des vertus dont nous avons parlé, ont entièrement rempli l’objet de leur mission, ainsi que nous l’apprenons des divines Écritures, faites attention à ce que je vais vous dire. Salomon eut l’esprit de sagesse ; David, l’esprit d’intelligence et de conseil ; Moïse, l’esprit de force et de piété ; Élie, l’esprit de crainte ; Isaïe, l’esprit de science ; ainsi des autres prophètes qui gardèrent leur don spécial ou bien en réunirent d’autres à celui qu’ils avaient, comme Jérémie, comme David, comme les douze prophètes, en un mot, tous ceux qui ont prophétisé parmi vous. Eh bien ! l’Esprit s’est reposé ou plutôt a fini après l’arrivée de celui qui devait tout accomplir en son temps ; afin que les dons réunis en sa personne se répandissent de nouveau comme l’avaient prédit les divers oracles ; dons célestes émanés de la vertu de ce divin esprit, et qu’il accorde à ceux qui croient en lui, selon qu’il les en juge dignes.</p><p>Voilà le prodige qui devait suivre son ascension, et que les prophètes avaient annoncé, ainsi que je l’ai déjà dit. Je rappelle ici l’oracle cité plus haut : « Il est monté aux cieux, il a emmené captive la captivité, il a distribué ses dons aux enfants des hommes. » Un autre prophète fait parler le Christ en ces termes : « Arrivera le temps marqué, et je répandrai mon esprit sur toute chair, et sur mes fils et sur mes servantes, et ils prophétiseront. »</p><p>LXXXVIII. Et ne voyez-vous pas qu’en effet, chez nous, hommes et femmes possèdent ces vertus de l’Esprit saint ? Quand Isaïe nous annonce qu’elles reposeront sur le Christ, ce n’est pas qu’il en eût besoin, mais c’est parce qu’il était le terme où elles devaient aboutir. Et nous le voyons déjà par ce que firent les mages qui vinrent l’adorer aussitôt qu’il fut né. À peine a-t-il vu le jour, qu’il développe la vertu qui était en lui. S’il croit à la manière des autres hommes, s’il use de tout ce qui sert à la vie, c’est de lui que tout ce qui le fait croître tire sa vertu. C’est ainsi qu’il se nourrit de tous les aliments et qu’il passa les trente premières années de sa vie, jusqu’au moment où Jean, précurseur de son premier avénement, vint l’annoncer et préparer la voie à son baptême, ainsi que je l’ai déjà dit. Lorsque Jésus parut sur les bords du Jourdain où Jean baptisait, et qu’il fut descendu dans l’eau, une flamme brilla sur le fleuve, et au moment où il sortit de l’eau, le Saint-Esprit, sous la forme d’une colombe, se reposa sur lui, ainsi que nous l’apprennent les apôtres. S’il est venu sur les bords du Jourdain, ce n’est pas qu’il eût besoin de recevoir le baptême ni l’Esprit saint ; de même s’il a consenti à naître, à mourir sur une croix, ce n’est pas qu’il eût besoin pour lui-même de passer par ces différents états ; mais il a voulu s’y soumettre pour le salut du genre humain, tombé dans la mort et dans les piéges du serpent, par la faute d’Adam et par nos prévarications personnelles. Car Dieu, qui avait créé l’ange et l’homme parfaitement libres, et qui voulait leur laisser faire tout ce qu’ils voudraient, en vertu de cette liberté, les plaça dans cette alternative d’être à jamais exempts de châtiments et de corruption, s’ils faisaient les œuvres qui lui plaisent, ou de subir toutes les peines qu’il jugerait à propos de leur infliger, s’ils se portaient au mal qu’il défend. Ce n’est point de son entrée dans Jérusalem, monté sur un âne, ainsi que les prophètes l’avaient annoncée, que Jésus obtint d’être appelé le Christ, il voulait seulement donner aux hommes une marque certaine pour le reconnaître, de même qu’à l’époque où Jean baptisait, il importait de manifester par quelques signes qui des deux était le Christ ; car, lorsque Jean était sur les bords du Jourdain, prêchant la pénitence, portant pour tout vêtement une ceinture de cuir et un habit fait de poil de chameau, ne vivant que de sauterelles et de miel sauvage, plusieurs étaient tentés de croire qu’il était le Christ. Mais il leur disait : « Je ne suis pas le Christ, je ne suis que la voix qui l’annonce ; celui qui est plus fort que moi va paraître ; je ne suis pas digne de porter sa chaussure. » C’est alors que Jésus parut sur les bords du Jourdain. On le croyait fils de Joseph, simple artisan ; il paraissait sans éclat, pour me servir du langage des Écritures. Il passait lui-même pour n’être qu’un ouvrier, car il s’occupa d’ouvrages manuels pendant les premières années de son passage sur la terre ; il faisait des jougs et des charrues, enseignant par son exemple quels sont les caractères distinctifs de la vraie vertu et nous apprenant à mener une vie laborieuse.</p><p>C’est alors que le Saint-Esprit, pour le manifester aux hommes, se reposa sur lui sous la forme d’une colombe, et qu’on entendit du ciel la parole prononcée longtemps d’avance par David, lorsque ce prophète dit au nom du Christ ce que Dieu le père devait dire un jour au Christ lui-même : « Vous êtes mon fils, c’est moi qui vous ai engendré aujourd’hui. » Cette parole annonçait aux hommes, lorsque le Christ se manifesta, que c’était pour eux qu’il était né et qu’il venait d’apparaître.</p><p>LXXXIX. — Vous ne devez point ignorer, me dit Tryphon, que nous attendons tous le Christ, que nous reconnaissons qu’il est annoncé par tous les passages dont vous avez fait mention. Je vous dirai même que j’ai été si frappé du nom de Jésus donnée au fils de Nave, que je vous tendrais volontiers les mains. Mais les prophètes ont-ils vraiment dit du Christ qu’il subirait un supplice aussi honteux que celui de la croix, voilà ce qui ne nous paraît pas clair ; car enfin la loi maudit celui qui est crucifié : aussi est-ce pour moi un point bien difficile à admettre. Oui, les Écritures annoncent clairement que le Christ doit souffrir ; mais doit-il souffrir un supplice maudit par la loi ? Voilà ce que nous voulons savoir de vous, si vous avez quelques moyens de nous le prouver.</p><p>— Si le Christ ne devait pas souffrir, lui répondis-je, si les prophètes n’avaient pas annoncé que les péchés du peuple le conduiraient au supplice, qu’il serait accablé d’outrages, battu de verges, compté parmi les scélérats ; lui dont personne, dit le prophète, ne peut raconter la génération, votre étonnement serait raisonnable ; mais si telle est la marque toute particulière qui distingue le Christ et qui doit servir à le faire reconnaître, comment ne croirions-nous pas fermement en Jésus-Christ ? Tous ceux qui comprennent les prophètes attestent qu’il est le Christ et qu’il n’y en a pas d’autre, si on leur dit seulement qu’il a été mis en croix.</p><p>XC. — Eh bien ! me dit Tryphon, prouvez-nous-le directement, d’après les Écritures, si vous voulez que nous partagions votre conviction. Oui, nous savons que le Christ doit souffrir, qu’il sera conduit à la mort comme une brebis ; mais doit-il être crucifié, peut-il subir une mort aussi honteuse, aussi infâme, puisqu’elle est maudite par la loi ? Tâchez de nous le prouver ; pour nous, la seule idée d’une pareille mort nous révolte.</p><p>— Vous savez, lui répondis-je, et vous convenez avec moi, que les prophètes ont enveloppé d’images et de figures la plupart des choses qu’ils ont dites ou faites, de sorte qu’elles étaient presque incompréhensibles pour le plus grand nombre, et que ce n’était pas sans peine que la vérité cachée sous ces voiles apparaissait à ceux qui la cherchaient et voulaient s’en instruire.</p><p>— Oui, me dirent-ils tous ensemble, nous en convenons avec vous.</p><p>— Écoutez donc la suite, leur répondis-je. Cette croix si détestée en apparence, Moïse l’a représentée par les différents signes qu’il a exprimés.</p><p>— Quels sont ces signes ? me demanda Tryphon.</p><p>— Dans la guerre du peuple hébreux contre Amalec, tandis que le fils de Nave, nommé Jésus, était à la tête de l’armée, Moïse priait les bras étendus ; Or et Aaron les soutinrent dans cette position pendant tout le jour, de peur qu’ils ne vinssent à tomber de lassitude. Si la position de Moïse perdait quelque chose de la forme d’une croix, le peuple était vaincu, ainsi que nous l’apprenons des livres mêmes de ce saint prophète ; mais tant qu’il persévérait dans cette attitude, Amalec perdait l’avantage : ainsi la victoire se trouvait du côté de la croix. Mais ce n’est pas tant cette position de Moïse, pendant sa prière, qui faisait triompher le peuple hébreu, que le nom de Jésus qui se trouvait à la tête de l’armée, lorsque Moïse représentait sa croix sur la montagne. Qui ne sait que la prière la plus efficace est celle qui se fait avec larmes et gémissements, le genou en terre et le corps incliné ! Dans la suite, ni Moïse, ni aucun autre, ne prît sur la pierre cette attitude en forme de croix pendant sa prière. Et la pierre ici n’est-elle pas encore un signe qui représente le Christ et ne convient qu’à lui ?</p><p>XCI. Dieu ne s’est-il pas encore servi d’un autre moyen, au rapport du même Moïse, pour exprimer la puissance du mystère de la croix, lorsqu’il dit dans les bénédictions qu’il donnait à Joseph : « Que Jéhovah bénisse sa terre des fruits du ciel, de la rosée des fleuves qui arrosent la terre, des fruits que le soleil et la lune mûrissent, des fruits des montagnes et des fruits des vallées, et des dons de la terre et de sa plénitude ; que la bénédiction de celui qui apparut dans le buisson vienne sur la tête de Joseph et sur la tête du premier de ses frères. Sa beauté est celle du taureau premier-né, ses cornes sont celles de l’oryx : avec elles il frappera les peuples et les chassera jusqu’aux extrémités de la terre. » Personne assurément ne peut me dire ou me montrer qu’il existe dans la nature un seul objet qui représente les cornes de l’oryx aussi bien que le fait la croix.</p><p>La croix nous présente un morceau de bois vertical, dont le haut s’élève en forme de corne ; la pièce de bois adaptée transversalement offre par les deux extrémités l’image de deux cornes attachées à une seule, et l’autre pièce qu’on place au milieu, pour soutenir ceux qu’on attache à la croix, n’est-elle pas saillante comme une corne, n’est-elle pas en quelque sorte une nouvelle corne qui s’élève au milieu des autres ? Ces mots : « Il attaquera les nations avec ses cornes jusqu’aux extrémités de la terre, » s’expliquent par le spectacle que nous offrent aujourd’hui tous les peuples. Attaqués par la corne, c’est-à-dire touchés de componction par le mystère de la croix, les hommes, dans toutes les nations, passent en foule des autels de leurs vaines idoles, c’est-à-dire des démons, au culte du seul vrai Dieu. Ce même signe est montré aux incrédules comme leur ruine et leur condamnation ; alors se renouvelle le prodige opéré en faveur de votre peuple après la sortie d’Égypte ; dans cette circonstance mémorable, on vit Amalec défait et Israël triomphant par la vertu du signe que formaient les bras étendus de Moïse et par le nom de Jésus donné au fils de Nave. Que dirai-je de la figure de cet autre signe présenté à Israël pour le guérir de la morsure des serpents ? N’est-il pas évident qu’il fut élevé pour sauver les hommes qui croient que ce signe présageait la mort dont frapperait le servent celui qui devait être mis en croix, et le salut dont jouissent ceux qui, blessés par les morsures du serpent, cherchent leur refuge dans le Dieu qui donna au monde ce divin fils mort sur une croix ? L’Esprit saint nous apprenait par Moïse à ne pas croire au serpent, puisqu’il nous le montre, dès le commencement du monde, frappé de la malédiction de Dieu, et qu’il nous le fait voir dans Isaïe comme un ennemi que doit blesser à mort un glaive puissant, et ce glaive c’était le Christ.</p><p>XCII. Sans une grâce toute particulière de Dieu, qui nous donne l’intelligence des actions et des paroles de chacun des prophètes, on ne peut les expliquer, et comment dès lors en parler ? Et si on en parle sans les comprendre, ne s’expose-t-on pas au ridicule et au mépris ? Celui qui vous demanderait comment il peut se faire qu’Énoch, Noé avec ses enfants, et les autres justes de cette époque, aient été agréables à Dieu sans la circoncision et le sabbat, et que, plusieurs siècles après, Dieu ait voulu sauver les hommes par d’autres chefs et par l’institution d’une loi particulière ; que la circoncision soit devenue le moyen de salut pour ceux qui vécurent depuis Abraham jusqu’à Moïse ; que, depuis Moïse, ce ne fut pas seulement la circoncision, mais une multitude d’autres observances, telles que le sabbat, les victimes, les holocaustes, les offrandes, vous ferait blasphémer contre Dieu, si vous ne dites pas ce que j’ai déjà dit, que Dieu dans sa prescience voyait que votre peuple mériterait un jour d’être chassé de Jérusalem, sans pouvoir jamais y rentrer, et qu’il voulut le faire reconnaître par un signe particulier ; et vous l’avez ce signe dans votre chair : car ce qui vous distingue surtout des autres peuples, c’est la circoncision ; mais ce n’est pas elle qui a justifié Abraham, puisque Dieu nous déclare qu’il ne le fut qu’en vertu de sa foi. Il est dit de lui avant qu’il fût circoncis : « Abraham crut à Dieu, et sa foi lui fut imputée à justice. » Et nous autres qui sommes en possession de la seule circoncision nécessaire, je veux dire celle du cœur, nous qui croyons en Dieu par Jésus-Christ, nous espérons bien être trouvés justes et agréables à ses yeux sans votre circoncision selon la chair : nous en avons l’assurance de Dieu lui-même, par le témoignage des prophètes.</p><p>Mais si Dieu vous a obligés d’observer le jour du sabbat, de lui offrir des présents ; s’il a souffert qu’un lieu particulier fût appelé de son nom, vous êtes forcés de reconnaître qu’il l’a fait pour vous empêcher de l’oublier et de tomber dans l’idolâtrie ; et si vous ne le reconnaissiez pas, vous seriez des impies et des athées, reproche que ce silence vous a toujours mérité, ainsi qu’il est évident ; oui, dis-je, c’est pour ce motif que Dieu vous a prescrit le sabbat, qu’il a exigé de vous des offrandes ; je l’ai déjà prouvé et je me plais à le redire pour ceux qui nous sont venus aujourd’hui. Oui, dis-je, sans ce motif, Dieu serait blasphémé ; on l’accuserait de ne pas connaître l’avenir, ou de n’avoir pas établi pour tous les hommes le même moyen de salut ; car bien des générations se sont écoulées avant Moïse, et il ne serait plus vrai de dire avec les divines Écritures que Dieu est juste, qu’il est vrai, que l’équité est dans toutes ses voies, qu’il ne connaît pas le mensonge. Mais l’Écriture ne peut nous tromper, et Dieu veut que vous cessiez d’être ce que vous êtes, c’est-à-dire vains et pleins de vous-mêmes, afin que vous puissiez, comme nous, avoir part au salut, par Jésus-Christ qui fut agréable à Dieu et qui reçut de lui un éclatant témoignage, ainsi que je l’ai prouvé, d’après les oracles des saints prophètes.</p><p>CXIII. Car il n’enseigne rien autre chose que les principes d’équité reconnus partout et en tout temps, et qui forment toute la morale du genre humain. Qui ne sait que l’idolâtrie, la fornication, l’homicide sont des crimes ? tout homme qui les commet ne peut parvenir à s’aveugler au point d’ignorer qu’il fait mal quand il s’y livre.</p><p>J’excepte cependant ceux qui, pleins de l’esprit impur et corrompus par une éducation vicieuse, des usages barbares, des lois atroces, ont perdu ou plutôt éteint en eux les premières notions de l’équité naturelle, ou bien les retiennent captives. Voyez-les dans cet état de dégradation : ils ne peuvent souffrir qu’on leur fasse ce qu’ils se permettent à l’égard des autres, et poussés par une conscience ennemie, ils se reprochent mutuellement le mal qu’ils commettent. Avec quelle sagesse Jésus-Christ, notre Seigneur et notre Sauveur, a renfermé tous les devoirs de la justice et de la piété dans ces deux préceptes : « Vous aimerez le Seigneur votre Dieu de tout votre cœur et de toutes vos forces, et votre prochain comme vous-même. »</p><p>Si on aime Dieu de tout son cœur, de toutes ses forces, si l’âme est entièrement remplie de ce pieux sentiment, on ne portera pas ses adorations à un autre Dieu ; avec Dieu le père on adorera le Seigneur son ange qu’il nous ordonne lui-même d’adorer, et que ce Dieu et Seigneur aime et chérit. Aime-t-on le prochain comme soi-même ? alors on lui veut tout le bien qu’on veut pour soi ; car personne ne se souhaite du mal. Dans cette disposition d’esprit, on demande pour le prochain et on tâche de lui faire tout le bien qu’on se souhaite et qu’on cherche à lui procurer. Par le mot prochain, nous entendons l’être soumis aux mêmes misères que nous, et doué de raison, en un mot, l’homme. Tous les devoirs de la justice se rapportent à deux objets bien déterminés : Dieu et l’homme. Le vrai juste sera donc, d’après l’Écriture, celui qui aime Dieu de tout son cœur et de toutes ses forces, et son prochain comme lui-même. Mais vous, vous ne l’avez jamais montré à l’égard de Dieu et des prophètes, ni envers vous-même, cet amour et cette tendre charité. Qui ne sait que vous avez toujours abandonné Dieu pour des idoles, et fait mourir les justes ? Vous avez poussé l’impiété jusqu’à porter vos mains sur le Christ, et fidèles encore aujourd’hui à votre ancienne perversité, vous chargez de malédictions ceux qui vous prouvent que c’est bien le Christ que vous avez crucifié ; que dis-je ! vous voudriez faire croire que c’est un ennemi de Dieu, chargé de sa malédiction, que vous avez mis à mort. N’est-ce pas le comble de la folie et du délire ? Les signes représentés par Moïse vous offrent le moyen de reconnaître celui qui est le Christ ; mais vous ne le voulez pas, et non contents de ne pas le vouloir, vous cherchez à nous embarrasser, en nous faisant toutes les difficultés qui vous viennent à l’esprit ; et puis vous ne savez plus que répondre, quand vous trouvez un Chrétien qui vous tient tête.</p><p>XCIV. Car, dites-moi, n’est-ce pas Dieu qui, par la bouche de Moïse, défendit de faire aucune image ou figure de tout ce qui est au ciel ou sur la terre ? Et pourquoi donc ce même Dieu, dans le désert, ordonne-t-il à Moïse d’élever un serpent d’airain et de le représenter par un signe qui guérissait les morsures des serpents ? Accuserez-vous Dieu de se contredire ? Ne voyez-vous pas qu’il annonçait par ce signe le grand mystère de la croix, qui devait détruire la puissance du serpent dont la ruse avait, par Adam, introduit le péché dans le monde, qu’il voulait apprendre à ceux qui croient en celui qui devait souffrir par ce signe, c’est-à-dire par la croix, qu’il était vraiment leur salut et le seul qui pût les guérir de toutes les morsures du serpent, et par ces morsures il entendait toutes les actions mauvaises, toute injustice, toute acte d’idolâtrie. Et si ce n’est pas ainsi que vous l’entendez, dites-moi pourquoi Moïse fit élever ce serpent sous la forme d’une croix ? pourquoi il enjoignit à tous ceux qui avaient été mordus par les serpents de le regarder pour être guéris, comme ils le furent en effet, lui qui avait expressément défendu de représenter l’image d’aucun objet ?</p><p>Alors un de ceux qui étaient venus la veille me dit : — Voilà la véritable explication ; nous n’en pouvons pas donner d’autre. J’ai souvent demandé à nos docteurs de m’expliquer cet endroit, jamais ils ne m’ont rien dit de satisfaisant. Continuez donc, je vous prie, le développement que vous avez commencé : nous prêtons la plus grande attention à votre manière d’éclaircir un mystère dont l’obscurité fait blasphémer contre nos divins oracles.</p><p>Alors je repris : — Dieu assurément a pu ordonner à Moïse de représenter en airain l’image d’un serpent, sans encourir pour cela le reproche de s’être contredit : eh bien ! de même, vous pouvez trouver dans la loi une sentence de malédiction contre les crucifiés, sans qu’elle frappe le Christ de Dieu, par qui Dieu le père daigne sauver tous ceux dont les œuvres étaient dignes de malédiction.</p><p>XCV. Car vous verrez que par le péché tout le genre humain est maudit ; tout homme qui n’accomplit pas fidèlement la loi n’est-il pas maudit par la loi ? Or, qui l’observe en tout point ? Personne. Vous n’oseriez dire le contraire. On s’en écarte toujours plus ou moins ; si ceux qui sont sous la loi se trouvent sous la malédiction portée par la loi, parce qu’ils n’en sont pas toujours exacts observateurs, à plus forte raison, les gentils qui adorent les idoles, qui souillent l’enfance par leur turpitude, et se livrent à tant d’autres infamies, sont-ils frappés de malédiction. Si Dieu le père a voulu que son fils prît sur lui les malédictions de tous les hommes, parce qu’il savait bien qu’en le livrant à la mort, et à la mort de la croix, il pourrait aussi le rappeler à la vie, pourquoi parlez-vous de ce divin fils qui s’est résigné à tant souffrir pour obéir à la volonté de son père, comme s’il eût été frappé de malédiction ? Ne devez-vous pas plutôt pleurer sur vous-mêmes ? Son père a voulu, il est vrai, qu’il passât par toutes sortes de souffrances pour le salut du genre humain ; mais vous qui l’avez livré à la mort, cherchiez-vous à exécuter les desseins de Dieu ? Était-ce par amour pour lui que vous faisiez mourir les prophètes ? Ainsi donc, ne dites pas : « Si Dieu a voulu qu’il souffrît, pour nous guérir tous par ses blessures, nous sommes sans crime. » Oui, si en tenant ce langage, vous êtes touchés de repentir, si vous reconnaissez qu’il est le Christ, si vous observez désormais sa loi ; oui, vous serez sans crime. Par lui vous obtiendrez, ainsi que je vous l’ai déjà dit, la rémission de vos péchés. Mais si vous le chargez de malédictions, lui et tous ceux qui croient en lui ; si vous les faites mourir quand vous en avez le pouvoir, je vous le demande, lorsque vous portez encore sur sa personne une main sacrilége, comment pourriez-vous éviter les châtiments que mérite un pareil excès d’injustice, de fureur, d’endurcissement et de folie ?</p><p>XCVI. Ces paroles de la loi : « Maudit soit celui qui est pendu à une croix ! » confirment notre espérance qui s’attache à Jésus crucifié, au lieu de l’ébranler ; et pourquoi ? C’est que nous y trouvons, non pas une malédiction de la part de Dieu contre Jésus crucifié, mais une prédiction de ce que vous tous et vos semblables deviez faire en refusant de reconnaître que ce Jésus existe avant les siècles, qu’il est le prêtre éternel du Très-Haut, qu’il est roi, qu’il est le Christ. Voyez ce qui se passe sous vos yeux ! Vous maudissez dans vos synagogues tous ceux qui portent son nom ; les païens, de la malédiction passent à l’effet, puisqu’ils nous mettent à mort sur le simple aveu que nous leur faisons d’être Chrétiens. Eh ! que disons-nous à tous ? Nous sommes vos frères. Que n’embrassez-vous plutôt la vérité qui vous vient de Dieu ? Mais ne pouvant vous désarmer ni les uns, ni les autres ; vous voyant au contraire rivaliser de haine et de fureur pour nous contraindre à renier Jésus-Christ, nous préférons la mort et nous la recevons avec joie, persuadés, comme nous le sommes, que Dieu nous accordera en échange de cette vie tous les biens qu’il nous a promis par son Christ. Nous répondons à toutes vos persécutions par les plus tendres prières ; nous supplions le Christ d’avoir pitié de vous, c’est lui-même qui nous enseigne à prier pour nos ennemis : « Aimez ceux qui vous persécutent, nous dit-il, soyez bons et miséricordieux comme votre Père céleste. » Et ne voyons-nous pas, en effet, combien ce Dieu tout-puissant est plein de miséricorde et de bonté ? Ne fait-il pas lever son soleil sur les ingrats aussi bien que sur les justes ? Ne fait-il pas pleuvoir sur les méchants comme sur les bons ? Mais nous savons de lui qu’il doit nous juger tous.</p><p>XCVII.Et ce n’est pas sans raison que le prophète Moïse, dont les mains étaient soutenues par Or et Aaron, demeura dans cette position jusqu’au soir. C’est jusqu’au soir, en effet, que notre Seigneur resta sur la croix ; on ne l’en descendit pour l’ensevelir que sur le déclin du jour, et le troisième jour il ressuscita, ainsi que l’avait prédit par ces paroles le prophète David : « Ma voix a crié vers le Seigneur, il m’a exaucé du haut de la montagne. Je me suis endormi, j’ai été plongé dans un profond sommeil, je me suis réveillé parce que le Seigneur est mon appui. » Isaïe ne nous a-t-il pas annoncé le genre de mort qu’il devait souffrir, lorsqu’il lui met ces paroles dans la bouche : « J’ai étendu mes bras tout le jour vers un peuple incrédule, rebelle, et qui marche dans une mauvaise voie. » Ne nous apprend-t-il pas qu’il devait ressusciter, quand il nous dit : « Je lui donnerai la sépulture du riche, son corps enseveli n’est pas resté dans le tombeau ? » N’est-ce point de sa passion et de sa mort que parlait David dans ce passage tout mystérieux : « Ils ont percé mes mains et mes pieds, ils ont compté tous mes os, ils m’ont considéré, ils m’ont examiné, ils se sont partagés mes vêtements, ils ont tiré ma robe au sort. » Et, en effet, les Juifs qui le crucifièrent lui enfoncèrent des clous dans les pieds et dans les mains, et quand ils l’eurent crucifié, ils se partagèrent ses habits, et c’est le sort qui assigna les parts quand ils voulurent choisir. Direz-vous que ce psaume ne s’entend pas du Christ ? Quel est sur toutes choses votre aveuglement ! Vous ne voyez pas que jamais vous n’avez eu chez vous ni de roi, ni de Christ qui ait eu, vivant encore, les pieds et les mains percés, qui soit mort ou plutôt qu’on ait crucifié comme l’indique ce passage mystérieux, excepté Jésus seul !</p><p>XCVIII. Mais je veux vous citer le psaume tout entier, vous y entendrez les accents de l’amour du Christ pour son père, vous verrez comme il s’abandonne entièrement à lui, comme il le conjure de l’arracher à cette mort cruelle, comme il sait connaître en même temps les hommes qu’il eut pour ennemis, comme il prouve qu’il s’est véritablement fait chair et qu’il a connu la souffrance. C’est ainsi qu’il s’exprime : « Mon Dieu, mon Dieu, pourquoi m’avez-vous abandonné ? N’éloignez pas de moi votre salut, ne soyez pas sourd à mes cris, mon Dieu : je vous invoque durant le jour, et vous ne m’écoutez pas ; je crie vers vous au milieu de la nuit, et je n’ignore pas ce qui m’est réservé. Cependant vous êtes le saint qui habitez dans Israël, vous êtes l’objet de ses louanges. Nos pères ont espéré en vous, et vous les avez délivrés ; ils vous ont imploré, et ils ont été sauvés ; ils se sont confiés en vous, et ils n’ont pas été trompés dans leur attente. Pour moi, je suis un ver de terre ; je suis l’opprobre des mortels et le rebut de la populace ; tous ceux qui me voient m’insultent, le mépris sur les lèvres, ils ont secoué la tête en disant : Il a mis son espoir en Dieu, que Dieu le sauve puisqu’il se plaît en lui. Et c’est vous qui m’avez tiré du sein de ma mère, j’ai été reçu entre vos bras, vous étiez mon Dieu lorsque je suis sorti de ses entrailles ; ne vous éloignez pas de moi, mon Dieu, parce que la tribulation me presse, et personne n’est là pour me secourir. Une multitude de jeunes taureaux m’ont environné, les taureaux de Basan m’ont assailli : ils fondent sur moi la gueule béante, comme le lion qui déchire et qui rugit ; je me suis écoulé comme l’eau ; tous mes os ont été ébranlés ; mon cœur a défailli au dedans de moi, comme la cire qui se fond ; ma force s’est détachée comme l’argile, ma langue s’est attachée à mon palais, et vous m’avez conduit à la poussière de la mort. Des chiens dévorants m’ont environné ; le conseil des méchants m’a assiégé ; ils ont percé mes mains et mes pieds, ils ont compté tous mes os, ils m’ont regardé, ils m’ont considéré attentivement, ils se sont partagés mes vêtements, ils ont tiré ma robe au sort. Mais vous, Seigneur, ne vous éloignez pas ; vous qui êtes ma force, hâtez-vous de me secourir ; arrachez mon âme au glaive, et délivrez-moi de la rage de mes ennemis ; sauvez-moi de la gueule du lion, détournez de moi la corne du taureau. Je raconterai votre nom à mes frères, je publierai vos louanges au milieu de leur assemblée. Louez le Seigneur, vous qui le craignez ; glorifiez-le, race de Jacob ; craignez-le tous, vous qui êtes de la race d’Israël ! »</p><p>Ma citation finie, je continuai en ces termes : Tout ce psaume ne peut s’entendre que du Christ, ainsi que je vais vous le prouver en reprenant chacune des paroles qui le composent. Par les premières : « Mon Dieu, mon Dieu ! tournez vos regards sur moi ; pourquoi m’avez-vous abandonné ? » le prophète annonçait longtemps d’avance les paroles mêmes que devait prononcer le Christ attaché à la croix. Ne s’est-il pas écrié : « Mon Dieu ! mon Dieu ! pourquoi m’avez-vous abandonné ? » Et celles qui suivent : « N’éloignez pas de moi votre salut, ne soyez pas sourd à mes cris. Je vous invoque toujours, et vous ne m’écoutez pas ; je crie vers vous au milieu de la nuit, et vous ne me laissez rien ignorer ! » ne sont-elles pas l’expression fidèle de tout ce que devait faire le Christ ? Le jour qu’il devait être crucifié, il prit avec lui trois de ses disciples et les conduisit sur la montagne des Oliviers, qui s’élève en face du temple de Jérusalem ; et là, il fit à Dieu cette prière : « Mon père, que ce calice s’éloigne de moi ! » Puis il ajouta : « Que votre volonté soit faite, et non pas la mienne ! » Par ces paroles, il montre qu’il sentait vraiment la douleur, qu’il était vraiment homme. Et pour qu’on ne dise point : « Il ne savait donc pas qu’il aurait à souffrir ? » il ajoute aussitôt par la bouche du Psalmiste : « Vous ne m’avez rien laissé ignorer. » De même qu’il n’y avait pas ignorance en Dieu quand il demandait à Adam où il était, et à Caïn ce qu’il avait fait d’Abel, son frère, et qu’il voulait seulement les forcer à se reconnaître eux-mêmes tels qu’ils étaient, et que l’histoire de ce qui était arrivé restât écrite et parvînt jusqu’à nous, ainsi Jésus déclare qu’il ne s’agit pas ici de sa propre ignorance, mais de l’ignorance de ceux qui ne croyaient pas qu’il fût le Christ, et qui pensaient pouvoir, sans conséquence, le faire mourir, se persuadant qu’il en serait de lui comme d’un homme ordinaire, qu’il ne sortirait pas du tombeau.</p><p>C. Ce qui suit : « Mais vous habitez dans le sanctuaire, vous la gloire d’Israël ! » annonçait le prodige le plus digne de louange et d’admiration ; je veux dire le prodige de sa résurrection, trois jours après sa mort sur une croix : merveilleux effet de la puissance qu’il tenait de son père ! Le Christ est appelé Israël et Jacob, ainsi que je l’ai déjà prouvé. Ce n’est pas seulement dans la bénédiction de Joseph et de Juda que tout ce qui le concerne nous a été prédit d’une manière mystérieuse, ainsi que je l’ai également démontré ; c’est encore dans l’Évangile, où nous lisons ces paroles prononcées par lui-même : « Toutes choses m’ont été données par le Père. Personne n’a connu le Père si ce n’est le Fils, et personne n’a connu le Fils si ce n’est le Père, et celui à qui le Fils l’a révélé ! » C’est donc lui-même qui nous a révélé tout ce que nous comprenons des divines Écritures ; c’est donc à sa grâce que nous devons de le reconnaître, et pour le premier-né de Dieu, existant avant toutes choses, et pour le fils des patriarches, parce qu’il a voulu naître d’une vierge issue de leur sang, se faire homme, vivre obscur et sans gloire, et passer par toutes les souffrances. Aussi disait-il à ses apôtres, quand il leur parlait de sa passion : « Il faut que le fils de l’homme souffre tous ces maux, qu’il soit rejeté par les pharisiens et par les scribes, et qu’il ressuscite le troisième jour. » Il se disait donc le fils de l’homme, ou parce qu’il était né d’une vierge qui descendait de David, d’Isaac, de Jacob, d’Abraham, ou bien parce qu’Abraham était son père et celui des justes, ces glorieux ancêtres de Marie dont je viens de parler. Qui de nous ignore que ceux qui ont engendré des femmes sont appelés le père des enfants qu’ont eus leur filles ? Il appela Pierre un de ses disciples nommé Simon, qui, par une révélation de Dieu le père, l’avait reconnu pour le fils de Dieu. Et comme nous lisons dans les écrits de ses apôtres qu’il est vraiment fils de Dieu, nous nous plaisons à l’appeler de ce nom et nous comprenons qu’il l’est en effet, puisqu’il est engendré du Père avant toutes choses, par la vertu et la volonté de ce Père. C’est lui qui, dans les livres des prophètes, est désigné de tant de manières différentes, par les noms de Sagesse, et de Jour, et d’Orient, et de Gloire, et de Pierre, et par ceux de Jacob et d’Israël ; nous comprenons encore que si, d’un côté, il est fils de Dieu, de l’autre, il est homme, fils d’une vierge, afin que le péché, introduit dans le monde par le serpent, fût détruit par les moyens qui l’avaient fait naître. Ève, encore vierge et sans tache, écoute le démon, elle enfante le péché et la mort ; Marie également vierge, écoute l’ange qui lui parle ; elle croit à sa parole, elle en ressent de la joie lorsqu’il lui annonce l’heureuse nouvelle, c’est-à-dire lorsqu’il lui apprend que l’esprit du Seigneur surviendra en elle, que la vertu du Très-Haut la couvrira de son ombre, que le fils qu’elle doit enfanter est le fils de Dieu ; elle répond : « Qu’il soit fait selon votre parole ! » C’est alors que naquit d’elle le salut du monde, celui qu’avaient annoncé tant d’oracles, celui par qui Dieu terrasse le serpent, ainsi que les anges et les hommes qui lui ressemblent, tandis qu’il arrache à la mort ceux qui font pénitence et croient en son Christ.</p><p>CI. Viennent ensuite ces paroles : « Nos pères ont espéré en vous, et vous les avez délivrés ; ils ont crié vers vous, et ils n’ont pas été confondus. Pour moi, je suis un ver de terre et non un homme ; je suis l’opprobre des mortels et le rebut du peuple. » Nous voyons par cet endroit que Dieu ne reconnaît pour véritables pères que ceux qui ont espéré en Dieu et mérité le salut. Les pères dont il parle étaient les ancêtres dont il naquit quand il se fit homme. Il nous apprend que c’est aussi de son père qu’il attend son salut.</p><p>Il se glorifie de ne rien faire que d’après sa volonté et avec son secours. Telle fut, en effet, sa vie sur la terre ; quelqu’un l’avait appelé bon maître : « Pourquoi m’appelez-vous bon, lui dit-il ? personne ne mérite ce nom, si ce n’est mon père qui est dans les cieux. » Par ces mots : « Je suis un ver de terre et non un homme ; je suis l’opprobre des mortels et le rebut du peuple, » le prophète annonçait ce qui s’est accompli, ce qui se réalise encore sous nos yeux.</p><p>Partout on nous fait, à nous autres qui croyons en lui, comme un opprobre de ces mots. « Il fut le rebut du peuple. » On nous reproche d’adorer celui que votre nation a poursuivi de son mépris, a chargé d’ignominie et qui a tout souffert de votre part. Dans ces paroles qui suivent, nous trouvons encore une prédiction de ce qui devait arriver : « Tous ceux qui me voient m’insultent ; le mépris sur les lèvres, ils ont secoué la tête en disant : Il a mis son espoir en Dieu : que Dieu le sauve, puisqu’il se plaît en lui. » Ceux qui le voyaient en croix n’ont-ils pas secoué la tête ? Par le mouvement de leurs lèvres et l’air moqueur de leur visage, ils rivalisèrent d’insulte, et en le raillant ils lui adressèrent ces paroles que nous lisons dans les écrits de ses apôtres : « Il se dit le fils de Dieu : qu’il descende de sa croix et qu’il marche ; que Dieu vienne à son secours. »</p><p>CII. Et ces autres paroles : « C’est vous qui m’avez tiré du sein de ma mère ; c’est vous qui étiez mon espérance. Du sein de ma mère, j’ai été jeté entre vos bras ; vous étiez mon Dieu, lorsque je suis sorti de ses entrailles. Personne n’est là pour me secourir ; une multitude de jeunes taureaux m’ont environné, les taureaux de Basan m’ont assailli ; ils fondent sur moi la gueule béante comme le lion qui déchire et qui rugit ; je me suis écoulé comme l’eau ; tous mes os ont été ébranlés ; mon cœur a défailli au dedans comme une cire qui se fond ; ma force s’est desséchée comme l’argile, ma langue s’est attachée à mon palais. » L’événement pouvait-il être prédit d’une manière plus claire ? Examinons d’abord cette circonstance : « Vous qui fûtes mon espérance dès le sein de ma mère. » À peine est-il né à Bethléem que le roi Hérode, instruit de sa naissance par des mages venus d’Orient, lui tend des embûches et cherche à le faire mourir. Mais Joseph, averti par le Seigneur, prend l’enfant avec la mère et se retire en Égypte. Le père qui l’avait engendré ne voulait pas qu’il mourût avant qu’il fût arrivé à l’âge viril et qu’il eût annoncé sa parole. On me demandera peut-être s’il n’eût pas été plus convenable que Dieu fît périr Hérode ? Je répondrai à cette question par une autre : Dieu ne pouvait-il pas dès le commencement du monde frapper de mort le serpent, au lieu de dire : « Je mettrai de l’inimitié entre le serpent et la femme, entre la race de l’un et la race de l’autre. » Ne pouvait-il pas faire naître tous les hommes à la fois et en un même moment ? Mais il trouva plus digne de lui de créer l’ange et l’homme entièrement libres d’observer ou non les règles de justice qu’il leur avait données, et de les laisser jouir de cette liberté tout le temps qu’il le jugerait convenable. Il trouva également plus digne de lui d’établir un jugement particulier et un jugement général, sans toutefois porter atteinte au libre arbitre. C’est pourquoi l’Écriture, au sujet de la confusion de langage et de la multitude d’idiomes qui suivit la construction de la tour de Babel, s’exprime en ces termes : « Le Seigneur dit : Ils ne forment qu’une race, ils n’ont qu’une seule langue ; ils ont commencé, et ils ne cesseront pas jusqu’à ce qu’ils aient accompli leur dessein. » Quant à ces paroles : « Ma force s’est desséchée comme l’argile, ma langue s’est attachée à mon palais, » c’est encore une prédiction de ce que devait faire le Christ, et toujours pour obéir à la volonté de son père. La force et la puissance de sa parole, qui confondait les scribes, les pharisiens et tous vos docteurs, quand ils osaient disputer avec lui, ne fut-elle pas suspendue ainsi qu’une source d’eau vive qui, jaillissant avec impétuosité, s’interrompt tout à coup quand on détourne son cours ? Il s’est tû, il a refusé de répondre, devant Pilate, à tous ceux qui l’interrogeaient, comme nous l’apprenons par les écrits de ses apôtres, afin que cette parole d’Isaïe eût aussi son accomplissement : « Le Seigneur ma donné une langue éloquente, mais pour parler quand il le faut. » Ces mots : « Vous êtes mon Dieu ; ne vous éloignez pas de moi, » nous apprennent à mettre notre confiance en Dieu, qui a tout fait ; à chercher en lui seul notre appui, notre salut, et non pas dans la naissance, dans la force, dans les richesses, dans la prudence humaine, à l’exemple de la plupart des hommes, ainsi que vous l’avez fait vous-mêmes dans tous les temps. N’avez-vous pas autrefois érigé un veau d’or ? Ne vous êtes-vous pas toujours montrés ingrats ? N’avez-vous pas été persécuteurs des justes jusqu’à les mettre à mort, vains jusqu’à l’arrogance, à cause de vos ancêtres ? Si le fils de Dieu vous a déclaré que ni ce nom divin, ni sa puissance, ni sa sagesse ne pouvaient le sauver ; que pour être impeccable, il lui a fallu le secours de Dieu ; car, comme le dit Isaïe : « Il n’a jamais péché même en parole, puisqu’il a ignoré l’iniquité, et que le mensonge n’a point souillé sa bouche, » comment vous et vos semblables, qui attendez le salut sans avoir aucun titre qui vous donne cette espérance, comment, dis-je, ne voyez-vous pas que vous vous abusez, que vous vous trompez vous-mêmes ?</p><p>CIII. Voyons encore comme l’avenir a réalisé la prophétie renfermée dans ces autres paroles : « La tribulation me presse, personne n’est là pour me secourir ; une multitude de jeunes taureaux m’ont environné, des taureaux de Basan m’ont assailli : ils fondent sur moi la gueule béante comme le lion qui déchire et qui rugit ; je me suis écoulé comme l’eau, tous mes os ont été ébranlés. » Parlerai-je de cette nuit où Jésus vit fondre sur lui, de la montagne des Oliviers, les hommes envoyés par vos scribes et par vos pharisiens, à la faveur de l’ascendant que leur donnait la puissance de leur parole ? Le Christ ne s’est-il pas trouvé alors comme environné de jeunes taureaux à la corne menaçante et d’une fureur prématurée et meurtrière ? Les taureaux de Basan, dont il est ensuite question, désignent ceux d’entre vous qui se portèrent contre le Christ aux mêmes excès de violence que les jeunes taureaux, quand il fut amené devant vos docteurs. Ce n’est pas sans raison que l’Écriture les désigne sous le nom de taureaux ; d’eux naissent les jeunes veaux, ainsi que nous le savons. Eh bien ! ce que les premiers sont pour les seconds, vos maîtres l’ont été pour leurs enfants. Ils les ont poussés à se jeter sur le Christ, de la montagne des Oliviers, pour se saisir de sa personne et l’amener devant eux. Le prophète ajoute : « Personne n’est là pour le secourir. » Et n’est-ce pas ce qui est arrivé ? De cette multitude d’hommes, il n’en est pas un seul qui se soit levé en faveur de l’innocence opprimée ; et dans le lion rugissant dont la bouche ouverte est prête à dévorer, ne voyez-vous pas le roi des Juifs de cette époque, appelé aussi du nom d’Hérode et successeur de cet Hérode qui fit mourir tous les enfants de Bethléem, vers le temps où le Christ naquit, parce qu’il se flattait d’envelopper dans ce massacre l’enfant dont les mages, venus d’Orient, lui avaient annoncé la naissance ? Mais il ignorait les desseins de celui qui est plus fort que tous les hommes ; il ne savait pas qu’il avait donné l’ordre à Joseph et à Marie de prendre cet enfant, de fuir en Égypte et d’y rester jusqu’à ce qu’un nouvel ordre d’en haut les rappelât dans leur patrie. Ils attendirent donc en Égypte qu’on vînt leur apprendre que cet Hérode, meurtrier des enfants de Bethléem, était mort et qu’il avait pour successeur Archélaüs ; mais celui-ci mourut avant que le Christ eût accomplit, par le supplice de la croix, les desseins éternels dont la volonté de son père lui avait remis l’exécution. Un autre Hérode avait succédé à Archélaüs dans la portion de pouvoir que Rome lui avait assignée. Pilate, pour lui plaire, avait envoyé devant son tribunal le Christ chargé de chaînes ; c’est bien là ce que le Seigneur, qui connaît l’avenir, avait annoncé : « Ils le conduiront devant l’Assyrien, il sera un présent d’hospitalité agréable au roi. » Par ce lion qui rugit, ne peut-on pas entendre aussi le démon appelé serpent par Moïse, Diable par Job et Zacharie, Satan par Jésus, qui voulait nous rappeler que ce nom avait été composé et lui avait été donné de l’action même qu’il avait commise ; car <i>Sata</i>, dans la langue des Juifs et des Syriens, signifie déserteur, apostat, et <i>nas</i> peut se rendre par serpent, si vous le traduisez de l’hébreu ; c’est de la réunion de ces deux mots qu’on a formé le mot <i>Satanas</i>. Aussitôt que Jésus-Christ eut quitté le fleuve du Jourdain, où se fit entendre sur lui la voix qui avait dit : « Vous êtes mon fils, je vous ai engendré aujourd’hui, » le démon s’approcha de lui pour le tenter, ainsi que nous l’expriment les livres des apôtres ; il poussa l’audace jusqu’à lui dire : « Adore-moi ! » Jésus lui répondit : « Retire-toi, Satan ! Tu adoreras le Seigneur ton Dieu, et tu ne serviras que lui seul. » Le démon espérait le faire tomber dans ses piéges, comme il y avait fait tomber Adam. Ces paroles : « Je me suis écoulé comme l’eau ; tous mes os ont été ébranlés ; mon cœur a défailli au dedans de moi comme une cire qui se fond, » annonçaient ce qui lui arriva dans la nuit où les soldats vinrent sur la montagne des Oliviers pour se saisir de lui. Dans les livres qui furent écrits, ainsi que je le soutiens, par ses apôtres et par leurs disciples, il est rapporté qu’une sueur qui ressemblait à des gouttes de sang découla de son corps, lorsqu’en priant il s’écriait : « Mon père, s’il est possible, éloignez de moi ce calice. » Son cœur, ses os étaient ébranlés en lui ; son cœur surtout était comme une cire qui se fondait au dedans de lui-même. Par tout ce qui est arrivé, Dieu voulait nous convaincre que c’est à cause de nous qu’il livrait son fils à de si cruelles angoisses, et que sa qualité de fils de Dieu ne l’empêcherait pas de sentir toutes les souffrances et tous les maux qui lui survenaient. Dans ces paroles : « Ma bouche s’est desséchée comme l’argile, ma langue s’est attachée à mon palais, » je retrouve une nouvelle prédiction de ce silence dont j’ai déjà parlé ; silence qu’il ne rompit par aucune parole, ne voulant rien répondre à vos docteurs qu’il avait coutume de confondre et de convaincre de folie.</p><p>CIV. « Vous m’avez conduit à la poussière de la mort, ajoute le prophète ; des chiens dévorants m’ont environné ; le conseil des méchants m’a assiégé : ils ont percé mes mains et mes pieds ; ils ont compté tous mes os ; ils m’ont regardé ; ils m’ont considéré attentivement ; ils se sont partagés mes vêtements ; ils ont tiré ma robe au sort. » Pourrez-vous trouver des paroles plus claires pour exprimer le genre de mort auquel le Christ devait être condamné par l’assemblée des méchants, que l’Écriture désigne sous les noms de chiens et de chasseurs, faisant ici allusion aux réunions et aux conseils que tinrent, pour le perdre, les chefs du peuple qui avaient juré sa perte ? Quoi de plus conforme au récit des apôtres ? J’ai parlé plus haut de ces vêtements que ceux qui le crucifièrent se sont partagés après l’avoir mis en croix.</p><p>CV. Viennent ensuite ces paroles : « Mais vous, Seigneur, ne vous éloignez pas ; vous qui êtes ma force, hâtez-vous de me secourir, arrachez mon âme au glaive et délivrez de la puissance du chien mon âme abandonnée ; sauvez-moi de la gueule du lion et des cornes de l’oryx, dans l’humiliation ou je suis. » Figure, prédiction remarquable de ce que nous retrouvons dans le Christ et de ce qui devait lui arriver ! N’avons-nous pas prouvé qu’il est le fils unique de Dieu, créateur de toutes choses, qu’il est la vertu, le Verbe engendré de lui ; qu’ensuite il s’est fait homme ; qu’il est né d’une vierge, comme nous l’apprennent les écrits des apôtres ? Dans chacune de ces paroles : « Arrachez mon âme au glaive ; délivrez cette âme de la puissance du chien ; sauvez-moi de la gueule du lion, et, dans mon état d’humiliation, délivrez-moi des cornes de l’oryx, » vous trouvez une circonstance de la passion et une prédiction du genre de mort qu’il devait souffrir, je veux parler de la croix. Déjà je vous ai fait voir comme toutes les cornes de l’oryx présentent l’image d’une seule croix : le glaive, la gueule du lion, la puissance du chien, dont il est ici question, désignent une force ennemie qu’il veut repousser ; il demande qu’elle n’asservisse pas son âme, et la prière qu’il fait ici à son père est une leçon qui nous apprend à recourir à Dieu au moment de la mort, à lui demander qu’il ne permette pas que l’ange mauvais et audacieux s’empare de notre âme, puisqu’il peut l’écarter.</p><p>L’âme demeure toujours, je vous l’ai déjà prouvé par ce qui est arrivé à l’âme de Samuel, que la pythonisse évoqua, sur la demande de Saül. Il est à croire que les âmes des justes et des prophètes subissent après leur mort le joug d’une puissance semblable à celle de la pythonisse, comme le prouve le fait même dont je viens de parler. Il est évident que tout est ici pour notre instruction, et que Dieu, par son fils, nous apprend à faire tous nos efforts, à multiplier nos prières à l’heure de la mort, pour empêcher notre âme de tomber sous aucune puissance de cette nature. Lorsque le fils de Dieu rendit l’esprit sur la croix, nous disent les écrits de ses apôtres, il s’écria : « Seigneur, je remets mon âme entre vos mains. » Ils nous disent encore de quelle manière il exhortait ses disciples à surpasser en vertu les pharisiens, s’ils voulaient parvenir au salut : « Je vous déclare, leur disait-il, que si votre justice n’est pas plus parfaite que celle des scribes et des pharisiens, vous n’entrerez point dans le royaume des cieux.</p><p>CVI. Il savait que son père accorderait tout à sa prière, qu’il le ressusciterait d’entre les morts ; il invitait tous ceux qui craignent le Seigneur à le louer en toutes choses, parce que sa miséricorde, en vertu de la croix de son fils, s’étend sur les hommes qui ont la foi. Après sa résurrection, lorsqu’il eut convaincu ses disciples de la vérité des paroles qu’il leur avait dites avant sa passion, qu’il fallait que le fils de l’homme souffrît, et que toutes ses souffrances avaient été prédites, ils furent touchés du plus vif repentir de l’avoir abandonné au moment de la mort. Alors il parut au milieu des apôtres, qu’il regardait comme ses frères ; et toutes les fois qu’il se trouvait au milieu d’eux, il se mettait à louer le Seigneur, ainsi que le rapportent leurs écrits. Et toutes ces circonstances avaient encore été clairement prédites, témoins les paroles qui se trouvent dans le reste du psaume : « Je raconterai votre nom à mes frères, je publierai vos louanges au milieu de leur assemblée ; vous qui craignez le Seigneur, glorifiez-le ; sauvez-le, vous tous qui êtes de la race de Jacob ; qu’il soit craint par toute la postérité d’Israël ! »</p><p>Si vous lui voyez changer le nom d’un de ses apôtres en celui de Pierre, et appeler les deux frères, fils de Zébédée, du nom de Boanergès, qui veut dire fils du tonnerre, reconnaissez en lui ce même Dieu qui changea autrefois le nom de Jacob en celui d’Israël ; le nom d’Ausès en celui de Jésus, nom à la faveur duquel fut introduit dans la terre promise aux patriarches le peuple qui survécut aux Hébreux délivrés de la captivité de l’Égypte. Moïse nous l’avait annoncé comme un astre qui devait s’élever de la race d’Abraham : « Une étoile, nous dit-il, sortira de Jacob ; un chef sortira d’Israël ; » et ailleurs : « Voici l’homme, l’Orient est son nom. » Et en effet une étoile s’éleva dans les cieux, aussitôt après sa naissance, nous disent les écrits de ses apôtres, et des mages avertis par ce signe vinrent d’Orient pour l’adorer.</p><p>CVII. Il avait lui-même prédit qu’il ressusciterait trois jours après qu’il aurait été mis en croix, ainsi que nous l’apprennent les mêmes évangélistes ; nous lisons dans leur récit que des hommes de votre nation lui dirent un jour, en discutant avec lui : « Donnez-nous un signe ; » et qu’il leur répondit : « Cette génération adultère et méchante demande un signe ; on ne lui en donnera pas d’autre que le signe de Jonas. »</p><p>Par ces paroles mystérieuses, il faisait comprendre à ceux qui l’écoutaient qu’il ressusciterait trois jours après sa mort sur la croix, et en même temps il annonçait que la génération à laquelle il parlait était plus coupable et plus perverse que les habitants de Ninive. Vous savez ce qui arriva lorsque Jonas, sorti du poisson qui l’avait englouti, parut au milieu de cette ville et annonça que dans trois jours, d’autres disent dans quarante, Ninive serait détruite avec tous ses habitants. Alors on publia un jeûne qui s’étendit non-seulement à tous les hommes, mais encore à tous les animaux ; on se revêtit de cilices, on poussa de longs gémissements : ils partaient d’un cœur réellement changé ; on abandonna les voies de l’iniquité, on comprit que pour trouver le Seigneur miséricordieux et bon il fallait renoncer au péché. Le roi lui-même et les premiers du royaume se couvrirent de cilices, et persévérèrent dans le jeûne et la prière ; leur pénitence désarma le bras de Dieu et sauva la ville de sa destruction. Le troisième jour arrivé, selon d’autres le quarantième, Jonas s’affligeait de voir que sa prédiction ne s’était pas accomplie. Dieu, dans sa sagesse, sut appaiser ses murmures, et voici de quelle manière : d’un mot il fit naître un lierre qui le couvrit de son ombre et le garantit du soleil. C’était en effet un lierre chargé de son fruit, que Jonas n’avait ni planté, ni arrosé ; mais qui avait poussé tout à coup pour lui donner de l’ombre. D’un autre mot, Dieu fit sécher en un moment ce même lierre ; nouveaux murmures de la part de Jonas : c’est alors que Dieu lui fit comprendre combien était injuste le chagrin qu’il éprouvait de ce que Ninive n’était pas détruite : « Quoi ! lui dit le Seigneur, tu voudrais conserver une plante qui est venue sans toi, qui s’est accrue en une nuit, et qui est morte le lendemain ; et moi je n’épargnerais pas la grande ville de Ninive, où il y a plus de cent vingt mille enfants qui ne savent pas discerner la droite de la gauche, Ninive qui renferme une multitude d’êtres vivants ! »</p><p>CVIII. Tous ceux de votre nation savaient bien ce qui était arrivé à Jonas, et cependant lorsque le Christ leur disait qu’il ne leur serait pas donné d’autre signe, et qu’il les exhortait à faire pénitence de leurs crimes, sinon avant, du moins après sa résurrection, et à fléchir le Seigneur par leurs larmes, à l’exemple des Ninivites, s’ils voulaient préserver et le peuple et la ville de la destruction, non-seulement vous n’avez pas fait pénitence, quand vous avez su qu’il était vraiment ressuscité, mais encore, ainsi que je vous l’ai déjà reproché, vous avez préposé des hommes de votre choix pour aller publier par toute la terre qu’un imposteur du nom de Jésus avait formé une secte d’hommes impies et sans loi ; que ce Jésus avait été crucifié, et que ses disciples l’avaient enlevé pendant la nuit du tombeau où il avait été déposé après qu’on l’eut détaché de la croix ; qu’ils trompèrent les hommes en publiant qu’il était ressuscité d’entre les morts et monté au ciel. Vous n’avez pas craint d’ajouter que ce Jésus enseignait lui-même je ne sais quels dogmes impies, affreux, exécrables, dogmes que vous inventez et que vous débitez partout pour soulever l’indignation publique contre ceux qui professent que Jésus est vraiment le Christ, le maître par excellence, le fils de Dieu. Que dirai-je encore ? Votre ville a été prise, votre pays est dévasté, ainsi qu’il l’avait prédit ; et loin de faire pénitence, vous le chargez de malédictions, lui et tous ceux qui croient en lui.</p><p>Nous, au contraire, nous ne haïssons ni vous, ni ceux à qui vous avez inspiré de pareils sentiments à notre égard. C’est trop peu pour nous de ne pas vous haïr, nous faisons les vœux les plus ardents pour que le repentir entre dans vos cœurs, et que vous obteniez tous miséricorde du Dieu infiniment bon, infiniment miséricordieux qui vous a créés.</p><p>CIX. Mais les gentils, qui vivaient dans le péché parce qu’ils étaient dans l’erreur, devaient se convertir aussitôt qu’ils auraient reçu des apôtres la doctrine que ces derniers ont portée de Jérusalem jusque chez les peuples idolâtres ; nous l’apprenons de Michée, l’un des douze petits prophètes. Permettez que je vous cite quelques paroles de sa prédiction ; c’est ainsi qu’il s’exprima : « Et voilà que dans les derniers temps, la montagne de la maison du Seigneur sera préparée sur le haut des monts, élevée au-dessus des collines ; un fleuve coulera au milieu du peuple, les nations y viendront en foule, et se hâteront, disant : Venez, allons à la montagne du Seigneur et à la maison du Dieu de Jacob ; il nous enseignera ses voies et nous marcherons dans ses sentiers, parce que la loi sortira de Sion, et la parole du Seigneur de Jérusalem ; il jugera au milieu de la multitude des peuples, il châtiera des nations puissantes jusqu’aux contrées les plus lointaines, les peuples feront de leurs épées des socs de charrue, et des hoyaux de leurs lances : un peuple ne tirera plus le glaive contre un autre peuple ; ils n’apprendront plus à se combattre. Chacun se reposera sous sa vigne et sous son figuier, et nul ne les troublera, parce que le Seigneur a parlé. Que tous les peuples marchent au nom de leur Dieu ; et nous, nous marcherons au nom du Seigneur notre Dieu dans l’éternité et par-delà. En ce jour-là je ramènerai celle qui était boiteuse, et je recueillerai celle qui était rejetée et resserrée dans des entraves. Celle qui avait été répudiée deviendra mère d’une nation puissante ; et le Seigneur régnera sur elle, sur la montagne de Sion, dès à présent jusque dans l’éternité. »</p><p>À ces paroles de la prophétie j’ajoutai les réflexions suivantes : Je sais, mes amis, que vos docteurs conviennent avec nous que ces paroles s’entendent du Christ ; mais je sais aussi qu’ils prétendent que le Christ n’est pas encore venu : ou bien s’ils disent qu’il est venu, ils ajoutent qu’on ne le connaît pas, et qu’il ne sera connu que lorsqu’il lui plaira de se manifester et de paraître dans toute sa gloire. Alors arriveront, continuent-ils, les grands événements annoncés dans la prophétie, comme si cette prophétie n’avait encore eu aucun effet. Insensés ! ils ne comprennent pas ce qui est si clair et si évident, d’après toutes les paroles de l’Écriture, que deux avénements du Christ nous sont prédits : l’un, dans lequel il sera sans gloire, homme de douleur, couvert d’ignominie, et enfin crucifié ; l’autre, où il descendra du ciel dans tout l’appareil de sa majesté, quand l’homme de la défection, l’antechrist, élevant sur la terre une voix orgueilleuse contre le Tout-Puissant lui-même, se portera à d’affreux excès contre nous autres Chrétiens qui nous sommes jetés entre les bras du Dieu de Jacob, du Dieu d’Israël, aussitôt qu’à la faveur de la loi et de la doctrine sorties de Jérusalem nous avons pu connaître par les apôtres de Jésus le vrai Dieu et le culte qui lui convient, nous qui nous présentions autrefois couverts de meurtres et du sang les uns des autres ; chargés, en un mot, de toutes sortes d’iniquités, et qui depuis avons brisé sur tous les points du globe les instruments de guerre pour changer le glaive en soc de charrue, la lance en hoyau, et cultiver la piété, la justice, l’humanité, la foi et cette espérance qui nous vient de Dieu le père par le Dieu crucifié, chacun de nous se reposant désormais sous sa vigne, c’est-à-dire n’ayant plus qu’une seule et légitime épouse ; et en effet, dans notre conduite, vous avez sous les yeux la vérité de cette parole prophétique : « Son épouse est comme une vigne féconde. »</p><p>Il est facile de se convaincre que personne au monde n’est capable d’effrayer un véritable Chrétien et d’en faire un vil esclave de la crainte. Qu’on nous frappe du glaive, qu’on nous crucifie, qu’on nous livre aux bêtes, aux flammes, à toutes les autres tortures : on ne peut nous empêcher de confesser le nom de Jésus-Christ, ainsi que vous le voyez.</p><p>Plus on nous fait souffrir, plus on nous persécute, plus il naît au nom de Jésus des Chrétiens fidèles et dévoués. Nous ressemblons à la vigne dont le fer coupe quelques branches fécondes, et qui répare cette perte par d’autres branches plus belles et plus fécondes encore. La vigne plantée par le Dieu tout-puissant et par le Dieu sauveur, c’est le peuple qu’il s’est formé. Pour le reste de la prophétie, il aura son effet au jour du second avénement.</p><p>Ces mots : « Celle qui était resserrée dans des entraves, » signifient que vous et tous les incrédules faites votre possible pour bannir, non pas seulement de leurs biens, mais encore du monde entier, tous ceux qui portent le nom de Chrétiens, et qu’il ne leur est plus permis de jouir librement du bienfait de la vie. Vous dites : Eh ! n’est-ce pas ce que notre peuple lui-même a souffert ? Mais si tel a été pour vous le sort de la guerre, c’était un châtiment que vous aviez mérité, ainsi que l’attestent toutes les Écritures. Mais nous, qui avons cessé de commettre le mal depuis que nos yeux se sont ouverts à la vérité, nous avons Dieu pour garant que notre mort n’est pas plus juste que celle qu’on a fait subir à celui qui était sans tache et la justice même, je veux dire le Christ. « Le juste, dit Isaïe, le juste périt, et nul n’y pense dans son cœur : les justes sont enlevés de ce monde, et personne n’y pense. »</p><p>CXI. Au sujet de ces deux avénements, je dois vous rappeler que déjà du temps de Moïse ils avaient été figurés d’une manière mystérieuse par les deux boucs que l’on offrait les jours de jeûne. Nous avons aussi montré que Moïse et Josué étaient eux-mêmes des figures de ces deux avénements : l’un resta jusqu’au soir sur la colline les bras étendus, tandis qu’on les soutenait (rien sans doute ne représentait mieux la croix que cette attitude) ; l’autre, qui portait le nom de Jésus, commandait l’armée et donnait la victoire aux Hébreux.</p><p>Il est à remarquer que, pour mieux figurer les deux avénements, ces deux saints personnages, ces deux prophètes du Seigneur ont représenté séparément les deux grands mystères dont nous venons de parler, l’un retraçant la croix, l’autre rappelant le nom de Jésus, et n’ont pu réunir les deux symboles dans une même personne. La réunion s’est faite dans Jésus seul. Et telle est, telle a été et telle sera toujours sa force, que son nom même fait trembler toute autre puissance que la sienne ; elle se sent défaillir à la seule idée qu’un jour elle doit être renversée par lui. Ainsi donc notre Christ, tout passible, tout crucifié qu’il a été, n’encourut point la malédiction portée par la loi ; mais il prouvait que lui seul pouvait sauver ceux qui savent conserver la foi. En Égypte, les Hébreux, préservés du glaive exterminateur, tandis que les premiers-nés des Égyptiens périssaient, durent leur salut au sang de l’agneau pascal qui arrosait les deux côtés et le seuil de leurs portes. Mais la Pâque c’était le Christ qui fut immolé plus tard, ainsi que l’avait annoncé Isaïe par ces paroles : « Il a été conduit à la mort comme une brebis. » Et n’est-ce pas vers le jour de Pâques que vous l’avez arrêté, que vous l’avez crucifié ? Eh bien ! de même que le sang de l’agneau pascal a sauvé les Hébreux qui étaient en Égypte, de même le sang du Christ sauvera de la mort ceux qui croiront en lui. Mais pourquoi ce sang mis sur les portes ? Est-ce que, sans cette marque, la main de Dieu se serait trompée ? Non, assurément, tout ce que je veux dire, c’est que Dieu annonçait par là que le sang du Christ serait le salut du genre humain.</p><p>Le ruban de pourpre que les espions envoyés par Jésus, fils de Nave, donnèrent à la courtisanne Rahab, de la ville de Jéricho, en lui recommandant de le suspendre à la fenêtre par laquelle elle les fit descendre pour les soustraire à l’ennemi, figurait également le sang du Christ qui, chez tous les peuples, remet les iniquités, et devient le gage du salut pour les hommes injustes et adultères qui cessent de retomber dans le péché.</p><p>CXII. Combien vous dégradez Dieu par vos misérables interprétations, quand vous donnez à toutes ces paroles un sens si étroit, et que vous savez si peu pénétrer la profondeur des choses qu’elles expriment ? À les prendre comme vous les entendez, il faudra donc accuser Moïse d’avoir violé la loi qu’il avait portée ; car, après avoir défendu lui-même de représenter la figure d’aucune créature, soit du ciel, soit de la terre, soit de la mer, il fit faire un serpent d’airain qui était placé au-dessus d’un certain signe, et il ordonna à tous ceux qui avaient été mordus de le regarder ; et ceux qui le regardaient étaient guéris. Direz-vous que leur guérison venait du serpent ? Mais comment pourrait-elle venir de lui, puisque Dieu l’a maudit dès le commencement du monde, et frappé de sa redoutable épée, comme le dit Isaïe ?</p><p>Faut-il prendre ce passage dans le sens absurde qu’il plaît à vos docteurs de lui donner, et non pas comme une figure qui se rapporte à Jésus crucifié ; Jésus, que représentait Moïse par ses mains étendues, et Josué par ce nom qu’il reçut lorsqu’ils assurèrent l’un et l’autre la victoire à votre peuple ? Cette manière d’entendre l’Écriture ne laisse plus de doute, de vague dans l’esprit ; on comprend la pensée du législateur. Alors il ne paraît plus abandonner la cause de Dieu, et conseiller au peuple de placer sa confiance dans un reptile par qui la prévarication et la désobéissance sont entrées dans le monde. Vous trouvez dans toutes les paroles, dans toutes les actions de ce saint prophète un sens profond, un grand mystère. Tout s’accorde, tout s’explique à merveille dans celles des autres prophètes, lorsqu’on possède une fois l’intelligence des choses qu’elles renferment.</p><p>Mais de quoi s’occupent vos docteurs ! Ils descendent à je ne sais quelles misérables et futiles discussions : ils vous diront pour quelle raison dans cet endroit ou dans celui-ci on ne parle pas des chameaux femelle ; ce qu’on entend par ces chameaux appelés femelles ; pourquoi l’usage de tant de mesures de farine, de tant de mesures d’huile dans les offrandes prescrites par la loi. Mais, tout ce qui a de l’importance, tout ce qui mérite d’être examiné, ils se gardent bien de l’expliquer ou même d’en parler ; non contents de passer sous silence ces graves objets, ils vous défendent de nous écouter quand nous les traitons, et vous empêchent d’avoir aucun rapport avec nous. Ne méritent-ils pas qu’on leur applique ces paroles que Jésus, notre maître, adressait aux docteurs de son temps : « Sépulcres blanchis, beaux au dehors, mais au dedans pleins d’ossements et de corruption ; qui donnez la dîme de la menthe et qui avalez un chameau. » Si vous ne rejetez la doctrine de ces hommes qui se prêchent eux-mêmes et qui veulent être appelés : Maîtres ! maîtres ! si vous n’apportez à la lecture des prophètes le courage, la constance même des prophètes ; si vous n’êtes pas prêts à souffrir de la part des vôtres tout ce que ces derniers en ont souffert, je vous déclare que la lecture de leurs écrits sera sans fruit pour vous.</p><p>Voyez quelle est votre conduite. Celui qui fut envoyé avec Caleb pour reconnaître la terre de Chanaan, et qui portait auparavant le nom d’Ausès, ainsi que je l’ai déjà dit, reçut de Moïse le nom de Jésus. Vous ne demandez pas pour quelle raison vous passez sur ce point sans élever aucune discussion ; vous ne faites aucune question sérieuse ; sous ce nom, vous ne voyez pas le Christ ; vous lisez sans comprendre, et maintenant que vous entendez dire que Jésus est notre Christ, vous ne raisonnez pas en vous-mêmes, vous ne tirez pas cette conséquence que ce n’est pas en vain et sans raison que ce nom a été donné au compagnon de Caleb dont nous parlons. Mais vous cherchez avec une sainte et scrupuleuse attention pourquoi on a ajouté un <i>a</i> au premier nom d’Abraham, vous disputez avec un grand appareil de raisonnement sur l’<i>r</i> surajouté au nom de Sara. Quelle froideur, au contraire, quand il s’agit d’examiner pourquoi le nom tout entier d’Ausès, fils de Nave, fut changé en celui de Jésus ! Mais ce n’est pas seulement son nom qui a été changé, il a été lui-même substitué à Moïse.</p><p>Seul de tous les chefs hébreux sortis d’Égypte, il conduisit dans la terre-sainte les restes d’Israël. De même que ce fut Josué, et non pas Moïse, qui mit le peuple de Dieu en possession de la terre-promise, et la distribua d’après le sort entre tous ceux qui purent y entrer avec lui, de même Jésus convertira les restes dispersés de ce même peuple et leur distribuera la véritable terre-sainte, mais avec quelle différence ! Le fils de Nave ne put donner qu’un héritage passager ; il n’était pas le Christ-Dieu, le fils de Dieu ; mais le Christ, après la grande résurrection, nous donnera un héritage qui ne passera point. Si le fils de Nave arrêta le soleil, ce ne fut qu’après avoir pris le nom de Jésus en échange du sien, et reçu sa puissance de l’esprit même de Jésus. Déjà nous avons prouvé que c’est ce même Jésus qui apparut à Moïse, à Abraham et aux autres patriarches, et conversa avec eux lorsqu’il exécutait les ordres de son père ; qui, depuis, est venu sur la terre, s’est fait homme, est né d’une vierge et subsiste toujours. Après lui et par lui le Dieu créateur doit renouveler le ciel et la terre ; c’est le Christ qui, dans la nouvelle Jérusalem, sera l’éternelle lumière ; il est le véritable roi de Salem selon l’ordre de Melchisédech, et le prêtre éternel du Très-Haut. Mais revenons à Josué ; il est rapporté qu’il ordonna une seconde circoncision et qu’elle fut faite avec des couteaux de pierre : n’était-ce pas une prophétie de cette circoncision par laquelle le Christ nous retranche ou plutôt nous sépare des dieux de pierre et d’autres simulacres semblables ? Il est dit aussi que Josué réunit en un même lieu les Hébreux qui furent circoncis ; n’était-ce pas encore une image de ce que fit le Christ, qui rassembla de toutes les parties du monde, en un même corps, ceux que le véritable couteau de pierre, c’est-à-dire sa parole, avait retranché du monde idolâtre ? Car vous savez que la pierre est présentée comme la figure du Christ : similitude souvent employée par les prophètes ; et sa parole est avec raison comparée à un couteau de pierre : par elle, en effet, tant d’hommes incirconcis et plongés dans l’erreur ont reçu la circoncision du cœur et non de la chair ! et c’est à cette circoncision que Dieu, par Jésus, exhortait ceux qui avaient reçu celle d’Abraham, lorsqu’il nous dit que ceux qui entrèrent dans la terre-sainte reçurent de Jésus une seconde circoncision qui fut faite avec des couteaux de pierre.</p><p>CXIV. Souvent l’Esprit saint parlait de manière à montrer l’avenir sous une image vive et frappante, et souvent il annonçait les événements futurs comme s’ils se passaient déjà, ou même comme s’ils étaient déjà passés. Je vais vous citer quelques exemples qui vous feront comprendre ce que j’avance. Isaïe nous dit, en parlant du Christ : « Il a été conduit à la mort comme une brebis, et comme un agneau devant celui qui le tond. » Il est évident qu’il parle de la passion comme si déjà elle était accomplie ; et ailleurs, lorsqu’il dit : « J’ai étendu mes mains vers un peuple incrédule et rebelle. » Ne croirait-on pas qu’il s’agit d’un événement passé ? Il en est de même de cet autre endroit : « Seigneur, qui a cru à votre parole ? » J’ai prouvé à plusieurs reprises que le même prophète donnait souvent au Christ le nom de Pierre par similitude, et par métaphore celui de Jacob et d’Israël ; et dans un autre endroit, quand il dit : « Je verrai tes cieux, ouvrages de tes mains, » si je n’entends pas ces mots dans ce sens que Dieu fait tout par son Verbe, j’en conclurai follement, comme vos docteurs, que l’auteur de toutes choses, que le Dieu incréé, a des pieds, des mains, une âme comme les êtres animés qu’il a faits, et que c’est pour cette raison qu’il a pu se montrer autrefois à Abraham, à Jacob ; car voilà ce qu’ils enseignent.</p><p>Nous avons donc été bien mieux traités, nous qui avons reçu la seconde circoncision à l’aide de couteaux de pierre : la première se faisait et se fait encore avec le fer. Aussi persistez-vous dans la dureté de votre cœur. Notre circoncision, qui ne fut instituée qu’après la vôtre, se fait avec des pierres aiguës, c’est-à-dire par la parole des apôtres du Dieu, la grande pierre angulaire détachée sans effort de la montagne ; elle nous affranchit du culte des idoles et de toutes les œuvres d’iniquité ; et nos cœurs se trouvent si bien circoncis, si bien dégagés du vice, que nous affrontons la mort avec joie pour le nom de celui qui est l’heureuse pierre d’où jaillit une eau vive dans les cœurs qui aiment par lui Dieu le père, et dont l’effet est de désaltérer ceux qui ont soif de la justice. Mais quand je parle ce langage vous ne me comprenez pas, car vous n’avez pas l’intelligence des œuvres que devait opérer le Christ, œuvres prédites toutefois par les prophètes ; et vous ne voulez pas nous croire, nous qui tâchons de vous amener à comprendre les Écritures. « Malheur à vous ! s’écrie Jérémie ; vous avez abandonné la source d’eau vive et vous vous êtes creusé des citernes entr’ouvertes qui ne peuvent contenir leurs eaux ! La solitude sera sur la montagne de Sion, parce que devant vous j’ai donné à Jérusalem l’écrit de répudiation. »</p><p>CXV. Mais vous devriez du moins croire à cette prophétie de Zacharie qui vous annonce d’une manière allégorique, sous le voile d’une parabole, le mystère du Christ. C’est ainsi qu’il s’exprime :</p><p>« Réjouis-toi, fille de Sion, loue le Seigneur ! voilà que je viens et j’habiterai au milieu de toi, dit Jéhovah, et les nations viendront en foule vers le Seigneur en ce jour ; elles seront mon peuple, et j’habiterai au milieu de toi et tu sauras que Jéhovah, le Dieu des armées, m’a envoyé vers toi. Jéhovah possédera Juda comme son héritage dans la terre-sainte, il choisira Jérusalem. Que toute chair se taise en présence de Jéhovah, car il s’est réveillé de son sommeil, il s’est levé de sa demeure sainte, et le Seigneur me montra le grand-prêtre Jésus debout devant l’ange de Jéhovah ; et Satan était à sa droite pour s’opposer à lui ; et Jéhovah dit à Satan : Jéhovah te réprimera ; Jéhovah qui a choisi Jérusalem te réprimera, tu n’es qu’un tison arraché au feu. »</p><p>Tryphon s’apprêtait à m’interrompre. Attendez un moment, lui dis-je, écoutez où j’en veux venir. Vous vous imaginez sans doute que je veux faire entendre qu’il n’existait point de prêtre du nom de Jésus dans la terre de Babylone où votre peuple fut captif ; ce n’est pas là ma pensée. Si cependant je voulais le prouver, je ne manquerais pas de raisons : je pourrais vous dire que si vous aviez eu à cette époque un prêtre du nom de Jésus, le prophète ne l’aurait pas vu en révélation, mais bien en réalité ; de même qu’il a vu le démon et l’ange du Seigneur dans un moment d’extase ou de vision, et non pas réellement placés sous ses yeux. Mais voilà tout simplement ce que je veux établir :</p><p>De même que l’Écriture nous dit que, par la vertu du nom de Jésus, le fils de Nave fit des prodiges et des actions qui étaient autant de figures de ce que devait faire un jour notre Christ ; de même je me borne à vous dire que la révélation qui eut lieu à l’époque de ce Jésus, prêtre des Hébreux, au temps de la captivité de Babylone, était une prophétie de ce que devait faire notre prêtre, Dieu et Christ, fils du Dieu créateur de tout ce qui existe.</p><p>Aussi je me suis étonné de vous voir si tranquilles et de n’éprouver de votre part aucune contradiction, lorsque je vous ai dit que, seul d’entre les chefs partis avec lui de l’Égypte, le fils de Nave était entré dans la terre-sainte, à la tête de la jeunesse de cette époque ; car, habituellement, vous ressemblez aux mouches qui cherchent les ulcères et s’y attachent de préférence. Aussi, entre mille choses remarquables, qu’on laisse échapper un mot qui vous blesse ou que vous ne comprenez pas, ou qui soit inexact, vous oubliez tout ce qu’on a pu vous dire de beau, d’intéressant, pour vous saisir de ce seul mot, le grossir et en faire un crime irrémissible.</p><p>Vous jugez sévèrement ; Dieu vous jugera de même. Il vous demandera compte à bien plus juste titre de vos actions mauvaises, de vos crimes affreux, de tant de fausses interprétations que vous avez données aux divines Écritures en les altérant. N’est-il pas juste que vous soyez jugés comme vous avez jugé les autres ?</p><p>CXVI. Mais revenons à la prophétie qui nous occupe et qui regarde Jésus-Christ. Je reprends la suite de mes idées, et je dis que cette prophétie nous regarde aussi, nous qui croyons au Christ, ce pontife par excellence, mort par le supplice de la croix. Nous étions souillés de toutes sortes de crimes et de désordres ; c’est lui qui, par sa grâce, d’après la volonté de son père, nous a purifiés de toutes les souillures dont nous étions couverts. Le démon est toujours là comme un ennemi qui nous observe et qui veut nous attirer à lui. Mais l’ange de Dieu, c’est-à-dire la grâce de Dieu qui nous est envoyée par Jésus-Christ, repousse sans cesse le démon et le met en fuite. Nous avons été comme arrachés au feu par cette grâce qui nous purifie de nos péchés et qui doit nous délivrer de toutes les tribulations à l’avenir, aussi bien que des feux éternels où Satan et ses ministres voudraient nous plonger ; car Jésus, le fils de Dieu, nous a promis de nous en arracher, de nous revêtir des habits de gloire qu’il nous a préparés, et de nous ouvrir son royaume éternel, si nous observons ses commandements. De même que le Jésus, appelé du nom de Prêtre par le prophète, se montra couvert de vêtements souillés aux yeux d’Israël, parce qu’il avait, dit l’Écriture, épousé une prostituée, et fut, comme un tison, arraché du feu, parce qu’il obtint la rémission de son péché, à la grande confusion du démon, qui voulait ressaisir sa proie ; de même, nous, qui tous ensemble ne faisons qu’un, en quelque sorte, en Jésus-Christ par notre unanimité à croire un seul Dieu créateur de toutes choses, nous avons été, grâce à son fils unique, délivrés des vêtements d’ignominie, c’est-à-dire de nos péchés, et enflammés par le feu de la parole qui nous appelait ; nous sommes devenus la véritable race sacerdotale du Seigneur, ainsi qu’il l’atteste lui-même, lorsqu’il dit que maintenant, en tous lieux, chez les nations, on lui offre des sacrifices purs et agréables. Qui ne sait que Dieu ne reçoit de sacrifices que des mains de ses prêtres ?</p><p>CXVII. Le sacrifice offert partout en son nom est celui que Jésus-Christ a institué et prescrit d’offrir, je veux dire le sacrifice eucharistique du pain et du vin, que les Chrétiens offrent en tous lieux ; aussi lui sont-ils tous agréables, ainsi qu’il le déclare, tandis qu’il rejette vos sacrifices et ceux de vos prêtres ; témoins ses propres paroles : « Je ne recevrai plus d’offrandes de votre main ; depuis le lever du soleil jusqu’au coucher, mon nom est glorifié chez les nations, et vous, vous le profanez. » Toujours poussés par l’esprit de contention, vous dites qu’à la vérité le Seigneur ne reçoit plus de sacrifices à Jérusalem de la part de ceux qui l’habitèrent autrefois sous le nom d’Israélites, mais que, dans leur dispersion chez tous les peuples, leurs prières ne laissent pas de lui être agréables, et que ces prières sont ici désignées sous le nom de sacrifices. Je conviens que les prières et les actions de grâce faites par des cœurs purs sont les seuls sacrifices parfaits et agréables au Seigneur ; et voilà ceux en effet que les Chrétiens ont appris à lui offrir en reconnaissance des aliments qu’ils reçoivent de lui, et en mémoire de la passion que le fils de Dieu a soufferte pour eux. Mais vos princes des prêtres et vos docteurs n’ont rien omis pour que le nom du Seigneur fût profané et devînt un objet de blasphème chez tous les peuples ; vous avez jeté comme un manteau d’ignominie sur tous ceux qui portent le nom de Jésus et qu’on appelle Chrétiens, mais Dieu le fera disparaître un jour, quand il nous ressuscitera tous, qu’il enverra les uns incorruptibles, immortels, impassibles, dans son royaume éternel, ce royaume qui ne passera point ; et qu’il précipitera les autres au milieu de feux et de supplices qui n’auront pas de fin. Vous et vos maîtres, vous vous abusez par votre manière d’entendre l’Écriture et de vous persuader qu’il s’agit ici de votre dispersion chez les autres peuples, et de vos prières, et de vos sacrifices comme s’ils étaient purs et agréables au Seigneur en tous lieux. Reconnaissez d’abord que votre interprétation est un mensonge, et que vous ne cherchez en toute chose qu’à vous tromper vous-mêmes ; car enfin, votre nation n’est pas encore répandue du couchant à l’aurore : combien de contrées où personne d’entre vous n’a pu encore pénétrer ! Mais il n’y a pas un seul peuple, ou grec ou barbare, de quel nom qu’on l’appelle, soit chez les Scythes, qui passent leur vie dans des chariots ; soit chez les nomades, qui n’habitent point de maisons ; soit chez les pâtres, qui logent sous des tentes ; oui, dis-je, il n’est pas un seul peuple où l’on n’adresse à Dieu le père des prières et des actions de grâces, au nom de Jésus crucifié. D’ailleurs remontons à l’époque de la prophétie : étiez-vous, au temps de Malachie, dispersés comme vous l’êtes aujourd’hui ? Non sans doute, ainsi qu’on peut s’en convaincre d’après les Écritures.</p><p>CXVIII. Ah ! ne vaut-il pas mieux pour vous, mes amis, renoncer à tout esprit de contention et faire pénitence avant l’arrivée de ce grand jour du jugement, où se feront entendre les gémissements de tous ceux de vos tribus qui ont percé le Christ, comme vous l’annoncent les livres saints ? Ces paroles de David : « Le Seigneur l’a juré, vous êtes prêtre selon l’ordre de Melchisédech, » je les ai citées et je vous ai développé le sens de cette prédiction ; cet oracle d’Isaïe : « Et sa sépulture a disparu du milieu de nous, » vous a montré qu’il devait mourir et ressusciter. Je me suis attaché à vous prouver que le Christ devait aussi juger les vivants et les morts. C’est en ces termes que Nathan parle de lui à David : « Je serai son père et il sera mon fils ; je ne retirerai point de lui ma miséricorde, ainsi que je l’ai retirée de ceux qui étaient avant lui ; je l’établirai dans ma maison, et son trône sera affermi pour toujours. » Selon Ézéchiel, il est le seul chef de la maison du Seigneur ; car le Christ, en sa qualité de fils de Dieu, est le Prêtre par excellence, le Roi éternel. Ne croyez pas qu’il nous ait été recommandé, par Isaïe et par les autres prophètes, de nous préparer à son second avénement par des sacrifices de sang et des libations ; il faut maintenant des sacrifices, non plus figuratifs, mais véritables et spirituels, la louange et l’action de grâces. Notre croyance en Jésus n’est donc pas une erreur ; ceux qui nous ont appris à croire en lui ne nous ont pas trompés. Ô Providence admirable ! vous vous flattiez vainement d’aimer Dieu, d’être sages ; les hommes vraiment sages, vraiment religieux, vous ne les trouvez plus que parmi ceux qui sont fidèles à la vocation du testament nouveau et éternel, je veux dire à la voix du Christ ; et voilà précisément ce que disait Isaïe dans un transport d’admiration : « Et les rois devant lui garderont le silence ; car ceux à qui il n’a point été annoncé, verront ; ceux qui n’en ont point entendu parler, comprendront. Seigneur, qui a cru à votre parole ? À qui le bras de Dieu s’est-il révélé ? » Je résume toutes ces preuves, ô Tryphon, le plus succinctement possible, pour l’instruction de ceux qui sont venus aujourd’hui avec vous.</p><p>— Je vous en remercie, me dit-il, et bien que vous soyez revenu sur les mêmes choses à plusieurs reprises, je dois vous dire que nous vous entendons avec un extrême plaisir.</p><p>CXIX. — Vous pensez bien, mes amis, répondis-je, que nous n’aurions jamais pu nous-mêmes comprendre les Écritures, sans la volonté de celui dont la grâce nous a donné l’intelligence ; et il nous l’a donnée pour accomplir ce qui fut dit autrefois à Moïse : « Ils ont provoqué mon courroux en adorant des dieux étrangers, et ils ont excité ma colère par des abominations ; ils ont sacrifié aux démons et non à Dieu, à des dieux qu’ils ne connaissaient pas ; il leur est venu des dieux nouveaux, des dieux d’un jour que leurs pères n’ont point adorés. Le Dieu qui t’a engendré tu l’as délaissé, et tu as oublié le Dieu qui t’a nourri ; le Seigneur a vu, et son courroux s’est ému, parce que ses filles et ses fils l’ont provoqué ; et il a dit : Je leur cacherai ma face et je considérerai leur fin ; car c’est une race perverse et des enfants infidèles ; ils m’ont provoqué par des dieux qui n’en sont pas, et ils m’ont irrité avec leurs vaines idoles, et moi je les provoquerai avec un peuple qui n’est pas le mien, et je les irriterai avec un peuple insensé. Un feu s’est allumé dans ma colère, et il brûlera jusque dans les entrailles de l’enfer ; il dévorera la terre avec ses germes, et il consumera les fondements des montagnes ; j’assemblerai sur eux tous les maux. » Et quand le juste eut été mis à mort, nous, cet autre peuple dont il est ici parlé, nous avons refleuri ; nous nous sommes élevés de terre comme de jeunes et féconds épis ; nous avons été ces peuples dont parle le prophète : « Des nations viendront en foule au Seigneur en ce jour ; elles seront mon peuple, et elles habiteront par toute la terre. » Nous ne sommes donc pas simplement une nation, mais la nation sainte, pour me servir ici de l’expression du prophète : « On appellera saint le peuple racheté par le Seigneur. »</p><p>Ainsi nous ne sommes pas un peuple que vous devez mépriser, une nation barbare, ou même, si vous voulez, un peuple comme ceux de la Carie et de la Phrygie ; nous sommes un peuple choisi de Dieu, auquel il a daigné se manifester lorsque nous ne le cherchions pas. « Je suis devenu, dit-il, le Dieu d’une nation qui ne songeait pas à m’invoquer. » Et voilà la race que Dieu promit à Abraham, lorsqu’il lui annonça qu’il serait père de plusieurs nations. Il ne parlait pas alors des Arabes, ni des Égyptiens, ni des Iduméens ; car Ismaël et Ésaü furent pères de nations puissantes. Les Ammonites, qui formaient une tribu si considérable, existent encore. Noé fut le père d’Abraham et de presque toute la nouvelle race des hommes qui s’engendrèrent les uns des autres. Quelle était donc la faveur particulière que le Christ réservait à Abraham ? De même qu’il l’appela, en lui commandant de quitter la contrée qu’il habitait ; ainsi nous avons tous été appelés nous-mêmes ; nous sommes sortis de la région malheureuse où nous vivions, des voies criminelles où nous étions engagés avec le reste des hommes ; aussi serons-nous avec Abraham les héritiers de la terre-sainte ; aussi avons-nous toujours en perspective cet héritage immortel, comme enfants d’Abraham, à raison de notre foi toute semblable à la sienne. Il crut à la parole de Dieu, et sa foi lui fut imputée à justice ; et nous aussi nous avons cru à la parole de Dieu qui nous fut annoncée par les prophètes et prêchée par les apôtres ; et aussitôt que nous avons entendu cette voix, nous avons renoncé à tous les biens de ce monde pour la suivre, et nous renoncerions à la vie s’il le fallait. Dieu promettait donc à Abraham une nation imitatrice de sa foi, attachée comme lui au culte du vrai Dieu, et qui serait un jour la joie de son père ; ainsi ce n’était pas vous, puisque l’Écriture vous appelle des enfants d’incrédulité.</p><p>CXX. Et voyez comme la même promesse fut faite à Isaac et à Jacob. C’est ainsi que le Seigneur parle à Isaac : « Je bénirai toutes les nations de la terre dans celui qui doit sortir de toi ; » et à Jacob : « Toutes les tribus de la terre seront bénies en toi et en ta postérité. » Et cette bénédiction, Dieu ne l’a donnée ni à Ésaü, ni à Ruben ou à tout autre, si ce n’est à ceux dont le Christ devait naître dans l’ordre des ancêtres de la vierge Marie.</p><p>Voyez encore en quels termes est conçue la bénédiction donnée à Juda, et vous comprendrez ce que je dis ici. La race de Jacob se partage et se continue en diverses branches, par Juda, par Pharès, par Jessé, par David. Que signifiait ce partage ? celui que nous voyons aujourd’hui. Quelques-uns des vôtres sont reconnus enfants d’Abraham et sont comptés parmi ceux qui forment l’héritage du Christ ; d’autres, bien qu’issus de ce patriarche, ressemblent au sable stérile qui couvre le bord de la mer : ces grains de sables sont innombrables, mais ils ne produisent rien, ils s’abreuvent seulement de l’eau de la mer ; et n’a-t-on pas fait avec raison à plusieurs d’entre vous le reproche de boire les doctrines amères de l’impiété, et de repousser la parole de Dieu ? Ce Dieu dit, en parlant de Juda : « Le sceptre ne sortira point de Juda, ni le prince de sa postérité, jusqu’à ce que viennent les choses qui sont promises et celui qui est l’attente des nations. » Il est évident que cette prophétie ne regarde point Juda, mais le Christ. Nous autres, hommes de toutes les nations, ce n’est pas Juda que nous attendons, mais Jésus qui avait aussi délivré vos pères de la servitude d’Égypte ; car la prophétie assigne pour limite l’arrivé du Christ : « Jusqu’à ce que vienne celui à qui appartient le sceptre, et il sera l’attente des nations. » Or, il est venu, je vous l’ai prouvé, et il doit venir de nouveau sur les nuées du ciel et remplir notre attente, ce Jésus dont vous profanez le nom et que vous faites blasphémer par toute la terre. Je pourrais ici contester avec vous sur les mots que vous rendez de cette manière : « Jusqu’à ce que viennent les choses qui lui sont promises. » Ce n’est pas ainsi que traduisent les Septante, mais : « Jusqu’à ce que vienne celui à qui le sceptre appartient, » comme la suite du passage fait voir clairement qu’il ne s’agit ici que du Christ, car ces paroles : « Il sera l’attente des nations, » sont bien formelles, je ne disputerai point avec vous sur les mots qui précèdent ; je ne m’y arrête point, non plus qu’aux passages que vous ne voulez pas admettre, je veux dire les paroles de Jérémie, d’Esdras et de David, que j’ai citées. Ce n’est point d’après ces paroles que j’ai cherché à vous prouver que le Christ est venu, mais d’après les passages que vous regardez vous-mêmes comme incontestables. Et si vos docteurs avaient pu comprendre qu’ils s’entendaient du Christ, soyez-en bien persuadés, ils les auraient retranchés comme ils ont retranché ceux qui regardent la mort d’Isaïe, dont vous avez coupé le corps avec une scie de bois. Il y a encore ici un mystère qui cachait ce que devait faire le Christ ; car il partagera votre nation comme vous avez partagé le corps du prophète ; il recevra les uns, selon leurs mérites, dans son royaume éternel, avec les saints patriarches et les saints prophètes, et il condamnera les autres à un feu qui ne s’éteindra jamais ; il les y précipitera avec ceux des autres nations qui leur ressemblent par leur incrédulité et leur endurcissement. C’est lui-même qui l’a déclaré : « Plusieurs, dit-il, viendront d’Orient et d’Occident, et auront part avec Abraham, Isaac et Jacob, au royaume des cieux ; tandis que les enfants du royaume seront jetés dans les ténèbres extérieures. » Je vous parle ici d’après les sentiments dont je suis profondément pénétré ; dans tout ce que j’ai pu vous dire, je n’ai cherché qu’à vous faire connaître la vérité, sans craindre personne ; car je vous l’aurais dite quand vous auriez dû, sur cette place, me mettre en lambeaux.</p><p>Je me suis fort peu inquiété de ceux de ma nation, c’est-à-dire des Samaritains. Lorsque je m’adressai à César et que je lui offris une requête, le priant d’en prendre acte, j’ai dit hautement qu’ils se laissaient tous grossièrement abuser en ajoutant foi aux paroles du magicien Simon, Samaritain d’origine, dont ils font un dieu, et qu’ils placent au-dessus de toutes les puissances, de toutes les principautés, et de toutes les vertus des cieux.</p><p>CXXI. Mes interlocuteurs gardant le silence, je continuai : Remarquez, mes amis, que l’Écriture, parlant du Christ par la bouche de David, ne dit pas que les nations seront bénies en sa race, mais en lui-même. Voici ses propres paroles : « Son nom, dans tous les siècles, s’élèvera au-dessus du soleil, et en lui seront bénies toutes les nations. » Si toutes les nations sont bénies en lui, et si nous autres, qui croyons en son nom, nous faisons partie de ces nations, dès lors la bénédiction tombe sur nous, puisqu’il est le Christ. Dieu avait souffert qu’on adorât le soleil ; mais s’est-il trouvé un seul homme qui voulût mourir en témoignage de sa foi au soleil ? Vous trouvez, au contraire, dans toutes les conditions, des hommes qui ont souffert et qui souffrent encore tous les supplices imaginables pour le nom de Jésus, plutôt que de le nier ; c’est que sa parole toute de vérité et de sagesse est bien autrement vive, bien autrement éclatante, que la chaleur et la lumière du soleil ; elle pénètre dans tous les replis du cœur et de l’esprit ; voilà pourquoi l’Écriture nous dit : « Son nom s’élèvera au-dessus du soleil. » Un autre prophète s’écrie : « L’Orient est son nom. » Ce prophète c’est Zacharie ; il dit ailleurs en parlant du Christ : « À son aspect les tribus d’Israël pousseront des gémissements. » Si dès son premier avénement, qui était celui des humiliations et des mépris, il a déjà jeté tant d’éclat et déployé une si grande force, qu’il a pu se faire connaître de toutes les nations, ramener à la vertu des hommes plongés depuis si longtemps dans le crime, au point que les démons tremblent à son nom ; que les royaumes et les principautés le redoutent plus que toutes les puissances qui ont jamais existé ; comment ne pourrait-il pas, au jour de son glorieux avénement, renverser ceux qui l’ont poursuivi de leur haine, ou qui l’ont indignement abandonné et introduire dans son repos ses fidèles serviteurs et les combler de tous les biens qu’il leur a promis ? Par lui il nous a été donné d’entendre et de comprendre, d’obtenir le salut, et de connaître tout ce que Dieu le père a voulu nous révéler ; aussi Dieu le père adresse-t-il au Christ ces paroles : « Il vous est glorieux d’être appelé mon serviteur, pour réparer les restes de Jacob et convertir les tribus d’Israël ; je vous ai établi la lumière des nations et le salut des extrémités de la terre. »</p><p>CXXII. Vous croyez que ces paroles s’entendent des étrangers ou de vos prosélytes. Elles n’ont de sens véritable qu’autant qu’elles s’appliquent à nous autres gentils amenés à la lumière par Jésus : s’il en était autrement, il vous aurait rendu témoignage ; mais qu’a-t-il dit à l’égard de vous ? Que vous étiez doublement enfants de colère. Ainsi donc ces paroles des prophètes s’entendent, non de vos prosélytes, mais de nous autres, dont l’Écriture parle en ces termes : « Je conduirai les aveugles dans une voie qu’ils ne connaissent pas, et je les ferai marcher dans des sentiers qu’ils ignorent. C’est moi qui l’atteste, dit le Seigneur, et avec moi le serviteur que j’ai choisi. » À qui le Christ rend-il témoignage ? N’est-ce pas à ceux qui croient en lui ? Non-seulement vos prosélytes n’y croient pas, mais ils enchérissent encore sur vous dans leurs blasphèmes contre le nom de Jésus ; et nous autres qui croyons, nous avons tout à souffrir de leur part : ils ne cherchent qu’à nous faire mourir ; enfin ils se montrent en toutes choses vos dignes émules. Ailleurs, le Seigneur dit encore : « Moi le souverain maître, je t’ai appelé dans les décrets de ma justice ; je te prendrai par la main, je te donnerai pour signe d’alliance à mon peuple, et pour lumière aux nations ; tu ouvriras les yeux aux aveugles, tu briseras les fers des captifs. » Quand vous voyez si clairement que chaque parole se rapporte au Christ et aux nations qu’il a éclairées, direz-vous encore que c’est la loi, que ce sont vos prosélytes que le Seigneur avait en vue ?</p><p>Alors quelques-uns de ceux qui étaient venus la veille se mirent à crier, comme s’ils étaient au théâtre : — Quoi donc ! est-ce que tous ces passages ne s’entendent pas de la loi et de tous ceux qu’elle éclaire, c’est-à-dire des prosélytes que nous pouvons faire ?</p><p>— Point du tout, répondis-je en regardant Tryphon ; car si la loi suffit pour éclairer et les gentils et ceux qui vivent sous la loi, qu’était-il besoin d’un testament nouveau ? Mais puisque Dieu a dit qu’il établirait un commandement, un testament nouveau, une loi éternelle, nous voyons bien qu’il ne s’agit plus de l’ancienne loi, ni de ses prosélytes ; mais du Christ et des prosélytes du Christ, c’est-à-dire de nous autres gentils qu’il a éclairés, comme il le dit ailleurs. Ainsi parle le Seigneur : « Je t’ai exaucé au temps de miséricorde, je t’ai secouru au jour de salut, je t’ai établi comme le testament des nations, pour reconstituer la terre et recevoir en héritage les contrées abandonnées. » Quel est l’héritage du Christ ? N’est-ce pas les gentils ? Quel est le testament de Dieu ? N’est-ce pas le Christ lui-même ? Ainsi qu’il le dit encore dans un autre endroit : « Tu es mon fils, je t’ai engendré aujourd’hui ; demande-moi les nations et je te les donnerai en héritage ; les confins de la terre seront les bornes de ton empire. »</p><p>CXXIII. Reconnaissez donc que tout, en effet, s’entend du Christ et ne peut s’expliquer autrement. Vos prosélytes n’ont pas besoin de testament nouveau, puisque tous les circoncis sont compris sous une seule et même loi ; et l’Écriture a dit en parlant de ces derniers : « Les étrangers se joindront à eux ; ils s’uniront à la maison de Jacob. » Le prosélyte a besoin d’être circoncis pour s’unir au peuple et faire, aux yeux de tous, partie de la nation. Eh bien ! nous qu’on appelle le peuple choisi, nous jugés dignes de prendre ce titre, nous sommes la nation sainte, par là même que nous ne sommes pas circoncis. N’est-il pas ridicule de croire que les yeux de vos prosélytes sont ouverts à la lumière, tandis que les vôtres restent fermés ; qu’ils entendent et qu’ils voient, tandis que vous êtes sourds et aveugles ? Mais ne tombez-vous pas dans un plus grand ridicule, si vous dites que la loi fut donnée aux gentils, et que cette même loi vous ne l’avez pas connue : assurément si vous l’aviez connue vous auriez redouté la colère de Dieu ; vous ne seriez pas des enfants d’iniquité, flottant çà et là au gré de l’erreur ; vous vous seriez épargné ces reproches que vous adresse si souvent le Seigneur : « Véritables enfants d’incrédulité ; et qui est plus aveugle que mes serviteurs, plus sourd que ceux qui les gouvernent ! Oui, les serviteurs de Dieu sont aujourd’hui dans l’aveuglement. Vous avez vu sans voir, vos oreilles étaient ouvertes, et vous n’avez pas entendu. » Quel bel éloge Dieu fait de vous ! Voilà pour des serviteurs un glorieux témoignage, que celui qu’il vous rend ! Quoi ! ne rougissez-vous pas d’entendre et de mériter toujours les mêmes reproches ? ne tremblez-vous pas à toutes ces menaces du Seigneur ? Mais non, vous êtes un peuple insensé, dont le cœur est endurci. « C’est pourquoi, dit le Seigneur, je ferai plus, je rejetterai ce peuple ; oui, je le rejetterai, je perdrai la sagesse des sages, j’obscurcirai l’intelligence de ceux qui se croient habiles. » Et ne l’avez-vous pas mérité ? Vous n’avez ni sagesse, ni lumière, je ne vois en vous que ruse et astuce ; vous ne vous entendez bien qu’à faire le mal. Mais vous ne savez point pénétrer les secrets de Dieu, distinguer son testament véritable, découvrir ses sentiers éternels. « C’est pourquoi, dit le Seigneur, je sèmerai en la maison d’Israël et en la maison de Juda une semence d’hommes et une semence d’animaux. » Il fait ainsi parler Isaïe au sujet d’Israël : « En ce jour, Israël se joindra pour troisième aux peuples d’Égypte et d’Assyrie ; la bénédiction du Seigneur sera sur la terre ; le Dieu des armées l’a bénie, en disant : Je bénis l’Égypte, elle devient mon peuple, ainsi que l’Assyrie ; mais Israël est mon héritage. »</p><p>Puisque Dieu bénit ce peuple, l’appelle Israël et le proclame son héritage, comment ne faites-vous pas pénitence et de votre orgueil, qui vous fait croire que vous êtes le seul Israël, et de votre haine, qui voue à l’exécration le peuple béni de Dieu ? Car le Seigneur, après s’être adressé à Jérusalem et à toutes les contrées qui l’entourent, ajoute ces paroles : « Je ferai naître des hommes à votre place qui deviendront mon peuple, ils vous posséderont en héritage, vous tomberez en leur pouvoir, et vous ne pourrez les empêcher de vous ravir vos enfants. »</p><p>— Et quoi donc ! s’écrie alors Tryphon, c’est vous qui êtes Israël, c’est de vous que parle le prophète !</p><p>Si ce n’était pas, lui dis-je, une de ces questions que j’ai bien discutées avec vous, je ne saurais plus si c’est faute de me comprendre que vous me faites ici une pareille demande. Mais comme c’est une affaire terminée, un point éclairci qui a pour lui ses preuves et votre assentiment, je ne puis croire qu’il vous reste ici le moindre doute, ou que l’esprit de contention vous porte à soulever de nouvelles difficultés. Vous m’excitez plutôt, je pense, à revenir sur les mêmes preuves pour l’instruction de nos nouveaux auditeurs. Tryphon me fit de l’œil un signe d’approbation, et je continuai : Si vous me prêtez une oreille bien attentive, vous comprendrez que Dieu, parlant du Christ en parabole dans Isaïe, l’appelle Jacob et Israël, témoin ce passage :</p><p>« Jacob est mon serviteur, je prendrai sa défense ; Israël est celui que j’ai choisi. J’ai répandu sur lui mon esprit ; il portera la justice parmi les nations ; il ne criera point ; il ne contestera point ; personne n’entendra sa voix sur les places publiques ; il ne foulera point aux pieds le roseau déjà brisé. Il n’éteindra pas le lin qui fume encore, mais il jugera dans la vérité ; ses bras seront ouverts à tous ; il ne brisera personne, jusqu’à ce qu’il ait établi la justice sur la terre, et les nations espéreront en son nom. » De même que toute votre nation fut appelée Jacob et Israël, de Jacob surnommé Israël, de même du Christ, qui nous a engendré au vrai Dieu, nous est venu le privilége d’être appelés et d’être, en effet, non pas seulement et Jacob et Israël, et Juda et Joseph, et David, mais encore les véritables enfants de Dieu, fidèles observateurs des commandements du Christ.</p><p>CXXIV. Les voyant tout troublés de ces dernières paroles, j’allai au-devant de leurs questions : Écoutez, leur dis-je, écoutez, mes amis, en quels termes l’Esprit saint proclame tous ceux qui composent ce nouveau peuple, les fils du Très-Haut, et nous annonce que le Christ en personne se trouvera au milieu d’eux pour juger tous les hommes. Voici les paroles de David telles que vous les entendez vous-mêmes : « Dieu a pris sa séance dans l’assemblée des dieux et, assis au milieu, il juge les dieux. Jusques à quand prononcerez-vous l’iniquité ? Jusques à quand accueillerez-vous le visage des méchants ? Jugez pour le pauvre et pour le pupille ; justifiez le pauvre et le faible ; arrachez le pauvre et l’indigent de la main du pécheur : ils n’ont pas compris, ils n’ont pas su, ils marchent dans les ténèbres, tous les fondements de la terre seront ébranlés. Je l’ai dit : Vous êtes des dieux, vous êtes tous les fils du Très-Haut ; mais vous mourrez comme des hommes, et, comme un des rois, vous tomberez. Levez-vous, ô dieux ! jugez la terre ; toutes les nations seront votre héritage. »</p><p>La version des Septante porte : « Voici que vous mourez comme des hommes et que vous tombez comme un des rois. » Par ces mots, le prophète rappelle la désobéissance de l’homme, c’est-à-dire d’Adam et d’Ève, et la chute du chef des anges, c’est-à-dire de celui qui est appelé serpent, et qui fit la chute la plus profonde pour avoir trompé Ève.</p><p>Mais ce n’est pas là ce que je voulais établir en vous citant ces paroles : je n’avais d’autre intention que de vous montrer sur quoi portait le reproche que l’Esprit saint fait aux hommes, lorsqu’il leur dit que, créés pour être semblables au Seigneur, impassibles et immortels s’ils observent ses commandements, et honorés du nom de fils de Dieu, ils se sont rendus semblables à Adam et à Ève en se donnant eux-mêmes la mort. Cette explication du psaume n’est peut-être pas la vôtre ; mais il n’en reste pas moins vrai qu’il a été donné à tous de pouvoir être des dieux et des enfants du Très-Haut, et que chacun sera jugé et condamné comme Ève et Adam l’ont été. Que le Christ soit appelé Dieu, vous avez pu vous en convaincre par les nombreux passages que j’ai cités.</p><p>CXXV. Mais veuillez me dire, mes amis, quel sens vous donnez au mot <i>Israël</i> ? Comme tous se taisaient, je repris la parole :</p><p>Je vais vous dire à cet égard mon sentiment. Il ne convient pas, je pense, de vous le taire ou de me laisser trop préoccuper par cette idée que vous le connaissez, mais que vous cherchez toujours par envie ou par une ignorance volontaire à vous abuser vous-même. Je vous dirai donc simplement et sans détour toute ma pensée. Et le maître que je sers n’a-t-il pas dit qu’un homme étant sorti pour semer, une partie du grain tomba sur le chemin, une autre parmi des épines, une autre dans un endroit pierreux, une autre enfin dans une bonne terre ? Il faut donc parler dans l’espérance que cette bonne terre est quelque part. Car notre maître, celui dont je vous parle, viendra, plein de force et de puissance, redemander à chacun de nous ses propres dons. Il ne condamnera point l’économe qui aura placé partout l’argent qu’il a reçu, et qui se sera bien gardé de l’enfouir sous aucun prétexte, parce qu’il savait que le maître était sévère et qu’il devait venir un jour réclamer ce qu’il a confié.</p><p>Le mot <i>Israël</i> signifie homme qui triomphe de la force ; car <i>Isra</i> veut dire homme qui triomphe, et <i>ël</i>, force. Et voilà ce que devait faire le Christ après s’être fait homme, comme l’annonce mystérieusement la lutte de Jacob contre le Verbe, qui alors ne lui paraissait qu’un homme, parce qu’il exécutait les ordres de son père, mais qui était Dieu en sa qualité de premier-né de la création ? Quand il se fut fait homme, le démon, ainsi que je l’ai déjà rapporté, s’approcha de lui ; et, par le démon, j’entends cette puissance ennemie que nous appelons serpent ou Satan. Le démon tenta Jésus, il essaya de l’abattre, il lui demanda de l’adorer ; mais c’est le Christ qui l’abattit, qui le terrassa, lui montrant sa perversité, puisque, contrairement à l’Écriture, il voulait se faire adorer comme un dieu, poussant jusque-là la trahison et la perfidie. Le Christ lui répondit : Il est écrit : « Tu adoreras le Seigneur ton Dieu ; tu ne serviras que lui seul. » Le démon se retira, terrassé et confondu par cette parole. Le Christ devait comme languir et dessécher dans les larmes et les souffrances lorsqu’il serait mis en croix, et voilà ce qu’il prédit d’avance quand il toucha la cuisse de Jacob qui se sécha aussitôt. Il avait toujours eu ce nom d’Israël qu’il donna à Jacob. Il le bénit donc de son propre nom, et par là, il nous annonçait que tous ceux qui par lui recourent à son père sont cet Israël qu’il a béni. Mais vous ne comprenez pas tous ces mystères et vous ne préparez pas votre esprit à les comprendre ; et parce que vous êtes enfants de Jacob selon la chair, vous vous flattez que vous serez tous sauvés. Je vous ai assez longuement prouvé que c’était trop vous abuser vous-même.</p><p>CXXVI. Si vous saviez quel est celui qui est appelé <i>ange du grand conseil</i> et <i>homme</i> par Ézéchiel, <i>comme le Fils de l’homme</i> par Daniel, <i>petit enfant</i> par Isaïe, <i>Christ</i> et <i>Dieu adorable</i> par David, <i>Christ</i> et <i>pierre</i> par un grand nombre de prophètes, <i>sagesse</i> par Salomon, <i>Joseph, Juda, étoile</i> par Moïse, <i>orient</i> par Zacharie, et, de nouveau, par Isaïe, <i>Passible, Jacob, Israël, sceptre, fleur, grande pierre angulaire</i> ; oui, dis-je, si vous le connaissiez, vous ne le poursuivriez pas de vos blasphèmes comme vous le faites depuis qu’il est venu, qu’il est né, qu’il a souffert, qu’il est monté aux cieux, lui qui doit revenir un jour. Quels gémissements feront entendre alors vos douze tribus ! Car, si vous aviez l’intelligence de toutes les paroles des prophètes, vous ne pourriez refuser de le connaître comme Dieu et fils du Dieu unique, incréé, inénarrable. N’est-ce pas lui que Moïse fait parler en ces termes quelque part dans l’Exode ? « Le Seigneur parla à Moïse et lui dit : Je suis le Seigneur et je me suis montré à Abraham, à Isaac et à Jacob, car je suis leur Dieu. Je ne leur ai pas fait connaître mon nom, mais je leur ai donné mon Testament. » Moïse dit ailleurs : « Un homme lutta avec Jacob, » et il assure que cet homme était Dieu ; car il rapporte que Jacob s’écria : « J’ai vu le Seigneur face à face, et mon âme a été sauvée. » Il ajoute que le lieu de cette lutte, de cette vision, de cette bénédiction du Seigneur, Jacob l’appela <i>face de Dieu</i>. Dieu, dit Moïse, se montra de même près du chêne de Mambré au patriarche Abraham, assis à la porte de sa tente vers l’heure de midi. « Alors Abraham, continue Moïse, leva les yeux et vit trois hommes qui se tenaient debout devant lui ; et lorsqu’il les eut vu, il alla à leur rencontre ; quelques moments après, l’un d’eux promit un fils à Abraham, et lui dit : Pourquoi Sara s’est-elle mise à rire en s’écriant : Est-ce que je pourrai enfanter, avancée en âge comme je le suis ? Y a-t-il quelque chose d’impossible à Dieu ? Je reviendrai vers toi selon ma parole, en ce temps, et Sara aura un fils. » Alors ils quittèrent Abraham, et Moïse continuant à parler d’eux, ajoute ces paroles : « Ces hommes, se levant, tournèrent les yeux vers Sodôme. » Il nous raconte ensuite comment celui qui est et qui était s’entretint avec Abraham : « Je ne cacherai pas à mon serviteur Abraham ce que je vais faire. »</p><p>Je rappelai les paroles de Moïse qui viennent après, et que j’ai citées plus haut, pour montrer que celui qui apparut à Abraham, à Isaac, à Jacob et aux autres patriarches préside à tout, sous le Dieu père et souverain maître, dont il exécute les volontés, et qu’il est lui-même appelé Dieu dans les Écritures. À ces citations j’en ajoutai une nouvelle : Lorsque le peuple désira manger de la chair, Moïse ne crut point à la parole de celui qui prend ici le nom d’ange, et qui lui promettait que Dieu donnerait au peuple, jusqu’à satiété, cette espèce de nourriture qu’il désirait ; et voici ce que fit et ce que dit en cette circonstance celui qui est Dieu et qui se présentait comme un ange envoyé par Dieu le père ; l’Écriture nous le raconte en ces termes : « Le Seigneur dit à Moïse : La main de Dieu est-elle affaiblie ? Tu verras à l’œuvre si ma parole sera accomplie. » Et dans un autre endroit l’Écriture s’exprime ainsi : « Le Seigneur m’a parlé ; tu ne passeras point le fleuve du Jourdain ; le Seigneur ton Dieu qui marche devant toi exterminera lui-même les nations. »</p><p>CXXVII. J’aurais bien d’autres passages semblables à vous citer, de Moïse et des prophètes, mais tous ceux-ci doivent suffire, je pense, pour vous convaincre lorsque vous lisez ces paroles : « Le Seigneur disparut de devant Abraham, » ou bien « le Seigneur dit à Moïse ; » et ailleurs, « le Seigneur descendit pour voir la tour qu’avaient élevée les enfants des hommes ; » ou ces autres paroles, « Dieu ferma en dehors l’arche de Noé ; » pour vous convaincre, dis-je, que ce n’est pas le Dieu incréé qui est descendu ou monte de quelqu’endroit. Car le Père, le souverain maître de toutes choses, dont le nom est inénarrable, ne va pas d’un lieu à un autre ; il ne marche, ni ne dort ; il demeure dans son séjour qui est partout ; il n’est rien qu’il ne discerne, qu’il n’entende parfaitement sans yeux et sans oreilles ; mais par sa seule vertu ineffable il voit tout, il entend tout ; personne ne lui échappe, il ne change point de lieu ; l’espace, que dis-je ! le monde tout entier, ne peut le contenir, car il était avant le monde ; et comment pourrait-il parler ou apparaître à quelqu’un, ou se montrer sur un petit coin de terre, puisque le peuple sur le mont Sinaï ne put supporter l’éclat de celui qu’il avait envoyé, puisque Moïse lui-même n’aurait pu entrer dans le tabernacle qu’il avait fait, si Dieu l’eût rempli de sa gloire ; puisque le grand-prêtre ne put se tenir debout à la porte du temple quand Salomon fit entrer l’arche sainte dans la demeure qu’il venait d’élever au Très-Haut à Jérusalem ? Ainsi donc, ni Abraham, ni Isaac, ni Jacob, ni aucun homme n’a vu le souverain arbitre dont le nom est inénarrable ; le Père de toutes choses et du Christ lui-même ; mais ils ont vu celui qui, selon la volonté du Père, est son fils et Dieu lui-même, et son ange, parce qu’il exécute ses ordres ; c’est lui qui s’est fait homme et a voulu naître d’une vierge, et qui autrefois s’était entretenu du milieu d’un buisson avec Moïse, sous la forme du feu. Si ce n’était pas le sens des divines Écritures, qu’arriverait-il ? Il faudrait dire que le Père, le maître de toutes choses, n’était point dans le Ciel dans cette circonstance ou Moïse nous dit : « Le Seigneur a fait tomber du ciel sur Sodôme, par le Seigneur, une pluie de soufre et de feu ; » ou lorsqu’il est dit ailleurs par David : « Princes, ouvrez vos portes, élevez vos portes éternelles, et le roi de gloire entrera ; » ou bien lorsque le même prophète dit encore : « Le Seigneur a dit à mon Seigneur : asseyez-vous à ma droite jusqu’à ce que je réduise vos ennemis à vous servir de marche-pied. »</p><p>CXXVIII. Il est bien démontré, par toutes les preuves que je vous ai apportées, que le Christ est véritablement Seigneur, Dieu et fils de Dieu ; et que, par l’effet de sa puissance, il s’est montré autrefois sous la forme d’un homme et sous celle d’un ange, et avec l’éclat du feu, comme dans le buisson et dans le jugement de Sodôme. Je rappelai de nouveau ce que j’avais cité de l’Exode sur la vision du buisson ardent, et sur le nom de Jésus donné au fils de Nave, et j’ajoutai : Si je reviens aussi souvent sur les mêmes passages, ne regardez pas ces redites comme de vaines superfluités de paroles. Je me les permets parce que je sais comment quelques-uns interprètent ces passages : ils disent qu’à la vérité cette vertu qui apparut de la part du Dieu créateur à Moïse, ou à Abraham, ou à Jacob, est appelée ange lorsqu’elle apparaît aux hommes, parce qu’elle leur transmet les ordres du Père de toutes choses ; gloire, parce qu’elle se manifeste quelquefois par des visions, dont on ne peut soutenir l’éclat ; homme, lorsqu’il plaît à Dieu qu’elle prenne cette forme ; vertu enfin, parce qu’elle fait entendre aux mortels la parole du Très-Haut. Mais cette vertu, selon eux, ne peut se détacher et se séparer du Père, comme la lumière ne peut, sur la terre, se détacher et se séparer du soleil qui est dans le ciel et finit lorsque le soleil se couche. « Ainsi, quand Dieu le veut, ajoutent-ils, sa vertu jaillit au loin, et quand il le veut elle rentre en lui-même. » Il est prouvé que les anges sont des êtres qui existent et demeurent toujours et ne rentrent point dans le néant d’où ils sont sortis. Eh bien ! cette vertu que l’Esprit saint appelle Dieu et appelle ange, ainsi que nous l’avons montré par tant de passages, j’ai fait voir plus haut qu’elle était permanente et distinguée, non-seulement de nom comme le rayon du soleil, mais de nombre ; oui, cette vertu est engendrée du Père par sa volonté et par sa puissance ; mais ce n’est point par retranchement ou diminution, comme si sa substance était divisée et diminuée, ainsi que les objets qui se partagent et se divisent cessent d’être ce qu’ils étaient avant le partage et la division ; et plus haut j’ai cité pour exemple les feux que nous voyons allumer à un autre feu : ces feux ne diminuent point le premier, il reste toujours le même.</p><p>CXXIX. Permettez-moi de reproduire ici les témoignages déjà cités comme des preuves de cette vérité. Lorsque l’Esprit saint dit : « Le Seigneur fit tomber du ciel par le Seigneur une pluie de feu, » il nous montre bien ici deux personnes distinctes ; l’une sur la terre, descendue pour entendre la clameur élevée de Sodôme ; l’autre dans le ciel, c’est-à-dire le maître du maître qui se montrait sur la terre, le Dieu et père qui lui communique sa puissance, et le fait Seigneur et Dieu. Lorsque l’Écriture rapporte que Dieu dit au commencement : « Voici qu’Adam a été fait à la ressemblance de l’un de nous, » elle indique encore clairement un nombre de personnes distinctes ; ce n’est point ici une métaphore, comme veulent l’entendre les sophistes et ceux qui ne peuvent dire ni comprendre la vérité, mais voici ce que nous lisons dans le livre de la Sagesse : « Je vous annoncerai ce qui arrive dans le temps, je raconterai ce qui s’est fait depuis le commencement des siècles ; le Seigneur m’a créé au commencement de ses voies, avant ses œuvres ; j’étais dans le principe avant les siècles ; la terre n’était pas, ni les abîmes, et j’étais engendré. Il m’engendra avant les sources, avant les montagnes, avant les collines. » Je m’adressai ensuite à mes auditeurs : Mes amis, leur dis-je, si vous m’avez écouté, vous avez compris que l’Écriture déclare formellement que Dieu le père engendra son fils avant toutes les choses créées ; or, vous avouerez tous que celui qui est engendré est une personne distincte de celui qui l’engendre.</p><p>CXXX. Tous firent un mouvement d’approbation, et je continuai. Produisons d’autres témoignages dont je ne me suis pas encore servi. Moïse, ce fidèle serviteur de Dieu, s’exprime d’une manière mystérieuse en ces termes : « Nations, réjouissez-vous avec lui ; que tous les anges du ciel l’adorent. » Et j’ajoutai les paroles qui suivent dans l’Écriture : « Nations, réjouissez-vous avec son peuple ; que les anges du Ciel lui donnent leur force parce qu’il venge et qu’il vengera ses fils, qu’il tirera vengeance de ceux qui le haïssent, et qu’il purgera la terre de son peuple. » Ainsi, le prophète dit hautement que nous autres gentils nous nous réjouissons avec son peuple, c’est-à-dire avec Abraham, Isaac, Jacob, avec les prophètes, en un mot, avec tous ceux d’entre vous qui ont été agréables au Seigneur, ainsi que nous sommes convenus de l’entendre. Par son peuple, en effet, nous ne pouvons pas entendre tous ceux qui composent votre nation, puisque nous savons d’Isaïe que les membres des prévaricateurs seront dévorés par les vers et par un feu qui ne s’éteindra jamais ; qu’ils seront indestructibles pour être un exemple et un spectacle offert à tous les hommes. Outre ces témoignages, je veux encore vous en citer d’autres tirés également des livres de Moïse : ils vous apprendront que Dieu autrefois dispersa les hommes et les sépara en différentes races, selon leurs langues ; qu’il choisit votre nation entre toutes les autres ; qu’elle lui fut inutile ; qu’elle se montra désobéissante et infidèle ; que nous, au contraire, qui sommes devenus son peuple, peuple choisi comme vous d’entre tous les autres peuples, nous avons su obéir à sa volonté par la grâce du Christ, qu’il appelle tantôt Jacob, tantôt Israël, et que dès lors nous devons être le véritable Jacob, le véritable Israël. Lorsqu’il dit : « Nations, réjouissez-vous avec le peuple de Jacob, » il leur donne avec un héritage semblable un nom différent ; mais lorsqu’il dit que les nations se réjouissent avec son propre peuple, il veut vous faire rougir. Vous excitiez sa colère en adorant des idoles, et il appelle les idolâtres ; c’est à eux qu’il daigne faire la grâce de connaître ses volontés et d’entrer dans son héritage.</p><p>CXXXI. Mais citons les paroles de l’Écriture qui nous montrent Dieu faisant la séparation des peuples ; les voici : « Interroge ton père, et il t’apprendra ; interroge tes ancêtres, et ils te diront : quand le Très-Haut divisait les nations, quand il séparait les enfants d’Adam, il marqua les limites des peuples selon le nombre des fils d’Israël. Jacob est devenu le partage du Seigneur ; Israël est devenu son héritage. » Quant aux Septante, ajoutai-je, c’est ainsi qu’ils traduisent : « Il marqua les limites des peuples selon le nombre des anges du Seigneur. » J’ai adopté votre sens, parce qu’il n’affaiblit en rien mon raisonnement. Voyons quel est le véritable Jacob, le véritable Israël. Si vous voulez être de bonne foi, vous avouerez que nous autres gentils que Dieu a appelé, par le mystère de la croix, si abject et si honteux, nous que les démons et leurs suppôts livrent aux supplices sans autre motif que celui de notre foi, de notre soumission et de notre piété, et poursuivent jusqu’à la mort par votre propre ministère, que vous ne leur refusez jamais ; vous avouerez, dis-je, qu’il n’est point de tourments que nous ne supportions plutôt que de renier, je ne dis pas de cœur, mais seulement de bouche, le Christ qui nous a appelés au salut préparé par son père ; vous conviendrez dès lors que nous sommes bien autrement fidèles à Dieu que vous autres, qui cependant en avez reçu tant de bienfaits. N’a-t-il pas déployé pour vous toute la force de son bras ? Ne vous a-t-il pas visité dans tout l’éclat de sa gloire, quand il vous a racheté de l’Égypte ? N’a-t-il pas divisé pour vous les eaux de la mer ? Ne vous a-t-il pas ouvert un chemin à travers ses abîmes ? N’a-t-il pas frappé de mort, dans ce chemin miraculeux, ceux qui vous poursuivaient avec tout l’appareil de leur puissance et dans des chars magnifiques ? N’a-t-il pas refermé sur eux la mer qu’il avait affermi sous vos pas ? Ne sommes-nous pas plus fidèles que vous, aux yeux desquels il a fait briller une colonne de feu, et qui, seuls de tous les peuples, avez vu s’allumer tout exprès pour vous un flambeau qui ne pouvait ni décroître ni s’éteindre ; vous, qu’il a nourri d’un pain tout particulier, du pain même des anges, quand il fit pleuvoir sur vous la manne du ciel, afin que vous n’ayez pas même besoin de vous occuper de votre nourriture ; vous, pour qui les eaux de Mara oublièrent leur amertume et devinrent si douces à boire ; vous enfin, sur qui, bien avant les temps marqués, découlèrent toutes les grâces des mystères à venir, par une faveur toute particulière de ce Dieu, envers qui vous vous êtes toujours montrés si ingrats ? N’avait-il pas, ainsi que je l’ai déjà dit, placé sous vos yeux le signe de celui qui devait être mis en croix, lorsque des serpents vous couvrirent de leurs morsures ; lorsqu’Amalech était vaincu par la figure que formaient les bras étendus de Moïse, et par le nom que portait celui qui fut surnommé Jésus ? Aussi Dieu voulut-il que le nom de Jésus se retrouvât partout, dans vos livres, et frappât sans cesse vos oreilles. C’est lui, vous disait-il, qui doit effacer de dessus la terre le souvenir d’Amalech. Or, tout le monde sait que le nom d’Amalech subsistait encore après le fils de Nave. Tout ici était donc symbolique et annonçait Jésus crucifié, par qui les démons seraient chassés de toutes parts, dont le nom seul les ferait trembler, et serait également redoutable à toutes les puissances et principautés ; tandis qu’on verrait chez tous les peuples, dans ceux qui croient en ce même nom, des hommes vraiment pieux et pacifiques ; n’est-ce pas, Tryphon, ce qu’attestent les Écritures et ce que démontrent tous les passages que j’ai cités ? Vous désiriez-vous nourrir de chair, et il vous tomba une si grande quantité d’oiseaux que vous ne pouviez les compter. Pour vous, l’eau a jailli des rochers ; sur vos têtes s’est étendu un nuage qui vous mettait à l’ombre contre l’ardeur du soleil, vous défendait contre la rigueur du froid et vous suivait partout, présentant comme l’image et la figure d’un nouveau ciel. Les courroies de vos chaussures ne se sont pas brisées ; vos chaussures elles-mêmes ne se sont pas usées non plus que vos vêtements ; ils se renouvelaient sur le corps des plus jeunes.</p><p>CXXXII. Et après tous ces prodiges, vous vous êtes fait un veau d’or ; c’est aux filles des étrangers que vous avez livré vos cœurs, c’est à des idoles que vous avez porté votre encens ; et cependant vous avez vu par quels prodiges la terre promise vous a été livrée ; vous avez vu le soleil, à l’ordre de celui qui fut appelé du nom de Jésus, s’arrêter au milieu du ciel, vous donner pendant trente-six heures sa lumière, et tant d’autres merveilles qui vous ont été prodiguées à différentes époques. Il en est une que je crois important de rappeler ici, elle aura cet avantage de vous faire bien connaître ce Jésus que nous reconnaissons pour le Christ et le fils de Dieu ; ce Jésus crucifié, ressuscité, monté aux cieux, et qui doit venir un jour juger tous les hommes, sans excepter Adam lui-même. Vous savez que les habitants d’Azot, vos ennemis, s’étant emparés de l’arche d’alliance, et se voyant frappés de plaies horribles et incurables, prirent le parti de la placer sur un char attelé de jeunes génisses qui n’avaient pas encore porté le joug ; ils voulaient s’assurer si la force du Tout-Puissant s’appesantissait sur eux à cause de l’arche, et si Dieu demandait qu’elle fût ramenée où elle avait été prise. Ces génisses, sans que personne guidât leurs pas, se dirigèrent, non vers l’endroit d’où l’arche avait été emportée, mais vers le champ d’un homme appelé Ausès, c’est-à-dire du même nom que celui qui fut surnommé Jésus, et qui introduisit les Hébreux dans la terre promise et la leur distribua. Arrivées dans ce champ, elles s’arrêtèrent ; ce qui vous prouve qu’elles étaient conduites par la vertu même de ce nom, comme autrefois les restes d’Israël, épargnés dans le désert après la sortie d’Égypte, furent introduits dans la terre promise par celui qui reçut le nom de Jésus, et qui s’appelait auparavant Ausès.</p><p>CXXXIII. Vous avez eu sous les yeux, à diverses époques, ces prodiges et d’autres semblables, et c’est vous cependant que les prophètes accusent d’immoler vos enfants aux démons, et d’ajouter à ces crimes les crimes plus affreux encore que vous avez commis et que vous commettez tous les jours contre le Christ. Ah ! puissiez-vous avec la miséricorde de Dieu et la grâce qui vient du Christ obtenir le pardon de ces crimes et mériter le salut ; car Dieu qui, dans sa prescience, voyait à quels excès vous vous porteriez, vous a ainsi maudits par le prophète Isaïe : « Malheur à l’âme de ceux qui se laissent aller à de mauvais conseils contre eux-mêmes et qui disent : emprisonnons le juste, parce que sa vue nous gêne ! Ils dévoreront le fruit de leurs œuvres. Malheur à l’injuste, ses œuvres tourneront contre lui ! Ô mon peuple ! vos tyrans vous ont dépouillé, des tyrans vous gouvernent. Ô mon peuple ! ceux qui t’appellent heureux te trompent ; ils dérobent à tes yeux le sentier où tu dois marcher : le Seigneur est debout pour juger, il est sur son tribunal pour juger son peuple, le Seigneur interrogera les vieillards et les princes de son peuple ; vous avez ravagé ma vigne, et la dépouille du pauvre est dans vos palais. Pourquoi avez-vous écrasé mon peuple et foulé la tête du pauvre comme sous le pressoir ? » Plus loin, le prophète s’écrie dans le même sens : « Malheur à vous, qui traînez l’iniquité comme de longues chaînes, et le péché comme les traits d’un char ; qui osez dire, qu’il se hâte, que son œuvre commence devant nous, et nous la verrons ; qu’il approche, que les conseils du saint d’Israël nous soient manifestés, et nous saurons s’ils sont véritables ! Malheur à vous, qui appelez mal le bien, et bien le mal ; qui changez les ténèbres en lumière, et la lumière en ténèbres, l’amertume en douceur et la douceur en amertume ! malheur à vous, qui êtes sages à vos propres yeux ! malheur à ceux qui croient à leur prudence ! malheur à vous, qui mettez votre gloire à supporter le vin et votre force à remplir vos coupes de liqueurs enivrantes, qui justifiez l’homme inique à cause de ses dons, et qui ravissez à l’innocent la justice ! C’est pourquoi, comme le chaume est dévoré par la flamme, ainsi ce peuple sera séché jusque dans ses racines, et sa race se dissipera en poussière ; il a répudié l’alliance du Seigneur, il a blasphémé la parole du saint d’Israël, la colère du Seigneur va éclater contre son peuple ; il appesantira sa main sur lui ; il l’a frappé ; les montagnes se sont ébranlées ; répandus comme la boue, les cadavres ont couvert les places ; et malgré tous ces châtiments, ils ne sont pas encore corrigés et leur main est encore étendue ! » Oui, votre main est encore étendue pour faire le mal. Vous avez mis à mort le Christ ; loin d’en faire pénitence, vous nous poursuivez de votre haine, ainsi que je l’ai déjà dit, nous qui, par le Christ, croyons maintenant au Dieu créateur et père de toutes choses ; et toutes les fois que vous le pouvez vous ne manquez pas de nous mettre à mort. Avez-vous jamais cessé de charger de malédictions et le Christ, et tous ceux qui sortis de lui portent son nom ? Quant à nous autres, nous ne savons que prier pour vous et pour tous les hommes : ainsi nous l’a recommandé le Christ, notre divin maître ; il nous a fait une loi de prier pour nos ennemis, d’aimer ceux qui nous détestent, de bénir ceux qui nous maudissent.</p><p>CXXXIV. Si sa doctrine et celle des prophètes touchent vos cœurs, suivez plutôt la voix de Dieu que la voix mensongère de ces maîtres aveugles et insensés qui vous permettent encore maintenant d’avoir quatre ou cinq femmes à la fois ; s’il s’en rencontre une dont la beauté les frappe, ils la désirent. Ils citent l’exemple de Jacob, surnommé Israël, et l’histoire des autres patriarches, et disent qu’ils ne font pas de mal en les imitant. Qu’ils sont insensés et dignes de pitié ! car, ainsi que je l’ai dit, toutes les actions de cette nature renfermaient et figuraient un grand mystère. Mais quel était le dessein de Dieu en permettant le double mariage de Jacob ? que figurait-il ? Il faut encore que je vous le dise pour tâcher de vous convaincre que vos maîtres n’ont jamais su remonter à la cause toute divine de chacun de ces faits ; mais qu’ils ont mieux aimé les rapporter à des affections basses et corrompues. Écoutez attentivement ce que je vais vous dire : Vous retrouvez encore dans les doubles noces de Jacob une figure de ce que devait faire le Christ. Jacob ne pouvait avoir les deux sœurs à la fois pour épouses. Il servit Laban pour obtenir la plus jeune ; mais, trompé à son égard, il servit encore sept années. Lia figurait votre peuple et la synagogue, Rachel, notre Église. Jusqu’à ce jour, le Christ sert, ou plutôt travaille pour l’Église et sa synagogue, et pour les esclaves qui se trouvent dans l’une et l’autre. Noé eut trois fils : il fit, des enfants du troisième, les esclaves des deux autres. Mais le Christ vint dans ce monde aussi bien pour le salut des descendants de ceux qui étaient les enfants libres que pour le salut des esclaves qui vivaient parmi eux ; car il élève au même rang tous ceux qui observent fidèlement ses préceptes. C’est ainsi que Jacob mit sur la même ligne et traita de la même manière tous les enfants qu’il eut de ses deux femmes libres et de ses servantes. Ce qui devait arriver à chacun de nous, au temps marqué d’après les décrets de la sagesse divine, fut également figuré par Jacob. Il servit aussi Laban pour en avoir des brebis de diverses espèces et de différentes couleurs. Ainsi le Christ a servi et fut obéissant jusqu’à la mort de la croix pour les hommes de toutes les nations, aussi différents par leurs traits que par leurs habitudes. Et comment les a-t-il acquis ? Par son sang et par le mystère de sa croix. Les yeux de Lia étaient malades ; les yeux de votre esprit l’étaient bien davantage ; Rachel déroba les dieux de Laban et les tint cachés jusqu’à ce jour : ainsi les dieux de nos pères, ces dieux de pierre que nous adorions sont enfouis et anéantis. Jacob fut toujours en butte à la haine de son frère, et ne sommes-nous pas aussi, nous et le Christ, sans cesse en butte à la haine de nos frères, c’est-à-dire à la vôtre et à celle de tous les hommes ? Car nous sommes tous frères par nature ; et pour achever le parallèle, nous remarquerons que Jacob fut surnommé Israël, et que le Christ appelé et qui est en effet Jésus, fut aussi surnommé Israël, ainsi que nous l’avons prouvé.</p><p>CXXXV. Et lorsque l’Écriture dit : « Je suis le Seigneur, le Dieu saint d’Israël, je vous ai donné Israël pour roi, » ne comprenez-vous pas que c’est le Christ qui est véritablement le Roi et le Roi éternel ? Avez-vous jamais entendu dire que Jacob, fils d’Isaac, ait été roi ? Aussi l’Écriture, pour nous montrer quel est le roi désigné par les noms de Jacob et d’Israël, ajoute : « Jacob est mon serviteur, je prendrai sa défense ; Israël est celui que j’ai choisi, il sera l’objet de mes complaisances ; j’ai répandu mon esprit sur lui, il portera la justice parmi les nations, il ne criera point, on n’entendra point sa voix au dehors, il n’écrasera point le roseau brisé, il n’éteindra pas le lin qui fume encore, jusqu’à ce qu’il remporte la victoire ; il jugera dans la vérité, il ne brisera personne jusqu’à ce qu’il ait fait régner la justice sur la terre ; toutes les nations espèreront en lui. » Mais les gentils, mais vous-mêmes, est-ce dans Jacob et non dans le Christ que vous espérez ? Si Jésus-Christ est le véritable Israël, le véritable Jacob, nous qui sommes sortis de son sein, ne sommes-nous pas la véritable race d’Israël ? Mais faisons plutôt attention au passage même de l’Écriture : « Je ferai sortir de Jacob et de Juda une postérité qui héritera de ma montagne sainte, mes élus la posséderont et mes serviteurs y établiront leurs demeures. La vallée d’Achor sera le partage des brebis et des génisses de ceux qui m’auront cherché, et vous qui avez oublié le Seigneur et sa montagne sainte, qui élevez une table aux démons et y offrez des libations, vous serez comptés et livrés au glaive, parce que je vous ai appelés et que vous ne m’avez pas répondu ; j’ai parlé, mais en vain ; vous avez fait le mal devant moi, et vous avez choisi ce que je n’ai pas voulu. » Le sens de ce passage est clair : vous voyez que l’Écriture parle d’un autre Jacob, et qu’il ne s’agit plus ici de votre peuple, comme on pourrait peut-être le croire ; car il faudrait dire que ceux qui sont sortis de Jacob cèdent la place à ceux qui sont sortis de Jacob, ce qui n’a pas de sens ; ou bien supposer que Dieu, qui reproche à votre peuple de s’être rendu indigne de son héritage, lui promet en même temps cet héritage comme s’il l’en trouvait digne ; ce qui est absurde. Mais quand le prophète dit si clairement : « Accourez, maison de Jacob ; marchons à la lumière du Seigneur ; il a rejeté son peuple, la maison de Jacob, parce que cette terre est remplie, comme autrefois, de divinations et de sortilèges. » Comment ne pas comprendre qu’il y a deux races, deux postérités de Juda, comme il y a deux maisons de Jacob ; l’une née du sang et de la chair, l’autre née de la foi et de l’esprit ?</p><p>CXXXVI. Voyez comment Dieu parle à son peuple ; après avoir dit d’abord : « Quand on trouve un grain de raisin dans une grappe, on dit : ne le perdons pas, il est béni. C’est ainsi que j’agirai à cause de celui qui me sert ; en faveur de lui, je ne les perdrai pas tous. » Il ajoute : « Et je ferai sortir de Jacob et de Juda cette race nouvelle. » Nulle obscurité dans ces paroles. Si Dieu s’irrite contre les uns, s’il les menace de n’en laisser subsister qu’un très-petit nombre, il annonce qu’il en fera venir d’autres pour habiter la montagne sainte. Et ces autres-là, quels sont-ils ? sinon les enfants qu’il a promis d’engendrer dans la suite, et qui doivent naître de lui. Car vous, vous ne souffrez pas qu’il vous appelle ; vous ne l’entendez pas quand il vous parle, et vous faites le mal en sa présence : mais le comble de la perversité chez vous, c’est que vous haïssez encore le juste après l’avoir mis à mort, et, avec le juste, tous ceux qui ont reçu de lui la grâce d’être ce qu’ils sont en effet, c’est-à-dire justes, pieux, humains. C’est pourquoi le Seigneur vous crie : « Malheur à l’âme de ceux qui ont pris de mauvais conseils contre eux-mêmes, et qui ont dit : meure le juste, car il nous est inutile. Vous n’avez point, il est vrai, sacrifié à Baal comme vos pères ; vous n’avez point offert, dans des bois sacrés, sur les lieux élevés, des mets délicats à la milice céleste, mais vous n’avez pas voulu recevoir le Christ de Dieu. Qui ne le connaît pas, ignore la pensée de Dieu ; qui l’outrage, qui le hait, hait et outrage celui qui l’a envoyé ; et si on ne croit pas en lui, il faut aussi refuser de croire aux oracles des prophètes qui l’annoncent et qui le prêchent partout. »</p><p>CXXXVII. Oh ! mes frères, n’injuriez pas celui qui a été crucifié, ne vous moquez pas de ses plaies, qui peuvent vous guérir tous tant que vous êtes, comme elles nous ont guéri nous-mêmes ! Qu’il serait beau de vous rendre à l’évidence des Écritures et de recevoir désormais la circoncision du cœur, et bon plus celle que vous retenez par un reste d’habitude et de préjugé ! Elle vous fut donnée comme signe et non comme moyen de salut ; vous êtes forcés de le reconnaître d’après les Écritures. Rendez-vous donc à leur évidence, et n’insultez pas au fils de Dieu ; ne poussez pas la complaisance pour les pharisiens, qui sont vos docteurs, jusqu’à vous permettre contre le roi d’Israël les indécentes railleries dont ils vous donnent la leçon et l’exemple dans vos synagogues, après les prières d’usage. Car, si toucher à celui qui offense Dieu, c’est toucher en quelque sorte à la prunelle même de Dieu, que sera-ce donc de toucher à son bien-aimé ? Que Jésus soit ce bien-aimé, nous l’avons assez prouvé. Comme tous gardaient le silence, je repris la parole : Mes amis, leur dis-je, je rétablis un certain passage de l’Écriture, dans le sens que lui donnent les Septante. Quand je l’ai cité selon le vôtre, j’ai voulu vous mettre à l’épreuve. En rappelant le passage où il est dit : « Malheur à eux, car ils prennent des conseils contre eux-mêmes, » j’ai ajouté, d’après la version des Septante : « Meure le juste, il nous est inutile ! » Au commencement de cet entretien, j’avais donné votre sens : « Meure le juste, sa vue nous importune ! » Votre esprit était sans doute occupé d’autre chose, et voilà pourquoi vous n’avez pas fait attention à mes dernières paroles. Mais comme le jour baisse, car le soleil est déjà sur son déclin, je n’ajouterai plus qu’un mot à ce que j’ai dit, et je mettrai fin à cet entretien ; je l’ai déjà dit, ce mot, mais je crois bon d’y revenir.</p><p>CXXXVIII. Vous savez, mes amis, que Dieu parle en ces termes à Jérusalem, par la bouche d’Isaïe : « C’est moi qui t’ai sauvé du déluge de Noé. » Que signifient ces paroles, sinon que dans le déluge se trouvait une figure du salut des hommes. Le juste Noé et sa famille, c’est-à-dire sa femme, ses trois enfants et leurs épouses, formaient une réunion de huit personnes, qui étaient le symbole de ce huitième jour où s’accomplit la résurrection du Christ ; c’était le huitième par le nombre, mais le premier par la grandeur du prodige qui le signala. Le Christ, premier-né de la création, était aussi le premier auteur ou le principe de cette race nouvelle qu’il a régénérée par l’eau du baptême, par le mérite de la foi, et par la vertu du bois, c’est-à-dire par le mystère de la croix ; comme Noé, porté sur l’eau, fut sauvé par le bois avec les siens.</p><p>Ces paroles du prophète : Je t’ai sauvé au temps de Noé, désigne le peuple fidèle à Dieu comme le fut Noé, et sauvé par le même signe ; car c’est avec le bois, c’est-à-dire avec la baguette qu’il tenait à la main, que Moïse fit passer la mer à votre peuple. Vous croyez que ces paroles s’entendent seulement de la terre ou de votre nation Mais puisque la terre, gomme le dit l’Écriture, fut inondée et que l’eau s’éleva de quinze coudées au-dessus des plus hautes montagnes, il est évident que Dieu ne s’adressait pas à la terre, mais au peuple qui lui fut fidèle, et auquel il avait préparé un lieu de repos dans Jérusalem, comme l’attestent les signes qui parlaient aux yeux à l’époque du déluge ; je veux dire que ceux dont le cœur est bien préparé par l’eau, la foi, le bois, et qui font pénitence, échapperont au jugement à venir.</p><p>CXXXIX. Mais l’Esprit saint nous annonçait encore au temps de Noé un autre mystère que vous ignorez ; le voici : « Noé bénit ses enfants et maudit son petit-fils. » Car ce n’était pas sur le fils, qui fut béni avec ses frères, que la malédiction de l’Esprit saint pouvait tomber ; mais comme la peine de ce péché devait s’étendre à toute la race de celui qui s’était moqué de la nudité de son père, elle commença dans la personne même de son fils. Noé prédit qu’aux descendants de Sem passeraient les terres et les maisons de Chanaan ; que les enfants de Japhet les enlèveraient aux descendants de Sem ; que ceux-ci en seraient dépouillés comme ils en avaient eux-mêmes dépouillé les enfants de Chanaan. Et voyez comme tout s’est parfaitement réalisé : vous qui descendez de Sem, selon l’ordre de Dieu, vous vous êtes emparé de la terre de Chanaan et vous l’avez possédée ; et il est également certain que les enfants de Japhet, ministres des jugements de Dieu à votre égard, sont venus fondre sur vous et ont possédé la terre qu’ils vous avaient enlevée. Voici comme tous ces événements ont été annoncés : « Noé, se réveillant de son ivresse, lorsqu’il apprit ce que le plus jeune de ses fils avait fait, dit que le fils de Chanaan serait maudit ! Il sera l’esclave de ses frères, » et il dit : « Béni soit le Seigneur, le Dieu de Sem ! et que Chanaan soit son esclave ! Que Dieu étende les possessions de Japhet et qu’il habite dans la tente de Sem, et que Chanaan soit son esclave ! » Ainsi donc, deux peuples reçurent la bénédiction, celui de Sem et celui de Japhet ; les descendants de Sem s’emparèrent les premiers des possessions de Chanaan, en vertu de l’arrêt porté contre lui ; celles des enfants de Japhet passèrent également entre les mains des descendants de Sem, suivant la prédiction de Noé, et un seul peuple, celui de Chanaan, se trouva successivement l’esclave des deux autres.</p><p>Alors arriva le Christ, revêtu de la force du Tout-Puissant ; il les invita tous également à faire pénitence, à entrer dans son amitié, dans sa bénédiction, dans son alliance, et promit que tous les saints seraient mis un jour en possession d’une même terre, ainsi que je l’ai déjà dit.</p><p>Aussi les hommes de toutes conditions, libres ou esclaves, qui croient au Christ, et professent la vérité qu’ils ont reçue de lui et des prophètes, savent bien qu’ils habiteront ensemble avec lui dans cette terre heureuse, et qu’ils recevront en héritage des biens éternels et incorruptibles.</p><p>CXL. Et c’est encore pour cette raison que Jacob, qui était, ainsi que je vous l’ai dit, la figure du Christ, épousa les servantes de ces deux femmes libres, et eut d’elles des enfants. Par là, l’esprit prophétique nous annonçait que le Christ recevrait également les descendants de Japhet et ceux de Chanaan, et qu’ils seraient tous des enfants appelés au même héritage. Nous sommes ces enfants, héritiers des mêmes biens : voilà ce que vous ne pouvez comprendre parce que vous ne buvez pas à la source vive qui est en Dieu, et que vous préférez puiser à des citernes entr’ouvertes qui ne peuvent contenir leurs eaux, pour me servir des expressions même de l’Écriture. Or, ces citernes, qui les a creusées, sinon vos docteurs qui enseignent leur propre doctrine, doctrine toute humaine, comme le déclarent formellement les livres saints ? Ils vous trompent, ils se trompent eux-mêmes, quand ils s’imaginent que tous ceux qui sont nés d’Abraham, selon la chair, eussent-ils été pécheurs, incrédules, rebelles à Dieu, auront part au royaume éternel, bien que l’Écriture assure le contraire ; et s’il en était autrement, est-ce qu’Isaïe aurait dit : « Si le Dieu des armées ne nous eût donné son fils, nous serions devenus comme Sodôme et Gomorrhe. » Est-ce qu’Ézéchiel se serait écrié : « Quand Noé, Jacob, Daniel, interviendraient pour leurs fils, pour leur filles, il ne leur sera point fait grâce. » Ainsi le père ne mourra point à cause de son fils, ni le fils à cause de son père, mais chacun portera la peine de son péché, comme aussi chacun sera sauvé d’après le bien qu’il aura fait. Écoutez encore ce que dit ailleurs Isaïe : « Ils verront les cadavres des prévaricateurs de la loi ; le ver qui les ronge ne mourra pas, le feu qui les dévore ne doit pas s’éteindre, et toute chair les verra dans cet état. » Je le répète, s’il en était autrement, notre maître ne nous aurait pas dit au nom de Dieu le père, du souverain arbitre de toutes choses qui l’a envoyé :</p><p>« Ils viendront d’Orient et d’Occident, ils seront assis auprès d’Abraham, d’Isaac et de Jacob, dans le royaume des cieux, tandis que les enfants du royaume seront jetés dans les ténèbres extérieures. » Mais ceux d’entre les anges et les hommes que l’Esprit saint nous montre d’avance comme des prévaricateurs ne deviennent pas méchants par la faute de Dieu ; leur coupable disposition seule les rend ce qu’ils paraîtront un jour, ainsi que je l’ai déjà dit plus haut.</p><p>CXLI. Je n’ai pas voulu que vous pussiez dire qu’il fallait de toute nécessité que le Christ fût mis en croix, et que des hommes d’entre vous devinssent prévaricateurs ; aussi me suis-je attaché précédemment à vous montrer en peu de mots que Dieu, qui voulait que l’ange et l’homme obéissent à sa volonté, les créa libres, afin qu’ils se portassent de leur plein gré à la pratique de la justice, et leur donna en même temps la raison, pour connaître celui dont ils ont reçu l’être et la vie, à la condition d’être un jour jugés par lui, s’ils agissaient contrairement à cette raison. C’est pourquoi, qui que nous soyons, anges ou hommes, il suffira de notre témoignage pour nous condamner si nous avons péché sans avoir fait pénitence. Quand l’Esprit saint nous annonce que des anges ou des hommes seront punis, c’est qu’il prévoit que, devenus coupables, ils n’auront pas voulu changer ; mais il ne veut pas dire que Dieu les ait rendus tels qu’ils auront été : qu’ils fassent donc pénitence, et ils pourront tous, s’ils le veulent, obtenir miséricorde. L’Écriture elle-même les déclare heureux : « Heureux en effet, nous dit-elle, l’homme à qui Dieu n’aura pas imputé son péché ! » Ce qui veut dire simplement qu’en faisant pénitence de ses péchés il en obtiendra le pardon, et non pas que Dieu vous pardonnera les vôtres, pourvu que vous ayez connu son saint nom ; car voilà ce que vous dites, et c’est ainsi que vous vous abusez, vous et ceux qui vous ressemblent sur ce point. Nous pouvons appeler, en témoignage du sens que nous donnons à ces paroles, la faute même que commit David par un mouvement de vanité : son péché lui fut remis, il est vrai ; mais c’est parce qu’il l’a pleuré, qu’il en a gémi, comme l’atteste l’Écriture.</p><p>Or, s’il a fallu que David fît pénitence pour obtenir grâce et miséricorde ; s’il a pleuré, s’il s’est ainsi humilié, ce roi puissant, l’oint, le prophète du Seigneur, comment des hommes aussi impurs, d’une vie aussi déplorable, peuvent-ils se flatter d’obtenir le pardon de leurs péchés sans les pleurer, sans en gémir ? La conduite de David à l’égard de la femme d’Urie, et la pénitence qu’il fit de son péché, prouvent bien, ô mes amis ! que les patriarches, en épousant plusieurs femmes, ne suivaient pas l’attrait des sens, mais figuraient, par leur conduite pleine de mystères, quelques événements futurs. Car s’il eût été permis à quelqu’un d’avoir à son gré, et de la manière qu’il aurait voulu, autant de femmes qui lui aurait plu d’en avoir, ainsi que le font encore plusieurs d’entre vous, qui prennent partout des femmes sous le nom d’épouses, dans quelque pays qu’ils arrivent ou qu’ils soient envoyés, personne n’était plus en droit que David de se le permettre.</p><p>C’est ainsi, mon cher Marcus Pompée, que je terminai la discussion.</p><p>Tryphon, après un moment de silence, me dit : — Vous voyez qu’il ne nous a pas fallu faire un grand effort pour entrer en conversation avec nous.</p><p>Je ne puis vous dire combien cet entretien m’a été agréable, et je suis persuadé que tous ceux qui m’entourent ont partagé ce plaisir.</p><p>Assurément il nous a été plus utile que nous ne l’espérions, et que nous n’aurions osé l’espérer ; s’il nous était possible d’en jouir plus souvent, nous retirerions bien plus de fruits encore de cette manière d’approfondir les divines Écritures. Mais vous êtes sur le point de partir ; vous n’attendez plus que le moment de mettre à la voile : quand vous nous aurez quittés, ne perdez pas notre souvenir ; pensez à nous comme à des amis.</p><p>— Si je n’étais pas obligé de vous quitter, répondis-je, voilà les entretiens que je voudrais voir s’établir tous les jours entre nous ; mais au moment de m’embarquer, avec la permission et le secours de Dieu, je vous recommande de ne rien négliger dans l’intérêt de votre salut, pour vous affranchir de vos docteurs, et de savoir leur préférer le Christ du Dieu tout-puissant. Après ces mots, ils me quittèrent en me souhaitant un heureux voyage, une navigation exempte de tous dangers.</p><p>Je formai pour eux, à mon tour, les vœux les plus ardents : puisque vous comprenez si bien, leur dis-je, que la raison a été donnée à l’homme pour lui servir de guide, tout ce que je puis vous souhaiter de plus heureux, c’est que vous sachiez faire un bon usage de cette raison pour arriver à reconnaître, comme nous, que Jésus est le Christ de Dieu.</p>
