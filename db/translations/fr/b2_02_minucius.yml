    body: |-
      <p>Quand je me livre à mes réflexions, et que je me rappelle le souvenir d’Octave, de cet ami le plus vrai, le plus fidèle, je sens je ne sais quoi de si doux et de si tendre dans cette pensée, que je crois moins me rappeler le passé que recommencer ces heureux jours. Son image est d’autant plus gravée dans mon cœur et dans tous mes sens, qu’elle est maintenant plus éloignée de mes yeux. Et ce n’est pas sans raison qu’un homme si distingué, si religieux, a laissé au fond de mon âme, en me quittant, ce regret immense. Il m’aima toujours d’un amour si vif et si tendre, que dans nos jeux comme dans les affaires sérieuses, sa volonté ne contrariait jamais la mienne, et que nos sentiments se trouvaient toujours dans une parfaite harmonie. Vous auriez cru qu’un même esprit animait deux corps : il était le seul confident de mes faiblesses, le seul témoin de mes erreurs ; et lorsqu’affranchi de mes ténèbres, je passai de la nuit du mensonge au jour de la sagesse et de la vérité, il ne refusa point de me suivre ; que dis-je ? il fit bien mieux, il me devança.</p><p>En me reportant vers cette époque d’une vie passée au sein de la plus étroite amitié, ma pensée s’est surtout arrêtée à ce discours qu’il tint à Cécilius, alors engagé dans de vaines superstitions, et dont la force dans cette grave discussion le convertit au Christianisme.</p><p>Octave était venu à Rome pour traiter de ses affaires et pour me voir ; il avait laissé maison, femme, enfants. Ces derniers étaient dans cet âge d’innocence qui leur donne tant de grâce lorsqu’ils essayent de former des sons qu’ils ne rendent qu’à demi, parole si douce d’une langue novice qui bégaye et s’interrompt. Je ne pourrais dire quels furent les transports de ma joie lorsque je le vis arrivé ; elle était d’autant plus vive que j’étais loin de m’attendre au bonheur de voir cet ami si parfait.</p><p>Après deux jours donnés à l’assiduité des entretiens pour satisfaire les premiers besoins du cœur, et nous dire mutuellement mille choses qu’une absence réciproque nous laissait ignorer, nous convînmes d’aller à Ostie, séjour enchanteur, où j’espérais trouver à la faveur des bains de mer un moyen aussi sûr qu’agréable pour dissiper un certain fond d’humeur dont j’étais tourmenté. Les vacances avaient fait succéder au travail du barreau le plaisir des vendanges ; c’était le moment où l’automne, après les chaleurs brûlantes de l’été, nous offre sa douce température. Nous nous dirigions un matin, dès le point du jour, vers la mer, en suivant le rivage pour respirer cet air frais et pur qui rend au corps sa vigueur, et goûter le plaisir si doux qu’on trouve à fouler le sable qui cède mollement sous les pas. Cécilius était avec nous ; il apperçoit chemin faisant une statue de Sérapis, et aussitôt, selon l’usage du vulgaire superstitieux, il porte sa main à la bouche et la baise.</p><p>En vérité, mon cher Marcus, me dit Octave, ce n’est pas le fait d’un homme vertueux de laisser dans les ténèbres d’un vulgaire ignorant un ami qui ne vous quitte pas, et de souffrir qu’à la lumière de ce beau jour de la vérité il vienne se heurter contre des pierres, oui des pierres façonnées en statues, couvertes d’essences et couronnées de fleurs ; vous le savez bien, c’est sur vous autant que sur lui-même que rejaillit la honte d’un pareil aveuglement.</p><p>Tout en discourant de la sorte, nous traversions la ville, et déjà nous étions en liberté sur le bord de la mer. De petites vagues qui venaient mourir doucement sur le sable semblaient l’applanir pour la promenade. La mer ne cesse pas d’être un peu agitée lors même que les vents se taisent ; elle ne poussait point alors vers ses bords des ondes blanches et écumeuses ; c’était plutôt des vagues doucement émues. Nous goûtions un plaisir extrême à voir leurs détours venir nous mouiller lorsque nous étions au bord de l’eau, que le flot tantôt se jouait à nos pieds, et que tantôt replié et revenant sur lui-même il allait se perdre au sein de la mer.</p><p>Nous avancions à pas tranquilles, trompant la longueur de la route par le charme des récits. Ces récits étaient des histoires d’Octave qui nous parlait de la navigation. Lorsque nous eûmes fait un assez long chemin, nous suivîmes les mêmes sinuosités de la rive en retournant sur nos pas. Arrivés à l’endroit où de petits navires, retirés à l’écart et élevés au-dessus de la vase, reposaient sur des poutres, nous vîmes de jeunes enfants, qui, pleins d’ardeur, faisaient à l’envi l’un de l’autre rouler des pierres sur la surface de la mer. Ce jeu consiste à choisir sur le rivage une de ces petites pierres applaties que polit le mouvement des flots ; on la dispose entre ses doigts du côté plat ; ensuite penché aussi bas qu’on le peut et presqu’à terre on la lance sur l’eau. Cette espèce de trait rase et effleure le dos de la mer, selon l’impulsion légère qui le fait glisser. Ou bien il fend les flots, vole à leur surface, plonge et ressort tant qu’un bond longtemps prolongé le soutient. L’enfant dont la pierre se porte plus loin et rebondit le plus de fois se proclame vainqueur.</p><p>Octave et moi nous nous amusions de ce spectacle. Cécilius n’y prêtait aucune attention et ne souriait point à cette lutte ; mais rêveur, chagrin, se tenant à l’écart, il faisait lire sur son visage je ne sais quelle douleur secrète. Qu’avez-vous ? lui dis-je ; je ne vous reconnais plus. Où est donc cette vivacité, cette gaîté qui brillait dans vos yeux, même au milieu des affaires les plus sérieuses ? Le reproche que vous a fait Octave, reprit-il, est un aiguillon qui me pique et m’importune ; accuser mon ami de négligence à mon égard, c’est faire plus adroitement retomber sur moi, quoique d’une manière indirecte, le blâme d’ignorance.</p><p>Je n’en resterai pas là, je demande raison à Octave de toute cette affaire. S’il veut qu’un homme de la secte qu’il attaque soutienne la lutte avec lui, il verra qu’il est plus facile de disputer entre amis que de combattre en vrais philosophes. Allons nous asseoir sur le môle qui protège les bains contre les flots, sur ces rochers qui s’avancent dans la mer ; nous pourrons nous délasser de la fatigue et discuter plus à notre aise. On s’assied ainsi qu’il l’avait proposé, mais de manière que j’occupais le milieu, car ils s’étaient placés à mes côtés, non par respect, par déférence ou cérémonie (car toujours l’amitié nous trouve ou nous rend égaux) mais me prenant pour arbitre, ils avaient voulu que je fusse plus près d’eux pour mieux les entendre et séparer les deux antagonistes.</p><p>Alors Cécilius commença en ces termes :</p><p>Mon cher Minucius, bien qu’il ne vous reste plus aucun doute sur l’affaire qui nous divise, puisqu’après avoir examiné avec soin les deux systèmes, vous avez condamné l’un pour suivre l’autre, il vous faut cependant apporter ici un esprit impartial, tenir la balance d’un juge plein d’équité, et ne pas suivre la pente qui vous entraînerait plus d’un côté que d’un autre, de peur que votre jugement ne parût moins le résultat de nos raisons que l’expression de vos propres sentiments. Si vous voulez siéger ici comme un homme entièrement neuf, qui ne sait rien des deux partis, il me sera facile de vous prouver qu’ici-bas tout est incertain, douteux, problématique, vraisemblable plutôt que vrai.</p><p>C’est pourquoi il est moins étonnant de trouver des hommes qui, découragés dans la recherche de la vérité, cèdent sans examen à la première opinion qui se présente. Il serait plus extraordinaire d’en rencontrer qui persévèrent dans leurs recherches avec un zèle opiniâtre. Mais ne doit-on pas gémir et s’indigner de voir des gens sans études, sans lettres, dans l’ignorance des arts, si ce n’est des plus abjects, prononcer sur le principe des choses, sur la nature humaine, pendant que la philosophie qui possède un si grand nombre d’écoles, est encore à délibérer depuis tant de siècles sur ces graves questions. Et ce n’est pas sans raison : il y a si loin de la faiblesse de l’homme à la connaissance de Dieu ! Aussi ce qui demeure suspendu au-dessus de nos têtes dans les cieux, ce qui est enseveli sous nos pieds dans les abîmes de la terre, est un secret impénétrable pour nous. Il ne nous est pas donné de le savoir, et il serait même impie de vouloir le sonder. Nous serions assez heureux, assez sages, si nous savions, selon les maximes d’un ancien philosophe, nous connaître davantage nous-mêmes ; mais si, nous livrant à un vain travail, à des recherches insensées, nous voulons franchir les limites imposées à notre faiblesse ; si, jetés sur la terre, nous allons, dans les transports d’une ambitieuse audace, nous élancer par de-là les cieux, du moins ne nous forgeons pas de vains fantômes, ne mêlons pas à ce premier égarement des terreurs imaginaires. Qu’il y ait eu, dans le principe, des éléments générateurs rassemblés au sein de la nature, faut-il pour cela un Dieu créateur ? Que les diverses parties de cet univers aient été formées, arrangées, réunies par un concours fortuit, est-il besoin d’un Dieu qui en soit l’architecte ? Que le feu ait allumé les astres, que le ciel se soit déployé de lui-même, que la terre se soit affermie par son poids, que les eaux, par leur pente naturelle, aient pris leur cours vers la mer, quel rapport dans tout cela avec votre religion nouvelle, cet épouvantail qui n’est après tout qu’une superstition ?</p><p>L’homme, la brute, tout ce qui naît, vit et respire, est un assemblage spontané des éléments, et se résout, se décompose en ces mêmes éléments, puis s’évanouit. Ainsi, tout reflue à sa source, tout revient à son principe, sans ouvrier, sans juge, sans créateur. Ainsi, des semences ignées qui se réunissent naissent sans cesse de nouveaux soleils. Ainsi, les vapeurs exhalées de la terre forment les brouillards ; ou bien elles s’assemblent et s’épaississent, et de là les nuages qui s’élèvent ; ou elles descendent, et alors la pluie tombe, le vent siffle, la grêle se précipite. Le choc des nues fait gronder le tonnerre, briller l’éclair, jaillir la fondre. Ces feux si redoutés tombent au hasard et sans choix sur les montagnes, sur les arbres, sur les lieux sacrés et profanes ; ils frappent l’homme pieux comme le scélérat. Que dirai-je de ces tempêtes inconstantes, soudaines, qui dans leur cours impétueux ne respectent aucun ordre de choses, et détruisent tout sans distinction ? De ces naufrages qui confondent la destinée des bons et des méchants sans considération des mérites ? De ces incendies qui n’épargnent pas plus la vie du juste que celle du pervers ? De ces pestes qui corrompent l’air du ciel, et promènent la mort sur toutes les têtes ? Des fureurs de la guerre, où les plus braves succombent les premiers ? Dans la paix, le vice marche de pair avec la vertu ; que dis-je, c’est lui qui est en honneur, de sorte qu’à l’égard de plusieurs, vous ne savez pas s’il vaut mieux détester leurs crimes qu’envier leur prospérité.</p><p>Si une Providence gouvernait le monde, ou si quelque divinité commandait avec empire, verrait-on jamais un Denys Phalaris sur le trône, un Rutilius, un Camille dans l’exil, un Socrate condamné à boire la ciguë ? Voilà les arbres chargés de fruits mûrs ; voilà la moisson qui jaunit ; déjà le raisin se colore sur la vigne ; et tout à coup surviennent des pluies, des grêles qui gâtent et détruisent tout. Ou la vérité se dérobe sous des nuages épais qui ne laissent percer que des lueurs incertaines, ou plutôt tout est le jouet d’un aveugle destin. Le hasard commande partout sans autres lois que ses caprices. Puisqu’on ne trouve qu’incertitude dans la nature, ou rien de certain que l’empire de la fortune, tout ce que nous pouvons faire de mieux et de plus honorable, c’est de nous en tenir aux leçons de nos pères comme aux plus sûrs garants de la vérité, c’est de suivre la religion établie, c’est d’adorer les dieux que nous avons appris à craindre avant même de les connaître ; c’est de ne pas nous ériger en juges de ces dieux, mais de nous en rapporter à nos ancêtres, qui, dans un siècle encore simple et voisin de l’enfance du monde, méritèrent d’avoir ces mêmes dieux pour rois et pour amis. Aussi l’histoire nous fait-elle voir chez tous les peuples, dans chaque province comme dans chaque empire, un culte national, des dieux indigènes : Éleusis adore Cérès ; la Phrygie, Cybèle ; Épidaure, Esculape ; la Chaldée, Bélus ; la Syrie, Astarté ; la Tauride, Diane ; les Gaules, Mercure ; Rome, tous les dieux. Grâce à la piété des Romains, leur empire et leur puissance embrassent tout l’univers, et s’étendent par delà les limites de l’océan et des contrées où le soleil finit son cours ; récompense des vertus religieuses pratiquées jusque dans le tumulte des camps. Le rempart le plus sûr des villes était le respect pour les dieux, la chasteté des vierges, les nombreuses distinctions accordées aux prêtres. On a vu le Romain assiégé, sans autre asile que le Capitole, continuant d’adorer ces dieux qui semblaient déclarés contre lui et que d’autres auraient blasphémés, passer, sans autre arme que le bouclier de la religion, à travers les Gaulois étonnés de sa superstitieuse audace ; et dans l’ivresse de la victoire, après avoir forcé les remparts ennemis, tomber aux pieds des divinités vaincues, chercher partout des dieux hospitaliers pour en faire les siens, ériger des autels aux dieux mânes et même aux dieux inconnus. C’est en adoptant les cultes de toutes les nations que Rome a mérité d’être la reine du monde.</p><p>De là cet esprit religieux qui s’est maintenu constamment, et qui, loin de s’altérer, s’est accru avec la succession des âges. Car le respect qui s’attache aux institutions religieuses est toujours en proportion de leur antiquité.</p><p>VII. Toutefois, je ne craindrai pas de l’avouer, si je me trompe, je préfère mon erreur à la vôtre. Ce n’est pas sans raison que nos ancêtres s’occupèrent avec tant de soin à consulter les augures, à lire dans les entrailles des victimes, à consacrer des temples et instituer des sacrifices. Interrogez nos annales, et vous verrez qu’ils se sont fait initier aux mystères de toutes les religions, soit pour rendre grâce aux dieux de leurs bienfaits, soit pour détourner leur courroux prêt à sévir, soit pour le désarmer, quand il faisait sentir ses rigueurs. J’en atteste la mère des dieux, dont l’arrivée en Italie rétablit l’honneur d’une dame romaine et délivra la ville des terreurs de la guerre. J’en atteste les statues consacrées à ces deux frères qu’on représenta tels qu’ils parurent sur les bords d’un lac, quand ils vinrent, montés sur des chevaux hors d’haleine, couverts d’écume, vomissant la flamme, annoncer la défaite de Persée, le jour même qu’ils l’avaient vaincu. J’en atteste ces jeux que le courroux de Jupiter, révélé en songe à un homme du peuple, a remis en honneur ; j’en atteste ce dévouement de Décius, dont l’effet fut certain ; j’en atteste ce Curtius qui combla de son corps et de sa gloire la profondeur du gouffre entr’ouvert où il s’était élancé avec son cheval : nos augures négligés n’ont que trop souvent attesté la présence des dieux. De là vient que l’Allia est un nom si funeste ; que l’entreprise de Claudius et de Junius contre les Carthaginois, fut moins un combat qu’un triste naufrage ; que Flaminius, pour s’être moqué des augures, vit le lac de Trasimène s’enfler et rougir du sang romain ; que Crassus, pour avoir insulté aux furies et mérité leur courroux, nous força de redemander nos aigles aux Barbares. Je passe sous silence une multitude de faits anciens ; je ne parle pas de nos chants poétiques sur la naissance des dieux, sur leurs présents et leurs bienfaits. J’omets nos grandes destinées annoncées par les oracles, de peur que l’antiquité ne vous paraisse trop fabuleuse. Parcourez ces temples fameux qui sont tout à la fois la gloire et le boulevard de Rome. Ce qui les rend augustes, c’est la présence des dieux domestiques ou étrangers qui les habitent, bien plus que la magnificence et les offrandes qui les décorent. C’est là que nos prophètes, pleins des choses du ciel, et mêlés à la Divinité, prédisent l’avenir, éclairent sur les dangers, présentent la guérison aux malades, des espérances aux affligés, des secours aux malheureux, des consolations dans l’infortune, des soulagements dans les travaux. Même pendant le repos de la nuit nous les voyons, nous les entendons, nous les reconnaissons ces dieux que notre bouche impie repousse, insulte pendant le jour.</p><p>VIII. Puisque tous les peuples s’accordent à reconnaître des dieux immortels, bien que l’origine et la nature de ces dieux soient incertaines, je ne puis supporter l’audace impie, la sagesse orgueilleuse de ces hommes qui s’efforcent de renverser ou d’affaiblir une religion ancienne, utile, salutaire. Qu’un Théodore de Cyrène, qu’un Diagoras, son devancier, dès longtemps flétri du surnom d’athée, aient essayé, en professant qu’il n’y a pas de dieux, de détruire dans les cœurs toute crainte de la divinité, tout respect pour elle, c’est-à-dire de saper les uniques fondements de la société ; jamais, quelque couleur qu’ils aient prêté à ce système impie, en le décorant du beau nom de philosophie, jamais ils ne feront autorité ; l’abdéritain Protagoras, pour avoir traité cette question d’un ton léger plutôt qu’impie, fut chassé de toute l’Attique, et les Athéniens brûlèrent publiquement ses ouvrages. Et l’on pourrait voir, sans gémir profondément (pardonnez à la chaleur d’un zèle qui s’exprime peut-être avec trop de liberté) des hommes d’une secte misérable, maudite, désespérée, s’élever audacieusement contre ces dieux, se recruter dans la lie du peuple, parmi des femmes crédules et faciles à tromper, pour former, avec ces nobles auxiliaires, une ligue impie qu’ils cimentent dans des assemblées nocturnes, non par des sacrifices, mais par des sacriléges, des jeûnes solennels, des repas de chair humaine ? Race ténébreuse, ennemie du grand jour, muette en public, d’une loquacité sans fin dans le secret. Ils méprisent nos temples qu’ils veulent faire passer pour les tombeaux de nos dieux, du sein de leur misère, ils nous prennent en pitié ; à peine couverts de haillons, ils foulent d’un pied superbe les honneurs de nos pontifes et leur pourpre suprême.</p><p>Audace inconcevable ! prodige de démence ! ils bravent les tortures placées sous leurs yeux et redoutent un avenir incertain. Ils craignent de mourir après la mort, et ils vont à la mort sans la craindre ; ainsi le trompeur espoir de revivre les séduit et les élève au-dessus de toutes les frayeurs.</p><p>IX. Comme le mal est plus fécond et se propage plus vite à l’aide des mauvaises mœurs qui s’étendent tous les jours de plus en plus, les mystères affreux de cette coalition impie se répandent partout. Il faut l’avoir en horreur, il faut l’extirper maintenant qu’elle se manifeste ; ses partisans se reconnaissent à des signes secrets, et s’aiment mutuellement presque avant de se connaître. C’est comme une religion de débauche qui les unit partout où ils se rencontrent. Ils s’appellent indistinctement frères, sœurs, afin qu’à la faveur de ces noms sacrés les impudicités ordinaires soient des incestes. C’est ainsi que leur fanatisme, vain et insensé, se fait gloire du crime. Si tout ce qu’on leur attribue était calomnie, la renommée dont le regard est si perçant ne leur imputerait pas tant de forfaits abominables pour lesquels la décence n’a pas d’expressions. J’entends dire qu’ils adorent, sur la foi de je ne sais quelle absurde persuasion, la tête consacrée de l’animal le plus ignoble, la tête d’un âne ; culte bien digne des mœurs qui l’ont fait naître. D’autres racontent qu’ils honorent le membre viril du président ou du prêtre, et qu’ils l’adorent comme celui de leur propre père.</p><p>J’ignore si tout cela est faux, mais le secret mystérieux de leurs sacrifices nocturnes ne justifie que trop ces soupçons. Dire qu’un homme puni du dernier supplice pour ses crimes, que le bois infâme d’une croix, est l’objet de leur culte, c’est dire qu’ils ont l’autel qui convient à des misérables, à des scélérats, et qu’ils adorent ce qu’ils méritent. Ce qui se passe à la réception d’un adepte, est connu de tout le monde et n’est pas moins monstrueux.</p><p>Pour mieux surprendre ceux qui sont sans défiance, on apporte dans l’ombre de la nuit un enfant couvert de farine. L’adepte qu’on doit initier, trompé par l’apparence et invité à frapper, croit porter des coups innocents et fait à son insu des blessures profondes qui tuent l’enfant. Ô crime ! tous à l’instant hument le sang avec avidité et partagent ces membres qu’ils se disputent à l’envi. Voilà par quelle victime ils cimentent leur union ; voilà par quelle communauté de crime ils s’engagent à un mutuel silence. De semblables sacrifices ne sont-ils pas mille fois plus affreux que tous les sacriléges ! Leurs repas sont connus ; tous les auteurs en parlent ; le plaidoyer de l’orateur de Cirta en fait foi. Dans un jour solennel, ils se réunissent pour manger ensemble. Tous se rendent au banquet, avec leurs enfants, leurs femmes, leurs sœurs, sans distinction d’âge ni de sexe. Après avoir fait succéder les mets, lorsque le festin s’est échauffé, que l’ivresse allume leur lubricité incestueuse, ils attachent un chien au candelabre qui les éclaire et le provoquent, en lui jetant quelques mets, à s’élancer au delà de l’espace mesuré par sa chaîne ; le flambeau, témoin importun, est renversé et s’éteint ; alors ils enveloppent d’impudiques ténèbres l’infamie de leurs unions contractées dans l’ombre et au hasard. C’est ainsi qu’ils deviennent tous incestueux dans la conscience, s’ils ne le sont point tous par le fait, puisque tous désirent ce qui peut résulter de l’acte auquel ils se livrent.</p><p>X. Je ne vais pas plus loin et à dessein, je n’ai déjà que trop parlé. L’obscurité même dont s’enveloppe cette religion impie ne laisse aucun doute sur tous ces faits, ou du moins sur la plupart. Et pourquoi tant chercher à cacher, à dérober à tous les regards les objets de leur culte ? Ce qui est honnête aime le grand jour, le crime seul cherche les ténèbres. Pourquoi n’ont-ils point de temples, ni d’autels, ni d’images connus ? Pourquoi ce silence en public et ces réunions clandestines ? Il faut que ce qu’ils adorent et cachent avec tant de soin soit criminel ou honteux. D’où vient, quel est, où est enfin ce Dieu unique, solitaire, délaissé, qu’aucun état libre, aucun peuple, pas même la superstition romaine, n’a connu ? Je ne vois que la misérable nation des Juifs qui fasse profession d’adorer un seul Dieu ; du moins c’est au grand jour, elle a des temples, des autels, un culte, des sacrifices. Et toutefois ce Dieu a si peu de pouvoir, qu’il est captif des Romains aussi bien que son peuple. Mais quelles chimères, quelles absurdités ces Chrétiens n’ont-ils pas imaginées ! Ils nous disent que leur Dieu, qu’ils ne peuvent ni voir ni montrer, fait l’examen le plus exact des mœurs, de la conduite, des paroles, des pensées les plus secrètes ; qu’il se promène en tous lieux, qu’il est présent partout ; ils le font importun, inquiet, curieux jusqu’à l’effronterie, puisqu’il vous poursuit dans chacune de vos actions, dans tous les endroits que vous habitez. Mais, occupé de tout l’univers, comment peut-il embrasser tous les détails, ou bien, partagé entre tous les détails, comment peut-il surveiller l’ensemble ? Dirai-je que ces Chrétiens menacent la terre, les astres, le monde entier, d’un vaste embrasement, et qu’ils en prédisent la ruine comme si l’ordre éternel établi par les lois de la nature pouvait être bouleversé, la chaîne sacrée qui lie tous les éléments se briser, cet édifice immortel de la terre et des cieux s’anéantir.</p><p>XI. À cette doctrine extravagante que n’ajoutent-ils pas ? ils forgent des contes absurdes, rêves de la vieillesse en délire ; ils disent qu’après leur mort ils renaîtront de leurs cendres, de leur poussière. Je ne puis vous exprimer avec quelle confiance ils ajoutent foi à leurs propres mensonges ; à les entendre vous les croiriez déjà ressuscités. Double mal, double folie ! ils annoncent une fin à ce ciel, à ces astres qui ne changent pas, que nous laissons dans l’état où nous les avons trouvés ; et ils promettent l’éternité à des êtres qui ne sont plus, à des morts, à nous enfin qui ne naissons que pour mourir. Voilà pourquoi ils abhorrent nos bûchers, et qu’ils s’élèvent contre l’usage de brûler les corps ; comme s’ils n’étaient détruits que par la flamme, comme si le seul ravage du temps et des années ne suffisait pas pour les réduire en poudre. Eh ! qu’importe en effet pour ces corps d’être mis en pièces par les bêtes, ou engloutis dans les flots, ou ensevelis sous la terre, ou consumés par les flammes ! S’il leur reste quelque sentiment, toute sépulture est pour eux un supplice ; s’ils n’en conservent point, la plus prompte est la plus salutaire.</p><p>Par suite de l’erreur qui les abuse, ces hommes se promettent à eux seuls, après la mort, comme s’ils étaient les seuls gens de bien, une vie éternellement heureuse, et condamnent le reste des hommes, comme autant de criminels, à des supplices sans fin. Que de réflexions à joindre à celles-ci, si je n’avais hâte de finir ce discours. Les criminels, les pervers, ce sont eux-mêmes, je l’ai déjà dit, et je ne me mets plus en peine de le prouver.</p><p>Mais quand j’accorderais qu’ils sont justes, l’opinion la plus commune, c’est que le crime comme l’innocence doit être imputée au destin. Tel est aussi votre sentiment ; car, si les autres rapportent au destin tout ce que nous faisons, vous, vous le rapportez à votre Dieu ; n’est-ce pas la même chose ? Vous dites qu’on n’est point de votre secte seulement pour le vouloir, mais aussi par le choix de votre Dieu ; vous en faites donc un juge inique, qui punit dans l’homme l’ouvrage du destin et non celui de la volonté. Je voudrais maintenant savoir de vous comment se fera votre prétendue résurrection ; sera-ce avec des corps ? et lesquels ? est-ce avec les mêmes ou avec de nouveaux ? ou bien sans corps ? Mais sans corps, si je ne me trompe, il n’y a plus ni âme, ni sentiment, ni vie. Avec le même corps ? mais il n’existe plus, il est depuis longtemps détruit. Avec un autre ? il naîtra donc un nouvel homme ? ce n’est plus le premier qui se relève de ses ruines. Tant de générations ont passé ! depuis un si grand nombre de siècles écoulés jusqu’à nous, est-il revenu un seul homme du tombeau, du moins comme Protésilas seulement avec un congé de quelques heures pour servir de preuve ? Ce sont là les rêves d’un cerveau malade, les consolations chimériques offertes par une poésie mensongère avec le charme des vers où se joue l’imagination ; et votre crédulité n’a pas rougi d’en faire honneur à votre Dieu.</p><p>XII. L’expérience du présent ne suffit-elle pas pour vous détromper de l’illusion de ces belles promesses et de la frivolité de pareilles espérances ? Malheureux ! apprenez par ce que vous souffrez dans la vie ce que vous avez à attendre après la mort. Vous le voyez, la plupart d’entre vous, et de votre aveu les plus vertueux, sont dans la misère, souffrent de la faim, du froid, des rigueurs d’un pénible travail, et votre Dieu le permet ou feint de ne pas s’en appercevoir : il ne veut donc pas ou il ne peut pas secourir les siens ; dès lors il est impuissant ou injuste. Toi qui rêves une immortalité posthume, en l’attendant tu es pressé par les dangers, brûlé par la fièvre, déchiré par la douleur. Et tu ne sens pas encore ta misère ? et tu ne reconnais pas ton néant ? malheureux ! tout contre ton gré accuse ta faiblesse, et toi seul ne veux pas en convenir !</p><p>Passons sur les maux qui sont le partage de l’humanité ; mais ces menaces, ces châtiments, ces tortures, ces croix qu’il ne s’agit pas d’adorer mais de souffrir, ces feux que vous vous plaisez d’annoncer et que vous redoutez, votre Dieu saura-t-il vous en préserver ? Où est-il ce Dieu qui vient au secours des morts et qui ne peut secourir les vivants ? Les Romains sans son aide ne commandent-ils pas ? ne règnent-ils point ? ne sont-ils pas les maîtres du monde entier et de vous-mêmes ? Toujours inquiets, craintifs, vous vous interdisez les plaisirs les plus honnêtes ; vous n’assistez point à nos spectacles ; vous fuyez nos fêtes ; jamais on ne vous rencontre dans nos repas publics. Nos combats sacrés, les mets offerts sur nos autels, le vin versé en libation, tout cela vous fait horreur. Vous ne croyez pas à nos dieux et vous en avez peur ; vous ne couronnez pas vos têtes de fleurs, vous ne répandez pas d’essences sur vos corps ; vous réservez les parfums pour les funérailles ; vous vous faites scrupule de déposer des couronnes sur les tombeaux. Pâles, tremblants, dignes de pitié, et surtout de la commisération de nos dieux, que vous êtes à plaindre ! Infortunés, qui ne ressuscitez point, et qui, en attendant, ne vivez pas ! S’il vous reste du bon sens, de la pudeur, cessez d’interroger la marche des cieux, de vouloir deviner les secrets de la nature, les destinées du monde. Contentez-vous de regarder à vos pieds, n’est-ce pas assez pour des êtres grossiers, ignorants, barbares ; il ne vous a pas été donné de connaître les ressorts secrets des affaires humaines, à plus forte raison vous est-il refusé de discourir sur les choses divines.</p><p>XIII. Du moins prenez modèle sur Socrate, si la manie de philosopher vous possède, et s’il se trouve parmi vous quelques esprits assez élevés pour oser suivre le premier des sages. On sait la réponse qu’il fit quand on l’interrogeait sur les corps célestes : « Ce qui est au-dessus de nous, disait-il, ne nous regarde pas. » Aussi est-ce à bon droit qu’il a mérité d’être proclamé par l’oracle le plus sage des hommes ; mais il comprenait le sens de l’oracle, il sentait que si on le plaçait au-dessus des autres, c’était moins pour avoir tout appris que pour savoir qu’il ne savait rien. La science suprême, en effet, c’est de savoir reconnaître son ignorance. Et voilà le principe d’où sont partis Arcésilas, Carnéade, et la plupart des philosophes académiciens, qui commencent si prudemment par le doute dans les plus graves questions : manière de philosopher glorieuse pour le sage, sans danger pour l’ignorant. La prudente lenteur de Simonide Mélicus n’est pas seulement à admirer, mais à suivre. Pressé par le tyran Hiéron de lui dire ce qu’il pensait des dieux, quelle était leur nature, d’abord il demanda un jour pour y réfléchir, puis deux, puis quatre ; et enfin il répondit au tyran étonné de tant de délais, que plus il approfondissait la question, plus la vérité s’obscurcissait pour lui. Mon opinion à moi, c’est qu’il faut laisser les choses douteuses pour ce qu’elles sont ; et lorsque tant et de si beaux génies restent dans le doute, ne pas prendre parti si vite et si témérairement, de peur d’introduire une superstition ridicule et d’anéantir tout sentiment religieux.</p><p>XIV. Ainsi parla Cécilius ; et se mettant à sourire, car la chaleur de son discours avait fait tomber sa mauvaise humeur, il ajouta : Maintenant qu’ose répondre Octave de la race de Plaute, sans contredit le premier des boulangers s’il n’est pas le dernier des philosophes. — Cessez, lui dis-je, à propos de Plaute, de vous applaudir aux dépens d’Octave ; vous ne devez pas faire trophée de votre éloquence, avant d’avoir entendu votre adversaire. D’ailleurs, ce n’est point pour la gloire mais pour la vérité que vous combattez ici. Votre harangue si variée et si subtile m’a vivement intéressé ; mais elle m’a suggéré des réflexions d’un ordre plus élevé qui se rattachent moins à la discussion présente qu’à la manière de discuter en général. Je remarque avec peine que le talent de l’orateur et les artifices de l’éloquence embrouillent souvent les questions les plus claires. C’est un inconvénient qui résulte, comme on le sait, de la molle facilité des auditeurs ; ils se laissent entraîner par le charme des paroles qui détournent leur attention du fond des choses, ils admettent sans choix tout ce qu’on leur dit, et arrivent à confondre le faux avec le vrai, d’autant plus aisément qu’ils ne savent pas que le vraisemblable couvre souvent le mensonge, et que ce qui paraît à peine croyable recèle la vérité. Plus ils croient facilement ce qu’on leur dit, plus ils rencontrent de gens habiles qui leur font croire tout ce qu’ils veulent. Toujours dupes de leur imprudence, au lieu de s’en prendre à la faiblesse de leur jugement, ils se plaignent que tout est incertain ; et par une erreur qui tient toujours au même fond de faiblesse, ils finissent par tout condamner ; ils préfèrent ne se prononcer sur rien et rester dans un doute universel plutôt que de prendre parti dans des questions qui les trompent toujours. Gardons-nous bien de poursuivre de cette haine tout raisonnement. Elle va jusqu’à faire concevoir aux plus simples, je ne sais quel mépris, quelle aversion pour tous les hommes ; leur imprudente crédulité les expose à être trompés par des personnes qui leur semblaient de bonne foi ; une erreur entièrement semblable leur rend toutes les autres suspectes, et la crainte que leur inspirent les hommes pervers, ils l’éprouvent à l’égard de ceux qu’ils avaient jugés les plus vertueux.</p><p>C’est pourquoi nous sommes souvent assez embarrassés. Toute question à examiner se présente sous deux faces : d’un côté se trouve la vérité, mais obscure ; de l’autre, une merveilleuse subtilité qui, par l’abondance des paroles, fait l’illusion d’une démonstration solide et convaincante. Il nous faut donc ici tout peser, et avec toute la maturité possible, de manière à faire au talent sa part d’éloge, et à démêler la vérité pour l’approuver et l’adopter.</p><p>— XV. Vous manquez, reprit Cécilius, aux devoirs d’un juge impartial ; vous ne devez point, par un préambule de cette nature, affaiblir la force de mon discours ; d’autant plus qu’il ne touche pas Octave, puisqu’il n’a pas encore parlé et qu’il lui trace sa ligne pour me réfuter, si toutefois il le peut.</p><p>— Si je ne me trompe, lui répondis-je, c’est dans l’intérêt de tous deux que je me suis permis ces réflexions générales, sur lesquelles tombent vos reproches. J’ai voulu faire entendre que je ne me prononcerais qu’après l’examen le plus scrupuleux, et que c’était moins la beauté des formes que la solidité du fond qui ferait pencher la balance.</p><p>Mais c’est trop longtemps partager l’attention, ainsi que vous vous en plaignez. Écoutons, dans le plus grand silence, notre cher Octave qui s’apprête à parler.</p><p>— XVI. Je le ferai de mon mieux, reprit Octave, nous devons ici réunir nos efforts pour qu’un langage, tout de vérité, vienne, comme une onde pure, laver la tache qu’on voudrait, à force d’amères injures, imprimer sur notre front. Je ne dissimulerai point qu’au premier abord les idées de mon cher Cécilius m’ont tellement paru flotter au hasard dans le vague et dans l’indécision, qu’il m’aurait été difficile de décider si c’était son érudition qui s’embarrassait ou l’erreur qui le faisait chanceler. Tantôt il a posé en principe l’existence des dieux, tantôt il l’a remise en question. Il a varié au point que l’incertitude de ses principes laissait ma réponse plus incertaine encore, parce qu’elle ne lui offrait aucun point d’appui.</p><p>Je ne crois pas, je ne veux pas croire, qu’il y ait aucune ruse dans mon cher Cécilius. La simplicité de son caractère repousse l’astucieuse habileté du siècle. Que dirai-je donc pour le justifier à mes yeux ? Comme celui qui ne sait pas le chemin direct pour aller à un endroit, s’arrête incertain lorsqu’il arrive au point où ce chemin se partage en plusieurs, ainsi qu’il arrive souvent, et n’ose en choisir un ni les essayer tous ; de même l’homme qui n’a rien de fixe dans l’esprit sur la vérité, perd toute idée, ne sait plus où il est, quand on lui jette quelque doute perfide et trompeur.</p><p>Faut-il s’étonner que Cécilius, dans ce flux et reflux d’opinions humaines qui se combattent et s’excluent, se soit vu ainsi emporté, balloté, flottant au hasard. Mais, pour le sauver de ses perplexités, je vais l’instruire et le convaincre par la réfutation même de tout ce qu’il a avancé. Je tâcherai de le suivre pas à pas, malgré tous ses écarts. Une seule vérité bien établie deviendra un point d’appui qui ne lui laissera plus ni doute ni incertitude sur le reste. Comme ce cher frère n’a pu contenir la peine, le dépit, la douleur, l’indignation qu’il éprouvait en voyant des gens pauvres, grossiers, ignorants, discourir des choses du ciel, je veux qu’il sache que tous les hommes, sans distinction d’âge, de sexe, de rang, sont nés avec l’usage de la raison et de l’intelligence ; qu’ils tiennent cette aptitude, non du hasard, mais de la nature ; que les philosophes eux-mêmes et les hommes célèbres par la découverte des sciences et des arts, ont aussi passé pour des êtres vils, méprisables, ignorants, avant que leur génie eût livré un nom glorieux à la renommée ; que nous n’avons rien reçu des riches, esclaves de leurs biens et plus accoutumés à regarder l’or que le ciel ; que ce sont ces pauvres qu’on méprise qui ont découvert la sagesse et transmis la science de siècle en siècle. Le génie ne s’achète pas, il ne s’acquiert pas même par l’étude, il tient à l’âme, il naît avec elle. Il ne faut donc pas voir avec dépit, avec indignation qu’un homme, quel qu’il soit, ait son opinion, la développe, raisonne sur les choses divines. Ce n’est point l’autorité de celui qui discute, mais la vérité, objet de la discussion, qu’il faut examiner avant tout. Plus le langage est simple, plus la vérité est lumineuse. La pompe et les grâces du style sont un fard trompeur qui la déguise. C’est par elle même qu’elle se soutient comme l’unique base de l’équité.</p><p>XVII. Je ne rejette pas le principe que Cécilius, avant tout, s’est efforcé d’établir ; c’est-à-dire que l’homme doit se connaître, s’étudier lui-même, examiner ce qu’il est, d’où il vient, pourquoi il existe ; s’il est un composé d’éléments ou un ingénieux mélange d’atômes, ou plutôt si c’est Dieu qui l’a créé, formé, animé ; voilà le terme inconnu du problème que nous ne pouvons atteindre et bien dégager, sans avoir sérieusement examiné l’ensemble. Car dans l’univers, tout se tient, tout se lie, tout s’enchaîne, et l’on n’entend rien à la nature humaine si l’on n’a point cherché à se rendre compte de la nature divine, comme on ne peut réussir à poser les lois d’un état particulier si on ne connaît bien les lois qui régissent la grande société humaine, le monde entier. Ce qui nous distingue surtout des bêtes, c’est que nous ne sommes pas nés comme elles, courbées, inclinées vers la terre, les yeux tournés vers leur pâture ; nous avons le front élevé, le regard dirigé vers le ciel, et de plus la raison et la parole par lesquelles nous pouvons concevoir, connaître, imiter Dieu. Nous serait-il permis d’ignorer les clartés divines que le ciel porte en quelque sorte à nos yeux et à tous nos sens ? Ne serait-ce pas un sacrilége, et un sacrilége des plus criminels, que de chercher dans la boue de cette terre ce que nous ne pouvons trouver que dans les sublimes régions du ciel ?</p><p>Ceux qui veulent que l’ordre si parfait de ce bel univers vienne, non d’une intelligence divine, mais du concours de certains corps rapprochés par le hasard, me semblent privés de la raison, du sentiment et même de la vue.</p><p>Quoi de plus clair, de plus manifeste, de plus éclatant, quand on élève ses regards au ciel, qu’on les abaisse au-dessous des cieux, qu’on les porte autour de soi, que l’existence de cette raison supérieure qui anime, meut, alimente, gouverne toute la nature ? Voyez le ciel ! qu’il est vaste dans son étendue ! qu’il est rapide dans sa révolution ! il est parsemé d’étoiles pendant la nuit, ou bien éclairé par le soleil pendant le jour ; vous comprendrez alors combien est admirable, parfait, cet équilibre que le souverain modérateur sait maintenir. Voyez comme la course circulaire du soleil fait l’année ; comme la lune, par sa clarté progressive, décroissante, défaillante, mesure le mois. Que dirai-je du retour successif des ténèbres et de la lumière, qui nous donne alternativement le repos et le travail ? C’est aux astronomes à nous parler avec plus de développement des étoiles, qui règlent le cours de la navigation, ou qui ramènent le temps du labourage et des moissons.</p><p>Non seulement il a fallu une intelligence supérieure, un ouvrier divin pour créer, pour former, pour disposer chacune de ces merveilles, il faut encore, pour les étudier, les comprendre, les apprécier, une grande force de raison et d’esprit.</p><p>Parlerai-je de la succession des saisons et des fruits, si constante dans sa variété même ? Tout ici ne révèle-t-il pas un père, un auteur divin, et le printemps avec ses fleurs, et l’été avec ses moissons, et l’automne avec ses fruits murs et délicieux, et l’hiver avec ses olives si nécessaires ? Tout ce bel ordre subsisterait-il longtemps s’il n’était maintenu par une raison souveraine ?</p><p>Pour que l’hiver ne régnât pas seul avec ses neiges qui nous auraient glacés, l’été avec ses feux qui nous auraient dévorés, avec quelle prévoyance le printemps et l’automne ont été placés comme milieux si justes et si sages que, dans la révolution de l’année revenant sur elle-même, le passage d’une saison à une autre est presque insensible et inapperçu.</p><p>Contemplez la mer. Elle est arrêtée par la loi écrite sur ses bords. Voyez comme toutes les plantes tirent leur vie des entrailles de la terre. Considérez l’océan : l’alternative du flux et du reflux le maintient dans une continuelle agitation. Voyez les fontaines : elles coulent sans s’épuiser. Observez les fleuves : ils vont, et rien n’arrête leur cours. Que dirai-je de l’heureuse disposition des montagnes en droite ligne, de la pente sinueuse des collines, de la vaste étendue des plaines ? Parlerai-je de la diversité des défenses chez les animaux ? ceux-ci sont armés de cornes, ceux-là sont munis de dents ; les uns pourvus de serres, les autres hérissés d’aiguillons ; quelques-uns échappent par l’agilité de leur course, d’autres par la rapidité de leur vol. C’est surtout la beauté de la forme humaine qui atteste un Dieu pour auteur. Voyez cette stature droite, ce visage élevé, ces yeux placés au sommet comme des sentinelles, et les autres sens disposés dans le reste du corps comme dans une forteresse.</p><p>XVIII. Le détail de chaque merveille nous mènerait trop loin. Il n’est pas un seul membre dans l’homme qui n’ait sa grâce ou son utilité. Ce qui doit le plus étonner, c’est que nous avons tous le même visage, avec des traits différents. Quelle merveille que la manière de naître, que le désir de la reproduction ? Ne viennent-ils pas de Dieu, l’un et l’autre ? Comme la mamelle se gonfle de lait à mesure que l’enfant se développe au sein de sa mère, comme sa frêle existence se fortifie à la faveur de la nourriture abondante que lui offre ce lait ! Dieu ne veille pas seulement sur l’ensemble, mais encore sur chaque partie de l’univers. La grande Bretagne est presque sans soleil, mais elle est réchauffée par les tièdes vapeurs de la mer répandue autour d’elle. Le Nil tempère la sécheresse de l’Égypte ; l’Euphrate fertilise la Mésopotamie ; l’Indus, dit-on, ensemence et arrose l’Orient. Lorsque vous entrez dans une maison et que vous y voyez tout à sa place, orné et décoré avec soin, vous pensez aussitôt que là préside un maître, supérieur à tout ce qui frappe vos regards. Ainsi, dans le palais du monde, puisque vous voyez un ciel, une terre, une providence, un ordre, une loi, croyez donc à l’existence d’un maître, d’un créateur de tout l’ensemble, plus beau, plus parfait que tous les astres, que tous les objets dont se compose cet univers. Peut-être n’avez-vous aucun doute sur la Providence, mais pensez-vous qu’il importe plutôt d’examiner si l’empire des cieux est soumis au commandement d’un seul ou à l’autorité de plusieurs : question facile à résoudre, si l’on fait attention que les choses de la terre ont leur modèle dans les cieux. Jamais partage de royaume n’a commencé de bonne foi et n’a fini autrement qu’avec du sang.</p><p>Je laisse de côté les Perses, faisant du hennissement de leurs chevaux un augure pour arriver à l’empire. Je ne parle point des deux frères Thébains et de leur histoire, morte aujourd’hui. Elle est bien plus connue l’histoire de ces deux autres frères, toujours en guerre pour une royauté de cabanes et de bergers. Les combats d’un beau-père et d’un gendre sont fameux dans tout l’univers. La fortune d’un si vaste empire était trop petite pour ces deux hommes. Voyez les animaux. Les abeilles n’ont qu’un roi ; les troupeaux qu’un chef ; les bœufs, les chevaux qu’un seul guide. Et vous voulez que dans le ciel la souveraineté soit divisée, que le pouvoir de l’empire éternel, le seul véritable, soit mis en pièces et partagé entre plusieurs ! N’est-il pas évident que le Dieu, auteur de tout, n’a ni commencement ni fin ; que s’il donne l’être à tous, il s’est donné l’éternité ; qu’avant ce monde, il était un monde à lui-même ; qu’il commande à tout par sa parole, qu’il règle tout par sa sagesse, qu’il accomplit tout par sa puissance ? On ne peut le voir, il est trop éclatant pour nos yeux ; ni le saisir, il est trop pur pour nos mains ; ni se le figurer, il est trop au-dessus de nos sens. Immense, infini, lui seul connaît tout ce qu’il est. Notre esprit est trop étroit pour le concevoir. Nous exprimons l’idée la plus digne de lui, lorsque nous le proclamons au-dessus de toute expression. Dirai-je ce que je pense ? Prétendre connaître la grandeur de Dieu, c’est la diminuer ; croire ne pas la diminuer, ce n’est point la connaître. Ne cherchez pas un nom à Dieu, Dieu est son nom. Les noms sont nécessaires, quand il existe une multitude d’êtres qu’il faut distinguer les uns des autres par des signes particuliers. Mais Dieu est seul ; ce seul mot, Dieu, embrasse tout. Si je l’appelais père, vous le croiriez terrestre ; roi, vous le soupçonneriez charnel ; seigneur, vous le supposeriez mortel ; écartez de lui ces noms d’emprunt et surajoutés, et vous entrevoyez l’éclat de sa lumière. Que dirai-je ? J’ai pour moi le consentement de tous les hommes. Le peuple, quand il tend les mains vers le ciel, ne prononce que le mot Dieu. J’entends dire partout : Dieu est grand, Dieu est vrai, plaise à Dieu ! Ce langage que la nature apprend au vulgaire, n’est-ce pas celui du chrétien, professant sa foi ? Ceux qui veulent un Jupiter souverain ne se trompent que de nom ; il sont d’accord avec nous sur l’unité de puissance.</p><p>XIX. Mais j’entends aussi les poètes qui célèbrent un seul père des dieux et des hommes, et répètent que l’âme est telle que l’a faite ce Dieu, principe de toutes choses. Que dit Virgile, le poète de Mantoue ? Quoi de plus clair, de plus vrai, ou du moins de plus près de la vérité que ces paroles : « Dès le commencement, dit-il, un souffle divin entretient la vie du ciel, de la terre, et de toutes les autres parties du monde. Cette âme répandue partout fait tout mouvoir. De là les hommes, les animaux et toutes les bêtes. » Et ailleurs, il appelle Dieu, cette âme, ce souffle. Voici ses paroles : « Dieu, dit-il, pénètre partout, au sein de la terre, des mers, dans les profondeurs des cieux. De là les hommes et les animaux ; de là les pluies et les feux. » Disons-nous que Dieu soit autre chose qu’une âme, un esprit, une intelligence ? Passons en revue, s’il vous plaît, les opinions des philosophes, et vous reconnaîtrez que s’ils diffèrent de langage, ils s’entendent et s’accordent parfaitement sur le fond des choses pour établir la même idée.</p><p>Je laisse là ces anciens d’un génie encore inculte que leurs maximes ont fait appeler du nom des sages. Commençons par Thalès de Milet, celui des philosophes qui parla le premier des choses célestes. Il dit que l’eau est le principe de tout, et que Dieu est cette intelligence qui a tout fait avec l’eau ; mais que cette vertu de l’eau et de l’esprit émanée de Dieu est trop élevée, trop sublime, pour que l’homme puisse y atteindre. Vous voyez que l’opinion du premier philosophe est entièrement d’accord avec la nôtre. Anaximène, et après lui Diogène d’Apollonie, enseignent que l’air est Dieu ; ils le font immense, infini, et sous ce dernier rapport ils ont le même sentiment que nous de la divinité. La description que fait Anaxagore, ce mouvement qu’il suppose imprimé par un esprit infini, convient parfaitement à Dieu. Le Dieu de Pythagore est aussi un esprit répandu par toute la nature, attentif à tout, et d’où tous les êtres empruntent la vie. On sait que Xénophanes définit Dieu, l’infini uni à l’intelligence ; qu’Antisthène assigne des dieux à chaque nation, mais en reconnaît un principal pour toute la nature ; que Speusippe appelle Dieu une certaine force vitale qui gouverne tout. Parlerai-je de Démocrite, le premier inventeur des atômes ? N’appelle-t-il pas Dieu, et la nature qui envoie les images, et l’intelligence qui les reçoit ? Straton aussi appelle la nature, Dieu ; et cet Épicure, qui fait des dieux oisifs, ou plutôt qui les anéantit, met cependant la nature au-dessus de tout. Aristote varie : toutefois il reconnaît une seule puissance et appelle Dieu tantôt l’esprit, tantôt le monde, quelquefois il assujétit le monde à Dieu. Héraclide n’est pas plus fixe ; malgré ses variations, il donne à Dieu une intelligence divine. Théophraste, Zénon, Chrysippe, Cléante, fort peu d’accord avec eux-mêmes, sont tous ramenés à reconnaître l’unité d’une Providence.</p><p>Cléante, parlant de Dieu, en fait tantôt un esprit, tantôt l’âme, tantôt l’air, quelquefois la raison elle-même. Zénon, son maître, veut que la loi naturelle et divine, ou l’éther, ou bien la raison, soient le principe de tout ; et quand il dit que Junon est l’air, Jupiter le ciel, Neptune la mer, Vulcain le feu, et qu’il fait voir aussi des dieux dans les autres éléments, il réfute et confond victorieusement l’erreur publique de l’idolâtrie. Chrysippe dit presque la même chose. Il considère Dieu comme une force divine, une nature rationnelle, le monde lui-même, ou l’inévitable destin. Il imite Zénon dans ses interprétations physiologiques des fables d’Hésiode, d’Homère, d’Orphée. Vous trouvez dans Diogène de Babylone le même système pour expliquer l’enfantement de Jupiter, la naissance de Minerve et les autres événements de cette nature, dont il fait des noms de choses plutôt que des divinités. Xénophon déclare qu’on ne peut savoir la manière d’être du vrai Dieu, qu’il ne faut donc pas chercher à la connaître. Ariston de Chios enseigne qu’elle est incompréhensible. Tous deux ont eu le sentiment de la majesté divine, par là même qu’ils ont désespéré de la comprendre. Le langage de Platon sur Dieu, pour la pensée comme pour l’expression, est plus clair et plus positif. Il serait vraiment divin, si le mélange de quelques idées politiques ne venait l’affaiblir. Aux yeux de Platon, dans le <i>Timée</i>, Dieu, par son nom même, est le père du monde, le créateur de l’âme, l’architecte du ciel et de la terre. Il apprend avant tout que, s’il est difficile de le connaître à cause de son incroyable et infinie puissance, il est impossible d’en parler publiquement lorsqu’on l’a connu. Ce langage est presque le nôtre. Nous reconnaissons un seul Dieu, nous disons qu’il est l’auteur de toutes choses, et nous n’en parlons jamais en public, à moins qu’on ne nous interroge.</p><p>XX. Je viens de passer en revue les opinions de presque tous les philosophes, dont le plus beau titre de gloire est d’avoir, sous des noms divers, reconnu un seul Dieu ; d’où il résulte, pour tout homme qui pense, que les Chrétiens d’aujourd’hui sont des philosophes, ou que les philosophes d’autrefois étaient des Chrétiens.</p><p>Si le monde est gouverné par une providence et conduit par la volonté d’un seul Dieu, comme nous venons de le prouver, il ne faut pas qu’une antiquité ignorante, émerveillée de ses fables et séduite par elles, nous entraîne dans ses égarements, puisqu’elle est réfutée par ses propres philosophes qui, avec la sanction du temps, ont encore l’avantage de la raison. Nos pères ont été si faciles à recevoir toutes sortes de mensonges, qu’ils ont admis, avec une inconcevable crédulité, les prodiges les plus absurdes, tel qu’une scylla à plusieurs corps, une chimère à différentes formes, une hydre sans cesse renaissante de ses fécondes blessures, des centaures, hommes et chevaux tout ensemble. Ils accueillaient avec avidité toutes les fictions de la renommée. Que dirons-nous de ces rêves d’une vieillesse délirante, de ces métamorphoses d’hommes en oiseau, en bêtes, en arbres, en fleurs ; certes, si elles s’étaient jamais faites, elles se feraient encore ; et dès lors qu’elles ne peuvent se faire, c’est une preuve qu’elles n’ont jamais été possibles. Nos ancêtres ont été tout aussi crédules, tout aussi imprudents dans leur grossière simplicité, lorsqu’ils ont adopté leurs dieux. Ils ont rendu un culte religieux à leurs rois ; ils ont voulu les contempler dans leurs images, après leur mort, et conserver leur mémoire dans leurs statues ; et les objets de leur consolation sont devenus à leurs yeux des êtres sacrés. Avant que le monde fut ouvert au commerce, que les nations eussent mêlé leur culte et leurs mœurs, chaque peuple honorait, comme un citoyen digne de mémoire, ou son fondateur, ou un capitaine célèbre, ou une reine pudique, supérieure à son sexe, ou un bienfaiteur, ou l’inventeur de quelque art utile. Par ce moyen, on donnait une récompense aux morts et un exemple à la postérité.</p><p>XXI. Lisez les récits des historiens et les écrits des philosophes, et vous serez, comme moi, frappé de cette vérité. Évhémère montre très-bien que toutes ces divinités sont des hommes déifiés pour leurs vertus ou leurs bienfaits ; il rappelle le jour de leur naissance, leur patrie, leurs tombeaux ; il fait ainsi l’histoire des dieux de chaque province. Il nous parle d’un Jupiter de Crète, d’un Apollon de Delphes, d’une Isis de Pharos, d’une Cérès d’Éleusis. Prodicus nous apprend qu’on a mis au rang des dieux les hommes qui, par leurs voyages ou leurs découvertes en agriculture, avaient rendu de grands services à l’humanité. Persée, dans ses recherches philosophiques, fait les mêmes observations. Il appelle du même nom, et les fruits récemment découverts, et les hommes qui en firent la découverte, comme on le voit par ce langage d’un poète comique : Vénus languit sans Bacchus et Cérès. Le grand Alexandre de Macédoine écrit à sa mère, dans un ouvrage remarquable, qu’un prêtre égyptien, intimidé par sa puissance, lui avait dévoilé ce secret, que leurs dieux n’étaient que des hommes ; il place Vulcain à la tête de tous ces hommes déifiés, et ensuite la famille de Jupiter. Voyez le sistre d’Isis changé en hirondelle, le tombeau vide de Sérapis ou Osiris, dont les membres furent dispersés. Considérez enfin et les sacrifices et les mystères, et vous apprendrez quels furent les événements tragiques, la mort, les funérailles, les gémissements, les plaintes de ces tristes dieux. Isis, avec son Cynocéphale et ses prêtres rasés, pleure, regrette, cherche partout son fils qu’elle a perdu. Les prêtres isiaques, dans leur affliction, se frappent la poitrine et imitent la douleur d’une mère éplorée. L’enfant se retrouve, et aussitôt Isis se réjouit, ses prêtres tressaillent de joie, Cynocéphale, auteur de la découverte, en est tout fier. Ainsi, tous les ans, ils ne cessent de perdre ce qu’ils trouvent et de retrouver ce qu’ils perdent. N’est-il pas ridicule de pleurer ce qu’on adore et d’adorer ce qu’on pleure ?</p><p>Ce culte, autrefois sacré en Égypte, l’est maintenant à Rome. Cérès, portant un flambeau allumé, errant çà et là, entourée de serpents, cherche, le cœur plein de trouble et d’anxiété, sa fille Proserpine, enlevée par surprise et déshonorée. Voilà les mystères d’Éleusis. Ceux de Jupiter que sont-ils ? Une petite chèvre est sa nourrice. Il est dérobé à l’avidité de son père, qui veut le dévorer. Les corybantes font retentir leurs cymbales, pour que le père n’entende pas les cris de l’enfant. J’ai honte de parler de Cybèle du mont Didyme qui, vieille et difforme, (elle était déjà mère de plusieurs dieux), et ne pouvant attirer entre ses bras l’amant adultère, trop malheureusement cher à son cœur, le mutila pour en faire un dieu eunuque. Voilà pourquoi les eunuques et les prêtres de Cybèle, l’adorent par le supplice de cette mutilation. Car, ce sont là des supplices véritables plutôt que des sacrifices.</p><p>Que dirai-je de la forme et de la figure de vos dieux ? Elles en montrent tout le ridicule et l’infamie ? Vulcain est un dieu boîteux et débile ; Apollon, après tant de siècles, est imberbe ; Esculape a une forte barbe, quoique fils d’Apollon, toujours jeune ; Neptune a les yeux verts ; Minerve les a bleus ; les yeux de Junon sont ceux d’un bœuf ; Mercure a des ailes aux talons ; Pan, des pieds crochus ; Saturne, des pieds chargés de fers ; Janus, deux visages, comme s’il voulait marcher à reculons ; Diane la chasseresse, une robe retroussée ; Diane d’Éphèse, de nombreuses et grosses mamelles ; Diane Trivia, trois têtes et plusieurs mains qui en font un monstre. Que dirai-je de votre Jupiter ? On le représente tantôt barbu, tantôt sans barbe. S’appelle-t-il Hammon ? il a des cornes ; Capitolin ? il porte des foudres ; Latiaris ? il est couvert de sang ; Férétrien ? on ne peut l’approcher. À quoi bon l’énumération de tous vos Jupiters ? il suffit de dire : Autant de noms, autant de monstres. Pour briller sous le nom de vierge, parmi les feux célestes, Érigone se pend ; pour vivre, les Dioscores meurent tour à tour ; pour se relever dieu, Esculape se fait foudroyer ; pour dépouiller l’homme, Hercule se brûle sur le mont Œta.</p><p>Voilà les absurdités et les erreurs dont nous avons hérité de l’ignorance de nos pères. Le grand malheur, c’est qu’elles sont devenues le fond même de nos études et de notre éducation. Nous nous en pénétrons surtout par la lecture des poètes, dont l’autorité a fait à la cause de la vérité un tort qu’on ne saurait exprimer. Ce n’est pas sans raison que Platon bannit de sa république, qui n’existe que dans ses livres, le fameux Homère ; mais toutefois après l’avoir comblé d’éloges et chargé de couronnes. Dans sa guerre de Troye, ce poète, plus qu’aucun autre, a trop assimilé vos dieux aux hommes, bien que ce ne soit ici qu’un jeu de son esprit. Il les a divisés en deux camps qu’il met aux prises. Il blesse Vénus, il enchaîne le dieu Mars, il fait couler son sang, il l’oblige à fuir. Il montre Jupiter délivré par Briarée des autres dieux qui voulaient le garotter, pleurant en pluie de sang son fils Sarpédon, qu’il ne peut arracher à la mort, embrasé d’amour par la ceinture de Vénus, et plus épris de Junon que d’aucune de ces amantes adultères. Ailleurs, Hercule transporte des fumiers hors d’une étable ; Apollon fait paître les troupeaux d’un roi appelé Admète ; Neptune relève des murailles pour un certain Laomédon, et, maçon infortuné, il se voit frustré du fruit de son travail. Dans un autre poète, on forge, sur une enclume, les foudres de Jupiter et les armes d’Énée, comme si le ciel, les foudres, les éclairs n’existaient pas longtemps avant que Jupiter reçût le jour dans l’île de Crète, comme si un cyclope pouvait imiter les flammes de la véritable foudre, comme si ce Jupiter ne devait pas les craindre. Que dirai-je de cet adultère de Vénus et de Mars, mis au grand jour ; de cette infâme passion de Jupiter pour Ganymède, consacré dans le ciel ? On a sans doute inventé, transmis toutes ces turpitudes, pour concilier au crime une autorité divine. Par le charme trop séduisant de ces mensonges et de ces fictions, on corrompt l’esprit des enfants, où se fortifie et se conserve jusque dans un âge très-avancé l’impression profonde laissée par ces fables. Ces infortunés vieillissent dans leurs préjugés ; et, ne voyant rien au-delà, ils n’arrivent point à la vérité, qui se présente toujours à ceux qui la cherchent.</p><p>Que Saturne, le père de cette race, de cet essaim de dieux, n’ait été qu’un homme, tous les auteurs de l’antiquité, grecs et romains, l’attestent. Nous l’apprenons de Népos et de Cassius, dans leur histoire ; Thallus et Diodore l’ont dit aussi. Ce Saturne, fuyant la Crète pour échapper à la fureur de son fils, aborda en Italie, où il fut accueilli par Janus. Grec d’origine, et poli par les arts, il en enseigna plusieurs à ces peuples incultes et ignorants ; il leur apprit à tracer des lettres, à marquer la monnaie d’une effigie, à forger des instruments. Il voulut que la contrée qui lui avait offert un asile fût appelée Latium, parce qu’elle l’avait caché.</p><p>C’est de lui que la ville de Saturnie prit son nom, comme Janiculum prit celui de Janus ; l’un et l’autre voulant laisser à la postérité un long souvenir. Saturne est donc un homme qui fuit, un homme qui se cache ; c’est le père d’un homme et le fils d’un homme. S’il fut appelé fils du ciel et de la terre, c’est qu’il vécut en Italie sans parents connus. Comme aujourd’hui nous disons tombés du ciel ceux qui nous arrivent soudainement ; et sortis de la terre, les inconnus qui nous paraissent d’une origine ignoble. Jupiter, son fils, régna sur la Crète ; là il eut des enfants, là il mourut. On visite encore l’antre de Jupiter ; on montre encore son tombeau, et sa mortalité est mise au grand jour par la nature des sacrifices qu’on lui offre.</p><p>XXIII. Il est inutile, je crois, de descendre à chacun des autres dieux en particulier, et de développer toute la suite de cette prétendue race divine, puisque la mortalité prouvée dans les pères a passé, par l’ordre même de la succession, dans le sang des fils, à moins que vous n’en fassiez des dieux après leur mort. Ainsi Romulus est Dieu grâce au parjure de Proculus ; ainsi Juba est Dieu grâce à la volonté des Maures ; ainsi des autres dieux qui furent déifiés de la sorte, et dont la consécration est moins une preuve de divinité qu’un dernier honneur rendu à leur autorité finie. Assurément, c’est bien contre leur gré qu’on leur donne ce titre ; ils aimeraient mieux rester hommes ; quelques vieux qu’ils soient, ils craignent de devenir dieux. Un dieu n’est pas mortel, dès-lors on ne peut faire un dieu de celui qui n’est plus, ni de ceux qui sont nés de lui, puisque tout ce qui naît doit mourir.</p><p>Un être divin n’a ni commencement ni fin. Si ces dieux sont nés autrefois, pourquoi n’en voyons-nous plus naître aujourd’hui ? Est-ce que Jupiter est trop vieux ; Junon, stérile ; Minerve aurait-elle blanchi sans devenir mère ? ou plutôt, toute cette génération de dieux n’a-t-elle pas fini dès qu’on a cessé de croire à toutes ces fables ? Au reste, si les dieux pouvaient s’engendrer les uns des autres, il n’y aurait pas de raison pour qu’ils finissent ; dès-lors nous aurions plus de dieux qu’il n’existe d’hommes ; l’air, le ciel ne pourrait pas plus les contenir que la terre les porter. Il est donc certain que tous ces dieux sont des hommes, puisque nous lisons leur naissance dans l’histoire, et que nous connaissons leur mort.</p><p>Doutez-vous que le peuple ne prie, n’adore publiquement leurs statues qu’il voit consacrées ? L’imagination de la multitude ignorante n’est-elle pas égarée par la beauté des formes qu’elles tiennent de l’art, éblouie par l’éclat de l’or, émerveillée par le brillant que leur prête la blancheur de l’argent et de l’ivoire ?</p><p>Si on voulait considérer comment se fabriquent tous ces simulacres, on rougirait d’avoir eu peur d’une matière habilement déguisée par l’ouvrier pour devenir un Dieu. Ce dieu de bois, reste peut-être d’un bûcher ou d’un gibet, est dressé, taillé, raboté, scié. Ce Dieu d’or ou d’argent, n’est souvent, comme celui que fit faire un certain roi d’Égypte, qu’un vase immonde qu’on forge, qu’on frappe à coups de marteaux, et qui reçoit sa figure sur une enclume. Pierre, il est taillé, sculpté, poli par un homme impur ; il ne sent ni l’injure de sa naissance, ni les honneurs qui lui viennent ensuite de votre piété. Mais peut-être que, bloc de pierre, ou morceau de bois, ou lingot d’argent, il ne peut encore faire un Dieu ; quand le devient-il ? Voilà qu’on le fond, qu’on le taille, qu’on le sculpte ; Attendez, ce n’est pas encore un Dieu ; on le soude, on l’élève, on le met en place ; est-il Dieu ? non pas encore ; mais on le pare, on le consacre, on le prie ; ah ! le voilà Dieu enfin, puisque l’homme le veut et en fait l’inauguration.</p><p>XXIV. Combien les animaux muets, par le seul instinct de la nature, sont plus justes appréciateurs de vos dieux ; je veux parler ici des rats, des hirondelles, des milans ; ils les savent insensibles, alors ils les rongent, ils sautent dessus, ils s’y perchent, et si vous ne les chassiez ils feraient leurs nids dans la bouche même de ces dieux. Les araignées leur couvrent le visage de leurs toiles, elles en suspendent les fils à leur tête. Vous les nettoyez, vous les frottez, vous les grattez, tant vous soignez, tant vous protégez les dieux de votre façon ! Aucun de vous ne se dit qu’il faut connaître Dieu avant de l’adorer. Vous vous hâtez, en aveugles, d’obéir à vos pères ; vous aimez mieux embrasser l’erreur commune que d’écouter votre raison ; vous craignez sans connaître. Dans l’or et l’argent, on a consacré l’avarice ; de vaines statues sont devenues des êtres importants, grâce à leur forme.</p><p>Ainsi est née la superstition romaine. Et dans les rites dont se compose le culte, si vous les passez en revue, combien vous en trouverez qui font rire, combien qui font pitié ? Parmi vos prêtres, les uns courent nuds çà et là au fort de l’hiver, d’autres marchent gravement, la tête couverte d’un bonnet, portant aux bras de vieux boucliers, se déchirant la peau, promenant des dieux qui demandent l’aumône le long des rues. Ce temple ne peut s’ouvrir que deux fois par an. Dans cet autre on ne peut mettre le pied sans crime. Quelques-uns sont interdits aux hommes ; ceux-là cessent d’être sacrés par la présence d’une femme ; qu’un esclave se trouve à certaines cérémonies, c’est un sacrilége qui demande expiation.</p><p>Telle statue ne peut être couronnée que par une femme qui n’a connu qu’un mari ; telle autre par une femme plusieurs fois mariée. On cherche avec grande dévotion celle qui compte le plus d’adultères. Que dirai-je de celui qui fait des libations de son propre sang, et qui prie par les blessures dont il se couvre ? ne lui vaudrait-il pas mieux être profane que religieux à ce prix ! Ceux qui se mutilent n’offensent-ils pas les dieux qu’ils pensent apaiser ! Car si vos dieux voulaient des eunuques, ils pourraient en créer et vous dispenser d’en faire. Ne voit-on pas que ce sont des esprits malades, des hommes dépourvus de sens et de raison, qui donnent dans ces folies ; que ceux qu’elles égarent se prêtent un mutuel appui. En effet, l’erreur commune ne cherche son excuse que dans la multitude des esprits égarés.</p><p>XXV. Ainsi, selon vous, cette superstition là même aurait fondé, accru, affermi l’empire romain, et c’est moins par la valeur que par la religion et la piété qu’il serait devenu puissant. Oui, sans doute, l’équité romaine a jeté un grand et noble éclat sur le berceau de cet empire.</p><p>Rassemblés d’abord par le crime, n’est-ce point à la faveur de l’effroi que répandait leur férocité, que les Romains durent leur accroissement. Une première populace s’attroupe dans une caverne ; là, de toutes parts, accourent des brigands, des scélérats, des incestueux, des assassins, des traitres. Romulus leur maître et leur chef, pour avoir sur eux la supériorité du crime commet un fratricide. Voilà le noble début de cette pieuse cité. Bientôt après elle enlève, elle trompe, elle déshonore sans aucune pudeur, des filles étrangères, fiancées et promises, de jeunes femmes déjà mariées.</p><p>C’est à leurs parents, c’est-à-dire à ses beaux-pères, qu’elle déclare une guerre impie. Elle se hâte de verser le sang auquel elle vient de s’unir. Quoi de plus sacrilége, de plus hardi, de plus audacieux, que cette assurance dans le crime ! Chasser leurs voisins de leur territoire, détruire les villes d’alentour, avec leurs temples et leurs autels, opprimer les captifs, s’accroître par la ruine et par le brigandage, telle a été la politique de Romulus, des autres rois et des chefs qui vinrent après.</p><p>Ainsi, tout ce que les Romains occupent, adorent, possèdent, est le fruit de l’audace. Leurs temples sont bâtis avec les débris des villes, les dépouilles des dieux, le sang des prêtres. Adopter les religions vaincues, les révérer captives après la victoire, c’est les insulter et les mépriser. Adorer ce qu’on a pris à main armée, c’est consacrer le sacrilége et non des dieux ; pour les Romains autant de triomphes, autant d’impiétés ; autant de trophées sur les nations, autant de dépouilles sur les dieux. Ils furent grands non pour avoir été religieux, mais impunément sacriléges : et comment, dans les batailles, pouvaient-ils compter parmi leurs protecteurs des dieux auxquels ils avaient fait la guerre, qu’ils n’adoraient qu’après avoir atteint le but de leur désir, c’est-à-dire les avoir vaincus ; que peuvent pour vous ces dieux qui n’ont pu soutenir contre vos armes leurs propres adorateurs ? Vos dieux indigènes, nous les connaissons tous. N’est-ce pas Romulus, Picus, Tibérinus, Census, Pilumnus ? Picumnus Tatius inventa Cloacine et l’adora. À celle-ci Hostilius ajouta la Pâleur et la Crainte. Bientôt après, je ne sais quel autre déifia la Fièvre. Et voilà les protecteurs de Rome, la superstition, les maladies et les maux ! Assurément on peut encore ranger parmi ces derniers, et compter au nombre de vos divinités, Acca Laurentia et Flora, ces deux infâmes prostituées. Oui, sans doute, ces dieux vous ont aidé à étendre votre empire, et à vaincre les dieux adorés des nations étrangères. Peut-on supposer que vous ayez eu pour vous, contre ces peuples, le Mars de la Thrace, le Jupiter de Crète, la Junon d’Argos, de Samos et de Carthage ; la Diane de la Tauride, la Cybèle du mont Ida, enfin les monstres plutôt que les dieux de l’Égypte, à moins, peut-être, qu’ils n’aient trouvé chez vous des vierges plus chastes, des prêtres plus saints ? Mais, n’a-t-on pas puni dans plusieurs de vos vierges, comme un inceste horrible, le commerce sacrilége qu’elles ont eu avec des hommes, à l’insu de Vesta leur déesse ; les autres doivent leur impunité, non à une chasteté mieux gardée, mais à une impudicité plus heureuse. Et n’est-ce pas dans vos temples, entre vos autels, que vos prêtres fixent le prix du crime, trafiquent de l’honneur des femmes, méditent des adultères ?</p><p>Vous trouverez plus souvent dans la cellule de vos prêtres, que dans l’asile même de la prostitution, la débauche brûlante de feux impudiques et livrée à toutes les infamies. Avant vous, sous la conduite de la Providence, les Assyriens, les Mèdes, les Perses, les Grecs même et les Égyptiens, n’ont-ils pas longtemps régné sans avoir ni pontifes, ni arvales, ni saliens, ni vestales, ni augures, ni de ces poulets en cage, dont l’appétit ou le dégoût réglait le sort de l’empire.</p><p>XXVI. Je viens maintenant à ces augures, à ces auspices que vous avez recueillis avec tant de soin, et présentés comme toujours négligés avec repentir, observés avec avantage.</p><p>Clodius, Junius, Flaminius, perdirent leur armée, dites-vous, parce qu’ils ne jugèrent pas à propos d’attendre le trépignement accoutumé des poulets, quand on leur jette du blé. Quoi donc ! est-ce que Régulus, fidèle observateur des augures, ne fut pas fait prisonnier ? Mancinus respecte la religion, et tombé au pouvoir de l’ennemi, il passe sous le joug. Paul-Émile trouve les poulets très-avides, et n’en périt pas moins avec la plus grande partie du peuple romain dans les plaines de Cannes. César méprise les augures et les auspices opposés à son passage en Afrique avant l’hiver ; et la mer lui devient plus favorable, la victoire plus facile. Que n’aurais-je pas à vous dire des oracles ! Amphiaraüs prédit ce qui doit lui survenir après sa mort, et ne prévoit pas que sa femme le trahira pour un collier. L’aveugle Tirésias lit dans l’avenir, et ne voit pas le présent. Ennius forge, au sujet de Pyrrhus, les réponses d’Apollon Pythien, lorsqu’Apollon avait déjà depuis longtemps cessé de faire des vers. Cet oracle, si adroit et si ambigu, n’a-t-il pas défailli depuis que les hommes sont plus instruits et moins crédules ? Aussi Démosthènes, qui savait bien que toutes les réponses étaient arrangées, se plaignait que la pythie philippisait. Souvent, me direz-vous, ces auspices et ces oracles ont rencontré la vérité. Je pourrais vous répondre que le hasard peut parfois sembler fort habile et deviner juste à travers une foule de mensonges. Mais j’irai à la source d’erreur et de corruption d’où s’élève le nuage ; j’essayerai d’aller au fond et de le montrer au grand jour.</p><p>Il existe des esprits impurs, errants, dans l’espace et de la hauteur des cieux abaissés aux passions fangeuses de la terre. Ces esprits, depuis qu’ils ont perdu la pureté de leur essence, et que le vice est devenu leur élément, ne cessent, pour se consoler de leur malheur, d’y entraîner les autres. Perdus, ils cherchent à perdre ; corrompus, ils veulent répandre l’erreur et la corruption ; séparés de Dieu, ils s’efforcent de nous en éloigner par les religions mauvaises qu’ils introduisent. Que ces esprits soient des démons, les poètes le disent, les philosophes l’enseignent. Socrate surtout l’a reconnu, lui qui s’était mis aux ordres d’un démon familier, pour les suivre dans tout ce qu’il avait à faire ou à éviter. Les magiciens non-seulement connaissent les démons, mais ils font par eux tout ce qui joue le miracle. Sous leur inspiration et leur influence, ils opèrent certains prestiges, comme de faire voir ce qui n’est pas, ou d’empêcher de voir ce qui est. Hostanès, le premier des magicien par les œuvres et le langage, s’exprime sur le vrai Dieu avec la majesté qui lui convient, et reconnaît des anges qui sont ses ministres et ses envoyés ; il les montre près de son trône dans un si profond respect, qu’au moindre signe de sa tête, au moindre de ses regards, ils tremblent et frissonnent.</p><p>Le même magicien nous apprend qu’il existe des démons terrestres, errants çà et là, ennemis du genre humain. Platon, qui trouve si difficile de découvrir le vrai Dieu, reconnaît sans peine des démons et des anges ; dans son dialogue du Banquet, il cherche à définir leur nature : il veut qu’elle tienne le milieu entre les substances périssables et les natures immortelles ; c’est-à-dire entre le corps et l’esprit, qu’elle soit un mélange de terre et de vapeurs légères. « C’est d’elle, ajoute-t-il, qu’émane l’amour, qu’il se forme et se glisse dans les cœurs, soulève les sens, remue les passions, allume l’ardeur des désirs. »</p><p>Or, ces esprits impurs, c’est-à-dire les démons, ainsi que l’ont montré les magiciens, les philosophes et Platon lui-même, se tiennent cachés sous les statues et les idoles que vous consacres. Par leur inspiration, elles acquièrent pour ainsi dire l’autorité d’une divinité présente. Tantôt ils entrent dans vos devins ou habitent vos temples ; tantôt ils animent les entrailles des victimes, conduisent le vol des oiseaux, dirigent les diverses espèces de sorts et rendent des oracles enveloppés de mensonges. Car ils trompent et sont trompés, soit qu’ils ne voient pas clairement la vérité, ou que la voyant, ils n’osent la publier contre eux-mêmes. Du ciel, ils vous rabaissent vers la terre ; du vrai Dieu, ils vous détournent vers les choses matérielles. Ils troublent la vie, inquiètent le sommeil ; esprits subtils et déliés, ils se glissent furtivement dans les corps, les dérangent par les maladies, effrayent les imaginations, torturent les membres, afin de nous forcer à les adorer, et après s’être engraissés du sang des victimes et de l’odeur de leur chair, placée sur des autels, ils paraissent avoir guéri ceux auxquels ils cessent de nuire. Ils sont eux-mêmes ces furieux que vous voyez courir dans les rues et ces devins qui se roulent à terre, s’agitent comme des bacchantes et font tant de folies dans vos temples ! Le sujet de la fureur est différent, mais l’inspiration démoniaque est la même. D’eux encore vient ce que vous avez dit de Jupiter redemandant en songe les jeux oubliés, des dioscores vus à cheval, de la barque suivant la ceinture d’une matrone ; la plupart d’entre vous n’ignorent pas que les démons le disent eux-mêmes et ne s’en cachent pas, toutes les fois que nous les chassons des corps ou par la torture de nos paroles, ou par la ferveur de nos prières. Saturne, Sérapis, Jupiter et tout ce que vous adorez de démons, vaincus par la douleur, déclarent ce qu’ils sont en présence même des vôtres, et n’osent mentir pour couvrir leur confusion. Vous les avez pour témoins, ils déposent contre eux en faveur de la vérité. Adjurés au nom du seul et vrai Dieu, les malheureux frissonnent involontairement dans les corps qu’ils possèdent ; ils en sortent brusquement ou s’en retirent peu à peu selon que la foi du patient favorise leur fuite, ou selon le bon plaisir de celui qui le guérit. Aussi fuient-ils précipitamment l’approche des Chrétiens qu’ils attaquaient de loin autrefois par votre ministère dans les assemblées ; et comme il est naturel de haïr ceux que l’on redoute, et de leur nuire si on le peut, ils se glissent dans l’esprit d’un vulgaire ignorant, et la crainte leur fait semer des haines secrètes contre nous ; c’est ainsi qu’ils s’emparent des âmes, qu’ils assiégent les cœurs, afin qu’on nous haïsse avant de nous connaître, de peur qu’après nous avoir connus, on ne puisse s’empêcher de nous imiter, ou se résoudre à nous condamner.</p><p>XXVIII. Quoi de plus inique que de juger comme vous le faites ce qui est nouveau pour vous, ce que vous ne connaissez pas. Nous aussi nous avons été ce que vous êtes ; dans notre aveuglement, dans notre stupide ignorance, nous pensions comme vous. Nous croyions que les Chrétiens adoraient des monstres, dévoraient des enfants, mêlaient l’inceste à leurs festins. Nous ne faisions pas attention que ces fables monstrueuses, soufflées par les démons, n’avaient jamais été ni examinées ni prouvées, que depuis si longtemps personne n’avait trahi le secret, lorsqu’on pouvait compter sur le pardon du crime et sur la récompense de la révélation ; que telle est l’innocence des Chrétiens, que lorsqu’ils sont les accusés, loin de rougir et d’avoir peur, ils regrettent de ne l’avoir pas été plutôt ! Les sacriléges, les incestueux et même les parricides trouvaient en nous des avocats et des défenseurs. Pour les Chrétiens, nous ne pensions pas même qu’on dût les écouter. Dans notre barbare pitié, nous sévissions avec plus de rigueur, nous les torturions pour les obliger à nier ce qu’ils confessaient et les dérober à la mort par ce désaveu. Ainsi, l’usage de la torture à leur égard était renversé ; elle ne cherchait plus à arracher la vérité, elle forçait au mensonge. Si un Chrétien plus faible que les autres se laissait vaincre à la douleur, au milieu des angoisses du supplice, et désavouait sa religion, nous prenions son parti comme si, pour avoir abjuré le nom qu’il porte, il s’était lavé de tous ses crimes. Ne voyez-vous pas maintenant que nous avons pensé comme vous, et fait tout ce que vous faites aujourd’hui ? Cependant, si la raison, et non l’inspiration du démon, présidait à ces jugements, il faudrait contraindre les Chrétiens, non à dire qu’ils ne le sont pas, mais à confesser leurs incestes, leurs infamies, leurs sacriléges, leurs infanticides. Voilà les fables dont les mêmes démons rebattent sans cesse les oreilles de la multitude, pour exciter contre nous l’horreur et l’exécration. Rien ici ne doit étonner. Comme la renommée, qui se nourrit des bruits semés dans le peuple, meurt en présence de la vérité, que font les démons ? Ils sèment, ils alimentent sans cesse la calomnie. Alors vous entendez répéter cette fable absurde que nous adorons comme un dieu la tête d’un âne. S’il faut être insensé pour se faire un pareil culte, ne faut-il pas être plus insensé encore pour le croire, à moins qu’il ne soit question de vous, qui, dans les étables, consacrez tous les ânes avec votre déesse Épone ; de vous, qui les dévorez pieusement avec Isis ; de vous, qui tout à la fois immolez et adorez des têtes de bœufs et des têtes de moutons ; de vous, enfin, qui placez dans vos temples des dieux moitié hommes et moitié boucs, des dieux à visage de chien ou de lion. Ne faites-vous pas paître et n’adorez-vous pas le bœuf Apis avec les Égyptiens ? Condamnez-vous leurs sacrifices en l’honneur des serpents, des crocodiles, des oiseaux et d’autres bêtes ? La superstition ne va-t-elle pas jusqu’à punir de mort l’homme qui tuerait un de ces dieux ? Ces mêmes Égyptiens, ainsi que plusieurs d’entre vous, ne redoutent pas moins leur Isis que l’âpreté des oignons ; leur Sérapis, que le bruit indécent qui sort de l’homme. L’inventeur de la fable qui nous fait adorer le membre viril d’un prêtre, nous impute ses propres infamies. Un pareil culte conviendrait mieux, je pense, chez des hommes hideusement impudiques, où les deux sexes prostituent tous leurs membres, où l’extrême lubricité s’appelle savoir vivre, où l’on envie la licence des courtisannes, où l’impureté des embrassements se porte à des horreurs qu’on ne saurait décrire, où la langue est immonde lors même qu’elle se tait, où l’on éprouve toute la lassitude de l’impudicité avant d’en ressentir la honte. Chose affreuse ! Les infâmes commettent un crime que l’âge le plus tendre ne pourrait souffrir, que la tyrannie la plus dure n’oserait imposer !</p><p>XXIX. Pour nous, il ne nous est pas même permis d’écouter ces horreurs. Plusieurs d’entre nous trouvent honteux que nous en parlions quand il s’agit de nous défendre. Ce que vous imputez à des hommes chastes et pudiques nous paraîtrait impossible si vous n’en offriez pas des exemples.</p><p>Vous nous reprochez d’adorer un criminel sur la croix. Vous êtes bien loin de la vérité, si vous pensez qu’un homme ait pu se faire adorer des Chrétiens, ou qu’un scélérat ait mérité qu’ils le crussent Dieu.</p><p>Qu’il est à plaindre celui qui place sa confiance dans un mortel ? il perd tout avec ce mortel. Nous laissons cette folie aux Égyptiens. Ils choisissent un homme parmi eux et l’adorent. Ils le consultent dans toutes leurs entreprises ; ils le supplient dans toutes leurs prières ; ils immolent des victimes en son honneur. Et cet homme, Dieu pour les autres, est toujours, qu’il le veuille ou ne le veuille pas, homme pour lui-même ; s’il peut tromper la bonne foi d’autrui, il ne saurait tromper la sienne. Une basse et honteuse flatterie ne se borne pas à donner aux rois et aux princes les noms de grand, d’illustre, ainsi qu’il est permis ; elle les appelle des dieux ; comme si l’honneur pour le grand homme n’était pas l’hommage le plus vrai, et l’amour pour l’homme de bien le tribut le plus doux.</p><p>Ils invoquent donc la divinité de ces hommes, ils tombent à genoux devant leurs images, ils implorent leur génie, disons mieux, leur démon. Ils trouvent plus sûr de se parjurer par le nom de Jupiter que par celui de leurs rois.</p><p>Nous n’adorons ni ne désirons la croix ; mais vous qui, du bois, faites des dieux, peut-être adorez-vous aussi des croix de bois comme faisant partie de ces dieux. Et que sont vos étendards, vos drapeaux, les enseignes de vos légions, sinon des croix dorées et chargées d’ornements. Vos trophées de la victoire ne présentent pas seulement la forme d’une croix, mais encore l’image d’un crucifié. Une image bien naturelle de la croix se trouve dans le navire qui fend l’onde avec ses voiles déployées, ou qui glisse doucement avec les rames en repos sur ses bords. Dressez-vous un joug, vous représentez une croix. Vous la représentez encore lorsque, les mains étendues, vous invoquez Dieu dans la sincérité de votre âme. La représentation de la croix est donc une expression qui se trouve dans la nature, ou qui fait le fond de votre culte.</p><p>XXX. Je veux arriver maintenant à ceux qui disent ou qui pensent que l’initiation, chez les Chrétiens, se fait par le sang et par le meurtre d’un enfant. Pouvez-vous croire que parmi nous, un corps si tendre, si délicat, soit destiné à des coups assassins ; que ce premier sang d’une créature si jeune, d’un être qui est à peine un homme, trouve quelqu’un qui veuille le faire jaillir, le verser, le boire ? Nul autre ne peut le croire que celui qui peut l’oser. Mais je vous vois tantôt exposer aux bêtes féroces, aux oiseaux de proie, vos enfants nouveaux-nés ; tantôt, par un genre de mort affreux, par la strangulation, leur ôter la vie. Il est des femmes parmi vous qui, à l’aide de certains breuvages, font mourir dans leurs entrailles l’homme encore en germe, et deviennent infanticides avant d’être mères. Grâce aux leçons de vos dieux, du ciel jusqu’à vous descendent ces forfaits. Saturne n’a point exposé ses enfants, mais il les a dévorés. C’est à bon droit que dans certaines contrées de l’Afrique, des pères lui sacrifient leurs fils, en étouffant leurs cris à force de caresses et de baisers, pour ne pas offrir au dieu une victime qui se lamente. C’était une coutume des habitants de la Tauride, près du Pont, et d’un roi d’Égypte nommé Busiris, d’immoler leurs hôtes. Les Gaulois sacrifient à Mercure des victimes humaines, ou inhumaines, si vous l’aimez mieux. Les Romains, dans certaines circonstances, enterrent tout vivants un homme et une femme de la nation gauloise, un homme et une femme grecs d’origine. Aujourd’hui encore, c’est par l’homicide que vous adorez Jupiter Latiaris, digne fils de Saturne, il s’engraisse du sang des criminels, des scélérats. Je croirais volontiers que c’est de ce dieu que Catilina apprit à faire un pacte de sang avec ses complices ; Bellone, à demander le sang des mortels en libation ; d’autres, à guérir de l’épilepsie avec le sang d’un homme, remède pire que le mal. Sont-ils moins impies que celui qui, dans l’arène, dévorerait la bête sauvage encore teinte du sang de nos semblables, ou bien engraissée de leurs membres et de leurs entrailles ? Pour nous, il ne nous est permis ni de voir le meurtre, ni d’en écouter le récit. Nous avons tant d’horreur de verser le sang humain que, dans nos aliments, nous nous abstenons même du sang des animaux qui nous servent de nourriture.</p><p>Et cette fable si rebattue de nos banquets incestueux est encore une invention de la ligue infernale, pour flétrir d’une pareille infamie la gloire de notre chasteté, et, par l’effroi de cette horrible idée, aliéner de nous les esprits, avant qu’ils aient pu connaître la vérité. Aussi votre Fronton ne le dit point comme un témoin qui affirme ce qu’il a vu, mais comme un auteur qui lance un sarcasme. Et d’où l’idée en est-elle venue, sinon des usages qui se trouvent encore parmi vous ? En Perse, on peut être le mari de sa mère ; en Égypte, chez les Athéniens, épouser sa sœur. On fait vanité de l’inceste dans vos histoires et dans vos tragédies, et vous mettez votre bonheur à les lire et à les écouter. Adorez-vous autre chose que des dieux incestueux qui se sont unis à leurs mères, à leurs filles, à leurs sœurs ? Voilà pourquoi l’inceste se trahit souvent chez vous et s’y commet toujours. Même sans le savoir, malheureux que vous êtes ! vous pouvez vous précipiter dans ce crime, puisque votre lubricité se jette sur toutes les femmes, puisque vous semez partout vos enfants, puisque vous abandonnez à la pitié publique ceux mêmes qui naissent dans vos mains. Est-il possible que vous ne rencontriez pas votre sang, que la méprise ne vous livre point à ceux qui vous doivent le jour ? C’est contre le témoignage même de votre conscience, que vous arrangez cette fable qui nous accuse d’inceste. Chez nous la pudeur est dans l’âme, et non pas seulement sur le visage. Nous demeurons volontiers dans les liens du mariage, mais nous n’en contractons qu’un seul, comme nous ne connaissons qu’une seule femme, dans l’unique désir d’avoir des enfants, autrement nous n’en connaissons aucune. Non seulement la pudeur, mais encore la sobriété préside à nos festins. Nous n’y savourons pas les mets avec délices, nous ne les prolongeons point par les charmes du vin. Chez nous, une grave modestie tempère la gaîté. Pudiques dans leurs paroles, et plus encore dans leurs mœurs, la plupart d’entre nous se glorifient d’une virginité inviolablement conservée. Nous sommes si éloignés de l’inceste, que plusieurs rougissent même des plaisirs légitimes d’une chaste union.</p><p>On ne doit point nous reléguer dans les derniers rangs du peuple, si nous ne voulons pas de votre pourpre et de vos dignités ; ni nous juger factieux, si nous ne cherchons que la vertu, si nous sommes aussi paisibles, réunis que séparés ; ni nous donner pour des parleurs sans fin dans le secret, si c’est vous qui avez honte ou qui craignez de nous écouter en public. Notre propagation toujours croissante n’est point une preuve d’erreur, mais un témoignage glorieux. Quand la vie est pure comme la nôtre, les amis restent et les autres arrivent. Ce n’est point, comme vous le pensez, à des marques extérieures, mais à l’innocence et à la modestie que nous nous reconnaissons ; un mutuel amour nous unit. Nous ne savons pas ce que c’est que la haine, et voilà ce qui vous irrite. Nous nous appelons frères, comme enfants d’un même père, comme partageant la même foi, comme héritiers d’une même espérance, et voilà ce qui excite votre envie. Car vous ne vous connaissez pas entre vous ; vous vous déchirez mutuellement, vous ne vous reconnaissez frères que pour le parricide.</p><p>XXXII. Pensez-vous que nous cachions l’objet de notre culte, parce que nous n’avons ni temples ni autels ? Sous quelle forme représenter Dieu, si l’homme lui-même, aux yeux de la raison, est son image ? Quel temple lui ériger, lorsque le monde qu’il a fait ne peut le contenir ? Enfermerai-je dans l’étroite enceinte d’un petit édifice la majesté d’un si grand Dieu, lorsque moi, simple mortel, je serais plus à l’aise hors de cette enceinte ? Ne vaut-il pas mieux lui dédier un temple dans notre esprit, lui consacrer un autel dans notre cœur ? Offrirai-je au souverain maître des victimes qu’il a destinées pour notre usage, lui renverrai-je ses propres dons ? Ne serait-ce pas une ingratitude ? Une âme droite, une conscience pure, une foi sincère, voilà les seules offrandes dignes de lui. Vivre dans l’innocence, c’est le prier ; pratiquer la justice, c’est lui faire des libations ; s’abstenir de l’injustice, c’est se concilier sa faveur. Tel est notre culte, tels sont nos sacrifices ; le plus juste parmi nous est le plus religieux. Nous ne pouvons, dites-vous, ni voir, ni montrer le dieu que nous adorons ; c’est par là même que nous le croyons Dieu, parce que, sans le voir, nous sentons qu’il existe.</p><p>Sa puissance, nous l’avons toujours sous les yeux, dans ses œuvres, dans les révolutions de la nature. La foudre, le tonnerre, l’éclair, la sérénité du ciel la manifestent. Les vents qui ébranlent, qui agitent, qui bouleversent tout, les voyez-vous ? Le soleil fait tout voir, voyez-vous quelque chose dans le soleil ? Il éblouit de ses rayons, il affaiblit la vue de celui qui le contemple ; le regardez-vous trop longtemps, il vous aveugle. Et vous pourriez soutenir l’éclat du Dieu, créateur de ce soleil, du Dieu, source de la lumière, vous qui vous dérobez à ses éclairs, vous qui fuyez devant sa foudre ? Vous prétendez le voir avec des yeux de chair, et vous ne pouvez voir ni toucher cette âme qui vous fait vivre et parler ?</p><p>Vous dites : mais ce Dieu ignore les actions des hommes ; relégué dans le ciel, peut-il nous suivre tous, peut-il nous connaître chacun en particulier ? Tu te trompes, ô homme ! ou l’on t’abuse. Comment Dieu serait-il loin de toi, puisque le ciel, la terre, tout ce qui existe hors de ce monde visible est rempli de sa présence ; il est en tous lieux. Nous l’avons non seulement près de nous, mais encore en nous-mêmes.</p><p>Regarde encore le soleil : attaché à la voûte céleste, il se répand sur toute la terre, tout y ressent également sa présence ; il est partout, il se mêle à tout, et rien n’altère la pureté de sa lumière. À plus forte raison Dieu, auteur de tous les êtres, les embrasse tous de ses regards, pénètre tous les secrets, voit dans les ténèbres et jusque dans nos pensées, autre région ténébreuse. Nous n’agissons pas seulement sous ses yeux, mais si j’ose le dire, nous vivons en lui et avec lui.</p><p>XXXIII. Ne nous flattons pas de former une grande multitude ; nous nous croyons innombrables et nous sommes bien peu devant Dieu. Nous faisons des divisions de peuples, de nations ; tout ce monde, aux yeux de Dieu, ne fait qu’une famille. Les rois, par leurs ministres, connaissent tout dans leurs états ; Dieu n’a pas besoin d’intermédiaire. Encore une fois, nous ne vivons pas seulement sous la majesté de ses regards, mais dans son sein. Vous dites encore : qu’est-il revenu au peuple juif d’avoir élevé à ce Dieu unique un temple, des autels, de l’avoir honoré par la pompe de son culte superstitieux ? Vous êtes dans une grande erreur à l’égard de ce peuple, si l’ignorance ou l’oubli des faits passés, ne vous laisse voir que ceux qui se sont accomplis de nos jours. Tant que les Juifs servirent avec un cœur chaste et religieux le Dieu que nous servons nous-mêmes (car c’est le Dieu de tous les peuples), tant qu’ils suivirent ses salutaires ordonnances, leur nombre, petit d’abord, s’est multiplié à l’infini. De pauvres, ils sont devenus riches ; d’esclaves, rois puissants ; faibles, sans armes, ils ont écrasé, sous les ordres de ce Dieu et à la faveur des éléments, les multitudes armées qui les poursuivaient dans leur fuite. Relisez leur histoire ou bien les auteurs romains, s’ils ont plus de charmes pour vous. Laissons-là les anciens, si vous le voulez, et apprenez de Flavius Josèphe et d’Antoninus Julianus ce qu’étaient les Juifs. Vous saurez que leur ruine vient de leur aveuglement, que tout ce qui leur est arrivé leur avait été prédit longtemps d’avance, s’ils persévéraient dans leur incrédulité. Vous comprendrez alors qu’ils ont abandonné Dieu avant que Dieu les abandonnât ; que ce Dieu n’a point subi avec eux le joug du vainqueur, comme vous le dites avec impiété, mais qu’il les a livrés à leurs ennemis comme des transfuges de sa loi.</p><p>XXXIV. À l’égard de l’embrâsement du monde, si vous ne croyez pas, ou si vous avez peine à croire qu’un feu soudain doive tomber du ciel, vous partagez l’erreur du simple vulgaire. Qui des philosophes doute ou ignore que tout ce qui naît finit, que tout ce qui commence meurt, que le ciel, avec tous les astres qui l’embellissent, par là-même qu’il a reçu l’être, doit le perdre un jour ? L’opinion constante des Stoïciens, n’est-elle pas que l’eau douce des fontaines ou celle de la mer est le principe de vie pour l’univers, qu’il cessera d’être par la violence du feu, qu’il doit s’embraser quand il aura perdu son humidité ? N’est-ce pas le sentiment des Épicuriens, sur la conflagration des éléments et la ruine du monde ?</p><p>Platon enseigne que les diverses parties qui le composent, subissent alternativement des inondations et des embrâsements, et après avoir dit que le monde est éternel, indissoluble, il ajoute que néanmoins le Dieu qui l’a fait peut seul le briser et l’anéantir. Est-il étonnant en effet, que ce vaste édifice puisse être détruit par celui qui l’a élevé ? Vous voyez donc que vos philosophes pensent comme nous. Nous n’avons pas suivi leurs traces, mais ils ont mêlé à leurs écrits quelqu’ombre de vérité, prise à nos divins prophètes qu’ils ont imités. C’est ainsi que vos sages les plus illustres, Pythagore le premier, mais Platon principalement, vous ont transmis, altéré et mutilé, le dogme de la résurrection. N’enseignent-ils pas qu’après la dissolution des corps, les âmes seules subsistent à jamais, qu’elles passent plusieurs fois dans de nouveaux corps. À cette erreur absurde, ils en ajoutent une autre qui vient encore affaiblir la vérité. Ils osent dire que l’âme humaine entre dans le corps de la brute, des bêtes, des oiseaux ; opinion plus digne d’un bouffon qui plaisante, que d’un philosophe qui médite.</p><p>Dans le dessein que nous nous proposons, il nous suffit de vous montrer vos sages d’accord, en quelque manière, avec nous sur le fond des choses. N’est-ce pas le comble de la folie, de la stupidité, d’oser dire que Dieu qui a fait l’homme ne peut le refaire ; que l’homme n’est rien après sa mort, comme il n’était rien avant sa naissance ; que, sorti du néant, il n’en peut sortir une seconde fois ? Est-il plus facile de donner l’être à ce qui ne l’a point, que de reproduire ce qui l’a reçu ? Pensez-vous que les objets s’anéantissent pour Dieu, parce qu’ils se dérobent à nos yeux débiles ? Tout corps se dessèche en poussière, ou se résout en eau, ou se réduit en cendres, ou s’évanouit en vapeurs. Il est soustrait à nos yeux, mais Dieu s’est réservé la garde des éléments qui le composent. Nous ne craignons pas, ainsi que vous le pensez, les outrages de la sépulture, mais nous préférons la coutume d’inhumer les corps, comme la plus ancienne et la meilleure.</p><p>Voyez-vous comme la nature entière, pour nous consoler, semble occupée de la résurrection future et en reproduit devant vous les images. Le soleil se couche et se lève ; les astres fuient et reviennent ; les fleurs meurent et renaissent, les arbres vieillissent et se couvrent de nouvelles feuilles ; les semences se corrompent pour revivre. Ainsi le corps dans le tombeau, comme l’arbre dans l’hiver, cache un principe de vie sous une apparence trompeuse de mort. Pourquoi ce désir empressé qu’il revive au fort de l’hiver ? Le corps a son printemps qu’il faut savoir attendre. Je sais que la plupart des hommes, sentant ce qu’ils méritent ont plutôt le désir que la certitude de n’être rien après leur mort ; ils aimeraient mieux être anéantis que de revivre pour le supplice. Leur illusion s’augmente et de leur extrême licence durant la vie et de la longue patience de Dieu qui les laisse impunis. Ils ne songent pas que ses jugements sont d’autant plus sévères qu’ils sont plus lents.</p><p>XXXV. Cependant vos savants dans leurs livres, vos poètes dans leurs vers, vous parlent d’un fleuve de feu, des replis multipliés du Styx aux flammes dévorantes, préparées pour servir à d’éternels supplices et connues par les révélations des démons ou par les oracles des prophètes. Car ils n’ont pas tiré d’une autre source les vérités qu’ils vous ont transmises. Voilà pourquoi, chez vos poètes, Jupiter jure avec un religieux respect par des rives brûlantes, par un gouffre ténébreux. Il presse les supplices qui l’attendent avec ses adorateurs et il frissonne ; supplice sans mesure comme sans bornes. Là un feu intelligent brûle les membres et les répare, il dévore et nourrit, il ressemble à celui de la foudre qui atteint et ne consume pas ; au Vésuve, à l’Étna, aux autres volcans qui s’embrasent et ne s’épuisent pas. Ce feu vengeur s’entretient, non de ce qu’il enlève à ceux qu’il dévore, mais des inextinguibles et déchirantes douleurs de ces malheureux. Que ceux qui ne connaissent pas Dieu méritent d’être punis comme des coupables, des impies, quel autre qu’un profane peut ici élever un doute, puisque ce n’est pas un moindre crime d’ignorer que d’offenser le père de tous les hommes, le maître de toutes choses. Sans parler de l’ignorance de Dieu qui suffit pour mériter le châtiment, comme sa connaissance sert pour obtenir le pardon, comparez les Chrétiens avec vous autres ; quand vous rencontrez parmi nous des hommes au-dessous de leurs principes, combien ne les trouvez-vous pas encore supérieurs à vous ? Vous défendez l’adultère et vous le commettez ; nous, nous ne naissons hommes que pour nos épouses. Chez vous le crime commis est le seul puni, chez nous la seule pensée de le commettre est déjà un crime ; vous craignez des témoins, nous ne craignons que notre conscience qui nous suit partout, enfin les prisons regorgent des vôtres, et là pas un seul Chrétien autre qu’un défenseur ou un transfuge du Christ.</p><p>XXXVI. Que personne ne cherche dans le destin ni consolation ni excuse ; faites, si vous voulez, de l’événement l’œuvre de la fortune ; l’esprit est toujours libre. Aussi dans l’homme est-ce la conduite et non la condition qui est jugée. Qu’est-ce que le destin, sinon l’arrêt que Dieu a prononcé sur chacun de nous ? Dieu prévoit l’avenir, dès lors il règle les destinées des hommes d’après les mérites et les qualités qu’il a prévus. Ainsi donc il punit, non la naissance, mais les dispositions. C’est assez sur le destin, trop peu peut-être pour la circonstance ; mais nous agiterons cette question une autre fois avec plus de développement et de clarté. On nous dit presque tous pauvres ; nous en faisons gloire, loin d’en rougir. L’abondance énerve, la privation fortifie. Est-il pauvre celui qui n’a besoin de rien, qui n’envie pas le bien d’autrui, qui a Dieu pour trésor ? Le vrai pauvre, c’est l’homme qui possédant beaucoup désire encore davantage. Je dirai tout ce que je pense : personne ne vit aussi pauvre qu’il est né ; les oiseaux trouvent leur nourriture sans avoir rien en propre ; chaque jour fournit à leur subsistance ; toutefois ils sont nés pour nous. Nous possédons tout, dès lorsque nous ne désirons rien. On marche d’un pas d’autant plus libre qu’on a moins de charge. Ainsi, dans le voyage de la vie, le plus à l’aise c’est l’homme dont la pauvreté allège le fardeau, et non celui qui gémit sous le poids des richesses ; si nous les jugions bonnes, nous les demanderions à Dieu ; il pourrait sans doute nous en accorder, puisque tout est à lui. Mais nous aimons mieux les mépriser que les posséder, nous désirons plutôt l’innocence du cœur ; nous demandons, avant tout, la patience ; nous voulons être vertueux plutôt que prodigues. Si nous passons par les maux de la vie, c’est pour nous l’occasion non d’une peine mais d’un combat ; la souffrance fortifie le courage, l’infortune est l’école de la vertu, la vigueur de l’esprit et du corps s’engourdit si elle n’est exercée par l’épreuve. Tous vos héros, que vous proposez comme autant de modèles, ont reçu de l’adversité leur lustre et leur éclat. Ne croyez pas que Dieu soit impuissant pour nous secourir ou qu’il nous dédaigne, puisqu’il est le maître de tout et qu’il aime les siens. Mais il explore, il visite chacun de nous par l’adversité, il éprouve le caractère par le péril, il interroge ainsi notre cœur jusqu’au dernier soupir, sûr comme il l’est que rien ne peut lui échapper. La tribulation est pour nous ce que le feu est pour l’or ; elle nous fait connaître.</p><p>XXXVII. Quel beau spectacle pour la Divinité que la vie d’un Chrétien qui se mesure avec la douleur, qui tient ferme devant les menaces, devant les supplices, devant les tortures ; qui se rit de l’appareil bruyant du trépas et lui insulte ; qui lève hardiment l’étendard de sa liberté contre les rois et les empereurs ; qui ne cède qu’à Dieu dont il relève ; qui, triomphant et victorieux, brave le tyran dont l’arrêt l’envoie à la mort ; oui, c’est lui le vainqueur, puisqu’il a conquis ce qu’il désire. Quel soldat ne défie pas hardiment le péril sous les yeux de son général ? car personne n’est couronné avant l’épreuve. Et cependant ce général ne peut donner ce qu’il n’a pas ; il peut honorer la vaillance, il ne saurait prolonger la vie. Le soldat de Dieu n’est ni délaissé dans le combat, ni éteint dans la mort. Ainsi donc nous pouvons paraître malheureux, nous ne pouvons l’être en effet. Vous-même n’élevez-vous pas jusqu’au ciel les héros du malheur ; par exemple un Mucius Scévola, qui aurait succombé au milieu des ennemis s’il n’eût puni lui-même sa main, pour s’être égarée en préparant la mort d’un tyran ? Combien des nôtres ont enduré, sans pousser la moindre plainte, le supplice du feu qui consumait, je ne dis pas une de leurs mains, mais tout leur corps, lorsqu’il était en leur pouvoir d’échapper au bourreau ? Que fais-je ? Je compare ces hommes avec Mucius, avec Aquilius, avec Régulus ; mais chez nous de tendres enfants, de faibles femmes, se jouent des croix, des tourments, des bêtes féroces, de toutes les horreurs des supplices, avec une patience qui ne peut venir que du ciel. Vous ne comprenez pas, insensés ! que personne ne veut souffrir de telles douleurs sans raison, ou ne peut endurer de pareilles tortures sans un secours divin. Peut-être que la vue de tant d’hommes plongés dans l’ignorance de Dieu, et qui, cependant, nagent au sein de l’opulence, ou brillent de l’éclat des honneurs, ou jouissent d’un pouvoir sans bornes, vous impose ? Quelle est votre erreur ! ils ne sont parvenus à cette grande élévation que pour tomber de plus haut ; vous voyez-là des victimes qu’on engraisse pour l’autel, qu’on pare de fleurs pour le sacrifice. Ils semblent élevés au faîte des grandeurs et de la puissance, pour trafiquer plus librement du pouvoir et tout sacrifier à des passions d’une licence effrénée dans leurs caprices. Mais sans la connaissance de Dieu, quel solide bonheur peut exister, puisque la mort est toujours là ? Semblable à un songe, cette ombre de félicité s’évanouit avant qu’on ait pu la saisir. Êtes-vous roi ? vous redoutez autant que vous êtes craint ; quelque nombreuse que soit la garde qui veille à vos côtés, dans les revers vous êtes seul. Êtes-vous riche ? il est dangereux de se fier à la fortune, tant de provisions pour le court trajet de la vie sont moins un secours qu’un embarras. Vous êtes fier de votre pourpre et de vos faisceaux ? C’est une vaine erreur de l’homme, une trompeuse illusion, de ne briller que par la pourpre, et d’être vil par le cœur. Vous vous glorifiez de votre naissance, vous vantez vos aïeux ? Mais nous naissons tous égaux, la vertu seule fait les différences. Nous qui ne sommes rien que par l’innocence de notre vie et de nos mœurs, c’est à bon droit que nous fuyons vos plaisirs, vos pompes, vos spectacles ; nous en connaissons l’origine, elle découle de vos sacrifices, nous en proscrivons les perfides attraits. Qui n’a point horreur, dans vos jeux curules, de la démence d’un peuple furieux qui se déchire ; dans vos combats de gladiateurs, des leçons d’homicide publiquement données ? vos théâtres offrent-ils aux regards moins de fureur, moins de turpitude ? n’est-ce pas là qu’elle est portée à son comble ? Tantôt l’acteur peint l’adultère ou le met sous les yeux ; tantôt un histrion lascif fait passer dans le cœur les honteux amours qu’il représente ; il déshonore vos dieux en leur prêtant de langoureux soupirs, des haines, des infamies, ou bien il provoque vos larmes par l’hypocrisie de sa douleur, par l’imposture de son geste et de son visage ; ainsi donc vous voulez l’homicide en réalité sur l’arène, et vous en allez pleurer le mensonge au théâtre.</p><p>XXXVIII. Le mépris que nous montrons pour les restes de vos sacrifices et pour le vin répandu sur vos autels, ne décèle point en nous la crainte ; il manifeste une noble indépendance. Nous savons bien que rien ne corrompt les productions de la nature, car les présents de la divinité sont inaltérables : toutefois nous ne touchons à aucune de vos offrandes, parce que nous ne voulons pas qu’on puisse supposer que nous rougissons de notre Dieu et que nous avons des intelligences avec les démons auxquels vous sacrifiez. Qui nous croirait insensibles aux charmes des fleurs que le printemps fait éclore, quand on nous voit cueillir la rose, le lys, et toutes les autres fleurs d’un vif éclat ou d’un doux parfum ; nous usons de ces fleurs semées çà et là en les prenant isolées pour en respirer l’odeur, ou bien en les entrelaçant pour les placer devant nous ; mais si nous n’en couronnons pas nos fronts, veuillez nous le pardonner, nous avons coutume de respirer une fleur par l’odorat et non par l’extrémité de la tête ou par les cheveux. Nous ne déposons pas de couronnes sur les tombeaux, n’en soyez pas surpris ; c’est à plus juste titre que nous pourrions nous étonner de vos usages à l’égard des morts. S’il leur reste du sentiment, pourquoi les brûler ? S’ils n’en ont plus, à quoi bon des fleurs ? Heureux, ils n’en ont pas besoin ; malheureux, ils n’en jouiront pas. Nos obsèques sont aussi simples que notre vie, nous n’entourons pas la tombe de couronnes qui se flétrissent ; nous attendons de Dieu même une couronne de fleurs éternelles, dont rien ne peut ternir l’éclat. Modestes et nous reposant sans inquiétude au sein de sa libéralité, nous vivifions l’espérance du bonheur qu’il nous promet dans une autre vie, par la foi en sa majesté divine, toujours attentive aux besoins d’ici bas. Ainsi donc, nous ressuscitons pour le bonheur, et, dès cette vie, nous vivons heureux par la contemplation de cet avenir.</p><p>Que Socrate, ce bouffon d’Athènes, professe hautement ne rien savoir, et se glorifie d’avoir pour lui le suffrage du plus imposteur des démons ; qu’Arcésilas, et Carnéades, et Pyrrhon, et toute la secte académique flottent encore dans le doute ; que Simonide éternise ses délais ; que me fait tout cet orgueil de vos philosophes ? je la méprise. Pour eux, que sont-ils autre chose que des corrupteurs, des adultères, des tyrans et toujours d’éloquents parleurs contre les vices qui les souillent ? Nous n’affichons pas la sagesse sur nos fronts, nous la portons dans nos cœurs. Nous ne disons pas de grandes choses, nous laissons parler notre vie ; nous nous glorifions d’avoir trouvé ce que ces philosophes ont vainement cherché avec tant d’efforts. Pourquoi donc nous montrer ingrats ? Que pouvons-nous désirer de plus, si la connaissance du vrai Dieu était un fruit mûr pour nos jours ? jouissons de notre bonheur, réglons notre vie sur la sagesse ; que la superstition soit réprimée, l’impiété confondue, que la vraie religion triomphe.</p><p>XXXIX. Quand Octave eut fini de parler, nous restâmes quelque temps dans l’étonnement et dans le silence, les yeux attachés sur lui. J’admirais avec transport comme il avait su fortifier de preuves, d’exemples, d’autorités, certaines choses qu’on sent mieux qu’on ne pourrait les exprimer, terrasser les méchants avec leurs propres armes, c’est-à-dire avec celles des philosophes, et montrer que la découverte de la vérité est aussi facile qu’elle est consolante.</p><p>XL. Tandis que, silencieux, je repassais en moi-même ce que je venais d’entendre, Cécilius s’écria : « Je félicite de tout mon cœur notre cher Octave, mais je me félicite surtout moi-même ; aussi je n’attends pas la décision du juge. Nous triomphons tous deux, j’ai droit de le dire pour ma part ; car s’il m’a vaincu, j’ai vaincu l’erreur. Pour le fond de la question, j’admets une Providence, je me rends au vrai Dieu, je reconnais avec vous la vérité de votre religion, qui est désormais la mienne. Il reste bien encore quelques difficultés, mais elles ne contredisent pas le fond des choses, elles n’exigent qu’un plus ample développement pour compléter mon instruction. Comme le jour baisse, c’est demain que je veux m’en expliquer avec vous, comme sur tout le reste, avec plus de loisir et de liberté. »</p><p>XLI. « Et moi, m’écriai-je à mon tour, dans ce triomphe de tous les nôtres, je m’applaudis plus que personne ; mon ami triomphe pour moi en particulier, puisqu’il m’épargne l’odieuse nécessité de porter un jugement. Toutefois mes éloges ne pourraient égaler son mérite. Le témoignage d’un homme, et d’un seul homme, est trop peu de chose. Sa plus belle récompense lui vient de Dieu qui parlait par sa bouche, et dont le secours l’a fait vaincre. »</p><p>Nous nous retirâmes ensuite, heureux et pleins de joie, Cécilius d’avoir cru, Octave d’avoir vaincu, et moi de la conversion de l’un et de la victoire de l’autre.</p>
