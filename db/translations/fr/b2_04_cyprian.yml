      <p>Traduction : Antoine-Eugène Genoude, <i>Les Pères de l’Église</i>, t. 5 bis, Adrien Le Clère et Sapia, 1842, p. 440-447.  Texte copié depuis <a href="https://fr.wikisource.org/wiki/Les_P%C3%A8res_de_l%E2%80%99%C3%89glise/Tome_5_bis/De_la_Vanit%C3%A9_des_idoles_%28saint_Cyprien%29">Wikisource</a>.</p>
