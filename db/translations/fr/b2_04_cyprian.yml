    body: |-
      <p>Le Seigneur a dit : « Vous êtes le sel de la terre. » Il a recommandé à l’innocence d’être simple de cœur, et à la simplicité d’être prudente. De là, pour nous, frères bien-aimés, l’impérieuse obligation de veiller soigneusement pour découvrir les piéges d’un ennemi fécond en stratagèmes, et nous prémunir contre ses artifices, de peur qu’après avoir revêtu Jésus-Christ, la sagesse du Père, nous paraissions peu attentifs à conserver nos immortelles espérances. Le danger ne vient pas seulement de la persécution et de la violence, qui marchent le front levé et au grand jour, pour abattre les serviteurs de Dieu. Il est plus facile de se tenir sur ses gardes quand le péril est connu, et, devant un adversaire qui se montre, le courage est préparé au combat. Ce qu’il faut redouter avant tout, c’est l’ennemi qui, à l’ombre d’une paix trompeuse, se glisse furtivement par de secrets détours, d’où lui est venu le nom de serpent. Telle est toujours sa marche oblique et tortueuse ; telles sont les ténèbres dont il s’enveloppe habilement pour surprendre l’homme. Ainsi, dès le berceau du monde, il séduisit par de flatteuses paroles des âmes novices et trop crédules. Mais que dis-je ! n’osa-t-il pas essayer le pouvoir de ses ruses sur le Sauveur lui-même, et, en s’offrant à ses regards sous une trompeuse apparence, se promettre une seconde victoire ? Mais il fut bientôt découvert et terrassé ; terrassé, parce qu’il fut découvert. Mémorable enseignement, qui nous apprend à éviter les sentiers du vieil homme pour marcher sur les traces du Seigneur, afin qu’au lieu de nous jeter par une fatale imprévoyance dans les filets de la mort, nous entrions en possession de l’immortalité, en nous armant contre le péril. Or, à quel prix pouvons-nous conquérir l’immortalité, sinon en observant les commandements divins qui triomphent de la mort, puisque Jésus-Christ lui-même a dit : « Si vous voulez entrer dans la vie, gardez les commandements ? » Et ailleurs : « Si vous faites ce que je vous commande, je ne vous appellerai plus désormais du nom de serviteurs, mais d’amis. » Ceux-là seuls, il le déclare, demeurent inébranlables sur la pierre où il les a établis ; ceux-là seuls bravent les tempêtes et résistent à tous les tourbillons du siècle. « Quiconque écoute et accomplit mes paroles, dit-il, ressemble à l’homme qui a bâti sa maison sur la pierre. La pluie est descendue, les fleuves sont venus, les vents ont soufflé et se sont précipités sur cette maison, et elle n’est point tombée, parce qu’elle était fondée sur la pierre. » Soyons donc fidèles aux préceptes sacrés ; ce qu’a enseigné le Christ, accomplissons-le. Se dira-t-il Chrétien, l’homme rebelle à ses commandements ? Parviendra-t-il aux récompenses de la foi, l’homme qui ne veut pas demeurer fidèle aux divines ordonnances ? Il se condamne ainsi à chanceler incessamment et à tourbillonner comme une vaine poussière, emporté çà et là par le vent du mensonge. Supposez même qu’il marche, il n’arrivera jamais au port du salut, puisqu’il ne suit pas le chemin de la vérité.</p><p>Nous avons dit, mes bien-aimés, qu’il fallait redouter non-seulement la violence et l’attaque ouvertes, mais surtout les fraudes et les stratagèmes d’un ennemi artificieux. En effet, vous allez reconnaître l’habileté de ses manœuvres. Terrassé à l’avénement du Rédempteur, alors que la lumière du salut éclaira les nations et vint réchauffer la terre ; furieux de voir les sourds ouvrir l’oreille à la voix de la grâce, les aveugles tourner vers Dieu des regards dessillés, les infirmes se renouveler dans une immortelle vigueur, le boiteux courir à l’Église, le muet trouver une langue pour prier ; le père du mensonge, seul dans ses temples déserts et parmi ses idoles abandonnées, parce que le nombre des Chrétiens s’accroissait de jour en jour, imagina de nouvelles ruses. Il se déguisa sous le nom chrétien lui-même, pour mieux tromper. Il inventa les schismes et les hérésies, afin de renverser la foi, d’altérer la vérité, et de déchirer l’unité. Il circonvient et conduit à travers des illusions nouvelles ceux qu’il n’a pu retenir dans l’aveuglement de leur antique ignorance. C’est au sein de l’Église même qu’il choisit ses victimes. Les infortunés ! ils se croyaient échappés à la nuit du siècle, et près d’atteindre à la lumière. Mais l’ennemi épaissit autour d’eux d’autres ténèbres, sans qu’ils le sachent, si bien que, tout en rompant avec Jésus-Christ, tout en divorçant avec l’Évangile, ils continuent de s’appeler Chrétiens, et qu’en marchant dans les ténèbres, ils s’imaginent avoir la lumière. Ce n’est pas tout : l’ange des ténèbres se transforme encore, suivant l’apôtre, en ange de lumière. Il dispose ses ministres comme autant de ministres de la justice. Puis, les voilà donnant à la nuit le nom du jour, à la mort le nom de la vie, au désespoir le nom de l’espérance, à la perfidie le nom de la foi, à l’antechrist le nom de Jésus-Christ, afin de mieux ruiner la vérité par des inventions qui en ont l’apparence.</p><p>Quelle est la cause de ce mal, mes frères bien-aimés ? C’est qu’on ne remonte point à la source de la vérité ; c’est que l’on se détache du chef ; c’est que l’on ne garde point la doctrine du divin législateur. Si l’on veut s’arrêter à ces principes, il ne faut ni longue discussion, ni beaucoup de preuves. Il est facile de reconnaître où est la foi ; il suffit d’interroger brièvement la vérité.</p><p>Le Seigneur dit à Pierre : « Tu es pierre, et sur cette pierre je bâtirai mon Église ; et les portes de l’enfer ne prévaudront pas contre elle. Je te donnerai les clés du royaume des cieux. Ce que tu lieras sur la terre sera lié au ciel, ce que tu délieras sur la terre sera délié dans le ciel. » — « Pais mes brebis, dit-il encore au même apôtre après sa résurrection. » C’est sur un seul qu’il bâtit son Église ; à un seul qu’il confie le soin de paître ses brebis. Il est bien vrai qu’après sa résurrection il confère à tous ses apôtres une égale puissance. « Comme mon Père m’a envoyé, moi, je vous envoie ; recevez le Saint-Esprit. Ceux à qui vous remettrez les péchés, ils leur seront remis ; ceux à qui vous les retiendrez, ils leur seront retenus. » Toutefois, pour nous manifester le mystère de l’unité, il voulut, par son autorité divine, que l’origine de cette même unité commençât par un seul. Sans doute les autres apôtres étaient ce que fut Pierre, ses égaux en honneur, élevés à la même puissance ; mais l’unité est le point de départ, et la primauté est donnée à Pierre, pour montrer qu’il n’y a qu’une Église de Jésus-Christ et qu’une seule chaire. Tous sont pasteurs, mais il n’y a qu’un seul et même troupeau, que tous les apôtres doivent gouverner en commun, pour attester encore que l’Église de Jésus-Christ est une. Le Saint-Esprit, parlant au nom du Seigneur dans le Cantique des Cantiques, préludait ainsi à ce mystère : « Ma colombe est unique, elle est parfaite, il n’y a qu’elle pour sa mère ; elle est le choix de celle qui l’a engendrée. » Quoi donc ! celui qui ne garde pas l’unité de l’Église croit-il garder encore la foi ? Celui qui résiste à l’Église, qui se révolte contre elle, qui abandonne la chaire de Pierre, sur qui est fondée l’Église, s’imagine-t-il encore être dans l’Église, surtout quand le bienheureux apôtre Paul nous apprend en ces mots quelle est la nature du sacrement de l’unité : « Vous n’êtes qu’un corps et qu’un esprit, comme vous avez été tous appelés à une même espérance ? Il n’y a qu’un Seigneur, qu’une foi, qu’un baptême, qu’un Dieu. » Nous devons donc maintenir et garder invariablement cette unité, nous surtout évêques, qui sommes placés à la tête de l’Église, afin de constater que l’épiscopat est également un et indivisible. Que personne ne trompe ses frères par le mensonge ; que personne ne corrompe la vérité de la foi par une prévarication perfide. Il n’y a qu’un seul épiscopat dont chaque évêque possède solidairement une partie ; il n’y a de même qu’une seule Église, quoique, par les accroissements de sa glorieuse fécondité, elle se répande dans une infinité de membres. Regardez ! le soleil envoie beaucoup de rayons, mais il n’y a qu’un foyer de lumière ; l’arbre se divise en beaucoup de rameaux, mais il n’y a qu’un tronc, appuyé sur une racine vigoureuse ; la source distribue au loin ses eaux, mais, quelle qu’en soit l’abondance, chacun de ces ruisseaux part d’une source commune. Séparez le rayon du soleil du foyer qui l’envoie, l’unité de la lumière ne souffre pas de partage ; détachez le rameau de l’arbre qui le nourrit, le fruit ne pourra plus germer ; retranchez un ruisseau de la source qui l’alimente, il tarit aussitôt. Il en va de même de l’Église du Seigneur. Soleil universel, elle épanche ses rayons jusqu’aux extrémités du monde ; mais c’est toujours une seule lumière qu’elle envoie, sans que l’unité du corps soit divisée. Arbre majestueux, elle étend l’immensité de ses rameaux sur toute la terre ; vaste fleuve, elle arrose toutes les contrées par la richesse de ses eaux. Mais partout un même principe, partout une même origine, partout une même mère, riche des trésors de sa fécondité. C’est son sein qui nous a portés, c’est son lait qui nous a nourris ; c’est son esprit qui nous anime. L’épouse du Christ repousse toute alliance adultère, sa pudeur est incorruptible ; elle ne connaît qu’une maison ; elle garde avec un soin religieux la sainteté de la couche nuptiale ; elle nous conserve à Dieu, et destine au trône les enfants qu’elle a engendrés. Se séparer de l’Église, c’est abjurer sa part aux royales promesses ; c’est se prostituer indignement à la femme adultère. Non, il n’arrivera jamais aux récompenses éternelles de Jésus-Christ, le Chrétien qui abandonne l’Église de Jésus-Christ ; c’est un étranger, un profane, un ennemi ; il ne peut avoir Dieu pour père, puisqu’il n’a point l’Église pour mère. Si un seul homme a pu être sauvé autrefois hors de l’arche, le salut est aussi hors de l’Église. « Qui n’est pas avec moi, dit le Seigneur, est contre moi. Qui n’amasse pas avec moi, dissipe. » Vous l’entendez ! En rompant avec Jésus-Christ, on s’élève contre lui ; on dissipe l’Église du Seigneur, dès-lors que l’on moissonne hors de l’Église. Le Sauveur dit encore : « Mon Père et moi, nous ne sommes qu’un. » Ailleurs, il est écrit du Père, du Fils et du Saint-Esprit : « Ces trois ne sont qu’un. » Et l’on s’imaginerait après cela que cette divine unité, fondée sur la parole infaillible de Dieu et cimentée par les sacrements, pût être rompue dans l’Église et aller se perdre dans la lutte ou le divorce des volontés ! Non ; qui ne garde pas inviolablement l’unité, ne garde pas davantage la loi, ne garde pas la foi du Père, ne garde pas la foi du Fils, ne garde ni la vie, ni le salut. Ce sacrement de l’unité, ce lien indissoluble de la concorde universelle, nous est représenté dans l’Évangile par cette tunique de Jésus-Christ notre Seigneur, dont les bourreaux respectent l’intégrité, et qu’ils jettent au sort, afin qu’elle arrive à son nouveau maître sans avoir été partagée. « Ils prirent sa tunique, dit la divine Écriture, et comme elle était sans couture et d’un seul tissu depuis le haut jusqu’en bas, ils se dirent entre eux : Ne la déchirons point ; tirons-la au sort, et voyons à qui elle appartiendra. » Vêtement mystérieux ! Il figurait cette glorieuse unité qui descend d’en haut, c’est-à-dire qui vient du ciel et du Père, et qui, indivisible à son origine, devait subsister indivisible dans les mains qui l’avaient reçue. Ainsi, quiconque déchire l’Église de Jésus-Christ ne saurait posséder la tunique de Jésus-Christ. Voyez au contraire un symbole différent. Salomon va descendre dans la tombe ; une grande scission s’opère dans le peuple et dans le royaume. Que fait Achias ? Il n’a pas plus tôt rencontré dans la plaine le roi Jéroboam, qu’il déchire ses vêtements en douze parts. « Prends, dit-il au roi, dix de ces morceaux, le Seigneur l’ordonne ; voilà que le royaume partagé échappe aux mains de Salomon. Tu auras dix sceptres ; à lui il n’en restera que deux, en considération de David mon serviteur, et de Jérusalem, que j’ai choisie pour y établir mon nom. » Lorsque les douze tribus d’Israël se séparent, le prophète Achias déchire son vêtement. Mais, parce que le peuple de Jésus-Christ ne saurait être divisé, la tunique du Sauveur, qui était d’un seul morceau et sans couture, n’est point divisée par les soldats qui s’en emparent. Une, entière, indivisible, elle figure l’indissoluble union du peuple qui a revêtu Jésus-Christ. Le sacrement de l’unité de l’Église était représenté par le symbole visible de cette tunique.</p><p>Où est l’homme assez enhardi dans la scélératesse et le parjure, assez aveuglé par la démence, pour s’imaginer que l’on peut déchirer, ou pour déchirer lui-même l’unité de Dieu, le vêtement du Seigneur, l’Église de Jésus-Christ ? Il nous l’apprend lui-même dans l’Évangile : « Il n’y aura qu’un pasteur et qu’un troupeau. » Et l’on croit, après cet oracle, qu’une même enceinte puisse renfermer à la fois plusieurs troupeaux et plusieurs pasteurs ! Écoutons en quels termes pressants l’apôtre Paul nous recommande cette unité : « Je vous conjure, mes frères, au nom de Jésus-Christ notre Seigneur, d’avoir tous un même langage et de ne point souffrir de divisions parmi vous, mais d’être unis tous ensemble par un même esprit et dans les mêmes sentiments. » Et ailleurs : « Ayant soin de conserver l’unité d’un même esprit par le lien de la paix. » Et vous, pensez-vous être debout et vivant encore, lorsque vous abandonnez l’Église pour vous bâtir ailleurs un autre domicile, lorsqu’il est dit à Rahab, antique figure de l’Église : « Tu rassembleras dans ta maison ton père, et ta mère, et tes frères, et toute ta parenté ? Quiconque franchira le seuil de ta maison, son sang sera sur sa tête. » Même symbole dans l’Exode. La chair de l’agneau pascal, dont l’immolation préludait à l’immolation du Christ, devait être mangée en commun dans une même maison. Le Seigneur parle ainsi : « Il sera mangé dans une maison, et vous ne porterez point sa chair au-dehors. » La chair de Jésus-Christ, le saint du Seigneur, ne peut donc être portée au-dehors : point d’autre maison que l’Église pour les enfants de la foi. C’est bien là le sanctuaire de la paix et de la bonne intelligence, que l’Esprit saint désignait ainsi dans les Psaumes : « Dieu rassemble dans la même enceinte les frères qu’unit un même cœur et un même esprit. » Voilà pourquoi l’Esprit saint a choisi, pour nous apparaître, la forme d’une colombe, doux et pacifique animal, sans fiel, sans amertume ; point de dents pour mordre, point de serres pour déchirer. Il se plaît parmi les demeures des hommes ; il ne connaît, n’affectionne qu’un nid. Lorsqu’ils engendrent, ils élèvent en commun leurs petits ; en voyage, ils volent affectueusement aile contre aile ; leur vie qui s’écoule sous le même toit, et leurs pudiques caresses, témoignent d’une concorde et d’une harmonie inviolables. La tendresse des colombes, la douceur des agneaux et des brebis, telle est l’image que doit nous présenter l’Église. Que fait, dans une âme chrétienne, la fureur des loups, la rage des animaux immondes, le poison des serpents ? Félicitons l’Église, quand elle perd ces membres impurs ou dangereux, dont la contagion funeste eût infecté les colombes et les brebis de Jésus-Christ. L’amertume n’a rien de commun avec la douceur, l’ombre avec la lumière, la guerre avec la paix, la stérilité avec la fécondité, la sécheresse avec la source d’eau vive, la tempête avec le calme. Pourquoi associer des éléments qui se repoussent ? Mais la vertu, ah ! jamais elle ne peut se détacher de l’Église. Le vent enlève-t-il le froment dans l’aire du laboureur ? L’arbre robuste est-il renversé par la tempête ? Non, il n’y a qu’une paille légère qui se laisse emporter par le vent ; que l’arbre sans racines, qui tombe sous l’effort de l’orage. L’apôtre censure et maudit d’avance ces esprits inquiets et mobiles. « Ils sont sortis du milieu de nous, dit-il ; mais ils n’étaient pas de nous ; car, s’ils eussent été de nous, ils seraient demeurés avec nous. » Et voilà quelle est la cause des hérésies qui se sont élevées et qui s’élèvent encore ! Des esprits corrompus ne veulent point garder la paix. Le parjure, ami de la discorde, se révolte contre l’unité. Dieu permet ces scandales pour ne pas enchaîner la liberté de l’homme, afin que, dans ces épreuves où la vérité interroge nos cœurs et nos esprits, l’intégrité de notre foi brille de toute sa lumière. L’Esprit saint nous le déclare d’avance par la bouche de l’apôtre : « Il faut qu’il y ait des hérésies, afin que l’on reconnaisse ceux d’entre vous qui sont d’une vertu éprouvée. » Oui, c’est par elles que la fidélité est reconnue, par elles que le parjure est démasqué. C’est par elles que même ici-bas les âmes des justes sont séparées d’avec celles des impies, et le froment d’avec la paille stérile.</p><p>Ainsi advient-il de ces docteurs sans autorité, qui, se constituant pasteurs de je ne sais quelle vaine et téméraire agrégation, usurpent le titre d’évêque, quoique personne ne leur ait conféré la consécration pontificale. Le roi-prophète nous les montre assis dans la chaire empestée, apôtres du mensonge, fléaux de la foi, serpents artificieux, dont le souffle empoisonné corrompt et gagne de proche en proche comme la contagion. Leur présence donne la mort. Écoutez en quels termes le Seigneur les menace et rappelle son peuple qui s’égarait sur leurs pas : « N’écoutez pas les paroles des faux prophètes, parce que les visions de leur cœur les trompent. Ils parlent, mais non par la bouche du Seigneur. Ils disent à ceux qui rejettent la loi de Dieu : La paix sera sur vous et à tous ceux qui marchent dans la perversité de leur cœur : le mal ne viendra pas sur vous. Je ne leur ai point parlé, et ils ont prophétisé. S’ils eussent assisté à mon conseil, s’ils eussent entendu ma parole, ils l’auraient enseignée à mon peuple, et ils l’auraient détourné de ses voies perverses. » C’est encore eux que le Seigneur désigne par ces mots : « Ils m’ont abandonné, moi, la source d’eau vive, pour se creuser des citernes sans fond et incapables de garder l’eau. » Il ne peut y avoir qu’un baptême, et ils se croient en droit de l’administrer ! Ils ont abandonné la fontaine qui jaillit pour la vie éternelle, et ils promettent la grâce qui régénère ! Qu’ils ne s’y trompent pas ! leurs eaux souillent au lieu de purifier ; elles impriment une lèpre nouvelle, au lieu de guérir la première. Cette naissance illégitime donne des enfants au démon, et non à Dieu. Fils du mensonge, comment arriveront-ils aux promesses ? Engendrés par l’apostasie, perdus pour la foi, où trouveront-ils la paix, quand, aveuglés par une fureur séditieuse, ils ont rompu la paix du Seigneur ?</p><p>Et parce que le Seigneur a dit : « Partout où deux ou trois se réuniront en mon nom, je serai avec eux, » qu’ils ne cherchent pas à se tromper eux-mêmes par une interprétation mensongère. Mutilant adroitement le texte sacré, ils gardent une partie de l’oracle, et suppriment l’autre ; ils attentent à l’intégrité de l’Évangile, après avoir attenté à celle de l’Église. Le Sauveur, en effet, pour recommander à ses disciples la paix et l’unité, leur dit : « Je vous le dis de nouveau : Si deux d’entre vous s’unissent sur la terre, quelque chose qu’ils demandent, ils l’obtiendront de mon Père qui est aux cieux ; car partout où deux ou trois personnes seront assemblées en mon nom, là je suis au milieu d’elles ; » nous montrant par là que l’abondance des grâces est attachée, moins au nombre des suppliants, qu’à l’unanimité des prières. Mais, en disant : « Si deux d’entre vous s’unissent sur la terre, » le Seigneur commence par l’unanimité de pensées et de sentiments qui doit régner inviolablement parmi nous. Or, où est le moyen de s’entendre, quand il y a divorce avec l’assemblée des fidèles et scission avec l’Église tout entière ? Comment deux ou trois se réuniront-ils au nom de Jésus-Christ, quand ils ont rompu avec Jésus-Christ et son Évangile ? Car ce n’est pas nous qui les avons quittés ; eux seuls se sont retirés d’avec nous ; eux seuls, formant loin de nous de secrets conventicules, ont abandonné la source de la vérité, et ont introduit le schisme et l’hérésie. Jésus-Christ donc n’a entendu s’adresser qu’aux membres de son Église, quand il a dit que si, fidèles à ses instructions, ses disciples, ne fussent-ils que deux ou trois, s’assemblaient en son nom pour l’invoquer dans l’unité du cœur et de la prière, la majesté divine souscrirait à leurs demandes.</p><p>« Partout où seront deux ou trois personnes assemblées en mon nom, là je suis au milieu d’elles. » Oui, sans doute, au milieu de celles qui sont simples de cœur, amies de la paix, remplies de la crainte de Dieu et fidèles à ses commandements. Il se trouvera au milieu de ces deux ou trois personnes, dit-il, comme autrefois il fut avec les trois jeunes hommes enfermés dans la fournaise, qu’il rafraîchit par le vent de sa rosée bienfaisante, au milieu des flammes qui les environnaient, parce qu’ils étaient simples de cœur, et persévéraient dans l’union des sentiments ; comme il fut encore avec les deux apôtres enfermés dans la prison, dont il leur ouvrit les portes, pour les envoyer de nouveau, sur les places publiques, annoncer à la multitude la parole qu’ils avaient prêchée avec tant de fidélité. Ainsi, quand il écrit dans ses préceptes : « Partout où seront deux ou trois personnes assemblées en mon nom, là je suis au milieu d’elles, » le fondateur de l’Église n’a pas prétendu arracher les hommes à son Église. Que voulait-il donc ? Reprocher aux parjures leur discorde, recommander aux fidèles la paix par l’autorité de ses déclarations, et nous apprendre qu’il se trouvait plutôt avec deux ou trois personnes animées par le même sentiment, qu’avec un grand nombre d’hommes dont le cœur est désuni ; et qu’enfin la prière de quelques personnes, confondues dans une même foi, a plus de pouvoir sur lui que celle d’une multitude où ne règne pas l’unanimité. Voilà pourquoi, lorsqu’il impose à la prière ses règles, il ajoute : « Quand vous irez pour prier, pardonnez si vous avez quelque chose contre quelqu’un, afin que votre Père qui est dans les cieux vous remette vos fautes. » Ailleurs il écarte de l’autel celui qui s’en approche avec la haine dans le cœur ; il lui ordonne d’aller se réconcilier d’abord avec son frère, puis de revenir présenter à Dieu son offrande avec un esprit de paix, parce que Dieu détourna sa face des sacrifices de Caïn. Pouvait-il se flatter d’apaiser le Seigneur, ce frère jaloux, armé contre son frère ? Quelle paix se promettent donc ces ennemis de l’Église ? Quels mystères s’imaginent-ils célébrer avec leur fantôme de sacerdoce ? Croient-ils que Jésus-Christ descende au milieu d’eux quand ils se rassemblent hors de l’Église ? Qu’ils expirent, s’ils le veulent, dans les tortures de la persécution, et en confessant le nom de Jésus-Christ, la souillure de leur apostasie, s’ils persévèrent dans ce crime, ne sera point lavée par l’effusion de leur sang. Hors de l’Église, point de véritable martyr. On ne peut être appelé à régner là-haut, quand on abandonne celle qui est destinée à régner. Dieu nous a donné la paix ; il nous a fait un devoir de l’union et de la charité fraternelles. Quiconque brise les liens de la charité fraternelle n’a plus droit à la couronne des martyrs. Ainsi le déclare l’apôtre : « Quand j’aurais toute la foi possible, jusqu’à transporter les montagnes, si je n’ai point la charité, je ne suis rien. Et quand je distribuerais toutes mes richesses pour nourrir les pauvres, et que je livrerais mon corps pour être brûlé, si je n’ai point la charité, tout cela ne me sert de rien. La charité est patiente, elle est douce et bienfaisante ; la charité n’est point envieuse ; elle n’est point téméraire et précipitée ; elle ne s’enfle point d’orgueil, elle n’est point dédaigneuse ; elle ne pense point le mal ; elle aime tout, elle croit tout, elle espère tout. La charité ne finira jamais. »</p><p>Vous l’avez entendu ! la charité ne finira jamais. Sans doute, car elle règnera éternellement dans le royaume des cieux, et enchaînera tous les cœurs dans les nœuds d’une indéfectible union. La discorde ne peut jamais arriver à ce royaume. Elles ne sont pas faites pour celui qui viole par la dissension l’amour de Jésus-Christ, les promesses de ce même Jésus-Christ qui a dit : « Mon commandement est que vous vous aimiez les uns les autres comme je vous ai aimés. » Qui n’a pas la charité n’a pas Dieu. Le bienheureux apôtre Jean nous le déclare : « Dieu est amour, dit-il ; celui qui demeure dans l’amour demeure en Dieu et Dieu en lui. » Il est donc impossible de demeurer en Dieu, quand on ne veut pas garder la paix avec l’Église. Que ces ennemis de la paix montent sur les bûchers, que les flammes du martyre consument leurs corps, qu’ils expirent sous l’ongle et la dent des bêtes féroces, qu’importe ? le châtiment de leur trahison commence là où ils cherchaient les récompenses de la foi ; au lieu de les conduire à la félicité, leur trépas les précipite dans l’éternel désespoir. Ces transfuges de l’Église peuvent être immolés ; mais de couronnes, il n’en est pas pour eux. Ils protestent de leur Christianisme, mais à la manière du démon qui se couvre d’un masque, selon que nous en avertit le Seigneur : « Plusieurs viendront à vous, en disant : Je suis le Christ, et ils en séduiront un grand nombre. » Mais on n’est pas plus le Christ, parce que l’on trompe la multitude sous ce nom sacré, que l’on n’est Chrétien, quand on ne demeure pas dans la vérité de sa foi et de son Évangile.</p><p>Prophétiser, chasser les démons, étonner le monde par des prodiges sans nombre, grande et admirable faveur, sans doute. Toutefois, sans la droiture du cœur, sans la pratique de la loi, ces œuvres merveilleuses ne donnent pas le ciel. Nous en avons pour garant la parole de Dieu lui-même : « Plusieurs me diront en ce jour-là : Seigneur, Seigneur, n’avons-nous pas prophétisé en votre nom, chassé les démons, et fait beaucoup de prodiges en votre nom ? Et alors je leur dirai : je ne vous ai jamais connus ; retirez-vous de moi, vous qui opérez l’iniquité. »</p><p>La justice est donc nécessaire pour être agréable à Dieu ; et, sans la soumission aux préceptes, pas de récompense pour nos œuvres. Le Sauveur, voulant dans son Évangile, nous tracer en deux mots l’abrégé de notre foi et de notre espérance, a dit : « Le Seigneur est ton Dieu, ton seul Dieu. Tu aimeras le Seigneur ton Dieu de tout ton cœur et de toute ton âme, de toute ta pensée et de toute ta force. C’est là le premier commandement, et voici le second, qui est semblable au premier : Tu aimeras le prochain comme toi-même. La loi tout entière et les prophètes sont renfermés dans ce précepte. » Amour et unité ! voilà donc toute sa doctrine ; la loi et les préceptes sont là. Or, je le demande, observe-t-il le double précepte de l’unité et de l’amour, fondement immortel de la religion, le téméraire qui, agité par les fureurs de la discorde, déchire le sein de l’Église, détruit la foi, trouble la paix, anéantit la charité, profane les sacrements ?</p><p>Le fléau du schisme et de l’hérésie, mes bien-aimés, remonte à des temps déjà éloignés ; mais, de nos jours, ce mal contagieux se multiplie de toutes parts. Il fallait qu’il en fût ainsi vers la fin des temps, comme les avertissements de l’Esprit saint et les prophéties de l’apôtre nous l’ont prédit : « Vers la fin des temps, il y aura des hommes amateurs d’eux-mêmes, avares, superbes, hautains, médisants, désobéissants à leurs pères et à leurs mères, ingrats, impies, dénaturés, sans foi et sans parole, calomniateurs, intempérants, inhumains, ennemis des gens de bien, traîtres, insolents, enflés d’orgueil, ayant plus d’amour pour la volupté que pour Dieu ; ils auront une apparence de piété, mais ils en répudieront l’esprit. De ce nombre sont ceux qui s’insinuent dans les maisons, et qui entraînent après eux, comme captives, des femmes chargées de péchés et emportées par diverses passions, lesquelles apprennent toujours sans jamais parvenir à connaître la vérité. Or, comme Jannès et Mambrès résistèrent à Moïse, ceux-ci de même résistent à la vérité. Mais le progrès qu’ils feront n’aura qu’un temps ; car leur folie sera connue de tout le monde, ainsi que le fut celle de ces magiciens. » Les prophéties s’accomplissent, et comme le monde touche à sa fin, l’épreuve des temps et des hommes commence. Grâce aux ravages toujours croissants du père du mensonge, l’erreur marche tête levée ; toutes les passions mauvaises se déchaînent à la fois ; la colère soulève les cœurs, la jalousie les ronge, la cupidité les aveugle, l’impiété les pervertit, l’orgueil les enfle, la discorde les divise, la fureur les précipite. Gardons-nous cependant que notre foi ne chancelle à l’aspect des crimes qui débordent de toutes parts, mais que plutôt l’accomplissement des prédictions serve à la fortifier. Le même Dieu, qui vous a signalé d’avance l’apparition de quelques-uns de ces hommes, a prescrit à tous nos frères la vigilance : « Vous donc, prenez garde ; voici que je vous ai tout prédit. » Évitez, je vous en conjure, évitez, mes frères bien-aimés, ces hommes de malheur ; fuyez la contagion de leur présence et de leurs discours. « Mettez, selon le langage de l’Écriture, une garde d’épines autour de vos oreilles, et n’écoutez pas la langue dépravée. Les mauvais entretiens corrompent les bonnes mœurs. » Voulez-vous encore une autre preuve qu’il faut les fuir ? Écoutez notre Seigneur : « Ce sont des aveugles qui conduisent des aveugles ! Or, si un aveugle conduit un aveugle, ils tomberont tous deux dans la même fosse. » Je ne saurais trop vous le répéter : Fuyez celui qui s’est séparé de l’unité de l’Église ; fuyez-le, quel qu’il soit. C’est un pervers qui se condamne lui-même. Dira-t-il qu’il demeure uni à Jésus-Christ, quand il s’élève contre les prêtres de Jésus-Christ ? quand il a rompu ouvertement avec le clergé, avec le troupeau ? Il tourne ses armes contre l’Église ; il combat contre la volonté de Dieu. Ennemi de l’autel, rebelle au sacrifice de Jésus-Christ, transfuge de la foi, que dirai-je encore ? coupable de lèse-religion, serviteur révolté, frère ennemi, fils dénaturé, il ose, au mépris des évêques et des prêtres, élever autel contre autel, formuler en termes illicites une autre prière, profaner l’hostie vivante par je ne sais quelle ombre de sacrifice. Malheureux ! Et il ne songe pas du moins à quel châtiment s’expose l’audacieux qui s’attaque au Seigneur ! Ainsi Coré, Dathan et Abiron, qui avaient usurpé sur Moïse et le pontife Aaron les droits de la sacrificature, expièrent sur-le-champ leur sacrilége audace. La terre, s’entr’ouvrant tout-à-coup sous leurs pas, les ensevelit vivants dans ses gouffres. Ce fut trop peu encore pour la colère divine. Ils avaient entraîné dans leur rébellion deux cent cinquante complices. Tous expirèrent à côté de leurs chefs dans des flammes vengeresses suscitées par le ciel. Preuve terrible que la perversité humaine attente à la majesté divine elle-même, en s’efforçant d’anéantir son ouvrage !</p><p>Ainsi, quand, armé de l’encensoir et résistant aux représentations du pontife Azarias, le roi Ozias continua d’offrir au Très-Haut un sacrifice réprouvé, la colère céleste lui attacha au front une lèpre hideuse, au front où Dieu marque le Chrétien fidèle du signe de ses miséricordes. Ainsi encore tombèrent sans vie aux pieds du Seigneur indigné, les fils d’Aaron, pour avoir placé sur l’autel un feu étranger que le Seigneur n’avait pas prescrit. Ils imitent ces insolents profanateurs, ceux qui, dédaignant les célestes traditions, courent après des doctrines étrangères, et substituent l’enseignement de l’homme à l’enseignement de Dieu. C’est à eux que s’adresse le Seigneur dans son Évangile, quand il dit : « Vous rejetez le commandement de Dieu pour établir votre tradition. » Crime mille fois plus odieux que l’apostasie ! L’apostasie cependant, soumise à la pénitence, fléchit Dieu par une satisfaction entière. Ici, on prie, on cherche l’Église ; là, on se révolte contre elle. Ici, la contrainte explique la prévarication ; là, l’opiniâtreté volontaire s’endurcit dans le forfait. Ici, la fragilité, en succombant, n’a perdu qu’elle-même ; là, le schisme et l’hérésie ont entraîné sur leurs pas une foule de coupables. Ici, péril pour une âme ; là, pour des milliers. L’une du moins reconnaît et pleure sa faute ; l’autre marche tête levée. L’orgueil et la suffisance gonflent son cœur ; elle arrache à la mère ses enfants, au pasteur ses brebis, aux sacrements leur efficacité. L’une n’a failli qu’une fois ; l’autre renouvelle incessamment sa perversité ; enfin, on a vu des apostats pénitents courir intrépidement au martyre et reconquérir les promesses du royaume. Mais le schismatique, mais l’hérétique a beau sacrifier sa vie ; s’il meurt hors de l’Église, il ne peut parvenir aux récompenses de l’Église.</p><p>Et ici, mes bien-aimés, ne vous étonnez pas que des confesseurs aient donné d’affligeants scandales et soient descendus jusqu’à la défection. La générosité de leurs premiers combats ne les mettait pas à l’abri des piéges du tentateur : tant qu’ils restent sur cette terre d’épreuve, associés à toutes les infirmités humaines, leur gloire ne les protége pas contre les assauts ni les séductions d’un siècle corrompu. L’illustration n’est point un port sans tempête. Autrement, verrions-nous dans quelques-uns d’entre eux les rapines, les prostitutions, les adultères dont nous avons à gémir aujourd’hui ? Confesseur, qui que vous soyez, vous n’êtes ni plus grand, ni plus vertueux, ni plus cher à Dieu que Salomon. Tant qu’il marcha dans les voies du Seigneur, il garda la grâce qu’il avait reçue. Sitôt qu’il abandonna les voies du Seigneur, la grâce se retira. Voilà pourquoi il est écrit : « Garde bien ce que tu as, de peur qu’un autre ne prenne ta couronne. Dieu ne nous avertirait pas que la couronne de justice peut nous être enlevée, s’il n’était pas vrai que la couronne nous fait défaut au jour où nous faisons défaut à la justice. » La confession est donc le prélude de la gloire, mais n’est pas encore le triomphe ; et puisque, d’après l’oracle divin « celui-là seul parviendra au salut, qui aura persévéré jusqu’à la fin, » si haut que vous soyez monté, à moins d’avoir atteint le point le plus élevé, votre élévation n’est qu’un degré dans l’édifice de votre salut.</p><p>Vous êtes confesseur, dites-vous ! mais après l’éclatant témoignage que vous avez rendu à votre foi, le péril devenait plus imminent, parce que l’ennemi avait été provoqué davantage. Vous êtes confesseur ! mais raison de plus de demeurer inséparablement uni à l’Évangile du Seigneur, quand c’est par l’Évangile que le Seigneur vous a couronné de gloire. En effet, il a dit : « On demandera beaucoup à celui auquel aura été donné beaucoup, et la soumission doit s’accroître avec la dignité. » Ainsi, pourquoi perdre vos frères par vos exemples ? pourquoi leur prêcher publiquement la violence, l’injure, la trahison ? Vous êtes confesseur ! Aimez donc l’humilité, la modestie, la paix, disciple véritable du maître que vous avez hautement confessé, et qui a dit : « Quiconque s’élève, sera abaissé, et quiconque s’abaisse sera élevé. » S’il est vrai que le Sauveur a été glorifié parce que, Verbe, sagesse et splendeur du Père, il s’était anéanti ici-bas ; s’il nous a prescrit l’humilité par sa loi ; si son Père ne lui a imposé un nom au-dessus de tous les noms que pour le récompenser de ses abaissements, il hait, par une conséquence nécessaire, l’arrogance et l’orgueil. Vous êtes confesseur de Jésus-Christ ! D’accord ; mais vous prenez par-là même l’engagement de ne point provoquer les blasphèmes contre la majesté de Jésus-Christ ; de ne pas prêter à l’imposture, à la calomnie, aux dissensions une bouche fidèle jusqu’à ce jour ; de ne pas distiller sur les ministres de Jésus-Christ le poison du serpent avec cette même langue qui tout-à-l’heure bénissait et proclamait Jésus-Christ. Mais, sachez-le bien ! si, au cantique de louanges succède le cri de la malédiction, à la foi du premier serment un lâche parjure, à la pureté des mœurs la souillure des prostitutions ; si, désertant l’Église qui vous compte avec orgueil parmi ses confesseurs, vous troublez la paix, vous brisez l’unité, vainement vous vous décorez d’un titre que vous déshonorez aujourd’hui ; vainement vous vous croyez prédestiné à la gloire : la sévérité de votre châtiment sortira de votre première fidélité. Le Sauveur n’avait-il pas admis Judas au nombre de ses apôtres ? Judas cependant trahit son maître. Mais la trahison de Judas, lorsqu’il se sépara des apôtres ne porta aucune atteinte à leur foi et à leur fermeté. Il en est de même ici. La chute de quelques-uns n’affaiblit ni la sainteté, ni la dignité des confesseurs. Le bienheureux apôtre dit dans une de ses épîtres : « Quoi donc ! si quelques-un d’eux n’ont pas cru, leur infidélité anéantira-t-elle la fidélité de Dieu ? Non, sans doute. Dieu est véritable, et tout homme est menteur. » La plus grande et la meilleure partie des confesseurs est restée fidèle à la foi ainsi qu’à la vérité de la loi et de la discipline du Seigneur. Ils se sont bien gardés d’abandonner la paix de cette Église, dans laquelle ils se souviennent que la divine miséricorde les a honorés de sa grâce, d’autant plus louables dans cette conjoncture, qu’il leur a fallu faire divorce avec la perfidie de ceux qui tout-à-l’heure étaient associés à la gloire de leur confession, afin de ne point partager leur iniquité, toujours éclairés par la lumière de l’Évangile, héros quand il fallait résister en face au démon, héres encore quand il s’est agi de maintenir la paix du Seigneur.</p><p>Il est un vœu que je forme du fond de mon cœur, mes bien-aimés, un conseil que ma tendre sollicitude adresse à tous, c’est que nul d’entre vous ne consomme sa ruine en se séparant des fidèles ! Puisse notre mère commune, joyeuse et triomphante, ne renfermer dans son sein qu’un même peuple uni par la même foi ! Si cependant mes salutaires représentations ne pouvaient arracher à leur aveugle et opiniâtre démence les auteurs de ces fatales dissensions, vous du moins, dont la confiance et la simplicité ont été surprises, ou qui avez cédé à l’erreur par quelque autre motif, brisez sans délai les liens qui vous enchaînent ; abandonnez les sentiers de l’erreur où vous vous perdiez, et reconnaissez la voie droite qui conduit au ciel ! La voix de l’apôtre vous le crie : « Nous vous ordonnons, mes frères, au nom de notre Seigneur Jésus-Christ, que vous ayez à vous séparer de tous ceux d’entre nos frères qui se conduisent d’une manière déréglée et non selon la tradition, qu’ils ont reçue de nous. » Et ailleurs : « Que personne ne vous séduise par de vains discours ; car c’est là ce qui attire la colère de Dieu sur les incrédules. N’ayez donc rien de commun avec eux. »</p><p>Il faut s’éloigner, disons mieux, il faut fuir à l’aspect de ces hommes qui marchent dans des chemins mauvais, de peur qu’en nous engageant avec eux dans les routes de l’erreur et du crime, nous ne soyons enveloppés dans la même faute et dans le même châtiment. Il n’y a qu’un Dieu, qu’un Sauveur, qu’une Église, qu’une foi, qu’un peuple, formant un seul corps, par le ciment indissoluble de la charité. L’unité est indivisible : un corps, où tout s’enchaîne dans un harmonieux ensemble, ne peut subsister dès que vous le mettez en lambeaux. Tout ce qui s’éloigne du centre de la vie ne pouvant plus ni vivre, ni respirer dans son isolement, perd la substance du salut. L’Esprit saint nous l’atteste : « Quel est l’homme qui veut la vie ? qui soupire après les jours de bonheur ? Préservez votre langue de la calomnie, et vos lèvres de tout discours artificieux. Éloignez-vous du mal, et pratiquez le bien ; cherchez la paix, et poursuivez-la sans relâche. » Oui, le fils de la paix doit chercher la paix et la poursuivre sans relâche ; celui qui connaît et affectionne le lien de la charité doit fermer ses lèvres à la médisance et au mensonge. Parmi les divins enseignements que le Sauveur nous adressait la veille de sa passion, il ajouta : « Je vous laisse ma paix, je vous donne ma paix. » Sublime héritage qu’il nous léguait en mourant, et à la conservation duquel il attachait toutes les autres promesses ! Si nous sommes les cohéritiers de Jésus-Christ, demeurons dans la paix de Jésus-Christ ; si nous sommes les enfants de Dieu, chérissons la paix et l’union. « Bienheureux les pacifiques, car ils seront appelés enfants de Dieu ! » Que les enfants de Dieu soient donc pacifiques, doux, pleins de mansuétude, simples dans leur langage, unis par la charité, et attachés les uns aux autres par des nœuds indissolubles. Touchante unanimité, qui subsistait sous les apôtres ! C’est par là que, fidèle à la pratique des commandements du Seigneur, le nouveau peuple des croyants garda sa charité, suivant ce témoignage de la divine Écriture : « La foule de ceux qui croyaient n’avait qu’un cœur et qu’une âme. » Ailleurs elle nous dit : « Ils persévéraient unanimement dans la prière avec les femmes, Marie, mère de Jésus, et ses frères. » Aussi quelle efficacité dans leurs prières : ils avaient la confiance qu’ils obtiendraient tout ce qu’ils demanderaient à la miséricorde du Seigneur ; chez nous, au contraire, cette conformité de sentiments a presque disparu avec les bonnes œuvres qui en sont la suite. Alors les fidèles vendaient leurs héritages, vendaient leurs maisons, pour s’amasser des trésors là-haut, et apportaient le prix de leurs biens aux pieds des apôtres, pour le consacrer au soulagement des pauvres. Mais nous, les sacrifices les plus légers nous épouvantent. Vendez ce que vous possédez, nous crie le Seigneur ! Loin de là, nous achetons incessamment ; nous nous agrandissons sans fin. Ô fatal dépérissement de la foi ! Nous touchons bien à cette époque prédite par le Sauveur : « Quand le Fils de l’homme viendra, croyez-vous qu’il trouve encore de la foi sur la terre ? » L’oracle se vérifie : plus de crainte de Dieu, plus de justice, plus d’amour, plus de foi ! on ne songe plus à l’éternité, au jour du Seigneur, au feu indestructible qui attend l’incrédulité et la trahison dans une autre vie. Les salutaires frayeurs ont disparu avec l’énergie des croyances. Et pourtant, s’il nous restait un peu de foi, quels motifs pour trembler ! L’effroi nous inspirerait la vigilance ; et la vigilance nous conduirait au port.</p><p>Debout, mes frères, debout ! secouons, il en est temps, une trop longue torpeur ! Animons-nous désormais à l’observation des commandements ; soyons tels que le Seigneur nous ordonne d’être, lorsqu’il nous dit : « Que vos reins soient entourés d’une ceinture, et que vos lampes brûlent en vos mains comme des serviteurs qui attendent que leur maître revienne des noces, se tenant prêts à lui ouvrir dès qu’il frappera à la porte. Bienheureux sont les serviteurs que le maître trouvera veillant quand il viendra ! »</p><p>Oui, ceignons nos reins, de peur que, quand viendra l’heure de partir, il ne nous trouve embarrassés et chargés d’entraves. Allumons le flambeau de nos bonnes œuvres, afin qu’il nous conduise à travers la nuit du siècle jusqu’à la lumière de la gloire éternelle. Attendons avec sollicitude, et toujours sur nos gardes, l’arrivée imprévue du Seigneur, afin qu’au moment où il frappera à la porte, notre foi s’éveille pour aller recevoir des mains du Seigneur le prix de sa vigilance. Si nous observons ces préceptes ; si nous sommes dociles à ces avertissements, que nous importent les artifices du démon ? Il ne pourra plus profiter de notre sommeil pour consommer notre ruine. Serviteurs vigilants, nous règnerons éternellement avec Jésus-Christ.</p>
