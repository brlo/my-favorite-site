      <p>Il n’y a qu’un Dieu : le Christ est la porte par laquelle on arrive au salut ; et ces vains simulacres, devant lesquels le vulgaire fléchit le genou, ne sont pas des divinités ; voilà ce que personne n’ignore. Ces personnages furent jadis des souverains pour lesquels les hommages du trône se perpétuèrent au-delà du tombeau. De là les temples érigés en leur honneur ; de là ces images, ces statues, pour rappeler leurs traits anéantis par la mort ; de là ces immolations de victimes, ces jours de fête, ces solennités de toute espèce. La postérité changea en culte les témoignages de la reconnaissance et les regrets de la douleur. Voyons si notre assertion est applicable à chacun d’eux.</p><p>Mélicerte et Leucothoë se précipitent dans la mer et deviennent par la suite les divinités de cet élément. Castor et Pollux meurent afin de vivre tour-à-tour ; Esculape est foudroyé pour se réveiller dieu ; Hercule, consumé dans les flammes de l’Æta, y laisse tout ce qu’il avait de mortel ; Apollon garde les troupeaux d’Admète ; Neptune bâtit les remparts de Laomédon, et, architecte malencontreux, se retire frustré de son salaire. On visite encore dans l’île de Crète l’antre de Jupiter, et on y montre son tombeau. On sait que, dépouillé de son trône et chassé par lui, Saturne chercha une retraite dans le Latium, d’où est venu le surnom de cette contrée. Le roi fugitif, en échange de ses bienfaits, apporta dans l’Italie les lettres de l’alphabet, et donna à la monnaie sa première empreinte. De là le trésor placé sous la garde de Saturne. Il se livra aux travaux champêtres ; de là cette faux que les peintres mettent dans la main du vieillard. Janus lui avait offert l’hospitalité ; le janicule lui emprunta son nom, et le mois de janvier fut institué en son honneur. On le représente avec deux visages, parce que, debout entre l’année qui s’écoule et l’année qui commence, il semble les regarder à la fois l’une et l’autre. Quant à l’Africain, il adore sans pudeur ses monarques, et ne prend pas même la peine de déguiser son culte. Qu’on ne demande plus pourquoi la religion, avec cette prodigieuse multiplicité de dieux, revêt toutes sortes de formes parmi tant de nations diverses qui honorent chacune quelqu’un de leurs ancêtres. Nous lisons, dans une lettre assez étendue qu’Alexandre écrivait à sa mère, cette révélation curieuse. Un prêtre, disait-il, intimidé par sa puissance, lui avait livré le secret de ces dieux-hommes ; ce secret, le voici : Le respect pour les rois et pour la mémoire des ancêtres, grandissant avec le temps, s’était converti en culte et en sacrifices.</p><p>Mais, s’il est né des dieux jadis, pourquoi n’en voyons-nous plus naître de nos jours, à moins peut-être que Jupiter n’ait vieilli ou que la fécondité de Junon ne soit épuisée ? Ces dieux ont combattu pour les Romains, dit-on : fort bien ; mais pourquoi ces immortels de même aloi n’ont-ils pu arrêter les aigles romaines, quand il s’agissait de sauver leurs adorateurs ? Nous connaissons tous ces dieux de bas étage qui pullulèrent à Rome ; c’est un pieux mensonge de Proculus qui divinisa Romulus. J’en dis autant de Picus, de Pilumnus, de Tibérinus, de Consus, dieu de la fraude, et bientôt érigé en dieu du conseil, par les soins de Romulus, aussitôt que la perfidie eut triomphé dans l’enlèvement des Sabines. Tatius métamorphosa en déesse une Cloacine, trouvée dans un égout ; Hostilius consacra la peur et la pâleur ; la fièvre eut son temple, grâce à je ne sais quel visionnaire, et deux courtisanes fameuses, Acca et Flora, reçurent les honneurs de l’apothéose. Tels sont les dieux de Rome. Au reste, ce Mars, objet du culte des Thraces, le Jupiter de la Crète, Junon, adorée à Saraos, à Argos, en Phénicie ; Diane taurique, la mère des dieux, dont le mont Ida célèbre les fêtes ; tous ces monstres de l’Égypte, importés en Italie, ne sont pas des dieux. Supposez-leur le moindre degré de puissance, eussent-ils laissé crouler leur empire et celui de leurs adorateurs ? Les Romains vénèrent encore les pénates vaincus, transportés à Rome par le fugitif Énée, aussi bien qu’une Vénus Chauve, surnom injurieux par lequel ils déshonorent leur déesse plus qu’Homère lui-même, lorsqu’il nous la montre blessée par Diomède. Quant à la prospérité des empires, ce n’est pas le mérite, c’est la fortune qui la distribue. Le Mède, le Perse, l’Égyptien, le Grec, dominent tour-à-tour ; puis, quand tous les rôles sont joués, Rome paraît sur la scène. Mais remontez à son origine, vous rougirez pour elle. Des scélérats, des meurtriers se rassemblent dans un asile qui leur est ouvert ; l’impunité en grossit le nombre. Courbez-vous ! voilà le berceau de la future maîtresse du monde ! Romulus va mériter de régner sur des brigands : il assassine son frère ; il commence, sous les auspices de la violence, le mariage, œuvre de paix et de concorde ; enlèvement, férocité, trahison, tout est mis en œuvre pour agrandir la cité naissante, et les noces de ses fils se célèbrent par un attentat aux droits de l’hospitalité, par une guerre sanglante contre les pères des nouvelles épouses. Deux siècles s’écoulent ; le consulat, dignité suprême, remplace la royauté ; il lui faut du sang comme à celle-ci. Brutus immole de sa main ses propres fils, heureux de monter au premier rang par un crime. Qu’on ne me dise plus que la puissance romaine grandit et se maintint par son respect pour les observances religieuses ; ne me vantez plus ses auspices, ses présages. Non ; son existence avait ses limites posées d’avance et une carrière fixe à parcourir ; elle l’a parcourue. Les auspices ! Mais Régulus leur fut religieusement soumis, et n’en subit pas moins la honte de la défaite et de la captivité. Mancinus, malgré son respect pour eux, passa sous le joug. Les poulets de Paulus avaient consenti à manger : Cannes, qui vit le général périr avec son armée, leur donna un éclatant démenti. Des présages malheureux défendaient à César de naviguer vers l’Afrique avant l’hiver : une navigation heureuse et une prompte victoire couronnèrent sa témérité. Où trouver la cause de cette démence, sinon dans une vaine raison qui trompe le crédule vulgaire par d’éblouissants prestiges, et empêche la vérité d’arriver jusqu’à lui. Il faut l’imputer à des esprits corrompus et vagabonds qui, depuis qu’ils se sont plongés dans la fange de la terre et dépouillés de leur vigueur primitive, ne cherchent qu’à entraîner l’homme dans leur ruine, et à verser dans tous les cœurs le poison de leur propre dépravation. La poésie antique les connut sous le nom de démons. Socrate, s’il faut l’en croire, avait un de ces génies qui dirigeait toutes ses actions. Ils manifestent leur présence par des prestiges et des enchantements. Un des premiers magiciens cependant, Hostanès, assure avec beaucoup de sagacité que la forme du vrai Dieu échappe à nos sens, et que les anges véritables sont rangés autour de son trône. D’accord avec lui, Platon n’admet qu’un Dieu unique, et appelle anges ou démons, les créatures intermédiaires. Hermès Trismégiste ne reconnaît non plus qu’un seul Dieu, et il le proclame incompréhensible, insaisissable aux yeux comme à la pensée.</p><p>Ce sont ces esprits déchus qui s’enferment secrètement dans les statues consacrées et sous les représentations idolâtriques ; eux qui allument l’enthousiasme au cœur du prêtre, eux qui font palpiter les fibres des victimes, qui gouvernent le vol des oiseaux, dirigent le destin, rendent des oracles ; eux qui, trompeurs et trompés, enveloppent incessamment la vérité de nuages et de ténèbres, troublent la vie, inquiètent le sommeil. Ils vont plus loin : ils se glissent clandestinement dans les corps humains, en prennent possession, bouleversent l’âme, secouent et tordent les membres dans d’horribles convulsions, détruisent la santé, appellent les maladies, afin de pousser l’homme à chercher un remède au pied de leurs autels ; puis, alors que rassasiés d’encens et gorgés de mets, ils consentiront à déserter les corps qu’ils fatiguaient sous le fardeau de leur présence, ils appelleront faveur et guérison ce qui n’est que la cessation de leurs outrages. Détourner la créature du culte divin, lui dérober la connaissance de la religion véritable, pour la précipiter dans les superstitions de l’idolâtrie ; envelopper dans leur châtiment les complices de leurs crimes et de leurs erreurs, voilà leur but et leur occupation. Cependant, quand nous les adjurons au nom du Dieu vivant, ils se retirent des corps qu’ils obsédaient, en confessant leurs noms. Regardez ! sous la puissance mystérieuse de nos paroles, vaincus par l’invisible majesté du Très-Haut, ici des verges les frappent ; là des flammes les consument ; plus loin ils se débattent, étendus sur le chevalet ; ils poussent des gémissements et des vociférations, et proclament même, en face de leurs adorateurs, qui ils sont, d’où ils viennent, et à quel moment ils se retirent. Alors on les voit tantôt s’échapper brusquement, tantôt disparaître par degrés selon que la foi du patient ou que la grâce du médecin spirituel hâte leur départ. De là ils s’en vont soulever les haines populaires contre le nom chrétien, afin que le monde nous haïsse avant de nous connaître, de peur que, s’il venait à nous connaître, il n’embrassât nos dogmes, ou du moins ne pût nous condamner.</p><p>Il n’y a donc qu’un Dieu, maître et Seigneur de toutes choses. En effet, cette dignité incommunicable n’admet ni communauté, ni partage, parce que seule elle possède la toute-puissance. Empruntons à la terre ses exemples, pour les appliquer à la souveraineté divine. Montrez-moi une époque de l’histoire où l’association à l’empire ait commencé avec bonne foi, ou du moins n’ait pas expiré dans des flots de sang ! À Thèbes, la haine la plus ardente divise les deux frères, et les poursuit jusque dans les flammes de leur bûcher. À Rome, les deux jumeaux, conçus et portés dans le même sein, se trouvent à l’étroit sur le même trône. Pompée et César sont alliés ; mais leur puissance rivale brise le nœud qui les enchaîne. Et pourquoi s’en étonner dans l’homme ? L’unité se retrouve partout dans la nature : les abeilles n’ont qu’un roi, les troupeaux qu’un chef. À plus forte raison, n’y aura-t-il qu’un maître souverain, qui, par sa parole, ordonne tout ce qui est, le gouverne par sa sagesse, le soutient par sa puissance. Plus clair que la vue, il échappe à nos regards ; plus subtil que le toucher, il est inaccessible à nos sens ; supérieur à l’intelligence, notre pensée ne peut l’atteindre ; jamais nous ne le comprenons mieux qu’en le nommant l’incompréhensible. Mais où est le temple digne de ce Dieu qui a l’univers pour temple ? Quand l’homme, chétive créature, étend au loin son habitation, irai-je circonscrire dans une étroite enceinte la majesté divine ? Notre cœur, voilà son plus magnifique sanctuaire ; c’est là qu’il veut être adoré. Ne cherchons pas de nom à Dieu ; son nom, c’est Dieu. Il faut des noms pour distinguer par une désignation spéciale la multitude des objets ; en disant Dieu, vous avez tout dit, parce que rien ne lui ressemble. Il est seul, il est unique ; et pourtant son immensité est répandue partout. Le vulgaire lui-même, entraîné par un instinct naturel, sent autour de lui l’âme, l’intelligence de son auteur, et confesse mille fois le jour sa présence. Ne l’entendons-nous pas s’écrier à chaque moment : « Ô Dieu !… Dieu le voit !… Je me recommande à Dieu ! Dieu vous le rende !… Dieu le veut ainsi !… Si Dieu le permettait !… » Voilà bien le comble du crime ! ils refusent de reconnaître celui qu’il n’est pas possible d’ignorer !</p><p>Jésus-Christ existe ; le salut est descendu dans le monde par son incarnation ; nous l’avons dit. Apprenez la merveilleuse économie de ce mystère.</p><p>Anciennement les Juifs étaient la nation chérie du Très-Haut ; leurs ancêtres pratiquaient la justice et vivaient sous l’observance de la loi. Un empire florissant et une population nombreuse furent la récompense de leur fidélité. Mais bientôt arrivèrent l’oubli de Dieu, la révolte, la folle confiance dans les prospérités de leurs pères, le mépris des préceptes, et, à la suite des prévarications, la perte de la grâce. Quels furent leurs désordres ? jusqu’à quel point outragèrent-ils la religion ? Il n’est pas besoin d’invoquer leur témoignage ; tout muets qu’ils sont, ils le proclament assez haut par la voix de leurs désastres. Arrachés à leur ciel, bannis de leur patrie, errants dans tout le monde, ils sont réduits à implorer l’hospitalité étrangère. Dieu avait prédit en effet que, vers la fin des jours, il se choisirait parmi toutes les nations un peuple d’adorateurs, peuple soumis, peuple fidèle, pour lequel il ouvrirait tous ses trésors, et ferait pleuvoir l’abondance de ses grâces, qu’avaient répudiées les Juifs. Le Verbe éternel, le fils de Dieu, celui que les prophètes avaient unanimement signalé comme devant être la lumière nouvelle et le réparateur du genre humain, est envoyé pour consommer ce grand œuvre. Il est la vertu de Dieu, sa raison, sa sagesse, sa gloire. Il descend dans le sein d’une vierge ; esprit immortel, il revêt notre mortalité ; le Dieu s’unit à l’homme. Voilà notre Dieu, voilà Jésus-Christ médiateur entre son Père et nous ; il s’abaisse jusqu’à la créature pour élever la créature jusqu’à son Père. Ce qu’est l’homme, le Christ a voulu le devenir, afin que l’homme puisse devenir ce qu’est le Christ.</p><p>Les Juifs n’ignoraient pas, grâce aux nombreuses prophéties qui l’annonçaient, que le Messie devait apparaître. Mais, comme les saints oracles parlaient tout à la fois d’un double avénement, l’un qui manifesterait l’homme, l’autre qui révèlerait le dieu, les Juifs fermèrent obstinément les yeux à son premier avénement qui s’écoula dans les abaissements de sa Passion, pour n’admettre que le second, qui doit faire éclater sa gloire et sa puissance. Cet aveuglement était la punition de leurs forfaits. Telles furent les ténèbres de leur entendement et de leur cœur, qu’indignes de la vie, ils n’aperçurent pas la vie qui était devant leurs yeux. Ainsi, quand le Sauveur, accomplissant à la lettre les prophéties, rendait le mouvement aux paralytiques et la vue aux aveugles ; quand il guérissait les lépreux, redressait les boiteux, ressuscitait les morts, forçait les éléments à lui obéir et les tombeaux à lui céder leur proie, les Juifs, le jugeant d’après la bassesse du sang et de la chair, le prenaient pour un magicien, à cause de l’étendue de sa puissance. Les maîtres et les chefs de la nation, c’est-à-dire ceux qu’il confondait par sa doctrine et sa sagesse, se soulevèrent contre lui et jurèrent sa perte. Ils s’emparèrent de sa personne, le livrèrent à Ponce-Pilate, alors gouverneur de la Syrie, au nom des Romains, puis ils demandèrent opiniâtrement et à grands cris qu’il fût crucifié et mis à mort. Outre qu’il avait prédit lui-même ce genre de supplice, longtemps avant son incarnation, les prophètes avaient annoncé de concert que le Christ devait souffrir, non pas pour éprouver la mort, mais pour en triompher, afin d’attester sa majesté et sa puissance. Les événements et les oracles sont d’accord. Il fut attaché à une croix ; il rendit de lui-même son âme avant le dernier coup de lance du bourreau ; et, le troisième jour, il ressuscita d’entre les morts par sa propre vertu. Il apparut à ses disciples tel qu’il avait été d’abord ; il se fit reconnaître de ceux qui le voyaient, toujours dans la même chair, réelle, solide, palpable, et portant encore la trace des liens funèbres. Il séjourna quarante jours parmi eux, pour leur inculquer les paroles de la vie et leur apprendre ce qu’ils devaient enseigner. Sa mission remplie, une nuée majestueuse l’emporta au ciel. Il y remontait pour rapporter triomphant aux pieds de son Père l’homme qu’il avait tant aimé, l’homme dont il avait revêtu la faiblesse, l’homme qu’il avait arraché au trépas ; mais aussi pour en redescendre incessamment châtier le démon, juger le monde avec la sévérité d’un vengeur et la puissance d’un juge, après que ses disciples auraient porté aux nations les préceptes du salut, fait passer les nations des ténèbres à la lumière, et dessillé leurs yeux trop longtemps fermés. Ce n’est pas tout : de peur que la foi de ses serviteurs ne fût peu solide et la confession du nom chrétien peu laborieuse, les tortures, les croix, les tribulations de toute nature furent chargées de nous mettre à l’épreuve. La souffrance, qui est le témoin de la vérité, est employée sur la terre, afin que la divine filiation de Jésus-Christ et sa sanglante immolation pour le salut des hommes soient proclamées par la voix de ses prédicateurs, ainsi que par le sang de ses martyrs. Voilà celui dont nous suivons les étendards ; voilà notre guide, notre flambeau, l’auteur de notre salut ; voilà celui qui promet l’éternité et Dieu son père à ceux qui le cherchent et croient en lui. Ce qu’est Jésus-Christ dans sa gloire, Chrétiens, nous le serons un jour, si nous imitons Jésus-Christ ici-bas.</p>
