    body: |-
      <p>I. Romains, il s’est passé dernièrement dans votre ville des choses étranges, sous Urbicus, et partout nous voyons de semblables injustices commises par les magistrats. C’est ce qui m’a forcé de vous adresser ce discours dans votre intérêt[1], car vous êtes des êtres de même nature que nous et nos frères, quand même vous ne le sauriez pas et quand même vous ne le voudriez pas à cause de la haute opinion que l’on a de vous. Partout, ceux qui méritent d’être repris par un père, un voisin, un fils, un ami, un frère, un mari, une femme ; tous, si l’on excepte ceux qui croient que les méchants et les intempérants seront punis dans le feu éternel et que les bons qui ont vécu selon le Christ seront heureux avec Dieu, nous voulons dire les chrétiens ; ceux donc qui méritent d’être repris pour leur obstination, leur amour des plaisirs, leur répugnance à se plier à la vertu, et en outre les démons, nos ennemis, qui ont sous leur main et à leur service ces juges, ces magistrats animés de leurs fureurs, tous veulent notre mort. Mais, pour bien vous faire connaître la cause de ce qui se passa sous Urbicus, je vais vous raconter le fait.</p><p>II. Une femme avait un mari qui vivait dans le vice, comme elle-même y avait vécu auparavant. Elle avait été instruite des enseignements du Christ et s’était corrigée. Elle cherchait à ramener aussi son mari à des sentiments meilleurs, lui exposait la doctrine et le menaçait du feu éternel réservé à ceux qui vivent dans le mal et contrairement à la saine raison. Le mari persévéra dans la débauche et, par sa conduite, s’aliéna l’esprit de sa femme. Elle crut que c’était désormais une impiété que de partager la couche d’un homme qui cherchait par tous les moyens des plaisirs contraires à la loi naturelle et à la justice, et elle résolut de se séparer de lui. Sur les conseils et les instances de ses parents, qui lui faisaient espérer que son mari viendrait enfin à résipiscence, elle se fit violence et resta. Celui-ci partit pour Alexandrie. Elle apprit que, là, il se conduisait encore plus mal. Craignant d’avoir part à ses crimes et à ses impiétés, si elle restait avec lui, partageant son toit et sa couche, elle lui signifia le <i>repudium</i>, comme vous dites, et se sépara de lui. Cet honnête mari aurait dû être heureux de voir sa femme, qui autrefois vivait sans retenue avec des serviteurs et des mercenaires, adonnée au vin et à toutes les iniquités, mettre fin à une telle conduite et chercher à le convertir comme elle ; mais, à la suite de ce divorce opéré sans son consentement, il l’accusa d’être chrétienne. Elle vous présenta une requête à vous, empereur, demandant qu’on lui permît de régler d’abord ses affaires ; après quoi, elle répondrait à l’accusation portée contre elle. Vous avez acquiescé à sa demande. Son mari, ne pouvant rien contre elle pour le moment, tourna sa fureur contre un certain Ptolémée qui lui avait enseigné la doctrine du Christ et qu’il fit condamner par Urbicus de la manière suivante. Il gagna un centurion de ses amis, qui fit jeter en prison Ptolémée ; il lui persuada de se saisir de Ptolémée et de lui demander seulement s’il était chrétien. Ptolémée, toujours sincère, ennemi de la ruse et du mensonge, avoua qu’il était chrétien : le centurion le fit mettre dans les fers et le tint longtemps en prison. Conduit enfin devant Urbicus, on lui demanda seulement, comme la première fois, s’il était chrétien. De nouveau, ayant conscience des biens qu’il devait à l’enseignement du Christ, il confessa l’école de la morale divine. Nier quoi que ce soit, c’est nier pour condamner, ou dans la conscience de sa propre indignité se proclamer étranger et refuser son témoignage. On ne trouvera ni l’un ni l’autre chez un vrai chrétien. Urbicus le fit emmener. Un certain Lucius, lui aussi chrétien, témoin de ce jugement injuste, dit à Urbicus : « Eh quoi ! Voilà un homme qui n’est ni adultère, ni débauché, ni homicide, ni voleur, ni ravisseur, qu’on ne peut en un mot convaincre d’aucun crime ; il avoue seulement s’appeler chrétien, et vous le condamnez ? Ce jugement, Urbicus, n’est pas conforme aux intentions du pieux empereur, ni du philosophe, fils de César, ni du sacré Sénat. » Sans autre réponse, Urbicus dit à Lucius : « Tu me parais, toi aussi, être chrétien. — Certainement, » répondit Lucius, et il le fit également emmener. Le condamné lui rendit grâce : mourir, c’était pour lui être délivré de ces maîtres injustes pour aller auprès du père et du roi des cieux. Un troisième se présenta, qui fut également condamné au supplice[2].</p><p>III[3]. Moi aussi, je m’attends à me voir poursuivi et attaché au bois du supplice par quelqu’un de ceux que j’ai nommés ou par Crescens, cet ami du bruit (philosophe) et de la parade. Le nom de philosophe ne convient pas à un homme qui nous accuse en public, alors qu’il ne nous connaît pas, qui traite les chrétiens d’athées et d’impies, pour plaire à une multitude égarée. S’il nous poursuit, sans avoir lu les enseignements du Christ, c’est un infâme ; il est moins excusable que les ignorants : eux du moins souvent se gardent de juger et de calomnier ce qu’ils ne connaissent pas. S’il les a lus, il n’en a pas compris la grandeur : s’il l’a comprise, c’est pour n’être pas soupçonné d’être chrétien qu’il se conduit ainsi, et alors il est d’autant plus misérable et infâme ; il est esclave d’une opinion aveugle et insensée ; il obéit à la crainte. Je lui ai proposé sur ce sujet des questions ; je l’ai interrogé : or j’ai pu me convaincre, je veux que vous le sachiez, qu’il n’en sait pas le premier mot. Pour prouver ce que j’avance, si vous n’avez pas eu connaissance de nos discussions, je suis prêt à l’interroger de nouveau devant vous : ce serait digne de votre puissance souveraine. Si vous avez eu connaissance de mes questions et de ses réponses, vous avez pu voir qu’il ne sait rien de notre doctrine. S’il la connaît, et que, comme je l’ai dit plus haut, la crainte de ceux qui l’écoutent l’empêche de parler, il montre par là qu’il n’est pas ami de la sagesse, mais ami de l’opinion : il méprise la belle maxime de Socrate : « La vérité doit passer avant l’homme. » Mais il est impossible qu’un cynique, qui place la fin dernière dans l’indifférence, connaisse un autre bien que l’indifférence.</p><p>IV. On nous dira peut-être : « Donnez-vous tous la mort à vous-mêmes. C’est le chemin pour aller à Dieu : vous nous épargnerez la besogne. » Je dirai pourquoi nous n’agissons pas ainsi et pourquoi nous confessons sans crainte notre foi devant les tribunaux. Notre doctrine nous enseigne que Dieu n’a pas fait le monde sans but, mais pour le genre humain : il aime ceux qui cherchent à imiter ses perfections, comme nous l’avons dit antérieurement[4] ; il déteste ceux qui font le mal en parole ou en œuvre. Si nous nous donnons tous la mort, nous serons cause, autant qu’il est en nous, qu’il ne naîtra plus personne, qu’il n’y aura plus de disciples de la loi divine, et même qu’il n’y aura plus d’hommes. Agir ainsi, c’est aller contre la volonté de Dieu. Devant les juges, nous ne nions pas, parce que nous avons conscience de n’être pas coupables ; nous regardons comme une impiété de ne pas dire en tout la vérité ; car c’est là ce qui plaît à Dieu : nous désirons aussi vous délivrer de vos injustes préjugés.</p><p>V. Cette objection pourrait aussi se présenter à l’esprit de quelqu’un : Si Dieu était secourable, comme nous le disons, il ne nous laisserait pas asservir et persécuter par les méchants. Je vais répondre à cette difficulté. Dieu a créé tout le monde, il a soumis à l’homme tout ce qui est sur terre. Par sa loi divine, les astres du ciel, qu’il a créés aussi manifestement pour l’homme, doivent concourir à la croissance des fruits de la terre et au changement des saisons. Il a confié le soin de veiller sur les hommes et sur les créatures qui sont sous le ciel aux anges qu’il a mis à leur tête. Mais les anges, violant cet ordre, ont cherché le commerce des femmes et ont engendré des enfants que nous appelons les démons. Dans la suite, ils se sont asservi le genre humain, soit par la magie, soit par la crainte et les tourments qu’ils faisaient subir, soit en se faisant offrir des sacrifices, de l’encens et des libations, toutes choses dont ils sont avides, depuis qu’ils sont devenus esclaves des passions ; et ils ont semé parmi les hommes le meurtre, la guerre, l’adultère, l’intempérance et tous les maux. Les poètes et les mythologues ne savaient pas que c’étaient les anges et les démons nés d’eux qui avaient commis toutes ces horreurs qu’ils racontaient ; ces fautes contre nature, ces adultères, ces crimes contre les cités et les nations : ils les attribuèrent à Dieu même et aux fils engendrés de lui, à ses prétendus frères, Poséidon et Pluton, et à leurs enfants. Ils donnèrent à chacun d’eux le nom que chacun des anges avait choisi pour lui ou ses enfants.</p><p>VI. Le Créateur de l’univers n’a pas de nom, parce qu’il est non engendré. Recevoir un nom suppose en effet quelqu’un de plus ancien qui donne ce nom. Ces mots Père, Dieu, Créateur, Seigneur et Maître ne sont pas des noms, mais des appellations motivées par ses bienfaits et ses actions. Son Fils, le seul qui soit appelé proprement Fils, le Verbe existant avec lui et engendré avant la création, lorsque au commencement, il fit et ordonna par lui toutes choses[5], est appelé Christ, parce qu’il est oint et que Dieu a tout ordonné par lui. Ce nom même a une signification mystérieuse, de même que le mot Dieu n’est pas un nom, mais une approximation naturelle à l’homme pour désigner une chose inexplicable. Jésus est un nom qui signifie homme et sauveur. Nous l’avons dit antérieurement, le Christ s’est fait homme, il naquit par la volonté de Dieu le Père pour le salut des croyants et la ruine des démons. Vous pouvez vous en convaincre par ce qui se passe sous vos yeux. Il y a dans tout le monde et dans votre ville nombre de démoniaques, que ni adjurations, ni enchantements, ni philtres n’ont pu guérir. Nos chrétiens, les adjurant au nom de Jésus-Christ crucifié sous Ponce-Pilate, en ont guéri et en guérissent encore aujourd’hui beaucoup, en maîtrisant et chassant des hommes les démons qui les possèdent.</p><p>VII. Si Dieu retarde là catastrophe qui doit bouleverser l’univers, et faire disparaître les mauvais anges, les démons et les pécheurs, c’est à cause de la race des chrétiens, en qui il voit un motif de conserver le monde. Sans cela, vous ne pourriez plus faire l’œuvre des démons : le feu du jugement descendrait pour produire la dissolution universelle, comme autrefois le déluge, qui ne laissa personne vivant, si ce n’est, avec les siens seulement, celui que nous appelons Noë, et vous Deucalion, qui fut le père de cette multitude d’hommes mélangée de bons et de méchants. C’est ainsi, disons-nous, qu’aura lieu la conflagration, et non pas, comme le pensent les Stoïciens, par l’absorption des êtres les uns par les autres : cette opinion paraît déraisonnable. Ce n’est pas non plus par la loi du destin qu’arrive ce que l’homme fait ou souffre : chacun fait librement le bien ou le mal. Si les bons, comme Socrate et ceux qui lui ressemblaient, ont été poursuivis, jetés en prison, c’est aux démons qu’il faut l’attribuer, ainsi que l’abondance et la gloire dont ont semblé jouir Sardanapale, Épicure et leurs semblables. C’est ce que n’ont pas compris les Stoïciens, et ils ont dit que tout obéissait à la fatalité du destin. Non, Dieu a fait au commencement les hommes et les anges maîtres d’eux-mêmes, et c’est pourquoi ils seront punis dans le feu éternel du mal qu’ils auront fait. Toute créature est capable de bien et de mal : on n’aurait aucun mérite, si on ne pouvait choisir entre deux voies. La preuve en est dans ces lois et ces principes philosophiques établis selon la saine raison et qui ordonnent de faire ceci et d’éviter cela. Les Stoïciens eux-mêmes, dans leur morale, tiennent ferme à ces lois, ce qui prouve que leur théorie sur les principes des choses et les êtres incorporels n’est pas vraie. Soumettre l’homme à la loi du destin, ou dire que rien n’est dieu à côté de ces choses changeantes, muables, qui se résolvent toujours dans les mêmes éléments, c’est ne rien voir en dehors des choses incorruptibles et mêler Dieu lui-même à la corruption de l’univers dans son ensemble et dans ses parties, ou bien c’est dire que le bien et le mal ne sont rien, ce qui est contraire à toute sagesse, à toute raison et à tout esprit raisonnable.</p><p>VIII. Les Stoïciens ont établi en morale des principes justes : les poètes en ont exposé aussi, car la semence du Verbe est innée dans tout le genre humain. Et cependant nous voyons que ceux qui suivent ces principes sont voués à la haine et à la mort : tels Héraclite, comme nous l’avons déjà dit auparavant, et de notre temps Musonius, et d’autres encore. Nous le répétons, ce sont les démons qui excitent cette haine contre tous ceux qui cherchent en quelque manière à croire selon le Verbe et à fuir le mal. Rien d’étonnant, si les démons, convaincus de cette malice, inspirent plus de haine encore non plus contre ceux qui participent partiellement à ce Verbe répandu partout, mais qui ont la connaissance et l’intuition parfaite de tout le Verbe, qui est le Christ. Ils en seront châtiés et punis justement dans la prison du feu éternel. Car s’ils sont déjà vaincus par les hommes, au nom de Jésus-Christ, c’est une annonce du châtiment qui les attend dans le feu éternel, eux et ceux qui les servent. C’est ce qu’ont prédit tous les prophètes, c’est la doctrine de Jésus notre maître.</p><p>IX. On objectera peut-être, avec les prétendus philosophes, que ce ne sont que des mots et des épouvantails, ce que nous disons du châtiment des méchants dans le feu éternel, et que nous voulons amener les hommes à la vertu par la crainte, et non par l’amour du bien. Je répondrai en peu de mots. Si ces châtiments n’existent pas, il n’y a pas de Dieu ; ou bien, s’il y en a un, il ne s’occupe pas des hommes, il n’y a ni bien ni mal, et, comme nous l’avons dit antérieurement, les législateurs sont injustes, quand ils punissent ceux qui violent leurs sages prescriptions. Mais non, ils ne sont pas injustes, ni eux ni leur Père, qui nous enseigne par son Verbe à l’imiter, et ceux qui ne leur obéissent pas sont injustes[6]. On objectera la diversité des lois humaines ; on dira qu’ici, ceci est bien et cela mal, que là, ce qui était mal ici est bien et que ce qui était bien est mal. Voici ce que je répondrai. Nous savons que les mauvais anges ont établi des lois en rapport avec leur perversité. Ces lois plaisent aux hommes qui leur ressemblent ; mais le Verbe est venu avec sa justice ; il a montré que toutes les opinions et tous les principes n’étaient pas bons, mais qu’il y en a de mauvais et de bons. Voilà ce que je répondrai, ou des choses semblables, à ceux qui font cette objection, et ce que je pourrai développer longuement, si besoin est. Pour le moment, je retourne à mon sujet.</p><p>X. Notre doctrine surpasse toute doctrine humaine, parce que nous avons tout le Verbe dans le Christ qui a paru pour nous, corps, verbe et âme. Tous les principes justes que les philosophes et les législateurs ont découverts et exprimés, ils les doivent à ce qu’ils ont trouvé et contemplé partiellement du Verbe. C’est pour n’avoir pas connu tout le Verbe, qui est le Christ, qu’ils se sont souvent contredits eux-mêmes. Ceux qui vécurent avant le Christ, et qui cherchèrent, à la lumière de la raison humaine, à connaître et à se rendre compte des choses, furent mis en prison comme impies et indiscrets. Socrate, qui s’y appliqua avec plus d’ardeur que personne, vit porter contre lui les mêmes accusations que nous. On disait qu’il introduisait des divinités nouvelles et qu’il ne croyait pas aux dieux admis dans la cité. Il chassa de sa république les mauvais démons et les divinités qui commettaient les crimes racontés par les poètes, et aussi Homère et les autres poètes, et il en détournait les hommes, et les exhortait à chercher à connaître par la raison le Dieu qu’ils ignoraient. « Il n’est pas facile, disait-il, de trouver le Père et le Créateur de l’univers, et quand on l’a trouvé, il n’est pas sûr de le révéler à tous. » C’est ce qu’a fait notre Christ, par sa propre puissance. Personne ne crut Socrate jusqu’à mourir pour ce qu’il enseignait. Mais le Christ, que Socrate connut en partie (car il était le Verbe et il est celui qui est en tout, qui prédit l’avenir par les prophètes et qui prit personnellement notre nature pour nous enseigner ces choses), le Christ fut cru non seulement des philosophes et des lettrés, mais même des artisans et des ignorants en général, qui méprisèrent pour lui et l’opinion et la crainte et la mort ; car il est la vertu du Père ineffable et non une production de la raison humaine.</p><p>XI. Nous ne serions pas mis à mort, les méchants et les démons ne seraient pas plus forts que nous, si la mort n’était due à tous les hommes en général. Nous sommes heureux de payer notre dette. Mais je pense qu’il est bien et à propos de rappeler à Crescens et à ceux qui partagent son aveuglement le mythe de Xénophon. Il dit qu’arrivant à un carrefour, Héraclès rencontra la vertu et le vice sous la figure de deux femmes. Le vice somptueusement vêtu avait un aspect aimable, gracieux, propre à charmer la vue au premier coup d’œil : il promit à Héraclès, s’il voulait le suivre, de le faire jouir sans fin de tous les plaisirs de la vie et de l’éclat dont il le voyait briller lui-même. La vertu, au contraire, avait un visage et un extérieur austère : « Si tu m’écoutes, lui dit-elle, tu ne rechercheras pas des ornements et une beauté fugitive et périssable, mais la beauté éternelle et vraie. » Nous sommes convaincus que qui fuira la beauté apparente pour s’attacher à ce qui passe pour pénible et déraisonnable trouvera le bonheur. Le vice voile ses actions du dehors de la vertu et du bien véritable, en imitant la beauté pure (car il n’a rien et ne peut faire rien de pur), et il asservit les hommes terrestres en revêtant la vertu de sa propre livrée. Mais ceux qui savent comprendre le vrai bien sont incorruptibles par la vertu. Il en est ainsi des chrétiens, des athlètes et des hommes qui pratiquent les vertus que les poètes prêtent à leurs prétendus dieux. Tout esprit sensé peut s’en convaincre en tirant son raisonnement de notre mépris pour la mort, que tout le monde fuit.</p><p>XII. Moi-même, lorsque j’étais disciple de Platon, entendant les accusations portées contre les chrétiens et les voyant intrépides en face de la mort et de ce que les hommes redoutent, je me disais qu’il était impossible qu’ils vécussent dans le mal et dans l’amour des plaisirs. Quel homme adonné au plaisir et à la débauche, aimant à se repaître de la chair humaine, pourrait courir au-devant de la mort et supporter la privation de ses biens ? Ne chercherait-il pas à tout prix à jouir toujours de la vie présente, à se soustraire aux magistrats, bien loin de s’exposer à la mort en se dénonçant lui-même ? Voici ce qu’ont fait les hommes impies, à l’instigation des démons. Ils ont condamné à mort plusieurs des nôtres, sur ces calomnies répandues contre nous ; ils ont mis à la question nos serviteurs, des enfants, de faibles femmes, et par des tortures effroyables ils les ont forcés à nous imputer ces crimes fameux, qu’ils commettent eux-mêmes ouvertement. Que nous importe, puisque nous sommes innocents ? Le Dieu non engendré et ineffable est témoin de nos pensées et de nos actions. Pourquoi en effet ne pas confesser en public que tout cela est bien ? Pourquoi ne pas dire que c’est là une philosophie divine ; que nous célébrons par l’homicide les mystères de Kronos ; que, quand nous nous abreuvons de sang, comme on dit, nous faisons comme l’idole que vous honorez, qui est arrosée non seulement du sang des animaux, mais de sang humain, quand vous offrez, par les mains du plus illustre et du plus noble d’entre vous, une libation du sang des hommes tués ; que nous imitons Zeus et les autres dieux en nous livrant sans retenue à des crimes contre nature et à l’adultère ? Pourquoi ne pas chercher notre justification dans les écrits d’Épicure et des poètes ? Nous cherchons au contraire à inspirer l’horreur de ces choses, nous apprenons à fuir ceux qui les pratiquent et leurs imitateurs, et c’est encore ce que nous nous efforçons de faire dans ce discours, et c’est pour cela qu’on nous poursuit de tous côtés. Peu nous importe ; nous savons que le Dieu juste voit tout. Plût au ciel que encore maintenant, du haut d’une tribune on entendît retentir ces tragiques paroles : « Rougissez, rougissez de charger des innocents de vos propres crimes, d’imputer vos fautes, les vôtres et celles de vos dieux, à des hommes qui n’y ont pas la moindre part. Repentez-vous et changez de conduite. »</p><p>XIII. Voyant donc que, pour détourner les autres hommes, les mauvais démons jetaient ainsi le discrédit sur la doctrine divine des chrétiens, je me moquai et des mensonges et des calomnies et de l’opinion de la multitude. Je suis chrétien, je m’en fais gloire, et, je l’avoue, tout mon désir est de le paraître. Ce n’est pas que la doctrine de Platon soit étrangère à celle du Christ, mais elle ne lui est pas en tout semblable, non plus que celle des autres, Stoïciens, poètes ou écrivains. Chacun d’eux en effet a vu du Verbe divin disséminé dans le monde ce qui était en rapport avec sa nature, et a pu exprimer ainsi une vérité partielle ; mais en se contredisant eux-mêmes dans les points essentiels, ils montrent qu’ils n’ont pas une science supérieure et une connaissance irréfutable. Tout ce qu’ils ont enseigné de bon nous appartient, à nous chrétiens. Car après Dieu nous adorons et nous aimons le Verbe né du Dieu non engendré et ineffable, puisqu’il s’est fait homme pour nous, afin de nous guérir de nos maux en y prenant part. Les écrivains ont pu voir indistinctement la vérité, grâce à la semence du Verbe qui a été déposée en eux. Mais autre chose est de posséder une semence et une ressemblance proportionnée à ses facultés, autre chose l’objet même dont la participation et l’imitation procède de la grâce qui vient de lui.</p><p>XIV. Nous vous demandons de sanctionner cette requête, en telle forme qu’il vous plaira. Ainsi notre doctrine sera connue, et cette connaissance dissipera les préjugés et l’ignorance de la vérité auprès des autres qui, en grand nombre s’exposent au châtiment par leur faute. Car l’homme a par sa nature le pouvoir de connaître le bien et le mal. Car on nous condamne pour des crimes dont on ne sait pas si nous sommes coupables. Car on approuve les dieux qui font ce qu’on nous reproche et qui cherchent parmi les hommes des imitateurs. Ceux qui pour ces prétendus faits nous condamnent à mort, à la prison ou à quelque peine semblable, se condamnent eux-mêmes : ils n’ont pas besoin d’autres juges.</p><p>XV. [J’ai méprisé, parmi les miens, l’enseignement impie et faux de Simon][7]. Si vous sanctionnez cet écrit, nous le ferons connaître à tous, afin que tous, s’il est possible, changent de sentiment. Ce n’est que dans ce but que nous avons composé ce discours. À en juger sainement, notre doctrine n’est pas répréhensible, elle est supérieure à toute philosophie humaine : du moins elle vaut mieux que ce qu’ont écrit Sotadès, Philaenis, Archestrate, Épicure et les autres poètes, dont tout le monde peut lire ou voir représenter les œuvres. Nous nous arrêterons ici : nous avons fait ce qui dépendait de nous. Nous souhaitons que tous les hommes, partout, connaissent la vérité. Puissiez-vous, comme il convient à votre piété et à votre philosophie, dans votre propre intérêt, juger avec justice !</p>
