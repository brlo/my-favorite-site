    body: |-
      <p><i>L’Église de Dieu qui est à Rome, à l’Église de Dieu qui est à Corinthe, aux élus sanctifiés, selon sa volonté, par Jésus-Christ, notre Seigneur : que la grâce, que la paix se multiplient sur vous, par le Dieu tout-puissant, en vertu des mérites de Jésus-Christ</i>.</p><p>C’est à cause des maux et des afflictions qui nous sont survenus tout à coup, et qui se sont succédé sans relâche, que nous avons si longtemps tardé à répondre aux diverses questions que vous nous avez proposées, et à nous occuper de cette division odieuse, impie, en horreur aux élus de Dieu, voyageurs ici-bas : division que des hommes irréfléchis et téméraires ont allumée parmi vous et poussée si loin, que votre nom vénérable, célèbre par toute la terre, digne de l’amour de tous les hommes, est indignement blasphémé.</p><h2>1° Pureté des premières mœurs effacée par les désordres du schisme.</h2><p>Quel étranger, amené parmi vous, ne vantait votre foi si ferme et si riche de vertus, n’admirait la sagesse et la douceur de votre piété envers Jésus-Christ, ne publiait partout la magnificence de votre hospitalité, et ne vous estimait heureux de connaître la vérité d’une manière si parfaite et si certaine[1] !</p><p>Vous faisiez tout sans acception de personne ; vous marchiez dans les voies du Seigneur, soumis à vos pasteurs, et rendant à vos vieillards un juste tribut d’hommages ; vous inspiriez à la jeunesse des sentiments honnêtes et vertueux ; vous recommandiez aux femmes d’agir en tout avec une conscience pure, chaste, irréprochable ; de porter à leurs maris toute l’affection qui leur est due ; enfin, vous leur appreniez, dans la dépendance où la loi de Dieu les a placées, à faire régner la décence dans leurs maisons, la modestie dans toute leur conduite.</p><p>Humbles de cœur, exempts de tout orgueil, soumis plutôt que dominateurs, plus portés à donner qu’à recevoir, vous saviez vous contenter de ce que Dieu nous accorde pour le voyage de cette vie ; vous prêtiez l’oreille la plus attentive à sa parole ; vous élargissiez vos cœurs pour la recevoir ; l’image de ses souffrances était sans cesse sous vos yeux. Alors vous jouissiez d’une paix profonde, honorable ; vous éprouviez un désir insatiable de bonnes œuvres ; l’abondance des dons de l’Esprit saint se répandait sur tous ; remplis d’un zèle saint et d’une pieuse ardeur, vous éleviez vos mains vers le Tout-Puissant avec une tendre confiance, le suppliant de vous pardonner s’il vous échappait quelques fautes involontaires.</p><p>Jour et nuit vous montriez une tendre sollicitude pour vos frères, un désir ardent de voir tous les élus de Dieu parvenir au salut par l’effet de sa miséricorde et par la pureté de leur conscience.</p><p>On admirait votre candeur, votre simplicité, votre disposition à pardonner les injures. La moindre apparence de schisme et de division vous faisait horreur. Vous pleuriez les chutes de vos frères ; vous vous jugiez coupables de leurs fautes. C’était sans regret que vous faisiez le bien, prêts à tous les genres de bonnes œuvres.</p><p>Une vie si digne de respect, si riche de vertus, faisait votre plus bel ornement ; et c’est ainsi que vous accomplissiez tous vos devoirs dans la crainte du Seigneur. Ses préceptes étaient gravés sur les tables de vos cœurs.</p><p>Aussi gloire, bonheur, tout vous était donné avec surabondance ; mais cette parole de l’Écriture s’est accomplie : « Le bien-aimé a bu, il a mangé ; et quand il a été enivré, rassasié de biens, il s’est révolté. »</p><p>De cette source on vit sortir la jalousie et la discorde, les querelles et la rébellion, les persécutions et les troubles, la guerre et la captivité.</p><p>Alors « les derniers du peuple se soulevèrent contre les grands ; des hommes obscurs, contre ceux qui étaient dans la gloire ; les insensés, contre les sages ; les jeunes gens, contre les vieillards. » Ah ! si la justice et la paix se sont éloignées, c’est que la crainte du Seigneur n’habite plus parmi vous ; c’est qu’on s’aveugle au sein même des lumières de la foi ; c’est qu’on sort de la voie tracée par ses enseignements ; c’est qu’on ne vit plus pour le Christ et d’une manière digne de lui ! Chacun marche au gré de ses passions et fait revivre en soi cette envie inique et impie, à laquelle la mort doit son entrée dans le monde.</p><p>Car voici ce qui est écrit : « Il arriva que Caïn présentait au Seigneur des fruits de la terre.</p><p>« Mais Abel offrait les premiers-nés de ses troupeaux et les plus grasses de ses brebis. Le Seigneur jeta des regards favorables sur Abel et sur ses présents, et les détourna de Caïn et de ses sacrifices. Celui-ci en fut vivement affligé, et l’abattement était sur son visage ; le Seigneur lui dit : « Pourquoi es-tu triste ? Pourquoi ton visage est-il abattu ? C’était bien de m’offrir des sacrifices, mais n’as-tu pas péché en usant de réserve ? Cependant, bannis la crainte ; ton frère se tournera vers toi, et tu le domineras. »</p><p>« Et Caïn dit à son frère Abel : « Sortons dans la campagne. » Quand ils y furent arrivés, il se jeta sur son frère Abel et le tua. »</p><p>Vous le voyez, mes frères, le premier fratricide fut l’ouvrage de l’envie.</p><p>L’envie força Jacob, notre père, à fuir la présence de son frère Esaü.</p><p>L’envie suscita contre Joseph des persécutions dont le but était la mort, et qui le réduisirent en servitude.</p><p>Ce fut l’envie qui empêcha Moïse de reparaître devant le roi d’Égypte Pharaon, après qu’il eut entendu l’un des Israélites lui adresser ces paroles :</p><p>« Et qui t’a placé au-dessus de nous comme juge et comme arbitre ? Veux-tu me traiter comme l’Égyptien que tu as tué hier ? »</p><p>L’envie d’Aaron et de Marie les retint hors du camp ; elle précipita vivants, au fond de l’abîme, Dathan et Abiron, révoltés contre Moïse, ce serviteur de Dieu. Par elle, enfin, David fut exposé, non-seulement à la haine des étrangers, mais encore aux persécutions du roi Saül.</p><p>Mais laissons là les faits anciens ; venons aux athlètes de nos jours ; prenons les beaux exemples que nous offre notre siècle.</p><p>Nous verrons l’envie livrer les fidèles enfants de l’Église, ses véritables colonnes, à des persécutions qui ont été jusqu’à la mort. Portons nos regards sur les saints apôtres.</p><p>L’injustice de l’envie a fait passer Pierre par d’innombrables épreuves, qui lui valurent cette couronne du martyre avec laquelle il est entré dans le séjour de la gloire due à ses combats. Elle a fait remporter le prix de la patience à Paul, qui fut jeté sept fois en prison, battu de verges et lapidé.</p><p>Devenu le hérault de l’Évangile, du couchant à l’aurore, il reçut, en récompense de sa foi, une gloire incomparable. Après avoir éclairé le monde entier et s’être avancé jusqu’aux extrémités de l’Occident, il souffrit le martyre par l’ordre des magistrats. C’est ainsi qu’il abandonna la terre pour aller habiter le séjour même de la sainteté, nous laissant un sublime exemple de patience.</p><p>À ces hommes d’une vie toute céleste vint s’adjoindre une multitude d’élus, qui furent comme eux en butte à des outrages, à des tourments sans nombre, et comme eux des modèles admirables.</p><p>Persécutées par l’envie, livrées à des supplices cruels, inouïs, Danaïde et Circé sont restées inébranlables dans la foi, et ont su dans un corps délicat mériter la plus noble récompense.</p><p>La jalousie a séparé les épouses de leurs époux, et effacé cette parole d’Adam notre père : « C’est ici l’os de mes os, la chair de ma chair. »</p><p>Enfin, la jalousie, l’esprit de contention, ont renversé de grandes cités et arraché de leurs fondements de puissants empires.</p><h2>2° Nécessité de la pénitence et de l’humilité, pour revenir à la pureté des mœurs primitives.</h2><p>Ce n’est pas seulement pour votre instruction, mais encore pour la nôtre, que nous vous rappelons ces faits. Nous courons la même carrière, les mêmes combats nous sont imposés.</p><p>Ainsi donc, loin de nous les vaines et misérables rivalités ! Revenons à l’esprit de notre vocation si sublime, si digne de respect.</p><p>Ne voyons que ce qui est juste, ce qui plaît, ce qui est agréable à celui qui nous a donné la vie ; ne détournons jamais nos regards du sang de Jésus-Christ.</p><p>Voyons de quel prix il est devant Dieu, ce sang qui fut versé pour notre salut et qui offrit au monde entier sa réconciliation par la pénitence.</p><p>Si nous remontons la suite de toutes les générations, nous verrons que Dieu, dans tous les âges, a ménagé ce moyen de salut à tous les hommes.</p><p>Noé prêche la pénitence, et les hommes dociles à sa voix sont sauvés.</p><p>Jonas vient annoncer aux Ninivites une ruine entière ; mais ceux-ci font pénitence, appaisent Dieu par leurs prières, et trouvent grâce devant lui, bien qu’ils ne fussent pas de son peuple.</p><p>Les ministres des grâces divines ont parlé de la pénitence d’après l’Esprit saint, et c’est ainsi que le souverain maître en parle lui-même avec serment :</p><p>« Je possède la vie, dit le Seigneur ; je ne veux pas la mort de l’homme pécheur, mais son repentir. »</p><p>Il ajoute ensuite ces touchantes paroles : « Repentez-vous de votre iniquité, maison d’Israël. Dites aux enfants de mon peuple : Vos péchés, formeraient-ils une chaîne non interrompue de la terre au ciel, seraient-ils plus rouges que l’écarlate, plus noirs que les vêtements de deuil, tournez-vous vers moi de tout votre cœur, écriez-vous : Mon père ! et je vous écouterai comme si vous étiez un peuple saint.</p><p>« Ô Sion ! si tu veux écouter ma voix, tu jouiras des fruits de la terre ; mais si tu refuses de m’entendre, le glaive te dévorera, car c’est le Seigneur qui a parlé. »</p><p>Comme il voulait que tous eussent part au salut attaché à la pénitence, il les a affermis par sa volonté toute-puissante.</p><p>Obéissons à cette volonté sainte qui nous comble de biens et d’honneurs ; implorons humblement la clémence de notre Dieu ; renonçons aux œuvres vaines, à l’esprit de contention et de jalousie qui mène à la mort, pour recourir désormais à la miséricorde divine.</p><p>Que nos regards se reportent toujours sur ces hommes qui n’ont jamais cessé de travailler à la gloire du Très-Haut et de publier sa grandeur.</p><p>Voyez Énoch, que son obéissance a fait trouver juste devant le Seigneur, et qui fut transporté dans le ciel sans laisser sur la terre aucune trace de sa mort.</p><p>Noé, reconnu fidèle, fut chargé d’annoncer au monde une génération nouvelle. Par lui, Dieu conserva et maintint en paix les animaux introduits dans l’arche.</p><p>Abraham, appelé l’ami de Dieu, prouva sa fidélité par sa soumission à ses ordres. L’obéissance lui fit quitter pays, parents, maison paternelle ; et, en échange de cette petite contrée, de cette famille peu nombreuse, de cette maison sans éclat qu’il abandonnait, il obtint l’héritage des promesses divines.</p><p>Car c’est ainsi que Dieu lui parle : « Sors de ta terre et de ta parenté, et de la maison de ton père, et viens en la terre que je te montrerai ; et je t’établirai sur une grande nation. »</p><p>Et lorsque Abraham se fut séparé de Loth, Dieu lui dit de nouveau :</p><p>« Lève les yeux, et regarde du lieu où tu es maintenant vers l’Aquilon et le Midi, vers l’Orient et l’Occident. Toute la terre que tu vois, je te la donnerai et à ta postérité pour toujours ; et je multiplierai ta race comme la poussière de la terre. Si quelqu’un d’entre les hommes peut compter les grains de sable, il pourra compter aussi la suite de tes descendants. »</p><p>Abraham crut à Dieu, et sa foi lui fut imputée à justice.</p><p>En récompense de cette foi et de l’hospitalité qu’il aimait à exercer, un fils lui fut donné dans sa vieillesse, et il porta l’obéissance jusqu’à l’offrir à Dieu sur une des montagnes que le Seigneur lui avait indiquées.</p><p>La piété de Loth et son zèle hospitalier le sauvèrent de Sodome, lorsque tout le pays d’alentour fut condamné à périr par le souffre et par le feu.</p><p>Dieu montrait qu’il n’abandonne jamais ceux qui placent en lui leur confiance ; tandis que ceux qui s’égarent dans une voie contraire éprouvent sa justice par des châtiments et des supplices.</p><p>La femme de Loth, sortie de Sodome avec lui, dans des sentiments si différents et si éloignés des siens, devint un exemple de cette justice, puisqu’elle fut changée en une statue de sel, qui subsiste encore aujourd’hui.</p><p>Et par là Dieu voulait nous apprendre que ceux qui manquent de foi et doutent de sa puissance restent, pour les âges à venir, comme une preuve sensible de la sévérité de ses jugements.</p><p>La courtisane Rahab fut aussi sauvée, grâce à sa foi et à l’hospitalité qu’elle exerça.</p><p>Josué, fils de Nun, avait envoyé des espions à Jéricho ; le roi de cette contrée sut qu’ils étaient venus pour reconnaître le pays, et aussitôt il fit partir des hommes chargés de les arrêter et de les mettre à mort.</p><p>Rahab, qui était hospitalière, les reçut chez elle et les cacha sur sa terrasse, sous le lin qui s’y trouvait. Les envoyés du roi se présentèrent et lui dirent : « Chez toi sont entrés des hommes qui viennent reconnaître le pays. Montre-les ; le roi l’ordonne.</p><p>« Les deux hommes que vous cherchez, répondit-elle, sont entrés chez moi, il est vrai, mais ils sont sortis tout aussitôt et continuent leur route. » Elle ne leur découvrit point les espions, et elle dit à ceux-ci : « Je sais que le Seigneur vous a livré cette ville ; l’effroi, l’épouvante se sont répandus sur tous les habitants : quand vous en serez les maîtres, sauvez-moi, ainsi que la maison de mon père. »</p><p>Ils lui répondirent : « Tout doit arriver ainsi que vous l’avez dit.</p><p>« Quand on viendra vous annoncer notre approche, vous rassemblerez tous les vôtres dans cette maison, et ils seront sauvés ; mais tous ceux qu’on trouvera dehors périront. »</p><p>Ils lui recommandèrent encore, pour qu’il leur fût facile de reconnaître la maison, de laisser pendre du toit un ruban d’écarlate : montrant par là que le sang de Jésus-Christ serait un gage de rédemption pour tous ceux qui croient et qui espèrent en Dieu.</p><p>Vous voyez, mes frères, que cette femme n’avait pas seulement la foi, mais encore le don de prophétie.</p><p>Soyons humbles, mes frères, renonçons à tout ce qui est orgueil, faste, déraison, colère. Observons ce qui est écrit. Que nous dit l’Esprit saint ? Que le sage ne se glorifie pas dans sa sagesse, ni le fort dans sa force, ni le riche dans son opulence ; que celui qui se glorifie le fasse dans le Seigneur : qu’il ne recherche que lui ; qu’il pratique la justice et l’équité.</p><p>Rappelons-nous surtout les paroles par lesquelles le Seigneur Jésus nous recommande la douceur et la patience : « Soyez, dit-il, miséricordieux, si vous voulez obtenir miséricorde ; remettez, et on vous remettra ; ainsi que vous agirez, on agira envers vous ; on vous donnera comme vous donnerez ; vous serez jugés ainsi que vous aurez jugé ; on aura pour vous l’indulgence que vous aurez pour les autres, la mesure dont vous aurez usé à leur égard servira envers vous. »</p><p>Affermissons-nous de plus en plus dans la pratique de ces préceptes. Soyons fidèles observateurs des divins oracles, et n’ayons jamais que d’humbles sentiments de nous-mêmes.</p><p>Car Dieu dit encore dans les saintes Écritures : « Sur qui arrêterai-je mes regards, sinon sur l’homme doux, paisible, tremblant à ma voix ? »</p><p>La justice, la piété, nous font un devoir d’obéir à ce Dieu plutôt que de suivre, dans les voies de l’orgueil et de la rébellion, ceux qui ont donné l’exemple d’une détestable jalousie.</p><p>C’est s’exposer non à une perte légère, mais au plus grand péril, que de céder aveuglément à l’impulsion de ces hommes qui poussent aux querelles et aux discordes pour nous écarter du droit chemin.</p><p>Usons de bienveillance les uns à l’égard des autres, prenant pour modèle la douceur et la bonté de celui dont nous tenons la vie. Car il est écrit : « Les bons habiteront la terre ; les justes s’y affermiront, mais les méchants en seront retranchés à jamais. »</p><p>Il est dit ailleurs : « J’ai vu l’impie au plus haut degré d’élévation ; il égalait en hauteur les cèdres du Liban. J’ai passé, et déjà il n’était plus. J’ai cherché sa place, je ne l’ai pas trouvée. Gardez l’innocence, aimez la justice. De grands biens sont tenus en réserve pour l’homme pacifique. »</p><p>Attachons-nous étroitement à ceux qui fondent la paix sur la piété, et non à ces hommes qui veulent une paix fausse et mensongère.</p><p>C’est d’eux qu’il est dit : « Ce peuple m’honore des lèvres, mais son cœur est loin de moi. »</p><p>Et ailleurs : « Ils me flattaient des lèvres, ils me maudissaient dans le cœur. »</p><p>Et dans un autre endroit : « Ils l’aimaient seulement de bouche, leur langue mentait au Seigneur ; mais leur cœur n’était pas droit devant lui. Ils n’ont point été fidèles à son alliance. Que les lèvres trompeuses deviennent muettes ! Dieu confondra la bouche qui trompe et la langue qui se glorifie. Ils ont dit : Nous glorifierons notre parole ; nos lèvres sont à nous, et quel est donc notre maître ? À cause de la désolation des opprimés et du gémissement des pauvres, je me lèverai, dit le Seigneur ; je les placerai en lieu sûr, et je serai fidèle à ma parole. »</p><p>Jésus-Christ est avec l’homme qui pense humblement de lui-même, et non avec ceux qui élèvent au-dessus de son troupeau une tête orgueilleuse.</p><p>Jésus-Christ, notre Seigneur, le sceptre de la majesté divine, malgré sa puissance, est-il venu au monde en étalant le faste et l’orgueil ? N’est-il pas venu, au contraire, dans l’humilité, ainsi que l’Esprit saint l’avait annoncé ? « Seigneur, s’écrie-t-il, qui croira à votre parole ? Pour qui le bras du Seigneur a-t-il été révélé ? Il s’élèvera en la présence de Dieu comme un arbrisseau, comme un rejeton qui sort d’une terre aride. Il n’a ni éclat, ni beauté ; nous l’avons vu, il était méconnaissable ; méprisé, le dernier des hommes, homme de douleurs, il est familiarisé avec la misère ; son visage était obscurci par les opprobres et par l’ignominie, et nous l’avons compté pour rien. Il a vraiment porté lui-même nos infirmités ; il s’est chargé de nos douleurs. Oui, nous l’avons vu comme un lépreux, frappé de Dieu et humilié. Il a été blessé lui-même à cause de nos iniquités ; il a été brisé pour nos crimes ; le châtiment qui doit nous procurer la paix s’est appesanti sur lui ; nous avons été guéris par ses meurtrissures. Nous nous sommes tous égarés comme des brebis ; chacun de nous suivait sa voie, et le Seigneur a fait tomber sur lui l’iniquité de tous. Au milieu des douleurs, il n’a point ouvert la bouche ; il a été à la mort comme un agneau ; il est demeuré comme une brebis devant celui qui la tond ; il est mort au milieu des humiliations après un jugement. Qui racontera sa génération ? Il a été retranché de la terre des vivants. Je l’ai frappé pour les crimes de mon peuple. »</p><p>Et dans un autre endroit, Jésus-Christ parle ainsi lui-même : « Pour moi, je suis un ver de terre et non un homme. Je suis l’opprobre des hommes et le rebut du peuple. Tous ceux qui me voient m’insultent ; le mépris sur les lèvres, ils ont secoué la tête en disant : Il a mis son espoir en Dieu ; que Dieu le délivre ; que Dieu le sauve, puisqu’il se plaît en lui. »</p><p>Vous voyez, mes chers frères, le modèle qui nous a été donné. Si le souverain maître s’est abaissé à ce degré d’humilité, que ferons-nous donc, nous qui devons tout à sa grâce, nous qui sommes placés sous le joug de sa miséricorde ?</p><p>Retraçons en nous l’humilité de ces hommes qu’on voyait couverts de peaux de chèvres et de brebis, allant partout prêcher l’avénement de Jésus-Christ. Nous voulons parler ici des prophètes Élie, Élisée, d’Ézéchiel, et de tant d’autres qui ont mérité d’être loués par l’Esprit saint dans les divines Écritures.</p><p>C’est là qu’Abraham est honoré du plus glorieux témoignage : il est appelé l’ami de Dieu. Mais lui, uniquement occupé de la gloire du Seigneur, s’humilie en s’écriant : « Je ne suis que cendre et poussière ! »</p><p>Il est ainsi parlé de Job : « Simple et droit, il craignait le Seigneur et fuyait le mal. » Pour lui, s’accusant lui-même, il dit : « Personne n’est sans souillure, sa vie ne fût-elle que d’un jour. »</p><p>Et Moïse, trouvé fidèle dans tout ce qui regardait le service du Seigneur, Moïse, dont Dieu employa le ministère pour dérober Israël aux coups et aux outrages qui l’accablaient, est loin de parler magnifiquement de lui-même au milieu des honneurs qui l’entourent. Lorsque, du sein d’un buisson, la voix de Dieu lui parle, il s’écrie : « Qui suis-je, pour que vous m’interrogiez ? Ma voix est faible, ma langue est embarrassée. » Et ailleurs : « Je ne suis qu’une légère vapeur qui s’élève d’un vase. »</p><p>Mais que dirons-nous de David, honoré du plus glorieux suffrage, celui de Dieu même, qui lui parle en ces termes : Enfin, j’ai trouvé un homme selon mon cœur ; c’est David, fils de Jessé. Je l’ai sacré avec l’huile sainte. » Et David, parlant au Seigneur, lui dit : « Ô mon Dieu ayez pitié de moi, selon la grandeur de vos miséricordes ; lavez-moi de plus en plus de mes souillures ; effacez mon iniquité ! J’ai péché contre vous, contre vous seul, et j’ai fait le mal en votre présence ; j’ai été conçu dans l’iniquité ; ma mère m’a conçu dans le péché. »</p><h2>3° Amour que Dieu manifeste pour la paix ; dispositions qu’il demande pour la faire régner.</h2><p>C’est l’humilité de ces hommes si grands et si honorés, c’est leur respect pour l’obéissance, qui nous a rendus meilleurs, ainsi que tous les âges précédents et tous les hommes qui ont reçu les divins oracles avec droiture et avec crainte.</p><p>Instruits par tant d’illustres et de glorieux exemples, revenons à cette paix que nous goûtions autrefois ; portons sans cesse nos regards vers notre père, l’auteur de tout ce qui existe. Attachons-nous à cette paix qu’il nous a apportée, ce don par excellence, ce bienfait qui surpasse tous les autres.</p><p>Contemplons Dieu par la pensée, considérons des yeux de l’esprit sa volonté toujours amie de la paix ; voyons comme cet amour se manifeste dans toutes ses œuvres.</p><p>Les cieux, mis en mouvement par sa main puissante, lui restent paisiblement soumis.</p><p>Le jour et la nuit fournissent la carrière qu’il leur a prescrite, et jamais ne se nuisent l’un à l’autre.</p><p>Le soleil, la lune, les chœurs des astres, décrivent selon ses ordres, dans une harmonie parfaite, sans la plus légère déviation, les orbites qui leur furent tracés.</p><p>La terre, toujours féconde, produit dans chaque saison, d’après sa volonté, une nourriture abondante pour l’homme et pour tous les animaux, sans résistance de sa part, sans le moindre changement aux lois qu’elle a reçues.</p><p>Les abîmes qu’on ne peut pénétrer, les profondeurs de la terre qu’on ne peut dévoiler, respectent également ses ordres.</p><p>La masse profonde de la mer immense, d’après la disposition du Créateur, s’enfle, s’élève en montagne, et ne franchit point les barrières placées autour d’elle : tel est l’ordre qu’elle a reçu ; elle l’exécute.</p><p>Car le Seigneur lui a dit :</p><p>« Tu viendras seulement jusque là ; et là se brisera l’orgueil de tes flots. »</p><p>L’Océan, d’une profondeur impénétrable, et les mondes semés au delà de l’Océan[2], sont gouvernés par les mêmes lois.</p><p>Les diverses saisons, le printemps, l’été, l’automne et l’hiver, se succèdent paisiblement l’une à l’autre.</p><p>Les vents, tenus en équilibre, s’acquittent de leur devoir dans leur temps et ne rencontrent pas le plus léger obstacle.</p><p>Des sources toujours jaillissantes, créées pour l’usage de la vie et la santé du corps, ne cessent de présenter à l’homme leurs eaux inépuisables et de soutenir son existence.</p><p>Enfin, les plus petits animaux forment des familles où règnent l’union et la paix.</p><p>C’est ainsi que le grand ouvrier, le maître de l’univers, a voulu que tout se maintînt dans la paix et dans l’harmonie, prodiguant ses bienfaits à tous, mais les répandant avec surabondance sur nous, qui trouvons sans cesse dans sa clémence un refuge assuré par notre Seigneur Jésus-Christ. Honneur et gloire lui soient rendus dans tous les siècles des siècles !</p><p>Craignons, mes bien-aimés, que tant de bienfaits de sa part ne tournent contre nous, si notre vie n’est pas conforme à sa volonté, si nous ne faisons point sous ses yeux ce qu’il lui plaît, dans un esprit d’union et de paix.</p><p>L’Écriture nous dit quelque part : « L’esprit de Dieu est un flambeau qui pénètre les cœurs. »</p><p>Songeons que le Seigneur est près de nous ; que pas une de nos pensées, pas un des raisonnements que nous formons ne lui échappe.</p><p>Il est donc juste de ne pas se dérober à sa volonté comme des transfuges. Ce n’est point à des hommes insensés, superbes, pleins de vanité dans leurs discours, qu’il faut craindre de déplaire, mais à Dieu.</p><p>Rappelons nos femmes à leurs devoirs ; qu’elles montrent des mœurs pures et aimables, un esprit de douceur véritable et sincère ; qu’elles manifestent leur discrétion par leur silence ; qu’elles n’écoutent pas leurs affections particulières, mais qu’elles montrent une égale tendresse à tous ceux qui craignent véritablement le Seigneur.</p><p>Élevons nos enfants selon la doctrine de Jésus-Christ ; qu’ils apprennent quel est le prix de l’humilité aux yeux de Dieu, combien ont de force auprès de lui la charité et l’innocence du cœur ; combien sa crainte est utile et honorable, comme elle est la sauve-garde de toute âme pure et sainte, qui vit selon lui. Et qui ne l’aurait pas cette crainte ?</p><p>Le Seigneur pénètre nos pensées et nos desseins, lui dont l’esprit habite en nous et se retire quand il lui plaît.</p><p>C’est une vérité que nous enseigne la foi en Jésus-Christ. Il nous presse ainsi lui-même par l’Esprit-Saint : « Venez, mes enfants, écoutez-moi ; je vous enseignerai la crainte du Seigneur. Quel est l’homme qui veut la vie, qui soupire après les jours de bonheur ? Préservez votre langue de la calomnie et vos lèvres des discours artificieux ; éloignez-vous du mal et faites le bien ; cherchez la paix et poursuivez-la sans relâche. Les yeux du Seigneur sont ouverts sur les justes ; ses oreilles sont attentives à leurs cris. Mais le regard de sa colère est sur ceux qui font le mal ; il efface de la terre jusqu’à leur souvenir. Les justes ont poussé des cris, et le Seigneur les a exaucés et les a délivrés de tous leurs maux. »</p><p>Les maux des pécheurs sont sans nombre ; mais le Seigneur environne de sa miséricorde ceux qui espèrent en lui.</p><p>Père de bonté et de miséricorde, il a des entrailles de charité pour ceux qui le craignent, et il répand ses grâces, si douces, si suaves, pleines de charité, sur ceux qui s’approchent de lui avec un cœur droit.</p><p>Soyons donc sans défiance, sans incertitude sur la grandeur et la richesse de ses dons.</p><p>Loin de nous le langage de ces hommes dont parle l’Écriture :</p><p>« La misère est le partage de ceux qui ont le cœur double et incertain, et qui disent : Oui, voilà ce que nous entendions répéter par nos pères ;</p><p>« Nous sommes parvenus à la vieillesse, et rien de tout cela ne se réalise pour nous. »</p><p>Ô insensés ! comparez-vous à un arbre. Supposez la vigne : elle bourgeonne d’abord ; un bouton se montre, puis la feuille, ensuite la fleur ; après cela un raisin d’abord vert et acerbe, puis enfin mûr et parfait.</p><p>Vous voyez comme, en peu de temps, le fruit de cet arbre est parvenu à sa maturité ; aussi certainement s’accomplira, dans peu et tout à coup, la volonté de Dieu ; témoins ces paroles de l’Écriture :</p><p>« Le Seigneur, le Saint que vous attendez, viendra bientôt dans son temple. »</p><p>Voyez, mes bien-aimés, comme le Seigneur place sans cesse sous nos yeux des preuves de cette résurrection, dont il nous a donné les prémices dans Jésus-Christ, son fils, en le rappelant à la vie. Voyez, dis-je ; cette résurrection qui se renouvelle à tout moment.</p><p>Le jour et la nuit nous la manifestent : la nuit se couche, le jour se lève ; le jour s’en va et la nuit arrive.</p><p>Voyons les fruits. Ce qui arrive à la semence est connu de tout le monde : le semeur va dans son champ, il la jette en terre. Ainsi répandues, les graines, qui tombent arides et desséchées, se décomposent au bout d’un temps marqué ; après leur décomposition, la vertu toute-puissante de Dieu les ranime, et, d’une seule, elle fait naître plusieurs fruits qui en produisent beaucoup d’autres à leur tour.</p><p>Considérons encore le prodige qui a lieu dans certaines contrées de l’Orient, c’est-à-dire en Arabie.</p><p>On y trouve un oiseau qui s’appelle phénix ; il est seul et unique de son espèce. Cet oiseau vit environ six cents ans ; quand sa fin approche, il se fait un nid composé de myrrhe, d’encens et d’autres aromates ; puis il entre dans ce nid et y meurt. De sa chair putréfiée naît un ver qui se nourrit d’abord de la substance de l’oiseau mort, et qui se couvre ensuite de plumes.</p><p>Devenu plus fort, il emporte le petit tombeau qui renferme les restes de son prédécesseur, et, chargé de ce précieux fardeau, il passe d’Arabie en Égypte, jusqu’à la ville d’Héliopolis ; et là, en plein jour, sous les yeux de tous les spectateurs, il vient, en volant, le déposer sur l’autel du soleil et disparaît aussitôt.</p><p>De leur côté, les prêtres égyptiens consultent avec soin leurs livres sur les époques, et trouvent que cet oiseau est venu précisément au bout de cinq cents ans[3].</p><p>Devons-nous, après cela, trouver surprenant si le divin ouvrier de toutes choses ressuscite un jour ceux qui l’ont servi avec piété et avec une foi pleine de confiance, puisque, par l’exemple de cet oiseau, il met au grand jour la magnificence de ses promesses ?</p><p>Car il est dit : « Vous ranimerez ma poussière, et je chanterai vos louanges ; » et ailleurs : « Je me suis endormi, j’ai été plongé dans un sommeil profond, et je me suis réveillé parce que le Seigneur est avec moi. »</p><p>Et Job s’écrie de son côté : « Vous la ressusciterez cette chair qui a souffert tant de maux ! »</p><p>Que nos cœurs soutenus de cette espérance s’attachent à ce Dieu, fidèle dans ses promesses et juste dans ses jugements. Loin de nous tromper, il nous défend de mentir. Rien n’est impossible à Dieu, si ce n’est le mensonge.</p><p>Réveillons dans nos cœurs la confiance en lui et songeons que tout est sous sa main.</p><p>Il a tout élevé par la puissance de sa parole, et par elle il peut tout renverser.</p><p>Qui peut lui dire : « Pourquoi avez-vous fait cela ? » ou qui pourrait résister à la force de son bras ?</p><p>Il a tout fait quand il a voulu et comme il a voulu, et tout ce qu’il a décrété aura son effet.</p><p>Tout est sous ses regards, rien n’échappe à sa connaissance.</p><p>Puisque nous pouvons partout voir et entendre ces vérités, craignons le Seigneur ; renonçons aux désirs impurs, aux œuvres mauvaises, afin qu’au jugement à venir nous soyons couverts de sa miséricorde.</p><p>Où se dérober à sa main toute-puissante ? Quel monde pourrait servir d’abri à l’homme qui voudrait lui échapper ?</p><p>C’est ainsi que parle l’Écriture.</p><p>Où irai-je ? où fuir devant votre face ? Si je monte au ciel, vous y êtes ; si je vais aux extrémités de la terre, j’y trouve votre main ; si je descends au fond des abîmes, votre esprit est là.</p><p>Où se cacher, où fuir celui qui embrasse tout ?</p><p>Allons à lui avec l’innocence du cœur ; élevons vers son trône des mains pures et sans tache ; aimons ce père de bonté et de miséricorde qui nous a fait participer à son élection divine.</p><p>Il est écrit : « Quand le Très-Haut fit la division des peuples, quand il dissémina sur la terre les enfants d’Adam, il marqua les limites des nations selon le nombre des enfants d’Israël. Mais la part du Seigneur fut Jacob, Israël fut son héritage. » Et ailleurs : « Dieu s’est choisi un peuple du milieu des autres peuples, comme un homme choisit les prémices de ses fruits, et de ce peuple sortira le Saint des Saints. »</p><p>Puisque nous sommes le partage du Dieu saint, il faut que toutes nos actions tendent à la sainteté ; dès lors loin de nous la médisance, l’impureté, l’excès du vin, l’arrogance, toute passion honteuse, l’adultère si odieux, l’orgueil si détestable.</p><p>« Car Dieu, dit l’Écriture, résiste aux superbes et donne sa grâce aux humbles. »</p><p>Lions-nous étroitement à ceux que Dieu remplit de sa grâce ; que la paix soit comme notre vêtement ; soyons humbles, chastes, attentifs à éviter tout murmure, toute médisance ; justes en œuvres et non pas seulement en paroles.</p><p>« Car, dit l’Écriture, celui qui parle beaucoup écoutera à son tour. » La multitude des paroles prouve-t-elle qu’on est juste ? L’homme, né de la femme, a une vie très-courte : ne la perdez pas dans la multitude des paroles.</p><p>Plaçons notre gloire dans le Seigneur ; ce n’est pas de nous qu’elle doit sortir, Dieu déteste celui qui se loue lui-même.</p><p>Laissons aux autres le soin de rendre témoignage à nos bonnes œuvres, ainsi qu’il fut rendu à nos pères, ces hommes si justes.</p><p>La témérité, l’arrogance, l’audace, caractérisent ceux que Dieu rejette loin de lui ; tandis que la modération, l’humilité, la douceur, sont le partage de ceux qu’il a bénis.</p><p>Recherchons avant tout cette bénédiction sainte, et voyons quel est le moyen de l’obtenir ; rappelons dans notre esprit ce qui s’est passé dès les premiers jours.</p><p>Pourquoi notre père Abraham a-t-il été béni ? N’est-ce point à cause des œuvres de justice et de vérité qu’il a faites par la foi ?</p><p>Isaac, plein de confiance dans ce qui devait arriver, s’offrit volontairement en sacrifice.</p><p>Jacob, humblement soumis, sort de son pays pour échapper à son frère, se retire chez Laban, devient son serviteur, et les douze sceptres d’Israël sont remis entre ses mains.</p><p>Interrogez les faits séparément et avec attention ; alors vous comprendrez toute l’étendue des dons que Dieu a répandus sur nous par ce patriarche :</p><p>De lui sont sortis les prêtres et les lévites qui servent devant l’autel du Seigneur ; de lui est né, selon la chair, le Seigneur Jésus ; de lui sont descendus les rois, les princes, les chefs du peuple, par la tribu de Juda ; et les autres tribus, dont il est aussi la tige, n’ont pas été sans gloire. Dieu lui avait fait cette promesse : « Ta race sera aussi nombreuse que les étoiles du ciel. »</p><p>Toutefois ces saints patriarches n’ont acquis tant de gloire et de grandeur, ni par eux-mêmes, ni par leurs œuvres, ni par tout le bien qu’ils ont pu faire, mais par la volonté de Dieu seul.</p><p>Et nous aussi, appelés à la connaissance de Jésus-Christ, grâce à cette même volonté, si nous sommes justifiés, ce n’est point par nous-mêmes, ni à raison de notre sagesse, de notre intelligence ou de notre piété, ni par aucune œuvre sainte, faite avec un cœur pur, mais par la foi dont le Dieu tout-puissant s’est toujours servi pour justifier tous ceux qu’il a sauvés. À lui la gloire dans tous les siècles !</p><p>Que ferons-nous donc, mes frères ? Faut-il pour cela cesser de faire le bien, abandonner les œuvres de charité ? Jamais Dieu ne l’approuverait. Portons-nous, au contraire, avec zèle et ardeur à tous les genres de bonnes œuvres.</p><p>Est-ce que le divin ouvrier, le maître de toutes choses, ne s’applaudit pas lui-même dans ses œuvres ?</p><p>Les cieux ont été affermis par sa suprême et souveraine puissance, et embellis par son incompréhensible sagesse.</p><p>Il a séparé la terre de l’eau qui l’environne ; il l’a consolidée comme une tour inébranlable, en lui donnant pour base sa volonté ; et tous les animaux qui s’y trouvent ont reçu de lui l’ordre de l’habiter.</p><p>Sa puissance a creusé le lit de la mer, et renfermé dans son sein tous les poissons qu’elle nourrit et qui auparavant avaient reçu de lui la vie.</p><p>De ses mains pures et saintes il a formé l’homme, son chef-d’œuvre, supérieur à toutes les créatures par l’intelligence, l’empreinte de son image.</p><p>Dieu s’exprime ainsi lui-même : « Faisons l’homme à notre image et à notre ressemblance. » Et après avoir fini de créer, il approuva son ouvrage, bénit ses créatures, et leur dit : « Croissez et multipliez. »</p><p>Comprenons par là que les bonnes œuvres font l’ornement des justes ; et Dieu lui-même, après s’être comme paré de ses ouvrages, se réjouit.</p><p>Puisque nous avons ce modèle sous les yeux, faisons-le revivre en nous, conformons-nous à sa volonté, et travaillons de toutes nos forces à faire des œuvres de justice.</p><p>Le bon ouvrier reçoit avec confiance le prix de son travail ; mais le lâche, le paresseux n’ose regarder en face le maître qui l’emploie. Soyons donc prompts à faire le bien ; de là dépend tout notre avenir. Car il nous est dit d’avance : « Voici le Seigneur qui vient ; le prix de la victoire est entre ses mains ; il va rendre à chacun selon ses œuvres. »</p><p>Aussi Dieu nous engage, avec effusion de cœur, à n’être ni lents, ni tardifs pour le bien.</p><p>Plaçons en lui notre gloire et notre confiance.</p><p>Voyez l’innombrable multitude d’anges qui l’environnent, et leur promptitude à exécuter ses ordres.</p><p>« Mille millions d’anges le servaient, nous dit l’Écriture ; dix mille millions étaient devant lui, et ils s’écriaient : Saint, saint, saint est le Dieu des armées ; toute créature est remplie de sa gloire ! »</p><p>Ne faisons aussi qu’un seul et même cœur ; crions vers lui de toutes nos forces, lui demandant, tous ensemble, comme d’une seule bouche, qu’il nous fasse participer à ses grandes et magnifiques promesses.</p><p>Car il nous dit par son prophète : « L’œil n’a point vu, l’oreille n’a point entendu, le cœur de l’homme n’a point conçu quels biens Dieu tient en réserve pour ceux qui espèrent en lui. »</p><p>Que de bonheur renfermé dans les dons de Dieu ! qu’ils sont admirables, ô mes bien-aimés ! La vie avec l’immortalité, la splendeur avec la justice, la vérité avec la liberté, la foi avec la confiance, la continence avec la sainteté : trésors de grâce que nous trouvons ici-bas.</p><p>Mais que de biens sont préparés dans l’avenir à ceux qui placent en Dieu leur espérance ! Le Dieu de sainteté, le père de tous les siècles, en connaît seul la grandeur et l’excellence. Oh ! faisons tous nos efforts pour être du nombre de ceux qui vivent dans cette attente et veulent avoir part aux dons qu’il a promis ! Et comment parviendrons-nous, mes frères, à ce bonheur ? Nous l’obtiendrons, si notre esprit est toujours ferme dans la foi ; si nous cherchons ce qui plaît, ce qui est agréable à Dieu ; si nous faisons tout ce qui est conforme à sa volonté sainte ; si nous suivons le chemin de la vérité, rejettant loin de nous l’injustice, l’iniquité, l’avarice, les disputes, les fraudes et les ruses, les murmures et les médisances, la haine de Dieu, l’orgueil et l’ostentation, la fausse gloire et l’amour de la vanité.</p><p>Car ceux qui font le mal sont odieux au Seigneur ; et non-seulement ceux qui le font, mais encore ceux qui l’approuvent.</p><p>Voici ce que dit le Seigneur, c’est Dieu qui parle à l’impie : « Est-ce à toi qu’il appartient de parler de mes décrets ? Pourquoi ta bouche annonce-t-elle mon alliance ? Tu hais l’ordre, et tu as rejeté ma parole derrière toi. Quand tu voyais un séducteur, tu courais à lui ; tu as partagé l’héritage des adultères.</p><p>« Tu as rassasié ta bouche de malice, et ta langue a préparé la fraude. Tranquillement assis, tu parlais contre ton frère ; tu couvrais d’opprobre le visage de ta mère. Voilà ce que tu as fait ; et je me suis tû ! Ton iniquité m’a jugé semblable à toi ; je t’accuserai, je t’exposerai à tes propres yeux.</p><p>« Comprenez maintenant, vous qui oubliez le Seigneur, de peur que je ne vous saisisse ; et personne ne vous délivrera. Le sacrifice de louange est le culte qui m’honore, c’est la voie par laquelle je manifesterai le salut du Très-Haut. »</p><p>Et cette voie où nous trouvons le salut, c’est Jésus-Christ, le pontife qui présente nos offrandes ; Jésus-Christ, le soutien, l’appui de notre faiblesse.</p><p>Par lui nous pourrons attacher nos regards au plus haut des cieux ; par lui nous contemplerons la beauté divine, souveraine, sans tache ; par lui les yeux de notre cœur se sont ouverts ; par lui, et à la clarté de son admirable flambeau, notre esprit sans intelligence et plongé dans la nuit reprend une vie nouvelle.</p><p>Par lui enfin Dieu a voulu nous faire goûter le fruit de la science immortelle. Il est, en effet, la splendeur de sa gloire, aussi supérieur aux anges que le nom qu’il a reçu l’emporte sur celui de ses créatures. Car il est écrit au sujet des anges : « Dieu a pris les esprits pour ambassadeurs et les flammes pour ministres. »</p><p>Mais voici ce que le Seigneur dit de son fils : « Tu es mon fils ; je t’ai engendré aujourd’hui ; demande-moi, et je te donnerai les nations pour héritage et la terre pour empire. »</p><p>Et ailleurs, il lui parle ainsi à lui-même : « Asseyez-vous à ma droite, jusqu’à ce que je réduise vos ennemis à vous servir de marche-pied. » Et quels sont ces ennemis ? Ceux dont le cœur est mauvais, ceux qui opposent leur volonté à la volonté divine.</p><p>Pour nous, combattons en braves soldats de toutes nos forces, sous ce chef dont les ordres sont toujours justes.</p><p>Voyons ceux qui portent les armes sous nos princes : avec quel ordre, quelle promptitude, quelle soumission ils exécutent le commandement !</p><p>Tous ne sont pas bons préfets, ni tribuns, ni centurions, ni officiers ; il ne se trouve dans un corps, ni cinquante préfets des soldats, ni cinquante officiers des grades suivants ; mais chacun dans son rang exécute les ordres du général ou des autres chefs.</p><p>Les grands ne peuvent être sans les petits, ni les petits sans les grands. Partout cette fusion existe, elle est nécessaire pour le service. Voyons notre corps : la tête sans les pieds n’est rien, ni les pieds sans la tête ; les moindre parties sont utiles, nécessaires au corps entier : toutes conspirent au même but : sa conservation, et toutes dans cette vue sont soumises à une même dépendance.</p><p>Qu’ainsi se conserve tout ce corps que nous formons en Jésus-Christ ; que chacun de nous soit soumis à son frère selon la mesure de grâce qui lui a été départie.</p><p>Que le fort n’outrage point le faible, que le faible respecte le fort ; que le riche fasse du bien au pauvre, et que le pauvre rende grâce à Dieu de lui avoir donné le riche pour l’aider dans sa misère.</p><p>Que le sage montre sa sagesse, non par de vains discours, mais par de bonnes œuvres ; que celui qui est vraiment humble ne se rende pas témoignage à lui-même, mais qu’il laisse ce soin à d’autres.</p><p>Que celui dont le corps est pur ne s’enfle pas d’orgueil. Qu’il sache que c’est d’un autre que lui que vient le don de la continence.</p><p>Rappelons-nous, mes frères, de quelle matière nous avons été formés, ce que nous étions, dans quel état nous sommes entrés dans ce monde, sortant comme d’un sépulcre et du sein des ténèbres.</p><p>Le Dieu auteur de notre être nous a introduits dans ce monde, son ouvrage, où ses dons nous étaient préparés d’avance.</p><p>Puisque nous avons tout reçu de lui, nous devons lui rendre grâce de tout : à lui donc la gloire dans tous les siècles des siècles.</p><p>Le fou et l’insensé, l’homme vain et l’ignorant, se moquent et se rient de nous ; ils cherchent, par l’orgueil de leurs pensées, à s’élever au-dessus des autres.</p><p>Mais que peut un faible mortel ? Quelle force dans un peu de terre ? Car il est écrit : « Une image inconnue s’arrêta devant mes yeux, et j’entendis sa voix comme un léger souffle. L’homme sera-t-il justifié devant Dieu ? Sera-t-il pur devant son créateur ?</p><p>« Ceux qui étaient ses ministres ont été ébranlés, et il a trouvé le mal dans les anges, et les cieux mêmes ne sont pas purs devant lui. Le sont-ils, ceux qui habitent des maisons d’argile et qui sont faites de boue ainsi que nous ? Dieu les a frappés ; ils seront rongés des vers. Du matin au soir, la faux les moissonne ; et parce qu’aucun d’eux n’a compris, ils périront éternellement. Toute leur gloire meurt avec eux ; ils ont passé, ils n’avaient pas la sagesse.</p><p>« Appelle maintenant quelqu’un pour te répondre ; invoque le secours des esprits célestes ; la colère tue l’insensé et l’envie achève sa ruine. J’ai vu l’impie affermi dans ses racines, et aussitôt j’ai maudit son éclat. Ses enfants ont vécu dans la misère ; foulés aux pieds près des portes de la ville, nul ne les a défendus. L’homme affamé a dévoré ses moissons, malgré la haie qui les entoure ; l’homme altéré a bu ses richesses. »</p><h2>4° Ordre que Dieu a établi dans son Église, respect dû à cet ordre.</h2><p>Puisque toutes ces vérités nous ont été dévoilées, puisque nous pénétrons maintenant jusque dans les profondeurs de la science divine, faisons avec ordre tout ce que Dieu nous a prescrit de faire.</p><p>Il a voulu qu’à des temps marqués, à des heures, à des moments déterminés, on fît les offices et les oblations avec ordre et décence.</p><p>Il a même prescrit, d’après sa volonté souveraine, en quel lieu et par qui serait fait tout ce qui tient à son culte, afin que toutes les fonctions remplies avec un cœur pur et droit et selon son désir lui fussent agréables.</p><p>Ainsi donc ceux qui font leurs oblations aux temps marqués sont sûrs d’être agréés, et par là même heureux ; car ils suivent les règles établies par le Seigneur lui-même, et dès lors ils ne peuvent s’égarer.</p><p>Chez les Juifs, le souverain pontife a des fonctions particulières, le prêtre un rang qui lui est propre, les lévites un ministère déterminé, le laïque des observances qui lui conviennent.</p><p>C’est ainsi, mes frères, que chacun de vous doit, dans la place où il se trouve, rendre grâce à Dieu, vivre avec une conscience pure, sans jamais sortir des règles de son ministère, ni des bornes de la modestie.</p><p>Chez les Juifs encore, on n’offre point partout le sacrifice perpétuel, ni le sacrifice pour les vœux, ni le sacrifice pour les péchés et les fautes légères, mais à Jérusalem seulement ; et là même, on ne l’offre pas dans tous les endroits de la ville indistinctement, mais devant le temple, à l’autel, quand la victime a été trouvée bonne par le souverain pontife et les autres prêtres dont nous avons parlé. Si quelqu’un enfreint les règles que Dieu même a fixées, il est puni de mort.</p><p>Vous le comprenez, mes frères : plus les lumières dont nous avons été honorés au sujet du sacrifice[4] l’emportent sur celles des Juifs, plus il nous faut craindre d’en abuser.</p><p>Les apôtres nous ont prêché l’Évangile de la part de notre Seigneur Jésus-Christ, et Jésus-Christ de la part de Dieu. Dieu a envoyé Jésus-Christ, et Jésus-Christ les apôtres ; tout ici s’est passé régulièrement d’après la volonté du Seigneur. La mission donnée, les apôtres déjà persuadés par le miracle de la résurrection de Jésus-Christ, affermis depuis dans la foi par le Verbe lui-même, pleins des dons de l’Esprit saint, et par là au-dessus de toute crainte, sortirent du Cénacle annonçant l’approche du royaume de Dieu.</p><p>Lorsqu’ils annoncèrent la vérité dans les villes et les provinces, ils éprouvèrent les premiers convertis, à la faveur des lumières du Saint-Esprit, et les établirent évêques ou diacres sur ceux qui devaient croire. Et ce n’était pas une innovation, car depuis longtemps l’Écriture avait parlé d’évêques et de diacres, puisqu’il est dit quelque part : « J’affermirai leurs évêques dans la justice et leurs diacres dans la foi. »</p><p>Faut-il s’étonner si les apôtres, à qui le pouvoir de Jésus-Christ fut confié par le Seigneur lui-même, ont établi ceux dont nous venons de parler, puisque Moïse, ce saint et fidèle serviteur, fut ainsi placé sur toute la maison du Seigneur, et qu’il a consigné dans les livres saints tout ce qui lui fut prescrit ; et il eut en cela pour imitateurs les autres prophètes, qui s’accordent tous à rendre hommage à la sagesse de ses ordonnances.</p><p>Dans la rivalité du sacerdoce, à l’époque de la division des tribus qui se disputaient ce glorieux privilége, Moïse ordonna aux douze chefs de lui présenter des verges sur lesquelles chacun d’eux avait écrit le nom de sa tribu. Moïse les prit, les lia, les marqua du sceau des chefs, et les déposa immédiatement après dans l’arche d’alliance, sur l’autel du Seigneur ; et, les portes fermées, il mit un sceau sur les clés, ainsi qu’il l’avait mis sur les verges, et il dit aux chefs : « Mes frères, la tribu dont la verge aura fleuri sera celle que Dieu choisit pour lui offrir des sacrifices et l’attacher à ce ministère. » Or, le lendemain, au lever du jour, Moïse assemble tout Israël, et, à la vue de six cent mille hommes qui se trouvaient réunis, il montre les sceaux des clés aux chefs des tribus, ouvre le tabernacle d’alliance et tire les verges : et c’est alors qu’on vit que celle d’Aaron n’avait pas seulement des fleurs, mais encore des fruits. Que pensez-vous de ce prodige ? Moïse ne l’avait-il pas prévu ? Oui, sans doute, et il s’en servit pour arrêter la sédition dans le camp d’Israël, et faire glorifier le nom du seul et vrai Dieu. Gloire soit rendue à ce Dieu dans tous les siècles !</p><p>Les apôtres, éclairés par Jésus-Christ, ont connu qu’un jour des disputes s’élèveraient dans son Église, au sujet de l’épiscopat ; et voilà pourquoi, d’après cette connaissance certaine qu’ils avaient reçue d’avance, ils ont établi ceux dont nous avons parlé plus haut, et ont déterminé un ordre de succession ; ils ont voulu qu’après leur mort le ministère et les fonctions qu’ils exerçaient passassent à des hommes éprouvés.</p><p>Les prêtres établis par les apôtres et ceux qui furent choisis depuis par des hommes recommandables avec l’assentiment et l’approbation de toute l’Église, et qui gouvernèrent le troupeau de Jésus-Christ avec une humilité, une modération, une noblesse qui leur a concilié l’estime générale, ces hommes, tel est mon sentiment, ne peuvent sans injustice être exclus de leurs fonctions.</p><p>Nous-mêmes nous ne pourrions, sans nous rendre très-coupables devant Dieu, déposer de l’épiscopat des hommes dont la conduite fut sainte et irréprochable dans l’exercice de leur ministère. Heureux les prêtres qui, parvenus au terme de la carrière, trouvent dans une sainte mort la récompense d’une sainte vie ! ils ne craignent plus de se voir enlever la place qui leur était destinée.</p><p>Et vous, vous arrachez des ministres du Seigneur d’une vie exemplaire aux fonctions qu’ils exerçaient, non-seulement sans reproche, mais avec honneur !</p><h2>5° Hautes considérations au sujet du schisme ; pressantes exhortations pour les déterminer à le faire cesser.</h2><p>Vous êtes d’un esprit contentieux, jaloux pour des choses qui ne mènent point au salut. Méditez les Écritures, ces vrais oracles de l’Esprit saint ; lisez-les avec attention, voyez si elles favorisent l’injustice et l’iniquité. Vous n’y verrez pas que les justes aient été chassés par les saints. Ils ont souffert des persécutions, mais de la part des méchants ; ils ont été jetés dans des prisons, mais par des impies ; ils ont été lapidés, mais par des hommes iniques ; ils ont été mis à mort, mais par des scélérats qu’animait une détestable jalousie. Et toutes ces souffrances, ils les ont supportées avec le plus noble courage.</p><p>Quels exemples produirons-nous ici ? Est-ce par des hommes pénétrés de la crainte de Dieu que Daniel fut jeté dans la fosse aux lions ?</p><p>Est-ce par des hommes qui rendaient au Très-Haut un culte parfait et digne de lui qu’Ananias, Azarias, Misaël furent enfermés dans une fournaise ardente ? Non, sans doute.</p><p>Quels sont donc les auteurs de pareilles violences ? Des misérables chargés d’iniquités, dignes de haine et de malédiction, ont accablé d’outrages et de tortures des hommes dont toutes les vues étaient pures et irréprochables, des hommes tout occupés du service de Dieu.</p><p>Ils ne savent donc pas que le Très-Haut défend et protége ceux qui travaillent avec une conscience pure à la gloire de son nom tout-puissant ? Que cette gloire lui soit à jamais rendue !</p><p>Mais la confiance des justes au milieu des souffrances leur a valu un héritage de gloire et d’honneur. Témoin ce degré d’élévation où Dieu les a placés ; cette grandeur, cette félicité qu’il attache à leur nom pour la suite des siècles.</p><p>Voilà vos modèles et les hommes qu’il faut suivre. « Unissez-vous aux saints, nous dit l’Écriture, et cette union vous rendra saints vous-mêmes. Vous deviendrez justes avec les justes ; vous vous perdrez avec les méchants. Attachez-vous donc à ceux qui vivent dans l’innocence et la justice. Ce sont là les vrais élus de Dieu. »</p><p>Je vous le demande, pourquoi, parmi vous, ces querelles, ces disputes, ce schisme, ces guerres ? N’avons-nous pas un même Dieu, un même Christ, un même esprit de grâce répandu sur nous, une même vocation en Jésus-Christ ? Pourquoi donc déchirer ses membres ? pourquoi les mettre en lambeaux ? Pourquoi faire ainsi la guerre à notre propre corps ? Sommes-nous assez insensés pour oublier que nous sommes les membres les uns des autres ?</p><p>Rappelons-nous les paroles de notre Seigneur : « Malheur à cet homme ! Il eût mieux valu qu’il ne fût pas né, que d’avoir scandalisé un seul de mes élus ! Il eût mieux valu qu’une meule lui fût attachée au cou et qu’on le jetât ainsi dans la mer, que d’avoir donné un mauvais exemple à un seul de ces petits ! »</p><p>Qu’a produit votre division ? Elle en a perdu plusieurs, elle en a jeté un grand nombre dans le doute, et nous tous dans le deuil. Et cependant ce schisme dure encore.</p><p>Prenez l’épître que vous avez reçue de l’apôtre saint Paul. Que vous recommandait-il avant toutes choses, lorsqu’il commençait à prêcher l’Évangile ? Certes, c’était bien sous l’inspiration de l’Esprit saint qu’il vous écrivait sur lui-même, sur Céphas, sur Apollon.</p><p>Vous étiez alors partagés entre des affections différentes ; mais ce partage de cœur vous laissait moins coupables que cette division ; il venait de votre attachement aux apôtres, d’une vertu si éprouvée, et à des hommes honorés de leur estime.</p><p>Mais quels hommes vous divisent aujourd’hui et viennent ternir la gloire de cette union fraternelle si vantée parmi vous ? Voyez-les, ces hommes ! Quelle honte, mes frères, la plus flétrissante, la plus indigne de votre caractère de Chrétiens, qu’on dise que l’Église de Corinthe, si ancienne, si ferme dans la foi, se révolte contre ses prêtres pour une ou deux personnes ! Et ce bruit n’est pas seulement venu jusqu’à nous, mais jusqu’à ceux qui nous sont le plus opposés de cœur et de sentiment : de sorte que, par votre imprudence, le nom du Seigneur est blasphémé et outragé, et que vous vous mettez vous-mêmes en péril.</p><p>Faisons promptement disparaître ce scandale ; revenons au Seigneur, pleurons notre égarement ; prions-le de nous rendre sa protection, de se réconcilier avec nous, de nous replacer, de nous rétablir dans la voie si pure, si glorieuse, de notre première union fraternelle.</p><p>Elle est la porte même de la justice qui s’ouvre vers la vie, selon ce qui est écrit : « Ouvrez-moi les portes de la justice ; j’y entrerai, je louerai le Seigneur. C’est la porte du Seigneur : par elle les justes iront à lui. »</p><p>Heureux ceux qui sont entrés par cette porte, qui n’ont point quitté la voie de la sainteté et de la justice, et sont restés fidèles au devoir sans se laisser intimider !</p><p>Quelqu’un parmi vous est-il ainsi fidèle au Seigneur, assez éloquent pour expliquer sa loi, assez habile pour discerner la vraie doctrine, et d’ailleurs pur dans ses mœurs ?</p><p>Qu’il soit d’autant plus humble qu’il est plus grand ! Qu’il cherche ce qui est utile à tous et non à lui seul !</p><p>Il sera fidèle observateur de ce commandement, s’il est animé de l’esprit de charité selon Jésus-Christ. Et qui peut parler dignement de ce lien de la charité divine ? Qui peut relever, comme il convient, la grandeur de ses avantages ? Le degré d’élévation où elle nous place est au-dessus de toute expression. La charité nous lie étroitement à Dieu ; elle couvre la multitude des péchés ; elle souffre tout, elle supporte tout avec patience ; en elle, rien de bas ni de superbe ; elle ne connaît point les schismes, elle n’allume point de divisions, elle ramène tout à la concorde ; c’est par elle que les élus de Dieu arrivent à la perfection.</p><p>Sans la charité rien n’est agréable à Dieu. C’est par un excès de charité que lui-même nous a adoptés.</p><p>C’est par son immense charité envers nous que le Christ, soumis à la volonté de son père, a livré son sang pour nous, son corps pour notre corps, sa vie pour la nôtre.</p><p>Vous voyez, mes frères, combien sa charité est grande, admirable ; combien le langage est impuissant pour relever son excellence !</p><p>Quel homme peut trouver ce trésor, sinon celui que Dieu en a jugé digne ? Demandons-lui surtout la grâce de vivre selon la charité, exempts de reproches, dégagés d’affections terrestres.</p><p>Toutes les générations depuis Adam jusqu’à nous se sont écoulées, mais ceux à qui Jésus-Christ a fait la grâce de mourir au sein de la charité vivent à jamais dans le séjour des justes, et leur gloire apparaîtra dans tout son éclat, lors de la visite du Christ, quand il entrera dans son règne.</p><p>Car il est écrit : « Va, mon peuple, entre pour un moment dans l’intérieur de ta maison, jusqu’à ce que ma colère et mon indignation soient passées. Alors je me souviendrai du jour favorable ; je vous ferai sortir de vos tombeaux. »</p><p>Quel est notre bonheur, mes frères, si nous savons accomplir les préceptes du Seigneur dans un esprit de paix, de concorde et de charité, et par celle-ci mériter la rémission de nos péchés ! Car il est écrit : « Heureux ceux dont les iniquités ont été remises et les péchés couverts ! Heureux l’homme à qui le Seigneur n’a point imputé son péché et dont la langue ne recèle point la fraude ! C’est ici la félicité même accordée aux élus par Jésus-Christ, à qui appartient la gloire dans les siècles des siècles. »</p><p>Nous tous, qui avons péché par les secrètes surprises de l’ennemi, demandons grâce. Que les auteurs du schisme consultent l’intérêt de tous. Ceux qui vivent dans la crainte et dans l’amour de Dieu aiment mieux voir tomber le châtiment sur leurs propres têtes que sur celles de leurs frères ; ils préfèrent tourner contre eux-mêmes la sentence de mort, plutôt que de détruire cette belle et sublime harmonie transmise par nos pères. Ne vaut-il pas mieux avouer sa faute, que d’endurcir son cœur, à l’exemple de ceux qui se révoltèrent contre Moïse, ce serviteur de Dieu ?</p><p>Leur punition fut éclatante : ils sont descendus vivants au fond de l’abîme ; la mort les a dévorés.</p><p>Si Pharaon et son armée, et tous les grands de l’Égypte, ont péri engloutis au fond de la mer Rouge, avec les chars et les cavaliers, n’est-ce point pour avoir endurci leurs cœurs insensés, après tant et de si grands prodiges opérés sur la terre d’Égypte par le serviteur de Dieu, le fidèle Moïse ?</p><p>Dieu, qui n’a besoin de rien, ne demande que l’aveu de nos fautes. David, un des élus, s’écrie : « J’avouerai mon péché au Seigneur, et ce sacrifice lui sera plus agréable que celui d’un jeune taureau dont le front et les pieds portent déjà les marques de ses forces naissantes. »</p><p>Que les pauvres voient et se réjouissent !</p><p>Il dit encore ailleurs : « Présentez à Dieu un sacrifice de louanges ; offrez vos vœux au Très-Haut ; invoquez-moi au jour de l’affliction, et je vous délivrerai ; une âme brisée par le repentir est le sacrifice que demande le Seigneur. »</p><p>Vous avez une connaissance pleine et entière des divines Écritures ; vous êtes entrés dans le sens profond des divins oracles ; rappelez-les donc à votre pensée et à votre souvenir.</p><p>Lorsque Moïse eut atteint le haut de la montagne, et qu’il eut passé là quarante jours et quarante nuits dans le jeûne et la pénitence, le Seigneur lui dit : « Lève-toi ; descends promptement d’ici, parce que ton peuple, tiré par toi de l’Égypte, a commis l’iniquité ; il a quitté aussitôt la voie que tu lui avais montrée. Tous se sont fait une idole qu’ils ont forgée eux-mêmes. » Et le Seigneur lui dit encore : « Je vois que ce peuple a la tête dure. Laisse-moi l’exterminer ; j’effacerai son nom de dessous le soleil, et je t’établirai sur un peuple grand, nombreux et plus puissant. » Alors Moïse s’écria : « Non, Seigneur ! pardonnez-leur, ou bien effacez-moi du livre des vivants. » Ô prodige de charité, ô perfection que rien ne peut surpasser ! le serviteur parle librement à son maître ; il demande pardon pour son peuple ou veut périr avec lui !</p><p>Qui d’entre vous est assez généreux, assez humain, assez compatissant pour s’écrier : Si à cause de moi on se dispute, on se divise, on fait schisme, je cède, je me retire où l’on voudra ; je consens à tout ce que le peuple demande de moi, pourvu que le troupeau de Jésus-Christ, que les prêtres établis pour le gouverner, demeurent dans l’union et dans la paix.</p><p>Une gloire immense sera le prix d’une telle conduite ; celui qui saura la tenir est sûr de trouver partout un asile ; car la terre et tout ce qu’elle renferme est au Seigneur.</p><p>Telle a été et telle sera toujours la conduite de ceux qui vivent de cette vie toute divine qui ne laisse jamais de repentir. Ne trouvons-nous pas chez les païens eux-mêmes des exemples d’un semblable dévouement ? N’a-t-on pas vu des princes, des rois, pendant les ravages de la peste, s’offrir eux-mêmes à la mort pour sauver la vie de leurs sujets ? N’a-t-on pas vu de généreux citoyens se bannir de leur patrie pour arrêter une sédition ?</p><p>On en connaît parmi nous qui ont présenté leurs mains aux chaînes pour en délivrer leurs frères ; d’autres qui se sont réduits en esclavage, et avec le prix de leur liberté ont acheté du pain à leurs frères[5].</p><p>Que de femmes, soutenues de la grâce de Jésus-Christ, se sont élevées, par l’héroïsme de leur courage, au-dessus de la faiblesse de leur sexe !</p><p>Judith, voyant sa ville assiégée, demande aux anciens du peuple qu’il lui soit permis de passer dans le camp ennemi. Elle sortit donc, s’offrant au péril pour sa patrie et pour son peuple assiégé ; et Dieu livra au bras d’une femme le puissant Holopherne.</p><p>Esther, dont la foi fut si vive, ne s’exposa pas à un moindre danger pour sauver les douze tribus condamnées à périr. Elle pria, dans le jeûne et le cilice, l’auteur et le souverain maître de toutes choses, le Dieu des siècles ; et ce Dieu, voyant l’humilité de son cœur, sauva le peuple, à cause du péril qu’elle avait osé affronter.</p><p>Et nous aussi prions pour ceux qui sont tombés dans l’égarement ; demandons pour eux l’humilité et la modération ; qu’ils obéissent ici, non à l’homme, mais à la volonté de Dieu. À l’aide de la miséricorde divine, le sentiment de leurs fautes leur deviendra devant Dieu et devant les saints une source de grâces et de mérites. Recevez, ô mes frères, cette correction fraternelle, qu’il est si rare de mal recevoir.</p><p>Ces avis, que nous nous donnons mutuellement, sont assurément ce qu’il y a de meilleur et de plus salutaire. Ils nous rattachent à la volonté divine, et à ce sujet l’Écriture-Sainte nous dit :</p><p>« Le Seigneur m’a repris avec sévérité, mais aussi il n’a pas laissé mon âme en proie à la mort ; le Seigneur reprend celui qu’il aime, il châtie l’enfant qu’il protége. Que le juste me reprenne et me corrige dans sa miséricorde, et que l’huile des pécheurs ne couvre point ma tête. » Et ailleurs : « Heureux l’homme que Dieu corrige lui-même et qui ne repousse point la réprimande du Tout-Puissant ! Si Dieu cause un moment de douleur, il présente aussitôt le remède ; il blesse et sa main guérit. Six fois il t’arrachera aux tribulations, et à la septième le mal ne t’atteindra plus ; dans la famine, il te préservera de la mort ; dans les combats, du tranchant du glaive ; tu échapperas aux traits d’une méchante langue, et tu ne craindras plus le mal quand il surviendra ; tu riras des vains efforts de l’injustice et de l’iniquité, et tu ne redouteras point les bêtes sauvages, car elles s’adouciront pour toi ; tu verras la paix régner sous ta tente, et celle-ci ne sera jamais ébranlée ; tu verras ta race se multiplier, et tes enfants croître comme l’herbe des prairies ; tu entreras au tombeau comme un blé mûr que l’on moissonne en son temps, ou comme les gerbes apportées à l’autel au temps de la moisson. »</p><p>Vous voyez, mes frères, que, tout en nous châtiant, Dieu nous aime ; et comme le châtiment de sa part est tout miséricordieux, il veut, dans les coups salutaires dont il nous frappe, nous faire trouver d’utiles leçons.</p><p>Vous donc qui avez jeté les premières semences de division, soumettez-vous aux prêtres et recevez la correction fraternelle dans un véritable esprit de pénitence.</p><p>Fléchissez l’orgueil de vos cœurs, apprenez à vous soumettre, quittez cette jactance de paroles si vaines et si superbes. Ne vaut-il pas mieux être petit et recommandable dans le troupeau de Jésus-Christ, que de se voir dépossédé de ses espérances par une trop haute opinion de soi-même ? Car voici ce que dit le livre nommé <i>Panarêtos</i>, c’est-à-dire qui renferme tous les préceptes de la vertu : « Je vous ferai entendre le langage de mon esprit, je vous enseignerai ma parole. Parce que je vous ai appelés et que vous ne m’avez pas obéi, parce que je prolongeais au loin ma voix, et que vous n’avez pas été attentifs ; parce que vous avez rendu inutiles mes conseils, et que vous avez été rebelles à mes réprimandes, moi, je me rirai à mon tour de votre ruine ; je me réjouirai lorsqu’arrivera votre perte, quand la terreur viendra soudain, quand la ruine fondra sur vous comme une tempête, quand se précipiteront la détresse et l’angoisse : alors vous m’invoquerez et je ne vous écouterai pas ; les méchants me chercheront et ne me trouveront point, parce qu’ils ont haï la sagesse et qu’ils n’ont pas embrassé la crainte du Seigneur, parce qu’ils n’ont pas voulu prêter attention à mes conseils et qu’ils se riaient de mes réprimandes ; alors ils mangeront le fruit de leurs crimes, ils seront rassasiés de leur impiété. »</p><p>Que Dieu qui voit tout, qui commande aux esprits, qui règne sur toute chair, qui a choisi notre Seigneur Jésus-Christ, et vous par lui, pour être son peuple privilégié, donne à toute âme qui invoque son saint et glorieux nom la foi, la crainte, la paix, la patience, la modération, la continence, la pureté, la tempérance, pour qu’elle lui soit agréable par Jésus-Christ, notre pontife suprême, notre puissant protecteur, et qu’à lui soient rendus gloire, majesté, puissance, honneur, maintenant et dans tous les siècles des siècles.</p><p>Rendus à la paix et à la joie, faites repartir promptement les députés que nous vous avons envoyés, Claudius, Éphébus, Viton, Valère, Testunatus, afin qu’ils nous apportent au plus tôt l’heureuse nouvelle du rétablissement de l’union et de la concorde que nous désirons si ardemment, et que nous puissions, sans le moindre retard, nous réjouir du retour de la tranquillité parmi vous.</p><p>Que la grâce de notre Seigneur Jésus-Christ soit avec vous et avec ceux qui sont sur toute la terre les élus de Dieu en Jésus-Christ, par lequel gloire, honneur, puissance, règne éternel advienne à ce Dieu dans les siècles des siècles.</p>
