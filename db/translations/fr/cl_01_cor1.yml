      <ol><li><p>Qui reconnaîtrait, dans cette description de l’Église de Corinthe, les mœurs de cette ville naguère si dissolue et maintenant tout angélique ? Qu’on rapproche saint Clément de tout ce qui s’écrivait alors, et l’on jugera de quel abîme de corruption Jésus-Christ a retiré le genre humain. On voit les mœurs de ce siècle dans Horace, dans Juvénal, dans Martial, dans Pétrone. Les infamies dont ces auteurs sont remplis se disaient et s’écrivaient publiquement, parce que l’on ne se cachait pas pour les commettre. Il semble que la Providence ait conservé tous ces livres, d’ailleurs si pernicieux, pour que l’on comprenne mieux le bienfait du Christianisme. On voit les mêmes abominations dans Suétone, dans les auteurs de l’histoire d’Auguste qui décrivent les deux siècles suivants, dans Lucien, dans Apulée, dans Athénée. Les Pères mêmes de l’Église ont été obligés d’en parler assez ouvertement, entr’autres saint Justin, saint Clément d’Alexandrie, Tertullien.</p></li><li><p>Cette vérité qu’il y a des terres habitées au delà de l’Océan, entrevue par saint Clément, a été confirmée par les découvertes modernes.</p></li><li><p>Le fait du phénix passait pour vrai au temps de saint Clément. Plutarque, Pline, Tacite, Pomponius Méla, Philostrate, Libanius, Tacite, en ont parlé comme les Pères de l’Église, qui l’ont rappelé souvent comme une image de la résurrection générale.</p></li><li><p>On voit ici une allusion au grand sacrifice des Chrétiens, au sacrifice non sanglant qui remplaçait tous les sacrifices de la loi.</p></li><li><p>Le dévoûment de Vincent de Paul a commencé avec l’Église. La charité fraternelle était si bien pratiquée par les premiers Chrétiens, que les païens, en parlant d’eux, se disaient les uns aux autres : « Quelle espèce nouvelle de gens est-ce ceci ? Voyez avec quelle tendresse ils s’aiment. Ils n’ont rien en propre et en particulier ; ce que l’un possède appartient à tous ; leur vie même n’est pas à eux, ils sont prêts, à la sacrifier les uns pour les autres. »</p></li></ol><p>Traduction : Antoine-Eugène Genoude, <i>Les Pères de l’Église</i>, t. I, Sapia, 1837, p. 107-141. Texte copié depuis <a href="https://fr.wikisource.org/wiki/Les_P%C3%A8res_de_l%E2%80%99%C3%89glise/Tome_1/%C3%89p%C3%AEtre_aux_Corinthiens_(saint_Cl%C3%A9ment)">Wikisource</a>.</p>
