    body: |-
      <p><i>Polycarpe, et les prêtres qui sont avec lui, à l’Église de Dieu qui est à Philippes : que le Dieu tout-puissant et Jésus-Christ notre Seigneur et notre Sauveur répandent sur vous avec abondance la miséricorde et la paix !</i></p><p>J’ai pris une part bien vive à votre joie en Jésus-Christ, notre Seigneur, de ce que vous avez reçu chez vous les modèles de la vraie charité, et de ce qu’il vous a été donné d’accompagner avec tous les honneurs convenables ces hommes chargés de chaînes, les seules que puissent porter les saints, nobles diadèmes pour les vrais élus de Dieu et de Jésus-Christ ; enfin, de ce que la foi qui vous a été annoncée dès les premiers temps est chez vous si bien enracinée qu’elle subsiste toujours, et porte des fruits dignes de Jésus-Christ, notre Seigneur, qui a voulu pour nos péchés descendre jusqu’à la mort, et que Dieu a ressuscité, après avoir rompu les liens de l’enfer[1] ; Jésus-Christ, que vous n’avez pas vu, mais en qui vous croyez, et dont la foi vous fait éprouver des transports d’une joie ineffable, glorieuse, que bien des hommes voudraient partager. Car ils savent que le salut vous vient de la grâce et non des œuvres, que vous le devez à la volonté de Dieu par Jésus-Christ.</p><p>Ceignez donc vos reins et servez le Seigneur dans la crainte et dans la vérité. Laissez là les vains discours de la multitude et ses erreurs, pour croire en celui-là seul qui a ressuscité notre Seigneur Jésus-Christ d’entre les morts, et lui a donné la gloire et une place à sa droite. Tout, en effet, est soumis à Jésus-Christ, au ciel et sur la terre ; tous les esprits lui obéissent ; il s’avance comme juge des vivants et des morts ; Dieu redemandera son sang à tout homme qui n’aura pas cru en lui.</p><p>Le Dieu qui l’a ressuscité d’entre les morts nous ressuscitera nous-mêmes, si nous faisons sa volonté, si nous marchons dans la voie de ses commandements, si nous aimons ce qu’il a aimé ; si nous nous abstenons de toute injustice, de toute fraude, de toute avarice, de toute calomnie, de tout faux témoignage, ne rendant point le mal pour le mal, injure pour injure, outrage pour outrage, ni imprécation pour imprécation.</p><p>N’oublions point les instructions que nous avons reçues du Seigneur : « Ne jugez pas, nous dit-il, et vous ne serez pas jugés ; remettez, et on vous remettra. Soyez miséricordieux, si vous voulez obtenir miséricorde ; on se servira envers vous de la mesure dont vous vous serez servi envers les autres. » Et ailleurs : « Bienheureux les pauvres et ceux qui souffrent persécution pour la justice, car le royaume de Dieu leur appartient. »</p><p>Si je vous parle ici de la véritable justice, ce n’est pas de moi-même, c’est vous qui m’en avez prié.</p><p>Mais ni moi, ni aucun autre, nous ne pourrions jamais atteindre à la haute philosophie du saint et glorieux Paul, qui, pendant son séjour parmi vous, enseignait la parole de vérité avec tant de force et de dignité devant les hommes d’alors, et qui, loin de vous, a écrit depuis ces lettres où la méditation vous découvrira tout ce qui peut vous faire croître dans la foi que vous avez reçue, la foi notre mère commune, dans l’espérance qui la suit, dans la charité envers Dieu, envers Jésus-Christ, envers le prochain, qui la précède. Ne sortez pas de là, et vous avez rempli toute justice ; la charité, si vous l’avez, bannit tout péché, mais la cupidité enfante tous les maux ; nous savons bien que nous n’avons rien apporté dans ce monde et que nous n’en pouvons rien emporter.</p><p>Revêtez-vous donc des armes de justice ; commencez vous-mêmes par marcher dans les préceptes du Seigneur ; vous apprendrez ensuite à vos femmes à se conduire selon la foi qu’elles ont reçue, selon l’amour, selon la chasteté.</p><p>Recommandez-leur d’avoir pour leurs maris l’amour le plus vrai, et pour les autres indistinctement une amitié chaste ; et d’instruire leurs enfants dans la vraie science, la crainte du Seigneur.</p><p>Recommandons aux veuves de ne pas se prononcer légèrement dans les matières de foi, de prier pour tous et sans relâche, d’éviter soigneusement la médisance, la calomnie, les faux jugements, l’avarice, enfin tout ce qui est mal ; qu’elles se rappellent que leur âme est l’autel même du Seigneur, qu’il voit tout ce qui est en nous, qu’il ne lui échappe aucun de nos raisonnements, aucune de nos pensées, aucun des mouvements les plus secrets de notre cœur.</p><p>Nous savons bien qu’on ne se moque pas de lui impunément. Dès lors marchons d’une manière conforme à ses préceptes, c’est-à-dire à sa volonté. Que les diacres aussi soient sans reproche aux yeux de sa justice, et n’oublient jamais qu’ils sont ministres de Dieu, de Jésus-Christ, et non des hommes.</p><p>Qu’ils ne soient dès lors ni calomniateurs, ni doubles en leurs paroles, ni avares ; mais prudents en toutes choses, compatissants, pleins de zèle, marchant dans la vérité du Seigneur, qui s’est rendu le serviteur de tous, qui nous récompensera dans le siècle à venir, si nous avons su lui plaire dans le siècle présent ; car il nous a promis qu’il nous ressusciterait d’entre les morts et qu’il nous ferait régner avec lui, si notre vie était pleine de foi et conforme à la sienne.</p><p>Que les jeunes gens se montrent de même irréprochables dans toute leur conduite ; qu’avant toutes choses ils s’attachent à conserver la pureté des mœurs, à mettre un frein à toute passion coupable.</p><p>Il est bien important dans ce monde de s’affranchir des passions, car toutes combattent contre l’esprit ; et vous savez que ni les fornicateurs, ni les adultères, ni les impudiques, ne posséderont le royaume de Dieu ; en un mot, tous ceux dont les actes sont désavoués par la raison.</p><p>Il faut bien vous garder de les imiter. Mais soyez soumis aux prêtres, aux diacres, comme vous l’êtes à Dieu et à Jésus-Christ ; que les vierges, de leur côté, vivent avec une conscience toujours pure et sans reproche.</p><p>Il faut que le prêtre soit porté à l’indulgence, compatissant envers tous, occupé à ramener les brebis égarées, à visiter tous les malades, plein de zèle pour la veuve, pour l’orphelin, pour le pauvre ; toujours attentif à faire le bien devant Dieu et devant les hommes, à éviter toute colère, toute préférence, tout jugement injuste ; entièrement affranchi d’avarice, de cette légèreté qui croit le mal trop facilement, et d’une certaine sévérité qui juge avec trop de rigueur ; qu’il sache que nous avons tous une dette à payer pour quelques péchés. Si donc nous demandons à Dieu qu’il nous pardonne, nous devons aussi pardonner.</p><p>Nous sommes placés sous les regards du Seigneur notre Dieu, et nous devons tous paraître devant le tribunal de Jésus-Christ, où chacun rendra compte pour soi-même.</p><p>Servons-le donc avec crainte et respect, ainsi qu’il nous l’ordonne, ainsi que l’ont prescrit les apôtres qui nous ont prêché l’Évangile, et les prophètes qui nous ont annoncé d’avance la naissance du Sauveur.</p><p>Ayons une sainte émulation pour le bien ; évitons les scandales, et les faux frères qui confessent le nom du Seigneur avec un cœur hypocrite et induisent en erreur les esprits légers. Quiconque ne confesse pas que Jésus-Christ est venu dans la chair est un antechrist. Celui qui nie la vérité du martyre de la croix est un démon ; mais pour celui qui interprète la parole de Dieu selon ses désirs corrompus, et ose dire qu’il n’y a ni résurrection, ni jugement, c’est le fils aîné de Satan. Quittons les folies, les fausses doctrines de plusieurs, pour revenir à ce qui nous fut enseigné dès le commencement. Passons les veilles dans la prière, persévérons dans les jeûnes, demandons instamment à Dieu qui voit tout de ne pas nous laisser succomber à la tentation, pour me servir ici de ses paroles, car l’esprit est prompt et la chair est faible. Ne perdons jamais de vue l’objet de notre espérance, le gage de notre sanctification, je veux dire Jésus-Christ, qui a porté en son corps sur la croix la peine du péché, lui qui ne l’avait pas commis, lui dont la bouche ne s’ouvrit jamais au mensonge. Il a tout souffert pour nous, afin que nous ayons en lui la vie. Soyons les imitateurs de sa patience ; c’est le glorifier que de savoir souffrir pour son nom. Il nous a donné l’exemple en sa personne ; c’est là ce que nous croyons.</p><p>Je vous conjure d’être dociles à ce langage de la vraie justice, de vous exercer de toutes les manières à la patience dont vous avez eu sous les yeux des exemples, non-seulement dans les bienheureux Ignace, Zozime et Rufus, mais encore dans quelques-uns d’entre nous, dans Paul lui-même et dans les autres apôtres ; persuadés comme vous l’êtes que tous ces glorieux martyrs n’ont pas couru en vain, mais selon la foi, mais selon la justice, et qu’ils ont la place qui leur était due dans la société du Seigneur, avec lequel ils ont souffert.</p><p>Ce n’est pas le siècle présent qu’ils aimaient, mais Jésus-Christ qui est mort pour nous, et que Dieu a ressuscité à cause de nous.</p><p>Attachez-vous à ces vérités ; suivez les exemples de votre Dieu ; demeurez fermes et inébranlables dans la foi, fidèles à l’union fraternelle, vous aimant les uns les autres dans cette société sainte dont la vérité est le lien, chacun de vous montrant à son frère la douceur même de Jésus-Christ et jamais le moindre mépris pour personne.</p><p>Pouvez-vous faire le bien ? Ne le différez pas. L’aumône délivre de la mort.</p><p>Soyez pleins de déférence les uns pour les autres ; tenez une conduite irréprochable au milieu des gentils, afin qu’ils vous louent pour vos bonnes œuvres et que le Seigneur ne soit point blasphémé à cause de vous.</p><p>Enseignez à tous cette tempérance dont vous ne vous écartez jamais.</p><p>J’ai ressenti une peine extrême de la conduite de Valens, élevé au sacerdoce par vous-mêmes il y a quelque temps. Quoi ! il a pu oublier à ce point le caractère dont il fut honoré !</p><p>Voilà ce qui me porte à vous avertir d’éviter l’avarice, d’être toujours chastes et vrais. Abstenez-vous de tout ce qui est mal. Celui qui ne sait pas se gouverner lui-même, comment peut-il reprendre les autres ? S’abandonner à l’avarice, c’est se souiller d’idolâtrie ; c’est encore faire cause commune avec les gentils.</p><p>Qui de vous ne sait pas que le Seigneur doit nous juger ? Ignorons-nous que les saints doivent juger le monde ? C’est Paul qui nous l’apprend. Mais cette ignorance ne règne pas chez vous ; je ne l’ai point remarquée et je ne vous l’ai pas entendue reprocher, vous chez qui le bienheureux Paul a travaillé et dont le nom est placé à la tête d’une de ses lettres.</p><p>Il se glorifie de vous, au contraire, dans toutes les Églises dont il parle : c’étaient alors les seules qui connussent le vrai Dieu. Nous autres, nous ne le connaissions pas encore. Je reviens à Valens ; son état et celui de sa femme m’affligent extrêmement. Puisse le Seigneur mettre dans leur cœur les sentiments de pénitence qui vous animent ! Traitez-les avec ménagement ; ne les regardez pas comme des ennemis, mais comme des membres malades qui se sont détachés du corps ; faites-les y retenir, de manière que tout ce corps que vous formez en Jésus-Christ soit sauvé. Agissez ainsi et vous avancerez l’édifice de votre propre salut.</p><p>Je m’en suis convaincu, vous êtes très-versés dans les saintes Écritures, aucun sens ne vous est caché. Je n’ai pas encore cet avantage, mais je sais qu’il est dit : « Mettez-vous en colère, et ne péchez pas ; » et ailleurs : « Que le soleil ne se couche pas sur votre colère. »</p><p>Heureux celui qui aura la foi dont je vous vois animés !</p><p>Que Dieu le père de notre Seigneur Jésus-Christ, que le fils de Dieu lui-même, le pontife éternel, Jésus-Christ, vous fasse croître dans la foi, dans la vérité, dans une parfaite douceur, exempte de colère, dans la patience, dans la longanimité, dans l’indulgence et la chasteté. Que Dieu vous fasse participer au bonheur et à l’héritage des saints, et nous avec vous, et tous ceux qui sont sous le ciel et qui doivent croire en notre Seigneur Jésus-Christ et en son père, qui l’a ressuscité d’entre les morts. Priez pour tous les saints, priez aussi pour les rois, les princes et les puissances, pour ceux qui vous persécutent, ceux qui vous haïssent, et pour les ennemis de la croix, afin que les fruits de votre foi frappent tous les yeux et qu’alors vous soyez parfaits.</p><p>Vous m’avez écrit, vous et Ignace, que si quelqu’un venait en Syrie, j’eusse soin de le charger de mes lettres ; c’est ce que je me propose de faire, si moi ou le député que je vous enverrai nous trouvons une occasion.</p><p>Je vous fais passer, comme vous l’avez demandé, les lettres qu’Ignace nous a écrites et toutes celles que nous possédions déjà ; elles sont à la suite de celle-ci ; vous en pourrez tirer de grands fruits ; elles renferment des exemples admirables de foi, de patience, en un mot, tout ce qui peut édifier et porter à Dieu. De votre côté, faites-nous connaître ce que vous savez de plus certain sur Ignace et sur ceux qui étaient avec lui.</p><p>Je vous écris par Crescent, que je vous ai recommandé autrefois et que je vous recommande encore à présent. Il a vécu parmi nous d’une manière irréprochable et de même avec vous, comme je le suppose. Je vous recommande pareillement sa sœur, quand elle sera près de vous. Soyez forts, ainsi que tous les vôtres, en Jésus-Christ notre Seigneur, et dans la grâce.</p>
    references: |-
      <ol><li><p>Le mot <i>enfer</i> exprimait dans l’origine un lieu bas et profond, et par analogie le tombeau, le séjour des morts : c’est dans ce sens que saint Polycarpe l’emploie ici.</p></li></ol><p>Traduction : Antoine-Eugène Genoude, <i>Les Pères de l’Église</i>, t. I, Sapia, 1837, p. 297-303. Texte copié depuis <a href="https://fr.wikisource.org/wiki/Les_P%C3%A8res_de_l%E2%80%99%C3%89glise/Tome_1/%C3%89p%C3%AEtre_aux_Philippiens_(saint_Polycarpe)">Wikisource</a>.</p>
