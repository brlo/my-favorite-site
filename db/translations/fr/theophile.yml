      <p><em>Trois livres à Autolyque, traduction de M. de Genoude (1838).</em></p>

      <h2>1</h2>
      <p>I. Un style brillant, une diction élégante, voilà ce qui charme et ce qui transporte les hommes frivoles et corrompus. L’ami de la vérité laisse là les vaines paroles, il s’attache aux faits et les discute. Cher Autolyque, vous m’avez assez fatigué de vains discours, d’éloges sans fin en l’honneur de vos dieux de bois et de pierre, de métal et d’argile; de vos dieux peints et sculptés, qui ne voient ni n’entendent, car ils ne sont que de stupides idoles, œuvres de la main des hommes: assez longtemps vous m’avez reproché d’être Chrétien et d’en porter le nom. Eh bien, oui, je le suis! je le confesse hardiment, et je me glorifie d’un nom agréable à Dieu, dans l’espérance de ne lui être point inutile; tout ce qui rappelle ce Dieu n’a rien qui blesse, comme vous le pensez; et si vous jugez si mal de lui, c’est sans doute parce que vous n’avez pas encore le bonheur de le connaître et de le servi.</p>
      <p>II. Vous direz peut-être: montrez-moi votre Dieu, et moi je vous répondrai: montrez-moi que vous êtes homme, et je vous montrerai mon Dieu; montrez-moi que vous voyez des yeux de l’esprit et que vous entendez des oreilles du cœur. En effet, il en est des oreilles du cœur et des yeux de l’esprit pour voir Dieu, comme des yeux du corps pour voir les choses de la terre et distinguer la lumière des ténèbres, le blanc du noir, la beauté de la laideur, ce qui est régulier de ce qui ne l’est pas, un objet bien proportionné d’un objet ridicule, celui qui sort de la mesure de celui qui ne l’a pas; ou comme des oreilles du corps pour discerner entre eux les sons aigus, graves et harmonieux; car Dieu n’est visible que pour ceux qui peuvent le voir, c’est-à-dire qui ont les yeux de l’esprit ouverts. Sans doute nous avons tous des yeux; mais il en est dont la vue est obscurcie par un nuage, et qui ne peuvent voir la lumière du soleil; les aveugles n’apperçoivent point cette lumière: en brille-t-elle moins dans l’univers? C’est ainsi que les péchés, les passions, jettent un nuage sur les yeux de l’esprit. L’âme de l’homme doit être pure comme un miroir sans tache; et comme celui-ci ne reproduit point les objets une fois qu’il est terni, ainsi l’âme, souillée par le péché, ne peut plus voir Dieu. Montrez-moi donc si vous n’êtes point adultère, impudique, voleur, spoliateur, corrupteur de l’enfance; si vous n’êtes point calomniateur, médisant, colère, envieux, superbe; si vous n’êtes point orgueilleux, meurtrier, avare, sans respect pour vos parents et cupide jusqu’à faire trafic de vos enfants; car Dieu ne se montre point à ceux qui sont infectés de ces vices, à moins qu’ils n’aient pris soin de s’en purifier. Toutes ces criminelles actions nous plongent dans les ténèbres, et nos impiétés s’interposent entre notre âme et la vue de Dieu, comme l’humeur arrêtée sur l’œil de l’aveugle s’interpose entre lui et la lumière du soleil.</p>
      <p>III. Vous me direz: vous qui voyez, tracez-moi donc une image fidèle de Dieu. Écoutez, ô homme: l’image de Dieu ne peut se tracer, ni se décrire; la Divinité ne tombe point sous les sens, on ne peut se représenter sa gloire, ni mesurer son immensité, sonder ses profondeurs, comparer à rien sa puissance, se former une idée de sa sagesse; on ne peut imiter sa bonté ni raconter ses bienfaits. En effet, si je l’appelle lumière, je nomme un de ses ouvrages; Verbe, c’est la parole par laquelle il commande; Esprit, c’est son souffle créateur; sagesse, c’est sa production; force, c’est sa puissance; vertu, c’est son action; Providence c’est sa bonté; roi, Seigneur, c’est sa gloire, sa qualité de maître suprême; juge, c’est sa justice; père, c’est sa tendresse pour tous les êtres; feu, c’est sa colère. Mais, direz-vous, votre Dieu se met-il en colère? Oui, sans doute, contre les méchants; mais il est bon et miséricordieux envers ceux qui l’aiment et qui le craignent; il est le protecteur de l’homme pieux, il est le père du juste, mais il est le juge et le vengeur des impies.</p>
      <p>IV. Il n’a pas de commencement, parce qu’il est incréé; il est immuable, parce qu’il est éternel; il est appelé Dieu, d’un mot grec qui signifie qui a tout fait et tout arrangé, ou d’un autre mot grec qui veut dire que tout se meut, vit et se conserve par lui. Il est appelé Seigneur, parce qu’il domine tout; Père, parce qu’il est avant tout; Auteur et Créateur, parce qu’il a fait de rien toutes choses; Très-Haut, parce qu’il est au-dessus de tout ce qui est; Tout-Puissant, parce qu’il possède et renferme tous les êtres. En effet, les hauteurs des cieux, les profondeurs des abîmes, les extrémités de la terre, sont dans sa main; il n’est arrêté, limité par aucun lieu; il remplit tout. Le ciel est son ouvrage, la terre et la mer l’œuvre de ses mains, et l’homme sa créature et son image; le soleil, la lune et les étoiles sont créés pour le service de l’homme, comme des régulateurs qui fixent les jours, les années et les saisons. Ainsi Dieu a tout fait, tout tiré du néant, pour se manifester par ses œuvres et faire éclater sa grandeur.</p>
      <p>V. De même que l’âme, renfermée dans le corps humain, échappe à nos regards et se manifeste par le mouvement du corps, ainsi Dieu, quoique invisible, se montre clairement par sa providence et par ses œuvres. Quand vous voyez sur la mer un vaisseau voguer à pleines voiles et se diriger vers le rivage, vous ne doutez pas qu’il n’ait un pilote pour le gouverner, pourriez-vous douter qu’il existe un Dieu moteur et maître de l’univers, sous prétexte que les yeux du corps ne le voient pas? L’homme mortel ne peut regarder fixement le soleil, ce faible élément, comment pourrait-il soutenir l’éclat inénarrable de la gloire de Dieu? Voyez la grenade entourée d’une écorce: l’intérieur se compose d’un grand nombre de petites cellules que séparent des membranes légères, et qui contiennent plusieurs grains. Ainsi, l’esprit de Dieu contient toutes créatures, et cet esprit, avec toutes les créatures, est dans la main de Dieu. Or, les grains, renfermés dans la grenade, ne peuvent voir ce qui est au delà de l’écorce, puisqu’ils sont dans l’intérieur; ainsi, l’homme renfermé dans la main de Dieu, avec tous les autres êtres, ne peut appercevoir Dieu lui-même. Personne ne doute de l’existence d’un roi de la terre, bien que la plupart de ses sujets ne puissent le voir; mais il se fait assez connaître par ses lois, ses édits, son pouvoir, ses armées, les images qui reproduisent ses traits, et la toute-puissance de Dieu, la beauté de ses œuvres, ne le feraient pas connaître?</p>
      <p>VI. Considérez, ô homme, quelles sont ses œuvres: les vicissitudes périodiques des saisons, les variations de l’atmosphère, la succession admirable des jours, des nuits, des mois et des années; la prodigieuse variété des semences, des plantes et des fruits; les diverses espèces d’animaux, qui marchent ou qui rampent sur la terre, qui volent dans l’air, qui nagent dans les eaux; l’instinct donné à chacun d’eux pour se multiplier, pour nourrir leurs petits, destinés non à leur propre usage, mais à celui de l’homme; la Providence qui prépare à tous les êtres vivants une nourriture convenable; l’obéissance qui leur est commandée d’avoir pour l’homme; le cours perpétuel des fontaines et des fleuves, l’abondance des pluies et des rosées répandues sur la terre, à différentes époques; les divers mouvements des corps célestes; le lever de l’astre du matin, qui nous annonce le lever d’un astre plus brillant; la conjonction de la Pleïade et d’Orion; la route d’Arcture et des autres corps célestes, décrite dans les cieux, par cette sagesse infinie qui a donné à tous ces astres leur véritable nom. Celui-là seul est Dieu, qui a tiré la lumière des ténèbres et l’a fait éclore de son sein; qui a fait l’asile où se réfugie l’auster, les limites de la mer, les trésors de la grêle et de la neige; qui rassemble les eaux dans les profondeurs de l’abîme, et replonge les ténèbres dans leur noir séjour pour ramener cette lumière si douce, si ravissante, si désirée des mortels; qui appelle les nuages des extrémités de la terre et allume la foudre au sein des nuages; qui lance le tonnerre pour effrayer le monde, et qui nous prévient d’abord par l’éclair, de peur qu’une secousse soudaine ne nous fasse à l’instant défaillir; qui tempère encore la violence de la foudre précipitée du ciel, afin qu’elle n’embrase point la terre: car, si l’éclair et le tonnerre étaient abandonnés à eux-mêmes, ils réduiraient tout en cendres, et ne laisseraient après eux que des ruines.</p>
      <p>VII. Celui-là seul est mon Dieu, le Seigneur de toutes choses, qui a étendu les cieux et donné à la terre ses limites; qui trouble les profondeurs de la mer et excite le bruit de ses vagues; qui domine la puissance de l’océan et calme l’agitation de ses flots; qui a établi la terre sur les eaux et lui donne le principe de vie; en un mot, qui vivifie tout par son esprit, car s’il le rappelait à lui, tout rentrerait dans le néant. C’est par cet esprit, ô homme, que vous parlez; c’est par lui que vous respirez, et vous ne le connaissez pas. Ne cherchez point d’autre cause de cette ignorance que l’aveuglement de votre esprit et la dureté de votre cœur. Mais si vous le voulez, vous pouvez être guéri: livrez-vous au médecin, et il éclairera les yeux de votre esprit et de votre cœur. Quel est donc ce médecin? C’est Dieu lui-même qui guérit et vivifie tout par son Verbe et par sa sagesse? C’est par son Verbe et par sa sagesse qu’il a fait toutes choses: « Les cieux, nous dit l’Écriture, ont été créés par sa parole, et l’armée des cieux par le souffle de sa bouche.» Sa sagesse est au-dessus de tout. C’est sa sagesse qui a affermi la terre, élevé les cieux, creusé des abîmes, et fait distiller la rosée du sein des nuées. Si vous savez comprendre ce langage, ô homme, si vous menez une vie pure, sainte, irréprochable, vous pouvez voir Dieu; mais avant tout, il faut que la foi et la crainte de Dieu règnent dans votre cœur, et alors vous comprendrez ces vérités. Après que vouz aurez abandonné votre condition mortelle, vous revêtirez l’immortalité, vous verrez Dieu en récompense de vos mérites. Dieu ressuscitera votre chair, il la rendra immortelle comme votre âme: alors devenu immortel, vous verrez l’éternel, si maintenant vous croyez en lui; et vous comprenez alors combien vos discours étaient insensés.</p>
      <p>VIII. Vous ne croyez point, dites-vous, à la résurrection des morts. Quand elle arrivera, vous y croirez malgré vous; mais alors votre foi n’excusera point votre incrédulité, si vous ne croyez aujourd’hui. Pourquoi donc ne croyez-vous pas? Ignorez-vous que la foi dirige et précède toutes nos actions? Quel est, en effet, le laboureur qui pourrait moissonner, s’il ne confiait d’abord la semence à la terre? qui passerait la mer, s’il ne se fiait au vaisseau et au pilote? quel malade pourrait recouvrer la santé, s’il n’avait foi en son médecin? et quel art, quelle science apprendrez-vous, si vous ne commencez par croire le maître qui doit vous l’enseigner? Eh quoi! le laboureur se confie à la terre, le navigateur au vaisseau, le malade au médecin, et vous ne voulez point vous confier à Dieu, qui vous a donné tant de preuves de sa fidélité? D’abord, il vous a créé lorsque vous n’existiez pas encore; car s’il fut un temps où votre père et votre mère n’étaient point, à plus forte raison n’avez-vous pas toujours été vous-même; il vous a formé d’une matière humide, d’une goutte de sang, qui elle-même n’a pas toujours été, et il vous a mis en ce monde. Vous pouvez croire en de vains simulacres, ouvrages des hommes, vous croyez les prodiges qu’on leur attribue, et vous ne croyez point que votre créateur puisse vous rappeler à la vie?</p>
      <p>IX. Les noms de ces dieux dont vous vous glorifiez ne sont que des noms d’hommes déjà morts. Et quels hommes encore! Saturne dévore se propres enfants. Vous ne pouvez parler de Jupiter, son fils, sans penser aussi à sa conduite et à ses actions. D’abord, il fut nourri par une chèvre, sur le mont Ida; puis il la tua, comme le rapporte la fable, et lui ayant arraché la peau, il s’en fit un vêtement. Parlerai-je de ses incestes, de ses adultères, de ses infamies avec des enfants? Homère et les autres poëtes les ont mieux décrits que je ne pourrais le faire. Que dire des exploits des dieux qui sont nés de lui? Pourquoi parler d’Hercule, qui s’est brûlé; de Bacchus, ivre et furieux; d’Apollon, que la crainte fait fuir devant Achille, qui aime Daphné et qui ignore la mort d’Hyacinthe; de Vénus, blessée; de Mars, fléau des hommes; et en un mot, du sang qui a coulé des veines de ces prétendus dieux? Ce n’est pas tout encore, un de vos dieux nommé Osiris est déchiré, mis en lambeaux, et l’on célèbre tous les ans ses mystères, comme s’il venait d’être déchiré et qu’on fût à la recherche de ses membres; car on ne sait ni s’il est mort, ni s’il a été découvert. Que dirai-je de la mutilation d’Atis; d’Adonis, errant dans les forêts et blessé à la chasse par un sanglier; d’Esculape, frappé de la foudre; de Sérapis, exilé de Sinope à Alexandrie; d’Artémise de Scythie, aussi exilée, homicide chasseresse, éprise d’amour pour Endymion? Nous n’inventons pas ces faits, ce sont vos poëtes et vos historiens qui les publient.</p>
      <p>X. À quoi bon faire ici l’énumération de cette multitude d’animaux adorés par les Égyptiens, de ces bœufs, de ces reptiles, de ces bêtes féroces, de ces oiseaux et de ces monstres marins, objets de leur culte? Si vous me parlez des Grecs et des autres peuples, ils adorent la pierre, le bois, la matière et les statues d’hommes morts, comme nous l’avons déjà dit. Car Phidias a fait, pour les habitants d’Élis, le fameux Jupiter Olympien, et pour les Athéniens cette Minerve qu’on voit dans la citadelle. Mais dites-moi, je vous le demande, combien compte-t-on de Jupiter? Il y a d’abord Jupiter Olympien, puis Jupiter Latial, Jupiter Cassien, Jupiter Céraunien, Jupiter Propator, Jupiter Pannychius, Jupiter Polyuchus, Jupiter Capitolinus. L’un d’eux, fils de Saturne et roi de Crète, a son tombeau dans cette contrée; quant aux autres, ils n’ont pas même été honorés de la sépulture. Si vous m’opposez la mère de ces prétendus dieux, je me garderai bien de rappeler les turpitudes de cette déesse et celles de ses prêtres; nous ne pourrions, sans crime, en souiller notre bouche; je ne parlerai pas non plus des tributs et des impôts qu’elle et ses enfants payaient au roi de la contrée. Certes, ce ne sont point des dieux, mais des simulacres, ouvrages des hommes, comme nous l’avons dit; ce sont des démons impurs. Qu’ils deviennent semblables à leurs idoles, ceux qui les fabriquent et qui mettent en elles leurs espérances.</p>
      <p>XI. Pour moi, je n’adore point l’empereur, je me contente de l’honorer et de prier pour lui; mais j’adore le Dieu véritable, l’être par excellence, parce que je sais que c’est lui qui fait les rois. Pourquoi donc, allez-vous me dire, n’adorez-vous pas l’empereur? Parce qu’il n’a pas été fait pour être adoré, mais seulement honoré comme il convient. Ce n’est point un Dieu, c’est un homme établi de Dieu pour juger avec équité et non pour recevoir des adorations. Il est en quelque sorte le délégué de Dieu. Lui-même ne souffre pas que ses ministres prennent le nom d’empereur, car c’est son nom, et il n’est permis à personne de le prendre: ainsi Dieu veut être seul adoré. Voilà, ô homme! comme vous êtes dans l’erreur sur toutes choses. Honorez donc l’empereur, mais honorez-le en l’aimant, en lui obéissant et en priant pour lui; si vous le faites, vous accomplirez la volonté de Dieu, manifestée dans ces paroles: « Mon fils, honore Dieu et le roi, et ne leur désobéis jamais; car ils se vengeront aussitôt de leurs ennemis.»</p>
      <p>XII. Vous vous permettez des railleries sur le nom de Chrétien: vous blasphémez ce que vous ignorez; tout ce qui a reçu onction est doux, utile, et ne doit pas être raillé. Un vaisseau pourrait-il voguer en sûreté et servir, s’il n’était frotté d’huile; une tour, une maison serait-elle élégante et commode, sans le brillant de l’enduit qu’on applique sur ses murs? L’huile ne coule-t-elle pas sur celui qui vient au monde ou qui entre dans la lice? Quel ouvrage est beau et plaît à la vue, si l’huile ne lui donne de l’éclat, s’il n’a été bien poli? L’air et toute la terre qui se trouve au-dessous du ciel ont reçu une sorte d’onction de lumière et d’esprit; et vous ne voulez point être oint de l’huile du Seigneur? Car nous ne sommes appelés Chrétiens que parce que cette huile sainte a coulé sur nous.</p>
      <p>XIII. Vous prétendez que les morts ne ressuscitent pas, et vous dites: montrez-moi un seul mort ressuscité, et je croirai quand j’aurai vu de mes yeux. Mais quel est donc votre mérite, si vous ne croyez que lorsque vous voyez? Vous ne doutez point de la résurrection d’Hercule qui se brûla; de celle d’Esculape qui fut frappé de la foudre, et vous ne voulez pas croire à ce que Dieu lui-même vous assure: peut-être ne me croiriez-vous pas encore quand je vous ferais voir un mort ressuscité? Combien Dieu vous offre de motifs et de raisons de croire à ce mystère? Remarquez comme les saisons, les jours, les nuits finissent, se renouvellent et pour ainsi dire ressuscitent. Eh quoi! ne se fait-il pas une certaine résurrection des semences et des fruits pour l’usage des hommes? Car le grain de froment, par exemple, ou toute autre semence, après avoir été confié à la terre, commence par mourir, et se décompose pour renaître ensuite et s’élever en épi. Les arbres ne produisent-ils pas, d’après l’ordre de Dieu, à certaines époques, des fruits auparavant invisibles et cachés? Souvent même on voit le passereau, ou tout autre oiseau, après avoir digéré la semence d’un prunier ou d’un figuier, s’élever sur une colline pierreuse et déposer cette semence comme dans un tombeau. Bientôt elle y pousse de nouvelles racines et donne naissance à un arbuste, grâce à la chaleur qu’elle a reçue et qui l’a fécondée. Tout est ici l’effet de la sagesse divine, qui veut nous montrer combien il est facile à Dieu de ressusciter tous les hommes. Si vous désirez voir encore un spectacle plus étonnant et plus capable de vous démontrer la possibilité de la résurrection, levez les yeux au ciel: la lune ne semble-t-elle pas mourir et renaître pour nous tous les mois? Sachez même que la résurrection s’est déjà effectuée en vous, à votre insu. Si quelquefois vous avez été malade, vous avez alors perdu une grande partie de vos forces, de votre substance, de votre embonpoint; mais bientôt la bonté divine, venant à votre secours, vous a rendu tout ce que vous aviez perdu; et de même que vous ignorez où est allé cet embonpoint que vous n’avez plus, de même vous ne pouvez savoir d’où vous arrive celui qui vous revient. C’est, direz-vous, des aliments et des sucs convertis en sang. Très-bien; mais cette conversion elle-même est l’ouvrage de Dieu, et ne peut venir d’un autre.</p>
      <p>XIV. Ne soyez donc point incrédule, mais plutôt ayez la foi. Moi-même, autrefois, je niais la résurrection future; mais après avoir réfléchi sérieusement, je n’hésite plus à croire, depuis que j’ai eu le bonheur de lire les livres sacrés, écrits par les prophètes qui ont prédit, par l’inspiration de l’Esprit saint, les événements passés tels qu’ils se sont accomplis, les événements présents comme ils se passent sous nos yeux, et les événements futurs dans le même ordre qu’ils doivent se réaliser un jour. Puisque j’ai pour garantie cet ensemble de faits annoncés et en partie accomplis, je ne suis plus incrédule, je crois, j’obéis à Dieu; faites de même, de peur que si vous vous obstiniez aujourd’hui à ne pas croire, vous croyiez forcément un jour, quand vous serez livré à la rigueur d’éternels supplices. Ces supplices ont été annoncés par les prophètes; vos poëtes et vos philosophes sont venus après, et ont fait beaucoup d’emprunter à nos livres saints pour donner du poids à leurs opinions. Mais toujours est-il que ces poëtes, que ces philosophes eux-mêmes ont annoncé des supplices futurs pour les incrédules et les impies, afin que tout le monde fût instruit de cette vérité et que personne ne pût dire: nous ne le savions pas; on ne nous l’avait pas dit. Vous aussi, lisez avec soin nos Écritures, et guidé par leur lumière, vous éviterez des maux sans fin et vous mériterez les biens éternels. Car celui qui nous a donné une bouche pour parler, des oreilles pour entendre et des yeux pour voir, pèsera toutes nos œuvres, les jugera avec équité, et récompensera chacun selon ses mérites. Aux hommes patients qui fuient la corruption et pratiquent la vertu, il donnera la vie éternelle, la joie, la paix, le repos et une multitude de biens que l’œil de l’homme n’a jamais vus, que son oreille n’a point entendus, et que son cœur n’a jamais goûtés; mais pour les incrédules, les superbes qui refusent de croire à la vérité et qui croient au mensonge, qui se seront souillés par la débauche et par l’impureté, par l’avarice et l’idolâtrie, ils verront s’appesantir sur eux sa colère et son indignation; la tribulation, les angoisses, un feu éternel, seront leur partage. Vous m’avez dit, mon cher ami, montrez-moi votre Dieu: le voilà, mon Dieu; je vous exhorte à le craindre et à croire en lui.</p>

      <h2>2</h2>
      <p>I. Dans la conférence que nous avons eue ensemble il y a quelques jours, mon cher Autolyque, je vous ai fait l’exposé de ma religion, vous vouliez savoir quel est le Dieu que je sers, j’ai dû vous répondre, et vous avez prêté à mes paroles une oreille attentive. Nous nous sommes retirés plus amis que jamais, quoique vous m’eussiez d’abord traité un peu durement; car vous devez vous rappeler que vous accusiez notre doctrine de folie. Puisque vous m’en avez vous-même prié, je veux aujourd’hui, malgré mon peu d’habileté, vous démontrer, dans ce petit livre, l’inutilité de vos efforts contre la vérité et la folie de vos superstitions. J’exposerai même sous vos regards, pour mieux vous convaincre, les témoignages tirés de vos propres historiens, que vous lisez sans doute, mais que peut-être vous ne comprenez pas encore.</p>
      <p>II. N’est-il pas ridicule de voir des statuaires, des potiers, des peintres et des fondeurs, façonner, peindre, sculpter, fondre, en un mot, fabriquer des dieux dont se jouent les ouvriers eux-mêmes, tandis qu’ils les fabriquent; de voir ceux-ci leur offrir leur encens, lorsqu’ils les ont vendus pour servir à l’usage d’un temple ou de quelque autre lieu? Non-seulement les acheteurs, mais encore les vendeurs et les ouvriers accourent à ces prétendus dieux, leur font des libations, leur offrent des victimes et les adorent, comme s’ils étaient des dieux, sans s’appercevoir qu’ils ne sont rien autre chose que ce qu’ils étaient sous leur main; c’est-à-dire de la pierre, de l’airain, du bois, des couleurs ou toute autre matière semblable. Et n’est-ce pas ce que vous voyez vous-même, lorsque vous lisez les histoires et les généalogies de ces ridicules divinités? Vous les regardez comme des hommes, pendant que vous avez sous les yeux le récit de leur naissance; puis vous les honorez comme des dieux, sans considérer qu’ils sont réellement engendrés, ainsi que vous l’apprenez des histoires que vous lisez.</p>
      <p>III. Puisqu’ils ont été engendrés, sans doute qu’ils engendraient aussi. Mais quels sont ceux que nous voyons naître aujourd’hui? Car, si alors ils engendraient et s’ils étaient engendrés, il est clair que leur génération devrait se perpétuer encore; autrement, il faudrait dire qu’ils sont dégénérés. Ou bien, en effet, ils ont vieilli et ne peuvent plus engendrer, ou ils sont morts, et n’existent plus. Car, s’ils naissaient autrefois, ils devraient naître encore aujourd’hui, comme nous naissons nous-mêmes; bien plus, leur nombre devrait surpasser de beaucoup celui des hommes, selon ces paroles de la Sibylle: « Si les dieux engendrent et s’ils sont immortels, ils doivent être beaucoup plus nombreux que les hommes, et ne laisser à ces derniers aucun endroit qu’ils puissent habiter.» En effet, si les hommes, qui sont mortels, et dont la vie est si courte, n’ont cessé jusqu’à ce jour de naître et de se reproduire, ensorte qu’ils remplissent les villes, les bourgades et les champs, à combien plus forte raison les dieux, qui ne meurent point, selon le langage des poëtes, devraient-ils continuer d’engendrer et d’être engendrés, comme vous dites qu’ils l’ont fait autrefois? Pourquoi le mont Olympe, jadis habité par les dieux, est-il aujourd’hui désert? Pourquoi Jupiter, qui, au dire d’Homère et des autres poëtes, demeurait sur le mont Ida, l’a-t-il abandonné sans qu’on sache maintenant où il s’est retiré? Pourquoi n’était-il point partout, mais seulement dans une partie de la terre? C’est sans doute parce qu’il négligeait les autres contrées, ou qu’il ne pouvait être en tous lieux, ni étendre partout sa providence. Car s’il était, par exemple, en Orient, il n’était point en Occident; et s’il était en Occident, il ne pouvait se trouver en Orient. Or, il appartient au Dieu véritable, au Dieu très-haut et tout-puissant, non-seulement d’être partout, mais encore de tout voir, de tout entendre et de n’être circonscrit par aucun lieu; car autrement il serait inférieur au lieu qui le contient, puisque le contenant est toujours plus grand que le contenu; et, par conséquent, Dieu ne peut être renfermé dans aucun lieu particulier, puisqu’il est lui-même le centre de toutes choses. Mais pourquoi Jupiter a-t-il abandonné le mont Ida? Serait-ce parce qu’il est mort ou parce que ce séjour a cessé de lui plaire? Où est-il donc allé? Est-ce dans le ciel? Point du tout. Est-ce dans la Crète? Oui, sans doute, puisqu’on y voit encore son tombeau. Peut-être, est-ce à Pise, où jusqu’alors le génie de Phidias a fait vivre son nom et lui concilie des hommages. Arrivons maintenant aux écrits des philosophes et des poëtes.</p>
      <p>IV. Quelques philosophes du portique ne reconnaissent aucun Dieu, ou s’ils en reconnaissent un, c’est un être qui ne s’occupe d’autre chose que de lui-même. Tel est le sentiment absurde d’Épicure et de Chrysippe. D’autres rapportent tout au hasard, prétendant que le monde est incréé et la nature éternelle; ils ont osé dire qu’il n’y avait aucune Providence, et pas d’autre Dieu que la conscience de chaque homme. D’autres encore ont regardé comme Dieu cet esprit qui pénètre la matière. Quant à Platon et à ses sectateurs, ils reconnaissent, il est vrai, un Dieu incréé, père et créateur de toutes choses; mais ils établissent en même temps deux principes incréés, Dieu et la matière qu’ils disent coéternels. Si ces deux principes sont également incréés, il s’en suit que Dieu n’a pas fait toutes choses et que sa domination n’est point absolue, comme le prétendent les platoniciens. D’ailleurs, si la matière était incréée comme Dieu, elle serait égale à lui et comme lui immuable, puisqu’il n’est lui-même immuable que parce qu’il est incréé; car ce qui est créé est sujet au changement et aux vicissitudes, l’être incréé est le seul qui ne change pas. Où serait donc la puissance de Dieu, s’il eût créé le monde d’une matière déjà existante? Donnez, en effet, à un de nos ouvriers la matière qui lui est nécessaire, et il fera tout ce que vous voudrez. La puissance de Dieu consiste à tirer du néant tout ce qu’il veut, et nul autre que lui ne peut donner le mouvement et l’être. L’homme, il est vrai, peut bien faire une statue, mais il ne peut donner à son ouvrage la raison, la respiration et le sentiment; Dieu seul a cette puissance: et déjà, de ce côté, la puissance de Dieu surpasse celle de l’homme. Elle lui est encore bien supérieure sous un autre rapport, c’est qu’il tire et qu’il a tiré du néant tout ce qu’il a voulu et de la manière qu’il l’a voulu.</p>
      <p>V. Les philosophes et les poëtes ne s’accordent point entre eux: vous venez de voir ce que disent les philosophes, et voici qu’Homère s’efforce de vous expliquer, d’une autre manière, l’origine du monde et celle des dieux: « L’océan, dit-il, d’où sortent les mers et les fleuves, est le père des dieux, et Thétys est leur mère.» Ainsi parle Homère; mais ces paroles ne peuvent désigner un Dieu. Qui ne sait pas que l’océan n’est qu’une étendue d’eau? Et s’il n’est que de l’eau, il ne peut être Dieu. Car Dieu est le créateur de toutes choses, et par conséquent, il a aussi créé l’eau et les mers. Hésiode explique aussi non-seulement l’origine des dieux, mais encore celle du monde. Il dit bien que le monde a été créé, mais il ne peut dire quel est son auteur. En outre, il a considéré comme dieux Saturne et ses enfants Jupiter, Neptune et Pluton, que nous savons être postérieurs au monde. Il raconte que Saturne fut vaincu par Jupiter, son propre fils; c’est ainsi qu’il s’exprime: « Après avoir triomphé, par son courage, de Saturne son père, il régla chaque chose selon les lois éternelles, et distribua les honneurs.» Il parle encore des filles de Jupiter, appelées Muses, et il les supplie de vouloir bien lui apprendre comment toutes choses ont été faites. Voici ses paroles: « Salut, filles de Jupiter, inspirez-moi des chants agréables! Célébrez la race sacrée des immortels qui sont issus de la terre, du ciel étoilé, de la nuit ténébreuse, et que la mer a nourris. Apprenez-moi comment sont nés les dieux et la terre, les fleuves et l’immense océan; comment sont nés les astres brillants et le ciel qui s’étend au-dessus de nos têtes; comment, de ceux-ci, sont sortis les dieux qui répandent sur nous leurs bienfaits; comment ils ont divisé et partagé les honneurs et les richesses; comment ils ont pu occuper le ciel, embarrassé au commencement de tant de sphères. Apprenez-moi tout cela, ô Muses, vous qui habitez le séjour céleste depuis le commencement, et dites-moi quelle est la première origine de tous ces êtres.» Mais comment les Muses auraient-elles pu le lui apprendre, puisqu’elles sont postérieures au monde? Et comment auraient-elles pu raconter à Hésiode des choses qui s’étaient passées avant la naissance de leur père?</p>
      <p>VI. Le même poëte, parlant de la matière et de la création du monde, s’exprime en ces termes: « Au commencement exista le chaos, puis la terre, dont le large sein est l’asile le plus sûr des immortels qui occupent les sommets de l’Olympe, ou le ténébreux Tartare dans les entrailles de la terre. L’amour existait aussi, lui qui est le plus beau d’entre les immortels, qui charme les soucis et qui triomphe de la sagesse des hommes et des dieux. Du chaos naquirent l’Érèbe et la nuit obscure; puis de la nuit sortirent l’air et le jour, qu’elle enfanta de son union avec Érèbe. La terre, de son côté, produisit d’abord la voûte des cieux, parsemée d’étoiles, de manière à en être enveloppée tout entière et à devenir le séjour fortuné des dieux. Elle engendra ensuite les hautes montagnes et les grottes si agréables aux nymphes qui habitent les rochers. Enfin l’eau stérile enfanta, non dans son amour, mais dans sa fureur, le Pont-Euxin; et puis ensuite s’étant unie avec le ciel, elle engendra l’océan.» Ce poëte, en nous faisant l’énumération de tous ces êtres créés, est encore à nous dire quel était leur auteur. Car, si le chaos était au commencement, il y avait donc une matière incréée et préexistante. Mais qui l’a disposée, qui lui a donné sa forme et ses proportions? Est-ce la matière qui s’est donné à elle-même sa forme et sa beauté? Car Jupiter est bien postérieur, non-seulement à la matière, mais encore au monde et à une foule d’hommes; et il en est de même de Saturne, son père. Ou bien a-t-il existé une cause première, je veux dire un Dieu qui l’a créée et qui l’a embellie? Que dirai-je, il semble se jouer de toute raison et se combattre lui-même; car après avoir parlé de la terre, du ciel et de la mer, il prétend que les dieux sont issus de ces éléments, et que des dieux eux-mêmes sont sortis ces hommes affreux qui font partie de leur famille; je veux dire les titans, les cyclopes, les géants, les dieux des Égyptiens ou plutôt des hommes insensés; c’est de ces monstres que parle Apollonide, surnommé Horapius, dans son livre intitulé <i>Semenouthi</i> et dans les autres histoires qu’il a écrites sur la religion et les rois de l’Égypte.</p>
      <p>VII. À quoi bon rappeler ici les diverses fables des Grecs et leurs vains efforts pour les inventer? Pourquoi parler de Pluton, roi des ténèbres, de Neptune, commandant à la mer, épris d’amour pour Melanippe et père d’un fils anthropophage? Pourquoi raconter toutes ces histoires tragiques qu’on a composées sur les enfants de Jupiter? Si l’on a rappelé leur généalogie, c’est qu’ils sont des hommes et non des dieux. Le poëte comique, Aristophane, parlant de la création du monde, dans une de ses pièces intitulée <i>l’Oiseau</i>, prétend qu’il est issu d’un œuf: « La nuit aux ailes noires, dit-il, enfanta un œuf sans germe.» Satyre, parlant des diverses familles d’Alexandrie, cite d’abord Philopator, appelé aussi Ptolémée, et déclare que Bacchus est l’auteur de sa famille, et que par conséquent Ptolémée fut le premier fondateur de cette tribu. Voici donc ce qu’il dit: « De Bacchus et d’Althée, fille de Thestius, naquit Déjanire; de celle-ci et d’Hercule, fils de Jupiter, naquit Hyllus; de ce dernier, naquit Cléodème, qui donna le jour à Aristomaque; de celui-ci naquit Éménus; de celui-ci, Ceisus, qui donna le jour à Maron; de celui-ci, Thestius; de celui-ci, Achus; de celui-ci, Aristomide; de celui-ci, Caranus; de celui-ci, Cœnus; de celui-ci, Tyrimmas; de celui-ci, Perdiccas; de celui-ci, Philippe; de celui-ci, Æropus; de celui-ci, Alcète; de celui-ci, Amyntas; de celui-ci, Bocrus; de celui-ci, Méléagre; de celui-ci, Arcinoé; de celle-ci et de Lagus, Ptolémée, appelé aussi Soter; de celui-ci et de Bérénice, Ptolémée Évergète; de celui-ci et de Bérénice, qui fut fille de Magis, roi des Cyréniens, naquit enfin Ptolémée Philadelphe.» Telle est la généalogie des rois qui ont régné à Alexandrie, et qui sont issus de Bacchus. C’est pourquoi il y a, dans la tribu de Bacchus, plusieurs familles distinctes: celle d’Althes, qui tire son nom d’Althée, femme de Bacchus et fille de Thestius; celle de Déjanire, qui vient de la fille de Bacchus et d’Althée, laquelle fut l’épouse d’Hercule; celle d’Ariane, qui vient de la fille de Minos, épouse de Bacchus, amoureuse de son père, et qui s’unit à Bacchus, sous une forme étrangère; celle de Thestis, qui tire son nom de Thestius, père d’Althée; celle de Thoas, qui vient de Thoas, fils de Bacchus; celle de Staphilis, qui vient de Staphilus, fils de Bacchus; celle d’Eunée, qui vient d’Eunous, fils de Bacchus; celle de Maron, qui vient de Maron, fils d’Ariadne et de Bacchus. En effet, ils sont tous fils de Bacchus; mais il y a eu autrefois, et il y a encore aujourd’hui beaucoup d’autres dénominations: d’Hercule sont sortis les Héraclides; d’Apollon, les Appolloniens et les Appollonides; de Possidon ou Neptune, les Possidoniens; de Jupiter, les dieux et les Diogènes.</p>
      <p>VIII. À quoi bon continuer l’énumération sans fin de ces noms et de ces généalogies? C’est avec cela que vos historiens, vos poëtes, vos philosophes et tous ceux qui se sont occupés de cette vaine nomenclature, se moquent de nous. Ce sont des fables, des contes absurdes, qu’ils ont composés sur les dieux. Tout ce que nous y voyons de plus clair, c’est qu’ils ne sont pas des dieux, mais des hommes; les uns adonnés au vin, les autres débauchés, ceux-ci sanguinaires. Bien plus, ces auteurs ne s’accordent point entre eux sur l’origine du monde; tout ce qu’ils disent sur ce point est absurde. Les uns, en effet, prétendent que le monde est éternel, comme nous l’avons déjà dit, et les autres, au contraire, veulent qu’il ait été créé. Les uns ont admis une Providence, les autres l’ont niée. Voici comment parle Aratus: « Commençons par Jupiter, dit-il, et ne cessons jamais de l’invoquer. Toutes les rues et toutes les places sont remplies de Jupiter; la mer et le port en sont pleins. Nous avons tous besoin de Jupiter et nous sommes tous ses enfants; il nous tend la main; il veut que tous les hommes travaillent, afin de pourvoir aux besoins de la vie. Il indique quand la terre féconde doit être labourée par les bœufs et la charrue, quand il faut la défricher et répandre la semence.» À qui donc devons-nous ajouter foi, d’Aratus ou de Sophocle, qui dit: « Il n’est point de Providence. Personne ne veille sur nous, vivez au hasard comme vous le pouvez.» Homère ne s’accorde point non plus avec Sophocle: « Jupiter, dit-il, donne aux hommes et leur ôte la vertu.» Il en est de même de Simonide: « Aucun homme, aucune ville, personne, dit ce poëte, ne peut avoir la vertu sans les dieux. Dieu est l’auteur de la sagesse, et l’homme n’a que la folie en partage.» Ainsi parle encore Euripide: « Il n’arrive rien aux hommes sans la permission de Dieu.» « Dieu seul, dit Ménandre, fournit à nos besoins.» Euripide dit encore: « Si Dieu veut un jour vous sauver, il vous en donnera les moyens nécessaires.» Thestius a dit pareillement: « C’est Dieu qui conduit le navigateur et qui protége son frêle esquif.» Non-seulement ils se contredisent les uns les autres, mais encore ils sont en contradiction avec eux-mêmes. Sophocle, qui détruit ailleurs la Providence, l’établit ici en ces termes: « Le mortel ne peut échapper à la main de Dieu.» Ajoutons qu’ils ont introduit une multitude de dieux contre ceux qui n’en reconnaissaient qu’un seul, et qu’ils ont nié la Providence, uniquement pour faire de l’opposition, quand d’autres la soutenaient. Aussi, écoutez l’aveu que fait Euripide lui-même: « Nous étudions beaucoup de choses, nous ne cessons de travailler dans un vain espoir, et nous ne connaissons absolument rien.» Ils sont donc forcés malgré eux d’avouer qu’ils ignorent la vérité, ou bien que tout ce qu’ils ont dit leur vient des démons. En effet, Homère et Hésiode, inspirés, comme ils le disent, par des Muses, ont écrit les rêves de leur imagination, n’écoutant ici que l’esprit de mensonge et non point l’esprit de vérité. On le voit clairement, quand une personne est possédée des démons; ces esprits d’erreur, adjurés de sortir au nom du vrai Dieu, ont confessé qu’ils étaient les mêmes démons qui inspiraient autrefois ces écrivains profanes. Cependant quelques-uns de ces esprits, s’oubliant en quelque sorte eux-mêmes, ont parlé plus d’une fois comme les prophètes, afin qu’on pût leur opposer leur propre témoignage et le faire servir contre les hommes, pour appuyer l’unité de Dieu, la vérité d’un jugement, et les autres dogmes que ces esprits de ténèbres ont eux-mêmes reconnus.</p>
      <p>IX. Mais les hommes de Dieu, inspirés par l’Esprit saint, et véritablement prophètes, reçurent d’en haut la science, la sagesse et la justice: c’est Dieu lui-même qui les instruisait; il leur a fait l’honneur de les choisir pour être ses instruments et les dépositaires de sa sagesse; c’est à la faveur de cette sagesse divine qu’ils nous ont fait connaître la création du monde et tant d’autres vérités. Ils ont prédit les famines, les guerres, tous les fléaux qui devaient arriver. Ce n’est pas un ou deux, mais plusieurs, qui parurent à diverses époques chez les Hébreux (comme aussi la Sibylle, chez les Grecs), et le plus parfait accord a toujours régné entre ces prophètes, soit qu’ils aient raconté les faits qui les avaient précédés, soit qu’ils aient parlé des événements contemporains, soit enfin qu’ils aient annoncé ceux qui se réalisent aujourd’hui sous nos yeux. De là nous apprenons à ne pas douter de l’accomplissement des prédictions qui regardent l’avenir, puisque nous avons sous les yeux celui des premières.</p>
      <p>X. Ils ont tous enseigné, d’un commun accord, que Dieu avait tiré toutes choses du néant. Car aucun être n’existait de toute éternité avec Dieu; mais comme il est à lui-même le lieu qu’il habite, qu’il n’a besoin de rien, qu’il est plus ancien que les siècles, il fit l’homme, pour que l’homme le connût; il lui a préparé le monde pour être son séjour, parce que celui qui est créé a besoin de tout, tandis que l’être incréé n’a besoin de rien. Dieu, qui de toute éternité portait son Verbe dans son sein, l’a engendré avec sa sagesse avant la création. Il s’est servi de ce Verbe comme d’un ministre, pour l’accomplissement de ses œuvres, et c’est par lui qu’il a créé toutes choses. On l’appelle principe, parce qu’il a l’empire et la souveraineté sur les êtres qu’il a lui-même créés. L’Esprit saint, le principe, la sagesse et la vertu du Très-Haut, descendit dans les prophètes et nous apprit, par leur bouche, la création du monde et les choses passées, qui n’étaient connues que de lui. Quand Dieu créa le monde, les prophètes n’étaient point. Dieu seul était avec sa sagesse qui est en lui et avec son Verbe qui ne le quitte pas. C’est cette sagesse qui s’exprime en ces termes, par le prophète Salomon: « Lorsqu’il étendait les cieux, j’étais là; et lorsqu’il posait les fondements de la terre, j’étais auprès de lui.» Moïse, qui vécut longtemps avant Salomon, ou plutôt le Verbe de Dieu lui-même, parle ainsi par sa bouche: « Au commencement, Dieu créa le ciel et la terre.» Il a nommé d’abord le principe et la création, puis ensuite Dieu lui-même; car il n’est pas permis de nommer Dieu légèrement et sans une grave raison. La sagesse divine prévoyait que bien des hommes seraient le jouet de l’erreur, et reconnaîtraient une multitude de dieux qui ne sont pas. Afin de nous montrer le vrai Dieu dans ses œuvres, et de nous convaincre que c’est lui qui a créé, par son Verbe, le ciel, la terre, et tout ce qu’ils renferment, les livres saints nous disent: « Au commencement, Dieu créa le ciel et la terre.» Puis après avoir raconté cette création, l’Écriture poursuit en ces termes: « La terre était informe et nue, et les ténèbres couvraient la face de l’abîme, et l’esprit de Dieu reposait sur les eaux.» Voilà ce que nous apprennent d’abord les livres sacrés, afin qu’il soit bien reconnu que Dieu lui-même avait fait cette matière, dont il a créé le monde.</p>
      <p>XI. D’abord il fit la lumière parce que c’est par elle que nous voyons les choses créées et l’ordre qui règne en elles. Voici les paroles de l’Écriture: « Dieu dit, que la lumière soit, et la lumière fut. Dieu vit que la lumière était bonne, et il sépara la lumière des ténèbres. Et il appela la lumière jour, et les ténèbres nuit; et le soir et le matin formèrent un jour. Et Dieu dit: Qu’un firmament soit entre les eaux, et qu’il sépare les eaux d’avec les eaux. Et Dieu étendit le firmament, et divisa les eaux supérieures des eaux inférieures. Et il fut ainsi. Et Dieu appela le firmament, ciel; et le soir et le matin furent le second jour. Et Dieu dit: Que les eaux qui sont sous le ciel se rassemblent en un seul lieu, et que l’aride paraisse. Et il fut ainsi. Et Dieu appela l’aride, terre; et les eaux rassemblées, mer. Et Dieu vit que cela était bon. Et il dit: Que la terre produise les plantes verdoyantes avec leur semence, les arbres avec des fruits, chacun selon son espèce, renfermant en eux-mêmes leurs semences, pour se reproduire sur la terre. Et il fut ainsi. La terre produisit donc des plantes qui portaient leur graine suivant leur espèce, et des arbres fruitiers qui renfermaient leur semence en eux-mêmes, suivant leur espèce. Et Dieu vit que cela était bon. Il y eut un soir et un matin; ce fut le troisième jour. Dieu dit aussi: Qu’il y ait dans le ciel des corps lumineux, qui divisent le jour d’avec la nuit, et qu’ils servent de signes pour marquer les temps, les jours et les années; qu’ils luisent dans le ciel et qu’ils éclairent la terre. Et il fut ainsi. Et Dieu fit deux grands corps lumineux; l’un plus grand, pour présider au jour; l’autre moins grand, pour présider à la nuit. Il fit aussi les étoiles; et il les plaça dans le ciel, pour luire sur la terre, pour présider au jour et à la nuit, et pour séparer la lumière d’avec les ténèbres. Et Dieu vit que cela était bon. Il y eut un soir et un matin; ce fut le quatrième jour. Dieu dit encore: Que les eaux produisent les animaux qui nagent, et que les oiseaux volent sur la terre et sous le ciel. Et Dieu créa les grands poissons, et tous les animaux qui ont la vie et le mouvement, que les eaux produisirent chacun selon leur espèce; et il créa aussi des oiseaux chacun selon son espèce. Il vit que cela était bon. Et il les bénit, en disant: Croissez et multipliez-vous; remplissez la mer, et que les oiseaux se multiplient sur la terre. Il y eut encore un soir et un matin; ce fut le cinquième jour. Dieu dit aussi: Que la terre produise les animaux vivants, chacun selon son espèce; les animaux domestiques, les reptiles et les bêtes sauvages, selon leurs différentes espèces. Et il fut ainsi. Dieu fit donc les bêtes sauvages de la terre, selon leurs espèces; les animaux domestiques et tous ceux qui rampent sur la terre, chacun selon son espèce. Et il vit que cela était bon. Dieu dit ensuite: Faisons l’homme à notre image et à notre ressemblance; et qu’il domine sur les poissons de la mer, sur les oiseaux du ciel, sur les animaux qui demeurent sous le ciel, et sur tous les reptiles. Et Dieu créa l’homme à son image; et il le créa à l’image de Dieu: il les créa mâle et femelle. Dieu les bénit et leur dit: Croissez et multipliez-vous; remplissez la terre et vous l’assujettissez; dominez sur les poissons de la mer, sur les oiseaux du ciel, et sur tout animal qui se meut sur la terre. Dieu dit encore: Voilà que je vous ai donné toutes les plantes répandues sur la surface de la terre et qui portent leur semence, et tous les arbres fruitiers qui ont leur germe en eux-mêmes, pour servir à votre nourriture; et j’ai donné leur pâture à tous les animaux de la terre, à tous les oiseaux du ciel, à tout ce qui vit et se meut sur la terre. Et il fut ainsi. Dieu vit toutes ses œuvres, et elles étaient parfaites. Il y eut un soir et un matin; ce fut le sixième jour. Ainsi furent achevés les cieux, la terre et tout ce qu’ils renferment. Dieu accomplit son œuvre le septième jour; et il se reposa ce jour-là, après avoir formé tous ses ouvrages. Dieu bénit le septième jour et le sanctifia, parce qu’il s’était reposé en ce jour, après avoir terminé ses œuvres.»</p>
      <p>XII. Aucun homme ne pourrait développer, comme elle le mérite, cette description magnifique de l’œuvre des six jours, quand même il aurait dix mille bouches et dix mille langues. En supposant même qu’il vécût dix mille ans, il lui serait impossible de parler dignement de cette œuvre, tant est grande, tant est riche et magnifique la sagesse que Dieu y fait éclater. Plusieurs écrivains, après Moïse, se sont efforcés de raconter la création; mais bien qu’ils aient puisé, dans ses écrits, les secours dont ils avaient besoin pour l’expliquer et faire connaître la nature humaine, ils n’ont pu cependant saisir qu’une légère étincelle de vérité. Les ouvrages de ces écrivains, poëtes ou philosophes, n’ont d’autre mérite que celui du style; mais ce qui en montre la vanité et le ridicule, c’est la multitude de puérilités et d’erreurs et le peu de vérité qui s’y trouve. Tout ce qu’ils ont dit de vrai est mêlé de mensonge. Or, de même que le vin et le miel deviennent plus qu’inutiles, si l’on y verse du poison, ainsi en est-il des plus beaux discours; ce sont de laborieuses frivolités, elles peuvent donner la mort à ceux qui y ajoutent foi. Ces écrivains ont aussi parlé du septième jour, jour célèbre chez tous les peuples; mais la plupart ignorent ce que signifie ce septième jour, appelé <i>sabbat</i>, chez les Hébreux, et <i>hebdomas</i>, chez les Grecs; cette dernière dénomination s’est conservée chez tous les peuples sans qu’ils en sachent la cause. Ce que dit Hésiode, quand il raconte que du chaos sont nés l’Érèbe, la Terre et l’Amour, qui commande aux dieux et aux hommes, n’est qu’un vain langage dénué de fondement. Car on ne peut supposer qu’un dieu soit esclave de la volupté, lorsqu’on voit des hommes qui s’abstiennent de tout plaisir déshonnête, et qui s’interdisent jusqu’au désir, dès lors qu’il est coupable.</p>
      <p>XIII. Ce même poëte a montré qu’il avait de Dieu une idée toute humaine, basse et misérable, lorsqu’il part des choses terrestres pour commencer son récit de la création. L’homme, en effet, qui est si petit, est obligé de commencer par en bas l’édifice qu’il veut bâtir; il ne peut élever le faîte ou le toit sans avoir posé d’abord le fondement. Mais la puissance de Dieu consiste à créer de rien ce qu’il veut, et à le créer selon son bon plaisir. « Car ce qui est impossible aux hommes est possible à Dieu.» C’est pourquoi le prophète nous apprend qu’il créa d’abord le ciel en forme de voûte, comme le couronnement et le faîte de l’édifice: « Au commencement, dit-il, Dieu créa le ciel.» Il crée donc le ciel ainsi que nous l’avons dit; il donne ensuite le nom de terre à la partie solide qui est comme le fondement, et celui d’abîme à la réunion des eaux. Il parle encore des ténèbres, parce que le ciel était comme un voile qui couvrait les eaux et la terre. Par cet esprit qui reposait sur les eaux, il entend le principe de vie que Dieu a donné aux créatures, pour la régénération des êtres, comme l’âme dans l’homme est unie au corps; il rapprochait ainsi deux substances légères comme l’eau et l’esprit, afin que l’esprit pénétrât l’eau, et que l’eau avec l’esprit pénétrant partout, fécondât la créature. Il n’y avait donc entre le ciel et l’eau que ce seul esprit qui occupait la place de la lumière, afin d’empêcher en quelque sorte que les ténèbres ne s’étendissent jusqu’au ciel voisin de Dieu, avant que Dieu eût dit: « Que la lumière soit.» Ainsi le ciel embrassait comme une voûte la matière qui était comme le sol. Voici en effet comment le prophète Isaïe parle du ciel: « C’est Dieu qui a fait le ciel comme une voûte, et qui l’a étendu comme une tente que nous devions habiter.» Voilà pourquoi la parole de Dieu, c’est-à-dire son Verbe, qui brillait comme dans une prison étroite, a éclairé tout à coup l’espace lorsque la lumière fut créée, indépendamment du monde. Dieu appela la lumière jour, et les ténèbres nuit; car l’homme n’aurait jamais pu donner un nom à la lumière, aux ténèbres, ni aux autres objets, s’il ne l’avait reçu du créateur. Au commencement du récit, l’Écriture ne parle point de ce firmament que nous voyons, mais bien d’un autre ciel invisible à nos yeux, d’après lequel celui qui frappe notre vue a été appelé firmament. C’est dans ce lieu qu’est renfermée une partie des eaux pour se répandre en pluie et en rosée, selon les besoins de l’homme; tandis que le reste est resté sur la terre dans les fleuves, dans les fontaines et dans les mers. Les eaux couvraient encore la terre, et principalement les lieux profonds, lorsque Dieu, par son Verbe, les réunit en un seul endroit, et il découvrit ainsi la terre, qui n’avait pas encore apparu; ainsi dégagée, elle était toujours informe; Dieu lui donna sa forme et lui fit trouver sa parure dans cette multitude de plantes, de semences et de fruits qu’elle produit.</p>
      <p>XIV. Voyez dans toutes ces productions quelle variété, quelle richesse, quelle beauté ravissante; remarquez qu’elles sont soumises à une espèce de résurrection qui peut nous donner une idée de celle qui doit un jour avoir lieu pour tous les hommes. Qui ne serait ravi d’admiration, en voyant naître un figuier d’une petite graine, et s’élever d’énormes troncs des plus petites semences? Quant à la mer, elle est en quelque sorte pour nous une image du monde. Comme la mer, que l’action du soleil et le sel qu’elle contient aurait desséchée depuis longtemps, si elle n’était continuellement entretenue par l’eau des fleuves et des fontaines, le monde eût péri il y a déjà des siècles, par la malice et les crimes sans nombre du genre humain, s’il n’avait eu pour le sauver la loi de Dieu et les prophètes, d’où jaillissent et découlent la mansuétude, la miséricorde, la justice et les divins préceptes de la parole de vérité. De même qu’au milieu des mers on rencontre des îles habitables où le matelot, battu par la tempête, trouve de l’eau, des fruits et un port assuré, ainsi Dieu a donné au monde, où l’iniquité soulève tant de flots et de tempêtes, des synagogues, c’est-à-dire de saintes Églises, qui sont autant d’îles fortunées, munies d’heureux ports, où se conserve la saine doctrine, et où viennent se réfugier les amis de la vérité, les hommes qui désirent faire leur salut et éviter la colère et le jugement de Dieu. De même encore qu’il est d’autres îles couvertes de rochers et de bêtes féroces, où l’on ne trouve ni eau, ni fruits, ni habitants, contre lesquelles viennent se briser les navires des malheureux navigateurs, et où périssent tous ceux qui veulent y aborder, ainsi en est-il des doctrines de l’erreur; je veux parler des hérésies qui donnent la mort à tous ceux qui viennent s’y réfugier, car ils n’ont plus la vérité pour guide comme les pirates qui poussent contre les écueils pour faire couler à fond les vaisseaux qu’ils ont dépouillés, l’erreur perd entièrement ceux qui se sont éloignés de la vérité.</p>
      <p>XV. Le quatrième jour, Dieu créa les corps lumineux; sa prescience lui faisait voir d’avance les puérilités des philosophes, qui, pour effacer son souvenir de tous les esprits, devaient dire un jour que la terre tirait des astres sa fécondité. Aussi a-t-il créé les plantes et les semences avant les corps lumineux, afin que rien ne pût obscurcir pour nous la vérité. Car un être postérieur à un autre ne peut produire celui qui le précède. Toutefois ces corps célestes sont le symbole d’un grand mystère: le soleil est l’image de Dieu, et la lune l’image de l’homme. De même, en effet, que le soleil l’emporte de beaucoup sur la lune en force, en magnificence, en beauté, ainsi Dieu est infiniment supérieur à l’homme. De même encore que le soleil reste toujours dans sa plénitude, sans diminuer jamais, ainsi Dieu reste toujours parfait, tout-puissant, plein d’intelligence, de sagesse et d’immortalité. La lune, au contraire, décroît et périt en quelque sorte tous les mois, à l’exemple de l’homme dont elle est l’image; puis elle croît de nouveau et renaît comme l’homme qui doit ressusciter un jour. Les trois jours qui précédèrent les corps lumineux sont l’image de la Trinité, c’est-à-dire de Dieu, de son Verbe et de son Esprit, et le quatrième est l’image de l’homme, qui a besoin de la lumière, pour que Dieu, le Verbe, l’Esprit, l’homme lui-même lui soient manifestés; c’est pour cela que les corps lumineux furent créés le quatrième jour. Quant à la disposition des astres, elle nous montre l’ordre et le rang des justes, de ceux qui pratiquent la piété et qui observent les commandements de Dieu. Les plus brillants représentent les prophètes; aussi sont-ils immobiles et ne passent-ils jamais d’un lieu à un autre. Ceux qui jettent après eux un moindre éclat représentent les justes. Enfin les astres errants, communément appelés planètes, sont l’image de ceux qui s’éloignent de Dieu, et qui abandonnent sa loi et ses préceptes.</p>
      <p>XVI. Le cinquième jour parurent les animaux nés des eaux, parmi lesquels se manifeste en mille manières la providence et la sagesse de Dieu. Qui pourrait dire leur nombre et la variété de leurs espèces? Dieu bénit ces animaux pour nous apprendre que tous ceux qui arrivent à la vérité, et qui sont régénérés et bénis de Dieu, obtiennent la grâce de la pénitence et la rémission de leurs péchés, par l’eau et le baptême de la régénération. Les poissons voraces et les oiseaux de proie expriment les hommes rapaces et méchants. En effet, parmi les oiseaux et les poissons, bien qu’ils soient tous d’une même nature, vous en trouvez qui vivent d’une manière conforme à l’instinct de cette nature, sans nuire aux faibles, et qui observent la loi de Dieu qui leur a assigné les fruits de la terre pour nourriture, tandis que d’autres, au contraire, transgresseurs de cette loi, se nourrissent de chair et font violence aux faibles; ainsi voit-on les justes soumis à la loi divine n’offenser et ne blesser personne, pratiquer la justice et la vertu, tandis que, semblables aux poissons, aux bêtes féroces et aux oiseaux voraces, les hommes spoliateurs, impies et homicides, dévorent en quelque sorte les plus faibles de leurs semblables. Toutefois, en recevant la bénédiction de Dieu, les animaux aquatiques et les volatiles n’ont reçu aucun avantage particulier.</p>
      <p>XVII. Le sixième jour, Dieu créa les quadrupèdes, les bêtes sauvages et les reptiles; mais il ne leur donna pas sa bénédiction, parce qu’il la réservait à l’homme, qu’il devait créer le même jour. Ces animaux sont l’image de certains hommes qui ne connaissent point Dieu, qui vivent dans l’impiété, qui n’ont du goût que pour les choses terrestres, et qui ne font point pénitence. Mais ceux qui s’éloignent des voies de l’iniquité, et qui vivent dans la justice, prennent leur vol vers le ciel comme les oiseaux; ils ont à cœur les choses d’en haut, et restent constamment attachés à la volonté de Dieu. Les impies, les hommes privés de la connaissance de Dieu, sont semblables aux oiseaux qui ont des plumes et ne peuvent voler; car, tout en portant le nom d’hommes, ils n’ont que des inclinations basses, rampantes, ils sont chargés de péchés. Les bêtes sauvages tirent leur nom d’un mot grec qui veut dire naturel féroce. Ce n’est pas qu’elles fussent ainsi dès le commencement; car Dieu n’a rien créé qui ne fût bon; mais le péché de l’homme les a fait dévier de leur nature première, et elles l’ont imité lui-même dans ses excès. De même, en effet, que la bonne conduite d’un maître force ses serviteurs à se bien conduire, tandis que ses déréglements les entraînent dans le désordre, ainsi en est-il arrivé par rapport à l’homme; il était le maître, il a fait le mal, et tout ce qui lui était soumis a dégénéré avec lui. Mais lorsque les hommes auront recouvré leur premier état, et qu’ils auront mis fin au péché, alors ces bêtes sauvages reprendront aussi leur naturel paisible.</p>
      <p>XVIII. Que dirons-nous de la création de l’homme? Elle est trop sublime pour qu’une bouche humaine puisse en parler dignement, et expliquer ces courtes paroles de l’Écriture: « Faisons l’homme à notre image et ressemblance;» Dieu, en les prononçant, fait voir quelle est la dignité de l’homme. Jusqu’alors il avait tout fait par sa parole; l’homme est le seul ouvrage qu’il juge digne d’être fait de ses mains; comme s’il eût compté pour rien les autres ouvrages en comparaison de ce dernier. Il semble même qu’il a besoin de secours, lorsqu’il dit: « Faisons l’homme à notre image et ressemblance.» Toutefois, cette parole, <i>faisons</i>, ne s’adressait qu’à son Verbe et à son Esprit. Lors donc qu’il eut créé l’homme et qu’il lui eut donné sa bénédiction pour qu’il se multipliât et qu’il remplît la terre, il mit tous les êtres sous son pouvoir et sa domination, et lui ordonna de vivre des fruits de la terre, des herbes et des plantes, prescrivant en même temps aux animaux de vivre avec lui et de se nourrir aussi de tous les fruits que la terre produisait.</p>
      <p>XIX. Après avoir ainsi terminé en six jours le ciel, la terre, la mer et tout ce qu’ils renferment, Dieu se reposa le septième jour de tous ses travaux. Puis la sainte Écriture résume en ces termes ce qu’elle avait dit jusqu’alors: « Telle fut l’origine des cieux et de la terre, lorsqu’ils furent créés; au jour que le Seigneur Dieu fit la terre et les cieux, avant toutes les plantes des champs et toutes les herbes de la campagne, quand la terre n’en produisait point; car le Seigneur Dieu n’avait point encore répandu la pluie sur la terre, et il n’y avait point d’homme pour la cultiver.» Ces paroles nous apprennent que la terre entière fut alors arrosée par une source toute divine, et que l’homme n’eut pas besoin de la cultiver; elle produisit tout d’elle-même, selon le commandement de Dieu, de peur que l’homme ne fût chargé d’un travail trop pénible. Cependant, pour bien mettre dans tout son jour la création de l’homme, et prévenir les difficultés que pourraient élever certains esprits qui embrouillent tout et qui ne manqueraient pas de dire: ces paroles, <i>faisons l’homme</i>, ont bien été prononcées, mais la création de l’homme n’est pas clairement exprimée, l’Écriture ajoute: « Or, il s’élevait de la terre des vapeurs qui en arrosaient la surface. Le Seigneur Dieu forma l’homme du limon de la terre; il répandit sur son visage un souffle de vie, et l’homme eut une âme vivante.» C’est de là que plusieurs tirent une preuve de l’immortalité de l’âme. Après que Dieu eût ainsi formé l’homme, il lui choisit dans les contrées orientales un jardin magnifique, où brillait la lumière la plus vive, où s’exhalait l’air le plus pur, et où croissaient des arbres de toute espèce. C’est là qu’il le plaça.</p>
      <p>XX. Voici les paroles mêmes de l’Écriture: « Le Seigneur Dieu avait planté dès le commencement un jardin de délices; il y avait placé l’homme qu’il avait formé. Et le Seigneur fit sortir de la terre une multitude d’arbres beaux à voix et dont les fruits étaient doux à manger; au milieu du jardin était l’arbre de vie et l’arbre de la science du bien et du mal. Dans ce lieu de délices coulait un fleuve qui arrosait le jardin et se divisait en quatre canaux. Le premier s’appelle Phison; c’est celui qui coule autour du pays de Hévilath, où l’on trouve de l’or, et l’or le plus pur; c’est là aussi que se trouvent le bdellium et la pierre d’onyx. Le nom du second fleuve est Géhon; c’est celui qui coule autour du pays de Chus. Le nom du troisième fleuve est le Tigre, il se répand du côté de l’Assyrie. Le quatrième fleuve est l’Euphrate. Le Seigneur Dieu prit l’homme et le plaça dans le jardin d’Éden pour le cultiver et le garder; et le Seigneur fit à l’homme un commandement, et lui dit: Tu peux manger de tous les fruits du jardin; mais ne mange pas du fruit de l’arbre de la science du bien et du mal, car au jour que tu en mangeras tu mourras de mort. Et le Seigneur Dieu dit: Il n’est pas bon que l’homme soit seul; faisons-lui une aide semblable à lui. Le Seigneur Dieu, après avoir formé de la terre tous les animaux de la terre et tous les oiseaux du ciel, les fit venir devant Adam, afin qu’il vît comme il les nommerait, et que chacun d’eux portât le nom qu’Adam lui avait donné. Et Adam donna leurs noms aux animaux domestiques, aux oiseaux du ciel, et aux bêtes sauvages; mais il n’avait point trouvé d’aide qui fût semblable à lui. Le Seigneur Dieu envoya donc à Adam un profond sommeil, et pendant qu’il dormait, Dieu prit de la chair d’un de ses côtés, et ferma ensuite la plaie. Le Seigneur Dieu forma ainsi une femme d’une côte d’Adam, et l’amena devant Adam; et Adam dit: voilà maintenant l’os de mes os, et la chair de ma chair: celle-ci s’appellera d’un nom pris du nom de l’homme, parce qu’elle a été tirée de l’homme. C’est pourquoi l’homme quittera son père et sa mère, et s’attachera à sa femme; et ils seront deux dans une même chair. Adam et sa femme étaient tous deux nus et n’en rougissaient point.</p>
      <p>XXI. « Or, le serpent était le plus rusé de tous les animaux que le Seigneur Dieu avait placés sur la terre, et il dit à la femme: Pourquoi Dieu vous a-t-il défendu de manger du fruit de tous les arbres de ce jardin? La femme lui répondit: Nous mangeons du fruit des arbres de ce jardin; mais pour le fruit de l’arbre qui est au milieu du jardin, Dieu nous a commandé de n’en point manger, et de n’y point toucher, de peur que nous mourrions. Le serpent répondit à la femme: Assurément vous ne mourrez point de mort; car Dieu sait que, le jour où vous aurez mangé de ce fruit, vos yeux s’ouvriront, et que vous serez comme des dieux, connaissant le bien et le mal. La femme s’apperçut donc que ce fruit était bon à manger et beau à voir, et d’un aspect désirable; et elle en prit et en mangea, et elle en donna à son mari, qui en mangea comme elle. Et les yeux de l’un et de l’autre furent ouverts; et ils connurent qu’ils étaient nus, et ayant entrelacé ensemble des feuilles de figuier, ils s’en firent des ceintures. Et ils entendirent la voix du Seigneur Dieu, qui s’avançait dans le jardin, à l’heure du jour où il s’élève un vent doux, et ils se cachèrent parmi les arbres, pour éviter la présence de Dieu. Mais le Seigneur Dieu appela Adam, et lui dit: Où es-tu? Adam répondit: J’ai entendu votre voix dans le jardin; et comme j’étais nu, j’ai été saisi de crainte et je me suis caché. Alors Dieu lui dit: Qui t’a appris que tu étais nu, à moins que tu n’aies mangé du fruit de l’arbre dont je t’avais défendu de manger? Adam répondit: La femme que vous m’avez donnée pour compagne m’a présenté du fruit de cet arbre, et j’en ai mangé. Et le Seigneur Dieu dit à la femme: Pourquoi as-tu fait cela? Elle répondit: Le serpent m’a trompée, et j’ai mangé de ce fruit. Le Seigneur Dieu dit alors au serpent: Parce que tu as fait cela, tu es maudit entre tous les animaux et toutes les bêtes de la terre; tu ramperas sur le ventre, et tu mangeras la poussière durant tous les jours de ta vie. Je mettrai inimitié entre toi et la femme, entre ta postérité et la sienne: elle te brisera la tête, et tu la blesseras au talon. Il dit à la femme: Je multiplierai tes calamités et tes enfantements; tu enfanteras dans la douleur, tu seras sous la puissance de ton mari, et il te dominera. Il dit aussi à Adam: Parce que tu as écouté la voix de ta femme, et que tu as mangé du fruit dont je t’avais ordonné de ne pas manger, la terre est maudite, et à cause de toi tu n’en tireras chaque jour ta nourriture qu’avec un grand labeur. Elle ne produira pour toi que des épines et des chardons, et tu te nourriras de l’herbe de la terre. Tu mangeras ton pain à la sueur de ton front, jusqu’à ce que tu retournes dans la terre d’où tu as été tiré; car tu es poussière, et tu retourneras en poussière.»</p>
      <p>XXII. Vous me direz peut-être: comment pouvez-vous maintenant nous présenter Dieu se promenant dans le paradis, vous qui disiez tout à l’heure qu’il ne pouvait être renfermé dans aucun lieu? Écoutez ma réponse: sans doute, le Dieu suprême, le Père de toutes choses, n’est et ne peut être renfermé dans aucun lieu; car il n’en est aucun qui le circonscrive. Mais son Verbe, par lequel il a tout fait, et qui est à la fois sa vertu et sa sagesse; son Verbe, dis-je, représentant le Père et maître de toutes choses, venait dans le paradis, comme personne divine, et conversait avec Adam. L’Écriture elle-même nous apprend, en effet, qu’Adam entendit une voix. Or, que pouvait être cette voix, si ce n’est le Verbe de Dieu, qui est aussi son Fils; non point qu’il ait été engendré d’une manière charnelle, ainsi que les poëtes nous représentent les enfants de leurs dieux, mais il a toujours été dans le sein de son Père, ainsi que la vérité nous le raconte; il est de toute éternité son conseil, bien avant toutes choses, puisqu’il est sa pensée et sa sagesse. Lorsqu’ensuite Dieu voulut créer, ainsi qu’il l’avait résolu, il engendra son Verbe, émané de lui et antérieur à toute créature. Cependant il ne se priva point lui-même de son Verbe, mais il l’engendra de telle sorte qu’il fût toujours avec lui. Voilà ce que nous enseignent les saintes Écritures, et tous ceux qui ont été inspirés du Saint-Esprit, parmi lesquels saint Jean s’exprime ainsi: « Au commencement était le Verbe, et le Verbe était avec Dieu.» Il nous montre, par ces paroles, que Dieu existait seul au commencement, et que son Verbe était avec lui. Puis il ajoute: « Et le Verbe était Dieu; toutes choses ont été faites par lui, et rien n’a été fait sans lui.» Ainsi donc le Verbe étant Dieu et engendré de Dieu, peut être envoyé par le Père de toutes choses dans un lieu quelconque, selon son bon plaisir; et lorsqu’il y est, on le voit, on l’entend, et il est véritablement présent dans ce lieu.</p>
      <p>XXIII. Dieu créa l’homme le sixième jour, mais il ne manifesta sa création qu’après le septième, lorsqu’il eut préparé le paradis, afin de lui donner le meilleur et le plus beau des séjours. La vérité de tout ce récit se manifeste clairement d’elle-même. Ne voyons-nous pas, en effet, que si la femme éprouve de si grandes douleurs au moment de l’enfantement, et si elle les oublie aussitôt après, c’est tout à la fois pour accomplir la parole de Dieu et contribuer à l’accroissement du genre humain? Ne voyons-nous pas encore que si le serpent est ainsi en horreur, s’il rampe sur sa poitrine et s’il se nourrit de terre, c’est afin de confirmer la vérité de tout ce que nous avons dit!</p>
      <p>XXIV. Dieu fit donc sortir de la terre toute sorte d’arbres beaux à la vue et dont le fruit était doux à manger; car il n’y avait d’abord que les plantes, les semences et les herbes qui avaient été produites le troisième jour. Sans doute, les plantes qui se trouvaient dans le paradis étaient bien supérieures aux autres en beauté et en saveur, puisque Dieu dit que c’est un jardin planté par lui-même; cependant le reste du monde possédait aussi les mêmes plantes, si l’on en excepte les deux arbres de la vie et de la science, qui ne se trouvaient nulle autre part ailleurs. Ce paradis était un jardin, une terre, Dieu lui-même l’avait planté, comme nous l’apprend l’Écriture, lorsqu’elle dit: « Le Seigneur avait planté, vers l’Orient, un paradis de délices; il y avait placé l’homme. Et Dieu fit sortir encore de la terre une multitude d’arbres beaux à voir et dont les fruits étaient doux à manger.» Ces mots: <i>de terre et d’Orient</i>, nous montrent clairement que le paradis était sous ce même ciel où se trouvent la terre et l’Orient. Le mot Éden est hébreu et signifie délices. Les saints livres nous apprennent aussi que de l’Éden sortait un fleuve, qui arrosait le paradis, et qui se divisait ensuite en quatre canaux; les deux premiers, appelés Phison et Géhon, baignent les contrées orientales, le Géhon surtout enveloppe de ses eaux toute l’Éthiopie; c’est encore lui, dit-on, qui coule en Égypte, sous le nom de Nil. Les deux autres, je veux dire le Tigre et l’Euphrate, nous sont bien connus; car ils ne sont pas éloignés de nos contrées. Lors donc que Dieu eut placé l’homme dans le paradis, comme nous l’avons dit plus haut, afin de le cultiver et de le garder, il lui ordonna de manger de tous les fruits qui s’y trouvaient; il lui défendit seulement de toucher à l’arbre de la science. Formé de terre, le voilà transporté dans un paradis; Dieu voulait, par là, l’exciter à se rendre de plus en plus parfait, à se montrer Dieu en quelque sorte, et à s élever, par degrés, jusqu’au ciel, pour s’assurer l’immortalité. L’homme avait été créé dans un état intermédiaire, n’étant ni tout à fait mortel, ni entièrement exempt de la mort, mais il pouvait être l’un ou l’autre. Il en était de même du paradis qu’il habitait; il tenait, par sa beauté, le milieu entre le ciel et la terre. Ces mots, pour travailler, veulent dire pour garder les commandements de Dieu, afin qu’il ne se perdît point par la désobéissance, ainsi que le malheur arriva.</p>
      <p>XXV. L’arbre de la science était, sans doute, bon en lui-même aussi bien que son fruit; et ce n’était point l’arbre, comme le pensent quelques-uns, qui était mortel, mais bien la transgression du précepte. Car cet arbre ne renfermait autre chose que la science; et la science est toujours bonne, lorsqu’on en fait un bon usage. Or, Adam nouvellement né était en quelque sorte un enfant, et ne pouvait encore recueillir le fruit de la science. En effet, les enfants ne peuvent manger du pain aussitôt après leur naissance; mais on leur donne d’abord du lait, puis ils reçoivent une nourriture plus solide, à mesure qu’ils avancent en âge. Et voilà ce qui serait arrivé à Adam: Dieu lui défendit donc de toucher à l’arbre de la science, non point par jalousie, comme le pensent quelques-uns, mais parce qu’il voulait mettre son obéissance à l’épreuve. Il voulait encore que l’homme persévérât longtemps dans cette candeur, cette simplicité de l’enfance. Et n’est-ce pas un devoir sacré aux yeux de Dieu et des hommes, qu’on se soumette à ses parents avec candeur et simplicité? et si les enfants doivent être soumis à leurs parents, à plus forte raison doivent-ils l’être à Dieu, qui est le père de tous. D’ailleurs, il ne convient pas aux enfants d’être plus sages que leur âge ne le comporte; car la sagesse a ses degrés, aussi bien que le développement des forces corporelles. Que dirai-je encore? lorsque nous désobéissons à une loi qui nous fait une défense, il est bien clair que ce n’est point la loi qui est cause du châtiment, mais la désobéissance elle-même, et la transgression de la loi. Blâmerez-vous un père de faire des défenses à son fils, et de le punir s’il les méprise; toutefois la punition ne vient point de la chose elle-même, mais de la désobéissance. Ce qui fit sortir Adam du paradis, c’est donc la transgression du précepte divin: encore une fois, l’arbre de la science ne renfermait rien de mauvais; c’est du péché, comme d’une source funeste, que sont sorties les souffrances, les douleurs, les peines et la mort même.</p>
      <p>XXVI. Mais Dieu, dans sa miséricorde, ne voulut pas laisser à jamais l’homme esclave du péché; il le condamna à l’exil, il le chasse hors du paradis, pour le châtier, lui faire expier sa faute pendant un temps déterminé et le rétablir ensuite dans l’état d’où il était déchu. Aussi ce n’est pas sans mystère qu’après avoir raconté la création de l’homme, la Genèse fait entendre qu’il serait deux fois établi dans le paradis: la première, immédiatement après avoir été créé; la seconde, après la résurrection et le jugement. De même que le potier brise le vase qu’il vient de faire, s’il y remarque quelque défaut, pour le refondre ensuite et le refaire tout entier, ainsi l’homme est brisé en quelque sorte par la mort, pour ressusciter ensuite plein de vigueur et de santé; c’est-à-dire revêtu de pureté, de justice et d’immortalité. Si Dieu appelle Adam, et lui demande: « Adam, où es-tu?» ce n’est pas qu’il l’ignore; mais comme il est très-patient, il veut laisser au coupable le temps du repentir et de l’aveu.</p>
      <p>XXVII. On me demandera peut-être: Adam fut-il créé mortel? Non; fut-il créé immortel? Point du tout. Il n’était donc rien? Ce n’est pas ce que je veux dire; sans doute, il ne fut créé ni mortel, ni immortel; car, si Dieu l’avait créé immortel dès le commencement, il l’aurait fait Dieu, et s’il l’avait fait mortel, il semble qu’il serait la cause de sa mort. Il ne le créa donc ni mortel, ni immortel, mais, comme nous l’avons déjà dit, capable d’être l’un ou l’autre. En suivant la voie qui conduit à l’immortalité, c’est-à-dire en restant fidèle observateur de la loi du Seigneur, il devait recevoir de lui l’immortalité en récompense, et devenir semblable à Dieu; mais en prenant le chemin de la mort, par la désobéissance, il se donnait la mort lui-même; car Dieu l’avait créé libre, et ne gênait en rien sa liberté. Et aujourd’hui, par un effet admirable de sa bonté et de sa miséricorde, il rend à l’homme devenu fidèle tout ce qu’il avait perdu par sa négligence et son infidélité. C’est en désobéissant à Dieu qu’il s’était donné la mort; c’est aussi en se soumettant à sa volonté qu’il peut recouvrer la vie éternelle. Car Dieu nous a donné une loi et de saints préceptes, qui sont le gage du salut pour leurs fidèles observateurs, et leur assurent, après la résurrection, un héritage incorruptible.</p>
      <p>XXVIII. Après qu’Adam eut été chassé du paradis, il connut son épouse, que Dieu avait formée d’une de ses côtes. Ce n’est pas qu’il n’ait pu la former autrement; mais il prévoyait déjà que les hommes introduiraient une multitude de dieux; il voyait d’avance ce que préparait le serpent, je veux dire ce culte insensé d’une multitude de dieux qui ne sont pas. Un seul existait, et bientôt l’erreur du polythéisme allait se répandre et faire croire aux hommes qu’ils étaient des dieux. C’est pourquoi, afin qu’on ne crût pas que l’homme était l’ouvrage d’un Dieu, et la femme l’ouvrage d’un autre, il les fit l’un l’autre, et non isolément; c’était comme un symbole mystérieux, qui manifestait l’unité de Dieu, puisque c’est lui qui fit aussi la femme; d’un autre côté, il voulait que leur union fût plus tendre et plus intime: aussi Adam dit à Ève: « Voilà maintenant l’os de mes os, et la chair de ma chair.» Puis il ajoute ces paroles prophétiques: « C’est pourquoi l’homme quittera son père et sa mère, et s’attachera à sa femme; et ils seront deux dans une même chair:» paroles qui se vérifient tous les jours parmi nous. Qui, en effet, après un mariage légitime, ne quitte pas son père, sa mère, ses parents et ses proches, pour s’attacher à son épouse, et ne l’aime point de l’amour le plus tendre? Combien d’hommes exposent à tous les dangers pour leur épouse? Ève fut trompée autrefois par le serpent, et devint la cause du péché; voilà pourquoi le démon, auteur de tous les maux, Satan, qui s’entretint avec la femme, par l’intermédiaire du serpent, se sert encore d’elle toutes les fois qu’il veut corrompre les hommes. Il est appelé lui-même démon et dragon, parce qu’il s’est séparé de Dieu en véritable transfuge; car il était ange auparavant. Comme nous avons parlé de lui fort au long dans un autre endroit, il est inutile de nous y arrêter davantage.</p>
      <p>XXIX. Adam connut Ève, son épouse, qui conçut et enfanta un fils appelé Caïn; et elle dit alors: « J’ai possédé un homme par la grâce de Dieu.» Puis elle enfanta un second fils, nommé Abel: « Or, Abel fut pasteur de brebis, et Caïn laboureur.» L’histoire de ces deux frères est fort étendue; c’est pourquoi nous renvoyons à la Genèse ceux qui désirent la connaître plus au long. Satan, étonné non-seulement de ce qu’Adam et Ève jouissaient de la vie, mais encore de ce qu’ils avaient des enfants; jaloux d’ailleurs de n’avoir pu leur donner la mort, et de voir qu’Abel était agréable à Dieu, engagea son frère Caïn à le tuer. C’est ainsi que la mort entra dans le monde et qu’elle envahit tout le genre humain. Mais Dieu, toujours plein de miséricorde, voulant laisser à Caïn aussi bien qu’à Adam le temps du repentir et de la pénitence, lui parla en ces termes: « Où est ton frère Abel?» Caïn lui répondit avec fierté et arrogance: « Je ne sais; suis-je le gardien de mon frère?» Alors le Seigneur irrité lui dit: « Qu’as-tu fait? La voix du sang de ton frère crie de la terre jusqu’à moi. Maintenant donc tu seras maudit sur cette terre qui s’est ouverte pour recevoir le sang de ton frère, versé par ta main. Tu seras gémissant et tremblant sur la terre.» Depuis ce temps la terre, comme saisie d’effroi, refuse de s’abreuver du sang d’aucun homme ni d’aucun animal. Ce qui prouve que ce n’est point en elle que réside la faute, mais bien dans l’homme, qui a violé le précepte</p>
      <p>XXX. Caïn eut aussi un fils, appelé Énoch; il donna le nom de ce fils à la ville qu’il bâtit. Ainsi commencèrent les villes, longtemps avant le déluge, et non point, comme le dit faussement Homère, quand les hommes eurent diverses langues. Énoch engendra un fils, appelé Gaidad, qui engendra lui-même Meel: de Meel naquit Mathusalem, et de Mathusalem, Lamech. Ce dernier eut deux épouses, appelées Ada et Séla. Alors commença la polygamie; la musique date aussi de cette époque. Lamech eut trois enfants, appelés Obel, Jubal et Thobel. Obel nourrit paisiblement ses troupeaux sous ses tentes, Jubal inventa la harpe et la guitarre, Thobel forgea le fer et l’airain. Là s’arrête la généalogie des enfants de Caïn; le reste de sa race fut enseveli dans l’oubli, en punition du meurtre de son frère. Cependant, à la place d’Abel, Dieu donna à Ève un autre fils appelé Seth, par lequel le reste des hommes s’est propagé jusqu’à ce jour. Ceux qui seraient curieux de connaître les diverses générations n’ont qu’à lire les Écritures. Nous avons fait en partie ce travail, ainsi que nous l’avons dit; c’est une dissertation, ou plutôt une suite de généalogie, qui se trouve dans le premier livre de nos Histoires. Nous tenons toutes ces choses de l’Esprit saint lui-même, qui a parlé par la bouche de Moïse et des autres prophètes; nos saints livres sont donc plus anciens et plus vrais que toutes les fables et les récits des historiens et des poëtes. Il en est qui ont regardé Apollon comme l’inventeur de la musique; d’autres ont prétendu qu’Orphée en avait conçu l’idée en écoutant le doux chant des oiseaux; mais il est facile de se convaincre de la vanité et du ridicule de ces prétentions, quand on sait que ces personnages ont vécu plusieurs années après le déluge. Quant à l’événement, arrivé du temps de Noé, ce patriarche, que quelques auteurs appellent Deucalion, nous l’avons discuté dans ce livre dont nous venons de parler; vous pourrez le consulter, si vous le voulez.</p>
      <p>XXXI. Après le déluge, les rois et les villes recommencèrent de nouveau dans l’ordre qui suit: La première cité fut Babylone, puis Orach, Archat et Chalane, dans la terre de Sénaar. Le roi de ces villes fut Nébroth. D’elles sortit Assur, qui donna son nom aux Assyriens. Nébroth bâtit les villes de Ninive, de Roboam, de Calac et de Dasen, située entre Ninive et Calac. Mais la ville de Ninive se distingua entre toutes les autres par sa vaste étendue. Un autre fils de Sem, enfant de Noé, appelé Mesraïm, engendra Landonim, Énemigin, Labiim, Nephtaliim et Patrosoniim, qui donna le jour à Philisthiim. Nous avons parlé des trois fils de Noé, de leur mort et de leur généalogie, dans ce premier livre de nos Histoires déjà cité. Il nous reste maintenant à rappeler les autres villes, les autres rois et les autres événements qui remontent à l’époque où les hommes n’avaient qu’une seule langue. Les villes dont nous avons déjà parlé appartiennent à ce temps-là. Le moment arrivait où les hommes devaient se disperser dans les différentes parties du monde. Pour rendre leurs noms immortels, ils prirent la résolution, de leur mouvement propre et sans consulter la volonté de Dieu, de bâtir une ville et une tour, dont le faîte s’élèverait jusqu’aux cieux. Mais parce qu’ils avaient osé entreprendre un si grand ouvrage sans consulter le Seigneur, il renversa leur ville et leur tour; il confondit en même temps leur langage, et chacun eut sa langue particulière. C’est aussi ce que nous apprend la Sibylle, lorsque annonçant au monde la colère future de Dieu, elle s’exprime en ces termes: « Alors, dit-elle, s’accomplirent les menaces que le Dieu suprême avaient faites aux mortels, quand ils élevèrent une tour sur la terre d’Assyrie. Ils parlaient tous la même langue, et ils voulurent escalader le ciel étoilé. Mais aussitôt l’éternel ordonna aux vents de se déchaîner; ils renversèrent cette tour superbe, et jetèrent la discorde parmi les hommes. Lorsque la tour se fut ainsi écroulée et que les langues des hommes se furent divisées en plusieurs dialectes, la terre alors se remplit d’habitants, commandés par différents rois.» Tel est le récit de la Sibylle. Ces événements se passèrent dans la terre des Chaldéens; il y avait alors dans la terre de Chanaan une ville nommée Charra. À cette époque parut Pharaon, le premier roi d’Égypte; il fut appelé aussi Nachaoth, par les Égyptiens; d’autres rois lui succédèrent. Dans la terre de Sénaar, occupée par les Chaldéens, le premier roi fut Arioch: après lui vint Ellasar, puis Chodollagomor, puis Thargal, roi des peuples qui furent nommés Assyriens. Il y eut aussi cinq villes dans la partie occupée par Cham, fils de Noé; c’étaient Sodome, Gomorrhe, Adama, Seboïm et Ségor, qui eurent pour rois Ballas, Barsas, Sénaar, Hymor et Balac. Ces cinq rois obéirent pendant douze ans à Chodollagomor, roi des Assyriens. Mais ils rompirent avec lui à la treizième année, et ils eurent une longue lutte à soutenir contre quatre rois d’Assyrie. Telle fut l’origine des guerres sur la terre: ces rois domptèrent les géants de Caranaïn, et avec eux, au sein même de leur ville, des nations guerrières et les Chorréens, qui habitaient les montagnes nommées Séir, jusqu’à la ville de Térébinthe, appelée aussi Pharan, parce qu’elle est située dans un désert. Il y avait alors un saint roi, nommé Melchisédech, qui régnait dans la ville de Salem, appelée aujourd’hui Jérusalem. Il fut le premier pontife du Dieu très-haut, et donna à la ville qu’il habitait le nom qu’elle porte encore. À dater de son règne, il y eut des prêtres dans tout l’univers. Après lui, Abimélech régna à Gerare, puis un autre Abimélech, puis Éphron, surnommé Chettevs. Voilà les noms des premiers rois. Ceux des autres rois d’Assyrie, qui régnèrent plusieurs années après, sont passés sous le silence par tous les historiens qui ont rapporté des événements plus rapprochés de nous. On en cite quelques-uns: Taglaphasar, Salmanasar, puis encore Sennachérib. Vint ensuite l’Éthiopien Adramélech, qui fut aussi roi d’Égypte. Mais tout cela est bien récent, en comparaison de l’antiquité de nos saints livres.</p>
      <p>XXXII. Ainsi donc les hommes érudits, qui veulent fouiller dans les temps anciens, peuvent juger par là combien vos histoires sont incomplètes et récentes, lorsqu’elles ne se rattachent pas aux récits des saints prophètes. Dans ces premiers temps, les hommes étaient rares dans l’Arabie et la Chaldée; mais lorsqu’ils furent divisés de langage, ils commencèrent à croître et à se multiplier peu à peu dans tout l’univers. Les uns allèrent habiter l’Orient; les autres, les parties du grand continent et le septentrion, ensorte qu’ils s’étendirent jusque chez les Bretons, vers les régions du pôle arctique. Quelques-uns occupèrent le pays des Chananéens, qui fut ensuite appelé Judée et Phénicie, puis les contrées de l’Éthiopie, de l’Égypte et de la Libye, puis encore la région appelée Torride, et les terres qui appartiennent à l’Occident. Le reste enfin se répandit dans diverses contrées, dans l’Asie, la Grèce, la Macédoine, l’Italie, les Gaules, les Espagnes et la Germanie, ensorte qu’aujourd’hui l’univers entier se trouve peuplé. Le monde avait été divisé d’abord en trois parties, l’Orient, le Midi et l’Occident; quand les hommes débordèrent ainsi de tous côtés, les autres parties du monde furent aussi habitées. Cependant des écrivains, à qui ces faits sont inconnus, ne craignent point d’affirmer que le monde est sphérique, et semblable à un cube. Et comment pourraient-ils se flatter d’être ici dans la vérité, puisqu’ils ignorent la création du monde et la manière dont il s’est peuplé? Les hommes s’étant multipliés peu à peu sur la terre, comme nous l’avons déjà dit, bientôt les îles elles-mêmes et les contrées désertes se couvrirent d’habitants.</p>
      <p>XXXIII. Quel sage, quel poëte, quel historien a pu dire la vérité sur ces premiers événements? tous leurs dieux eux-mêmes n’ont-ils pas été engendrés longtemps après la fondation des villes? ne sont-ils pas bien postérieurs aux rois, aux peuples et aux guerres de ces premiers temps? Ces historiens ne devaient-ils pas aussi faire mention de tout ce qui s’est passé, même avant le déluge? Si les prophètes d’Égypte et les autres auteurs chaldéens parlaient par l’Esprit saint et annonçaient la vérité, ne devaient-ils pas tout faire connaître, parler avec exactitude de l’origine du monde, de la création de l’homme et des autres événements qui suivirent? Non-seulement ils devaient parler du passé et du présent, mais ils devaient même prévoir l’avenir et nous apprendre quel était le sort réservé au monde. Il est évident qu’ils étaient tous dans l’erreur, que les Chrétiens seuls possèdent la vérité; car ils sont instruits par l’Esprit saint, qui a parlé par les prophètes et leur a annoncé toutes choses.</p>
      <p>XXXIV. Aussi, je vous exhorte à étudier, avec le plus grand soin, la parole divine, c’est-à-dire les écrits des prophètes; vous pourrez comparer notre doctrine avec celle de tous les autres écrivains, et cette comparaison vous fera trouver la vérité. Leurs histoires elles-mêmes nous apprennent que ceux dont ils font des divinités ont été simplement des hommes qui vécurent jadis parmi eux, comme nous l’avons déjà démontré. Jusqu’à ce jour encore on ne cesse de leur élever des statues, qui ne sont que de purs simulacres et « l’œuvre de simples mortels.» Une multitude d’hommes insensés leur rend un culte divin, tandis que dans leur folle croyance, et abusés par l’erreur et les préjugés qu’ils ont reçus de leurs pères, ils insultent au dieu créateur, à celui qui a fait toutes choses et qui nourrit tout être vivant. Cependant le Dieu, Père et créateur de l’univers, n’a pas abandonné le genre humain; mais il lui a donné sa loi, et lui a envoyé ses saints prophètes pour la lui annoncer, afin que tous, sortant de leur sommeil, confessent qu’il n’existe qu’un seul Dieu. Ces mêmes prophètes nous ont appris à nous abstenir du culte sacrilége des idoles, de l’adultère, du meurtre, de la débauche, du larcin, de l’avarice, du parjure, de la colère et de toute impureté; ils nous ont appris aussi à ne point faire aux autres ce que nous ne voudrions pas qu’on nous fît à nous-mêmes, nous assurant que celui qui observe la justice évitera les supplices de l’enfer et obtiendra de Dieu la vie éternelle.</p>
      <p>XXXV. La loi divine nous défend donc d’adorer non-seulement les simulacres, mais encore les éléments, le soleil, la lune et les étoiles; elle nous défend d’offrir aucun culte au ciel, à la terre, à la mer, aux fontaines et aux fleuves, mais d’adorer, avec un cœur pur et un esprit sincère, celui-là seul qui est véritablement Dieu et qui a créé toutes choses. Voici ce qu’elle enseigne: « Tu ne seras point adultère; tu ne tueras point; tu ne déroberas point; tu ne porteras point de faux témoignage; tu ne désireras point la femme de ton prochain.» Les prophètes tiennent aussi le même langage. Salomon nous apprend à ne pas même pécher par les yeux, lorsqu’il dit: « Que tes yeux voient la justice, et que tes paupières ne consentent qu’au bien.» Moïse, qui est aussi rangé parmi les prophètes, parle en ces termes du pouvoir du Dieu unique: « C’est là votre Dieu qui a créé la terre et affermi le ciel; c’est lui dont les mains ont fait briller cette multitude d’astres, cette innombrable milice du ciel; mais il ne les a pas créés, pour que vous les adoriez.» Isaïe lui-même a dit aussi: « C’est ici la parole du Seigneur, du Dieu qui a créé et étendu les cieux; qui affermit la terre et la couvre de fruits; qui donne le souffle aux animaux, et la vie aux hommes.» Et dans un autre endroit: « Moi j’ai fait la terre et j’ai créé l’homme qui l’habite; j’ai étendu les cieux de ma main.» Plus loin encore: « C’est là votre Dieu; il fixé les bornes de la terre, il ne connaît pas la faim, il ne se fatigue point; sa sagesse est impénétrable.» Jérémie a dit pareillement: « Celui qui a fait la terre par sa puissance, et qui a préparé l’univers dans sa sagesse, a étendu les cieux par son intelligence. À sa voix les eaux se rassemblent dans le ciel, et il élève les nuées des extrémités de la terre; il fait briller les éclairs au milieu de la pluie, il tire les vents de ses trésors.» Vous voyez que tous les prophètes sont unanimes pour célébrer le pouvoir d’un Dieu unique, l’origine du monde et la création de l’homme. Ils ont déploré du fond de leur cœur l’impiété des hommes, et flétri les prétendus sages qui suivaient la voie de l’erreur et s’endurcissaient dans le mal. Voici comment parle Jérémie: « Tout homme est infecté de sa science, l’ouvrier est couvert de honte, à cause de son œuvre; en vain celui qui travaille l’argent fabrique une idole d’argent, la vie n’y réside pas. Au jour de la visite du Seigneur, ils périront.» Ainsi parle David: « Ils se sont corrompus, ils sont devenus abominables: dans leurs voies, il n’en est pas un qui fasse le bien, pas un seul; tous sont égarés, ils sont devenus incapables du bien.» Habacuch a dit pareillement: « À quoi sert l’idole sculptée par l’ouvrier, l’idole jetée en fonte? Il a formé une vaine image; malheur à celui qui dit au bois, réveillez-vous; et à la pierre, levez-vous pour me répondre!» Tous les prophètes de la vérité ont tenu le même langage. Mais pourquoi les citer tous, ils sont en grand nombre et tous d’accord sur les vérités qu’ils enseignent? Que ceux qui veulent s’en instruire plus en détail consultent leurs écrits et ne se laissent plus égarer par tant de vains systèmes, qui ne sont que laborieuses puérilités. Les prophètes hébreux, dont nous parlons, étaient des hommes sans lettres, sans science, la plupart de simples bergers.</p>
      <p>XXXVI. Voici maintenant les paroles de la Sibylle, qui fut la prophétesse des Grecs et des autres nations. Voyez comment elle s’élève contre le genre humain, au commencement de sa prophétie: « Hommes charnels et sujets à la mort, vous qui n’êtes rien, pourquoi vous enorgueillir, sans regarder la fin de la vie? Comment ne tremblez-vous pas, comment n’êtes-vous pas saisis de terreur, en pensant au Dieu très-haut qui voit tout, qui examine tout, qui connaît tout, qui nourrit tout, et qui nous a donné à tous une âme pour nous conduire? Il n’est qu’un seul Dieu, maître absolu, tout-puissant, invisible, qui voit toutes choses, sans être vu par aucun œil mortel? Quel œil humain, en effet, pourrait voir le Dieu céleste, immortel et véritable, qui habite les cieux? l’homme peut-il seulement fixer le soleil, l’homme qui a reçu le jour et qui n’est qu’un composé de chair et de sang? Adorez donc ce Dieu unique, qui gouverne le monde, qui seul a existé pendant les siècles et avant les siècles, qui est engendré de lui-même, incréé, maître de toutes choses, et qui doit juger tous les hommes. Si, au lieu d’adorer le Dieu véritable et éternel, et de lui offrir des sacrifices, vous allez immoler aux démons qui habitent les enfers, attendez-vous à une juste punition. Vous marchez pleins d’orgueil et de fureur; vous abandonnez le droit chemin, pour aller à travers les épines et les précipices? Pourquoi errer ainsi; ô mortels! cessez de poursuivre les ténèbres et la nuit obscure, saisissez la lumière. Voici un astre qui brille à tous les yeux et qui ne conduit point à l’erreur: Venez, abandonnez les ténèbres, et suivez la douce lumière du soleil. Connaissez la sagesse, et gravez-la pour jamais dans votre cœur. Il n’est qu’un seul Dieu qui envoie la pluie, les vents et les tremblements de terre; qui envoie la foudre, la famine, la peste, les divers fléaux, la neige et la glace. Pour tout dire, en un mot, il gouverne le ciel, il tient la terre dans sa main, il possède la vie.» Écoutez encore ce qu’elle dit des dieux qui ont été engendrés: « S’il est vrai que tout ce qui est engendré est, par là même, sujet à la corruption, Dieu ne peut être formé de l’homme. Il n’est donc qu’un seul Dieu, qui a créé le ciel et le soleil, la lune et les étoiles, la terre et les mers, les montagnes et les sources d’eau vive. Il a créé aussi une multitude prodigieuse d’animaux aquatiques et de reptiles qui se meuvent sur la terre et dans les eaux. Il nourrit mille oiseaux divers, qui étalent les richesses de leur plumage, qui font entendre d’harmonieux accords, et qui agitent doucement l’air avec leurs ailes. Il a placé dans les forêts et dans le creux des montagnes la race sauvage des bêtes féroces, tandis qu’il nous a donné, pour nos besoins, une multitude innombrable d’animaux domestiques, et qu’il nous a établis rois et maîtres sur tout. Car il a soumis à l’homme les animaux dont les races sont si nombreuses et les espèces si variées. Quel mortel pourrait connaître toutes les œuvres du Créateur? Lui seul les connaît, lui qui a tout fait, qui est incorruptible, éternel, et qui habite les cieux; lui qui comble de biens les hommes vertueux, tandis qu’il fait tomber, sur les méchants, sa colère et sa fureur, la guerre, la peste et les douleurs, causes de tant de larmes. Ô hommes! pourquoi vous élever ainsi pour périr à jamais? Rougissez d’honorer comme des dieux les chats, les insectes! N’est-ce pas folie, fureur, stupidité; car ces dieux s’introduisent dans les vases, dans les marmites pour y voler et piller; lorsqu’ils devraient habiter le ciel, si magnifique et si riche, ils s’occupent de morceaux rongés de vers et couvert de toiles d’araignées. Insensés! vous adorez des serpents, des chiens, des chats, des oiseaux, des reptiles, des statues et des monceaux de pierres qu’on trouve dans les rues. Que dis-je? Je n’oserais nommer toutes les choses hideuses qui sont encore l’objet de vos hommages. Ce sont des dieux qui trompent des hommes insensés, et répandent, de leurs bouches, un poison mortel. Vous ne devez fléchir le genou que devant l’être incréé, éternel et incorruptible, qui seul répand la joie plus douce que le plus doux miel, et prendre votre route vers les siècles éternels. Mais vous avez tout oublié: la coupe de justice, si pure, si pleine, surabondante, quel abus vous en avez fait, dans votre imprudence et votre délire! Vous ne voulez point sortir de votre léthargie, revenir à la sagesse et reconnaître pour roi le Dieu qui voit tout. C’est pourquoi un feu dévorant est venu sur vous; vous serez à jamais brûlés par les flammes, et couverts de confusion, à cause de vos vaines idoles. Mais ceux qui adorent le Dieu éternel et véritable auront pour héritage la vie qui n’a pas de fin; ils habiteront le jardin délicieux du paradis, et mangeront le doux pain des anges.» Telles sont les paroles de la Sibylle: qui ne comprend combien elles sont utiles, vraies, justes, amies de l’homme?</p>
      <p>XXXVII. À l’égard des châtiments réservés aux méchants, plusieurs poëtes eux-mêmes les ont reconnus et annoncés: c’est en cela qu’ils portaient témoignage contre eux-mêmes et contre tous les impies. Eschyle a dit: « On doit souffrir selon le mal qu’on a fait.» Et Pindare: « Il est juste qu’on éprouve un sort proportionné à sa conduite.» Euripide dit aussi: « Souffrez, sans vous plaindre, ce que vous avez encouru de gaieté de cœur, la loi est de sévir contre l’ennemi qu’on a pris.» Et dans un autre endroit: « Il est, je pense, d’un homme courageux de poursuivre son ennemi.» Archiloque a dit: « Il est une chose qui importe, c’est d’expier le mal qu’on a fait.» Au sujet de la patience de Dieu, qui voit tout, qui sait tout, et néanmoins attend le jugement, parce qu’il est patient, Denys s’exprime en ces termes: « Quoique l’œil de la justice semble s’ouvrir doucement, il n’en voit pas moins toutes choses.» Voici comment Eschyle parle du jugement de Dieu et des maux qui doivent fondre tout à coup sur les méchants: « Les maux ne tarderont pas à tomber sur les coupables, et de terribles châtiments menacent ceux qui abandonnent la justice. Vous la voyez maintenant persécutée et sans voix; cependant elle ne cesse de vous suivre de loin et de près, soit que vous dormiez, ou que vous soyez en marche ou bien en repos. La nuit la plus obscure ne peut cacher votre iniquité; et sachez que lorsque vous faites le mal, vous avez toujours un témoin qui vous regarde.» Simonide ne s’écrie-t-il pas: « Il n’arrive aucun mal à l’homme auquel il ne doive s’attendre, car Dieu renverse tout en un moment.» Écoutez encore Euripide: « Ne vous fiez point, dit-il, à la prospérité des méchants, et ne comptez point sur la durée de leur orgueilleuse opulence. Leurs enfants même ne sont point sûrs de l’avenir; car le temps ne connaît point de parents, et dévoile les crimes des hommes à la postérité.» Et dans un autre endroit: « La science ne manque pas à Dieu, et il lui est facile de connaître les méchants et leurs parjures.» Sophocle dit enfin: « Si vous avez fait le mal, il faut que vous souffriez aussi le mal.» Ainsi donc les poëtes s’accordent à peu près tous avec les prophètes sur les châtiments que Dieu réserve aux parjures et aux autres crimes. Que dis-je? De bon gré ou de force, ils sont amenés à tenir le même langage sur le feu qui doit dévorer le monde; postérieurs à nos écrivains sacrés, ils ont pu dérober toutes ces connaissances aux livres de la loi et des prophètes.</p>
      <p>XXXVIII. Mais qu’importe qu’ils soient venus avant ou après les prophètes? Toujours est-il qu’ils s’accordent parfaitement avec les derniers. Car voici ce que dit le prophète Malachie sur le feu qui doit consumer le monde: « Le jour du Seigneur vient comme un incendie qui dévorera tous les impies.» Isaïe dit: « La colère de Dieu viendra comme la grêle qui se précipite et comme le torrent qui entraîne tout dans un gouffre.» Non-seulement la Sibylle, les poëtes et les philosophes ont parlé de la justice de Dieu, du jugement et des peines à venir, mais, forcés encore par la vérité, ils ont confessé la providence de Dieu; ils ont dit qu’il s’occupait des vivants et des morts. Voici comment Salomon parle de ces derniers: « Le parfum se répandra sur leurs chairs, et l’huile coulera sur leurs os.» David dit aussi: « Mes os brisés tressailliront.» C’est précisément la pensée du poëte Timocle: « Dieu, dit-il, regarde avec bonté ceux qui reposent dans l’urne.» Voyez la contradiction où tombent tous ces auteurs. Ils adorent une multitude de dieux, et reconnaissent l’empire d’un seul; ils nient le jugement et le confessent; ils combattent et admettent l’immortalité de l’âme. Homère dit quelque part: « Son âme s’évanouit comme un songe.» Puis dans un autre endroit: « Son âme, en quittant son corps, descendit aux enfers.» Et ailleurs encore: « Ensevelis-moi, afin que j’entre au plus tôt dans le royaume de Pluton.» Vous avez lu les autres poëtes, vous savez comment ils raisonnent; je serai facilement compris de tout homme qui cherche la sagesse de Dieu et qui lui plaît par sa foi, sa justice et ses bonnes œuvres; car voici ce qu’a dit le prophète Osée: « Où est le sage? Et il comprendra ce que je dis, l’homme prudent? Et il pénètrera mes paroles: car les voies de Dieu sont droites; les justes y marchent d’un pied ferme, les méchants y chancellent à chaque pas.» Il faut que celui qui désire apprendre s’y porte avec plaisir. Venez donc souvent me voir, nous converserons ensemble, et dans ces entretiens de vive voix vous apprendrez à connaître la vérité.</p>

      <h2>3</h2>
      <p>I. Théophile à Autolyque, salut. La vaine gloire pousse d’ordinaire les auteurs à composer de nombreux ouvrages: les uns sur les dieux, sur les guerres, sur les temps; les autres sur de vaines fables et de laborieuses bagatelles qui vous retiennent encore, bien que livré à l’étude sérieuse qui nous occupe; malgré les entretiens que nous avons eus jusqu’alors, vous traitez toujours avec mépris la doctrine de vérité, vous regardez nos saintes Écritures comme des livres tout à fait nouveaux; en reprenant les choses dès l’origine, il me sera facile de vous convaincre de la haute antiquité de ces divins livres; c’est ce que je vais faire en peu de mots, avec l’aide de Dieu, afin que la longueur du traité ne vous empêche pas de le lire entièrement et qu’il vous soit plus facile de découvrir les inepties des autres écrivains.</p>
      <p>II. Il aurait fallu qu’ils eussent été témoins oculaires des faits qu’ils rapportent, ou du moins qu’ils les eussent appris exactement de ceux qui les avaient vus de leurs yeux; car c’est frapper l’air que de transmettre des choses incertaines. Qu’a servi à Homère d’avoir écrit la guerre de Troie, et d’avoir induit tant d’hommes en erreur? À Hésiode, d’avoir recueilli péniblement la généalogie de ceux qu’on regarde comme des dieux? À Orphée, d’avoir compté trois cents soixante-cinq dieux, qu’il a détruits lui-même, à la fin de sa vie, lorsqu’il a déclaré, dans son livre des Préceptes, qu’il n’y avait qu’un seul Dieu? Qu’est-ce qu’Aratus, et tous ceux qui firent la description du globe, ont retiré de leur travail? Une gloire humaine peu méritée. Qu’est-ce qu’ils nous ont dit de vrai? Qu’ont servi à Euripide, à Sophocle et aux autres tragiques, leurs tragédies? à Ménandre, à Aristophane et aux autres comiques, leurs comédies? à Hérodote et à Thucydide, leurs histoires? Qu’a retiré Pythagore d’Adyte et des colonnes d’Hercule, ou Diogène de sa philosophie cynique? Qu’est-il revenu à Épicure de nier la Providence, à Empédocle de professer l’athéisme, à Socrate de jurer par le chien, l’oie et le platane, par Esculape, frappé de la foudre, et par les démons qu’il invoquait? Pourquoi s’est-il présenté à la mort avec joie? Quelle récompense espérait-il recevoir après cette vie? Qu’a servi à Platon la philosophie dont il est l’auteur, et à la multitude innombrable des philosophes leurs diverses opinions? Ce que nous disons ici a pour but de montrer la vanité et l’impiété de leur doctrine.</p>
      <p>III. Tous ces hommes, en effet, avides d’une folle gloire, n’ont pas découvert la vérité, ni excité les autres à la chercher; ils se trouvent réfutés par leurs propres paroles, puisque leurs livres sont remplis de contradictions. Non-seulement ils se détruisent les uns les autres, mais il en est même qui annullent leurs propres arrêts; de sorte que leur gloire s’est changée en opprobre et en folie, car tout homme sage les condamne. Ils ont parlé des dieux et ont enseigné ensuite qu’il n’en existait aucun; ils ont traité de l’origine du monde et ont dit après que tout était incréé; ils ont disputé sur la Providence, et ont décidé ensuite que le monde était le jouet du hasard. Mais, que dirai-je? n’ont-ils pas écrit aussi sur l’honnêteté des mœurs, tandis qu’ils enseignaient la licence, la débauche, l’adultère, et qu’ils introduisaient des crimes affreux? Ils célèbrent des dieux dont le titre de gloire est d’avoir été les premiers à se plonger dans d’infâmes turpitudes, et à se rassasier de mets exécrables. Quel est celui d’entre eux qui n’ait chanté Saturne dévorant ses enfants; Jupiter mangeant son fils Métis, et invitant les dieux à d’horribles festins où servait, dit-on, Vulcain, forgeron et boiteux; Junon enfin, sa propre sœur, qu’il épousa, et qui fit servir sa bouche impure à des choses infâmes? Vous n’ignorez point, sans doute, les autres forfaits de Jupiter, tels qu’ils sont racontés par les poëtes. Pourquoi parler encore des crimes de Neptune, d’Apollon, de Bacchus, d’Hercule, de Minerve et de Vénus la prostituée, puisque j’en ai traité au long dans un autre livre?</p>
      <p>IV. Je ne me serais pas arrêté à une semblable réfutation, si je ne vous avais encore vu flottant et incertain sur la doctrine de la vérité. Quelle que soit, en effet, votre sagesse, vous accueillez volontiers les paroles des hommes les plus insensés; autrement vous n’auriez point été ébranlé par leurs vains discours, vous n’auriez point cru à de vieilles calomnies semées par l’impiété, qui invente toutes sortes de crimes contre nous, parce que nous sommes Chrétiens et que nous adorons le vrai Dieu. Ils répètent partout que dans nos assemblées toutes les femmes sont en commun, qu’on s’unit au hasard avec ses propres sœurs, et, ce qui est le comble de l’impiété et de la barbarie, que toute espèce de chair nous est bonne, même la chair humaine. Ils ajoutent aussi que notre doctrine est toute nouvelle, que nous manquons de preuves, pour en établir la vérité, que nos institutions sont des folies. Je ne puis trop m’étonner de vous voir prêter à nos discours une oreille si peu attentive, vous, si studieux, si appliqué dans tout le reste; car vous passeriez vos nuits dans les bibliothèques, si vous le pouviez.</p>
      <p>V. Mais puisque vous avez beaucoup lu, que vous semble-t-il des préceptes de Zénon, de Diogène et de Cléanthe, qui veulent qu’on mange de la chair humaine, que les enfants eux-mêmes égorgent et dévorent leurs parents, et que celui qui refuserait un semblable aliment soit lui-même dévoré? Cette impiété n’est-elle pas encore surpassée par le conseil de Diogène, qui apprend aux enfants à immoler leurs parents en place de victime, et à se repaître de leur chair? Que dis-je? L’historien Hérodote ne raconte-t-il pas que Cambyse, après avoir tué les enfants d’Harpagus, les fit servir ensuite sur la table de leur père? Le même historien rapporte aussi que dans les Indes les parents sont dévorés par leurs propres enfants. Exécrable doctrine! véritable athéisme! démence! fureur de ces hommes qui se disent philosophes! N’est-ce pas à leur doctrine que nous devons ce règne d’impiété qui remplit le monde?</p>
      <p>VI. En effet, presque tous ceux qui se sont égarés dans la philosophie s’entendent pour enseigner quelques crimes affreux. Platon le premier, lui dont la doctrine paraît supérieure à toutes les autres, décide, avec l’autorité d’un législateur, dans son premier livre de la république, que toutes les femmes seront communes; il s’appuie de ce que fit un fils de Jupiter qui donna des lois aux Crétois, et n’apporte pas d’autre raison que le frivole prétexte de favoriser la fécondité, et de procurer en même temps une espèce de soulagement à ceux qui sont accablés de travaux, bien que sa loi fût en opposition directe avec toutes les lois existantes. Car Solon voulait que les enfants naquissent d’un mariage légitime, et non point d’un adultère; l’intention de sa loi était d’empêcher les enfants de regarder comme père un étranger, ou d’outrager l’auteur de leurs jours faute de le connaître. Épicure soutient encore, outre son athéisme, qu’on peut s’unir sans crime à une mère, à une sœur, et il conseille tous les crimes défendus par les lois de Rome et de la Grèce. Épicure et les stoïciens n’enseignent-ils pas l’inceste avec des sœurs ou les unions contre nature? Ils ont rempli les bibliothèques de leur doctrine afin de corrompre jusqu’à l’enfance elle-même. Mais pourquoi nous arrêter plus longtemps à ces philosophes? N’ont-ils pas tous professé la même doctrine à l’égard de ceux qu’ils regardent comme des divinités?</p>
      <p>VII. En effet, après avoir reconnu l’existence des dieux, ils les réduisent tous au néant. Les uns disent qu’ils sont formés des atomes; d’autres qu’ils se changent en atomes, et qu’ils n’ont pas plus de pouvoir que les hommes. Platon, tout en reconnaissant les dieux, ne fait point difficulté de dire qu’ils sont nés de la matière. Pythagore, qui fit tant de recherches sur la divinité, qui parcourut le monde en tous sens, décide que tout a été fait par les forces de la nature, par un concours fortuit, et que les dieux ne s’occupent nullement des hommes. Je passe sous silence tous les systèmes imaginés par l’académicien Clitomaque, pour prouver qu’il n’y avait point de dieux. Que n’a pas dit encore Critias? Que n’a pas dit Protagoras, dont on cite ces paroles: « Je ne puis assurer si les dieux existent, ni démontrer quels ils sont; bien des raisons m’en empêchent.» Le sentiment d’Euhémère, cet homme d’une si profonde impiété, ne me semble pas mériter d’être rapporté. Car après avoir osé disputer longtemps sur les dieux, il finit par les nier tous, et dire que c’est le hasard qui gouverne le monde. Platon lui-même, qui traita fort au long de l’unité de Dieu et de l’immortalité de l’âme humaine, ne semble-t-il pas se contredire ensuite, lorsqu’en parlant des âmes, il dit que les unes passent dans d’autres hommes; que les autres vont animer des animaux sans raison? Est-il une opinion plus capable de révolter le bon sens? quoi! un homme se trouve métamorphosé tout à coup en un chien, en un loup, en un âne ou en tout autre animal semblable! Pythagore a soutenu la même doctrine, et de plus il a nié la Providence. À qui croirons-nous donc? Sera-ce au poëte comique Philémon, qui dit: « Les adorateurs de la Divinité ont une belle espérance de salut?» Ou bien à ceux que nous avons nommés: à Euhémère, Épicure, Pythagore et les autres, qui ne reconnaissent ni Dieu ni Providence? Voici comment Aristo parle de l’un et de l’autre: « Confiez-vous, dit-il, aux gens vertueux, car si Dieu prête son secours à tout le monde, il assiste cependant d’une manière particulière ces derniers. S’il n’y avait pas de récompense, à quoi servirait-il d’être pieux, comme la justice le demande? Cependant j’ai vu souvent dans le monde les gens de bien gémir dans l’adversité, tandis que des égoïstes, uniquement occupés de leur intérêt, étaient environnés de gloire et d’éclat. Mais attendons la fin; car le monde n’est point abandonné à l’impulsion aveugle du hasard, comme le prétendent certains philosophes dont l’opinion est aussi affreuse qu’elle est funeste; ils veulent en faire le rempart de leur dépravation. Mais au contraire le juste sera un jour récompensé de sa vertu, comme le méchant sera puni de ses crimes, ainsi qu’il convient.» Vous voyez donc combien tous ces philosophes sont peu d’accord entre eux sur Dieu et la Providence; ceux-ci ont reconnu, ceux-là ont nié l’un et l’autre. Aussi tout lecteur prudent doit peser les paroles de chacun d’eux, selon le conseil de Simylus: « Qu’ils soient ineptes, dit-il, ou pleins de sens, les poëtes ont d’ordinaire le droit de dire tout ce qu’ils veulent; mais c’est à nous de juger.» C’est aussi le conseil de Philémon: « Rien, dit-il, n’est plus fâcheux qu’un auditeur inepte qui ne sait pas juger par lui-même.» Vous devez donc examiner avec soin tout ce qu’ont dit les poëtes et les philosophes, et ce que nous disons nous-mêmes, avant de prononcer un jugement.</p>
      <p>VIII. Ceux qui rejetaient vos dieux les ont ensuite admis, et leur ont attribué les plus grands crimes. Les débauches de Jupiter surtout ont été pompeusement célébrées par les poëtes; et Chrysippe va jusqu’à dire que Junon prêta sa bouche impure pour un usage infâme. Pourquoi rappeler les débauches de celle qu’on regarde comme la mère des dieux, de Jupiter Latiare qui avait soif de sang humain, et d’Atis qui fut cruellement mutilé? Pourquoi parler de Jupiter, surnommé le tragique, qui baigna de sang, dit-on, sa propre main, et qui est honoré aujourd’hui comme un Dieu chez les Romains? Je passe encore sous le silence les temples d’Antinoüs et des autres qu’on honore du nom de dieux; car les gens sensés ne pourraient entendre mes paroles sans rire. Ainsi donc les philosophes qui ont professé une pareille philosophie sont accusés, par leurs propres écrits, ou d’impiété, ou d’une infâme turpitude. On trouve même dans leurs livres le conseil de dévorer les hommes, et ils donnent les dieux qu’ils adorent comme des modèles de tous les crimes que l’on peut commettre.</p>
      <p>IX. Pour nous, nous reconnaissons un Dieu, mais un seul Dieu; nous savons aussi que la Providence gouverne toutes choses, mais lui seul est cette Providence; nous avons reçu une loi sainte, mais nous avons pour législateur le vrai Dieu, qui nous apprend à pratiquer la piété, la justice, et à faire le bien. Voici ses préceptes sur la piété: « Tu n’auras point d’autres dieux que moi. Tu ne te feras point d’idole taillée, ni aucune image de ce qui est au-dessus de toi dans les cieux, en bas sur la terre, ni dans les eaux sous la terre. Tu ne les adoreras point et ne les serviras pas: car je suis le Seigneur ton Dieu.» Sur les bonnes œuvres, il s’exprime ainsi: « Honore ton père et ta mère, afin que tes jours soient longs sur la terre que le Seigneur ton Dieu ta donnée.» Voici enfin ce qu’il dit de la justice: « Tu ne seras point adultère. Tu ne tueras point. Tu ne déroberas point. Tu ne porteras point de faux témoignage contre ton prochain. Tu ne désireras point la femme de ton prochain, ni sa maison, ni son serviteur, ni sa servante, ni son bœuf, ni son âne, ni aucune chose qui soit à lui. Tu ne seras point inique dans le jugement du pauvre. Tu t’éloigneras de toute parole injuste. Tu ne tueras point le juste et l’innocent. Tu ne justifieras point l’impie et tu ne recevras pas de présents; car les présents aveuglent les yeux de ceux qui voient et pervertissent les justes.» Le ministre de cette sainte loi fut Moïse, serviteur de Dieu, qui la reçut pour le monde entier et principalement pour les Hébreux, connus aujourd’hui sous le nom de Juifs; ce peuple fut autrefois réduit en servitude par le roi d’Égypte, quoiqu’il fût de la race des saints patriarches Abraham, Isaac et Jacob. Mais Dieu se souvint de lui; il lui suscita Moïse, qui étonna l’Égypte de ses prodiges et délivra les Hébreux de leur dure captivité; puis après les avoir fait errer dans le désert, il les rétablit dans la terre de Chanaan, appelée plus tard Judée; ensuite il leur donna sa loi et ses préceptes. Tels sont les dix points principaux de cette loi admirable qui embrasse toute justice.</p>
      <p>X. Comme les Hébreux, originaires de la Chaldée, étaient allés en Égypte acheter du blé à cause de la famine qui régnait dans leur pays, et qu’ils étaient restés dans cette terre étrangère quatre cent trente ans, selon la prédiction que le Seigneur leur avait faite, après lesquels Moïse devait les conduire dans le désert, Dieu leur fit cette recommandation particulière dans la loi: « Vous n’affligerez point l’étranger; car vous connaissez le sort de l’étranger, vous l’avez été vous-mêmes dans la terre d’Égypte.»</p>
      <p>XI. Ce peuple ayant ensuite violé la loi qu’il avait reçue, Dieu, plein de miséricorde, ne voulut cependant pas le perdre, mais il lui suscita des prophètes parmi ses propres enfants, afin de l’instruire, de lui rappeler ses préceptes et de l’exhorter à la pénitence; il leur prédit en même temps que s’ils persévéraient dans leur mauvaise voie, ils seraient captifs dans tous les royaumes de la terre; événement qui s’est accompli, ainsi qu’il est facile de le voir. Voici comme le prophète Isaïe les exhorte tous en général à la pénitence, et le peuple en particulier: « Cherchez, dit-il, le Seigneur pendant que vous pouvez le trouver; invoquez-le pendant qu’il est proche. Que l’impie abandonne sa voie, et l’homme inique ses pensées; qu’ils retournent au Seigneur, il aura pitié d’eux; qu’ils reviennent, le Seigneur est riche en miséricordes, il vous remettra tous vos péchés.» Le prophète Ézéchiel dit aussi: « Si l’impie fait pénitence de tous ses péchés, s’il garde tous mes préceptes, et s’il accomplit le jugement et la justice, il vivra et ne mourra point. Je ne me souviendrai plus de toutes ses anciennes iniquités, et il vivra des œuvres de justice qu’il aura faites, parce que je ne veux point la mort de l’impie, dit le Seigneur, mais qu’il se convertisse, qu’il se retire de sa mauvaise voie et qu’il vive.» Isaïe ajoute: « Convertissez-vous au Seigneur, si vous voulez parvenir au salut, vous qui méditez d’iniques projets au fond de vos cœurs. Tournez-vous vers le Seigneur votre Dieu, dit Jérémie, comme le vendangeur vers la vigne, et vous obtiendrez miséricorde.» Nos livres saints parlent de la pénitence dans une infinité d’endroits, car le Seigneur a toujours voulu la conversion de l’homme.</p>
      <p>XII. Les prophètes et les évangélistes s’accordent parfaitement entre eux sur la justice ordonnée par la loi; car ils ont tous été inspirés par le même esprit, l’esprit divin. Voici ce que dit Isaïe: « Faites disparaître l’impiété de vos âmes, apprenez à faire le bien, cherchez la justice, délivrez l’opprimé, jugez l’orphelin et justifiez la veuve.» Puis dans un autre endroit: « Rompez, dit-il, les liens de l’iniquité, portez les fardeaux de ceux qui sont accablés, donnez des consolations aux affligés, brisez les fers des captifs, partagez votre pain avec celui qui a faim, et recevez sous votre toit ceux qui n’ont point d’asile; lorsque vous voyez un homme nu, couvrez-le, et ne méprisez point la chair dont vous êtes formés: alors votre lumière brillera comme l’aurore, et je vous rendrai la santé, et votre justice marchera devant vous.» Jérémie dit pareillement: « Allez sur les chemins, considérez et interrogez les anciens sentiers pour connaître la bonne voie, et marchez-y; et vous trouverez le rafraîchissement de vos âmes. Rendez la justice avec équité, car c’est là la volonté du Seigneur votre Dieu.» Moïse dit aussi: « Gardez la justice, et approchez-vous du Seigneur votre Dieu, qui a affermi le ciel et posé les fondements de la terre.» Écoutez encore le prophète Joël: « Réunissez le peuple, dit-il, purifiez-le; assemblez les vieillards, les enfants, ceux même qui sont à la mamelle; que l’époux sorte de sa couche, et l’épouse de son lit nuptial. Priez avec ferveur le Seigneur votre Dieu, afin qu’il ait pitié de vous et qu’il efface vos péchés.» Le prophète Zacharie s’écrie de son côté: « Voici ce que dit le Seigneur, le Dieu des armées: Jugez selon la justice, usez de clémence et de miséricorde les uns envers les autres. Ne calomniez ni la veuve, ni l’orphelin, ni l’étranger, ni le pauvre; que l’homme ne médite pas dans son cœur le mal contre son frère.»</p>
      <p>XIII. À l’égard de la chasteté, l’Écriture nous apprend non-seulement à ne point pécher par action, mais à éviter même toute mauvaise pensée, de sorte que notre cœur reste toujours pur, et que nos yeux ne s’arrêtent point sur la femme d’autrui. Voici comment s’exprime Salomon, tout à la fois roi et prophète: « Que tes yeux, dit-il, voient le bien, et que tes paupières ne consentent pas au mal; prépare un sentier droit à tes pas.» Puis se fait entendre la voix évangélique qui recommande si expressément cette vertu: « Quiconque aura regardé une femme pour la convoiter, a déjà commis l’adultère dans son cœur. Quiconque renverra sa femme, si ce n’est pour cause d’adultère, la rendra adultère; et celui qui épousera la femme renvoyée commet un adultère.» Salomon dit encore: « Qui cachera du feu dans son sein sans voir ses vêtements brûlés? Qui marchera sur des charbons ardents sans consumer ses pieds? Il en est ainsi de celui qui s’approche de la femme de son prochain; celui qui la touchera ne restera pas impuni.»</p>
      <p>XIV. Non-seulement les saints livres nous apprennent à aimer nos parents et nos amis, mais aussi nos ennemis, selon ces paroles d’Isaïe: « Dites à ceux qui vous haïssent et vous détestent: Vous êtes nos frères; afin que le nom du Seigneur soit glorifié, et que la joie soit dans leur cœur.» L’Évangile dit encore: « Aimez vos ennemis, faites du bien à ceux qui vous haïssent, et priez pour ceux qui vous calomnient; car si vous aimez ceux qui vous aiment, quelle récompense aurez-vous? Les publicains ne le font-ils pas aussi?» Ceux même qui font le bien ne doivent point s’en glorifier, ni chercher à plaire aux hommes: « Que votre main gauche, dit le Sauveur, ne sache pas ce que fait votre main droite.» La sainte Écriture nous ordonne aussi d’être soumis aux magistrats et aux princes, et de prier pour eux, « afin que nous menions une vie paisible et tranquille.» Enfin elle nous apprend à rendre à chacun ce qui lui appartient: « Rendez, dit saint Paul, l’honneur à qui vous devez l’honneur, la crainte à qui vous devez la crainte. Ne demeurez redevable de rien à personne, si ce n’est de l’amour qu’on se doit les uns aux autres.»</p>
      <p>XV. Voyez donc maintenant si des hommes instruits à cette école peuvent vivre au hasard, se plonger dans de honteuses débauches, et ce qui est le comble de l’impiété, se nourrir de chair humaine, surtout quand il leur est défendu d’assister aux jeux des gladiateurs, pour ne pas se rendre complices des meurtres qui s’y commettent? Nous ne devons pas non plus nous trouver aux autres spectacles, dans la crainte de souiller nos yeux et nos oreilles, par tout ce qu’on y voit et tout ce qu’on y entend. Si vous parlez de repas abominables, là, en effet, les enfants de Thyeste et de Térée sont dévorés; si vous parlez d’adultère, c’est là qu’on représente, sur la scène, non-seulement des hommes, mais même des dieux souillés de ce crime, et leurs débauches sont célébrées par des voix mélodieuses et mercenaires. Loin de nous, loin de l’esprit des Chrétiens de semblables horreurs! La tempérance habite parmi eux, ils honorent la continence, ils respectent le mariage, ils gardent la chasteté; l’injustice est proscrite, le péché détruit, la justice pratiquée, la loi accomplie; on rend à Dieu le culte qui lui est dû et on célèbre ses louanges; la vérité domine, la grâce conserve, la paix met en sûreté; la parole sainte conduit, la sagesse enseigne, la véritable vie est connue, et Dieu règne. Je pourrais m’étendre encore davantage sur nos mœurs, sur les attributs du Dieu que nous adorons. Mais ce que j’en ai dit suffira pour vous inspirer la curiosité de connaître et d’étudier à fond notre doctrine. Et vous le pouvez facilement; soyez désireux d’apprendre, comme vous l’avez toujours été jusqu’ici.</p>
      <p>XVI. Mais venons maintenant à la question des temps: je veux, Dieu m’aidant, l’examiner attentivement avec vous, afin que vous compreniez que notre doctrine n’est ni nouvelle, ni mensongère, mais qu’elle est bien plus ancienne et plus vraie que tout ce que nous ont transmis vos poëtes et vos historiens. Rien de plus incertain que tout ce qu’ils ont dit. Les uns, en effet, ont prétendu que le monde était incréé et qu’il avait existé de tout temps; d’autres conviennent qu’il a été créé, mais ils lui donnent une existence de cent cinquante-trois mille soixante-quinze années. Voilà ce que nous dit l’Égyptien Apollonius: Platon lui-même, qui paraît avoir été le plus sage des Grecs, dans combien de puérilités ne s’est-il pas égaré? Voici ce que nous lisons dans son livre intitulé <i>les Cités:</i> « Comment, si le monde a toujours existé, ainsi qu’il est aujourd’hui, comment aurait-on découvert ensuite des choses nouvelles, puisqu’elles furent inconnues pendant dix mille fois dix mille ans aux hommes qui vivaient alors, et qu’elles n’ont été découvertes que depuis mille ou deux mille ans, par Dédale, Orphée et Palamède?» Ainsi Platon reconnaît bien que le monde a été créé, mais il compte dix mille fois dix mille ans depuis le déluge jusqu’à Dédale. Plus loin encore, après avoir traité fort au long des différentes cités, des habitations et des peuples qui couvrent la terre, il confesse ingénûment qu’il n’a avancé que des conjectures: « Si j’avais un Dieu pour hôte, dit-il, et qu’il me promît ses lumières, et si nous examinions de nouveau de quelle manière il convient de porter la loi, je ne sais pas si, changeant de langage, etc.» Ainsi donc, il n’a donné que des conjectures; mais des conjectures ne sont pas des vérités.</p>
      <p>XVII. Il vaut mieux être disciple de la sagesse divine, comme ce philosophe l’avoue lui-même, puisqu’il dit que Dieu seul peut nous apprendre la vérité. Mais quoi! les poëtes Homère, Hésiode et Orphée, n’ont-ils pas dit qu’ils avaient eu cet avantage? Il y a plus, les historiens racontent qu’ils furent contemporains des prophètes, des hommes inspirés, et qu’ils ont transmis fidèlement tout ce qu’ils en avaient appris. À combien plus forte raison sommes-nous donc sûrs de connaître la vérité, nous qui la tenons des saints prophètes, remplis de l’esprit de Dieu? Aussi règne-t-il entre eux l’accord le plus parfait; ils ont annoncé d’avance tous les événements qui devaient arriver au monde entier. L’accomplissement de leurs premières prédictions peut convaincre tout homme avide de s’instruire et de connaître la vérité, qu’elle se trouve dans tout ce qu’ils ont dit des temps antérieurs au déluge, et sur la suite des temps, depuis l’origine du monde jusqu’à nos jours: et dès lors il est évident que les récits des autres écrivains ne sont que d’ineptes impostures, et un tissu de faussetés.</p>
      <p>XVIII. Platon, en effet, comme nous l’avons déjà dit, reconnaît un déluge, mais un déluge partiel, qui ne couvrit que la plaine; ensorte que ceux qui se réfugièrent sur les hautes montagnes ne périrent point. D’autres prétendent que Deucalion et Pyrrha existaient alors, et qu’ils furent sauvés dans une arche; que Deucalion, étant ensuite sorti de l’arche, jeta derrière lui des pierres qui se convertirent aussitôt en hommes. C’est pourquoi, disent-ils, les hommes réunis ou les peuples ont été appelés <i>laoi</i>. D’autres encore veulent que Clymène ait existé lors du second déluge. Vous voyez assez par tout ce que je viens de dire, combien sont misérables, impies, insensés tous ces philosophes, qui se sont consumés dans des veilles pour écrire de semblables rêveries. Mais notre prophète Moïse, ce serviteur de Dieu, qui raconte l’origine du monde, nous a fait connaître la manière dont le déluge avait eu lieu sur la terre, et toutes les circonstances qui accompagnèrent ce grand événement. Il n’imagine point d’y introduire Pyrrha, Deucalion ou Clymène, et il ne dit point non plus que les plaines furent seules inondées et que les habitants des montagnes échappèrent à la mort.</p>
      <p>XIX. Non-seulement il dit qu’il n’y a eu qu’un déluge, mais il déclare qu’il n’y en aura plus jamais; comme, en effet, il n’y en a pas eu depuis, de même il n’y en aura point dans la suite. Il nous apprend encore que huit personnes seulement furent sauvées dans l’arche construite d’après l’ordre de Dieu, non point par Deucalion, mais par Noé, dont le nom en hébreu signifie <i>repos</i>. Nous avons démontré, dans un autre livre, que Noé annonça le déluge aux hommes de son temps, et qu’il les invita à se repentir, lorsqu’il leur dit: « Venez, Dieu vous appelle à la pénitence;» de là lui est venu le nom de Deucalion. Noé avait trois fils, comme nous l’avons déjà dit dans le second livre, Sem, Cham et Japhet, qui avaient chacun leur femme, ce qui fait six; en comprenant le père et la mère, nous avons les huit personnes qui entrèrent dans l’arche, et qui échappèrent à la mort. Moïse dit ensuite que le déluge dura quarante jours et quarante nuits; que les cataractes du ciel s’ouvrirent et que les sources de l’abîme se débordèrent, ensorte que l’eau s’élevait de quinze coudées au-dessus des plus hautes montagnes. Ainsi périt le genre humain, si l’on en excepte les huit personnes qui furent sauvées dans l’arche, dont on montre encore les restes sur les montagnes d’Arabie. Voilà en abrégé l’histoire du déluge.</p>
      <p>XX. Moïse fut le chef des Juifs que le roi Pharaon, appelé aussi Amasis, laissa sortir d’Égypte. Il régna vingt-cinq ans et quatre mois, après l’expulsion des Hébreux, selon les supputations de Manéthos; à celui-ci succéda Chebron, qui régna treize ans; à celui-ci, Aménophis, qui régna vingt ans et sept mois; à celui-ci, sa sœur, nommée Amessa, qui régna vingt-un ans et un mois; après elle, Mephres, pendant douze ans et neuf mois; après celui-ci, Methrammuthosis, pendant vingt ans et dix mois; après lui, Tythmoses, pendant neuf ans et huit mois; à celui-ci succéda Damphenophis, qui régna trente ans et dix mois; à celui-ci succéda Orus, qui régna trente-cinq ans et cinq mois; à celui-ci succéda sa fille, qui régna dix ans et trois mois; après elle vint Mercheres, pendant douze ans et trois mois; à celui-ci succéda son fils, nommé Armais, qui régna quatre ans et un mois; à celui-ci, Messes, fils de Miamme, qui régna six ans et deux mois; à celui-ci, Rhamesses, qui régna un an et quatre mois; à celui-ci succéda Aménophis, qui régna dix-neuf ans et six mois. Après lui régnèrent, pendant dix ans, Thassus et Rhamesses, qui eurent, dit-on, de grandes armées de terre et de mer. Ainsi les Hébreux, se trouvant alors étrangers en Égypte, furent réduits en servitude par le roi Tethmos, comme nous l’avons déjà dit, et ils lui élevèrent les villes fortes de Peitho, de Rhamesen et d’On, qui est aujourd’hui Héliopolis; ensorte que ces villes célèbres sont postérieures aux Hébreux, nos ancêtres, de qui nous avons reçu les livres saints plus anciens que toutes les histoires. Le royaume d’Égypte tira son nom du roi Sethos, qui signifie, dit-on, la même chose que le mot Égypte. Sethos eut un frère, nommé Armœn, et plus tard Danaüs, qui vint à Argos, après avoir quitté l’Égypte; c’est un des plus anciens dont parlent les écrivains profanes.</p>
      <p>XXI. Manéthos, si favorable aux Égyptiens, et si ennemi de Moïse et des Hébreux, objets de ses blasphèmes, comme s’ils avaient été chassés d’Égypte à cause de la lèpre, n’a pu préciser exactement les époques. Forcé néanmoins par la vérité, il est convenu, malgré lui, qu’ils étaient pasteurs; en effet, ceux de nos ancêtres qui séjournèrent en Égypte menèrent la vie pastorale; mais ils n’étaient point lépreux. Lorsqu’ils furent arrivés dans la terre nommée Jérusalem, et qui devint ensuite leur séjour, on sait que leurs prêtres, qui passaient leur vie dans le temple, par l’ordre de Dieu, traitaient tous les genres d’infirmités et guérissaient la lèpre et les autres maladies. Ce fut Salomon, roi de Judée, qui bâtit le temple. Il n’est pas douteux que Manéthos se soit trompé sur les époques; il suffit de lire ses écrits, pour s’en convaincre. Il s’est même trompé à l’égard du roi Pharaon, qui chassa les Hébreux; il ne régna plus en Égypte, et fut enseveli dans la mer Rouge, avec son armée, en poursuivant les Israélites. Il se trompe encore, lorsqu’il dit que ces pasteurs hébreux firent la guerre aux Égyptiens. Car, après être sortis d’Égypte, ils habitèrent le pays que nous appelons encore aujourd’hui Judée, trois cent quatre-vingt-treize ans avant l’arrivée de Danaüs à Argos. Or, nous savons que Danaüs est regardé, par la plupart des auteurs, comme le plus ancien des Grecs. Ainsi Manéthos a consigné malgré lui dans ses ouvrages deux vérités: la première, c’est que les Hébreux étaient pasteurs; et la seconde, c’est qu’ils sont sortis d’Égypte; ensorte que, même en adoptant la chronologie de ces temps-là, Moïse et ceux qui le suivait se trouvent être évidemment antérieurs à la guerre de Troie, de neuf cents ou même de mille ans.</p>
      <p>XXII. À l’égard du temple bâti dans la Judée par le roi Salomon, cinq cent soixante ans après la sortie d’Égypte, les archives des Tyriens renferment des commentaires qui parlent de sa fondation, et qui la font remonter à cent quarante trois ans et huit mois avant celle de Carthage par les Tyriens. Ce fait a été consigné sous le règne d’Hierome, roi des Tyriens, qui était ami de Salomon, soit à cause de l’éminente sagesse de ce grand roi, soit à cause de l’intimité où il avait été avec son père. Ces deux princes ne cessaient de s’adresser l’un à l’autre des questions à résoudre, comme l’attestent les copies de leurs lettres conservées, dit-on, chez les Tyriens, et les lettres même qu’ils s’écrivaient. C’est encore ce qu’atteste l’Éphésien Ménandre, dans l’histoire des rois de Tyr; voici ses paroles: « Après la mort d’Abeimal, roi des Tyriens, Hierome, son fils, prit les rênes de l’état, et vécut cinquante-trois ans; il eut pour successeur Bazore, qui vécut quarante-trois ans, et en régna dix-sept; après lui vint Méthuastarte, qui vécut cinquante-quatre ans et en régna douze; à celui-ci succéda son frère Atharyme, qui vécut cinquante-huit ans et en régna neuf; il fut tué par son frère Helles, qui vécut cinquante ans et régna huit mois. Ce dernier fut tué par Juthobal, prêtre d’Astarté, qui vécut quarante ans et en régna douze; à celui-ci succéda son fils Bazor, qui vécut quarante-cinq ans et en régna sept; à celui-ci succéda son fils Métis, qui vécut trente-deux ans et en régna vingt-neuf; à celui-ci succéda Pygmalion, fils de Pygmalius, qui vécut cinquante-six ans et en régna sept. Mais à la septième année de son règne sa sœur, fuyant dans la Libye, fonda la ville de Carthage, qui conserve encore aujourd’hui son nom.» Ainsi, le temps qui s’est écoulé depuis le règne d’Hierome renferme en tout cent cinquante-cinq ans et huit mois. Or, ce fut vers la douzième année du règne d’Hierome que fut construit le temple de Jérusalem. Par conséquent, le temps qui s’est écoulé depuis la construction du temple jusqu’à la fondation de Carthage renferme en tout cent quarante-trois ans et huit mois.</p>
      <p>XXIII. Nous nous contenterons, pour établir l’antiquité de nos livres saints, des témoignages que nous venons de rapporter de l’Égyptien Manéthos, de l’Éphésien Ménandre, et même de Josèphe, qui a écrit la guerre des Juifs contre les Romains. Il est clair, d’après ces anciens auteurs, que tous les autres, qui sont venus après eux, sont infiniment postérieurs à Moïse et aux prophètes eux-mêmes; car le dernier des prophètes fut Zacharie, qui vécut sous le règne de Darius. Or, tous les législateurs ont donné leurs lois après lui. En effet, lui opposera-t-on l’Athénien Solon? Mais il vivait du temps de Cyrus et de Darius; il fut le contemporain de Zacharie, et postérieur encore à ce prophète de plusieurs années. Lui opposera-t-on Lycurgue, Dracon, ou Minos? Mais ils sont évidemment moins anciens que nos saints livres, comme nous le rapporte Josèphe, puisque les écrits de Moïse ont précédé la guerre de Troie, et Jupiter roi de Crète. Cependant, afin de démontrer clairement l’ordre des temps et des années, je ne me contenterai pas d’avoir énuméré les faits postérieurs au déluge, je veux encore remonter à ceux qui l’ont précédé depuis la création du monde décrite par Moïse sous l’inspiration divine. La seule grâce que je demande à Dieu, c’est de bien exposer la vérité, afin que vous, et tous ceux qui liront ce livre, vous ayez pour guide la vérité même et la grâce divine. Je commencerai donc par exposer les généalogies, en remontant au premier homme.</p>
      <p>XXIV. Adam engendra Seth à l’âge de deux cent trente ans, Seth engendra Énos à l’âge de deux cent cinq ans, Énos vécut cent quatre-vingt-dix ans, et engendra Caïnan; Caïnan engendra Malaleel à l’âge de cent soixante-dix ans, Malaleel engendra son fils Jared à l’âge de cent soixante-cinq ans, Jared engendra Énoch à l’âge de cent soixante-deux ans, Énoch engendra Mathusala à l’âge de cent soixante-cinq ans, Mathusala engendra Lamech à l’âge de cent soixante-sept ans, Lamech engendra Noé à l’âge de cent quatre-vingt-huit ans, Noé engendra Sem à l’âge de cinq cents ans; sous Noé, alors âgé de six cents ans, arriva le déluge. Ainsi il s’est écoulé, depuis la création de l’homme jusqu’au déluge, deux mille deux cent quarante-deux ans; aussitôt après le déluge, Sem, âgé de cent ans, engendra Arphaxat; Arphaxat engendra Sala à l’âge de cent trente cinq ans, Sala, âgé de cent trente ans, engendra Héber, qui a donné le nom d’hébreux à toute la race; Héber engendra Phaleg à l’âge de cent trente-quatre ans, Phaleg engendra Rhagen à l’âge de cent trente ans, Rhagen engendra Seruch à l’âge de cent trente-deux ans, Seruch engendra Nachor à l’âge de cent trente ans, Nachor engendra Tharra à l’âge de soixante-quinze ans, Tharra engendra Abraham à l’âge de soixante-dix ans, le patriarche Abraham engendra Isaac à l’âge de cent ans. Ainsi, depuis la création de l’homme jusqu’à Abraham, on compte trois mille deux cent soixante-dix-huit ans. Isaac engendra Jacob à l’âge de soixante ans, Jacob était âgé de cent trente ans lorsqu’il vint en Égypte. Les Hébreux y restèrent quatre cent trente ans; après leur sortie de ce royaume, ils s’arrêtèrent quarante ans dans le désert. Ainsi nous avons en tout trois mille neuf cent trente-huit ans; à cette époque Moïse étant mort, Jésus, fils de Navé, prit l’administration du peuple de Dieu, et le gouverna pendant vingt-sept ans; à la mort de ce dernier, les Hébreux abandonnèrent la loi de Dieu, et servirent pendant huit ans Chusarathon, roi de Mésopotamie; ils firent pénitence, et eurent ensuite des juges pour les conduire; Gothonoel les jugea pendant quarante ans; Églon, pendant dix-huit; Aoth, pendant huit; puis ayant encore abandonné la loi de Dieu, ils furent asservis aux étrangers pendant vingt ans; après cela, Debbora les gouverna quarante ans; ils servirent encore les Madianites sept ans; puis Gédéon les gouverna quarante ans; Abimelech, trois ans; Thola, vingt-deux; et Jair, vingt-deux aussi; ils servirent encore les Philistins et les Ammonites pendant dix-huit ans; lorsqu’ils eurent recouvré leur liberté, Jephté administra le pays six ans; Esbon, sept ans; Ailon, dix; Abdon, huit; ils servirent encore les étrangers pendant quarante ans; puis Samson les gouverna pendant vingt ans, sa judicature fut suivie d’une paix de quarante ans pour les Hébreux. Après cela, Samira les gouverna un an; Élie, vingt ans; et Samuel, douze ans.</p>
      <p>Aux juges succédèrent les rois, dont le premier fut Saül, qui régna vingt ans; David, notre père, régna quarante ans. Ainsi, depuis Isaac jusqu’au règne de David, il s’est écoulé quatre cent quatre-vingt-quinze ans. David, comme nous l’avons dit, régna quarante ans; Salomon, fondateur du temple, quarante ans; Roboham, dix-sept ans; Abias sept ans; Asa, quarante-un; Josaphat, vingt-cinq; Joram, huit; Ochozias, onze; Gotholia, six; Josias, quarante; Amalias, trente-neuf; Ozias, cinquante-deux; Joatham, seize; Achaze, dix-sept; Ézechias, vingt-neuf; Manassé, cinquante-cinq; Amos, deux; Josias, trente et un; et Ochas, trois mois; après lui, Joachim régna onze ans; un autre Joachim régna trois mois et douze jours, Sédécias enfin régna onze ans. À cette époque, comme le peuple Juif persévérait toujours dans l’iniquité, et qu’il ne faisait point pénitence, Nabuchodonosor, roi de Babylone, s’avança contre la Judée, selon la prédiction du prophète Jérémie; il transporta le peuple à Babylone et réduisit en cendres le temple de Salomon. Les Juifs restèrent à Babylone soixante-dix ans. Ainsi le temps qui s’est écoulé depuis la création de l’homme jusqu’à la captivité de Babylone renferme en tout quatre mille neuf cent cinquante-quatre ans six mois et douze jours. Comme Dieu avait annoncé à son peuple la captivité de Babylone par la bouche de Jérémie, il lui avait aussi annoncé le retour de sa captivité après soixante-dix années; après ces soixante-dix ans, Cyrus monte sur le trône des Perses, et rend un édit signé l’année précédente, par lequel tous les Juifs qui étaient dans son royaume pouvaient regagner leur patrie, et rétablir le temple de Dieu qui avait été détruit par son prédécesseur; ce prince, obéissant encore aux ordres de Dieu, commanda à ses gardes Sabessare et Mithridate de rapporter dans le temple les vases qui avaient été enlevés par Nabuchodonosor. C’est donc la seconde année du règne de Cyrus que furent accomplies les soixante-dix années prédites par Jérémie.</p>
      <p>XXVI. On peut voir par là que nos livres saints sont bien plus vrais et plus anciens que toutes les histoires des Égyptiens, des Grecs et des autres peuples; car Hérodote, Thucydide, Xénophon et la plupart des historiens, ne remontent pas plus haut que les règnes de Cyrus et de Darius, tant ils étaient incertains sur les premiers temps. D’ailleurs qu’ont-ils dit de remarquable sur Darius et Cyrus, qui régnèrent chez les barbares; sur Zopyre et Hippias, qui commandèrent aux Grecs; sur les guerres des Athéniens et des Lacédémoniens, sur les exploits de Xerxès et de Pausanias, qui mourut presque de faim dans un temple de Minerve; enfin, sur Thémistocle, sur la guerre du Péloponnèse, sur Alcibiade et Thrasybule? Mais je ne me suis point proposé de faire une histoire complète, je veux seulement faire voir le nombre d’années qui se sont écoulées depuis la création du monde, et convaincre ainsi d’imposture les récits insensés des écrivains; car le monde n’a pas vingt mille myriades d’années, comme l’a dit Platon, qui prétend que tout ce temps s’était écoulé à l’époque où il vivait; il n’a pas non plus quinze myriades trois cent soixante et quinze années, comme l’a déclaré l’Égyptien Apollonius; il n’est point incréé, ni le jouet du hasard, comme le veulent Pythagore et d’autres philosophes, mais il a été créé et il est gouverné par la providence de Dieu, qui a fait toutes choses. Il est même facile de démontrer le nombre d’années de son existence à ceux qui cherchent la vérité; et pour qu’on ne m’accuse pas de n’avoir pu suivre ma démonstration jusqu’au bout, et arriver au delà de Cyrus, je vais essayer, avec le secours de Dieu, de bien établir l’ordre, des temps et des années qui se sont écoulées après ce prince.</p>
      <p>XXVII. Après un règne de vingt-neuf ans, Cyrus fut tué par Temyris, chez les Messagètes, vers la soixante-deuxième olympiade: alors croissait sous la protection divine la puissance romaine; Rome avait été fondée par Romulus, fils de Mars et d’Ilia, vers la septième olympiade, le onzième jour des calendes de mai, au temps où l’année n’avait que dix mois. Cyrus donc étant mort, comme nous l’avons dit, au temps de la soixante-deuxième olympiade, et deux cent vingt ans après la fondation de Rome, on vit régner dans cette ville Tarquin le superbe, qui le premier chassa plusieurs citoyens, corrompit les jeunes gens, fit des habitants des spadassins, et maria de jeunes filles qu’il avait déshonorées; c’est pourquoi il fut surnommé superbe, nom qui a la même signification que le mot grec <i>uperéphanos, arrogant</i>; il fut le premier qui ordonna aux citoyens de se saluer réciproquement. Ce prince régna vingt-cinq ans. Après lui commencèrent les consuls annuels, les tribuns et les édiles, pendant quatre cent cinquante-trois ans. Il serait trop long et inutile même de rappeler leurs noms; celui qui désire les connaître, les trouvera dans les commentaires de Chryséros, affranchi de M. Aurelius Verus, qui a transmis si clairement tous les noms et les temps, depuis la fondation de Rome jusqu’à la mort de l’empereur Verus, son maître. Ainsi donc les magistrats annuels gouvernèrent les Romains pendant quatre cent cinquante-trois ans; puis vinrent les empereurs, dont le premier fut C. Julius, qui gouverna trois ans quatre mois et six jours; après lui, Auguste régna cinquante-six ans quatre mois et un jour; Tibère régna vingt-deux ans, Caïus Caligula régna trois ans huit mois et sept jours, Claudius régna vingt-trois ans huit mois vingt-quatre jours; Néron, treize ans six mois et vingt-huit jours; Galba, deux ans sept mois et six jours; Othon, trois mois et cinq jours; Vitellius, six mois et vingt-deux jours; Vespasien, neuf ans onze mois et vingt-deux jours; Tite, deux ans et vingt-deux jours; Domitien, quinze ans cinq mois et six jours; Nerva, un an quatre mois et dix jours; Trajan, dix-neuf ans six mois et seize jours; Adrien, vingt ans dix mois et vingt-huit jours; Antonin, vingt-deux ans sept mois et six jours; Verus, dix-neuf ans et dix jours. Ainsi le temps du règne des Césars jusqu’à la mort de l’empereur Verus, renferme deux cent trente-sept ans et cinq jours; et l’on compte, depuis la mort de Cyrus et le règne de Tarquin le superbe, jusqu’à la mort de Verus, sept cent quarante-quatre ans.</p>
      <p>XXVIII. Voici maintenant en résumé toute la série des années: depuis la création du monde jusqu’au déluge, il s’est écoulé deux mille deux cent quarante-deux ans; depuis le déluge jusqu’à la naissance d’Isaac fils d’Abraham, mille trente-six ans; depuis Isaac jusqu’au séjour des Hébreux dans le désert, sous la conduite de Moïse, six cent soixante ans; depuis la mort de Moïse et le commandement de Josué, fils de Navé, jusqu’à la mort du patriarche David, quatre cent quatre-vingt-dix-huit ans; depuis la mort de David et le règne de Salomon jusqu’à la captivité de Babylone, cinq cent dix-huit ans six mois et dix jours; depuis le règne de Cyrus jusqu’à la mort de l’empereur Aurelius Verus, sept cent quarante-quatre ans. Ainsi il s’est écoulé jusque-là, depuis la création du monde, cinq mille six cent quatre-vingt dix-huit ans quelques mois et quelques jours.</p>
      <p>XXIX. L’ensemble de toutes ces époques et de tous ces faits prouve, d’une manière incontestable, l’antiquité de nos saints livres et la divinité de notre doctrine. Cette doctrine, ainsi que nos institutions, bien loin d’être nouvelles ou mensongères, comme le pensent quelques-uns, sont les plus anciennes et les plus vraies. Thallus parle de Belus, roi des Assyriens et du titan Cronus; il rapporte que Belus et les titans firent la guerre à Jupiter et aux autres dieux ligués ensemble. Alors, dit-on, Gygès fut vaincu par Tartesse, qui régna dans le pays appelé aujourd’hui Attique, et autrefois Acté. Je ne chercherai point à vous expliquer l’étymologie des autres contrées et des autres villes, car vous êtes fort versés dans toutes les connaissances historiques. Il est donc clair que Moïse et la plupart des prophètes sont antérieurs à tous les écrivains, et qu’ils ont précédé Cronus, Belus et la guerre de Troie. Car, selon Thallus, Belus ne précéda la guerre de Troie que de trois cent vingt-deux ans; tandis que Moïse est antérieur à cette guerre de neuf cents ou même de mille ans, comme nous l’avons déjà démontré. On ne distingue guère ordinairement Cronus et Belus l’un de l’autre, parce qu’ils furent contemporains. Quelques-uns honorent Cronus, sous le nom de Bel ou de Bal, ce sont surtout les Orientaux; ainsi ils ne savent pas encore faire cette distinction. Les Romains adorent Saturne, ne sachant pas eux-mêmes quel est le plus ancien de Cronus ou de Belus. À l’égard des olympiades, quelle que soit leur origine, elles commencèrent à être célébrées depuis Iphitus, ou, comme le veulent d’autres historiens, depuis Linus, surnommé Ilius. Nous avons démontré plus haut l’ordre des années et des olympiades. Ainsi donc se trouve établie l’antiquité de nos saints livres, en même temps que la série des années, depuis la création du monde. Sans doute, nous ne pouvons dire exactement le nombre des années, parce que l’Écriture ne tient pas compte des jours et des mois; mais quand nous nous serions trompés de cinquante, de cent, ou même de deux cents ans, l’erreur ne serait pas de mille ans, et de dix mille ans, comme le supposent Platon, Apollonius et les autres. Nous sommes d’accord pour les temps avec Bérose, philosophe chaldéen, qui transmit aux Grecs les lettres chaldaïques. Non-seulement il a parlé du déluge et de plusieurs autres événements conformément au récit de Moïse, mais il s’accorde encore en partie avec les prophètes Jérémie et Daniel. Il fait mention de ce qui arriva aux Juifs, sous le roi de Babylone, qu’il appelle Abobassare, et les Hébreux Nabuchodonosor, il parle même de la destruction du temple de Jérusalem par ce prince, et raconte que les fondements de ce temple furent jetés de nouveau la seconde année du règne de Cyrus, mais qu’il ne fut achevé que la seconde année du règne de Darius.</p>
      <p>XXX. Quant aux Grecs, leurs histoires ne renferment rien de véritable; d’abord parce qu’ils ne connurent les lettres que fort tard; ils en conviennent eux-mêmes, lorsqu’ils disent qu’elles furent découvertes, les uns par les Chaldéens, les autres par les Égyptiens, et les autres par les Phéniciens; d’ailleurs, au lieu de parler de Dieu, ils ne se sont occupés que de choses vaines et frivoles. Ainsi, par exemple, ils font mention d’Homère, d’Hésiode et des autres poëtes; mais ils laissent en oubli la gloire du Dieu unique et incorruptible: que dis-je, ils blasphèment contre lui. Ils ont persécuté et ils persécutent aujourd’hui les hommes qui le confessent et l’adorent; tandis qu’ils comblent d’honneurs et de récompenses ceux qui font servir leur talent et leur voix à outrager la Divinité; ils font une guerre cruelle aux hommes qui ne s’occupent qu’à faire des progrès dans la vertu et la sainteté. Ils lapident les uns, massacrent les autres et leur font subir tous les genres de supplices. Sans doute, des hommes aussi injustes ont perdu la sagesse de Dieu, et n’ont pu trouver la vérité. Pour vous, mon cher Autolyque, pesez murement ce que je vous ai écrit, et vous y trouverez le symbole et le gage de la vérité.</p>

