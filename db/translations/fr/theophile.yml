      <p>La section des œuvres de Théophile d’Antioche <strong>en grec</strong> se trouve <a href="https://bibleox.com/fr/grc/w/fZzL_%CE%98%CE%B5%CF%8C%CF%86%CE%B9%CE%BB%CE%BF%CF%82_%CE%BF_%CE%91%CE%BD%CF%84%CE%B9%CE%BF%CF%87%CE%B5%CE%AF%CE%B1%CF%82_2%CE%BF%CF%82_%CE%B1%CE%B9%CF%8E%CE%BD%CE%B1%CF%82">ici</a>. Les autres langues se changent au-dessus de la liste des œuvres.</p>

      <p><strong>Mémoire</strong> : 13 (26) octobre</p>

      <h2>Vie</h2>

      <p>Théophile d’Antioche (en grec Θεόφιλος Ἀντιοχείας) naquit en Syrie, dans une famille païenne. Selon l’« Histoire ecclésiastique » d’Eusèbe de Césarée, il fut le sixième évêque d’Antioche après les apôtres. Homme cultivé, formé à la littérature grecque, il cite dans son unique ouvrage conservé les poètes, les historiens et les philosophes païens. Avant sa conversion, il étudia surtout les livres prophétiques de l’Ancien Testament et fut convaincu de la supériorité du christianisme. D’abord adversaire acharné de la foi, il en devint ensuite un défenseur ardent.</p>

      <p>Il occupa le siège d’Antioche à partir de 168. On ignore combien de temps il fut évêque ; il mourut sous l’empereur Commode, dans les années 180.</p>

      <p>Tous ses nombreux écrits — contre les hérétiques (gnosticisme, marcionisme), contre les païens, apologies et traités polémiques — ont été perdus, à l’exception des trois livres <em>À Autolyque</em>. C’est dans cet ouvrage qu’apparaît pour la première fois le mot « Trinité » :</p>

      <blockquote><p>Les trois jours qui précédèrent les corps lumineux sont l’image de la Trinité, c’est-à-dire de Dieu, de son Verbe et de son Esprit. (<a href="https://bibleox.com/fr/fr/w/Theophile_A_Autolyque#HH-2">À Autolyque, livre II</a>)</p></blockquote>

      <h2>À Autolyque</h2>

      <p>L’ouvrage est adressé à un païen cultivé, Autolyque, qui raillait les chrétiens et leur Dieu invisible. Théophile lui répond en trois livres : le premier traite de la connaissance de Dieu et de la résurrection, le deuxième de la création du monde et de l’Écriture, le troisième de la supériorité de la loi chrétienne sur la philosophie païenne. C’est un témoignage important sur la foi de l’Église du II<sup>e</sup> siècle et sur la lecture chrétienne de l’Ancien Testament.</p>

      <blockquote><p>Pour moi, je n’adore point l’empereur, je me contente de l’honorer et de prier pour lui ; mais j’adore le Dieu véritable, l’être par excellence, parce que je sais que c’est lui qui fait les rois. (<a href="https://bibleox.com/fr/fr/w/Theophile_A_Autolyque#HH-1">À Autolyque, livre I</a>)</p></blockquote>

