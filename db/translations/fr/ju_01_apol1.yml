      <p>I. À l’empereur Titus Aelius Hadrianus Antoninus Pius, Auguste César, et à Verissimus, son fils, Philosophe, et à Lucius, Philosophe, fils de César par la nature et de Pius par adoption, ami de la science, et au sacré Sénat et à tout le Peuple romain, en faveur des hommes de toute race qui sont injustement haïs et persécutés, moi, l’un d’eux, Justin, fils de Priscos, fils de Baccheios, de Flavia Neapolis, en Syrie de Palestine, j’adresse ce discours et cette requête[1].</p><p>II. La raison veut que ceux qui sont vraiment pieux et sages estiment et aiment exclusivement la vérité et refusent de suivre les opinions des anciens, quand elles sont mauvaises. Car non seulement la saine raison ordonne de ne pas suivre ceux qui font ou enseignent l’injustice, mais l’ami de la vérité doit de toute manière, même au péril de sa vie, même en danger de mort, observer la justice dans ses paroles et dans ses actions[2]. Vous donc, qui partout vous entendez appeler pieux et sages et gardiens de la justice et amis de la science, on verra si vous l’êtes vraiment. Ce n’est pas pour vous flatter, ni pour gagner vos bonnes grâces que nous avons écrit ce discours : nous venons vous demander de nous juger selon l’équité et après mûr examen. N’allez pas, obéissant à des préjugés, au désir de plaire à la superstition, à un mouvement irraisonné, à de perfides rumeurs que le temps a fortifiées, vous condamner vous-mêmes. Car pour nous, nous savons que personne ne peut nous faire de mal, si nous ne sommes convaincus de crime, si nous ne sommes reconnus coupables. Vous pouvez nous tuer ; nous nuire, non.</p><p>III. Pour que vous ne croyiez pas que ce sont des paroles en l’air et une bravade, nous demandons qu’on examine les accusations portées contre nous. Si elles sont reconnues fondées, qu’on nous punisse, comme il est juste[3]. Si l’on n’a rien à nous reprocher, est-il équitable, sur des bruits calomnieux, de condamner des innocents, ou plutôt de vous condamner vous-mêmes en vous laissant guider dans la décision des affaires non par la justice, mais par la passion. Une exigence légitime et la seule juste, aux yeux de tout homme sensé, c’est que les sujets puissent prouver l’innocence de leur conduite et de leurs paroles, et que, d’autre part, les gouvernants rendent leurs sentences en s’inspirant de la piété et de la sagesse, et non de la violence et de la tyrannie. Ainsi les gouvernants et les sujets seront heureux. Car un ancien l’a dit : « Si les princes et les peuples ne sont pas philosophes, il n’y a pas de bonheur pour les États. »[4] À nous d’exposer aux yeux de tous notre vie et nos enseignements, de peur que, pour ne nous être pas fait connaître de vous, nous ne soyons responsables devant notre conscience[5], des fautes que vous commettriez par ignorance : à vous, comme le demande la raison, de nous entendre et de juger avec impartialité. Si, une fois éclairés, vous n’observez pas la justice, vous serez désormais sans excuse devant Dieu.</p><p>IV. Un nom n’est ni bon ni mauvais : ce sont les actions qui s’y rattachent qu’il faut juger. À ne considérer que ce nom qui nous accuse, nous sommes les plus vertueux des hommes[6]. Nous ne pensons pas qu’il soit juste de prétendre être absous sur notre nom seul, si nous sommes convaincus de crime : mais aussi, s’il est prouvé que notre genre de vie n’est pas plus coupable que notre nom, votre devoir est de faire tous vos efforts, pour ne pas être répréhensibles en justice, en punissant injustement des innocents. Le nom seul ne peut raisonnablement être un titre à la louange ou au blâme, si l’on ne peut trouver dans les actes rien de louable ou de criminel. Un accusé paraît-il devant vous, vous ne le frappez pas avant de l’avoir convaincu[7]. Pour nous, le nom seul sert de preuve. Et cependant, à ne considérer que le nom, vous devriez plutôt châtier nos accusateurs. Nous sommes accusés d’être chrétiens. Est-il juste de haïr le meilleur [8] ? Si, devant cette accusation, quelqu’un vient à nier en parole et à dire qu’il n’est pas chrétien, vous le renvoyez pour cette raison que vous ne le trouvez pas coupable ; mais s’il avoue, son aveu même le fait condamner. Il faudrait examiner la conduite de celui qui avoue et de celui qui nie, pour que chacun montre ce qu’il est par ses actes. Ceux qui ont appris à l’école du Christ à ne pas nier devant les tribunaux donnent une grande leçon, ceux, par contre, qui vivent mal, fournissent peut-être un prétexte aux accusations mensongères d’impiété et d’injustice qui sont portées contre tous les chrétiens. Mais c’est contraire à l’équité. Il y en a qui se parent du nom et du manteau de philosophe, et dont la conduite ne répond pas à cette prétention, et vous n’ignorez pas que les anciens qui ont eu les opinions et les principes les plus opposés sont tous compris sous cette unique dénomination de philosophes. Certains d’entre eux enseignèrent l’athéisme ; les poètes viennent et racontent les impuretés de Zeus et de ses enfants : et vous n’imposez pas silence à ceux qui exposent ces enseignements : vous accordez des récompenses et des honneurs à ceux qui débitent avec art des outrages à la divinité.</p><p>V. Qu’est-ce que cela veut dire ? Nous, nous faisons profession de fuir le mal et de ne pas enseigner ces impiétés, et, sans examiner notre cause, par un emportement aveugle, sous le fouet des génies du mal, vous ne vous faites pas scrupule de nous frapper sans jugement. Il faut dire la vérité. Les génies du mal, apparaissant autrefois sur la terre, violèrent les femmes, corrompirent les enfants, inspirèrent l’épouvante aux hommes. Effrayés, ceux-ci ne surent pas apprécier ces faits selon la raison, mais saisis de crainte, et ne reconnaissant pas la malice des démons, ils les appelèrent dieux et donnèrent à chacun d’eux le nom qu’il s’était choisi. Socrate, jugeant ces choses à la lumière de la raison et de la vérité, essaya d’éclairer les hommes et de les détourner du culte des démons ; mais les démons, par l’organe des méchants, le firent condamner comme athée et impie, sous prétexte qu’il introduisait des divinités nouvelles[9]. Ils en usent de même envers nous. Car ce n’est pas seulement chez les Grecs et par la bouche de Socrate que le Verbe a fait entendre ainsi la vérité ; mais les barbares aussi ont été éclairés par le même Verbe, revêtu d’une forme sensible, devenu homme et appelé Jésus-Christ, et nous qui croyons en lui, nous disons que les démons qui se sont manifestés ne sont pas les bons génies, mais les génies du mal et de l’impiété, puisqu’ils n’agissent même pas comme les hommes qui aiment la vertu.</p><p>VI. Voilà pourquoi on nous appelle athées. Oui certes, nous l’avouons, nous sommes les athées de ces prétendus dieux, mais nous croyons au Dieu très vrai, père de la justice, de la sagesse et des autres vertus, en qui ne se mélange rien de mal. Avec lui nous vénérons, nous adorons, nous honorons en esprit et en vérité le fils venu d’auprès de lui, qui nous a donné ces enseignements, et l’armée des autres bons anges[10] qui l’escortent et qui lui ressemblent, et l’esprit prophétique. Voilà la doctrine que nous avons apprise[11] et que nous transmettons libéralement à quiconque veut s’instruire.</p><p>VII. Mais, dira-t-on, des chrétiens ont été arrêtés et convaincus de crime. Sans doute, lorsque vous examinez la conduite des accusés, il vous arrive souvent d’en condamner beaucoup, mais non pas parce que d’autres ont été cités avant eux[12]. Voici un fait général que nous reconnaissons : De même que chez les Grecs, tout le monde appelle communément philosophes ceux qui exposent les doctrines qui leur plaisent, quelque contradictoires qu’elles puissent être, ainsi, chez les barbares, ceux qui sont ou passent pour sages, ont reçu une dénomination commune : on les appelle tous chrétiens. Si donc on les accuse devant vous, nous demandons qu’on examine leur conduite et que celui qui sera convaincu soit condamné comme coupable, mais non pas comme chrétien : si quelqu’un est reconnu innocent, qu’il soit absous comme chrétien, n’étant en rien coupable. Nous ne vous demanderons pas de sévir contre nos accusateurs : ils sont suffisamment punis par la conscience de leur perfidie et leur ignorance du bien.</p><p>VIII. Remarquez que c’est dans votre intérêt que nous parlons ainsi ; car nous pourrions nier quand nous sommes interrogés. Mais nous ne voulons pas acheter la vie au prix d’un mensonge. Nous désirons la vie éternelle et incorruptible : nous préférons vivre avec Dieu, le père et le créateur de l’univers. Nous avons hâte de confesser notre foi, persuadés que ceux-là pourront obtenir ce bonheur, qui auront témoigné à Dieu par leurs œuvres qu’ils l’ont suivi et qu’ils ont aspiré à cette vie qui s’écoulera auprès de lui, inaccessible au mal. Voilà en peu de mots notre espérance, la doctrine que nous avons apprise du Christ et que nous enseignons. Platon dit que Rhadamante et Minos puniront les coupables traduits à leur tribunal[13] : nous disons nous aussi que ce jugement sera rendu, mais par le Christ. Les méchants comparaîtront avec leurs corps et leurs âmes, et leur supplice durera éternellement, et non pas seulement pendant une période de mille ans, comme le prétendait Platon[14]. Cela vous paraîtra peut-être incroyable ou impossible : mais, s’il y a erreur, c’est notre affaire et non celle d’un autre, tant que nous ne serons pas convaincus de crime.</p><p>IX. Si nous n’offrons pas de nombreux sacrifices ni de couronnes de fleurs aux idoles que les hommes ont façonnées et dressées dans les temples sous le nom de dieux, c’est que dans cette matière brute et sans vie, nous ne reconnaissons pas l’aspect de la divinité. Nous ne croyons pas en effet que Dieu soit semblable à ces images que l’on dit faites en son honneur. Elles portent le nom et sont faites à la ressemblance de ces génies du mal qui apparurent autrefois. Ne savez-vous pas, sans qu’il soit besoin de vous le dire, comment les artistes travaillent la matière, comment ils la polissent, la taillent, la fondent et la battent ? Souvent, grâce à leur art, des vases d’ignominie, en changeant seulement de forme et de figure, ont reçu le nom de dieux. Aussi, est-ce à nos yeux une absurdité, que dis-je, un outrage à la divinité, dont la grandeur et la nature sont ineffables, de donner son nom à des œuvres corruptibles et qui ont besoin d’être entretenues par la main de l’homme. Et vous savez bien que ces artistes eux-mêmes sont des débauchés et qu’ils sont livrés à tous les vices ; il n’est pas besoin de les énumérer ; ils violent les jeunes filles qui les aident dans leurs travaux. Ô aveuglement ! Ce sont des débauchés, à vous en croire, qui créent et façonnent les dieux que vous adorez ! Vous faites de tels hommes les gardiens des temples où ils résident, et vous ne comprenez pas que c’est une impiété que de penser ou de dire que des hommes soient les gardiens des dieux !</p><p>X. Nous savons que Dieu n’a pas besoin des dons matériels des hommes, puisque nous voyons qu’il donne tout ; mais nous avons appris, nous croyons et nous tenons pour vrai qu’il agrée ceux qui tâchent d’imiter ses perfections, sa sagesse, sa justice, son amour des hommes, enfin tous les attributs de ce Dieu, qu’aucun nom créé ne peut nommer. Nous avons appris qu’à l’origine, ce dieu, étant bon, fit sortir l’univers de la matière informe à cause des hommes[15]. S’ils se montrent par leurs œuvres dignes de ses desseins, nous savons qu’ils seront admis à vivre et à régner avec lui, devenus incorruptibles et impassibles. Car, nous croyons que de même qu’à l’origine il les a faits alors qu’ils n’étaient pas, de même, ceux qui l’auront mérité en choisissant les moyens de lui plaire, jouiront de l’immortalité et de sa société. Il ne dépendait pas de nous de commencer d’exister : mais nous attacher à ce qui lui plaît, par le libre choix des facultés rationnelles qu’il nous a données, il nous le persuade et il nous en donne la foi. Et nous croyons qu’il importe à tous les hommes de ne pas être détournés de ces enseignements, mais au contraire d’y être vivement encouragés. Car, ce que n’ont pas pu faire les lois humaines, le Verbe, étant divin, l’eût fait, si les démons n’eussent répandu contre nous des accusations mensongères et impies, appelant à leur aide les passions qui sont en chacun tout à fait mauvaises et de nature variée. Ces accusations ne nous atteignent pas.</p><p>XI. Quant à vous, quand vous entendez dire que nous attendons un royaume, vous supposez à la légère qu’il s’agit d’un royaume humain. Mais c’est du royaume de Dieu que nous parlons. Ce qui le prouve, c’est qu’à vos interrogations, nous répondons que nous sommes chrétiens, quand nous savons bien que cet aveu nous vaudra la mort. Si nous attendions un royaume humain, nous nierions, pour sauver notre vie ; nous nous cacherions, pour ne pas être frustrés dans notre espérance. Mais notre espérance n’est pas de ce temps présent : aussi nous ne craignons pas nos bourreaux, et d’ailleurs, de toute façon, ne faut-il pas mourir ?</p><p>XII. Vous trouverez en nous les amis et les partisans les plus zélés de la paix, puisque, d’après notre doctrine, nul ne peut échapper à Dieu, le méchant, l’avare, le perfide, pas plus que l’honnête homme, mais que chacun, selon ses œuvres, va au châtiment ou au salut éternel. Si tous les hommes avaient cette conviction, personne ne voudrait commettre un crime d’un instant, sachant qu’il encourt le supplice éternel du feu, mais il se contiendrait complètement, il se ferait une parure de toutes les vertus, pour obtenir les biens promis par Dieu et éviter le châtiment. Ce n’est pas la crainte de vos lois et de vos peines qui fait chercher aux coupables le moyen de se cacher[16] : ils savent qu’ils peuvent vous échapper, parce que vous êtes hommes et ils font le mal. Mais, s’ils savaient, s’ils étaient convaincus que rien ne peut échapper au regard de Dieu, ni l’action ni même l’intention, vous-mêmes en conviendrez, la menace du châtiment les maintiendrait tout à fait dans l’ordre. Il semble en vérité que vous craigniez de voir tout le monde vertueux, et de n’avoir plus sur qui sévir. Ce serait vous conduire en bourreaux, et non en bons princes. Tout cela, nous en sommes convaincus, et nous l’avons déjà dit, est l’œuvre de ces mauvais génies qui se font offrir par les insensés des sacrifices[17] et des adorations. Mais vous, qui aimez la piété et la sagesse, nous ne supposons pas que vous soyez si peu raisonnable. Si, comme la foule aveugle, vous sacrifiez la vérité à la coutume, déployez votre puissance. Mais les princes eux-mêmes, quand ils sacrifient la vérité à l’opinion, ne sont pas plus forts que des brigands dans un désert[18]. Il vous en arrivera malheur, c’est le Verbe qui vous le déclare, le prince le plus puissant et le plus juste après le Dieu qui l’a engendré[19]. De même que personne ne se soucie de recueillir en héritage la pauvreté, la souffrance ou déshonneur, ainsi pas un homme sensé ne voudra suivre les voies interdites par le Verbe.</p><p>Tout cela a été prédit par notre maître, le fils et l’apôtre de Dieu, père et seigneur de toutes choses, Jésus-Christ[20], de qui nous tenons notre nom de chrétiens. C’est pourquoi notre foi dans sa parole devient inébranlable, quand nous voyons s’accomplir tout ce qu’il a prédit d’avance. C’est le propre de Dieu d’annoncer l’avenir et de montrer réalisé ou fait[21] ce qu’il a annoncé. Nous pourrions nous en tenir là sans rien ajouter, persuadés que nous avons pour nous la justice et la vérité. Mais nous savons qu’il n’est pas facile de changer en peu de mots un esprit possédé par l’ignorance[22]. Aussi pour convaincre les amis de la vérité, voulons-nous ajouter quelques mots. Peut-être qu’à la lumière de la vérité l’erreur se dissipera.</p><p>XIII. Quel homme sensé ne conviendrait que nous ne sommes pas athées ? Nous adorons le créateur de cet univers. Reconnaissant, comme l’enseigne notre doctrine, qu’il n’a besoin ni de sang, ni de libations, ni d’encens, nous le louons selon notre pouvoir, par des hymnes de piété et d’actions de grâce, dans tout ce que nous mangeons. La vraie manière de l’honorer, selon ce qu’on nous a enseigné, ce n’est pas de consumer inutilement par le feu les choses qu’il a faites pour notre subsistance, mais d’en user pour nous et d’en faire part aux pauvres, et de lui offrir nos hommages solennels et nos hymnes de reconnaissance pour la vie qu’il nous a donnée, et le soin qu’il prend de nous conserver en santé, pour les qualités des choses et les changements des saisons. Nous lui demandons aussi l’immortalité future à cause de la foi que nous avons en lui[23]. Nous vous montrerons aussi que nous adorons justement celui qui nous a enseigné ces choses, et qui a été engendré pour cela, Jésus-Christ qui fut crucifié sous Ponce-Pilate, gouverneur de Judée, au temps de Tibère César, en qui nous voyons le fils du vrai Dieu et que nous mettons au second rang[24], et, en troisième lieu, l’Esprit prophétique. Quelle folie, nous dit-on, de mettre à la seconde place après le Dieu immuable, éternel, créateur de toutes choses, un homme crucifié. C’est un mystère que l’on ignore. Nous allons vous l’expliquer ; veuillez nous suivre.</p><p>XIV. Prenez garde, nous vous en avertissons, que les démons que nous accusons ne vous trompent et ne vous détournent de nous lire et de nous comprendre (ils font tout pour faire de vous leurs esclaves et leurs serviteurs, et, tantôt par les visions des songes, tantôt par les prestiges de la magie, ils cherchent à asservir ceux qui n’ont aucun soin de leur salut) ; car, dès que nous avons cru au Verbe, nous avons renoncé à leur culte, pour nous attacher par le Fils au seul Dieu non engendré. Autrefois, nous prenions plaisir à la débauche, aujourd’hui la chasteté fait toutes nos délices. Nous nous livrions à la magie ; aujourd’hui nous nous consacrons au Dieu bon et non engendré. Nous aimions et nous recherchions plus que tout l’argent et les domaines ; aujourd’hui nous mettons en commun ce que nous avons, nous le partageons avec les pauvres. Les haines et les meurtres nous divisaient, la différence des mœurs et des institutions ne nous permettait pas de recevoir l’étranger à notre foyer ; aujourd’hui, après la venue du Christ, nous vivons ensemble, nous prions pour nos ennemis, nous cherchons à gagner nos injustes persécuteurs, afin que ceux qui suivront les sublimes préceptes du Christ puissent espérer la même récompense que nous, de Dieu, le maître du monde. Ne pensez pas que nous voulions vous tromper. Il sera bon, croyons-nous, avant toute démonstration, de vous rappeler quelques-unes des leçons du Christ lui-même. À vous, en vertu de votre puissance et de votre autorité impériale, de juger si les enseignements que nous avons reçus et que nous transmettons sont conformes à la vérité. Ses maximes sont brèves et concises ; car ce n’était pas un sophiste, mais son verbe était une puissance divine.</p><p>XV. Voici ce qu’il dit de la chasteté : « Celui qui regarde une femme pour la convoiter a déjà commis l’adultère dans son cœur devant Dieu. »[25] Et : « Si votre œil droit vous scandalise, arrachez-le ; il vaut mieux pour vous n’avoir qu’un œil et entrer dans le royaume des cieux, qu’avoir deux yeux et être jeté dans le feu éternel. »[26] Et : « Celui qui épouse la femme répudiée par un autre commet un adultère. »[27] Et : « Il y en a que les hommes ont faits eunuques, il y en a qui sont nés eunuques et il y en a qui se sont faits eunuques eux-mêmes en vue du royaume des cieux ; mais tous n’entendent pas cette parole. »[28] Ainsi ceux qui, d’après la loi humaine, contractent un double mariage et ceux qui regardent une femme pour la convoiter sont également coupables devant notre maître. Il condamne non seulement l’adultère, mais l’intention de l’adultère, car les pensées comme les actes sont connus de Dieu. Or beaucoup d’hommes et de femmes, instruits dès leur enfance dans la loi du Christ, sont restés purs jusqu’à soixante et soixante-dix ans : je me flatte de vous en citer des exemples dans toutes les classes. Faut-il aussi rappeler le nombre infini de ceux qui ont quitté le vice pour se soumettre à cette doctrine ? Car le Christ n’a pas appelé à la pénitence les justes et les chastes, mais les impies, les vicieux, les méchants. N’a-t-il pas dit : « Je ne suis pas venu appeler les justes, mais les pécheurs, à la pénitence. »[29] Car le Père céleste aime mieux le repentir que le châtiment du pécheur[30]. Sur la charité envers tous, voici ce qu’il a dit : « Si vous aimez ceux qui vous aiment, que faites-vous de nouveau ? Les impudiques en font autant. Quant à moi, je vous dis : « Priez pour vos ennemis, aimez ceux qui vous haïssent, bénissez ceux qui vous maudissent et priez pour vos calomniateurs. »[31] Sur le devoir de donner aux pauvres et de ne rien faire par vaine gloire, il dit : « Donnez à qui vous demande et ne refusez pas à celui qui veut emprunter de vous[32]. Si vous prêtez avec l’espoir qu’on vous rendra, que faites-vous de nouveau ? Les publicains en font autant[33]. N’amassez pas de trésors sur la terre, où la rouille et les vers dévorent, où les voleurs fouillent et dérobent ; mais amassez des trésors dans le ciel, où ni la rouille ni les vers ne dévorent[34] ; car que sert à l’homme de gagner l’univers, s’il vient à perdre son âme ? et que donnera-t-il en échange de son âme ?[35] Amassez donc des trésors dans le ciel, où ni la rouille ni les vers ne dévorent. »[36] Et : « Soyez bons et miséricordieux, comme votre Père céleste est bon et miséricordieux[37], lui qui fait lever son soleil sur les pécheurs, sur les justes et sur les méchants[38]. Ne vous inquiétez pas du vivre et du vêtement. Ne valez-vous pas mieux que les oiseaux et les bêtes ? Or Dieu les nourrit. Ne vous inquiétez pas du vivre et du vêtement : car votre père du ciel sait que vous en avez besoin. Cherchez le royaume des cieux et tout cela vous sera donné par surcroît[39]. Là où est le trésor de l’homme, là est son cœur.[40] » Et : « Ne faites pas ces choses pour être en spectacle aux hommes : sinon, vous n’aurez pas la récompense de votre Père qui est dans les cieux. »[41]</p><p>XVI. Nous devons être humbles, serviables pour tous et doux ; voici les leçons qu’il nous donne à ce sujet : « Si l’on vous frappe sur une joue, présentez l’autre ; si l’on vous enlève votre tunique, ne retirez pas votre manteau[42]. Celui qui se met en colère sera puni par le feu. Si quelqu’un vous force à le suivre pendant un mille, suivez-le pendant deux. Que vos bonnes œuvres brillent devant les hommes, afin que, les voyant, ils admirent votre Père qui est dans les cieux.[43] » Il ne faut pas user de violence, et Dieu ne veut pas que nous imitions les méchants, mais il nous engage à employer la patience et la douceur pour arracher les hommes à l’avilissement des mauvaises passions. Nous pourrions vous citer comme exemples beaucoup de ceux qui ont vécu parmi vous. Ils ont renoncé à leurs habitudes de violence et de tyrannie, vaincus par le spectacle journalier de la vertu de leurs voisins, par la vue de l’étrange patience de leurs compagnons à supporter l’injustice, par l’expérience acquise dans les relations avec eux. Le Christ nous ordonne en ces termes de ne jamais jurer et de dire toujours la vérité : « Ne jurez pas : si c’est oui, dites oui ; si c’est non, dites non. Le surplus vient du malin. »[44] Voici comment il nous apprend que nous ne devons adorer que Dieu seul : « C’est ici un très grand commandement : Tu adoreras le Seigneur ton Dieu et tu le serviras lui seul de tout ton cœur et de toutes tes forces, lui, le Seigneur Dieu qui t’a fait. »[45] Quelqu’un s’étant approché, lui dit : « Bon maître. » Il répond : « Personne n’est bon que Dieu seul, qui a tout fait. »[46] Ceux qui ne vivent pas selon ses préceptes, qu’ils ne soient pas tenus pour chrétiens, quand même ils proclameraient de bouche la doctrine du Christ ; car il a promis le salut non à ceux qui disent, mais à ceux qui font. Il a dit en effet : « Ce n’est pas celui qui me dit : Seigneur, Seigneur, qui entrera dans le royaume des cieux, mais celui qui fait la volonté de mon Père qui est dans les cieux[47]. Quiconque m’écoute et fait ce que je dis écoute celui qui m’a envoyé[48]. Beaucoup me diront : Seigneur, Seigneur, est-ce qu’en votre nom nous n’avons pas bu et mangé, est-ce que nous n’avons pas fait des miracles ? Et alors je leur dirai : Loin de moi, ouvriers d’iniquité[49]. Alors, il y aura des pleurs et des grincements de dents, lorsque les justes brilleront comme le soleil, tandis que les méchants seront jetés au feu éternel[50]. Beaucoup viendront en mon nom, qui à l’extérieur seront revêtus de peaux de brebis et qui au dedans seront des loups ravissants : vous les reconnaîtrez à leur œuvres. Tout arbre qui ne porte pas de bons fruits est coupé et jeté au feu[51]. » Punissez donc ceux qui ne vivent pas conformément à ces préceptes et qui ne sont chrétiens que de nom : c’est nous qui vous le demandons.</p><p>XVII. Nous sommes les premiers à payer les tributs et les impôts à ceux que vous préposez à cet office. C’est encore là un précepte du Christ. En ce temps-là certains d’entre eux vinrent lui demander s’il fallait payer le tribut à César. Il répondit : « Dites-moi, à quelle effigie est frappée cette pièce de monnaie ? — À celle de César », dirent-ils. Et il reprit : « Rendez donc à César ce qui est à César et à Dieu ce qui est à Dieu. »[52] Nous n’adorons donc que Dieu seul, mais pour le reste, nous vous obéissons volontiers, vous reconnaissant pour les maîtres et les chefs des peuples, et nous demandons à Dieu qu’avec la puissance souveraine, on voie en vous la sagesse et la raison. Si, malgré nos prières, et bien que nous exposions tout au grand jour, vous nous dédaignez, nous n’aurons rien à en souffrir : car nous croyons ou plutôt nous sommes convaincus que chacun, selon ses œuvres, sera puni dans le feu éternel et que nous rendrons compte à Dieu dans la mesure des pouvoirs que nous aurons reçus de lui. C’est le Christ qui l’a dit : « Celui à qui Dieu aura plus donné, il lui sera demandé davantage. »[53]</p><p>XVIII. Considérez la fin de chacun des empereurs qui vous ont précédés : ils sont morts comme tous les hommes. Si la mort détruisait en nous tout sentiment, ce serait un avantage pour les méchants. Mais non, ceux qui ont vécu gardent le sentiment, et le châtiment éternel les attend. Vous ne devez pas laisser de croire et d’être persuadés que c’est la vérité. La nécromancie, l’inspection du cadavre d’un enfant innocent, l’évocation des âmes humaines, les pratiques de ceux qui, d’après la magie, envoient des songes, ou de ceux qui les assistent, les opérations de ceux qui possèdent cette science, doivent être pour vous une preuve que les âmes conservent le sentiment après la mort. Voyez encore ces hommes qui sont saisis et secoués par les âmes des morts, que tout le monde appelle démoniaques et furieux, voyez les oracles d’Amphiloque, de Dodone et de la Pythie et tant d’autres ; voyez les témoignages des écrivains, d’Empédocle et de Pythagore, de Platon et de Socrate, la fosse d’Homère, et la descente d’Ulysse visitant ces mystères et mille faits analogues racontés par les auteurs. Admettez notre témoignage au même titre que le leur. Nous croyons autant et plus qu’eux en la divinité, et nous espérons que les morts déposés en terre reprendront leurs corps, car rien n’est impossible à Dieu.</p><p>XIX. À bien y réfléchir[54], ne paraîtrait-il pas incroyable, si nous n’avions pas de corps, d’entendre quelqu’un nous dire qu’une simple goutte de sperme humain suffit à produire nos os, nos nerfs et nos chairs dans la forme où nous les voyons ? Admettons cette hypothèse. Oubliez un instant ce que vous êtes et votre origine. Si quelqu’un, vous montrant d’un côté ce sperme humain et de l’autre l’image d’un homme, vous disait, vous affirmait que ceci peut produire cela, le croiriez vous, avant de l’avoir vu ? Non, personne n’oserait le contester. C’est ainsi que pour n’avoir pas vu encore d’homme ressuscité, vous ne croyez pas à la résurrection. Tout d’abord, vous n’auriez pas cru possible non plus que l’homme naquît de ce simple germe, et cependant vous voyez que c’est là son origine. De même, vous devez admettre que, dissous dans la terre et réduits à l’état de germes, les corps des hommes peuvent, au temps voulu, par l’ordre de Dieu, ressusciter et revêtir l’incorruptibilité[55]. Quelle idée se font-ils de la puissance divine, ceux qui prétendent que chaque chose doit retourner aux éléments d’où elle est sortie et que Dieu même ne peut absolument rien contre cette loi ? En vérité je ne saurais le dire. Ce que je vois bien, c’est qu’ils n’auraient pas cru à la possibilité de leur propre création, de celle du monde entier, tel qu’il est, et avec l’origine qu’ils lui connaissent. Il vaut donc mieux croire à ce qui surpasse notre nature et la puissance humaine que d’être incrédule comme les autres. C’est l’enseignement que nous avons reçu, car nous avons entendu dire à notre maître Jésus-Christ : « Ce qui est impossible aux hommes est possible à Dieu. »[56] Et : « Ne craignez pas que ceux qui vous tuent et qui ne peuvent rien au delà. Mais craignez celui qui, après la mort, peut précipiter dans la géhenne le corps et l’âme. »[57] La géhenne est le lieu où seront punis ceux qui ont vécu dans l’iniquité et qui n’ont pas cru que Dieu réaliserait ce qu’il avait annoncé par le Christ.</p><p>XX. La Sibylle et Hystaspe ont dit que la nature corruptible serait consumée par le feu. Les philosophes qu’on appelle stoïciens enseignent que Dieu même se résoudra en feu et qu’après ces changements le monde renaîtra. Quant à nous, nous pensons que le Dieu qui a tout créé est supérieur à cette nature changeante. Si donc, sur certains points, nous sommes d’accord avec les plus estimés de vos philosophes et de vos poètes, si, sur d’autres, nous parlons mieux qu’eux et d’une façon plus digne de Dieu, si seuls enfin nous prouvons ce que nous affirmons, pourquoi cette haine injuste et exceptionnelle contre nous ? En affirmant l’ordonnance et la création de toutes choses par Dieu, nous paraîtrons enseigner la doctrine de Platon ; l’embrasement universel, celle des stoïciens. En disant que les âmes des méchants conservent le sentiment après la mort, et subissent la peine de leurs crimes, que celles des justes, exemptes de peines, ont un sort heureux, nous paraîtrons d’accord avec les poètes et les philosophes. En défendant d’adorer l’ouvrage des mains des hommes, nous parlons comme le comique Ménandre et tous ceux qui ont écrit dans le même sens. Ils ont proclamé que le Créateur est plus grand que la créature.</p><p>XXI. Quand nous disons que le Verbe, le premier né de Dieu, Jésus-Christ notre maître, a été engendré sans opération charnelle, qu’il a été crucifié, qu’il est mort et qu’après être ressuscité, il est monté au ciel, nous n’admettons rien de plus étrange que l’histoire de ces êtres que vous appelez fils de Zeus. Vous n’ignorez pas en effet combien vos auteurs les plus estimés prêtent de fils à Zeus ; Hermès est son verbe et son interprète, le maître universel ; Asclépios fut aussi médecin et ayant été frappé de la foudre, remonta au ciel ; Dionysos fut mis en pièces ; Héraclès se jeta au feu pour mettre fin à ses travaux ; les Dioscures, fils de Léda, Persée, fils de Danaé, montèrent au ciel, et aussi, sur le cheval Pégase, Bellérophon, fils de mortels. Que dire d’Ariadne et de ceux qui, comme elle, furent changés en astres ? Et vos empereurs, à peine sont-ils morts, que vous les mettez au rang des immortels, et vous trouvez toujours quelqu’un pour jurer qu’il a vu le César qu’on vient de brûler s’élever du bûcher vers le ciel. Et combien d’histoires on raconte de tous ces prétendus fils de Zeus, vous le savez et je n’ai pas besoin de vous le dire. D’ailleurs elles n’ont été écrites que pour corrompre et pervertir la jeunesse ; car chacun pense qu’il est beau d’imiter les dieux. Loin de nous, si nous sommes purs, une telle conception de la divinité. Quoi ! représenter Zeus, le maître et le créateur du monde comme parricide et fils de parricide, livré à l’amour et vaincu par de bas et honteux plaisirs, abusant de Ganymède et de quantité de femmes ! nous montrer ses enfants commettant les mêmes crimes ! Comme je l’ai dit[58], c’est là l’œuvre des mauvais démons. Pour nous, notre doctrine nous apprend que ceux là seuls peuvent espérer l’immortalité, qui ressemblent à Dieu par la piété et la sainteté de leur vie. Quant aux méchants qui ne s’amendent pas, nous croyons qu’ils seront châtiés dans le feu éternel.</p><p>XXII. Le fils de Dieu, que nous appelons Jésus, quand il ne serait qu’un simple mortel, mériterait par sa sagesse d’être appelé fils de Dieu, car tous les auteurs donnent à Dieu le nom de père des hommes et des dieux. Si nous disons que lui, verbe de Dieu, est né de Dieu, par un mode particulier de génération, contrairement à la loi ordinaire, encore une fois[59], c’est une dénomination qui lui est commune avec Hermès que vous appelez le verbe et le messager de Dieu. Nous objectera-t-on qu’il a été crucifié ? En cela, il ressemble aux fils de Zeus que j’ai énumérés plus haut et qui ont eu, selon vous, des tourments à souffrir. On raconte d’eux qu’ils subirent les genres de mort les plus différents. Si donc, on considère les tourments particuliers qu’il eut à souffrir, il ne leur est pas inférieur. Au contraire, comme nous l’avons promis[60], nous montrerons, dans la suite de ce discours, qu’il les surpasse, ou plutôt, la preuve est déjà faite, car c’est par les actes que se constate la supériorité. Nous racontons qu’il est né d’une vierge : il a cela de commun avec votre Persée ; qu’il guérissait les boiteux, les paralytiques, les infirmes de naissance et qu’il ressuscitait les morts : cela paraîtra une ressemblance avec les prodiges que vous racontez d’Asclépios.</p><p>XXIII. Voici ce que nous voulons vous prouver : ces enseignements que nous avons reçus du Christ et des prophètes ses prédécesseurs sont seuls vrais et plus anciens que ceux de vos écrivains, et si nous vous demandons de les admettre, ce n’est pas en raison de ces ressemblances, mais parce qu’ils sont vrais ; Jésus-Christ seul est proprement le fils de Dieu, son Verbe, son premier né, sa puissance, et il s’est fait homme par sa volonté pour nous apporter une doctrine destinée à renouveler et à régénérer le genre humain ; avant qu’il parût homme parmi les hommes, sous l’inspiration des démons[61] dont j’ai parlé, certains prirent les devants et par l’intermédiaire des poètes présentèrent comme des réalités des fables inventées[62], absolument comme ils suscitèrent contre nous des calomnies odieuses et impies, sans preuve et sans témoin. Voilà ce que nous voulons prouver.</p><p>XXIV. En premier lieu, nous ne faisons que ce que font les Grecs, et seuls nous sommes haïs pour le nom du Christ. Nous sommes innocents et on nous tue comme des scélérats. Partout, on peut adorer des arbres, des fleuves, des rats, des chats, des crocodiles, des animaux de toute espèce, et ce ne sont pas les mêmes qui sont adorés par tous : chacun a son dieu, et tous se traitent réciproquement d’impies parce qu’ils n’ont pas le même culte. La seule chose que vous puissiez nous reprocher, c’est de ne pas adorer les mêmes dieux que vous et de ne pas offrir sur les tombes[63] des morts des libations, la graisse des victimes, des couronnes, des sacrifices. Mais qu’une même chose est ici un dieu, ailleurs un animal, ailleurs une victime, c’est ce que vous savez bien.</p><p>XXV. En second lieu, seuls de tous les hommes, nous qui adorions autrefois Dionysos, fils de Sémélé, et Apollon, fils de Latone, dont il serait honteux même de dire les passions contre nature, Perséphone et Aphrodite, dont vous célébrez dans vos mystères l’amour pour Adonis, Asclépios et tous ces prétendus dieux, nous avons, au péril de notre vie, renoncé à ce culte pour Jésus-Christ ; nous nous sommes consacrés au Dieu non engendré et impassible. Lui, du moins, jamais il ne se serait excité à séduire Antiope ou d’autres femmes, ou à abuser de Ganymède ; jamais il n’a eu besoin de l’intervention de Thétis pour être délivré par le géant aux cent bras ; jamais, en retour de ce service, il ne songea à sacrifier des milliers de Grecs à Achille, fils de Thétis, furieux de l’enlèvement de sa concubine Briséis. Nous plaignons ceux qui croient à de pareilles fables et nous reconnaissons là l’œuvre des démons.</p><p>XXVI. En troisième lieu, après le retour du Christ au ciel, les démons suscitèrent des hommes qui se dirent dieux, et bien loin de les poursuivre, vous les avez comblés d’honneurs. Simon, le Samaritain, du bourg de Gitthon, vint dans votre ville impériale de Rome, sous le règne de Claude César. Aidé par les démons, il fit des prodiges de magie. On le prit pour un dieu : il eut sa statue comme un dieu : elle s’élève dans une île du Tibre, entre les deux ponts, avec cette inscription latine : <i>Simoni Deo sancto</i>[64]. Presque tous les Samaritains et quelques hommes d’autres nations le reconnaissent et l’adorent comme leur première divinité. Une certaine Hélène, qui l’accompagnait alors dans toutes ses courses, et qui avait d’abord vécu dans un lieu de prostitution, passe pour être sa première expression. Ménandre, Samaritain, lui aussi, du bourg de Capparétée, fut disciple de Simon. Avec l’assistance des démons, il trompa par les prestiges de la magie beaucoup d’habitants d’Antioche, au point de faire croire à ses adeptes qu’ils ne mourraient pas[65] ; et encore aujourd’hui on trouve de ses disciples qui le croient. Marcion du Pont, qui enseigne encore aujourd’hui, professe la croyance à un dieu supérieur au Créateur. Avec l’aide des démons, il sema le blasphème à travers le monde, fit nier le Dieu créateur de l’univers, et inspira à ses adeptes la prétention qu’un autre Dieu supérieur a fait des ouvrages plus merveilleux. Tous les sectateurs de cette école, comme nous l’avons dit[66], sont appelés chrétiens, de la même manière que, malgré la différence des doctrines, le nom de philosophes est donné à tous ceux qui font profession de philosophie[67]. Se rendent-ils coupables des infamies qu’on met sur le compte des chrétiens, comme ces extinctions de lumières, ces promiscuités, ces repas de chair humaine ? nous l’ignorons ; mais ce que nous savons bien, c’est que vous ne les poursuivez pas et que vous ne les mettez pas à mort, du moins à cause de leurs opinions. D’ailleurs nous avons composé un livre sur toutes les hérésies[68]. Si vous voulez le lire, nous vous le donnerons.</p><p>XXVII. Quant à nous, bien loin de commettre l’injustice ou l’impiété, nous regardons comme un crime d’exposer les enfants, d’abord parce que c’est les vouer presque tous à la prostitution, non seulement les jeunes filles, mais les jeunes garçons. De même qu’autrefois on élevait des troupeaux de bœufs et de chèvres, de moutons et de chevaux, ainsi aujourd’hui on élève des enfants uniquement en vue de la débauche. Chez toutes les nations on trouve une quantité de femmes, d’êtres d’un sexe douteux, de créatures infâmes, livrée à ce commerce, et vous percevez sur ce trafic des droits, des tributs et des impôts au lieu de l’extirper de votre empire. Et parmi ceux qui abusent de ces malheureux, outre que ces plaisirs sont impies, sacrilèges et impurs, peut-être s’en trouve-t-il qui abusent d’un enfant, d’un parent, d’un frère. Il y en a qui prostituent leurs enfants et leurs femmes ; d’autres se mutilent publiquement en vue de la prostitution infâme et célèbrent les mystères de la mère de Dieu ; et à chacun de vos dieux vous donnez pour attribut le grand et mystérieux symbole du serpent. Voilà les horreurs que vous commettez ouvertement, dont vous vous faites honneur, et que vous nous accusez de commettre, les lumières éteintes, plongés dans l’obscurité[69]. Ces accusations ne nous atteignent pas, puisque nous sommes innocents de ces crimes : elles retombent plutôt sur les auteurs de ces infamies et de ces calomnies.</p><p>XXVIII. Nous appelons le chef des démons serpent, satan et diable, comme vous pouvez le voir en lisant nos livres. Il sera jeté au feu, avec son armée et les hommes qui le suivent, pour y être éternellement puni : ainsi l’a prédit le Christ[70]. Si Dieu diffère ce châtiment, c’est à cause des hommes ; car il sait qu’il y en a qui doivent se sauver par la pénitence, même parmi ceux qui ne sont pas encore nés. Il a créé l’homme intelligent et capable de choisir librement le vrai et le bien, de sorte qu’il n’y aura d’excuse pour personne devant Dieu ; car les hommes sont raisonnables et intelligents. Prétendre que Dieu ne se met pas en peine des choses humaines, c’est nier Dieu d’une façon détournée, ou dire que, s’il existe, il aime le mal ou reste insensible comme la pierre, et que la vertu et le vice ne sont rien et qu’il n’y a de distinction entre le bien et le mal que dans l’opinion des hommes. Or c’est là une impiété et une injustice odieuse.</p><p>XXIX. La seconde raison pour laquelle nous n’exposons pas les enfants, c’est que nous craignons que, faute de quelqu’un qui les recueille, ils ne viennent à mourir, et que nous ne soyons coupables d’homicide. Quant à nous, si nous nous marions, c’est pour élever nos enfants ; si nous renonçons au mariage, nous gardons la continence parfaite. Un de nos frères, pour vous convaincre qu’il n’y a point parmi nos mystères un commerce infâme, présenta une supplique à Félix, gouverneur d’Alexandrie, pour lui demander de lui faire enlever par un médecin les organes de la génération : les médecins de la ville prétendaient ne pouvoir le faire sans l’autorisation du préfet. Félix ne voulut pas souscrire à cette requête : le jeune homme garda la continence, fort de sa conscience et du témoignage de ceux qui partageaient sa foi. N’est-ce pas le lieu, à ce propos, de rappeler cet Antinoüs, qui mourut naguère, et que la crainte fit adorer comme un dieu, quoiqu’on sût bien qui il était, et d’où il venait[71] ?</p><p>XXX. Maintenant, on nous objectera peut-être que celui que nous appelons le Christ n’est qu’un homme, né d’un homme, que les prodiges que nous lui attribuons sont dus à l’art de la magie, et qu’il a réussi ainsi à se faire passer pour fils de Dieu. Notre démonstration ne s’appuiera pas sur des on-dit, mais sur la créance qu’on doit nécessairement à des prophéties faites avant l’événement : car nous avons vu et nous voyons encore se réaliser ce qui a été prédit. Nous espérons que cette preuve vous paraîtra convaincante et décisive.</p><p>XXXI. Il y eut chez les Juifs des prophètes de Dieu, par lesquels l’Esprit prophétique annonça d’avance les événement futurs. Leurs prophéties furent gardées soigneusement, telles qu’elles avaient été prononcées, par les rois successifs de Judée, dans des livres écrits en hébreu de la main même des prophètes. Or Ptolémée, roi d’Égypte, fonda une bibliothèque où il voulut réunir les ouvrages de tous les écrivains. Ayant eu connaissance de ces prophéties, il fit demander à Hérode, qui régnait alors en Judée, de lui envoyer ces livres[72]. Le roi Hérode les lui envoya, écrits, comme je l’ai dit, en hébreu. Comme personne n’entendait cette langue en Égypte, Ptolémée lui fit demander de lui envoyer des savants pour les traduire en grec. Ces traductions furent faites : elles existent encore en Égypte et on les trouve partout entre les mains des Juifs. Mais ils les lisent sans les comprendre. Ils nous tiennent pour leurs ennemis et leurs adversaires : comme vous, ils nous persécutent et nous font mourir quand ils le peuvent : vous pouvez en avoir facilement la preuve. Dans la dernière guerre de Judée, Barcochébas, le chef de la révolte, faisait subir aux chrétiens, et aux chrétiens seuls, les derniers supplices, s’ils ne reniaient et ne blasphémaient Jésus-Christ[73]. Et pourtant nous lisons, annoncé dans les livres des prophètes, que Jésus, notre Christ, doit venir, qu’il naîtra d’une vierge, qu’il parviendra à l’âge d’homme, qu’il guérira toute maladie et toute infirmité[74], qu’il ressuscitera les morts, que, méconnu et persécuté, il sera crucifié, qu’il mourra, qu’il ressuscitera et montera au ciel, qu’il est et sera reconnu fils de Dieu, qu’il enverra certains annoncer ces choses dans le monde entier et que ce seront surtout les gentils qui croiront en lui. Ces prophéties furent faites cinq mille, trois mille, deux mille, mille, huit cents ans avant sa venue ; car les prophètes se succédèrent les uns aux autres de génération en génération.</p><p>XXXII. Moïse, le premier des prophètes, dit en propres termes : « Il ne manquera pas de roi de Juda, ni de chef de cette race, jusqu’à ce que vienne celui à qui il a été réservé. Celui-là sera l’attente des nations, il attachera son poulain à la vigne, et il lavera sa robe dans le sang de la grappe. »[75] Examinez soigneusement et vous verrez jusqu’à quand les Juifs eurent un chef et un roi de leur nation : jusqu’à l’apparition de Jésus-Christ, notre maître, l’interprète des mystérieux oracles. Ainsi s’accomplit ce qu’avait prédit par Moïse l’esprit divin, saint et prophétique, que le sceptre ne sortirait pas de Juda, jusqu’à ce que vint celui à qui était réservé le royaume. Juda est l’ancêtre des Juifs, et c’est à lui qu’ils doivent leur nom. Or, après la venue du Maître, vous avez régné sur les Juifs, et vous avez conquis tout leur territoire. « Il sera l’attente des nations. » Cette parole signifiait que dans toutes les nations on attendrait son second avènement. Or vous pouvez le voir et vous convaincre du fait : dans toutes les nations, on espère en ce crucifié de la Judée, après la mort duquel la patrie des Juifs a été conquise par vos armes et livrée entre vos mains. Cette autre parole : « il attachera son poulain à la vigne et il lavera sa robe dans le sang de la grappe » était un symbole de ce qui devait arriver au Christ et de ce qu’il devait faire lui-même. Il y avait à l’entrée d’un village un ânon attaché à une vigne : il se le fit amener par ses disciples et il le monta, et c’est assis dessus qu’il fit son entrée à Jérusalem[76], où était ce grand temple des Juifs, que vous avez ensuite détruit. Puis il fut crucifié, pour que le reste de la prophétie fût accompli. Car cette parole : « il lavera sa robe dans le sang de la grappe » annonçait la passion qu’il devait subir, pour purifier dans son sang ceux qui croiraient en lui. En effet, cette robe dont l’Esprit saint parle par le prophète, c’est l’ensemble des hommes qui croient en lui, dans lesquels habite la semence de Dieu, le Verbe. Ce sang de la grappe, dont il est parlé, signifiait que celui qui devait venir aurait du sang, un sang dû non à la semence humaine, mais à la puissance de Dieu. Or la première puissance, après le Dieu, père et maître de toutes choses[77] c’est le Fils, son Verbe[78], qui s’est fait chair et est devenu homme, comme nous le dirons dans la suite. Si donc ce n’est pas l’homme, mais Dieu qui a fait le sang de la grappe, cette parole signifiait que le sang du Christ viendrait non de la semence humaine, mais de la puissance de Dieu, comme nous l’avons dit. Un autre prophète, Isaïe, annonce la même chose en d’autres termes : « Une étoile se lèvera de Jacob et une fleur poussera sur la tige de Jessé ; et les nations espéreront en son bras. »[79] Cette étoile lumineuse qui se leva, cette fleur qui poussa sur la tige de Jessé, c’est le Christ. Il naquit, par la vertu de Dieu, d’une vierge, de la race de Jacob, le père de Juda, qui, comme nous l’avons vu, fut l’ancêtre des Juifs. Jessé aussi fut selon les oracles, un aïeul du Christ, fils lui-même de Jacob et de Juda, selon l’ordre des générations.</p><p>XXXIII. Écoutez maintenant comment Isaïe annonce en propres termes qu’il naîtra d’une vierge. Il s’exprime ainsi : « Voici que la vierge sera enceinte et enfantera un fils, et on l’appellera Dieu avec nous. »[80] Voilà une chose qui paraît aux hommes incroyable et impossible. C’est précisément ce que Dieu a prédit par l’Esprit prophétique, afin qu’à l’événement on ne refusât pas de le croire, mais qu’on crût au contraire en raison même de la prophétie[81]. Peut-être qu’on ne comprendra pas le sens de cet oracle et qu’on nous reprochera ce que nous avons nous-même reproché aux poètes, qui représentent Zeus se livrant à un commerce impur avec des femmes. Nous essaierons donc d’expliquer ces paroles. « Voici que la vierge sera enceinte, » c’est-à-dire que la vierge concevra sans commerce humain ; car si ce commerce avait eu lieu avec quelqu’un, elle ne serait plus vierge. La vertu de Dieu descendant sur la vierge l’a couverte de son ombre[82] et l’a fait concevoir sans violer sa virginité. En ce temps-là, l’ange de Dieu envoyé à la vierge lui annonça la bonne nouvelle en ces termes : « Voici que vous concevrez du saint Esprit et que vous enfanterez un fils, et ce fils sera appelé le fils du Très-Haut, et vous lui donnerez le nom de Jésus, car il sauvera son peuple de ses péchés. »[83] C’est là ce que nous avons appris de ceux qui ont raconté la vie de notre Sauveur Jésus-Christ, et nous le croyons, parce que, comme nous l’avons dit, l’Esprit prophétique annonça sa future naissance par la bouche d’Isaïe dont nous avons parlé. Par l’Esprit et la vertu de Dieu, nous ne pouvons entendre que le Verbe, le premier né de Dieu, comme parle le prophète Moïse[84] dont nous avons fait mention plus haut ; et cet esprit, survenant sur la vierge et la couvrant de son ombre la fit concevoir, non par commerce charnel, mais par puissance. Jésus est un nom hébreu qui en grec signifie <i>σωτήρ</i> (sauveur). C’est pourquoi l’ange dit à la vierge : « Vous l’appellerez Jésus, car il sauvera son peuple de ses péchés. » Vous-mêmes, je pense, vous reconnaîtrez que les prophètes ne peuvent être inspirés que par le Verbe de Dieu.</p><p>XXXIV. Or où il naîtrait, écoutez comment Michée, un autre prophète l’a prédit. Voici ses paroles : « Et toi, Bethléem, terre de Juda, tu n’es pas la plus petite parmi les princes de Juda, car de toi sortira le chef, le pasteur de mon peuple. »[85] Bethléem est une bourgade de Judée, à trente-cinq stades de Jérusalem. C’est là qu’est né le Christ : vous pouvez vous en assurer par les registres du cens de Cyrénius, votre premier gouverneur en Judée.</p><p>XXXV. Après sa naissance, le Christ devait rester inconnu des hommes, jusqu’à l’âge viril. C’est ce qui arriva en effet. Écoutez ce qui est prédit à ce sujet. Voici la prophétie : « Un petit enfant nous est né : un jeune adolescent nous a été donné : le signe de sa puissance est sur ses épaules. »[86] Il s’agit ici de la puissance de la croix, sur laquelle il appliqua les épaules, quand il fut crucifié, ainsi que vous le verrez plus clairement dans la suite. Le même prophète Isaïe, inspiré par l’Esprit prophétique, dit encore : « J’ai tendu mes mains vers le peuple incrédule et contradicteur, vers ceux qui suivent une voie mauvaise. Ils me demandent maintenant jugement et osent approcher de Dieu. »[87] Et encore, dans un passage différent, le Christ dit par un autre prophète : « Ils ont percé mes pieds et mes mains, ils ont tiré ma robe au sort. »[88] Or le roi prophète David, qui a dit ces paroles, n’a rien souffert de semblable. C’est Jésus-Christ qui a tendu ses mains, quand il fut crucifié par les Juifs contradicteurs, qui prétendaient qu’il n’était pas le Christ. Comme le prophète l’avait annoncé[89], ils le tirèrent de côté et d’autre et le firent asseoir sur un trône en lui disant : « Juge-nous. » Cette parole : « Ils ont percé mes mains et mes pieds » signifiait que, sur la croix, ses mains et ses pieds seraient percés de clous. Et après l’avoir crucifié, ils tirèrent sa robe au sort, et ses bourreaux se la partagèrent[90]. Vous pouvez voir tout ce récit dans les actes de Ponce-Pilate. Il avait bien été vraiment annoncé qu’il ferait son entrée à Jérusalem, monté sur un ânon : en voici encore une autre preuve dans la prophétie de Sophonie. Elle est conçue en ces termes : « Réjouis-toi, fille de Sion ; publie-le à haute voix, fille de Jérusalem. Voici ton roi qui vient à toi plein de douceur, assis sur une ânesse et son ânon soumis au joug. »[91]</p><p>XXXVI. Quand vous entendez ainsi les prophètes s’exprimer comme en leur propre nom, ce ne sont pas ces hommes inspirés qui parlent, ne le croyez pas, mais le Verbe divin qui les meut. Tantôt il annonce l’avenir par mode de prédiction ; tantôt il fait parler directement Dieu le maître et le père de toutes choses, tantôt le Christ, tantôt les peuples qui répondent au Seigneur ou à son père. N’est-ce pas ce que vous voyez faire à vos écrivains : le même auteur, qui écrit tout, met en scène des interlocuteurs différents. C’est ce que n’ont pas compris les Juifs qui ont entre les mains les livres des prophètes : ils n’ont pas su reconnaître le Christ, même après sa venue ; mais nous qui croyons à son avènement, et qui prouvons que, selon les prophètes, il a été crucifié par eux, ils nous poursuivent de leur haine.</p><p>XXXVII. Pour que cela vous soit évident, voici les paroles que le prophète Isaïe, dont j’ai déjà parlé, met dans la bouche du Père : « Le bœuf connaît son maître et l’âne l’étable de son maître ; mais Israël ne m’a pas connu et mon peuple n’a pas compris. Malheur à la nation pécheresse, au peuple rempli de crimes, à la race perverse, aux fils d’iniquité. Vous avez abandonné le Seigneur. »[92] Et ailleurs, le même prophète met encore ces mots dans la bouche du Père : « Quelle maison m’avez-vous bâtie ? dit le Seigneur. Le ciel est mon trône, et la terre l’escabeau de mes pieds. »[93] Et encore ailleurs : « Mon cœur déteste vos néoménies et vos sabbats : je ne puis supporter votre grand jour de jeûne et votre oisiveté. Si vous venez pour paraître devant moi, je ne vous exaucerai pas. Vos mains sont pleines de sang. La fleur de farine et l’encens que vous m’offrez est pour moi une abomination :[94] Vous pouvez juger par là des enseignements que les prophètes mettent dans la bouche du Père.</p><p>XXXVIII. Lorsque l’Esprit prophétique fait parler le Christ, voici comment il s’exprime : « J’ai tendu mes mains vers le peuple incrédule et contradicteur, vers ceux qui suivent une voie mauvaise. »[95] Et encore : « J’ai présenté mon dos au fouet et mes joues aux soufflets, et je n’ai pas détourné ma face de l’affront des crachats. Le Seigneur est mon appui : c’est pourquoi je n’ai pas été confondu : mon visage a été comme un rocher solide, et j’ai su que je ne serais pas confondu, parce que celui qui me justifie est près de moi. »[96] Il dit encore : « Ils ont tiré ma robe au sort, et ils ont percé mes pieds et mes mains. Je me suis endormi et j’ai pris mon sommeil, et je me suis levé, parce que le Seigneur a pris soin de moi. »[97] Et encore : « Ils ont remué les lèvres et branlé la tête en disant : Qu’il se sauve lui-même. »[98] Toutes choses qu’ont faites les Juifs pour le Christ : vous pouvez vous en rendre compte. Quand il était en croix, ils remuaient les lèvres et branlaient la tête en disant : « Il a ressuscité les morts : qu’il se sauve lui-même. »[99]</p><p>XXXIX. Lorsque l’Esprit prophétique annonce l’avenir sous forme de prédiction, voici comment il parle : « Une loi sortira de Sion et un Verbe de Dieu de Jérusalem, il jugera parmi les nations et il convaincra une grande multitude : et les nations feront de leurs glaives des fers de charrues, et de leurs lances des faucilles, et les peuples ne lèveront plus l’épée contre les peuples et ils n’apprendront plus à faire la guerre. »[100] Ces paroles se sont réalisées : vous pouvez vous en convaincre. Douze hommes sont partis de Jérusalem pour parcourir le monde. C’était des hommes simples[101] et qui ne savaient pas parler : mais au nom de Dieu, ils annoncèrent à tous les hommes qu’ils étaient envoyés du Christ pour enseigner à tous la parole de Dieu ; et nous, qui autrefois ne savions que nous entre-tuer, non seulement nous ne combattons plus nos ennemis, mais pour ne pas mentir ni tromper nos juges, nous confessons joyeusement le Christ et nous mourons. Et cependant il nous serait facile de faire comme on a dit : « La langue a juré, mais non le cœur. »[102] Certes, il serait étrange que les soldats que vous enrôlez et qui vous engagent leur foi sacrifient à la fidélité qu’ils vous doivent, à vous qui ne pouvez leur donner qu’une récompense corruptible, leur vie, leurs parents, leur patrie, tous leurs intérêts, et que nous, qui aspirons à l’immortalité, nous ne soyons pas prêts à tout supporter pour obtenir la récompense désirée de celui qui peut nous l’accorder.</p><p>XL. Écoutez ce qui a été dit des hérauts de sa doctrine, qui ont annoncé sa venue. C’est le roi prophète, dont j’ai parlé plus haut, qui parle ainsi, inspiré par l’Esprit prophétique : « Le jour l’annonce au jour ; la nuit le dit à la nuit. Il n’est point de nation, de quelque langue que ce soit, qui n’entende leur parole. Leur voix s’est répandue sur toute la terre, et leurs paroles jusqu’aux limites de la terre. Il a établi sa tente dans le soleil, et comme l’époux qui sort de sa couche, semblable à un géant, il s’élancera pour parcourir sa carrière. »[103] Je pense qu’il sera bien et à propos d’ajouter à ces paroles d’autres prophéties du même David. Vous pourrez voir quelle règle de vie l’Esprit prophétique donne aux hommes ; comment il annonce la coalition d’Hérode, roi des Juifs, des Juifs eux-mêmes, et de Pilate votre procurateur en Judée, avec ses soldats, contre Jésus-Christ ; comment il dit que toute race d’hommes devaient croire en lui ; et que Dieu l’appelle son fils et promet de lui soumettre tous ses ennemis ; comment les démons cherchent, autant qu’ils peuvent, à se soustraire à la puissance de Dieu le père et le maître de toutes choses et à celle du Christ ; et enfin comment Dieu appelle tous les hommes à la pénitence, avant que vienne le jour du jugement. Voici ces paroles : « Heureux l’homme qui n’est pas allé dans l’assemblée des impies, qui n’a pas suivi la voie des pécheurs et qui ne s’est pas assis dans la chaire d’iniquité, mais dont la volonté est dans la loi du Seigneur et qui médite sa loi jour et nuit. Il sera comme l’arbre planté le long des courants des eaux : il donnera des fruits dans son temps, ses feuilles ne tomberont pas et toutes ses entreprises réussiront. Il n’en sera pas ainsi des impies, non il n’en sera pas ainsi ; ils seront comme la poussière que le vent balaye de la surface de la terre. Aussi les impies ne se lèveront pas au jugement, ni les pécheurs dans l’assemblée des justes : parce que le Seigneur connaît la voie des justes et la voie des impies périra. »[104] « Pourquoi les nations ont-elles frémi, et pourquoi les peuples ont-ils formé de vains complots ? Les rois de la terre se sont levés et les princes se sont ligués contre le Seigneur et contre son Christ, disant : Brisons leurs liens et rejetons loin de nous leur joug. Celui qui habite dans le ciel rira d’eux et le Seigneur les tournera en dérision. Alors il leur parlera dans sa colère et il les dispersera dans sa fureur. Quant à moi, j’ai été établi roi par lui sur Sion, sa montagne sainte, pour annoncer la loi du Seigneur. Le Seigneur m’a dit : Tu es mon fils : je t’ai engendré aujourd’hui. Demande-moi et je te donnerai les nations en héritage et ton empire s’étendra jusqu’aux extrémités de la terre. Tu les gouverneras avec une verge de fer et tu les briseras comme des vases d’argile. Et maintenant, rois, comprenez ; instruisez-vous, juges de la terre. Servez le Seigneur dans la crainte ; exaltez-le dans le tremblement. Soumettez-vous à ses leçons, de peur que le Seigneur ne s’irrite et que vous ne vous écartiez du droit chemin, lorsque bientôt son courroux s’allumera. Heureux ceux qui espèrent en lui. »[105]</p><p>XLI. Dans une autre prophétie, l’Esprit prophétique annonce par le même David qu’après avoir été mis en croix, le Christ règnera. Voici ses paroles : « Chantez un cantique au Seigneur par toute la terre : annoncez chaque jour son salut : car le Seigneur est grand et digne de louanges ; il est plus à craindre que tous les dieux ; car les dieux des nations sont les simulacres des démons, mais c’est Dieu qui a fait les cieux. La gloire et l’honneur sont devant sa face ; la force et la splendeur sont dans son sanctuaire. Rendez gloire au Seigneur, père des siècles. Apportez des présents et présentez-vous devant lui et adorez-le dans son parvis sacré. Que toute la terre tremble devant lui : qu’elle soit affermie et qu’elle ne vacille pas. Que les nations se réjouissent : le Seigneur a régné » du haut du bois[106].</p><p>XLII. Parfois l’Esprit prophétique annonce les événements futurs, comme s’ils étaient déjà arrivés : vous avez pu vous en apercevoir dans ce qui précède. Pour que le lecteur ne trouve pas là matière à contestation[107], nous en donnerons l’explication. Ces événements étant absolument décrétés, il les prédit comme s’ils étaient accomplis. Si vous en voulez les preuves, écoutez ce que je vais dire. David fit la prophétie citée plus haut quinze cents ans avant que le Christ fait homme fût crucifié : or personne avant lui n’a été crucifié pour le salut des nations, ni personne après lui. Au contraire, notre Jésus-Christ a été crucifié, est mort, est ressuscité, et il est remonté au ciel où il règne, et la bonne nouvelle, répandue dans le monde entier par les apôtres, est la joie de ceux qui attendent l’immortalité qu’il a promise.</p><p>XLIII. Que d’ailleurs, d’après ce qui vient d’être dit, on ne s’imagine pas que nous croyons que la réalisation de ce qui doit arriver est due à la fatalité du destin. Voici comment nous répondons à cette objection. Chacun, selon ses œuvres, sera châtié, puni ou récompensé : nous avons appris cette doctrine des prophètes et nous la tenons pour vraie. S’il n’en était pas ainsi, si tout était l’œuvre du destin, il n’y aurait plus de libre arbitre. Si c’est le destin qui veut que celui-ci soit bon, et celui-là mauvais, celui-ci n’est pas digne d’éloge ni celui-là de blâme. Et si l’homme ne peut, par le choix libre de sa volonté, éviter le mal et faire le bien, il n’a aucunement à répondre de ses actions. Mais voici qui prouve que l’homme fait librement le bien et le mal. Nous voyons le même homme passer d’un extrême à l’autre. S’il était fatalement bon ou mauvais, il n’y aurait pas de ces contradictions dans sa conduite, et il ne changerait pas constamment. Il n’y aurait ni hommes vertueux ni hommes dépravés, puisque le destin serait cause en même temps du bien et du mal, et qu’il serait contradictoire à lui-même. Ou bien encore, il faudrait admettre, comme nous l’avons dit plus haut[108], que le bien et le mal ne sont rien, et que la vertu et le vice sont choses d’opinion. Or la saine raison nous dit que c’est là une impiété et une injustice odieuse. À nos yeux, le vrai destin inévitable, c’est la juste récompense du bien et le juste châtiment du mal. Dieu n’a pas créé l’homme comme les autres êtres, comme les arbres et les quadrupèdes qui ne peuvent rien faire librement. L’homme ne mériterait ni récompense ni louange, si, au lieu de choisir de lui-même le bien, il était bon par nature. De même, on ne pourrait punir justement ses fautes, si elles n’étaient volontaires, et si lui-même ne pouvait être autre chose que ce qu’il est[109].</p><p>XLIV. C’est l’Esprit prophétique qui nous donne ces enseignements, quand il fait dire à Dieu, par Moïse, au premier homme sortant de ses mains : « Voici devant toi le bien et le mal : choisis le bien. »[110] L’autre prophète, Isaïe, met également ces paroles dans la bouche de Dieu, le père et le maître de l’univers. « Lavez-vous, purifiez-vous, enlevez le mal de vos cœurs, apprenez à bien faire, rendez justice à l’orphelin et défendez la veuve ; venez alors et comptons, dit le Seigneur. Vos péchés vous eussent-ils rendus rouges comme la pourpre, je vous rendrai blancs comme la laine ; fussiez-vous rouges comme l’écarlate, je vous rendrai blancs comme la neige. Si vous voulez m’écouter, vous serez nourris des biens de la terre ; mais si vous ne m’écoutez pas, le glaive vous dévorera. C’est la bouche du Seigneur qui a parlé. »[111] Cette parole : « Le glaive vous dévorera », ne signifie pas que la désobéissance sera punie par le glaive : le glaive du Seigneur, c’est le feu dont ceux qui ont préféré le mal deviendront la pâture. C’est pourquoi il dit : « Le glaive vous dévorera : c’est la bouche du Seigneur qui a parlé. » S’il avait voulu parler du glaive qui tranche et qui tue sur-le-champ, il n’aurait pas dit : « vous dévorera. » Quand Platon a dit : « La faute est à l’homme libre qui choisit, Dieu n’y est pour rien »[112], il a emprunté cette parole au prophète Moïse, car Moïse est plus ancien que tous les écrivains grecs. Tout ce que les philosophes et les poètes ont dit de l’immortalité de l’âme, des châtiments qui suivent la mort, de la contemplation des choses célestes, et des autres dogmes semblables, ils en ont reçu les principes des prophètes, et c’est ainsi qu’ils ont pu les concevoir et les énoncer. Chez tous on trouve des semences de vérité ; mais ce qui prouve qu’ils n’ont pas bien compris, c’est qu’ils se contredisent eux-mêmes. Si donc nous disons que l’avenir a été prédit, nous ne voulons pas dire par là que la loi fatale du destin domine tout. Dieu sait d’avance tout ce que feront les hommes, et, comme il a décrété de récompenser chacun selon ses œuvres, et de punir justement les offenses commises contre lui, il annonce l’avenir par l’Esprit prophétique, afin d’inviter les hommes à comprendre et à se souvenir ; il montre ainsi pour eux sa sollicitude et sa providence. Les démons firent porter la peine de mort contre ceux qui liraient les livres d’Hystaspe, de la Sibylle ou des prophètes, pour effrayer les hommes et les détourner de chercher dans cette lecture la connaissance du bien. Ils voulaient, par ce moyen, les retenir sous leur joug. Mais ils n’ont pas pu interdire ces livres pour toujours. Nous les lisons sans crainte et même, comme vous voyez, nous vous les offrons, dans la persuasion que cette lecture sera agréable à tous. Quand même nous ne parviendrions à persuader qu’un petit nombre d’entre vous, ce sera pour nous un très grand gain. Comme de bons laboureurs, nous recevrons de notre maître notre récompense.</p><p>XLV. Dieu, le père du monde, devait enlever le Christ au ciel après sa résurrection, et il doit l’y conserver jusqu’à ce qu’il ait frappé les démons ses ennemis, jusqu’à ce que soit complet le nombre des prédestinés, des bons et des saints, à cause desquels il n’a pas encore livré l’univers aux flammes[113]. Écoutez le prophète David prédire ces évènements. Voici ses paroles : « Le Seigneur a dit à mon Seigneur : asseyez-vous à ma droite, jusqu’à ce que j’aie fait de vos ennemis l’escabeau de vos pieds. Le Seigneur fera sortir de Jérusalem le sceptre de votre force : régnez au milieu de vos ennemis. À vous le commandement, au jour de votre puissance, dans la splendeur de vos saints. Avant l’étoile du matin, je vous ai engendré de mon sein. » Ces mots : « Il fera sortir de Jérusalem le sceptre de votre puissance » annoncent la parole puissante que, sortant de Jérusalem, les apôtres prêchèrent partout, et malgré la mort qui menace ceux qui enseignent ou seulement confessent le nom du Christ, partout nous recevons cette parole et nous l’enseignons. Quant à vous, si vous lisez en ennemis ces pages, nous vous le répétons, vous ne pouvez que nous tuer. Ce ne sera pas pour nous un dommage ; mais vous et tous ceux qui nous haïssent injustement, si vous ne vous repentez, vous serez voués au feu éternel.</p><p>XLVI. Peut-être essayera-t-on, par un faux raisonnement, de ruiner la valeur de notre doctrine. Nous disons que le Christ est né il y a cent cinquante ans sous le gouverneur Cyrénius et qu’ensuite il a enseigné sous Ponce-Pilate la doctrine que nous lui prêtons. Alors, on objectera que les hommes qui ont vécu avant lui ne sont pas coupables. Nous nous hâtons de répondre à cette difficulté. Le Christ est le premier né de Dieu, son Verbe, auquel tous les hommes participent : voilà ce que nous avons appris et ce que nous avons déclaré. Ceux qui ont vécu selon le Verbe sont chrétiens, eussent-ils passés pour athées, comme, chez les Grecs, Socrate, Héraclite et leurs semblables, et, chez les barbares, Abraham, Ananias, Azarias, Misaël, Élie et tant d’autres, dont il serait trop long de citer ici les actions et les noms. Et aussi, ceux qui ont vécu contrairement au Verbe ont été vicieux, ennemis du Christ, meurtriers des disciples du Verbe. Au contraire, ceux qui ont vécu ou qui vivent selon le Verbe sont chrétiens, et intrépides, et sans peur. Maintenant, pourquoi, par la puissance du Verbe, selon la volonté de Dieu, le père et le maître de toutes choses, le Christ est-il né homme d’une vierge et a-t-il été appelé Jésus, pourquoi a-t-il été crucifié, est-il mort, est-il ressuscité, est-il monté au ciel, tout homme sensé pourra le comprendre d’après ce que nous avons développé si longuement. Il n’est pas nécessaire d’insister sur ce point ; nous passerons à ce qui presse davantage pour le moment.</p><p>XLVII. Écoutez comment l’Esprit prophétique annonce la dévastation de la terre de Judée. Il met ces paroles dans la bouche des peuples étonnés de cette ruine. Les voici : « Sion est devenue déserte : Jérusalem est devenue comme une solitude, la malédiction est sur le temple, notre sanctuaire, et sa gloire, qu’ont célébrée nos pères, a été livrée aux flammes : et tous ses ornements ont été détruits. Vous avez vu cela, impassible et silencieux, et vous nous avez humiliés grandement. » Or vous savez bien que, selon la prophétie, Jérusalem a été réduite en solitude. Sur la dévastation de la ville et sur la défense faite à tous de retourner l’habiter, le prophète Isaïe s’exprime ainsi : « Leur terre est déserte, et en leur présence, leurs ennemis la dévorent, et pas un seul d’entre eux ne l’habitera. » Vous savez bien qu’ordre est donné par vous de n’y laisser demeurer personne et de punir de mort tout Juif qu’on surprendra essayant d’y rentrer.</p><p>XLVIII. Écoutez aussi comment il était prédit que notre Christ guérirait toutes les maladies et ressusciterait les morts. Voici la prophétie : « À son avènement, le boiteux sautera comme un cerf, et la langue des muets sera éloquente ; les aveugles verront, les lépreux seront guéris, et les morts se lèveront et se promèneront. » Or, qu’il ait accompli ces miracles, les actes de Ponce-Pilate vous en donnent la preuve. Il était aussi prédit par l’Esprit prophétique qu’il serait mis à mort, avec ceux qui espèrent en lui. Écoutez ces paroles d’Isaïe. Ce sont les suivantes : « Voilà comment est mort le juste, et personne ne le comprend dans son cœur ; et les hommes justes sont tués et personne n’y pense. À la face de l’iniquité, le juste a été enlevé, et sa sépulture sera en paix. Il a été enlevé du milieu des hommes. »</p><p>XLIX. C’est encore le même Isaïe qui annonce que les peuples des nations, qui ne l’attendaient pas, l’adoreront, et que les Juifs, qui l’ont toujours attendu, ne reconnaîtront pas sa venue. Il fait parler le Christ lui-même. Voici ses paroles : « Je me suis manifesté à ceux qui ne me demandaient pas, et j’ai été trouvé par ceux qui ne me cherchaient pas. J’ai dit : Me voici, aux nations qui n’avaient pas appelé mon nom. J’ai étendu mes mains vers le peuple incrédule et contradicteur, vers ceux qui marchaient dans une voie mauvaise, à la suite de leurs péchés. Ce peuple ameutait la haine contre moi. » En effet, les Juifs, qui avaient les prophéties et qui avaient toujours attendu le Christ, ne surent pas le reconnaître à son avènement. Bien plus, ils le mirent à mort. Au contraire, les Gentils, qui n’avaient jamais entendu parler du Christ, jusqu’au jour où ses apôtres, partis de Jérusalem, leur dirent son histoire et leur transmirent les prophéties, pleins de joie et de foi, renoncèrent à leurs idoles et se consacrèrent par le Christ au Dieu non engendré. Les calomnies qu’on répandrait contre les confesseurs du Christ, et le malheur de ceux qui devaient le maudire et prétendre que c’est un devoir de conserver les vieilles institutions, écoutez comment Isaïe les a prédits en peu de mots. Voici ses paroles : « Malheur à ceux qui appellent le doux amer, et l’amer doux. »</p><p>L. Jésus-Christ voulut bien pour nous se faire homme et subir l’ignominie ; mais de nouveau il doit venir dans la gloire. Écoutez les prophéties qui l’annoncent. Les voici : « Parce qu’ils ont livré son âme à la mort, et qu’il a été mis au rang des pécheurs, il s’est chargé des péchés de beaucoup et il obtiendra le pardon des pécheurs. Voici que mon serviteur comprendra, il sera exalté et recevra une grande gloire. Plusieurs seront stupéfaits à votre sujet, mais aussi les hommes mépriseront votre aspect et votre gloire sera méprisée des hommes ; beaucoup de nations s’étonneront, et les rois resteront muets, parce que ceux-là verront, à qui nulle nouvelle de lui n’était venue, et ceux-là comprendront, qui n’avaient pas entendu parler de lui. Seigneur, qui a cru à notre parole, et à qui le bras du Seigneur a-t-il été révélé ? Nous l’avons annoncé comme un petit enfant, comme une tige sur une terre desséchée. Il n’a ni aspect ni gloire : nous l’avons vu, et il n’avait ni aspect ni beauté ; son aspect était misérable, et il était abandonné devant les hommes. C’est un homme voué aux coups, et sachant supporter la souffrance : on se détourne de sa face ; on le méprise, on ne tient aucun compte de lui. Celui-là porte nos péchés et souffre pour nous, et nous avons vu qu’il était dans la souffrance, dans les supplices et dans l’affliction. Il a souffert à cause de nos iniquités ; il a été dans les supplices à cause de nos péchés. Nous avons appris la paix à ses dépens ; ses meurtrissures nous ont guéris. Nous errions tous comme des brebis ; l’homme s’était égaré dans sa voie. Il l’a livré à cause de nos péchés, et lui, au milieu de l’affliction, il n’a pas ouvert la bouche. C’est une brebis qu’on conduit au sacrifice, un agneau muet devant celui qui le tond : il n’ouvre pas la bouche. Dans son humiliation, il a été jugé. » En effet, lorsqu’il fut crucifié, tous ses disciples l’abandonnèrent et le renièrent. Plus tard, il ressuscita des morts et, se montrant à eux, il leur apprit à lire les prophéties qui annonçaient toutes ces choses et ils le virent remonter au ciel. Pleins de foi et revêtus de la force d’en haut, qu’il leur avait envoyée, ils s’en allèrent à travers le monde, pour instruire les hommes, et on les appela apôtres.</p><p>LI. L’Esprit prophétique, pour nous montrer que celui qui a souffert ces supplices a une origine ineffable et règne sur ses ennemis, parle ainsi : « Qui racontera sa génération ? Sa vie a été retranchée de la terre et il a été à la mort à cause de leurs péchés. Je pardonnerai aux coupables à cause de sa sépulture, aux riches à cause de sa mort ; car il n’a pas commis l’iniquité, on n’a pas trouvé le mensonge sur ses lèvres. Le Seigneur veut le glorifier de son supplice. Si vous donnez pour le péché, votre âme recevra une semence de longue vie. Et le Seigneur veut retirer son âme de la douleur, lui montrer la lumière, lui donner l’intelligence et justifier ce juste qui s’est fait l’esclave de beaucoup. Il portera lui-même nos péchés. C’est pourquoi il recevra en héritage beaucoup de peuples, et il partagera les dépouilles des forts, parce que son âme a été livrée à la mort, et qu’il a été mis au rang des méchants : il a porté les iniquités de plusieurs, et il a été livré pour leurs péchés. » Voyez qu’il devait remonter au ciel, selon les prophéties. Il a été dit : « Levez les portes des cieux, qu’elles s’ouvrent, et le roi de gloire entrera. Quel est ce roi de gloire ? Le Seigneur fort, le Seigneur puissant. » Il doit aussi revenir du ciel, au milieu de la gloire. Écoutez sur ce sujet la prophétie de Jérémie. Telles sont ses paroles : « Voici que le fils de l’homme vient sur les nuées du ciel, et ses anges sont avec lui. »</p><p>LII. Nous avons montré que tous les événements accomplis dans le passé avaient été prédits d’avance par les prophètes. Il faut donc croire aussi que tout ce qui a été semblablement annoncé pour l’avenir ne peut manquer d’arriver. Les faits passés, qu’on ne connaissait que par les prophéties, se sont réalisés. Il en sera de même des autres ; on les ignore, on n’y croit pas : ils arriveront cependant. Les prophètes ont annoncé un double avènement du Christ : l’un, qui a déjà eu lieu, comme d’un homme méprisé et passible ; l’autre qui aura lieu, ainsi qu’il est prédit, lorsqu’il viendra du ciel, dans la gloire, avec l’armée de ses anges. Alors, il ressuscitera les corps de tous les hommes qui ont existé, il revêtira les justes d’immortalité, et il enverra dans le feu éternel les méchants, qui souffriront éternellement avec les démons. Nous vous montrerons que ces événements à venir ont été prédits. Le prophète Ézéchiel s’exprime ainsi : « La jointure se reliera à la jointure, l’os à l’os, et les chairs repousseront. Et tout genou fléchira devant le Seigneur, et toute langue le confessera. » Dans quelles souffrances et dans quels châtiments doivent être les méchants, écoutez ce qui est dit aussi à ce sujet. Voici : « Leur ver ne cessera pas et leur feu ne s’éteindra pas. » Et alors ils se repentiront, mais en vain. Et que diront et que feront les Juifs, quand ils verront venir le Christ dans sa gloire ? Le prophète Zacharie l’annonce en ces termes : « Je commanderai aux quatre vents de rassembler mes enfants dispersés, je commanderai au vent du nord de les porter et au vent du sud de ne pas les arrêter. Et alors à Jérusalem, il y aura grand gémissement, non pas de la bouche et des lèvres, mais un gémissement du cœur ; ils ne déchireront pas leurs vêtements, mais leurs esprits. Ils se plaindront tribu à tribu, ils regarderont celui qu’ils ont percé et ils diront : Pourquoi, Seigneur, nous avez-vous fait errer loin de votre voie ? La gloire dont se glorifiaient nos pères est devenue pour nous une ignominie. »</p><p>LIII. Nous pourrions citer beaucoup d’autres prophéties ; mais nous nous arrêterons ici, persuadé que celles que nous avons alléguées suffisent à convaincre ceux qui ont des oreilles pour entendre et comprendre. Ils peuvent voir eux-mêmes, croyons-nous, qu’à la différence de ces faiseurs de fables qui racontent l’histoire des prétendus fils de Zeus, nous pouvons prouver ce que nous avançons. Comment croirions-nous, en effet, qu’un crucifié est le premier né du Dieu non engendré, et qu’il jugera tout le genre humain, si nous ne voyions réalisées de point en point toutes les prophéties faites à son sujet avant son incarnation, la dévastation de la Judée, les hommes de toutes les nations embrassant la doctrine de ses apôtres, renonçant aux anciennes coutumes dans lesquelles ils s’étaient égarés, si nous ne nous voyions nous-mêmes, et cette foule de Gentils, chrétiens plus nombreux et plus sincères que ceux qui sont d’origine juive ou samaritaine ? L’Esprit prophétique appelle Gentils toutes les autres races d’hommes : les tribus de Judée et de Samarie sont appelées Israël et maison de Jacob. Comme il fut annoncé qu’il y aurait plus de croyants chez les gentils que chez les Juifs et les Samaritains, nous rapporterons cette prophétie. Elle est conçue en ces termes : « Réjouissez-vous, vous qui êtes stérile et qui n’avez pas d’enfants : éclatez en cris de joie, vous qui n’enfantez pas, car l’épouse abandonnée aura plus d’enfants que celle qui a un époux. » Cette abandonnée, c’était la Gentilité, qui ne connaissait pas le vrai Dieu, et qui adorait les œuvres des mains des hommes : et les Juifs et les Samaritains, qui avaient reçu des prophètes la parole de Dieu, qui attendaient le Christ, ne surent pas le reconnaître à son avènement, excepté un petit nombre dont le saint Esprit prophétique annonce le salut par Isaïe. Le prophète les fait parler ainsi : « Si le Seigneur ne nous eût laissé une semence, nous serions devenus comme Sodome et Gomorrhe. » Sodome et Gomorrhe sont deux villes impies dont parle Moïse, que Dieu ruina par le feu et le soufre. Personne n’y fut sauvé, excepté un étranger Chaldéen, nommé Lot, qui échappa avec ses filles. Toute leur contrée resta déserte, brûlée et stérile : on peut s’en convaincre, si l’on veut. Dieu prévoyait que les Gentils seraient bien plus sincères et plus fidèles : le prophète Isaïe en est témoin. Voici ses paroles : « Israël est incirconcis du cœur : les Gentils ne sont incirconcis que du prépuce. » Tous ces témoignages peuvent certainement produire une foi et une conviction raisonnable chez ceux qui aiment la vérité, et qui ne sont pas esclaves de l’opinion ou de leurs passions.</p><p>LIV. Ceux qui enseignent aux jeunes gens les fables des poètes n’apportent aucune preuve à l’appui de leurs récits. Nous montrerons que ce sont des inventions des démons pour tromper et égarer les hommes. Sachant par les prophètes que le Christ devait venir et que les impies seraient punis par le feu, ils mirent en avant un grand nombre de fils de Zeus, dans l’espoir qu’ils pourraient faire passer auprès des hommes l’histoire du Christ pour une fable semblable aux inventions des poètes. Ils répandirent ces récits chez les Grecs et les Gentils, là surtout où ils savaient par les prophètes qu’on croirait au Christ. Mais ces prophéties qu’ils connaissaient, ils n’en comprenaient pas bien le sens, et ils imitaient à contretemps ce qui est dit de notre Christ ; nous allons vous le montrer. Moïse, le plus ancien des écrivains, comme nous l’avons dit, avait fait cette prophétie que nous avons déjà citée : « Il ne manquera pas de prince de Juda, ni de chef de sa race, jusqu’à ce que vienne celui à qui il a été réservé ; et celui-là sera l’attente des nations : il attachera son poulain à la vigne, et il lavera sa robe dans le sang de la grappe. » Les démons, qui avaient connaissance de cette prophétie, supposèrent un Dionysos, fils de Zeus ; ils prétendirent qu’il avait découvert la vigne ; ils introduisirent le vin[114] dans ses mystères, et ils enseignèrent qu’il monta au ciel, après avoir été mis en pièces. Dans la prophétie de Moïse, il n’est pas dit clairement si celui qui doit venir est fils de Dieu, ni, si monté sur ce poulain, il doit rester sur la terre, ou monter au ciel. D’autre part, ce nom de poulain peut s’appliquer aussi bien à un âne qu’à un cheval. Ne sachant donc pas si celui qui était annoncé devait manifester sa présence monté sur un âne ou sur un cheval, s’il serait fils de Dieu, comme nous l’avons dit plus haut, ou fils d’un homme, les démons racontèrent que Bellérophon, homme et fils des hommes, monta au ciel sur le cheval Pégase. Ils avaient appris par le prophète Isaïe que le Christ devait naître d’une vierge et s’élever au ciel par sa propre puissance ; et ils imaginèrent l’histoire de Persée. Ils savaient qu’il était dit dans les prophéties citées plus haut : « Fort comme un géant qui s’élance dans la carrière », et ils racontèrent que le géant Hercule avait parcouru l’univers. Ils avaient appris aussi que, d’après les prophéties, le Christ devait guérir toutes les maladies et ressusciter les morts, et ils mirent en scène Asclépios.</p><p>LV. Mais jamais, dans leurs contrefaçons, ils n’ont attribué à aucun des prétendus fils de Zeus le supplice de la croix. Ils ne pouvaient en avoir l’idée, car, comme nous l’avons montré, tout ce qui avait été dit sur ce sujet était symbolique. C’est là, comme parle le prophète, le grand signe de la force et de la puissance du Christ. Vous en trouvez la preuve dans les objets qui tombent sous vos sens[115]. Réfléchissez, et voyez si rien dans le monde peut exister et former un tout sans ce signe. Peut-on fendre la mer, si ce trophée, sous la forme de la voile, ne s’élève intact sur le navire ? Peut-on labourer sans la croix ? Les pionniers, les manœuvres peuvent-ils travailler sans instruments qui affectent cette forme ? L’homme même ne diffère d’aspect des autres animaux que parce qu’il se tient droit et qu’il peut étendre les mains, que le nez, proéminent, organe de la respiration vitale, trace une croix au milieu du visage. Aussi le prophète a-t-il dit : « Le souffle de notre face est le Christ notre Seigneur. » Vous avez aussi des signes qui disent la puissance de la croix, je veux dire les étendards et les trophées qui précèdent partout vos armées. Sans que vous vous en doutiez, vous montrez que la croix est ainsi le signe de votre puissance et de votre force. Quand vos empereurs sont morts, c’est sous cette forme que vous consacrez leurs images et que vous les divinisez dans les inscriptions. Nous avons cherché à vous convaincre, autant qu’il nous a été possible, par ces arguments, en vous montrant la puissance de ce signe. Nous n’aurons rien à nous reprocher, si vous restez incrédules, car nous aurons fait notre devoir.</p><p>LVI. Les démons ne se contentèrent pas d’inventer avant la venue du Christ tous ces prétendus fils de Zeus. Après sa manifestation et son avènement parmi les hommes, sachant par les prophètes tout ce qui était annoncé à son sujet, et voyant qu’il était la foi et l’attente de toutes les nations, ils suscitèrent, comme nous l’avons dit plus haut, d’autres imposteurs, Simon et Ménandre de Samarie, qui, par les prestiges de la magie, séduisirent et maintiennent encore dans l’erreur beaucoup d’hommes. Nous l’avons déjà dit, Simon vint auprès de vous dans cette ville impériale de Rome sous Claude César. Il excita une telle admiration parmi le sénat et le peuple romain qu’on le prit pour un dieu et qu’on lui éleva une statue, comme aux autres dieux à qui on décerne cet honneur. Nous supplions donc avec vous le sacré sénat et votre peuple de prendre connaissance de notre requête, afin que si quelqu’un est attaché à ces fausses doctrines, il puisse reconnaître la vérité et échapper à l’erreur. Nous vous demandons aussi de vouloir bien détruire cette statue.</p><p>LVII. Jamais les démons ne parviendront à persuader que le supplice du feu n’est pas réservé aux impies, pas plus qu’ils n’ont pu cacher la venue du Christ. Tout ce qu’ils peuvent, c’est de pousser ceux qui vivent contrairement à la raison, ceux qui sont livrés à leurs passions et à leurs habitudes mauvaises, les esclaves de l’opinion, à nous haïr, à nous tuer. Quant à nous, nous ne les haïssons pas : mais, comme il est manifeste, nous avons pitié d’eux, nous ne désirons que leur repentir et leur conversion. La mort ne nous fait pas peur : tout le monde sait qu’il faut mourir, et dans ce monde il n’y a rien de nouveau : c’est toujours la même chose. Une seule année de jouissance amène la satiété de cette vie. Pour arriver à la vie éternelle sans souffrances et sans besoins, attachez-vous à notre doctrine. Si nos bourreaux croient qu’il n’y a plus rien après la mort, et que les morts perdent tout sentiment, c’est un service qu’ils nous rendent de nous délivrer des souffrances et des besoins d’ici-bas ; mais d’ailleurs ils n’en encourent pas moins le reproche de méchanceté, d’inhumanité et de sophistique ; car ce n’est pas pour nous délivrer qu’ils nous tuent, mais pour nous arracher la vie et le bonheur.</p><p>LVIII. Les démons suscitèrent, aussi, comme nous l’avons dit, Marcion du Pont, qui enseigne encore à présent, et nie le Dieu créateur du ciel et de la terre et le Christ son fils annoncé par les prophètes, pour prêcher un autre Dieu à côté du Dieu créateur de toutes choses et un autre fils. Beaucoup acceptent sa doctrine, comme la seule vraie et se moquent de nous. Ils ne peuvent rien prouver de ce qu’ils avancent, mais stupides comme des brebis enlevées par le loup, ils sont la proie de l’athéisme et des démons. Car le seul but des efforts de ces démons dont nous parlons est d’arracher les hommes à Dieu leur créateur et au Christ son premier-né. Ceux qui ne peuvent pas s’élever au-dessus de la terre, ils les ont cloués et les clouent aux choses terrestres et faites de main d’hommes : ceux qui se haussent jusqu’à la contemplation des choses divines, ils les détournent, s’ils ne mènent pas d’après la saine raison une vie pure et exempte de passions, et ils les jettent dans l’impiété.</p><p>LIX. C’est à nos docteurs, nous voulons dire à l’enseignement des prophètes, que Platon emprunte sa théorie, lorsqu’il enseigne que Dieu façonna la matière informe pour en faire le monde[116]. Pour vous en convaincre, écoutez les paroles mêmes de Moïse, le premier des prophètes, plus ancien que les écrivains de la Grèce, comme nous l’avons déjà dit. L’Esprit prophétique déclare par lui en ces termes comment et de quels éléments Dieu fit le monde à l’origine. « Au commencement, Dieu fit le ciel et la terre. La terre était invisible et informe et les ténèbres étaient sur l’abîme ; et l’esprit de Dieu était porté sur les eaux. Et Dieu dit : Que la lumière soit, et il en fut ainsi. » Le Verbe de Dieu tira donc le monde de cette matière dont parle Moïse ; c’est de lui que Platon et ses disciples l’ont appris, et nous avec eux ; vous pouvez vous en convaincre. Il n’y a pas jusqu’à l’Érèbe des poètes que nous ne trouvions chez Moïse.</p><p>LX. Platon, dans le <i>Timée</i>, cherche, d’après les principes naturels, ce qu’est le fils de Dieu et s’exprime ainsi : « Il l’a imprimé en X dans l’univers. » C’est à Moïse qu’il doit cette notion. Il est écrit en effet dans les livres de Moïse qu’en ce temps-là, lorsque les Israélites sortirent d’Égypte et traversèrent le désert, ils furent assaillis par des animaux venimeux, des vipères, des aspics et toutes sortes de serpents qui dévoraient le peuple. Par l’inspiration et l’ordre de Dieu, Moïse fit une croix d’airain qu’il dressa sur le tabernacle, en disant au peuple : « Regardez ce signe avec foi et par lui vous serez sauvés. » Il écrit qu’aussitôt après les serpents périrent, et il rapporte que le peuple échappa ainsi à la mort. Platon lut ce récit, mais sans bien le comprendre. Il ne vit pas que ce signe était une croix : il crut que c’était un X, et il dit qu’après Dieu, le premier principe, la seconde vertu était imprimée en X dans l’univers. S’il nomme aussi la troisième vertu, c’est que, comme nous l’avons dit plus haut, il avait lu dans Moïse que l’esprit de Dieu était porté sur les eaux. Il donne la seconde place au Verbe de Dieu, qu’il montre imprimé en X dans l’univers, et la troisième à l’esprit qui est représenté planant sur les eaux : « Les troisièmes, dit-il, sont autour du troisième ». Écoutez comment l’Esprit prophétique annonça aussi par Moïse la conflagration future. Il parle ainsi : « Le feu toujours vivant descendra et dévorera jusqu’au fond de l’abîme. » Ce n’est pas nous qui pensons comme les autres : ce sont les autres qui nous empruntent ce qu’ils disent. Chez nous, on peut entendre et apprendre ces choses de ceux mêmes qui ne connaissent pas les caractères de l’écriture, gens ignorants et barbares de langage, mais sages et fidèles d’esprit, même quand ils sont infirmes ou privés de la vue. Vous comprendrez que ce n’est pas ici l’œuvre de la sagesse humaine, mais de la puissance divine.</p><p>LXI. Nous vous exposerons maintenant comment, renouvelés par le Christ, nous nous consacrons à Dieu. Si nous omettions ce point dans notre exposition, nous paraîtrions être en faute. Ceux qui croient à la vérité de nos enseignements et de notre doctrine promettent d’abord de vivre selon cette doctrine. Alors nous leur apprenons à prier et à demander à Dieu, dans le jeûne, la rémission de leurs péchés, et nous-mêmes, nous prions et nous jeûnons avec eux. Ensuite, ils sont conduits par nous au lieu où est l’eau, et là, de la même manière que nous avons été régénérés nous-mêmes, ils sont régénérés à leur tour. Au nom de Dieu le père et le maître de toutes choses, et de Jésus-Christ, notre Sauveur, et du Saint-Esprit, ils sont alors lavés dans l’eau. Car le Christ a dit : « Si vous ne renaissez, vous n’entrerez pas dans le royaume des cieux. » Il est bien évident pour tout le monde que ceux qui sont nés une fois ne peuvent pas rentrer dans le sein de leur mère. Le prophète Isaïe, comme nous l’avons dit plus haut, enseigne de quelle manière les pécheurs repentants effaceront leurs péchés. Il s’exprime en ces termes : « Lavez-vous, purifiez-vous, enlevez le mal de vos cœurs, apprenez à bien faire, rendez justice à l’orphelin et défendez la veuve ; venez alors et comptons, dit le Seigneur. Vos péchés vous eussent-ils rendus rouges comme la pourpre, je vous rendrai blancs comme la laine ; fussiez-vous rouges comme l’écarlate, je vous rendrai blancs comme la neige. Mais si vous ne m’écoutez pas, le glaive vous dévorera. C’est la bouche du Seigneur qui a parlé. » Voici la doctrine que les apôtres nous ont transmise sur ce sujet. Dans notre première génération, nous naissons ignorants et selon la loi de la nécessité, d’une semence humide, dans l’union mutuelle de nos parents, et nous venons au monde avec des habitudes mauvaises et des inclinations perverses. Pour que nous ne restions pas ainsi les enfants de la nécessité et de l’ignorance, mais de l’élection et de la science, pour que nous obtenions la rémission de nos fautes passées, on invoque dans l’eau sur celui qui veut être régénéré et qui se repent de ses péchés le nom de Dieu le père et le maître de l’univers. Cette dénomination seule est précisément celle que prononce le ministre qui conduit au bain celui qui doit être lavé. Peut-on donner en effet un nom au Dieu ineffable, et ne serait-ce pas folie orgueilleuse que d’oser dire qu’il en a un ? Cette ablution s’appelle illumination, parce que ceux qui reçoivent cette doctrine ont l’esprit illuminé. Et aussi au nom de Jésus-Christ, qui fut crucifié sous Ponce-Pilate, et au nom de l’Esprit-Saint, qui prédit par les prophètes toute l’histoire de Jésus, est lavé celui qui est illuminé.</p><p>LXII. Les démons connaissaient les prophéties qui annonçaient cette ablution. Aussi voulurent-ils qu’on n’entrât dans leurs temples, et qu’on ne se présentât devant eux, pour leur offrir des libations et des sacrifices, qu’après s’être purifié ; bien plus, ils ordonnent qu’on prenne un bain pour aborder les sanctuaires où ils résident. Les prêtres ordonnent aussi de se déchausser à ceux qui entrent dans les temples pour y rendre un culte aux démons : c’est là une imitation de ce qui arriva au prophète Moïse, dont nous avons parlé. En ce temps-là que Moïse reçut l’ordre de descendre en Égypte et d’en faire sortir le peuple d’Israël (il gardait en Arabie les troupeaux de son oncle maternel), notre Christ, sous la forme du feu, lui parla du buisson et lui dit : « Quitte ta chaussure, approche et écoute. » Il s’approcha après avoir quitté sa chaussure, et reçut l’ordre de descendre en Égypte et d’en faire sortir le peuple d’Israël. Il fut investi de la vertu puissante du Christ qui lui avait parlé sous la forme du feu : il descendit et fit sortir le peuple, grâce à de grands et merveilleux prodiges, comme vous pouvez, si vous voulez, le lire dans ses ouvrages.</p><p>LXIII. Aujourd’hui encore, tous les Juifs prétendent que c’est le Dieu innommable qui a parlé à Moïse. C’est pourquoi, comme nous l’avons dit plus haut, l’Esprit prophétique les reprend en ces termes par le prophète Isaïe dont nous avons déjà parlé : « Le bœuf connaît son maître et l’âne l’étable de son maître, mais Israël ne m’a pas connu, et mon peuple ne m’a pas compris. » Jésus-Christ, de son côté, reproche également aux Juifs de ne connaître ni le Père ni le Fils, et il leur dit : « Personne ne connaît le Père, si ce n’est le Fils ; et personne ne connaît le Fils, si ce n’est le Père, et ceux à qui le Fils l’a révélé. » Le Fils est le Verbe de Dieu, nous l’avons dit. Il s’appelle aussi Ange et Apôtre ; car il annonce tout ce qu’il faut savoir, et il est envoyé pour signifier tout ce qui est annoncé. Notre Seigneur nous le dit lui-même : « Celui qui m’écoute écoute celui qui m’a envoyé. » C’est ce que prouvent aussi manifestement les livres de Moïse. Voici ce qu’on y lit : « L’Ange de Dieu parla à Moïse dans la flamme du feu de dedans le buisson et lui dit : Je suis celui qui est, le Dieu d’Abraham, le Dieu d’Isaac, le Dieu de Jacob, le Dieu de tes pères. Descends en Égypte et fais sortir mon peuple. » Vous pourrez voir ce qui suit dans ces mêmes livres, si vous le désirez ; nous ne pouvons tout rapporter ici. Ce que nous en avons dit était pour montrer que Jésus-Christ est Fils de Dieu et son Apôtre, étant d’abord Verbe et s’étant manifesté tantôt sous la forme du feu, tantôt sous une figure incorporelle : enfin, par la volonté de Dieu, il s’est fait homme pour sauver le genre humain, et il voulut bien souffrir tous les tourments que les démons inspirèrent à la fureur des Juifs. Les Juifs connaissaient les paroles expresses de Moïse : « L’Ange du Seigneur parla à Moïse dans la flamme du buisson ardent et lui dit : Je suis celui qui est, le Dieu d’Abraham, le Dieu d’Isaac, le Dieu de Jacob. » Et cependant ils prétendent que celui qui parle ainsi est le père et le créateur de l’univers. C’est ce que l’Esprit prophétique leur reproche en ces termes : « Israël ne m’a pas connu, et mon peuple ne m’a pas compris. » Et c’est pourquoi aussi, comme nous l’avons montré, Jésus étant au milieu d’eux, leur dit : « Personne ne connaît le Père, si ce n’est le Fils ; et personne ne connaît le Fils, si ce n’est le Père, et ceux à qui le Fils l’a révélé. » Les Juifs qui persistent à croire que c’est le père de l’univers qui a parlé à Moïse, tandis que c’est le Fils de Dieu, qui est appelé Ange et Apôtre, sont donc justement convaincus par l’Esprit prophétique, et par le Christ lui-même, de ne connaître ni le Père ni le Fils. Appeler le Fils Père, c’est prouver que l’on ne connaît pas le Père et que l’on ne sait pas que le Père de l’univers a un Fils, qui est Verbe, premier-né de Dieu, et Dieu. Il se manifesta d’abord sous la forme du feu et sous une figure incorporelle à Moïse et aux autres prophètes ; et maintenant, au temps de votre empire, comme nous l’avons dit, il s’est fait homme, il est né d’une vierge, suivant la volonté du Père, pour le salut de ceux qui croient en lui ; il voulut bien être compté pour rien et souffrir, afin de vaincre la mort par sa mort et sa résurrection. Les paroles que Moïse entendit sortir du buisson : « Je suis celui qui est, le Dieu d’Abraham, le Dieu d’Isaac, le Dieu de Jacob, le Dieu de tes pères, » prouvent que ces personnages existaient encore après leur mort, et qu’ils étaient les hommes du Christ. Les premiers de tous les hommes, ils s’occupèrent de chercher Dieu, Abraham, père d’Isaac, Isaac père de Jacob. C’est ce que rapporte Moïse.</p><p>LXIV. On élève auprès des sources la statue de la vierge qu’on appelle Coré, et dont on fait la fille de Zeus. C’est là une invention des démons et une imitation de ce qui est dit par Moïse. Vous pouvez vous en convaincre, d’après ce que nous avons rapporté. Comme nous l’avons dit, Moïse s’exprime ainsi : « Au commencement, Dieu fit le ciel et la terre. La terre était invisible et informe, et l’Esprit de Dieu était porté sur les eaux. » Coré, fille de Zeus, est une copie de cet Esprit de Dieu qui est représenté porté sur les eaux. La même malice leur a fait inventer Athéna, fille de Zeus, née sans le commerce de la génération. Ils savaient que Dieu avait d’abord conçu dans sa pensée le monde qu’il fit par son Verbe : ils appelèrent Athéna cette première conception. N’est-ce pas ridicule de donner une représentation du sexe féminin pour l’image de la pensée ? Il en est de même des autres prétendus fils de Zeus : leurs actions les condamnent.</p><p>LXV. Quant à nous, après avoir lavé celui qui croit et s’est adjoint à nous, nous le conduisons dans le lieu où sont assemblés ceux que nous appelons nos frères. Nous faisons avec ferveur des prières communes pour nous, pour l’illuminé, pour tous les autres, en quelque lieu qu’ils soient, afin d’obtenir, avec la connaissance de la vérité, la grâce de pratiquer la vertu et de garder les commandements, et de mériter ainsi le salut éternel. Quand les prières sont terminées, nous nous donnons le baiser de paix. Ensuite, on apporte à celui qui préside l’assemblée des frères du pain et une coupe d’eau et de vin trempé. Il les prend et loue et glorifie le père de l’univers par le nom du Fils et du Saint-Esprit, puis il fait une longue eucharistie pour tous les biens que nous avons reçus de lui. Quand il a terminé les prières et l’eucharistie, tout le peuple présent pousse l’exclamation : <i>Amen</i>. <i>Amen</i> est un mot hébreu qui signifie : ainsi soit-il. Lorsque celui qui préside a fait l’eucharistie, et que tout le peuple a répondu, les ministres que nous appelons diacres distribuent à tous les assistants le pain, le vin et l’eau consacrés, et ils en portent aux absents.</p><p>LXVI. Nous appelons cet aliment <i>Eucharistie</i>, et personne ne peut y prendre part, s’il ne croit à la vérité de notre doctrine, s’il n’a reçu le bain pour la rémission des péchés et la régénération, et s’il ne vit selon les préceptes du Christ. Car nous ne prenons pas cet aliment comme un pain commun et une boisson commune. De même que par la vertu du Verbe de Dieu, Jésus-Christ notre sauveur a pris chair et sang pour notre salut, ainsi l’aliment consacré par la prière formée des paroles du Christ, cet aliment qui doit nourrir par assimilation notre sang et nos chairs, est la chair et le sang de Jésus incarné : telle est notre doctrine. Les apôtres, dans leurs Mémoires, qu’on appelle Évangiles, nous rapportent que Jésus leur fit ces recommandations : il prit du pain, et ayant rendu grâces, il leur dit : « Faites ceci en mémoire de moi : ceci est mon corps. » Il prit de même le calice, et ayant rendu grâces, il leur dit : « Ceci est mon sang. » Et il les leur donna à eux seuls. Les mauvais démons ont imité cette institution dans les mystères de Mithra : on présente du pain et une coupe d’eau dans les cérémonies de l’initiation et on prononce certaines formules que vous savez ou que vous pouvez savoir.</p><p>LXVII. Après cela, dans la suite, nous renouvelons le souvenir de ces choses entre nous. Ceux qui ont du bien viennent en aide à tous ceux qui ont besoin, et nous nous prêtons mutuellement assistance. Dans toutes nos offrandes, nous bénissons le Créateur de l’univers par son Fils Jésus-Christ et par l’Esprit-Saint. Le jour qu’on appelle le jour du soleil, tous, dans les villes et à la campagne, se réunissent dans un même lieu : on lit les mémoires des apôtres et les écrits des prophètes, autant que le temps le permet. Quand le lecteur a fini, celui qui préside fait un discours pour avertir et pour exhorter à l’imitation de ces beaux enseignements. Ensuite nous nous levons tous et nous prions ensemble à haute voix. Puis, comme nous l’avons déjà dit, lorsque la prière est terminée, on apporte du pain avec du vin et de l’eau. Celui qui préside fait monter au ciel les prières et les eucharisties autant qu’il peut, et tout le peuple répond par l’acclamation <i>Amen</i>. Puis a lieu la distribution et le partage des choses consacrées à chacun et l’on envoie leur part aux absents par le ministère des diacres. Ceux qui sont dans l’abondance, et qui veulent donner, donnent librement chacun ce qu’il veut, et ce qui est recueilli est remis à celui qui préside, et il assiste les orphelins, les veuves, les malades, les indigents, les prisonniers, les hôtes étrangers, en un mot, il secourt tous ceux qui sont dans le besoin. Nous nous assemblons tous le jour du soleil, parce que c’est le premier jour, où Dieu, tirant la matière des ténèbres, créa le monde, et que, ce même jour, Jésus-Christ notre Sauveur ressuscita des morts. La veille du jour de Saturne, il fut crucifié, et le lendemain de ce jour, c’est-à-dire le jour du soleil, il apparut à ses apôtres et à ses disciples et leur enseigna cette doctrine, que nous avons soumise à votre examen.</p><p>LXVIII. S’il vous semble qu’elle soit conforme à la raison et à la vérité, prenez-la en considération. Si cela vous semble une bagatelle, traitez-le avec dédain, comme une bagatelle. Mais ne condamnez pas à mort, comme des ennemis, des hommes innocents. Car, nous vous le prédisons, vous n’échapperez pas au jugement futur de Dieu, si vous persévérez dans l’injustice. Quant à nous, nous nous écrierons[117] : « Que la volonté de Dieu soit faite ! »</p><p>Nous pourrions nous appuyer sur une lettre du très grand et très illustre César Hadrien, votre père, pour vous prier de nous faire juger, comme nous l’avons demandé. Nous n’avons pas voulu vous le demander, en invoquant le décret d’Hadrien ; mais parce que nous avons conscience de la justice de notre cause, nous vous adressons cette requête et cet exposé. Cependant nous y joignons une copie de la lettre d’Hadrien, afin que sur ce point aussi vous sachiez que nous disons la vérité. Voici cette copie :</p><p>J’ai reçu une lettre de Serenius Granianus, clarissime, votre prédécesseur. Le fait me semble de nature à demander une enquête pour éviter les troubles et ne pas laisser le champ aux entreprises mauvaises des calomniateurs. Si les habitants de votre province peuvent soutenir avec vraisemblance leur requête contre les chrétiens, et répondre à la barre du tribunal, qu’ils se tournent vers ce moyen seulement, mais qu’ils s’abstiennent de prières et de simples cris. Il est bien plus convenable, s’il y a une accusation intentée, que vous en connaissiez. Si les chrétiens sont accusés et convaincus de faute contre les lois, punissez-les selon la gravité du délit. Mais, par Hercule, si ce n’est qu’un prétexte à calomnie, faites une enquête sur cette criminelle conduite, et voyez à en faire bonne justice.</p>
