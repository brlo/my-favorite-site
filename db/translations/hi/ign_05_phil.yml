      <ol><li><p>स्मुरना से चलकर इग्नाटियस त्रोआस पहुँचे, और वहाँ से उन्होंने लुदिया के फिलदिलफिया (देखें <a href="https://bibleox.com/hi/hi-ov/otkr/3/#L7">प्रका 3:7</a>) की कलीसिया को यह पत्र लिखा, जिसके नगर से होकर वे गुज़रे थे (<a href="#HH-11">11:2</a>)। वे बिशप की आज्ञा मानने और फूट से बचने (अध्याय 1–4), सुसमाचार में यहूदी मत न मिलाने (अध्याय 5–9) का उपदेश देते हैं, और शान्ति पाई हुई अन्ताकिया को दूत भेजने का निवेदन करते हैं (अध्याय 10–11)।</p></li><li><p>अर्थात् मसीह में, जिसने अपने लहू से हमें छुड़ाया और प्रेम के बन्धन से हमें एक किया।</p></li><li><p>देखें <a href="https://bibleox.com/hi/hi-ov/gal/1/#L1">गला 1:1</a>।</p></li><li><p>देखें <a href="https://bibleox.com/hi/hi-ov/mf/7/#L15">मत्ती 7:15</a>, <a href="https://bibleox.com/hi/hi-ov/in/10/#L12">यूह 10:12</a>।</p></li><li><p>देखें <a href="https://bibleox.com/hi/hi-ov/mf/15/#L13">मत्ती 15:13</a>, <a href="https://bibleox.com/hi/hi/w/Ig3T_त्रालेस_की_कलीसिया_के_नाम_पत्र#HH-11">«त्रालेस की कलीसिया के नाम पत्र» 11:1</a>।</p></li><li><p>ἀποδιϋλισμός — “छानना”। झूठी शिक्षा माननेवालों का अलग हो जाना इग्नाटियस को ऐसा लगता है मानो कलीसिया पराए खर-पतवार से छानकर शुद्ध की गई हो।</p></li><li><p>देखें <a href="https://bibleox.com/hi/hi-ov/1kor/6/#L9-10">1 कुरि 6:9-10</a>, <a href="https://bibleox.com/hi/hi/w/Ig3E_इफिसुस_की_कलीसिया_के_नाम_पत्र#HH-16">«इफिसुस की कलीसिया के नाम पत्र» 16:1</a>।</p></li><li><p>मसीह ने अपने दुःखभोग से कलीसिया को स्थापित किया, इसलिए जो कलीसिया की एकता तोड़ता है वह उस दुःखभोग के विरुद्ध जाता है।</p></li><li><p>देखें <a href="https://bibleox.com/hi/hi-ov/1kor/10/#L16-17">1 कुरि 10:16-17</a>।</p></li><li><p>ἀναπάρτιστος — “अभी सिद्ध नहीं हुआ”। यह लम्बे संस्करण तथा प्राचीन लातीनी और आर्मेनियाई अनुवादों के अनुसार पाठ है।</p></li><li><p>अर्थात् सुसमाचार की शरण ऐसे, मानो उसमें मसीह स्वयं शरीर में उपस्थित हो; और प्रेरितों की ऐसे, मानो वे अब भी जीवित होकर कलीसिया का पुरोहित-मण्डल हों।</p></li><li><p>देखें <a href="https://bibleox.com/hi/hi-ov/lk/24/#L25-27">लूका 24:25-27</a>।</p></li><li><p>देखें <a href="https://bibleox.com/hi/hi-ov/2kor/11/#L9">2 कुरि 11:9</a>, <a href="https://bibleox.com/hi/hi-ov/2kor/12/#L13">2 कुरि 12:13</a>।</p></li><li><p>देखें <a href="https://bibleox.com/hi/hi/w/Ig3T_त्रालेस_की_कलीसिया_के_नाम_पत्र#HH-12">«त्रालेस की कलीसिया के नाम पत्र» 12:3</a>।</p></li><li><p>देखें <a href="https://bibleox.com/hi/hi-ov/in/3/#L8">यूह 3:8</a>।</p></li><li><p>देखें <a href="https://bibleox.com/hi/hi-ov/1kor/2/#L10">1 कुरि 2:10</a>।</p></li><li><p>देखें <a href="https://bibleox.com/hi/hi-ov/1kor/3/#L16-17">1 कुरि 3:16-17</a>, <a href="https://bibleox.com/hi/hi-ov/1kor/6/#L19">6:19</a>।</p></li><li><p>κατ᾽ ἐριθείαν — “विरोध या दलबन्दी के भाव से”। देखें <a href="https://bibleox.com/hi/hi-ov/fil/2/#L3">फिलि 2:3</a>।</p></li><li><p>ἀρχεῖα — “अभिलेख, दस्तावेज़”; यहाँ पुराना नियम। यहूदी मत से प्रभावित लोग माँग करते थे कि मसीह के जन्म और दुःखभोग के विषय में सुसमाचार का सत्य पुरानी भविष्यवाणियों से सिद्ध किया जाए।</p></li><li><p>πρόκειται — “यही तो प्रश्न है, यही सिद्ध करना है”।</p></li><li><p>मसीह के द्वारा लाया गया विश्वास, अर्थात् मसीह की शिक्षा।</p></li><li><p>याजकों से अभिप्राय पुराने नियम के याजक, और महायाजक से मसीह (देखें <a href="https://bibleox.com/hi/hi-ov/evr/4/#L14">इब्रा 4:14</a>, <a href="https://bibleox.com/hi/hi-ov/evr/9/#L7">इब्रा 9:7</a>)।</p></li><li><p>देखें <a href="https://bibleox.com/hi/hi-ov/in/10/#L7">यूह 10:7</a>, <a href="https://bibleox.com/hi/hi-ov/in/10/#L9">10:9</a>।</p></li><li><p>χειροτονῆσαι — मूल अर्थ “हाथ उठाकर (चुनना)”; यहाँ मण्डली द्वारा दूत चुनने के लिए। बाद में यह शब्द अभिषेक (हाथ रखकर नियुक्ति) का कलीसियाई शब्द बन गया।</p></li><li><p>देखें <a href="https://bibleox.com/hi/hi-ov/1sol/5/#L23">1 थिस्स 5:23</a>।</p></li></ol>
      <p>अनुवाद: रोडियन व्लासोव (एआई उपकरणों की सहायता से)। मूल पाठ: यूनानी मूल (<a href="https://bibleox.com/hi/grc/w/ΙγνΘ_Φιλ">इस साइट का यूनानी संस्करण</a>; स्पष्ट छूटे हुए अंश लाइटफुट और होम्स के संस्करणों से पूरे किए गए)। सहायक अनुवाद: रूसी अनुवाद («प्रारम्भिक कलीसियाई पिता», ब्रसेल्स, 1988), अंग्रेज़ी अनुवाद (Roberts–Donaldson), फ़्रांसीसी अनुवाद (Genoude, 1837)। बाइबल के उद्धरण और लिंक हिन्दी O.V. के अनुसार।</p>
