    body: |-
      <h2>0</h2><p>इग्नाटियस, जिसे थियोफोरस[1] भी कहते हैं, आसिया के फिलदिलफिया में स्थित पिता परमेश्वर और प्रभु यीशु मसीह की कलीसिया को, जिस पर दया हुई है, जो परमेश्वर की एकमनता में स्थिर है, जो हमारे प्रभु के दुःखभोग में बिना सन्देह आनन्दित है और उसके पुनरुत्थान के कारण हर दया में पूरा निश्चय रखती है: मैं यीशु मसीह के लहू में इसे नमस्कार कहता हूँ[2], जो सदा का और स्थायी आनन्द है—विशेषकर तब, जब लोग बिशप के साथ, और उसके साथ के पुरोहितों और डीकनों के साथ, जो यीशु मसीह की इच्छा के अनुसार नियुक्त किए गए हैं, एक हों; जिन्हें प्रभु ने अपनी इच्छा से अपने पवित्र आत्मा के द्वारा दृढ़ किया है।</p>
      <h2>1</h2><p>1. मैं जानता हूँ कि तुम्हारे बिशप ने सारी मण्डली की यह सेवा न अपने आप से पाई, न मनुष्यों के द्वारा[3], न व्यर्थ महिमा के लिए, परन्तु पिता परमेश्वर और प्रभु यीशु मसीह के प्रेम में पाई। उसकी कोमलता देखकर मैं चकित हूँ; वह चुप रहकर भी उनसे अधिक कर सकता है जो व्यर्थ बातें करते हैं।</p><p>2. वह आज्ञाओं के साथ ऐसा मेल खाता है जैसे वीणा अपने तारों के साथ। इसलिए मेरा प्राण परमेश्वर की ओर उसके मन को धन्य कहता है, क्योंकि मैंने जाना है कि वह सद्गुणी और सिद्ध है; जीवित परमेश्वर की सारी कोमलता में उसकी अडिगता और उसका क्रोध न करना मैंने पहचाना है।</p>
      <h2>2</h2><p>1. इसलिए, हे सत्य की ज्योति की सन्तानो, फूट और बुरी शिक्षाओं से भागो; जहाँ चरवाहा है, वहाँ भेड़ों के समान उसके पीछे चलो।</p><p>2. क्योंकि बहुत से विश्वासयोग्य दिखनेवाले भेड़िये[4] बुरे सुख के द्वारा परमेश्वर की ओर दौड़नेवालों को बन्दी बना लेते हैं; परन्तु तुम्हारी एकता में उन्हें स्थान न मिलेगा।</p>
      <h2>3</h2><p>1. उन बुरे पौधों से दूर रहो, जिन्हें यीशु मसीह नहीं उगाता, क्योंकि वे पिता के लगाए हुए नहीं[5]। यह नहीं कि मैंने तुम्हारे बीच फूट पाई, परन्तु छनकर शुद्ध होना पाया[6]।</p><p>2. क्योंकि जितने परमेश्वर के और यीशु मसीह के हैं, वे बिशप के साथ हैं; और जितने मन फिराकर कलीसिया की एकता में आएँगे, वे भी परमेश्वर के होंगे, ताकि यीशु मसीह के अनुसार जीवन बिताएँ।</p><p>3. हे मेरे भाइयो, धोखा न खाओ: यदि कोई फूट डालनेवाले के पीछे चलता है, तो वह परमेश्वर के राज्य का वारिस नहीं होगा[7]; यदि कोई पराए मत पर चलता है, तो वह (मसीह के) दुःखभोग से सहमत नहीं[8]।</p>
      <h2>4</h2><p>इसलिए यत्न करो कि एक ही यूखरिस्त में सहभागी हो। क्योंकि हमारे प्रभु यीशु मसीह का शरीर एक ही है, और उसके लहू की एकता के लिए कटोरा भी एक ही है[9], वेदी एक ही है; वैसे ही बिशप भी एक ही है, पुरोहित-मण्डल और मेरे संगी दास डीकनों के साथ; ताकि जो कुछ तुम करो, परमेश्वर के अनुसार करो।</p>
      <h2>5</h2><p>1. हे मेरे भाइयो, तुम्हारे प्रति प्रेम में मैं पूरी तरह उण्डेला जा रहा हूँ, और बड़े आनन्द से तुम्हें दृढ़ करता हूँ—मैं नहीं, परन्तु यीशु मसीह; उसी में बँधा हुआ मैं और अधिक डरता हूँ, क्योंकि अभी सिद्ध नहीं हुआ[10]। परन्तु तुम्हारी प्रार्थना मुझे परमेश्वर के सम्मुख सिद्ध करेगी, ताकि मैं उस भाग को पाऊँ जिसमें मुझ पर दया हुई है; मैं सुसमाचार की शरण लेता हूँ जैसे यीशु के शरीर की, और प्रेरितों की जैसे कलीसिया के पुरोहित-मण्डल की[11]।</p><p>2. आओ, हम भविष्यद्वक्ताओं से भी प्रेम करें, क्योंकि उन्होंने भी सुसमाचार की घोषणा की, उस पर आशा रखी और उसकी बाट जोही[12]; उस पर विश्वास करके वे उद्धार पाए, यीशु मसीह की एकता में रहकर; वे प्रेम और आदर के योग्य पवित्र जन हैं, जिनकी गवाही यीशु मसीह ने दी, और जो हमारी साझी आशा के सुसमाचार में गिने गए।</p>
      <h2>6</h2><p>1. यदि कोई तुम्हें यहूदी मत की व्याख्या सुनाए, तो उसकी न सुनो। क्योंकि खतना किए हुए मनुष्य से मसीहियत सुनना, खतनारहित से यहूदी मत सुनने से अच्छा है। परन्तु यदि ये दोनों यीशु मसीह के विषय में न बोलें, तो मेरे लिए वे समाधि-स्तम्भ और मुर्दों की कब्रें हैं, जिन पर केवल मनुष्यों के नाम लिखे हैं।</p><p>2. इसलिए इस संसार के सरदार की चालों और फन्दों से भागो, कहीं ऐसा न हो कि उसकी युक्ति से दबकर तुम प्रेम में दुर्बल हो जाओ; परन्तु सब अविभाजित मन से एक साथ इकट्ठे हो।</p><p>3. मैं अपने परमेश्वर का धन्यवाद करता हूँ कि तुम्हारे विषय में मेरा विवेक शुद्ध है, और कोई न छिपकर न खुलकर यह घमण्ड कर सकता है कि मैंने छोटी या बड़ी बात में किसी पर बोझ डाला[13]। और जिन सब से मैंने बातें कीं, उनके लिए प्रार्थना करता हूँ कि वह उनके विरुद्ध गवाही न बने[14]।</p>
      <h2>7</h2><p>1. यदि कुछ लोगों ने शरीर के अनुसार मुझे धोखा देना चाहा भी, तो आत्मा धोखा नहीं खाता, क्योंकि वह परमेश्वर से है। वह जानता है कि कहाँ से आता है और कहाँ जाता है[15], और गुप्त बातों को प्रगट करता है[16]। जब मैं तुम्हारे बीच था, तब मैंने पुकारा, ऊँचे स्वर से, परमेश्वर के स्वर से कहा: “बिशप, पुरोहित-मण्डल और डीकनों की ओर ध्यान दो।”</p><p>2. कुछ लोगों ने सन्देह किया कि मैंने यह इसलिए कहा कि मुझे कुछ लोगों की फूट का पहले से पता था। परन्तु वह मेरा गवाह है, जिसके लिए मैं बँधा हूँ, कि मैंने मानवीय शरीर से यह नहीं जाना। आत्मा ही ने यह घोषणा की: “बिशप के बिना कुछ न करो; अपने शरीर को परमेश्वर के मन्दिर के समान रखो[17]; एकता से प्रेम करो; फूट से भागो; यीशु मसीह का अनुकरण करनेवाले बनो, जैसा वह अपने पिता का था।”</p>
      <h2>8</h2><p>1. इसलिए मैंने एकता के लिए तैयार किए गए मनुष्य के समान अपना काम किया। जहाँ फूट और क्रोध है, वहाँ परमेश्वर वास नहीं करता। परन्तु प्रभु सब मन फिरानेवालों को क्षमा करता है, यदि वे मन फिराकर परमेश्वर की एकता और बिशप की सभा में लौट आएँ। मुझे यीशु मसीह के अनुग्रह पर विश्वास है कि वह तुम्हारे सब बन्धन खोल देगा।</p><p>2. मैं तुमसे विनती करता हूँ कि कोई काम विरोध के भाव से न करो[18], परन्तु मसीह से सीखी हुई बात के अनुसार करो। क्योंकि मैंने कुछ लोगों को कहते सुना: “यदि मैं उसे पुराने अभिलेखों[19] में न पाऊँ, तो सुसमाचार में भी विश्वास नहीं करता।” और जब मैंने उनसे कहा, “लिखा है,” तो उन्होंने उत्तर दिया, “यही तो सिद्ध करना है।”[20] परन्तु मेरे लिए पुराने अभिलेख यीशु मसीह है; अटल अभिलेख उसका क्रूस, उसकी मृत्यु, उसका पुनरुत्थान और उसके द्वारा आया विश्वास है[21]। इन्हीं में मैं तुम्हारी प्रार्थना से धर्मी ठहरना चाहता हूँ।</p>
      <h2>9</h2><p>1. याजक भी अच्छे हैं, परन्तु वह महायाजक उत्तम है जिसे परमपवित्र स्थान सौंपा गया[22]; केवल उसी को परमेश्वर की गुप्त बातें सौंपी गई हैं। वही पिता का द्वार है[23], जिससे इब्राहीम, इसहाक और याकूब, भविष्यद्वक्ता, प्रेरित और कलीसिया भीतर जाते हैं। ये सब परमेश्वर की एकता की ओर हैं।</p><p>2. परन्तु सुसमाचार में कुछ विशेष है: उद्धारकर्ता, हमारे प्रभु यीशु मसीह का आगमन, उसका दुःखभोग और पुनरुत्थान। क्योंकि प्रिय भविष्यद्वक्ताओं ने उसकी घोषणा की, पर सुसमाचार अविनाशिता की पूर्णता है। यदि तुम प्रेम में विश्वास करो, तो सब कुछ मिलकर अच्छा है।</p>
      <h2>10</h2><p>1. तुम्हारी प्रार्थना और उस करुणा के कारण जो मसीह यीशु में तुम रखते हो, मुझे समाचार मिला है कि सीरिया के अन्ताकिया की कलीसिया में शान्ति है। इसलिए तुम्हारे लिए, परमेश्वर की कलीसिया होने के नाते, उचित है कि एक डीकन को चुनो[24], ताकि वह वहाँ परमेश्वर का दूत होकर जाए, और इकट्ठे हुए लोगों के साथ आनन्द मनाए और नाम की महिमा करे।</p><p>2. यीशु मसीह में धन्य है वह जो ऐसी सेवा के योग्य ठहराया जाएगा; और तुम भी महिमा पाओगे।</p><p>3. यदि तुम चाहो, तो परमेश्वर के नाम के लिए यह असम्भव नहीं; जैसे निकटतम कलीसियाओं ने बिशपों को, और दूसरों ने पुरोहितों और डीकनों को भेजा है।</p>
      <h2>11</h2><p>1. किलिकिया के डीकन फिलो के विषय में, जो सुनाम मनुष्य है और अब भी चुने हुए जन रेउस अगाथोपुस के साथ परमेश्वर के वचन में मेरी सेवा करता है—अगाथोपुस संसार का जीवन त्यागकर सीरिया से मेरे पीछे आया है—वे तुम्हारे विषय में भी गवाही देते हैं; और मैं भी तुम्हारे लिए परमेश्वर का धन्यवाद करता हूँ कि तुमने उन्हें ऐसे ग्रहण किया जैसे प्रभु ने तुम्हें। परन्तु जिन्होंने उनका निरादर किया, वे यीशु मसीह के अनुग्रह में छुटकारा पाएँ।</p><p>2. त्रोआस के भाइयों का प्रेम तुम्हें नमस्कार कहता है; मैं वहीं से बुर्रुस के हाथ तुम्हें लिख रहा हूँ, जिसे इफिसियों और स्मुरनावासियों ने आदर के चिह्न के रूप में मेरे साथ भेजा। प्रभु यीशु मसीह उनका आदर करेगा, जिस पर वे शरीर, प्राण और आत्मा में[25], विश्वास, प्रेम और एकमनता में आशा रखते हैं। हमारी साझी आशा मसीह यीशु में तुम्हारा कल्याण हो।</p>
