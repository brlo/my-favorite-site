</li><li><p>अर्थात् स्वर्गदूतों के पदों समेत स्वर्गीय शक्तियाँ।</p></li><li><p>देखें <a href="https://bibleox.com/hi/hi-ov/mf/19/#L12">मत्ती 19:12</a>।</p></li><li><p>डोसेटिस्ट नहीं मानते थे कि यूखरिस्त दुःख उठानेवाला और पिता द्वारा जिलाया गया मसीह का सच्चा शरीर है। यह मानना कि यूखरिस्त मसीह के शरीर का “प्रतीक” है, सबके लिए सम्भव था; वे इसी बात का इन्कार करते थे कि वह सच्चा शरीर है (देखें <a href="https://bibleox.com/hi/hi-ov/in/6/#L54">यूह 6:54</a>)।</p></li><li><p>ἀγαπᾶν। शब्दशः “प्रेम करना”, परन्तु यहाँ इसे यूखरिस्त से जुड़े “प्रेम-भोज (अगापे) को मानना” के अर्थ में लिया गया है। प्रसंग यूखरिस्त का है; और “ताकि वे भी जी उठें” — यह उद्देश्य प्रभु के उस वचन से मेल खाता है कि जो उसका मांस खाता और लहू पीता है, उसे वह अन्तिम दिन जिलाएगा (<a href="https://bibleox.com/hi/hi-ov/in/6/#L54">यूह 6:54</a>)। और यही शब्द <a href="#HH-8">8:2</a> में उस प्रेम-भोज के लिए आया है जिसे बिशप की अनुमति के बिना करना उचित नहीं; यह कहना कि बिशप की अनुमति के बिना “प्रेम करना” उचित नहीं, अर्थहीन होगा, इसलिए वहाँ स्पष्ट रूप से प्रेम-भोज ही है।</p></li><li><p>ἡ καθολικὴ ἐκκλησία — “सार्वभौमिक, सम्पूर्ण कलीसिया”। उपलब्ध साहित्य में यह शब्द-समूह यहाँ पहली बार आता है। नीकिया-कुस्तुन्तुनिया के विश्वास-वचन में “एक, पवित्र, काथलिक (सार्वभौमिक) और प्रेरितिक कलीसिया” में यही शब्द है।</p></li><li><p>ἀγάπην ποιεῖν — “प्रेम-भोज (अगापे) करना”: उस समय रोटी तोड़ने (यूखरिस्त) से जुड़ा कलीसिया का सामूहिक भोजन (देखें <a href="https://bibleox.com/hi/hi-ov/iud/1/#L12">यहू 1:12</a> “प्रेम सभाओं”)।</p></li><li><p>ἀντίψυχον। देखें <a href="https://bibleox.com/hi/hi/w/Ig3E_इफिसुस_की_कलीसिया_के_नाम_पत्र#HH-21">«इफिसुस की कलीसिया के नाम पत्र» 21:1</a> की टिप्पणी।</p></li><li><p>देखें <a href="https://bibleox.com/hi/hi-ov/2tim/1/#L16">2 तीमु 1:16</a>।</p></li><li><p>θεοπρεσβευτής — “परमेश्वर का दूत”। χειροτονῆσαι (चुनना) के लिए देखें <a href="https://bibleox.com/hi/hi/w/Ig3F_फिलदिलफिया_की_कलीसिया_के_नाम_पत्र#HH-10">«फिलदिलफिया की कलीसिया के नाम पत्र» 10:1</a> की टिप्पणी।</p></li><li><p>देखें <a href="https://bibleox.com/hi/hi-ov/fil/3/#L15">फिलि 3:15</a>।</p></li><li><p>यह दिखाता है कि कलीसिया में विधवाओं के रूप में दर्ज और सेवा करनेवाली स्त्रियों में कुँवारियाँ भी थीं (देखें <a href="https://bibleox.com/hi/hi-ov/1tim/5/#L3-10">1 तीमु 5:3-10</a>)।</p></li></ol>
      <p>अनुवाद: रोडियन व्लासोव (एआई उपकरणों की सहायता से)। मूल पाठ: यूनानी मूल (<a href="https://bibleox.com/hi/grc/w/ΙγνΘ_Σμ">इस साइट का यूनानी संस्करण</a>; स्पष्ट छूटे हुए अंश लाइटफुट और होम्स के संस्करणों से पूरे किए गए)। सहायक अनुवाद: रूसी अनुवाद («प्रारम्भिक कलीसियाई पिता», ब्रसेल्स, 1988), अंग्रेज़ी अनुवाद (Roberts–Donaldson), फ़्रांसीसी अनुवाद (Genoude, 1837)। बाइबल के उद्धरण और लिंक हिन्दी O.V. के अनुसार।</p>
