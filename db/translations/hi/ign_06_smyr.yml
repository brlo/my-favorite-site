    body: |-
      <h2>0</h2><p>इग्नाटियस, जिसे थियोफोरस[1] भी कहते हैं, पिता परमेश्वर और प्रिय यीशु मसीह की उस कलीसिया को, जिस पर हर वरदान में दया हुई है, जो विश्वास और प्रेम से भरी है, जिसे किसी वरदान की घटी नहीं, जो परमेश्वर के अति योग्य है और पवित्र वस्तुओं को धारण करती है, और आसिया के स्मुरना में है: निर्दोष आत्मा और परमेश्वर के वचन में बहुत-बहुत आनन्द।</p>
      <h2>1</h2><p>1. मैं यीशु मसीह परमेश्वर की महिमा करता हूँ, जिसने तुम्हें ऐसा बुद्धिमान बनाया। क्योंकि मैंने देखा कि तुम अटल विश्वास में सिद्ध हो, मानो शरीर और आत्मा दोनों में प्रभु यीशु मसीह के क्रूस पर कीलों से जड़े गए हो, और मसीह के लहू के द्वारा प्रेम में स्थिर हो; हमारे प्रभु के विषय में तुम पूरा निश्चय रखते हो कि वह शरीर के अनुसार सचमुच दाऊद के कुल का है[2], परमेश्वर की इच्छा और सामर्थ्य के अनुसार परमेश्वर का पुत्र है, सचमुच एक कुँवारी से जन्मा, और यूहन्ना से बपतिस्मा लिया ताकि “सारी धार्मिकता पूरी हो”[3];</p><p>2. पुन्तियुस पिलातुस और चौथाई देश के राजा हेरोदेस[4] के समय हमारे लिए सचमुच शरीर में कीलों से जड़ा गया—उसी फल से, अर्थात् उसके परमेश्वर-धन्य दुःखभोग से, हम हैं—ताकि वह अपने पुनरुत्थान के द्वारा युगानुयुग के लिए अपने पवित्र और विश्वासी लोगों के लिए, चाहे यहूदियों में हों या अन्यजातियों में, अपनी कलीसिया की एक ही देह में[5] एक झण्डा खड़ा करे[6]।</p>
      <h2>2</h2><p>उसने ये सब दुःख हमारे लिए उठाए, ताकि हम उद्धार पाएँ; और जैसे उसने सचमुच दुःख उठाया, वैसे ही उसने सचमुच अपने आप को जिलाया भी; ऐसा नहीं जैसा कुछ अविश्वासी कहते हैं कि उसने केवल दिखावे में दुःख उठाया[7]—वे स्वयं ही केवल दिखावा हैं; और जैसा वे सोचते हैं, वैसा ही उनके साथ होगा: वे बिना देह के, दुष्टात्माओं के समान हो जाएँगे।</p>
      <h2>3</h2><p>1. क्योंकि मैं जानता हूँ और विश्वास करता हूँ कि पुनरुत्थान के बाद भी वह शरीर में था।</p><p>2. और जब वह पतरस और उसके साथियों के पास आया, तो उनसे कहा: “मुझे छूकर देखो कि मैं बिना देह की दुष्टात्मा नहीं हूँ।”[8] और उन्होंने तुरन्त उसे छुआ और विश्वास किया, उसके शरीर और आत्मा से जुड़ गए। इसी कारण उन्होंने मृत्यु को तुच्छ जाना, और मृत्यु से ऊपर पाए गए।</p><p>3. और पुनरुत्थान के बाद उसने देहधारी के समान उनके साथ खाया-पिया[9], यद्यपि आत्मा में वह पिता के साथ एक था।</p>
      <h2>4</h2><p>1. हे प्रियो, मैं तुम्हें ये बातें इसलिए समझाता हूँ कि जानता हूँ कि तुम भी ऐसे ही हो। परन्तु मैं तुम्हें मनुष्य-रूपी पशुओं से पहले से सावधान करता हूँ; उन्हें ग्रहण करना तो दूर, हो सके तो उनसे मिलना भी नहीं; केवल उनके लिए प्रार्थना करो, कि किसी प्रकार वे मन फिराएँ—जो कठिन है; परन्तु हमारे सच्चे जीवन यीशु मसीह को इसका अधिकार है।</p><p>2. क्योंकि यदि ये काम हमारे प्रभु ने केवल दिखावे में किए, तो मैं भी केवल दिखावे में बँधा हूँ। फिर मैंने क्यों अपने आप को मृत्यु, आग, तलवार और पशुओं के हवाले किया? परन्तु तलवार के पास होना परमेश्वर के पास होना है, पशुओं के बीच होना परमेश्वर के बीच होना है—केवल यीशु मसीह के नाम में। उसके साथ दुःख उठाने के लिए मैं सब कुछ सहता हूँ, और वह, जो सिद्ध मनुष्य बना[10], मुझे सामर्थ्य देता है।</p>
      <h2>5</h2><p>1. कुछ लोग अज्ञानता से उसका इन्कार करते हैं, बल्कि वे ही उसके द्वारा अस्वीकार किए गए[11]; वे सत्य के नहीं, मृत्यु के वकील हैं। उन्हें न भविष्यद्वाणियों ने, न मूसा की व्यवस्था ने, न अब तक सुसमाचार ने, और न हम में से हर एक के दुःखों ने कायल किया।</p><p>2. क्योंकि वे हमारे विषय में भी ऐसा ही सोचते हैं[12]। यदि कोई मेरी प्रशंसा करे पर मेरे प्रभु की निन्दा करे, यह न मानकर कि वह देहधारी है, तो इससे मुझे क्या लाभ? जो ऐसा कहता है, उसने उसका पूरी रीति से इन्कार किया है, और वह स्वयं लाश ढोनेवाला है[13]।</p><p>3. उनके नाम, जो अविश्वासी हैं, लिखना मुझे उचित नहीं लगा। हाँ, जब तक वे दुःखभोग की ओर—जो हमारा पुनरुत्थान है—मन न फिराएँ, तब तक मैं उनका स्मरण भी न करूँ।</p>
      <h2>6</h2><p>1. कोई धोखा न खाए: स्वर्गीय वस्तुएँ, स्वर्गदूतों की महिमा, और दृश्य तथा अदृश्य प्रधान[14] भी, यदि मसीह के लहू पर विश्वास न करें, तो उनका भी न्याय होगा। “जो ग्रहण कर सकता है, वह ग्रहण करे।”[15] कोई पद के कारण न फूले; क्योंकि सब कुछ विश्वास और प्रेम है, जिनसे बढ़कर कुछ नहीं।</p><p>2. उन्हें ध्यान से देखो जो हम पर आए यीशु मसीह के अनुग्रह के विषय में अलग मत रखते हैं, कि वे परमेश्वर की इच्छा के कैसे विरोधी हैं। उन्हें प्रेम की कोई चिन्ता नहीं—न विधवा की, न अनाथ की, न सताए हुए की, न बन्दी या छूटे हुए की, न भूखे या प्यासे की।</p>
      <h2>7</h2><p>1. वे यूखरिस्त और प्रार्थना से दूर रहते हैं, क्योंकि वे नहीं मानते कि यूखरिस्त हमारे उद्धारकर्ता यीशु मसीह का वह शरीर है जिसने हमारे पापों के लिए दुःख उठाया और जिसे पिता ने अपनी भलाई से जिलाया[16]। इस प्रकार परमेश्वर के वरदान का विरोध करनेवाले अपने विवादों में मर जाते हैं। उनके लिए अच्छा होता कि वे प्रेम-भोज (अगापे) को मानते[17], ताकि वे भी जी उठते।</p><p>2. ऐसे लोगों से दूर रहना उचित है, और न अकेले में और न सबके सामने उनके विषय में बात करना; परन्तु भविष्यद्वक्ताओं पर, और विशेषकर सुसमाचार पर ध्यान देना, जिसमें दुःखभोग हम पर प्रगट हुआ और पुनरुत्थान पूरा हुआ। फूट से, बुराइयों की जड़ जानकर, भागो।</p>
      <h2>8</h2><p>1. तुम सब बिशप के पीछे ऐसे चलो जैसे यीशु मसीह पिता के, और पुरोहित-मण्डल के पीछे ऐसे जैसे प्रेरितों के; और डीकनों का ऐसे आदर करो जैसे परमेश्वर की आज्ञा का। बिशप के बिना कोई कलीसिया से सम्बन्धित कोई काम न करे। वही यूखरिस्त विश्वसनीय मानी जाए जो बिशप के अधीन हो, या उसके द्वारा जिसे वह स्वयं अनुमति दे।</p><p>2. जहाँ बिशप दिखाई दे, वहाँ जनसमूह भी हो; जैसे जहाँ यीशु मसीह है, वहाँ काथलिक (सार्वभौमिक) कलीसिया[18] है। बिशप के बिना न बपतिस्मा देना उचित है, न प्रेम-भोज (अगापे) करना[19]; परन्तु जिसे वह स्वीकार करे, वही परमेश्वर को भी भाता है, ताकि जो कुछ तुम करो वह सुरक्षित और पक्का हो।</p>
      <h2>9</h2><p>1. यह उचित है कि हम अब होश में आएँ, जब तक हमारे पास परमेश्वर की ओर मन फिराने का समय है। परमेश्वर और बिशप को जानना अच्छा है। जो बिशप का आदर करता है, परमेश्वर उसका आदर करता है; जो बिशप से छिपाकर कुछ करता है, वह शैतान की सेवा करता है।</p><p>2. इसलिए अनुग्रह में तुम्हारे लिए सब कुछ बहुतायत से हो, क्योंकि तुम योग्य हो। तुमने हर बात में मुझे विश्राम दिया; यीशु मसीह तुम्हें भी विश्राम दे। मेरे अनुपस्थित और उपस्थित रहते, दोनों समय तुमने मुझसे प्रेम किया। परमेश्वर तुम्हारा प्रतिफल है; उसके लिए सब कुछ सहते हुए तुम उस तक पहुँचोगे।</p>
      <h2>10</h2><p>1. फिलो और रेउस अगाथोपुस, जो परमेश्वर के वचन के लिए मेरे पीछे आए, उन्हें परमेश्वर के सेवकों के रूप में ग्रहण करके तुमने अच्छा किया। वे भी तुम्हारे लिए प्रभु का धन्यवाद करते हैं कि तुमने हर प्रकार से उन्हें विश्राम दिया। तुम्हारा कुछ भी व्यर्थ न जाएगा।</p><p>2. मेरी आत्मा और मेरी बेड़ियाँ तुम्हारे लिए बदले में दिया गया प्राण हैं[20]; तुमने उन्हें तुच्छ नहीं जाना और न उनसे लज्जित हुए[21]। सिद्ध आशा यीशु मसीह भी तुमसे लज्जित न होगा।</p>
      <h2>11</h2><p>1. तुम्हारी प्रार्थना सीरिया के अन्ताकिया की कलीसिया तक पहुँची है; वहीं से परमेश्वर के अति योग्य बन्धनों में बँधकर मैं सबको नमस्कार कहता हूँ, यद्यपि मैं वहाँ का होने के योग्य नहीं, क्योंकि उनमें सबसे छोटा हूँ; परन्तु (परमेश्वर की) इच्छा से मैं योग्य ठहराया गया—अपने विवेक से नहीं, परमेश्वर के अनुग्रह से। मैं प्रार्थना करता हूँ कि वह अनुग्रह मुझे पूरा दिया जाए, ताकि तुम्हारी प्रार्थना से मैं परमेश्वर तक पहुँचूँ।</p><p>2. इसलिए, ताकि तुम्हारा काम पृथ्वी पर और स्वर्ग में सिद्ध हो, उचित है कि तुम्हारी कलीसिया परमेश्वर के आदर के लिए परमेश्वर का एक दूत चुने[22], जो सीरिया जाकर उनके साथ आनन्द मनाए कि उन्हें शान्ति मिली है, उन्होंने अपनी पूर्व महानता फिर पा ली है, और उनकी अपनी देह (मण्डली) फिर से स्थापित हो गई है।</p><p>3. मुझे यह परमेश्वर के योग्य बात लगी कि तुम अपने में से किसी को पत्र के साथ भेजो, ताकि वह उनके साथ उस शान्त मौसम की महिमा करे जो परमेश्वर के अनुसार उन्हें मिला, और यह कि तुम्हारी प्रार्थना से वे बन्दरगाह तक पहुँच चुके हैं। तुम सिद्ध हो, तो सिद्ध बातों का ही विचार करो[23]; क्योंकि जब तुम भलाई करना चाहते हो, तो परमेश्वर देने को तैयार है।</p>
      <h2>12</h2><p>1. त्रोआस के भाइयों का प्रेम तुम्हें नमस्कार कहता है; वहीं से मैं बुर्रुस के हाथ तुम्हें लिख रहा हूँ, जिसे तुमने अपने भाइयों इफिसियों के साथ मेरे संग भेजा, और जिसने हर बात में मुझे विश्राम दिया। भला हो कि सब उसका अनुकरण करें, क्योंकि वह परमेश्वर की सेवा का जीवित नमूना है। अनुग्रह हर बात में उसे प्रतिफल दे।</p><p>2. मैं परमेश्वर के योग्य बिशप, परमेश्वर के योग्य पुरोहित-मण्डल, अपने संगी दास डीकनों, और तुम में से हर एक को और सबको मिलाकर, यीशु मसीह के नाम में, उसके शरीर और लहू में, उसके शारीरिक और आत्मिक दुःखभोग और पुनरुत्थान में, परमेश्वर की और तुम्हारी एकता में नमस्कार कहता हूँ। अनुग्रह, दया, शान्ति और धीरज सदा तुम्हारे साथ रहें।</p>
      <h2>13</h2><p>1. मैं अपने भाइयों के घरानों को, उनकी पत्नियों और बच्चों समेत, नमस्कार कहता हूँ, और उन कुँवारियों को भी जो विधवाएँ कहलाती हैं[24]। पिता की सामर्थ्य में तुम्हारा कल्याण हो। फिलो, जो मेरे साथ है, तुम्हें नमस्कार कहता है।</p><p>2. मैं तावीया के घराने को नमस्कार कहता हूँ, और प्रार्थना करता हूँ कि वह शारीरिक और आत्मिक विश्वास और प्रेम में स्थिर रहे। मैं आल्के को, जिसका नाम मुझे प्रिय है, अतुलनीय दाफ्नुस को, यूतेक्नुस को, और सबको नाम ले-लेकर नमस्कार कहता हूँ। परमेश्वर के अनुग्रह में तुम्हारा कल्याण हो।</p>
