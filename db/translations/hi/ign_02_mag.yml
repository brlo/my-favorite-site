    body: |-
      <h2>0</h2><p>इग्नाटियस, जिसे थियोफोरस भी कहते हैं, मियान्दर नदी के किनारे मैग्नेशिया में स्थित उस कलीसिया को, जो हमारे उद्धारकर्ता मसीह यीशु में पिता परमेश्वर के अनुग्रह से आशीषित है: मैं उसी में इस कलीसिया को नमस्कार करता हूँ, और पिता परमेश्वर और यीशु मसीह में तुम्हारे बहुत आनन्द की कामना करता हूँ।</p>
      <h2>1</h2><p>1. जब मैंने परमेश्वर के अनुसार तुम्हारे प्रेम की सुव्यवस्था को जाना, तो आनन्दित होकर मैंने ठाना कि यीशु मसीह के विश्वास में तुमसे बात करूँ।</p><p>2. क्योंकि मुझे परमेश्वर के अति योग्य नाम[1] का सम्मान मिला है, इसलिए जो बेड़ियाँ मैं लिए फिरता हूँ उनमें मैं कलीसियाओं का गुणगान करता हूँ, और प्रार्थना करता हूँ कि उनमें यीशु मसीह—जो हमारा सदा का जीवन है—के शरीर और आत्मा की एकता हो, विश्वास और प्रेम की एकता हो, जिससे बढ़कर कुछ नहीं, और सबसे बढ़कर यीशु और पिता की एकता हो।</p><p>3. यदि हम उसमें इस संसार के सरदार के सब उपद्रव सहकर बच निकलें, तो परमेश्वर तक पहुँचेंगे।</p>
      <h2>2</h2><p>मुझे तुम्हारे परमेश्वर के योग्य बिशप दमास, योग्य पुरोहितों बस्सुस और अपुल्लोनियुस, और मेरे संगी दास डीकन जोतियोन के द्वारा तुम्हें देखने का अवसर मिला। मैं जोतियोन के कारण आनन्द पाऊँ, क्योंकि वह बिशप के अधीन ऐसे रहता है जैसे परमेश्वर के अनुग्रह के, और पुरोहित-मण्डल के अधीन ऐसे जैसे यीशु मसीह की व्यवस्था के।</p>
      <h2>3</h2><p>1. तुम्हें भी उचित है कि बिशप की कम आयु का लाभ उठाकर उसे तुच्छ न जानो[2], परन्तु पिता परमेश्वर की सामर्थ्य के अनुसार उसका पूरा आदर करो। जैसा मैं जानता हूँ, पवित्र पुरोहित भी उसकी दिखाई देनेवाली कम आयु का अनुचित लाभ नहीं उठाते, परन्तु परमेश्वर में समझदार लोगों के समान उसके अधीन रहते हैं—उसके नहीं, वरन् यीशु मसीह के पिता के, जो सब का बिशप है।</p><p>2. इसलिए उसके आदर के लिए, जिसने हमें चाहा, बिना कपट के आज्ञा मानना उचित है। क्योंकि जो इस दिखाई देनेवाले बिशप को धोखा देता है, वह वास्तव में अदृश्य को छलने का प्रयत्न करता है[3]। ऐसी बात में प्रश्न शरीर का नहीं, परन्तु उस परमेश्वर का है जो गुप्त बातों को जानता है।</p>
      <h2>4</h2><p>इसलिए उचित है कि हम केवल मसीही कहलाएँ ही नहीं, वरन् सचमुच मसीही हों। कुछ लोग बिशप का नाम तो लेते हैं, परन्तु उसके बिना ही सब कुछ करते हैं। ऐसे लोग मुझे शुद्ध विवेक वाले नहीं लगते, क्योंकि वे आज्ञा के अनुसार ठीक रीति से इकट्ठे नहीं होते[4]।</p>
      <h2>5</h2><p>1. सब बातों का अन्त है, और दो बातें—मृत्यु और जीवन—साथ-साथ हमारे सामने रखी हैं, और हर एक अपने स्थान को जानेवाला है।</p><p>2. जैसे सिक्के दो प्रकार के होते हैं, एक परमेश्वर का और एक संसार का, और हर एक पर उसकी अपनी छाप लगी होती है; वैसे ही अविश्वासियों पर इस संसार की छाप है, और विश्वासियों पर प्रेम में यीशु मसीह के द्वारा पिता परमेश्वर की छाप। यदि हम उसके द्वारा उसके दुःखभोग में मरने को अपनी इच्छा से तैयार न हों, तो उसका जीवन हम में नहीं है[5]।</p>
      <h2>6</h2><p>1. ऊपर जिन लोगों के नाम लिए गए, उनमें मैंने विश्वास से तुम्हारी सारी मण्डली को देखा और उससे प्रेम किया; इसलिए समझाता हूँ: परमेश्वर की एकमनता में सब कुछ करने का यत्न करो; बिशप परमेश्वर के स्थान पर अध्यक्षता करता है, पुरोहित प्रेरितों की सभा के स्थान पर, और मेरे अति प्रिय डीकनों को यीशु मसीह की सेवा सौंपी गई है, जो युगों के पहले से पिता के साथ था और अन्त में प्रगट हुआ।</p><p>2. इसलिए तुम सब परमेश्वर का स्वभाव पाकर एक दूसरे का आदर करो; कोई अपने पड़ोसी को शरीर के अनुसार न देखे, परन्तु यीशु मसीह में सदा एक दूसरे से प्रेम करो। तुम्हारे बीच कोई ऐसी बात न हो जो तुम्हें बाँट सके; परन्तु बिशप और अगुवों के साथ एक हो जाओ, अविनाशिता के चिह्न और शिक्षा के रूप में[6]।</p>
      <h2>7</h2><p>1. जैसे प्रभु ने, पिता के साथ एक होते हुए, न अपने आप से और न प्रेरितों के द्वारा, पिता के बिना कुछ किया[7], वैसे ही तुम भी बिशप और पुरोहितों के बिना कुछ न करो; और न यह प्रयत्न करो कि जो तुम अलग से करते हो वह तुम्हें उचित लगे[8]; परन्तु इकट्ठे होकर एक ही प्रार्थना, एक ही विनती, एक ही मन, प्रेम में और निर्दोष आनन्द में एक ही आशा हो—वह आनन्द यीशु मसीह है, जिससे बढ़कर कुछ नहीं।</p><p>2. तुम सब ऐसे दौड़कर इकट्ठे हो जैसे परमेश्वर के एक ही मन्दिर की ओर, एक ही वेदी की ओर, एक ही यीशु मसीह की ओर—जो एक ही पिता से निकला, एक के साथ रहा और एक ही के पास लौट गया।</p>
      <h2>8</h2><p>1. पराई शिक्षाओं से और पुरानी निकम्मी कहानियों से[9] धोखा न खाओ। क्योंकि यदि हम अब तक यहूदी मत के अनुसार जीते हैं, तो मान लेते हैं कि हमने अनुग्रह नहीं पाया।</p><p>2. क्योंकि अति पवित्र भविष्यद्वक्ता मसीह यीशु के अनुसार जीते थे; इसी कारण वे सताए भी गए। उसके अनुग्रह से प्रेरित होकर उन्होंने आज्ञा न माननेवालों को निश्चय दिलाया कि परमेश्वर एक ही है, जिसने अपने पुत्र यीशु मसीह के द्वारा अपने आप को प्रगट किया; वह पुत्र उसका वचन है जो चुप्पी से निकला[10], और जिसने हर बात में अपने भेजनेवाले को प्रसन्न किया।</p>
      <h2>9</h2><p>1. यदि वे, जो पुरानी रीतियों में चले थे, नई आशा तक पहुँचे, और अब सब्त नहीं मानते परन्तु प्रभु के दिन[11] के अनुसार जीते हैं—जिस दिन हमारा जीवन भी उसके और उसकी मृत्यु के द्वारा उदय हुआ; कुछ लोग इस मृत्यु का इन्कार करते हैं, परन्तु इसी भेद के द्वारा हमने विश्वास पाया, और इसी के कारण धीरज धरते हैं, ताकि अपने एकमात्र गुरु यीशु मसीह के चेले पाए जाएँ—</p><p>2. तो हम उसके बिना कैसे जी सकते हैं? भविष्यद्वक्ता भी तो आत्मा में उसके चेले थे और गुरु के रूप में उसकी बाट जोहते थे। इसी कारण जिसकी वे ठीक रीति से प्रतीक्षा करते थे, उसने आकर उन्हें मरे हुओं में से जिलाया[12]।</p>
      <h2>10</h2><p>1. इसलिए हम उसकी भलाई के प्रति कठोर न बनें। क्योंकि यदि वह हमारे कामों के अनुसार हमसे व्यवहार करे[13], तो हम रहेंगे ही नहीं। इसलिए उसके चेले बनकर आओ, मसीहियत[14] के अनुसार जीना सीखें। जो इस नाम को छोड़ किसी और नाम से पुकारा जाता है, वह परमेश्वर का नहीं।</p><p>2. इसलिए उस बुरे खमीर को, जो पुराना और खट्टा हो गया है, निकाल फेंको, और नए खमीर में, अर्थात् यीशु मसीह में, बदल जाओ[15]। उसमें नमकीन बनो, ताकि तुम में से कोई सड़ न जाए; क्योंकि गन्ध से तुम परखे जाओगे।</p><p>3. यीशु मसीह का नाम लेना और यहूदी मत के अनुसार चलना अनुचित है। क्योंकि मसीहियत ने यहूदी मत पर विश्वास नहीं किया, परन्तु यहूदी मत ने मसीहियत पर; और उसी में हर भाषा के लोग, जिन्होंने परमेश्वर पर विश्वास किया, इकट्ठे किए गए[16]।</p>
      <h2>11</h2><p>हे प्रियो, मैं ये बातें इसलिए नहीं लिखता कि मैंने जाना है कि तुम में से कुछ ऐसे हैं; परन्तु तुमसे छोटा होने के नाते मैं चाहता हूँ कि पहले से तुम्हारी रक्षा करूँ, ताकि तुम घमण्ड के काँटों में न फँसो; वरन् उस जन्म, दुःखभोग और पुनरुत्थान के विषय में पूरा निश्चय रखो, जो पुन्तियुस पिलातुस के राज्यपाल होने के समय हुए, और जिन्हें हमारी आशा यीशु मसीह ने सचमुच और निश्चय करके पूरा किया। तुम में से कोई इस आशा से न भटके।</p>
      <h2>12</h2><p>यदि मैं योग्य ठहरूँ, तो हर बात में तुम्हारे कारण आनन्द पाऊँ। क्योंकि यद्यपि मैं बँधा हुआ हूँ, तौभी तुम स्वतंत्र लोगों में से किसी एक के भी बराबर नहीं। मैं जानता हूँ कि तुम फूलते नहीं, क्योंकि यीशु मसीह तुम में है; वरन् जब मैं तुम्हारी प्रशंसा करता हूँ, तो जानता हूँ कि तुम लज्जित होते हो; जैसा लिखा है: “धर्मी अपने ही ऊपर दोष लगानेवाला है।”[17]</p>
      <h2>13</h2><p>1. इसलिए यत्न करो कि प्रभु और प्रेरितों की शिक्षाओं में दृढ़ बने रहो, ताकि जो कुछ तुम करो, उसमें शरीर और आत्मा में, विश्वास और प्रेम में, पुत्र, पिता और आत्मा में, आरम्भ और अन्त में सफल होओ—अपने अति आदरणीय बिशप के साथ, और अपने पुरोहित-मण्डल के साथ, जो सुन्दरता से गूँथा हुआ आत्मिक मुकुट है, और परमेश्वर के अनुसार चलनेवाले डीकनों के साथ।</p><p>2. बिशप के और एक दूसरे के अधीन रहो, जैसे यीशु मसीह पिता के और प्रेरित मसीह और पिता के अधीन रहे, ताकि एकता शारीरिक भी हो और आत्मिक भी[18]।</p>
      <h2>14</h2><p>यह जानकर कि तुम परमेश्वर से भरे हुए हो, मैंने तुम्हें संक्षेप में समझाया। अपनी प्रार्थनाओं में मुझे स्मरण करो, कि मैं परमेश्वर तक पहुँचूँ; और सीरिया की कलीसिया को भी, जिसका सदस्य कहलाने के भी मैं योग्य नहीं। क्योंकि मुझे परमेश्वर में तुम्हारी एकमन प्रार्थना और प्रेम की आवश्यकता है, ताकि सीरिया की कलीसिया तुम्हारी कलीसिया के द्वारा ओस से सींची जाने के योग्य ठहरे।</p>
      <h2>15</h2><p>इफिसी लोग[19], जो परमेश्वर की महिमा के लिए स्मुरना में उपस्थित हैं, तुम्हें नमस्कार कहते हैं; मैं भी स्मुरना से ही तुम्हें लिख रहा हूँ। उन्होंने तुम्हारी ही तरह, स्मुरना के बिशप पॉलीकार्प के साथ, हर बात में मुझे विश्राम दिया। बाकी कलीसियाएँ भी यीशु मसीह के आदर में तुम्हें नमस्कार कहती हैं। परमेश्वर की एकमनता में, उस अविभाज्य आत्मा को लिए हुए जो यीशु मसीह है, तुम्हारा कल्याण हो।</p>
