      <ol><li><p>θεοπρεπέστατον ὄνομα। सम्भवतः इसका अर्थ है मसीह के लिए बँधे हुए और शहादत की ओर जानेवाले मनुष्य का सम्मानित नाम; कुछ लोग इसे “थियोफोरस” (परमेश्वर को धारण करनेवाला) नाम समझते हैं।</p></li><li><p>νεωτερικὴ τάξις — “युवावस्था (दिखाई देनेवाली कम आयु)”। इसका संकेत मैग्नेशिया के बिशप दमास की कम आयु की ओर है (देखें <a href="https://bibleox.com/hi/hi-ov/1tim/4/#L12">1 तीमु 4:12</a>)। कुछ विद्वान इसे बिशप-पद के नए होने के अर्थ में लेते हैं।</p></li><li><p>अदृश्य बिशप पिता परमेश्वर है (3:1 “सब का बिशप”)।</p></li><li><p>अर्थात् बिशप और पुरोहितों को छोड़कर अलग इकट्ठे होना।</p></li><li><p>देखें <a href="https://bibleox.com/hi/hi-ov/rim/6/#L3-5">रोम 6:3-5</a>।</p></li><li><p>सामान्य व्याख्या यह है: बिशप के साथ एकता अविनाशी जीवन का प्रतिबिम्ब है और लोगों को उसकी शिक्षा भी देती है।</p></li><li><p>देखें <a href="https://bibleox.com/hi/hi-ov/in/5/#L19">यूह 5:19</a>, <a href="https://bibleox.com/hi/hi-ov/in/5/#L30">5:30</a>, <a href="https://bibleox.com/hi/hi-ov/in/8/#L28">यूह 8:28</a>।</p></li><li><p>अर्थात् बिशप और पुरोहितों से अलग की गई सभाएँ।</p></li><li><p>देखें <a href="https://bibleox.com/hi/hi-ov/1tim/1/#L4">1 तीमु 1:4</a>, <a href="https://bibleox.com/hi/hi-ov/1tim/4/#L7">4:7</a>, <a href="https://bibleox.com/hi/hi-ov/tit/1/#L14">तीतु 1:14</a>।</p></li><li><p>λόγος ἀπὸ σιγῆς προελθών। अर्थ: परमेश्वर की अनन्त चुप्पी के बाद उसका वचन संसार में प्रगट हुआ (देखें <a href="https://bibleox.com/hi/hi/w/Ig3E_इफिसुस_की_कलीसिया_के_नाम_पत्र#HH-19">«इफिसुस की कलीसिया के नाम पत्र» 19:1</a>, <a href="https://bibleox.com/hi/hi-ov/rim/16/#L25-26">रोम 16:25-26</a>)। बाद की हस्तलिपियाँ (रूसी अनुवाद इन्हीं के अनुसार) पढ़ती हैं: “उसका अनन्त वचन, जो चुप्पी से नहीं निकला” (λόγος ἀΐδιος οὐκ ἀπὸ σιγῆς προελθών)। माना जाता है कि यह परिवर्तन इसलिए किया गया क्योंकि ज्ञानवादी (नॉस्टिक) “चुप्पी” (सिगे) को एक दैवी सत्ता मानते थे।</p></li><li><p>κυριακή — प्रभु का दिन, अर्थात् रविवार (<a href="https://bibleox.com/hi/hi-ov/otkr/1/#L10">प्रका 1:10</a>)। कुछ हस्तलिपियों में: “प्रभु के जीवन के अनुसार जीते हैं” (κατὰ κυριακὴν ζωήν)।</p></li><li><p>देखें <a href="https://bibleox.com/hi/hi-ov/mf/27/#L52-53">मत्ती 27:52-53</a>।</p></li><li><p>शब्दशः: “यदि वह हमारे करने के अनुसार हमारा अनुकरण करे”; अर्थात् यदि वह हमारे पापों के अनुसार बदला दे (देखें <a href="https://bibleox.com/hi/hi-ov/ps/130/#L3">भजन 130:3</a>)।</p></li><li><p>Χριστιανισμός। उपलब्ध साहित्य में “मसीहियत” (ईसाई धर्म) शब्द सबसे पहले इग्नाटियस के पत्रों में मिलता है (देखें <a href="https://bibleox.com/hi/hi/w/Ig3R_रोम_की_कलीसिया_के_नाम_पत्र#HH-3">«रोम की कलीसिया के नाम पत्र» 3:3</a>, <a href="https://bibleox.com/hi/hi/w/Ig3F_फिलदिलफिया_की_कलीसिया_के_नाम_पत्र#HH-6">«फिलदिलफिया की कलीसिया के नाम पत्र» 6:1</a>)। “मसीही” नाम के लिए देखें <a href="https://bibleox.com/hi/hi-ov/act/11/#L26">प्रेरि 11:26</a>।</p></li><li><p>देखें <a href="https://bibleox.com/hi/hi-ov/1kor/5/#L7-8">1 कुरि 5:7-8</a>।</p></li><li><p>देखें <a href="https://bibleox.com/hi/hi-ov/is/66/#L18">यशा 66:18</a>।</p></li><li><p><a href="https://bibleox.com/hi/hi-ov/pr/18/#L17">नीति 18:17</a> (सेप्टुआजिन्ट के अनुसार; हिन्दी O.V. इसे इब्रानी पाठ से अनुवाद करती है, इसलिए शब्द भिन्न हैं)।</p></li><li><p>बाहरी और भीतरी एकता (देखें <a href="https://bibleox.com/hi/hi-ov/ef/4/#L4">इफि 4:4</a>)।</p></li><li><p>इफिसुस के वे मसीही जो इग्नाटियस के लिए स्मुरना आए थे (देखें <a href="https://bibleox.com/hi/hi/w/Ig3E_इफिसुस_की_कलीसिया_के_नाम_पत्र#HH-1">«इफिसुस की कलीसिया के नाम पत्र» 1:3</a>, <a href="https://bibleox.com/hi/hi/w/Ig3E_इफिसुस_की_कलीसिया_के_नाम_पत्र#HH-2">«इफिसुस की कलीसिया के नाम पत्र» 2:1</a>)।</p></li></ol>
      <p>अनुवाद: रोडियन व्लासोव (एआई उपकरणों की सहायता से)। मूल पाठ: यूनानी मूल (<a href="https://bibleox.com/hi/grc/w/ΙγνΘ_Μαγ">इस साइट का यूनानी संस्करण</a>; स्पष्ट छूटे हुए अंश लाइटफुट और होम्स के संस्करणों से पूरे किए गए)। सहायक अनुवाद: रूसी अनुवाद («प्रारम्भिक कलीसियाई पिता», ब्रसेल्स, 1988), अंग्रेज़ी अनुवाद (Roberts–Donaldson), फ़्रांसीसी अनुवाद (Genoude, 1837)। बाइबल के उद्धरण और लिंक हिन्दी O.V. के अनुसार।</p>
