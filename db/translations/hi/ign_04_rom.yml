    body: |-
      <h2>0</h2><p>इग्नाटियस, जिसे थियोफोरस भी कहते हैं, उस कलीसिया को, जिस पर परमप्रधान पिता और उसके एकलौते पुत्र यीशु मसीह की महिमा में दया हुई है; जो उसकी इच्छा से, जिसने सब कुछ चाहा जो है, हमारे परमेश्वर यीशु मसीह के प्रेम के अनुसार प्रिय और प्रकाशित है; जो रोमियों के प्रदेश में अध्यक्षता करती है[1]; जो परमेश्वर के योग्य, आदर के योग्य, धन्य कहलाने योग्य, प्रशंसा के योग्य, सिद्धि के योग्य, पवित्रता के योग्य है, और प्रेम में अध्यक्षता करती है[2]; जो मसीह का नाम और पिता का नाम धारण करती है[3]। मैं पिता के पुत्र यीशु मसीह के नाम में इसे नमस्कार कहता हूँ; और उन्हें, जो शरीर और आत्मा में उसकी हर आज्ञा से जुड़े हैं, बिना भेदभाव परमेश्वर के अनुग्रह से भरे हैं, और हर पराए रंग से छाने गए हैं[4]—उन्हें हमारे परमेश्वर यीशु मसीह में निर्दोष और भरपूर आनन्द।</p>
      <h2>1</h2><p>1. परमेश्वर से प्रार्थना करके मुझे तुम्हारे परमेश्वर के योग्य चेहरे देखने का अवसर मिला, यहाँ तक कि जितना माँगा था उससे भी अधिक मिला। क्योंकि मसीह यीशु में बँधा हुआ मैं तुम्हें नमस्कार करने की आशा रखता हूँ—यदि यह उसकी इच्छा हो कि मैं अन्त तक (पहुँचने के) योग्य ठहरूँ।</p><p>2. आरम्भ तो अच्छा प्रबन्धित है, यदि मैं यह अनुग्रह पाऊँ कि अपना भाग बिना रुकावट प्राप्त करूँ। परन्तु मैं तुम्हारे प्रेम से डरता हूँ कि कहीं वही मुझे हानि न पहुँचाए। क्योंकि तुम्हारे लिए जो चाहो करना सहज है, परन्तु यदि तुम मुझ पर तरस खाओ, तो मेरे लिए परमेश्वर तक पहुँचना कठिन है।</p>
      <h2>2</h2><p>1. मैं नहीं चाहता कि तुम मनुष्यों को प्रसन्न करो, परन्तु परमेश्वर को प्रसन्न करो[5], जैसा तुम करते भी हो। क्योंकि न मुझे फिर कभी परमेश्वर तक पहुँचने का ऐसा अवसर मिलेगा, और न तुम, यदि चुप रहो, इससे अच्छे काम में अपना नाम लिखवा सकोगे। यदि तुम मेरे विषय में चुप रहो, तो मैं परमेश्वर का वचन बनूँगा; परन्तु यदि मेरे शरीर से प्रेम करो, तो मैं फिर केवल एक आवाज़ रह जाऊँगा[6]।</p><p>2. मुझे इससे अधिक कुछ न दो कि मैं परमेश्वर के लिए अर्घ के समान उण्डेला जाऊँ[7], जब तक वेदी तैयार है; ताकि तुम प्रेम में एक गायक-मण्डली बनकर मसीह यीशु में पिता के लिए गाओ कि परमेश्वर ने सीरिया के बिशप को सूर्योदय से सूर्यास्त की ओर बुलाकर वहाँ पाए जाने के योग्य ठहराया। संसार से परमेश्वर की ओर अस्त होना अच्छा है, ताकि मैं उसमें उदय होऊँ।</p>
      <h2>3</h2><p>1. तुमने कभी किसी से डाह नहीं की; तुमने दूसरों को सिखाया। मैं चाहता हूँ कि जो बातें तुम चेलों को सिखाते हुए आज्ञा देते हो, वे (मेरे विषय में भी) दृढ़ हों।</p><p>2. केवल मेरे लिए भीतर और बाहर की सामर्थ्य माँगो, कि मैं केवल कहूँ ही नहीं, वरन् चाहूँ भी; केवल मसीही कहलाऊँ ही नहीं, वरन् सचमुच पाया भी जाऊँ। क्योंकि यदि मैं पाया जाऊँ, तो कहला भी सकता हूँ, और तब विश्वासयोग्य ठहरूँगा जब संसार को दिखाई न दूँ।</p><p>3. जो कुछ दिखाई देता है, उसमें कुछ भी अच्छा नहीं[8]। क्योंकि हमारा परमेश्वर यीशु मसीह पिता में होकर और अधिक प्रगट है। मसीहियत समझाने-बुझाने का काम नहीं, परन्तु महानता का काम है, विशेषकर जब संसार उससे बैर रखता है[9]।</p>
      <h2>4</h2><p>1. मैं सब कलीसियाओं को लिखता हूँ और सबको बताता हूँ कि मैं परमेश्वर के लिए अपनी इच्छा से मरता हूँ, यदि तुम मुझे न रोको। मैं तुमसे विनती करता हूँ, मेरे प्रति असमय की भलाई न दिखाओ। मुझे पशुओं का भोजन बनने दो, जिनके द्वारा परमेश्वर तक पहुँचना सम्भव है। मैं परमेश्वर का गेहूँ हूँ, और पशुओं के दाँतों से पीसा जाऊँगा, ताकि मसीह की शुद्ध रोटी पाया जाऊँ।</p><p>2. बल्कि पशुओं को फुसलाओ कि वे मेरी कब्र बन जाएँ और मेरे शरीर का कुछ भी न छोड़ें, ताकि सो जाने के बाद मैं किसी पर बोझ न बनूँ। तब मैं सचमुच यीशु मसीह का चेला होऊँगा, जब संसार मेरे शरीर को भी न देखेगा। मेरे लिए मसीह से विनती करो कि इन साधनों (पशुओं) के द्वारा मैं परमेश्वर के लिए बलिदान पाया जाऊँ।</p><p>3. मैं पतरस और पौलुस के समान तुम्हें आज्ञा नहीं देता। वे प्रेरित थे, मैं दण्ड पाया हुआ हूँ; वे स्वतंत्र थे, परन्तु मैं अब तक दास हूँ। पर यदि मैं दुःख उठाऊँ, तो यीशु मसीह का स्वतंत्र किया हुआ[10] बनूँगा, और उसमें स्वतंत्र होकर जी उठूँगा। अब बँधा हुआ मैं किसी भी वस्तु की लालसा न करना सीख रहा हूँ।</p>
      <h2>5</h2><p>1. सीरिया से रोम तक, जल और थल पर, रात और दिन, मैं पशुओं से लड़ रहा हूँ, दस तेंदुओं से—अर्थात् सिपाहियों के एक दल से—बँधा हुआ; जिन पर भलाई करने से वे और बुरे हो जाते हैं[11]। परन्तु उनके अन्याय से मैं और अधिक चेला बनना सीखता हूँ; तौभी इससे मैं धर्मी नहीं ठहरता[12]।</p><p>2. मैं उन पशुओं के कारण आनन्द पाऊँ जो मेरे लिए तैयार किए गए हैं; और प्रार्थना करता हूँ कि वे मुझ पर शीघ्र झपटें। मैं उन्हें फुसलाऊँगा कि मुझे जल्दी खा जाएँ, ऐसा न हो कि वे कुछ लोगों की तरह डरकर मुझे न छुएँ। और यदि वे स्वयं न चाहें, तो मैं उन्हें विवश करूँगा।</p><p>3. मुझे क्षमा करो; मैं जानता हूँ कि मेरे लिए क्या लाभदायक है। अब मैं चेला बनना आरम्भ कर रहा हूँ। दृश्य और अदृश्य वस्तुओं में से कोई मुझसे डाह न करे, ताकि मैं यीशु मसीह तक पहुँचूँ। आग और क्रूस, पशुओं के झुण्ड, काटा जाना, चीरा जाना, हड्डियों का बिखरना, अंगों का कटना, सारे शरीर का पिसना, शैतान की भयानक यातनाएँ—सब मुझ पर आएँ, बस मैं यीशु मसीह तक पहुँच जाऊँ।</p>
      <h2>6</h2><p>1. संसार की छोरें[13] और इस युग के राज्य मुझे कुछ लाभ न देंगे। पृथ्वी की छोर तक राज्य करने से मेरे लिए मसीह यीशु के लिए मरना अच्छा है[14]। मैं उसे ढूँढ़ता हूँ जो हमारे लिए मरा; मैं उसे चाहता हूँ जो हमारे लिए जी उठा। मेरा जन्म-समय निकट है[15]।</p><p>2. हे भाइयो, मुझे क्षमा करो; मुझे जीने से न रोको; मेरा मरना न चाहो। जो परमेश्वर का होना चाहता है, उसे संसार को न सौंपो, न पदार्थ से उसे भरमाओ। मुझे शुद्ध ज्योति पाने दो; वहाँ पहुँचकर मैं (सच्चा) मनुष्य बनूँगा।</p><p>3. मुझे अपने परमेश्वर के दुःखभोग का अनुकरण करनेवाला बनने दो। जिसके भीतर वह है, वह समझे कि मैं क्या चाहता हूँ, और मुझे घेरनेवाली बातों को जानकर मेरे साथ सहानुभूति रखे।</p>
      <h2>7</h2><p>1. इस संसार का सरदार मुझे छीन लेना और परमेश्वर की ओर मेरे मन को बिगाड़ देना चाहता है। इसलिए वहाँ उपस्थित तुम में से कोई उसकी सहायता न करे; बल्कि मेरी ओर, अर्थात् परमेश्वर की ओर हो जाओ। मुँह से यीशु मसीह का नाम लो और मन में संसार की लालसा रखो—ऐसा न हो। डाह तुम्हारे बीच घर न करे।</p><p>2. यदि मैं वहाँ पहुँचकर तुमसे विनती भी करूँ, तो मेरी न मानना; बल्कि इन बातों को मानो जो मैं तुम्हें लिखता हूँ। क्योंकि मैं जीवित रहते हुए तुम्हें लिखता हूँ, परन्तु मरने की लालसा रखता हूँ। मेरा प्रेम (एरोस) क्रूस पर चढ़ा दिया गया है[16], और मुझ में पदार्थ से प्रेम करनेवाली कोई आग नहीं; परन्तु जीवित जल[17] मुझ में बोलता है, और भीतर से मुझसे कहता है: “पिता के पास आ।”</p><p>3. मुझे नाशवान भोजन में और इस जीवन के सुखों में आनन्द नहीं। मैं परमेश्वर की रोटी चाहता हूँ, जो यीशु मसीह का शरीर है, जो दाऊद के वंश से है; और पीने के लिए मैं उसका लहू चाहता हूँ, जो अविनाशी प्रेम है।</p>
      <h2>8</h2><p>1. मैं अब मनुष्यों के अनुसार जीना नहीं चाहता। और यह तब होगा जब तुम चाहोगे। चाहो, ताकि तुम भी (परमेश्वर को) भाओ।</p><p>2. थोड़े से शब्दों में मैं तुमसे विनती करता हूँ: मेरा विश्वास करो। यीशु मसीह तुम पर प्रगट करेगा कि मैं सच कहता हूँ; वह झूठ न बोलनेवाला मुँह है, जिसके द्वारा पिता ने सच्चाई से बात की[18]।</p><p>3. मेरे लिए विनती करो कि मैं पहुँच जाऊँ। मैंने तुम्हें शरीर के अनुसार नहीं, परन्तु परमेश्वर की इच्छा के अनुसार लिखा है। यदि मैं दुःख उठाऊँ, तो तुमने मेरा भला चाहा; यदि मैं ठुकराया जाऊँ, तो तुमने मुझसे बैर किया।</p>
      <h2>9</h2><p>1. अपनी प्रार्थना में सीरिया की कलीसिया को स्मरण करो, जिसका चरवाहा अब मेरे स्थान पर परमेश्वर है। केवल यीशु मसीह और तुम्हारा प्रेम उसका बिशप होगा।</p><p>2. पर मैं उनमें गिने जाने से लज्जित हूँ, क्योंकि मैं इसके योग्य नहीं, मैं उनमें सबसे छोटा और अधूरे दिनों का जन्मा हूँ[19]; परन्तु यदि मैं परमेश्वर तक पहुँचूँ, तो मुझ पर दया हुई है कि मैं कुछ बनूँ।</p><p>3. मेरी आत्मा और उन कलीसियाओं का प्रेम तुम्हें नमस्कार कहता है जिन्होंने मुझे यीशु मसीह के नाम में ग्रहण किया, राहगीर के समान नहीं। क्योंकि जो कलीसियाएँ शरीर के मार्ग में मेरे रास्ते पर न थीं, उन्होंने भी नगर-नगर मुझे आगे पहुँचाया।</p>
      <h2>10</h2><p>1. मैं यह स्मुरना से, अति धन्य इफिसियों के द्वारा तुम्हें लिख रहा हूँ। मेरे साथ औरों के संग क्रोकस भी है, जिसका नाम मुझे प्रिय है।</p><p>2. जो परमेश्वर की महिमा के लिए मुझसे पहले सीरिया से रोम गए, उन्हें तुम जानते होगे, ऐसा मेरा विश्वास है; उन्हें बता दो कि मैं निकट हूँ। वे सब परमेश्वर के और तुम्हारे योग्य हैं; तुम्हारे लिए उचित है कि हर बात में उन्हें विश्राम दो।</p><p>3. मैंने यह सितम्बर की पहली तिथि से नौ दिन पहले[20] लिखा है। यीशु मसीह के धीरज में अन्त तक तुम्हारा कल्याण हो।</p>
    references: |-
      <ol><li><p>ἥτις καὶ προκάθηται ἐν τόπῳ χωρίου Ῥωμαίων। अर्थ: रोम और उसके आसपास के प्रदेश में (कलीसिया की) अध्यक्षता करती है। कुछ विद्वान इसे रोम की कलीसिया के विशेष स्थान के विषय में समझते हैं।</p></li><li><p>προκαθημένη τῆς ἀγάπης। इसे “प्रेम में प्रधान” भी समझा जाता है और “प्रेम की संगति (कलीसियाओं की संगति) की अध्यक्ष” भी। रोम की कलीसिया दूसरी कलीसियाओं के निर्धन भाइयों की सहायता के लिए प्रसिद्ध थी।</p></li><li><p>χριστώνυμος, πατρώνυμος। प्राचीन लातीनी, सुरयानी और आर्मेनियाई अनुवाद χριστόνομος पढ़ते हैं: “मसीह की व्यवस्था रखनेवाली”।</p></li><li><p>अर्थात् हर पराए रंग से—झूठी शिक्षा से—छानकर शुद्ध किए गए।</p></li><li><p>देखें <a href="https://bibleox.com/hi/hi-ov/gal/1/#L10">गला 1:10</a>।</p></li><li><p>अर्थ: यदि तुम मेरी शहादत को न रोककर चुप रहो, तो मेरी मृत्यु ही परमेश्वर का वचन (परमेश्वर की गवाही) बन जाएगी; पर यदि मेरे प्राण पर तरस खाओ, तो मैं केवल एक निरर्थक आवाज़ रह जाऊँगा। सुरयानी अनुवाद पढ़ता है: “मैं परमेश्वर का वचन बनूँगा”।</p></li><li><p>σπονδισθῆναι — “अर्घ के समान उण्डेला जाना”। देखें <a href="https://bibleox.com/hi/hi-ov/fil/2/#L17">फिलि 2:17</a>, <a href="https://bibleox.com/hi/hi-ov/2tim/4/#L6">2 तीमु 4:6</a>।</p></li><li><p>प्राचीन लातीनी, सुरयानी और आर्मेनियाई अनुवाद इसके बाद जोड़ते हैं: “क्योंकि देखी हुई वस्तुएँ थोड़े ही दिन की हैं, परन्तु अनदेखी वस्तुएँ सदा बनी रहती हैं” (<a href="https://bibleox.com/hi/hi-ov/2kor/4/#L18">2 कुरि 4:18</a>); परन्तु यूनानी पाठ में यह नहीं है।</p></li><li><p>देखें <a href="https://bibleox.com/hi/hi-ov/in/15/#L18-19">यूह 15:18-19</a>।</p></li><li><p>ἀπελεύθερος — “स्वतंत्र किया हुआ दास”। देखें <a href="https://bibleox.com/hi/hi-ov/1kor/7/#L22">1 कुरि 7:22</a>।</p></li><li><p>सम्भवतः इसका अर्थ यह है कि मसीही लोग पहरेदार सिपाहियों की कठोरता कम करने के लिए उन्हें भेंट देते थे।</p></li><li><p>देखें <a href="https://bibleox.com/hi/hi-ov/1kor/4/#L4">1 कुरि 4:4</a>।</p></li><li><p>τὰ πέρατα τοῦ κόσμου। कुछ हस्तलिपियों में τὰ τερπνὰ τοῦ κόσμου “संसार के सुख”।</p></li><li><p>देखें <a href="https://bibleox.com/hi/hi-ov/mf/16/#L26">मत्ती 16:26</a>, <a href="https://bibleox.com/hi/hi-ov/fil/1/#L21">फिलि 1:21</a>।</p></li><li><p>ὁ τοκετός — “प्रसव, जन्म”: शहादत के द्वारा स्वर्गीय जीवन में जन्म। प्राचीन लातीनी अनुवाद इसे “लाभ” (lucrum) कहता है।</p></li><li><p>ὁ ἐμὸς ἔρως ἐσταύρωται। अर्थ: संसार की वस्तुओं के लिए मेरी लालसा क्रूस पर चढ़ाकर मार दी गई है (देखें <a href="https://bibleox.com/hi/hi-ov/gal/5/#L24">गला 5:24</a>, <a href="https://bibleox.com/hi/hi-ov/gal/6/#L14">6:14</a>)। प्राचीन काल से इसे यह भी समझा और उद्धृत किया गया है: “मेरा प्रियतम (मसीह) क्रूस पर चढ़ाया गया”।</p></li><li><p>जीवित जल — पवित्र आत्मा, जो शहादत के लिए उभारता और बल देता है (देखें <a href="https://bibleox.com/hi/hi-ov/in/4/#L10">यूह 4:10</a>, <a href="https://bibleox.com/hi/hi-ov/in/7/#L38">यूह 7:38</a>)।</p></li><li><p>देखें <a href="https://bibleox.com/hi/hi-ov/in/14/#L6">यूह 14:6</a>, <a href="https://bibleox.com/hi/hi-ov/evr/6/#L18">इब्रा 6:18</a>।</p></li><li><p>ἔκτρωμα — “अधूरे दिनों का जन्मा”। देखें <a href="https://bibleox.com/hi/hi-ov/1kor/15/#L8-9">1 कुरि 15:8-9</a>।</p></li><li><p>रोमी पंचांग के अनुसार “सितम्बर के कालेंड से नौ दिन पहले”, अर्थात् 24 अगस्त।</p></li></ol>
      <p>अनुवाद: रोडियन व्लासोव (एआई उपकरणों की सहायता से)। मूल पाठ: यूनानी मूल (<a href="https://bibleox.com/hi/grc/w/ΙγνΘ_Ρωμ">इस साइट का यूनानी संस्करण</a>; स्पष्ट छूटे हुए अंश लाइटफुट और होम्स के संस्करणों से पूरे किए गए)। सहायक अनुवाद: रूसी अनुवाद («प्रारम्भिक कलीसियाई पिता», ब्रसेल्स, 1988), अंग्रेज़ी अनुवाद (Roberts–Donaldson), फ़्रांसीसी अनुवाद (Genoude, 1837)। बाइबल के उद्धरण और लिंक हिन्दी O.V. के अनुसार।</p>
