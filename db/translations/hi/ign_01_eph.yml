      <ol><li><p>जब इग्नाटियस बन्दी के रूप में ले जाए जाते हुए स्मुरना पहुँचे, तब इफिसुस की कलीसिया ने बिशप उनेसिमुस, डीकन बुर्रुस, क्रोकस, यूप्लुस और फ्रोंटो को उनसे मिलने भेजा (<a href="#HH-1">अध्याय 1</a>, <a href="#HH-2">अध्याय 2</a>, <a href="#HH-21">अध्याय 21</a>)। इस पत्र में इग्नाटियस उनके प्रेम के लिए धन्यवाद देते हैं, उन्हें एकमन होकर बिशप और पुरोहित-मण्डल की आज्ञा मानने (अध्याय 3–6) और झूठी शिक्षाओं से बचने (अध्याय 7–10) का उपदेश देते हैं, और मसीह के देहधारण तथा दुःखभोग के भेद के विषय में बोलते हैं। यह पत्र स्मुरना में लिखा गया (<a href="#HH-21">21:1</a>)।</p></li><li><p>यूनानी Θεοφόρος — “परमेश्वर को धारण करनेवाला”। इग्नाटियस स्वयं यही शब्द सब मसीहियों के लिए प्रयोग करते हैं (<a href="#HH-9">9:2</a>)।</p></li><li><p>देखें <a href="https://bibleox.com/hi/hi-ov/ef/1/#L4-5">इफि 1:4-5</a>, <a href="https://bibleox.com/hi/hi-ov/ef/1/#L11">इफि 1:11</a>।</p></li><li><p>देखें <a href="https://bibleox.com/hi/hi-ov/act/20/#L28">प्रेरि 20:28</a>। इग्नाटियस मसीह को “हमारा परमेश्वर” कहते हैं (अभिवादन, <a href="#HH-18">18:2</a>) और उसके लहू को “परमेश्वर का लहू”।</p></li><li><p>अर्थात् मसीह के नाम (मसीही कहलाने के नाम) के लिए।</p></li><li><p>इग्नाटियस मानते हैं कि शहादत के द्वारा ही मनुष्य सच्चा चेला बनता है (<a href="https://bibleox.com/hi/hi/w/Ig3R_रोम_की_कलीसिया_के_नाम_पत्र#HH-4">«रोम की कलीसिया के नाम पत्र» 4:2</a>, <a href="https://bibleox.com/hi/hi/w/Ig3R_रोम_की_कलीसिया_के_नाम_पत्र#HH-5">«रोम की कलीसिया के नाम पत्र» 5:3</a>)। कुछ हस्तलिपियाँ और प्राचीन अनुवाद (रूसी और अंग्रेज़ी अनुवाद भी उन्हीं के अनुसार) यहाँ जोड़ते हैं: “उसका, जिसने हमारे लिए अपने आप को परमेश्वर के आगे भेंट और बलिदान करके दे दिया” (<a href="https://bibleox.com/hi/hi-ov/ef/5/#L2">इफि 5:2</a>); परन्तु यूनानी पाठ में यह नहीं है।</p></li><li><p>“शरीर में” (ἐν σαρκί) इस साइट के यूनानी पाठ में छूट गया है, परन्तु मानक संस्करणों (लाइटफुट, होम्स) में है। अर्थ है दृश्य बिशप, जो अदृश्य बिशप मसीह के सामने रखा गया है (<a href="https://bibleox.com/hi/hi/w/Ig3M_मैग्नेशिया_की_कलीसिया_के_नाम_पत्र#HH-3">«मैग्नेशिया की कलीसिया के नाम पत्र» 3:1-2</a>, <a href="https://bibleox.com/hi/hi/w/Ig3R_रोम_की_कलीसिया_के_नाम_पत्र#HH-9">«रोम की कलीसिया के नाम पत्र» 9:1</a>)।</p></li><li><p>σύνδουλος। इग्नाटियस डीकनों को इसी नाम से पुकारते हैं (<a href="https://bibleox.com/hi/hi/w/Ig3M_मैग्नेशिया_की_कलीसिया_के_नाम_पत्र#HH-2">«मैग्नेशिया की कलीसिया के नाम पत्र» अध्याय 2</a>, <a href="https://bibleox.com/hi/hi/w/Ig3F_फिलदिलफिया_की_कलीसिया_के_नाम_पत्र#HH-4">«फिलदिलफिया की कलीसिया के नाम पत्र» अध्याय 4</a>, <a href="https://bibleox.com/hi/hi/w/Ig3S_स्मुरना_की_कलीसिया_के_नाम_पत्र#HH-12">«स्मुरना की कलीसिया के नाम पत्र» 12:2</a>)।</p></li><li><p>ἐξεμπλάριον — लातीनी exemplarium से लिया गया शब्द; अर्थ: “तुम्हारे प्रेम को अपने में दिखानेवाला”।</p></li><li><p>ὀναίμην — “मैं तुमसे लाभ पाऊँ, तुम्हारे कारण आनन्द पाऊँ”। यह बिशप उनेसिमुस (Ὀνήσιμος, “लाभदायक”) के नाम पर शब्द-क्रीड़ा है; पौलुस भी फिलेमोन के नाम पत्री में यही शब्द-क्रीड़ा करता है (<a href="https://bibleox.com/hi/hi-ov/fm/1/#L20">फिले 1:20</a>)।</p></li><li><p>πρεσβυτέριον — बिशप के अधीन पुरोहितों (πρεσβύτεροι, मूल अर्थ “प्राचीन”) का मण्डल। इग्नाटियस के पत्रों में बिशप, पुरोहित और डीकन — ये तीन पद स्पष्ट दिखाई देते हैं।</p></li><li><p>कुछ अनुवाद (रूसी, अंग्रेज़ी) यहाँ जोड़ते हैं: “एक ही मन और एक ही मत होकर मिले रहो, और सब एक ही बात कहो” (<a href="https://bibleox.com/hi/hi-ov/1kor/1/#L10">1 कुरि 1:10</a>); परन्तु यूनानी पाठ में यह नहीं है।</p></li><li><p>συνδιδασκαλῖται — “साथ सीखनेवाले”; कुछ अनुवाद इसे “साथ सिखानेवाले” समझते हैं।</p></li><li><p>ὑπαλειφθῆναι — जैसे पहलवान को प्रतियोगिता से पहले तेल मला जाता है, वैसे तैयार किया जाना।</p></li><li><p>γνώμη — “विचार, इच्छा, योजना”।</p></li><li><p>χρῶμα — संगीत का शब्द: “स्वर, सुर”। यह उपमा है कि सब परमेश्वर का सुर पाकर एक होकर गाएँ।</p></li><li><p>अर्थात् उस कलीसियाई संगति के भीतर जो बिशप के अधीन एक ही वेदी के चारों ओर इकट्ठी होती है (<a href="https://bibleox.com/hi/hi/w/Ig3M_मैग्नेशिया_की_कलीसिया_के_नाम_पत्र#HH-7">«मैग्नेशिया की कलीसिया के नाम पत्र» 7:2</a>, <a href="https://bibleox.com/hi/hi/w/Ig3T_त्रालेस_की_कलीसिया_के_नाम_पत्र#HH-7">«त्रालेस की कलीसिया के नाम पत्र» 7:2</a>, <a href="https://bibleox.com/hi/hi/w/Ig3F_फिलदिलफिया_की_कलीसिया_के_नाम_पत्र#HH-4">«फिलदिलफिया की कलीसिया के नाम पत्र» अध्याय 4</a>)।</p></li><li><p>देखें <a href="https://bibleox.com/hi/hi-ov/in/6/#L33">यूह 6:33</a>।</p></li><li><p>देखें <a href="https://bibleox.com/hi/hi-ov/mf/18/#L19-20">मत्ती 18:19-20</a>।</p></li><li><p><a href="https://bibleox.com/hi/hi-ov/pr/3/#L34">नीति 3:34</a> (सेप्टुआजिन्ट के अनुसार; हिन्दी O.V. इसे इब्रानी पाठ से अनुवाद करती है, इसलिए शब्द भिन्न हैं)। <a href="https://bibleox.com/hi/hi-ov/iak/4/#L6">याकू 4:6</a> और <a href="https://bibleox.com/hi/hi-ov/1pet/5/#L5">1 पत 5:5</a> में भी यह उद्धृत है; यहाँ याकूब की पत्री के O.V. शब्द लिए गए हैं।</p></li><li><p>अर्थात् ऐसा नम्र बिशप जो अपने अधिकार पर ज़ोर नहीं देता। इग्नाटियस चुप्पी को एक सद्गुण मानते हैं (<a href="#HH-15">15:1-2</a>, <a href="https://bibleox.com/hi/hi/w/Ig3F_फिलदिलफिया_की_कलीसिया_के_नाम_पत्र#HH-1">«फिलदिलफिया की कलीसिया के नाम पत्र» 1:1</a>)।</p></li><li><p>देखें <a href="https://bibleox.com/hi/hi-ov/mf/21/#L33-37">मत्ती 21:33-37</a>, <a href="https://bibleox.com/hi/hi-ov/in/13/#L20">यूह 13:20</a>, <a href="https://bibleox.com/hi/hi-ov/mf/10/#L40">मत्ती 10:40</a>।</p></li><li><p>γεννητὸς καὶ ἀγέννητος — मनुष्य के रूप में वह मरियम से जन्मा, और परमेश्वर के रूप में उसका कोई आरम्भ नहीं। बाद की धर्मविज्ञान की भाषा में पुत्र को पिता से “उत्पन्न” कहा जाता है, इसलिए अथनासियुस (“परिषदों के विषय में” 47) ने इस वाक्य को γενητὸς καὶ ἀγένητος “(मनुष्य के रूप में) रचा गया और (परमेश्वर के रूप में) अरचित” के अर्थ में समझाया और इसे सही विश्वास की अभिव्यक्ति बताया।</p></li><li><p>प्राचीन उद्धरणों (अथनासियुस, थियोडोरेट) और कुछ हस्तलिपियों में: “शरीर में आया हुआ परमेश्वर” (ἐν σαρκὶ γενόμενος θεός)।</p></li><li><p>περίψημα — मूल अर्थ “पोंछकर फेंका हुआ कूड़ा” (<a href="https://bibleox.com/hi/hi-ov/1kor/4/#L13">1 कुरि 4:13</a> “जगत का कूड़ा”)। उस समय यह “मैं तुम्हारे लिए अपने आप को अर्पित करता हूँ” — इस समर्पण का प्रचलित वाक्य भी था। यह <a href="#HH-18">18:1</a> में भी आता है।</p></li><li><p>यह नहीं बताया गया कि झूठे शिक्षक कहाँ से आए थे।</p></li><li><p>देखें <a href="https://bibleox.com/hi/hi-ov/ef/2/#L20-22">इफि 2:20-22</a>, <a href="https://bibleox.com/hi/hi-ov/1pet/2/#L5">1 पत 2:5</a>। क्रूस की तुलना पत्थरों को ऊपर उठानेवाली मशीन से, और पवित्र आत्मा की तुलना उसकी रस्सी से की गई है।</p></li><li><p>यहाँ मूर्तिपूजक त्योहारों की शोभायात्राओं का चित्र है, जिनमें लोग देवमूर्तियाँ और छोटे मन्दिर उठाकर चलते थे; मसीही अपने भीतर परमेश्वर, मन्दिर और मसीह को धारण किए हुए हैं (<a href="https://bibleox.com/hi/hi-ov/1kor/3/#L16">1 कुरि 3:16</a>)। यह वही शब्द है जो इग्नाटियस का अपना नाम “थियोफोरस” है।</p></li><li><p>अर्थात् अविश्वासी और भटके हुए लोग।</p></li><li><p>अर्थात् अन्याय सहने में प्रभु का अनुकरण करने की होड़ करो (<a href="https://bibleox.com/hi/hi-ov/1kor/6/#L7">1 कुरि 6:7</a>)। कुछ लोग इस वाक्य को प्रभु के विषय में समझकर ऐसे पढ़ते हैं: “उससे अधिक अन्याय किसने सहा?”</p></li><li><p>देखें <a href="https://bibleox.com/hi/hi-ov/mf/13/#L25">मत्ती 13:25</a>, <a href="https://bibleox.com/hi/hi/w/Ig3T_त्रालेस_की_कलीसिया_के_नाम_पत्र#HH-6">«त्रालेस की कलीसिया के नाम पत्र» 6:1</a>, <a href="https://bibleox.com/hi/hi/w/Ig3F_फिलदिलफिया_की_कलीसिया_के_नाम_पत्र#HH-3">«फिलदिलफिया की कलीसिया के नाम पत्र» 3:1</a>।</p></li><li><p>बेड़ियों की तुलना आभूषण के मोतियों से की गई है।</p></li><li><p>जो परमेश्वर के लिए मारे जाने को जाते थे, वे इफिसुस होकर जाते थे। पौलुस भी इफिसुस के प्राचीनों से विदा लेकर यरूशलेम गया (<a href="https://bibleox.com/hi/hi-ov/act/20/#L17-38">प्रेरि 20:17-38</a>); अब इग्नाटियस भी उसी मार्ग पर हैं।</p></li><li><p>पौलुस अपनी कई पत्रियों में इफिसुस का उल्लेख करता है (<a href="https://bibleox.com/hi/hi-ov/1kor/15/#L32">1 कुरि 15:32</a>, <a href="https://bibleox.com/hi/hi-ov/1kor/16/#L8">16:8</a>, <a href="https://bibleox.com/hi/hi-ov/1tim/1/#L3">1 तीमु 1:3</a>, <a href="https://bibleox.com/hi/hi-ov/2tim/1/#L18">2 तीमु 1:18</a>, <a href="https://bibleox.com/hi/hi-ov/2tim/4/#L12">4:12</a>), और इफिसियों के नाम उसकी एक अलग पत्री भी है।</p></li><li><p>εὐχαριστία — मूल अर्थ “धन्यवाद”। यहाँ इसका अर्थ है यूखरिस्त — कलीसिया का प्रभु-भोज, जिसे वह एक साथ इकट्ठी होकर मनाती है (<a href="https://bibleox.com/hi/hi/w/Ig3F_फिलदिलफिया_की_कलीसिया_के_नाम_पत्र#HH-4">«फिलदिलफिया की कलीसिया के नाम पत्र» अध्याय 4</a>, <a href="https://bibleox.com/hi/hi/w/Ig3S_स्मुरना_की_कलीसिया_के_नाम_पत्र#HH-7">«स्मुरना की कलीसिया के नाम पत्र» 7:1</a>, <a href="https://bibleox.com/hi/hi/w/Ig3S_स्मुरना_की_कलीसिया_के_नाम_पत्र#HH-8">«स्मुरना की कलीसिया के नाम पत्र» 8:1</a>)।</p></li><li><p>अर्थात् जहाँ विश्वास और प्रेम एक होते हैं, वहाँ परमेश्वर है (<a href="https://bibleox.com/hi/hi-ov/1in/4/#L16">1 यूह 4:16</a>)।</p></li><li><p>देखें <a href="https://bibleox.com/hi/hi-ov/mf/12/#L33">मत्ती 12:33</a>।</p></li><li><p><a href="https://bibleox.com/hi/hi-ov/ps/33/#L9">भजन 33:9</a> (सेप्टुआजिन्ट में 32:9)।</p></li><li><p>देखें <a href="https://bibleox.com/hi/hi-ov/1kor/3/#L16">1 कुरि 3:16</a>, <a href="https://bibleox.com/hi/hi-ov/1kor/6/#L19">6:19</a>।</p></li><li><p>οἰκοφθόροι — व्यभिचारी (<a href="https://bibleox.com/hi/hi-ov/1kor/6/#L9-10">1 कुरि 6:9-10</a>)। इग्नाटियस इस शब्द को उन झूठे शिक्षकों पर लागू करते हैं जो परमेश्वर के घर (कलीसिया) को बिगाड़ते हैं।</p></li><li><p>देखें <a href="https://bibleox.com/hi/hi-ov/mf/26/#L7">मत्ती 26:7</a>, <a href="https://bibleox.com/hi/hi-ov/mk/14/#L3">मर 14:3</a>।</p></li><li><p>अर्थात् शैतान (<a href="https://bibleox.com/hi/hi-ov/in/12/#L31">यूह 12:31</a>, <a href="https://bibleox.com/hi/hi-ov/1kor/2/#L6-8">1 कुरि 2:6-8</a>)।</p></li><li><p>देखें <a href="https://bibleox.com/hi/hi-ov/1kor/1/#L18">1 कुरि 1:18</a>, <a href="https://bibleox.com/hi/hi-ov/1kor/1/#L23">1:23</a>।</p></li><li><p>देखें <a href="https://bibleox.com/hi/hi-ov/1kor/1/#L20">1 कुरि 1:20</a>।</p></li><li><p>देखें <a href="https://bibleox.com/hi/hi-ov/rim/1/#L3">रोम 1:3</a>, <a href="https://bibleox.com/hi/hi-ov/2tim/2/#L8">2 तीमु 2:8</a>।</p></li><li><p>मसीह ने अपने बपतिस्मे और दुःखभोग के द्वारा जल को पवित्र किया, ताकि वह हमारे बपतिस्मे का जल बने।</p></li><li><p>τρία μυστήρια κραυγῆς — शब्दशः “पुकार के तीन भेद”: जो परमेश्वर की चुप्पी में, अर्थात् उसकी अनन्त योजना में पूरे हुए, और बाद में सारे संसार में ऊँचे स्वर से प्रचार किए गए। शैतान मसीह की मृत्यु को तो जानता था, परन्तु यह नहीं जानता था कि यह परमेश्वर की योजना है (<a href="https://bibleox.com/hi/hi-ov/1kor/2/#L7-8">1 कुरि 2:7-8</a>)।</p></li><li><p>देखें <a href="https://bibleox.com/hi/hi-ov/mf/2/#L2">मत्ती 2:2</a>, <a href="https://bibleox.com/hi/hi-ov/mf/2/#L9-10">2:9-10</a>।</p></li><li><p>माना जाता है कि इग्नाटियस यह पुस्तक लिखने से पहले ही शहीद हो गए।</p></li><li><p>φάρμακον ἀθανασίας — यूखरिस्त की रोटी (<a href="https://bibleox.com/hi/hi-ov/in/6/#L50-51">यूह 6:50-51</a>, <a href="https://bibleox.com/hi/hi-ov/in/6/#L54">6:54</a>, <a href="https://bibleox.com/hi/hi-ov/in/6/#L58">6:58</a>)।</p></li><li><p>ἀντίψυχον — “बदले में दिया गया प्राण”, अर्थात् तुम्हारे लिए अपना प्राण देनेवाला (<a href="https://bibleox.com/hi/hi/w/Ig3S_स्मुरना_की_कलीसिया_के_नाम_पत्र#HH-10">«स्मुरना की कलीसिया के नाम पत्र» 10:2</a>, <a href="https://bibleox.com/hi/hi/w/Ig3P_पॉलीकार्प_के_नाम_पत्र#HH-2">«पॉलीकार्प के नाम पत्र» 2:3</a>, <a href="https://bibleox.com/hi/hi/w/Ig3P_पॉलीकार्प_के_नाम_पत्र#HH-6">«पॉलीकार्प के नाम पत्र» 6:1</a>)।</p></li></ol>
      <p>अनुवाद: रोडियन व्लासोव (एआई उपकरणों की सहायता से)। मूल पाठ: यूनानी मूल (<a href="https://bibleox.com/hi/grc/w/ΙγνΘ_Εφ">इस साइट का यूनानी संस्करण</a>; स्पष्ट छूटे हुए अंश लाइटफुट और होम्स के संस्करणों से पूरे किए गए)। सहायक अनुवाद: रूसी अनुवाद («प्रारम्भिक कलीसियाई पिता», ब्रसेल्स, 1988), अंग्रेज़ी अनुवाद (Roberts–Donaldson), फ़्रांसीसी अनुवाद (Genoude, 1837)। बाइबल के उद्धरण और लिंक हिन्दी O.V. के अनुसार।</p>
