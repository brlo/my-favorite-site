    body: |-
      <h2>0</h2><p>इग्नाटियस[1], जिसे थियोफोरस[2] भी कहते हैं, आसिया के इफिसुस में स्थित उस कलीसिया को, जो सचमुच धन्य कहलाने योग्य है: जो पिता परमेश्वर की परिपूर्ण महिमा में आशीषित है, जो युगों के पहले से[3] सदा के लिए अटल और स्थिर महिमा के लिए ठहराई गई है, और जो सच्चे दुःखभोग में, पिता की और हमारे परमेश्वर यीशु मसीह की इच्छा से, एक की गई और चुनी गई है। यीशु मसीह में और निर्दोष आनन्द में तुम्हें बहुत-बहुत नमस्कार।</p>
      <h2>1</h2><p>1. परमेश्वर में अति प्रिय तुम्हारे नाम को मैंने ग्रहण किया है; यह नाम तुमने हमारे उद्धारकर्ता मसीह यीशु पर विश्वास और प्रेम के कारण अपने धर्मी स्वभाव से पाया है। तुम परमेश्वर का अनुकरण करनेवाले हो, और परमेश्वर के लहू[4] से फिर से प्रज्वलित होकर तुमने उस काम को पूरी रीति से निभाया जो एक ही परिवार के लोगों को शोभा देता है।</p><p>2. क्योंकि जब तुमने सुना कि मैं साझे नाम और आशा के लिए[5] सीरिया से बाँधकर लाया गया हूँ, और आशा करता हूँ कि तुम्हारी प्रार्थनाओं से रोम में पशुओं से लड़ने का अवसर पाऊँ, ताकि उसे पाकर मैं चेला बन सकूँ[6], तो तुम मुझसे मिलने को उतावले हो गए।</p><p>3. इसलिए मैंने परमेश्वर के नाम में तुम्हारी सारी मण्डली को उनेसिमुस में ग्रहण किया है, जो अकथनीय प्रेम का मनुष्य है और शरीर में तुम्हारा बिशप[7] है। मैं प्रार्थना करता हूँ कि तुम यीशु मसीह के अनुसार उससे प्रेम करो और तुम सब उसके समान बनो। धन्य है वह जिसने तुम्हें, जो इसके योग्य हो, ऐसा बिशप पाने का अनुग्रह दिया।</p>
      <h2>2</h2><p>1. मेरे संगी दास[8] बुर्रुस के विषय में, जो परमेश्वर की इच्छा के अनुसार तुम्हारा डीकन है और सब बातों में आशीषित है, मेरी यह कामना है कि वह तुम्हारे और बिशप के आदर के लिए यहीं रहे। और क्रोकस भी, जो परमेश्वर के और तुम्हारे योग्य है, जिसे मैंने तुम्हारे प्रेम के जीवित नमूने[9] के रूप में ग्रहण किया है, उसने हर बात में मुझे विश्राम दिया है। यीशु मसीह का पिता उसे भी, उनेसिमुस, बुर्रुस, यूप्लुस और फ्रोंटो के साथ, शान्ति दे; इन्हीं के द्वारा मैंने प्रेम में तुम सब को देखा है।</p><p>2. यदि मैं योग्य ठहरूँ, तो सदा तुम्हारे कारण आनन्द पाऊँ[10]। इसलिए उचित है कि तुम हर प्रकार से उस यीशु मसीह की महिमा करो जिसने तुम्हें महिमा दी, ताकि तुम एक ही आज्ञाकारिता में सिद्ध होकर, बिशप और पुरोहित-मण्डल[11] के अधीन रहकर, सब बातों में पवित्र किए जाओ[12]।</p>
      <h2>3</h2><p>1. मैं तुम्हें ऐसे आज्ञा नहीं देता जैसे मैं कोई बड़ा व्यक्ति हूँ। यद्यपि मैं इस नाम के लिए बँधा हुआ हूँ, तौभी अभी यीशु मसीह में सिद्ध नहीं हुआ हूँ। मैं तो अभी चेला बनना आरम्भ कर रहा हूँ, और तुमसे अपने सहपाठियों[13] के समान बात करता हूँ। वास्तव में मुझे ही तुम्हारे द्वारा विश्वास, चितावनी, धीरज और सहनशीलता से अभिषिक्त होकर तैयार होना चाहिए था[14]।</p><p>2. परन्तु प्रेम मुझे तुम्हारे विषय में चुप नहीं रहने देता, इसलिए मैंने पहले से तुम्हें समझाना ठाना कि तुम परमेश्वर की इच्छा[15] के साथ कदम मिलाकर चलो। क्योंकि यीशु मसीह, जो हमारा अविभाज्य जीवन है, पिता की इच्छा है; वैसे ही पृथ्वी की छोर तक नियुक्त किए गए बिशप भी यीशु मसीह की इच्छा में हैं।</p>
      <h2>4</h2><p>1. इसलिए तुम्हारे लिए उचित है कि तुम बिशप की इच्छा के साथ कदम मिलाकर चलो, और तुम ऐसा कर भी रहे हो। क्योंकि तुम्हारा प्रसिद्ध और परमेश्वर के योग्य पुरोहित-मण्डल बिशप के साथ ऐसा मिला हुआ है जैसे वीणा के साथ उसके तार। इसलिए तुम्हारी एकमनता और मेल-भरे प्रेम में यीशु मसीह का गुणगान होता है।</p><p>2. तुम भी, एक-एक जन, एक गायक-मण्डली बन जाओ, ताकि एकमन होकर मेल में रहो, परमेश्वर का स्वर[16] ग्रहण करके एकता में रहो, और यीशु मसीह के द्वारा एक स्वर से पिता के लिए गाओ; ताकि वह तुम्हारी सुने, और तुम्हारे भले कामों के द्वारा पहचाने कि तुम उसके पुत्र के अंग हो। इसलिए तुम्हारे लिए लाभदायक है कि तुम निर्दोष एकता में रहो, ताकि सदा परमेश्वर के भी सहभागी बने रहो।</p>
      <h2>5</h2><p>1. यदि मैंने थोड़े ही समय में तुम्हारे बिशप के साथ ऐसी घनिष्ठ संगति पाई—जो मानवीय नहीं, आत्मिक है—तो तुम कितने अधिक धन्य हो, जो उसके साथ ऐसे जुड़े हुए हो जैसे कलीसिया यीशु मसीह के साथ और यीशु मसीह पिता के साथ, ताकि सब कुछ एकता में मेल खाए।</p><p>2. कोई धोखा न खाए: जो वेदी के भीतर[17] नहीं है, वह परमेश्वर की रोटी[18] से वंचित रहता है। यदि एक-दो जनों की प्रार्थना में इतनी शक्ति है[19], तो बिशप और सारी कलीसिया की प्रार्थना में कितनी अधिक होगी!</p><p>3. इसलिए जो सभा में एक साथ नहीं आता, वह घमण्डी हो चुका है और उसने अपने आप को (कलीसिया से) अलग कर लिया है। क्योंकि लिखा है: “परमेश्वर अभिमानियों का विरोध करता है।”[20] इसलिए आओ, हम यत्न करें कि बिशप का विरोध न करें, ताकि हम परमेश्वर के अधीन रहें।</p>
      <h2>6</h2><p>1. जितना अधिक कोई बिशप को चुप रहते[21] देखे, उतना ही अधिक उसका भय माने। क्योंकि घर का स्वामी जिसे अपने घर का प्रबन्ध करने भेजता है, उसे हमें वैसे ही ग्रहण करना चाहिए जैसे भेजनेवाले को[22]। इसलिए स्पष्ट है कि हमें बिशप को ऐसे देखना चाहिए जैसे स्वयं प्रभु को।</p><p>2. उनेसिमुस भी परमेश्वर में तुम्हारी अच्छी व्यवस्था की बहुत प्रशंसा करता है: कि तुम सब सत्य के अनुसार जीवन बिताते हो, और तुम्हारे बीच कोई कुपंथ घर नहीं करता; वरन् तुम सत्य में यीशु मसीह के विषय में बोलनेवाले को छोड़ किसी की नहीं सुनते।</p>
      <h2>7</h2><p>1. कुछ लोग दुष्ट छल से (मसीह का) नाम लिए फिरते हैं, परन्तु ऐसे काम करते हैं जो परमेश्वर के योग्य नहीं। तुम्हें उनसे ऐसे बचना चाहिए जैसे जंगली पशुओं से; क्योंकि वे पागल कुत्ते हैं जो चुपके से काटते हैं। तुम्हें उनसे सावधान रहना चाहिए, क्योंकि उनका रोग कठिनाई से ठीक होता है।</p><p>2. वैद्य एक ही है: शारीरिक भी और आत्मिक भी; जन्मा हुआ भी और अजन्मा भी[23]; मनुष्य में परमेश्वर[24]; मृत्यु में सच्चा जीवन; मरियम से भी और परमेश्वर से भी; पहले दुःख उठाने योग्य, फिर दुःख से परे—हमारा प्रभु यीशु मसीह।</p>
      <h2>8</h2><p>1. इसलिए कोई तुम्हें धोखा न दे—वैसे तुम धोखा खा भी नहीं रहे, क्योंकि तुम पूरी रीति से परमेश्वर के हो। जब तुम्हारे बीच कोई ऐसा झगड़ा जड़ नहीं पकड़ता जो तुम्हें सता सके, तब तुम सचमुच परमेश्वर के अनुसार जीते हो। मैं तुम्हारे लिए प्रायश्चित की भेंट[25] हूँ; तुम इफिसियों के लिए, जो युगों में प्रसिद्ध कलीसिया हो, मैं अपने आप को अर्पित करता हूँ।</p><p>2. शारीरिक लोग आत्मिक काम नहीं कर सकते, और न आत्मिक लोग शारीरिक काम; जैसे विश्वास अविश्वास के काम नहीं कर सकता, और न अविश्वास विश्वास के काम। परन्तु जो काम तुम शरीर में भी करते हो, वे भी आत्मिक हैं; क्योंकि तुम सब कुछ यीशु मसीह में करते हो।</p>
      <h2>9</h2><p>1. मैंने सुना है कि कुछ लोग वहाँ से[26] होकर आए, जिनके पास बुरी शिक्षा थी; परन्तु तुमने उन्हें अपने बीच बीज बोने न दिया, और अपने कान बन्द कर लिए ताकि उनके बोए हुए को ग्रहण न करो। क्योंकि तुम पिता के मन्दिर के पत्थर[27] हो, पिता परमेश्वर के भवन के लिए तैयार किए गए हो, और यीशु मसीह की उठानेवाली मशीन—जो क्रूस है—के द्वारा, पवित्र आत्मा को रस्सी बनाकर, ऊँचाई पर उठाए जा रहे हो। तुम्हारा विश्वास तुम्हें ऊपर खींचनेवाला है, और प्रेम वह मार्ग है जो परमेश्वर तक ऊपर ले जाता है।</p><p>2. इसलिए तुम सब संगी यात्री हो, परमेश्वर को धारण करनेवाले, मन्दिर को धारण करनेवाले, मसीह को धारण करनेवाले, पवित्र वस्तुओं को धारण करनेवाले[28], और हर बात में यीशु मसीह की आज्ञाओं से सुसज्जित हो। मैं भी तुम्हारे कारण आनन्दित हूँ, और मुझे यह योग्यता मिली कि इस पत्र के द्वारा तुमसे बात करूँ और तुम्हारे साथ आनन्द मनाऊँ; क्योंकि तुम मनुष्य के जीवन में परमेश्वर को छोड़ और किसी से प्रेम नहीं करते।</p>
      <h2>10</h2><p>1. दूसरे लोगों[29] के लिए भी निरन्तर प्रार्थना करते रहो, क्योंकि उनके लिए भी मन फिराव की आशा है कि वे परमेश्वर तक पहुँचें। इसलिए कम से कम अपने कामों से उन्हें सीखने दो।</p><p>2. उनके क्रोध के सामने तुम नम्र बनो, उनकी बड़ी-बड़ी बातों के सामने दीन बनो, उनकी निन्दा के सामने प्रार्थना करो, उनकी भूल के सामने विश्वास में दृढ़ रहो, उनकी उग्रता के सामने कोमल बनो; उनसे बदला लेने को उतावले न हो।</p><p>3. आओ, अपनी सहनशीलता से दिखाएँ कि हम उनके भाई हैं; और प्रभु का अनुकरण करने का यत्न करें—कौन अधिक अन्याय सहे, कौन अधिक लूटा जाए, कौन अधिक तुच्छ ठहराया जाए[30]—ताकि शैतान का कोई जंगली पौधा[31] तुम्हारे बीच न पाया जाए, परन्तु तुम पूरी पवित्रता और संयम में, शरीर और आत्मा दोनों में, यीशु मसीह में बने रहो।</p>
      <h2>11</h2><p>1. ये अन्तिम समय हैं। इसलिए आओ, हम लज्जित हों और परमेश्वर की सहनशीलता से डरें, कहीं वह हमारे लिए दण्ड का कारण न बन जाए। या तो आनेवाले क्रोध से डरें, या वर्तमान अनुग्रह से प्रेम करें—दोनों में से एक; बस सच्चे जीवन के लिए मसीह यीशु में पाए जाएँ।</p><p>2. उसके बिना तुम्हें कुछ भी शोभा न दे। उसी में मैं ये बेड़ियाँ लिए फिरता हूँ—ये आत्मिक मोती[32]—जिनमें मैं तुम्हारी प्रार्थना से जी उठूँ। मैं सदा उस प्रार्थना का सहभागी बना रहूँ, ताकि इफिसुस के उन मसीहियों के भाग में पाया जाऊँ, जो यीशु मसीह की सामर्थ्य से सदा प्रेरितों के साथ एकमन रहे।</p>
      <h2>12</h2><p>1. मैं जानता हूँ कि मैं कौन हूँ और किन्हें लिख रहा हूँ। मैं दण्ड पाया हुआ हूँ, तुम पर दया हुई है; मैं संकट में हूँ, तुम स्थिर किए गए हो।</p><p>2. तुम उन लोगों का मार्ग हो जो परमेश्वर के लिए मारे जाते हैं[33]; तुम पौलुस के साथ भेदों के सहभागी हो, जो पवित्र किया गया, जिसकी गवाही दी गई, जो सचमुच धन्य है। जब मैं परमेश्वर तक पहुँचूँ, तब उसके पदचिह्नों में पाया जाऊँ; वह अपनी हर पत्री में[34] मसीह यीशु में तुम्हें स्मरण करता है।</p>
      <h2>13</h2><p>1. इसलिए यत्न करो कि परमेश्वर को धन्यवाद की भेंट (यूखरिस्त)[35] चढ़ाने और उसकी महिमा करने के लिए अधिक बार इकट्ठे हो। क्योंकि जब तुम बार-बार एक साथ इकट्ठे होते हो, तब शैतान की शक्तियाँ ढा दी जाती हैं, और उसका विनाश तुम्हारे विश्वास की एकमनता में टूट जाता है।</p><p>2. शान्ति से बढ़कर कुछ भी अच्छा नहीं; उसमें स्वर्ग और पृथ्वी की हर लड़ाई मिट जाती है।</p>
      <h2>14</h2><p>1. यदि यीशु मसीह के प्रति तुम्हारा विश्वास और प्रेम सिद्ध है, तो इनमें से कोई बात तुमसे छिपी नहीं; क्योंकि विश्वास और प्रेम जीवन का आरम्भ और अन्त हैं: आरम्भ विश्वास है और अन्त प्रेम। और जब ये दोनों एक हो जाते हैं, तो वही परमेश्वर है[36]; और बाकी सब भली बातें इनके पीछे चलती हैं।</p><p>2. विश्वास का अंगीकार करनेवाला पाप नहीं करता, और प्रेम पानेवाला बैर नहीं रखता। “पेड़ अपने फल से पहचाना जाता है।”[37] वैसे ही जो अपने को मसीह का कहते हैं, वे अपने कामों से पहचाने जाएँगे। अब बात केवल अंगीकार की नहीं, परन्तु इस की है कि कोई अन्त तक विश्वास की सामर्थ्य में पाया जाए।</p>
      <h2>15</h2><p>1. बोलते हुए (मसीही) न होने से चुप रहकर (मसीही) होना अच्छा है। सिखाना अच्छा है, यदि बोलनेवाला करता भी हो। इसलिए गुरु एक ही है, जिसने “कहा, और हो गया”[38]; और जो उसने चुप रहकर किया, वह भी पिता के योग्य है।</p><p>2. जिसने सचमुच यीशु का वचन पाया है, वह उसकी चुप्पी को भी सुन सकता है, ताकि वह सिद्ध हो: जो बोलता है उसके द्वारा काम करे, और जिसमें चुप रहता है उसके द्वारा पहचाना जाए।</p><p>3. प्रभु से कुछ छिपा नहीं, वरन् हमारी गुप्त बातें भी उसके निकट हैं। इसलिए आओ, हम सब कुछ ऐसे करें मानो वह हम में वास करता है, ताकि हम उसके मन्दिर हों[39] और वह हम में हमारा परमेश्वर हो—और वह है भी, और हमारे सामने प्रगट होगा। इसलिए उचित है कि हम उससे प्रेम करें।</p>
      <h2>16</h2><p>1. हे मेरे भाइयो, धोखा न खाओ: घर बिगाड़नेवाले[40] परमेश्वर के राज्य के वारिस न होंगे।</p><p>2. यदि शरीर के अनुसार ऐसे काम करनेवाले मर गए, तो वह कितना अधिक, जो बुरी शिक्षा से परमेश्वर के उस विश्वास को बिगाड़ता है जिसके लिए यीशु मसीह क्रूस पर चढ़ाया गया? ऐसा मनुष्य अशुद्ध होकर कभी न बुझनेवाली आग में जाएगा; और उसकी सुननेवाला भी।</p>
      <h2>17</h2><p>1. इसी लिए प्रभु ने अपने सिर पर इत्र लिया[41], कि कलीसिया पर अविनाशी सुगन्ध फूँके। इस संसार के सरदार[42] की शिक्षा की दुर्गन्ध से अपने को न मलो, कहीं ऐसा न हो कि वह तुम्हें बन्दी बनाकर उस जीवन से अलग कर दे जो तुम्हारे सामने रखा है।</p><p>2. हम सब बुद्धिमान क्यों नहीं बनते, जबकि हमने परमेश्वर का ज्ञान—अर्थात् यीशु मसीह—पाया है? हम क्यों मूर्खता से नाश होते हैं, उस वरदान को न पहचानकर जिसे प्रभु ने सचमुच भेजा है?</p>
      <h2>18</h2><p>1. मेरी आत्मा क्रूस के लिए प्रायश्चित की भेंट है; क्रूस अविश्वासियों के लिए ठोकर है, परन्तु हमारे लिए उद्धार और अनन्त जीवन[43]। “कहाँ रहा ज्ञानवान? कहाँ रहा विवादी?”[44] कहाँ है उनका घमण्ड जो बुद्धिमान कहलाते हैं?</p><p>2. क्योंकि हमारा परमेश्वर यीशु मसीह, परमेश्वर के प्रबन्ध (उद्धार की योजना) के अनुसार, मरियम के गर्भ में आया—दाऊद के वंश से[45], और पवित्र आत्मा से। वह जन्मा और उसने बपतिस्मा लिया, ताकि अपने दुःखभोग से जल को शुद्ध करे[46]।</p>
      <h2>19</h2><p>1. मरियम का कुँवारापन और उसका जनना, और वैसे ही प्रभु की मृत्यु, इस संसार के सरदार से छिपे रहे—ये तीन भेद हैं जो ऊँचे स्वर से प्रचार किए जाने को थे[47], परन्तु परमेश्वर की चुप्पी में पूरे हुए।</p><p>2. तो वे युगों पर कैसे प्रगट हुए? आकाश में एक तारा चमका[48], जो सब तारों से अधिक चमकीला था; उसका प्रकाश अवर्णनीय था और उसकी नवीनता ने विस्मय उत्पन्न किया। बाकी सब तारे, सूर्य और चन्द्रमा के साथ, उस तारे के चारों ओर गायक-मण्डली बन गए, परन्तु उसका प्रकाश सब से बढ़कर था। और घबराहट फैल गई कि यह नई बात, जो उनके समान न थी, कहाँ से आई।</p><p>3. तब से सारा जादू-टोना टूट गया और बुराई का हर बन्धन मिट गया; अज्ञान दूर हुआ, पुराना राज्य नष्ट हुआ; क्योंकि परमेश्वर मनुष्य के रूप में प्रगट हुआ और अनन्त जीवन की नवीनता लाया; जो परमेश्वर के पास पूरी रीति से तैयार था, उसका आरम्भ हुआ। तब से सब कुछ हिल उठा, क्योंकि मृत्यु के विनाश की योजना चल रही थी।</p>
      <h2>20</h2><p>1. यदि यीशु मसीह तुम्हारी प्रार्थना से मुझे योग्य ठहराए और उसकी इच्छा हो, तो अपनी दूसरी छोटी पुस्तक[49] में, जो मैं तुम्हें लिखने को हूँ, मैं तुम्हें नए मनुष्य यीशु मसीह के विषय में उस प्रबन्ध को और स्पष्ट करूँगा जिसकी चर्चा मैंने आरम्भ की है: उस पर विश्वास और उससे प्रेम, उसका दुःखभोग और पुनरुत्थान।</p><p>2. विशेषकर यदि प्रभु मुझ पर प्रगट करे कि तुम सब, एक-एक जन और सब मिलकर, अनुग्रह में, नाम लेकर, एक ही विश्वास में और यीशु मसीह में इकट्ठे होते हो—जो शरीर के अनुसार दाऊद के वंश से है, मनुष्य का पुत्र और परमेश्वर का पुत्र—और अविचल मन से बिशप और पुरोहित-मण्डल की आज्ञा मानते हो, और एक ही रोटी तोड़ते हो। यह रोटी अमरता की औषधि[50] है, मृत्यु से बचानेवाली दवा है, जिससे मनुष्य यीशु मसीह में सदा जीवित रहता है।</p>
      <h2>21</h2><p>1. मैं तुम्हारे लिए, और उनके लिए जिन्हें तुमने परमेश्वर के आदर के लिए स्मुरना भेजा, अपना प्राण देनेवाला[51] हूँ; मैं उसी स्मुरना से तुम्हें यह लिख रहा हूँ, प्रभु का धन्यवाद करते हुए, और पॉलीकार्प से वैसे ही प्रेम करते हुए जैसे तुमसे। मुझे स्मरण रखो, जैसे यीशु मसीह तुम्हें स्मरण रखता है।</p><p>2. सीरिया की कलीसिया के लिए प्रार्थना करो; मैं वहीं से बँधा हुआ रोम ले जाया जा रहा हूँ। मैं वहाँ के विश्वासियों में सब से छोटा हूँ, फिर भी परमेश्वर के आदर के लिए पाए जाने के योग्य ठहराया गया हूँ। पिता परमेश्वर में और हमारी साझी आशा यीशु मसीह में तुम्हारा कल्याण हो।</p>
