      <ol><li><p>ἐν τῷ πληρώματι ἐν ἀποστολικῷ χαρακτῆρι। अर्थ: सारी कलीसिया को वैसे ही नमस्कार कहना जैसे प्रेरित अपनी पत्रियों में कहते थे। कुछ इसे “प्रेरितीय अधिकार की परिपूर्णता में” समझते हैं।</p></li><li><p>प्राचीन लातीनी और आर्मेनियाई अनुवाद पढ़ते हैं: “मैंने पाया कि तुम परमेश्वर का अनुकरण करनेवाले हो, और (परमेश्वर की) महिमा की”; यह अनुवाद उन्हीं के अनुसार है।</p></li><li><p>डीकनों को “यीशु मसीह के भेदों के सेवक” कहा गया है; सम्भवतः इसका संकेत यूखरिस्त में उनकी सेवा की ओर है (देखें <a href="https://bibleox.com/hi/hi-ov/1kor/4/#L1">1 कुरि 4:1</a>)।</p></li><li><p>प्रेरितों के काम अध्याय 6 की “खिलाने-पिलाने की सेवा” से तुलना (देखें <a href="https://bibleox.com/hi/hi-ov/act/6/#L2">प्रेरि 6:2</a>)।</p></li><li><p>τύπος — “प्रतिरूप, छवि”। बिशप को पिता परमेश्वर की छवि दिखानेवाला माना गया है (देखें <a href="https://bibleox.com/hi/hi/w/Ig3M_मैग्नेशिया_की_कलीसिया_के_नाम_पत्र#HH-6">«मैग्नेशिया की कलीसिया के नाम पत्र» 6:1</a>, <a href="https://bibleox.com/hi/hi/w/Ig3M_मैग्नेशिया_की_कलीसिया_के_नाम_पत्र#HH-3">«मैग्नेशिया की कलीसिया के नाम पत्र» 3:1</a>)।</p></li><li><p>सम्भवतः उन लोगों से अभिप्राय है जो इग्नाटियस की प्रशंसा करते हुए कहते थे, “तुम शहीद बनोगे”। प्रशंसा घमण्ड की परीक्षा बनती है, इसलिए वे इसे “कोड़े” कहते हैं।</p></li><li><p>अर्थात् शहादत की उत्सुकता; इग्नाटियस डरते हैं कि कहीं उसमें घमण्ड या व्यर्थ महिमा का भाव न मिल जाए।</p></li><li><p>देखें <a href="https://bibleox.com/hi/hi-ov/1kor/3/#L1-2">1 कुरि 3:1-2</a>।</p></li><li><p>देखें <a href="https://bibleox.com/hi/hi-ov/kol/1/#L16">कुलु 1:16</a>।</p></li><li><p>“वेदी” से अभिप्राय कलीसिया है, जहाँ विश्वासी यूखरिस्त ग्रहण करने को इकट्ठे होते हैं (देखें <a href="https://bibleox.com/hi/hi/w/Ig3E_इफिसुस_की_कलीसिया_के_नाम_पत्र#HH-5">«इफिसुस की कलीसिया के नाम पत्र» 5:2</a>, <a href="https://bibleox.com/hi/hi/w/Ig3F_फिलदिलफिया_की_कलीसिया_के_नाम_पत्र#HH-4">«फिलदिलफिया की कलीसिया के नाम पत्र» अध्याय 4</a>)।</p></li><li><p><a href="https://bibleox.com/hi/hi-ov/is/52/#L5">यशा 52:5</a> (सेप्टुआजिन्ट के अनुसार)। <a href="https://bibleox.com/hi/hi-ov/rim/2/#L24">रोम 2:24</a> में भी उद्धृत।</p></li><li><p>देखें <a href="https://bibleox.com/hi/hi-ov/fil/2/#L10">फिलि 2:10</a>।</p></li><li><p>देखें <a href="https://bibleox.com/hi/hi-ov/2kor/4/#L14">2 कुरि 4:14</a>।</p></li><li><p>τὸ δοκεῖν — “केवल दिखावे में”। यह डोसेटिस्ट (आभासवादी) लोगों के विषय में है, जो कहते थे कि मसीह की सच्ची देह नहीं थी और उसका दुःख उठाना केवल दिखावा था। इग्नाटियस अध्याय 9 में बार-बार “सचमुच” कहकर उन्हें उत्तर देते हैं।</p></li><li><p>देखें <a href="https://bibleox.com/hi/hi-ov/1kor/15/#L14-15">1 कुरि 15:14-15</a>।</p></li><li><p>देखें <a href="https://bibleox.com/hi/hi-ov/mf/15/#L13">मत्ती 15:13</a>, <a href="https://bibleox.com/hi/hi/w/Ig3F_फिलदिलफिया_की_कलीसिया_के_नाम_पत्र#HH-3">«फिलदिलफिया की कलीसिया के नाम पत्र» 3:1</a>।</p></li><li><p>देखें <a href="https://bibleox.com/hi/hi-ov/1kor/12/#L27">1 कुरि 12:27</a>।</p></li><li><p>ἀδόκιμος — “निकम्मा ठहरा हुआ” (देखें <a href="https://bibleox.com/hi/hi-ov/1kor/9/#L27">1 कुरि 9:27</a>)।</p></li><li><p>देखें <a href="https://bibleox.com/hi/hi-ov/1kor/15/#L8-9">1 कुरि 15:8-9</a>।</p></li><li><p>ἁγνίζεται ὑμῶν τὸ ἐμὸν πνεῦμα। वही समर्पण का वाक्य जो <a href="https://bibleox.com/hi/hi/w/Ig3E_इफिसुस_की_कलीसिया_के_नाम_पत्र#HH-8">«इफिसुस की कलीसिया के नाम पत्र» 8:1</a> में है।</p></li><li><p>देखें <a href="https://bibleox.com/hi/hi-ov/1sol/5/#L24">1 थिस्स 5:24</a>।</p></li></ol>
      <p>अनुवाद: रोडियन व्लासोव (एआई उपकरणों की सहायता से)। मूल पाठ: यूनानी मूल (<a href="https://bibleox.com/hi/grc/w/ΙγνΘ_Τραλ">इस साइट का यूनानी संस्करण</a>; स्पष्ट छूटे हुए अंश लाइटफुट और होम्स के संस्करणों से पूरे किए गए)। सहायक अनुवाद: रूसी अनुवाद («प्रारम्भिक कलीसियाई पिता», ब्रसेल्स, 1988), अंग्रेज़ी अनुवाद (Roberts–Donaldson), फ़्रांसीसी अनुवाद (Genoude, 1837)। बाइबल के उद्धरण और लिंक हिन्दी O.V. के अनुसार।</p>
