    body: |-
      <h2>0</h2><p>इग्नाटियस, जिसे थियोफोरस भी कहते हैं, आसिया के त्रालेस में स्थित उस पवित्र कलीसिया को, जो यीशु मसीह के पिता परमेश्वर की प्रिय है, चुनी हुई और परमेश्वर के योग्य है, और हमारी आशा यीशु मसीह के दुःखभोग के द्वारा, और उसमें हमारे पुनरुत्थान के द्वारा, शरीर और आत्मा में शान्ति पाती है: मैं प्रेरितों की रीति पर इसे भरपूर नमस्कार कहता हूँ[1], और इसके बहुत आनन्द की कामना करता हूँ।</p>
      <h2>1</h2><p>1. मैंने जाना है कि तुम धीरज में निर्दोष और अडिग मन रखते हो—आदत से नहीं, स्वभाव से। यह मुझे तुम्हारे बिशप पोलिबियुस ने बताया, जो परमेश्वर और यीशु मसीह की इच्छा से स्मुरना आया और मसीह यीशु में बँधे हुए मेरे साथ ऐसा आनन्दित हुआ कि मैंने उसमें तुम्हारी सारी मण्डली को देख लिया।</p><p>2. इसलिए मैंने उसके द्वारा परमेश्वर के अनुसार तुम्हारी सद्भावना ग्रहण करके परमेश्वर की महिमा की, क्योंकि मैंने पाया कि तुम, जैसा मैं जानता था, परमेश्वर का अनुकरण करनेवाले हो[2]।</p>
      <h2>2</h2><p>1. जब तुम बिशप के अधीन ऐसे रहते हो जैसे यीशु मसीह के, तब मुझे लगता है कि तुम मनुष्यों के अनुसार नहीं, परन्तु यीशु मसीह के अनुसार जीते हो, जो हमारे लिए मरा, ताकि तुम उसकी मृत्यु पर विश्वास करके मृत्यु से बच जाओ।</p><p>2. इसलिए आवश्यक है—जैसा तुम करते भी हो—कि तुम बिशप के बिना कुछ न करो, परन्तु पुरोहित-मण्डल के भी ऐसे अधीन रहो जैसे हमारी आशा यीशु मसीह के प्रेरितों के; यदि हम उसमें चलते रहें, तो उसी में पाए जाएँगे।</p><p>3. यीशु मसीह के भेदों के सेवक डीकनों[3] को भी हर प्रकार से सबको प्रसन्न रखना चाहिए; क्योंकि वे खाने-पीने के सेवक नहीं, परन्तु परमेश्वर की कलीसिया के सेवक हैं[4]। इसलिए उन्हें दोषारोपण से ऐसे बचना चाहिए जैसे आग से।</p>
      <h2>3</h2><p>1. इसी प्रकार सब लोग डीकनों का ऐसे आदर करें जैसे यीशु मसीह का, और बिशप का ऐसे जैसे पिता के प्रतिरूप[5] का, और पुरोहितों का ऐसे जैसे परमेश्वर की सभा और प्रेरितों की मण्डली का। इनके बिना कोई कलीसिया नहीं कहलाती।</p><p>2. मुझे निश्चय है कि तुम इन बातों में ऐसे ही हो। क्योंकि तुम्हारे प्रेम का जीवित नमूना मैंने तुम्हारे बिशप में पाया है, और वह अब भी मेरे साथ है; उसका आचरण ही एक बड़ी शिक्षा है, और उसकी नम्रता ही सामर्थ्य है; मैं समझता हूँ कि परमेश्वर को न माननेवाले भी उसका आदर करेंगे।</p><p>3. तुमसे प्रेम करने के कारण मैं संयम रखता हूँ, यद्यपि इस विषय में और कड़ाई से लिख सकता था। मैंने यह नहीं सोचा कि दण्ड पाया हुआ होकर मैं प्रेरित के समान तुम्हें आज्ञा दूँ।</p>
      <h2>4</h2><p>1. मैं परमेश्वर में बहुत सी बातें समझता हूँ, परन्तु अपने आप को नापता हूँ, ताकि घमण्ड से नाश न हो जाऊँ। क्योंकि अब मुझे और अधिक डरना चाहिए, और उन पर ध्यान न देना चाहिए जो मुझे फुलाते हैं; क्योंकि जो मुझसे (प्रशंसा की बातें) कहते हैं, वे मुझे कोड़े मारते हैं[6]।</p><p>2. मैं दुःख उठाने से प्रेम तो करता हूँ, परन्तु नहीं जानता कि मैं योग्य हूँ या नहीं। यह उत्सुकता बहुतों को दिखाई नहीं देती, परन्तु मुझसे और अधिक लड़ती है[7]। इसलिए मुझे नम्रता की आवश्यकता है, जिसके द्वारा इस संसार का सरदार नष्ट किया जाता है।</p>
      <h2>5</h2><p>1. क्या मैं तुम्हें स्वर्गीय बातें नहीं लिख सकता? परन्तु डरता हूँ कि कहीं तुम्हें, जो अभी बालक हो, हानि न पहुँचाऊँ[8]। मुझे क्षमा करो, कहीं ऐसा न हो कि तुम उन्हें ग्रहण न कर सको और तुम्हारा दम घुट जाए।</p><p>2. मैं भी, यद्यपि बँधा हूँ और स्वर्गीय बातों को, स्वर्गदूतों के स्थानों को, प्रधानताओं के दलों को, दृश्य और अदृश्य बातों[9] को समझ सकता हूँ, तौभी इस कारण अभी चेला नहीं हो गया। क्योंकि परमेश्वर से वंचित न रहने के लिए हम में अभी बहुत कुछ कम है।</p>
      <h2>6</h2><p>1. इसलिए मैं तुमसे विनती करता हूँ—मैं नहीं, परन्तु यीशु मसीह का प्रेम—कि केवल मसीही भोजन ही खाओ, और पराए पौधे से, अर्थात् कुपंथ से, दूर रहो।</p><p>2. वे लोग विश्वास पाने के लिए अपनी बातों में यीशु मसीह को गूँथ लेते हैं, मानो प्राणघातक विष को शहद मिले दाखरस में मिलाकर देते हों; अनजान मनुष्य उसे खुशी से ले लेता है और बुरे सुख में मृत्यु पाता है।</p>
      <h2>7</h2><p>1. इसलिए ऐसे लोगों से सावधान रहो। और यह तब होगा जब तुम फूलोगे नहीं, और परमेश्वर यीशु मसीह से, बिशप से और प्रेरितों की आज्ञाओं से अलग नहीं होगे।</p><p>2. जो वेदी के भीतर है, वह शुद्ध है; और जो वेदी के बाहर है, वह शुद्ध नहीं[10]; अर्थात् जो बिशप, पुरोहित-मण्डल और डीकनों के बिना कुछ करता है, उसका विवेक शुद्ध नहीं।</p>
      <h2>8</h2><p>1. यह मैं इसलिए नहीं लिखता कि मैंने तुम्हारे बीच ऐसा कुछ जाना है; परन्तु तुम मेरे प्रिय हो, इसलिए शैतान के फन्दों को पहले से देखकर मैं तुम्हें सावधान करता हूँ। इसलिए तुम नम्रता धारण करके अपने आप को विश्वास में—जो प्रभु का शरीर है—और प्रेम में—जो यीशु मसीह का लहू है—नया करो।</p><p>2. तुम में से कोई अपने पड़ोसी के विरुद्ध कुछ न रखे। अन्यजातियों को अवसर न दो, ताकि कुछ मूर्खों के कारण परमेश्वर में की मण्डली की निन्दा न हो। क्योंकि “हाय उस पर, जिसके कारण मेरा नाम व्यर्थ ही कुछ लोगों में निन्दित होता है!”[11]</p>
      <h2>9</h2><p>1. इसलिए जब कोई तुमसे यीशु मसीह के बिना बात करे, तो बहरे बन जाओ। वह दाऊद के कुल का है, मरियम से है; सचमुच जन्मा, उसने खाया और पिया; पुन्तियुस पिलातुस के समय सचमुच सताया गया, स्वर्ग में, पृथ्वी पर और पृथ्वी के नीचे के लोगों के देखते हुए[12] सचमुच क्रूस पर चढ़ाया गया और मरा।</p><p>2. वह सचमुच मरे हुओं में से जी भी उठा, उसके पिता ने उसे जिलाया; और उसका पिता इसी प्रकार हम विश्वासियों को भी मसीह यीशु में जिलाएगा[13], जिसके बिना हमारे पास सच्चा जीवन नहीं।</p>
      <h2>10</h2><p>परन्तु यदि, जैसा कुछ लोग—अर्थात् परमेश्वर को न माननेवाले, अविश्वासी—कहते हैं, उसने केवल दिखावे में दुःख उठाया[14]—जबकि वे स्वयं ही केवल दिखावा हैं—तो मैं क्यों बँधा हूँ? मैं क्यों पशुओं से लड़ने की कामना करता हूँ? तब तो मैं व्यर्थ मरता हूँ; तब तो मैं प्रभु के विरुद्ध झूठ बोलता हूँ[15]।</p>
      <h2>11</h2><p>1. इसलिए उन बुरी डालियों से भागो जो प्राणघातक फल लाती हैं; यदि कोई उसे चखे, तो तुरन्त मर जाता है। क्योंकि ये पिता के लगाए हुए नहीं हैं[16]।</p><p>2. यदि होते, तो क्रूस की डालियाँ दिखाई देते, और उनका फल अविनाशी होता। उसी क्रूस के द्वारा वह अपने दुःखभोग में तुम्हें, जो उसके अंग हो, बुलाता है[17]। सिर अंगों के बिना अलग जन्म नहीं ले सकता, क्योंकि परमेश्वर एकता की प्रतिज्ञा करता है, और वह एकता वह स्वयं है।</p>
      <h2>12</h2><p>1. मैं स्मुरना से, अपने साथ उपस्थित परमेश्वर की कलीसियाओं समेत, तुम्हें नमस्कार कहता हूँ; उन्होंने हर बात में, शरीर और आत्मा दोनों में, मुझे विश्राम दिया।</p><p>2. मेरी बेड़ियाँ, जिन्हें मैं यीशु मसीह के लिए लिए फिरता हूँ और परमेश्वर तक पहुँचने की विनती करता हूँ, तुमसे विनती करती हैं: अपनी एकमनता में और एक दूसरे के लिए प्रार्थना में बने रहो। तुम में से हर एक के लिए, विशेषकर पुरोहितों के लिए, उचित है कि पिता, यीशु मसीह और प्रेरितों के आदर के लिए बिशप को विश्राम दें।</p><p>3. मैं चाहता हूँ कि तुम प्रेम से मेरी सुनो, ताकि जो मैंने लिखा वह तुम्हारे विरुद्ध गवाही न बने। मेरे लिए भी प्रार्थना करो, क्योंकि परमेश्वर की दया में मुझे तुम्हारे प्रेम की आवश्यकता है, ताकि मैं उस भाग के योग्य ठहरूँ जिसे पाने को मैं ठहराया गया हूँ, और निकम्मा न ठहरूँ[18]।</p>
      <h2>13</h2><p>1. स्मुरना और इफिसुस के लोगों का प्रेम तुम्हें नमस्कार कहता है। अपनी प्रार्थनाओं में सीरिया की कलीसिया को स्मरण करो, जिसका सदस्य कहलाने के भी मैं योग्य नहीं, क्योंकि मैं उनमें सबसे छोटा हूँ[19]।</p><p>2. यीशु मसीह में तुम्हारा कल्याण हो; बिशप के अधीन ऐसे रहो जैसे आज्ञा के, और वैसे ही पुरोहित-मण्डल के भी। और तुम में से हर एक अविभाजित मन से एक दूसरे से प्रेम करे।</p><p>3. मेरी आत्मा तुम्हारे लिए अर्पित है[20], केवल अब ही नहीं, परन्तु तब भी जब मैं परमेश्वर तक पहुँचूँगा। क्योंकि मैं अभी संकट में हूँ; परन्तु पिता यीशु मसीह में विश्वासयोग्य है कि मेरी और तुम्हारी विनती पूरी करे[21]। उसी में तुम निर्दोष पाए जाओ।</p>
