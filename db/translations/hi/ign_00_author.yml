    meta_desc: अन्ताकिया के संत इग्नाटियस (थियोफोरस, “परमेश्वर को धारण करनेवाला”) का जीवन, उनके सात पत्र, और इन पत्रों में प्रगट प्राचीन कलीसिया का विश्वास।
    # пункт-заготовка с калькой «इग्नाटियस बोगोनोसेट्स» заполняется и переименовывается
    menu: { parent: "पहली शताब्दी", title: "अन्ताकिया के इग्नाटियस, पवित्र शहीद (~35-107)", replace: "इग्नाटियस बोगोनोसेट्स, शहीद पवित्र (~35-107)" }
    body: |-
      <p>इग्नाटियस की रचनाएँ यूनानी मूल में पढ़ने के लिए <a href="https://bibleox.com/hi/grc/w/Ιγνάτιος_Θεοφόρος_Αντιοχείας">यहाँ</a> देखें। रचनाओं की सूची के ऊपर दूसरी भाषाएँ भी चुनी जा सकती हैं।</p><p><strong>स्मृति-दिवस</strong>: 20 दिसम्बर (नए कैलेंडर से 2 जनवरी), 29 जनवरी (नए कैलेंडर से 11 फरवरी)</p><h2>जीवन</h2><p>इग्नाटियस के जीवन के विषय में बहुत कम ज्ञात है। एक परम्परा कहती है कि वही वह बालक था जिसे मसीह ने गोद में लेकर आशीष दी (<a href="https://bibleox.com/hi/hi-ov/mf/18/#L2-5">मत्ती 18:2-5</a>); परन्तु अधिकांश विद्वान इसे बाद की कथा मानते हैं।</p><p>उसके पत्रों की शैली के आधार पर कुछ लोग मानते हैं कि वह सीरियाई था। इतना स्पष्ट है कि वह उन सबसे आरम्भिक मसीही लेखकों में से एक था जो यहूदी मूल के नहीं थे, या कम से कम यहूदी धर्म की संस्कृति में नहीं पले थे। कैसरिया के यूसेबियस के «कलीसिया का इतिहास» के अनुसार, सम्राट त्राजान के शासन में वह अन्ताकिया में बन्दी बनाया गया और मृत्युदण्ड के लिए रोम भेजा गया। यात्रा में उसने उन नगरों की कलीसियाओं को, जिनसे होकर वह गुज़रा (इफिसुस, मैग्नेशिया, त्रालेस, फिलदिलफिया, स्मुरना और रोम), सात पत्र लिखे, और उनमें से <a href="https://bibleox.com/hi/hi/w/Ig3P_पॉलीकार्प_के_नाम_पत्र">एक</a> स्मुरना के बिशप पॉलीकार्प को। रोम पहुँचकर 20 दिसम्बर 107 को वह शेरों के आगे डाल दिया गया और शहीद हुआ।</p><p>पॉलीकार्प इग्नाटियस के पत्र के विषय में लिखता है:</p><blockquote><p>“तुमने और इग्नाटियस ने <strong>मुझे लिखा</strong> कि यदि कोई सीरिया जाए, तो तुम्हारे पत्र भी वहाँ ले जाए” (<a href="https://bibleox.com/hi/en/w/Plk_Ph#HH-13">पॉलीकार्प, «फिलिप्पी की कलीसिया के नाम पत्र», अध्याय 13 (अंग्रेज़ी)</a>)</p></blockquote><p>पॉलीकार्प ने इग्नाटियस के पत्रों और उसके विषय में ज्ञात सब बातों को इकट्ठा किया, उनकी प्रतियाँ बनाईं और उन्हें फैलाया:</p><blockquote><p>“<strong>इग्नाटियस के जो पत्र उसने हमें भेजे, और हमारे पास के दूसरे पत्र, जैसा तुमने कहा था, हमने तुम्हें भेज दिए हैं</strong>; वे इस पत्र के साथ लगे हैं। उनसे तुम्हें बड़ा लाभ हो सकता है, क्योंकि उनमें विश्वास, धीरज और हमारे प्रभु में हर प्रकार की उन्नति की शिक्षा है। <strong>स्वयं इग्नाटियस और उसके साथियों के विषय में तुम्हें कोई निश्चित समाचार मिले, तो हमें बताना</strong>” (<a href="https://bibleox.com/hi/en/w/Plk_Ph#HH-13">पॉलीकार्प, «फिलिप्पी की कलीसिया के नाम पत्र», अध्याय 13 (अंग्रेज़ी)</a>)</p></blockquote><p>कैसरिया का यूसेबियस (तीसरी–चौथी शताब्दी) भी इग्नाटियस के विषय में विस्तार से लिखता है, उसके सातों पत्रों को गिनाता है और कुछ को “शब्दशः” उद्धृत करता है:</p><blockquote><p>5. स्मुरना में, जहाँ पॉलीकार्प था, रहते हुए उसने <strong>इफिसुस</strong> की कलीसिया को एक पत्र लिखा, जिसमें उसके चरवाहे उनेसिमुस का उल्लेख है; दूसरा मियान्दर नदी के किनारे <strong>मैग्नेशिया</strong> की कलीसिया को, जिसमें बिशप दमास का उल्लेख है; और एक <strong>त्रालेस</strong> की कलीसिया को, जिसके विषय में वह लिखता है कि उस समय उसका अगुवा पोलिबियुस था।</p><p>6. इनके अतिरिक्त उसने <strong>रोम</strong> की कलीसिया को भी लिखा, और विनती की कि वे उसके लिए सिफ़ारिश करके उसकी शहादत की आशा न छीनें। जो कहा गया है उसके प्रमाण में उस पत्र का एक छोटा सा अंश उद्धृत करना उचित होगा। वह शब्दशः यों लिखता है:</p><p>〈पत्र का अधिकांश भाग उद्धृत है〉</p><p>10. उसने ऊपर बताए नगर से इन कलीसियाओं को लिखा। स्मुरना छोड़ने के बाद उसने त्रोआस से <strong>फिलदिलफिया</strong> के लोगों को, और <strong>स्मुरना</strong> की कलीसिया को, और विशेषकर उसके अगुवे <strong>पॉलीकार्प</strong> को लिखा। उसे प्रेरितों जैसा मनुष्य भली-भाँति जानते हुए, उसने एक सच्चे और भले चरवाहे के समान अन्ताकिया की अपनी झुण्ड उसे सौंपी और उससे यत्न से उसकी देखभाल करने को कहा।</p><p>11. स्मुरनावासियों को लिखते हुए वह मसीह के विषय में ये शब्द कहता है—मैं नहीं जानता कि उसने इन्हें कहाँ से लिया: “क्योंकि मैं जानता हूँ और विश्वास करता हूँ कि पुनरुत्थान के बाद भी वह शरीर में था। और जब वह पतरस और उसके साथियों के पास आया, तो उनसे कहा: ‘मुझे छूकर देखो कि मैं बिना देह की दुष्टात्मा नहीं हूँ।’ और उन्होंने तुरन्त उसे छुआ और विश्वास किया” («स्मुरना की कलीसिया के नाम पत्र» <a href="https://bibleox.com/hi/hi/w/Ig3S_स्मुरना_की_कलीसिया_के_नाम_पत्र#HH-3">3:1-2</a>)।</p></blockquote><p>(<a href="https://bibleox.com/hi/en/w/eusebius-the-church-history-3#HH-Ignatius-and-His-Epistles">यूसेबियस, «कलीसिया का इतिहास», पुस्तक 3, अध्याय 36 (अंग्रेज़ी)</a>)</p><p>यूसेबियस ल्योन के इरेनियस (दूसरी शताब्दी) की एक खोई हुई रचना से एक अंश भी उद्धृत करता है, जिसमें इरेनियस इग्नाटियस के रोम की कलीसिया के नाम पत्र को उद्धृत करता है:</p><blockquote><p>12. <strong>इरेनियस भी</strong> उसकी शहादत जानता था और <strong>उसके पत्रों का उल्लेख करते हुए</strong> कहता है: “जैसा हम में से एक ने, जिसे परमेश्वर की गवाही के कारण पशुओं के आगे डालने का दण्ड मिला था, [<strong>रोम की कलीसिया के नाम पत्र में</strong>] कहा: ‘मैं परमेश्वर का गेहूँ हूँ, और पशुओं के दाँतों से पीसा जाऊँगा, ताकि परमेश्वर की शुद्ध रोटी पाया जाऊँ।’[1]”</p><p>13. पॉलीकार्प भी अपने नाम से प्रसिद्ध फिलिप्पियों के नाम पत्र में इन्हीं बातों का उल्लेख करता है।</p></blockquote><p>(<a href="https://bibleox.com/hi/en/w/eusebius-the-church-history-3#HH-Ignatius-and-His-Epistles">यूसेबियस, «कलीसिया का इतिहास», पुस्तक 3, अध्याय 36 (अंग्रेज़ी)</a>)</p><p>स्ट्रिडोन के संत <a href="https://bibleox.com/hi/en/w/3v5Z_Jerome_of_Stridon_4th_c">जेरोम</a> (लगभग 347–419) भी इग्नाटियस के पत्रों को गिनाते हैं:</p><blockquote><p>इग्नाटियस, प्रेरित पतरस से गिनती में अन्ताकिया की कलीसिया का तीसरा बिशप, रोम भेजा गया; और स्मुरना पहुँचकर, जहाँ यूहन्ना का चेला पॉलीकार्प बिशप था, उसने एक पत्र <strong>इफिसियों</strong> को, एक <strong>मैग्नेशियावासियों</strong> को, एक <strong>त्रालेसवासियों</strong> को और एक <strong>रोमियों</strong> को लिखा; और वहाँ से चलकर उसने <strong>फिलदिलफियावासियों</strong> और <strong>स्मुरनावासियों</strong> को, और विशेषकर <strong>पॉलीकार्प</strong> को लिखा, और अन्ताकिया की कलीसिया उसे सौंपी।</p></blockquote><p>(जेरोम, «प्रसिद्ध पुरुषों के विषय में», अध्याय 16, <a href="https://azbyka.ru/otechnik/Ieronim_Stridonskij/o_znamenityh/1_9#sel=63:1,63:52">रूसी अनुवाद</a>)</p><h2>विश्वास</h2><h3>मसीह परमेश्वर है</h3><blockquote><p>“वैद्य एक ही है: <strong>शारीरिक भी और आत्मिक भी; जन्मा हुआ भी और अजन्मा भी; <mark>मनुष्य में परमेश्वर</mark>; मृत्यु में सच्चा जीवन; मरियम से भी और परमेश्वर से भी; पहले दुःख उठाने योग्य, फिर दुःख से परे—<mark>हमारा प्रभु यीशु मसीह</mark></strong>” («इफिसुस की कलीसिया के नाम पत्र» <a href="https://bibleox.com/hi/hi/w/Ig3E_इफिसुस_की_कलीसिया_के_नाम_पत्र#HH-7">7:2</a>)</p></blockquote><blockquote><p>“क्योंकि <strong><mark>हमारा परमेश्वर यीशु मसीह</mark></strong>, परमेश्वर के प्रबन्ध के अनुसार, मरियम के गर्भ में आया—दाऊद के वंश से, और पवित्र आत्मा से” («इफिसुस की कलीसिया के नाम पत्र» <a href="https://bibleox.com/hi/hi/w/Ig3E_इफिसुस_की_कलीसिया_के_नाम_पत्र#HH-18">18:2</a>)</p></blockquote><blockquote><p>“तब से सारा जादू-टोना टूट गया और बुराई का हर बन्धन मिट गया; अज्ञान दूर हुआ, पुराना राज्य नष्ट हुआ; क्योंकि <strong><mark>परमेश्वर मनुष्य के रूप में प्रगट हुआ</mark></strong> और अनन्त जीवन की नवीनता लाया” («इफिसुस की कलीसिया के नाम पत्र» <a href="https://bibleox.com/hi/hi/w/Ig3E_इफिसुस_की_कलीसिया_के_नाम_पत्र#HH-19">19:3</a>)</p></blockquote><blockquote><p>“जो कुछ दिखाई देता है, उसमें कुछ भी अच्छा नहीं। क्योंकि <strong><mark>हमारा परमेश्वर यीशु मसीह</mark></strong> पिता में होकर और अधिक प्रगट है” («रोम की कलीसिया के नाम पत्र» <a href="https://bibleox.com/hi/hi/w/Ig3R_रोम_की_कलीसिया_के_नाम_पत्र#HH-3">3:3</a>)</p></blockquote><blockquote><p>“मैं <strong><mark>यीशु मसीह परमेश्वर</mark></strong> की महिमा करता हूँ, जिसने तुम्हें ऐसा बुद्धिमान बनाया। क्योंकि मैंने देखा कि तुम अटल विश्वास में सिद्ध हो, मानो शरीर और आत्मा दोनों में प्रभु यीशु मसीह के क्रूस पर कीलों से जड़े गए हो, और मसीह के लहू के द्वारा प्रेम में स्थिर हो; हमारे प्रभु के विषय में तुम पूरा निश्चय रखते हो कि वह शरीर के अनुसार सचमुच दाऊद के कुल का है” («स्मुरना की कलीसिया के नाम पत्र» <a href="https://bibleox.com/hi/hi/w/Ig3S_स्मुरना_की_कलीसिया_के_नाम_पत्र#HH-1">1:1</a>)</p></blockquote><blockquote><p>“मैं उसे नमस्कार कहता हूँ जो सीरिया जाने के योग्य ठहराया जाएगा। अनुग्रह सदा उसके साथ रहे, और उसे भेजनेवाले पॉलीकार्प के साथ। मैं प्रार्थना करता हूँ कि तुम <strong><mark>हमारे परमेश्वर यीशु मसीह</mark></strong> में सदा कुशल से रहो” («पॉलीकार्प के नाम पत्र» <a href="https://bibleox.com/hi/hi/w/Ig3P_पॉलीकार्प_के_नाम_पत्र#HH-8">8:2-3</a>)</p></blockquote><h3>परमेश्वर मरियम से जन्मा</h3><blockquote><p>“वैद्य एक ही है: <strong>शारीरिक भी और आत्मिक भी; <mark>जन्मा हुआ</mark> भी और अजन्मा भी; <mark>मनुष्य में परमेश्वर</mark>; मृत्यु में सच्चा जीवन; <mark>मरियम से</mark> भी और परमेश्वर से भी; पहले दुःख उठाने योग्य, फिर दुःख से परे—<mark>हमारा प्रभु यीशु मसीह</mark></strong>” («इफिसुस की कलीसिया के नाम पत्र» <a href="https://bibleox.com/hi/hi/w/Ig3E_इफिसुस_की_कलीसिया_के_नाम_पत्र#HH-7">7:2</a>)</p></blockquote><h3>यूखरिस्त प्रतीक नहीं, यीशु मसीह का सच्चा शरीर और लहू है</h3><p>इग्नाटियस कुपंथियों पर यह दोष लगाते हैं कि वे नहीं मानते कि यूखरिस्त यीशु मसीह का वह शरीर है जिसने दुःख उठाया और जिसे पिता ने जिलाया। यह सम्भव नहीं कि कुपंथी यह न मानते हों कि यूखरिस्त मसीह के शरीर का केवल प्रतीक है—किसी प्रतीक पर अविश्वास करना सोचना भी बेतुका है। वे यही नहीं मानते थे कि यूखरिस्त में दुःख उठानेवाला और जी उठनेवाला मसीह का शरीर स्वयं है, जैसा आगे कहा गया है:</p><blockquote><p>“कोई धोखा न खाए: स्वर्गीय वस्तुएँ, स्वर्गदूतों की महिमा, और दृश्य तथा अदृश्य प्रधान भी, <strong><mark>यदि मसीह के लहू पर विश्वास न करें, तो उनका भी न्याय होगा</mark></strong>। “जो ग्रहण कर सकता है, वह ग्रहण करे।” 〈…〉 वे (कुपंथी) यूखरिस्त और प्रार्थना से दूर रहते हैं, क्योंकि वे नहीं मानते कि <strong><mark>यूखरिस्त हमारे उद्धारकर्ता यीशु मसीह का वह शरीर है जिसने हमारे पापों के लिए दुःख उठाया और जिसे पिता ने अपनी भलाई से जिलाया</mark></strong>। इस प्रकार <strong>परमेश्वर के वरदान का विरोध करनेवाले</strong> अपने विवादों में <strong>मर जाते हैं</strong>” («स्मुरना की कलीसिया के नाम पत्र» <a href="https://bibleox.com/hi/hi/w/Ig3S_स्मुरना_की_कलीसिया_के_नाम_पत्र#HH-6">6:1</a>, <a href="https://bibleox.com/hi/hi/w/Ig3S_स्मुरना_की_कलीसिया_के_नाम_पत्र#HH-7">7:1</a>)</p></blockquote><h3>मसीही अपने को पहले से उद्धार पाया हुआ नहीं मानता</h3><blockquote><p>“<strong><mark>आरम्भ तो अच्छा प्रबन्धित है, </mark><u><mark>यदि</mark></u><mark> मैं यह अनुग्रह पाऊँ कि अपना भाग बिना रुकावट प्राप्त करूँ</mark></strong>। परन्तु मैं तुम्हारे प्रेम से डरता हूँ कि कहीं वही मुझे हानि न पहुँचाए। क्योंकि तुम्हारे लिए जो चाहो करना सहज है, परन्तु यदि तुम मुझ पर तरस खाओ, तो <strong><mark>मेरे लिए परमेश्वर तक पहुँचना कठिन है</mark></strong>। 〈…〉 <strong><mark>मेरे लिए विनती करो कि मैं पहुँच जाऊँ</mark></strong>। मैंने तुम्हें शरीर के अनुसार नहीं, परन्तु परमेश्वर की इच्छा के अनुसार लिखा है। यदि मैं दुःख उठाऊँ, तो तुमने मेरा भला चाहा; यदि मैं ठुकराया जाऊँ, तो तुमने मुझसे बैर किया। 〈…〉 पर <strong>मैं उनमें गिने जाने से लज्जित हूँ, क्योंकि मैं इसके योग्य नहीं, मैं उनमें सबसे छोटा और अधूरे दिनों का जन्मा हूँ</strong>; परन्तु <strong><u><mark>यदि</mark></u><mark> मैं परमेश्वर तक पहुँचूँ, तो मुझ पर दया हुई है कि मैं कुछ बनूँ</mark></strong>। मेरी आत्मा और उन कलीसियाओं का प्रेम तुम्हें नमस्कार कहता है जिन्होंने मुझे यीशु मसीह के नाम में ग्रहण किया, राहगीर के समान नहीं” («रोम की कलीसिया के नाम पत्र» <a href="https://bibleox.com/hi/hi/w/Ig3R_रोम_की_कलीसिया_के_नाम_पत्र#HH-1">1:2</a>, <a href="https://bibleox.com/hi/hi/w/Ig3R_रोम_की_कलीसिया_के_नाम_पत्र#HH-8">8:3</a>, <a href="https://bibleox.com/hi/hi/w/Ig3R_रोम_की_कलीसिया_के_नाम_पत्र#HH-9">9:2-3</a>)</p></blockquote><h3>मसीही अपने कामों से पहचाना जाता है</h3><blockquote><p>“विश्वास का अंगीकार करनेवाला पाप नहीं करता, और प्रेम पानेवाला बैर नहीं रखता। “पेड़ अपने फल से पहचाना जाता है।” वैसे ही <strong><mark>जो अपने को मसीह का कहते हैं, वे </mark><u><mark>अपने कामों से पहचाने जाएँगे</mark></u></strong>। अब बात केवल अंगीकार की नहीं, परन्तु इस की है कि कोई अन्त तक विश्वास की सामर्थ्य में पाया जाए। <strong><mark>बोलते हुए (मसीही) न होने से चुप रहकर (मसीही) होना अच्छा है</mark></strong>। सिखाना अच्छा है, यदि बोलनेवाला करता भी हो” («इफिसुस की कलीसिया के नाम पत्र» <a href="https://bibleox.com/hi/hi/w/Ig3E_इफिसुस_की_कलीसिया_के_नाम_पत्र#HH-14">14:2</a>, <a href="https://bibleox.com/hi/hi/w/Ig3E_इफिसुस_की_कलीसिया_के_नाम_पत्र#HH-15">15:1</a>)</p></blockquote><blockquote><p>“तुम्हारा बपतिस्मा तुम्हारे हथियार, विश्वास टोप, प्रेम भाला, और धीरज पूरा कवच बना रहे। <strong><mark>तुम्हारे काम तुम्हारी जमा-पूँजी हों, ताकि तुम उनके योग्य भुगतान पाओ</mark></strong>” («पॉलीकार्प के नाम पत्र» <a href="https://bibleox.com/hi/hi/w/Ig3P_पॉलीकार्प_के_नाम_पत्र#HH-6">6:2</a>)</p></blockquote><h3>मसीह के लिए दुःख उठाना परमेश्वर से निकटता का चिह्न है</h3><blockquote><p>“फिर मैंने क्यों अपने आप को मृत्यु, आग, तलवार और पशुओं के हवाले किया? परन्तु <strong>तलवार के पास होना परमेश्वर के पास होना है, पशुओं के बीच होना परमेश्वर के बीच होना है—केवल यीशु मसीह के नाम में</strong>। उसके साथ दुःख उठाने के लिए मैं सब कुछ सहता हूँ, और वह, जो सिद्ध मनुष्य बना, मुझे सामर्थ्य देता है” («स्मुरना की कलीसिया के नाम पत्र» <a href="https://bibleox.com/hi/hi/w/Ig3S_स्मुरना_की_कलीसिया_के_नाम_पत्र#HH-4">4:2</a>)</p></blockquote><h3>बिशप, पुरोहितों और डीकनों के बिना कलीसिया नहीं</h3><p>अर्थात् दो-तीन लोगों का साधारण रूप से इकट्ठा होना कलीसिया नहीं है:</p><blockquote><p>“इसी प्रकार सब लोग <strong><mark>डीकनों</mark> का ऐसे <mark>आदर करें</mark> जैसे यीशु मसीह का, और <mark>बिशप</mark> का ऐसे जैसे पिता के प्रतिरूप का, और <mark>पुरोहितों</mark> का ऐसे जैसे परमेश्वर की सभा और प्रेरितों की मण्डली का। <mark>इनके बिना कोई कलीसिया नहीं कहलाती</mark>। </strong>मुझे निश्चय है कि तुम इन बातों में ऐसे ही हो। 〈…〉 इसलिए मैं तुमसे विनती करता हूँ—मैं नहीं, परन्तु यीशु मसीह का प्रेम—कि केवल मसीही भोजन ही खाओ, और पराए पौधे से, अर्थात् कुपंथ से, दूर रहो। <strong>वे लोग विश्वास पाने के लिए अपनी बातों में यीशु मसीह को गूँथ लेते हैं, मानो प्राणघातक विष को शहद मिले दाखरस में मिलाकर देते हों; अनजान मनुष्य उसे खुशी से ले लेता है और बुरे सुख में मृत्यु पाता है</strong>” («त्रालेस की कलीसिया के नाम पत्र» <a href="https://bibleox.com/hi/hi/w/Ig3T_त्रालेस_की_कलीसिया_के_नाम_पत्र#HH-3">3:1</a>, <a href="https://bibleox.com/hi/hi/w/Ig3T_त्रालेस_की_कलीसिया_के_नाम_पत्र#HH-6">6:1-2</a>)</p></blockquote><blockquote><p>“तुम सब <strong>बिशप</strong> के पीछे ऐसे चलो जैसे यीशु मसीह पिता के, और <strong>पुरोहित-मण्डल</strong> के पीछे ऐसे जैसे प्रेरितों के; और <strong>डीकनों</strong> का ऐसे आदर करो जैसे परमेश्वर की आज्ञा का। <strong>बिशप के बिना कोई कलीसिया से सम्बन्धित कोई काम न करे</strong> (देखें <a href="https://bibleox.com/hi/en/w/councils-the-canons-of-the-holy-apostles">«पवित्र प्रेरितों के नियम», नियम 39 (अंग्रेज़ी)</a>)। वही यूखरिस्त विश्वसनीय मानी जाए जो बिशप के अधीन हो, या उसके द्वारा जिसे वह स्वयं अनुमति दे। <strong><u><mark>जहाँ बिशप दिखाई दे, वहाँ जनसमूह भी हो; जैसे जहाँ यीशु मसीह है, वहाँ काथलिक (सार्वभौमिक) कलीसिया है</mark></u></strong>। बिशप के बिना न बपतिस्मा देना उचित है, न प्रेम-भोज (अगापे) करना; परन्तु जिसे वह स्वीकार करे, वही परमेश्वर को भी भाता है, ताकि जो कुछ तुम करो वह सुरक्षित और पक्का हो। 〈…〉 परमेश्वर और बिशप को जानना अच्छा है। जो बिशप का आदर करता है, परमेश्वर उसका आदर करता है; <strong><mark>जो बिशप से छिपाकर कुछ करता है, वह शैतान की सेवा करता है</mark></strong>” («स्मुरना की कलीसिया के नाम पत्र» <a href="https://bibleox.com/hi/hi/w/Ig3S_स्मुरना_की_कलीसिया_के_नाम_पत्र#HH-8">8:1-2</a>, <a href="https://bibleox.com/hi/hi/w/Ig3S_स्मुरना_की_कलीसिया_के_नाम_पत्र#HH-9">9:1</a>)</p></blockquote><blockquote><p>“<strong><mark>तुम सब बिशप की ओर ध्यान दो, ताकि परमेश्वर भी तुम्हारी ओर ध्यान दे</mark></strong>। <strong>जो बिशप, पुरोहितों और डीकनों के अधीन रहते हैं, उनके लिए मैं अपना प्राण देता हूँ; और उनके साथ परमेश्वर में मेरा भी भाग हो</strong>। एक दूसरे के साथ मिलकर परिश्रम करो, मिलकर लड़ो, मिलकर दौड़ो, मिलकर दुःख उठाओ, मिलकर सोओ, मिलकर जागो—परमेश्वर के भण्डारियों, सहायकों और सेवकों के समान। 〈…〉 मैं प्रार्थना करता हूँ कि तुम हमारे परमेश्वर यीशु मसीह में सदा कुशल से रहो; उसी में परमेश्वर की एकता और बिशप की देखरेख में बने रहो। 〈…〉 यदि कोई प्रभु के शरीर के आदर के लिए पवित्रता में बना रह सकता है, तो बिना घमण्ड के बना रहे। <strong><mark>यदि वह घमण्ड करे, तो नाश हो गया; और यदि वह बिशप से अधिक प्रसिद्ध होना चाहे, तो बिगड़ गया</mark></strong>” («पॉलीकार्प के नाम पत्र» <a href="https://bibleox.com/hi/hi/w/Ig3P_पॉलीकार्प_के_नाम_पत्र#HH-6">6:1</a>, <a href="https://bibleox.com/hi/hi/w/Ig3P_पॉलीकार्प_के_नाम_पत्र#HH-8">8:3</a>, <a href="https://bibleox.com/hi/hi/w/Ig3P_पॉलीकार्प_के_नाम_पत्र#HH-5">5:2</a>)</p></blockquote><h3>पौरोहित्य के तीन पद (बिशप, पुरोहित, डीकन)</h3><p>संत इग्नाटियस लिखते हैं कि सीरिया की कलीसिया बिना बिशप के रह गई है: पुरोहित तो बहुत हैं, परन्तु सीरिया का बिशप केवल इग्नाटियस स्वयं था, जो अब बन्दी बनाकर मृत्युदण्ड के लिए रोम ले जाया जा रहा है। स्पष्ट है कि पुरोहित स्वयं बिशप नियुक्त नहीं कर सकते थे; नहीं तो वे शीघ्र ही ऐसा कर लेते और सीरिया बिना बिशप के न रहती:</p><blockquote><p>“अपनी प्रार्थना में <strong><mark>सीरिया की कलीसिया को स्मरण करो, जिसका चरवाहा अब मेरे स्थान पर परमेश्वर है</mark>। केवल यीशु मसीह और तुम्हारा प्रेम उसका बिशप होगा</strong>” («रोम की कलीसिया के नाम पत्र» <a href="https://bibleox.com/hi/hi/w/Ig3R_रोम_की_कलीसिया_के_नाम_पत्र#HH-9">9:1</a>)</p></blockquote><p>विशेष ध्यान देने की बात यह है कि बिशप सदा एकवचन में, और पुरोहित तथा डीकन बहुवचन में आते हैं (<a href="https://bibleox.com/ru/ru/w/трёхчинная-священническая-иерархия#HH-Тертуллиан-155-220">टर्टुलियन में भी ऐसा ही है (रूसी)</a>)। अर्थात् हर स्थान की कलीसिया का एक ही प्रधान था—बिशप, जिसके अधीन बहुत से पुरोहित (शब्दशः “उसके पुरोहित”) और डीकन थे:</p><blockquote><p>“मैं यीशु मसीह के लहू में इसे नमस्कार कहता हूँ, जो सदा का और स्थायी आनन्द है—विशेषकर तब, जब लोग <strong><mark>बिशप के साथ, और उसके साथ के पुरोहितों और डीकनों के साथ</mark></strong>, जो यीशु मसीह की इच्छा के अनुसार नियुक्त किए गए हैं, एक हों; जिन्हें प्रभु ने अपनी इच्छा से अपने पवित्र आत्मा के द्वारा दृढ़ किया है। 〈…〉 इसलिए यत्न करो कि एक ही यूखरिस्त में सहभागी हो। क्योंकि हमारे प्रभु यीशु मसीह का शरीर एक ही है, और उसके लहू की एकता के लिए कटोरा भी एक ही है, वेदी एक ही है; वैसे ही <strong><mark>बिशप भी एक ही है, पुरोहित-मण्डल और मेरे संगी दास डीकनों के साथ</mark></strong>; ताकि जो कुछ तुम करो, परमेश्वर के अनुसार करो। 〈…〉 जब मैं तुम्हारे बीच था, तब मैंने पुकारा, ऊँचे स्वर से, परमेश्वर के स्वर से कहा: “<strong><mark>बिशप, पुरोहित-मण्डल और डीकनों</mark></strong> की ओर ध्यान दो।” 〈…〉 यदि तुम चाहो, तो परमेश्वर के नाम के लिए यह असम्भव नहीं; जैसे निकटतम कलीसियाओं ने <strong><mark>बिशपों</mark> को, और दूसरों ने <mark>पुरोहितों और डीकनों</mark></strong> को भेजा है” (<a href="https://bibleox.com/hi/hi/w/Ig3F_फिलदिलफिया_की_कलीसिया_के_नाम_पत्र#HH-0">«फिलदिलफिया की कलीसिया के नाम पत्र» अभिवादन</a>, «फिलदिलफिया की कलीसिया के नाम पत्र» <a href="https://bibleox.com/hi/hi/w/Ig3F_फिलदिलफिया_की_कलीसिया_के_नाम_पत्र#HH-4">अध्याय 4</a>, <a href="https://bibleox.com/hi/hi/w/Ig3F_फिलदिलफिया_की_कलीसिया_के_नाम_पत्र#HH-7">7:1</a>, <a href="https://bibleox.com/hi/hi/w/Ig3F_फिलदिलफिया_की_कलीसिया_के_नाम_पत्र#HH-10">10:3</a>)</p></blockquote><p>दूसरे स्थानों में भी ऐसा ही है: एक बिशप (जिसकी तुलना मसीह या पिता परमेश्वर से की गई है), और उसके अधीन बहुत से पुरोहित (जिनकी तुलना प्रेरितों से की गई है) और डीकन:</p><blockquote><p>“इसी प्रकार सब लोग <strong><mark>डीकनों</mark> का ऐसे <mark>आदर करें</mark> जैसे यीशु मसीह का, और <mark>बिशप</mark> का ऐसे जैसे पिता के प्रतिरूप का, और <mark>पुरोहितों</mark> का ऐसे जैसे परमेश्वर की सभा और प्रेरितों की मण्डली का। </strong>मुझे निश्चय है कि तुम इन बातों में ऐसे ही हो। इनके बिना कोई कलीसिया नहीं कहलाती।” («त्रालेस की कलीसिया के नाम पत्र» <a href="https://bibleox.com/hi/hi/w/Ig3T_त्रालेस_की_कलीसिया_के_नाम_पत्र#HH-3">3:1</a>)</p></blockquote><blockquote><p>“तुम सब <strong><mark>बिशप</mark></strong> (एक—टिप्पणी) के पीछे ऐसे चलो जैसे यीशु मसीह पिता के, और <strong><mark>पुरोहित-मण्डल</mark></strong> के पीछे ऐसे जैसे प्रेरितों के; और <strong><mark>डीकनों</mark></strong> का ऐसे आदर करो जैसे परमेश्वर की आज्ञा का। <strong>बिशप के बिना कोई कलीसिया से सम्बन्धित कोई काम न करे</strong>। वही यूखरिस्त विश्वसनीय मानी जाए जो बिशप के अधीन हो, या उसके द्वारा जिसे वह स्वयं अनुमति दे। जहाँ बिशप दिखाई दे, वहाँ जनसमूह भी हो; जैसे जहाँ यीशु मसीह है, वहाँ काथलिक (सार्वभौमिक) कलीसिया है। बिशप के बिना न बपतिस्मा देना उचित है, न प्रेम-भोज (अगापे) करना; परन्तु जिसे वह स्वीकार करे, वही परमेश्वर को भी भाता है, ताकि जो कुछ तुम करो वह सुरक्षित और पक्का हो। 〈…〉 परमेश्वर और बिशप को जानना अच्छा है। जो बिशप का आदर करता है, परमेश्वर उसका आदर करता है; जो बिशप से छिपाकर कुछ करता है, वह शैतान की सेवा करता है” («स्मुरना की कलीसिया के नाम पत्र» <a href="https://bibleox.com/hi/hi/w/Ig3S_स्मुरना_की_कलीसिया_के_नाम_पत्र#HH-8">8:1-2</a>, <a href="https://bibleox.com/hi/hi/w/Ig3S_स्मुरना_की_कलीसिया_के_नाम_पत्र#HH-9">9:1</a>)</p></blockquote><blockquote><p>“तुम सब बिशप की ओर ध्यान दो, ताकि परमेश्वर भी तुम्हारी ओर ध्यान दे। <strong>जो बिशप, पुरोहितों और डीकनों के अधीन रहते हैं, उनके लिए मैं अपना प्राण देता हूँ; और उनके साथ परमेश्वर में मेरा भी भाग हो</strong>। एक दूसरे के साथ मिलकर परिश्रम करो, मिलकर लड़ो, मिलकर दौड़ो, मिलकर दुःख उठाओ, मिलकर सोओ, मिलकर जागो—परमेश्वर के भण्डारियों, सहायकों और सेवकों के समान। 〈…〉 मैं प्रार्थना करता हूँ कि तुम हमारे परमेश्वर यीशु मसीह में सदा कुशल से रहो; उसी में परमेश्वर की एकता और <strong>बिशप</strong> की देखरेख में बने रहो। 〈…〉 यदि कोई प्रभु के शरीर के आदर के लिए पवित्रता में बना रह सकता है, तो बिना घमण्ड के बना रहे। यदि वह घमण्ड करे, तो नाश हो गया; और यदि वह बिशप से अधिक प्रसिद्ध होना चाहे, तो बिगड़ गया” («पॉलीकार्प के नाम पत्र» <a href="https://bibleox.com/hi/hi/w/Ig3P_पॉलीकार्प_के_नाम_पत्र#HH-6">6:1</a>, <a href="https://bibleox.com/hi/hi/w/Ig3P_पॉलीकार्प_के_नाम_पत्र#HH-8">8:3</a>, <a href="https://bibleox.com/hi/hi/w/Ig3P_पॉलीकार्प_के_नाम_पत्र#HH-5">5:2</a>)</p></blockquote><h3>क्रूस मसीह और मसीहियों का साधन है</h3><blockquote><p>“क्योंकि तुम पिता के मन्दिर के पत्थर हो, पिता परमेश्वर के भवन के लिए तैयार किए गए हो, और <strong><mark>यीशु मसीह की उठानेवाली मशीन—जो क्रूस है</mark>—के द्वारा</strong>, पवित्र आत्मा को रस्सी बनाकर, <strong><mark>ऊँचाई पर उठाए जा रहे हो</mark></strong>। तुम्हारा विश्वास तुम्हें ऊपर खींचनेवाला है, और प्रेम वह मार्ग है जो परमेश्वर तक ऊपर ले जाता है” («इफिसुस की कलीसिया के नाम पत्र» <a href="https://bibleox.com/hi/hi/w/Ig3E_इफिसुस_की_कलीसिया_के_नाम_पत्र#HH-9">9:1</a>)</p></blockquote><h3>कलीसिया की एकता का मूल्य</h3><blockquote><p>“<strong><mark>एकता की चिन्ता करो, जिससे बढ़कर कुछ नहीं</mark></strong>” («पॉलीकार्प के नाम पत्र» <a href="https://bibleox.com/hi/hi/w/Ig3P_पॉलीकार्प_के_नाम_पत्र#HH-1">1:2</a>)</p></blockquote><blockquote><p>““… <strong><mark>एकता से प्रेम करो</mark>; फूट से भागो</strong>; यीशु मसीह का अनुकरण करनेवाले बनो, जैसा वह अपने पिता का था।” इसलिए मैंने एकता के लिए तैयार किए गए मनुष्य के समान अपना काम किया। <strong>जहाँ फूट और क्रोध है, वहाँ परमेश्वर वास नहीं करता</strong>। परन्तु <strong>प्रभु सब मन फिरानेवालों को <mark>क्षमा करता है, यदि वे मन फिराकर परमेश्वर की एकता</mark> और बिशप की सभा <mark>में लौट आएँ</mark></strong>” («फिलदिलफिया की कलीसिया के नाम पत्र» <a href="https://bibleox.com/hi/hi/w/Ig3F_फिलदिलफिया_की_कलीसिया_के_नाम_पत्र#HH-7">7:2</a>, <a href="https://bibleox.com/hi/hi/w/Ig3F_फिलदिलफिया_की_कलीसिया_के_नाम_पत्र#HH-8">8:1</a>)</p></blockquote><blockquote><p>“क्योंकि मुझे परमेश्वर के अति योग्य नाम का सम्मान मिला है, इसलिए जो बेड़ियाँ मैं लिए फिरता हूँ उनमें <strong>मैं कलीसियाओं का गुणगान करता हूँ, और प्रार्थना करता हूँ कि उनमें यीशु मसीह</strong>—जो हमारा सदा का जीवन है—<strong>के <mark>शरीर और आत्मा की एकता</mark></strong> हो, <strong><mark>विश्वास और प्रेम की एकता</mark></strong> हो” («मैग्नेशिया की कलीसिया के नाम पत्र» <a href="https://bibleox.com/hi/hi/w/Ig3M_मैग्नेशिया_की_कलीसिया_के_नाम_पत्र#HH-1">1:2</a>)</p></blockquote><blockquote><p>“<strong><mark>तुम्हारे बीच कोई ऐसी बात न हो जो तुम्हें बाँट सके</mark>; परन्तु <mark>बिशप</mark> और अगुवों के साथ <mark>एक हो जाओ</mark></strong>, अविनाशिता के चिह्न और शिक्षा के रूप में” («मैग्नेशिया की कलीसिया के नाम पत्र» <a href="https://bibleox.com/hi/hi/w/Ig3M_मैग्नेशिया_की_कलीसिया_के_नाम_पत्र#HH-6">6:2</a>)</p></blockquote><blockquote><p>“बिशप के और एक दूसरे के अधीन रहो, जैसे यीशु मसीह पिता के और प्रेरित मसीह और पिता के अधीन रहे, <strong>ताकि <mark>एकता शारीरिक भी हो और आत्मिक भी</mark></strong>” («मैग्नेशिया की कलीसिया के नाम पत्र» <a href="https://bibleox.com/hi/hi/w/Ig3M_मैग्नेशिया_की_कलीसिया_के_नाम_पत्र#HH-13">13:2</a>)</p></blockquote><blockquote><p>“यह नहीं कि मैंने तुम्हारे बीच फूट पाई, परन्तु छनकर शुद्ध होना पाया। <strong>क्योंकि जितने परमेश्वर के और यीशु मसीह के हैं, वे बिशप के साथ हैं; और <mark>जितने मन फिराकर कलीसिया की एकता में आएँगे, वे भी परमेश्वर के होंगे</mark></strong>, ताकि यीशु मसीह के अनुसार जीवन बिताएँ। हे मेरे भाइयो, धोखा न खाओ: <strong>यदि कोई फूट डालनेवाले के पीछे चलता है, तो वह परमेश्वर के राज्य का वारिस नहीं होगा</strong>” («फिलदिलफिया की कलीसिया के नाम पत्र» <a href="https://bibleox.com/hi/hi/w/Ig3F_फिलदिलफिया_की_कलीसिया_के_नाम_पत्र#HH-3">3:1-3</a>)</p></blockquote><blockquote><p>“<strong>न यह प्रयत्न करो कि जो तुम अलग से करते हो वह तुम्हें उचित लगे</strong>; परन्तु इकट्ठे होकर एक ही प्रार्थना, एक ही विनती, एक ही मन, प्रेम में और निर्दोष आनन्द में एक ही आशा हो” («मैग्नेशिया की कलीसिया के नाम पत्र» <a href="https://bibleox.com/hi/hi/w/Ig3M_मैग्नेशिया_की_कलीसिया_के_नाम_पत्र#HH-7">7:1</a>)</p></blockquote><h3>संन्यास-जीवन</h3><blockquote><p>“यदि कोई प्रभु के शरीर के आदर के लिए पवित्रता में बना रह सकता है, तो बिना घमण्ड के बना रहे” («पॉलीकार्प के नाम पत्र» <a href="https://bibleox.com/hi/hi/w/Ig3P_पॉलीकार्प_के_नाम_पत्र#HH-5">5:2</a>)</p></blockquote><h3>कुपंथ और फूट में उद्धार सम्भव नहीं</h3><blockquote><p>“इसलिए, <strong>हे सत्य की ज्योति की सन्तानो, <mark>फूट और बुरी शिक्षाओं से भागो</mark>; जहाँ चरवाहा है, वहाँ भेड़ों के समान उसके पीछे चलो</strong>। क्योंकि बहुत से विश्वासयोग्य दिखनेवाले भेड़िये बुरे सुख के द्वारा परमेश्वर की ओर दौड़नेवालों को बन्दी बना लेते हैं; परन्तु तुम्हारी एकता में उन्हें स्थान न मिलेगा। <strong>उन बुरे पौधों से दूर रहो, जिन्हें यीशु मसीह नहीं उगाता, <mark>क्योंकि वे पिता के लगाए हुए नहीं</mark></strong>। यह नहीं कि मैंने तुम्हारे बीच फूट पाई, परन्तु छनकर शुद्ध होना पाया। <strong><mark>क्योंकि जितने परमेश्वर के और यीशु मसीह के हैं, वे बिशप के साथ हैं</mark></strong>; और जितने मन फिराकर कलीसिया की एकता में आएँगे, वे भी परमेश्वर के होंगे, ताकि यीशु मसीह के अनुसार जीवन बिताएँ। हे मेरे भाइयो, धोखा न खाओ: <strong><mark>यदि कोई फूट डालनेवाले के पीछे चलता है, तो वह परमेश्वर के राज्य का वारिस नहीं होगा; यदि कोई पराए मत पर चलता है, तो वह (मसीह के) दुःखभोग से सहमत नहीं</mark></strong>। 〈…〉 <strong>जहाँ फूट और क्रोध है, वहाँ परमेश्वर वास नहीं करता</strong>। परन्तु <strong>प्रभु सब मन फिरानेवालों को क्षमा करता है, यदि वे मन फिराकर परमेश्वर की एकता और बिशप की सभा में लौट आएँ</strong>” («फिलदिलफिया की कलीसिया के नाम पत्र» <a href="https://bibleox.com/hi/hi/w/Ig3F_फिलदिलफिया_की_कलीसिया_के_नाम_पत्र#HH-2">अध्याय 2</a>, <a href="https://bibleox.com/hi/hi/w/Ig3F_फिलदिलफिया_की_कलीसिया_के_नाम_पत्र#HH-3">अध्याय 3</a>, <a href="https://bibleox.com/hi/hi/w/Ig3F_फिलदिलफिया_की_कलीसिया_के_नाम_पत्र#HH-8">8:1</a>)</p></blockquote><blockquote><p>“हे मेरे भाइयो, धोखा न खाओ: घर बिगाड़नेवाले परमेश्वर के राज्य के वारिस न होंगे। यदि शरीर के अनुसार ऐसे काम करनेवाले मर गए, तो <strong><mark>वह कितना अधिक, जो बुरी शिक्षा से परमेश्वर के उस विश्वास को बिगाड़ता है जिसके लिए यीशु मसीह क्रूस पर चढ़ाया गया? ऐसा मनुष्य अशुद्ध होकर कभी न बुझनेवाली आग में जाएगा; और उसकी सुननेवाला भी</mark></strong>। इसी लिए प्रभु ने अपने सिर पर इत्र लिया, कि कलीसिया पर अविनाशी सुगन्ध फूँके। <strong>इस संसार के सरदार की शिक्षा की दुर्गन्ध से अपने को न मलो, कहीं ऐसा न हो कि वह तुम्हें बन्दी बनाकर उस जीवन से अलग कर दे जो तुम्हारे सामने रखा है</strong>” («इफिसुस की कलीसिया के नाम पत्र» <a href="https://bibleox.com/hi/hi/w/Ig3E_इफिसुस_की_कलीसिया_के_नाम_पत्र#HH-16">अध्याय 16</a>, <a href="https://bibleox.com/hi/hi/w/Ig3E_इफिसुस_की_कलीसिया_के_नाम_पत्र#HH-17">17:1</a>)</p></blockquote><h3>कुपंथियों से अलग रहना</h3><blockquote><p>“इसलिए <strong><mark>उन बुरी डालियों से भागो जो प्राणघातक फल लाती हैं</mark></strong>; यदि कोई उसे चखे, तो तुरन्त मर जाता है। <strong><mark>क्योंकि ये पिता के लगाए हुए नहीं हैं</mark></strong>। यदि होते, तो क्रूस की डालियाँ दिखाई देते, और उनका फल अविनाशी होता” («त्रालेस की कलीसिया के नाम पत्र» <a href="https://bibleox.com/hi/hi/w/Ig3T_त्रालेस_की_कलीसिया_के_नाम_पत्र#HH-11">11:1-2</a>)</p></blockquote><h3>शरीर छोड़ने के बाद आत्मा का जीवन</h3><blockquote><p>“<strong>संसार से परमेश्वर की ओर अस्त होना अच्छा है, ताकि मैं उसमें उदय होऊँ</strong>। 〈…〉 यदि मैं (मसीही) पाया जाऊँ, तो कहला भी सकता हूँ, और <strong><mark>तब</mark> विश्वासयोग्य <mark>ठहरूँगा जब संसार को दिखाई न दूँ</mark></strong>। <strong><mark>जो कुछ दिखाई देता है, उसमें कुछ भी अच्छा नहीं</mark></strong>। 〈…〉 अब मैं चेला बनना आरम्भ कर रहा हूँ। <strong><mark>दृश्य और अदृश्य वस्तुओं में से कोई मुझसे डाह न करे, ताकि मैं यीशु मसीह तक पहुँचूँ</mark></strong>। 〈…〉 जो परमेश्वर का होना चाहता है, उसे <strong>संसार को न सौंपो</strong>, न पदार्थ से उसे भरमाओ। <strong>मुझे शुद्ध ज्योति पाने दो; <mark>वहाँ पहुँचकर मैं (सच्चा) मनुष्य बनूँगा</mark></strong>। 〈…〉 क्योंकि मैं जीवित रहते हुए तुम्हें लिखता हूँ, परन्तु मरने की लालसा रखता हूँ। मेरा प्रेम क्रूस पर चढ़ा दिया गया है, और मुझ में पदार्थ से प्रेम करनेवाली कोई आग नहीं; परन्तु जीवित जल <strong><mark>मुझ में बोलता है, और भीतर से मुझसे कहता है: “पिता के पास आ।”</mark></strong>” («रोम की कलीसिया के नाम पत्र» <a href="https://bibleox.com/hi/hi/w/Ig3R_रोम_की_कलीसिया_के_नाम_पत्र#HH-2">2:2</a>, <a href="https://bibleox.com/hi/hi/w/Ig3R_रोम_की_कलीसिया_के_नाम_पत्र#HH-3">3:2-3</a>, <a href="https://bibleox.com/hi/hi/w/Ig3R_रोम_की_कलीसिया_के_नाम_पत्र#HH-5">5:3</a>, <a href="https://bibleox.com/hi/hi/w/Ig3R_रोम_की_कलीसिया_के_नाम_पत्र#HH-6">6:2</a>, <a href="https://bibleox.com/hi/hi/w/Ig3R_रोम_की_कलीसिया_के_नाम_पत्र#HH-7">7:2</a>)</p></blockquote><h3>यहूदी व्यवस्था का अन्त</h3><blockquote><p>“<strong><mark>क्योंकि यदि हम अब तक यहूदी मत के अनुसार जीते हैं, तो मान लेते हैं कि हमने अनुग्रह नहीं पाया</mark></strong>। क्योंकि अति पवित्र भविष्यद्वक्ता मसीह यीशु के अनुसार जीते थे; इसी कारण वे सताए भी गए। उसके अनुग्रह से प्रेरित होकर उन्होंने आज्ञा न माननेवालों को निश्चय दिलाया कि परमेश्वर एक ही है, जिसने अपने पुत्र यीशु मसीह के द्वारा अपने आप को प्रगट किया; वह पुत्र उसका वचन है जो चुप्पी से निकला। 〈…〉 यदि वे, जो पुरानी रीतियों में चले थे, नई आशा तक पहुँचे, और <strong><mark>अब सब्त नहीं मानते परन्तु प्रभु के दिन के अनुसार जीते हैं</mark></strong>—जिस दिन हमारा जीवन भी उसके और उसकी मृत्यु के द्वारा उदय हुआ; <strong>कुछ लोग इस मृत्यु का इन्कार करते हैं</strong>, परन्तु इसी भेद के द्वारा हमने विश्वास पाया, और इसी के कारण धीरज धरते हैं, ताकि अपने एकमात्र गुरु यीशु मसीह के चेले पाए जाएँ। 〈…〉 इसलिए <strong>उसके चेले बनकर आओ, मसीहियत के अनुसार जीना सीखें</strong>। जो इस नाम को छोड़ किसी और नाम से पुकारा जाता है, वह परमेश्वर का नहीं। इसलिए <strong><mark>उस बुरे खमीर को, जो पुराना और खट्टा हो गया है, निकाल फेंको, और नए खमीर में, अर्थात् यीशु मसीह में, बदल जाओ</mark></strong>। उसमें नमकीन बनो, ताकि तुम में से कोई सड़ न जाए; क्योंकि गन्ध से तुम परखे जाओगे। <strong><mark>यीशु मसीह का नाम लेना और यहूदी मत के अनुसार चलना अनुचित है</mark>। क्योंकि मसीहियत ने यहूदी मत पर विश्वास नहीं किया, परन्तु यहूदी मत ने मसीहियत पर</strong>; और उसी में हर भाषा के लोग, जिन्होंने परमेश्वर पर विश्वास किया, इकट्ठे किए गए” («मैग्नेशिया की कलीसिया के नाम पत्र» <a href="https://bibleox.com/hi/hi/w/Ig3M_मैग्नेशिया_की_कलीसिया_के_नाम_पत्र#HH-8">8:1-2</a>, <a href="https://bibleox.com/hi/hi/w/Ig3M_मैग्नेशिया_की_कलीसिया_के_नाम_पत्र#HH-9">9:1</a>, <a href="https://bibleox.com/hi/hi/w/Ig3M_मैग्नेशिया_की_कलीसिया_के_नाम_पत्र#HH-10">10:1-3</a>)</p></blockquote><blockquote><p>“<strong><mark>यदि कोई तुम्हें यहूदी मत की व्याख्या सुनाए, तो उसकी न सुनो</mark>। क्योंकि खतना किए हुए मनुष्य से मसीहियत सुनना, खतनारहित से यहूदी मत सुनने से अच्छा है</strong>। परन्तु यदि ये दोनों यीशु मसीह के विषय में न बोलें, तो मेरे लिए वे समाधि-स्तम्भ और मुर्दों की कब्रें हैं, जिन पर केवल मनुष्यों के नाम लिखे हैं” («फिलदिलफिया की कलीसिया के नाम पत्र» <a href="https://bibleox.com/hi/hi/w/Ig3F_फिलदिलफिया_की_कलीसिया_के_नाम_पत्र#HH-6">6:1</a>)</p></blockquote><h3>नरक की अनन्त पीड़ा</h3><blockquote><p>“यदि शरीर के अनुसार ऐसे काम करनेवाले मर गए, तो वह कितना अधिक, जो बुरी शिक्षा से परमेश्वर के उस विश्वास को बिगाड़ता है जिसके लिए यीशु मसीह क्रूस पर चढ़ाया गया? ऐसा मनुष्य अशुद्ध होकर <strong><mark>कभी न बुझनेवाली आग</mark> में जाएगा</strong>; और उसकी सुननेवाला भी” («इफिसुस की कलीसिया के नाम पत्र» <a href="https://bibleox.com/hi/hi/w/Ig3E_इफिसुस_की_कलीसिया_के_नाम_पत्र#HH-16">16:2</a>)</p></blockquote><h3>“केवल पवित्रशास्त्र” पर विश्वास बनानेवालों को फटकार</h3><p>इग्नाटियस उन लोगों के विषय में कहते हैं जो वाद-विवाद करते हैं और जो बात पुराने नियम से सिद्ध न की जा सके उस पर विश्वास करने से इन्कार करते हैं; और जब उन्हें लिखा हुआ दिखाया जाता है, तो वे पाठ के अर्थ पर झगड़ते रहते हैं। इग्नाटियस उत्तर देते हैं कि लिखा तो है, परन्तु उनके लिए “पुराने अभिलेख” (सबसे महत्वपूर्ण) यीशु मसीह और उसका विश्वास हैं, जिसे संत इग्नाटियस ने सीधे प्रेरितों और उनके चेलों से पाया था:</p><blockquote><p>“मुझे यीशु मसीह के अनुग्रह पर विश्वास है कि वह तुम्हारे सब बन्धन खोल देगा। मैं तुमसे विनती करता हूँ कि <strong><mark>कोई काम विरोध के भाव से न करो, परन्तु मसीह से सीखी हुई बात के अनुसार करो</mark></strong>। क्योंकि <strong><mark>मैंने कुछ लोगों को कहते सुना</mark>: “<mark>यदि मैं उसे पुराने अभिलेखों में न पाऊँ, तो सुसमाचार में भी विश्वास नहीं करता</mark>।”</strong> <strong>और जब मैंने उनसे कहा, “लिखा है,” तो उन्होंने उत्तर दिया, “यही तो सिद्ध करना है।” <mark>परन्तु मेरे लिए पुराने अभिलेख यीशु मसीह है</mark></strong>; अटल अभिलेख उसका क्रूस, उसकी मृत्यु, उसका पुनरुत्थान <strong><mark>और उसके द्वारा आया विश्वास है</mark></strong>। इन्हीं में मैं तुम्हारी प्रार्थना से धर्मी ठहरना चाहता हूँ” («फिलदिलफिया की कलीसिया के नाम पत्र» <a href="https://bibleox.com/hi/hi/w/Ig3F_फिलदिलफिया_की_कलीसिया_के_नाम_पत्र#HH-8">8:1-2</a>)</p></blockquote><h2>पाठों के समय के विषय में</h2><p>इग्नाटियस के पत्रों के कई रूप मिलते हैं: छोटा, मध्यम और लम्बा। मध्यम रूप सबसे प्राचीन और सबसे प्रचलित है। तीसरी–चौथी शताब्दी में कैसरिया का यूसेबियस इसी पत्र-संग्रह का उल्लेख करता है।</p><p>अलग-अलग पत्रों का उल्लेख इससे पहले भी मिलता है। उदाहरण के लिए, दूसरी शताब्दी में इग्नाटियस का समकालीन, स्मुरना का पॉलीकार्प, इग्नाटियस के पत्र के विषय में लिखता है:</p><blockquote><p>“तुमने और इग्नाटियस ने <strong>मुझे लिखा</strong> कि यदि कोई सीरिया जाए, तो तुम्हारे पत्र भी वहाँ ले जाए” (<a href="https://bibleox.com/hi/en/w/Plk_Ph#HH-13">पॉलीकार्प, «फिलिप्पी की कलीसिया के नाम पत्र», अध्याय 13 (अंग्रेज़ी)</a>)</p></blockquote><p>पॉलीकार्प ने इग्नाटियस के पत्रों और उसके विषय में ज्ञात सब बातों को इकट्ठा किया, उनकी प्रतियाँ बनाईं और उन्हें फैलाया:</p><blockquote><p>“<strong>इग्नाटियस के जो पत्र उसने हमें भेजे, और हमारे पास के दूसरे पत्र, जैसा तुमने कहा था, हमने तुम्हें भेज दिए हैं</strong>; वे इस पत्र के साथ लगे हैं। उनसे तुम्हें बड़ा लाभ हो सकता है, क्योंकि उनमें विश्वास, धीरज और हमारे प्रभु में हर प्रकार की उन्नति की शिक्षा है। <strong>स्वयं इग्नाटियस और उसके साथियों के विषय में तुम्हें कोई निश्चित समाचार मिले, तो हमें बताना</strong>” (<a href="https://bibleox.com/hi/en/w/Plk_Ph#HH-13">पॉलीकार्प, «फिलिप्पी की कलीसिया के नाम पत्र», अध्याय 13 (अंग्रेज़ी)</a>)</p></blockquote><p>सबसे पुरानी बची हुई यूनानी हस्तलिपि (पाँचवीं शताब्दी) स्मुरना की कलीसिया के नाम पत्र की है, जिसका उल्लेख ऊपर पॉलीकार्प ने किया है। रोम की कलीसिया के नाम पत्र की यूनानी हस्तलिपियाँ काफ़ी बाद की बची हैं, परन्तु पाँचवीं शताब्दी के उसके सुरयानी और प्राचीन आर्मेनियाई अनुवाद हैं। इसके अतिरिक्त रोम, स्मुरना, पॉलीकार्प, त्रालेस और फिलदिलफिया के नाम पत्रों के चौथी शताब्दी के कॉप्टिक अनुवाद भी हैं।</p><p>कैसरिया का यूसेबियस (तीसरी–चौथी शताब्दी) ल्योन के इरेनियस (दूसरी शताब्दी) की एक खोई हुई रचना को उद्धृत करता है, जिसमें इरेनियस इग्नाटियस के रोम की कलीसिया के नाम पत्र को उद्धृत करता है:</p><blockquote><p>12. इरेनियस भी उसकी शहादत जानता था और उसके पत्रों का उल्लेख करते हुए कहता है: “जैसा हम में से एक ने, जिसे परमेश्वर की गवाही के कारण पशुओं के आगे डालने का दण्ड मिला था, कहा: ‘<strong>मैं परमेश्वर का गेहूँ हूँ, और पशुओं के दाँतों से पीसा जाऊँगा, ताकि परमेश्वर की शुद्ध रोटी पाया जाऊँ</strong>।’” («रोम की कलीसिया के नाम पत्र» <a href="https://bibleox.com/hi/hi/w/Ig3R_रोम_की_कलीसिया_के_नाम_पत्र#HH-4">4:1</a>)</p></blockquote><p>(<a href="https://bibleox.com/hi/en/w/eusebius-the-church-history-3#HH-Ignatius-and-His-Epistles">यूसेबियस, «कलीसिया का इतिहास», पुस्तक 3, अध्याय 36 (अंग्रेज़ी)</a>)</p><p>यूसेबियस मध्यम रूप के पाठ को उद्धृत करता है। यूसेबियस के उद्धरण की तुलना आज उपलब्ध पाठ से की जा सकती है। अन्तर को रेखांकित किया गया है (केवल दो शब्द अधिक हैं, जिनसे अर्थ नहीं बदलता; यहाँ यातनाओं के प्रकार गिनाए गए हैं):</p><table class="custom-table"><colgroup></colgroup><tbody><tr><td><p><strong>यूसेबियस के «कलीसिया का इतिहास» से</strong></p><p>ἀπὸ Συρίας μέχρι Ῥώμης θηριομαχῶ διὰ γῆς καὶ θαλάσσης, νυκτὸς καὶ ἡμέρας, ἐνδεδεμένος δέκα λεοπάρδοις, ὅ ἐστιν στρατιωτικὸν τάγμα, οἳ καὶ εὐεργετούμενοι χείρονες γίνονται, ἐν δὲ τοῖς ἀδικήμασιν αὐτῶν μᾶλλον μαθητεύομαι· ἀλλ' οὐ παρὰ τοῦτο δεδικαίωμαι. ὀναίμην τῶν θηρίων τῶν ἐμοὶ ἑτοίμων, ἃ καὶ εὔχομαι σύντομά μοι εὑρεθῆναι· ἃ καὶ κολακεύσω συντόμως με καταφαγεῖν, οὐχ ὥσπερ τινῶν δειλαινόμενα οὐχ ἥψαντο, κἂν αὐτὰ δὲ ἄκοντα μὴ θέλῃ, ἐγὼ προσβιάσομαι. συγγνώμην μοι ἔχετε· τί μοι συμφέρει, ἐγὼ γινώσκω, νῦν ἄρχομαι μαθητὴς εἶναι. μηδέν με ζηλώσαι τῶν ὁρατῶν καὶ ἀοράτων, ἵνα Ἰησοῦ Χριστοῦ ἐπιτύχω· πῦρ καὶ σταυρὸς θηρίων τε συστάσεις, <strong><u>___</u></strong> σκορπισμοὶ ὀστέων, συγκοπαὶ μελῶν, ἀλεσμοὶ ὅλου τοῦ σώματος, κολάσεις τοῦ διαβόλου εἰς ἐμὲ ἐρχέσθωσαν, μόνον ἵνα Ἰησοῦ Χριστοῦ ἐπιτύχω</p><p><a href="https://bibleox.com/hi/grc/w/ΕΚΚΛΗΣΙΑΣΤΙΚΗΣ_ΙΣΤΟΡΙΑΣ-3#HH-36">यूनानी मूल</a></p></td><td><p><strong>इग्नाटियस के पत्र से</strong></p><p>Ἀπὸ Συρίας μέχρι Ῥώμης θηριομαχῶ, διὰ γῆς καὶ θαλάσσης, νυκτὸς καὶ ἡμέρας, δεδεμένος δέκα λεοπάρδοις, ὅ ἐστιν στρατιωτικὸν τάγμα· οἳ καὶ εὐεργετούμενοι χείρους γίνονται. ἐν δὲ τοῖς ἀδικήμασιν αὐτῶν μᾶλλον μαθητεύομαι, ἀλλ' οὐ παρὰ τοῦτο δεδικαίωμαι. ὀναίμην τῶν θηρίων τῶν ἐμοὶ ἡτοιμασμένων καὶ εὔχομαι σύντομά μοι εὑρεθῆναι· ἃ καὶ κολακεύσω, συντόμως με καταφαγεῖν, οὐχ ὥσπερ τινῶν δειλαινόμενα οὐχ ἥψαντο. κἂν αὐτὰ δὲ ἄκοντα μὴ θελήσῃ, ἐγὼ προσβιάσομαι. συγγνώμην μοι ἔχετε· τί μοι συμφέρει, ἐγὼ γινώσκω, νῦν ἄρχομαι μαθητὴς εἶναι. μηθέν με ζηλώσαι τῶν ὁρατῶν καὶ ἀοράτων, ἵνα Ἰησοῦ Χριστοῦ ἐπιτύχω. πῦρ καὶ σταυρὸς θηρίων τε συστάσεις, <strong><u>ἀνατομαί, διαιρέσεις</u></strong>, σκορπισμοὶ ὀστέων, συγκοπὴ μελῶν, ἀλεσμοὶ ὅλου τοῦ σώματος, κακαὶ κολάσεις τοῦ διαβόλου ἐπ' ἐμὲ ἐρχέσθωσαν, μόνον ἵνα Ἰησοῦ Χριστοῦ ἐπιτύχω</p><p><a href="https://bibleox.com/hi/grc/w/ΙγνΘ_Ρωμ#HH-5">यूनानी मूल</a> (हिन्दी अनुवाद: «रोम की कलीसिया के नाम पत्र» <a href="https://bibleox.com/hi/hi/w/Ig3R_रोम_की_कलीसिया_के_नाम_पत्र#HH-5">5:3</a>)</p></td></tr></tbody></table><p>यह आवश्यक नहीं कि पत्रों का छोटा संग्रह जालसाज़ी के रूप में बना हो। प्राचीन काल में प्रसिद्ध रचनाओं को संक्षिप्त करके फिर से लिखने की रीति थी। उदाहरण के लिए, दूसरी शताब्दी में शहीद जस्टिन के चेले टेशियन ने चारों सुसमाचारों को एक रचना में जोड़ दिया—«दियातेस्सरोन»। यह रचना बहुत प्रसिद्ध हुई और लम्बे समय तक कलीसिया में पढ़ी जाती रही, कभी-कभी सुसमाचारों के स्थान पर भी; इसलिए बाद में सुसमाचारों के पाठ पर लौटने के लिए इसे हटाना पड़ा। «दियातेस्सरोन» जालसाज़ी के उद्देश्य से नहीं, बल्कि एक सहायक रचना के रूप में बनाया गया था, और इसी रूप में फैला।</p><p>«दियातेस्सरोन» के होने से यह सिद्ध नहीं होता कि सुसमाचार नकली हैं, न इससे सुसमाचारों का समय दूसरी शताब्दी तक खिसकता है; और «दियातेस्सरोन» स्वयं भी पहली शताब्दी की रचना होने का दावा नहीं करता। यह दूसरी शताब्दी की रचना है।</p><p>शहीद इग्नाटियस की रचनाओं पर विद्वानों का भरोसा काफ़ी ऊँचा है। अधिक जानकारी <a href="https://azbyka.ru/otechnik/Ignatij_Antiohijskij/ignatij-antiokhijskij-episkop-muchenik-i-proiskhozhdenie-episkopata/5">यहाँ (रूसी)</a>।</p>
    references: |-
      <ol><li><p>«रोम की कलीसिया के नाम पत्र» <a href="https://bibleox.com/hi/hi/w/Ig3R_रोम_की_कलीसिया_के_नाम_पत्र#HH-4">4:1</a>। इरेनियस और यूसेबियस के उद्धरण में “परमेश्वर की शुद्ध रोटी” है, और पत्र के पाठ में “मसीह की शुद्ध रोटी”।</p></li></ol>
      <p>इस साइट के रूसी पृष्ठ से अनुवाद: रोडियन व्लासोव (एआई उपकरणों की सहायता से)। इग्नाटियस के पत्रों के उद्धरण इस साइट पर यूनानी मूल से किए गए हिन्दी अनुवाद से लिए गए हैं। पॉलीकार्प, यूसेबियस और जेरोम के उद्धरण यूनानी और लातीनी मूल से अनुवादित हैं और रूसी अनुवाद से मिलाए गए हैं।</p>
