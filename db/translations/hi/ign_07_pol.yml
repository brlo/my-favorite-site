    body: |-
      <h2>0</h2><p>इग्नाटियस, जिसे थियोफोरस[1] भी कहते हैं, स्मुरना की कलीसिया के बिशप पॉलीकार्प को—बल्कि उस बिशप को जिसकी देखरेख स्वयं पिता परमेश्वर और प्रभु यीशु मसीह करते हैं—बहुत-बहुत नमस्कार।</p>
      <h2>1</h2><p>1. परमेश्वर में तुम्हारे उस मन को, जो अटल चट्टान पर[2] टिका हुआ है, ग्रहण करके मैं परमेश्वर की बड़ी महिमा करता हूँ कि मुझे तुम्हारा निर्दोष मुख देखने का अवसर मिला[3]; परमेश्वर में मैं तुम्हारे कारण आनन्द पाऊँ।</p><p>2. जिस अनुग्रह को तुमने पहिन रखा है, उसके द्वारा मैं तुमसे विनती करता हूँ कि अपनी दौड़ में और आगे बढ़ो, और सबको समझाओ कि उनका उद्धार हो। शारीरिक और आत्मिक, हर प्रकार की चिन्ता से अपने पद[4] को निभाओ। एकता की चिन्ता करो, जिससे बढ़कर कुछ नहीं। सबका बोझ उठाओ, जैसे प्रभु तुम्हारा उठाता है[5]; प्रेम में सबको सह लो, जैसा तुम करते भी हो।</p><p>3. निरन्तर प्रार्थना में लगे रहो[6]; जितनी समझ तुम में है उससे अधिक माँगो; न सोनेवाली आत्मा रखकर जागते रहो। हर एक से परमेश्वर के स्वभाव के अनुसार बात करो। सिद्ध पहलवान के समान सबकी बीमारियाँ उठाओ[7]। जहाँ अधिक परिश्रम है, वहाँ बड़ा लाभ है।</p>
      <h2>2</h2><p>1. यदि तुम केवल अच्छे चेलों से प्रेम करो, तो इसमें तुम्हारी क्या बड़ाई[8]? बल्कि जो अधिक बिगड़े हुए हैं, उन्हें नम्रता से अधीन करो। हर घाव एक ही मरहम से नहीं भरता। ज्वर के दौरों को गीली पट्टियों से शान्त करो।</p><p>2. सब बातों में साँप के समान बुद्धिमान और सदा कबूतर के समान भोले बनो[9]। तुम शारीरिक भी हो और आत्मिक भी, ताकि जो बातें तुम्हारे सामने दिखाई देती हैं उनसे नम्रता से व्यवहार करो; और जो अदृश्य हैं, उनके लिए माँगो कि वे तुम पर प्रगट हों[10], ताकि तुम्हें किसी बात की घटी न हो और तुम हर वरदान में बढ़ते जाओ।</p><p>3. समय तुम्हारी माँग करता है, जैसे माँझी हवा की और तूफ़ान में फँसा मनुष्य बन्दरगाह की, ताकि परमेश्वर तक पहुँचा जाए। परमेश्वर के पहलवान के समान संयमी रहो[11]; पुरस्कार अविनाशिता और अनन्त जीवन है, जिसका तुम्हें भी निश्चय है। मैं और मेरी बेड़ियाँ, जिनसे तुमने प्रेम किया, हर बात में तुम्हारे लिए बदले में दिया गया प्राण हैं।</p>
      <h2>3</h2><p>1. जो विश्वसनीय दिखते हैं पर दूसरी ही शिक्षा देते हैं, वे तुम्हें घबरा न दें। निहाई के समान दृढ़ खड़े रहो जिस पर हथौड़ा पड़ता है। मार खाकर भी जीतना महान पहलवान का काम है। विशेषकर परमेश्वर के लिए हमें सब कुछ सहना चाहिए, ताकि वह भी हमें सहे।</p><p>2. जैसे हो उससे अधिक उत्साही बनो। समयों को पहचानो। उसकी बाट जोहो जो समय से परे है, कालातीत है, अदृश्य होकर भी हमारे लिए दृश्य बना; जो छुआ नहीं जा सकता, जो दुःख से परे है, पर हमारे लिए दुःख उठाने योग्य बना; जिसने हर प्रकार से हमारे लिए सहा।</p>
      <h2>4</h2><p>1. विधवाओं की उपेक्षा न हो[12]; प्रभु के बाद तुम उनकी देखभाल करनेवाले बनो। तुम्हारी सम्मति के बिना कुछ न हो; और तुम भी परमेश्वर के बिना कुछ न करो—जैसा तुम करते भी नहीं। दृढ़ रहो।</p><p>2. सभाएँ अधिक बार हों; सबको नाम लेकर ढूँढ़ो।</p><p>3. दासों और दासियों को तुच्छ न जानो; परन्तु वे भी न फूलें, वरन् परमेश्वर की महिमा के लिए और अधिक सेवा करें, ताकि परमेश्वर से उत्तम स्वतंत्रता पाएँ[13]। वे यह न चाहें कि साझे धन से उन्हें स्वतंत्र कराया जाए, कहीं ऐसा न हो कि वे लालसा के दास पाए जाएँ।</p>
      <h2>5</h2><p>1. बुरी चालों[14] से भागो, बल्कि उनके विषय में उपदेश दो। मेरी बहनों से कहो कि प्रभु से प्रेम करें, और शरीर और आत्मा में अपने पतियों से सन्तुष्ट रहें। वैसे ही मेरे भाइयों को भी यीशु मसीह के नाम में आज्ञा दो कि अपनी पत्नियों से ऐसा प्रेम करें जैसा प्रभु ने कलीसिया से किया[15]।</p><p>2. यदि कोई प्रभु के शरीर के आदर के लिए[16] पवित्रता में बना रह सकता है, तो बिना घमण्ड के बना रहे। यदि वह घमण्ड करे, तो नाश हो गया; और यदि वह बिशप से अधिक प्रसिद्ध होना चाहे, तो बिगड़ गया। विवाह करनेवाले पुरुषों और स्त्रियों के लिए उचित है कि बिशप की सम्मति से जुड़ें[17], ताकि विवाह प्रभु के अनुसार हो, वासना के अनुसार नहीं। सब कुछ परमेश्वर के आदर के लिए हो।</p>
      <h2>6</h2><p>1. तुम सब बिशप की ओर ध्यान दो[18], ताकि परमेश्वर भी तुम्हारी ओर ध्यान दे। जो बिशप, पुरोहितों और डीकनों के अधीन रहते हैं, उनके लिए मैं अपना प्राण देता हूँ; और उनके साथ परमेश्वर में मेरा भी भाग हो। एक दूसरे के साथ मिलकर परिश्रम करो, मिलकर लड़ो, मिलकर दौड़ो, मिलकर दुःख उठाओ, मिलकर सोओ, मिलकर जागो—परमेश्वर के भण्डारियों[19], सहायकों और सेवकों के समान।</p><p>2. उसे प्रसन्न करो जिसके लिए तुम सिपाही का काम करते हो, जिससे तुम वेतन भी पाते हो[20]। तुम में से कोई भगोड़ा न पाया जाए[21]। तुम्हारा बपतिस्मा तुम्हारे हथियार, विश्वास टोप, प्रेम भाला, और धीरज पूरा कवच बना रहे[22]। तुम्हारे काम तुम्हारी जमा-पूँजी हों, ताकि तुम उनके योग्य भुगतान पाओ[23]। इसलिए नम्रता में एक दूसरे के प्रति धीरजवन्त रहो, जैसे परमेश्वर तुम्हारे प्रति है। मैं सदा तुम्हारे कारण आनन्द पाऊँ।</p>
      <h2>7</h2><p>1. क्योंकि मुझे बताया गया है कि तुम्हारी प्रार्थना से सीरिया के अन्ताकिया की कलीसिया में शान्ति है, इसलिए मैं भी परमेश्वर में निश्चिन्त होकर अधिक प्रसन्न हुआ—यदि दुःख उठाकर मैं परमेश्वर तक पहुँच जाऊँ, और तुम्हारी विनती से[24] चेला पाया जाऊँ।</p><p>2. हे परमेश्वर द्वारा अति धन्य पॉलीकार्प, उचित है कि तुम परमेश्वर के अति योग्य एक सभा बुलाओ और किसी ऐसे को चुनो[25] जिसे तुम बहुत प्रिय मानते हो और जो परिश्रम से न थके, जिसे “परमेश्वर का धावक” कहा जा सके; उसे योग्य ठहराओ कि वह सीरिया जाकर परमेश्वर की महिमा के लिए तुम्हारे अथक प्रेम की महिमा करे।</p><p>3. मसीही का अपने ऊपर अधिकार नहीं, वह अपना समय परमेश्वर को देता है। यह काम परमेश्वर का है, और तुम्हारा भी, जब तुम इसे पूरा करोगे। क्योंकि अनुग्रह में मुझे विश्वास है कि तुम परमेश्वर के योग्य भलाई के लिए तैयार हो। सत्य के प्रति तुम्हारी उत्सुकता जानकर मैंने थोड़े से शब्दों में तुमसे विनती की है।</p>
      <h2>8</h2><p>1. क्योंकि मैं (परमेश्वर की) इच्छा की आज्ञा से अचानक त्रोआस से नियापुलिस को जहाज़ से जा रहा हूँ[26], इसलिए सब कलीसियाओं को नहीं लिख सका; तुम, जिसके पास परमेश्वर का मन है, आगे की कलीसियाओं को लिखना, ताकि वे भी ऐसा ही करें—जो कर सकें वे पैदल दूत भेजें, और दूसरे तुम्हारे भेजे हुओं के हाथ पत्र—ताकि तुम, जो योग्य हो, एक अनन्त काम से महिमा पाओ।</p><p>2. मैं सबको नाम लेकर नमस्कार कहता हूँ, और एपित्रोपुस की पत्नी[27] को भी, उसके सारे घराने और बच्चों समेत। मैं अपने प्रिय अत्तालुस को नमस्कार कहता हूँ। मैं उसे नमस्कार कहता हूँ जो सीरिया जाने के योग्य ठहराया जाएगा। अनुग्रह सदा उसके साथ रहे, और उसे भेजनेवाले पॉलीकार्प के साथ।</p><p>3. मैं प्रार्थना करता हूँ कि तुम हमारे परमेश्वर यीशु मसीह में सदा कुशल से रहो; उसी में परमेश्वर की एकता और बिशप की देखरेख[28] में बने रहो। मैं आल्के को, जिसका नाम मुझे प्रिय है, नमस्कार कहता हूँ। प्रभु में तुम्हारा कल्याण हो।</p>
