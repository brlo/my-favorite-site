      <ol><li><p>त्रोआस से नियापुलिस को जहाज़ से जाने से पहले इग्नाटियस ने स्मुरना के बिशप पॉलीकार्प को यह पत्र लिखा। यह बिशप के कर्तव्यों के विषय में पासबानी उपदेश का पत्र है। अध्याय 1–5 पॉलीकार्प से व्यक्तिगत रूप से (एकवचन में) कहे गए हैं, और अध्याय 6 से पूरी कलीसिया से। पॉलीकार्प बाद में स्मुरना में शहीद हुए (लगभग 155 ई.)।</p></li><li><p>देखें <a href="https://bibleox.com/hi/hi-ov/mf/7/#L24-25">मत्ती 7:24-25</a>।</p></li><li><p>अर्थात् रोम जाते हुए स्मुरना में ठहरने के समय इग्नाटियस की पॉलीकार्प से भेंट।</p></li><li><p>τόπος — “स्थान, पद”; यहाँ बिशप का पद।</p></li><li><p>देखें <a href="https://bibleox.com/hi/hi-ov/gal/6/#L2">गला 6:2</a>।</p></li><li><p>देखें <a href="https://bibleox.com/hi/hi-ov/1sol/5/#L17">1 थिस्स 5:17</a>।</p></li><li><p>देखें <a href="https://bibleox.com/hi/hi-ov/mf/8/#L17">मत्ती 8:17</a>।</p></li><li><p>देखें <a href="https://bibleox.com/hi/hi-ov/lk/6/#L32">लूका 6:32</a>।</p></li><li><p>देखें <a href="https://bibleox.com/hi/hi-ov/mf/10/#L16">मत्ती 10:16</a>।</p></li><li><p>सामान्य व्याख्या: ताकि तुम मनुष्यों के छिपे झुकावों और मन की बातों को समझ सको।</p></li><li><p>देखें <a href="https://bibleox.com/hi/hi-ov/1kor/9/#L25">1 कुरि 9:25</a>।</p></li><li><p>देखें <a href="https://bibleox.com/hi/hi-ov/1tim/5/#L3">1 तीमु 5:3</a>।</p></li><li><p>देखें <a href="https://bibleox.com/hi/hi-ov/1kor/7/#L21-22">1 कुरि 7:21-22</a>।</p></li><li><p>κακοτεχνίαι। कुछ इसे झूठी शिक्षाओं और कुपंथ की चालें, और कुछ वाक्-चातुर्य की कलाएँ समझते हैं।</p></li><li><p>देखें <a href="https://bibleox.com/hi/hi-ov/ef/5/#L25">इफि 5:25</a>।</p></li><li><p>अर्थात् प्रभु के शरीर (मसीह की देह कलीसिया, और हमारे शरीर जिन्हें प्रभु ने अपने अंग बनाया) के आदर के लिए।</p></li><li><p>देखें <a href="https://bibleox.com/hi/hi-ov/1kor/7/#L39">1 कुरि 7:39</a> (“परन्तु केवल प्रभु में”)।</p></li><li><p>यहाँ से पत्र पूरी कलीसिया (बहुवचन) से कहा गया है।</p></li><li><p>देखें <a href="https://bibleox.com/hi/hi-ov/1kor/4/#L1-2">1 कुरि 4:1-2</a>।</p></li><li><p>देखें <a href="https://bibleox.com/hi/hi-ov/2tim/2/#L3-4">2 तीमु 2:3-4</a>। आगे की बातें रोमी सेना के जीवन की उपमाएँ हैं।</p></li><li><p>δεσέρτωρ — लातीनी desertor (भगोड़ा सिपाही) से लिया गया शब्द: हथियार छोड़कर भाग जानेवाला सैनिक।</p></li><li><p>देखें <a href="https://bibleox.com/hi/hi-ov/ef/6/#L11-17">इफि 6:11-17</a>।</p></li><li><p>δεπόσιτα और ἄκκεπτα — लातीनी deposita (जमा) और accepta (भुगतान) से लिए गए शब्द। रोमी सैनिक अपने वेतन और लूट का भाग झण्डे के नीचे जमा रखते थे और सेवा-निवृत्ति पर एक साथ पाते थे।</p></li><li><p>हस्तलिपियाँ और इस साइट का यूनानी पाठ ἐν τῇ ἀναστάσει ὑμῶν “तुम्हारे पुनरुत्थान में” पढ़ते हैं; पर लाइटफुट आदि संपादक इसे ἐν τῇ αἰτήσει ὑμῶν “तुम्हारी विनती (प्रार्थना) से” सुधारते हैं, और यह अनुवाद उसी के अनुसार है। हस्तलिपियों के अनुसार अर्थ होगा: “(अन्तिम दिन) तुम्हारे जी उठने के समय चेला पाया जाऊँ”।</p></li><li><p>χειροτονῆσαι। देखें <a href="https://bibleox.com/hi/hi/w/Ig3F_फिलदिलफिया_की_कलीसिया_के_नाम_पत्र#HH-10">«फिलदिलफिया की कलीसिया के नाम पत्र» 10:1</a> की टिप्पणी।</p></li><li><p>देखें <a href="https://bibleox.com/hi/hi-ov/act/16/#L11">प्रेरि 16:11</a>; पौलुस भी त्रोआस से नियापुलिस गया था।</p></li><li><p>τὴν τοῦ Ἐπιτρόπου — “एपित्रोपुस की पत्नी”। कुछ लोग एपित्रोपुस को व्यक्ति का नाम न मानकर “(रोमी) प्रबन्धक” का पद समझते हैं: “प्रबन्धक की पत्नी”।</p></li><li><p>ἐπισκοπή — “देखरेख, निगरानी”। कुछ हस्तलिपियों में ἐπισκόπῳ “बिशप (के अधीन)”।</p></li></ol>
      <p>अनुवाद: रोडियन व्लासोव (एआई उपकरणों की सहायता से)। मूल पाठ: यूनानी मूल (<a href="https://bibleox.com/hi/grc/w/ΙγνΘ_Πολ">इस साइट का यूनानी संस्करण</a>; स्पष्ट छूटे हुए अंश लाइटफुट और होम्स के संस्करणों से पूरे किए गए)। सहायक अनुवाद: रूसी अनुवाद («प्रारम्भिक कलीसियाई पिता», ब्रसेल्स, 1988), अंग्रेज़ी अनुवाद (Roberts–Donaldson), फ़्रांसीसी अनुवाद (Genoude, 1837)। बाइबल के उद्धरण और लिंक हिन्दी O.V. के अनुसार।</p>
