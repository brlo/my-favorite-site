    title: "Templos cristianos antiguos"
    body: |-
      <h2>Epígrafe</h2><blockquote><p>«Y algunos fariseos de entre la gente le dijeron: ¡Maestro, reprende a tus discípulos! Pero él, respondiendo, les dijo: Os digo que <strong>si estos callan, las piedras clamarán</strong>» (Lc 19:39-40)</p></blockquote><h2>Siglo III</h2><h3>Templo junto a la antigua ciudad de Megido, en el asentamiento de <a href="https://he.wikipedia.org/wiki/%D7%9C%D7%92%D7%99%D7%95">Legio</a> (~año 230)</h3><p>En los antiguos templos cristianos el altar solía estar situado en el centro. Este templo es un ejemplo evidente.</p><p>No lejos de la ciudad de Megido (en la antigüedad allí se encontraba el asentamiento de <a href="https://he.wikipedia.org/wiki/%D7%9C%D7%92%D7%99%D7%95">Legio</a>, ya que allí estaba acuartelada una legión romana). En lo alto del asentamiento se construyó un edificio que, por las monedas, la cerámica y el tipo de escritura, fue datado en el año 230. Una de las salas del edificio era un templo cristiano. En el suelo hay varios mosaicos grandes con inscripciones (una de ellas llama a Cristo Dios), y en el centro está situado el altar. Además, cerca hay una inscripción sobre quién donó esta mesa.</p><img src="https://res.bibleox.com/s/img/image/simple/692c58f9205184ec278d6f97/s_p_aZ3NifF9BW3oqZ1a.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c58f9205184ec278d6f97/m_p_aZ3NifF9BW3oqZ1a.jpg">ampliar</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/692c587d205184ec278d6f91/s_p_MvOQRFKiCv6XaXOd.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c587d205184ec278d6f91/m_p_MvOQRFKiCv6XaXOd.jpg">ampliar</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/692c58ee205184ec278d6f96/s_p_5wNRtqyrpQivbBim.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c58ee205184ec278d6f96/m_p_5wNRtqyrpQivbBim.jpg">ampliar</a>] [<a href="https://res.bibleox.com/s/img/image/simple/692c58e0205184ec278d6f95/m_p_FQvEfj70dP7967X3.jpg">foto adicional 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/692c58ce205184ec278d6f94/m_p_9xoiCsqROihBYnL0.jpg">foto adicional 3</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/692c58b5205184ec278d6f93/s_p_Cvww0C8ZGmbqJS7a.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c58b5205184ec278d6f93/m_p_Cvww0C8ZGmbqJS7a.jpg">ampliar</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/692c5882205184ec278d6f92/s_p_WU59e3c2XbPWkdaM.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c5882205184ec278d6f92/m_p_WU59e3c2XbPWkdaM.jpg">ampliar</a>]</p><p><strong>Inscripciones:</strong></p><p>Todas las inscripciones del suelo del templo son una especie de <strong>notas conmemorativas</strong>. Desde la antigüedad y hasta hoy existe en los templos de la Iglesia Ortodoxa la tradición de que, al celebrar los oficios divinos en el templo, se añadan siempre a la conmemoración orante los nombres de quienes construyeron el templo o donaron algo importante. Así también aquí, con la invitación a la conmemoración, quedan fijados los nombres de quienes donaron el suelo de mosaico (el centurión Cayo Porfirio), de quien lo colocó (Bruto), de quien donó el altar (Akepta), así como algunos otros nombres, posiblemente parientes de los donantes: Prímila, Ciriaca, Dorotea, Crista. Del mismo modo, en memoria de los vivos y de los difuntos se ofrecían también utensilios eclesiásticos: cálices eucarísticos e incensarios (véase <a href="https://bibleox.com/es/es/w/Ik1c_Coleccion_de_iconos_antiguos#HH-Cálices-eucarísticos-e-incensarios-con-iconos-Bizancio-Siria-Attaruti">más detalles</a>).</p><blockquote><p>ES: Akepta, amante de Dios, ofreció esta mesa a Dios Jesucristo en conmemoración</p></blockquote><blockquote><p>EN: Akeptous, the God-loving, offered the table to God Jesus Christ as a memorial.</p></blockquote><blockquote><p>Transcription: <strong>Prosēniken Akeptous, ē philotheos, tēn trapezan Th(e)ō Ι(ēso)u Ch(rist)ō mnēmosunon.</strong></p></blockquote><blockquote><p>Orig: <strong>ΠΡΟСΗΝΙΚΕΝ ΑΚΕΠΤΟΥС, Η ΦΙΛΟΘΕΟС, ΤΗΝ ΤΡΑΠΕΖΑΝ Θ(Ε)Ω Ι(ΗСΟ)Υ Χ(ΡΙСΤ)Ω ΜΝΗΜΟСΥΝΟΝ</strong></p></blockquote><blockquote><p>ΠΡΟϹΗΝΙΚΕΝ</p><p>ΑΚΕΠΤΟΥϹ,</p><p>Η ΦΙΛΟΘΕΟϹ,</p><p>ΤΗΝ ΤΡΑΠΕ-</p><p>ZΑΝ <strong>{ΘW} {ΙΥ} {ΧW}*</strong></p><p>ΜΝΗΜΟϹΥΝΟΝ</p></blockquote><p>*Nomina Sacra: <strong>ΘW ΙΥ ΧW</strong> = θεῷ Ἰησοῦ Χριστῷ = Dios Jesucristo</p><img src="https://res.bibleox.com/s/img/image/simple/692c5df3205184ec278d6f9a/s_p_swifwBDbtzgImkZ6.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c5df3205184ec278d6f9a/m_p_swifwBDbtzgImkZ6.jpg">ampliar</a>]</p><hr><blockquote><p>ΕΝ: Remember Primilla and Cyriaca and Dorothea, and moreover also Chreste.</p></blockquote><blockquote><p>ES: Recordad a Prímila, a Ciriaca y a Dorotea, y también a Crista</p></blockquote><blockquote><p>Orig: <strong>ΜΝΗΜΟΝΕΥСΑΤΕ ΠΡΙΜΙΛΛΗС ΚΑΙ ΚΥΡΙΑΚΗС ΚΑΙ ΔWΡΟΘΕΑС ΕΤΙ ΔΕ ΚΑΙ ΧΡΗСΤΗ</strong></p></blockquote><blockquote><p>Fixed: <strong>ΜΝΗΜΟΝΕΥСΑΤΕ ΠΡΙΜΙΛΛΗС ΚΑΙ ΚΥΡΙΑΚΗΣ ΚΑΙ ΔΩΡΟΘΕΑΣ ΕΤΙ ΔΕ ΚΑΙ ΧΡΗΣΤΗ</strong></p></blockquote><img src="https://res.bibleox.com/s/img/image/simple/692c5dec205184ec278d6f99/s_p_LVbgKrKO7P3dfEJP.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c5dec205184ec278d6f99/m_p_LVbgKrKO7P3dfEJP.jpg">ampliar</a>]</p><hr><blockquote><p>ES: Cayo, llamado también Porfirio, centurión, nuestro hermano, con sus propios medios y con gran generosidad pavimentó este suelo. Bruto, por su parte, ejecutó la obra.</p></blockquote><blockquote><p>EN: Gaianus, also called Porphyrius, centurion (xp), our brother, has made the pavement at his own expense as an act of liberality. Brutius has carried out the work.</p></blockquote><blockquote><p>Orig: <strong>ΓΑΙΑΝΟС Ο ΚΑ ΠΟΡΦΥΡΙС ΧΡ* ΑΔΕΛΦΟС ΗΜWΝ ΕΚ ΦΙΛΟΤΕ ΙΜΙС ΑΜΕΝ ΟСΕΚΤW ΝΙΔΙWΝ ΕΨΙ ΦΟΛΟΓΗСΕΝ. ΒΡΟVΤΙС ΗΡΓΑСΑΤΟ.</strong></p></blockquote><blockquote><p>Fixed: <strong>ΓΑΙΑΝΟΣ Ο ΚΑ ΠΟΡΦΥΡΙΣ ΧΡ* ΑΔΕΛΦΟΣ ΗΜΩΝ ΕΚ ΦΙΛΟΤΕ ΙΜΙΣ ΑΜΕΝ ΟΣΕΚΤΩ ΝΙΔΙΩΝ ΕΨΙ ΦΟΛΟΓΗΣΕΝ. ΒΡΟΥΤΙΣ ΗΡΓΑΣΑΤΟ.</strong></p></blockquote><p><strong>*ΧΡ — hekatontarches — centurio</strong></p><img src="https://res.bibleox.com/s/img/image/simple/692c5e27205184ec278d6f9b/s_p_Qk321JfFTD4dDmnd.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c5e27205184ec278d6f9b/m_p_Qk321JfFTD4dDmnd.jpg">ampliar</a>]</p><h3>Templo en Dura-Europos (Siria)</h3><p>Año 244: templo cristiano en Dura-Europos</p><img src="https://res.bibleox.com/s/img/image/simple/6931880c205184ec278d6fa6/s_p_DFnp7s0vcTbXb3Qn.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931880c205184ec278d6fa6/m_p_DFnp7s0vcTbXb3Qn.jpg">ampliar</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/69318806205184ec278d6fa5/s_p_PuUKcoZEfAVSlPNM.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69318806205184ec278d6fa5/m_p_PuUKcoZEfAVSlPNM.jpg">ampliar</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/69318802205184ec278d6fa4/s_p_MF4zgk1ySUOBpqnG.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69318802205184ec278d6fa4/m_p_MF4zgk1ySUOBpqnG.jpg">ampliar</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/414/s_p_UgKueSl1yxG0SfbA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/414/m_p_UgKueSl1yxG0SfbA.jpg">ampliar</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/69330ed8205184ec278d6fc0/s_p_kXy4nTuYVCOxuDib.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69330ed8205184ec278d6fc0/m_p_kXy4nTuYVCOxuDib.jpg">ampliar</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/693187fd205184ec278d6fa3/s_p_R3poESL99kNRMpXi.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/693187fd205184ec278d6fa3/m_p_R3poESL99kNRMpXi.jpg">ampliar</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/69330e9e205184ec278d6fbf/s_p_ThLs4WrxsJ3ykxKU.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69330e9e205184ec278d6fbf/m_p_ThLs4WrxsJ3ykxKU.jpg">ampliar</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/69330e76205184ec278d6fbe/s_p_NykNwaI9TEwz1Ccf.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69330e76205184ec278d6fbe/m_p_NykNwaI9TEwz1Ccf.jpg">ampliar</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/69330e70205184ec278d6fbd/s_p_Rd3jEzEeesXUCTmh.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69330e70205184ec278d6fbd/m_p_Rd3jEzEeesXUCTmh.jpg">ampliar</a>]</p><p>El templo tiene frescos murales con imágenes de acontecimientos del Nuevo Testamento: la salvación del apóstol Pedro que se hundía y la curación del paralítico junto a la piscina de las ovejas (de la serie de milagros de Cristo solo se conservan estos dos frescos), el buen pastor.</p><p><strong>La salvación del apóstol Pedro que se hundía</strong></p><img src="https://res.bibleox.com/s/img/image/simple/692c8038205184ec278d6f9e/s_p_QQ2Rml8gUWsyQtS9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c8038205184ec278d6f9e/m_p_QQ2Rml8gUWsyQtS9.jpg">ampliar</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6786b88ddba77200015ae11c/m_p_do380IVDukCAfdFk.jpg">versión 2</a>]</p><p><strong>La curación del paralítico junto a la piscina de las ovejas</strong></p><img src="https://res.bibleox.com/s/img/image/simple/6786b889dba77200015ae11b/s_p_k1a5GDBvfzTCWmZv.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6786b889dba77200015ae11b/m_p_k1a5GDBvfzTCWmZv.jpg">ampliar</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6786bb0bdba77200015ae11d/m_p_dCRD85foL69l7kih.jpg">otra versión</a>]</p><p><strong>Imagen junto a la pila bautismal (sala n.º 6): el buen pastor devuelve al rebaño la oveja perdida</strong></p><img src="https://res.bibleox.com/s/img/image/simple/6931870c205184ec278d6fa2/s_p_uBkNi8jGsMFpOQSM.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931870c205184ec278d6fa2/m_p_uBkNi8jGsMFpOQSM.jpg">ampliar</a>]</p><h3>Eusebio de Cesarea (Pánfilo), obispo, historiador de la Iglesia (~258-339)</h3><p>Escribe sobre la construcción de iglesias cristianas en todas las ciudades en tiempos anteriores al gobierno del emperador romano Diocleciano (años de su gobierno: 284-305). En el año 296 Diocleciano publica un edicto sobre la destrucción de las iglesias cristianas. Eusebio tenía 38 años en el momento de este edicto, es decir, debía de ser testigo tanto de la creación de estas iglesias como de su destrucción:</p><blockquote><p>5. ¡Con qué benevolencia trataban a los que presidían las Iglesias los procuradores y los gobernantes! ¡Cómo describir estas <strong>reuniones de muchos miles en cada ciudad</strong>, estas asombrosas multitudes de gente <strong>que afluían a las casas de oración! Los edificios antiguos eran pocos; <mark>por todas las ciudades levantaban nuevas y amplias iglesias</mark> (εὐρείας εἰς πλάτος ἀνὰ πάσας τὰς πόλεις ἐκ θεμελίων ἀνίστων <mark>ἐκκλησίας</mark>).</strong></p><p>&lt;…&gt;</p><p>4. Corría el año decimonoveno del gobierno de Diocleciano cuando, en el mes de distro (entre los romanos, marzo), en la víspera de la fiesta de la Pasión del Señor, por todas partes fue fijado <strong><mark>un edicto imperial que ordenaba destruir las iglesias hasta los cimientos</mark> (βασιλικὰ γράμματα, τὰς μὲν <mark>ἐκκλησίας</mark> εἰς ἔδαφος φέρειν)</strong>, y quemar la Escritura, y que declaraba privadas de los cargos honoríficos a las personas que se aferraban al cristianismo;</p></blockquote><p>(<a href="https://bibleox.com/es/grc/w/%CE%95%CE%9A%CE%9A%CE%9B%CE%97%CE%A3%CE%99%CE%91%CE%A3%CE%A4%CE%99%CE%9A%CE%97%CE%A3_%CE%99%CE%A3%CE%A4%CE%9F%CE%A1%CE%99%CE%91%CE%A3-8/#:~:text=%E1%BC%80%CE%BD%E1%BD%B0%20%CF%80%E1%BD%B1%CF%83%CE%B1%CF%82%20%CF%84%E1%BD%B0%CF%82%20%CF%80%E1%BD%B9%CE%BB%CE%B5%CE%B9%CF%82%20%E1%BC%90%CE%BA%20%CE%B8%CE%B5%CE%BC%CE%B5%CE%BB%E1%BD%B7%CF%89%CE%BD%20%E1%BC%80%CE%BD%E1%BD%B7%CF%83%CF%84%CF%89%CE%BD%20%E1%BC%90%CE%BA%CE%BA%CE%BB%CE%B7%CF%83%E1%BD%B7%CE%B1%CF%82">Historia de la Iglesia, libro 8, 1.5 y 2.4</a>)</p><h2>Hallazgos en duda</h2><h3><strong>Casa en Herculano (</strong>siglo I<strong>)</strong></h3><img src="https://res.bibleox.com/s/img/image/simple/67e428d39a4a346bba31e8ba/s_p_F0lTpC2rqw7PVyf1.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/67e428d39a4a346bba31e8ba/m_p_F0lTpC2rqw7PVyf1.jpg">ampliar</a>] [<a href="https://res.bibleox.com/s/img/image/simple/69330b68205184ec278d6fb8/m_p_oEOCtcPUBThtuirO.jpg">versión 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/69330cb6205184ec278d6fb9/m_p_zMmSTHDi5RoizXsX.jpg">versión 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/69330cbb205184ec278d6fba/m_p_Jv9gdiBWmrMB5tc4.jpg">versión 4</a>] [<a href="https://res.bibleox.com/s/img/image/simple/67e428d79a4a346bba31e8bb/m_p_1sEN1KSZxei96K4S.jpg">versión 5</a>] [<a href="https://res.bibleox.com/s/img/image/simple/67e428db9a4a346bba31e8bc/m_p_TgMWk123osBJ9une.jpg">versión 6</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/69330cc3205184ec278d6fbc/s_p_YLRMNDvDg7nCTh3X.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69330cc3205184ec278d6fbc/m_p_YLRMNDvDg7nCTh3X.jpg">ampliar</a>]</p><p>En el año 79 se produjo la erupción del volcán Vesubio, que sepultó bajo las cenizas volcánicas ciudades como Pompeya, Estabia y Herculano. En Herculano se encontró <a href="https://ru.wikipedia.org/wiki/%D0%93%D0%B5%D1%80%D0%BA%D1%83%D0%BB%D0%B0%D0%BD%D1%83%D0%BC#%D0%94%D0%BE%D0%BC_%D0%B4%D0%B2%D1%83%D1%85%D1%81%D0%BE%D1%82%D0%BB%D0%B5%D1%82%D0%B8%D1%8F">una casa</a> (llamada «casa del Bicentenario» en honor del aniversario de las excavaciones), en cuyo segundo piso, en una de las habitaciones, se había hecho en la pared <a href="https://ermakvagus.com/Europe/Italy/Pompeii/christianity_pompeii_rus.html">una cavidad en forma de cruz</a>, justo en el centro, encima de un armario de madera. Algunos suponen que allí se encontraba una cruz de madera para la oración, y que ese lugar se utilizaba para celebrar oficios cristianos o para la oración doméstica. Sin embargo, hay argumentos serios contra esta suposición. En la misma ciudad se encontró un estante que, supuestamente, podría haber dejado una huella semejante en la pared.</p><img src="https://res.bibleox.com/s/img/image/simple/6932ff2b205184ec278d6fb6/s_p_cXmpauqq2EYuH6ww.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6932ff2b205184ec278d6fb6/m_p_cXmpauqq2EYuH6ww.jpg">ampliar</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6932ff36205184ec278d6fb7/s_p_KIfO7M0rbhGbWoIk.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6932ff36205184ec278d6fb7/m_p_KIfO7M0rbhGbWoIk.jpg">ampliar</a>] [<a href="https://res.bibleox.com/s/img/image/simple/69330cbf205184ec278d6fbb/m_p_WL1FQysNlwZc0yT9.jpg">versión 2</a>]</p><p>El estante no es del todo igual: tiene un saliente bastante grande a izquierda y derecha, y uno menor hacia abajo. Además, en la casa del Bicentenario, supuestamente, en ese lugar de la pared había dos hojas que se cerraban. No obstante, es muy probable que en la casa del Bicentenario hubiera en realidad un estante corriente y no una cruz. El lector mismo debe determinar el grado de confianza que merece una u otra conclusión. Aquí solo se ha reunido la información conocida sobre este hallazgo.</p>
