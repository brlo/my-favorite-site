  - src: 2NCD_Постная_кухня
    path: Lc4k_Cocina_de_ayuno
    title: "Cocina de ayuno"
    body: |-
      <p>En este artículo solo se esboza brevemente el modo de alimentación durante el ayuno, para ayudar a orientarse a quien antes no ha ayunado, no tiene la costumbre de preparar comida de ayuno y no sabe qué podría cocinar en cuaresma.</p><blockquote><p>«Pero Jesús le respondió: —¡Marta, Marta! Te preocupas y te inquietas por muchas cosas, pero una sola es necesaria; María ha escogido la buena parte, que no le será quitada» (Lc 10:41-42)</p></blockquote><blockquote><p>«Mirad por vosotros mismos, para que vuestros corazones no se carguen de glotonería y embriaguez y de las preocupaciones de esta vida, y para que aquel día no os sorprenda de repente» (Lc 21:34)</p></blockquote><h2>Sopas</h2><h3>Sopas con caldo de verduras (cebolla y zanahoria sofritas)</h3><p>Casi en todas partes será oportuno añadir patata:</p><ul><li><p><strong>sopas con cereales</strong> (trigo sarraceno, arroz, cebada perlada, lentejas, guisantes),</p></li><li><p><strong>sopas con pasta</strong>,</p></li><li><p><strong>sopas de verduras</strong>,</p></li><li><p><strong>borsch</strong>,</p></li><li><p><strong>rassolnik</strong> (con pepinillos en salmuera),</p></li><li><p><strong>schi</strong>,</p></li><li><p><strong>sopa de pescado</strong> (cuando la regla lo permite).</p></li></ul><h2>Guarniciones</h2><ul><li><p><strong>avena</strong> (copos),</p></li><li><p><strong>hervidos</strong>: arroz, trigo sarraceno, lentejas, cuscús, bulgur, quinoa, polenta (gachas de harina de maíz) y otros cereales. Es oportuno añadir un sofrito de cebolla y zanahoria.</p></li><li><p><strong>pilaf</strong> (para que sea más saciante se pueden añadir garbanzos),</p></li><li><p><strong>mezclas con arroz hervido</strong>: hawaiana, mexicana, etc.</p></li><li><p><strong>pasta</strong>: hervida, previamente sofrita, pasta con champiñones, con conservas de pescado añadidas (atún, sardina, etc., cuando la regla lo permite)</p></li><li><p><strong>patata</strong>: frita, al horno, hervida, en puré,</p></li><li><p><strong>col guisada</strong>,</p></li><li><p><strong>guiso de verduras</strong>: patata, zanahoria, cebolla, calabacín, pimiento morrón, champiñones, pasta de tomate o tomate, berenjena,</p></li><li><p><strong>verduras hervidas</strong> (coliflor, brócoli, guisantes verdes, maíz),</p></li><li><p><strong>varenykis</strong>: con patata, champiñones, cerezas,</p></li><li><p><strong>tofu</strong>,</p></li><li><p><strong>garbanzos con verduras</strong>,</p></li><li><p><strong>champiñones</strong> fritos,</p></li><li><p><strong>calabacines</strong> fritos,</p></li><li><p><strong>draniki</strong> (patata o calabacín rallados, harina de arroz o de trigo, sal),</p></li><li><p><strong>ratatouille</strong>,</p></li><li><p><strong>calabaza al horno</strong>,</p></li><li><p><strong>verduras a la parrilla</strong>,</p></li><li><p><strong>hamburguesas de verduras</strong> (de alubias).</p></li></ul><h2>Ensaladas</h2><ul><li><p><strong>de verduras frescas</strong>: pepino, tomate, col tierna, cebolla roja, lechuga, pimiento morrón, hierbas frescas, especias,</p></li><li><p><strong>de verduras hervidas</strong>: ensalada rusa (vinegret) (patata, remolacha, zanahoria, judías, guisantes de conserva, pepinillos salados, cebolla, col fermentada),</p></li><li><p><strong>ensalada de col china</strong>: col china, maíz, mayonesa de ayuno[1],</p></li><li><p><strong>remolacha hervida</strong> con mayonesa de ayuno[1],</p></li><li><p><strong>ensalada de frutas</strong>,</p></li><li><p><strong>ensalada de aguacate</strong>,</p></li></ul><h2>Encurtidos</h2><ul><li><p><strong>col fermentada</strong>,</p></li><li><p><strong>pepinos</strong> salados, ligeramente salados, machacados,</p></li><li><p><strong>zanahoria</strong> al estilo coreano,</p></li><li><p><strong>cebolla</strong> marinada en vinagre,</p></li><li><p>y otros.</p></li></ul><h2>Productos de harina</h2><ul><li><p><strong>pan</strong>,</p></li><li><p><strong>bollos de ayuno</strong>: se pueden hornear en el horno, hacer en la sartén o comprar en la tienda.</p></li><li><p><strong>empanadillas rellenas</strong>: de cerezas, de col guisada, de patata y cebolla,</p></li><li><p><strong>tortitas de ayuno</strong> (agua en lugar de leche, plátanos en lugar de huevos),</p></li></ul><h2>Conservas</h2><ul><li><p><strong>caviar</strong> <strong>de calabacín</strong>,</p></li><li><p><strong>caviar</strong> <strong>de berenjena</strong>,</p></li><li><p><strong>hummus</strong>,</p></li><li><p><strong>maíz</strong>,</p></li><li><p><strong>champiñones</strong>,</p></li><li><p><strong>judías</strong>,</p></li><li><p><strong>guisantes verdes</strong>,</p></li><li><p><strong>tomates secos</strong>,</p></li><li><p><strong>guacamole</strong> sin queso,</p></li></ul><h2>Frutas secas</h2><ul><li><p><strong>frutos secos</strong>,</p></li><li><p><strong>bayas y frutas</strong> secas o liofilizadas,</p></li><li><p><strong>halva</strong>,</p></li></ul><h2>Bocadillos y aperitivos</h2><ul><li><p>bocadillos con miel.</p></li><li><p>bocadillos con tomate, albahaca y sal</p></li></ul><h2>Bebidas</h2><ul><li><p>Kvas</p></li><li><p>Kisel</p></li><li><p>Compota (de bayas frescas o de frutas desecadas)</p></li><li><p>Mors</p></li><li><p>Smoothie</p></li><li><p>Limonada</p></li><li><p>Té</p></li><li><p>Café sin leche</p></li><li><p>Agua</p></li></ul>
    references: |-
      <ol><li><p><strong>Mayonesa de ayuno</strong>: líquido de los guisantes en conserva, aceite vegetal, mostaza, sal, azúcar, vinagre. Batir con la batidora.</p></li></ol><p>Traducción: Rodión Vlasov, con ayuda de la IA. Texto base: el original ruso. Citas bíblicas: traducción propia del texto ruso (Sínodo); en el sitio aún no hay traducción de la Biblia al español, por eso las referencias a los versículos se dan sin enlaces.</p>
