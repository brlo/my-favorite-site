    path: Bu3i_Enterramientos_e_inscripciones_cristianas
    title: "Enterramientos e inscripciones cristianas"
    body: |-
      <h2>Inscripciones junto a los enterramientos de los cristianos de los primeros siglos</h2><p>Inscripciones en el triclinio de la llamada «Memoria Apostólica» en la Vía Apia — un santuario construido a mediados del siglo III, entre los años 238 y 260. Fue entonces, en el siglo III, cuando en el triclinio comenzaron a aparecer inscripciones cristianas de oración al estilo de «<em>Paule ed Petre petite pro Victore</em>» y otras semejantes (citadas más abajo). Se siguieron trazando hasta la época de Constantino el Grande. [1]</p><img src="https://res.bibleox.com/s/img/image/simple/483/s_p_1D8zprHe86ZZn5O9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/483/m_p_1D8zprHe86ZZn5O9.jpg">ampliar</a>]</p><h3><strong>Tened presente, en vuestras oraciones </strong>(in mente habete, in orationibus vestris):</h3><p>12912: [Petre et] Paul[e] | in m[ente] abete in | ora[tion]ibus vestris/ — «<strong>Pedro y Pablo, tened presente, en vuestras oraciones...»</strong></p><h3><strong>Interceded </strong>(petite) (o «rogad», «pedid»)</h3><p>12918: [Paul]e et Petre petite | [pro] nobis omnibus/ — <strong>«¡Pablo y Pedro, interceded por todos nosotros!»</strong></p><p>12931: Petr[e] et Pau[l]e petite | pro [Le]ontium / — <strong>«¡Pedro y Pablo, interceded por Leoncio!»</strong></p><p>12933: Pa[ul]e et Pet|re apetite pro Da|tivu in perpetu`u´m/ — <strong>«¡Pablo y Pedro, interceded por Dativo para siempre!»</strong></p><p>12989: Paule ed Petre petite | pro Victore/ — <strong>«¡Pablo y Pedro, interceded por Víctor!»</strong></p><p>12946: [Petre et Pa]ulae spir[ita sancta vestra petant pro - - -]/ — <strong>«¡Pedro y Pablo, que vuestros santos espíritus intercedan por [- - -]!»</strong></p><h3><strong>conservate</strong> — <strong>proteged</strong> (o «conservad»)</h3><p>12991: Petre et Paule cons[ervate - - -]/ — <strong>«¡Pedro y Pablo, proteged [- - -]!»</strong></p><p>12996: sa[lva Paule et] | Petr[e - - - et] | Mart[yrium et] | conse[rvate in] | do[mino - - -]/ — <strong>«¡Salva, oh Pablo y Pedro [- - -], y a Martirio, y protege en el Señor [- - -]!»</strong></p><p>13026: [- - - roga]mus | [conse]rvate nos [omnes]/ — <strong>«[- - -] rogamos, ¡proteged a todos nosotros!»</strong></p><h3><strong>Invocaciones sencillas</strong></h3><p>12909: Petr[e et Paule]/ — <strong>«¡Oh Pedro y Pablo!»</strong></p><h3><strong>Auxilio para los pecadores</strong></h3><p>12967: Petre et Paule sub|venite Prim[o] | peccatori/ — <strong>«¡Pedro y Pablo, venid en ayuda de Primo, el pecador!»</strong></p><h3><strong>Muchas invocaciones están formuladas en griego o en latín con letras griegas</strong></h3><p>12927: Παῦλε {μ} καί | μου πατ|ρός/ — <strong>«¡Pablo, y (ayuda) a mi padre!»</strong></p><p>12997: [Παυλ]ε ετ Πετ[ρε ιν μεν]/[τε ν]ος αβετε [ιν ορα]/[τι]ωνες βεστ[ρας]/ — <strong>«Pablo y Pedro, tened presente, en vuestras oraciones...»</strong></p><p>13045: [Πα]υ[λε ετ Πετρε] | [ι]ν με[ντε αβετε] | Αὐφίδ[ιον υἱόν - - -] | μου/ — <strong>«¡Pablo y Pedro, tened presente a Aufidio, hijo mío!»</strong></p><p>13069: Πέτρε Παίτρε μνημόνευαι | Τιμοκράτην καὶ Εὐ|τυχείαν κινα(?) καὶ | ἐσώρα(?) ++ [- - -]/ — <strong>«¡Pedro, Pedro, acuérdate de Timócrates y de Eutiquia, y (...) ++ [- - -]!»</strong></p><p>13045: [κομμ]ανδαμ[ους? - - -]/<strong> </strong>— <strong>«Encomendamos [- - -]».</strong></p><p>13049: Παῦλε καὶ Π[έτρε ἔχετε] / μνί[α]ς/ — <strong>«¡Pablo y Pedro, tened memoria [- - -]!»</strong></p><p>13055: [Παῦλε καὶ Πέτ]ρε εἰς μνε[ίαν] / [ἔχετε τὸν ᾿Ιρ]ίνες φίλι[ον]/ — <strong>«Pablo y Pedro, acordaos del amado de Irene».</strong></p><p>13070: Παυλε Πετρε | Χαλκηδονι ανιμα | βωβυς κομαν|[δ]ω Λαυrους/ — <strong>«¡Pablo y Pedro, yo, Lauro (¿Laurusio?), os encomiendo el alma de Calcedonio!»</strong></p><p>13071: &lt;Π&gt;α[ῦλ]ος καὶ | Π[έτρο]ς συν|τηρή[σα]τε θ(εο)ῦ δούλους | πνεύματα | ἅγεια συντη|ρήσαται ἡμᾶ|ς ἴνα πολλοῖς | ἔτεσε[ι ζῶμεν]/ — <strong>«¡Pablo y Pedro, sostened a los siervos de Dios! ¡Espíritus santos, sostenednos para que vivamos muchos años!»</strong></p><p>13073: [Παυλε] ετ Πετρε | [ιν με]ντε [ν]ος αβε|[τοτε εἰς το]ὺς ἐῶ[νας]/<strong> </strong>— <strong>«Pablo y Pedro, tened presente por los siglos...»</strong></p><h3><strong>promisit / votum fecit</strong> — <strong>hizo un voto</strong></h3><p>13091: [- - - i]dus m[- - -] | Eulogius votum f[ecit]/ — <strong>«[- - -] el día [- - -] de las idus [- - -] Eulogio hizo un voto [- - -]».</strong></p><h3><strong>Menciones del refrigerium</strong> (banquete funerario):</h3><p>12942: refrigerav[it] | [F]elicissimus cum s[uis]/ — <strong>«Felicísimo celebró el banquete con los suyos.»</strong></p><p>12981: Petro et Paulo | Tomius Coelius | refri`ger´&lt;i&gt;um feci/ — <strong>«A Pedro y Pablo yo, Tomio Celio, celebré el banquete»</strong></p><p>13003: [---] at Paulu[m] | et Pet[rum] | refri[geravi - - -]/ — <strong>«junto a Pablo y Pedro celebré el banquete»</strong></p><p>Fuente: <a href="http://csla.history.ox.ac.uk/record.php?recid=E05087">http://csla.history.ox.ac.uk/record.php?recid=E05087</a></p><hr><h3>Súplicas a Dios</h3><ul><li><p>DEVS TE PRECOR VТ PARADISVM LVCIS POSSIT VIDERE – «<strong>Señor, te ruego que él pueda ver la luz del paraíso</strong>».</p></li><li><p>DOMINE NE QVANDO ADVMBRETVR SPIRITVS VENERES – «<strong>Señor, que nunca se oscurezca el alma de Venus</strong>».</p></li></ul><h3>Petición de intercesión de los difuntos</h3><ul><li><p>ET IN ORATIONIS TVIS ROGES PRO NOBIS QVIA SCIMVS TE ☧ – «<strong>En tus oraciones ruega por nosotros, porque sabemos que estás en Cristo</strong>».</p></li><li><p>ORO SCIO NAMQVE BEATAM – «<strong>Te lo ruego, porque sé que estás en la bienaventuranza</strong>».</p></li><li><p>ORA PRO PARENTI BVS TVIS – «<strong>Ruega por tus parientes</strong>».</p></li><li><p>PETE PRO NOS VТ SALVI SIMVS – «<strong>Ruega por nosotros, para que seamos salvados</strong>».</p></li><li><p>IN ORATIONIS TVIS ROGES PRO NOBIS – «<strong>En tus oraciones, ruega por nosotros</strong>».</p></li><li><p>ATTICE SPIRITVS TVS IN BONV ORA PRO PARENTIBVS TVIS – «<strong>Ático, tu alma está en la bienaventuranza, ruega por tus parientes</strong>».</p></li></ul><p>Se ha citado una parte. En el enlace se puede consultar el resto del material.</p><h3><strong>Inscripciones e imágenes simbólicas</strong></h3><ul><li><p>La palabra VIVAS, es decir, «<strong>vive</strong>», escrita también muy a menudo en los sepulcros, expresa el deseo de vida eterna y de bienaventuranza para el difunto;</p></li><li><p>VIVAS IN DEO – «<strong>vive en Dios</strong>»;</p></li><li><p>VIBAS IN SANCTIS – «<strong>vive entre los santos</strong>».</p></li></ul><h3>El difunto ha alcanzado la salvación</h3><p>A veces se afirma de manera más categórica que el sepultado está entre los elegidos:</p><ul><li><p>ACCEPIT REQVI EM IN DEO – «<strong>Ha alcanzado el reposo en Dios</strong>»;</p></li><li><p>SCIMVS ТЕ IN – «<strong>Sabemos que estás en Cristo</strong>»;</p></li><li><p>FRVCTVOSVS ANIMA ТVА СVМ IVSTIS – «<strong>Fructuoso, tu alma está con los justos</strong>»;</p></li><li><p>REQVI EM ADCEPIT IN DEO PATRE NOSTRO ET CHRISTO EIVS – «<strong>Ha recibido el reposo en Dios Padre y en su Cristo</strong>»;</p></li><li><p>ACCEPTA APVD DEVM – «<strong>Aceptada por Dios</strong>»;</p></li><li><p>RECEPTVS AD DEVM – «<strong>Aceptado por Dios</strong>»;</p></li><li><p>ТЕСVМ PAX CHRISTI – «<strong>la paz de Cristo contigo</strong>»;</p></li><li><p>SEMPER VIVE IN РАСЕ – «<strong>Vive siempre en la paz</strong>»;</p></li><li><p>IN РАСЕ ET IN DOMO AETERNA DEI – «<strong>En la paz y en la casa eterna de Dios</strong>».</p></li><li><p>VIVI IN GLORIA DEI ET IN PACE DOMINI NOSTRI ☧ – «<strong>Vives en la gloria de Dios y en la paz de nuestro Señor Cristo</strong>» – aquí el nombre del Salvador está indicado con su monograma ☧;</p></li><li><p>ELATVS EST, también una especie de aclamación que aparece solo una o dos veces, se puede traducir así: «<strong>se ha elevado a Dios</strong>».</p></li></ul><h3>El paraíso, lugar de luz</h3><p>En las inscripciones funerarias de los primeros cristianos, el paraíso es llamado lugar de luz y de resplandor; he aquí algunos ejemplos:</p><ul><li><p>CVIVS SPIRITVS IN LVCE DOMINI SVSCEPTVS EST – «<strong>Su alma fue recibida en la luz de Dios</strong>».</p></li><li><p>IN CHRISTVM CREDENS PREMIA LVCIS АВЕТ – «<strong>Creyendo en Cristo, tiene por recompensa la luz</strong>».</p></li><li><p>AETERNA TIBI LUX TIMOTHEA IN ☧– «<strong>Luz eterna para ti, Timoteo, en (Cristo)</strong>».</p></li></ul><h3></h3><p>Libro: <strong>A. von Fricken. Las catacumbas romanas y los monumentos del arte cristiano primitivo. Moscú: Edición de K. T. Soldatenkov, 1872–1877–1880–1885. </strong>[2]</p>
    references: |-
      <ol>
      <li><p><a href="https://vk.com/@aletheia-de-sanctis-venerandis">https://vk.com/@aletheia-de-sanctis-venerandis</a></p></li>
      <li><p><a href="https://azbyka.ru/otechnik/Istorija_Tserkvi/rimskie-katakomby-i-pamjatniki-pervonachalnogo-hristianskogo-iskusstva/2">https://azbyka.ru/otechnik/Istorija_Tserkvi/rimskie-katakomby-i-pamjatniki-pervonachalnogo-hristianskogo-iskusstva/2</a></p></li>
      </ol><p>Traducción: Rodión Vlasov, con ayuda de la IA. Texto base: el original ruso. Citas bíblicas: traducción propia del texto ruso (Sínodo); en el sitio aún no hay traducción de la Biblia al español, por eso las referencias a los versículos se dan sin enlaces.</p>
