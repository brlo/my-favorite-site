    body: |-
      <h2>Siglo II</h2><h3><a href="https://ru.wikipedia.org/wiki/%D0%9F%D0%B0%D0%BF%D0%B8%D1%80%D1%83%D1%81_52">Papiro 52</a> — Jn 18:31-33,37-38 (~150)</h3><img src="https://res.bibleox.com/s/img/image/simple/67c76e30dba7720001a4ab31/s_p_k5TLeFzzlkF84GaN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/67c76e30dba7720001a4ab31/m_p_k5TLeFzzlkF84GaN.jpg">ampliar</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/67c77746dba7720001a4ab32/s_p_redMnT8D34cxZOYL.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/67c77746dba7720001a4ab32/m_p_redMnT8D34cxZOYL.jpg">ampliar</a>]</p><h3><a href="https://en.wikipedia.org/wiki/Papyrus_90">Papiro 90</a> — Jn 18:36-40; Jn 19:1-7 (~150)</h3><img src="https://res.bibleox.com/s/img/image/simple/67c7784edba7720001a4ab33/s_p_H1o3KGBYNI9sl2F9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/67c7784edba7720001a4ab33/m_p_H1o3KGBYNI9sl2F9.jpg">ampliar</a>]</p><h3><a href="https://en.wikipedia.org/wiki/Papyrus_104">Papiro 104</a> — Mt 21:34-37; Mt 21:43-44 (~150)</h3><img src="https://res.bibleox.com/s/img/image/simple/67c778a6dba7720001a4ab34/s_p_J8MmDkwHjJgq0wEA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/67c778a6dba7720001a4ab34/m_p_J8MmDkwHjJgq0wEA.jpg">ampliar</a>]</p><h3><a href="https://en.wikipedia.org/wiki/Papyrus_98">Papiro 98</a> — Ap 1:13-20; Ap 2:1 (~150-250)</h3><img src="https://res.bibleox.com/s/img/image/simple/67c779a2dba7720001a4ab35/s_p_rPG5aCVLBBw75jo3.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/67c779a2dba7720001a4ab35/m_p_rPG5aCVLBBw75jo3.jpg">ampliar</a>]</p><h2>Siglo III</h2><h3><a href="https://en.wikipedia.org/wiki/Papyrus_75">Papiro 75</a> — Lc 3:18; Jn 1:1 (175-225)</h3><img src="https://res.bibleox.com/s/img/image/simple/67c77d00dba7720001a4ab3a/s_p_9dXrKwGPywze2DAo.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/67c77d00dba7720001a4ab3a/m_p_9dXrKwGPywze2DAo.jpg">ampliar</a>]</p><h3><a href="https://en.wikipedia.org/wiki/Papyrus_46">Papiro 46</a> — Rom., Heb., 1 Cor., 2 Cor., Ef., Gál., Flp., Col., 1 Tes. (~175-225)</h3><img src="https://res.bibleox.com/s/img/image/simple/6915b056205184ec278d6e7f/s_p_lPe15bGd8VVR6y2H.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6915b056205184ec278d6e7f/m_p_lPe15bGd8VVR6y2H.jpg">ampliar</a>]</p><ul><li><p>Rom. 1:15:17</p></li><li><p>Rom. 5:17 – 6:14</p></li><li><p>Rom. 6:14 – 8:15</p></li><li><p>Rom. 8:15 – 11:35</p></li><li><p>Rom. 11:35 – 14:8</p></li><li><p>Rom. 14:9 – 15:11</p></li><li><p>Rom. 15:11 — Heb. 8:8</p></li><li><p>Heb. 8:9 – 9:10</p></li><li><p>Heb. 9:10 – 26</p></li><li><p>Heb. 9:26 – 1 Cor. 2:3</p></li><li><p>1 Cor. 2:3 – 3:5</p></li><li><p>1 Cor. 3:6 – 2 Cor. 9:7</p></li><li><p>2 Cor. 9:7 – hasta el final; Ef.; Gál. 1:1 – 6:10</p></li><li><p>Gál. 6:10 — el final; Flp.; Col.; 1 Tes. 1:1 – 2:3</p></li><li><p>1 Tes. 2:3–5:5</p></li><li><p>1 Tes. 5:5, 23–28</p></li><li><p>También, posiblemente: 1 Tes. 5:28 – 2 Tes. y a Filemón</p></li></ul><h3><a href="https://en.wikipedia.org/wiki/Papyrus_32">Papiro 32</a> — Tit 1:11-15; Tit 2:3-8 (~200)</h3><img src="https://res.bibleox.com/s/img/image/simple/67c77f82dba7720001a4ab3c/s_p_37FYUloO3Px16M3p.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/67c77f82dba7720001a4ab3c/m_p_37FYUloO3Px16M3p.jpg">ampliar</a>]</p><h3><a href="https://en.wikipedia.org/wiki/Papyrus_4">Papiro 4</a> — Lc 1:58-59; 1:62-2:1; 2:6-7; 3:8-4:2; 4:29-32, 34-35; 5:3-8; 5:30-6:16 (175-250)</h3><img src="https://res.bibleox.com/s/img/image/simple/67c77ec9dba7720001a4ab3b/s_p_EOPj5ySHUxKuZhzv.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/67c77ec9dba7720001a4ab3b/m_p_EOPj5ySHUxKuZhzv.jpg">ampliar</a>]</p><h3><a href="https://en.wikipedia.org/wiki/Papyrus_16">Papiro 16</a> — Flp 3:10-17; Flp 4:2-8 (siglo III)</h3><img src="https://res.bibleox.com/s/img/image/simple/67c77a33dba7720001a4ab36/s_p_ee63gtSd7dJORxL9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/67c77a33dba7720001a4ab36/m_p_ee63gtSd7dJORxL9.jpg">ampliar</a>]</p><h3><a href="https://en.wikipedia.org/wiki/Papyrus_72">Papiro 72</a> — <a class="mw-redirect" href="https://ru.wikipedia.org/wiki/1-%D0%B5_%D0%BF%D0%BE%D1%81%D0%BB%D0%B0%D0%BD%D0%B8%D0%B5_%D0%9F%D0%B5%D1%82%D1%80%D0%B0">1 Pedro</a>, <a class="mw-redirect" href="https://ru.wikipedia.org/wiki/2-%D0%B5_%D0%BF%D0%BE%D1%81%D0%BB%D0%B0%D0%BD%D0%B8%D0%B5_%D0%9F%D0%B5%D1%82%D1%80%D0%B0">2 Pedro</a>, <a href="https://ru.wikipedia.org/wiki/%D0%9F%D0%BE%D1%81%D0%BB%D0%B0%D0%BD%D0%B8%D0%B5_%D0%98%D1%83%D0%B4%D1%8B">Judas</a> (siglos III-IV)</h3><img src="https://res.bibleox.com/s/img/image/simple/67c77afddba7720001a4ab37/s_p_JCufSqhlLauLH7qF.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/67c77afddba7720001a4ab37/m_p_JCufSqhlLauLH7qF.jpg">ampliar</a>]</p><h3><a href="https://en.wikipedia.org/wiki/Papyrus_78">Papiro 78</a> — Jud 1:4-5,7-8 (siglos III-IV)</h3><img src="https://res.bibleox.com/s/img/image/simple/67c77be8dba7720001a4ab38/s_p_8xpMewUexRgW9gyK.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/67c77be8dba7720001a4ab38/m_p_8xpMewUexRgW9gyK.jpg">ampliar</a>]</p><h2>Siglo IV</h2><h3>Códice Sinaítico (mediados del siglo IV)</h3><p><a href="https://codexsinaiticus.org/en/manuscript.aspx">https://codexsinaiticus.org/en/manuscript.aspx</a></p><img src="https://res.bibleox.com/s/img/image/simple/69037c86205184ec278d6e4f/s_p_k8XUyHVBOuyRjeGi.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69037c86205184ec278d6e4f/m_p_k8XUyHVBOuyRjeGi.jpg">ampliar</a>]</p><h3>Códice Vaticano (mediados del siglo IV, pero posiblemente también después del año 367)</h3><p><a href="https://archive.org/details/CodexAlexandrinus/Codex-Vaticanus-NT/mode/2up">https://archive.org/details/CodexAlexandrinus/Codex-Vaticanus-NT/mode/2up</a></p><p><a href="https://digi.vatlib.it/view/MSS_Vat.gr.1209">https://digi.vatlib.it/view/MSS_Vat.gr.1209</a></p><img src="https://res.bibleox.com/s/img/image/simple/69037c61205184ec278d6e4e/s_p_mNcBEIlZjg4rJctE.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69037c61205184ec278d6e4e/m_p_mNcBEIlZjg4rJctE.jpg">ampliar</a>]</p><h2>Siglo V</h2><h3>Códice Alejandrino (primera mitad del siglo V)</h3><p><a href="https://archive.org/details/CodexAlexandrinus/Codex%20Alexandrinus">https://archive.org/details/CodexAlexandrinus/Codex%20Alexandrinus</a></p><img src="https://res.bibleox.com/s/img/image/simple/69037c31205184ec278d6e4d/s_p_nvIvhbabbnHZELvW.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69037c31205184ec278d6e4d/m_p_nvIvhbabbnHZELvW.jpg">ampliar</a>]</p>
