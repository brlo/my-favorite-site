    title: "Imágenes antiguas varias no incluidas en la colección principal"
    body: |-
      <h2>Catacumbas de San Jenaro (Catacombe di San Gennaro) [1]</h2><h3>San Jenaro de Benevento, de Puteoli (Nápoles), obispo y hieromártir</h3><p>Catacumbas de San Gennaro (de San Jenaro), Nápoles. Fresco del siglo IV. No está del todo claro quién está representado aquí. Arriba está escrito: SANCTOMARTYRIIANVARIO (San mártir Jenaro). Sin embargo, por alguna razón está representado un joven. Tampoco se entiende por qué tiene ese nimbo.</p><p>Página con información sobre este santo en la Iglesia Ortodoxa: <a href="https://days.pravoslavie.ru/name/890.html">https://days.pravoslavie.ru/name/890.html</a></p><p>Página en Wikipedia sobre este fresco. En polaco, pero con información útil: <a href="https://pl.wikipedia.org/wiki/January_z_Benewentu">https://pl.wikipedia.org/wiki/January_z_Benewentu</a></p><img src="https://res.bibleox.com/s/img/image/simple/686e6aa95f47da2505d3ae6e/s_p_RCtXSS4uiuO9E0Qf.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686e6aa95f47da2505d3ae6e/m_p_RCtXSS4uiuO9E0Qf.jpg">ampliar</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686e56775f47da2505d3ae67/m_p_XhI4Ni1rKZ949Zi1.jpg">versión 2</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686e54755f47da2505d3ae66/s_p_zKsSelu839AuImaV.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686e54755f47da2505d3ae66/m_p_zKsSelu839AuImaV.jpg">ampliar</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686e57135f47da2505d3ae68/m_p_faNUwXKGPaVtmUwW.jpg">versión 2</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686e6aec5f47da2505d3ae70/s_p_2fvyFxXewVLu06NV.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686e6aec5f47da2505d3ae70/m_p_2fvyFxXewVLu06NV.jpg">ampliar</a>]</p><h3>La cristiana Cerula</h3><p>Inscripción abajo: «CERVLA IN PACE» (Cerula en la paz), siglos V-VI [3]</p><img src="https://res.bibleox.com/s/img/image/simple/686e4d5c5f47da2505d3ae63/s_p_1dqPUS5wghY1DrdP.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686e4d5c5f47da2505d3ae63/m_p_1dqPUS5wghY1DrdP.jpg">ampliar</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686e58705f47da2505d3ae6a/m_p_r6sua9UNLBhgIZ06.jpg">versión 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686e58625f47da2505d3ae69/m_p_6KViYk7KWJDrIa8l.jpg">versión 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686e6ad15f47da2505d3ae6f/m_p_q9ocVtWoayH4BxtB.jpg">versión 4</a>]</p><h3>La familia de Teotecno</h3><blockquote><p>Arcosolio de la familia de Teotecno (Feotecno). Los estudios mostraron que la primera en morir fue la niña. En la hornacina se pintó un fresco con su retrato. Después murió el hombre. Sobre el primer fresco se pintó uno nuevo, ya con el padre. La última en morir fue la mujer, y en la hornacina apareció su retrato en grupo.</p></blockquote><img src="https://res.bibleox.com/s/img/image/simple/686e6be45f47da2505d3ae71/s_p_xNoWgh6wacZ3al1R.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686e6be45f47da2505d3ae71/m_p_xNoWgh6wacZ3al1R.jpg">ampliar</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686e592c5f47da2505d3ae6b/s_p_A6SYWxzdgc1EPwun.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686e592c5f47da2505d3ae6b/m_p_A6SYWxzdgc1EPwun.jpg">ampliar</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686fe8695f47da2505d3ae88/m_p_nzuUOKu6sAmxO4pO.jpg">versión 2</a>]</p><h2>Via Anapo catacombs[2]</h2><h3>Mujer orando (orante)</h3><p>Fresco de una mujer orando. Fresco of a praying woman, an orante or orans, in the Anonima di Via Anapo catacomb (anonymous catacomb of Via Anapo), Rome</p><img src="https://res.bibleox.com/s/img/image/simple/686e53655f47da2505d3ae65/s_p_qTxn07MuPIePNzPn.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686e53655f47da2505d3ae65/m_p_qTxn07MuPIePNzPn.jpg">ampliar</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686e535e5f47da2505d3ae64/m_p_U8Zh4RJjehyZtXep.jpg">versión 2</a>]</p>
