  - src: древние-иконы
    path: Ik1c_Coleccion_de_iconos_antiguos
    title: "Colección de iconos antiguos"
    title_sub: "Antiguos iconos cristianos de Cristo, de la Madre de Dios, de los apóstoles y de otros santos"
    body: |-
      <h2>~siglo XV a. C.</h2><h3>Tabernáculo de la Reunión</h3><p>En el velo en medio del templo (entre el Lugar Santo y el Lugar Santísimo) están representados querubines (Ex 26:31), así como en las cubiertas (muros) de alrededor (Ex 26:1; Ex 36:8), lo que el autor del dibujo no representó. El tabernáculo es imagen (icono) de la realidad celestial (Ex 25:8-9,40; Heb 9:24; Hch 7:44). Dios mandó venerar el templo (Lv 19:30; Lv 26:2).</p><img src="https://res.bibleox.com/s/img/image/simple/471/s_p_P2j4gLJt9iKSnkge.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/471/m_p_P2j4gLJt9iKSnkge.jpg">ampliar</a>] [<a href="https://res.bibleox.com/s/img/image/simple/472/m_p_bNPh6hCNJDhzahar.jpg">exterior</a>]</p><h3>Arca de la Alianza</h3><p>Sobre el arca estaban representados dos ángeles querubines (<a href="https://bibleox.com/ru/ru/w/%D0%BA%D0%BE%D0%B2%D1%87%D0%B5%D0%B3_%D0%B7%D0%B0%D0%B2%D0%B5%D1%82%D0%B0/">referencias a la Escritura (en ruso)</a>). El profeta Josué se postró ante el Arca de la Alianza (Jos 7:6).</p><img src="https://res.bibleox.com/s/img/image/simple/469/s_p_DUn5vqnI4F8yRiNA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/469/m_p_DUn5vqnI4F8yRiNA.jpg">ampliar</a>]</p><h3>El campamento de Israel</h3><p>Israel avanzaba en forma de cruz (<a href="https://bibleox.com/ru/ru/w/%D0%B5%D0%B2%D1%80%D0%B5%D0%B9%D1%81%D0%BA%D0%B8%D0%B9-%D1%81%D1%82%D0%B0%D0%BD-%D0%BA%D1%80%D0%B5%D1%81%D1%82/">referencias a la Escritura (en ruso)</a>).</p><img src="https://res.bibleox.com/s/img/image/simple/470/s_p_t8tRbbwlzsBzyVzk.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/470/m_p_t8tRbbwlzsBzyVzk.jpg">ampliar</a>]</p><h2>~siglo X a. C.</h2><h3>El Templo de Jerusalén, construido por Salomón</h3><p>Había imágenes talladas de querubines en las paredes del templo (1R 6:32), en la puerta de entrada (1R 6:32; (1R 6:35) en el velo ante la entrada del Lugar Santísimo (2Cr 3:14; 1Mac 1:22). En el Lugar Santísimo había dos grandes estatuas de madera dorada de querubines (1R 6:23). Sobre la tapa del Arca de la Alianza se hicieron dos estatuas de querubines (Ex 25:18-20). En el atrio del templo, sobre las grandes basas de las pilas, estaban representados leones, bueyes y querubines (1R 7:28-29). (<a href="https://bibleox.com/ru/ru/w/%D0%B8%D0%B5%D1%80%D1%83%D1%81%D0%B0%D0%BB%D0%B8%D0%BC%D1%81%D0%BA%D0%B8%D0%B9-%D1%85%D1%80%D0%B0%D0%BC/">Más detalles (en ruso)</a>).</p><p>El profeta David se postraba ante el templo (Sal 5:7; Sal 98:5; Sal 131:7), rindiendo honor a Dios por medio de esta imagen.</p><img src="https://res.bibleox.com/s/img/image/simple/468/s_p_lv7GzNtM53C4Zqgr.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/468/m_p_lv7GzNtM53C4Zqgr.jpg">ampliar</a>]</p><h2>Siglo II</h2><h3>La Madre de Dios con el niño Jesús, el profeta señala la estrella (Roma)</h3><p>Siglos II – principios del III. Catacumbas de Priscila[6]. Es la imagen más antigua de la Madre de Dios. El hombre junto a la Madre de Dios, posiblemente, sostiene un libro en la mano izquierda, y con el dedo de la mano derecha señala la estrella.</p><img src="https://res.bibleox.com/s/img/image/simple/6751b012dba7720001514f69/s_p_jNTGMwic6Cse9xDG.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6751b012dba7720001514f69/m_p_jNTGMwic6Cse9xDG.jpg">ampliar</a>] [<a href="https://res.bibleox.com/s/img/image/simple/67618740dba7720001cd0e2c/m_p_ckKuGWqzHuN1tR5Q.jpg">versión 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686cf0535f47da2505d3ae4d/m_p_dajA4xvStk0EnnSq.jpg">versión 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686cf7725f47da2505d3ae50/m_p_n79yEKK4QSCeorx3.jpg">versión 4</a>] [<a href="https://res.bibleox.com/s/img/image/simple/442/m_p_5zQEQbMmBkEs9J2S.jpg">versión 5</a>]</p><p>El hombre junto a la Madre de Dios puede ser el profeta Isaías, que pronunció la profecía:</p><blockquote><p>«Por tanto, el Señor mismo os dará señal: he aquí que <strong>la virgen concebirá y dará a luz un hijo</strong>, y llamará su nombre Emanuel» (Is 7:14)</p></blockquote><p>O por Balaam:</p><blockquote><p>«Lo veo, pero no ahora; lo contemplo, pero no de cerca. <strong>Sale una estrella de Jacob</strong> y se levanta un cetro de Israel, que hiere a los príncipes de Moab y destruye a todos los hijos de Set» (Nm 24:17)</p></blockquote><p>O quizá el artista, en lugar de una inscripción explicativa, simplemente recurrió a este recurso. Nos invita a tomar el libro, leer la profecía sobre la estrella que se levanta y comprender que ha representado el nacimiento de aquel de quien habla esa profecía, es decir, el nacimiento del Salvador de la Virgen.</p><h3>Cristo en imagen del Buen Pastor</h3><p>Finales del siglo II. Roma. Catacumbas de Calixto (<a href="https://en.wikipedia.org/wiki/Catacomb_of_Callixtus#Paintings">Callixitus Catacomb, Crypt of Lucina</a>).</p><img src="https://res.bibleox.com/s/img/image/simple/473/s_p_mrIYHR2oqLQuPn0z.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/473/m_p_mrIYHR2oqLQuPn0z.jpg">ampliar</a>]</p><h2>Siglo III</h2><h3>La Madre de Dios «Orante» (Roma)</h3><p>Catacomba Maggiore, Roma[26][27]. En el primer plano están representados la Virgen María y el niño Cristo.</p><img src="https://res.bibleox.com/s/img/image/simple/6751fe6ddba7720001514f7e/s_p_C1Iw2V4OhNy1SGOE.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6751fe6ddba7720001514f7e/m_p_C1Iw2V4OhNy1SGOE.jpg">ampliar</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686cefb35f47da2505d3ae4c/m_p_70zYu2r0np0WFNUu.jpg">versión 2</a>]</p><h3>Cristo, los apóstoles, los mártires Gorgonio, Pedro, Marcelino y Tiburcio (Roma)</h3><p>Catacumbas de Pedro y Marcelino</p><img src="https://res.bibleox.com/s/img/image/simple/6752012adba7720001514f82/s_p_x5I0ahjwMz1X5LoJ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6752012adba7720001514f82/m_p_x5I0ahjwMz1X5LoJ.jpg">ampliar</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686d237a5f47da2505d3ae56/m_p_ST9me27UGtWHYDBc.jpg">versión 2</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/676082a6dba7720001cd0e22/s_p_YjPD3PzLDCF4wgh1.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/676082a6dba7720001cd0e22/m_p_YjPD3PzLDCF4wgh1.jpg">ampliar</a>]</p><h3>Una mujer ora al Buen Pastor (Roma)</h3><p>Siglo III. Catacumbas de Priscila[6].</p><p>Las imágenes forman una composición. El artista dispuso las imágenes de tal modo que los orantes representados alrededor miran y levantan las manos hacia la parte superior de la sala, donde está representado Cristo en imagen del <strong>Buen Pastor</strong> (Jn 10:11). Todos los temas alrededor del Buen Pastor los une un solo asunto: la <strong>salvación de la muerte</strong>.</p><img src="https://res.bibleox.com/s/img/image/simple/686bea5b5f47da2505d3ae31/s_p_pjRHeoFaUpKPoyEH.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686bea5b5f47da2505d3ae31/m_p_pjRHeoFaUpKPoyEH.jpg">ampliar</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686cf7375f47da2505d3ae4f/m_p_MOsOWI2vEXUj5ELf.jpg">versión 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6904b3f2205184ec278d6e53/m_p_0GRveVCOh2GBz7eq.jpg">versión 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/431/m_p_LUZsrJtesEWiwHBO.jpg">versión 4</a>]</p><p>El Buen Pastor es Cristo (Lc. 15:6-7; Jn. 10:1-21; Sal. 23).</p><img src="https://res.bibleox.com/s/img/image/simple/69319f74205184ec278d6fa7/s_p_GR8gHxKZuC87xqlf.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69319f74205184ec278d6fa7/m_p_GR8gHxKZuC87xqlf.jpg">ampliar</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686d2ac55f47da2505d3ae59/m_p_JDvtNt9RJrqnAsEW.jpg">versión 2</a>]</p><p>Una mujer con la cabeza cubierta ora con las manos levantadas (probablemente Sara: Gn. 18:1-15 y Gn. 21:1-7).</p><img src="https://res.bibleox.com/s/img/image/simple/686bea885f47da2505d3ae32/s_p_79wnuevuFIi3tnrH.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686bea885f47da2505d3ae32/m_p_79wnuevuFIi3tnrH.jpg">ampliar</a>]</p><p>A la derecha, un tema del Antiguo Testamento: los tres jóvenes (<a href="https://en.wikipedia.org/wiki/Catacomb_of_Priscilla#/media/File:Shadrach,_Meshach,_and_Abednego_in_the_fiery_furnace,_from_the_book_Die_Malereien_der_Katakomben_Roms,_plate_78,_levels_adjusted.jpg">Sadrac, Mesac y Abednego</a>) oran con las manos levantadas (Dn. 3:1-90).</p><img src="https://res.bibleox.com/s/img/image/simple/686cfc565f47da2505d3ae52/s_p_NmZJuoF70d9qohZs.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686cfc565f47da2505d3ae52/m_p_NmZJuoF70d9qohZs.jpg">ampliar</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686cfc475f47da2505d3ae51/m_p_qzHB83d52LoU7QQL.jpg">versión 2</a>]</p><p>A la izquierda, un tema del Antiguo Testamento: Abraham e Isaac con la leña para el sacrificio (Gn. 22:1-19).</p><img src="https://res.bibleox.com/s/img/image/simple/686d33c45f47da2505d3ae5a/s_p_QQLn5T52hx8gSrBf.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d33c45f47da2505d3ae5a/m_p_QQLn5T52hx8gSrBf.jpg">ampliar</a>]</p><p>Sobre la entrada está representado el profeta Jonás, a quien engulle un animal marino (Jon 2:1).</p><img src="https://res.bibleox.com/s/img/image/simple/476/s_p_aHV4YSuoWhVZ1H5y.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/476/m_p_aHV4YSuoWhVZ1H5y.jpg">ampliar</a>]</p><p>Conviene describir con más detalle el tema de la vida de la mujer orante en la parte delantera de la sala.</p><img src="https://res.bibleox.com/s/img/image/simple/686d36265f47da2505d3ae5d/s_p_MGpxKQ94pikRfgFK.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d36265f47da2505d3ae5d/m_p_MGpxKQ94pikRfgFK.jpg">ampliar</a>]</p><p><strong>Los acontecimientos del tema frontal</strong></p><p>Cada sección de la composición de la sala representa un solo tema. Todos los temas son componentes importantes de la temática cristiana. Arriba está la escena del Buen Pastor, a la izquierda la escena de Abraham, a la derecha la de los tres jóvenes, en el pasillo la del profeta Jonás. En este sentido, se puede suponer que el artista no se apartó de esta regla (una sección, un tema importante) también en la parte delantera de la sala, que es difícil de describir de manera unívoca. Aquí se ofrece solo una suposición. Puesto que por todos los lados (excepto el centro) están representados temas del Antiguo Testamento, en la parte delantera se puede suponer la historia de Agar (Gn. 16, Gn. 21). Si es así, primero están representados Abraham y Agar expulsada con su hijo Ismael (1), luego la oración de Sara (2), luego Agar amamantando al niño (3).</p><p>Consideremos esta versión con más detalle:</p><p><strong>1. La expulsión de Agar</strong>. Lo más exacto que se puede decir es que está sentado Abraham (tiene el mismo cabello y la misma barba que en el fresco con Abraham de enfrente). Con vestidura amarilla está representada, probablemente, Agar (con el color amarillo podría subrayarse la condición de esclava). Parece que en sus manos tiene odres de agua (Gn 21:14). Detrás de ella está representado, posiblemente, su hijo Ismael, que en el momento de la expulsión debía tener más de 15 años (<em>Ismael nació cuando Abraham tenía 86 </em>Gn 16:16<em>, Isaac nació cuando Abraham tenía 100 años </em>Gn 21:5<em>, y Agar es expulsada cuando Isaac creció y fue destetado </em>Gn 21:8-13). Parece que es una mujer con delantal, pero si es así, solo puede ser la propia Agar (la cabeza descubierta es de una soltera), y el de los odres en las manos sería, en tal caso, Ismael. En cualquier caso, los dos restantes son Agar e Ismael, como la versión más probable. Puede ser también que toda esta composición no conste de secciones separadas, sino que sea un cuadro único, ya que la mujer con el niño mira a la mujer con las manos levantadas.</p><img src="https://res.bibleox.com/s/img/image/simple/686d33c95f47da2505d3ae5b/s_p_kuEcuyUnGenBuWPw.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d33c95f47da2505d3ae5b/m_p_kuEcuyUnGenBuWPw.jpg">ampliar</a>]</p><p><strong>2. La oración de Sara</strong>. Con vestidura roja y la cabeza cubierta está representada Sara, que ora a Dios. El color rojo de la vestidura indica un alto estatus, y la cabeza cubierta, el matrimonio.</p><img src="https://res.bibleox.com/s/img/image/simple/686d3a855f47da2505d3ae5e/s_p_rpl3jnuNnx8ZisdR.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d3a855f47da2505d3ae5e/m_p_rpl3jnuNnx8ZisdR.jpg">ampliar</a>]</p><p><strong>3. Agar amamanta al niño</strong>. En favor de la versión con Agar habla el hecho de que su cabeza está descubierta (es decir, es soltera), así como la forma del cabello, igual que la del personaje vestido de amarillo de la primera escena. También la delata su mirada característica: mira a Sara, con quien tenía una relación tensa. Es curioso que el artista la representó exactamente como está sentado Abraham a la izquierda: en una silla y con una vestidura idéntica (franjas verticales, dos franjas en la manga, un manto).</p><img src="https://res.bibleox.com/s/img/image/simple/686d22a05f47da2505d3ae54/s_p_8fxd9vcRlXYszSJU.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d22a05f47da2505d3ae54/m_p_8fxd9vcRlXYszSJU.jpg">ampliar</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686d33cd5f47da2505d3ae5c/m_p_qKPp740xLZNuDEFs.jpg">versión 2</a>]</p><p><strong>La idea general de la sala: la salvación de la muerte</strong></p><p>La composición de este cubículo tiene una idea general y hermosa: la salvación de la muerte. El tema general asciende de abajo hacia arriba por niveles:</p><ul><li><p>El nivel más bajo: los cristianos difuntos sepultados, que creen en el vencedor de la muerte, Cristo.</p></li><li><p>El nivel medio: temas bíblicos sobre la salvación de la muerte:</p><ul><li><p>los tres jóvenes en el horno de Babilonia son salvados de la muerte en el fuego;</p></li><li><p>el profeta Jonás es salvado de la muerte en el vientre del animal marino;</p></li><li><p>Isaac es salvado del sacrificio; en su lugar se ofrece un cordero;</p></li><li><p>Agar con su hijo Ismael es salvada de la muerte en el desierto.</p></li></ul></li><li><p>El penúltimo nivel: los símbolos cristianos: el pavo real (resurrección, inmortalidad, vida eterna) y la perdiz (el alma). Una perdiz está junto a una planta viva (simboliza la vida), la otra, junto a una seca (simboliza la muerte). También están los pavos reales.</p></li><li><p>El centro del techo: el Buen Pastor, que salva a los creyentes de la muerte. Es notable que aquí hay otra pequeña referencia a la salvación de la muerte: a izquierda y derecha del Pastor están el cuervo y la paloma con la rama de olivo que Noé envió desde el arca. Así, los que se salvan de la muerte en el arca son conducidos por estas aves al Salvador de la muerte, Cristo.</p></li></ul><h3>El templo de Dura-Europos (Siria)</h3><p>Año 244. El templo de Dura-Europos contenía, además de escenas del Antiguo Testamento, frescos con imágenes de acontecimientos del Nuevo Testamento: la salvación del apóstol Pedro, que se hundía, y la curación del paralítico junto a la piscina de las ovejas. Véase también <a href="https://vk.com/@aletheia-de-sacris-imaginibus-venerandis?anchor=v-drugie-svyaschennye-izobrazhenia-v-donikeyskiy-period">el artículo</a>.</p><p><strong>Cristo en imagen del Buen Pastor (imagen principal del baptisterio)</strong></p><img src="https://res.bibleox.com/s/img/image/simple/6931870c205184ec278d6fa2/s_p_uBkNi8jGsMFpOQSM.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931870c205184ec278d6fa2/m_p_uBkNi8jGsMFpOQSM.jpg">ampliar</a>]</p><p><strong>La salvación del apóstol Pedro, que se hundía</strong></p><img src="https://res.bibleox.com/s/img/image/simple/692c8038205184ec278d6f9e/s_p_QQ2Rml8gUWsyQtS9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c8038205184ec278d6f9e/m_p_QQ2Rml8gUWsyQtS9.jpg">ampliar</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6786b88ddba77200015ae11c/m_p_do380IVDukCAfdFk.jpg">versión 2</a>]</p><p><strong>La curación del paralítico junto a la piscina de las ovejas</strong></p><img src="https://res.bibleox.com/s/img/image/simple/6786b889dba77200015ae11b/s_p_k1a5GDBvfzTCWmZv.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6786b889dba77200015ae11b/m_p_k1a5GDBvfzTCWmZv.jpg">ampliar</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6786bb0bdba77200015ae11d/m_p_dCRD85foL69l7kih.jpg">otra versión</a>]</p><h3>Cristo en imagen del Buen Pastor, el profeta Jonás</h3><p>Finales del siglo III – principios del IV. Roma. Catacumbas de Pedro y Marcelino.</p><p>En el centro, Cristo en imagen del Buen Pastor. A ambos lados del centro está representado Jonás. En el fresco de la izquierda, Jonás es arrojado desde la nave, y a la derecha lo engulle la ballena.</p><img src="https://res.bibleox.com/s/img/image/simple/478/s_p_yvJcnbLGPxZ6AzRu.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/478/m_p_yvJcnbLGPxZ6AzRu.jpg">ampliar</a>]</p><p>El profeta Jonás</p><img src="https://res.bibleox.com/s/img/image/simple/481/s_p_7z5j4tAimokFaRMN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/481/m_p_7z5j4tAimokFaRMN.jpg">ampliar</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/480/s_p_b8gqyOenKZcn2MCp.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/480/m_p_b8gqyOenKZcn2MCp.jpg">ampliar</a>]</p><h3>Cristo en imagen del Buen Pastor</h3><p>Siglo III. Roma. Catacumbas de Calixto (<a href="https://en.wikipedia.org/wiki/Catacomb_of_Callixtus#Paintings">Callixitus Catacomb, Crypt of Lucina</a>). Se puede suponer que en el caldero hay leche, que simboliza la Eucaristía (véase en Clemente de Alejandría).</p><img src="https://res.bibleox.com/s/img/image/simple/474/s_p_zcLmMd2qkyG3pDoj.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/474/m_p_zcLmMd2qkyG3pDoj.jpg">ampliar</a>]</p><h3>El Buen Pastor, necrópolis de Hisartep, Nicea (Iznik)</h3><p>~Siglo III. Hallazgo reciente, datación provisional (<a href="https://www.arkeolojikhaber.com/haber-iznikte-benzersiz-bir-kesif-anadolunun-tek-coban-isa-figuru-gun-yuzune-cikarildi-43079/">más detalles</a>). Esta necrópolis se usó del siglo II al V.</p><p>Coordenadas: 40.78204218462122, 29.928491677648932. El nombre del lugar en turco: Hasartep Nekropolü.</p><img src="https://res.bibleox.com/s/img/image/simple/69444e49205184ec278d6fdb/s_p_SZTpvcDdpodujcbM.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69444e49205184ec278d6fdb/m_p_SZTpvcDdpodujcbM.jpg">ampliar</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6941a813205184ec278d6fda/s_p_CUoa7dSy5UxGf1UD.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6941a813205184ec278d6fda/m_p_CUoa7dSy5UxGf1UD.jpg">ampliar</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6941a80f205184ec278d6fd9/m_p_xSCaRt10DUUReyMt.jpg">versión 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/693c7d1a205184ec278d6fcb/m_p_mR5ZaVgXbezmXDyo.jpg">versión 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/693d606b205184ec278d6fd3/m_p_TKCjvhxmnq0q50tW.jpg">versión 4</a>] [<a href="https://res.bibleox.com/s/img/image/simple/693d6101205184ec278d6fd7/m_p_1i6aL6lfDR08iA13.jpg">versión 5</a>] [<a href="https://res.bibleox.com/s/img/image/simple/693d60f8205184ec278d6fd6/m_p_b2uUaO6tzciaKAgC.jpg">versión 6</a>] [<a href="https://res.bibleox.com/s/img/image/simple/693d60f1205184ec278d6fd5/m_p_bErh7lbI0e08hPaa.jpg">versión 7</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/693c7db2205184ec278d6fd2/s_p_wCZsWPWG7jCNLjIr.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/693c7db2205184ec278d6fd2/m_p_wCZsWPWG7jCNLjIr.jpg">ampliar</a>] [<a href="https://res.bibleox.com/s/img/image/simple/693d60ad205184ec278d6fd4/m_p_BCvsIiJX10j2Mf2k.jpg">un hombre y una mujer</a>] [<a href="https://res.bibleox.com/s/img/image/simple/693c7daa205184ec278d6fd1/m_p_cjk36Xjpev9EFq2h.jpg">una mujer</a>]</p><h3>Anillo de boda (Bizancio)</h3><p>Siglos III-IV. <a href="https://www.metmuseum.org/art/collection/search/663485">El Metropolitan de la Quinta Avenida, EE. UU.</a>. (griego χάρις — gracia)</p><img src="https://res.bibleox.com/s/img/image/simple/68b5da8b45c75323d28a5e99/s_p_GNh1S8L7fcowsMEE.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5da8b45c75323d28a5e99/m_p_GNh1S8L7fcowsMEE.jpg">ampliar</a>]</p><h3>La celebración de la Eucaristía</h3><p>Siglo III. Roma. Catacumbas de Calixto (<a href="https://en.wikipedia.org/wiki/Catacomb_of_Callixtus#Paintings">Callixitus Catacomb, Crypt of Lucina</a>). Probablemente está representado un presbítero que concelebra con un diácono. Así se celebra hoy la Eucaristía en los templos de la Iglesia Ortodoxa: el presbítero eleva ambas manos, el diácono señala los santos dones.</p><img src="https://res.bibleox.com/s/img/image/simple/479/s_p_Zbn405P2krjwNAYl.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/479/m_p_Zbn405P2krjwNAYl.jpg">ampliar</a>]</p><h2>Siglo IV</h2><h3>Cristo (Roma)</h3><p>Catacumbas de Comodila.</p><img src="https://res.bibleox.com/s/img/image/simple/66cc2bd6dba77200019bc7d2/s_p_7xYGBb9wCmxBIGrZ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/66cc2bd6dba77200019bc7d2/m_p_7xYGBb9wCmxBIGrZ.jpg">ampliar</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686d23425f47da2505d3ae55/s_p_LzqgbhnIsbqtghoc.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d23425f47da2505d3ae55/m_p_LzqgbhnIsbqtghoc.jpg">ampliar</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a1e1205184ec278d6fa8/m_p_KC0MljXJf5po70pj.jpg">versión 2</a>]</p><h3>Cristo y los apóstoles (Roma)</h3><p>~año 350. [8][9] Mausoleo de Santa Constanza.</p><img src="https://res.bibleox.com/s/img/image/simple/686990665f47da2505d3ae19/s_p_5RDr4ou4ExBAh4KE.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686990665f47da2505d3ae19/m_p_5RDr4ou4ExBAh4KE.jpg">ampliar</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686990425f47da2505d3ae17/s_p_CXn5KmuiWradhOvh.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686990425f47da2505d3ae17/m_p_CXn5KmuiWradhOvh.jpg">ampliar</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686990545f47da2505d3ae18/s_p_IkgteAcecXoMC106.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686990545f47da2505d3ae18/m_p_IkgteAcecXoMC106.jpg">ampliar</a>]</p><h3>Baptisterio de San Giovanni in Fonte (Nápoles)</h3><p>Años 350-400. [11][12]</p><img src="https://res.bibleox.com/s/img/image/simple/6869924c5f47da2505d3ae1a/s_p_t1iU8sClY3pnOnkK.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6869924c5f47da2505d3ae1a/m_p_t1iU8sClY3pnOnkK.jpg">ampliar</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686992505f47da2505d3ae1b/s_p_BrRKZmtReJbgXm0w.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686992505f47da2505d3ae1b/m_p_BrRKZmtReJbgXm0w.jpg">ampliar</a>]</p><h3>Cristo y los ángeles, la Segunda Venida (Tesalónica, Bizancio)</h3><p>Finales del siglo IV. [17][18]. Rotonda de San Jorge el Victorioso (originariamente, mausoleo del emperador Galerio).</p><img src="https://res.bibleox.com/s/img/image/simple/6931a254205184ec278d6fa9/s_p_bWn7Chqiox5UOEd4.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931a254205184ec278d6fa9/m_p_bWn7Chqiox5UOEd4.jpg">ampliar</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a2ba205184ec278d6faa/m_p_ROPWmBVyUxWMGo9Z.jpg">versión 2</a>]</p><p>El mosaico se conserva mal. De la imagen de Cristo queda un fragmento del nimbo, de la mano y de la cruz. Alrededor se ven bien los rostros de los ángeles.</p><img src="https://res.bibleox.com/s/img/image/simple/686a91695f47da2505d3ae1f/s_p_EoOSmhaBPsy32XQQ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686a91695f47da2505d3ae1f/m_p_EoOSmhaBPsy32XQQ.jpg">ampliar</a>]</p><h3>Santos obispos, guerreros y médicos (Tesalónica, Bizancio)</h3><p>Finales del siglo IV [17][18]. Rotonda de san Jorge el Victorioso (originalmente, tumba del emperador Galerio).</p><p>Entre los mosaicos se encuentran imágenes de santos obispos, guerreros, médicos y músicos con los nombres de Román, Cirilo, León, Onesíforo, Eucarpo, Basilisco, Porfirio, Filemón, Prisco, Ferino, Cosme y Damián.</p><img src="https://res.bibleox.com/s/img/image/simple/686aa0275f47da2505d3ae21/s_p_oIksDo9rIgSoAXvG.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa0275f47da2505d3ae21/m_p_oIksDo9rIgSoAXvG.jpg">ampliar</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686aa02e5f47da2505d3ae22/s_p_nTZtC6C93KI8Fu6I.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa02e5f47da2505d3ae22/m_p_nTZtC6C93KI8Fu6I.jpg">ampliar</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686aa0335f47da2505d3ae23/s_p_b1KhWllqTzipVhO9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa0335f47da2505d3ae23/m_p_b1KhWllqTzipVhO9.jpg">ampliar</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686aa0385f47da2505d3ae24/s_p_vvlbG9E89B9T0U8j.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa0385f47da2505d3ae24/m_p_vvlbG9E89B9T0U8j.jpg">ampliar</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686aa03f5f47da2505d3ae25/s_p_d3lcRobegfAQOf6e.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa03f5f47da2505d3ae25/m_p_d3lcRobegfAQOf6e.jpg">ampliar</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686aa0555f47da2505d3ae27/s_p_h1YgFpMukwaYc23Q.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa0555f47da2505d3ae27/m_p_h1YgFpMukwaYc23Q.jpg">ampliar</a>]</p><p>Santos Cosme y Damián</p><img src="https://res.bibleox.com/s/img/image/simple/686aa04e5f47da2505d3ae26/s_p_LwMjPHLsabDDxEHy.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa04e5f47da2505d3ae26/m_p_LwMjPHLsabDDxEHy.jpg">ampliar</a>]</p><h3>Imagen de Cristo crucificado entre los ladrones (Roma)</h3><p>Principios del siglo IV. Basílica de Santa Sabina, uno de los paneles de la puerta. Imagen en relieve de la Crucifixión.</p><img src="https://res.bibleox.com/s/img/image/simple/676183a8dba7720001cd0e2b/s_p_ccaA7HzLPDInwe1b.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/676183a8dba7720001cd0e2b/m_p_ccaA7HzLPDInwe1b.jpg">ampliar</a>]</p><h3>La entrada del Señor en Jerusalén (Bizancio)</h3><p>Principios del siglo IV. <a href="https://www.metmuseum.org/art/collection/search/466220">Museo Metropolitano en la Quinta Avenida, EE. UU.</a>. 67.3 × 212.1 × 61.9 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5e69845c75323d28a5e9d/s_p_Kk1dIB2OLr1OjQ1O.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5e69845c75323d28a5e9d/m_p_Kk1dIB2OLr1OjQ1O.jpg">ampliar</a>]</p><h3>Cristo, placa (Quersoneso)</h3><p>Años 300-500. <a href="https://collections.louvre.fr/en/ark:/53355/cl010276835">Louvre, Francia</a>. El museo afirma que la segunda parte se conserva en el Hermitage. Están grabadas las palabras dirigidas al apóstol Pedro.</p><img src="https://res.bibleox.com/s/img/image/simple/68c41cec6594f46d35a87f04/s_p_esWl4etLsBMVz9bw.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c41cec6594f46d35a87f04/m_p_esWl4etLsBMVz9bw.jpg">ampliar</a>]</p><h3>Cristo Maestro (Roma)</h3><p>Catacumbas de Domitila. Pintura del luneto de la cubícula.</p><img src="https://res.bibleox.com/s/img/image/simple/674ed2a4dba77200011c738a/s_p_4M8Vki7GNJBHkJPN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674ed2a4dba77200011c738a/m_p_4M8Vki7GNJBHkJPN.jpg">ampliar</a>]</p><h3>El Señor Jesucristo (Roma)</h3><p>Siglos III-V. Catacumbas de Generosa [7]</p><img src="https://res.bibleox.com/s/img/image/simple/674f2408dba77200011c739c/s_p_zVliPTIYBpqqnTGQ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f2408dba77200011c739c/m_p_zVliPTIYBpqqnTGQ.jpg">ampliar</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6931a55a205184ec278d6faf/s_p_xXRXPudiFDi6GltL.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931a55a205184ec278d6faf/m_p_xXRXPudiFDi6GltL.jpg">ampliar</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686bf5b25f47da2505d3ae36/m_p_Io7kaT9uNdBPFcSj.jpg">versión 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a5b6205184ec278d6fb0/m_p_btFyqkRBFzGf0FSH.jpg">versión 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a5e4205184ec278d6fb1/m_p_wuVaj4ghYuk6s5cc.jpg">versión 4</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a5fe205184ec278d6fb2/m_p_mO6KaZXywWX76vBg.jpg">versión 5</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a656205184ec278d6fb3/m_p_eqLfG1BFyG45i90X.jpg">versión 6</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a858205184ec278d6fb5/m_p_EVVCP1plDQZ4XgAS.jpg">versión 7</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6931a360205184ec278d6fab/s_p_hObpAcapDVZvLsC1.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931a360205184ec278d6fab/m_p_hObpAcapDVZvLsC1.jpg">ampliar</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6931a369205184ec278d6fad/s_p_8bP3aXtUgkNcP9gz.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931a369205184ec278d6fad/m_p_8bP3aXtUgkNcP9gz.jpg">ampliar</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6931a363205184ec278d6fac/s_p_BcSN3IXA4JYFLpgA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931a363205184ec278d6fac/m_p_BcSN3IXA4JYFLpgA.jpg">ampliar</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6931a36f205184ec278d6fae/s_p_6J6vSMM0TM5tc59T.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931a36f205184ec278d6fae/m_p_6J6vSMM0TM5tc59T.jpg">ampliar</a>]</p><h3>Santos Beatriz y Simplicio (o Rufo) (Roma)</h3><p>Siglos III-V. Catacumbas de Generosa [7]</p><img src="https://res.bibleox.com/s/img/image/simple/66cc2c40dba77200019bc7d8/s_p_zABjPHGhPdjGVh3U.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/66cc2c40dba77200019bc7d8/m_p_zABjPHGhPdjGVh3U.jpg">ampliar</a>]</p><h3>Apóstoles Pedro y Pablo (Roma)</h3><p>~380. Catacumbas de Santa Tecla, fresco [24]</p><p>Están representados los apóstoles: Pedro, Pablo, Andrés y Juan.</p><img src="https://res.bibleox.com/s/img/image/simple/686bf38e5f47da2505d3ae35/s_p_BxfiObhkLMfci8nP.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686bf38e5f47da2505d3ae35/m_p_BxfiObhkLMfci8nP.jpg">ampliar</a>] [<a href="https://res.bibleox.com/s/img/image/simple/687291145f47da2505d3ae8b/m_p_WXlkaMJTOrIzlOdI.jpg">versión 2</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/68b6cd4802e89ba22dfc3977/s_p_kAWGH2VPHMkRv9cL.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b6cd4802e89ba22dfc3977/m_p_kAWGH2VPHMkRv9cL.jpg">ampliar</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686bf5bf5f47da2505d3ae37/m_p_F0tsoqA9bv6CrpfE.jpg">versión 2</a>]</p><h3>Apóstoles Pedro y Pablo (Bizancio)</h3><p>Mediados del siglo IV. Cristo entrega las coronas de los mártires a los apóstoles Pedro y Pablo. <a href="https://www.metmuseum.org/art/collection/search/463547">Museo Metropolitano en la Quinta Avenida, EE. UU.</a>. Roma o Bizancio. 13.8 x 12.5 x 5 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5f5d745c75323d28a5ebc/s_p_MiCffui3hayo2BCt.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5f5d745c75323d28a5ebc/m_p_MiCffui3hayo2BCt.jpg">ampliar</a>]</p><hr><p>Mediados del siglo IV. <a href="https://www.metmuseum.org/art/collection/search/468386">Museo Metropolitano en la Quinta Avenida, EE. UU.</a>. Roma o Bizancio. 8.5 x 14 x 13.3 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5e89c45c75323d28a5ea1/s_p_HAfNPGdEHMp67CuN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5e89c45c75323d28a5ea1/m_p_HAfNPGdEHMp67CuN.jpg">ampliar</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5e88f45c75323d28a5ea0/m_p_gvro4Ry9POJUm0nR.jpg">vista lateral</a>]</p><hr><p>Finales del siglo IV. <a href="https://www.metmuseum.org/art/collection/search/463714">Museo Metropolitano en la Quinta Avenida, EE. UU.</a>. Vidrio, pan de oro.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5e68b45c75323d28a5e9c/s_p_uRLyImBPPDsr48G2.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5e68b45c75323d28a5e9c/m_p_uRLyImBPPDsr48G2.jpg">ampliar</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5e76d45c75323d28a5e9e/m_p_62cHpid14wgeSyqc.jpg">versión 2</a>]</p><hr><p>Mediados del siglo IV. Apóstoles Pedro y Pablo, Peregrina. <a href="https://www.metmuseum.org/art/collection/search/465922">Museo Metropolitano en la Quinta Avenida, EE. UU.</a>. 11.5 x 13.3 x 1.2 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5e7d145c75323d28a5e9f/s_p_atDwcEc3h2ZyYLRb.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5e7d145c75323d28a5e9f/m_p_atDwcEc3h2ZyYLRb.jpg">ampliar</a>]</p><h3>Apóstoles Pedro y Pablo (Roma)</h3><p>Siglo IV. Placa utilizada para cerrar un nicho funerario infantil (loculus) en las catacumbas. Roma, Museos Vaticanos, Museo Cristiano Pío.</p><img src="https://res.bibleox.com/s/img/image/simple/674f1bc0dba77200011c739a/s_p_uH3btIsNTUn6lHGQ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f1bc0dba77200011c739a/m_p_uH3btIsNTUn6lHGQ.jpg">ampliar</a>]</p><h3>Madre de Dios con el Niño Cristo (Roma)</h3><p>Siglos III-IV. Catacumbas de Domitila.</p><img src="https://res.bibleox.com/s/img/image/simple/66cc2c11dba77200019bc7d5/s_p_rZQc8oqW4YIrUMho.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/66cc2c11dba77200019bc7d5/m_p_rZQc8oqW4YIrUMho.jpg">ampliar</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686d246b5f47da2505d3ae57/m_p_AZTFv8hTAm4Eo9yp.jpg">versión 2</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686d24885f47da2505d3ae58/s_p_Z1QqJZuraUn8iLSV.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d24885f47da2505d3ae58/m_p_Z1QqJZuraUn8iLSV.jpg">ampliar</a>]</p><h3>Cruz con la imagen de Cristo (Bizancio)</h3><p>Años 395-641. <a href="https://collections.louvre.fr/en/ark:/53355/cl010043937">Louvre, Francia</a>. 8,5 × 20 × 1,2 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c5886594f46d35a87ec7/s_p_wU3HuTavyFqHCHIc.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c5886594f46d35a87ec7/m_p_wU3HuTavyFqHCHIc.jpg">ampliar</a>]</p><h3>Icono (Egipto)</h3><p>Años 395-641. <a href="https://collections.louvre.fr/en/ark:/53355/cl010049211">Louvre, Francia</a>. 24 × 17,5 cm</p><img src="https://res.bibleox.com/s/img/image/simple/68c3bf006594f46d35a87ebf/s_p_m1O6PHgeoR9L2huf.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3bf006594f46d35a87ebf/m_p_m1O6PHgeoR9L2huf.jpg">ampliar</a>]</p><hr><p><a href="https://collections.louvre.fr/en/ark:/53355/cl010049209">Louvre, Francia</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c8966594f46d35a87ec8/s_p_hfH86ZqQDaRWHKRA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c8966594f46d35a87ec8/m_p_hfH86ZqQDaRWHKRA.jpg">ampliar</a>]</p><h3>Ampolla con el icono de san Menas (Bizancio)</h3><p>Años 395-641. <a href="https://collections.louvre.fr/en/ark:/53355/cl010042774">Louvre, Francia</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c4176594f46d35a87ec3/s_p_RYRsljTrixb3giuP.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c4176594f46d35a87ec3/m_p_RYRsljTrixb3giuP.jpg">ampliar</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c3c4196594f46d35a87ec4/m_p_20KqaRLqoxUISfqB.jpg">reverso</a>]</p><hr><p>Años 395-641. <a href="https://collections.louvre.fr/en/ark:/53355/cl010042778">Louvre, Francia</a>. Ampollas semejantes se encuentran en muy gran cantidad en distintos museos. Otros ejemplos: <a href="https://collections.louvre.fr/en/ark:/53355/cl010042780">1</a>, <a href="https://collections.louvre.fr/en/ark:/53355/cl010042798">2</a>, <a href="https://collections.louvre.fr/en/ark:/53355/cl010042802">3</a>, <a href="https://collections.louvre.fr/en/ark:/53355/cl010043779">4</a>, <a href="https://collections.louvre.fr/en/ark:/53355/cl010076645">5</a>, <a href="https://collections.louvre.fr/en/ark:/53355/cl010051239">6</a>, <a href="https://collections.louvre.fr/en/ark:/53355/cl010263188">7</a>, <a href="https://collections.louvre.fr/en/ark:/53355/cl010280896">8</a>, <a href="https://collections.louvre.fr/en/ark:/53355/cl010044285">9</a>, <a href="https://collections.louvre.fr/en/ark:/53355/cl010280846">10</a>, <a href="https://collections.louvre.fr/en/ark:/53355/cl010280894">11</a>, <a href="https://www.clevelandart.org/art/1999.232">12</a>, <a href="https://www.clevelandart.org/art/1999.233">13</a>, <a href="https://www.clevelandart.org/art/1999.231">14</a>, <a href="https://www.clevelandart.org/art/1999.230">15</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c4c66594f46d35a87ec5/s_p_b5etRE60QJjNF7zQ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c4c66594f46d35a87ec5/m_p_b5etRE60QJjNF7zQ.jpg">ampliar</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c4cd6594f46d35a87ec6/s_p_vJbng6ICUUefTimC.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c4cd6594f46d35a87ec6/m_p_vJbng6ICUUefTimC.jpg">ampliar</a>]</p><h3>Ampolla de plomo con la imagen de la Madre de Dios y de Cristo (Italia, Bolonia)</h3><p>Siglos IV-V. «Ampollas semejantes con óleo santo de los lugares santos eran traídas en gran cantidad por los peregrinos de Oriente, precisamente de Palestina, adonde las peregrinaciones se establecieron desde finales del siglo IV y en la primera mitad del siglo V en gran número» [27]</p><img src="https://res.bibleox.com/s/img/image/simple/686d3bdc5f47da2505d3ae5f/s_p_gcwh26YTfBvz5FbR.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d3bdc5f47da2505d3ae5f/m_p_gcwh26YTfBvz5FbR.jpg">ampliar</a>]</p><h2>Siglo V</h2><h3>Madre de Dios con el Niño Jesús, los mártires Félix y Adaucto, la viuda Comodila (Roma)</h3><p>Siglos V-VI. Catacumbas de Comodila. A la izquierda, en primer plano, está representada la viuda Comodila, una rica romana en cuya memoria se construyó el templo de las catacumbas.</p><img src="https://res.bibleox.com/s/img/image/simple/674edb84dba77200011c738c/s_p_urBcFMzNnn49NanW.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674edb84dba77200011c738c/m_p_urBcFMzNnn49NanW.jpg">ampliar</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686bf61f5f47da2505d3ae38/m_p_gOZdkzGPGcL4Vws0.jpg">versión 2</a>]</p><h3>Cristo y la Madre de Dios (Bizancio)</h3><p>Años 400-500. Material: oro. 3,7 × 4 × 0,3 cm; peso: 4,04 g. <a href="https://collections.louvre.fr/en/ark:/53355/cl010256498">Louvre, Francia</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c403846594f46d35a87efb/s_p_Ahj64DxPe313azhi.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c403846594f46d35a87efb/m_p_Ahj64DxPe313azhi.jpg">ampliar</a>]</p><h3>Mártir Lorenzo (Rávena)</h3><p>Año 425. Mausoleo de Gala Placidia[1][2][25]. En el armario abierto hay cuatro Evangelios: según Marcos, según Mateo, según Lucas y según Juan. El santo, con la cruz y el Evangelio abierto, va hacia la reja bajo la cual arde el fuego.</p><img src="https://res.bibleox.com/s/img/image/simple/674ee461dba77200011c738e/s_p_EPEyZAtXMtLhz0vO.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674ee461dba77200011c738e/m_p_EPEyZAtXMtLhz0vO.jpg">ampliar</a>]</p><h3>Apóstol Pablo (Éfeso)</h3><p>Fresco de finales del siglo V en la cueva de San Pablo[4].</p><img src="https://res.bibleox.com/s/img/image/simple/674f2a67dba77200011c73a0/s_p_Og6LudyAS5axVwrH.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f2a67dba77200011c73a0/m_p_Og6LudyAS5axVwrH.jpg">ampliar</a>]</p><h3>Apóstol Pablo (Nápoles)</h3><p>Finales del siglo V. Catacumbas de San Jenaro, fresco. Probablemente está representado el apóstol Pablo.</p><img src="https://res.bibleox.com/s/img/image/simple/674f2705dba77200011c739d/s_p_XdEMnSngRpC4ver8.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f2705dba77200011c739d/m_p_XdEMnSngRpC4ver8.jpg">ampliar</a>]</p><h3>Tecla de Iconio, mártir (Éfeso)</h3><p>Cueva de los santos Pablo y Tecla. Una de las que creyeron por la predicación del apóstol Pablo, mártir de los primeros siglos. En 2013 la cueva fue profanada por militantes islamistas[4].</p><img src="https://res.bibleox.com/s/img/image/simple/674f2c2edba77200011c73a1/s_p_tCvOXPpRP5ogjE1Y.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f2c2edba77200011c73a1/m_p_tCvOXPpRP5ogjE1Y.jpg">ampliar</a>]</p><h3>Gran mártir Demetrio de Tesalónica y un ángel (Tesalónica, Bizancio)</h3><p>Siglos V-VI. Basílica de san Demetrio en Tesalónica. Mosaico en la parte occidental del templo [10]</p><img src="https://res.bibleox.com/s/img/image/simple/686984705f47da2505d3ae11/s_p_bliIzjPrQcGjWmMT.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686984705f47da2505d3ae11/m_p_bliIzjPrQcGjWmMT.jpg">ampliar</a>]</p><h3>Gran mártir Demetrio de Tesalónica y un niño (Tesalónica, Bizancio)</h3><p>Siglos V-VI. Basílica de san Demetrio en Tesalónica. Mosaico en el muro occidental de la nave sur [10]</p><img src="https://res.bibleox.com/s/img/image/simple/68697c845f47da2505d3ae10/s_p_T8JYB6OgB0WUM8O6.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68697c845f47da2505d3ae10/m_p_T8JYB6OgB0WUM8O6.jpg">ampliar</a>]</p><h3>Casa del senador, Santa Pudenciana (Roma)</h3><p>Años 402-417 [13][14]</p><img src="https://res.bibleox.com/s/img/image/simple/6869938e5f47da2505d3ae1c/s_p_l5Dokt3jzLvx6IxN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6869938e5f47da2505d3ae1c/m_p_l5Dokt3jzLvx6IxN.jpg">ampliar</a>]</p><h3>Santa María la Mayor (Roma)</h3><p>Años 432-440 [15][16]</p><img src="https://res.bibleox.com/s/img/image/simple/6869954e5f47da2505d3ae1d/s_p_0bDTRtbRpWWnfPQR.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6869954e5f47da2505d3ae1d/m_p_0bDTRtbRpWWnfPQR.jpg">ampliar</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686995555f47da2505d3ae1e/s_p_FLcJtADykEgKNDDd.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686995555f47da2505d3ae1e/m_p_FLcJtADykEgKNDDd.jpg">ampliar</a>]</p><h3>Cristo, los tres jóvenes, los magos (Italia del Norte)</h3><p>Años 400-450. <a href="https://collections.louvre.fr/en/ark:/53355/cl010256191">Louvre, Francia</a>. Plata, 6,3 × 12,3 × 7,1 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c1756594f46d35a87ec1/s_p_WzOTF3me39ISTfnN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c1756594f46d35a87ec1/m_p_WzOTF3me39ISTfnN.jpg">ampliar</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c1796594f46d35a87ec2/s_p_a0udZW5EPewQCqsl.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c1796594f46d35a87ec2/m_p_a0udZW5EPewQCqsl.jpg">ampliar</a>]</p><h3>Icono, el apóstol Pedro dicta el Evangelio a san Marcos (Egipto)</h3><p>Años 440-670. <a href="https://www.metmuseum.org/art/collection/search/477163">Museo Metropolitano en la Quinta Avenida, EE. UU.</a>. 13.5 x 10 x 0.8 cm. Véanse también: <a href="https://www.metmuseum.org/art/collection/search/477492">1</a>, <a href="https://www.metmuseum.org/art/collection/search/477487">2</a>, <a href="https://www.metmuseum.org/art/collection/search/477481">3</a>, <a href="https://www.metmuseum.org/art/collection/search/477489">4</a>, <a href="https://www.metmuseum.org/art/collection/search/477491">5</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c1c2f56594f46d35a87e74/s_p_BWhcee0cn10mz7dc.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1c2f56594f46d35a87e74/m_p_BWhcee0cn10mz7dc.jpg">ampliar</a>]</p><h3>Santo desconocido (Bizancio, Egipto)</h3><p>Siglos V-VI. <a href="https://www.metmuseum.org/art/collection/search/329982">Museo Metropolitano en la Quinta Avenida, EE. UU.</a>. 44 × 32.5 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5eb2d45c75323d28a5ea3/s_p_E5UUO66hSfRBtXUn.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5eb2d45c75323d28a5ea3/m_p_E5UUO66hSfRBtXUn.jpg">ampliar</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5eb2845c75323d28a5ea2/m_p_ofbMCUTa1winWDg0.jpg">versión 2</a>]</p><h3>Ampolla con la imagen de san Menas (Egipto copto)</h3><p>Siglos V-VII. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/87092?query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=34">Hermitage, Rusia</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c0796480b4d285320413/s_p_sW3adkK7lr960dU5.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c0796480b4d285320413/m_p_sW3adkK7lr960dU5.jpg">ampliar</a>]</p><hr><p>Siglos V-VI, ampolla con la imagen de san Menas (Egipto). <a href="https://www.metmuseum.org/art/collection/search/854993">Museo Metropolitano en la Quinta Avenida, EE. UU.</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5f3f845c75323d28a5eb8/s_p_ePhTgphiYrxHdEaZ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5f3f845c75323d28a5eb8/m_p_ePhTgphiYrxHdEaZ.jpg">ampliar</a>]</p><hr><p>Siglos V-VI, ampolla con la imagen de san Menas (Egipto). <a href="https://www.metmuseum.org/art/collection/search/854994">Museo Metropolitano en la Quinta Avenida, EE. UU.</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5f40645c75323d28a5eb9/s_p_5HMBehehtBuCUdOm.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5f40645c75323d28a5eb9/m_p_5HMBehehtBuCUdOm.jpg">ampliar</a>]</p><h3>Anillo con la imagen de Cristo (Egipto, Luxor)</h3><p>Siglos V-VII. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/111849?page=5&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%B0&amp;index=240">Hermitage, Rusia</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c4d46480b4d285320420/s_p_SyuBoqgvHXMA5UIe.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c4d46480b4d285320420/m_p_SyuBoqgvHXMA5UIe.jpg">ampliar</a>]</p><h2>Siglo VI</h2><h3>El Señor Jesucristo (Sinaí)</h3><p>Siglo VI. Monasterio de santa Catalina, Egipto [3].</p><img src="https://res.bibleox.com/s/img/image/simple/686fe7935f47da2505d3ae87/s_p_cikLnQnMeZgiaeXg.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686fe7935f47da2505d3ae87/m_p_cikLnQnMeZgiaeXg.jpg">ampliar</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6872d4935f47da2505d3ae90/m_p_1CbtDgulMkyLj9dK.jpg">versión 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6872d4835f47da2505d3ae8d/m_p_IPypUclQUGcqTIJa.jpg">versión 3</a>]</p><h3>Madre de Dios con el Niño Jesús, los santos Teodoro y Jorge (Sinaí)</h3><p>Siglo VI. Monasterio de santa Catalina, icono en encáustica, Egipto.</p><img src="https://res.bibleox.com/s/img/image/simple/674ece56dba77200011c7384/s_p_RWNQK8qhzLwXxGkf.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674ece56dba77200011c7384/m_p_RWNQK8qhzLwXxGkf.jpg">ampliar</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6872d4895f47da2505d3ae8e/m_p_6JgREZVUzpO8lC9E.jpg">versión 2</a>]</p><h3>Apóstol Pedro (Sinaí)</h3><p>Siglo VI. Monasterio de santa Catalina, icono en encáustica, Egipto.</p><img src="https://res.bibleox.com/s/img/image/simple/686fe28f5f47da2505d3ae82/s_p_tWJyRADNEjI9Gt5J.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686fe28f5f47da2505d3ae82/m_p_tWJyRADNEjI9Gt5J.jpg">ampliar</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686fe73d5f47da2505d3ae86/m_p_ztqtzVnOwMfzjCsd.jpg">versión 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6872d48f5f47da2505d3ae8f/m_p_x4BAyJ0C1GjHQ7Us.jpg">versión 3</a>]</p><h3>La Madre de Dios y el Niño Cristo (Bizancio)</h3><p>Siglo VI. <a href="https://www.metmuseum.org/art/collection/search/463392">Museo Metropolitano en la Quinta Avenida, EE. UU.</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5fce645c75323d28a5ec5/s_p_KB8coyb4H50zurQW.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5fce645c75323d28a5ec5/m_p_KB8coyb4H50zurQW.jpg">ampliar</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5fce945c75323d28a5ec6/m_p_eIaeevwinjFBQAeA.jpg">versión 2</a>]</p><h3>Anillo con el icono de la Madre de Dios y del Niño Cristo (Bizancio)</h3><p>Siglos VI-VII. <a href="https://www.metmuseum.org/art/collection/search/464059">Museo Metropolitano en la Quinta Avenida, EE. UU.</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5fe7745c75323d28a5ec7/s_p_bcCSRfNkRmmk5jZs.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5fe7745c75323d28a5ec7/m_p_bcCSRfNkRmmk5jZs.jpg">ampliar</a>]</p><h3>Santa María</h3><p>Año 611, <a href="https://www.pravenc.ru/text/164537.html">Gerasa</a></p><img src="https://res.bibleox.com/s/img/image/simple/482/s_p_s3flMTpYpn69iMIy.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/482/m_p_s3flMTpYpn69iMIy.jpg">ampliar</a>]</p><h3>Cristo, medallón (Antioquía)</h3><p>Años 500-625. Material: plata, dorado. 14,9 × 14,1 × 1,1 cm. <a href="https://collections.louvre.fr/en/ark:/53355/cl010256496">Louvre, Francia</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c409da6594f46d35a87f00/s_p_BHIOy3tEZ3ZoMEr5.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c409da6594f46d35a87f00/m_p_BHIOy3tEZ3ZoMEr5.jpg">ampliar</a>]</p><hr><p>Años 500-625. <a href="https://collections.louvre.fr/en/ark:/53355/cl010256495">Louvre, Francia</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c41f626594f46d35a87f05/s_p_bKgaW542SgyD11o9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c41f626594f46d35a87f05/m_p_bKgaW542SgyD11o9.jpg">ampliar</a>]</p><h3>Tapiz con iconos: Cristo, la Madre de Dios, los arcángeles Miguel y Gabriel, los apóstoles (Egipto, Bizancio)</h3><p>Año 500. <a href="https://www.clevelandart.org/art/1967.144">Museo de Arte de Cleveland, EE. UU.</a>. Lana, 178,7 x 110,5 cm.</p><p>Comentario del museo:</p><blockquote><p>Tejido con hilos de lana de más de veinte colores, este raro tapiz costaba en su tiempo más que un lienzo pintado. El precio histórico reflejaba el reconocimiento que los contemporáneos daban a la maestría en la mezcla de colores lograda por los tejedores. Colocado en la pared, <strong>este icono tejido permitía a los fieles rendir veneración a la Madre de Dios y al Niño Cristo dentro de los muros del templo ortodoxo</strong>. Los rodean ángeles y apóstoles con inscripciones de sus nombres en griego. Para ser espiritualmente eficaz, el icono (la imagen sagrada) debe seguir lo más exactamente posible la tradición iconográfica establecida de su imagen.</p><p>La inscripción en el dintel del marco arquitectónico se traduce del griego como «<strong>San Miguel, Santa María, San Gabriel</strong>». El ancho borde de follaje está adornado con frutos y flores, y en la parte inferior, con medallones de bustos de apóstoles cuyos nombres están escritos al lado en griego y se traducen como «<strong>Andrés, Mateo, el apóstol Pablo, Lucas, Santiago, Felipe, Marcos, Tomás, Juan, Matías, Pedro y Bartolomé</strong>».</p></blockquote><img src="https://res.bibleox.com/s/img/image/simple/68cb9dd5205184ec278d58d7/s_p_jXuLxO8mwNy5DicO.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68cb9dd5205184ec278d58d7/m_p_jXuLxO8mwNy5DicO.jpg">ampliar</a>]</p><h3>Tapiz con iconos. ¿Los tres jóvenes?, crismón (Egipto, Bizancio)</h3><p>Años 500. <a href="https://www.clevelandart.org/art/1982.73">Museo de Arte de Cleveland, EE. UU.</a>. Lana, lino. 110,5 x 76,8 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68cb9dde205184ec278d58d8/s_p_w5vxLEtZSz6mW36r.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68cb9dde205184ec278d58d8/m_p_w5vxLEtZSz6mW36r.jpg">ampliar</a>]</p><h3>Tapiz con iconos. La Madre de Dios, los magos, el profeta Jonás (Egipto, Bizancio)</h3><p>Años 500-550. <a href="https://www.clevelandart.org/art/1951.400">Museo de Arte de Cleveland, EE. UU.</a>. Lino. 99,7 x 104,8 cm.</p><p>Comentario del museo:</p><blockquote><p>… A la izquierda, en el registro superior, están representados <strong>la Virgen María con el Niño Cristo</strong> sobre un taburete con patas en forma de cruz. Como indica la inscripción copta, <strong>tres reyes se acercan por la derecha trayendo dones</strong>. El registro central de la izquierda probablemente representa <strong>el bautismo de Cristo</strong>, mientras que las otras tres figuras, separadas por columnas, al parecer ilustran el milagro neotestamentario en el que Cristo alimentó a una gran multitud con solo cinco panes y dos peces. En el registro inferior aún es reconocible <strong>la escena veterotestamentaria del profeta Jonás engullido por la ballena</strong>.</p><p>Las inscripciones griegas identifican diversas escenas del Antiguo y del Nuevo Testamento. Sobre el primero de los magos, en el registro superior, se pueden distinguir dos letras <strong>«XP»</strong> de la palabra griega que designa el oro (<em>χρυσός - chrysós</em>). A la izquierda, en el registro central, están representadas dos figuras: la primera está casi completamente destruida, y la segunda está identificada por la inscripción <strong>«EIΩANNHC» (Juan)</strong>. En el registro inferior se presenta la imagen de Jonás arrojado a la orilla, con un gran pez junto a él y acompañada de la inscripción <strong>«EIΩNAC» (Jonás)</strong>. Moisés, casi completamente perdido, solo puede identificarse por su inscripción <strong>«MWCHC» (Moisés)</strong>.</p></blockquote><img src="https://res.bibleox.com/s/img/image/simple/68cb9e0d205184ec278d58d9/s_p_WiTqygXUYCZZY7TF.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68cb9e0d205184ec278d58d9/m_p_WiTqygXUYCZZY7TF.jpg">ampliar</a>]</p><h3>Cálices eucarísticos e incensarios con iconos (Bizancio, Siria, Attaruti)</h3><p>Años 500-650. <a href="https://www.metmuseum.org/art/collection/search/474390">Museo Metropolitano en la Quinta Avenida, EE. UU.</a>. Plata, dorado. En los cálices hay iconos del Señor y de los santos, así como inscripciones de quién y a quién fueron donados.</p><p>Estos objetos litúrgicos finamente elaborados —cálices, incensarios, un colador y una imagen de la paloma del Espíritu Santo— pertenecían a la iglesia cristiana de la rica ciudad comercial de Attaruti, en Siria, que entonces era una de las tierras más ricas del Imperio bizantino. Los cálices, los incensarios y el colador se utilizaban durante la Divina Liturgia, o Eucaristía, el sacramento en el que los cristianos comulgan el vino y el pan consagrados en memoria de la Última Cena y de la muerte de Cristo.</p><p>Según las inscripciones que llevan, hechas en griego con varias variantes ortográficas, muchos de estos objetos fueron donados por los habitantes locales a la iglesia principal de la ciudad, dedicada a san Esteban, y a la iglesia menor, dedicada a san Juan (probablemente a Juan el Precursor [el Bautista]).</p><p>A principios del siglo VII, Siria cayó primero bajo el empuje de los persas sasánidas y luego bajo el de los ejércitos del islam. Probablemente estas obras de arte fueron enterradas a toda prisa en un recipiente protector en el momento en que el ejército bizantino se retiraba ante el empuje de los que atacaban la región.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5db2045c75323d28a5e9a/s_p_kx70rC7wWJQtkfdG.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5db2045c75323d28a5e9a/m_p_kx70rC7wWJQtkfdG.jpg">ampliar</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5edf045c75323d28a5ea5/m_p_Eru1rmuua6UWqjTz.jpg">versión 2</a>]</p><hr><p>Juan Bautista de larga cabellera, la Madre de Dios en actitud orante (con las manos alzadas), un santo en actitud orante, un santo guerrero con bastón y escudo, el joven Cristo con nimbo crucífero y otro santo guerrero con armadura que hiere al dragón (¿san Jorge?), bajo arcadas. <a href="https://www.metmuseum.org/art/collection/search/466137">Museo Metropolitano en la Quinta Avenida, EE. UU.</a>. 21.3 x 16 cm.</p><p>Inscripción en griego: «<strong>Para su salvación, Eudoxia trajo [esto] como don a San Esteban de la aldea de Attar[uti]</strong>».</p><img src="https://res.bibleox.com/s/img/image/simple/68b5efa445c75323d28a5eaa/s_p_l5pPSsTDZHSQuvNU.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5efa445c75323d28a5eaa/m_p_l5pPSsTDZHSQuvNU.jpg">ampliar</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f01f45c75323d28a5eab/m_p_456sbKEe3ANd9ZWP.jpg">versión 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f02245c75323d28a5eac/m_p_fkJIydq7uEfZbIUt.jpg">versión 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f02445c75323d28a5ead/m_p_s25q6Lu5HItPjqDs.jpg">versión 4</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f02745c75323d28a5eae/m_p_QJsAgl2zRfYmpNDL.jpg">versión 5</a>]</p><hr><p>Cáliz eucarístico con icono de san Juan Bautista, de un santo diácono (probablemente Esteban), de santos obispos y cruces. <a href="https://www.metmuseum.org/art/collection/search/466130">Museo Metropolitano en la Quinta Avenida, EE. UU.</a>. 20.5 × 15.1 cm, 369g, 1100 ml</p><p>Inscripción en griego: «<strong>A San Juan de la aldea de Atarotis</strong>».</p><img src="https://res.bibleox.com/s/img/image/simple/68b5ec4545c75323d28a5ea4/s_p_KWMPzINWo4ktBKQ7.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5ec4545c75323d28a5ea4/m_p_KWMPzINWo4ktBKQ7.jpg">ampliar</a>]</p><hr><p>Cáliz eucarístico con icono de Cristo, de la Madre de Dios, de Juan Bautista y de Jorge el Victorioso. <a href="https://www.metmuseum.org/art/collection/search/466129">Museo Metropolitano en la Quinta Avenida, EE. UU.</a>. 24,3 x 16,8 cm.</p><p>Inscripción en griego: «<strong>San Esteban de la aldea de Attaruta</strong>».</p><img src="https://res.bibleox.com/s/img/image/simple/68b5ee1345c75323d28a5ea6/s_p_9bHxlNSj26b5EhMw.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5ee1345c75323d28a5ea6/m_p_9bHxlNSj26b5EhMw.jpg">ampliar</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5ee3c45c75323d28a5ea7/m_p_8XweLe1b1pD7GWHb.jpg">versión 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5ee4045c75323d28a5ea8/m_p_faMKsJUImltU9s6v.jpg">versión 3</a>]</p><hr><p>Cáliz eucarístico con la imagen del joven Cristo con nimbo cruciforme, de un santo diácono con incensario (probablemente san Esteban), de la Virgen María en actitud orante y de un joven santo con bastón. Tamaño: 23.9 × 17 cm, 356g. <a href="https://www.metmuseum.org/art/collection/search/466141">Museo Metropolitano en la Quinta Avenida, EE. UU.</a></p><p>Inscripción en griego: «<strong>En cumplimiento del voto y por la salvación de aquel cuyo nombre es conocido del Señor</strong>».</p><img src="https://res.bibleox.com/s/img/image/simple/68b5fa7a45c75323d28a5ebe/s_p_7AzZiy4FebkdJC4e.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5fa7a45c75323d28a5ebe/m_p_7AzZiy4FebkdJC4e.jpg">ampliar</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5fa8345c75323d28a5ebf/m_p_LQnRTCSFvxz7O7ui.jpg">versión 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5fa8645c75323d28a5ec0/m_p_KvY9o90gFdzJeK9N.jpg">versión 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5fa8945c75323d28a5ec1/m_p_BUzuFJ6F1fLtMppI.jpg">versión 4</a>]</p><hr><p>Incensario con la imagen del joven Cristo con nimbo cruciforme, de san Juan Bautista, de la Virgen María en actitud orante, de un santo diácono (probablemente san Esteban) y de cruces. Plata y plata dorada con forro de cobre. Tamaño: 41,5 x 13,2 x 12,6 cm. <a href="https://www.metmuseum.org/art/collection/search/466132">Museo Metropolitano en la Quinta Avenida, EE. UU.</a>.</p><p>Inscripción en griego: «<strong>En nombre del descanso del alma de Erta y de Esteban, hijos de Ciriaco</strong>»</p><img src="https://res.bibleox.com/s/img/image/simple/68b5f15545c75323d28a5eaf/s_p_OJ2d0ec3h6BtKZQM.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5f15545c75323d28a5eaf/m_p_OJ2d0ec3h6BtKZQM.jpg">ampliar</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f15845c75323d28a5eb0/m_p_MLajjsEoJyZ7xPC7.jpg">versión 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f15c45c75323d28a5eb1/m_p_5k22minZ9Q7EruSj.jpg">versión 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f15e45c75323d28a5eb2/m_p_3cDRqzOwNAJr7A0S.jpg">versión 4</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f16145c75323d28a5eb3/m_p_8vKQQvQJKE8Mbtoc.jpg">versión 5</a>]</p><hr><p>Incensario con la imagen del joven Cristo con nimbo cruciforme, de dos arcángeles y de cruces. 8.2 x 13.2 cm. <a href="https://www.metmuseum.org/art/collection/search/466131">Museo Metropolitano en la Quinta Avenida, EE. UU.</a>.</p><p>Inscripción en griego: «<strong>A san Juan de la aldea de Attaruta</strong>».</p><img src="https://res.bibleox.com/s/img/image/simple/68b5f27545c75323d28a5eb4/s_p_brjJXh3ZIrplms0E.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5f27545c75323d28a5eb4/m_p_brjJXh3ZIrplms0E.jpg">ampliar</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f28545c75323d28a5eb5/m_p_oWtx1CexyxQIAxRK.jpg">versión 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f28845c75323d28a5eb6/m_p_zqvxcBdCxjLqltWh.jpg">versión 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f28c45c75323d28a5eb7/m_p_fIVExsqDAbrZLhWW.jpg">versión 4</a>]</p><h3>Cálices eucarísticos con la imagen de Cristo y de los santos, patena con cruz (Siria, Bizancio)</h3><p>Años 500-700. Museo de Arte de Cleveland, EE. UU.: <a href="https://www.clevelandart.org/art/1950.378">1</a>, <a href="https://www.clevelandart.org/art/1950.379">2</a>, <a href="https://www.clevelandart.org/art/1950.380">3</a>, <a href="https://www.clevelandart.org/art/1950.381">4</a>.</p><p>Estos cuatro vasos litúrgicos de plata —una patena y tres cálices (inv. 1950.378–81)— forman lo que hoy se llama el «Tesoro de Bet-Misona», llamado así en honor de la aldea del norte de Siria para la cual fueron fabricados estos objetos.</p><p>Aunque se desconocen el lugar exacto y las circunstancias del hallazgo del tesoro, los habitantes de la aldea de Bet-Misona, como otras comunidades cristianas de Siria y Palestina, probablemente se vieron obligados a enterrar la plata de la iglesia para esconderla de los persas o de los árabes que conquistaron sus tierras en la primera mitad del siglo VII.</p><p>La patena sobre la que se colocaban las partículas eucarísticas durante la Liturgia está adornada con una cruz latina grabada, rodeada por una inscripción votiva. En ella se nombran el donante de la patena —Domno— y su lugar de origen —la iglesia de San Sergio en Bet-Misona.</p><p>Los cálices tienen amplias copas adornadas con imágenes de medio cuerpo de Cristo, de la Madre de Dios y de los apóstoles Pedro y Pablo. En uno de los cálices hay una inscripción votiva con el nombre del donante —Ciriaco, hijo de Domno— y del presbítero de la iglesia que recibió esta piadosa donación —Zenón.</p><p>Inscripción en griego: «<strong>+ El presbítero CIRIACO, hijo de DOMNO, (trajo este cáliz) a san Sergio en tiempos del presbítero Zenón</strong>»</p><img src="https://res.bibleox.com/s/img/image/simple/68caa03c205184ec278d5880/s_p_SB8idWRkPX7keKkU.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68caa03c205184ec278d5880/m_p_SB8idWRkPX7keKkU.jpg">Cristo</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68caa026205184ec278d587d/m_p_sYIDwGwUI9iMAzzD.jpg">Madre de Dios</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68caa029205184ec278d587e/m_p_xYnPNjrcxGm5mJgl.jpg">Apóstol</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68caa02c205184ec278d587f/m_p_kH9idfsikXyvAVvy.jpg">Apóstol</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68caa0d4205184ec278d5881/m_p_vWERSBBMAoytSNnX.jpg">vista superior</a>]</p><hr><img src="https://res.bibleox.com/s/img/image/simple/68ca9cd5205184ec278d5874/s_p_tH0J7uqAriM7uaeK.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68ca9cd5205184ec278d5874/m_p_tH0J7uqAriM7uaeK.jpg">Cristo</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68ca9d13205184ec278d5878/m_p_tYRbn15h6MPNUilS.jpg">Madre de Dios</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68ca9ce8205184ec278d5875/m_p_FKfoi68UXlWCS5ky.jpg">Apóstol</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68ca9ceb205184ec278d5876/m_p_Zp9CJ61HnBcr8Csr.jpg">Apóstol</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68ca9cee205184ec278d5877/m_p_w2JDvDj5c4pMVcfk.jpg">vista superior</a>]</p><hr><img src="https://res.bibleox.com/s/img/image/simple/68ca9e94205184ec278d5879/s_p_27LzQUQDD3A7nI9X.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68ca9e94205184ec278d5879/m_p_27LzQUQDD3A7nI9X.jpg">Cristo</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68ca9e98205184ec278d587a/m_p_R47Eqr4GrHijUSIb.jpg">Madre de Dios</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68ca9e9b205184ec278d587b/m_p_31NEBZQIYBEqOut0.jpg">Apóstol</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68ca9e9e205184ec278d587c/m_p_QxtJHMZORGGwFxYQ.jpg">Apóstol</a>]</p><hr><p>Aprox. 500. Patena. <a href="https://www.clevelandart.org/art/1950.381">Museo de Arte de Cleveland, EE. UU.</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68ca964d205184ec278d5873/s_p_wNDEaPHmGHiuWeZy.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68ca964d205184ec278d5873/m_p_wNDEaPHmGHiuWeZy.jpg">ampliar</a>]</p><h3>Incensario. Bautismos y crucifixión del Señor Jesucristo (Bizancio)</h3><p>Años 500-899. Dimensiones: 13,4 x 9 cm. <a href="https://collections.louvre.fr/en/ark:/53355/cl010042067">Louvre, Francia</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c4068e6594f46d35a87efe/s_p_3kaCIWMTmQfT4NFG.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c4068e6594f46d35a87efe/m_p_3kaCIWMTmQfT4NFG.jpg">ampliar</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/68c4061f6594f46d35a87efc/s_p_XNlsrfQ2MOphupt9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c4061f6594f46d35a87efc/m_p_XNlsrfQ2MOphupt9.jpg">ampliar</a>]</p><h3>Vaso. Cristo, la Madre de Dios, Juan Bautista, los apóstoles, los ángeles (Constantinopla)</h3><img src="https://res.bibleox.com/s/img/image/simple/68c420e46594f46d35a87f06/s_p_iADN1OW5uYg5Wovc.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c420e46594f46d35a87f06/m_p_iADN1OW5uYg5Wovc.jpg">ampliar</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c420e76594f46d35a87f07/m_p_oAs6ecjPj32iGMce.jpg">reverso</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c421216594f46d35a87f0f/m_p_x6q5apwWB0DZirK2.jpg">Cristo</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c420fc6594f46d35a87f0b/m_p_sL17qrWgxkRCNRBb.jpg">Madre de Dios</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c420ea6594f46d35a87f08/m_p_Cb0UJi1oxoKCQaXw.jpg">Juan Bautista</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c421016594f46d35a87f0c/m_p_a9Y1fyPNxcQ4oNbq.jpg">ángel</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c420f66594f46d35a87f0a/m_p_nAqhqDbP5x8fRAnj.jpg">ángel</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c420ef6594f46d35a87f09/m_p_F9R3iyZ8go0PxARb.jpg">apóstol</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c4210a6594f46d35a87f0e/m_p_97cyzUvq95UJZOrR.jpg">apóstol</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c421056594f46d35a87f0d/m_p_WfK6SdjAqAOW9fDK.jpg">apóstol</a>]</p><h3>Cruz pectoral con icono (Bizancio)</h3><p>Siglo VI.<strong> </strong>Oro, pasta, cristal de roca, vidrio; estampado, granulación. Longitud de la cadena: 33 cm; cruz: 4.9 x 3.8 cm. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/227027?page=46&amp;query=%D0%BA%D1%80%D0%B5%D1%81%D1%82&amp;sort=112&amp;index=2288">Hermitage, Rusia</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c11e3c6594f46d35a87e2c/s_p_9GZmzTSaUVuXXaX1.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c11e3c6594f46d35a87e2c/m_p_9GZmzTSaUVuXXaX1.jpg">ampliar</a>]</p><h3>Colgante. Crucifixión de Cristo (Egipto)</h3><p>Años 500-700. Dimensiones: 3,3 x 1,9 cm. <a href="https://collections.louvre.fr/en/ark:/53355/cl010102800">Louvre, Francia</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c41c4e6594f46d35a87f03/s_p_tiaBwT9vqOXIlsIw.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c41c4e6594f46d35a87f03/m_p_tiaBwT9vqOXIlsIw.jpg">ampliar</a>]</p><h3>Icono de dos santos (Bizancio)</h3><p>Siglo VI; 25.5 x 22 x 1.3 cm. Posiblemente se trata de una imagen de san Mateo y de san Juan. <a href="https://www.metmuseum.org/art/collection/search/468198">Museo Metropolitano en la Quinta Avenida, EE. UU.</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5fc1545c75323d28a5ec3/s_p_a2FJmSgsGJRdELBq.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5fc1545c75323d28a5ec3/m_p_a2FJmSgsGJRdELBq.jpg">ampliar</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5fc1945c75323d28a5ec4/m_p_pcvRiRfRgBcuHJEA.jpg">versión 2</a>]</p><h3>Iconos de los apóstoles Pedro y Pablo (Antioquía)</h3><p>Años 550-600. Apóstol Pedro. <a href="https://www.metmuseum.org/art/collection/search/468348">Museo Metropolitano en la Quinta Avenida, EE. UU.</a>. Plata. 38.1 x 55.9 x 2.2 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68c1bfd36594f46d35a87e6f/s_p_WguE3h0pnnzXQXwt.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1bfd36594f46d35a87e6f/m_p_WguE3h0pnnzXQXwt.jpg">ampliar</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c1bfd56594f46d35a87e70/m_p_83EvKNt1mFSPspQw.jpg">aún más grande</a>]</p><p>Años 550-600. Apóstol Pablo. <a href="https://www.metmuseum.org/art/collection/search/468347">Museo Metropolitano en la Quinta Avenida, EE. UU.</a>. Plata. 38.1 x 55.9 x 2.2 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68c1bfda6594f46d35a87e71/s_p_5Y11faCyEzohnydQ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1bfda6594f46d35a87e71/m_p_5Y11faCyEzohnydQ.jpg">ampliar</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c1bfdd6594f46d35a87e72/m_p_jGCYAnYdrt4tlXhd.jpg">aún más grande</a>]</p><h3>Icono (¿Siria?, Bizancio)</h3><p>Años 500. <a href="https://www.clevelandart.org/art/1941.57">Museo de Arte de Cleveland, EE. UU.</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68caa8cd205184ec278d5883/s_p_qr7HPRgCtcCRwsvb.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68caa8cd205184ec278d5883/m_p_qr7HPRgCtcCRwsvb.jpg">ampliar</a>]</p><h3>Imagen de un santo guerrero (Egipto copto)</h3><p>Siglos VI-VII. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/180444?page=6&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=253">Hermitage, Rusia</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c3c06480b4d28532041c/s_p_Rnquar8nZacdzqcP.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c3c06480b4d28532041c/m_p_Rnquar8nZacdzqcP.jpg">ampliar</a>]</p><h3>Ampolla con icono del ap. Pablo (?) y de santa Tecla (Egipto)</h3><p>Años 500-700. <a href="https://collections.louvre.fr/en/ark:/53355/cl010280955">Louvre, Francia</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c4390d6594f46d35a87f15/s_p_Zxs1yv3Jg8oKfFHW.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c4390d6594f46d35a87f15/m_p_Zxs1yv3Jg8oKfFHW.jpg">ampliar</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/68c4390a6594f46d35a87f14/s_p_CPdXMrLBUE0satoH.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c4390a6594f46d35a87f14/m_p_CPdXMrLBUE0satoH.jpg">ampliar</a>]</p><h3>Ampolla con icono del apóstol Andrés (Esmirna)</h3><p>Años 500-600. <a href="https://collections.louvre.fr/en/ark:/53355/cl010281050">Louvre, Francia</a>. 7 x 5 x 2,8 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68c437966594f46d35a87f13/s_p_dCGVNUwg3KWvs9zz.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c437966594f46d35a87f13/m_p_dCGVNUwg3KWvs9zz.jpg">ampliar</a>]</p><h3>Ampollas con icono de san Menas</h3><p>Años 610-650, ampolla con la imagen de san Menas (Egipto). <a href="https://www.metmuseum.org/art/collection/search/475416">Museo Metropolitano en la Quinta Avenida, EE. UU.</a>. 8.5 x 6.9 x 1.8 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68c1c1396594f46d35a87e73/s_p_KIdJIYWMysre63rP.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1c1396594f46d35a87e73/m_p_KIdJIYWMysre63rP.jpg">ampliar</a>]</p><hr><p>Años 500-750. <a href="https://collections.louvre.fr/en/ark:/53355/cl010044285">Louvre, Francia</a>. 13 x 10,6 x 3,4 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68c3bc556594f46d35a87ebd/s_p_iHBRxhobWKvQb2Dx.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3bc556594f46d35a87ebd/m_p_iHBRxhobWKvQb2Dx.jpg">ampliar</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/68c3bc5c6594f46d35a87ebe/s_p_fQ8Ps5eHBD1myJaS.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3bc5c6594f46d35a87ebe/m_p_fQ8Ps5eHBD1myJaS.jpg">ampliar</a>]</p><h3>Cristo (Rávena)</h3><p>Iglesia de Sant'Apollinare in Classe, Rávena, Italia.</p><img src="https://res.bibleox.com/s/img/image/simple/675005d5dba77200011c73ad/s_p_rjjDEzNckea3oHk2.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/675005d5dba77200011c73ad/m_p_rjjDEzNckea3oHk2.jpg">ampliar</a>]</p><h3>Cristo y los apóstoles (Rávena)</h3><p>Mosaico del presbiterio. Iglesia de San Vitale, Rávena, Italia.</p><img src="https://res.bibleox.com/s/img/image/simple/675005dadba77200011c73ae/s_p_Nac2nrVo791COrcO.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/675005dadba77200011c73ae/m_p_Nac2nrVo791COrcO.jpg">ampliar</a>]</p><h3>Cristo, los ángeles y Vital (Rávena)</h3><p>Siglo VI. Basílica de San Vital de Milán, Rávena.</p><img src="https://res.bibleox.com/s/img/image/simple/674f0ab3dba77200011c738f/s_p_AsShtty0gMBFOX5X.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f0ab3dba77200011c738f/m_p_AsShtty0gMBFOX5X.jpg">ampliar</a>]</p><h3>Emperador Justiniano, el piadoso (Rávena)</h3><p>Siglo VI. Basílica de San Vital de Milán, Rávena.</p><img src="https://res.bibleox.com/s/img/image/simple/674f0ab8dba77200011c7390/s_p_MsUwTeWDMk0uEVPq.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f0ab8dba77200011c7390/m_p_MsUwTeWDMk0uEVPq.jpg">ampliar</a>]</p><h3>Emperatriz Teodora, la piadosa (Rávena)</h3><p>Siglo VI. Basílica de San Vital de Milán, Rávena.</p><img src="https://res.bibleox.com/s/img/image/simple/674f0ac0dba77200011c7391/s_p_6g0s1g1btiJBEXSR.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f0ac0dba77200011c7391/m_p_6g0s1g1btiJBEXSR.jpg">ampliar</a>]</p><h3>Patriarca Abraham (Rávena)</h3><p>Siglo VI. Basílica de San Vital de Milán, Rávena.</p><img src="https://res.bibleox.com/s/img/image/simple/674f0ad6dba77200011c7393/s_p_zgb5TLR1yafutIu4.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f0ad6dba77200011c7393/m_p_zgb5TLR1yafutIu4.jpg">ampliar</a>]</p><h3>Abel y Melquisedec (Rávena)</h3><p>Siglo VI. Basílica de San Vital de Milán, Rávena.</p><img src="https://res.bibleox.com/s/img/image/simple/674f0adbdba77200011c7394/s_p_PiL9TaItwhR28eXN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f0adbdba77200011c7394/m_p_PiL9TaItwhR28eXN.jpg">ampliar</a>]</p><h3>Marcelino, Polión, Pedro, santos (Roma)</h3><p>Siglo VI. Catacumbas de Ponciano. Fresco.</p><img src="https://res.bibleox.com/s/img/image/simple/66cc2c4adba77200019bc7d9/s_p_th5E9srmqGjUT72T.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/66cc2c4adba77200019bc7d9/m_p_th5E9srmqGjUT72T.jpg">ampliar</a>]</p><h3>Cristo que viene sobre las nubes, los apóstoles y los santos Cosme y Damián (Roma)</h3><p>Siglo VI (año 530). Basílica de Cosme y Damián. [19][20]</p><img src="https://res.bibleox.com/s/img/image/simple/686aa5b35f47da2505d3ae28/s_p_V2YyLyiR7wCHgIfW.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa5b35f47da2505d3ae28/m_p_V2YyLyiR7wCHgIfW.jpg">ampliar</a>]</p><p>Apóstol Pedro y san Cosme (más adelante también san Teodoro)</p><img src="https://res.bibleox.com/s/img/image/simple/686aa5d25f47da2505d3ae29/s_p_s66jgQ3tkVAmQEZE.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa5d25f47da2505d3ae29/m_p_s66jgQ3tkVAmQEZE.jpg">ampliar</a>]</p><p>Apóstol Pablo y san Damián (más adelante el papa Félix)</p><img src="https://res.bibleox.com/s/img/image/simple/686aa7505f47da2505d3ae2c/s_p_WA1eP9P7BNe0aPQ6.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa7505f47da2505d3ae2c/m_p_WA1eP9P7BNe0aPQ6.jpg">ampliar</a>]</p><p>Santo ángel</p><img src="https://res.bibleox.com/s/img/image/simple/686aa61c5f47da2505d3ae2a/s_p_MD4QowA5HKQRhFFG.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa61c5f47da2505d3ae2a/m_p_MD4QowA5HKQRhFFG.jpg">ampliar</a>]</p><h3>Cristo y los apóstoles (Roma)</h3><p>Siglo VI (años 578-590). Basílica de San Lorenzo Extramuros (San Lorenzo fuori le Mura) [21][22]</p><p>Junto al apóstol Pablo, los santos Esteban e Hipólito. Junto al apóstol Pedro, san Lorenzo.</p><img src="https://res.bibleox.com/s/img/image/simple/686aabc85f47da2505d3ae2e/s_p_xa4IU82mZb80Uija.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aabc85f47da2505d3ae2e/m_p_xa4IU82mZb80Uija.jpg">ampliar</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686aab945f47da2505d3ae2d/s_p_21M69l0ODfpN75oh.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aab945f47da2505d3ae2d/m_p_21M69l0ODfpN75oh.jpg">ampliar</a>]</p><h3>Apóstoles Pedro y Pablo (Francos)</h3><p>Siglos VI-VIII. <a href="https://www.metmuseum.org/art/collection/search/464497">Museo Metropolitano en la Quinta Avenida, EE. UU.</a> (también <a href="https://www.metmuseum.org/art/collection/search/464496">aquí</a>). Marfil. 29,2 x 11,4 x 0,5 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5ff8145c75323d28a5ec8/s_p_WhZZPyHo1I7oF79K.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5ff8145c75323d28a5ec8/m_p_WhZZPyHo1I7oF79K.jpg">ampliar</a>]</p><h3>Santos (Bizancio, Egipto)</h3><p>Siglos VI-VII. <a href="https://www.metmuseum.org/art/collection/search/854019">Museo Metropolitano en la Quinta Avenida, EE. UU.</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68b6007445c75323d28a5ec9/s_p_DNQuRcpcjfkINQ1r.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b6007445c75323d28a5ec9/m_p_DNQuRcpcjfkINQ1r.jpg">ampliar</a>]</p><h3>Focas, santo (Bizancio, Quersoneso)</h3><p>Siglo VI. Sello para la fabricación de eulogias con la imagen en relieve de san <a href="https://azbyka.ru/days/sv-foka-sinopskij">Fo<strong>́</strong>cas de Sinope</a>, en pie sobre una barca. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/373084?page=2&amp;fundcoll=1420520446&amp;index=75">Hermitage, Rusia</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863bee26480b4d285320410/s_p_s0nPEGgpeMtakrof.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863bee26480b4d285320410/m_p_s0nPEGgpeMtakrof.jpg">ampliar</a>]</p><h3>Ampolla con dos imágenes de santos (Asia Menor, Éfeso)</h3><p>Siglo VI. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/228313?page=44&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=2166">Hermitage, Rusia</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c0e76480b4d285320414/s_p_KnTGMdyOhsmTAD0S.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c0e76480b4d285320414/m_p_KnTGMdyOhsmTAD0S.jpg">ampliar</a>]</p><h3>Ampolla con imágenes del evangelista y del santo: Juan el Teólogo y Procoro (Éfeso)</h3><p>Siglo VI. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/228314?page=33&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=1646">Hermitage, Rusia</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c1726480b4d285320415/s_p_oBnXQZmCz1EntIFw.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c1726480b4d285320415/m_p_oBnXQZmCz1EntIFw.jpg">ampliar</a>]</p><h3>Molybdobulo con la imagen de los santos Pedro y Pablo y una inscripción latina (Bizancio)</h3><p>Siglos VI-VII. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/131338?page=33&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=1639">Hermitage, Rusia</a>. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/161973?page=33&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=1640">Otra pieza</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c19d6480b4d285320416/s_p_JKBi7CXiDOutHIFn.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c19d6480b4d285320416/m_p_JKBi7CXiDOutHIFn.jpg">ampliar</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6863c22c6480b4d285320417/s_p_FmbNOmLfDrj3qYOz.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c22c6480b4d285320417/m_p_FmbNOmLfDrj3qYOz.jpg">ampliar</a>]</p><h3>Molybdobulo con la imagen de Cristo (Bizancio)</h3><p>Siglos VI-VII. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/117792?page=6&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%B0&amp;index=269">Hermitage, Rusia</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c4a86480b4d28532041f/s_p_Uy0EgcXKfuHnv9bX.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c4a86480b4d28532041f/m_p_Uy0EgcXKfuHnv9bX.jpg">ampliar</a>]</p><h3>Molybdobulo con la imagen de Cristo y un monograma (Bizancio)</h3><p>Siglos VI-VII. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/117804?page=3&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%B0&amp;index=143">Hermitage, Rusia</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c5a16480b4d285320422/s_p_JNdWhUPj9cA9Dvoq.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c5a16480b4d285320422/m_p_JNdWhUPj9cA9Dvoq.jpg">ampliar</a>]</p><h2>Siglo VII</h2><h3>Icono de Cristo en un anillo de bodas (Bizancio)</h3><p>Años 600-700. Inscripciones griegas en el anillo: <strong>ΟΜΟΝΟΙΑ</strong> — concordia; <strong>ΕΙΡΙΝΗΝ ΤΗΝ ΕΜΙΝ ΔΙΔΟΜ</strong> — «mi paz os doy» (Jn 14:27). <a href="https://collections.louvre.fr/en/ark:/53355/cl010102797">Louvre, Francia</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c402726594f46d35a87ef8/s_p_6nMwdRXMjOnhQWfu.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c402726594f46d35a87ef8/m_p_6nMwdRXMjOnhQWfu.jpg">ampliar</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c4027c6594f46d35a87ef9/m_p_pNTvaGVW4AmLG2BK.jpg">versión 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c4027e6594f46d35a87efa/m_p_mvU9wZQKEIl0lFZY.jpg">versión 3</a>]</p><h3>Ampolla con icono. Cristo, la crucifixión y la ascensión (Palestina, Bizancio)</h3><p>Años 600 (principios). <a href="https://www.clevelandart.org/art/1999.46">Museo de Arte de Cleveland, EE. UU.</a>. Aleación de estaño y plomo con elementos de cuero.</p><img src="https://res.bibleox.com/s/img/image/simple/68caa8cf205184ec278d5884/s_p_QfQLEBTpKbF2IfJo.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68caa8cf205184ec278d5884/m_p_QfQLEBTpKbF2IfJo.jpg">ampliar</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68caaaaf205184ec278d5887/m_p_YFRVXxytSNharyj8.jpg">versión 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68caaab2205184ec278d5888/m_p_GguW2EcCVatptKzX.jpg">versión 3</a>]</p><h3>Madre de Dios y el gran mártir Teodoro Estratelates (Tesalónica, Bizancio)</h3><p>Siglos VII–X (?). Basílica de San Demetrio en Tesalónica. Mosaico en la cara sur del pilar norte.</p><img src="https://res.bibleox.com/s/img/image/simple/686985345f47da2505d3ae12/s_p_HWoRkey7yaGM1D4s.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686985345f47da2505d3ae12/m_p_HWoRkey7yaGM1D4s.jpg">ampliar</a>]</p><h3>Gran mártir Demetrio y los donantes: el arzobispo y el prefecto (Tesalónica, Bizancio)</h3><p>Siglo VII. Basílica de San Demetrio en Tesalónica. Mosaico.</p><img src="https://res.bibleox.com/s/img/image/simple/686986dc5f47da2505d3ae13/s_p_ZMXi7hFVOfpu7jbC.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686986dc5f47da2505d3ae13/m_p_ZMXi7hFVOfpu7jbC.jpg">ampliar</a>]</p><h3>San Jorge y los niños (Tesalónica, Bizancio)</h3><p>Siglo VII. Basílica de San Demetrio en Tesalónica. El mosaico está situado en la parte occidental del altar.</p><img src="https://res.bibleox.com/s/img/image/simple/686987645f47da2505d3ae14/s_p_boH6uu2omR2Gjxxx.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686987645f47da2505d3ae14/m_p_boH6uu2omR2Gjxxx.jpg">ampliar</a>]</p><h3>San Sergio (Tesalónica, Bizancio)</h3><p>Siglo VII. Basílica de San Demetrio en Tesalónica. Mosaico del pilar del altar.</p><img src="https://res.bibleox.com/s/img/image/simple/686989925f47da2505d3ae15/s_p_Faf5BLFz9WISBGej.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686989925f47da2505d3ae15/m_p_Faf5BLFz9WISBGej.jpg">ampliar</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a742205184ec278d6fb4/m_p_YV1I98bvx4Nn6cUn.jpg">versión 2</a>]</p><h3>Icono del santo profeta David (Constantinopla, Bizancio)</h3><p>Años 629-630. <a href="https://www.metmuseum.org/art/collection/search/464380">Museo Metropolitano en la Quinta Avenida, EE. UU.</a>. Plata. 26.6 x 4 cm, 1397 g. Véase también: <a href="https://www.metmuseum.org/art/collection/search/464378">1</a>, <a href="https://www.metmuseum.org/art/collection/search/464375">2</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c1c3426594f46d35a87e75/s_p_5U20dlUc30xkfJeN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1c3426594f46d35a87e75/m_p_5U20dlUc30xkfJeN.jpg">ampliar</a>]</p><h3>Molybdobulo con la imagen de un santo y una inscripción (Bizancio)</h3><p>Siglo VII. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/270001?page=17&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=840">Hermitage, Rusia</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c2966480b4d285320419/s_p_EY1IyPYdMzjgztlB.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c2966480b4d285320419/m_p_EY1IyPYdMzjgztlB.jpg">ampliar</a>]</p><h3>Molybdobulo con imagen de busto de Cristo y un monograma (Bizancio)</h3><p>Siglo VII. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/231980?page=2&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%B0&amp;index=96">Hermitage, Rusia</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c6076480b4d285320423/s_p_YFjOrZh2fLGJgpYJ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c6076480b4d285320423/m_p_YFjOrZh2fLGJgpYJ.jpg">ampliar</a>]</p><h3>Molybdobulo con la imagen de Cristo y un monograma (Bizancio)</h3><p>Siglo VII. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/172196?page=2&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%B0&amp;index=57">Hermitage, Rusia</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c64d6480b4d285320424/s_p_RQupAUUa4gGtXt2n.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c64d6480b4d285320424/m_p_RQupAUUa4gGtXt2n.jpg">ampliar</a>]</p><h2>Siglo VIII</h2><h3>Madre de Dios y el niño Jesús (Constantinopla, Bizancio)</h3><p>Templo de la Sabiduría de Dios (Santa Sofía).</p><img src="https://res.bibleox.com/s/img/image/simple/674f31b0dba77200011c73a2/s_p_2AO12RGOQ2yqRiP4.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f31b0dba77200011c73a2/m_p_2AO12RGOQ2yqRiP4.jpg">ampliar</a>]</p><h3>Arcángel Gabriel (Constantinopla, Bizancio)</h3><p>Templo de la Sabiduría de Dios (Santa Sofía).</p><img src="https://res.bibleox.com/s/img/image/simple/674f3256dba77200011c73a4/s_p_rfkKZFQ8IYfO6L7V.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f3256dba77200011c73a4/m_p_rfkKZFQ8IYfO6L7V.jpg">ampliar</a>]</p><h3>Cristo, crucifixión y resurrección (Metz, Francia)</h3><p>870 d. C. <a href="https://collections.louvre.fr/en/ark:/53355/cl010113244">Louvre, Francia</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c422e46594f46d35a87f10/s_p_lQNRJIXri6KJoLw3.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c422e46594f46d35a87f10/m_p_lQNRJIXri6KJoLw3.jpg">ampliar</a>]</p><h3>Cristo, crucifixión (Reims, Francia)</h3><p>870-880 d. C. <a href="https://collections.louvre.fr/en/ark:/53355/cl010098469">Louvre, Francia</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c423bc6594f46d35a87f11/s_p_NOhnffTlgTImIczW.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c423bc6594f46d35a87f11/m_p_NOhnffTlgTImIczW.jpg">ampliar</a>]</p><h2>Siglo IX</h2><h3>Ascensión de Cristo (Tesalónica, Bizancio)</h3><p>Siglos IX-X. Rotonda de San Jorge el Victorioso (originalmente tumba del emperador Galerio). Fresco [17][18]</p><img src="https://res.bibleox.com/s/img/image/simple/686a934c5f47da2505d3ae20/s_p_klfYhHum7wZvKR9D.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686a934c5f47da2505d3ae20/m_p_klfYhHum7wZvKR9D.jpg">ampliar</a>]</p><h3>Cristo, medallón de bronce (Bizancio)</h3><p>Siglos IX-X. Se llaman medallones las imágenes de forma redonda. <a href="https://www.britishmuseum.org/collection/object/H_1880-0820-9">Museo Británico</a>. Diámetro: 3.5 cm.</p><p>Circular medallion; bronze; bust of Christ with cruciferous nimbus holding the book of the gospel in his left hand; inscription either side.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5be2d45c75323d28a5e92/s_p_GswK2cGnuxxnLfJr.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5be2d45c75323d28a5e92/m_p_GswK2cGnuxxnLfJr.jpg">ampliar</a>]</p><h3>Dormición de la Madre de Dios (Bizancio)</h3><p>Finales del siglo IX. <a href="https://www.metmuseum.org/art/collection/search/464013">Museo Metropolitano en la Quinta Avenida, EE. UU.</a>. Material: marfil. 18.6 x 14.8 x 1.1 cm.</p><p>New York. The Metropolitan Museum of Art. "The Glory of Byzantium,". Images of the Koimesis, or the Dormition in the West, show the Virgin lying on a bier, while her soul, represented as a baby, is offered by Christ to attendant angels who will take it to heaven. The apostles, led by Saints Paul and Peter, stand witness.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5c1bf45c75323d28a5e97/s_p_0Hg1bO8KIUVBSWJs.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5c1bf45c75323d28a5e97/m_p_0Hg1bO8KIUVBSWJs.jpg">ampliar</a>]</p><h3>Cristo, la Madre de Dios, Juan Bautista, los apóstoles y otros santos (Constantinopla)</h3><p>940-960 d. C. <a href="https://collections.louvre.fr/en/ark:/53355/cl010112515">Louvre, Francia</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c424276594f46d35a87f12/s_p_IlqGrJe04Ic0YFWv.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c424276594f46d35a87f12/m_p_IlqGrJe04Ic0YFWv.jpg">ampliar</a>]</p><h3>Placa con la imagen de Cristo y los apóstoles (Italia)</h3><p>Siglo IX. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/228918?page=4&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%B0&amp;index=194">Hermitage, Rusia</a>. Dimensiones: 12.2 x 10.5 cm</p><img src="https://res.bibleox.com/s/img/image/simple/6863c54f6480b4d285320421/s_p_aLvOvrKuilB614SS.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c54f6480b4d285320421/m_p_aLvOvrKuilB614SS.jpg">ampliar</a>]</p><h2>Siglo X</h2><h3>Cristo, la Madre de Dios, Juan Bautista (Bizancio)</h3><p>Siglo X. <a href="https://www.britishmuseum.org/collection/object/H_1923-1205-2">Museo Británico</a>. Material: marfil. Altura: 15.5 cm.</p><p>Panel; ivory; carved with standing figures, Christ with the Virgin Mary and St John, below a pierced canopy; four holes for attachment in the raised border.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5be4045c75323d28a5e95/s_p_qEFeZyh2Gq5Wbvar.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5be4045c75323d28a5e95/m_p_qEFeZyh2Gq5Wbvar.jpg">ampliar</a>]</p><h3>La Madre de Dios y el Niño Dios (Constantinopla, Bizancio)</h3><p><a href="tel:950-1025">950-1025</a> d. C. <a href="https://www.clevelandart.org/art/1925.1293">Museo de Arte de Cleveland, EE. UU.</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68caa153205184ec278d5882/s_p_iLLZZkqfsUiACLDC.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68caa153205184ec278d5882/m_p_iLLZZkqfsUiACLDC.jpg">ampliar</a>]</p><h3>Colgante con la imagen de Cristo y de la Madre de Dios (Bizancio)</h3><p>1000-1300 d. C. <a href="https://www.metmuseum.org/art/collection/search/477247">Museo Metropolitano en la Quinta Avenida, EE. UU.</a>. Camafeo de calcedonia; montura de oro con perlas, esmeraldas, granates, zafiros e incrustaciones de sardónica. Tamaño total: 7,2 x 5,5 x 1,6 cm. Calcedonia: 1 1/2 x 1 1/4 pulgadas (3,8 x 3,2 cm)</p><img src="https://res.bibleox.com/s/img/image/simple/68c1bc1a6594f46d35a87e6d/s_p_VcHt7eFMtZq1I1lY.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1bc1a6594f46d35a87e6d/m_p_VcHt7eFMtZq1I1lY.jpg">ampliar</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/68c1bc176594f46d35a87e6c/s_p_LwWdQj6J4ehbmMh9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1bc176594f46d35a87e6c/m_p_LwWdQj6J4ehbmMh9.jpg">ampliar</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c1bc1f6594f46d35a87e6e/m_p_gT2TXueTg5pmDsuZ.jpg">aún más grande</a>]</p><h3>Cruz con la imagen de Cristo (Bizancio)</h3><p>Siglos X-XI. Bronce. 6.6 x 4.2 cm. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/228297?page=56&amp;query=%D0%BA%D1%80%D0%B5%D1%81%D1%82&amp;sort=112&amp;index=2755">Hermitage, Rusia</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c11f5b6594f46d35a87e2d/s_p_6uw78FFpsxpItSzn.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c11f5b6594f46d35a87e2d/m_p_6uw78FFpsxpItSzn.jpg">ampliar</a>]</p><h3>Cruz con la imagen de Cristo (Bizancio)</h3><p>Siglos X-XI. Bronce. 7.7 x 7 cm. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/482789?page=51&amp;query=%D0%BA%D1%80%D0%B5%D1%81%D1%82&amp;sort=112&amp;index=2501">Hermitage, Rusia</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c11fab6594f46d35a87e2e/s_p_jfgfrZ4X7jcBXG9D.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c11fab6594f46d35a87e2e/m_p_jfgfrZ4X7jcBXG9D.jpg">ampliar</a>]</p><h3>Cruz con iconos de santos (Quersoneso)</h3><p>Siglo X. Bronce, grabado. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/372835?page=5&amp;fundcoll=1420520446__1413747286&amp;index=229">Hermitage, Rusia</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c4191a6594f46d35a87f02/s_p_iFiSEGM9EbRIhhtD.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c4191a6594f46d35a87f02/m_p_iFiSEGM9EbRIhhtD.jpg">ampliar</a>]</p><h3>San Demetrio de Tesalónica (Bizancio)</h3><p><a href="tel:950-1000">950-1000</a> d. C. <a href="https://www.metmuseum.org/art/collection/search/465946">Museo Metropolitano en la Quinta Avenida, EE. UU.</a>. Material: marfil. 19.7 x 12.1 x 1 cm.</p><p>Standing erect, a spear in his hand and a shield at his side, Saint Demetrios is shown ready to protect the Christian faithful. The name of the popular Byzantine military saint is inscribed in two parts in Greek. Martyred in Thessalonike, the second most important city of the empire in the early centuries of the church, he has long been the patron saint of that metropolis. Images of saints in military dress are rare in Early Byzantine art (they appear on the chalices of the Attarouthi Treasure) but typical of the Middle Byzantine period.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5c38445c75323d28a5e98/s_p_ZeZuXGqxAAyDuPBA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5c38445c75323d28a5e98/m_p_ZeZuXGqxAAyDuPBA.jpg">ampliar</a>]</p><h2>Siglo XI</h2><h3>Cruz procesional: Cristo, la Madre de Dios, los arcángeles Miguel y Gabriel (Bizancio)</h3><p>1000-1050 d. C. <a href="https://www.metmuseum.org/art/collection/search/466251">Museo Metropolitano en la Quinta Avenida, EE. UU.</a>. 59.5 x 43 x 2.2 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5e3e645c75323d28a5e9b/s_p_Ft65PrnBUmI6wDAc.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5e3e645c75323d28a5e9b/m_p_Ft65PrnBUmI6wDAc.jpg">ampliar</a>]</p><h3>Cruz procesional, Cristo, la Madre de Dios, Juan Bautista (Bizancio)</h3><p>1050 d. C. <a href="https://www.clevelandart.org/art/1970.36">Museo de Arte de Cleveland, EE. UU.</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68ca921d205184ec278d5871/s_p_PrD5y34JBpT95quf.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68ca921d205184ec278d5871/m_p_PrD5y34JBpT95quf.jpg">ampliar</a>]</p><h3>Cruz procesional, san Sabas (Bizancio)</h3><p>1050 d. C. <a href="https://www.metmuseum.org/art/collection/search/697956">Museo Metropolitano en la Quinta Avenida, EE. UU.</a>. En el centro del reverso está representado san Sabas, y en los bordes, otros santos monjes. Plata. 32.4 × 44.8 × 5.7 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68c1c6546594f46d35a87e76/s_p_FO8cb8Ec2FqTDFz8.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1c6546594f46d35a87e76/m_p_FO8cb8Ec2FqTDFz8.jpg">ampliar</a>]</p><h3>Cruz procesional, Cristo (Quersoneso)</h3><p>Siglo XI. Material: bronce, hierro; fundición, repujado, grabado. Tamaño: 36.5 x 27.5 cm. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/372834?page=3&amp;fundcoll=1420520446__1413747286&amp;index=106">Hermitage, Rusia</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c418616594f46d35a87f01/s_p_ytqdkwIa6FDSikCw.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c418616594f46d35a87f01/m_p_ytqdkwIa6FDSikCw.jpg">ampliar</a>]</p><h3>Parte del icono «Cristo Pantocrátor» (Bizancio, Crimea)</h3><p>1050-1100 d. C. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/372766?page=40&amp;query=%D0%B8%D0%BA%D0%BE%D0%BD%D0%B0&amp;index=1999">Hermitage, Rusia</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863bfff6480b4d285320412/s_p_XwuOAkY6yR10NT7b.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863bfff6480b4d285320412/m_p_XwuOAkY6yR10NT7b.jpg">ampliar</a>]</p><h3>La Madre de Dios con el Niño Dios (Constantinopla)</h3><p>1000-1015 d. C. <a href="https://collections.louvre.fr/en/ark:/53355/cl010101133">Louvre, Francia</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c43b8c6594f46d35a87f16/s_p_rQNvoLa9Vu1WmSB2.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c43b8c6594f46d35a87f16/m_p_rQNvoLa9Vu1WmSB2.jpg">ampliar</a>]</p><h3>La Madre de Dios, orante (Constantinopla)</h3><p>1000-1200 d. C. <a href="https://collections.louvre.fr/en/ark:/53355/cl010114443">Louvre, Francia</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c43bcc6594f46d35a87f17/s_p_7a5oJnVWqjfeu67t.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c43bcc6594f46d35a87f17/m_p_7a5oJnVWqjfeu67t.jpg">ampliar</a>]</p><h3>La Madre de Dios, el arcángel Miguel, san Teodoro (Bizancio)</h3><p>Siglos XI-XII. <a href="https://www.britishmuseum.org/collection/object/H_1981-0103-1">Museo Británico</a>. 108 x 95 mm.</p><p>Relief icon; rectangular bronze plaque cast in low relief with full-length Hodegetria flanked by the Archangel Michael and St Theodore, each wearing a girdled tunic beneath a chlamys with decorated tablion; the figures are identified by intaglio inscriptions; the whole is surrounded by a raised border with a running vine scroll; traces of solder at sides and back.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5be3545c75323d28a5e93/s_p_DFDGZ6kHm0khLKRD.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5be3545c75323d28a5e93/m_p_DFDGZ6kHm0khLKRD.jpg">ampliar</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5be3b45c75323d28a5e94/m_p_FfmDAHv29BAMxval.jpg">aún más grande</a>]</p><h3>Icono de san Demetrio (Bizancio)</h3><p>1040-1060 d. C. <a href="https://collections.louvre.fr/en/ark:/53355/cl010115478">Louvre, Francia</a>. 9,4 x 6,3 x 0,6 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c0c36594f46d35a87ec0/s_p_dj04XPO3pwvzkLzr.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c0c36594f46d35a87ec0/m_p_dj04XPO3pwvzkLzr.jpg">ampliar</a>]</p><h3>Molybdobulo con la imagen de san Demetrio y una inscripción (Bizancio)</h3><p>Siglo XI. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/269619?page=20&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=958">Hermitage, Rusia</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c2556480b4d285320418/s_p_oqzix7avanFfe61o.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c2556480b4d285320418/m_p_oqzix7avanFfe61o.jpg">ampliar</a>]</p><h3>Molybdobulo con la imagen de medio cuerpo de un santo (Bizancio)</h3><p>Siglo XI. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/267492?page=14&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=651">Hermitage, Rusia</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c3196480b4d28532041a/s_p_VySwl31Z41rar6d3.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c3196480b4d28532041a/m_p_VySwl31Z41rar6d3.jpg">ampliar</a>]</p><h3>Sello colgante con la imagen de un santo (Bizancio)</h3><p>Siglo XI. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/483272?query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=21">Hermitage, Rusia</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c4276480b4d28532041d/s_p_5EJuZ18em5TsdUwA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c4276480b4d28532041d/m_p_5EJuZ18em5TsdUwA.jpg">ampliar</a>]</p><h3>Sello colgante con la imagen de un santo (Bizancio)</h3><p>Siglos XI-XII. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/483278?query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=35">Hermitage, Rusia</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c4616480b4d28532041e/s_p_H8LrRkkjwBHlc322.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c4616480b4d28532041e/m_p_H8LrRkkjwBHlc322.jpg">ampliar</a>]</p><h2>Siglo XII</h2><h3>Cristo, la Madre de Dios, el profeta Juan (Constantinopla, Bizancio)</h3><p>Templo de la Sabiduría de Dios (Santa Sofía). Fresco del templo[5]</p><img src="https://res.bibleox.com/s/img/image/simple/6750078ddba77200011c73af/s_p_EcliI0JFeV1uu1LU.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6750078ddba77200011c73af/m_p_EcliI0JFeV1uu1LU.jpg">ampliar</a>]</p><h3>Cristo (Constantinopla, Bizancio)</h3><p>Templo de la Sabiduría de Dios (Santa Sofía).</p><img src="https://res.bibleox.com/s/img/image/simple/674f332ddba77200011c73a6/s_p_1PCMz3Y4EZgbSJL0.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f332ddba77200011c73a6/m_p_1PCMz3Y4EZgbSJL0.jpg">ampliar</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686cf10d5f47da2505d3ae4e/s_p_ZHUiumbGoeJMn4GO.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686cf10d5f47da2505d3ae4e/m_p_ZHUiumbGoeJMn4GO.jpg">ampliar</a>]</p><h3>La Madre de Dios (Constantinopla, Bizancio)</h3><p>Templo de la Sabiduría de Dios (Santa Sofía).</p><img src="https://res.bibleox.com/s/img/image/simple/674f3332dba77200011c73a7/s_p_WvZb6UestGwJUzJr.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f3332dba77200011c73a7/m_p_WvZb6UestGwJUzJr.jpg">ampliar</a>]</p><h3>Juan Bautista, profeta (Constantinopla, Bizancio)</h3><p>Templo de la Sabiduría de Dios (Santa Sofía).</p><img src="https://res.bibleox.com/s/img/image/simple/674f357ddba77200011c73a8/s_p_hdfr9cx0ZPTZyn6N.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f357ddba77200011c73a8/m_p_hdfr9cx0ZPTZyn6N.jpg">ampliar</a>]</p><h3>La Madre de Dios con el Niño Jesús (Constantinopla)</h3><p>Primer tercio del siglo XII. Icono de la Virgen de Vladimir. Madera, témpera.</p><img src="https://res.bibleox.com/s/img/image/simple/674f18e4dba77200011c7399/s_p_0uaArAqVhNX9r0gV.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f18e4dba77200011c7399/m_p_0uaArAqVhNX9r0gV.jpg">ampliar</a>]</p><h3>La Madre de Dios (Bizancio, Siria, Tartús)</h3><p>Siglo XII. <a href="https://www.britishmuseum.org/collection/object/H_1889-0511-13">Museo Británico</a>. Material: marfil, 41 x 47 mm.</p><p>Relief icon; pale grey-green steatite; rounded at the top and square below; bust of the Virgin, her mantle drawn over her head, with St Andrew's cross on it; her hands held in front with palms outwards, inscription either side of her.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5be2645c75323d28a5e91/s_p_StVNlxiOjocLLsz5.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5be2645c75323d28a5e91/m_p_StVNlxiOjocLLsz5.jpg">ampliar</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5be2245c75323d28a5e90/m_p_yHJ3BkdNwVGdLb4m.jpg">aún más grande</a>]</p><h3>El gran mártir Demetrio de Tesalónica y un diácono (Tesalónica, Bizancio)</h3><p>Siglo XII. Mosaico en la cara oriental del pilar meridional.</p><img src="https://res.bibleox.com/s/img/image/simple/68698a155f47da2505d3ae16/s_p_n7AgnVLPvfeBX5Qq.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68698a155f47da2505d3ae16/m_p_n7AgnVLPvfeBX5Qq.jpg">ampliar</a>]</p><h3>Icono con la imagen de la Madre de Dios Odigitria (Bizancio, Quersoneso)</h3><p>Segunda mitad del siglo XII. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/372931?page=11&amp;fundcoll=1420520446&amp;index=536">Hermitage, Rusia</a>. 6.8 x 5 cm</p><img src="https://res.bibleox.com/s/img/image/simple/6863bf2f6480b4d285320411/s_p_10YV8HIpAzMNCgvp.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863bf2f6480b4d285320411/m_p_10YV8HIpAzMNCgvp.jpg">ampliar</a>]</p><h2>Siglo XIII</h2><h3>El Señor Pantocrátor (Athos)</h3><p>Monasterio de Hilandar, Monte Athos.</p><img src="https://res.bibleox.com/s/img/image/simple/69406737205184ec278d6fd8/s_p_hTWcEC5QtmbCrC5t.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69406737205184ec278d6fd8/m_p_hTWcEC5QtmbCrC5t.jpg">ampliar</a>]</p><h3>La Madre de Dios con el Niño Jesús (Odigitria, Athos)</h3><p>Monasterio de Hilandar, Monte Athos.</p><img src="https://res.bibleox.com/s/img/image/simple/674f0cfadba77200011c7395/s_p_mQMRA7FGLEbqOYIx.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f0cfadba77200011c7395/m_p_mQMRA7FGLEbqOYIx.jpg">ampliar</a>]</p><h2>Siglo XIV</h2><h3>El Señor Pantocrátor</h3><p>El pintor de iconos Manuel Panselinos.</p><img src="https://res.bibleox.com/s/img/image/simple/674f28d1dba77200011c739e/s_p_ma0z14hIFXCiEj7S.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f28d1dba77200011c739e/m_p_ma0z14hIFXCiEj7S.jpg">ampliar</a>]</p><h3>La Madre de Dios (Tesalónica)</h3><p>1310-1315 d. C. Orante. Fresco de la iglesia de San Nicolás Orfanós en Tesalónica, Grecia.</p><img src="https://res.bibleox.com/s/img/image/simple/674f29b7dba77200011c739f/s_p_PSuCdQIYdR4IYZgA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f29b7dba77200011c739f/m_p_PSuCdQIYdR4IYZgA.jpg">ampliar</a>]</p><h3>Presentación de la Santísima Madre de Dios en el Templo (Constantinopla)</h3><p>Hacia 1316–1321 d. C. Mezquita de Kariye, monasterio de Cora, Estambul (Constantinopla), Turquía.</p><img src="https://res.bibleox.com/s/img/image/simple/675343bddba7720001cd0ddf/s_p_AtF4vpmhv6FneUfA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/675343bddba7720001cd0ddf/m_p_AtF4vpmhv6FneUfA.jpg">ampliar</a>]</p><h2>Siglo XV</h2><h3>Apóstol Pablo (Rus)</h3><p>Década de 1410. Autor: el venerable Andrés Rublev. Galería Estatal Tretiakov, Moscú, Rusia.</p><img src="https://res.bibleox.com/s/img/image/simple/6909fbca205184ec278d6e6a/s_p_ok25vNdlaQMM5P3c.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6909fbca205184ec278d6e6a/m_p_ok25vNdlaQMM5P3c.jpg">ampliar</a>]</p><h2>Colecciones de iconos</h2><ol><li><p>Colección con la iconografía de las catacumbas, archivo Word: <a href="https://disk.yandex.ru/d/mHc8dxUdHGqMEQ">enlace</a></p></li><li><p>Obras del pintor de iconos Manuel Panselinos (siglos XIII-XIV): <a href="https://vk.com/album-20034910_224123875">https://vk.com/album-20034910_224123875</a></p></li></ol>
