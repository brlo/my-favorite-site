  - src: Древние_христианские_храмы
    path: Ch2c_Temples_chretiens_anciens
    title: "Temples chrétiens anciens"
    body: |-
      <h2>Épigraphe</h2><blockquote><p>« Et quelques-uns des pharisiens, du milieu de la foule, lui dirent : « Maître, reprends tes disciples. » Et il répondit : « Je vous le dis, <strong>s’ils se taisent, les pierres crieront !</strong> » (<a href="https://bibleox.com/fr/fr-lsg/lk/19/#L39-40">Lc 19:39-40</a>)</p></blockquote><h2>IIIe siècle</h2><h3>Église près de l’ancienne ville de Megiddo, dans le village de <a href="https://he.wikipedia.org/wiki/%D7%9C%D7%92%D7%99%D7%95">Legio</a> (vers 230)</h3><p>Dans les églises chrétiennes anciennes, l’autel était souvent placé au centre. Cette église en est un exemple parlant.</p><p>Non loin de la ville de Megiddo (dans l’Antiquité s’y trouvait le village de <a href="https://he.wikipedia.org/wiki/%D7%9C%D7%92%D7%99%D7%95">Legio</a>, car une légion romaine y était stationnée). Sur la hauteur du village fut construit un bâtiment, daté de 230 par ses monnaies, sa céramique et son type d’écriture. L’une des pièces du bâtiment était une église chrétienne. Le sol comporte plusieurs grandes mosaïques avec des inscriptions (l’une d’elles appelle le Christ Dieu), et l’autel se trouve au centre. À côté se trouve aussi une inscription indiquant par qui cette table fut offerte.</p><img src="https://res.bibleox.com/s/img/image/simple/692c58f9205184ec278d6f97/s_p_aZ3NifF9BW3oqZ1a.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c58f9205184ec278d6f97/m_p_aZ3NifF9BW3oqZ1a.jpg">agrandir</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/692c587d205184ec278d6f91/s_p_MvOQRFKiCv6XaXOd.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c587d205184ec278d6f91/m_p_MvOQRFKiCv6XaXOd.jpg">agrandir</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/692c58ee205184ec278d6f96/s_p_5wNRtqyrpQivbBim.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c58ee205184ec278d6f96/m_p_5wNRtqyrpQivbBim.jpg">agrandir</a>] [<a href="https://res.bibleox.com/s/img/image/simple/692c58e0205184ec278d6f95/m_p_FQvEfj70dP7967X3.jpg">photo suppl. 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/692c58ce205184ec278d6f94/m_p_9xoiCsqROihBYnL0.jpg">photo suppl. 3</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/692c58b5205184ec278d6f93/s_p_Cvww0C8ZGmbqJS7a.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c58b5205184ec278d6f93/m_p_Cvww0C8ZGmbqJS7a.jpg">agrandir</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/692c5882205184ec278d6f92/s_p_WU59e3c2XbPWkdaM.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c5882205184ec278d6f92/m_p_WU59e3c2XbPWkdaM.jpg">agrandir</a>]</p><p><strong>Inscriptions :</strong></p><p>Toutes les inscriptions du sol de l’église constituent une sorte de <strong>registre commémoratif</strong>. Depuis les temps les plus anciens et jusqu’à aujourd’hui, dans les églises de l’Église orthodoxe, il existe la tradition, lors des offices, d’ajouter toujours à la commémoration priante les noms de ceux qui ont construit l’église ou offert quelque chose d’important. Ici de même, avec un appel à la commémoration, sont consignés les noms de ceux qui ont offert le sol en mosaïque (le centurion Gaïus Porphyrius), qui l’ont posé (Brutius), qui ont offert l’autel (Aképtous), ainsi que quelques autres noms, peut-être des parents des donateurs : Primilla, Cyriaca, Dorothée, Chreste. De la même manière, on apportait des objets liturgiques en mémoire des vivants et des morts : calices eucharistiques et encensoirs (voir <a href="https://bibleox.com/fr/fr/w/Ik1c_Collection_dicones_anciennes#HH-Calices-eucharistiques-et-encensoirs-avec-des-icônes-Byzance-Syrie-Attarouthi">plus de détails</a>).</p><blockquote><p>FR : Aképtous, ami de Dieu, a offert cette table au Dieu Jésus-Christ en mémorial</p></blockquote><blockquote><p>EN: Akeptous, the God-loving, offered the table to God Jesus Christ as a memorial.</p></blockquote><blockquote><p>Transcription: <strong>Prosēniken Akeptous, ē philotheos, tēn trapezan Th(e)ō Ι(ēso)u Ch(rist)ō mnēmosunon.</strong></p></blockquote><blockquote><p>Orig: <strong>ΠΡΟСΗΝΙΚΕΝ ΑΚΕΠΤΟΥС, Η ΦΙΛΟΘΕΟС, ΤΗΝ ΤΡΑΠΕΖΑΝ Θ(Ε)Ω Ι(ΗСΟ)Υ Χ(ΡΙСΤ)Ω ΜΝΗΜΟСΥΝΟΝ</strong></p></blockquote><blockquote><p>ΠΡΟϹΗΝΙΚΕΝ</p><p>ΑΚΕΠΤΟΥϹ,</p><p>Η ΦΙΛΟΘΕΟϹ,</p><p>ΤΗΝ ΤΡΑΠΕ-</p><p>ZΑΝ <strong>{ΘW} {ΙΥ} {ΧW}*</strong></p><p>ΜΝΗΜΟϹΥΝΟΝ</p></blockquote><p>*Nomina Sacra : <strong>ΘW ΙΥ ΧW</strong> = θεῷ Ἰησοῦ Χριστῷ = Dieu Jésus-Christ</p><img src="https://res.bibleox.com/s/img/image/simple/692c5df3205184ec278d6f9a/s_p_swifwBDbtzgImkZ6.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c5df3205184ec278d6f9a/m_p_swifwBDbtzgImkZ6.jpg">agrandir</a>]</p><hr><blockquote><p>ΕΝ: Remember Primilla and Cyriaca and Dorothea, and moreover also Chreste.</p></blockquote><blockquote><p>FR : Souvenez-vous de Primilla, de Cyriaca et de Dorothée, et aussi de Chreste</p></blockquote><blockquote><p>Orig: <strong>ΜΝΗΜΟΝΕΥСΑΤΕ ΠΡΙΜΙΛΛΗС ΚΑΙ ΚΥΡΙΑΚΗС ΚΑΙ ΔWΡΟΘΕΑС ΕΤΙ ΔΕ ΚΑΙ ΧΡΗСΤΗ</strong></p></blockquote><blockquote><p>Fixed: <strong>ΜΝΗΜΟΝΕΥСΑΤΕ ΠΡΙΜΙΛΛΗС ΚΑΙ ΚΥΡΙΑΚΗΣ ΚΑΙ ΔΩΡΟΘΕΑΣ ΕΤΙ ΔΕ ΚΑΙ ΧΡΗΣΤΗ</strong></p></blockquote><img src="https://res.bibleox.com/s/img/image/simple/692c5dec205184ec278d6f99/s_p_LVbgKrKO7P3dfEJP.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c5dec205184ec278d6f99/m_p_LVbgKrKO7P3dfEJP.jpg">agrandir</a>]</p><hr><blockquote><p>FR : Gaïus, aussi appelé Porphyrius, centurion, notre frère, a, de ses propres moyens et avec une grande générosité, dallé ce sol. Brutius a exécuté le travail.</p></blockquote><blockquote><p>EN: Gaianus, also called Porphyrius, centurion (xp), our brother, has made the pavement at his own expense as an act of liberality. Brutius has carried out the work.</p></blockquote><blockquote><p>Orig: <strong>ΓΑΙΑΝΟС Ο ΚΑ ΠΟΡΦΥΡΙС ΧΡ* ΑΔΕΛΦΟС ΗΜWΝ ΕΚ ΦΙΛΟΤΕ ΙΜΙС ΑΜΕΝ ΟСΕΚΤW ΝΙΔΙWΝ ΕΨΙ ΦΟΛΟΓΗСΕΝ. ΒΡΟVΤΙС ΗΡΓΑСΑΤΟ.</strong></p></blockquote><blockquote><p>Fixed: <strong>ΓΑΙΑΝΟΣ Ο ΚΑ ΠΟΡΦΥΡΙΣ ΧΡ* ΑΔΕΛΦΟΣ ΗΜΩΝ ΕΚ ΦΙΛΟΤΕ ΙΜΙΣ ΑΜΕΝ ΟΣΕΚΤΩ ΝΙΔΙΩΝ ΕΨΙ ΦΟΛΟΓΗΣΕΝ. ΒΡΟΥΤΙΣ ΗΡΓΑΣΑΤΟ.</strong></p></blockquote><p><strong>*ΧΡ — hekatontarches — centurio</strong></p><img src="https://res.bibleox.com/s/img/image/simple/692c5e27205184ec278d6f9b/s_p_Qk321JfFTD4dDmnd.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c5e27205184ec278d6f9b/m_p_Qk321JfFTD4dDmnd.jpg">agrandir</a>]</p><h3>Église de Doura-Europos (Syrie)</h3><p>244 : l’église chrétienne de Doura-Europos</p><img src="https://res.bibleox.com/s/img/image/simple/6931880c205184ec278d6fa6/s_p_DFnp7s0vcTbXb3Qn.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931880c205184ec278d6fa6/m_p_DFnp7s0vcTbXb3Qn.jpg">agrandir</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/69318806205184ec278d6fa5/s_p_PuUKcoZEfAVSlPNM.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69318806205184ec278d6fa5/m_p_PuUKcoZEfAVSlPNM.jpg">agrandir</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/69318802205184ec278d6fa4/s_p_MF4zgk1ySUOBpqnG.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69318802205184ec278d6fa4/m_p_MF4zgk1ySUOBpqnG.jpg">agrandir</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/414/s_p_UgKueSl1yxG0SfbA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/414/m_p_UgKueSl1yxG0SfbA.jpg">agrandir</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/69330ed8205184ec278d6fc0/s_p_kXy4nTuYVCOxuDib.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69330ed8205184ec278d6fc0/m_p_kXy4nTuYVCOxuDib.jpg">agrandir</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/693187fd205184ec278d6fa3/s_p_R3poESL99kNRMpXi.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/693187fd205184ec278d6fa3/m_p_R3poESL99kNRMpXi.jpg">agrandir</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/69330e9e205184ec278d6fbf/s_p_ThLs4WrxsJ3ykxKU.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69330e9e205184ec278d6fbf/m_p_ThLs4WrxsJ3ykxKU.jpg">agrandir</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/69330e76205184ec278d6fbe/s_p_NykNwaI9TEwz1Ccf.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69330e76205184ec278d6fbe/m_p_NykNwaI9TEwz1Ccf.jpg">agrandir</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/69330e70205184ec278d6fbd/s_p_Rd3jEzEeesXUCTmh.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69330e70205184ec278d6fbd/m_p_Rd3jEzEeesXUCTmh.jpg">agrandir</a>]</p><p>L’église possède des fresques murales représentant des scènes du Nouveau Testament : le sauvetage de l’apôtre Pierre qui se noie et la guérison du paralytique à la piscine de Béthesda (de la série des miracles du Christ, seules ces deux fresques subsistent), le Bon Pasteur.</p><p><strong>Le sauvetage de l’apôtre Pierre qui se noie</strong></p><img src="https://res.bibleox.com/s/img/image/simple/692c8038205184ec278d6f9e/s_p_QQ2Rml8gUWsyQtS9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c8038205184ec278d6f9e/m_p_QQ2Rml8gUWsyQtS9.jpg">agrandir</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6786b88ddba77200015ae11c/m_p_do380IVDukCAfdFk.jpg">version 2</a>]</p><p><strong>La guérison du paralytique à la piscine de Béthesda</strong></p><img src="https://res.bibleox.com/s/img/image/simple/6786b889dba77200015ae11b/s_p_k1a5GDBvfzTCWmZv.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6786b889dba77200015ae11b/m_p_k1a5GDBvfzTCWmZv.jpg">agrandir</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6786bb0bdba77200015ae11d/m_p_dCRD85foL69l7kih.jpg">autre version</a>]</p><p><strong>Image près des fonts baptismaux (salle n° 6) : le Bon Pasteur ramène la brebis perdue au troupeau</strong></p><img src="https://res.bibleox.com/s/img/image/simple/6931870c205184ec278d6fa2/s_p_uBkNi8jGsMFpOQSM.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931870c205184ec278d6fa2/m_p_uBkNi8jGsMFpOQSM.jpg">agrandir</a>]</p><h3>Eusèbe de Césarée (Pamphile), évêque, historien de l’Église (v. 258-339)</h3><p>Il écrit sur la construction d’églises chrétiennes dans toutes les villes à l’époque précédant le règne de l’empereur romain Dioclétien (règne : 284-305). En 303, Dioclétien publie un édit ordonnant la destruction des églises chrétiennes. Eusèbe avait alors environ 45 ans, c’est-à-dire qu’il devait être témoin à la fois de la construction de ces églises et de leur destruction :</p><blockquote><p>5. Avec quelle bienveillance les procurateurs et les gouverneurs traitaient-ils les chefs des Églises ! Comment décrire ces <strong>assemblées de plusieurs milliers de personnes dans chaque ville</strong>, ces foules étonnantes <strong>qui affluaient dans les maisons de prière ! Les anciens bâtiments ne suffisaient plus ; <mark>dans toutes les villes on élevait de nouvelles églises spacieuses</mark> (εὐρείας εἰς πλάτος ἀνὰ πάσας τὰς πόλεις ἐκ θεμελίων ἀνίστων <mark>ἐκκλησίας</mark>).</strong></p><p>&lt;…&gt;</p><p>4. C’était la dix-neuvième année du règne de Dioclétien, lorsque, au mois de dystros (que les Romains appellent mars), à la veille de la fête de la Passion du Seigneur, fut affiché partout <strong><mark>l’édit impérial ordonnant de raser les églises jusqu’aux fondations</mark> (βασιλικὰ γράμματα, τὰς μὲν <mark>ἐκκλησίας</mark> εἰς ἔδαφος φέρειν)</strong>, de brûler les Écritures et de déclarer privés de leurs charges honorifiques ceux qui tenaient au christianisme ;</p></blockquote><p>(<a href="https://bibleox.com/ru/grc/w/%CE%95%CE%9A%CE%9A%CE%9B%CE%97%CE%A3%CE%99%CE%91%CE%A3%CE%A4%CE%99%CE%9A%CE%97%CE%A3_%CE%99%CE%A3%CE%A4%CE%9F%CE%A1%CE%99%CE%91%CE%A3-8/#:~:text=%E1%BC%80%CE%BD%E1%BD%B0%20%CF%80%E1%BD%B1%CF%83%CE%B1%CF%82%20%CF%84%E1%BD%B0%CF%82%20%CF%80%E1%BD%B9%CE%BB%CE%B5%CE%B9%CF%82%20%E1%BC%90%CE%BA%20%CE%B8%CE%B5%CE%BC%CE%B5%CE%BB%E1%BD%B7%CF%89%CE%BD%20%E1%BC%80%CE%BD%E1%BD%B7%CF%83%CF%84%CF%89%CE%BD%20%E1%BC%90%CE%BA%CE%BA%CE%BB%CE%B7%CF%83%E1%BD%B7%CE%B1%CF%82">Histoire de l’Église, livre 8, 1.5 et 2.4 (en grec)</a>)</p><h2>Découvertes contestées</h2><h3><strong>Une maison à Herculanum (</strong>Ier siècle<strong>)</strong></h3><img src="https://res.bibleox.com/s/img/image/simple/67e428d39a4a346bba31e8ba/s_p_F0lTpC2rqw7PVyf1.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/67e428d39a4a346bba31e8ba/m_p_F0lTpC2rqw7PVyf1.jpg">agrandir</a>] [<a href="https://res.bibleox.com/s/img/image/simple/69330b68205184ec278d6fb8/m_p_oEOCtcPUBThtuirO.jpg">version 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/69330cb6205184ec278d6fb9/m_p_zMmSTHDi5RoizXsX.jpg">version 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/69330cbb205184ec278d6fba/m_p_Jv9gdiBWmrMB5tc4.jpg">version 4</a>] [<a href="https://res.bibleox.com/s/img/image/simple/67e428d79a4a346bba31e8bb/m_p_1sEN1KSZxei96K4S.jpg">version 5</a>] [<a href="https://res.bibleox.com/s/img/image/simple/67e428db9a4a346bba31e8bc/m_p_TgMWk123osBJ9une.jpg">version 6</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/69330cc3205184ec278d6fbc/s_p_YLRMNDvDg7nCTh3X.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69330cc3205184ec278d6fbc/m_p_YLRMNDvDg7nCTh3X.jpg">agrandir</a>]</p><p>En 79 eut lieu l’éruption du Vésuve, qui ensevelit sous ses cendres des villes comme Pompéi, Stabies et Herculanum. À Herculanum fut découverte une <a href="https://ru.wikipedia.org/wiki/%D0%93%D0%B5%D1%80%D0%BA%D1%83%D0%BB%D0%B0%D0%BD%D1%83%D0%BC#%D0%94%D0%BE%D0%BC_%D0%B4%D0%B2%D1%83%D1%85%D1%81%D0%BE%D1%82%D0%BB%D0%B5%D1%82%D0%B8%D1%8F">maison</a> (appelée maison du Bicentenaire en l’honneur du jubilé des fouilles), où, au deuxième étage, dans l’une des pièces, avait été pratiquée dans le mur <a href="https://ermakvagus.com/Europe/Italy/Pompeii/christianity_pompeii_rus.html">une niche en forme de croix</a>, juste au centre au-dessus d’un petit meuble en bois. Certains supposent qu’y était suspendue une croix en bois pour la prière et que ce lieu servait aux offices chrétiens ou à la prière domestique. Cependant, de sérieux arguments s’opposent à cette hypothèse. Dans la même ville fut trouvée une petite étagère qui, suppose-t-on, aurait pu laisser une trace semblable sur un mur.</p><img src="https://res.bibleox.com/s/img/image/simple/6932ff2b205184ec278d6fb6/s_p_cXmpauqq2EYuH6ww.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6932ff2b205184ec278d6fb6/m_p_cXmpauqq2EYuH6ww.jpg">agrandir</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6932ff36205184ec278d6fb7/s_p_KIfO7M0rbhGbWoIk.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6932ff36205184ec278d6fb7/m_p_KIfO7M0rbhGbWoIk.jpg">agrandir</a>] [<a href="https://res.bibleox.com/s/img/image/simple/69330cbf205184ec278d6fbb/m_p_WL1FQysNlwZc0yT9.jpg">version 2</a>]</p><p>L’étagère n’est pas tout à fait identique : elle présente une assez grande saillie à gauche et à droite, et une saillie moindre vers le bas. De plus, dans la maison du Bicentenaire, il y avait probablement, à cet endroit du mur, deux volets fermants. Néanmoins, il est très probable qu’il s’agisse bien d’une étagère ordinaire et non d’une croix. Au lecteur de décider dans quelle mesure accorder crédit à telle ou telle conclusion. Nous n’avons fait ici que rassembler les informations connues sur cette découverte.</p>
    references: |-
      <p><strong>Liens :</strong></p><ul>
      <li><p><a href="https://www.museumofthebible.org/newsroom/museum-of-the-bible-to-premiere-megiddo-mosaic">https://www.museumofthebible.org/newsroom/museum-of-the-bible-to-premiere-megiddo-mosaic</a></p></li>
      <li><p><a href="https://en.wikipedia.org/wiki/Legio">https://en.wikipedia.org/wiki/Legio</a></p></li>
      <li><p><a href="https://en.wikipedia.org/wiki/Megiddo_church_(Israel)">https://en.wikipedia.org/wiki/Megiddo_church_(Israel)</a></p></li>
      </ul><p>Dans l’édition russe de cet article, l’édit de Dioclétien est daté de 296 et Eusèbe est dit âgé de 38 ans ; la date communément admise (303) et l’âge d’environ 45 ans, retenus ici, concordent avec l’Histoire ecclésiastique d’Eusèbe (VIII, 2, 4). La citation évangélique de l’épigraphe est donnée d’après la Segond (Lc 19:39-40).</p><p>Traduction : Rodion Vlasov, avec l’aide de l’IA. Texte de base : l’original russe.</p>
