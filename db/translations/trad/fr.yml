    title: "Images anciennes diverses non incluses dans la collection principale"
    body: |-
      <h2>Catacombes de saint Janvier (Catacombe di San Gennaro) [1]</h2><h3>Saint Janvier de Bénévent, de Pouzzoles (de Naples), évêque, hiéromartyr</h3><p>Catacombes de San Gennaro (de saint Janvier), Naples. Fresque du IVe s. On ne voit pas très bien qui est représenté ici. En haut est écrit : SANCTOMARTYRIIANVARIO (saint martyr Janvier). Pourtant, c’est un jeune homme qui est représenté, on ne sait pourquoi. On ne comprend pas non plus pourquoi il porte un tel nimbe.</p><p>Page d’information sur ce saint dans l’Église orthodoxe : <a href="https://days.pravoslavie.ru/name/890.html">https://days.pravoslavie.ru/name/890.html</a></p><p>Page Wikipédia sur cette fresque. En polonais, mais avec des informations utiles : <a href="https://pl.wikipedia.org/wiki/January_z_Benewentu">https://pl.wikipedia.org/wiki/January_z_Benewentu</a></p><img src="https://res.bibleox.com/s/img/image/simple/686e6aa95f47da2505d3ae6e/s_p_RCtXSS4uiuO9E0Qf.jpg"><p>agrandir<a href="https://res.bibleox.com/s/img/image/simple/686e6aa95f47da2505d3ae6e/m_p_RCtXSS4uiuO9E0Qf.jpg">agrandir</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686e56775f47da2505d3ae67/m_p_XhI4Ni1rKZ949Zi1.jpg">version 2</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686e54755f47da2505d3ae66/s_p_zKsSelu839AuImaV.jpg"><p>agrandir<a href="https://res.bibleox.com/s/img/image/simple/686e54755f47da2505d3ae66/m_p_zKsSelu839AuImaV.jpg">agrandir</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686e57135f47da2505d3ae68/m_p_faNUwXKGPaVtmUwW.jpg">version 2</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686e6aec5f47da2505d3ae70/s_p_2fvyFxXewVLu06NV.jpg"><p>agrandir<a href="https://res.bibleox.com/s/img/image/simple/686e6aec5f47da2505d3ae70/m_p_2fvyFxXewVLu06NV.jpg">agrandir</a>]</p><h3>La chrétienne Céroula</h3><p>Inscription en bas : « CERVLA IN PACE » (Céroula dans la paix), Ve-VIe s. [3]</p><img src="https://res.bibleox.com/s/img/image/simple/686e4d5c5f47da2505d3ae63/s_p_1dqPUS5wghY1DrdP.jpg"><p>agrandir<a href="https://res.bibleox.com/s/img/image/simple/686e4d5c5f47da2505d3ae63/m_p_1dqPUS5wghY1DrdP.jpg">agrandir</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686e58705f47da2505d3ae6a/m_p_r6sua9UNLBhgIZ06.jpg">version 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686e58625f47da2505d3ae69/m_p_6KViYk7KWJDrIa8l.jpg">version 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686e6ad15f47da2505d3ae6f/m_p_q9ocVtWoayH4BxtB.jpg">version 4</a>]</p><h3>La famille de Théotèknos</h3><blockquote><p>Arcosolium de la famille de Théotèknos (Théotèknos). Les recherches ont montré que c’est la petite fille qui est morte la première. Une fresque avec son portrait fut peinte dans la niche. Puis l’homme mourut. Une nouvelle fresque, avec le père cette fois, fut peinte par-dessus la première. La femme mourut la dernière, et leur portrait de groupe apparut dans la niche.</p></blockquote><img src="https://res.bibleox.com/s/img/image/simple/686e6be45f47da2505d3ae71/s_p_xNoWgh6wacZ3al1R.jpg"><p>agrandir<a href="https://res.bibleox.com/s/img/image/simple/686e6be45f47da2505d3ae71/m_p_xNoWgh6wacZ3al1R.jpg">agrandir</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686e592c5f47da2505d3ae6b/s_p_A6SYWxzdgc1EPwun.jpg"><p>agrandir<a href="https://res.bibleox.com/s/img/image/simple/686e592c5f47da2505d3ae6b/m_p_A6SYWxzdgc1EPwun.jpg">agrandir</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686fe8695f47da2505d3ae88/m_p_nzuUOKu6sAmxO4pO.jpg">version 2</a>]</p><h2>Catacombes de la Via Anapo[2]</h2><h3>Femme en prière (orante)</h3><p>Fresque d’une femme en prière (orante) dans la catacombe anonyme de la Via Anapo, Rome</p><img src="https://res.bibleox.com/s/img/image/simple/686e53655f47da2505d3ae65/s_p_qTxn07MuPIePNzPn.jpg"><p>agrandir<a href="https://res.bibleox.com/s/img/image/simple/686e53655f47da2505d3ae65/m_p_qTxn07MuPIePNzPn.jpg">agrandir</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686e535e5f47da2505d3ae64/m_p_U8Zh4RJjehyZtXep.jpg">version 2</a>]</p>
