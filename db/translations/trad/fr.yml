      </ol><h3>Images anciennes diverses non incluses dans la collection principale</h3><p><a href="https://bibleox.com/fr/fr/w/Ik5v_Images_anciennes_diverses_non_incluses_dans_la_collection_principale">https://bibleox.com/fr/fr/w/Ik5v_Images_anciennes_diverses_non_incluses_dans_la_collection_principale</a></p><p>Les numéros des Psaumes suivent la numérotation hébraïque, comme dans la Segond ; l’original russe suit celle des Septante et compte les titres des psaumes pour un premier verset, d’où le décalage visible dans les références aux Psaumes (Ps 5:8, 99:5, 132:7). Les liens vers des pages qui n’existent pas encore en français mènent aux pages russes.</p><p>Traduction : Rodion Vlasov, avec l’aide de l’IA. Texte de base : l’original russe. Citations bibliques : Louis Segond (1910).</p>
