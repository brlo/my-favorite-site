  - src: KPgB_Христианские_захоронения_и_надписи
    path: Bu3i_Sepultures_et_inscriptions_chretiennes
    title: "Sépultures et inscriptions chrétiennes"
    body: |-
      <h2>Inscriptions auprès des sépultures des chrétiens des premiers siècles</h2><p>Inscriptions dans le triclinium de la soi-disant « Memoria Apostolorum » sur la voie Appienne — sanctuaire aménagé au milieu du IIIe s., entre 238 et 260. C’est alors, au IIIe s., que des inscriptions chrétiennes de prière commencèrent à apparaître dans le triclinium, dans l’esprit de « <em>Paule ed Petre petite pro Victore</em> » et d’autres semblables (citées ci-dessous). On continua à les tracer jusqu’à l’époque de Constantin le Grand. [1]</p><img src="https://res.bibleox.com/s/img/image/simple/483/s_p_1D8zprHe86ZZn5O9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/483/m_p_1D8zprHe86ZZn5O9.jpg">agrandir</a>]</p><h3><strong>Ayez en mémoire, dans vos prières </strong>(in mente habete, in orationibus vestris):</h3><p>12912: [Petre et] Paul[e] | in m[ente] abete in | ora[tion]ibus vestris/ — « <strong>Pierre et Paul, ayez en mémoire, dans vos prières… »</strong></p><h3><strong>Intercédez </strong>(petite), ou « priez », « demandez »</h3><p>12918: [Paul]e et Petre petite | [pro] nobis omnibus/ — <strong>« Pierre et Paul, intercédez pour nous tous ! »</strong></p><p>12931: Petr[e] et Pau[l]e petite | pro [Le]ontium / — <strong>« Pierre et Paul, intercédez pour Leontius ! »</strong></p><p>12933: Pa[ul]e et Pet|re apetite pro Da|tivu in perpetu`u´m/ — <strong>« Pierre et Paul, intercédez pour Dativus pour l’éternité ! »</strong></p><p>12989: Paule ed Petre petite | pro Victore/ — <strong>« Pierre et Paul, intercédez pour Victor ! »</strong></p><p>12946: [Petre et Pa]ulae spir[ita sancta vestra petant pro - - -]/ — <strong>« Pierre et Paul, que vos saints esprits intercèdent pour [- - -] ! »</strong></p><h3><strong>conservate</strong> — <strong>protégez</strong> (ou « gardez »)</h3><p>12991: Petre et Paule cons[ervate - - -]/ — <strong>« Pierre et Paul, protégez [- - -] ! »</strong></p><p>12996: sa[lva Paule et] | Petr[e - - - et] | Mart[yrium et] | conse[rvate in] | do[mino - - -]/ — <strong>« Sauve, ô Paul et Pierre, [- - -] et Martyrius, et protège dans le Seigneur [- - -] ! »</strong></p><p>13026: [- - - roga]mus | [conse]rvate nos [omnes]/ — <strong>« [- - -] nous te prions, protégez-nous tous ! »</strong></p><h3><strong>Invocations simples</strong></h3><p>12909: Petr[e et Paule]/ — <strong>« Ô Pierre et Paul ! »</strong></p><h3><strong>Secours aux pécheurs</strong></h3><p>12967: Petre et Paule sub|venite Prim[o] | peccatori/ — <strong>« Pierre et Paul, venez au secours de Primus, le pécheur ! »</strong></p><h3><strong>Beaucoup d’invocations sont formulées en grec ou en latin avec des lettres grecques</strong></h3><p>12927: Παῦλε {μ} καί | μου πατ|ρός/ — <strong>« Paul, et (aide) mon père ! »</strong></p><p>12997: [Παυλ]ε ετ Πετ[ρε ιν μεν]/[τε ν]ος αβετε [ιν ορα]/[τι]ωνες βεστ[ρας]/ — <strong>« Pierre et Paul, ayez en mémoire, dans vos prières… »</strong></p><p>13045: [Πα]υ[λε ετ Πετρε] | [ι]ν με[ντε αβετε] | Αὐφίδ[ιον υἱόν - - -] | μου/ — <strong>« Pierre et Paul, ayez en mémoire Aufidius, mon fils ! »</strong></p><p>13069: Πέτρε Παίτρε μνημόνευαι | Τιμοκράτην καὶ Εὐ|τυχείαν κινα(?) καὶ | ἐσώρα(?) ++ [- - -]/ — <strong>« Pierre, Pierre, souviens-toi de Timocrate et d’Eutychie, et (…) ++ [- - -] ! »</strong></p><p>13045: [κομμ]ανδαμ[ους? - - -]/<strong> </strong>— <strong>« Nous recommandons [- - -] ».</strong></p><p>13049: Παῦλε καὶ Π[έτρε ἔχετε] / μνί[α]ς/ — <strong>« Paul et Pierre, gardez la mémoire [- - -] ! »</strong></p><p>13055: [Παῦλε καὶ Πέτ]ρε εἰς μνε[ίαν] / [ἔχετε τὸν ᾿Ιρ]ίνες φίλι[ον]/ — <strong>« Paul et Pierre, souvenez-vous du bien-aimé d’Irène ».</strong></p><p>13070: Παυλε Πετρε | Χαλκηδονι ανιμα | βωβυς κομαν|[δ]ω Λαυrους/ — <strong>« Paul et Pierre, moi, Laurus (Laurusius ?), je vous confie l’âme de Chalcédoine ! »</strong></p><p>13071: &lt;Π&gt;α[ῦλ]ος καὶ | Π[έτρο]ς συν|τηρή[σα]τε θ(εο)ῦ δούλους | πνεύματα | ἅγεια συντη|ρήσαται ἡμᾶ|ς ἴνα πολλοῖς | ἔτεσε[ι ζῶμεν]/ — <strong>« Paul et Pierre, soutenez les serviteurs de Dieu ! Esprits saints, soutenez-nous, afin que nous vivions de nombreuses années ! »</strong></p><p>13073: [Παυλε] ετ Πετρε | [ιν με]ντε [ν]ος αβε|[τοτε εἰς το]ὺς ἐῶ[νας]/<strong> </strong>— <strong>« Paul et Pierre, ayez en mémoire pour toujours… »</strong></p><h3><strong>promisit / votum fecit</strong> — <strong>a fait un vœu</strong></h3><p>13091: [- - - i]dus m[- - -] | Eulogius votum f[ecit]/ — <strong>« [- - -] aux ides [- - -], Eulogius a fait un vœu [- - -] ».</strong></p><h3><strong>Mentions du refrigerium</strong> (repas commémoratif) :</h3><p>12942: refrigerav[it] | [F]elicissimus cum s[uis]/ — <strong>« Felicissimus a offert le repas avec les siens. »</strong></p><p>12981: Petro et Paulo | Tomius Coelius | refri`ger´&lt;i&gt;um feci/ — <strong>« À Pierre et Paul, moi, Tomius Coelius, j’ai offert le repas »</strong></p><p>13003: [---] at Paulu[m] | et Pet[rum] | refri[geravi - - -]/ — <strong>« près de Paul et Pierre, j’ai offert le repas »</strong></p><p>Source : <a href="http://csla.history.ox.ac.uk/record.php?recid=E05087">http://csla.history.ox.ac.uk/record.php?recid=E05087</a></p><hr><h3>Invocations à Dieu</h3><ul><li><p>DEVS TE PRECOR VT PARADISVM LVCIS POSSIT VIDERE – « <strong>Seigneur, je te prie, qu’il puisse voir la lumière du paradis</strong>».</p></li><li><p>DOMINE NE QVANDO ADVMBRETVR SPIRITVS VENERES – « <strong>Seigneur, que jamais l’âme de Venera ne soit enténébrée</strong>».</p></li></ul><h3>Demande d’intercession des défunts</h3><ul><li><p>ET IN ORATIONIS TVIS ROGES PRO NOBIS QVIA SCIMVS TE ☧ – « <strong>Dans tes prières, prie pour nous, car nous savons que tu es dans le Christ</strong>».</p></li><li><p>ORO SCIO NAMQVE BEATAM – « <strong>Je t’en prie, car je sais que tu es dans la béatitude</strong>».</p></li><li><p>ORA PRO PARENTI BVS TVIS – « <strong>Prie pour tes parents</strong>».</p></li><li><p>PETE PRO NOS VT SALVI SIMVS – « <strong>Prie pour nous, afin que nous soyons sauvés</strong>».</p></li><li><p>IN ORATIONIS TVIS ROGES PRO NOBIS – « <strong>Dans tes prières, demande pour nous</strong>».</p></li><li><p>ATTICE SPIRITVS TVS IN BONV ORA PRO PARENTIBVS TVIS – « <strong>Atticus, ton âme est dans la béatitude, prie pour tes parents</strong>».</p></li></ul><p>Une partie seulement est citée. Le reste du matériel est consultable sur le lien.</p><h3><strong>Inscriptions et images symboliques</strong></h3><ul><li><p>Le mot VIVAS, c’est-à-dire « <strong>vis</strong> », très souvent écrit aussi sur les tombeaux, exprime le souhait de vie éternelle et de béatitude pour le défunt ;</p></li><li><p>VIVAS IN DEO – « <strong>vis en Dieu</strong>»;</p></li><li><p>VIBAS IN SANCTIS – « <strong>vis parmi les saints</strong>».</p></li></ul><h3>Le défunt a atteint le salut</h3><p>Parfois il est dit de manière plus affirmative que le défunt est parmi les élus :</p><ul><li><p>ACCEPIT REQVI EM IN DEO – « <strong>Il a reçu le repos en Dieu</strong>»;</p></li><li><p>SCIMVS TE IN – « <strong>Nous savons que tu es dans le Christ</strong>»;</p></li><li><p>FRVCTVOSVS ANIMA TVA CVM IVSTIS – « <strong>Fructuosus, ton âme est avec les justes</strong>»;</p></li><li><p>REQVI EM ADCEPIT IN DEO PATRE NOSTRO ET CHRISTO EIVS – « <strong>Il a reçu le repos en Dieu notre Père et dans son Christ</strong>»;</p></li><li><p>ACCEPTA APVD DEVM – « <strong>Accueillie par Dieu</strong>»;</p></li><li><p>RECEPTVS AD DEVM – « <strong>Reçu par Dieu</strong>»;</p></li><li><p>TECVM PAX CHRISTI – « <strong>la paix du Christ avec toi</strong>»;</p></li><li><p>SEMPER VIVE IN PACE – « <strong>Vis toujours dans la paix</strong>»;</p></li><li><p>IN PACE ET IN DOMO AETERNA DEI – « <strong>Dans la paix et dans la maison éternelle de Dieu</strong>».</p></li><li><p>VIVI IN GLORIA DEI ET IN PACE DOMINI NOSTRI ☧ – « <strong>Tu vis dans la gloire de Dieu et dans la paix de notre Seigneur le Christ</strong> » – ici le nom du Sauveur est désigné par son monogramme ☧ ;</p></li><li><p>ELATVS EST, sorte d’acclamation qui ne se rencontre qu’une ou deux fois, peut se traduire ainsi : « <strong>il s’est élevé vers Dieu</strong>».</p></li></ul><h3>Le paradis, lieu de lumière</h3><p>Dans les inscriptions funéraires des premiers chrétiens, le paradis est appelé lieu de lumière et de splendeur ; en voici quelques exemples :</p><ul><li><p>CVIVS SPIRITVS IN LVCE DOMINI SVSCEPTVS EST – « <strong>Son âme a été reçue dans la lumière de Dieu</strong>».</p></li><li><p>IN CHRISTVM CREDENS PREMIA LVCIS ABET – « <strong>Croyant au Christ, il a pour récompense la lumière</strong>».</p></li><li><p>AETERNA TIBI LUX TIMOTHEA IN ☧– « <strong>Lumière éternelle pour toi, Timothée, dans le (Christ)</strong>».</p></li></ul><h3></h3><p>Livre : <strong>A. von Fricken. Les catacombes romaines et les monuments de l’art chrétien primitif. M. : édition de K. T. Soldatenkov, 1872–1877–1880–1885. </strong>[2]</p>
    references: |-
      <ol>
      <li><p><a href="https://vk.com/@aletheia-de-sanctis-venerandis">https://vk.com/@aletheia-de-sanctis-venerandis</a></p></li>
      <li><p><a href="https://azbyka.ru/otechnik/Istorija_Tserkvi/rimskie-katakomby-i-pamjatniki-pervonachalnogo-hristianskogo-iskusstva/2">https://azbyka.ru/otechnik/Istorija_Tserkvi/rimskie-katakomby-i-pamjatniki-pervonachalnogo-hristianskogo-iskusstva/2</a></p></li>
      </ol><p>Les inscriptions latines sont reproduites telles qu’elles figurent dans l’original (majuscules, lettres restituées entre crochets) ; leur traduction française est donnée entre guillemets.</p><p>Traduction : Rodion Vlasov, avec l’aide de l’IA. Texte de base : l’original russe.</p>
