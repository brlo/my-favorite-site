pages:
  - src: древние-иконы
    path: Ik1c_Collection_dicones_anciennes
    title: "Collection d’icônes anciennes"
    title_sub: "Icônes chrétiennes anciennes du Christ, de la Mère de Dieu, des apôtres et d’autres saints"
    body: |-
      <h2>~XVe s. av. J.-C.</h2><h3>Tente de la Rencontre</h3><p>Sur le voile au milieu du sanctuaire (entre le Saint et le Saint des Saints) sont représentés des chérubins (<a href="https://bibleox.com/fr/fr-lsg/ish/26/#L31">Ex 26:31</a>), ainsi que sur les tentures (parois) qui l’entourent (<a href="https://bibleox.com/fr/fr-lsg/ish/26/#L1">Ex 26:1</a>; <a href="https://bibleox.com/fr/fr-lsg/ish/36/#L8">36:8</a>), ce que l’auteur du dessin n’a pas représenté. La Tente est la figure (l’icône) de la réalité céleste (<a href="https://bibleox.com/fr/fr-lsg/ish/25/#L8-9,40">Ex 25:8-9,40</a>; <a href="https://bibleox.com/fr/fr-lsg/evr/9/#L24">He 9:24</a>; <a href="https://bibleox.com/fr/fr-lsg/act/7/#L44">Ac 7:44</a>). Dieu a ordonné de vénérer le sanctuaire (<a href="https://bibleox.com/fr/fr-lsg/lev/19/#L30">Lv 19:30</a>; <a href="https://bibleox.com/fr/fr-lsg/lev/26/#L2">26:2</a>).</p><img src="https://res.bibleox.com/s/img/image/simple/471/s_p_P2j4gLJt9iKSnkge.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/471/m_p_P2j4gLJt9iKSnkge.jpg">agrandir</a>] [<a href="https://res.bibleox.com/s/img/image/simple/472/m_p_bNPh6hCNJDhzahar.jpg">vue extérieure</a>]</p><h3>Arche d’alliance</h3><p>Sur l’arche étaient représentés deux anges chérubins (<a href="https://bibleox.com/ru/ru/w/%D0%BA%D0%BE%D0%B2%D1%87%D0%B5%D0%B3_%D0%B7%D0%B0%D0%B2%D0%B5%D1%82%D0%B0/">références scripturaires en russe</a>). Le prophète Josué adorait devant l’Arche d’alliance (<a href="https://bibleox.com/fr/fr-lsg/nav/7/#L6">Jos 7:6</a>).</p><img src="https://res.bibleox.com/s/img/image/simple/469/s_p_DUn5vqnI4F8yRiNA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/469/m_p_DUn5vqnI4F8yRiNA.jpg">agrandir</a>]</p><h3>Le camp d’Israël</h3><p>Israël se déplaçait en forme de croix (<a href="https://bibleox.com/ru/ru/w/%D0%B5%D0%B2%D1%80%D0%B5%D0%B9%D1%81%D0%BA%D0%B8%D0%B9-%D1%81%D1%82%D0%B0%D0%BD-%D0%BA%D1%80%D0%B5%D1%81%D1%82/">références scripturaires en russe</a>).</p><img src="https://res.bibleox.com/s/img/image/simple/470/s_p_t8tRbbwlzsBzyVzk.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/470/m_p_t8tRbbwlzsBzyVzk.jpg">agrandir</a>]</p><h2>~Xe s. av. J.-C.</h2><h3>Le Temple de Jérusalem construit par Salomon</h3><p>Des images sculptées de chérubins ornaient les murs du Temple (<a href="https://bibleox.com/fr/fr-lsg/3ts/6/#L32">1 R 6:32</a>), la porte d’entrée (<a href="https://bibleox.com/fr/fr-lsg/3ts/6/#L32">1 R 6:32</a>; (<a href="https://bibleox.com/fr/fr-lsg/3ts/6/#L35">1 R 6:35</a>) et le voile devant l’entrée du Saint des Saints (<a href="https://bibleox.com/fr/fr-lsg/2par/3/#L14">2 Ch 3:14</a>; <a href="https://bibleox.com/fr/fr-lsg/1mak/1/#L22">1 M 1:22</a>). Dans le Saint des Saints se dressaient deux grandes statues de chérubins en bois doré (<a href="https://bibleox.com/fr/fr-lsg/3ts/6/#L23">1 R 6:23</a>). Sur le couvercle de l’Arche d’alliance furent faites deux statues de chérubins (<a href="https://bibleox.com/fr/fr-lsg/ish/25/#L18-20">Ex 25:18-20</a>). Dans la cour du Temple, sur les grands supports des bassins de lavage, étaient représentés des lions, des bœufs et des chérubins (<a href="https://bibleox.com/fr/fr-lsg/3ts/7/#L28-29">1 R 7:28-29</a>). (<a href="https://bibleox.com/ru/ru/w/%D0%B8%D0%B5%D1%80%D1%83%D1%81%D0%B0%D0%BB%D0%B8%D0%BC%D1%81%D0%BA%D0%B8%D0%B9-%D1%85%D1%80%D0%B0%D0%BC/">Plus de détails en russe</a>).</p><p>Le prophète David adorait le Temple (<a href="https://bibleox.com/fr/fr-lsg/ps/5/#L8">Ps 5:8</a>; <a href="https://bibleox.com/fr/fr-lsg/ps/99/#L5">99:5</a>; <a href="https://bibleox.com/fr/fr-lsg/ps/132/#L7">132:7</a>), rendant hommage à Dieu au moyen de cette image.</p><img src="https://res.bibleox.com/s/img/image/simple/468/s_p_lv7GzNtM53C4Zqgr.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/468/m_p_lv7GzNtM53C4Zqgr.jpg">agrandir</a>]</p><h2>IIe siècle</h2><h3>La Mère de Dieu avec l’enfant Jésus, le prophète montre l’étoile (Rome)</h3><p>IIe - début du IIIe s. Catacombes de Priscille[6]. C’est la plus ancienne image de la Mère de Dieu. L’homme auprès de la Mère de Dieu tient peut-être un livre de la main gauche et désigne l’étoile du doigt de la main droite.</p><img src="https://res.bibleox.com/s/img/image/simple/6751b012dba7720001514f69/s_p_jNTGMwic6Cse9xDG.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6751b012dba7720001514f69/m_p_jNTGMwic6Cse9xDG.jpg">agrandir</a>] [<a href="https://res.bibleox.com/s/img/image/simple/67618740dba7720001cd0e2c/m_p_ckKuGWqzHuN1tR5Q.jpg">version 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686cf0535f47da2505d3ae4d/m_p_dajA4xvStk0EnnSq.jpg">version 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686cf7725f47da2505d3ae50/m_p_n79yEKK4QSCeorx3.jpg">version 4</a>] [<a href="https://res.bibleox.com/s/img/image/simple/442/m_p_5zQEQbMmBkEs9J2S.jpg">version 5</a>]</p><p>L’homme auprès de la Mère de Dieu peut être le prophète Isaïe, qui a prononcé la prophétie :</p><blockquote><p>« C’est pourquoi le Seigneur lui-même vous donnera un signe : Voici, <strong>la jeune fille deviendra enceinte, elle enfantera un fils</strong>, et elle lui donnera le nom d’Emmanuel. » (<a href="https://bibleox.com/fr/fr-lsg/is/7/#L14">Is 7:14</a>)</p></blockquote><p>Ou bien Balaam :</p><blockquote><p>« Je le vois, mais non maintenant, je le contemple, mais non de près. <strong>Un astre sort de Jacob</strong>, un sceptre s’élève d’Israël. Il perce les flancs de Moab, et il abat tous les enfants de Seth. » (<a href="https://bibleox.com/fr/fr-lsg/chis/24/#L17">Nb 24:17</a>)</p></blockquote><p>Ou bien l’artiste, au lieu d’une inscription explicative, a simplement recouru à ce procédé. Il nous invite à prendre le livre, à lire la prophétie sur l’astre qui se lève et à comprendre qu’il a représenté la naissance de celui dont parle cette prophétie, c’est-à-dire la naissance du Sauveur de la Vierge.</p><h3>Le Christ en Bon Pasteur</h3><p>Fin du IIe siècle. Rome. Catacombes de Calliste (<a href="https://en.wikipedia.org/wiki/Catacomb_of_Callixtus#Paintings">Callixitus Catacomb, Crypt of Lucina</a>).</p><img src="https://res.bibleox.com/s/img/image/simple/473/s_p_mrIYHR2oqLQuPn0z.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/473/m_p_mrIYHR2oqLQuPn0z.jpg">agrandir</a>]</p><h2>IIIe siècle</h2><h3>La Mère de Dieu « Orante » (Rome)</h3><p>Catacomba Maggiore, Roma[26][27]. Au premier plan sont représentées la vierge Marie et l’enfant Christ.</p><img src="https://res.bibleox.com/s/img/image/simple/6751fe6ddba7720001514f7e/s_p_C1Iw2V4OhNy1SGOE.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6751fe6ddba7720001514f7e/m_p_C1Iw2V4OhNy1SGOE.jpg">agrandir</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686cefb35f47da2505d3ae4c/m_p_70zYu2r0np0WFNUu.jpg">version 2</a>]</p><h3>Le Christ, les apôtres, les martyrs Gorgonius, Pierre, Marcellin et Tiburce (Rome)</h3><p>Catacombes de Pierre et Marcellin</p><img src="https://res.bibleox.com/s/img/image/simple/6752012adba7720001514f82/s_p_x5I0ahjwMz1X5LoJ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6752012adba7720001514f82/m_p_x5I0ahjwMz1X5LoJ.jpg">agrandir</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686d237a5f47da2505d3ae56/m_p_ST9me27UGtWHYDBc.jpg">version 2</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/676082a6dba7720001cd0e22/s_p_YjPD3PzLDCF4wgh1.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/676082a6dba7720001cd0e22/m_p_YjPD3PzLDCF4wgh1.jpg">agrandir</a>]</p><h3>Une femme en prière devant le Bon Pasteur (Rome)</h3><p>IIIe siècle. Catacombes de Priscille[6].</p><p>Les images forment une composition. L’artiste a disposé les figures de telle manière que les personnes en prière tout autour regardent et lèvent les mains vers le sommet de la salle, où le Christ est représenté en <strong>Bon Pasteur</strong> (<a href="https://bibleox.com/fr/fr-lsg/in/10/#L11">Jn 10:11</a>). Toutes les scènes autour du Bon Pasteur sont unies par un même thème — <strong>la délivrance de la mort</strong>.</p><img src="https://res.bibleox.com/s/img/image/simple/686bea5b5f47da2505d3ae31/s_p_pjRHeoFaUpKPoyEH.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686bea5b5f47da2505d3ae31/m_p_pjRHeoFaUpKPoyEH.jpg">agrandir</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686cf7375f47da2505d3ae4f/m_p_MOsOWI2vEXUj5ELf.jpg">version 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6904b3f2205184ec278d6e53/m_p_0GRveVCOh2GBz7eq.jpg">version 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/431/m_p_LUZsrJtesEWiwHBO.jpg">version 4</a>]</p><p>Le Bon Pasteur, c’est le Christ (Lc 15:6-7 ; Jn 10:1-21 ; Ps 23).</p><img src="https://res.bibleox.com/s/img/image/simple/69319f74205184ec278d6fa7/s_p_GR8gHxKZuC87xqlf.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69319f74205184ec278d6fa7/m_p_GR8gHxKZuC87xqlf.jpg">agrandir</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686d2ac55f47da2505d3ae59/m_p_JDvtNt9RJrqnAsEW.jpg">version 2</a>]</p><p>Une femme à la tête couverte prie les mains levées (probablement Sara : Gn 18:1-15 et Gn 21:1-7).</p><img src="https://res.bibleox.com/s/img/image/simple/686bea885f47da2505d3ae32/s_p_79wnuevuFIi3tnrH.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686bea885f47da2505d3ae32/m_p_79wnuevuFIi3tnrH.jpg">agrandir</a>]</p><p>À droite, une scène de l’Ancien Testament : trois jeunes gens (<a href="https://en.wikipedia.org/wiki/Catacomb_of_Priscilla#/media/File:Shadrach,_Meshach,_and_Abednego_in_the_fiery_furnace,_from_the_book_Die_Malereien_der_Katakomben_Roms,_plate_78,_levels_adjusted.jpg">Sadrac, Mésac et Abed-Nego</a>) prient les mains levées (Dn 3:1-90).</p><img src="https://res.bibleox.com/s/img/image/simple/686cfc565f47da2505d3ae52/s_p_NmZJuoF70d9qohZs.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686cfc565f47da2505d3ae52/m_p_NmZJuoF70d9qohZs.jpg">agrandir</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686cfc475f47da2505d3ae51/m_p_qzHB83d52LoU7QQL.jpg">version 2</a>]</p><p>À gauche, une scène de l’Ancien Testament : Abraham et Isaac avec le bois du sacrifice (Gn 22:1-19).</p><img src="https://res.bibleox.com/s/img/image/simple/686d33c45f47da2505d3ae5a/s_p_QQLn5T52hx8gSrBf.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d33c45f47da2505d3ae5a/m_p_QQLn5T52hx8gSrBf.jpg">agrandir</a>]</p><p>Au-dessus de l’entrée est représenté le prophète Jonas, englouti par un animal marin (<a href="https://bibleox.com/fr/fr-lsg/ion/2/#L1">Jon 2:1</a>).</p><img src="https://res.bibleox.com/s/img/image/simple/476/s_p_aHV4YSuoWhVZ1H5y.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/476/m_p_aHV4YSuoWhVZ1H5y.jpg">agrandir</a>]</p><p>Il vaut la peine de décrire plus en détail la scène de la vie de la femme en prière dans la partie antérieure de la salle.</p><img src="https://res.bibleox.com/s/img/image/simple/686d36265f47da2505d3ae5d/s_p_MGpxKQ94pikRfgFK.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d36265f47da2505d3ae5d/m_p_MGpxKQ94pikRfgFK.jpg">agrandir</a>]</p><p><strong>Les scènes de la paroi frontale</strong></p><p>Chaque section de la composition de la salle représente une scène. Toutes ces scènes sont des éléments importants du thème chrétien. En haut se trouve la scène du Bon Pasteur, à gauche la scène d’Abraham, à droite celle des trois jeunes gens, dans le passage celle du prophète Jonas. On peut donc supposer que l’artiste n’a pas dérogé à cette règle (une section — une scène importante) dans la partie antérieure de la salle, qu’il est difficile de décrire sans ambiguïté. Ce n’est ici qu’une hypothèse. Comme de tous côtés (sauf au centre) sont représentées des scènes de l’Ancien Testament, on peut supposer que sur la paroi antérieure il s’agit de l’histoire d’Agar (Gn 16 ; Gn 21). Si c’est le cas, sont d’abord représentés Abraham et Agar chassée avec son fils Ismaël (1), puis la prière de Sara (2), puis Agar allaitant son enfant (3).</p><p>Examinons cette version plus en détail :</p><p><strong>1. L’expulsion d’Agar</strong>. On peut dire avec le plus de certitude que l’homme assis est Abraham (il a les mêmes cheveux et la même barbe que sur la fresque d’Abraham en face). En vêtement jaune est probablement représentée Agar (le jaune pouvait souligner le statut d’esclave). Il semble qu’elle tienne dans les mains une outre d’eau (<a href="https://bibleox.com/fr/fr-lsg/gen/21/#L14">Gn 21:14</a>). Derrière elle est peut-être représenté son fils Ismaël, qui, au moment de l’expulsion, devait avoir plus de 15 ans (<em>Ismaël naquit quand Abraham avait 86 </em><a href="https://bibleox.com/fr/fr-lsg/gen/16/#L16"><em>Gn 16:16</em></a><em>, Isaac naquit quand Abraham avait 100 ans </em><a href="https://bibleox.com/fr/fr-lsg/gen/21/#L5"><em>Gn 21:5</em></a><em>, et Agar est chassée quand Isaac eut grandi et fut sevré </em><a href="https://bibleox.com/fr/fr-lsg/gen/21/#L8-13"><em>Gn 21:8-13</em></a>). On croit voir une femme en tablier, mais si c’est le cas, ce ne peut être qu’Agar elle-même (une femme non mariée a la tête découverte), et celui qui tient des outres est alors Ismaël. Quoi qu’il en soit, les deux autres personnages sont Agar et Ismaël, version la plus probable. Il se peut aussi que toute cette composition ne soit pas faite de sections séparées, mais forme un tableau unique, puisque la femme avec l’enfant regarde la femme aux mains levées.</p><img src="https://res.bibleox.com/s/img/image/simple/686d33c95f47da2505d3ae5b/s_p_kuEcuyUnGenBuWPw.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d33c95f47da2505d3ae5b/m_p_kuEcuyUnGenBuWPw.jpg">agrandir</a>]</p><p><strong>2. La prière de Sara</strong>. En vêtement rouge et la tête couverte est représentée Sara, qui prie Dieu. La couleur rouge du vêtement indique un haut statut, et la tête couverte, le mariage.</p><img src="https://res.bibleox.com/s/img/image/simple/686d3a855f47da2505d3ae5e/s_p_rpl3jnuNnx8ZisdR.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d3a855f47da2505d3ae5e/m_p_rpl3jnuNnx8ZisdR.jpg">agrandir</a>]</p><p><strong>3. Agar allaite l’enfant</strong>. En faveur de la version avec Agar parle le fait que sa tête est découverte (elle n’est donc pas mariée), ainsi que la forme de ses cheveux, identique à celle du personnage en jaune de la première scène. Son regard caractéristique la trahit aussi : elle regarde Sara, avec qui elle avait des relations tendues. Il est curieux que l’artiste l’ait représentée exactement comme Abraham est assis à gauche : sur une chaise et dans un vêtement tout à fait semblable (rayures verticales, deux bandes sur la manche, manteau).</p><img src="https://res.bibleox.com/s/img/image/simple/686d22a05f47da2505d3ae54/s_p_8fxd9vcRlXYszSJU.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d22a05f47da2505d3ae54/m_p_8fxd9vcRlXYszSJU.jpg">agrandir</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686d33cd5f47da2505d3ae5c/m_p_qKPp740xLZNuDEFs.jpg">version 2</a>]</p><p><strong>L’idée générale de la salle — la délivrance de la mort</strong></p><p>La composition de ce cubiculum a une idée générale et belle — la délivrance de la mort. La scène d’ensemble monte du bas vers le haut, par niveaux :</p><ul><li><p>Le niveau le plus bas — les chrétiens défunts ensevelis, croyant au vainqueur de la mort, le Christ.</p></li><li><p>Le niveau moyen — les scènes bibliques du salut de la mort :</p><ul><li><p>les trois jeunes gens dans la fournaise babylonienne sont sauvés de la mort dans le feu ;</p></li><li><p>le prophète Jonas est sauvé de la mort dans le ventre de l’animal marin ;</p></li><li><p>Isaac est sauvé du sacrifice ; un agneau est offert à sa place ;</p></li><li><p>Agar avec son fils Ismaël est sauvée de la mort dans le désert.</p></li></ul></li><li><p>L’avant-dernier niveau — les symboles chrétiens : le paon (résurrection, immortalité, vie éternelle) et la perdrix (l’âme). Une perdrix se tient près d’une plante vivante (symbole de vie), l’autre près d’une plante desséchée (symbole de mort). Des paons se tiennent là aussi.</p></li><li><p>Le centre du plafond — le Bon Pasteur, qui sauve les fidèles de la mort. Il est remarquable qu’il y ait ici encore une petite allusion au salut de la mort : à gauche et à droite du Pasteur sont assis un corbeau et une colombe avec un rameau d’olivier, que Noé envoyait de l’arche. Ainsi, ceux qui sont sauvés de la mort dans l’arche sont conduits par ces oiseaux vers le sauveur de la mort — le Christ.</p></li></ul><h3>Église de Doura-Europos (Syrie)</h3><p>244. L’église de Doura-Europos contenait, outre des scènes de l’Ancien Testament, des fresques représentant des événements du Nouveau Testament : le sauvetage de l’apôtre Pierre qui se noie et la guérison du paralytique à la piscine de Béthesda. Voir aussi <a href="https://vk.com/@aletheia-de-sacris-imaginibus-venerandis?anchor=v-drugie-svyaschennye-izobrazhenia-v-donikeyskiy-period">l’article</a>.</p><p><strong>Le Christ en Bon Pasteur (vue principale dans le baptistère)</strong></p><img src="https://res.bibleox.com/s/img/image/simple/6931870c205184ec278d6fa2/s_p_uBkNi8jGsMFpOQSM.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931870c205184ec278d6fa2/m_p_uBkNi8jGsMFpOQSM.jpg">agrandir</a>]</p><p><strong>Le sauvetage de l’apôtre Pierre qui se noie</strong></p><img src="https://res.bibleox.com/s/img/image/simple/692c8038205184ec278d6f9e/s_p_QQ2Rml8gUWsyQtS9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c8038205184ec278d6f9e/m_p_QQ2Rml8gUWsyQtS9.jpg">agrandir</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6786b88ddba77200015ae11c/m_p_do380IVDukCAfdFk.jpg">version 2</a>]</p><p><strong>La guérison du paralytique à la piscine de Béthesda</strong></p><img src="https://res.bibleox.com/s/img/image/simple/6786b889dba77200015ae11b/s_p_k1a5GDBvfzTCWmZv.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6786b889dba77200015ae11b/m_p_k1a5GDBvfzTCWmZv.jpg">agrandir</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6786bb0bdba77200015ae11d/m_p_dCRD85foL69l7kih.jpg">autre version</a>]</p><h3>Le Christ en Bon Pasteur, le prophète Jonas</h3><p>Fin du IIIe - début du IVe s. Rome. Catacombes de Pierre et Marcellin.</p><p>Au centre — le Christ en Bon Pasteur. De part et d’autre du centre est représenté Jonas. Sur la fresque de gauche, Jonas est jeté du navire, et à droite il est englouti par la baleine.</p><img src="https://res.bibleox.com/s/img/image/simple/478/s_p_yvJcnbLGPxZ6AzRu.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/478/m_p_yvJcnbLGPxZ6AzRu.jpg">agrandir</a>]</p><p>Le prophète Jonas</p><img src="https://res.bibleox.com/s/img/image/simple/481/s_p_7z5j4tAimokFaRMN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/481/m_p_7z5j4tAimokFaRMN.jpg">agrandir</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/480/s_p_b8gqyOenKZcn2MCp.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/480/m_p_b8gqyOenKZcn2MCp.jpg">agrandir</a>]</p><h3>Le Christ en Bon Pasteur</h3><p>IIIe s. Rome. Catacombes de Calliste (<a href="https://en.wikipedia.org/wiki/Catacomb_of_Callixtus#Paintings">Callixitus Catacomb, Crypt of Lucina</a>). On peut supposer que le pot contient du lait, symbole de l’Eucharistie (voir chez Clément d’Alexandrie).</p><img src="https://res.bibleox.com/s/img/image/simple/474/s_p_zcLmMd2qkyG3pDoj.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/474/m_p_zcLmMd2qkyG3pDoj.jpg">agrandir</a>]</p><h3>Le Bon Pasteur, nécropole de Hisartep, Nicée (İznik)</h3><p>~IIIe siècle. Découverte récente, datation hypothétique (<a href="https://www.arkeolojikhaber.com/haber-iznikte-benzersiz-bir-kesif-anadolunun-tek-coban-isa-figuru-gun-yuzune-cikarildi-43079/">plus de détails</a>). Cette nécropole fut utilisée du IIe au Ve s.</p><p>Coordonnées : 40.78204218462122, 29.928491677648932. Nom du lieu en turc : Hasartep Nekropolü.</p><img src="https://res.bibleox.com/s/img/image/simple/69444e49205184ec278d6fdb/s_p_SZTpvcDdpodujcbM.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69444e49205184ec278d6fdb/m_p_SZTpvcDdpodujcbM.jpg">agrandir</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6941a813205184ec278d6fda/s_p_CUoa7dSy5UxGf1UD.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6941a813205184ec278d6fda/m_p_CUoa7dSy5UxGf1UD.jpg">agrandir</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6941a80f205184ec278d6fd9/m_p_xSCaRt10DUUReyMt.jpg">version 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/693c7d1a205184ec278d6fcb/m_p_mR5ZaVgXbezmXDyo.jpg">version 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/693d606b205184ec278d6fd3/m_p_TKCjvhxmnq0q50tW.jpg">version 4</a>] [<a href="https://res.bibleox.com/s/img/image/simple/693d6101205184ec278d6fd7/m_p_1i6aL6lfDR08iA13.jpg">version 5</a>] [<a href="https://res.bibleox.com/s/img/image/simple/693d60f8205184ec278d6fd6/m_p_b2uUaO6tzciaKAgC.jpg">version 6</a>] [<a href="https://res.bibleox.com/s/img/image/simple/693d60f1205184ec278d6fd5/m_p_bErh7lbI0e08hPaa.jpg">version 7</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/693c7db2205184ec278d6fd2/s_p_wCZsWPWG7jCNLjIr.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/693c7db2205184ec278d6fd2/m_p_wCZsWPWG7jCNLjIr.jpg">agrandir</a>] [<a href="https://res.bibleox.com/s/img/image/simple/693d60ad205184ec278d6fd4/m_p_BCvsIiJX10j2Mf2k.jpg">homme et femme</a>] [<a href="https://res.bibleox.com/s/img/image/simple/693c7daa205184ec278d6fd1/m_p_cjk36Xjpev9EFq2h.jpg">femme</a>]</p><h3>Anneau de mariage (Byzance)</h3><p>IIIe-IVe s. <a href="https://www.metmuseum.org/art/collection/search/663485">Metropolitan Museum of Art, Fifth Avenue, USA</a>. (grec χάρις — grâce)</p><img src="https://res.bibleox.com/s/img/image/simple/68b5da8b45c75323d28a5e99/s_p_GNh1S8L7fcowsMEE.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5da8b45c75323d28a5e99/m_p_GNh1S8L7fcowsMEE.jpg">agrandir</a>]</p><h3>Célébration de l’Eucharistie</h3><p>IIIe s. Rome. Catacombes de Calliste (<a href="https://en.wikipedia.org/wiki/Catacomb_of_Callixtus#Paintings">Callixitus Catacomb, Crypt of Lucina</a>). Est probablement représenté un prêtre concélébrant avec un diacre. C’est ainsi qu’aujourd’hui encore l’Eucharistie est célébrée dans les églises de l’Église orthodoxe : le prêtre élève les deux mains, le diacre montre les saints dons.</p><img src="https://res.bibleox.com/s/img/image/simple/479/s_p_Zbn405P2krjwNAYl.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/479/m_p_Zbn405P2krjwNAYl.jpg">agrandir</a>]</p><h2>IVe siècle</h2><h3>Le Christ (Rome)</h3><p>Catacombes de Commodille.</p><img src="https://res.bibleox.com/s/img/image/simple/66cc2bd6dba77200019bc7d2/s_p_7xYGBb9wCmxBIGrZ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/66cc2bd6dba77200019bc7d2/m_p_7xYGBb9wCmxBIGrZ.jpg">agrandir</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686d23425f47da2505d3ae55/s_p_LzqgbhnIsbqtghoc.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d23425f47da2505d3ae55/m_p_LzqgbhnIsbqtghoc.jpg">agrandir</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a1e1205184ec278d6fa8/m_p_KC0MljXJf5po70pj.jpg">version 2</a>]</p><h3>Le Christ et les apôtres (Rome)</h3><p>~350. [8][9] Mausolée de Santa Costanza.</p><img src="https://res.bibleox.com/s/img/image/simple/686990665f47da2505d3ae19/s_p_5RDr4ou4ExBAh4KE.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686990665f47da2505d3ae19/m_p_5RDr4ou4ExBAh4KE.jpg">agrandir</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686990425f47da2505d3ae17/s_p_CXn5KmuiWradhOvh.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686990425f47da2505d3ae17/m_p_CXn5KmuiWradhOvh.jpg">agrandir</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686990545f47da2505d3ae18/s_p_IkgteAcecXoMC106.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686990545f47da2505d3ae18/m_p_IkgteAcecXoMC106.jpg">agrandir</a>]</p><h3>Baptistère San Giovanni in Fonte (Naples)</h3><p>350-400. [11][12]</p><img src="https://res.bibleox.com/s/img/image/simple/6869924c5f47da2505d3ae1a/s_p_t1iU8sClY3pnOnkK.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6869924c5f47da2505d3ae1a/m_p_t1iU8sClY3pnOnkK.jpg">agrandir</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686992505f47da2505d3ae1b/s_p_BrRKZmtReJbgXm0w.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686992505f47da2505d3ae1b/m_p_BrRKZmtReJbgXm0w.jpg">agrandir</a>]</p><h3>Le Christ et les anges, la Seconde Venue (Thessalonique, Byzance)</h3><p>Fin du IVe s. [17][18]. Rotonde de saint Georges le Victorieux (à l’origine tombeau de l’empereur Galère).</p><img src="https://res.bibleox.com/s/img/image/simple/6931a254205184ec278d6fa9/s_p_bWn7Chqiox5UOEd4.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931a254205184ec278d6fa9/m_p_bWn7Chqiox5UOEd4.jpg">agrandir</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a2ba205184ec278d6faa/m_p_ROPWmBVyUxWMGo9Z.jpg">version 2</a>]</p><p>La mosaïque est mal conservée. De l’image du Christ restent un fragment de nimbe, une main et la croix. Autour, les visages des anges sont bien visibles.</p><img src="https://res.bibleox.com/s/img/image/simple/686a91695f47da2505d3ae1f/s_p_EoOSmhaBPsy32XQQ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686a91695f47da2505d3ae1f/m_p_EoOSmhaBPsy32XQQ.jpg">agrandir</a>]</p><h3>Saints évêques, soldats, médecins (Thessalonique, Byzance)</h3><p>Fin du IVe s. [17][18]. Rotonde de saint Georges le Victorieux (à l’origine tombeau de l’empereur Galère).</p><p>Parmi les mosaïques se trouvent des images de saints évêques, soldats, médecins, musiciens, avec les noms Romanos, Cyrille, Léon, Onésiphore, Eucarpios, Basiliscus, Porphyrios, Philémon, Priscus, Thérinos, Côme et Damien.</p><img src="https://res.bibleox.com/s/img/image/simple/686aa0275f47da2505d3ae21/s_p_oIksDo9rIgSoAXvG.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa0275f47da2505d3ae21/m_p_oIksDo9rIgSoAXvG.jpg">agrandir</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686aa02e5f47da2505d3ae22/s_p_nTZtC6C93KI8Fu6I.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa02e5f47da2505d3ae22/m_p_nTZtC6C93KI8Fu6I.jpg">agrandir</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686aa0335f47da2505d3ae23/s_p_b1KhWllqTzipVhO9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa0335f47da2505d3ae23/m_p_b1KhWllqTzipVhO9.jpg">agrandir</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686aa0385f47da2505d3ae24/s_p_vvlbG9E89B9T0U8j.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa0385f47da2505d3ae24/m_p_vvlbG9E89B9T0U8j.jpg">agrandir</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686aa03f5f47da2505d3ae25/s_p_d3lcRobegfAQOf6e.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa03f5f47da2505d3ae25/m_p_d3lcRobegfAQOf6e.jpg">agrandir</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686aa0555f47da2505d3ae27/s_p_h1YgFpMukwaYc23Q.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa0555f47da2505d3ae27/m_p_h1YgFpMukwaYc23Q.jpg">agrandir</a>]</p><p>Saints Côme et Damien</p><img src="https://res.bibleox.com/s/img/image/simple/686aa04e5f47da2505d3ae26/s_p_LwMjPHLsabDDxEHy.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa04e5f47da2505d3ae26/m_p_LwMjPHLsabDDxEHy.jpg">agrandir</a>]</p><h3>Image du Christ crucifié entre les deux larrons (Rome)</h3><p>Début du IVe siècle. Basilique Sainte-Sabine, l’un des panneaux de la porte. Image en relief de la Crucifixion.</p><img src="https://res.bibleox.com/s/img/image/simple/676183a8dba7720001cd0e2b/s_p_ccaA7HzLPDInwe1b.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/676183a8dba7720001cd0e2b/m_p_ccaA7HzLPDInwe1b.jpg">agrandir</a>]</p><h3>L’Entrée du Seigneur à Jérusalem (Byzance)</h3><p>Début du IVe s. <a href="https://www.metmuseum.org/art/collection/search/466220">Metropolitan Museum of Art, Fifth Avenue, USA</a>. 67,3 × 212,1 × 61,9 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5e69845c75323d28a5e9d/s_p_Kk1dIB2OLr1OjQ1O.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5e69845c75323d28a5e9d/m_p_Kk1dIB2OLr1OjQ1O.jpg">agrandir</a>]</p><h3>Le Christ, plaque (Chersonèse)</h3><p>300-500. <a href="https://collections.louvre.fr/en/ark:/53355/cl010276835">Louvre, France</a>. Le musée affirme que la seconde partie est conservée à l’Ermitage. Y sont gravées les paroles adressées à l’apôtre Pierre.</p><img src="https://res.bibleox.com/s/img/image/simple/68c41cec6594f46d35a87f04/s_p_esWl4etLsBMVz9bw.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c41cec6594f46d35a87f04/m_p_esWl4etLsBMVz9bw.jpg">agrandir</a>]</p><h3>Le Christ enseignant (Rome)</h3><p>Catacombes de Domitille. Peinture de la lunette du cubiculum.</p><img src="https://res.bibleox.com/s/img/image/simple/674ed2a4dba77200011c738a/s_p_4M8Vki7GNJBHkJPN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674ed2a4dba77200011c738a/m_p_4M8Vki7GNJBHkJPN.jpg">agrandir</a>]</p><h3>Le Seigneur Jésus-Christ (Rome)</h3><p>IIIe-Ve s. Catacombes de Generosa [7]</p><img src="https://res.bibleox.com/s/img/image/simple/674f2408dba77200011c739c/s_p_zVliPTIYBpqqnTGQ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f2408dba77200011c739c/m_p_zVliPTIYBpqqnTGQ.jpg">agrandir</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6931a55a205184ec278d6faf/s_p_xXRXPudiFDi6GltL.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931a55a205184ec278d6faf/m_p_xXRXPudiFDi6GltL.jpg">agrandir</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686bf5b25f47da2505d3ae36/m_p_Io7kaT9uNdBPFcSj.jpg">version 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a5b6205184ec278d6fb0/m_p_btFyqkRBFzGf0FSH.jpg">version 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a5e4205184ec278d6fb1/m_p_wuVaj4ghYuk6s5cc.jpg">version 4</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a5fe205184ec278d6fb2/m_p_mO6KaZXywWX76vBg.jpg">version 5</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a656205184ec278d6fb3/m_p_eqLfG1BFyG45i90X.jpg">version 6</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a858205184ec278d6fb5/m_p_EVVCP1plDQZ4XgAS.jpg">version 7</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6931a360205184ec278d6fab/s_p_hObpAcapDVZvLsC1.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931a360205184ec278d6fab/m_p_hObpAcapDVZvLsC1.jpg">agrandir</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6931a369205184ec278d6fad/s_p_8bP3aXtUgkNcP9gz.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931a369205184ec278d6fad/m_p_8bP3aXtUgkNcP9gz.jpg">agrandir</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6931a363205184ec278d6fac/s_p_BcSN3IXA4JYFLpgA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931a363205184ec278d6fac/m_p_BcSN3IXA4JYFLpgA.jpg">agrandir</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6931a36f205184ec278d6fae/s_p_6J6vSMM0TM5tc59T.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931a36f205184ec278d6fae/m_p_6J6vSMM0TM5tc59T.jpg">agrandir</a>]</p><h3>Saints Viatrix et Simplicius (ou Rufus) (Rome)</h3><p>IIIe-Ve s. Catacombes de Generosa [7]</p><img src="https://res.bibleox.com/s/img/image/simple/66cc2c40dba77200019bc7d8/s_p_zABjPHGhPdjGVh3U.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/66cc2c40dba77200019bc7d8/m_p_zABjPHGhPdjGVh3U.jpg">agrandir</a>]</p><h3>Les apôtres Pierre et Paul (Rome)</h3><p>~380. Catacombes de Santa Tecla (sainte Thècle), fresque [24]</p><p>Sont représentés les apôtres : Pierre, Paul, André, Jean.</p><img src="https://res.bibleox.com/s/img/image/simple/686bf38e5f47da2505d3ae35/s_p_BxfiObhkLMfci8nP.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686bf38e5f47da2505d3ae35/m_p_BxfiObhkLMfci8nP.jpg">agrandir</a>] [<a href="https://res.bibleox.com/s/img/image/simple/687291145f47da2505d3ae8b/m_p_WXlkaMJTOrIzlOdI.jpg">version 2</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/68b6cd4802e89ba22dfc3977/s_p_kAWGH2VPHMkRv9cL.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b6cd4802e89ba22dfc3977/m_p_kAWGH2VPHMkRv9cL.jpg">agrandir</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686bf5bf5f47da2505d3ae37/m_p_F0tsoqA9bv6CrpfE.jpg">version 2</a>]</p><h3>Les apôtres Pierre et Paul (Byzance)</h3><p>Milieu du IVe s. Le Christ remet les couronnes des martyrs aux apôtres Pierre et Paul. <a href="https://www.metmuseum.org/art/collection/search/463547">Metropolitan Museum of Art, Fifth Avenue, USA</a>. Rome ou Byzance. 13,8 x 12,5 x 5 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5f5d745c75323d28a5ebc/s_p_MiCffui3hayo2BCt.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5f5d745c75323d28a5ebc/m_p_MiCffui3hayo2BCt.jpg">agrandir</a>]</p><hr><p>Milieu du IVe s. <a href="https://www.metmuseum.org/art/collection/search/468386">Metropolitan Museum of Art, Fifth Avenue, USA</a>. Rome ou Byzance. 8,5 x 14 x 13,3 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5e89c45c75323d28a5ea1/s_p_HAfNPGdEHMp67CuN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5e89c45c75323d28a5ea1/m_p_HAfNPGdEHMp67CuN.jpg">agrandir</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5e88f45c75323d28a5ea0/m_p_gvro4Ry9POJUm0nR.jpg">vue de côté</a>]</p><hr><p>Fin du IVe s. <a href="https://www.metmuseum.org/art/collection/search/463714">Metropolitan Museum of Art, Fifth Avenue, USA</a>. Verre, or battu.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5e68b45c75323d28a5e9c/s_p_uRLyImBPPDsr48G2.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5e68b45c75323d28a5e9c/m_p_uRLyImBPPDsr48G2.jpg">agrandir</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5e76d45c75323d28a5e9e/m_p_62cHpid14wgeSyqc.jpg">version 2</a>]</p><hr><p>Milieu du IVe siècle. Les apôtres Pierre et Paul, Pérégrina. <a href="https://www.metmuseum.org/art/collection/search/465922">Metropolitan Museum of Art, Fifth Avenue, USA</a>. 11,5 x 13,3 x 1,2 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5e7d145c75323d28a5e9f/s_p_atDwcEc3h2ZyYLRb.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5e7d145c75323d28a5e9f/m_p_atDwcEc3h2ZyYLRb.jpg">agrandir</a>]</p><h3>Les apôtres Pierre et Paul (Rome)</h3><p>IVe siècle. Plaque ayant servi à fermer une niche funéraire d’enfant (loculus) dans les catacombes. Rome, Vatican Museums, Pius Christian Museum.</p><img src="https://res.bibleox.com/s/img/image/simple/674f1bc0dba77200011c739a/s_p_uH3btIsNTUn6lHGQ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f1bc0dba77200011c739a/m_p_uH3btIsNTUn6lHGQ.jpg">agrandir</a>]</p><h3>La Mère de Dieu avec l’enfant Christ (Rome)</h3><p>IIIe-IVe s. Catacombes de Domitille.</p><img src="https://res.bibleox.com/s/img/image/simple/66cc2c11dba77200019bc7d5/s_p_rZQc8oqW4YIrUMho.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/66cc2c11dba77200019bc7d5/m_p_rZQc8oqW4YIrUMho.jpg">agrandir</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686d246b5f47da2505d3ae57/m_p_AZTFv8hTAm4Eo9yp.jpg">version 2</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686d24885f47da2505d3ae58/s_p_Z1QqJZuraUn8iLSV.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d24885f47da2505d3ae58/m_p_Z1QqJZuraUn8iLSV.jpg">agrandir</a>]</p><h3>Croix avec l’image du Christ (Byzance)</h3><p>395-641. <a href="https://collections.louvre.fr/en/ark:/53355/cl010043937">Louvre, France</a>. 8,5 x 20 x 1,2 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c5886594f46d35a87ec7/s_p_wU3HuTavyFqHCHIc.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c5886594f46d35a87ec7/m_p_wU3HuTavyFqHCHIc.jpg">agrandir</a>]</p><h3>Icône (Égypte)</h3><p>395-641. <a href="https://collections.louvre.fr/en/ark:/53355/cl010049211">Louvre, France</a>. 24 x 17,5 cm</p><img src="https://res.bibleox.com/s/img/image/simple/68c3bf006594f46d35a87ebf/s_p_m1O6PHgeoR9L2huf.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3bf006594f46d35a87ebf/m_p_m1O6PHgeoR9L2huf.jpg">agrandir</a>]</p><hr><p><a href="https://collections.louvre.fr/en/ark:/53355/cl010049209">Louvre, France</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c8966594f46d35a87ec8/s_p_hfH86ZqQDaRWHKRA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c8966594f46d35a87ec8/m_p_hfH86ZqQDaRWHKRA.jpg">agrandir</a>]</p><h3>Ampoule avec l’icône de saint Ménas (Byzance)</h3><p>395-641. <a href="https://collections.louvre.fr/en/ark:/53355/cl010042774">Louvre, France</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c4176594f46d35a87ec3/s_p_RYRsljTrixb3giuP.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c4176594f46d35a87ec3/m_p_RYRsljTrixb3giuP.jpg">agrandir</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c3c4196594f46d35a87ec4/m_p_20KqaRLqoxUISfqB.jpg">revers</a>]</p><hr><p>395-641. <a href="https://collections.louvre.fr/en/ark:/53355/cl010042778">Louvre, France</a>. De telles ampoules se rencontrent en très grand nombre dans différents musées. Autres exemples : <a href="https://collections.louvre.fr/en/ark:/53355/cl010042780">1</a>, <a href="https://collections.louvre.fr/en/ark:/53355/cl010042798">2</a>, <a href="https://collections.louvre.fr/en/ark:/53355/cl010042802">3</a>, <a href="https://collections.louvre.fr/en/ark:/53355/cl010043779">4</a>, <a href="https://collections.louvre.fr/en/ark:/53355/cl010076645">5</a>, <a href="https://collections.louvre.fr/en/ark:/53355/cl010051239">6</a>, <a href="https://collections.louvre.fr/en/ark:/53355/cl010263188">7</a>, <a href="https://collections.louvre.fr/en/ark:/53355/cl010280896">8</a>, <a href="https://collections.louvre.fr/en/ark:/53355/cl010044285">9</a>, <a href="https://collections.louvre.fr/en/ark:/53355/cl010280846">10</a>, <a href="https://collections.louvre.fr/en/ark:/53355/cl010280894">11</a>, <a href="https://www.clevelandart.org/art/1999.232">12</a>, <a href="https://www.clevelandart.org/art/1999.233">13</a>, <a href="https://www.clevelandart.org/art/1999.231">14</a>, <a href="https://www.clevelandart.org/art/1999.230">15</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c4c66594f46d35a87ec5/s_p_b5etRE60QJjNF7zQ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c4c66594f46d35a87ec5/m_p_b5etRE60QJjNF7zQ.jpg">agrandir</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c4cd6594f46d35a87ec6/s_p_vJbng6ICUUefTimC.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c4cd6594f46d35a87ec6/m_p_vJbng6ICUUefTimC.jpg">agrandir</a>]</p><h3>Ampoule de plomb avec l’image de la Mère de Dieu et du Christ (Italie, Bologne)</h3><p>IVe-Ve s. « De semblables ampoules d’huile sainte provenant des lieux saints étaient apportées en grand nombre par les pèlerins d’Orient, précisément de Palestine, où les pèlerinages s’établirent à partir de la fin du IVe siècle et, dans la première moitié du Ve, en grand nombre » [27]</p><img src="https://res.bibleox.com/s/img/image/simple/686d3bdc5f47da2505d3ae5f/s_p_gcwh26YTfBvz5FbR.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d3bdc5f47da2505d3ae5f/m_p_gcwh26YTfBvz5FbR.jpg">agrandir</a>]</p><h2>Ve siècle</h2><h3>La Mère de Dieu avec l’enfant Jésus, les martyrs Félix et Adaucte, la veuve Commodilla (Rome)</h3><p>Ve-VIe s. Catacombes de Commodille. À gauche, au premier plan, est représentée la veuve Commodilla — une riche Romaine en mémoire de qui fut construit l’oratoire des catacombes.</p><img src="https://res.bibleox.com/s/img/image/simple/674edb84dba77200011c738c/s_p_urBcFMzNnn49NanW.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674edb84dba77200011c738c/m_p_urBcFMzNnn49NanW.jpg">agrandir</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686bf61f5f47da2505d3ae38/m_p_gOZdkzGPGcL4Vws0.jpg">version 2</a>]</p><h3>Le Christ et la Mère de Dieu (Byzance)</h3><p>400-500. Matériau : or. 3,7 x 4 x 0,3 cm ; poids : 4,04 g. <a href="https://collections.louvre.fr/en/ark:/53355/cl010256498">Louvre, France</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c403846594f46d35a87efb/s_p_Ahj64DxPe313azhi.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c403846594f46d35a87efb/m_p_Ahj64DxPe313azhi.jpg">agrandir</a>]</p><h3>Le martyr Laurent (Ravenne)</h3><p>425. Mausolée de Galla Placidia[1][2][25]. Dans le meuble ouvert se trouvent 4 Évangiles : de Marc, de Matthieu, de Luc et de Jean. Le saint, avec une croix et un Évangile ouvert, se dirige vers le gril sous lequel brûle un feu.</p><img src="https://res.bibleox.com/s/img/image/simple/674ee461dba77200011c738e/s_p_EPEyZAtXMtLhz0vO.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674ee461dba77200011c738e/m_p_EPEyZAtXMtLhz0vO.jpg">agrandir</a>]</p><h3>L’apôtre Paul (Éphèse)</h3><p>Fresque de la fin du Ve s. dans la grotte de Paul[4].</p><img src="https://res.bibleox.com/s/img/image/simple/674f2a67dba77200011c73a0/s_p_Og6LudyAS5axVwrH.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f2a67dba77200011c73a0/m_p_Og6LudyAS5axVwrH.jpg">agrandir</a>]</p><h3>L’apôtre Paul (Naples)</h3><p>Fin du Ve s. Catacombes de San Gennaro, fresque. Est probablement représenté l’apôtre Paul.</p><img src="https://res.bibleox.com/s/img/image/simple/674f2705dba77200011c739d/s_p_XdEMnSngRpC4ver8.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f2705dba77200011c739d/m_p_XdEMnSngRpC4ver8.jpg">agrandir</a>]</p><h3>Thècle d’Iconium, martyre (Éphèse)</h3><p>Grotte des saints Paul et Thècle. L’une de celles qui crurent à la prédication de l’apôtre Paul, martyre des premiers siècles. En 2013, la grotte fut profanée par des combattants islamistes[4].</p><img src="https://res.bibleox.com/s/img/image/simple/674f2c2edba77200011c73a1/s_p_tCvOXPpRP5ogjE1Y.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f2c2edba77200011c73a1/m_p_tCvOXPpRP5ogjE1Y.jpg">agrandir</a>]</p><h3>Le grand martyr Démétrius de Thessalonique et un ange (Thessalonique, Byzance)</h3><p>Ve-VIe s. Basilique Saint-Démétrius de Thessalonique. Mosaïque dans la partie occidentale de l’église [10]</p><img src="https://res.bibleox.com/s/img/image/simple/686984705f47da2505d3ae11/s_p_bliIzjPrQcGjWmMT.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686984705f47da2505d3ae11/m_p_bliIzjPrQcGjWmMT.jpg">agrandir</a>]</p><h3>Le grand martyr Démétrius de Thessalonique et un enfant (Thessalonique, Byzance)</h3><p>Ve-VIe s. Basilique Saint-Démétrius de Thessalonique. Mosaïque sur le mur occidental du bas-côté sud [10]</p><img src="https://res.bibleox.com/s/img/image/simple/68697c845f47da2505d3ae10/s_p_T8JYB6OgB0WUM8O6.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68697c845f47da2505d3ae10/m_p_T8JYB6OgB0WUM8O6.jpg">agrandir</a>]</p><h3>Maison du sénateur, Sainte-Pudentienne (Rome)</h3><p>402-417. [13][14]</p><img src="https://res.bibleox.com/s/img/image/simple/6869938e5f47da2505d3ae1c/s_p_l5Dokt3jzLvx6IxN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6869938e5f47da2505d3ae1c/m_p_l5Dokt3jzLvx6IxN.jpg">agrandir</a>]</p><h3>Sainte-Marie-Majeure (Rome)</h3><p>432-440. [15][16]</p><img src="https://res.bibleox.com/s/img/image/simple/6869954e5f47da2505d3ae1d/s_p_0bDTRtbRpWWnfPQR.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6869954e5f47da2505d3ae1d/m_p_0bDTRtbRpWWnfPQR.jpg">agrandir</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686995555f47da2505d3ae1e/s_p_FLcJtADykEgKNDDd.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686995555f47da2505d3ae1e/m_p_FLcJtADykEgKNDDd.jpg">agrandir</a>]</p><h3>Le Christ, les trois jeunes gens, les mages (Italie du Nord)</h3><p>400-450. <a href="https://collections.louvre.fr/en/ark:/53355/cl010256191">Louvre, France</a>. Argent, 6,3 x 12,3 x 7,1 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c1756594f46d35a87ec1/s_p_WzOTF3me39ISTfnN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c1756594f46d35a87ec1/m_p_WzOTF3me39ISTfnN.jpg">agrandir</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c1796594f46d35a87ec2/s_p_a0udZW5EPewQCqsl.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c1796594f46d35a87ec2/m_p_a0udZW5EPewQCqsl.jpg">agrandir</a>]</p><h3>Icône : l’apôtre Pierre dicte l’Évangile à saint Marc (Égypte)</h3><p>440-670. <a href="https://www.metmuseum.org/art/collection/search/477163">Metropolitan Museum of Art, Fifth Avenue, USA</a>. 13,5 x 10 x 0,8 cm. Voir aussi : <a href="https://www.metmuseum.org/art/collection/search/477492">1</a>, <a href="https://www.metmuseum.org/art/collection/search/477487">2</a>, <a href="https://www.metmuseum.org/art/collection/search/477481">3</a>, <a href="https://www.metmuseum.org/art/collection/search/477489">4</a>, <a href="https://www.metmuseum.org/art/collection/search/477491">5</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c1c2f56594f46d35a87e74/s_p_BWhcee0cn10mz7dc.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1c2f56594f46d35a87e74/m_p_BWhcee0cn10mz7dc.jpg">agrandir</a>]</p><h3>Saint inconnu (Byzance, Égypte)</h3><p>Ve-VIe s. <a href="https://www.metmuseum.org/art/collection/search/329982">Metropolitan Museum of Art, Fifth Avenue, USA</a>. 44 × 32,5 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5eb2d45c75323d28a5ea3/s_p_E5UUO66hSfRBtXUn.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5eb2d45c75323d28a5ea3/m_p_E5UUO66hSfRBtXUn.jpg">agrandir</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5eb2845c75323d28a5ea2/m_p_ofbMCUTa1winWDg0.jpg">version 2</a>]</p><h3>Ampoule avec l’image de saint Ménas (Égypte copte)</h3><p>Ve-VIIe s. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/87092?query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=34">Ermitage, Russie</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c0796480b4d285320413/s_p_sW3adkK7lr960dU5.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c0796480b4d285320413/m_p_sW3adkK7lr960dU5.jpg">agrandir</a>]</p><hr><p>Ve-VIe s. Ampoule avec l’image de saint Ménas (Égypte). <a href="https://www.metmuseum.org/art/collection/search/854993">Metropolitan Museum of Art, Fifth Avenue, USA</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5f3f845c75323d28a5eb8/s_p_ePhTgphiYrxHdEaZ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5f3f845c75323d28a5eb8/m_p_ePhTgphiYrxHdEaZ.jpg">agrandir</a>]</p><hr><p>Ve-VIe s. Ampoule avec l’image de saint Ménas (Égypte). <a href="https://www.metmuseum.org/art/collection/search/854994">Metropolitan Museum of Art, Fifth Avenue, USA</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5f40645c75323d28a5eb9/s_p_5HMBehehtBuCUdOm.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5f40645c75323d28a5eb9/m_p_5HMBehehtBuCUdOm.jpg">agrandir</a>]</p><h3>Bague avec l’image du Christ (Égypte, Louxor)</h3><p>Ve-VIIe s. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/111849?page=5&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%B0&amp;index=240">Ermitage, Russie</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c4d46480b4d285320420/s_p_SyuBoqgvHXMA5UIe.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c4d46480b4d285320420/m_p_SyuBoqgvHXMA5UIe.jpg">agrandir</a>]</p><h2>VIe siècle</h2><h3>Le Seigneur Jésus-Christ (Sinaï)</h3><p>VIe siècle. Monastère Sainte-Catherine, Égypte [3].</p><img src="https://res.bibleox.com/s/img/image/simple/686fe7935f47da2505d3ae87/s_p_cikLnQnMeZgiaeXg.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686fe7935f47da2505d3ae87/m_p_cikLnQnMeZgiaeXg.jpg">agrandir</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6872d4935f47da2505d3ae90/m_p_1CbtDgulMkyLj9dK.jpg">version 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6872d4835f47da2505d3ae8d/m_p_IPypUclQUGcqTIJa.jpg">version 3</a>]</p><h3>La Mère de Dieu avec l’enfant Jésus, les saints Théodore et Georges (Sinaï)</h3><p>VIe siècle. Monastère Sainte-Catherine. Icône à l’encaustique, Égypte.</p><img src="https://res.bibleox.com/s/img/image/simple/674ece56dba77200011c7384/s_p_RWNQK8qhzLwXxGkf.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674ece56dba77200011c7384/m_p_RWNQK8qhzLwXxGkf.jpg">agrandir</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6872d4895f47da2505d3ae8e/m_p_6JgREZVUzpO8lC9E.jpg">version 2</a>]</p><h3>L’apôtre Pierre (Sinaï)</h3><p>VIe siècle. Monastère Sainte-Catherine. Icône à l’encaustique, Égypte.</p><img src="https://res.bibleox.com/s/img/image/simple/686fe28f5f47da2505d3ae82/s_p_tWJyRADNEjI9Gt5J.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686fe28f5f47da2505d3ae82/m_p_tWJyRADNEjI9Gt5J.jpg">agrandir</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686fe73d5f47da2505d3ae86/m_p_ztqtzVnOwMfzjCsd.jpg">version 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6872d48f5f47da2505d3ae8f/m_p_x4BAyJ0C1GjHQ7Us.jpg">version 3</a>]</p><h3>La Mère de Dieu et l’Enfant Christ (Byzance)</h3><p>VIe s. <a href="https://www.metmuseum.org/art/collection/search/463392">Metropolitan Museum of Art, Fifth Avenue, USA</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5fce645c75323d28a5ec5/s_p_KB8coyb4H50zurQW.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5fce645c75323d28a5ec5/m_p_KB8coyb4H50zurQW.jpg">agrandir</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5fce945c75323d28a5ec6/m_p_eIaeevwinjFBQAeA.jpg">version 2</a>]</p><h3>Bague avec l’icône de la Mère de Dieu et de l’Enfant Christ (Byzance)</h3><p>VIe-VIIe s. <a href="https://www.metmuseum.org/art/collection/search/464059">Metropolitan Museum of Art, Fifth Avenue, USA</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5fe7745c75323d28a5ec7/s_p_bcCSRfNkRmmk5jZs.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5fe7745c75323d28a5ec7/m_p_bcCSRfNkRmmk5jZs.jpg">agrandir</a>]</p><h3>Sainte Marie</h3><p>611, <a href="https://www.pravenc.ru/text/164537.html">Gerasa</a></p><img src="https://res.bibleox.com/s/img/image/simple/482/s_p_s3flMTpYpn69iMIy.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/482/m_p_s3flMTpYpn69iMIy.jpg">agrandir</a>]</p><h3>Le Christ, médaillon (Antioche)</h3><p>500-625. Matériau : argent, dorure. 14,9 x 14,1 x 1,1 cm. <a href="https://collections.louvre.fr/en/ark:/53355/cl010256496">Louvre, France</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c409da6594f46d35a87f00/s_p_BHIOy3tEZ3ZoMEr5.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c409da6594f46d35a87f00/m_p_BHIOy3tEZ3ZoMEr5.jpg">agrandir</a>]</p><hr><p>500-625. <a href="https://collections.louvre.fr/en/ark:/53355/cl010256495">Louvre, France</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c41f626594f46d35a87f05/s_p_bKgaW542SgyD11o9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c41f626594f46d35a87f05/m_p_bKgaW542SgyD11o9.jpg">agrandir</a>]</p><h3>Tapisserie avec des icônes : le Christ, la Mère de Dieu, les archanges Michel et Gabriel, les apôtres (Égypte, Byzance)</h3><p>500. <a href="https://www.clevelandart.org/art/1967.144">Cleveland Museum of Art, USA</a>. Laine, 178,7 x 110,5 cm.</p><p>Commentaire du musée :</p><blockquote><p>Tissée de fils de laine de plus de vingt couleurs, cette rare tapisserie coûtait en son temps plus cher qu’un tableau. Son prix historique reflétait la reconnaissance par les contemporains du savant mélange de couleurs obtenu par les tisserands. Suspendue à un mur, <strong>cette icône tissée permettait aux fidèles de vénérer la Mère de Dieu et l’Enfant Christ dans les murs d’une église orthodoxe</strong>. Ils sont entourés d’anges et d’apôtres dont les noms sont inscrits en grec. Pour être spirituellement efficace, une icône (une image sacrée) devait suivre le plus exactement possible la tradition iconographique établie de son sujet.</p><p>L’inscription sur le linteau de l’encadrement architectural se traduit du grec par « <strong>Saint Michel, sainte Marie, saint Gabriel</strong> ». La large bordure feuillue est ornée de fruits et de fleurs, et dans sa partie inférieure de médaillons avec les bustes des apôtres, dont les noms sont écrits à côté en grec et se traduisent par « <strong>André, Matthieu, l’apôtre Paul, Luc, Jacques, Philippe, Marc, Thomas, Jean, Matthias, Pierre et Barthélemy</strong> ».</p></blockquote><img src="https://res.bibleox.com/s/img/image/simple/68cb9dd5205184ec278d58d7/s_p_jXuLxO8mwNy5DicO.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68cb9dd5205184ec278d58d7/m_p_jXuLxO8mwNy5DicO.jpg">agrandir</a>]</p><h3>Tapisserie avec des icônes. Les trois jeunes gens ?, chrisme (Égypte, Byzance)</h3><p>Années 500. <a href="https://www.clevelandart.org/art/1982.73">Cleveland Museum of Art, USA</a>. Laine, lin. 110,5 x 76,8 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68cb9dde205184ec278d58d8/s_p_w5vxLEtZSz6mW36r.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68cb9dde205184ec278d58d8/m_p_w5vxLEtZSz6mW36r.jpg">agrandir</a>]</p><h3>Tapisserie avec des icônes. La Mère de Dieu, les mages, le prophète Jonas (Égypte, Byzance)</h3><p>500-550. <a href="https://www.clevelandart.org/art/1951.400">Cleveland Museum of Art, USA</a>. Lin. 99,7 x 104,8 cm.</p><p>Commentaire du musée :</p><blockquote><p>… À gauche du registre supérieur sont représentés <strong>la Vierge Marie avec l’Enfant Christ</strong> sur un tabouret aux pieds en forme de croix. Comme l’indique l’inscription copte, <strong>les trois rois s’approchent par la droite, portant des présents</strong>. Le registre moyen, à gauche, représente probablement <strong>le baptême du Christ</strong>, tandis que trois autres figures, séparées par des colonnes, semblent illustrer le miracle du Nouveau Testament où le Christ rassasia une grande foule avec cinq pains et deux poissons. Dans le registre inférieur est encore reconnaissable <strong>la scène de l’Ancien Testament du prophète Jonas englouti par la baleine</strong>.</p><p>Des inscriptions grecques identifient diverses scènes de l’Ancien et du Nouveau Testament. Au-dessus du premier des mages du registre supérieur, on distingue deux lettres <strong>«XP»</strong> du mot grec désignant l’or (<em>χρυσός - chrysós</em>). À gauche du registre moyen sont représentées deux figures : la première est presque entièrement détruite, la seconde est identifiée par l’inscription <strong>« EIΩANNHC » (Jean)</strong>. Dans le registre inférieur est représenté Jonas rejeté sur le rivage, avec un grand poisson à côté de lui, accompagné de l’inscription <strong>« EIΩNAC » (Jonas)</strong>. Moïse, presque entièrement perdu, ne peut être identifié que par son inscription <strong>« MWCHC » (Moïse)</strong>.</p></blockquote><img src="https://res.bibleox.com/s/img/image/simple/68cb9e0d205184ec278d58d9/s_p_WiTqygXUYCZZY7TF.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68cb9e0d205184ec278d58d9/m_p_WiTqygXUYCZZY7TF.jpg">agrandir</a>]</p><h3>Calices eucharistiques et encensoirs avec des icônes (Byzance, Syrie, Attarouthi)</h3><p>500-650. <a href="https://www.metmuseum.org/art/collection/search/474390">Metropolitan Museum of Art, Fifth Avenue, USA</a>. Argent, dorure. Sur les calices, des icônes du Seigneur et des saints, ainsi que des inscriptions indiquant par qui et à qui ils furent offerts.</p><p>Ces objets liturgiques finement travaillés — calices, encensoirs, passoire et image de la colombe du Saint-Esprit — appartenaient à une église chrétienne de la riche ville marchande d’Attarouthi en Syrie, alors l’une des terres les plus riches de l’Empire byzantin. Les calices, les encensoirs et la passoire servaient à la divine liturgie, ou Eucharistie, sacrement au cours duquel les chrétiens communient au vin et au pain consacrés en mémoire de la Cène et de la mort du Christ.</p><p>D’après leurs inscriptions, rédigées en grec avec quelques variantes orthographiques, beaucoup de ces objets furent offerts par des habitants à l’église principale de la ville, dédiée à saint Étienne, et à une église plus petite dédiée à saint Jean (probablement Jean le Précurseur [le Baptiste]).</p><p>Au début du VIIe siècle, la Syrie tomba d’abord aux mains des Perses sassanides, puis des armées de l’islam. Ces œuvres furent probablement enfouies à la hâte dans un coffre de protection au moment où l’armée byzantine se retirait devant les envahisseurs de la région.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5db2045c75323d28a5e9a/s_p_kx70rC7wWJQtkfdG.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5db2045c75323d28a5e9a/m_p_kx70rC7wWJQtkfdG.jpg">agrandir</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5edf045c75323d28a5ea5/m_p_Eru1rmuua6UWqjTz.jpg">version 2</a>]</p><hr><p>Jean le Précurseur aux longs cheveux, la Mère de Dieu en posture d’orante (les mains levées), un saint en posture d’orante, un saint guerrier avec un bâton et un bouclier, le jeune Christ au nimbe crucifère et un autre saint guerrier en armure terrassant un dragon (saint Georges ?), sous des arcades. <a href="https://www.metmuseum.org/art/collection/search/466137">Metropolitan Museum of Art, Fifth Avenue, USA</a>. 21,3 x 16 cm.</p><p>Inscription en grec : « <strong>Pour son salut, Eudoxie a offert [ceci] en don à saint Étienne du village d’Attar[outhi]</strong> ».</p><img src="https://res.bibleox.com/s/img/image/simple/68b5efa445c75323d28a5eaa/s_p_l5pPSsTDZHSQuvNU.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5efa445c75323d28a5eaa/m_p_l5pPSsTDZHSQuvNU.jpg">agrandir</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f01f45c75323d28a5eab/m_p_456sbKEe3ANd9ZWP.jpg">version 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f02245c75323d28a5eac/m_p_fkJIydq7uEfZbIUt.jpg">version 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f02445c75323d28a5ead/m_p_s25q6Lu5HItPjqDs.jpg">version 4</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f02745c75323d28a5eae/m_p_QJsAgl2zRfYmpNDL.jpg">version 5</a>]</p><hr><p>Calice eucharistique avec l’icône de saint Jean le Précurseur, d’un saint diacre (probablement Étienne), de saints évêques et de croix. <a href="https://www.metmuseum.org/art/collection/search/466130">Metropolitan Museum of Art, Fifth Avenue, USA</a>. 20,5 × 15,1 cm, 369 g, 1100 ml</p><p>Inscription en grec : « <strong>À saint Jean du village d’Attarouthi</strong> ».</p><img src="https://res.bibleox.com/s/img/image/simple/68b5ec4545c75323d28a5ea4/s_p_KWMPzINWo4ktBKQ7.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5ec4545c75323d28a5ea4/m_p_KWMPzINWo4ktBKQ7.jpg">agrandir</a>]</p><hr><p>Calice eucharistique avec l’icône du Christ, de la Mère de Dieu, de Jean le Précurseur et de Georges le Victorieux. <a href="https://www.metmuseum.org/art/collection/search/466129">Metropolitan Museum of Art, Fifth Avenue, USA</a>. 24,3 x 16,8 cm.</p><p>Inscription en grec : « <strong>Saint Étienne du village d’Attarouthi</strong> ».</p><img src="https://res.bibleox.com/s/img/image/simple/68b5ee1345c75323d28a5ea6/s_p_9bHxlNSj26b5EhMw.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5ee1345c75323d28a5ea6/m_p_9bHxlNSj26b5EhMw.jpg">agrandir</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5ee3c45c75323d28a5ea7/m_p_8XweLe1b1pD7GWHb.jpg">version 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5ee4045c75323d28a5ea8/m_p_faMKsJUImltU9s6v.jpg">version 3</a>]</p><hr><p>Calice eucharistique avec l’image du jeune Christ au nimbe crucifère, d’un saint diacre avec un encensoir (probablement saint Étienne), de la Vierge Marie en prière et d’un jeune saint avec un bâton. Dimensions : 23,9 × 17 cm, 356 g. <a href="https://www.metmuseum.org/art/collection/search/466141">Metropolitan Museum of Art, Fifth Avenue, USA.</a></p><p>Inscription en grec : « <strong>En accomplissement d’un vœu et pour le salut de celui dont le Seigneur connaît le nom</strong> ».</p><img src="https://res.bibleox.com/s/img/image/simple/68b5fa7a45c75323d28a5ebe/s_p_7AzZiy4FebkdJC4e.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5fa7a45c75323d28a5ebe/m_p_7AzZiy4FebkdJC4e.jpg">agrandir</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5fa8345c75323d28a5ebf/m_p_LQnRTCSFvxz7O7ui.jpg">version 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5fa8645c75323d28a5ec0/m_p_KvY9o90gFdzJeK9N.jpg">version 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5fa8945c75323d28a5ec1/m_p_BUzuFJ6F1fLtMppI.jpg">version 4</a>]</p><hr><p>Encensoir avec l’image du jeune Christ au nimbe crucifère, de saint Jean le Précurseur, de la Vierge Marie en prière, d’un saint diacre (probablement saint Étienne) et de croix. Argent et argent doré avec doublure de cuivre. Dimensions : 41,5 x 13,2 x 12,6 cm. <a href="https://www.metmuseum.org/art/collection/search/466132">Metropolitan Museum of Art, Fifth Avenue, USA</a>.</p><p>Inscription en grec : « <strong>Pour le repos de l’âme d’Erta et d’Étienne, enfants de Kyriakos</strong>»</p><img src="https://res.bibleox.com/s/img/image/simple/68b5f15545c75323d28a5eaf/s_p_OJ2d0ec3h6BtKZQM.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5f15545c75323d28a5eaf/m_p_OJ2d0ec3h6BtKZQM.jpg">agrandir</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f15845c75323d28a5eb0/m_p_MLajjsEoJyZ7xPC7.jpg">version 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f15c45c75323d28a5eb1/m_p_5k22minZ9Q7EruSj.jpg">version 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f15e45c75323d28a5eb2/m_p_3cDRqzOwNAJr7A0S.jpg">version 4</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f16145c75323d28a5eb3/m_p_8vKQQvQJKE8Mbtoc.jpg">version 5</a>]</p><hr><p>Encensoir avec l’image du jeune Christ au nimbe crucifère, de deux archanges et de croix. 8,2 x 13,2 cm. <a href="https://www.metmuseum.org/art/collection/search/466131">Metropolitan Museum of Art, Fifth Avenue, USA</a>.</p><p>Inscription en grec : « <strong>À saint Jean du village d’Attarouthi</strong> ».</p><img src="https://res.bibleox.com/s/img/image/simple/68b5f27545c75323d28a5eb4/s_p_brjJXh3ZIrplms0E.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5f27545c75323d28a5eb4/m_p_brjJXh3ZIrplms0E.jpg">agrandir</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f28545c75323d28a5eb5/m_p_oWtx1CexyxQIAxRK.jpg">version 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f28845c75323d28a5eb6/m_p_zqvxcBdCxjLqltWh.jpg">version 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f28c45c75323d28a5eb7/m_p_fIVExsqDAbrZLhWW.jpg">version 4</a>]</p><h3>Calices eucharistiques avec les images du Christ et des saints, patène avec une croix (Syrie, Byzance)</h3><p>500-700. Cleveland Museum of Art, USA : <a href="https://www.clevelandart.org/art/1950.378">1</a>, <a href="https://www.clevelandart.org/art/1950.379">2</a>, <a href="https://www.clevelandart.org/art/1950.380">3</a>, <a href="https://www.clevelandart.org/art/1950.381">4</a>.</p><p>Ces quatre vases liturgiques en argent — une patène et trois calices (inv. 1950.378–81) — forment ce qu’on appelle aujourd’hui le « trésor de Beth-Misona », du nom du village du nord de la Syrie pour lequel ils furent fabriqués.</p><p>Bien que le lieu et les circonstances exactes de la découverte soient inconnus, les habitants de Beth-Misona, comme d’autres communautés chrétiennes de Syrie et de Palestine, furent probablement contraints d’enfouir l’argenterie de l’église pour la cacher aux Perses ou aux Arabes qui conquirent leurs terres dans la première moitié du VIIe siècle.</p><p>La patène, sur laquelle reposaient les parcelles eucharistiques pendant la liturgie, est ornée d’une croix latine gravée entourée d’une inscription dédicatoire. Elle nomme le donateur de la patène, Domnus, et son emplacement d’origine, l’église Saint-Serge de Beth-Misona.</p><p>Les calices ont de larges coupes ornées de bustes du Christ, de la Mère de Dieu et des apôtres Pierre et Paul. L’un des calices porte une inscription dédicatoire avec le nom du donateur, Kyriakos fils de Domnus, et celui du prêtre de l’église qui reçut ce pieux présent, Zénon.</p><p>Inscription en grec : « <strong>+ Le prêtre KYRIAKOS, fils de DOMNUS, (a offert ce calice) à saint Serge au temps du prêtre Zénon</strong>»</p><img src="https://res.bibleox.com/s/img/image/simple/68caa03c205184ec278d5880/s_p_SB8idWRkPX7keKkU.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68caa03c205184ec278d5880/m_p_SB8idWRkPX7keKkU.jpg">Le Christ</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68caa026205184ec278d587d/m_p_sYIDwGwUI9iMAzzD.jpg">La Mère de Dieu</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68caa029205184ec278d587e/m_p_xYnPNjrcxGm5mJgl.jpg">Apôtre</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68caa02c205184ec278d587f/m_p_kH9idfsikXyvAVvy.jpg">Apôtre</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68caa0d4205184ec278d5881/m_p_vWERSBBMAoytSNnX.jpg">vue de dessus</a>]</p><hr><img src="https://res.bibleox.com/s/img/image/simple/68ca9cd5205184ec278d5874/s_p_tH0J7uqAriM7uaeK.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68ca9cd5205184ec278d5874/m_p_tH0J7uqAriM7uaeK.jpg">Le Christ</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68ca9d13205184ec278d5878/m_p_tYRbn15h6MPNUilS.jpg">La Mère de Dieu</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68ca9ce8205184ec278d5875/m_p_FKfoi68UXlWCS5ky.jpg">Apôtre</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68ca9ceb205184ec278d5876/m_p_Zp9CJ61HnBcr8Csr.jpg">Apôtre</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68ca9cee205184ec278d5877/m_p_w2JDvDj5c4pMVcfk.jpg">vue de dessus</a>]</p><hr><img src="https://res.bibleox.com/s/img/image/simple/68ca9e94205184ec278d5879/s_p_27LzQUQDD3A7nI9X.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68ca9e94205184ec278d5879/m_p_27LzQUQDD3A7nI9X.jpg">Le Christ</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68ca9e98205184ec278d587a/m_p_R47Eqr4GrHijUSIb.jpg">La Mère de Dieu</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68ca9e9b205184ec278d587b/m_p_31NEBZQIYBEqOut0.jpg">Apôtre</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68ca9e9e205184ec278d587c/m_p_QxtJHMZORGGwFxYQ.jpg">Apôtre</a>]</p><hr><p>Vers 500. Patène. <a href="https://www.clevelandart.org/art/1950.381">Cleveland Museum of Art, USA</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68ca964d205184ec278d5873/s_p_wNDEaPHmGHiuWeZy.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68ca964d205184ec278d5873/m_p_wNDEaPHmGHiuWeZy.jpg">agrandir</a>]</p><h3>Encensoir. Le baptême et la crucifixion du Seigneur Jésus-Christ (Byzance)</h3><p>500-899. Dimensions : 13,4 x 9 cm. <a href="https://collections.louvre.fr/en/ark:/53355/cl010042067">Louvre, France</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c4068e6594f46d35a87efe/s_p_3kaCIWMTmQfT4NFG.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c4068e6594f46d35a87efe/m_p_3kaCIWMTmQfT4NFG.jpg">agrandir</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/68c4061f6594f46d35a87efc/s_p_XNlsrfQ2MOphupt9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c4061f6594f46d35a87efc/m_p_XNlsrfQ2MOphupt9.jpg">agrandir</a>]</p><h3>Vase. Le Christ, la Mère de Dieu, Jean le Baptiste, les apôtres, les anges (Constantinople)</h3><img src="https://res.bibleox.com/s/img/image/simple/68c420e46594f46d35a87f06/s_p_iADN1OW5uYg5Wovc.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c420e46594f46d35a87f06/m_p_iADN1OW5uYg5Wovc.jpg">agrandir</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c420e76594f46d35a87f07/m_p_oAs6ecjPj32iGMce.jpg">revers</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c421216594f46d35a87f0f/m_p_x6q5apwWB0DZirK2.jpg">Le Christ</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c420fc6594f46d35a87f0b/m_p_sL17qrWgxkRCNRBb.jpg">La Mère de Dieu</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c420ea6594f46d35a87f08/m_p_Cb0UJi1oxoKCQaXw.jpg">Jean le Baptiste</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c421016594f46d35a87f0c/m_p_a9Y1fyPNxcQ4oNbq.jpg">ange</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c420f66594f46d35a87f0a/m_p_nAqhqDbP5x8fRAnj.jpg">ange</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c420ef6594f46d35a87f09/m_p_F9R3iyZ8go0PxARb.jpg">apôtre</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c4210a6594f46d35a87f0e/m_p_97cyzUvq95UJZOrR.jpg">apôtre</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c421056594f46d35a87f0d/m_p_WfK6SdjAqAOW9fDK.jpg">apôtre</a>]</p><h3>Croix pectorale avec une icône (Byzance)</h3><p>VIe s.<strong> </strong>Or, pâte de verre, cristal de roche, verre ; estampage, granulation. Longueur de la chaîne : 33 cm ; croix : 4,9 x 3,8 cm. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/227027?page=46&amp;query=%D0%BA%D1%80%D0%B5%D1%81%D1%82&amp;sort=112&amp;index=2288">Ermitage, Russie</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c11e3c6594f46d35a87e2c/s_p_9GZmzTSaUVuXXaX1.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c11e3c6594f46d35a87e2c/m_p_9GZmzTSaUVuXXaX1.jpg">agrandir</a>]</p><h3>Pendentif. La Crucifixion du Christ (Égypte)</h3><p>500-700. Dimensions : 3,3 x 1,9 cm. <a href="https://collections.louvre.fr/en/ark:/53355/cl010102800">Louvre, France</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c41c4e6594f46d35a87f03/s_p_tiaBwT9vqOXIlsIw.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c41c4e6594f46d35a87f03/m_p_tiaBwT9vqOXIlsIw.jpg">agrandir</a>]</p><h3>Icône de deux saints (Byzance)</h3><p>VIe s. ; 25,5 x 22 x 1,3 cm. Peut-être les évangélistes Matthieu et Jean. <a href="https://www.metmuseum.org/art/collection/search/468198">Metropolitan Museum of Art, Fifth Avenue, USA</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5fc1545c75323d28a5ec3/s_p_a2FJmSgsGJRdELBq.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5fc1545c75323d28a5ec3/m_p_a2FJmSgsGJRdELBq.jpg">agrandir</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5fc1945c75323d28a5ec4/m_p_pcvRiRfRgBcuHJEA.jpg">version 2</a>]</p><h3>Icônes des apôtres Pierre et Paul (Antioche)</h3><p>550-600. L’apôtre Pierre. <a href="https://www.metmuseum.org/art/collection/search/468348">Metropolitan Museum of Art, Fifth Avenue, USA</a>. Argent. 38,1 x 55,9 x 2,2 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68c1bfd36594f46d35a87e6f/s_p_WguE3h0pnnzXQXwt.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1bfd36594f46d35a87e6f/m_p_WguE3h0pnnzXQXwt.jpg">agrandir</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c1bfd56594f46d35a87e70/m_p_83EvKNt1mFSPspQw.jpg">encore plus grand</a>]</p><p>550-600. L’apôtre Paul. <a href="https://www.metmuseum.org/art/collection/search/468347">Metropolitan Museum of Art, Fifth Avenue, USA</a>. Argent. 38,1 x 55,9 x 2,2 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68c1bfda6594f46d35a87e71/s_p_5Y11faCyEzohnydQ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1bfda6594f46d35a87e71/m_p_5Y11faCyEzohnydQ.jpg">agrandir</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c1bfdd6594f46d35a87e72/m_p_jGCYAnYdrt4tlXhd.jpg">encore plus grand</a>]</p><h3>Icône (Syrie ?, Byzance)</h3><p>Années 500. <a href="https://www.clevelandart.org/art/1941.57">Cleveland Museum of Art, USA</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68caa8cd205184ec278d5883/s_p_qr7HPRgCtcCRwsvb.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68caa8cd205184ec278d5883/m_p_qr7HPRgCtcCRwsvb.jpg">agrandir</a>]</p><h3>Image d’un saint guerrier (Égypte copte)</h3><p>VIe-VIIe s. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/180444?page=6&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=253">Ermitage, Russie</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c3c06480b4d28532041c/s_p_Rnquar8nZacdzqcP.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c3c06480b4d28532041c/m_p_Rnquar8nZacdzqcP.jpg">agrandir</a>]</p><h3>Ampoule avec l’icône de l’apôtre Paul (?) et de sainte Thècle (Égypte)</h3><p>500-700. <a href="https://collections.louvre.fr/en/ark:/53355/cl010280955">Louvre, France</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c4390d6594f46d35a87f15/s_p_Zxs1yv3Jg8oKfFHW.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c4390d6594f46d35a87f15/m_p_Zxs1yv3Jg8oKfFHW.jpg">agrandir</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/68c4390a6594f46d35a87f14/s_p_CPdXMrLBUE0satoH.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c4390a6594f46d35a87f14/m_p_CPdXMrLBUE0satoH.jpg">agrandir</a>]</p><h3>Ampoule avec l’icône de l’apôtre André (Smyrne)</h3><p>500-600. <a href="https://collections.louvre.fr/en/ark:/53355/cl010281050">Louvre, France</a>. 7 x 5 x 2,8 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68c437966594f46d35a87f13/s_p_dCGVNUwg3KWvs9zz.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c437966594f46d35a87f13/m_p_dCGVNUwg3KWvs9zz.jpg">agrandir</a>]</p><h3>Ampoules avec l’icône de saint Ménas</h3><p>610-650. Ampoule avec l’image de saint Ménas (Égypte). <a href="https://www.metmuseum.org/art/collection/search/475416">Metropolitan Museum of Art, Fifth Avenue, USA</a>. 8,5 x 6,9 x 1,8 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68c1c1396594f46d35a87e73/s_p_KIdJIYWMysre63rP.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1c1396594f46d35a87e73/m_p_KIdJIYWMysre63rP.jpg">agrandir</a>]</p><hr><p>500-750. <a href="https://collections.louvre.fr/en/ark:/53355/cl010044285">Louvre, France</a>. 13 x 10,6 x 3,4 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68c3bc556594f46d35a87ebd/s_p_iHBRxhobWKvQb2Dx.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3bc556594f46d35a87ebd/m_p_iHBRxhobWKvQb2Dx.jpg">agrandir</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/68c3bc5c6594f46d35a87ebe/s_p_fQ8Ps5eHBD1myJaS.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3bc5c6594f46d35a87ebe/m_p_fQ8Ps5eHBD1myJaS.jpg">agrandir</a>]</p><h3>Le Christ (Ravenne)</h3><p>Église Sant’Apollinare in Classe, Ravenne, Italie.</p><img src="https://res.bibleox.com/s/img/image/simple/675005d5dba77200011c73ad/s_p_rjjDEzNckea3oHk2.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/675005d5dba77200011c73ad/m_p_rjjDEzNckea3oHk2.jpg">agrandir</a>]</p><h3>Le Christ et les apôtres (Ravenne)</h3><p>Mosaïque du presbyterium. Église San Vitale, Ravenne, Italie.</p><img src="https://res.bibleox.com/s/img/image/simple/675005dadba77200011c73ae/s_p_Nac2nrVo791COrcO.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/675005dadba77200011c73ae/m_p_Nac2nrVo791COrcO.jpg">agrandir</a>]</p><h3>Le Christ, les anges et saint Vital (Ravenne)</h3><p>VIe s. Basilique Saint-Vital de Milan, Ravenne.</p><img src="https://res.bibleox.com/s/img/image/simple/674f0ab3dba77200011c738f/s_p_AsShtty0gMBFOX5X.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f0ab3dba77200011c738f/m_p_AsShtty0gMBFOX5X.jpg">agrandir</a>]</p><h3>L’empereur Justinien, pieux (Ravenne)</h3><p>VIe s. Basilique Saint-Vital de Milan, Ravenne.</p><img src="https://res.bibleox.com/s/img/image/simple/674f0ab8dba77200011c7390/s_p_MsUwTeWDMk0uEVPq.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f0ab8dba77200011c7390/m_p_MsUwTeWDMk0uEVPq.jpg">agrandir</a>]</p><h3>L’impératrice Théodora, pieuse (Ravenne)</h3><p>VIe s. Basilique Saint-Vital de Milan, Ravenne.</p><img src="https://res.bibleox.com/s/img/image/simple/674f0ac0dba77200011c7391/s_p_6g0s1g1btiJBEXSR.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f0ac0dba77200011c7391/m_p_6g0s1g1btiJBEXSR.jpg">agrandir</a>]</p><h3>Le patriarche Abraham (Ravenne)</h3><p>VIe s. Basilique Saint-Vital de Milan, Ravenne.</p><img src="https://res.bibleox.com/s/img/image/simple/674f0ad6dba77200011c7393/s_p_zgb5TLR1yafutIu4.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f0ad6dba77200011c7393/m_p_zgb5TLR1yafutIu4.jpg">agrandir</a>]</p><h3>Abel et Melchisédek (Ravenne)</h3><p>VIe s. Basilique Saint-Vital de Milan, Ravenne.</p><img src="https://res.bibleox.com/s/img/image/simple/674f0adbdba77200011c7394/s_p_PiL9TaItwhR28eXN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f0adbdba77200011c7394/m_p_PiL9TaItwhR28eXN.jpg">agrandir</a>]</p><h3>Marcellin, Pollion, Pierre, saints (Rome)</h3><p>VIe s. Catacombes de Pontien. Fresque.</p><img src="https://res.bibleox.com/s/img/image/simple/66cc2c4adba77200019bc7d9/s_p_th5E9srmqGjUT72T.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/66cc2c4adba77200019bc7d9/m_p_th5E9srmqGjUT72T.jpg">agrandir</a>]</p><h3>Le Christ venant sur les nuées, les apôtres et les saints Côme et Damien (Rome)</h3><p>VIe siècle (530). Basilique des Saints-Côme-et-Damien. [19][20]</p><img src="https://res.bibleox.com/s/img/image/simple/686aa5b35f47da2505d3ae28/s_p_V2YyLyiR7wCHgIfW.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa5b35f47da2505d3ae28/m_p_V2YyLyiR7wCHgIfW.jpg">agrandir</a>]</p><p>L’apôtre Pierre et saint Côme (plus loin encore saint Théodore)</p><img src="https://res.bibleox.com/s/img/image/simple/686aa5d25f47da2505d3ae29/s_p_s66jgQ3tkVAmQEZE.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa5d25f47da2505d3ae29/m_p_s66jgQ3tkVAmQEZE.jpg">agrandir</a>]</p><p>L’apôtre Paul et saint Damien (plus loin le pape Félix)</p><img src="https://res.bibleox.com/s/img/image/simple/686aa7505f47da2505d3ae2c/s_p_WA1eP9P7BNe0aPQ6.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa7505f47da2505d3ae2c/m_p_WA1eP9P7BNe0aPQ6.jpg">agrandir</a>]</p><p>Un saint ange</p><img src="https://res.bibleox.com/s/img/image/simple/686aa61c5f47da2505d3ae2a/s_p_MD4QowA5HKQRhFFG.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa61c5f47da2505d3ae2a/m_p_MD4QowA5HKQRhFFG.jpg">agrandir</a>]</p><h3>Le Christ et les apôtres (Rome)</h3><p>VIe siècle (578-590). Basilique Saint-Laurent-hors-les-Murs (San Lorenzo fuori le Mura) [21][22]</p><p>Près de l’apôtre Paul, les saints Étienne et Hippolyte. Près de l’apôtre Pierre, saint Laurent.</p><img src="https://res.bibleox.com/s/img/image/simple/686aabc85f47da2505d3ae2e/s_p_xa4IU82mZb80Uija.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aabc85f47da2505d3ae2e/m_p_xa4IU82mZb80Uija.jpg">agrandir</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686aab945f47da2505d3ae2d/s_p_21M69l0ODfpN75oh.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aab945f47da2505d3ae2d/m_p_21M69l0ODfpN75oh.jpg">agrandir</a>]</p><h3>Les apôtres Pierre et Paul (Francs)</h3><p>VIe-VIIIe. <a href="https://www.metmuseum.org/art/collection/search/464497">Metropolitan Museum of Art, Fifth Avenue, USA</a> (aussi <a href="https://www.metmuseum.org/art/collection/search/464496">ici</a>). Ivoire. 29,2 x 11,4 x 0,5 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5ff8145c75323d28a5ec8/s_p_WhZZPyHo1I7oF79K.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5ff8145c75323d28a5ec8/m_p_WhZZPyHo1I7oF79K.jpg">agrandir</a>]</p><h3>Saints (Byzance, Égypte)</h3><p>VIe-VIIe s. <a href="https://www.metmuseum.org/art/collection/search/854019">Metropolitan Museum of Art, Fifth Avenue, USA</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68b6007445c75323d28a5ec9/s_p_DNQuRcpcjfkINQ1r.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b6007445c75323d28a5ec9/m_p_DNQuRcpcjfkINQ1r.jpg">agrandir</a>]</p><h3>Saint Phocas (Byzance, Chersonèse)</h3><p>VIe siècle. Moule à eulogies avec l’image en relief de saint <a href="https://azbyka.ru/days/sv-foka-sinopskij">Pho<strong>́</strong>cas de Sinope</a>, debout dans une barque. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/373084?page=2&amp;fundcoll=1420520446&amp;index=75">Ermitage, Russie</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863bee26480b4d285320410/s_p_s0nPEGgpeMtakrof.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863bee26480b4d285320410/m_p_s0nPEGgpeMtakrof.jpg">agrandir</a>]</p><h3>Ampoule avec deux images de saints (Asie Mineure, Éphèse)</h3><p>VIe s. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/228313?page=44&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=2166">Ermitage, Russie</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c0e76480b4d285320414/s_p_KnTGMdyOhsmTAD0S.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c0e76480b4d285320414/m_p_KnTGMdyOhsmTAD0S.jpg">agrandir</a>]</p><h3>Ampoule avec les images d’un évangéliste et d’un saint : Jean le Théologien et Prochore (Éphèse)</h3><p>VIe s. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/228314?page=33&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=1646">Ermitage, Russie</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c1726480b4d285320415/s_p_oBnXQZmCz1EntIFw.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c1726480b4d285320415/m_p_oBnXQZmCz1EntIFw.jpg">agrandir</a>]</p><h3>Molybdobule avec l’image des saints Pierre et Paul et une inscription latine (Byzance)</h3><p>VIe-VIIe s. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/131338?page=33&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=1639">Ermitage, Russie</a>. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/161973?page=33&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=1640">Un autre exemplaire</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c19d6480b4d285320416/s_p_JKBi7CXiDOutHIFn.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c19d6480b4d285320416/m_p_JKBi7CXiDOutHIFn.jpg">agrandir</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6863c22c6480b4d285320417/s_p_FmbNOmLfDrj3qYOz.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c22c6480b4d285320417/m_p_FmbNOmLfDrj3qYOz.jpg">agrandir</a>]</p><h3>Molybdobule avec l’image du Christ (Byzance)</h3><p>VIe-VIIe s. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/117792?page=6&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%B0&amp;index=269">Ermitage, Russie</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c4a86480b4d28532041f/s_p_Uy0EgcXKfuHnv9bX.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c4a86480b4d28532041f/m_p_Uy0EgcXKfuHnv9bX.jpg">agrandir</a>]</p><h3>Molybdobule avec l’image du Christ et un monogramme (Byzance)</h3><p>VIe-VIIe s. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/117804?page=3&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%B0&amp;index=143">Ermitage, Russie</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c5a16480b4d285320422/s_p_JNdWhUPj9cA9Dvoq.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c5a16480b4d285320422/m_p_JNdWhUPj9cA9Dvoq.jpg">agrandir</a>]</p><h2>VIIe siècle</h2><h3>Icône du Christ sur une bague de fiançailles (Byzance)</h3><p>600-700. Inscriptions grecques sur la bague : <strong>ΟΜΟΝΟΙΑ</strong> — concorde ; <strong>ΕΙΡΙΝΗΝ ΤΗΝ ΕΜΙΝ ΔΙΔΟΜ</strong> — « je vous donne ma paix » (<a href="https://bibleox.com/fr/fr-lsg/in/14/#L27">Jn 14:27</a>). <a href="https://collections.louvre.fr/en/ark:/53355/cl010102797">Louvre, France</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c402726594f46d35a87ef8/s_p_6nMwdRXMjOnhQWfu.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c402726594f46d35a87ef8/m_p_6nMwdRXMjOnhQWfu.jpg">agrandir</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c4027c6594f46d35a87ef9/m_p_pNTvaGVW4AmLG2BK.jpg">version 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c4027e6594f46d35a87efa/m_p_mvU9wZQKEIl0lFZY.jpg">version 3</a>]</p><h3>Ampoule avec une icône. Le Christ, la Crucifixion et l’Ascension (Palestine, Byzance)</h3><p>Début des années 600. <a href="https://www.clevelandart.org/art/1999.46">Cleveland Museum of Art, USA</a>. Alliage étain-plomb avec éléments de cuir.</p><img src="https://res.bibleox.com/s/img/image/simple/68caa8cf205184ec278d5884/s_p_QfQLEBTpKbF2IfJo.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68caa8cf205184ec278d5884/m_p_QfQLEBTpKbF2IfJo.jpg">agrandir</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68caaaaf205184ec278d5887/m_p_YFRVXxytSNharyj8.jpg">version 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68caaab2205184ec278d5888/m_p_GguW2EcCVatptKzX.jpg">version 3</a>]</p><h3>La Mère de Dieu et le grand martyr Théodore Stratélate (Thessalonique, Byzance)</h3><p>VIIe–Xe s. (?) Basilique Saint-Démétrius de Thessalonique. Mosaïque sur la face sud du pilier nord.</p><img src="https://res.bibleox.com/s/img/image/simple/686985345f47da2505d3ae12/s_p_HWoRkey7yaGM1D4s.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686985345f47da2505d3ae12/m_p_HWoRkey7yaGM1D4s.jpg">agrandir</a>]</p><h3>Le grand martyr Démétrius et les fondateurs : un archevêque et un préfet (Thessalonique, Byzance)</h3><p>VIIe s. Basilique Saint-Démétrius de Thessalonique. Mosaïque.</p><img src="https://res.bibleox.com/s/img/image/simple/686986dc5f47da2505d3ae13/s_p_ZMXi7hFVOfpu7jbC.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686986dc5f47da2505d3ae13/m_p_ZMXi7hFVOfpu7jbC.jpg">agrandir</a>]</p><h3>Saint Georges et des enfants (Thessalonique, Byzance)</h3><p>VIIe s. Basilique Saint-Démétrius de Thessalonique. La mosaïque se trouve dans la partie occidentale du sanctuaire.</p><img src="https://res.bibleox.com/s/img/image/simple/686987645f47da2505d3ae14/s_p_boH6uu2omR2Gjxxx.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686987645f47da2505d3ae14/m_p_boH6uu2omR2Gjxxx.jpg">agrandir</a>]</p><h3>Saint Serge (Thessalonique, Byzance)</h3><p>VIIe s. Basilique Saint-Démétrius de Thessalonique. Mosaïque du pilier du sanctuaire.</p><img src="https://res.bibleox.com/s/img/image/simple/686989925f47da2505d3ae15/s_p_Faf5BLFz9WISBGej.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686989925f47da2505d3ae15/m_p_Faf5BLFz9WISBGej.jpg">agrandir</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a742205184ec278d6fb4/m_p_YV1I98bvx4Nn6cUn.jpg">version 2</a>]</p><h3>Icône du saint prophète David (Constantinople, Byzance)</h3><p>629-630. <a href="https://www.metmuseum.org/art/collection/search/464380">Metropolitan Museum of Art, Fifth Avenue, USA</a>. Argent. 26,6 x 4 cm, 1397 g. Voir aussi : <a href="https://www.metmuseum.org/art/collection/search/464378">1</a>, <a href="https://www.metmuseum.org/art/collection/search/464375">2</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c1c3426594f46d35a87e75/s_p_5U20dlUc30xkfJeN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1c3426594f46d35a87e75/m_p_5U20dlUc30xkfJeN.jpg">agrandir</a>]</p><h3>Molybdobule avec l’image d’un saint et une inscription (Byzance)</h3><p>VIIe s. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/270001?page=17&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=840">Ermitage, Russie</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c2966480b4d285320419/s_p_EY1IyPYdMzjgztlB.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c2966480b4d285320419/m_p_EY1IyPYdMzjgztlB.jpg">agrandir</a>]</p><h3>Molybdobule avec un buste du Christ et un monogramme (Byzance)</h3><p>VIIe s. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/231980?page=2&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%B0&amp;index=96">Ermitage, Russie</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c6076480b4d285320423/s_p_YFjOrZh2fLGJgpYJ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c6076480b4d285320423/m_p_YFjOrZh2fLGJgpYJ.jpg">agrandir</a>]</p><h3>Molybdobule avec l’image du Christ et un monogramme (Byzance)</h3><p>VIIe s. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/172196?page=2&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%B0&amp;index=57">Ermitage, Russie</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c64d6480b4d285320424/s_p_RQupAUUa4gGtXt2n.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c64d6480b4d285320424/m_p_RQupAUUa4gGtXt2n.jpg">agrandir</a>]</p><h2>VIIIe siècle</h2><h3>La Mère de Dieu et l’enfant Jésus (Constantinople, Byzance)</h3><p>L’église de la Sagesse de Dieu (Sainte-Sophie).</p><img src="https://res.bibleox.com/s/img/image/simple/674f31b0dba77200011c73a2/s_p_2AO12RGOQ2yqRiP4.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f31b0dba77200011c73a2/m_p_2AO12RGOQ2yqRiP4.jpg">agrandir</a>]</p><h3>L’archange Gabriel (Constantinople, Byzance)</h3><p>L’église de la Sagesse de Dieu (Sainte-Sophie).</p><img src="https://res.bibleox.com/s/img/image/simple/674f3256dba77200011c73a4/s_p_rfkKZFQ8IYfO6L7V.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f3256dba77200011c73a4/m_p_rfkKZFQ8IYfO6L7V.jpg">agrandir</a>]</p><h3>Le Christ, la Crucifixion et la Résurrection (Metz, France)</h3><p>870. <a href="https://collections.louvre.fr/en/ark:/53355/cl010113244">Louvre, France</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c422e46594f46d35a87f10/s_p_lQNRJIXri6KJoLw3.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c422e46594f46d35a87f10/m_p_lQNRJIXri6KJoLw3.jpg">agrandir</a>]</p><h3>Le Christ, la Crucifixion (Reims, France)</h3><p>870-880. <a href="https://collections.louvre.fr/en/ark:/53355/cl010098469">Louvre, France</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c423bc6594f46d35a87f11/s_p_NOhnffTlgTImIczW.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c423bc6594f46d35a87f11/m_p_NOhnffTlgTImIczW.jpg">agrandir</a>]</p><h2>IXe siècle</h2><h3>L’Ascension du Christ (Thessalonique, Byzance)</h3><p>IXe-Xe s. Rotonde de saint Georges le Victorieux (à l’origine tombeau de l’empereur Galère). Fresque [17][18]</p><img src="https://res.bibleox.com/s/img/image/simple/686a934c5f47da2505d3ae20/s_p_klfYhHum7wZvKR9D.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686a934c5f47da2505d3ae20/m_p_klfYhHum7wZvKR9D.jpg">agrandir</a>]</p><h3>Le Christ, médaillon de bronze (Byzance)</h3><p>IXe-Xe s. On appelle médaillons les images de forme arrondie. <a href="https://www.britishmuseum.org/collection/object/H_1880-0820-9">British Museum</a>. Diamètre : 3,5 cm.</p><p>Circular medallion; bronze; bust of Christ with cruciferous nimbus holding the book of the gospel in his left hand; inscription either side.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5be2d45c75323d28a5e92/s_p_GswK2cGnuxxnLfJr.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5be2d45c75323d28a5e92/m_p_GswK2cGnuxxnLfJr.jpg">agrandir</a>]</p><h3>La Dormition de la Mère de Dieu (Byzance)</h3><p>Fin du IXe s. <a href="https://www.metmuseum.org/art/collection/search/464013">Metropolitan Museum of Art, Fifth Avenue, USA</a>. Matériau : ivoire. 18,6 x 14,8 x 1,1 cm.</p><p>New York. The Metropolitan Museum of Art. "The Glory of Byzantium,". Images of the Koimesis, or the Dormition in the West, show the Virgin lying on a bier, while her soul, represented as a baby, is offered by Christ to attendant angels who will take it to heaven. The apostles, led by Saints Paul and Peter, stand witness.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5c1bf45c75323d28a5e97/s_p_0Hg1bO8KIUVBSWJs.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5c1bf45c75323d28a5e97/m_p_0Hg1bO8KIUVBSWJs.jpg">agrandir</a>]</p><h3>Le Christ, la Mère de Dieu, Jean le Baptiste, les apôtres et d’autres saints (Constantinople)</h3><p>940-960. <a href="https://collections.louvre.fr/en/ark:/53355/cl010112515">Louvre, France</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c424276594f46d35a87f12/s_p_IlqGrJe04Ic0YFWv.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c424276594f46d35a87f12/m_p_IlqGrJe04Ic0YFWv.jpg">agrandir</a>]</p><h3>Plaquette avec l’image du Christ et des apôtres (Italie)</h3><p>IXe s. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/228918?page=4&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%B0&amp;index=194">Ermitage, Russie</a>. Dimensions : 12,2 x 10,5 cm</p><img src="https://res.bibleox.com/s/img/image/simple/6863c54f6480b4d285320421/s_p_aLvOvrKuilB614SS.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c54f6480b4d285320421/m_p_aLvOvrKuilB614SS.jpg">agrandir</a>]</p><h2>Xe siècle</h2><h3>Le Christ, la Mère de Dieu, Jean le Baptiste (Byzance)</h3><p>Xe siècle. <a href="https://www.britishmuseum.org/collection/object/H_1923-1205-2">British Museum</a>. Matériau : ivoire. Hauteur : 15,5 cm.</p><p>Panel; ivory; carved with standing figures, Christ with the Virgin Mary and St John, below a pierced canopy; four holes for attachment in the raised border.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5be4045c75323d28a5e95/s_p_qEFeZyh2Gq5Wbvar.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5be4045c75323d28a5e95/m_p_qEFeZyh2Gq5Wbvar.jpg">agrandir</a>]</p><h3>La Mère de Dieu et l’Enfant Christ (Constantinople, Byzance)</h3><p><a href="tel:950-1025">950-1025</a>. <a href="https://www.clevelandart.org/art/1925.1293">Cleveland Museum of Art, USA</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68caa153205184ec278d5882/s_p_iLLZZkqfsUiACLDC.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68caa153205184ec278d5882/m_p_iLLZZkqfsUiACLDC.jpg">agrandir</a>]</p><h3>Pendentif avec l’image du Christ et de la Mère de Dieu (Byzance)</h3><p>1000-1300. <a href="https://www.metmuseum.org/art/collection/search/477247">Metropolitan Museum of Art, Fifth Avenue, USA</a>. Camée en calcédoine ; monture d’or avec perles, émeraudes, grenats, saphirs et incrustation de sardonyx. Dimensions totales : 7,2 x 5,5 x 1,6 cm. Calcédoine : 1 1/2 x 1 1/4 pouces (3,8 x 3,2 cm)</p><img src="https://res.bibleox.com/s/img/image/simple/68c1bc1a6594f46d35a87e6d/s_p_VcHt7eFMtZq1I1lY.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1bc1a6594f46d35a87e6d/m_p_VcHt7eFMtZq1I1lY.jpg">agrandir</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/68c1bc176594f46d35a87e6c/s_p_LwWdQj6J4ehbmMh9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1bc176594f46d35a87e6c/m_p_LwWdQj6J4ehbmMh9.jpg">agrandir</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c1bc1f6594f46d35a87e6e/m_p_gT2TXueTg5pmDsuZ.jpg">encore plus grand</a>]</p><h3>Croix avec l’image du Christ (Byzance)</h3><p>Xe-XIe s. Bronze. 6,6 x 4,2 cm. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/228297?page=56&amp;query=%D0%BA%D1%80%D0%B5%D1%81%D1%82&amp;sort=112&amp;index=2755">Ermitage, Russie</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c11f5b6594f46d35a87e2d/s_p_6uw78FFpsxpItSzn.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c11f5b6594f46d35a87e2d/m_p_6uw78FFpsxpItSzn.jpg">agrandir</a>]</p><h3>Croix avec l’image du Christ (Byzance)</h3><p>Xe-XIe s. Bronze. 7,7 x 7 cm. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/482789?page=51&amp;query=%D0%BA%D1%80%D0%B5%D1%81%D1%82&amp;sort=112&amp;index=2501">Ermitage, Russie</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c11fab6594f46d35a87e2e/s_p_jfgfrZ4X7jcBXG9D.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c11fab6594f46d35a87e2e/m_p_jfgfrZ4X7jcBXG9D.jpg">agrandir</a>]</p><h3>Croix avec des icônes de saints (Chersonèse)</h3><p>Xe siècle. Bronze, gravure. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/372835?page=5&amp;fundcoll=1420520446__1413747286&amp;index=229">Ermitage, Russie</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c4191a6594f46d35a87f02/s_p_iFiSEGM9EbRIhhtD.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c4191a6594f46d35a87f02/m_p_iFiSEGM9EbRIhhtD.jpg">agrandir</a>]</p><h3>Saint Démétrius de Thessalonique (Byzance)</h3><p><a href="tel:950-1000">950-1000</a>. <a href="https://www.metmuseum.org/art/collection/search/465946">Metropolitan Museum of Art, Fifth Avenue, USA</a>. Matériau : ivoire. 19,7 x 12,1 x 1 cm.</p><p>Standing erect, a spear in his hand and a shield at his side, Saint Demetrios is shown ready to protect the Christian faithful. The name of the popular Byzantine military saint is inscribed in two parts in Greek. Martyred in Thessalonike, the second most important city of the empire in the early centuries of the church, he has long been the patron saint of that metropolis. Images of saints in military dress are rare in Early Byzantine art (they appear on the chalices of the Attarouthi Treasure) but typical of the Middle Byzantine period.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5c38445c75323d28a5e98/s_p_ZeZuXGqxAAyDuPBA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5c38445c75323d28a5e98/m_p_ZeZuXGqxAAyDuPBA.jpg">agrandir</a>]</p><h2>XIe siècle</h2><h3>Croix de procession : le Christ, la Mère de Dieu, les archanges Michel et Gabriel (Byzance)</h3><p>1000-1050. <a href="https://www.metmuseum.org/art/collection/search/466251">Metropolitan Museum of Art, Fifth Avenue, USA</a>. 59,5 x 43 x 2,2 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5e3e645c75323d28a5e9b/s_p_Ft65PrnBUmI6wDAc.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5e3e645c75323d28a5e9b/m_p_Ft65PrnBUmI6wDAc.jpg">agrandir</a>]</p><h3>Croix de procession : le Christ, la Mère de Dieu, Jean le Baptiste (Byzance)</h3><p>1050. <a href="https://www.clevelandart.org/art/1970.36">Cleveland Museum of Art, USA</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68ca921d205184ec278d5871/s_p_PrD5y34JBpT95quf.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68ca921d205184ec278d5871/m_p_PrD5y34JBpT95quf.jpg">agrandir</a>]</p><h3>Croix de procession : saint Sabbas (Byzance)</h3><p>1050. <a href="https://www.metmuseum.org/art/collection/search/697956">Metropolitan Museum of Art, Fifth Avenue, USA</a>. Au centre du revers est représenté saint Sabbas, et sur les bords d’autres saints moines. Argent. 32,4 × 44,8 × 5,7 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68c1c6546594f46d35a87e76/s_p_FO8cb8Ec2FqTDFz8.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1c6546594f46d35a87e76/m_p_FO8cb8Ec2FqTDFz8.jpg">agrandir</a>]</p><h3>Croix de procession : le Christ (Chersonèse)</h3><p>XIe siècle. Matériau : bronze, fer ; fonte, ciselage, gravure. Dimensions : 36,5 x 27,5 cm. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/372834?page=3&amp;fundcoll=1420520446__1413747286&amp;index=106">Ermitage, Russie</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c418616594f46d35a87f01/s_p_ytqdkwIa6FDSikCw.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c418616594f46d35a87f01/m_p_ytqdkwIa6FDSikCw.jpg">agrandir</a>]</p><h3>Partie de l’icône « Christ Pantocrator » (Byzance, Crimée)</h3><p>1050-1100. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/372766?page=40&amp;query=%D0%B8%D0%BA%D0%BE%D0%BD%D0%B0&amp;index=1999">Ermitage, Russie</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863bfff6480b4d285320412/s_p_XwuOAkY6yR10NT7b.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863bfff6480b4d285320412/m_p_XwuOAkY6yR10NT7b.jpg">agrandir</a>]</p><h3>La Mère de Dieu avec l’Enfant Christ (Constantinople)</h3><p>1000-1015. <a href="https://collections.louvre.fr/en/ark:/53355/cl010101133">Louvre, France</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c43b8c6594f46d35a87f16/s_p_rQNvoLa9Vu1WmSB2.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c43b8c6594f46d35a87f16/m_p_rQNvoLa9Vu1WmSB2.jpg">agrandir</a>]</p><h3>La Mère de Dieu, orante (Constantinople)</h3><p>1000-1200. <a href="https://collections.louvre.fr/en/ark:/53355/cl010114443">Louvre, France</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c43bcc6594f46d35a87f17/s_p_7a5oJnVWqjfeu67t.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c43bcc6594f46d35a87f17/m_p_7a5oJnVWqjfeu67t.jpg">agrandir</a>]</p><h3>La Mère de Dieu, l’archange Michel, saint Théodore (Byzance)</h3><p>XIe-XIIe s. <a href="https://www.britishmuseum.org/collection/object/H_1981-0103-1">British Museum</a>. 108 x 95 mm.</p><p>Relief icon; rectangular bronze plaque cast in low relief with full-length Hodegetria flanked by the Archangel Michael and St Theodore, each wearing a girdled tunic beneath a chlamys with decorated tablion; the figures are identified by intaglio inscriptions; the whole is surrounded by a raised border with a running vine scroll; traces of solder at sides and back.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5be3545c75323d28a5e93/s_p_DFDGZ6kHm0khLKRD.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5be3545c75323d28a5e93/m_p_DFDGZ6kHm0khLKRD.jpg">agrandir</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5be3b45c75323d28a5e94/m_p_FfmDAHv29BAMxval.jpg">encore plus grand</a>]</p><h3>Icône de saint Démétrius (Byzance)</h3><p>1040-1060. <a href="https://collections.louvre.fr/en/ark:/53355/cl010115478">Louvre, France</a>. 9,4 x 6,3 x 0,6 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c0c36594f46d35a87ec0/s_p_dj04XPO3pwvzkLzr.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c0c36594f46d35a87ec0/m_p_dj04XPO3pwvzkLzr.jpg">agrandir</a>]</p><h3>Molybdobule avec l’image de saint Démétrius et une inscription (Byzance)</h3><p>XIe s. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/269619?page=20&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=958">Ermitage, Russie</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c2556480b4d285320418/s_p_oqzix7avanFfe61o.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c2556480b4d285320418/m_p_oqzix7avanFfe61o.jpg">agrandir</a>]</p><h3>Molybdobule avec un saint représenté à mi-corps (Byzance)</h3><p>XIe siècle. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/267492?page=14&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=651">Ermitage, Russie</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c3196480b4d28532041a/s_p_VySwl31Z41rar6d3.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c3196480b4d28532041a/m_p_VySwl31Z41rar6d3.jpg">agrandir</a>]</p><h3>Sceau pendant avec l’image d’un saint (Byzance)</h3><p>XIe s. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/483272?query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=21">Ermitage, Russie</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c4276480b4d28532041d/s_p_5EJuZ18em5TsdUwA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c4276480b4d28532041d/m_p_5EJuZ18em5TsdUwA.jpg">agrandir</a>]</p><h3>Sceau pendant avec l’image d’un saint (Byzance)</h3><p>XIe-XIIe s. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/483278?query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=35">Ermitage, Russie</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c4616480b4d28532041e/s_p_H8LrRkkjwBHlc322.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c4616480b4d28532041e/m_p_H8LrRkkjwBHlc322.jpg">agrandir</a>]</p><h2>XIIe siècle</h2><h3>Le Christ, la Mère de Dieu, le prophète Jean (Constantinople, Byzance)</h3><p>L’église de la Sagesse de Dieu (Sainte-Sophie). Fresque de l’église[5]</p><img src="https://res.bibleox.com/s/img/image/simple/6750078ddba77200011c73af/s_p_EcliI0JFeV1uu1LU.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6750078ddba77200011c73af/m_p_EcliI0JFeV1uu1LU.jpg">agrandir</a>]</p><h3>Le Christ (Constantinople, Byzance)</h3><p>L’église de la Sagesse de Dieu (Sainte-Sophie).</p><img src="https://res.bibleox.com/s/img/image/simple/674f332ddba77200011c73a6/s_p_1PCMz3Y4EZgbSJL0.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f332ddba77200011c73a6/m_p_1PCMz3Y4EZgbSJL0.jpg">agrandir</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686cf10d5f47da2505d3ae4e/s_p_ZHUiumbGoeJMn4GO.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686cf10d5f47da2505d3ae4e/m_p_ZHUiumbGoeJMn4GO.jpg">agrandir</a>]</p><h3>La Mère de Dieu (Constantinople, Byzance)</h3><p>L’église de la Sagesse de Dieu (Sainte-Sophie).</p><img src="https://res.bibleox.com/s/img/image/simple/674f3332dba77200011c73a7/s_p_WvZb6UestGwJUzJr.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f3332dba77200011c73a7/m_p_WvZb6UestGwJUzJr.jpg">agrandir</a>]</p><h3>Jean le Baptiste, prophète (Constantinople, Byzance)</h3><p>L’église de la Sagesse de Dieu (Sainte-Sophie).</p><img src="https://res.bibleox.com/s/img/image/simple/674f357ddba77200011c73a8/s_p_hdfr9cx0ZPTZyn6N.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f357ddba77200011c73a8/m_p_hdfr9cx0ZPTZyn6N.jpg">agrandir</a>]</p><h3>La Mère de Dieu avec l’enfant Jésus (Constantinople)</h3><p>Premier tiers du XIIe siècle. Icône de la Mère de Dieu de Vladimir. Bois, tempera.</p><img src="https://res.bibleox.com/s/img/image/simple/674f18e4dba77200011c7399/s_p_0uaArAqVhNX9r0gV.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f18e4dba77200011c7399/m_p_0uaArAqVhNX9r0gV.jpg">agrandir</a>]</p><h3>La Mère de Dieu (Byzance, Syrie, Tartous)</h3><p>XIIe siècle. <a href="https://www.britishmuseum.org/collection/object/H_1889-0511-13">British Museum</a>. Matériau : ivoire, 41 x 47 mm.</p><p>Relief icon; pale grey-green steatite; rounded at the top and square below; bust of the Virgin, her mantle drawn over her head, with St Andrew's cross on it; her hands held in front with palms outwards, inscription either side of her.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5be2645c75323d28a5e91/s_p_StVNlxiOjocLLsz5.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5be2645c75323d28a5e91/m_p_StVNlxiOjocLLsz5.jpg">agrandir</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5be2245c75323d28a5e90/m_p_yHJ3BkdNwVGdLb4m.jpg">encore plus grand</a>]</p><h3>Le grand martyr Démétrius de Thessalonique et un diacre (Thessalonique, Byzance)</h3><p>XIIe s. Mosaïque sur la face est du pilier sud.</p><img src="https://res.bibleox.com/s/img/image/simple/68698a155f47da2505d3ae16/s_p_n7AgnVLPvfeBX5Qq.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68698a155f47da2505d3ae16/m_p_n7AgnVLPvfeBX5Qq.jpg">agrandir</a>]</p><h3>Icône de la Mère de Dieu Hodigitria (Byzance, Chersonèse)</h3><p>Seconde moitié du XIIe s. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/372931?page=11&amp;fundcoll=1420520446&amp;index=536">Ermitage, Russie</a>. 6,8 x 5 cm</p><img src="https://res.bibleox.com/s/img/image/simple/6863bf2f6480b4d285320411/s_p_10YV8HIpAzMNCgvp.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863bf2f6480b4d285320411/m_p_10YV8HIpAzMNCgvp.jpg">agrandir</a>]</p><h2>XIIIe siècle</h2><h3>Le Seigneur Tout-Puissant (Athos)</h3><p>Monastère de Hilandar, Sainte Montagne de l’Athos.</p><img src="https://res.bibleox.com/s/img/image/simple/69406737205184ec278d6fd8/s_p_hTWcEC5QtmbCrC5t.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69406737205184ec278d6fd8/m_p_hTWcEC5QtmbCrC5t.jpg">agrandir</a>]</p><h3>La Mère de Dieu avec l’enfant Jésus (Hodigitria, Athos)</h3><p>Monastère de Hilandar, Sainte Montagne de l’Athos.</p><img src="https://res.bibleox.com/s/img/image/simple/674f0cfadba77200011c7395/s_p_mQMRA7FGLEbqOYIx.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f0cfadba77200011c7395/m_p_mQMRA7FGLEbqOYIx.jpg">agrandir</a>]</p><h2>XIVe siècle</h2><h3>Le Seigneur Tout-Puissant</h3><p>Iconographe Manuel Pansélinos.</p><img src="https://res.bibleox.com/s/img/image/simple/674f28d1dba77200011c739e/s_p_ma0z14hIFXCiEj7S.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f28d1dba77200011c739e/m_p_ma0z14hIFXCiEj7S.jpg">agrandir</a>]</p><h3>La Mère de Dieu (Thessalonique)</h3><p>1310-1315. Orante. Fresque de l’église Saint-Nicolas Orphanos à Thessalonique, Grèce.</p><img src="https://res.bibleox.com/s/img/image/simple/674f29b7dba77200011c739f/s_p_PSuCdQIYdR4IYZgA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f29b7dba77200011c739f/m_p_PSuCdQIYdR4IYZgA.jpg">agrandir</a>]</p><h3>L’Entrée de la Très Sainte Mère de Dieu au Temple (Constantinople)</h3><p>Vers 1316–1321. Kariye Camii, monastère de Chora, Istanbul (Constantinople), Turquie.</p><img src="https://res.bibleox.com/s/img/image/simple/675343bddba7720001cd0ddf/s_p_AtF4vpmhv6FneUfA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/675343bddba7720001cd0ddf/m_p_AtF4vpmhv6FneUfA.jpg">agrandir</a>]</p><h2>XVe siècle</h2><h3>L’apôtre Paul (Rus’)</h3><p>Années 1410. Auteur : saint André Roublev. Galerie nationale Tretiakov, Moscou, Russie.</p><img src="https://res.bibleox.com/s/img/image/simple/6909fbca205184ec278d6e6a/s_p_ok25vNdlaQMM5P3c.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6909fbca205184ec278d6e6a/m_p_ok25vNdlaQMM5P3c.jpg">agrandir</a>]</p><h2>Recueils d’icônes</h2><ol><li><p>Recueil d’iconographie des catacombes, fichier Word : <a href="https://disk.yandex.ru/d/mHc8dxUdHGqMEQ">lien</a></p></li><li><p>Œuvres de l’iconographe Manuel Pansélinos (XIIIe-XIVe s.) : <a href="https://vk.com/album-20034910_224123875">https://vk.com/album-20034910_224123875</a></p></li></ol>
