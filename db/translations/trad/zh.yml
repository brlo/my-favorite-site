  path: Ch2c_古代基督教教堂
  title: 古代基督教教堂
  title_sub:
  body: '<h2>题记</h2><blockquote><p>“人群中有几个法利塞人对耶稣说：‘师傅，责斥你的门徒罢！’耶稣回答说：‘我告诉你们：<strong>这些人若不作声，石头就要喊叫了！</strong>’”（<a href="https://bibleox.com/zh-Hans/cn-sb/lk/19/#L39-40">路 19:39-40</a>）</p></blockquote><h2>3世纪</h2><h3>古城默基多附近，<a href="https://he.wikipedia.org/wiki/%D7%9C%D7%92%D7%99%D7%95">莱吉奥</a>聚落的教堂（约230年）</h3><p>古代基督教教堂的祭台常常设在中央。这座教堂就是一个明显的例子。</p><p>在默基多城附近（古时那里驻有罗马军团，因此有一个叫<a href="https://he.wikipedia.org/wiki/%D7%9C%D7%92%D7%99%D7%95">莱吉奥</a>的聚落）。聚落的高处有一座建筑，根据钱币、陶器和字体，被断定为230年的建筑。建筑中的一个房间是基督教教堂。地上有几幅带铭文的大型马赛克（其中一幅称基督为天主），中央是祭台。旁边还有一段铭文，记载这张桌子是谁奉献的。</p><img src="https://res.bibleox.com/s/img/image/simple/692c58f9205184ec278d6f97/s_p_aZ3NifF9BW3oqZ1a.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c58f9205184ec278d6f97/m_p_aZ3NifF9BW3oqZ1a.jpg">放大</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/692c587d205184ec278d6f91/s_p_MvOQRFKiCv6XaXOd.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c587d205184ec278d6f91/m_p_MvOQRFKiCv6XaXOd.jpg">放大</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/692c58ee205184ec278d6f96/s_p_5wNRtqyrpQivbBim.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c58ee205184ec278d6f96/m_p_5wNRtqyrpQivbBim.jpg">放大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/692c58e0205184ec278d6f95/m_p_FQvEfj70dP7967X3.jpg">补充照片 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/692c58ce205184ec278d6f94/m_p_9xoiCsqROihBYnL0.jpg">补充照片 3</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/692c58b5205184ec278d6f93/s_p_Cvww0C8ZGmbqJS7a.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c58b5205184ec278d6f93/m_p_Cvww0C8ZGmbqJS7a.jpg">放大</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/692c5882205184ec278d6f92/s_p_WU59e3c2XbPWkdaM.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c5882205184ec278d6f92/m_p_WU59e3c2XbPWkdaM.jpg">放大</a>]</p><p><strong>铭文：</strong></p><p>教堂地面上的所有铭文都是一种<strong>追念名单</strong>。从最古老的时候直到今天，正教会的教堂里一直有这样的传统：每逢举行礼仪，总要在祈祷中追念建造教堂或奉献重要物品的人的名字。这里也是如此，带着请求追念的话，记下了奉献马赛克地面的人（百夫长盖亚诺斯·波菲利奥斯）、铺设地面的人（布鲁提奥斯）、奉献祭台的人（阿克普图斯），以及其他一些名字，可能是奉献者的亲属：普丽米拉、基里亚卡、多罗特亚、克蕾丝特。同样，人们也为追念生者和亡者而奉献教会器皿：圣体圣血礼仪的圣爵和香炉（<a href="https://bibleox.com/ru/ru/w/%D0%B4%D1%80%D0%B5%D0%B2%D0%BD%D0%B8%D0%B5-%D0%B8%D0%BA%D0%BE%D0%BD%D1%8B#HH-%D0%95%D0%B2%D1%85%D0%B0%D1%80%D0%B8%D1%81%D1%82%D0%B8%D1%87%D0%B5%D1%81%D0%BA%D0%B8%D0%B5-%D1%87%D0%B0%D1%88%D0%B8-%D0%B8-%D0%BA%D0%B0%D0%B4%D0%B8%D0%BB%D0%B0-%D1%81-%D0%B8%D0%BA%D0%BE%D0%BD%D0%B0%D0%BC%D0%B8-%D0%92%D0%B8%D0%B7%D0%B0%D0%BD%D1%82%D0%B8%D1%8F-%D0%A1%D0%B8%D1%80%D0%B8%D1%8F-%D0%90%D1%82%D1%82%D0%B0%D1%80%D1%83%D1%82%D0%B8">详见</a>）。</p><blockquote><p>中文译文：爱慕天主的阿克普图斯将这张桌子献给天主耶稣基督，以作纪念。</p></blockquote><blockquote><p>EN: Akeptous, the God-loving, offered the table to God Jesus Christ as a memorial.</p></blockquote><blockquote><p>Transcription: <strong>Prosēniken Akeptous, ē philotheos, tēn trapezan Th(e)ō Ι(ēso)u Ch(rist)ō mnēmosunon.</strong></p></blockquote><blockquote><p>Orig: <strong>ΠΡΟСΗΝΙΚΕΝ ΑΚΕΠΤΟΥС, Η ΦΙΛΟΘΕΟС, ΤΗΝ ΤΡΑΠΕΖΑΝ Θ(Ε)Ω Ι(ΗСΟ)Υ Χ(ΡΙСΤ)Ω ΜΝΗΜΟСΥΝΟΝ</strong></p></blockquote><blockquote><p>ΠΡΟϹΗΝΙΚΕΝ</p><p>ΑΚΕΠΤΟΥϹ,</p><p>Η ΦΙΛΟΘΕΟϹ,</p><p>ΤΗΝ ΤΡΑΠΕ-</p><p>ZΑΝ <strong>{ΘW} {ΙΥ} {ΧW}*</strong></p><p>ΜΝΗΜΟϹΥΝΟΝ</p></blockquote><p>*圣名缩写（Nomina sacra）：<strong>ΘW ΙΥ ΧW</strong> = θεῷ Ἰησοῦ Χριστῷ = 天主耶稣基督</p><img src="https://res.bibleox.com/s/img/image/simple/692c5df3205184ec278d6f9a/s_p_swifwBDbtzgImkZ6.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c5df3205184ec278d6f9a/m_p_swifwBDbtzgImkZ6.jpg">放大</a>]</p><hr><blockquote><p>ΕΝ: Remember Primilla and Cyriaca and Dorothea, and moreover also Chreste.</p></blockquote><blockquote><p>中文译文：请追念普丽米拉、基里亚卡、多罗特亚，还有克蕾丝特。</p></blockquote><blockquote><p>Orig: <strong>ΜΝΗΜΟΝΕΥСΑΤΕ ΠΡΙΜΙΛΛΗС ΚΑΙ ΚΥΡΙΑΚΗС ΚΑΙ ΔWΡΟΘΕΑС ΕΤΙ ΔΕ ΚΑΙ ΧΡΗСΤΗ</strong></p></blockquote><blockquote><p>Fixed: <strong>ΜΝΗΜΟΝΕΥСΑΤΕ ΠΡΙΜΙΛΛΗС ΚΑΙ ΚΥΡΙΑΚΗΣ ΚΑΙ ΔΩΡΟΘΕΑΣ ΕΤΙ ΔΕ ΚΑΙ ΧΡΗΣΤΗ</strong></p></blockquote><img src="https://res.bibleox.com/s/img/image/simple/692c5dec205184ec278d6f99/s_p_LVbgKrKO7P3dfEJP.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c5dec205184ec278d6f99/m_p_LVbgKrKO7P3dfEJP.jpg">放大</a>]</p><hr><blockquote><p>中文译文：盖亚诺斯，又名波菲利奥斯，百夫长，我们的弟兄，自己出资，慷慨地铺设了这地面。布鲁提奥斯完成了这项工作。</p></blockquote><blockquote><p>EN: Gaianus, also called Porphyrius, centurion (xp), our brother, has made the pavement at his own expense as an act of liberality. Brutius has carried out the work.</p></blockquote><blockquote><p>Orig: <strong>ΓΑΙΑΝΟС Ο ΚΑ ΠΟΡΦΥΡΙС ΧΡ* ΑΔΕΛΦΟС ΗΜWΝ ΕΚ ΦΙΛΟΤΕ ΙΜΙС ΑΜΕΝ ΟСΕΚΤW ΝΙΔΙWΝ ΕΨΙ ΦΟΛΟΓΗСΕΝ. ΒΡΟVΤΙС ΗΡΓΑСΑΤΟ.</strong></p></blockquote><blockquote><p>Fixed: <strong>ΓΑΙΑΝΟΣ Ο ΚΑ ΠΟΡΦΥΡΙΣ ΧΡ* ΑΔΕΛΦΟΣ ΗΜΩΝ ΕΚ ΦΙΛΟΤΕ ΙΜΙΣ ΑΜΕΝ ΟΣΕΚΤΩ ΝΙΔΙΩΝ ΕΨΙ ΦΟΛΟΓΗΣΕΝ. ΒΡΟΥΤΙΣ ΗΡΓΑΣΑΤΟ.</strong></p></blockquote><p><strong>*ΧΡ — hekatontarches — centurio</strong></p><img src="https://res.bibleox.com/s/img/image/simple/692c5e27205184ec278d6f9b/s_p_Qk321JfFTD4dDmnd.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c5e27205184ec278d6f9b/m_p_Qk321JfFTD4dDmnd.jpg">放大</a>]</p><h3>杜拉欧罗普斯的教堂（叙利亚）</h3><p>244年，杜拉欧罗普斯的基督教教堂</p><img src="https://res.bibleox.com/s/img/image/simple/6931880c205184ec278d6fa6/s_p_DFnp7s0vcTbXb3Qn.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931880c205184ec278d6fa6/m_p_DFnp7s0vcTbXb3Qn.jpg">放大</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/69318806205184ec278d6fa5/s_p_PuUKcoZEfAVSlPNM.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69318806205184ec278d6fa5/m_p_PuUKcoZEfAVSlPNM.jpg">放大</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/69318802205184ec278d6fa4/s_p_MF4zgk1ySUOBpqnG.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69318802205184ec278d6fa4/m_p_MF4zgk1ySUOBpqnG.jpg">放大</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/414/s_p_UgKueSl1yxG0SfbA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/414/m_p_UgKueSl1yxG0SfbA.jpg">放大</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/69330ed8205184ec278d6fc0/s_p_kXy4nTuYVCOxuDib.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69330ed8205184ec278d6fc0/m_p_kXy4nTuYVCOxuDib.jpg">放大</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/693187fd205184ec278d6fa3/s_p_R3poESL99kNRMpXi.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/693187fd205184ec278d6fa3/m_p_R3poESL99kNRMpXi.jpg">放大</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/69330e9e205184ec278d6fbf/s_p_ThLs4WrxsJ3ykxKU.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69330e9e205184ec278d6fbf/m_p_ThLs4WrxsJ3ykxKU.jpg">放大</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/69330e76205184ec278d6fbe/s_p_NykNwaI9TEwz1Ccf.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69330e76205184ec278d6fbe/m_p_NykNwaI9TEwz1Ccf.jpg">放大</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/69330e70205184ec278d6fbd/s_p_Rd3jEzEeesXUCTmh.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69330e70205184ec278d6fbd/m_p_Rd3jEzEeesXUCTmh.jpg">放大</a>]</p><p>教堂里有描绘新约事件的壁画：将要沉没的宗徒伯多禄得救，在羊池旁治好瘫子（基督奇迹系列壁画中只保存下这两幅），还有善牧。</p><p><strong>将要沉没的宗徒伯多禄得救</strong></p><img src="https://res.bibleox.com/s/img/image/simple/692c8038205184ec278d6f9e/s_p_QQ2Rml8gUWsyQtS9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c8038205184ec278d6f9e/m_p_QQ2Rml8gUWsyQtS9.jpg">放大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6786b88ddba77200015ae11c/m_p_do380IVDukCAfdFk.jpg">版本 2</a>]</p><p><strong>在羊池旁治好瘫子</strong></p><img src="https://res.bibleox.com/s/img/image/simple/6786b889dba77200015ae11b/s_p_k1a5GDBvfzTCWmZv.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6786b889dba77200015ae11b/m_p_k1a5GDBvfzTCWmZv.jpg">放大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6786bb0bdba77200015ae11d/m_p_dCRD85foL69l7kih.jpg">另一版本</a>]</p><p><strong>洗礼池旁的画（6号房间）：善牧把迷失的羊带回羊群</strong></p><img src="https://res.bibleox.com/s/img/image/simple/6931870c205184ec278d6fa2/s_p_uBkNi8jGsMFpOQSM.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931870c205184ec278d6fa2/m_p_uBkNi8jGsMFpOQSM.jpg">放大</a>]</p><h3>凯撒勒雅的优西比乌（潘菲洛之友），主教，教会史家（约258—339年）</h3><p>他记述了罗马皇帝戴克里先统治（284—305年）以前，各城都建造了基督教教堂。303年，戴克里先颁布拆毁基督教教堂的敕令。当时优西比乌约45岁，因此他应当亲眼见过这些教堂的建造和拆毁：</p><blockquote><p>5. 总督和官长们对教会的首领是何等友善！怎能描述<strong>每座城中成千上万人的聚会</strong>，那些<strong>涌向祈祷之家的惊人人群！旧的建筑已不够用，<mark>各城都从地基起建造新的宽敞教堂</mark>（εὐρείας εἰς πλάτος ἀνὰ πάσας τὰς πόλεις ἐκ θεμελίων ἀνίστων <mark>ἐκκλησίας</mark>）。</strong></p><p>&lt;…&gt;</p><p>4. 那是戴克里先在位第十九年，迪斯特罗斯月（罗马人的三月），主受难的节日临近时，各处都张贴了<strong><mark>皇帝的诏书，命令把教堂夷为平地</mark>（βασιλικὰ γράμματα, τὰς μὲν <mark>ἐκκλησίας</mark> εἰς ἔδαφος φέρειν）</strong>，焚烧圣经，并宣布坚持基督信仰的人被剥夺荣誉职位；</p></blockquote><p>（<a href="https://bibleox.com/zh-Hans/grc/w/%CE%95%CE%9A%CE%9A%CE%9B%CE%97%CE%A3%CE%99%CE%91%CE%A3%CE%A4%CE%99%CE%9A%CE%97%CE%A3_%CE%99%CE%A3%CE%A4%CE%9F%CE%A1%CE%99%CE%91%CE%A3-8/#:~:text=%E1%BC%80%CE%BD%E1%BD%B0%20%CF%80%E1%BD%B1%CF%83%CE%B1%CF%82%20%CF%84%E1%BD%B0%CF%82%20%CF%80%E1%BD%B9%CE%BB%CE%B5%CE%B9%CF%82%20%E1%BC%90%CE%BA%20%CE%B8%CE%B5%CE%BC%CE%B5%CE%BB%E1%BD%B7%CF%89%CE%BD%20%E1%BC%80%CE%BD%E1%BD%B7%CF%83%CF%84%CF%89%CE%BD%20%E1%BC%90%CE%BA%CE%BA%CE%BB%CE%B7%CF%83%E1%BD%B7%CE%B1%CF%82">《教会史》第8卷 1.5、2.4</a>，译自希腊文）</p><h2>有争议的发现</h2><h3><strong>赫库兰尼姆的房屋（</strong>1世纪<strong>）</strong></h3><img src="https://res.bibleox.com/s/img/image/simple/67e428d39a4a346bba31e8ba/s_p_F0lTpC2rqw7PVyf1.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/67e428d39a4a346bba31e8ba/m_p_F0lTpC2rqw7PVyf1.jpg">放大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/69330b68205184ec278d6fb8/m_p_oEOCtcPUBThtuirO.jpg">版本 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/69330cb6205184ec278d6fb9/m_p_zMmSTHDi5RoizXsX.jpg">版本 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/69330cbb205184ec278d6fba/m_p_Jv9gdiBWmrMB5tc4.jpg">版本 4</a>] [<a href="https://res.bibleox.com/s/img/image/simple/67e428d79a4a346bba31e8bb/m_p_1sEN1KSZxei96K4S.jpg">版本 5</a>] [<a href="https://res.bibleox.com/s/img/image/simple/67e428db9a4a346bba31e8bc/m_p_TgMWk123osBJ9une.jpg">版本 6</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/69330cc3205184ec278d6fbc/s_p_YLRMNDvDg7nCTh3X.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69330cc3205184ec278d6fbc/m_p_YLRMNDvDg7nCTh3X.jpg">放大</a>]</p><p>79年维苏威火山喷发，把庞贝、斯塔比伊、赫库兰尼姆等城市埋在火山灰下。在赫库兰尼姆发现了一座<a href="https://ru.wikipedia.org/wiki/%D0%93%D0%B5%D1%80%D0%BA%D1%83%D0%BB%D0%B0%D0%BD%D1%83%D0%BC#%D0%94%D0%BE%D0%BC_%D0%B4%D0%B2%D1%83%D1%85%D1%81%D0%BE%D1%82%D0%BB%D0%B5%D1%82%D0%B8%D1%8F">房屋</a>（俄语）（为纪念发掘二百周年，称为“二百周年之家”），其二楼一个房间的墙上，正对木柜上方的中央，有一个<a href="https://ermakvagus.com/Europe/Italy/Pompeii/christianity_pompeii_rus.html">十字形凹槽</a>（俄语）。有人推测那里挂过祈祷用的木十字架，这个房间用于基督教礼仪或家庭祈祷。但这种推测有很有力的反驳。在同一城市发现了一个搁板，它可能在墙上留下类似的痕迹。</p><img src="https://res.bibleox.com/s/img/image/simple/6932ff2b205184ec278d6fb6/s_p_cXmpauqq2EYuH6ww.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6932ff2b205184ec278d6fb6/m_p_cXmpauqq2EYuH6ww.jpg">放大</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6932ff36205184ec278d6fb7/s_p_KIfO7M0rbhGbWoIk.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6932ff36205184ec278d6fb7/m_p_KIfO7M0rbhGbWoIk.jpg">放大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/69330cbf205184ec278d6fbb/m_p_WL1FQysNlwZc0yT9.jpg">版本 2</a>]</p><p>那个搁板并不完全一样：左右突出得相当多，向下突出得少一些。此外，二百周年之家墙上的这个位置可能还有两扇可以关上的门。尽管如此，二百周年之家那里很可能真的只是一个普通的搁板，而不是十字架。读者应自己判断对各种结论信到什么程度。这里只是收集了关于这一发现的已知资料。</p>'
