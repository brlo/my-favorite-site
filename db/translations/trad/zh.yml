  path: Bu3i_基督徒的墓葬与铭文
  title: 基督徒的墓葬与铭文
  title_sub:
  body: '<h2>最初几个世纪基督徒墓旁的铭文</h2><p>亚壁古道上所谓“宗徒纪念所”（Memoria Apostolorum）的聚餐厅（triclia）里的铭文。这座圣所建于3世纪中叶，238年至260年之间。同在3世纪，聚餐厅里开始出现基督徒的祈祷铭文，如“<em>Paule ed Petre petite pro Victore</em>”等（见下文）。人们一直写到君士坦丁大帝的时代。[1]</p><img src="https://res.bibleox.com/s/img/image/simple/483/s_p_1D8zprHe86ZZn5O9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/483/m_p_1D8zprHe86ZZn5O9.jpg">放大</a>]</p><h3><strong>请在心中、在你们的祈祷中记念 </strong>(in mente habete, in orationibus vestris)：</h3><p>12912: [Petre et] Paul[e] | in m[ente] abete in | ora[tion]ibus vestris/ — <strong>“伯多禄和保禄，请在心中、在你们的祈祷中记念……”</strong></p><h3><strong>请代求 </strong>(petite)（或“请祈祷”“请祈求”）</h3><p>12918: [Paul]e et Petre petite | [pro] nobis omnibus/ — <strong>“保禄和伯多禄，请为我们众人代求！”</strong></p><p>12931: Petr[e] et Pau[l]e petite | pro [Le]ontium / — <strong>“伯多禄和保禄，请为莱昂提乌斯代求！”</strong></p><p>12933: Pa[ul]e et Pet|re apetite pro Da|tivu in perpetu`u´m/ — <strong>“保禄和伯多禄，请永远为达提乌斯代求！”</strong></p><p>12989: Paule ed Petre petite | pro Victore/ — <strong>“保禄和伯多禄，请为维克多代求！”</strong></p><p>12946: [Petre et Pa]ulae spir[ita sancta vestra petant pro - - -]/ — <strong>“伯多禄和保禄，愿你们圣洁的灵为［- - -］代求！”</strong></p><h3><strong>conservate</strong> — <strong>请保护</strong>（或“请保守”）</h3><p>12991: Petre et Paule cons[ervate - - -]/ — <strong>“伯多禄和保禄，请保护［- - -］！”</strong></p><p>12996: sa[lva Paule et] | Petr[e - - - et] | Mart[yrium et] | conse[rvate in] | do[mino - - -]/ — <strong>“保禄和伯多禄啊，请拯救［- - -］和玛尔提里乌斯，并在主内保护他们［- - -］！”</strong></p><p>13026: [- - - roga]mus | [conse]rvate nos [omnes]/ — <strong>“［- - -］我们恳求，请保护我们众人！”</strong></p><h3><strong>简单的呼求</strong></h3><p>12909: Petr[e et Paule]/ — <strong>“伯多禄和保禄啊！”</strong></p><h3><strong>为罪人求助</strong></h3><p>12967: Petre et Paule sub|venite Prim[o] | peccatori/ — <strong>“伯多禄和保禄，请来帮助罪人普里慕斯！”</strong></p><h3><strong>许多呼求是用希腊文写的，或用希腊字母写的拉丁文</strong></h3><p>12927: Παῦλε {μ} καί | μου πατ|ρός/ — <strong>“保禄，也（帮助）我的父亲！”</strong></p><p>12997: [Παυλ]ε ετ Πετ[ρε ιν μεν]/[τε ν]ος αβετε [ιν ορα]/[τι]ωνες βεστ[ρας]/ — <strong>“保禄和伯多禄，请在心中、在你们的祈祷中记念……”</strong></p><p>13045: [Πα]υ[λε ετ Πετρε] | [ι]ν με[ντε αβετε] | Αὐφίδ[ιον υἱόν - - -] | μου/ — <strong>“保禄和伯多禄，请记念我的儿子奥菲迪乌斯！”</strong></p><p>13069: Πέτρε Παίτρε μνημόνευαι | Τιμοκράτην καὶ Εὐ|τυχείαν κινα(?) καὶ | ἐσώρα(?) ++ [- - -]/ — <strong>“伯多禄，伯多禄，请记念提摩克拉特斯和欧提基娅，以及（……）++［- - -］！”</strong></p><p>13045: [κομμ]ανδαμ[ους? - - -]/<strong> </strong>— <strong>“我们托付［- - -］。”</strong></p><p>13049: Παῦλε καὶ Π[έτρε ἔχετε] / μνί[α]ς/ — <strong>“保禄和伯多禄，请记念［- - -］！”</strong></p><p>13055: [Παῦλε καὶ Πέτ]ρε εἰς μνε[ίαν] / [ἔχετε τὸν ᾿Ιρ]ίνες φίλι[ον]/ — <strong>“保禄和伯多禄，请记念依莲娜所爱的人。”</strong></p><p>13070: Παυλε Πετρε | Χαλκηδονι ανιμα | βωβυς κομαν|[δ]ω Λαυrους/ — <strong>“保禄和伯多禄，我劳鲁斯（劳鲁西乌斯？）把卡尔克多尼乌斯的灵魂托付给你们！”</strong></p><p>13071: &lt;Π&gt;α[ῦλ]ος καὶ | Π[έτρο]ς συν|τηρή[σα]τε θ(εο)ῦ δούλους | πνεύματα | ἅγεια συντη|ρήσαται ἡμᾶ|ς ἴνα πολλοῖς | ἔτεσε[ι ζῶμεν]/ — <strong>“保禄和伯多禄，请保守天主的仆人！圣洁的灵啊，请保守我们，使我们长寿！”</strong></p><p>13073: [Παυλε] ετ Πετρε | [ιν με]ντε [ν]ος αβε|[τοτε εἰς το]ὺς ἐῶ[νας]/<strong> </strong>— <strong>“保禄和伯多禄，请永远记念我们……”</strong></p><h3><strong>promisit / votum fecit</strong> — <strong>许了愿</strong></h3><p>13091: [- - - i]dus m[- - -] | Eulogius votum f[ecit]/ — <strong>“［- - -］在月望日（idus）的［- - -］日，欧罗吉乌斯许了愿［- - -］。”</strong></p><h3><strong>提到 refrigerium</strong>（追思餐）：</h3><p>12942: refrigerav[it] | [F]elicissimus cum s[uis]/ — <strong>“费利齐西穆斯和家人一起举行了追思餐。”</strong></p><p>12981: Petro et Paulo | Tomius Coelius | refri`ger´&lt;i&gt;um feci/ — <strong>“我托米乌斯·科埃利乌斯为伯多禄和保禄举行了追思餐。”</strong></p><p>13003: [---] at Paulu[m] | et Pet[rum] | refri[geravi - - -]/ — <strong>“我在保禄和伯多禄那里举行了追思餐。”</strong></p><p>来源：<a href="http://csla.history.ox.ac.uk/record.php?recid=E05087">http://csla.history.ox.ac.uk/record.php?recid=E05087</a></p><hr><h3>向天主的呼求</h3><ul><li><p>DEVS TE PRECOR VТ PARADISVM LVCIS POSSIT VIDERE – “<strong>主啊，我求你，愿他得见乐园的光</strong>”。</p></li><li><p>DOMINE NE QVANDO ADVMBRETVR SPIRITVS VENERES – “<strong>主啊，愿维纳斯的灵魂永不被遮暗</strong>”。</p></li></ul><h3>请求亡者代求</h3><ul><li><p>ET IN ORATIONIS TVIS ROGES PRO NOBIS QVIA SCIMVS TE ☧ – “<strong>在你的祈祷中为我们祈求，因为我们知道你在基督内</strong>”。</p></li><li><p>ORO SCIO NAMQVE BEATAM – “<strong>我求你，因为我知道你在福乐中</strong>”。</p></li><li><p>ORA PRO PARENTI BVS TVIS – “<strong>为你的亲人祈祷</strong>”。</p></li><li><p>PETE PRO NOS VТ SALVI SIMVS – “<strong>为我们祈祷，使我们得救</strong>”。</p></li><li><p>IN ORATIONIS TVIS ROGES PRO NOBIS – “<strong>在你的祈祷中为我们祈求</strong>”。</p></li><li><p>ATTICE SPIRITVS TVS IN BONV ORA PRO PARENTIBVS TVIS – “<strong>阿提库斯，你的灵魂在福乐中，为你的亲人祈祷</strong>”。</p></li></ul><p>这里只列出了一部分。其余材料可以在链接中阅读。</p><h3><strong>铭文与象征性图像</strong></h3><ul><li><p>墓上也非常常见的 VIVAS 一词，即“<strong>愿你活着</strong>”，表达对亡者永生和福乐的愿望；</p></li><li><p>VIVAS IN DEO – “<strong>愿你在天主内活着</strong>”。</p></li><li><p>VIBAS IN SANCTIS – “<strong>愿你在圣人中间活着</strong>”。</p></li></ul><h3>亡者已得救</h3><p>有时说得更肯定，指出被埋葬者在蒙拣选的人中间：</p><ul><li><p>ACCEPIT REQVI EM IN DEO – “<strong>他在天主内得了安息</strong>”。</p></li><li><p>SCIMVS ТЕ IN – “<strong>我们知道你在基督内</strong>”。</p></li><li><p>FRVCTVOSVS ANIMA ТVА СVМ IVSTIS – “<strong>弗鲁克图奥苏斯，你的灵魂与义人同在</strong>”。</p></li><li><p>REQVI EM ADCEPIT IN DEO PATRE NOSTRO ET CHRISTO EIVS – “<strong>他在我们的父天主和他的基督内得了安息</strong>”。</p></li><li><p>ACCEPTA APVD DEVM – “<strong>被天主接纳（指女性）</strong>”。</p></li><li><p>RECEPTVS AD DEVM – “<strong>被接到天主那里</strong>”。</p></li><li><p>ТЕСVМ PAX CHRISTI – “<strong>基督的平安与你同在</strong>”。</p></li><li><p>SEMPER VIVE IN РАСЕ – “<strong>愿你永远活在平安中</strong>”。</p></li><li><p>IN РАСЕ ET IN DOMO AETERNA DEI – “<strong>在平安中，在天主永恒的家中</strong>”。</p></li><li><p>VIVI IN GLORIA DEI ET IN PACE DOMINI NOSTRI ☧ – “<strong>你活在天主的光荣和我们主基督的平安中</strong>”——这里救主的名字以其花押字 ☧ 表示；</p></li><li><p>ELATVS EST 也是一种欢呼，只出现过一两次，可以译为：“<strong>他已升到天主那里</strong>”。</p></li></ul><h3>乐园——光明之所</h3><p>在最初基督徒的墓志铭中，乐园被称为光明和光辉之所；这里举几个例子：</p><ul><li><p>CVIVS SPIRITVS IN LVCE DOMINI SVSCEPTVS EST – “<strong>他的灵魂被接入主的光中</strong>”。</p></li><li><p>IN CHRISTVM CREDENS PREMIA LVCIS АВЕТ – “<strong>他信基督，以光为赏报</strong>”。</p></li><li><p>AETERNA TIBI LUX TIMOTHEA IN ☧– “<strong>提摩泰娅，愿永恒的光在（基督）内照耀你</strong>”。</p></li></ul><h3></h3><p>书（俄语）：<strong>A.冯·弗里肯，《罗马地下墓穴与早期基督教艺术遗迹》，莫斯科：K. T. 索尔达琴科夫出版，1872—1885年。</strong>[2]</p>'
  references: |-
    <ol>
    <li><p><a href="https://vk.com/@aletheia-de-sanctis-venerandis">https://vk.com/@aletheia-de-sanctis-venerandis</a></p></li>
    <li><p><a href="https://azbyka.ru/otechnik/Istorija_Tserkvi/rimskie-katakomby-i-pamjatniki-pervonachalnogo-hristianskogo-iskusstva/2">https://azbyka.ru/otechnik/Istorija_Tserkvi/rimskie-katakomby-i-pamjatniki-pervonachalnogo-hristianskogo-iskusstva/2</a></p></li>
    </ol><p>译自俄语：罗季翁·弗拉索夫（借助人工智能）。圣经引文据思高本。</p>
