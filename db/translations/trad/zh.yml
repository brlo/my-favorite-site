  path: Lc4k_守斋饮食
  title: 守斋饮食
  title_sub:
  body: <p>本文只简要介绍守斋期间饮食的大致样貌，帮助以前没有守过斋、不习惯做斋食、不知道斋期可以做些什么的人找到方向。</p><blockquote><p>“主回答她说：‘玛尔大，玛尔大！你为了许多事操心忙碌，其实需要的惟有一件。玛利亚选择了更好的一分，是不能从她夺去的。’”（<a href="https://bibleox.com/zh-Hans/cn-sb/lk/10/#L41-42">路 10:41-42</a>）</p></blockquote><blockquote><p>“你们应当谨慎，免得你们的心为宴饮沉醉，及人生的挂虑所累时，那意想不到的日子临于你们”（<a href="https://bibleox.com/zh-Hans/cn-sb/lk/21/#L34">路 21:34</a>）</p></blockquote><h2>汤</h2><h3>蔬菜高汤（加炒洋葱和胡萝卜）</h3><p>几乎每一种都适合加土豆：</p><ul><li><p><strong>谷物汤</strong>（荞麦、米、珍珠麦、小扁豆、豌豆），</p></li><li><p><strong>意面汤</strong>，</p></li><li><p><strong>蔬菜汤</strong>，</p></li><li><p><strong>罗宋汤</strong>（甜菜汤），</p></li><li><p><strong>腌黄瓜汤</strong>（拉索利尼克），</p></li><li><p><strong>菜汤</strong>（希）（卷心菜汤），</p></li><li><p><strong>鱼汤</strong>（乌哈，在规定允许吃鱼时）。</p></li></ul><h2>配菜</h2><ul><li><p><strong>燕麦粥</strong>（燕麦片），</p></li><li><p><strong>煮</strong>米、荞麦、小扁豆、古斯米、布格麦、藜麦、玉米糊（玉米粉粥）等谷物。可加炒洋葱和胡萝卜。</p></li><li><p><strong>手抓饭</strong>（为了更饱，可以加鹰嘴豆），</p></li><li><p><strong>米饭什锦</strong>：夏威夷式、墨西哥式等，</p></li><li><p><strong>意面</strong>：煮的、先炒后煮的、蘑菇意面、加鱼罐头（金枪鱼、沙丁鱼等，在规定允许时）的，</p></li><li><p><strong>土豆</strong>：炸、烤、煮、土豆泥，</p></li><li><p><strong>炖卷心菜</strong>，</p></li><li><p><strong>蔬菜炖菜</strong>：土豆、胡萝卜、洋葱、西葫芦、甜椒、蘑菇、番茄酱或番茄、茄子，</p></li><li><p><strong>水煮蔬菜</strong>（菜花、西兰花、青豌豆、玉米），</p></li><li><p><strong>俄式饺子</strong>（瓦列尼基）：土豆、蘑菇、樱桃馅，</p></li><li><p><strong>豆腐</strong>，</p></li><li><p><strong>鹰嘴豆炒蔬菜</strong>，</p></li><li><p>炒<strong>蘑菇</strong>，</p></li><li><p>煎<strong>西葫芦</strong>，</p></li><li><p><strong>土豆饼</strong>（德拉尼基：擦丝的土豆或西葫芦、米粉或面粉、盐），</p></li><li><p><strong>普罗旺斯杂烩</strong>，</p></li><li><p><strong>烤南瓜</strong>，</p></li><li><p><strong>烤蔬菜</strong>，</p></li><li><p><strong>素肉饼</strong>（用芸豆做）。</p></li></ul><h2>沙拉</h2><ul><li><p><strong>生蔬菜沙拉</strong>：黄瓜、番茄、嫩卷心菜、红洋葱、生菜、甜椒、香草、香料，</p></li><li><p><strong>熟蔬菜沙拉</strong>：俄式甜菜沙拉（土豆、甜菜、胡萝卜、芸豆、罐头豌豆、腌黄瓜、洋葱、酸菜），</p></li><li><p><strong>大白菜沙拉</strong>：大白菜、玉米、斋期蛋黄酱[1]，</p></li><li><p><strong>煮甜菜</strong>拌斋期蛋黄酱[1]，</p></li><li><p><strong>水果沙拉</strong>，</p></li><li><p><strong>牛油果沙拉</strong>，</p></li></ul><h2>腌菜</h2><ul><li><p><strong>酸菜</strong>，</p></li><li><p><strong>黄瓜</strong>：腌的、淡腌的、拍黄瓜，</p></li><li><p>朝鲜族风味的凉拌<strong>胡萝卜</strong>，</p></li><li><p>醋腌<strong>洋葱</strong>，</p></li><li><p>等等。</p></li></ul><h2>面食</h2><ul><li><p><strong>面包</strong>，</p></li><li><p><strong>斋期小面包</strong>：可以用烤箱或平底锅烤，也可以在商店买，</p></li><li><p><strong>馅饼（皮罗什基）</strong>：樱桃馅、炖卷心菜馅、土豆洋葱馅，</p></li><li><p><strong>斋期薄饼</strong>（用水代替牛奶，用香蕉代替鸡蛋），</p></li></ul><h2>罐头和储存食品</h2><ul><li><p><strong>西葫芦</strong><strong>酱</strong>，</p></li><li><p><strong>茄子</strong><strong>酱</strong>，</p></li><li><p><strong>鹰嘴豆泥</strong>，</p></li><li><p><strong>玉米</strong>，</p></li><li><p><strong>蘑菇</strong>，</p></li><li><p><strong>芸豆</strong>，</p></li><li><p><strong>青豌豆</strong>，</p></li><li><p><strong>番茄干</strong>，</p></li><li><p>不加奶酪的<strong>牛油果酱</strong>，</p></li></ul><h2>干果</h2><ul><li><p><strong>坚果</strong>，</p></li><li><p>干的或冻干的<strong>浆果和水果</strong>，</p></li><li><p><strong>哈尔瓦（芝麻糖）</strong>，</p></li></ul><h2>三明治和小吃</h2><ul><li><p>蜂蜜面包片，</p></li><li><p>番茄、罗勒加盐的面包片。</p></li></ul><h2>饮品</h2><ul><li><p>格瓦斯（面包发酵饮料）</p></li><li><p>基塞尔（用淀粉勾芡的果汁饮料）</p></li><li><p>果汁甜汤（用新鲜浆果或干果煮）</p></li><li><p>莫尔斯（浆果果汁饮料）</p></li><li><p>果昔</p></li><li><p>柠檬水</p></li><li><p>茶</p></li><li><p>不加奶的咖啡</p></li><li><p>水</p></li></ul>
  references: "<ol><li><p><strong>斋期蛋黄酱</strong>：罐头豌豆的汤汁、植物油、芥末、盐、糖、醋，用搅拌机打匀。</p></li></ol><p>译自俄语：罗季翁·弗拉索夫（借助人工智能）。圣经引文据思高本。</p>"
