  title: 古代圣像集
  title_sub: 基督、诞神女、宗徒和其他圣人的古代基督教圣像
  body: <h2>约公元前15世纪</h2><h3>会幕</h3><p>在圣所中间的帐幔上（圣所与至圣所之间）绣有革鲁宾（<a href="https://bibleox.com/zh-Hans/cn-sb/ish/26/#L31">出 26:31</a>），四周的幔子（墙）上也有（<a href="https://bibleox.com/zh-Hans/cn-sb/ish/26/#L1">出 26:1</a>；<a href="https://bibleox.com/zh-Hans/cn-sb/ish/36/#L8">出 36:8</a>），但这幅图的作者没有画出来。会幕是天上实在的像（圣像）（<a href="https://bibleox.com/zh-Hans/cn-sb/ish/25/#L8-9,40">出 25:8-9,40</a>；<a href="https://bibleox.com/zh-Hans/cn-sb/evr/9/#L24">希 9:24</a>；<a href="https://bibleox.com/zh-Hans/cn-sb/act/7/#L44">宗 7:44</a>）。天主命人敬重圣所（<a href="https://bibleox.com/zh-Hans/cn-sb/lev/19/#L30">肋 19:30</a>；<a href="https://bibleox.com/zh-Hans/cn-sb/lev/26/#L2">肋 26:2</a>）。</p><img src="https://res.bibleox.com/s/img/image/simple/471/s_p_P2j4gLJt9iKSnkge.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/471/m_p_P2j4gLJt9iKSnkge.jpg">放大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/472/m_p_bNPh6hCNJDhzahar.jpg">外观</a>]</p><h3>约柜</h3><p>约柜上有两个革鲁宾天使的像（<a href="https://bibleox.com/ru/ru/w/%D0%BA%D0%BE%D0%B2%D1%87%D0%B5%D0%B3_%D0%B7%D0%B0%D0%B2%D0%B5%D1%82%D0%B0/">经文出处</a>）。先知若苏厄在约柜前俯伏（<a href="https://bibleox.com/zh-Hans/cn-sb/nav/7/#L6">苏 7:6</a>）。</p><img src="https://res.bibleox.com/s/img/image/simple/469/s_p_DUn5vqnI4F8yRiNA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/469/m_p_DUn5vqnI4F8yRiNA.jpg">放大</a>]</p><h3>以色列的营地</h3><p>以色列以十字形移动（<a href="https://bibleox.com/ru/ru/w/%D0%B5%D0%B2%D1%80%D0%B5%D0%B9%D1%81%D0%BA%D0%B8%D0%B9-%D1%81%D1%82%D0%B0%D0%BD-%D0%BA%D1%80%D0%B5%D1%81%D1%82/">经文出处</a>）。</p><img src="https://res.bibleox.com/s/img/image/simple/470/s_p_t8tRbbwlzsBzyVzk.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/470/m_p_t8tRbbwlzsBzyVzk.jpg">放大</a>]</p><h2>约公元前10世纪</h2><h3>撒罗满在耶路撒冷建造的圣殿</h3><p>雕刻的革鲁宾像在圣殿的墙上（<a href="https://bibleox.com/zh-Hans/cn-sb/3ts/6/#L32">列上 6:32</a>）、入口的门上（<a href="https://bibleox.com/zh-Hans/cn-sb/3ts/6/#L32">列上 6:32</a>；<a href="https://bibleox.com/zh-Hans/cn-sb/3ts/6/#L35">列上 6:35</a>）和至圣所入口前的帐幔上（<a href="https://bibleox.com/zh-Hans/cn-sb/2par/3/#L14">编下 3:14</a>；<a href="https://bibleox.com/zh-Hans/cn-sb/1mak/1/#L22">加上 1:22</a>）。至圣所里立着两座镀金的大木质革鲁宾像（<a href="https://bibleox.com/zh-Hans/cn-sb/3ts/6/#L23">列上 6:23</a>）。约柜的盖上做了两座革鲁宾像（<a href="https://bibleox.com/zh-Hans/cn-sb/ish/25/#L18-20">出 25:18-20</a>）。在圣殿的院子里，洗濯盆的大座架上刻有狮子、牛和革鲁宾（<a href="https://bibleox.com/zh-Hans/cn-sb/3ts/7/#L28-29">列上 7:28-29</a>）。（<a href="https://bibleox.com/ru/ru/w/%D0%B8%D0%B5%D1%80%D1%83%D1%81%D0%B0%D0%BB%D0%B8%D0%BC%D1%81%D0%BA%D0%B8%D0%B9-%D1%85%D1%80%D0%B0%D0%BC/">详见</a>）</p><p>先知达味向着圣殿俯伏（<a href="https://bibleox.com/zh-Hans/cn-sb/ps/5/#L8">咏 5:8</a>；<a href="https://bibleox.com/zh-Hans/cn-sb/ps/99/#L5">咏 99:5</a>；<a href="https://bibleox.com/zh-Hans/cn-sb/ps/132/#L7">咏 132:7</a>），借着这个像向天主表示敬意。</p><img src="https://res.bibleox.com/s/img/image/simple/468/s_p_lv7GzNtM53C4Zqgr.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/468/m_p_lv7GzNtM53C4Zqgr.jpg">放大</a>]</p><h2>2世纪</h2><h3>抱着婴孩耶稣的诞神女，一位先知指着星（罗马）</h3><p>2世纪至3世纪初。普里西拉地下墓穴[6]。这是最古老的诞神女像。诞神女身旁的人似乎左手拿着书，右手的手指指着一颗星。</p><img src="https://res.bibleox.com/s/img/image/simple/6751b012dba7720001514f69/s_p_jNTGMwic6Cse9xDG.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6751b012dba7720001514f69/m_p_jNTGMwic6Cse9xDG.jpg">放大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/67618740dba7720001cd0e2c/m_p_ckKuGWqzHuN1tR5Q.jpg">版本 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686cf0535f47da2505d3ae4d/m_p_dajA4xvStk0EnnSq.jpg">版本 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686cf7725f47da2505d3ae50/m_p_n79yEKK4QSCeorx3.jpg">版本 4</a>] [<a href="https://res.bibleox.com/s/img/image/simple/442/m_p_5zQEQbMmBkEs9J2S.jpg">版本 5</a>]</p><p>诞神女身旁的人可能是说过这预言的先知依撒意亚：</p><blockquote><p>“为此，吾主要亲自给你们一个征兆：看，<strong>有位贞女要怀孕生子</strong>，给他起名叫厄玛奴耳”（<a href="https://bibleox.com/zh-Hans/cn-sb/is/7/#L16">依 7:16</a>）</p></blockquote><p>或者是巴郎：</p><blockquote><p>“我看见他，却不是在现在；我望见他，却不是在近处：<strong>由雅各伯将出现一颗星</strong>，由以色列将兴起一权杖，击碎摩阿布的额角，粉碎舍特一切子民的脑盖”（<a href="https://bibleox.com/zh-Hans/cn-sb/chis/24/#L17">户 24:17</a>）</p></blockquote><p>或者画家只是用这种手法代替说明文字。他邀请我们拿起书来，读关于升起之星的预言，明白他画的是这预言所说的那一位的诞生，也就是救主由贞女诞生。</p><h3>善牧基督</h3><p>2世纪末。罗马。加里斯都地下墓穴（<a href="https://en.wikipedia.org/wiki/Catacomb_of_Callixtus#Paintings">Callixitus Catacomb, Crypt of Lucina</a>）。</p><img src="https://res.bibleox.com/s/img/image/simple/473/s_p_mrIYHR2oqLQuPn0z.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/473/m_p_mrIYHR2oqLQuPn0z.jpg">放大</a>]</p><h2>3世纪</h2><h3>诞神女“奥兰塔”（祈祷者）（罗马）</h3><p>Catacomba Maggiore，罗马[26][27]。前景画的是童贞玛利亚和婴孩基督。</p><img src="https://res.bibleox.com/s/img/image/simple/6751fe6ddba7720001514f7e/s_p_C1Iw2V4OhNy1SGOE.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6751fe6ddba7720001514f7e/m_p_C1Iw2V4OhNy1SGOE.jpg">放大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686cefb35f47da2505d3ae4c/m_p_70zYu2r0np0WFNUu.jpg">版本 2</a>]</p><h3>基督、宗徒、殉道者戈尔戈尼、伯多禄、玛策林和提布尔齐（罗马）</h3><p>玛策林和伯多禄地下墓穴</p><img src="https://res.bibleox.com/s/img/image/simple/6752012adba7720001514f82/s_p_x5I0ahjwMz1X5LoJ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6752012adba7720001514f82/m_p_x5I0ahjwMz1X5LoJ.jpg">放大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686d237a5f47da2505d3ae56/m_p_ST9me27UGtWHYDBc.jpg">版本 2</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/676082a6dba7720001cd0e22/s_p_YjPD3PzLDCF4wgh1.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/676082a6dba7720001cd0e22/m_p_YjPD3PzLDCF4wgh1.jpg">放大</a>]</p><h3>一位妇女向善牧祈祷（罗马）</h3><p>3世纪。普里西拉地下墓穴[6]。</p><p>这些画构成一个整体。画家这样安排：四周画的祈祷者都望向房间顶部并举起双手，那里画的是作为<strong>善牧</strong>的基督（<a href="https://bibleox.com/zh-Hans/cn-sb/in/10/#L11">若 10:11</a>）。善牧周围的所有场景都有一个共同的主题：<strong>从死亡中得救</strong>。</p><img src="https://res.bibleox.com/s/img/image/simple/686bea5b5f47da2505d3ae31/s_p_pjRHeoFaUpKPoyEH.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686bea5b5f47da2505d3ae31/m_p_pjRHeoFaUpKPoyEH.jpg">放大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686cf7375f47da2505d3ae4f/m_p_MOsOWI2vEXUj5ELf.jpg">版本 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6904b3f2205184ec278d6e53/m_p_0GRveVCOh2GBz7eq.jpg">版本 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/431/m_p_LUZsrJtesEWiwHBO.jpg">版本 4</a>]</p><p>善牧就是基督（<a href="https://bibleox.com/zh-Hans/cn-sb/lk/15/#L6-7">路 15:6-7</a>；<a href="https://bibleox.com/zh-Hans/cn-sb/in/10/#L1-21">若 10:1-21</a>；<a href="https://bibleox.com/zh-Hans/cn-sb/ps/23/">咏 23</a>）。</p><img src="https://res.bibleox.com/s/img/image/simple/69319f74205184ec278d6fa7/s_p_GR8gHxKZuC87xqlf.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69319f74205184ec278d6fa7/m_p_GR8gHxKZuC87xqlf.jpg">放大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686d2ac55f47da2505d3ae59/m_p_JDvtNt9RJrqnAsEW.jpg">版本 2</a>]</p><p>一位蒙头的妇女举起双手祈祷（可能是撒辣：<a href="https://bibleox.com/zh-Hans/cn-sb/gen/18/#L1-15">创 18:1-15</a> 和 <a href="https://bibleox.com/zh-Hans/cn-sb/gen/21/#L1-7">创 21:1-7</a>）。</p><img src="https://res.bibleox.com/s/img/image/simple/686bea885f47da2505d3ae32/s_p_79wnuevuFIi3tnrH.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686bea885f47da2505d3ae32/m_p_79wnuevuFIi3tnrH.jpg">放大</a>]</p><p>右边是旧约场景：三位青年（<a href="https://en.wikipedia.org/wiki/Catacomb_of_Priscilla#/media/File:Shadrach,_Meshach,_and_Abednego_in_the_fiery_furnace,_from_the_book_Die_Malereien_der_Katakomben_Roms,_plate_78,_levels_adjusted.jpg">沙得辣客、默舍客和阿贝得讷哥</a>）举起双手祈祷（<a href="https://bibleox.com/zh-Hans/cn-sb/dan/3/">达 3</a>）。</p><img src="https://res.bibleox.com/s/img/image/simple/686cfc565f47da2505d3ae52/s_p_NmZJuoF70d9qohZs.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686cfc565f47da2505d3ae52/m_p_NmZJuoF70d9qohZs.jpg">放大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686cfc475f47da2505d3ae51/m_p_qzHB83d52LoU7QQL.jpg">版本 2</a>]</p><p>左边是旧约场景：亚巴郎和依撒格带着献祭用的木柴（<a href="https://bibleox.com/zh-Hans/cn-sb/gen/22/#L1-19">创 22:1-19</a>）。</p><img src="https://res.bibleox.com/s/img/image/simple/686d33c45f47da2505d3ae5a/s_p_QQLn5T52hx8gSrBf.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d33c45f47da2505d3ae5a/m_p_QQLn5T52hx8gSrBf.jpg">放大</a>]</p><p>入口上方画着被海中巨兽吞下的先知约纳（<a href="https://bibleox.com/zh-Hans/cn-sb/ion/2/#L1">纳 2:1</a>）。</p><img src="https://res.bibleox.com/s/img/image/simple/476/s_p_aHV4YSuoWhVZ1H5y.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/476/m_p_aHV4YSuoWhVZ1H5y.jpg">放大</a>]</p><p>房间正面所画的祈祷妇女生平的场景值得更详细地描述。</p><img src="https://res.bibleox.com/s/img/image/simple/686d36265f47da2505d3ae5d/s_p_MGpxKQ94pikRfgFK.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d36265f47da2505d3ae5d/m_p_MGpxKQ94pikRfgFK.jpg">放大</a>]</p><p><strong>正面场景中的事件</strong></p><p>房间构图的每一部分都画一个场景，所有场景都是基督教主题的重要组成部分。上面是善牧，左边是亚巴郎，右边是三位青年，通道上是先知约纳。因此可以推测，画家在难以确定解释的房间正面也遵守了这个规则（一部分一个重要场景）。以下只是一个推测。由于除中央外各面都画着旧约场景，正面可能画的是哈加尔的故事（<a href="https://bibleox.com/zh-Hans/cn-sb/gen/16/">创 16</a>、<a href="https://bibleox.com/zh-Hans/cn-sb/gen/21/">创 21</a>）。若是这样，先画的是亚巴郎和带着儿子依市玛耳被赶走的哈加尔（1），然后是撒辣的祈祷（2），再后是哺育孩子的哈加尔（3）。</p><p>我们来更仔细地看看这个解释：</p><p><strong>1. 哈加尔被赶走</strong>。几乎可以肯定，坐着的是亚巴郎（他的头发和胡须与对面亚巴郎壁画中的一样）。穿黄衣的大概是哈加尔（黄色可能表示奴婢的身份）。她手里似乎拿着水皮囊（<a href="https://bibleox.com/zh-Hans/cn-sb/gen/21/#L14">创 21:14</a>）。她身后可能是她的儿子依市玛耳，被赶走时他应已超过15岁（<em>依市玛耳生时亚巴郎86岁</em><a href="https://bibleox.com/zh-Hans/cn-sb/gen/16/#L16">创 16:16</a><em>，依撒格生时亚巴郎100岁</em><a href="https://bibleox.com/zh-Hans/cn-sb/gen/21/#L5">创 21:5</a><em>，哈加尔在依撒格长大断奶时被赶走</em><a href="https://bibleox.com/zh-Hans/cn-sb/gen/21/#L8-13">创 21:8-13</a>）。这人看起来像系着围裙的女子，但若是如此，那只能是哈加尔本人（未婚女子不蒙头），而拿着水皮囊的就是依市玛耳。无论如何，剩下的两人最可能是哈加尔和依市玛耳。也可能这个构图不是分开的几部分，而是一幅完整的画，因为抱着孩子的妇女正望着举起双手的妇女。</p><img src="https://res.bibleox.com/s/img/image/simple/686d33c95f47da2505d3ae5b/s_p_kuEcuyUnGenBuWPw.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d33c95f47da2505d3ae5b/m_p_kuEcuyUnGenBuWPw.jpg">放大</a>]</p><p><strong>2. 撒辣的祈祷</strong>。穿红衣、蒙着头的撒辣在向天主祈祷。红衣表示身份高贵，蒙头表示已婚。</p><img src="https://res.bibleox.com/s/img/image/simple/686d3a855f47da2505d3ae5e/s_p_rpl3jnuNnx8ZisdR.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d3a855f47da2505d3ae5e/m_p_rpl3jnuNnx8ZisdR.jpg">放大</a>]</p><p><strong>3. 哈加尔哺育孩子</strong>。支持哈加尔这个解释的是：她没有蒙头（即未婚），发型与第一幕中穿黄衣的人相同。她那特别的目光也透露了她的身份：她望着与她关系紧张的撒辣。有趣的是，画家把她画得和左边坐着的亚巴郎一模一样：坐在椅子上，衣服完全相同（竖条纹、袖子上两道条纹、斗篷）。</p><img src="https://res.bibleox.com/s/img/image/simple/686d22a05f47da2505d3ae54/s_p_8fxd9vcRlXYszSJU.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d22a05f47da2505d3ae54/m_p_8fxd9vcRlXYszSJU.jpg">放大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686d33cd5f47da2505d3ae5c/m_p_qKPp740xLZNuDEFs.jpg">版本 2</a>]</p><p><strong>整个房间的思想：从死亡中得救</strong></p><p>这个墓室（cubiculum）的构图有一个共同而美好的思想：从死亡中得救。整个故事由下而上逐层升高：</p><ul><li><p>最下层：埋葬在这里的基督徒，他们相信战胜死亡的基督。</p></li><li><p>中层：关于从死亡中得救的圣经故事：</p><ul><li><p>巴比伦火窑中的三位青年得救，免于被火烧死；</p></li><li><p>先知约纳在海中巨兽腹中得救，免于死亡；</p></li><li><p>依撒格得救，免于被献为祭品，代替他献上的是一只公绵羊；</p></li><li><p>哈加尔和儿子依市玛耳在旷野中得救，免于死亡。</p></li></ul></li><li><p>倒数第二层：基督教的象征，孔雀（复活、不朽、永生）和鹧鸪（灵魂）。一只鹧鸪站在活的植物旁（象征生命），另一只站在枯萎的植物旁（象征死亡）。孔雀也是这样站着。</p></li><li><p>天花板中央：拯救信徒脱离死亡的善牧。值得注意的是，这里还有一个关于从死亡中得救的小暗示：善牧的左右分别是诺厄从方舟放出的乌鸦和衔着橄榄枝的鸽子。这样，在方舟中免于死亡的人们，由这些鸟引到拯救人脱离死亡的那一位——基督那里。</p></li></ul><h3>杜拉欧罗普斯的教堂（叙利亚）</h3><p>244年。杜拉欧罗普斯的教堂除了旧约事件外，还有新约场景的壁画：将要沉没的宗徒伯多禄得救，在羊池旁治好瘫子。另见<a href="https://vk.com/@aletheia-de-sacris-imaginibus-venerandis?anchor=v-drugie-svyaschennye-izobrazhenia-v-donikeyskiy-period">文章</a>。</p><p><strong>善牧基督（洗礼室的主要景观）</strong></p><img src="https://res.bibleox.com/s/img/image/simple/6931870c205184ec278d6fa2/s_p_uBkNi8jGsMFpOQSM.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931870c205184ec278d6fa2/m_p_uBkNi8jGsMFpOQSM.jpg">放大</a>]</p><p><strong>将要沉没的宗徒伯多禄得救</strong></p><img src="https://res.bibleox.com/s/img/image/simple/692c8038205184ec278d6f9e/s_p_QQ2Rml8gUWsyQtS9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c8038205184ec278d6f9e/m_p_QQ2Rml8gUWsyQtS9.jpg">放大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6786b88ddba77200015ae11c/m_p_do380IVDukCAfdFk.jpg">版本 2</a>]</p><p><strong>在羊池旁治好瘫子</strong></p><img src="https://res.bibleox.com/s/img/image/simple/6786b889dba77200015ae11b/s_p_k1a5GDBvfzTCWmZv.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6786b889dba77200015ae11b/m_p_k1a5GDBvfzTCWmZv.jpg">放大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6786bb0bdba77200015ae11d/m_p_dCRD85foL69l7kih.jpg">另一版本</a>]</p><h3>善牧基督，先知约纳</h3><p>3世纪末至4世纪初。罗马。玛策林和伯多禄地下墓穴。</p><p>中央是善牧基督。中央两侧画着约纳。左边的壁画中约纳被从船上扔下，右边鲸鱼吞下了他。</p><img src="https://res.bibleox.com/s/img/image/simple/478/s_p_yvJcnbLGPxZ6AzRu.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/478/m_p_yvJcnbLGPxZ6AzRu.jpg">放大</a>]</p><p>先知约纳</p><img src="https://res.bibleox.com/s/img/image/simple/481/s_p_7z5j4tAimokFaRMN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/481/m_p_7z5j4tAimokFaRMN.jpg">放大</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/480/s_p_b8gqyOenKZcn2MCp.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/480/m_p_b8gqyOenKZcn2MCp.jpg">放大</a>]</p><h3>善牧基督</h3><p>3世纪。罗马。加里斯都地下墓穴（<a href="https://en.wikipedia.org/wiki/Catacomb_of_Callixtus#Paintings">Callixitus Catacomb, Crypt of Lucina</a>）。可以推测桶里装的是奶，象征圣体圣血（参见亚历山大的克莱孟）。</p><img src="https://res.bibleox.com/s/img/image/simple/474/s_p_zcLmMd2qkyG3pDoj.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/474/m_p_zcLmMd2qkyG3pDoj.jpg">放大</a>]</p><h3>善牧，希萨尔泰佩墓地，尼西亚（伊兹尼克）</h3><p>约3世纪。这是最近的发现，年代是推测的（<a href="https://www.arkeolojikhaber.com/haber-iznikte-benzersiz-bir-kesif-anadolunun-tek-coban-isa-figuru-gun-yuzune-cikarildi-43079/">详见</a>）。这片墓地从2世纪用到5世纪。</p><p>坐标：40.78204218462122, 29.928491677648932。土耳其语地名：Hasartep Nekropolü。</p><img src="https://res.bibleox.com/s/img/image/simple/69444e49205184ec278d6fdb/s_p_SZTpvcDdpodujcbM.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69444e49205184ec278d6fdb/m_p_SZTpvcDdpodujcbM.jpg">放大</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6941a813205184ec278d6fda/s_p_CUoa7dSy5UxGf1UD.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6941a813205184ec278d6fda/m_p_CUoa7dSy5UxGf1UD.jpg">放大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6941a80f205184ec278d6fd9/m_p_xSCaRt10DUUReyMt.jpg">版本 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/693c7d1a205184ec278d6fcb/m_p_mR5ZaVgXbezmXDyo.jpg">版本 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/693d606b205184ec278d6fd3/m_p_TKCjvhxmnq0q50tW.jpg">版本 4</a>] [<a href="https://res.bibleox.com/s/img/image/simple/693d6101205184ec278d6fd7/m_p_1i6aL6lfDR08iA13.jpg">版本 5</a>] [<a href="https://res.bibleox.com/s/img/image/simple/693d60f8205184ec278d6fd6/m_p_b2uUaO6tzciaKAgC.jpg">版本 6</a>] [<a href="https://res.bibleox.com/s/img/image/simple/693d60f1205184ec278d6fd5/m_p_bErh7lbI0e08hPaa.jpg">版本 7</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/693c7db2205184ec278d6fd2/s_p_wCZsWPWG7jCNLjIr.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/693c7db2205184ec278d6fd2/m_p_wCZsWPWG7jCNLjIr.jpg">放大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/693d60ad205184ec278d6fd4/m_p_BCvsIiJX10j2Mf2k.jpg">男子和女子</a>] [<a href="https://res.bibleox.com/s/img/image/simple/693c7daa205184ec278d6fd1/m_p_cjk36Xjpev9EFq2h.jpg">女子</a>]</p><h3>结婚戒指（拜占庭）</h3><p>3—4世纪。<a href="https://www.metmuseum.org/art/collection/search/663485">大都会艺术博物馆（第五大道，美国）</a>。（希腊语 χάρις——恩宠）</p><img src="https://res.bibleox.com/s/img/image/simple/68b5da8b45c75323d28a5e99/s_p_GNh1S8L7fcowsMEE.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5da8b45c75323d28a5e99/m_p_GNh1S8L7fcowsMEE.jpg">放大</a>]</p><h3>举行圣体圣血礼仪</h3><p>3世纪。罗马。加里斯都地下墓穴（<a href="https://en.wikipedia.org/wiki/Catacomb_of_Callixtus#Paintings">Callixitus Catacomb, Crypt of Lucina</a>）。画的可能是一位司祭和与他共祭的辅祭。今天正教会的教堂中也是这样举行圣体圣血礼仪：司祭举起双手，辅祭指向圣礼物。</p><img src="https://res.bibleox.com/s/img/image/simple/479/s_p_Zbn405P2krjwNAYl.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/479/m_p_Zbn405P2krjwNAYl.jpg">放大</a>]</p><h2>4世纪</h2><h3>基督（罗马）</h3><p>科莫迪拉地下墓穴。</p><img src="https://res.bibleox.com/s/img/image/simple/66cc2bd6dba77200019bc7d2/s_p_7xYGBb9wCmxBIGrZ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/66cc2bd6dba77200019bc7d2/m_p_7xYGBb9wCmxBIGrZ.jpg">放大</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686d23425f47da2505d3ae55/s_p_LzqgbhnIsbqtghoc.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d23425f47da2505d3ae55/m_p_LzqgbhnIsbqtghoc.jpg">放大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a1e1205184ec278d6fa8/m_p_KC0MljXJf5po70pj.jpg">版本 2</a>]</p><h3>基督和宗徒（罗马）</h3><p>约350年。[8][9] 圣科斯坦扎陵墓。</p><img src="https://res.bibleox.com/s/img/image/simple/686990665f47da2505d3ae19/s_p_5RDr4ou4ExBAh4KE.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686990665f47da2505d3ae19/m_p_5RDr4ou4ExBAh4KE.jpg">放大</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686990425f47da2505d3ae17/s_p_CXn5KmuiWradhOvh.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686990425f47da2505d3ae17/m_p_CXn5KmuiWradhOvh.jpg">放大</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686990545f47da2505d3ae18/s_p_IkgteAcecXoMC106.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686990545f47da2505d3ae18/m_p_IkgteAcecXoMC106.jpg">放大</a>]</p><h3>泉中圣若望洗礼堂（那不勒斯）</h3><p>350—400年。[11][12]</p><img src="https://res.bibleox.com/s/img/image/simple/6869924c5f47da2505d3ae1a/s_p_t1iU8sClY3pnOnkK.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6869924c5f47da2505d3ae1a/m_p_t1iU8sClY3pnOnkK.jpg">放大</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686992505f47da2505d3ae1b/s_p_BrRKZmtReJbgXm0w.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686992505f47da2505d3ae1b/m_p_BrRKZmtReJbgXm0w.jpg">放大</a>]</p><h3>基督和天使，再临（塞萨洛尼基，拜占庭）</h3><p>4世纪末。[17][18] 胜利者圣乔治圆形大殿（原为伽列里乌斯皇帝的陵墓）。</p><img src="https://res.bibleox.com/s/img/image/simple/6931a254205184ec278d6fa9/s_p_bWn7Chqiox5UOEd4.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931a254205184ec278d6fa9/m_p_bWn7Chqiox5UOEd4.jpg">放大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a2ba205184ec278d6faa/m_p_ROPWmBVyUxWMGo9Z.jpg">版本 2</a>]</p><p>马赛克保存得不好。基督像只剩下光环的一部分、一只手和十字架。周围天使的面容清晰可见。</p><img src="https://res.bibleox.com/s/img/image/simple/686a91695f47da2505d3ae1f/s_p_EoOSmhaBPsy32XQQ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686a91695f47da2505d3ae1f/m_p_EoOSmhaBPsy32XQQ.jpg">放大</a>]</p><h3>圣主教、军人、医生（塞萨洛尼基，拜占庭）</h3><p>4世纪末。[17][18] 胜利者圣乔治圆形大殿（原为伽列里乌斯皇帝的陵墓）。</p><p>马赛克中有名叫罗曼、济利禄、良、敖乃息佛洛、欧卡尔皮、巴西利斯克、波菲利、费肋孟、普里斯克、特林、葛斯默和达弥盎的圣主教、军人、医生和乐师的像。</p><img src="https://res.bibleox.com/s/img/image/simple/686aa0275f47da2505d3ae21/s_p_oIksDo9rIgSoAXvG.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa0275f47da2505d3ae21/m_p_oIksDo9rIgSoAXvG.jpg">放大</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686aa02e5f47da2505d3ae22/s_p_nTZtC6C93KI8Fu6I.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa02e5f47da2505d3ae22/m_p_nTZtC6C93KI8Fu6I.jpg">放大</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686aa0335f47da2505d3ae23/s_p_b1KhWllqTzipVhO9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa0335f47da2505d3ae23/m_p_b1KhWllqTzipVhO9.jpg">放大</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686aa0385f47da2505d3ae24/s_p_vvlbG9E89B9T0U8j.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa0385f47da2505d3ae24/m_p_vvlbG9E89B9T0U8j.jpg">放大</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686aa03f5f47da2505d3ae25/s_p_d3lcRobegfAQOf6e.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa03f5f47da2505d3ae25/m_p_d3lcRobegfAQOf6e.jpg">放大</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686aa0555f47da2505d3ae27/s_p_h1YgFpMukwaYc23Q.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa0555f47da2505d3ae27/m_p_h1YgFpMukwaYc23Q.jpg">放大</a>]</p><p>圣葛斯默和圣达弥盎</p><img src="https://res.bibleox.com/s/img/image/simple/686aa04e5f47da2505d3ae26/s_p_LwMjPHLsabDDxEHy.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa04e5f47da2505d3ae26/m_p_LwMjPHLsabDDxEHy.jpg">放大</a>]</p><h3>在两个强盗中间被钉十字架的基督像（罗马）</h3><p>4世纪初［一般认为这扇门作于约430年］。圣撒比纳大殿，一块门板。十字架苦刑的浮雕。</p><img src="https://res.bibleox.com/s/img/image/simple/676183a8dba7720001cd0e2b/s_p_ccaA7HzLPDInwe1b.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/676183a8dba7720001cd0e2b/m_p_ccaA7HzLPDInwe1b.jpg">放大</a>]</p><h3>主进耶路撒冷（拜占庭）</h3><p>4世纪初。<a href="https://www.metmuseum.org/art/collection/search/466220">大都会艺术博物馆（第五大道，美国）</a>。67.3 × 212.1 × 61.9 厘米。</p><img src="https://res.bibleox.com/s/img/image/simple/68b5e69845c75323d28a5e9d/s_p_Kk1dIB2OLr1OjQ1O.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5e69845c75323d28a5e9d/m_p_Kk1dIB2OLr1OjQ1O.jpg">放大</a>]</p><h3>基督，石板（克森尼索）</h3><p>300—500年。<a href="https://collections.louvre.fr/en/ark:/53355/cl010276835">卢浮宫（法国）</a>。博物馆称另一部分保存在艾尔米塔什。上面刻着对宗徒伯多禄说的话。</p><img src="https://res.bibleox.com/s/img/image/simple/68c41cec6594f46d35a87f04/s_p_esWl4etLsBMVz9bw.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c41cec6594f46d35a87f04/m_p_esWl4etLsBMVz9bw.jpg">放大</a>]</p><h3>导师基督（罗马）</h3><p>多弥提拉地下墓穴。墓室半圆壁（lunette）上的壁画。</p><img src="https://res.bibleox.com/s/img/image/simple/674ed2a4dba77200011c738a/s_p_4M8Vki7GNJBHkJPN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674ed2a4dba77200011c738a/m_p_4M8Vki7GNJBHkJPN.jpg">放大</a>]</p><h3>主耶稣基督（罗马）</h3><p>3—5世纪。杰内罗萨地下墓穴 [7]</p><img src="https://res.bibleox.com/s/img/image/simple/674f2408dba77200011c739c/s_p_zVliPTIYBpqqnTGQ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f2408dba77200011c739c/m_p_zVliPTIYBpqqnTGQ.jpg">放大</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6931a55a205184ec278d6faf/s_p_xXRXPudiFDi6GltL.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931a55a205184ec278d6faf/m_p_xXRXPudiFDi6GltL.jpg">放大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686bf5b25f47da2505d3ae36/m_p_Io7kaT9uNdBPFcSj.jpg">版本 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a5b6205184ec278d6fb0/m_p_btFyqkRBFzGf0FSH.jpg">版本 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a5e4205184ec278d6fb1/m_p_wuVaj4ghYuk6s5cc.jpg">版本 4</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a5fe205184ec278d6fb2/m_p_mO6KaZXywWX76vBg.jpg">版本 5</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a656205184ec278d6fb3/m_p_eqLfG1BFyG45i90X.jpg">版本 6</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a858205184ec278d6fb5/m_p_EVVCP1plDQZ4XgAS.jpg">版本 7</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6931a360205184ec278d6fab/s_p_hObpAcapDVZvLsC1.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931a360205184ec278d6fab/m_p_hObpAcapDVZvLsC1.jpg">放大</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6931a369205184ec278d6fad/s_p_8bP3aXtUgkNcP9gz.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931a369205184ec278d6fad/m_p_8bP3aXtUgkNcP9gz.jpg">放大</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6931a363205184ec278d6fac/s_p_BcSN3IXA4JYFLpgA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931a363205184ec278d6fac/m_p_BcSN3IXA4JYFLpgA.jpg">放大</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6931a36f205184ec278d6fae/s_p_6J6vSMM0TM5tc59T.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931a36f205184ec278d6fae/m_p_6J6vSMM0TM5tc59T.jpg">放大</a>]</p><h3>圣维亚特里克斯和圣辛普利齐（或鲁弗斯）（罗马）</h3><p>3—5世纪。杰内罗萨地下墓穴 [7]</p><img src="https://res.bibleox.com/s/img/image/simple/66cc2c40dba77200019bc7d8/s_p_zABjPHGhPdjGVh3U.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/66cc2c40dba77200019bc7d8/m_p_zABjPHGhPdjGVh3U.jpg">放大</a>]</p><h3>宗徒伯多禄和保禄（罗马）</h3><p>约380年。圣德克拉地下墓穴，壁画 [24]</p><p>画的是宗徒伯多禄、保禄、安德肋和若望。</p><img src="https://res.bibleox.com/s/img/image/simple/686bf38e5f47da2505d3ae35/s_p_BxfiObhkLMfci8nP.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686bf38e5f47da2505d3ae35/m_p_BxfiObhkLMfci8nP.jpg">放大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/687291145f47da2505d3ae8b/m_p_WXlkaMJTOrIzlOdI.jpg">版本 2</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/68b6cd4802e89ba22dfc3977/s_p_kAWGH2VPHMkRv9cL.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b6cd4802e89ba22dfc3977/m_p_kAWGH2VPHMkRv9cL.jpg">放大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686bf5bf5f47da2505d3ae37/m_p_F0tsoqA9bv6CrpfE.jpg">版本 2</a>]</p><h3>宗徒伯多禄和保禄（拜占庭）</h3><p>4世纪中叶。基督把殉道者的冠冕赐给宗徒伯多禄和保禄。<a href="https://www.metmuseum.org/art/collection/search/463547">大都会艺术博物馆（第五大道，美国）</a>。罗马或拜占庭。13.8 × 12.5 × 5 厘米。</p><img src="https://res.bibleox.com/s/img/image/simple/68b5f5d745c75323d28a5ebc/s_p_MiCffui3hayo2BCt.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5f5d745c75323d28a5ebc/m_p_MiCffui3hayo2BCt.jpg">放大</a>]</p><hr><p>4世纪中叶。<a href="https://www.metmuseum.org/art/collection/search/468386">大都会艺术博物馆（第五大道，美国）</a>。罗马或拜占庭。8.5 × 14 × 13.3 厘米。</p><img src="https://res.bibleox.com/s/img/image/simple/68b5e89c45c75323d28a5ea1/s_p_HAfNPGdEHMp67CuN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5e89c45c75323d28a5ea1/m_p_HAfNPGdEHMp67CuN.jpg">放大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5e88f45c75323d28a5ea0/m_p_gvro4Ry9POJUm0nR.jpg">侧视</a>]</p><hr><p>4世纪末。<a href="https://www.metmuseum.org/art/collection/search/463714">大都会艺术博物馆（第五大道，美国）</a>。玻璃，金箔。</p><img src="https://res.bibleox.com/s/img/image/simple/68b5e68b45c75323d28a5e9c/s_p_uRLyImBPPDsr48G2.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5e68b45c75323d28a5e9c/m_p_uRLyImBPPDsr48G2.jpg">放大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5e76d45c75323d28a5e9e/m_p_62cHpid14wgeSyqc.jpg">版本 2</a>]</p><hr><p>4世纪中叶。宗徒伯多禄和保禄，佩雷格里娜。<a href="https://www.metmuseum.org/art/collection/search/465922">大都会艺术博物馆（第五大道，美国）</a>。11.5 × 13.3 × 1.2 厘米。</p><img src="https://res.bibleox.com/s/img/image/simple/68b5e7d145c75323d28a5e9f/s_p_atDwcEc3h2ZyYLRb.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5e7d145c75323d28a5e9f/m_p_atDwcEc3h2ZyYLRb.jpg">放大</a>]</p><h3>宗徒伯多禄和保禄（罗马）</h3><p>4世纪。用来封闭地下墓穴中儿童墓龛（loculus）的石板。罗马，梵蒂冈博物馆，庇护基督教博物馆。</p><img src="https://res.bibleox.com/s/img/image/simple/674f1bc0dba77200011c739a/s_p_uH3btIsNTUn6lHGQ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f1bc0dba77200011c739a/m_p_uH3btIsNTUn6lHGQ.jpg">放大</a>]</p><h3>抱着婴孩基督的诞神女（罗马）</h3><p>3—4世纪。多弥提拉地下墓穴。</p><img src="https://res.bibleox.com/s/img/image/simple/66cc2c11dba77200019bc7d5/s_p_rZQc8oqW4YIrUMho.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/66cc2c11dba77200019bc7d5/m_p_rZQc8oqW4YIrUMho.jpg">放大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686d246b5f47da2505d3ae57/m_p_AZTFv8hTAm4Eo9yp.jpg">版本 2</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686d24885f47da2505d3ae58/s_p_Z1QqJZuraUn8iLSV.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d24885f47da2505d3ae58/m_p_Z1QqJZuraUn8iLSV.jpg">放大</a>]</p><h3>有基督像的十字架（拜占庭）</h3><p>395—641年。<a href="https://collections.louvre.fr/en/ark:/53355/cl010043937">卢浮宫（法国）</a>。8.5 × 20 × 1.2 厘米。</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c5886594f46d35a87ec7/s_p_wU3HuTavyFqHCHIc.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c5886594f46d35a87ec7/m_p_wU3HuTavyFqHCHIc.jpg">放大</a>]</p><h3>圣像（埃及）</h3><p>395—641年。<a href="https://collections.louvre.fr/en/ark:/53355/cl010049211">卢浮宫（法国）</a>。24 × 17.5 厘米</p><img src="https://res.bibleox.com/s/img/image/simple/68c3bf006594f46d35a87ebf/s_p_m1O6PHgeoR9L2huf.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3bf006594f46d35a87ebf/m_p_m1O6PHgeoR9L2huf.jpg">放大</a>]</p><hr><p><a href="https://collections.louvre.fr/en/ark:/53355/cl010049209">卢浮宫（法国）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c8966594f46d35a87ec8/s_p_hfH86ZqQDaRWHKRA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c8966594f46d35a87ec8/m_p_hfH86ZqQDaRWHKRA.jpg">放大</a>]</p><h3>有圣米纳斯圣像的圣油瓶（拜占庭）</h3><p>395—641年。<a href="https://collections.louvre.fr/en/ark:/53355/cl010042774">卢浮宫（法国）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c4176594f46d35a87ec3/s_p_RYRsljTrixb3giuP.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c4176594f46d35a87ec3/m_p_RYRsljTrixb3giuP.jpg">放大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c3c4196594f46d35a87ec4/m_p_20KqaRLqoxUISfqB.jpg">背面</a>]</p><hr><p>395—641年。<a href="https://collections.louvre.fr/en/ark:/53355/cl010042778">卢浮宫（法国）</a>。这样的圣油瓶在各博物馆中数量非常多。其他例子：<a href="https://collections.louvre.fr/en/ark:/53355/cl010042780">1</a>、<a href="https://collections.louvre.fr/en/ark:/53355/cl010042798">2</a>、<a href="https://collections.louvre.fr/en/ark:/53355/cl010042802">3</a>、<a href="https://collections.louvre.fr/en/ark:/53355/cl010043779">4</a>、<a href="https://collections.louvre.fr/en/ark:/53355/cl010076645">5</a>、<a href="https://collections.louvre.fr/en/ark:/53355/cl010051239">6</a>、<a href="https://collections.louvre.fr/en/ark:/53355/cl010263188">7</a>、<a href="https://collections.louvre.fr/en/ark:/53355/cl010280896">8</a>、<a href="https://collections.louvre.fr/en/ark:/53355/cl010044285">9</a>、<a href="https://collections.louvre.fr/en/ark:/53355/cl010280846">10</a>、<a href="https://collections.louvre.fr/en/ark:/53355/cl010280894">11</a>、<a href="https://www.clevelandart.org/art/1999.232">12</a>、<a href="https://www.clevelandart.org/art/1999.233">13</a>、<a href="https://www.clevelandart.org/art/1999.231">14</a>、<a href="https://www.clevelandart.org/art/1999.230">15</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c4c66594f46d35a87ec5/s_p_b5etRE60QJjNF7zQ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c4c66594f46d35a87ec5/m_p_b5etRE60QJjNF7zQ.jpg">放大</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c4cd6594f46d35a87ec6/s_p_vJbng6ICUUefTimC.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c4cd6594f46d35a87ec6/m_p_vJbng6ICUUefTimC.jpg">放大</a>]</p><h3>有诞神女和基督像的铅制圣油瓶（意大利，博洛尼亚）</h3><p>4—5世纪。“这种盛着圣地圣油的圣油瓶，由朝圣者从东方大量带回，即从巴勒斯坦带回；自4世纪末起，前往那里的朝圣成为常规，到5世纪上半叶人数众多”[27]</p><img src="https://res.bibleox.com/s/img/image/simple/686d3bdc5f47da2505d3ae5f/s_p_gcwh26YTfBvz5FbR.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d3bdc5f47da2505d3ae5f/m_p_gcwh26YTfBvz5FbR.jpg">放大</a>]</p><h2>5世纪</h2><h3>抱着婴孩耶稣的诞神女，殉道者菲利克斯和阿道克图斯，寡妇科莫迪拉（罗马）</h3><p>5—6世纪。科莫迪拉地下墓穴。左前方画的是寡妇科莫迪拉，一位富有的罗马妇女，这座地下墓穴教堂是为纪念她而建的。</p><img src="https://res.bibleox.com/s/img/image/simple/674edb84dba77200011c738c/s_p_urBcFMzNnn49NanW.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674edb84dba77200011c738c/m_p_urBcFMzNnn49NanW.jpg">放大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686bf61f5f47da2505d3ae38/m_p_gOZdkzGPGcL4Vws0.jpg">版本 2</a>]</p><h3>基督和诞神女（拜占庭）</h3><p>400—500年。材料：金。3.7 × 4 × 0.3 厘米；重 4.04 克。<a href="https://collections.louvre.fr/en/ark:/53355/cl010256498">卢浮宫（法国）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/68c403846594f46d35a87efb/s_p_Ahj64DxPe313azhi.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c403846594f46d35a87efb/m_p_Ahj64DxPe313azhi.jpg">放大</a>]</p><h3>殉道者劳楞佐（拉文纳）</h3><p>425年。加拉·普拉西提阿陵墓[1][2][25]。打开的柜子里有四部福音：马尔谷、玛窦、路加、若望。圣人拿着十字架和打开的福音走向烤架，烤架下燃着火。</p><img src="https://res.bibleox.com/s/img/image/simple/674ee461dba77200011c738e/s_p_EPEyZAtXMtLhz0vO.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674ee461dba77200011c738e/m_p_EPEyZAtXMtLhz0vO.jpg">放大</a>]</p><h3>宗徒保禄（厄弗所）</h3><p>5世纪末的壁画，保禄洞[4]。</p><img src="https://res.bibleox.com/s/img/image/simple/674f2a67dba77200011c73a0/s_p_Og6LudyAS5axVwrH.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f2a67dba77200011c73a0/m_p_Og6LudyAS5axVwrH.jpg">放大</a>]</p><h3>宗徒保禄（那不勒斯）</h3><p>5世纪末。圣真纳罗地下墓穴，壁画。画的可能是宗徒保禄。</p><img src="https://res.bibleox.com/s/img/image/simple/674f2705dba77200011c739d/s_p_XdEMnSngRpC4ver8.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f2705dba77200011c739d/m_p_XdEMnSngRpC4ver8.jpg">放大</a>]</p><h3>依科尼雍的德克拉，殉道者（厄弗所）</h3><p>圣保禄和圣德克拉洞。她是听了宗徒保禄的宣讲而信主的人之一，最初几个世纪的殉道者。2013年这个洞被伊斯兰武装分子亵渎[4]。</p><img src="https://res.bibleox.com/s/img/image/simple/674f2c2edba77200011c73a1/s_p_tCvOXPpRP5ogjE1Y.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f2c2edba77200011c73a1/m_p_tCvOXPpRP5ogjE1Y.jpg">放大</a>]</p><h3>塞萨洛尼基的大殉道者狄米特里和天使（塞萨洛尼基，拜占庭）</h3><p>5—6世纪。塞萨洛尼基的圣狄米特里大殿。教堂西部的马赛克 [10]</p><img src="https://res.bibleox.com/s/img/image/simple/686984705f47da2505d3ae11/s_p_bliIzjPrQcGjWmMT.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686984705f47da2505d3ae11/m_p_bliIzjPrQcGjWmMT.jpg">放大</a>]</p><h3>塞萨洛尼基的大殉道者狄米特里和孩子（塞萨洛尼基，拜占庭）</h3><p>5—6世纪。塞萨洛尼基的圣狄米特里大殿。南侧廊西墙上的马赛克 [10]</p><img src="https://res.bibleox.com/s/img/image/simple/68697c845f47da2505d3ae10/s_p_T8JYB6OgB0WUM8O6.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68697c845f47da2505d3ae10/m_p_T8JYB6OgB0WUM8O6.jpg">放大</a>]</p><h3>元老院议员的住宅，圣普正珍大殿（罗马）</h3><p>402—417年。[13][14]</p><img src="https://res.bibleox.com/s/img/image/simple/6869938e5f47da2505d3ae1c/s_p_l5Dokt3jzLvx6IxN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6869938e5f47da2505d3ae1c/m_p_l5Dokt3jzLvx6IxN.jpg">放大</a>]</p><h3>圣母大殿（罗马）</h3><p>432—440年。[15][16]</p><img src="https://res.bibleox.com/s/img/image/simple/6869954e5f47da2505d3ae1d/s_p_0bDTRtbRpWWnfPQR.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6869954e5f47da2505d3ae1d/m_p_0bDTRtbRpWWnfPQR.jpg">放大</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686995555f47da2505d3ae1e/s_p_FLcJtADykEgKNDDd.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686995555f47da2505d3ae1e/m_p_FLcJtADykEgKNDDd.jpg">放大</a>]</p><h3>基督、三位青年、贤士（意大利北部）</h3><p>400—450年。<a href="https://collections.louvre.fr/en/ark:/53355/cl010256191">卢浮宫（法国）</a>。银，6.3 × 12.3 × 7.1 厘米。</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c1756594f46d35a87ec1/s_p_WzOTF3me39ISTfnN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c1756594f46d35a87ec1/m_p_WzOTF3me39ISTfnN.jpg">放大</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c1796594f46d35a87ec2/s_p_a0udZW5EPewQCqsl.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c1796594f46d35a87ec2/m_p_a0udZW5EPewQCqsl.jpg">放大</a>]</p><h3>圣像：宗徒伯多禄向圣马尔谷口述福音（埃及）</h3><p>440—670年。<a href="https://www.metmuseum.org/art/collection/search/477163">大都会艺术博物馆（第五大道，美国）</a>。13.5 × 10 × 0.8 厘米。另见：<a href="https://www.metmuseum.org/art/collection/search/477492">1</a>、<a href="https://www.metmuseum.org/art/collection/search/477487">2</a>、<a href="https://www.metmuseum.org/art/collection/search/477481">3</a>、<a href="https://www.metmuseum.org/art/collection/search/477489">4</a>、<a href="https://www.metmuseum.org/art/collection/search/477491">5</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/68c1c2f56594f46d35a87e74/s_p_BWhcee0cn10mz7dc.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1c2f56594f46d35a87e74/m_p_BWhcee0cn10mz7dc.jpg">放大</a>]</p><h3>不知名的圣人（拜占庭，埃及）</h3><p>5—6世纪。<a href="https://www.metmuseum.org/art/collection/search/329982">大都会艺术博物馆（第五大道，美国）</a>。44 × 32.5 厘米。</p><img src="https://res.bibleox.com/s/img/image/simple/68b5eb2d45c75323d28a5ea3/s_p_E5UUO66hSfRBtXUn.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5eb2d45c75323d28a5ea3/m_p_E5UUO66hSfRBtXUn.jpg">放大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5eb2845c75323d28a5ea2/m_p_ofbMCUTa1winWDg0.jpg">版本 2</a>]</p><h3>有圣米纳斯像的圣油瓶（科普特时期的埃及）</h3><p>5—7世纪。<a href="https://collections.hermitagemuseum.org/entity/OBJECT/87092?query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=34">艾尔米塔什博物馆（俄罗斯）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/6863c0796480b4d285320413/s_p_sW3adkK7lr960dU5.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c0796480b4d285320413/m_p_sW3adkK7lr960dU5.jpg">放大</a>]</p><hr><p>5—6世纪。有圣米纳斯像的圣油瓶（埃及）。<a href="https://www.metmuseum.org/art/collection/search/854993">大都会艺术博物馆（第五大道，美国）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/68b5f3f845c75323d28a5eb8/s_p_ePhTgphiYrxHdEaZ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5f3f845c75323d28a5eb8/m_p_ePhTgphiYrxHdEaZ.jpg">放大</a>]</p><hr><p>5—6世纪。有圣米纳斯像的圣油瓶（埃及）。<a href="https://www.metmuseum.org/art/collection/search/854994">大都会艺术博物馆（第五大道，美国）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/68b5f40645c75323d28a5eb9/s_p_5HMBehehtBuCUdOm.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5f40645c75323d28a5eb9/m_p_5HMBehehtBuCUdOm.jpg">放大</a>]</p><h3>有基督像的戒指（埃及，卢克索）</h3><p>5—7世纪。<a href="https://collections.hermitagemuseum.org/entity/OBJECT/111849?page=5&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%B0&amp;index=240">艾尔米塔什博物馆（俄罗斯）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/6863c4d46480b4d285320420/s_p_SyuBoqgvHXMA5UIe.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c4d46480b4d285320420/m_p_SyuBoqgvHXMA5UIe.jpg">放大</a>]</p><h2>6世纪</h2><h3>主耶稣基督（西乃）</h3><p>6世纪。圣加大利纳修道院，埃及 [3]。</p><img src="https://res.bibleox.com/s/img/image/simple/686fe7935f47da2505d3ae87/s_p_cikLnQnMeZgiaeXg.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686fe7935f47da2505d3ae87/m_p_cikLnQnMeZgiaeXg.jpg">放大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6872d4935f47da2505d3ae90/m_p_1CbtDgulMkyLj9dK.jpg">版本 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6872d4835f47da2505d3ae8d/m_p_IPypUclQUGcqTIJa.jpg">版本 3</a>]</p><h3>抱着婴孩耶稣的诞神女，圣狄奥多尔和圣乔治（西乃）</h3><p>6世纪。圣加大利纳修道院。蜡画圣像，埃及。</p><img src="https://res.bibleox.com/s/img/image/simple/674ece56dba77200011c7384/s_p_RWNQK8qhzLwXxGkf.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674ece56dba77200011c7384/m_p_RWNQK8qhzLwXxGkf.jpg">放大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6872d4895f47da2505d3ae8e/m_p_6JgREZVUzpO8lC9E.jpg">版本 2</a>]</p><h3>宗徒伯多禄（西乃）</h3><p>6世纪。圣加大利纳修道院。蜡画圣像，埃及。</p><img src="https://res.bibleox.com/s/img/image/simple/686fe28f5f47da2505d3ae82/s_p_tWJyRADNEjI9Gt5J.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686fe28f5f47da2505d3ae82/m_p_tWJyRADNEjI9Gt5J.jpg">放大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686fe73d5f47da2505d3ae86/m_p_ztqtzVnOwMfzjCsd.jpg">版本 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6872d48f5f47da2505d3ae8f/m_p_x4BAyJ0C1GjHQ7Us.jpg">版本 3</a>]</p><h3>诞神女和圣婴基督（拜占庭）</h3><p>6世纪。<a href="https://www.metmuseum.org/art/collection/search/463392">大都会艺术博物馆（第五大道，美国）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/68b5fce645c75323d28a5ec5/s_p_KB8coyb4H50zurQW.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5fce645c75323d28a5ec5/m_p_KB8coyb4H50zurQW.jpg">放大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5fce945c75323d28a5ec6/m_p_eIaeevwinjFBQAeA.jpg">版本 2</a>]</p><h3>有诞神女和圣婴基督圣像的戒指（拜占庭）</h3><p>6—7世纪。<a href="https://www.metmuseum.org/art/collection/search/464059">大都会艺术博物馆（第五大道，美国）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/68b5fe7745c75323d28a5ec7/s_p_bcCSRfNkRmmk5jZs.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5fe7745c75323d28a5ec7/m_p_bcCSRfNkRmmk5jZs.jpg">放大</a>]</p><h3>圣玛利亚</h3><p>611年，<a href="https://www.pravenc.ru/text/164537.html">革辣撒</a></p><img src="https://res.bibleox.com/s/img/image/simple/482/s_p_s3flMTpYpn69iMIy.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/482/m_p_s3flMTpYpn69iMIy.jpg">放大</a>]</p><h3>基督，圆形饰章（安提约基雅）</h3><p>500—625年。材料：银，镀金。14.9 × 14.1 × 1.1 厘米。<a href="https://collections.louvre.fr/en/ark:/53355/cl010256496">卢浮宫（法国）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/68c409da6594f46d35a87f00/s_p_BHIOy3tEZ3ZoMEr5.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c409da6594f46d35a87f00/m_p_BHIOy3tEZ3ZoMEr5.jpg">放大</a>]</p><hr><p>500—625年。<a href="https://collections.louvre.fr/en/ark:/53355/cl010256495">卢浮宫（法国）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/68c41f626594f46d35a87f05/s_p_bKgaW542SgyD11o9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c41f626594f46d35a87f05/m_p_bKgaW542SgyD11o9.jpg">放大</a>]</p><h3>有圣像的挂毯：基督、诞神女、总领天使弥额尔和加俾额尔、宗徒（埃及，拜占庭）</h3><p>500年。<a href="https://www.clevelandart.org/art/1967.144">克利夫兰艺术博物馆（美国）</a>。羊毛，178.7 × 110.5 厘米。</p><p>博物馆的说明：</p><blockquote><p>这件罕见的挂毯用二十多种颜色的羊毛线织成，当时比一幅画还贵。它的历史价格反映出当时的人对织工所达到的精湛混色技艺评价之高。挂在墙上的<strong>这幅织成的圣像，使信徒能在正教会的教堂里敬礼诞神女和婴孩基督</strong>。他们被天使和宗徒围绕，旁边用希腊文写着他们的名字。为了在灵性上有效，圣像（神圣的图像）必须尽可能准确地遵循其形象的既定图像传统。</p><p>建筑框架横梁上的铭文译自希腊文为“<strong>圣弥额尔、圣玛利亚、圣加俾额尔</strong>”。宽阔的叶纹边框饰有水果和花卉，下部饰有宗徒半身像的圆形饰章，旁边用希腊文写的名字译为“<strong>安德肋、玛窦、宗徒保禄、路加、雅各伯、斐理伯、马尔谷、多默、若望、玛弟亚、伯多禄和巴尔多禄茂</strong>”。</p></blockquote><img src="https://res.bibleox.com/s/img/image/simple/68cb9dd5205184ec278d58d7/s_p_jXuLxO8mwNy5DicO.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68cb9dd5205184ec278d58d7/m_p_jXuLxO8mwNy5DicO.jpg">放大</a>]</p><h3>有圣像的挂毯。三位青年？、基督名号组合字（埃及，拜占庭）</h3><p>500年代。<a href="https://www.clevelandart.org/art/1982.73">克利夫兰艺术博物馆（美国）</a>。羊毛，亚麻。110.5 × 76.8 厘米。</p><img src="https://res.bibleox.com/s/img/image/simple/68cb9dde205184ec278d58d8/s_p_w5vxLEtZSz6mW36r.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68cb9dde205184ec278d58d8/m_p_w5vxLEtZSz6mW36r.jpg">放大</a>]</p><h3>有圣像的挂毯。诞神女、贤士、先知约纳（埃及，拜占庭）</h3><p>500—550年。<a href="https://www.clevelandart.org/art/1951.400">克利夫兰艺术博物馆（美国）</a>。亚麻。99.7 × 104.8 厘米。</p><p>博物馆的说明：</p><blockquote><p>……上层左边画的是坐在十字形腿凳子上的<strong>抱着婴孩基督的童贞玛利亚</strong>。正如科普特文铭文所说，<strong>三位君王带着礼物从右边走来</strong>。中层左边画的可能是<strong>基督受洗</strong>，被柱子隔开的另外三个人物似乎表现基督只用五个饼和两条鱼使一大群人吃饱的新约奇迹。下层仍可辨认出<strong>先知约纳被鲸鱼吞下的旧约场景</strong>。</p><p>希腊文铭文标明了旧约和新约的各个场景。上层第一位贤士上方可以认出表示黄金的希腊词（<em>χρυσός，chrysós</em>）的两个字母<strong>“XP”</strong>。中层左边画着两个人物：第一个几乎完全毁坏，第二个由铭文<strong>“EIΩANNHC”（若望）</strong>标明。下层画着被吐到岸上的约纳，旁边有一条大鱼，并有铭文<strong>“EIΩNAC”（约纳）</strong>。几乎完全失去的梅瑟只能凭铭文<strong>“MWCHC”（梅瑟）</strong>辨认。</p></blockquote><img src="https://res.bibleox.com/s/img/image/simple/68cb9e0d205184ec278d58d9/s_p_WiTqygXUYCZZY7TF.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68cb9e0d205184ec278d58d9/m_p_WiTqygXUYCZZY7TF.jpg">放大</a>]</p><h3>有圣像的圣爵和香炉（拜占庭，叙利亚，阿塔鲁提）</h3><p>500—650年。<a href="https://www.metmuseum.org/art/collection/search/474390">大都会艺术博物馆（第五大道，美国）</a>。银，镀金。圣爵上有主和圣人的圣像，以及谁献给谁的铭文。</p><p>这些精工制作的礼仪器物——圣爵、香炉、滤器和圣神鸽子像——属于叙利亚富裕的商业城镇阿塔鲁提的一座基督教教堂，叙利亚当时是拜占庭帝国最富裕的地区之一。圣爵、香炉和滤器用于事奉圣礼（圣体圣血礼仪），在这圣事中基督徒为纪念最后晚餐和基督的死，领受祝圣过的酒和饼。</p><p>根据这些器物上的希腊文铭文（有几处拼写差异），其中许多是当地居民献给城里奉献于圣斯德望的主教堂和奉献于圣若望（可能是前驱施洗者若翰［洗者若翰］）的一座小教堂的。</p><p>7世纪初，叙利亚先落入萨珊波斯人之手，后又落入伊斯兰军队之手。这些作品可能是在拜占庭军队面对进攻者从该地区撤退时，被匆忙装进保护容器埋起来的。</p><img src="https://res.bibleox.com/s/img/image/simple/68b5db2045c75323d28a5e9a/s_p_kx70rC7wWJQtkfdG.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5db2045c75323d28a5e9a/m_p_kx70rC7wWJQtkfdG.jpg">放大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5edf045c75323d28a5ea5/m_p_Eru1rmuua6UWqjTz.jpg">版本 2</a>]</p><hr><p>长发的前驱若翰、作奥兰斯姿势（举起双手）的诞神女、作奥兰斯姿势的圣人、拿着手杖和盾牌的军人圣人、有十字光环的年轻基督，以及另一位穿盔甲刺杀恶龙的军人圣人（圣乔治？），都在拱廊下。<a href="https://www.metmuseum.org/art/collection/search/466137">大都会艺术博物馆（第五大道，美国）</a>。21.3 × 16 厘米。</p><p>希腊文铭文：“<strong>为了自己的得救，欧多西娅将［此物］献给阿塔尔［鲁提］村的圣斯德望</strong>”。</p><img src="https://res.bibleox.com/s/img/image/simple/68b5efa445c75323d28a5eaa/s_p_l5pPSsTDZHSQuvNU.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5efa445c75323d28a5eaa/m_p_l5pPSsTDZHSQuvNU.jpg">放大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f01f45c75323d28a5eab/m_p_456sbKEe3ANd9ZWP.jpg">版本 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f02245c75323d28a5eac/m_p_fkJIydq7uEfZbIUt.jpg">版本 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f02445c75323d28a5ead/m_p_s25q6Lu5HItPjqDs.jpg">版本 4</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f02745c75323d28a5eae/m_p_QJsAgl2zRfYmpNDL.jpg">版本 5</a>]</p><hr><p>有圣前驱若翰、一位圣辅祭（可能是斯德望）、圣主教们和十字架圣像的圣爵。<a href="https://www.metmuseum.org/art/collection/search/466130">大都会艺术博物馆（第五大道，美国）</a>。20.5 × 15.1 厘米，369 克，1100 毫升</p><p>希腊文铭文：“<strong>献给阿塔鲁提村的圣若望</strong>”。</p><img src="https://res.bibleox.com/s/img/image/simple/68b5ec4545c75323d28a5ea4/s_p_KWMPzINWo4ktBKQ7.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5ec4545c75323d28a5ea4/m_p_KWMPzINWo4ktBKQ7.jpg">放大</a>]</p><hr><p>有基督、诞神女、前驱若翰、胜利者乔治圣像的圣爵。<a href="https://www.metmuseum.org/art/collection/search/466129">大都会艺术博物馆（第五大道，美国）</a>。24.3 × 16.8 厘米。</p><p>希腊文铭文：“<strong>阿塔鲁提村的圣斯德望</strong>”。</p><img src="https://res.bibleox.com/s/img/image/simple/68b5ee1345c75323d28a5ea6/s_p_9bHxlNSj26b5EhMw.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5ee1345c75323d28a5ea6/m_p_9bHxlNSj26b5EhMw.jpg">放大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5ee3c45c75323d28a5ea7/m_p_8XweLe1b1pD7GWHb.jpg">版本 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5ee4045c75323d28a5ea8/m_p_faMKsJUImltU9s6v.jpg">版本 3</a>]</p><hr><p>画有带十字光环的年轻基督、拿着香炉的圣辅祭（可能是圣斯德望）、祈祷姿势的童贞玛利亚和拿着手杖的年轻圣人的圣爵。尺寸：23.9 × 17 厘米，356 克。<a href="https://www.metmuseum.org/art/collection/search/466141">大都会艺术博物馆（第五大道，美国）。</a></p><p>希腊文铭文：“<strong>为还愿，并为主知其名者的得救</strong>”。</p><img src="https://res.bibleox.com/s/img/image/simple/68b5fa7a45c75323d28a5ebe/s_p_7AzZiy4FebkdJC4e.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5fa7a45c75323d28a5ebe/m_p_7AzZiy4FebkdJC4e.jpg">放大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5fa8345c75323d28a5ebf/m_p_LQnRTCSFvxz7O7ui.jpg">版本 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5fa8645c75323d28a5ec0/m_p_KvY9o90gFdzJeK9N.jpg">版本 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5fa8945c75323d28a5ec1/m_p_BUzuFJ6F1fLtMppI.jpg">版本 4</a>]</p><hr><p>画有带十字光环的年轻基督、圣前驱若翰、祈祷姿势的童贞玛利亚、圣辅祭（可能是圣斯德望）和十字架的香炉。银和镀金银，铜衬里。尺寸：41.5 × 13.2 × 12.6 厘米。<a href="https://www.metmuseum.org/art/collection/search/466132">大都会艺术博物馆（第五大道，美国）</a>。</p><p>希腊文铭文：“<strong>为基里亚科斯的子女埃尔塔和斯德望的灵魂安息</strong>”</p><img src="https://res.bibleox.com/s/img/image/simple/68b5f15545c75323d28a5eaf/s_p_OJ2d0ec3h6BtKZQM.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5f15545c75323d28a5eaf/m_p_OJ2d0ec3h6BtKZQM.jpg">放大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f15845c75323d28a5eb0/m_p_MLajjsEoJyZ7xPC7.jpg">版本 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f15c45c75323d28a5eb1/m_p_5k22minZ9Q7EruSj.jpg">版本 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f15e45c75323d28a5eb2/m_p_3cDRqzOwNAJr7A0S.jpg">版本 4</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f16145c75323d28a5eb3/m_p_8vKQQvQJKE8Mbtoc.jpg">版本 5</a>]</p><hr><p>画有带十字光环的年轻基督、两位总领天使和十字架的香炉。8.2 × 13.2 厘米。<a href="https://www.metmuseum.org/art/collection/search/466131">大都会艺术博物馆（第五大道，美国）</a>。</p><p>希腊文铭文：“<strong>献给阿塔鲁提村的圣若望</strong>”。</p><img src="https://res.bibleox.com/s/img/image/simple/68b5f27545c75323d28a5eb4/s_p_brjJXh3ZIrplms0E.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5f27545c75323d28a5eb4/m_p_brjJXh3ZIrplms0E.jpg">放大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f28545c75323d28a5eb5/m_p_oWtx1CexyxQIAxRK.jpg">版本 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f28845c75323d28a5eb6/m_p_zqvxcBdCxjLqltWh.jpg">版本 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f28c45c75323d28a5eb7/m_p_fIVExsqDAbrZLhWW.jpg">版本 4</a>]</p><h3>有基督和圣人像的圣爵、有十字架的圣盘（叙利亚，拜占庭）</h3><p>500—700年。克利夫兰艺术博物馆（美国）：<a href="https://www.clevelandart.org/art/1950.378">1</a>、<a href="https://www.clevelandart.org/art/1950.379">2</a>、<a href="https://www.clevelandart.org/art/1950.380">3</a>、<a href="https://www.clevelandart.org/art/1950.381">4</a>。</p><p>这四件银制礼仪器皿——一个圣盘和三个圣爵（藏品号1950.378–81）——组成了今天所称的“贝特米索纳宝藏”，得名于制作这些器物的叙利亚北部村庄。</p><p>虽然宝藏发现的确切地点和情况不详，但贝特米索纳村的居民和叙利亚、巴勒斯坦的其他基督徒团体一样，可能被迫把教堂的银器埋起来，以躲避7世纪上半叶征服他们土地的波斯人或阿拉伯人。</p><p>圣盘在礼仪中盛放圣体的分份，上面刻着一个拉丁十字，周围是献词。献词写着圣盘的奉献者多姆诺斯和它原来所在的地方——贝特米索纳的圣塞尔吉教堂。</p><p>圣爵的杯口宽阔，饰有基督、诞神女和宗徒伯多禄、保禄的半身像。其中一个圣爵上有献词，写着奉献者——多姆诺斯的儿子基里亚科斯——和接受这份虔诚奉献的教堂司祭——泽农的名字。</p><p>希腊文铭文：“<strong>+ 多姆诺斯之子司祭基里亚科斯，在司祭泽农的时期（将此圣爵献给）圣塞尔吉</strong>”</p><img src="https://res.bibleox.com/s/img/image/simple/68caa03c205184ec278d5880/s_p_SB8idWRkPX7keKkU.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68caa03c205184ec278d5880/m_p_SB8idWRkPX7keKkU.jpg">基督</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68caa026205184ec278d587d/m_p_sYIDwGwUI9iMAzzD.jpg">诞神女</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68caa029205184ec278d587e/m_p_xYnPNjrcxGm5mJgl.jpg">宗徒</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68caa02c205184ec278d587f/m_p_kH9idfsikXyvAVvy.jpg">宗徒</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68caa0d4205184ec278d5881/m_p_vWERSBBMAoytSNnX.jpg">俯视</a>]</p><hr><img src="https://res.bibleox.com/s/img/image/simple/68ca9cd5205184ec278d5874/s_p_tH0J7uqAriM7uaeK.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68ca9cd5205184ec278d5874/m_p_tH0J7uqAriM7uaeK.jpg">基督</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68ca9d13205184ec278d5878/m_p_tYRbn15h6MPNUilS.jpg">诞神女</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68ca9ce8205184ec278d5875/m_p_FKfoi68UXlWCS5ky.jpg">宗徒</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68ca9ceb205184ec278d5876/m_p_Zp9CJ61HnBcr8Csr.jpg">宗徒</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68ca9cee205184ec278d5877/m_p_w2JDvDj5c4pMVcfk.jpg">俯视</a>]</p><hr><img src="https://res.bibleox.com/s/img/image/simple/68ca9e94205184ec278d5879/s_p_27LzQUQDD3A7nI9X.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68ca9e94205184ec278d5879/m_p_27LzQUQDD3A7nI9X.jpg">基督</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68ca9e98205184ec278d587a/m_p_R47Eqr4GrHijUSIb.jpg">诞神女</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68ca9e9b205184ec278d587b/m_p_31NEBZQIYBEqOut0.jpg">宗徒</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68ca9e9e205184ec278d587c/m_p_QxtJHMZORGGwFxYQ.jpg">宗徒</a>]</p><hr><p>约500年。圣盘。<a href="https://www.clevelandart.org/art/1950.381">克利夫兰艺术博物馆（美国）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/68ca964d205184ec278d5873/s_p_wNDEaPHmGHiuWeZy.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68ca964d205184ec278d5873/m_p_wNDEaPHmGHiuWeZy.jpg">放大</a>]</p><h3>香炉。主耶稣基督受洗和被钉十字架（拜占庭）</h3><p>500—899年。尺寸：13.4 × 9 厘米。<a href="https://collections.louvre.fr/en/ark:/53355/cl010042067">卢浮宫（法国）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/68c4068e6594f46d35a87efe/s_p_3kaCIWMTmQfT4NFG.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c4068e6594f46d35a87efe/m_p_3kaCIWMTmQfT4NFG.jpg">放大</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/68c4061f6594f46d35a87efc/s_p_XNlsrfQ2MOphupt9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c4061f6594f46d35a87efc/m_p_XNlsrfQ2MOphupt9.jpg">放大</a>]</p><h3>花瓶。基督、诞神女、洗者若翰、宗徒、天使（君士坦丁堡）</h3><img src="https://res.bibleox.com/s/img/image/simple/68c420e46594f46d35a87f06/s_p_iADN1OW5uYg5Wovc.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c420e46594f46d35a87f06/m_p_iADN1OW5uYg5Wovc.jpg">放大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c420e76594f46d35a87f07/m_p_oAs6ecjPj32iGMce.jpg">背面</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c421216594f46d35a87f0f/m_p_x6q5apwWB0DZirK2.jpg">基督</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c420fc6594f46d35a87f0b/m_p_sL17qrWgxkRCNRBb.jpg">诞神女</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c420ea6594f46d35a87f08/m_p_Cb0UJi1oxoKCQaXw.jpg">洗者若翰</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c421016594f46d35a87f0c/m_p_a9Y1fyPNxcQ4oNbq.jpg">天使</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c420f66594f46d35a87f0a/m_p_nAqhqDbP5x8fRAnj.jpg">天使</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c420ef6594f46d35a87f09/m_p_F9R3iyZ8go0PxARb.jpg">宗徒</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c4210a6594f46d35a87f0e/m_p_97cyzUvq95UJZOrR.jpg">宗徒</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c421056594f46d35a87f0d/m_p_WfK6SdjAqAOW9fDK.jpg">宗徒</a>]</p><h3>有圣像的胸前十字架（拜占庭）</h3><p>6世纪。<strong> </strong>金、料浆、水晶、玻璃；压印、粒金工艺。链长：33 厘米；十字架：4.9 × 3.8 厘米。<a href="https://collections.hermitagemuseum.org/entity/OBJECT/227027?page=46&amp;query=%D0%BA%D1%80%D0%B5%D1%81%D1%82&amp;sort=112&amp;index=2288">艾尔米塔什博物馆（俄罗斯）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/68c11e3c6594f46d35a87e2c/s_p_9GZmzTSaUVuXXaX1.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c11e3c6594f46d35a87e2c/m_p_9GZmzTSaUVuXXaX1.jpg">放大</a>]</p><h3>吊坠。基督被钉十字架（埃及）</h3><p>500—700年。尺寸：3.3 × 1.9 厘米。<a href="https://collections.louvre.fr/en/ark:/53355/cl010102800">卢浮宫（法国）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/68c41c4e6594f46d35a87f03/s_p_tiaBwT9vqOXIlsIw.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c41c4e6594f46d35a87f03/m_p_tiaBwT9vqOXIlsIw.jpg">放大</a>]</p><h3>两位圣人的圣像（拜占庭）</h3><p>6世纪；25.5 × 22 × 1.3 厘米。可能是圣史玛窦和若望。<a href="https://www.metmuseum.org/art/collection/search/468198">大都会艺术博物馆（第五大道，美国）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/68b5fc1545c75323d28a5ec3/s_p_a2FJmSgsGJRdELBq.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5fc1545c75323d28a5ec3/m_p_a2FJmSgsGJRdELBq.jpg">放大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5fc1945c75323d28a5ec4/m_p_pcvRiRfRgBcuHJEA.jpg">版本 2</a>]</p><h3>宗徒伯多禄和保禄的圣像（安提约基雅）</h3><p>550—600年。宗徒伯多禄。<a href="https://www.metmuseum.org/art/collection/search/468348">大都会艺术博物馆（第五大道，美国）</a>。银。38.1 × 55.9 × 2.2 厘米。</p><img src="https://res.bibleox.com/s/img/image/simple/68c1bfd36594f46d35a87e6f/s_p_WguE3h0pnnzXQXwt.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1bfd36594f46d35a87e6f/m_p_WguE3h0pnnzXQXwt.jpg">放大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c1bfd56594f46d35a87e70/m_p_83EvKNt1mFSPspQw.jpg">再放大</a>]</p><p>550—600年。宗徒保禄。<a href="https://www.metmuseum.org/art/collection/search/468347">大都会艺术博物馆（第五大道，美国）</a>。银。38.1 × 55.9 × 2.2 厘米。</p><img src="https://res.bibleox.com/s/img/image/simple/68c1bfda6594f46d35a87e71/s_p_5Y11faCyEzohnydQ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1bfda6594f46d35a87e71/m_p_5Y11faCyEzohnydQ.jpg">放大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c1bfdd6594f46d35a87e72/m_p_jGCYAnYdrt4tlXhd.jpg">再放大</a>]</p><h3>圣像（叙利亚？，拜占庭）</h3><p>500年代。<a href="https://www.clevelandart.org/art/1941.57">克利夫兰艺术博物馆（美国）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/68caa8cd205184ec278d5883/s_p_qr7HPRgCtcCRwsvb.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68caa8cd205184ec278d5883/m_p_qr7HPRgCtcCRwsvb.jpg">放大</a>]</p><h3>军人圣人像（科普特时期的埃及）</h3><p>6—7世纪。<a href="https://collections.hermitagemuseum.org/entity/OBJECT/180444?page=6&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=253">艾尔米塔什博物馆（俄罗斯）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/6863c3c06480b4d28532041c/s_p_Rnquar8nZacdzqcP.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c3c06480b4d28532041c/m_p_Rnquar8nZacdzqcP.jpg">放大</a>]</p><h3>有宗徒保禄（？）和圣德克拉圣像的圣油瓶（埃及）</h3><p>500—700年。<a href="https://collections.louvre.fr/en/ark:/53355/cl010280955">卢浮宫（法国）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/68c4390d6594f46d35a87f15/s_p_Zxs1yv3Jg8oKfFHW.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c4390d6594f46d35a87f15/m_p_Zxs1yv3Jg8oKfFHW.jpg">放大</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/68c4390a6594f46d35a87f14/s_p_CPdXMrLBUE0satoH.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c4390a6594f46d35a87f14/m_p_CPdXMrLBUE0satoH.jpg">放大</a>]</p><h3>有宗徒安德肋圣像的圣油瓶（斯米尔纳）</h3><p>500—600年。<a href="https://collections.louvre.fr/en/ark:/53355/cl010281050">卢浮宫（法国）</a>。7 × 5 × 2.8 厘米。</p><img src="https://res.bibleox.com/s/img/image/simple/68c437966594f46d35a87f13/s_p_dCGVNUwg3KWvs9zz.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c437966594f46d35a87f13/m_p_dCGVNUwg3KWvs9zz.jpg">放大</a>]</p><h3>有圣米纳斯圣像的圣油瓶</h3><p>610—650年。有圣米纳斯像的圣油瓶（埃及）。<a href="https://www.metmuseum.org/art/collection/search/475416">大都会艺术博物馆（第五大道，美国）</a>。8.5 × 6.9 × 1.8 厘米。</p><img src="https://res.bibleox.com/s/img/image/simple/68c1c1396594f46d35a87e73/s_p_KIdJIYWMysre63rP.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1c1396594f46d35a87e73/m_p_KIdJIYWMysre63rP.jpg">放大</a>]</p><hr><p>500—750年。<a href="https://collections.louvre.fr/en/ark:/53355/cl010044285">卢浮宫（法国）</a>。13 × 10.6 × 3.4 厘米。</p><img src="https://res.bibleox.com/s/img/image/simple/68c3bc556594f46d35a87ebd/s_p_iHBRxhobWKvQb2Dx.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3bc556594f46d35a87ebd/m_p_iHBRxhobWKvQb2Dx.jpg">放大</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/68c3bc5c6594f46d35a87ebe/s_p_fQ8Ps5eHBD1myJaS.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3bc5c6594f46d35a87ebe/m_p_fQ8Ps5eHBD1myJaS.jpg">放大</a>]</p><h3>基督（拉文纳）</h3><p>克拉塞的圣亚坡理纳教堂，意大利拉文纳。</p><img src="https://res.bibleox.com/s/img/image/simple/675005d5dba77200011c73ad/s_p_rjjDEzNckea3oHk2.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/675005d5dba77200011c73ad/m_p_rjjDEzNckea3oHk2.jpg">放大</a>]</p><h3>基督和宗徒（拉文纳）</h3><p>祭坛区的马赛克。圣维塔莱教堂，意大利拉文纳。</p><img src="https://res.bibleox.com/s/img/image/simple/675005dadba77200011c73ae/s_p_Nac2nrVo791COrcO.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/675005dadba77200011c73ae/m_p_Nac2nrVo791COrcO.jpg">放大</a>]</p><h3>基督、天使和维塔利斯（拉文纳）</h3><p>6世纪。米兰的圣维塔利斯大殿，拉文纳。</p><img src="https://res.bibleox.com/s/img/image/simple/674f0ab3dba77200011c738f/s_p_AsShtty0gMBFOX5X.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f0ab3dba77200011c738f/m_p_AsShtty0gMBFOX5X.jpg">放大</a>]</p><h3>正信的皇帝查士丁尼（拉文纳）</h3><p>6世纪。米兰的圣维塔利斯大殿，拉文纳。</p><img src="https://res.bibleox.com/s/img/image/simple/674f0ab8dba77200011c7390/s_p_MsUwTeWDMk0uEVPq.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f0ab8dba77200011c7390/m_p_MsUwTeWDMk0uEVPq.jpg">放大</a>]</p><h3>正信的皇后狄奥多拉（拉文纳）</h3><p>6世纪。米兰的圣维塔利斯大殿，拉文纳。</p><img src="https://res.bibleox.com/s/img/image/simple/674f0ac0dba77200011c7391/s_p_6g0s1g1btiJBEXSR.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f0ac0dba77200011c7391/m_p_6g0s1g1btiJBEXSR.jpg">放大</a>]</p><h3>先祖亚巴郎（拉文纳）</h3><p>6世纪。米兰的圣维塔利斯大殿，拉文纳。</p><img src="https://res.bibleox.com/s/img/image/simple/674f0ad6dba77200011c7393/s_p_zgb5TLR1yafutIu4.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f0ad6dba77200011c7393/m_p_zgb5TLR1yafutIu4.jpg">放大</a>]</p><h3>亚伯尔和默基瑟德（拉文纳）</h3><p>6世纪。米兰的圣维塔利斯大殿，拉文纳。</p><img src="https://res.bibleox.com/s/img/image/simple/674f0adbdba77200011c7394/s_p_PiL9TaItwhR28eXN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f0adbdba77200011c7394/m_p_PiL9TaItwhR28eXN.jpg">放大</a>]</p><h3>玛策林、波利翁、伯多禄、圣人们（罗马）</h3><p>6世纪。蓬齐亚诺地下墓穴。壁画。</p><img src="https://res.bibleox.com/s/img/image/simple/66cc2c4adba77200019bc7d9/s_p_th5E9srmqGjUT72T.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/66cc2c4adba77200019bc7d9/m_p_th5E9srmqGjUT72T.jpg">放大</a>]</p><h3>乘云降来的基督、宗徒和圣葛斯默、圣达弥盎（罗马）</h3><p>6世纪（530年）。圣葛斯默和达弥盎大殿。[19][20]</p><img src="https://res.bibleox.com/s/img/image/simple/686aa5b35f47da2505d3ae28/s_p_V2YyLyiR7wCHgIfW.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa5b35f47da2505d3ae28/m_p_V2YyLyiR7wCHgIfW.jpg">放大</a>]</p><p>宗徒伯多禄和圣葛斯默（再往外是圣狄奥多尔）</p><img src="https://res.bibleox.com/s/img/image/simple/686aa5d25f47da2505d3ae29/s_p_s66jgQ3tkVAmQEZE.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa5d25f47da2505d3ae29/m_p_s66jgQ3tkVAmQEZE.jpg">放大</a>]</p><p>宗徒保禄和圣达弥盎（再往外是教宗斐理克斯）</p><img src="https://res.bibleox.com/s/img/image/simple/686aa7505f47da2505d3ae2c/s_p_WA1eP9P7BNe0aPQ6.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa7505f47da2505d3ae2c/m_p_WA1eP9P7BNe0aPQ6.jpg">放大</a>]</p><p>圣天使</p><img src="https://res.bibleox.com/s/img/image/simple/686aa61c5f47da2505d3ae2a/s_p_MD4QowA5HKQRhFFG.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa61c5f47da2505d3ae2a/m_p_MD4QowA5HKQRhFFG.jpg">放大</a>]</p><h3>基督和宗徒（罗马）</h3><p>6世纪（578—590年）。城外圣劳楞佐大殿（San Lorenzo fuori le Mura）[21][22]</p><p>宗徒保禄旁边是圣斯德望和圣希玻里。宗徒伯多禄旁边是圣劳楞佐。</p><img src="https://res.bibleox.com/s/img/image/simple/686aabc85f47da2505d3ae2e/s_p_xa4IU82mZb80Uija.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aabc85f47da2505d3ae2e/m_p_xa4IU82mZb80Uija.jpg">放大</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686aab945f47da2505d3ae2d/s_p_21M69l0ODfpN75oh.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aab945f47da2505d3ae2d/m_p_21M69l0ODfpN75oh.jpg">放大</a>]</p><h3>宗徒伯多禄和保禄（法兰克）</h3><p>6—8世纪。<a href="https://www.metmuseum.org/art/collection/search/464497">大都会艺术博物馆（第五大道，美国）</a>（也见<a href="https://www.metmuseum.org/art/collection/search/464496">这里</a>）。象牙。29.2 × 11.4 × 0.5 厘米。</p><img src="https://res.bibleox.com/s/img/image/simple/68b5ff8145c75323d28a5ec8/s_p_WhZZPyHo1I7oF79K.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5ff8145c75323d28a5ec8/m_p_WhZZPyHo1I7oF79K.jpg">放大</a>]</p><h3>圣人们（拜占庭，埃及）</h3><p>6—7世纪。<a href="https://www.metmuseum.org/art/collection/search/854019">大都会艺术博物馆（第五大道，美国）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/68b6007445c75323d28a5ec9/s_p_DNQuRcpcjfkINQ1r.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b6007445c75323d28a5ec9/m_p_DNQuRcpcjfkINQ1r.jpg">放大</a>]</p><h3>圣福加（拜占庭，克森尼索）</h3><p>6世纪。制作祝福饼（eulogia）的印模，上有站在船上的<a href="https://azbyka.ru/days/sv-foka-sinopskij">西诺普的圣福加</a>的浮雕像。<a href="https://collections.hermitagemuseum.org/entity/OBJECT/373084?page=2&amp;fundcoll=1420520446&amp;index=75">艾尔米塔什博物馆（俄罗斯）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/6863bee26480b4d285320410/s_p_s0nPEGgpeMtakrof.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863bee26480b4d285320410/m_p_s0nPEGgpeMtakrof.jpg">放大</a>]</p><h3>有两位圣人像的圣油瓶（小亚细亚，厄弗所）</h3><p>6世纪。<a href="https://collections.hermitagemuseum.org/entity/OBJECT/228313?page=44&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=2166">艾尔米塔什博物馆（俄罗斯）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/6863c0e76480b4d285320414/s_p_KnTGMdyOhsmTAD0S.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c0e76480b4d285320414/m_p_KnTGMdyOhsmTAD0S.jpg">放大</a>]</p><h3>有圣史和圣人像的圣油瓶：神学家若望和普洛哥洛（厄弗所）</h3><p>6世纪。<a href="https://collections.hermitagemuseum.org/entity/OBJECT/228314?page=33&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=1646">艾尔米塔什博物馆（俄罗斯）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/6863c1726480b4d285320415/s_p_oBnXQZmCz1EntIFw.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c1726480b4d285320415/m_p_oBnXQZmCz1EntIFw.jpg">放大</a>]</p><h3>有圣伯多禄和圣保禄像及拉丁文铭文的铅封（拜占庭）</h3><p>6—7世纪。<a href="https://collections.hermitagemuseum.org/entity/OBJECT/131338?page=33&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=1639">艾尔米塔什博物馆（俄罗斯）</a>。<a href="https://collections.hermitagemuseum.org/entity/OBJECT/161973?page=33&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=1640">另一件展品</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/6863c19d6480b4d285320416/s_p_JKBi7CXiDOutHIFn.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c19d6480b4d285320416/m_p_JKBi7CXiDOutHIFn.jpg">放大</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6863c22c6480b4d285320417/s_p_FmbNOmLfDrj3qYOz.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c22c6480b4d285320417/m_p_FmbNOmLfDrj3qYOz.jpg">放大</a>]</p><h3>有基督像的铅封（拜占庭）</h3><p>6—7世纪。<a href="https://collections.hermitagemuseum.org/entity/OBJECT/117792?page=6&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%B0&amp;index=269">艾尔米塔什博物馆（俄罗斯）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/6863c4a86480b4d28532041f/s_p_Uy0EgcXKfuHnv9bX.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c4a86480b4d28532041f/m_p_Uy0EgcXKfuHnv9bX.jpg">放大</a>]</p><h3>有基督像和花押字的铅封（拜占庭）</h3><p>6—7世纪。<a href="https://collections.hermitagemuseum.org/entity/OBJECT/117804?page=3&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%B0&amp;index=143">艾尔米塔什博物馆（俄罗斯）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/6863c5a16480b4d285320422/s_p_JNdWhUPj9cA9Dvoq.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c5a16480b4d285320422/m_p_JNdWhUPj9cA9Dvoq.jpg">放大</a>]</p><h2>7世纪</h2><h3>结婚戒指上的基督圣像（拜占庭）</h3><p>600—700年。戒指上的希腊文铭文：<strong>ΟΜΟΝΟΙΑ</strong>——和睦；<strong>ΕΙΡΙΝΗΝ ΤΗΝ ΕΜΙΝ ΔΙΔΟΜ</strong>——“我将我的平安赐给你们”（<a href="https://bibleox.com/zh-Hans/cn-sb/in/14/#L27">若 14:27</a>）。<a href="https://collections.louvre.fr/en/ark:/53355/cl010102797">卢浮宫（法国）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/68c402726594f46d35a87ef8/s_p_6nMwdRXMjOnhQWfu.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c402726594f46d35a87ef8/m_p_6nMwdRXMjOnhQWfu.jpg">放大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c4027c6594f46d35a87ef9/m_p_pNTvaGVW4AmLG2BK.jpg">版本 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c4027e6594f46d35a87efa/m_p_mvU9wZQKEIl0lFZY.jpg">版本 3</a>]</p><h3>有圣像的圣油瓶。基督、被钉十字架和升天（巴勒斯坦，拜占庭）</h3><p>600年代（初）。<a href="https://www.clevelandart.org/art/1999.46">克利夫兰艺术博物馆（美国）</a>。锡铅合金，带皮革部件。</p><img src="https://res.bibleox.com/s/img/image/simple/68caa8cf205184ec278d5884/s_p_QfQLEBTpKbF2IfJo.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68caa8cf205184ec278d5884/m_p_QfQLEBTpKbF2IfJo.jpg">放大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68caaaaf205184ec278d5887/m_p_YFRVXxytSNharyj8.jpg">版本 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68caaab2205184ec278d5888/m_p_GguW2EcCVatptKzX.jpg">版本 3</a>]</p><h3>诞神女和大殉道者狄奥多尔·斯特拉蒂拉特（塞萨洛尼基，拜占庭）</h3><p>7—10世纪（？）。塞萨洛尼基的圣狄米特里大殿。北柱南面的马赛克。</p><img src="https://res.bibleox.com/s/img/image/simple/686985345f47da2505d3ae12/s_p_HWoRkey7yaGM1D4s.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686985345f47da2505d3ae12/m_p_HWoRkey7yaGM1D4s.jpg">放大</a>]</p><h3>大殉道者狄米特里和奉献者：总主教和长官（塞萨洛尼基，拜占庭）</h3><p>7世纪。塞萨洛尼基的圣狄米特里大殿。马赛克。</p><img src="https://res.bibleox.com/s/img/image/simple/686986dc5f47da2505d3ae13/s_p_ZMXi7hFVOfpu7jbC.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686986dc5f47da2505d3ae13/m_p_ZMXi7hFVOfpu7jbC.jpg">放大</a>]</p><h3>圣乔治和孩子们（塞萨洛尼基，拜占庭）</h3><p>7世纪。塞萨洛尼基的圣狄米特里大殿。马赛克在祭坛西部。</p><img src="https://res.bibleox.com/s/img/image/simple/686987645f47da2505d3ae14/s_p_boH6uu2omR2Gjxxx.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686987645f47da2505d3ae14/m_p_boH6uu2omR2Gjxxx.jpg">放大</a>]</p><h3>圣塞尔吉（塞萨洛尼基，拜占庭）</h3><p>7世纪。塞萨洛尼基的圣狄米特里大殿。祭坛柱子上的马赛克。</p><img src="https://res.bibleox.com/s/img/image/simple/686989925f47da2505d3ae15/s_p_Faf5BLFz9WISBGej.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686989925f47da2505d3ae15/m_p_Faf5BLFz9WISBGej.jpg">放大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a742205184ec278d6fb4/m_p_YV1I98bvx4Nn6cUn.jpg">版本 2</a>]</p><h3>圣先知达味的圣像（君士坦丁堡，拜占庭）</h3><p>629—630年。<a href="https://www.metmuseum.org/art/collection/search/464380">大都会艺术博物馆（第五大道，美国）</a>。银。26.6 × 4 厘米，1397 克。另见：<a href="https://www.metmuseum.org/art/collection/search/464378">1</a>、<a href="https://www.metmuseum.org/art/collection/search/464375">2</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/68c1c3426594f46d35a87e75/s_p_5U20dlUc30xkfJeN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1c3426594f46d35a87e75/m_p_5U20dlUc30xkfJeN.jpg">放大</a>]</p><h3>有圣人像和铭文的铅封（拜占庭）</h3><p>7世纪。<a href="https://collections.hermitagemuseum.org/entity/OBJECT/270001?page=17&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=840">艾尔米塔什博物馆（俄罗斯）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/6863c2966480b4d285320419/s_p_EY1IyPYdMzjgztlB.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c2966480b4d285320419/m_p_EY1IyPYdMzjgztlB.jpg">放大</a>]</p><h3>有基督胸像和花押字的铅封（拜占庭）</h3><p>7世纪。<a href="https://collections.hermitagemuseum.org/entity/OBJECT/231980?page=2&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%B0&amp;index=96">艾尔米塔什博物馆（俄罗斯）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/6863c6076480b4d285320423/s_p_YFjOrZh2fLGJgpYJ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c6076480b4d285320423/m_p_YFjOrZh2fLGJgpYJ.jpg">放大</a>]</p><h3>有基督像和花押字的铅封（拜占庭）</h3><p>7世纪。<a href="https://collections.hermitagemuseum.org/entity/OBJECT/172196?page=2&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%B0&amp;index=57">艾尔米塔什博物馆（俄罗斯）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/6863c64d6480b4d285320424/s_p_RQupAUUa4gGtXt2n.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c64d6480b4d285320424/m_p_RQupAUUa4gGtXt2n.jpg">放大</a>]</p><h2>8世纪</h2><h3>诞神女和婴孩耶稣（君士坦丁堡，拜占庭）</h3><p>天主智慧大教堂（圣索非亚）。</p><img src="https://res.bibleox.com/s/img/image/simple/674f31b0dba77200011c73a2/s_p_2AO12RGOQ2yqRiP4.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f31b0dba77200011c73a2/m_p_2AO12RGOQ2yqRiP4.jpg">放大</a>]</p><h3>总领天使加俾额尔（君士坦丁堡，拜占庭）</h3><p>天主智慧大教堂（圣索非亚）。</p><img src="https://res.bibleox.com/s/img/image/simple/674f3256dba77200011c73a4/s_p_rfkKZFQ8IYfO6L7V.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f3256dba77200011c73a4/m_p_rfkKZFQ8IYfO6L7V.jpg">放大</a>]</p><h3>基督、被钉十字架和复活（梅斯，法国）</h3><p>870年。<a href="https://collections.louvre.fr/en/ark:/53355/cl010113244">卢浮宫（法国）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/68c422e46594f46d35a87f10/s_p_lQNRJIXri6KJoLw3.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c422e46594f46d35a87f10/m_p_lQNRJIXri6KJoLw3.jpg">放大</a>]</p><h3>基督、被钉十字架（兰斯，法国）</h3><p>870—880年。<a href="https://collections.louvre.fr/en/ark:/53355/cl010098469">卢浮宫（法国）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/68c423bc6594f46d35a87f11/s_p_NOhnffTlgTImIczW.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c423bc6594f46d35a87f11/m_p_NOhnffTlgTImIczW.jpg">放大</a>]</p><h2>9世纪</h2><h3>基督升天（塞萨洛尼基，拜占庭）</h3><p>9—10世纪。胜利者圣乔治圆形大殿（原为伽列里乌斯皇帝的陵墓）。壁画 [17][18]</p><img src="https://res.bibleox.com/s/img/image/simple/686a934c5f47da2505d3ae20/s_p_klfYhHum7wZvKR9D.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686a934c5f47da2505d3ae20/m_p_klfYhHum7wZvKR9D.jpg">放大</a>]</p><h3>基督，青铜圆形饰章（拜占庭）</h3><p>9—10世纪。圆形的图像称为圆形饰章（medallion）。<a href="https://www.britishmuseum.org/collection/object/H_1880-0820-9">大英博物馆</a>。直径：3.5 厘米。</p><p>Circular medallion; bronze; bust of Christ with cruciferous nimbus holding the book of the gospel in his left hand; inscription either side.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5be2d45c75323d28a5e92/s_p_GswK2cGnuxxnLfJr.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5be2d45c75323d28a5e92/m_p_GswK2cGnuxxnLfJr.jpg">放大</a>]</p><h3>诞神女安息（拜占庭）</h3><p>9世纪末。<a href="https://www.metmuseum.org/art/collection/search/464013">大都会艺术博物馆（第五大道，美国）</a>。材料：象牙。18.6 × 14.8 × 1.1 厘米。</p><p>New York. The Metropolitan Museum of Art. "The Glory of Byzantium,". Images of the Koimesis, or the Dormition in the West, show the Virgin lying on a bier, while her soul, represented as a baby, is offered by Christ to attendant angels who will take it to heaven. The apostles, led by Saints Paul and Peter, stand witness.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5c1bf45c75323d28a5e97/s_p_0Hg1bO8KIUVBSWJs.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5c1bf45c75323d28a5e97/m_p_0Hg1bO8KIUVBSWJs.jpg">放大</a>]</p><h3>基督、诞神女、洗者若翰、宗徒和其他圣人（君士坦丁堡）</h3><p>940—960年。<a href="https://collections.louvre.fr/en/ark:/53355/cl010112515">卢浮宫（法国）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/68c424276594f46d35a87f12/s_p_IlqGrJe04Ic0YFWv.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c424276594f46d35a87f12/m_p_IlqGrJe04Ic0YFWv.jpg">放大</a>]</p><h3>有基督和宗徒像的板（意大利）</h3><p>9世纪。<a href="https://collections.hermitagemuseum.org/entity/OBJECT/228918?page=4&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%B0&amp;index=194">艾尔米塔什博物馆（俄罗斯）</a>。尺寸：12.2 × 10.5 厘米</p><img src="https://res.bibleox.com/s/img/image/simple/6863c54f6480b4d285320421/s_p_aLvOvrKuilB614SS.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c54f6480b4d285320421/m_p_aLvOvrKuilB614SS.jpg">放大</a>]</p><h2>10世纪</h2><h3>基督、诞神女、洗者若翰（拜占庭）</h3><p>10世纪。<a href="https://www.britishmuseum.org/collection/object/H_1923-1205-2">大英博物馆</a>。材料：象牙。高：15.5 厘米。</p><p>Panel; ivory; carved with standing figures, Christ with the Virgin Mary and St John, below a pierced canopy; four holes for attachment in the raised border.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5be4045c75323d28a5e95/s_p_qEFeZyh2Gq5Wbvar.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5be4045c75323d28a5e95/m_p_qEFeZyh2Gq5Wbvar.jpg">放大</a>]</p><h3>诞神女和圣婴基督（君士坦丁堡，拜占庭）</h3><p><a href="tel:950-1025">950—1025</a>年。<a href="https://www.clevelandart.org/art/1925.1293">克利夫兰艺术博物馆（美国）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/68caa153205184ec278d5882/s_p_iLLZZkqfsUiACLDC.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68caa153205184ec278d5882/m_p_iLLZZkqfsUiACLDC.jpg">放大</a>]</p><h3>有基督和诞神女像的吊坠（拜占庭）</h3><p>1000—1300年。<a href="https://www.metmuseum.org/art/collection/search/477247">大都会艺术博物馆（第五大道，美国）</a>。玉髓浮雕；金托镶有珍珠、祖母绿、石榴石、蓝宝石和缠丝玛瑙。整体：7.2 × 5.5 × 1.6 厘米。玉髓：1 1/2 × 1 1/4 英寸（3.8 × 3.2 厘米）</p><img src="https://res.bibleox.com/s/img/image/simple/68c1bc1a6594f46d35a87e6d/s_p_VcHt7eFMtZq1I1lY.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1bc1a6594f46d35a87e6d/m_p_VcHt7eFMtZq1I1lY.jpg">放大</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/68c1bc176594f46d35a87e6c/s_p_LwWdQj6J4ehbmMh9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1bc176594f46d35a87e6c/m_p_LwWdQj6J4ehbmMh9.jpg">放大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c1bc1f6594f46d35a87e6e/m_p_gT2TXueTg5pmDsuZ.jpg">再放大</a>]</p><h3>有基督像的十字架（拜占庭）</h3><p>10—11世纪。青铜。6.6 × 4.2 厘米。<a href="https://collections.hermitagemuseum.org/entity/OBJECT/228297?page=56&amp;query=%D0%BA%D1%80%D0%B5%D1%81%D1%82&amp;sort=112&amp;index=2755">艾尔米塔什博物馆（俄罗斯）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/68c11f5b6594f46d35a87e2d/s_p_6uw78FFpsxpItSzn.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c11f5b6594f46d35a87e2d/m_p_6uw78FFpsxpItSzn.jpg">放大</a>]</p><h3>有基督像的十字架（拜占庭）</h3><p>10—11世纪。青铜。7.7 × 7 厘米。<a href="https://collections.hermitagemuseum.org/entity/OBJECT/482789?page=51&amp;query=%D0%BA%D1%80%D0%B5%D1%81%D1%82&amp;sort=112&amp;index=2501">艾尔米塔什博物馆（俄罗斯）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/68c11fab6594f46d35a87e2e/s_p_jfgfrZ4X7jcBXG9D.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c11fab6594f46d35a87e2e/m_p_jfgfrZ4X7jcBXG9D.jpg">放大</a>]</p><h3>有圣人圣像的十字架（克森尼索）</h3><p>10世纪。青铜，雕刻。<a href="https://collections.hermitagemuseum.org/entity/OBJECT/372835?page=5&amp;fundcoll=1420520446__1413747286&amp;index=229">艾尔米塔什博物馆（俄罗斯）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/68c4191a6594f46d35a87f02/s_p_iFiSEGM9EbRIhhtD.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c4191a6594f46d35a87f02/m_p_iFiSEGM9EbRIhhtD.jpg">放大</a>]</p><h3>塞萨洛尼基的圣狄米特里（拜占庭）</h3><p><a href="tel:950-1000">950—1000</a>年。<a href="https://www.metmuseum.org/art/collection/search/465946">大都会艺术博物馆（第五大道，美国）</a>。材料：象牙。19.7 × 12.1 × 1 厘米。</p><p>Standing erect, a spear in his hand and a shield at his side, Saint Demetrios is shown ready to protect the Christian faithful. The name of the popular Byzantine military saint is inscribed in two parts in Greek. Martyred in Thessalonike, the second most important city of the empire in the early centuries of the church, he has long been the patron saint of that metropolis. Images of saints in military dress are rare in Early Byzantine art (they appear on the chalices of the Attarouthi Treasure) but typical of the Middle Byzantine period.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5c38445c75323d28a5e98/s_p_ZeZuXGqxAAyDuPBA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5c38445c75323d28a5e98/m_p_ZeZuXGqxAAyDuPBA.jpg">放大</a>]</p><h2>11世纪</h2><h3>游行十字架：基督、诞神女、总领天使弥额尔和加俾额尔（拜占庭）</h3><p>1000—1050年。<a href="https://www.metmuseum.org/art/collection/search/466251">大都会艺术博物馆（第五大道，美国）</a>。59.5 × 43 × 2.2 厘米。</p><img src="https://res.bibleox.com/s/img/image/simple/68b5e3e645c75323d28a5e9b/s_p_Ft65PrnBUmI6wDAc.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5e3e645c75323d28a5e9b/m_p_Ft65PrnBUmI6wDAc.jpg">放大</a>]</p><h3>游行十字架：基督、诞神女、洗者若翰（拜占庭）</h3><p>1050年。<a href="https://www.clevelandart.org/art/1970.36">克利夫兰艺术博物馆（美国）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/68ca921d205184ec278d5871/s_p_PrD5y34JBpT95quf.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68ca921d205184ec278d5871/m_p_PrD5y34JBpT95quf.jpg">放大</a>]</p><h3>游行十字架：圣萨巴（拜占庭）</h3><p>1050年。<a href="https://www.metmuseum.org/art/collection/search/697956">大都会艺术博物馆（第五大道，美国）</a>。背面中央是圣萨巴，两端是其他圣修士。银。32.4 × 44.8 × 5.7 厘米。</p><img src="https://res.bibleox.com/s/img/image/simple/68c1c6546594f46d35a87e76/s_p_FO8cb8Ec2FqTDFz8.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1c6546594f46d35a87e76/m_p_FO8cb8Ec2FqTDFz8.jpg">放大</a>]</p><h3>游行十字架：基督（克森尼索）</h3><p>11世纪。材料：青铜，铁；铸造、锻打、雕刻。尺寸：36.5 × 27.5 厘米。<a href="https://collections.hermitagemuseum.org/entity/OBJECT/372834?page=3&amp;fundcoll=1420520446__1413747286&amp;index=106">艾尔米塔什博物馆（俄罗斯）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/68c418616594f46d35a87f01/s_p_ytqdkwIa6FDSikCw.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c418616594f46d35a87f01/m_p_ytqdkwIa6FDSikCw.jpg">放大</a>]</p><h3>“全能者基督”圣像的一部分（拜占庭，克里米亚）</h3><p>1050—1100年。<a href="https://collections.hermitagemuseum.org/entity/OBJECT/372766?page=40&amp;query=%D0%B8%D0%BA%D0%BE%D0%BD%D0%B0&amp;index=1999">艾尔米塔什博物馆（俄罗斯）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/6863bfff6480b4d285320412/s_p_XwuOAkY6yR10NT7b.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863bfff6480b4d285320412/m_p_XwuOAkY6yR10NT7b.jpg">放大</a>]</p><h3>抱着圣婴基督的诞神女（君士坦丁堡）</h3><p>1000—1015年。<a href="https://collections.louvre.fr/en/ark:/53355/cl010101133">卢浮宫（法国）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/68c43b8c6594f46d35a87f16/s_p_rQNvoLa9Vu1WmSB2.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c43b8c6594f46d35a87f16/m_p_rQNvoLa9Vu1WmSB2.jpg">放大</a>]</p><h3>诞神女，奥兰塔（君士坦丁堡）</h3><p>1000—1200年。<a href="https://collections.louvre.fr/en/ark:/53355/cl010114443">卢浮宫（法国）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/68c43bcc6594f46d35a87f17/s_p_7a5oJnVWqjfeu67t.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c43bcc6594f46d35a87f17/m_p_7a5oJnVWqjfeu67t.jpg">放大</a>]</p><h3>诞神女、总领天使弥额尔、圣狄奥多尔（拜占庭）</h3><p>11—12世纪。<a href="https://www.britishmuseum.org/collection/object/H_1981-0103-1">大英博物馆</a>。108 × 95 毫米。</p><p>Relief icon; rectangular bronze plaque cast in low relief with full-length Hodegetria flanked by the Archangel Michael and St Theodore, each wearing a girdled tunic beneath a chlamys with decorated tablion; the figures are identified by intaglio inscriptions; the whole is surrounded by a raised border with a running vine scroll; traces of solder at sides and back.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5be3545c75323d28a5e93/s_p_DFDGZ6kHm0khLKRD.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5be3545c75323d28a5e93/m_p_DFDGZ6kHm0khLKRD.jpg">放大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5be3b45c75323d28a5e94/m_p_FfmDAHv29BAMxval.jpg">再放大</a>]</p><h3>圣狄米特里的圣像（拜占庭）</h3><p>1040—1060年。<a href="https://collections.louvre.fr/en/ark:/53355/cl010115478">卢浮宫（法国）</a>。9.4 × 6.3 × 0.6 厘米。</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c0c36594f46d35a87ec0/s_p_dj04XPO3pwvzkLzr.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c0c36594f46d35a87ec0/m_p_dj04XPO3pwvzkLzr.jpg">放大</a>]</p><h3>有圣狄米特里像和铭文的铅封（拜占庭）</h3><p>11世纪。<a href="https://collections.hermitagemuseum.org/entity/OBJECT/269619?page=20&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=958">艾尔米塔什博物馆（俄罗斯）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/6863c2556480b4d285320418/s_p_oqzix7avanFfe61o.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c2556480b4d285320418/m_p_oqzix7avanFfe61o.jpg">放大</a>]</p><h3>有圣人半身像的铅封（拜占庭）</h3><p>11世纪。<a href="https://collections.hermitagemuseum.org/entity/OBJECT/267492?page=14&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=651">艾尔米塔什博物馆（俄罗斯）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/6863c3196480b4d28532041a/s_p_VySwl31Z41rar6d3.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c3196480b4d28532041a/m_p_VySwl31Z41rar6d3.jpg">放大</a>]</p><h3>有圣人像的悬挂印章（拜占庭）</h3><p>11世纪。<a href="https://collections.hermitagemuseum.org/entity/OBJECT/483272?query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=21">艾尔米塔什博物馆（俄罗斯）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/6863c4276480b4d28532041d/s_p_5EJuZ18em5TsdUwA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c4276480b4d28532041d/m_p_5EJuZ18em5TsdUwA.jpg">放大</a>]</p><h3>有圣人像的悬挂印章（拜占庭）</h3><p>11—12世纪。<a href="https://collections.hermitagemuseum.org/entity/OBJECT/483278?query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=35">艾尔米塔什博物馆（俄罗斯）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/6863c4616480b4d28532041e/s_p_H8LrRkkjwBHlc322.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c4616480b4d28532041e/m_p_H8LrRkkjwBHlc322.jpg">放大</a>]</p><h2>12世纪</h2><h3>基督、诞神女、先知若翰（君士坦丁堡，拜占庭）</h3><p>天主智慧大教堂（圣索非亚）。教堂的壁画[5]</p><img src="https://res.bibleox.com/s/img/image/simple/6750078ddba77200011c73af/s_p_EcliI0JFeV1uu1LU.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6750078ddba77200011c73af/m_p_EcliI0JFeV1uu1LU.jpg">放大</a>]</p><h3>基督（君士坦丁堡，拜占庭）</h3><p>天主智慧大教堂（圣索非亚）。</p><img src="https://res.bibleox.com/s/img/image/simple/674f332ddba77200011c73a6/s_p_1PCMz3Y4EZgbSJL0.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f332ddba77200011c73a6/m_p_1PCMz3Y4EZgbSJL0.jpg">放大</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686cf10d5f47da2505d3ae4e/s_p_ZHUiumbGoeJMn4GO.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686cf10d5f47da2505d3ae4e/m_p_ZHUiumbGoeJMn4GO.jpg">放大</a>]</p><h3>诞神女（君士坦丁堡，拜占庭）</h3><p>天主智慧大教堂（圣索非亚）。</p><img src="https://res.bibleox.com/s/img/image/simple/674f3332dba77200011c73a7/s_p_WvZb6UestGwJUzJr.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f3332dba77200011c73a7/m_p_WvZb6UestGwJUzJr.jpg">放大</a>]</p><h3>洗者若翰，先知（君士坦丁堡，拜占庭）</h3><p>天主智慧大教堂（圣索非亚）。</p><img src="https://res.bibleox.com/s/img/image/simple/674f357ddba77200011c73a8/s_p_hdfr9cx0ZPTZyn6N.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f357ddba77200011c73a8/m_p_hdfr9cx0ZPTZyn6N.jpg">放大</a>]</p><h3>抱着婴孩耶稣的诞神女（君士坦丁堡）</h3><p>12世纪前三分之一。弗拉基米尔诞神女圣像。木板，蛋彩。</p><img src="https://res.bibleox.com/s/img/image/simple/674f18e4dba77200011c7399/s_p_0uaArAqVhNX9r0gV.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f18e4dba77200011c7399/m_p_0uaArAqVhNX9r0gV.jpg">放大</a>]</p><h3>诞神女（拜占庭，叙利亚，塔尔图斯）</h3><p>12世纪。<a href="https://www.britishmuseum.org/collection/object/H_1889-0511-13">大英博物馆</a>。材料：象牙，41 × 47 毫米。</p><p>Relief icon; pale grey-green steatite; rounded at the top and square below; bust of the Virgin, her mantle drawn over her head, with St Andrew's cross on it; her hands held in front with palms outwards, inscription either side of her.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5be2645c75323d28a5e91/s_p_StVNlxiOjocLLsz5.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5be2645c75323d28a5e91/m_p_StVNlxiOjocLLsz5.jpg">放大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5be2245c75323d28a5e90/m_p_yHJ3BkdNwVGdLb4m.jpg">再放大</a>]</p><h3>塞萨洛尼基的大殉道者狄米特里和辅祭（塞萨洛尼基，拜占庭）</h3><p>12世纪。南柱东面的马赛克。</p><img src="https://res.bibleox.com/s/img/image/simple/68698a155f47da2505d3ae16/s_p_n7AgnVLPvfeBX5Qq.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68698a155f47da2505d3ae16/m_p_n7AgnVLPvfeBX5Qq.jpg">放大</a>]</p><h3>引路者（Hodegetria）诞神女圣像（拜占庭，克森尼索）</h3><p>12世纪下半叶。<a href="https://collections.hermitagemuseum.org/entity/OBJECT/372931?page=11&amp;fundcoll=1420520446&amp;index=536">艾尔米塔什博物馆（俄罗斯）</a>。6.8 × 5 厘米</p><img src="https://res.bibleox.com/s/img/image/simple/6863bf2f6480b4d285320411/s_p_10YV8HIpAzMNCgvp.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863bf2f6480b4d285320411/m_p_10YV8HIpAzMNCgvp.jpg">放大</a>]</p><h2>13世纪</h2><h3>全能的主（阿索斯）</h3><p>希兰达尔修道院，圣山阿索斯。</p><img src="https://res.bibleox.com/s/img/image/simple/69406737205184ec278d6fd8/s_p_hTWcEC5QtmbCrC5t.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69406737205184ec278d6fd8/m_p_hTWcEC5QtmbCrC5t.jpg">放大</a>]</p><h3>抱着婴孩耶稣的诞神女（引路者，阿索斯）</h3><p>希兰达尔修道院，圣山阿索斯。</p><img src="https://res.bibleox.com/s/img/image/simple/674f0cfadba77200011c7395/s_p_mQMRA7FGLEbqOYIx.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f0cfadba77200011c7395/m_p_mQMRA7FGLEbqOYIx.jpg">放大</a>]</p><h2>14世纪</h2><h3>全能的主</h3><p>圣像画家曼努埃尔·潘塞利诺斯。</p><img src="https://res.bibleox.com/s/img/image/simple/674f28d1dba77200011c739e/s_p_ma0z14hIFXCiEj7S.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f28d1dba77200011c739e/m_p_ma0z14hIFXCiEj7S.jpg">放大</a>]</p><h3>诞神女（塞萨洛尼基）</h3><p>1310—1315年。奥兰塔。希腊塞萨洛尼基圣尼古拉·奥尔法诺斯教堂的壁画。</p><img src="https://res.bibleox.com/s/img/image/simple/674f29b7dba77200011c739f/s_p_PSuCdQIYdR4IYZgA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f29b7dba77200011c739f/m_p_PSuCdQIYdR4IYZgA.jpg">放大</a>]</p><h3>至圣诞神女进堂（君士坦丁堡）</h3><p>约1316—1321年。卡里耶清真寺，霍拉修道院，土耳其伊斯坦布尔（君士坦丁堡）。</p><img src="https://res.bibleox.com/s/img/image/simple/675343bddba7720001cd0ddf/s_p_AtF4vpmhv6FneUfA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/675343bddba7720001cd0ddf/m_p_AtF4vpmhv6FneUfA.jpg">放大</a>]</p><h2>15世纪</h2><h3>宗徒保禄（罗斯）</h3><p>1410年代。作者：圣安德烈·鲁布廖夫。国立特列季亚科夫美术馆，俄罗斯莫斯科。</p><img src="https://res.bibleox.com/s/img/image/simple/6909fbca205184ec278d6e6a/s_p_ok25vNdlaQMM5P3c.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6909fbca205184ec278d6e6a/m_p_ok25vNdlaQMM5P3c.jpg">放大</a>]</p><h2>圣像集</h2><ol><li><p>地下墓穴图像集，Word文件：<a href="https://disk.yandex.ru/d/mHc8dxUdHGqMEQ">链接</a></p></li><li><p>圣像画家曼努埃尔·潘塞利诺斯的作品（13—14世纪）：<a href="https://vk.com/album-20034910_224123875">https://vk.com/album-20034910_224123875</a></p></li></ol>
