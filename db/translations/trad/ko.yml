- src: Древние_христианские_храмы
  path: Ch2c_고대_그리스도교_성당
  title: 고대 그리스도교 성당
  title_sub:
  body: '<h2>제사(題詞)</h2><blockquote><p>“무리 중 어떤 바리새인들이 말하되 선생이여 당신의 제자들을 책망하소서 하거늘 대답하여 이르시되 내가 너희에게 말하노니 <strong>만일 이 사람들이 침묵하면 돌들이 소리 지르리라</strong> 하시니라”(<a href="https://bibleox.com/ko/ko-nkrv/lk/19/#L39-40">눅 19:39-40</a>)</p></blockquote><h2>3세기</h2><h3>고대 도시 므깃도 근처, <a href="https://he.wikipedia.org/wiki/%D7%9C%D7%92%D7%99%D7%95">레기오</a> 마을의 성당(230년경)</h3><p>고대 그리스도교 성당에서는 제단이 가운데에 놓이는 일이 많았습니다. 이 성당이 좋은 예입니다.</p><p>므깃도 근처(고대에는 로마 군단이 주둔하여 <a href="https://he.wikipedia.org/wiki/%D7%9C%D7%92%D7%99%D7%95">레기오</a>라는 마을이 있었습니다). 마을의 높은 곳에 건물이 있었는데, 동전과 도기와 글씨체로 230년의 것으로 연대가 정해졌습니다. 그 건물의 방 하나가 그리스도교 성당이었습니다. 바닥에는 글이 새겨진 큰 모자이크가 여럿 있고(그 하나는 그리스도를 하느님이라 부릅니다), 가운데에는 제단이 있습니다. 그 곁에는 이 상을 누가 바쳤는지 적은 글도 있습니다.</p><img src="https://res.bibleox.com/s/img/image/simple/692c58f9205184ec278d6f97/s_p_aZ3NifF9BW3oqZ1a.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c58f9205184ec278d6f97/m_p_aZ3NifF9BW3oqZ1a.jpg">크게 보기</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/692c587d205184ec278d6f91/s_p_MvOQRFKiCv6XaXOd.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c587d205184ec278d6f91/m_p_MvOQRFKiCv6XaXOd.jpg">크게 보기</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/692c58ee205184ec278d6f96/s_p_5wNRtqyrpQivbBim.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c58ee205184ec278d6f96/m_p_5wNRtqyrpQivbBim.jpg">크게 보기</a>] [<a href="https://res.bibleox.com/s/img/image/simple/692c58e0205184ec278d6f95/m_p_FQvEfj70dP7967X3.jpg">추가 사진 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/692c58ce205184ec278d6f94/m_p_9xoiCsqROihBYnL0.jpg">추가 사진 3</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/692c58b5205184ec278d6f93/s_p_Cvww0C8ZGmbqJS7a.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c58b5205184ec278d6f93/m_p_Cvww0C8ZGmbqJS7a.jpg">크게 보기</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/692c5882205184ec278d6f92/s_p_WU59e3c2XbPWkdaM.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c5882205184ec278d6f92/m_p_WU59e3c2XbPWkdaM.jpg">크게 보기</a>]</p><p><strong>비문:</strong></p><p>성당 바닥의 비문은 모두 일종의 <strong>기억 명단(추도 명단)</strong>입니다. 아주 옛날부터 지금까지 정교회 성당에는, 예배를 드릴 때마다 성당을 지었거나 중요한 것을 바친 사람들의 이름을 기도 가운데 기억하는 전통이 있습니다. 여기서도 기억해 달라는 부탁과 함께 모자이크 바닥을 바친 사람(백부장 가이아노스 포르피리오스), 그것을 깐 사람(브루티오스), 제단을 바친 사람(아켑투스), 그리고 아마 바친 사람들의 친족인 다른 이름들, 곧 프리밀라, 키리아카, 도로테아, 크레스테가 적혀 있습니다. 같은 방식으로 산 사람과 죽은 사람을 기억하며 성찬 성작과 향로 같은 교회 기물도 바쳤습니다(<a href="https://bibleox.com/ru/ru/w/%D0%B4%D1%80%D0%B5%D0%B2%D0%BD%D0%B8%D0%B5-%D0%B8%D0%BA%D0%BE%D0%BD%D1%8B#HH-%D0%95%D0%B2%D1%85%D0%B0%D1%80%D0%B8%D1%81%D1%82%D0%B8%D1%87%D0%B5%D1%81%D0%BA%D0%B8%D0%B5-%D1%87%D0%B0%D1%88%D0%B8-%D0%B8-%D0%BA%D0%B0%D0%B4%D0%B8%D0%BB%D0%B0-%D1%81-%D0%B8%D0%BA%D0%BE%D0%BD%D0%B0%D0%BC%D0%B8-%D0%92%D0%B8%D0%B7%D0%B0%D0%BD%D1%82%D0%B8%D1%8F-%D0%A1%D0%B8%D1%80%D0%B8%D1%8F-%D0%90%D1%82%D1%82%D0%B0%D1%80%D1%83%D1%82%D0%B8">자세히</a>).</p><blockquote><p>한국어 번역: 하느님을 사랑하는 아켑투스가 이 상을 하느님이신 예수 그리스도께 기념으로 바쳤다.</p></blockquote><blockquote><p>EN: Akeptous, the God-loving, offered the table to God Jesus Christ as a memorial.</p></blockquote><blockquote><p>Transcription: <strong>Prosēniken Akeptous, ē philotheos, tēn trapezan Th(e)ō Ι(ēso)u Ch(rist)ō mnēmosunon.</strong></p></blockquote><blockquote><p>Orig: <strong>ΠΡΟСΗΝΙΚΕΝ ΑΚΕΠΤΟΥС, Η ΦΙΛΟΘΕΟС, ΤΗΝ ΤΡΑΠΕΖΑΝ Θ(Ε)Ω Ι(ΗСΟ)Υ Χ(ΡΙСΤ)Ω ΜΝΗΜΟСΥΝΟΝ</strong></p></blockquote><blockquote><p>ΠΡΟϹΗΝΙΚΕΝ</p><p>ΑΚΕΠΤΟΥϹ,</p><p>Η ΦΙΛΟΘΕΟϹ,</p><p>ΤΗΝ ΤΡΑΠΕ-</p><p>ZΑΝ <strong>{ΘW} {ΙΥ} {ΧW}*</strong></p><p>ΜΝΗΜΟϹΥΝΟΝ</p></blockquote><p>*노미나 사크라(거룩한 이름의 약어): <strong>ΘW ΙΥ ΧW</strong> = θεῷ Ἰησοῦ Χριστῷ = 하느님 예수 그리스도</p><img src="https://res.bibleox.com/s/img/image/simple/692c5df3205184ec278d6f9a/s_p_swifwBDbtzgImkZ6.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c5df3205184ec278d6f9a/m_p_swifwBDbtzgImkZ6.jpg">크게 보기</a>]</p><hr><blockquote><p>ΕΝ: Remember Primilla and Cyriaca and Dorothea, and moreover also Chreste.</p></blockquote><blockquote><p>한국어 번역: 프리밀라와 키리아카와 도로테아, 그리고 크레스테도 기억하라.</p></blockquote><blockquote><p>Orig: <strong>ΜΝΗΜΟΝΕΥСΑΤΕ ΠΡΙΜΙΛΛΗС ΚΑΙ ΚΥΡΙΑΚΗС ΚΑΙ ΔWΡΟΘΕΑС ΕΤΙ ΔΕ ΚΑΙ ΧΡΗСΤΗ</strong></p></blockquote><blockquote><p>Fixed: <strong>ΜΝΗΜΟΝΕΥСΑΤΕ ΠΡΙΜΙΛΛΗС ΚΑΙ ΚΥΡΙΑΚΗΣ ΚΑΙ ΔΩΡΟΘΕΑΣ ΕΤΙ ΔΕ ΚΑΙ ΧΡΗΣΤΗ</strong></p></blockquote><img src="https://res.bibleox.com/s/img/image/simple/692c5dec205184ec278d6f99/s_p_LVbgKrKO7P3dfEJP.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c5dec205184ec278d6f99/m_p_LVbgKrKO7P3dfEJP.jpg">크게 보기</a>]</p><hr><blockquote><p>한국어 번역: 포르피리오스라고도 하는 가이아노스, 백부장, 우리 형제가 자기 재산으로 크게 너그러이 이 바닥을 깔았다. 브루티오스가 그 일을 했다.</p></blockquote><blockquote><p>EN: Gaianus, also called Porphyrius, centurion (xp), our brother, has made the pavement at his own expense as an act of liberality. Brutius has carried out the work.</p></blockquote><blockquote><p>Orig: <strong>ΓΑΙΑΝΟС Ο ΚΑ ΠΟΡΦΥΡΙС ΧΡ* ΑΔΕΛΦΟС ΗΜWΝ ΕΚ ΦΙΛΟΤΕ ΙΜΙС ΑΜΕΝ ΟСΕΚΤW ΝΙΔΙWΝ ΕΨΙ ΦΟΛΟΓΗСΕΝ. ΒΡΟVΤΙС ΗΡΓΑСΑΤΟ.</strong></p></blockquote><blockquote><p>Fixed: <strong>ΓΑΙΑΝΟΣ Ο ΚΑ ΠΟΡΦΥΡΙΣ ΧΡ* ΑΔΕΛΦΟΣ ΗΜΩΝ ΕΚ ΦΙΛΟΤΕ ΙΜΙΣ ΑΜΕΝ ΟΣΕΚΤΩ ΝΙΔΙΩΝ ΕΨΙ ΦΟΛΟΓΗΣΕΝ. ΒΡΟΥΤΙΣ ΗΡΓΑΣΑΤΟ.</strong></p></blockquote><p><strong>*ΧΡ — hekatontarches — centurio</strong></p><img src="https://res.bibleox.com/s/img/image/simple/692c5e27205184ec278d6f9b/s_p_Qk321JfFTD4dDmnd.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c5e27205184ec278d6f9b/m_p_Qk321JfFTD4dDmnd.jpg">크게 보기</a>]</p><h3>두라 에우로포스의 성당(시리아)</h3><p>244년, 두라 에우로포스의 그리스도교 성당</p><img src="https://res.bibleox.com/s/img/image/simple/6931880c205184ec278d6fa6/s_p_DFnp7s0vcTbXb3Qn.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931880c205184ec278d6fa6/m_p_DFnp7s0vcTbXb3Qn.jpg">크게 보기</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/69318806205184ec278d6fa5/s_p_PuUKcoZEfAVSlPNM.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69318806205184ec278d6fa5/m_p_PuUKcoZEfAVSlPNM.jpg">크게 보기</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/69318802205184ec278d6fa4/s_p_MF4zgk1ySUOBpqnG.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69318802205184ec278d6fa4/m_p_MF4zgk1ySUOBpqnG.jpg">크게 보기</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/414/s_p_UgKueSl1yxG0SfbA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/414/m_p_UgKueSl1yxG0SfbA.jpg">크게 보기</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/69330ed8205184ec278d6fc0/s_p_kXy4nTuYVCOxuDib.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69330ed8205184ec278d6fc0/m_p_kXy4nTuYVCOxuDib.jpg">크게 보기</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/693187fd205184ec278d6fa3/s_p_R3poESL99kNRMpXi.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/693187fd205184ec278d6fa3/m_p_R3poESL99kNRMpXi.jpg">크게 보기</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/69330e9e205184ec278d6fbf/s_p_ThLs4WrxsJ3ykxKU.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69330e9e205184ec278d6fbf/m_p_ThLs4WrxsJ3ykxKU.jpg">크게 보기</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/69330e76205184ec278d6fbe/s_p_NykNwaI9TEwz1Ccf.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69330e76205184ec278d6fbe/m_p_NykNwaI9TEwz1Ccf.jpg">크게 보기</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/69330e70205184ec278d6fbd/s_p_Rd3jEzEeesXUCTmh.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69330e70205184ec278d6fbd/m_p_Rd3jEzEeesXUCTmh.jpg">크게 보기</a>]</p><p>성당에는 신약의 사건을 그린 벽화가 있습니다. 물에 빠져 가던 사도 베드로가 구원받는 장면과 양문 곁 못에서 병자가 고침을 받는 장면(그리스도의 기적 연작 가운데 이 두 벽화만 남았습니다), 그리고 선한 목자입니다.</p><p><strong>물에 빠져 가던 사도 베드로가 구원받음</strong></p><img src="https://res.bibleox.com/s/img/image/simple/692c8038205184ec278d6f9e/s_p_QQ2Rml8gUWsyQtS9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c8038205184ec278d6f9e/m_p_QQ2Rml8gUWsyQtS9.jpg">크게 보기</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6786b88ddba77200015ae11c/m_p_do380IVDukCAfdFk.jpg">다른 사진 2</a>]</p><p><strong>양문 곁 못에서 병자가 고침을 받음</strong></p><img src="https://res.bibleox.com/s/img/image/simple/6786b889dba77200015ae11b/s_p_k1a5GDBvfzTCWmZv.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6786b889dba77200015ae11b/m_p_k1a5GDBvfzTCWmZv.jpg">크게 보기</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6786bb0bdba77200015ae11d/m_p_dCRD85foL69l7kih.jpg">다른 사진</a>]</p><p><strong>세례반 곁의 그림(6번 방): 선한 목자가 잃은 양을 양 떼에게 되돌려 놓음</strong></p><img src="https://res.bibleox.com/s/img/image/simple/6931870c205184ec278d6fa2/s_p_uBkNi8jGsMFpOQSM.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931870c205184ec278d6fa2/m_p_uBkNi8jGsMFpOQSM.jpg">크게 보기</a>]</p><h3>가이사랴의 에우세비오스(팜필리), 주교, 교회사가(258년경~339년)</h3><p>그는 로마 황제 디오클레티아누스의 통치(284~305년) 이전 시기에 모든 도시에서 그리스도교 성당이 세워진 일을 기록합니다. 303년 디오클레티아누스는 그리스도교 성당을 허물라는 칙령을 내립니다. 이 칙령 때 에우세비오스는 45세쯤이었으므로, 성당이 세워지는 것도 무너지는 것도 직접 보았을 것입니다.</p><blockquote><p>5. 총독과 장관들은 교회의 지도자들을 얼마나 호의로 대했던가! <strong>도시마다 모인 수천 명의 모임</strong>, <strong>기도의 집으로 몰려드는 놀라운 무리</strong>를 어떻게 다 묘사하겠는가? <strong>옛 건물로는 모자라, <mark>모든 도시에서 새로 넓은 교회를 기초부터 세웠다</mark>(εὐρείας εἰς πλάτος ἀνὰ πάσας τὰς πόλεις ἐκ θεμελίων ἀνίστων <mark>ἐκκλησίας</mark>).</strong></p><p>&lt;…&gt;</p><p>4. 디오클레티아누스 통치 제19년, 디스트로스 월(로마인의 3월), 주님 수난 축일이 다가올 때 <strong><mark>교회를 땅바닥까지 허물라는 황제의 칙서</mark>(βασιλικὰ γράμματα, τὰς μὲν <mark>ἐκκλησίας</mark> εἰς ἔδαφος φέρειν)</strong>가 곳곳에 붙었고, 성경은 불태우며 그리스도교를 지키는 사람들은 명예로운 지위를 잃는다고 선포되었다.</p></blockquote><p>(<a href="https://bibleox.com/ko/grc/w/%CE%95%CE%9A%CE%9A%CE%9B%CE%97%CE%A3%CE%99%CE%91%CE%A3%CE%A4%CE%99%CE%9A%CE%97%CE%A3_%CE%99%CE%A3%CE%A4%CE%9F%CE%A1%CE%99%CE%91%CE%A3-8/#:~:text=%E1%BC%80%CE%BD%E1%BD%B0%20%CF%80%E1%BD%B1%CF%83%CE%B1%CF%82%20%CF%84%E1%BD%B0%CF%82%20%CF%80%E1%BD%B9%CE%BB%CE%B5%CE%B9%CF%82%20%E1%BC%90%CE%BA%20%CE%B8%CE%B5%CE%BC%CE%B5%CE%BB%E1%BD%B7%CF%89%CE%BD%20%E1%BC%80%CE%BD%E1%BD%B7%CF%83%CF%84%CF%89%CE%BD%20%E1%BC%90%CE%BA%CE%BA%CE%BB%CE%B7%CF%83%E1%BD%B7%CE%B1%CF%82">『교회사』 8권 1.5, 2.4</a>, 그리스어에서 옮김)</p><h2>의심스러운 발견</h2><h3><strong>헤르쿨라네움의 집(</strong>1세기<strong>)</strong></h3><img src="https://res.bibleox.com/s/img/image/simple/67e428d39a4a346bba31e8ba/s_p_F0lTpC2rqw7PVyf1.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/67e428d39a4a346bba31e8ba/m_p_F0lTpC2rqw7PVyf1.jpg">크게 보기</a>] [<a href="https://res.bibleox.com/s/img/image/simple/69330b68205184ec278d6fb8/m_p_oEOCtcPUBThtuirO.jpg">다른 사진 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/69330cb6205184ec278d6fb9/m_p_zMmSTHDi5RoizXsX.jpg">다른 사진 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/69330cbb205184ec278d6fba/m_p_Jv9gdiBWmrMB5tc4.jpg">다른 사진 4</a>] [<a href="https://res.bibleox.com/s/img/image/simple/67e428d79a4a346bba31e8bb/m_p_1sEN1KSZxei96K4S.jpg">다른 사진 5</a>] [<a href="https://res.bibleox.com/s/img/image/simple/67e428db9a4a346bba31e8bc/m_p_TgMWk123osBJ9une.jpg">다른 사진 6</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/69330cc3205184ec278d6fbc/s_p_YLRMNDvDg7nCTh3X.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69330cc3205184ec278d6fbc/m_p_YLRMNDvDg7nCTh3X.jpg">크게 보기</a>]</p><p>79년 베수비오 화산이 폭발하여 폼페이, 스타비아이, 헤르쿨라네움 같은 도시들을 화산재 아래 묻었습니다. 헤르쿨라네움에서 <a href="https://ru.wikipedia.org/wiki/%D0%93%D0%B5%D1%80%D0%BA%D1%83%D0%BB%D0%B0%D0%BD%D1%83%D0%BC#%D0%94%D0%BE%D0%BC_%D0%B4%D0%B2%D1%83%D1%85%D1%81%D0%BE%D1%82%D0%BB%D0%B5%D1%82%D0%B8%D1%8F">집</a>(러시아어)이 발견되었는데(발굴 200주년을 기념해 ‘200주년의 집’이라 부릅니다), 그 2층 방 벽, 나무 장 바로 위 가운데에 <a href="https://ermakvagus.com/Europe/Italy/Pompeii/christianity_pompeii_rus.html">십자가 모양의 홈</a>(러시아어)이 있었습니다. 어떤 이들은 거기에 기도용 나무 십자가가 걸려 있었고 이 방이 그리스도교 예배나 가정 기도에 쓰였다고 추측합니다. 그러나 이 추측에는 강한 반론이 있습니다. 같은 도시에서 벽에 비슷한 자국을 남겼을 수 있는 선반이 발견되었습니다.</p><img src="https://res.bibleox.com/s/img/image/simple/6932ff2b205184ec278d6fb6/s_p_cXmpauqq2EYuH6ww.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6932ff2b205184ec278d6fb6/m_p_cXmpauqq2EYuH6ww.jpg">크게 보기</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6932ff36205184ec278d6fb7/s_p_KIfO7M0rbhGbWoIk.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6932ff36205184ec278d6fb7/m_p_KIfO7M0rbhGbWoIk.jpg">크게 보기</a>] [<a href="https://res.bibleox.com/s/img/image/simple/69330cbf205184ec278d6fbb/m_p_WL1FQysNlwZc0yT9.jpg">다른 사진 2</a>]</p><p>그 선반은 똑같지는 않아서 좌우로 꽤 크게, 아래로는 작게 튀어나와 있습니다. 또 200주년의 집에서는 벽의 이 자리에 여닫는 문짝 두 개가 있었던 것으로 보입니다. 그래도 200주년의 집에 있던 것이 십자가가 아니라 평범한 선반이었을 가능성이 높습니다. 어떤 결론을 얼마나 믿을지는 독자가 스스로 판단해야 합니다. 여기서는 이 발견에 관해 알려진 정보를 모았을 뿐입니다.</p>'
