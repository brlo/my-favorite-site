  path: Bu3i_그리스도인의_무덤과_비문
  title: 그리스도인의 무덤과 비문
  title_sub:
  body: '<h2>초기 몇 세기 그리스도인의 무덤 비문</h2><p>아피아 가도의 이른바 “사도들의 메모리아”의 트리클리아(회식하는 방)에 있는 비문. 이 성소는 3세기 중엽, 238년에서 260년 사이에 만들어졌습니다. 같은 3세기에 트리클리아에는 “<em>Paule ed Petre petite pro Victore</em>” 같은 그리스도교 기도 비문이 나타나기 시작했습니다(아래에 소개합니다). 사람들은 콘스탄티누스 대제 시대까지 이런 글을 계속 새겼습니다. [1]</p><img src="https://res.bibleox.com/s/img/image/simple/483/s_p_1D8zprHe86ZZn5O9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/483/m_p_1D8zprHe86ZZn5O9.jpg">크게 보기</a>]</p><h3><strong>마음에, 여러분의 기도 가운데 기억해 주십시오 </strong>(in mente habete, in orationibus vestris):</h3><p>12912: [Petre et] Paul[e] | in m[ente] abete in | ora[tion]ibus vestris/ — <strong>“베드로와 바울이여, 마음에, 여러분의 기도 가운데 기억해 주십시오…”</strong></p><h3><strong>전구해 주십시오 </strong>(petite)(또는 “기도해 주십시오”, “청해 주십시오”)</h3><p>12918: [Paul]e et Petre petite | [pro] nobis omnibus/ — <strong>“바울과 베드로여, 우리 모두를 위하여 전구해 주십시오!”</strong></p><p>12931: Petr[e] et Pau[l]e petite | pro [Le]ontium / — <strong>“베드로와 바울이여, 레온티우스를 위하여 전구해 주십시오!”</strong></p><p>12933: Pa[ul]e et Pet|re apetite pro Da|tivu in perpetu`u´m/ — <strong>“바울과 베드로여, 다티부스를 위하여 영원히 전구해 주십시오!”</strong></p><p>12989: Paule ed Petre petite | pro Victore/ — <strong>“바울과 베드로여, 빅토르를 위하여 전구해 주십시오!”</strong></p><p>12946: [Petre et Pa]ulae spir[ita sancta vestra petant pro - - -]/ — <strong>“베드로와 바울이여, 여러분의 거룩한 영이 [- - -]를 위하여 전구하기를!”</strong></p><h3><strong>conservate</strong> — <strong>지켜 주십시오</strong>(또는 “보존해 주십시오”)</h3><p>12991: Petre et Paule cons[ervate - - -]/ — <strong>“베드로와 바울이여, [- - -]를 지켜 주십시오!”</strong></p><p>12996: sa[lva Paule et] | Petr[e - - - et] | Mart[yrium et] | conse[rvate in] | do[mino - - -]/ — <strong>“오 바울과 베드로여, [- - -]와 마르티리우스를 구원하시고 주님 안에서 지켜 주십시오 [- - -]!”</strong></p><p>13026: [- - - roga]mus | [conse]rvate nos [omnes]/ — <strong>“[- - -] 우리가 청합니다, 우리 모두를 지켜 주십시오!”</strong></p><h3><strong>간단한 부름</strong></h3><p>12909: Petr[e et Paule]/ — <strong>“오 베드로와 바울이여!”</strong></p><h3><strong>죄인을 위한 도움</strong></h3><p>12967: Petre et Paule sub|venite Prim[o] | peccatori/ — <strong>“베드로와 바울이여, 죄인 프리무스를 도우러 오십시오!”</strong></p><h3><strong>많은 부름은 그리스어로, 또는 그리스 문자로 쓴 라틴어로 되어 있습니다</strong></h3><p>12927: Παῦλε {μ} καί | μου πατ|ρός/ — <strong>“바울이여, 내 아버지도 (도와주십시오)!”</strong></p><p>12997: [Παυλ]ε ετ Πετ[ρε ιν μεν]/[τε ν]ος αβετε [ιν ορα]/[τι]ωνες βεστ[ρας]/ — <strong>“바울과 베드로여, 마음에, 여러분의 기도 가운데 기억해 주십시오…”</strong></p><p>13045: [Πα]υ[λε ετ Πετρε] | [ι]ν με[ντε αβετε] | Αὐφίδ[ιον υἱόν - - -] | μου/ — <strong>“바울과 베드로여, 내 아들 아우피디우스를 기억해 주십시오!”</strong></p><p>13069: Πέτρε Παίτρε μνημόνευαι | Τιμοκράτην καὶ Εὐ|τυχείαν κινα(?) καὶ | ἐσώρα(?) ++ [- - -]/ — <strong>“베드로여, 베드로여, 티모크라테스와 에우티키아와 (…)를 기억해 주십시오 ++ [- - -]!”</strong></p><p>13045: [κομμ]ανδαμ[ους? - - -]/<strong> </strong>— <strong>“[- - -]를 맡깁니다.”</strong></p><p>13049: Παῦλε καὶ Π[έτρε ἔχετε] / μνί[α]ς/ — <strong>“바울과 베드로여, [- - -]를 기억해 주십시오!”</strong></p><p>13055: [Παῦλε καὶ Πέτ]ρε εἰς μνε[ίαν] / [ἔχετε τὸν ᾿Ιρ]ίνες φίλι[ον]/ — <strong>“바울과 베드로여, 이레네가 사랑하는 이를 기억해 주십시오.”</strong></p><p>13070: Παυλε Πετρε | Χαλκηδονι ανιμα | βωβυς κομαν|[δ]ω Λαυrους/ — <strong>“바울과 베드로여, 나 라우루스(라우루시우스?)가 칼케도니우스의 영혼을 여러분께 맡깁니다!”</strong></p><p>13071: &lt;Π&gt;α[ῦλ]ος καὶ | Π[έτρο]ς συν|τηρή[σα]τε θ(εο)ῦ δούλους | πνεύματα | ἅγεια συντη|ρήσαται ἡμᾶ|ς ἴνα πολλοῖς | ἔτεσε[ι ζῶμεν]/ — <strong>“바울과 베드로여, 하느님의 종들을 지켜 주십시오! 거룩한 영들이여, 우리가 여러 해 살도록 지켜 주십시오!”</strong></p><p>13073: [Παυλε] ετ Πετρε | [ιν με]ντε [ν]ος αβε|[τοτε εἰς το]ὺς ἐῶ[νας]/<strong> </strong>— <strong>“바울과 베드로여, 영원히 우리를 기억해 주십시오…”</strong></p><h3><strong>promisit / votum fecit</strong> — <strong>서원했다</strong></h3><p>13091: [- - - i]dus m[- - -] | Eulogius votum f[ecit]/ — <strong>“[- - -] 이두스의 [- - -] 날에 에울로기우스가 서원했다 [- - -].”</strong></p><h3><strong>레프리게리움</strong>(기억의 식사) 언급:</h3><p>12942: refrigerav[it] | [F]elicissimus cum s[uis]/ — <strong>“펠리키시무스가 가족과 함께 식사를 베풀었다.”</strong></p><p>12981: Petro et Paulo | Tomius Coelius | refri`ger´&lt;i&gt;um feci/ — <strong>“베드로와 바울을 위하여 나 토미우스 코일리우스가 식사를 베풀었다.”</strong></p><p>13003: [---] at Paulu[m] | et Pet[rum] | refri[geravi - - -]/ — <strong>“바울과 베드로 곁에서 나는 식사를 베풀었다.”</strong></p><p>출처: <a href="http://csla.history.ox.ac.uk/record.php?recid=E05087">http://csla.history.ox.ac.uk/record.php?recid=E05087</a></p><hr><h3>하느님께 드리는 부름</h3><ul><li><p>DEVS TE PRECOR VТ PARADISVM LVCIS POSSIT VIDERE – “<strong>주님, 당신께 청하오니, 그가 낙원의 빛을 보게 하소서</strong>”.</p></li><li><p>DOMINE NE QVANDO ADVMBRETVR SPIRITVS VENERES – “<strong>주님, 베누스의 영혼이 결코 어두워지지 않게 하소서</strong>”.</p></li></ul><h3>세상을 떠난 이에게 전구를 청함</h3><ul><li><p>ET IN ORATIONIS TVIS ROGES PRO NOBIS QVIA SCIMVS TE ☧ – “<strong>당신의 기도 가운데 우리를 위해 청해 주십시오. 우리는 당신이 그리스도 안에 있음을 압니다</strong>”.</p></li><li><p>ORO SCIO NAMQVE BEATAM – “<strong>당신께 청합니다. 당신이 복락 가운데 있음을 알기 때문입니다</strong>”.</p></li><li><p>ORA PRO PARENTI BVS TVIS – “<strong>당신의 가족을 위하여 기도해 주십시오</strong>”.</p></li><li><p>PETE PRO NOS VТ SALVI SIMVS – “<strong>우리가 구원받도록 우리를 위하여 기도해 주십시오</strong>”.</p></li><li><p>IN ORATIONIS TVIS ROGES PRO NOBIS – “<strong>당신의 기도 가운데 우리를 위해 청해 주십시오</strong>”.</p></li><li><p>ATTICE SPIRITVS TVS IN BONV ORA PRO PARENTIBVS TVIS – “<strong>아티쿠스여, 당신의 영혼은 복락 가운데 있습니다. 당신의 가족을 위하여 기도해 주십시오</strong>”.</p></li></ul><p>여기에는 일부만 실었습니다. 나머지 자료는 링크에서 볼 수 있습니다.</p><h3><strong>비문과 상징적 형상</strong></h3><ul><li><p>무덤에 아주 자주 새겨지는 VIVAS, 곧 “<strong>살아라</strong>”라는 말은 세상을 떠난 이에게 영원한 생명과 복락을 바라는 뜻입니다.</p></li><li><p>VIVAS IN DEO – “<strong>하느님 안에서 살아라</strong>”.</p></li><li><p>VIBAS IN SANCTIS – “<strong>성인들 가운데서 살아라</strong>”.</p></li></ul><h3>세상을 떠난 이가 구원에 이르렀다</h3><p>때로는 묻힌 사람이 택함받은 이들 가운데 있다고 더 분명하게 말하기도 합니다.</p><ul><li><p>ACCEPIT REQVI EM IN DEO – “<strong>그는 하느님 안에서 안식을 얻었다</strong>”.</p></li><li><p>SCIMVS ТЕ IN – “<strong>우리는 당신이 그리스도 안에 있음을 안다</strong>”.</p></li><li><p>FRVCTVOSVS ANIMA ТVА СVМ IVSTIS – “<strong>프룩투오수스여, 당신의 영혼은 의인들과 함께 있다</strong>”.</p></li><li><p>REQVI EM ADCEPIT IN DEO PATRE NOSTRO ET CHRISTO EIVS – “<strong>그는 우리 아버지 하느님과 그분의 그리스도 안에서 안식을 얻었다</strong>”.</p></li><li><p>ACCEPTA APVD DEVM – “<strong>하느님께 받아들여진 여인</strong>”.</p></li><li><p>RECEPTVS AD DEVM – “<strong>하느님께 받아들여진 이</strong>”.</p></li><li><p>ТЕСVМ PAX CHRISTI – “<strong>그리스도의 평화가 당신과 함께</strong>”.</p></li><li><p>SEMPER VIVE IN РАСЕ – “<strong>영원히 평화 가운데 살아라</strong>”.</p></li><li><p>IN РАСЕ ET IN DOMO AETERNA DEI – “<strong>평화 가운데, 그리고 하느님의 영원한 집 안에</strong>”.</p></li><li><p>VIVI IN GLORIA DEI ET IN PACE DOMINI NOSTRI ☧ – “<strong>당신은 하느님의 영광과 우리 주 그리스도의 평화 안에 살고 있다</strong>”. 여기서 구세주의 이름은 모노그램 ☧로 표시되어 있습니다.</p></li><li><p>ELATVS EST도 일종의 환호로, 한두 번밖에 나오지 않지만 “<strong>그는 하느님께로 올라갔다</strong>”로 옮길 수 있습니다.</p></li></ul><h3>낙원 — 빛의 장소</h3><p>초기 그리스도인의 묘비명에서는 낙원을 빛과 광채의 장소라고 부릅니다. 몇 가지 예를 듭니다.</p><ul><li><p>CVIVS SPIRITVS IN LVCE DOMINI SVSCEPTVS EST – “<strong>그의 영혼은 주님의 빛 가운데로 받아들여졌다</strong>”.</p></li><li><p>IN CHRISTVM CREDENS PREMIA LVCIS АВЕТ – “<strong>그리스도를 믿어 그는 빛을 상으로 얻는다</strong>”.</p></li><li><p>AETERNA TIBI LUX TIMOTHEA IN ☧– “<strong>티모테아여, (그리스도) 안에서 당신에게 영원한 빛을</strong>”.</p></li></ul><h3></h3><p>책(러시아어): <strong>A. 폰 프리켄, 『로마의 카타콤과 초기 그리스도교 미술의 유물』, 모스크바: K. T. 솔다첸코프, 1872–1885.</strong> [2]</p>'
