  path: Ik1c_고대_이콘_모음
  title: 고대 이콘 모음
  title_sub: 그리스도, 하느님의 어머니, 사도들과 다른 성인들의 고대 그리스도교 이콘
  body: '<h2>기원전 15세기경</h2><h3>회막(성막)</h3><p>성소 한가운데의 휘장(성소와 지성소 사이)에는 그룹들이 그려져 있었고(<a href="https://bibleox.com/ko/ko-nkrv/ish/26/#L31">출 26:31</a>), 둘레의 휘장(벽)에도 있었지만(<a href="https://bibleox.com/ko/ko-nkrv/ish/26/#L1">출 26:1</a>; <a href="https://bibleox.com/ko/ko-nkrv/ish/36/#L8">출 36:8</a>), 이 그림의 작가는 그것을 그리지 않았습니다. 성막은 하늘의 실재의 형상(이콘)입니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/25/#L8-9,40">출 25:8-9,40</a>; <a href="https://bibleox.com/ko/ko-nkrv/evr/9/#L24">히 9:24</a>; <a href="https://bibleox.com/ko/ko-nkrv/act/7/#L44">행 7:44</a>). 하느님께서는 성소를 공경하라고 명하셨습니다(<a href="https://bibleox.com/ko/ko-nkrv/lev/19/#L30">레 19:30</a>; <a href="https://bibleox.com/ko/ko-nkrv/lev/26/#L2">레 26:2</a>).</p><img src="https://res.bibleox.com/s/img/image/simple/471/s_p_P2j4gLJt9iKSnkge.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/471/m_p_P2j4gLJt9iKSnkge.jpg">크게 보기</a>] [<a href="https://res.bibleox.com/s/img/image/simple/472/m_p_bNPh6hCNJDhzahar.jpg">외관</a>]</p><h3>언약궤</h3><p>궤에는 그룹 둘의 형상이 있었습니다(<a href="https://bibleox.com/ru/ru/w/%D0%BA%D0%BE%D0%B2%D1%87%D0%B5%D0%B3_%D0%B7%D0%B0%D0%B2%D0%B5%D1%82%D0%B0/">성경 구절</a>). 선지자 여호수아는 언약궤 앞에 엎드렸습니다(<a href="https://bibleox.com/ko/ko-nkrv/nav/7/#L6">수 7:6</a>).</p><img src="https://res.bibleox.com/s/img/image/simple/469/s_p_DUn5vqnI4F8yRiNA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/469/m_p_DUn5vqnI4F8yRiNA.jpg">크게 보기</a>]</p><h3>이스라엘의 진영</h3><p>이스라엘은 십자가 모양으로 이동했습니다(<a href="https://bibleox.com/ru/ru/w/%D0%B5%D0%B2%D1%80%D0%B5%D0%B9%D1%81%D0%BA%D0%B8%D0%B9-%D1%81%D1%82%D0%B0%D0%BD-%D0%BA%D1%80%D0%B5%D1%81%D1%82/">성경 구절</a>).</p><img src="https://res.bibleox.com/s/img/image/simple/470/s_p_t8tRbbwlzsBzyVzk.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/470/m_p_t8tRbbwlzsBzyVzk.jpg">크게 보기</a>]</p><h2>기원전 10세기경</h2><h3>솔로몬이 지은 예루살렘 성전</h3><p>그룹들을 새긴 형상이 성전의 벽(<a href="https://bibleox.com/ko/ko-nkrv/3ts/6/#L32">왕상 6:32</a>), 들어가는 문(<a href="https://bibleox.com/ko/ko-nkrv/3ts/6/#L32">왕상 6:32</a>; <a href="https://bibleox.com/ko/ko-nkrv/3ts/6/#L35">왕상 6:35</a>), 지성소 입구의 휘장(<a href="https://bibleox.com/ko/ko-nkrv/2par/3/#L14">대하 3:14</a>; <a href="https://bibleox.com/ko/gr-lxx-byz/1mak/1/#L22">1마카 1:22</a>)에 있었습니다. 지성소에는 금을 입힌 커다란 나무 그룹 두 형상이 서 있었습니다(<a href="https://bibleox.com/ko/ko-nkrv/3ts/6/#L23">왕상 6:23</a>). 언약궤 덮개에는 그룹 두 형상을 만들었습니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/25/#L18-20">출 25:18-20</a>). 성전 뜰에서는 물두멍의 커다란 받침 수레에 사자와 소와 그룹들을 새겼습니다(<a href="https://bibleox.com/ko/ko-nkrv/3ts/7/#L28-29">왕상 7:28-29</a>). (<a href="https://bibleox.com/ru/ru/w/%D0%B8%D0%B5%D1%80%D1%83%D1%81%D0%B0%D0%BB%D0%B8%D0%BC%D1%81%D0%BA%D0%B8%D0%B9-%D1%85%D1%80%D0%B0%D0%BC/">자세히</a>)</p><p>선지자 다윗은 성전을 향하여 엎드려(<a href="https://bibleox.com/ko/ko-nkrv/ps/5/#L7">시 5:7</a>; <a href="https://bibleox.com/ko/ko-nkrv/ps/99/#L5">시 99:5</a>; <a href="https://bibleox.com/ko/ko-nkrv/ps/132/#L7">시 132:7</a>) 이 형상을 통해 하느님께 공경을 드렸습니다.</p><img src="https://res.bibleox.com/s/img/image/simple/468/s_p_lv7GzNtM53C4Zqgr.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/468/m_p_lv7GzNtM53C4Zqgr.jpg">크게 보기</a>]</p><h2>2세기</h2><h3>아기 예수를 안은 하느님의 어머니, 별을 가리키는 선지자(로마)</h3><p>2세기~3세기 초. 프리스킬라 카타콤[6]. 하느님의 어머니를 그린 가장 오래된 형상입니다. 하느님의 어머니 곁의 사람은 왼손에 책을 들고 오른손 손가락으로 별을 가리키는 것으로 보입니다.</p><img src="https://res.bibleox.com/s/img/image/simple/6751b012dba7720001514f69/s_p_jNTGMwic6Cse9xDG.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6751b012dba7720001514f69/m_p_jNTGMwic6Cse9xDG.jpg">크게 보기</a>] [<a href="https://res.bibleox.com/s/img/image/simple/67618740dba7720001cd0e2c/m_p_ckKuGWqzHuN1tR5Q.jpg">다른 사진 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686cf0535f47da2505d3ae4d/m_p_dajA4xvStk0EnnSq.jpg">다른 사진 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686cf7725f47da2505d3ae50/m_p_n79yEKK4QSCeorx3.jpg">다른 사진 4</a>] [<a href="https://res.bibleox.com/s/img/image/simple/442/m_p_5zQEQbMmBkEs9J2S.jpg">다른 사진 5</a>]</p><p>하느님의 어머니 곁의 사람은 이런 예언을 한 선지자 이사야일 수 있습니다.</p><blockquote><p>“그러므로 주께서 친히 징조를 너희에게 주실 것이라 보라 <strong>처녀가 잉태하여 아들을 낳을 것이요</strong> 그의 이름을 임마누엘이라 하리라”(<a href="https://bibleox.com/ko/ko-nkrv/is/7/#L14">사 7:14</a>)</p></blockquote><p>또는 발람일 수도 있습니다.</p><blockquote><p>“내가 그를 보아도 이 때의 일이 아니며 내가 그를 바라보아도 가까운 일이 아니로다 <strong>한 별이 야곱에게서 나오며</strong> 한 규가 이스라엘에게서 일어나서 모압을 이쪽에서 저쪽까지 쳐서 무찌르고 또 셋의 자식들을 다 멸하리로다”(<a href="https://bibleox.com/ko/ko-nkrv/chis/24/#L17">민 24:17</a>)</p></blockquote><p>아니면 화가가 설명하는 글 대신 이런 기법을 썼을 뿐인지도 모릅니다. 화가는 우리에게 책을 들고 떠오르는 별에 관한 예언을 읽어, 그가 이 예언이 말하는 분의 탄생, 곧 처녀에게서 나신 구세주의 탄생을 그렸다는 것을 깨달으라고 권합니다.</p><h3>선한 목자로 그려진 그리스도</h3><p>2세기 말. 로마. 칼리스투스 카타콤(<a href="https://en.wikipedia.org/wiki/Catacomb_of_Callixtus#Paintings">Callixitus Catacomb, Crypt of Lucina</a>).</p><img src="https://res.bibleox.com/s/img/image/simple/473/s_p_mrIYHR2oqLQuPn0z.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/473/m_p_mrIYHR2oqLQuPn0z.jpg">크게 보기</a>]</p><h2>3세기</h2><h3>하느님의 어머니 “오란타(기도하는 분)”(로마)</h3><p>Catacomba Maggiore, 로마[26][27]. 앞쪽에 동정녀 마리아와 아기 그리스도가 그려져 있습니다.</p><img src="https://res.bibleox.com/s/img/image/simple/6751fe6ddba7720001514f7e/s_p_C1Iw2V4OhNy1SGOE.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6751fe6ddba7720001514f7e/m_p_C1Iw2V4OhNy1SGOE.jpg">크게 보기</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686cefb35f47da2505d3ae4c/m_p_70zYu2r0np0WFNUu.jpg">다른 사진 2</a>]</p><h3>그리스도, 사도들, 순교자 고르고니우스, 베드로, 마르켈리누스, 티부르티우스(로마)</h3><p>마르켈리누스와 베드로 카타콤</p><img src="https://res.bibleox.com/s/img/image/simple/6752012adba7720001514f82/s_p_x5I0ahjwMz1X5LoJ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6752012adba7720001514f82/m_p_x5I0ahjwMz1X5LoJ.jpg">크게 보기</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686d237a5f47da2505d3ae56/m_p_ST9me27UGtWHYDBc.jpg">다른 사진 2</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/676082a6dba7720001cd0e22/s_p_YjPD3PzLDCF4wgh1.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/676082a6dba7720001cd0e22/m_p_YjPD3PzLDCF4wgh1.jpg">크게 보기</a>]</p><h3>선한 목자에게 기도하는 여인(로마)</h3><p>3세기. 프리스킬라 카타콤[6].</p><p>그림들은 하나의 구도를 이룹니다. 화가는 둘레에 그려진 기도하는 사람들이 방의 꼭대기를 바라보며 손을 들도록 그림을 배치했습니다. 그곳에는 <strong>선한 목자</strong>로 그려진 그리스도가 있습니다(<a href="https://bibleox.com/ko/ko-nkrv/in/10/#L11">요 10:11</a>). 선한 목자를 둘러싼 모든 장면을 하나의 주제가 묶습니다. 바로 <strong>죽음에서의 구원</strong>입니다.</p><img src="https://res.bibleox.com/s/img/image/simple/686bea5b5f47da2505d3ae31/s_p_pjRHeoFaUpKPoyEH.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686bea5b5f47da2505d3ae31/m_p_pjRHeoFaUpKPoyEH.jpg">크게 보기</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686cf7375f47da2505d3ae4f/m_p_MOsOWI2vEXUj5ELf.jpg">다른 사진 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6904b3f2205184ec278d6e53/m_p_0GRveVCOh2GBz7eq.jpg">다른 사진 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/431/m_p_LUZsrJtesEWiwHBO.jpg">다른 사진 4</a>]</p><p>선한 목자는 그리스도이십니다(<a href="https://bibleox.com/ko/ko-nkrv/lk/15/#L6-7">눅 15:6-7</a>; <a href="https://bibleox.com/ko/ko-nkrv/in/10/#L1-21">요 10:1-21</a>; <a href="https://bibleox.com/ko/ko-nkrv/ps/23/">시 23</a>).</p><img src="https://res.bibleox.com/s/img/image/simple/69319f74205184ec278d6fa7/s_p_GR8gHxKZuC87xqlf.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69319f74205184ec278d6fa7/m_p_GR8gHxKZuC87xqlf.jpg">크게 보기</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686d2ac55f47da2505d3ae59/m_p_JDvtNt9RJrqnAsEW.jpg">다른 사진 2</a>]</p><p>머리를 가린 여인이 두 손을 들고 기도합니다(아마 사라: <a href="https://bibleox.com/ko/ko-nkrv/gen/18/#L1-15">창 18:1-15</a>, <a href="https://bibleox.com/ko/ko-nkrv/gen/21/#L1-7">창 21:1-7</a>).</p><img src="https://res.bibleox.com/s/img/image/simple/686bea885f47da2505d3ae32/s_p_79wnuevuFIi3tnrH.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686bea885f47da2505d3ae32/m_p_79wnuevuFIi3tnrH.jpg">크게 보기</a>]</p><p>오른쪽에는 구약의 장면: 세 젊은이(<a href="https://en.wikipedia.org/wiki/Catacomb_of_Priscilla#/media/File:Shadrach,_Meshach,_and_Abednego_in_the_fiery_furnace,_from_the_book_Die_Malereien_der_Katakomben_Roms,_plate_78,_levels_adjusted.jpg">사드락, 메삭, 아벳느고</a>)가 두 손을 들고 기도합니다(<a href="https://bibleox.com/ko/ko-nkrv/dan/3/">단 3</a>).</p><img src="https://res.bibleox.com/s/img/image/simple/686cfc565f47da2505d3ae52/s_p_NmZJuoF70d9qohZs.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686cfc565f47da2505d3ae52/m_p_NmZJuoF70d9qohZs.jpg">크게 보기</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686cfc475f47da2505d3ae51/m_p_qzHB83d52LoU7QQL.jpg">다른 사진 2</a>]</p><p>왼쪽에는 구약의 장면: 번제 나무를 든 아브라함과 이삭(<a href="https://bibleox.com/ko/ko-nkrv/gen/22/#L1-19">창 22:1-19</a>).</p><img src="https://res.bibleox.com/s/img/image/simple/686d33c45f47da2505d3ae5a/s_p_QQLn5T52hx8gSrBf.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d33c45f47da2505d3ae5a/m_p_QQLn5T52hx8gSrBf.jpg">크게 보기</a>]</p><p>입구 위에는 바다 생물에게 삼켜지는 선지자 요나가 그려져 있습니다(<a href="https://bibleox.com/ko/ko-nkrv/ion/1/#L17">욘 1:17</a>).</p><img src="https://res.bibleox.com/s/img/image/simple/476/s_p_aHV4YSuoWhVZ1H5y.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/476/m_p_aHV4YSuoWhVZ1H5y.jpg">크게 보기</a>]</p><p>방 앞면에 그려진 기도하는 여인의 생애 장면은 더 자세히 설명할 만합니다.</p><img src="https://res.bibleox.com/s/img/image/simple/686d36265f47da2505d3ae5d/s_p_MGpxKQ94pikRfgFK.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d36265f47da2505d3ae5d/m_p_MGpxKQ94pikRfgFK.jpg">크게 보기</a>]</p><p><strong>앞면 장면의 사건들</strong></p><p>방의 구도에서 각 구역은 장면 하나를 그립니다. 모든 장면이 그리스도교 주제의 중요한 요소입니다. 위에는 선한 목자, 왼쪽에는 아브라함, 오른쪽에는 세 젊은이, 통로에는 선지자 요나의 장면이 있습니다. 그러므로 화가가 해석하기 어려운 방의 앞면에서도 이 규칙(한 구역에 중요한 장면 하나)을 지켰다고 추측할 수 있습니다. 아래는 하나의 추측일 뿐입니다. 가운데를 빼고 모든 면에 구약의 장면이 그려져 있으므로, 앞면에는 하갈 이야기(<a href="https://bibleox.com/ko/ko-nkrv/gen/16/">창 16</a>, <a href="https://bibleox.com/ko/ko-nkrv/gen/21/">창 21</a>)가 그려져 있다고 볼 수 있습니다. 그렇다면 먼저 아브라함과 아들 이스마엘과 함께 쫓겨나는 하갈(1), 다음에 사라의 기도(2), 그리고 아이에게 젖을 먹이는 하갈(3)이 그려져 있는 셈입니다.</p><p>이 해석을 더 자세히 살펴봅시다.</p><p><strong>1. 하갈이 쫓겨남</strong>. 앉아 있는 사람은 아브라함이라고 거의 확실히 말할 수 있습니다(맞은편 아브라함 프레스코와 머리와 수염이 같습니다). 노란 옷을 입은 사람은 아마 하갈입니다(노란색은 종의 신분을 나타냈을 수 있습니다). 손에 물 가죽 부대를 든 것 같습니다(<a href="https://bibleox.com/ko/ko-nkrv/gen/21/#L14">창 21:14</a>). 그 뒤에는 아마 아들 이스마엘이 있는데, 쫓겨날 때 15살이 넘었을 것입니다(<em>이스마엘은 아브라함이 86세 때 태어났고 </em><a href="https://bibleox.com/ko/ko-nkrv/gen/16/#L16">창 16:16</a><em>, 이삭은 아브라함이 100세 때 태어났으며 </em><a href="https://bibleox.com/ko/ko-nkrv/gen/21/#L5">창 21:5</a><em>, 하갈은 이삭이 자라 젖을 뗄 때 쫓겨납니다 </em><a href="https://bibleox.com/ko/ko-nkrv/gen/21/#L8-13">창 21:8-13</a>). 앞치마를 두른 여인처럼 보이기도 하지만, 그렇다면 그것은 하갈 자신일 수밖에 없고(미혼 여성은 머리를 가리지 않습니다), 이 경우 물 가죽 부대를 든 사람은 이스마엘입니다. 어느 쪽이든 남은 두 사람은 하갈과 이스마엘이라는 해석이 가장 유력합니다. 이 구도가 따로 떨어진 구역이 아니라 하나의 그림일 수도 있습니다. 아이를 안은 여인이 손을 든 여인을 바라보고 있기 때문입니다.</p><img src="https://res.bibleox.com/s/img/image/simple/686d33c95f47da2505d3ae5b/s_p_kuEcuyUnGenBuWPw.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d33c95f47da2505d3ae5b/m_p_kuEcuyUnGenBuWPw.jpg">크게 보기</a>]</p><p><strong>2. 사라의 기도</strong>. 붉은 옷을 입고 머리를 가린 사라가 하느님께 기도합니다. 붉은 옷은 높은 신분을, 가린 머리는 결혼했음을 보여 줍니다.</p><img src="https://res.bibleox.com/s/img/image/simple/686d3a855f47da2505d3ae5e/s_p_rpl3jnuNnx8ZisdR.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d3a855f47da2505d3ae5e/m_p_rpl3jnuNnx8ZisdR.jpg">크게 보기</a>]</p><p><strong>3. 아이에게 젖을 먹이는 하갈</strong>. 하갈이라는 해석을 뒷받침하는 것은 머리를 가리지 않았다는 것(곧 미혼이라는 것)과, 머리 모양이 첫 장면의 노란 옷을 입은 사람과 같다는 점입니다. 특징적인 시선도 그녀를 드러냅니다. 그녀는 사이가 좋지 않았던 사라를 바라보고 있습니다. 흥미롭게도 화가는 그녀를 왼쪽에 앉은 아브라함과 똑같이 그렸습니다. 의자에 앉아 있고 옷도 똑같습니다(세로 줄무늬, 소매의 두 줄, 겉옷).</p><img src="https://res.bibleox.com/s/img/image/simple/686d22a05f47da2505d3ae54/s_p_8fxd9vcRlXYszSJU.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d22a05f47da2505d3ae54/m_p_8fxd9vcRlXYszSJU.jpg">크게 보기</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686d33cd5f47da2505d3ae5c/m_p_qKPp740xLZNuDEFs.jpg">다른 사진 2</a>]</p><p><strong>방 전체의 생각: 죽음에서의 구원</strong></p><p>이 쿠비쿨룸(무덤 방)의 구도에는 하나의 아름다운 생각이 있습니다. 바로 죽음에서의 구원입니다. 전체 이야기는 아래에서 위로 단계적으로 올라갑니다.</p><ul><li><p>가장 아래 단계: 죽음을 이기신 그리스도를 믿으며 묻힌 그리스도인들.</p></li><li><p>가운데 단계: 죽음에서의 구원에 관한 성경 이야기.</p><ul><li><p>바빌론 풀무 속의 세 젊은이가 불에 의한 죽음에서 구원받음,</p></li><li><p>선지자 요나가 바다 생물의 배 속에서 죽음에서 구원받음,</p></li><li><p>이삭이 제물이 되는 것에서 구원받고 그 대신 숫양이 바쳐짐,</p></li><li><p>하갈과 아들 이스마엘이 광야에서 죽음에서 구원받음.</p></li></ul></li><li><p>그 위 단계: 그리스도교 상징인 공작(부활, 불멸, 영원한 생명)과 자고새(영혼). 한 자고새는 살아 있는 식물 곁에(생명의 상징), 다른 자고새는 시든 식물 곁에(죽음의 상징) 서 있습니다. 공작들도 그렇게 서 있습니다.</p></li><li><p>천장 한가운데: 믿는 이들을 죽음에서 구원하는 선한 목자. 주목할 점은 여기에 죽음에서의 구원을 가리키는 작은 장치가 하나 더 있다는 것입니다. 목자의 왼쪽과 오른쪽에 노아가 방주에서 내보낸 까마귀와 감람나무 가지를 문 비둘기가 앉아 있습니다. 이렇게 방주에서 죽음을 피해 구원받은 이들이 이 새들을 통해 죽음에서 구원하시는 분, 그리스도께로 인도됩니다.</p></li></ul><h3>두라 에우로포스의 성당(시리아)</h3><p>244년. 두라 에우로포스의 성당에는 구약의 사건 외에 신약의 장면을 그린 프레스코도 있었습니다. 물에 빠져 가던 사도 베드로가 구원받는 장면과 양문 곁 못에서 병자가 고침을 받는 장면입니다. <a href="https://vk.com/@aletheia-de-sacris-imaginibus-venerandis?anchor=v-drugie-svyaschennye-izobrazhenia-v-donikeyskiy-period">글</a>도 보십시오.</p><p><strong>선한 목자로 그려진 그리스도(세례실의 주된 모습)</strong></p><img src="https://res.bibleox.com/s/img/image/simple/6931870c205184ec278d6fa2/s_p_uBkNi8jGsMFpOQSM.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931870c205184ec278d6fa2/m_p_uBkNi8jGsMFpOQSM.jpg">크게 보기</a>]</p><p><strong>물에 빠져 가던 사도 베드로가 구원받음</strong></p><img src="https://res.bibleox.com/s/img/image/simple/692c8038205184ec278d6f9e/s_p_QQ2Rml8gUWsyQtS9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c8038205184ec278d6f9e/m_p_QQ2Rml8gUWsyQtS9.jpg">크게 보기</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6786b88ddba77200015ae11c/m_p_do380IVDukCAfdFk.jpg">다른 사진 2</a>]</p><p><strong>양문 곁 못에서 병자가 고침을 받음</strong></p><img src="https://res.bibleox.com/s/img/image/simple/6786b889dba77200015ae11b/s_p_k1a5GDBvfzTCWmZv.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6786b889dba77200015ae11b/m_p_k1a5GDBvfzTCWmZv.jpg">크게 보기</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6786bb0bdba77200015ae11d/m_p_dCRD85foL69l7kih.jpg">다른 사진</a>]</p><h3>선한 목자로 그려진 그리스도, 선지자 요나</h3><p>3세기 말~4세기 초. 로마. 마르켈리누스와 베드로 카타콤.</p><p>가운데에는 선한 목자로 그려진 그리스도가 있습니다. 가운데 양쪽에는 요나가 그려져 있습니다. 왼쪽 프레스코에서는 요나가 배에서 던져지고, 오른쪽에서는 큰 물고기가 그를 삼킵니다.</p><img src="https://res.bibleox.com/s/img/image/simple/478/s_p_yvJcnbLGPxZ6AzRu.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/478/m_p_yvJcnbLGPxZ6AzRu.jpg">크게 보기</a>]</p><p>선지자 요나</p><img src="https://res.bibleox.com/s/img/image/simple/481/s_p_7z5j4tAimokFaRMN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/481/m_p_7z5j4tAimokFaRMN.jpg">크게 보기</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/480/s_p_b8gqyOenKZcn2MCp.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/480/m_p_b8gqyOenKZcn2MCp.jpg">크게 보기</a>]</p><h3>선한 목자로 그려진 그리스도</h3><p>3세기. 로마. 칼리스투스 카타콤(<a href="https://en.wikipedia.org/wiki/Catacomb_of_Callixtus#Paintings">Callixitus Catacomb, Crypt of Lucina</a>). 통에는 성찬의 상징인 젖이 들어 있다고 볼 수 있습니다(알렉산드리아의 클레멘스 참조).</p><img src="https://res.bibleox.com/s/img/image/simple/474/s_p_zcLmMd2qkyG3pDoj.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/474/m_p_zcLmMd2qkyG3pDoj.jpg">크게 보기</a>]</p><h3>선한 목자, 히사르테페 네크로폴리스, 니케아(이즈니크)</h3><p>3세기경. 최근의 발견이어서 연대는 추정입니다(<a href="https://www.arkeolojikhaber.com/haber-iznikte-benzersiz-bir-kesif-anadolunun-tek-coban-isa-figuru-gun-yuzune-cikarildi-43079/">자세히</a>). 이 네크로폴리스는 2세기부터 5세기까지 쓰였습니다.</p><p>좌표: 40.78204218462122, 29.928491677648932. 튀르키예어 지명: Hasartep Nekropolü.</p><img src="https://res.bibleox.com/s/img/image/simple/69444e49205184ec278d6fdb/s_p_SZTpvcDdpodujcbM.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69444e49205184ec278d6fdb/m_p_SZTpvcDdpodujcbM.jpg">크게 보기</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6941a813205184ec278d6fda/s_p_CUoa7dSy5UxGf1UD.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6941a813205184ec278d6fda/m_p_CUoa7dSy5UxGf1UD.jpg">크게 보기</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6941a80f205184ec278d6fd9/m_p_xSCaRt10DUUReyMt.jpg">다른 사진 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/693c7d1a205184ec278d6fcb/m_p_mR5ZaVgXbezmXDyo.jpg">다른 사진 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/693d606b205184ec278d6fd3/m_p_TKCjvhxmnq0q50tW.jpg">다른 사진 4</a>] [<a href="https://res.bibleox.com/s/img/image/simple/693d6101205184ec278d6fd7/m_p_1i6aL6lfDR08iA13.jpg">다른 사진 5</a>] [<a href="https://res.bibleox.com/s/img/image/simple/693d60f8205184ec278d6fd6/m_p_b2uUaO6tzciaKAgC.jpg">다른 사진 6</a>] [<a href="https://res.bibleox.com/s/img/image/simple/693d60f1205184ec278d6fd5/m_p_bErh7lbI0e08hPaa.jpg">다른 사진 7</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/693c7db2205184ec278d6fd2/s_p_wCZsWPWG7jCNLjIr.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/693c7db2205184ec278d6fd2/m_p_wCZsWPWG7jCNLjIr.jpg">크게 보기</a>] [<a href="https://res.bibleox.com/s/img/image/simple/693d60ad205184ec278d6fd4/m_p_BCvsIiJX10j2Mf2k.jpg">남자와 여자</a>] [<a href="https://res.bibleox.com/s/img/image/simple/693c7daa205184ec278d6fd1/m_p_cjk36Xjpev9EFq2h.jpg">여자</a>]</p><h3>결혼반지(비잔티움)</h3><p>3~4세기. <a href="https://www.metmuseum.org/art/collection/search/663485">메트로폴리탄 미술관(5번가, 미국)</a>. (그리스어 χάρις — 은총)</p><img src="https://res.bibleox.com/s/img/image/simple/68b5da8b45c75323d28a5e99/s_p_GNh1S8L7fcowsMEE.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5da8b45c75323d28a5e99/m_p_GNh1S8L7fcowsMEE.jpg">크게 보기</a>]</p><h3>성찬 예배의 집전</h3><p>3세기. 로마. 칼리스투스 카타콤(<a href="https://en.wikipedia.org/wiki/Catacomb_of_Callixtus#Paintings">Callixitus Catacomb, Crypt of Lucina</a>). 아마 보제와 함께 집전하는 사제가 그려져 있을 것입니다. 오늘날 정교회 성당에서도 성찬 예배는 이렇게 드려집니다. 사제는 두 손을 위로 들고, 보제는 거룩한 성찬 예물을 가리킵니다.</p><img src="https://res.bibleox.com/s/img/image/simple/479/s_p_Zbn405P2krjwNAYl.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/479/m_p_Zbn405P2krjwNAYl.jpg">크게 보기</a>]</p><h2>4세기</h2><h3>그리스도(로마)</h3><p>콤모딜라 카타콤.</p><img src="https://res.bibleox.com/s/img/image/simple/66cc2bd6dba77200019bc7d2/s_p_7xYGBb9wCmxBIGrZ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/66cc2bd6dba77200019bc7d2/m_p_7xYGBb9wCmxBIGrZ.jpg">크게 보기</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686d23425f47da2505d3ae55/s_p_LzqgbhnIsbqtghoc.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d23425f47da2505d3ae55/m_p_LzqgbhnIsbqtghoc.jpg">크게 보기</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a1e1205184ec278d6fa8/m_p_KC0MljXJf5po70pj.jpg">다른 사진 2</a>]</p><h3>그리스도와 사도들(로마)</h3><p>350년경. [8][9] 산타 코스탄차 영묘.</p><img src="https://res.bibleox.com/s/img/image/simple/686990665f47da2505d3ae19/s_p_5RDr4ou4ExBAh4KE.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686990665f47da2505d3ae19/m_p_5RDr4ou4ExBAh4KE.jpg">크게 보기</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686990425f47da2505d3ae17/s_p_CXn5KmuiWradhOvh.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686990425f47da2505d3ae17/m_p_CXn5KmuiWradhOvh.jpg">크게 보기</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686990545f47da2505d3ae18/s_p_IkgteAcecXoMC106.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686990545f47da2505d3ae18/m_p_IkgteAcecXoMC106.jpg">크게 보기</a>]</p><h3>산 조반니 인 폰테 세례당(나폴리)</h3><p>350~400년. [11][12]</p><img src="https://res.bibleox.com/s/img/image/simple/6869924c5f47da2505d3ae1a/s_p_t1iU8sClY3pnOnkK.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6869924c5f47da2505d3ae1a/m_p_t1iU8sClY3pnOnkK.jpg">크게 보기</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686992505f47da2505d3ae1b/s_p_BrRKZmtReJbgXm0w.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686992505f47da2505d3ae1b/m_p_BrRKZmtReJbgXm0w.jpg">크게 보기</a>]</p><h3>그리스도와 천사들, 재림(테살로니키, 비잔티움)</h3><p>4세기 말. [17][18] 승리자 성 게오르기오스의 로툰다(원래 갈레리우스 황제의 무덤).</p><img src="https://res.bibleox.com/s/img/image/simple/6931a254205184ec278d6fa9/s_p_bWn7Chqiox5UOEd4.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931a254205184ec278d6fa9/m_p_bWn7Chqiox5UOEd4.jpg">크게 보기</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a2ba205184ec278d6faa/m_p_ROPWmBVyUxWMGo9Z.jpg">다른 사진 2</a>]</p><p>모자이크는 보존 상태가 좋지 않습니다. 그리스도의 형상은 후광 일부와 손과 십자가만 남았습니다. 둘레 천사들의 얼굴은 잘 보입니다.</p><img src="https://res.bibleox.com/s/img/image/simple/686a91695f47da2505d3ae1f/s_p_EoOSmhaBPsy32XQQ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686a91695f47da2505d3ae1f/m_p_EoOSmhaBPsy32XQQ.jpg">크게 보기</a>]</p><h3>거룩한 주교들, 군인들, 의사들(테살로니키, 비잔티움)</h3><p>4세기 말. [17][18] 승리자 성 게오르기오스의 로툰다(원래 갈레리우스 황제의 무덤).</p><p>모자이크 가운데에는 로마노스, 키릴로스, 레온, 오네시포로스, 에우카르피오스, 바실리스코스, 포르피리오스, 필레몬, 프리스코스, 테리노스, 코스마스, 다미아노스라는 이름의 거룩한 주교, 군인, 의사, 악사들의 형상이 있습니다.</p><img src="https://res.bibleox.com/s/img/image/simple/686aa0275f47da2505d3ae21/s_p_oIksDo9rIgSoAXvG.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa0275f47da2505d3ae21/m_p_oIksDo9rIgSoAXvG.jpg">크게 보기</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686aa02e5f47da2505d3ae22/s_p_nTZtC6C93KI8Fu6I.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa02e5f47da2505d3ae22/m_p_nTZtC6C93KI8Fu6I.jpg">크게 보기</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686aa0335f47da2505d3ae23/s_p_b1KhWllqTzipVhO9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa0335f47da2505d3ae23/m_p_b1KhWllqTzipVhO9.jpg">크게 보기</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686aa0385f47da2505d3ae24/s_p_vvlbG9E89B9T0U8j.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa0385f47da2505d3ae24/m_p_vvlbG9E89B9T0U8j.jpg">크게 보기</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686aa03f5f47da2505d3ae25/s_p_d3lcRobegfAQOf6e.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa03f5f47da2505d3ae25/m_p_d3lcRobegfAQOf6e.jpg">크게 보기</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686aa0555f47da2505d3ae27/s_p_h1YgFpMukwaYc23Q.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa0555f47da2505d3ae27/m_p_h1YgFpMukwaYc23Q.jpg">크게 보기</a>]</p><p>성 코스마스와 성 다미아노스</p><img src="https://res.bibleox.com/s/img/image/simple/686aa04e5f47da2505d3ae26/s_p_LwMjPHLsabDDxEHy.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa04e5f47da2505d3ae26/m_p_LwMjPHLsabDDxEHy.jpg">크게 보기</a>]</p><h3>강도들 사이에서 십자가에 못 박히신 그리스도의 형상(로마)</h3><p>4세기 초[보통은 430년경으로 봅니다]. 산타 사비나 성당, 문짝 판의 하나. 십자가 처형의 부조.</p><img src="https://res.bibleox.com/s/img/image/simple/676183a8dba7720001cd0e2b/s_p_ccaA7HzLPDInwe1b.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/676183a8dba7720001cd0e2b/m_p_ccaA7HzLPDInwe1b.jpg">크게 보기</a>]</p><h3>주님의 예루살렘 입성(비잔티움)</h3><p>4세기 초. <a href="https://www.metmuseum.org/art/collection/search/466220">메트로폴리탄 미술관(5번가, 미국)</a>. 67.3 × 212.1 × 61.9 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5e69845c75323d28a5e9d/s_p_Kk1dIB2OLr1OjQ1O.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5e69845c75323d28a5e9d/m_p_Kk1dIB2OLr1OjQ1O.jpg">크게 보기</a>]</p><h3>그리스도, 석판(케르소네소스)</h3><p>300~500년. <a href="https://collections.louvre.fr/en/ark:/53355/cl010276835">루브르 박물관(프랑스)</a>. 박물관에 따르면 나머지 부분은 에르미타주에 있습니다. 사도 베드로에게 한 말씀이 새겨져 있습니다.</p><img src="https://res.bibleox.com/s/img/image/simple/68c41cec6594f46d35a87f04/s_p_esWl4etLsBMVz9bw.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c41cec6594f46d35a87f04/m_p_esWl4etLsBMVz9bw.jpg">크게 보기</a>]</p><h3>선생이신 그리스도(로마)</h3><p>도미틸라 카타콤. 쿠비쿨룸의 루네트(반원형 벽면) 벽화.</p><img src="https://res.bibleox.com/s/img/image/simple/674ed2a4dba77200011c738a/s_p_4M8Vki7GNJBHkJPN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674ed2a4dba77200011c738a/m_p_4M8Vki7GNJBHkJPN.jpg">크게 보기</a>]</p><h3>주 예수 그리스도(로마)</h3><p>3~5세기. 게네로사 카타콤 [7]</p><img src="https://res.bibleox.com/s/img/image/simple/674f2408dba77200011c739c/s_p_zVliPTIYBpqqnTGQ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f2408dba77200011c739c/m_p_zVliPTIYBpqqnTGQ.jpg">크게 보기</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6931a55a205184ec278d6faf/s_p_xXRXPudiFDi6GltL.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931a55a205184ec278d6faf/m_p_xXRXPudiFDi6GltL.jpg">크게 보기</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686bf5b25f47da2505d3ae36/m_p_Io7kaT9uNdBPFcSj.jpg">다른 사진 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a5b6205184ec278d6fb0/m_p_btFyqkRBFzGf0FSH.jpg">다른 사진 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a5e4205184ec278d6fb1/m_p_wuVaj4ghYuk6s5cc.jpg">다른 사진 4</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a5fe205184ec278d6fb2/m_p_mO6KaZXywWX76vBg.jpg">다른 사진 5</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a656205184ec278d6fb3/m_p_eqLfG1BFyG45i90X.jpg">다른 사진 6</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a858205184ec278d6fb5/m_p_EVVCP1plDQZ4XgAS.jpg">다른 사진 7</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6931a360205184ec278d6fab/s_p_hObpAcapDVZvLsC1.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931a360205184ec278d6fab/m_p_hObpAcapDVZvLsC1.jpg">크게 보기</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6931a369205184ec278d6fad/s_p_8bP3aXtUgkNcP9gz.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931a369205184ec278d6fad/m_p_8bP3aXtUgkNcP9gz.jpg">크게 보기</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6931a363205184ec278d6fac/s_p_BcSN3IXA4JYFLpgA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931a363205184ec278d6fac/m_p_BcSN3IXA4JYFLpgA.jpg">크게 보기</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6931a36f205184ec278d6fae/s_p_6J6vSMM0TM5tc59T.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931a36f205184ec278d6fae/m_p_6J6vSMM0TM5tc59T.jpg">크게 보기</a>]</p><h3>성 비아트릭스와 성 심플리키우스(또는 루푸스)(로마)</h3><p>3~5세기. 게네로사 카타콤 [7]</p><img src="https://res.bibleox.com/s/img/image/simple/66cc2c40dba77200019bc7d8/s_p_zABjPHGhPdjGVh3U.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/66cc2c40dba77200019bc7d8/m_p_zABjPHGhPdjGVh3U.jpg">크게 보기</a>]</p><h3>사도 베드로와 바울(로마)</h3><p>380년경. 산타 테클라(성 테클라) 카타콤, 프레스코 [24]</p><p>그려진 사도들: 베드로, 바울, 안드레, 요한.</p><img src="https://res.bibleox.com/s/img/image/simple/686bf38e5f47da2505d3ae35/s_p_BxfiObhkLMfci8nP.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686bf38e5f47da2505d3ae35/m_p_BxfiObhkLMfci8nP.jpg">크게 보기</a>] [<a href="https://res.bibleox.com/s/img/image/simple/687291145f47da2505d3ae8b/m_p_WXlkaMJTOrIzlOdI.jpg">다른 사진 2</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/68b6cd4802e89ba22dfc3977/s_p_kAWGH2VPHMkRv9cL.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b6cd4802e89ba22dfc3977/m_p_kAWGH2VPHMkRv9cL.jpg">크게 보기</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686bf5bf5f47da2505d3ae37/m_p_F0tsoqA9bv6CrpfE.jpg">다른 사진 2</a>]</p><h3>사도 베드로와 바울(비잔티움)</h3><p>4세기 중엽. 그리스도께서 사도 베드로와 바울에게 순교자의 관을 주십니다. <a href="https://www.metmuseum.org/art/collection/search/463547">메트로폴리탄 미술관(5번가, 미국)</a>. 로마 또는 비잔티움. 13.8 × 12.5 × 5 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5f5d745c75323d28a5ebc/s_p_MiCffui3hayo2BCt.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5f5d745c75323d28a5ebc/m_p_MiCffui3hayo2BCt.jpg">크게 보기</a>]</p><hr><p>4세기 중엽. <a href="https://www.metmuseum.org/art/collection/search/468386">메트로폴리탄 미술관(5번가, 미국)</a>. 로마 또는 비잔티움. 8.5 × 14 × 13.3 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5e89c45c75323d28a5ea1/s_p_HAfNPGdEHMp67CuN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5e89c45c75323d28a5ea1/m_p_HAfNPGdEHMp67CuN.jpg">크게 보기</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5e88f45c75323d28a5ea0/m_p_gvro4Ry9POJUm0nR.jpg">옆에서 본 모습</a>]</p><hr><p>4세기 말. <a href="https://www.metmuseum.org/art/collection/search/463714">메트로폴리탄 미술관(5번가, 미국)</a>. 유리, 금박.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5e68b45c75323d28a5e9c/s_p_uRLyImBPPDsr48G2.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5e68b45c75323d28a5e9c/m_p_uRLyImBPPDsr48G2.jpg">크게 보기</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5e76d45c75323d28a5e9e/m_p_62cHpid14wgeSyqc.jpg">다른 사진 2</a>]</p><hr><p>4세기 중엽. 사도 베드로와 바울, 페레그리나. <a href="https://www.metmuseum.org/art/collection/search/465922">메트로폴리탄 미술관(5번가, 미국)</a>. 11.5 × 13.3 × 1.2 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5e7d145c75323d28a5e9f/s_p_atDwcEc3h2ZyYLRb.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5e7d145c75323d28a5e9f/m_p_atDwcEc3h2ZyYLRb.jpg">크게 보기</a>]</p><h3>사도 베드로와 바울(로마)</h3><p>4세기. 카타콤에서 아이의 무덤 벽감(로쿨루스)을 막는 데 쓴 석판. 로마, 바티칸 박물관, 피오 그리스도교 박물관.</p><img src="https://res.bibleox.com/s/img/image/simple/674f1bc0dba77200011c739a/s_p_uH3btIsNTUn6lHGQ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f1bc0dba77200011c739a/m_p_uH3btIsNTUn6lHGQ.jpg">크게 보기</a>]</p><h3>아기 그리스도를 안은 하느님의 어머니(로마)</h3><p>3~4세기. 도미틸라 카타콤.</p><img src="https://res.bibleox.com/s/img/image/simple/66cc2c11dba77200019bc7d5/s_p_rZQc8oqW4YIrUMho.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/66cc2c11dba77200019bc7d5/m_p_rZQc8oqW4YIrUMho.jpg">크게 보기</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686d246b5f47da2505d3ae57/m_p_AZTFv8hTAm4Eo9yp.jpg">다른 사진 2</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686d24885f47da2505d3ae58/s_p_Z1QqJZuraUn8iLSV.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d24885f47da2505d3ae58/m_p_Z1QqJZuraUn8iLSV.jpg">크게 보기</a>]</p><h3>그리스도의 형상이 있는 십자가(비잔티움)</h3><p>395~641년. <a href="https://collections.louvre.fr/en/ark:/53355/cl010043937">루브르 박물관(프랑스)</a>. 8.5 × 20 × 1.2 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c5886594f46d35a87ec7/s_p_wU3HuTavyFqHCHIc.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c5886594f46d35a87ec7/m_p_wU3HuTavyFqHCHIc.jpg">크게 보기</a>]</p><h3>이콘(이집트)</h3><p>395~641년. <a href="https://collections.louvre.fr/en/ark:/53355/cl010049211">루브르 박물관(프랑스)</a>. 24 × 17.5 cm</p><img src="https://res.bibleox.com/s/img/image/simple/68c3bf006594f46d35a87ebf/s_p_m1O6PHgeoR9L2huf.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3bf006594f46d35a87ebf/m_p_m1O6PHgeoR9L2huf.jpg">크게 보기</a>]</p><hr><p><a href="https://collections.louvre.fr/en/ark:/53355/cl010049209">루브르 박물관(프랑스)</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c8966594f46d35a87ec8/s_p_hfH86ZqQDaRWHKRA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c8966594f46d35a87ec8/m_p_hfH86ZqQDaRWHKRA.jpg">크게 보기</a>]</p><h3>성 메나스의 이콘이 있는 암풀라(비잔티움)</h3><p>395~641년. <a href="https://collections.louvre.fr/en/ark:/53355/cl010042774">루브르 박물관(프랑스)</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c4176594f46d35a87ec3/s_p_RYRsljTrixb3giuP.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c4176594f46d35a87ec3/m_p_RYRsljTrixb3giuP.jpg">크게 보기</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c3c4196594f46d35a87ec4/m_p_20KqaRLqoxUISfqB.jpg">뒷면</a>]</p><hr><p>395~641년. <a href="https://collections.louvre.fr/en/ark:/53355/cl010042778">루브르 박물관(프랑스)</a>. 이런 암풀라는 여러 박물관에 아주 많이 있습니다. 다른 예: <a href="https://collections.louvre.fr/en/ark:/53355/cl010042780">1</a>, <a href="https://collections.louvre.fr/en/ark:/53355/cl010042798">2</a>, <a href="https://collections.louvre.fr/en/ark:/53355/cl010042802">3</a>, <a href="https://collections.louvre.fr/en/ark:/53355/cl010043779">4</a>, <a href="https://collections.louvre.fr/en/ark:/53355/cl010076645">5</a>, <a href="https://collections.louvre.fr/en/ark:/53355/cl010051239">6</a>, <a href="https://collections.louvre.fr/en/ark:/53355/cl010263188">7</a>, <a href="https://collections.louvre.fr/en/ark:/53355/cl010280896">8</a>, <a href="https://collections.louvre.fr/en/ark:/53355/cl010044285">9</a>, <a href="https://collections.louvre.fr/en/ark:/53355/cl010280846">10</a>, <a href="https://collections.louvre.fr/en/ark:/53355/cl010280894">11</a>, <a href="https://www.clevelandart.org/art/1999.232">12</a>, <a href="https://www.clevelandart.org/art/1999.233">13</a>, <a href="https://www.clevelandart.org/art/1999.231">14</a>, <a href="https://www.clevelandart.org/art/1999.230">15</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c4c66594f46d35a87ec5/s_p_b5etRE60QJjNF7zQ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c4c66594f46d35a87ec5/m_p_b5etRE60QJjNF7zQ.jpg">크게 보기</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c4cd6594f46d35a87ec6/s_p_vJbng6ICUUefTimC.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c4cd6594f46d35a87ec6/m_p_vJbng6ICUUefTimC.jpg">크게 보기</a>]</p><h3>하느님의 어머니와 그리스도의 형상이 있는 납 암풀라(이탈리아, 볼로냐)</h3><p>4~5세기. “거룩한 장소의 성유를 담은 이런 암풀라는 동방, 곧 4세기 말부터 순례가 자리 잡아 5세기 전반에 아주 많은 순례자가 찾던 팔레스타인에서 순례자들이 대량으로 가져왔다” [27]</p><img src="https://res.bibleox.com/s/img/image/simple/686d3bdc5f47da2505d3ae5f/s_p_gcwh26YTfBvz5FbR.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d3bdc5f47da2505d3ae5f/m_p_gcwh26YTfBvz5FbR.jpg">크게 보기</a>]</p><h2>5세기</h2><h3>아기 예수를 안은 하느님의 어머니, 순교자 펠릭스와 아다욱투스, 과부 콤모딜라(로마)</h3><p>5~6세기. 콤모딜라 카타콤. 왼쪽 앞에는 과부 콤모딜라가 그려져 있습니다. 그녀를 기념하여 카타콤 성당이 지어진 부유한 로마 여인입니다.</p><img src="https://res.bibleox.com/s/img/image/simple/674edb84dba77200011c738c/s_p_urBcFMzNnn49NanW.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674edb84dba77200011c738c/m_p_urBcFMzNnn49NanW.jpg">크게 보기</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686bf61f5f47da2505d3ae38/m_p_gOZdkzGPGcL4Vws0.jpg">다른 사진 2</a>]</p><h3>그리스도와 하느님의 어머니(비잔티움)</h3><p>400~500년. 재질: 금. 3.7 × 4 × 0.3 cm, 무게 4.04 g. <a href="https://collections.louvre.fr/en/ark:/53355/cl010256498">루브르 박물관(프랑스)</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c403846594f46d35a87efb/s_p_Ahj64DxPe313azhi.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c403846594f46d35a87efb/m_p_Ahj64DxPe313azhi.jpg">크게 보기</a>]</p><h3>순교자 라우렌티우스(라벤나)</h3><p>425년. 갈라 플라키디아 영묘[1][2][25]. 열린 장 안에는 네 복음서, 곧 마가, 마태, 누가, 요한복음이 있습니다. 십자가와 펼친 복음서를 든 성인이 아래에서 불이 타는 석쇠를 향해 갑니다.</p><img src="https://res.bibleox.com/s/img/image/simple/674ee461dba77200011c738e/s_p_EPEyZAtXMtLhz0vO.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674ee461dba77200011c738e/m_p_EPEyZAtXMtLhz0vO.jpg">크게 보기</a>]</p><h3>사도 바울(에베소)</h3><p>5세기 말 프레스코, 바울의 동굴[4].</p><img src="https://res.bibleox.com/s/img/image/simple/674f2a67dba77200011c73a0/s_p_Og6LudyAS5axVwrH.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f2a67dba77200011c73a0/m_p_Og6LudyAS5axVwrH.jpg">크게 보기</a>]</p><h3>사도 바울(나폴리)</h3><p>5세기 말. 산 젠나로 카타콤, 프레스코. 아마 사도 바울이 그려져 있을 것입니다.</p><img src="https://res.bibleox.com/s/img/image/simple/674f2705dba77200011c739d/s_p_XdEMnSngRpC4ver8.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f2705dba77200011c739d/m_p_XdEMnSngRpC4ver8.jpg">크게 보기</a>]</p><h3>이고니온의 테클라, 순교자(에베소)</h3><p>성 바울과 성 테클라의 동굴. 사도 바울의 설교를 듣고 믿게 된 사람 가운데 하나로, 초기 몇 세기의 순교자입니다. 2013년에 이 동굴은 이슬람 무장 세력에게 훼손되었습니다[4].</p><img src="https://res.bibleox.com/s/img/image/simple/674f2c2edba77200011c73a1/s_p_tCvOXPpRP5ogjE1Y.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f2c2edba77200011c73a1/m_p_tCvOXPpRP5ogjE1Y.jpg">크게 보기</a>]</p><h3>테살로니키의 대순교자 디미트리오스와 천사(테살로니키, 비잔티움)</h3><p>5~6세기. 테살로니키의 성 디미트리오스 성당. 성당 서쪽의 모자이크 [10]</p><img src="https://res.bibleox.com/s/img/image/simple/686984705f47da2505d3ae11/s_p_bliIzjPrQcGjWmMT.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686984705f47da2505d3ae11/m_p_bliIzjPrQcGjWmMT.jpg">크게 보기</a>]</p><h3>테살로니키의 대순교자 디미트리오스와 아이(테살로니키, 비잔티움)</h3><p>5~6세기. 테살로니키의 성 디미트리오스 성당. 남쪽 측랑 서쪽 벽의 모자이크 [10]</p><img src="https://res.bibleox.com/s/img/image/simple/68697c845f47da2505d3ae10/s_p_T8JYB6OgB0WUM8O6.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68697c845f47da2505d3ae10/m_p_T8JYB6OgB0WUM8O6.jpg">크게 보기</a>]</p><h3>원로원 의원의 집, 산타 푸덴치아나(로마)</h3><p>402~417년. [13][14]</p><img src="https://res.bibleox.com/s/img/image/simple/6869938e5f47da2505d3ae1c/s_p_l5Dokt3jzLvx6IxN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6869938e5f47da2505d3ae1c/m_p_l5Dokt3jzLvx6IxN.jpg">크게 보기</a>]</p><h3>산타 마리아 마조레(로마)</h3><p>432~440년. [15][16]</p><img src="https://res.bibleox.com/s/img/image/simple/6869954e5f47da2505d3ae1d/s_p_0bDTRtbRpWWnfPQR.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6869954e5f47da2505d3ae1d/m_p_0bDTRtbRpWWnfPQR.jpg">크게 보기</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686995555f47da2505d3ae1e/s_p_FLcJtADykEgKNDDd.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686995555f47da2505d3ae1e/m_p_FLcJtADykEgKNDDd.jpg">크게 보기</a>]</p><h3>그리스도, 세 젊은이, 동방 박사들(북이탈리아)</h3><p>400~450년. <a href="https://collections.louvre.fr/en/ark:/53355/cl010256191">루브르 박물관(프랑스)</a>. 은, 6.3 × 12.3 × 7.1 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c1756594f46d35a87ec1/s_p_WzOTF3me39ISTfnN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c1756594f46d35a87ec1/m_p_WzOTF3me39ISTfnN.jpg">크게 보기</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c1796594f46d35a87ec2/s_p_a0udZW5EPewQCqsl.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c1796594f46d35a87ec2/m_p_a0udZW5EPewQCqsl.jpg">크게 보기</a>]</p><h3>이콘: 사도 베드로가 성 마가에게 복음서를 불러 줌(이집트)</h3><p>440~670년. <a href="https://www.metmuseum.org/art/collection/search/477163">메트로폴리탄 미술관(5번가, 미국)</a>. 13.5 × 10 × 0.8 cm. 함께 보기: <a href="https://www.metmuseum.org/art/collection/search/477492">1</a>, <a href="https://www.metmuseum.org/art/collection/search/477487">2</a>, <a href="https://www.metmuseum.org/art/collection/search/477481">3</a>, <a href="https://www.metmuseum.org/art/collection/search/477489">4</a>, <a href="https://www.metmuseum.org/art/collection/search/477491">5</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c1c2f56594f46d35a87e74/s_p_BWhcee0cn10mz7dc.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1c2f56594f46d35a87e74/m_p_BWhcee0cn10mz7dc.jpg">크게 보기</a>]</p><h3>이름이 알려지지 않은 성인(비잔티움, 이집트)</h3><p>5~6세기. <a href="https://www.metmuseum.org/art/collection/search/329982">메트로폴리탄 미술관(5번가, 미국)</a>. 44 × 32.5 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5eb2d45c75323d28a5ea3/s_p_E5UUO66hSfRBtXUn.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5eb2d45c75323d28a5ea3/m_p_E5UUO66hSfRBtXUn.jpg">크게 보기</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5eb2845c75323d28a5ea2/m_p_ofbMCUTa1winWDg0.jpg">다른 사진 2</a>]</p><h3>성 메나스의 형상이 있는 암풀라(콥트 이집트)</h3><p>5~7세기. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/87092?query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=34">에르미타주 박물관(러시아)</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c0796480b4d285320413/s_p_sW3adkK7lr960dU5.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c0796480b4d285320413/m_p_sW3adkK7lr960dU5.jpg">크게 보기</a>]</p><hr><p>5~6세기. 성 메나스의 형상이 있는 암풀라(이집트). <a href="https://www.metmuseum.org/art/collection/search/854993">메트로폴리탄 미술관(5번가, 미국)</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5f3f845c75323d28a5eb8/s_p_ePhTgphiYrxHdEaZ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5f3f845c75323d28a5eb8/m_p_ePhTgphiYrxHdEaZ.jpg">크게 보기</a>]</p><hr><p>5~6세기. 성 메나스의 형상이 있는 암풀라(이집트). <a href="https://www.metmuseum.org/art/collection/search/854994">메트로폴리탄 미술관(5번가, 미국)</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5f40645c75323d28a5eb9/s_p_5HMBehehtBuCUdOm.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5f40645c75323d28a5eb9/m_p_5HMBehehtBuCUdOm.jpg">크게 보기</a>]</p><h3>그리스도의 형상이 있는 반지(이집트, 룩소르)</h3><p>5~7세기. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/111849?page=5&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%B0&amp;index=240">에르미타주 박물관(러시아)</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c4d46480b4d285320420/s_p_SyuBoqgvHXMA5UIe.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c4d46480b4d285320420/m_p_SyuBoqgvHXMA5UIe.jpg">크게 보기</a>]</p><h2>6세기</h2><h3>주 예수 그리스도(시나이)</h3><p>6세기. 성 카타리나 수도원, 이집트 [3].</p><img src="https://res.bibleox.com/s/img/image/simple/686fe7935f47da2505d3ae87/s_p_cikLnQnMeZgiaeXg.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686fe7935f47da2505d3ae87/m_p_cikLnQnMeZgiaeXg.jpg">크게 보기</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6872d4935f47da2505d3ae90/m_p_1CbtDgulMkyLj9dK.jpg">다른 사진 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6872d4835f47da2505d3ae8d/m_p_IPypUclQUGcqTIJa.jpg">다른 사진 3</a>]</p><h3>아기 예수를 안은 하느님의 어머니, 성 테오도로스와 성 게오르기오스(시나이)</h3><p>6세기. 성 카타리나 수도원. 납화(엔카우스틱) 이콘, 이집트.</p><img src="https://res.bibleox.com/s/img/image/simple/674ece56dba77200011c7384/s_p_RWNQK8qhzLwXxGkf.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674ece56dba77200011c7384/m_p_RWNQK8qhzLwXxGkf.jpg">크게 보기</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6872d4895f47da2505d3ae8e/m_p_6JgREZVUzpO8lC9E.jpg">다른 사진 2</a>]</p><h3>사도 베드로(시나이)</h3><p>6세기. 성 카타리나 수도원. 납화(엔카우스틱) 이콘, 이집트.</p><img src="https://res.bibleox.com/s/img/image/simple/686fe28f5f47da2505d3ae82/s_p_tWJyRADNEjI9Gt5J.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686fe28f5f47da2505d3ae82/m_p_tWJyRADNEjI9Gt5J.jpg">크게 보기</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686fe73d5f47da2505d3ae86/m_p_ztqtzVnOwMfzjCsd.jpg">다른 사진 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6872d48f5f47da2505d3ae8f/m_p_x4BAyJ0C1GjHQ7Us.jpg">다른 사진 3</a>]</p><h3>하느님의 어머니와 아기 그리스도(비잔티움)</h3><p>6세기. <a href="https://www.metmuseum.org/art/collection/search/463392">메트로폴리탄 미술관(5번가, 미국)</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5fce645c75323d28a5ec5/s_p_KB8coyb4H50zurQW.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5fce645c75323d28a5ec5/m_p_KB8coyb4H50zurQW.jpg">크게 보기</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5fce945c75323d28a5ec6/m_p_eIaeevwinjFBQAeA.jpg">다른 사진 2</a>]</p><h3>하느님의 어머니와 아기 그리스도의 이콘이 있는 반지(비잔티움)</h3><p>6~7세기. <a href="https://www.metmuseum.org/art/collection/search/464059">메트로폴리탄 미술관(5번가, 미국)</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5fe7745c75323d28a5ec7/s_p_bcCSRfNkRmmk5jZs.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5fe7745c75323d28a5ec7/m_p_bcCSRfNkRmmk5jZs.jpg">크게 보기</a>]</p><h3>성 마리아</h3><p>611년, <a href="https://www.pravenc.ru/text/164537.html">게라사</a></p><img src="https://res.bibleox.com/s/img/image/simple/482/s_p_s3flMTpYpn69iMIy.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/482/m_p_s3flMTpYpn69iMIy.jpg">크게 보기</a>]</p><h3>그리스도, 메달리온(안티오키아)</h3><p>500~625년. 재질: 은, 금도금. 14.9 × 14.1 × 1.1 cm. <a href="https://collections.louvre.fr/en/ark:/53355/cl010256496">루브르 박물관(프랑스)</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c409da6594f46d35a87f00/s_p_BHIOy3tEZ3ZoMEr5.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c409da6594f46d35a87f00/m_p_BHIOy3tEZ3ZoMEr5.jpg">크게 보기</a>]</p><hr><p>500~625년. <a href="https://collections.louvre.fr/en/ark:/53355/cl010256495">루브르 박물관(프랑스)</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c41f626594f46d35a87f05/s_p_bKgaW542SgyD11o9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c41f626594f46d35a87f05/m_p_bKgaW542SgyD11o9.jpg">크게 보기</a>]</p><h3>이콘 태피스트리: 그리스도, 하느님의 어머니, 대천사 미카엘과 가브리엘, 사도들(이집트, 비잔티움)</h3><p>500년. <a href="https://www.clevelandart.org/art/1967.144">클리블랜드 미술관(미국)</a>. 양모, 178.7 × 110.5 cm.</p><p>박물관 해설:</p><blockquote><p>스무 가지가 넘는 색의 양모 실로 만든 이 희귀한 태피스트리는 당시 그림보다 비쌌습니다. 그 가격은 직조공들이 이룬 뛰어난 색의 혼합을 당시 사람들이 높이 평가했음을 보여 줍니다. 벽에 걸린 <strong>이 짜서 만든 이콘으로 신자들은 정교회 성당 안에서 하느님의 어머니와 아기 그리스도를 공경할 수 있었습니다</strong>. 두 분은 그리스어로 이름이 적힌 천사들과 사도들에게 둘러싸여 있습니다. 영적으로 효력이 있으려면 이콘(거룩한 형상)은 그 형상의 정해진 회화 전통을 되도록 정확히 따라야 했습니다.</p><p>건축 틀 위의 가로대에 있는 글은 그리스어에서 “<strong>성 미카엘, 성 마리아, 성 가브리엘</strong>”로 옮겨집니다. 넓은 잎 무늬 테두리는 과일과 꽃으로, 아래쪽은 사도들의 흉상 메달리온으로 꾸며져 있으며, 그 곁에 그리스어로 쓴 이름은 “<strong>안드레, 마태, 사도 바울, 누가, 야고보, 빌립, 마가, 도마, 요한, 맛디아, 베드로, 바돌로매</strong>”로 옮겨집니다.</p></blockquote><img src="https://res.bibleox.com/s/img/image/simple/68cb9dd5205184ec278d58d7/s_p_jXuLxO8mwNy5DicO.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68cb9dd5205184ec278d58d7/m_p_jXuLxO8mwNy5DicO.jpg">크게 보기</a>]</p><h3>이콘 태피스트리. 세 젊은이?, 키로(이집트, 비잔티움)</h3><p>500년대. <a href="https://www.clevelandart.org/art/1982.73">클리블랜드 미술관(미국)</a>. 양모, 아마. 110.5 × 76.8 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68cb9dde205184ec278d58d8/s_p_w5vxLEtZSz6mW36r.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68cb9dde205184ec278d58d8/m_p_w5vxLEtZSz6mW36r.jpg">크게 보기</a>]</p><h3>이콘 태피스트리. 하느님의 어머니, 동방 박사들, 선지자 요나(이집트, 비잔티움)</h3><p>500~550년. <a href="https://www.clevelandart.org/art/1951.400">클리블랜드 미술관(미국)</a>. 아마. 99.7 × 104.8 cm.</p><p>박물관 해설:</p><blockquote><p>… 윗단 왼쪽에는 십자 모양 다리의 걸상에 앉은 <strong>아기 그리스도를 안은 동정녀 마리아</strong>가 그려져 있습니다. 콥트어 글이 말하듯 <strong>세 왕이 예물을 들고 오른쪽에서 다가옵니다</strong>. 가운뎃단 왼쪽은 아마 <strong>그리스도의 세례</strong>를 그린 것이고, 기둥으로 나뉜 다른 세 인물은 그리스도께서 떡 다섯 개와 물고기 두 마리로 큰 무리를 먹이신 신약의 기적을 나타내는 것 같습니다. 아랫단에는 <strong>큰 물고기에게 삼켜지는 선지자 요나라는 구약의 장면</strong>이 아직 알아볼 수 있습니다.</p><p>그리스어 글이 구약과 신약의 여러 장면을 밝혀 줍니다. 윗단 첫째 박사 위에는 금을 뜻하는 그리스어(<em>χρυσός, 크리소스</em>)의 두 글자 <strong>“XP”</strong>가 보입니다. 가운뎃단 왼쪽에는 두 인물이 있는데, 첫째는 거의 지워졌고 둘째는 글 <strong>“EIΩANNHC”(요한)</strong>로 알아볼 수 있습니다. 아랫단에는 곁에 큰 물고기가 있고 해변에 토해진 요나가 글 <strong>“EIΩNAC”(요나)</strong>와 함께 그려져 있습니다. 거의 사라진 모세는 글 <strong>“MWCHC”(모세)</strong>로만 알아볼 수 있습니다.</p></blockquote><img src="https://res.bibleox.com/s/img/image/simple/68cb9e0d205184ec278d58d9/s_p_WiTqygXUYCZZY7TF.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68cb9e0d205184ec278d58d9/m_p_WiTqygXUYCZZY7TF.jpg">크게 보기</a>]</p><h3>이콘이 있는 성작과 향로(비잔티움, 시리아, 아타루티)</h3><p>500~650년. <a href="https://www.metmuseum.org/art/collection/search/474390">메트로폴리탄 미술관(5번가, 미국)</a>. 은, 금도금. 성작에는 주님과 성인들의 이콘, 그리고 누가 누구에게 바쳤는지 적은 글이 있습니다.</p><p>솜씨 있게 만든 이 전례 기물들, 곧 성작, 향로, 거르개, 성령의 비둘기 형상은 시리아의 부유한 상업 도시 아타루티의 그리스도교 교회에 속한 것이었습니다. 시리아는 당시 비잔틴 제국에서 가장 부유한 땅 가운데 하나였습니다. 성작과 향로와 거르개는 성찬 예배, 곧 그리스도인들이 최후의 만찬과 그리스도의 죽음을 기억하며 축성된 포도주와 빵을 받는 성사에 쓰였습니다.</p><p>철자가 조금씩 다른 그리스어 글에 따르면, 이 기물들 가운데 많은 것을 마을 사람들이 성 스테파노에게 봉헌된 도시의 주 성당과, 성 요한(아마 선구자 세례자 요한)에게 봉헌된 작은 성당에 바쳤습니다.</p><p>7세기 초 시리아는 먼저 사산조 페르시아에, 이어서 이슬람 군대에 넘어갔습니다. 아마 이 작품들은 비잔틴 군대가 이 지역을 공격하는 자들 앞에서 물러날 때 서둘러 보호 용기에 넣어 묻은 것으로 보입니다.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5db2045c75323d28a5e9a/s_p_kx70rC7wWJQtkfdG.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5db2045c75323d28a5e9a/m_p_kx70rC7wWJQtkfdG.jpg">크게 보기</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5edf045c75323d28a5ea5/m_p_Eru1rmuua6UWqjTz.jpg">다른 사진 2</a>]</p><hr><p>긴 머리의 선구자 요한, 오란스 자세(두 손을 든 모습)의 하느님의 어머니, 오란스 자세의 성인, 지팡이와 방패를 든 군인 성인, 십자 후광의 젊은 그리스도, 그리고 용을 무찌르는 갑옷 입은 또 다른 군인 성인(성 게오르기오스?)이 아케이드 아래에 있습니다. <a href="https://www.metmuseum.org/art/collection/search/466137">메트로폴리탄 미술관(5번가, 미국)</a>. 21.3 × 16 cm.</p><p>그리스어 글: “<strong>자기 구원을 위하여 에우독시아가 [이것을] 아타르[루티] 마을의 성 스테파노에게 예물로 바쳤다</strong>”.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5efa445c75323d28a5eaa/s_p_l5pPSsTDZHSQuvNU.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5efa445c75323d28a5eaa/m_p_l5pPSsTDZHSQuvNU.jpg">크게 보기</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f01f45c75323d28a5eab/m_p_456sbKEe3ANd9ZWP.jpg">다른 사진 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f02245c75323d28a5eac/m_p_fkJIydq7uEfZbIUt.jpg">다른 사진 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f02445c75323d28a5ead/m_p_s25q6Lu5HItPjqDs.jpg">다른 사진 4</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f02745c75323d28a5eae/m_p_QJsAgl2zRfYmpNDL.jpg">다른 사진 5</a>]</p><hr><p>성 선구자 요한, 거룩한 보제(아마 스테파노), 거룩한 주교들과 십자가의 이콘이 있는 성작. <a href="https://www.metmuseum.org/art/collection/search/466130">메트로폴리탄 미술관(5번가, 미국)</a>. 20.5 × 15.1 cm, 369 g, 1100 ml</p><p>그리스어 글: “<strong>아타루티 마을의 성 요한에게</strong>”.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5ec4545c75323d28a5ea4/s_p_KWMPzINWo4ktBKQ7.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5ec4545c75323d28a5ea4/m_p_KWMPzINWo4ktBKQ7.jpg">크게 보기</a>]</p><hr><p>그리스도, 하느님의 어머니, 선구자 요한, 승리자 게오르기오스의 이콘이 있는 성작. <a href="https://www.metmuseum.org/art/collection/search/466129">메트로폴리탄 미술관(5번가, 미국)</a>. 24.3 × 16.8 cm.</p><p>그리스어 글: “<strong>아타루티 마을의 성 스테파노</strong>”.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5ee1345c75323d28a5ea6/s_p_9bHxlNSj26b5EhMw.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5ee1345c75323d28a5ea6/m_p_9bHxlNSj26b5EhMw.jpg">크게 보기</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5ee3c45c75323d28a5ea7/m_p_8XweLe1b1pD7GWHb.jpg">다른 사진 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5ee4045c75323d28a5ea8/m_p_faMKsJUImltU9s6v.jpg">다른 사진 3</a>]</p><hr><p>십자 후광의 젊은 그리스도, 향로를 든 거룩한 보제(아마 성 스테파노), 기도하는 모습의 동정녀 마리아, 지팡이를 든 젊은 성인이 그려진 성작. 크기: 23.9 × 17 cm, 356 g. <a href="https://www.metmuseum.org/art/collection/search/466141">메트로폴리탄 미술관(5번가, 미국).</a></p><p>그리스어 글: “<strong>서원을 이행하고, 주님께서 그 이름을 아시는 이의 구원을 위하여</strong>”.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5fa7a45c75323d28a5ebe/s_p_7AzZiy4FebkdJC4e.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5fa7a45c75323d28a5ebe/m_p_7AzZiy4FebkdJC4e.jpg">크게 보기</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5fa8345c75323d28a5ebf/m_p_LQnRTCSFvxz7O7ui.jpg">다른 사진 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5fa8645c75323d28a5ec0/m_p_KvY9o90gFdzJeK9N.jpg">다른 사진 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5fa8945c75323d28a5ec1/m_p_BUzuFJ6F1fLtMppI.jpg">다른 사진 4</a>]</p><hr><p>십자 후광의 젊은 그리스도, 성 선구자 요한, 기도하는 모습의 동정녀 마리아, 거룩한 보제(아마 성 스테파노)와 십자가가 그려진 향로. 은과 금도금한 은, 구리 안감. 크기: 41.5 × 13.2 × 12.6 cm. <a href="https://www.metmuseum.org/art/collection/search/466132">메트로폴리탄 미술관(5번가, 미국)</a>.</p><p>그리스어 글: “<strong>키리아코스의 자녀 에르타와 스테파노의 영혼의 안식을 위하여</strong>”</p><img src="https://res.bibleox.com/s/img/image/simple/68b5f15545c75323d28a5eaf/s_p_OJ2d0ec3h6BtKZQM.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5f15545c75323d28a5eaf/m_p_OJ2d0ec3h6BtKZQM.jpg">크게 보기</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f15845c75323d28a5eb0/m_p_MLajjsEoJyZ7xPC7.jpg">다른 사진 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f15c45c75323d28a5eb1/m_p_5k22minZ9Q7EruSj.jpg">다른 사진 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f15e45c75323d28a5eb2/m_p_3cDRqzOwNAJr7A0S.jpg">다른 사진 4</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f16145c75323d28a5eb3/m_p_8vKQQvQJKE8Mbtoc.jpg">다른 사진 5</a>]</p><hr><p>십자 후광의 젊은 그리스도, 두 대천사와 십자가가 그려진 향로. 8.2 × 13.2 cm. <a href="https://www.metmuseum.org/art/collection/search/466131">메트로폴리탄 미술관(5번가, 미국)</a>.</p><p>그리스어 글: “<strong>아타루티 마을의 성 요한에게</strong>”.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5f27545c75323d28a5eb4/s_p_brjJXh3ZIrplms0E.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5f27545c75323d28a5eb4/m_p_brjJXh3ZIrplms0E.jpg">크게 보기</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f28545c75323d28a5eb5/m_p_oWtx1CexyxQIAxRK.jpg">다른 사진 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f28845c75323d28a5eb6/m_p_zqvxcBdCxjLqltWh.jpg">다른 사진 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f28c45c75323d28a5eb7/m_p_fIVExsqDAbrZLhWW.jpg">다른 사진 4</a>]</p><h3>그리스도와 성인들의 형상이 있는 성작, 십자가가 있는 성반(시리아, 비잔티움)</h3><p>500~700년. 클리블랜드 미술관(미국): <a href="https://www.clevelandart.org/art/1950.378">1</a>, <a href="https://www.clevelandart.org/art/1950.379">2</a>, <a href="https://www.clevelandart.org/art/1950.380">3</a>, <a href="https://www.clevelandart.org/art/1950.381">4</a>.</p><p>이 네 개의 은 전례 기물, 곧 성반 하나와 성작 셋(소장 번호 1950.378–81)은 오늘날 “베트 미소나 보물”이라 불리는 것을 이룹니다. 이 기물들이 만들어진 북시리아의 마을 이름을 딴 것입니다.</p><p>보물이 발견된 정확한 장소와 상황은 알려져 있지 않지만, 베트 미소나 마을 사람들은 시리아와 팔레스타인의 다른 그리스도교 공동체처럼, 7세기 전반에 그들의 땅을 정복한 페르시아인이나 아랍인에게서 숨기려고 교회의 은기를 묻을 수밖에 없었을 것입니다.</p><p>성찬 예배 동안 성찬의 조각들을 올려 두던 성반은 봉헌 글로 둘러싸인 라틴 십자가가 새겨져 꾸며져 있습니다. 그 글에는 성반을 바친 사람 돔노스와, 원래 있던 곳인 베트 미소나의 성 세르기오스 성당의 이름이 나옵니다.</p><p>성작들은 잔이 넓고 그리스도, 하느님의 어머니, 사도 베드로와 바울의 흉상으로 꾸며져 있습니다. 성작 하나에는 바친 사람인 돔노스의 아들 키리아코스와, 이 경건한 예물을 받은 성당의 사제 제논의 이름을 적은 봉헌 글이 있습니다.</p><p>그리스어 글: “<strong>+ 돔노스의 아들 사제 키리아코스가 사제 제논 때에 성 세르기오스에게 (이 성작을 바쳤다)</strong>”</p><img src="https://res.bibleox.com/s/img/image/simple/68caa03c205184ec278d5880/s_p_SB8idWRkPX7keKkU.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68caa03c205184ec278d5880/m_p_SB8idWRkPX7keKkU.jpg">그리스도</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68caa026205184ec278d587d/m_p_sYIDwGwUI9iMAzzD.jpg">하느님의 어머니</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68caa029205184ec278d587e/m_p_xYnPNjrcxGm5mJgl.jpg">사도</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68caa02c205184ec278d587f/m_p_kH9idfsikXyvAVvy.jpg">사도</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68caa0d4205184ec278d5881/m_p_vWERSBBMAoytSNnX.jpg">위에서 본 모습</a>]</p><hr><img src="https://res.bibleox.com/s/img/image/simple/68ca9cd5205184ec278d5874/s_p_tH0J7uqAriM7uaeK.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68ca9cd5205184ec278d5874/m_p_tH0J7uqAriM7uaeK.jpg">그리스도</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68ca9d13205184ec278d5878/m_p_tYRbn15h6MPNUilS.jpg">하느님의 어머니</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68ca9ce8205184ec278d5875/m_p_FKfoi68UXlWCS5ky.jpg">사도</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68ca9ceb205184ec278d5876/m_p_Zp9CJ61HnBcr8Csr.jpg">사도</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68ca9cee205184ec278d5877/m_p_w2JDvDj5c4pMVcfk.jpg">위에서 본 모습</a>]</p><hr><img src="https://res.bibleox.com/s/img/image/simple/68ca9e94205184ec278d5879/s_p_27LzQUQDD3A7nI9X.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68ca9e94205184ec278d5879/m_p_27LzQUQDD3A7nI9X.jpg">그리스도</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68ca9e98205184ec278d587a/m_p_R47Eqr4GrHijUSIb.jpg">하느님의 어머니</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68ca9e9b205184ec278d587b/m_p_31NEBZQIYBEqOut0.jpg">사도</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68ca9e9e205184ec278d587c/m_p_QxtJHMZORGGwFxYQ.jpg">사도</a>]</p><hr><p>500년경. 성반. <a href="https://www.clevelandart.org/art/1950.381">클리블랜드 미술관(미국)</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68ca964d205184ec278d5873/s_p_wNDEaPHmGHiuWeZy.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68ca964d205184ec278d5873/m_p_wNDEaPHmGHiuWeZy.jpg">크게 보기</a>]</p><h3>향로. 주 예수 그리스도의 세례와 십자가 처형(비잔티움)</h3><p>500~899년. 크기: 13.4 × 9 cm. <a href="https://collections.louvre.fr/en/ark:/53355/cl010042067">루브르 박물관(프랑스)</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c4068e6594f46d35a87efe/s_p_3kaCIWMTmQfT4NFG.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c4068e6594f46d35a87efe/m_p_3kaCIWMTmQfT4NFG.jpg">크게 보기</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/68c4061f6594f46d35a87efc/s_p_XNlsrfQ2MOphupt9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c4061f6594f46d35a87efc/m_p_XNlsrfQ2MOphupt9.jpg">크게 보기</a>]</p><h3>항아리. 그리스도, 하느님의 어머니, 세례자 요한, 사도들, 천사들(콘스탄티노폴리스)</h3><img src="https://res.bibleox.com/s/img/image/simple/68c420e46594f46d35a87f06/s_p_iADN1OW5uYg5Wovc.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c420e46594f46d35a87f06/m_p_iADN1OW5uYg5Wovc.jpg">크게 보기</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c420e76594f46d35a87f07/m_p_oAs6ecjPj32iGMce.jpg">뒷면</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c421216594f46d35a87f0f/m_p_x6q5apwWB0DZirK2.jpg">그리스도</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c420fc6594f46d35a87f0b/m_p_sL17qrWgxkRCNRBb.jpg">하느님의 어머니</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c420ea6594f46d35a87f08/m_p_Cb0UJi1oxoKCQaXw.jpg">세례자 요한</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c421016594f46d35a87f0c/m_p_a9Y1fyPNxcQ4oNbq.jpg">천사</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c420f66594f46d35a87f0a/m_p_nAqhqDbP5x8fRAnj.jpg">천사</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c420ef6594f46d35a87f09/m_p_F9R3iyZ8go0PxARb.jpg">사도</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c4210a6594f46d35a87f0e/m_p_97cyzUvq95UJZOrR.jpg">사도</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c421056594f46d35a87f0d/m_p_WfK6SdjAqAOW9fDK.jpg">사도</a>]</p><h3>이콘이 있는 목에 거는 십자가(비잔티움)</h3><p>6세기.<strong> </strong>금, 페이스트, 수정, 유리. 타출, 누금 세공. 사슬 길이: 33 cm, 십자가: 4.9 × 3.8 cm. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/227027?page=46&amp;query=%D0%BA%D1%80%D0%B5%D1%81%D1%82&amp;sort=112&amp;index=2288">에르미타주 박물관(러시아)</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c11e3c6594f46d35a87e2c/s_p_9GZmzTSaUVuXXaX1.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c11e3c6594f46d35a87e2c/m_p_9GZmzTSaUVuXXaX1.jpg">크게 보기</a>]</p><h3>펜던트. 그리스도의 십자가 처형(이집트)</h3><p>500~700년. 크기: 3.3 × 1.9 cm. <a href="https://collections.louvre.fr/en/ark:/53355/cl010102800">루브르 박물관(프랑스)</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c41c4e6594f46d35a87f03/s_p_tiaBwT9vqOXIlsIw.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c41c4e6594f46d35a87f03/m_p_tiaBwT9vqOXIlsIw.jpg">크게 보기</a>]</p><h3>두 성인의 이콘(비잔티움)</h3><p>6세기. 25.5 × 22 × 1.3 cm. 복음서 저자 마태와 요한일 수도 있습니다. <a href="https://www.metmuseum.org/art/collection/search/468198">메트로폴리탄 미술관(5번가, 미국)</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5fc1545c75323d28a5ec3/s_p_a2FJmSgsGJRdELBq.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5fc1545c75323d28a5ec3/m_p_a2FJmSgsGJRdELBq.jpg">크게 보기</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5fc1945c75323d28a5ec4/m_p_pcvRiRfRgBcuHJEA.jpg">다른 사진 2</a>]</p><h3>사도 베드로와 바울의 이콘(안티오키아)</h3><p>550~600년. 사도 베드로. <a href="https://www.metmuseum.org/art/collection/search/468348">메트로폴리탄 미술관(5번가, 미국)</a>. 은. 38.1 × 55.9 × 2.2 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68c1bfd36594f46d35a87e6f/s_p_WguE3h0pnnzXQXwt.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1bfd36594f46d35a87e6f/m_p_WguE3h0pnnzXQXwt.jpg">크게 보기</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c1bfd56594f46d35a87e70/m_p_83EvKNt1mFSPspQw.jpg">더 크게 보기</a>]</p><p>550~600년. 사도 바울. <a href="https://www.metmuseum.org/art/collection/search/468347">메트로폴리탄 미술관(5번가, 미국)</a>. 은. 38.1 × 55.9 × 2.2 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68c1bfda6594f46d35a87e71/s_p_5Y11faCyEzohnydQ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1bfda6594f46d35a87e71/m_p_5Y11faCyEzohnydQ.jpg">크게 보기</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c1bfdd6594f46d35a87e72/m_p_jGCYAnYdrt4tlXhd.jpg">더 크게 보기</a>]</p><h3>이콘(시리아?, 비잔티움)</h3><p>500년대. <a href="https://www.clevelandart.org/art/1941.57">클리블랜드 미술관(미국)</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68caa8cd205184ec278d5883/s_p_qr7HPRgCtcCRwsvb.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68caa8cd205184ec278d5883/m_p_qr7HPRgCtcCRwsvb.jpg">크게 보기</a>]</p><h3>군인 성인의 형상(콥트 이집트)</h3><p>6~7세기. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/180444?page=6&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=253">에르미타주 박물관(러시아)</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c3c06480b4d28532041c/s_p_Rnquar8nZacdzqcP.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c3c06480b4d28532041c/m_p_Rnquar8nZacdzqcP.jpg">크게 보기</a>]</p><h3>사도 바울(?)과 성 테클라의 이콘이 있는 암풀라(이집트)</h3><p>500~700년. <a href="https://collections.louvre.fr/en/ark:/53355/cl010280955">루브르 박물관(프랑스)</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c4390d6594f46d35a87f15/s_p_Zxs1yv3Jg8oKfFHW.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c4390d6594f46d35a87f15/m_p_Zxs1yv3Jg8oKfFHW.jpg">크게 보기</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/68c4390a6594f46d35a87f14/s_p_CPdXMrLBUE0satoH.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c4390a6594f46d35a87f14/m_p_CPdXMrLBUE0satoH.jpg">크게 보기</a>]</p><h3>사도 안드레의 이콘이 있는 암풀라(서머나)</h3><p>500~600년. <a href="https://collections.louvre.fr/en/ark:/53355/cl010281050">루브르 박물관(프랑스)</a>. 7 × 5 × 2.8 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68c437966594f46d35a87f13/s_p_dCGVNUwg3KWvs9zz.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c437966594f46d35a87f13/m_p_dCGVNUwg3KWvs9zz.jpg">크게 보기</a>]</p><h3>성 메나스의 이콘이 있는 암풀라</h3><p>610~650년. 성 메나스의 형상이 있는 암풀라(이집트). <a href="https://www.metmuseum.org/art/collection/search/475416">메트로폴리탄 미술관(5번가, 미국)</a>. 8.5 × 6.9 × 1.8 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68c1c1396594f46d35a87e73/s_p_KIdJIYWMysre63rP.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1c1396594f46d35a87e73/m_p_KIdJIYWMysre63rP.jpg">크게 보기</a>]</p><hr><p>500~750년. <a href="https://collections.louvre.fr/en/ark:/53355/cl010044285">루브르 박물관(프랑스)</a>. 13 × 10.6 × 3.4 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68c3bc556594f46d35a87ebd/s_p_iHBRxhobWKvQb2Dx.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3bc556594f46d35a87ebd/m_p_iHBRxhobWKvQb2Dx.jpg">크게 보기</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/68c3bc5c6594f46d35a87ebe/s_p_fQ8Ps5eHBD1myJaS.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3bc5c6594f46d35a87ebe/m_p_fQ8Ps5eHBD1myJaS.jpg">크게 보기</a>]</p><h3>그리스도(라벤나)</h3><p>산타폴리나레 인 클라세 성당, 이탈리아 라벤나.</p><img src="https://res.bibleox.com/s/img/image/simple/675005d5dba77200011c73ad/s_p_rjjDEzNckea3oHk2.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/675005d5dba77200011c73ad/m_p_rjjDEzNckea3oHk2.jpg">크게 보기</a>]</p><h3>그리스도와 사도들(라벤나)</h3><p>사제석의 모자이크. 산 비탈레 성당, 이탈리아 라벤나.</p><img src="https://res.bibleox.com/s/img/image/simple/675005dadba77200011c73ae/s_p_Nac2nrVo791COrcO.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/675005dadba77200011c73ae/m_p_Nac2nrVo791COrcO.jpg">크게 보기</a>]</p><h3>그리스도, 천사들과 비탈리스(라벤나)</h3><p>6세기. 밀라노의 성 비탈리스 성당, 라벤나.</p><img src="https://res.bibleox.com/s/img/image/simple/674f0ab3dba77200011c738f/s_p_AsShtty0gMBFOX5X.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f0ab3dba77200011c738f/m_p_AsShtty0gMBFOX5X.jpg">크게 보기</a>]</p><h3>정교 신앙의 황제 유스티니아누스(라벤나)</h3><p>6세기. 밀라노의 성 비탈리스 성당, 라벤나.</p><img src="https://res.bibleox.com/s/img/image/simple/674f0ab8dba77200011c7390/s_p_MsUwTeWDMk0uEVPq.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f0ab8dba77200011c7390/m_p_MsUwTeWDMk0uEVPq.jpg">크게 보기</a>]</p><h3>정교 신앙의 황후 테오도라(라벤나)</h3><p>6세기. 밀라노의 성 비탈리스 성당, 라벤나.</p><img src="https://res.bibleox.com/s/img/image/simple/674f0ac0dba77200011c7391/s_p_6g0s1g1btiJBEXSR.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f0ac0dba77200011c7391/m_p_6g0s1g1btiJBEXSR.jpg">크게 보기</a>]</p><h3>선조 아브라함(라벤나)</h3><p>6세기. 밀라노의 성 비탈리스 성당, 라벤나.</p><img src="https://res.bibleox.com/s/img/image/simple/674f0ad6dba77200011c7393/s_p_zgb5TLR1yafutIu4.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f0ad6dba77200011c7393/m_p_zgb5TLR1yafutIu4.jpg">크게 보기</a>]</p><h3>아벨과 멜기세덱(라벤나)</h3><p>6세기. 밀라노의 성 비탈리스 성당, 라벤나.</p><img src="https://res.bibleox.com/s/img/image/simple/674f0adbdba77200011c7394/s_p_PiL9TaItwhR28eXN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f0adbdba77200011c7394/m_p_PiL9TaItwhR28eXN.jpg">크게 보기</a>]</p><h3>마르켈리누스, 폴리온, 베드로, 성인들(로마)</h3><p>6세기. 폰티아누스 카타콤. 프레스코.</p><img src="https://res.bibleox.com/s/img/image/simple/66cc2c4adba77200019bc7d9/s_p_th5E9srmqGjUT72T.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/66cc2c4adba77200019bc7d9/m_p_th5E9srmqGjUT72T.jpg">크게 보기</a>]</p><h3>구름을 타고 오시는 그리스도, 사도들과 성 코스마스와 성 다미아노스(로마)</h3><p>6세기(530년). 성 코스마스와 다미아노스 성당. [19][20]</p><img src="https://res.bibleox.com/s/img/image/simple/686aa5b35f47da2505d3ae28/s_p_V2YyLyiR7wCHgIfW.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa5b35f47da2505d3ae28/m_p_V2YyLyiR7wCHgIfW.jpg">크게 보기</a>]</p><p>사도 베드로와 성 코스마스(그 옆에 성 테오도로스)</p><img src="https://res.bibleox.com/s/img/image/simple/686aa5d25f47da2505d3ae29/s_p_s66jgQ3tkVAmQEZE.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa5d25f47da2505d3ae29/m_p_s66jgQ3tkVAmQEZE.jpg">크게 보기</a>]</p><p>사도 바울과 성 다미아노스(그 옆에 교황 펠릭스)</p><img src="https://res.bibleox.com/s/img/image/simple/686aa7505f47da2505d3ae2c/s_p_WA1eP9P7BNe0aPQ6.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa7505f47da2505d3ae2c/m_p_WA1eP9P7BNe0aPQ6.jpg">크게 보기</a>]</p><p>거룩한 천사</p><img src="https://res.bibleox.com/s/img/image/simple/686aa61c5f47da2505d3ae2a/s_p_MD4QowA5HKQRhFFG.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa61c5f47da2505d3ae2a/m_p_MD4QowA5HKQRhFFG.jpg">크게 보기</a>]</p><h3>그리스도와 사도들(로마)</h3><p>6세기(578~590년). 성벽 밖 성 라우렌티우스 성당(San Lorenzo fuori le Mura) [21][22]</p><p>사도 바울 곁에 성 스테파노와 성 히폴리투스. 사도 베드로 곁에 성 라우렌티우스.</p><img src="https://res.bibleox.com/s/img/image/simple/686aabc85f47da2505d3ae2e/s_p_xa4IU82mZb80Uija.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aabc85f47da2505d3ae2e/m_p_xa4IU82mZb80Uija.jpg">크게 보기</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686aab945f47da2505d3ae2d/s_p_21M69l0ODfpN75oh.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aab945f47da2505d3ae2d/m_p_21M69l0ODfpN75oh.jpg">크게 보기</a>]</p><h3>사도 베드로와 바울(프랑크)</h3><p>6~8세기. <a href="https://www.metmuseum.org/art/collection/search/464497">메트로폴리탄 미술관(5번가, 미국)</a>(<a href="https://www.metmuseum.org/art/collection/search/464496">여기</a>에도). 상아. 29.2 × 11.4 × 0.5 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5ff8145c75323d28a5ec8/s_p_WhZZPyHo1I7oF79K.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5ff8145c75323d28a5ec8/m_p_WhZZPyHo1I7oF79K.jpg">크게 보기</a>]</p><h3>성인들(비잔티움, 이집트)</h3><p>6~7세기. <a href="https://www.metmuseum.org/art/collection/search/854019">메트로폴리탄 미술관(5번가, 미국)</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68b6007445c75323d28a5ec9/s_p_DNQuRcpcjfkINQ1r.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b6007445c75323d28a5ec9/m_p_DNQuRcpcjfkINQ1r.jpg">크게 보기</a>]</p><h3>성 포카스(비잔티움, 케르소네소스)</h3><p>6세기. 배 위에 선 <a href="https://azbyka.ru/days/sv-foka-sinopskij">시노페의 성 포카스</a>의 부조가 있는, 에울로기아(축복의 빵)를 만드는 틀. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/373084?page=2&amp;fundcoll=1420520446&amp;index=75">에르미타주 박물관(러시아)</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863bee26480b4d285320410/s_p_s0nPEGgpeMtakrof.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863bee26480b4d285320410/m_p_s0nPEGgpeMtakrof.jpg">크게 보기</a>]</p><h3>두 성인의 형상이 있는 암풀라(소아시아, 에베소)</h3><p>6세기. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/228313?page=44&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=2166">에르미타주 박물관(러시아)</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c0e76480b4d285320414/s_p_KnTGMdyOhsmTAD0S.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c0e76480b4d285320414/m_p_KnTGMdyOhsmTAD0S.jpg">크게 보기</a>]</p><h3>복음서 저자와 성인의 형상이 있는 암풀라: 신학자 요한과 브로고로(에베소)</h3><p>6세기. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/228314?page=33&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=1646">에르미타주 박물관(러시아)</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c1726480b4d285320415/s_p_oBnXQZmCz1EntIFw.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c1726480b4d285320415/m_p_oBnXQZmCz1EntIFw.jpg">크게 보기</a>]</p><h3>성 베드로와 바울의 형상과 라틴어 글이 있는 납 봉인(몰리브도불)(비잔티움)</h3><p>6~7세기. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/131338?page=33&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=1639">에르미타주 박물관(러시아)</a>. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/161973?page=33&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=1640">다른 전시품</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c19d6480b4d285320416/s_p_JKBi7CXiDOutHIFn.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c19d6480b4d285320416/m_p_JKBi7CXiDOutHIFn.jpg">크게 보기</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6863c22c6480b4d285320417/s_p_FmbNOmLfDrj3qYOz.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c22c6480b4d285320417/m_p_FmbNOmLfDrj3qYOz.jpg">크게 보기</a>]</p><h3>그리스도의 형상이 있는 납 봉인(비잔티움)</h3><p>6~7세기. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/117792?page=6&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%B0&amp;index=269">에르미타주 박물관(러시아)</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c4a86480b4d28532041f/s_p_Uy0EgcXKfuHnv9bX.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c4a86480b4d28532041f/m_p_Uy0EgcXKfuHnv9bX.jpg">크게 보기</a>]</p><h3>그리스도의 형상과 모노그램이 있는 납 봉인(비잔티움)</h3><p>6~7세기. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/117804?page=3&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%B0&amp;index=143">에르미타주 박물관(러시아)</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c5a16480b4d285320422/s_p_JNdWhUPj9cA9Dvoq.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c5a16480b4d285320422/m_p_JNdWhUPj9cA9Dvoq.jpg">크게 보기</a>]</p><h2>7세기</h2><h3>결혼반지에 새긴 그리스도의 이콘(비잔티움)</h3><p>600~700년. 반지의 그리스어 글: <strong>ΟΜΟΝΟΙΑ</strong> — 화합, <strong>ΕΙΡΙΝΗΝ ΤΗΝ ΕΜΙΝ ΔΙΔΟΜ</strong> — “나의 평안을 너희에게 주노라”(<a href="https://bibleox.com/ko/ko-nkrv/in/14/#L27">요 14:27</a>). <a href="https://collections.louvre.fr/en/ark:/53355/cl010102797">루브르 박물관(프랑스)</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c402726594f46d35a87ef8/s_p_6nMwdRXMjOnhQWfu.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c402726594f46d35a87ef8/m_p_6nMwdRXMjOnhQWfu.jpg">크게 보기</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c4027c6594f46d35a87ef9/m_p_pNTvaGVW4AmLG2BK.jpg">다른 사진 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c4027e6594f46d35a87efa/m_p_mvU9wZQKEIl0lFZY.jpg">다른 사진 3</a>]</p><h3>이콘이 있는 암풀라. 그리스도, 십자가 처형과 승천(팔레스타인, 비잔티움)</h3><p>600년대(초). <a href="https://www.clevelandart.org/art/1999.46">클리블랜드 미술관(미국)</a>. 주석·납 합금, 가죽 부품.</p><img src="https://res.bibleox.com/s/img/image/simple/68caa8cf205184ec278d5884/s_p_QfQLEBTpKbF2IfJo.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68caa8cf205184ec278d5884/m_p_QfQLEBTpKbF2IfJo.jpg">크게 보기</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68caaaaf205184ec278d5887/m_p_YFRVXxytSNharyj8.jpg">다른 사진 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68caaab2205184ec278d5888/m_p_GguW2EcCVatptKzX.jpg">다른 사진 3</a>]</p><h3>하느님의 어머니와 대순교자 테오도로스 스트라틸라테스(테살로니키, 비잔티움)</h3><p>7~10세기(?). 테살로니키의 성 디미트리오스 성당. 북쪽 기둥 남면의 모자이크.</p><img src="https://res.bibleox.com/s/img/image/simple/686985345f47da2505d3ae12/s_p_HWoRkey7yaGM1D4s.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686985345f47da2505d3ae12/m_p_HWoRkey7yaGM1D4s.jpg">크게 보기</a>]</p><h3>대순교자 디미트리오스와 봉헌자들: 대주교와 장관(테살로니키, 비잔티움)</h3><p>7세기. 테살로니키의 성 디미트리오스 성당. 모자이크.</p><img src="https://res.bibleox.com/s/img/image/simple/686986dc5f47da2505d3ae13/s_p_ZMXi7hFVOfpu7jbC.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686986dc5f47da2505d3ae13/m_p_ZMXi7hFVOfpu7jbC.jpg">크게 보기</a>]</p><h3>성 게오르기오스와 아이들(테살로니키, 비잔티움)</h3><p>7세기. 테살로니키의 성 디미트리오스 성당. 모자이크는 제단 서쪽에 있습니다.</p><img src="https://res.bibleox.com/s/img/image/simple/686987645f47da2505d3ae14/s_p_boH6uu2omR2Gjxxx.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686987645f47da2505d3ae14/m_p_boH6uu2omR2Gjxxx.jpg">크게 보기</a>]</p><h3>성 세르기오스(테살로니키, 비잔티움)</h3><p>7세기. 테살로니키의 성 디미트리오스 성당. 제단 기둥의 모자이크.</p><img src="https://res.bibleox.com/s/img/image/simple/686989925f47da2505d3ae15/s_p_Faf5BLFz9WISBGej.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686989925f47da2505d3ae15/m_p_Faf5BLFz9WISBGej.jpg">크게 보기</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a742205184ec278d6fb4/m_p_YV1I98bvx4Nn6cUn.jpg">다른 사진 2</a>]</p><h3>거룩한 선지자 다윗의 이콘(콘스탄티노폴리스, 비잔티움)</h3><p>629~630년. <a href="https://www.metmuseum.org/art/collection/search/464380">메트로폴리탄 미술관(5번가, 미국)</a>. 은. 26.6 × 4 cm, 1397 g. 함께 보기: <a href="https://www.metmuseum.org/art/collection/search/464378">1</a>, <a href="https://www.metmuseum.org/art/collection/search/464375">2</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c1c3426594f46d35a87e75/s_p_5U20dlUc30xkfJeN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1c3426594f46d35a87e75/m_p_5U20dlUc30xkfJeN.jpg">크게 보기</a>]</p><h3>성인의 형상과 글이 있는 납 봉인(비잔티움)</h3><p>7세기. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/270001?page=17&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=840">에르미타주 박물관(러시아)</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c2966480b4d285320419/s_p_EY1IyPYdMzjgztlB.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c2966480b4d285320419/m_p_EY1IyPYdMzjgztlB.jpg">크게 보기</a>]</p><h3>그리스도의 흉상과 모노그램이 있는 납 봉인(비잔티움)</h3><p>7세기. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/231980?page=2&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%B0&amp;index=96">에르미타주 박물관(러시아)</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c6076480b4d285320423/s_p_YFjOrZh2fLGJgpYJ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c6076480b4d285320423/m_p_YFjOrZh2fLGJgpYJ.jpg">크게 보기</a>]</p><h3>그리스도의 형상과 모노그램이 있는 납 봉인(비잔티움)</h3><p>7세기. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/172196?page=2&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%B0&amp;index=57">에르미타주 박물관(러시아)</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c64d6480b4d285320424/s_p_RQupAUUa4gGtXt2n.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c64d6480b4d285320424/m_p_RQupAUUa4gGtXt2n.jpg">크게 보기</a>]</p><h2>8세기</h2><h3>하느님의 어머니와 아기 예수(콘스탄티노폴리스, 비잔티움)</h3><p>하느님의 지혜(하기아 소피아) 대성당.</p><img src="https://res.bibleox.com/s/img/image/simple/674f31b0dba77200011c73a2/s_p_2AO12RGOQ2yqRiP4.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f31b0dba77200011c73a2/m_p_2AO12RGOQ2yqRiP4.jpg">크게 보기</a>]</p><h3>대천사 가브리엘(콘스탄티노폴리스, 비잔티움)</h3><p>하느님의 지혜(하기아 소피아) 대성당.</p><img src="https://res.bibleox.com/s/img/image/simple/674f3256dba77200011c73a4/s_p_rfkKZFQ8IYfO6L7V.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f3256dba77200011c73a4/m_p_rfkKZFQ8IYfO6L7V.jpg">크게 보기</a>]</p><h3>그리스도, 십자가 처형과 부활(메스, 프랑스)</h3><p>870년. <a href="https://collections.louvre.fr/en/ark:/53355/cl010113244">루브르 박물관(프랑스)</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c422e46594f46d35a87f10/s_p_lQNRJIXri6KJoLw3.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c422e46594f46d35a87f10/m_p_lQNRJIXri6KJoLw3.jpg">크게 보기</a>]</p><h3>그리스도, 십자가 처형(랭스, 프랑스)</h3><p>870~880년. <a href="https://collections.louvre.fr/en/ark:/53355/cl010098469">루브르 박물관(프랑스)</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c423bc6594f46d35a87f11/s_p_NOhnffTlgTImIczW.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c423bc6594f46d35a87f11/m_p_NOhnffTlgTImIczW.jpg">크게 보기</a>]</p><h2>9세기</h2><h3>그리스도의 승천(테살로니키, 비잔티움)</h3><p>9~10세기. 승리자 성 게오르기오스의 로툰다(원래 갈레리우스 황제의 무덤). 프레스코 [17][18]</p><img src="https://res.bibleox.com/s/img/image/simple/686a934c5f47da2505d3ae20/s_p_klfYhHum7wZvKR9D.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686a934c5f47da2505d3ae20/m_p_klfYhHum7wZvKR9D.jpg">크게 보기</a>]</p><h3>그리스도, 청동 메달리온(비잔티움)</h3><p>9~10세기. 둥근 형상을 메달리온이라고 합니다. <a href="https://www.britishmuseum.org/collection/object/H_1880-0820-9">대영 박물관</a>. 지름: 3.5 cm.</p><p>Circular medallion; bronze; bust of Christ with cruciferous nimbus holding the book of the gospel in his left hand; inscription either side.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5be2d45c75323d28a5e92/s_p_GswK2cGnuxxnLfJr.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5be2d45c75323d28a5e92/m_p_GswK2cGnuxxnLfJr.jpg">크게 보기</a>]</p><h3>하느님의 어머니의 안식(비잔티움)</h3><p>9세기 말. <a href="https://www.metmuseum.org/art/collection/search/464013">메트로폴리탄 미술관(5번가, 미국)</a>. 재질: 상아. 18.6 × 14.8 × 1.1 cm.</p><p>New York. The Metropolitan Museum of Art. "The Glory of Byzantium,". Images of the Koimesis, or the Dormition in the West, show the Virgin lying on a bier, while her soul, represented as a baby, is offered by Christ to attendant angels who will take it to heaven. The apostles, led by Saints Paul and Peter, stand witness.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5c1bf45c75323d28a5e97/s_p_0Hg1bO8KIUVBSWJs.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5c1bf45c75323d28a5e97/m_p_0Hg1bO8KIUVBSWJs.jpg">크게 보기</a>]</p><h3>그리스도, 하느님의 어머니, 세례자 요한, 사도들과 다른 성인들(콘스탄티노폴리스)</h3><p>940~960년. <a href="https://collections.louvre.fr/en/ark:/53355/cl010112515">루브르 박물관(프랑스)</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c424276594f46d35a87f12/s_p_IlqGrJe04Ic0YFWv.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c424276594f46d35a87f12/m_p_IlqGrJe04Ic0YFWv.jpg">크게 보기</a>]</p><h3>그리스도와 사도들의 형상이 있는 판(이탈리아)</h3><p>9세기. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/228918?page=4&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%B0&amp;index=194">에르미타주 박물관(러시아)</a>. 크기: 12.2 × 10.5 cm</p><img src="https://res.bibleox.com/s/img/image/simple/6863c54f6480b4d285320421/s_p_aLvOvrKuilB614SS.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c54f6480b4d285320421/m_p_aLvOvrKuilB614SS.jpg">크게 보기</a>]</p><h2>10세기</h2><h3>그리스도, 하느님의 어머니, 세례자 요한(비잔티움)</h3><p>10세기. <a href="https://www.britishmuseum.org/collection/object/H_1923-1205-2">대영 박물관</a>. 재질: 상아. 높이: 15.5 cm.</p><p>Panel; ivory; carved with standing figures, Christ with the Virgin Mary and St John, below a pierced canopy; four holes for attachment in the raised border.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5be4045c75323d28a5e95/s_p_qEFeZyh2Gq5Wbvar.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5be4045c75323d28a5e95/m_p_qEFeZyh2Gq5Wbvar.jpg">크게 보기</a>]</p><h3>하느님의 어머니와 아기 그리스도(콘스탄티노폴리스, 비잔티움)</h3><p><a href="tel:950-1025">950~1025</a>년. <a href="https://www.clevelandart.org/art/1925.1293">클리블랜드 미술관(미국)</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68caa153205184ec278d5882/s_p_iLLZZkqfsUiACLDC.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68caa153205184ec278d5882/m_p_iLLZZkqfsUiACLDC.jpg">크게 보기</a>]</p><h3>그리스도와 하느님의 어머니의 형상이 있는 펜던트(비잔티움)</h3><p>1000~1300년. <a href="https://www.metmuseum.org/art/collection/search/477247">메트로폴리탄 미술관(5번가, 미국)</a>. 옥수 카메오, 진주와 에메랄드와 석류석과 사파이어와 사도닉스 상감으로 꾸민 금 테. 전체 크기: 7.2 × 5.5 × 1.6 cm. 옥수: 1 1/2 × 1 1/4인치(3.8 × 3.2 cm)</p><img src="https://res.bibleox.com/s/img/image/simple/68c1bc1a6594f46d35a87e6d/s_p_VcHt7eFMtZq1I1lY.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1bc1a6594f46d35a87e6d/m_p_VcHt7eFMtZq1I1lY.jpg">크게 보기</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/68c1bc176594f46d35a87e6c/s_p_LwWdQj6J4ehbmMh9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1bc176594f46d35a87e6c/m_p_LwWdQj6J4ehbmMh9.jpg">크게 보기</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c1bc1f6594f46d35a87e6e/m_p_gT2TXueTg5pmDsuZ.jpg">더 크게 보기</a>]</p><h3>그리스도의 형상이 있는 십자가(비잔티움)</h3><p>10~11세기. 청동. 6.6 × 4.2 cm. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/228297?page=56&amp;query=%D0%BA%D1%80%D0%B5%D1%81%D1%82&amp;sort=112&amp;index=2755">에르미타주 박물관(러시아)</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c11f5b6594f46d35a87e2d/s_p_6uw78FFpsxpItSzn.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c11f5b6594f46d35a87e2d/m_p_6uw78FFpsxpItSzn.jpg">크게 보기</a>]</p><h3>그리스도의 형상이 있는 십자가(비잔티움)</h3><p>10~11세기. 청동. 7.7 × 7 cm. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/482789?page=51&amp;query=%D0%BA%D1%80%D0%B5%D1%81%D1%82&amp;sort=112&amp;index=2501">에르미타주 박물관(러시아)</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c11fab6594f46d35a87e2e/s_p_jfgfrZ4X7jcBXG9D.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c11fab6594f46d35a87e2e/m_p_jfgfrZ4X7jcBXG9D.jpg">크게 보기</a>]</p><h3>성인들의 이콘이 있는 십자가(케르소네소스)</h3><p>10세기. 청동, 선각. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/372835?page=5&amp;fundcoll=1420520446__1413747286&amp;index=229">에르미타주 박물관(러시아)</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c4191a6594f46d35a87f02/s_p_iFiSEGM9EbRIhhtD.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c4191a6594f46d35a87f02/m_p_iFiSEGM9EbRIhhtD.jpg">크게 보기</a>]</p><h3>테살로니키의 성 디미트리오스(비잔티움)</h3><p><a href="tel:950-1000">950~1000</a>년. <a href="https://www.metmuseum.org/art/collection/search/465946">메트로폴리탄 미술관(5번가, 미국)</a>. 재질: 상아. 19.7 × 12.1 × 1 cm.</p><p>Standing erect, a spear in his hand and a shield at his side, Saint Demetrios is shown ready to protect the Christian faithful. The name of the popular Byzantine military saint is inscribed in two parts in Greek. Martyred in Thessalonike, the second most important city of the empire in the early centuries of the church, he has long been the patron saint of that metropolis. Images of saints in military dress are rare in Early Byzantine art (they appear on the chalices of the Attarouthi Treasure) but typical of the Middle Byzantine period.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5c38445c75323d28a5e98/s_p_ZeZuXGqxAAyDuPBA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5c38445c75323d28a5e98/m_p_ZeZuXGqxAAyDuPBA.jpg">크게 보기</a>]</p><h2>11세기</h2><h3>행렬용 십자가: 그리스도, 하느님의 어머니, 대천사 미카엘과 가브리엘(비잔티움)</h3><p>1000~1050년. <a href="https://www.metmuseum.org/art/collection/search/466251">메트로폴리탄 미술관(5번가, 미국)</a>. 59.5 × 43 × 2.2 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5e3e645c75323d28a5e9b/s_p_Ft65PrnBUmI6wDAc.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5e3e645c75323d28a5e9b/m_p_Ft65PrnBUmI6wDAc.jpg">크게 보기</a>]</p><h3>행렬용 십자가: 그리스도, 하느님의 어머니, 세례자 요한(비잔티움)</h3><p>1050년. <a href="https://www.clevelandart.org/art/1970.36">클리블랜드 미술관(미국)</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68ca921d205184ec278d5871/s_p_PrD5y34JBpT95quf.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68ca921d205184ec278d5871/m_p_PrD5y34JBpT95quf.jpg">크게 보기</a>]</p><h3>행렬용 십자가: 성 사바스(비잔티움)</h3><p>1050년. <a href="https://www.metmuseum.org/art/collection/search/697956">메트로폴리탄 미술관(5번가, 미국)</a>. 뒷면 가운데에 성 사바스, 끝에는 다른 거룩한 수도자들이 그려져 있습니다. 은. 32.4 × 44.8 × 5.7 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68c1c6546594f46d35a87e76/s_p_FO8cb8Ec2FqTDFz8.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1c6546594f46d35a87e76/m_p_FO8cb8Ec2FqTDFz8.jpg">크게 보기</a>]</p><h3>행렬용 십자가: 그리스도(케르소네소스)</h3><p>11세기. 재질: 청동, 철. 주조, 타출, 선각. 크기: 36.5 × 27.5 cm. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/372834?page=3&amp;fundcoll=1420520446__1413747286&amp;index=106">에르미타주 박물관(러시아)</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c418616594f46d35a87f01/s_p_ytqdkwIa6FDSikCw.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c418616594f46d35a87f01/m_p_ytqdkwIa6FDSikCw.jpg">크게 보기</a>]</p><h3>이콘 “전능자 그리스도(판토크라토르)”의 일부(비잔티움, 크림)</h3><p>1050~1100년. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/372766?page=40&amp;query=%D0%B8%D0%BA%D0%BE%D0%BD%D0%B0&amp;index=1999">에르미타주 박물관(러시아)</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863bfff6480b4d285320412/s_p_XwuOAkY6yR10NT7b.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863bfff6480b4d285320412/m_p_XwuOAkY6yR10NT7b.jpg">크게 보기</a>]</p><h3>아기 그리스도를 안은 하느님의 어머니(콘스탄티노폴리스)</h3><p>1000~1015년. <a href="https://collections.louvre.fr/en/ark:/53355/cl010101133">루브르 박물관(프랑스)</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c43b8c6594f46d35a87f16/s_p_rQNvoLa9Vu1WmSB2.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c43b8c6594f46d35a87f16/m_p_rQNvoLa9Vu1WmSB2.jpg">크게 보기</a>]</p><h3>하느님의 어머니, 오란타(콘스탄티노폴리스)</h3><p>1000~1200년. <a href="https://collections.louvre.fr/en/ark:/53355/cl010114443">루브르 박물관(프랑스)</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c43bcc6594f46d35a87f17/s_p_7a5oJnVWqjfeu67t.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c43bcc6594f46d35a87f17/m_p_7a5oJnVWqjfeu67t.jpg">크게 보기</a>]</p><h3>하느님의 어머니, 대천사 미카엘, 성 테오도로스(비잔티움)</h3><p>11~12세기. <a href="https://www.britishmuseum.org/collection/object/H_1981-0103-1">대영 박물관</a>. 108 × 95 mm.</p><p>Relief icon; rectangular bronze plaque cast in low relief with full-length Hodegetria flanked by the Archangel Michael and St Theodore, each wearing a girdled tunic beneath a chlamys with decorated tablion; the figures are identified by intaglio inscriptions; the whole is surrounded by a raised border with a running vine scroll; traces of solder at sides and back.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5be3545c75323d28a5e93/s_p_DFDGZ6kHm0khLKRD.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5be3545c75323d28a5e93/m_p_DFDGZ6kHm0khLKRD.jpg">크게 보기</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5be3b45c75323d28a5e94/m_p_FfmDAHv29BAMxval.jpg">더 크게 보기</a>]</p><h3>성 디미트리오스의 이콘(비잔티움)</h3><p>1040~1060년. <a href="https://collections.louvre.fr/en/ark:/53355/cl010115478">루브르 박물관(프랑스)</a>. 9.4 × 6.3 × 0.6 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c0c36594f46d35a87ec0/s_p_dj04XPO3pwvzkLzr.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c0c36594f46d35a87ec0/m_p_dj04XPO3pwvzkLzr.jpg">크게 보기</a>]</p><h3>성 디미트리오스의 형상과 글이 있는 납 봉인(비잔티움)</h3><p>11세기. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/269619?page=20&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=958">에르미타주 박물관(러시아)</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c2556480b4d285320418/s_p_oqzix7avanFfe61o.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c2556480b4d285320418/m_p_oqzix7avanFfe61o.jpg">크게 보기</a>]</p><h3>성인의 반신상이 있는 납 봉인(비잔티움)</h3><p>11세기. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/267492?page=14&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=651">에르미타주 박물관(러시아)</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c3196480b4d28532041a/s_p_VySwl31Z41rar6d3.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c3196480b4d28532041a/m_p_VySwl31Z41rar6d3.jpg">크게 보기</a>]</p><h3>성인의 형상이 있는 걸이 인장(비잔티움)</h3><p>11세기. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/483272?query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=21">에르미타주 박물관(러시아)</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c4276480b4d28532041d/s_p_5EJuZ18em5TsdUwA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c4276480b4d28532041d/m_p_5EJuZ18em5TsdUwA.jpg">크게 보기</a>]</p><h3>성인의 형상이 있는 걸이 인장(비잔티움)</h3><p>11~12세기. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/483278?query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=35">에르미타주 박물관(러시아)</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c4616480b4d28532041e/s_p_H8LrRkkjwBHlc322.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c4616480b4d28532041e/m_p_H8LrRkkjwBHlc322.jpg">크게 보기</a>]</p><h2>12세기</h2><h3>그리스도, 하느님의 어머니, 선지자 요한(콘스탄티노폴리스, 비잔티움)</h3><p>하느님의 지혜(하기아 소피아) 대성당. 성당의 프레스코[5]</p><img src="https://res.bibleox.com/s/img/image/simple/6750078ddba77200011c73af/s_p_EcliI0JFeV1uu1LU.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6750078ddba77200011c73af/m_p_EcliI0JFeV1uu1LU.jpg">크게 보기</a>]</p><h3>그리스도(콘스탄티노폴리스, 비잔티움)</h3><p>하느님의 지혜(하기아 소피아) 대성당.</p><img src="https://res.bibleox.com/s/img/image/simple/674f332ddba77200011c73a6/s_p_1PCMz3Y4EZgbSJL0.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f332ddba77200011c73a6/m_p_1PCMz3Y4EZgbSJL0.jpg">크게 보기</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686cf10d5f47da2505d3ae4e/s_p_ZHUiumbGoeJMn4GO.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686cf10d5f47da2505d3ae4e/m_p_ZHUiumbGoeJMn4GO.jpg">크게 보기</a>]</p><h3>하느님의 어머니(콘스탄티노폴리스, 비잔티움)</h3><p>하느님의 지혜(하기아 소피아) 대성당.</p><img src="https://res.bibleox.com/s/img/image/simple/674f3332dba77200011c73a7/s_p_WvZb6UestGwJUzJr.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f3332dba77200011c73a7/m_p_WvZb6UestGwJUzJr.jpg">크게 보기</a>]</p><h3>세례자 요한, 선지자(콘스탄티노폴리스, 비잔티움)</h3><p>하느님의 지혜(하기아 소피아) 대성당.</p><img src="https://res.bibleox.com/s/img/image/simple/674f357ddba77200011c73a8/s_p_hdfr9cx0ZPTZyn6N.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f357ddba77200011c73a8/m_p_hdfr9cx0ZPTZyn6N.jpg">크게 보기</a>]</p><h3>아기 예수를 안은 하느님의 어머니(콘스탄티노폴리스)</h3><p>12세기 첫 3분의 1. 블라디미르의 하느님의 어머니 이콘. 나무, 템페라.</p><img src="https://res.bibleox.com/s/img/image/simple/674f18e4dba77200011c7399/s_p_0uaArAqVhNX9r0gV.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f18e4dba77200011c7399/m_p_0uaArAqVhNX9r0gV.jpg">크게 보기</a>]</p><h3>하느님의 어머니(비잔티움, 시리아, 타르투스)</h3><p>12세기. <a href="https://www.britishmuseum.org/collection/object/H_1889-0511-13">대영 박물관</a>. 재질: 상아, 41 × 47 mm.</p><p>Relief icon; pale grey-green steatite; rounded at the top and square below; bust of the Virgin, her mantle drawn over her head, with St Andrew''s cross on it; her hands held in front with palms outwards, inscription either side of her.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5be2645c75323d28a5e91/s_p_StVNlxiOjocLLsz5.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5be2645c75323d28a5e91/m_p_StVNlxiOjocLLsz5.jpg">크게 보기</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5be2245c75323d28a5e90/m_p_yHJ3BkdNwVGdLb4m.jpg">더 크게 보기</a>]</p><h3>테살로니키의 대순교자 디미트리오스와 보제(테살로니키, 비잔티움)</h3><p>12세기. 남쪽 기둥 동면의 모자이크.</p><img src="https://res.bibleox.com/s/img/image/simple/68698a155f47da2505d3ae16/s_p_n7AgnVLPvfeBX5Qq.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68698a155f47da2505d3ae16/m_p_n7AgnVLPvfeBX5Qq.jpg">크게 보기</a>]</p><h3>호데게트리아 하느님의 어머니 이콘(비잔티움, 케르소네소스)</h3><p>12세기 후반. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/372931?page=11&amp;fundcoll=1420520446&amp;index=536">에르미타주 박물관(러시아)</a>. 6.8 × 5 cm</p><img src="https://res.bibleox.com/s/img/image/simple/6863bf2f6480b4d285320411/s_p_10YV8HIpAzMNCgvp.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863bf2f6480b4d285320411/m_p_10YV8HIpAzMNCgvp.jpg">크게 보기</a>]</p><h2>13세기</h2><h3>전능하신 주님(아토스)</h3><p>힐란다르 수도원, 거룩한 산 아토스.</p><img src="https://res.bibleox.com/s/img/image/simple/69406737205184ec278d6fd8/s_p_hTWcEC5QtmbCrC5t.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69406737205184ec278d6fd8/m_p_hTWcEC5QtmbCrC5t.jpg">크게 보기</a>]</p><h3>아기 예수를 안은 하느님의 어머니(호데게트리아, 아토스)</h3><p>힐란다르 수도원, 거룩한 산 아토스.</p><img src="https://res.bibleox.com/s/img/image/simple/674f0cfadba77200011c7395/s_p_mQMRA7FGLEbqOYIx.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f0cfadba77200011c7395/m_p_mQMRA7FGLEbqOYIx.jpg">크게 보기</a>]</p><h2>14세기</h2><h3>전능하신 주님</h3><p>이콘 화가 마누일 판셀리노스.</p><img src="https://res.bibleox.com/s/img/image/simple/674f28d1dba77200011c739e/s_p_ma0z14hIFXCiEj7S.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f28d1dba77200011c739e/m_p_ma0z14hIFXCiEj7S.jpg">크게 보기</a>]</p><h3>하느님의 어머니(테살로니키)</h3><p>1310~1315년. 오란타. 그리스 테살로니키, 성 니콜라오스 오르파노스 성당의 프레스코.</p><img src="https://res.bibleox.com/s/img/image/simple/674f29b7dba77200011c739f/s_p_PSuCdQIYdR4IYZgA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f29b7dba77200011c739f/m_p_PSuCdQIYdR4IYZgA.jpg">크게 보기</a>]</p><h3>지극히 거룩하신 하느님의 어머니의 성전 봉헌(콘스탄티노폴리스)</h3><p>1316~1321년경. 카리예 자미, 코라 수도원, 튀르키예 이스탄불(콘스탄티노폴리스).</p><img src="https://res.bibleox.com/s/img/image/simple/675343bddba7720001cd0ddf/s_p_AtF4vpmhv6FneUfA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/675343bddba7720001cd0ddf/m_p_AtF4vpmhv6FneUfA.jpg">크게 보기</a>]</p><h2>15세기</h2><h3>사도 바울(루시)</h3><p>1410년대. 작가: 성 안드레이 루블료프. 국립 트레티야코프 미술관, 러시아 모스크바.</p><img src="https://res.bibleox.com/s/img/image/simple/6909fbca205184ec278d6e6a/s_p_ok25vNdlaQMM5P3c.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6909fbca205184ec278d6e6a/m_p_ok25vNdlaQMM5P3c.jpg">크게 보기</a>]</p><h2>이콘 모음</h2><ol><li><p>카타콤 도상 모음, Word 파일: <a href="https://disk.yandex.ru/d/mHc8dxUdHGqMEQ">링크</a></p></li><li><p>이콘 화가 마누일 판셀리노스의 작품(13~14세기): <a href="https://vk.com/album-20034910_224123875">https://vk.com/album-20034910_224123875</a></p></li></ol>'
