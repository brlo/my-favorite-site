  title: 주요 모음에 들지 않은 여러 고대 형상
  title_sub:
  body: '<h2>성 야누아리우스의 카타콤(Catacombe di San Gennaro) [1]</h2><h3>베네벤토의 성 야누아리우스, 푸테올리(나폴리)의 주교, 성직자 순교자</h3><p>나폴리, 산 젠나로(성 야누아리우스) 카타콤. 4세기 프레스코. 여기에 누가 그려져 있는지는 완전히 밝혀지지 않았습니다. 위에는 SANCTOMARTYRIIANVARIO(거룩한 순교자 야누아리우스에게)라고 쓰여 있습니다. 그런데 어째서인지 젊은이가 그려져 있습니다. 후광이 왜 이런 모양인지도 알 수 없습니다.</p><p>정교회에서 이 성인에 관한 페이지(러시아어): <a href="https://days.pravoslavie.ru/name/890.html">https://days.pravoslavie.ru/name/890.html</a></p><p>이 프레스코에 관한 위키백과 페이지. 폴란드어지만 유용한 정보가 있습니다: <a href="https://pl.wikipedia.org/wiki/January_z_Benewentu">https://pl.wikipedia.org/wiki/January_z_Benewentu</a></p><img src="https://res.bibleox.com/s/img/image/simple/686e6aa95f47da2505d3ae6e/s_p_RCtXSS4uiuO9E0Qf.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686e6aa95f47da2505d3ae6e/m_p_RCtXSS4uiuO9E0Qf.jpg">크게 보기</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686e56775f47da2505d3ae67/m_p_XhI4Ni1rKZ949Zi1.jpg">다른 사진 2</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686e54755f47da2505d3ae66/s_p_zKsSelu839AuImaV.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686e54755f47da2505d3ae66/m_p_zKsSelu839AuImaV.jpg">크게 보기</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686e57135f47da2505d3ae68/m_p_faNUwXKGPaVtmUwW.jpg">다른 사진 2</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686e6aec5f47da2505d3ae70/s_p_2fvyFxXewVLu06NV.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686e6aec5f47da2505d3ae70/m_p_2fvyFxXewVLu06NV.jpg">크게 보기</a>]</p><h3>그리스도인 여성 케룰라</h3><p>아래의 비문: “CERVLA IN PACE”(평화 가운데 있는 케룰라), 5–6세기. [3]</p><img src="https://res.bibleox.com/s/img/image/simple/686e4d5c5f47da2505d3ae63/s_p_1dqPUS5wghY1DrdP.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686e4d5c5f47da2505d3ae63/m_p_1dqPUS5wghY1DrdP.jpg">크게 보기</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686e58705f47da2505d3ae6a/m_p_r6sua9UNLBhgIZ06.jpg">다른 사진 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686e58625f47da2505d3ae69/m_p_6KViYk7KWJDrIa8l.jpg">다른 사진 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686e6ad15f47da2505d3ae6f/m_p_q9ocVtWoayH4BxtB.jpg">다른 사진 4</a>]</p><h3>테오테크누스 가족</h3><blockquote><p>테오테크누스 가족의 아르코솔리움(아치형 무덤 벽감). 조사에 따르면 소녀가 가장 먼저 죽었습니다. 벽감에는 소녀의 초상 프레스코가 그려졌습니다. 다음에 남자가 죽었습니다. 첫 프레스코 위에 이번에는 아버지가 함께 있는 새 그림이 그려졌습니다. 마지막으로 여자가 죽었고, 벽감에는 가족의 단체 초상이 나타났습니다.</p></blockquote><img src="https://res.bibleox.com/s/img/image/simple/686e6be45f47da2505d3ae71/s_p_xNoWgh6wacZ3al1R.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686e6be45f47da2505d3ae71/m_p_xNoWgh6wacZ3al1R.jpg">크게 보기</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686e592c5f47da2505d3ae6b/s_p_A6SYWxzdgc1EPwun.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686e592c5f47da2505d3ae6b/m_p_A6SYWxzdgc1EPwun.jpg">크게 보기</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686fe8695f47da2505d3ae88/m_p_nzuUOKu6sAmxO4pO.jpg">다른 사진 2</a>]</p><h2>아나포 가도의 카타콤[2]</h2><h3>기도하는 여인(오란스)</h3><p>로마, 아나포 가도의 무명 카타콤(Anonima di Via Anapo)에 있는 기도하는 여인(오란스)의 프레스코</p><img src="https://res.bibleox.com/s/img/image/simple/686e53655f47da2505d3ae65/s_p_qTxn07MuPIePNzPn.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686e53655f47da2505d3ae65/m_p_qTxn07MuPIePNzPn.jpg">크게 보기</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686e535e5f47da2505d3ae64/m_p_U8Zh4RJjehyZtXep.jpg">다른 사진 2</a>]</p>'
