  title: 금식 음식
  title_sub:
  body: '<p>이 글은 전에 금식해 본 적이 없고 금식 음식을 만드는 데 익숙하지 않아 금식 기간에 무엇을 만들어야 할지 모르는 사람이 방향을 잡을 수 있도록, 금식 음식의 모습을 간단히만 소개합니다.</p><blockquote><p>“주께서 대답하여 이르시되 마르다야 마르다야 네가 많은 일로 염려하고 근심하나 몇 가지만 하든지 혹은 한 가지만이라도 족하니라 마리아는 이 좋은 편을 택하였으니 빼앗기지 아니하리라 하시니라”(<a href="https://bibleox.com/ko/ko-nkrv/lk/10/#L41-42">눅 10:41-42</a>)</p></blockquote><blockquote><p>“너희는 스스로 조심하라 그렇지 않으면 방탕함과 술취함과 생활의 염려로 마음이 둔하여지고 뜻밖에 그 날이 덫과 같이 너희에게 임하리라”(<a href="https://bibleox.com/ko/ko-nkrv/lk/21/#L34">눅 21:34</a>)</p></blockquote><h2>수프</h2><h3>채소 국물 수프(볶은 양파와 당근)</h3><p>거의 모든 수프에 감자를 넣으면 잘 어울립니다.</p><ul><li><p><strong>곡물 수프</strong>(메밀, 쌀, 보리, 렌틸콩, 완두콩),</p></li><li><p><strong>파스타 수프</strong>,</p></li><li><p><strong>채소 수프</strong>,</p></li><li><p><strong>보르시</strong>(비트 수프),</p></li><li><p><strong>라솔니크</strong>(오이 절임을 넣은 수프),</p></li><li><p><strong>시</strong>(양배추 수프),</p></li><li><p><strong>우하</strong>(생선 수프, 규정상 생선이 허락될 때).</p></li></ul><h2>곁들임 요리</h2><ul><li><p><strong>오트밀</strong>(플레이크),</p></li><li><p><strong>삶은</strong> 쌀, 메밀, 렌틸콩, 쿠스쿠스, 불구르, 퀴노아, 폴렌타(옥수수 가루 죽) 같은 곡물. 볶은 양파와 당근을 곁들이면 좋습니다.</p></li><li><p><strong>플롭(필라프)</strong>(든든하게 하려면 병아리콩을 넣어도 좋습니다),</p></li><li><p><strong>삶은 쌀 믹스</strong>: 하와이식, 멕시코식 등,</p></li><li><p><strong>파스타</strong>: 삶은 것, 먼저 볶은 뒤 삶은 것, 버섯 파스타, 생선 통조림(참치, 정어리 등, 규정상 허락될 때)을 넣은 것,</p></li><li><p><strong>감자</strong>: 볶음, 구이, 삶은 감자, 으깬 감자,</p></li><li><p><strong>양배추 조림</strong>,</p></li><li><p><strong>채소 스튜</strong>: 감자, 당근, 양파, 애호박, 파프리카, 버섯, 토마토 페이스트나 토마토, 가지,</p></li><li><p><strong>삶은 채소</strong>(콜리플라워, 브로콜리, 완두콩, 옥수수),</p></li><li><p><strong>바레니키</strong>(만두 비슷한 음식): 감자, 버섯, 체리 소,</p></li><li><p><strong>두부</strong>,</p></li><li><p><strong>병아리콩 채소 요리</strong>,</p></li><li><p><strong>버섯</strong> 볶음,</p></li><li><p><strong>애호박</strong> 구이,</p></li><li><p><strong>드라니키</strong>(간 감자나 애호박에 쌀가루나 밀가루, 소금을 넣어 부친 전),</p></li><li><p><strong>라타투이</strong>,</p></li><li><p><strong>단호박 구이</strong>,</p></li><li><p><strong>채소 그릴 구이</strong>,</p></li><li><p><strong>채소 커틀릿</strong>(강낭콩으로).</p></li></ul><h2>샐러드</h2><ul><li><p><strong>생채소 샐러드</strong>: 오이, 토마토, 햇양배추, 적양파, 상추, 파프리카, 허브, 향신료,</p></li><li><p><strong>삶은 채소 샐러드</strong>: 비네그레트(감자, 비트, 당근, 강낭콩, 완두콩 통조림, 오이 절임, 양파, 사워크라우트),</p></li><li><p><strong>배추 샐러드</strong>: 배추, 옥수수, 금식 마요네즈[1],</p></li><li><p><strong>삶은 비트</strong>와 금식 마요네즈[1],</p></li><li><p><strong>과일 샐러드</strong>,</p></li><li><p><strong>아보카도 샐러드</strong>,</p></li></ul><h2>절임</h2><ul><li><p><strong>사워크라우트</strong>(양배추 절임),</p></li><li><p><strong>오이</strong>: 절임, 살짝 절인 것, 두드려 무친 것,</p></li><li><p>고려인식 <strong>당근</strong> 무침(마르코프차),</p></li><li><p>식초에 절인 <strong>양파</strong>,</p></li><li><p>등.</p></li></ul><h2>밀가루 음식</h2><ul><li><p><strong>빵</strong>,</p></li><li><p><strong>금식 빵</strong>: 오븐이나 프라이팬에 굽거나 가게에서 삽니다,</p></li><li><p><strong>소를 넣은 피로시키</strong>: 체리, 양배추 조림, 감자와 양파 소,</p></li><li><p><strong>금식 블리니(얇은 팬케이크)</strong>(우유 대신 물, 달걀 대신 바나나),</p></li></ul><h2>저장 식품</h2><ul><li><p><strong>애호박</strong> <strong>스프레드(이크라)</strong>,</p></li><li><p><strong>가지</strong> <strong>스프레드(이크라)</strong>,</p></li><li><p><strong>후무스</strong>,</p></li><li><p><strong>옥수수</strong>,</p></li><li><p><strong>버섯</strong>,</p></li><li><p><strong>강낭콩</strong>,</p></li><li><p><strong>완두콩</strong>,</p></li><li><p><strong>선드라이 토마토</strong>,</p></li><li><p>치즈 없는 <strong>과카몰리</strong>,</p></li></ul><h2>말린 과일과 견과</h2><ul><li><p><strong>견과류</strong>,</p></li><li><p>말리거나 동결 건조한 <strong>베리와 과일</strong>,</p></li><li><p><strong>할바</strong>,</p></li></ul><h2>오픈 샌드위치와 간식</h2><ul><li><p>꿀을 바른 빵,</p></li><li><p>토마토와 바질과 소금을 올린 빵.</p></li></ul><h2>음료</h2><ul><li><p>크바스(빵을 발효시킨 음료)</p></li><li><p>키셀(전분으로 걸쭉하게 만든 과일 음료)</p></li><li><p>콤포트(생 베리나 말린 과일을 끓인 음료)</p></li><li><p>모르스(베리 즙 음료)</p></li><li><p>스무디</p></li><li><p>레모네이드</p></li><li><p>차</p></li><li><p>우유 없는 커피</p></li><li><p>물</p></li></ul>'
  references: "<ol><li><p><strong>금식 마요네즈</strong>: 완두콩 통조림 국물, 식물성 기름, 겨자, 소금, 설탕, 식초. 블렌더로 갈아 줍니다.</p></li></ol><p>러시아어에서 번역: 로디온 블라소프 (AI 도구 활용). 성경 인용은 개역개정에 따름.</p>"
