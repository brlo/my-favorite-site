  title_sub:
  body: '<h2>2세기</h2><h3><a href="https://ru.wikipedia.org/wiki/%D0%9F%D0%B0%D0%BF%D0%B8%D1%80%D1%83%D1%81_52">파피루스 52</a> — <a href="https://bibleox.com/ko/ko-nkrv/in/18/#L31-33,37-38">요 18:31-33,37-38</a> (~150)</h3><img src="https://res.bibleox.com/s/img/image/simple/67c76e30dba7720001a4ab31/s_p_k5TLeFzzlkF84GaN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/67c76e30dba7720001a4ab31/m_p_k5TLeFzzlkF84GaN.jpg">크게 보기</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/67c77746dba7720001a4ab32/s_p_redMnT8D34cxZOYL.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/67c77746dba7720001a4ab32/m_p_redMnT8D34cxZOYL.jpg">크게 보기</a>]</p><h3><a href="https://en.wikipedia.org/wiki/Papyrus_90">파피루스 90</a> — <a href="https://bibleox.com/ko/ko-nkrv/in/18/#L36-40">요 18:36-40</a>; <a href="https://bibleox.com/ko/ko-nkrv/in/19/#L1-7">요 19:1-7</a> (~150)</h3><img src="https://res.bibleox.com/s/img/image/simple/67c7784edba7720001a4ab33/s_p_H1o3KGBYNI9sl2F9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/67c7784edba7720001a4ab33/m_p_H1o3KGBYNI9sl2F9.jpg">크게 보기</a>]</p><h3><a href="https://en.wikipedia.org/wiki/Papyrus_104">파피루스 104</a> — <a href="https://bibleox.com/ko/ko-nkrv/mf/21/#L34-37">마 21:34-37</a>; <a href="https://bibleox.com/ko/ko-nkrv/mf/21/#L43-44">마 21:43-44</a> (~150)</h3><img src="https://res.bibleox.com/s/img/image/simple/67c778a6dba7720001a4ab34/s_p_J8MmDkwHjJgq0wEA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/67c778a6dba7720001a4ab34/m_p_J8MmDkwHjJgq0wEA.jpg">크게 보기</a>]</p><h3><a href="https://en.wikipedia.org/wiki/Papyrus_98">파피루스 98</a> — <a href="https://bibleox.com/ko/ko-nkrv/otkr/1/#L13-20">계 1:13-20</a>; <a href="https://bibleox.com/ko/ko-nkrv/otkr/2/#L1">계 2:1</a> (~150–250)</h3><img src="https://res.bibleox.com/s/img/image/simple/67c779a2dba7720001a4ab35/s_p_rPG5aCVLBBw75jo3.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/67c779a2dba7720001a4ab35/m_p_rPG5aCVLBBw75jo3.jpg">크게 보기</a>]</p><h2>3세기</h2><h3><a href="https://en.wikipedia.org/wiki/Papyrus_75">파피루스 75</a> — <a href="https://bibleox.com/ko/ko-nkrv/lk/3/#L18">눅 3:18</a> — 24:53; <a href="https://bibleox.com/ko/ko-nkrv/in/1/#L1">요 1:1</a> — 15:8 (175–225)</h3><img src="https://res.bibleox.com/s/img/image/simple/67c77d00dba7720001a4ab3a/s_p_9dXrKwGPywze2DAo.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/67c77d00dba7720001a4ab3a/m_p_9dXrKwGPywze2DAo.jpg">크게 보기</a>]</p><h3><a href="https://en.wikipedia.org/wiki/Papyrus_46">파피루스 46</a> — 롬, 히, 고전, 고후, 엡, 갈, 빌, 골, 살전 (~175–225)</h3><img src="https://res.bibleox.com/s/img/image/simple/6915b056205184ec278d6e7f/s_p_lPe15bGd8VVR6y2H.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6915b056205184ec278d6e7f/m_p_lPe15bGd8VVR6y2H.jpg">크게 보기</a>]</p><ul><li><p>롬 1:15–17</p></li><li><p>롬 5:17 – 6:14</p></li><li><p>롬 6:14 – 8:15</p></li><li><p>롬 8:15 – 11:35</p></li><li><p>롬 11:35 – 14:8</p></li><li><p>롬 14:9 – 15:11</p></li><li><p>롬 15:11 — 히 8:8</p></li><li><p>히 8:9 – 9:10</p></li><li><p>히 9:10–26</p></li><li><p>히 9:26 – 고전 2:3</p></li><li><p>고전 2:3 – 3:5</p></li><li><p>고전 3:6 – 고후 9:7</p></li><li><p>고후 9:7 – 끝까지, 엡, 갈 1:1 – 6:10</p></li><li><p>갈 6:10 — 끝, 빌, 골, 살전 1:1 – 2:3</p></li><li><p>살전 2:3 – 5:5</p></li><li><p>살전 5:5, 23–28</p></li><li><p>또한 아마: 살전 5:28 – 살후, 빌레몬서</p></li></ul><h3><a href="https://en.wikipedia.org/wiki/Papyrus_32">파피루스 32</a> — <a href="https://bibleox.com/ko/ko-nkrv/tit/1/#L11-15">딛 1:11-15</a>; <a href="https://bibleox.com/ko/ko-nkrv/tit/2/#L3-8">딛 2:3-8</a> (~200)</h3><img src="https://res.bibleox.com/s/img/image/simple/67c77f82dba7720001a4ab3c/s_p_37FYUloO3Px16M3p.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/67c77f82dba7720001a4ab3c/m_p_37FYUloO3Px16M3p.jpg">크게 보기</a>]</p><h3><a href="https://en.wikipedia.org/wiki/Papyrus_4">파피루스 4</a> — <a href="https://bibleox.com/ko/ko-nkrv/lk/1/#L58-59">눅 1:58-59</a>; 1:62–2:1; 2:6–7; 3:8–4:2; 4:29–32, 34–35; 5:3–8; 5:30–6:16 (175–250)</h3><img src="https://res.bibleox.com/s/img/image/simple/67c77ec9dba7720001a4ab3b/s_p_EOPj5ySHUxKuZhzv.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/67c77ec9dba7720001a4ab3b/m_p_EOPj5ySHUxKuZhzv.jpg">크게 보기</a>]</p><h3><a href="https://en.wikipedia.org/wiki/Papyrus_16">파피루스 16</a> — <a href="https://bibleox.com/ko/ko-nkrv/fil/3/#L10-17">빌 3:10-17</a>; <a href="https://bibleox.com/ko/ko-nkrv/fil/4/#L2-8">빌 4:2-8</a> (3세기)</h3><img src="https://res.bibleox.com/s/img/image/simple/67c77a33dba7720001a4ab36/s_p_ee63gtSd7dJORxL9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/67c77a33dba7720001a4ab36/m_p_ee63gtSd7dJORxL9.jpg">크게 보기</a>]</p><h3><a href="https://en.wikipedia.org/wiki/Papyrus_72">파피루스 72</a> — 베드로전서, 베드로후서, 유다서 (3~4세기)</h3><img src="https://res.bibleox.com/s/img/image/simple/67c77afddba7720001a4ab37/s_p_JCufSqhlLauLH7qF.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/67c77afddba7720001a4ab37/m_p_JCufSqhlLauLH7qF.jpg">크게 보기</a>]</p><h3><a href="https://en.wikipedia.org/wiki/Papyrus_78">파피루스 78</a> — <a href="https://bibleox.com/ko/ko-nkrv/iud/1/#L4-5,7-8">유 1:4-5,7-8</a> (3~4세기)</h3><img src="https://res.bibleox.com/s/img/image/simple/67c77be8dba7720001a4ab38/s_p_8xpMewUexRgW9gyK.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/67c77be8dba7720001a4ab38/m_p_8xpMewUexRgW9gyK.jpg">크게 보기</a>]</p><h2>4세기</h2><h3>시나이 사본(4세기 중엽)</h3><p><a href="https://codexsinaiticus.org/en/manuscript.aspx">https://codexsinaiticus.org/en/manuscript.aspx</a></p><img src="https://res.bibleox.com/s/img/image/simple/69037c86205184ec278d6e4f/s_p_k8XUyHVBOuyRjeGi.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69037c86205184ec278d6e4f/m_p_k8XUyHVBOuyRjeGi.jpg">크게 보기</a>]</p><h3>바티칸 사본(4세기 중엽, 다만 367년 이후일 수도 있음)</h3><p><a href="https://archive.org/details/CodexAlexandrinus/Codex-Vaticanus-NT/mode/2up">https://archive.org/details/CodexAlexandrinus/Codex-Vaticanus-NT/mode/2up</a></p><p><a href="https://digi.vatlib.it/view/MSS_Vat.gr.1209">https://digi.vatlib.it/view/MSS_Vat.gr.1209</a></p><img src="https://res.bibleox.com/s/img/image/simple/69037c61205184ec278d6e4e/s_p_mNcBEIlZjg4rJctE.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69037c61205184ec278d6e4e/m_p_mNcBEIlZjg4rJctE.jpg">크게 보기</a>]</p><h2>5세기</h2><h3>알렉산드리아 사본(5세기 전반)</h3><p><a href="https://archive.org/details/CodexAlexandrinus/Codex%20Alexandrinus">https://archive.org/details/CodexAlexandrinus/Codex%20Alexandrinus</a></p><img src="https://res.bibleox.com/s/img/image/simple/69037c31205184ec278d6e4d/s_p_nvIvhbabbnHZELvW.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69037c31205184ec278d6e4d/m_p_nvIvhbabbnHZELvW.jpg">크게 보기</a>]</p>'
