  path: Bu3i_Χριστιανικές_ταφές_και_επιγραφές
  title: Χριστιανικές ταφές και επιγραφές
  title_sub:
  body: '<h2>Επιγραφές στους τάφους των χριστιανών των πρώτων αιώνων</h2><p>Επιγραφές στην τρικλία της λεγόμενης «Memoria Apostolorum» στην Αππία Οδό, ενός ιερού που διαμορφώθηκε στα μέσα του 3ου αιώνα, μεταξύ 238 και 260. Τότε, τον 3ο αιώνα, άρχισαν να εμφανίζονται στην τρικλία χριστιανικές επιγραφές προσευχής όπως «<em>Paule ed Petre petite pro Victore</em>» και άλλες παρόμοιες (παρατίθενται παρακάτω). Συνέχισαν να τις χαράζουν έως την εποχή του Μεγάλου Κωνσταντίνου. [1]</p><img src="https://res.bibleox.com/s/img/image/simple/483/s_p_1D8zprHe86ZZn5O9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/483/m_p_1D8zprHe86ZZn5O9.jpg">μεγέθυνση</a>]</p><h3><strong>Έχετε στον νου σας, στις προσευχές σας </strong>(in mente habete, in orationibus vestris):</h3><p>12912: [Petre et] Paul[e] | in m[ente] abete in | ora[tion]ibus vestris/ — <strong>«Πέτρε και Παύλε, έχετε στον νου σας, στις προσευχές σας…»</strong></p><h3><strong>Πρεσβεύσατε </strong>(petite) (ή «προσευχηθείτε», «ζητήστε»)</h3><p>12918: [Paul]e et Petre petite | [pro] nobis omnibus/ — <strong>«Παύλε και Πέτρε, πρεσβεύσατε για όλους μας!»</strong></p><p>12931: Petr[e] et Pau[l]e petite | pro [Le]ontium / — <strong>«Πέτρε και Παύλε, πρεσβεύσατε για τον Λεόντιο!»</strong></p><p>12933: Pa[ul]e et Pet|re apetite pro Da|tivu in perpetu`u´m/ — <strong>«Παύλε και Πέτρε, πρεσβεύσατε για τον Δατίβο παντοτινά!»</strong></p><p>12989: Paule ed Petre petite | pro Victore/ — <strong>«Παύλε και Πέτρε, πρεσβεύσατε για τον Βίκτωρα!»</strong></p><p>12946: [Petre et Pa]ulae spir[ita sancta vestra petant pro - - -]/ — <strong>«Πέτρε και Παύλε, ας πρεσβεύσουν τα άγια πνεύματά σας για [- - -]!»</strong></p><h3><strong>conservate</strong> — <strong>προστατέψτε</strong> (ή «διαφυλάξτε»)</h3><p>12991: Petre et Paule cons[ervate - - -]/ — <strong>«Πέτρε και Παύλε, προστατέψτε [- - -]!»</strong></p><p>12996: sa[lva Paule et] | Petr[e - - - et] | Mart[yrium et] | conse[rvate in] | do[mino - - -]/ — <strong>«Σώσε, ω Παύλε και Πέτρε, [- - -] και τον Μαρτύριο, και προστατέψτε τους εν Κυρίω [- - -]!»</strong></p><p>13026: [- - - roga]mus | [conse]rvate nos [omnes]/ — <strong>«[- - -] παρακαλούμε, προστατέψτε μας όλους!»</strong></p><h3><strong>Απλές επικλήσεις</strong></h3><p>12909: Petr[e et Paule]/ — <strong>«Ω Πέτρε και Παύλε!»</strong></p><h3><strong>Βοήθεια για τους αμαρτωλούς</strong></h3><p>12967: Petre et Paule sub|venite Prim[o] | peccatori/ — <strong>«Πέτρε και Παύλε, ελάτε σε βοήθεια του Πρίμου, του αμαρτωλού!»</strong></p><h3><strong>Πολλές επικλήσεις είναι γραμμένες στα ελληνικά ή στα λατινικά με ελληνικά γράμματα</strong></h3><p>12927: Παῦλε {μ} καί | μου πατ|ρός/ — <strong>«Παύλε, (βοήθησε) και τον πατέρα μου!»</strong></p><p>12997: [Παυλ]ε ετ Πετ[ρε ιν μεν]/[τε ν]ος αβετε [ιν ορα]/[τι]ωνες βεστ[ρας]/ — <strong>«Παύλε και Πέτρε, έχετε στον νου σας, στις προσευχές σας…»</strong></p><p>13045: [Πα]υ[λε ετ Πετρε] | [ι]ν με[ντε αβετε] | Αὐφίδ[ιον υἱόν - - -] | μου/ — <strong>«Παύλε και Πέτρε, έχετε στον νου σας τον Αυφίδιο, τον γιο μου!»</strong></p><p>13069: Πέτρε Παίτρε μνημόνευαι | Τιμοκράτην καὶ Εὐ|τυχείαν κινα(?) καὶ | ἐσώρα(?) ++ [- - -]/ — <strong>«Πέτρε, Πέτρε, μνημόνευσε τον Τιμοκράτη και την Ευτυχία και (…) ++ [- - -]!»</strong></p><p>13045: [κομμ]ανδαμ[ους? - - -]/<strong> </strong>— <strong>«Εμπιστευόμαστε [- - -].»</strong></p><p>13049: Παῦλε καὶ Π[έτρε ἔχετε] / μνί[α]ς/ — <strong>«Παύλε και Πέτρε, έχετε μνεία [- - -]!»</strong></p><p>13055: [Παῦλε καὶ Πέτ]ρε εἰς μνε[ίαν] / [ἔχετε τὸν ᾿Ιρ]ίνες φίλι[ον]/ — <strong>«Παύλε και Πέτρε, μνημονεύσατε τον αγαπημένο της Ειρήνης.»</strong></p><p>13070: Παυλε Πετρε | Χαλκηδονι ανιμα | βωβυς κομαν|[δ]ω Λαυrους/ — <strong>«Παύλε και Πέτρε, εγώ ο Λαύρος (Λαυρούσιος;) σας εμπιστεύομαι την ψυχή του Χαλκηδονίου!»</strong></p><p>13071: &lt;Π&gt;α[ῦλ]ος καὶ | Π[έτρο]ς συν|τηρή[σα]τε θ(εο)ῦ δούλους | πνεύματα | ἅγεια συντη|ρήσαται ἡμᾶ|ς ἴνα πολλοῖς | ἔτεσε[ι ζῶμεν]/ — <strong>«Παύλε και Πέτρε, διαφυλάξτε τους δούλους του Θεού! Άγια πνεύματα, διαφυλάξτε μας, για να ζήσουμε πολλά χρόνια!»</strong></p><p>13073: [Παυλε] ετ Πετρε | [ιν με]ντε [ν]ος αβε|[τοτε εἰς το]ὺς ἐῶ[νας]/<strong> </strong>— <strong>«Παύλε και Πέτρε, έχετέ μας στον νου σας στους αιώνες…»</strong></p><h3><strong>promisit / votum fecit</strong> — <strong>έκανε τάμα</strong></h3><p>13091: [- - - i]dus m[- - -] | Eulogius votum f[ecit]/ — <strong>«[- - -] την [- - -] ημέρα των Ειδών [- - -] ο Ευλόγιος έκανε τάμα [- - -].»</strong></p><h3><strong>Αναφορές στο refrigerium</strong> (νεκρόδειπνο, μνημόσυνο γεύμα):</h3><p>12942: refrigerav[it] | [F]elicissimus cum s[uis]/ — <strong>«Ο Φηλικίσσιμος παρέθεσε γεύμα με τους δικούς του.»</strong></p><p>12981: Petro et Paulo | Tomius Coelius | refri`ger´&lt;i&gt;um feci/ — <strong>«Για τον Πέτρο και τον Παύλο εγώ, ο Τόμιος Κοίλιος, παρέθεσα γεύμα.»</strong></p><p>13003: [---] at Paulu[m] | et Pet[rum] | refri[geravi - - -]/ — <strong>«στου Παύλου και του Πέτρου παρέθεσα γεύμα.»</strong></p><p>Πηγή: <a href="http://csla.history.ox.ac.uk/record.php?recid=E05087">http://csla.history.ox.ac.uk/record.php?recid=E05087</a></p><hr><h3>Επικλήσεις προς τον Θεό</h3><ul><li><p>DEVS TE PRECOR VТ PARADISVM LVCIS POSSIT VIDERE – «<strong>Κύριε, σε παρακαλώ, να δει το φως του παραδείσου</strong>».</p></li><li><p>DOMINE NE QVANDO ADVMBRETVR SPIRITVS VENERES – «<strong>Κύριε, να μη σκοτισθεί ποτέ η ψυχή της Βενέρας</strong>».</p></li></ul><h3>Παράκληση προς τους κεκοιμημένους για πρεσβεία</h3><ul><li><p>ET IN ORATIONIS TVIS ROGES PRO NOBIS QVIA SCIMVS TE ☧ – «<strong>Στις προσευχές σου παρακάλεσε για εμάς, γιατί ξέρουμε ότι είσαι εν Χριστώ</strong>».</p></li><li><p>ORO SCIO NAMQVE BEATAM – «<strong>Σε παρακαλώ, γιατί ξέρω ότι είσαι στη μακαριότητα</strong>».</p></li><li><p>ORA PRO PARENTI BVS TVIS – «<strong>Προσευχήσου για τους δικούς σου</strong>».</p></li><li><p>PETE PRO NOS VТ SALVI SIMVS – «<strong>Προσευχήσου για εμάς, για να σωθούμε</strong>».</p></li><li><p>IN ORATIONIS TVIS ROGES PRO NOBIS – «<strong>Στις προσευχές σου ζήτησε για εμάς</strong>».</p></li><li><p>ATTICE SPIRITVS TVS IN BONV ORA PRO PARENTIBVS TVIS – «<strong>Αττικέ, η ψυχή σου είναι στη μακαριότητα· προσευχήσου για τους δικούς σου</strong>».</p></li></ul><p>Παρατίθεται μόνο ένα μέρος. Το υπόλοιπο υλικό υπάρχει στον σύνδεσμο.</p><h3><strong>Επιγραφές και συμβολικές παραστάσεις</strong></h3><ul><li><p>Η λέξη VIVAS, δηλαδή «<strong>ζήσε</strong>», που επίσης γράφεται πολύ συχνά στους τάφους, εκφράζει την ευχή για αιώνια ζωή και μακαριότητα του κεκοιμημένου·</p></li><li><p>VIVAS IN DEO – «<strong>ζήσε εν Θεώ</strong>».</p></li><li><p>VIBAS IN SANCTIS – «<strong>ζήσε ανάμεσα στους αγίους</strong>».</p></li></ul><h3>Ο κεκοιμημένος έφτασε στη σωτηρία</h3><p>Μερικές φορές λέγεται πιο καταφατικά ότι ο ενταφιασμένος είναι ανάμεσα στους εκλεκτούς:</p><ul><li><p>ACCEPIT REQVI EM IN DEO – «<strong>Βρήκε ανάπαυση εν Θεώ</strong>».</p></li><li><p>SCIMVS ТЕ IN – «<strong>Ξέρουμε ότι είσαι εν Χριστώ</strong>».</p></li><li><p>FRVCTVOSVS ANIMA ТVА СVМ IVSTIS – «<strong>Φρουκτουόσε, η ψυχή σου είναι μαζί με τους δικαίους</strong>».</p></li><li><p>REQVI EM ADCEPIT IN DEO PATRE NOSTRO ET CHRISTO EIVS – «<strong>Βρήκε ανάπαυση εν Θεώ Πατρί ημών και εν τω Χριστώ αυτού</strong>».</p></li><li><p>ACCEPTA APVD DEVM – «<strong>Δεκτή στον Θεό (για γυναίκα)</strong>».</p></li><li><p>RECEPTVS AD DEVM – «<strong>Προσλήφθηκε στον Θεό</strong>».</p></li><li><p>ТЕСVМ PAX CHRISTI – «<strong>η ειρήνη του Χριστού μαζί σου</strong>».</p></li><li><p>SEMPER VIVE IN РАСЕ – «<strong>Ζήσε πάντα εν ειρήνη</strong>».</p></li><li><p>IN РАСЕ ET IN DOMO AETERNA DEI – «<strong>Εν ειρήνη και στον αιώνιο οίκο του Θεού</strong>».</p></li><li><p>VIVI IN GLORIA DEI ET IN PACE DOMINI NOSTRI ☧ – «<strong>Ζεις στη δόξα του Θεού και στην ειρήνη του Κυρίου μας Χριστού</strong>»· εδώ το όνομα του Σωτήρος σημειώνεται με το μονόγραμμά Του ☧·</p></li><li><p>Το ELATVS EST, επίσης ένα είδος επιφωνήματος που απαντά μόνο μία ή δύο φορές, μπορεί να αποδοθεί: «<strong>ανυψώθηκε στον Θεό</strong>».</p></li></ul><h3>Ο παράδεισος — τόπος φωτός</h3><p>Στις επιτύμβιες επιγραφές των πρώτων χριστιανών ο παράδεισος ονομάζεται τόπος φωτός και λάμψης· ιδού μερικά παραδείγματα:</p><ul><li><p>CVIVS SPIRITVS IN LVCE DOMINI SVSCEPTVS EST – «<strong>Η ψυχή του έγινε δεκτή στο φως του Κυρίου</strong>».</p></li><li><p>IN CHRISTVM CREDENS PREMIA LVCIS АВЕТ – «<strong>Πιστεύοντας στον Χριστό, έχει ως βραβείο το φως</strong>».</p></li><li><p>AETERNA TIBI LUX TIMOTHEA IN ☧– «<strong>Αιώνιο φως σε σένα, Τιμοθέα, εν (Χριστώ)</strong>».</p></li></ul><h3></h3><p>Βιβλίο (στα ρωσικά): <strong>A. von Fricken. Οι ρωμαϊκές κατακόμβες και τα μνημεία της πρώτης χριστιανικής τέχνης. Μόσχα: K. T. Soldatenkov, 1872–1885.</strong> [2]</p>'
