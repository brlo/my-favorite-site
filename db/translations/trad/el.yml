  body: '<h2>2ος αιώνας</h2><h3><a href="https://ru.wikipedia.org/wiki/%D0%9F%D0%B0%D0%BF%D0%B8%D1%80%D1%83%D1%81_52">Πάπυρος 52</a> — <a href="https://bibleox.com/el/gr-lxx-byz/in/18/#L31-33,37-38">Ιω 18:31-33,37-38</a> (~150)</h3><img src="https://res.bibleox.com/s/img/image/simple/67c76e30dba7720001a4ab31/s_p_k5TLeFzzlkF84GaN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/67c76e30dba7720001a4ab31/m_p_k5TLeFzzlkF84GaN.jpg">μεγέθυνση</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/67c77746dba7720001a4ab32/s_p_redMnT8D34cxZOYL.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/67c77746dba7720001a4ab32/m_p_redMnT8D34cxZOYL.jpg">μεγέθυνση</a>]</p><h3><a href="https://en.wikipedia.org/wiki/Papyrus_90">Πάπυρος 90</a> — <a href="https://bibleox.com/el/gr-lxx-byz/in/18/#L36-40">Ιω 18:36-40</a>; <a href="https://bibleox.com/el/gr-lxx-byz/in/19/#L1-7">Ιω 19:1-7</a> (~150)</h3><img src="https://res.bibleox.com/s/img/image/simple/67c7784edba7720001a4ab33/s_p_H1o3KGBYNI9sl2F9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/67c7784edba7720001a4ab33/m_p_H1o3KGBYNI9sl2F9.jpg">μεγέθυνση</a>]</p><h3><a href="https://en.wikipedia.org/wiki/Papyrus_104">Πάπυρος 104</a> — <a href="https://bibleox.com/el/gr-lxx-byz/mf/21/#L34-37">Μτ 21:34-37</a>; <a href="https://bibleox.com/el/gr-lxx-byz/mf/21/#L43-44">Μτ 21:43-44</a> (~150)</h3><img src="https://res.bibleox.com/s/img/image/simple/67c778a6dba7720001a4ab34/s_p_J8MmDkwHjJgq0wEA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/67c778a6dba7720001a4ab34/m_p_J8MmDkwHjJgq0wEA.jpg">μεγέθυνση</a>]</p><h3><a href="https://en.wikipedia.org/wiki/Papyrus_98">Πάπυρος 98</a> — <a href="https://bibleox.com/el/gr-lxx-byz/otkr/1/#L13-20">Απ 1:13-20</a>; <a href="https://bibleox.com/el/gr-lxx-byz/otkr/2/#L1">Απ 2:1</a> (~150–250)</h3><img src="https://res.bibleox.com/s/img/image/simple/67c779a2dba7720001a4ab35/s_p_rPG5aCVLBBw75jo3.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/67c779a2dba7720001a4ab35/m_p_rPG5aCVLBBw75jo3.jpg">μεγέθυνση</a>]</p><h2>3ος αιώνας</h2><h3><a href="https://en.wikipedia.org/wiki/Papyrus_75">Πάπυρος 75</a> — <a href="https://bibleox.com/el/gr-lxx-byz/lk/3/#L18">Λκ 3:18</a> — 24:53; <a href="https://bibleox.com/el/gr-lxx-byz/in/1/#L1">Ιω 1:1</a> — 15:8 (175–225)</h3><img src="https://res.bibleox.com/s/img/image/simple/67c77d00dba7720001a4ab3a/s_p_9dXrKwGPywze2DAo.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/67c77d00dba7720001a4ab3a/m_p_9dXrKwGPywze2DAo.jpg">μεγέθυνση</a>]</p><h3><a href="https://en.wikipedia.org/wiki/Papyrus_46">Πάπυρος 46</a> — Ρωμ, Εβρ, Α Κορ, Β Κορ, Εφ, Γαλ, Φιλ, Κολ, Α Θεσ (~175–225)</h3><img src="https://res.bibleox.com/s/img/image/simple/6915b056205184ec278d6e7f/s_p_lPe15bGd8VVR6y2H.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6915b056205184ec278d6e7f/m_p_lPe15bGd8VVR6y2H.jpg">μεγέθυνση</a>]</p><ul><li><p>Ρωμ 1:15–17</p></li><li><p>Ρωμ 5:17 – 6:14</p></li><li><p>Ρωμ 6:14 – 8:15</p></li><li><p>Ρωμ 8:15 – 11:35</p></li><li><p>Ρωμ 11:35 – 14:8</p></li><li><p>Ρωμ 14:9 – 15:11</p></li><li><p>Ρωμ 15:11 — Εβρ 8:8</p></li><li><p>Εβρ 8:9 – 9:10</p></li><li><p>Εβρ 9:10–26</p></li><li><p>Εβρ 9:26 – Α Κορ 2:3</p></li><li><p>Α Κορ 2:3 – 3:5</p></li><li><p>Α Κορ 3:6 – Β Κορ 9:7</p></li><li><p>Β Κορ 9:7 – έως το τέλος, Εφ, Γαλ 1:1 – 6:10</p></li><li><p>Γαλ 6:10 — τέλος, Φιλ, Κολ, Α Θεσ 1:1 – 2:3</p></li><li><p>Α Θεσ 2:3 – 5:5</p></li><li><p>Α Θεσ 5:5, 23–28</p></li><li><p>Επίσης ίσως: Α Θεσ 5:28 – Β Θεσ, Φιλήμονα</p></li></ul><h3><a href="https://en.wikipedia.org/wiki/Papyrus_32">Πάπυρος 32</a> — <a href="https://bibleox.com/el/gr-lxx-byz/tit/1/#L11-15">Τιτ 1:11-15</a>; <a href="https://bibleox.com/el/gr-lxx-byz/tit/2/#L3-8">Τιτ 2:3-8</a> (~200)</h3><img src="https://res.bibleox.com/s/img/image/simple/67c77f82dba7720001a4ab3c/s_p_37FYUloO3Px16M3p.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/67c77f82dba7720001a4ab3c/m_p_37FYUloO3Px16M3p.jpg">μεγέθυνση</a>]</p><h3><a href="https://en.wikipedia.org/wiki/Papyrus_4">Πάπυρος 4</a> — <a href="https://bibleox.com/el/gr-lxx-byz/lk/1/#L58-59">Λκ 1:58-59</a>; 1:62–2:1; 2:6–7; 3:8–4:2; 4:29–32, 34–35; 5:3–8; 5:30–6:16 (175–250)</h3><img src="https://res.bibleox.com/s/img/image/simple/67c77ec9dba7720001a4ab3b/s_p_EOPj5ySHUxKuZhzv.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/67c77ec9dba7720001a4ab3b/m_p_EOPj5ySHUxKuZhzv.jpg">μεγέθυνση</a>]</p><h3><a href="https://en.wikipedia.org/wiki/Papyrus_16">Πάπυρος 16</a> — <a href="https://bibleox.com/el/gr-lxx-byz/fil/3/#L10-17">Φιλ 3:10-17</a>; <a href="https://bibleox.com/el/gr-lxx-byz/fil/4/#L2-8">Φιλ 4:2-8</a> (3ος αι.)</h3><img src="https://res.bibleox.com/s/img/image/simple/67c77a33dba7720001a4ab36/s_p_ee63gtSd7dJORxL9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/67c77a33dba7720001a4ab36/m_p_ee63gtSd7dJORxL9.jpg">μεγέθυνση</a>]</p><h3><a href="https://en.wikipedia.org/wiki/Papyrus_72">Πάπυρος 72</a> — Α΄ Πέτρου, Β΄ Πέτρου, Ιούδα (3ος–4ος αι.)</h3><img src="https://res.bibleox.com/s/img/image/simple/67c77afddba7720001a4ab37/s_p_JCufSqhlLauLH7qF.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/67c77afddba7720001a4ab37/m_p_JCufSqhlLauLH7qF.jpg">μεγέθυνση</a>]</p><h3><a href="https://en.wikipedia.org/wiki/Papyrus_78">Πάπυρος 78</a> — <a href="https://bibleox.com/el/gr-lxx-byz/iud/1/#L4-5,7-8">Ιούδα 1:4-5,7-8</a> (3ος–4ος αι.)</h3><img src="https://res.bibleox.com/s/img/image/simple/67c77be8dba7720001a4ab38/s_p_8xpMewUexRgW9gyK.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/67c77be8dba7720001a4ab38/m_p_8xpMewUexRgW9gyK.jpg">μεγέθυνση</a>]</p><h2>4ος αιώνας</h2><h3>Σιναϊτικός κώδικας (μέσα 4ου αιώνα)</h3><p><a href="https://codexsinaiticus.org/en/manuscript.aspx">https://codexsinaiticus.org/en/manuscript.aspx</a></p><img src="https://res.bibleox.com/s/img/image/simple/69037c86205184ec278d6e4f/s_p_k8XUyHVBOuyRjeGi.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69037c86205184ec278d6e4f/m_p_k8XUyHVBOuyRjeGi.jpg">μεγέθυνση</a>]</p><h3>Βατικανός κώδικας (μέσα 4ου αιώνα, αλλά ίσως και μετά το 367)</h3><p><a href="https://archive.org/details/CodexAlexandrinus/Codex-Vaticanus-NT/mode/2up">https://archive.org/details/CodexAlexandrinus/Codex-Vaticanus-NT/mode/2up</a></p><p><a href="https://digi.vatlib.it/view/MSS_Vat.gr.1209">https://digi.vatlib.it/view/MSS_Vat.gr.1209</a></p><img src="https://res.bibleox.com/s/img/image/simple/69037c61205184ec278d6e4e/s_p_mNcBEIlZjg4rJctE.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69037c61205184ec278d6e4e/m_p_mNcBEIlZjg4rJctE.jpg">μεγέθυνση</a>]</p><h2>5ος αιώνας</h2><h3>Αλεξανδρινός κώδικας (πρώτο μισό του 5ου αιώνα)</h3><p><a href="https://archive.org/details/CodexAlexandrinus/Codex%20Alexandrinus">https://archive.org/details/CodexAlexandrinus/Codex%20Alexandrinus</a></p><img src="https://res.bibleox.com/s/img/image/simple/69037c31205184ec278d6e4d/s_p_nvIvhbabbnHZELvW.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69037c31205184ec278d6e4d/m_p_nvIvhbabbnHZELvW.jpg">μεγέθυνση</a>]</p>'
