- src: 2NCD_Постная_кухня
  path: Lc4k_Νηστίσιμη_κουζίνα
  title: Νηστίσιμη κουζίνα
  title_sub:
  body: '<p>Το άρθρο αυτό περιγράφει μόνο σύντομα πώς είναι η νηστίσιμη διατροφή, για να βοηθήσει να προσανατολιστεί όποιος δεν έχει νηστέψει πριν, δεν έχει συνηθίσει να μαγειρεύει νηστίσιμα και δεν ξέρει τι θα μπορούσε να ετοιμάσει στη νηστεία.</p><blockquote><p>«ἀποκριθεὶς δὲ εἶπεν αὐτῇ ὁ κύριος, Μάρθα Μάρθα, μεριμνᾷς καὶ θορυβάζῃ περὶ πολλά, ἑνὸς δέ ἐστιν χρεία· Μαριὰμ γὰρ τὴν ἀγαθὴν μερίδα ἐξελέξατο ἥτις οὐκ ἀφαιρεθήσεται αὐτῆς» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/10/#L41-42">Λκ 10:41-42</a>)</p></blockquote><blockquote><p>«Προσέχετε δὲ ἑαυτοῖς μήποτε βαρηθῶσιν ὑμῶν αἱ καρδίαι ἐν κραιπάλῃ καὶ μέθῃ καὶ μερίμναις βιωτικαῖς, καὶ ἐπιστῇ ἐφ᾿ ὑμᾶς αἰφνίδιος ἡ ἡμέρα ἐκείνη» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/21/#L34">Λκ 21:34</a>)</p></blockquote><h2>Σούπες</h2><h3>Σούπες με ζωμό λαχανικών (με τσιγαρισμένο κρεμμύδι και καρότο)</h3><p>Σχεδόν παντού ταιριάζει να προσθέσετε πατάτα:</p><ul><li><p><strong>σούπες με δημητριακά</strong> (φαγόπυρο, ρύζι, κριθάρι, φακές, μπιζέλια),</p></li><li><p><strong>σούπες με ζυμαρικά</strong>,</p></li><li><p><strong>χορτόσουπες</strong>,</p></li><li><p><strong>μπορς</strong> (σούπα με παντζάρι),</p></li><li><p><strong>ρασόλνικ</strong> (σούπα με αγγουράκια τουρσί),</p></li><li><p><strong>στσι</strong> (λαχανόσουπα),</p></li><li><p><strong>ουχά</strong> (ψαρόσουπα, όταν το τυπικό επιτρέπει ψάρι).</p></li></ul><h2>Συνοδευτικά</h2><ul><li><p><strong>βρώμη</strong> (νιφάδες),</p></li><li><p><strong>βραστό</strong> ρύζι, φαγόπυρο, φακές, κους κους, πλιγούρι, κινόα, πολέντα (χυλός από καλαμποκάλευρο) και άλλα δημητριακά. Ταιριάζει να προσθέσετε τσιγαρισμένο κρεμμύδι και καρότο.</p></li><li><p><strong>πιλάφι</strong> (για να χορταίνει περισσότερο, μπορείτε να βάλετε ρεβίθια),</p></li><li><p><strong>μείγματα με βραστό ρύζι</strong>: χαβανέζικο, μεξικάνικο κ.λπ.</p></li><li><p><strong>ζυμαρικά</strong>: βραστά, προτσιγαρισμένα, με μανιτάρια, με ψάρι κονσέρβα (τόνο, σαρδέλα κ.λπ., όταν το επιτρέπει το τυπικό)</p></li><li><p><strong>πατάτες</strong>: τηγανητές, ψητές, βραστές, πουρές,</p></li><li><p><strong>λάχανο στιφάδο</strong>,</p></li><li><p><strong>λαχανικά γιαχνί</strong>: πατάτα, καρότο, κρεμμύδι, κολοκυθάκι, πιπεριά, μανιτάρια, πελτές ή ντομάτα, μελιτζάνα,</p></li><li><p><strong>βραστά λαχανικά</strong> (κουνουπίδι, μπρόκολο, αρακάς, καλαμπόκι),</p></li><li><p><strong>βαρένικι</strong> (βραστά πιροσκί): με πατάτα, μανιτάρια, κεράσια,</p></li><li><p><strong>τόφου</strong>,</p></li><li><p><strong>ρεβίθια με λαχανικά</strong>,</p></li><li><p><strong>μανιτάρια</strong> τσιγαριστά,</p></li><li><p><strong>κολοκυθάκια</strong> τηγανητά,</p></li><li><p><strong>ντράνικι</strong> (τηγανίτες από τριμμένη πατάτα ή κολοκυθάκι, ρυζάλευρο ή αλεύρι σίτου, αλάτι),</p></li><li><p><strong>ρατατούι</strong>,</p></li><li><p><strong>ψητή κολοκύθα</strong>,</p></li><li><p><strong>λαχανικά στη σχάρα</strong>,</p></li><li><p><strong>κεφτέδες λαχανικών</strong> (από φασόλια).</p></li></ul><h2>Σαλάτες</h2><ul><li><p><strong>με φρέσκα λαχανικά</strong>: αγγούρι, ντομάτα, φρέσκο λάχανο, κόκκινο κρεμμύδι, μαρούλι, πιπεριά, μυρωδικά, μπαχαρικά,</p></li><li><p><strong>με βραστά λαχανικά</strong>: βινεγκρέτ (πατάτα, παντζάρι, καρότο, φασόλια, αρακάς κονσέρβα, αγγουράκια τουρσί, κρεμμύδι, ξινολάχανο),</p></li><li><p><strong>σαλάτα με κινέζικο λάχανο</strong>: κινέζικο λάχανο, καλαμπόκι, νηστίσιμη μαγιονέζα[1],</p></li><li><p><strong>βραστό παντζάρι</strong> με νηστίσιμη μαγιονέζα[1],</p></li><li><p><strong>φρουτοσαλάτα</strong>,</p></li><li><p><strong>σαλάτα με αβοκάντο</strong>,</p></li></ul><h2>Τουρσιά</h2><ul><li><p><strong>ξινολάχανο</strong>,</p></li><li><p><strong>αγγουράκια</strong> τουρσί, ελαφρά αλατισμένα, χτυπητά,</p></li><li><p><strong>καρότο</strong> κορεάτικο,</p></li><li><p><strong>κρεμμύδι</strong> μαριναρισμένο σε ξίδι,</p></li><li><p>κ.λπ.</p></li></ul><h2>Αρτοσκευάσματα</h2><ul><li><p><strong>ψωμί</strong>,</p></li><li><p><strong>νηστίσιμα ψωμάκια</strong>: ψήνονται στον φούρνο, στο τηγάνι ή αγοράζονται έτοιμα,</p></li><li><p><strong>πιροσκί με γέμιση</strong>: με κεράσια, λάχανο, πατάτα και κρεμμύδι,</p></li><li><p><strong>νηστίσιμες κρέπες</strong> (νερό αντί για γάλα, μπανάνες αντί για αυγά),</p></li></ul><h2>Κονσέρβες</h2><ul><li><p><strong>αλοιφή</strong> <strong>κολοκυθιού</strong> (ρωσικό «χαβιάρι» λαχανικών),</p></li><li><p><strong>μελιτζανοσαλάτα</strong> <strong>(«χαβιάρι»)</strong>,</p></li><li><p><strong>χούμους</strong>,</p></li><li><p><strong>καλαμπόκι</strong>,</p></li><li><p><strong>μανιτάρια</strong>,</p></li><li><p><strong>φασόλια</strong>,</p></li><li><p><strong>αρακάς</strong>,</p></li><li><p><strong>λιαστές ντομάτες</strong>,</p></li><li><p><strong>γκουακαμόλε</strong> χωρίς τυρί,</p></li></ul><h2>Αποξηραμένα φρούτα και ξηροί καρποί</h2><ul><li><p><strong>ξηροί καρποί</strong>,</p></li><li><p><strong>μούρα και φρούτα</strong> αποξηραμένα ή λυοφιλοποιημένα,</p></li><li><p><strong>χαλβάς</strong>,</p></li></ul><h2>Σάντουιτς και σνακ</h2><ul><li><p>ψωμί με μέλι,</p></li><li><p>ψωμί με ντομάτα, βασιλικό και αλάτι.</p></li></ul><h2>Ποτά</h2><ul><li><p>Κβας (ποτό από ζύμωση ψωμιού)</p></li><li><p>Κισέλ (πηχτό ποτό φρούτων με άμυλο)</p></li><li><p>Κομπόστα (από φρέσκα μούρα ή αποξηραμένα φρούτα)</p></li><li><p>Μορς (ποτό από χυμό μούρων)</p></li><li><p>Smoothies</p></li><li><p>Λεμονάδα</p></li><li><p>Τσάι</p></li><li><p>Καφές χωρίς γάλα</p></li><li><p>Νερό</p></li></ul>'
  references: "<ol><li><p><strong>Νηστίσιμη μαγιονέζα</strong>: το υγρό από αρακά κονσέρβα, φυτικό λάδι, μουστάρδα, αλάτι, ζάχαρη, ξίδι. Χτυπήστε στο μπλέντερ.</p></li></ol><p>Μετάφραση από τα ρωσικά: Ροντιόν Βλάσοφ, με τη βοήθεια τεχνητής νοημοσύνης. Τα βιβλικά χωρία παρατίθενται στο πρωτότυπο.</p>"
