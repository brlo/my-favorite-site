- src: Древние_христианские_храмы
  path: Ch2c_Αρχαίοι_χριστιανικοί_ναοί
  title: Αρχαίοι χριστιανικοί ναοί
  title_sub:
  body: '<h2>Μότο</h2><blockquote><p>«καί τινες τῶν Φαρισαίων ἀπὸ τοῦ ὄχλου εἶπαν πρὸς αὐτόν, Διδάσκαλε, ἐπιτίμησον τοῖς μαθηταῖς σου. καὶ ἀποκριθεὶς εἶπεν, Λέγω ὑμῖν, <strong>ἐὰν οὗτοι σιωπήσουσιν, οἱ λίθοι κράξουσιν</strong>» (<a href="https://bibleox.com/el/gr-lxx-byz/lk/19/#L39-40">Λκ 19:39-40</a>)</p></blockquote><h2>3ος αιώνας</h2><h3>Ναός κοντά στην αρχαία πόλη Μεγιδδώ, στον οικισμό <a href="https://he.wikipedia.org/wiki/%D7%9C%D7%92%D7%99%D7%95">Legio</a> (περ. 230)</h3><p>Στους αρχαίους χριστιανικούς ναούς η Αγία Τράπεζα βρισκόταν συχνά στο κέντρο. Αυτός ο ναός είναι χαρακτηριστικό παράδειγμα.</p><p>Κοντά στην πόλη Μεγιδδώ (στην αρχαιότητα υπήρχε εκεί ο οικισμός <a href="https://he.wikipedia.org/wiki/%D7%9C%D7%92%D7%99%D7%95">Legio</a>, επειδή εκεί στάθμευε ρωμαϊκή λεγεώνα). Στο ύψωμα του οικισμού υπήρχε ένα κτίριο που χρονολογήθηκε, από τα νομίσματα, την κεραμική και τη γραφή, στο 230. Ένας από τους χώρους του ήταν χριστιανικός ναός. Στο δάπεδο υπάρχουν αρκετά μεγάλα ψηφιδωτά με επιγραφές (μία από αυτές ονομάζει τον Χριστό Θεό), και στο κέντρο βρίσκεται η Αγία Τράπεζα. Δίπλα υπάρχει επιγραφή για το ποιος δώρισε αυτή την τράπεζα.</p><img src="https://res.bibleox.com/s/img/image/simple/692c58f9205184ec278d6f97/s_p_aZ3NifF9BW3oqZ1a.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c58f9205184ec278d6f97/m_p_aZ3NifF9BW3oqZ1a.jpg">μεγέθυνση</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/692c587d205184ec278d6f91/s_p_MvOQRFKiCv6XaXOd.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c587d205184ec278d6f91/m_p_MvOQRFKiCv6XaXOd.jpg">μεγέθυνση</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/692c58ee205184ec278d6f96/s_p_5wNRtqyrpQivbBim.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c58ee205184ec278d6f96/m_p_5wNRtqyrpQivbBim.jpg">μεγέθυνση</a>] [<a href="https://res.bibleox.com/s/img/image/simple/692c58e0205184ec278d6f95/m_p_FQvEfj70dP7967X3.jpg">επιπλέον φωτογραφία 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/692c58ce205184ec278d6f94/m_p_9xoiCsqROihBYnL0.jpg">επιπλέον φωτογραφία 3</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/692c58b5205184ec278d6f93/s_p_Cvww0C8ZGmbqJS7a.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c58b5205184ec278d6f93/m_p_Cvww0C8ZGmbqJS7a.jpg">μεγέθυνση</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/692c5882205184ec278d6f92/s_p_WU59e3c2XbPWkdaM.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c5882205184ec278d6f92/m_p_WU59e3c2XbPWkdaM.jpg">μεγέθυνση</a>]</p><p><strong>Επιγραφές:</strong></p><p>Όλες οι επιγραφές στο δάπεδο του ναού είναι ένα είδος <strong>διπτύχων μνημόσυνου</strong>. Από την αρχαιότητα έως σήμερα στους ναούς της Ορθόδοξης Εκκλησίας υπάρχει η παράδοση να μνημονεύονται πάντα στις ακολουθίες τα ονόματα εκείνων που έκτισαν τον ναό ή δώρισαν κάτι σημαντικό. Έτσι και εδώ, με την προτροπή να μνημονεύονται, καταγράφονται τα ονόματα εκείνων που δώρισαν το ψηφιδωτό δάπεδο (ο εκατόνταρχος Γαϊανός Πορφύριος), που το έστρωσαν (Βρούτιος), που δώρισαν την Αγία Τράπεζα (Ακεπτούς), καθώς και μερικά άλλα ονόματα, ίσως συγγενών των δωρητών: Πριμίλλα, Κυριακή, Δωροθέα, Χρηστή. Με τον ίδιο τρόπο προσφέρονταν και ιερά σκεύη στη μνήμη ζώντων και κεκοιμημένων: ευχαριστιακά δισκοπότηρα και θυμιατά (<a href="https://bibleox.com/ru/ru/w/%D0%B4%D1%80%D0%B5%D0%B2%D0%BD%D0%B8%D0%B5-%D0%B8%D0%BA%D0%BE%D0%BD%D1%8B#HH-%D0%95%D0%B2%D1%85%D0%B0%D1%80%D0%B8%D1%81%D1%82%D0%B8%D1%87%D0%B5%D1%81%D0%BA%D0%B8%D0%B5-%D1%87%D0%B0%D1%88%D0%B8-%D0%B8-%D0%BA%D0%B0%D0%B4%D0%B8%D0%BB%D0%B0-%D1%81-%D0%B8%D0%BA%D0%BE%D0%BD%D0%B0%D0%BC%D0%B8-%D0%92%D0%B8%D0%B7%D0%B0%D0%BD%D1%82%D0%B8%D1%8F-%D0%A1%D0%B8%D1%80%D0%B8%D1%8F-%D0%90%D1%82%D1%82%D0%B0%D1%80%D1%83%D1%82%D0%B8">περισσότερα</a>).</p><blockquote><p>Απόδοση: Η φιλόθεος Ακεπτούς πρόσφερε την τράπεζα στον Θεό Ιησού Χριστό ως μνημόσυνο.</p></blockquote><blockquote><p>EN: Akeptous, the God-loving, offered the table to God Jesus Christ as a memorial.</p></blockquote><blockquote><p>Transcription: <strong>Prosēniken Akeptous, ē philotheos, tēn trapezan Th(e)ō Ι(ēso)u Ch(rist)ō mnēmosunon.</strong></p></blockquote><blockquote><p>Orig: <strong>ΠΡΟСΗΝΙΚΕΝ ΑΚΕΠΤΟΥС, Η ΦΙΛΟΘΕΟС, ΤΗΝ ΤΡΑΠΕΖΑΝ Θ(Ε)Ω Ι(ΗСΟ)Υ Χ(ΡΙСΤ)Ω ΜΝΗΜΟСΥΝΟΝ</strong></p></blockquote><blockquote><p>ΠΡΟϹΗΝΙΚΕΝ</p><p>ΑΚΕΠΤΟΥϹ,</p><p>Η ΦΙΛΟΘΕΟϹ,</p><p>ΤΗΝ ΤΡΑΠΕ-</p><p>ZΑΝ <strong>{ΘW} {ΙΥ} {ΧW}*</strong></p><p>ΜΝΗΜΟϹΥΝΟΝ</p></blockquote><p>*Nomina sacra (συντομογραφίες ιερών ονομάτων): <strong>ΘW ΙΥ ΧW</strong> = θεῷ Ἰησοῦ Χριστῷ = στον Θεό Ιησού Χριστό</p><img src="https://res.bibleox.com/s/img/image/simple/692c5df3205184ec278d6f9a/s_p_swifwBDbtzgImkZ6.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c5df3205184ec278d6f9a/m_p_swifwBDbtzgImkZ6.jpg">μεγέθυνση</a>]</p><hr><blockquote><p>ΕΝ: Remember Primilla and Cyriaca and Dorothea, and moreover also Chreste.</p></blockquote><blockquote><p>Απόδοση: Μνημονεύσατε την Πριμίλλα και την Κυριακή και τη Δωροθέα, και ακόμη τη Χρηστή.</p></blockquote><blockquote><p>Orig: <strong>ΜΝΗΜΟΝΕΥСΑΤΕ ΠΡΙΜΙΛΛΗС ΚΑΙ ΚΥΡΙΑΚΗС ΚΑΙ ΔWΡΟΘΕΑС ΕΤΙ ΔΕ ΚΑΙ ΧΡΗСΤΗ</strong></p></blockquote><blockquote><p>Fixed: <strong>ΜΝΗΜΟΝΕΥСΑΤΕ ΠΡΙΜΙΛΛΗС ΚΑΙ ΚΥΡΙΑΚΗΣ ΚΑΙ ΔΩΡΟΘΕΑΣ ΕΤΙ ΔΕ ΚΑΙ ΧΡΗΣΤΗ</strong></p></blockquote><img src="https://res.bibleox.com/s/img/image/simple/692c5dec205184ec278d6f99/s_p_LVbgKrKO7P3dfEJP.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c5dec205184ec278d6f99/m_p_LVbgKrKO7P3dfEJP.jpg">μεγέθυνση</a>]</p><hr><blockquote><p>Απόδοση: Ο Γαϊανός, ο και Πορφύριος, εκατόνταρχος, ο αδελφός μας, με δικά του έξοδα και με μεγάλη γενναιοδωρία έστρωσε αυτό το δάπεδο. Ο Βρούτιος εκτέλεσε το έργο.</p></blockquote><blockquote><p>EN: Gaianus, also called Porphyrius, centurion (xp), our brother, has made the pavement at his own expense as an act of liberality. Brutius has carried out the work.</p></blockquote><blockquote><p>Orig: <strong>ΓΑΙΑΝΟС Ο ΚΑ ΠΟΡΦΥΡΙС ΧΡ* ΑΔΕΛΦΟС ΗΜWΝ ΕΚ ΦΙΛΟΤΕ ΙΜΙС ΑΜΕΝ ΟСΕΚΤW ΝΙΔΙWΝ ΕΨΙ ΦΟΛΟΓΗСΕΝ. ΒΡΟVΤΙС ΗΡΓΑСΑΤΟ.</strong></p></blockquote><blockquote><p>Fixed: <strong>ΓΑΙΑΝΟΣ Ο ΚΑ ΠΟΡΦΥΡΙΣ ΧΡ* ΑΔΕΛΦΟΣ ΗΜΩΝ ΕΚ ΦΙΛΟΤΕ ΙΜΙΣ ΑΜΕΝ ΟΣΕΚΤΩ ΝΙΔΙΩΝ ΕΨΙ ΦΟΛΟΓΗΣΕΝ. ΒΡΟΥΤΙΣ ΗΡΓΑΣΑΤΟ.</strong></p></blockquote><p><strong>*ΧΡ — hekatontarches — centurio</strong></p><img src="https://res.bibleox.com/s/img/image/simple/692c5e27205184ec278d6f9b/s_p_Qk321JfFTD4dDmnd.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c5e27205184ec278d6f9b/m_p_Qk321JfFTD4dDmnd.jpg">μεγέθυνση</a>]</p><h3>Ο ναός στη Δούρα-Ευρωπό (Συρία)</h3><p>244: ο χριστιανικός ναός στη Δούρα-Ευρωπό</p><img src="https://res.bibleox.com/s/img/image/simple/6931880c205184ec278d6fa6/s_p_DFnp7s0vcTbXb3Qn.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931880c205184ec278d6fa6/m_p_DFnp7s0vcTbXb3Qn.jpg">μεγέθυνση</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/69318806205184ec278d6fa5/s_p_PuUKcoZEfAVSlPNM.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69318806205184ec278d6fa5/m_p_PuUKcoZEfAVSlPNM.jpg">μεγέθυνση</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/69318802205184ec278d6fa4/s_p_MF4zgk1ySUOBpqnG.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69318802205184ec278d6fa4/m_p_MF4zgk1ySUOBpqnG.jpg">μεγέθυνση</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/414/s_p_UgKueSl1yxG0SfbA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/414/m_p_UgKueSl1yxG0SfbA.jpg">μεγέθυνση</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/69330ed8205184ec278d6fc0/s_p_kXy4nTuYVCOxuDib.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69330ed8205184ec278d6fc0/m_p_kXy4nTuYVCOxuDib.jpg">μεγέθυνση</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/693187fd205184ec278d6fa3/s_p_R3poESL99kNRMpXi.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/693187fd205184ec278d6fa3/m_p_R3poESL99kNRMpXi.jpg">μεγέθυνση</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/69330e9e205184ec278d6fbf/s_p_ThLs4WrxsJ3ykxKU.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69330e9e205184ec278d6fbf/m_p_ThLs4WrxsJ3ykxKU.jpg">μεγέθυνση</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/69330e76205184ec278d6fbe/s_p_NykNwaI9TEwz1Ccf.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69330e76205184ec278d6fbe/m_p_NykNwaI9TEwz1Ccf.jpg">μεγέθυνση</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/69330e70205184ec278d6fbd/s_p_Rd3jEzEeesXUCTmh.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69330e70205184ec278d6fbd/m_p_Rd3jEzEeesXUCTmh.jpg">μεγέθυνση</a>]</p><p>Ο ναός έχει τοιχογραφίες με σκηνές της Καινής Διαθήκης: τη διάσωση του απόστολου Πέτρου που βυθιζόταν και τη θεραπεία του παραλύτου στην Προβατική κολυμβήθρα (από τη σειρά των θαυμάτων του Χριστού σώζονται μόνο αυτές οι δύο τοιχογραφίες), καθώς και τον Καλό Ποιμένα.</p><p><strong>Η διάσωση του απόστολου Πέτρου που βυθιζόταν</strong></p><img src="https://res.bibleox.com/s/img/image/simple/692c8038205184ec278d6f9e/s_p_QQ2Rml8gUWsyQtS9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c8038205184ec278d6f9e/m_p_QQ2Rml8gUWsyQtS9.jpg">μεγέθυνση</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6786b88ddba77200015ae11c/m_p_do380IVDukCAfdFk.jpg">εκδοχή 2</a>]</p><p><strong>Η θεραπεία του παραλύτου στην Προβατική κολυμβήθρα</strong></p><img src="https://res.bibleox.com/s/img/image/simple/6786b889dba77200015ae11b/s_p_k1a5GDBvfzTCWmZv.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6786b889dba77200015ae11b/m_p_k1a5GDBvfzTCWmZv.jpg">μεγέθυνση</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6786bb0bdba77200015ae11d/m_p_dCRD85foL69l7kih.jpg">άλλη εκδοχή</a>]</p><p><strong>Παράσταση δίπλα στην κολυμβήθρα του βαπτίσματος (χώρος αρ. 6): ο Καλός Ποιμήν επαναφέρει το χαμένο πρόβατο στο ποίμνιο</strong></p><img src="https://res.bibleox.com/s/img/image/simple/6931870c205184ec278d6fa2/s_p_uBkNi8jGsMFpOQSM.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931870c205184ec278d6fa2/m_p_uBkNi8jGsMFpOQSM.jpg">μεγέθυνση</a>]</p><h3>Ευσέβιος Καισαρείας (ο του Παμφίλου), επίσκοπος, εκκλησιαστικός ιστορικός (περ. 258–339)</h3><p>Γράφει για την ανέγερση χριστιανικών ναών σε όλες τις πόλεις κατά την περίοδο πριν από τη βασιλεία του Ρωμαίου αυτοκράτορα Διοκλητιανού (βασίλευσε 284–305). Το 303 ο Διοκλητιανός εξέδωσε διάταγμα για την κατεδάφιση των χριστιανικών ναών. Ο Ευσέβιος ήταν τότε περίπου 45 ετών, άρα πρέπει να είδε με τα μάτια του και την ανέγερση αυτών των ναών και την κατεδάφισή τους:</p><blockquote><p>5. Πόση εύνοια έδειχναν οι επίτροποι και οι ηγεμόνες στους προεστώτες των Εκκλησιών! Πώς να περιγράψει κανείς τις <strong>πολυάνθρωπες συνάξεις σε κάθε πόλη</strong>, τα θαυμαστά πλήθη <strong>που συνέρρεαν στους οίκους προσευχής! Τα παλαιά κτίρια δεν επαρκούσαν· <mark>σε όλες τις πόλεις έχτιζαν από τα θεμέλια καινούργιες ευρύχωρες εκκλησίες</mark> (εὐρείας εἰς πλάτος ἀνὰ πάσας τὰς πόλεις ἐκ θεμελίων ἀνίστων <mark>ἐκκλησίας</mark>).</strong></p><p>&lt;…&gt;</p><p>4. Ήταν το δέκατο ένατο έτος της βασιλείας του Διοκλητιανού, ο μήνας Δύστρος (ο Μάρτιος των Ρωμαίων), καθώς πλησίαζε η εορτή του Πάθους του Κυρίου, όταν <strong><mark>αναρτήθηκαν παντού βασιλικά γράμματα που διέταζαν να ισοπεδωθούν οι εκκλησίες</mark> (βασιλικὰ γράμματα, τὰς μὲν <mark>ἐκκλησίας</mark> εἰς ἔδαφος φέρειν)</strong>, να καούν οι Γραφές και να στερηθούν τα αξιώματά τους όσοι έμεναν πιστοί στον χριστιανισμό·</p></blockquote><p>(<a href="https://bibleox.com/el/grc/w/%CE%95%CE%9A%CE%9A%CE%9B%CE%97%CE%A3%CE%99%CE%91%CE%A3%CE%A4%CE%99%CE%9A%CE%97%CE%A3_%CE%99%CE%A3%CE%A4%CE%9F%CE%A1%CE%99%CE%91%CE%A3-8/#:~:text=%E1%BC%80%CE%BD%E1%BD%B0%20%CF%80%E1%BD%B1%CF%83%CE%B1%CF%82%20%CF%84%E1%BD%B0%CF%82%20%CF%80%E1%BD%B9%CE%BB%CE%B5%CE%B9%CF%82%20%E1%BC%90%CE%BA%20%CE%B8%CE%B5%CE%BC%CE%B5%CE%BB%E1%BD%B7%CF%89%CE%BD%20%E1%BC%80%CE%BD%E1%BD%B7%CF%83%CF%84%CF%89%CE%BD%20%E1%BC%90%CE%BA%CE%BA%CE%BB%CE%B7%CF%83%E1%BD%B7%CE%B1%CF%82">Εκκλησιαστική Ιστορία, βιβλίο 8, 1.5 και 2.4</a>)</p><h2>Αμφισβητούμενα ευρήματα</h2><h3><strong>Οικία στο Ερκολάνο (</strong>1ος αιώνας<strong>)</strong></h3><img src="https://res.bibleox.com/s/img/image/simple/67e428d39a4a346bba31e8ba/s_p_F0lTpC2rqw7PVyf1.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/67e428d39a4a346bba31e8ba/m_p_F0lTpC2rqw7PVyf1.jpg">μεγέθυνση</a>] [<a href="https://res.bibleox.com/s/img/image/simple/69330b68205184ec278d6fb8/m_p_oEOCtcPUBThtuirO.jpg">εκδοχή 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/69330cb6205184ec278d6fb9/m_p_zMmSTHDi5RoizXsX.jpg">εκδοχή 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/69330cbb205184ec278d6fba/m_p_Jv9gdiBWmrMB5tc4.jpg">εκδοχή 4</a>] [<a href="https://res.bibleox.com/s/img/image/simple/67e428d79a4a346bba31e8bb/m_p_1sEN1KSZxei96K4S.jpg">εκδοχή 5</a>] [<a href="https://res.bibleox.com/s/img/image/simple/67e428db9a4a346bba31e8bc/m_p_TgMWk123osBJ9une.jpg">εκδοχή 6</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/69330cc3205184ec278d6fbc/s_p_YLRMNDvDg7nCTh3X.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69330cc3205184ec278d6fbc/m_p_YLRMNDvDg7nCTh3X.jpg">μεγέθυνση</a>]</p><p>Το 79 εξερράγη ο Βεζούβιος και έθαψε κάτω από την ηφαιστειακή τέφρα πόλεις όπως η Πομπηία, οι Σταβίες και το Ερκολάνο. Στο Ερκολάνο βρέθηκε μια <a href="https://ru.wikipedia.org/wiki/%D0%93%D0%B5%D1%80%D0%BA%D1%83%D0%BB%D0%B0%D0%BD%D1%83%D0%BC#%D0%94%D0%BE%D0%BC_%D0%B4%D0%B2%D1%83%D1%85%D1%81%D0%BE%D1%82%D0%BB%D0%B5%D1%82%D0%B8%D1%8F">οικία</a> (στα ρωσικά) (ονομάστηκε Οικία της Διακοσιετηρίδας προς τιμήν της επετείου των ανασκαφών)· στον επάνω όροφο, σε ένα δωμάτιο, υπάρχει στον τοίχο μια <a href="https://ermakvagus.com/Europe/Italy/Pompeii/christianity_pompeii_rus.html">σταυρόσχημη εσοχή</a> (στα ρωσικά), ακριβώς στο κέντρο πάνω από ένα ξύλινο ντουλάπι. Μερικοί υποθέτουν ότι εκεί κρεμόταν ξύλινος σταυρός για προσευχή και ότι ο χώρος χρησιμοποιούνταν για χριστιανικές ακολουθίες ή για κατ'' οίκον προσευχή. Υπάρχουν όμως σοβαρά επιχειρήματα κατά αυτής της υπόθεσης. Στην ίδια πόλη βρέθηκε ένα ράφι που θα μπορούσε να αφήσει παρόμοιο ίχνος στον τοίχο.</p><img src="https://res.bibleox.com/s/img/image/simple/6932ff2b205184ec278d6fb6/s_p_cXmpauqq2EYuH6ww.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6932ff2b205184ec278d6fb6/m_p_cXmpauqq2EYuH6ww.jpg">μεγέθυνση</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6932ff36205184ec278d6fb7/s_p_KIfO7M0rbhGbWoIk.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6932ff36205184ec278d6fb7/m_p_KIfO7M0rbhGbWoIk.jpg">μεγέθυνση</a>] [<a href="https://res.bibleox.com/s/img/image/simple/69330cbf205184ec278d6fbb/m_p_WL1FQysNlwZc0yT9.jpg">εκδοχή 2</a>]</p><p>Το ράφι δεν είναι ακριβώς ίδιο: προεξέχει αρκετά αριστερά και δεξιά και λιγότερο προς τα κάτω. Επιπλέον, στην Οικία της Διακοσιετηρίδας σε αυτό το σημείο του τοίχου υπήρχαν μάλλον δύο φύλλα που έκλειναν. Παρ'' όλα αυτά, είναι πολύ πιθανό ότι εκεί υπήρχε πράγματι ένα απλό ράφι και όχι σταυρός. Ο αναγνώστης πρέπει να κρίνει μόνος του πόσο να εμπιστευτεί το ένα ή το άλλο συμπέρασμα. Εδώ απλώς συγκεντρώθηκαν όσα είναι γνωστά για το εύρημα.</p>'
