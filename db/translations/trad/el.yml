    </ol><h3>Διάφορες αρχαίες απεικονίσεις που δεν περιλήφθηκαν στην κύρια συλλογή</h3><p><a href="https://bibleox.com/ru/ru/w/bdRJ_%D0%A0%D0%B0%D0%B7%D0%BD%D1%8B%D0%B5_%D0%B4%D1%80%D0%B5%D0%B2%D0%BD%D0%B8%D0%B5_%D0%BE%D0%B1%D1%80%D0%B0%D0%B7%D1%8B_%D0%BD%D0%B5_%D0%B2%D0%BE%D1%88%D0%B5%D0%B4%D1%88%D0%B8%D0%B5_%D0%B2_%D0%BE%D1%81%D0%BD%D0%BE%D0%B2%D0%BD%D1%83%D1%8E_%D0%BA%D0%BE%D0%BB%D0%BB%D0%B5%D0%BA%D1%86%D0%B8%D1%8E">https://bibleox.com/ru/ru/w/bdRJ_Разные_древние_образы_не_вошедшие_в_основную_коллекцию</a></p><p>Μετάφραση από τα ρωσικά: Ροντιόν Βλάσοφ, με τη βοήθεια τεχνητής νοημοσύνης. Τα βιβλικά χωρία παρατίθενται στο πρωτότυπο.</p>
