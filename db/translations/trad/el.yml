- src: bdRJ_Разные_древние_образы_не_вошедшие_в_основную_коллекцию
  path: Ik5v_Διάφορες_αρχαίες_απεικονίσεις_που_δεν_περιλήφθηκαν_στην_κύρια_συλλογή
  title: Διάφορες αρχαίες απεικονίσεις που δεν περιλήφθηκαν στην κύρια συλλογή
  title_sub:
  body: '<h2>Οι κατακόμβες του Αγίου Ιανουαρίου (Catacombe di San Gennaro) [1]</h2><h3>Ο άγιος Ιανουάριος ο Βενεβέντου, επίσκοπος Ποτιόλων (Νεαπόλεως), ιερομάρτυρας</h3><p>Οι κατακόμβες του San Gennaro (Αγίου Ιανουαρίου), Νάπολη. Τοιχογραφία του 4ου αιώνα. Δεν είναι εντελώς σαφές ποιος απεικονίζεται εδώ. Επάνω γράφει: SANCTOMARTYRIIANVARIO (στον άγιο μάρτυρα Ιανουάριο). Ωστόσο, για κάποιο λόγο απεικονίζεται ένας νέος. Δεν είναι σαφές επίσης γιατί το φωτοστέφανο είναι έτσι.</p><p>Σελίδα για τον άγιο αυτόν στην Ορθόδοξη Εκκλησία (στα ρωσικά): <a href="https://days.pravoslavie.ru/name/890.html">https://days.pravoslavie.ru/name/890.html</a></p><p>Η σελίδα της Wikipedia για την τοιχογραφία. Στα πολωνικά, αλλά με χρήσιμες πληροφορίες: <a href="https://pl.wikipedia.org/wiki/January_z_Benewentu">https://pl.wikipedia.org/wiki/January_z_Benewentu</a></p><img src="https://res.bibleox.com/s/img/image/simple/686e6aa95f47da2505d3ae6e/s_p_RCtXSS4uiuO9E0Qf.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686e6aa95f47da2505d3ae6e/m_p_RCtXSS4uiuO9E0Qf.jpg">μεγέθυνση</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686e56775f47da2505d3ae67/m_p_XhI4Ni1rKZ949Zi1.jpg">εκδοχή 2</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686e54755f47da2505d3ae66/s_p_zKsSelu839AuImaV.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686e54755f47da2505d3ae66/m_p_zKsSelu839AuImaV.jpg">μεγέθυνση</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686e57135f47da2505d3ae68/m_p_faNUwXKGPaVtmUwW.jpg">εκδοχή 2</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686e6aec5f47da2505d3ae70/s_p_2fvyFxXewVLu06NV.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686e6aec5f47da2505d3ae70/m_p_2fvyFxXewVLu06NV.jpg">μεγέθυνση</a>]</p><h3>Η χριστιανή Κερούλα</h3><p>Η επιγραφή από κάτω: «CERVLA IN PACE» (η Κερούλα εν ειρήνη), 5ος–6ος αιώνας. [3]</p><img src="https://res.bibleox.com/s/img/image/simple/686e4d5c5f47da2505d3ae63/s_p_1dqPUS5wghY1DrdP.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686e4d5c5f47da2505d3ae63/m_p_1dqPUS5wghY1DrdP.jpg">μεγέθυνση</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686e58705f47da2505d3ae6a/m_p_r6sua9UNLBhgIZ06.jpg">εκδοχή 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686e58625f47da2505d3ae69/m_p_6KViYk7KWJDrIa8l.jpg">εκδοχή 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686e6ad15f47da2505d3ae6f/m_p_q9ocVtWoayH4BxtB.jpg">εκδοχή 4</a>]</p><h3>Η οικογένεια του Θεοτέκνου</h3><blockquote><p>Το αρκοσόλιο της οικογένειας του Θεοτέκνου. Οι έρευνες έδειξαν ότι πρώτο πέθανε το κορίτσι. Στην κόγχη ζωγραφίστηκε τοιχογραφία με το πορτρέτο του. Έπειτα πέθανε ο άνδρας. Πάνω από την πρώτη τοιχογραφία ζωγραφίστηκε νέα, τώρα και με τον πατέρα. Τελευταία πέθανε η γυναίκα, και στην κόγχη εμφανίστηκε ομαδικό πορτρέτο της οικογένειας.</p></blockquote><img src="https://res.bibleox.com/s/img/image/simple/686e6be45f47da2505d3ae71/s_p_xNoWgh6wacZ3al1R.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686e6be45f47da2505d3ae71/m_p_xNoWgh6wacZ3al1R.jpg">μεγέθυνση</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686e592c5f47da2505d3ae6b/s_p_A6SYWxzdgc1EPwun.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686e592c5f47da2505d3ae6b/m_p_A6SYWxzdgc1EPwun.jpg">μεγέθυνση</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686fe8695f47da2505d3ae88/m_p_nzuUOKu6sAmxO4pO.jpg">εκδοχή 2</a>]</p><h2>Οι κατακόμβες της Via Anapo[2]</h2><h3>Γυναίκα που προσεύχεται (δέηση, orans)</h3><p>Τοιχογραφία γυναίκας που προσεύχεται (orans) στην ανώνυμη κατακόμβη της Via Anapo (Anonima di Via Anapo), Ρώμη</p><img src="https://res.bibleox.com/s/img/image/simple/686e53655f47da2505d3ae65/s_p_qTxn07MuPIePNzPn.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686e53655f47da2505d3ae65/m_p_qTxn07MuPIePNzPn.jpg">μεγέθυνση</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686e535e5f47da2505d3ae64/m_p_U8Zh4RJjehyZtXep.jpg">εκδοχή 2</a>]</p>'
