  path: Ik1c_Συλλογή_αρχαίων_εικόνων
  title: Συλλογή αρχαίων εικόνων
  title_sub: Αρχαίες χριστιανικές εικόνες του Χριστού, της Θεοτόκου, των αποστόλων και άλλων αγίων
  body: '<h2>περ. 15ος αιώνας π.Χ.</h2><h3>Η Σκηνή του Μαρτυρίου</h3><p>Στο καταπέτασμα στη μέση του ιερού (ανάμεσα στα Άγια και στα Άγια των Αγίων) ήταν κεντημένα Χερουβίμ (<a href="https://bibleox.com/el/gr-lxx-byz/ish/26/#L31">Έξ 26:31</a>), όπως και στα παραπετάσματα (τοίχους) γύρω (<a href="https://bibleox.com/el/gr-lxx-byz/ish/26/#L1">Έξ 26:1</a>· <a href="https://bibleox.com/el/gr-lxx-byz/ish/36/#L8">Έξ 36:8</a>), κάτι που ο δημιουργός του σχεδίου δεν απέδωσε. Η Σκηνή είναι εικόνα της ουράνιας πραγματικότητας (<a href="https://bibleox.com/el/gr-lxx-byz/ish/25/#L8-9,40">Έξ 25:8-9,40</a>· <a href="https://bibleox.com/el/gr-lxx-byz/evr/9/#L24">Εβρ 9:24</a>· <a href="https://bibleox.com/el/gr-lxx-byz/act/7/#L44">Πραξ 7:44</a>). Ο Θεός πρόσταξε να τιμάται το ιερό (<a href="https://bibleox.com/el/gr-lxx-byz/lev/19/#L30">Λευ 19:30</a>· <a href="https://bibleox.com/el/gr-lxx-byz/lev/26/#L2">Λευ 26:2</a>).</p><img src="https://res.bibleox.com/s/img/image/simple/471/s_p_P2j4gLJt9iKSnkge.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/471/m_p_P2j4gLJt9iKSnkge.jpg">μεγέθυνση</a>] [<a href="https://res.bibleox.com/s/img/image/simple/472/m_p_bNPh6hCNJDhzahar.jpg">εξωτερική όψη</a>]</p><h3>Η Κιβωτός της Διαθήκης</h3><p>Πάνω στην Κιβωτό υπήρχαν δύο Χερουβίμ (<a href="https://bibleox.com/ru/ru/w/%D0%BA%D0%BE%D0%B2%D1%87%D0%B5%D0%B3_%D0%B7%D0%B0%D0%B2%D0%B5%D1%82%D0%B0/">βιβλικά χωρία</a>). Ο προφήτης Ιησούς του Ναυή προσκύνησε μπροστά στην Κιβωτό της Διαθήκης (<a href="https://bibleox.com/el/gr-lxx-byz/nav/7/#L6">Ιησ 7:6</a>).</p><img src="https://res.bibleox.com/s/img/image/simple/469/s_p_DUn5vqnI4F8yRiNA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/469/m_p_DUn5vqnI4F8yRiNA.jpg">μεγέθυνση</a>]</p><h3>Η παρεμβολή του Ισραήλ</h3><p>Ο Ισραήλ μετακινούνταν σε σχήμα σταυρού (<a href="https://bibleox.com/ru/ru/w/%D0%B5%D0%B2%D1%80%D0%B5%D0%B9%D1%81%D0%BA%D0%B8%D0%B9-%D1%81%D1%82%D0%B0%D0%BD-%D0%BA%D1%80%D0%B5%D1%81%D1%82/">βιβλικά χωρία</a>).</p><img src="https://res.bibleox.com/s/img/image/simple/470/s_p_t8tRbbwlzsBzyVzk.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/470/m_p_t8tRbbwlzsBzyVzk.jpg">μεγέθυνση</a>]</p><h2>περ. 10ος αιώνας π.Χ.</h2><h3>Ο ναός της Ιερουσαλήμ που έκτισε ο Σολομών</h3><p>Σκαλιστές μορφές Χερουβίμ υπήρχαν στους τοίχους του ναού (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/6/#L32">Γ Βασ 6:32</a>), στη θύρα της εισόδου (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/6/#L32">Γ Βασ 6:32</a>· <a href="https://bibleox.com/el/gr-lxx-byz/3ts/6/#L35">Γ Βασ 6:35</a>) και στο καταπέτασμα μπροστά στην είσοδο των Αγίων των Αγίων (<a href="https://bibleox.com/el/gr-lxx-byz/2par/3/#L14">Β Παρ 3:14</a>· <a href="https://bibleox.com/el/gr-lxx-byz/1mak/1/#L22">I Μακ 1:22</a>). Στα Άγια των Αγίων στέκονταν δύο μεγάλα επίχρυσα ξύλινα αγάλματα Χερουβίμ (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/6/#L23">Γ Βασ 6:23</a>). Στο κάλυμμα της Κιβωτού της Διαθήκης έγιναν δύο αγάλματα Χερουβίμ (<a href="https://bibleox.com/el/gr-lxx-byz/ish/25/#L18-20">Έξ 25:18-20</a>). Στην αυλή του ναού, στις μεγάλες βάσεις των λουτήρων, ήταν απεικονισμένα λιοντάρια, βόδια και Χερουβίμ (<a href="https://bibleox.com/el/gr-lxx-byz/3ts/7/#L28-29">Γ Βασ 7:28-29</a>). (<a href="https://bibleox.com/ru/ru/w/%D0%B8%D0%B5%D1%80%D1%83%D1%81%D0%B0%D0%BB%D0%B8%D0%BC%D1%81%D0%BA%D0%B8%D0%B9-%D1%85%D1%80%D0%B0%D0%BC/">Περισσότερα</a>)</p><p>Ο προφήτης Δαβίδ προσκυνούσε προς τον ναό (<a href="https://bibleox.com/el/gr-lxx-byz/ps/5/#L7">Ψλ 5:7</a>· <a href="https://bibleox.com/el/gr-lxx-byz/ps/98/#L5">Ψλ 98:5</a>· <a href="https://bibleox.com/el/gr-lxx-byz/ps/131/#L7">Ψλ 131:7</a>), τιμώντας τον Θεό μέσω αυτής της εικόνας.</p><img src="https://res.bibleox.com/s/img/image/simple/468/s_p_lv7GzNtM53C4Zqgr.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/468/m_p_lv7GzNtM53C4Zqgr.jpg">μεγέθυνση</a>]</p><h2>2ος αιώνας</h2><h3>Η Θεοτόκος με τον Ιησού βρέφος· ένας προφήτης δείχνει ένα αστέρι (Ρώμη)</h3><p>2ος – αρχές 3ου αιώνα. Κατακόμβη της Πρισκίλλας[6]. Είναι η αρχαιότερη απεικόνιση της Θεοτόκου. Ο άνδρας δίπλα στη Θεοτόκο ίσως κρατά βιβλίο στο αριστερό χέρι και με το δάχτυλο του δεξιού δείχνει ένα αστέρι.</p><img src="https://res.bibleox.com/s/img/image/simple/6751b012dba7720001514f69/s_p_jNTGMwic6Cse9xDG.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6751b012dba7720001514f69/m_p_jNTGMwic6Cse9xDG.jpg">μεγέθυνση</a>] [<a href="https://res.bibleox.com/s/img/image/simple/67618740dba7720001cd0e2c/m_p_ckKuGWqzHuN1tR5Q.jpg">εκδοχή 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686cf0535f47da2505d3ae4d/m_p_dajA4xvStk0EnnSq.jpg">εκδοχή 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686cf7725f47da2505d3ae50/m_p_n79yEKK4QSCeorx3.jpg">εκδοχή 4</a>] [<a href="https://res.bibleox.com/s/img/image/simple/442/m_p_5zQEQbMmBkEs9J2S.jpg">εκδοχή 5</a>]</p><p>Ο άνδρας δίπλα στη Θεοτόκο μπορεί να είναι ο προφήτης Ησαΐας, που είπε την προφητεία:</p><blockquote><p>«διὰ τοῦτο δώσει κύριος αὐτὸς ὑμῖν σημεῖον· ἰδοὺ <strong>ἡ παρθένος ἐν γαστρὶ ἕξει καὶ τέξεται υἱόν</strong>, καὶ καλέσεις τὸ ὄνομα αὐτοῦ Εμμανουηλ» (<a href="https://bibleox.com/el/gr-lxx-byz/is/7/#L14">Ησ 7:14</a>)</p></blockquote><p>Ή ο Βαλαάμ:</p><blockquote><p>«Δείξω αὐτῷ, καὶ οὐχὶ νῦν· μακαρίζω, καὶ οὐκ ἐγγίζει· <strong>ἀνατελεῖ ἄστρον ἐξ Ιακωβ</strong>, καὶ ἀναστήσεται ἄνθρωπος ἐξ Ισραηλ καὶ θραύσει τοὺς ἀρχηγοὺς Μωαβ καὶ προνομεύσει πάντας υἱοὺς Σηθ» (<a href="https://bibleox.com/el/gr-lxx-byz/chis/24/#L17">Αρ 24:17</a>)</p></blockquote><p>Ή ο ζωγράφος, αντί για επεξηγηματική επιγραφή, απλώς χρησιμοποίησε αυτό το τέχνασμα. Μας καλεί να πάρουμε το βιβλίο, να διαβάσουμε την προφητεία για το αστέρι που ανατέλλει και να καταλάβουμε ότι απεικόνισε τη γέννηση Εκείνου για τον οποίο μιλά η προφητεία, δηλαδή τη γέννηση του Σωτήρα από την Παρθένο.</p><h3>Ο Χριστός ως ο Καλός Ποιμήν</h3><p>Τέλη 2ου αιώνα. Ρώμη. Κατακόμβη του Καλλίστου (<a href="https://en.wikipedia.org/wiki/Catacomb_of_Callixtus#Paintings">Callixitus Catacomb, Crypt of Lucina</a>).</p><img src="https://res.bibleox.com/s/img/image/simple/473/s_p_mrIYHR2oqLQuPn0z.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/473/m_p_mrIYHR2oqLQuPn0z.jpg">μεγέθυνση</a>]</p><h2>3ος αιώνας</h2><h3>Η Θεοτόκος «Δεομένη» (Orans) (Ρώμη)</h3><p>Catacomba Maggiore, Ρώμη[26][27]. Στο πρώτο πλάνο απεικονίζονται η Παρθένος Μαρία και ο Χριστός βρέφος.</p><img src="https://res.bibleox.com/s/img/image/simple/6751fe6ddba7720001514f7e/s_p_C1Iw2V4OhNy1SGOE.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6751fe6ddba7720001514f7e/m_p_C1Iw2V4OhNy1SGOE.jpg">μεγέθυνση</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686cefb35f47da2505d3ae4c/m_p_70zYu2r0np0WFNUu.jpg">εκδοχή 2</a>]</p><h3>Ο Χριστός, οι απόστολοι, οι μάρτυρες Γοργόνιος, Πέτρος, Μαρκελλίνος και Τιβούρτιος (Ρώμη)</h3><p>Κατακόμβη του Μαρκελλίνου και του Πέτρου</p><img src="https://res.bibleox.com/s/img/image/simple/6752012adba7720001514f82/s_p_x5I0ahjwMz1X5LoJ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6752012adba7720001514f82/m_p_x5I0ahjwMz1X5LoJ.jpg">μεγέθυνση</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686d237a5f47da2505d3ae56/m_p_ST9me27UGtWHYDBc.jpg">εκδοχή 2</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/676082a6dba7720001cd0e22/s_p_YjPD3PzLDCF4wgh1.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/676082a6dba7720001cd0e22/m_p_YjPD3PzLDCF4wgh1.jpg">μεγέθυνση</a>]</p><h3>Γυναίκα προσεύχεται στον Καλό Ποιμένα (Ρώμη)</h3><p>3ος αιώνας. Κατακόμβη της Πρισκίλλας[6].</p><p>Οι παραστάσεις σχηματίζουν μια σύνθεση. Ο ζωγράφος τις τοποθέτησε έτσι ώστε οι προσευχόμενοι που απεικονίζονται γύρω να κοιτάζουν και να υψώνουν τα χέρια προς την κορυφή του δωματίου, όπου ο Χριστός απεικονίζεται ως ο <strong>Καλός Ποιμήν</strong> (<a href="https://bibleox.com/el/gr-lxx-byz/in/10/#L11">Ιω 10:11</a>). Όλες οι σκηνές γύρω από τον Καλό Ποιμένα τις ενώνει ένα θέμα: <strong>η σωτηρία από τον θάνατο</strong>.</p><img src="https://res.bibleox.com/s/img/image/simple/686bea5b5f47da2505d3ae31/s_p_pjRHeoFaUpKPoyEH.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686bea5b5f47da2505d3ae31/m_p_pjRHeoFaUpKPoyEH.jpg">μεγέθυνση</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686cf7375f47da2505d3ae4f/m_p_MOsOWI2vEXUj5ELf.jpg">εκδοχή 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6904b3f2205184ec278d6e53/m_p_0GRveVCOh2GBz7eq.jpg">εκδοχή 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/431/m_p_LUZsrJtesEWiwHBO.jpg">εκδοχή 4</a>]</p><p>Ο Καλός Ποιμήν είναι ο Χριστός (<a href="https://bibleox.com/el/gr-lxx-byz/lk/15/#L6-7">Λκ 15:6-7</a>· <a href="https://bibleox.com/el/gr-lxx-byz/in/10/#L1-21">Ιω 10:1-21</a>· <a href="https://bibleox.com/el/gr-lxx-byz/ps/22/">Ψλ 22</a>).</p><img src="https://res.bibleox.com/s/img/image/simple/69319f74205184ec278d6fa7/s_p_GR8gHxKZuC87xqlf.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69319f74205184ec278d6fa7/m_p_GR8gHxKZuC87xqlf.jpg">μεγέθυνση</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686d2ac55f47da2505d3ae59/m_p_JDvtNt9RJrqnAsEW.jpg">εκδοχή 2</a>]</p><p>Γυναίκα με σκεπασμένο κεφάλι προσεύχεται με υψωμένα χέρια (πιθανώς η Σάρρα: <a href="https://bibleox.com/el/gr-lxx-byz/gen/18/#L1-15">Γεν 18:1-15</a> και <a href="https://bibleox.com/el/gr-lxx-byz/gen/21/#L1-7">Γεν 21:1-7</a>).</p><img src="https://res.bibleox.com/s/img/image/simple/686bea885f47da2505d3ae32/s_p_79wnuevuFIi3tnrH.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686bea885f47da2505d3ae32/m_p_79wnuevuFIi3tnrH.jpg">μεγέθυνση</a>]</p><p>Δεξιά, σκηνή της Παλαιάς Διαθήκης: οι τρεις παίδες (<a href="https://en.wikipedia.org/wiki/Catacomb_of_Priscilla#/media/File:Shadrach,_Meshach,_and_Abednego_in_the_fiery_furnace,_from_the_book_Die_Malereien_der_Katakomben_Roms,_plate_78,_levels_adjusted.jpg">Σεδράχ, Μισάχ και Αβδεναγώ</a>) προσεύχονται με υψωμένα χέρια (<a href="https://bibleox.com/el/gr-lxx-byz/dan/3/">Δν 3</a>).</p><img src="https://res.bibleox.com/s/img/image/simple/686cfc565f47da2505d3ae52/s_p_NmZJuoF70d9qohZs.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686cfc565f47da2505d3ae52/m_p_NmZJuoF70d9qohZs.jpg">μεγέθυνση</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686cfc475f47da2505d3ae51/m_p_qzHB83d52LoU7QQL.jpg">εκδοχή 2</a>]</p><p>Αριστερά, σκηνή της Παλαιάς Διαθήκης: ο Αβραάμ και ο Ισαάκ με τα ξύλα για τη θυσία (<a href="https://bibleox.com/el/gr-lxx-byz/gen/22/#L1-19">Γεν 22:1-19</a>).</p><img src="https://res.bibleox.com/s/img/image/simple/686d33c45f47da2505d3ae5a/s_p_QQLn5T52hx8gSrBf.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d33c45f47da2505d3ae5a/m_p_QQLn5T52hx8gSrBf.jpg">μεγέθυνση</a>]</p><p>Πάνω από την είσοδο απεικονίζεται ο προφήτης Ιωνάς, που τον καταπίνει το θαλάσσιο κήτος (<a href="https://bibleox.com/el/gr-lxx-byz/ion/2/#L1">Ιων 2:1</a>).</p><img src="https://res.bibleox.com/s/img/image/simple/476/s_p_aHV4YSuoWhVZ1H5y.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/476/m_p_aHV4YSuoWhVZ1H5y.jpg">μεγέθυνση</a>]</p><p>Η σκηνή από τη ζωή της προσευχόμενης γυναίκας στον μπροστινό τοίχο του δωματίου αξίζει πιο λεπτομερή περιγραφή.</p><img src="https://res.bibleox.com/s/img/image/simple/686d36265f47da2505d3ae5d/s_p_MGpxKQ94pikRfgFK.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d36265f47da2505d3ae5d/m_p_MGpxKQ94pikRfgFK.jpg">μεγέθυνση</a>]</p><p><strong>Τα γεγονότα της μπροστινής σκηνής</strong></p><p>Κάθε τμήμα της σύνθεσης του δωματίου απεικονίζει μία σκηνή. Όλες οι σκηνές είναι σημαντικά στοιχεία της χριστιανικής θεματολογίας. Επάνω είναι η σκηνή με τον Καλό Ποιμένα, αριστερά η σκηνή με τον Αβραάμ, δεξιά οι τρεις παίδες, στο πέρασμα ο προφήτης Ιωνάς. Μπορούμε λοιπόν να υποθέσουμε ότι ο ζωγράφος τήρησε αυτόν τον κανόνα (ένα τμήμα, μία σημαντική σκηνή) και στον μπροστινό τοίχο, που είναι δύσκολο να ερμηνευτεί με βεβαιότητα. Ακολουθεί μόνο μια υπόθεση. Επειδή σε όλες τις πλευρές (εκτός από το κέντρο) απεικονίζονται σκηνές της Παλαιάς Διαθήκης, στον μπροστινό τοίχο μπορεί να εικονίζεται η ιστορία της Άγαρ (<a href="https://bibleox.com/el/gr-lxx-byz/gen/16/">Γεν 16</a>, <a href="https://bibleox.com/el/gr-lxx-byz/gen/21/">Γεν 21</a>). Αν είναι έτσι, πρώτα απεικονίζεται ο Αβραάμ και η Άγαρ που διώχνεται με τον γιο της Ισμαήλ (1), έπειτα η προσευχή της Σάρρας (2), έπειτα η Άγαρ που θηλάζει το παιδί της (3).</p><p>Ας εξετάσουμε αυτή την εκδοχή πιο προσεκτικά:</p><p><strong>1. Η εκδίωξη της Άγαρ</strong>. Με τη μεγαλύτερη βεβαιότητα μπορούμε να πούμε ότι καθιστός είναι ο Αβραάμ (έχει τα ίδια μαλλιά και γένια με την τοιχογραφία του Αβραάμ απέναντι). Με κίτρινα ρούχα απεικονίζεται πιθανώς η Άγαρ (το κίτρινο ίσως τόνιζε την κατάσταση της δούλης). Φαίνεται να κρατά ασκό με νερό (<a href="https://bibleox.com/el/gr-lxx-byz/gen/21/#L14">Γεν 21:14</a>). Πίσω της ίσως είναι ο γιος της Ισμαήλ, που τη στιγμή της εκδίωξης πρέπει να ήταν πάνω από 15 ετών (<em>ο Ισμαήλ γεννήθηκε όταν ο Αβραάμ ήταν 86 ετών </em><a href="https://bibleox.com/el/gr-lxx-byz/gen/16/#L16">Γεν 16:16</a><em>, ο Ισαάκ όταν ο Αβραάμ ήταν 100 ετών </em><a href="https://bibleox.com/el/gr-lxx-byz/gen/21/#L5">Γεν 21:5</a><em>, και η Άγαρ διώχνεται όταν ο Ισαάκ μεγάλωσε και απογαλακτίστηκε </em><a href="https://bibleox.com/el/gr-lxx-byz/gen/21/#L8-13">Γεν 21:8-13</a>). Μοιάζει με γυναίκα που φορά ποδιά, αλλά αν είναι έτσι, μπορεί να είναι μόνο η ίδια η Άγαρ (η ανύπαντρη έχει ακάλυπτο κεφάλι), και τότε αυτός που κρατά τον ασκό είναι ο Ισμαήλ. Όπως και να έχει, οι δύο υπόλοιπες μορφές είναι πιθανότατα η Άγαρ και ο Ισμαήλ. Μπορεί επίσης η σύνθεση να μην αποτελείται από χωριστά τμήματα αλλά να είναι μία ενιαία εικόνα, αφού η γυναίκα με το παιδί κοιτάζει τη γυναίκα με τα υψωμένα χέρια.</p><img src="https://res.bibleox.com/s/img/image/simple/686d33c95f47da2505d3ae5b/s_p_kuEcuyUnGenBuWPw.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d33c95f47da2505d3ae5b/m_p_kuEcuyUnGenBuWPw.jpg">μεγέθυνση</a>]</p><p><strong>2. Η προσευχή της Σάρρας</strong>. Με κόκκινα ρούχα και σκεπασμένο κεφάλι απεικονίζεται η Σάρρα, που προσεύχεται στον Θεό. Το κόκκινο ένδυμα δείχνει υψηλή θέση, και το σκεπασμένο κεφάλι ότι είναι παντρεμένη.</p><img src="https://res.bibleox.com/s/img/image/simple/686d3a855f47da2505d3ae5e/s_p_rpl3jnuNnx8ZisdR.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d3a855f47da2505d3ae5e/m_p_rpl3jnuNnx8ZisdR.jpg">μεγέθυνση</a>]</p><p><strong>3. Η Άγαρ θηλάζει το παιδί της</strong>. Υπέρ της εκδοχής της Άγαρ συνηγορεί το ότι το κεφάλι της είναι ακάλυπτο (δηλαδή είναι ανύπαντρη) και ότι τα μαλλιά της έχουν το ίδιο σχήμα με εκείνα της μορφής με τα κίτρινα στην πρώτη σκηνή. Την προδίδει και το χαρακτηριστικό βλέμμα της: κοιτάζει τη Σάρρα, με την οποία είχε τεταμένες σχέσεις. Είναι ενδιαφέρον ότι ο ζωγράφος την απέδωσε ακριβώς όπως κάθεται αριστερά ο Αβραάμ: σε κάθισμα και με ακριβώς τα ίδια ρούχα (κάθετες ρίγες, δύο ρίγες στο μανίκι, μανδύας).</p><img src="https://res.bibleox.com/s/img/image/simple/686d22a05f47da2505d3ae54/s_p_8fxd9vcRlXYszSJU.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d22a05f47da2505d3ae54/m_p_8fxd9vcRlXYszSJU.jpg">μεγέθυνση</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686d33cd5f47da2505d3ae5c/m_p_qKPp740xLZNuDEFs.jpg">εκδοχή 2</a>]</p><p><strong>Η ιδέα όλου του δωματίου: η σωτηρία από τον θάνατο</strong></p><p>Η σύνθεση αυτού του κουβικουλίου έχει μια κοινή, ωραία ιδέα: τη σωτηρία από τον θάνατο. Η συνολική ιστορία ανεβαίνει σε επίπεδα από κάτω προς τα πάνω:</p><ul><li><p>Το κατώτερο επίπεδο: οι ενταφιασμένοι χριστιανοί, που πίστευαν στον νικητή του θανάτου, τον Χριστό.</p></li><li><p>Το μεσαίο επίπεδο: βιβλικές ιστορίες σωτηρίας από τον θάνατο:</p><ul><li><p>οι τρεις παίδες στην κάμινο της Βαβυλώνας σώζονται από τον θάνατο στη φωτιά·</p></li><li><p>ο προφήτης Ιωνάς σώζεται από τον θάνατο στην κοιλιά του κήτους·</p></li><li><p>ο Ισαάκ σώζεται από τη θυσία· στη θέση του προσφέρεται ένας κριός·</p></li><li><p>η Άγαρ με τον γιο της Ισμαήλ σώζονται από τον θάνατο στην έρημο.</p></li></ul></li><li><p>Το προτελευταίο επίπεδο: χριστιανικά σύμβολα, το παγώνι (ανάσταση, αθανασία, αιώνια ζωή) και η πέρδικα (η ψυχή). Η μία πέρδικα στέκεται δίπλα σε ζωντανό φυτό (σύμβολο της ζωής), η άλλη δίπλα σε μαραμένο (σύμβολο του θανάτου). Το ίδιο και τα παγώνια.</p></li><li><p>Το κέντρο της οροφής: ο Καλός Ποιμήν, που σώζει τους πιστούς από τον θάνατο. Αξίζει να σημειωθεί ότι εδώ υπάρχει άλλη μία μικρή αναφορά στη σωτηρία από τον θάνατο: αριστερά και δεξιά του Ποιμένα κάθονται ο κόρακας και το περιστέρι με το κλαδί ελιάς, που έστειλε ο Νώε από την κιβωτό. Έτσι όσοι σώθηκαν από τον θάνατο στην κιβωτό οδηγούνται από αυτά τα πουλιά στον Σωτήρα από τον θάνατο, τον Χριστό.</p></li></ul><h3>Ο ναός στη Δούρα-Ευρωπό (Συρία)</h3><p>244. Εκτός από γεγονότα της Παλαιάς Διαθήκης, ο ναός στη Δούρα-Ευρωπό είχε τοιχογραφίες με σκηνές της Καινής Διαθήκης: τη διάσωση του απόστολου Πέτρου που βυθιζόταν και τη θεραπεία του παραλύτου στην Προβατική κολυμβήθρα. Βλέπε επίσης το <a href="https://vk.com/@aletheia-de-sacris-imaginibus-venerandis?anchor=v-drugie-svyaschennye-izobrazhenia-v-donikeyskiy-period">άρθρο</a>.</p><p><strong>Ο Χριστός ως ο Καλός Ποιμήν (η κύρια όψη στο βαπτιστήριο)</strong></p><img src="https://res.bibleox.com/s/img/image/simple/6931870c205184ec278d6fa2/s_p_uBkNi8jGsMFpOQSM.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931870c205184ec278d6fa2/m_p_uBkNi8jGsMFpOQSM.jpg">μεγέθυνση</a>]</p><p><strong>Η διάσωση του απόστολου Πέτρου που βυθιζόταν</strong></p><img src="https://res.bibleox.com/s/img/image/simple/692c8038205184ec278d6f9e/s_p_QQ2Rml8gUWsyQtS9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c8038205184ec278d6f9e/m_p_QQ2Rml8gUWsyQtS9.jpg">μεγέθυνση</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6786b88ddba77200015ae11c/m_p_do380IVDukCAfdFk.jpg">εκδοχή 2</a>]</p><p><strong>Η θεραπεία του παραλύτου στην Προβατική κολυμβήθρα</strong></p><img src="https://res.bibleox.com/s/img/image/simple/6786b889dba77200015ae11b/s_p_k1a5GDBvfzTCWmZv.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6786b889dba77200015ae11b/m_p_k1a5GDBvfzTCWmZv.jpg">μεγέθυνση</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6786bb0bdba77200015ae11d/m_p_dCRD85foL69l7kih.jpg">άλλη εκδοχή</a>]</p><h3>Ο Χριστός ως ο Καλός Ποιμήν, ο προφήτης Ιωνάς</h3><p>Τέλη 3ου – αρχές 4ου αιώνα. Ρώμη. Κατακόμβη του Μαρκελλίνου και του Πέτρου.</p><p>Στο κέντρο ο Χριστός ως ο Καλός Ποιμήν. Και στις δύο πλευρές του κέντρου απεικονίζεται ο Ιωνάς. Στην αριστερή τοιχογραφία ρίχνουν τον Ιωνά από το πλοίο, και στη δεξιά τον καταπίνει το κήτος.</p><img src="https://res.bibleox.com/s/img/image/simple/478/s_p_yvJcnbLGPxZ6AzRu.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/478/m_p_yvJcnbLGPxZ6AzRu.jpg">μεγέθυνση</a>]</p><p>Ο προφήτης Ιωνάς</p><img src="https://res.bibleox.com/s/img/image/simple/481/s_p_7z5j4tAimokFaRMN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/481/m_p_7z5j4tAimokFaRMN.jpg">μεγέθυνση</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/480/s_p_b8gqyOenKZcn2MCp.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/480/m_p_b8gqyOenKZcn2MCp.jpg">μεγέθυνση</a>]</p><h3>Ο Χριστός ως ο Καλός Ποιμήν</h3><p>3ος αιώνας. Ρώμη. Κατακόμβη του Καλλίστου (<a href="https://en.wikipedia.org/wiki/Catacomb_of_Callixtus#Paintings">Callixitus Catacomb, Crypt of Lucina</a>). Μπορεί να υποτεθεί ότι στο δοχείο υπάρχει γάλα, σύμβολο της Θείας Ευχαριστίας (πρβλ. Κλήμη Αλεξανδρέα).</p><img src="https://res.bibleox.com/s/img/image/simple/474/s_p_zcLmMd2qkyG3pDoj.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/474/m_p_zcLmMd2qkyG3pDoj.jpg">μεγέθυνση</a>]</p><h3>Ο Καλός Ποιμήν, νεκρόπολη Χισάρτεπε, Νίκαια (Ιζνίκ)</h3><p>Περ. 3ος αιώνας. Το εύρημα είναι πρόσφατο και η χρονολόγηση υποθετική (<a href="https://www.arkeolojikhaber.com/haber-iznikte-benzersiz-bir-kesif-anadolunun-tek-coban-isa-figuru-gun-yuzune-cikarildi-43079/">περισσότερα</a>). Η νεκρόπολη χρησιμοποιήθηκε από τον 2ο έως τον 5ο αιώνα.</p><p>Συντεταγμένες: 40.78204218462122, 29.928491677648932. Τουρκική ονομασία: Hasartep Nekropolü.</p><img src="https://res.bibleox.com/s/img/image/simple/69444e49205184ec278d6fdb/s_p_SZTpvcDdpodujcbM.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69444e49205184ec278d6fdb/m_p_SZTpvcDdpodujcbM.jpg">μεγέθυνση</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6941a813205184ec278d6fda/s_p_CUoa7dSy5UxGf1UD.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6941a813205184ec278d6fda/m_p_CUoa7dSy5UxGf1UD.jpg">μεγέθυνση</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6941a80f205184ec278d6fd9/m_p_xSCaRt10DUUReyMt.jpg">εκδοχή 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/693c7d1a205184ec278d6fcb/m_p_mR5ZaVgXbezmXDyo.jpg">εκδοχή 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/693d606b205184ec278d6fd3/m_p_TKCjvhxmnq0q50tW.jpg">εκδοχή 4</a>] [<a href="https://res.bibleox.com/s/img/image/simple/693d6101205184ec278d6fd7/m_p_1i6aL6lfDR08iA13.jpg">εκδοχή 5</a>] [<a href="https://res.bibleox.com/s/img/image/simple/693d60f8205184ec278d6fd6/m_p_b2uUaO6tzciaKAgC.jpg">εκδοχή 6</a>] [<a href="https://res.bibleox.com/s/img/image/simple/693d60f1205184ec278d6fd5/m_p_bErh7lbI0e08hPaa.jpg">εκδοχή 7</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/693c7db2205184ec278d6fd2/s_p_wCZsWPWG7jCNLjIr.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/693c7db2205184ec278d6fd2/m_p_wCZsWPWG7jCNLjIr.jpg">μεγέθυνση</a>] [<a href="https://res.bibleox.com/s/img/image/simple/693d60ad205184ec278d6fd4/m_p_BCvsIiJX10j2Mf2k.jpg">άνδρας και γυναίκα</a>] [<a href="https://res.bibleox.com/s/img/image/simple/693c7daa205184ec278d6fd1/m_p_cjk36Xjpev9EFq2h.jpg">γυναίκα</a>]</p><h3>Γαμήλιο δαχτυλίδι (Βυζάντιο)</h3><p>3ος–4ος αιώνας. <a href="https://www.metmuseum.org/art/collection/search/663485">Μητροπολιτικό Μουσείο Τέχνης, Πέμπτη Λεωφόρος, ΗΠΑ</a>. (χάρις)</p><img src="https://res.bibleox.com/s/img/image/simple/68b5da8b45c75323d28a5e99/s_p_GNh1S8L7fcowsMEE.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5da8b45c75323d28a5e99/m_p_GNh1S8L7fcowsMEE.jpg">μεγέθυνση</a>]</p><h3>Η τέλεση της Θείας Ευχαριστίας</h3><p>3ος αιώνας. Ρώμη. Κατακόμβη του Καλλίστου (<a href="https://en.wikipedia.org/wiki/Catacomb_of_Callixtus#Paintings">Callixitus Catacomb, Crypt of Lucina</a>). Πιθανώς απεικονίζεται ιερέας με συλλειτουργό διάκονο. Έτσι τελείται και σήμερα η Θεία Ευχαριστία στους ναούς της Ορθόδοξης Εκκλησίας: ο ιερέας υψώνει και τα δύο χέρια, και ο διάκονος δείχνει τα Τίμια Δώρα.</p><img src="https://res.bibleox.com/s/img/image/simple/479/s_p_Zbn405P2krjwNAYl.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/479/m_p_Zbn405P2krjwNAYl.jpg">μεγέθυνση</a>]</p><h2>4ος αιώνας</h2><h3>Ο Χριστός (Ρώμη)</h3><p>Κατακόμβη της Κομμοδίλλας.</p><img src="https://res.bibleox.com/s/img/image/simple/66cc2bd6dba77200019bc7d2/s_p_7xYGBb9wCmxBIGrZ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/66cc2bd6dba77200019bc7d2/m_p_7xYGBb9wCmxBIGrZ.jpg">μεγέθυνση</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686d23425f47da2505d3ae55/s_p_LzqgbhnIsbqtghoc.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d23425f47da2505d3ae55/m_p_LzqgbhnIsbqtghoc.jpg">μεγέθυνση</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a1e1205184ec278d6fa8/m_p_KC0MljXJf5po70pj.jpg">εκδοχή 2</a>]</p><h3>Ο Χριστός και οι απόστολοι (Ρώμη)</h3><p>Περ. 350. [8][9] Μαυσωλείο της Santa Costanza.</p><img src="https://res.bibleox.com/s/img/image/simple/686990665f47da2505d3ae19/s_p_5RDr4ou4ExBAh4KE.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686990665f47da2505d3ae19/m_p_5RDr4ou4ExBAh4KE.jpg">μεγέθυνση</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686990425f47da2505d3ae17/s_p_CXn5KmuiWradhOvh.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686990425f47da2505d3ae17/m_p_CXn5KmuiWradhOvh.jpg">μεγέθυνση</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686990545f47da2505d3ae18/s_p_IkgteAcecXoMC106.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686990545f47da2505d3ae18/m_p_IkgteAcecXoMC106.jpg">μεγέθυνση</a>]</p><h3>Βαπτιστήριο San Giovanni in Fonte (Νάπολη)</h3><p>350–400. [11][12]</p><img src="https://res.bibleox.com/s/img/image/simple/6869924c5f47da2505d3ae1a/s_p_t1iU8sClY3pnOnkK.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6869924c5f47da2505d3ae1a/m_p_t1iU8sClY3pnOnkK.jpg">μεγέθυνση</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686992505f47da2505d3ae1b/s_p_BrRKZmtReJbgXm0w.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686992505f47da2505d3ae1b/m_p_BrRKZmtReJbgXm0w.jpg">μεγέθυνση</a>]</p><h3>Ο Χριστός και άγγελοι, η Δευτέρα Παρουσία (Θεσσαλονίκη, Βυζάντιο)</h3><p>Τέλη 4ου αιώνα. [17][18] Ροτόντα του Αγίου Γεωργίου του Τροπαιοφόρου (αρχικά τάφος του αυτοκράτορα Γαλερίου).</p><img src="https://res.bibleox.com/s/img/image/simple/6931a254205184ec278d6fa9/s_p_bWn7Chqiox5UOEd4.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931a254205184ec278d6fa9/m_p_bWn7Chqiox5UOEd4.jpg">μεγέθυνση</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a2ba205184ec278d6faa/m_p_ROPWmBVyUxWMGo9Z.jpg">εκδοχή 2</a>]</p><p>Το ψηφιδωτό σώζεται άσχημα. Από τη μορφή του Χριστού έμειναν μόνο ένα κομμάτι του φωτοστέφανου, ένα χέρι και ο σταυρός. Τα πρόσωπα των αγγέλων γύρω φαίνονται καθαρά.</p><img src="https://res.bibleox.com/s/img/image/simple/686a91695f47da2505d3ae1f/s_p_EoOSmhaBPsy32XQQ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686a91695f47da2505d3ae1f/m_p_EoOSmhaBPsy32XQQ.jpg">μεγέθυνση</a>]</p><h3>Άγιοι επίσκοποι, στρατιωτικοί, ιατροί (Θεσσαλονίκη, Βυζάντιο)</h3><p>Τέλη 4ου αιώνα. [17][18] Ροτόντα του Αγίου Γεωργίου του Τροπαιοφόρου (αρχικά τάφος του αυτοκράτορα Γαλερίου).</p><p>Ανάμεσα στα ψηφιδωτά υπάρχουν μορφές αγίων επισκόπων, στρατιωτικών, ιατρών και μουσικών με τα ονόματα Ρωμανός, Κύριλλος, Λέων, Ονησιφόρος, Ευκάρπιος, Βασιλίσκος, Πορφύριος, Φιλήμων, Πρίσκος, Θήρινος, Κοσμάς και Δαμιανός.</p><img src="https://res.bibleox.com/s/img/image/simple/686aa0275f47da2505d3ae21/s_p_oIksDo9rIgSoAXvG.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa0275f47da2505d3ae21/m_p_oIksDo9rIgSoAXvG.jpg">μεγέθυνση</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686aa02e5f47da2505d3ae22/s_p_nTZtC6C93KI8Fu6I.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa02e5f47da2505d3ae22/m_p_nTZtC6C93KI8Fu6I.jpg">μεγέθυνση</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686aa0335f47da2505d3ae23/s_p_b1KhWllqTzipVhO9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa0335f47da2505d3ae23/m_p_b1KhWllqTzipVhO9.jpg">μεγέθυνση</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686aa0385f47da2505d3ae24/s_p_vvlbG9E89B9T0U8j.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa0385f47da2505d3ae24/m_p_vvlbG9E89B9T0U8j.jpg">μεγέθυνση</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686aa03f5f47da2505d3ae25/s_p_d3lcRobegfAQOf6e.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa03f5f47da2505d3ae25/m_p_d3lcRobegfAQOf6e.jpg">μεγέθυνση</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686aa0555f47da2505d3ae27/s_p_h1YgFpMukwaYc23Q.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa0555f47da2505d3ae27/m_p_h1YgFpMukwaYc23Q.jpg">μεγέθυνση</a>]</p><p>Οι άγιοι Κοσμάς και Δαμιανός</p><img src="https://res.bibleox.com/s/img/image/simple/686aa04e5f47da2505d3ae26/s_p_LwMjPHLsabDDxEHy.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa04e5f47da2505d3ae26/m_p_LwMjPHLsabDDxEHy.jpg">μεγέθυνση</a>]</p><h3>Απεικόνιση του Χριστού σταυρωμένου ανάμεσα στους ληστές (Ρώμη)</h3><p>Αρχές 4ου αιώνα [συνήθως η θύρα χρονολογείται περ. 430]. Βασιλική Santa Sabina, ένα από τα φύλλα της θύρας. Ανάγλυφη παράσταση της Σταύρωσης.</p><img src="https://res.bibleox.com/s/img/image/simple/676183a8dba7720001cd0e2b/s_p_ccaA7HzLPDInwe1b.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/676183a8dba7720001cd0e2b/m_p_ccaA7HzLPDInwe1b.jpg">μεγέθυνση</a>]</p><h3>Η είσοδος του Κυρίου στα Ιεροσόλυμα (Βυζάντιο)</h3><p>Αρχές 4ου αιώνα. <a href="https://www.metmuseum.org/art/collection/search/466220">Μητροπολιτικό Μουσείο Τέχνης, Πέμπτη Λεωφόρος, ΗΠΑ</a>. 67,3 × 212,1 × 61,9 εκ.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5e69845c75323d28a5e9d/s_p_Kk1dIB2OLr1OjQ1O.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5e69845c75323d28a5e9d/m_p_Kk1dIB2OLr1OjQ1O.jpg">μεγέθυνση</a>]</p><h3>Ο Χριστός, πλάκα (Χερσόνησος)</h3><p>300–500. <a href="https://collections.louvre.fr/en/ark:/53355/cl010276835">Λούβρο, Γαλλία</a>. Το μουσείο αναφέρει ότι το άλλο μέρος φυλάσσεται στο Ερμιτάζ. Είναι χαραγμένα λόγια που απευθύνονται στον απόστολο Πέτρο.</p><img src="https://res.bibleox.com/s/img/image/simple/68c41cec6594f46d35a87f04/s_p_esWl4etLsBMVz9bw.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c41cec6594f46d35a87f04/m_p_esWl4etLsBMVz9bw.jpg">μεγέθυνση</a>]</p><h3>Ο Χριστός Διδάσκαλος (Ρώμη)</h3><p>Κατακόμβη της Δομιτίλλας. Τοιχογραφία στη λυνέτα ενός κουβικουλίου.</p><img src="https://res.bibleox.com/s/img/image/simple/674ed2a4dba77200011c738a/s_p_4M8Vki7GNJBHkJPN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674ed2a4dba77200011c738a/m_p_4M8Vki7GNJBHkJPN.jpg">μεγέθυνση</a>]</p><h3>Ο Κύριος Ιησούς Χριστός (Ρώμη)</h3><p>3ος–5ος αιώνας. Κατακόμβη της Γενερόζας [7]</p><img src="https://res.bibleox.com/s/img/image/simple/674f2408dba77200011c739c/s_p_zVliPTIYBpqqnTGQ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f2408dba77200011c739c/m_p_zVliPTIYBpqqnTGQ.jpg">μεγέθυνση</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6931a55a205184ec278d6faf/s_p_xXRXPudiFDi6GltL.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931a55a205184ec278d6faf/m_p_xXRXPudiFDi6GltL.jpg">μεγέθυνση</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686bf5b25f47da2505d3ae36/m_p_Io7kaT9uNdBPFcSj.jpg">εκδοχή 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a5b6205184ec278d6fb0/m_p_btFyqkRBFzGf0FSH.jpg">εκδοχή 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a5e4205184ec278d6fb1/m_p_wuVaj4ghYuk6s5cc.jpg">εκδοχή 4</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a5fe205184ec278d6fb2/m_p_mO6KaZXywWX76vBg.jpg">εκδοχή 5</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a656205184ec278d6fb3/m_p_eqLfG1BFyG45i90X.jpg">εκδοχή 6</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a858205184ec278d6fb5/m_p_EVVCP1plDQZ4XgAS.jpg">εκδοχή 7</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6931a360205184ec278d6fab/s_p_hObpAcapDVZvLsC1.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931a360205184ec278d6fab/m_p_hObpAcapDVZvLsC1.jpg">μεγέθυνση</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6931a369205184ec278d6fad/s_p_8bP3aXtUgkNcP9gz.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931a369205184ec278d6fad/m_p_8bP3aXtUgkNcP9gz.jpg">μεγέθυνση</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6931a363205184ec278d6fac/s_p_BcSN3IXA4JYFLpgA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931a363205184ec278d6fac/m_p_BcSN3IXA4JYFLpgA.jpg">μεγέθυνση</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6931a36f205184ec278d6fae/s_p_6J6vSMM0TM5tc59T.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931a36f205184ec278d6fae/m_p_6J6vSMM0TM5tc59T.jpg">μεγέθυνση</a>]</p><h3>Οι άγιοι Βιατρίξ και Σιμπλίκιος (ή Ρούφος) (Ρώμη)</h3><p>3ος–5ος αιώνας. Κατακόμβη της Γενερόζας [7]</p><img src="https://res.bibleox.com/s/img/image/simple/66cc2c40dba77200019bc7d8/s_p_zABjPHGhPdjGVh3U.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/66cc2c40dba77200019bc7d8/m_p_zABjPHGhPdjGVh3U.jpg">μεγέθυνση</a>]</p><h3>Οι απόστολοι Πέτρος και Παύλος (Ρώμη)</h3><p>Περ. 380. Κατακόμβη της Αγίας Θέκλας (Santa Tecla), τοιχογραφία [24]</p><p>Απεικονίζονται οι απόστολοι Πέτρος, Παύλος, Ανδρέας και Ιωάννης.</p><img src="https://res.bibleox.com/s/img/image/simple/686bf38e5f47da2505d3ae35/s_p_BxfiObhkLMfci8nP.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686bf38e5f47da2505d3ae35/m_p_BxfiObhkLMfci8nP.jpg">μεγέθυνση</a>] [<a href="https://res.bibleox.com/s/img/image/simple/687291145f47da2505d3ae8b/m_p_WXlkaMJTOrIzlOdI.jpg">εκδοχή 2</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/68b6cd4802e89ba22dfc3977/s_p_kAWGH2VPHMkRv9cL.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b6cd4802e89ba22dfc3977/m_p_kAWGH2VPHMkRv9cL.jpg">μεγέθυνση</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686bf5bf5f47da2505d3ae37/m_p_F0tsoqA9bv6CrpfE.jpg">εκδοχή 2</a>]</p><h3>Οι απόστολοι Πέτρος και Παύλος (Βυζάντιο)</h3><p>Μέσα 4ου αιώνα. Ο Χριστός δίνει τα στεφάνια του μαρτυρίου στους αποστόλους Πέτρο και Παύλο. <a href="https://www.metmuseum.org/art/collection/search/463547">Μητροπολιτικό Μουσείο Τέχνης, Πέμπτη Λεωφόρος, ΗΠΑ</a>. Ρώμη ή Βυζάντιο. 13,8 × 12,5 × 5 εκ.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5f5d745c75323d28a5ebc/s_p_MiCffui3hayo2BCt.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5f5d745c75323d28a5ebc/m_p_MiCffui3hayo2BCt.jpg">μεγέθυνση</a>]</p><hr><p>Μέσα 4ου αιώνα. <a href="https://www.metmuseum.org/art/collection/search/468386">Μητροπολιτικό Μουσείο Τέχνης, Πέμπτη Λεωφόρος, ΗΠΑ</a>. Ρώμη ή Βυζάντιο. 8,5 × 14 × 13,3 εκ.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5e89c45c75323d28a5ea1/s_p_HAfNPGdEHMp67CuN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5e89c45c75323d28a5ea1/m_p_HAfNPGdEHMp67CuN.jpg">μεγέθυνση</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5e88f45c75323d28a5ea0/m_p_gvro4Ry9POJUm0nR.jpg">πλάγια όψη</a>]</p><hr><p>Τέλη 4ου αιώνα. <a href="https://www.metmuseum.org/art/collection/search/463714">Μητροπολιτικό Μουσείο Τέχνης, Πέμπτη Λεωφόρος, ΗΠΑ</a>. Γυαλί, φύλλο χρυσού.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5e68b45c75323d28a5e9c/s_p_uRLyImBPPDsr48G2.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5e68b45c75323d28a5e9c/m_p_uRLyImBPPDsr48G2.jpg">μεγέθυνση</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5e76d45c75323d28a5e9e/m_p_62cHpid14wgeSyqc.jpg">εκδοχή 2</a>]</p><hr><p>Μέσα 4ου αιώνα. Οι απόστολοι Πέτρος και Παύλος, Περεγρίνα. <a href="https://www.metmuseum.org/art/collection/search/465922">Μητροπολιτικό Μουσείο Τέχνης, Πέμπτη Λεωφόρος, ΗΠΑ</a>. 11,5 × 13,3 × 1,2 εκ.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5e7d145c75323d28a5e9f/s_p_atDwcEc3h2ZyYLRb.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5e7d145c75323d28a5e9f/m_p_atDwcEc3h2ZyYLRb.jpg">μεγέθυνση</a>]</p><h3>Οι απόστολοι Πέτρος και Παύλος (Ρώμη)</h3><p>4ος αιώνας. Πλάκα που έκλεινε παιδικό ταφικό θάλαμο (loculus) στις κατακόμβες. Ρώμη, Μουσεία του Βατικανού, Μουσείο Pio Cristiano.</p><img src="https://res.bibleox.com/s/img/image/simple/674f1bc0dba77200011c739a/s_p_uH3btIsNTUn6lHGQ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f1bc0dba77200011c739a/m_p_uH3btIsNTUn6lHGQ.jpg">μεγέθυνση</a>]</p><h3>Η Θεοτόκος με τον Χριστό βρέφος (Ρώμη)</h3><p>3ος–4ος αιώνας. Κατακόμβη της Δομιτίλλας.</p><img src="https://res.bibleox.com/s/img/image/simple/66cc2c11dba77200019bc7d5/s_p_rZQc8oqW4YIrUMho.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/66cc2c11dba77200019bc7d5/m_p_rZQc8oqW4YIrUMho.jpg">μεγέθυνση</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686d246b5f47da2505d3ae57/m_p_AZTFv8hTAm4Eo9yp.jpg">εκδοχή 2</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686d24885f47da2505d3ae58/s_p_Z1QqJZuraUn8iLSV.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d24885f47da2505d3ae58/m_p_Z1QqJZuraUn8iLSV.jpg">μεγέθυνση</a>]</p><h3>Σταυρός με απεικόνιση του Χριστού (Βυζάντιο)</h3><p>395–641. <a href="https://collections.louvre.fr/en/ark:/53355/cl010043937">Λούβρο, Γαλλία</a>. 8,5 × 20 × 1,2 εκ.</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c5886594f46d35a87ec7/s_p_wU3HuTavyFqHCHIc.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c5886594f46d35a87ec7/m_p_wU3HuTavyFqHCHIc.jpg">μεγέθυνση</a>]</p><h3>Εικόνα (Αίγυπτος)</h3><p>395–641. <a href="https://collections.louvre.fr/en/ark:/53355/cl010049211">Λούβρο, Γαλλία</a>. 24 × 17,5 εκ.</p><img src="https://res.bibleox.com/s/img/image/simple/68c3bf006594f46d35a87ebf/s_p_m1O6PHgeoR9L2huf.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3bf006594f46d35a87ebf/m_p_m1O6PHgeoR9L2huf.jpg">μεγέθυνση</a>]</p><hr><p><a href="https://collections.louvre.fr/en/ark:/53355/cl010049209">Λούβρο, Γαλλία</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c8966594f46d35a87ec8/s_p_hfH86ZqQDaRWHKRA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c8966594f46d35a87ec8/m_p_hfH86ZqQDaRWHKRA.jpg">μεγέθυνση</a>]</p><h3>Αμπούλα με εικόνα του αγίου Μηνά (Βυζάντιο)</h3><p>395–641. <a href="https://collections.louvre.fr/en/ark:/53355/cl010042774">Λούβρο, Γαλλία</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c4176594f46d35a87ec3/s_p_RYRsljTrixb3giuP.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c4176594f46d35a87ec3/m_p_RYRsljTrixb3giuP.jpg">μεγέθυνση</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c3c4196594f46d35a87ec4/m_p_20KqaRLqoxUISfqB.jpg">πίσω όψη</a>]</p><hr><p>395–641. <a href="https://collections.louvre.fr/en/ark:/53355/cl010042778">Λούβρο, Γαλλία</a>. Τέτοιες αμπούλες βρίσκονται σε πολύ μεγάλο αριθμό σε διάφορα μουσεία. Άλλα παραδείγματα: <a href="https://collections.louvre.fr/en/ark:/53355/cl010042780">1</a>, <a href="https://collections.louvre.fr/en/ark:/53355/cl010042798">2</a>, <a href="https://collections.louvre.fr/en/ark:/53355/cl010042802">3</a>, <a href="https://collections.louvre.fr/en/ark:/53355/cl010043779">4</a>, <a href="https://collections.louvre.fr/en/ark:/53355/cl010076645">5</a>, <a href="https://collections.louvre.fr/en/ark:/53355/cl010051239">6</a>, <a href="https://collections.louvre.fr/en/ark:/53355/cl010263188">7</a>, <a href="https://collections.louvre.fr/en/ark:/53355/cl010280896">8</a>, <a href="https://collections.louvre.fr/en/ark:/53355/cl010044285">9</a>, <a href="https://collections.louvre.fr/en/ark:/53355/cl010280846">10</a>, <a href="https://collections.louvre.fr/en/ark:/53355/cl010280894">11</a>, <a href="https://www.clevelandart.org/art/1999.232">12</a>, <a href="https://www.clevelandart.org/art/1999.233">13</a>, <a href="https://www.clevelandart.org/art/1999.231">14</a>, <a href="https://www.clevelandart.org/art/1999.230">15</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c4c66594f46d35a87ec5/s_p_b5etRE60QJjNF7zQ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c4c66594f46d35a87ec5/m_p_b5etRE60QJjNF7zQ.jpg">μεγέθυνση</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c4cd6594f46d35a87ec6/s_p_vJbng6ICUUefTimC.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c4cd6594f46d35a87ec6/m_p_vJbng6ICUUefTimC.jpg">μεγέθυνση</a>]</p><h3>Μολύβδινη αμπούλα με απεικόνιση της Θεοτόκου και του Χριστού (Ιταλία, Μπολόνια)</h3><p>4ος–5ος αιώνας. «Τέτοιες αμπούλες με άγιο έλαιο από τους Αγίους Τόπους τις έφερναν σε μεγάλο αριθμό οι προσκυνητές από την Ανατολή, και συγκεκριμένα από την Παλαιστίνη, όπου τα προσκυνήματα καθιερώθηκαν από τα τέλη του 4ου αιώνα και στο πρώτο μισό του πέμπτου έγιναν πολυάριθμα» [27]</p><img src="https://res.bibleox.com/s/img/image/simple/686d3bdc5f47da2505d3ae5f/s_p_gcwh26YTfBvz5FbR.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d3bdc5f47da2505d3ae5f/m_p_gcwh26YTfBvz5FbR.jpg">μεγέθυνση</a>]</p><h2>5ος αιώνας</h2><h3>Η Θεοτόκος με τον Ιησού βρέφος, οι μάρτυρες Φήλιξ και Αδαύκτος, η χήρα Κομμοδίλλα (Ρώμη)</h3><p>5ος–6ος αιώνας. Κατακόμβη της Κομμοδίλλας. Αριστερά στο πρώτο πλάνο απεικονίζεται η χήρα Κομμοδίλλα, πλούσια Ρωμαία, στη μνήμη της οποίας κτίστηκε ο ναός της κατακόμβης.</p><img src="https://res.bibleox.com/s/img/image/simple/674edb84dba77200011c738c/s_p_urBcFMzNnn49NanW.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674edb84dba77200011c738c/m_p_urBcFMzNnn49NanW.jpg">μεγέθυνση</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686bf61f5f47da2505d3ae38/m_p_gOZdkzGPGcL4Vws0.jpg">εκδοχή 2</a>]</p><h3>Ο Χριστός και η Θεοτόκος (Βυζάντιο)</h3><p>400–500. Υλικό: χρυσός. 3,7 × 4 × 0,3 εκ.· βάρος 4,04 γρ. <a href="https://collections.louvre.fr/en/ark:/53355/cl010256498">Λούβρο, Γαλλία</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c403846594f46d35a87efb/s_p_Ahj64DxPe313azhi.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c403846594f46d35a87efb/m_p_Ahj64DxPe313azhi.jpg">μεγέθυνση</a>]</p><h3>Ο μάρτυρας Λαυρέντιος (Ραβέννα)</h3><p>425. Μαυσωλείο της Γάλλας Πλακιδίας[1][2][25]. Στο ανοιχτό ερμάριο βρίσκονται τα 4 Ευαγγέλια: του Μάρκου, του Ματθαίου, του Λουκά, του Ιωάννη. Ο άγιος με τον σταυρό και το ανοιχτό Ευαγγέλιο προχωρεί προς τη σχάρα, κάτω από την οποία καίει φωτιά.</p><img src="https://res.bibleox.com/s/img/image/simple/674ee461dba77200011c738e/s_p_EPEyZAtXMtLhz0vO.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674ee461dba77200011c738e/m_p_EPEyZAtXMtLhz0vO.jpg">μεγέθυνση</a>]</p><h3>Ο απόστολος Παύλος (Έφεσος)</h3><p>Τοιχογραφία των τελών του 5ου αιώνα στο σπήλαιο του Παύλου[4].</p><img src="https://res.bibleox.com/s/img/image/simple/674f2a67dba77200011c73a0/s_p_Og6LudyAS5axVwrH.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f2a67dba77200011c73a0/m_p_Og6LudyAS5axVwrH.jpg">μεγέθυνση</a>]</p><h3>Ο απόστολος Παύλος (Νάπολη)</h3><p>Τέλη 5ου αιώνα. Κατακόμβες του San Gennaro, τοιχογραφία. Πιθανώς απεικονίζεται ο απόστολος Παύλος.</p><img src="https://res.bibleox.com/s/img/image/simple/674f2705dba77200011c739d/s_p_XdEMnSngRpC4ver8.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f2705dba77200011c739d/m_p_XdEMnSngRpC4ver8.jpg">μεγέθυνση</a>]</p><h3>Η Θέκλα του Ικονίου, μάρτυς (Έφεσος)</h3><p>Σπήλαιο των αγίων Παύλου και Θέκλας. Μία από όσους πίστεψαν από το κήρυγμα του απόστολου Παύλου, μάρτυς των πρώτων αιώνων. Το 2013 το σπήλαιο βεβηλώθηκε από ισλαμιστές μαχητές[4].</p><img src="https://res.bibleox.com/s/img/image/simple/674f2c2edba77200011c73a1/s_p_tCvOXPpRP5ogjE1Y.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f2c2edba77200011c73a1/m_p_tCvOXPpRP5ogjE1Y.jpg">μεγέθυνση</a>]</p><h3>Ο μεγαλομάρτυρας Δημήτριος ο Θεσσαλονικεύς και ένας άγγελος (Θεσσαλονίκη, Βυζάντιο)</h3><p>5ος–6ος αιώνας. Βασιλική του Αγίου Δημητρίου στη Θεσσαλονίκη. Ψηφιδωτό στο δυτικό τμήμα του ναού [10]</p><img src="https://res.bibleox.com/s/img/image/simple/686984705f47da2505d3ae11/s_p_bliIzjPrQcGjWmMT.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686984705f47da2505d3ae11/m_p_bliIzjPrQcGjWmMT.jpg">μεγέθυνση</a>]</p><h3>Ο μεγαλομάρτυρας Δημήτριος ο Θεσσαλονικεύς και ένα παιδί (Θεσσαλονίκη, Βυζάντιο)</h3><p>5ος–6ος αιώνας. Βασιλική του Αγίου Δημητρίου στη Θεσσαλονίκη. Ψηφιδωτό στον δυτικό τοίχο του νότιου κλίτους [10]</p><img src="https://res.bibleox.com/s/img/image/simple/68697c845f47da2505d3ae10/s_p_T8JYB6OgB0WUM8O6.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68697c845f47da2505d3ae10/m_p_T8JYB6OgB0WUM8O6.jpg">μεγέθυνση</a>]</p><h3>Οικία συγκλητικού, Santa Pudenziana (Ρώμη)</h3><p>402–417. [13][14]</p><img src="https://res.bibleox.com/s/img/image/simple/6869938e5f47da2505d3ae1c/s_p_l5Dokt3jzLvx6IxN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6869938e5f47da2505d3ae1c/m_p_l5Dokt3jzLvx6IxN.jpg">μεγέθυνση</a>]</p><h3>Santa Maria Maggiore (Ρώμη)</h3><p>432–440. [15][16]</p><img src="https://res.bibleox.com/s/img/image/simple/6869954e5f47da2505d3ae1d/s_p_0bDTRtbRpWWnfPQR.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6869954e5f47da2505d3ae1d/m_p_0bDTRtbRpWWnfPQR.jpg">μεγέθυνση</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686995555f47da2505d3ae1e/s_p_FLcJtADykEgKNDDd.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686995555f47da2505d3ae1e/m_p_FLcJtADykEgKNDDd.jpg">μεγέθυνση</a>]</p><h3>Ο Χριστός, οι τρεις παίδες, οι μάγοι (Βόρεια Ιταλία)</h3><p>400–450. <a href="https://collections.louvre.fr/en/ark:/53355/cl010256191">Λούβρο, Γαλλία</a>. Άργυρος, 6,3 × 12,3 × 7,1 εκ.</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c1756594f46d35a87ec1/s_p_WzOTF3me39ISTfnN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c1756594f46d35a87ec1/m_p_WzOTF3me39ISTfnN.jpg">μεγέθυνση</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c1796594f46d35a87ec2/s_p_a0udZW5EPewQCqsl.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c1796594f46d35a87ec2/m_p_a0udZW5EPewQCqsl.jpg">μεγέθυνση</a>]</p><h3>Εικόνα: ο απόστολος Πέτρος υπαγορεύει το Ευαγγέλιο στον άγιο Μάρκο (Αίγυπτος)</h3><p>440–670. <a href="https://www.metmuseum.org/art/collection/search/477163">Μητροπολιτικό Μουσείο Τέχνης, Πέμπτη Λεωφόρος, ΗΠΑ</a>. 13,5 × 10 × 0,8 εκ. Βλέπε επίσης: <a href="https://www.metmuseum.org/art/collection/search/477492">1</a>, <a href="https://www.metmuseum.org/art/collection/search/477487">2</a>, <a href="https://www.metmuseum.org/art/collection/search/477481">3</a>, <a href="https://www.metmuseum.org/art/collection/search/477489">4</a>, <a href="https://www.metmuseum.org/art/collection/search/477491">5</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c1c2f56594f46d35a87e74/s_p_BWhcee0cn10mz7dc.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1c2f56594f46d35a87e74/m_p_BWhcee0cn10mz7dc.jpg">μεγέθυνση</a>]</p><h3>Άγνωστος άγιος (Βυζάντιο, Αίγυπτος)</h3><p>5ος–6ος αιώνας. <a href="https://www.metmuseum.org/art/collection/search/329982">Μητροπολιτικό Μουσείο Τέχνης, Πέμπτη Λεωφόρος, ΗΠΑ</a>. 44 × 32,5 εκ.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5eb2d45c75323d28a5ea3/s_p_E5UUO66hSfRBtXUn.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5eb2d45c75323d28a5ea3/m_p_E5UUO66hSfRBtXUn.jpg">μεγέθυνση</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5eb2845c75323d28a5ea2/m_p_ofbMCUTa1winWDg0.jpg">εκδοχή 2</a>]</p><h3>Αμπούλα με απεικόνιση του αγίου Μηνά (κοπτική Αίγυπτος)</h3><p>5ος–7ος αιώνας. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/87092?query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=34">Ερμιτάζ, Ρωσία</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c0796480b4d285320413/s_p_sW3adkK7lr960dU5.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c0796480b4d285320413/m_p_sW3adkK7lr960dU5.jpg">μεγέθυνση</a>]</p><hr><p>5ος–6ος αιώνας. Αμπούλα με απεικόνιση του αγίου Μηνά (Αίγυπτος). <a href="https://www.metmuseum.org/art/collection/search/854993">Μητροπολιτικό Μουσείο Τέχνης, Πέμπτη Λεωφόρος, ΗΠΑ</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5f3f845c75323d28a5eb8/s_p_ePhTgphiYrxHdEaZ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5f3f845c75323d28a5eb8/m_p_ePhTgphiYrxHdEaZ.jpg">μεγέθυνση</a>]</p><hr><p>5ος–6ος αιώνας. Αμπούλα με απεικόνιση του αγίου Μηνά (Αίγυπτος). <a href="https://www.metmuseum.org/art/collection/search/854994">Μητροπολιτικό Μουσείο Τέχνης, Πέμπτη Λεωφόρος, ΗΠΑ</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5f40645c75323d28a5eb9/s_p_5HMBehehtBuCUdOm.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5f40645c75323d28a5eb9/m_p_5HMBehehtBuCUdOm.jpg">μεγέθυνση</a>]</p><h3>Δαχτυλίδι με απεικόνιση του Χριστού (Αίγυπτος, Λούξορ)</h3><p>5ος–7ος αιώνας. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/111849?page=5&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%B0&amp;index=240">Ερμιτάζ, Ρωσία</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c4d46480b4d285320420/s_p_SyuBoqgvHXMA5UIe.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c4d46480b4d285320420/m_p_SyuBoqgvHXMA5UIe.jpg">μεγέθυνση</a>]</p><h2>6ος αιώνας</h2><h3>Ο Κύριος Ιησούς Χριστός (Σινά)</h3><p>6ος αιώνας. Μονή της Αγίας Αικατερίνης, Αίγυπτος [3].</p><img src="https://res.bibleox.com/s/img/image/simple/686fe7935f47da2505d3ae87/s_p_cikLnQnMeZgiaeXg.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686fe7935f47da2505d3ae87/m_p_cikLnQnMeZgiaeXg.jpg">μεγέθυνση</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6872d4935f47da2505d3ae90/m_p_1CbtDgulMkyLj9dK.jpg">εκδοχή 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6872d4835f47da2505d3ae8d/m_p_IPypUclQUGcqTIJa.jpg">εκδοχή 3</a>]</p><h3>Η Θεοτόκος με τον Ιησού βρέφος, οι άγιοι Θεόδωρος και Γεώργιος (Σινά)</h3><p>6ος αιώνας. Μονή της Αγίας Αικατερίνης. Εγκαυστική εικόνα, Αίγυπτος.</p><img src="https://res.bibleox.com/s/img/image/simple/674ece56dba77200011c7384/s_p_RWNQK8qhzLwXxGkf.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674ece56dba77200011c7384/m_p_RWNQK8qhzLwXxGkf.jpg">μεγέθυνση</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6872d4895f47da2505d3ae8e/m_p_6JgREZVUzpO8lC9E.jpg">εκδοχή 2</a>]</p><h3>Ο απόστολος Πέτρος (Σινά)</h3><p>6ος αιώνας. Μονή της Αγίας Αικατερίνης. Εγκαυστική εικόνα, Αίγυπτος.</p><img src="https://res.bibleox.com/s/img/image/simple/686fe28f5f47da2505d3ae82/s_p_tWJyRADNEjI9Gt5J.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686fe28f5f47da2505d3ae82/m_p_tWJyRADNEjI9Gt5J.jpg">μεγέθυνση</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686fe73d5f47da2505d3ae86/m_p_ztqtzVnOwMfzjCsd.jpg">εκδοχή 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6872d48f5f47da2505d3ae8f/m_p_x4BAyJ0C1GjHQ7Us.jpg">εκδοχή 3</a>]</p><h3>Η Θεοτόκος και ο Χριστός βρέφος (Βυζάντιο)</h3><p>6ος αιώνας. <a href="https://www.metmuseum.org/art/collection/search/463392">Μητροπολιτικό Μουσείο Τέχνης, Πέμπτη Λεωφόρος, ΗΠΑ</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5fce645c75323d28a5ec5/s_p_KB8coyb4H50zurQW.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5fce645c75323d28a5ec5/m_p_KB8coyb4H50zurQW.jpg">μεγέθυνση</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5fce945c75323d28a5ec6/m_p_eIaeevwinjFBQAeA.jpg">εκδοχή 2</a>]</p><h3>Δαχτυλίδι με εικόνα της Θεοτόκου και του Χριστού βρέφους (Βυζάντιο)</h3><p>6ος–7ος αιώνας. <a href="https://www.metmuseum.org/art/collection/search/464059">Μητροπολιτικό Μουσείο Τέχνης, Πέμπτη Λεωφόρος, ΗΠΑ</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5fe7745c75323d28a5ec7/s_p_bcCSRfNkRmmk5jZs.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5fe7745c75323d28a5ec7/m_p_bcCSRfNkRmmk5jZs.jpg">μεγέθυνση</a>]</p><h3>Αγία Μαρία</h3><p>611, <a href="https://www.pravenc.ru/text/164537.html">Γέρασα</a></p><img src="https://res.bibleox.com/s/img/image/simple/482/s_p_s3flMTpYpn69iMIy.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/482/m_p_s3flMTpYpn69iMIy.jpg">μεγέθυνση</a>]</p><h3>Ο Χριστός, μετάλλιο (Αντιόχεια)</h3><p>500–625. Υλικό: άργυρος, επιχρύσωση. 14,9 × 14,1 × 1,1 εκ. <a href="https://collections.louvre.fr/en/ark:/53355/cl010256496">Λούβρο, Γαλλία</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c409da6594f46d35a87f00/s_p_BHIOy3tEZ3ZoMEr5.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c409da6594f46d35a87f00/m_p_BHIOy3tEZ3ZoMEr5.jpg">μεγέθυνση</a>]</p><hr><p>500–625. <a href="https://collections.louvre.fr/en/ark:/53355/cl010256495">Λούβρο, Γαλλία</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c41f626594f46d35a87f05/s_p_bKgaW542SgyD11o9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c41f626594f46d35a87f05/m_p_bKgaW542SgyD11o9.jpg">μεγέθυνση</a>]</p><h3>Ταπισερί με εικόνες: ο Χριστός, η Θεοτόκος, οι αρχάγγελοι Μιχαήλ και Γαβριήλ, οι απόστολοι (Αίγυπτος, Βυζάντιο)</h3><p>500. <a href="https://www.clevelandart.org/art/1967.144">Μουσείο Τέχνης του Κλίβελαντ, ΗΠΑ</a>. Μαλλί, 178,7 × 110,5 εκ.</p><p>Σχόλιο του μουσείου:</p><blockquote><p>Φτιαγμένη από μάλλινες κλωστές σε περισσότερα από είκοσι χρώματα, αυτή η σπάνια ταπισερί κόστιζε στην εποχή της περισσότερο από έναν ζωγραφικό πίνακα. Η ιστορική τιμή της αντανακλά πόσο εκτιμούσαν οι σύγχρονοι την αριστοτεχνική ανάμειξη χρωμάτων των υφαντών. Κρεμασμένη σε τοίχο, <strong>αυτή η υφαντή εικόνα επέτρεπε στους πιστούς να τιμούν τη Θεοτόκο και τον Χριστό βρέφος μέσα σε ορθόδοξο ναό</strong>. Τους περιβάλλουν άγγελοι και απόστολοι, με τα ονόματά τους γραμμένα στα ελληνικά. Για να είναι πνευματικά αποτελεσματική, μια εικόνα (ιερή απεικόνιση) έπρεπε να ακολουθεί όσο το δυνατόν πιστότερα την καθιερωμένη εικονογραφική παράδοση του τύπου της.</p><p>Η επιγραφή στο υπέρθυρο του αρχιτεκτονικού πλαισίου μεταφράζεται από τα ελληνικά «<strong>Άγιος Μιχαήλ, Αγία Μαρία, Άγιος Γαβριήλ</strong>». Η πλατιά φυλλωτή μπορντούρα είναι διακοσμημένη με φρούτα και λουλούδια, και στο κάτω μέρος με μετάλλια με προτομές των αποστόλων, των οποίων τα ονόματα είναι γραμμένα δίπλα στα ελληνικά: «<strong>Ανδρέας, Ματθαίος, ο απόστολος Παύλος, Λουκάς, Ιάκωβος, Φίλιππος, Μάρκος, Θωμάς, Ιωάννης, Ματθίας, Πέτρος και Βαρθολομαίος</strong>».</p></blockquote><img src="https://res.bibleox.com/s/img/image/simple/68cb9dd5205184ec278d58d7/s_p_jXuLxO8mwNy5DicO.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68cb9dd5205184ec278d58d7/m_p_jXuLxO8mwNy5DicO.jpg">μεγέθυνση</a>]</p><h3>Ταπισερί με εικόνες. Οι τρεις παίδες;, χριστόγραμμα (Αίγυπτος, Βυζάντιο)</h3><p>Δεκαετίες του 500. <a href="https://www.clevelandart.org/art/1982.73">Μουσείο Τέχνης του Κλίβελαντ, ΗΠΑ</a>. Μαλλί, λινό. 110,5 × 76,8 εκ.</p><img src="https://res.bibleox.com/s/img/image/simple/68cb9dde205184ec278d58d8/s_p_w5vxLEtZSz6mW36r.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68cb9dde205184ec278d58d8/m_p_w5vxLEtZSz6mW36r.jpg">μεγέθυνση</a>]</p><h3>Ταπισερί με εικόνες. Η Θεοτόκος, οι μάγοι, ο προφήτης Ιωνάς (Αίγυπτος, Βυζάντιο)</h3><p>500–550. <a href="https://www.clevelandart.org/art/1951.400">Μουσείο Τέχνης του Κλίβελαντ, ΗΠΑ</a>. Λινό. 99,7 × 104,8 εκ.</p><p>Σχόλιο του μουσείου:</p><blockquote><p>… Αριστερά στην πάνω ζώνη απεικονίζεται <strong>η Παρθένος Μαρία με τον Χριστό βρέφος</strong> σε σκαμνί με σταυρωτά πόδια. Όπως αναφέρει η κοπτική επιγραφή, <strong>οι τρεις βασιλείς πλησιάζουν από δεξιά φέρνοντας δώρα</strong>. Η αριστερή πλευρά της μεσαίας ζώνης πιθανώς απεικονίζει <strong>τη Βάπτιση του Χριστού</strong>, ενώ τρεις άλλες μορφές, χωρισμένες με κίονες, φαίνεται να εικονογραφούν το θαύμα της Καινής Διαθήκης όπου ο Χριστός χόρτασε μεγάλο πλήθος με πέντε μόνο άρτους και δύο ψάρια. Στην κάτω ζώνη αναγνωρίζεται ακόμη <strong>η σκηνή της Παλαιάς Διαθήκης με τον προφήτη Ιωνά που τον καταπίνει το κήτος</strong>.</p><p>Ελληνικές επιγραφές προσδιορίζουν διάφορες σκηνές από την Παλαιά και την Καινή Διαθήκη. Πάνω από τον πρώτο μάγο στην πάνω ζώνη διακρίνονται δύο γράμματα <strong>«XP»</strong> από τη λέξη χρυσός. Αριστερά στη μεσαία ζώνη απεικονίζονται δύο μορφές: η πρώτη έχει σχεδόν καταστραφεί, η δεύτερη ταυτίζεται από την επιγραφή <strong>«EIΩANNHC» (Ιωάννης)</strong>. Στην κάτω ζώνη εικονίζεται ο Ιωνάς ξεβρασμένος στην ακτή, με ένα μεγάλο ψάρι δίπλα του, με την επιγραφή <strong>«EIΩNAC» (Ιωνάς)</strong>. Ο Μωυσής, σχεδόν εντελώς χαμένος, αναγνωρίζεται μόνο από την επιγραφή του <strong>«MWCHC» (Μωυσής)</strong>.</p></blockquote><img src="https://res.bibleox.com/s/img/image/simple/68cb9e0d205184ec278d58d9/s_p_WiTqygXUYCZZY7TF.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68cb9e0d205184ec278d58d9/m_p_WiTqygXUYCZZY7TF.jpg">μεγέθυνση</a>]</p><h3>Ευχαριστιακά δισκοπότηρα και θυμιατά με εικόνες (Βυζάντιο, Συρία, Ατταρούθι)</h3><p>500–650. <a href="https://www.metmuseum.org/art/collection/search/474390">Μητροπολιτικό Μουσείο Τέχνης, Πέμπτη Λεωφόρος, ΗΠΑ</a>. Άργυρος, επιχρύσωση. Στα δισκοπότηρα υπάρχουν εικόνες του Κυρίου και των αγίων, καθώς και επιγραφές για το ποιος τα αφιέρωσε και σε ποιον.</p><p>Αυτά τα επιδέξια φτιαγμένα λειτουργικά σκεύη, δισκοπότηρα, θυμιατά, ένα σουρωτήρι και μια απεικόνιση του περιστεριού του Αγίου Πνεύματος, ανήκαν σε χριστιανική εκκλησία της πλούσιας εμπορικής πόλης Ατταρούθι στη Συρία, τότε μίας από τις πλουσιότερες περιοχές της Βυζαντινής Αυτοκρατορίας. Τα δισκοπότηρα, τα θυμιατά και το σουρωτήρι χρησιμοποιούνταν στη Θεία Λειτουργία, δηλαδή τη Θεία Ευχαριστία, το μυστήριο στο οποίο οι χριστιανοί μεταλαμβάνουν τον καθαγιασμένο οίνο και άρτο σε ανάμνηση του Μυστικού Δείπνου και του θανάτου του Χριστού.</p><p>Σύμφωνα με τις επιγραφές τους, γραμμένες στα ελληνικά με μερικές ορθογραφικές παραλλαγές, πολλά από αυτά τα σκεύη αφιερώθηκαν από ντόπιους στον κύριο ναό της πόλης, αφιερωμένο στον Άγιο Στέφανο, και σε έναν μικρότερο ναό αφιερωμένο στον Άγιο Ιωάννη (πιθανώς τον Πρόδρομο [Βαπτιστή]).</p><p>Στις αρχές του 7ου αιώνα η Συρία έπεσε πρώτα στους Σασσανίδες Πέρσες και έπειτα στους στρατούς του Ισλάμ. Πιθανώς τα έργα αυτά θάφτηκαν βιαστικά σε προστατευτικό δοχείο, τη στιγμή που ο βυζαντινός στρατός υποχωρούσε μπροστά σε όσους επιτίθονταν στην περιοχή.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5db2045c75323d28a5e9a/s_p_kx70rC7wWJQtkfdG.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5db2045c75323d28a5e9a/m_p_kx70rC7wWJQtkfdG.jpg">μεγέθυνση</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5edf045c75323d28a5ea5/m_p_Eru1rmuua6UWqjTz.jpg">εκδοχή 2</a>]</p><hr><p>Ο Πρόδρομος Ιωάννης με μακριά μαλλιά, η Θεοτόκος σε στάση δεήσεως (με υψωμένα χέρια), ένας άγιος σε στάση δεήσεως, στρατιωτικός άγιος με ράβδο και ασπίδα, ο νεαρός Χριστός με σταυροφόρο φωτοστέφανο και άλλος ένας στρατιωτικός άγιος με πανοπλία που φονεύει δράκοντα (ο Άγιος Γεώργιος;), κάτω από τοξοστοιχίες. <a href="https://www.metmuseum.org/art/collection/search/466137">Μητροπολιτικό Μουσείο Τέχνης, Πέμπτη Λεωφόρος, ΗΠΑ</a>. 21,3 × 16 εκ.</p><p>Η ελληνική επιγραφή: «<strong>Για τη σωτηρία της η Ευδοξία πρόσφερε [αυτό] ως δώρο στον Άγιο Στέφανο του χωριού Ατταρ[ούθι]</strong>».</p><img src="https://res.bibleox.com/s/img/image/simple/68b5efa445c75323d28a5eaa/s_p_l5pPSsTDZHSQuvNU.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5efa445c75323d28a5eaa/m_p_l5pPSsTDZHSQuvNU.jpg">μεγέθυνση</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f01f45c75323d28a5eab/m_p_456sbKEe3ANd9ZWP.jpg">εκδοχή 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f02245c75323d28a5eac/m_p_fkJIydq7uEfZbIUt.jpg">εκδοχή 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f02445c75323d28a5ead/m_p_s25q6Lu5HItPjqDs.jpg">εκδοχή 4</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f02745c75323d28a5eae/m_p_QJsAgl2zRfYmpNDL.jpg">εκδοχή 5</a>]</p><hr><p>Ευχαριστιακό δισκοπότηρο με εικόνα του αγίου Ιωάννη του Προδρόμου, ενός αγίου διακόνου (πιθανώς του Στεφάνου), αγίων επισκόπων και σταυρών. <a href="https://www.metmuseum.org/art/collection/search/466130">Μητροπολιτικό Μουσείο Τέχνης, Πέμπτη Λεωφόρος, ΗΠΑ</a>. 20,5 × 15,1 εκ., 369 γρ., 1100 ml</p><p>Η ελληνική επιγραφή: «<strong>Στον Άγιο Ιωάννη του χωριού Ατταρούθι</strong>».</p><img src="https://res.bibleox.com/s/img/image/simple/68b5ec4545c75323d28a5ea4/s_p_KWMPzINWo4ktBKQ7.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5ec4545c75323d28a5ea4/m_p_KWMPzINWo4ktBKQ7.jpg">μεγέθυνση</a>]</p><hr><p>Ευχαριστιακό δισκοπότηρο με εικόνα του Χριστού, της Θεοτόκου, του Ιωάννη του Προδρόμου, του Γεωργίου του Τροπαιοφόρου. <a href="https://www.metmuseum.org/art/collection/search/466129">Μητροπολιτικό Μουσείο Τέχνης, Πέμπτη Λεωφόρος, ΗΠΑ</a>. 24,3 × 16,8 εκ.</p><p>Η ελληνική επιγραφή: «<strong>Άγιος Στέφανος του χωριού Ατταρούθι</strong>».</p><img src="https://res.bibleox.com/s/img/image/simple/68b5ee1345c75323d28a5ea6/s_p_9bHxlNSj26b5EhMw.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5ee1345c75323d28a5ea6/m_p_9bHxlNSj26b5EhMw.jpg">μεγέθυνση</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5ee3c45c75323d28a5ea7/m_p_8XweLe1b1pD7GWHb.jpg">εκδοχή 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5ee4045c75323d28a5ea8/m_p_faMKsJUImltU9s6v.jpg">εκδοχή 3</a>]</p><hr><p>Ευχαριστιακό δισκοπότηρο με απεικόνιση του νεαρού Χριστού με σταυροφόρο φωτοστέφανο, ενός αγίου διακόνου με θυμιατό (πιθανώς του Αγίου Στεφάνου), της Παρθένου Μαρίας σε στάση προσευχής και ενός νεαρού αγίου με ράβδο. Διαστάσεις: 23,9 × 17 εκ., 356 γρ. <a href="https://www.metmuseum.org/art/collection/search/466141">Μητροπολιτικό Μουσείο Τέχνης, Πέμπτη Λεωφόρος, ΗΠΑ.</a></p><p>Η ελληνική επιγραφή: «<strong>Σε εκπλήρωση τάματος και για τη σωτηρία εκείνου του οποίου το όνομα γνωρίζει ο Κύριος</strong>».</p><img src="https://res.bibleox.com/s/img/image/simple/68b5fa7a45c75323d28a5ebe/s_p_7AzZiy4FebkdJC4e.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5fa7a45c75323d28a5ebe/m_p_7AzZiy4FebkdJC4e.jpg">μεγέθυνση</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5fa8345c75323d28a5ebf/m_p_LQnRTCSFvxz7O7ui.jpg">εκδοχή 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5fa8645c75323d28a5ec0/m_p_KvY9o90gFdzJeK9N.jpg">εκδοχή 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5fa8945c75323d28a5ec1/m_p_BUzuFJ6F1fLtMppI.jpg">εκδοχή 4</a>]</p><hr><p>Θυμιατό με απεικόνιση του νεαρού Χριστού με σταυροφόρο φωτοστέφανο, του αγίου Ιωάννη του Προδρόμου, της Παρθένου Μαρίας σε στάση προσευχής, ενός αγίου διακόνου (πιθανώς του Αγίου Στεφάνου) και σταυρών. Άργυρος και επίχρυσος άργυρος με χάλκινη επένδυση. Διαστάσεις: 41,5 × 13,2 × 12,6 εκ. <a href="https://www.metmuseum.org/art/collection/search/466132">Μητροπολιτικό Μουσείο Τέχνης, Πέμπτη Λεωφόρος, ΗΠΑ</a>.</p><p>Η ελληνική επιγραφή: «<strong>Υπέρ αναπαύσεως της ψυχής [των ψυχών] της Έρτας και του Στεφάνου, παιδιών του Κυριακού</strong>»</p><img src="https://res.bibleox.com/s/img/image/simple/68b5f15545c75323d28a5eaf/s_p_OJ2d0ec3h6BtKZQM.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5f15545c75323d28a5eaf/m_p_OJ2d0ec3h6BtKZQM.jpg">μεγέθυνση</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f15845c75323d28a5eb0/m_p_MLajjsEoJyZ7xPC7.jpg">εκδοχή 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f15c45c75323d28a5eb1/m_p_5k22minZ9Q7EruSj.jpg">εκδοχή 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f15e45c75323d28a5eb2/m_p_3cDRqzOwNAJr7A0S.jpg">εκδοχή 4</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f16145c75323d28a5eb3/m_p_8vKQQvQJKE8Mbtoc.jpg">εκδοχή 5</a>]</p><hr><p>Θυμιατό με απεικόνιση του νεαρού Χριστού με σταυροφόρο φωτοστέφανο, δύο αρχαγγέλων και σταυρών. 8,2 × 13,2 εκ. <a href="https://www.metmuseum.org/art/collection/search/466131">Μητροπολιτικό Μουσείο Τέχνης, Πέμπτη Λεωφόρος, ΗΠΑ</a>.</p><p>Η ελληνική επιγραφή: «<strong>Στον Άγιο Ιωάννη του χωριού Ατταρούθι</strong>».</p><img src="https://res.bibleox.com/s/img/image/simple/68b5f27545c75323d28a5eb4/s_p_brjJXh3ZIrplms0E.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5f27545c75323d28a5eb4/m_p_brjJXh3ZIrplms0E.jpg">μεγέθυνση</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f28545c75323d28a5eb5/m_p_oWtx1CexyxQIAxRK.jpg">εκδοχή 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f28845c75323d28a5eb6/m_p_zqvxcBdCxjLqltWh.jpg">εκδοχή 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f28c45c75323d28a5eb7/m_p_fIVExsqDAbrZLhWW.jpg">εκδοχή 4</a>]</p><h3>Ευχαριστιακά δισκοπότηρα με απεικονίσεις του Χριστού και των αγίων, δισκάριο με σταυρό (Συρία, Βυζάντιο)</h3><p>500–700. Μουσείο Τέχνης του Κλίβελαντ, ΗΠΑ: <a href="https://www.clevelandart.org/art/1950.378">1</a>, <a href="https://www.clevelandart.org/art/1950.379">2</a>, <a href="https://www.clevelandart.org/art/1950.380">3</a>, <a href="https://www.clevelandart.org/art/1950.381">4</a>.</p><p>Αυτά τα τέσσερα αργυρά λειτουργικά σκεύη, ένα δισκάριο και τρία δισκοπότηρα (αρ. 1950.378–81), αποτελούν τον σήμερα λεγόμενο «Θησαυρό της Βηθ Μισόνα», από το όνομα του χωριού της βόρειας Συρίας για το οποίο κατασκευάστηκαν.</p><p>Αν και ο ακριβής τόπος και οι συνθήκες της εύρεσης είναι άγνωστοι, οι κάτοικοι της Βηθ Μισόνα, όπως και άλλες χριστιανικές κοινότητες στη Συρία και την Παλαιστίνη, πιθανότατα αναγκάστηκαν να θάψουν τα ασημικά της εκκλησίας για να τα κρύψουν από τους Πέρσες ή τους Άραβες που κατέκτησαν τα εδάφη τους στο πρώτο μισό του 7ου αιώνα.</p><p>Το δισκάριο, πάνω στο οποίο βρίσκονταν οι ευχαριστιακές μερίδες κατά τη Λειτουργία, είναι διακοσμημένο με χαραγμένο λατινικό σταυρό που περιβάλλεται από αφιερωματική επιγραφή. Σε αυτήν αναφέρεται ο δωρητής του δισκαρίου, ο Δόμνος, και ο αρχικός του τόπος, ο ναός του Αγίου Σεργίου στη Βηθ Μισόνα.</p><p>Τα δισκοπότηρα έχουν φαρδιά κύπελλα, διακοσμημένα με προτομές του Χριστού, της Θεοτόκου και των αποστόλων Πέτρου και Παύλου. Ένα από τα δισκοπότηρα έχει αφιερωματική επιγραφή με το όνομα του δωρητή, Κυριακού του Δόμνου, και του ιερέα του ναού που δέχτηκε αυτή την ευσεβή προσφορά, Ζήνωνος.</p><p>Η ελληνική επιγραφή: «<strong>+ Ο ιερέας ΚΥΡΙΑΚΟΣ, γιος του ΔΟΜΝΟΥ, (πρόσφερε αυτό το δισκοπότηρο) στον Άγιο Σέργιο επί του ιερέως Ζήνωνος</strong>»</p><img src="https://res.bibleox.com/s/img/image/simple/68caa03c205184ec278d5880/s_p_SB8idWRkPX7keKkU.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68caa03c205184ec278d5880/m_p_SB8idWRkPX7keKkU.jpg">Χριστός</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68caa026205184ec278d587d/m_p_sYIDwGwUI9iMAzzD.jpg">Θεοτόκος</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68caa029205184ec278d587e/m_p_xYnPNjrcxGm5mJgl.jpg">Απόστολος</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68caa02c205184ec278d587f/m_p_kH9idfsikXyvAVvy.jpg">Απόστολος</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68caa0d4205184ec278d5881/m_p_vWERSBBMAoytSNnX.jpg">κάτοψη</a>]</p><hr><img src="https://res.bibleox.com/s/img/image/simple/68ca9cd5205184ec278d5874/s_p_tH0J7uqAriM7uaeK.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68ca9cd5205184ec278d5874/m_p_tH0J7uqAriM7uaeK.jpg">Χριστός</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68ca9d13205184ec278d5878/m_p_tYRbn15h6MPNUilS.jpg">Θεοτόκος</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68ca9ce8205184ec278d5875/m_p_FKfoi68UXlWCS5ky.jpg">Απόστολος</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68ca9ceb205184ec278d5876/m_p_Zp9CJ61HnBcr8Csr.jpg">Απόστολος</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68ca9cee205184ec278d5877/m_p_w2JDvDj5c4pMVcfk.jpg">κάτοψη</a>]</p><hr><img src="https://res.bibleox.com/s/img/image/simple/68ca9e94205184ec278d5879/s_p_27LzQUQDD3A7nI9X.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68ca9e94205184ec278d5879/m_p_27LzQUQDD3A7nI9X.jpg">Χριστός</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68ca9e98205184ec278d587a/m_p_R47Eqr4GrHijUSIb.jpg">Θεοτόκος</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68ca9e9b205184ec278d587b/m_p_31NEBZQIYBEqOut0.jpg">Απόστολος</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68ca9e9e205184ec278d587c/m_p_QxtJHMZORGGwFxYQ.jpg">Απόστολος</a>]</p><hr><p>Περ. 500. Δισκάριο. <a href="https://www.clevelandart.org/art/1950.381">Μουσείο Τέχνης του Κλίβελαντ, ΗΠΑ</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68ca964d205184ec278d5873/s_p_wNDEaPHmGHiuWeZy.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68ca964d205184ec278d5873/m_p_wNDEaPHmGHiuWeZy.jpg">μεγέθυνση</a>]</p><h3>Θυμιατό. Η Βάπτιση και η Σταύρωση του Κυρίου Ιησού Χριστού (Βυζάντιο)</h3><p>500–899. Διαστάσεις: 13,4 × 9 εκ. <a href="https://collections.louvre.fr/en/ark:/53355/cl010042067">Λούβρο, Γαλλία</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c4068e6594f46d35a87efe/s_p_3kaCIWMTmQfT4NFG.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c4068e6594f46d35a87efe/m_p_3kaCIWMTmQfT4NFG.jpg">μεγέθυνση</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/68c4061f6594f46d35a87efc/s_p_XNlsrfQ2MOphupt9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c4061f6594f46d35a87efc/m_p_XNlsrfQ2MOphupt9.jpg">μεγέθυνση</a>]</p><h3>Αγγείο. Ο Χριστός, η Θεοτόκος, ο Ιωάννης ο Βαπτιστής, απόστολοι, άγγελοι (Κωνσταντινούπολη)</h3><img src="https://res.bibleox.com/s/img/image/simple/68c420e46594f46d35a87f06/s_p_iADN1OW5uYg5Wovc.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c420e46594f46d35a87f06/m_p_iADN1OW5uYg5Wovc.jpg">μεγέθυνση</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c420e76594f46d35a87f07/m_p_oAs6ecjPj32iGMce.jpg">πίσω όψη</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c421216594f46d35a87f0f/m_p_x6q5apwWB0DZirK2.jpg">Χριστός</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c420fc6594f46d35a87f0b/m_p_sL17qrWgxkRCNRBb.jpg">Θεοτόκος</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c420ea6594f46d35a87f08/m_p_Cb0UJi1oxoKCQaXw.jpg">Ιωάννης ο Βαπτιστής</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c421016594f46d35a87f0c/m_p_a9Y1fyPNxcQ4oNbq.jpg">άγγελος</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c420f66594f46d35a87f0a/m_p_nAqhqDbP5x8fRAnj.jpg">άγγελος</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c420ef6594f46d35a87f09/m_p_F9R3iyZ8go0PxARb.jpg">απόστολος</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c4210a6594f46d35a87f0e/m_p_97cyzUvq95UJZOrR.jpg">απόστολος</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c421056594f46d35a87f0d/m_p_WfK6SdjAqAOW9fDK.jpg">απόστολος</a>]</p><h3>Θωρακικός σταυρός με εικόνα (Βυζάντιο)</h3><p>6ος αιώνας.<strong> </strong>Χρυσός, πάστα, ορεία κρύσταλλος, γυαλί· σφυρηλάτηση, κοκκίδωση. Μήκος αλυσίδας: 33 εκ.· σταυρός: 4,9 × 3,8 εκ. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/227027?page=46&amp;query=%D0%BA%D1%80%D0%B5%D1%81%D1%82&amp;sort=112&amp;index=2288">Ερμιτάζ, Ρωσία</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c11e3c6594f46d35a87e2c/s_p_9GZmzTSaUVuXXaX1.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c11e3c6594f46d35a87e2c/m_p_9GZmzTSaUVuXXaX1.jpg">μεγέθυνση</a>]</p><h3>Μενταγιόν. Η Σταύρωση του Χριστού (Αίγυπτος)</h3><p>500–700. Διαστάσεις: 3,3 × 1,9 εκ. <a href="https://collections.louvre.fr/en/ark:/53355/cl010102800">Λούβρο, Γαλλία</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c41c4e6594f46d35a87f03/s_p_tiaBwT9vqOXIlsIw.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c41c4e6594f46d35a87f03/m_p_tiaBwT9vqOXIlsIw.jpg">μεγέθυνση</a>]</p><h3>Εικόνα δύο αγίων (Βυζάντιο)</h3><p>6ος αιώνας· 25,5 × 22 × 1,3 εκ. Ίσως οι ευαγγελιστές Ματθαίος και Ιωάννης. <a href="https://www.metmuseum.org/art/collection/search/468198">Μητροπολιτικό Μουσείο Τέχνης, Πέμπτη Λεωφόρος, ΗΠΑ</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5fc1545c75323d28a5ec3/s_p_a2FJmSgsGJRdELBq.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5fc1545c75323d28a5ec3/m_p_a2FJmSgsGJRdELBq.jpg">μεγέθυνση</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5fc1945c75323d28a5ec4/m_p_pcvRiRfRgBcuHJEA.jpg">εκδοχή 2</a>]</p><h3>Εικόνες των αποστόλων Πέτρου και Παύλου (Αντιόχεια)</h3><p>550–600. Ο απόστολος Πέτρος. <a href="https://www.metmuseum.org/art/collection/search/468348">Μητροπολιτικό Μουσείο Τέχνης, Πέμπτη Λεωφόρος, ΗΠΑ</a>. Άργυρος. 38,1 × 55,9 × 2,2 εκ.</p><img src="https://res.bibleox.com/s/img/image/simple/68c1bfd36594f46d35a87e6f/s_p_WguE3h0pnnzXQXwt.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1bfd36594f46d35a87e6f/m_p_WguE3h0pnnzXQXwt.jpg">μεγέθυνση</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c1bfd56594f46d35a87e70/m_p_83EvKNt1mFSPspQw.jpg">μεγαλύτερη μεγέθυνση</a>]</p><p>550–600. Ο απόστολος Παύλος. <a href="https://www.metmuseum.org/art/collection/search/468347">Μητροπολιτικό Μουσείο Τέχνης, Πέμπτη Λεωφόρος, ΗΠΑ</a>. Άργυρος. 38,1 × 55,9 × 2,2 εκ.</p><img src="https://res.bibleox.com/s/img/image/simple/68c1bfda6594f46d35a87e71/s_p_5Y11faCyEzohnydQ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1bfda6594f46d35a87e71/m_p_5Y11faCyEzohnydQ.jpg">μεγέθυνση</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c1bfdd6594f46d35a87e72/m_p_jGCYAnYdrt4tlXhd.jpg">μεγαλύτερη μεγέθυνση</a>]</p><h3>Εικόνα (Συρία;, Βυζάντιο)</h3><p>Δεκαετίες του 500. <a href="https://www.clevelandart.org/art/1941.57">Μουσείο Τέχνης του Κλίβελαντ, ΗΠΑ</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68caa8cd205184ec278d5883/s_p_qr7HPRgCtcCRwsvb.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68caa8cd205184ec278d5883/m_p_qr7HPRgCtcCRwsvb.jpg">μεγέθυνση</a>]</p><h3>Απεικόνιση στρατιωτικού αγίου (κοπτική Αίγυπτος)</h3><p>6ος–7ος αιώνας. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/180444?page=6&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=253">Ερμιτάζ, Ρωσία</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c3c06480b4d28532041c/s_p_Rnquar8nZacdzqcP.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c3c06480b4d28532041c/m_p_Rnquar8nZacdzqcP.jpg">μεγέθυνση</a>]</p><h3>Αμπούλα με εικόνα του απόστολου Παύλου (;) και της αγίας Θέκλας (Αίγυπτος)</h3><p>500–700. <a href="https://collections.louvre.fr/en/ark:/53355/cl010280955">Λούβρο, Γαλλία</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c4390d6594f46d35a87f15/s_p_Zxs1yv3Jg8oKfFHW.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c4390d6594f46d35a87f15/m_p_Zxs1yv3Jg8oKfFHW.jpg">μεγέθυνση</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/68c4390a6594f46d35a87f14/s_p_CPdXMrLBUE0satoH.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c4390a6594f46d35a87f14/m_p_CPdXMrLBUE0satoH.jpg">μεγέθυνση</a>]</p><h3>Αμπούλα με εικόνα του απόστολου Ανδρέα (Σμύρνη)</h3><p>500–600. <a href="https://collections.louvre.fr/en/ark:/53355/cl010281050">Λούβρο, Γαλλία</a>. 7 × 5 × 2,8 εκ.</p><img src="https://res.bibleox.com/s/img/image/simple/68c437966594f46d35a87f13/s_p_dCGVNUwg3KWvs9zz.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c437966594f46d35a87f13/m_p_dCGVNUwg3KWvs9zz.jpg">μεγέθυνση</a>]</p><h3>Αμπούλες με εικόνα του αγίου Μηνά</h3><p>610–650. Αμπούλα με απεικόνιση του αγίου Μηνά (Αίγυπτος). <a href="https://www.metmuseum.org/art/collection/search/475416">Μητροπολιτικό Μουσείο Τέχνης, Πέμπτη Λεωφόρος, ΗΠΑ</a>. 8,5 × 6,9 × 1,8 εκ.</p><img src="https://res.bibleox.com/s/img/image/simple/68c1c1396594f46d35a87e73/s_p_KIdJIYWMysre63rP.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1c1396594f46d35a87e73/m_p_KIdJIYWMysre63rP.jpg">μεγέθυνση</a>]</p><hr><p>500–750. <a href="https://collections.louvre.fr/en/ark:/53355/cl010044285">Λούβρο, Γαλλία</a>. 13 × 10,6 × 3,4 εκ.</p><img src="https://res.bibleox.com/s/img/image/simple/68c3bc556594f46d35a87ebd/s_p_iHBRxhobWKvQb2Dx.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3bc556594f46d35a87ebd/m_p_iHBRxhobWKvQb2Dx.jpg">μεγέθυνση</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/68c3bc5c6594f46d35a87ebe/s_p_fQ8Ps5eHBD1myJaS.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3bc5c6594f46d35a87ebe/m_p_fQ8Ps5eHBD1myJaS.jpg">μεγέθυνση</a>]</p><h3>Ο Χριστός (Ραβέννα)</h3><p>Ναός Sant’Apollinare in Classe, Ραβέννα, Ιταλία.</p><img src="https://res.bibleox.com/s/img/image/simple/675005d5dba77200011c73ad/s_p_rjjDEzNckea3oHk2.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/675005d5dba77200011c73ad/m_p_rjjDEzNckea3oHk2.jpg">μεγέθυνση</a>]</p><h3>Ο Χριστός και οι απόστολοι (Ραβέννα)</h3><p>Ψηφιδωτό του πρεσβυτερίου. Ναός San Vitale, Ραβέννα, Ιταλία.</p><img src="https://res.bibleox.com/s/img/image/simple/675005dadba77200011c73ae/s_p_Nac2nrVo791COrcO.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/675005dadba77200011c73ae/m_p_Nac2nrVo791COrcO.jpg">μεγέθυνση</a>]</p><h3>Ο Χριστός, άγγελοι και ο Βιτάλιος (Ραβέννα)</h3><p>6ος αιώνας. Βασιλική του Αγίου Βιταλίου του Μεδιολάνων, Ραβέννα.</p><img src="https://res.bibleox.com/s/img/image/simple/674f0ab3dba77200011c738f/s_p_AsShtty0gMBFOX5X.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f0ab3dba77200011c738f/m_p_AsShtty0gMBFOX5X.jpg">μεγέθυνση</a>]</p><h3>Ο ευσεβής αυτοκράτορας Ιουστινιανός (Ραβέννα)</h3><p>6ος αιώνας. Βασιλική του Αγίου Βιταλίου του Μεδιολάνων, Ραβέννα.</p><img src="https://res.bibleox.com/s/img/image/simple/674f0ab8dba77200011c7390/s_p_MsUwTeWDMk0uEVPq.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f0ab8dba77200011c7390/m_p_MsUwTeWDMk0uEVPq.jpg">μεγέθυνση</a>]</p><h3>Η ευσεβής αυτοκράτειρα Θεοδώρα (Ραβέννα)</h3><p>6ος αιώνας. Βασιλική του Αγίου Βιταλίου του Μεδιολάνων, Ραβέννα.</p><img src="https://res.bibleox.com/s/img/image/simple/674f0ac0dba77200011c7391/s_p_6g0s1g1btiJBEXSR.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f0ac0dba77200011c7391/m_p_6g0s1g1btiJBEXSR.jpg">μεγέθυνση</a>]</p><h3>Ο προπάτορας Αβραάμ (Ραβέννα)</h3><p>6ος αιώνας. Βασιλική του Αγίου Βιταλίου του Μεδιολάνων, Ραβέννα.</p><img src="https://res.bibleox.com/s/img/image/simple/674f0ad6dba77200011c7393/s_p_zgb5TLR1yafutIu4.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f0ad6dba77200011c7393/m_p_zgb5TLR1yafutIu4.jpg">μεγέθυνση</a>]</p><h3>Ο Άβελ και ο Μελχισεδέκ (Ραβέννα)</h3><p>6ος αιώνας. Βασιλική του Αγίου Βιταλίου του Μεδιολάνων, Ραβέννα.</p><img src="https://res.bibleox.com/s/img/image/simple/674f0adbdba77200011c7394/s_p_PiL9TaItwhR28eXN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f0adbdba77200011c7394/m_p_PiL9TaItwhR28eXN.jpg">μεγέθυνση</a>]</p><h3>Μαρκελλίνος, Πολλίων, Πέτρος, άγιοι (Ρώμη)</h3><p>6ος αιώνας. Κατακόμβη του Ποντιανού. Τοιχογραφία.</p><img src="https://res.bibleox.com/s/img/image/simple/66cc2c4adba77200019bc7d9/s_p_th5E9srmqGjUT72T.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/66cc2c4adba77200019bc7d9/m_p_th5E9srmqGjUT72T.jpg">μεγέθυνση</a>]</p><h3>Ο Χριστός ερχόμενος επί των νεφελών, οι απόστολοι και οι άγιοι Κοσμάς και Δαμιανός (Ρώμη)</h3><p>6ος αιώνας (530). Βασιλική των Αγίων Κοσμά και Δαμιανού. [19][20]</p><img src="https://res.bibleox.com/s/img/image/simple/686aa5b35f47da2505d3ae28/s_p_V2YyLyiR7wCHgIfW.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa5b35f47da2505d3ae28/m_p_V2YyLyiR7wCHgIfW.jpg">μεγέθυνση</a>]</p><p>Ο απόστολος Πέτρος και ο άγιος Κοσμάς (πιο πέρα ο άγιος Θεόδωρος)</p><img src="https://res.bibleox.com/s/img/image/simple/686aa5d25f47da2505d3ae29/s_p_s66jgQ3tkVAmQEZE.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa5d25f47da2505d3ae29/m_p_s66jgQ3tkVAmQEZE.jpg">μεγέθυνση</a>]</p><p>Ο απόστολος Παύλος και ο άγιος Δαμιανός (πιο πέρα ο πάπας Φήλιξ)</p><img src="https://res.bibleox.com/s/img/image/simple/686aa7505f47da2505d3ae2c/s_p_WA1eP9P7BNe0aPQ6.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa7505f47da2505d3ae2c/m_p_WA1eP9P7BNe0aPQ6.jpg">μεγέθυνση</a>]</p><p>Άγιος άγγελος</p><img src="https://res.bibleox.com/s/img/image/simple/686aa61c5f47da2505d3ae2a/s_p_MD4QowA5HKQRhFFG.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa61c5f47da2505d3ae2a/m_p_MD4QowA5HKQRhFFG.jpg">μεγέθυνση</a>]</p><h3>Ο Χριστός και οι απόστολοι (Ρώμη)</h3><p>6ος αιώνας (578–590). Βασιλική του Αγίου Λαυρεντίου εκτός των τειχών (San Lorenzo fuori le Mura) [21][22]</p><p>Δίπλα στον απόστολο Παύλο οι άγιοι Στέφανος και Ιππόλυτος. Δίπλα στον απόστολο Πέτρο ο άγιος Λαυρέντιος.</p><img src="https://res.bibleox.com/s/img/image/simple/686aabc85f47da2505d3ae2e/s_p_xa4IU82mZb80Uija.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aabc85f47da2505d3ae2e/m_p_xa4IU82mZb80Uija.jpg">μεγέθυνση</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686aab945f47da2505d3ae2d/s_p_21M69l0ODfpN75oh.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aab945f47da2505d3ae2d/m_p_21M69l0ODfpN75oh.jpg">μεγέθυνση</a>]</p><h3>Οι απόστολοι Πέτρος και Παύλος (Φράγκοι)</h3><p>6ος–8ος αιώνας. <a href="https://www.metmuseum.org/art/collection/search/464497">Μητροπολιτικό Μουσείο Τέχνης, Πέμπτη Λεωφόρος, ΗΠΑ</a> (και <a href="https://www.metmuseum.org/art/collection/search/464496">εδώ</a>). Ελεφαντόδοντο. 29,2 × 11,4 × 0,5 εκ.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5ff8145c75323d28a5ec8/s_p_WhZZPyHo1I7oF79K.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5ff8145c75323d28a5ec8/m_p_WhZZPyHo1I7oF79K.jpg">μεγέθυνση</a>]</p><h3>Άγιοι (Βυζάντιο, Αίγυπτος)</h3><p>6ος–7ος αιώνας. <a href="https://www.metmuseum.org/art/collection/search/854019">Μητροπολιτικό Μουσείο Τέχνης, Πέμπτη Λεωφόρος, ΗΠΑ</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68b6007445c75323d28a5ec9/s_p_DNQuRcpcjfkINQ1r.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b6007445c75323d28a5ec9/m_p_DNQuRcpcjfkINQ1r.jpg">μεγέθυνση</a>]</p><h3>Ο άγιος Φωκάς (Βυζάντιο, Χερσόνησος)</h3><p>6ος αιώνας. Σφραγίδα για την παρασκευή ευλογιών με ανάγλυφη μορφή του αγίου <a href="https://azbyka.ru/days/sv-foka-sinopskij">Φωκά του Σινώπης</a>, που στέκεται σε βάρκα. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/373084?page=2&amp;fundcoll=1420520446&amp;index=75">Ερμιτάζ, Ρωσία</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863bee26480b4d285320410/s_p_s0nPEGgpeMtakrof.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863bee26480b4d285320410/m_p_s0nPEGgpeMtakrof.jpg">μεγέθυνση</a>]</p><h3>Αμπούλα με δύο απεικονίσεις αγίων (Μικρά Ασία, Έφεσος)</h3><p>6ος αιώνας. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/228313?page=44&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=2166">Ερμιτάζ, Ρωσία</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c0e76480b4d285320414/s_p_KnTGMdyOhsmTAD0S.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c0e76480b4d285320414/m_p_KnTGMdyOhsmTAD0S.jpg">μεγέθυνση</a>]</p><h3>Αμπούλα με απεικονίσεις ευαγγελιστή και αγίου: Ιωάννης ο Θεολόγος και Πρόχορος (Έφεσος)</h3><p>6ος αιώνας. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/228314?page=33&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=1646">Ερμιτάζ, Ρωσία</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c1726480b4d285320415/s_p_oBnXQZmCz1EntIFw.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c1726480b4d285320415/m_p_oBnXQZmCz1EntIFw.jpg">μεγέθυνση</a>]</p><h3>Μολυβδόβουλλο με απεικόνιση των αγίων Πέτρου και Παύλου και λατινική επιγραφή (Βυζάντιο)</h3><p>6ος–7ος αιώνας. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/131338?page=33&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=1639">Ερμιτάζ, Ρωσία</a>. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/161973?page=33&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=1640">Άλλο έκθεμα</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c19d6480b4d285320416/s_p_JKBi7CXiDOutHIFn.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c19d6480b4d285320416/m_p_JKBi7CXiDOutHIFn.jpg">μεγέθυνση</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6863c22c6480b4d285320417/s_p_FmbNOmLfDrj3qYOz.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c22c6480b4d285320417/m_p_FmbNOmLfDrj3qYOz.jpg">μεγέθυνση</a>]</p><h3>Μολυβδόβουλλο με απεικόνιση του Χριστού (Βυζάντιο)</h3><p>6ος–7ος αιώνας. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/117792?page=6&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%B0&amp;index=269">Ερμιτάζ, Ρωσία</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c4a86480b4d28532041f/s_p_Uy0EgcXKfuHnv9bX.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c4a86480b4d28532041f/m_p_Uy0EgcXKfuHnv9bX.jpg">μεγέθυνση</a>]</p><h3>Μολυβδόβουλλο με απεικόνιση του Χριστού και μονόγραμμα (Βυζάντιο)</h3><p>6ος–7ος αιώνας. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/117804?page=3&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%B0&amp;index=143">Ερμιτάζ, Ρωσία</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c5a16480b4d285320422/s_p_JNdWhUPj9cA9Dvoq.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c5a16480b4d285320422/m_p_JNdWhUPj9cA9Dvoq.jpg">μεγέθυνση</a>]</p><h2>7ος αιώνας</h2><h3>Εικόνα του Χριστού σε γαμήλιο δαχτυλίδι (Βυζάντιο)</h3><p>600–700. Ελληνικές επιγραφές στο δαχτυλίδι: <strong>ΟΜΟΝΟΙΑ</strong>· <strong>ΕΙΡΙΝΗΝ ΤΗΝ ΕΜΙΝ ΔΙΔΟΜ</strong> — «εἰρήνην τὴν ἐμὴν δίδωμι ὑμῖν» (<a href="https://bibleox.com/el/gr-lxx-byz/in/14/#L27">Ιω 14:27</a>). <a href="https://collections.louvre.fr/en/ark:/53355/cl010102797">Λούβρο, Γαλλία</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c402726594f46d35a87ef8/s_p_6nMwdRXMjOnhQWfu.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c402726594f46d35a87ef8/m_p_6nMwdRXMjOnhQWfu.jpg">μεγέθυνση</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c4027c6594f46d35a87ef9/m_p_pNTvaGVW4AmLG2BK.jpg">εκδοχή 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c4027e6594f46d35a87efa/m_p_mvU9wZQKEIl0lFZY.jpg">εκδοχή 3</a>]</p><h3>Αμπούλα με εικόνα. Ο Χριστός, η Σταύρωση και η Ανάληψη (Παλαιστίνη, Βυζάντιο)</h3><p>Αρχές του 600. <a href="https://www.clevelandart.org/art/1999.46">Μουσείο Τέχνης του Κλίβελαντ, ΗΠΑ</a>. Κράμα κασσιτέρου-μολύβδου με δερμάτινα μέρη.</p><img src="https://res.bibleox.com/s/img/image/simple/68caa8cf205184ec278d5884/s_p_QfQLEBTpKbF2IfJo.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68caa8cf205184ec278d5884/m_p_QfQLEBTpKbF2IfJo.jpg">μεγέθυνση</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68caaaaf205184ec278d5887/m_p_YFRVXxytSNharyj8.jpg">εκδοχή 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68caaab2205184ec278d5888/m_p_GguW2EcCVatptKzX.jpg">εκδοχή 3</a>]</p><h3>Η Θεοτόκος και ο μεγαλομάρτυρας Θεόδωρος ο Στρατηλάτης (Θεσσαλονίκη, Βυζάντιο)</h3><p>7ος–10ος αιώνας (;). Βασιλική του Αγίου Δημητρίου στη Θεσσαλονίκη. Ψηφιδωτό στη νότια πλευρά του βόρειου πεσσού.</p><img src="https://res.bibleox.com/s/img/image/simple/686985345f47da2505d3ae12/s_p_HWoRkey7yaGM1D4s.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686985345f47da2505d3ae12/m_p_HWoRkey7yaGM1D4s.jpg">μεγέθυνση</a>]</p><h3>Ο μεγαλομάρτυρας Δημήτριος και οι κτήτορες: ο αρχιεπίσκοπος και ο έπαρχος (Θεσσαλονίκη, Βυζάντιο)</h3><p>7ος αιώνας. Βασιλική του Αγίου Δημητρίου στη Θεσσαλονίκη. Ψηφιδωτό.</p><img src="https://res.bibleox.com/s/img/image/simple/686986dc5f47da2505d3ae13/s_p_ZMXi7hFVOfpu7jbC.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686986dc5f47da2505d3ae13/m_p_ZMXi7hFVOfpu7jbC.jpg">μεγέθυνση</a>]</p><h3>Ο άγιος Γεώργιος και παιδιά (Θεσσαλονίκη, Βυζάντιο)</h3><p>7ος αιώνας. Βασιλική του Αγίου Δημητρίου στη Θεσσαλονίκη. Το ψηφιδωτό βρίσκεται στο δυτικό τμήμα του ιερού.</p><img src="https://res.bibleox.com/s/img/image/simple/686987645f47da2505d3ae14/s_p_boH6uu2omR2Gjxxx.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686987645f47da2505d3ae14/m_p_boH6uu2omR2Gjxxx.jpg">μεγέθυνση</a>]</p><h3>Ο άγιος Σέργιος (Θεσσαλονίκη, Βυζάντιο)</h3><p>7ος αιώνας. Βασιλική του Αγίου Δημητρίου στη Θεσσαλονίκη. Ψηφιδωτό σε πεσσό του ιερού.</p><img src="https://res.bibleox.com/s/img/image/simple/686989925f47da2505d3ae15/s_p_Faf5BLFz9WISBGej.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686989925f47da2505d3ae15/m_p_Faf5BLFz9WISBGej.jpg">μεγέθυνση</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a742205184ec278d6fb4/m_p_YV1I98bvx4Nn6cUn.jpg">εκδοχή 2</a>]</p><h3>Εικόνα του αγίου προφήτη Δαβίδ (Κωνσταντινούπολη, Βυζάντιο)</h3><p>629–630. <a href="https://www.metmuseum.org/art/collection/search/464380">Μητροπολιτικό Μουσείο Τέχνης, Πέμπτη Λεωφόρος, ΗΠΑ</a>. Άργυρος. 26,6 × 4 εκ., 1397 γρ. Βλέπε επίσης: <a href="https://www.metmuseum.org/art/collection/search/464378">1</a>, <a href="https://www.metmuseum.org/art/collection/search/464375">2</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c1c3426594f46d35a87e75/s_p_5U20dlUc30xkfJeN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1c3426594f46d35a87e75/m_p_5U20dlUc30xkfJeN.jpg">μεγέθυνση</a>]</p><h3>Μολυβδόβουλλο με απεικόνιση αγίου και επιγραφή (Βυζάντιο)</h3><p>7ος αιώνας. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/270001?page=17&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=840">Ερμιτάζ, Ρωσία</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c2966480b4d285320419/s_p_EY1IyPYdMzjgztlB.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c2966480b4d285320419/m_p_EY1IyPYdMzjgztlB.jpg">μεγέθυνση</a>]</p><h3>Μολυβδόβουλλο με προτομή του Χριστού και μονόγραμμα (Βυζάντιο)</h3><p>7ος αιώνας. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/231980?page=2&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%B0&amp;index=96">Ερμιτάζ, Ρωσία</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c6076480b4d285320423/s_p_YFjOrZh2fLGJgpYJ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c6076480b4d285320423/m_p_YFjOrZh2fLGJgpYJ.jpg">μεγέθυνση</a>]</p><h3>Μολυβδόβουλλο με απεικόνιση του Χριστού και μονόγραμμα (Βυζάντιο)</h3><p>7ος αιώνας. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/172196?page=2&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%B0&amp;index=57">Ερμιτάζ, Ρωσία</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c64d6480b4d285320424/s_p_RQupAUUa4gGtXt2n.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c64d6480b4d285320424/m_p_RQupAUUa4gGtXt2n.jpg">μεγέθυνση</a>]</p><h2>8ος αιώνας</h2><h3>Η Θεοτόκος και ο Ιησούς βρέφος (Κωνσταντινούπολη, Βυζάντιο)</h3><p>Ναός της Του Θεού Σοφίας (Αγία Σοφία).</p><img src="https://res.bibleox.com/s/img/image/simple/674f31b0dba77200011c73a2/s_p_2AO12RGOQ2yqRiP4.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f31b0dba77200011c73a2/m_p_2AO12RGOQ2yqRiP4.jpg">μεγέθυνση</a>]</p><h3>Ο αρχάγγελος Γαβριήλ (Κωνσταντινούπολη, Βυζάντιο)</h3><p>Ναός της Του Θεού Σοφίας (Αγία Σοφία).</p><img src="https://res.bibleox.com/s/img/image/simple/674f3256dba77200011c73a4/s_p_rfkKZFQ8IYfO6L7V.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f3256dba77200011c73a4/m_p_rfkKZFQ8IYfO6L7V.jpg">μεγέθυνση</a>]</p><h3>Ο Χριστός, η Σταύρωση και η Ανάσταση (Μετς, Γαλλία)</h3><p>870. <a href="https://collections.louvre.fr/en/ark:/53355/cl010113244">Λούβρο, Γαλλία</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c422e46594f46d35a87f10/s_p_lQNRJIXri6KJoLw3.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c422e46594f46d35a87f10/m_p_lQNRJIXri6KJoLw3.jpg">μεγέθυνση</a>]</p><h3>Ο Χριστός, η Σταύρωση (Ρενς, Γαλλία)</h3><p>870–880. <a href="https://collections.louvre.fr/en/ark:/53355/cl010098469">Λούβρο, Γαλλία</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c423bc6594f46d35a87f11/s_p_NOhnffTlgTImIczW.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c423bc6594f46d35a87f11/m_p_NOhnffTlgTImIczW.jpg">μεγέθυνση</a>]</p><h2>9ος αιώνας</h2><h3>Η Ανάληψη του Χριστού (Θεσσαλονίκη, Βυζάντιο)</h3><p>9ος–10ος αιώνας. Ροτόντα του Αγίου Γεωργίου του Τροπαιοφόρου (αρχικά τάφος του αυτοκράτορα Γαλερίου). Τοιχογραφία [17][18]</p><img src="https://res.bibleox.com/s/img/image/simple/686a934c5f47da2505d3ae20/s_p_klfYhHum7wZvKR9D.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686a934c5f47da2505d3ae20/m_p_klfYhHum7wZvKR9D.jpg">μεγέθυνση</a>]</p><h3>Ο Χριστός, χάλκινο μετάλλιο (Βυζάντιο)</h3><p>9ος–10ος αιώνας. Μετάλλια ονομάζονται οι στρογγυλές απεικονίσεις. <a href="https://www.britishmuseum.org/collection/object/H_1880-0820-9">Βρετανικό Μουσείο</a>. Διάμετρος: 3,5 εκ.</p><p>Circular medallion; bronze; bust of Christ with cruciferous nimbus holding the book of the gospel in his left hand; inscription either side.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5be2d45c75323d28a5e92/s_p_GswK2cGnuxxnLfJr.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5be2d45c75323d28a5e92/m_p_GswK2cGnuxxnLfJr.jpg">μεγέθυνση</a>]</p><h3>Η Κοίμηση της Θεοτόκου (Βυζάντιο)</h3><p>Τέλη 9ου αιώνα. <a href="https://www.metmuseum.org/art/collection/search/464013">Μητροπολιτικό Μουσείο Τέχνης, Πέμπτη Λεωφόρος, ΗΠΑ</a>. Υλικό: ελεφαντόδοντο. 18,6 × 14,8 × 1,1 εκ.</p><p>New York. The Metropolitan Museum of Art. "The Glory of Byzantium,". Images of the Koimesis, or the Dormition in the West, show the Virgin lying on a bier, while her soul, represented as a baby, is offered by Christ to attendant angels who will take it to heaven. The apostles, led by Saints Paul and Peter, stand witness.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5c1bf45c75323d28a5e97/s_p_0Hg1bO8KIUVBSWJs.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5c1bf45c75323d28a5e97/m_p_0Hg1bO8KIUVBSWJs.jpg">μεγέθυνση</a>]</p><h3>Ο Χριστός, η Θεοτόκος, ο Ιωάννης ο Βαπτιστής, απόστολοι και άλλοι άγιοι (Κωνσταντινούπολη)</h3><p>940–960. <a href="https://collections.louvre.fr/en/ark:/53355/cl010112515">Λούβρο, Γαλλία</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c424276594f46d35a87f12/s_p_IlqGrJe04Ic0YFWv.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c424276594f46d35a87f12/m_p_IlqGrJe04Ic0YFWv.jpg">μεγέθυνση</a>]</p><h3>Πλακίδιο με απεικόνιση του Χριστού και των αποστόλων (Ιταλία)</h3><p>9ος αιώνας. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/228918?page=4&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%B0&amp;index=194">Ερμιτάζ, Ρωσία</a>. Διαστάσεις: 12,2 × 10,5 εκ.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c54f6480b4d285320421/s_p_aLvOvrKuilB614SS.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c54f6480b4d285320421/m_p_aLvOvrKuilB614SS.jpg">μεγέθυνση</a>]</p><h2>10ος αιώνας</h2><h3>Ο Χριστός, η Θεοτόκος, ο Ιωάννης ο Βαπτιστής (Βυζάντιο)</h3><p>10ος αιώνας. <a href="https://www.britishmuseum.org/collection/object/H_1923-1205-2">Βρετανικό Μουσείο</a>. Υλικό: ελεφαντόδοντο. Ύψος: 15,5 εκ.</p><p>Panel; ivory; carved with standing figures, Christ with the Virgin Mary and St John, below a pierced canopy; four holes for attachment in the raised border.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5be4045c75323d28a5e95/s_p_qEFeZyh2Gq5Wbvar.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5be4045c75323d28a5e95/m_p_qEFeZyh2Gq5Wbvar.jpg">μεγέθυνση</a>]</p><h3>Η Θεοτόκος και ο Χριστός βρέφος (Κωνσταντινούπολη, Βυζάντιο)</h3><p><a href="tel:950-1025">950–1025</a>. <a href="https://www.clevelandart.org/art/1925.1293">Μουσείο Τέχνης του Κλίβελαντ, ΗΠΑ</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68caa153205184ec278d5882/s_p_iLLZZkqfsUiACLDC.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68caa153205184ec278d5882/m_p_iLLZZkqfsUiACLDC.jpg">μεγέθυνση</a>]</p><h3>Μενταγιόν με απεικόνιση του Χριστού και της Θεοτόκου (Βυζάντιο)</h3><p>1000–1300. <a href="https://www.metmuseum.org/art/collection/search/477247">Μητροπολιτικό Μουσείο Τέχνης, Πέμπτη Λεωφόρος, ΗΠΑ</a>. Καμέα από χαλκηδόνιο· χρυσό πλαίσιο με μαργαριτάρια, σμαράγδια, γρανάτες, ζαφείρια και ένθετο σαρδόνυχα. Συνολικά: 7,2 × 5,5 × 1,6 εκ. Χαλκηδόνιο: 1 1/2 × 1 1/4 ίντσες (3,8 × 3,2 εκ.)</p><img src="https://res.bibleox.com/s/img/image/simple/68c1bc1a6594f46d35a87e6d/s_p_VcHt7eFMtZq1I1lY.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1bc1a6594f46d35a87e6d/m_p_VcHt7eFMtZq1I1lY.jpg">μεγέθυνση</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/68c1bc176594f46d35a87e6c/s_p_LwWdQj6J4ehbmMh9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1bc176594f46d35a87e6c/m_p_LwWdQj6J4ehbmMh9.jpg">μεγέθυνση</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c1bc1f6594f46d35a87e6e/m_p_gT2TXueTg5pmDsuZ.jpg">μεγαλύτερη μεγέθυνση</a>]</p><h3>Σταυρός με απεικόνιση του Χριστού (Βυζάντιο)</h3><p>10ος–11ος αιώνας. Χαλκός. 6,6 × 4,2 εκ. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/228297?page=56&amp;query=%D0%BA%D1%80%D0%B5%D1%81%D1%82&amp;sort=112&amp;index=2755">Ερμιτάζ, Ρωσία</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c11f5b6594f46d35a87e2d/s_p_6uw78FFpsxpItSzn.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c11f5b6594f46d35a87e2d/m_p_6uw78FFpsxpItSzn.jpg">μεγέθυνση</a>]</p><h3>Σταυρός με απεικόνιση του Χριστού (Βυζάντιο)</h3><p>10ος–11ος αιώνας. Χαλκός. 7,7 × 7 εκ. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/482789?page=51&amp;query=%D0%BA%D1%80%D0%B5%D1%81%D1%82&amp;sort=112&amp;index=2501">Ερμιτάζ, Ρωσία</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c11fab6594f46d35a87e2e/s_p_jfgfrZ4X7jcBXG9D.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c11fab6594f46d35a87e2e/m_p_jfgfrZ4X7jcBXG9D.jpg">μεγέθυνση</a>]</p><h3>Σταυρός με εικόνες αγίων (Χερσόνησος)</h3><p>10ος αιώνας. Χαλκός, χάραξη. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/372835?page=5&amp;fundcoll=1420520446__1413747286&amp;index=229">Ερμιτάζ, Ρωσία</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c4191a6594f46d35a87f02/s_p_iFiSEGM9EbRIhhtD.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c4191a6594f46d35a87f02/m_p_iFiSEGM9EbRIhhtD.jpg">μεγέθυνση</a>]</p><h3>Ο άγιος Δημήτριος ο Θεσσαλονικεύς (Βυζάντιο)</h3><p><a href="tel:950-1000">950–1000</a>. <a href="https://www.metmuseum.org/art/collection/search/465946">Μητροπολιτικό Μουσείο Τέχνης, Πέμπτη Λεωφόρος, ΗΠΑ</a>. Υλικό: ελεφαντόδοντο. 19,7 × 12,1 × 1 εκ.</p><p>Standing erect, a spear in his hand and a shield at his side, Saint Demetrios is shown ready to protect the Christian faithful. The name of the popular Byzantine military saint is inscribed in two parts in Greek. Martyred in Thessalonike, the second most important city of the empire in the early centuries of the church, he has long been the patron saint of that metropolis. Images of saints in military dress are rare in Early Byzantine art (they appear on the chalices of the Attarouthi Treasure) but typical of the Middle Byzantine period.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5c38445c75323d28a5e98/s_p_ZeZuXGqxAAyDuPBA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5c38445c75323d28a5e98/m_p_ZeZuXGqxAAyDuPBA.jpg">μεγέθυνση</a>]</p><h2>11ος αιώνας</h2><h3>Λιτανευτικός σταυρός: ο Χριστός, η Θεοτόκος, οι αρχάγγελοι Μιχαήλ και Γαβριήλ (Βυζάντιο)</h3><p>1000–1050. <a href="https://www.metmuseum.org/art/collection/search/466251">Μητροπολιτικό Μουσείο Τέχνης, Πέμπτη Λεωφόρος, ΗΠΑ</a>. 59,5 × 43 × 2,2 εκ.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5e3e645c75323d28a5e9b/s_p_Ft65PrnBUmI6wDAc.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5e3e645c75323d28a5e9b/m_p_Ft65PrnBUmI6wDAc.jpg">μεγέθυνση</a>]</p><h3>Λιτανευτικός σταυρός: ο Χριστός, η Θεοτόκος, ο Ιωάννης ο Βαπτιστής (Βυζάντιο)</h3><p>1050. <a href="https://www.clevelandart.org/art/1970.36">Μουσείο Τέχνης του Κλίβελαντ, ΗΠΑ</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68ca921d205184ec278d5871/s_p_PrD5y34JBpT95quf.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68ca921d205184ec278d5871/m_p_PrD5y34JBpT95quf.jpg">μεγέθυνση</a>]</p><h3>Λιτανευτικός σταυρός: ο άγιος Σάββας (Βυζάντιο)</h3><p>1050. <a href="https://www.metmuseum.org/art/collection/search/697956">Μητροπολιτικό Μουσείο Τέχνης, Πέμπτη Λεωφόρος, ΗΠΑ</a>. Στο κέντρο της πίσω όψης ο άγιος Σάββας, και στα άκρα άλλοι άγιοι μοναχοί. Άργυρος. 32,4 × 44,8 × 5,7 εκ.</p><img src="https://res.bibleox.com/s/img/image/simple/68c1c6546594f46d35a87e76/s_p_FO8cb8Ec2FqTDFz8.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1c6546594f46d35a87e76/m_p_FO8cb8Ec2FqTDFz8.jpg">μεγέθυνση</a>]</p><h3>Λιτανευτικός σταυρός: ο Χριστός (Χερσόνησος)</h3><p>11ος αιώνας. Υλικό: χαλκός, σίδηρος· χύτευση, σφυρηλάτηση, χάραξη. Διαστάσεις: 36,5 × 27,5 εκ. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/372834?page=3&amp;fundcoll=1420520446__1413747286&amp;index=106">Ερμιτάζ, Ρωσία</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c418616594f46d35a87f01/s_p_ytqdkwIa6FDSikCw.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c418616594f46d35a87f01/m_p_ytqdkwIa6FDSikCw.jpg">μεγέθυνση</a>]</p><h3>Τμήμα της εικόνας «Χριστός Παντοκράτωρ» (Βυζάντιο, Κριμαία)</h3><p>1050–1100. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/372766?page=40&amp;query=%D0%B8%D0%BA%D0%BE%D0%BD%D0%B0&amp;index=1999">Ερμιτάζ, Ρωσία</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863bfff6480b4d285320412/s_p_XwuOAkY6yR10NT7b.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863bfff6480b4d285320412/m_p_XwuOAkY6yR10NT7b.jpg">μεγέθυνση</a>]</p><h3>Η Θεοτόκος με τον Χριστό βρέφος (Κωνσταντινούπολη)</h3><p>1000–1015. <a href="https://collections.louvre.fr/en/ark:/53355/cl010101133">Λούβρο, Γαλλία</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c43b8c6594f46d35a87f16/s_p_rQNvoLa9Vu1WmSB2.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c43b8c6594f46d35a87f16/m_p_rQNvoLa9Vu1WmSB2.jpg">μεγέθυνση</a>]</p><h3>Η Θεοτόκος Δεομένη (Κωνσταντινούπολη)</h3><p>1000–1200. <a href="https://collections.louvre.fr/en/ark:/53355/cl010114443">Λούβρο, Γαλλία</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c43bcc6594f46d35a87f17/s_p_7a5oJnVWqjfeu67t.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c43bcc6594f46d35a87f17/m_p_7a5oJnVWqjfeu67t.jpg">μεγέθυνση</a>]</p><h3>Η Θεοτόκος, ο αρχάγγελος Μιχαήλ, ο άγιος Θεόδωρος (Βυζάντιο)</h3><p>11ος–12ος αιώνας. <a href="https://www.britishmuseum.org/collection/object/H_1981-0103-1">Βρετανικό Μουσείο</a>. 108 × 95 χλστ.</p><p>Relief icon; rectangular bronze plaque cast in low relief with full-length Hodegetria flanked by the Archangel Michael and St Theodore, each wearing a girdled tunic beneath a chlamys with decorated tablion; the figures are identified by intaglio inscriptions; the whole is surrounded by a raised border with a running vine scroll; traces of solder at sides and back.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5be3545c75323d28a5e93/s_p_DFDGZ6kHm0khLKRD.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5be3545c75323d28a5e93/m_p_DFDGZ6kHm0khLKRD.jpg">μεγέθυνση</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5be3b45c75323d28a5e94/m_p_FfmDAHv29BAMxval.jpg">μεγαλύτερη μεγέθυνση</a>]</p><h3>Εικόνα του αγίου Δημητρίου (Βυζάντιο)</h3><p>1040–1060. <a href="https://collections.louvre.fr/en/ark:/53355/cl010115478">Λούβρο, Γαλλία</a>. 9,4 × 6,3 × 0,6 εκ.</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c0c36594f46d35a87ec0/s_p_dj04XPO3pwvzkLzr.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c0c36594f46d35a87ec0/m_p_dj04XPO3pwvzkLzr.jpg">μεγέθυνση</a>]</p><h3>Μολυβδόβουλλο με απεικόνιση του αγίου Δημητρίου και επιγραφή (Βυζάντιο)</h3><p>11ος αιώνας. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/269619?page=20&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=958">Ερμιτάζ, Ρωσία</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c2556480b4d285320418/s_p_oqzix7avanFfe61o.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c2556480b4d285320418/m_p_oqzix7avanFfe61o.jpg">μεγέθυνση</a>]</p><h3>Μολυβδόβουλλο με απεικόνιση αγίου μέχρι τη μέση (Βυζάντιο)</h3><p>11ος αιώνας. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/267492?page=14&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=651">Ερμιτάζ, Ρωσία</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c3196480b4d28532041a/s_p_VySwl31Z41rar6d3.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c3196480b4d28532041a/m_p_VySwl31Z41rar6d3.jpg">μεγέθυνση</a>]</p><h3>Κρεμαστή σφραγίδα με απεικόνιση αγίου (Βυζάντιο)</h3><p>11ος αιώνας. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/483272?query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=21">Ερμιτάζ, Ρωσία</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c4276480b4d28532041d/s_p_5EJuZ18em5TsdUwA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c4276480b4d28532041d/m_p_5EJuZ18em5TsdUwA.jpg">μεγέθυνση</a>]</p><h3>Κρεμαστή σφραγίδα με απεικόνιση αγίου (Βυζάντιο)</h3><p>11ος–12ος αιώνας. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/483278?query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=35">Ερμιτάζ, Ρωσία</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c4616480b4d28532041e/s_p_H8LrRkkjwBHlc322.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c4616480b4d28532041e/m_p_H8LrRkkjwBHlc322.jpg">μεγέθυνση</a>]</p><h2>12ος αιώνας</h2><h3>Ο Χριστός, η Θεοτόκος, ο προφήτης Ιωάννης (Κωνσταντινούπολη, Βυζάντιο)</h3><p>Ναός της Του Θεού Σοφίας (Αγία Σοφία). Τοιχογραφία του ναού[5]</p><img src="https://res.bibleox.com/s/img/image/simple/6750078ddba77200011c73af/s_p_EcliI0JFeV1uu1LU.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6750078ddba77200011c73af/m_p_EcliI0JFeV1uu1LU.jpg">μεγέθυνση</a>]</p><h3>Ο Χριστός (Κωνσταντινούπολη, Βυζάντιο)</h3><p>Ναός της Του Θεού Σοφίας (Αγία Σοφία).</p><img src="https://res.bibleox.com/s/img/image/simple/674f332ddba77200011c73a6/s_p_1PCMz3Y4EZgbSJL0.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f332ddba77200011c73a6/m_p_1PCMz3Y4EZgbSJL0.jpg">μεγέθυνση</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686cf10d5f47da2505d3ae4e/s_p_ZHUiumbGoeJMn4GO.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686cf10d5f47da2505d3ae4e/m_p_ZHUiumbGoeJMn4GO.jpg">μεγέθυνση</a>]</p><h3>Η Θεοτόκος (Κωνσταντινούπολη, Βυζάντιο)</h3><p>Ναός της Του Θεού Σοφίας (Αγία Σοφία).</p><img src="https://res.bibleox.com/s/img/image/simple/674f3332dba77200011c73a7/s_p_WvZb6UestGwJUzJr.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f3332dba77200011c73a7/m_p_WvZb6UestGwJUzJr.jpg">μεγέθυνση</a>]</p><h3>Ο Ιωάννης ο Βαπτιστής, προφήτης (Κωνσταντινούπολη, Βυζάντιο)</h3><p>Ναός της Του Θεού Σοφίας (Αγία Σοφία).</p><img src="https://res.bibleox.com/s/img/image/simple/674f357ddba77200011c73a8/s_p_hdfr9cx0ZPTZyn6N.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f357ddba77200011c73a8/m_p_hdfr9cx0ZPTZyn6N.jpg">μεγέθυνση</a>]</p><h3>Η Θεοτόκος με τον Ιησού βρέφος (Κωνσταντινούπολη)</h3><p>Πρώτο τρίτο του 12ου αιώνα. Η εικόνα της Θεοτόκου του Βλαντιμίρ. Ξύλο, αυγοτέμπερα.</p><img src="https://res.bibleox.com/s/img/image/simple/674f18e4dba77200011c7399/s_p_0uaArAqVhNX9r0gV.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f18e4dba77200011c7399/m_p_0uaArAqVhNX9r0gV.jpg">μεγέθυνση</a>]</p><h3>Η Θεοτόκος (Βυζάντιο, Συρία, Ταρτούς)</h3><p>12ος αιώνας. <a href="https://www.britishmuseum.org/collection/object/H_1889-0511-13">Βρετανικό Μουσείο</a>. Υλικό: ελεφαντόδοντο, 41 × 47 χλστ.</p><p>Relief icon; pale grey-green steatite; rounded at the top and square below; bust of the Virgin, her mantle drawn over her head, with St Andrew''s cross on it; her hands held in front with palms outwards, inscription either side of her.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5be2645c75323d28a5e91/s_p_StVNlxiOjocLLsz5.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5be2645c75323d28a5e91/m_p_StVNlxiOjocLLsz5.jpg">μεγέθυνση</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5be2245c75323d28a5e90/m_p_yHJ3BkdNwVGdLb4m.jpg">μεγαλύτερη μεγέθυνση</a>]</p><h3>Ο μεγαλομάρτυρας Δημήτριος ο Θεσσαλονικεύς και ένας διάκονος (Θεσσαλονίκη, Βυζάντιο)</h3><p>12ος αιώνας. Ψηφιδωτό στην ανατολική πλευρά του νότιου πεσσού.</p><img src="https://res.bibleox.com/s/img/image/simple/68698a155f47da2505d3ae16/s_p_n7AgnVLPvfeBX5Qq.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68698a155f47da2505d3ae16/m_p_n7AgnVLPvfeBX5Qq.jpg">μεγέθυνση</a>]</p><h3>Εικόνα της Θεοτόκου Οδηγήτριας (Βυζάντιο, Χερσόνησος)</h3><p>Δεύτερο μισό του 12ου αιώνα. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/372931?page=11&amp;fundcoll=1420520446&amp;index=536">Ερμιτάζ, Ρωσία</a>. 6,8 × 5 εκ.</p><img src="https://res.bibleox.com/s/img/image/simple/6863bf2f6480b4d285320411/s_p_10YV8HIpAzMNCgvp.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863bf2f6480b4d285320411/m_p_10YV8HIpAzMNCgvp.jpg">μεγέθυνση</a>]</p><h2>13ος αιώνας</h2><h3>Ο Κύριος Παντοκράτωρ (Άθως)</h3><p>Μονή Χιλανδαρίου, Άγιον Όρος.</p><img src="https://res.bibleox.com/s/img/image/simple/69406737205184ec278d6fd8/s_p_hTWcEC5QtmbCrC5t.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69406737205184ec278d6fd8/m_p_hTWcEC5QtmbCrC5t.jpg">μεγέθυνση</a>]</p><h3>Η Θεοτόκος με τον Ιησού βρέφος (Οδηγήτρια, Άθως)</h3><p>Μονή Χιλανδαρίου, Άγιον Όρος.</p><img src="https://res.bibleox.com/s/img/image/simple/674f0cfadba77200011c7395/s_p_mQMRA7FGLEbqOYIx.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f0cfadba77200011c7395/m_p_mQMRA7FGLEbqOYIx.jpg">μεγέθυνση</a>]</p><h2>14ος αιώνας</h2><h3>Ο Κύριος Παντοκράτωρ</h3><p>Αγιογράφος Μανουήλ Πανσέληνος.</p><img src="https://res.bibleox.com/s/img/image/simple/674f28d1dba77200011c739e/s_p_ma0z14hIFXCiEj7S.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f28d1dba77200011c739e/m_p_ma0z14hIFXCiEj7S.jpg">μεγέθυνση</a>]</p><h3>Η Θεοτόκος (Θεσσαλονίκη)</h3><p>1310–1315. Δεομένη. Τοιχογραφία του ναού του Αγίου Νικολάου Ορφανού στη Θεσσαλονίκη, Ελλάδα.</p><img src="https://res.bibleox.com/s/img/image/simple/674f29b7dba77200011c739f/s_p_PSuCdQIYdR4IYZgA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f29b7dba77200011c739f/m_p_PSuCdQIYdR4IYZgA.jpg">μεγέθυνση</a>]</p><h3>Τα Εισόδια της Υπεραγίας Θεοτόκου (Κωνσταντινούπολη)</h3><p>Περ. 1316–1321. Καριέ Τζαμί, Μονή της Χώρας, Κωνσταντινούπολη (Ιστανμπούλ), Τουρκία.</p><img src="https://res.bibleox.com/s/img/image/simple/675343bddba7720001cd0ddf/s_p_AtF4vpmhv6FneUfA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/675343bddba7720001cd0ddf/m_p_AtF4vpmhv6FneUfA.jpg">μεγέθυνση</a>]</p><h2>15ος αιώνας</h2><h3>Ο απόστολος Παύλος (Ρως)</h3><p>Δεκαετία του 1410. Αγιογράφος: ο όσιος Ανδρέας Ρουμπλιόφ. Κρατική Πινακοθήκη Τρετιακόφ, Μόσχα, Ρωσία.</p><img src="https://res.bibleox.com/s/img/image/simple/6909fbca205184ec278d6e6a/s_p_ok25vNdlaQMM5P3c.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6909fbca205184ec278d6e6a/m_p_ok25vNdlaQMM5P3c.jpg">μεγέθυνση</a>]</p><h2>Συλλογές εικόνων</h2><ol><li><p>Συλλογή εικονογραφίας των κατακομβών, αρχείο Word: <a href="https://disk.yandex.ru/d/mHc8dxUdHGqMEQ">σύνδεσμος</a></p></li><li><p>Έργα του αγιογράφου Μανουήλ Πανσέληνου (13ος–14ος αιώνας): <a href="https://vk.com/album-20034910_224123875">https://vk.com/album-20034910_224123875</a></p></li></ol>'
