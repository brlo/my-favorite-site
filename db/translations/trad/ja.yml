- src: KPgB_Христианские_захоронения_и_надписи
  path: Bu3i_キリスト教徒の埋葬と碑文
  title: キリスト教徒の埋葬と碑文
  title_sub:
  body: '<h2>初期数世紀のキリスト教徒の墓の碑文</h2><p>アッピア街道のいわゆる「使徒たちのメモリア」のトリクリア（会食の間）にある碑文。この聖所は3世紀半ば、238年から260年のあいだに造られました。同じ3世紀に、トリクリアには「<em>Paule ed Petre petite pro Victore</em>」のようなキリスト教の祈りの碑文が現れはじめました（下に挙げます）。人々はコンスタンティヌス大帝の時代までそれを書き続けました。[1]</p><img src="https://res.bibleox.com/s/img/image/simple/483/s_p_1D8zprHe86ZZn5O9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/483/m_p_1D8zprHe86ZZn5O9.jpg">拡大</a>]</p><h3><strong>心に、あなたがたの祈りに留めてください </strong>(in mente habete, in orationibus vestris)：</h3><p>12912: [Petre et] Paul[e] | in m[ente] abete in | ora[tion]ibus vestris/ — <strong>「ペトロとパウロよ、心に、あなたがたの祈りに留めてください…」</strong></p><h3><strong>執り成してください </strong>(petite)（または「祈ってください」「願ってください」）</h3><p>12918: [Paul]e et Petre petite | [pro] nobis omnibus/ — <strong>「パウロとペトロよ、私たちすべてのために執り成してください！」</strong></p><p>12931: Petr[e] et Pau[l]e petite | pro [Le]ontium / — <strong>「ペトロとパウロよ、レオンティウスのために執り成してください！」</strong></p><p>12933: Pa[ul]e et Pet|re apetite pro Da|tivu in perpetu`u´m/ — <strong>「パウロとペトロよ、ダティウスのためにとこしえに執り成してください！」</strong></p><p>12989: Paule ed Petre petite | pro Victore/ — <strong>「パウロとペトロよ、ウィクトルのために執り成してください！」</strong></p><p>12946: [Petre et Pa]ulae spir[ita sancta vestra petant pro - - -]/ — <strong>「ペトロとパウロよ、あなたがたの聖なる霊が［- - -］のために執り成しますように！」</strong></p><h3><strong>conservate</strong> — <strong>守ってください</strong>（または「保ってください」）</h3><p>12991: Petre et Paule cons[ervate - - -]/ — <strong>「ペトロとパウロよ、［- - -］を守ってください！」</strong></p><p>12996: sa[lva Paule et] | Petr[e - - - et] | Mart[yrium et] | conse[rvate in] | do[mino - - -]/ — <strong>「パウロとペトロよ、［- - -］とマルティリウスを救い、主にあって守ってください［- - -］！」</strong></p><p>13026: [- - - roga]mus | [conse]rvate nos [omnes]/ — <strong>「［- - -］私たちは願います、私たちすべてを守ってください！」</strong></p><h3><strong>簡単な呼びかけ</strong></h3><p>12909: Petr[e et Paule]/ — <strong>「ペトロとパウロよ！」</strong></p><h3><strong>罪人への助け</strong></h3><p>12967: Petre et Paule sub|venite Prim[o] | peccatori/ — <strong>「ペトロとパウロよ、罪人プリムスを助けに来てください！」</strong></p><h3><strong>多くの呼びかけはギリシア語で、またはギリシア文字を使ったラテン語で書かれています</strong></h3><p>12927: Παῦλε {μ} καί | μου πατ|ρός/ — <strong>「パウロよ、私の父も（助けてください）！」</strong></p><p>12997: [Παυλ]ε ετ Πετ[ρε ιν μεν]/[τε ν]ος αβετε [ιν ορα]/[τι]ωνες βεστ[ρας]/ — <strong>「パウロとペトロよ、心に、あなたがたの祈りに留めてください…」</strong></p><p>13045: [Πα]υ[λε ετ Πετρε] | [ι]ν με[ντε αβετε] | Αὐφίδ[ιον υἱόν - - -] | μου/ — <strong>「パウロとペトロよ、私の子アウフィディウスを心に留めてください！」</strong></p><p>13069: Πέτρε Παίτρε μνημόνευαι | Τιμοκράτην καὶ Εὐ|τυχείαν κινα(?) καὶ | ἐσώρα(?) ++ [- - -]/ — <strong>「ペトロ、ペトロよ、ティモクラテスとエウテュキアと（…）を記憶してください ++［- - -］！」</strong></p><p>13045: [κομμ]ανδαμ[ους? - - -]/<strong> </strong>— <strong>「［- - -］を委ねます。」</strong></p><p>13049: Παῦλε καὶ Π[έτρε ἔχετε] / μνί[α]ς/ — <strong>「パウロとペトロよ、［- - -］を記憶してください！」</strong></p><p>13055: [Παῦλε καὶ Πέτ]ρε εἰς μνε[ίαν] / [ἔχετε τὸν ᾿Ιρ]ίνες φίλι[ον]/ — <strong>「パウロとペトロよ、イレネの愛する者を記憶してください。」</strong></p><p>13070: Παυλε Πετρε | Χαλκηδονι ανιμα | βωβυς κομαν|[δ]ω Λαυrους/ — <strong>「パウロとペトロよ、私ラウルス（ラウルシウス？）は、カルケドニウスの魂をあなたがたに委ねます！」</strong></p><p>13071: &lt;Π&gt;α[ῦλ]ος καὶ | Π[έτρο]ς συν|τηρή[σα]τε θ(εο)ῦ δούλους | πνεύματα | ἅγεια συντη|ρήσαται ἡμᾶ|ς ἴνα πολλοῖς | ἔτεσε[ι ζῶμεν]/ — <strong>「パウロとペトロよ、神の僕たちを守ってください！聖なる霊たちよ、私たちが長年生きられるよう守ってください！」</strong></p><p>13073: [Παυλε] ετ Πετρε | [ιν με]ντε [ν]ος αβε|[τοτε εἰς το]ὺς ἐῶ[νας]/<strong> </strong>— <strong>「パウロとペトロよ、とこしえに私たちを心に留めてください…」</strong></p><h3><strong>promisit / votum fecit</strong> — <strong>誓願を立てた</strong></h3><p>13091: [- - - i]dus m[- - -] | Eulogius votum f[ecit]/ — <strong>「［- - -］イドゥスの［- - -］日に、エウロギウスは誓願を立てた［- - -］。」</strong></p><h3><strong>レフリゲリウム</strong>（記憶の会食）への言及：</h3><p>12942: refrigerav[it] | [F]elicissimus cum s[uis]/ — <strong>「フェリキッシムスは家族とともに会食をした。」</strong></p><p>12981: Petro et Paulo | Tomius Coelius | refri`ger´&lt;i&gt;um feci/ — <strong>「ペトロとパウロのために、私トミウス・コエリウスは会食をした。」</strong></p><p>13003: [---] at Paulu[m] | et Pet[rum] | refri[geravi - - -]/ — <strong>「パウロとペトロのもとで私は会食をした。」</strong></p><p>出典：<a href="http://csla.history.ox.ac.uk/record.php?recid=E05087">http://csla.history.ox.ac.uk/record.php?recid=E05087</a></p><hr><h3>神への呼びかけ</h3><ul><li><p>DEVS TE PRECOR VТ PARADISVM LVCIS POSSIT VIDERE – 「<strong>主よ、あなたに願います。彼が楽園の光を見ることができますように</strong>」。</p></li><li><p>DOMINE NE QVANDO ADVMBRETVR SPIRITVS VENERES – 「<strong>主よ、ウェヌスの魂が決して暗くされませんように</strong>」。</p></li></ul><h3>亡くなった人に執り成しを願う</h3><ul><li><p>ET IN ORATIONIS TVIS ROGES PRO NOBIS QVIA SCIMVS TE ☧ – 「<strong>あなたの祈りの中で私たちのために願ってください。あなたがキリストのうちにいることを私たちは知っているからです</strong>」。</p></li><li><p>ORO SCIO NAMQVE BEATAM – 「<strong>あなたに願います。あなたが至福のうちにいることを知っているからです</strong>」。</p></li><li><p>ORA PRO PARENTI BVS TVIS – 「<strong>あなたの家族のために祈ってください</strong>」。</p></li><li><p>PETE PRO NOS VТ SALVI SIMVS – 「<strong>私たちが救われるよう、私たちのために祈ってください</strong>」。</p></li><li><p>IN ORATIONIS TVIS ROGES PRO NOBIS – 「<strong>あなたの祈りの中で、私たちのために願ってください</strong>」。</p></li><li><p>ATTICE SPIRITVS TVS IN BONV ORA PRO PARENTIBVS TVIS – 「<strong>アッティクスよ、あなたの魂は至福のうちにある。あなたの家族のために祈ってください</strong>」。</p></li></ul><p>ここに挙げたのは一部です。残りはリンク先で読むことができます。</p><h3><strong>碑文と象徴的な図像</strong></h3><ul><li><p>墓に非常によく書かれる語 VIVAS、すなわち「<strong>生きよ</strong>」は、亡くなった人に永遠の命と至福を願う言葉です。</p></li><li><p>VIVAS IN DEO – 「<strong>神のうちに生きよ</strong>」。</p></li><li><p>VIBAS IN SANCTIS – 「<strong>聖人たちのあいだで生きよ</strong>」。</p></li></ul><h3>亡くなった人は救いに達した</h3><p>葬られた人が選ばれた人々のうちにいると、さらにはっきり言い表すこともあります。</p><ul><li><p>ACCEPIT REQVI EM IN DEO – 「<strong>彼は神のうちに安息を得た</strong>」。</p></li><li><p>SCIMVS ТЕ IN – 「<strong>あなたがキリストのうちにいることを私たちは知っている</strong>」。</p></li><li><p>FRVCTVOSVS ANIMA ТVА СVМ IVSTIS – 「<strong>フルクトゥオススよ、あなたの魂は義人たちとともにある</strong>」。</p></li><li><p>REQVI EM ADCEPIT IN DEO PATRE NOSTRO ET CHRISTO EIVS – 「<strong>彼は私たちの父なる神とそのキリストのうちに安息を得た</strong>」。</p></li><li><p>ACCEPTA APVD DEVM – 「<strong>神に受け入れられた（女性）</strong>」。</p></li><li><p>RECEPTVS AD DEVM – 「<strong>神に受け入れられた</strong>」。</p></li><li><p>ТЕСVМ PAX CHRISTI – 「<strong>キリストの平和があなたとともに</strong>」。</p></li><li><p>SEMPER VIVE IN РАСЕ – 「<strong>とこしえに平和のうちに生きよ</strong>」。</p></li><li><p>IN РАСЕ ET IN DOMO AETERNA DEI – 「<strong>平和のうちに、神の永遠の家のうちに</strong>」。</p></li><li><p>VIVI IN GLORIA DEI ET IN PACE DOMINI NOSTRI ☧ – 「<strong>あなたは神の栄光と私たちの主キリストの平和のうちに生きている</strong>」。ここでは救い主の名がそのモノグラム ☧ で記されています。</p></li><li><p>ELATVS EST もまた一種の歓呼で、一、二度しか見られませんが、「<strong>彼は神のもとへ昇った</strong>」と訳すことができます。</p></li></ul><h3>楽園 — 光の場所</h3><p>初期キリスト教徒の墓碑銘では、楽園は光と輝きの場所と呼ばれています。いくつか例を挙げます。</p><ul><li><p>CVIVS SPIRITVS IN LVCE DOMINI SVSCEPTVS EST – 「<strong>彼の魂は主の光のうちに受け入れられた</strong>」。</p></li><li><p>IN CHRISTVM CREDENS PREMIA LVCIS АВЕТ – 「<strong>キリストを信じて、彼は光を報いとして得る</strong>」。</p></li><li><p>AETERNA TIBI LUX TIMOTHEA IN ☧– 「<strong>ティモテアよ、（キリスト）のうちにあなたに永遠の光を</strong>」。</p></li></ul><h3></h3><p>書籍（ロシア語）：<strong>A・フォン・フリッケン『ローマのカタコンベと初期キリスト教美術の遺物』モスクワ、K・T・ソルダチェンコフ刊、1872〜1885年。</strong>[2]</p>'
