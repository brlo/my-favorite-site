  title: 主要なコレクションに入らなかったさまざまな古代の像
  title_sub:
  body: <h2>聖ヤヌアリウスのカタコンベ（Catacombe di San Gennaro）[1]</h2><h3>ベネヴェントの聖ヤヌアリウス、プテオリ（ナポリ）の主教、致命者</h3><p>ナポリ、サン・ジェンナーロ（聖ヤヌアリウス）のカタコンベ。4世紀のフレスコ画。ここにだれが描かれているのか、完全には分かっていません。上には SANCTOMARTYRIIANVARIO（聖なる致命者ヤヌアリウスに）と書かれています。ところが、なぜか若者が描かれています。光輪の形がなぜこうなのかも分かりません。</p><p>正教会におけるこの聖人についてのページ（ロシア語）：<a href="https://days.pravoslavie.ru/name/890.html">https://days.pravoslavie.ru/name/890.html</a></p><p>このフレスコ画についてのウィキペディアのページ。ポーランド語ですが、役に立つ情報があります：<a href="https://pl.wikipedia.org/wiki/January_z_Benewentu">https://pl.wikipedia.org/wiki/January_z_Benewentu</a></p><img src="https://res.bibleox.com/s/img/image/simple/686e6aa95f47da2505d3ae6e/s_p_RCtXSS4uiuO9E0Qf.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686e6aa95f47da2505d3ae6e/m_p_RCtXSS4uiuO9E0Qf.jpg">拡大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686e56775f47da2505d3ae67/m_p_XhI4Ni1rKZ949Zi1.jpg">別版 2</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686e54755f47da2505d3ae66/s_p_zKsSelu839AuImaV.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686e54755f47da2505d3ae66/m_p_zKsSelu839AuImaV.jpg">拡大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686e57135f47da2505d3ae68/m_p_faNUwXKGPaVtmUwW.jpg">別版 2</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686e6aec5f47da2505d3ae70/s_p_2fvyFxXewVLu06NV.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686e6aec5f47da2505d3ae70/m_p_2fvyFxXewVLu06NV.jpg">拡大</a>]</p><h3>キリスト教徒の女性ケルラ</h3><p>下の碑文：「CERVLA IN PACE」（平和のうちのケルラ）、5〜6世紀。[3]</p><img src="https://res.bibleox.com/s/img/image/simple/686e4d5c5f47da2505d3ae63/s_p_1dqPUS5wghY1DrdP.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686e4d5c5f47da2505d3ae63/m_p_1dqPUS5wghY1DrdP.jpg">拡大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686e58705f47da2505d3ae6a/m_p_r6sua9UNLBhgIZ06.jpg">別版 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686e58625f47da2505d3ae69/m_p_6KViYk7KWJDrIa8l.jpg">別版 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686e6ad15f47da2505d3ae6f/m_p_q9ocVtWoayH4BxtB.jpg">別版 4</a>]</p><h3>テオテクヌスの家族</h3><blockquote><p>テオテクヌス家のアルコソリウム（アーチ形の墓龕）。調査によれば、最初に亡くなったのは少女でした。壁龕には彼女の肖像のフレスコ画が描かれました。次に男性が亡くなりました。最初のフレスコ画の上に、今度は父親を加えた新しい絵が描かれました。最後に女性が亡くなり、壁龕には家族の集合肖像が現れました。</p></blockquote><img src="https://res.bibleox.com/s/img/image/simple/686e6be45f47da2505d3ae71/s_p_xNoWgh6wacZ3al1R.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686e6be45f47da2505d3ae71/m_p_xNoWgh6wacZ3al1R.jpg">拡大</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686e592c5f47da2505d3ae6b/s_p_A6SYWxzdgc1EPwun.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686e592c5f47da2505d3ae6b/m_p_A6SYWxzdgc1EPwun.jpg">拡大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686fe8695f47da2505d3ae88/m_p_nzuUOKu6sAmxO4pO.jpg">別版 2</a>]</p><h2>アナポ街道のカタコンベ[2]</h2><h3>祈る女性（オランス）</h3><p>ローマ、アナポ街道の無名のカタコンベ（Anonima di Via Anapo）にある祈る女性（オランス）のフレスコ画</p><img src="https://res.bibleox.com/s/img/image/simple/686e53655f47da2505d3ae65/s_p_qTxn07MuPIePNzPn.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686e53655f47da2505d3ae65/m_p_qTxn07MuPIePNzPn.jpg">拡大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686e535e5f47da2505d3ae64/m_p_U8Zh4RJjehyZtXep.jpg">別版 2</a>]</p>
