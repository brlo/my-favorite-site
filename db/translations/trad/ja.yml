  title: 古代キリスト教の聖堂
  title_sub:
  body: '<h2>題辞</h2><blockquote><p>「すると、ファリサイ派のある人々が、群衆の中からイエスに向かって、『先生、お弟子たちを叱ってください』と言った。イエスはお答えになった。『言っておくが、<strong>もしこの人たちが黙れば、石が叫びだす</strong>』」（<a href="https://bibleox.com/ja/jp-ni/lk/19/#L39-40">ルカ 19:39-40</a>）</p></blockquote><h2>3世紀</h2><h3>古代都市メギドの近く、<a href="https://he.wikipedia.org/wiki/%D7%9C%D7%92%D7%99%D7%95">レギオ</a>の集落にあった聖堂（230年頃）</h3><p>古代キリスト教の聖堂では、祭壇が中央に置かれることがよくありました。この聖堂はそのよい例です。</p><p>メギドの町の近く（古代にはローマの軍団が駐屯していたため、そこに<a href="https://he.wikipedia.org/wiki/%D7%9C%D7%92%D7%99%D7%95">レギオ</a>という集落がありました）。集落の高台に建物があり、硬貨、陶器、書体から230年のものと年代が定められました。その建物の部屋の一つがキリスト教の聖堂でした。床には碑文のある大きなモザイクがいくつかあり（その一つはキリストを神と呼んでいます）、中央には祭壇があります。そのそばには、この卓をだれが献げたかを記した碑文もあります。</p><img src="https://res.bibleox.com/s/img/image/simple/692c58f9205184ec278d6f97/s_p_aZ3NifF9BW3oqZ1a.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c58f9205184ec278d6f97/m_p_aZ3NifF9BW3oqZ1a.jpg">拡大</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/692c587d205184ec278d6f91/s_p_MvOQRFKiCv6XaXOd.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c587d205184ec278d6f91/m_p_MvOQRFKiCv6XaXOd.jpg">拡大</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/692c58ee205184ec278d6f96/s_p_5wNRtqyrpQivbBim.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c58ee205184ec278d6f96/m_p_5wNRtqyrpQivbBim.jpg">拡大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/692c58e0205184ec278d6f95/m_p_FQvEfj70dP7967X3.jpg">追加写真 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/692c58ce205184ec278d6f94/m_p_9xoiCsqROihBYnL0.jpg">追加写真 3</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/692c58b5205184ec278d6f93/s_p_Cvww0C8ZGmbqJS7a.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c58b5205184ec278d6f93/m_p_Cvww0C8ZGmbqJS7a.jpg">拡大</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/692c5882205184ec278d6f92/s_p_WU59e3c2XbPWkdaM.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c5882205184ec278d6f92/m_p_WU59e3c2XbPWkdaM.jpg">拡大</a>]</p><p><strong>碑文：</strong></p><p>聖堂の床の碑文はすべて、一種の<strong>記憶の書付（ポミャンニク）</strong>です。古代から今日まで、正教会の聖堂では、奉神礼のたびに、聖堂を建てた人や何か大切なものを献げた人の名を祈りの記憶に加える伝統があります。ここでも同じように、記憶を願う言葉とともに、モザイクの床を献げた人（百人隊長ガイアノス・ポルフュリオス）、それを敷いた人（ブルティオス）、祭壇を献げた人（アケプトゥス）、そしておそらく献げた人々の親族であるほかの名、プリミラ、キュリアカ、ドロテア、クレステが記されています。同じように、生者と死者の記憶のために聖器物、すなわち聖体礼儀の聖爵や香炉も献げられました（<a href="https://bibleox.com/ru/ru/w/%D0%B4%D1%80%D0%B5%D0%B2%D0%BD%D0%B8%D0%B5-%D0%B8%D0%BA%D0%BE%D0%BD%D1%8B#HH-%D0%95%D0%B2%D1%85%D0%B0%D1%80%D0%B8%D1%81%D1%82%D0%B8%D1%87%D0%B5%D1%81%D0%BA%D0%B8%D0%B5-%D1%87%D0%B0%D1%88%D0%B8-%D0%B8-%D0%BA%D0%B0%D0%B4%D0%B8%D0%BB%D0%B0-%D1%81-%D0%B8%D0%BA%D0%BE%D0%BD%D0%B0%D0%BC%D0%B8-%D0%92%D0%B8%D0%B7%D0%B0%D0%BD%D1%82%D0%B8%D1%8F-%D0%A1%D0%B8%D1%80%D0%B8%D1%8F-%D0%90%D1%82%D1%82%D0%B0%D1%80%D1%83%D1%82%D0%B8">詳しくは</a>）。</p><blockquote><p>日本語訳：神を愛するアケプトゥスは、この卓を神イエス・キリストに記憶のために献げた。</p></blockquote><blockquote><p>EN: Akeptous, the God-loving, offered the table to God Jesus Christ as a memorial.</p></blockquote><blockquote><p>Transcription: <strong>Prosēniken Akeptous, ē philotheos, tēn trapezan Th(e)ō Ι(ēso)u Ch(rist)ō mnēmosunon.</strong></p></blockquote><blockquote><p>Orig: <strong>ΠΡΟСΗΝΙΚΕΝ ΑΚΕΠΤΟΥС, Η ΦΙΛΟΘΕΟС, ΤΗΝ ΤΡΑΠΕΖΑΝ Θ(Ε)Ω Ι(ΗСΟ)Υ Χ(ΡΙСΤ)Ω ΜΝΗΜΟСΥΝΟΝ</strong></p></blockquote><blockquote><p>ΠΡΟϹΗΝΙΚΕΝ</p><p>ΑΚΕΠΤΟΥϹ,</p><p>Η ΦΙΛΟΘΕΟϹ,</p><p>ΤΗΝ ΤΡΑΠΕ-</p><p>ZΑΝ <strong>{ΘW} {ΙΥ} {ΧW}*</strong></p><p>ΜΝΗΜΟϹΥΝΟΝ</p></blockquote><p>*ノミナ・サクラ（聖なる名の略記）：<strong>ΘW ΙΥ ΧW</strong> = θεῷ Ἰησοῦ Χριστῷ = 神イエス・キリスト</p><img src="https://res.bibleox.com/s/img/image/simple/692c5df3205184ec278d6f9a/s_p_swifwBDbtzgImkZ6.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c5df3205184ec278d6f9a/m_p_swifwBDbtzgImkZ6.jpg">拡大</a>]</p><hr><blockquote><p>ΕΝ: Remember Primilla and Cyriaca and Dorothea, and moreover also Chreste.</p></blockquote><blockquote><p>日本語訳：プリミラ、キュリアカ、ドロテア、そしてクレステを記憶せよ。</p></blockquote><blockquote><p>Orig: <strong>ΜΝΗΜΟΝΕΥСΑΤΕ ΠΡΙΜΙΛΛΗС ΚΑΙ ΚΥΡΙΑΚΗС ΚΑΙ ΔWΡΟΘΕΑС ΕΤΙ ΔΕ ΚΑΙ ΧΡΗСΤΗ</strong></p></blockquote><blockquote><p>Fixed: <strong>ΜΝΗΜΟΝΕΥСΑΤΕ ΠΡΙΜΙΛΛΗС ΚΑΙ ΚΥΡΙΑΚΗΣ ΚΑΙ ΔΩΡΟΘΕΑΣ ΕΤΙ ΔΕ ΚΑΙ ΧΡΗΣΤΗ</strong></p></blockquote><img src="https://res.bibleox.com/s/img/image/simple/692c5dec205184ec278d6f99/s_p_LVbgKrKO7P3dfEJP.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c5dec205184ec278d6f99/m_p_LVbgKrKO7P3dfEJP.jpg">拡大</a>]</p><hr><blockquote><p>日本語訳：ポルフュリオスとも呼ばれるガイアノス、百人隊長、われらの兄弟は、自らの費用で大いなる寛大さをもってこの床を敷いた。ブルティオスがその仕事をなした。</p></blockquote><blockquote><p>EN: Gaianus, also called Porphyrius, centurion (xp), our brother, has made the pavement at his own expense as an act of liberality. Brutius has carried out the work.</p></blockquote><blockquote><p>Orig: <strong>ΓΑΙΑΝΟС Ο ΚΑ ΠΟΡΦΥΡΙС ΧΡ* ΑΔΕΛΦΟС ΗΜWΝ ΕΚ ΦΙΛΟΤΕ ΙΜΙС ΑΜΕΝ ΟСΕΚΤW ΝΙΔΙWΝ ΕΨΙ ΦΟΛΟΓΗСΕΝ. ΒΡΟVΤΙС ΗΡΓΑСΑΤΟ.</strong></p></blockquote><blockquote><p>Fixed: <strong>ΓΑΙΑΝΟΣ Ο ΚΑ ΠΟΡΦΥΡΙΣ ΧΡ* ΑΔΕΛΦΟΣ ΗΜΩΝ ΕΚ ΦΙΛΟΤΕ ΙΜΙΣ ΑΜΕΝ ΟΣΕΚΤΩ ΝΙΔΙΩΝ ΕΨΙ ΦΟΛΟΓΗΣΕΝ. ΒΡΟΥΤΙΣ ΗΡΓΑΣΑΤΟ.</strong></p></blockquote><p><strong>*ΧΡ — hekatontarches — centurio</strong></p><img src="https://res.bibleox.com/s/img/image/simple/692c5e27205184ec278d6f9b/s_p_Qk321JfFTD4dDmnd.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c5e27205184ec278d6f9b/m_p_Qk321JfFTD4dDmnd.jpg">拡大</a>]</p><h3>ドゥラ・エウロポスの聖堂（シリア）</h3><p>244年、ドゥラ・エウロポスのキリスト教の聖堂</p><img src="https://res.bibleox.com/s/img/image/simple/6931880c205184ec278d6fa6/s_p_DFnp7s0vcTbXb3Qn.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931880c205184ec278d6fa6/m_p_DFnp7s0vcTbXb3Qn.jpg">拡大</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/69318806205184ec278d6fa5/s_p_PuUKcoZEfAVSlPNM.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69318806205184ec278d6fa5/m_p_PuUKcoZEfAVSlPNM.jpg">拡大</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/69318802205184ec278d6fa4/s_p_MF4zgk1ySUOBpqnG.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69318802205184ec278d6fa4/m_p_MF4zgk1ySUOBpqnG.jpg">拡大</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/414/s_p_UgKueSl1yxG0SfbA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/414/m_p_UgKueSl1yxG0SfbA.jpg">拡大</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/69330ed8205184ec278d6fc0/s_p_kXy4nTuYVCOxuDib.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69330ed8205184ec278d6fc0/m_p_kXy4nTuYVCOxuDib.jpg">拡大</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/693187fd205184ec278d6fa3/s_p_R3poESL99kNRMpXi.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/693187fd205184ec278d6fa3/m_p_R3poESL99kNRMpXi.jpg">拡大</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/69330e9e205184ec278d6fbf/s_p_ThLs4WrxsJ3ykxKU.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69330e9e205184ec278d6fbf/m_p_ThLs4WrxsJ3ykxKU.jpg">拡大</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/69330e76205184ec278d6fbe/s_p_NykNwaI9TEwz1Ccf.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69330e76205184ec278d6fbe/m_p_NykNwaI9TEwz1Ccf.jpg">拡大</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/69330e70205184ec278d6fbd/s_p_Rd3jEzEeesXUCTmh.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69330e70205184ec278d6fbd/m_p_Rd3jEzEeesXUCTmh.jpg">拡大</a>]</p><p>聖堂には新約聖書の出来事を描いた壁画があります。溺れかけた使徒ペトロが救われる場面と、羊の池のほとりで体の麻痺した人がいやされる場面（キリストの奇跡の連作のうち、残っているのはこの二つだけです）、そして良い羊飼いです。</p><p><strong>溺れかけた使徒ペトロが救われる</strong></p><img src="https://res.bibleox.com/s/img/image/simple/692c8038205184ec278d6f9e/s_p_QQ2Rml8gUWsyQtS9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c8038205184ec278d6f9e/m_p_QQ2Rml8gUWsyQtS9.jpg">拡大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6786b88ddba77200015ae11c/m_p_do380IVDukCAfdFk.jpg">別版 2</a>]</p><p><strong>羊の池のほとりで体の麻痺した人がいやされる</strong></p><img src="https://res.bibleox.com/s/img/image/simple/6786b889dba77200015ae11b/s_p_k1a5GDBvfzTCWmZv.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6786b889dba77200015ae11b/m_p_k1a5GDBvfzTCWmZv.jpg">拡大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6786bb0bdba77200015ae11d/m_p_dCRD85foL69l7kih.jpg">別版</a>]</p><p><strong>洗礼盤のそばの絵（6号室）：良い羊飼いが迷った羊を群れに連れ戻す</strong></p><img src="https://res.bibleox.com/s/img/image/simple/6931870c205184ec278d6fa2/s_p_uBkNi8jGsMFpOQSM.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931870c205184ec278d6fa2/m_p_uBkNi8jGsMFpOQSM.jpg">拡大</a>]</p><h3>カイサリアのエウセビオス（パンフィロス）、主教、教会史家（258年頃〜339年）</h3><p>彼は、ローマ皇帝ディオクレティアヌスの治世（284〜305年）の前の時代に、あらゆる町でキリスト教の聖堂が建てられたことを書いています。303年、ディオクレティアヌスはキリスト教の聖堂を破壊せよという勅令を出しました。この勅令のときエウセビオスは45歳ほどで、聖堂が建てられるのも壊されるのも見ていたはずです。</p><blockquote><p>5. 総督や長官たちは教会の指導者たちを何と好意的に扱ったことか。<strong>どの町にも集まった幾千もの集会</strong>、<strong>祈りの家に流れ込む驚くべき群衆</strong>をどう言い表せようか。<strong>古い建物では足りず、<mark>どの町でも新たに広々とした教会が土台から建てられた</mark>（εὐρείας εἰς πλάτος ἀνὰ πάσας τὰς πόλεις ἐκ θεμελίων ἀνίστων <mark>ἐκκλησίας</mark>）。</strong></p><p>&lt;…&gt;</p><p>4. ディオクレティアヌスの治世第十九年、ディストロスの月（ローマ人の三月）、主の受難の祭りが近づいたころ、<strong><mark>教会を地面まで取り壊せと命じる皇帝の勅書</mark>（βασιλικὰ γράμματα, τὰς μὲν <mark>ἐκκλησίας</mark> εἰς ἔδαφος φέρειν）</strong>が至る所に掲げられ、聖書は焼かれ、キリスト教を守る人々は名誉ある地位を奪われると布告された。</p></blockquote><p>（<a href="https://bibleox.com/ja/grc/w/%CE%95%CE%9A%CE%9A%CE%9B%CE%97%CE%A3%CE%99%CE%91%CE%A3%CE%A4%CE%99%CE%9A%CE%97%CE%A3_%CE%99%CE%A3%CE%A4%CE%9F%CE%A1%CE%99%CE%91%CE%A3-8/#:~:text=%E1%BC%80%CE%BD%E1%BD%B0%20%CF%80%E1%BD%B1%CF%83%CE%B1%CF%82%20%CF%84%E1%BD%B0%CF%82%20%CF%80%E1%BD%B9%CE%BB%CE%B5%CE%B9%CF%82%20%E1%BC%90%CE%BA%20%CE%B8%CE%B5%CE%BC%CE%B5%CE%BB%E1%BD%B7%CF%89%CE%BD%20%E1%BC%80%CE%BD%E1%BD%B7%CF%83%CF%84%CF%89%CE%BD%20%E1%BC%90%CE%BA%CE%BA%CE%BB%CE%B7%CF%83%E1%BD%B7%CE%B1%CF%82">『教会史』第8巻 1.5、2.4</a>、ギリシア語から訳出）</p><h2>疑わしい発見</h2><h3><strong>ヘルクラネウムの家（</strong>1世紀<strong>）</strong></h3><img src="https://res.bibleox.com/s/img/image/simple/67e428d39a4a346bba31e8ba/s_p_F0lTpC2rqw7PVyf1.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/67e428d39a4a346bba31e8ba/m_p_F0lTpC2rqw7PVyf1.jpg">拡大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/69330b68205184ec278d6fb8/m_p_oEOCtcPUBThtuirO.jpg">別版 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/69330cb6205184ec278d6fb9/m_p_zMmSTHDi5RoizXsX.jpg">別版 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/69330cbb205184ec278d6fba/m_p_Jv9gdiBWmrMB5tc4.jpg">別版 4</a>] [<a href="https://res.bibleox.com/s/img/image/simple/67e428d79a4a346bba31e8bb/m_p_1sEN1KSZxei96K4S.jpg">別版 5</a>] [<a href="https://res.bibleox.com/s/img/image/simple/67e428db9a4a346bba31e8bc/m_p_TgMWk123osBJ9une.jpg">別版 6</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/69330cc3205184ec278d6fbc/s_p_YLRMNDvDg7nCTh3X.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69330cc3205184ec278d6fbc/m_p_YLRMNDvDg7nCTh3X.jpg">拡大</a>]</p><p>79年、ヴェスヴィオ山が噴火し、ポンペイ、スタビアエ、ヘルクラネウムなどの町を火山灰の下に埋めました。ヘルクラネウムで<a href="https://ru.wikipedia.org/wiki/%D0%93%D0%B5%D1%80%D0%BA%D1%83%D0%BB%D0%B0%D0%BD%D1%83%D0%BC#%D0%94%D0%BE%D0%BC_%D0%B4%D0%B2%D1%83%D1%85%D1%81%D0%BE%D1%82%D0%BB%D0%B5%D1%82%D0%B8%D1%8F">家</a>（ロシア語）が見つかり（発掘200周年にちなんで「二百年祭の家」と呼ばれます）、その2階の部屋の壁、木の戸棚の真上の中央に<a href="https://ermakvagus.com/Europe/Italy/Pompeii/christianity_pompeii_rus.html">十字形のくぼみ</a>（ロシア語）がありました。そこには祈りのための木の十字架が掛けられ、この部屋がキリスト教の奉神礼や家庭の祈りに使われたと考える人もいます。しかし、この推測には有力な反論があります。同じ町では、壁に似た跡を残したかもしれない棚が見つかっています。</p><img src="https://res.bibleox.com/s/img/image/simple/6932ff2b205184ec278d6fb6/s_p_cXmpauqq2EYuH6ww.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6932ff2b205184ec278d6fb6/m_p_cXmpauqq2EYuH6ww.jpg">拡大</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6932ff36205184ec278d6fb7/s_p_KIfO7M0rbhGbWoIk.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6932ff36205184ec278d6fb7/m_p_KIfO7M0rbhGbWoIk.jpg">拡大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/69330cbf205184ec278d6fbb/m_p_WL1FQysNlwZc0yT9.jpg">別版 2</a>]</p><p>その棚はまったく同じではなく、左右にかなり大きく、下に小さく張り出しています。また二百年祭の家では、壁のこの場所に開閉する二枚の扉があったと考えられます。それでも、二百年祭の家にあったのは十字架ではなく普通の棚だった可能性は高いでしょう。どの結論をどこまで信じるかは、読者自身が判断しなければなりません。ここでは、この発見について知られている情報を集めただけです。</p>'
