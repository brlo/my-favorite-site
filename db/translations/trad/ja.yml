- src: 2NCD_Постная_кухня
  path: Lc4k_斎ものいみの料理
  title: 斎（ものいみ）の料理
  title_sub:
  body: <p>この記事は、これまで斎（ものいみ、精進）をしたことがなく、斎の料理を作る習慣もなく、斎の期間に何を作ればよいか分からない人の手がかりとなるよう、斎の食事のあらましだけを簡単に紹介するものです。</p><blockquote><p>「主はお答えになった。『マルタ、マルタ、あなたは多くのことに思い悩み、心を乱している。しかし、必要なことはただ一つだけである。マリアは良い方を選んだ。それを取り上げてはならない。』」（<a href="https://bibleox.com/ja/jp-ni/lk/10/#L41-42">ルカ 10:41-42</a>）</p></blockquote><blockquote><p>「放縦や深酒や生活の煩いで、心が鈍くならないように注意しなさい。さもないと、その日が不意に罠のようにあなたがたを襲うことになる」（<a href="https://bibleox.com/ja/jp-ni/lk/21/#L34">ルカ 21:34</a>）</p></blockquote><h2>スープ</h2><h3>野菜のだしのスープ（炒めた玉ねぎとにんじん入り）</h3><p>ほとんどどれにも、じゃがいもを入れるとよく合います。</p><ul><li><p><strong>穀物のスープ</strong>（そばの実、米、押し麦、レンズ豆、えんどう豆）、</p></li><li><p><strong>パスタ入りスープ</strong>、</p></li><li><p><strong>野菜スープ</strong>、</p></li><li><p><strong>ボルシチ</strong>（ビーツのスープ）、</p></li><li><p><strong>ラッソーリニク</strong>（きゅうりの塩漬け入りスープ）、</p></li><li><p><strong>シチー</strong>（キャベツのスープ）、</p></li><li><p><strong>ウハー</strong>（魚のスープ。規定で魚が許される日に）。</p></li></ul><h2>付け合わせ</h2><ul><li><p><strong>オートミール</strong>（フレーク）、</p></li><li><p><strong>ゆでた</strong>米、そばの実、レンズ豆、クスクス、ブルグル、キヌア、ポレンタ（とうもろこし粉のかゆ）などの穀物。炒めた玉ねぎとにんじんを加えるとよく合います。</p></li><li><p><strong>プロフ（ピラフ）</strong>（おなかにたまるよう、ひよこ豆を加えてもよい）、</p></li><li><p><strong>ゆでた米のミックス</strong>：ハワイ風、メキシコ風など、</p></li><li><p><strong>パスタ</strong>：ゆでたもの、先に炒めてからゆでたもの、きのこ入り、魚の缶詰（ツナ、いわしなど。規定で許される日に）入り、</p></li><li><p><strong>じゃがいも</strong>：揚げる、焼く、ゆでる、マッシュポテト、</p></li><li><p><strong>キャベツの煮込み</strong>、</p></li><li><p><strong>野菜のラグー</strong>：じゃがいも、にんじん、玉ねぎ、ズッキーニ、パプリカ、きのこ、トマトペーストまたはトマト、なす、</p></li><li><p><strong>ゆで野菜</strong>（カリフラワー、ブロッコリー、グリーンピース、とうもろこし）、</p></li><li><p><strong>ヴァレーニキ</strong>（水餃子に似た料理）：じゃがいも、きのこ、さくらんぼ入り、</p></li><li><p><strong>豆腐</strong>、</p></li><li><p><strong>ひよこ豆と野菜</strong>、</p></li><li><p><strong>きのこ</strong>の炒め物、</p></li><li><p><strong>ズッキーニ</strong>の焼き物、</p></li><li><p><strong>ドラニキ</strong>（すりおろしたじゃがいもかズッキーニ、米粉か小麦粉、塩で焼くお焼き）、</p></li><li><p><strong>ラタトゥイユ</strong>、</p></li><li><p><strong>かぼちゃのオーブン焼き</strong>、</p></li><li><p><strong>野菜のグリル</strong>、</p></li><li><p><strong>野菜のコロッケ</strong>（いんげん豆で）。</p></li></ul><h2>サラダ</h2><ul><li><p><strong>生野菜で</strong>：きゅうり、トマト、春キャベツ、赤玉ねぎ、レタス、パプリカ、香草、香辛料、</p></li><li><p><strong>ゆで野菜で</strong>：ヴィネグレット（じゃがいも、ビーツ、にんじん、いんげん豆、グリーンピースの缶詰、きゅうりの塩漬け、玉ねぎ、ザワークラウト）、</p></li><li><p><strong>白菜のサラダ</strong>：白菜、とうもろこし、斎のマヨネーズ[1]、</p></li><li><p><strong>ゆでたビーツ</strong>の斎のマヨネーズ[1]あえ、</p></li><li><p><strong>フルーツサラダ</strong>、</p></li><li><p><strong>アボカドのサラダ</strong>、</p></li></ul><h2>漬物</h2><ul><li><p><strong>ザワークラウト</strong>、</p></li><li><p><strong>きゅうり</strong>：塩漬け、浅漬け、たたききゅうり、</p></li><li><p><strong>にんじん</strong>の韓国風あえ物、</p></li><li><p><strong>玉ねぎ</strong>の酢漬け、</p></li><li><p>など。</p></li></ul><h2>粉もの</h2><ul><li><p><strong>パン</strong>、</p></li><li><p><strong>斎のパン（ブルーチカ）</strong>：オーブンやフライパンで焼くか、店で買う、</p></li><li><p><strong>具入りのピロシキ</strong>：さくらんぼ、キャベツの煮込み、じゃがいもと玉ねぎ入り、</p></li><li><p><strong>斎のブリヌイ（クレープ）</strong>（牛乳の代わりに水、卵の代わりにバナナ）、</p></li></ul><h2>保存食</h2><ul><li><p><strong>ズッキーニの</strong><strong>ペースト（イクラー）</strong>、</p></li><li><p><strong>なすの</strong><strong>ペースト（イクラー）</strong>、</p></li><li><p><strong>フムス</strong>、</p></li><li><p><strong>とうもろこし</strong>、</p></li><li><p><strong>きのこ</strong>、</p></li><li><p><strong>いんげん豆</strong>、</p></li><li><p><strong>グリーンピース</strong>、</p></li><li><p><strong>ドライトマト</strong>、</p></li><li><p>チーズなしの<strong>ワカモレ</strong>、</p></li></ul><h2>ドライフルーツとナッツ</h2><ul><li><p><strong>ナッツ</strong>、</p></li><li><p>乾燥またはフリーズドライの<strong>ベリーや果物</strong>、</p></li><li><p><strong>ハルヴァ</strong>、</p></li></ul><h2>オープンサンドと軽食</h2><ul><li><p>はちみつのオープンサンド、</p></li><li><p>トマトとバジルと塩のオープンサンド。</p></li></ul><h2>飲み物</h2><ul><li><p>クワス（パンを発酵させた飲み物）</p></li><li><p>キセーリ（でんぷんでとろみをつけた果実の飲み物）</p></li><li><p>コンポート（生のベリーやドライフルーツを煮出した飲み物）</p></li><li><p>モルス（ベリーの果汁飲料）</p></li><li><p>スムージー</p></li><li><p>レモネード</p></li><li><p>お茶</p></li><li><p>ミルクなしのコーヒー</p></li><li><p>水</p></li></ul>
  references: "<ol><li><p><strong>斎のマヨネーズ</strong>：グリーンピースの缶詰の汁、植物油、からし、塩、砂糖、酢。ミキサーでなめらかにする。</p></li></ol><p>ロシア語からの翻訳：ロジオン・ヴラソフ（AIツールを併用）。聖書の引用は新共同訳による。</p>"
