  path: Ik1c_古代のイコン集
  title: 古代のイコン集
  title_sub: キリスト、生神女、使徒たち、そのほかの聖人の古代キリスト教のイコン
  body: <h2>紀元前15世紀ごろ</h2><h3>臨在の幕屋</h3><p>聖所の中央の垂れ幕（聖所と至聖所のあいだ）にはケルビムが描かれ（<a href="https://bibleox.com/ja/jp-ni/ish/26/#L31">出 26:31</a>）、周りの幕（壁）にも描かれていましたが（<a href="https://bibleox.com/ja/jp-ni/ish/26/#L1">出 26:1</a>、<a href="https://bibleox.com/ja/jp-ni/ish/36/#L8">出 36:8</a>）、この絵の作者はそれを描いていません。幕屋は天の実在の像（イコン）です（<a href="https://bibleox.com/ja/jp-ni/ish/25/#L8-9,40">出 25:8-9,40</a>、<a href="https://bibleox.com/ja/jp-ni/evr/9/#L24">ヘブ 9:24</a>、<a href="https://bibleox.com/ja/jp-ni/act/7/#L44">使 7:44</a>）。神は聖所を敬うよう命じられました（<a href="https://bibleox.com/ja/jp-ni/lev/19/#L30">レビ 19:30</a>、<a href="https://bibleox.com/ja/jp-ni/lev/26/#L2">レビ 26:2</a>）。</p><img src="https://res.bibleox.com/s/img/image/simple/471/s_p_P2j4gLJt9iKSnkge.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/471/m_p_P2j4gLJt9iKSnkge.jpg">拡大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/472/m_p_bNPh6hCNJDhzahar.jpg">外観</a>]</p><h3>契約の箱</h3><p>箱には二つのケルビムの像がありました（<a href="https://bibleox.com/ru/ru/w/%D0%BA%D0%BE%D0%B2%D1%87%D0%B5%D0%B3_%D0%B7%D0%B0%D0%B2%D0%B5%D1%82%D0%B0/">聖書の箇所</a>）。預言者ヨシュアは契約の箱の前にひれ伏しました（<a href="https://bibleox.com/ja/jp-ni/nav/7/#L6">ヨシュ 7:6</a>）。</p><img src="https://res.bibleox.com/s/img/image/simple/469/s_p_DUn5vqnI4F8yRiNA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/469/m_p_DUn5vqnI4F8yRiNA.jpg">拡大</a>]</p><h3>イスラエルの宿営</h3><p>イスラエルは十字架の形で移動しました（<a href="https://bibleox.com/ru/ru/w/%D0%B5%D0%B2%D1%80%D0%B5%D0%B9%D1%81%D0%BA%D0%B8%D0%B9-%D1%81%D1%82%D0%B0%D0%BD-%D0%BA%D1%80%D0%B5%D1%81%D1%82/">聖書の箇所</a>）。</p><img src="https://res.bibleox.com/s/img/image/simple/470/s_p_t8tRbbwlzsBzyVzk.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/470/m_p_t8tRbbwlzsBzyVzk.jpg">拡大</a>]</p><h2>紀元前10世紀ごろ</h2><h3>ソロモンが建てたエルサレムの神殿</h3><p>ケルビムの彫刻は神殿の壁（<a href="https://bibleox.com/ja/jp-ni/3ts/6/#L32">王上 6:32</a>）、入口の扉（<a href="https://bibleox.com/ja/jp-ni/3ts/6/#L32">王上 6:32</a>、<a href="https://bibleox.com/ja/jp-ni/3ts/6/#L35">王上 6:35</a>）、至聖所の入口の垂れ幕（<a href="https://bibleox.com/ja/jp-ni/2par/3/#L14">代下 3:14</a>、<a href="https://bibleox.com/ja/jp-ni/1mak/1/#L22">１マカ 1:22</a>）にありました。至聖所には金をかぶせた二つの大きな木のケルビム像が立っていました（<a href="https://bibleox.com/ja/jp-ni/3ts/6/#L23">王上 6:23</a>）。契約の箱の蓋には二つのケルビム像が作られました（<a href="https://bibleox.com/ja/jp-ni/ish/25/#L18-20">出 25:18-20</a>）。神殿の庭では、洗盤の大きな台に獅子と牛とケルビムが描かれていました（<a href="https://bibleox.com/ja/jp-ni/3ts/7/#L28-29">王上 7:28-29</a>）。（<a href="https://bibleox.com/ru/ru/w/%D0%B8%D0%B5%D1%80%D1%83%D1%81%D0%B0%D0%BB%D0%B8%D0%BC%D1%81%D0%BA%D0%B8%D0%B9-%D1%85%D1%80%D0%B0%D0%BC/">詳しくは</a>）</p><p>預言者ダビデは神殿に向かってひれ伏し（<a href="https://bibleox.com/ja/jp-ni/ps/5/#L8">詩 5:8</a>、<a href="https://bibleox.com/ja/jp-ni/ps/99/#L5">詩 99:5</a>、<a href="https://bibleox.com/ja/jp-ni/ps/132/#L7">詩 132:7</a>）、この像を通して神に敬意を表しました。</p><img src="https://res.bibleox.com/s/img/image/simple/468/s_p_lv7GzNtM53C4Zqgr.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/468/m_p_lv7GzNtM53C4Zqgr.jpg">拡大</a>]</p><h2>2世紀</h2><h3>幼子イエスを抱く生神女、星を指さす預言者（ローマ）</h3><p>2世紀〜3世紀初め。プリスキラのカタコンベ[6]。これは最も古い生神女の像です。生神女のそばの人物は、左手に書物を持ち、右手の指で星を指しているようです。</p><img src="https://res.bibleox.com/s/img/image/simple/6751b012dba7720001514f69/s_p_jNTGMwic6Cse9xDG.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6751b012dba7720001514f69/m_p_jNTGMwic6Cse9xDG.jpg">拡大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/67618740dba7720001cd0e2c/m_p_ckKuGWqzHuN1tR5Q.jpg">別版 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686cf0535f47da2505d3ae4d/m_p_dajA4xvStk0EnnSq.jpg">別版 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686cf7725f47da2505d3ae50/m_p_n79yEKK4QSCeorx3.jpg">別版 4</a>] [<a href="https://res.bibleox.com/s/img/image/simple/442/m_p_5zQEQbMmBkEs9J2S.jpg">別版 5</a>]</p><p>生神女のそばの人物は、次の預言を語った預言者イザヤかもしれません。</p><blockquote><p>「それゆえ、わたしの主が御自らあなたたちにしるしを与えられる。見よ、<strong>おとめが身ごもって、男の子を産み</strong>その名をインマヌエルと呼ぶ」（<a href="https://bibleox.com/ja/jp-ni/is/7/#L14">イザ 7:14</a>）</p></blockquote><p>あるいはバラムかもしれません。</p><blockquote><p>「わたしには彼が見える。しかし、今はいない。彼を仰いでいる。しかし、間近にではない。<strong>ひとつの星がヤコブから進み出る</strong>。ひとつの笏がイスラエルから立ち上がりモアブのこめかみを打ち砕きシェトのすべての子らの頭の頂を砕く」（<a href="https://bibleox.com/ja/jp-ni/chis/24/#L17">民 24:17</a>）</p></blockquote><p>あるいは画家は、説明の銘を入れる代わりに、このような手法を使っただけかもしれません。画家は私たちに、書物を取って昇る星の預言を読み、この預言が語る方の誕生、すなわちおとめからの救い主の誕生を描いたのだと悟るよう促しています。</p><h3>良い羊飼いとしてのキリスト</h3><p>2世紀末。ローマ。カリストゥスのカタコンベ（<a href="https://en.wikipedia.org/wiki/Catacomb_of_Callixtus#Paintings">Callixitus Catacomb, Crypt of Lucina</a>）。</p><img src="https://res.bibleox.com/s/img/image/simple/473/s_p_mrIYHR2oqLQuPn0z.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/473/m_p_mrIYHR2oqLQuPn0z.jpg">拡大</a>]</p><h2>3世紀</h2><h3>生神女「オランタ（祈る人）」（ローマ）</h3><p>Catacomba Maggiore、ローマ[26][27]。前景におとめマリアと幼子キリストが描かれています。</p><img src="https://res.bibleox.com/s/img/image/simple/6751fe6ddba7720001514f7e/s_p_C1Iw2V4OhNy1SGOE.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6751fe6ddba7720001514f7e/m_p_C1Iw2V4OhNy1SGOE.jpg">拡大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686cefb35f47da2505d3ae4c/m_p_70zYu2r0np0WFNUu.jpg">別版 2</a>]</p><h3>キリスト、使徒たち、致命者ゴルゴニオス、ペトロ、マルケリヌス、ティブルティウス（ローマ）</h3><p>マルケリヌスとペトロのカタコンベ</p><img src="https://res.bibleox.com/s/img/image/simple/6752012adba7720001514f82/s_p_x5I0ahjwMz1X5LoJ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6752012adba7720001514f82/m_p_x5I0ahjwMz1X5LoJ.jpg">拡大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686d237a5f47da2505d3ae56/m_p_ST9me27UGtWHYDBc.jpg">別版 2</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/676082a6dba7720001cd0e22/s_p_YjPD3PzLDCF4wgh1.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/676082a6dba7720001cd0e22/m_p_YjPD3PzLDCF4wgh1.jpg">拡大</a>]</p><h3>良い羊飼いに祈る女性（ローマ）</h3><p>3世紀。プリスキラのカタコンベ[6]。</p><p>絵は一つの構図をなしています。画家は、周りに描かれた祈る人々が部屋の頂上を見上げて手を上げるように絵を配置しました。そこには<strong>良い羊飼い</strong>としてのキリストが描かれています（<a href="https://bibleox.com/ja/jp-ni/in/10/#L11">ヨハ 10:11</a>）。良い羊飼いを囲むすべての場面を一つの主題が結んでいます。<strong>死からの救い</strong>です。</p><img src="https://res.bibleox.com/s/img/image/simple/686bea5b5f47da2505d3ae31/s_p_pjRHeoFaUpKPoyEH.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686bea5b5f47da2505d3ae31/m_p_pjRHeoFaUpKPoyEH.jpg">拡大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686cf7375f47da2505d3ae4f/m_p_MOsOWI2vEXUj5ELf.jpg">別版 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6904b3f2205184ec278d6e53/m_p_0GRveVCOh2GBz7eq.jpg">別版 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/431/m_p_LUZsrJtesEWiwHBO.jpg">別版 4</a>]</p><p>良い羊飼いはキリストです（<a href="https://bibleox.com/ja/jp-ni/lk/15/#L6-7">ルカ 15:6-7</a>、<a href="https://bibleox.com/ja/jp-ni/in/10/#L1-21">ヨハ 10:1-21</a>、<a href="https://bibleox.com/ja/jp-ni/ps/23/">詩 23</a>）。</p><img src="https://res.bibleox.com/s/img/image/simple/69319f74205184ec278d6fa7/s_p_GR8gHxKZuC87xqlf.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69319f74205184ec278d6fa7/m_p_GR8gHxKZuC87xqlf.jpg">拡大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686d2ac55f47da2505d3ae59/m_p_JDvtNt9RJrqnAsEW.jpg">別版 2</a>]</p><p>頭を覆った女性が両手を上げて祈っています（おそらくサラ：<a href="https://bibleox.com/ja/jp-ni/gen/18/#L1-15">創 18:1-15</a>、<a href="https://bibleox.com/ja/jp-ni/gen/21/#L1-7">創 21:1-7</a>）。</p><img src="https://res.bibleox.com/s/img/image/simple/686bea885f47da2505d3ae32/s_p_79wnuevuFIi3tnrH.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686bea885f47da2505d3ae32/m_p_79wnuevuFIi3tnrH.jpg">拡大</a>]</p><p>右には旧約の場面：三人の若者（<a href="https://en.wikipedia.org/wiki/Catacomb_of_Priscilla#/media/File:Shadrach,_Meshach,_and_Abednego_in_the_fiery_furnace,_from_the_book_Die_Malereien_der_Katakomben_Roms,_plate_78,_levels_adjusted.jpg">シャドラク、メシャク、アベド・ネゴ</a>）が両手を上げて祈っています（<a href="https://bibleox.com/ja/jp-ni/dan/3/">ダニ 3</a>）。</p><img src="https://res.bibleox.com/s/img/image/simple/686cfc565f47da2505d3ae52/s_p_NmZJuoF70d9qohZs.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686cfc565f47da2505d3ae52/m_p_NmZJuoF70d9qohZs.jpg">拡大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686cfc475f47da2505d3ae51/m_p_qzHB83d52LoU7QQL.jpg">別版 2</a>]</p><p>左には旧約の場面：いけにえのための薪を持つアブラハムとイサク（<a href="https://bibleox.com/ja/jp-ni/gen/22/#L1-19">創 22:1-19</a>）。</p><img src="https://res.bibleox.com/s/img/image/simple/686d33c45f47da2505d3ae5a/s_p_QQLn5T52hx8gSrBf.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d33c45f47da2505d3ae5a/m_p_QQLn5T52hx8gSrBf.jpg">拡大</a>]</p><p>入口の上には、海の生き物に呑み込まれる預言者ヨナが描かれています（<a href="https://bibleox.com/ja/jp-ni/ion/2/#L1">ヨナ 2:1</a>）。</p><img src="https://res.bibleox.com/s/img/image/simple/476/s_p_aHV4YSuoWhVZ1H5y.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/476/m_p_aHV4YSuoWhVZ1H5y.jpg">拡大</a>]</p><p>部屋の正面に描かれた、祈る女性の生涯の場面はもっと詳しく説明する価値があります。</p><img src="https://res.bibleox.com/s/img/image/simple/686d36265f47da2505d3ae5d/s_p_MGpxKQ94pikRfgFK.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d36265f47da2505d3ae5d/m_p_MGpxKQ94pikRfgFK.jpg">拡大</a>]</p><p><strong>正面の場面の出来事</strong></p><p>部屋の構図の各区画は一つの場面を描いています。どの場面もキリスト教の主題の大切な要素です。上には良い羊飼いの場面、左にはアブラハムの場面、右には三人の若者、通路には預言者ヨナがあります。そこで、画家は解釈の難しい部屋の正面でもこの規則（一区画に一つの大切な場面）を守ったと推測できます。以下は一つの推測にすぎません。中央を除くすべての面に旧約の場面が描かれているので、正面にはハガルの物語（<a href="https://bibleox.com/ja/jp-ni/gen/16/">創 16</a>、<a href="https://bibleox.com/ja/jp-ni/gen/21/">創 21</a>）が描かれていると考えられます。そうだとすると、まずアブラハムと、子イシュマエルとともに追い出されるハガル（1）、次にサラの祈り（2）、そして幼子に乳を飲ませるハガル（3）が描かれていることになります。</p><p>この解釈をもっと詳しく見てみましょう。</p><p><strong>1. ハガルの追放</strong>。座っているのはアブラハムだと、かなり確かに言えます（向かいのアブラハムのフレスコ画と同じ髪とひげです）。黄色の服を着ているのはおそらくハガルです（黄色は奴隷の身分を表したのかもしれません）。手には水の革袋を持っているようです（<a href="https://bibleox.com/ja/jp-ni/gen/21/#L14">創 21:14</a>）。その後ろにいるのはおそらく息子イシュマエルで、追放のときには15歳を超えていたはずです（<em>イシュマエルはアブラハムが86歳のときに生まれ</em><a href="https://bibleox.com/ja/jp-ni/gen/16/#L16">創 16:16</a><em>、イサクはアブラハムが100歳のときに生まれ</em><a href="https://bibleox.com/ja/jp-ni/gen/21/#L5">創 21:5</a><em>、ハガルはイサクが育って乳離れしたときに追い出されます</em><a href="https://bibleox.com/ja/jp-ni/gen/21/#L8-13">創 21:8-13</a>）。エプロンをつけた女性のようにも見えますが、そうだとすればそれはハガル自身でしかありえず（未婚の女性は頭を覆いません）、水の革袋を持っているのはイシュマエルということになります。いずれにせよ、残る二人はハガルとイシュマエルだというのが最も有力な解釈です。また、この構図は別々の区画ではなく一つの絵全体なのかもしれません。幼子を抱く女性が、両手を上げた女性を見ているからです。</p><img src="https://res.bibleox.com/s/img/image/simple/686d33c95f47da2505d3ae5b/s_p_kuEcuyUnGenBuWPw.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d33c95f47da2505d3ae5b/m_p_kuEcuyUnGenBuWPw.jpg">拡大</a>]</p><p><strong>2. サラの祈り</strong>。赤い服を着て頭を覆ったサラが神に祈っています。赤い服は高い身分を、覆った頭は既婚であることを示しています。</p><img src="https://res.bibleox.com/s/img/image/simple/686d3a855f47da2505d3ae5e/s_p_rpl3jnuNnx8ZisdR.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d3a855f47da2505d3ae5e/m_p_rpl3jnuNnx8ZisdR.jpg">拡大</a>]</p><p><strong>3. 幼子に乳を飲ませるハガル</strong>。ハガルだという解釈を支えるのは、頭を覆っていない（つまり未婚である）こと、そして髪形が最初の場面の黄色の服の人物と同じであることです。特徴的なまなざしも彼女だと示しています。彼女は、緊張した関係にあったサラを見ています。興味深いことに、画家は彼女を左に座るアブラハムとまったく同じように描きました。椅子に座り、まったく同じ服（縦の縞、袖の二本の線、マント）を着ています。</p><img src="https://res.bibleox.com/s/img/image/simple/686d22a05f47da2505d3ae54/s_p_8fxd9vcRlXYszSJU.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d22a05f47da2505d3ae54/m_p_8fxd9vcRlXYszSJU.jpg">拡大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686d33cd5f47da2505d3ae5c/m_p_qKPp740xLZNuDEFs.jpg">別版 2</a>]</p><p><strong>部屋全体の思想：死からの救い</strong></p><p>このクビクルム（墓室）の構図には、一つの美しい思想があります。死からの救いです。全体の物語は下から上へ段階的に昇っていきます。</p><ul><li><p>最も下の段：死に勝利したキリストを信じて葬られたキリスト教徒たち。</p></li><li><p>中段：死からの救いについての聖書の物語。</p><ul><li><p>バビロンの炉の中の三人の若者は火による死から救われた。</p></li><li><p>預言者ヨナは海の生き物の腹の中での死から救われた。</p></li><li><p>イサクはいけにえにされることから救われ、代わりに雄羊がささげられた。</p></li><li><p>ハガルと子イシュマエルは荒れ野での死から救われた。</p></li></ul></li><li><p>その上の段：キリスト教の象徴である孔雀（復活、不死、永遠の命）と山鶉（魂）。一羽の山鶉は生きた植物のそば（命の象徴）に、もう一羽は枯れた植物のそば（死の象徴）に立っています。孔雀も同じように立っています。</p></li><li><p>天井の中央：信じる者を死から救う良い羊飼い。注目すべきことに、ここにはもう一つ死からの救いへの小さな言及があります。羊飼いの左右に、ノアが箱舟から放ったからすと、オリーブの枝をくわえた鳩がとまっています。こうして、箱舟で死から救われた者たちが、これらの鳥によって死からの救い主キリストへと導かれるのです。</p></li></ul><h3>ドゥラ・エウロポスの聖堂（シリア）</h3><p>244年。ドゥラ・エウロポスの聖堂には、旧約の出来事のほかに新約の場面のフレスコ画もありました。溺れかけた使徒ペトロが救われる場面と、羊の池のほとりで体の麻痺した人がいやされる場面です。<a href="https://vk.com/@aletheia-de-sacris-imaginibus-venerandis?anchor=v-drugie-svyaschennye-izobrazhenia-v-donikeyskiy-period">記事</a>もご覧ください。</p><p><strong>良い羊飼いとしてのキリスト（洗礼室の主な眺め）</strong></p><img src="https://res.bibleox.com/s/img/image/simple/6931870c205184ec278d6fa2/s_p_uBkNi8jGsMFpOQSM.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931870c205184ec278d6fa2/m_p_uBkNi8jGsMFpOQSM.jpg">拡大</a>]</p><p><strong>溺れかけた使徒ペトロが救われる</strong></p><img src="https://res.bibleox.com/s/img/image/simple/692c8038205184ec278d6f9e/s_p_QQ2Rml8gUWsyQtS9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c8038205184ec278d6f9e/m_p_QQ2Rml8gUWsyQtS9.jpg">拡大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6786b88ddba77200015ae11c/m_p_do380IVDukCAfdFk.jpg">別版 2</a>]</p><p><strong>羊の池のほとりで体の麻痺した人がいやされる</strong></p><img src="https://res.bibleox.com/s/img/image/simple/6786b889dba77200015ae11b/s_p_k1a5GDBvfzTCWmZv.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6786b889dba77200015ae11b/m_p_k1a5GDBvfzTCWmZv.jpg">拡大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6786bb0bdba77200015ae11d/m_p_dCRD85foL69l7kih.jpg">別版</a>]</p><h3>良い羊飼いとしてのキリスト、預言者ヨナ</h3><p>3世紀末〜4世紀初め。ローマ。マルケリヌスとペトロのカタコンベ。</p><p>中央には良い羊飼いとしてのキリスト。中央の両側にヨナが描かれています。左のフレスコ画ではヨナが船から投げ込まれ、右では大魚が彼を呑み込みます。</p><img src="https://res.bibleox.com/s/img/image/simple/478/s_p_yvJcnbLGPxZ6AzRu.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/478/m_p_yvJcnbLGPxZ6AzRu.jpg">拡大</a>]</p><p>預言者ヨナ</p><img src="https://res.bibleox.com/s/img/image/simple/481/s_p_7z5j4tAimokFaRMN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/481/m_p_7z5j4tAimokFaRMN.jpg">拡大</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/480/s_p_b8gqyOenKZcn2MCp.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/480/m_p_b8gqyOenKZcn2MCp.jpg">拡大</a>]</p><h3>良い羊飼いとしてのキリスト</h3><p>3世紀。ローマ。カリストゥスのカタコンベ（<a href="https://en.wikipedia.org/wiki/Catacomb_of_Callixtus#Paintings">Callixitus Catacomb, Crypt of Lucina</a>）。桶には聖体の象徴である乳が入っていると考えられます（アレクサンドリアのクレメンスを参照）。</p><img src="https://res.bibleox.com/s/img/image/simple/474/s_p_zcLmMd2qkyG3pDoj.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/474/m_p_zcLmMd2qkyG3pDoj.jpg">拡大</a>]</p><h3>良い羊飼い、ヒサルテペのネクロポリス、ニカイア（イズニク）</h3><p>3世紀ごろ。最近の発見で、年代は推定です（<a href="https://www.arkeolojikhaber.com/haber-iznikte-benzersiz-bir-kesif-anadolunun-tek-coban-isa-figuru-gun-yuzune-cikarildi-43079/">詳しくは</a>）。このネクロポリスは2世紀から5世紀まで使われました。</p><p>座標：40.78204218462122, 29.928491677648932。トルコ語の地名：Hasartep Nekropolü。</p><img src="https://res.bibleox.com/s/img/image/simple/69444e49205184ec278d6fdb/s_p_SZTpvcDdpodujcbM.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69444e49205184ec278d6fdb/m_p_SZTpvcDdpodujcbM.jpg">拡大</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6941a813205184ec278d6fda/s_p_CUoa7dSy5UxGf1UD.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6941a813205184ec278d6fda/m_p_CUoa7dSy5UxGf1UD.jpg">拡大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6941a80f205184ec278d6fd9/m_p_xSCaRt10DUUReyMt.jpg">別版 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/693c7d1a205184ec278d6fcb/m_p_mR5ZaVgXbezmXDyo.jpg">別版 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/693d606b205184ec278d6fd3/m_p_TKCjvhxmnq0q50tW.jpg">別版 4</a>] [<a href="https://res.bibleox.com/s/img/image/simple/693d6101205184ec278d6fd7/m_p_1i6aL6lfDR08iA13.jpg">別版 5</a>] [<a href="https://res.bibleox.com/s/img/image/simple/693d60f8205184ec278d6fd6/m_p_b2uUaO6tzciaKAgC.jpg">別版 6</a>] [<a href="https://res.bibleox.com/s/img/image/simple/693d60f1205184ec278d6fd5/m_p_bErh7lbI0e08hPaa.jpg">別版 7</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/693c7db2205184ec278d6fd2/s_p_wCZsWPWG7jCNLjIr.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/693c7db2205184ec278d6fd2/m_p_wCZsWPWG7jCNLjIr.jpg">拡大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/693d60ad205184ec278d6fd4/m_p_BCvsIiJX10j2Mf2k.jpg">男性と女性</a>] [<a href="https://res.bibleox.com/s/img/image/simple/693c7daa205184ec278d6fd1/m_p_cjk36Xjpev9EFq2h.jpg">女性</a>]</p><h3>結婚指輪（ビザンティン）</h3><p>3〜4世紀。<a href="https://www.metmuseum.org/art/collection/search/663485">メトロポリタン美術館（五番街、アメリカ）</a>。（ギリシア語 χάρις — 恩寵）</p><img src="https://res.bibleox.com/s/img/image/simple/68b5da8b45c75323d28a5e99/s_p_GNh1S8L7fcowsMEE.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5da8b45c75323d28a5e99/m_p_GNh1S8L7fcowsMEE.jpg">拡大</a>]</p><h3>聖体礼儀の執行</h3><p>3世紀。ローマ。カリストゥスのカタコンベ（<a href="https://en.wikipedia.org/wiki/Catacomb_of_Callixtus#Paintings">Callixitus Catacomb, Crypt of Lucina</a>）。おそらく輔祭とともに奉仕する司祭が描かれています。今日でも正教会の聖堂では同じように聖体礼儀が行われます。司祭は両手を上げ、輔祭は聖なる供え物を指し示します。</p><img src="https://res.bibleox.com/s/img/image/simple/479/s_p_Zbn405P2krjwNAYl.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/479/m_p_Zbn405P2krjwNAYl.jpg">拡大</a>]</p><h2>4世紀</h2><h3>キリスト（ローマ）</h3><p>コンモディラのカタコンベ。</p><img src="https://res.bibleox.com/s/img/image/simple/66cc2bd6dba77200019bc7d2/s_p_7xYGBb9wCmxBIGrZ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/66cc2bd6dba77200019bc7d2/m_p_7xYGBb9wCmxBIGrZ.jpg">拡大</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686d23425f47da2505d3ae55/s_p_LzqgbhnIsbqtghoc.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d23425f47da2505d3ae55/m_p_LzqgbhnIsbqtghoc.jpg">拡大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a1e1205184ec278d6fa8/m_p_KC0MljXJf5po70pj.jpg">別版 2</a>]</p><h3>キリストと使徒たち（ローマ）</h3><p>350年ごろ。[8][9] サンタ・コスタンツァ廟。</p><img src="https://res.bibleox.com/s/img/image/simple/686990665f47da2505d3ae19/s_p_5RDr4ou4ExBAh4KE.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686990665f47da2505d3ae19/m_p_5RDr4ou4ExBAh4KE.jpg">拡大</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686990425f47da2505d3ae17/s_p_CXn5KmuiWradhOvh.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686990425f47da2505d3ae17/m_p_CXn5KmuiWradhOvh.jpg">拡大</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686990545f47da2505d3ae18/s_p_IkgteAcecXoMC106.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686990545f47da2505d3ae18/m_p_IkgteAcecXoMC106.jpg">拡大</a>]</p><h3>サン・ジョヴァンニ・イン・フォンテ洗礼堂（ナポリ）</h3><p>350〜400年。[11][12]</p><img src="https://res.bibleox.com/s/img/image/simple/6869924c5f47da2505d3ae1a/s_p_t1iU8sClY3pnOnkK.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6869924c5f47da2505d3ae1a/m_p_t1iU8sClY3pnOnkK.jpg">拡大</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686992505f47da2505d3ae1b/s_p_BrRKZmtReJbgXm0w.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686992505f47da2505d3ae1b/m_p_BrRKZmtReJbgXm0w.jpg">拡大</a>]</p><h3>キリストと天使、再臨（テッサロニキ、ビザンティン）</h3><p>4世紀末。[17][18] 勝利者聖ゲオルギオスのロトンダ（もとはガレリウス帝の霊廟）。</p><img src="https://res.bibleox.com/s/img/image/simple/6931a254205184ec278d6fa9/s_p_bWn7Chqiox5UOEd4.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931a254205184ec278d6fa9/m_p_bWn7Chqiox5UOEd4.jpg">拡大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a2ba205184ec278d6faa/m_p_ROPWmBVyUxWMGo9Z.jpg">別版 2</a>]</p><p>モザイクの保存状態は良くありません。キリストの像は光輪の一部と手と十字架しか残っていません。周りの天使たちの顔ははっきり見えます。</p><img src="https://res.bibleox.com/s/img/image/simple/686a91695f47da2505d3ae1f/s_p_EoOSmhaBPsy32XQQ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686a91695f47da2505d3ae1f/m_p_EoOSmhaBPsy32XQQ.jpg">拡大</a>]</p><h3>聖なる主教、兵士、医者たち（テッサロニキ、ビザンティン）</h3><p>4世紀末。[17][18] 勝利者聖ゲオルギオスのロトンダ（もとはガレリウス帝の霊廟）。</p><p>モザイクの中には、ロマノス、キュリロス、レオン、オネシフォロス、エウカルピオス、バシリスコス、ポルフュリオス、フィレモン、プリスコス、テリノス、コスマ、ダミアンという名を持つ聖なる主教、兵士、医者、楽人たちの像があります。</p><img src="https://res.bibleox.com/s/img/image/simple/686aa0275f47da2505d3ae21/s_p_oIksDo9rIgSoAXvG.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa0275f47da2505d3ae21/m_p_oIksDo9rIgSoAXvG.jpg">拡大</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686aa02e5f47da2505d3ae22/s_p_nTZtC6C93KI8Fu6I.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa02e5f47da2505d3ae22/m_p_nTZtC6C93KI8Fu6I.jpg">拡大</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686aa0335f47da2505d3ae23/s_p_b1KhWllqTzipVhO9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa0335f47da2505d3ae23/m_p_b1KhWllqTzipVhO9.jpg">拡大</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686aa0385f47da2505d3ae24/s_p_vvlbG9E89B9T0U8j.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa0385f47da2505d3ae24/m_p_vvlbG9E89B9T0U8j.jpg">拡大</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686aa03f5f47da2505d3ae25/s_p_d3lcRobegfAQOf6e.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa03f5f47da2505d3ae25/m_p_d3lcRobegfAQOf6e.jpg">拡大</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686aa0555f47da2505d3ae27/s_p_h1YgFpMukwaYc23Q.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa0555f47da2505d3ae27/m_p_h1YgFpMukwaYc23Q.jpg">拡大</a>]</p><p>聖コスマと聖ダミアン</p><img src="https://res.bibleox.com/s/img/image/simple/686aa04e5f47da2505d3ae26/s_p_LwMjPHLsabDDxEHy.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa04e5f47da2505d3ae26/m_p_LwMjPHLsabDDxEHy.jpg">拡大</a>]</p><h3>強盗たちのあいだで十字架につけられたキリストの像（ローマ）</h3><p>4世紀初め［通常は430年ごろとされます］。サンタ・サビーナ聖堂、扉のパネルの一つ。十字架刑の浮き彫り。</p><img src="https://res.bibleox.com/s/img/image/simple/676183a8dba7720001cd0e2b/s_p_ccaA7HzLPDInwe1b.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/676183a8dba7720001cd0e2b/m_p_ccaA7HzLPDInwe1b.jpg">拡大</a>]</p><h3>主のエルサレム入城（ビザンティン）</h3><p>4世紀初め。<a href="https://www.metmuseum.org/art/collection/search/466220">メトロポリタン美術館（五番街、アメリカ）</a>。67.3 × 212.1 × 61.9 cm。</p><img src="https://res.bibleox.com/s/img/image/simple/68b5e69845c75323d28a5e9d/s_p_Kk1dIB2OLr1OjQ1O.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5e69845c75323d28a5e9d/m_p_Kk1dIB2OLr1OjQ1O.jpg">拡大</a>]</p><h3>キリスト、石板（ケルソネソス）</h3><p>300〜500年。<a href="https://collections.louvre.fr/en/ark:/53355/cl010276835">ルーヴル美術館（フランス）</a>。美術館によれば、もう一つの部分はエルミタージュにあります。使徒ペトロに向けた言葉が刻まれています。</p><img src="https://res.bibleox.com/s/img/image/simple/68c41cec6594f46d35a87f04/s_p_esWl4etLsBMVz9bw.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c41cec6594f46d35a87f04/m_p_esWl4etLsBMVz9bw.jpg">拡大</a>]</p><h3>教師キリスト（ローマ）</h3><p>ドミティラのカタコンベ。クビクルムのルネッタ（半円形の壁面）の壁画。</p><img src="https://res.bibleox.com/s/img/image/simple/674ed2a4dba77200011c738a/s_p_4M8Vki7GNJBHkJPN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674ed2a4dba77200011c738a/m_p_4M8Vki7GNJBHkJPN.jpg">拡大</a>]</p><h3>主イエス・キリスト（ローマ）</h3><p>3〜5世紀。ゲネローサのカタコンベ [7]</p><img src="https://res.bibleox.com/s/img/image/simple/674f2408dba77200011c739c/s_p_zVliPTIYBpqqnTGQ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f2408dba77200011c739c/m_p_zVliPTIYBpqqnTGQ.jpg">拡大</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6931a55a205184ec278d6faf/s_p_xXRXPudiFDi6GltL.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931a55a205184ec278d6faf/m_p_xXRXPudiFDi6GltL.jpg">拡大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686bf5b25f47da2505d3ae36/m_p_Io7kaT9uNdBPFcSj.jpg">別版 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a5b6205184ec278d6fb0/m_p_btFyqkRBFzGf0FSH.jpg">別版 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a5e4205184ec278d6fb1/m_p_wuVaj4ghYuk6s5cc.jpg">別版 4</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a5fe205184ec278d6fb2/m_p_mO6KaZXywWX76vBg.jpg">別版 5</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a656205184ec278d6fb3/m_p_eqLfG1BFyG45i90X.jpg">別版 6</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a858205184ec278d6fb5/m_p_EVVCP1plDQZ4XgAS.jpg">別版 7</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6931a360205184ec278d6fab/s_p_hObpAcapDVZvLsC1.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931a360205184ec278d6fab/m_p_hObpAcapDVZvLsC1.jpg">拡大</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6931a369205184ec278d6fad/s_p_8bP3aXtUgkNcP9gz.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931a369205184ec278d6fad/m_p_8bP3aXtUgkNcP9gz.jpg">拡大</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6931a363205184ec278d6fac/s_p_BcSN3IXA4JYFLpgA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931a363205184ec278d6fac/m_p_BcSN3IXA4JYFLpgA.jpg">拡大</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6931a36f205184ec278d6fae/s_p_6J6vSMM0TM5tc59T.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931a36f205184ec278d6fae/m_p_6J6vSMM0TM5tc59T.jpg">拡大</a>]</p><h3>聖ウィアトリクスと聖シンプリキウス（またはルフス）（ローマ）</h3><p>3〜5世紀。ゲネローサのカタコンベ [7]</p><img src="https://res.bibleox.com/s/img/image/simple/66cc2c40dba77200019bc7d8/s_p_zABjPHGhPdjGVh3U.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/66cc2c40dba77200019bc7d8/m_p_zABjPHGhPdjGVh3U.jpg">拡大</a>]</p><h3>使徒ペトロとパウロ（ローマ）</h3><p>380年ごろ。サンタ・テクラ（聖テクラ）のカタコンベ、フレスコ画 [24]</p><p>描かれている使徒：ペトロ、パウロ、アンデレ、ヨハネ。</p><img src="https://res.bibleox.com/s/img/image/simple/686bf38e5f47da2505d3ae35/s_p_BxfiObhkLMfci8nP.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686bf38e5f47da2505d3ae35/m_p_BxfiObhkLMfci8nP.jpg">拡大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/687291145f47da2505d3ae8b/m_p_WXlkaMJTOrIzlOdI.jpg">別版 2</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/68b6cd4802e89ba22dfc3977/s_p_kAWGH2VPHMkRv9cL.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b6cd4802e89ba22dfc3977/m_p_kAWGH2VPHMkRv9cL.jpg">拡大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686bf5bf5f47da2505d3ae37/m_p_F0tsoqA9bv6CrpfE.jpg">別版 2</a>]</p><h3>使徒ペトロとパウロ（ビザンティン）</h3><p>4世紀半ば。キリストが使徒ペトロとパウロに致命者の冠を授ける。<a href="https://www.metmuseum.org/art/collection/search/463547">メトロポリタン美術館（五番街、アメリカ）</a>。ローマまたはビザンティン。13.8 × 12.5 × 5 cm。</p><img src="https://res.bibleox.com/s/img/image/simple/68b5f5d745c75323d28a5ebc/s_p_MiCffui3hayo2BCt.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5f5d745c75323d28a5ebc/m_p_MiCffui3hayo2BCt.jpg">拡大</a>]</p><hr><p>4世紀半ば。<a href="https://www.metmuseum.org/art/collection/search/468386">メトロポリタン美術館（五番街、アメリカ）</a>。ローマまたはビザンティン。8.5 × 14 × 13.3 cm。</p><img src="https://res.bibleox.com/s/img/image/simple/68b5e89c45c75323d28a5ea1/s_p_HAfNPGdEHMp67CuN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5e89c45c75323d28a5ea1/m_p_HAfNPGdEHMp67CuN.jpg">拡大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5e88f45c75323d28a5ea0/m_p_gvro4Ry9POJUm0nR.jpg">側面</a>]</p><hr><p>4世紀末。<a href="https://www.metmuseum.org/art/collection/search/463714">メトロポリタン美術館（五番街、アメリカ）</a>。ガラス、金箔。</p><img src="https://res.bibleox.com/s/img/image/simple/68b5e68b45c75323d28a5e9c/s_p_uRLyImBPPDsr48G2.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5e68b45c75323d28a5e9c/m_p_uRLyImBPPDsr48G2.jpg">拡大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5e76d45c75323d28a5e9e/m_p_62cHpid14wgeSyqc.jpg">別版 2</a>]</p><hr><p>4世紀半ば。使徒ペトロとパウロ、ペレグリナ。<a href="https://www.metmuseum.org/art/collection/search/465922">メトロポリタン美術館（五番街、アメリカ）</a>。11.5 × 13.3 × 1.2 cm。</p><img src="https://res.bibleox.com/s/img/image/simple/68b5e7d145c75323d28a5e9f/s_p_atDwcEc3h2ZyYLRb.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5e7d145c75323d28a5e9f/m_p_atDwcEc3h2ZyYLRb.jpg">拡大</a>]</p><h3>使徒ペトロとパウロ（ローマ）</h3><p>4世紀。カタコンベの子どもの墓龕（ロクルス）をふさぐのに使われた石板。ローマ、ヴァチカン美術館、ピオ・キリスト教美術館。</p><img src="https://res.bibleox.com/s/img/image/simple/674f1bc0dba77200011c739a/s_p_uH3btIsNTUn6lHGQ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f1bc0dba77200011c739a/m_p_uH3btIsNTUn6lHGQ.jpg">拡大</a>]</p><h3>幼子キリストを抱く生神女（ローマ）</h3><p>3〜4世紀。ドミティラのカタコンベ。</p><img src="https://res.bibleox.com/s/img/image/simple/66cc2c11dba77200019bc7d5/s_p_rZQc8oqW4YIrUMho.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/66cc2c11dba77200019bc7d5/m_p_rZQc8oqW4YIrUMho.jpg">拡大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686d246b5f47da2505d3ae57/m_p_AZTFv8hTAm4Eo9yp.jpg">別版 2</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686d24885f47da2505d3ae58/s_p_Z1QqJZuraUn8iLSV.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d24885f47da2505d3ae58/m_p_Z1QqJZuraUn8iLSV.jpg">拡大</a>]</p><h3>キリストの像のある十字架（ビザンティン）</h3><p>395〜641年。<a href="https://collections.louvre.fr/en/ark:/53355/cl010043937">ルーヴル美術館（フランス）</a>。8.5 × 20 × 1.2 cm。</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c5886594f46d35a87ec7/s_p_wU3HuTavyFqHCHIc.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c5886594f46d35a87ec7/m_p_wU3HuTavyFqHCHIc.jpg">拡大</a>]</p><h3>イコン（エジプト）</h3><p>395〜641年。<a href="https://collections.louvre.fr/en/ark:/53355/cl010049211">ルーヴル美術館（フランス）</a>。24 × 17.5 cm</p><img src="https://res.bibleox.com/s/img/image/simple/68c3bf006594f46d35a87ebf/s_p_m1O6PHgeoR9L2huf.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3bf006594f46d35a87ebf/m_p_m1O6PHgeoR9L2huf.jpg">拡大</a>]</p><hr><p><a href="https://collections.louvre.fr/en/ark:/53355/cl010049209">ルーヴル美術館（フランス）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c8966594f46d35a87ec8/s_p_hfH86ZqQDaRWHKRA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c8966594f46d35a87ec8/m_p_hfH86ZqQDaRWHKRA.jpg">拡大</a>]</p><h3>聖メナスのイコンのあるアンプラ（ビザンティン）</h3><p>395〜641年。<a href="https://collections.louvre.fr/en/ark:/53355/cl010042774">ルーヴル美術館（フランス）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c4176594f46d35a87ec3/s_p_RYRsljTrixb3giuP.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c4176594f46d35a87ec3/m_p_RYRsljTrixb3giuP.jpg">拡大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c3c4196594f46d35a87ec4/m_p_20KqaRLqoxUISfqB.jpg">裏面</a>]</p><hr><p>395〜641年。<a href="https://collections.louvre.fr/en/ark:/53355/cl010042778">ルーヴル美術館（フランス）</a>。このようなアンプラは各地の美術館に非常に多く見られます。ほかの例：<a href="https://collections.louvre.fr/en/ark:/53355/cl010042780">1</a>、<a href="https://collections.louvre.fr/en/ark:/53355/cl010042798">2</a>、<a href="https://collections.louvre.fr/en/ark:/53355/cl010042802">3</a>、<a href="https://collections.louvre.fr/en/ark:/53355/cl010043779">4</a>、<a href="https://collections.louvre.fr/en/ark:/53355/cl010076645">5</a>、<a href="https://collections.louvre.fr/en/ark:/53355/cl010051239">6</a>、<a href="https://collections.louvre.fr/en/ark:/53355/cl010263188">7</a>、<a href="https://collections.louvre.fr/en/ark:/53355/cl010280896">8</a>、<a href="https://collections.louvre.fr/en/ark:/53355/cl010044285">9</a>、<a href="https://collections.louvre.fr/en/ark:/53355/cl010280846">10</a>、<a href="https://collections.louvre.fr/en/ark:/53355/cl010280894">11</a>、<a href="https://www.clevelandart.org/art/1999.232">12</a>、<a href="https://www.clevelandart.org/art/1999.233">13</a>、<a href="https://www.clevelandart.org/art/1999.231">14</a>、<a href="https://www.clevelandart.org/art/1999.230">15</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c4c66594f46d35a87ec5/s_p_b5etRE60QJjNF7zQ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c4c66594f46d35a87ec5/m_p_b5etRE60QJjNF7zQ.jpg">拡大</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c4cd6594f46d35a87ec6/s_p_vJbng6ICUUefTimC.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c4cd6594f46d35a87ec6/m_p_vJbng6ICUUefTimC.jpg">拡大</a>]</p><h3>生神女とキリストの像のある鉛のアンプラ（イタリア、ボローニャ）</h3><p>4〜5世紀。「聖地からの聖油を入れたこのようなアンプラは、東方から、すなわち4世紀末から巡礼が定着し、5世紀前半には非常に多くの巡礼者が訪れたパレスチナから、巡礼者たちによって大量に持ち帰られた」[27]</p><img src="https://res.bibleox.com/s/img/image/simple/686d3bdc5f47da2505d3ae5f/s_p_gcwh26YTfBvz5FbR.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d3bdc5f47da2505d3ae5f/m_p_gcwh26YTfBvz5FbR.jpg">拡大</a>]</p><h2>5世紀</h2><h3>幼子イエスを抱く生神女、致命者フェリクスとアダウクトゥス、やもめコンモディラ（ローマ）</h3><p>5〜6世紀。コンモディラのカタコンベ。左手前には、記念してカタコンベの聖堂が建てられた裕福なローマの女性、やもめコンモディラが描かれています。</p><img src="https://res.bibleox.com/s/img/image/simple/674edb84dba77200011c738c/s_p_urBcFMzNnn49NanW.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674edb84dba77200011c738c/m_p_urBcFMzNnn49NanW.jpg">拡大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686bf61f5f47da2505d3ae38/m_p_gOZdkzGPGcL4Vws0.jpg">別版 2</a>]</p><h3>キリストと生神女（ビザンティン）</h3><p>400〜500年。材質：金。3.7 × 4 × 0.3 cm、重さ4.04 g。<a href="https://collections.louvre.fr/en/ark:/53355/cl010256498">ルーヴル美術館（フランス）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/68c403846594f46d35a87efb/s_p_Ahj64DxPe313azhi.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c403846594f46d35a87efb/m_p_Ahj64DxPe313azhi.jpg">拡大</a>]</p><h3>致命者ラウレンティウス（ラヴェンナ）</h3><p>425年。ガッラ・プラキディア廟[1][2][25]。開いた戸棚には4つの福音書、マルコ、マタイ、ルカ、ヨハネがあります。十字架と開いた福音書を持つ聖人が、下で火の燃える焼き網へと向かっています。</p><img src="https://res.bibleox.com/s/img/image/simple/674ee461dba77200011c738e/s_p_EPEyZAtXMtLhz0vO.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674ee461dba77200011c738e/m_p_EPEyZAtXMtLhz0vO.jpg">拡大</a>]</p><h3>使徒パウロ（エフェソ）</h3><p>5世紀末のフレスコ画、パウロの洞窟[4]。</p><img src="https://res.bibleox.com/s/img/image/simple/674f2a67dba77200011c73a0/s_p_Og6LudyAS5axVwrH.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f2a67dba77200011c73a0/m_p_Og6LudyAS5axVwrH.jpg">拡大</a>]</p><h3>使徒パウロ（ナポリ）</h3><p>5世紀末。サン・ジェンナーロのカタコンベ、フレスコ画。おそらく使徒パウロが描かれています。</p><img src="https://res.bibleox.com/s/img/image/simple/674f2705dba77200011c739d/s_p_XdEMnSngRpC4ver8.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f2705dba77200011c739d/m_p_XdEMnSngRpC4ver8.jpg">拡大</a>]</p><h3>イコニオンのテクラ、致命者（エフェソ）</h3><p>聖パウロと聖テクラの洞窟。使徒パウロの宣教によって信じた人の一人で、初期数世紀の致命者。2013年、この洞窟はイスラム過激派によって汚されました[4]。</p><img src="https://res.bibleox.com/s/img/image/simple/674f2c2edba77200011c73a1/s_p_tCvOXPpRP5ogjE1Y.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f2c2edba77200011c73a1/m_p_tCvOXPpRP5ogjE1Y.jpg">拡大</a>]</p><h3>テッサロニキの大致命者ディミトリオスと天使（テッサロニキ、ビザンティン）</h3><p>5〜6世紀。テッサロニキの聖ディミトリオス聖堂。聖堂西側のモザイク [10]</p><img src="https://res.bibleox.com/s/img/image/simple/686984705f47da2505d3ae11/s_p_bliIzjPrQcGjWmMT.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686984705f47da2505d3ae11/m_p_bliIzjPrQcGjWmMT.jpg">拡大</a>]</p><h3>テッサロニキの大致命者ディミトリオスと子ども（テッサロニキ、ビザンティン）</h3><p>5〜6世紀。テッサロニキの聖ディミトリオス聖堂。南側廊の西壁のモザイク [10]</p><img src="https://res.bibleox.com/s/img/image/simple/68697c845f47da2505d3ae10/s_p_T8JYB6OgB0WUM8O6.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68697c845f47da2505d3ae10/m_p_T8JYB6OgB0WUM8O6.jpg">拡大</a>]</p><h3>元老院議員の家、サンタ・プデンツィアーナ（ローマ）</h3><p>402〜417年。[13][14]</p><img src="https://res.bibleox.com/s/img/image/simple/6869938e5f47da2505d3ae1c/s_p_l5Dokt3jzLvx6IxN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6869938e5f47da2505d3ae1c/m_p_l5Dokt3jzLvx6IxN.jpg">拡大</a>]</p><h3>サンタ・マリア・マッジョーレ（ローマ）</h3><p>432〜440年。[15][16]</p><img src="https://res.bibleox.com/s/img/image/simple/6869954e5f47da2505d3ae1d/s_p_0bDTRtbRpWWnfPQR.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6869954e5f47da2505d3ae1d/m_p_0bDTRtbRpWWnfPQR.jpg">拡大</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686995555f47da2505d3ae1e/s_p_FLcJtADykEgKNDDd.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686995555f47da2505d3ae1e/m_p_FLcJtADykEgKNDDd.jpg">拡大</a>]</p><h3>キリスト、三人の若者、博士たち（北イタリア）</h3><p>400〜450年。<a href="https://collections.louvre.fr/en/ark:/53355/cl010256191">ルーヴル美術館（フランス）</a>。銀、6.3 × 12.3 × 7.1 cm。</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c1756594f46d35a87ec1/s_p_WzOTF3me39ISTfnN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c1756594f46d35a87ec1/m_p_WzOTF3me39ISTfnN.jpg">拡大</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c1796594f46d35a87ec2/s_p_a0udZW5EPewQCqsl.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c1796594f46d35a87ec2/m_p_a0udZW5EPewQCqsl.jpg">拡大</a>]</p><h3>イコン：使徒ペトロが聖マルコに福音書を口述する（エジプト）</h3><p>440〜670年。<a href="https://www.metmuseum.org/art/collection/search/477163">メトロポリタン美術館（五番街、アメリカ）</a>。13.5 × 10 × 0.8 cm。こちらも参照：<a href="https://www.metmuseum.org/art/collection/search/477492">1</a>、<a href="https://www.metmuseum.org/art/collection/search/477487">2</a>、<a href="https://www.metmuseum.org/art/collection/search/477481">3</a>、<a href="https://www.metmuseum.org/art/collection/search/477489">4</a>、<a href="https://www.metmuseum.org/art/collection/search/477491">5</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/68c1c2f56594f46d35a87e74/s_p_BWhcee0cn10mz7dc.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1c2f56594f46d35a87e74/m_p_BWhcee0cn10mz7dc.jpg">拡大</a>]</p><h3>名の知られていない聖人（ビザンティン、エジプト）</h3><p>5〜6世紀。<a href="https://www.metmuseum.org/art/collection/search/329982">メトロポリタン美術館（五番街、アメリカ）</a>。44 × 32.5 cm。</p><img src="https://res.bibleox.com/s/img/image/simple/68b5eb2d45c75323d28a5ea3/s_p_E5UUO66hSfRBtXUn.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5eb2d45c75323d28a5ea3/m_p_E5UUO66hSfRBtXUn.jpg">拡大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5eb2845c75323d28a5ea2/m_p_ofbMCUTa1winWDg0.jpg">別版 2</a>]</p><h3>聖メナスの像のあるアンプラ（コプト期エジプト）</h3><p>5〜7世紀。<a href="https://collections.hermitagemuseum.org/entity/OBJECT/87092?query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=34">エルミタージュ美術館（ロシア）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/6863c0796480b4d285320413/s_p_sW3adkK7lr960dU5.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c0796480b4d285320413/m_p_sW3adkK7lr960dU5.jpg">拡大</a>]</p><hr><p>5〜6世紀。聖メナスの像のあるアンプラ（エジプト）。<a href="https://www.metmuseum.org/art/collection/search/854993">メトロポリタン美術館（五番街、アメリカ）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/68b5f3f845c75323d28a5eb8/s_p_ePhTgphiYrxHdEaZ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5f3f845c75323d28a5eb8/m_p_ePhTgphiYrxHdEaZ.jpg">拡大</a>]</p><hr><p>5〜6世紀。聖メナスの像のあるアンプラ（エジプト）。<a href="https://www.metmuseum.org/art/collection/search/854994">メトロポリタン美術館（五番街、アメリカ）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/68b5f40645c75323d28a5eb9/s_p_5HMBehehtBuCUdOm.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5f40645c75323d28a5eb9/m_p_5HMBehehtBuCUdOm.jpg">拡大</a>]</p><h3>キリストの像のある指輪（エジプト、ルクソール）</h3><p>5〜7世紀。<a href="https://collections.hermitagemuseum.org/entity/OBJECT/111849?page=5&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%B0&amp;index=240">エルミタージュ美術館（ロシア）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/6863c4d46480b4d285320420/s_p_SyuBoqgvHXMA5UIe.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c4d46480b4d285320420/m_p_SyuBoqgvHXMA5UIe.jpg">拡大</a>]</p><h2>6世紀</h2><h3>主イエス・キリスト（シナイ）</h3><p>6世紀。聖カタリナ修道院、エジプト [3]。</p><img src="https://res.bibleox.com/s/img/image/simple/686fe7935f47da2505d3ae87/s_p_cikLnQnMeZgiaeXg.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686fe7935f47da2505d3ae87/m_p_cikLnQnMeZgiaeXg.jpg">拡大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6872d4935f47da2505d3ae90/m_p_1CbtDgulMkyLj9dK.jpg">別版 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6872d4835f47da2505d3ae8d/m_p_IPypUclQUGcqTIJa.jpg">別版 3</a>]</p><h3>幼子イエスを抱く生神女、聖テオドロスと聖ゲオルギオス（シナイ）</h3><p>6世紀。聖カタリナ修道院。蝋画（エンカウスティーク）のイコン、エジプト。</p><img src="https://res.bibleox.com/s/img/image/simple/674ece56dba77200011c7384/s_p_RWNQK8qhzLwXxGkf.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674ece56dba77200011c7384/m_p_RWNQK8qhzLwXxGkf.jpg">拡大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6872d4895f47da2505d3ae8e/m_p_6JgREZVUzpO8lC9E.jpg">別版 2</a>]</p><h3>使徒ペトロ（シナイ）</h3><p>6世紀。聖カタリナ修道院。蝋画（エンカウスティーク）のイコン、エジプト。</p><img src="https://res.bibleox.com/s/img/image/simple/686fe28f5f47da2505d3ae82/s_p_tWJyRADNEjI9Gt5J.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686fe28f5f47da2505d3ae82/m_p_tWJyRADNEjI9Gt5J.jpg">拡大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686fe73d5f47da2505d3ae86/m_p_ztqtzVnOwMfzjCsd.jpg">別版 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6872d48f5f47da2505d3ae8f/m_p_x4BAyJ0C1GjHQ7Us.jpg">別版 3</a>]</p><h3>生神女と幼子キリスト（ビザンティン）</h3><p>6世紀。<a href="https://www.metmuseum.org/art/collection/search/463392">メトロポリタン美術館（五番街、アメリカ）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/68b5fce645c75323d28a5ec5/s_p_KB8coyb4H50zurQW.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5fce645c75323d28a5ec5/m_p_KB8coyb4H50zurQW.jpg">拡大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5fce945c75323d28a5ec6/m_p_eIaeevwinjFBQAeA.jpg">別版 2</a>]</p><h3>生神女と幼子キリストのイコンのある指輪（ビザンティン）</h3><p>6〜7世紀。<a href="https://www.metmuseum.org/art/collection/search/464059">メトロポリタン美術館（五番街、アメリカ）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/68b5fe7745c75323d28a5ec7/s_p_bcCSRfNkRmmk5jZs.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5fe7745c75323d28a5ec7/m_p_bcCSRfNkRmmk5jZs.jpg">拡大</a>]</p><h3>聖マリア</h3><p>611年、<a href="https://www.pravenc.ru/text/164537.html">ゲラサ</a></p><img src="https://res.bibleox.com/s/img/image/simple/482/s_p_s3flMTpYpn69iMIy.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/482/m_p_s3flMTpYpn69iMIy.jpg">拡大</a>]</p><h3>キリスト、メダイヨン（アンティオキア）</h3><p>500〜625年。材質：銀、金めっき。14.9 × 14.1 × 1.1 cm。<a href="https://collections.louvre.fr/en/ark:/53355/cl010256496">ルーヴル美術館（フランス）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/68c409da6594f46d35a87f00/s_p_BHIOy3tEZ3ZoMEr5.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c409da6594f46d35a87f00/m_p_BHIOy3tEZ3ZoMEr5.jpg">拡大</a>]</p><hr><p>500〜625年。<a href="https://collections.louvre.fr/en/ark:/53355/cl010256495">ルーヴル美術館（フランス）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/68c41f626594f46d35a87f05/s_p_bKgaW542SgyD11o9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c41f626594f46d35a87f05/m_p_bKgaW542SgyD11o9.jpg">拡大</a>]</p><h3>イコンのタペストリー：キリスト、生神女、大天使ミカエルとガブリエル、使徒たち（エジプト、ビザンティン）</h3><p>500年。<a href="https://www.clevelandart.org/art/1967.144">クリーヴランド美術館（アメリカ）</a>。羊毛、178.7 × 110.5 cm。</p><p>美術館の解説：</p><blockquote><p>20色以上の羊毛の糸で作られたこの珍しいタペストリーは、当時は絵画よりも高価でした。その値段は、織り手たちが成し遂げた見事な色の混ぜ合わせを同時代の人々が高く評価していたことを示しています。壁に掛けられた<strong>この織られたイコンによって、信者たちは正教会の聖堂の中で生神女と幼子キリストを崇敬することができました</strong>。二人はギリシア語で名が記された天使と使徒たちに囲まれています。霊的に働くためには、イコン（聖なる像）はその像の確立した図像の伝統にできるだけ忠実に従わなければなりませんでした。</p><p>建築の枠の楣（まぐさ）にある銘は、ギリシア語から「<strong>聖ミカエル、聖マリア、聖ガブリエル</strong>」と訳されます。葉の広い縁飾りは果物と花で飾られ、下部には使徒たちの胸像のメダイヨンがあり、その名がそばにギリシア語で「<strong>アンデレ、マタイ、使徒パウロ、ルカ、ヤコブ、フィリポ、マルコ、トマス、ヨハネ、マティア、ペトロ、バルトロマイ</strong>」と記されています。</p></blockquote><img src="https://res.bibleox.com/s/img/image/simple/68cb9dd5205184ec278d58d7/s_p_jXuLxO8mwNy5DicO.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68cb9dd5205184ec278d58d7/m_p_jXuLxO8mwNy5DicO.jpg">拡大</a>]</p><h3>イコンのタペストリー。三人の若者？、キー・ロー（エジプト、ビザンティン）</h3><p>500年代。<a href="https://www.clevelandart.org/art/1982.73">クリーヴランド美術館（アメリカ）</a>。羊毛、亜麻。110.5 × 76.8 cm。</p><img src="https://res.bibleox.com/s/img/image/simple/68cb9dde205184ec278d58d8/s_p_w5vxLEtZSz6mW36r.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68cb9dde205184ec278d58d8/m_p_w5vxLEtZSz6mW36r.jpg">拡大</a>]</p><h3>イコンのタペストリー。生神女、博士たち、預言者ヨナ（エジプト、ビザンティン）</h3><p>500〜550年。<a href="https://www.clevelandart.org/art/1951.400">クリーヴランド美術館（アメリカ）</a>。亜麻。99.7 × 104.8 cm。</p><p>美術館の解説：</p><blockquote><p>… 上段の左には、十字形の脚の腰掛けに座る<strong>幼子キリストを抱くおとめマリア</strong>が描かれています。コプト語の銘が示すように、<strong>三人の王が贈り物を携えて右から近づいています</strong>。中段の左はおそらく<strong>キリストの洗礼</strong>を描き、柱で区切られたほかの三人の人物は、キリストがわずか五つのパンと二匹の魚で大群衆を養った新約の奇跡を表しているようです。下段には今も<strong>大魚に呑み込まれる預言者ヨナという旧約の場面</strong>が見分けられます。</p><p>ギリシア語の銘が旧約と新約のさまざまな場面を示しています。上段の最初の博士の上には、金を意味するギリシア語（<em>χρυσός、クリュソス</em>）の二文字<strong>「XP」</strong>が読み取れます。中段の左には二人の人物が描かれ、一人目はほとんど失われ、二人目は銘<strong>「EIΩANNHC」（ヨハネ）</strong>によって分かります。下段には、そばに大魚がいて岸に吐き出されたヨナが、銘<strong>「EIΩNAC」（ヨナ）</strong>とともに描かれています。ほとんど失われたモーセは、銘<strong>「MWCHC」（モーセ）</strong>によってのみ分かります。</p></blockquote><img src="https://res.bibleox.com/s/img/image/simple/68cb9e0d205184ec278d58d9/s_p_WiTqygXUYCZZY7TF.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68cb9e0d205184ec278d58d9/m_p_WiTqygXUYCZZY7TF.jpg">拡大</a>]</p><h3>イコンのある聖爵と香炉（ビザンティン、シリア、アッタルーティ）</h3><p>500〜650年。<a href="https://www.metmuseum.org/art/collection/search/474390">メトロポリタン美術館（五番街、アメリカ）</a>。銀、金めっき。聖爵には主と聖人たちのイコン、そしてだれがだれに献げたかを記した銘があります。</p><p>これらの見事な典礼用具、すなわち聖爵、香炉、こし器、聖神の鳩の像は、シリアの豊かな商業都市アッタルーティのキリスト教会のものでした。シリアは当時ビザンティン帝国で最も豊かな地方の一つでした。聖爵、香炉、こし器は、キリスト教徒が最後の晩餐とキリストの死を記憶して聖別されたぶどう酒とパンにあずかる機密、聖体礼儀で使われました。</p><p>いくつかの綴りの揺れがあるギリシア語の銘によれば、これらの品の多くは、町の人々が聖ステファノに献げられた町の主要な聖堂と、聖ヨハネ（おそらく前駆授洗イオアン［洗礼者ヨハネ］）に献げられた小さな聖堂に寄進したものです。</p><p>7世紀初め、シリアはまずサーサーン朝ペルシアに、次いでイスラムの軍勢に屈しました。おそらくこれらの品は、ビザンティン軍がこの地域を攻める者たちの前から退いたときに、急いで保護容器に入れて埋められたのでしょう。</p><img src="https://res.bibleox.com/s/img/image/simple/68b5db2045c75323d28a5e9a/s_p_kx70rC7wWJQtkfdG.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5db2045c75323d28a5e9a/m_p_kx70rC7wWJQtkfdG.jpg">拡大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5edf045c75323d28a5ea5/m_p_Eru1rmuua6UWqjTz.jpg">別版 2</a>]</p><hr><p>長い髪の前駆授洗イオアン、オランスの姿勢（両手を上げた姿）の生神女、オランスの姿勢の聖人、杖と盾を持つ兵士の聖人、十字形の光輪を持つ若いキリスト、そして竜を倒す鎧姿のもう一人の兵士の聖人（聖ゲオルギオス？）が、アーケードの下に描かれています。<a href="https://www.metmuseum.org/art/collection/search/466137">メトロポリタン美術館（五番街、アメリカ）</a>。21.3 × 16 cm。</p><p>ギリシア語の銘：「<strong>自らの救いのために、エウドクシアは［これを］アッタル［ーティ］村の聖ステファノに献げた</strong>」。</p><img src="https://res.bibleox.com/s/img/image/simple/68b5efa445c75323d28a5eaa/s_p_l5pPSsTDZHSQuvNU.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5efa445c75323d28a5eaa/m_p_l5pPSsTDZHSQuvNU.jpg">拡大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f01f45c75323d28a5eab/m_p_456sbKEe3ANd9ZWP.jpg">別版 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f02245c75323d28a5eac/m_p_fkJIydq7uEfZbIUt.jpg">別版 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f02445c75323d28a5ead/m_p_s25q6Lu5HItPjqDs.jpg">別版 4</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f02745c75323d28a5eae/m_p_QJsAgl2zRfYmpNDL.jpg">別版 5</a>]</p><hr><p>聖前駆授洗イオアン、聖なる輔祭（おそらくステファノ）、聖なる主教たちと十字架のイコンのある聖爵。<a href="https://www.metmuseum.org/art/collection/search/466130">メトロポリタン美術館（五番街、アメリカ）</a>。20.5 × 15.1 cm、369 g、1100 ml</p><p>ギリシア語の銘：「<strong>アッタルーティ村の聖ヨハネに</strong>」。</p><img src="https://res.bibleox.com/s/img/image/simple/68b5ec4545c75323d28a5ea4/s_p_KWMPzINWo4ktBKQ7.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5ec4545c75323d28a5ea4/m_p_KWMPzINWo4ktBKQ7.jpg">拡大</a>]</p><hr><p>キリスト、生神女、前駆授洗イオアン、勝利者ゲオルギオスのイコンのある聖爵。<a href="https://www.metmuseum.org/art/collection/search/466129">メトロポリタン美術館（五番街、アメリカ）</a>。24.3 × 16.8 cm。</p><p>ギリシア語の銘：「<strong>アッタルーティ村の聖ステファノ</strong>」。</p><img src="https://res.bibleox.com/s/img/image/simple/68b5ee1345c75323d28a5ea6/s_p_9bHxlNSj26b5EhMw.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5ee1345c75323d28a5ea6/m_p_9bHxlNSj26b5EhMw.jpg">拡大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5ee3c45c75323d28a5ea7/m_p_8XweLe1b1pD7GWHb.jpg">別版 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5ee4045c75323d28a5ea8/m_p_faMKsJUImltU9s6v.jpg">別版 3</a>]</p><hr><p>十字形の光輪を持つ若いキリスト、香炉を持つ聖なる輔祭（おそらく聖ステファノ）、祈る姿のおとめマリア、杖を持つ若い聖人の像のある聖爵。大きさ：23.9 × 17 cm、356 g。<a href="https://www.metmuseum.org/art/collection/search/466141">メトロポリタン美術館（五番街、アメリカ）。</a></p><p>ギリシア語の銘：「<strong>誓願を果たすため、また名を主が知っておられる者の救いのために</strong>」。</p><img src="https://res.bibleox.com/s/img/image/simple/68b5fa7a45c75323d28a5ebe/s_p_7AzZiy4FebkdJC4e.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5fa7a45c75323d28a5ebe/m_p_7AzZiy4FebkdJC4e.jpg">拡大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5fa8345c75323d28a5ebf/m_p_LQnRTCSFvxz7O7ui.jpg">別版 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5fa8645c75323d28a5ec0/m_p_KvY9o90gFdzJeK9N.jpg">別版 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5fa8945c75323d28a5ec1/m_p_BUzuFJ6F1fLtMppI.jpg">別版 4</a>]</p><hr><p>十字形の光輪を持つ若いキリスト、聖前駆授洗イオアン、祈る姿のおとめマリア、聖なる輔祭（おそらく聖ステファノ）と十字架の像のある香炉。銀と金めっきした銀、銅の裏張り。大きさ：41.5 × 13.2 × 12.6 cm。<a href="https://www.metmuseum.org/art/collection/search/466132">メトロポリタン美術館（五番街、アメリカ）</a>。</p><p>ギリシア語の銘：「<strong>キュリアコスの子らエルタとステファノの魂の安息のために</strong>」</p><img src="https://res.bibleox.com/s/img/image/simple/68b5f15545c75323d28a5eaf/s_p_OJ2d0ec3h6BtKZQM.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5f15545c75323d28a5eaf/m_p_OJ2d0ec3h6BtKZQM.jpg">拡大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f15845c75323d28a5eb0/m_p_MLajjsEoJyZ7xPC7.jpg">別版 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f15c45c75323d28a5eb1/m_p_5k22minZ9Q7EruSj.jpg">別版 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f15e45c75323d28a5eb2/m_p_3cDRqzOwNAJr7A0S.jpg">別版 4</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f16145c75323d28a5eb3/m_p_8vKQQvQJKE8Mbtoc.jpg">別版 5</a>]</p><hr><p>十字形の光輪を持つ若いキリスト、二人の大天使と十字架の像のある香炉。8.2 × 13.2 cm。<a href="https://www.metmuseum.org/art/collection/search/466131">メトロポリタン美術館（五番街、アメリカ）</a>。</p><p>ギリシア語の銘：「<strong>アッタルーティ村の聖ヨハネに</strong>」。</p><img src="https://res.bibleox.com/s/img/image/simple/68b5f27545c75323d28a5eb4/s_p_brjJXh3ZIrplms0E.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5f27545c75323d28a5eb4/m_p_brjJXh3ZIrplms0E.jpg">拡大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f28545c75323d28a5eb5/m_p_oWtx1CexyxQIAxRK.jpg">別版 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f28845c75323d28a5eb6/m_p_zqvxcBdCxjLqltWh.jpg">別版 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f28c45c75323d28a5eb7/m_p_fIVExsqDAbrZLhWW.jpg">別版 4</a>]</p><h3>キリストと聖人たちの像のある聖爵、十字架のある聖盤（シリア、ビザンティン）</h3><p>500〜700年。クリーヴランド美術館（アメリカ）：<a href="https://www.clevelandart.org/art/1950.378">1</a>、<a href="https://www.clevelandart.org/art/1950.379">2</a>、<a href="https://www.clevelandart.org/art/1950.380">3</a>、<a href="https://www.clevelandart.org/art/1950.381">4</a>。</p><p>この四つの銀の典礼用器、聖盤一つと聖爵三つ（目録番号1950.378–81）は、今日「ベト・ミソナの宝」と呼ばれるものをなしています。これらが作られたシリア北部の村の名に由来します。</p><p>宝が見つかった正確な場所と状況は分かっていませんが、ベト・ミソナ村の人々は、シリアとパレスチナのほかのキリスト教共同体と同じように、7世紀前半に彼らの土地を征服したペルシア人やアラブ人から隠すため、教会の銀器を埋めざるをえなかったのでしょう。</p><p>聖体礼儀のあいだ聖体の分けられた部分が置かれた聖盤には、献辞に囲まれたラテン十字が刻まれています。献辞には聖盤の寄進者ドムノスと、もともと置かれていたベト・ミソナの聖セルギオス聖堂の名が記されています。</p><p>聖爵の杯は広く、キリスト、生神女、使徒ペトロとパウロの胸像で飾られています。聖爵の一つには、寄進者であるドムノスの子キュリアコスと、この敬虔な寄進を受けた聖堂の司祭ゼノンの名を記した献辞があります。</p><p>ギリシア語の銘：「<strong>+ ドムノスの子、司祭キュリアコスが、司祭ゼノンのとき聖セルギオスに（この聖爵を献げた）</strong>」</p><img src="https://res.bibleox.com/s/img/image/simple/68caa03c205184ec278d5880/s_p_SB8idWRkPX7keKkU.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68caa03c205184ec278d5880/m_p_SB8idWRkPX7keKkU.jpg">キリスト</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68caa026205184ec278d587d/m_p_sYIDwGwUI9iMAzzD.jpg">生神女</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68caa029205184ec278d587e/m_p_xYnPNjrcxGm5mJgl.jpg">使徒</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68caa02c205184ec278d587f/m_p_kH9idfsikXyvAVvy.jpg">使徒</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68caa0d4205184ec278d5881/m_p_vWERSBBMAoytSNnX.jpg">上から</a>]</p><hr><img src="https://res.bibleox.com/s/img/image/simple/68ca9cd5205184ec278d5874/s_p_tH0J7uqAriM7uaeK.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68ca9cd5205184ec278d5874/m_p_tH0J7uqAriM7uaeK.jpg">キリスト</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68ca9d13205184ec278d5878/m_p_tYRbn15h6MPNUilS.jpg">生神女</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68ca9ce8205184ec278d5875/m_p_FKfoi68UXlWCS5ky.jpg">使徒</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68ca9ceb205184ec278d5876/m_p_Zp9CJ61HnBcr8Csr.jpg">使徒</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68ca9cee205184ec278d5877/m_p_w2JDvDj5c4pMVcfk.jpg">上から</a>]</p><hr><img src="https://res.bibleox.com/s/img/image/simple/68ca9e94205184ec278d5879/s_p_27LzQUQDD3A7nI9X.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68ca9e94205184ec278d5879/m_p_27LzQUQDD3A7nI9X.jpg">キリスト</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68ca9e98205184ec278d587a/m_p_R47Eqr4GrHijUSIb.jpg">生神女</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68ca9e9b205184ec278d587b/m_p_31NEBZQIYBEqOut0.jpg">使徒</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68ca9e9e205184ec278d587c/m_p_QxtJHMZORGGwFxYQ.jpg">使徒</a>]</p><hr><p>500年ごろ。聖盤。<a href="https://www.clevelandart.org/art/1950.381">クリーヴランド美術館（アメリカ）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/68ca964d205184ec278d5873/s_p_wNDEaPHmGHiuWeZy.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68ca964d205184ec278d5873/m_p_wNDEaPHmGHiuWeZy.jpg">拡大</a>]</p><h3>香炉。主イエス・キリストの洗礼と十字架刑（ビザンティン）</h3><p>500〜899年。大きさ：13.4 × 9 cm。<a href="https://collections.louvre.fr/en/ark:/53355/cl010042067">ルーヴル美術館（フランス）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/68c4068e6594f46d35a87efe/s_p_3kaCIWMTmQfT4NFG.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c4068e6594f46d35a87efe/m_p_3kaCIWMTmQfT4NFG.jpg">拡大</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/68c4061f6594f46d35a87efc/s_p_XNlsrfQ2MOphupt9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c4061f6594f46d35a87efc/m_p_XNlsrfQ2MOphupt9.jpg">拡大</a>]</p><h3>壺。キリスト、生神女、洗礼者ヨハネ、使徒たち、天使たち（コンスタンティノープル）</h3><img src="https://res.bibleox.com/s/img/image/simple/68c420e46594f46d35a87f06/s_p_iADN1OW5uYg5Wovc.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c420e46594f46d35a87f06/m_p_iADN1OW5uYg5Wovc.jpg">拡大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c420e76594f46d35a87f07/m_p_oAs6ecjPj32iGMce.jpg">裏面</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c421216594f46d35a87f0f/m_p_x6q5apwWB0DZirK2.jpg">キリスト</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c420fc6594f46d35a87f0b/m_p_sL17qrWgxkRCNRBb.jpg">生神女</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c420ea6594f46d35a87f08/m_p_Cb0UJi1oxoKCQaXw.jpg">洗礼者ヨハネ</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c421016594f46d35a87f0c/m_p_a9Y1fyPNxcQ4oNbq.jpg">天使</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c420f66594f46d35a87f0a/m_p_nAqhqDbP5x8fRAnj.jpg">天使</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c420ef6594f46d35a87f09/m_p_F9R3iyZ8go0PxARb.jpg">使徒</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c4210a6594f46d35a87f0e/m_p_97cyzUvq95UJZOrR.jpg">使徒</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c421056594f46d35a87f0d/m_p_WfK6SdjAqAOW9fDK.jpg">使徒</a>]</p><h3>イコンのある胸の十字架（ビザンティン）</h3><p>6世紀。<strong> </strong>金、ペースト、水晶、ガラス。打ち出し、粒金細工。鎖の長さ：33 cm、十字架：4.9 × 3.8 cm。<a href="https://collections.hermitagemuseum.org/entity/OBJECT/227027?page=46&amp;query=%D0%BA%D1%80%D0%B5%D1%81%D1%82&amp;sort=112&amp;index=2288">エルミタージュ美術館（ロシア）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/68c11e3c6594f46d35a87e2c/s_p_9GZmzTSaUVuXXaX1.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c11e3c6594f46d35a87e2c/m_p_9GZmzTSaUVuXXaX1.jpg">拡大</a>]</p><h3>ペンダント。キリストの十字架刑（エジプト）</h3><p>500〜700年。大きさ：3.3 × 1.9 cm。<a href="https://collections.louvre.fr/en/ark:/53355/cl010102800">ルーヴル美術館（フランス）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/68c41c4e6594f46d35a87f03/s_p_tiaBwT9vqOXIlsIw.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c41c4e6594f46d35a87f03/m_p_tiaBwT9vqOXIlsIw.jpg">拡大</a>]</p><h3>二人の聖人のイコン（ビザンティン）</h3><p>6世紀。25.5 × 22 × 1.3 cm。福音記者マタイとヨハネかもしれません。<a href="https://www.metmuseum.org/art/collection/search/468198">メトロポリタン美術館（五番街、アメリカ）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/68b5fc1545c75323d28a5ec3/s_p_a2FJmSgsGJRdELBq.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5fc1545c75323d28a5ec3/m_p_a2FJmSgsGJRdELBq.jpg">拡大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5fc1945c75323d28a5ec4/m_p_pcvRiRfRgBcuHJEA.jpg">別版 2</a>]</p><h3>使徒ペトロとパウロのイコン（アンティオキア）</h3><p>550〜600年。使徒ペトロ。<a href="https://www.metmuseum.org/art/collection/search/468348">メトロポリタン美術館（五番街、アメリカ）</a>。銀。38.1 × 55.9 × 2.2 cm。</p><img src="https://res.bibleox.com/s/img/image/simple/68c1bfd36594f46d35a87e6f/s_p_WguE3h0pnnzXQXwt.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1bfd36594f46d35a87e6f/m_p_WguE3h0pnnzXQXwt.jpg">拡大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c1bfd56594f46d35a87e70/m_p_83EvKNt1mFSPspQw.jpg">さらに拡大</a>]</p><p>550〜600年。使徒パウロ。<a href="https://www.metmuseum.org/art/collection/search/468347">メトロポリタン美術館（五番街、アメリカ）</a>。銀。38.1 × 55.9 × 2.2 cm。</p><img src="https://res.bibleox.com/s/img/image/simple/68c1bfda6594f46d35a87e71/s_p_5Y11faCyEzohnydQ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1bfda6594f46d35a87e71/m_p_5Y11faCyEzohnydQ.jpg">拡大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c1bfdd6594f46d35a87e72/m_p_jGCYAnYdrt4tlXhd.jpg">さらに拡大</a>]</p><h3>イコン（シリア？、ビザンティン）</h3><p>500年代。<a href="https://www.clevelandart.org/art/1941.57">クリーヴランド美術館（アメリカ）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/68caa8cd205184ec278d5883/s_p_qr7HPRgCtcCRwsvb.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68caa8cd205184ec278d5883/m_p_qr7HPRgCtcCRwsvb.jpg">拡大</a>]</p><h3>兵士の聖人の像（コプト期エジプト）</h3><p>6〜7世紀。<a href="https://collections.hermitagemuseum.org/entity/OBJECT/180444?page=6&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=253">エルミタージュ美術館（ロシア）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/6863c3c06480b4d28532041c/s_p_Rnquar8nZacdzqcP.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c3c06480b4d28532041c/m_p_Rnquar8nZacdzqcP.jpg">拡大</a>]</p><h3>使徒パウロ（？）と聖テクラのイコンのあるアンプラ（エジプト）</h3><p>500〜700年。<a href="https://collections.louvre.fr/en/ark:/53355/cl010280955">ルーヴル美術館（フランス）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/68c4390d6594f46d35a87f15/s_p_Zxs1yv3Jg8oKfFHW.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c4390d6594f46d35a87f15/m_p_Zxs1yv3Jg8oKfFHW.jpg">拡大</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/68c4390a6594f46d35a87f14/s_p_CPdXMrLBUE0satoH.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c4390a6594f46d35a87f14/m_p_CPdXMrLBUE0satoH.jpg">拡大</a>]</p><h3>使徒アンデレのイコンのあるアンプラ（スミルナ）</h3><p>500〜600年。<a href="https://collections.louvre.fr/en/ark:/53355/cl010281050">ルーヴル美術館（フランス）</a>。7 × 5 × 2.8 cm。</p><img src="https://res.bibleox.com/s/img/image/simple/68c437966594f46d35a87f13/s_p_dCGVNUwg3KWvs9zz.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c437966594f46d35a87f13/m_p_dCGVNUwg3KWvs9zz.jpg">拡大</a>]</p><h3>聖メナスのイコンのあるアンプラ</h3><p>610〜650年。聖メナスの像のあるアンプラ（エジプト）。<a href="https://www.metmuseum.org/art/collection/search/475416">メトロポリタン美術館（五番街、アメリカ）</a>。8.5 × 6.9 × 1.8 cm。</p><img src="https://res.bibleox.com/s/img/image/simple/68c1c1396594f46d35a87e73/s_p_KIdJIYWMysre63rP.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1c1396594f46d35a87e73/m_p_KIdJIYWMysre63rP.jpg">拡大</a>]</p><hr><p>500〜750年。<a href="https://collections.louvre.fr/en/ark:/53355/cl010044285">ルーヴル美術館（フランス）</a>。13 × 10.6 × 3.4 cm。</p><img src="https://res.bibleox.com/s/img/image/simple/68c3bc556594f46d35a87ebd/s_p_iHBRxhobWKvQb2Dx.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3bc556594f46d35a87ebd/m_p_iHBRxhobWKvQb2Dx.jpg">拡大</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/68c3bc5c6594f46d35a87ebe/s_p_fQ8Ps5eHBD1myJaS.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3bc5c6594f46d35a87ebe/m_p_fQ8Ps5eHBD1myJaS.jpg">拡大</a>]</p><h3>キリスト（ラヴェンナ）</h3><p>サンタポリナーレ・イン・クラッセ聖堂、イタリア、ラヴェンナ。</p><img src="https://res.bibleox.com/s/img/image/simple/675005d5dba77200011c73ad/s_p_rjjDEzNckea3oHk2.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/675005d5dba77200011c73ad/m_p_rjjDEzNckea3oHk2.jpg">拡大</a>]</p><h3>キリストと使徒たち（ラヴェンナ）</h3><p>司祭席のモザイク。サン・ヴィターレ聖堂、イタリア、ラヴェンナ。</p><img src="https://res.bibleox.com/s/img/image/simple/675005dadba77200011c73ae/s_p_Nac2nrVo791COrcO.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/675005dadba77200011c73ae/m_p_Nac2nrVo791COrcO.jpg">拡大</a>]</p><h3>キリスト、天使たち、ウィタリス（ラヴェンナ）</h3><p>6世紀。ミラノの聖ウィタリス聖堂、ラヴェンナ。</p><img src="https://res.bibleox.com/s/img/image/simple/674f0ab3dba77200011c738f/s_p_AsShtty0gMBFOX5X.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f0ab3dba77200011c738f/m_p_AsShtty0gMBFOX5X.jpg">拡大</a>]</p><h3>正しい信仰の皇帝ユスティニアノス（ラヴェンナ）</h3><p>6世紀。ミラノの聖ウィタリス聖堂、ラヴェンナ。</p><img src="https://res.bibleox.com/s/img/image/simple/674f0ab8dba77200011c7390/s_p_MsUwTeWDMk0uEVPq.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f0ab8dba77200011c7390/m_p_MsUwTeWDMk0uEVPq.jpg">拡大</a>]</p><h3>正しい信仰の皇后テオドラ（ラヴェンナ）</h3><p>6世紀。ミラノの聖ウィタリス聖堂、ラヴェンナ。</p><img src="https://res.bibleox.com/s/img/image/simple/674f0ac0dba77200011c7391/s_p_6g0s1g1btiJBEXSR.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f0ac0dba77200011c7391/m_p_6g0s1g1btiJBEXSR.jpg">拡大</a>]</p><h3>先祖アブラハム（ラヴェンナ）</h3><p>6世紀。ミラノの聖ウィタリス聖堂、ラヴェンナ。</p><img src="https://res.bibleox.com/s/img/image/simple/674f0ad6dba77200011c7393/s_p_zgb5TLR1yafutIu4.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f0ad6dba77200011c7393/m_p_zgb5TLR1yafutIu4.jpg">拡大</a>]</p><h3>アベルとメルキゼデク（ラヴェンナ）</h3><p>6世紀。ミラノの聖ウィタリス聖堂、ラヴェンナ。</p><img src="https://res.bibleox.com/s/img/image/simple/674f0adbdba77200011c7394/s_p_PiL9TaItwhR28eXN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f0adbdba77200011c7394/m_p_PiL9TaItwhR28eXN.jpg">拡大</a>]</p><h3>マルケリヌス、ポリオン、ペトロ、聖人たち（ローマ）</h3><p>6世紀。ポンティアヌスのカタコンベ。フレスコ画。</p><img src="https://res.bibleox.com/s/img/image/simple/66cc2c4adba77200019bc7d9/s_p_th5E9srmqGjUT72T.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/66cc2c4adba77200019bc7d9/m_p_th5E9srmqGjUT72T.jpg">拡大</a>]</p><h3>雲に乗って来られるキリスト、使徒たち、聖コスマと聖ダミアン（ローマ）</h3><p>6世紀（530年）。聖コスマと聖ダミアン聖堂。[19][20]</p><img src="https://res.bibleox.com/s/img/image/simple/686aa5b35f47da2505d3ae28/s_p_V2YyLyiR7wCHgIfW.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa5b35f47da2505d3ae28/m_p_V2YyLyiR7wCHgIfW.jpg">拡大</a>]</p><p>使徒ペトロと聖コスマ（その先に聖テオドロス）</p><img src="https://res.bibleox.com/s/img/image/simple/686aa5d25f47da2505d3ae29/s_p_s66jgQ3tkVAmQEZE.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa5d25f47da2505d3ae29/m_p_s66jgQ3tkVAmQEZE.jpg">拡大</a>]</p><p>使徒パウロと聖ダミアン（その先に教皇フェリクス）</p><img src="https://res.bibleox.com/s/img/image/simple/686aa7505f47da2505d3ae2c/s_p_WA1eP9P7BNe0aPQ6.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa7505f47da2505d3ae2c/m_p_WA1eP9P7BNe0aPQ6.jpg">拡大</a>]</p><p>聖なる天使</p><img src="https://res.bibleox.com/s/img/image/simple/686aa61c5f47da2505d3ae2a/s_p_MD4QowA5HKQRhFFG.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa61c5f47da2505d3ae2a/m_p_MD4QowA5HKQRhFFG.jpg">拡大</a>]</p><h3>キリストと使徒たち（ローマ）</h3><p>6世紀（578〜590年）。城壁外の聖ラウレンティウス聖堂（San Lorenzo fuori le Mura）[21][22]</p><p>使徒パウロのそばに聖ステファノと聖ヒッポリュトス。使徒ペトロのそばに聖ラウレンティウス。</p><img src="https://res.bibleox.com/s/img/image/simple/686aabc85f47da2505d3ae2e/s_p_xa4IU82mZb80Uija.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aabc85f47da2505d3ae2e/m_p_xa4IU82mZb80Uija.jpg">拡大</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686aab945f47da2505d3ae2d/s_p_21M69l0ODfpN75oh.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aab945f47da2505d3ae2d/m_p_21M69l0ODfpN75oh.jpg">拡大</a>]</p><h3>使徒ペトロとパウロ（フランク）</h3><p>6〜8世紀。<a href="https://www.metmuseum.org/art/collection/search/464497">メトロポリタン美術館（五番街、アメリカ）</a>（<a href="https://www.metmuseum.org/art/collection/search/464496">こちら</a>にも）。象牙。29.2 × 11.4 × 0.5 cm。</p><img src="https://res.bibleox.com/s/img/image/simple/68b5ff8145c75323d28a5ec8/s_p_WhZZPyHo1I7oF79K.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5ff8145c75323d28a5ec8/m_p_WhZZPyHo1I7oF79K.jpg">拡大</a>]</p><h3>聖人たち（ビザンティン、エジプト）</h3><p>6〜7世紀。<a href="https://www.metmuseum.org/art/collection/search/854019">メトロポリタン美術館（五番街、アメリカ）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/68b6007445c75323d28a5ec9/s_p_DNQuRcpcjfkINQ1r.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b6007445c75323d28a5ec9/m_p_DNQuRcpcjfkINQ1r.jpg">拡大</a>]</p><h3>聖フォカス（ビザンティン、ケルソネソス）</h3><p>6世紀。舟の上に立つ<a href="https://azbyka.ru/days/sv-foka-sinopskij">シノペの聖フォカス</a>の浮き彫りのある、エウロギア（祝福のパン）を作るための型。<a href="https://collections.hermitagemuseum.org/entity/OBJECT/373084?page=2&amp;fundcoll=1420520446&amp;index=75">エルミタージュ美術館（ロシア）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/6863bee26480b4d285320410/s_p_s0nPEGgpeMtakrof.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863bee26480b4d285320410/m_p_s0nPEGgpeMtakrof.jpg">拡大</a>]</p><h3>二人の聖人の像のあるアンプラ（小アジア、エフェソ）</h3><p>6世紀。<a href="https://collections.hermitagemuseum.org/entity/OBJECT/228313?page=44&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=2166">エルミタージュ美術館（ロシア）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/6863c0e76480b4d285320414/s_p_KnTGMdyOhsmTAD0S.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c0e76480b4d285320414/m_p_KnTGMdyOhsmTAD0S.jpg">拡大</a>]</p><h3>福音記者と聖人の像のあるアンプラ：神学者ヨハネとプロホロス（エフェソ）</h3><p>6世紀。<a href="https://collections.hermitagemuseum.org/entity/OBJECT/228314?page=33&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=1646">エルミタージュ美術館（ロシア）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/6863c1726480b4d285320415/s_p_oBnXQZmCz1EntIFw.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c1726480b4d285320415/m_p_oBnXQZmCz1EntIFw.jpg">拡大</a>]</p><h3>聖ペトロと聖パウロの像とラテン語の銘のある鉛の封印（モリブドブル）（ビザンティン）</h3><p>6〜7世紀。<a href="https://collections.hermitagemuseum.org/entity/OBJECT/131338?page=33&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=1639">エルミタージュ美術館（ロシア）</a>。<a href="https://collections.hermitagemuseum.org/entity/OBJECT/161973?page=33&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=1640">別の展示品</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/6863c19d6480b4d285320416/s_p_JKBi7CXiDOutHIFn.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c19d6480b4d285320416/m_p_JKBi7CXiDOutHIFn.jpg">拡大</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6863c22c6480b4d285320417/s_p_FmbNOmLfDrj3qYOz.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c22c6480b4d285320417/m_p_FmbNOmLfDrj3qYOz.jpg">拡大</a>]</p><h3>キリストの像のある鉛の封印（ビザンティン）</h3><p>6〜7世紀。<a href="https://collections.hermitagemuseum.org/entity/OBJECT/117792?page=6&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%B0&amp;index=269">エルミタージュ美術館（ロシア）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/6863c4a86480b4d28532041f/s_p_Uy0EgcXKfuHnv9bX.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c4a86480b4d28532041f/m_p_Uy0EgcXKfuHnv9bX.jpg">拡大</a>]</p><h3>キリストの像と組み合わせ文字のある鉛の封印（ビザンティン）</h3><p>6〜7世紀。<a href="https://collections.hermitagemuseum.org/entity/OBJECT/117804?page=3&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%B0&amp;index=143">エルミタージュ美術館（ロシア）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/6863c5a16480b4d285320422/s_p_JNdWhUPj9cA9Dvoq.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c5a16480b4d285320422/m_p_JNdWhUPj9cA9Dvoq.jpg">拡大</a>]</p><h2>7世紀</h2><h3>結婚指輪にあるキリストのイコン（ビザンティン）</h3><p>600〜700年。指輪のギリシア語の銘：<strong>ΟΜΟΝΟΙΑ</strong> — 一致、<strong>ΕΙΡΙΝΗΝ ΤΗΝ ΕΜΙΝ ΔΙΔΟΜ</strong> — 「わたしの平和を与える」（<a href="https://bibleox.com/ja/jp-ni/in/14/#L27">ヨハ 14:27</a>）。<a href="https://collections.louvre.fr/en/ark:/53355/cl010102797">ルーヴル美術館（フランス）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/68c402726594f46d35a87ef8/s_p_6nMwdRXMjOnhQWfu.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c402726594f46d35a87ef8/m_p_6nMwdRXMjOnhQWfu.jpg">拡大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c4027c6594f46d35a87ef9/m_p_pNTvaGVW4AmLG2BK.jpg">別版 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c4027e6594f46d35a87efa/m_p_mvU9wZQKEIl0lFZY.jpg">別版 3</a>]</p><h3>イコンのあるアンプラ。キリスト、十字架刑と昇天（パレスチナ、ビザンティン）</h3><p>600年代（初め）。<a href="https://www.clevelandart.org/art/1999.46">クリーヴランド美術館（アメリカ）</a>。錫と鉛の合金、革の部品つき。</p><img src="https://res.bibleox.com/s/img/image/simple/68caa8cf205184ec278d5884/s_p_QfQLEBTpKbF2IfJo.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68caa8cf205184ec278d5884/m_p_QfQLEBTpKbF2IfJo.jpg">拡大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68caaaaf205184ec278d5887/m_p_YFRVXxytSNharyj8.jpg">別版 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68caaab2205184ec278d5888/m_p_GguW2EcCVatptKzX.jpg">別版 3</a>]</p><h3>生神女と大致命者テオドロス・ストラティラト（テッサロニキ、ビザンティン）</h3><p>7〜10世紀（？）。テッサロニキの聖ディミトリオス聖堂。北の柱の南面のモザイク。</p><img src="https://res.bibleox.com/s/img/image/simple/686985345f47da2505d3ae12/s_p_HWoRkey7yaGM1D4s.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686985345f47da2505d3ae12/m_p_HWoRkey7yaGM1D4s.jpg">拡大</a>]</p><h3>大致命者ディミトリオスと寄進者たち：大主教と長官（テッサロニキ、ビザンティン）</h3><p>7世紀。テッサロニキの聖ディミトリオス聖堂。モザイク。</p><img src="https://res.bibleox.com/s/img/image/simple/686986dc5f47da2505d3ae13/s_p_ZMXi7hFVOfpu7jbC.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686986dc5f47da2505d3ae13/m_p_ZMXi7hFVOfpu7jbC.jpg">拡大</a>]</p><h3>聖ゲオルギオスと子どもたち（テッサロニキ、ビザンティン）</h3><p>7世紀。テッサロニキの聖ディミトリオス聖堂。モザイクは至聖所の西側にあります。</p><img src="https://res.bibleox.com/s/img/image/simple/686987645f47da2505d3ae14/s_p_boH6uu2omR2Gjxxx.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686987645f47da2505d3ae14/m_p_boH6uu2omR2Gjxxx.jpg">拡大</a>]</p><h3>聖セルギオス（テッサロニキ、ビザンティン）</h3><p>7世紀。テッサロニキの聖ディミトリオス聖堂。至聖所の柱のモザイク。</p><img src="https://res.bibleox.com/s/img/image/simple/686989925f47da2505d3ae15/s_p_Faf5BLFz9WISBGej.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686989925f47da2505d3ae15/m_p_Faf5BLFz9WISBGej.jpg">拡大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a742205184ec278d6fb4/m_p_YV1I98bvx4Nn6cUn.jpg">別版 2</a>]</p><h3>聖預言者ダビデのイコン（コンスタンティノープル、ビザンティン）</h3><p>629〜630年。<a href="https://www.metmuseum.org/art/collection/search/464380">メトロポリタン美術館（五番街、アメリカ）</a>。銀。26.6 × 4 cm、1397 g。こちらも参照：<a href="https://www.metmuseum.org/art/collection/search/464378">1</a>、<a href="https://www.metmuseum.org/art/collection/search/464375">2</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/68c1c3426594f46d35a87e75/s_p_5U20dlUc30xkfJeN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1c3426594f46d35a87e75/m_p_5U20dlUc30xkfJeN.jpg">拡大</a>]</p><h3>聖人の像と銘のある鉛の封印（ビザンティン）</h3><p>7世紀。<a href="https://collections.hermitagemuseum.org/entity/OBJECT/270001?page=17&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=840">エルミタージュ美術館（ロシア）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/6863c2966480b4d285320419/s_p_EY1IyPYdMzjgztlB.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c2966480b4d285320419/m_p_EY1IyPYdMzjgztlB.jpg">拡大</a>]</p><h3>キリストの胸像と組み合わせ文字のある鉛の封印（ビザンティン）</h3><p>7世紀。<a href="https://collections.hermitagemuseum.org/entity/OBJECT/231980?page=2&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%B0&amp;index=96">エルミタージュ美術館（ロシア）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/6863c6076480b4d285320423/s_p_YFjOrZh2fLGJgpYJ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c6076480b4d285320423/m_p_YFjOrZh2fLGJgpYJ.jpg">拡大</a>]</p><h3>キリストの像と組み合わせ文字のある鉛の封印（ビザンティン）</h3><p>7世紀。<a href="https://collections.hermitagemuseum.org/entity/OBJECT/172196?page=2&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%B0&amp;index=57">エルミタージュ美術館（ロシア）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/6863c64d6480b4d285320424/s_p_RQupAUUa4gGtXt2n.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c64d6480b4d285320424/m_p_RQupAUUa4gGtXt2n.jpg">拡大</a>]</p><h2>8世紀</h2><h3>生神女と幼子イエス（コンスタンティノープル、ビザンティン）</h3><p>神の叡智（アギア・ソフィア）大聖堂。</p><img src="https://res.bibleox.com/s/img/image/simple/674f31b0dba77200011c73a2/s_p_2AO12RGOQ2yqRiP4.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f31b0dba77200011c73a2/m_p_2AO12RGOQ2yqRiP4.jpg">拡大</a>]</p><h3>大天使ガブリエル（コンスタンティノープル、ビザンティン）</h3><p>神の叡智（アギア・ソフィア）大聖堂。</p><img src="https://res.bibleox.com/s/img/image/simple/674f3256dba77200011c73a4/s_p_rfkKZFQ8IYfO6L7V.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f3256dba77200011c73a4/m_p_rfkKZFQ8IYfO6L7V.jpg">拡大</a>]</p><h3>キリスト、十字架刑と復活（メス、フランス）</h3><p>870年。<a href="https://collections.louvre.fr/en/ark:/53355/cl010113244">ルーヴル美術館（フランス）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/68c422e46594f46d35a87f10/s_p_lQNRJIXri6KJoLw3.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c422e46594f46d35a87f10/m_p_lQNRJIXri6KJoLw3.jpg">拡大</a>]</p><h3>キリスト、十字架刑（ランス、フランス）</h3><p>870〜880年。<a href="https://collections.louvre.fr/en/ark:/53355/cl010098469">ルーヴル美術館（フランス）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/68c423bc6594f46d35a87f11/s_p_NOhnffTlgTImIczW.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c423bc6594f46d35a87f11/m_p_NOhnffTlgTImIczW.jpg">拡大</a>]</p><h2>9世紀</h2><h3>キリストの昇天（テッサロニキ、ビザンティン）</h3><p>9〜10世紀。勝利者聖ゲオルギオスのロトンダ（もとはガレリウス帝の霊廟）。フレスコ画 [17][18]</p><img src="https://res.bibleox.com/s/img/image/simple/686a934c5f47da2505d3ae20/s_p_klfYhHum7wZvKR9D.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686a934c5f47da2505d3ae20/m_p_klfYhHum7wZvKR9D.jpg">拡大</a>]</p><h3>キリスト、青銅のメダイヨン（ビザンティン）</h3><p>9〜10世紀。円形の像をメダイヨンと呼びます。<a href="https://www.britishmuseum.org/collection/object/H_1880-0820-9">大英博物館</a>。直径：3.5 cm。</p><p>Circular medallion; bronze; bust of Christ with cruciferous nimbus holding the book of the gospel in his left hand; inscription either side.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5be2d45c75323d28a5e92/s_p_GswK2cGnuxxnLfJr.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5be2d45c75323d28a5e92/m_p_GswK2cGnuxxnLfJr.jpg">拡大</a>]</p><h3>生神女の就寝（ビザンティン）</h3><p>9世紀末。<a href="https://www.metmuseum.org/art/collection/search/464013">メトロポリタン美術館（五番街、アメリカ）</a>。材質：象牙。18.6 × 14.8 × 1.1 cm。</p><p>New York. The Metropolitan Museum of Art. "The Glory of Byzantium,". Images of the Koimesis, or the Dormition in the West, show the Virgin lying on a bier, while her soul, represented as a baby, is offered by Christ to attendant angels who will take it to heaven. The apostles, led by Saints Paul and Peter, stand witness.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5c1bf45c75323d28a5e97/s_p_0Hg1bO8KIUVBSWJs.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5c1bf45c75323d28a5e97/m_p_0Hg1bO8KIUVBSWJs.jpg">拡大</a>]</p><h3>キリスト、生神女、洗礼者ヨハネ、使徒たちとほかの聖人たち（コンスタンティノープル）</h3><p>940〜960年。<a href="https://collections.louvre.fr/en/ark:/53355/cl010112515">ルーヴル美術館（フランス）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/68c424276594f46d35a87f12/s_p_IlqGrJe04Ic0YFWv.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c424276594f46d35a87f12/m_p_IlqGrJe04Ic0YFWv.jpg">拡大</a>]</p><h3>キリストと使徒たちの像のある板（イタリア）</h3><p>9世紀。<a href="https://collections.hermitagemuseum.org/entity/OBJECT/228918?page=4&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%B0&amp;index=194">エルミタージュ美術館（ロシア）</a>。大きさ：12.2 × 10.5 cm</p><img src="https://res.bibleox.com/s/img/image/simple/6863c54f6480b4d285320421/s_p_aLvOvrKuilB614SS.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c54f6480b4d285320421/m_p_aLvOvrKuilB614SS.jpg">拡大</a>]</p><h2>10世紀</h2><h3>キリスト、生神女、洗礼者ヨハネ（ビザンティン）</h3><p>10世紀。<a href="https://www.britishmuseum.org/collection/object/H_1923-1205-2">大英博物館</a>。材質：象牙。高さ：15.5 cm。</p><p>Panel; ivory; carved with standing figures, Christ with the Virgin Mary and St John, below a pierced canopy; four holes for attachment in the raised border.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5be4045c75323d28a5e95/s_p_qEFeZyh2Gq5Wbvar.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5be4045c75323d28a5e95/m_p_qEFeZyh2Gq5Wbvar.jpg">拡大</a>]</p><h3>生神女と幼子キリスト（コンスタンティノープル、ビザンティン）</h3><p><a href="tel:950-1025">950〜1025</a>年。<a href="https://www.clevelandart.org/art/1925.1293">クリーヴランド美術館（アメリカ）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/68caa153205184ec278d5882/s_p_iLLZZkqfsUiACLDC.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68caa153205184ec278d5882/m_p_iLLZZkqfsUiACLDC.jpg">拡大</a>]</p><h3>キリストと生神女の像のあるペンダント（ビザンティン）</h3><p>1000〜1300年。<a href="https://www.metmuseum.org/art/collection/search/477247">メトロポリタン美術館（五番街、アメリカ）</a>。玉髄のカメオ。真珠、エメラルド、ガーネット、サファイア、サードニクスの象眼をあしらった金の台。全体の大きさ：7.2 × 5.5 × 1.6 cm。玉髄：1 1/2 × 1 1/4インチ（3.8 × 3.2 cm）</p><img src="https://res.bibleox.com/s/img/image/simple/68c1bc1a6594f46d35a87e6d/s_p_VcHt7eFMtZq1I1lY.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1bc1a6594f46d35a87e6d/m_p_VcHt7eFMtZq1I1lY.jpg">拡大</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/68c1bc176594f46d35a87e6c/s_p_LwWdQj6J4ehbmMh9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1bc176594f46d35a87e6c/m_p_LwWdQj6J4ehbmMh9.jpg">拡大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c1bc1f6594f46d35a87e6e/m_p_gT2TXueTg5pmDsuZ.jpg">さらに拡大</a>]</p><h3>キリストの像のある十字架（ビザンティン）</h3><p>10〜11世紀。青銅。6.6 × 4.2 cm。<a href="https://collections.hermitagemuseum.org/entity/OBJECT/228297?page=56&amp;query=%D0%BA%D1%80%D0%B5%D1%81%D1%82&amp;sort=112&amp;index=2755">エルミタージュ美術館（ロシア）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/68c11f5b6594f46d35a87e2d/s_p_6uw78FFpsxpItSzn.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c11f5b6594f46d35a87e2d/m_p_6uw78FFpsxpItSzn.jpg">拡大</a>]</p><h3>キリストの像のある十字架（ビザンティン）</h3><p>10〜11世紀。青銅。7.7 × 7 cm。<a href="https://collections.hermitagemuseum.org/entity/OBJECT/482789?page=51&amp;query=%D0%BA%D1%80%D0%B5%D1%81%D1%82&amp;sort=112&amp;index=2501">エルミタージュ美術館（ロシア）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/68c11fab6594f46d35a87e2e/s_p_jfgfrZ4X7jcBXG9D.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c11fab6594f46d35a87e2e/m_p_jfgfrZ4X7jcBXG9D.jpg">拡大</a>]</p><h3>聖人たちのイコンのある十字架（ケルソネソス）</h3><p>10世紀。青銅、線刻。<a href="https://collections.hermitagemuseum.org/entity/OBJECT/372835?page=5&amp;fundcoll=1420520446__1413747286&amp;index=229">エルミタージュ美術館（ロシア）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/68c4191a6594f46d35a87f02/s_p_iFiSEGM9EbRIhhtD.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c4191a6594f46d35a87f02/m_p_iFiSEGM9EbRIhhtD.jpg">拡大</a>]</p><h3>テッサロニキの聖ディミトリオス（ビザンティン）</h3><p><a href="tel:950-1000">950〜1000</a>年。<a href="https://www.metmuseum.org/art/collection/search/465946">メトロポリタン美術館（五番街、アメリカ）</a>。材質：象牙。19.7 × 12.1 × 1 cm。</p><p>Standing erect, a spear in his hand and a shield at his side, Saint Demetrios is shown ready to protect the Christian faithful. The name of the popular Byzantine military saint is inscribed in two parts in Greek. Martyred in Thessalonike, the second most important city of the empire in the early centuries of the church, he has long been the patron saint of that metropolis. Images of saints in military dress are rare in Early Byzantine art (they appear on the chalices of the Attarouthi Treasure) but typical of the Middle Byzantine period.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5c38445c75323d28a5e98/s_p_ZeZuXGqxAAyDuPBA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5c38445c75323d28a5e98/m_p_ZeZuXGqxAAyDuPBA.jpg">拡大</a>]</p><h2>11世紀</h2><h3>行列用十字架：キリスト、生神女、大天使ミカエルとガブリエル（ビザンティン）</h3><p>1000〜1050年。<a href="https://www.metmuseum.org/art/collection/search/466251">メトロポリタン美術館（五番街、アメリカ）</a>。59.5 × 43 × 2.2 cm。</p><img src="https://res.bibleox.com/s/img/image/simple/68b5e3e645c75323d28a5e9b/s_p_Ft65PrnBUmI6wDAc.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5e3e645c75323d28a5e9b/m_p_Ft65PrnBUmI6wDAc.jpg">拡大</a>]</p><h3>行列用十字架：キリスト、生神女、洗礼者ヨハネ（ビザンティン）</h3><p>1050年。<a href="https://www.clevelandart.org/art/1970.36">クリーヴランド美術館（アメリカ）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/68ca921d205184ec278d5871/s_p_PrD5y34JBpT95quf.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68ca921d205184ec278d5871/m_p_PrD5y34JBpT95quf.jpg">拡大</a>]</p><h3>行列用十字架：聖サワ（ビザンティン）</h3><p>1050年。<a href="https://www.metmuseum.org/art/collection/search/697956">メトロポリタン美術館（五番街、アメリカ）</a>。裏面の中央に聖サワ、端にほかの聖なる修道士たちが描かれています。銀。32.4 × 44.8 × 5.7 cm。</p><img src="https://res.bibleox.com/s/img/image/simple/68c1c6546594f46d35a87e76/s_p_FO8cb8Ec2FqTDFz8.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1c6546594f46d35a87e76/m_p_FO8cb8Ec2FqTDFz8.jpg">拡大</a>]</p><h3>行列用十字架：キリスト（ケルソネソス）</h3><p>11世紀。材質：青銅、鉄。鋳造、打ち出し、線刻。大きさ：36.5 × 27.5 cm。<a href="https://collections.hermitagemuseum.org/entity/OBJECT/372834?page=3&amp;fundcoll=1420520446__1413747286&amp;index=106">エルミタージュ美術館（ロシア）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/68c418616594f46d35a87f01/s_p_ytqdkwIa6FDSikCw.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c418616594f46d35a87f01/m_p_ytqdkwIa6FDSikCw.jpg">拡大</a>]</p><h3>イコン「全能者キリスト（パントクラトール）」の一部（ビザンティン、クリミア）</h3><p>1050〜1100年。<a href="https://collections.hermitagemuseum.org/entity/OBJECT/372766?page=40&amp;query=%D0%B8%D0%BA%D0%BE%D0%BD%D0%B0&amp;index=1999">エルミタージュ美術館（ロシア）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/6863bfff6480b4d285320412/s_p_XwuOAkY6yR10NT7b.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863bfff6480b4d285320412/m_p_XwuOAkY6yR10NT7b.jpg">拡大</a>]</p><h3>幼子キリストを抱く生神女（コンスタンティノープル）</h3><p>1000〜1015年。<a href="https://collections.louvre.fr/en/ark:/53355/cl010101133">ルーヴル美術館（フランス）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/68c43b8c6594f46d35a87f16/s_p_rQNvoLa9Vu1WmSB2.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c43b8c6594f46d35a87f16/m_p_rQNvoLa9Vu1WmSB2.jpg">拡大</a>]</p><h3>生神女、オランタ（コンスタンティノープル）</h3><p>1000〜1200年。<a href="https://collections.louvre.fr/en/ark:/53355/cl010114443">ルーヴル美術館（フランス）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/68c43bcc6594f46d35a87f17/s_p_7a5oJnVWqjfeu67t.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c43bcc6594f46d35a87f17/m_p_7a5oJnVWqjfeu67t.jpg">拡大</a>]</p><h3>生神女、大天使ミカエル、聖テオドロス（ビザンティン）</h3><p>11〜12世紀。<a href="https://www.britishmuseum.org/collection/object/H_1981-0103-1">大英博物館</a>。108 × 95 mm。</p><p>Relief icon; rectangular bronze plaque cast in low relief with full-length Hodegetria flanked by the Archangel Michael and St Theodore, each wearing a girdled tunic beneath a chlamys with decorated tablion; the figures are identified by intaglio inscriptions; the whole is surrounded by a raised border with a running vine scroll; traces of solder at sides and back.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5be3545c75323d28a5e93/s_p_DFDGZ6kHm0khLKRD.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5be3545c75323d28a5e93/m_p_DFDGZ6kHm0khLKRD.jpg">拡大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5be3b45c75323d28a5e94/m_p_FfmDAHv29BAMxval.jpg">さらに拡大</a>]</p><h3>聖ディミトリオスのイコン（ビザンティン）</h3><p>1040〜1060年。<a href="https://collections.louvre.fr/en/ark:/53355/cl010115478">ルーヴル美術館（フランス）</a>。9.4 × 6.3 × 0.6 cm。</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c0c36594f46d35a87ec0/s_p_dj04XPO3pwvzkLzr.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c0c36594f46d35a87ec0/m_p_dj04XPO3pwvzkLzr.jpg">拡大</a>]</p><h3>聖ディミトリオスの像と銘のある鉛の封印（ビザンティン）</h3><p>11世紀。<a href="https://collections.hermitagemuseum.org/entity/OBJECT/269619?page=20&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=958">エルミタージュ美術館（ロシア）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/6863c2556480b4d285320418/s_p_oqzix7avanFfe61o.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c2556480b4d285320418/m_p_oqzix7avanFfe61o.jpg">拡大</a>]</p><h3>聖人の半身像のある鉛の封印（ビザンティン）</h3><p>11世紀。<a href="https://collections.hermitagemuseum.org/entity/OBJECT/267492?page=14&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=651">エルミタージュ美術館（ロシア）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/6863c3196480b4d28532041a/s_p_VySwl31Z41rar6d3.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c3196480b4d28532041a/m_p_VySwl31Z41rar6d3.jpg">拡大</a>]</p><h3>聖人の像のある吊り下げ式の印章（ビザンティン）</h3><p>11世紀。<a href="https://collections.hermitagemuseum.org/entity/OBJECT/483272?query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=21">エルミタージュ美術館（ロシア）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/6863c4276480b4d28532041d/s_p_5EJuZ18em5TsdUwA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c4276480b4d28532041d/m_p_5EJuZ18em5TsdUwA.jpg">拡大</a>]</p><h3>聖人の像のある吊り下げ式の印章（ビザンティン）</h3><p>11〜12世紀。<a href="https://collections.hermitagemuseum.org/entity/OBJECT/483278?query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=35">エルミタージュ美術館（ロシア）</a>。</p><img src="https://res.bibleox.com/s/img/image/simple/6863c4616480b4d28532041e/s_p_H8LrRkkjwBHlc322.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c4616480b4d28532041e/m_p_H8LrRkkjwBHlc322.jpg">拡大</a>]</p><h2>12世紀</h2><h3>キリスト、生神女、預言者ヨハネ（コンスタンティノープル、ビザンティン）</h3><p>神の叡智（アギア・ソフィア）大聖堂。聖堂のフレスコ画[5]</p><img src="https://res.bibleox.com/s/img/image/simple/6750078ddba77200011c73af/s_p_EcliI0JFeV1uu1LU.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6750078ddba77200011c73af/m_p_EcliI0JFeV1uu1LU.jpg">拡大</a>]</p><h3>キリスト（コンスタンティノープル、ビザンティン）</h3><p>神の叡智（アギア・ソフィア）大聖堂。</p><img src="https://res.bibleox.com/s/img/image/simple/674f332ddba77200011c73a6/s_p_1PCMz3Y4EZgbSJL0.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f332ddba77200011c73a6/m_p_1PCMz3Y4EZgbSJL0.jpg">拡大</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686cf10d5f47da2505d3ae4e/s_p_ZHUiumbGoeJMn4GO.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686cf10d5f47da2505d3ae4e/m_p_ZHUiumbGoeJMn4GO.jpg">拡大</a>]</p><h3>生神女（コンスタンティノープル、ビザンティン）</h3><p>神の叡智（アギア・ソフィア）大聖堂。</p><img src="https://res.bibleox.com/s/img/image/simple/674f3332dba77200011c73a7/s_p_WvZb6UestGwJUzJr.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f3332dba77200011c73a7/m_p_WvZb6UestGwJUzJr.jpg">拡大</a>]</p><h3>洗礼者ヨハネ、預言者（コンスタンティノープル、ビザンティン）</h3><p>神の叡智（アギア・ソフィア）大聖堂。</p><img src="https://res.bibleox.com/s/img/image/simple/674f357ddba77200011c73a8/s_p_hdfr9cx0ZPTZyn6N.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f357ddba77200011c73a8/m_p_hdfr9cx0ZPTZyn6N.jpg">拡大</a>]</p><h3>幼子イエスを抱く生神女（コンスタンティノープル）</h3><p>12世紀の最初の三分の一。ウラジーミルの生神女のイコン。木、テンペラ。</p><img src="https://res.bibleox.com/s/img/image/simple/674f18e4dba77200011c7399/s_p_0uaArAqVhNX9r0gV.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f18e4dba77200011c7399/m_p_0uaArAqVhNX9r0gV.jpg">拡大</a>]</p><h3>生神女（ビザンティン、シリア、タルトゥース）</h3><p>12世紀。<a href="https://www.britishmuseum.org/collection/object/H_1889-0511-13">大英博物館</a>。材質：象牙、41 × 47 mm。</p><p>Relief icon; pale grey-green steatite; rounded at the top and square below; bust of the Virgin, her mantle drawn over her head, with St Andrew's cross on it; her hands held in front with palms outwards, inscription either side of her.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5be2645c75323d28a5e91/s_p_StVNlxiOjocLLsz5.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5be2645c75323d28a5e91/m_p_StVNlxiOjocLLsz5.jpg">拡大</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5be2245c75323d28a5e90/m_p_yHJ3BkdNwVGdLb4m.jpg">さらに拡大</a>]</p><h3>テッサロニキの大致命者ディミトリオスと輔祭（テッサロニキ、ビザンティン）</h3><p>12世紀。南の柱の東面のモザイク。</p><img src="https://res.bibleox.com/s/img/image/simple/68698a155f47da2505d3ae16/s_p_n7AgnVLPvfeBX5Qq.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68698a155f47da2505d3ae16/m_p_n7AgnVLPvfeBX5Qq.jpg">拡大</a>]</p><h3>ホデゲトリアの生神女のイコン（ビザンティン、ケルソネソス）</h3><p>12世紀後半。<a href="https://collections.hermitagemuseum.org/entity/OBJECT/372931?page=11&amp;fundcoll=1420520446&amp;index=536">エルミタージュ美術館（ロシア）</a>。6.8 × 5 cm</p><img src="https://res.bibleox.com/s/img/image/simple/6863bf2f6480b4d285320411/s_p_10YV8HIpAzMNCgvp.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863bf2f6480b4d285320411/m_p_10YV8HIpAzMNCgvp.jpg">拡大</a>]</p><h2>13世紀</h2><h3>全能の主（アトス）</h3><p>ヒランダル修道院、聖山アトス。</p><img src="https://res.bibleox.com/s/img/image/simple/69406737205184ec278d6fd8/s_p_hTWcEC5QtmbCrC5t.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69406737205184ec278d6fd8/m_p_hTWcEC5QtmbCrC5t.jpg">拡大</a>]</p><h3>幼子イエスを抱く生神女（ホデゲトリア、アトス）</h3><p>ヒランダル修道院、聖山アトス。</p><img src="https://res.bibleox.com/s/img/image/simple/674f0cfadba77200011c7395/s_p_mQMRA7FGLEbqOYIx.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f0cfadba77200011c7395/m_p_mQMRA7FGLEbqOYIx.jpg">拡大</a>]</p><h2>14世紀</h2><h3>全能の主</h3><p>イコン画家マヌイル・パンセリノス。</p><img src="https://res.bibleox.com/s/img/image/simple/674f28d1dba77200011c739e/s_p_ma0z14hIFXCiEj7S.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f28d1dba77200011c739e/m_p_ma0z14hIFXCiEj7S.jpg">拡大</a>]</p><h3>生神女（テッサロニキ）</h3><p>1310〜1315年。オランタ。ギリシア、テッサロニキの聖ニコラオス・オルファノス聖堂のフレスコ画。</p><img src="https://res.bibleox.com/s/img/image/simple/674f29b7dba77200011c739f/s_p_PSuCdQIYdR4IYZgA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f29b7dba77200011c739f/m_p_PSuCdQIYdR4IYZgA.jpg">拡大</a>]</p><h3>生神女の進堂（コンスタンティノープル）</h3><p>1316〜1321年ごろ。カーリエ・ジャーミイ、コーラ修道院、トルコ、イスタンブール（コンスタンティノープル）。</p><img src="https://res.bibleox.com/s/img/image/simple/675343bddba7720001cd0ddf/s_p_AtF4vpmhv6FneUfA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/675343bddba7720001cd0ddf/m_p_AtF4vpmhv6FneUfA.jpg">拡大</a>]</p><h2>15世紀</h2><h3>使徒パウロ（ルーシ）</h3><p>1410年代。作者：克肖者アンドレイ・ルブリョフ。国立トレチャコフ美術館、ロシア、モスクワ。</p><img src="https://res.bibleox.com/s/img/image/simple/6909fbca205184ec278d6e6a/s_p_ok25vNdlaQMM5P3c.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6909fbca205184ec278d6e6a/m_p_ok25vNdlaQMM5P3c.jpg">拡大</a>]</p><h2>イコン集</h2><ol><li><p>カタコンベの図像集、Wordファイル：<a href="https://disk.yandex.ru/d/mHc8dxUdHGqMEQ">リンク</a></p></li><li><p>イコン画家マヌイル・パンセリノスの作品（13〜14世紀）：<a href="https://vk.com/album-20034910_224123875">https://vk.com/album-20034910_224123875</a></p></li></ol>
