  - src: bdRJ_Разные_древние_образы_не_вошедшие_в_основную_коллекцию
    path: Ik5v_صور_قديمة_مختلفة_لم_تدخل_في_المجموعة_الرئيسية
    title: "صور قديمة مختلفة لم تدخل في المجموعة الرئيسية"
    body: |-
      <h2>سراديب القديس يانوار (Catacombe di San Gennaro) [1]</h2><h3>القديس يانوار البنفنتي، البوتيولي (النابولي)، الأسقف، الشهيد في الكهنة</h3><p>سراديب سان جينارو (القديس يانوار)، نابولي. جدارية من القرن الرابع. ليس واضحًا تمامًا مَن المصوَّر هنا. في الأعلى مكتوب: SANCTOMARTYRIIANVARIO (القديس الشهيد يانوار). ومع ذلك يظهر هنا شابٌّ لسبب ما. كما لا يتّضح سبب هذه الهالة.</p><p>صفحة فيها معلومات عن هذا القديس في الكنيسة الأرثوذكسية: <a href="https://days.pravoslavie.ru/name/890.html">https://days.pravoslavie.ru/name/890.html</a></p><p>صفحة في ويكيبيديا عن هذه الجدارية. باللغة البولندية، لكن فيها معلومات مفيدة: <a href="https://pl.wikipedia.org/wiki/January_z_Benewentu">https://pl.wikipedia.org/wiki/January_z_Benewentu</a></p><img src="https://res.bibleox.com/s/img/image/simple/686e6aa95f47da2505d3ae6e/s_p_RCtXSS4uiuO9E0Qf.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686e6aa95f47da2505d3ae6e/m_p_RCtXSS4uiuO9E0Qf.jpg">تكبير</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686e56775f47da2505d3ae67/m_p_XhI4Ni1rKZ949Zi1.jpg">نسخة 2</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686e54755f47da2505d3ae66/s_p_zKsSelu839AuImaV.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686e54755f47da2505d3ae66/m_p_zKsSelu839AuImaV.jpg">تكبير</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686e57135f47da2505d3ae68/m_p_faNUwXKGPaVtmUwW.jpg">نسخة 2</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686e6aec5f47da2505d3ae70/s_p_2fvyFxXewVLu06NV.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686e6aec5f47da2505d3ae70/m_p_2fvyFxXewVLu06NV.jpg">تكبير</a>]</p><h3>المرأة المسيحية تسيرولا</h3><p>النقش أدناه: «CERVLA IN PACE» (تسيرولا في سلام)، القرنان الخامس والسادس [3]</p><img src="https://res.bibleox.com/s/img/image/simple/686e4d5c5f47da2505d3ae63/s_p_1dqPUS5wghY1DrdP.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686e4d5c5f47da2505d3ae63/m_p_1dqPUS5wghY1DrdP.jpg">تكبير</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686e58705f47da2505d3ae6a/m_p_r6sua9UNLBhgIZ06.jpg">نسخة 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686e58625f47da2505d3ae69/m_p_6KViYk7KWJDrIa8l.jpg">نسخة 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686e6ad15f47da2505d3ae6f/m_p_q9ocVtWoayH4BxtB.jpg">نسخة 4</a>]</p><h3>عائلة ثيوتكنوس</h3><blockquote><p>أركوسوليوم عائلة ثيوتكنوس. أظهرت الأبحاث أن الفتاة كانت أول من مات. وقد رُسمت في المحراب جدارية عليها صورتها. ثم تُوفي الرجل. وفوق الجدارية الأولى رُسمت جدارية جديدة، هذه المرة مع الأب. وكانت المرأة آخر من مات، فظهرت في المحراب صورتهم الجماعية.</p></blockquote><img src="https://res.bibleox.com/s/img/image/simple/686e6be45f47da2505d3ae71/s_p_xNoWgh6wacZ3al1R.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686e6be45f47da2505d3ae71/m_p_xNoWgh6wacZ3al1R.jpg">تكبير</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686e592c5f47da2505d3ae6b/s_p_A6SYWxzdgc1EPwun.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686e592c5f47da2505d3ae6b/m_p_A6SYWxzdgc1EPwun.jpg">تكبير</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686fe8695f47da2505d3ae88/m_p_nzuUOKu6sAmxO4pO.jpg">نسخة 2</a>]</p><h2>Via Anapo catacombs[2]</h2><h3>امرأة تُصلّي (أورانتا)</h3><p>جدارية امرأة تُصلّي. Fresco of a praying woman, an orante or orans, in the Anonima di Via Anapo catacomb (anonymous catacomb of Via Anapo), Rome</p><img src="https://res.bibleox.com/s/img/image/simple/686e53655f47da2505d3ae65/s_p_qTxn07MuPIePNzPn.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686e53655f47da2505d3ae65/m_p_qTxn07MuPIePNzPn.jpg">تكبير</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686e535e5f47da2505d3ae64/m_p_U8Zh4RJjehyZtXep.jpg">نسخة 2</a>]</p>
