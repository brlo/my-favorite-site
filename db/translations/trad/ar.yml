  - src: 2NCD_Постная_кухня
    path: Lc4k_المطبخ_الصيامي
    title: "المطبخ الصيامي"
    body: |-
      <p>تقتصر هذه المقالة على رسم صورة موجزة عن نظام الطعام الصيامي، عونًا للإنسان الذي لم يصم من قبل، ولم تكن له عادة إعداد الطعام الصيامي، ولا يعرف ماذا يمكن أن يطبخ في الصوم.</p><blockquote><p>«فَأَجَابَ يَسُوعُ وَقَالَ لَها: "مَرْثَا، مَرْثَا، أَنْتِ تَهْتَمِّينَ وَتَضْطَرِبِينَ لِأَجْلِ أُمُورٍ كَثِيرَةٍ، وَلَكِنَّ ٱلْحَاجَةَ إِلَى وَاحِدٍ. فَٱخْتَارَتْ مَرْيَمُ ٱلنَّصِيبَ ٱلصَّالِحَ ٱلَّذِي لَنْ يُنْزَعَ مِنْهَا".» (<a href="https://bibleox.com/ar/arab-avd/lk/10/#L41-42">لو 10:41-42</a>)</p></blockquote><blockquote><p>«فَٱحْتَرِزُوا لِأَنْفُسِكُمْ لِئَلَّا تَثْقُلَ قُلُوبُكُمْ فِي خُمَارٍ وَسُكْرٍ وَهُمُومِ ٱلْحَيَاةِ، فَيُصَادِفَكُمْ ذَلِكَ ٱلْيَوْمُ بَغْتَةً.» (<a href="https://bibleox.com/ar/arab-avd/lk/21/#L34">لو 21:34</a>)</p></blockquote><h2>الشوربات</h2><h3>شوربات بمرق الخضار (بصل وجزر محمّران)</h3><p>في معظم الأطباق يحسن إضافة البطاطس:</p><ul><li><p><strong>شوربات بالحبوب</strong> (الحنطة السوداء، الأرز، الشعير المقشور، العدس، البازلاء)،</p></li><li><p><strong>شوربات بالمعكرونة</strong>،</p></li><li><p><strong>شوربات الخضار</strong>،</p></li><li><p><strong>البرش</strong> (شوربة الشمندر)،</p></li><li><p><strong>الراسولنيك</strong> (شوربة الخيار المخلل)،</p></li><li><p><strong>الشي</strong> (شوربة الملفوف)،</p></li><li><p><strong>الأوخا</strong> (شوربة السمك، حين يسمح النظام الكنسي بالسمك).</p></li></ul><h2>الأطباق الجانبية</h2><ul><li><p><strong>الشوفان</strong> (رقائق الشوفان)،</p></li><li><p><strong>مسلوقة</strong>: الأرز، الحنطة السوداء، العدس، الكسكس، البرغل، الكينوا، البولنتا (عصيدة من دقيق الذرة) وسائر الحبوب. ويحسن إضافة تحميرة من البصل والجزر.</p></li><li><p><strong>البيلاف</strong> (لزيادة الشبع يمكن إضافة الحمّص)،</p></li><li><p><strong>خلطات مع الأرز المسلوق</strong>: الهاوايية، المكسيكية، وما شابهها.</p></li><li><p><strong>المعكرونة</strong>: مسلوقة، أو محمّرة أولًا، أو معكرونة بالمشروم، أو مع إضافة أسماك معلبة (التونة، السردين وغيرهما، حين يسمح النظام الكنسي)</p></li><li><p><strong>البطاطس</strong>: مقلية، مشوية، مسلوقة، مهروسة،</p></li><li><p><strong>الملفوف المطهو</strong>،</p></li><li><p><strong>يخنة الخضار</strong>: البطاطس، الجزر، البصل، الكوسا، الفلفل الرومي، المشروم، معجون الطماطم أو الطماطم، الباذنجان،</p></li><li><p><strong>خضار مسلوقة</strong> (القرنبيط، البروكلي، البازلاء الخضراء، الذرة)،</p></li><li><p><strong>فارينيكي</strong> (فطائر مسلوقة محشوة): بالبطاطس، بالمشروم، بالكرز،</p></li><li><p><strong>التوفو</strong>،</p></li><li><p><strong>الحمّص مع الخضار</strong>،</p></li><li><p><strong>المشروم</strong> المقلي،</p></li><li><p><strong>الكوسا</strong> المقلية،</p></li><li><p><strong>درانيكي</strong> (بطاطس أو كوسا مبشورة، طحين أرز أو طحين قمح، ملح)،</p></li><li><p><strong>الراتاتوي</strong>،</p></li><li><p><strong>اليقطين المشوي</strong>،</p></li><li><p><strong>الخضار المشوية</strong>،</p></li><li><p><strong>أقراص الخضار</strong> (من الفاصولياء).</p></li></ul><h2>السلطات</h2><ul><li><p><strong>من الخضار الطازجة</strong>: الخيار، الطماطم، الملفوف الصغير، البصل الأحمر، الخس، الفلفل الرومي، الأعشاب، البهارات،</p></li><li><p><strong>من الخضار المسلوقة</strong>: فينيغريت (البطاطس، الشمندر، الجزر، الفاصولياء، البازلاء المعلبة، الخيار المخلل، البصل، الملفوف المخمّر)،</p></li><li><p><strong>سلطة الملفوف الصيني</strong>: الملفوف الصيني، الذرة، المايونيز الصيامي[1]،</p></li><li><p><strong>الشمندر المسلوق</strong> مع المايونيز الصيامي[1]،</p></li><li><p><strong>سلطة الفواكه</strong>،</p></li><li><p><strong>سلطة الأفوكادو</strong>،</p></li></ul><h2>المخللات</h2><ul><li><p><strong>الملفوف المخمّر</strong>،</p></li><li><p><strong>الخيار</strong> المملّح، والمملّح قليلًا، والمدقوق،</p></li><li><p><strong>الجزر</strong> على الطريقة الكورية،</p></li><li><p><strong>البصل</strong> المخلل في الخل،</p></li><li><p>وغير ذلك.</p></li></ul><h2>المخبوزات</h2><ul><li><p><strong>الخبز</strong>،</p></li><li><p><strong>الكعكات الصيامية</strong>: يمكن خبزها في الفرن، أو في المقلاة، أو شراؤها من المتجر.</p></li><li><p><strong>الفطائر المحشوة</strong>: بالكرز، بالملفوف المطهو، بالبطاطس والبصل،</p></li><li><p><strong>الفطائر الرقيقة الصيامية</strong> (الماء بدل الحليب، والموز بدل البيض)،</p></li></ul><h2>المعلبات</h2><ul><li><p><strong>كافيار</strong> <strong>الكوسا</strong>،</p></li><li><p><strong>كافيار</strong> <strong>الباذنجان</strong>،</p></li><li><p><strong>الحمّص المهروس</strong>،</p></li><li><p><strong>الذرة</strong>،</p></li><li><p><strong>المشروم</strong>،</p></li><li><p><strong>الفاصولياء</strong>،</p></li><li><p><strong>البازلاء الخضراء</strong>،</p></li><li><p><strong>الطماطم المجففة</strong>،</p></li><li><p><strong>الغواكامولي</strong> بدون جبن،</p></li></ul><h2>الفواكه المجففة</h2><ul><li><p><strong>المكسرات</strong>،</p></li><li><p><strong>التوت والفواكه</strong> المجففة أو المجفدة،</p></li><li><p><strong>الحلاوة الطحينية</strong>،</p></li></ul><h2>الشطائر والمقبلات</h2><ul><li><p>شطائر بالعسل.</p></li><li><p>شطائر بالطماطم والريحان والملح</p></li></ul><h2>المشروبات</h2><ul><li><p>الكفاس</p></li><li><p>الكيسل (هلام الفواكه)</p></li><li><p>الكومبوت (من التوت الطازج أو من الفواكه المجففة)</p></li><li><p>المورس (شراب التوت)</p></li><li><p>السموذي</p></li><li><p>الليمونادة</p></li><li><p>الشاي</p></li><li><p>القهوة بدون حليب</p></li><li><p>الماء</p></li></ul>
    references: |-
