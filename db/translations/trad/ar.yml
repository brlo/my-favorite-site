    title: "المقابر والنقوش المسيحية"
    body: |-
      <h2>نقوش عند مدافن مسيحيي القرون الأولى</h2><p>النقوش في التريكليا في ما يُسمّى «تذكار الرسل» على طريق أبيان — وهو مزار أُقيم في منتصف القرن الثالث، بين عامي 238 و260. وفي الفترة نفسها، في القرن الثالث، بدأت تظهر في التريكليا نقوش صلاتية مسيحية بروح «<em>Paule ed Petre petite pro Victore</em>» وأخرى مشابهة لها (ترد أدناه). وقد واصلوا نقشها حتى عصر قسطنطين الكبير. [1]</p><img src="https://res.bibleox.com/s/img/image/simple/483/s_p_1D8zprHe86ZZn5O9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/483/m_p_1D8zprHe86ZZn5O9.jpg">تكبير</a>]</p><h3><strong>احتفظوا في أذهانكم، في صلواتكم </strong>(in mente habete, in orationibus vestris):</h3><p>12912: [Petre et] Paul[e] | in m[ente] abete in | ora[tion]ibus vestris/ — «<strong>بطرس وبولس، احتفظا في أذهانكما، في صلواتكما...»</strong></p><h3><strong>اشفعوا </strong>(petite) (أو «صلّوا»، «اطلبوا»)</h3><p>12918: [Paul]e et Petre petite | [pro] nobis omnibus/ — <strong>«بولس وبطرس، اشفعا من أجلنا جميعًا!»</strong></p><p>12931: Petr[e] et Pau[l]e petite | pro [Le]ontium / — <strong>«بطرس وبولس، اشفعا من أجل ليونتيوس!»</strong></p><p>12933: Pa[ul]e et Pet|re apetite pro Da|tivu in perpetu`u´m/ — <strong>«بولس وبطرس، اشفعا من أجل داتيفوس إلى الأبد!»</strong></p><p>12989: Paule ed Petre petite | pro Victore/ — <strong>«بولس وبطرس، اشفعا من أجل فيكتور!»</strong></p><p>12946: [Petre et Pa]ulae spir[ita sancta vestra petant pro - - -]/ — <strong>«بطرس وبولس، فلتشفع أرواحكما القديسة من أجل [- - -]!»</strong></p><h3><strong>conservate</strong> — <strong>احموا</strong> (أو «احفظوا»)</h3><p>12991: Petre et Paule cons[ervate - - -]/ — <strong>«بطرس وبولس، احموا [- - -]!»</strong></p><p>12996: sa[lva Paule et] | Petr[e - - - et] | Mart[yrium et] | conse[rvate in] | do[mino - - -]/ — <strong>«خلّص، يا بولس وبطرس [- - -] ومارتيريوس، واحمياه في الرب [- - -]!»</strong></p><p>13026: [- - - roga]mus | [conse]rvate nos [omnes]/ — <strong>«[- - -] نطلب، احمونا جميعًا!»</strong></p><h3><strong>دعوات بسيطة</strong></h3><p>12909: Petr[e et Paule]/ — <strong>«يا بطرس وبولس!»</strong></p><h3><strong>عونٌ للخطأة</strong></h3><p>12967: Petre et Paule sub|venite Prim[o] | peccatori/ — <strong>«بطرس وبولس، أدركا بريموس الخاطئ!»</strong></p><h3><strong>كثير من الدعوات صيغت باليونانية أو باللاتينية بحروف يونانية</strong></h3><p>12927: Παῦλε {μ} καί | μου πατ|ρός/ — <strong>«يا بولس، وأيضًا (أعن) أبي!»</strong></p><p>12997: [Παυλ]ε ετ Πετ[ρε ιν μεν]/[τε ν]ος αβετε [ιν ορα]/[τι]ωνες βεστ[ρας]/ — <strong>«بولس وبطرس، احتفظا في أذهانكما، في صلواتكما...»</strong></p><p>13045: [Πα]υ[λε ετ Πετρε] | [ι]ν με[ντε αβετε] | Αὐφίδ[ιον υἱόν - - -] | μου/ — <strong>«بولس وبطرس، احتفظا في أذهانكما بأوفيديوس، ابني!»</strong></p><p>13069: Πέτρε Παίτρε μνημόνευαι | Τιμοκράτην καὶ Εὐ|τυχείαν κινα(?) καὶ | ἐσώρα(?) ++ [- - -]/ — <strong>«بطرس، بطرس، اذكر تيموقراطيس وأفتيخية، و(...) ++ [- - -]!»</strong></p><p>13045: [κομμ]ανδαμ[ους? - - -]/<strong> </strong>— <strong>«نستودعكم [- - -]».</strong></p><p>13049: Παῦλε καὶ Π[έτρε ἔχετε] / μνί[α]ς/ — <strong>«بولس وبطرس، احفظا ذكرى [- - -]!»</strong></p><p>13055: [Παῦλε καὶ Πέτ]ρε εἰς μνε[ίαν] / [ἔχετε τὸν ᾿Ιρ]ίνες φίλι[ον]/ — <strong>«بولس وبطرس، اذكرا حبيب إيرينيس».</strong></p><p>13070: Παυλε Πετρε | Χαλκηδονι ανιμα | βωβυς κομαν|[δ]ω Λαυrους/ — <strong>«بولس وبطرس، أنا لاوروس (لاوروسيوس؟)، أستودعكما روح خلقيدونيوس!»</strong></p><p>13071: &lt;Π&gt;α[ῦλ]ος καὶ | Π[έτρο]ς συν|τηρή[σα]τε θ(εο)ῦ δούλους | πνεύματα | ἅγεια συντη|ρήσαται ἡμᾶ|ς ἴνα πολλοῖς | ἔτεσε[ι ζῶμεν]/ — <strong>«بولس وبطرس، ادعما عبيد الله! أيها الأرواح القديسة، ادعمونا لكي نحيا سنين كثيرة!»</strong></p><p>13073: [Παυλε] ετ Πετρε | [ιν με]ντε [ν]ος αβε|[τοτε εἰς το]ὺς ἐῶ[νας]/<strong> </strong>— <strong>«بولس وبطرس، احتفظا في أذهانكما إلى الأبد...»</strong></p><h3><strong>promisit / votum fecit</strong> — <strong>قدّم نذرًا</strong></h3><p>13091: [- - - i]dus m[- - -] | Eulogius votum f[ecit]/ — <strong>«[- - -] في اليوم [- - -] من الإيدِس [- - -] قدّم إيلوغيوس نذرًا [- - -]».</strong></p><h3><strong>إشارات إلى refrigerium</strong> (المأدبة التذكارية):</h3><p>12942: refrigerav[it] | [F]elicissimus cum s[uis]/ — <strong>«أقام فليكيسيموس المأدبة مع أهله.»</strong></p><p>12981: Petro et Paulo | Tomius Coelius | refri`ger´&lt;i&gt;um feci/ — <strong>«لبطرس وبولس أقمت أنا، توميوس كيليوس، المأدبة»</strong></p><p>13003: [---] at Paulu[m] | et Pet[rum] | refri[geravi - - -]/ — <strong>«عند بولس وبطرس أقمت المأدبة»</strong></p><p>المصدر: <a href="http://csla.history.ox.ac.uk/record.php?recid=E05087">http://csla.history.ox.ac.uk/record.php?recid=E05087</a></p><hr><h3>التوجّه إلى الله</h3><ul><li><p>DEVS TE PRECOR VТ PARADISVM LVCIS POSSIT VIDERE – «<strong>يا ربّ، أسألك أن يرى هو نور الفردوس</strong>».</p></li><li><p>DOMINE NE QVANDO ADVMBRETVR SPIRITVS VENERES – «<strong>يا ربّ، لا تُظلَّل روح فينوس أبدًا</strong>».</p></li></ul><h3>طلب الموتى الشفاعةَ</h3><ul><li><p>ET IN ORATIONIS TVIS ROGES PRO NOBIS QVIA SCIMVS TE ☧ – «<strong>في صلواتك اطلب من أجلنا، لأننا نعلم أنك في المسيح</strong>».</p></li><li><p>ORO SCIO NAMQVE BEATAM – «<strong>أطلب إليك، لأني أعلم أنك في النعيم</strong>».</p></li><li><p>ORA PRO PARENTI BVS TVIS – «<strong>صلِّ من أجل أهلك</strong>».</p></li><li><p>PETE PRO NOS VТ SALVI SIMVS – «<strong>اطلب من أجلنا لكي نُخلَّص</strong>».</p></li><li><p>IN ORATIONIS TVIS ROGES PRO NOBIS – «<strong>في صلواتك، اطلب من أجلنا</strong>».</p></li><li><p>ATTICE SPIRITVS TVS IN BONV ORA PRO PARENTIBVS TVIS – «<strong>أتيكوس، روحك في النعيم، صلِّ من أجل أهلك</strong>».</p></li></ul><p>هذا جزءٌ من المادة. ويمكن عبر الرابط الاطّلاع على بقيتها.</p><h3><strong>النقوش والصور الرمزية</strong></h3><ul><li><p>كلمة VIVAS، أي «<strong>عِش</strong>»، وهي أيضًا تكتب كثيرًا جدًا على القبور، تعني تمنّي الحياة الأبدية والنعيم للمتوفّى؛</p></li><li><p>VIVAS IN DEO – «<strong>عِش في الله</strong>»؛</p></li><li><p>VIBAS IN SANCTIS – «<strong>عِش بين القديسين</strong>».</p></li></ul><h3>المتوفّى قد بلغ الخلاص</h3><p>وأحيانًا يُقال بصيغة أكثر تأكيدًا إنّ المدفون هو بين المختارين:</p><ul><li><p>ACCEPIT REQVI EM IN DEO – «<strong>لقد نال الطمأنينة في الله</strong>»؛</p></li><li><p>SCIMVS ТЕ IN – «<strong>نعلم أنك في المسيح</strong>»؛</p></li><li><p>FRVCTVOSVS ANIMA ТVА СVМ IVSTIS – «<strong>فروكتوسوس، روحك مع الأبرار</strong>»؛</p></li><li><p>REQVI EM ADCEPIT IN DEO PATRE NOSTRO ET CHRISTO EIVS – «<strong>لقد نال الطمأنينة في الله أبينا وفي مسيحه</strong>»؛</p></li><li><p>ACCEPTA APVD DEVM – «<strong>مقبولة عند الله</strong>»؛</p></li><li><p>RECEPTVS AD DEVM – «<strong>مقبول عند الله</strong>»؛</p></li><li><p>ТЕСVМ PAX CHRISTI – «<strong>سلام المسيح معك</strong>»؛</p></li><li><p>SEMPER VIVE IN РАСЕ – «<strong>عِش في السلام إلى الأبد</strong>»؛</p></li><li><p>IN РАСЕ ET IN DOMO AETERNA DEI – «<strong>في السلام وفي بيت الله الأبدي</strong>».</p></li><li><p>VIVI IN GLORIA DEI ET IN PACE DOMINI NOSTRI ☧ – «<strong>أنت تحيا في مجد الله وفي سلام ربنا يسوع المسيح</strong>» – وهنا اسم المخلّص مبيَّن بمونوغرامه ☧؛</p></li><li><p>ELATVS EST، وهي أيضًا ضربٌ من الهتاف لا يُلتقى إلا مرة أو مرتين، يمكن ترجمتها هكذا: «<strong>لقد ارتفع إلى الله</strong>».</p></li></ul><h3>الفردوس — موضع النور</h3><p>يُسمّى الفردوس في نقوش قبور المسيحيين الأوائل موضعَ النور والبهاء؛ وهذه بعض الأمثلة:</p><ul><li><p>CVIVS SPIRITVS IN LVCE DOMINI SVSCEPTVS EST – «<strong>قد قُبلت روحه في نور الله</strong>».</p></li><li><p>IN CHRISTVM CREDENS PREMIA LVCIS АВЕТ – «<strong>إذ آمن بالمسيح، فله النور مكافأةً</strong>».</p></li><li><p>AETERNA TIBI LUX TIMOTHEA IN ☧– «<strong>نورٌ أبدي لك، يا تيموثاوس، في (المسيح)</strong>».</p></li></ul><h3></h3><p>الكتاب: <strong>أ. فون فريكن. سراديب الموتى الرومانية وآثار الفن المسيحي الأول. موسكو: منشورات ك. ت. سولدارينكوف، 1872–1877–1880–1885. </strong>[2]</p>
