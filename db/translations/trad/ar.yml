  - src: Древние_христианские_храмы
    path: Ch2c_الكنائس_المسيحية_القديمة
    title: "الكنائس المسيحية القديمة"
    body: |-
      <h2>اقتباس</h2><blockquote><p>«وَأَمَّا بَعْضُ ٱلْفَرِّيسِيِّينَ مِنَ ٱلْجَمْعِ فَقَالُوا لَهُ: "يَا مُعَلِّمُ، ٱنْتَهِرْ تَلَامِيذَكَ!". فَأَجَابَ وَقَالَ لَهُمْ: "أَقُولُ لَكُمْ: <strong>إِنَّهُ إِنْ سَكَتَ هَؤُلَاءِ فَٱلْحِجَارَةُ تَصْرُخُ</strong>!"» (<a href="https://bibleox.com/ar/arab-avd/lk/19/#L39-40">لو 19:39-40</a>)</p></blockquote><h2>القرن الثالث</h2><h3>كنيسة قرب مدينة مجدو القديمة، في مستوطنة <a href="https://he.wikipedia.org/wiki/%D7%9C%D7%92%D7%99%D7%95">Legio</a> (نحو سنة 230)</h3><p>في الكنائس المسيحية القديمة كان المذبح يقع غالبًا في الوسط. وهذه الكنيسة مثال بيّن على ذلك.</p><p>على مقربة من مدينة مجدو (كانت فيها في العصور القديمة مستوطنة <a href="https://he.wikipedia.org/wiki/%D7%9C%D7%92%D7%99%D7%95">Legio</a>، لأن فيلقًا رومانيًا كان يتمركز هناك). وعلى مرتفع المستوطنة شُيّد بناء أُرخّ إلى سنة 230 استنادًا إلى النقود والخزف ونوع الكتابة. وكانت إحدى قاعات البناء كنيسة مسيحية. وعلى الأرضية عدة فسيفساء كبيرة تحمل نقوشًا (أحدها يدعو المسيح إلهًا)، وفي الوسط يقع المذبح. وبالقرب من ذلك نقش يبيّن مَن أهدى هذه المائدة.</p><img src="https://res.bibleox.com/s/img/image/simple/692c58f9205184ec278d6f97/s_p_aZ3NifF9BW3oqZ1a.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c58f9205184ec278d6f97/m_p_aZ3NifF9BW3oqZ1a.jpg">تكبير</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/692c587d205184ec278d6f91/s_p_MvOQRFKiCv6XaXOd.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c587d205184ec278d6f91/m_p_MvOQRFKiCv6XaXOd.jpg">تكبير</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/692c58ee205184ec278d6f96/s_p_5wNRtqyrpQivbBim.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c58ee205184ec278d6f96/m_p_5wNRtqyrpQivbBim.jpg">تكبير</a>] [<a href="https://res.bibleox.com/s/img/image/simple/692c58e0205184ec278d6f95/m_p_FQvEfj70dP7967X3.jpg">صورة إضافية 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/692c58ce205184ec278d6f94/m_p_9xoiCsqROihBYnL0.jpg">صورة إضافية 3</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/692c58b5205184ec278d6f93/s_p_Cvww0C8ZGmbqJS7a.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c58b5205184ec278d6f93/m_p_Cvww0C8ZGmbqJS7a.jpg">تكبير</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/692c5882205184ec278d6f92/s_p_WU59e3c2XbPWkdaM.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c5882205184ec278d6f92/m_p_WU59e3c2XbPWkdaM.jpg">تكبير</a>]</p><p><strong>النقوش:</strong></p><p>جميع النقوش على أرضية الكنيسة هي نوع من <strong>المذكرات التذكارية</strong>. ومنذ العصور القديمة وإلى اليوم توجد في كنائس الكنيسة الأرثوذكسية تقاليدُ أن تُضاف دائمًا، عند إقامة الخدمات الإلهية في الكنيسة، إلى التذكار الصلاتي أسماءُ الذين بنوا الكنيسة أو تبرعوا بشيء مهم. وهكذا هنا أيضًا: مع الدعوة إلى التذكار تُثبَّت أسماء الذين تبرعوا بأرضية الفسيفساء (قائد المئة غايانوس بورفيريوس)، والذين رصفوها (بروتيوس)، والذين تبرعوا بالمذبح (أكبتوس)، وكذلك بعض الأسماء الأخرى، ربما أقارب المتبرعين: بريميلا، وكيرياكا، ودوروثيا، وكريستا. وعلى المنوال نفسه كانوا يقدمون الأواني الكنسية تذكارًا للأحياء والأموات: كؤوس الإفخارستيا والمباخر (انظر <a href="https://bibleox.com/ar/ar/w/Ik1c_مجموعة_الأيقونات_القديمة#HH-كؤوس-إفخارستية-ومباخر-عليها-أيقونات-بيزنطة-سوريا-أتّاروتي">المزيد</a>).</p><blockquote><p>AR: أكبتوس، محبة الله، أهدت هذا المذبح لله يسوع المسيح تذكارًا</p></blockquote><blockquote><p>EN: Akeptous, the God-loving, offered the table to God Jesus Christ as a memorial.</p></blockquote><blockquote><p>Transcription: <strong>Prosēniken Akeptous, ē philotheos, tēn trapezan Th(e)ō Ι(ēso)u Ch(rist)ō mnēmosunon.</strong></p></blockquote><blockquote><p>Orig: <strong>ΠΡΟСΗΝΙΚΕΝ ΑΚΕΠΤΟΥС, Η ΦΙΛΟΘΕΟС, ΤΗΝ ΤΡΑΠΕΖΑΝ Θ(Ε)Ω Ι(ΗСΟ)Υ Χ(ΡΙСΤ)Ω ΜΝΗΜΟСΥΝΟΝ</strong></p></blockquote><blockquote><p>ΠΡΟϹΗΝΙΚΕΝ</p><p>ΑΚΕΠΤΟΥϹ,</p><p>Η ΦΙΛΟΘΕΟϹ,</p><p>ΤΗΝ ΤΡΑΠΕ-</p><p>ZΑΝ <strong>{ΘW} {ΙΥ} {ΧW}*</strong></p><p>ΜΝΗΜΟϹΥΝΟΝ</p></blockquote><p>*Nomina Sacra: <strong>ΘW ΙΥ ΧW</strong> = θεῷ Ἰησοῦ Χριστῷ = الله يسوع المسيح</p><img src="https://res.bibleox.com/s/img/image/simple/692c5df3205184ec278d6f9a/s_p_swifwBDbtzgImkZ6.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c5df3205184ec278d6f9a/m_p_swifwBDbtzgImkZ6.jpg">تكبير</a>]</p><hr><blockquote><p>ΕΝ: Remember Primilla and Cyriaca and Dorothea, and moreover also Chreste.</p></blockquote><blockquote><p>AR: اذكروا بريميلا وكيرياكا ودوروثيا، وأيضًا كريستا</p></blockquote><blockquote><p>Orig: <strong>ΜΝΗΜΟΝΕΥСΑΤΕ ΠΡΙΜΙΛΛΗС ΚΑΙ ΚΥΡΙΑΚΗС ΚΑΙ ΔWΡΟΘΕΑС ΕΤΙ ΔΕ ΚΑΙ ΧΡΗСΤΗ</strong></p></blockquote><blockquote><p>Fixed: <strong>ΜΝΗΜΟΝΕΥСΑΤΕ ΠΡΙΜΙΛΛΗС ΚΑΙ ΚΥΡΙΑΚΗΣ ΚΑΙ ΔΩΡΟΘΕΑΣ ΕΤΙ ΔΕ ΚΑΙ ΧΡΗΣΤΗ</strong></p></blockquote><img src="https://res.bibleox.com/s/img/image/simple/692c5dec205184ec278d6f99/s_p_LVbgKrKO7P3dfEJP.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c5dec205184ec278d6f99/m_p_LVbgKrKO7P3dfEJP.jpg">تكبير</a>]</p><hr><blockquote><p>AR: غايانوس، الملقب ببورفيريوس، قائد المئة، أخونا، رصف هذه الأرضية من أمواله الخاصة بسخاء عظيم. وأما بروتيوس فقد أنجز العمل.</p></blockquote><blockquote><p>EN: Gaianus, also called Porphyrius, centurion (xp), our brother, has made the pavement at his own expense as an act of liberality. Brutius has carried out the work.</p></blockquote><blockquote><p>Orig: <strong>ΓΑΙΑΝΟС Ο ΚΑ ΠΟΡΦΥΡΙС ΧΡ* ΑΔΕΛΦΟС ΗΜWΝ ΕΚ ΦΙΛΟΤΕ ΙΜΙС ΑΜΕΝ ΟСΕΚΤW ΝΙΔΙWΝ ΕΨΙ ΦΟΛΟΓΗСΕΝ. ΒΡΟVΤΙС ΗΡΓΑСΑΤΟ.</strong></p></blockquote><blockquote><p>Fixed: <strong>ΓΑΙΑΝΟΣ Ο ΚΑ ΠΟΡΦΥΡΙΣ ΧΡ* ΑΔΕΛΦΟΣ ΗΜΩΝ ΕΚ ΦΙΛΟΤΕ ΙΜΙΣ ΑΜΕΝ ΟΣΕΚΤΩ ΝΙΔΙΩΝ ΕΨΙ ΦΟΛΟΓΗΣΕΝ. ΒΡΟΥΤΙΣ ΗΡΓΑΣΑΤΟ.</strong></p></blockquote><p><strong>*ΧΡ — hekatontarches — centurio</strong></p><img src="https://res.bibleox.com/s/img/image/simple/692c5e27205184ec278d6f9b/s_p_Qk321JfFTD4dDmnd.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c5e27205184ec278d6f9b/m_p_Qk321JfFTD4dDmnd.jpg">تكبير</a>]</p><h3>كنيسة في دورا أوروبوس (سوريا)</h3><p>سنة 244: كنيسة مسيحية في دورا أوروبوس</p><img src="https://res.bibleox.com/s/img/image/simple/6931880c205184ec278d6fa6/s_p_DFnp7s0vcTbXb3Qn.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931880c205184ec278d6fa6/m_p_DFnp7s0vcTbXb3Qn.jpg">تكبير</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/69318806205184ec278d6fa5/s_p_PuUKcoZEfAVSlPNM.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69318806205184ec278d6fa5/m_p_PuUKcoZEfAVSlPNM.jpg">تكبير</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/69318802205184ec278d6fa4/s_p_MF4zgk1ySUOBpqnG.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69318802205184ec278d6fa4/m_p_MF4zgk1ySUOBpqnG.jpg">تكبير</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/414/s_p_UgKueSl1yxG0SfbA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/414/m_p_UgKueSl1yxG0SfbA.jpg">تكبير</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/69330ed8205184ec278d6fc0/s_p_kXy4nTuYVCOxuDib.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69330ed8205184ec278d6fc0/m_p_kXy4nTuYVCOxuDib.jpg">تكبير</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/693187fd205184ec278d6fa3/s_p_R3poESL99kNRMpXi.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/693187fd205184ec278d6fa3/m_p_R3poESL99kNRMpXi.jpg">تكبير</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/69330e9e205184ec278d6fbf/s_p_ThLs4WrxsJ3ykxKU.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69330e9e205184ec278d6fbf/m_p_ThLs4WrxsJ3ykxKU.jpg">تكبير</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/69330e76205184ec278d6fbe/s_p_NykNwaI9TEwz1Ccf.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69330e76205184ec278d6fbe/m_p_NykNwaI9TEwz1Ccf.jpg">تكبير</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/69330e70205184ec278d6fbd/s_p_Rd3jEzEeesXUCTmh.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69330e70205184ec278d6fbd/m_p_Rd3jEzEeesXUCTmh.jpg">تكبير</a>]</p><p>في الكنيسة جداريات تمثل أحداثًا من العهد الجديد: خلاص الرسول بطرس من الغرق، وشفاء المفلوج عند بركة الغنم (ومن سلسلة معجزات المسيح لم تبقَ سوى هاتين الجداريتين)، والراعي الصالح.</p><p><strong>خلاص الرسول بطرس من الغرق</strong></p><img src="https://res.bibleox.com/s/img/image/simple/692c8038205184ec278d6f9e/s_p_QQ2Rml8gUWsyQtS9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c8038205184ec278d6f9e/m_p_QQ2Rml8gUWsyQtS9.jpg">تكبير</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6786b88ddba77200015ae11c/m_p_do380IVDukCAfdFk.jpg">نسخة 2</a>]</p><p><strong>شفاء المفلوج عند بركة الغنم</strong></p><img src="https://res.bibleox.com/s/img/image/simple/6786b889dba77200015ae11b/s_p_k1a5GDBvfzTCWmZv.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6786b889dba77200015ae11b/m_p_k1a5GDBvfzTCWmZv.jpg">تكبير</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6786bb0bdba77200015ae11d/m_p_dCRD85foL69l7kih.jpg">نسخة أخرى</a>]</p><p><strong>صورة قرب جرن المعمودية (القاعة رقم 6): الراعي الصالح يعيد الخروف الضال إلى القطيع</strong></p><img src="https://res.bibleox.com/s/img/image/simple/6931870c205184ec278d6fa2/s_p_uBkNi8jGsMFpOQSM.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931870c205184ec278d6fa2/m_p_uBkNi8jGsMFpOQSM.jpg">تكبير</a>]</p><h3>أوسابيوس القيصري (بامفيلوس)، أسقف ومؤرخ كنسي (نحو 258-339)</h3><p>يكتب عن بناء الكنائس المسيحية في جميع المدن في الأزمنة السابقة لحكم الإمبراطور الروماني دقلديانوس (سنوات حكمه: 284-305). وفي سنة 296 أصدر دقلديانوس مرسومًا بهدم الكنائس المسيحية. وكان أوسابيوس في وقت هذا المرسوم في الثامنة والثلاثين من عمره، أي أنه كان لا بد أن يكون شاهد عيان على إنشاء هذه الكنائس وهدمها معًا:</p><blockquote><p>5. بأي مودة كان يعامل رؤساءَ الكنائس الوكلاءُ والحكام! كيف نَصِف هذه <strong>الجموع التي تُعَدّ بالآلاف في كل مدينة</strong>، وهذه الحشود العجيبة من الناس <strong>المتدفقة إلى بيوت الصلاة! كانت الأبنية القديمة قليلة؛ <mark>ففي جميع المدن كانوا يقيمون كنائس جديدة واسعة</mark> (εὐρείας εἰς πλάτος ἀνὰ πάσας τὰς πόλεις ἐκ θεμελίων ἀνίστων <mark>ἐκκλησίας</mark>).</strong></p><p>&lt;…&gt;</p><p>4. كان العام التاسع عشر من حكم دقلديانوس، حين عُلِّق في كل مكان في شهر ديستروس (وهو آذار عند الرومان)، عشية عيد آلام الرب، <strong><mark>مرسوم إمبراطوري يأمر بهدم الكنائس حتى الأساس</mark> (βασιλικὰ γράμματα, τὰς μὲν <mark>ἐκκλησίας</mark> εἰς ἔδαφος φέρειν)</strong>، وأن تُحرق الكتب المقدسة، ويُعلن أن الذين يتمسكون بالمسيحية قد سُلبوا المناصب الشرفية؛</p></blockquote><p>(<a href="https://bibleox.com/ar/grc/w/%CE%95%CE%9A%CE%9A%CE%9B%CE%97%CE%A3%CE%99%CE%91%CE%A3%CE%A4%CE%99%CE%9A%CE%97%CE%A3_%CE%99%CE%A3%CE%A4%CE%9F%CE%A1%CE%99%CE%91%CE%A3-8/#:~:text=%E1%BC%80%CE%BD%E1%BD%B0%20%CF%80%E1%BD%B1%CF%83%CE%B1%CF%82%20%CF%84%E1%BD%B0%CF%82%20%CF%80%E1%BD%B9%CE%BB%CE%B5%CE%B9%CF%82%20%E1%BC%90%CE%BA%20%CE%B8%CE%B5%CE%BC%CE%B5%CE%BB%E1%BD%B7%CF%89%CE%BD%20%E1%BC%80%CE%BD%E1%BD%B7%CF%83%CF%84%CF%89%CE%BD%20%E1%BC%90%CE%BA%CE%BA%CE%BB%CE%B7%CF%83%E1%BD%B7%CE%B1%CF%82">تاريخ الكنيسة، الكتاب الثامن، 1.5 و2.4</a>)</p><h2>اكتشافات موضع شك</h2><h3><strong>بيت في هركولانيوم (</strong>القرن الأول<strong>)</strong></h3><img src="https://res.bibleox.com/s/img/image/simple/67e428d39a4a346bba31e8ba/s_p_F0lTpC2rqw7PVyf1.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/67e428d39a4a346bba31e8ba/m_p_F0lTpC2rqw7PVyf1.jpg">تكبير</a>] [<a href="https://res.bibleox.com/s/img/image/simple/69330b68205184ec278d6fb8/m_p_oEOCtcPUBThtuirO.jpg">نسخة 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/69330cb6205184ec278d6fb9/m_p_zMmSTHDi5RoizXsX.jpg">نسخة 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/69330cbb205184ec278d6fba/m_p_Jv9gdiBWmrMB5tc4.jpg">نسخة 4</a>] [<a href="https://res.bibleox.com/s/img/image/simple/67e428d79a4a346bba31e8bb/m_p_1sEN1KSZxei96K4S.jpg">نسخة 5</a>] [<a href="https://res.bibleox.com/s/img/image/simple/67e428db9a4a346bba31e8bc/m_p_TgMWk123osBJ9une.jpg">نسخة 6</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/69330cc3205184ec278d6fbc/s_p_YLRMNDvDg7nCTh3X.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69330cc3205184ec278d6fbc/m_p_YLRMNDvDg7nCTh3X.jpg">تكبير</a>]</p><p>في سنة 79 حدث ثوران بركان فيزوف، الذي دفن تحت الرماد البركاني مدنًا مثل بومبي وستابيا وهركولانيوم. وفي هركولانيوم وُجد <a href="https://ru.wikipedia.org/wiki/%D0%93%D0%B5%D1%80%D0%BA%D1%83%D0%BB%D0%B0%D0%BD%D1%83%D0%BC#%D0%94%D0%BE%D0%BC_%D0%B4%D0%B2%D1%83%D1%85%D1%81%D0%BE%D1%82%D0%BB%D0%B5%D1%82%D0%B8%D1%8F">بيت</a> (سُمّي بيت المئوية الثانية بمناسبة مرور مئتي عام على الحفريات)، كان في طابقه الثاني، في إحدى الغرف على الجدار، <a href="https://ermakvagus.com/Europe/Italy/Pompeii/christianity_pompeii_rus.html">تجويف على شكل صليب</a>، في الوسط تمامًا فوق خزانة خشبية. يرى بعضهم أن صليبًا خشبيًا للصلاة كان هناك، وأن ذلك المكان كان يُستخدم لإقامة خدمات مسيحية أو للصلاة المنزلية. غير أن هناك حججًا جدية ضد هذا الافتراض. وفي المدينة نفسها وُجد رف صغير، يُفترض أنه كان يمكن أن يترك أثرًا مشابهًا على الجدار.</p><img src="https://res.bibleox.com/s/img/image/simple/6932ff2b205184ec278d6fb6/s_p_cXmpauqq2EYuH6ww.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6932ff2b205184ec278d6fb6/m_p_cXmpauqq2EYuH6ww.jpg">تكبير</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6932ff36205184ec278d6fb7/s_p_KIfO7M0rbhGbWoIk.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6932ff36205184ec278d6fb7/m_p_KIfO7M0rbhGbWoIk.jpg">تكبير</a>] [<a href="https://res.bibleox.com/s/img/image/simple/69330cbf205184ec278d6fbb/m_p_WL1FQysNlwZc0yT9.jpg">نسخة 2</a>]</p><p>الرف ليس متطابقًا تمامًا: فله بروز كبير نسبيًا إلى اليسار وإلى اليمين، وبروز أصغر إلى الأسفل. وإضافة إلى ذلك، يُفترض أن في بيت المئوية الثانية كان في هذا الموضع على الجدار مصراعان يُغلقان. ومع ذلك، فاحتمال كبير أن يكون في بيت المئوية الثانية رف عادي فعلًا، لا صليب. وعلى القارئ نفسه أن يحدد درجة الثقة بهذا الاستنتاج أو ذاك. وهنا جُمعت فقط المعلومات المعروفة عن هذا الاكتشاف.</p>
