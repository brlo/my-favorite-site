  - src: древние-иконы
    path: Ik1c_مجموعة_الأيقونات_القديمة
    title: "مجموعة الأيقونات القديمة"
    title_sub: "أيقونات مسيحية قديمة للمسيح ووالدة الإله والرسل وقديسين آخرين"
    body: |-
      <h2>~القرن الخامس عشر ق.م.</h2><h3>خيمة الاجتماع</h3><p>على الحجاب في وسط الهيكل (بين القدس وقدس الأقداس) صُوِّرت كاروبيم (<a href="https://bibleox.com/ar/arab-avd/ish/26/#L31">خر 26:31</a>)، وكذلك على الأغطية (الجدران) المحيطة (<a href="https://bibleox.com/ar/arab-avd/ish/26/#L1">خر 26:1</a>؛ <a href="https://bibleox.com/ar/arab-avd/ish/36/#L8">خر 36:8</a>)، وهو ما لم يرسمه مؤلف الرسم. وخيمة الاجتماع هي صورة (أيقونة) للحقيقة السماوية (<a href="https://bibleox.com/ar/arab-avd/ish/25/#L8-9,40">خر 25:8-9,40</a>؛ <a href="https://bibleox.com/ar/arab-avd/evr/9/#L24">عب 9:24</a>؛ <a href="https://bibleox.com/ar/arab-avd/act/7/#L44">أع 7:44</a>). وقد أمر الله بإكرام الهيكل (<a href="https://bibleox.com/ar/arab-avd/lev/19/#L30">لا 19:30</a>؛ <a href="https://bibleox.com/ar/arab-avd/lev/26/#L2">لا 26:2</a>).</p><img src="https://res.bibleox.com/s/img/image/simple/471/s_p_P2j4gLJt9iKSnkge.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/471/m_p_P2j4gLJt9iKSnkge.jpg">تكبير</a>] [<a href="https://res.bibleox.com/s/img/image/simple/472/m_p_bNPh6hCNJDhzahar.jpg">منظر خارجي</a>]</p><h3>تابوت العهد</h3><p>على التابوت صُوِّر ملاكان كاروبيان (<a href="https://bibleox.com/ru/ru/w/%D0%BA%D0%BE%D0%B2%D1%87%D0%B5%D0%B3_%D0%B7%D0%B0%D0%B2%D0%B5%D1%82%D0%B0/">مراجع الكتاب المقدس (بالروسية)</a>). والنبي يشوع بن نون سجد أمام تابوت العهد (<a href="https://bibleox.com/ar/arab-avd/nav/7/#L6">يش 7:6</a>).</p><img src="https://res.bibleox.com/s/img/image/simple/469/s_p_DUn5vqnI4F8yRiNA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/469/m_p_DUn5vqnI4F8yRiNA.jpg">تكبير</a>]</p><h3>معسكر إسرائيل</h3><p>كان إسرائيل ينتقل في تشكيل على شكل صليب (<a href="https://bibleox.com/ru/ru/w/%D0%B5%D0%B2%D1%80%D0%B5%D0%B9%D1%81%D0%BA%D0%B8%D0%B9-%D1%81%D1%82%D0%B0%D0%BD-%D0%BA%D1%80%D0%B5%D1%81%D1%82/">مراجع الكتاب المقدس (بالروسية)</a>).</p><img src="https://res.bibleox.com/s/img/image/simple/470/s_p_t8tRbbwlzsBzyVzk.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/470/m_p_t8tRbbwlzsBzyVzk.jpg">تكبير</a>]</p><h2>~القرن العاشر ق.م.</h2><h3>هيكل أورشليم الذي بناه سليمان</h3><p>كانت على جدران الهيكل صور كاروبيم منقوشة (<a href="https://bibleox.com/ar/arab-avd/3ts/6/#L32">1مل 6:32</a>)، وعلى باب المدخل (<a href="https://bibleox.com/ar/arab-avd/3ts/6/#L32">1مل 6:32</a>؛ (<a href="https://bibleox.com/ar/arab-avd/3ts/6/#L35">1مل 6:35</a>) وعلى الحجاب أمام مدخل قدس الأقداس (<a href="https://bibleox.com/ar/arab-avd/2par/3/#L14">2أخ 3:14</a>؛ <a href="https://bibleox.com/ar/arab-avd/1mak/1/#L22">1مك 1:22</a>). وفي قدس الأقداس كان يقوم تمثالان كبيران من الخشب المذهَّب للكاروبيم (<a href="https://bibleox.com/ar/arab-avd/3ts/6/#L23">1مل 6:23</a>). وعلى غطاء تابوت العهد صُنع تمثالان للكاروبيم (<a href="https://bibleox.com/ar/arab-avd/ish/25/#L18-20">خر 25:18-20</a>). وفي دار الهيكل، على القواعد الكبيرة للأحواض، صُوِّرت أسود وثيران وكاروبيم (<a href="https://bibleox.com/ar/arab-avd/3ts/7/#L28-29">1مل 7:28-29</a>). (<a href="https://bibleox.com/ru/ru/w/%D0%B8%D0%B5%D1%80%D1%83%D1%81%D0%B0%D0%BB%D0%B8%D0%BC%D1%81%D0%BA%D0%B8%D0%B9-%D1%85%D1%80%D0%B0%D0%BC/">المزيد (بالروسية)</a>).</p><p>والنبي داود سجد نحو الهيكل (<a href="https://bibleox.com/ar/arab-avd/ps/5/#L7">مز 5:7</a>؛ <a href="https://bibleox.com/ar/arab-avd/ps/98/#L5">مز 98:5</a>؛ <a href="https://bibleox.com/ar/arab-avd/ps/131/#L7">مز 131:7</a>)، مقدمًا الإكرام لله بواسطة هذه الصورة.</p><img src="https://res.bibleox.com/s/img/image/simple/468/s_p_lv7GzNtM53C4Zqgr.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/468/m_p_lv7GzNtM53C4Zqgr.jpg">تكبير</a>]</p><h2>القرن الثاني</h2><h3>والدة الإله مع الطفل يسوع، والنبي يشير إلى النجم (روما)</h3><p>القرن الثاني - بداية القرن الثالث. سراديب الموتى (الكاتاكومب) بريسيلا[6]. هذه أقدم صورة لوالدة الإله. والرجل الذي بجانب والدة الإله قد يحمل كتابًا في يده اليسرى، ويشير بإصبع يده اليمنى إلى النجم.</p><img src="https://res.bibleox.com/s/img/image/simple/6751b012dba7720001514f69/s_p_jNTGMwic6Cse9xDG.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6751b012dba7720001514f69/m_p_jNTGMwic6Cse9xDG.jpg">تكبير</a>] [<a href="https://res.bibleox.com/s/img/image/simple/67618740dba7720001cd0e2c/m_p_ckKuGWqzHuN1tR5Q.jpg">نسخة 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686cf0535f47da2505d3ae4d/m_p_dajA4xvStk0EnnSq.jpg">نسخة 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686cf7725f47da2505d3ae50/m_p_n79yEKK4QSCeorx3.jpg">نسخة 4</a>] [<a href="https://res.bibleox.com/s/img/image/simple/442/m_p_5zQEQbMmBkEs9J2S.jpg">نسخة 5</a>]</p><p>قد يكون الرجل الذي بجانب والدة الإله النبي إشعياء الذي قال النبوة:</p><blockquote><p>«وَلَكِنْ يُعْطِيكُمُ ٱلسَّيِّدُ نَفْسُهُ آيَةً: هَا <strong>ٱلْعَذْرَاءُ تَحْبَلُ وَتَلِدُ ٱبْنًا</strong> وَتَدْعُو ٱسْمَهُ "عِمَّانُوئِيلَ"» (<a href="https://bibleox.com/ar/arab-avd/is/7/#L14">إش 7:14</a>)</p></blockquote><p>أو بلعام:</p><blockquote><p>«أَرَاهُ وَلَكِنْ لَيْسَ ٱلْآنَ. أُبْصِرُهُ وَلَكِنْ لَيْسَ قَرِيبًا. <strong>يَبْرُزُ كَوْكَبٌ مِنْ يَعْقُوبَ</strong>، وَيَقُومُ قَضِيبٌ مِنْ إِسْرَائِيلَ، فَيُحَطِّمُ طَرَفَيْ مُوآبَ، وَيُهْلِكُ كُلَّ بَنِي ٱلْوَغَى» (<a href="https://bibleox.com/ar/arab-avd/chis/24/#L17">عد 24:17</a>)</p></blockquote><p>أو ربما استخدم الرسام هذه الوسيلة بدلًا من نقش تفسيري. فهو يدعونا إلى أخذ الكتاب وقراءة النبوة عن النجم الصاعد، وفهم أنه رسم ميلاد مَن تتحدث عنه هذه النبوة، أي ميلاد المخلص من العذراء.</p><h3>المسيح في صورة الراعي الصالح</h3><p>نهاية القرن الثاني. روما. سراديب الموتى (الكاتاكومب) كاليستوس (<a href="https://en.wikipedia.org/wiki/Catacomb_of_Callixtus#Paintings">Callixitus Catacomb, Crypt of Lucina</a>).</p><img src="https://res.bibleox.com/s/img/image/simple/473/s_p_mrIYHR2oqLQuPn0z.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/473/m_p_mrIYHR2oqLQuPn0z.jpg">تكبير</a>]</p><h2>القرن الثالث</h2><h3>والدة الإله «أورانتا» (روما)</h3><p>Catacomba Maggiore, Roma[26][27]. في المقدمة صُوِّرت العذراء مريم والطفل المسيح.</p><img src="https://res.bibleox.com/s/img/image/simple/6751fe6ddba7720001514f7e/s_p_C1Iw2V4OhNy1SGOE.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6751fe6ddba7720001514f7e/m_p_C1Iw2V4OhNy1SGOE.jpg">تكبير</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686cefb35f47da2505d3ae4c/m_p_70zYu2r0np0WFNUu.jpg">نسخة 2</a>]</p><h3>المسيح، الرسل، الشهداء غورغونيوس وبطرس ومارسلينوس وتيبورتيوس (روما)</h3><p>سراديب الموتى (الكاتاكومب) لبطرس ومارسلينوس</p><img src="https://res.bibleox.com/s/img/image/simple/6752012adba7720001514f82/s_p_x5I0ahjwMz1X5LoJ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6752012adba7720001514f82/m_p_x5I0ahjwMz1X5LoJ.jpg">تكبير</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686d237a5f47da2505d3ae56/m_p_ST9me27UGtWHYDBc.jpg">نسخة 2</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/676082a6dba7720001cd0e22/s_p_YjPD3PzLDCF4wgh1.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/676082a6dba7720001cd0e22/m_p_YjPD3PzLDCF4wgh1.jpg">تكبير</a>]</p><h3>امرأة تصلّي إلى الراعي الصالح (روما)</h3><p>القرن الثالث. سراديب الموتى (الكاتاكومب) بريسيلا[6].</p><p>تُشكِّل الصور تكوينًا واحدًا. لقد رتَّب الرسام الصور بحيث يبدو أن المصلِّين المرسومين حولها ينظرون ويرفعون أيديهم نحو قمة الغرفة حيث صُوِّر المسيح في صورة <strong>الراعي الصالح</strong> (<a href="https://bibleox.com/ar/arab-avd/in/10/#L11">يو 10:11</a>). وتجمع جميع المشاهد حول الراعي الصالح فكرة واحدة — <strong>الخلاص من الموت</strong>.</p><img src="https://res.bibleox.com/s/img/image/simple/686bea5b5f47da2505d3ae31/s_p_pjRHeoFaUpKPoyEH.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686bea5b5f47da2505d3ae31/m_p_pjRHeoFaUpKPoyEH.jpg">تكبير</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686cf7375f47da2505d3ae4f/m_p_MOsOWI2vEXUj5ELf.jpg">نسخة 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6904b3f2205184ec278d6e53/m_p_0GRveVCOh2GBz7eq.jpg">نسخة 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/431/m_p_LUZsrJtesEWiwHBO.jpg">نسخة 4</a>]</p><p>الراعي الصالح هو المسيح (لو 15: 6-7؛ يو 10: 1-21؛ مز 23).</p><img src="https://res.bibleox.com/s/img/image/simple/69319f74205184ec278d6fa7/s_p_GR8gHxKZuC87xqlf.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69319f74205184ec278d6fa7/m_p_GR8gHxKZuC87xqlf.jpg">تكبير</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686d2ac55f47da2505d3ae59/m_p_JDvtNt9RJrqnAsEW.jpg">نسخة 2</a>]</p><p>امرأة مغطاة الرأس تصلّي وأيديها مرفوعتان إلى الأعلى (المرجَّح أنها سارة: تك 18: 1-15 وتك 21: 1-7).</p><img src="https://res.bibleox.com/s/img/image/simple/686bea885f47da2505d3ae32/s_p_79wnuevuFIi3tnrH.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686bea885f47da2505d3ae32/m_p_79wnuevuFIi3tnrH.jpg">تكبير</a>]</p><p>على اليمين مشهد من العهد القديم: الفتية الثلاثة (<a href="https://en.wikipedia.org/wiki/Catacomb_of_Priscilla#/media/File:Shadrach,_Meshach,_and_Abednego_in_the_fiery_furnace,_from_the_book_Die_Malereien_der_Katakomben_Roms,_plate_78,_levels_adjusted.jpg">شدرخ وميشخ وعبدنجو</a>) يصلّون وأيديهم مرفوعة إلى الأعلى (دا 3: 1-90).</p><img src="https://res.bibleox.com/s/img/image/simple/686cfc565f47da2505d3ae52/s_p_NmZJuoF70d9qohZs.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686cfc565f47da2505d3ae52/m_p_NmZJuoF70d9qohZs.jpg">تكبير</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686cfc475f47da2505d3ae51/m_p_qzHB83d52LoU7QQL.jpg">نسخة 2</a>]</p><p>على اليسار مشهد من العهد القديم: إبراهيم وإسحاق مع حطب تقديم الذبيحة (تك 22: 1-19).</p><img src="https://res.bibleox.com/s/img/image/simple/686d33c45f47da2505d3ae5a/s_p_QQLn5T52hx8gSrBf.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d33c45f47da2505d3ae5a/m_p_QQLn5T52hx8gSrBf.jpg">تكبير</a>]</p><p>فوق المدخل صُوِّر النبي يونان وقد ابتلعه حيوان البحر (<a href="https://bibleox.com/ar/arab-avd/ion/2/#L1">يون 2:1</a>).</p><img src="https://res.bibleox.com/s/img/image/simple/476/s_p_aHV4YSuoWhVZ1H5y.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/476/m_p_aHV4YSuoWhVZ1H5y.jpg">تكبير</a>]</p><p>يجدر وصف مشهد حياة المرأة المصلِّية في الجزء الأمامي من الغرفة بمزيد من التفصيل.</p><img src="https://res.bibleox.com/s/img/image/simple/686d36265f47da2505d3ae5d/s_p_MGpxKQ94pikRfgFK.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d36265f47da2505d3ae5d/m_p_MGpxKQ94pikRfgFK.jpg">تكبير</a>]</p><p><strong>أحداث المشهد الأمامي</strong></p><p>كل قسم من تكوين الغرفة يصوّر مشهدًا واحدًا. وجميع المشاهد مكوّنات مهمة في الموضوع المسيحي. في الأعلى مشهد الراعي الصالح، وعلى اليسار مشهد إبراهيم، وعلى اليمين مشهد الفتية الثلاثة، وفي الممر مشهد النبي يونان. وفي هذا السياق يمكن أن نفترض أن الرسام لم يخرج عن هذه القاعدة (قسم واحد — مشهد مهم واحد) في الجزء الأمامي من الغرفة أيضًا، وهو الجزء الذي يصعب وصفه وصفًا قاطعًا. وهنا يُطرح مجرد افتراض. وبما أن جميع الجوانب (ما عدا الوسط) تحمل مشاهد من العهد القديم، يمكن أن نفترض في الجانب الأمامي قصة هاجر (تك 16، تك 21). وإن كان الأمر كذلك، فصُوِّر أولًا إبراهيم وهاجر وهي تُطرد مع ابنها إسماعيل (1)، ثم صلاة سارة (2)، ثم هاجر وهي تُرضع الطفل (3).</p><p>لنتأمل هذه الرؤية بمزيد من التفصيل:</p><p><strong>1. طرد هاجر</strong>. يمكن القول على وجه الدقة إن الجالس هو إبراهيم (فشعره ولحيته كما في الجدارية التي تصوّر إبراهيم في الجهة المقابلة). وفي الثوب الأصفر صُوِّرت على الأرجح هاجر (فلعل اللون الأصفر كان يُبرز وضع العبد). ويبدو أن في يديها قربة ماء (<a href="https://bibleox.com/ar/arab-avd/gen/21/#L14">تك 21:14</a>). وخلفها صُوِّر ربما ابنها إسماعيل، الذي كان يجب أن يكون عمره عند الطرد أكثر من 15 سنة (<em>وُلد إسماعيل وكان عمر إبراهيم 86 </em><a href="https://bibleox.com/ar/arab-avd/gen/16/#L16">تك 16:16</a><em>، ووُلد إسحاق وكان عمر إبراهيم 100 سنة </em><a href="https://bibleox.com/ar/arab-avd/gen/21/#L5">تك 21:5</a><em>، وطُردت هاجر عندما كبر إسحاق وفُطم </em><a href="https://bibleox.com/ar/arab-avd/gen/21/#L8-13">تك 21:8-13</a>). ويبدو أنها امرأة في مئزر، لكن إن كان الأمر كذلك فلا يمكن أن تكون إلا هاجر نفسها (فرأسها غير مغطى لأنها غير متزوجة)، وأما مَن يحمل القربة فهو في هذه الحالة إسماعيل. وعلى أي حال، فالشخصان الباقيان هما هاجر وإسماعيل، وهذا هو الاحتمال الأرجح. وقد لا يكون هذا التكوين كله مؤلفًا من أقسام منفصلة، بل لوحة واحدة متكاملة، لأن المرأة مع الطفل تنظر إلى المرأة المرفوعة اليدين إلى الأعلى.</p><img src="https://res.bibleox.com/s/img/image/simple/686d33c95f47da2505d3ae5b/s_p_kuEcuyUnGenBuWPw.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d33c95f47da2505d3ae5b/m_p_kuEcuyUnGenBuWPw.jpg">تكبير</a>]</p><p><strong>2. صلاة سارة</strong>. في الثوب الأحمر والرأس المغطى صُوِّرت سارة وهي تصلّي إلى الله. واللون الأحمر للثوب يدل على المكانة الرفيعة، والرأس المغطى يدل على الزواج.</p><img src="https://res.bibleox.com/s/img/image/simple/686d3a855f47da2505d3ae5e/s_p_rpl3jnuNnx8ZisdR.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d3a855f47da2505d3ae5e/m_p_rpl3jnuNnx8ZisdR.jpg">تكبير</a>]</p><p><strong>3. هاجر تُرضع الطفل</strong>. يؤيد الرأي القائل إنها هاجر أن رأسها غير مغطى (أي أنها غير متزوجة)، وأن شكل شعرها كشكل الشعر عند الشخص ذي الثوب الأصفر في المشهد الأول. ويكشف عنها أيضًا نظراتها المميزة: فهي تنظر إلى سارة التي كانت بينها وبينها علاقة متوترة. ومن اللافت أن الرسام صوّرها تمامًا كما يجلس إبراهيم على اليسار: على كرسي وفي الثوب نفسه (خطوط عمودية، وخطان على الكم، وعباءة).</p><img src="https://res.bibleox.com/s/img/image/simple/686d22a05f47da2505d3ae54/s_p_8fxd9vcRlXYszSJU.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d22a05f47da2505d3ae54/m_p_8fxd9vcRlXYszSJU.jpg">تكبير</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686d33cd5f47da2505d3ae5c/m_p_qKPp740xLZNuDEFs.jpg">نسخة 2</a>]</p><p><strong>الفكرة العامة للغرفة — الخلاص من الموت</strong></p><p>لتكوين هذه الكوبيكولا فكرة عامة جميلة — الخلاص من الموت. ويتصاعد المشهد العام من الأسفل إلى الأعلى على مستويات:</p><ul><li><p>المستوى الأدنى — المسيحيون الموتى المدفونون، المؤمنون بغالب الموت — المسيح.</p></li><li><p>المستوى الأوسط — المشاهد الكتابية عن الخلاص من الموت:</p><ul><li><p>الفتية الثلاثة في أتون بابل نجوا من الموت في النار؛</p></li><li><p>النبي يونان نجا من الموت في جوف حيوان البحر؛</p></li><li><p>إسحاق نجا من التقديم ذبيحة، وقُدِّم عوضًا عنه حمل؛</p></li><li><p>هاجر مع ابنها إسماعيل نجت من الموت في البرية.</p></li></ul></li><li><p>المستوى قبل الأخير — رموز مسيحية: الطاووس (القيامة، الخلود، الحياة الأبدية) والحجل (النفس). حجل واحد يقف قرب نبات حيّ (يرمز إلى الحياة)، وآخر قرب نبات يابس (يرمز إلى الموت). والطواويس واقفة كذلك.</p></li><li><p>وسط السقف — الراعي الصالح الذي يخلّص المؤمنين من الموت. ومن اللافت أن هنا إشارة صغيرة أخرى إلى الخلاص من الموت — على يسار الراعي ويمينه يجلس غراب وحمامة تحمل غصن زيتون، وهما اللذان أرسلهما نوح من الفلك. وهكذا يُقاد المخلَّصون في الفلك من الموت، بهذين الطائرين، إلى المخلِّص من الموت — المسيح.</p></li></ul><h3>الكنيسة في دورا أوروبوس (سوريا)</h3><p>عام 244. كانت كنيسة دورا أوروبوس، إضافة إلى أحداث العهد القديم، تضم جداريات تصوّر أحداثًا من العهد الجديد: خلاص الرسول بطرس من الغرق، وشفاء المشلول عند بركة باب الضأن. انظر أيضًا <a href="https://vk.com/@aletheia-de-sacris-imaginibus-venerandis?anchor=v-drugie-svyaschennye-izobrazhenia-v-donikeyskiy-period">المقال</a>.</p><p><strong>المسيح في صورة الراعي الصالح (المشهد الرئيسي في قاعة المعمودية)</strong></p><img src="https://res.bibleox.com/s/img/image/simple/6931870c205184ec278d6fa2/s_p_uBkNi8jGsMFpOQSM.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931870c205184ec278d6fa2/m_p_uBkNi8jGsMFpOQSM.jpg">تكبير</a>]</p><p><strong>خلاص الرسول بطرس من الغرق</strong></p><img src="https://res.bibleox.com/s/img/image/simple/692c8038205184ec278d6f9e/s_p_QQ2Rml8gUWsyQtS9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c8038205184ec278d6f9e/m_p_QQ2Rml8gUWsyQtS9.jpg">تكبير</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6786b88ddba77200015ae11c/m_p_do380IVDukCAfdFk.jpg">نسخة 2</a>]</p><p><strong>شفاء المشلول عند بركة باب الضأن</strong></p><img src="https://res.bibleox.com/s/img/image/simple/6786b889dba77200015ae11b/s_p_k1a5GDBvfzTCWmZv.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6786b889dba77200015ae11b/m_p_k1a5GDBvfzTCWmZv.jpg">تكبير</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6786bb0bdba77200015ae11d/m_p_dCRD85foL69l7kih.jpg">نسخة أخرى</a>]</p><h3>المسيح في صورة الراعي الصالح، النبي يونان</h3><p>نهاية القرن الثالث - بداية القرن الرابع. روما. سراديب الموتى (الكاتاكومب) لبطرس ومارسلينوس.</p><p>في الوسط — المسيح في صورة الراعي الصالح. وعلى جانبي الوسط صُوِّر يونان. في الجدارية اليسرى يُلقى بيونان من السفينة، وفي اليمنى يبتلعه الحوت.</p><img src="https://res.bibleox.com/s/img/image/simple/478/s_p_yvJcnbLGPxZ6AzRu.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/478/m_p_yvJcnbLGPxZ6AzRu.jpg">تكبير</a>]</p><p>النبي يونان</p><img src="https://res.bibleox.com/s/img/image/simple/481/s_p_7z5j4tAimokFaRMN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/481/m_p_7z5j4tAimokFaRMN.jpg">تكبير</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/480/s_p_b8gqyOenKZcn2MCp.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/480/m_p_b8gqyOenKZcn2MCp.jpg">تكبير</a>]</p><h3>المسيح في صورة الراعي الصالح</h3><p>القرن الثالث. روما. سراديب الموتى (الكاتاكومب) كاليستوس (<a href="https://en.wikipedia.org/wiki/Catacomb_of_Callixtus#Paintings">Callixitus Catacomb, Crypt of Lucina</a>). يمكن الافتراض أن في القِدر الصغير حليبًا يرمز إلى الإفخارستيا (انظر عند كليمنت الإسكندري).</p><img src="https://res.bibleox.com/s/img/image/simple/474/s_p_zcLmMd2qkyG3pDoj.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/474/m_p_zcLmMd2qkyG3pDoj.jpg">تكبير</a>]</p><h3>الراعي الصالح، مقبرة خيسارتب، نيقية (إزنيق)</h3><p>~القرن الثالث. الاكتشاف حديث، والتأريخ تخميني (<a href="https://www.arkeolojikhaber.com/haber-iznikte-benzersiz-bir-kesif-anadolunun-tek-coban-isa-figuru-gun-yuzune-cikarildi-43079/">المزيد</a>). استُخدمت هذه المقبرة من القرن الثاني إلى القرن الخامس.</p><p>الإحداثيات: 40.78204218462122, 29.928491677648932. اسم الموضع بالتركية: Hasartep Nekropolü.</p><img src="https://res.bibleox.com/s/img/image/simple/69444e49205184ec278d6fdb/s_p_SZTpvcDdpodujcbM.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69444e49205184ec278d6fdb/m_p_SZTpvcDdpodujcbM.jpg">تكبير</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6941a813205184ec278d6fda/s_p_CUoa7dSy5UxGf1UD.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6941a813205184ec278d6fda/m_p_CUoa7dSy5UxGf1UD.jpg">تكبير</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6941a80f205184ec278d6fd9/m_p_xSCaRt10DUUReyMt.jpg">نسخة 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/693c7d1a205184ec278d6fcb/m_p_mR5ZaVgXbezmXDyo.jpg">نسخة 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/693d606b205184ec278d6fd3/m_p_TKCjvhxmnq0q50tW.jpg">نسخة 4</a>] [<a href="https://res.bibleox.com/s/img/image/simple/693d6101205184ec278d6fd7/m_p_1i6aL6lfDR08iA13.jpg">نسخة 5</a>] [<a href="https://res.bibleox.com/s/img/image/simple/693d60f8205184ec278d6fd6/m_p_b2uUaO6tzciaKAgC.jpg">نسخة 6</a>] [<a href="https://res.bibleox.com/s/img/image/simple/693d60f1205184ec278d6fd5/m_p_bErh7lbI0e08hPaa.jpg">نسخة 7</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/693c7db2205184ec278d6fd2/s_p_wCZsWPWG7jCNLjIr.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/693c7db2205184ec278d6fd2/m_p_wCZsWPWG7jCNLjIr.jpg">تكبير</a>] [<a href="https://res.bibleox.com/s/img/image/simple/693d60ad205184ec278d6fd4/m_p_BCvsIiJX10j2Mf2k.jpg">رجل وامرأة</a>] [<a href="https://res.bibleox.com/s/img/image/simple/693c7daa205184ec278d6fd1/m_p_cjk36Xjpev9EFq2h.jpg">امرأة</a>]</p><h3>خاتم الزواج (بيزنطة)</h3><p>القرنان الثالث والرابع. <a href="https://www.metmuseum.org/art/collection/search/663485">متحف المتروبوليتان في الجادة الخامسة، الولايات المتحدة</a>. (باليونانية χάρις — النعمة)</p><img src="https://res.bibleox.com/s/img/image/simple/68b5da8b45c75323d28a5e99/s_p_GNh1S8L7fcowsMEE.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5da8b45c75323d28a5e99/m_p_GNh1S8L7fcowsMEE.jpg">تكبير</a>]</p><h3>إقامة الإفخارستيا</h3><p>القرن الثالث. روما. سراديب الموتى (الكاتاكومب) كاليستوس (<a href="https://en.wikipedia.org/wiki/Catacomb_of_Callixtus#Paintings">Callixitus Catacomb, Crypt of Lucina</a>). صُوِّر على الأرجح كاهن يشاركه شماس. وهكذا تُقام الإفخارستيا اليوم أيضًا في كنائس الكنيسة الأرثوذكسية: يرفع الكاهن كلتا يديه إلى الأعلى، ويشير الشماس إلى المواهب المقدسة.</p><img src="https://res.bibleox.com/s/img/image/simple/479/s_p_Zbn405P2krjwNAYl.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/479/m_p_Zbn405P2krjwNAYl.jpg">تكبير</a>]</p><h2>القرن الرابع</h2><h3>المسيح (روما)</h3><p>سراديب الموتى (الكاتاكومب) كوموديلا.</p><img src="https://res.bibleox.com/s/img/image/simple/66cc2bd6dba77200019bc7d2/s_p_7xYGBb9wCmxBIGrZ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/66cc2bd6dba77200019bc7d2/m_p_7xYGBb9wCmxBIGrZ.jpg">تكبير</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686d23425f47da2505d3ae55/s_p_LzqgbhnIsbqtghoc.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d23425f47da2505d3ae55/m_p_LzqgbhnIsbqtghoc.jpg">تكبير</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a1e1205184ec278d6fa8/m_p_KC0MljXJf5po70pj.jpg">نسخة 2</a>]</p><h3>المسيح والرسل (روما)</h3><p>~عام 350. [8][9] ضريح سانتا كونستانزا.</p><img src="https://res.bibleox.com/s/img/image/simple/686990665f47da2505d3ae19/s_p_5RDr4ou4ExBAh4KE.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686990665f47da2505d3ae19/m_p_5RDr4ou4ExBAh4KE.jpg">تكبير</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686990425f47da2505d3ae17/s_p_CXn5KmuiWradhOvh.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686990425f47da2505d3ae17/m_p_CXn5KmuiWradhOvh.jpg">تكبير</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686990545f47da2505d3ae18/s_p_IkgteAcecXoMC106.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686990545f47da2505d3ae18/m_p_IkgteAcecXoMC106.jpg">تكبير</a>]</p><h3>معمودية سان جوفاني إن فونتي (نابولي)</h3><p>350-400 م. [11][12]</p><img src="https://res.bibleox.com/s/img/image/simple/6869924c5f47da2505d3ae1a/s_p_t1iU8sClY3pnOnkK.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6869924c5f47da2505d3ae1a/m_p_t1iU8sClY3pnOnkK.jpg">تكبير</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686992505f47da2505d3ae1b/s_p_BrRKZmtReJbgXm0w.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686992505f47da2505d3ae1b/m_p_BrRKZmtReJbgXm0w.jpg">تكبير</a>]</p><h3>المسيح والملائكة، المجيء الثاني (سالونيك، بيزنطة)</h3><p>نهاية القرن الرابع. [17][18]. روتوندا القديس جاورجيوس المنتصر (في الأصل ضريح الإمبراطور غاليريوس).</p><img src="https://res.bibleox.com/s/img/image/simple/6931a254205184ec278d6fa9/s_p_bWn7Chqiox5UOEd4.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931a254205184ec278d6fa9/m_p_bWn7Chqiox5UOEd4.jpg">تكبير</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a2ba205184ec278d6faa/m_p_ROPWmBVyUxWMGo9Z.jpg">نسخة 2</a>]</p><p>لم تُحفظ الفسيفساء حفظًا جيدًا. لم يبقَ من صورة المسيح إلا جزء من الهالة واليدين والصليب. وحولها تُرى وجوه الملائكة بوضوح.</p><img src="https://res.bibleox.com/s/img/image/simple/686a91695f47da2505d3ae1f/s_p_EoOSmhaBPsy32XQQ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686a91695f47da2505d3ae1f/m_p_EoOSmhaBPsy32XQQ.jpg">تكبير</a>]</p><h3>قدّيسون من الأساقفة والجنود والأطباء (سالونيك، بيزنطة)</h3><p>أواخر القرن الرابع [17][18]. روتوندا القديس جاورجيوس المنتصر (كانت في الأصل قبر الإمبراطور غاليريوس).</p><p>ومن بين الفسيفساء صور لقدّيسين من الأساقفة والجنود والأطباء والموسيقيين، بأسماء رومانوس وكيرلس ولاون وأونيسيفوروس وإفكاربيوس وباسيليسكوس وبورفيريوس وفليمون وبريسكوس وفيرينوس وكوزما وداميانوس.</p><img src="https://res.bibleox.com/s/img/image/simple/686aa0275f47da2505d3ae21/s_p_oIksDo9rIgSoAXvG.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa0275f47da2505d3ae21/m_p_oIksDo9rIgSoAXvG.jpg">تكبير</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686aa02e5f47da2505d3ae22/s_p_nTZtC6C93KI8Fu6I.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa02e5f47da2505d3ae22/m_p_nTZtC6C93KI8Fu6I.jpg">تكبير</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686aa0335f47da2505d3ae23/s_p_b1KhWllqTzipVhO9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa0335f47da2505d3ae23/m_p_b1KhWllqTzipVhO9.jpg">تكبير</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686aa0385f47da2505d3ae24/s_p_vvlbG9E89B9T0U8j.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa0385f47da2505d3ae24/m_p_vvlbG9E89B9T0U8j.jpg">تكبير</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686aa03f5f47da2505d3ae25/s_p_d3lcRobegfAQOf6e.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa03f5f47da2505d3ae25/m_p_d3lcRobegfAQOf6e.jpg">تكبير</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686aa0555f47da2505d3ae27/s_p_h1YgFpMukwaYc23Q.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa0555f47da2505d3ae27/m_p_h1YgFpMukwaYc23Q.jpg">تكبير</a>]</p><p>القديسان كوزما وداميانوس</p><img src="https://res.bibleox.com/s/img/image/simple/686aa04e5f47da2505d3ae26/s_p_LwMjPHLsabDDxEHy.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa04e5f47da2505d3ae26/m_p_LwMjPHLsabDDxEHy.jpg">تكبير</a>]</p><h3>صورة المسيح المصلوب بين اللصّين (روما)</h3><p>بداية القرن الرابع. بازيليكا سانتا سابينا، أحد ألواح الأبواب. صورة بارزة (نقش نافر) للصلب.</p><img src="https://res.bibleox.com/s/img/image/simple/676183a8dba7720001cd0e2b/s_p_ccaA7HzLPDInwe1b.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/676183a8dba7720001cd0e2b/m_p_ccaA7HzLPDInwe1b.jpg">تكبير</a>]</p><h3>دخول الرب إلى أورشليم (بيزنطة)</h3><p>بداية القرن الرابع. <a href="https://www.metmuseum.org/art/collection/search/466220">متحف المتروبوليتان في الجادة الخامسة، الولايات المتحدة</a>. 67.3 × 212.1 × 61.9 سم.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5e69845c75323d28a5e9d/s_p_Kk1dIB2OLr1OjQ1O.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5e69845c75323d28a5e9d/m_p_Kk1dIB2OLr1OjQ1O.jpg">تكبير</a>]</p><h3>المسيح، لوح حجري (خيرسون)</h3><p>300-500 م. <a href="https://collections.louvre.fr/en/ark:/53355/cl010276835">متحف اللوفر، فرنسا</a>. يذكر المتحف أن الجزء الثاني محفوظ في متحف الإرميتاج. وقد نُقشت كلمات موجَّهة إلى الرسول بطرس.</p><img src="https://res.bibleox.com/s/img/image/simple/68c41cec6594f46d35a87f04/s_p_esWl4etLsBMVz9bw.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c41cec6594f46d35a87f04/m_p_esWl4etLsBMVz9bw.jpg">تكبير</a>]</p><h3>المسيح المعلّم (روما)</h3><p>سراديب الموتى (الكاتاكومب) لدوميتيلا. رسم جداري في هلال (لونيت) الكوبيكولوم.</p><img src="https://res.bibleox.com/s/img/image/simple/674ed2a4dba77200011c738a/s_p_4M8Vki7GNJBHkJPN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674ed2a4dba77200011c738a/m_p_4M8Vki7GNJBHkJPN.jpg">تكبير</a>]</p><h3>الرب يسوع المسيح (روما)</h3><p>من القرن الثالث إلى الخامس. سراديب الموتى (الكاتاكومب) لجينيروسا [7]</p><img src="https://res.bibleox.com/s/img/image/simple/674f2408dba77200011c739c/s_p_zVliPTIYBpqqnTGQ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f2408dba77200011c739c/m_p_zVliPTIYBpqqnTGQ.jpg">تكبير</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6931a55a205184ec278d6faf/s_p_xXRXPudiFDi6GltL.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931a55a205184ec278d6faf/m_p_xXRXPudiFDi6GltL.jpg">تكبير</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686bf5b25f47da2505d3ae36/m_p_Io7kaT9uNdBPFcSj.jpg">نسخة 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a5b6205184ec278d6fb0/m_p_btFyqkRBFzGf0FSH.jpg">نسخة 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a5e4205184ec278d6fb1/m_p_wuVaj4ghYuk6s5cc.jpg">نسخة 4</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a5fe205184ec278d6fb2/m_p_mO6KaZXywWX76vBg.jpg">نسخة 5</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a656205184ec278d6fb3/m_p_eqLfG1BFyG45i90X.jpg">نسخة 6</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a858205184ec278d6fb5/m_p_EVVCP1plDQZ4XgAS.jpg">نسخة 7</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6931a360205184ec278d6fab/s_p_hObpAcapDVZvLsC1.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931a360205184ec278d6fab/m_p_hObpAcapDVZvLsC1.jpg">تكبير</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6931a369205184ec278d6fad/s_p_8bP3aXtUgkNcP9gz.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931a369205184ec278d6fad/m_p_8bP3aXtUgkNcP9gz.jpg">تكبير</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6931a363205184ec278d6fac/s_p_BcSN3IXA4JYFLpgA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931a363205184ec278d6fac/m_p_BcSN3IXA4JYFLpgA.jpg">تكبير</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6931a36f205184ec278d6fae/s_p_6J6vSMM0TM5tc59T.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931a36f205184ec278d6fae/m_p_6J6vSMM0TM5tc59T.jpg">تكبير</a>]</p><h3>القديسان بياتريتشي وسيمبليتشيو (أو روفو) (روما)</h3><p>من القرن الثالث إلى الخامس. سراديب الموتى (الكاتاكومب) لجينيروسا [7]</p><img src="https://res.bibleox.com/s/img/image/simple/66cc2c40dba77200019bc7d8/s_p_zABjPHGhPdjGVh3U.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/66cc2c40dba77200019bc7d8/m_p_zABjPHGhPdjGVh3U.jpg">تكبير</a>]</p><h3>الرسولان بطرس وبولس (روما)</h3><p>نحو 380 م. سراديب الموتى (الكاتاكومب) سانتا تكلا (القديسة تكلا)، جدارية [24]</p><p>تظهر في الصورة الرسل: بطرس وبولس وأندراوس ويوحنا.</p><img src="https://res.bibleox.com/s/img/image/simple/686bf38e5f47da2505d3ae35/s_p_BxfiObhkLMfci8nP.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686bf38e5f47da2505d3ae35/m_p_BxfiObhkLMfci8nP.jpg">تكبير</a>] [<a href="https://res.bibleox.com/s/img/image/simple/687291145f47da2505d3ae8b/m_p_WXlkaMJTOrIzlOdI.jpg">نسخة 2</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/68b6cd4802e89ba22dfc3977/s_p_kAWGH2VPHMkRv9cL.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b6cd4802e89ba22dfc3977/m_p_kAWGH2VPHMkRv9cL.jpg">تكبير</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686bf5bf5f47da2505d3ae37/m_p_F0tsoqA9bv6CrpfE.jpg">نسخة 2</a>]</p><h3>الرسولان بطرس وبولس (بيزنطة)</h3><p>منتصف القرن الرابع. المسيح يمنح الرسولين بطرس وبولس أكاليل الشهداء. <a href="https://www.metmuseum.org/art/collection/search/463547">متحف المتروبوليتان في الجادة الخامسة، الولايات المتحدة</a>. روما أو بيزنطة. 13.8 x 12.5 x 5 سم.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5f5d745c75323d28a5ebc/s_p_MiCffui3hayo2BCt.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5f5d745c75323d28a5ebc/m_p_MiCffui3hayo2BCt.jpg">تكبير</a>]</p><hr><p>منتصف القرن الرابع. <a href="https://www.metmuseum.org/art/collection/search/468386">متحف المتروبوليتان في الجادة الخامسة، الولايات المتحدة</a>. روما أو بيزنطة. 8.5 x 14 x 13.3 سم.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5e89c45c75323d28a5ea1/s_p_HAfNPGdEHMp67CuN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5e89c45c75323d28a5ea1/m_p_HAfNPGdEHMp67CuN.jpg">تكبير</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5e88f45c75323d28a5ea0/m_p_gvro4Ry9POJUm0nR.jpg">منظر جانبي</a>]</p><hr><p>أواخر القرن الرابع. <a href="https://www.metmuseum.org/art/collection/search/463714">متحف المتروبوليتان في الجادة الخامسة، الولايات المتحدة</a>. زجاج، ذهب رقّي.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5e68b45c75323d28a5e9c/s_p_uRLyImBPPDsr48G2.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5e68b45c75323d28a5e9c/m_p_uRLyImBPPDsr48G2.jpg">تكبير</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5e76d45c75323d28a5e9e/m_p_62cHpid14wgeSyqc.jpg">نسخة 2</a>]</p><hr><p>منتصف القرن الرابع. الرسولان بطرس وبولس، بيريغرينا. <a href="https://www.metmuseum.org/art/collection/search/465922">متحف المتروبوليتان في الجادة الخامسة، الولايات المتحدة</a>. 11.5 x 13.3 x 1.2 سم.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5e7d145c75323d28a5e9f/s_p_atDwcEc3h2ZyYLRb.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5e7d145c75323d28a5e9f/m_p_atDwcEc3h2ZyYLRb.jpg">تكبير</a>]</p><h3>الرسولان بطرس وبولس (روما)</h3><p>القرن الرابع. لوح حجري كان يُستخدم لإغلاق كوّة (loculus) مدفن طفل في سراديب الموتى (الكاتاكومب). روما، المتاحف الفاتيكانية، متحف بيوس المسيحي.</p><img src="https://res.bibleox.com/s/img/image/simple/674f1bc0dba77200011c739a/s_p_uH3btIsNTUn6lHGQ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f1bc0dba77200011c739a/m_p_uH3btIsNTUn6lHGQ.jpg">تكبير</a>]</p><h3>والدة الإله مع الطفل المسيح (روما)</h3><p>القرنان الثالث والرابع. سراديب الموتى (الكاتاكومب) لدوميتيلا.</p><img src="https://res.bibleox.com/s/img/image/simple/66cc2c11dba77200019bc7d5/s_p_rZQc8oqW4YIrUMho.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/66cc2c11dba77200019bc7d5/m_p_rZQc8oqW4YIrUMho.jpg">تكبير</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686d246b5f47da2505d3ae57/m_p_AZTFv8hTAm4Eo9yp.jpg">نسخة 2</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686d24885f47da2505d3ae58/s_p_Z1QqJZuraUn8iLSV.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d24885f47da2505d3ae58/m_p_Z1QqJZuraUn8iLSV.jpg">تكبير</a>]</p><h3>صليب عليه صورة المسيح (بيزنطة)</h3><p>395-641 م. <a href="https://collections.louvre.fr/en/ark:/53355/cl010043937">متحف اللوفر، فرنسا</a>. 8,5 x 20 x 1,2 سم.</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c5886594f46d35a87ec7/s_p_wU3HuTavyFqHCHIc.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c5886594f46d35a87ec7/m_p_wU3HuTavyFqHCHIc.jpg">تكبير</a>]</p><h3>أيقونة (مصر)</h3><p>395-641 م. <a href="https://collections.louvre.fr/en/ark:/53355/cl010049211">متحف اللوفر، فرنسا</a>. 24 x 17,5 سم</p><img src="https://res.bibleox.com/s/img/image/simple/68c3bf006594f46d35a87ebf/s_p_m1O6PHgeoR9L2huf.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3bf006594f46d35a87ebf/m_p_m1O6PHgeoR9L2huf.jpg">تكبير</a>]</p><hr><p><a href="https://collections.louvre.fr/en/ark:/53355/cl010049209">متحف اللوفر، فرنسا</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c8966594f46d35a87ec8/s_p_hfH86ZqQDaRWHKRA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c8966594f46d35a87ec8/m_p_hfH86ZqQDaRWHKRA.jpg">تكبير</a>]</p><h3>أمبولة عليها أيقونة القديس مينا (بيزنطة)</h3><p>395-641 م. <a href="https://collections.louvre.fr/en/ark:/53355/cl010042774">متحف اللوفر، فرنسا</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c4176594f46d35a87ec3/s_p_RYRsljTrixb3giuP.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c4176594f46d35a87ec3/m_p_RYRsljTrixb3giuP.jpg">تكبير</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c3c4196594f46d35a87ec4/m_p_20KqaRLqoxUISfqB.jpg">الوجه الخلفي</a>]</p><hr><p>395-641 م. <a href="https://collections.louvre.fr/en/ark:/53355/cl010042778">متحف اللوفر، فرنسا</a>. توجد أمبولات مماثلة بأعداد كبيرة جدًّا في متاحف مختلفة. ومن الأمثلة الأخرى: <a href="https://collections.louvre.fr/en/ark:/53355/cl010042780">1</a>، <a href="https://collections.louvre.fr/en/ark:/53355/cl010042798">2</a>، <a href="https://collections.louvre.fr/en/ark:/53355/cl010042802">3</a>، <a href="https://collections.louvre.fr/en/ark:/53355/cl010043779">4</a>، <a href="https://collections.louvre.fr/en/ark:/53355/cl010076645">5</a>، <a href="https://collections.louvre.fr/en/ark:/53355/cl010051239">6</a>، <a href="https://collections.louvre.fr/en/ark:/53355/cl010263188">7</a>، <a href="https://collections.louvre.fr/en/ark:/53355/cl010280896">8</a>، <a href="https://collections.louvre.fr/en/ark:/53355/cl010044285">9</a>، <a href="https://collections.louvre.fr/en/ark:/53355/cl010280846">10</a>، <a href="https://collections.louvre.fr/en/ark:/53355/cl010280894">11</a>، <a href="https://www.clevelandart.org/art/1999.232">12</a>، <a href="https://www.clevelandart.org/art/1999.233">13</a>، <a href="https://www.clevelandart.org/art/1999.231">14</a>، <a href="https://www.clevelandart.org/art/1999.230">15</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c4c66594f46d35a87ec5/s_p_b5etRE60QJjNF7zQ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c4c66594f46d35a87ec5/m_p_b5etRE60QJjNF7zQ.jpg">تكبير</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c4cd6594f46d35a87ec6/s_p_vJbng6ICUUefTimC.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c4cd6594f46d35a87ec6/m_p_vJbng6ICUUefTimC.jpg">تكبير</a>]</p><h3>أمبولة من الرصاص عليها صورة والدة الإله والمسيح (إيطاليا، بولونيا)</h3><p>القرنان الرابع والخامس. «كانت أمبولات مماثلة تحوي زيتًا مقدّسًا من الأماكن المقدّسة تُجلب بأعداد كبيرة على يد الحجّاج من الشرق، وتحديدًا من فلسطين، التي انتظمت الحجّاج إليها منذ أواخر القرن الرابع وفي النصف الأول من القرن الخامس بأعداد كبيرة» [27]</p><img src="https://res.bibleox.com/s/img/image/simple/686d3bdc5f47da2505d3ae5f/s_p_gcwh26YTfBvz5FbR.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d3bdc5f47da2505d3ae5f/m_p_gcwh26YTfBvz5FbR.jpg">تكبير</a>]</p><h2>القرن الخامس</h2><h3>والدة الإله مع الطفل يسوع، والشهيدان فيليكس وأداوكتوس، والأرملة كوموديلا (روما)</h3><p>القرنان الخامس والسادس. سراديب الموتى (الكاتاكومب) لكوموديلا. على اليسار في المقدّمة تظهر الأرملة كوموديلا — سيدة رومانية ثرية، بُنيت الكنيسة الكاتاكومبية في ذكراها.</p><img src="https://res.bibleox.com/s/img/image/simple/674edb84dba77200011c738c/s_p_urBcFMzNnn49NanW.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674edb84dba77200011c738c/m_p_urBcFMzNnn49NanW.jpg">تكبير</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686bf61f5f47da2505d3ae38/m_p_gOZdkzGPGcL4Vws0.jpg">نسخة 2</a>]</p><h3>المسيح ووالدة الإله (بيزنطة)</h3><p>400-500 م. المادة: ذهب. 3,7 x 4 x 0,3 سم؛ الوزن: 4,04 غ. <a href="https://collections.louvre.fr/en/ark:/53355/cl010256498">متحف اللوفر، فرنسا</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c403846594f46d35a87efb/s_p_Ahj64DxPe313azhi.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c403846594f46d35a87efb/m_p_Ahj64DxPe313azhi.jpg">تكبير</a>]</p><h3>الشهيد لورنسيوس (رافينا)</h3><p>سنة 425. ضريح غالا بلاسيديا[1][2][25]. في الخزانة المفتوحة أربعة أناجيل: إنجيل مرقس ومتى ولوقا ويوحنا. والقديس، حاملًا صليبًا وإنجيلًا مفتوحًا، يسير نحو الشبكة الحديدية المشتعلة تحتها النار.</p><img src="https://res.bibleox.com/s/img/image/simple/674ee461dba77200011c738e/s_p_EPEyZAtXMtLhz0vO.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674ee461dba77200011c738e/m_p_EPEyZAtXMtLhz0vO.jpg">تكبير</a>]</p><h3>الرسول بولس (أفسس)</h3><p>جدارية من أواخر القرن الخامس في كهف بولس[4].</p><img src="https://res.bibleox.com/s/img/image/simple/674f2a67dba77200011c73a0/s_p_Og6LudyAS5axVwrH.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f2a67dba77200011c73a0/m_p_Og6LudyAS5axVwrH.jpg">تكبير</a>]</p><h3>الرسول بولس (نابولي)</h3><p>أواخر القرن الخامس. سراديب الموتى (الكاتاكومب) سان جينارو، جدارية. يظهر في الصورة على الأرجح الرسول بولس.</p><img src="https://res.bibleox.com/s/img/image/simple/674f2705dba77200011c739d/s_p_XdEMnSngRpC4ver8.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f2705dba77200011c739d/m_p_XdEMnSngRpC4ver8.jpg">تكبير</a>]</p><h3>تكلا الإيقونية، شهيدة (أفسس)</h3><p>كهف القديسين بولس وتكلا. وهي إحدى اللواتي آمنّ بكرازة الرسول بولس، وشهيدة القرون الأولى. في سنة 2013 دُنِّس الكهف على يد مسلّحين إسلاميّين[4].</p><img src="https://res.bibleox.com/s/img/image/simple/674f2c2edba77200011c73a1/s_p_tCvOXPpRP5ogjE1Y.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f2c2edba77200011c73a1/m_p_tCvOXPpRP5ogjE1Y.jpg">تكبير</a>]</p><h3>الشهيد العظيم ديمتريوس التسالونيكي والملاك (سالونيك، بيزنطة)</h3><p>القرنان الخامس والسادس. بازيليكا القديس ديمتريوس في سالونيك. فسيفساء في الجزء الغربي من الكنيسة [10]</p><img src="https://res.bibleox.com/s/img/image/simple/686984705f47da2505d3ae11/s_p_bliIzjPrQcGjWmMT.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686984705f47da2505d3ae11/m_p_bliIzjPrQcGjWmMT.jpg">تكبير</a>]</p><h3>الشهيد العظيم ديمتريوس التسالونيكي والطفل (سالونيك، بيزنطة)</h3><p>القرنان الخامس والسادس. بازيليكا القديس ديمتريوس في سالونيك. فسيفساء على الجدار الغربي للصحن الجنوبي [10]</p><img src="https://res.bibleox.com/s/img/image/simple/68697c845f47da2505d3ae10/s_p_T8JYB6OgB0WUM8O6.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68697c845f47da2505d3ae10/m_p_T8JYB6OgB0WUM8O6.jpg">تكبير</a>]</p><h3>بيت السناتور، سانتا بودنتسيانا (روما)</h3><p>402-417 م. [13][14]</p><img src="https://res.bibleox.com/s/img/image/simple/6869938e5f47da2505d3ae1c/s_p_l5Dokt3jzLvx6IxN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6869938e5f47da2505d3ae1c/m_p_l5Dokt3jzLvx6IxN.jpg">تكبير</a>]</p><h3>سانتا ماريا ماجوري (روما)</h3><p>432-440 م. [15][16]</p><img src="https://res.bibleox.com/s/img/image/simple/6869954e5f47da2505d3ae1d/s_p_0bDTRtbRpWWnfPQR.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6869954e5f47da2505d3ae1d/m_p_0bDTRtbRpWWnfPQR.jpg">تكبير</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686995555f47da2505d3ae1e/s_p_FLcJtADykEgKNDDd.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686995555f47da2505d3ae1e/m_p_FLcJtADykEgKNDDd.jpg">تكبير</a>]</p><h3>المسيح، الفتية الثلاثة، المجوس (شمال إيطاليا)</h3><p>400-450 م. <a href="https://collections.louvre.fr/en/ark:/53355/cl010256191">متحف اللوفر، فرنسا</a>. فضة، 6,3 x 12,3 x 7,1 سم.</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c1756594f46d35a87ec1/s_p_WzOTF3me39ISTfnN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c1756594f46d35a87ec1/m_p_WzOTF3me39ISTfnN.jpg">تكبير</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c1796594f46d35a87ec2/s_p_a0udZW5EPewQCqsl.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c1796594f46d35a87ec2/m_p_a0udZW5EPewQCqsl.jpg">تكبير</a>]</p><h3>أيقونة، الرسول بطرس يملي الإنجيل على القديس مرقس (مصر)</h3><p>440-670 م. <a href="https://www.metmuseum.org/art/collection/search/477163">متحف المتروبوليتان في الجادة الخامسة، الولايات المتحدة</a>. 13.5 x 10 x 0.8 سم. انظر أيضًا: <a href="https://www.metmuseum.org/art/collection/search/477492">1</a>، <a href="https://www.metmuseum.org/art/collection/search/477487">2</a>، <a href="https://www.metmuseum.org/art/collection/search/477481">3</a>، <a href="https://www.metmuseum.org/art/collection/search/477489">4</a>، <a href="https://www.metmuseum.org/art/collection/search/477491">5</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c1c2f56594f46d35a87e74/s_p_BWhcee0cn10mz7dc.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1c2f56594f46d35a87e74/m_p_BWhcee0cn10mz7dc.jpg">تكبير</a>]</p><h3>قديس غير معروف (بيزنطة، مصر)</h3><p>القرنان الخامس والسادس. <a href="https://www.metmuseum.org/art/collection/search/329982">متحف المتروبوليتان في الجادة الخامسة، الولايات المتحدة</a>. 44 × 32.5 سم.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5eb2d45c75323d28a5ea3/s_p_E5UUO66hSfRBtXUn.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5eb2d45c75323d28a5ea3/m_p_E5UUO66hSfRBtXUn.jpg">تكبير</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5eb2845c75323d28a5ea2/m_p_ofbMCUTa1winWDg0.jpg">نسخة 2</a>]</p><h3>أمبولة عليها صورة القديس مينا (مصر القبطية)</h3><p>القرون الخامس إلى السابع. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/87092?query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=34">متحف الإرميتاج، روسيا</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c0796480b4d285320413/s_p_sW3adkK7lr960dU5.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c0796480b4d285320413/m_p_sW3adkK7lr960dU5.jpg">تكبير</a>]</p><hr><p>القرنان الخامس والسادس. أمبولة عليها صورة القديس مينا (مصر). <a href="https://www.metmuseum.org/art/collection/search/854993">متحف المتروبوليتان في الجادة الخامسة، الولايات المتحدة</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5f3f845c75323d28a5eb8/s_p_ePhTgphiYrxHdEaZ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5f3f845c75323d28a5eb8/m_p_ePhTgphiYrxHdEaZ.jpg">تكبير</a>]</p><hr><p>القرنان الخامس والسادس. أمبولة عليها صورة القديس مينا (مصر). <a href="https://www.metmuseum.org/art/collection/search/854994">متحف المتروبوليتان في الجادة الخامسة، الولايات المتحدة</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5f40645c75323d28a5eb9/s_p_5HMBehehtBuCUdOm.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5f40645c75323d28a5eb9/m_p_5HMBehehtBuCUdOm.jpg">تكبير</a>]</p><h3>خاتم عليه صورة المسيح (مصر، الأقصر)</h3><p>القرون الخامس إلى السابع. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/111849?page=5&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%B0&amp;index=240">متحف الإرميتاج، روسيا</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c4d46480b4d285320420/s_p_SyuBoqgvHXMA5UIe.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c4d46480b4d285320420/m_p_SyuBoqgvHXMA5UIe.jpg">تكبير</a>]</p><h2>القرن السادس</h2><h3>الرب يسوع المسيح (سيناء)</h3><p>القرن السادس. دير القديسة كاترين، مصر [3].</p><img src="https://res.bibleox.com/s/img/image/simple/686fe7935f47da2505d3ae87/s_p_cikLnQnMeZgiaeXg.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686fe7935f47da2505d3ae87/m_p_cikLnQnMeZgiaeXg.jpg">تكبير</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6872d4935f47da2505d3ae90/m_p_1CbtDgulMkyLj9dK.jpg">نسخة 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6872d4835f47da2505d3ae8d/m_p_IPypUclQUGcqTIJa.jpg">نسخة 3</a>]</p><h3>والدة الإله مع الطفل يسوع، والقديسان ثيودوروس وجاورجيوس (سيناء)</h3><p>القرن السادس. دير القديسة كاترين، أيقونة بالرسم الشمعي (إنكوستيك)، مصر.</p><img src="https://res.bibleox.com/s/img/image/simple/674ece56dba77200011c7384/s_p_RWNQK8qhzLwXxGkf.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674ece56dba77200011c7384/m_p_RWNQK8qhzLwXxGkf.jpg">تكبير</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6872d4895f47da2505d3ae8e/m_p_6JgREZVUzpO8lC9E.jpg">نسخة 2</a>]</p><h3>الرسول بطرس (سيناء)</h3><p>القرن السادس. دير القديسة كاترين، أيقونة بالرسم الشمعي (إنكوستيك)، مصر.</p><img src="https://res.bibleox.com/s/img/image/simple/686fe28f5f47da2505d3ae82/s_p_tWJyRADNEjI9Gt5J.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686fe28f5f47da2505d3ae82/m_p_tWJyRADNEjI9Gt5J.jpg">تكبير</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686fe73d5f47da2505d3ae86/m_p_ztqtzVnOwMfzjCsd.jpg">نسخة 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6872d48f5f47da2505d3ae8f/m_p_x4BAyJ0C1GjHQ7Us.jpg">نسخة 3</a>]</p><h3>والدة الإله والطفل الإلهي المسيح (بيزنطة)</h3><p>القرن السادس. <a href="https://www.metmuseum.org/art/collection/search/463392">متحف المتروبوليتان في الجادة الخامسة، الولايات المتحدة</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5fce645c75323d28a5ec5/s_p_KB8coyb4H50zurQW.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5fce645c75323d28a5ec5/m_p_KB8coyb4H50zurQW.jpg">تكبير</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5fce945c75323d28a5ec6/m_p_eIaeevwinjFBQAeA.jpg">نسخة 2</a>]</p><h3>خاتم عليه أيقونة والدة الإله والطفل الإلهي المسيح (بيزنطة)</h3><p>القرنان السادس والسابع. <a href="https://www.metmuseum.org/art/collection/search/464059">متحف المتروبوليتان في الجادة الخامسة، الولايات المتحدة</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5fe7745c75323d28a5ec7/s_p_bcCSRfNkRmmk5jZs.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5fe7745c75323d28a5ec7/m_p_bcCSRfNkRmmk5jZs.jpg">تكبير</a>]</p><h3>القديسة مريم</h3><p>611 م.، <a href="https://www.pravenc.ru/text/164537.html">جرش</a></p><img src="https://res.bibleox.com/s/img/image/simple/482/s_p_s3flMTpYpn69iMIy.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/482/m_p_s3flMTpYpn69iMIy.jpg">تكبير</a>]</p><h3>المسيح، ميدالية (أنطاكية)</h3><p>500-625 م. المادة: فضة مذهّبة. 14,9 x 14,1 x 1,1 سم. <a href="https://collections.louvre.fr/en/ark:/53355/cl010256496">متحف اللوفر، فرنسا</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c409da6594f46d35a87f00/s_p_BHIOy3tEZ3ZoMEr5.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c409da6594f46d35a87f00/m_p_BHIOy3tEZ3ZoMEr5.jpg">تكبير</a>]</p><hr><p>500-625 م. <a href="https://collections.louvre.fr/en/ark:/53355/cl010256495">متحف اللوفر، فرنسا</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c41f626594f46d35a87f05/s_p_bKgaW542SgyD11o9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c41f626594f46d35a87f05/m_p_bKgaW542SgyD11o9.jpg">تكبير</a>]</p><h3>نسيج جداري (غوبلان) عليه أيقونات: المسيح، ووالدة الإله، ورئيسا الملائكة ميخائيل وجبرائيل، والرسل (مصر، بيزنطة)</h3><p>سنة 500. <a href="https://www.clevelandart.org/art/1967.144">متحف كليفلاند للفنون، الولايات المتحدة</a>. صوف، 178,7 x 110,5 سم.</p><p>تعليق المتحف:</p><blockquote><p>هذا النسيج النادر، المنسوج من خيوط صوفية بأكثر من عشرين لونًا، كان في زمانه أعلى ثمنًا من لوحة مرسومة. وقد عكست قيمته التاريخية تقدير معاصريه للامتزاج البارع للألوان الذي بلغه النسّاجون. و<strong>هذه الأيقونة المنسوجة المعلّقة على الحائط كانت تتيح للمؤمنين إكرام والدة الإله والطفل المسيح داخل جدران كنيسة أرثوذكسية</strong>. ويحيط بهما ملائكة ورسل بأسماء مكتوبة باليونانية. ولكي تكون الأيقونة (الصورة المقدّسة) فعّالة روحيًّا، يجب أن تتبع بأقصى دقّة ممكنة التقليد التصويري المستقر لصورتها.</p><p>النقش على العتبة في الإطار المعماري يُترجم عن اليونانية بـ «<strong>القديس ميخائيل، القديسة مريم، القديس جبرائيل</strong>». وتُزيَّن الحافة العريضة ذات الأوراق بالفواكه والأزهار، وفي الجزء السفلي منها ميداليات تحمل تماثيل أنصاف الرسل، وأسماؤهم مكتوبة إلى جانبها باليونانية وتُترجم بـ «<strong>أندراوس، متى، الرسول بولس، لوقا، يعقوب، فيلبس، مرقس، توما، يوحنا، متياس، بطرس وبرثولماوس</strong>».</p></blockquote><img src="https://res.bibleox.com/s/img/image/simple/68cb9dd5205184ec278d58d7/s_p_jXuLxO8mwNy5DicO.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68cb9dd5205184ec278d58d7/m_p_jXuLxO8mwNy5DicO.jpg">تكبير</a>]</p><h3>نسيج جداري (غوبلان) عليه أيقونات. الفتية الثلاثة؟، خريزما (مونوغرام المسيح) (مصر، بيزنطة)</h3><p>سنوات الخمس مئة. <a href="https://www.clevelandart.org/art/1982.73">متحف كليفلاند للفنون، الولايات المتحدة</a>. صوف، كتّان. 110,5 x 76,8 سم.</p><img src="https://res.bibleox.com/s/img/image/simple/68cb9dde205184ec278d58d8/s_p_w5vxLEtZSz6mW36r.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68cb9dde205184ec278d58d8/m_p_w5vxLEtZSz6mW36r.jpg">تكبير</a>]</p><h3>نسيج جداري (غوبلان) عليه أيقونات. والدة الإله، المجوس، النبي يونان (مصر، بيزنطة)</h3><p>500-550 م. <a href="https://www.clevelandart.org/art/1951.400">متحف كليفلاند للفنون، الولايات المتحدة</a>. كتّان. 99,7 x 104,8 سم.</p><p>تعليق المتحف:</p><blockquote><p>… على اليسار في الشريط العلوي تظهر <strong>العذراء مريم مع الطفل المسيح</strong> جالسة على مقعد ذي قوائم صليبية الشكل. وكما تشير النقوش القبطية، <strong>يقترب ثلاثة ملوك من اليمين حاملين الهدايا</strong>. ويصوّر الشريط الأوسط على اليسار، على الأرجح، <strong>معمودية المسيح</strong>، بينما تبدو الشخصيات الثلاث الأخرى المفصولة بالأعمدة مصوِّرة لمعجزة من العهد الجديد، حيث أطعم المسيح جمعًا كبيرًا بخمسة أرغفة وسمكتين فقط. وفي الشريط السفلي لا يزال <strong>مشهد العهد القديم للنبي يونان وهو يبتلعه الحوت</strong> واضحًا للعيان.</p><p>تحدّد النقوش اليونانية مشاهد مختلفة من العهد القديم والعهد الجديد. وفوق أول المجوس في الشريط العلوي يمكن تمييز حرفين <strong>«XP»</strong> من الكلمة اليونانية التي تعني الذهب (<em>χρυσός - chrysós</em>). وعلى اليسار في الشريط الأوسط تظهر شخصيتان: الأولى مُتلفة بالكامل تقريبًا، والثانية مُعرَّفة بالنقش <strong>«EIΩANNHC» (يوحنا)</strong>. وفي الشريط السفلي صورة يونان وهو يُطرح على الشاطئ، وبجانبه سمكة كبيرة، ويصاحبها نقش <strong>«EIΩNAC» (يونان)</strong>. وأما موسى، المُتلف بالكامل تقريبًا، فلا يمكن تعريفه إلا بنقشه <strong>«MWCHC» (موسى)</strong>.</p></blockquote><img src="https://res.bibleox.com/s/img/image/simple/68cb9e0d205184ec278d58d9/s_p_WiTqygXUYCZZY7TF.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68cb9e0d205184ec278d58d9/m_p_WiTqygXUYCZZY7TF.jpg">تكبير</a>]</p><h3>كؤوس إفخارستية ومباخر عليها أيقونات (بيزنطة، سوريا، أتّاروتي)</h3><p>500-650 م. <a href="https://www.metmuseum.org/art/collection/search/474390">متحف المتروبوليتان في الجادة الخامسة، الولايات المتحدة</a>. فضة مذهّبة. على الكؤوس أيقونات للرب والقديسين، وكذلك نقوش تدلّ على مَن أهداها وإلى مَن أُهديت.</p><p>هذه الأدوات الليتورجية المصنوعة بإتقان — الكؤوس والمباخر والمصفاة وصورة حمامة الروح القدس — كانت تخصّ كنيسةً في مدينة أتّاروتي التجارية الغنية في سوريا، التي كانت آنذاك من أغنى أراضي الإمبراطورية البيزنطية. وكانت الكؤوس والمباخر والمصفاة تُستخدم أثناء القداس الإلهي، أي الإفخارستيا، وهو سرّ يتناول فيه المسيحيون الخبز والخمر المقدَّسين تذكارًا للعشاء السرّي وموت المسيح.</p><p>وبحسب النقوش عليها، المكتوبة باليونانية مع بعض الاختلافات الإملائية، فقد أهدى السكان المحليون كثيرًا من هذه الأدوات إلى الكنيسة الرئيسية في المدينة المكرّسة للقديس إستفانوس، وإلى الكنيسة الأصغر المكرّسة للقديس يوحنا (ولعلّه يوحنا السابق [المعمدان]).</p><p>في مطلع القرن السابع، سقطت سوريا أولًا تحت ضربات الفرس الساسانيين، ثم تحت ضربات جيوش الإسلام. ومن المرجّح أن هذه الأعمال الفنية دُفنت على عجل في وعاء واقٍ في اللحظة التي كان فيها الجيش البيزنطي يتراجع أمام المهاجمين للمنطقة.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5db2045c75323d28a5e9a/s_p_kx70rC7wWJQtkfdG.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5db2045c75323d28a5e9a/m_p_kx70rC7wWJQtkfdG.jpg">تكبير</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5edf045c75323d28a5ea5/m_p_Eru1rmuua6UWqjTz.jpg">نسخة 2</a>]</p><hr><p>يوحنا المعمدان ذو الشعر الطويل، ووالدة الإله في وضع الصلاة (برفع اليدين)، وقديس في وضع الصلاة، وقديس محارب بعصا وترس، والمسيح الشاب بهالة صليبية، وقديس محارب آخر في دروع يصرع التنين (القديس جاورجيوس؟)، تحت الأقواس. <a href="https://www.metmuseum.org/art/collection/search/466137">متحف المتروبوليتان في الجادة الخامسة، الولايات المتحدة</a>. 21.3 x 16 سم.</p><p>نقش باليونانية: «<strong>من أجل خلاصها قدّمت أودوكسيا [هذا] عطاءً للقديس إستفانوس في قرية أتّار[وتي]</strong>».</p><img src="https://res.bibleox.com/s/img/image/simple/68b5efa445c75323d28a5eaa/s_p_l5pPSsTDZHSQuvNU.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5efa445c75323d28a5eaa/m_p_l5pPSsTDZHSQuvNU.jpg">تكبير</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f01f45c75323d28a5eab/m_p_456sbKEe3ANd9ZWP.jpg">نسخة 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f02245c75323d28a5eac/m_p_fkJIydq7uEfZbIUt.jpg">نسخة 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f02445c75323d28a5ead/m_p_s25q6Lu5HItPjqDs.jpg">نسخة 4</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f02745c75323d28a5eae/m_p_QJsAgl2zRfYmpNDL.jpg">نسخة 5</a>]</p><hr><p>كأس إفخارستية تحمل أيقونة القديس يوحنا المعمدان، والقديس الشماس (الأرجح إستفانوس)، وأساقفة قديسين، وصيالب. <a href="https://www.metmuseum.org/art/collection/search/466130">متحف المتروبوليتان في الجادة الخامسة، الولايات المتحدة</a>. 20.5 × 15.1 سم، 369 غ، 1100 مل</p><p>نقش باليونانية: «<strong>للقديس يوحنا من قرية أتاروتيس</strong>».</p><img src="https://res.bibleox.com/s/img/image/simple/68b5ec4545c75323d28a5ea4/s_p_KWMPzINWo4ktBKQ7.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5ec4545c75323d28a5ea4/m_p_KWMPzINWo4ktBKQ7.jpg">تكبير</a>]</p><hr><p>كأس إفخارستية تحمل أيقونة المسيح ووالدة الإله ويوحنا المعمدان وجاورجيوس المنتصر. <a href="https://www.metmuseum.org/art/collection/search/466129">متحف المتروبوليتان في الجادة الخامسة، الولايات المتحدة</a>. 24,3 x 16,8 سم.</p><p>نقش باليونانية: «<strong>القديس إستفانوس من قرية أتّاروتا</strong>».</p><img src="https://res.bibleox.com/s/img/image/simple/68b5ee1345c75323d28a5ea6/s_p_9bHxlNSj26b5EhMw.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5ee1345c75323d28a5ea6/m_p_9bHxlNSj26b5EhMw.jpg">تكبير</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5ee3c45c75323d28a5ea7/m_p_8XweLe1b1pD7GWHb.jpg">نسخة 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5ee4045c75323d28a5ea8/m_p_faMKsJUImltU9s6v.jpg">نسخة 3</a>]</p><hr><p>كأس إفخارستية تحمل صورة المسيح الشاب بهالة صليبية، وقديس شماس بمبخرة (الأرجح القديس إستفانوس)، والعذراء مريم في وضع الصلاة، وقديس شاب بعصا. الحجم: 23.9 × 17 سم، 356 غ. <a href="https://www.metmuseum.org/art/collection/search/466141">متحف المتروبوليتان في الجادة الخامسة، الولايات المتحدة.</a></p><p>نقش باليونانية: «<strong>وفاءً بنذر ومن أجل خلاص مَن اسمه معروف عند الرب</strong>».</p><img src="https://res.bibleox.com/s/img/image/simple/68b5fa7a45c75323d28a5ebe/s_p_7AzZiy4FebkdJC4e.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5fa7a45c75323d28a5ebe/m_p_7AzZiy4FebkdJC4e.jpg">تكبير</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5fa8345c75323d28a5ebf/m_p_LQnRTCSFvxz7O7ui.jpg">نسخة 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5fa8645c75323d28a5ec0/m_p_KvY9o90gFdzJeK9N.jpg">نسخة 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5fa8945c75323d28a5ec1/m_p_BUzuFJ6F1fLtMppI.jpg">نسخة 4</a>]</p><hr><p>مبخرة تحمل صورة المسيح الشاب في هالة صليبية، والقديس يوحنا المعمدان، والعذراء مريم في وضع الصلاة، وقديس شماس (الأرجح القديس إستفانوس)، وصيالب. فضة وفضة مذهّبة مع بطانة من النحاس. الحجم: 41,5 x 13,2 x 12,6 سم. <a href="https://www.metmuseum.org/art/collection/search/466132">متحف المتروبوليتان في الجادة الخامسة، الولايات المتحدة</a>.</p><p>نقش باليونانية: «<strong>من أجل راحة نفس إرتا وإستفانوس، ابني كيرياكوس</strong>»</p><img src="https://res.bibleox.com/s/img/image/simple/68b5f15545c75323d28a5eaf/s_p_OJ2d0ec3h6BtKZQM.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5f15545c75323d28a5eaf/m_p_OJ2d0ec3h6BtKZQM.jpg">تكبير</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f15845c75323d28a5eb0/m_p_MLajjsEoJyZ7xPC7.jpg">نسخة 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f15c45c75323d28a5eb1/m_p_5k22minZ9Q7EruSj.jpg">نسخة 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f15e45c75323d28a5eb2/m_p_3cDRqzOwNAJr7A0S.jpg">نسخة 4</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f16145c75323d28a5eb3/m_p_8vKQQvQJKE8Mbtoc.jpg">نسخة 5</a>]</p><hr><p>مبخرة تحمل صورة المسيح الشاب في هالة صليبية، وملاكَيْن رئيسيَّيْن، وصيالب. 8.2 x 13.2 سم. <a href="https://www.metmuseum.org/art/collection/search/466131">متحف المتروبوليتان في الجادة الخامسة، الولايات المتحدة</a>.</p><p>نقش باليونانية: «<strong>للقديس يوحنا من قرية أتّاروتا</strong>».</p><img src="https://res.bibleox.com/s/img/image/simple/68b5f27545c75323d28a5eb4/s_p_brjJXh3ZIrplms0E.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5f27545c75323d28a5eb4/m_p_brjJXh3ZIrplms0E.jpg">تكبير</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f28545c75323d28a5eb5/m_p_oWtx1CexyxQIAxRK.jpg">نسخة 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f28845c75323d28a5eb6/m_p_zqvxcBdCxjLqltWh.jpg">نسخة 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f28c45c75323d28a5eb7/m_p_fIVExsqDAbrZLhWW.jpg">نسخة 4</a>]</p><h3>كؤوس إفخارستية تحمل صورة المسيح وقديسين، وصحن عليه صليب (سوريا، بيزنطية)</h3><p>500-700 م. متحف كليفلاند للفنون، الولايات المتحدة: <a href="https://www.clevelandart.org/art/1950.378">1</a>، <a href="https://www.clevelandart.org/art/1950.379">2</a>، <a href="https://www.clevelandart.org/art/1950.380">3</a>، <a href="https://www.clevelandart.org/art/1950.381">4</a>.</p><p>تشكّل هذه الأواني الليتورجية الأربعة من الفضة — صحن وثلاثة كؤوس (رقم الجرد 1950.378–81) — ما يُعرف اليوم بـ«كنز بيت ميسونا»، المسمّى على اسم قرية في شمال سوريا صُنعت هذه الأدوات من أجلها.</p><p>ومع أن المكان الدقيق وظروف اكتشاف الكنز غير معروفة، فإن سكان قرية بيت ميسونا، مثلهم مثل سائر الجماعات المسيحية في سوريا وفلسطين، أُرغموا على الأرجح على دفن فضة الكنيسة كي يخفوها عن الفرس أو العرب الذين فتحوا أراضيهم في النصف الأول من القرن السابع.</p><p>الصحن الذي كانت توضع عليه الجزيئات الإفخارستية أثناء القداس الإلهي مزيّن بصليب لاتيني محفور تحيط به نقشة إهداء. ويُذكر فيها المتبرّع بالصحن — دومنوس — ومكانه الأصلي — كنيسة القديس سرجيوس في بيت ميسونا.</p><p>للكؤوس أجران واسعة مزيّنة بصور نصفية للمسيح ووالدة الإله والرسولين بطرس وبولس. وعلى أحد الكؤوس نقش إهداء يحمل اسم المتبرّع — كيرياكوس بن دومنوس — واسم كاهن الكنيسة الذي تلقّى هذه التقدمة التقية — زينون.</p><p>نقش باليونانية: «<strong>+ الكاهن كيرياكوس، ابن دومنوس، (قدّم هذا الكأس) للقديس سرجيوس في أيام الكاهن زينون</strong>»</p><img src="https://res.bibleox.com/s/img/image/simple/68caa03c205184ec278d5880/s_p_SB8idWRkPX7keKkU.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68caa03c205184ec278d5880/m_p_SB8idWRkPX7keKkU.jpg">المسيح</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68caa026205184ec278d587d/m_p_sYIDwGwUI9iMAzzD.jpg">والدة الإله</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68caa029205184ec278d587e/m_p_xYnPNjrcxGm5mJgl.jpg">الرسول</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68caa02c205184ec278d587f/m_p_kH9idfsikXyvAVvy.jpg">الرسول</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68caa0d4205184ec278d5881/m_p_vWERSBBMAoytSNnX.jpg">منظر من الأعلى</a>]</p><hr><img src="https://res.bibleox.com/s/img/image/simple/68ca9cd5205184ec278d5874/s_p_tH0J7uqAriM7uaeK.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68ca9cd5205184ec278d5874/m_p_tH0J7uqAriM7uaeK.jpg">المسيح</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68ca9d13205184ec278d5878/m_p_tYRbn15h6MPNUilS.jpg">والدة الإله</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68ca9ce8205184ec278d5875/m_p_FKfoi68UXlWCS5ky.jpg">الرسول</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68ca9ceb205184ec278d5876/m_p_Zp9CJ61HnBcr8Csr.jpg">الرسول</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68ca9cee205184ec278d5877/m_p_w2JDvDj5c4pMVcfk.jpg">منظر من الأعلى</a>]</p><hr><img src="https://res.bibleox.com/s/img/image/simple/68ca9e94205184ec278d5879/s_p_27LzQUQDD3A7nI9X.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68ca9e94205184ec278d5879/m_p_27LzQUQDD3A7nI9X.jpg">المسيح</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68ca9e98205184ec278d587a/m_p_R47Eqr4GrHijUSIb.jpg">والدة الإله</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68ca9e9b205184ec278d587b/m_p_31NEBZQIYBEqOut0.jpg">الرسول</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68ca9e9e205184ec278d587c/m_p_QxtJHMZORGGwFxYQ.jpg">الرسول</a>]</p><hr><p>نحو 500 م. صحن. <a href="https://www.clevelandart.org/art/1950.381">متحف كليفلاند للفنون، الولايات المتحدة</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68ca964d205184ec278d5873/s_p_wNDEaPHmGHiuWeZy.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68ca964d205184ec278d5873/m_p_wNDEaPHmGHiuWeZy.jpg">تكبير</a>]</p><h3>مبخرة. معمودية الرب يسوع المسيح وصلبه (بيزنطية)</h3><p>500-899 م. الأبعاد: 13,4 × 9 سم. <a href="https://collections.louvre.fr/en/ark:/53355/cl010042067">متحف اللوفر، فرنسا</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c4068e6594f46d35a87efe/s_p_3kaCIWMTmQfT4NFG.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c4068e6594f46d35a87efe/m_p_3kaCIWMTmQfT4NFG.jpg">تكبير</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/68c4061f6594f46d35a87efc/s_p_XNlsrfQ2MOphupt9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c4061f6594f46d35a87efc/m_p_XNlsrfQ2MOphupt9.jpg">تكبير</a>]</p><h3>إناء. المسيح ووالدة الإله ويوحنا المعمدان والرسل والملائكة (القسطنطينية)</h3><img src="https://res.bibleox.com/s/img/image/simple/68c420e46594f46d35a87f06/s_p_iADN1OW5uYg5Wovc.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c420e46594f46d35a87f06/m_p_iADN1OW5uYg5Wovc.jpg">تكبير</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c420e76594f46d35a87f07/m_p_oAs6ecjPj32iGMce.jpg">الوجه الخلفي</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c421216594f46d35a87f0f/m_p_x6q5apwWB0DZirK2.jpg">المسيح</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c420fc6594f46d35a87f0b/m_p_sL17qrWgxkRCNRBb.jpg">والدة الإله</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c420ea6594f46d35a87f08/m_p_Cb0UJi1oxoKCQaXw.jpg">يوحنا المعمدان</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c421016594f46d35a87f0c/m_p_a9Y1fyPNxcQ4oNbq.jpg">ملاك</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c420f66594f46d35a87f0a/m_p_nAqhqDbP5x8fRAnj.jpg">ملاك</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c420ef6594f46d35a87f09/m_p_F9R3iyZ8go0PxARb.jpg">رسول</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c4210a6594f46d35a87f0e/m_p_97cyzUvq95UJZOrR.jpg">رسول</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c421056594f46d35a87f0d/m_p_WfK6SdjAqAOW9fDK.jpg">رسول</a>]</p><h3>صليب صدري بأيقونة (بيزنطية)</h3><p>القرن السادس.<strong> </strong>ذهب وعجينة وبلور صخري وزجاج؛ سكّ بالقالب وتزيين بالحبيبات. طول السلسلة: 33 سم؛ الصليب: 4.9 x 3.8 سم. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/227027?page=46&amp;query=%D0%BA%D1%80%D0%B5%D1%81%D1%82&amp;sort=112&amp;index=2288">متحف الأرميتاج، روسيا</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c11e3c6594f46d35a87e2c/s_p_9GZmzTSaUVuXXaX1.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c11e3c6594f46d35a87e2c/m_p_9GZmzTSaUVuXXaX1.jpg">تكبير</a>]</p><h3>دلاية. صلب المسيح (مصر)</h3><p>500-700 م. الأبعاد: 3,3 × 1,9 سم. <a href="https://collections.louvre.fr/en/ark:/53355/cl010102800">متحف اللوفر، فرنسا</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c41c4e6594f46d35a87f03/s_p_tiaBwT9vqOXIlsIw.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c41c4e6594f46d35a87f03/m_p_tiaBwT9vqOXIlsIw.jpg">تكبير</a>]</p><h3>أيقونة قديسين (بيزنطية)</h3><p>القرن السادس؛ 25.5 x 22 x 1.3 سم. ربما كانت هذه صورة الإنجيليَّين متى ويوحنا. <a href="https://www.metmuseum.org/art/collection/search/468198">متحف المتروبوليتان في الجادة الخامسة، الولايات المتحدة</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5fc1545c75323d28a5ec3/s_p_a2FJmSgsGJRdELBq.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5fc1545c75323d28a5ec3/m_p_a2FJmSgsGJRdELBq.jpg">تكبير</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5fc1945c75323d28a5ec4/m_p_pcvRiRfRgBcuHJEA.jpg">نسخة 2</a>]</p><h3>أيقونات الرسولين بطرس وبولس (أنطاكية)</h3><p>550-600 م. الرسول بطرس. <a href="https://www.metmuseum.org/art/collection/search/468348">متحف المتروبوليتان في الجادة الخامسة، الولايات المتحدة</a>. فضة. 38.1 x 55.9 x 2.2 سم.</p><img src="https://res.bibleox.com/s/img/image/simple/68c1bfd36594f46d35a87e6f/s_p_WguE3h0pnnzXQXwt.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1bfd36594f46d35a87e6f/m_p_WguE3h0pnnzXQXwt.jpg">تكبير</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c1bfd56594f46d35a87e70/m_p_83EvKNt1mFSPspQw.jpg">تكبير أكبر</a>]</p><p>550-600 م. الرسول بولس. <a href="https://www.metmuseum.org/art/collection/search/468347">متحف المتروبوليتان في الجادة الخامسة، الولايات المتحدة</a>. فضة. 38.1 x 55.9 x 2.2 سم.</p><img src="https://res.bibleox.com/s/img/image/simple/68c1bfda6594f46d35a87e71/s_p_5Y11faCyEzohnydQ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1bfda6594f46d35a87e71/m_p_5Y11faCyEzohnydQ.jpg">تكبير</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c1bfdd6594f46d35a87e72/m_p_jGCYAnYdrt4tlXhd.jpg">تكبير أكبر</a>]</p><h3>أيقونة (سوريا؟، بيزنطية)</h3><p>نحو سنة 500. <a href="https://www.clevelandart.org/art/1941.57">متحف كليفلاند للفنون، الولايات المتحدة</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68caa8cd205184ec278d5883/s_p_qr7HPRgCtcCRwsvb.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68caa8cd205184ec278d5883/m_p_qr7HPRgCtcCRwsvb.jpg">تكبير</a>]</p><h3>صورة قديس محارب (مصر القبطية)</h3><p>القرنان السادس والسابع. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/180444?page=6&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=253">متحف الأرميتاج، روسيا</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c3c06480b4d28532041c/s_p_Rnquar8nZacdzqcP.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c3c06480b4d28532041c/m_p_Rnquar8nZacdzqcP.jpg">تكبير</a>]</p><h3>قارورة بأيقونة الرسول بولس (؟) والقديسة تكلا (مصر)</h3><p>500-700 م. <a href="https://collections.louvre.fr/en/ark:/53355/cl010280955">متحف اللوفر، فرنسا</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c4390d6594f46d35a87f15/s_p_Zxs1yv3Jg8oKfFHW.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c4390d6594f46d35a87f15/m_p_Zxs1yv3Jg8oKfFHW.jpg">تكبير</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/68c4390a6594f46d35a87f14/s_p_CPdXMrLBUE0satoH.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c4390a6594f46d35a87f14/m_p_CPdXMrLBUE0satoH.jpg">تكبير</a>]</p><h3>قارورة بأيقونة الرسول أندراوس (سميرنا)</h3><p>500-600 م. <a href="https://collections.louvre.fr/en/ark:/53355/cl010281050">متحف اللوفر، فرنسا</a>. 7 × 5 × 2,8 سم.</p><img src="https://res.bibleox.com/s/img/image/simple/68c437966594f46d35a87f13/s_p_dCGVNUwg3KWvs9zz.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c437966594f46d35a87f13/m_p_dCGVNUwg3KWvs9zz.jpg">تكبير</a>]</p><h3>قوارير بأيقونة القديس مينا</h3><p>610-650 م. قارورة تحمل صورة القديس مينا (مصر). <a href="https://www.metmuseum.org/art/collection/search/475416">متحف المتروبوليتان في الجادة الخامسة، الولايات المتحدة</a>. 8.5 x 6.9 x 1.8 سم.</p><img src="https://res.bibleox.com/s/img/image/simple/68c1c1396594f46d35a87e73/s_p_KIdJIYWMysre63rP.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1c1396594f46d35a87e73/m_p_KIdJIYWMysre63rP.jpg">تكبير</a>]</p><hr><p>500-750 م. <a href="https://collections.louvre.fr/en/ark:/53355/cl010044285">متحف اللوفر، فرنسا</a>. 13 × 10,6 × 3,4 سم.</p><img src="https://res.bibleox.com/s/img/image/simple/68c3bc556594f46d35a87ebd/s_p_iHBRxhobWKvQb2Dx.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3bc556594f46d35a87ebd/m_p_iHBRxhobWKvQb2Dx.jpg">تكبير</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/68c3bc5c6594f46d35a87ebe/s_p_fQ8Ps5eHBD1myJaS.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3bc5c6594f46d35a87ebe/m_p_fQ8Ps5eHBD1myJaS.jpg">تكبير</a>]</p><h3>المسيح (رافينا)</h3><p>كنيسة سانت أبوليناريو في كلاسي، رافينا، إيطاليا.</p><img src="https://res.bibleox.com/s/img/image/simple/675005d5dba77200011c73ad/s_p_rjjDEzNckea3oHk2.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/675005d5dba77200011c73ad/m_p_rjjDEzNckea3oHk2.jpg">تكبير</a>]</p><h3>المسيح والرسل (رافينا)</h3><p>فسيفساء البريسبيتريوم (هيكل الكنيسة). كنيسة سان فيتالي، رافينا، إيطاليا.</p><img src="https://res.bibleox.com/s/img/image/simple/675005dadba77200011c73ae/s_p_Nac2nrVo791COrcO.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/675005dadba77200011c73ae/m_p_Nac2nrVo791COrcO.jpg">تكبير</a>]</p><h3>المسيح والملائكة وفيتاليوس (رافينا)</h3><p>القرن السادس. بازيليكا القديس فيتاليوس الميلاني، رافينا.</p><img src="https://res.bibleox.com/s/img/image/simple/674f0ab3dba77200011c738f/s_p_AsShtty0gMBFOX5X.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f0ab3dba77200011c738f/m_p_AsShtty0gMBFOX5X.jpg">تكبير</a>]</p><h3>الإمبراطور يوستينيانوس التقي (رافينا)</h3><p>القرن السادس. بازيليكا القديس فيتاليوس الميلاني، رافينا.</p><img src="https://res.bibleox.com/s/img/image/simple/674f0ab8dba77200011c7390/s_p_MsUwTeWDMk0uEVPq.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f0ab8dba77200011c7390/m_p_MsUwTeWDMk0uEVPq.jpg">تكبير</a>]</p><h3>الإمبراطورة ثيودورا التقيّة (رافينا)</h3><p>القرن السادس. بازيليكا القديس فيتاليوس الميلاني، رافينا.</p><img src="https://res.bibleox.com/s/img/image/simple/674f0ac0dba77200011c7391/s_p_6g0s1g1btiJBEXSR.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f0ac0dba77200011c7391/m_p_6g0s1g1btiJBEXSR.jpg">تكبير</a>]</p><h3>إبراهيم أبو الآباء (رافينا)</h3><p>القرن السادس. بازيليكا القديس فيتاليوس الميلاني، رافينا.</p><img src="https://res.bibleox.com/s/img/image/simple/674f0ad6dba77200011c7393/s_p_zgb5TLR1yafutIu4.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f0ad6dba77200011c7393/m_p_zgb5TLR1yafutIu4.jpg">تكبير</a>]</p><h3>هابيل وملكيصادق (رافينا)</h3><p>القرن السادس. بازيليكا القديس فيتاليوس الميلاني، رافينا.</p><img src="https://res.bibleox.com/s/img/image/simple/674f0adbdba77200011c7394/s_p_PiL9TaItwhR28eXN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f0adbdba77200011c7394/m_p_PiL9TaItwhR28eXN.jpg">تكبير</a>]</p><h3>مرسيلينوس وبولّيون وبطرس، قديسون (روما)</h3><p>القرن السادس. سراديب الموتى (الكاتاكومب) في بونسيانو. جدارية.</p><img src="https://res.bibleox.com/s/img/image/simple/66cc2c4adba77200019bc7d9/s_p_th5E9srmqGjUT72T.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/66cc2c4adba77200019bc7d9/m_p_th5E9srmqGjUT72T.jpg">تكبير</a>]</p><h3>المسيح الآتي على السحاب، والرسل، والقديسان كوزما وداميانوس (روما)</h3><p>القرن السادس (سنة 530). بازيليكا كوزما وداميانوس. [19][20]</p><img src="https://res.bibleox.com/s/img/image/simple/686aa5b35f47da2505d3ae28/s_p_V2YyLyiR7wCHgIfW.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa5b35f47da2505d3ae28/m_p_V2YyLyiR7wCHgIfW.jpg">تكبير</a>]</p><p>الرسول بطرس والقديس قزما (وبعده أيضًا القديس ثيودوروس)</p><img src="https://res.bibleox.com/s/img/image/simple/686aa5d25f47da2505d3ae29/s_p_s66jgQ3tkVAmQEZE.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa5d25f47da2505d3ae29/m_p_s66jgQ3tkVAmQEZE.jpg">تكبير</a>]</p><p>الرسول بولس والقديس دميان (وبعده البابا فليكس)</p><img src="https://res.bibleox.com/s/img/image/simple/686aa7505f47da2505d3ae2c/s_p_WA1eP9P7BNe0aPQ6.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa7505f47da2505d3ae2c/m_p_WA1eP9P7BNe0aPQ6.jpg">تكبير</a>]</p><p>الملاك القديس</p><img src="https://res.bibleox.com/s/img/image/simple/686aa61c5f47da2505d3ae2a/s_p_MD4QowA5HKQRhFFG.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa61c5f47da2505d3ae2a/m_p_MD4QowA5HKQRhFFG.jpg">تكبير</a>]</p><h3>المسيح والرسل (روما)</h3><p>القرن السادس (578-590 م). بازيليكا القديس لورنسيوس خارج الأسوار (San Lorenzo fuori le Mura) [21][22]</p><p>بجانب الرسول بولس القديسان إستفانوس وإبّوليتوس. وبجانب الرسول بطرس القديس لورنسيوس.</p><img src="https://res.bibleox.com/s/img/image/simple/686aabc85f47da2505d3ae2e/s_p_xa4IU82mZb80Uija.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aabc85f47da2505d3ae2e/m_p_xa4IU82mZb80Uija.jpg">تكبير</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686aab945f47da2505d3ae2d/s_p_21M69l0ODfpN75oh.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aab945f47da2505d3ae2d/m_p_21M69l0ODfpN75oh.jpg">تكبير</a>]</p><h3>الرسولان بطرس وبولس (الفرنجة)</h3><p>من القرن السادس إلى الثامن. <a href="https://www.metmuseum.org/art/collection/search/464497">متحف المتروبوليتان في الجادة الخامسة، الولايات المتحدة</a> (وكذلك <a href="https://www.metmuseum.org/art/collection/search/464496">هنا</a>). عاج. 29,2 x 11,4 x 0,5 سم.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5ff8145c75323d28a5ec8/s_p_WhZZPyHo1I7oF79K.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5ff8145c75323d28a5ec8/m_p_WhZZPyHo1I7oF79K.jpg">تكبير</a>]</p><h3>قديسون (بيزنطية، مصر)</h3><p>القرنان السادس والسابع. <a href="https://www.metmuseum.org/art/collection/search/854019">متحف المتروبوليتان في الجادة الخامسة، الولايات المتحدة</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68b6007445c75323d28a5ec9/s_p_DNQuRcpcjfkINQ1r.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b6007445c75323d28a5ec9/m_p_DNQuRcpcjfkINQ1r.jpg">تكبير</a>]</p><h3>فوكا، قديس (بيزنطية، خيرسون)</h3><p>القرن السادس. قالب لصناعة الأيولوجي (أقراص البركة) يحمل صورة بارزة للقديس <a href="https://azbyka.ru/days/sv-foka-sinopskij">فوكا<strong>́</strong> السينوبي</a> واقفًا في قارب. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/373084?page=2&amp;fundcoll=1420520446&amp;index=75">متحف الأرميتاج، روسيا</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863bee26480b4d285320410/s_p_s0nPEGgpeMtakrof.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863bee26480b4d285320410/m_p_s0nPEGgpeMtakrof.jpg">تكبير</a>]</p><h3>قارورة بصورتين لقديسين (آسيا الصغرى، أفسس)</h3><p>القرن السادس. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/228313?page=44&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=2166">متحف الأرميتاج، روسيا</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c0e76480b4d285320414/s_p_KnTGMdyOhsmTAD0S.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c0e76480b4d285320414/m_p_KnTGMdyOhsmTAD0S.jpg">تكبير</a>]</p><h3>قارورة بصورة الإنجيلي والقديس: يوحنا اللاهوتي وبروخوروس (أفسس)</h3><p>القرن السادس. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/228314?page=33&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=1646">متحف الأرميتاج، روسيا</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c1726480b4d285320415/s_p_oBnXQZmCz1EntIFw.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c1726480b4d285320415/m_p_oBnXQZmCz1EntIFw.jpg">تكبير</a>]</p><h3>ختم رصاصي (موليبدوفولون) بصورة القديسين بطرس وبولس ونقش لاتيني (بيزنطية)</h3><p>القرنان السادس والسابع. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/131338?page=33&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=1639">متحف الأرميتاج، روسيا</a>. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/161973?page=33&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=1640">قطعة أخرى</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c19d6480b4d285320416/s_p_JKBi7CXiDOutHIFn.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c19d6480b4d285320416/m_p_JKBi7CXiDOutHIFn.jpg">تكبير</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6863c22c6480b4d285320417/s_p_FmbNOmLfDrj3qYOz.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c22c6480b4d285320417/m_p_FmbNOmLfDrj3qYOz.jpg">تكبير</a>]</p><h3>ختم رصاصي (موليبدوفولون) بصورة المسيح (بيزنطية)</h3><p>القرنان السادس والسابع. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/117792?page=6&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%B0&amp;index=269">متحف الأرميتاج، روسيا</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c4a86480b4d28532041f/s_p_Uy0EgcXKfuHnv9bX.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c4a86480b4d28532041f/m_p_Uy0EgcXKfuHnv9bX.jpg">تكبير</a>]</p><h3>ختم رصاصي (موليبدوفولون) بصورة المسيح ومونوغرام (بيزنطية)</h3><p>القرنان السادس والسابع. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/117804?page=3&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%B0&amp;index=143">متحف الأرميتاج، روسيا</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c5a16480b4d285320422/s_p_JNdWhUPj9cA9Dvoq.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c5a16480b4d285320422/m_p_JNdWhUPj9cA9Dvoq.jpg">تكبير</a>]</p><h2>القرن السابع</h2><h3>أيقونة المسيح على خاتم زواج (بيزنطية)</h3><p>600-700 م. نقوش يونانية على الخاتم: <strong>ΟΜΟΝΟΙΑ</strong> — وفاق؛ <strong>ΕΙΡΙΝΗΝ ΤΗΝ ΕΜΙΝ ΔΙΔΟΜ</strong> — «سلامي أعطيكم» (<a href="https://bibleox.com/ar/arab-avd/in/14/#L27">يو 14:27</a>). <a href="https://collections.louvre.fr/en/ark:/53355/cl010102797">متحف اللوفر، فرنسا</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c402726594f46d35a87ef8/s_p_6nMwdRXMjOnhQWfu.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c402726594f46d35a87ef8/m_p_6nMwdRXMjOnhQWfu.jpg">تكبير</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c4027c6594f46d35a87ef9/m_p_pNTvaGVW4AmLG2BK.jpg">نسخة 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c4027e6594f46d35a87efa/m_p_mvU9wZQKEIl0lFZY.jpg">نسخة 3</a>]</p><h3>قارورة بأيقونة. المسيح، والصلب، والصعود (فلسطين، بيزنطية)</h3><p>مطلع القرن السابع (نحو 600). <a href="https://www.clevelandart.org/art/1999.46">متحف كليفلاند للفنون، الولايات المتحدة</a>. سبيكة قصدير ورصاص مع عناصر جلدية.</p><img src="https://res.bibleox.com/s/img/image/simple/68caa8cf205184ec278d5884/s_p_QfQLEBTpKbF2IfJo.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68caa8cf205184ec278d5884/m_p_QfQLEBTpKbF2IfJo.jpg">تكبير</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68caaaaf205184ec278d5887/m_p_YFRVXxytSNharyj8.jpg">نسخة 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68caaab2205184ec278d5888/m_p_GguW2EcCVatptKzX.jpg">نسخة 3</a>]</p><h3>والدة الإله والقديس العظيم في الشهداء ثيودوروس ستراتيلاتس (سالونيك، بيزنطية)</h3><p>من القرن السابع إلى العاشر (؟) بازيليكا القديس ديمتريوس في سالونيك. فسيفساء على الوجه الجنوبي للعمود الشمالي.</p><img src="https://res.bibleox.com/s/img/image/simple/686985345f47da2505d3ae12/s_p_HWoRkey7yaGM1D4s.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686985345f47da2505d3ae12/m_p_HWoRkey7yaGM1D4s.jpg">تكبير</a>]</p><h3>الشهيد العظيم ديمتريوس والمؤسسون: رئيس الأساقفة والبريفكت (الحاكم) (سالونيك، بيزنطية)</h3><p>القرن السابع. بازيليكا القديس ديمتريوس في سالونيك. فسيفساء.</p><img src="https://res.bibleox.com/s/img/image/simple/686986dc5f47da2505d3ae13/s_p_ZMXi7hFVOfpu7jbC.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686986dc5f47da2505d3ae13/m_p_ZMXi7hFVOfpu7jbC.jpg">تكبير</a>]</p><h3>القديس جاورجيوس والأطفال (سالونيك، بيزنطية)</h3><p>القرن السابع. بازيليكا القديس ديمتريوس في سالونيك. الفسيفساء في الجزء الغربي من المذبح.</p><img src="https://res.bibleox.com/s/img/image/simple/686987645f47da2505d3ae14/s_p_boH6uu2omR2Gjxxx.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686987645f47da2505d3ae14/m_p_boH6uu2omR2Gjxxx.jpg">تكبير</a>]</p><h3>القديس سرجيوس (سالونيك، بيزنطية)</h3><p>القرن السابع. بازيليكا القديس ديمتريوس في سالونيك. فسيفساء عمود المذبح.</p><img src="https://res.bibleox.com/s/img/image/simple/686989925f47da2505d3ae15/s_p_Faf5BLFz9WISBGej.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686989925f47da2505d3ae15/m_p_Faf5BLFz9WISBGej.jpg">تكبير</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a742205184ec278d6fb4/m_p_YV1I98bvx4Nn6cUn.jpg">نسخة 2</a>]</p><h3>أيقونة النبي داود (القسطنطينية، بيزنطية)</h3><p>629-630 م. <a href="https://www.metmuseum.org/art/collection/search/464380">متحف المتروبوليتان في الجادة الخامسة، الولايات المتحدة</a>. فضة. 26.6 x 4 سم، 1397 غ. انظر أيضًا: <a href="https://www.metmuseum.org/art/collection/search/464378">1</a>، <a href="https://www.metmuseum.org/art/collection/search/464375">2</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c1c3426594f46d35a87e75/s_p_5U20dlUc30xkfJeN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1c3426594f46d35a87e75/m_p_5U20dlUc30xkfJeN.jpg">تكبير</a>]</p><h3>ختم رصاصي (موليبدوفولون) بصورة قديس ونقش (بيزنطية)</h3><p>القرن السابع. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/270001?page=17&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=840">متحف الأرميتاج، روسيا</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c2966480b4d285320419/s_p_EY1IyPYdMzjgztlB.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c2966480b4d285320419/m_p_EY1IyPYdMzjgztlB.jpg">تكبير</a>]</p><h3>ختم رصاصي (موليبدوفولون) بصورة نصفية للمسيح ومونوغرام (بيزنطية)</h3><p>القرن السابع. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/231980?page=2&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%B0&amp;index=96">متحف الأرميتاج، روسيا</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c6076480b4d285320423/s_p_YFjOrZh2fLGJgpYJ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c6076480b4d285320423/m_p_YFjOrZh2fLGJgpYJ.jpg">تكبير</a>]</p><h3>ختم رصاصي (موليبدوفولون) بصورة المسيح ومونوغرام (بيزنطية)</h3><p>القرن السابع. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/172196?page=2&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%B0&amp;index=57">متحف الأرميتاج، روسيا</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c64d6480b4d285320424/s_p_RQupAUUa4gGtXt2n.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c64d6480b4d285320424/m_p_RQupAUUa4gGtXt2n.jpg">تكبير</a>]</p><h2>القرن الثامن</h2><h3>والدة الإله والطفل يسوع (القسطنطينية، بيزنطية)</h3><p>كنيسة الحكمة الإلهية (آيا صوفيا).</p><img src="https://res.bibleox.com/s/img/image/simple/674f31b0dba77200011c73a2/s_p_2AO12RGOQ2yqRiP4.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f31b0dba77200011c73a2/m_p_2AO12RGOQ2yqRiP4.jpg">تكبير</a>]</p><h3>رئيس الملائكة جبرائيل (القسطنطينية، بيزنطة)</h3><p>كنيسة الحكمة الإلهية (آيا صوفيا).</p><img src="https://res.bibleox.com/s/img/image/simple/674f3256dba77200011c73a4/s_p_rfkKZFQ8IYfO6L7V.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f3256dba77200011c73a4/m_p_rfkKZFQ8IYfO6L7V.jpg">تكبير</a>]</p><h3>المسيح، الصلب والقيامة (متز، فرنسا)</h3><p>عام 870. <a href="https://collections.louvre.fr/en/ark:/53355/cl010113244">متحف اللوفر، فرنسا</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c422e46594f46d35a87f10/s_p_lQNRJIXri6KJoLw3.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c422e46594f46d35a87f10/m_p_lQNRJIXri6KJoLw3.jpg">تكبير</a>]</p><h3>المسيح، الصلب (رانس، فرنسا)</h3><p>أعوام 870-880. <a href="https://collections.louvre.fr/en/ark:/53355/cl010098469">متحف اللوفر، فرنسا</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c423bc6594f46d35a87f11/s_p_NOhnffTlgTImIczW.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c423bc6594f46d35a87f11/m_p_NOhnffTlgTImIczW.jpg">تكبير</a>]</p><h2>القرن التاسع</h2><h3>صعود المسيح (سالونيك، بيزنطة)</h3><p>القرنان التاسع والعاشر. الروتوندا للقديس جاورجيوس المنتصر (في الأصل ضريح الإمبراطور غاليريوس). جدارية [17][18]</p><img src="https://res.bibleox.com/s/img/image/simple/686a934c5f47da2505d3ae20/s_p_klfYhHum7wZvKR9D.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686a934c5f47da2505d3ae20/m_p_klfYhHum7wZvKR9D.jpg">تكبير</a>]</p><h3>المسيح، ميدالية برونزية (بيزنطة)</h3><p>القرنان التاسع والعاشر. تُسمّى الصور ذات الشكل المستدير «ميداليات». <a href="https://www.britishmuseum.org/collection/object/H_1880-0820-9">المتحف البريطاني</a>. القطر: 3.5 سم.</p><p>ميدالية مستديرة؛ برونز؛ صدر المسيح بهالة صليبية يحمل كتاب الإنجيل في يده اليسرى؛ نقش على الجانبين.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5be2d45c75323d28a5e92/s_p_GswK2cGnuxxnLfJr.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5be2d45c75323d28a5e92/m_p_GswK2cGnuxxnLfJr.jpg">تكبير</a>]</p><h3>رقاد والدة الإله (بيزنطة)</h3><p>أواخر القرن التاسع. <a href="https://www.metmuseum.org/art/collection/search/464013">متحف المتروبوليتان في الجادة الخامسة، الولايات المتحدة</a>. المادة: عاج. 18.6 x 14.8 x 1.1 سم.</p><p>نيويورك. متحف المتروبوليتان للفنون. «مجد بيزنطة». تُظهر صور «الكويميسيس» (الرقاد في الغرب) العذراءَ راقدةً على نعش، بينما يُقدّم المسيحُ نفسَها، المُمثَّلة بطفل، إلى ملائكة حاضرين يحملونها إلى السماء. ويقف الرسل، بقيادة القديسين بولس وبطرس، شاهدين.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5c1bf45c75323d28a5e97/s_p_0Hg1bO8KIUVBSWJs.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5c1bf45c75323d28a5e97/m_p_0Hg1bO8KIUVBSWJs.jpg">تكبير</a>]</p><h3>المسيح، والدة الإله، يوحنا المعمدان، الرسل وقديسون آخرون (القسطنطينية)</h3><p>أعوام 940-960. <a href="https://collections.louvre.fr/en/ark:/53355/cl010112515">متحف اللوفر، فرنسا</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c424276594f46d35a87f12/s_p_IlqGrJe04Ic0YFWv.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c424276594f46d35a87f12/m_p_IlqGrJe04Ic0YFWv.jpg">تكبير</a>]</p><h3>لوحة صغيرة تحمل صورة المسيح والرسل (إيطاليا)</h3><p>القرن التاسع. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/228918?page=4&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%B0&amp;index=194">متحف الإرميتاج، روسيا</a>. الأبعاد: 12.2х10.5 سم</p><img src="https://res.bibleox.com/s/img/image/simple/6863c54f6480b4d285320421/s_p_aLvOvrKuilB614SS.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c54f6480b4d285320421/m_p_aLvOvrKuilB614SS.jpg">تكبير</a>]</p><h2>القرن العاشر</h2><h3>المسيح، والدة الإله، يوحنا المعمدان (بيزنطة)</h3><p>القرن العاشر. <a href="https://www.britishmuseum.org/collection/object/H_1923-1205-2">المتحف البريطاني</a>. المادة: عاج. الارتفاع: 15.5 سم.</p><p>لوحة؛ عاج؛ منقوشة بأشخاص واقفين: المسيح مع العذراء مريم والقديس يوحنا، تحت مظلّة مثقّبة؛ وأربعة ثقوب للتثبيت في الإطار البارز.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5be4045c75323d28a5e95/s_p_qEFeZyh2Gq5Wbvar.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5be4045c75323d28a5e95/m_p_qEFeZyh2Gq5Wbvar.jpg">تكبير</a>]</p><h3>والدة الإله والمسيح الطفل (القسطنطينية، بيزنطة)</h3><p>أعوام <a href="tel:950-1025">950-1025</a>. <a href="https://www.clevelandart.org/art/1925.1293">متحف كليفلاند للفنون، الولايات المتحدة</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68caa153205184ec278d5882/s_p_iLLZZkqfsUiACLDC.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68caa153205184ec278d5882/m_p_iLLZZkqfsUiACLDC.jpg">تكبير</a>]</p><h3>معلّقة تحمل صورة المسيح ووالدة الإله (بيزنطة)</h3><p>أعوام 1000-1300. <a href="https://www.metmuseum.org/art/collection/search/477247">متحف المتروبوليتان في الجادة الخامسة، الولايات المتحدة</a>. كاميو من العقيق الأبيض (الكالسيدوني)؛ إطار ذهبي باللؤلؤ والزمرد والعقيق الأحمر والياقوت الأزرق وترصيع من الجزع. الحجم الكلي: 7,2 x 5,5 x 1,6 سم. العقيق الأبيض: 1 1/2 x 1 1/4 بوصة (3,8 x 3,2 سم)</p><img src="https://res.bibleox.com/s/img/image/simple/68c1bc1a6594f46d35a87e6d/s_p_VcHt7eFMtZq1I1lY.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1bc1a6594f46d35a87e6d/m_p_VcHt7eFMtZq1I1lY.jpg">تكبير</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/68c1bc176594f46d35a87e6c/s_p_LwWdQj6J4ehbmMh9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1bc176594f46d35a87e6c/m_p_LwWdQj6J4ehbmMh9.jpg">تكبير</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c1bc1f6594f46d35a87e6e/m_p_gT2TXueTg5pmDsuZ.jpg">تكبير أكبر</a>]</p><h3>صليب يحمل صورة المسيح (بيزنطة)</h3><p>القرنان العاشر والحادي عشر. برونز. 6.6х4.2 سم. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/228297?page=56&amp;query=%D0%BA%D1%80%D0%B5%D1%81%D1%82&amp;sort=112&amp;index=2755">متحف الإرميتاج، روسيا</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c11f5b6594f46d35a87e2d/s_p_6uw78FFpsxpItSzn.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c11f5b6594f46d35a87e2d/m_p_6uw78FFpsxpItSzn.jpg">تكبير</a>]</p><h3>صليب يحمل صورة المسيح (بيزنطة)</h3><p>القرنان العاشر والحادي عشر. برونز. 7.7х7 سم. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/482789?page=51&amp;query=%D0%BA%D1%80%D0%B5%D1%81%D1%82&amp;sort=112&amp;index=2501">متحف الإرميتاج، روسيا</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c11fab6594f46d35a87e2e/s_p_jfgfrZ4X7jcBXG9D.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c11fab6594f46d35a87e2e/m_p_jfgfrZ4X7jcBXG9D.jpg">تكبير</a>]</p><h3>صليب عليه أيقونات قديسين (خيرسون)</h3><p>القرن العاشر. برونز، حفر. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/372835?page=5&amp;fundcoll=1420520446__1413747286&amp;index=229">متحف الإرميتاج، روسيا</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c4191a6594f46d35a87f02/s_p_iFiSEGM9EbRIhhtD.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c4191a6594f46d35a87f02/m_p_iFiSEGM9EbRIhhtD.jpg">تكبير</a>]</p><h3>القديس ديمتريوس التسالونيكي (بيزنطة)</h3><p>أعوام <a href="tel:950-1000">950-1000</a>. <a href="https://www.metmuseum.org/art/collection/search/465946">متحف المتروبوليتان في الجادة الخامسة، الولايات المتحدة</a>. المادة: عاج. 19.7 x 12.1 x 1 سم.</p><p>يقف القديس ديمتريوس منتصبًا، وفي يده حربة وإلى جانبه ترس، في صورة مَن هو مستعدّ لحماية المؤمنين المسيحيين. وقد نُقش اسم هذا القديس العسكري البيزنطي الشهير باليونانية على قسمين. وقد استُشهد في تسالونيكي، ثانية مدن الإمبراطورية أهميةً في القرون الأولى للكنيسة، وظلّ طويلًا شفيع تلك المدينة. وصور القديسين في ثياب عسكرية نادرة في الفن البيزنطي المبكّر (وهي تظهر على كؤوس كنز أتّاروثي)، لكنها شائعة في العصر البيزنطي الأوسط.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5c38445c75323d28a5e98/s_p_ZeZuXGqxAAyDuPBA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5c38445c75323d28a5e98/m_p_ZeZuXGqxAAyDuPBA.jpg">تكبير</a>]</p><h2>القرن الحادي عشر</h2><h3>صليب للمواكب: المسيح، والدة الإله، رئيسا الملائكة ميخائيل وجبرائيل (بيزنطة)</h3><p>أعوام 1000-1050. <a href="https://www.metmuseum.org/art/collection/search/466251">متحف المتروبوليتان في الجادة الخامسة، الولايات المتحدة</a>. 59.5 x 43 x 2.2 سم.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5e3e645c75323d28a5e9b/s_p_Ft65PrnBUmI6wDAc.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5e3e645c75323d28a5e9b/m_p_Ft65PrnBUmI6wDAc.jpg">تكبير</a>]</p><h3>صليب للمواكب، المسيح، والدة الإله، يوحنا المعمدان (بيزنطة)</h3><p>عام 1050. <a href="https://www.clevelandart.org/art/1970.36">متحف كليفلاند للفنون، الولايات المتحدة</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68ca921d205184ec278d5871/s_p_PrD5y34JBpT95quf.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68ca921d205184ec278d5871/m_p_PrD5y34JBpT95quf.jpg">تكبير</a>]</p><h3>صليب للمواكب، القديس سابا (بيزنطة)</h3><p>عام 1050. <a href="https://www.metmuseum.org/art/collection/search/697956">متحف المتروبوليتان في الجادة الخامسة، الولايات المتحدة</a>. في وسط الوجه الخلفي صُوّر القديس سابا، وعلى الأطراف قديسون رهبان آخرون. فضة. 32.4 × 44.8 × 5.7 سم.</p><img src="https://res.bibleox.com/s/img/image/simple/68c1c6546594f46d35a87e76/s_p_FO8cb8Ec2FqTDFz8.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1c6546594f46d35a87e76/m_p_FO8cb8Ec2FqTDFz8.jpg">تكبير</a>]</p><h3>صليب للمواكب، المسيح (خيرسون)</h3><p>القرن الحادي عشر. المادة: برونز، حديد؛ صبّ، طرق، حفر. الحجم: 36.5х27.5 سم. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/372834?page=3&amp;fundcoll=1420520446__1413747286&amp;index=106">متحف الإرميتاج، روسيا</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c418616594f46d35a87f01/s_p_ytqdkwIa6FDSikCw.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c418616594f46d35a87f01/m_p_ytqdkwIa6FDSikCw.jpg">تكبير</a>]</p><h3>جزء من أيقونة «المسيح ضابط الكل» (بيزنطة، القرم)</h3><p>أعوام 1050-1100. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/372766?page=40&amp;query=%D0%B8%D0%BA%D0%BE%D0%BD%D0%B0&amp;index=1999">متحف الإرميتاج، روسيا</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863bfff6480b4d285320412/s_p_XwuOAkY6yR10NT7b.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863bfff6480b4d285320412/m_p_XwuOAkY6yR10NT7b.jpg">تكبير</a>]</p><h3>والدة الإله مع المسيح الطفل (القسطنطينية)</h3><p>أعوام 1000-1015. <a href="https://collections.louvre.fr/en/ark:/53355/cl010101133">متحف اللوفر، فرنسا</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c43b8c6594f46d35a87f16/s_p_rQNvoLa9Vu1WmSB2.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c43b8c6594f46d35a87f16/m_p_rQNvoLa9Vu1WmSB2.jpg">تكبير</a>]</p><h3>والدة الإله، أورانتا (القسطنطينية)</h3><p>أعوام 1000-1200. <a href="https://collections.louvre.fr/en/ark:/53355/cl010114443">متحف اللوفر، فرنسا</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c43bcc6594f46d35a87f17/s_p_7a5oJnVWqjfeu67t.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c43bcc6594f46d35a87f17/m_p_7a5oJnVWqjfeu67t.jpg">تكبير</a>]</p><h3>والدة الإله، رئيس الملائكة ميخائيل، القديس ثيودوروس (بيزنطة)</h3><p>القرنان الحادي عشر والثاني عشر. <a href="https://www.britishmuseum.org/collection/object/H_1981-0103-1">المتحف البريطاني</a>. 108х95 مم.</p><p>أيقونة بارزة؛ لوحة برونزية مستطيلة مصبوبة بنقش بارز منخفض تُظهر «الأوديغيتريا» بكامل طولها، وعلى جانبيها رئيس الملائكة ميخائيل والقديس ثيودوروس، وكلٌّ منهم يلبس ثوبًا متمنطقًا تحت خلاميس ذات تبليون مزخرف؛ وتُعرَّف الشخصيات بنقوش غائرة؛ ويحيط بالكل إطار بارز بزخرفة كرمة متصلة؛ وآثار لحام على الجانبين والظهر.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5be3545c75323d28a5e93/s_p_DFDGZ6kHm0khLKRD.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5be3545c75323d28a5e93/m_p_DFDGZ6kHm0khLKRD.jpg">تكبير</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5be3b45c75323d28a5e94/m_p_FfmDAHv29BAMxval.jpg">تكبير أكبر</a>]</p><h3>أيقونة القديس ديمتريوس (بيزنطة)</h3><p>أعوام 1040-1060. <a href="https://collections.louvre.fr/en/ark:/53355/cl010115478">متحف اللوفر، فرنسا</a>. 9,4 х 6,3 х 0,6 سم.</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c0c36594f46d35a87ec0/s_p_dj04XPO3pwvzkLzr.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c0c36594f46d35a87ec0/m_p_dj04XPO3pwvzkLzr.jpg">تكبير</a>]</p><h3>موليبدوفولون يحمل صورة القديس ديمتريوس ونقشًا (بيزنطة)</h3><p>القرن الحادي عشر. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/269619?page=20&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=958">متحف الإرميتاج، روسيا</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c2556480b4d285320418/s_p_oqzix7avanFfe61o.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c2556480b4d285320418/m_p_oqzix7avanFfe61o.jpg">تكبير</a>]</p><h3>موليبدوفولون يحمل صورة نصفية لقديس (بيزنطة)</h3><p>القرن الحادي عشر. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/267492?page=14&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=651">متحف الإرميتاج، روسيا</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c3196480b4d28532041a/s_p_VySwl31Z41rar6d3.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c3196480b4d28532041a/m_p_VySwl31Z41rar6d3.jpg">تكبير</a>]</p><h3>خاتم معلّق يحمل صورة قديس (بيزنطة)</h3><p>القرن الحادي عشر. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/483272?query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=21">متحف الإرميتاج، روسيا</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c4276480b4d28532041d/s_p_5EJuZ18em5TsdUwA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c4276480b4d28532041d/m_p_5EJuZ18em5TsdUwA.jpg">تكبير</a>]</p><h3>خاتم معلّق يحمل صورة قديس (بيزنطة)</h3><p>القرنان الحادي عشر والثاني عشر. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/483278?query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=35">متحف الإرميتاج، روسيا</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c4616480b4d28532041e/s_p_H8LrRkkjwBHlc322.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c4616480b4d28532041e/m_p_H8LrRkkjwBHlc322.jpg">تكبير</a>]</p><h2>القرن الثاني عشر</h2><h3>المسيح، والدة الإله، النبي يوحنا (القسطنطينية، بيزنطة)</h3><p>كنيسة الحكمة الإلهية (آيا صوفيا). جدارية الكنيسة[5]</p><img src="https://res.bibleox.com/s/img/image/simple/6750078ddba77200011c73af/s_p_EcliI0JFeV1uu1LU.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6750078ddba77200011c73af/m_p_EcliI0JFeV1uu1LU.jpg">تكبير</a>]</p><h3>المسيح (القسطنطينية، بيزنطة)</h3><p>كنيسة الحكمة الإلهية (آيا صوفيا).</p><img src="https://res.bibleox.com/s/img/image/simple/674f332ddba77200011c73a6/s_p_1PCMz3Y4EZgbSJL0.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f332ddba77200011c73a6/m_p_1PCMz3Y4EZgbSJL0.jpg">تكبير</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686cf10d5f47da2505d3ae4e/s_p_ZHUiumbGoeJMn4GO.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686cf10d5f47da2505d3ae4e/m_p_ZHUiumbGoeJMn4GO.jpg">تكبير</a>]</p><h3>والدة الإله (القسطنطينية، بيزنطة)</h3><p>كنيسة الحكمة الإلهية (آيا صوفيا).</p><img src="https://res.bibleox.com/s/img/image/simple/674f3332dba77200011c73a7/s_p_WvZb6UestGwJUzJr.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f3332dba77200011c73a7/m_p_WvZb6UestGwJUzJr.jpg">تكبير</a>]</p><h3>يوحنا المعمدان، النبي (القسطنطينية، بيزنطة)</h3><p>كنيسة الحكمة الإلهية (آيا صوفيا).</p><img src="https://res.bibleox.com/s/img/image/simple/674f357ddba77200011c73a8/s_p_hdfr9cx0ZPTZyn6N.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f357ddba77200011c73a8/m_p_hdfr9cx0ZPTZyn6N.jpg">تكبير</a>]</p><h3>والدة الإله مع الطفل يسوع (القسطنطينية)</h3><p>الثلث الأول من القرن الثاني عشر. أيقونة والدة الإله الفلاديميرية. خشب، تمبرا.</p><img src="https://res.bibleox.com/s/img/image/simple/674f18e4dba77200011c7399/s_p_0uaArAqVhNX9r0gV.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f18e4dba77200011c7399/m_p_0uaArAqVhNX9r0gV.jpg">تكبير</a>]</p><h3>والدة الإله (بيزنطة، سوريا، طرطوس)</h3><p>القرن الثاني عشر. <a href="https://www.britishmuseum.org/collection/object/H_1889-0511-13">المتحف البريطاني</a>. المادة: عاج، 41х47 مم.</p><p>أيقونة بارزة؛ من الحجر الصابوني الرمادي المخضرّ الباهت؛ مستديرة في أعلاها ومربّعة في أسفلها؛ صدر العذراء، ورداؤها مسحوب على رأسها وعليه صليب القديس أندراوس؛ ويداها ممدودتان إلى الأمام وراحتاها إلى الخارج، ونقش على جانبيها.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5be2645c75323d28a5e91/s_p_StVNlxiOjocLLsz5.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5be2645c75323d28a5e91/m_p_StVNlxiOjocLLsz5.jpg">تكبير</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5be2245c75323d28a5e90/m_p_yHJ3BkdNwVGdLb4m.jpg">تكبير أكبر</a>]</p><h3>الشهيد العظيم ديمتريوس التسالونيكي والشمّاس (سالونيك، بيزنطة)</h3><p>القرن الثاني عشر. فسيفساء على الوجه الشرقي للعمود الجنوبي.</p><img src="https://res.bibleox.com/s/img/image/simple/68698a155f47da2505d3ae16/s_p_n7AgnVLPvfeBX5Qq.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68698a155f47da2505d3ae16/m_p_n7AgnVLPvfeBX5Qq.jpg">تكبير</a>]</p><h3>أيقونة والدة الإله «الأوديغيتريا» (بيزنطة، خيرسون)</h3><p>النصف الثاني من القرن الثاني عشر. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/372931?page=11&amp;fundcoll=1420520446&amp;index=536">متحف الإرميتاج، روسيا</a>. 6.8х5 سم</p><img src="https://res.bibleox.com/s/img/image/simple/6863bf2f6480b4d285320411/s_p_10YV8HIpAzMNCgvp.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863bf2f6480b4d285320411/m_p_10YV8HIpAzMNCgvp.jpg">تكبير</a>]</p><h2>القرن الثالث عشر</h2><h3>الرب ضابط الكل (آثوس)</h3><p>دير خيلندار، الجبل المقدس آثوس.</p><img src="https://res.bibleox.com/s/img/image/simple/69406737205184ec278d6fd8/s_p_hTWcEC5QtmbCrC5t.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69406737205184ec278d6fd8/m_p_hTWcEC5QtmbCrC5t.jpg">تكبير</a>]</p><h3>والدة الإله مع الطفل يسوع (الأوديغيتريا، آثوس)</h3><p>دير خيلندار، الجبل المقدس آثوس.</p><img src="https://res.bibleox.com/s/img/image/simple/674f0cfadba77200011c7395/s_p_mQMRA7FGLEbqOYIx.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f0cfadba77200011c7395/m_p_mQMRA7FGLEbqOYIx.jpg">تكبير</a>]</p><h2>القرن الرابع عشر</h2><h3>الرب ضابط الكل</h3><p>رسّام الأيقونات مانويل بانسلينوس.</p><img src="https://res.bibleox.com/s/img/image/simple/674f28d1dba77200011c739e/s_p_ma0z14hIFXCiEj7S.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f28d1dba77200011c739e/m_p_ma0z14hIFXCiEj7S.jpg">تكبير</a>]</p><h3>والدة الإله (سالونيك)</h3><p>أعوام 1310-1315. أورانتا. جدارية كنيسة القديس نيقولاوس أورفانوس في سالونيك، اليونان.</p><img src="https://res.bibleox.com/s/img/image/simple/674f29b7dba77200011c739f/s_p_PSuCdQIYdR4IYZgA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f29b7dba77200011c739f/m_p_PSuCdQIYdR4IYZgA.jpg">تكبير</a>]</p><h3>دخول والدة الإله إلى الهيكل (القسطنطينية)</h3><p>نحو 1316–1321. جامع كاريه، دير خورا، إسطنبول (القسطنطينية)، تركيا.</p><img src="https://res.bibleox.com/s/img/image/simple/675343bddba7720001cd0ddf/s_p_AtF4vpmhv6FneUfA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/675343bddba7720001cd0ddf/m_p_AtF4vpmhv6FneUfA.jpg">تكبير</a>]</p><h2>القرن الخامس عشر</h2><h3>الرسول بولس (روس)</h3><p>عقد 1410. المؤلف: القديس أندريه روبليوف. معرض تريتياكوف الحكومي، موسكو، روسيا.</p><img src="https://res.bibleox.com/s/img/image/simple/6909fbca205184ec278d6e6a/s_p_ok25vNdlaQMM5P3c.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6909fbca205184ec278d6e6a/m_p_ok25vNdlaQMM5P3c.jpg">تكبير</a>]</p><h2>مجموعات الأيقونات</h2><ol><li><p>مجموعة صور أيقونية من سراديب الموتى، ملف Word: <a href="https://disk.yandex.ru/d/mHc8dxUdHGqMEQ">رابط</a></p></li><li><p>أعمال رسّام الأيقونات مانويل بانسلينوس (القرنان الثالث عشر والرابع عشر): <a href="https://vk.com/album-20034910_224123875">https://vk.com/album-20034910_224123875</a></p></li></ol>
