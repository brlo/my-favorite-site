      <h2>दूसरी शताब्दी</h2><h3><a href="https://ru.wikipedia.org/wiki/%D0%9F%D0%B0%D0%BF%D0%B8%D1%80%D1%83%D1%81_52">पेपिरस 52</a> — <a href="https://bibleox.com/hi/hi-ov/in/18/#L31-33,37-38">यूह 18:31-33,37-38</a> (~150)</h3><img src="https://res.bibleox.com/s/img/image/simple/67c76e30dba7720001a4ab31/s_p_k5TLeFzzlkF84GaN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/67c76e30dba7720001a4ab31/m_p_k5TLeFzzlkF84GaN.jpg">बड़ा करें</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/67c77746dba7720001a4ab32/s_p_redMnT8D34cxZOYL.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/67c77746dba7720001a4ab32/m_p_redMnT8D34cxZOYL.jpg">बड़ा करें</a>]</p><h3><a href="https://en.wikipedia.org/wiki/Papyrus_90">पेपिरस 90</a> — <a href="https://bibleox.com/hi/hi-ov/in/18/#L36-40">यूह 18:36-40</a>; <a href="https://bibleox.com/hi/hi-ov/in/19/#L1-7">यूह 19:1-7</a> (~150)</h3><img src="https://res.bibleox.com/s/img/image/simple/67c7784edba7720001a4ab33/s_p_H1o3KGBYNI9sl2F9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/67c7784edba7720001a4ab33/m_p_H1o3KGBYNI9sl2F9.jpg">बड़ा करें</a>]</p><h3><a href="https://en.wikipedia.org/wiki/Papyrus_104">पेपिरस 104</a> — <a href="https://bibleox.com/hi/hi-ov/mf/21/#L34-37">मत्ती 21:34-37</a>; <a href="https://bibleox.com/hi/hi-ov/mf/21/#L43-44">मत्ती 21:43-44</a> (~150)</h3><img src="https://res.bibleox.com/s/img/image/simple/67c778a6dba7720001a4ab34/s_p_J8MmDkwHjJgq0wEA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/67c778a6dba7720001a4ab34/m_p_J8MmDkwHjJgq0wEA.jpg">बड़ा करें</a>]</p><h3><a href="https://en.wikipedia.org/wiki/Papyrus_98">पेपिरस 98</a> — <a href="https://bibleox.com/hi/hi-ov/otkr/1/#L13-20">प्रका 1:13-20</a>; <a href="https://bibleox.com/hi/hi-ov/otkr/2/#L1">प्रका 2:1</a> (~150-250)</h3><img src="https://res.bibleox.com/s/img/image/simple/67c779a2dba7720001a4ab35/s_p_rPG5aCVLBBw75jo3.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/67c779a2dba7720001a4ab35/m_p_rPG5aCVLBBw75jo3.jpg">बड़ा करें</a>]</p><h2>तीसरी शताब्दी</h2><h3><a href="https://en.wikipedia.org/wiki/Papyrus_75">पेपिरस 75</a> — <a href="https://bibleox.com/hi/hi-ov/lk/3/#L18">लूका 3:18</a>; <a href="https://bibleox.com/hi/hi-ov/in/1/#L1">यूह 1:1</a> (175-225)</h3><img src="https://res.bibleox.com/s/img/image/simple/67c77d00dba7720001a4ab3a/s_p_9dXrKwGPywze2DAo.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/67c77d00dba7720001a4ab3a/m_p_9dXrKwGPywze2DAo.jpg">बड़ा करें</a>]</p><h3><a href="https://en.wikipedia.org/wiki/Papyrus_46">पेपिरस 46</a> — रोमियों, इब्रानियों, 1 कुरिन्थियों, 2 कुरिन्थियों, इफिसियों, गलातियों, फिलिप्पियों, कुलुस्सियों, 1 थिस्सलुनीकियों (~175-225)</h3><img src="https://res.bibleox.com/s/img/image/simple/6915b056205184ec278d6e7f/s_p_lPe15bGd8VVR6y2H.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6915b056205184ec278d6e7f/m_p_lPe15bGd8VVR6y2H.jpg">बड़ा करें</a>]</p><ul><li><p>रोमियों 1:15:17</p></li><li><p>रोमियों 5:17 – 6:14</p></li><li><p>रोमियों 6:14 – 8:15</p></li><li><p>रोमियों 8:15 – 11:35</p></li><li><p>रोमियों 11:35 – 14:8</p></li><li><p>रोमियों 14:9 – 15:11</p></li><li><p>रोमियों 15:11 — इब्रानियों 8:8</p></li><li><p>इब्रानियों 8:9 – 9:10</p></li><li><p>इब्रानियों 9:10 – 26</p></li><li><p>इब्रानियों 9:26 – 1 कुरिन्थियों 2:3</p></li><li><p>1 कुरिन्थियों 2:3 – 3:5</p></li><li><p>1 कुरिन्थियों 3:6 – 2 कुरिन्थियों 9:7</p></li><li><p>2 कुरिन्थियों 9:7 – अन्त तक, इफिसियों, गलातियों 1:1 – 6:10</p></li><li><p>गलातियों 6:10 — अन्त, फिलिप्पियों, कुलुस्सियों, 1 थिस्सलुनीकियों 1:1 – 2:3</p></li><li><p>1 थिस्सलुनीकियों 2:3–5:5</p></li><li><p>1 थिस्सलुनीकियों 5:5, 23–28</p></li><li><p>यह भी सम्भव है: 1 थिस्सलुनीकियों 5:28 – 2 थिस्सलुनीकियों और फिलेमोन</p></li></ul><h3><a href="https://en.wikipedia.org/wiki/Papyrus_32">पेपिरस 32</a> — <a href="https://bibleox.com/hi/hi-ov/tit/1/#L11-15">तीतु 1:11-15</a>; <a href="https://bibleox.com/hi/hi-ov/tit/2/#L3-8">तीतु 2:3-8</a> (~200)</h3><img src="https://res.bibleox.com/s/img/image/simple/67c77f82dba7720001a4ab3c/s_p_37FYUloO3Px16M3p.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/67c77f82dba7720001a4ab3c/m_p_37FYUloO3Px16M3p.jpg">बड़ा करें</a>]</p><h3><a href="https://en.wikipedia.org/wiki/Papyrus_4">पेपिरस 4</a> — <a href="https://bibleox.com/hi/hi-ov/lk/1/#L58-59">लूका 1:58-59</a>; 1:62-2:1; 2:6-7; 3:8-4:2; 4:29-32, 34-35; 5:3-8; 5:30-6:16 (175-250)</h3><img src="https://res.bibleox.com/s/img/image/simple/67c77ec9dba7720001a4ab3b/s_p_EOPj5ySHUxKuZhzv.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/67c77ec9dba7720001a4ab3b/m_p_EOPj5ySHUxKuZhzv.jpg">बड़ा करें</a>]</p><h3><a href="https://en.wikipedia.org/wiki/Papyrus_16">पेपिरस 16</a> — <a href="https://bibleox.com/hi/hi-ov/fil/3/#L10-17">फिलि 3:10-17</a>; <a href="https://bibleox.com/hi/hi-ov/fil/4/#L2-8">फिलि 4:2-8</a> (तीसरी शताब्दी)</h3><img src="https://res.bibleox.com/s/img/image/simple/67c77a33dba7720001a4ab36/s_p_ee63gtSd7dJORxL9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/67c77a33dba7720001a4ab36/m_p_ee63gtSd7dJORxL9.jpg">बड़ा करें</a>]</p><h3><a href="https://en.wikipedia.org/wiki/Papyrus_72">पेपिरस 72</a> — <a class="mw-redirect" href="https://ru.wikipedia.org/wiki/1-%D0%B5_%D0%BF%D0%BE%D1%81%D0%BB%D0%B0%D0%BD%D0%B8%D0%B5_%D0%9F%D0%B5%D1%82%D1%80%D0%B0">1 पतरस</a>, <a class="mw-redirect" href="https://ru.wikipedia.org/wiki/2-%D0%B5_%D0%BF%D0%BE%D1%81%D0%BB%D0%B0%D0%BD%D0%B8%D0%B5_%D0%9F%D0%B5%D1%82%D1%80%D0%B0">2 पतरस</a>, <a href="https://ru.wikipedia.org/wiki/%D0%9F%D0%BE%D1%81%D0%BB%D0%B0%D0%BD%D0%B8%D0%B5_%D0%98%D1%83%D0%B4%D1%8B">यहूदा</a> (तीसरी-चौथी शताब्दी)</h3><img src="https://res.bibleox.com/s/img/image/simple/67c77afddba7720001a4ab37/s_p_JCufSqhlLauLH7qF.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/67c77afddba7720001a4ab37/m_p_JCufSqhlLauLH7qF.jpg">बड़ा करें</a>]</p><h3><a href="https://en.wikipedia.org/wiki/Papyrus_78">पेपिरस 78</a> — <a href="https://bibleox.com/hi/hi-ov/iud/1/#L4-5,7-8">यहू 1:4-5,7-8</a> (तीसरी-चौथी शताब्दी)</h3><img src="https://res.bibleox.com/s/img/image/simple/67c77be8dba7720001a4ab38/s_p_8xpMewUexRgW9gyK.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/67c77be8dba7720001a4ab38/m_p_8xpMewUexRgW9gyK.jpg">बड़ा करें</a>]</p><h2>चौथी शताब्दी</h2><h3>सीनै कोडेक्स (चौथी शताब्दी का मध्य)</h3><p><a href="https://codexsinaiticus.org/en/manuscript.aspx">https://codexsinaiticus.org/en/manuscript.aspx</a></p><img src="https://res.bibleox.com/s/img/image/simple/69037c86205184ec278d6e4f/s_p_k8XUyHVBOuyRjeGi.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69037c86205184ec278d6e4f/m_p_k8XUyHVBOuyRjeGi.jpg">बड़ा करें</a>]</p><h3>वेटिकन कोडेक्स (चौथी शताब्दी का मध्य, पर सम्भवतः 367 के बाद भी)</h3><p><a href="https://archive.org/details/CodexAlexandrinus/Codex-Vaticanus-NT/mode/2up">https://archive.org/details/CodexAlexandrinus/Codex-Vaticanus-NT/mode/2up</a></p><p><a href="https://digi.vatlib.it/view/MSS_Vat.gr.1209">https://digi.vatlib.it/view/MSS_Vat.gr.1209</a></p><img src="https://res.bibleox.com/s/img/image/simple/69037c61205184ec278d6e4e/s_p_mNcBEIlZjg4rJctE.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69037c61205184ec278d6e4e/m_p_mNcBEIlZjg4rJctE.jpg">बड़ा करें</a>]</p><h2>पाँचवीं शताब्दी</h2><h3>अलेक्ज़ैंड्रिया कोडेक्स (पाँचवीं शताब्दी का पूर्वार्ध)</h3><p><a href="https://archive.org/details/CodexAlexandrinus/Codex%20Alexandrinus">https://archive.org/details/CodexAlexandrinus/Codex%20Alexandrinus</a></p><img src="https://res.bibleox.com/s/img/image/simple/69037c31205184ec278d6e4d/s_p_nvIvhbabbnHZELvW.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69037c31205184ec278d6e4d/m_p_nvIvhbabbnHZELvW.jpg">बड़ा करें</a>]</p>
