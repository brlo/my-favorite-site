  - src: Древние_христианские_храмы
    path: Ch2c_प्राचीन_ईसाई_गिरजाघर
    title: "प्राचीन ईसाई गिरजाघर"
    body: |-
      <h2>एपिग्राफ</h2><blockquote><p>तब भीड़ में से कुछ फरीसी उससे कहने लगे, “हे गुरु, अपने चेलों को डाँट।” उसने उत्तर दिया, “मैं तुम से कहता हूँ, <strong>यदि ये चुप रहे तो पत्थर चिल्ला उठेंगे।</strong>” (<a href="https://bibleox.com/hi/hi-ov/lk/19/#L39-40">लूका 19:39-40</a>)</p></blockquote><h2>तीसरी शताब्दी</h2><h3>प्राचीन नगर मगिद्दो के पास <a href="https://he.wikipedia.org/wiki/%D7%9C%D7%92%D7%99%D7%95">Legio</a> बस्ती में स्थित मंदिर (~230 ई.)</h3><p>प्राचीन ईसाई मंदिरों में वेदी प्रायः केंद्र में स्थित होती थी। यह मंदिर इसका स्पष्ट उदाहरण है।</p><p>मगिद्दो नगर के निकट (प्राचीन समय में वहाँ <a href="https://he.wikipedia.org/wiki/%D7%9C%D7%92%D7%99%D7%95">Legio</a> बस्ती थी, क्योंकि वहाँ एक रोमन लीजन तैनात था)। बस्ती की ऊँचाई पर एक भवन बनाया गया था, जिसे सिक्कों, मिट्टी के बर्तनों और लिपि के प्रकार के आधार पर 230 ई. का ठहराया गया है। भवन के एक कमरे में ईसाई मंदिर था। फ़र्श पर कई बड़े मोज़ेक हैं जिन पर शिलालेख अंकित हैं (उनमें से एक मसीह को परमेश्वर कहता है), और केंद्र में वेदी स्थित है। साथ ही पास में एक शिलालेख है जिसमें बताया गया है कि यह मेज़ किसने दान की थी।</p><img src="https://res.bibleox.com/s/img/image/simple/692c58f9205184ec278d6f97/s_p_aZ3NifF9BW3oqZ1a.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c58f9205184ec278d6f97/m_p_aZ3NifF9BW3oqZ1a.jpg">बड़ा करें</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/692c587d205184ec278d6f91/s_p_MvOQRFKiCv6XaXOd.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c587d205184ec278d6f91/m_p_MvOQRFKiCv6XaXOd.jpg">बड़ा करें</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/692c58ee205184ec278d6f96/s_p_5wNRtqyrpQivbBim.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c58ee205184ec278d6f96/m_p_5wNRtqyrpQivbBim.jpg">बड़ा करें</a>] [<a href="https://res.bibleox.com/s/img/image/simple/692c58e0205184ec278d6f95/m_p_FQvEfj70dP7967X3.jpg">अतिरिक्त तस्वीर 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/692c58ce205184ec278d6f94/m_p_9xoiCsqROihBYnL0.jpg">अतिरिक्त तस्वीर 3</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/692c58b5205184ec278d6f93/s_p_Cvww0C8ZGmbqJS7a.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c58b5205184ec278d6f93/m_p_Cvww0C8ZGmbqJS7a.jpg">बड़ा करें</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/692c5882205184ec278d6f92/s_p_WU59e3c2XbPWkdaM.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c5882205184ec278d6f92/m_p_WU59e3c2XbPWkdaM.jpg">बड़ा करें</a>]</p><p><strong>शिलालेख:</strong></p><p>मंदिर के फ़र्श के सभी शिलालेख एक प्रकार की <strong>स्मरण-पत्रिकाएँ</strong> हैं। प्राचीन काल से आज तक रूढ़िवादी कलीसिया के मंदिरों में यह परंपरा चली आ रही है कि मंदिर में दिव्य लीटर्जी के समय प्रार्थनापूर्ण स्मरण में उन लोगों के नाम भी जोड़े जाते हैं जिन्होंने मंदिर बनवाया या कुछ महत्वपूर्ण दान किया। यहाँ भी स्मरण के आह्वान के साथ उन लोगों के नाम अंकित हैं जिन्होंने मोज़ेक फ़र्श दान किया (शतपति गयुस पोर्फ़िरियुस), जिसने उसे बिछाया (ब्रूतुस), जिसने वेदी दान की (अकेप्ता), और कुछ अन्य नाम भी, संभवतः दानकर्ताओं के संबंधी: प्रिमिल्ला, कुरियाका, दोरोथेया, क्रिस्ते। इसी प्रकार जीवितों और मृतकों की स्मृति में कलीसिया के बर्तन भी अर्पित किए जाते थे: यूखरिस्त के प्याले और धूपदानियाँ (देखें <a href="https://bibleox.com/hi/hi/w/Ik1c_प्राचीन_आइकॉनों_का_संग्रह#HH-आइकॉनों-वाले-यूखरिसतीय-पयाले-और-धूपदानियाँ-बीजानटियम-सीरिया-अततरुती">अधिक जानकारी</a>)।</p><blockquote><p>HI: परमेश्वर से प्रेम करनेवाली अकेप्ता ने यह पवित्र सिंहासन स्मरणार्थ परमेश्वर यीशु मसीह को अर्पित किया।</p></blockquote><blockquote><p>EN: Akeptous, the God-loving, offered the table to God Jesus Christ as a memorial.</p></blockquote><blockquote><p>Transcription: <strong>Prosēniken Akeptous, ē philotheos, tēn trapezan Th(e)ō Ι(ēso)u Ch(rist)ō mnēmosunon.</strong></p></blockquote><blockquote><p>Orig: <strong>ΠΡΟСΗΝΙΚΕΝ ΑΚΕΠΤΟΥС, Η ΦΙΛΟΘΕΟС, ΤΗΝ ΤΡΑΠΕΖΑΝ Θ(Ε)Ω Ι(ΗСΟ)Υ Χ(ΡΙСΤ)Ω ΜΝΗΜΟСΥΝΟΝ</strong></p></blockquote><blockquote><p>ΠΡΟϹΗΝΙΚΕΝ</p><p>ΑΚΕΠΤΟΥϹ,</p><p>Η ΦΙΛΟΘΕΟϹ,</p><p>ΤΗΝ ΤΡΑΠΕ-</p><p>ZΑΝ <strong>{ΘW} {ΙΥ} {ΧW}*</strong></p><p>ΜΝΗΜΟϹΥΝΟΝ</p></blockquote><p>*Nomina Sacra: <strong>ΘW ΙΥ ΧW</strong> = θεῷ Ἰησοῦ Χριστῷ = परमेश्वर यीशु मसीह</p><img src="https://res.bibleox.com/s/img/image/simple/692c5df3205184ec278d6f9a/s_p_swifwBDbtzgImkZ6.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c5df3205184ec278d6f9a/m_p_swifwBDbtzgImkZ6.jpg">बड़ा करें</a>]</p><hr><blockquote><p>ΕΝ: Remember Primilla and Cyriaca and Dorothea, and moreover also Chreste.</p></blockquote><blockquote><p>HI: प्रिमिल्ला, कुरियाका और दोरोथेया को, और क्रिस्ते को भी स्मरण करो।</p></blockquote><blockquote><p>Orig: <strong>ΜΝΗΜΟΝΕΥСΑΤΕ ΠΡΙΜΙΛΛΗС ΚΑΙ ΚΥΡΙΑΚΗС ΚΑΙ ΔWΡΟΘΕΑС ΕΤΙ ΔΕ ΚΑΙ ΧΡΗСΤΗ</strong></p></blockquote><blockquote><p>Fixed: <strong>ΜΝΗΜΟΝΕΥСΑΤΕ ΠΡΙΜΙΛΛΗС ΚΑΙ ΚΥΡΙΑΚΗΣ ΚΑΙ ΔΩΡΟΘΕΑΣ ΕΤΙ ΔΕ ΚΑΙ ΧΡΗΣΤΗ</strong></p></blockquote><img src="https://res.bibleox.com/s/img/image/simple/692c5dec205184ec278d6f99/s_p_LVbgKrKO7P3dfEJP.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c5dec205184ec278d6f99/m_p_LVbgKrKO7P3dfEJP.jpg">बड़ा करें</a>]</p><hr><blockquote><p>HI: गयुस, जिन्हें पोर्फ़िरियुस भी कहा जाता है, शतपति, हमारा भाई, ने अपने ही साधनों से बड़ी उदारता के साथ यह फ़र्श बिछवाया। ब्रूतियुस ने कार्य सम्पन्न किया।</p></blockquote><blockquote><p>EN: Gaianus, also called Porphyrius, centurion (xp), our brother, has made the pavement at his own expense as an act of liberality. Brutius has carried out the work.</p></blockquote><blockquote><p>Orig: <strong>ΓΑΙΑΝΟС Ο ΚΑ ΠΟΡΦΥΡΙС ΧΡ* ΑΔΕΛΦΟС ΗΜWΝ ΕΚ ΦΙΛΟΤΕ ΙΜΙС ΑΜΕΝ ΟСΕΚΤW ΝΙΔΙWΝ ΕΨΙ ΦΟΛΟΓΗСΕΝ. ΒΡΟVΤΙС ΗΡΓΑСΑΤΟ.</strong></p></blockquote><blockquote><p>Fixed: <strong>ΓΑΙΑΝΟΣ Ο ΚΑ ΠΟΡΦΥΡΙΣ ΧΡ* ΑΔΕΛΦΟΣ ΗΜΩΝ ΕΚ ΦΙΛΟΤΕ ΙΜΙΣ ΑΜΕΝ ΟΣΕΚΤΩ ΝΙΔΙΩΝ ΕΨΙ ΦΟΛΟΓΗΣΕΝ. ΒΡΟΥΤΙΣ ΗΡΓΑΣΑΤΟ.</strong></p></blockquote><p><strong>*ΧΡ — hekatontarches — centurio</strong></p><img src="https://res.bibleox.com/s/img/image/simple/692c5e27205184ec278d6f9b/s_p_Qk321JfFTD4dDmnd.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c5e27205184ec278d6f9b/m_p_Qk321JfFTD4dDmnd.jpg">बड़ा करें</a>]</p><h3>दूरा-यूरोपोस (सीरिया) का मंदिर</h3><p>244 ई. — दूरा-यूरोपोस में ईसाई मंदिर</p><img src="https://res.bibleox.com/s/img/image/simple/6931880c205184ec278d6fa6/s_p_DFnp7s0vcTbXb3Qn.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931880c205184ec278d6fa6/m_p_DFnp7s0vcTbXb3Qn.jpg">बड़ा करें</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/69318806205184ec278d6fa5/s_p_PuUKcoZEfAVSlPNM.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69318806205184ec278d6fa5/m_p_PuUKcoZEfAVSlPNM.jpg">बड़ा करें</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/69318802205184ec278d6fa4/s_p_MF4zgk1ySUOBpqnG.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69318802205184ec278d6fa4/m_p_MF4zgk1ySUOBpqnG.jpg">बड़ा करें</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/414/s_p_UgKueSl1yxG0SfbA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/414/m_p_UgKueSl1yxG0SfbA.jpg">बड़ा करें</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/69330ed8205184ec278d6fc0/s_p_kXy4nTuYVCOxuDib.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69330ed8205184ec278d6fc0/m_p_kXy4nTuYVCOxuDib.jpg">बड़ा करें</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/693187fd205184ec278d6fa3/s_p_R3poESL99kNRMpXi.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/693187fd205184ec278d6fa3/m_p_R3poESL99kNRMpXi.jpg">बड़ा करें</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/69330e9e205184ec278d6fbf/s_p_ThLs4WrxsJ3ykxKU.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69330e9e205184ec278d6fbf/m_p_ThLs4WrxsJ3ykxKU.jpg">बड़ा करें</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/69330e76205184ec278d6fbe/s_p_NykNwaI9TEwz1Ccf.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69330e76205184ec278d6fbe/m_p_NykNwaI9TEwz1Ccf.jpg">बड़ा करें</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/69330e70205184ec278d6fbd/s_p_Rd3jEzEeesXUCTmh.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69330e70205184ec278d6fbd/m_p_Rd3jEzEeesXUCTmh.jpg">बड़ा करें</a>]</p><p>मंदिर की दीवारों पर नए नियम की घटनाओं को दर्शाने वाले भित्तिचित्र हैं: डूबते हुए प्रेरित पतरस का उद्धार और भेड़-फाटक के कुंड के पास पक्षाघाती का चंगा होना (मसीह के चमत्कारों की शृंखला में से केवल ये दो भित्तिचित्र ही सुरक्षित रहे), तथा अच्छा चरवाहा।</p><p><strong>डूबते हुए प्रेरित पतरस का उद्धार</strong></p><img src="https://res.bibleox.com/s/img/image/simple/692c8038205184ec278d6f9e/s_p_QQ2Rml8gUWsyQtS9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c8038205184ec278d6f9e/m_p_QQ2Rml8gUWsyQtS9.jpg">बड़ा करें</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6786b88ddba77200015ae11c/m_p_do380IVDukCAfdFk.jpg">संस्करण 2</a>]</p><p><strong>भेड़-फाटक के कुंड के पास पक्षाघाती का चंगा होना</strong></p><img src="https://res.bibleox.com/s/img/image/simple/6786b889dba77200015ae11b/s_p_k1a5GDBvfzTCWmZv.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6786b889dba77200015ae11b/m_p_k1a5GDBvfzTCWmZv.jpg">बड़ा करें</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6786bb0bdba77200015ae11d/m_p_dCRD85foL69l7kih.jpg">दूसरा संस्करण</a>]</p><p><strong>बपतिस्मा-कुंड के पास का चित्र (कमरा #6): अच्छा चरवाहा, खोई हुई भेड़ को झुंड में लौटा लाता है</strong></p><img src="https://res.bibleox.com/s/img/image/simple/6931870c205184ec278d6fa2/s_p_uBkNi8jGsMFpOQSM.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931870c205184ec278d6fa2/m_p_uBkNi8jGsMFpOQSM.jpg">बड़ा करें</a>]</p><h3>कैसरिया के यूसेबियुस (पाम्फ़िलुस), बिशप, कलीसिया-इतिहासकार (~258-339)</h3><p>वे रोमन सम्राट डायोक्लीशियन के शासनकाल (शासनकाल: 284-305) से पहले के समय में सभी नगरों में ईसाई गिरजाघरों के निर्माण के विषय में लिखते हैं। 296 ई. में डायोक्लीशियन ईसाई गिरजाघरों को ध्वस्त करने का आदेश जारी करता है। इस आदेश के समय यूसेबियुस 38 वर्ष के थे, अर्थात् वे इन गिरजाघरों के निर्माण और उनके विनाश दोनों के प्रत्यक्षदर्शी रहे होंगे:</p><blockquote><p>5. कलीसियाओं के अगुओं के प्रति प्रोक्यूरेटरों और शासकों का कैसा सद्भाव था! इन <strong>प्रत्येक नगर में होनेवाले हज़ारों-हज़ार लोगों के सम्मेलनों</strong> का, इन अद्भुत जनसमूहों का, जो <strong>प्रार्थना-गृहों में उमड़ पड़ते थे, वर्णन कैसे किया जाए! पुराने भवन कम पड़ गए थे; <mark>सभी नगरों में नए विशाल गिरजाघर बनाए जा रहे थे</mark> (εὐρείας εἰς πλάτος ἀνὰ πάσας τὰς πόλεις ἐκ θεμελίων ἀνίστων <mark>ἐκκλησίας</mark>).</strong></p><p>&lt;…&gt;</p><p>4. डायोक्लीशियन के शासन का उन्नीसवाँ वर्ष चल रहा था, जब दिस्त्रुस महीने में (रोमियों के अनुसार यह मार्च है), प्रभु के कष्टों के पर्व से पहले, सर्वत्र <strong><mark>सम्राट का आदेश टाँग दिया गया, जिसमें गिरजाघरों को नींव तक ढहाने</mark> (βασιλικὰ γράμματα, τὰς μὲν <mark>ἐκκλησίας</mark> εἰς ἔδαφος φέρειν)</strong> और पवित्रशास्त्र को जलाने का हुक्म था, तथा जो लोग ईसाई धर्म को मानते थे, उन्हें सम्माननीय पदों से वंचित घोषित किया गया;</p></blockquote><p>(<a href="https://bibleox.com/hi/grc/w/%CE%95%CE%9A%CE%9A%CE%9B%CE%97%CE%A3%CE%99%CE%91%CE%A3%CE%A4%CE%99%CE%9A%CE%97%CE%A3_%CE%99%CE%A3%CE%A4%CE%9F%CE%A1%CE%99%CE%91%CE%A3-8/#:~:text=%E1%BC%80%CE%BD%E1%BD%B0%20%CF%80%E1%BD%B1%CF%83%CE%B1%CF%82%20%CF%84%E1%BD%B0%CF%82%20%CF%80%E1%BD%B9%CE%BB%CE%B5%CE%B9%CF%82%20%E1%BC%90%CE%BA%20%CE%B8%CE%B5%CE%BC%CE%B5%CE%BB%E1%BD%B7%CF%89%CE%BD%20%E1%BC%80%CE%BD%E1%BD%B7%CF%83%CF%84%CF%89%CE%BD%20%E1%BC%90%CE%BA%CE%BA%CE%BB%CE%B7%CF%83%E1%BD%B7%CE%B1%CF%82">कलीसिया का इतिहास, पुस्तक 8, 1.5 और 2.4 (यूनानी में)</a>)</p><h2>संदेहास्पद खोजें</h2><h3><strong>हेरकुलानेउम का घर (</strong>पहली शताब्दी<strong>)</strong></h3><img src="https://res.bibleox.com/s/img/image/simple/67e428d39a4a346bba31e8ba/s_p_F0lTpC2rqw7PVyf1.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/67e428d39a4a346bba31e8ba/m_p_F0lTpC2rqw7PVyf1.jpg">बड़ा करें</a>] [<a href="https://res.bibleox.com/s/img/image/simple/69330b68205184ec278d6fb8/m_p_oEOCtcPUBThtuirO.jpg">संस्करण 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/69330cb6205184ec278d6fb9/m_p_zMmSTHDi5RoizXsX.jpg">संस्करण 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/69330cbb205184ec278d6fba/m_p_Jv9gdiBWmrMB5tc4.jpg">संस्करण 4</a>] [<a href="https://res.bibleox.com/s/img/image/simple/67e428d79a4a346bba31e8bb/m_p_1sEN1KSZxei96K4S.jpg">संस्करण 5</a>] [<a href="https://res.bibleox.com/s/img/image/simple/67e428db9a4a346bba31e8bc/m_p_TgMWk123osBJ9une.jpg">संस्करण 6</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/69330cc3205184ec278d6fbc/s_p_YLRMNDvDg7nCTh3X.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69330cc3205184ec278d6fbc/m_p_YLRMNDvDg7nCTh3X.jpg">बड़ा करें</a>]</p><p>79 ई. में वेसुवियस ज्वालामुखी का विस्फोट हुआ, जिसने पोम्पेई, स्ताबियाई और हेरकुलानेउम जैसे नगरों को ज्वालामुखी की राख के नीचे दबा दिया। हेरकुलानेउम में एक <a href="https://ru.wikipedia.org/wiki/%D0%93%D0%B5%D1%80%D0%BA%D1%83%D0%BB%D0%B0%D0%BD%D1%83%D0%BC#%D0%94%D0%BE%D0%BC_%D0%B4%D0%B2%D1%83%D1%85%D1%81%D0%BE%D1%82%D0%BB%D0%B5%D1%82%D0%B8%D1%8F">घर</a> मिला (उत्खनन की जयंती के अवसर पर इसे ‘दो-शताब्दी का घर’ कहा गया), जिसकी दूसरी मंज़िल पर, कमरों में दीवार पर लकड़ी की छोटी अलमारी के ठीक ऊपर बीच में <a href="https://ermakvagus.com/Europe/Italy/Pompeii/christianity_pompeii_rus.html">क्रूस के आकार का गड्ढा</a> बना हुआ था। कुछ लोग मानते हैं कि वहाँ प्रार्थना के लिए लकड़ी का क्रूस रखा था, और उस स्थान का उपयोग ईसाई उपासना या घरेलू प्रार्थना के लिए किया जाता था। किंतु इस अनुमान के विरुद्ध गंभीर तर्क भी हैं। उसी नगर में एक छोटी ताक़ मिली, जो संभवतः दीवार पर मिलता-जुलता चिह्न छोड़ सकती थी।</p><img src="https://res.bibleox.com/s/img/image/simple/6932ff2b205184ec278d6fb6/s_p_cXmpauqq2EYuH6ww.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6932ff2b205184ec278d6fb6/m_p_cXmpauqq2EYuH6ww.jpg">बड़ा करें</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6932ff36205184ec278d6fb7/s_p_KIfO7M0rbhGbWoIk.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6932ff36205184ec278d6fb7/m_p_KIfO7M0rbhGbWoIk.jpg">बड़ा करें</a>] [<a href="https://res.bibleox.com/s/img/image/simple/69330cbf205184ec278d6fbb/m_p_WL1FQysNlwZc0yT9.jpg">संस्करण 2</a>]</p><p>वह ताक़ बिल्कुल वैसी नहीं है: उसका बाएँ और दाएँ ओर काफ़ी बड़ा फलाव है, और नीचे की ओर छोटा फलाव। इसके अतिरिक्त, ‘दो-शताब्दी के घर’ में संभवतः उस स्थान पर दीवार पर दो बंद होनेवाले पल्ले थे। फिर भी इसकी अधिक संभावना है कि ‘दो-शताब्दी के घर’ में वास्तव में क्रूस नहीं, बल्कि एक साधारण ताक़ थी। पाठक को स्वयं निश्चित करना चाहिए कि वह किन-किन निष्कर्षों पर कितना भरोसा करे। यहाँ इस खोज के विषय में केवल ज्ञात जानकारी एकत्र की गई है।</p>
