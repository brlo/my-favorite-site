पोंत्सियानो का कैटाकॉम्ब। भित्तिचित्र।</p><img src="https://res.bibleox.com/s/img/image/simple/66cc2c4adba77200019bc7d9/s_p_th5E9srmqGjUT72T.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/66cc2c4adba77200019bc7d9/m_p_th5E9srmqGjUT72T.jpg">बड़ा करें</a>]</p><h3>बादलों पर आने वाला मसीह, प्रेरित तथा संत कोस्मास और दमियान (रोम)</h3><p>छठी शताब्दी (530 ई.)। कोस्मास और दमियान का बासिलिका। [19][20]</p><img src="https://res.bibleox.com/s/img/image/simple/686aa5b35f47da2505d3ae28/s_p_V2YyLyiR7wCHgIfW.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa5b35f47da2505d3ae28/m_p_V2YyLyiR7wCHgIfW.jpg">बड़ा करें</a>]</p><p>प्रेरित पतरस और संत कोस्मास (आगे संत थियोदोर भी)</p><img src="https://res.bibleox.com/s/img/image/simple/686aa5d25f47da2505d3ae29/s_p_s66jgQ3tkVAmQEZE.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa5d25f47da2505d3ae29/m_p_s66jgQ3tkVAmQEZE.jpg">बड़ा करें</a>]</p><p>प्रेरित पौलुस और संत दमियान (आगे पोप फ़ेलिक्स)</p><img src="https://res.bibleox.com/s/img/image/simple/686aa7505f47da2505d3ae2c/s_p_WA1eP9P7BNe0aPQ6.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa7505f47da2505d3ae2c/m_p_WA1eP9P7BNe0aPQ6.jpg">बड़ा करें</a>]</p><p>संत स्वर्गदूत</p><img src="https://res.bibleox.com/s/img/image/simple/686aa61c5f47da2505d3ae2a/s_p_MD4QowA5HKQRhFFG.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa61c5f47da2505d3ae2a/m_p_MD4QowA5HKQRhFFG.jpg">बड़ा करें</a>]</p><h3>मसीह और प्रेरित (रोम)</h3><p>छठी शताब्दी (578-590 ई.)। शहर की दीवारों के बाहर संत लॉरेंस का बासिलिका (San Lorenzo fuori le Mura) [21][22]</p><p>प्रेरित पौलुस के पास संत स्तेफ़न और हिप्पोलितुस। प्रेरित पतरस के पास संत लॉरेंस।</p><img src="https://res.bibleox.com/s/img/image/simple/686aabc85f47da2505d3ae2e/s_p_xa4IU82mZb80Uija.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aabc85f47da2505d3ae2e/m_p_xa4IU82mZb80Uija.jpg">बड़ा करें</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686aab945f47da2505d3ae2d/s_p_21M69l0ODfpN75oh.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aab945f47da2505d3ae2d/m_p_21M69l0ODfpN75oh.jpg">बड़ा करें</a>]</p><h3>प्रेरित पतरस और पौलुस (फ़्रांक)</h3><p>छठी-आठवीं। <a href="https://www.metmuseum.org/art/collection/search/464497">मेट्रोपॉलिटन, 5वें एवेन्यू पर, अमेरिका</a> (यहाँ भी <a href="https://www.metmuseum.org/art/collection/search/464496">देखें</a>)। हाथीदाँत। 29,2 x 11,4 x 0,5 सेमी।</p><img src="https://res.bibleox.com/s/img/image/simple/68b5ff8145c75323d28a5ec8/s_p_WhZZPyHo1I7oF79K.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5ff8145c75323d28a5ec8/m_p_WhZZPyHo1I7oF79K.jpg">बड़ा करें</a>]</p><h3>संत (बीज़ान्टियम, मिस्र)</h3><p>छठी-सातवीं शताब्दी। <a href="https://www.metmuseum.org/art/collection/search/854019">मेट्रोपॉलिटन, 5वें एवेन्यू पर, अमेरिका</a>।</p><img src="https://res.bibleox.com/s/img/image/simple/68b6007445c75323d28a5ec9/s_p_DNQuRcpcjfkINQ1r.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b6007445c75323d28a5ec9/m_p_DNQuRcpcjfkINQ1r.jpg">बड़ा करें</a>]</p><h3>फ़ोका, संत (बीज़ान्टियम, खेर्सोनेस)</h3><p>छठी शताब्दी। नाव पर खड़े संत <a href="https://azbyka.ru/days/sv-foka-sinopskij">सिनोप के फ़ो<strong>́</strong>का</a> की उभरी हुई प्रतिमा वाला एवलोगी बनाने का साँचा। <a href="https://collections.hermitagemuseum.org/entity/OBJECT/373084?page=2&amp;fundcoll=1420520446&amp;index=75">हर्मिताज़, रूस</a>।</p><img src="https://res.bibleox.com/s/img/image/simple/6863bee26480b4d285320410/s_p_s0nPEGgpeMtakrof.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863bee26480b4d285320410/m_p_s0nPEGgpeMtakrof.jpg">बड़ा करें</a>]</p><h3>दो संतों की प्रतिमाओं वाला अम्पुला (लघु एशिया, एफ़ेसुस)</h3><p>छठी शताब्दी। <a href="https://collections.hermitagemuseum.org/entity/OBJECT/228313?page=44&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=2166">हर्मिताज़, रूस</a>।</p><img src="https://res.bibleox.com/s/img/image/simple/6863c0e76480b4d285320414/s_p_KnTGMdyOhsmTAD0S.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c0e76480b4d285320414/m_p_KnTGMdyOhsmTAD0S.jpg">बड़ा करें</a>]</p><h3>सुसमाचारकार और संत की प्रतिमाओं वाला अम्पुला: यूहन्ना धर्मशास्त्री और प्रोखोर (एफ़ेसुस)</h3><p>छठी शताब्दी। <a href="https://collections.hermitagemuseum.org/entity/OBJECT/228314?page=33&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=1646">हर्मिताज़, रूस</a>।</p><img src="https://res.bibleox.com/s/img/image/simple/6863c1726480b4d285320415/s_p_oBnXQZmCz1EntIFw.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c1726480b4d285320415/m_p_oBnXQZmCz1EntIFw.jpg">बड़ा करें</a>]</p><h3>संत पतरस और पौलुस की प्रतिमा तथा लातीनी अभिलेख वाला मोलिव्दोवुल (सीसा-मुद्रा) (बीज़ान्टियम)</h3><p>छठी-सातवीं शताब्दी। <a href="https://collections.hermitagemuseum.org/entity/OBJECT/131338?page=33&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=1639">हर्मिताज़, रूस</a>। <a href="https://collections.hermitagemuseum.org/entity/OBJECT/161973?page=33&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=1640">एक और वस्तु</a>।</p><img src="https://res.bibleox.com/s/img/image/simple/6863c19d6480b4d285320416/s_p_JKBi7CXiDOutHIFn.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c19d6480b4d285320416/m_p_JKBi7CXiDOutHIFn.jpg">बड़ा करें</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6863c22c6480b4d285320417/s_p_FmbNOmLfDrj3qYOz.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c22c6480b4d285320417/m_p_FmbNOmLfDrj3qYOz.jpg">बड़ा करें</a>]</p><h3>मसीह की प्रतिमा वाला मोलिव्दोवुल (बीज़ान्टियम)</h3><p>छठी-सातवीं शताब्दी। <a href="https://collections.hermitagemuseum.org/entity/OBJECT/117792?page=6&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%B0&amp;index=269">हर्मिताज़, रूस</a>।</p><img src="https://res.bibleox.com/s/img/image/simple/6863c4a86480b4d28532041f/s_p_Uy0EgcXKfuHnv9bX.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c4a86480b4d28532041f/m_p_Uy0EgcXKfuHnv9bX.jpg">बड़ा करें</a>]</p><h3>मसीह की प्रतिमा और मोनोग्राम वाला मोलिव्दोवुल (बीज़ान्टियम)</h3><p>छठी-सातवीं शताब्दी। <a href="https://collections.hermitagemuseum.org/entity/OBJECT/117804?page=3&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%B0&amp;index=143">हर्मिताज़, रूस</a>।</p><img src="https://res.bibleox.com/s/img/image/simple/6863c5a16480b4d285320422/s_p_JNdWhUPj9cA9Dvoq.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c5a16480b4d285320422/m_p_JNdWhUPj9cA9Dvoq.jpg">बड़ा करें</a>]</p><h2>सातवीं शताब्दी</h2><h3>सगाई की अंगूठी पर मसीह का आइकॉन (बीज़ान्टियम)</h3><p>600-700 ई. अंगूठी पर यूनानी अभिलेख: <strong>ΟΜΟΝΟΙΑ</strong> — सहमति; <strong>ΕΙΡΙΝΗΝ ΤΗΝ ΕΜΙΝ ΔΙΔΟΜ</strong> — «अपनी शान्ति तुम्हें देता हूँ» (<a href="https://bibleox.com/hi/hi-ov/in/14/#L27">यूह 14:27</a>)। <a href="https://collections.louvre.fr/en/ark:/53355/cl010102797">लूव्र, फ़्रांस</a>।</p><img src="https://res.bibleox.com/s/img/image/simple/68c402726594f46d35a87ef8/s_p_6nMwdRXMjOnhQWfu.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c402726594f46d35a87ef8/m_p_6nMwdRXMjOnhQWfu.jpg">बड़ा करें</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c4027c6594f46d35a87ef9/m_p_pNTvaGVW4AmLG2BK.jpg">संस्करण 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c4027e6594f46d35a87efa/m_p_mvU9wZQKEIl0lFZY.jpg">संस्करण 3</a>]</p><h3>आइकॉन वाला अम्पुला। मसीह, क्रूसारोहण और स्वर्गारोहण (फ़िलिस्तीन, बीज़ान्टियम)</h3><p>600 का दशक (आरम्भ)। <a href="https://www.clevelandart.org/art/1999.46">क्लीवलैंड कला संग्रहालय, अमेरिका</a>। टिन-सीसे की मिश्र धातु, चमड़े के अंगों सहित।</p><img src="https://res.bibleox.com/s/img/image/simple/68caa8cf205184ec278d5884/s_p_QfQLEBTpKbF2IfJo.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68caa8cf205184ec278d5884/m_p_QfQLEBTpKbF2IfJo.jpg">बड़ा करें</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68caaaaf205184ec278d5887/m_p_YFRVXxytSNharyj8.jpg">संस्करण 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68caaab2205184ec278d5888/m_p_GguW2EcCVatptKzX.jpg">संस्करण 3</a>]</p><h3>परमेश्वर की माता और महाशहीद थियोदोर स्त्रातिलात (थेसालोनिकी, बीज़ान्टियम)</h3><p>सातवीं–दसवीं शताब्दी (?) थेसालोनिकी का संत दिमीत्रियुस बासिलिका। उत्तरी स्तंभ के दक्षिणी फलक पर मोज़ेक।</p><img src="https://res.bibleox.com/s/img/image/simple/686985345f47da2505d3ae12/s_p_HWoRkey7yaGM1D4s.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686985345f47da2505d3ae12/m_p_HWoRkey7yaGM1D4s.jpg">बड़ा करें</a>]</p><h3>महाशहीद दिमीत्रियुस और क्तितोर: आर्चबिशप और प्रीफ़ेक्ट (थेसालोनिकी, बीज़ान्टियम)</h3><p>सातवीं शताब्दी। थेसालोनिकी का संत दिमीत्रियुस बासिलिका। मोज़ेक।</p><img src="https://res.bibleox.com/s/img/image/simple/686986dc5f47da2505d3ae13/s_p_ZMXi7hFVOfpu7jbC.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686986dc5f47da2505d3ae13/m_p_ZMXi7hFVOfpu7jbC.jpg">बड़ा करें</a>]</p><h3>संत जॉर्ज और बच्चे (थेसालोनिकी, बीज़ान्टियम)</h3><p>सातवीं शताब्दी। थेसालोनिकी का संत दिमीत्रियुस बासिलिका। मोज़ेक वेदी के पश्चिमी भाग में है।</p><img src="https://res.bibleox.com/s/img/image/simple/686987645f47da2505d3ae14/s_p_boH6uu2omR2Gjxxx.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686987645f47da2505d3ae14/m_p_boH6uu2omR2Gjxxx.jpg">बड़ा करें</a>]</p><h3>संत सर्जियुस (थेसालोनिकी, बीज़ान्टियम)</h3><p>सातवीं शताब्दी। थेसालोनिकी का संत दिमीत्रियुस बासिलिका। वेदी के स्तंभ का मोज़ेक।</p><img src="https://res.bibleox.com/s/img/image/simple/686989925f47da2505d3ae15/s_p_Faf5BLFz9WISBGej.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686989925f47da2505d3ae15/m_p_Faf5BLFz9WISBGej.jpg">बड़ा करें</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a742205184ec278d6fb4/m_p_YV1I98bvx4Nn6cUn.jpg">संस्करण 2</a>]</p><h3>संत भविष्यद्वक्ता दाऊद का आइकॉन (कुस्तुंतुनिया, बीज़ान्टियम)</h3><p>629-630 ई. <a href="https://www.metmuseum.org/art/collection/search/464380">मेट्रोपॉलिटन संग्रहालय, 5वें एवेन्यू पर, अमेरिका</a>। चाँदी। 26.6 x 4 सेमी, 1397 ग्राम। यह भी देखें: <a href="https://www.metmuseum.org/art/collection/search/464378">1</a>, <a href="https://www.metmuseum.org/art/collection/search/464375">2</a>।</p><img src="https://res.bibleox.com/s/img/image/simple/68c1c3426594f46d35a87e75/s_p_5U20dlUc30xkfJeN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1c3426594f46d35a87e75/m_p_5U20dlUc30xkfJeN.jpg">बड़ा करें</a>]</p><h3>संत की प्रतिमा और अभिलेख वाला मोलिव्दोवुल (बीज़ान्टियम)</h3><p>सातवीं शताब्दी। <a href="https://collections.hermitagemuseum.org/entity/OBJECT/270001?page=17&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=840">हर्मिताज़, रूस</a>।</p><img src="https://res.bibleox.com/s/img/image/simple/6863c2966480b4d285320419/s_p_EY1IyPYdMzjgztlB.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c2966480b4d285320419/m_p_EY1IyPYdMzjgztlB.jpg">बड़ा करें</a>]</p><h3>मसीह की वक्ष-प्रतिमा और मोनोग्राम वाला मोलिव्दोवुल (बीज़ान्टियम)</h3><p>सातवीं शताब्दी। <a href="https://collections.hermitagemuseum.org/entity/OBJECT/231980?page=2&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%B0&amp;index=96">हर्मिताज़, रूस</a>।</p><img src="https://res.bibleox.com/s/img/image/simple/6863c6076480b4d285320423/s_p_YFjOrZh2fLGJgpYJ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c6076480b4d285320423/m_p_YFjOrZh2fLGJgpYJ.jpg">बड़ा करें</a>]</p><h3>मसीह की प्रतिमा और मोनोग्राम वाला मोलिव्दोवुल (बीज़ान्टियम)</h3><p>सातवीं शताब्दी। <a href="https://collections.hermitagemuseum.org/entity/OBJECT/172196?page=2&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%B0&amp;index=57">हर्मिताज़, रूस</a>।</p><img src="https://res.bibleox.com/s/img/image/simple/6863c64d6480b4d285320424/s_p_RQupAUUa4gGtXt2n.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c64d6480b4d285320424/m_p_RQupAUUa4gGtXt2n.jpg">बड़ा करें</a>]</p><h2>आठवीं शताब्दी</h2><h3>परमेश्वर की माता और शिशु यीशु (कुस्तुंतुनिया, बीज़ान्टियम)</h3><p>परमेश्वर की प्रज्ञा का मंदिर (हागिया सोफ़िया)।</p><img src="https://res.bibleox.com/s/img/image/simple/674f31b0dba77200011c73a2/s_p_2AO12RGOQ2yqRiP4.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f31b0dba77200011c73a2/m_p_2AO12RGOQ2yqRiP4.jpg">बड़ा करें</a>]</p><h3>महादूत गब्रिएल (क़ुस्तुंतुनिया, बीज़ान्टियम)</h3><p>परमेश्वर की प्रज्ञा का मंदिर (हागिया सोफ़िया)।</p><img src="https://res.bibleox.com/s/img/image/simple/674f3256dba77200011c73a4/s_p_rfkKZFQ8IYfO6L7V.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f3256dba77200011c73a4/m_p_rfkKZFQ8IYfO6L7V.jpg">बड़ा करें</a>]</p><h3>मसीह, क्रूसारोहण और पुनरुत्थान (मेस, फ़्रांस)</h3><p>870 ई. <a href="https://collections.louvre.fr/en/ark:/53355/cl010113244">लूव्र, फ़्रांस</a>।</p><img src="https://res.bibleox.com/s/img/image/simple/68c422e46594f46d35a87f10/s_p_lQNRJIXri6KJoLw3.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c422e46594f46d35a87f10/m_p_lQNRJIXri6KJoLw3.jpg">बड़ा करें</a>]</p><h3>मसीह, क्रूसारोहण (रेंस, फ़्रांस)</h3><p>870-880 ई. <a href="https://collections.louvre.fr/en/ark:/53355/cl010098469">लूव्र, फ़्रांस</a>।</p><img src="https://res.bibleox.com/s/img/image/simple/68c423bc6594f46d35a87f11/s_p_NOhnffTlgTImIczW.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c423bc6594f46d35a87f11/m_p_NOhnffTlgTImIczW.jpg">बड़ा करें</a>]</p><h2>नौवीं शताब्दी</h2><h3>मसीह का स्वर्गारोहण (थेसालोनिकी, बीज़ान्टियम)</h3><p>नौवीं-दसवीं शताब्दी। संत जॉर्ज विजयी का रोटुंडा (गोल मंदिर; मूलतः सम्राट गैलेरियस की समाधि)। भित्तिचित्र [17][18]</p><img src="https://res.bibleox.com/s/img/image/simple/686a934c5f47da2505d3ae20/s_p_klfYhHum7wZvKR9D.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686a934c5f47da2505d3ae20/m_p_klfYhHum7wZvKR9D.jpg">बड़ा करें</a>]</p><h3>मसीह, कांस्य मेडलियन (बीज़ान्टियम)</h3><p>नौवीं-दसवीं शताब्दी। मेडलियन गोल आकार के चित्रों को कहते हैं। <a href="https://www.britishmuseum.org/collection/object/H_1880-0820-9">ब्रिटिश संग्रहालय</a>। व्यास: 3.5 सेमी।</p><p>Circular medallion; bronze; bust of Christ with cruciferous nimbus holding the book of the gospel in his left hand; inscription either side.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5be2d45c75323d28a5e92/s_p_GswK2cGnuxxnLfJr.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5be2d45c75323d28a5e92/m_p_GswK2cGnuxxnLfJr.jpg">बड़ा करें</a>]</p><h3>परमेश्वर की माता का स्वर्गवास (कोइमेसिस) (बीज़ान्टियम)</h3><p>नौवीं शताब्दी का अंत। <a href="https://www.metmuseum.org/art/collection/search/464013">पाँचवें एवेन्यू पर मेट्रोपॉलिटन संग्रहालय, अमेरिका</a>। सामग्री: हाथीदाँत। 18.6 x 14.8 x 1.1 सेमी।</p><p>New York. The Metropolitan Museum of Art. "The Glory of Byzantium,". Images of the Koimesis, or the Dormition in the West, show the Virgin lying on a bier, while her soul, represented as a baby, is offered by Christ to attendant angels who will take it to heaven. The apostles, led by Saints Paul and Peter, stand witness.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5c1bf45c75323d28a5e97/s_p_0Hg1bO8KIUVBSWJs.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5c1bf45c75323d28a5e97/m_p_0Hg1bO8KIUVBSWJs.jpg">बड़ा करें</a>]</p><h3>मसीह, परमेश्वर की माता, यूहन्ना बपतिस्मा देनेवाला, प्रेरित और अन्य संत (क़ुस्तुंतुनिया)</h3><p>940-960 ई. <a href="https://collections.louvre.fr/en/ark:/53355/cl010112515">लूव्र, फ़्रांस</a>।</p><img src="https://res.bibleox.com/s/img/image/simple/68c424276594f46d35a87f12/s_p_IlqGrJe04Ic0YFWv.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c424276594f46d35a87f12/m_p_IlqGrJe04Ic0YFWv.jpg">बड़ा करें</a>]</p><h3>मसीह और प्रेरितों के चित्र वाली पट्टिका (इटली)</h3><p>नौवीं शताब्दी। <a href="https://collections.hermitagemuseum.org/entity/OBJECT/228918?page=4&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%B0&amp;index=194">हर्मिताज़, रूस</a>। माप: 12.2х10.5 सेमी</p><img src="https://res.bibleox.com/s/img/image/simple/6863c54f6480b4d285320421/s_p_aLvOvrKuilB614SS.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c54f6480b4d285320421/m_p_aLvOvrKuilB614SS.jpg">बड़ा करें</a>]</p><h2>दसवीं शताब्दी</h2><h3>मसीह, परमेश्वर की माता, यूहन्ना बपतिस्मा देनेवाला (बीज़ान्टियम)</h3><p>दसवीं शताब्दी। <a href="https://www.britishmuseum.org/collection/object/H_1923-1205-2">ब्रिटिश संग्रहालय</a>। सामग्री: हाथीदाँत। ऊँचाई: 15.5 सेमी।</p><p>Panel; ivory; carved with standing figures, Christ with the Virgin Mary and St John, below a pierced canopy; four holes for attachment in the raised border.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5be4045c75323d28a5e95/s_p_qEFeZyh2Gq5Wbvar.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5be4045c75323d28a5e95/m_p_qEFeZyh2Gq5Wbvar.jpg">बड़ा करें</a>]</p><h3>परमेश्वर की माता और बालक मसीह (क़ुस्तुंतुनिया, बीज़ान्टियम)</h3><p><a href="tel:950-1025">950-1025</a> ई. <a href="https://www.clevelandart.org/art/1925.1293">क्लीवलैंड कला संग्रहालय, अमेरिका</a>।</p><img src="https://res.bibleox.com/s/img/image/simple/68caa153205184ec278d5882/s_p_iLLZZkqfsUiACLDC.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68caa153205184ec278d5882/m_p_iLLZZkqfsUiACLDC.jpg">बड़ा करें</a>]</p><h3>मसीह और परमेश्वर की माता के चित्र वाला लटकन (बीज़ान्टियम)</h3><p>1000-1300 ई. <a href="https://www.metmuseum.org/art/collection/search/477247">पाँचवें एवेन्यू पर मेट्रोपॉलिटन संग्रहालय, अमेरिका</a>। खाल्सेडोन का कैमिया; मोती, पन्ना, गार्नेट, नीलम और सार्डोनिक्स की जड़ाई से युक्त स्वर्ण जड़ाऊ ढाँचा। कुल आकार: 7,2 x 5,5 x 1,6 सेमी। खाल्सेडोन: 1 1/2 x 1 1/4 इंच (3,8 x 3,2 सेमी)</p><img src="https://res.bibleox.com/s/img/image/simple/68c1bc1a6594f46d35a87e6d/s_p_VcHt7eFMtZq1I1lY.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1bc1a6594f46d35a87e6d/m_p_VcHt7eFMtZq1I1lY.jpg">बड़ा करें</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/68c1bc176594f46d35a87e6c/s_p_LwWdQj6J4ehbmMh9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1bc176594f46d35a87e6c/m_p_LwWdQj6J4ehbmMh9.jpg">बड़ा करें</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c1bc1f6594f46d35a87e6e/m_p_gT2TXueTg5pmDsuZ.jpg">और बड़ा</a>]</p><h3>मसीह के चित्र वाला क्रूस (बीज़ान्टियम)</h3><p>दसवीं-ग्यारहवीं शताब्दी। कांस्य। 6.6х4.2 सेमी। <a href="https://collections.hermitagemuseum.org/entity/OBJECT/228297?page=56&amp;query=%D0%BA%D1%80%D0%B5%D1%81%D1%82&amp;sort=112&amp;index=2755">हर्मिताज़, रूस</a>।</p><img src="https://res.bibleox.com/s/img/image/simple/68c11f5b6594f46d35a87e2d/s_p_6uw78FFpsxpItSzn.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c11f5b6594f46d35a87e2d/m_p_6uw78FFpsxpItSzn.jpg">बड़ा करें</a>]</p><h3>मसीह के चित्र वाला क्रूस (बीज़ान्टियम)</h3><p>दसवीं-ग्यारहवीं शताब्दी। कांस्य। 7.7х7 सेमी। <a href="https://collections.hermitagemuseum.org/entity/OBJECT/482789?page=51&amp;query=%D0%BA%D1%80%D0%B5%D1%81%D1%82&amp;sort=112&amp;index=2501">हर्मिताज़, रूस</a>।</p><img src="https://res.bibleox.com/s/img/image/simple/68c11fab6594f46d35a87e2e/s_p_jfgfrZ4X7jcBXG9D.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c11fab6594f46d35a87e2e/m_p_jfgfrZ4X7jcBXG9D.jpg">बड़ा करें</a>]</p><h3>संतों के आइकॉन वाला क्रूस (खेरसोनेस)</h3><p>दसवीं शताब्दी। कांस्य, नक़्क़ाशी। <a href="https://collections.hermitagemuseum.org/entity/OBJECT/372835?page=5&amp;fundcoll=1420520446__1413747286&amp;index=229">हर्मिताज़, रूस</a>।</p><img src="https://res.bibleox.com/s/img/image/simple/68c4191a6594f46d35a87f02/s_p_iFiSEGM9EbRIhhtD.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c4191a6594f46d35a87f02/m_p_iFiSEGM9EbRIhhtD.jpg">बड़ा करें</a>]</p><h3>संत दिमित्री थेसालोनिकी (बीज़ान्टियम)</h3><p><a href="tel:950-1000">950-1000</a> ई. <a href="https://www.metmuseum.org/art/collection/search/465946">पाँचवें एवेन्यू पर मेट्रोपॉलिटन संग्रहालय, अमेरिका</a>। सामग्री: हाथीदाँत। 19.7 x 12.1 x 1 सेमी।</p><p>Standing erect, a spear in his hand and a shield at his side, Saint Demetrios is shown ready to protect the Christian faithful. The name of the popular Byzantine military saint is inscribed in two parts in Greek. Martyred in Thessalonike, the second most important city of the empire in the early centuries of the church, he has long been the patron saint of that metropolis. Images of saints in military dress are rare in Early Byzantine art (they appear on the chalices of the Attarouthi Treasure) but typical of the Middle Byzantine period.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5c38445c75323d28a5e98/s_p_ZeZuXGqxAAyDuPBA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5c38445c75323d28a5e98/m_p_ZeZuXGqxAAyDuPBA.jpg">बड़ा करें</a>]</p><h2>ग्यारहवीं शताब्दी</h2><h3>जुलूस का क्रूस: मसीह, परमेश्वर की माता, महादूत मीकाएल और गब्रिएल (बीज़ान्टियम)</h3><p>1000-1050 ई. <a href="https://www.metmuseum.org/art/collection/search/466251">पाँचवें एवेन्यू पर मेट्रोपॉलिटन संग्रहालय, अमेरिका</a>। 59.5 x 43 x 2.2 सेमी।</p><img src="https://res.bibleox.com/s/img/image/simple/68b5e3e645c75323d28a5e9b/s_p_Ft65PrnBUmI6wDAc.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5e3e645c75323d28a5e9b/m_p_Ft65PrnBUmI6wDAc.jpg">बड़ा करें</a>]</p><h3>जुलूस का क्रूस, मसीह, परमेश्वर की माता, यूहन्ना बपतिस्मा देनेवाला (बीज़ान्टियम)</h3><p>1050 ई. <a href="https://www.clevelandart.org/art/1970.36">क्लीवलैंड कला संग्रहालय, अमेरिका</a>।</p><img src="https://res.bibleox.com/s/img/image/simple/68ca921d205184ec278d5871/s_p_PrD5y34JBpT95quf.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68ca921d205184ec278d5871/m_p_PrD5y34JBpT95quf.jpg">बड़ा करें</a>]</p><h3>जुलूस का क्रूस, संत सव्वा (बीज़ान्टियम)</h3><p>1050 ई. <a href="https://www.metmuseum.org/art/collection/search/697956">पाँचवें एवेन्यू पर मेट्रोपॉलिटन संग्रहालय, अमेरिका</a>। पिछली ओर के मध्य में संत सव्वा चित्रित हैं, और किनारों पर अन्य संत भिक्षु। चाँदी। 32.4 × 44.8 × 5.7 सेमी।</p><img src="https://res.bibleox.com/s/img/image/simple/68c1c6546594f46d35a87e76/s_p_FO8cb8Ec2FqTDFz8.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1c6546594f46d35a87e76/m_p_FO8cb8Ec2FqTDFz8.jpg">बड़ा करें</a>]</p><h3>जुलूस का क्रूस, मसीह (खेरसोनेस)</h3><p>ग्यारहवीं शताब्दी। सामग्री: कांस्य, लोहा; ढलाई, उभारना, नक़्क़ाशी। आकार: 36.5х27.5 सेमी। <a href="https://collections.hermitagemuseum.org/entity/OBJECT/372834?page=3&amp;fundcoll=1420520446__1413747286&amp;index=106">हर्मिताज़, रूस</a>।</p><img src="https://res.bibleox.com/s/img/image/simple/68c418616594f46d35a87f01/s_p_ytqdkwIa6FDSikCw.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c418616594f46d35a87f01/m_p_ytqdkwIa6FDSikCw.jpg">बड़ा करें</a>]</p><h3>आइकॉन «मसीह सर्वशक्तिमान» का भाग (बीज़ान्टियम, क्रीमिया)</h3><p>1050-1100 ई. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/372766?page=40&amp;query=%D0%B8%D0%BA%D0%BE%D0%BD%D0%B0&amp;index=1999">हर्मिताज़, रूस</a>।</p><img src="https://res.bibleox.com/s/img/image/simple/6863bfff6480b4d285320412/s_p_XwuOAkY6yR10NT7b.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863bfff6480b4d285320412/m_p_XwuOAkY6yR10NT7b.jpg">बड़ा करें</a>]</p><h3>परमेश्वर की माता बालक मसीह के साथ (क़ुस्तुंतुनिया)</h3><p>1000-1015 ई. <a href="https://collections.louvre.fr/en/ark:/53355/cl010101133">लूव्र, फ़्रांस</a>।</p><img src="https://res.bibleox.com/s/img/image/simple/68c43b8c6594f46d35a87f16/s_p_rQNvoLa9Vu1WmSB2.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c43b8c6594f46d35a87f16/m_p_rQNvoLa9Vu1WmSB2.jpg">बड़ा करें</a>]</p><h3>परमेश्वर की माता, ओरांता (क़ुस्तुंतुनिया)</h3><p>1000-1200 ई. <a href="https://collections.louvre.fr/en/ark:/53355/cl010114443">लूव्र, फ़्रांस</a>।</p><img src="https://res.bibleox.com/s/img/image/simple/68c43bcc6594f46d35a87f17/s_p_7a5oJnVWqjfeu67t.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c43bcc6594f46d35a87f17/m_p_7a5oJnVWqjfeu67t.jpg">बड़ा करें</a>]</p><h3>परमेश्वर की माता, महादूत मीकाएल, संत फ़्योदोर (बीज़ान्टियम)</h3><p>ग्यारहवीं-बारहवीं शताब्दी। <a href="https://www.britishmuseum.org/collection/object/H_1981-0103-1">ब्रिटिश संग्रहालय</a>। 108х95 मिमी।</p><p>Relief icon; rectangular bronze plaque cast in low relief with full-length Hodegetria flanked by the Archangel Michael and St Theodore, each wearing a girdled tunic beneath a chlamys with decorated tablion; the figures are identified by intaglio inscriptions; the whole is surrounded by a raised border with a running vine scroll; traces of solder at sides and back.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5be3545c75323d28a5e93/s_p_DFDGZ6kHm0khLKRD.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5be3545c75323d28a5e93/m_p_DFDGZ6kHm0khLKRD.jpg">बड़ा करें</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5be3b45c75323d28a5e94/m_p_FfmDAHv29BAMxval.jpg">और बड़ा</a>]</p><h3>संत दिमित्री का आइकॉन (बीज़ान्टियम)</h3><p>1040-1060 ई. <a href="https://collections.louvre.fr/en/ark:/53355/cl010115478">लूव्र, फ़्रांस</a>। 9,4 х 6,3 х 0,6 सेमी।</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c0c36594f46d35a87ec0/s_p_dj04XPO3pwvzkLzr.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c0c36594f46d35a87ec0/m_p_dj04XPO3pwvzkLzr.jpg">बड़ा करें</a>]</p><h3>संत दिमित्री के चित्र और शिलालेख वाला मोलिव्दोवुल (सीसी मुहर) (बीज़ान्टियम)</h3><p>ग्यारहवीं शताब्दी। <a href="https://collections.hermitagemuseum.org/entity/OBJECT/269619?page=20&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=958">हर्मिताज़, रूस</a>।</p><img src="https://res.bibleox.com/s/img/image/simple/6863c2556480b4d285320418/s_p_oqzix7avanFfe61o.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c2556480b4d285320418/m_p_oqzix7avanFfe61o.jpg">बड़ा करें</a>]</p><h3>संत के कमर तक के चित्र वाला मोलिव्दोवुल (बीज़ान्टियम)</h3><p>ग्यारहवीं शताब्दी। <a href="https://collections.hermitagemuseum.org/entity/OBJECT/267492?page=14&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=651">हर्मिताज़, रूस</a>।</p><img src="https://res.bibleox.com/s/img/image/simple/6863c3196480b4d28532041a/s_p_VySwl31Z41rar6d3.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c3196480b4d28532041a/m_p_VySwl31Z41rar6d3.jpg">बड़ा करें</a>]</p><h3>संत के चित्र वाली लटकनेवाली मुहर (बीज़ान्टियम)</h3><p>ग्यारहवीं शताब्दी। <a href="https://collections.hermitagemuseum.org/entity/OBJECT/483272?query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=21">हर्मिताज़, रूस</a>।</p><img src="https://res.bibleox.com/s/img/image/simple/6863c4276480b4d28532041d/s_p_5EJuZ18em5TsdUwA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c4276480b4d28532041d/m_p_5EJuZ18em5TsdUwA.jpg">बड़ा करें</a>]</p><h3>संत के चित्र वाली लटकनेवाली मुहर (बीज़ान्टियम)</h3><p>ग्यारहवीं-बारहवीं शताब्दी। <a href="https://collections.hermitagemuseum.org/entity/OBJECT/483278?query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=35">हर्मिताज़, रूस</a>।</p><img src="https://res.bibleox.com/s/img/image/simple/6863c4616480b4d28532041e/s_p_H8LrRkkjwBHlc322.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c4616480b4d28532041e/m_p_H8LrRkkjwBHlc322.jpg">बड़ा करें</a>]</p><h2>बारहवीं शताब्दी</h2><h3>मसीह, परमेश्वर की माता, भविष्यद्वक्ता यूहन्ना (क़ुस्तुंतुनिया, बीज़ान्टियम)</h3><p>परमेश्वर की प्रज्ञा का मंदिर (हागिया सोफ़िया)। मंदिर का भित्तिचित्र[5]</p><img src="https://res.bibleox.com/s/img/image/simple/6750078ddba77200011c73af/s_p_EcliI0JFeV1uu1LU.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6750078ddba77200011c73af/m_p_EcliI0JFeV1uu1LU.jpg">बड़ा करें</a>]</p><h3>मसीह (क़ुस्तुंतुनिया, बीज़ान्टियम)</h3><p>परमेश्वर की प्रज्ञा का मंदिर (हागिया सोफ़िया)।</p><img src="https://res.bibleox.com/s/img/image/simple/674f332ddba77200011c73a6/s_p_1PCMz3Y4EZgbSJL0.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f332ddba77200011c73a6/m_p_1PCMz3Y4EZgbSJL0.jpg">बड़ा करें</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686cf10d5f47da2505d3ae4e/s_p_ZHUiumbGoeJMn4GO.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686cf10d5f47da2505d3ae4e/m_p_ZHUiumbGoeJMn4GO.jpg">बड़ा करें</a>]</p><h3>परमेश्वर की माता (क़ुस्तुंतुनिया, बीज़ान्टियम)</h3><p>परमेश्वर की प्रज्ञा का मंदिर (हागिया सोफ़िया)।</p><img src="https://res.bibleox.com/s/img/image/simple/674f3332dba77200011c73a7/s_p_WvZb6UestGwJUzJr.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f3332dba77200011c73a7/m_p_WvZb6UestGwJUzJr.jpg">बड़ा करें</a>]</p><h3>यूहन्ना बपतिस्मा देनेवाला, भविष्यद्वक्ता (क़ुस्तुंतुनिया, बीज़ान्टियम)</h3><p>परमेश्वर की प्रज्ञा का मंदिर (हागिया सोफ़िया)।</p><img src="https://res.bibleox.com/s/img/image/simple/674f357ddba77200011c73a8/s_p_hdfr9cx0ZPTZyn6N.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f357ddba77200011c73a8/m_p_hdfr9cx0ZPTZyn6N.jpg">बड़ा करें</a>]</p><h3>परमेश्वर की माता बालक यीशु के साथ (क़ुस्तुंतुनिया)</h3><p>बारहवीं शताब्दी का पहला तिहाई। परमेश्वर की माता का व्लादिमीर आइकॉन। लकड़ी, टेम्पेरा।</p><img src="https://res.bibleox.com/s/img/image/simple/674f18e4dba77200011c7399/s_p_0uaArAqVhNX9r0gV.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f18e4dba77200011c7399/m_p_0uaArAqVhNX9r0gV.jpg">बड़ा करें</a>]</p><h3>परमेश्वर की माता (बीज़ान्टियम, सीरिया, तारतूस)</h3><p>बारहवीं शताब्दी। <a href="https://www.britishmuseum.org/collection/object/H_1889-0511-13">ब्रिटिश संग्रहालय</a>। सामग्री: हाथीदाँत, 41х47 मिमी।</p><p>Relief icon; pale grey-green steatite; rounded at the top and square below; bust of the Virgin, her mantle drawn over her head, with St Andrew's cross on it; her hands held in front with palms outwards, inscription either side of her.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5be2645c75323d28a5e91/s_p_StVNlxiOjocLLsz5.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5be2645c75323d28a5e91/m_p_StVNlxiOjocLLsz5.jpg">बड़ा करें</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5be2245c75323d28a5e90/m_p_yHJ3BkdNwVGdLb4m.jpg">और बड़ा</a>]</p><h3>महाशहीद थेसालोनिकी के दिमित्री और डीकन (थेसालोनिकी, बीज़ान्टियम)</h3><p>बारहवीं शताब्दी। दक्षिण स्तंभ के पूर्वी फलक पर मोज़ेक।</p><img src="https://res.bibleox.com/s/img/image/simple/68698a155f47da2505d3ae16/s_p_n7AgnVLPvfeBX5Qq.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68698a155f47da2505d3ae16/m_p_n7AgnVLPvfeBX5Qq.jpg">बड़ा करें</a>]</p><h3>परमेश्वर की माता ओदिगित्रिया का आइकॉन (बीज़ान्टियम, खेरसोनेस)</h3><p>बारहवीं शताब्दी का उत्तरार्ध। <a href="https://collections.hermitagemuseum.org/entity/OBJECT/372931?page=11&amp;fundcoll=1420520446&amp;index=536">हर्मिताज़, रूस</a>। 6.8х5 सेमी</p><img src="https://res.bibleox.com/s/img/image/simple/6863bf2f6480b4d285320411/s_p_10YV8HIpAzMNCgvp.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863bf2f6480b4d285320411/m_p_10YV8HIpAzMNCgvp.jpg">बड़ा करें</a>]</p><h2>तेरहवीं शताब्दी</h2><h3>प्रभु सर्वशक्तिमान (आथोस)</h3><p>हिलंदार मठ, पवित्र पर्वत आथोस।</p><img src="https://res.bibleox.com/s/img/image/simple/69406737205184ec278d6fd8/s_p_hTWcEC5QtmbCrC5t.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69406737205184ec278d6fd8/m_p_hTWcEC5QtmbCrC5t.jpg">बड़ा करें</a>]</p><h3>परमेश्वर की माता बालक यीशु के साथ (ओदिगित्रिया, आथोस)</h3><p>हिलंदार मठ, पवित्र पर्वत आथोस।</p><img src="https://res.bibleox.com/s/img/image/simple/674f0cfadba77200011c7395/s_p_mQMRA7FGLEbqOYIx.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f0cfadba77200011c7395/m_p_mQMRA7FGLEbqOYIx.jpg">बड़ा करें</a>]</p><h2>चौदहवीं शताब्दी</h2><h3>प्रभु सर्वशक्तिमान</h3><p>आइकॉन-चित्रकार मनुएल पानसेलिन।</p><img src="https://res.bibleox.com/s/img/image/simple/674f28d1dba77200011c739e/s_p_ma0z14hIFXCiEj7S.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f28d1dba77200011c739e/m_p_ma0z14hIFXCiEj7S.jpg">बड़ा करें</a>]</p><h3>परमेश्वर की माता (थेसालोनिकी)</h3><p>1310-1315 ई. ओरांता। थेसालोनिकी, ग्रीस में संत निकोलस ओर्फ़ानोस के गिरजाघर का भित्तिचित्र।</p><img src="https://res.bibleox.com/s/img/image/simple/674f29b7dba77200011c739f/s_p_PSuCdQIYdR4IYZgA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f29b7dba77200011c739f/m_p_PSuCdQIYdR4IYZgA.jpg">बड़ा करें</a>]</p><h3>परमेश्वर की सबसे पवित्र माता का मंदिर में प्रवेश (क़ुस्तुंतुनिया)</h3><p>लगभग 1316–1321 ई. काहिरी जामी, ख़ोरा मठ, इस्तांबुल (क़ुस्तुंतुनिया), तुर्की।</p><img src="https://res.bibleox.com/s/img/image/simple/675343bddba7720001cd0ddf/s_p_AtF4vpmhv6FneUfA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/675343bddba7720001cd0ddf/m_p_AtF4vpmhv6FneUfA.jpg">बड़ा करें</a>]</p><h2>पंद्रहवीं शताब्दी</h2><h3>प्रेरित पौलुस (रूस)</h3><p>1410 का दशक। रचयिता: संत आंद्रेई रुबल्योव। राजकीय त्रेत्याकोव गैलरी, मॉस्को, रूस।</p><img src="https://res.bibleox.com/s/img/image/simple/6909fbca205184ec278d6e6a/s_p_ok25vNdlaQMM5P3c.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6909fbca205184ec278d6e6a/m_p_ok25vNdlaQMM5P3c.jpg">बड़ा करें</a>]</p><h2>आइकॉनों के संग्रह</h2><ol><li><p>कैटाकॉम्ब के आइकॉन-चित्रण का संग्रह, Word फ़ाइल: <a href="https://disk.yandex.ru/d/mHc8dxUdHGqMEQ">लिंक</a></p></li><li><p>आइकॉन-चित्रकार मनुएल पानसेलिन की रचनाएँ (तेरहवीं-चौदहवीं शताब्दी): <a href="https://vk.com/album-20034910_224123875">https://vk.com/album-20034910_224123875</a></p></li></ol>
