  - src: KPgB_Христианские_захоронения_и_надписи
    path: Bu3i_ईसाई_कब्रें_और_शिलालेख
    title: "ईसाई कब्रें और शिलालेख"
    body: |-
      <h2>प्रथम शताब्दियों के मसीहियों की कब्रों के शिलालेख</h2><p>अप्पियन मार्ग पर तथाकथित «प्रेरितों के स्मारक» की त्रिक्लिया में के शिलालेख — उस पवित्र स्थल के, जो III शताब्दी के मध्य में, 238 और 260 ई. के बीच बनाया गया था। उसी समय, III शताब्दी में, त्रिक्लिया में «<em>Paule ed Petre petite pro Victore</em>» की भावना के मसीही प्रार्थना-शिलालेख और उन जैसे अन्य शिलालेख (नीचे दिए गए हैं) प्रकट होने लगे। उन्हें महान कॉन्स्टेंटिन के युग तक उत्कीर्ण किया जाता रहा। [1]</p><img src="https://res.bibleox.com/s/img/image/simple/483/s_p_1D8zprHe86ZZn5O9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/483/m_p_1D8zprHe86ZZn5O9.jpg">बड़ा करें</a>]</p><h3><strong>अपने मन में, अपनी प्रार्थनाओं में स्मरण रखें </strong>(in mente habete, in orationibus vestris):</h3><p>12912: [Petre et] Paul[e] | in m[ente] abete in | ora[tion]ibus vestris/ — «<strong>हे पतरस और पौलुस, अपने मन में, अपनी प्रार्थनाओं में स्मरण रखें...»</strong></p><h3><strong>मध्यस्थता करें </strong>(petite) (अथवा «प्रार्थना करें», «विनती करें»)</h3><p>12918: [Paul]e et Petre petite | [pro] nobis omnibus/ — <strong>«हे पौलुस और पतरस, हम सब के लिए मध्यस्थता करें!»</strong></p><p>12931: Petr[e] et Pau[l]e petite | pro [Le]ontium / — <strong>«हे पतरस और पौलुस, लियोन्तियुस के लिए मध्यस्थता करें!»</strong></p><p>12933: Pa[ul]e et Pet|re apetite pro Da|tivu in perpetu`u´m/ — <strong>«हे पौलुस और पतरस, दातिवुस के लिए सदा के लिए मध्यस्थता करें!»</strong></p><p>12989: Paule ed Petre petite | pro Victore/ — <strong>«हे पौलुस और पतरस, विक्टर के लिए मध्यस्थता करें!»</strong></p><p>12946: [Petre et Pa]ulae spir[ita sancta vestra petant pro - - -]/ — <strong>«हे पतरस और पौलुस, आपकी पवित्र आत्माएँ [- - -] के लिए मध्यस्थता करें!»</strong></p><h3><strong>conservate</strong> — <strong>रक्षा करें</strong> (अथवा «सुरक्षित रखें»)</h3><p>12991: Petre et Paule cons[ervate - - -]/ — <strong>«हे पतरस और पौलुस, [- - -] की रक्षा करें!»</strong></p><p>12996: sa[lva Paule et] | Petr[e - - - et] | Mart[yrium et] | conse[rvate in] | do[mino - - -]/ — <strong>«हे पौलुस और पतरस, बचाएँ [- - -] और मार्तीरियुस को, और प्रभु में [- - -] की रक्षा करें!»</strong></p><p>13026: [- - - roga]mus | [conse]rvate nos [omnes]/ — <strong>«[- - -] हम विनती करते हैं, हम सब की रक्षा करें!»</strong></p><h3><strong>सरल आह्वान</strong></h3><p>12909: Petr[e et Paule]/ — <strong>«हे पतरस और पौलुस!»</strong></p><h3><strong>पापियों के लिए सहायता</strong></h3><p>12967: Petre et Paule sub|venite Prim[o] | peccatori/ — <strong>«हे पतरस और पौलुस, पापी प्रिमुस की सहायता के लिए आएँ!»</strong></p><h3><strong>अनेक आह्वान यूनानी में अथवा यूनानी अक्षरों का प्रयोग करते हुए लातीनी में रचे गए हैं</strong></h3><p>12927: Παῦλε {μ} καί | μου πατ|ρός/ — <strong>«हे पौलुस, और मेरे पिता को (सहायता करें)!»</strong></p><p>12997: [Παυλ]ε ετ Πετ[ρε ιν μεν]/[τε ν]ος αβετε [ιν ορα]/[τι]ωνες βεστ[ρας]/ — <strong>«हे पौलुस और पतरस, अपने मन में, अपनी प्रार्थनाओं में स्मरण रखें...»</strong></p><p>13045: [Πα]υ[λε ετ Πετρε] | [ι]ν με[ντε αβετε] | Αὐφίδ[ιον υἱόν - - -] | μου/ — <strong>«हे पौलुस और पतरस, मेरे पुत्र औफ़ीदियुस को मन में स्मरण रखें!»</strong></p><p>13069: Πέτρε Παίτρε μνημόνευαι | Τιμοκράτην καὶ Εὐ|τυχείαν κινα(?) καὶ | ἐσώρα(?) ++ [- - -]/ — <strong>«हे पतरस, हे पतरस, तिमोक्रातुस और एव्तिखिया को स्मरण करें, और (...) ++ [- - -]!»</strong></p><p>13045: [κομμ]ανδαμ[ους? - - -]/<strong> </strong>— <strong>«हम [- - -] को सौंपते हैं».</strong></p><p>13049: Παῦλε καὶ Π[έτρε ἔχετε] / μνί[α]ς/ — <strong>«हे पौलुस और पतरस, [- - -] का स्मरण रखें!»</strong></p><p>13055: [Παῦλε καὶ Πέτ]ρε εἰς μνε[ίαν] / [ἔχετε τὸν ᾿Ιρ]ίνες φίλι[ον]/ — <strong>«हे पौलुस और पतरस, ईरिने के प्रियजन को स्मरण करें».</strong></p><p>13070: Παυλε Πετρε | Χαλκηδονι ανιμα | βωβυς κομαν|[δ]ω Λαυrους/ — <strong>«हे पौलुस और पतरस, मैं, लावर (लावरुसियुस?), आपको खल्कीदोनियुस की आत्मा सौंपता हूँ!»</strong></p><p>13071: &lt;Π&gt;α[ῦλ]ος καὶ | Π[έτρο]ς συν|τηρή[σα]τε θ(εο)ῦ δούλους | πνεύματα | ἅγεια συντη|ρήσαται ἡμᾶ|ς ἴνα πολλοῖς | ἔτεσε[ι ζῶμεν]/ — <strong>«हे पौलुस और पतरस, परमेश्वर के दासों को सहारा दें! हे पवित्र आत्माओं, हमें सहारा दें, जिससे हम बहुत वर्षों तक जीवित रहें!»</strong></p><p>13073: [Παυλε] ετ Πετρε | [ιν με]ντε [ν]ος αβε|[τοτε εἰς το]ὺς ἐῶ[νας]/<strong> </strong>— <strong>«हे पौलुस और पतरस, सदा के लिए मन में स्मरण रखें...»</strong></p><h3><strong>promisit / votum fecit</strong> — <strong>प्रतिज्ञा की</strong></h3><p>13091: [- - - i]dus m[- - -] | Eulogius votum f[ecit]/ — <strong>«[- - -] में [- - -] इद्स के दिन [- - -] एवलोगियुस ने प्रतिज्ञा की [- - -]».</strong></p><h3><strong>refrigerium का उल्लेख</strong> (स्मरण-भोज):</h3><p>12942: refrigerav[it] | [F]elicissimus cum s[uis]/ — <strong>«फेलिकिस्सिमुस ने अपने परिवार के साथ भोज का आयोजन किया।»</strong></p><p>12981: Petro et Paulo | Tomius Coelius | refri`ger´&lt;i&gt;um feci/ — <strong>«पतरस और पौलुस के लिए मैं, तोमियुस त्सेलियुस, ने भोज का आयोजन किया»</strong></p><p>13003: [---] at Paulu[m] | et Pet[rum] | refri[geravi - - -]/ — <strong>«पौलुस और पतरस के यहाँ मैंने भोज का आयोजन किया»</strong></p><p>स्रोत: <a href="http://csla.history.ox.ac.uk/record.php?recid=E05087">http://csla.history.ox.ac.uk/record.php?recid=E05087</a></p><hr><h3>परमेश्वर को संबोधन</h3><ul><li><p>DEVS TE PRECOR VТ PARADISVM LVCIS POSSIT VIDERE – «<strong>हे प्रभु, मैं तुझसे विनती करता हूँ, वह स्वर्ग के प्रकाश को देख सके</strong>».</p></li><li><p>DOMINE NE QVANDO ADVMBRETVR SPIRITVS VENERES – «<strong>हे प्रभु, कभी ऐसा न हो कि वेनेरा की आत्मा पर अन्धकार छा जाए</strong>».</p></li></ul><h3>मृतकों की मध्यस्थता के लिए विनती</h3><ul><li><p>ET IN ORATIONIS TVIS ROGES PRO NOBIS QVIA SCIMVS TE ☧ – «<strong>अपनी प्रार्थनाओं में हमारे लिए प्रार्थना कर, क्योंकि हम जानते हैं कि तू मसीह में है</strong>».</p></li><li><p>ORO SCIO NAMQVE BEATAM – «<strong>मैं तुझसे विनती करता हूँ, क्योंकि मैं जानता हूँ कि तू धन्यता में है</strong>».</p></li><li><p>ORA PRO PARENTI BVS TVIS – «<strong>अपने संबंधियों के लिए प्रार्थना कर</strong>».</p></li><li><p>PETE PRO NOS VТ SALVI SIMVS – «<strong>हमारे लिए प्रार्थना कर, जिससे हम उद्धार पाएँ</strong>».</p></li><li><p>IN ORATIONIS TVIS ROGES PRO NOBIS – «<strong>अपनी प्रार्थनाओं में हमारे लिए विनती कर</strong>».</p></li><li><p>ATTICE SPIRITVS TVS IN BONV ORA PRO PARENTIBVS TVIS – «<strong>हे अत्तिकुस, तेरी आत्मा धन्यता में है, अपने संबंधियों के लिए प्रार्थना कर</strong>».</p></li></ul><p>यहाँ कुछ ही भाग दिया गया है। शेष सामग्री से लिंक के द्वारा परिचित हुआ जा सकता है।</p><h3><strong>शिलालेख और प्रतीकात्मक चित्र</strong></h3><ul><li><p>VIVAS शब्द, अर्थात् «<strong>जीवित रह</strong>», जो कब्रों पर भी बहुत बार लिखा मिलता है, मृतक के लिए अनन्त जीवन और धन्यता की अभिलाषा व्यक्त करता है;</p></li><li><p>VIVAS IN DEO – «<strong>परमेश्वर में जीवित रह</strong>»;</p></li><li><p>VIBAS IN SANCTIS – «<strong>पवित्र लोगों के बीच जीवित रह</strong>».</p></li></ul><h3>मृतक ने उद्धार प्राप्त कर लिया</h3><p>कभी-कभी यह अधिक निश्चयात्मक रूप में कहा गया है कि दफ़नाया गया व्यक्ति चुने हुओं में है:</p><ul><li><p>ACCEPIT REQVI EM IN DEO – «<strong>उसने परमेश्वर में शान्ति प्राप्त की</strong>»;</p></li><li><p>SCIMVS ТЕ IN – «<strong>हम जानते हैं कि तू मसीह में है</strong>»;</p></li><li><p>FRVCTVOSVS ANIMA ТVА СVМ IVSTIS – «<strong>फ्रुक्तुओसुस, तेरी आत्मा धर्मियों के साथ है</strong>»;</p></li><li><p>REQVI EM ADCEPIT IN DEO PATRE NOSTRO ET CHRISTO EIVS – «<strong>उसने हमारे पिता परमेश्वर में और उसके मसीह में शान्ति प्राप्त की</strong>»;</p></li><li><p>ACCEPTA APVD DEVM – «<strong>परमेश्वर द्वारा स्वीकार की गई</strong>»;</p></li><li><p>RECEPTVS AD DEVM – «<strong>परमेश्वर द्वारा ग्रहण किया गया</strong>»;</p></li><li><p>ТЕСVМ PAX CHRISTI – «<strong>मसीह की शान्ति तेरे साथ</strong>»;</p></li><li><p>SEMPER VIVE IN РАСЕ – «<strong>सदा शान्ति में जीवित रह</strong>»;</p></li><li><p>IN РАСЕ ET IN DOMO AETERNA DEI – «<strong>शान्ति में और परमेश्वर के अनन्त भवन में</strong>».</p></li><li><p>VIVI IN GLORIA DEI ET IN PACE DOMINI NOSTRI ☧ – «<strong>तू परमेश्वर की महिमा में और हमारे प्रभु मसीह की शान्ति में जीवित है</strong>» – यहाँ उद्धारक का नाम उसके मोनोग्राम ☧ से दर्शाया गया है;</p></li><li><p>ELATVS EST, जो एक प्रकार का उद्गार भी है और केवल एक या दो बार मिलता है, इस प्रकार अनूदित किया जा सकता है: «<strong>वह परमेश्वर के पास उठा लिया गया</strong>».</p></li></ul><h3>स्वर्ग — प्रकाश का स्थान</h3><p>प्रथम मसीहियों के कब्र के शिलालेखों में स्वर्ग को प्रकाश और तेज का स्थान कहा गया है; यहाँ कुछ उदाहरण हैं:</p><ul><li><p>CVIVS SPIRITVS IN LVCE DOMINI SVSCEPTVS EST – «<strong>उसकी आत्मा परमेश्वर के प्रकाश में ग्रहण की गई</strong>».</p></li><li><p>IN CHRISTVM CREDENS PREMIA LVCIS АВЕТ – «<strong>मसीह पर विश्वास करते हुए उसे प्रकाश पुरस्कार के रूप में प्राप्त है</strong>».</p></li><li><p>AETERNA TIBI LUX TIMOTHEA IN ☧– «<strong>हे तिमोथी, तुझे मसीह में अनन्त प्रकाश (मिले)</strong>».</p></li></ul><h3></h3><p>पुस्तक: <strong>ए. फ़ॉन फ़्रिकेन. रोम के कैटाकॉम्ब और आरम्भिक मसीही कला के स्मारक. मॉस्को: के. ती. सोल्दातेनकोव का प्रकाशन, 1872–1877–1880–1885. </strong>[2]</p>
