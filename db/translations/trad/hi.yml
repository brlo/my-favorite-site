    title: "मुख्य संग्रह में शामिल न हुई विविध प्राचीन छवियाँ"
    body: |-
      <h2>संत जेनारियस के कैटाकॉम्ब (Catacombe di San Gennaro) [1]</h2><h3>संत जेनारियस, बेनेवेंतो एवं पुतियोली (नेपल्स) के बिशप, पुरोहित-शहीद</h3><p>सान जेन्नारो (संत जेनारियस) के कैटाकॉम्ब, नेपल्स। चौथी शताब्दी का भित्तिचित्र। यह पूरी तरह स्पष्ट नहीं है कि यहाँ किसे चित्रित किया गया है। ऊपर लिखा है: SANCTOMARTYRIIANVARIO (पवित्र शहीद जेनारियस)। साथ ही, किसी कारण से यहाँ एक युवक चित्रित है। यह भी समझ नहीं आता कि ऐसा निंब क्यों है।</p><p>रूढ़िवादी कलीसिया में इस संत के बारे में जानकारी वाला पृष्ठ: <a href="https://days.pravoslavie.ru/name/890.html">https://days.pravoslavie.ru/name/890.html</a></p><p>इस भित्तिचित्र के बारे में विकिपीडिया पर पृष्ठ। पोलिश भाषा में, परंतु उपयोगी जानकारी के साथ: <a href="https://pl.wikipedia.org/wiki/January_z_Benewentu">https://pl.wikipedia.org/wiki/January_z_Benewentu</a></p><img src="https://res.bibleox.com/s/img/image/simple/686e6aa95f47da2505d3ae6e/s_p_RCtXSS4uiuO9E0Qf.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686e6aa95f47da2505d3ae6e/m_p_RCtXSS4uiuO9E0Qf.jpg">बड़ा करें</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686e56775f47da2505d3ae67/m_p_XhI4Ni1rKZ949Zi1.jpg">संस्करण 2</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686e54755f47da2505d3ae66/s_p_zKsSelu839AuImaV.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686e54755f47da2505d3ae66/m_p_zKsSelu839AuImaV.jpg">बड़ा करें</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686e57135f47da2505d3ae68/m_p_faNUwXKGPaVtmUwW.jpg">संस्करण 2</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686e6aec5f47da2505d3ae70/s_p_2fvyFxXewVLu06NV.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686e6aec5f47da2505d3ae70/m_p_2fvyFxXewVLu06NV.jpg">बड़ा करें</a>]</p><h3>ईसाई स्त्री सेरुला</h3><p>नीचे का शिलालेख: «CERVLA IN PACE» (सेरुला शांति में), पाँचवीं–छठी शताब्दी। [3]</p><img src="https://res.bibleox.com/s/img/image/simple/686e4d5c5f47da2505d3ae63/s_p_1dqPUS5wghY1DrdP.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686e4d5c5f47da2505d3ae63/m_p_1dqPUS5wghY1DrdP.jpg">बड़ा करें</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686e58705f47da2505d3ae6a/m_p_r6sua9UNLBhgIZ06.jpg">संस्करण 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686e58625f47da2505d3ae69/m_p_6KViYk7KWJDrIa8l.jpg">संस्करण 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686e6ad15f47da2505d3ae6f/m_p_q9ocVtWoayH4BxtB.jpg">संस्करण 4</a>]</p><h3>तेओतेक्नुस का परिवार</h3><blockquote><p>फेओतेक्नुस (तेओतेक्नुस) परिवार का आर्कोसोलियम। शोध से पता चला कि सबसे पहले एक लड़की की मृत्यु हुई। ताक में उसके चित्र वाला भित्तिचित्र बनाया गया था। फिर उस पुरुष की मृत्यु हुई। पहले भित्तिचित्र के ऊपर एक नया भित्तिचित्र बनाया गया, अब पिता के साथ। सबसे अंत में उस स्त्री की मृत्यु हुई, और ताक में उनका सामूहिक चित्र प्रकट हुआ।</p></blockquote><img src="https://res.bibleox.com/s/img/image/simple/686e6be45f47da2505d3ae71/s_p_xNoWgh6wacZ3al1R.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686e6be45f47da2505d3ae71/m_p_xNoWgh6wacZ3al1R.jpg">बड़ा करें</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686e592c5f47da2505d3ae6b/s_p_A6SYWxzdgc1EPwun.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686e592c5f47da2505d3ae6b/m_p_A6SYWxzdgc1EPwun.jpg">बड़ा करें</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686fe8695f47da2505d3ae88/m_p_nzuUOKu6sAmxO4pO.jpg">संस्करण 2</a>]</p><h2>Via Anapo catacombs[2]</h2><h3>प्रार्थना करती स्त्री (ओरांता)</h3><p>प्रार्थना करती स्त्री का भित्तिचित्र। Fresco of a praying woman, an orante or orans, in the Anonima di Via Anapo catacomb (anonymous catacomb of Via Anapo), Rome</p><img src="https://res.bibleox.com/s/img/image/simple/686e53655f47da2505d3ae65/s_p_qTxn07MuPIePNzPn.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686e53655f47da2505d3ae65/m_p_qTxn07MuPIePNzPn.jpg">बड़ा करें</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686e535e5f47da2505d3ae64/m_p_U8Zh4RJjehyZtXep.jpg">संस्करण 2</a>]</p>
