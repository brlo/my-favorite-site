    title: "उपवास का भोजन"
    body: |-
      <p>इस लेख में उपवास के भोजन का केवल संक्षिप्त स्वरूप दिया गया है, ताकि उस व्यक्ति को दिशा मिल सके जिसने अब तक कभी उपवास नहीं किया, जिसे उपवास का भोजन बनाने की आदत नहीं है और जो नहीं जानता कि उपवास में क्या बनाया जा सकता है।</p><blockquote><p>प्रभु ने उसे उत्तर दिया, “मार्था, हे मार्था; तू बहुत बातों के लिये चिन्ता करती और घबराती है। परन्तु एक बात अवश्य है, और उस उत्तम भाग को मरियम ने चुन लिया है जो उससे छीना न जाएगा।” (<a href="https://bibleox.com/hi/hi-ov/lk/10/#L41-42">लूका 10:41-42</a>)</p></blockquote><blockquote><p>“इसलिये सावधान रहो, ऐसा न हो कि तुम्हारे मन खुमार, और मतवालेपन, और इस जीवन की चिन्ताओं से सुस्त हो जाएँ, और वह दिन तुम पर फन्दे के समान अचानक आ पड़े।” (<a href="https://bibleox.com/hi/hi-ov/lk/21/#L34">लूका 21:34</a>)</p></blockquote><h2>सूप</h2><h3>सब्ज़ियों के शोरबे में सूप (भुने हुए प्याज़ और गाजर)</h3><p>लगभग हर जगह आलू डालना उपयुक्त होगा:</p><ul><li><p><strong>अनाज वाले सूप</strong> (कुट्टू, चावल, जौ, मसूर, मटर),</p></li><li><p><strong>मैकरोनी वाले सूप</strong>,</p></li><li><p><strong>सब्ज़ियों के सूप</strong>,</p></li><li><p><strong>बोर्श</strong>,</p></li><li><p><strong>रसोलनिक</strong> (नमकीन खीरों के साथ),</p></li><li><p><strong>श्ची</strong>,</p></li><li><p><strong>मछली का सूप</strong> (जब उपवास का नियम मछली की अनुमति दे)।</p></li></ul><h2>गार्निश</h2><ul><li><p><strong>जई का दलिया</strong> (जई के फ्लेक्स),</p></li><li><p><strong>उबले हुए</strong> चावल, कुट्टू, मसूर, कुसकुस, बुलगुर, किनोआ, पोलेंता (मक्के के आटे से बना दलिया) और अन्य अनाज। प्याज़ और गाजर का तड़का डालना उपयुक्त होगा।</p></li><li><p><strong>पुलाव</strong> (भरपेट भोजन के लिए इसमें छोले भी डाल सकते हैं),</p></li><li><p><strong>उबले चावल के साथ मिश्रण</strong>: हवाई, मैक्सिकन आदि।</p></li><li><p><strong>मैकरोनी</strong>: उबली हुई, पहले से भुनी हुई, मशरूम के साथ मैकरोनी, डिब्बाबंद मछली मिलाकर (टूना, सार्डीन आदि, जब उपवास का नियम अनुमति दे)</p></li><li><p><strong>आलू</strong>: तला हुआ, ओवन में पका हुआ, उबला हुआ, प्यूरी,</p></li><li><p><strong>दम की हुई पत्तागोभी</strong>,</p></li><li><p><strong>सब्ज़ियों का रगू</strong>: आलू, गाजर, प्याज़, ज़ुकीनी, शिमला मिर्च, मशरूम, टमाटर का पेस्ट या टमाटर, बैंगन,</p></li><li><p><strong>उबली हुई सब्ज़ियाँ</strong> (फूलगोभी, ब्रोकली, हरी मटर, मक्का),</p></li><li><p><strong>वरेनिकी</strong>: आलू, मशरूम, चेरी के साथ,</p></li><li><p><strong>टोफू</strong>,</p></li><li><p><strong>सब्ज़ियों के साथ छोले</strong>,</p></li><li><p><strong>मशरूम</strong> भुने हुए,</p></li><li><p><strong>ज़ुकीनी</strong> तली हुई,</p></li><li><p><strong>द्रानिकी</strong> (कद्दूकस किया हुआ आलू या ज़ुकीनी, चावल या गेहूँ का आटा, नमक),</p></li><li><p><strong>रतातुई</strong>,</p></li><li><p><strong>भुना हुआ कद्दू</strong>,</p></li><li><p><strong>ग्रिल की सब्ज़ियाँ</strong>,</p></li><li><p><strong>सब्ज़ी की कटलेट</strong> (सेम से)।</p></li></ul><h2>सलाद</h2><ul><li><p><strong>ताज़ी सब्ज़ियों से</strong>: खीरा, टमाटर, नई पत्तागोभी, लाल प्याज़, सलाद पत्ता, शिमला मिर्च, हरी पत्तेदार सब्ज़ियाँ, मसाले,</p></li><li><p><strong>उबली सब्ज़ियों से</strong>: विनेग्रेट (आलू, चुकंदर, गाजर, सेम, डिब्बे का मटर, नमकीन खीरे, प्याज़, खट्टी पत्तागोभी),</p></li><li><p><strong>चाइनीज़ पत्तागोभी का सलाद</strong>: चाइनीज़ पत्तागोभी, मक्का, उपवासी मेयोनेज़[1],</p></li><li><p><strong>उबला हुआ चुकंदर</strong> उपवासी मेयोनेज़ के साथ[1],</p></li><li><p><strong>फलों का सलाद</strong>,</p></li><li><p><strong>एवोकाडो का सलाद</strong>,</p></li></ul><h2>अचार</h2><ul><li><p><strong>खट्टी पत्तागोभी</strong>,</p></li><li><p><strong>खीरे</strong> नमकीन, हल्के नमकीन, कुचले हुए,</p></li><li><p><strong>गाजर</strong> कोरियाई शैली में,</p></li><li><p><strong>प्याज़</strong> सिरके में मैरिनेट किया हुआ,</p></li><li><p>इत्यादि।</p></li></ul><h2>आटे के व्यंजन</h2><ul><li><p><strong>रोटी</strong>,</p></li><li><p><strong>उपवासी बन</strong>: ओवन में या तवे पर पका सकते हैं, दुकान से खरीद भी सकते हैं।</p></li><li><p><strong>भरवाँ पीरोज़्की</strong>: चेरी, दम की पत्तागोभी, आलू और प्याज़ के साथ,</p></li><li><p><strong>उपवासी पैनकेक</strong> (दूध की जगह पानी, अंडों की जगह केले),</p></li></ul><h2>संरक्षित व्यंजन</h2><ul><li><p><strong>ज़ुकीनी</strong> <strong>का भुर्ता</strong>,</p></li><li><p><strong>बैंगन</strong> <strong>का भुर्ता</strong>,</p></li><li><p><strong>हुम्मस</strong>,</p></li><li><p><strong>मक्का</strong>,</p></li><li><p><strong>मशरूम</strong>,</p></li><li><p><strong>सेम</strong>,</p></li><li><p><strong>हरी मटर</strong>,</p></li><li><p><strong>धूप में सुखाए टमाटर</strong>,</p></li><li><p><strong>गुआकामोले</strong> पनीर के बिना,</p></li></ul><h2>सूखे मेवे</h2><ul><li><p><strong>मेवे</strong>,</p></li><li><p><strong>जामुन और फल</strong> सुखाए हुए या फ़्रीज़-ड्राइड,</p></li><li><p><strong>हलवा</strong>,</p></li></ul><h2>सैंडविच और अल्पाहार</h2><ul><li><p>शहद लगी ब्रेड।</p></li><li><p>टमाटर, तुलसी और नमक के साथ ब्रेड</p></li></ul><h2>पेय</h2><ul><li><p>क्वास</p></li><li><p>किसेल</p></li><li><p>कोम्पोट (ताज़े जामुनों से या सूखे मेवों से)</p></li><li><p>मोर्स</p></li><li><p>स्मूदी</p></li><li><p>लेमोनेड</p></li><li><p>चाय</p></li><li><p>दूध के बिना कॉफ़ी</p></li><li><p>पानी</p></li></ul>
    references: |-
      <ol><li><p><strong>उपवासी मेयोनेज़</strong>: डिब्बे के मटर का तरल, वनस्पति तेल, राई, नमक, चीनी, सिरका। ब्लेंडर में अच्छी तरह मिला लें।</p></li></ol><p>अनुवाद: रोडियन व्लासोव (एआई की सहायता से)। मूल पाठ: रूसी मूल। बाइबल के उद्धरण: हिन्दी O.V. के अनुसार।</p>
