      </ol><h3>विभिन्न प्राचीन चित्र जो मुख्य संग्रह में सम्मिलित नहीं हैं</h3><p><a href="https://bibleox.com/hi/hi/w/Ik5v_मुख्य_संग्रह_में_शामिल_न_हुई_विविध_प्राचीन_छवियाँ">https://bibleox.com/hi/hi/w/Ik5v_मुख्य_संग्रह_में_शामिल_न_हुई_विविध_प्राचीन_छवियाँ</a></p><p>अनुवाद: रोडियन व्लासोव (एआई की सहायता से)। मूल पाठ: रूसी मूल। बाइबल के उद्धरण: हिन्दी O.V. के अनुसार।</p>
