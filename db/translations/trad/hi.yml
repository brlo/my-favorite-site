  - src: древние-иконы
    path: Ik1c_प्राचीन_आइकॉनों_का_संग्रह
    title: "प्राचीन आइकॉनों का संग्रह"
    title_sub: "मसीह, परमेश्वर की माता, प्रेरितों और अन्य संतों के प्राचीन मसीही आइकॉन"
    body: |-
      <h2>~XV शताब्दी ई.पू.</h2><h3>मिलन का तम्बू</h3><p>मंदिर के बीच के परदे पर (पवित्रस्थान और परमपवित्रस्थान के बीच) करूब चित्रित हैं (<a href="https://bibleox.com/hi/hi-ov/ish/26/#L31">निर्ग 26:31</a>), और चारों ओर के आवरणों (दीवारों) पर भी (<a href="https://bibleox.com/hi/hi-ov/ish/26/#L1">निर्ग 26:1</a>; <a href="https://bibleox.com/hi/hi-ov/ish/36/#L8">निर्ग 36:8</a>), जिन्हें चित्र के रचयिता ने चित्रित नहीं किया। तम्बू स्वर्गीय वास्तविकता का प्रतिरूप (आइकॉन) है (<a href="https://bibleox.com/hi/hi-ov/ish/25/#L8-9,40">निर्ग 25:8-9,40</a>; <a href="https://bibleox.com/hi/hi-ov/evr/9/#L24">इब्रा 9:24</a>; <a href="https://bibleox.com/hi/hi-ov/act/7/#L44">प्रेरि 7:44</a>)। परमेश्वर ने मंदिर का आदर करने की आज्ञा दी (<a href="https://bibleox.com/hi/hi-ov/lev/19/#L30">लैव्य 19:30</a>; <a href="https://bibleox.com/hi/hi-ov/lev/26/#L2">लैव्य 26:2</a>)।</p><img src="https://res.bibleox.com/s/img/image/simple/471/s_p_P2j4gLJt9iKSnkge.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/471/m_p_P2j4gLJt9iKSnkge.jpg">बड़ा करें</a>] [<a href="https://res.bibleox.com/s/img/image/simple/472/m_p_bNPh6hCNJDhzahar.jpg">बाहरी दृश्य</a>]</p><h3>वाचा का सन्दूक</h3><p>सन्दूक पर दो करूब स्वर्गदूत चित्रित थे (<a href="https://bibleox.com/ru/ru/w/%D0%BA%D0%BE%D0%B2%D1%87%D0%B5%D0%B3_%D0%B7%D0%B0%D0%B2%D0%B5%D1%82%D0%B0/">पवित्रशास्त्र के संदर्भ (रूसी में)</a>)। भविष्यद्वक्ता यहोशू ने वाचा के सन्दूक के सामने दण्डवत् किया (<a href="https://bibleox.com/hi/hi-ov/nav/7/#L6">यहो 7:6</a>)।</p><img src="https://res.bibleox.com/s/img/image/simple/469/s_p_DUn5vqnI4F8yRiNA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/469/m_p_DUn5vqnI4F8yRiNA.jpg">बड़ा करें</a>]</p><h3>इस्राएल की छावनी</h3><p>इस्राएल क्रूस के आकार में चलता था (<a href="https://bibleox.com/ru/ru/w/%D0%B5%D0%B2%D1%80%D0%B5%D0%B9%D1%81%D0%BA%D0%B8%D0%B9-%D1%81%D1%82%D0%B0%D0%BD-%D0%BA%D1%80%D0%B5%D1%81%D1%82/">पवित्रशास्त्र के संदर्भ (रूसी में)</a>)।</p><img src="https://res.bibleox.com/s/img/image/simple/470/s_p_t8tRbbwlzsBzyVzk.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/470/m_p_t8tRbbwlzsBzyVzk.jpg">बड़ा करें</a>]</p><h2>~X शताब्दी ई.पू.</h2><h3>सुलैमान द्वारा बनाया गया यरूशलेम का मंदिर</h3><p>मंदिर की दीवारों पर (<a href="https://bibleox.com/hi/hi-ov/3ts/6/#L32">1 राजा 6:32</a>), प्रवेश-द्वार पर (<a href="https://bibleox.com/hi/hi-ov/3ts/6/#L32">1 राजा 6:32</a>; (<a href="https://bibleox.com/hi/hi-ov/3ts/6/#L35">1 राजा 6:35</a>) परमपवित्र स्थान में प्रवेश के सामने के परदे पर (<a href="https://bibleox.com/hi/hi-ov/2par/3/#L14">2 इति 3:14</a>; <a href="https://bibleox.com/hi/hi-ov/1mak/1/#L22">1 मक्का 1:22</a>) करूबों की खुदी हुई मूर्तियाँ थीं। परमपवित्र स्थान में करूबों की दो बड़ी सोने की परत चढ़ी लकड़ी की मूर्तियाँ खड़ी थीं (<a href="https://bibleox.com/hi/hi-ov/3ts/6/#L23">1 राजा 6:23</a>)। वाचा के सन्दूक के ढक्कन पर करूबों की दो मूर्तियाँ बनाई गई थीं (<a href="https://bibleox.com/hi/hi-ov/ish/25/#L18-20">निर्ग 25:18-20</a>)। मंदिर के आँगन में हाथ धोने के बड़े पाएदानों पर सिंह, बैल और करूब चित्रित थे (<a href="https://bibleox.com/hi/hi-ov/3ts/7/#L28-29">1 राजा 7:28-29</a>)। (<a href="https://bibleox.com/ru/ru/w/%D0%B8%D0%B5%D1%80%D1%83%D1%81%D0%B0%D0%BB%D0%B8%D0%BC%D1%81%D0%BA%D0%B8%D0%B9-%D1%85%D1%80%D0%B0%D0%BC/">अधिक जानकारी (रूसी में)</a>, रूसी में)।</p><p>भविष्यद्वक्ता दाऊद ने मंदिर के सामने दण्डवत् किया (<a href="https://bibleox.com/hi/hi-ov/ps/5/#L7">भजन 5:7</a>; <a href="https://bibleox.com/hi/hi-ov/ps/98/#L5">भजन 98:5</a>; <a href="https://bibleox.com/hi/hi-ov/ps/131/#L7">भजन 131:7</a>), इस प्रतिरूप के द्वारा परमेश्वर का आदर किया।</p><img src="https://res.bibleox.com/s/img/image/simple/468/s_p_lv7GzNtM53C4Zqgr.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/468/m_p_lv7GzNtM53C4Zqgr.jpg">बड़ा करें</a>]</p><h2>II शताब्दी</h2><h3>परमेश्वर की माता बालक यीशु के साथ, भविष्यद्वक्ता तारे की ओर संकेत करते हैं (रोम)</h3><p>II – III शताब्दी का आरंभ। प्रिस्किल्ला के कैटाकॉम्ब[6]। यह परमेश्वर की माता का सबसे प्राचीन चित्र है। परमेश्वर की माता के पास का व्यक्ति संभवतः बाएँ हाथ में पुस्तक पकड़े हुए है और दाएँ हाथ की उँगली से तारे की ओर संकेत कर रहा है।</p><img src="https://res.bibleox.com/s/img/image/simple/6751b012dba7720001514f69/s_p_jNTGMwic6Cse9xDG.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6751b012dba7720001514f69/m_p_jNTGMwic6Cse9xDG.jpg">बड़ा करें</a>] [<a href="https://res.bibleox.com/s/img/image/simple/67618740dba7720001cd0e2c/m_p_ckKuGWqzHuN1tR5Q.jpg">संस्करण 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686cf0535f47da2505d3ae4d/m_p_dajA4xvStk0EnnSq.jpg">संस्करण 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686cf7725f47da2505d3ae50/m_p_n79yEKK4QSCeorx3.jpg">संस्करण 4</a>] [<a href="https://res.bibleox.com/s/img/image/simple/442/m_p_5zQEQbMmBkEs9J2S.jpg">संस्करण 5</a>]</p><p>परमेश्वर की माता के पास का व्यक्ति भविष्यद्वक्ता यशायाह हो सकता है, जिन्होंने यह भविष्यवाणी की थी:</p><blockquote><p>"इस कारण प्रभु आप ही तुम को एक चिह्न देगा। सुनो, <strong>एक कुमारी गर्भवती होगी और पुत्र जनेगी</strong>, और उसका नाम इम्मानुएल रखेगी।" (<a href="https://bibleox.com/hi/hi-ov/is/7/#L14">यशा 7:14</a>)</p></blockquote><p>या फिर बिलाम:</p><blockquote><p>"मैं उसको देखूँगा तो सही, परन्तु अभी नहीं; मैं उसको निहारूँगा तो सही, परन्तु समीप होके नहीं: <strong>याक़ूब में से एक तारा उदय होगा</strong>, और इस्राएल में से एक राज दण्ड उठेगा; जो मोआब की सीमाओं को चूर कर देगा, और सब दंगा करनेवालों को गिरा देगा।" (<a href="https://bibleox.com/hi/hi-ov/chis/24/#L17">गिन 24:17</a>)</p></blockquote><p>या फिर चित्रकार ने व्याख्यात्मक लेख के बजाय केवल इसी उपाय का प्रयोग किया। वह हमें पुस्तक उठाने, उदय होनेवाले तारे के बारे में भविष्यवाणी पढ़ने और यह समझने के लिए बुलाता है कि उसने उसी का जन्म चित्रित किया है जिसके बारे में यह भविष्यवाणी कहती है, अर्थात् कुमारी से उद्धारकर्ता का जन्म।</p><h3>अच्छे चरवाहे के रूप में मसीह</h3><p>द्वितीय शताब्दी का अंत। रोम। कलिस्तुस के कैटाकॉम्ब (<a href="https://en.wikipedia.org/wiki/Catacomb_of_Callixtus#Paintings">Callixitus Catacomb, Crypt of Lucina</a>)।</p><img src="https://res.bibleox.com/s/img/image/simple/473/s_p_mrIYHR2oqLQuPn0z.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/473/m_p_mrIYHR2oqLQuPn0z.jpg">बड़ा करें</a>]</p><h2>III शताब्दी</h2><h3>परमेश्वर की माता «ओरान्ता» (रोम)</h3><p>Catacomba Maggiore, Roma[26][27]. अग्रभूमि में कुमारी मरियम और बालक मसीह चित्रित हैं।</p><img src="https://res.bibleox.com/s/img/image/simple/6751fe6ddba7720001514f7e/s_p_C1Iw2V4OhNy1SGOE.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6751fe6ddba7720001514f7e/m_p_C1Iw2V4OhNy1SGOE.jpg">बड़ा करें</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686cefb35f47da2505d3ae4c/m_p_70zYu2r0np0WFNUu.jpg">संस्करण 2</a>]</p><h3>मसीह, प्रेरित, शहीद गोर्गोनियुस, पतरस, मार्सेल्लिनुस और तिबूर्तियुस (रोम)</h3><p>पतरस और मार्सेल्लिनुस के कैटाकॉम्ब</p><img src="https://res.bibleox.com/s/img/image/simple/6752012adba7720001514f82/s_p_x5I0ahjwMz1X5LoJ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6752012adba7720001514f82/m_p_x5I0ahjwMz1X5LoJ.jpg">बड़ा करें</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686d237a5f47da2505d3ae56/m_p_ST9me27UGtWHYDBc.jpg">संस्करण 2</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/676082a6dba7720001cd0e22/s_p_YjPD3PzLDCF4wgh1.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/676082a6dba7720001cd0e22/m_p_YjPD3PzLDCF4wgh1.jpg">बड़ा करें</a>]</p><h3>एक स्त्री अच्छे चरवाहे से प्रार्थना करती है (रोम)</h3><p>III शताब्दी। प्रिस्किल्ला के कैटाकॉम्ब[6]।</p><p>चित्र एक संरचना बनाते हैं। चित्रकार ने चित्रों को इस प्रकार रखा है कि कमरे के चारों ओर प्रार्थना करनेवाले लोग ऊपर देखते हैं और अपने हाथ कमरे के शिखर की ओर उठाते हैं, जहाँ <strong>अच्छे चरवाहे</strong> के रूप में मसीह चित्रित हैं (<a href="https://bibleox.com/hi/hi-ov/in/10/#L11">यूह 10:11</a>)। अच्छे चरवाहे के आसपास के सभी दृश्यों को एक ही विषय जोड़ता है — <strong>मृत्यु से उद्धार</strong>।</p><img src="https://res.bibleox.com/s/img/image/simple/686bea5b5f47da2505d3ae31/s_p_pjRHeoFaUpKPoyEH.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686bea5b5f47da2505d3ae31/m_p_pjRHeoFaUpKPoyEH.jpg">बड़ा करें</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686cf7375f47da2505d3ae4f/m_p_MOsOWI2vEXUj5ELf.jpg">संस्करण 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6904b3f2205184ec278d6e53/m_p_0GRveVCOh2GBz7eq.jpg">संस्करण 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/431/m_p_LUZsrJtesEWiwHBO.jpg">संस्करण 4</a>]</p><p>अच्छा चरवाहा — मसीह (लूका 15:6-7; यूहन्ना 10:1-21; भजन 23)।</p><img src="https://res.bibleox.com/s/img/image/simple/69319f74205184ec278d6fa7/s_p_GR8gHxKZuC87xqlf.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69319f74205184ec278d6fa7/m_p_GR8gHxKZuC87xqlf.jpg">बड़ा करें</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686d2ac55f47da2505d3ae59/m_p_JDvtNt9RJrqnAsEW.jpg">संस्करण 2</a>]</p><p>सिर ढकी एक स्त्री हाथ ऊपर उठाकर प्रार्थना करती है (संभवतः सारा: उत्पत्ति 18:1-15 और उत्पत्ति 21:1-7)।</p><img src="https://res.bibleox.com/s/img/image/simple/686bea885f47da2505d3ae32/s_p_79wnuevuFIi3tnrH.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686bea885f47da2505d3ae32/m_p_79wnuevuFIi3tnrH.jpg">बड़ा करें</a>]</p><p>दाईं ओर पुराने नियम का दृश्य: तीन जवान (<a href="https://en.wikipedia.org/wiki/Catacomb_of_Priscilla#/media/File:Shadrach,_Meshach,_and_Abednego_in_the_fiery_furnace,_from_the_book_Die_Malereien_der_Katakomben_Roms,_plate_78,_levels_adjusted.jpg">शद्रक, मेशक और अबेदनगो</a>) हाथ ऊपर उठाकर प्रार्थना करते हैं (दानिय्येल 3:1-90)।</p><img src="https://res.bibleox.com/s/img/image/simple/686cfc565f47da2505d3ae52/s_p_NmZJuoF70d9qohZs.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686cfc565f47da2505d3ae52/m_p_NmZJuoF70d9qohZs.jpg">बड़ा करें</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686cfc475f47da2505d3ae51/m_p_qzHB83d52LoU7QQL.jpg">संस्करण 2</a>]</p><p>बाईं ओर पुराने नियम का दृश्य: इब्राहीम और इसहाक बलिदान चढ़ाने के लिए लकड़ियों के साथ (उत्पत्ति 22:1-19)।</p><img src="https://res.bibleox.com/s/img/image/simple/686d33c45f47da2505d3ae5a/s_p_QQLn5T52hx8gSrBf.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d33c45f47da2505d3ae5a/m_p_QQLn5T52hx8gSrBf.jpg">बड़ा करें</a>]</p><p>प्रवेश-द्वार के ऊपर भविष्यद्वक्ता योना चित्रित हैं, जिन्हें समुद्री जीव निगल रहा है (<a href="https://bibleox.com/hi/hi-ov/ion/2/#L1">योना 2:1</a>)।</p><img src="https://res.bibleox.com/s/img/image/simple/476/s_p_aHV4YSuoWhVZ1H5y.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/476/m_p_aHV4YSuoWhVZ1H5y.jpg">बड़ा करें</a>]</p><p>कमरे के सामने के भाग में प्रार्थना करनेवाली स्त्री के जीवन से जुड़े दृश्य का अधिक विस्तार से वर्णन करना चाहिए।</p><img src="https://res.bibleox.com/s/img/image/simple/686d36265f47da2505d3ae5d/s_p_MGpxKQ94pikRfgFK.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d36265f47da2505d3ae5d/m_p_MGpxKQ94pikRfgFK.jpg">बड़ा करें</a>]</p><p><strong>सामने के दृश्य की घटनाएँ</strong></p><p>कमरे की संरचना का प्रत्येक भाग एक ही दृश्य दर्शाता है। सभी दृश्य मसीही विषय के महत्वपूर्ण अंग हैं। ऊपर अच्छे चरवाहे का दृश्य है, बाईं ओर इब्राहीम का दृश्य, दाईं ओर तीन जवानों का, और गलियारे में भविष्यद्वक्ता योना का। इस संबंध में यह माना जा सकता है कि चित्रकार इस नियम से नहीं हटा (एक भाग — एक महत्वपूर्ण दृश्य), और कमरे के सामने के भाग में भी, जिसका वर्णन एक ही अर्थ में करना कठिन है। यहाँ केवल एक अनुमान दिया जा रहा है। चूँकि चारों ओर (केंद्र को छोड़कर) पुराने नियम के दृश्य चित्रित हैं, इसलिए सामने की ओर हाजिरा की कथा मानी जा सकती है (उत्पत्ति 16, उत्पत्ति 21)। यदि ऐसा है, तो पहले इब्राहीम और निकाली जा रही हाजिरा अपने पुत्र इश्माएल के साथ (1), फिर सारा की प्रार्थना (2), फिर बालक को दूध पिलाती हाजिरा (3) चित्रित है।</p><p>आइए इस संस्करण पर अधिक विस्तार से विचार करें:</p><p><strong>1. हाजिरा का निकाला जाना</strong>। सबसे अधिक निश्चितता से यह कहा जा सकता है कि बैठे हुए व्यक्ति इब्राहीम हैं (उनके बाल और दाढ़ी सामने की दीवार पर इब्राहीम के भित्तिचित्र जैसे ही हैं)। पीले वस्त्र में संभवतः हाजिरा चित्रित हैं (पीला रंग दास के दर्जे को दर्शाता हो सकता है)। ऐसा लगता है कि उनके हाथों में पानी से भरी मशकें हैं (<a href="https://bibleox.com/hi/hi-ov/gen/21/#L14">उत्प 21:14</a>)। उनके पीछे संभवतः उनका पुत्र इश्माएल चित्रित है, जिसकी आयु निकाले जाने के समय 15 वर्ष से अधिक होनी चाहिए (<em>इश्माएल का जन्म तब हुआ जब इब्राहीम 86 वर्ष के थे </em><a href="https://bibleox.com/hi/hi-ov/gen/16/#L16">उत्प 16:16</a><em>, इसहाक का जन्म तब हुआ जब इब्राहीम 100 वर्ष के थे </em><a href="https://bibleox.com/hi/hi-ov/gen/21/#L5">उत्प 21:5</a><em>, और हाजिरा को तब निकाला जाता है जब इसहाक बड़ा हुआ और दूध से छुड़ाया गया </em><a href="https://bibleox.com/hi/hi-ov/gen/21/#L8-13">उत्प 21:8-13</a>)। ऐसा लगता है कि यह एप्रन पहने एक स्त्री है, परंतु यदि ऐसा है, तो वह केवल हाजिरा ही हो सकती है (अविवाहित स्त्री का सिर खुला होता है), और हाथों में मशकें होने की स्थिति में वह इश्माएल होगा। किसी भी प्रकार, शेष दो — हाजिरा और इश्माएल — सबसे संभावित संस्करण हैं। यह भी हो सकता है कि यह पूरी संरचना अलग-अलग भागों से न बनी हो, बल्कि एक समग्र चित्र हो, क्योंकि बालक के साथ स्त्री ऊपर उठे हाथोंवाली स्त्री की ओर देख रही है।</p><img src="https://res.bibleox.com/s/img/image/simple/686d33c95f47da2505d3ae5b/s_p_kuEcuyUnGenBuWPw.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d33c95f47da2505d3ae5b/m_p_kuEcuyUnGenBuWPw.jpg">बड़ा करें</a>]</p><p><strong>2. सारा की प्रार्थना</strong>। लाल वस्त्र में सिर ढकी सारा चित्रित हैं, जो परमेश्वर से प्रार्थना कर रही हैं। वस्त्र का लाल रंग उच्च दर्जा दर्शाता है, और ढका सिर विवाहित होने का।</p><img src="https://res.bibleox.com/s/img/image/simple/686d3a855f47da2505d3ae5e/s_p_rpl3jnuNnx8ZisdR.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d3a855f47da2505d3ae5e/m_p_rpl3jnuNnx8ZisdR.jpg">बड़ा करें</a>]</p><p><strong>3. हाजिरा बालक को दूध पिलाती है</strong>। हाजिरा के संस्करण के पक्ष में यह बात है कि उनका सिर ढका नहीं है (अर्थात् वे अविवाहित हैं), और बालों का आकार भी पहले दृश्य में पीले वस्त्रवाले व्यक्ति जैसा ही है। उनकी पहचान उनकी विशिष्ट दृष्टि से भी होती है: वे सारा की ओर देख रही हैं, जिनसे उनके तनावपूर्ण संबंध थे। यह आश्चर्यजनक है कि चित्रकार ने उन्हें ठीक वैसे ही चित्रित किया जैसे बाईं ओर इब्राहीम बैठे हैं: कुर्सी पर और बिल्कुल वैसे ही वस्त्र में (खड़ी धारियाँ, आस्तीन पर दो धारियाँ, चोगा)।</p><img src="https://res.bibleox.com/s/img/image/simple/686d22a05f47da2505d3ae54/s_p_8fxd9vcRlXYszSJU.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d22a05f47da2505d3ae54/m_p_8fxd9vcRlXYszSJU.jpg">बड़ा करें</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686d33cd5f47da2505d3ae5c/m_p_qKPp740xLZNuDEFs.jpg">संस्करण 2</a>]</p><p><strong>कमरे का सामान्य विचार — मृत्यु से उद्धार</strong></p><p>इस क्यूबिकुलम की संरचना का एक सामान्य, सुंदर विचार है — मृत्यु से उद्धार। सामान्य दृश्य नीचे से ऊपर की ओर स्तरों में जाता है:</p><ul><li><p>सबसे निचला स्तर — मृत्यु पर विजयी मसीह में विश्वास करनेवाले दफ़नाए गए मृत मसीही।</p></li><li><p>मध्य स्तर — मृत्यु से उद्धार के पवित्रशास्त्रीय दृश्य:</p><ul><li><p>बाबेल की भट्टी में तीन जवान आग में मृत्यु से बचाए गए;</p></li><li><p>भविष्यद्वक्ता योना समुद्री जीव के पेट से मृत्यु से बचाए गए;</p></li><li><p>इसहाक बलिदान चढ़ाए जाने से बचाए गए, उनके बदले मेम्ना चढ़ाया गया;</p></li><li><p>हाजिरा अपने पुत्र इश्माएल के साथ जंगल में मृत्यु से बचाई गई।</p></li></ul></li><li><p>उपांतिम स्तर — मसीही प्रतीक: मोर (पुनरुत्थान, अमरत्व, अनंत जीवन) और तीतर (आत्मा)। एक तीतर जीवित पौधे के पास खड़ा है (जीवन का प्रतीक), दूसरा सूखे पौधे के पास (मृत्यु का प्रतीक)। मोर भी वहीं खड़े हैं।</p></li><li><p>छत का केंद्र — अच्छा चरवाहा, जो विश्वासियों को मृत्यु से बचाता है। यह उल्लेखनीय है कि यहाँ मृत्यु से उद्धार का एक और छोटा संकेत है — चरवाहे के बाएँ और दाएँ कौआ और जैतून की टहनी के साथ कबूतर बैठे हैं, जिन्हें नूह ने सन्दूक से भेजा था। इस प्रकार, सन्दूक में मृत्यु से बचाए गए लोग इन पक्षियों के द्वारा मृत्यु के उद्धारकर्ता — मसीह — के पास लाए जाते हैं।</p></li></ul><h3>दूरा-यूरोपोस (सीरिया) का गिरजाघर</h3><p>244 ई. दूरा-यूरोपोस का गिरजाघर पुराने नियम की घटनाओं के अतिरिक्त नए नियम की घटनाओं के भित्तिचित्र भी रखता था: डूबते प्रेरित पतरस का उद्धार और भेड़-फाटक के कुंड के पास लकवाग्रस्त व्यक्ति का चंगा होना। देखें <a href="https://vk.com/@aletheia-de-sacris-imaginibus-venerandis?anchor=v-drugie-svyaschennye-izobrazhenia-v-donikeyskiy-period">लेख</a> (रूसी में)।</p><p><strong>बपतिस्मा-कक्ष में अच्छे चरवाहे के रूप में मसीह (मुख्य दृश्य)</strong></p><img src="https://res.bibleox.com/s/img/image/simple/6931870c205184ec278d6fa2/s_p_uBkNi8jGsMFpOQSM.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931870c205184ec278d6fa2/m_p_uBkNi8jGsMFpOQSM.jpg">बड़ा करें</a>]</p><p><strong>डूबते प्रेरित पतरस का उद्धार</strong></p><img src="https://res.bibleox.com/s/img/image/simple/692c8038205184ec278d6f9e/s_p_QQ2Rml8gUWsyQtS9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c8038205184ec278d6f9e/m_p_QQ2Rml8gUWsyQtS9.jpg">बड़ा करें</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6786b88ddba77200015ae11c/m_p_do380IVDukCAfdFk.jpg">संस्करण 2</a>]</p><p><strong>भेड़-फाटक के कुंड के पास लकवाग्रस्त व्यक्ति का चंगा होना</strong></p><img src="https://res.bibleox.com/s/img/image/simple/6786b889dba77200015ae11b/s_p_k1a5GDBvfzTCWmZv.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6786b889dba77200015ae11b/m_p_k1a5GDBvfzTCWmZv.jpg">बड़ा करें</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6786bb0bdba77200015ae11d/m_p_dCRD85foL69l7kih.jpg">दूसरा संस्करण</a>]</p><h3>अच्छे चरवाहे के रूप में मसीह, भविष्यद्वक्ता योना</h3><p>III शताब्दी का अंत – IV शताब्दी का आरंभ। रोम। पतरस और मार्सेल्लिनुस के कैटाकॉम्ब।</p><p>केंद्र में — अच्छे चरवाहे के रूप में मसीह। केंद्र के दोनों ओर योना चित्रित हैं। बाईं ओर के भित्तिचित्र में योना को जहाज़ से फेंका जा रहा है, और दाईं ओर उन्हें व्हेल निगल रही है।</p><img src="https://res.bibleox.com/s/img/image/simple/478/s_p_yvJcnbLGPxZ6AzRu.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/478/m_p_yvJcnbLGPxZ6AzRu.jpg">बड़ा करें</a>]</p><p>भविष्यद्वक्ता योना</p><img src="https://res.bibleox.com/s/img/image/simple/481/s_p_7z5j4tAimokFaRMN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/481/m_p_7z5j4tAimokFaRMN.jpg">बड़ा करें</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/480/s_p_b8gqyOenKZcn2MCp.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/480/m_p_b8gqyOenKZcn2MCp.jpg">बड़ा करें</a>]</p><h3>अच्छे चरवाहे के रूप में मसीह</h3><p>III शताब्दी। रोम। कलिस्तुस के कैटाकॉम्ब (<a href="https://en.wikipedia.org/wiki/Catacomb_of_Callixtus#Paintings">Callixitus Catacomb, Crypt of Lucina</a>)। यह माना जा सकता है कि हाँडी में दूध है, जो यूखरिस्त का प्रतीक है (अलेक्ज़ेंड्रिया के क्लेमेंस में देखें)।</p><img src="https://res.bibleox.com/s/img/image/simple/474/s_p_zcLmMd2qkyG3pDoj.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/474/m_p_zcLmMd2qkyG3pDoj.jpg">बड़ा करें</a>]</p><h3>अच्छा चरवाहा, हिसारतेप नेक्रोपोल, निकिया (इज़निक)</h3><p>~III शताब्दी। खोज नई है, तिथि अनुमानित है (<a href="https://www.arkeolojikhaber.com/haber-iznikte-benzersiz-bir-kesif-anadolunun-tek-coban-isa-figuru-gun-yuzune-cikarildi-43079/">अधिक जानकारी</a>)। इस नेक्रोपोल का उपयोग II से V शताब्दी तक किया गया।</p><p>निर्देशांक: 40.78204218462122, 29.928491677648932. स्थान का तुर्की नाम: Hasartep Nekropolü.</p><img src="https://res.bibleox.com/s/img/image/simple/69444e49205184ec278d6fdb/s_p_SZTpvcDdpodujcbM.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69444e49205184ec278d6fdb/m_p_SZTpvcDdpodujcbM.jpg">बड़ा करें</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6941a813205184ec278d6fda/s_p_CUoa7dSy5UxGf1UD.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6941a813205184ec278d6fda/m_p_CUoa7dSy5UxGf1UD.jpg">बड़ा करें</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6941a80f205184ec278d6fd9/m_p_xSCaRt10DUUReyMt.jpg">संस्करण 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/693c7d1a205184ec278d6fcb/m_p_mR5ZaVgXbezmXDyo.jpg">संस्करण 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/693d606b205184ec278d6fd3/m_p_TKCjvhxmnq0q50tW.jpg">संस्करण 4</a>] [<a href="https://res.bibleox.com/s/img/image/simple/693d6101205184ec278d6fd7/m_p_1i6aL6lfDR08iA13.jpg">संस्करण 5</a>] [<a href="https://res.bibleox.com/s/img/image/simple/693d60f8205184ec278d6fd6/m_p_b2uUaO6tzciaKAgC.jpg">संस्करण 6</a>] [<a href="https://res.bibleox.com/s/img/image/simple/693d60f1205184ec278d6fd5/m_p_bErh7lbI0e08hPaa.jpg">संस्करण 7</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/693c7db2205184ec278d6fd2/s_p_wCZsWPWG7jCNLjIr.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/693c7db2205184ec278d6fd2/m_p_wCZsWPWG7jCNLjIr.jpg">बड़ा करें</a>] [<a href="https://res.bibleox.com/s/img/image/simple/693d60ad205184ec278d6fd4/m_p_BCvsIiJX10j2Mf2k.jpg">पुरुष और स्त्री</a>] [<a href="https://res.bibleox.com/s/img/image/simple/693c7daa205184ec278d6fd1/m_p_cjk36Xjpev9EFq2h.jpg">स्त्री</a>]</p><h3>विवाह की अँगूठी (बिज़ान्तियम)</h3><p>III-IV शताब्दियाँ। <a href="https://www.metmuseum.org/art/collection/search/663485">मेट्रोपॉलिटन संग्रहालय, 5वें एवेन्यू, अमेरिका</a>। (यूनानी χάρις — कृपा)</p><img src="https://res.bibleox.com/s/img/image/simple/68b5da8b45c75323d28a5e99/s_p_GNh1S8L7fcowsMEE.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5da8b45c75323d28a5e99/m_p_GNh1S8L7fcowsMEE.jpg">बड़ा करें</a>]</p><h3>यूखरिस्त का अनुष्ठान</h3><p>III शताब्दी। रोम। कलिस्तुस के कैटाकॉम्ब (<a href="https://en.wikipedia.org/wiki/Catacomb_of_Callixtus#Paintings">Callixitus Catacomb, Crypt of Lucina</a>)। संभवतः पुरोहित को डीकन की सहायता से चित्रित किया गया है। आज भी रूढ़िवादी कलीसिया के गिरजाघरों में यूखरिस्त इसी प्रकार किया जाता है: पुरोहित दोनों हाथ ऊपर उठाते हैं, डीकन पवित्र दानों की ओर संकेत करता है।</p><img src="https://res.bibleox.com/s/img/image/simple/479/s_p_Zbn405P2krjwNAYl.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/479/m_p_Zbn405P2krjwNAYl.jpg">बड़ा करें</a>]</p><h2>IV शताब्दी</h2><h3>मसीह (रोम)</h3><p>कोम्मोदिल्ला के कैटाकॉम्ब।</p><img src="https://res.bibleox.com/s/img/image/simple/66cc2bd6dba77200019bc7d2/s_p_7xYGBb9wCmxBIGrZ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/66cc2bd6dba77200019bc7d2/m_p_7xYGBb9wCmxBIGrZ.jpg">बड़ा करें</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686d23425f47da2505d3ae55/s_p_LzqgbhnIsbqtghoc.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d23425f47da2505d3ae55/m_p_LzqgbhnIsbqtghoc.jpg">बड़ा करें</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a1e1205184ec278d6fa8/m_p_KC0MljXJf5po70pj.jpg">संस्करण 2</a>]</p><h3>मसीह और प्रेरित (रोम)</h3><p>~350 ई. [8][9] सांता कोन्स्तान्त्सा का समाधि-भवन (मॉज़ोलियम)।</p><img src="https://res.bibleox.com/s/img/image/simple/686990665f47da2505d3ae19/s_p_5RDr4ou4ExBAh4KE.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686990665f47da2505d3ae19/m_p_5RDr4ou4ExBAh4KE.jpg">बड़ा करें</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686990425f47da2505d3ae17/s_p_CXn5KmuiWradhOvh.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686990425f47da2505d3ae17/m_p_CXn5KmuiWradhOvh.jpg">बड़ा करें</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686990545f47da2505d3ae18/s_p_IkgteAcecXoMC106.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686990545f47da2505d3ae18/m_p_IkgteAcecXoMC106.jpg">बड़ा करें</a>]</p><h3>सान-जोवान्नी-इन-फ़ोंते का बपतिस्मा-कक्ष (नेपल्स)</h3><p>350-400 ई. [11][12]</p><img src="https://res.bibleox.com/s/img/image/simple/6869924c5f47da2505d3ae1a/s_p_t1iU8sClY3pnOnkK.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6869924c5f47da2505d3ae1a/m_p_t1iU8sClY3pnOnkK.jpg">बड़ा करें</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686992505f47da2505d3ae1b/s_p_BrRKZmtReJbgXm0w.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686992505f47da2505d3ae1b/m_p_BrRKZmtReJbgXm0w.jpg">बड़ा करें</a>]</p><h3>मसीह और स्वर्गदूत, दूसरा आगमन (थेसालोनिकी, बिज़ान्तियम)</h3><p>IV शताब्दी का अंत। [17][18] संत जॉर्ज विजयी का रोटोंडा (मूलतः सम्राट गैलेरियुस की समाधि)।</p><img src="https://res.bibleox.com/s/img/image/simple/6931a254205184ec278d6fa9/s_p_bWn7Chqiox5UOEd4.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931a254205184ec278d6fa9/m_p_bWn7Chqiox5UOEd4.jpg">बड़ा करें</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a2ba205184ec278d6faa/m_p_ROPWmBVyUxWMGo9Z.jpg">संस्करण 2</a>]</p><p>मोज़ेक बहुत बुरी तरह क्षतिग्रस्त है। मसीह की प्रतिमा में से प्रभामंडल का एक टुकड़ा, हाथ और क्रूस शेष रह गए हैं। चारों ओर स्वर्गदूतों के मुख स्पष्ट रूप से दिखाई देते हैं।</p><img src="https://res.bibleox.com/s/img/image/simple/686a91695f47da2505d3ae1f/s_p_EoOSmhaBPsy32XQQ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686a91695f47da2505d3ae1f/m_p_EoOSmhaBPsy32XQQ.jpg">बड़ा करें</a>]</p><h3>संत बिशप, योद्धा, चिकित्सक (थेसालोनिकी, बीज़ान्टियम)</h3><p>चौथी शताब्दी का अंत [17][18]। संत जॉर्ज विजयी का रोटोंडा (मूल रूप से सम्राट गैलेरियस की समाधि)।</p><p>मोज़ेकों के बीच संत बिशपों, योद्धाओं, चिकित्सकों और संगीतकारों की प्रतिमाएँ हैं, जिनके नाम रोमन, किरिल, लियो, ओनीसिफ़ोरस, यूकार्पस, बेसिलिस्कस, पोर्फ़िरियस, फ़िलेमोन, प्रिस्कस, फ़ेरिन, कॉसमॉस और डेमियन हैं।</p><img src="https://res.bibleox.com/s/img/image/simple/686aa0275f47da2505d3ae21/s_p_oIksDo9rIgSoAXvG.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa0275f47da2505d3ae21/m_p_oIksDo9rIgSoAXvG.jpg">बड़ा करें</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686aa02e5f47da2505d3ae22/s_p_nTZtC6C93KI8Fu6I.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa02e5f47da2505d3ae22/m_p_nTZtC6C93KI8Fu6I.jpg">बड़ा करें</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686aa0335f47da2505d3ae23/s_p_b1KhWllqTzipVhO9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa0335f47da2505d3ae23/m_p_b1KhWllqTzipVhO9.jpg">बड़ा करें</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686aa0385f47da2505d3ae24/s_p_vvlbG9E89B9T0U8j.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa0385f47da2505d3ae24/m_p_vvlbG9E89B9T0U8j.jpg">बड़ा करें</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686aa03f5f47da2505d3ae25/s_p_d3lcRobegfAQOf6e.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa03f5f47da2505d3ae25/m_p_d3lcRobegfAQOf6e.jpg">बड़ा करें</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686aa0555f47da2505d3ae27/s_p_h1YgFpMukwaYc23Q.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa0555f47da2505d3ae27/m_p_h1YgFpMukwaYc23Q.jpg">बड़ा करें</a>]</p><p>संत कॉसमॉस और डेमियन</p><img src="https://res.bibleox.com/s/img/image/simple/686aa04e5f47da2505d3ae26/s_p_LwMjPHLsabDDxEHy.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa04e5f47da2505d3ae26/m_p_LwMjPHLsabDDxEHy.jpg">बड़ा करें</a>]</p><h3>डाकुओं के बीच क्रूसित मसीह की प्रतिमा (रोम)</h3><p>चौथी शताब्दी का आरंभ। सांता-सबीना बासिलिका, द्वार के पैनलों में से एक। क्रूसारोहण का उभरी हुई प्रतिमा।</p><img src="https://res.bibleox.com/s/img/image/simple/676183a8dba7720001cd0e2b/s_p_ccaA7HzLPDInwe1b.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/676183a8dba7720001cd0e2b/m_p_ccaA7HzLPDInwe1b.jpg">बड़ा करें</a>]</p><h3>प्रभु का यरूशलेम में प्रवेश (बीज़ान्टियम)</h3><p>चौथी शताब्दी का आरंभ। <a href="https://www.metmuseum.org/art/collection/search/466220">मेट्रोपॉलिटन संग्रहालय, 5वें एवेन्यू पर, अमेरिका</a>। 67.3 × 212.1 × 61.9 सेमी।</p><img src="https://res.bibleox.com/s/img/image/simple/68b5e69845c75323d28a5e9d/s_p_Kk1dIB2OLr1OjQ1O.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5e69845c75323d28a5e9d/m_p_Kk1dIB2OLr1OjQ1O.jpg">बड़ा करें</a>]</p><h3>मसीह, पट्टिका (खेरसोनेस)</h3><p>300-500 ई. <a href="https://collections.louvre.fr/en/ark:/53355/cl010276835">लूव्र, फ़्रांस</a>। संग्रहालय का कहना है कि दूसरा भाग हर्मिताज़ में सुरक्षित है। उस पर प्रेरित पतरस से कहे गए शब्द खुदे हुए हैं।</p><img src="https://res.bibleox.com/s/img/image/simple/68c41cec6594f46d35a87f04/s_p_esWl4etLsBMVz9bw.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c41cec6594f46d35a87f04/m_p_esWl4etLsBMVz9bw.jpg">बड़ा करें</a>]</p><h3>मसीह-गुरु (रोम)</h3><p>डोमिसिला के कैटाकॉम्ब। क्यूबिकुला के ल्यूनेट का भित्तिचित्र।</p><img src="https://res.bibleox.com/s/img/image/simple/674ed2a4dba77200011c738a/s_p_4M8Vki7GNJBHkJPN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674ed2a4dba77200011c738a/m_p_4M8Vki7GNJBHkJPN.jpg">बड़ा करें</a>]</p><h3>प्रभु यीशु मसीह (रोम)</h3><p>तीसरी-पाँचवीं शताब्दी। जेनेरोसा के कैटाकॉम्ब [7]</p><img src="https://res.bibleox.com/s/img/image/simple/674f2408dba77200011c739c/s_p_zVliPTIYBpqqnTGQ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f2408dba77200011c739c/m_p_zVliPTIYBpqqnTGQ.jpg">बड़ा करें</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6931a55a205184ec278d6faf/s_p_xXRXPudiFDi6GltL.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931a55a205184ec278d6faf/m_p_xXRXPudiFDi6GltL.jpg">बड़ा करें</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686bf5b25f47da2505d3ae36/m_p_Io7kaT9uNdBPFcSj.jpg">संस्करण 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a5b6205184ec278d6fb0/m_p_btFyqkRBFzGf0FSH.jpg">संस्करण 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a5e4205184ec278d6fb1/m_p_wuVaj4ghYuk6s5cc.jpg">संस्करण 4</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a5fe205184ec278d6fb2/m_p_mO6KaZXywWX76vBg.jpg">संस्करण 5</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a656205184ec278d6fb3/m_p_eqLfG1BFyG45i90X.jpg">संस्करण 6</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a858205184ec278d6fb5/m_p_EVVCP1plDQZ4XgAS.jpg">संस्करण 7</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6931a360205184ec278d6fab/s_p_hObpAcapDVZvLsC1.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931a360205184ec278d6fab/m_p_hObpAcapDVZvLsC1.jpg">बड़ा करें</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6931a369205184ec278d6fad/s_p_8bP3aXtUgkNcP9gz.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931a369205184ec278d6fad/m_p_8bP3aXtUgkNcP9gz.jpg">बड़ा करें</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6931a363205184ec278d6fac/s_p_BcSN3IXA4JYFLpgA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931a363205184ec278d6fac/m_p_BcSN3IXA4JYFLpgA.jpg">बड़ा करें</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6931a36f205184ec278d6fae/s_p_6J6vSMM0TM5tc59T.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931a36f205184ec278d6fae/m_p_6J6vSMM0TM5tc59T.jpg">बड़ा करें</a>]</p><h3>संत बीआत्रिचे और सिम्प्लिचियो (अथवा रूफ़ो) (रोम)</h3><p>तीसरी-पाँचवीं शताब्दी। जेनेरोसा के कैटाकॉम्ब [7]</p><img src="https://res.bibleox.com/s/img/image/simple/66cc2c40dba77200019bc7d8/s_p_zABjPHGhPdjGVh3U.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/66cc2c40dba77200019bc7d8/m_p_zABjPHGhPdjGVh3U.jpg">बड़ा करें</a>]</p><h3>प्रेरित पतरस और पौलुस (रोम)</h3><p>~380 ई.। सांता-तेक्ला (संत थेक्ला) के कैटाकॉम्ब, भित्तिचित्र [24]</p><p>यहाँ प्रेरित दर्शाए गए हैं: पतरस, पौलुस, अन्द्रियास, यूहन्ना।</p><img src="https://res.bibleox.com/s/img/image/simple/686bf38e5f47da2505d3ae35/s_p_BxfiObhkLMfci8nP.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686bf38e5f47da2505d3ae35/m_p_BxfiObhkLMfci8nP.jpg">बड़ा करें</a>] [<a href="https://res.bibleox.com/s/img/image/simple/687291145f47da2505d3ae8b/m_p_WXlkaMJTOrIzlOdI.jpg">संस्करण 2</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/68b6cd4802e89ba22dfc3977/s_p_kAWGH2VPHMkRv9cL.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b6cd4802e89ba22dfc3977/m_p_kAWGH2VPHMkRv9cL.jpg">बड़ा करें</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686bf5bf5f47da2505d3ae37/m_p_F0tsoqA9bv6CrpfE.jpg">संस्करण 2</a>]</p><h3>प्रेरित पतरस और पौलुस (बीज़ान्टियम)</h3><p>चौथी शताब्दी का मध्य। मसीह प्रेरितों पतरस और पौलुस को शहीदों के मुकुट प्रदान करते हैं। <a href="https://www.metmuseum.org/art/collection/search/463547">मेट्रोपॉलिटन संग्रहालय, 5वें एवेन्यू पर, अमेरिका</a>। रोम अथवा बीज़ान्टियम। 13.8 x 12.5 x 5 सेमी।</p><img src="https://res.bibleox.com/s/img/image/simple/68b5f5d745c75323d28a5ebc/s_p_MiCffui3hayo2BCt.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5f5d745c75323d28a5ebc/m_p_MiCffui3hayo2BCt.jpg">बड़ा करें</a>]</p><hr><p>चौथी शताब्दी का मध्य। <a href="https://www.metmuseum.org/art/collection/search/468386">मेट्रोपॉलिटन संग्रहालय, 5वें एवेन्यू पर, अमेरिका</a>। रोम अथवा बीज़ान्टियम। 8.5 x 14 x 13.3 सेमी।</p><img src="https://res.bibleox.com/s/img/image/simple/68b5e89c45c75323d28a5ea1/s_p_HAfNPGdEHMp67CuN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5e89c45c75323d28a5ea1/m_p_HAfNPGdEHMp67CuN.jpg">बड़ा करें</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5e88f45c75323d28a5ea0/m_p_gvro4Ry9POJUm0nR.jpg">पार्श्व दृश्य</a>]</p><hr><p>चौथी शताब्दी का अंत। <a href="https://www.metmuseum.org/art/collection/search/463714">मेट्रोपॉलिटन संग्रहालय, 5वें एवेन्यू पर, अमेरिका</a>। काँच, सोने की पत्ती।</p><img src="https://res.bibleox.com/s/img/image/simple/68b5e68b45c75323d28a5e9c/s_p_uRLyImBPPDsr48G2.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5e68b45c75323d28a5e9c/m_p_uRLyImBPPDsr48G2.jpg">बड़ा करें</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5e76d45c75323d28a5e9e/m_p_62cHpid14wgeSyqc.jpg">संस्करण 2</a>]</p><hr><p>चौथी शताब्दी का मध्य। प्रेरित पतरस और पौलुस, पेरेग्रिना। <a href="https://www.metmuseum.org/art/collection/search/465922">मेट्रोपॉलिटन संग्रहालय, 5वें एवेन्यू पर, अमेरिका</a>। 11.5 x 13.3 x 1.2 सेमी।</p><img src="https://res.bibleox.com/s/img/image/simple/68b5e7d145c75323d28a5e9f/s_p_atDwcEc3h2ZyYLRb.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5e7d145c75323d28a5e9f/m_p_atDwcEc3h2ZyYLRb.jpg">बड़ा करें</a>]</p><h3>प्रेरित पतरस और पौलुस (रोम)</h3><p>चौथी शताब्दी। कैटाकॉम्ब में बालकों की अंत्येष्टि-खोह (loculus) को ढकने के लिए प्रयुक्त पट्टिका। रोम, वेटिकन संग्रहालय, पायस ईसाई संग्रहालय।</p><img src="https://res.bibleox.com/s/img/image/simple/674f1bc0dba77200011c739a/s_p_uH3btIsNTUn6lHGQ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f1bc0dba77200011c739a/m_p_uH3btIsNTUn6lHGQ.jpg">बड़ा करें</a>]</p><h3>परमेश्वर की माता शिशु मसीह के साथ (रोम)</h3><p>तीसरी-चौथी शताब्दी। डोमिसिला के कैटाकॉम्ब।</p><img src="https://res.bibleox.com/s/img/image/simple/66cc2c11dba77200019bc7d5/s_p_rZQc8oqW4YIrUMho.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/66cc2c11dba77200019bc7d5/m_p_rZQc8oqW4YIrUMho.jpg">बड़ा करें</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686d246b5f47da2505d3ae57/m_p_AZTFv8hTAm4Eo9yp.jpg">संस्करण 2</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686d24885f47da2505d3ae58/s_p_Z1QqJZuraUn8iLSV.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d24885f47da2505d3ae58/m_p_Z1QqJZuraUn8iLSV.jpg">बड़ा करें</a>]</p><h3>मसीह की प्रतिमा वाला क्रूस (बीज़ान्टियम)</h3><p>395-641 ई. <a href="https://collections.louvre.fr/en/ark:/53355/cl010043937">लूव्र, फ़्रांस</a>। 8,5 × 20 × 1,2 सेमी।</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c5886594f46d35a87ec7/s_p_wU3HuTavyFqHCHIc.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c5886594f46d35a87ec7/m_p_wU3HuTavyFqHCHIc.jpg">बड़ा करें</a>]</p><h3>आइकॉन (मिस्र)</h3><p>395-641 ई. <a href="https://collections.louvre.fr/en/ark:/53355/cl010049211">लूव्र, फ़्रांस</a>। 24 × 17,5 सेमी</p><img src="https://res.bibleox.com/s/img/image/simple/68c3bf006594f46d35a87ebf/s_p_m1O6PHgeoR9L2huf.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3bf006594f46d35a87ebf/m_p_m1O6PHgeoR9L2huf.jpg">बड़ा करें</a>]</p><hr><p><a href="https://collections.louvre.fr/en/ark:/53355/cl010049209">लूव्र, फ़्रांस</a>।</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c8966594f46d35a87ec8/s_p_hfH86ZqQDaRWHKRA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c8966594f46d35a87ec8/m_p_hfH86ZqQDaRWHKRA.jpg">बड़ा करें</a>]</p><h3>संत मीनास के आइकॉन वाली अम्पुला (बीज़ान्टियम)</h3><p>395-641 ई. <a href="https://collections.louvre.fr/en/ark:/53355/cl010042774">लूव्र, फ़्रांस</a>।</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c4176594f46d35a87ec3/s_p_RYRsljTrixb3giuP.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c4176594f46d35a87ec3/m_p_RYRsljTrixb3giuP.jpg">बड़ा करें</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c3c4196594f46d35a87ec4/m_p_20KqaRLqoxUISfqB.jpg">पिछला भाग</a>]</p><hr><p>395-641 ई. <a href="https://collections.louvre.fr/en/ark:/53355/cl010042778">लूव्र, फ़्रांस</a>। ऐसे अम्पुले विभिन्न संग्रहालयों में बहुत बड़ी संख्या में मिलते हैं। अन्य उदाहरण: <a href="https://collections.louvre.fr/en/ark:/53355/cl010042780">1</a>, <a href="https://collections.louvre.fr/en/ark:/53355/cl010042798">2</a>, <a href="https://collections.louvre.fr/en/ark:/53355/cl010042802">3</a>, <a href="https://collections.louvre.fr/en/ark:/53355/cl010043779">4</a>, <a href="https://collections.louvre.fr/en/ark:/53355/cl010076645">5</a>, <a href="https://collections.louvre.fr/en/ark:/53355/cl010051239">6</a>, <a href="https://collections.louvre.fr/en/ark:/53355/cl010263188">7</a>, <a href="https://collections.louvre.fr/en/ark:/53355/cl010280896">8</a>, <a href="https://collections.louvre.fr/en/ark:/53355/cl010044285">9</a>, <a href="https://collections.louvre.fr/en/ark:/53355/cl010280846">10</a>, <a href="https://collections.louvre.fr/en/ark:/53355/cl010280894">11</a>, <a href="https://www.clevelandart.org/art/1999.232">12</a>, <a href="https://www.clevelandart.org/art/1999.233">13</a>, <a href="https://www.clevelandart.org/art/1999.231">14</a>, <a href="https://www.clevelandart.org/art/1999.230">15</a>।</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c4c66594f46d35a87ec5/s_p_b5etRE60QJjNF7zQ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c4c66594f46d35a87ec5/m_p_b5etRE60QJjNF7zQ.jpg">बड़ा करें</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c4cd6594f46d35a87ec6/s_p_vJbng6ICUUefTimC.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c4cd6594f46d35a87ec6/m_p_vJbng6ICUUefTimC.jpg">बड़ा करें</a>]</p><h3>सीसे की अम्पुला जिस पर परमेश्वर की माता और मसीह की प्रतिमा है (इटली, बोलोन्या)</h3><p>चौथी-पाँचवीं शताब्दी। «ऐसे अम्पुले पवित्र स्थानों से पवित्र तेल लेकर पूर्व से, विशेष रूप से पलेस्तीन से, तीर्थयात्रियों द्वारा बहुत बड़ी संख्या में लाए जाते थे, जहाँ चौथी शताब्दी के अंत से और पाँचवीं शताब्दी के पूर्वार्ध में बड़ी संख्या में तीर्थयात्राएँ प्रारंभ हुई थीं» [27]</p><img src="https://res.bibleox.com/s/img/image/simple/686d3bdc5f47da2505d3ae5f/s_p_gcwh26YTfBvz5FbR.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d3bdc5f47da2505d3ae5f/m_p_gcwh26YTfBvz5FbR.jpg">बड़ा करें</a>]</p><h2>पाँचवीं शताब्दी</h2><h3>परमेश्वर की माता शिशु यीशु के साथ, शहीद फ़ेलिक्स और अदाउक्त, विधवा कोमोदिल्ला (रोम)</h3><p>पाँचवीं-छठी शताब्दी। कोमोदिल्ला के कैटाकॉम्ब। बाईं ओर अग्रभूमि में विधवा कोमोदिल्ला दर्शाई गई है — एक धनी रोमन स्त्री, जिनके स्मरण में कैटाकॉम्ब का मंदिर बनाया गया था।</p><img src="https://res.bibleox.com/s/img/image/simple/674edb84dba77200011c738c/s_p_urBcFMzNnn49NanW.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674edb84dba77200011c738c/m_p_urBcFMzNnn49NanW.jpg">बड़ा करें</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686bf61f5f47da2505d3ae38/m_p_gOZdkzGPGcL4Vws0.jpg">संस्करण 2</a>]</p><h3>मसीह और परमेश्वर की माता (बीज़ान्टियम)</h3><p>400-500 ई. सामग्री: सोना। 3,7 × 4 × 0,3 सेमी; भार: 4,04 ग्राम। <a href="https://collections.louvre.fr/en/ark:/53355/cl010256498">लूव्र, फ़्रांस</a>।</p><img src="https://res.bibleox.com/s/img/image/simple/68c403846594f46d35a87efb/s_p_Ahj64DxPe313azhi.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c403846594f46d35a87efb/m_p_Ahj64DxPe313azhi.jpg">बड़ा करें</a>]</p><h3>शहीद लॉरेंस (रावेन्ना)</h3><p>425 ई.। गाल्ला प्लासीदिया का मक़बरा[1][2][25]। खुली अलमारी में चार सुसमाचार: मरकुस, मत्ती, लूका और यूहन्ना के अनुसार। संत क्रूस और खुला सुसमाचार लिए उस लोहे की जाली की ओर जा रहे हैं जिसके नीचे आग जल रही है।</p><img src="https://res.bibleox.com/s/img/image/simple/674ee461dba77200011c738e/s_p_EPEyZAtXMtLhz0vO.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674ee461dba77200011c738e/m_p_EPEyZAtXMtLhz0vO.jpg">बड़ा करें</a>]</p><h3>प्रेरित पौलुस (इफ़िस)</h3><p>पौलुस की गुफा में पाँचवीं शताब्दी के अंत का भित्तिचित्र[4]।</p><img src="https://res.bibleox.com/s/img/image/simple/674f2a67dba77200011c73a0/s_p_Og6LudyAS5axVwrH.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f2a67dba77200011c73a0/m_p_Og6LudyAS5axVwrH.jpg">बड़ा करें</a>]</p><h3>प्रेरित पौलुस (नेपल्स)</h3><p>पाँचवीं शताब्दी का अंत। सान-जेन्नारो के कैटाकॉम्ब, भित्तिचित्र। संभवतः प्रेरित पौलुस दर्शाए गए हैं।</p><img src="https://res.bibleox.com/s/img/image/simple/674f2705dba77200011c739d/s_p_XdEMnSngRpC4ver8.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f2705dba77200011c739d/m_p_XdEMnSngRpC4ver8.jpg">बड़ा करें</a>]</p><h3>इकोनियम की थेक्ला, शहीदा (इफ़िस)</h3><p>संत पौलुस और थेक्ला की गुफा। प्रेरित पौलुस के प्रचार से विश्वास करनेवालों में से एक, आरंभिक शताब्दियों की शहीदा। 2013 में इस गुफा को इस्लामी उग्रवादियों ने अपवित्र किया[4]।</p><img src="https://res.bibleox.com/s/img/image/simple/674f2c2edba77200011c73a1/s_p_tCvOXPpRP5ogjE1Y.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f2c2edba77200011c73a1/m_p_tCvOXPpRP5ogjE1Y.jpg">बड़ा करें</a>]</p><h3>महाशहीद थेसालोनिकी के दिमित्री और एक स्वर्गदूत (थेसालोनिकी, बीज़ान्टियम)</h3><p>पाँचवीं-छठी शताब्दी। थेसालोनिकी में संत दिमित्री की बासिलिका। मंदिर के पश्चिमी भाग में मोज़ेक [10]</p><img src="https://res.bibleox.com/s/img/image/simple/686984705f47da2505d3ae11/s_p_bliIzjPrQcGjWmMT.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686984705f47da2505d3ae11/m_p_bliIzjPrQcGjWmMT.jpg">बड़ा करें</a>]</p><h3>महाशहीद थेसालोनिकी के दिमित्री और एक बालक (थेसालोनिकी, बीज़ान्टियम)</h3><p>पाँचवीं-छठी शताब्दी। थेसालोनिकी में संत दिमित्री की बासिलिका। दक्षिणी नेव की पश्चिमी दीवार पर मोज़ेक [10]</p><img src="https://res.bibleox.com/s/img/image/simple/68697c845f47da2505d3ae10/s_p_T8JYB6OgB0WUM8O6.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68697c845f47da2505d3ae10/m_p_T8JYB6OgB0WUM8O6.jpg">बड़ा करें</a>]</p><h3>सीनेटर का भवन, सांता-पुदेंचियाना (रोम)</h3><p>402-417 ई. [13][14]</p><img src="https://res.bibleox.com/s/img/image/simple/6869938e5f47da2505d3ae1c/s_p_l5Dokt3jzLvx6IxN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6869938e5f47da2505d3ae1c/m_p_l5Dokt3jzLvx6IxN.jpg">बड़ा करें</a>]</p><h3>सांता मारिया माजोरे (रोम)</h3><p>432-440 ई. [15][16]</p><img src="https://res.bibleox.com/s/img/image/simple/6869954e5f47da2505d3ae1d/s_p_0bDTRtbRpWWnfPQR.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6869954e5f47da2505d3ae1d/m_p_0bDTRtbRpWWnfPQR.jpg">बड़ा करें</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686995555f47da2505d3ae1e/s_p_FLcJtADykEgKNDDd.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686995555f47da2505d3ae1e/m_p_FLcJtADykEgKNDDd.jpg">बड़ा करें</a>]</p><h3>मसीह, तीन युवक, ज्योतिषी (उत्तरी इटली)</h3><p>400-450 ई. <a href="https://collections.louvre.fr/en/ark:/53355/cl010256191">लूव्र, फ़्रांस</a>। चाँदी, 6,3 × 12,3 × 7,1 सेमी।</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c1756594f46d35a87ec1/s_p_WzOTF3me39ISTfnN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c1756594f46d35a87ec1/m_p_WzOTF3me39ISTfnN.jpg">बड़ा करें</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c1796594f46d35a87ec2/s_p_a0udZW5EPewQCqsl.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c1796594f46d35a87ec2/m_p_a0udZW5EPewQCqsl.jpg">बड़ा करें</a>]</p><h3>आइकॉन, प्रेरित पतरस संत मरकुस को सुसमाचार बोलकर लिखवा रहे हैं (मिस्र)</h3><p>440-670 ई. <a href="https://www.metmuseum.org/art/collection/search/477163">मेट्रोपॉलिटन संग्रहालय, 5वें एवेन्यू पर, अमेरिका</a>। 13.5 x 10 x 0.8 सेमी। यह भी देखें: <a href="https://www.metmuseum.org/art/collection/search/477492">1</a>, <a href="https://www.metmuseum.org/art/collection/search/477487">2</a>, <a href="https://www.metmuseum.org/art/collection/search/477481">3</a>, <a href="https://www.metmuseum.org/art/collection/search/477489">4</a>, <a href="https://www.metmuseum.org/art/collection/search/477491">5</a>।</p><img src="https://res.bibleox.com/s/img/image/simple/68c1c2f56594f46d35a87e74/s_p_BWhcee0cn10mz7dc.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1c2f56594f46d35a87e74/m_p_BWhcee0cn10mz7dc.jpg">बड़ा करें</a>]</p><h3>अज्ञात संत (बीज़ान्टियम, मिस्र)</h3><p>पाँचवीं-छठी शताब्दी। <a href="https://www.metmuseum.org/art/collection/search/329982">मेट्रोपॉलिटन संग्रहालय, 5वें एवेन्यू पर, अमेरिका</a>। 44 × 32.5 सेमी।</p><img src="https://res.bibleox.com/s/img/image/simple/68b5eb2d45c75323d28a5ea3/s_p_E5UUO66hSfRBtXUn.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5eb2d45c75323d28a5ea3/m_p_E5UUO66hSfRBtXUn.jpg">बड़ा करें</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5eb2845c75323d28a5ea2/m_p_ofbMCUTa1winWDg0.jpg">संस्करण 2</a>]</p><h3>संत मीनास की प्रतिमा वाली अम्पुला (क़िब्ती मिस्र)</h3><p>पाँचवीं-सातवीं शताब्दी। <a href="https://collections.hermitagemuseum.org/entity/OBJECT/87092?query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=34">हर्मिताज़, रूस</a>।</p><img src="https://res.bibleox.com/s/img/image/simple/6863c0796480b4d285320413/s_p_sW3adkK7lr960dU5.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c0796480b4d285320413/m_p_sW3adkK7lr960dU5.jpg">बड़ा करें</a>]</p><hr><p>पाँचवीं-छठी शताब्दी, संत मीनास की प्रतिमा वाली अम्पुला (मिस्र)। <a href="https://www.metmuseum.org/art/collection/search/854993">मेट्रोपॉलिटन संग्रहालय, 5वें एवेन्यू पर, अमेरिका</a>।</p><img src="https://res.bibleox.com/s/img/image/simple/68b5f3f845c75323d28a5eb8/s_p_ePhTgphiYrxHdEaZ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5f3f845c75323d28a5eb8/m_p_ePhTgphiYrxHdEaZ.jpg">बड़ा करें</a>]</p><hr><p>पाँचवीं-छठी शताब्दी, संत मीनास की प्रतिमा वाली अम्पुला (मिस्र)। <a href="https://www.metmuseum.org/art/collection/search/854994">मेट्रोपॉलिटन संग्रहालय, 5वें एवेन्यू पर, अमेरिका</a>।</p><img src="https://res.bibleox.com/s/img/image/simple/68b5f40645c75323d28a5eb9/s_p_5HMBehehtBuCUdOm.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5f40645c75323d28a5eb9/m_p_5HMBehehtBuCUdOm.jpg">बड़ा करें</a>]</p><h3>मसीह की प्रतिमा वाली अंगूठी (मिस्र, लक्सर)</h3><p>पाँचवीं-सातवीं शताब्दी। <a href="https://collections.hermitagemuseum.org/entity/OBJECT/111849?page=5&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%B0&amp;index=240">हर्मिताज़, रूस</a>।</p><img src="https://res.bibleox.com/s/img/image/simple/6863c4d46480b4d285320420/s_p_SyuBoqgvHXMA5UIe.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c4d46480b4d285320420/m_p_SyuBoqgvHXMA5UIe.jpg">बड़ा करें</a>]</p><h2>छठी शताब्दी</h2><h3>प्रभु यीशु मसीह (सीनै)</h3><p>छठी शताब्दी। संत कैथरीन का मठ, मिस्र [3]।</p><img src="https://res.bibleox.com/s/img/image/simple/686fe7935f47da2505d3ae87/s_p_cikLnQnMeZgiaeXg.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686fe7935f47da2505d3ae87/m_p_cikLnQnMeZgiaeXg.jpg">बड़ा करें</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6872d4935f47da2505d3ae90/m_p_1CbtDgulMkyLj9dK.jpg">संस्करण 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6872d4835f47da2505d3ae8d/m_p_IPypUclQUGcqTIJa.jpg">संस्करण 3</a>]</p><h3>परमेश्वर की माता शिशु यीशु के साथ, संत थियोदोर और जॉर्ज (सीनै)</h3><p>छठी शताब्दी। संत कैथरीन का मठ, एनकॉस्टिक आइकॉन, मिस्र।</p><img src="https://res.bibleox.com/s/img/image/simple/674ece56dba77200011c7384/s_p_RWNQK8qhzLwXxGkf.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674ece56dba77200011c7384/m_p_RWNQK8qhzLwXxGkf.jpg">बड़ा करें</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6872d4895f47da2505d3ae8e/m_p_6JgREZVUzpO8lC9E.jpg">संस्करण 2</a>]</p><h3>प्रेरित पतरस (सीनै)</h3><p>छठी शताब्दी। संत कैथरीन का मठ, एनकॉस्टिक आइकॉन, मिस्र।</p><img src="https://res.bibleox.com/s/img/image/simple/686fe28f5f47da2505d3ae82/s_p_tWJyRADNEjI9Gt5J.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686fe28f5f47da2505d3ae82/m_p_tWJyRADNEjI9Gt5J.jpg">बड़ा करें</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686fe73d5f47da2505d3ae86/m_p_ztqtzVnOwMfzjCsd.jpg">संस्करण 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6872d48f5f47da2505d3ae8f/m_p_x4BAyJ0C1GjHQ7Us.jpg">संस्करण 3</a>]</p><h3>परमेश्वर की माता और बालक मसीह (बीज़ान्टियम)</h3><p>छठी शताब्दी। <a href="https://www.metmuseum.org/art/collection/search/463392">मेट्रोपॉलिटन संग्रहालय, 5वें एवेन्यू पर, अमेरिका</a>।</p><img src="https://res.bibleox.com/s/img/image/simple/68b5fce645c75323d28a5ec5/s_p_KB8coyb4H50zurQW.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5fce645c75323d28a5ec5/m_p_KB8coyb4H50zurQW.jpg">बड़ा करें</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5fce945c75323d28a5ec6/m_p_eIaeevwinjFBQAeA.jpg">संस्करण 2</a>]</p><h3>परमेश्वर की माता और बालक मसीह के आइकॉन वाली अंगूठी (बीज़ान्टियम)</h3><p>छठी-सातवीं शताब्दी। <a href="https://www.metmuseum.org/art/collection/search/464059">मेट्रोपॉलिटन संग्रहालय, 5वें एवेन्यू पर, अमेरिका</a>।</p><img src="https://res.bibleox.com/s/img/image/simple/68b5fe7745c75323d28a5ec7/s_p_bcCSRfNkRmmk5jZs.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5fe7745c75323d28a5ec7/m_p_bcCSRfNkRmmk5jZs.jpg">बड़ा करें</a>]</p><h3>पवित्र मरियम</h3><p>611 ई., <a href="https://www.pravenc.ru/text/164537.html">गेरासा</a></p><img src="https://res.bibleox.com/s/img/image/simple/482/s_p_s3flMTpYpn69iMIy.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/482/m_p_s3flMTpYpn69iMIy.jpg">बड़ा करें</a>]</p><h3>मसीह, पदक (अन्ताकिया)</h3><p>500-625 ई. सामग्री: चाँदी, सुनहरा लेप। 14,9 × 14,1 × 1,1 सेमी। <a href="https://collections.louvre.fr/en/ark:/53355/cl010256496">लूव्र, फ़्रांस</a>।</p><img src="https://res.bibleox.com/s/img/image/simple/68c409da6594f46d35a87f00/s_p_BHIOy3tEZ3ZoMEr5.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c409da6594f46d35a87f00/m_p_BHIOy3tEZ3ZoMEr5.jpg">बड़ा करें</a>]</p><hr><p>500-625 ई. <a href="https://collections.louvre.fr/en/ark:/53355/cl010256495">लूव्र, फ़्रांस</a>।</p><img src="https://res.bibleox.com/s/img/image/simple/68c41f626594f46d35a87f05/s_p_bKgaW542SgyD11o9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c41f626594f46d35a87f05/m_p_bKgaW542SgyD11o9.jpg">बड़ा करें</a>]</p><h3>आइकॉनों वाली टेपेस्ट्री: मसीह, परमेश्वर की माता, महादूत मीकाएल और गब्रिएल, प्रेरित (मिस्र, बीज़ान्टियम)</h3><p>500 ई. <a href="https://www.clevelandart.org/art/1967.144">क्लीवलैंड कला संग्रहालय, अमेरिका</a>। ऊन, 178,7 x 110,5 सेमी।</p><p>संग्रहालय की टिप्पणी:</p><blockquote><p>बीस से अधिक रंगों के ऊनी धागों से बनी यह दुर्लभ टेपेस्ट्री अपने समय में चित्रित कैनवास से भी महँगी थी। उस ऐतिहासिक कीमत में उस युग के लोगों द्वारा बुनकरों के हाथों प्राप्त रंगों के निपुण मिश्रण की स्वीकृति प्रतिबिंबित होती थी। दीवार पर लगी <strong>यह बुनी हुई आइकॉन श्रद्धालुओं को रूढ़िवादी मंदिर की दीवारों के भीतर परमेश्वर की माता और बालक मसीह का आदर करने की सुविधा देती थी</strong>। उन्हें स्वर्गदूत और प्रेरित घेरे हुए हैं, जिनके नाम यूनानी भाषा में लिखे हैं। आत्मिक रूप से प्रभावी होने के लिए आइकॉन (पवित्र प्रतिमा) को अपने प्रतिरूप की स्थापित चित्रकला-परंपरा का यथासंभव सूक्ष्मता से पालन करना चाहिए।</p><p>वास्तुशिल्पीय चौखटे की पट्टी पर लिखा शिलालेख यूनानी से «<strong>संत मीकाएल, पवित्र मरियम, संत गब्रिएल</strong>» के रूप में अनूदित होता है। चौड़ी पत्तियोंवाली किनारी फलों और फूलों से सजी है, और निचले भाग में प्रेरितों के अर्धकाय वाले पदक हैं, जिनके नाम पास में यूनानी में लिखे हैं और «<strong>अन्द्रियास, मत्ती, प्रेरित पौलुस, लूका, याकूब, फ़िलिप्पुस, मरकुस, थोमा, यूहन्ना, मत्तिय्याह, पतरस और बरतुल्मै</strong>» के रूप में अनूदित होते हैं।</p></blockquote><img src="https://res.bibleox.com/s/img/image/simple/68cb9dd5205184ec278d58d7/s_p_jXuLxO8mwNy5DicO.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68cb9dd5205184ec278d58d7/m_p_jXuLxO8mwNy5DicO.jpg">बड़ा करें</a>]</p><h3>आइकॉनों वाली टेपेस्ट्री। तीन युवक?, क्राइस्म (मिस्र, बीज़ान्टियम)</h3><p>500 के दशक में। <a href="https://www.clevelandart.org/art/1982.73">क्लीवलैंड कला संग्रहालय, अमेरिका</a>। ऊन, सन। 110,5 x 76,8 सेमी।</p><img src="https://res.bibleox.com/s/img/image/simple/68cb9dde205184ec278d58d8/s_p_w5vxLEtZSz6mW36r.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68cb9dde205184ec278d58d8/m_p_w5vxLEtZSz6mW36r.jpg">बड़ा करें</a>]</p><h3>आइकॉनों वाली टेपेस्ट्री। परमेश्वर की माता, ज्योतिषी, भविष्यद्वक्ता योना (मिस्र, बीज़ान्टियम)</h3><p>500-550 ई. <a href="https://www.clevelandart.org/art/1951.400">क्लीवलैंड कला संग्रहालय, अमेरिका</a>। सन। 99,7 x 104,8 सेमी।</p><p>संग्रहालय की टिप्पणी:</p><blockquote><p>… ऊपरी पट्टी में बाईं ओर क्रूस के आकार के पाए वाले स्टूल पर <strong>कन्या मरियम बालक मसीह के साथ</strong> दर्शाई गई हैं। जैसा कि क़िब्ती शिलालेख में कहा गया है, <strong>तीन राजा उपहार लेकर दाईं ओर से निकट आ रहे हैं</strong>। बीच की पट्टी में बाईं ओर संभवतः <strong>मसीह का बपतिस्मा</strong> दर्शाया गया है, जबकि स्तंभों से अलग की गई तीन अन्य आकृतियाँ, जैसा दिखता है, नए नियम के उस चमत्कार को दर्शाती हैं जिसमें मसीह ने केवल पाँच रोटियों और दो मछलियों से बड़ी भीड़ को भोजन खिलाया था। निचली पट्टी में अभी भी <strong>भविष्यद्वक्ता योना के व्हेल द्वारा निगले जाने का पुराने नियम का दृश्य</strong> पहचाना जा सकता है।</p><p>यूनानी शिलालेख पुराने और नए नियम के विभिन्न दृश्यों की पहचान कराते हैं। ऊपरी पट्टी में पहले ज्योतिषी के ऊपर सोने को दर्शानेवाले यूनानी शब्द के दो अक्षर <strong>«XP»</strong> (<em>χρυσός - chrysós</em>) पहचाने जा सकते हैं। बीच की पट्टी में बाईं ओर दो आकृतियाँ दर्शाई गई हैं: पहली लगभग पूरी तरह नष्ट हो चुकी है, और दूसरी की पहचान शिलालेख <strong>«EIΩANNHC» (यूहन्ना)</strong> से होती है। निचली पट्टी में किनारे पर फेंके गए योना की प्रतिमा है, जिनके पास एक बड़ी मछली है और साथ में शिलालेख <strong>«EIΩNAC» (योना)</strong> है। लगभग पूरी तरह खो चुके मूसा की पहचान केवल उनके शिलालेख <strong>«MWCHC» (मूसा)</strong> से हो सकती है।</p></blockquote><img src="https://res.bibleox.com/s/img/image/simple/68cb9e0d205184ec278d58d9/s_p_WiTqygXUYCZZY7TF.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68cb9e0d205184ec278d58d9/m_p_WiTqygXUYCZZY7TF.jpg">बड़ा करें</a>]</p><h3>आइकॉनों वाले यूखरिस्तीय प्याले और धूपदानियाँ (बीज़ान्टियम, सीरिया, अत्तरुती)</h3><p>500-650 ई. <a href="https://www.metmuseum.org/art/collection/search/474390">मेट्रोपॉलिटन संग्रहालय, 5वें एवेन्यू पर, अमेरिका</a>। चाँदी, सुनहरा लेप। प्यालों पर प्रभु और संतों के आइकॉन हैं, तथा यह भी लिखा है कि उन्हें किसने और किसे भेंट किया।</p><p>ये निपुणता से बने लीटर्जी-संबंधी पात्र — प्याले, धूपदानियाँ, छलनी और पवित्र आत्मा के कबूतर की प्रतिमा — सीरिया के समृद्ध व्यापारिक नगर अत्तरुती की मसीही कलीसिया के थे, जो उस समय बीज़ान्टियमी साम्राज्य के सबसे समृद्ध प्रदेशों में से एक था। प्याले, धूपदानियाँ और छलनी दिव्य लीटर्जी अर्थात् यूखरिस्त के समय प्रयोग होते थे — वह संस्कार जिसमें मसीही अंतिम भोज और मसीह की मृत्यु के स्मरण में पवित्र किए गए दाखरस और रोटी ग्रहण करते हैं।</p><p>इन पर यूनानी भाषा में कुछ वर्तनी-भिन्नताओं के साथ खुदे शिलालेखों के अनुसार, इनमें से अनेक पात्र स्थानीय लोगों ने नगर की मुख्य कलीसिया को, जो संत स्तिफ़नस को समर्पित थी, और एक छोटी कलीसिया को, जो संत यूहन्ना को समर्पित थी (संभवतः यूहन्ना अग्रदूत [बपतिस्मा देनेवाला]), भेंट किए थे।</p><p>सातवीं शताब्दी के आरम्भ में सीरिया पहले सासानी फ़ारसियों के आक्रमण से पराजित हुआ, और फिर इस्लाम की सेनाओं से। सम्भवतः ये कला-कृतियाँ जल्दबाज़ी में एक सुरक्षात्मक पात्र में दफ़्न की गई थीं, उसी समय जब बीज़ान्टियम सेना क्षेत्र पर आक्रमणकारियों के दबाव में पीछे हट रही थी।</p><img src="https://res.bibleox.com/s/img/image/simple/68b5db2045c75323d28a5e9a/s_p_kx70rC7wWJQtkfdG.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5db2045c75323d28a5e9a/m_p_kx70rC7wWJQtkfdG.jpg">बड़ा करें</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5edf045c75323d28a5ea5/m_p_Eru1rmuua6UWqjTz.jpg">संस्करण 2</a>]</p><hr><p>लम्बे बालों वाला यूहन्ना बपतिस्मा देनेवाला, ओरांता मुद्रा में (उठे हुए हाथों के साथ) परमेश्वर की माता, ओरांता मुद्रा में एक संत, दंड और ढाल के साथ एक संत योद्धा, क्रूस-चिह्नित तेजोवलय वाला युवा मसीह और कवच में एक और संत योद्धा जो ड्रैगन को मार रहा है (संत जॉर्ज?), मेहराबों के नीचे। <a href="https://www.metmuseum.org/art/collection/search/466137">मेट्रोपॉलिटन, 5वें एवेन्यू पर, अमेरिका</a>। 21.3 x 16 सेमी।</p><p>यूनानी में अभिलेख: «<strong>अपने उद्धार के लिए एवदोक्सिया ने अत्तर[उति] गाँव के संत स्तेफ़न को [यह] भेंट चढ़ाई</strong>»।</p><img src="https://res.bibleox.com/s/img/image/simple/68b5efa445c75323d28a5eaa/s_p_l5pPSsTDZHSQuvNU.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5efa445c75323d28a5eaa/m_p_l5pPSsTDZHSQuvNU.jpg">बड़ा करें</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f01f45c75323d28a5eab/m_p_456sbKEe3ANd9ZWP.jpg">संस्करण 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f02245c75323d28a5eac/m_p_fkJIydq7uEfZbIUt.jpg">संस्करण 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f02445c75323d28a5ead/m_p_s25q6Lu5HItPjqDs.jpg">संस्करण 4</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f02745c75323d28a5eae/m_p_QJsAgl2zRfYmpNDL.jpg">संस्करण 5</a>]</p><hr><p>यूखरिस्तीय प्याला, जिस पर यूहन्ना बपतिस्मा देनेवाले का आइकॉन, संत डीकन (सम्भवतः स्तेफ़न), संत बिशप और क्रूस हैं। <a href="https://www.metmuseum.org/art/collection/search/466130">मेट्रोपॉलिटन, 5वें एवेन्यू पर, अमेरिका</a>। 20.5 × 15.1 cm, 369g, 1100 ml</p><p>यूनानी में अभिलेख: «<strong>अतारोतिस गाँव के संत यूहन्ना को</strong>»।</p><img src="https://res.bibleox.com/s/img/image/simple/68b5ec4545c75323d28a5ea4/s_p_KWMPzINWo4ktBKQ7.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5ec4545c75323d28a5ea4/m_p_KWMPzINWo4ktBKQ7.jpg">बड़ा करें</a>]</p><hr><p>यूखरिस्तीय प्याला, जिस पर मसीह, परमेश्वर की माता, यूहन्ना बपतिस्मा देनेवाला और संत जॉर्ज विजयी के आइकॉन हैं। <a href="https://www.metmuseum.org/art/collection/search/466129">मेट्रोपॉलिटन, 5वें एवेन्यू पर, अमेरिका</a>। 24,3 x 16,8 सेमी।</p><p>यूनानी में अभिलेख: «<strong>अत्तारुता गाँव के संत स्तेफ़न</strong>»।</p><img src="https://res.bibleox.com/s/img/image/simple/68b5ee1345c75323d28a5ea6/s_p_9bHxlNSj26b5EhMw.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5ee1345c75323d28a5ea6/m_p_9bHxlNSj26b5EhMw.jpg">बड़ा करें</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5ee3c45c75323d28a5ea7/m_p_8XweLe1b1pD7GWHb.jpg">संस्करण 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5ee4045c75323d28a5ea8/m_p_faMKsJUImltU9s6v.jpg">संस्करण 3</a>]</p><hr><p>यूखरिस्तीय प्याला, जिस पर क्रूस-चिह्नित तेजोवलय वाले युवा मसीह, धूपदानी लिए संत डीकन (सम्भवतः संत स्तेफ़न), प्रार्थना-मुद्रा में पवित्र मरियम और दंड लिए एक युवा संत की प्रतिमाएँ हैं। माप: 23.9 × 17 cm, 356g. <a href="https://www.metmuseum.org/art/collection/search/466141">मेट्रोपॉलिटन, 5वें एवेन्यू पर, अमेरिका।</a></p><p>यूनानी में अभिलेख: «<strong>मन्नत पूरी करने के लिए और उसके उद्धार के लिए जिसका नाम प्रभु जानता है</strong>»।</p><img src="https://res.bibleox.com/s/img/image/simple/68b5fa7a45c75323d28a5ebe/s_p_7AzZiy4FebkdJC4e.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5fa7a45c75323d28a5ebe/m_p_7AzZiy4FebkdJC4e.jpg">बड़ा करें</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5fa8345c75323d28a5ebf/m_p_LQnRTCSFvxz7O7ui.jpg">संस्करण 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5fa8645c75323d28a5ec0/m_p_KvY9o90gFdzJeK9N.jpg">संस्करण 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5fa8945c75323d28a5ec1/m_p_BUzuFJ6F1fLtMppI.jpg">संस्करण 4</a>]</p><hr><p>धूपदानी, जिस पर क्रूस-चिह्नित तेजोवलय वाले युवा मसीह, यूहन्ना बपतिस्मा देनेवाला, प्रार्थना-मुद्रा में पवित्र मरियम, संत डीकन (सम्भवतः संत स्तेफ़न) और क्रूसों की प्रतिमाएँ हैं। चाँदी और सोने की परत चढ़ी चाँदी, जिसके नीचे ताँबे की परत है। माप: 41,5 x 13,2 x 12,6 सेमी। <a href="https://www.metmuseum.org/art/collection/search/466132">मेट्रोपॉलिटन, 5वें एवेन्यू पर, अमेरिका</a>।</p><p>यूनानी में अभिलेख: «<strong>किरियाकोस की संतान एर्ता और स्तेफ़न की आत्मा के शान्ति-विश्राम के नाम</strong>»</p><img src="https://res.bibleox.com/s/img/image/simple/68b5f15545c75323d28a5eaf/s_p_OJ2d0ec3h6BtKZQM.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5f15545c75323d28a5eaf/m_p_OJ2d0ec3h6BtKZQM.jpg">बड़ा करें</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f15845c75323d28a5eb0/m_p_MLajjsEoJyZ7xPC7.jpg">संस्करण 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f15c45c75323d28a5eb1/m_p_5k22minZ9Q7EruSj.jpg">संस्करण 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f15e45c75323d28a5eb2/m_p_3cDRqzOwNAJr7A0S.jpg">संस्करण 4</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f16145c75323d28a5eb3/m_p_8vKQQvQJKE8Mbtoc.jpg">संस्करण 5</a>]</p><hr><p>धूपदानी, जिस पर क्रूस-चिह्नित तेजोवलय वाले युवा मसीह, दो प्रधान स्वर्गदूतों और क्रूसों की प्रतिमाएँ हैं। 8.2 x 13.2 सेमी। <a href="https://www.metmuseum.org/art/collection/search/466131">मेट्रोपॉलिटन, 5वें एवेन्यू पर, अमेरिका</a>।</p><p>यूनानी में अभिलेख: «<strong>अत्तारुता गाँव के संत यूहन्ना को</strong>»।</p><img src="https://res.bibleox.com/s/img/image/simple/68b5f27545c75323d28a5eb4/s_p_brjJXh3ZIrplms0E.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5f27545c75323d28a5eb4/m_p_brjJXh3ZIrplms0E.jpg">बड़ा करें</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f28545c75323d28a5eb5/m_p_oWtx1CexyxQIAxRK.jpg">संस्करण 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f28845c75323d28a5eb6/m_p_zqvxcBdCxjLqltWh.jpg">संस्करण 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f28c45c75323d28a5eb7/m_p_fIVExsqDAbrZLhWW.jpg">संस्करण 4</a>]</p><h3>मसीह और संतों की प्रतिमाओं वाले यूखरिस्तीय प्याले, क्रूस वाली थाली (सीरिया, बीज़ान्टियम)</h3><p>500-700 ई. क्लीवलैंड कला संग्रहालय, अमेरिका: <a href="https://www.clevelandart.org/art/1950.378">1</a>, <a href="https://www.clevelandart.org/art/1950.379">2</a>, <a href="https://www.clevelandart.org/art/1950.380">3</a>, <a href="https://www.clevelandart.org/art/1950.381">4</a>।</p><p>चाँदी के ये चार लीतुर्जिक पात्र — एक थाली और तीन प्याले (इन्व. 1950.378–81) — वह बनाते हैं जिसे आज «बेत-मीसोना का खज़ाना» कहा जाता है; यह नाम उत्तर सीरिया के उस गाँव के नाम पर है जिसके लिए ये वस्तुएँ बनाई गई थीं।</p><p>यद्यपि खज़ाने के मिलने का ठीक स्थान और परिस्थितियाँ अज्ञात हैं, बेत-मीसोना गाँव के निवासी, सीरिया और फ़िलिस्तीन की अन्य मसीही कलीसियाओं की तरह, सम्भवतः गिरजाघर की चाँदी को दफ़्न करने पर विवश हुए, ताकि उसे उन फ़ारसियों या अरबों से छिपा सकें जिन्होंने सातवीं शताब्दी के पूर्वार्ध में उनके देश पर विजय प्राप्त की थी।</p><p>थाली, जिस पर दिव्य लीतुर्जी के समय यूखरिस्तीय कण रखे जाते थे, उत्कीर्ण लातीनी क्रूस से सज्जित है, और उसके चारों ओर दान-अभिलेख है। उसमें थाली के दानकर्ता — दोम्न — और उसका मूल स्थान — बेत-मीसोना का संत सर्जियुस गिरजाघर — नामित हैं।</p><p>प्यालों के चौड़े कटोरे हैं जो मसीह, परमेश्वर की माता तथा प्रेरित पतरस और पौलुस की वक्ष-प्रतिमाओं से सज्जित हैं। इनमें से एक प्याले पर दानकर्ता — किरियाक, दोम्न का पुत्र — तथा उस गिरजाघर के पुरोहित का नाम अंकित है जिसने यह भक्तिपूर्ण दान प्राप्त किया — ज़ेनोन।</p><p>यूनानी में अभिलेख: «<strong>+ पुरोहित किरियाक, दोम्न का पुत्र, (यह प्याला) संत सर्जियुस को ज़ेनोन के पुरोहित-काल में भेंट किया</strong>»</p><img src="https://res.bibleox.com/s/img/image/simple/68caa03c205184ec278d5880/s_p_SB8idWRkPX7keKkU.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68caa03c205184ec278d5880/m_p_SB8idWRkPX7keKkU.jpg">मसीह</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68caa026205184ec278d587d/m_p_sYIDwGwUI9iMAzzD.jpg">परमेश्वर की माता</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68caa029205184ec278d587e/m_p_xYnPNjrcxGm5mJgl.jpg">प्रेरित</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68caa02c205184ec278d587f/m_p_kH9idfsikXyvAVvy.jpg">प्रेरित</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68caa0d4205184ec278d5881/m_p_vWERSBBMAoytSNnX.jpg">ऊपर से दृश्य</a>]</p><hr><img src="https://res.bibleox.com/s/img/image/simple/68ca9cd5205184ec278d5874/s_p_tH0J7uqAriM7uaeK.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68ca9cd5205184ec278d5874/m_p_tH0J7uqAriM7uaeK.jpg">मसीह</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68ca9d13205184ec278d5878/m_p_tYRbn15h6MPNUilS.jpg">परमेश्वर की माता</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68ca9ce8205184ec278d5875/m_p_FKfoi68UXlWCS5ky.jpg">प्रेरित</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68ca9ceb205184ec278d5876/m_p_Zp9CJ61HnBcr8Csr.jpg">प्रेरित</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68ca9cee205184ec278d5877/m_p_w2JDvDj5c4pMVcfk.jpg">ऊपर से दृश्य</a>]</p><hr><img src="https://res.bibleox.com/s/img/image/simple/68ca9e94205184ec278d5879/s_p_27LzQUQDD3A7nI9X.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68ca9e94205184ec278d5879/m_p_27LzQUQDD3A7nI9X.jpg">मसीह</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68ca9e98205184ec278d587a/m_p_R47Eqr4GrHijUSIb.jpg">परमेश्वर की माता</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68ca9e9b205184ec278d587b/m_p_31NEBZQIYBEqOut0.jpg">प्रेरित</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68ca9e9e205184ec278d587c/m_p_QxtJHMZORGGwFxYQ.jpg">प्रेरित</a>]</p><hr><p>लगभग 500 ई. थाली। <a href="https://www.clevelandart.org/art/1950.381">क्लीवलैंड कला संग्रहालय, अमेरिका</a>।</p><img src="https://res.bibleox.com/s/img/image/simple/68ca964d205184ec278d5873/s_p_wNDEaPHmGHiuWeZy.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68ca964d205184ec278d5873/m_p_wNDEaPHmGHiuWeZy.jpg">बड़ा करें</a>]</p><h3>धूपदानी। प्रभु यीशु मसीह का बपतिस्मा और क्रूसारोहण (बीज़ान्टियम)</h3><p>500-899 ई. माप: 13,4 x 9 सेमी। <a href="https://collections.louvre.fr/en/ark:/53355/cl010042067">लूव्र, फ़्रांस</a>।</p><img src="https://res.bibleox.com/s/img/image/simple/68c4068e6594f46d35a87efe/s_p_3kaCIWMTmQfT4NFG.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c4068e6594f46d35a87efe/m_p_3kaCIWMTmQfT4NFG.jpg">बड़ा करें</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/68c4061f6594f46d35a87efc/s_p_XNlsrfQ2MOphupt9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c4061f6594f46d35a87efc/m_p_XNlsrfQ2MOphupt9.jpg">बड़ा करें</a>]</p><h3>वाज़ा। मसीह, परमेश्वर की माता, यूहन्ना बपतिस्मा देनेवाला, प्रेरित, स्वर्गदूत (कुस्तुंतुनिया)</h3><img src="https://res.bibleox.com/s/img/image/simple/68c420e46594f46d35a87f06/s_p_iADN1OW5uYg5Wovc.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c420e46594f46d35a87f06/m_p_iADN1OW5uYg5Wovc.jpg">बड़ा करें</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c420e76594f46d35a87f07/m_p_oAs6ecjPj32iGMce.jpg">पिछला भाग</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c421216594f46d35a87f0f/m_p_x6q5apwWB0DZirK2.jpg">मसीह</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c420fc6594f46d35a87f0b/m_p_sL17qrWgxkRCNRBb.jpg">परमेश्वर की माता</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c420ea6594f46d35a87f08/m_p_Cb0UJi1oxoKCQaXw.jpg">यूहन्ना बपतिस्मा देनेवाला</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c421016594f46d35a87f0c/m_p_a9Y1fyPNxcQ4oNbq.jpg">स्वर्गदूत</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c420f66594f46d35a87f0a/m_p_nAqhqDbP5x8fRAnj.jpg">स्वर्गदूत</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c420ef6594f46d35a87f09/m_p_F9R3iyZ8go0PxARb.jpg">प्रेरित</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c4210a6594f46d35a87f0e/m_p_97cyzUvq95UJZOrR.jpg">प्रेरित</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c421056594f46d35a87f0d/m_p_WfK6SdjAqAOW9fDK.jpg">प्रेरित</a>]</p><h3>आइकॉन वाला गले का क्रूस (बीज़ान्टियम)</h3><p>छठी शताब्दी।<strong> </strong>सोना, पेस्ट, रॉक क्रिस्टल, काँच; स्टैम्पिंग, दानेदार कार्य। ज़ंजीर की लम्बाई: 33 सेमी; क्रूस: 4.9 x 3.8 सेमी। <a href="https://collections.hermitagemuseum.org/entity/OBJECT/227027?page=46&amp;query=%D0%BA%D1%80%D0%B5%D1%81%D1%82&amp;sort=112&amp;index=2288">हर्मिताज़, रूस</a>।</p><img src="https://res.bibleox.com/s/img/image/simple/68c11e3c6594f46d35a87e2c/s_p_9GZmzTSaUVuXXaX1.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c11e3c6594f46d35a87e2c/m_p_9GZmzTSaUVuXXaX1.jpg">बड़ा करें</a>]</p><h3>लॉकेट। मसीह का क्रूसारोहण (मिस्र)</h3><p>500-700 ई. माप: 3,3 x 1,9 सेमी। <a href="https://collections.louvre.fr/en/ark:/53355/cl010102800">लूव्र, फ़्रांस</a>।</p><img src="https://res.bibleox.com/s/img/image/simple/68c41c4e6594f46d35a87f03/s_p_tiaBwT9vqOXIlsIw.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c41c4e6594f46d35a87f03/m_p_tiaBwT9vqOXIlsIw.jpg">बड़ा करें</a>]</p><h3>दो संतों का आइकॉन (बीज़ान्टियम)</h3><p>छठी शताब्दी; 25.5 x 22 x 1.3 सेमी। सम्भवतः यह सुसमाचारकार मत्ती और यूहन्ना की प्रतिमा है। <a href="https://www.metmuseum.org/art/collection/search/468198">मेट्रोपॉलिटन संग्रहालय, 5वें एवेन्यू पर, अमेरिका</a>।</p><img src="https://res.bibleox.com/s/img/image/simple/68b5fc1545c75323d28a5ec3/s_p_a2FJmSgsGJRdELBq.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5fc1545c75323d28a5ec3/m_p_a2FJmSgsGJRdELBq.jpg">बड़ा करें</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5fc1945c75323d28a5ec4/m_p_pcvRiRfRgBcuHJEA.jpg">संस्करण 2</a>]</p><h3>प्रेरित पतरस और पौलुस के आइकॉन (अन्तियोख़िया)</h3><p>550-600 ई. प्रेरित पतरस। <a href="https://www.metmuseum.org/art/collection/search/468348">मेट्रोपॉलिटन संग्रहालय, 5वें एवेन्यू पर, अमेरिका</a>। चाँदी। 38.1 x 55.9 x 2.2 सेमी।</p><img src="https://res.bibleox.com/s/img/image/simple/68c1bfd36594f46d35a87e6f/s_p_WguE3h0pnnzXQXwt.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1bfd36594f46d35a87e6f/m_p_WguE3h0pnnzXQXwt.jpg">बड़ा करें</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c1bfd56594f46d35a87e70/m_p_83EvKNt1mFSPspQw.jpg">और बड़ा</a>]</p><p>550-600 ई. प्रेरित पौलुस। <a href="https://www.metmuseum.org/art/collection/search/468347">मेट्रोपॉलिटन संग्रहालय, 5वें एवेन्यू पर, अमेरिका</a>। चाँदी। 38.1 x 55.9 x 2.2 सेमी।</p><img src="https://res.bibleox.com/s/img/image/simple/68c1bfda6594f46d35a87e71/s_p_5Y11faCyEzohnydQ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1bfda6594f46d35a87e71/m_p_5Y11faCyEzohnydQ.jpg">बड़ा करें</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c1bfdd6594f46d35a87e72/m_p_jGCYAnYdrt4tlXhd.jpg">और बड़ा</a>]</p><h3>आइकॉन (सीरिया?, बीज़ान्टियम)</h3><p>500 का दशक। <a href="https://www.clevelandart.org/art/1941.57">क्लीवलैंड कला संग्रहालय, अमेरिका</a>।</p><img src="https://res.bibleox.com/s/img/image/simple/68caa8cd205184ec278d5883/s_p_qr7HPRgCtcCRwsvb.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68caa8cd205184ec278d5883/m_p_qr7HPRgCtcCRwsvb.jpg">बड़ा करें</a>]</p><h3>संत योद्धा की प्रतिमा (कॉप्टिक मिस्र)</h3><p>छठी-सातवीं शताब्दी। <a href="https://collections.hermitagemuseum.org/entity/OBJECT/180444?page=6&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=253">हर्मिताज़, रूस</a>।</p><img src="https://res.bibleox.com/s/img/image/simple/6863c3c06480b4d28532041c/s_p_Rnquar8nZacdzqcP.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c3c06480b4d28532041c/m_p_Rnquar8nZacdzqcP.jpg">बड़ा करें</a>]</p><h3>प्रेरित पौलुस (?) और संत फ़ेक्ला के आइकॉन वाला अम्पुला (मिस्र)</h3><p>500-700 ई. <a href="https://collections.louvre.fr/en/ark:/53355/cl010280955">लूव्र, फ़्रांस</a>।</p><img src="https://res.bibleox.com/s/img/image/simple/68c4390d6594f46d35a87f15/s_p_Zxs1yv3Jg8oKfFHW.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c4390d6594f46d35a87f15/m_p_Zxs1yv3Jg8oKfFHW.jpg">बड़ा करें</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/68c4390a6594f46d35a87f14/s_p_CPdXMrLBUE0satoH.jp