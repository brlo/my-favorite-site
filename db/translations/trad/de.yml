  body: '<h2>Die Katakomben des heiligen Januarius (Catacombe di San Gennaro) [1]</h2><h3>Der heilige Januarius von Benevent, von Puteoli (Neapel), Bischof, Hieromärtyrer</h3><p>Die Katakomben von San Gennaro (des heiligen Januarius), Neapel. Fresko aus dem 4. Jahrhundert. Es ist nicht ganz klar, wer hier dargestellt ist. Oben steht: SANCTOMARTYRIIANVARIO (dem heiligen Märtyrer Januarius). Dabei ist aus irgendeinem Grund ein junger Mann dargestellt. Unklar ist auch, warum der Nimbus so aussieht.</p><p>Eine Seite über diesen Heiligen in der Orthodoxen Kirche (auf Russisch): <a href="https://days.pravoslavie.ru/name/890.html">https://days.pravoslavie.ru/name/890.html</a></p><p>Die Wikipedia-Seite über dieses Fresko. Auf Polnisch, aber mit nützlichen Informationen: <a href="https://pl.wikipedia.org/wiki/January_z_Benewentu">https://pl.wikipedia.org/wiki/January_z_Benewentu</a></p><img src="https://res.bibleox.com/s/img/image/simple/686e6aa95f47da2505d3ae6e/s_p_RCtXSS4uiuO9E0Qf.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686e6aa95f47da2505d3ae6e/m_p_RCtXSS4uiuO9E0Qf.jpg">größer</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686e56775f47da2505d3ae67/m_p_XhI4Ni1rKZ949Zi1.jpg">Version 2</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686e54755f47da2505d3ae66/s_p_zKsSelu839AuImaV.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686e54755f47da2505d3ae66/m_p_zKsSelu839AuImaV.jpg">größer</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686e57135f47da2505d3ae68/m_p_faNUwXKGPaVtmUwW.jpg">Version 2</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686e6aec5f47da2505d3ae70/s_p_2fvyFxXewVLu06NV.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686e6aec5f47da2505d3ae70/m_p_2fvyFxXewVLu06NV.jpg">größer</a>]</p><h3>Die Christin Cerula</h3><p>Inschrift unten: „CERVLA IN PACE“ (Cerula im Frieden), 5.–6. Jahrhundert. [3]</p><img src="https://res.bibleox.com/s/img/image/simple/686e4d5c5f47da2505d3ae63/s_p_1dqPUS5wghY1DrdP.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686e4d5c5f47da2505d3ae63/m_p_1dqPUS5wghY1DrdP.jpg">größer</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686e58705f47da2505d3ae6a/m_p_r6sua9UNLBhgIZ06.jpg">Version 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686e58625f47da2505d3ae69/m_p_6KViYk7KWJDrIa8l.jpg">Version 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686e6ad15f47da2505d3ae6f/m_p_q9ocVtWoayH4BxtB.jpg">Version 4</a>]</p><h3>Die Familie des Theotecnus</h3><blockquote><p>Das Arkosol der Familie des Theotecnus. Untersuchungen haben gezeigt, dass zuerst das Mädchen starb. In der Nische wurde ein Fresko mit ihrem Bildnis gemalt. Dann starb der Mann. Über das erste Fresko wurde ein neues gemalt, nun mit dem Vater. Zuletzt starb die Frau, und in der Nische erschien ein Gruppenbildnis der Familie.</p></blockquote><img src="https://res.bibleox.com/s/img/image/simple/686e6be45f47da2505d3ae71/s_p_xNoWgh6wacZ3al1R.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686e6be45f47da2505d3ae71/m_p_xNoWgh6wacZ3al1R.jpg">größer</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686e592c5f47da2505d3ae6b/s_p_A6SYWxzdgc1EPwun.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686e592c5f47da2505d3ae6b/m_p_A6SYWxzdgc1EPwun.jpg">größer</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686fe8695f47da2505d3ae88/m_p_nzuUOKu6sAmxO4pO.jpg">Version 2</a>]</p><h2>Die Katakombe an der Via Anapo[2]</h2><h3>Eine betende Frau (Orans)</h3><p>Fresko einer betenden Frau (Orans) in der anonymen Katakombe an der Via Anapo (Anonima di Via Anapo), Rom</p><img src="https://res.bibleox.com/s/img/image/simple/686e53655f47da2505d3ae65/s_p_qTxn07MuPIePNzPn.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686e53655f47da2505d3ae65/m_p_qTxn07MuPIePNzPn.jpg">größer</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686e535e5f47da2505d3ae64/m_p_U8Zh4RJjehyZtXep.jpg">Version 2</a>]</p>'
