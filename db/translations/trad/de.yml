  path: Ch2c_Alte_christliche_Kirchen
  title: Alte christliche Kirchen
  title_sub:
  body: '<h2>Motto</h2><blockquote><p>„Und etliche der Pharisäer unter dem Volk sprachen zu ihm: Meister, weise deine Jünger zurecht! Und er antwortete und sprach: Ich sage euch, <strong>wenn diese schweigen, so werden die Steine schreien!</strong>“ (<a href="https://bibleox.com/de/ge-sch/lk/19/#L39-40">Lk 19:39-40</a>)</p></blockquote><h2>3. Jahrhundert</h2><h3>Eine Kirche bei der antiken Stadt Megiddo, in der Siedlung <a href="https://he.wikipedia.org/wiki/%D7%9C%D7%92%D7%99%D7%95">Legio</a> (um 230)</h3><p>In alten christlichen Kirchen stand der Altar oft in der Mitte. Diese Kirche ist ein anschauliches Beispiel.</p><p>Nicht weit von der Stadt Megiddo (in der Antike gab es dort die Siedlung <a href="https://he.wikipedia.org/wiki/%D7%9C%D7%92%D7%99%D7%95">Legio</a>, weil dort eine römische Legion stationiert war). Auf einer Anhöhe der Siedlung stand ein Gebäude, das nach Münzen, Keramik und Schrift auf das Jahr 230 datiert wurde. Einer seiner Räume war eine christliche Kirche. Auf dem Boden befinden sich mehrere große Mosaike mit Inschriften (eine davon nennt Christus Gott), und in der Mitte steht der Altar. Daneben ist eine Inschrift darüber, wer diesen Tisch gestiftet hat.</p><img src="https://res.bibleox.com/s/img/image/simple/692c58f9205184ec278d6f97/s_p_aZ3NifF9BW3oqZ1a.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c58f9205184ec278d6f97/m_p_aZ3NifF9BW3oqZ1a.jpg">größer</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/692c587d205184ec278d6f91/s_p_MvOQRFKiCv6XaXOd.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c587d205184ec278d6f91/m_p_MvOQRFKiCv6XaXOd.jpg">größer</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/692c58ee205184ec278d6f96/s_p_5wNRtqyrpQivbBim.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c58ee205184ec278d6f96/m_p_5wNRtqyrpQivbBim.jpg">größer</a>] [<a href="https://res.bibleox.com/s/img/image/simple/692c58e0205184ec278d6f95/m_p_FQvEfj70dP7967X3.jpg">weiteres Foto 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/692c58ce205184ec278d6f94/m_p_9xoiCsqROihBYnL0.jpg">weiteres Foto 3</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/692c58b5205184ec278d6f93/s_p_Cvww0C8ZGmbqJS7a.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c58b5205184ec278d6f93/m_p_Cvww0C8ZGmbqJS7a.jpg">größer</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/692c5882205184ec278d6f92/s_p_WU59e3c2XbPWkdaM.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c5882205184ec278d6f92/m_p_WU59e3c2XbPWkdaM.jpg">größer</a>]</p><p><strong>Inschriften:</strong></p><p>Alle Inschriften auf dem Kirchenboden sind eine Art <strong>Gedenklisten</strong>. Von ältester Zeit bis heute besteht in den Kirchen der Orthodoxen Kirche die Tradition, im Gottesdienst immer auch der Namen derer zu gedenken, die die Kirche erbaut oder etwas Wichtiges gestiftet haben. So sind auch hier, mit der Bitte um Gedenken, die Namen derer festgehalten, die den Mosaikboden gestiftet (der Zenturio Gaianos Porphyrios), ihn verlegt (Brutios) und den Altar gestiftet haben (Akeptous), sowie einige andere Namen, vielleicht Verwandte der Stifter: Primilla, Kyriaka, Dorothea, Chreste. Auf dieselbe Weise wurden zum Gedenken an Lebende und Verstorbene auch Kirchengeräte gestiftet: eucharistische Kelche und Weihrauchfässer (<a href="https://bibleox.com/ru/ru/w/%D0%B4%D1%80%D0%B5%D0%B2%D0%BD%D0%B8%D0%B5-%D0%B8%D0%BA%D0%BE%D0%BD%D1%8B#HH-%D0%95%D0%B2%D1%85%D0%B0%D1%80%D0%B8%D1%81%D1%82%D0%B8%D1%87%D0%B5%D1%81%D0%BA%D0%B8%D0%B5-%D1%87%D0%B0%D1%88%D0%B8-%D0%B8-%D0%BA%D0%B0%D0%B4%D0%B8%D0%BB%D0%B0-%D1%81-%D0%B8%D0%BA%D0%BE%D0%BD%D0%B0%D0%BC%D0%B8-%D0%92%D0%B8%D0%B7%D0%B0%D0%BD%D1%82%D0%B8%D1%8F-%D0%A1%D0%B8%D1%80%D0%B8%D1%8F-%D0%90%D1%82%D1%82%D0%B0%D1%80%D1%83%D1%82%D0%B8">mehr dazu</a>).</p><blockquote><p>Übersetzung: Akeptous, die Gottliebende, hat diesen Tisch Gott Jesus Christus zum Gedächtnis dargebracht.</p></blockquote><blockquote><p>EN: Akeptous, the God-loving, offered the table to God Jesus Christ as a memorial.</p></blockquote><blockquote><p>Transcription: <strong>Prosēniken Akeptous, ē philotheos, tēn trapezan Th(e)ō Ι(ēso)u Ch(rist)ō mnēmosunon.</strong></p></blockquote><blockquote><p>Orig: <strong>ΠΡΟСΗΝΙΚΕΝ ΑΚΕΠΤΟΥС, Η ΦΙΛΟΘΕΟС, ΤΗΝ ΤΡΑΠΕΖΑΝ Θ(Ε)Ω Ι(ΗСΟ)Υ Χ(ΡΙСΤ)Ω ΜΝΗΜΟСΥΝΟΝ</strong></p></blockquote><blockquote><p>ΠΡΟϹΗΝΙΚΕΝ</p><p>ΑΚΕΠΤΟΥϹ,</p><p>Η ΦΙΛΟΘΕΟϹ,</p><p>ΤΗΝ ΤΡΑΠΕ-</p><p>ZΑΝ <strong>{ΘW} {ΙΥ} {ΧW}*</strong></p><p>ΜΝΗΜΟϹΥΝΟΝ</p></blockquote><p>*Nomina sacra: <strong>ΘW ΙΥ ΧW</strong> = θεῷ Ἰησοῦ Χριστῷ = Gott Jesus Christus</p><img src="https://res.bibleox.com/s/img/image/simple/692c5df3205184ec278d6f9a/s_p_swifwBDbtzgImkZ6.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c5df3205184ec278d6f9a/m_p_swifwBDbtzgImkZ6.jpg">größer</a>]</p><hr><blockquote><p>ΕΝ: Remember Primilla and Cyriaca and Dorothea, and moreover also Chreste.</p></blockquote><blockquote><p>Übersetzung: Gedenkt der Primilla und der Kyriaka und der Dorothea, und auch der Chreste.</p></blockquote><blockquote><p>Orig: <strong>ΜΝΗΜΟΝΕΥСΑΤΕ ΠΡΙΜΙΛΛΗС ΚΑΙ ΚΥΡΙΑΚΗС ΚΑΙ ΔWΡΟΘΕΑС ΕΤΙ ΔΕ ΚΑΙ ΧΡΗСΤΗ</strong></p></blockquote><blockquote><p>Fixed: <strong>ΜΝΗΜΟΝΕΥСΑΤΕ ΠΡΙΜΙΛΛΗС ΚΑΙ ΚΥΡΙΑΚΗΣ ΚΑΙ ΔΩΡΟΘΕΑΣ ΕΤΙ ΔΕ ΚΑΙ ΧΡΗΣΤΗ</strong></p></blockquote><img src="https://res.bibleox.com/s/img/image/simple/692c5dec205184ec278d6f99/s_p_LVbgKrKO7P3dfEJP.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c5dec205184ec278d6f99/m_p_LVbgKrKO7P3dfEJP.jpg">größer</a>]</p><hr><blockquote><p>Übersetzung: Gaianos, auch Porphyrios genannt, Zenturio, unser Bruder, hat aus eigenen Mitteln mit großer Freigebigkeit diesen Boden gelegt. Brutios hat die Arbeit ausgeführt.</p></blockquote><blockquote><p>EN: Gaianus, also called Porphyrius, centurion (xp), our brother, has made the pavement at his own expense as an act of liberality. Brutius has carried out the work.</p></blockquote><blockquote><p>Orig: <strong>ΓΑΙΑΝΟС Ο ΚΑ ΠΟΡΦΥΡΙС ΧΡ* ΑΔΕΛΦΟС ΗΜWΝ ΕΚ ΦΙΛΟΤΕ ΙΜΙС ΑΜΕΝ ΟСΕΚΤW ΝΙΔΙWΝ ΕΨΙ ΦΟΛΟΓΗСΕΝ. ΒΡΟVΤΙС ΗΡΓΑСΑΤΟ.</strong></p></blockquote><blockquote><p>Fixed: <strong>ΓΑΙΑΝΟΣ Ο ΚΑ ΠΟΡΦΥΡΙΣ ΧΡ* ΑΔΕΛΦΟΣ ΗΜΩΝ ΕΚ ΦΙΛΟΤΕ ΙΜΙΣ ΑΜΕΝ ΟΣΕΚΤΩ ΝΙΔΙΩΝ ΕΨΙ ΦΟΛΟΓΗΣΕΝ. ΒΡΟΥΤΙΣ ΗΡΓΑΣΑΤΟ.</strong></p></blockquote><p><strong>*ΧΡ — hekatontarches — centurio</strong></p><img src="https://res.bibleox.com/s/img/image/simple/692c5e27205184ec278d6f9b/s_p_Qk321JfFTD4dDmnd.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c5e27205184ec278d6f9b/m_p_Qk321JfFTD4dDmnd.jpg">größer</a>]</p><h3>Die Kirche in Dura-Europos (Syrien)</h3><p>244: die christliche Kirche in Dura-Europos</p><img src="https://res.bibleox.com/s/img/image/simple/6931880c205184ec278d6fa6/s_p_DFnp7s0vcTbXb3Qn.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931880c205184ec278d6fa6/m_p_DFnp7s0vcTbXb3Qn.jpg">größer</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/69318806205184ec278d6fa5/s_p_PuUKcoZEfAVSlPNM.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69318806205184ec278d6fa5/m_p_PuUKcoZEfAVSlPNM.jpg">größer</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/69318802205184ec278d6fa4/s_p_MF4zgk1ySUOBpqnG.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69318802205184ec278d6fa4/m_p_MF4zgk1ySUOBpqnG.jpg">größer</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/414/s_p_UgKueSl1yxG0SfbA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/414/m_p_UgKueSl1yxG0SfbA.jpg">größer</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/69330ed8205184ec278d6fc0/s_p_kXy4nTuYVCOxuDib.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69330ed8205184ec278d6fc0/m_p_kXy4nTuYVCOxuDib.jpg">größer</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/693187fd205184ec278d6fa3/s_p_R3poESL99kNRMpXi.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/693187fd205184ec278d6fa3/m_p_R3poESL99kNRMpXi.jpg">größer</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/69330e9e205184ec278d6fbf/s_p_ThLs4WrxsJ3ykxKU.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69330e9e205184ec278d6fbf/m_p_ThLs4WrxsJ3ykxKU.jpg">größer</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/69330e76205184ec278d6fbe/s_p_NykNwaI9TEwz1Ccf.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69330e76205184ec278d6fbe/m_p_NykNwaI9TEwz1Ccf.jpg">größer</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/69330e70205184ec278d6fbd/s_p_Rd3jEzEeesXUCTmh.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69330e70205184ec278d6fbd/m_p_Rd3jEzEeesXUCTmh.jpg">größer</a>]</p><p>Die Kirche hat Wandfresken mit Szenen aus dem Neuen Testament: die Rettung des sinkenden Apostels Petrus und die Heilung des Gelähmten am Schafteich (aus der Reihe der Wunder Christi sind nur diese beiden Fresken erhalten) sowie der Gute Hirte.</p><p><strong>Die Rettung des sinkenden Apostels Petrus</strong></p><img src="https://res.bibleox.com/s/img/image/simple/692c8038205184ec278d6f9e/s_p_QQ2Rml8gUWsyQtS9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c8038205184ec278d6f9e/m_p_QQ2Rml8gUWsyQtS9.jpg">größer</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6786b88ddba77200015ae11c/m_p_do380IVDukCAfdFk.jpg">Version 2</a>]</p><p><strong>Die Heilung des Gelähmten am Schafteich</strong></p><img src="https://res.bibleox.com/s/img/image/simple/6786b889dba77200015ae11b/s_p_k1a5GDBvfzTCWmZv.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6786b889dba77200015ae11b/m_p_k1a5GDBvfzTCWmZv.jpg">größer</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6786bb0bdba77200015ae11d/m_p_dCRD85foL69l7kih.jpg">andere Version</a>]</p><p><strong>Bild neben dem Taufbecken (Raum Nr. 6): der Gute Hirte bringt das verlorene Schaf zur Herde zurück</strong></p><img src="https://res.bibleox.com/s/img/image/simple/6931870c205184ec278d6fa2/s_p_uBkNi8jGsMFpOQSM.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931870c205184ec278d6fa2/m_p_uBkNi8jGsMFpOQSM.jpg">größer</a>]</p><h3>Eusebius von Caesarea (Pamphili), Bischof, Kirchenhistoriker (um 258–339)</h3><p>Er schreibt über den Bau christlicher Kirchen in allen Städten in der Zeit vor der Herrschaft des römischen Kaisers Diokletian (regierte 284–305). Im Jahr 303 erließ Diokletian ein Edikt, die christlichen Kirchen zu zerstören. Eusebius war damals etwa 45 Jahre alt; er muss also den Bau dieser Kirchen wie auch ihre Zerstörung miterlebt haben:</p><blockquote><p>5. Mit welchem Wohlwollen begegneten die Prokuratoren und Statthalter den Vorstehern der Kirchen! Wie soll man diese <strong>Versammlungen von vielen Tausenden in jeder Stadt</strong> beschreiben, diese erstaunlichen Scharen, <strong>die in die Gebetshäuser strömten! Die alten Gebäude reichten nicht aus; <mark>in allen Städten errichtete man von Grund auf neue, weiträumige Kirchen</mark> (εὐρείας εἰς πλάτος ἀνὰ πάσας τὰς πόλεις ἐκ θεμελίων ἀνίστων <mark>ἐκκλησίας</mark>).</strong></p><p>&lt;…&gt;</p><p>4. Es war das neunzehnte Jahr der Regierung Diokletians, im Monat Dystros (bei den Römern März), als das Fest des Leidens des Herrn nahte, da wurden überall <strong><mark>kaiserliche Erlasse angeschlagen, die befahlen, die Kirchen bis auf den Grund niederzureißen</mark> (βασιλικὰ γράμματα, τὰς μὲν <mark>ἐκκλησίας</mark> εἰς ἔδαφος φέρειν)</strong>, die Schriften zu verbrennen und alle, die am Christentum festhielten, ihrer Ehrenstellungen zu berauben;</p></blockquote><p>(<a href="https://bibleox.com/de/grc/w/%CE%95%CE%9A%CE%9A%CE%9B%CE%97%CE%A3%CE%99%CE%91%CE%A3%CE%A4%CE%99%CE%9A%CE%97%CE%A3_%CE%99%CE%A3%CE%A4%CE%9F%CE%A1%CE%99%CE%91%CE%A3-8/#:~:text=%E1%BC%80%CE%BD%E1%BD%B0%20%CF%80%E1%BD%B1%CF%83%CE%B1%CF%82%20%CF%84%E1%BD%B0%CF%82%20%CF%80%E1%BD%B9%CE%BB%CE%B5%CE%B9%CF%82%20%E1%BC%90%CE%BA%20%CE%B8%CE%B5%CE%BC%CE%B5%CE%BB%E1%BD%B7%CF%89%CE%BD%20%E1%BC%80%CE%BD%E1%BD%B7%CF%83%CF%84%CF%89%CE%BD%20%E1%BC%90%CE%BA%CE%BA%CE%BB%CE%B7%CF%83%E1%BD%B7%CE%B1%CF%82">Kirchengeschichte, Buch 8, 1.5 und 2.4</a>; aus dem Griechischen übersetzt)</p><h2>Umstrittene Funde</h2><h3><strong>Ein Haus in Herculaneum (</strong>1. Jahrhundert<strong>)</strong></h3><img src="https://res.bibleox.com/s/img/image/simple/67e428d39a4a346bba31e8ba/s_p_F0lTpC2rqw7PVyf1.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/67e428d39a4a346bba31e8ba/m_p_F0lTpC2rqw7PVyf1.jpg">größer</a>] [<a href="https://res.bibleox.com/s/img/image/simple/69330b68205184ec278d6fb8/m_p_oEOCtcPUBThtuirO.jpg">Version 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/69330cb6205184ec278d6fb9/m_p_zMmSTHDi5RoizXsX.jpg">Version 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/69330cbb205184ec278d6fba/m_p_Jv9gdiBWmrMB5tc4.jpg">Version 4</a>] [<a href="https://res.bibleox.com/s/img/image/simple/67e428d79a4a346bba31e8bb/m_p_1sEN1KSZxei96K4S.jpg">Version 5</a>] [<a href="https://res.bibleox.com/s/img/image/simple/67e428db9a4a346bba31e8bc/m_p_TgMWk123osBJ9une.jpg">Version 6</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/69330cc3205184ec278d6fbc/s_p_YLRMNDvDg7nCTh3X.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69330cc3205184ec278d6fbc/m_p_YLRMNDvDg7nCTh3X.jpg">größer</a>]</p><p>Im Jahr 79 brach der Vesuv aus und begrub Städte wie Pompeji, Stabiae und Herculaneum unter seiner Asche. In Herculaneum wurde ein <a href="https://ru.wikipedia.org/wiki/%D0%93%D0%B5%D1%80%D0%BA%D1%83%D0%BB%D0%B0%D0%BD%D1%83%D0%BC#%D0%94%D0%BE%D0%BC_%D0%B4%D0%B2%D1%83%D1%85%D1%81%D0%BE%D1%82%D0%BB%D0%B5%D1%82%D0%B8%D1%8F">Haus</a> (auf Russisch) gefunden (nach dem Jubiläum der Ausgrabungen „Haus des Zweihundertjahrjubiläums“ genannt); im Obergeschoss befindet sich in einem Raum eine <a href="https://ermakvagus.com/Europe/Italy/Pompeii/christianity_pompeii_rus.html">kreuzförmige Vertiefung</a> (auf Russisch) in der Wand, genau in der Mitte über einem Holzschrank. Manche vermuten, dass dort ein hölzernes Kreuz zum Gebet hing und der Raum für christliche Gottesdienste oder das Gebet zu Hause genutzt wurde. Es gibt jedoch ernste Argumente dagegen. In derselben Stadt wurde ein Wandbrett gefunden, das einen ähnlichen Abdruck an der Wand hinterlassen haben könnte.</p><img src="https://res.bibleox.com/s/img/image/simple/6932ff2b205184ec278d6fb6/s_p_cXmpauqq2EYuH6ww.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6932ff2b205184ec278d6fb6/m_p_cXmpauqq2EYuH6ww.jpg">größer</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6932ff36205184ec278d6fb7/s_p_KIfO7M0rbhGbWoIk.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6932ff36205184ec278d6fb7/m_p_KIfO7M0rbhGbWoIk.jpg">größer</a>] [<a href="https://res.bibleox.com/s/img/image/simple/69330cbf205184ec278d6fbb/m_p_WL1FQysNlwZc0yT9.jpg">Version 2</a>]</p><p>Das Wandbrett ist nicht ganz gleich: Es ragt nach links und rechts ziemlich weit und nach unten weniger weit heraus. Außerdem gab es im Haus des Zweihundertjahrjubiläums an dieser Stelle der Wand vermutlich zwei schließbare Türflügel. Dennoch ist es gut möglich, dass dort tatsächlich ein gewöhnliches Wandbrett und kein Kreuz war. Wie weit man dieser oder jener Schlussfolgerung traut, muss der Leser selbst entscheiden. Hier ist nur zusammengetragen, was über diesen Fund bekannt ist.</p>'
