  path: Lc4k_Fastenküche
  title: Fastenküche
  title_sub:
  body: '<p>Dieser Artikel skizziert nur kurz, wie Fastenspeisen aussehen. Er soll jemandem Orientierung geben, der bisher nicht gefastet hat, nicht gewohnt ist, Fastenspeisen zu kochen, und nicht weiß, was man in der Fastenzeit zubereiten könnte.</p><blockquote><p>„Der Herr aber antwortete und sprach zu ihr: Martha, Martha, du machst dir Sorge und Unruhe um vieles; eins aber ist not. Maria hat das gute Teil erwählt; das soll nicht von ihr genommen werden!“ (<a href="https://bibleox.com/de/ge-sch/lk/10/#L41-42">Lk 10:41-42</a>)</p></blockquote><blockquote><p>„Habt aber acht auf euch selbst, daß eure Herzen nicht beschwert werden durch Rausch und Trunkenheit und Nahrungssorgen und jener Tag unversehens über euch komme!“ (<a href="https://bibleox.com/de/ge-sch/lk/21/#L34">Lk 21:34</a>)</p></blockquote><h2>Suppen</h2><h3>Suppen auf Gemüsebrühe (mit angebratenen Zwiebeln und Karotten)</h3><p>Kartoffeln passen fast überall dazu:</p><ul><li><p><strong>Getreidesuppen</strong> (Buchweizen, Reis, Graupen, Linsen, Erbsen),</p></li><li><p><strong>Nudelsuppen</strong>,</p></li><li><p><strong>Gemüsesuppen</strong>,</p></li><li><p><strong>Borschtsch</strong> (Rote-Bete-Suppe),</p></li><li><p><strong>Rassolnik</strong> (Suppe mit Salzgurken),</p></li><li><p><strong>Schtschi</strong> (Kohlsuppe),</p></li><li><p><strong>Ucha</strong> (Fischsuppe, wenn die Fastenregel Fisch erlaubt).</p></li></ul><h2>Beilagen</h2><ul><li><p><strong>Haferbrei</strong> (aus Flocken),</p></li><li><p><strong>gekochter</strong> Reis, Buchweizen, Linsen, Couscous, Bulgur, Quinoa, Polenta (Maisgrießbrei) und anderes Getreide. Angebratene Zwiebeln und Karotten passen gut dazu.</p></li><li><p><strong>Pilaw</strong> (für mehr Sättigung kann man Kichererbsen hinzufügen),</p></li><li><p><strong>Mischungen mit gekochtem Reis</strong>: hawaiianisch, mexikanisch usw.</p></li><li><p><strong>Nudeln</strong>: gekocht, vorher angebraten, mit Pilzen, mit Fischkonserven (Thunfisch, Sardinen usw., wenn die Fastenregel es erlaubt)</p></li><li><p><strong>Kartoffeln</strong>: gebraten, gebacken, gekocht, als Püree,</p></li><li><p><strong>geschmorter Kohl</strong>,</p></li><li><p><strong>Gemüseeintopf</strong>: Kartoffeln, Karotten, Zwiebeln, Zucchini, Paprika, Pilze, Tomatenmark oder Tomaten, Auberginen,</p></li><li><p><strong>gekochtes Gemüse</strong> (Blumenkohl, Brokkoli, grüne Erbsen, Mais),</p></li><li><p><strong>Wareniki</strong> (Teigtaschen): mit Kartoffeln, Pilzen, Kirschen,</p></li><li><p><strong>Tofu</strong>,</p></li><li><p><strong>Kichererbsen mit Gemüse</strong>,</p></li><li><p><strong>Pilze</strong>, gebraten,</p></li><li><p><strong>Zucchini</strong>, gebraten,</p></li><li><p><strong>Draniki</strong> (Puffer aus geriebenen Kartoffeln oder Zucchini, Reis- oder Weizenmehl, Salz),</p></li><li><p><strong>Ratatouille</strong>,</p></li><li><p><strong>gebackener Kürbis</strong>,</p></li><li><p><strong>gegrilltes Gemüse</strong>,</p></li><li><p><strong>Gemüsebratlinge</strong> (aus Bohnen).</p></li></ul><h2>Salate</h2><ul><li><p><strong>aus frischem Gemüse</strong>: Gurke, Tomate, junger Kohl, rote Zwiebel, Blattsalat, Paprika, Kräuter, Gewürze,</p></li><li><p><strong>aus gekochtem Gemüse</strong>: Winegret (Kartoffeln, Rote Bete, Karotten, Bohnen, Erbsen aus der Dose, Salzgurken, Zwiebeln, Sauerkraut),</p></li><li><p><strong>Chinakohlsalat</strong>: Chinakohl, Mais, Fastenmayonnaise[1],</p></li><li><p><strong>gekochte Rote Bete</strong> mit Fastenmayonnaise[1],</p></li><li><p><strong>Obstsalat</strong>,</p></li><li><p><strong>Avocadosalat</strong>,</p></li></ul><h2>Eingelegtes</h2><ul><li><p><strong>Sauerkraut</strong>,</p></li><li><p><strong>Gurken</strong>: Salzgurken, leicht gesalzen, gestoßen,</p></li><li><p><strong>Karotten</strong> auf koreanische Art,</p></li><li><p><strong>Zwiebeln</strong> in Essig eingelegt,</p></li><li><p>und anderes.</p></li></ul><h2>Backwaren</h2><ul><li><p><strong>Brot</strong>,</p></li><li><p><strong>Fastenbrötchen</strong>: im Ofen oder in der Pfanne gebacken oder im Laden gekauft,</p></li><li><p><strong>gefüllte Piroggen</strong>: mit Kirschen, geschmortem Kohl, Kartoffeln und Zwiebeln,</p></li><li><p><strong>Fastenpfannkuchen</strong> (Wasser statt Milch, Bananen statt Eier),</p></li></ul><h2>Eingemachtes</h2><ul><li><p><strong>Zucchini</strong><strong>kaviar</strong> (Gemüseaufstrich),</p></li><li><p><strong>Auberginen</strong><strong>kaviar</strong> (Gemüseaufstrich),</p></li><li><p><strong>Hummus</strong>,</p></li><li><p><strong>Mais</strong>,</p></li><li><p><strong>Pilze</strong>,</p></li><li><p><strong>Bohnen</strong>,</p></li><li><p><strong>grüne Erbsen</strong>,</p></li><li><p><strong>getrocknete Tomaten</strong>,</p></li><li><p><strong>Guacamole</strong> ohne Käse,</p></li></ul><h2>Trockenobst und Nüsse</h2><ul><li><p><strong>Nüsse</strong>,</p></li><li><p><strong>Beeren und Obst</strong>, getrocknet oder gefriergetrocknet,</p></li><li><p><strong>Halva</strong>,</p></li></ul><h2>Belegte Brote und Snacks</h2><ul><li><p>Brot mit Honig,</p></li><li><p>Brot mit Tomate, Basilikum und Salz.</p></li></ul><h2>Getränke</h2><ul><li><p>Kwas (gegorenes Brotgetränk)</p></li><li><p>Kissel (mit Stärke angedicktes Fruchtgetränk)</p></li><li><p>Kompott (aus frischen Beeren oder Trockenobst)</p></li><li><p>Mors (Beerensaftgetränk)</p></li><li><p>Smoothies</p></li><li><p>Limonade</p></li><li><p>Tee</p></li><li><p>Kaffee ohne Milch</p></li><li><p>Wasser</p></li></ul>'
  references: "<ol><li><p><strong>Fastenmayonnaise</strong>: Flüssigkeit aus einer Dose Erbsen, Pflanzenöl, Senf, Salz, Zucker, Essig. Mit dem Mixer aufschlagen.</p></li></ol><p>Aus dem Russischen übersetzt von Rodion Wlassow, unter Verwendung von KI. Bibelzitate: Schlachter.</p>"
