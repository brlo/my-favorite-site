  body: '<h2>Inschriften an den Gräbern der Christen der ersten Jahrhunderte</h2><p>Inschriften in der Triclia der sogenannten „Memoria Apostolorum“ an der Via Appia, einem Heiligtum, das Mitte des 3. Jahrhunderts, zwischen 238 und 260, angelegt wurde. Damals, im 3. Jahrhundert, begannen in der Triclia christliche Gebetsinschriften zu erscheinen wie „<em>Paule ed Petre petite pro Victore</em>“ und ähnliche (siehe unten). Man brachte sie bis in die Zeit Konstantins des Großen an. [1]</p><img src="https://res.bibleox.com/s/img/image/simple/483/s_p_1D8zprHe86ZZn5O9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/483/m_p_1D8zprHe86ZZn5O9.jpg">größer</a>]</p><h3><strong>Gedenkt in euren Gedanken, in euren Gebeten </strong>(in mente habete, in orationibus vestris):</h3><p>12912: [Petre et] Paul[e] | in m[ente] abete in | ora[tion]ibus vestris/ — <strong>„Petrus und Paulus, gedenkt in euren Gedanken, in euren Gebeten …“</strong></p><h3><strong>Bittet für </strong>(petite) (oder „betet“, „erbittet“)</h3><p>12918: [Paul]e et Petre petite | [pro] nobis omnibus/ — <strong>„Paulus und Petrus, bittet für uns alle!“</strong></p><p>12931: Petr[e] et Pau[l]e petite | pro [Le]ontium / — <strong>„Petrus und Paulus, bittet für Leontius!“</strong></p><p>12933: Pa[ul]e et Pet|re apetite pro Da|tivu in perpetu`u´m/ — <strong>„Paulus und Petrus, bittet für Dativus auf ewig!“</strong></p><p>12989: Paule ed Petre petite | pro Victore/ — <strong>„Paulus und Petrus, bittet für Victor!“</strong></p><p>12946: [Petre et Pa]ulae spir[ita sancta vestra petant pro - - -]/ — <strong>„Petrus und Paulus, eure heiligen Geister mögen bitten für [- - -]!“</strong></p><h3><strong>conservate</strong> — <strong>beschützt</strong> (oder „bewahrt“)</h3><p>12991: Petre et Paule cons[ervate - - -]/ — <strong>„Petrus und Paulus, beschützt [- - -]!“</strong></p><p>12996: sa[lva Paule et] | Petr[e - - - et] | Mart[yrium et] | conse[rvate in] | do[mino - - -]/ — <strong>„Rettet, o Paulus und Petrus, [- - -] und Martyrius, und beschützt sie im Herrn [- - -]!“</strong></p><p>13026: [- - - roga]mus | [conse]rvate nos [omnes]/ — <strong>„[- - -] wir bitten, beschützt uns alle!“</strong></p><h3><strong>Einfache Anrufungen</strong></h3><p>12909: Petr[e et Paule]/ — <strong>„O Petrus und Paulus!“</strong></p><h3><strong>Hilfe für Sünder</strong></h3><p>12967: Petre et Paule sub|venite Prim[o] | peccatori/ — <strong>„Petrus und Paulus, kommt Primus, dem Sünder, zu Hilfe!“</strong></p><h3><strong>Viele Anrufungen sind auf Griechisch oder auf Latein in griechischen Buchstaben geschrieben</strong></h3><p>12927: Παῦλε {μ} καί | μου πατ|ρός/ — <strong>„Paulus, (hilf) auch meinem Vater!“</strong></p><p>12997: [Παυλ]ε ετ Πετ[ρε ιν μεν]/[τε ν]ος αβετε [ιν ορα]/[τι]ωνες βεστ[ρας]/ — <strong>„Paulus und Petrus, gedenkt in euren Gedanken, in euren Gebeten …“</strong></p><p>13045: [Πα]υ[λε ετ Πετρε] | [ι]ν με[ντε αβετε] | Αὐφίδ[ιον υἱόν - - -] | μου/ — <strong>„Paulus und Petrus, gedenkt des Aufidius, meines Sohnes!“</strong></p><p>13069: Πέτρε Παίτρε μνημόνευαι | Τιμοκράτην καὶ Εὐ|τυχείαν κινα(?) καὶ | ἐσώρα(?) ++ [- - -]/ — <strong>„Petrus, Petrus, gedenke des Timokrates und der Eutychia und (…) ++ [- - -]!“</strong></p><p>13045: [κομμ]ανδαμ[ους? - - -]/<strong> </strong>— <strong>„Wir empfehlen [- - -].“</strong></p><p>13049: Παῦλε καὶ Π[έτρε ἔχετε] / μνί[α]ς/ — <strong>„Paulus und Petrus, haltet im Gedächtnis [- - -]!“</strong></p><p>13055: [Παῦλε καὶ Πέτ]ρε εἰς μνε[ίαν] / [ἔχετε τὸν ᾿Ιρ]ίνες φίλι[ον]/ — <strong>„Paulus und Petrus, gedenkt des Geliebten der Irene.“</strong></p><p>13070: Παυλε Πετρε | Χαλκηδονι ανιμα | βωβυς κομαν|[δ]ω Λαυrους/ — <strong>„Paulus und Petrus, ich, Laurus (Laurusius?), empfehle euch die Seele des Chalkedonius!“</strong></p><p>13071: &lt;Π&gt;α[ῦλ]ος καὶ | Π[έτρο]ς συν|τηρή[σα]τε θ(εο)ῦ δούλους | πνεύματα | ἅγεια συντη|ρήσαται ἡμᾶ|ς ἴνα πολλοῖς | ἔτεσε[ι ζῶμεν]/ — <strong>„Paulus und Petrus, bewahrt die Knechte Gottes! Heilige Geister, bewahrt uns, damit wir viele Jahre leben!“</strong></p><p>13073: [Παυλε] ετ Πετρε | [ιν με]ντε [ν]ος αβε|[τοτε εἰς το]ὺς ἐῶ[νας]/<strong> </strong>— <strong>„Paulus und Petrus, gedenkt unser in Ewigkeit …“</strong></p><h3><strong>promisit / votum fecit</strong> — <strong>hat ein Gelübde abgelegt</strong></h3><p>13091: [- - - i]dus m[- - -] | Eulogius votum f[ecit]/ — <strong>„[- - -] am [- - -] Tag der Iden [- - -] hat Eulogius ein Gelübde abgelegt [- - -].“</strong></p><h3><strong>Erwähnungen des Refrigerium</strong> (Gedächtnismahl):</h3><p>12942: refrigerav[it] | [F]elicissimus cum s[uis]/ — <strong>„Felicissimus hat mit seiner Familie ein Mahl gehalten.“</strong></p><p>12981: Petro et Paulo | Tomius Coelius | refri`ger´&lt;i&gt;um feci/ — <strong>„Für Petrus und Paulus habe ich, Tomius Coelius, ein Mahl gehalten.“</strong></p><p>13003: [---] at Paulu[m] | et Pet[rum] | refri[geravi - - -]/ — <strong>„bei Paulus und Petrus habe ich ein Mahl gehalten.“</strong></p><p>Quelle: <a href="http://csla.history.ox.ac.uk/record.php?recid=E05087">http://csla.history.ox.ac.uk/record.php?recid=E05087</a></p><hr><h3>Anrufungen Gottes</h3><ul><li><p>DEVS TE PRECOR VТ PARADISVM LVCIS POSSIT VIDERE – „<strong>Herr, ich bitte dich, möge er das Licht des Paradieses sehen</strong>“.</p></li><li><p>DOMINE NE QVANDO ADVMBRETVR SPIRITVS VENERES – „<strong>Herr, möge die Seele der Venus niemals verdunkelt werden</strong>“.</p></li></ul><h3>Bitte an Verstorbene um Fürbitte</h3><ul><li><p>ET IN ORATIONIS TVIS ROGES PRO NOBIS QVIA SCIMVS TE ☧ – „<strong>Bitte in deinen Gebeten für uns, denn wir wissen, dass du in Christus bist</strong>“.</p></li><li><p>ORO SCIO NAMQVE BEATAM – „<strong>Ich bitte dich, denn ich weiß, dass du in der Seligkeit bist</strong>“.</p></li><li><p>ORA PRO PARENTI BVS TVIS – „<strong>Bete für deine Angehörigen</strong>“.</p></li><li><p>PETE PRO NOS VТ SALVI SIMVS – „<strong>Bete für uns, damit wir gerettet werden</strong>“.</p></li><li><p>IN ORATIONIS TVIS ROGES PRO NOBIS – „<strong>Bitte in deinen Gebeten für uns</strong>“.</p></li><li><p>ATTICE SPIRITVS TVS IN BONV ORA PRO PARENTIBVS TVIS – „<strong>Atticus, deine Seele ist in der Seligkeit; bete für deine Angehörigen</strong>“.</p></li></ul><p>Hier ist nur ein Teil wiedergegeben. Das übrige Material kann man unter dem Link lesen.</p><h3><strong>Inschriften und symbolische Darstellungen</strong></h3><ul><li><p>Das Wort VIVAS, d. h. „<strong>lebe</strong>“, das ebenfalls sehr oft auf Gräbern steht, drückt den Wunsch nach ewigem Leben und Seligkeit für den Verstorbenen aus;</p></li><li><p>VIVAS IN DEO – „<strong>lebe in Gott</strong>“.</p></li><li><p>VIBAS IN SANCTIS – „<strong>lebe unter den Heiligen</strong>“.</p></li></ul><h3>Der Verstorbene hat das Heil erlangt</h3><p>Manchmal wird noch bestimmter gesagt, dass der Begrabene unter den Auserwählten ist:</p><ul><li><p>ACCEPIT REQVI EM IN DEO – „<strong>Er hat Ruhe in Gott empfangen</strong>“.</p></li><li><p>SCIMVS ТЕ IN – „<strong>Wir wissen, dass du in Christus bist</strong>“.</p></li><li><p>FRVCTVOSVS ANIMA ТVА СVМ IVSTIS – „<strong>Fructuosus, deine Seele ist bei den Gerechten</strong>“.</p></li><li><p>REQVI EM ADCEPIT IN DEO PATRE NOSTRO ET CHRISTO EIVS – „<strong>Er hat Ruhe empfangen in Gott, unserem Vater, und in seinem Christus</strong>“.</p></li><li><p>ACCEPTA APVD DEVM – „<strong>Aufgenommen bei Gott (von einer Frau)</strong>“.</p></li><li><p>RECEPTVS AD DEVM – „<strong>Aufgenommen zu Gott</strong>“.</p></li><li><p>ТЕСVМ PAX CHRISTI – „<strong>der Friede Christi sei mit dir</strong>“.</p></li><li><p>SEMPER VIVE IN РАСЕ – „<strong>Lebe ewig im Frieden</strong>“.</p></li><li><p>IN РАСЕ ET IN DOMO AETERNA DEI – „<strong>Im Frieden und im ewigen Haus Gottes</strong>“.</p></li><li><p>VIVI IN GLORIA DEI ET IN PACE DOMINI NOSTRI ☧ – „<strong>Du lebst in der Herrlichkeit Gottes und im Frieden unseres Herrn Christus</strong>“; hier ist der Name des Erlösers mit seinem Monogramm ☧ geschrieben;</p></li><li><p>ELATVS EST, ebenfalls eine Art Zuruf, der nur ein- oder zweimal vorkommt, kann man so übersetzen: „<strong>er ist zu Gott aufgestiegen</strong>“.</p></li></ul><h3>Das Paradies — ein Ort des Lichts</h3><p>In den Grabinschriften der ersten Christen wird das Paradies ein Ort des Lichts und des Glanzes genannt; hier einige Beispiele:</p><ul><li><p>CVIVS SPIRITVS IN LVCE DOMINI SVSCEPTVS EST – „<strong>Seine Seele wurde in das Licht des Herrn aufgenommen</strong>“.</p></li><li><p>IN CHRISTVM CREDENS PREMIA LVCIS АВЕТ – „<strong>Im Glauben an Christus hat er das Licht als Lohn</strong>“.</p></li><li><p>AETERNA TIBI LUX TIMOTHEA IN ☧– „<strong>Ewiges Licht dir, Timothea, in (Christus)</strong>“.</p></li></ul><h3></h3><p>Buch (auf Russisch): <strong>A. von Fricken. Die römischen Katakomben und die Denkmäler der frühchristlichen Kunst. Moskau: K. T. Soldatenkow, 1872–1885.</strong> [2]</p>'
  references: |-
    <ol>
    <li><p><a href="https://vk.com/@aletheia-de-sanctis-venerandis">https://vk.com/@aletheia-de-sanctis-venerandis</a></p></li>
    <li><p><a href="https://azbyka.ru/otechnik/Istorija_Tserkvi/rimskie-katakomby-i-pamjatniki-pervonachalnogo-hristianskogo-iskusstva/2">https://azbyka.ru/otechnik/Istorija_Tserkvi/rimskie-katakomby-i-pamjatniki-pervonachalnogo-hristianskogo-iskusstva/2</a></p></li>
    </ol><p>Aus dem Russischen übersetzt von Rodion Wlassow, unter Verwendung von KI. Bibelzitate: Schlachter.</p>
