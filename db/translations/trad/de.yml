- src: древние-иконы
  path: Ik1c_Sammlung_alter_Ikonen
  title: Sammlung alter Ikonen
  title_sub: Alte christliche Ikonen Christi, der Gottesgebärerin, der Apostel und anderer Heiliger
  body: '<h2>um das 15. Jahrhundert v. Chr.</h2><h3>Das Zelt der Begegnung (Stiftshütte)</h3><p>Auf dem Vorhang in der Mitte des Heiligtums (zwischen dem Heiligen und dem Allerheiligsten) waren Cherubim dargestellt (<a href="https://bibleox.com/de/ge-sch/ish/26/#L31">2Mo 26:31</a>), ebenso auf den Teppichen (Wänden) ringsum (<a href="https://bibleox.com/de/ge-sch/ish/26/#L1">2Mo 26:1</a>; <a href="https://bibleox.com/de/ge-sch/ish/36/#L8">2Mo 36:8</a>), was der Zeichner dieses Bildes nicht wiedergegeben hat. Die Stiftshütte ist ein Bild (eine Ikone) der himmlischen Wirklichkeit (<a href="https://bibleox.com/de/ge-sch/ish/25/#L8-9,40">2Mo 25:8-9,40</a>; <a href="https://bibleox.com/de/ge-sch/evr/9/#L24">Hebr 9:24</a>; <a href="https://bibleox.com/de/ge-sch/act/7/#L44">Apg 7:44</a>). Gott gebot, das Heiligtum zu ehren (<a href="https://bibleox.com/de/ge-sch/lev/19/#L30">3Mo 19:30</a>; <a href="https://bibleox.com/de/ge-sch/lev/26/#L2">3Mo 26:2</a>).</p><img src="https://res.bibleox.com/s/img/image/simple/471/s_p_P2j4gLJt9iKSnkge.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/471/m_p_P2j4gLJt9iKSnkge.jpg">größer</a>] [<a href="https://res.bibleox.com/s/img/image/simple/472/m_p_bNPh6hCNJDhzahar.jpg">Außenansicht</a>]</p><h3>Die Bundeslade</h3><p>Auf der Lade waren zwei Cherubim dargestellt (<a href="https://bibleox.com/ru/ru/w/%D0%BA%D0%BE%D0%B2%D1%87%D0%B5%D0%B3_%D0%B7%D0%B0%D0%B2%D0%B5%D1%82%D0%B0/">Bibelstellen</a>). Der Prophet Josua fiel vor der Bundeslade nieder (<a href="https://bibleox.com/de/ge-sch/nav/7/#L6">Jos 7:6</a>).</p><img src="https://res.bibleox.com/s/img/image/simple/469/s_p_DUn5vqnI4F8yRiNA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/469/m_p_DUn5vqnI4F8yRiNA.jpg">größer</a>]</p><h3>Das Lager Israels</h3><p>Israel zog in Kreuzesform (<a href="https://bibleox.com/ru/ru/w/%D0%B5%D0%B2%D1%80%D0%B5%D0%B9%D1%81%D0%BA%D0%B8%D0%B9-%D1%81%D1%82%D0%B0%D0%BD-%D0%BA%D1%80%D0%B5%D1%81%D1%82/">Bibelstellen</a>).</p><img src="https://res.bibleox.com/s/img/image/simple/470/s_p_t8tRbbwlzsBzyVzk.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/470/m_p_t8tRbbwlzsBzyVzk.jpg">größer</a>]</p><h2>um das 10. Jahrhundert v. Chr.</h2><h3>Der von Salomo erbaute Tempel in Jerusalem</h3><p>Geschnitzte Bilder von Cherubim waren an den Wänden des Tempels (<a href="https://bibleox.com/de/ge-sch/3ts/6/#L32">1Kö 6:32</a>), an der Eingangstür (<a href="https://bibleox.com/de/ge-sch/3ts/6/#L32">1Kö 6:32</a>; <a href="https://bibleox.com/de/ge-sch/3ts/6/#L35">1Kö 6:35</a>) und auf dem Vorhang vor dem Eingang ins Allerheiligste (<a href="https://bibleox.com/de/ge-sch/2par/3/#L14">2Chr 3:14</a>; <a href="https://bibleox.com/de/gr-lxx-byz/1mak/1/#L22">1Mac 1:22</a>). Im Allerheiligsten standen zwei große vergoldete hölzerne Cherubim-Figuren (<a href="https://bibleox.com/de/ge-sch/3ts/6/#L23">1Kö 6:23</a>). Auf dem Deckel der Bundeslade waren zwei Cherubim-Figuren angebracht (<a href="https://bibleox.com/de/ge-sch/ish/25/#L18-20">2Mo 25:18-20</a>). Im Tempelhof waren auf den großen Gestellen der Waschbecken Löwen, Rinder und Cherubim dargestellt (<a href="https://bibleox.com/de/ge-sch/3ts/7/#L28-29">1Kö 7:28-29</a>). (<a href="https://bibleox.com/ru/ru/w/%D0%B8%D0%B5%D1%80%D1%83%D1%81%D0%B0%D0%BB%D0%B8%D0%BC%D1%81%D0%BA%D0%B8%D0%B9-%D1%85%D1%80%D0%B0%D0%BC/">Mehr dazu</a>)</p><p>Der Prophet David fiel zum Tempel hin nieder (<a href="https://bibleox.com/de/ge-sch/ps/5/#L7">Ps 5:7</a>; <a href="https://bibleox.com/de/ge-sch/ps/99/#L5">Ps 99:5</a>; <a href="https://bibleox.com/de/ge-sch/ps/132/#L7">Ps 132:7</a>) und ehrte Gott durch dieses Bild.</p><img src="https://res.bibleox.com/s/img/image/simple/468/s_p_lv7GzNtM53C4Zqgr.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/468/m_p_lv7GzNtM53C4Zqgr.jpg">größer</a>]</p><h2>2. Jahrhundert</h2><h3>Die Gottesgebärerin mit dem Jesuskind, ein Prophet zeigt auf einen Stern (Rom)</h3><p>2. – Anfang 3. Jahrhundert. Priscilla-Katakombe[6]. Dies ist das älteste Bild der Gottesgebärerin. Der Mann neben ihr hält vielleicht ein Buch in der linken Hand und zeigt mit dem Finger der rechten auf einen Stern.</p><img src="https://res.bibleox.com/s/img/image/simple/6751b012dba7720001514f69/s_p_jNTGMwic6Cse9xDG.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6751b012dba7720001514f69/m_p_jNTGMwic6Cse9xDG.jpg">größer</a>] [<a href="https://res.bibleox.com/s/img/image/simple/67618740dba7720001cd0e2c/m_p_ckKuGWqzHuN1tR5Q.jpg">Version 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686cf0535f47da2505d3ae4d/m_p_dajA4xvStk0EnnSq.jpg">Version 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686cf7725f47da2505d3ae50/m_p_n79yEKK4QSCeorx3.jpg">Version 4</a>] [<a href="https://res.bibleox.com/s/img/image/simple/442/m_p_5zQEQbMmBkEs9J2S.jpg">Version 5</a>]</p><p>Der Mann neben der Gottesgebärerin könnte der Prophet Jesaja sein, der die Prophezeiung sprach:</p><blockquote><p>„Darum wird euch der Herr selbst ein Zeichen geben: Siehe, <strong>die Jungfrau hat empfangen und wird Mutter eines Sohnes</strong>, den sie Immanuel nennen wird“ (<a href="https://bibleox.com/de/ge-sch/is/7/#L14">Jes 7:14</a>)</p></blockquote><p>Oder Bileam:</p><blockquote><p>„Ich sehe ihn, aber jetzt noch nicht; ich schaue ihn, aber noch nicht in der Nähe. <strong>Ein Stern tritt aus Jakob hervor</strong>, und ein Zepter kommt aus Israel. Er schlägt Moab auf beide Seiten und alle Kinder Set aufs Haupt“ (<a href="https://bibleox.com/de/ge-sch/chis/24/#L17">4Mo 24:17</a>)</p></blockquote><p>Oder der Maler hat statt einer erklärenden Inschrift einfach dieses Mittel gewählt. Er lädt uns ein, das Buch zu nehmen, die Prophezeiung vom aufgehenden Stern zu lesen und zu verstehen, dass er die Geburt dessen dargestellt hat, von dem diese Prophezeiung spricht, also die Geburt des Erlösers aus der Jungfrau.</p><h3>Christus als der Gute Hirte</h3><p>Ende des 2. Jahrhunderts. Rom. Kallixtus-Katakombe (<a href="https://en.wikipedia.org/wiki/Catacomb_of_Callixtus#Paintings">Callixitus Catacomb, Crypt of Lucina</a>).</p><img src="https://res.bibleox.com/s/img/image/simple/473/s_p_mrIYHR2oqLQuPn0z.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/473/m_p_mrIYHR2oqLQuPn0z.jpg">größer</a>]</p><h2>3. Jahrhundert</h2><h3>Die Gottesgebärerin „Orans“ (Rom)</h3><p>Catacomba Maggiore, Rom[26][27]. Im Vordergrund sind die Jungfrau Maria und das Christuskind dargestellt.</p><img src="https://res.bibleox.com/s/img/image/simple/6751fe6ddba7720001514f7e/s_p_C1Iw2V4OhNy1SGOE.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6751fe6ddba7720001514f7e/m_p_C1Iw2V4OhNy1SGOE.jpg">größer</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686cefb35f47da2505d3ae4c/m_p_70zYu2r0np0WFNUu.jpg">Version 2</a>]</p><h3>Christus, die Apostel, die Märtyrer Gorgonius, Petrus, Marcellinus und Tiburtius (Rom)</h3><p>Katakombe von Marcellinus und Petrus</p><img src="https://res.bibleox.com/s/img/image/simple/6752012adba7720001514f82/s_p_x5I0ahjwMz1X5LoJ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6752012adba7720001514f82/m_p_x5I0ahjwMz1X5LoJ.jpg">größer</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686d237a5f47da2505d3ae56/m_p_ST9me27UGtWHYDBc.jpg">Version 2</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/676082a6dba7720001cd0e22/s_p_YjPD3PzLDCF4wgh1.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/676082a6dba7720001cd0e22/m_p_YjPD3PzLDCF4wgh1.jpg">größer</a>]</p><h3>Eine Frau betet zum Guten Hirten (Rom)</h3><p>3. Jahrhundert. Priscilla-Katakombe[6].</p><p>Die Bilder bilden eine Komposition. Der Maler hat sie so angeordnet, dass die ringsum dargestellten Betenden zur Spitze des Raumes blicken und die Hände erheben, wo Christus als der <strong>Gute Hirte</strong> dargestellt ist (<a href="https://bibleox.com/de/ge-sch/in/10/#L11">Joh 10:11</a>). Alle Szenen um den Guten Hirten verbindet ein Thema: <strong>die Rettung vom Tod</strong>.</p><img src="https://res.bibleox.com/s/img/image/simple/686bea5b5f47da2505d3ae31/s_p_pjRHeoFaUpKPoyEH.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686bea5b5f47da2505d3ae31/m_p_pjRHeoFaUpKPoyEH.jpg">größer</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686cf7375f47da2505d3ae4f/m_p_MOsOWI2vEXUj5ELf.jpg">Version 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6904b3f2205184ec278d6e53/m_p_0GRveVCOh2GBz7eq.jpg">Version 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/431/m_p_LUZsrJtesEWiwHBO.jpg">Version 4</a>]</p><p>Der Gute Hirte ist Christus (<a href="https://bibleox.com/de/ge-sch/lk/15/#L6-7">Lk 15:6-7</a>; <a href="https://bibleox.com/de/ge-sch/in/10/#L1-21">Joh 10:1-21</a>; <a href="https://bibleox.com/de/ge-sch/ps/23/">Ps 23</a>).</p><img src="https://res.bibleox.com/s/img/image/simple/69319f74205184ec278d6fa7/s_p_GR8gHxKZuC87xqlf.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69319f74205184ec278d6fa7/m_p_GR8gHxKZuC87xqlf.jpg">größer</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686d2ac55f47da2505d3ae59/m_p_JDvtNt9RJrqnAsEW.jpg">Version 2</a>]</p><p>Eine Frau mit bedecktem Haupt betet mit erhobenen Händen (wahrscheinlich Sara: <a href="https://bibleox.com/de/ge-sch/gen/18/#L1-15">1Mo 18:1-15</a> und <a href="https://bibleox.com/de/ge-sch/gen/21/#L1-7">1Mo 21:1-7</a>).</p><img src="https://res.bibleox.com/s/img/image/simple/686bea885f47da2505d3ae32/s_p_79wnuevuFIi3tnrH.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686bea885f47da2505d3ae32/m_p_79wnuevuFIi3tnrH.jpg">größer</a>]</p><p>Rechts eine alttestamentliche Szene: die drei Jünglinge (<a href="https://en.wikipedia.org/wiki/Catacomb_of_Priscilla#/media/File:Shadrach,_Meshach,_and_Abednego_in_the_fiery_furnace,_from_the_book_Die_Malereien_der_Katakomben_Roms,_plate_78,_levels_adjusted.jpg">Schadrach, Meschach und Abed-Nego</a>) beten mit erhobenen Händen (<a href="https://bibleox.com/de/ge-sch/dan/3/">Dan 3</a>).</p><img src="https://res.bibleox.com/s/img/image/simple/686cfc565f47da2505d3ae52/s_p_NmZJuoF70d9qohZs.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686cfc565f47da2505d3ae52/m_p_NmZJuoF70d9qohZs.jpg">größer</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686cfc475f47da2505d3ae51/m_p_qzHB83d52LoU7QQL.jpg">Version 2</a>]</p><p>Links eine alttestamentliche Szene: Abraham und Isaak mit dem Holz für das Opfer (<a href="https://bibleox.com/de/ge-sch/gen/22/#L1-19">1Mo 22:1-19</a>).</p><img src="https://res.bibleox.com/s/img/image/simple/686d33c45f47da2505d3ae5a/s_p_QQLn5T52hx8gSrBf.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d33c45f47da2505d3ae5a/m_p_QQLn5T52hx8gSrBf.jpg">größer</a>]</p><p>Über dem Eingang ist der Prophet Jona dargestellt, den das Meerestier verschlingt (<a href="https://bibleox.com/de/ge-sch/ion/2/#L1">Jon 2:1</a>).</p><img src="https://res.bibleox.com/s/img/image/simple/476/s_p_aHV4YSuoWhVZ1H5y.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/476/m_p_aHV4YSuoWhVZ1H5y.jpg">größer</a>]</p><p>Die Szene aus dem Leben der betenden Frau an der Vorderwand des Raumes verdient eine genauere Beschreibung.</p><img src="https://res.bibleox.com/s/img/image/simple/686d36265f47da2505d3ae5d/s_p_MGpxKQ94pikRfgFK.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d36265f47da2505d3ae5d/m_p_MGpxKQ94pikRfgFK.jpg">größer</a>]</p><p><strong>Die Ereignisse der vorderen Szene</strong></p><p>Jeder Abschnitt der Komposition des Raumes zeigt eine Szene. Alle Szenen sind wichtige Bestandteile christlicher Themen. Oben ist die Szene mit dem Guten Hirten, links die Szene mit Abraham, rechts die drei Jünglinge, im Durchgang der Prophet Jona. So kann man annehmen, dass der Maler diese Regel (ein Abschnitt, eine wichtige Szene) auch an der schwer eindeutig zu deutenden Vorderwand beibehielt. Hier folgt nur eine Vermutung. Da an allen Seiten (außer der Mitte) alttestamentliche Szenen dargestellt sind, könnte die Vorderwand die Geschichte Hagars zeigen (<a href="https://bibleox.com/de/ge-sch/gen/16/">1Mo 16</a>, <a href="https://bibleox.com/de/ge-sch/gen/21/">1Mo 21</a>). Wenn ja, ist zuerst Abraham mit der verstoßenen Hagar und ihrem Sohn Ismael dargestellt (1), dann das Gebet Saras (2), dann Hagar, die ihr Kind nährt (3).</p><p>Betrachten wir diese Deutung genauer:</p><p><strong>1. Die Verstoßung Hagars</strong>. Am sichersten lässt sich sagen, dass der Sitzende Abraham ist (er hat dasselbe Haar und denselben Bart wie auf dem Fresko mit Abraham gegenüber). In Gelb ist wahrscheinlich Hagar dargestellt (Gelb könnte den Stand einer Sklavin betont haben). Sie scheint einen Wasserschlauch in den Händen zu halten (<a href="https://bibleox.com/de/ge-sch/gen/21/#L14">1Mo 21:14</a>). Hinter ihr ist vielleicht ihr Sohn Ismael, der zur Zeit der Verstoßung über 15 Jahre alt gewesen sein muss (<em>Ismael wurde geboren, als Abraham 86 war </em><a href="https://bibleox.com/de/ge-sch/gen/16/#L16">1Mo 16:16</a><em>, Isaak, als Abraham 100 war </em><a href="https://bibleox.com/de/ge-sch/gen/21/#L5">1Mo 21:5</a><em>, und Hagar wird verstoßen, als Isaak groß geworden und entwöhnt war </em><a href="https://bibleox.com/de/ge-sch/gen/21/#L8-13">1Mo 21:8-13</a>). Es sieht aus wie eine Frau mit Schürze, doch wenn das so ist, kann es nur Hagar selbst sein (eine Unverheiratete hat das Haupt unbedeckt), und der mit dem Wasserschlauch ist dann Ismael. So oder so sind die beiden übrigen Gestalten am wahrscheinlichsten Hagar und Ismael. Es kann auch sein, dass die Komposition nicht aus einzelnen Abschnitten besteht, sondern ein ganzes Bild ist, denn die Frau mit dem Kind blickt auf die Frau mit den erhobenen Händen.</p><img src="https://res.bibleox.com/s/img/image/simple/686d33c95f47da2505d3ae5b/s_p_kuEcuyUnGenBuWPw.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d33c95f47da2505d3ae5b/m_p_kuEcuyUnGenBuWPw.jpg">größer</a>]</p><p><strong>2. Das Gebet Saras</strong>. In rotem Gewand und mit bedecktem Haupt ist Sara dargestellt, die zu Gott betet. Die rote Kleidung zeigt hohen Stand, das bedeckte Haupt, dass sie verheiratet ist.</p><img src="https://res.bibleox.com/s/img/image/simple/686d3a855f47da2505d3ae5e/s_p_rpl3jnuNnx8ZisdR.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d3a855f47da2505d3ae5e/m_p_rpl3jnuNnx8ZisdR.jpg">größer</a>]</p><p><strong>3. Hagar nährt ihr Kind</strong>. Für die Deutung als Hagar spricht, dass ihr Haupt unbedeckt ist (also unverheiratet) und ihr Haar dieselbe Form hat wie das der Gestalt in Gelb in der ersten Szene. Auch ihr bezeichnender Blick verrät sie: Sie schaut auf Sara, mit der sie ein gespanntes Verhältnis hatte. Bemerkenswert ist, dass der Maler sie genau so darstellte, wie links Abraham sitzt: auf einem Stuhl und in genau derselben Kleidung (senkrechte Streifen, zwei Streifen am Ärmel, Umhang).</p><img src="https://res.bibleox.com/s/img/image/simple/686d22a05f47da2505d3ae54/s_p_8fxd9vcRlXYszSJU.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d22a05f47da2505d3ae54/m_p_8fxd9vcRlXYszSJU.jpg">größer</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686d33cd5f47da2505d3ae5c/m_p_qKPp740xLZNuDEFs.jpg">Version 2</a>]</p><p><strong>Der Gedanke des ganzen Raumes: Rettung vom Tod</strong></p><p>Die Komposition dieses Cubiculums hat einen gemeinsamen, schönen Gedanken: die Rettung vom Tod. Die Gesamtgeschichte steigt in Stufen von unten nach oben:</p><ul><li><p>Die unterste Stufe: die begrabenen Christen, die an Christus glaubten, den Sieger über den Tod.</p></li><li><p>Die mittlere Stufe: biblische Geschichten von der Rettung vom Tod:</p><ul><li><p>die drei Jünglinge im babylonischen Feuerofen werden vor dem Tod im Feuer bewahrt;</p></li><li><p>der Prophet Jona wird vor dem Tod im Bauch des Meerestiers bewahrt;</p></li><li><p>Isaak wird davor bewahrt, geopfert zu werden; an seiner Stelle wird ein Widder geopfert;</p></li><li><p>Hagar und ihr Sohn Ismael werden vor dem Tod in der Wüste bewahrt.</p></li></ul></li><li><p>Die vorletzte Stufe: christliche Symbole, der Pfau (Auferstehung, Unsterblichkeit, ewiges Leben) und das Rebhuhn (die Seele). Ein Rebhuhn steht neben einer lebenden Pflanze (Symbol des Lebens), das andere neben einer verdorrten (Symbol des Todes). Ebenso stehen die Pfauen.</p></li><li><p>Die Mitte der Decke: der Gute Hirte, der die Gläubigen vom Tod errettet. Bemerkenswert ist, dass es hier noch einen kleinen Hinweis auf die Rettung vom Tod gibt: links und rechts vom Hirten sitzen der Rabe und die Taube mit dem Ölzweig, die Noah aus der Arche aussandte. So werden die in der Arche vor dem Tod Geretteten durch diese Vögel zum Retter vom Tod geführt, zu Christus.</p></li></ul><h3>Die Kirche in Dura-Europos (Syrien)</h3><p>244. Außer alttestamentlichen Ereignissen enthielt die Kirche in Dura-Europos Fresken mit neutestamentlichen Szenen: die Rettung des sinkenden Apostels Petrus und die Heilung des Gelähmten am Schafteich. Siehe auch den <a href="https://vk.com/@aletheia-de-sacris-imaginibus-venerandis?anchor=v-drugie-svyaschennye-izobrazhenia-v-donikeyskiy-period">Artikel</a>.</p><p><strong>Christus als der Gute Hirte (die Hauptansicht im Baptisterium)</strong></p><img src="https://res.bibleox.com/s/img/image/simple/6931870c205184ec278d6fa2/s_p_uBkNi8jGsMFpOQSM.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931870c205184ec278d6fa2/m_p_uBkNi8jGsMFpOQSM.jpg">größer</a>]</p><p><strong>Die Rettung des sinkenden Apostels Petrus</strong></p><img src="https://res.bibleox.com/s/img/image/simple/692c8038205184ec278d6f9e/s_p_QQ2Rml8gUWsyQtS9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c8038205184ec278d6f9e/m_p_QQ2Rml8gUWsyQtS9.jpg">größer</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6786b88ddba77200015ae11c/m_p_do380IVDukCAfdFk.jpg">Version 2</a>]</p><p><strong>Die Heilung des Gelähmten am Schafteich</strong></p><img src="https://res.bibleox.com/s/img/image/simple/6786b889dba77200015ae11b/s_p_k1a5GDBvfzTCWmZv.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6786b889dba77200015ae11b/m_p_k1a5GDBvfzTCWmZv.jpg">größer</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6786bb0bdba77200015ae11d/m_p_dCRD85foL69l7kih.jpg">andere Version</a>]</p><h3>Christus als der Gute Hirte, der Prophet Jona</h3><p>Ende 3. – Anfang 4. Jahrhundert. Rom. Katakombe von Marcellinus und Petrus.</p><p>In der Mitte ist Christus als der Gute Hirte. Zu beiden Seiten der Mitte ist Jona dargestellt. Auf dem linken Fresko wird Jona vom Schiff geworfen, auf dem rechten verschlingt ihn der Wal.</p><img src="https://res.bibleox.com/s/img/image/simple/478/s_p_yvJcnbLGPxZ6AzRu.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/478/m_p_yvJcnbLGPxZ6AzRu.jpg">größer</a>]</p><p>Der Prophet Jona</p><img src="https://res.bibleox.com/s/img/image/simple/481/s_p_7z5j4tAimokFaRMN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/481/m_p_7z5j4tAimokFaRMN.jpg">größer</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/480/s_p_b8gqyOenKZcn2MCp.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/480/m_p_b8gqyOenKZcn2MCp.jpg">größer</a>]</p><h3>Christus als der Gute Hirte</h3><p>3. Jahrhundert. Rom. Kallixtus-Katakombe (<a href="https://en.wikipedia.org/wiki/Catacomb_of_Callixtus#Paintings">Callixitus Catacomb, Crypt of Lucina</a>). Man kann vermuten, dass im Kessel Milch ist, ein Symbol der Eucharistie (vgl. Clemens von Alexandrien).</p><img src="https://res.bibleox.com/s/img/image/simple/474/s_p_zcLmMd2qkyG3pDoj.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/474/m_p_zcLmMd2qkyG3pDoj.jpg">größer</a>]</p><h3>Der Gute Hirte, Nekropole Hisartepe, Nicäa (İznik)</h3><p>Um das 3. Jahrhundert. Der Fund ist neu, die Datierung vorläufig (<a href="https://www.arkeolojikhaber.com/haber-iznikte-benzersiz-bir-kesif-anadolunun-tek-coban-isa-figuru-gun-yuzune-cikarildi-43079/">mehr dazu</a>). Diese Nekropole wurde vom 2. bis zum 5. Jahrhundert benutzt.</p><p>Koordinaten: 40.78204218462122, 29.928491677648932. Der türkische Ortsname: Hasartep Nekropolü.</p><img src="https://res.bibleox.com/s/img/image/simple/69444e49205184ec278d6fdb/s_p_SZTpvcDdpodujcbM.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69444e49205184ec278d6fdb/m_p_SZTpvcDdpodujcbM.jpg">größer</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6941a813205184ec278d6fda/s_p_CUoa7dSy5UxGf1UD.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6941a813205184ec278d6fda/m_p_CUoa7dSy5UxGf1UD.jpg">größer</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6941a80f205184ec278d6fd9/m_p_xSCaRt10DUUReyMt.jpg">Version 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/693c7d1a205184ec278d6fcb/m_p_mR5ZaVgXbezmXDyo.jpg">Version 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/693d606b205184ec278d6fd3/m_p_TKCjvhxmnq0q50tW.jpg">Version 4</a>] [<a href="https://res.bibleox.com/s/img/image/simple/693d6101205184ec278d6fd7/m_p_1i6aL6lfDR08iA13.jpg">Version 5</a>] [<a href="https://res.bibleox.com/s/img/image/simple/693d60f8205184ec278d6fd6/m_p_b2uUaO6tzciaKAgC.jpg">Version 6</a>] [<a href="https://res.bibleox.com/s/img/image/simple/693d60f1205184ec278d6fd5/m_p_bErh7lbI0e08hPaa.jpg">Version 7</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/693c7db2205184ec278d6fd2/s_p_wCZsWPWG7jCNLjIr.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/693c7db2205184ec278d6fd2/m_p_wCZsWPWG7jCNLjIr.jpg">größer</a>] [<a href="https://res.bibleox.com/s/img/image/simple/693d60ad205184ec278d6fd4/m_p_BCvsIiJX10j2Mf2k.jpg">Mann und Frau</a>] [<a href="https://res.bibleox.com/s/img/image/simple/693c7daa205184ec278d6fd1/m_p_cjk36Xjpev9EFq2h.jpg">Frau</a>]</p><h3>Ein Ehering (Byzanz)</h3><p>3.–4. Jahrhundert. <a href="https://www.metmuseum.org/art/collection/search/663485">Metropolitan Museum of Art, Fifth Avenue, USA</a>. (griech. χάρις, „Gnade“)</p><img src="https://res.bibleox.com/s/img/image/simple/68b5da8b45c75323d28a5e99/s_p_GNh1S8L7fcowsMEE.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5da8b45c75323d28a5e99/m_p_GNh1S8L7fcowsMEE.jpg">größer</a>]</p><h3>Die Feier der Eucharistie</h3><p>3. Jahrhundert. Rom. Kallixtus-Katakombe (<a href="https://en.wikipedia.org/wiki/Catacomb_of_Callixtus#Paintings">Callixitus Catacomb, Crypt of Lucina</a>). Wahrscheinlich ist ein Priester mit einem mitzelebrierenden Diakon dargestellt. So wird die Eucharistie auch heute in den Kirchen der Orthodoxen Kirche gefeiert: Der Priester erhebt beide Hände, der Diakon weist auf die heiligen Gaben.</p><img src="https://res.bibleox.com/s/img/image/simple/479/s_p_Zbn405P2krjwNAYl.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/479/m_p_Zbn405P2krjwNAYl.jpg">größer</a>]</p><h2>4. Jahrhundert</h2><h3>Christus (Rom)</h3><p>Commodilla-Katakombe.</p><img src="https://res.bibleox.com/s/img/image/simple/66cc2bd6dba77200019bc7d2/s_p_7xYGBb9wCmxBIGrZ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/66cc2bd6dba77200019bc7d2/m_p_7xYGBb9wCmxBIGrZ.jpg">größer</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686d23425f47da2505d3ae55/s_p_LzqgbhnIsbqtghoc.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d23425f47da2505d3ae55/m_p_LzqgbhnIsbqtghoc.jpg">größer</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a1e1205184ec278d6fa8/m_p_KC0MljXJf5po70pj.jpg">Version 2</a>]</p><h3>Christus und die Apostel (Rom)</h3><p>Um 350. [8][9] Mausoleum Santa Costanza.</p><img src="https://res.bibleox.com/s/img/image/simple/686990665f47da2505d3ae19/s_p_5RDr4ou4ExBAh4KE.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686990665f47da2505d3ae19/m_p_5RDr4ou4ExBAh4KE.jpg">größer</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686990425f47da2505d3ae17/s_p_CXn5KmuiWradhOvh.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686990425f47da2505d3ae17/m_p_CXn5KmuiWradhOvh.jpg">größer</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686990545f47da2505d3ae18/s_p_IkgteAcecXoMC106.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686990545f47da2505d3ae18/m_p_IkgteAcecXoMC106.jpg">größer</a>]</p><h3>Baptisterium San Giovanni in Fonte (Neapel)</h3><p>350–400. [11][12]</p><img src="https://res.bibleox.com/s/img/image/simple/6869924c5f47da2505d3ae1a/s_p_t1iU8sClY3pnOnkK.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6869924c5f47da2505d3ae1a/m_p_t1iU8sClY3pnOnkK.jpg">größer</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686992505f47da2505d3ae1b/s_p_BrRKZmtReJbgXm0w.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686992505f47da2505d3ae1b/m_p_BrRKZmtReJbgXm0w.jpg">größer</a>]</p><h3>Christus und Engel, die Wiederkunft (Thessaloniki, Byzanz)</h3><p>Ende 4. Jahrhundert. [17][18] Rotunde des heiligen Georg des Siegesträgers (ursprünglich Grabmal des Kaisers Galerius).</p><img src="https://res.bibleox.com/s/img/image/simple/6931a254205184ec278d6fa9/s_p_bWn7Chqiox5UOEd4.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931a254205184ec278d6fa9/m_p_bWn7Chqiox5UOEd4.jpg">größer</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a2ba205184ec278d6faa/m_p_ROPWmBVyUxWMGo9Z.jpg">Version 2</a>]</p><p>Das Mosaik ist schlecht erhalten. Vom Bild Christi sind nur ein Stück des Nimbus, eine Hand und das Kreuz geblieben. Die Gesichter der Engel ringsum sind gut zu sehen.</p><img src="https://res.bibleox.com/s/img/image/simple/686a91695f47da2505d3ae1f/s_p_EoOSmhaBPsy32XQQ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686a91695f47da2505d3ae1f/m_p_EoOSmhaBPsy32XQQ.jpg">größer</a>]</p><h3>Heilige Bischöfe, Soldaten, Ärzte (Thessaloniki, Byzanz)</h3><p>Ende 4. Jahrhundert. [17][18] Rotunde des heiligen Georg des Siegesträgers (ursprünglich Grabmal des Kaisers Galerius).</p><p>Unter den Mosaiken sind Bilder heiliger Bischöfe, Soldaten, Ärzte und Musiker mit den Namen Romanos, Kyrill, Leon, Onesiphoros, Eukarpios, Basiliskos, Porphyrios, Philemon, Priskos, Therinos, Kosmas und Damian.</p><img src="https://res.bibleox.com/s/img/image/simple/686aa0275f47da2505d3ae21/s_p_oIksDo9rIgSoAXvG.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa0275f47da2505d3ae21/m_p_oIksDo9rIgSoAXvG.jpg">größer</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686aa02e5f47da2505d3ae22/s_p_nTZtC6C93KI8Fu6I.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa02e5f47da2505d3ae22/m_p_nTZtC6C93KI8Fu6I.jpg">größer</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686aa0335f47da2505d3ae23/s_p_b1KhWllqTzipVhO9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa0335f47da2505d3ae23/m_p_b1KhWllqTzipVhO9.jpg">größer</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686aa0385f47da2505d3ae24/s_p_vvlbG9E89B9T0U8j.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa0385f47da2505d3ae24/m_p_vvlbG9E89B9T0U8j.jpg">größer</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686aa03f5f47da2505d3ae25/s_p_d3lcRobegfAQOf6e.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa03f5f47da2505d3ae25/m_p_d3lcRobegfAQOf6e.jpg">größer</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686aa0555f47da2505d3ae27/s_p_h1YgFpMukwaYc23Q.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa0555f47da2505d3ae27/m_p_h1YgFpMukwaYc23Q.jpg">größer</a>]</p><p>Die heiligen Kosmas und Damian</p><img src="https://res.bibleox.com/s/img/image/simple/686aa04e5f47da2505d3ae26/s_p_LwMjPHLsabDDxEHy.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa04e5f47da2505d3ae26/m_p_LwMjPHLsabDDxEHy.jpg">größer</a>]</p><h3>Ein Bild des zwischen den Räubern gekreuzigten Christus (Rom)</h3><p>Anfang 4. Jahrhundert [gewöhnlich wird die Tür um 430 datiert]. Basilika Santa Sabina, eine der Türtafeln. Ein Relief der Kreuzigung.</p><img src="https://res.bibleox.com/s/img/image/simple/676183a8dba7720001cd0e2b/s_p_ccaA7HzLPDInwe1b.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/676183a8dba7720001cd0e2b/m_p_ccaA7HzLPDInwe1b.jpg">größer</a>]</p><h3>Der Einzug des Herrn in Jerusalem (Byzanz)</h3><p>Anfang 4. Jahrhundert. <a href="https://www.metmuseum.org/art/collection/search/466220">Metropolitan Museum of Art, Fifth Avenue, USA</a>. 67,3 × 212,1 × 61,9 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5e69845c75323d28a5e9d/s_p_Kk1dIB2OLr1OjQ1O.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5e69845c75323d28a5e9d/m_p_Kk1dIB2OLr1OjQ1O.jpg">größer</a>]</p><h3>Christus, eine Platte (Chersones)</h3><p>300–500. <a href="https://collections.louvre.fr/en/ark:/53355/cl010276835">Louvre, Frankreich</a>. Laut Museum befindet sich der zweite Teil in der Eremitage. Eingraviert sind Worte, die an den Apostel Petrus gerichtet sind.</p><img src="https://res.bibleox.com/s/img/image/simple/68c41cec6594f46d35a87f04/s_p_esWl4etLsBMVz9bw.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c41cec6594f46d35a87f04/m_p_esWl4etLsBMVz9bw.jpg">größer</a>]</p><h3>Christus als Lehrer (Rom)</h3><p>Domitilla-Katakombe. Malerei in der Lünette eines Cubiculums.</p><img src="https://res.bibleox.com/s/img/image/simple/674ed2a4dba77200011c738a/s_p_4M8Vki7GNJBHkJPN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674ed2a4dba77200011c738a/m_p_4M8Vki7GNJBHkJPN.jpg">größer</a>]</p><h3>Der Herr Jesus Christus (Rom)</h3><p>3.–5. Jahrhundert. Generosa-Katakombe [7]</p><img src="https://res.bibleox.com/s/img/image/simple/674f2408dba77200011c739c/s_p_zVliPTIYBpqqnTGQ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f2408dba77200011c739c/m_p_zVliPTIYBpqqnTGQ.jpg">größer</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6931a55a205184ec278d6faf/s_p_xXRXPudiFDi6GltL.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931a55a205184ec278d6faf/m_p_xXRXPudiFDi6GltL.jpg">größer</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686bf5b25f47da2505d3ae36/m_p_Io7kaT9uNdBPFcSj.jpg">Version 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a5b6205184ec278d6fb0/m_p_btFyqkRBFzGf0FSH.jpg">Version 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a5e4205184ec278d6fb1/m_p_wuVaj4ghYuk6s5cc.jpg">Version 4</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a5fe205184ec278d6fb2/m_p_mO6KaZXywWX76vBg.jpg">Version 5</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a656205184ec278d6fb3/m_p_eqLfG1BFyG45i90X.jpg">Version 6</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a858205184ec278d6fb5/m_p_EVVCP1plDQZ4XgAS.jpg">Version 7</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6931a360205184ec278d6fab/s_p_hObpAcapDVZvLsC1.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931a360205184ec278d6fab/m_p_hObpAcapDVZvLsC1.jpg">größer</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6931a369205184ec278d6fad/s_p_8bP3aXtUgkNcP9gz.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931a369205184ec278d6fad/m_p_8bP3aXtUgkNcP9gz.jpg">größer</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6931a363205184ec278d6fac/s_p_BcSN3IXA4JYFLpgA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931a363205184ec278d6fac/m_p_BcSN3IXA4JYFLpgA.jpg">größer</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6931a36f205184ec278d6fae/s_p_6J6vSMM0TM5tc59T.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931a36f205184ec278d6fae/m_p_6J6vSMM0TM5tc59T.jpg">größer</a>]</p><h3>Die heiligen Viatrix und Simplicius (oder Rufus) (Rom)</h3><p>3.–5. Jahrhundert. Generosa-Katakombe [7]</p><img src="https://res.bibleox.com/s/img/image/simple/66cc2c40dba77200019bc7d8/s_p_zABjPHGhPdjGVh3U.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/66cc2c40dba77200019bc7d8/m_p_zABjPHGhPdjGVh3U.jpg">größer</a>]</p><h3>Die Apostel Petrus und Paulus (Rom)</h3><p>Um 380. Katakombe Santa Tecla (der heiligen Thekla), Fresko [24]</p><p>Dargestellt sind die Apostel Petrus, Paulus, Andreas und Johannes.</p><img src="https://res.bibleox.com/s/img/image/simple/686bf38e5f47da2505d3ae35/s_p_BxfiObhkLMfci8nP.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686bf38e5f47da2505d3ae35/m_p_BxfiObhkLMfci8nP.jpg">größer</a>] [<a href="https://res.bibleox.com/s/img/image/simple/687291145f47da2505d3ae8b/m_p_WXlkaMJTOrIzlOdI.jpg">Version 2</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/68b6cd4802e89ba22dfc3977/s_p_kAWGH2VPHMkRv9cL.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b6cd4802e89ba22dfc3977/m_p_kAWGH2VPHMkRv9cL.jpg">größer</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686bf5bf5f47da2505d3ae37/m_p_F0tsoqA9bv6CrpfE.jpg">Version 2</a>]</p><h3>Die Apostel Petrus und Paulus (Byzanz)</h3><p>Mitte 4. Jahrhundert. Christus überreicht den Aposteln Petrus und Paulus die Märtyrerkronen. <a href="https://www.metmuseum.org/art/collection/search/463547">Metropolitan Museum of Art, Fifth Avenue, USA</a>. Rom oder Byzanz. 13,8 × 12,5 × 5 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5f5d745c75323d28a5ebc/s_p_MiCffui3hayo2BCt.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5f5d745c75323d28a5ebc/m_p_MiCffui3hayo2BCt.jpg">größer</a>]</p><hr><p>Mitte 4. Jahrhundert. <a href="https://www.metmuseum.org/art/collection/search/468386">Metropolitan Museum of Art, Fifth Avenue, USA</a>. Rom oder Byzanz. 8,5 × 14 × 13,3 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5e89c45c75323d28a5ea1/s_p_HAfNPGdEHMp67CuN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5e89c45c75323d28a5ea1/m_p_HAfNPGdEHMp67CuN.jpg">größer</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5e88f45c75323d28a5ea0/m_p_gvro4Ry9POJUm0nR.jpg">Seitenansicht</a>]</p><hr><p>Ende 4. Jahrhundert. <a href="https://www.metmuseum.org/art/collection/search/463714">Metropolitan Museum of Art, Fifth Avenue, USA</a>. Glas, Blattgold.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5e68b45c75323d28a5e9c/s_p_uRLyImBPPDsr48G2.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5e68b45c75323d28a5e9c/m_p_uRLyImBPPDsr48G2.jpg">größer</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5e76d45c75323d28a5e9e/m_p_62cHpid14wgeSyqc.jpg">Version 2</a>]</p><hr><p>Mitte 4. Jahrhundert. Die Apostel Petrus und Paulus, Peregrina. <a href="https://www.metmuseum.org/art/collection/search/465922">Metropolitan Museum of Art, Fifth Avenue, USA</a>. 11,5 × 13,3 × 1,2 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5e7d145c75323d28a5e9f/s_p_atDwcEc3h2ZyYLRb.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5e7d145c75323d28a5e9f/m_p_atDwcEc3h2ZyYLRb.jpg">größer</a>]</p><h3>Die Apostel Petrus und Paulus (Rom)</h3><p>4. Jahrhundert. Eine Platte, die eine Kindergrabnische (Loculus) in den Katakomben verschloss. Rom, Vatikanische Museen, Museo Pio Cristiano.</p><img src="https://res.bibleox.com/s/img/image/simple/674f1bc0dba77200011c739a/s_p_uH3btIsNTUn6lHGQ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f1bc0dba77200011c739a/m_p_uH3btIsNTUn6lHGQ.jpg">größer</a>]</p><h3>Die Gottesgebärerin mit dem Christuskind (Rom)</h3><p>3.–4. Jahrhundert. Domitilla-Katakombe.</p><img src="https://res.bibleox.com/s/img/image/simple/66cc2c11dba77200019bc7d5/s_p_rZQc8oqW4YIrUMho.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/66cc2c11dba77200019bc7d5/m_p_rZQc8oqW4YIrUMho.jpg">größer</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686d246b5f47da2505d3ae57/m_p_AZTFv8hTAm4Eo9yp.jpg">Version 2</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686d24885f47da2505d3ae58/s_p_Z1QqJZuraUn8iLSV.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d24885f47da2505d3ae58/m_p_Z1QqJZuraUn8iLSV.jpg">größer</a>]</p><h3>Ein Kreuz mit einem Bild Christi (Byzanz)</h3><p>395–641. <a href="https://collections.louvre.fr/en/ark:/53355/cl010043937">Louvre, Frankreich</a>. 8,5 × 20 × 1,2 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c5886594f46d35a87ec7/s_p_wU3HuTavyFqHCHIc.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c5886594f46d35a87ec7/m_p_wU3HuTavyFqHCHIc.jpg">größer</a>]</p><h3>Eine Ikone (Ägypten)</h3><p>395–641. <a href="https://collections.louvre.fr/en/ark:/53355/cl010049211">Louvre, Frankreich</a>. 24 × 17,5 cm</p><img src="https://res.bibleox.com/s/img/image/simple/68c3bf006594f46d35a87ebf/s_p_m1O6PHgeoR9L2huf.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3bf006594f46d35a87ebf/m_p_m1O6PHgeoR9L2huf.jpg">größer</a>]</p><hr><p><a href="https://collections.louvre.fr/en/ark:/53355/cl010049209">Louvre, Frankreich</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c8966594f46d35a87ec8/s_p_hfH86ZqQDaRWHKRA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c8966594f46d35a87ec8/m_p_hfH86ZqQDaRWHKRA.jpg">größer</a>]</p><h3>Eine Ampulle mit einer Ikone des heiligen Menas (Byzanz)</h3><p>395–641. <a href="https://collections.louvre.fr/en/ark:/53355/cl010042774">Louvre, Frankreich</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c4176594f46d35a87ec3/s_p_RYRsljTrixb3giuP.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c4176594f46d35a87ec3/m_p_RYRsljTrixb3giuP.jpg">größer</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c3c4196594f46d35a87ec4/m_p_20KqaRLqoxUISfqB.jpg">Rückseite</a>]</p><hr><p>395–641. <a href="https://collections.louvre.fr/en/ark:/53355/cl010042778">Louvre, Frankreich</a>. Solche Ampullen gibt es in sehr großer Zahl in verschiedenen Museen. Weitere Beispiele: <a href="https://collections.louvre.fr/en/ark:/53355/cl010042780">1</a>, <a href="https://collections.louvre.fr/en/ark:/53355/cl010042798">2</a>, <a href="https://collections.louvre.fr/en/ark:/53355/cl010042802">3</a>, <a href="https://collections.louvre.fr/en/ark:/53355/cl010043779">4</a>, <a href="https://collections.louvre.fr/en/ark:/53355/cl010076645">5</a>, <a href="https://collections.louvre.fr/en/ark:/53355/cl010051239">6</a>, <a href="https://collections.louvre.fr/en/ark:/53355/cl010263188">7</a>, <a href="https://collections.louvre.fr/en/ark:/53355/cl010280896">8</a>, <a href="https://collections.louvre.fr/en/ark:/53355/cl010044285">9</a>, <a href="https://collections.louvre.fr/en/ark:/53355/cl010280846">10</a>, <a href="https://collections.louvre.fr/en/ark:/53355/cl010280894">11</a>, <a href="https://www.clevelandart.org/art/1999.232">12</a>, <a href="https://www.clevelandart.org/art/1999.233">13</a>, <a href="https://www.clevelandart.org/art/1999.231">14</a>, <a href="https://www.clevelandart.org/art/1999.230">15</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c4c66594f46d35a87ec5/s_p_b5etRE60QJjNF7zQ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c4c66594f46d35a87ec5/m_p_b5etRE60QJjNF7zQ.jpg">größer</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c4cd6594f46d35a87ec6/s_p_vJbng6ICUUefTimC.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c4cd6594f46d35a87ec6/m_p_vJbng6ICUUefTimC.jpg">größer</a>]</p><h3>Eine Bleiampulle mit einem Bild der Gottesgebärerin und Christi (Italien, Bologna)</h3><p>4.–5. Jahrhundert. „Solche Ampullen mit heiligem Öl von den heiligen Stätten brachten Pilger in großer Zahl aus dem Osten mit, nämlich aus Palästina, wohin sich seit Ende des 4. Jahrhunderts und in der ersten Hälfte des fünften in großer Zahl Wallfahrten etablierten“ [27]</p><img src="https://res.bibleox.com/s/img/image/simple/686d3bdc5f47da2505d3ae5f/s_p_gcwh26YTfBvz5FbR.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d3bdc5f47da2505d3ae5f/m_p_gcwh26YTfBvz5FbR.jpg">größer</a>]</p><h2>5. Jahrhundert</h2><h3>Die Gottesgebärerin mit dem Jesuskind, die Märtyrer Felix und Adauctus, die Witwe Commodilla (Rom)</h3><p>5.–6. Jahrhundert. Commodilla-Katakombe. Links im Vordergrund ist die Witwe Commodilla dargestellt, eine reiche Römerin, zu deren Gedenken die Katakombenkirche gebaut wurde.</p><img src="https://res.bibleox.com/s/img/image/simple/674edb84dba77200011c738c/s_p_urBcFMzNnn49NanW.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674edb84dba77200011c738c/m_p_urBcFMzNnn49NanW.jpg">größer</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686bf61f5f47da2505d3ae38/m_p_gOZdkzGPGcL4Vws0.jpg">Version 2</a>]</p><h3>Christus und die Gottesgebärerin (Byzanz)</h3><p>400–500. Material: Gold. 3,7 × 4 × 0,3 cm; Gewicht: 4,04 g. <a href="https://collections.louvre.fr/en/ark:/53355/cl010256498">Louvre, Frankreich</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c403846594f46d35a87efb/s_p_Ahj64DxPe313azhi.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c403846594f46d35a87efb/m_p_Ahj64DxPe313azhi.jpg">größer</a>]</p><h3>Der Märtyrer Laurentius (Ravenna)</h3><p>425. Mausoleum der Galla Placidia[1][2][25]. Im offenen Schrank liegen die 4 Evangelien: Markus, Matthäus, Lukas, Johannes. Der Heilige mit Kreuz und offenem Evangelium geht auf den Rost zu, unter dem ein Feuer brennt.</p><img src="https://res.bibleox.com/s/img/image/simple/674ee461dba77200011c738e/s_p_EPEyZAtXMtLhz0vO.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674ee461dba77200011c738e/m_p_EPEyZAtXMtLhz0vO.jpg">größer</a>]</p><h3>Der Apostel Paulus (Ephesus)</h3><p>Fresko vom Ende des 5. Jahrhunderts in der Paulusgrotte[4].</p><img src="https://res.bibleox.com/s/img/image/simple/674f2a67dba77200011c73a0/s_p_Og6LudyAS5axVwrH.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f2a67dba77200011c73a0/m_p_Og6LudyAS5axVwrH.jpg">größer</a>]</p><h3>Der Apostel Paulus (Neapel)</h3><p>Ende 5. Jahrhundert. Katakomben von San Gennaro, Fresko. Wahrscheinlich ist der Apostel Paulus dargestellt.</p><img src="https://res.bibleox.com/s/img/image/simple/674f2705dba77200011c739d/s_p_XdEMnSngRpC4ver8.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f2705dba77200011c739d/m_p_XdEMnSngRpC4ver8.jpg">größer</a>]</p><h3>Thekla von Ikonion, Märtyrin (Ephesus)</h3><p>Grotte der heiligen Paulus und Thekla. Sie kam durch die Predigt des Apostels Paulus zum Glauben, eine Märtyrin der ersten Jahrhunderte. 2013 wurde die Grotte von islamistischen Kämpfern geschändet[4].</p><img src="https://res.bibleox.com/s/img/image/simple/674f2c2edba77200011c73a1/s_p_tCvOXPpRP5ogjE1Y.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f2c2edba77200011c73a1/m_p_tCvOXPpRP5ogjE1Y.jpg">größer</a>]</p><h3>Der Großmärtyrer Demetrios von Thessaloniki und ein Engel (Thessaloniki, Byzanz)</h3><p>5.–6. Jahrhundert. Basilika des heiligen Demetrios in Thessaloniki. Mosaik im Westteil der Kirche [10]</p><img src="https://res.bibleox.com/s/img/image/simple/686984705f47da2505d3ae11/s_p_bliIzjPrQcGjWmMT.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686984705f47da2505d3ae11/m_p_bliIzjPrQcGjWmMT.jpg">größer</a>]</p><h3>Der Großmärtyrer Demetrios von Thessaloniki und ein Kind (Thessaloniki, Byzanz)</h3><p>5.–6. Jahrhundert. Basilika des heiligen Demetrios in Thessaloniki. Mosaik an der Westwand des Südschiffs [10]</p><img src="https://res.bibleox.com/s/img/image/simple/68697c845f47da2505d3ae10/s_p_T8JYB6OgB0WUM8O6.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68697c845f47da2505d3ae10/m_p_T8JYB6OgB0WUM8O6.jpg">größer</a>]</p><h3>Das Haus eines Senators, Santa Pudenziana (Rom)</h3><p>402–417. [13][14]</p><img src="https://res.bibleox.com/s/img/image/simple/6869938e5f47da2505d3ae1c/s_p_l5Dokt3jzLvx6IxN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6869938e5f47da2505d3ae1c/m_p_l5Dokt3jzLvx6IxN.jpg">größer</a>]</p><h3>Santa Maria Maggiore (Rom)</h3><p>432–440. [15][16]</p><img src="https://res.bibleox.com/s/img/image/simple/6869954e5f47da2505d3ae1d/s_p_0bDTRtbRpWWnfPQR.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6869954e5f47da2505d3ae1d/m_p_0bDTRtbRpWWnfPQR.jpg">größer</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686995555f47da2505d3ae1e/s_p_FLcJtADykEgKNDDd.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686995555f47da2505d3ae1e/m_p_FLcJtADykEgKNDDd.jpg">größer</a>]</p><h3>Christus, die drei Jünglinge, die Weisen (Norditalien)</h3><p>400–450. <a href="https://collections.louvre.fr/en/ark:/53355/cl010256191">Louvre, Frankreich</a>. Silber, 6,3 × 12,3 × 7,1 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c1756594f46d35a87ec1/s_p_WzOTF3me39ISTfnN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c1756594f46d35a87ec1/m_p_WzOTF3me39ISTfnN.jpg">größer</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c1796594f46d35a87ec2/s_p_a0udZW5EPewQCqsl.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c1796594f46d35a87ec2/m_p_a0udZW5EPewQCqsl.jpg">größer</a>]</p><h3>Eine Ikone: Der Apostel Petrus diktiert dem heiligen Markus das Evangelium (Ägypten)</h3><p>440–670. <a href="https://www.metmuseum.org/art/collection/search/477163">Metropolitan Museum of Art, Fifth Avenue, USA</a>. 13,5 × 10 × 0,8 cm. Siehe auch: <a href="https://www.metmuseum.org/art/collection/search/477492">1</a>, <a href="https://www.metmuseum.org/art/collection/search/477487">2</a>, <a href="https://www.metmuseum.org/art/collection/search/477481">3</a>, <a href="https://www.metmuseum.org/art/collection/search/477489">4</a>, <a href="https://www.metmuseum.org/art/collection/search/477491">5</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c1c2f56594f46d35a87e74/s_p_BWhcee0cn10mz7dc.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1c2f56594f46d35a87e74/m_p_BWhcee0cn10mz7dc.jpg">größer</a>]</p><h3>Ein unbekannter Heiliger (Byzanz, Ägypten)</h3><p>5.–6. Jahrhundert. <a href="https://www.metmuseum.org/art/collection/search/329982">Metropolitan Museum of Art, Fifth Avenue, USA</a>. 44 × 32,5 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5eb2d45c75323d28a5ea3/s_p_E5UUO66hSfRBtXUn.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5eb2d45c75323d28a5ea3/m_p_E5UUO66hSfRBtXUn.jpg">größer</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5eb2845c75323d28a5ea2/m_p_ofbMCUTa1winWDg0.jpg">Version 2</a>]</p><h3>Eine Ampulle mit einem Bild des heiligen Menas (koptisches Ägypten)</h3><p>5.–7. Jahrhundert. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/87092?query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=34">Eremitage, Russland</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c0796480b4d285320413/s_p_sW3adkK7lr960dU5.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c0796480b4d285320413/m_p_sW3adkK7lr960dU5.jpg">größer</a>]</p><hr><p>5.–6. Jahrhundert. Eine Ampulle mit einem Bild des heiligen Menas (Ägypten). <a href="https://www.metmuseum.org/art/collection/search/854993">Metropolitan Museum of Art, Fifth Avenue, USA</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5f3f845c75323d28a5eb8/s_p_ePhTgphiYrxHdEaZ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5f3f845c75323d28a5eb8/m_p_ePhTgphiYrxHdEaZ.jpg">größer</a>]</p><hr><p>5.–6. Jahrhundert. Eine Ampulle mit einem Bild des heiligen Menas (Ägypten). <a href="https://www.metmuseum.org/art/collection/search/854994">Metropolitan Museum of Art, Fifth Avenue, USA</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5f40645c75323d28a5eb9/s_p_5HMBehehtBuCUdOm.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5f40645c75323d28a5eb9/m_p_5HMBehehtBuCUdOm.jpg">größer</a>]</p><h3>Ein Ring mit einem Bild Christi (Ägypten, Luxor)</h3><p>5.–7. Jahrhundert. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/111849?page=5&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%B0&amp;index=240">Eremitage, Russland</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c4d46480b4d285320420/s_p_SyuBoqgvHXMA5UIe.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c4d46480b4d285320420/m_p_SyuBoqgvHXMA5UIe.jpg">größer</a>]</p><h2>6. Jahrhundert</h2><h3>Der Herr Jesus Christus (Sinai)</h3><p>6. Jahrhundert. Katharinenkloster, Ägypten [3].</p><img src="https://res.bibleox.com/s/img/image/simple/686fe7935f47da2505d3ae87/s_p_cikLnQnMeZgiaeXg.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686fe7935f47da2505d3ae87/m_p_cikLnQnMeZgiaeXg.jpg">größer</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6872d4935f47da2505d3ae90/m_p_1CbtDgulMkyLj9dK.jpg">Version 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6872d4835f47da2505d3ae8d/m_p_IPypUclQUGcqTIJa.jpg">Version 3</a>]</p><h3>Die Gottesgebärerin mit dem Jesuskind, die heiligen Theodor und Georg (Sinai)</h3><p>6. Jahrhundert. Katharinenkloster. Enkaustische Ikone, Ägypten.</p><img src="https://res.bibleox.com/s/img/image/simple/674ece56dba77200011c7384/s_p_RWNQK8qhzLwXxGkf.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674ece56dba77200011c7384/m_p_RWNQK8qhzLwXxGkf.jpg">größer</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6872d4895f47da2505d3ae8e/m_p_6JgREZVUzpO8lC9E.jpg">Version 2</a>]</p><h3>Der Apostel Petrus (Sinai)</h3><p>6. Jahrhundert. Katharinenkloster. Enkaustische Ikone, Ägypten.</p><img src="https://res.bibleox.com/s/img/image/simple/686fe28f5f47da2505d3ae82/s_p_tWJyRADNEjI9Gt5J.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686fe28f5f47da2505d3ae82/m_p_tWJyRADNEjI9Gt5J.jpg">größer</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686fe73d5f47da2505d3ae86/m_p_ztqtzVnOwMfzjCsd.jpg">Version 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6872d48f5f47da2505d3ae8f/m_p_x4BAyJ0C1GjHQ7Us.jpg">Version 3</a>]</p><h3>Die Gottesgebärerin und das Christuskind (Byzanz)</h3><p>6. Jahrhundert. <a href="https://www.metmuseum.org/art/collection/search/463392">Metropolitan Museum of Art, Fifth Avenue, USA</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5fce645c75323d28a5ec5/s_p_KB8coyb4H50zurQW.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5fce645c75323d28a5ec5/m_p_KB8coyb4H50zurQW.jpg">größer</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5fce945c75323d28a5ec6/m_p_eIaeevwinjFBQAeA.jpg">Version 2</a>]</p><h3>Ein Ring mit einer Ikone der Gottesgebärerin und des Christuskindes (Byzanz)</h3><p>6.–7. Jahrhundert. <a href="https://www.metmuseum.org/art/collection/search/464059">Metropolitan Museum of Art, Fifth Avenue, USA</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5fe7745c75323d28a5ec7/s_p_bcCSRfNkRmmk5jZs.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5fe7745c75323d28a5ec7/m_p_bcCSRfNkRmmk5jZs.jpg">größer</a>]</p><h3>Die heilige Maria</h3><p>611, <a href="https://www.pravenc.ru/text/164537.html">Gerasa</a></p><img src="https://res.bibleox.com/s/img/image/simple/482/s_p_s3flMTpYpn69iMIy.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/482/m_p_s3flMTpYpn69iMIy.jpg">größer</a>]</p><h3>Christus, ein Medaillon (Antiochia)</h3><p>500–625. Material: Silber, Vergoldung. 14,9 × 14,1 × 1,1 cm. <a href="https://collections.louvre.fr/en/ark:/53355/cl010256496">Louvre, Frankreich</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c409da6594f46d35a87f00/s_p_BHIOy3tEZ3ZoMEr5.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c409da6594f46d35a87f00/m_p_BHIOy3tEZ3ZoMEr5.jpg">größer</a>]</p><hr><p>500–625. <a href="https://collections.louvre.fr/en/ark:/53355/cl010256495">Louvre, Frankreich</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c41f626594f46d35a87f05/s_p_bKgaW542SgyD11o9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c41f626594f46d35a87f05/m_p_bKgaW542SgyD11o9.jpg">größer</a>]</p><h3>Ein Wandteppich mit Ikonen: Christus, die Gottesgebärerin, die Erzengel Michael und Gabriel, die Apostel (Ägypten, Byzanz)</h3><p>500. <a href="https://www.clevelandart.org/art/1967.144">Cleveland Museum of Art, USA</a>. Wolle, 178,7 × 110,5 cm.</p><p>Kommentar des Museums:</p><blockquote><p>Aus Wollfäden in mehr als zwanzig Farben gefertigt, war dieser seltene Wandteppich seinerzeit teurer als ein Gemälde. Sein historischer Preis spiegelt wider, wie hoch die Zeitgenossen die meisterhafte Farbmischung der Weber schätzten. An einer Wand aufgehängt, <strong>ermöglichte diese gewebte Ikone den Gläubigen, die Gottesgebärerin und das Christuskind in einer orthodoxen Kirche zu verehren</strong>. Sie sind von Engeln und Aposteln umgeben, deren Namen auf Griechisch beigeschrieben sind. Um geistlich wirksam zu sein, musste eine Ikone (ein heiliges Bild) der festgelegten Bildtradition ihres Motivs so genau wie möglich folgen.</p><p>Die Inschrift auf dem Sturz der architektonischen Rahmung lautet übersetzt aus dem Griechischen „<strong>Heiliger Michael, heilige Maria, heiliger Gabriel</strong>“. Die breite Blattbordüre ist mit Früchten und Blumen geschmückt, unten mit Medaillons mit Büsten der Apostel, deren Namen daneben auf Griechisch stehen und übersetzt lauten: „<strong>Andreas, Matthäus, der Apostel Paulus, Lukas, Jakobus, Philippus, Markus, Thomas, Johannes, Matthias, Petrus und Bartholomäus</strong>“.</p></blockquote><img src="https://res.bibleox.com/s/img/image/simple/68cb9dd5205184ec278d58d7/s_p_jXuLxO8mwNy5DicO.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68cb9dd5205184ec278d58d7/m_p_jXuLxO8mwNy5DicO.jpg">größer</a>]</p><h3>Ein Wandteppich mit Ikonen. Die drei Jünglinge?, ein Christusmonogramm (Ägypten, Byzanz)</h3><p>500er Jahre. <a href="https://www.clevelandart.org/art/1982.73">Cleveland Museum of Art, USA</a>. Wolle, Leinen. 110,5 × 76,8 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68cb9dde205184ec278d58d8/s_p_w5vxLEtZSz6mW36r.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68cb9dde205184ec278d58d8/m_p_w5vxLEtZSz6mW36r.jpg">größer</a>]</p><h3>Ein Wandteppich mit Ikonen. Die Gottesgebärerin, die Weisen, der Prophet Jona (Ägypten, Byzanz)</h3><p>500–550. <a href="https://www.clevelandart.org/art/1951.400">Cleveland Museum of Art, USA</a>. Leinen. 99,7 × 104,8 cm.</p><p>Kommentar des Museums:</p><blockquote><p>… Links im oberen Register ist <strong>die Jungfrau Maria mit dem Christuskind</strong> auf einem Schemel mit kreuzförmigen Beinen dargestellt. Wie die koptische Inschrift angibt, <strong>nähern sich von rechts die drei Könige mit Gaben</strong>. Links im mittleren Register ist wahrscheinlich <strong>die Taufe Christi</strong> dargestellt, während drei weitere, durch Säulen getrennte Gestalten offenbar das neutestamentliche Wunder zeigen, in dem Christus eine große Menge mit nur fünf Broten und zwei Fischen speiste. Im unteren Register ist noch <strong>die alttestamentliche Szene des Propheten Jona, den der Wal verschlingt</strong>, zu erkennen.</p><p>Griechische Inschriften bezeichnen verschiedene Szenen aus dem Alten und Neuen Testament. Über dem ersten der Weisen im oberen Register sind zwei Buchstaben <strong>„XP“</strong> des griechischen Wortes für Gold zu erkennen (<em>χρυσός, chrysós</em>). Links im mittleren Register sind zwei Gestalten: Die erste ist fast völlig zerstört, die zweite durch die Inschrift <strong>„EIΩANNHC“ (Johannes)</strong> bezeichnet. Im unteren Register ist Jona dargestellt, ans Ufer ausgespien, mit einem großen Fisch neben sich und der Inschrift <strong>„EIΩNAC“ (Jona)</strong>. Mose, fast ganz verloren, ist nur noch an seiner Inschrift <strong>„MWCHC“ (Mose)</strong> zu erkennen.</p></blockquote><img src="https://res.bibleox.com/s/img/image/simple/68cb9e0d205184ec278d58d9/s_p_WiTqygXUYCZZY7TF.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68cb9e0d205184ec278d58d9/m_p_WiTqygXUYCZZY7TF.jpg">größer</a>]</p><h3>Eucharistische Kelche und Weihrauchfässer mit Ikonen (Byzanz, Syrien, Attarouthi)</h3><p>500–650. <a href="https://www.metmuseum.org/art/collection/search/474390">Metropolitan Museum of Art, Fifth Avenue, USA</a>. Silber, Vergoldung. Auf den Kelchen Ikonen des Herrn und der Heiligen sowie Inschriften, wer sie wem gestiftet hat.</p><p>Diese kunstvoll gefertigten liturgischen Geräte, Kelche, Weihrauchfässer, ein Sieb und ein Bild der Taube des Heiligen Geistes, gehörten einer christlichen Kirche in der reichen Handelsstadt Attarouthi in Syrien, damals eines der reichsten Länder des Byzantinischen Reiches. Kelche, Weihrauchfässer und Sieb wurden in der Göttlichen Liturgie, der Eucharistie, gebraucht, dem Mysterium, in dem die Christen zum Gedächtnis des letzten Abendmahls und des Todes Christi den geweihten Wein und das Brot empfangen.</p><p>Nach ihren griechischen Inschriften mit einigen orthographischen Varianten wurden viele dieser Gegenstände von Einwohnern der Hauptkirche der Stadt gestiftet, die dem heiligen Stephanus geweiht war, und einer kleineren Kirche, die dem heiligen Johannes geweiht war (wahrscheinlich Johannes dem Vorläufer [dem Täufer]).</p><p>Zu Beginn des 7. Jahrhunderts fiel Syrien zuerst an die sassanidischen Perser und dann an die Heere des Islam. Wahrscheinlich wurden diese Kunstwerke eilig in einem schützenden Behälter vergraben, als das byzantinische Heer vor den Angreifern aus der Region zurückwich.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5db2045c75323d28a5e9a/s_p_kx70rC7wWJQtkfdG.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5db2045c75323d28a5e9a/m_p_kx70rC7wWJQtkfdG.jpg">größer</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5edf045c75323d28a5ea5/m_p_Eru1rmuua6UWqjTz.jpg">Version 2</a>]</p><hr><p>Johannes der Vorläufer mit langem Haar, die Gottesgebärerin in Orantenhaltung (mit erhobenen Händen), ein Heiliger in Orantenhaltung, ein Soldatenheiliger mit Stab und Schild, der junge Christus mit Kreuznimbus und ein weiterer Soldatenheiliger in Rüstung, der einen Drachen tötet (der heilige Georg?), unter Arkaden. <a href="https://www.metmuseum.org/art/collection/search/466137">Metropolitan Museum of Art, Fifth Avenue, USA</a>. 21,3 × 16 cm.</p><p>Griechische Inschrift: „<strong>Zu ihrem Heil hat Eudoxia [dies] dem heiligen Stephanus des Dorfes Attar[outhi] als Gabe dargebracht</strong>“.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5efa445c75323d28a5eaa/s_p_l5pPSsTDZHSQuvNU.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5efa445c75323d28a5eaa/m_p_l5pPSsTDZHSQuvNU.jpg">größer</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f01f45c75323d28a5eab/m_p_456sbKEe3ANd9ZWP.jpg">Version 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f02245c75323d28a5eac/m_p_fkJIydq7uEfZbIUt.jpg">Version 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f02445c75323d28a5ead/m_p_s25q6Lu5HItPjqDs.jpg">Version 4</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f02745c75323d28a5eae/m_p_QJsAgl2zRfYmpNDL.jpg">Version 5</a>]</p><hr><p>Ein eucharistischer Kelch mit einer Ikone des heiligen Johannes des Vorläufers, eines heiligen Diakons (wahrscheinlich Stephanus), heiliger Bischöfe und Kreuzen. <a href="https://www.metmuseum.org/art/collection/search/466130">Metropolitan Museum of Art, Fifth Avenue, USA</a>. 20,5 × 15,1 cm, 369 g, 1100 ml</p><p>Griechische Inschrift: „<strong>Dem heiligen Johannes des Dorfes Attarouthi</strong>“.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5ec4545c75323d28a5ea4/s_p_KWMPzINWo4ktBKQ7.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5ec4545c75323d28a5ea4/m_p_KWMPzINWo4ktBKQ7.jpg">größer</a>]</p><hr><p>Ein eucharistischer Kelch mit einer Ikone Christi, der Gottesgebärerin, Johannes des Vorläufers und Georgs des Siegesträgers. <a href="https://www.metmuseum.org/art/collection/search/466129">Metropolitan Museum of Art, Fifth Avenue, USA</a>. 24,3 × 16,8 cm.</p><p>Griechische Inschrift: „<strong>Heiliger Stephanus des Dorfes Attarouthi</strong>“.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5ee1345c75323d28a5ea6/s_p_9bHxlNSj26b5EhMw.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5ee1345c75323d28a5ea6/m_p_9bHxlNSj26b5EhMw.jpg">größer</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5ee3c45c75323d28a5ea7/m_p_8XweLe1b1pD7GWHb.jpg">Version 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5ee4045c75323d28a5ea8/m_p_faMKsJUImltU9s6v.jpg">Version 3</a>]</p><hr><p>Ein eucharistischer Kelch mit einem Bild des jungen Christus mit Kreuznimbus, eines heiligen Diakons mit Weihrauchfass (wahrscheinlich des heiligen Stephanus), der Jungfrau Maria im Gebet und eines jungen Heiligen mit Stab. Größe: 23,9 × 17 cm, 356 g. <a href="https://www.metmuseum.org/art/collection/search/466141">Metropolitan Museum of Art, Fifth Avenue, USA.</a></p><p>Griechische Inschrift: „<strong>Zur Erfüllung eines Gelübdes und zum Heil dessen, dessen Name der Herr kennt</strong>“.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5fa7a45c75323d28a5ebe/s_p_7AzZiy4FebkdJC4e.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5fa7a45c75323d28a5ebe/m_p_7AzZiy4FebkdJC4e.jpg">größer</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5fa8345c75323d28a5ebf/m_p_LQnRTCSFvxz7O7ui.jpg">Version 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5fa8645c75323d28a5ec0/m_p_KvY9o90gFdzJeK9N.jpg">Version 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5fa8945c75323d28a5ec1/m_p_BUzuFJ6F1fLtMppI.jpg">Version 4</a>]</p><hr><p>Ein Weihrauchfass mit einem Bild des jungen Christus mit Kreuznimbus, des heiligen Johannes des Vorläufers, der Jungfrau Maria im Gebet, eines heiligen Diakons (wahrscheinlich des heiligen Stephanus) und Kreuzen. Silber und vergoldetes Silber mit Kupferfutter. Größe: 41,5 × 13,2 × 12,6 cm. <a href="https://www.metmuseum.org/art/collection/search/466132">Metropolitan Museum of Art, Fifth Avenue, USA</a>.</p><p>Griechische Inschrift: „<strong>Zur Ruhe der Seele[n] von Erta und Stephanus, den Kindern des Kyriakos</strong>“</p><img src="https://res.bibleox.com/s/img/image/simple/68b5f15545c75323d28a5eaf/s_p_OJ2d0ec3h6BtKZQM.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5f15545c75323d28a5eaf/m_p_OJ2d0ec3h6BtKZQM.jpg">größer</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f15845c75323d28a5eb0/m_p_MLajjsEoJyZ7xPC7.jpg">Version 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f15c45c75323d28a5eb1/m_p_5k22minZ9Q7EruSj.jpg">Version 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f15e45c75323d28a5eb2/m_p_3cDRqzOwNAJr7A0S.jpg">Version 4</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f16145c75323d28a5eb3/m_p_8vKQQvQJKE8Mbtoc.jpg">Version 5</a>]</p><hr><p>Ein Weihrauchfass mit einem Bild des jungen Christus mit Kreuznimbus, zweier Erzengel und Kreuzen. 8,2 × 13,2 cm. <a href="https://www.metmuseum.org/art/collection/search/466131">Metropolitan Museum of Art, Fifth Avenue, USA</a>.</p><p>Griechische Inschrift: „<strong>Dem heiligen Johannes des Dorfes Attarouthi</strong>“.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5f27545c75323d28a5eb4/s_p_brjJXh3ZIrplms0E.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5f27545c75323d28a5eb4/m_p_brjJXh3ZIrplms0E.jpg">größer</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f28545c75323d28a5eb5/m_p_oWtx1CexyxQIAxRK.jpg">Version 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f28845c75323d28a5eb6/m_p_zqvxcBdCxjLqltWh.jpg">Version 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f28c45c75323d28a5eb7/m_p_fIVExsqDAbrZLhWW.jpg">Version 4</a>]</p><h3>Eucharistische Kelche mit Bildern Christi und der Heiligen, ein Diskos mit Kreuz (Syrien, Byzanz)</h3><p>500–700. Cleveland Museum of Art, USA: <a href="https://www.clevelandart.org/art/1950.378">1</a>, <a href="https://www.clevelandart.org/art/1950.379">2</a>, <a href="https://www.clevelandart.org/art/1950.380">3</a>, <a href="https://www.clevelandart.org/art/1950.381">4</a>.</p><p>Diese vier silbernen liturgischen Gefäße, ein Diskos und drei Kelche (Inv. 1950.378–81), bilden den heute so genannten „Schatz von Beth Misona“, benannt nach dem Dorf in Nordsyrien, für das sie angefertigt wurden.</p><p>Obwohl Ort und Umstände des Fundes unbekannt sind, mussten die Bewohner von Beth Misona wie andere christliche Gemeinden in Syrien und Palästina das Kirchensilber wahrscheinlich vergraben, um es vor den Persern oder Arabern zu verbergen, die in der ersten Hälfte des 7. Jahrhunderts ihr Land eroberten.</p><p>Der Diskos, auf dem während der Liturgie die eucharistischen Teilchen lagen, ist mit einem gravierten lateinischen Kreuz geschmückt, umgeben von einer Stifterinschrift. Sie nennt den Stifter des Diskos, Domnos, und seinen ursprünglichen Ort, die Kirche des heiligen Sergios in Beth Misona.</p><p>Die Kelche haben weite Schalen, geschmückt mit Brustbildern Christi, der Gottesgebärerin und der Apostel Petrus und Paulus. Einer der Kelche trägt eine Stifterinschrift mit dem Namen des Stifters, Kyriakos, Sohn des Domnos, und des Priesters der Kirche, der diese fromme Gabe empfing, Zenon.</p><p>Griechische Inschrift: „<strong>+ Der Priester KYRIAKOS, Sohn des DOMNOS, (brachte diesen Kelch) dem heiligen Sergios zur Zeit des Priesters Zenon dar</strong>“</p><img src="https://res.bibleox.com/s/img/image/simple/68caa03c205184ec278d5880/s_p_SB8idWRkPX7keKkU.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68caa03c205184ec278d5880/m_p_SB8idWRkPX7keKkU.jpg">Christus</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68caa026205184ec278d587d/m_p_sYIDwGwUI9iMAzzD.jpg">Gottesgebärerin</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68caa029205184ec278d587e/m_p_xYnPNjrcxGm5mJgl.jpg">Apostel</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68caa02c205184ec278d587f/m_p_kH9idfsikXyvAVvy.jpg">Apostel</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68caa0d4205184ec278d5881/m_p_vWERSBBMAoytSNnX.jpg">Ansicht von oben</a>]</p><hr><img src="https://res.bibleox.com/s/img/image/simple/68ca9cd5205184ec278d5874/s_p_tH0J7uqAriM7uaeK.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68ca9cd5205184ec278d5874/m_p_tH0J7uqAriM7uaeK.jpg">Christus</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68ca9d13205184ec278d5878/m_p_tYRbn15h6MPNUilS.jpg">Gottesgebärerin</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68ca9ce8205184ec278d5875/m_p_FKfoi68UXlWCS5ky.jpg">Apostel</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68ca9ceb205184ec278d5876/m_p_Zp9CJ61HnBcr8Csr.jpg">Apostel</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68ca9cee205184ec278d5877/m_p_w2JDvDj5c4pMVcfk.jpg">Ansicht von oben</a>]</p><hr><img src="https://res.bibleox.com/s/img/image/simple/68ca9e94205184ec278d5879/s_p_27LzQUQDD3A7nI9X.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68ca9e94205184ec278d5879/m_p_27LzQUQDD3A7nI9X.jpg">Christus</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68ca9e98205184ec278d587a/m_p_R47Eqr4GrHijUSIb.jpg">Gottesgebärerin</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68ca9e9b205184ec278d587b/m_p_31NEBZQIYBEqOut0.jpg">Apostel</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68ca9e9e205184ec278d587c/m_p_QxtJHMZORGGwFxYQ.jpg">Apostel</a>]</p><hr><p>Um 500. Diskos. <a href="https://www.clevelandart.org/art/1950.381">Cleveland Museum of Art, USA</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68ca964d205184ec278d5873/s_p_wNDEaPHmGHiuWeZy.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68ca964d205184ec278d5873/m_p_wNDEaPHmGHiuWeZy.jpg">größer</a>]</p><h3>Ein Weihrauchfass. Taufe und Kreuzigung des Herrn Jesus Christus (Byzanz)</h3><p>500–899. Größe: 13,4 × 9 cm. <a href="https://collections.louvre.fr/en/ark:/53355/cl010042067">Louvre, Frankreich</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c4068e6594f46d35a87efe/s_p_3kaCIWMTmQfT4NFG.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c4068e6594f46d35a87efe/m_p_3kaCIWMTmQfT4NFG.jpg">größer</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/68c4061f6594f46d35a87efc/s_p_XNlsrfQ2MOphupt9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c4061f6594f46d35a87efc/m_p_XNlsrfQ2MOphupt9.jpg">größer</a>]</p><h3>Eine Vase. Christus, die Gottesgebärerin, Johannes der Täufer, Apostel, Engel (Konstantinopel)</h3><img src="https://res.bibleox.com/s/img/image/simple/68c420e46594f46d35a87f06/s_p_iADN1OW5uYg5Wovc.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c420e46594f46d35a87f06/m_p_iADN1OW5uYg5Wovc.jpg">größer</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c420e76594f46d35a87f07/m_p_oAs6ecjPj32iGMce.jpg">Rückseite</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c421216594f46d35a87f0f/m_p_x6q5apwWB0DZirK2.jpg">Christus</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c420fc6594f46d35a87f0b/m_p_sL17qrWgxkRCNRBb.jpg">Gottesgebärerin</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c420ea6594f46d35a87f08/m_p_Cb0UJi1oxoKCQaXw.jpg">Johannes der Täufer</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c421016594f46d35a87f0c/m_p_a9Y1fyPNxcQ4oNbq.jpg">Engel</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c420f66594f46d35a87f0a/m_p_nAqhqDbP5x8fRAnj.jpg">Engel</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c420ef6594f46d35a87f09/m_p_F9R3iyZ8go0PxARb.jpg">Apostel</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c4210a6594f46d35a87f0e/m_p_97cyzUvq95UJZOrR.jpg">Apostel</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c421056594f46d35a87f0d/m_p_WfK6SdjAqAOW9fDK.jpg">Apostel</a>]</p><h3>Ein Brustkreuz mit einer Ikone (Byzanz)</h3><p>6. Jahrhundert.<strong> </strong>Gold, Paste, Bergkristall, Glas; Prägung, Granulation. Kettenlänge: 33 cm; Kreuz: 4,9 × 3,8 cm. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/227027?page=46&amp;query=%D0%BA%D1%80%D0%B5%D1%81%D1%82&amp;sort=112&amp;index=2288">Eremitage, Russland</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c11e3c6594f46d35a87e2c/s_p_9GZmzTSaUVuXXaX1.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c11e3c6594f46d35a87e2c/m_p_9GZmzTSaUVuXXaX1.jpg">größer</a>]</p><h3>Ein Anhänger. Die Kreuzigung Christi (Ägypten)</h3><p>500–700. Größe: 3,3 × 1,9 cm. <a href="https://collections.louvre.fr/en/ark:/53355/cl010102800">Louvre, Frankreich</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c41c4e6594f46d35a87f03/s_p_tiaBwT9vqOXIlsIw.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c41c4e6594f46d35a87f03/m_p_tiaBwT9vqOXIlsIw.jpg">größer</a>]</p><h3>Eine Ikone zweier Heiliger (Byzanz)</h3><p>6. Jahrhundert; 25,5 × 22 × 1,3 cm. Vielleicht die Evangelisten Matthäus und Johannes. <a href="https://www.metmuseum.org/art/collection/search/468198">Metropolitan Museum of Art, Fifth Avenue, USA</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5fc1545c75323d28a5ec3/s_p_a2FJmSgsGJRdELBq.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5fc1545c75323d28a5ec3/m_p_a2FJmSgsGJRdELBq.jpg">größer</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5fc1945c75323d28a5ec4/m_p_pcvRiRfRgBcuHJEA.jpg">Version 2</a>]</p><h3>Ikonen der Apostel Petrus und Paulus (Antiochia)</h3><p>550–600. Der Apostel Petrus. <a href="https://www.metmuseum.org/art/collection/search/468348">Metropolitan Museum of Art, Fifth Avenue, USA</a>. Silber. 38,1 × 55,9 × 2,2 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68c1bfd36594f46d35a87e6f/s_p_WguE3h0pnnzXQXwt.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1bfd36594f46d35a87e6f/m_p_WguE3h0pnnzXQXwt.jpg">größer</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c1bfd56594f46d35a87e70/m_p_83EvKNt1mFSPspQw.jpg">noch größer</a>]</p><p>550–600. Der Apostel Paulus. <a href="https://www.metmuseum.org/art/collection/search/468347">Metropolitan Museum of Art, Fifth Avenue, USA</a>. Silber. 38,1 × 55,9 × 2,2 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68c1bfda6594f46d35a87e71/s_p_5Y11faCyEzohnydQ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1bfda6594f46d35a87e71/m_p_5Y11faCyEzohnydQ.jpg">größer</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c1bfdd6594f46d35a87e72/m_p_jGCYAnYdrt4tlXhd.jpg">noch größer</a>]</p><h3>Eine Ikone (Syrien?, Byzanz)</h3><p>500er Jahre. <a href="https://www.clevelandart.org/art/1941.57">Cleveland Museum of Art, USA</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68caa8cd205184ec278d5883/s_p_qr7HPRgCtcCRwsvb.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68caa8cd205184ec278d5883/m_p_qr7HPRgCtcCRwsvb.jpg">größer</a>]</p><h3>Das Bild eines Soldatenheiligen (koptisches Ägypten)</h3><p>6.–7. Jahrhundert. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/180444?page=6&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=253">Eremitage, Russland</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c3c06480b4d28532041c/s_p_Rnquar8nZacdzqcP.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c3c06480b4d28532041c/m_p_Rnquar8nZacdzqcP.jpg">größer</a>]</p><h3>Eine Ampulle mit einer Ikone des Apostels Paulus (?) und der heiligen Thekla (Ägypten)</h3><p>500–700. <a href="https://collections.louvre.fr/en/ark:/53355/cl010280955">Louvre, Frankreich</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c4390d6594f46d35a87f15/s_p_Zxs1yv3Jg8oKfFHW.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c4390d6594f46d35a87f15/m_p_Zxs1yv3Jg8oKfFHW.jpg">größer</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/68c4390a6594f46d35a87f14/s_p_CPdXMrLBUE0satoH.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c4390a6594f46d35a87f14/m_p_CPdXMrLBUE0satoH.jpg">größer</a>]</p><h3>Eine Ampulle mit einer Ikone des Apostels Andreas (Smyrna)</h3><p>500–600. <a href="https://collections.louvre.fr/en/ark:/53355/cl010281050">Louvre, Frankreich</a>. 7 × 5 × 2,8 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68c437966594f46d35a87f13/s_p_dCGVNUwg3KWvs9zz.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c437966594f46d35a87f13/m_p_dCGVNUwg3KWvs9zz.jpg">größer</a>]</p><h3>Ampullen mit einer Ikone des heiligen Menas</h3><p>610–650. Eine Ampulle mit einem Bild des heiligen Menas (Ägypten). <a href="https://www.metmuseum.org/art/collection/search/475416">Metropolitan Museum of Art, Fifth Avenue, USA</a>. 8,5 × 6,9 × 1,8 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68c1c1396594f46d35a87e73/s_p_KIdJIYWMysre63rP.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1c1396594f46d35a87e73/m_p_KIdJIYWMysre63rP.jpg">größer</a>]</p><hr><p>500–750. <a href="https://collections.louvre.fr/en/ark:/53355/cl010044285">Louvre, Frankreich</a>. 13 × 10,6 × 3,4 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68c3bc556594f46d35a87ebd/s_p_iHBRxhobWKvQb2Dx.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3bc556594f46d35a87ebd/m_p_iHBRxhobWKvQb2Dx.jpg">größer</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/68c3bc5c6594f46d35a87ebe/s_p_fQ8Ps5eHBD1myJaS.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3bc5c6594f46d35a87ebe/m_p_fQ8Ps5eHBD1myJaS.jpg">größer</a>]</p><h3>Christus (Ravenna)</h3><p>Kirche Sant’Apollinare in Classe, Ravenna, Italien.</p><img src="https://res.bibleox.com/s/img/image/simple/675005d5dba77200011c73ad/s_p_rjjDEzNckea3oHk2.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/675005d5dba77200011c73ad/m_p_rjjDEzNckea3oHk2.jpg">größer</a>]</p><h3>Christus und die Apostel (Ravenna)</h3><p>Mosaik des Presbyteriums. Kirche San Vitale, Ravenna, Italien.</p><img src="https://res.bibleox.com/s/img/image/simple/675005dadba77200011c73ae/s_p_Nac2nrVo791COrcO.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/675005dadba77200011c73ae/m_p_Nac2nrVo791COrcO.jpg">größer</a>]</p><h3>Christus, Engel und Vitalis (Ravenna)</h3><p>6. Jahrhundert. Basilika des heiligen Vitalis von Mailand, Ravenna.</p><img src="https://res.bibleox.com/s/img/image/simple/674f0ab3dba77200011c738f/s_p_AsShtty0gMBFOX5X.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f0ab3dba77200011c738f/m_p_AsShtty0gMBFOX5X.jpg">größer</a>]</p><h3>Der rechtgläubige Kaiser Justinian (Ravenna)</h3><p>6. Jahrhundert. Basilika des heiligen Vitalis von Mailand, Ravenna.</p><img src="https://res.bibleox.com/s/img/image/simple/674f0ab8dba77200011c7390/s_p_MsUwTeWDMk0uEVPq.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f0ab8dba77200011c7390/m_p_MsUwTeWDMk0uEVPq.jpg">größer</a>]</p><h3>Die rechtgläubige Kaiserin Theodora (Ravenna)</h3><p>6. Jahrhundert. Basilika des heiligen Vitalis von Mailand, Ravenna.</p><img src="https://res.bibleox.com/s/img/image/simple/674f0ac0dba77200011c7391/s_p_6g0s1g1btiJBEXSR.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f0ac0dba77200011c7391/m_p_6g0s1g1btiJBEXSR.jpg">größer</a>]</p><h3>Der Urvater Abraham (Ravenna)</h3><p>6. Jahrhundert. Basilika des heiligen Vitalis von Mailand, Ravenna.</p><img src="https://res.bibleox.com/s/img/image/simple/674f0ad6dba77200011c7393/s_p_zgb5TLR1yafutIu4.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f0ad6dba77200011c7393/m_p_zgb5TLR1yafutIu4.jpg">größer</a>]</p><h3>Abel und Melchisedek (Ravenna)</h3><p>6. Jahrhundert. Basilika des heiligen Vitalis von Mailand, Ravenna.</p><img src="https://res.bibleox.com/s/img/image/simple/674f0adbdba77200011c7394/s_p_PiL9TaItwhR28eXN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f0adbdba77200011c7394/m_p_PiL9TaItwhR28eXN.jpg">größer</a>]</p><h3>Marcellinus, Pollio, Petrus, Heilige (Rom)</h3><p>6. Jahrhundert. Pontianus-Katakombe. Fresko.</p><img src="https://res.bibleox.com/s/img/image/simple/66cc2c4adba77200019bc7d9/s_p_th5E9srmqGjUT72T.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/66cc2c4adba77200019bc7d9/m_p_th5E9srmqGjUT72T.jpg">größer</a>]</p><h3>Christus, auf den Wolken kommend, die Apostel und die heiligen Kosmas und Damian (Rom)</h3><p>6. Jahrhundert (530). Basilika der heiligen Kosmas und Damian. [19][20]</p><img src="https://res.bibleox.com/s/img/image/simple/686aa5b35f47da2505d3ae28/s_p_V2YyLyiR7wCHgIfW.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa5b35f47da2505d3ae28/m_p_V2YyLyiR7wCHgIfW.jpg">größer</a>]</p><p>Der Apostel Petrus und der heilige Kosmas (dahinter der heilige Theodor)</p><img src="https://res.bibleox.com/s/img/image/simple/686aa5d25f47da2505d3ae29/s_p_s66jgQ3tkVAmQEZE.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa5d25f47da2505d3ae29/m_p_s66jgQ3tkVAmQEZE.jpg">größer</a>]</p><p>Der Apostel Paulus und der heilige Damian (dahinter Papst Felix)</p><img src="https://res.bibleox.com/s/img/image/simple/686aa7505f47da2505d3ae2c/s_p_WA1eP9P7BNe0aPQ6.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa7505f47da2505d3ae2c/m_p_WA1eP9P7BNe0aPQ6.jpg">größer</a>]</p><p>Ein heiliger Engel</p><img src="https://res.bibleox.com/s/img/image/simple/686aa61c5f47da2505d3ae2a/s_p_MD4QowA5HKQRhFFG.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa61c5f47da2505d3ae2a/m_p_MD4QowA5HKQRhFFG.jpg">größer</a>]</p><h3>Christus und die Apostel (Rom)</h3><p>6. Jahrhundert (578–590). Basilika des heiligen Laurentius vor den Mauern (San Lorenzo fuori le Mura) [21][22]</p><p>Neben dem Apostel Paulus die heiligen Stephanus und Hippolyt. Neben dem Apostel Petrus der heilige Laurentius.</p><img src="https://res.bibleox.com/s/img/image/simple/686aabc85f47da2505d3ae2e/s_p_xa4IU82mZb80Uija.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aabc85f47da2505d3ae2e/m_p_xa4IU82mZb80Uija.jpg">größer</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686aab945f47da2505d3ae2d/s_p_21M69l0ODfpN75oh.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aab945f47da2505d3ae2d/m_p_21M69l0ODfpN75oh.jpg">größer</a>]</p><h3>Die Apostel Petrus und Paulus (Franken)</h3><p>6.–8. Jahrhundert. <a href="https://www.metmuseum.org/art/collection/search/464497">Metropolitan Museum of Art, Fifth Avenue, USA</a> (auch <a href="https://www.metmuseum.org/art/collection/search/464496">hier</a>). Elfenbein. 29,2 × 11,4 × 0,5 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5ff8145c75323d28a5ec8/s_p_WhZZPyHo1I7oF79K.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5ff8145c75323d28a5ec8/m_p_WhZZPyHo1I7oF79K.jpg">größer</a>]</p><h3>Heilige (Byzanz, Ägypten)</h3><p>6.–7. Jahrhundert. <a href="https://www.metmuseum.org/art/collection/search/854019">Metropolitan Museum of Art, Fifth Avenue, USA</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68b6007445c75323d28a5ec9/s_p_DNQuRcpcjfkINQ1r.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b6007445c75323d28a5ec9/m_p_DNQuRcpcjfkINQ1r.jpg">größer</a>]</p><h3>Der heilige Phokas (Byzanz, Chersones)</h3><p>6. Jahrhundert. Ein Stempel zur Herstellung von Eulogien mit einem Relief des heiligen <a href="https://azbyka.ru/days/sv-foka-sinopskij">Phokas von Sinope</a>, der in einem Boot steht. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/373084?page=2&amp;fundcoll=1420520446&amp;index=75">Eremitage, Russland</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863bee26480b4d285320410/s_p_s0nPEGgpeMtakrof.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863bee26480b4d285320410/m_p_s0nPEGgpeMtakrof.jpg">größer</a>]</p><h3>Eine Ampulle mit zwei Heiligenbildern (Kleinasien, Ephesus)</h3><p>6. Jahrhundert. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/228313?page=44&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=2166">Eremitage, Russland</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c0e76480b4d285320414/s_p_KnTGMdyOhsmTAD0S.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c0e76480b4d285320414/m_p_KnTGMdyOhsmTAD0S.jpg">größer</a>]</p><h3>Eine Ampulle mit Bildern eines Evangelisten und eines Heiligen: Johannes der Theologe und Prochoros (Ephesus)</h3><p>6. Jahrhundert. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/228314?page=33&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=1646">Eremitage, Russland</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c1726480b4d285320415/s_p_oBnXQZmCz1EntIFw.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c1726480b4d285320415/m_p_oBnXQZmCz1EntIFw.jpg">größer</a>]</p><h3>Ein Molybdobull (Bleisiegel) mit einem Bild der heiligen Petrus und Paulus und lateinischer Inschrift (Byzanz)</h3><p>6.–7. Jahrhundert. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/131338?page=33&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=1639">Eremitage, Russland</a>. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/161973?page=33&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=1640">Ein weiteres Exponat</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c19d6480b4d285320416/s_p_JKBi7CXiDOutHIFn.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c19d6480b4d285320416/m_p_JKBi7CXiDOutHIFn.jpg">größer</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6863c22c6480b4d285320417/s_p_FmbNOmLfDrj3qYOz.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c22c6480b4d285320417/m_p_FmbNOmLfDrj3qYOz.jpg">größer</a>]</p><h3>Ein Molybdobull mit einem Bild Christi (Byzanz)</h3><p>6.–7. Jahrhundert. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/117792?page=6&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%B0&amp;index=269">Eremitage, Russland</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c4a86480b4d28532041f/s_p_Uy0EgcXKfuHnv9bX.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c4a86480b4d28532041f/m_p_Uy0EgcXKfuHnv9bX.jpg">größer</a>]</p><h3>Ein Molybdobull mit einem Bild Christi und einem Monogramm (Byzanz)</h3><p>6.–7. Jahrhundert. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/117804?page=3&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%B0&amp;index=143">Eremitage, Russland</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c5a16480b4d285320422/s_p_JNdWhUPj9cA9Dvoq.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c5a16480b4d285320422/m_p_JNdWhUPj9cA9Dvoq.jpg">größer</a>]</p><h2>7. Jahrhundert</h2><h3>Eine Ikone Christi auf einem Ehering (Byzanz)</h3><p>600–700. Griechische Inschriften auf dem Ring: <strong>ΟΜΟΝΟΙΑ</strong>, „Eintracht“; <strong>ΕΙΡΙΝΗΝ ΤΗΝ ΕΜΙΝ ΔΙΔΟΜ</strong>, „meinen Frieden gebe ich euch“ (<a href="https://bibleox.com/de/ge-sch/in/14/#L27">Joh 14:27</a>). <a href="https://collections.louvre.fr/en/ark:/53355/cl010102797">Louvre, Frankreich</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c402726594f46d35a87ef8/s_p_6nMwdRXMjOnhQWfu.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c402726594f46d35a87ef8/m_p_6nMwdRXMjOnhQWfu.jpg">größer</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c4027c6594f46d35a87ef9/m_p_pNTvaGVW4AmLG2BK.jpg">Version 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c4027e6594f46d35a87efa/m_p_mvU9wZQKEIl0lFZY.jpg">Version 3</a>]</p><h3>Eine Ampulle mit einer Ikone. Christus, Kreuzigung und Himmelfahrt (Palästina, Byzanz)</h3><p>Anfang der 600er Jahre. <a href="https://www.clevelandart.org/art/1999.46">Cleveland Museum of Art, USA</a>. Zinn-Blei-Legierung mit Lederteilen.</p><img src="https://res.bibleox.com/s/img/image/simple/68caa8cf205184ec278d5884/s_p_QfQLEBTpKbF2IfJo.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68caa8cf205184ec278d5884/m_p_QfQLEBTpKbF2IfJo.jpg">größer</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68caaaaf205184ec278d5887/m_p_YFRVXxytSNharyj8.jpg">Version 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68caaab2205184ec278d5888/m_p_GguW2EcCVatptKzX.jpg">Version 3</a>]</p><h3>Die Gottesgebärerin und der Großmärtyrer Theodor Stratelates (Thessaloniki, Byzanz)</h3><p>7.–10. Jahrhundert (?). Basilika des heiligen Demetrios in Thessaloniki. Mosaik an der Südseite des Nordpfeilers.</p><img src="https://res.bibleox.com/s/img/image/simple/686985345f47da2505d3ae12/s_p_HWoRkey7yaGM1D4s.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686985345f47da2505d3ae12/m_p_HWoRkey7yaGM1D4s.jpg">größer</a>]</p><h3>Der Großmärtyrer Demetrios und die Stifter: ein Erzbischof und ein Präfekt (Thessaloniki, Byzanz)</h3><p>7. Jahrhundert. Basilika des heiligen Demetrios in Thessaloniki. Mosaik.</p><img src="https://res.bibleox.com/s/img/image/simple/686986dc5f47da2505d3ae13/s_p_ZMXi7hFVOfpu7jbC.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686986dc5f47da2505d3ae13/m_p_ZMXi7hFVOfpu7jbC.jpg">größer</a>]</p><h3>Der heilige Georg und Kinder (Thessaloniki, Byzanz)</h3><p>7. Jahrhundert. Basilika des heiligen Demetrios in Thessaloniki. Das Mosaik befindet sich im Westteil des Altarraums.</p><img src="https://res.bibleox.com/s/img/image/simple/686987645f47da2505d3ae14/s_p_boH6uu2omR2Gjxxx.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686987645f47da2505d3ae14/m_p_boH6uu2omR2Gjxxx.jpg">größer</a>]</p><h3>Der heilige Sergios (Thessaloniki, Byzanz)</h3><p>7. Jahrhundert. Basilika des heiligen Demetrios in Thessaloniki. Mosaik an einem Pfeiler des Altarraums.</p><img src="https://res.bibleox.com/s/img/image/simple/686989925f47da2505d3ae15/s_p_Faf5BLFz9WISBGej.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686989925f47da2505d3ae15/m_p_Faf5BLFz9WISBGej.jpg">größer</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a742205184ec278d6fb4/m_p_YV1I98bvx4Nn6cUn.jpg">Version 2</a>]</p><h3>Eine Ikone des heiligen Propheten David (Konstantinopel, Byzanz)</h3><p>629–630. <a href="https://www.metmuseum.org/art/collection/search/464380">Metropolitan Museum of Art, Fifth Avenue, USA</a>. Silber. 26,6 × 4 cm, 1397 g. Siehe auch: <a href="https://www.metmuseum.org/art/collection/search/464378">1</a>, <a href="https://www.metmuseum.org/art/collection/search/464375">2</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c1c3426594f46d35a87e75/s_p_5U20dlUc30xkfJeN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1c3426594f46d35a87e75/m_p_5U20dlUc30xkfJeN.jpg">größer</a>]</p><h3>Ein Molybdobull mit einem Heiligenbild und einer Inschrift (Byzanz)</h3><p>7. Jahrhundert. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/270001?page=17&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=840">Eremitage, Russland</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c2966480b4d285320419/s_p_EY1IyPYdMzjgztlB.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c2966480b4d285320419/m_p_EY1IyPYdMzjgztlB.jpg">größer</a>]</p><h3>Ein Molybdobull mit einem Brustbild Christi und einem Monogramm (Byzanz)</h3><p>7. Jahrhundert. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/231980?page=2&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%B0&amp;index=96">Eremitage, Russland</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c6076480b4d285320423/s_p_YFjOrZh2fLGJgpYJ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c6076480b4d285320423/m_p_YFjOrZh2fLGJgpYJ.jpg">größer</a>]</p><h3>Ein Molybdobull mit einem Bild Christi und einem Monogramm (Byzanz)</h3><p>7. Jahrhundert. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/172196?page=2&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%B0&amp;index=57">Eremitage, Russland</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c64d6480b4d285320424/s_p_RQupAUUa4gGtXt2n.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c64d6480b4d285320424/m_p_RQupAUUa4gGtXt2n.jpg">größer</a>]</p><h2>8. Jahrhundert</h2><h3>Die Gottesgebärerin und das Jesuskind (Konstantinopel, Byzanz)</h3><p>Kirche der Weisheit Gottes (Hagia Sophia).</p><img src="https://res.bibleox.com/s/img/image/simple/674f31b0dba77200011c73a2/s_p_2AO12RGOQ2yqRiP4.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f31b0dba77200011c73a2/m_p_2AO12RGOQ2yqRiP4.jpg">größer</a>]</p><h3>Der Erzengel Gabriel (Konstantinopel, Byzanz)</h3><p>Kirche der Weisheit Gottes (Hagia Sophia).</p><img src="https://res.bibleox.com/s/img/image/simple/674f3256dba77200011c73a4/s_p_rfkKZFQ8IYfO6L7V.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f3256dba77200011c73a4/m_p_rfkKZFQ8IYfO6L7V.jpg">größer</a>]</p><h3>Christus, Kreuzigung und Auferstehung (Metz, Frankreich)</h3><p>870. <a href="https://collections.louvre.fr/en/ark:/53355/cl010113244">Louvre, Frankreich</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c422e46594f46d35a87f10/s_p_lQNRJIXri6KJoLw3.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c422e46594f46d35a87f10/m_p_lQNRJIXri6KJoLw3.jpg">größer</a>]</p><h3>Christus, Kreuzigung (Reims, Frankreich)</h3><p>870–880. <a href="https://collections.louvre.fr/en/ark:/53355/cl010098469">Louvre, Frankreich</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c423bc6594f46d35a87f11/s_p_NOhnffTlgTImIczW.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c423bc6594f46d35a87f11/m_p_NOhnffTlgTImIczW.jpg">größer</a>]</p><h2>9. Jahrhundert</h2><h3>Die Himmelfahrt Christi (Thessaloniki, Byzanz)</h3><p>9.–10. Jahrhundert. Rotunde des heiligen Georg des Siegesträgers (ursprünglich Grabmal des Kaisers Galerius). Fresko [17][18]</p><img src="https://res.bibleox.com/s/img/image/simple/686a934c5f47da2505d3ae20/s_p_klfYhHum7wZvKR9D.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686a934c5f47da2505d3ae20/m_p_klfYhHum7wZvKR9D.jpg">größer</a>]</p><h3>Christus, ein Bronzemedaillon (Byzanz)</h3><p>9.–10. Jahrhundert. Runde Bilder nennt man Medaillons. <a href="https://www.britishmuseum.org/collection/object/H_1880-0820-9">British Museum</a>. Durchmesser: 3,5 cm.</p><p>Circular medallion; bronze; bust of Christ with cruciferous nimbus holding the book of the gospel in his left hand; inscription either side.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5be2d45c75323d28a5e92/s_p_GswK2cGnuxxnLfJr.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5be2d45c75323d28a5e92/m_p_GswK2cGnuxxnLfJr.jpg">größer</a>]</p><h3>Das Entschlafen der Gottesgebärerin (Byzanz)</h3><p>Ende 9. Jahrhundert. <a href="https://www.metmuseum.org/art/collection/search/464013">Metropolitan Museum of Art, Fifth Avenue, USA</a>. Material: Elfenbein. 18,6 × 14,8 × 1,1 cm.</p><p>New York. The Metropolitan Museum of Art. "The Glory of Byzantium,". Images of the Koimesis, or the Dormition in the West, show the Virgin lying on a bier, while her soul, represented as a baby, is offered by Christ to attendant angels who will take it to heaven. The apostles, led by Saints Paul and Peter, stand witness.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5c1bf45c75323d28a5e97/s_p_0Hg1bO8KIUVBSWJs.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5c1bf45c75323d28a5e97/m_p_0Hg1bO8KIUVBSWJs.jpg">größer</a>]</p><h3>Christus, die Gottesgebärerin, Johannes der Täufer, Apostel und andere Heilige (Konstantinopel)</h3><p>940–960. <a href="https://collections.louvre.fr/en/ark:/53355/cl010112515">Louvre, Frankreich</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c424276594f46d35a87f12/s_p_IlqGrJe04Ic0YFWv.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c424276594f46d35a87f12/m_p_IlqGrJe04Ic0YFWv.jpg">größer</a>]</p><h3>Eine Platte mit einem Bild Christi und der Apostel (Italien)</h3><p>9. Jahrhundert. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/228918?page=4&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%B0&amp;index=194">Eremitage, Russland</a>. Größe: 12,2 × 10,5 cm</p><img src="https://res.bibleox.com/s/img/image/simple/6863c54f6480b4d285320421/s_p_aLvOvrKuilB614SS.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c54f6480b4d285320421/m_p_aLvOvrKuilB614SS.jpg">größer</a>]</p><h2>10. Jahrhundert</h2><h3>Christus, die Gottesgebärerin, Johannes der Täufer (Byzanz)</h3><p>10. Jahrhundert. <a href="https://www.britishmuseum.org/collection/object/H_1923-1205-2">British Museum</a>. Material: Elfenbein. Höhe: 15,5 cm.</p><p>Panel; ivory; carved with standing figures, Christ with the Virgin Mary and St John, below a pierced canopy; four holes for attachment in the raised border.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5be4045c75323d28a5e95/s_p_qEFeZyh2Gq5Wbvar.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5be4045c75323d28a5e95/m_p_qEFeZyh2Gq5Wbvar.jpg">größer</a>]</p><h3>Die Gottesgebärerin und das Christuskind (Konstantinopel, Byzanz)</h3><p><a href="tel:950-1025">950–1025</a>. <a href="https://www.clevelandart.org/art/1925.1293">Cleveland Museum of Art, USA</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68caa153205184ec278d5882/s_p_iLLZZkqfsUiACLDC.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68caa153205184ec278d5882/m_p_iLLZZkqfsUiACLDC.jpg">größer</a>]</p><h3>Ein Anhänger mit einem Bild Christi und der Gottesgebärerin (Byzanz)</h3><p>1000–1300. <a href="https://www.metmuseum.org/art/collection/search/477247">Metropolitan Museum of Art, Fifth Avenue, USA</a>. Chalcedon-Kamee; Goldfassung mit Perlen, Smaragden, Granaten, Saphiren und Sardonyx-Einlagen. Gesamt: 7,2 × 5,5 × 1,6 cm. Chalcedon: 1 1/2 × 1 1/4 Zoll (3,8 × 3,2 cm)</p><img src="https://res.bibleox.com/s/img/image/simple/68c1bc1a6594f46d35a87e6d/s_p_VcHt7eFMtZq1I1lY.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1bc1a6594f46d35a87e6d/m_p_VcHt7eFMtZq1I1lY.jpg">größer</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/68c1bc176594f46d35a87e6c/s_p_LwWdQj6J4ehbmMh9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1bc176594f46d35a87e6c/m_p_LwWdQj6J4ehbmMh9.jpg">größer</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c1bc1f6594f46d35a87e6e/m_p_gT2TXueTg5pmDsuZ.jpg">noch größer</a>]</p><h3>Ein Kreuz mit einem Bild Christi (Byzanz)</h3><p>10.–11. Jahrhundert. Bronze. 6,6 × 4,2 cm. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/228297?page=56&amp;query=%D0%BA%D1%80%D0%B5%D1%81%D1%82&amp;sort=112&amp;index=2755">Eremitage, Russland</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c11f5b6594f46d35a87e2d/s_p_6uw78FFpsxpItSzn.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c11f5b6594f46d35a87e2d/m_p_6uw78FFpsxpItSzn.jpg">größer</a>]</p><h3>Ein Kreuz mit einem Bild Christi (Byzanz)</h3><p>10.–11. Jahrhundert. Bronze. 7,7 × 7 cm. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/482789?page=51&amp;query=%D0%BA%D1%80%D0%B5%D1%81%D1%82&amp;sort=112&amp;index=2501">Eremitage, Russland</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c11fab6594f46d35a87e2e/s_p_jfgfrZ4X7jcBXG9D.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c11fab6594f46d35a87e2e/m_p_jfgfrZ4X7jcBXG9D.jpg">größer</a>]</p><h3>Ein Kreuz mit Ikonen von Heiligen (Chersones)</h3><p>10. Jahrhundert. Bronze, Gravur. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/372835?page=5&amp;fundcoll=1420520446__1413747286&amp;index=229">Eremitage, Russland</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c4191a6594f46d35a87f02/s_p_iFiSEGM9EbRIhhtD.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c4191a6594f46d35a87f02/m_p_iFiSEGM9EbRIhhtD.jpg">größer</a>]</p><h3>Der heilige Demetrios von Thessaloniki (Byzanz)</h3><p><a href="tel:950-1000">950–1000</a>. <a href="https://www.metmuseum.org/art/collection/search/465946">Metropolitan Museum of Art, Fifth Avenue, USA</a>. Material: Elfenbein. 19,7 × 12,1 × 1 cm.</p><p>Standing erect, a spear in his hand and a shield at his side, Saint Demetrios is shown ready to protect the Christian faithful. The name of the popular Byzantine military saint is inscribed in two parts in Greek. Martyred in Thessalonike, the second most important city of the empire in the early centuries of the church, he has long been the patron saint of that metropolis. Images of saints in military dress are rare in Early Byzantine art (they appear on the chalices of the Attarouthi Treasure) but typical of the Middle Byzantine period.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5c38445c75323d28a5e98/s_p_ZeZuXGqxAAyDuPBA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5c38445c75323d28a5e98/m_p_ZeZuXGqxAAyDuPBA.jpg">größer</a>]</p><h2>11. Jahrhundert</h2><h3>Ein Prozessionskreuz: Christus, die Gottesgebärerin, die Erzengel Michael und Gabriel (Byzanz)</h3><p>1000–1050. <a href="https://www.metmuseum.org/art/collection/search/466251">Metropolitan Museum of Art, Fifth Avenue, USA</a>. 59,5 × 43 × 2,2 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5e3e645c75323d28a5e9b/s_p_Ft65PrnBUmI6wDAc.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5e3e645c75323d28a5e9b/m_p_Ft65PrnBUmI6wDAc.jpg">größer</a>]</p><h3>Ein Prozessionskreuz: Christus, die Gottesgebärerin, Johannes der Täufer (Byzanz)</h3><p>1050. <a href="https://www.clevelandart.org/art/1970.36">Cleveland Museum of Art, USA</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68ca921d205184ec278d5871/s_p_PrD5y34JBpT95quf.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68ca921d205184ec278d5871/m_p_PrD5y34JBpT95quf.jpg">größer</a>]</p><h3>Ein Prozessionskreuz: der heilige Sabbas (Byzanz)</h3><p>1050. <a href="https://www.metmuseum.org/art/collection/search/697956">Metropolitan Museum of Art, Fifth Avenue, USA</a>. In der Mitte der Rückseite der heilige Sabbas, an den Enden andere heilige Mönche. Silber. 32,4 × 44,8 × 5,7 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68c1c6546594f46d35a87e76/s_p_FO8cb8Ec2FqTDFz8.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1c6546594f46d35a87e76/m_p_FO8cb8Ec2FqTDFz8.jpg">größer</a>]</p><h3>Ein Prozessionskreuz: Christus (Chersones)</h3><p>11. Jahrhundert. Material: Bronze, Eisen; Guss, Treibarbeit, Gravur. Größe: 36,5 × 27,5 cm. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/372834?page=3&amp;fundcoll=1420520446__1413747286&amp;index=106">Eremitage, Russland</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c418616594f46d35a87f01/s_p_ytqdkwIa6FDSikCw.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c418616594f46d35a87f01/m_p_ytqdkwIa6FDSikCw.jpg">größer</a>]</p><h3>Teil der Ikone „Christus Pantokrator“ (Byzanz, Krim)</h3><p>1050–1100. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/372766?page=40&amp;query=%D0%B8%D0%BA%D0%BE%D0%BD%D0%B0&amp;index=1999">Eremitage, Russland</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863bfff6480b4d285320412/s_p_XwuOAkY6yR10NT7b.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863bfff6480b4d285320412/m_p_XwuOAkY6yR10NT7b.jpg">größer</a>]</p><h3>Die Gottesgebärerin mit dem Christuskind (Konstantinopel)</h3><p>1000–1015. <a href="https://collections.louvre.fr/en/ark:/53355/cl010101133">Louvre, Frankreich</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c43b8c6594f46d35a87f16/s_p_rQNvoLa9Vu1WmSB2.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c43b8c6594f46d35a87f16/m_p_rQNvoLa9Vu1WmSB2.jpg">größer</a>]</p><h3>Die Gottesgebärerin Orans (Konstantinopel)</h3><p>1000–1200. <a href="https://collections.louvre.fr/en/ark:/53355/cl010114443">Louvre, Frankreich</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c43bcc6594f46d35a87f17/s_p_7a5oJnVWqjfeu67t.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c43bcc6594f46d35a87f17/m_p_7a5oJnVWqjfeu67t.jpg">größer</a>]</p><h3>Die Gottesgebärerin, der Erzengel Michael, der heilige Theodor (Byzanz)</h3><p>11.–12. Jahrhundert. <a href="https://www.britishmuseum.org/collection/object/H_1981-0103-1">British Museum</a>. 108 × 95 mm.</p><p>Relief icon; rectangular bronze plaque cast in low relief with full-length Hodegetria flanked by the Archangel Michael and St Theodore, each wearing a girdled tunic beneath a chlamys with decorated tablion; the figures are identified by intaglio inscriptions; the whole is surrounded by a raised border with a running vine scroll; traces of solder at sides and back.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5be3545c75323d28a5e93/s_p_DFDGZ6kHm0khLKRD.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5be3545c75323d28a5e93/m_p_DFDGZ6kHm0khLKRD.jpg">größer</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5be3b45c75323d28a5e94/m_p_FfmDAHv29BAMxval.jpg">noch größer</a>]</p><h3>Eine Ikone des heiligen Demetrios (Byzanz)</h3><p>1040–1060. <a href="https://collections.louvre.fr/en/ark:/53355/cl010115478">Louvre, Frankreich</a>. 9,4 × 6,3 × 0,6 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c0c36594f46d35a87ec0/s_p_dj04XPO3pwvzkLzr.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c0c36594f46d35a87ec0/m_p_dj04XPO3pwvzkLzr.jpg">größer</a>]</p><h3>Ein Molybdobull mit einem Bild des heiligen Demetrios und einer Inschrift (Byzanz)</h3><p>11. Jahrhundert. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/269619?page=20&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=958">Eremitage, Russland</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c2556480b4d285320418/s_p_oqzix7avanFfe61o.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c2556480b4d285320418/m_p_oqzix7avanFfe61o.jpg">größer</a>]</p><h3>Ein Molybdobull mit einem Halbfigurenbild eines Heiligen (Byzanz)</h3><p>11. Jahrhundert. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/267492?page=14&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=651">Eremitage, Russland</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c3196480b4d28532041a/s_p_VySwl31Z41rar6d3.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c3196480b4d28532041a/m_p_VySwl31Z41rar6d3.jpg">größer</a>]</p><h3>Ein Hängesiegel mit einem Heiligenbild (Byzanz)</h3><p>11. Jahrhundert. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/483272?query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=21">Eremitage, Russland</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c4276480b4d28532041d/s_p_5EJuZ18em5TsdUwA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c4276480b4d28532041d/m_p_5EJuZ18em5TsdUwA.jpg">größer</a>]</p><h3>Ein Hängesiegel mit einem Heiligenbild (Byzanz)</h3><p>11.–12. Jahrhundert. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/483278?query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=35">Eremitage, Russland</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c4616480b4d28532041e/s_p_H8LrRkkjwBHlc322.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c4616480b4d28532041e/m_p_H8LrRkkjwBHlc322.jpg">größer</a>]</p><h2>12. Jahrhundert</h2><h3>Christus, die Gottesgebärerin, der Prophet Johannes (Konstantinopel, Byzanz)</h3><p>Kirche der Weisheit Gottes (Hagia Sophia). Fresko der Kirche[5]</p><img src="https://res.bibleox.com/s/img/image/simple/6750078ddba77200011c73af/s_p_EcliI0JFeV1uu1LU.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6750078ddba77200011c73af/m_p_EcliI0JFeV1uu1LU.jpg">größer</a>]</p><h3>Christus (Konstantinopel, Byzanz)</h3><p>Kirche der Weisheit Gottes (Hagia Sophia).</p><img src="https://res.bibleox.com/s/img/image/simple/674f332ddba77200011c73a6/s_p_1PCMz3Y4EZgbSJL0.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f332ddba77200011c73a6/m_p_1PCMz3Y4EZgbSJL0.jpg">größer</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686cf10d5f47da2505d3ae4e/s_p_ZHUiumbGoeJMn4GO.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686cf10d5f47da2505d3ae4e/m_p_ZHUiumbGoeJMn4GO.jpg">größer</a>]</p><h3>Die Gottesgebärerin (Konstantinopel, Byzanz)</h3><p>Kirche der Weisheit Gottes (Hagia Sophia).</p><img src="https://res.bibleox.com/s/img/image/simple/674f3332dba77200011c73a7/s_p_WvZb6UestGwJUzJr.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f3332dba77200011c73a7/m_p_WvZb6UestGwJUzJr.jpg">größer</a>]</p><h3>Johannes der Täufer, Prophet (Konstantinopel, Byzanz)</h3><p>Kirche der Weisheit Gottes (Hagia Sophia).</p><img src="https://res.bibleox.com/s/img/image/simple/674f357ddba77200011c73a8/s_p_hdfr9cx0ZPTZyn6N.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f357ddba77200011c73a8/m_p_hdfr9cx0ZPTZyn6N.jpg">größer</a>]</p><h3>Die Gottesgebärerin mit dem Jesuskind (Konstantinopel)</h3><p>Erstes Drittel des 12. Jahrhunderts. Die Wladimirer Ikone der Gottesgebärerin. Holz, Tempera.</p><img src="https://res.bibleox.com/s/img/image/simple/674f18e4dba77200011c7399/s_p_0uaArAqVhNX9r0gV.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f18e4dba77200011c7399/m_p_0uaArAqVhNX9r0gV.jpg">größer</a>]</p><h3>Die Gottesgebärerin (Byzanz, Syrien, Tartus)</h3><p>12. Jahrhundert. <a href="https://www.britishmuseum.org/collection/object/H_1889-0511-13">British Museum</a>. Material: Elfenbein, 41 × 47 mm.</p><p>Relief icon; pale grey-green steatite; rounded at the top and square below; bust of the Virgin, her mantle drawn over her head, with St Andrew''s cross on it; her hands held in front with palms outwards, inscription either side of her.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5be2645c75323d28a5e91/s_p_StVNlxiOjocLLsz5.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5be2645c75323d28a5e91/m_p_StVNlxiOjocLLsz5.jpg">größer</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5be2245c75323d28a5e90/m_p_yHJ3BkdNwVGdLb4m.jpg">noch größer</a>]</p><h3>Der Großmärtyrer Demetrios von Thessaloniki und ein Diakon (Thessaloniki, Byzanz)</h3><p>12. Jahrhundert. Mosaik an der Ostseite des Südpfeilers.</p><img src="https://res.bibleox.com/s/img/image/simple/68698a155f47da2505d3ae16/s_p_n7AgnVLPvfeBX5Qq.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68698a155f47da2505d3ae16/m_p_n7AgnVLPvfeBX5Qq.jpg">größer</a>]</p><h3>Eine Ikone der Gottesgebärerin Hodegetria (Byzanz, Chersones)</h3><p>Zweite Hälfte des 12. Jahrhunderts. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/372931?page=11&amp;fundcoll=1420520446&amp;index=536">Eremitage, Russland</a>. 6,8 × 5 cm</p><img src="https://res.bibleox.com/s/img/image/simple/6863bf2f6480b4d285320411/s_p_10YV8HIpAzMNCgvp.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863bf2f6480b4d285320411/m_p_10YV8HIpAzMNCgvp.jpg">größer</a>]</p><h2>13. Jahrhundert</h2><h3>Der Herr, der Allherrscher (Athos)</h3><p>Kloster Chilandar, Heiliger Berg Athos.</p><img src="https://res.bibleox.com/s/img/image/simple/69406737205184ec278d6fd8/s_p_hTWcEC5QtmbCrC5t.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69406737205184ec278d6fd8/m_p_hTWcEC5QtmbCrC5t.jpg">größer</a>]</p><h3>Die Gottesgebärerin mit dem Jesuskind (Hodegetria, Athos)</h3><p>Kloster Chilandar, Heiliger Berg Athos.</p><img src="https://res.bibleox.com/s/img/image/simple/674f0cfadba77200011c7395/s_p_mQMRA7FGLEbqOYIx.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f0cfadba77200011c7395/m_p_mQMRA7FGLEbqOYIx.jpg">größer</a>]</p><h2>14. Jahrhundert</h2><h3>Der Herr, der Allherrscher</h3><p>Ikonenmaler Manuel Panselinos.</p><img src="https://res.bibleox.com/s/img/image/simple/674f28d1dba77200011c739e/s_p_ma0z14hIFXCiEj7S.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f28d1dba77200011c739e/m_p_ma0z14hIFXCiEj7S.jpg">größer</a>]</p><h3>Die Gottesgebärerin (Thessaloniki)</h3><p>1310–1315. Orans. Fresko der Kirche des heiligen Nikolaos Orphanos in Thessaloniki, Griechenland.</p><img src="https://res.bibleox.com/s/img/image/simple/674f29b7dba77200011c739f/s_p_PSuCdQIYdR4IYZgA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f29b7dba77200011c739f/m_p_PSuCdQIYdR4IYZgA.jpg">größer</a>]</p><h3>Der Einzug der allheiligen Gottesgebärerin in den Tempel (Konstantinopel)</h3><p>Um 1316–1321. Kariye Camii, Chora-Kloster, Istanbul (Konstantinopel), Türkei.</p><img src="https://res.bibleox.com/s/img/image/simple/675343bddba7720001cd0ddf/s_p_AtF4vpmhv6FneUfA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/675343bddba7720001cd0ddf/m_p_AtF4vpmhv6FneUfA.jpg">größer</a>]</p><h2>15. Jahrhundert</h2><h3>Der Apostel Paulus (Rus)</h3><p>1410er Jahre. Maler: der heilige Andrej Rubljow. Staatliche Tretjakow-Galerie, Moskau, Russland.</p><img src="https://res.bibleox.com/s/img/image/simple/6909fbca205184ec278d6e6a/s_p_ok25vNdlaQMM5P3c.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6909fbca205184ec278d6e6a/m_p_ok25vNdlaQMM5P3c.jpg">größer</a>]</p><h2>Ikonensammlungen</h2><ol><li><p>Eine Sammlung zur Ikonographie der Katakomben, Word-Datei: <a href="https://disk.yandex.ru/d/mHc8dxUdHGqMEQ">Link</a></p></li><li><p>Werke des Ikonenmalers Manuel Panselinos (13.–14. Jahrhundert): <a href="https://vk.com/album-20034910_224123875">https://vk.com/album-20034910_224123875</a></p></li></ol>'
