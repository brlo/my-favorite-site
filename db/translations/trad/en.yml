  body: '<h2>2nd Century</h2><h3><a href="https://ru.wikipedia.org/wiki/%D0%9F%D0%B0%D0%BF%D0%B8%D1%80%D1%83%D1%81_52">Papyrus 52</a> — <a href="https://bibleox.com/en/en-nrsv/in/18/#L31-33,37-38">John 18:31-33,37-38</a> (~150)</h3><img src="https://res.bibleox.com/s/img/image/simple/67c76e30dba7720001a4ab31/s_p_k5TLeFzzlkF84GaN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/67c76e30dba7720001a4ab31/m_p_k5TLeFzzlkF84GaN.jpg">larger</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/67c77746dba7720001a4ab32/s_p_redMnT8D34cxZOYL.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/67c77746dba7720001a4ab32/m_p_redMnT8D34cxZOYL.jpg">larger</a>]</p><h3><a href="https://en.wikipedia.org/wiki/Papyrus_90">Papyrus 90</a> — <a href="https://bibleox.com/en/en-nrsv/in/18/#L36-40">John 18:36-40</a>; <a href="https://bibleox.com/en/en-nrsv/in/19/#L1-7">John 19:1-7</a> (~150)</h3><img src="https://res.bibleox.com/s/img/image/simple/67c7784edba7720001a4ab33/s_p_H1o3KGBYNI9sl2F9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/67c7784edba7720001a4ab33/m_p_H1o3KGBYNI9sl2F9.jpg">larger</a>]</p><h3><a href="https://en.wikipedia.org/wiki/Papyrus_104">Papyrus 104</a> — <a href="https://bibleox.com/en/en-nrsv/mf/21/#L34-37">Matt 21:34-37</a>; <a href="https://bibleox.com/en/en-nrsv/mf/21/#L43-44">Matt 21:43-44</a> (~150)</h3><img src="https://res.bibleox.com/s/img/image/simple/67c778a6dba7720001a4ab34/s_p_J8MmDkwHjJgq0wEA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/67c778a6dba7720001a4ab34/m_p_J8MmDkwHjJgq0wEA.jpg">larger</a>]</p><h3><a href="https://en.wikipedia.org/wiki/Papyrus_98">Papyrus 98</a> — <a href="https://bibleox.com/en/en-nrsv/otkr/1/#L13-20">Rev 1:13-20</a>; <a href="https://bibleox.com/en/en-nrsv/otkr/2/#L1">Rev 2:1</a> (~150–250)</h3><img src="https://res.bibleox.com/s/img/image/simple/67c779a2dba7720001a4ab35/s_p_rPG5aCVLBBw75jo3.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/67c779a2dba7720001a4ab35/m_p_rPG5aCVLBBw75jo3.jpg">larger</a>]</p><h2>3rd Century</h2><h3><a href="https://en.wikipedia.org/wiki/Papyrus_75">Papyrus 75</a> — <a href="https://bibleox.com/en/en-nrsv/lk/3/#L18">Luke 3:18</a> — 24:53; <a href="https://bibleox.com/en/en-nrsv/in/1/#L1">John 1:1</a> — 15:8 (175–225)</h3><img src="https://res.bibleox.com/s/img/image/simple/67c77d00dba7720001a4ab3a/s_p_9dXrKwGPywze2DAo.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/67c77d00dba7720001a4ab3a/m_p_9dXrKwGPywze2DAo.jpg">larger</a>]</p><h3><a href="https://en.wikipedia.org/wiki/Papyrus_46">Papyrus 46</a> — Rom, Heb, 1 Cor, 2 Cor, Eph, Gal, Phil, Col, 1 Thess (~175–225)</h3><img src="https://res.bibleox.com/s/img/image/simple/6915b056205184ec278d6e7f/s_p_lPe15bGd8VVR6y2H.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6915b056205184ec278d6e7f/m_p_lPe15bGd8VVR6y2H.jpg">larger</a>]</p><ul><li><p>Rom 1:15–17</p></li><li><p>Rom 5:17 – 6:14</p></li><li><p>Rom 6:14 – 8:15</p></li><li><p>Rom 8:15 – 11:35</p></li><li><p>Rom 11:35 – 14:8</p></li><li><p>Rom 14:9 – 15:11</p></li><li><p>Rom 15:11 — Heb 8:8</p></li><li><p>Heb 8:9 – 9:10</p></li><li><p>Heb 9:10–26</p></li><li><p>Heb 9:26 – 1 Cor 2:3</p></li><li><p>1 Cor 2:3 – 3:5</p></li><li><p>1 Cor 3:6 – 2 Cor 9:7</p></li><li><p>2 Cor 9:7 – to the end, Eph, Gal 1:1 – 6:10</p></li><li><p>Gal 6:10 — end, Phil, Col, 1 Thess 1:1 – 2:3</p></li><li><p>1 Thess 2:3 – 5:5</p></li><li><p>1 Thess 5:5, 23–28</p></li><li><p>Possibly also: 1 Thess 5:28 – 2 Thess, Philemon</p></li></ul><h3><a href="https://en.wikipedia.org/wiki/Papyrus_32">Papyrus 32</a> — <a href="https://bibleox.com/en/en-nrsv/tit/1/#L11-15">Titus 1:11-15</a>; <a href="https://bibleox.com/en/en-nrsv/tit/2/#L3-8">Titus 2:3-8</a> (~200)</h3><img src="https://res.bibleox.com/s/img/image/simple/67c77f82dba7720001a4ab3c/s_p_37FYUloO3Px16M3p.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/67c77f82dba7720001a4ab3c/m_p_37FYUloO3Px16M3p.jpg">larger</a>]</p><h3><a href="https://en.wikipedia.org/wiki/Papyrus_4">Papyrus 4</a> — <a href="https://bibleox.com/en/en-nrsv/lk/1/#L58-59">Luke 1:58-59</a>; 1:62–2:1; 2:6–7; 3:8–4:2; 4:29–32, 34–35; 5:3–8; 5:30–6:16 (175–250)</h3><img src="https://res.bibleox.com/s/img/image/simple/67c77ec9dba7720001a4ab3b/s_p_EOPj5ySHUxKuZhzv.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/67c77ec9dba7720001a4ab3b/m_p_EOPj5ySHUxKuZhzv.jpg">larger</a>]</p><h3><a href="https://en.wikipedia.org/wiki/Papyrus_16">Papyrus 16</a> — <a href="https://bibleox.com/en/en-nrsv/fil/3/#L10-17">Phil 3:10-17</a>; <a href="https://bibleox.com/en/en-nrsv/fil/4/#L2-8">Phil 4:2-8</a> (3rd c.)</h3><img src="https://res.bibleox.com/s/img/image/simple/67c77a33dba7720001a4ab36/s_p_ee63gtSd7dJORxL9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/67c77a33dba7720001a4ab36/m_p_ee63gtSd7dJORxL9.jpg">larger</a>]</p><h3><a href="https://en.wikipedia.org/wiki/Papyrus_72">Papyrus 72</a> — 1 Peter, 2 Peter, Jude (3rd–4th c.)</h3><img src="https://res.bibleox.com/s/img/image/simple/67c77afddba7720001a4ab37/s_p_JCufSqhlLauLH7qF.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/67c77afddba7720001a4ab37/m_p_JCufSqhlLauLH7qF.jpg">larger</a>]</p><h3><a href="https://en.wikipedia.org/wiki/Papyrus_78">Papyrus 78</a> — <a href="https://bibleox.com/en/en-nrsv/iud/1/#L4-5,7-8">Jude 1:4-5,7-8</a> (3rd–4th c.)</h3><img src="https://res.bibleox.com/s/img/image/simple/67c77be8dba7720001a4ab38/s_p_8xpMewUexRgW9gyK.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/67c77be8dba7720001a4ab38/m_p_8xpMewUexRgW9gyK.jpg">larger</a>]</p><h2>4th Century</h2><h3>Codex Sinaiticus (mid-4th century)</h3><p><a href="https://codexsinaiticus.org/en/manuscript.aspx">https://codexsinaiticus.org/en/manuscript.aspx</a></p><img src="https://res.bibleox.com/s/img/image/simple/69037c86205184ec278d6e4f/s_p_k8XUyHVBOuyRjeGi.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69037c86205184ec278d6e4f/m_p_k8XUyHVBOuyRjeGi.jpg">larger</a>]</p><h3>Codex Vaticanus (mid-4th century, but possibly after 367)</h3><p><a href="https://archive.org/details/CodexAlexandrinus/Codex-Vaticanus-NT/mode/2up">https://archive.org/details/CodexAlexandrinus/Codex-Vaticanus-NT/mode/2up</a></p><p><a href="https://digi.vatlib.it/view/MSS_Vat.gr.1209">https://digi.vatlib.it/view/MSS_Vat.gr.1209</a></p><img src="https://res.bibleox.com/s/img/image/simple/69037c61205184ec278d6e4e/s_p_mNcBEIlZjg4rJctE.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69037c61205184ec278d6e4e/m_p_mNcBEIlZjg4rJctE.jpg">larger</a>]</p><h2>5th Century</h2><h3>Codex Alexandrinus (first half of the 5th century)</h3><p><a href="https://archive.org/details/CodexAlexandrinus/Codex%20Alexandrinus">https://archive.org/details/CodexAlexandrinus/Codex%20Alexandrinus</a></p><img src="https://res.bibleox.com/s/img/image/simple/69037c31205184ec278d6e4d/s_p_nvIvhbabbnHZELvW.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69037c31205184ec278d6e4d/m_p_nvIvhbabbnHZELvW.jpg">larger</a>]</p>'
