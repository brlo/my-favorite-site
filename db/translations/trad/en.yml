  body: '<h2>The Catacombs of Saint Januarius (Catacombe di San Gennaro) [1]</h2><h3>Saint Januarius of Benevento, of Puteoli (Naples), bishop, hieromartyr</h3><p>The Catacombs of San Gennaro (Saint Januarius), Naples. A 4th-century fresco. It is not entirely clear who is depicted here. The inscription at the top reads: SANCTOMARTYRIIANVARIO (to the holy martyr Januarius). Yet for some reason a young man is shown. It is also unclear why the halo looks like this.</p><p>A page about this saint in the Orthodox Church (in Russian): <a href="https://days.pravoslavie.ru/name/890.html">https://days.pravoslavie.ru/name/890.html</a></p><p>The Wikipedia page about this fresco. It is in Polish, but has useful information: <a href="https://pl.wikipedia.org/wiki/January_z_Benewentu">https://pl.wikipedia.org/wiki/January_z_Benewentu</a></p><img src="https://res.bibleox.com/s/img/image/simple/686e6aa95f47da2505d3ae6e/s_p_RCtXSS4uiuO9E0Qf.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686e6aa95f47da2505d3ae6e/m_p_RCtXSS4uiuO9E0Qf.jpg">larger</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686e56775f47da2505d3ae67/m_p_XhI4Ni1rKZ949Zi1.jpg">version 2</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686e54755f47da2505d3ae66/s_p_zKsSelu839AuImaV.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686e54755f47da2505d3ae66/m_p_zKsSelu839AuImaV.jpg">larger</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686e57135f47da2505d3ae68/m_p_faNUwXKGPaVtmUwW.jpg">version 2</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686e6aec5f47da2505d3ae70/s_p_2fvyFxXewVLu06NV.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686e6aec5f47da2505d3ae70/m_p_2fvyFxXewVLu06NV.jpg">larger</a>]</p><h3>Cerula, a Christian woman</h3><p>The inscription below: “CERVLA IN PACE” (Cerula in peace), 5th–6th centuries. [3]</p><img src="https://res.bibleox.com/s/img/image/simple/686e4d5c5f47da2505d3ae63/s_p_1dqPUS5wghY1DrdP.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686e4d5c5f47da2505d3ae63/m_p_1dqPUS5wghY1DrdP.jpg">larger</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686e58705f47da2505d3ae6a/m_p_r6sua9UNLBhgIZ06.jpg">version 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686e58625f47da2505d3ae69/m_p_6KViYk7KWJDrIa8l.jpg">version 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686e6ad15f47da2505d3ae6f/m_p_q9ocVtWoayH4BxtB.jpg">version 4</a>]</p><h3>The Theotecnus Family</h3><blockquote><p>The arcosolium of the family of Theotecnus. Studies have shown that the girl died first. A fresco with her portrait was painted in the niche. Then the man died. A new fresco, now with the father, was painted over the first. The woman died last, and a group portrait of the family appeared in the niche.</p></blockquote><img src="https://res.bibleox.com/s/img/image/simple/686e6be45f47da2505d3ae71/s_p_xNoWgh6wacZ3al1R.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686e6be45f47da2505d3ae71/m_p_xNoWgh6wacZ3al1R.jpg">larger</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686e592c5f47da2505d3ae6b/s_p_A6SYWxzdgc1EPwun.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686e592c5f47da2505d3ae6b/m_p_A6SYWxzdgc1EPwun.jpg">larger</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686fe8695f47da2505d3ae88/m_p_nzuUOKu6sAmxO4pO.jpg">version 2</a>]</p><h2>The Via Anapo catacombs[2]</h2><h3>A woman praying (orans)</h3><p>Fresco of a praying woman, an orante or orans, in the Anonima di Via Anapo catacomb (anonymous catacomb of Via Anapo), Rome</p><img src="https://res.bibleox.com/s/img/image/simple/686e53655f47da2505d3ae65/s_p_qTxn07MuPIePNzPn.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686e53655f47da2505d3ae65/m_p_qTxn07MuPIePNzPn.jpg">larger</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686e535e5f47da2505d3ae64/m_p_U8Zh4RJjehyZtXep.jpg">version 2</a>]</p>'
