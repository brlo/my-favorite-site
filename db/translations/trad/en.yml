- src: древние-иконы
  path: Ik1c_A_Collection_of_Ancient_Icons
  title: A Collection of Ancient Icons
  title_sub: Ancient Christian icons of Christ, the Theotokos, the apostles and other saints
  body: '<h2>c. 15th century BC</h2><h3>The Tabernacle of Meeting</h3><p>On the veil in the middle of the sanctuary (between the Holy Place and the Holy of Holies) cherubim were depicted (<a href="https://bibleox.com/en/en-nrsv/ish/26/#L31">Ex 26:31</a>), as also on the curtains (walls) around (<a href="https://bibleox.com/en/en-nrsv/ish/26/#L1">Ex 26:1</a>; <a href="https://bibleox.com/en/en-nrsv/ish/36/#L8">Ex 36:8</a>), which the artist of this drawing did not show. The tabernacle is an image (icon) of the heavenly reality (<a href="https://bibleox.com/en/en-nrsv/ish/25/#L8-9,40">Ex 25:8-9,40</a>; <a href="https://bibleox.com/en/en-nrsv/evr/9/#L24">Heb 9:24</a>; <a href="https://bibleox.com/en/en-nrsv/act/7/#L44">Act 7:44</a>). God commanded the sanctuary to be revered (<a href="https://bibleox.com/en/en-nrsv/lev/19/#L30">Lev 19:30</a>; <a href="https://bibleox.com/en/en-nrsv/lev/26/#L2">Lev 26:2</a>).</p><img src="https://res.bibleox.com/s/img/image/simple/471/s_p_P2j4gLJt9iKSnkge.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/471/m_p_P2j4gLJt9iKSnkge.jpg">larger</a>] [<a href="https://res.bibleox.com/s/img/image/simple/472/m_p_bNPh6hCNJDhzahar.jpg">exterior</a>]</p><h3>The Ark of the Covenant</h3><p>Two cherubim were depicted on the ark (<a href="https://bibleox.com/ru/ru/w/%D0%BA%D0%BE%D0%B2%D1%87%D0%B5%D0%B3_%D0%B7%D0%B0%D0%B2%D0%B5%D1%82%D0%B0/">Scripture references</a>). The prophet Joshua bowed down before the Ark of the Covenant (<a href="https://bibleox.com/en/en-nrsv/nav/7/#L6">Josh 7:6</a>).</p><img src="https://res.bibleox.com/s/img/image/simple/469/s_p_DUn5vqnI4F8yRiNA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/469/m_p_DUn5vqnI4F8yRiNA.jpg">larger</a>]</p><h3>The Camp of Israel</h3><p>Israel moved in the shape of a cross (<a href="https://bibleox.com/ru/ru/w/%D0%B5%D0%B2%D1%80%D0%B5%D0%B9%D1%81%D0%BA%D0%B8%D0%B9-%D1%81%D1%82%D0%B0%D0%BD-%D0%BA%D1%80%D0%B5%D1%81%D1%82/">Scripture references</a>).</p><img src="https://res.bibleox.com/s/img/image/simple/470/s_p_t8tRbbwlzsBzyVzk.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/470/m_p_t8tRbbwlzsBzyVzk.jpg">larger</a>]</p><h2>c. 10th century BC</h2><h3>The Temple in Jerusalem built by Solomon</h3><p>Carved images of cherubim were on the walls of the temple (<a href="https://bibleox.com/en/en-nrsv/3ts/6/#L32">1 Kin 6:32</a>), on the entrance door (<a href="https://bibleox.com/en/en-nrsv/3ts/6/#L32">1 Kin 6:32</a>; <a href="https://bibleox.com/en/en-nrsv/3ts/6/#L35">1 Kin 6:35</a>) and on the veil before the entrance to the Holy of Holies (<a href="https://bibleox.com/en/en-nrsv/2par/3/#L14">2 Chr 3:14</a>; <a href="https://bibleox.com/en/en-nrsv/1mak/1/#L22">1Mac 1:22</a>). In the Holy of Holies stood two large gilded wooden statues of cherubim (<a href="https://bibleox.com/en/en-nrsv/3ts/6/#L23">1 Kin 6:23</a>). On the cover of the Ark of the Covenant two statues of cherubim were made (<a href="https://bibleox.com/en/en-nrsv/ish/25/#L18-20">Ex 25:18-20</a>). In the temple court, on the great stands for the basins, lions, oxen and cherubim were depicted (<a href="https://bibleox.com/en/en-nrsv/3ts/7/#L28-29">1 Kin 7:28-29</a>). (<a href="https://bibleox.com/ru/ru/w/%D0%B8%D0%B5%D1%80%D1%83%D1%81%D0%B0%D0%BB%D0%B8%D0%BC%D1%81%D0%BA%D0%B8%D0%B9-%D1%85%D1%80%D0%B0%D0%BC/">More</a>).</p><p>The prophet David bowed down toward the temple (<a href="https://bibleox.com/en/en-nrsv/ps/5/#L7">Ps 5:7</a>; <a href="https://bibleox.com/en/en-nrsv/ps/99/#L5">Ps 99:5</a>; <a href="https://bibleox.com/en/en-nrsv/ps/132/#L7">Ps 132:7</a>), honoring God through this image.</p><img src="https://res.bibleox.com/s/img/image/simple/468/s_p_lv7GzNtM53C4Zqgr.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/468/m_p_lv7GzNtM53C4Zqgr.jpg">larger</a>]</p><h2>2nd Century</h2><h3>The Theotokos with the Child Jesus; a prophet points to a star (Rome)</h3><p>2nd – early 3rd century. The Catacomb of Priscilla[6]. This is the oldest image of the Theotokos. The man beside the Theotokos is perhaps holding a book in his left hand and pointing to a star with a finger of his right hand.</p><img src="https://res.bibleox.com/s/img/image/simple/6751b012dba7720001514f69/s_p_jNTGMwic6Cse9xDG.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6751b012dba7720001514f69/m_p_jNTGMwic6Cse9xDG.jpg">larger</a>] [<a href="https://res.bibleox.com/s/img/image/simple/67618740dba7720001cd0e2c/m_p_ckKuGWqzHuN1tR5Q.jpg">version 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686cf0535f47da2505d3ae4d/m_p_dajA4xvStk0EnnSq.jpg">version 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686cf7725f47da2505d3ae50/m_p_n79yEKK4QSCeorx3.jpg">version 4</a>] [<a href="https://res.bibleox.com/s/img/image/simple/442/m_p_5zQEQbMmBkEs9J2S.jpg">version 5</a>]</p><p>The man beside the Theotokos may be the prophet Isaiah, who uttered the prophecy:</p><blockquote><p>“Therefore the Lord himself will give you a sign. Look, <strong>the young woman is with child and shall bear a son</strong>, and shall name him Immanuel” (<a href="https://bibleox.com/en/en-nrsv/is/7/#L14">Is 7:14</a>; in the Septuagint, which the Church reads: ἡ παρθένος, “the virgin”)</p></blockquote><p>Or Balaam:</p><blockquote><p>“I see him, but not now; I behold him, but not near — <strong>a star shall come out of Jacob</strong>, and a scepter shall rise out of Israel; it shall crush the borderlands of Moab, and the territory of all the Shethites” (<a href="https://bibleox.com/en/en-nrsv/chis/24/#L17">Num 24:17</a>)</p></blockquote><p>Or the artist, instead of an explanatory inscription, simply used this device. He invites us to take the book, read the prophecy of the rising star and understand that he has depicted the birth of the One of whom this prophecy speaks, that is, the birth of the Savior from the Virgin.</p><h3>Christ as the Good Shepherd</h3><p>Late 2nd century. Rome. The Catacomb of Callixtus (<a href="https://en.wikipedia.org/wiki/Catacomb_of_Callixtus#Paintings">Callixitus Catacomb, Crypt of Lucina</a>).</p><img src="https://res.bibleox.com/s/img/image/simple/473/s_p_mrIYHR2oqLQuPn0z.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/473/m_p_mrIYHR2oqLQuPn0z.jpg">larger</a>]</p><h2>3rd Century</h2><h3>The Theotokos “Orans” (Rome)</h3><p>Catacomba Maggiore, Rome[26][27]. In the foreground the Virgin Mary and the Child Christ are depicted.</p><img src="https://res.bibleox.com/s/img/image/simple/6751fe6ddba7720001514f7e/s_p_C1Iw2V4OhNy1SGOE.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6751fe6ddba7720001514f7e/m_p_C1Iw2V4OhNy1SGOE.jpg">larger</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686cefb35f47da2505d3ae4c/m_p_70zYu2r0np0WFNUu.jpg">version 2</a>]</p><h3>Christ, the apostles, the martyrs Gorgonius, Peter, Marcellinus and Tiburtius (Rome)</h3><p>The Catacombs of Marcellinus and Peter</p><img src="https://res.bibleox.com/s/img/image/simple/6752012adba7720001514f82/s_p_x5I0ahjwMz1X5LoJ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6752012adba7720001514f82/m_p_x5I0ahjwMz1X5LoJ.jpg">larger</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686d237a5f47da2505d3ae56/m_p_ST9me27UGtWHYDBc.jpg">version 2</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/676082a6dba7720001cd0e22/s_p_YjPD3PzLDCF4wgh1.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/676082a6dba7720001cd0e22/m_p_YjPD3PzLDCF4wgh1.jpg">larger</a>]</p><h3>A woman prays to the Good Shepherd (Rome)</h3><p>3rd century. The Catacomb of Priscilla[6].</p><p>The images form one composition. The artist arranged them so that the praying people painted around look and raise their hands toward the top of the room, where Christ is depicted as the <strong>Good Shepherd</strong> (<a href="https://bibleox.com/en/en-nrsv/in/10/#L11">John 10:11</a>). All the scenes around the Good Shepherd share one theme: <strong>salvation from death</strong>.</p><img src="https://res.bibleox.com/s/img/image/simple/686bea5b5f47da2505d3ae31/s_p_pjRHeoFaUpKPoyEH.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686bea5b5f47da2505d3ae31/m_p_pjRHeoFaUpKPoyEH.jpg">larger</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686cf7375f47da2505d3ae4f/m_p_MOsOWI2vEXUj5ELf.jpg">version 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6904b3f2205184ec278d6e53/m_p_0GRveVCOh2GBz7eq.jpg">version 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/431/m_p_LUZsrJtesEWiwHBO.jpg">version 4</a>]</p><p>The Good Shepherd is Christ (<a href="https://bibleox.com/en/en-nrsv/lk/15/#L6-7">Luke 15:6-7</a>; <a href="https://bibleox.com/en/en-nrsv/in/10/#L1-21">John 10:1-21</a>; <a href="https://bibleox.com/en/en-nrsv/ps/23/">Ps 23</a>).</p><img src="https://res.bibleox.com/s/img/image/simple/69319f74205184ec278d6fa7/s_p_GR8gHxKZuC87xqlf.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69319f74205184ec278d6fa7/m_p_GR8gHxKZuC87xqlf.jpg">larger</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686d2ac55f47da2505d3ae59/m_p_JDvtNt9RJrqnAsEW.jpg">version 2</a>]</p><p>A woman with her head covered prays with her hands raised (probably Sarah: <a href="https://bibleox.com/en/en-nrsv/gen/18/#L1-15">Gen 18:1-15</a> and <a href="https://bibleox.com/en/en-nrsv/gen/21/#L1-7">Gen 21:1-7</a>).</p><img src="https://res.bibleox.com/s/img/image/simple/686bea885f47da2505d3ae32/s_p_79wnuevuFIi3tnrH.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686bea885f47da2505d3ae32/m_p_79wnuevuFIi3tnrH.jpg">larger</a>]</p><p>On the right, an Old Testament scene: the three youths (<a href="https://en.wikipedia.org/wiki/Catacomb_of_Priscilla#/media/File:Shadrach,_Meshach,_and_Abednego_in_the_fiery_furnace,_from_the_book_Die_Malereien_der_Katakomben_Roms,_plate_78,_levels_adjusted.jpg">Shadrach, Meshach and Abednego</a>) pray with their hands raised (<a href="https://bibleox.com/en/en-nrsv/dan/3/">Dan 3</a>).</p><img src="https://res.bibleox.com/s/img/image/simple/686cfc565f47da2505d3ae52/s_p_NmZJuoF70d9qohZs.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686cfc565f47da2505d3ae52/m_p_NmZJuoF70d9qohZs.jpg">larger</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686cfc475f47da2505d3ae51/m_p_qzHB83d52LoU7QQL.jpg">version 2</a>]</p><p>On the left, an Old Testament scene: Abraham and Isaac with the wood for the sacrifice (<a href="https://bibleox.com/en/en-nrsv/gen/22/#L1-19">Gen 22:1-19</a>).</p><img src="https://res.bibleox.com/s/img/image/simple/686d33c45f47da2505d3ae5a/s_p_QQLn5T52hx8gSrBf.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d33c45f47da2505d3ae5a/m_p_QQLn5T52hx8gSrBf.jpg">larger</a>]</p><p>Above the entrance the prophet Jonah is shown being swallowed by the sea creature (<a href="https://bibleox.com/en/en-nrsv/ion/1/#L17">Jon 1:17</a>).</p><img src="https://res.bibleox.com/s/img/image/simple/476/s_p_aHV4YSuoWhVZ1H5y.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/476/m_p_aHV4YSuoWhVZ1H5y.jpg">larger</a>]</p><p>The scene from the life of the praying woman on the front wall of the room deserves a closer description.</p><img src="https://res.bibleox.com/s/img/image/simple/686d36265f47da2505d3ae5d/s_p_MGpxKQ94pikRfgFK.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d36265f47da2505d3ae5d/m_p_MGpxKQ94pikRfgFK.jpg">larger</a>]</p><p><strong>The events of the front scene</strong></p><p>Each section of the room’s composition shows one scene. All the scenes are important parts of Christian themes. At the top is the scene with the Good Shepherd, on the left the scene of Abraham, on the right the three youths, in the passage the prophet Jonah. So one may suppose that the artist kept this rule (one section, one important scene) on the front wall too, which is hard to interpret with certainty. What follows is only a suggestion. Since Old Testament scenes are shown on all sides (except the center), the front wall may show the story of Hagar (<a href="https://bibleox.com/en/en-nrsv/gen/16/">Gen 16</a>, <a href="https://bibleox.com/en/en-nrsv/gen/21/">Gen 21</a>). If so, first Abraham is shown with Hagar being sent away with her son Ishmael (1), then the prayer of Sarah (2), then Hagar feeding her child (3).</p><p>Let us look at this version more closely:</p><p><strong>1. Hagar sent away</strong>. Most certainly the seated figure is Abraham (he has the same hair and beard as in the fresco of Abraham opposite). The figure in yellow is probably Hagar (yellow may have marked the status of a slave). She seems to be holding a skin of water (<a href="https://bibleox.com/en/en-nrsv/gen/21/#L14">Gen 21:14</a>). Behind her is perhaps her son Ishmael, who at the time of the sending away must have been over 15 years old (<em>Ishmael was born when Abraham was 86 </em><a href="https://bibleox.com/en/en-nrsv/gen/16/#L16">Gen 16:16</a><em>, Isaac was born when Abraham was 100 </em><a href="https://bibleox.com/en/en-nrsv/gen/21/#L5">Gen 21:5</a><em>, and Hagar is sent away when Isaac had grown and been weaned </em><a href="https://bibleox.com/en/en-nrsv/gen/21/#L8-13">Gen 21:8-13</a>). It looks like a woman in an apron, but if so, it can only be Hagar herself (an unmarried woman’s head is uncovered), and then the one holding the water skin is Ishmael. Either way, the two remaining figures are most likely Hagar and Ishmael. It may also be that this composition is not made of separate sections but is one whole picture, since the woman with the child looks at the woman with raised hands.</p><img src="https://res.bibleox.com/s/img/image/simple/686d33c95f47da2505d3ae5b/s_p_kuEcuyUnGenBuWPw.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d33c95f47da2505d3ae5b/m_p_kuEcuyUnGenBuWPw.jpg">larger</a>]</p><p><strong>2. The prayer of Sarah</strong>. Sarah is shown in red clothes with her head covered, praying to God. The red clothes show high status, and the covered head shows that she is married.</p><img src="https://res.bibleox.com/s/img/image/simple/686d3a855f47da2505d3ae5e/s_p_rpl3jnuNnx8ZisdR.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d3a855f47da2505d3ae5e/m_p_rpl3jnuNnx8ZisdR.jpg">larger</a>]</p><p><strong>3. Hagar feeds her child</strong>. In favor of the Hagar version is the fact that her head is uncovered (that is, she is unmarried), and her hair has the same shape as that of the person in yellow in the first scene. Her characteristic glance also gives her away: she is looking at Sarah, with whom her relations were tense. Interestingly, the artist painted her exactly as Abraham sits on the left: on a chair and in exactly the same clothes (vertical stripes, two stripes on the sleeve, a cloak).</p><img src="https://res.bibleox.com/s/img/image/simple/686d22a05f47da2505d3ae54/s_p_8fxd9vcRlXYszSJU.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d22a05f47da2505d3ae54/m_p_8fxd9vcRlXYszSJU.jpg">larger</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686d33cd5f47da2505d3ae5c/m_p_qKPp740xLZNuDEFs.jpg">version 2</a>]</p><p><strong>The idea of the whole room: salvation from death</strong></p><p>The composition of this cubiculum has one beautiful idea: salvation from death. The overall story rises in levels from bottom to top:</p><ul><li><p>The lowest level: the buried Christians, who believed in Christ, the conqueror of death.</p></li><li><p>The middle level: biblical stories of salvation from death:</p><ul><li><p>the three youths in the Babylonian furnace are saved from death by fire;</p></li><li><p>the prophet Jonah is saved from death in the belly of the sea creature;</p></li><li><p>Isaac is saved from being sacrificed; a ram is offered in his place;</p></li><li><p>Hagar and her son Ishmael are saved from death in the wilderness.</p></li></ul></li><li><p>The next level: Christian symbols, the peacock (resurrection, immortality, eternal life) and the partridge (the soul). One partridge stands by a living plant (a symbol of life), the other by a withered one (a symbol of death). The peacocks stand likewise.</p></li><li><p>The center of the ceiling: the Good Shepherd, who saves believers from death. Notably, there is one more small reference to salvation from death here: to the left and right of the Shepherd sit the raven and the dove with an olive branch, which Noah sent out from the ark. So those saved from death in the ark are led by these birds to the Savior from death, Christ.</p></li></ul><h3>The Church at Dura-Europos (Syria)</h3><p>244. Besides Old Testament events, the church at Dura-Europos had frescoes with New Testament scenes: the rescue of the apostle Peter from drowning and the healing of the paralytic at the Sheep Pool. See also the <a href="https://vk.com/@aletheia-de-sacris-imaginibus-venerandis?anchor=v-drugie-svyaschennye-izobrazhenia-v-donikeyskiy-period">article</a>.</p><p><strong>Christ as the Good Shepherd (the main view in the baptistery)</strong></p><img src="https://res.bibleox.com/s/img/image/simple/6931870c205184ec278d6fa2/s_p_uBkNi8jGsMFpOQSM.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931870c205184ec278d6fa2/m_p_uBkNi8jGsMFpOQSM.jpg">larger</a>]</p><p><strong>The rescue of the apostle Peter from drowning</strong></p><img src="https://res.bibleox.com/s/img/image/simple/692c8038205184ec278d6f9e/s_p_QQ2Rml8gUWsyQtS9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c8038205184ec278d6f9e/m_p_QQ2Rml8gUWsyQtS9.jpg">larger</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6786b88ddba77200015ae11c/m_p_do380IVDukCAfdFk.jpg">version 2</a>]</p><p><strong>The healing of the paralytic at the Sheep Pool</strong></p><img src="https://res.bibleox.com/s/img/image/simple/6786b889dba77200015ae11b/s_p_k1a5GDBvfzTCWmZv.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6786b889dba77200015ae11b/m_p_k1a5GDBvfzTCWmZv.jpg">larger</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6786bb0bdba77200015ae11d/m_p_dCRD85foL69l7kih.jpg">another version</a>]</p><h3>Christ as the Good Shepherd; the prophet Jonah</h3><p>Late 3rd – early 4th century. Rome. The Catacombs of Marcellinus and Peter.</p><p>In the center is Christ as the Good Shepherd. Jonah is shown on both sides of the center. In the fresco on the left Jonah is thrown from the ship, and on the right the whale swallows him.</p><img src="https://res.bibleox.com/s/img/image/simple/478/s_p_yvJcnbLGPxZ6AzRu.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/478/m_p_yvJcnbLGPxZ6AzRu.jpg">larger</a>]</p><p>The prophet Jonah</p><img src="https://res.bibleox.com/s/img/image/simple/481/s_p_7z5j4tAimokFaRMN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/481/m_p_7z5j4tAimokFaRMN.jpg">larger</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/480/s_p_b8gqyOenKZcn2MCp.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/480/m_p_b8gqyOenKZcn2MCp.jpg">larger</a>]</p><h3>Christ as the Good Shepherd</h3><p>3rd century. Rome. The Catacomb of Callixtus (<a href="https://en.wikipedia.org/wiki/Catacomb_of_Callixtus#Paintings">Callixitus Catacomb, Crypt of Lucina</a>). One may suppose that the pail holds milk, a symbol of the Eucharist (see Clement of Alexandria).</p><img src="https://res.bibleox.com/s/img/image/simple/474/s_p_zcLmMd2qkyG3pDoj.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/474/m_p_zcLmMd2qkyG3pDoj.jpg">larger</a>]</p><h3>The Good Shepherd, Hisartepe necropolis, Nicaea (İznik)</h3><p>c. 3rd century. The find is recent and the date is tentative (<a href="https://www.arkeolojikhaber.com/haber-iznikte-benzersiz-bir-kesif-anadolunun-tek-coban-isa-figuru-gun-yuzune-cikarildi-43079/">more</a>). This necropolis was used from the 2nd to the 5th century.</p><p>Coordinates: 40.78204218462122, 29.928491677648932. The local name in Turkish: Hasartep Nekropolü.</p><img src="https://res.bibleox.com/s/img/image/simple/69444e49205184ec278d6fdb/s_p_SZTpvcDdpodujcbM.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69444e49205184ec278d6fdb/m_p_SZTpvcDdpodujcbM.jpg">larger</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6941a813205184ec278d6fda/s_p_CUoa7dSy5UxGf1UD.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6941a813205184ec278d6fda/m_p_CUoa7dSy5UxGf1UD.jpg">larger</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6941a80f205184ec278d6fd9/m_p_xSCaRt10DUUReyMt.jpg">version 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/693c7d1a205184ec278d6fcb/m_p_mR5ZaVgXbezmXDyo.jpg">version 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/693d606b205184ec278d6fd3/m_p_TKCjvhxmnq0q50tW.jpg">version 4</a>] [<a href="https://res.bibleox.com/s/img/image/simple/693d6101205184ec278d6fd7/m_p_1i6aL6lfDR08iA13.jpg">version 5</a>] [<a href="https://res.bibleox.com/s/img/image/simple/693d60f8205184ec278d6fd6/m_p_b2uUaO6tzciaKAgC.jpg">version 6</a>] [<a href="https://res.bibleox.com/s/img/image/simple/693d60f1205184ec278d6fd5/m_p_bErh7lbI0e08hPaa.jpg">version 7</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/693c7db2205184ec278d6fd2/s_p_wCZsWPWG7jCNLjIr.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/693c7db2205184ec278d6fd2/m_p_wCZsWPWG7jCNLjIr.jpg">larger</a>] [<a href="https://res.bibleox.com/s/img/image/simple/693d60ad205184ec278d6fd4/m_p_BCvsIiJX10j2Mf2k.jpg">man and woman</a>] [<a href="https://res.bibleox.com/s/img/image/simple/693c7daa205184ec278d6fd1/m_p_cjk36Xjpev9EFq2h.jpg">woman</a>]</p><h3>A wedding ring (Byzantium)</h3><p>3rd–4th century. <a href="https://www.metmuseum.org/art/collection/search/663485">The Metropolitan Museum of Art, Fifth Avenue, USA</a>. (Greek χάρις, “grace”)</p><img src="https://res.bibleox.com/s/img/image/simple/68b5da8b45c75323d28a5e99/s_p_GNh1S8L7fcowsMEE.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5da8b45c75323d28a5e99/m_p_GNh1S8L7fcowsMEE.jpg">larger</a>]</p><h3>The celebration of the Eucharist</h3><p>3rd century. Rome. The Catacomb of Callixtus (<a href="https://en.wikipedia.org/wiki/Catacomb_of_Callixtus#Paintings">Callixitus Catacomb, Crypt of Lucina</a>). Probably a priest is shown with a deacon serving with him. So the Eucharist is celebrated in Orthodox churches today too: the priest raises both hands, and the deacon points to the holy gifts.</p><img src="https://res.bibleox.com/s/img/image/simple/479/s_p_Zbn405P2krjwNAYl.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/479/m_p_Zbn405P2krjwNAYl.jpg">larger</a>]</p><h2>4th Century</h2><h3>Christ (Rome)</h3><p>The Catacomb of Commodilla.</p><img src="https://res.bibleox.com/s/img/image/simple/66cc2bd6dba77200019bc7d2/s_p_7xYGBb9wCmxBIGrZ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/66cc2bd6dba77200019bc7d2/m_p_7xYGBb9wCmxBIGrZ.jpg">larger</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686d23425f47da2505d3ae55/s_p_LzqgbhnIsbqtghoc.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d23425f47da2505d3ae55/m_p_LzqgbhnIsbqtghoc.jpg">larger</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a1e1205184ec278d6fa8/m_p_KC0MljXJf5po70pj.jpg">version 2</a>]</p><h3>Christ and the apostles (Rome)</h3><p>c. 350. [8][9] The Mausoleum of Santa Costanza.</p><img src="https://res.bibleox.com/s/img/image/simple/686990665f47da2505d3ae19/s_p_5RDr4ou4ExBAh4KE.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686990665f47da2505d3ae19/m_p_5RDr4ou4ExBAh4KE.jpg">larger</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686990425f47da2505d3ae17/s_p_CXn5KmuiWradhOvh.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686990425f47da2505d3ae17/m_p_CXn5KmuiWradhOvh.jpg">larger</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686990545f47da2505d3ae18/s_p_IkgteAcecXoMC106.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686990545f47da2505d3ae18/m_p_IkgteAcecXoMC106.jpg">larger</a>]</p><h3>The Baptistery of San Giovanni in Fonte (Naples)</h3><p>350–400. [11][12]</p><img src="https://res.bibleox.com/s/img/image/simple/6869924c5f47da2505d3ae1a/s_p_t1iU8sClY3pnOnkK.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6869924c5f47da2505d3ae1a/m_p_t1iU8sClY3pnOnkK.jpg">larger</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686992505f47da2505d3ae1b/s_p_BrRKZmtReJbgXm0w.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686992505f47da2505d3ae1b/m_p_BrRKZmtReJbgXm0w.jpg">larger</a>]</p><h3>Christ and angels, the Second Coming (Thessaloniki, Byzantium)</h3><p>Late 4th century. [17][18] The Rotunda of St George the Victorious (originally the tomb of Emperor Galerius).</p><img src="https://res.bibleox.com/s/img/image/simple/6931a254205184ec278d6fa9/s_p_bWn7Chqiox5UOEd4.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931a254205184ec278d6fa9/m_p_bWn7Chqiox5UOEd4.jpg">larger</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a2ba205184ec278d6faa/m_p_ROPWmBVyUxWMGo9Z.jpg">version 2</a>]</p><p>The mosaic is poorly preserved. Of the image of Christ only a piece of the halo, a hand and the cross remain. The faces of the angels around are clearly visible.</p><img src="https://res.bibleox.com/s/img/image/simple/686a91695f47da2505d3ae1f/s_p_EoOSmhaBPsy32XQQ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686a91695f47da2505d3ae1f/m_p_EoOSmhaBPsy32XQQ.jpg">larger</a>]</p><h3>Holy bishops, soldiers, physicians (Thessaloniki, Byzantium)</h3><p>Late 4th century. [17][18] The Rotunda of St George the Victorious (originally the tomb of Emperor Galerius).</p><p>Among the mosaics are images of holy bishops, soldiers, physicians and musicians with the names Romanus, Cyril, Leo, Onesiphorus, Eucarpius, Basiliscus, Porphyrius, Philemon, Priscus, Therinus, Cosmas and Damian.</p><img src="https://res.bibleox.com/s/img/image/simple/686aa0275f47da2505d3ae21/s_p_oIksDo9rIgSoAXvG.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa0275f47da2505d3ae21/m_p_oIksDo9rIgSoAXvG.jpg">larger</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686aa02e5f47da2505d3ae22/s_p_nTZtC6C93KI8Fu6I.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa02e5f47da2505d3ae22/m_p_nTZtC6C93KI8Fu6I.jpg">larger</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686aa0335f47da2505d3ae23/s_p_b1KhWllqTzipVhO9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa0335f47da2505d3ae23/m_p_b1KhWllqTzipVhO9.jpg">larger</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686aa0385f47da2505d3ae24/s_p_vvlbG9E89B9T0U8j.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa0385f47da2505d3ae24/m_p_vvlbG9E89B9T0U8j.jpg">larger</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686aa03f5f47da2505d3ae25/s_p_d3lcRobegfAQOf6e.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa03f5f47da2505d3ae25/m_p_d3lcRobegfAQOf6e.jpg">larger</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686aa0555f47da2505d3ae27/s_p_h1YgFpMukwaYc23Q.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa0555f47da2505d3ae27/m_p_h1YgFpMukwaYc23Q.jpg">larger</a>]</p><p>Sts Cosmas and Damian</p><img src="https://res.bibleox.com/s/img/image/simple/686aa04e5f47da2505d3ae26/s_p_LwMjPHLsabDDxEHy.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa04e5f47da2505d3ae26/m_p_LwMjPHLsabDDxEHy.jpg">larger</a>]</p><h3>An image of Christ crucified between the thieves (Rome)</h3><p>Early 4th century [the doors are usually dated to c. 430]. The Basilica of Santa Sabina, one of the door panels. A carved relief of the Crucifixion.</p><img src="https://res.bibleox.com/s/img/image/simple/676183a8dba7720001cd0e2b/s_p_ccaA7HzLPDInwe1b.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/676183a8dba7720001cd0e2b/m_p_ccaA7HzLPDInwe1b.jpg">larger</a>]</p><h3>The Lord’s Entry into Jerusalem (Byzantium)</h3><p>Early 4th century. <a href="https://www.metmuseum.org/art/collection/search/466220">The Metropolitan Museum of Art, Fifth Avenue, USA</a>. 67.3 × 212.1 × 61.9 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5e69845c75323d28a5e9d/s_p_Kk1dIB2OLr1OjQ1O.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5e69845c75323d28a5e9d/m_p_Kk1dIB2OLr1OjQ1O.jpg">larger</a>]</p><h3>Christ, a slab (Chersonesus)</h3><p>300–500. <a href="https://collections.louvre.fr/en/ark:/53355/cl010276835">The Louvre, France</a>. The museum states that the other part is kept in the Hermitage. Words addressed to the apostle Peter are engraved on it.</p><img src="https://res.bibleox.com/s/img/image/simple/68c41cec6594f46d35a87f04/s_p_esWl4etLsBMVz9bw.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c41cec6594f46d35a87f04/m_p_esWl4etLsBMVz9bw.jpg">larger</a>]</p><h3>Christ the Teacher (Rome)</h3><p>The Catacomb of Domitilla. Painting in the lunette of a cubiculum.</p><img src="https://res.bibleox.com/s/img/image/simple/674ed2a4dba77200011c738a/s_p_4M8Vki7GNJBHkJPN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674ed2a4dba77200011c738a/m_p_4M8Vki7GNJBHkJPN.jpg">larger</a>]</p><h3>The Lord Jesus Christ (Rome)</h3><p>3rd–5th century. The Catacomb of Generosa [7]</p><img src="https://res.bibleox.com/s/img/image/simple/674f2408dba77200011c739c/s_p_zVliPTIYBpqqnTGQ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f2408dba77200011c739c/m_p_zVliPTIYBpqqnTGQ.jpg">larger</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6931a55a205184ec278d6faf/s_p_xXRXPudiFDi6GltL.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931a55a205184ec278d6faf/m_p_xXRXPudiFDi6GltL.jpg">larger</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686bf5b25f47da2505d3ae36/m_p_Io7kaT9uNdBPFcSj.jpg">version 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a5b6205184ec278d6fb0/m_p_btFyqkRBFzGf0FSH.jpg">version 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a5e4205184ec278d6fb1/m_p_wuVaj4ghYuk6s5cc.jpg">version 4</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a5fe205184ec278d6fb2/m_p_mO6KaZXywWX76vBg.jpg">version 5</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a656205184ec278d6fb3/m_p_eqLfG1BFyG45i90X.jpg">version 6</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a858205184ec278d6fb5/m_p_EVVCP1plDQZ4XgAS.jpg">version 7</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6931a360205184ec278d6fab/s_p_hObpAcapDVZvLsC1.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931a360205184ec278d6fab/m_p_hObpAcapDVZvLsC1.jpg">larger</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6931a369205184ec278d6fad/s_p_8bP3aXtUgkNcP9gz.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931a369205184ec278d6fad/m_p_8bP3aXtUgkNcP9gz.jpg">larger</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6931a363205184ec278d6fac/s_p_BcSN3IXA4JYFLpgA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931a363205184ec278d6fac/m_p_BcSN3IXA4JYFLpgA.jpg">larger</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6931a36f205184ec278d6fae/s_p_6J6vSMM0TM5tc59T.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931a36f205184ec278d6fae/m_p_6J6vSMM0TM5tc59T.jpg">larger</a>]</p><h3>Saints Viatrix and Simplicius (or Rufus) (Rome)</h3><p>3rd–5th century. The Catacomb of Generosa [7]</p><img src="https://res.bibleox.com/s/img/image/simple/66cc2c40dba77200019bc7d8/s_p_zABjPHGhPdjGVh3U.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/66cc2c40dba77200019bc7d8/m_p_zABjPHGhPdjGVh3U.jpg">larger</a>]</p><h3>The apostles Peter and Paul (Rome)</h3><p>c. 380. The Catacomb of Santa Tecla (St Thecla), fresco [24]</p><p>The apostles shown are Peter, Paul, Andrew and John.</p><img src="https://res.bibleox.com/s/img/image/simple/686bf38e5f47da2505d3ae35/s_p_BxfiObhkLMfci8nP.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686bf38e5f47da2505d3ae35/m_p_BxfiObhkLMfci8nP.jpg">larger</a>] [<a href="https://res.bibleox.com/s/img/image/simple/687291145f47da2505d3ae8b/m_p_WXlkaMJTOrIzlOdI.jpg">version 2</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/68b6cd4802e89ba22dfc3977/s_p_kAWGH2VPHMkRv9cL.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b6cd4802e89ba22dfc3977/m_p_kAWGH2VPHMkRv9cL.jpg">larger</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686bf5bf5f47da2505d3ae37/m_p_F0tsoqA9bv6CrpfE.jpg">version 2</a>]</p><h3>The apostles Peter and Paul (Byzantium)</h3><p>Mid-4th century. Christ gives the crowns of martyrdom to the apostles Peter and Paul. <a href="https://www.metmuseum.org/art/collection/search/463547">The Metropolitan Museum of Art, Fifth Avenue, USA</a>. Rome or Byzantium. 13.8 × 12.5 × 5 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5f5d745c75323d28a5ebc/s_p_MiCffui3hayo2BCt.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5f5d745c75323d28a5ebc/m_p_MiCffui3hayo2BCt.jpg">larger</a>]</p><hr><p>Mid-4th century. <a href="https://www.metmuseum.org/art/collection/search/468386">The Metropolitan Museum of Art, Fifth Avenue, USA</a>. Rome or Byzantium. 8.5 × 14 × 13.3 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5e89c45c75323d28a5ea1/s_p_HAfNPGdEHMp67CuN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5e89c45c75323d28a5ea1/m_p_HAfNPGdEHMp67CuN.jpg">larger</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5e88f45c75323d28a5ea0/m_p_gvro4Ry9POJUm0nR.jpg">side view</a>]</p><hr><p>Late 4th century. <a href="https://www.metmuseum.org/art/collection/search/463714">The Metropolitan Museum of Art, Fifth Avenue, USA</a>. Glass, gold leaf.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5e68b45c75323d28a5e9c/s_p_uRLyImBPPDsr48G2.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5e68b45c75323d28a5e9c/m_p_uRLyImBPPDsr48G2.jpg">larger</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5e76d45c75323d28a5e9e/m_p_62cHpid14wgeSyqc.jpg">version 2</a>]</p><hr><p>Mid-4th century. The apostles Peter and Paul, Peregrina. <a href="https://www.metmuseum.org/art/collection/search/465922">The Metropolitan Museum of Art, Fifth Avenue, USA</a>. 11.5 × 13.3 × 1.2 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5e7d145c75323d28a5e9f/s_p_atDwcEc3h2ZyYLRb.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5e7d145c75323d28a5e9f/m_p_atDwcEc3h2ZyYLRb.jpg">larger</a>]</p><h3>The apostles Peter and Paul (Rome)</h3><p>4th century. A slab used to close a child’s burial niche (loculus) in the catacombs. Rome, Vatican Museums, Pius Christian Museum.</p><img src="https://res.bibleox.com/s/img/image/simple/674f1bc0dba77200011c739a/s_p_uH3btIsNTUn6lHGQ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f1bc0dba77200011c739a/m_p_uH3btIsNTUn6lHGQ.jpg">larger</a>]</p><h3>The Theotokos with the Child Christ (Rome)</h3><p>3rd–4th century. The Catacomb of Domitilla.</p><img src="https://res.bibleox.com/s/img/image/simple/66cc2c11dba77200019bc7d5/s_p_rZQc8oqW4YIrUMho.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/66cc2c11dba77200019bc7d5/m_p_rZQc8oqW4YIrUMho.jpg">larger</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686d246b5f47da2505d3ae57/m_p_AZTFv8hTAm4Eo9yp.jpg">version 2</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686d24885f47da2505d3ae58/s_p_Z1QqJZuraUn8iLSV.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d24885f47da2505d3ae58/m_p_Z1QqJZuraUn8iLSV.jpg">larger</a>]</p><h3>A cross with an image of Christ (Byzantium)</h3><p>395–641. <a href="https://collections.louvre.fr/en/ark:/53355/cl010043937">The Louvre, France</a>. 8.5 × 20 × 1.2 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c5886594f46d35a87ec7/s_p_wU3HuTavyFqHCHIc.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c5886594f46d35a87ec7/m_p_wU3HuTavyFqHCHIc.jpg">larger</a>]</p><h3>An icon (Egypt)</h3><p>395–641. <a href="https://collections.louvre.fr/en/ark:/53355/cl010049211">The Louvre, France</a>. 24 × 17.5 cm</p><img src="https://res.bibleox.com/s/img/image/simple/68c3bf006594f46d35a87ebf/s_p_m1O6PHgeoR9L2huf.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3bf006594f46d35a87ebf/m_p_m1O6PHgeoR9L2huf.jpg">larger</a>]</p><hr><p><a href="https://collections.louvre.fr/en/ark:/53355/cl010049209">The Louvre, France</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c8966594f46d35a87ec8/s_p_hfH86ZqQDaRWHKRA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c8966594f46d35a87ec8/m_p_hfH86ZqQDaRWHKRA.jpg">larger</a>]</p><h3>An ampulla with an icon of St Menas (Byzantium)</h3><p>395–641. <a href="https://collections.louvre.fr/en/ark:/53355/cl010042774">The Louvre, France</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c4176594f46d35a87ec3/s_p_RYRsljTrixb3giuP.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c4176594f46d35a87ec3/m_p_RYRsljTrixb3giuP.jpg">larger</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c3c4196594f46d35a87ec4/m_p_20KqaRLqoxUISfqB.jpg">reverse side</a>]</p><hr><p>395–641. <a href="https://collections.louvre.fr/en/ark:/53355/cl010042778">The Louvre, France</a>. Ampullae like this are found in very large numbers in various museums. More examples: <a href="https://collections.louvre.fr/en/ark:/53355/cl010042780">1</a>, <a href="https://collections.louvre.fr/en/ark:/53355/cl010042798">2</a>, <a href="https://collections.louvre.fr/en/ark:/53355/cl010042802">3</a>, <a href="https://collections.louvre.fr/en/ark:/53355/cl010043779">4</a>, <a href="https://collections.louvre.fr/en/ark:/53355/cl010076645">5</a>, <a href="https://collections.louvre.fr/en/ark:/53355/cl010051239">6</a>, <a href="https://collections.louvre.fr/en/ark:/53355/cl010263188">7</a>, <a href="https://collections.louvre.fr/en/ark:/53355/cl010280896">8</a>, <a href="https://collections.louvre.fr/en/ark:/53355/cl010044285">9</a>, <a href="https://collections.louvre.fr/en/ark:/53355/cl010280846">10</a>, <a href="https://collections.louvre.fr/en/ark:/53355/cl010280894">11</a>, <a href="https://www.clevelandart.org/art/1999.232">12</a>, <a href="https://www.clevelandart.org/art/1999.233">13</a>, <a href="https://www.clevelandart.org/art/1999.231">14</a>, <a href="https://www.clevelandart.org/art/1999.230">15</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c4c66594f46d35a87ec5/s_p_b5etRE60QJjNF7zQ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c4c66594f46d35a87ec5/m_p_b5etRE60QJjNF7zQ.jpg">larger</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c4cd6594f46d35a87ec6/s_p_vJbng6ICUUefTimC.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c4cd6594f46d35a87ec6/m_p_vJbng6ICUUefTimC.jpg">larger</a>]</p><h3>A lead ampulla with an image of the Theotokos and Christ (Italy, Bologna)</h3><p>4th–5th century. “Such ampullae with holy oil from the holy places were brought in great numbers by pilgrims from the East, namely from Palestine, to which pilgrimages became established from the end of the 4th century and in great numbers in the first half of the fifth” [27]</p><img src="https://res.bibleox.com/s/img/image/simple/686d3bdc5f47da2505d3ae5f/s_p_gcwh26YTfBvz5FbR.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d3bdc5f47da2505d3ae5f/m_p_gcwh26YTfBvz5FbR.jpg">larger</a>]</p><h2>5th Century</h2><h3>The Theotokos with the Child Jesus, the martyrs Felix and Adauctus, the widow Commodilla (Rome)</h3><p>5th–6th century. The Catacomb of Commodilla. In the left foreground is the widow Commodilla, a wealthy Roman woman in whose memory the catacomb church was built.</p><img src="https://res.bibleox.com/s/img/image/simple/674edb84dba77200011c738c/s_p_urBcFMzNnn49NanW.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674edb84dba77200011c738c/m_p_urBcFMzNnn49NanW.jpg">larger</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686bf61f5f47da2505d3ae38/m_p_gOZdkzGPGcL4Vws0.jpg">version 2</a>]</p><h3>Christ and the Theotokos (Byzantium)</h3><p>400–500. Material: gold. 3.7 × 4 × 0.3 cm; weight: 4.04 g. <a href="https://collections.louvre.fr/en/ark:/53355/cl010256498">The Louvre, France</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c403846594f46d35a87efb/s_p_Ahj64DxPe313azhi.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c403846594f46d35a87efb/m_p_Ahj64DxPe313azhi.jpg">larger</a>]</p><h3>The martyr Lawrence (Ravenna)</h3><p>425. The Mausoleum of Galla Placidia[1][2][25]. In the open cabinet are the 4 Gospels: Mark, Matthew, Luke and John. The saint, holding a cross and an open Gospel, goes toward the gridiron, under which a fire is burning.</p><img src="https://res.bibleox.com/s/img/image/simple/674ee461dba77200011c738e/s_p_EPEyZAtXMtLhz0vO.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674ee461dba77200011c738e/m_p_EPEyZAtXMtLhz0vO.jpg">larger</a>]</p><h3>The apostle Paul (Ephesus)</h3><p>A late 5th-century fresco in the Grotto of St Paul[4].</p><img src="https://res.bibleox.com/s/img/image/simple/674f2a67dba77200011c73a0/s_p_Og6LudyAS5axVwrH.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f2a67dba77200011c73a0/m_p_Og6LudyAS5axVwrH.jpg">larger</a>]</p><h3>The apostle Paul (Naples)</h3><p>Late 5th century. The Catacombs of San Gennaro, fresco. Probably the apostle Paul is depicted.</p><img src="https://res.bibleox.com/s/img/image/simple/674f2705dba77200011c739d/s_p_XdEMnSngRpC4ver8.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f2705dba77200011c739d/m_p_XdEMnSngRpC4ver8.jpg">larger</a>]</p><h3>Thecla of Iconium, martyr (Ephesus)</h3><p>The Grotto of Sts Paul and Thecla. She came to faith through the preaching of the apostle Paul, a martyr of the first centuries. In 2013 the grotto was desecrated by Islamist militants[4].</p><img src="https://res.bibleox.com/s/img/image/simple/674f2c2edba77200011c73a1/s_p_tCvOXPpRP5ogjE1Y.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f2c2edba77200011c73a1/m_p_tCvOXPpRP5ogjE1Y.jpg">larger</a>]</p><h3>The Great Martyr Demetrius of Thessaloniki and an angel (Thessaloniki, Byzantium)</h3><p>5th–6th century. The Basilica of St Demetrius in Thessaloniki. A mosaic in the western part of the church [10]</p><img src="https://res.bibleox.com/s/img/image/simple/686984705f47da2505d3ae11/s_p_bliIzjPrQcGjWmMT.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686984705f47da2505d3ae11/m_p_bliIzjPrQcGjWmMT.jpg">larger</a>]</p><h3>The Great Martyr Demetrius of Thessaloniki and a child (Thessaloniki, Byzantium)</h3><p>5th–6th century. The Basilica of St Demetrius in Thessaloniki. A mosaic on the west wall of the south aisle [10]</p><img src="https://res.bibleox.com/s/img/image/simple/68697c845f47da2505d3ae10/s_p_T8JYB6OgB0WUM8O6.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68697c845f47da2505d3ae10/m_p_T8JYB6OgB0WUM8O6.jpg">larger</a>]</p><h3>A senator’s house, Santa Pudenziana (Rome)</h3><p>402–417. [13][14]</p><img src="https://res.bibleox.com/s/img/image/simple/6869938e5f47da2505d3ae1c/s_p_l5Dokt3jzLvx6IxN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6869938e5f47da2505d3ae1c/m_p_l5Dokt3jzLvx6IxN.jpg">larger</a>]</p><h3>Santa Maria Maggiore (Rome)</h3><p>432–440. [15][16]</p><img src="https://res.bibleox.com/s/img/image/simple/6869954e5f47da2505d3ae1d/s_p_0bDTRtbRpWWnfPQR.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6869954e5f47da2505d3ae1d/m_p_0bDTRtbRpWWnfPQR.jpg">larger</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686995555f47da2505d3ae1e/s_p_FLcJtADykEgKNDDd.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686995555f47da2505d3ae1e/m_p_FLcJtADykEgKNDDd.jpg">larger</a>]</p><h3>Christ, the three youths, the Magi (Northern Italy)</h3><p>400–450. <a href="https://collections.louvre.fr/en/ark:/53355/cl010256191">The Louvre, France</a>. Silver, 6.3 × 12.3 × 7.1 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c1756594f46d35a87ec1/s_p_WzOTF3me39ISTfnN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c1756594f46d35a87ec1/m_p_WzOTF3me39ISTfnN.jpg">larger</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c1796594f46d35a87ec2/s_p_a0udZW5EPewQCqsl.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c1796594f46d35a87ec2/m_p_a0udZW5EPewQCqsl.jpg">larger</a>]</p><h3>An icon: the apostle Peter dictates the Gospel to St Mark (Egypt)</h3><p>440–670. <a href="https://www.metmuseum.org/art/collection/search/477163">The Metropolitan Museum of Art, Fifth Avenue, USA</a>. 13.5 × 10 × 0.8 cm. See also: <a href="https://www.metmuseum.org/art/collection/search/477492">1</a>, <a href="https://www.metmuseum.org/art/collection/search/477487">2</a>, <a href="https://www.metmuseum.org/art/collection/search/477481">3</a>, <a href="https://www.metmuseum.org/art/collection/search/477489">4</a>, <a href="https://www.metmuseum.org/art/collection/search/477491">5</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c1c2f56594f46d35a87e74/s_p_BWhcee0cn10mz7dc.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1c2f56594f46d35a87e74/m_p_BWhcee0cn10mz7dc.jpg">larger</a>]</p><h3>An unknown saint (Byzantium, Egypt)</h3><p>5th–6th century. <a href="https://www.metmuseum.org/art/collection/search/329982">The Metropolitan Museum of Art, Fifth Avenue, USA</a>. 44 × 32.5 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5eb2d45c75323d28a5ea3/s_p_E5UUO66hSfRBtXUn.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5eb2d45c75323d28a5ea3/m_p_E5UUO66hSfRBtXUn.jpg">larger</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5eb2845c75323d28a5ea2/m_p_ofbMCUTa1winWDg0.jpg">version 2</a>]</p><h3>An ampulla with an image of St Menas (Coptic Egypt)</h3><p>5th–7th century. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/87092?query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=34">The Hermitage, Russia</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c0796480b4d285320413/s_p_sW3adkK7lr960dU5.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c0796480b4d285320413/m_p_sW3adkK7lr960dU5.jpg">larger</a>]</p><hr><p>5th–6th century. An ampulla with an image of St Menas (Egypt). <a href="https://www.metmuseum.org/art/collection/search/854993">The Metropolitan Museum of Art, Fifth Avenue, USA</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5f3f845c75323d28a5eb8/s_p_ePhTgphiYrxHdEaZ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5f3f845c75323d28a5eb8/m_p_ePhTgphiYrxHdEaZ.jpg">larger</a>]</p><hr><p>5th–6th century. An ampulla with an image of St Menas (Egypt). <a href="https://www.metmuseum.org/art/collection/search/854994">The Metropolitan Museum of Art, Fifth Avenue, USA</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5f40645c75323d28a5eb9/s_p_5HMBehehtBuCUdOm.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5f40645c75323d28a5eb9/m_p_5HMBehehtBuCUdOm.jpg">larger</a>]</p><h3>A ring with an image of Christ (Egypt, Luxor)</h3><p>5th–7th century. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/111849?page=5&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%B0&amp;index=240">The Hermitage, Russia</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c4d46480b4d285320420/s_p_SyuBoqgvHXMA5UIe.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c4d46480b4d285320420/m_p_SyuBoqgvHXMA5UIe.jpg">larger</a>]</p><h2>6th Century</h2><h3>The Lord Jesus Christ (Sinai)</h3><p>6th century. St Catherine’s Monastery, Egypt [3].</p><img src="https://res.bibleox.com/s/img/image/simple/686fe7935f47da2505d3ae87/s_p_cikLnQnMeZgiaeXg.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686fe7935f47da2505d3ae87/m_p_cikLnQnMeZgiaeXg.jpg">larger</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6872d4935f47da2505d3ae90/m_p_1CbtDgulMkyLj9dK.jpg">version 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6872d4835f47da2505d3ae8d/m_p_IPypUclQUGcqTIJa.jpg">version 3</a>]</p><h3>The Theotokos with the Child Jesus, Saints Theodore and George (Sinai)</h3><p>6th century. St Catherine’s Monastery. An encaustic icon, Egypt.</p><img src="https://res.bibleox.com/s/img/image/simple/674ece56dba77200011c7384/s_p_RWNQK8qhzLwXxGkf.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674ece56dba77200011c7384/m_p_RWNQK8qhzLwXxGkf.jpg">larger</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6872d4895f47da2505d3ae8e/m_p_6JgREZVUzpO8lC9E.jpg">version 2</a>]</p><h3>The apostle Peter (Sinai)</h3><p>6th century. St Catherine’s Monastery. An encaustic icon, Egypt.</p><img src="https://res.bibleox.com/s/img/image/simple/686fe28f5f47da2505d3ae82/s_p_tWJyRADNEjI9Gt5J.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686fe28f5f47da2505d3ae82/m_p_tWJyRADNEjI9Gt5J.jpg">larger</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686fe73d5f47da2505d3ae86/m_p_ztqtzVnOwMfzjCsd.jpg">version 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6872d48f5f47da2505d3ae8f/m_p_x4BAyJ0C1GjHQ7Us.jpg">version 3</a>]</p><h3>The Theotokos and the Christ Child (Byzantium)</h3><p>6th century. <a href="https://www.metmuseum.org/art/collection/search/463392">The Metropolitan Museum of Art, Fifth Avenue, USA</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5fce645c75323d28a5ec5/s_p_KB8coyb4H50zurQW.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5fce645c75323d28a5ec5/m_p_KB8coyb4H50zurQW.jpg">larger</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5fce945c75323d28a5ec6/m_p_eIaeevwinjFBQAeA.jpg">version 2</a>]</p><h3>A ring with an icon of the Theotokos and the Christ Child (Byzantium)</h3><p>6th–7th century. <a href="https://www.metmuseum.org/art/collection/search/464059">The Metropolitan Museum of Art, Fifth Avenue, USA</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5fe7745c75323d28a5ec7/s_p_bcCSRfNkRmmk5jZs.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5fe7745c75323d28a5ec7/m_p_bcCSRfNkRmmk5jZs.jpg">larger</a>]</p><h3>Saint Mary</h3><p>611, <a href="https://www.pravenc.ru/text/164537.html">Gerasa</a></p><img src="https://res.bibleox.com/s/img/image/simple/482/s_p_s3flMTpYpn69iMIy.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/482/m_p_s3flMTpYpn69iMIy.jpg">larger</a>]</p><h3>Christ, a medallion (Antioch)</h3><p>500–625. Material: silver, gilding. 14.9 × 14.1 × 1.1 cm. <a href="https://collections.louvre.fr/en/ark:/53355/cl010256496">The Louvre, France</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c409da6594f46d35a87f00/s_p_BHIOy3tEZ3ZoMEr5.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c409da6594f46d35a87f00/m_p_BHIOy3tEZ3ZoMEr5.jpg">larger</a>]</p><hr><p>500–625. <a href="https://collections.louvre.fr/en/ark:/53355/cl010256495">The Louvre, France</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c41f626594f46d35a87f05/s_p_bKgaW542SgyD11o9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c41f626594f46d35a87f05/m_p_bKgaW542SgyD11o9.jpg">larger</a>]</p><h3>A tapestry with icons: Christ, the Theotokos, the archangels Michael and Gabriel, the apostles (Egypt, Byzantium)</h3><p>500. <a href="https://www.clevelandart.org/art/1967.144">The Cleveland Museum of Art, USA</a>. Wool, 178.7 × 110.5 cm.</p><p>The museum’s commentary:</p><blockquote><p>Made of wool threads in more than twenty colors, this rare tapestry was in its day more expensive than a painting. Its historical price reflected how highly contemporaries valued the masterly blending of colors achieved by the weavers. Hung on a wall, <strong>this woven icon allowed the faithful to venerate the Virgin and the Christ Child inside an Orthodox church</strong>. They are surrounded by angels and apostles, with their names written in Greek. To be spiritually effective, an icon (a sacred image) had to follow the established pictorial tradition of its image as closely as possible.</p><p>The inscription on the lintel of the architectural frame translates from the Greek as “<strong>Saint Michael, Saint Mary, Saint Gabriel</strong>”. The broad leafy border is decorated with fruit and flowers, and at the bottom with medallions bearing busts of the apostles, whose names are written beside them in Greek and translate as “<strong>Andrew, Matthew, the apostle Paul, Luke, James, Philip, Mark, Thomas, John, Matthias, Peter and Bartholomew</strong>”.</p></blockquote><img src="https://res.bibleox.com/s/img/image/simple/68cb9dd5205184ec278d58d7/s_p_jXuLxO8mwNy5DicO.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68cb9dd5205184ec278d58d7/m_p_jXuLxO8mwNy5DicO.jpg">larger</a>]</p><h3>A tapestry with icons. The three youths(?), a chi-rho (Egypt, Byzantium)</h3><p>500s. <a href="https://www.clevelandart.org/art/1982.73">The Cleveland Museum of Art, USA</a>. Wool, linen. 110.5 × 76.8 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68cb9dde205184ec278d58d8/s_p_w5vxLEtZSz6mW36r.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68cb9dde205184ec278d58d8/m_p_w5vxLEtZSz6mW36r.jpg">larger</a>]</p><h3>A tapestry with icons. The Theotokos, the Magi, the prophet Jonah (Egypt, Byzantium)</h3><p>500–550. <a href="https://www.clevelandart.org/art/1951.400">The Cleveland Museum of Art, USA</a>. Linen. 99.7 × 104.8 cm.</p><p>The museum’s commentary:</p><blockquote><p>… On the left of the upper register <strong>the Virgin Mary with the Christ Child</strong> is shown on a stool with cross-shaped legs. As the Coptic inscription states, <strong>the three kings approach from the right, bearing gifts</strong>. The left of the middle register probably shows <strong>the Baptism of Christ</strong>, while three other figures, separated by columns, seem to illustrate the New Testament miracle in which Christ fed a great crowd with only five loaves and two fish. In the lower register <strong>the Old Testament scene of the prophet Jonah being swallowed by the whale</strong> is still recognizable.</p><p>Greek inscriptions identify various scenes from the Old and New Testaments. Above the first of the Magi in the upper register two letters <strong>“XP”</strong> can be made out, from the Greek word for gold (<em>χρυσός, chrysós</em>). On the left of the middle register two figures are shown: the first is almost completely destroyed, and the second is identified by the inscription <strong>“EIΩANNHC” (John)</strong>. The lower register shows Jonah cast up on the shore, with a large fish beside him, accompanied by the inscription <strong>“EIΩNAC” (Jonah)</strong>. Moses, almost entirely lost, can be identified only by his inscription <strong>“MWCHC” (Moses)</strong>.</p></blockquote><img src="https://res.bibleox.com/s/img/image/simple/68cb9e0d205184ec278d58d9/s_p_WiTqygXUYCZZY7TF.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68cb9e0d205184ec278d58d9/m_p_WiTqygXUYCZZY7TF.jpg">larger</a>]</p><h3>Eucharistic chalices and censers with icons (Byzantium, Syria, Attarouthi)</h3><p>500–650. <a href="https://www.metmuseum.org/art/collection/search/474390">The Metropolitan Museum of Art, Fifth Avenue, USA</a>. Silver, gilding. On the chalices are icons of the Lord and the saints, and inscriptions saying by whom and to whom they were donated.</p><p>These finely made liturgical objects, chalices, censers, a strainer and an image of the dove of the Holy Spirit, belonged to a Christian church in the rich trading town of Attarouthi in Syria, then one of the richest lands of the Byzantine Empire. The chalices, censers and strainer were used at the Divine Liturgy, or Eucharist, the sacrament in which Christians partake of the consecrated wine and bread in memory of the Last Supper and the death of Christ.</p><p>According to their inscriptions, written in Greek with a few spelling variations, many of these objects were donated by local people to the town’s main church, dedicated to St Stephen, and to a smaller church dedicated to St John (probably John the Forerunner [the Baptist]).</p><p>At the beginning of the 7th century Syria fell first to the Sasanian Persians and then to the armies of Islam. These works were probably buried in haste in a protective container when the Byzantine army was retreating before those attacking the region.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5db2045c75323d28a5e9a/s_p_kx70rC7wWJQtkfdG.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5db2045c75323d28a5e9a/m_p_kx70rC7wWJQtkfdG.jpg">larger</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5edf045c75323d28a5ea5/m_p_Eru1rmuua6UWqjTz.jpg">version 2</a>]</p><hr><p>John the Forerunner with long hair, the Theotokos in the orans posture (with raised hands), a saint in the orans posture, a soldier saint with a staff and a shield, the young Christ with a cross-nimbus, and another soldier saint in armor slaying a dragon (St George?), under arcades. <a href="https://www.metmuseum.org/art/collection/search/466137">The Metropolitan Museum of Art, Fifth Avenue, USA</a>. 21.3 × 16 cm.</p><p>The Greek inscription: “<strong>For her salvation Eudoxia offered [this] as a gift to St Stephen of the village of Attar[outhi]</strong>”.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5efa445c75323d28a5eaa/s_p_l5pPSsTDZHSQuvNU.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5efa445c75323d28a5eaa/m_p_l5pPSsTDZHSQuvNU.jpg">larger</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f01f45c75323d28a5eab/m_p_456sbKEe3ANd9ZWP.jpg">version 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f02245c75323d28a5eac/m_p_fkJIydq7uEfZbIUt.jpg">version 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f02445c75323d28a5ead/m_p_s25q6Lu5HItPjqDs.jpg">version 4</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f02745c75323d28a5eae/m_p_QJsAgl2zRfYmpNDL.jpg">version 5</a>]</p><hr><p>A Eucharistic chalice with an icon of St John the Forerunner, a holy deacon (probably Stephen), holy bishops and crosses. <a href="https://www.metmuseum.org/art/collection/search/466130">The Metropolitan Museum of Art, Fifth Avenue, USA</a>. 20.5 × 15.1 cm, 369 g, 1100 ml</p><p>The Greek inscription: “<strong>To St John of the village of Attarouthi</strong>”.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5ec4545c75323d28a5ea4/s_p_KWMPzINWo4ktBKQ7.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5ec4545c75323d28a5ea4/m_p_KWMPzINWo4ktBKQ7.jpg">larger</a>]</p><hr><p>A Eucharistic chalice with an icon of Christ, the Theotokos, John the Forerunner and George the Victorious. <a href="https://www.metmuseum.org/art/collection/search/466129">The Metropolitan Museum of Art, Fifth Avenue, USA</a>. 24.3 × 16.8 cm.</p><p>The Greek inscription: “<strong>St Stephen of the village of Attarouthi</strong>”.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5ee1345c75323d28a5ea6/s_p_9bHxlNSj26b5EhMw.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5ee1345c75323d28a5ea6/m_p_9bHxlNSj26b5EhMw.jpg">larger</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5ee3c45c75323d28a5ea7/m_p_8XweLe1b1pD7GWHb.jpg">version 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5ee4045c75323d28a5ea8/m_p_faMKsJUImltU9s6v.jpg">version 3</a>]</p><hr><p>A Eucharistic chalice with an image of the young Christ with a cross-nimbus, a holy deacon with a censer (probably St Stephen), the Virgin Mary in prayer and a young saint with a staff. Size: 23.9 × 17 cm, 356 g. <a href="https://www.metmuseum.org/art/collection/search/466141">The Metropolitan Museum of Art, Fifth Avenue, USA.</a></p><p>The Greek inscription: “<strong>In fulfillment of a vow and for the salvation of the one whose name the Lord knows</strong>”.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5fa7a45c75323d28a5ebe/s_p_7AzZiy4FebkdJC4e.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5fa7a45c75323d28a5ebe/m_p_7AzZiy4FebkdJC4e.jpg">larger</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5fa8345c75323d28a5ebf/m_p_LQnRTCSFvxz7O7ui.jpg">version 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5fa8645c75323d28a5ec0/m_p_KvY9o90gFdzJeK9N.jpg">version 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5fa8945c75323d28a5ec1/m_p_BUzuFJ6F1fLtMppI.jpg">version 4</a>]</p><hr><p>A censer with an image of the young Christ with a cross-nimbus, St John the Forerunner, the Virgin Mary in prayer, a holy deacon (probably St Stephen) and crosses. Silver and gilded silver with a copper lining. Size: 41.5 × 13.2 × 12.6 cm. <a href="https://www.metmuseum.org/art/collection/search/466132">The Metropolitan Museum of Art, Fifth Avenue, USA</a>.</p><p>The Greek inscription: “<strong>For the repose of the soul[s] of Erta and Stephen, the children of Kyriakos</strong>”</p><img src="https://res.bibleox.com/s/img/image/simple/68b5f15545c75323d28a5eaf/s_p_OJ2d0ec3h6BtKZQM.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5f15545c75323d28a5eaf/m_p_OJ2d0ec3h6BtKZQM.jpg">larger</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f15845c75323d28a5eb0/m_p_MLajjsEoJyZ7xPC7.jpg">version 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f15c45c75323d28a5eb1/m_p_5k22minZ9Q7EruSj.jpg">version 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f15e45c75323d28a5eb2/m_p_3cDRqzOwNAJr7A0S.jpg">version 4</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f16145c75323d28a5eb3/m_p_8vKQQvQJKE8Mbtoc.jpg">version 5</a>]</p><hr><p>A censer with an image of the young Christ with a cross-nimbus, two archangels and crosses. 8.2 × 13.2 cm. <a href="https://www.metmuseum.org/art/collection/search/466131">The Metropolitan Museum of Art, Fifth Avenue, USA</a>.</p><p>The Greek inscription: “<strong>To St John of the village of Attarouthi</strong>”.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5f27545c75323d28a5eb4/s_p_brjJXh3ZIrplms0E.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5f27545c75323d28a5eb4/m_p_brjJXh3ZIrplms0E.jpg">larger</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f28545c75323d28a5eb5/m_p_oWtx1CexyxQIAxRK.jpg">version 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f28845c75323d28a5eb6/m_p_zqvxcBdCxjLqltWh.jpg">version 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f28c45c75323d28a5eb7/m_p_fIVExsqDAbrZLhWW.jpg">version 4</a>]</p><h3>Eucharistic chalices with images of Christ and the saints, a paten with a cross (Syria, Byzantium)</h3><p>500–700. The Cleveland Museum of Art, USA: <a href="https://www.clevelandart.org/art/1950.378">1</a>, <a href="https://www.clevelandart.org/art/1950.379">2</a>, <a href="https://www.clevelandart.org/art/1950.380">3</a>, <a href="https://www.clevelandart.org/art/1950.381">4</a>.</p><p>These four silver liturgical vessels, a paten and three chalices (inv. 1950.378–81), form what is now called the “Beth Misona Treasure”, named after the village in northern Syria for which they were made.</p><p>Although the exact place and circumstances of the find are unknown, the people of Beth Misona, like other Christian communities in Syria and Palestine, were probably forced to bury the church silver to hide it from the Persians or Arabs who conquered their lands in the first half of the 7th century.</p><p>The paten, on which the Eucharistic portions lay during the Liturgy, is decorated with an engraved Latin cross surrounded by a dedicatory inscription. It names the donor of the paten, Domnus, and its original location, the church of St Sergius in Beth Misona.</p><p>The chalices have wide cups decorated with busts of Christ, the Theotokos and the apostles Peter and Paul. One of the chalices has a dedicatory inscription with the name of the donor, Kyriakos son of Domnus, and of the priest of the church who received this pious gift, Zeno.</p><p>The Greek inscription: “<strong>+ The priest KYRIAKOS, son of DOMNUS, (offered this chalice) to St Sergius in the time of the priest Zeno</strong>”</p><img src="https://res.bibleox.com/s/img/image/simple/68caa03c205184ec278d5880/s_p_SB8idWRkPX7keKkU.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68caa03c205184ec278d5880/m_p_SB8idWRkPX7keKkU.jpg">Christ</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68caa026205184ec278d587d/m_p_sYIDwGwUI9iMAzzD.jpg">Theotokos</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68caa029205184ec278d587e/m_p_xYnPNjrcxGm5mJgl.jpg">Apostle</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68caa02c205184ec278d587f/m_p_kH9idfsikXyvAVvy.jpg">Apostle</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68caa0d4205184ec278d5881/m_p_vWERSBBMAoytSNnX.jpg">top view</a>]</p><hr><img src="https://res.bibleox.com/s/img/image/simple/68ca9cd5205184ec278d5874/s_p_tH0J7uqAriM7uaeK.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68ca9cd5205184ec278d5874/m_p_tH0J7uqAriM7uaeK.jpg">Christ</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68ca9d13205184ec278d5878/m_p_tYRbn15h6MPNUilS.jpg">Theotokos</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68ca9ce8205184ec278d5875/m_p_FKfoi68UXlWCS5ky.jpg">Apostle</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68ca9ceb205184ec278d5876/m_p_Zp9CJ61HnBcr8Csr.jpg">Apostle</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68ca9cee205184ec278d5877/m_p_w2JDvDj5c4pMVcfk.jpg">top view</a>]</p><hr><img src="https://res.bibleox.com/s/img/image/simple/68ca9e94205184ec278d5879/s_p_27LzQUQDD3A7nI9X.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68ca9e94205184ec278d5879/m_p_27LzQUQDD3A7nI9X.jpg">Christ</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68ca9e98205184ec278d587a/m_p_R47Eqr4GrHijUSIb.jpg">Theotokos</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68ca9e9b205184ec278d587b/m_p_31NEBZQIYBEqOut0.jpg">Apostle</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68ca9e9e205184ec278d587c/m_p_QxtJHMZORGGwFxYQ.jpg">Apostle</a>]</p><hr><p>c. 500. A paten. <a href="https://www.clevelandart.org/art/1950.381">The Cleveland Museum of Art, USA</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68ca964d205184ec278d5873/s_p_wNDEaPHmGHiuWeZy.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68ca964d205184ec278d5873/m_p_wNDEaPHmGHiuWeZy.jpg">larger</a>]</p><h3>A censer. The Baptism and Crucifixion of the Lord Jesus Christ (Byzantium)</h3><p>500–899. Size: 13.4 × 9 cm. <a href="https://collections.louvre.fr/en/ark:/53355/cl010042067">The Louvre, France</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c4068e6594f46d35a87efe/s_p_3kaCIWMTmQfT4NFG.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c4068e6594f46d35a87efe/m_p_3kaCIWMTmQfT4NFG.jpg">larger</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/68c4061f6594f46d35a87efc/s_p_XNlsrfQ2MOphupt9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c4061f6594f46d35a87efc/m_p_XNlsrfQ2MOphupt9.jpg">larger</a>]</p><h3>A vase. Christ, the Theotokos, John the Baptist, apostles, angels (Constantinople)</h3><img src="https://res.bibleox.com/s/img/image/simple/68c420e46594f46d35a87f06/s_p_iADN1OW5uYg5Wovc.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c420e46594f46d35a87f06/m_p_iADN1OW5uYg5Wovc.jpg">larger</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c420e76594f46d35a87f07/m_p_oAs6ecjPj32iGMce.jpg">reverse side</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c421216594f46d35a87f0f/m_p_x6q5apwWB0DZirK2.jpg">Christ</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c420fc6594f46d35a87f0b/m_p_sL17qrWgxkRCNRBb.jpg">Theotokos</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c420ea6594f46d35a87f08/m_p_Cb0UJi1oxoKCQaXw.jpg">John the Baptist</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c421016594f46d35a87f0c/m_p_a9Y1fyPNxcQ4oNbq.jpg">angel</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c420f66594f46d35a87f0a/m_p_nAqhqDbP5x8fRAnj.jpg">angel</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c420ef6594f46d35a87f09/m_p_F9R3iyZ8go0PxARb.jpg">apostle</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c4210a6594f46d35a87f0e/m_p_97cyzUvq95UJZOrR.jpg">apostle</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c421056594f46d35a87f0d/m_p_WfK6SdjAqAOW9fDK.jpg">apostle</a>]</p><h3>A pectoral cross with an icon (Byzantium)</h3><p>6th century.<strong> </strong>Gold, paste, rock crystal, glass; stamping, granulation. Chain length: 33 cm; cross: 4.9 × 3.8 cm. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/227027?page=46&amp;query=%D0%BA%D1%80%D0%B5%D1%81%D1%82&amp;sort=112&amp;index=2288">The Hermitage, Russia</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c11e3c6594f46d35a87e2c/s_p_9GZmzTSaUVuXXaX1.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c11e3c6594f46d35a87e2c/m_p_9GZmzTSaUVuXXaX1.jpg">larger</a>]</p><h3>A pendant. The Crucifixion of Christ (Egypt)</h3><p>500–700. Size: 3.3 × 1.9 cm. <a href="https://collections.louvre.fr/en/ark:/53355/cl010102800">The Louvre, France</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c41c4e6594f46d35a87f03/s_p_tiaBwT9vqOXIlsIw.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c41c4e6594f46d35a87f03/m_p_tiaBwT9vqOXIlsIw.jpg">larger</a>]</p><h3>An icon of two saints (Byzantium)</h3><p>6th century; 25.5 × 22 × 1.3 cm. Perhaps the evangelists Matthew and John. <a href="https://www.metmuseum.org/art/collection/search/468198">The Metropolitan Museum of Art, Fifth Avenue, USA</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5fc1545c75323d28a5ec3/s_p_a2FJmSgsGJRdELBq.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5fc1545c75323d28a5ec3/m_p_a2FJmSgsGJRdELBq.jpg">larger</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5fc1945c75323d28a5ec4/m_p_pcvRiRfRgBcuHJEA.jpg">version 2</a>]</p><h3>Icons of the apostles Peter and Paul (Antioch)</h3><p>550–600. The apostle Peter. <a href="https://www.metmuseum.org/art/collection/search/468348">The Metropolitan Museum of Art, Fifth Avenue, USA</a>. Silver. 38.1 × 55.9 × 2.2 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68c1bfd36594f46d35a87e6f/s_p_WguE3h0pnnzXQXwt.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1bfd36594f46d35a87e6f/m_p_WguE3h0pnnzXQXwt.jpg">larger</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c1bfd56594f46d35a87e70/m_p_83EvKNt1mFSPspQw.jpg">even larger</a>]</p><p>550–600. The apostle Paul. <a href="https://www.metmuseum.org/art/collection/search/468347">The Metropolitan Museum of Art, Fifth Avenue, USA</a>. Silver. 38.1 × 55.9 × 2.2 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68c1bfda6594f46d35a87e71/s_p_5Y11faCyEzohnydQ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1bfda6594f46d35a87e71/m_p_5Y11faCyEzohnydQ.jpg">larger</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c1bfdd6594f46d35a87e72/m_p_jGCYAnYdrt4tlXhd.jpg">even larger</a>]</p><h3>An icon (Syria?, Byzantium)</h3><p>500s. <a href="https://www.clevelandart.org/art/1941.57">The Cleveland Museum of Art, USA</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68caa8cd205184ec278d5883/s_p_qr7HPRgCtcCRwsvb.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68caa8cd205184ec278d5883/m_p_qr7HPRgCtcCRwsvb.jpg">larger</a>]</p><h3>An image of a soldier saint (Coptic Egypt)</h3><p>6th–7th century. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/180444?page=6&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=253">The Hermitage, Russia</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c3c06480b4d28532041c/s_p_Rnquar8nZacdzqcP.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c3c06480b4d28532041c/m_p_Rnquar8nZacdzqcP.jpg">larger</a>]</p><h3>An ampulla with an icon of the apostle Paul (?) and St Thecla (Egypt)</h3><p>500–700. <a href="https://collections.louvre.fr/en/ark:/53355/cl010280955">The Louvre, France</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c4390d6594f46d35a87f15/s_p_Zxs1yv3Jg8oKfFHW.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c4390d6594f46d35a87f15/m_p_Zxs1yv3Jg8oKfFHW.jpg">larger</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/68c4390a6594f46d35a87f14/s_p_CPdXMrLBUE0satoH.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c4390a6594f46d35a87f14/m_p_CPdXMrLBUE0satoH.jpg">larger</a>]</p><h3>An ampulla with an icon of the apostle Andrew (Smyrna)</h3><p>500–600. <a href="https://collections.louvre.fr/en/ark:/53355/cl010281050">The Louvre, France</a>. 7 × 5 × 2.8 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68c437966594f46d35a87f13/s_p_dCGVNUwg3KWvs9zz.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c437966594f46d35a87f13/m_p_dCGVNUwg3KWvs9zz.jpg">larger</a>]</p><h3>Ampullae with an icon of St Menas</h3><p>610–650. An ampulla with an image of St Menas (Egypt). <a href="https://www.metmuseum.org/art/collection/search/475416">The Metropolitan Museum of Art, Fifth Avenue, USA</a>. 8.5 × 6.9 × 1.8 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68c1c1396594f46d35a87e73/s_p_KIdJIYWMysre63rP.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1c1396594f46d35a87e73/m_p_KIdJIYWMysre63rP.jpg">larger</a>]</p><hr><p>500–750. <a href="https://collections.louvre.fr/en/ark:/53355/cl010044285">The Louvre, France</a>. 13 × 10.6 × 3.4 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68c3bc556594f46d35a87ebd/s_p_iHBRxhobWKvQb2Dx.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3bc556594f46d35a87ebd/m_p_iHBRxhobWKvQb2Dx.jpg">larger</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/68c3bc5c6594f46d35a87ebe/s_p_fQ8Ps5eHBD1myJaS.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3bc5c6594f46d35a87ebe/m_p_fQ8Ps5eHBD1myJaS.jpg">larger</a>]</p><h3>Christ (Ravenna)</h3><p>The church of Sant’Apollinare in Classe, Ravenna, Italy.</p><img src="https://res.bibleox.com/s/img/image/simple/675005d5dba77200011c73ad/s_p_rjjDEzNckea3oHk2.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/675005d5dba77200011c73ad/m_p_rjjDEzNckea3oHk2.jpg">larger</a>]</p><h3>Christ and the apostles (Ravenna)</h3><p>Mosaic of the presbytery. The church of San Vitale, Ravenna, Italy.</p><img src="https://res.bibleox.com/s/img/image/simple/675005dadba77200011c73ae/s_p_Nac2nrVo791COrcO.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/675005dadba77200011c73ae/m_p_Nac2nrVo791COrcO.jpg">larger</a>]</p><h3>Christ, angels and Vitalis (Ravenna)</h3><p>6th century. The Basilica of St Vitalis of Milan, Ravenna.</p><img src="https://res.bibleox.com/s/img/image/simple/674f0ab3dba77200011c738f/s_p_AsShtty0gMBFOX5X.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f0ab3dba77200011c738f/m_p_AsShtty0gMBFOX5X.jpg">larger</a>]</p><h3>The right-believing Emperor Justinian (Ravenna)</h3><p>6th century. The Basilica of St Vitalis of Milan, Ravenna.</p><img src="https://res.bibleox.com/s/img/image/simple/674f0ab8dba77200011c7390/s_p_MsUwTeWDMk0uEVPq.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f0ab8dba77200011c7390/m_p_MsUwTeWDMk0uEVPq.jpg">larger</a>]</p><h3>The right-believing Empress Theodora (Ravenna)</h3><p>6th century. The Basilica of St Vitalis of Milan, Ravenna.</p><img src="https://res.bibleox.com/s/img/image/simple/674f0ac0dba77200011c7391/s_p_6g0s1g1btiJBEXSR.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f0ac0dba77200011c7391/m_p_6g0s1g1btiJBEXSR.jpg">larger</a>]</p><h3>The forefather Abraham (Ravenna)</h3><p>6th century. The Basilica of St Vitalis of Milan, Ravenna.</p><img src="https://res.bibleox.com/s/img/image/simple/674f0ad6dba77200011c7393/s_p_zgb5TLR1yafutIu4.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f0ad6dba77200011c7393/m_p_zgb5TLR1yafutIu4.jpg">larger</a>]</p><h3>Abel and Melchizedek (Ravenna)</h3><p>6th century. The Basilica of St Vitalis of Milan, Ravenna.</p><img src="https://res.bibleox.com/s/img/image/simple/674f0adbdba77200011c7394/s_p_PiL9TaItwhR28eXN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f0adbdba77200011c7394/m_p_PiL9TaItwhR28eXN.jpg">larger</a>]</p><h3>Marcellinus, Pollio, Peter, saints (Rome)</h3><p>6th century. The Catacomb of Pontian. Fresco.</p><img src="https://res.bibleox.com/s/img/image/simple/66cc2c4adba77200019bc7d9/s_p_th5E9srmqGjUT72T.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/66cc2c4adba77200019bc7d9/m_p_th5E9srmqGjUT72T.jpg">larger</a>]</p><h3>Christ coming on the clouds, the apostles and Sts Cosmas and Damian (Rome)</h3><p>6th century (530). The Basilica of Sts Cosmas and Damian. [19][20]</p><img src="https://res.bibleox.com/s/img/image/simple/686aa5b35f47da2505d3ae28/s_p_V2YyLyiR7wCHgIfW.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa5b35f47da2505d3ae28/m_p_V2YyLyiR7wCHgIfW.jpg">larger</a>]</p><p>The apostle Peter and St Cosmas (beyond them St Theodore)</p><img src="https://res.bibleox.com/s/img/image/simple/686aa5d25f47da2505d3ae29/s_p_s66jgQ3tkVAmQEZE.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa5d25f47da2505d3ae29/m_p_s66jgQ3tkVAmQEZE.jpg">larger</a>]</p><p>The apostle Paul and St Damian (beyond them Pope Felix)</p><img src="https://res.bibleox.com/s/img/image/simple/686aa7505f47da2505d3ae2c/s_p_WA1eP9P7BNe0aPQ6.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa7505f47da2505d3ae2c/m_p_WA1eP9P7BNe0aPQ6.jpg">larger</a>]</p><p>A holy angel</p><img src="https://res.bibleox.com/s/img/image/simple/686aa61c5f47da2505d3ae2a/s_p_MD4QowA5HKQRhFFG.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa61c5f47da2505d3ae2a/m_p_MD4QowA5HKQRhFFG.jpg">larger</a>]</p><h3>Christ and the apostles (Rome)</h3><p>6th century (578–590). The Basilica of St Lawrence outside the Walls (San Lorenzo fuori le Mura) [21][22]</p><p>Beside the apostle Paul are Sts Stephen and Hippolytus. Beside the apostle Peter is St Lawrence.</p><img src="https://res.bibleox.com/s/img/image/simple/686aabc85f47da2505d3ae2e/s_p_xa4IU82mZb80Uija.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aabc85f47da2505d3ae2e/m_p_xa4IU82mZb80Uija.jpg">larger</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686aab945f47da2505d3ae2d/s_p_21M69l0ODfpN75oh.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aab945f47da2505d3ae2d/m_p_21M69l0ODfpN75oh.jpg">larger</a>]</p><h3>The apostles Peter and Paul (Franks)</h3><p>6th–8th century. <a href="https://www.metmuseum.org/art/collection/search/464497">The Metropolitan Museum of Art, Fifth Avenue, USA</a> (also <a href="https://www.metmuseum.org/art/collection/search/464496">here</a>). Ivory. 29.2 × 11.4 × 0.5 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5ff8145c75323d28a5ec8/s_p_WhZZPyHo1I7oF79K.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5ff8145c75323d28a5ec8/m_p_WhZZPyHo1I7oF79K.jpg">larger</a>]</p><h3>Saints (Byzantium, Egypt)</h3><p>6th–7th century. <a href="https://www.metmuseum.org/art/collection/search/854019">The Metropolitan Museum of Art, Fifth Avenue, USA</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68b6007445c75323d28a5ec9/s_p_DNQuRcpcjfkINQ1r.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b6007445c75323d28a5ec9/m_p_DNQuRcpcjfkINQ1r.jpg">larger</a>]</p><h3>St Phocas (Byzantium, Chersonesus)</h3><p>6th century. A stamp for making eulogia with a relief image of St <a href="https://azbyka.ru/days/sv-foka-sinopskij">Phocas of Sinope</a> standing in a boat. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/373084?page=2&amp;fundcoll=1420520446&amp;index=75">The Hermitage, Russia</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863bee26480b4d285320410/s_p_s0nPEGgpeMtakrof.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863bee26480b4d285320410/m_p_s0nPEGgpeMtakrof.jpg">larger</a>]</p><h3>An ampulla with two images of saints (Asia Minor, Ephesus)</h3><p>6th century. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/228313?page=44&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=2166">The Hermitage, Russia</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c0e76480b4d285320414/s_p_KnTGMdyOhsmTAD0S.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c0e76480b4d285320414/m_p_KnTGMdyOhsmTAD0S.jpg">larger</a>]</p><h3>An ampulla with images of an evangelist and a saint: John the Theologian and Prochorus (Ephesus)</h3><p>6th century. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/228314?page=33&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=1646">The Hermitage, Russia</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c1726480b4d285320415/s_p_oBnXQZmCz1EntIFw.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c1726480b4d285320415/m_p_oBnXQZmCz1EntIFw.jpg">larger</a>]</p><h3>A molybdobull (lead seal) with an image of Sts Peter and Paul and a Latin inscription (Byzantium)</h3><p>6th–7th century. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/131338?page=33&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=1639">The Hermitage, Russia</a>. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/161973?page=33&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=1640">Another exhibit</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c19d6480b4d285320416/s_p_JKBi7CXiDOutHIFn.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c19d6480b4d285320416/m_p_JKBi7CXiDOutHIFn.jpg">larger</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6863c22c6480b4d285320417/s_p_FmbNOmLfDrj3qYOz.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c22c6480b4d285320417/m_p_FmbNOmLfDrj3qYOz.jpg">larger</a>]</p><h3>A molybdobull with an image of Christ (Byzantium)</h3><p>6th–7th century. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/117792?page=6&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%B0&amp;index=269">The Hermitage, Russia</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c4a86480b4d28532041f/s_p_Uy0EgcXKfuHnv9bX.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c4a86480b4d28532041f/m_p_Uy0EgcXKfuHnv9bX.jpg">larger</a>]</p><h3>A molybdobull with an image of Christ and a monogram (Byzantium)</h3><p>6th–7th century. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/117804?page=3&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%B0&amp;index=143">The Hermitage, Russia</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c5a16480b4d285320422/s_p_JNdWhUPj9cA9Dvoq.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c5a16480b4d285320422/m_p_JNdWhUPj9cA9Dvoq.jpg">larger</a>]</p><h2>7th Century</h2><h3>An icon of Christ on a wedding ring (Byzantium)</h3><p>600–700. Greek inscriptions on the ring: <strong>ΟΜΟΝΟΙΑ</strong>, “concord”; <strong>ΕΙΡΙΝΗΝ ΤΗΝ ΕΜΙΝ ΔΙΔΟΜ</strong>, “my peace I give you” (<a href="https://bibleox.com/en/en-nrsv/in/14/#L27">John 14:27</a>). <a href="https://collections.louvre.fr/en/ark:/53355/cl010102797">The Louvre, France</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c402726594f46d35a87ef8/s_p_6nMwdRXMjOnhQWfu.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c402726594f46d35a87ef8/m_p_6nMwdRXMjOnhQWfu.jpg">larger</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c4027c6594f46d35a87ef9/m_p_pNTvaGVW4AmLG2BK.jpg">version 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c4027e6594f46d35a87efa/m_p_mvU9wZQKEIl0lFZY.jpg">version 3</a>]</p><h3>An ampulla with an icon. Christ, the Crucifixion and the Ascension (Palestine, Byzantium)</h3><p>Early 600s. <a href="https://www.clevelandart.org/art/1999.46">The Cleveland Museum of Art, USA</a>. Tin-lead alloy with leather parts.</p><img src="https://res.bibleox.com/s/img/image/simple/68caa8cf205184ec278d5884/s_p_QfQLEBTpKbF2IfJo.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68caa8cf205184ec278d5884/m_p_QfQLEBTpKbF2IfJo.jpg">larger</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68caaaaf205184ec278d5887/m_p_YFRVXxytSNharyj8.jpg">version 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68caaab2205184ec278d5888/m_p_GguW2EcCVatptKzX.jpg">version 3</a>]</p><h3>The Theotokos and the Great Martyr Theodore Stratelates (Thessaloniki, Byzantium)</h3><p>7th–10th century (?). The Basilica of St Demetrius in Thessaloniki. A mosaic on the south face of the north pier.</p><img src="https://res.bibleox.com/s/img/image/simple/686985345f47da2505d3ae12/s_p_HWoRkey7yaGM1D4s.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686985345f47da2505d3ae12/m_p_HWoRkey7yaGM1D4s.jpg">larger</a>]</p><h3>The Great Martyr Demetrius and the founders, an archbishop and a prefect (Thessaloniki, Byzantium)</h3><p>7th century. The Basilica of St Demetrius in Thessaloniki. Mosaic.</p><img src="https://res.bibleox.com/s/img/image/simple/686986dc5f47da2505d3ae13/s_p_ZMXi7hFVOfpu7jbC.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686986dc5f47da2505d3ae13/m_p_ZMXi7hFVOfpu7jbC.jpg">larger</a>]</p><h3>St George and children (Thessaloniki, Byzantium)</h3><p>7th century. The Basilica of St Demetrius in Thessaloniki. The mosaic is in the western part of the sanctuary.</p><img src="https://res.bibleox.com/s/img/image/simple/686987645f47da2505d3ae14/s_p_boH6uu2omR2Gjxxx.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686987645f47da2505d3ae14/m_p_boH6uu2omR2Gjxxx.jpg">larger</a>]</p><h3>St Sergius (Thessaloniki, Byzantium)</h3><p>7th century. The Basilica of St Demetrius in Thessaloniki. A mosaic on a sanctuary pier.</p><img src="https://res.bibleox.com/s/img/image/simple/686989925f47da2505d3ae15/s_p_Faf5BLFz9WISBGej.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686989925f47da2505d3ae15/m_p_Faf5BLFz9WISBGej.jpg">larger</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a742205184ec278d6fb4/m_p_YV1I98bvx4Nn6cUn.jpg">version 2</a>]</p><h3>An icon of the holy prophet David (Constantinople, Byzantium)</h3><p>629–630. <a href="https://www.metmuseum.org/art/collection/search/464380">The Metropolitan Museum of Art, Fifth Avenue, USA</a>. Silver. 26.6 × 4 cm, 1397 g. See also: <a href="https://www.metmuseum.org/art/collection/search/464378">1</a>, <a href="https://www.metmuseum.org/art/collection/search/464375">2</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c1c3426594f46d35a87e75/s_p_5U20dlUc30xkfJeN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1c3426594f46d35a87e75/m_p_5U20dlUc30xkfJeN.jpg">larger</a>]</p><h3>A molybdobull with an image of a saint and an inscription (Byzantium)</h3><p>7th century. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/270001?page=17&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=840">The Hermitage, Russia</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c2966480b4d285320419/s_p_EY1IyPYdMzjgztlB.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c2966480b4d285320419/m_p_EY1IyPYdMzjgztlB.jpg">larger</a>]</p><h3>A molybdobull with a bust of Christ and a monogram (Byzantium)</h3><p>7th century. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/231980?page=2&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%B0&amp;index=96">The Hermitage, Russia</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c6076480b4d285320423/s_p_YFjOrZh2fLGJgpYJ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c6076480b4d285320423/m_p_YFjOrZh2fLGJgpYJ.jpg">larger</a>]</p><h3>A molybdobull with an image of Christ and a monogram (Byzantium)</h3><p>7th century. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/172196?page=2&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%B0&amp;index=57">The Hermitage, Russia</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c64d6480b4d285320424/s_p_RQupAUUa4gGtXt2n.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c64d6480b4d285320424/m_p_RQupAUUa4gGtXt2n.jpg">larger</a>]</p><h2>8th Century</h2><h3>The Theotokos and the Child Jesus (Constantinople, Byzantium)</h3><p>The Church of the Wisdom of God (Hagia Sophia).</p><img src="https://res.bibleox.com/s/img/image/simple/674f31b0dba77200011c73a2/s_p_2AO12RGOQ2yqRiP4.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f31b0dba77200011c73a2/m_p_2AO12RGOQ2yqRiP4.jpg">larger</a>]</p><h3>The Archangel Gabriel (Constantinople, Byzantium)</h3><p>The Church of the Wisdom of God (Hagia Sophia).</p><img src="https://res.bibleox.com/s/img/image/simple/674f3256dba77200011c73a4/s_p_rfkKZFQ8IYfO6L7V.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f3256dba77200011c73a4/m_p_rfkKZFQ8IYfO6L7V.jpg">larger</a>]</p><h3>Christ, the Crucifixion and the Resurrection (Metz, France)</h3><p>870. <a href="https://collections.louvre.fr/en/ark:/53355/cl010113244">The Louvre, France</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c422e46594f46d35a87f10/s_p_lQNRJIXri6KJoLw3.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c422e46594f46d35a87f10/m_p_lQNRJIXri6KJoLw3.jpg">larger</a>]</p><h3>Christ, the Crucifixion (Reims, France)</h3><p>870–880. <a href="https://collections.louvre.fr/en/ark:/53355/cl010098469">The Louvre, France</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c423bc6594f46d35a87f11/s_p_NOhnffTlgTImIczW.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c423bc6594f46d35a87f11/m_p_NOhnffTlgTImIczW.jpg">larger</a>]</p><h2>9th Century</h2><h3>The Ascension of Christ (Thessaloniki, Byzantium)</h3><p>9th–10th century. The Rotunda of St George the Victorious (originally the tomb of Emperor Galerius). Fresco [17][18]</p><img src="https://res.bibleox.com/s/img/image/simple/686a934c5f47da2505d3ae20/s_p_klfYhHum7wZvKR9D.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686a934c5f47da2505d3ae20/m_p_klfYhHum7wZvKR9D.jpg">larger</a>]</p><h3>Christ, a bronze medallion (Byzantium)</h3><p>9th–10th century. Round images are called medallions. <a href="https://www.britishmuseum.org/collection/object/H_1880-0820-9">The British Museum</a>. Diameter: 3.5 cm.</p><p>Circular medallion; bronze; bust of Christ with cruciferous nimbus holding the book of the gospel in his left hand; inscription either side.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5be2d45c75323d28a5e92/s_p_GswK2cGnuxxnLfJr.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5be2d45c75323d28a5e92/m_p_GswK2cGnuxxnLfJr.jpg">larger</a>]</p><h3>The Dormition of the Theotokos (Byzantium)</h3><p>Late 9th century. <a href="https://www.metmuseum.org/art/collection/search/464013">The Metropolitan Museum of Art, Fifth Avenue, USA</a>. Material: ivory. 18.6 × 14.8 × 1.1 cm.</p><p>New York. The Metropolitan Museum of Art. "The Glory of Byzantium,". Images of the Koimesis, or the Dormition in the West, show the Virgin lying on a bier, while her soul, represented as a baby, is offered by Christ to attendant angels who will take it to heaven. The apostles, led by Saints Paul and Peter, stand witness.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5c1bf45c75323d28a5e97/s_p_0Hg1bO8KIUVBSWJs.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5c1bf45c75323d28a5e97/m_p_0Hg1bO8KIUVBSWJs.jpg">larger</a>]</p><h3>Christ, the Theotokos, John the Baptist, apostles and other saints (Constantinople)</h3><p>940–960. <a href="https://collections.louvre.fr/en/ark:/53355/cl010112515">The Louvre, France</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c424276594f46d35a87f12/s_p_IlqGrJe04Ic0YFWv.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c424276594f46d35a87f12/m_p_IlqGrJe04Ic0YFWv.jpg">larger</a>]</p><h3>A plaque with an image of Christ and the apostles (Italy)</h3><p>9th century. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/228918?page=4&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%B0&amp;index=194">The Hermitage, Russia</a>. Size: 12.2 × 10.5 cm</p><img src="https://res.bibleox.com/s/img/image/simple/6863c54f6480b4d285320421/s_p_aLvOvrKuilB614SS.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c54f6480b4d285320421/m_p_aLvOvrKuilB614SS.jpg">larger</a>]</p><h2>10th Century</h2><h3>Christ, the Theotokos, John the Baptist (Byzantium)</h3><p>10th century. <a href="https://www.britishmuseum.org/collection/object/H_1923-1205-2">The British Museum</a>. Material: ivory. Height: 15.5 cm.</p><p>Panel; ivory; carved with standing figures, Christ with the Virgin Mary and St John, below a pierced canopy; four holes for attachment in the raised border.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5be4045c75323d28a5e95/s_p_qEFeZyh2Gq5Wbvar.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5be4045c75323d28a5e95/m_p_qEFeZyh2Gq5Wbvar.jpg">larger</a>]</p><h3>The Theotokos and the Christ Child (Constantinople, Byzantium)</h3><p><a href="tel:950-1025">950–1025</a>. <a href="https://www.clevelandart.org/art/1925.1293">The Cleveland Museum of Art, USA</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68caa153205184ec278d5882/s_p_iLLZZkqfsUiACLDC.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68caa153205184ec278d5882/m_p_iLLZZkqfsUiACLDC.jpg">larger</a>]</p><h3>A pendant with an image of Christ and the Theotokos (Byzantium)</h3><p>1000–1300. <a href="https://www.metmuseum.org/art/collection/search/477247">The Metropolitan Museum of Art, Fifth Avenue, USA</a>. Chalcedony cameo; gold mount with pearls, emeralds, garnets, sapphires and sardonyx inlay. Overall: 7.2 × 5.5 × 1.6 cm. Chalcedony: 1 1/2 × 1 1/4 in. (3.8 × 3.2 cm)</p><img src="https://res.bibleox.com/s/img/image/simple/68c1bc1a6594f46d35a87e6d/s_p_VcHt7eFMtZq1I1lY.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1bc1a6594f46d35a87e6d/m_p_VcHt7eFMtZq1I1lY.jpg">larger</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/68c1bc176594f46d35a87e6c/s_p_LwWdQj6J4ehbmMh9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1bc176594f46d35a87e6c/m_p_LwWdQj6J4ehbmMh9.jpg">larger</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c1bc1f6594f46d35a87e6e/m_p_gT2TXueTg5pmDsuZ.jpg">even larger</a>]</p><h3>A cross with an image of Christ (Byzantium)</h3><p>10th–11th century. Bronze. 6.6 × 4.2 cm. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/228297?page=56&amp;query=%D0%BA%D1%80%D0%B5%D1%81%D1%82&amp;sort=112&amp;index=2755">The Hermitage, Russia</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c11f5b6594f46d35a87e2d/s_p_6uw78FFpsxpItSzn.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c11f5b6594f46d35a87e2d/m_p_6uw78FFpsxpItSzn.jpg">larger</a>]</p><h3>A cross with an image of Christ (Byzantium)</h3><p>10th–11th century. Bronze. 7.7 × 7 cm. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/482789?page=51&amp;query=%D0%BA%D1%80%D0%B5%D1%81%D1%82&amp;sort=112&amp;index=2501">The Hermitage, Russia</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c11fab6594f46d35a87e2e/s_p_jfgfrZ4X7jcBXG9D.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c11fab6594f46d35a87e2e/m_p_jfgfrZ4X7jcBXG9D.jpg">larger</a>]</p><h3>A cross with icons of saints (Chersonesus)</h3><p>10th century. Bronze, engraving. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/372835?page=5&amp;fundcoll=1420520446__1413747286&amp;index=229">The Hermitage, Russia</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c4191a6594f46d35a87f02/s_p_iFiSEGM9EbRIhhtD.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c4191a6594f46d35a87f02/m_p_iFiSEGM9EbRIhhtD.jpg">larger</a>]</p><h3>St Demetrius of Thessaloniki (Byzantium)</h3><p><a href="tel:950-1000">950–1000</a>. <a href="https://www.metmuseum.org/art/collection/search/465946">The Metropolitan Museum of Art, Fifth Avenue, USA</a>. Material: ivory. 19.7 × 12.1 × 1 cm.</p><p>Standing erect, a spear in his hand and a shield at his side, Saint Demetrios is shown ready to protect the Christian faithful. The name of the popular Byzantine military saint is inscribed in two parts in Greek. Martyred in Thessalonike, the second most important city of the empire in the early centuries of the church, he has long been the patron saint of that metropolis. Images of saints in military dress are rare in Early Byzantine art (they appear on the chalices of the Attarouthi Treasure) but typical of the Middle Byzantine period.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5c38445c75323d28a5e98/s_p_ZeZuXGqxAAyDuPBA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5c38445c75323d28a5e98/m_p_ZeZuXGqxAAyDuPBA.jpg">larger</a>]</p><h2>11th Century</h2><h3>A processional cross: Christ, the Theotokos, the archangels Michael and Gabriel (Byzantium)</h3><p>1000–1050. <a href="https://www.metmuseum.org/art/collection/search/466251">The Metropolitan Museum of Art, Fifth Avenue, USA</a>. 59.5 × 43 × 2.2 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5e3e645c75323d28a5e9b/s_p_Ft65PrnBUmI6wDAc.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5e3e645c75323d28a5e9b/m_p_Ft65PrnBUmI6wDAc.jpg">larger</a>]</p><h3>A processional cross: Christ, the Theotokos, John the Baptist (Byzantium)</h3><p>1050. <a href="https://www.clevelandart.org/art/1970.36">The Cleveland Museum of Art, USA</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68ca921d205184ec278d5871/s_p_PrD5y34JBpT95quf.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68ca921d205184ec278d5871/m_p_PrD5y34JBpT95quf.jpg">larger</a>]</p><h3>A processional cross: St Sabbas (Byzantium)</h3><p>1050. <a href="https://www.metmuseum.org/art/collection/search/697956">The Metropolitan Museum of Art, Fifth Avenue, USA</a>. In the center of the reverse is St Sabbas, and at the ends other holy monks. Silver. 32.4 × 44.8 × 5.7 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68c1c6546594f46d35a87e76/s_p_FO8cb8Ec2FqTDFz8.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1c6546594f46d35a87e76/m_p_FO8cb8Ec2FqTDFz8.jpg">larger</a>]</p><h3>A processional cross: Christ (Chersonesus)</h3><p>11th century. Material: bronze, iron; casting, chasing, engraving. Size: 36.5 × 27.5 cm. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/372834?page=3&amp;fundcoll=1420520446__1413747286&amp;index=106">The Hermitage, Russia</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c418616594f46d35a87f01/s_p_ytqdkwIa6FDSikCw.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c418616594f46d35a87f01/m_p_ytqdkwIa6FDSikCw.jpg">larger</a>]</p><h3>Part of the icon “Christ Pantocrator” (Byzantium, Crimea)</h3><p>1050–1100. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/372766?page=40&amp;query=%D0%B8%D0%BA%D0%BE%D0%BD%D0%B0&amp;index=1999">The Hermitage, Russia</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863bfff6480b4d285320412/s_p_XwuOAkY6yR10NT7b.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863bfff6480b4d285320412/m_p_XwuOAkY6yR10NT7b.jpg">larger</a>]</p><h3>The Theotokos with the Christ Child (Constantinople)</h3><p>1000–1015. <a href="https://collections.louvre.fr/en/ark:/53355/cl010101133">The Louvre, France</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c43b8c6594f46d35a87f16/s_p_rQNvoLa9Vu1WmSB2.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c43b8c6594f46d35a87f16/m_p_rQNvoLa9Vu1WmSB2.jpg">larger</a>]</p><h3>The Theotokos Orans (Constantinople)</h3><p>1000–1200. <a href="https://collections.louvre.fr/en/ark:/53355/cl010114443">The Louvre, France</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c43bcc6594f46d35a87f17/s_p_7a5oJnVWqjfeu67t.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c43bcc6594f46d35a87f17/m_p_7a5oJnVWqjfeu67t.jpg">larger</a>]</p><h3>The Theotokos, the Archangel Michael, St Theodore (Byzantium)</h3><p>11th–12th century. <a href="https://www.britishmuseum.org/collection/object/H_1981-0103-1">The British Museum</a>. 108 × 95 mm.</p><p>Relief icon; rectangular bronze plaque cast in low relief with full-length Hodegetria flanked by the Archangel Michael and St Theodore, each wearing a girdled tunic beneath a chlamys with decorated tablion; the figures are identified by intaglio inscriptions; the whole is surrounded by a raised border with a running vine scroll; traces of solder at sides and back.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5be3545c75323d28a5e93/s_p_DFDGZ6kHm0khLKRD.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5be3545c75323d28a5e93/m_p_DFDGZ6kHm0khLKRD.jpg">larger</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5be3b45c75323d28a5e94/m_p_FfmDAHv29BAMxval.jpg">even larger</a>]</p><h3>An icon of St Demetrius (Byzantium)</h3><p>1040–1060. <a href="https://collections.louvre.fr/en/ark:/53355/cl010115478">The Louvre, France</a>. 9.4 × 6.3 × 0.6 cm.</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c0c36594f46d35a87ec0/s_p_dj04XPO3pwvzkLzr.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c0c36594f46d35a87ec0/m_p_dj04XPO3pwvzkLzr.jpg">larger</a>]</p><h3>A molybdobull with an image of St Demetrius and an inscription (Byzantium)</h3><p>11th century. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/269619?page=20&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=958">The Hermitage, Russia</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c2556480b4d285320418/s_p_oqzix7avanFfe61o.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c2556480b4d285320418/m_p_oqzix7avanFfe61o.jpg">larger</a>]</p><h3>A molybdobull with a half-length image of a saint (Byzantium)</h3><p>11th century. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/267492?page=14&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=651">The Hermitage, Russia</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c3196480b4d28532041a/s_p_VySwl31Z41rar6d3.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c3196480b4d28532041a/m_p_VySwl31Z41rar6d3.jpg">larger</a>]</p><h3>A hanging seal with an image of a saint (Byzantium)</h3><p>11th century. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/483272?query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=21">The Hermitage, Russia</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c4276480b4d28532041d/s_p_5EJuZ18em5TsdUwA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c4276480b4d28532041d/m_p_5EJuZ18em5TsdUwA.jpg">larger</a>]</p><h3>A hanging seal with an image of a saint (Byzantium)</h3><p>11th–12th century. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/483278?query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=35">The Hermitage, Russia</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c4616480b4d28532041e/s_p_H8LrRkkjwBHlc322.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c4616480b4d28532041e/m_p_H8LrRkkjwBHlc322.jpg">larger</a>]</p><h2>12th Century</h2><h3>Christ, the Theotokos, the prophet John (Constantinople, Byzantium)</h3><p>The Church of the Wisdom of God (Hagia Sophia). A fresco of the church[5]</p><img src="https://res.bibleox.com/s/img/image/simple/6750078ddba77200011c73af/s_p_EcliI0JFeV1uu1LU.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6750078ddba77200011c73af/m_p_EcliI0JFeV1uu1LU.jpg">larger</a>]</p><h3>Christ (Constantinople, Byzantium)</h3><p>The Church of the Wisdom of God (Hagia Sophia).</p><img src="https://res.bibleox.com/s/img/image/simple/674f332ddba77200011c73a6/s_p_1PCMz3Y4EZgbSJL0.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f332ddba77200011c73a6/m_p_1PCMz3Y4EZgbSJL0.jpg">larger</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686cf10d5f47da2505d3ae4e/s_p_ZHUiumbGoeJMn4GO.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686cf10d5f47da2505d3ae4e/m_p_ZHUiumbGoeJMn4GO.jpg">larger</a>]</p><h3>The Theotokos (Constantinople, Byzantium)</h3><p>The Church of the Wisdom of God (Hagia Sophia).</p><img src="https://res.bibleox.com/s/img/image/simple/674f3332dba77200011c73a7/s_p_WvZb6UestGwJUzJr.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f3332dba77200011c73a7/m_p_WvZb6UestGwJUzJr.jpg">larger</a>]</p><h3>John the Baptist, prophet (Constantinople, Byzantium)</h3><p>The Church of the Wisdom of God (Hagia Sophia).</p><img src="https://res.bibleox.com/s/img/image/simple/674f357ddba77200011c73a8/s_p_hdfr9cx0ZPTZyn6N.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f357ddba77200011c73a8/m_p_hdfr9cx0ZPTZyn6N.jpg">larger</a>]</p><h3>The Theotokos with the Child Jesus (Constantinople)</h3><p>First third of the 12th century. The Vladimir icon of the Theotokos. Wood, tempera.</p><img src="https://res.bibleox.com/s/img/image/simple/674f18e4dba77200011c7399/s_p_0uaArAqVhNX9r0gV.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f18e4dba77200011c7399/m_p_0uaArAqVhNX9r0gV.jpg">larger</a>]</p><h3>The Theotokos (Byzantium, Syria, Tartus)</h3><p>12th century. <a href="https://www.britishmuseum.org/collection/object/H_1889-0511-13">The British Museum</a>. Material: ivory, 41 × 47 mm.</p><p>Relief icon; pale grey-green steatite; rounded at the top and square below; bust of the Virgin, her mantle drawn over her head, with St Andrew''s cross on it; her hands held in front with palms outwards, inscription either side of her.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5be2645c75323d28a5e91/s_p_StVNlxiOjocLLsz5.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5be2645c75323d28a5e91/m_p_StVNlxiOjocLLsz5.jpg">larger</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5be2245c75323d28a5e90/m_p_yHJ3BkdNwVGdLb4m.jpg">even larger</a>]</p><h3>The Great Martyr Demetrius of Thessaloniki and a deacon (Thessaloniki, Byzantium)</h3><p>12th century. A mosaic on the east face of the south pier.</p><img src="https://res.bibleox.com/s/img/image/simple/68698a155f47da2505d3ae16/s_p_n7AgnVLPvfeBX5Qq.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68698a155f47da2505d3ae16/m_p_n7AgnVLPvfeBX5Qq.jpg">larger</a>]</p><h3>An icon of the Theotokos Hodegetria (Byzantium, Chersonesus)</h3><p>Second half of the 12th century. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/372931?page=11&amp;fundcoll=1420520446&amp;index=536">The Hermitage, Russia</a>. 6.8 × 5 cm</p><img src="https://res.bibleox.com/s/img/image/simple/6863bf2f6480b4d285320411/s_p_10YV8HIpAzMNCgvp.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863bf2f6480b4d285320411/m_p_10YV8HIpAzMNCgvp.jpg">larger</a>]</p><h2>13th Century</h2><h3>The Lord Almighty (Mount Athos)</h3><p>Hilandar Monastery, the Holy Mountain Athos.</p><img src="https://res.bibleox.com/s/img/image/simple/69406737205184ec278d6fd8/s_p_hTWcEC5QtmbCrC5t.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69406737205184ec278d6fd8/m_p_hTWcEC5QtmbCrC5t.jpg">larger</a>]</p><h3>The Theotokos with the Child Jesus (Hodegetria, Mount Athos)</h3><p>Hilandar Monastery, the Holy Mountain Athos.</p><img src="https://res.bibleox.com/s/img/image/simple/674f0cfadba77200011c7395/s_p_mQMRA7FGLEbqOYIx.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f0cfadba77200011c7395/m_p_mQMRA7FGLEbqOYIx.jpg">larger</a>]</p><h2>14th Century</h2><h3>The Lord Almighty</h3><p>Iconographer Manuel Panselinos.</p><img src="https://res.bibleox.com/s/img/image/simple/674f28d1dba77200011c739e/s_p_ma0z14hIFXCiEj7S.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f28d1dba77200011c739e/m_p_ma0z14hIFXCiEj7S.jpg">larger</a>]</p><h3>The Theotokos (Thessaloniki)</h3><p>1310–1315. Orans. A fresco in the church of St Nicholas Orphanos in Thessaloniki, Greece.</p><img src="https://res.bibleox.com/s/img/image/simple/674f29b7dba77200011c739f/s_p_PSuCdQIYdR4IYZgA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f29b7dba77200011c739f/m_p_PSuCdQIYdR4IYZgA.jpg">larger</a>]</p><h3>The Entry of the Most Holy Theotokos into the Temple (Constantinople)</h3><p>c. 1316–1321. Kariye Camii, the Chora Monastery, Istanbul (Constantinople), Turkey.</p><img src="https://res.bibleox.com/s/img/image/simple/675343bddba7720001cd0ddf/s_p_AtF4vpmhv6FneUfA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/675343bddba7720001cd0ddf/m_p_AtF4vpmhv6FneUfA.jpg">larger</a>]</p><h2>15th Century</h2><h3>The apostle Paul (Rus’)</h3><p>1410s. By St Andrei Rublev. The State Tretyakov Gallery, Moscow, Russia.</p><img src="https://res.bibleox.com/s/img/image/simple/6909fbca205184ec278d6e6a/s_p_ok25vNdlaQMM5P3c.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6909fbca205184ec278d6e6a/m_p_ok25vNdlaQMM5P3c.jpg">larger</a>]</p><h2>Icon Collections</h2><ol><li><p>A collection of catacomb iconography, Word file: <a href="https://disk.yandex.ru/d/mHc8dxUdHGqMEQ">link</a></p></li><li><p>Works of the iconographer Manuel Panselinos (13th–14th centuries): <a href="https://vk.com/album-20034910_224123875">https://vk.com/album-20034910_224123875</a></p></li></ol>'
