  body: '<h2>Epigraph</h2><blockquote><p>“Some of the Pharisees in the crowd said to him, ‘Teacher, order your disciples to stop.’ He answered, ‘I tell you, <strong>if these were silent, the stones would shout out</strong>’” (<a href="https://bibleox.com/en/en-nrsv/lk/19/#L39-40">Luke 19:39-40</a>)</p></blockquote><h2>3rd Century</h2><h3>A church near the ancient city of Megiddo, in the settlement of <a href="https://he.wikipedia.org/wiki/%D7%9C%D7%92%D7%99%D7%95">Legio</a> (c. 230)</h3><p>In ancient Christian churches the altar was often placed in the center. This church is a clear example.</p><p>Not far from the city of Megiddo (in antiquity there was a settlement called <a href="https://he.wikipedia.org/wiki/%D7%9C%D7%92%D7%99%D7%95">Legio</a> there, because a Roman legion was stationed there). On high ground in the settlement stood a building that was dated to 230 by its coins, pottery and style of writing. One of its rooms was a Christian church. On the floor there are several large mosaics with inscriptions (one of them calls Christ God), and in the center stands the altar. Nearby is an inscription saying who donated this table.</p><img src="https://res.bibleox.com/s/img/image/simple/692c58f9205184ec278d6f97/s_p_aZ3NifF9BW3oqZ1a.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c58f9205184ec278d6f97/m_p_aZ3NifF9BW3oqZ1a.jpg">larger</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/692c587d205184ec278d6f91/s_p_MvOQRFKiCv6XaXOd.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c587d205184ec278d6f91/m_p_MvOQRFKiCv6XaXOd.jpg">larger</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/692c58ee205184ec278d6f96/s_p_5wNRtqyrpQivbBim.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c58ee205184ec278d6f96/m_p_5wNRtqyrpQivbBim.jpg">larger</a>] [<a href="https://res.bibleox.com/s/img/image/simple/692c58e0205184ec278d6f95/m_p_FQvEfj70dP7967X3.jpg">extra photo 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/692c58ce205184ec278d6f94/m_p_9xoiCsqROihBYnL0.jpg">extra photo 3</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/692c58b5205184ec278d6f93/s_p_Cvww0C8ZGmbqJS7a.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c58b5205184ec278d6f93/m_p_Cvww0C8ZGmbqJS7a.jpg">larger</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/692c5882205184ec278d6f92/s_p_WU59e3c2XbPWkdaM.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c5882205184ec278d6f92/m_p_WU59e3c2XbPWkdaM.jpg">larger</a>]</p><p><strong>Inscriptions:</strong></p><p>All the inscriptions on the floor of the church are a kind of <strong>commemoration lists</strong>. From the earliest times to this day the Orthodox Church has kept the tradition of always adding to the prayers of the services the names of those who built the church or donated something important to it. So here too, with a call to remember them, the names are recorded of those who donated the mosaic floor (the centurion Gaianus Porphyrius), who laid it (Brutius), who donated the altar (Akeptous), and some other names, perhaps relatives of the donors: Primilla, Cyriaca, Dorothea, Chreste. In the same way church vessels were offered in memory of the living and the dead: Eucharistic chalices and censers (see <a href="https://bibleox.com/ru/ru/w/%D0%B4%D1%80%D0%B5%D0%B2%D0%BD%D0%B8%D0%B5-%D0%B8%D0%BA%D0%BE%D0%BD%D1%8B#HH-%D0%95%D0%B2%D1%85%D0%B0%D1%80%D0%B8%D1%81%D1%82%D0%B8%D1%87%D0%B5%D1%81%D0%BA%D0%B8%D0%B5-%D1%87%D0%B0%D1%88%D0%B8-%D0%B8-%D0%BA%D0%B0%D0%B4%D0%B8%D0%BB%D0%B0-%D1%81-%D0%B8%D0%BA%D0%BE%D0%BD%D0%B0%D0%BC%D0%B8-%D0%92%D0%B8%D0%B7%D0%B0%D0%BD%D1%82%D0%B8%D1%8F-%D0%A1%D0%B8%D1%80%D0%B8%D1%8F-%D0%90%D1%82%D1%82%D0%B0%D1%80%D1%83%D1%82%D0%B8">more</a>).</p><blockquote><p>Translation: Akeptous, the God-loving, offered this table to God Jesus Christ as a memorial.</p></blockquote><blockquote><p>EN: Akeptous, the God-loving, offered the table to God Jesus Christ as a memorial.</p></blockquote><blockquote><p>Transcription: <strong>Prosēniken Akeptous, ē philotheos, tēn trapezan Th(e)ō Ι(ēso)u Ch(rist)ō mnēmosunon.</strong></p></blockquote><blockquote><p>Orig: <strong>ΠΡΟСΗΝΙΚΕΝ ΑΚΕΠΤΟΥС, Η ΦΙΛΟΘΕΟС, ΤΗΝ ΤΡΑΠΕΖΑΝ Θ(Ε)Ω Ι(ΗСΟ)Υ Χ(ΡΙСΤ)Ω ΜΝΗΜΟСΥΝΟΝ</strong></p></blockquote><blockquote><p>ΠΡΟϹΗΝΙΚΕΝ</p><p>ΑΚΕΠΤΟΥϹ,</p><p>Η ΦΙΛΟΘΕΟϹ,</p><p>ΤΗΝ ΤΡΑΠΕ-</p><p>ZΑΝ <strong>{ΘW} {ΙΥ} {ΧW}*</strong></p><p>ΜΝΗΜΟϹΥΝΟΝ</p></blockquote><p>*Nomina sacra: <strong>ΘW ΙΥ ΧW</strong> = θεῷ Ἰησοῦ Χριστῷ = God Jesus Christ</p><img src="https://res.bibleox.com/s/img/image/simple/692c5df3205184ec278d6f9a/s_p_swifwBDbtzgImkZ6.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c5df3205184ec278d6f9a/m_p_swifwBDbtzgImkZ6.jpg">larger</a>]</p><hr><blockquote><p>ΕΝ: Remember Primilla and Cyriaca and Dorothea, and moreover also Chreste.</p></blockquote><blockquote><p>Translation: Remember Primilla and Cyriaca and Dorothea, and also Chreste.</p></blockquote><blockquote><p>Orig: <strong>ΜΝΗΜΟΝΕΥСΑΤΕ ΠΡΙΜΙΛΛΗС ΚΑΙ ΚΥΡΙΑΚΗС ΚΑΙ ΔWΡΟΘΕΑС ΕΤΙ ΔΕ ΚΑΙ ΧΡΗСΤΗ</strong></p></blockquote><blockquote><p>Fixed: <strong>ΜΝΗΜΟΝΕΥСΑΤΕ ΠΡΙΜΙΛΛΗС ΚΑΙ ΚΥΡΙΑΚΗΣ ΚΑΙ ΔΩΡΟΘΕΑΣ ΕΤΙ ΔΕ ΚΑΙ ΧΡΗΣΤΗ</strong></p></blockquote><img src="https://res.bibleox.com/s/img/image/simple/692c5dec205184ec278d6f99/s_p_LVbgKrKO7P3dfEJP.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c5dec205184ec278d6f99/m_p_LVbgKrKO7P3dfEJP.jpg">larger</a>]</p><hr><blockquote><p>Translation: Gaianus, also called Porphyrius, centurion, our brother, at his own expense and with great generosity paved this floor. Brutius carried out the work.</p></blockquote><blockquote><p>EN: Gaianus, also called Porphyrius, centurion (xp), our brother, has made the pavement at his own expense as an act of liberality. Brutius has carried out the work.</p></blockquote><blockquote><p>Orig: <strong>ΓΑΙΑΝΟС Ο ΚΑ ΠΟΡΦΥΡΙС ΧΡ* ΑΔΕΛΦΟС ΗΜWΝ ΕΚ ΦΙΛΟΤΕ ΙΜΙС ΑΜΕΝ ΟСΕΚΤW ΝΙΔΙWΝ ΕΨΙ ΦΟΛΟΓΗСΕΝ. ΒΡΟVΤΙС ΗΡΓΑСΑΤΟ.</strong></p></blockquote><blockquote><p>Fixed: <strong>ΓΑΙΑΝΟΣ Ο ΚΑ ΠΟΡΦΥΡΙΣ ΧΡ* ΑΔΕΛΦΟΣ ΗΜΩΝ ΕΚ ΦΙΛΟΤΕ ΙΜΙΣ ΑΜΕΝ ΟΣΕΚΤΩ ΝΙΔΙΩΝ ΕΨΙ ΦΟΛΟΓΗΣΕΝ. ΒΡΟΥΤΙΣ ΗΡΓΑΣΑΤΟ.</strong></p></blockquote><p><strong>*ΧΡ — hekatontarches — centurio</strong></p><img src="https://res.bibleox.com/s/img/image/simple/692c5e27205184ec278d6f9b/s_p_Qk321JfFTD4dDmnd.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c5e27205184ec278d6f9b/m_p_Qk321JfFTD4dDmnd.jpg">larger</a>]</p><h3>The Church at Dura-Europos (Syria)</h3><p>244: the Christian church at Dura-Europos</p><img src="https://res.bibleox.com/s/img/image/simple/6931880c205184ec278d6fa6/s_p_DFnp7s0vcTbXb3Qn.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931880c205184ec278d6fa6/m_p_DFnp7s0vcTbXb3Qn.jpg">larger</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/69318806205184ec278d6fa5/s_p_PuUKcoZEfAVSlPNM.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69318806205184ec278d6fa5/m_p_PuUKcoZEfAVSlPNM.jpg">larger</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/69318802205184ec278d6fa4/s_p_MF4zgk1ySUOBpqnG.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69318802205184ec278d6fa4/m_p_MF4zgk1ySUOBpqnG.jpg">larger</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/414/s_p_UgKueSl1yxG0SfbA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/414/m_p_UgKueSl1yxG0SfbA.jpg">larger</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/69330ed8205184ec278d6fc0/s_p_kXy4nTuYVCOxuDib.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69330ed8205184ec278d6fc0/m_p_kXy4nTuYVCOxuDib.jpg">larger</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/693187fd205184ec278d6fa3/s_p_R3poESL99kNRMpXi.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/693187fd205184ec278d6fa3/m_p_R3poESL99kNRMpXi.jpg">larger</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/69330e9e205184ec278d6fbf/s_p_ThLs4WrxsJ3ykxKU.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69330e9e205184ec278d6fbf/m_p_ThLs4WrxsJ3ykxKU.jpg">larger</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/69330e76205184ec278d6fbe/s_p_NykNwaI9TEwz1Ccf.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69330e76205184ec278d6fbe/m_p_NykNwaI9TEwz1Ccf.jpg">larger</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/69330e70205184ec278d6fbd/s_p_Rd3jEzEeesXUCTmh.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69330e70205184ec278d6fbd/m_p_Rd3jEzEeesXUCTmh.jpg">larger</a>]</p><p>The church has wall frescoes with scenes from the New Testament: the rescue of the apostle Peter from drowning and the healing of the paralytic at the Sheep Pool (of the row of Christ’s miracles only these two frescoes survive), and the Good Shepherd.</p><p><strong>The rescue of the apostle Peter from drowning</strong></p><img src="https://res.bibleox.com/s/img/image/simple/692c8038205184ec278d6f9e/s_p_QQ2Rml8gUWsyQtS9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c8038205184ec278d6f9e/m_p_QQ2Rml8gUWsyQtS9.jpg">larger</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6786b88ddba77200015ae11c/m_p_do380IVDukCAfdFk.jpg">version 2</a>]</p><p><strong>The healing of the paralytic at the Sheep Pool</strong></p><img src="https://res.bibleox.com/s/img/image/simple/6786b889dba77200015ae11b/s_p_k1a5GDBvfzTCWmZv.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6786b889dba77200015ae11b/m_p_k1a5GDBvfzTCWmZv.jpg">larger</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6786bb0bdba77200015ae11d/m_p_dCRD85foL69l7kih.jpg">another version</a>]</p><p><strong>The image by the baptismal font (room #6): the Good Shepherd returns the lost sheep to the flock</strong></p><img src="https://res.bibleox.com/s/img/image/simple/6931870c205184ec278d6fa2/s_p_uBkNi8jGsMFpOQSM.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931870c205184ec278d6fa2/m_p_uBkNi8jGsMFpOQSM.jpg">larger</a>]</p><h3>Eusebius of Caesarea (Pamphili), bishop, church historian (c. 258–339)</h3><p>He writes about the building of Christian churches in every city in the period before the reign of the Roman emperor Diocletian (reigned 284–305). In 303 Diocletian issued an edict ordering Christian churches to be destroyed. Eusebius was about 45 at the time of this edict, so he must have witnessed both the building of these churches and their destruction:</p><blockquote><p>5. With what goodwill did the procurators and governors treat the heads of the churches! How could one describe those <strong>gatherings of many thousands in every city</strong>, those remarkable crowds <strong>flocking to the houses of prayer! The old buildings were not enough; <mark>in every city they raised new and spacious churches</mark> from the foundations (εὐρείας εἰς πλάτος ἀνὰ πάσας τὰς πόλεις ἐκ θεμελίων ἀνίστων <mark>ἐκκλησίας</mark>).</strong></p><p>&lt;…&gt;</p><p>4. It was the nineteenth year of the reign of Diocletian, in the month Dystrus (which the Romans call March), as the feast of the Lord’s Passion was approaching, when <strong><mark>imperial edicts were posted everywhere, ordering the churches to be razed to the ground</mark> (βασιλικὰ γράμματα, τὰς μὲν <mark>ἐκκλησίας</mark> εἰς ἔδαφος φέρειν)</strong>, the Scriptures to be burned, and those who held to Christianity to be deprived of their honors;</p></blockquote><p>(<a href="https://bibleox.com/en/grc/w/%CE%95%CE%9A%CE%9A%CE%9B%CE%97%CE%A3%CE%99%CE%91%CE%A3%CE%A4%CE%99%CE%9A%CE%97%CE%A3_%CE%99%CE%A3%CE%A4%CE%9F%CE%A1%CE%99%CE%91%CE%A3-8/#:~:text=%E1%BC%80%CE%BD%E1%BD%B0%20%CF%80%E1%BD%B1%CF%83%CE%B1%CF%82%20%CF%84%E1%BD%B0%CF%82%20%CF%80%E1%BD%B9%CE%BB%CE%B5%CE%B9%CF%82%20%E1%BC%90%CE%BA%20%CE%B8%CE%B5%CE%BC%CE%B5%CE%BB%E1%BD%B7%CF%89%CE%BD%20%E1%BC%80%CE%BD%E1%BD%B7%CF%83%CF%84%CF%89%CE%BD%20%E1%BC%90%CE%BA%CE%BA%CE%BB%CE%B7%CF%83%E1%BD%B7%CE%B1%CF%82">Church History, Book 8, 1.5 and 2.4</a>; translated from the Greek)</p><h2>Disputed Finds</h2><h3><strong>A house in Herculaneum (</strong>1st century<strong>)</strong></h3><img src="https://res.bibleox.com/s/img/image/simple/67e428d39a4a346bba31e8ba/s_p_F0lTpC2rqw7PVyf1.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/67e428d39a4a346bba31e8ba/m_p_F0lTpC2rqw7PVyf1.jpg">larger</a>] [<a href="https://res.bibleox.com/s/img/image/simple/69330b68205184ec278d6fb8/m_p_oEOCtcPUBThtuirO.jpg">version 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/69330cb6205184ec278d6fb9/m_p_zMmSTHDi5RoizXsX.jpg">version 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/69330cbb205184ec278d6fba/m_p_Jv9gdiBWmrMB5tc4.jpg">version 4</a>] [<a href="https://res.bibleox.com/s/img/image/simple/67e428d79a4a346bba31e8bb/m_p_1sEN1KSZxei96K4S.jpg">version 5</a>] [<a href="https://res.bibleox.com/s/img/image/simple/67e428db9a4a346bba31e8bc/m_p_TgMWk123osBJ9une.jpg">version 6</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/69330cc3205184ec278d6fbc/s_p_YLRMNDvDg7nCTh3X.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69330cc3205184ec278d6fbc/m_p_YLRMNDvDg7nCTh3X.jpg">larger</a>]</p><p>In 79 the volcano Vesuvius erupted and buried cities such as Pompeii, Stabiae and Herculaneum under its ash. In Herculaneum a <a href="https://ru.wikipedia.org/wiki/%D0%93%D0%B5%D1%80%D0%BA%D1%83%D0%BB%D0%B0%D0%BD%D1%83%D0%BC#%D0%94%D0%BE%D0%BC_%D0%B4%D0%B2%D1%83%D1%85%D1%81%D0%BE%D1%82%D0%BB%D0%B5%D1%82%D0%B8%D1%8F">house</a> (in Russian) was found (named the House of the Bicentenary after the anniversary of the excavations); on its upper floor, in one of the rooms, there is a <a href="https://ermakvagus.com/Europe/Italy/Pompeii/christianity_pompeii_rus.html">cross-shaped recess</a> (in Russian) in the wall, right in the center above a wooden cabinet. Some suppose that a wooden cross for prayer hung there and that the room was used for Christian services or for prayer at home. However, there are serious arguments against this. In the same city a shelf was found that might have left a similar mark on a wall.</p><img src="https://res.bibleox.com/s/img/image/simple/6932ff2b205184ec278d6fb6/s_p_cXmpauqq2EYuH6ww.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6932ff2b205184ec278d6fb6/m_p_cXmpauqq2EYuH6ww.jpg">larger</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6932ff36205184ec278d6fb7/s_p_KIfO7M0rbhGbWoIk.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6932ff36205184ec278d6fb7/m_p_KIfO7M0rbhGbWoIk.jpg">larger</a>] [<a href="https://res.bibleox.com/s/img/image/simple/69330cbf205184ec278d6fbb/m_p_WL1FQysNlwZc0yT9.jpg">version 2</a>]</p><p>The shelf is not quite the same: it has a rather large projection to the left and right and a smaller one downward. Besides, in the House of the Bicentenary there were probably two doors closing over this place in the wall. Still, it is quite likely that the House of the Bicentenary had an ordinary shelf here, not a cross. The reader must decide how far to trust one conclusion or another. Here we have only gathered what is known about this find.</p>'
