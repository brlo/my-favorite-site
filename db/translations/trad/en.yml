  title: Christian Burials and Inscriptions
  title_sub:
  body: '<h2>Inscriptions at the Burials of Christians of the First Centuries</h2><p>Inscriptions in the triclia of the so-called “Memoria Apostolorum” on the Appian Way, a shrine built in the mid-3rd century, between 238 and 260. At that time, in the 3rd century, Christian prayer inscriptions began to appear in the triclia, such as “<em>Paule ed Petre petite pro Victore</em>” and others like it (given below). People continued to write them up to the age of Constantine the Great. [1]</p><img src="https://res.bibleox.com/s/img/image/simple/483/s_p_1D8zprHe86ZZn5O9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/483/m_p_1D8zprHe86ZZn5O9.jpg">larger</a>]</p><h3><strong>Keep in mind, in your prayers </strong>(in mente habete, in orationibus vestris):</h3><p>12912: [Petre et] Paul[e] | in m[ente] abete in | ora[tion]ibus vestris/ — <strong>“Peter and Paul, keep in mind, in your prayers…”</strong></p><h3><strong>Intercede </strong>(petite) (or “pray”, “ask”)</h3><p>12918: [Paul]e et Petre petite | [pro] nobis omnibus/ — <strong>“Paul and Peter, intercede for us all!”</strong></p><p>12931: Petr[e] et Pau[l]e petite | pro [Le]ontium / — <strong>“Peter and Paul, intercede for Leontius!”</strong></p><p>12933: Pa[ul]e et Pet|re apetite pro Da|tivu in perpetu`u´m/ — <strong>“Paul and Peter, intercede for Dativus for ever!”</strong></p><p>12989: Paule ed Petre petite | pro Victore/ — <strong>“Paul and Peter, intercede for Victor!”</strong></p><p>12946: [Petre et Pa]ulae spir[ita sancta vestra petant pro - - -]/ — <strong>“Peter and Paul, may your holy spirits intercede for [- - -]!”</strong></p><h3><strong>conservate</strong> — <strong>protect</strong> (or “keep”)</h3><p>12991: Petre et Paule cons[ervate - - -]/ — <strong>“Peter and Paul, protect [- - -]!”</strong></p><p>12996: sa[lva Paule et] | Petr[e - - - et] | Mart[yrium et] | conse[rvate in] | do[mino - - -]/ — <strong>“Save, O Paul and Peter, [- - -] and Martyrius, and protect them in the Lord [- - -]!”</strong></p><p>13026: [- - - roga]mus | [conse]rvate nos [omnes]/ — <strong>“[- - -] we pray, protect us all!”</strong></p><h3><strong>Simple invocations</strong></h3><p>12909: Petr[e et Paule]/ — <strong>“O Peter and Paul!”</strong></p><h3><strong>Help for sinners</strong></h3><p>12967: Petre et Paule sub|venite Prim[o] | peccatori/ — <strong>“Peter and Paul, come to the help of Primus, a sinner!”</strong></p><h3><strong>Many invocations are written in Greek, or in Latin using Greek letters</strong></h3><p>12927: Παῦλε {μ} καί | μου πατ|ρός/ — <strong>“Paul, and (help) my father!”</strong></p><p>12997: [Παυλ]ε ετ Πετ[ρε ιν μεν]/[τε ν]ος αβετε [ιν ορα]/[τι]ωνες βεστ[ρας]/ — <strong>“Paul and Peter, keep in mind, in your prayers…”</strong></p><p>13045: [Πα]υ[λε ετ Πετρε] | [ι]ν με[ντε αβετε] | Αὐφίδ[ιον υἱόν - - -] | μου/ — <strong>“Paul and Peter, keep in mind Aufidius, my son!”</strong></p><p>13069: Πέτρε Παίτρε μνημόνευαι | Τιμοκράτην καὶ Εὐ|τυχείαν κινα(?) καὶ | ἐσώρα(?) ++ [- - -]/ — <strong>“Peter, Peter, remember Timocrates and Eutychia, and (…) ++ [- - -]!”</strong></p><p>13045: [κομμ]ανδαμ[ους? - - -]/<strong> </strong>— <strong>“We commend [- - -].”</strong></p><p>13049: Παῦλε καὶ Π[έτρε ἔχετε] / μνί[α]ς/ — <strong>“Paul and Peter, keep in remembrance [- - -]!”</strong></p><p>13055: [Παῦλε καὶ Πέτ]ρε εἰς μνε[ίαν] / [ἔχετε τὸν ᾿Ιρ]ίνες φίλι[ον]/ — <strong>“Paul and Peter, remember the beloved of Irene.”</strong></p><p>13070: Παυλε Πετρε | Χαλκηδονι ανιμα | βωβυς κομαν|[δ]ω Λαυrους/ — <strong>“Paul and Peter, I, Laurus (Laurusius?), commend to you the soul of Chalcedonius!”</strong></p><p>13071: &lt;Π&gt;α[ῦλ]ος καὶ | Π[έτρο]ς συν|τηρή[σα]τε θ(εο)ῦ δούλους | πνεύματα | ἅγεια συντη|ρήσαται ἡμᾶ|ς ἴνα πολλοῖς | ἔτεσε[ι ζῶμεν]/ — <strong>“Paul and Peter, keep the servants of God! Holy spirits, keep us, that we may live many years!”</strong></p><p>13073: [Παυλε] ετ Πετρε | [ιν με]ντε [ν]ος αβε|[τοτε εἰς το]ὺς ἐῶ[νας]/<strong> </strong>— <strong>“Paul and Peter, keep us in mind for ever…”</strong></p><h3><strong>promisit / votum fecit</strong> — <strong>made a vow</strong></h3><p>13091: [- - - i]dus m[- - -] | Eulogius votum f[ecit]/ — <strong>“[- - -] on the [- - -] day of the Ides [- - -] Eulogius made a vow [- - -].”</strong></p><h3><strong>Mentions of the refrigerium</strong> (memorial meal):</h3><p>12942: refrigerav[it] | [F]elicissimus cum s[uis]/ — <strong>“Felicissimus held a meal with his family.”</strong></p><p>12981: Petro et Paulo | Tomius Coelius | refri`ger´&lt;i&gt;um feci/ — <strong>“For Peter and Paul I, Tomius Coelius, held a meal.”</strong></p><p>13003: [---] at Paulu[m] | et Pet[rum] | refri[geravi - - -]/ — <strong>“at Paul and Peter’s I held a meal.”</strong></p><p>Source: <a href="http://csla.history.ox.ac.uk/record.php?recid=E05087">http://csla.history.ox.ac.uk/record.php?recid=E05087</a></p><hr><h3>Addresses to God</h3><ul><li><p>DEVS TE PRECOR VТ PARADISVM LVCIS POSSIT VIDERE – “<strong>Lord, I pray You, may he see the light of paradise</strong>”.</p></li><li><p>DOMINE NE QVANDO ADVMBRETVR SPIRITVS VENERES – “<strong>Lord, may the soul of Venus never be darkened</strong>”.</p></li></ul><h3>The departed asked to intercede</h3><ul><li><p>ET IN ORATIONIS TVIS ROGES PRO NOBIS QVIA SCIMVS TE ☧ – “<strong>In your prayers pray for us, for we know that you are in Christ</strong>”.</p></li><li><p>ORO SCIO NAMQVE BEATAM – “<strong>I ask you, for I know that you are in blessedness</strong>”.</p></li><li><p>ORA PRO PARENTI BVS TVIS – “<strong>Pray for your family</strong>”.</p></li><li><p>PETE PRO NOS VТ SALVI SIMVS – “<strong>Pray for us, that we may be saved</strong>”.</p></li><li><p>IN ORATIONIS TVIS ROGES PRO NOBIS – “<strong>In your prayers, ask for us</strong>”.</p></li><li><p>ATTICE SPIRITVS TVS IN BONV ORA PRO PARENTIBVS TVIS – “<strong>Atticus, your soul is in blessedness; pray for your family</strong>”.</p></li></ul><p>Only part is given here. The rest of the material can be read at the link.</p><h3><strong>Inscriptions and Symbolic Images</strong></h3><ul><li><p>The word VIVAS, that is, “<strong>live</strong>”, also very often written on tombs, expresses the wish of eternal life and blessedness for the departed;</p></li><li><p>VIVAS IN DEO – “<strong>live in God</strong>”;</p></li><li><p>VIBAS IN SANCTIS – “<strong>live among the saints</strong>”.</p></li></ul><h3>The departed has attained salvation</h3><p>Sometimes it is said more affirmatively that the buried person is among the elect:</p><ul><li><p>ACCEPIT REQVI EM IN DEO – “<strong>He has received rest in God</strong>”;</p></li><li><p>SCIMVS ТЕ IN – “<strong>We know that you are in Christ</strong>”;</p></li><li><p>FRVCTVOSVS ANIMA ТVА СVМ IVSTIS – “<strong>Fructuosus, your soul is with the righteous</strong>”;</p></li><li><p>REQVI EM ADCEPIT IN DEO PATRE NOSTRO ET CHRISTO EIVS – “<strong>He has received rest in God our Father and in His Christ</strong>”;</p></li><li><p>ACCEPTA APVD DEVM – “<strong>Received by God</strong>” (of a woman);</p></li><li><p>RECEPTVS AD DEVM – “<strong>Received by God</strong>”;</p></li><li><p>ТЕСVМ PAX CHRISTI – “<strong>the peace of Christ be with you</strong>”;</p></li><li><p>SEMPER VIVE IN РАСЕ – “<strong>Live for ever in peace</strong>”;</p></li><li><p>IN РАСЕ ET IN DOMO AETERNA DEI – “<strong>In peace and in the eternal house of God</strong>”.</p></li><li><p>VIVI IN GLORIA DEI ET IN PACE DOMINI NOSTRI ☧ – “<strong>You live in the glory of God and in the peace of our Lord Christ</strong>”; here the Savior’s name is written with His monogram ☧;</p></li><li><p>ELATVS EST, also a kind of acclamation, found only once or twice, can be translated: “<strong>he has risen to God</strong>”.</p></li></ul><h3>Paradise — a place of light</h3><p>In the epitaphs of the first Christians paradise is called a place of light and radiance; here are a few examples:</p><ul><li><p>CVIVS SPIRITVS IN LVCE DOMINI SVSCEPTVS EST – “<strong>His soul has been received into the light of the Lord</strong>”.</p></li><li><p>IN CHRISTVM CREDENS PREMIA LVCIS АВЕТ – “<strong>Believing in Christ, he has light as his reward</strong>”.</p></li><li><p>AETERNA TIBI LUX TIMOTHEA IN ☧– “<strong>Eternal light to you, Timothea, in (Christ)</strong>”.</p></li></ul><h3></h3><p>Book (in Russian): <strong>A. von Fricken. The Roman Catacombs and the Monuments of Early Christian Art. Moscow: K. T. Soldatenkov, 1872–1877–1880–1885.</strong> [2]</p>'
