- src: 2NCD_Постная_кухня
  path: Lc4k_Lenten_Cooking
  title: Lenten Cooking
  title_sub:
  body: '<p>This article only briefly outlines what Lenten (fasting) food looks like, to help someone who has not fasted before, is not used to cooking Lenten meals, and does not know what could be prepared during a fast.</p><blockquote><p>“But the Lord answered her, ‘Martha, Martha, you are worried and distracted by many things; there is need of only one thing. Mary has chosen the better part, which will not be taken away from her’” (<a href="https://bibleox.com/en/en-nrsv/lk/10/#L41-42">Luke 10:41-42</a>)</p></blockquote><blockquote><p>“Be on guard so that your hearts are not weighed down with dissipation and drunkenness and the worries of this life, and that day does not catch you unexpectedly” (<a href="https://bibleox.com/en/en-nrsv/lk/21/#L34">Luke 21:34</a>)</p></blockquote><h2>Soups</h2><h3>Soups on vegetable broth (with fried onion and carrot)</h3><p>Potatoes go well in almost all of them:</p><ul><li><p><strong>soups with grains</strong> (buckwheat, rice, pearl barley, lentils, peas),</p></li><li><p><strong>pasta soups</strong>,</p></li><li><p><strong>vegetable soups</strong>,</p></li><li><p><strong>borscht</strong> (beetroot soup),</p></li><li><p><strong>rassolnik</strong> (soup with pickled cucumbers),</p></li><li><p><strong>shchi</strong> (cabbage soup),</p></li><li><p><strong>ukha</strong> (fish soup, when the rule allows fish).</p></li></ul><h2>Side Dishes</h2><ul><li><p><strong>oatmeal</strong> (flakes),</p></li><li><p><strong>boiled</strong> rice, buckwheat, lentils, couscous, bulgur, quinoa, polenta (cornmeal porridge) and other grains. Fried onion and carrot go well with them.</p></li><li><p><strong>pilaf</strong> (chickpeas can be added to make it more filling),</p></li><li><p><strong>mixes with boiled rice</strong>: Hawaiian, Mexican, etc.</p></li><li><p><strong>pasta</strong>: boiled, fried before boiling, pasta with mushrooms, with canned fish (tuna, sardines, etc., when the rule allows)</p></li><li><p><strong>potatoes</strong>: fried, baked, boiled, mashed,</p></li><li><p><strong>stewed cabbage</strong>,</p></li><li><p><strong>vegetable stew</strong>: potatoes, carrots, onion, zucchini, bell pepper, mushrooms, tomato paste or tomato, eggplant,</p></li><li><p><strong>boiled vegetables</strong> (cauliflower, broccoli, green peas, corn),</p></li><li><p><strong>vareniki</strong> (dumplings): with potatoes, mushrooms, cherries,</p></li><li><p><strong>tofu</strong>,</p></li><li><p><strong>chickpeas with vegetables</strong>,</p></li><li><p><strong>mushrooms</strong>, fried,</p></li><li><p><strong>zucchini</strong>, fried,</p></li><li><p><strong>draniki</strong> (fritters of grated potato or zucchini, rice or wheat flour, salt),</p></li><li><p><strong>ratatouille</strong>,</p></li><li><p><strong>baked pumpkin</strong>,</p></li><li><p><strong>grilled vegetables</strong>,</p></li><li><p><strong>vegetable patties</strong> (from beans).</p></li></ul><h2>Salads</h2><ul><li><p><strong>from fresh vegetables</strong>: cucumber, tomato, young cabbage, red onion, lettuce, bell pepper, herbs, spices,</p></li><li><p><strong>from boiled vegetables</strong>: vinegret (potatoes, beetroot, carrots, beans, canned peas, pickled cucumbers, onion, sauerkraut),</p></li><li><p><strong>Chinese cabbage salad</strong>: Chinese cabbage, corn, Lenten mayonnaise[1],</p></li><li><p><strong>boiled beetroot</strong> with Lenten mayonnaise[1],</p></li><li><p><strong>fruit salad</strong>,</p></li><li><p><strong>avocado salad</strong>,</p></li></ul><h2>Pickles</h2><ul><li><p><strong>sauerkraut</strong>,</p></li><li><p><strong>cucumbers</strong>: pickled, lightly salted, smashed,</p></li><li><p><strong>carrots</strong>, Korean style,</p></li><li><p><strong>onion</strong> marinated in vinegar,</p></li><li><p>and so on.</p></li></ul><h2>Baked Goods</h2><ul><li><p><strong>bread</strong>,</p></li><li><p><strong>Lenten buns</strong>: baked in the oven or in a frying pan, or bought in a shop,</p></li><li><p><strong>filled pies</strong>: with cherries, stewed cabbage, potatoes and onion,</p></li><li><p><strong>Lenten pancakes</strong> (water instead of milk, bananas instead of eggs),</p></li></ul><h2>Preserves</h2><ul><li><p><strong>zucchini</strong> <strong>spread</strong>,</p></li><li><p><strong>eggplant</strong> <strong>spread</strong>,</p></li><li><p><strong>hummus</strong>,</p></li><li><p><strong>corn</strong>,</p></li><li><p><strong>mushrooms</strong>,</p></li><li><p><strong>beans</strong>,</p></li><li><p><strong>green peas</strong>,</p></li><li><p><strong>sun-dried tomatoes</strong>,</p></li><li><p><strong>guacamole</strong> without cheese,</p></li></ul><h2>Dried Fruit and Nuts</h2><ul><li><p><strong>nuts</strong>,</p></li><li><p><strong>berries and fruit</strong>, dried or freeze-dried,</p></li><li><p><strong>halva</strong>,</p></li></ul><h2>Sandwiches and Snacks</h2><ul><li><p>bread with honey,</p></li><li><p>bread with tomato, basil and salt.</p></li></ul><h2>Drinks</h2><ul><li><p>Kvass (a fermented bread drink)</p></li><li><p>Kissel (a thick fruit drink set with starch)</p></li><li><p>Kompot (of fresh berries or dried fruit)</p></li><li><p>Mors (berry juice drink)</p></li><li><p>Smoothies</p></li><li><p>Lemonade</p></li><li><p>Tea</p></li><li><p>Coffee without milk</p></li><li><p>Water</p></li></ul>'
  references: "<ol><li><p><strong>Lenten mayonnaise</strong>: the liquid from canned peas, vegetable oil, mustard, salt, sugar, vinegar. Blend until smooth.</p></li></ol><p>Translated from the Russian by Rodion Vlasov, with the help of AI. Bible quotations: NRSV.</p>"
