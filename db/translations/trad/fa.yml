      </ol><h3>تصاویر کهن گوناگون که در مجموعهٔ اصلی نیامده‌اند</h3><p><a href="https://bibleox.com/fa/fa/w/Ik5v_تصاویر_کهن_گوناگون_خارج_از_مجموعه_اصلی">https://bibleox.com/fa/fa/w/Ik5v_تصاویر_کهن_گوناگون_خارج_از_مجموعه_اصلی</a></p><p>ترجمه: رودیون ولاسوف با کمک هوش مصنوعی. متن پایه: اصل روسی. نقل‌قول‌های کتاب مقدس: ترجمه از متن روسی (سینودی)؛ چون هنوز ترجمهٔ کتاب مقدس به فارسی در سایت نیست، ارجاع‌ها بدون پیوند داده شده‌اند.</p>
