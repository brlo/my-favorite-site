  - src: Древние_христианские_храмы
    path: Ch2c_کلیساهای_باستانی_مسیحی
    title: "کلیساهای باستانی مسیحی"
    body: |-
      <h2>سرلوحه</h2><blockquote><p>«و برخی از فریسیان از میان مردم به او گفتند: ای استاد، شاگردانت را بازدار! اما او در پاسخ به آنان گفت: به شما می‌گویم که <strong>اگر اینان خاموش شوند، سنگ‌ها فریاد برمی‌آورند</strong>» (لوق ۱۹:۳۹-۴۰)</p></blockquote><h2>سدهٔ سوم</h2><h3>کلیسای نزدیک شهر باستانی مجدّو، در آبادی <a href="https://he.wikipedia.org/wiki/%D7%9C%D7%92%D7%99%D7%95">Legio</a> (حدود سال ۲۳۰)</h3><p>در کلیساهای باستانی مسیحی، مذبح اغلب در مرکز قرار می‌گرفت. این کلیسا نمونهٔ آشکاری از این امر است.</p><p>نه چندان دور از شهر مجدّو (در روزگار باستان در آنجا آبادی <a href="https://he.wikipedia.org/wiki/%D7%9C%D7%92%D7%99%D7%95">Legio</a> قرار داشت، زیرا لژیونی رومی در آن مستقر بود). بر بلندی آن آبادی ساختمانی بنا شد که بر پایهٔ سکه‌ها، سفالینه‌ها و شیوهٔ نگارش، به سال ۲۳۰ تاریخ‌گذاری شد. یکی از اتاق‌های ساختمان، کلیسای مسیحی بود. بر کف آن چند موزائیک بزرگ با کتیبه‌ها دیده می‌شود (یکی از آنها مسیح را خدا می‌نامد) و در مرکز آن مذبح قرار دارد. همچنین در نزدیکی آن کتیبه‌ای هست که نشان می‌دهد این میز از سوی چه کسی اهدا شده است.</p><img src="https://res.bibleox.com/s/img/image/simple/692c58f9205184ec278d6f97/s_p_aZ3NifF9BW3oqZ1a.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c58f9205184ec278d6f97/m_p_aZ3NifF9BW3oqZ1a.jpg">بزرگ‌تر</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/692c587d205184ec278d6f91/s_p_MvOQRFKiCv6XaXOd.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c587d205184ec278d6f91/m_p_MvOQRFKiCv6XaXOd.jpg">بزرگ‌تر</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/692c58ee205184ec278d6f96/s_p_5wNRtqyrpQivbBim.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c58ee205184ec278d6f96/m_p_5wNRtqyrpQivbBim.jpg">بزرگ‌تر</a>] [<a href="https://res.bibleox.com/s/img/image/simple/692c58e0205184ec278d6f95/m_p_FQvEfj70dP7967X3.jpg">عکس اضافی 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/692c58ce205184ec278d6f94/m_p_9xoiCsqROihBYnL0.jpg">عکس اضافی 3</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/692c58b5205184ec278d6f93/s_p_Cvww0C8ZGmbqJS7a.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c58b5205184ec278d6f93/m_p_Cvww0C8ZGmbqJS7a.jpg">بزرگ‌تر</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/692c5882205184ec278d6f92/s_p_WU59e3c2XbPWkdaM.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c5882205184ec278d6f92/m_p_WU59e3c2XbPWkdaM.jpg">بزرگ‌تر</a>]</p><p><strong>کتیبه‌ها:</strong></p><p>همهٔ کتیبه‌های کف کلیسا به نوعی <strong>یادداشت‌های یادبود</strong> هستند. از روزگار باستان تا کنون در کلیساهای ارتدکس این سنت وجود دارد که هنگام برگزاری مراسم نیایش در کلیسا، همیشه به یادبود در دعا نام کسانی نیز افزوده شود که کلیسا را ساخته یا چیز مهمی اهدا کرده‌اند. اینجا نیز همراه با فراخوان به یادبود، نام کسانی ثبت شده است که موزائیک کف را اهدا کردند (سنتوریون گایوس پورفیریوس)، کسانی که آن را نهادند (بروتوس)، کسانی که مذبح را اهدا کردند (آکپتا)، و همچنین برخی نام‌های دیگر، شاید خویشاوندان اهداکنندگان: پریمیللا، کیریاک، دوروتئا، کریسته. به همین شیوه، به یاد زندگان و مردگان ظروف کلیسایی نیز اهدا می‌شد: جام‌های عشای ربانی و مجمره‌ها (برای <a href="https://bibleox.com/fa/fa/w/Ik1c_مجموعه_آیکون_های_کهن#HH-جامهای-عشای-ربانی-و-مجمرهها-با-آیکونها-بیزانس-سوریه-آتاروتی">آگاهی بیشتر</a> بنگرید).</p><blockquote><p>FA: آکپتا، خدادوست، این میز (مذبح) را به یادگار به خدای عیسی مسیح تقدیم کرد</p></blockquote><blockquote><p>EN: Akeptous, the God-loving, offered the table to God Jesus Christ as a memorial.</p></blockquote><blockquote><p>Transcription: <strong>Prosēniken Akeptous, ē philotheos, tēn trapezan Th(e)ō Ι(ēso)u Ch(rist)ō mnēmosunon.</strong></p></blockquote><blockquote><p>Orig: <strong>ΠΡΟСΗΝΙΚΕΝ ΑΚΕΠΤΟΥС, Η ΦΙΛΟΘΕΟС, ΤΗΝ ΤΡΑΠΕΖΑΝ Θ(Ε)Ω Ι(ΗСΟ)Υ Χ(ΡΙСΤ)Ω ΜΝΗΜΟСΥΝΟΝ</strong></p></blockquote><blockquote><p>ΠΡΟϹΗΝΙΚΕΝ</p><p>ΑΚΕΠΤΟΥϹ,</p><p>Η ΦΙΛΟΘΕΟϹ,</p><p>ΤΗΝ ΤΡΑΠΕ-</p><p>ZΑΝ <strong>{ΘW} {ΙΥ} {ΧW}*</strong></p><p>ΜΝΗΜΟϹΥΝΟΝ</p></blockquote><p>*Nomina Sacra: <strong>ΘW ΙΥ ΧW</strong> = θεῷ Ἰησοῦ Χριστῷ = خدای عیسی مسیح</p><img src="https://res.bibleox.com/s/img/image/simple/692c5df3205184ec278d6f9a/s_p_swifwBDbtzgImkZ6.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c5df3205184ec278d6f9a/m_p_swifwBDbtzgImkZ6.jpg">بزرگ‌تر</a>]</p><hr><blockquote><p>ΕΝ: Remember Primilla and Cyriaca and Dorothea, and moreover also Chreste.</p></blockquote><blockquote><p>FA: پریمیللا و کیریاکا و دوروتئا و همچنین کریسته را یاد کنید</p></blockquote><blockquote><p>Orig: <strong>ΜΝΗΜΟΝΕΥСΑΤΕ ΠΡΙΜΙΛΛΗС ΚΑΙ ΚΥΡΙΑΚΗС ΚΑΙ ΔWΡΟΘΕΑС ΕΤΙ ΔΕ ΚΑΙ ΧΡΗСΤΗ</strong></p></blockquote><blockquote><p>Fixed: <strong>ΜΝΗΜΟΝΕΥСΑΤΕ ΠΡΙΜΙΛΛΗС ΚΑΙ ΚΥΡΙΑΚΗΣ ΚΑΙ ΔΩΡΟΘΕΑΣ ΕΤΙ ΔΕ ΚΑΙ ΧΡΗΣΤΗ</strong></p></blockquote><img src="https://res.bibleox.com/s/img/image/simple/692c5dec205184ec278d6f99/s_p_LVbgKrKO7P3dfEJP.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c5dec205184ec278d6f99/m_p_LVbgKrKO7P3dfEJP.jpg">بزرگ‌تر</a>]</p><hr><blockquote><p>FA: گایوس، همان پورفیریوس، سنتوریون، برادر ما، از دارایی خود با بخشندگی بسیار این کف را سنگ‌فرش کرد. بروتیوس نیز کار را انجام داد.</p></blockquote><blockquote><p>EN: Gaianus, also called Porphyrius, centurion (xp), our brother, has made the pavement at his own expense as an act of liberality. Brutius has carried out the work.</p></blockquote><blockquote><p>Orig: <strong>ΓΑΙΑΝΟС Ο ΚΑ ΠΟΡΦΥΡΙС ΧΡ* ΑΔΕΛΦΟС ΗΜWΝ ΕΚ ΦΙΛΟΤΕ ΙΜΙС ΑΜΕΝ ΟСΕΚΤW ΝΙΔΙWΝ ΕΨΙ ΦΟΛΟΓΗСΕΝ. ΒΡΟVΤΙС ΗΡΓΑСΑΤΟ.</strong></p></blockquote><blockquote><p>Fixed: <strong>ΓΑΙΑΝΟΣ Ο ΚΑ ΠΟΡΦΥΡΙΣ ΧΡ* ΑΔΕΛΦΟΣ ΗΜΩΝ ΕΚ ΦΙΛΟΤΕ ΙΜΙΣ ΑΜΕΝ ΟΣΕΚΤΩ ΝΙΔΙΩΝ ΕΨΙ ΦΟΛΟΓΗΣΕΝ. ΒΡΟΥΤΙΣ ΗΡΓΑΣΑΤΟ.</strong></p></blockquote><p><strong>*ΧΡ — hekatontarches — centurio</strong></p><img src="https://res.bibleox.com/s/img/image/simple/692c5e27205184ec278d6f9b/s_p_Qk321JfFTD4dDmnd.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c5e27205184ec278d6f9b/m_p_Qk321JfFTD4dDmnd.jpg">بزرگ‌تر</a>]</p><h3>کلیسا در دورا-اوروپوس (سوریه)</h3><p>۲۴۴ م. — کلیسای مسیحی در دورا-اوروپوس</p><img src="https://res.bibleox.com/s/img/image/simple/6931880c205184ec278d6fa6/s_p_DFnp7s0vcTbXb3Qn.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931880c205184ec278d6fa6/m_p_DFnp7s0vcTbXb3Qn.jpg">بزرگ‌تر</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/69318806205184ec278d6fa5/s_p_PuUKcoZEfAVSlPNM.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69318806205184ec278d6fa5/m_p_PuUKcoZEfAVSlPNM.jpg">بزرگ‌تر</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/69318802205184ec278d6fa4/s_p_MF4zgk1ySUOBpqnG.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69318802205184ec278d6fa4/m_p_MF4zgk1ySUOBpqnG.jpg">بزرگ‌تر</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/414/s_p_UgKueSl1yxG0SfbA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/414/m_p_UgKueSl1yxG0SfbA.jpg">بزرگ‌تر</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/69330ed8205184ec278d6fc0/s_p_kXy4nTuYVCOxuDib.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69330ed8205184ec278d6fc0/m_p_kXy4nTuYVCOxuDib.jpg">بزرگ‌تر</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/693187fd205184ec278d6fa3/s_p_R3poESL99kNRMpXi.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/693187fd205184ec278d6fa3/m_p_R3poESL99kNRMpXi.jpg">بزرگ‌تر</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/69330e9e205184ec278d6fbf/s_p_ThLs4WrxsJ3ykxKU.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69330e9e205184ec278d6fbf/m_p_ThLs4WrxsJ3ykxKU.jpg">بزرگ‌تر</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/69330e76205184ec278d6fbe/s_p_NykNwaI9TEwz1Ccf.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69330e76205184ec278d6fbe/m_p_NykNwaI9TEwz1Ccf.jpg">بزرگ‌تر</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/69330e70205184ec278d6fbd/s_p_Rd3jEzEeesXUCTmh.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69330e70205184ec278d6fbd/m_p_Rd3jEzEeesXUCTmh.jpg">بزرگ‌تر</a>]</p><p>کلیسا دیوارنگاره‌هایی با تصویر رویدادهای عهد جدید دارد: نجات پطرس رسول از غرق‌شدن و شفای مفلوج در حوض گوسفندان (از مجموعهٔ معجزات مسیح تنها همین دو دیوارنگاره بر جای مانده است)، و شبان نیکو.</p><p><strong>نجات پطرس رسول از غرق‌شدن</strong></p><img src="https://res.bibleox.com/s/img/image/simple/692c8038205184ec278d6f9e/s_p_QQ2Rml8gUWsyQtS9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c8038205184ec278d6f9e/m_p_QQ2Rml8gUWsyQtS9.jpg">بزرگ‌تر</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6786b88ddba77200015ae11c/m_p_do380IVDukCAfdFk.jpg">نسخه 2</a>]</p><p><strong>شفای مفلوج در حوض گوسفندان</strong></p><img src="https://res.bibleox.com/s/img/image/simple/6786b889dba77200015ae11b/s_p_k1a5GDBvfzTCWmZv.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6786b889dba77200015ae11b/m_p_k1a5GDBvfzTCWmZv.jpg">بزرگ‌تر</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6786bb0bdba77200015ae11d/m_p_dCRD85foL69l7kih.jpg">نسخهٔ دیگر</a>]</p><p><strong>تصویر نزدیک حوض تعمید (اتاق شمارهٔ ۶): شبان نیکو، گوسفند گم‌شده را به گله بازمی‌گرداند</strong></p><img src="https://res.bibleox.com/s/img/image/simple/6931870c205184ec278d6fa2/s_p_uBkNi8jGsMFpOQSM.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931870c205184ec278d6fa2/m_p_uBkNi8jGsMFpOQSM.jpg">بزرگ‌تر</a>]</p><h3>اوسبیوس قیصریه (پامفیلوس)، اسقف، تاریخ‌نگار کلیسا (حدود ۲۵۸–۳۳۹)</h3><p>دربارهٔ ساختن کلیساهای مسیحی در همهٔ شهرها در روزگار پیش از فرمانروایی دیوکلتیانوس، امپراتور روم (سال‌های فرمانروایی: ۲۸۴–۳۰۵)، می‌نویسد. در سال ۲۹۶ دیوکلتیانوس فرمانی دربارهٔ ویران کردن کلیساهای مسیحی صادر می‌کند. اوسبیوس در هنگام صدور این فرمان ۳۸ سال داشت، یعنی باید هم شاهد ساختن این کلیساها و هم شاهد ویرانی آنها بوده باشد:</p><blockquote><p>۵. پروکوراتورها و حاکمان با چه خوش‌خواهی‌ای با پیشوایان کلیساها رفتار می‌کردند! چگونه می‌توان این <strong>گردهمایی‌های هزاران‌نفری در هر شهر</strong> را وصف کرد، این انبوه شگفت‌انگیز مردمان را که <strong>به خانه‌های نیایش سرازیر می‌شدند! ساختمان‌های کهنه کم بود؛ <mark>در همهٔ شهرها کلیساهای بزرگ و تازه از بنیاد برمی‌افراشتند</mark> (εὐρείας εἰς πλάτος ἀνὰ πάσας τὰς πόλεις ἐκ θεμελίων ἀνίστων <mark>ἐκκλησίας</mark>).</strong></p><p>&lt;…&gt;</p><p>۴. سال نوزدهم فرمانروایی دیوکلتیانوس بود که در ماه دیستر (که نزد رومیان مارس است)، در آستانهٔ عید آلام خداوند، در همه‌جا <strong><mark>فرمان امپراتوری آویخته شد که دستور می‌داد کلیساها را تا بنیاد ویران کنند</mark> (βασιλικὰ γράμματα, τὰς μὲν <mark>ἐκκλησίας</mark> εἰς ἔδαφος φέρειν)</strong>، و کتاب مقدس را بسوزانند، و کسانی را که به مسیحیت پایبند بودند از مناصب افتخاری محروم اعلام می‌کرد؛</p></blockquote><p>(<a href="https://bibleox.com/fa/grc/w/%CE%95%CE%9A%CE%9A%CE%9B%CE%97%CE%A3%CE%99%CE%91%CE%A3%CE%A4%CE%99%CE%9A%CE%97%CE%A3_%CE%99%CE%A3%CE%A4%CE%9F%CE%A1%CE%99%CE%91%CE%A3-8/#:~:text=%E1%BC%80%CE%BD%E1%BD%B0%20%CF%80%E1%BD%B1%CF%83%CE%B1%CF%82%20%CF%84%E1%BD%B0%CF%82%20%CF%80%E1%BD%B9%CE%BB%CE%B5%CE%B9%CF%82%20%E1%BC%90%CE%BA%20%CE%B8%CE%B5%CE%BC%CE%B5%CE%BB%E1%BD%B7%CF%89%CE%BD%20%E1%BC%80%CE%BD%E1%BD%B7%CF%83%CF%84%CF%89%CE%BD%20%E1%BC%90%CE%BA%CE%BA%CE%BB%CE%B7%CF%83%E1%BD%B7%CE%B1%CF%82">تاریخ کلیسا، کتاب ۸، ۱٫۵ و ۲٫۴</a>)</p><h2>یافته‌های مورد تردید</h2><h3><strong>خانهٔ هرکولانوم (</strong>سدهٔ یکم<strong>)</strong></h3><img src="https://res.bibleox.com/s/img/image/simple/67e428d39a4a346bba31e8ba/s_p_F0lTpC2rqw7PVyf1.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/67e428d39a4a346bba31e8ba/m_p_F0lTpC2rqw7PVyf1.jpg">بزرگ‌تر</a>] [<a href="https://res.bibleox.com/s/img/image/simple/69330b68205184ec278d6fb8/m_p_oEOCtcPUBThtuirO.jpg">نسخه 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/69330cb6205184ec278d6fb9/m_p_zMmSTHDi5RoizXsX.jpg">نسخه 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/69330cbb205184ec278d6fba/m_p_Jv9gdiBWmrMB5tc4.jpg">نسخه 4</a>] [<a href="https://res.bibleox.com/s/img/image/simple/67e428d79a4a346bba31e8bb/m_p_1sEN1KSZxei96K4S.jpg">نسخه 5</a>] [<a href="https://res.bibleox.com/s/img/image/simple/67e428db9a4a346bba31e8bc/m_p_TgMWk123osBJ9une.jpg">نسخه 6</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/69330cc3205184ec278d6fbc/s_p_YLRMNDvDg7nCTh3X.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69330cc3205184ec278d6fbc/m_p_YLRMNDvDg7nCTh3X.jpg">بزرگ‌تر</a>]</p><p>در سال ۷۹ م. فوران آتشفشان وزوویوس رخ داد و شهرهایی چون پمپئی، استابیا و هرکولانوم را زیر خاکستر آتشفشانی خود دفن کرد. در هرکولانوم <a href="https://ru.wikipedia.org/wiki/%D0%93%D0%B5%D1%80%D0%BA%D1%83%D0%BB%D0%B0%D0%BD%D1%83%D0%BC#%D0%94%D0%BE%D0%BC_%D0%B4%D0%B2%D1%83%D1%85%D1%81%D0%BE%D1%82%D0%BB%D0%B5%D1%82%D0%B8%D1%8F">خانه‌ای</a> یافته شد (به مناسبت سالگرد کاوش‌ها آن را «خانهٔ دویست‌سالگی» نامیده‌اند) که در طبقهٔ دوم آن، بر دیوار یکی از اتاق‌ها، <a href="https://ermakvagus.com/Europe/Italy/Pompeii/christianity_pompeii_rus.html">فرورفتگی صلیب‌شکل</a> درست در مرکز و بالای یک قفسهٔ چوبی ایجاد شده بود. برخی گمان می‌کنند که در آنجا صلیبی چوبی برای نیایش قرار داشت و این مکان برای برگزاری مراسم نیایش مسیحی یا دعای خانگی به کار می‌رفت. اما دلایل جدی‌ای علیه این گمان وجود دارد. در همان شهر قفسهٔ کوچکی یافته شده است که به گمان، می‌توانست اثری همانند بر دیوار بر جای گذارد.</p><img src="https://res.bibleox.com/s/img/image/simple/6932ff2b205184ec278d6fb6/s_p_cXmpauqq2EYuH6ww.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6932ff2b205184ec278d6fb6/m_p_cXmpauqq2EYuH6ww.jpg">بزرگ‌تر</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6932ff36205184ec278d6fb7/s_p_KIfO7M0rbhGbWoIk.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6932ff36205184ec278d6fb7/m_p_KIfO7M0rbhGbWoIk.jpg">بزرگ‌تر</a>] [<a href="https://res.bibleox.com/s/img/image/simple/69330cbf205184ec278d6fbb/m_p_WL1FQysNlwZc0yT9.jpg">نسخه 2</a>]</p><p>آن قفسه کاملاً همانند نیست: برجستگی‌ای نسبتاً بزرگ به چپ و راست و برجستگی کوچک‌تری به پایین دارد. علاوه بر این، به گمان، در خانهٔ دویست‌سالگی در این نقطه از دیوار دو لنگهٔ بسته‌شدنی وجود داشت. با این حال، احتمال زیاد است که در خانهٔ دویست‌سالگی به‌راستی قفسه‌ای معمولی بوده باشد، نه صلیب. خواننده خود باید میزان اعتماد به این یا آن نتیجه‌گیری را بسنجد. در اینجا تنها اطلاعات شناخته‌شده دربارهٔ این یافته گردآوری شده است.</p>
