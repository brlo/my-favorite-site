    title: "تصاویر کهن گوناگون خارج از مجموعهٔ اصلی"
    body: |-
      <h2>دخمه‌های سنت یانوار (Catacombe di San Gennaro) [1]</h2><h3>قدیس یانوار بنه‌ونتویی، پوتئولی (ناپل)، اسقف، شهیدِ کاهن</h3><p>دخمه‌های سن‌جنارو (سنت یانوار)، ناپل. دیوارنگارهٔ سدهٔ ۴. کاملاً روشن نیست که چه کسی در اینجا تصویر شده است. در بالا نوشته شده است: SANCTOMARTYRIIANVARIO (شهید مقدس یانوار). با این حال، به دلایلی در اینجا جوانی تصویر شده است. همچنین روشن نیست که چرا هاله به این شکل است.</p><p>صفحه‌ای با اطلاعات دربارهٔ این قدیس در کلیسای ارتدکس: <a href="https://days.pravoslavie.ru/name/890.html">https://days.pravoslavie.ru/name/890.html</a></p><p>صفحهٔ ویکی‌پدیا دربارهٔ این دیوارنگاره. به زبان لهستانی است، اما اطلاعات سودمندی دارد: <a href="https://pl.wikipedia.org/wiki/January_z_Benewentu">https://pl.wikipedia.org/wiki/January_z_Benewentu</a></p><img src="https://res.bibleox.com/s/img/image/simple/686e6aa95f47da2505d3ae6e/s_p_RCtXSS4uiuO9E0Qf.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686e6aa95f47da2505d3ae6e/m_p_RCtXSS4uiuO9E0Qf.jpg">بزرگ‌تر</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686e56775f47da2505d3ae67/m_p_XhI4Ni1rKZ949Zi1.jpg">نسخه 2</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686e54755f47da2505d3ae66/s_p_zKsSelu839AuImaV.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686e54755f47da2505d3ae66/m_p_zKsSelu839AuImaV.jpg">بزرگ‌تر</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686e57135f47da2505d3ae68/m_p_faNUwXKGPaVtmUwW.jpg">نسخه 2</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686e6aec5f47da2505d3ae70/s_p_2fvyFxXewVLu06NV.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686e6aec5f47da2505d3ae70/m_p_2fvyFxXewVLu06NV.jpg">بزرگ‌تر</a>]</p><h3>تسرولا، زن مسیحی</h3><p>کتیبهٔ زیرین: «CERVLA IN PACE» (تسرولا در آرامش)، سده‌های ۵-۶ [3]</p><img src="https://res.bibleox.com/s/img/image/simple/686e4d5c5f47da2505d3ae63/s_p_1dqPUS5wghY1DrdP.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686e4d5c5f47da2505d3ae63/m_p_1dqPUS5wghY1DrdP.jpg">بزرگ‌تر</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686e58705f47da2505d3ae6a/m_p_r6sua9UNLBhgIZ06.jpg">نسخه 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686e58625f47da2505d3ae69/m_p_6KViYk7KWJDrIa8l.jpg">نسخه 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686e6ad15f47da2505d3ae6f/m_p_q9ocVtWoayH4BxtB.jpg">نسخه 4</a>]</p><h3>خانوادهٔ تئوتکنوس</h3><blockquote><p>آرکوسولیوم خانوادهٔ تئوتکنوس. پژوهش‌ها نشان داده است که نخست دخترک درگذشت. در طاقچه دیوارنگاره‌ای با تصویر او کشیده شد. سپس مرد درگذشت. بر روی نخستین دیوارنگاره، نقاشی تازه‌ای ترسیم شد که این بار پدر را نیز دربر داشت. آخر از همه زن درگذشت و در طاقچه تصویر گروهی آنان پدیدار شد.</p></blockquote><img src="https://res.bibleox.com/s/img/image/simple/686e6be45f47da2505d3ae71/s_p_xNoWgh6wacZ3al1R.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686e6be45f47da2505d3ae71/m_p_xNoWgh6wacZ3al1R.jpg">بزرگ‌تر</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686e592c5f47da2505d3ae6b/s_p_A6SYWxzdgc1EPwun.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686e592c5f47da2505d3ae6b/m_p_A6SYWxzdgc1EPwun.jpg">بزرگ‌تر</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686fe8695f47da2505d3ae88/m_p_nzuUOKu6sAmxO4pO.jpg">نسخه 2</a>]</p><h2>Via Anapo catacombs[2]</h2><h3>زن در حال نیایش (اورانتا)</h3><p>دیوارنگارهٔ زنی در حال نیایش. Fresco of a praying woman, an orante or orans, in the Anonima di Via Anapo catacomb (anonymous catacomb of Via Anapo), Rome</p><img src="https://res.bibleox.com/s/img/image/simple/686e53655f47da2505d3ae65/s_p_qTxn07MuPIePNzPn.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686e53655f47da2505d3ae65/m_p_qTxn07MuPIePNzPn.jpg">بزرگ‌تر</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686e535e5f47da2505d3ae64/m_p_U8Zh4RJjehyZtXep.jpg">نسخه 2</a>]</p>
