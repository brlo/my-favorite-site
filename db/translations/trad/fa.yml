    title: "آرامگاه‌ها و کتیبه‌های مسیحی"
    body: |-
      <h2>کتیبه‌های کنار آرامگاه‌های مسیحیان سده‌های نخست</h2><p>کتیبه‌های تریکلیومِ «یادمان رسولان» (به‌اصطلاح) در جادهٔ آپیا — پرستشگاهی که در نیمهٔ سدهٔ سوم، میان سال‌های ۲۳۸ و ۲۶۰، برپا شد. در همان هنگام نیز، در سدهٔ سوم، در تریکلیوم کتیبه‌های نیایشی مسیحی به سبک «<em>Paule ed Petre petite pro Victore</em>» و مانند آن (که در زیر آورده شده‌اند) پدید آمد. نوشتن آن‌ها تا روزگار کنستانتین بزرگ ادامه یافت. [1]</p><img src="https://res.bibleox.com/s/img/image/simple/483/s_p_1D8zprHe86ZZn5O9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/483/m_p_1D8zprHe86ZZn5O9.jpg">بزرگ‌تر</a>]</p><h3><strong>در یاد داشته باشید، در دعاهایتان </strong>(in mente habete, in orationibus vestris):</h3><p>12912: [Petre et] Paul[e] | in m[ente] abete in | ora[tion]ibus vestris/ — «<strong>ای پطرس و پولس، در یاد داشته باشید، در دعاهایتان...»</strong></p><h3><strong>شفاعت کنید </strong>(petite) (یا «دعا کنید»، «بخواهید»)</h3><p>12918: [Paul]e et Petre petite | [pro] nobis omnibus/ — <strong>«ای پولس و پطرس، برای همهٔ ما شفاعت کنید!»</strong></p><p>12931: Petr[e] et Pau[l]e petite | pro [Le]ontium / — <strong>«ای پطرس و پولس، برای لئونتیوس شفاعت کنید!»</strong></p><p>12933: Pa[ul]e et Pet|re apetite pro Da|tivu in perpetu`u´m/ — <strong>«ای پولس و پطرس، برای داتیوا تا ابد شفاعت کنید!»</strong></p><p>12989: Paule ed Petre petite | pro Victore/ — <strong>«ای پولس و پطرس، برای ویکتور شفاعت کنید!»</strong></p><p>12946: [Petre et Pa]ulae spir[ita sancta vestra petant pro - - -]/ — <strong>«ای پطرس و پولس، بگذارید ارواح مقدس شما برای [- - -] شفاعت کنند!»</strong></p><h3><strong>conservate</strong> — <strong>محافظت کنید</strong> (یا «نگه دارید»)</h3><p>12991: Petre et Paule cons[ervate - - -]/ — <strong>«ای پطرس و پولس، محافظت کنید [- - -]!»</strong></p><p>12996: sa[lva Paule et] | Petr[e - - - et] | Mart[yrium et] | conse[rvate in] | do[mino - - -]/ — <strong>«نجات ده، ای پولس و پطرس، [- - -] و مارتیریوس را، و در خداوند محافظت کن [- - -]!»</strong></p><p>13026: [- - - roga]mus | [conse]rvate nos [omnes]/ — <strong>«[- - -] از تو می‌خواهیم، همهٔ ما را محافظت کنید!»</strong></p><h3><strong>استغاثه‌های ساده</strong></h3><p>12909: Petr[e et Paule]/ — <strong>«ای پطرس و پولس!»</strong></p><h3><strong>یاری به گناهکاران</strong></h3><p>12967: Petre et Paule sub|venite Prim[o] | peccatori/ — <strong>«ای پطرس و پولس، به یاری پریموسِ گناهکار بیایید!»</strong></p><h3><strong>بسیاری از استغاثه‌ها به یونانی یا به لاتین با حروف یونانی نوشته شده‌اند</strong></h3><p>12927: Παῦλε {μ} καί | μου πατ|ρός/ — <strong>«ای پولس، و پدرم را (یاری کن)!»</strong></p><p>12997: [Παυλ]ε ετ Πετ[ρε ιν μεν]/[τε ν]ος αβετε [ιν ορα]/[τι]ωνες βεστ[ρας]/ — <strong>«ای پولس و پطرس، در یاد داشته باشید، در دعاهایتان...»</strong></p><p>13045: [Πα]υ[λε ετ Πετρε] | [ι]ν με[ντε αβετε] | Αὐφίδ[ιον υἱόν - - -] | μου/ — <strong>«ای پولس و پطرس، آوفیدیوس، پسر مرا در یاد داشته باشید!»</strong></p><p>13069: Πέτρε Παίτρε μνημόνευαι | Τιμοκράτην καὶ Εὐ|τυχείαν κινα(?) καὶ | ἐσώρα(?) ++ [- - -]/ — <strong>«ای پطرس، ای پطرس، تیموکراتس و اِفتیخیا را یاد کن، و (...) ++ [- - -]!»</strong></p><p>13045: [κομμ]ανδαμ[ους? - - -]/<strong> </strong>— <strong>«[- - -] را می‌سپاریم».</strong></p><p>13049: Παῦλε καὶ Π[έτρε ἔχετε] / μνί[α]ς/ — <strong>«ای پولس و پطرس، یاد [- - -] را نگاه دارید!»</strong></p><p>13055: [Παῦλε καὶ Πέτ]ρε εἰς μνε[ίαν] / [ἔχετε τὸν ᾿Ιρ]ίνες φίλι[ον]/ — <strong>«ای پولس و پطرس، محبوب ایرینا را یاد کنید».</strong></p><p>13070: Παυλε Πετρε | Χαλκηδονι ανιμα | βωβυς κομαν|[δ]ω Λαυrους/ — <strong>«ای پولس و پطرس، من، لاوروس (لاوروسیوس؟)، روح خالکیدونیوس را به شما می‌سپارم!»</strong></p><p>13071: &lt;Π&gt;α[ῦλ]ος καὶ | Π[έτρο]ς συν|τηρή[σα]τε θ(εο)ῦ δούλους | πνεύματα | ἅγεια συντη|ρήσαται ἡμᾶ|ς ἴνα πολλοῖς | ἔτεσε[ι ζῶμεν]/ — <strong>«ای پولس و پطرس، بندگان خدا را پشتیبانی کنید! ای ارواح مقدس، ما را پشتیبانی کنید تا سال‌های بسیار زندگی کنیم!»</strong></p><p>13073: [Παυλε] ετ Πετρε | [ιν με]ντε [ν]ος αβε|[τοτε εἰς το]ὺς ἐῶ[νας]/<strong> </strong>— <strong>«ای پولس و پطرس، تا ابد در یاد داشته باشید...»</strong></p><h3><strong>promisit / votum fecit</strong> — <strong>نذر کرد</strong></h3><p>13091: [- - - i]dus m[- - -] | Eulogius votum f[ecit]/ — <strong>«[- - -] در روز [- - -] ایدوس [- - -] اِولوگیوس نذر کرد [- - -]».</strong></p><h3><strong>یادکردها از refrigerium</strong> (طعام یادبود):</h3><p>12942: refrigerav[it] | [F]elicissimus cum s[uis]/ — <strong>«فلیکیسیموس با خانوادهٔ خود طعام یادبود برپا کرد.»</strong></p><p>12981: Petro et Paulo | Tomius Coelius | refri`ger´&lt;i&gt;um feci/ — <strong>«برای پطرس و پولس، من، تومیوس کائلیوس، طعام یادبود برپا کردم»</strong></p><p>13003: [---] at Paulu[m] | et Pet[rum] | refri[geravi - - -]/ — <strong>«نزد پولس و پطرس طعام یادبود برپا کردم»</strong></p><p>منبع: <a href="http://csla.history.ox.ac.uk/record.php?recid=E05087">http://csla.history.ox.ac.uk/record.php?recid=E05087</a></p><hr><h3>خطاب‌ها به خدا</h3><ul><li><p>DEVS TE PRECOR VТ PARADISVM LVCIS POSSIT VIDERE – «<strong>ای خداوند، از تو می‌خواهم که او نور بهشت را ببیند</strong>».</p></li><li><p>DOMINE NE QVANDO ADVMBRETVR SPIRITVS VENERES – «<strong>ای خداوند، مبادا هرگز روح ونوس تاریک شود</strong>».</p></li></ul><h3>درخواست درگذشتگان برای شفاعت</h3><ul><li><p>ET IN ORATIONIS TVIS ROGES PRO NOBIS QVIA SCIMVS TE ☧ – «<strong>در دعاهایت برای ما دعا کن، زیرا می‌دانیم که تو در مسیح هستی</strong>».</p></li><li><p>ORO SCIO NAMQVE BEATAM – «<strong>از تو می‌خواهم، زیرا می‌دانم که تو در سعادت به سر می‌بری</strong>».</p></li><li><p>ORA PRO PARENTI BVS TVIS – «<strong>برای خویشان خود دعا کن</strong>».</p></li><li><p>PETE PRO NOS VТ SALVI SIMVS – «<strong>برای ما دعا کن تا نجات یابیم</strong>».</p></li><li><p>IN ORATIONIS TVIS ROGES PRO NOBIS – «<strong>در دعاهایت، برای ما درخواست کن</strong>».</p></li><li><p>ATTICE SPIRITVS TVS IN BONV ORA PRO PARENTIBVS TVIS – «<strong>آتیکوس، روح تو در سعادت است، برای خویشان خود دعا کن</strong>».</p></li></ul><p>بخشی از مطالب آورده شده است. با استفاده از پیوند می‌توانید با بقیهٔ مطالب آشنا شوید.</p><h3><strong>کتیبه‌ها و تصاویر نمادین</strong></h3><ul><li><p>واژهٔ VIVAS یعنی «<strong>زندگی کن</strong>» که بسیار بر گورها نوشته می‌شود و بیانگر آرزوی زندگی جاوید و سعادت برای درگذشته است؛</p></li><li><p>VIVAS IN DEO – «<strong>در خدا زندگی کن</strong>»؛</p></li><li><p>VIBAS IN SANCTIS – «<strong>میان مقدسان زندگی کن</strong>».</p></li></ul><h3>درگذشته به نجات رسیده است</h3><p>گاهی به شیوه‌ای قاطع‌تر گفته می‌شود که آرمیده در میان برگزیدگان است:</p><ul><li><p>ACCEPIT REQVI EM IN DEO – «<strong>او آرامش را در خدا یافت</strong>»؛</p></li><li><p>SCIMVS ТЕ IN – «<strong>می‌دانیم که تو در مسیح هستی</strong>»؛</p></li><li><p>FRVCTVOSVS ANIMA ТVА СVМ IVSTIS – «<strong>فروکتوزوس، روح تو با صالحان است</strong>»؛</p></li><li><p>REQVI EM ADCEPIT IN DEO PATRE NOSTRO ET CHRISTO EIVS – «<strong>او آرامش را در خدای پدر ما و در مسیحِ او یافت</strong>»؛</p></li><li><p>ACCEPTA APVD DEVM – «<strong>پذیرفته‌شده نزد خدا</strong>»؛</p></li><li><p>RECEPTVS AD DEVM – «<strong>از سوی خدا پذیرفته شد</strong>»؛</p></li><li><p>ТЕСVМ PAX CHRISTI – «<strong>صلح مسیح با تو</strong>»؛</p></li><li><p>SEMPER VIVE IN РАСЕ – «<strong>همیشه در صلح زندگی کن</strong>»؛</p></li><li><p>IN РАСЕ ET IN DOMO AETERNA DEI – «<strong>در صلح و در خانهٔ جاویدان خدا</strong>».</p></li><li><p>VIVI IN GLORIA DEI ET IN PACE DOMINI NOSTRI ☧ – «<strong>تو در جلال خدا و در صلح خداوند ما مسیح زندگی می‌کنی</strong>» – اینجا نام منجی با مونوگرام او ☧ نشان داده شده است؛</p></li><li><p>ELATVS EST نیز گونه‌ای فریاد شادمانه است که تنها یک یا دو بار دیده می‌شود و می‌توان آن را چنین ترجمه کرد: «<strong>او به سوی خدا برخاست</strong>».</p></li></ul><h3>بهشت — جایگاه نور</h3><p>بهشت را در کتیبه‌های گورستانی نخستین مسیحیان جایگاه نور و درخشش می‌نامند؛ چند نمونه:</p><ul><li><p>CVIVS SPIRITVS IN LVCE DOMINI SVSCEPTVS EST – «<strong>روح او در نور خدا پذیرفته شد</strong>».</p></li><li><p>IN CHRISTVM CREDENS PREMIA LVCIS АВЕТ – «<strong>او که به مسیح ایمان دارد، نور را پاداش دارد</strong>».</p></li><li><p>AETERNA TIBI LUX TIMOTHEA IN ☧– «<strong>نور جاودان بر تو، تیموتئوس، در (مسیح)</strong>».</p></li></ul><h3></h3><p>کتاب: <strong>آ. فون فریکن. دخمه‌های رومی و یادگارهای هنر مسیحی نخستین. مسکو: انتشارات ک.ت. سالداتنکوف، ۱۸۷۲–۱۸۷۷–۱۸۸۰–۱۸۸۵. </strong>[2]</p>
