نتا تکلا (قدیس تکلا)، دیوارنگاره [24]</p><p>رسولان تصویر شده‌اند: پطرس، پولس، اندریاس، یوحنا.</p><img src="https://res.bibleox.com/s/img/image/simple/686bf38e5f47da2505d3ae35/s_p_BxfiObhkLMfci8nP.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686bf38e5f47da2505d3ae35/m_p_BxfiObhkLMfci8nP.jpg">بزرگ‌تر</a>] [<a href="https://res.bibleox.com/s/img/image/simple/687291145f47da2505d3ae8b/m_p_WXlkaMJTOrIzlOdI.jpg">نسخه 2</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/68b6cd4802e89ba22dfc3977/s_p_kAWGH2VPHMkRv9cL.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b6cd4802e89ba22dfc3977/m_p_kAWGH2VPHMkRv9cL.jpg">بزرگ‌تر</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686bf5bf5f47da2505d3ae37/m_p_F0tsoqA9bv6CrpfE.jpg">نسخه 2</a>]</p><h3>رسولان پطرس و پولس (بیزانس)</h3><p>میانهٔ سدهٔ ۴. مسیح تاج‌های شهیدان را به رسولان پطرس و پولس می‌بخشد. <a href="https://www.metmuseum.org/art/collection/search/463547">موزهٔ متروپولیتن در خیابان پنجم، آمریکا</a>. رم یا بیزانس. ۱۳.۸ × ۱۲.۵ × ۵ سانتی‌متر.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5f5d745c75323d28a5ebc/s_p_MiCffui3hayo2BCt.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5f5d745c75323d28a5ebc/m_p_MiCffui3hayo2BCt.jpg">بزرگ‌تر</a>]</p><hr><p>میانهٔ سدهٔ ۴. <a href="https://www.metmuseum.org/art/collection/search/468386">موزهٔ متروپولیتن در خیابان پنجم، آمریکا</a>. رم یا بیزانس. ۸.۵ × ۱۴ × ۱۳.۳ سانتی‌متر.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5e89c45c75323d28a5ea1/s_p_HAfNPGdEHMp67CuN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5e89c45c75323d28a5ea1/m_p_HAfNPGdEHMp67CuN.jpg">بزرگ‌تر</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5e88f45c75323d28a5ea0/m_p_gvro4Ry9POJUm0nR.jpg">نمای از پهلو</a>]</p><hr><p>پایان سدهٔ ۴. <a href="https://www.metmuseum.org/art/collection/search/463714">موزهٔ متروپولیتن در خیابان پنجم، آمریکا</a>. شیشه، ورق طلا.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5e68b45c75323d28a5e9c/s_p_uRLyImBPPDsr48G2.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5e68b45c75323d28a5e9c/m_p_uRLyImBPPDsr48G2.jpg">بزرگ‌تر</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5e76d45c75323d28a5e9e/m_p_62cHpid14wgeSyqc.jpg">نسخه 2</a>]</p><hr><p>میانهٔ سدهٔ ۴. رسولان پطرس و پولس، پرگرینا. <a href="https://www.metmuseum.org/art/collection/search/465922">موزهٔ متروپولیتن در خیابان پنجم، آمریکا</a>. ۱۱.۵ × ۱۳.۳ × ۱.۲ سانتی‌متر.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5e7d145c75323d28a5e9f/s_p_atDwcEc3h2ZyYLRb.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5e7d145c75323d28a5e9f/m_p_atDwcEc3h2ZyYLRb.jpg">بزرگ‌تر</a>]</p><h3>رسولان پطرس و پولس (رم)</h3><p>سدهٔ ۴. سنگ‌لوحی که برای بستن طاقچهٔ تدفین کودک (loculus) در دخمه‌ها به کار می‌رفت. رم، موزه‌های واتیکان، موزهٔ مسیحی پیوس.</p><img src="https://res.bibleox.com/s/img/image/simple/674f1bc0dba77200011c739a/s_p_uH3btIsNTUn6lHGQ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f1bc0dba77200011c739a/m_p_uH3btIsNTUn6lHGQ.jpg">بزرگ‌تر</a>]</p><h3>مادر خدا با کودک مسیح (رم)</h3><p>سده‌های ۳-۴. دخمه‌های دومیتیلا.</p><img src="https://res.bibleox.com/s/img/image/simple/66cc2c11dba77200019bc7d5/s_p_rZQc8oqW4YIrUMho.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/66cc2c11dba77200019bc7d5/m_p_rZQc8oqW4YIrUMho.jpg">بزرگ‌تر</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686d246b5f47da2505d3ae57/m_p_AZTFv8hTAm4Eo9yp.jpg">نسخه 2</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686d24885f47da2505d3ae58/s_p_Z1QqJZuraUn8iLSV.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d24885f47da2505d3ae58/m_p_Z1QqJZuraUn8iLSV.jpg">بزرگ‌تر</a>]</p><h3>صلیب با تصویر مسیح (بیزانس)</h3><p>سال‌های ۳۹۵-۶۴۱. <a href="https://collections.louvre.fr/en/ark:/53355/cl010043937">لوور، فرانسه</a>. ۸.۵ × ۲۰ × ۱.۲ سانتی‌متر.</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c5886594f46d35a87ec7/s_p_wU3HuTavyFqHCHIc.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c5886594f46d35a87ec7/m_p_wU3HuTavyFqHCHIc.jpg">بزرگ‌تر</a>]</p><h3>آیکون (مصر)</h3><p>سال‌های ۳۹۵-۶۴۱. <a href="https://collections.louvre.fr/en/ark:/53355/cl010049211">لوور، فرانسه</a>. ۲۴ × ۱۷.۵ سانتی‌متر</p><img src="https://res.bibleox.com/s/img/image/simple/68c3bf006594f46d35a87ebf/s_p_m1O6PHgeoR9L2huf.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3bf006594f46d35a87ebf/m_p_m1O6PHgeoR9L2huf.jpg">بزرگ‌تر</a>]</p><hr><p><a href="https://collections.louvre.fr/en/ark:/53355/cl010049209">لوور، فرانسه</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c8966594f46d35a87ec8/s_p_hfH86ZqQDaRWHKRA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c8966594f46d35a87ec8/m_p_hfH86ZqQDaRWHKRA.jpg">بزرگ‌تر</a>]</p><h3>آمپول با آیکون قدیس مینا (بیزانس)</h3><p>سال‌های ۳۹۵-۶۴۱. <a href="https://collections.louvre.fr/en/ark:/53355/cl010042774">لوور، فرانسه</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c4176594f46d35a87ec3/s_p_RYRsljTrixb3giuP.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c4176594f46d35a87ec3/m_p_RYRsljTrixb3giuP.jpg">بزرگ‌تر</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c3c4196594f46d35a87ec4/m_p_20KqaRLqoxUISfqB.jpg">روی دیگر</a>]</p><hr><p>سال‌های ۳۹۵-۶۴۱. <a href="https://collections.louvre.fr/en/ark:/53355/cl010042778">لوور، فرانسه</a>. آمپول‌های همانند به شمار بسیار زیاد در موزه‌های گوناگون دیده می‌شوند. نمونه‌های دیگر: <a href="https://collections.louvre.fr/en/ark:/53355/cl010042780">۱</a>، <a href="https://collections.louvre.fr/en/ark:/53355/cl010042798">۲</a>، <a href="https://collections.louvre.fr/en/ark:/53355/cl010042802">۳</a>، <a href="https://collections.louvre.fr/en/ark:/53355/cl010043779">۴</a>، <a href="https://collections.louvre.fr/en/ark:/53355/cl010076645">۵</a>، <a href="https://collections.louvre.fr/en/ark:/53355/cl010051239">۶</a>، <a href="https://collections.louvre.fr/en/ark:/53355/cl010263188">۷</a>، <a href="https://collections.louvre.fr/en/ark:/53355/cl010280896">۸</a>، <a href="https://collections.louvre.fr/en/ark:/53355/cl010044285">۹</a>، <a href="https://collections.louvre.fr/en/ark:/53355/cl010280846">۱۰</a>، <a href="https://collections.louvre.fr/en/ark:/53355/cl010280894">۱۱</a>، <a href="https://www.clevelandart.org/art/1999.232">۱۲</a>، <a href="https://www.clevelandart.org/art/1999.233">۱۳</a>، <a href="https://www.clevelandart.org/art/1999.231">۱۴</a>، <a href="https://www.clevelandart.org/art/1999.230">۱۵</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c4c66594f46d35a87ec5/s_p_b5etRE60QJjNF7zQ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c4c66594f46d35a87ec5/m_p_b5etRE60QJjNF7zQ.jpg">بزرگ‌تر</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c4cd6594f46d35a87ec6/s_p_vJbng6ICUUefTimC.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c4cd6594f46d35a87ec6/m_p_vJbng6ICUUefTimC.jpg">بزرگ‌تر</a>]</p><h3>آمپول سربی با تصویر مادر خدا و مسیح (ایتالیا، بولونیا)</h3><p>سده‌های ۴-۵. «آمپول‌های همانند با روغن مقدس از مکان‌های مقدس به شمار زیاد به دست زائران از شرق، و به‌ویژه از فلسطین، آورده می‌شد؛ همان‌جا که از پایان سدهٔ ۴ و در نیمهٔ نخست سدهٔ پنجم زیارت‌ها به شمار بسیار صورت می‌گرفت» [27]</p><img src="https://res.bibleox.com/s/img/image/simple/686d3bdc5f47da2505d3ae5f/s_p_gcwh26YTfBvz5FbR.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d3bdc5f47da2505d3ae5f/m_p_gcwh26YTfBvz5FbR.jpg">بزرگ‌تر</a>]</p><h2>سدهٔ ۵</h2><h3>مادر خدا با کودک عیسی، شهیدان فلیکس و آداوکتوس، بیوهٔ کومودیلّا (رم)</h3><p>سده‌های ۵-۶. دخمه‌های کومودیلّا. در سمت چپ در پیش‌زمینه بیوهٔ کومودیلّا تصویر شده است — زنی ثروتمند از رم که کلیسای دخمه‌ای به یاد او ساخته شد.</p><img src="https://res.bibleox.com/s/img/image/simple/674edb84dba77200011c738c/s_p_urBcFMzNnn49NanW.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674edb84dba77200011c738c/m_p_urBcFMzNnn49NanW.jpg">بزرگ‌تر</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686bf61f5f47da2505d3ae38/m_p_gOZdkzGPGcL4Vws0.jpg">نسخه 2</a>]</p><h3>مسیح و مادر خدا (بیزانس)</h3><p>سال‌های ۴۰۰-۵۰۰. ماده: طلا. ۳.۷ × ۴ × ۰.۳ سانتی‌متر؛ وزن: ۴.۰۴ گرم. <a href="https://collections.louvre.fr/en/ark:/53355/cl010256498">لوور، فرانسه</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c403846594f46d35a87efb/s_p_Ahj64DxPe313azhi.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c403846594f46d35a87efb/m_p_Ahj64DxPe313azhi.jpg">بزرگ‌تر</a>]</p><h3>شهید لورنتیوس (راونا)</h3><p>سال ۴۲۵. آرامگاه گالا پلاسیدیا[1][2][25]. در گنجهٔ باز چهار انجیل قرار دارد: مرقس، متی، لوقا و یوحنا. قدیس با صلیب و انجیل گشوده به سوی شبکه‌ای می‌رود که زیر آن آتش می‌سوزد.</p><img src="https://res.bibleox.com/s/img/image/simple/674ee461dba77200011c738e/s_p_EPEyZAtXMtLhz0vO.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674ee461dba77200011c738e/m_p_EPEyZAtXMtLhz0vO.jpg">بزرگ‌تر</a>]</p><h3>رسول پولس (افسس)</h3><p>دیوارنگارهٔ پایان سدهٔ ۵ در غار پولس[4].</p><img src="https://res.bibleox.com/s/img/image/simple/674f2a67dba77200011c73a0/s_p_Og6LudyAS5axVwrH.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f2a67dba77200011c73a0/m_p_Og6LudyAS5axVwrH.jpg">بزرگ‌تر</a>]</p><h3>رسول پولس (ناپل)</h3><p>پایان سدهٔ ۵. دخمه‌های سان جنارو، دیوارنگاره. به احتمال زیاد رسول پولس تصویر شده است.</p><img src="https://res.bibleox.com/s/img/image/simple/674f2705dba77200011c739d/s_p_XdEMnSngRpC4ver8.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f2705dba77200011c739d/m_p_XdEMnSngRpC4ver8.jpg">بزرگ‌تر</a>]</p><h3>تکلای ایکونیومی، شهیده (افسس)</h3><p>غار قدیسان پولس و تکلا. او یکی از کسانی است که از موعظهٔ رسول پولس ایمان آورد؛ شهیدهٔ سده‌های نخست. در سال ۲۰۱۳ غار به دست شبه‌نظامیان اسلام‌گرا هتک حرمت شد[4].</p><img src="https://res.bibleox.com/s/img/image/simple/674f2c2edba77200011c73a1/s_p_tCvOXPpRP5ogjE1Y.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f2c2edba77200011c73a1/m_p_tCvOXPpRP5ogjE1Y.jpg">بزرگ‌تر</a>]</p><h3>شهید بزرگ دیمیتریوس سالونیکی و فرشته (سالونیک، بیزانس)</h3><p>سده‌های ۵-۶. کلیسای قدیس دیمیتریوس در سالونیک. موزائیک در بخش غربی کلیسا [10]</p><img src="https://res.bibleox.com/s/img/image/simple/686984705f47da2505d3ae11/s_p_bliIzjPrQcGjWmMT.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686984705f47da2505d3ae11/m_p_bliIzjPrQcGjWmMT.jpg">بزرگ‌تر</a>]</p><h3>شهید بزرگ دیمیتریوس سالونیکی و کودک (سالونیک، بیزانس)</h3><p>سده‌های ۵-۶. کلیسای قدیس دیمیتریوس در سالونیک. موزائیک بر دیوار غربی شبستان جنوبی [10]</p><img src="https://res.bibleox.com/s/img/image/simple/68697c845f47da2505d3ae10/s_p_T8JYB6OgB0WUM8O6.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68697c845f47da2505d3ae10/m_p_T8JYB6OgB0WUM8O6.jpg">بزرگ‌تر</a>]</p><h3>خانهٔ سناتور، سانتا پودنتسیانا (رم)</h3><p>سال‌های ۴۰۲-۴۱۷ [13][14]</p><img src="https://res.bibleox.com/s/img/image/simple/6869938e5f47da2505d3ae1c/s_p_l5Dokt3jzLvx6IxN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6869938e5f47da2505d3ae1c/m_p_l5Dokt3jzLvx6IxN.jpg">بزرگ‌تر</a>]</p><h3>سانتا ماریا ماجوره (رم)</h3><p>سال‌های ۴۳۲-۴۴۰ [15][16]</p><img src="https://res.bibleox.com/s/img/image/simple/6869954e5f47da2505d3ae1d/s_p_0bDTRtbRpWWnfPQR.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6869954e5f47da2505d3ae1d/m_p_0bDTRtbRpWWnfPQR.jpg">بزرگ‌تر</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686995555f47da2505d3ae1e/s_p_FLcJtADykEgKNDDd.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686995555f47da2505d3ae1e/m_p_FLcJtADykEgKNDDd.jpg">بزرگ‌تر</a>]</p><h3>مسیح، سه جوان، مغان (شمال ایتالیا)</h3><p>سال‌های ۴۰۰-۴۵۰. <a href="https://collections.louvre.fr/en/ark:/53355/cl010256191">لوور، فرانسه</a>. نقره، ۶.۳ × ۱۲.۳ × ۷.۱ سانتی‌متر.</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c1756594f46d35a87ec1/s_p_WzOTF3me39ISTfnN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c1756594f46d35a87ec1/m_p_WzOTF3me39ISTfnN.jpg">بزرگ‌تر</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c1796594f46d35a87ec2/s_p_a0udZW5EPewQCqsl.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c1796594f46d35a87ec2/m_p_a0udZW5EPewQCqsl.jpg">بزرگ‌تر</a>]</p><h3>آیکون، رسول پطرس انجیل را بر قدیس مرقس املا می‌کند (مصر)</h3><p>سال‌های ۴۴۰-۶۷۰. <a href="https://www.metmuseum.org/art/collection/search/477163">موزهٔ متروپولیتن در خیابان پنجم، آمریکا</a>. ۱۳.۵ × ۱۰ × ۰.۸ سانتی‌متر. همچنین ببینید: <a href="https://www.metmuseum.org/art/collection/search/477492">۱</a>، <a href="https://www.metmuseum.org/art/collection/search/477487">۲</a>، <a href="https://www.metmuseum.org/art/collection/search/477481">۳</a>، <a href="https://www.metmuseum.org/art/collection/search/477489">۴</a>، <a href="https://www.metmuseum.org/art/collection/search/477491">۵</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c1c2f56594f46d35a87e74/s_p_BWhcee0cn10mz7dc.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1c2f56594f46d35a87e74/m_p_BWhcee0cn10mz7dc.jpg">بزرگ‌تر</a>]</p><h3>قدیس ناشناس (بیزانس، مصر)</h3><p>سده‌های ۵-۶. <a href="https://www.metmuseum.org/art/collection/search/329982">موزهٔ متروپولیتن در خیابان پنجم، آمریکا</a>. ۴۴ × ۳۲.۵ سانتی‌متر.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5eb2d45c75323d28a5ea3/s_p_E5UUO66hSfRBtXUn.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5eb2d45c75323d28a5ea3/m_p_E5UUO66hSfRBtXUn.jpg">بزرگ‌تر</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5eb2845c75323d28a5ea2/m_p_ofbMCUTa1winWDg0.jpg">نسخه 2</a>]</p><h3>آمپول با تصویر قدیس مینا (مصر قبطی)</h3><p>سده‌های ۵-۷. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/87092?query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=34">ارمیتاژ، روسیه</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c0796480b4d285320413/s_p_sW3adkK7lr960dU5.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c0796480b4d285320413/m_p_sW3adkK7lr960dU5.jpg">بزرگ‌تر</a>]</p><hr><p>سده‌های ۵-۶. آمپول با تصویر قدیس مینا (مصر). <a href="https://www.metmuseum.org/art/collection/search/854993">موزهٔ متروپولیتن در خیابان پنجم، آمریکا</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5f3f845c75323d28a5eb8/s_p_ePhTgphiYrxHdEaZ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5f3f845c75323d28a5eb8/m_p_ePhTgphiYrxHdEaZ.jpg">بزرگ‌تر</a>]</p><hr><p>سده‌های ۵-۶. آمپول با تصویر قدیس مینا (مصر). <a href="https://www.metmuseum.org/art/collection/search/854994">موزهٔ متروپولیتن در خیابان پنجم، آمریکا</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5f40645c75323d28a5eb9/s_p_5HMBehehtBuCUdOm.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5f40645c75323d28a5eb9/m_p_5HMBehehtBuCUdOm.jpg">بزرگ‌تر</a>]</p><h3>انگشتر با تصویر مسیح (مصر، لوکسور)</h3><p>سده‌های ۵-۷. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/111849?page=5&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%B0&amp;index=240">ارمیتاژ، روسیه</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c4d46480b4d285320420/s_p_SyuBoqgvHXMA5UIe.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c4d46480b4d285320420/m_p_SyuBoqgvHXMA5UIe.jpg">بزرگ‌تر</a>]</p><h2>سدهٔ ۶</h2><h3>خداوند عیسی مسیح (سینا)</h3><p>سدهٔ ۶. صومعهٔ قدیس کاترین، مصر [3].</p><img src="https://res.bibleox.com/s/img/image/simple/686fe7935f47da2505d3ae87/s_p_cikLnQnMeZgiaeXg.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686fe7935f47da2505d3ae87/m_p_cikLnQnMeZgiaeXg.jpg">بزرگ‌تر</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6872d4935f47da2505d3ae90/m_p_1CbtDgulMkyLj9dK.jpg">نسخه 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6872d4835f47da2505d3ae8d/m_p_IPypUclQUGcqTIJa.jpg">نسخه 3</a>]</p><h3>مادر خدا با کودک عیسی، قدیسان تئودور و گئورگیوس (سینا)</h3><p>سدهٔ ۶. صومعهٔ قدیس کاترین، آیکون انکائوستیک، مصر.</p><img src="https://res.bibleox.com/s/img/image/simple/674ece56dba77200011c7384/s_p_RWNQK8qhzLwXxGkf.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674ece56dba77200011c7384/m_p_RWNQK8qhzLwXxGkf.jpg">بزرگ‌تر</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6872d4895f47da2505d3ae8e/m_p_6JgREZVUzpO8lC9E.jpg">نسخه 2</a>]</p><h3>رسول پطرس (سینا)</h3><p>سدهٔ ۶. صومعهٔ قدیس کاترین، آیکون انکائوستیک، مصر.</p><img src="https://res.bibleox.com/s/img/image/simple/686fe28f5f47da2505d3ae82/s_p_tWJyRADNEjI9Gt5J.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686fe28f5f47da2505d3ae82/m_p_tWJyRADNEjI9Gt5J.jpg">بزرگ‌تر</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686fe73d5f47da2505d3ae86/m_p_ztqtzVnOwMfzjCsd.jpg">نسخه 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6872d48f5f47da2505d3ae8f/m_p_x4BAyJ0C1GjHQ7Us.jpg">نسخه 3</a>]</p><h3>مادر خدا و کودک الهی مسیح (بیزانس)</h3><p>سدهٔ ۶. <a href="https://www.metmuseum.org/art/collection/search/463392">موزهٔ متروپولیتن در خیابان پنجم، آمریکا</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5fce645c75323d28a5ec5/s_p_KB8coyb4H50zurQW.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5fce645c75323d28a5ec5/m_p_KB8coyb4H50zurQW.jpg">بزرگ‌تر</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5fce945c75323d28a5ec6/m_p_eIaeevwinjFBQAeA.jpg">نسخه 2</a>]</p><h3>انگشتری با آیکون مادر خدا و کودک الهی مسیح (بیزانس)</h3><p>سده‌های ۶-۷. <a href="https://www.metmuseum.org/art/collection/search/464059">موزهٔ متروپولیتن در خیابان پنجم، آمریکا</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5fe7745c75323d28a5ec7/s_p_bcCSRfNkRmmk5jZs.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5fe7745c75323d28a5ec7/m_p_bcCSRfNkRmmk5jZs.jpg">بزرگ‌تر</a>]</p><h3>مریم مقدس</h3><p>سال ۶۱۱، <a href="https://www.pravenc.ru/text/164537.html">گراسا</a></p><img src="https://res.bibleox.com/s/img/image/simple/482/s_p_s3flMTpYpn69iMIy.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/482/m_p_s3flMTpYpn69iMIy.jpg">بزرگ‌تر</a>]</p><h3>مسیح، مدالیون (انطاکیه)</h3><p>سال‌های ۵۰۰-۶۲۵. ماده: نقره، طلاکاری. ۱۴.۹ × ۱۴.۱ × ۱.۱ سانتی‌متر. <a href="https://collections.louvre.fr/en/ark:/53355/cl010256496">لوور، فرانسه</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c409da6594f46d35a87f00/s_p_BHIOy3tEZ3ZoMEr5.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c409da6594f46d35a87f00/m_p_BHIOy3tEZ3ZoMEr5.jpg">بزرگ‌تر</a>]</p><hr><p>سال‌های ۵۰۰-۶۲۵. <a href="https://collections.louvre.fr/en/ark:/53355/cl010256495">لوور، فرانسه</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c41f626594f46d35a87f05/s_p_bKgaW542SgyD11o9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c41f626594f46d35a87f05/m_p_bKgaW542SgyD11o9.jpg">بزرگ‌تر</a>]</p><h3>گوبلن با آیکون‌ها: مسیح، مادر خدا، فرشتگان مقرب میکائیل و جبرائیل، رسولان (مصر، بیزانس)</h3><p>سال ۵۰۰. <a href="https://www.clevelandart.org/art/1967.144">موزهٔ هنر کلیولند، آمریکا</a>. پشم، ۱۷۸.۷ × ۱۱۰.۵ سانتی‌متر.</p><p>شرح موزه:</p><blockquote><p>این گوبلن کم‌یاب که از نخ‌های پشمی بیش از بیست رنگ بافته شده، در روزگار خود از تابلوی نقاشی گران‌تر بود. بهای تاریخی آن بازتاب آن بود که هم‌عصرانش استادی بافندگان را در آمیختن رنگ‌ها می‌ستودند. این گوبلن که بر دیوار آویخته می‌شد، <strong>به مؤمنان امکان می‌داد که در درون دیوارهای کلیسای ارتدکس به تکریم مادر خدا و کودک مسیح بپردازند</strong>. فرشتگان و رسولان با نام‌های نوشته‌شده به یونانی گرد آنان را گرفته‌اند. آیکون (تصویر مقدس) برای آنکه از نظر روحانی کارساز باشد، باید تا حد امکان دقیق از سنت تصویری تثبیت‌شدهٔ تصویر خود پیروی کند.</p><p>کتیبهٔ بالای چارچوب معماری از یونانی چنین ترجمه می‌شود: «<strong>قدیس میکائیل، مریم مقدس، قدیس جبرائیل</strong>». حاشیهٔ پهن برگ‌دار با میوه‌ها و گل‌ها آراسته شده است و در بخش پایین مدالیون‌هایی دارد که نیم‌تنهٔ رسولان در آنهاست؛ نام‌هایشان در کنارشان به یونانی نوشته شده است و چنین ترجمه می‌شود: «<strong>اندریاس، متی، رسول پولس، لوقا، یعقوب، فیلیپ، مرقس، توما، یوحنا، متیاس، پطرس و برتولومائوس</strong>».</p></blockquote><img src="https://res.bibleox.com/s/img/image/simple/68cb9dd5205184ec278d58d7/s_p_jXuLxO8mwNy5DicO.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68cb9dd5205184ec278d58d7/m_p_jXuLxO8mwNy5DicO.jpg">بزرگ‌تر</a>]</p><h3>گوبلن با آیکون‌ها. سه جوان؟، خریسما (مصر، بیزانس)</h3><p>سال‌های ۵۰۰. <a href="https://www.clevelandart.org/art/1982.73">موزهٔ هنر کلیولند، آمریکا</a>. پشم، کتان. ۱۱۰.۵ × ۷۶.۸ سانتی‌متر.</p><img src="https://res.bibleox.com/s/img/image/simple/68cb9dde205184ec278d58d8/s_p_w5vxLEtZSz6mW36r.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68cb9dde205184ec278d58d8/m_p_w5vxLEtZSz6mW36r.jpg">بزرگ‌تر</a>]</p><h3>گوبلن با آیکون‌ها. مادر خدا، مغان، نبی یونس (مصر، بیزانس)</h3><p>سال‌های ۵۰۰-۵۵۰. <a href="https://www.clevelandart.org/art/1951.400">موزهٔ هنر کلیولند، آمریکا</a>. کتان. ۹۹.۷ × ۱۰۴.۸ سانتی‌متر.</p><p>شرح موزه:</p><blockquote><p>… در سمت چپ در ردیف بالا <strong>مریم باکره با کودک مسیح</strong> بر چهارپایه‌ای با پایه‌های صلیب‌شکل تصویر شده است. چنان‌که در کتیبهٔ قبطی آمده است، <strong>سه پادشاه از سمت راست با هدایا نزدیک می‌شوند</strong>. ردیف میانی در سمت چپ احتمالاً <strong>تعمید مسیح</strong> را نشان می‌دهد، در حالی که سه پیکر دیگر که با ستون‌ها از هم جدا شده‌اند، ظاهراً معجزه‌ای از عهد جدید را بازمی‌نمایانند که در آن مسیح انبوهی بزرگ را تنها با پنج نان و دو ماهی سیر کرد. در ردیف پایین هنوز <strong>صحنهٔ عهد عتیق که در آن نهنگ نبی یونس را می‌بلعد</strong> بازشناختنی است.</p><p>کتیبه‌های یونانی صحنه‌های گوناگون عهد عتیق و عهد جدید را مشخص می‌کنند. بالای نخستین مغ در ردیف بالا می‌توان دو حرف <strong>«XP»</strong> را از واژهٔ یونانی به معنای طلا (<em>χρυσός - chrysós</em>) دید. در سمت چپ در ردیف میانی دو پیکر تصویر شده‌اند: نخستین تقریباً به‌کلی از میان رفته است و دومی با کتیبهٔ <strong>«EIΩANNHC» (یوحنا)</strong> شناسایی شده است. در ردیف پایین تصویر یونس آمده است که به ساحل افکنده شده، با ماهی بزرگی در کنارش، و کتیبهٔ <strong>«EIΩNAC» (یونس)</strong> همراه آن است. موسی که تقریباً به‌کلی از میان رفته، تنها از راه کتیبهٔ خود <strong>«MWCHC» (موسی)</strong> بازشناخته می‌شود.</p></blockquote><img src="https://res.bibleox.com/s/img/image/simple/68cb9e0d205184ec278d58d9/s_p_WiTqygXUYCZZY7TF.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68cb9e0d205184ec278d58d9/m_p_WiTqygXUYCZZY7TF.jpg">بزرگ‌تر</a>]</p><h3>جام‌های عشای ربانی و مجمره‌ها با آیکون‌ها (بیزانس، سوریه، آتاروتی)</h3><p>سال‌های ۵۰۰-۶۵۰. <a href="https://www.metmuseum.org/art/collection/search/474390">موزهٔ متروپولیتن در خیابان پنجم، آمریکا</a>. نقره، طلاکاری. بر جام‌ها آیکون‌های خداوند و قدیسان و نیز کتیبه‌هایی هست که نشان می‌دهد آنان را چه کسی و برای چه کسی وقف کرده است.</p><p>این اشیای لیتورژیک استادانه‌ساخته — جام‌ها، مجمره‌ها، صافی و تصویر کبوتر روح القدس — از آنِ کلیسای مسیحی شهر تجاری ثروتمند آتاروتی در سوریه بود؛ سرزمینی که در آن روزگار یکی از ثروتمندترین سرزمین‌های امپراتوری بیزانس به شمار می‌رفت. جام‌ها، مجمره‌ها و صافی در هنگام قداس الهی، یا عشای ربانی، به کار می‌رفتند — آیینی که در آن مسیحیان شراب و نان تقدیس‌شده را به یاد شام آخر و مرگ مسیح می‌خورند.</p><p>بر پایهٔ کتیبه‌های روی آنها که به یونانی و با چند گونهٔ املایی نوشته شده است، بسیاری از این اشیا به دست ساکنان محلی به کلیسای اصلی شهر که به قدیس استفان وقف شده بود و به کلیسای کوچک‌تری که به قدیس یوحنا وقف شده بود (به احتمال زیاد یحیای تعمیددهنده [تعمیدگر]) پیشکش شد.</p><p>در آغاز سدهٔ هفتم، سوریه نخست زیر یورش پارسیان ساسانی و سپس زیر یورش سپاه‌های اسلام فرو افتاد. به احتمال زیاد این آثار هنری در همان لحظه‌ای که ارتش بیزانس از برابر مهاجمان به این سرزمین عقب می‌نشست، شتاب‌زده در ظرفی محافظ به خاک سپرده شده‌اند.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5db2045c75323d28a5e9a/s_p_kx70rC7wWJQtkfdG.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5db2045c75323d28a5e9a/m_p_kx70rC7wWJQtkfdG.jpg">بزرگ‌تر</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5edf045c75323d28a5ea5/m_p_Eru1rmuua6UWqjTz.jpg">نسخه 2</a>]</p><hr><p>یحیای تعمیددهنده با موهای بلند، مادر خدا در حالت اورانت (با دست‌های برافراشته)، قدیسی در حالت اورانت، جنگاورِ مقدس با عصا و سپر، مسیح جوان با هالهٔ صلیب‌دار و جنگاورِ مقدس دیگری در زره که اژدها را می‌کشد (شاید قدیس گئورگیوس (جرج)؟)، زیر طاق‌ها. <a href="https://www.metmuseum.org/art/collection/search/466137">موزهٔ متروپولیتن در خیابان پنجم، ایالات متحده</a>. ۲۱٫۳ × ۱۶ سانتی‌متر.</p><p>کتیبه‌ای به یونانی: «<strong>اِودوکسیا برای رستگاری خویش [این را] به قدیس استفانِ روستای آتّار[وتی] هدیه کرد</strong>».</p><img src="https://res.bibleox.com/s/img/image/simple/68b5efa445c75323d28a5eaa/s_p_l5pPSsTDZHSQuvNU.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5efa445c75323d28a5eaa/m_p_l5pPSsTDZHSQuvNU.jpg">بزرگ‌تر</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f01f45c75323d28a5eab/m_p_456sbKEe3ANd9ZWP.jpg">نسخه 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f02245c75323d28a5eac/m_p_fkJIydq7uEfZbIUt.jpg">نسخه 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f02445c75323d28a5ead/m_p_s25q6Lu5HItPjqDs.jpg">نسخه 4</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f02745c75323d28a5eae/m_p_QJsAgl2zRfYmpNDL.jpg">نسخه 5</a>]</p><hr><p>جام عشای ربانی با آیکون سنت یحیای تعمیددهنده، شماس مقدس (به احتمال زیاد استفان)، اسقف‌های مقدس و صلیب‌ها. <a href="https://www.metmuseum.org/art/collection/search/466130">موزهٔ متروپولیتن در خیابان پنجم، ایالات متحده</a>. ۲۰٫۵ × ۱۵٫۱ سانتی‌متر، ۳۶۹ گرم، ۱۱۰۰ میلی‌لیتر</p><p>کتیبه‌ای به یونانی: «<strong>به سنت یوحنا از روستای آتاروتیس</strong>».</p><img src="https://res.bibleox.com/s/img/image/simple/68b5ec4545c75323d28a5ea4/s_p_KWMPzINWo4ktBKQ7.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5ec4545c75323d28a5ea4/m_p_KWMPzINWo4ktBKQ7.jpg">بزرگ‌تر</a>]</p><hr><p>جام عشای ربانی با آیکون مسیح، مادر خدا، یحیای تعمیددهنده و گئورگیوس (جرج) پیروز. <a href="https://www.metmuseum.org/art/collection/search/466129">موزهٔ متروپولیتن در خیابان پنجم، ایالات متحده</a>. ۲۴٫۳ × ۱۶٫۸ سانتی‌متر.</p><p>کتیبه‌ای به یونانی: «<strong>قدیس استفان از روستای آتّاروتا</strong>».</p><img src="https://res.bibleox.com/s/img/image/simple/68b5ee1345c75323d28a5ea6/s_p_9bHxlNSj26b5EhMw.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5ee1345c75323d28a5ea6/m_p_9bHxlNSj26b5EhMw.jpg">بزرگ‌تر</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5ee3c45c75323d28a5ea7/m_p_8XweLe1b1pD7GWHb.jpg">نسخه 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5ee4045c75323d28a5ea8/m_p_faMKsJUImltU9s6v.jpg">نسخه 3</a>]</p><hr><p>جام عشای ربانی با تصویر مسیح جوان با هالهٔ صلیب‌شکل، شماس مقدس با مجمره (به احتمال زیاد قدیس استفان)، مریم مقدس در حالت نیایش و قدیس جوانی با عصا. اندازه: ۲۳٫۹ × ۱۷ سانتی‌متر، ۳۵۶ گرم. <a href="https://www.metmuseum.org/art/collection/search/466141">موزهٔ متروپولیتن در خیابان پنجم، ایالات متحده.</a></p><p>کتیبه‌ای به یونانی: «<strong>به انجام نذر و برای رستگاری کسی که نامش نزد خداوند معلوم است</strong>».</p><img src="https://res.bibleox.com/s/img/image/simple/68b5fa7a45c75323d28a5ebe/s_p_7AzZiy4FebkdJC4e.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5fa7a45c75323d28a5ebe/m_p_7AzZiy4FebkdJC4e.jpg">بزرگ‌تر</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5fa8345c75323d28a5ebf/m_p_LQnRTCSFvxz7O7ui.jpg">نسخه 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5fa8645c75323d28a5ec0/m_p_KvY9o90gFdzJeK9N.jpg">نسخه 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5fa8945c75323d28a5ec1/m_p_BUzuFJ6F1fLtMppI.jpg">نسخه 4</a>]</p><hr><p>مجمره با تصویر مسیح جوان در هالهٔ صلیب‌شکل، سنت یحیای تعمیددهنده، مریم مقدس در حالت نیایش، شماس مقدس (به احتمال زیاد قدیس استفان) و صلیب‌ها. نقره و نقرهٔ طلاکاری‌شده با پشت‌بند مسی. اندازه: ۴۱٫۵ × ۱۳٫۲ × ۱۲٫۶ سانتی‌متر. <a href="https://www.metmuseum.org/art/collection/search/466132">موزهٔ متروپولیتن در خیابان پنجم، ایالات متحده</a>.</p><p>کتیبه‌ای به یونانی: «<strong>به نام آرامش روح اِرتا و استفان، فرزندان کیریاکوس</strong>»</p><img src="https://res.bibleox.com/s/img/image/simple/68b5f15545c75323d28a5eaf/s_p_OJ2d0ec3h6BtKZQM.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5f15545c75323d28a5eaf/m_p_OJ2d0ec3h6BtKZQM.jpg">بزرگ‌تر</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f15845c75323d28a5eb0/m_p_MLajjsEoJyZ7xPC7.jpg">نسخه 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f15c45c75323d28a5eb1/m_p_5k22minZ9Q7EruSj.jpg">نسخه 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f15e45c75323d28a5eb2/m_p_3cDRqzOwNAJr7A0S.jpg">نسخه 4</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f16145c75323d28a5eb3/m_p_8vKQQvQJKE8Mbtoc.jpg">نسخه 5</a>]</p><hr><p>مجمره با تصویر مسیح جوان در هالهٔ صلیب‌شکل، دو فرشتهٔ مقرب و صلیب‌ها. ۸٫۲ × ۱۳٫۲ سانتی‌متر. <a href="https://www.metmuseum.org/art/collection/search/466131">موزهٔ متروپولیتن در خیابان پنجم، ایالات متحده</a>.</p><p>کتیبه‌ای به یونانی: «<strong>به سنت یوحنا از روستای آتّاروتا</strong>».</p><img src="https://res.bibleox.com/s/img/image/simple/68b5f27545c75323d28a5eb4/s_p_brjJXh3ZIrplms0E.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5f27545c75323d28a5eb4/m_p_brjJXh3ZIrplms0E.jpg">بزرگ‌تر</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f28545c75323d28a5eb5/m_p_oWtx1CexyxQIAxRK.jpg">نسخه 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f28845c75323d28a5eb6/m_p_zqvxcBdCxjLqltWh.jpg">نسخه 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5f28c45c75323d28a5eb7/m_p_fIVExsqDAbrZLhWW.jpg">نسخه 4</a>]</p><h3>جام‌های عشای ربانی با تصویر مسیح و مقدسان، دیسکوس با صلیب (سوریه، بیزانس)</h3><p>سال‌های ۵۰۰–۷۰۰ میلادی. موزهٔ هنر کلیولند، ایالات متحده: <a href="https://www.clevelandart.org/art/1950.378">۱</a>، <a href="https://www.clevelandart.org/art/1950.379">۲</a>، <a href="https://www.clevelandart.org/art/1950.380">۳</a>، <a href="https://www.clevelandart.org/art/1950.381">۴</a>.</p><p>این چهار ظرف مذهبی از نقره — یک دیسکوس و سه جام (شمارهٔ 1950.378–81) — آن چیزی را می‌سازند که امروز «گنجینهٔ بیت میسونا» خوانده می‌شود؛ نامی برگرفته از روستایی در شمال سوریه که این اشیا برای آن ساخته شده بودند.</p><p>هرچند محل دقیق و شرایط کشف این گنجینه روشن نیست، احتمالاً ساکنان روستای بیت میسونا، مانند دیگر جوامع مسیحی در سوریه و فلسطین، ناچار شدند نقرهٔ کلیسایی را در خاک پنهان کنند تا آن را از پارسیان یا اعرابی که در نیمهٔ نخست سدهٔ هفتم سرزمینشان را گشودند، پنهان نگه دارند.</p><p>دیسکوس که در هنگام قداس الهی ذرات عشای ربانی بر آن قرار می‌گرفت، با صلیب لاتینی کنده‌کاری‌شده در میان کتیبه‌ای اهدایی آراسته است. در آن کتیبه، اهداکنندهٔ دیسکوس — دُمنوس — و مکان نخستین آن — کلیسای سنت سرگیوس در بیت میسونا — نام برده شده است.</p><p>جام‌ها کاسه‌های پهن دارند که با تصاویر نیم‌تنهٔ مسیح، مادر خدا و رسولان پطرس و پولس آراسته شده‌اند. بر یکی از جام‌ها کتیبه‌ای اهدایی هست با نام اهداکننده — کیریاکوس، پسر دُمنوس — و نام کشیش کلیسا که این هدیهٔ پارسایانه را دریافت کرد — زنون.</p><p>کتیبه‌ای به یونانی: «<strong>+ کشیش کیریاکوس، پسر دُمنوس، (این جام را) در روزگار کشیش زنون به سنت سرگیوس تقدیم کرد</strong>»</p><img src="https://res.bibleox.com/s/img/image/simple/68caa03c205184ec278d5880/s_p_SB8idWRkPX7keKkU.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68caa03c205184ec278d5880/m_p_SB8idWRkPX7keKkU.jpg">مسیح</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68caa026205184ec278d587d/m_p_sYIDwGwUI9iMAzzD.jpg">مادر خدا</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68caa029205184ec278d587e/m_p_xYnPNjrcxGm5mJgl.jpg">رسول</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68caa02c205184ec278d587f/m_p_kH9idfsikXyvAVvy.jpg">رسول</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68caa0d4205184ec278d5881/m_p_vWERSBBMAoytSNnX.jpg">نمای از بالا</a>]</p><hr><img src="https://res.bibleox.com/s/img/image/simple/68ca9cd5205184ec278d5874/s_p_tH0J7uqAriM7uaeK.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68ca9cd5205184ec278d5874/m_p_tH0J7uqAriM7uaeK.jpg">مسیح</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68ca9d13205184ec278d5878/m_p_tYRbn15h6MPNUilS.jpg">مادر خدا</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68ca9ce8205184ec278d5875/m_p_FKfoi68UXlWCS5ky.jpg">رسول</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68ca9ceb205184ec278d5876/m_p_Zp9CJ61HnBcr8Csr.jpg">رسول</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68ca9cee205184ec278d5877/m_p_w2JDvDj5c4pMVcfk.jpg">نمای از بالا</a>]</p><hr><img src="https://res.bibleox.com/s/img/image/simple/68ca9e94205184ec278d5879/s_p_27LzQUQDD3A7nI9X.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68ca9e94205184ec278d5879/m_p_27LzQUQDD3A7nI9X.jpg">مسیح</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68ca9e98205184ec278d587a/m_p_R47Eqr4GrHijUSIb.jpg">مادر خدا</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68ca9e9b205184ec278d587b/m_p_31NEBZQIYBEqOut0.jpg">رسول</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68ca9e9e205184ec278d587c/m_p_QxtJHMZORGGwFxYQ.jpg">رسول</a>]</p><hr><p>حدود ۵۰۰ میلادی. دیسکوس. <a href="https://www.clevelandart.org/art/1950.381">موزهٔ هنر کلیولند، ایالات متحده</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68ca964d205184ec278d5873/s_p_wNDEaPHmGHiuWeZy.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68ca964d205184ec278d5873/m_p_wNDEaPHmGHiuWeZy.jpg">بزرگ‌تر</a>]</p><h3>مجمره. تعمید و به صلیب کشیده شدن خداوند عیسی مسیح (بیزانس)</h3><p>سال‌های ۵۰۰–۸۹۹. اندازه‌ها: ۱۳٫۴ × ۹ سانتی‌متر. <a href="https://collections.louvre.fr/en/ark:/53355/cl010042067">موزهٔ لوور، فرانسه</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c4068e6594f46d35a87efe/s_p_3kaCIWMTmQfT4NFG.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c4068e6594f46d35a87efe/m_p_3kaCIWMTmQfT4NFG.jpg">بزرگ‌تر</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/68c4061f6594f46d35a87efc/s_p_XNlsrfQ2MOphupt9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c4061f6594f46d35a87efc/m_p_XNlsrfQ2MOphupt9.jpg">بزرگ‌تر</a>]</p><h3>گلدان. مسیح، مادر خدا، یحیای تعمیددهنده، رسولان، فرشتگان (قسطنطنیه)</h3><img src="https://res.bibleox.com/s/img/image/simple/68c420e46594f46d35a87f06/s_p_iADN1OW5uYg5Wovc.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c420e46594f46d35a87f06/m_p_iADN1OW5uYg5Wovc.jpg">بزرگ‌تر</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c420e76594f46d35a87f07/m_p_oAs6ecjPj32iGMce.jpg">روی دیگر</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c421216594f46d35a87f0f/m_p_x6q5apwWB0DZirK2.jpg">مسیح</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c420fc6594f46d35a87f0b/m_p_sL17qrWgxkRCNRBb.jpg">مادر خدا</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c420ea6594f46d35a87f08/m_p_Cb0UJi1oxoKCQaXw.jpg">یحیای تعمیددهنده</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c421016594f46d35a87f0c/m_p_a9Y1fyPNxcQ4oNbq.jpg">فرشته</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c420f66594f46d35a87f0a/m_p_nAqhqDbP5x8fRAnj.jpg">فرشته</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c420ef6594f46d35a87f09/m_p_F9R3iyZ8go0PxARb.jpg">رسول</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c4210a6594f46d35a87f0e/m_p_97cyzUvq95UJZOrR.jpg">رسول</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c421056594f46d35a87f0d/m_p_WfK6SdjAqAOW9fDK.jpg">رسول</a>]</p><h3>صلیب سینه‌ای با آیکون (بیزانس)</h3><p>سدهٔ ششم.<strong> </strong>طلا، خمیر شیشه، بلور کوهی، شیشه؛ قالب‌زنی، دانه‌کاری. طول زنجیر: ۳۳ سانتی‌متر؛ صلیب: ۴٫۹ × ۳٫۸ سانتی‌متر. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/227027?page=46&amp;query=%D0%BA%D1%80%D0%B5%D1%81%D1%82&amp;sort=112&amp;index=2288">موزهٔ ارمیتاژ، روسیه</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c11e3c6594f46d35a87e2c/s_p_9GZmzTSaUVuXXaX1.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c11e3c6594f46d35a87e2c/m_p_9GZmzTSaUVuXXaX1.jpg">بزرگ‌تر</a>]</p><h3>آویز. به صلیب کشیده شدن مسیح (مصر)</h3><p>سال‌های ۵۰۰–۷۰۰. اندازه‌ها: ۳٫۳ × ۱٫۹ سانتی‌متر. <a href="https://collections.louvre.fr/en/ark:/53355/cl010102800">موزهٔ لوور، فرانسه</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c41c4e6594f46d35a87f03/s_p_tiaBwT9vqOXIlsIw.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c41c4e6594f46d35a87f03/m_p_tiaBwT9vqOXIlsIw.jpg">بزرگ‌تر</a>]</p><h3>آیکون دو قدیس (بیزانس)</h3><p>سدهٔ ششم؛ ۲۵٫۵ × ۲۲ × ۱٫۳ سانتی‌متر. احتمالاً این تصویرِ متی و یوحنای انجیل‌نگار است. <a href="https://www.metmuseum.org/art/collection/search/468198">موزهٔ متروپولیتن در خیابان پنجم، ایالات متحده</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5fc1545c75323d28a5ec3/s_p_a2FJmSgsGJRdELBq.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5fc1545c75323d28a5ec3/m_p_a2FJmSgsGJRdELBq.jpg">بزرگ‌تر</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5fc1945c75323d28a5ec4/m_p_pcvRiRfRgBcuHJEA.jpg">نسخه 2</a>]</p><h3>آیکون‌های رسولان پطرس و پولس (انطاکیه)</h3><p>سال‌های ۵۵۰–۶۰۰. رسول پطرس. <a href="https://www.metmuseum.org/art/collection/search/468348">موزهٔ متروپولیتن در خیابان پنجم، ایالات متحده</a>. نقره. ۳۸٫۱ × ۵۵٫۹ × ۲٫۲ سانتی‌متر.</p><img src="https://res.bibleox.com/s/img/image/simple/68c1bfd36594f46d35a87e6f/s_p_WguE3h0pnnzXQXwt.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1bfd36594f46d35a87e6f/m_p_WguE3h0pnnzXQXwt.jpg">بزرگ‌تر</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c1bfd56594f46d35a87e70/m_p_83EvKNt1mFSPspQw.jpg">بزرگ‌تر</a>]</p><p>سال‌های ۵۵۰–۶۰۰. رسول پولس. <a href="https://www.metmuseum.org/art/collection/search/468347">موزهٔ متروپولیتن در خیابان پنجم، ایالات متحده</a>. نقره. ۳۸٫۱ × ۵۵٫۹ × ۲٫۲ سانتی‌متر.</p><img src="https://res.bibleox.com/s/img/image/simple/68c1bfda6594f46d35a87e71/s_p_5Y11faCyEzohnydQ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1bfda6594f46d35a87e71/m_p_5Y11faCyEzohnydQ.jpg">بزرگ‌تر</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c1bfdd6594f46d35a87e72/m_p_jGCYAnYdrt4tlXhd.jpg">بزرگ‌تر</a>]</p><h3>آیکون (سوریه؟، بیزانس)</h3><p>سدهٔ ششم. <a href="https://www.clevelandart.org/art/1941.57">موزهٔ هنر کلیولند، ایالات متحده</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68caa8cd205184ec278d5883/s_p_qr7HPRgCtcCRwsvb.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68caa8cd205184ec278d5883/m_p_qr7HPRgCtcCRwsvb.jpg">بزرگ‌تر</a>]</p><h3>تصویر شهیدِ جنگاور (مصر قبطی)</h3><p>سده‌های ششم–هفتم. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/180444?page=6&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=253">موزهٔ ارمیتاژ، روسیه</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c3c06480b4d28532041c/s_p_Rnquar8nZacdzqcP.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c3c06480b4d28532041c/m_p_Rnquar8nZacdzqcP.jpg">بزرگ‌تر</a>]</p><h3>آمپول با آیکون رسول پولس (؟) و سنت تکلا (مصر)</h3><p>سال‌های ۵۰۰–۷۰۰. <a href="https://collections.louvre.fr/en/ark:/53355/cl010280955">موزهٔ لوور، فرانسه</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c4390d6594f46d35a87f15/s_p_Zxs1yv3Jg8oKfFHW.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c4390d6594f46d35a87f15/m_p_Zxs1yv3Jg8oKfFHW.jpg">بزرگ‌تر</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/68c4390a6594f46d35a87f14/s_p_CPdXMrLBUE0satoH.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c4390a6594f46d35a87f14/m_p_CPdXMrLBUE0satoH.jpg">بزرگ‌تر</a>]</p><h3>آمپول با آیکون رسول اندریاس (اسمیرنا)</h3><p>سال‌های ۵۰۰–۶۰۰. <a href="https://collections.louvre.fr/en/ark:/53355/cl010281050">موزهٔ لوور، فرانسه</a>. ۷ × ۵ × ۲٫۸ سانتی‌متر.</p><img src="https://res.bibleox.com/s/img/image/simple/68c437966594f46d35a87f13/s_p_dCGVNUwg3KWvs9zz.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c437966594f46d35a87f13/m_p_dCGVNUwg3KWvs9zz.jpg">بزرگ‌تر</a>]</p><h3>آمپول‌هایی با آیکون سنت مینا</h3><p>سال‌های ۶۱۰–۶۵۰. آمپول با تصویر سنت مینا (مصر). <a href="https://www.metmuseum.org/art/collection/search/475416">موزهٔ متروپولیتن در خیابان پنجم، ایالات متحده</a>. ۸٫۵ × ۶٫۹ × ۱٫۸ سانتی‌متر.</p><img src="https://res.bibleox.com/s/img/image/simple/68c1c1396594f46d35a87e73/s_p_KIdJIYWMysre63rP.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1c1396594f46d35a87e73/m_p_KIdJIYWMysre63rP.jpg">بزرگ‌تر</a>]</p><hr><p>سال‌های ۵۰۰–۷۵۰. <a href="https://collections.louvre.fr/en/ark:/53355/cl010044285">موزهٔ لوور، فرانسه</a>. ۱۳ × ۱۰٫۶ × ۳٫۴ سانتی‌متر.</p><img src="https://res.bibleox.com/s/img/image/simple/68c3bc556594f46d35a87ebd/s_p_iHBRxhobWKvQb2Dx.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3bc556594f46d35a87ebd/m_p_iHBRxhobWKvQb2Dx.jpg">بزرگ‌تر</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/68c3bc5c6594f46d35a87ebe/s_p_fQ8Ps5eHBD1myJaS.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3bc5c6594f46d35a87ebe/m_p_fQ8Ps5eHBD1myJaS.jpg">بزرگ‌تر</a>]</p><h3>مسیح (راونا)</h3><p>کلیسای سانت آپولیناره این کلاسه، راونا، ایتالیا.</p><img src="https://res.bibleox.com/s/img/image/simple/675005d5dba77200011c73ad/s_p_rjjDEzNckea3oHk2.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/675005d5dba77200011c73ad/m_p_rjjDEzNckea3oHk2.jpg">بزرگ‌تر</a>]</p><h3>مسیح و رسولان (راونا)</h3><p>موزائیک پرسبیتریوم (جایگاه کشیشان در مذبح). کلیسای سان ویتاله، راونا، ایتالیا.</p><img src="https://res.bibleox.com/s/img/image/simple/675005dadba77200011c73ae/s_p_Nac2nrVo791COrcO.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/675005dadba77200011c73ae/m_p_Nac2nrVo791COrcO.jpg">بزرگ‌تر</a>]</p><h3>مسیح، فرشتگان و ویتالیوس (راونا)</h3><p>سدهٔ ششم. بازیلیکای سنت ویتالیوس میلانی، راونا.</p><img src="https://res.bibleox.com/s/img/image/simple/674f0ab3dba77200011c738f/s_p_AsShtty0gMBFOX5X.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f0ab3dba77200011c738f/m_p_AsShtty0gMBFOX5X.jpg">بزرگ‌تر</a>]</p><h3>امپراتور یوستینیان، نیک‌ایمان (راونا)</h3><p>سدهٔ ششم. بازیلیکای سنت ویتالیوس میلانی، راونا.</p><img src="https://res.bibleox.com/s/img/image/simple/674f0ab8dba77200011c7390/s_p_MsUwTeWDMk0uEVPq.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f0ab8dba77200011c7390/m_p_MsUwTeWDMk0uEVPq.jpg">بزرگ‌تر</a>]</p><h3>ملکه تئودورا، نیک‌ایمان (راونا)</h3><p>سدهٔ ششم. بازیلیکای سنت ویتالیوس میلانی، راونا.</p><img src="https://res.bibleox.com/s/img/image/simple/674f0ac0dba77200011c7391/s_p_6g0s1g1btiJBEXSR.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f0ac0dba77200011c7391/m_p_6g0s1g1btiJBEXSR.jpg">بزرگ‌تر</a>]</p><h3>ابراهیم پدرسالار (نیاپدر) (راونا)</h3><p>سدهٔ ششم. بازیلیکای سنت ویتالیوس میلانی، راونا.</p><img src="https://res.bibleox.com/s/img/image/simple/674f0ad6dba77200011c7393/s_p_zgb5TLR1yafutIu4.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f0ad6dba77200011c7393/m_p_zgb5TLR1yafutIu4.jpg">بزرگ‌تر</a>]</p><h3>هابیل و ملکیصدق (راونا)</h3><p>سدهٔ ششم. بازیلیکای سنت ویتالیوس میلانی، راونا.</p><img src="https://res.bibleox.com/s/img/image/simple/674f0adbdba77200011c7394/s_p_PiL9TaItwhR28eXN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f0adbdba77200011c7394/m_p_PiL9TaItwhR28eXN.jpg">بزرگ‌تر</a>]</p><h3>مارسلینوس، پولیون، پطرس، قدیسان (روم)</h3><p>سدهٔ ششم. دخمهٔ پونسیانو. دیوارنگاره.</p><img src="https://res.bibleox.com/s/img/image/simple/66cc2c4adba77200019bc7d9/s_p_th5E9srmqGjUT72T.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/66cc2c4adba77200019bc7d9/m_p_th5E9srmqGjUT72T.jpg">بزرگ‌تر</a>]</p><h3>مسیح که بر ابرها می‌آید، رسولان و قدیسان کوسما و دامیان (روم)</h3><p>سدهٔ ششم (سال ۵۳۰). بازیلیکای کوسما و دامیان. [19][20]</p><img src="https://res.bibleox.com/s/img/image/simple/686aa5b35f47da2505d3ae28/s_p_V2YyLyiR7wCHgIfW.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa5b35f47da2505d3ae28/m_p_V2YyLyiR7wCHgIfW.jpg">بزرگ‌تر</a>]</p><p>رسول پطرس و سنت کوسما (در ادامه نیز سنت تئودور)</p><img src="https://res.bibleox.com/s/img/image/simple/686aa5d25f47da2505d3ae29/s_p_s66jgQ3tkVAmQEZE.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa5d25f47da2505d3ae29/m_p_s66jgQ3tkVAmQEZE.jpg">بزرگ‌تر</a>]</p><p>رسول پولس و سنت دامیان (در ادامه پاپ فلیکس)</p><img src="https://res.bibleox.com/s/img/image/simple/686aa7505f47da2505d3ae2c/s_p_WA1eP9P7BNe0aPQ6.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa7505f47da2505d3ae2c/m_p_WA1eP9P7BNe0aPQ6.jpg">بزرگ‌تر</a>]</p><p>فرشتهٔ مقدس</p><img src="https://res.bibleox.com/s/img/image/simple/686aa61c5f47da2505d3ae2a/s_p_MD4QowA5HKQRhFFG.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa61c5f47da2505d3ae2a/m_p_MD4QowA5HKQRhFFG.jpg">بزرگ‌تر</a>]</p><h3>مسیح و رسولان (روم)</h3><p>سدهٔ ششم (۵۷۸–۵۹۰). بازیلیکای سنت لورنتس در بیرون از دیوارهای شهر (San Lorenzo fuori le Mura) [21][22]</p><p>در کنار رسول پولس، قدیسان استفان و هیپولیتوس. در کنار رسول پطرس، سنت لورنتس.</p><img src="https://res.bibleox.com/s/img/image/simple/686aabc85f47da2505d3ae2e/s_p_xa4IU82mZb80Uija.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aabc85f47da2505d3ae2e/m_p_xa4IU82mZb80Uija.jpg">بزرگ‌تر</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686aab945f47da2505d3ae2d/s_p_21M69l0ODfpN75oh.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aab945f47da2505d3ae2d/m_p_21M69l0ODfpN75oh.jpg">بزرگ‌تر</a>]</p><h3>رسولان پطرس و پولس (فرانک‌ها)</h3><p>سده‌های ششم–هشتم. <a href="https://www.metmuseum.org/art/collection/search/464497">موزهٔ متروپولیتن در خیابان پنجم، ایالات متحده</a> (همچنین <a href="https://www.metmuseum.org/art/collection/search/464496">اینجا</a>). عاج فیل. ۲۹٫۲ × ۱۱٫۴ × ۰٫۵ سانتی‌متر.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5ff8145c75323d28a5ec8/s_p_WhZZPyHo1I7oF79K.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5ff8145c75323d28a5ec8/m_p_WhZZPyHo1I7oF79K.jpg">بزرگ‌تر</a>]</p><h3>قدیسان (بیزانس، مصر)</h3><p>سده‌های ششم–هفتم. <a href="https://www.metmuseum.org/art/collection/search/854019">موزهٔ متروپولیتن در خیابان پنجم، ایالات متحده</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68b6007445c75323d28a5ec9/s_p_DNQuRcpcjfkINQ1r.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b6007445c75323d28a5ec9/m_p_DNQuRcpcjfkINQ1r.jpg">بزرگ‌تر</a>]</p><h3>فوکا، قدیس (بیزانس، خرسونسوس)</h3><p>سدهٔ ششم. مهر ساخت اولوگیا (نان متبرک) با تصویر برجستهٔ قدیس <a href="https://azbyka.ru/days/sv-foka-sinopskij">فو<strong>́</strong>کای سینوپی</a> که بر قایقی ایستاده است. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/373084?page=2&amp;fundcoll=1420520446&amp;index=75">موزهٔ ارمیتاژ، روسیه</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863bee26480b4d285320410/s_p_s0nPEGgpeMtakrof.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863bee26480b4d285320410/m_p_s0nPEGgpeMtakrof.jpg">بزرگ‌تر</a>]</p><h3>آمپول با دو تصویر از قدیسان (آسیای صغیر، افسس)</h3><p>سدهٔ ششم. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/228313?page=44&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=2166">موزهٔ ارمیتاژ، روسیه</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c0e76480b4d285320414/s_p_KnTGMdyOhsmTAD0S.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c0e76480b4d285320414/m_p_KnTGMdyOhsmTAD0S.jpg">بزرگ‌تر</a>]</p><h3>آمپول با تصاویر انجیل‌نگار و قدیس: یوحنای متکلم و پروخور (افسس)</h3><p>سدهٔ ششم. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/228314?page=33&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=1646">موزهٔ ارمیتاژ، روسیه</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c1726480b4d285320415/s_p_oBnXQZmCz1EntIFw.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c1726480b4d285320415/m_p_oBnXQZmCz1EntIFw.jpg">بزرگ‌تر</a>]</p><h3>مهر سربی با تصویر قدیسان پطرس و پولس و کتیبه‌ای لاتینی (بیزانس)</h3><p>سده‌های ششم–هفتم. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/131338?page=33&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=1639">موزهٔ ارمیتاژ، روسیه</a>. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/161973?page=33&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=1640">نمونهٔ دیگر</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c19d6480b4d285320416/s_p_JKBi7CXiDOutHIFn.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c19d6480b4d285320416/m_p_JKBi7CXiDOutHIFn.jpg">بزرگ‌تر</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6863c22c6480b4d285320417/s_p_FmbNOmLfDrj3qYOz.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c22c6480b4d285320417/m_p_FmbNOmLfDrj3qYOz.jpg">بزرگ‌تر</a>]</p><h3>مهر سربی با تصویر مسیح (بیزانس)</h3><p>سده‌های ششم–هفتم. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/117792?page=6&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%B0&amp;index=269">موزهٔ ارمیتاژ، روسیه</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c4a86480b4d28532041f/s_p_Uy0EgcXKfuHnv9bX.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c4a86480b4d28532041f/m_p_Uy0EgcXKfuHnv9bX.jpg">بزرگ‌تر</a>]</p><h3>مهر سربی با تصویر مسیح و مونوگرام (بیزانس)</h3><p>سده‌های ششم–هفتم. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/117804?page=3&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%B0&amp;index=143">موزهٔ ارمیتاژ، روسیه</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c5a16480b4d285320422/s_p_JNdWhUPj9cA9Dvoq.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c5a16480b4d285320422/m_p_JNdWhUPj9cA9Dvoq.jpg">بزرگ‌تر</a>]</p><h2>سدهٔ هفتم</h2><h3>آیکون مسیح بر انگشتر ازدواج (بیزانس)</h3><p>سال‌های ۶۰۰–۷۰۰. کتیبه‌های یونانی بر انگشتر: <strong>ΟΜΟΝΟΙΑ</strong> — همدلی؛ <strong>ΕΙΡΙΝΗΝ ΤΗΝ ΕΜΙΝ ΔΙΔΟΜ</strong> — «صلح خود را به شما می‌دهم» (یوح ۱۴:۲۷). <a href="https://collections.louvre.fr/en/ark:/53355/cl010102797">موزهٔ لوور، فرانسه</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c402726594f46d35a87ef8/s_p_6nMwdRXMjOnhQWfu.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c402726594f46d35a87ef8/m_p_6nMwdRXMjOnhQWfu.jpg">بزرگ‌تر</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c4027c6594f46d35a87ef9/m_p_pNTvaGVW4AmLG2BK.jpg">نسخه 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c4027e6594f46d35a87efa/m_p_mvU9wZQKEIl0lFZY.jpg">نسخه 3</a>]</p><h3>آمپول با آیکون. مسیح، به صلیب کشیده شدن و به آسمان رفتن (فلسطین، بیزانس)</h3><p>آغاز سدهٔ هفتم. <a href="https://www.clevelandart.org/art/1999.46">موزهٔ هنر کلیولند، ایالات متحده</a>. آلیاژ قلع و سرب با اجزای چرمی.</p><img src="https://res.bibleox.com/s/img/image/simple/68caa8cf205184ec278d5884/s_p_QfQLEBTpKbF2IfJo.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68caa8cf205184ec278d5884/m_p_QfQLEBTpKbF2IfJo.jpg">بزرگ‌تر</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68caaaaf205184ec278d5887/m_p_YFRVXxytSNharyj8.jpg">نسخه 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68caaab2205184ec278d5888/m_p_GguW2EcCVatptKzX.jpg">نسخه 3</a>]</p><h3>مادر خدا و شهید بزرگ تئودور استراتلات (سالونیک، بیزانس)</h3><p>سده‌های هفتم–دهم (؟) بازیلیکای سنت دیمیتریوس در سالونیک. موزائیک بر ضلع جنوبی ستون شمالی.</p><img src="https://res.bibleox.com/s/img/image/simple/686985345f47da2505d3ae12/s_p_HWoRkey7yaGM1D4s.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686985345f47da2505d3ae12/m_p_HWoRkey7yaGM1D4s.jpg">بزرگ‌تر</a>]</p><h3>شهید بزرگ دیمیتریوس و کتیتورها: اسقف اعظم و فرماندار (سالونیک، بیزانس)</h3><p>سدهٔ هفتم. بازیلیکای سنت دیمیتریوس در سالونیک. موزائیک.</p><img src="https://res.bibleox.com/s/img/image/simple/686986dc5f47da2505d3ae13/s_p_ZMXi7hFVOfpu7jbC.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686986dc5f47da2505d3ae13/m_p_ZMXi7hFVOfpu7jbC.jpg">بزرگ‌تر</a>]</p><h3>قدیس گئورگیوس (جرج) و کودکان (سالونیک، بیزانس)</h3><p>سدهٔ هفتم. بازیلیکای سنت دیمیتریوس در سالونیک. موزائیک در بخش غربی مذبح قرار دارد.</p><img src="https://res.bibleox.com/s/img/image/simple/686987645f47da2505d3ae14/s_p_boH6uu2omR2Gjxxx.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686987645f47da2505d3ae14/m_p_boH6uu2omR2Gjxxx.jpg">بزرگ‌تر</a>]</p><h3>سنت سرگیوس (سالونیک، بیزانس)</h3><p>سدهٔ هفتم. بازیلیکای سنت دیمیتریوس در سالونیک. موزائیک ستون مذبح.</p><img src="https://res.bibleox.com/s/img/image/simple/686989925f47da2505d3ae15/s_p_Faf5BLFz9WISBGej.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686989925f47da2505d3ae15/m_p_Faf5BLFz9WISBGej.jpg">بزرگ‌تر</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a742205184ec278d6fb4/m_p_YV1I98bvx4Nn6cUn.jpg">نسخه 2</a>]</p><h3>آیکون نبی مقدس داوود (قسطنطنیه، بیزانس)</h3><p>سال‌های ۶۲۹–۶۳۰. <a href="https://www.metmuseum.org/art/collection/search/464380">موزهٔ متروپولیتن در خیابان پنجم، ایالات متحده</a>. نقره. ۲۶٫۶ × ۴ سانتی‌متر، ۱۳۹۷ گرم. نیز ببینید: <a href="https://www.metmuseum.org/art/collection/search/464378">۱</a>، <a href="https://www.metmuseum.org/art/collection/search/464375">۲</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c1c3426594f46d35a87e75/s_p_5U20dlUc30xkfJeN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1c3426594f46d35a87e75/m_p_5U20dlUc30xkfJeN.jpg">بزرگ‌تر</a>]</p><h3>مهر سربی با تصویر قدیس و کتیبه (بیزانس)</h3><p>سدهٔ هفتم. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/270001?page=17&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=840">موزهٔ ارمیتاژ، روسیه</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c2966480b4d285320419/s_p_EY1IyPYdMzjgztlB.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c2966480b4d285320419/m_p_EY1IyPYdMzjgztlB.jpg">بزرگ‌تر</a>]</p><h3>مهر سربی با تصویر نیم‌تنهٔ مسیح و مونوگرام (بیزانس)</h3><p>سدهٔ هفتم. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/231980?page=2&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%B0&amp;index=96">موزهٔ ارمیتاژ، روسیه</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c6076480b4d285320423/s_p_YFjOrZh2fLGJgpYJ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c6076480b4d285320423/m_p_YFjOrZh2fLGJgpYJ.jpg">بزرگ‌تر</a>]</p><h3>مهر سربی با تصویر مسیح و مونوگرام (بیزانس)</h3><p>سدهٔ هفتم. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/172196?page=2&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%B0&amp;index=57">موزهٔ ارمیتاژ، روسیه</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c64d6480b4d285320424/s_p_RQupAUUa4gGtXt2n.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c64d6480b4d285320424/m_p_RQupAUUa4gGtXt2n.jpg">بزرگ‌تر</a>]</p><h2>سدهٔ هشتم</h2><h3>مادر خدا و کودک عیسی (قسطنطنیه، بیزانس)</h3><p>کلیسای حکمت الهی (ایاصوفیا).</p><img src="https://res.bibleox.com/s/img/image/simple/674f31b0dba77200011c73a2/s_p_2AO12RGOQ2yqRiP4.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f31b0dba77200011c73a2/m_p_2AO12RGOQ2yqRiP4.jpg">بزرگ‌تر</a>]</p><h3>فرشتهٔ بزرگ جبرئیل (قسطنطنیه، بیزانس)</h3><p>کلیسای حکمت الهی (ایاصوفیا).</p><img src="https://res.bibleox.com/s/img/image/simple/674f3256dba77200011c73a4/s_p_rfkKZFQ8IYfO6L7V.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f3256dba77200011c73a4/m_p_rfkKZFQ8IYfO6L7V.jpg">بزرگ‌تر</a>]</p><h3>مسیح، مصلوب شدن و رستاخیز (متز، فرانسه)</h3><p>۸۷۰ م. <a href="https://collections.louvre.fr/en/ark:/53355/cl010113244">موزهٔ لوور، فرانسه</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c422e46594f46d35a87f10/s_p_lQNRJIXri6KJoLw3.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c422e46594f46d35a87f10/m_p_lQNRJIXri6KJoLw3.jpg">بزرگ‌تر</a>]</p><h3>مسیح، مصلوب شدن (رنس، فرانسه)</h3><p>۸۷۰–۸۸۰ م. <a href="https://collections.louvre.fr/en/ark:/53355/cl010098469">موزهٔ لوور، فرانسه</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c423bc6594f46d35a87f11/s_p_NOhnffTlgTImIczW.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c423bc6594f46d35a87f11/m_p_NOhnffTlgTImIczW.jpg">بزرگ‌تر</a>]</p><h2>سدهٔ نهم</h2><h3>عروج مسیح (تسالونیکی، بیزانس)</h3><p>سده‌های ۹–۱۰. روتوندای قدیس گئورگیوس (جرج) پیروز (در اصل آرامگاه امپراتور گالریوس). دیوارنگاره [17][18]</p><img src="https://res.bibleox.com/s/img/image/simple/686a934c5f47da2505d3ae20/s_p_klfYhHum7wZvKR9D.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686a934c5f47da2505d3ae20/m_p_klfYhHum7wZvKR9D.jpg">بزرگ‌تر</a>]</p><h3>مسیح، مدالیون برنزی (بیزانس)</h3><p>سده‌های ۹–۱۰. مدالیون به تصاویر دایره‌ای‌شکل گفته می‌شود. <a href="https://www.britishmuseum.org/collection/object/H_1880-0820-9">موزهٔ بریتانیا</a>. قطر: ۳٫۵ سانتی‌متر.</p><p>Circular medallion; bronze; bust of Christ with cruciferous nimbus holding the book of the gospel in his left hand; inscription either side.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5be2d45c75323d28a5e92/s_p_GswK2cGnuxxnLfJr.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5be2d45c75323d28a5e92/m_p_GswK2cGnuxxnLfJr.jpg">بزرگ‌تر</a>]</p><h3>رُقاد (خوابیدگی) مادر خدا (بیزانس)</h3><p>پایان سدهٔ نهم. <a href="https://www.metmuseum.org/art/collection/search/464013">موزهٔ متروپولیتن در خیابان پنجم، آمریکا</a>. ماده: عاج. ۱۸٫۶ × ۱۴٫۸ × ۱٫۱ سانتی‌متر.</p><p>New York. The Metropolitan Museum of Art. "The Glory of Byzantium,". Images of the Koimesis, or the Dormition in the West, show the Virgin lying on a bier, while her soul, represented as a baby, is offered by Christ to attendant angels who will take it to heaven. The apostles, led by Saints Paul and Peter, stand witness.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5c1bf45c75323d28a5e97/s_p_0Hg1bO8KIUVBSWJs.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5c1bf45c75323d28a5e97/m_p_0Hg1bO8KIUVBSWJs.jpg">بزرگ‌تر</a>]</p><h3>مسیح، مادر خدا، یحیای تعمیددهنده، رسولان و دیگر قدیسان (قسطنطنیه)</h3><p>۹۴۰–۹۶۰ م. <a href="https://collections.louvre.fr/en/ark:/53355/cl010112515">موزهٔ لوور، فرانسه</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c424276594f46d35a87f12/s_p_IlqGrJe04Ic0YFWv.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c424276594f46d35a87f12/m_p_IlqGrJe04Ic0YFWv.jpg">بزرگ‌تر</a>]</p><h3>صفحه‌ای با تصویر مسیح و رسولان (ایتالیا)</h3><p>سدهٔ نهم. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/228918?page=4&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%A5%D1%80%D0%B8%D1%81%D1%82%D0%B0&amp;index=194">موزهٔ ارمیتاژ، روسیه</a>. اندازه‌ها: ۱۲٫۲×۱۰٫۵ سانتی‌متر</p><img src="https://res.bibleox.com/s/img/image/simple/6863c54f6480b4d285320421/s_p_aLvOvrKuilB614SS.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c54f6480b4d285320421/m_p_aLvOvrKuilB614SS.jpg">بزرگ‌تر</a>]</p><h2>سدهٔ دهم</h2><h3>مسیح، مادر خدا، یحیای تعمیددهنده (بیزانس)</h3><p>سدهٔ دهم. <a href="https://www.britishmuseum.org/collection/object/H_1923-1205-2">موزهٔ بریتانیا</a>. ماده: عاج. ارتفاع: ۱۵٫۵ سانتی‌متر.</p><p>Panel; ivory; carved with standing figures, Christ with the Virgin Mary and St John, below a pierced canopy; four holes for attachment in the raised border.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5be4045c75323d28a5e95/s_p_qEFeZyh2Gq5Wbvar.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5be4045c75323d28a5e95/m_p_qEFeZyh2Gq5Wbvar.jpg">بزرگ‌تر</a>]</p><h3>مادر خدا و کودک مسیح (قسطنطنیه، بیزانس)</h3><p><a href="tel:950-1025">۹۵۰–۱۰۲۵</a> م. <a href="https://www.clevelandart.org/art/1925.1293">موزهٔ هنر کلیولند، آمریکا</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68caa153205184ec278d5882/s_p_iLLZZkqfsUiACLDC.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68caa153205184ec278d5882/m_p_iLLZZkqfsUiACLDC.jpg">بزرگ‌تر</a>]</p><h3>آویز با تصویر مسیح و مادر خدا (بیزانس)</h3><p>۱۰۰۰–۱۳۰۰ م. <a href="https://www.metmuseum.org/art/collection/search/477247">موزهٔ متروپولیتن در خیابان پنجم، آمریکا</a>. کامئوی کالسدون؛ قاب طلایی با مروارید، زمرد، گارنت، یاقوت کبود و تزیین با ساردونیکس. اندازهٔ کلی: ۷٫۲ × ۵٫۵ × ۱٫۶ سانتی‌متر. کالسدون: ۱ ۱/۲ × ۱ ۱/۴ اینچ (۳٫۸ × ۳٫۲ سانتی‌متر)</p><img src="https://res.bibleox.com/s/img/image/simple/68c1bc1a6594f46d35a87e6d/s_p_VcHt7eFMtZq1I1lY.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1bc1a6594f46d35a87e6d/m_p_VcHt7eFMtZq1I1lY.jpg">بزرگ‌تر</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/68c1bc176594f46d35a87e6c/s_p_LwWdQj6J4ehbmMh9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1bc176594f46d35a87e6c/m_p_LwWdQj6J4ehbmMh9.jpg">بزرگ‌تر</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68c1bc1f6594f46d35a87e6e/m_p_gT2TXueTg5pmDsuZ.jpg">بزرگ‌تر</a>]</p><h3>صلیب با تصویر مسیح (بیزانس)</h3><p>سده‌های ۱۰–۱۱. برنز. ۶٫۶×۴٫۲ سانتی‌متر. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/228297?page=56&amp;query=%D0%BA%D1%80%D0%B5%D1%81%D1%82&amp;sort=112&amp;index=2755">موزهٔ ارمیتاژ، روسیه</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c11f5b6594f46d35a87e2d/s_p_6uw78FFpsxpItSzn.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c11f5b6594f46d35a87e2d/m_p_6uw78FFpsxpItSzn.jpg">بزرگ‌تر</a>]</p><h3>صلیب با تصویر مسیح (بیزانس)</h3><p>سده‌های ۱۰–۱۱. برنز. ۷٫۷×۷ سانتی‌متر. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/482789?page=51&amp;query=%D0%BA%D1%80%D0%B5%D1%81%D1%82&amp;sort=112&amp;index=2501">موزهٔ ارمیتاژ، روسیه</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c11fab6594f46d35a87e2e/s_p_jfgfrZ4X7jcBXG9D.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c11fab6594f46d35a87e2e/m_p_jfgfrZ4X7jcBXG9D.jpg">بزرگ‌تر</a>]</p><h3>صلیب با آیکون‌های قدیسان (خرسونس)</h3><p>سدهٔ دهم. برنز، حکاکی. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/372835?page=5&amp;fundcoll=1420520446__1413747286&amp;index=229">موزهٔ ارمیتاژ، روسیه</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c4191a6594f46d35a87f02/s_p_iFiSEGM9EbRIhhtD.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c4191a6594f46d35a87f02/m_p_iFiSEGM9EbRIhhtD.jpg">بزرگ‌تر</a>]</p><h3>قدیس دیمیتریوس تسالونیکی (بیزانس)</h3><p><a href="tel:950-1000">۹۵۰–۱۰۰۰</a> م. <a href="https://www.metmuseum.org/art/collection/search/465946">موزهٔ متروپولیتن در خیابان پنجم، آمریکا</a>. ماده: عاج. ۱۹٫۷ × ۱۲٫۱ × ۱ سانتی‌متر.</p><p>Standing erect, a spear in his hand and a shield at his side, Saint Demetrios is shown ready to protect the Christian faithful. The name of the popular Byzantine military saint is inscribed in two parts in Greek. Martyred in Thessalonike, the second most important city of the empire in the early centuries of the church, he has long been the patron saint of that metropolis. Images of saints in military dress are rare in Early Byzantine art (they appear on the chalices of the Attarouthi Treasure) but typical of the Middle Byzantine period.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5c38445c75323d28a5e98/s_p_ZeZuXGqxAAyDuPBA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5c38445c75323d28a5e98/m_p_ZeZuXGqxAAyDuPBA.jpg">بزرگ‌تر</a>]</p><h2>سدهٔ یازدهم</h2><h3>صلیب موکب: مسیح، مادر خدا، فرشتگان بزرگ میکائیل و جبرئیل (بیزانس)</h3><p>۱۰۰۰–۱۰۵۰ م. <a href="https://www.metmuseum.org/art/collection/search/466251">موزهٔ متروپولیتن در خیابان پنجم، آمریکا</a>. ۵۹٫۵ × ۴۳ × ۲٫۲ سانتی‌متر.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5e3e645c75323d28a5e9b/s_p_Ft65PrnBUmI6wDAc.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5e3e645c75323d28a5e9b/m_p_Ft65PrnBUmI6wDAc.jpg">بزرگ‌تر</a>]</p><h3>صلیب موکب، مسیح، مادر خدا، یحیای تعمیددهنده (بیزانس)</h3><p>۱۰۵۰ م. <a href="https://www.clevelandart.org/art/1970.36">موزهٔ هنر کلیولند، آمریکا</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68ca921d205184ec278d5871/s_p_PrD5y34JBpT95quf.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68ca921d205184ec278d5871/m_p_PrD5y34JBpT95quf.jpg">بزرگ‌تر</a>]</p><h3>صلیب موکب، قدیس سابا (بیزانس)</h3><p>۱۰۵۰ م. <a href="https://www.metmuseum.org/art/collection/search/697956">موزهٔ متروپولیتن در خیابان پنجم، آمریکا</a>. در مرکز پشت صلیب قدیس سابا و در لبه‌ها دیگر راهبان مقدس تصویر شده‌اند. نقره. ۳۲٫۴ × ۴۴٫۸ × ۵٫۷ سانتی‌متر.</p><img src="https://res.bibleox.com/s/img/image/simple/68c1c6546594f46d35a87e76/s_p_FO8cb8Ec2FqTDFz8.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c1c6546594f46d35a87e76/m_p_FO8cb8Ec2FqTDFz8.jpg">بزرگ‌تر</a>]</p><h3>صلیب موکب، مسیح (خرسونس)</h3><p>سدهٔ یازدهم. ماده: برنز، آهن؛ ریخته‌گری، قلم‌زنی، حکاکی. اندازه: ۳۶٫۵×۲۷٫۵ سانتی‌متر. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/372834?page=3&amp;fundcoll=1420520446__1413747286&amp;index=106">موزهٔ ارمیتاژ، روسیه</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c418616594f46d35a87f01/s_p_ytqdkwIa6FDSikCw.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c418616594f46d35a87f01/m_p_ytqdkwIa6FDSikCw.jpg">بزرگ‌تر</a>]</p><h3>بخشی از آیکون «مسیح پانتوکراتور» (بیزانس، کریمه)</h3><p>۱۰۵۰–۱۱۰۰ م. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/372766?page=40&amp;query=%D0%B8%D0%BA%D0%BE%D0%BD%D0%B0&amp;index=1999">موزهٔ ارمیتاژ، روسیه</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863bfff6480b4d285320412/s_p_XwuOAkY6yR10NT7b.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863bfff6480b4d285320412/m_p_XwuOAkY6yR10NT7b.jpg">بزرگ‌تر</a>]</p><h3>مادر خدا با کودک مسیح (قسطنطنیه)</h3><p>۱۰۰۰–۱۰۱۵ م. <a href="https://collections.louvre.fr/en/ark:/53355/cl010101133">موزهٔ لوور، فرانسه</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c43b8c6594f46d35a87f16/s_p_rQNvoLa9Vu1WmSB2.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c43b8c6594f46d35a87f16/m_p_rQNvoLa9Vu1WmSB2.jpg">بزرگ‌تر</a>]</p><h3>مادر خدا، اورانتا (قسطنطنیه)</h3><p>۱۰۰۰–۱۲۰۰ م. <a href="https://collections.louvre.fr/en/ark:/53355/cl010114443">موزهٔ لوور، فرانسه</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/68c43bcc6594f46d35a87f17/s_p_7a5oJnVWqjfeu67t.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c43bcc6594f46d35a87f17/m_p_7a5oJnVWqjfeu67t.jpg">بزرگ‌تر</a>]</p><h3>مادر خدا، فرشتهٔ بزرگ میکائیل، قدیس تئودور (بیزانس)</h3><p>سده‌های ۱۱–۱۲. <a href="https://www.britishmuseum.org/collection/object/H_1981-0103-1">موزهٔ بریتانیا</a>. ۱۰۸×۹۵ میلی‌متر.</p><p>Relief icon; rectangular bronze plaque cast in low relief with full-length Hodegetria flanked by the Archangel Michael and St Theodore, each wearing a girdled tunic beneath a chlamys with decorated tablion; the figures are identified by intaglio inscriptions; the whole is surrounded by a raised border with a running vine scroll; traces of solder at sides and back.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5be3545c75323d28a5e93/s_p_DFDGZ6kHm0khLKRD.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5be3545c75323d28a5e93/m_p_DFDGZ6kHm0khLKRD.jpg">بزرگ‌تر</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5be3b45c75323d28a5e94/m_p_FfmDAHv29BAMxval.jpg">بزرگ‌تر</a>]</p><h3>آیکون قدیس دیمیتریوس (بیزانس)</h3><p>۱۰۴۰–۱۰۶۰ م. <a href="https://collections.louvre.fr/en/ark:/53355/cl010115478">موزهٔ لوور، فرانسه</a>. ۹٫۴ × ۶٫۳ × ۰٫۶ سانتی‌متر.</p><img src="https://res.bibleox.com/s/img/image/simple/68c3c0c36594f46d35a87ec0/s_p_dj04XPO3pwvzkLzr.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c3c0c36594f46d35a87ec0/m_p_dj04XPO3pwvzkLzr.jpg">بزرگ‌تر</a>]</p><h3>مهر سربی با تصویر قدیس دیمیتریوس و کتیبه (بیزانس)</h3><p>سدهٔ یازدهم. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/269619?page=20&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=958">موزهٔ ارمیتاژ، روسیه</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c2556480b4d285320418/s_p_oqzix7avanFfe61o.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c2556480b4d285320418/m_p_oqzix7avanFfe61o.jpg">بزرگ‌تر</a>]</p><h3>مهر سربی با تصویر نیم‌تنهٔ قدیس (بیزانس)</h3><p>سدهٔ یازدهم. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/267492?page=14&amp;query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=651">موزهٔ ارمیتاژ، روسیه</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c3196480b4d28532041a/s_p_VySwl31Z41rar6d3.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c3196480b4d28532041a/m_p_VySwl31Z41rar6d3.jpg">بزرگ‌تر</a>]</p><h3>مهر آویز با تصویر قدیس (بیزانس)</h3><p>سدهٔ یازدهم. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/483272?query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=21">موزهٔ ارمیتاژ، روسیه</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c4276480b4d28532041d/s_p_5EJuZ18em5TsdUwA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c4276480b4d28532041d/m_p_5EJuZ18em5TsdUwA.jpg">بزرگ‌تر</a>]</p><h3>مهر آویز با تصویر قدیس (بیزانس)</h3><p>سده‌های ۱۱–۱۲. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/483278?query=%D0%B8%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%D0%BC%20%D1%81%D0%B2%D1%8F%D1%82%D0%BE%D0%B3%D0%BE&amp;index=35">موزهٔ ارمیتاژ، روسیه</a>.</p><img src="https://res.bibleox.com/s/img/image/simple/6863c4616480b4d28532041e/s_p_H8LrRkkjwBHlc322.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863c4616480b4d28532041e/m_p_H8LrRkkjwBHlc322.jpg">بزرگ‌تر</a>]</p><h2>سدهٔ دوازدهم</h2><h3>مسیح، مادر خدا، یحیای نبی (قسطنطنیه، بیزانس)</h3><p>کلیسای حکمت الهی (ایاصوفیا). دیوارنگارهٔ کلیسا[5]</p><img src="https://res.bibleox.com/s/img/image/simple/6750078ddba77200011c73af/s_p_EcliI0JFeV1uu1LU.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6750078ddba77200011c73af/m_p_EcliI0JFeV1uu1LU.jpg">بزرگ‌تر</a>]</p><h3>مسیح (قسطنطنیه، بیزانس)</h3><p>کلیسای حکمت الهی (ایاصوفیا).</p><img src="https://res.bibleox.com/s/img/image/simple/674f332ddba77200011c73a6/s_p_1PCMz3Y4EZgbSJL0.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f332ddba77200011c73a6/m_p_1PCMz3Y4EZgbSJL0.jpg">بزرگ‌تر</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686cf10d5f47da2505d3ae4e/s_p_ZHUiumbGoeJMn4GO.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686cf10d5f47da2505d3ae4e/m_p_ZHUiumbGoeJMn4GO.jpg">بزرگ‌تر</a>]</p><h3>مادر خدا (قسطنطنیه، بیزانس)</h3><p>کلیسای حکمت الهی (ایاصوفیا).</p><img src="https://res.bibleox.com/s/img/image/simple/674f3332dba77200011c73a7/s_p_WvZb6UestGwJUzJr.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f3332dba77200011c73a7/m_p_WvZb6UestGwJUzJr.jpg">بزرگ‌تر</a>]</p><h3>یحیای تعمیددهنده، نبی (قسطنطنیه، بیزانس)</h3><p>کلیسای حکمت الهی (ایاصوفیا).</p><img src="https://res.bibleox.com/s/img/image/simple/674f357ddba77200011c73a8/s_p_hdfr9cx0ZPTZyn6N.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f357ddba77200011c73a8/m_p_hdfr9cx0ZPTZyn6N.jpg">بزرگ‌تر</a>]</p><h3>مادر خدا با کودک عیسی (قسطنطنیه)</h3><p>یک‌سوم نخست سدهٔ دوازدهم. آیکون مادر خدای ولادیمیر. چوب، تمپرا.</p><img src="https://res.bibleox.com/s/img/image/simple/674f18e4dba77200011c7399/s_p_0uaArAqVhNX9r0gV.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f18e4dba77200011c7399/m_p_0uaArAqVhNX9r0gV.jpg">بزرگ‌تر</a>]</p><h3>مادر خدا (بیزانس، سوریه، طرطوس)</h3><p>سدهٔ دوازدهم. <a href="https://www.britishmuseum.org/collection/object/H_1889-0511-13">موزهٔ بریتانیا</a>. ماده: عاج، ۴۱×۴۷ میلی‌متر.</p><p>Relief icon; pale grey-green steatite; rounded at the top and square below; bust of the Virgin, her mantle drawn over her head, with St Andrew's cross on it; her hands held in front with palms outwards, inscription either side of her.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5be2645c75323d28a5e91/s_p_StVNlxiOjocLLsz5.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5be2645c75323d28a5e91/m_p_StVNlxiOjocLLsz5.jpg">بزرگ‌تر</a>] [<a href="https://res.bibleox.com/s/img/image/simple/68b5be2245c75323d28a5e90/m_p_yHJ3BkdNwVGdLb4m.jpg">بزرگ‌تر</a>]</p><h3>شهید بزرگ دیمیتریوس تسالونیکی و شماس (تسالونیکی، بیزانس)</h3><p>سدهٔ دوازدهم. موزائیک بر ضلع شرقی ستون جنوبی.</p><img src="https://res.bibleox.com/s/img/image/simple/68698a155f47da2505d3ae16/s_p_n7AgnVLPvfeBX5Qq.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68698a155f47da2505d3ae16/m_p_n7AgnVLPvfeBX5Qq.jpg">بزرگ‌تر</a>]</p><h3>آیکون مادر خدا اودیگیتریا (بیزانس، خرسونس)</h3><p>نیمهٔ دوم سدهٔ دوازدهم. <a href="https://collections.hermitagemuseum.org/entity/OBJECT/372931?page=11&amp;fundcoll=1420520446&amp;index=536">موزهٔ ارمیتاژ، روسیه</a>. ۶٫۸×۵ سانتی‌متر</p><img src="https://res.bibleox.com/s/img/image/simple/6863bf2f6480b4d285320411/s_p_10YV8HIpAzMNCgvp.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6863bf2f6480b4d285320411/m_p_10YV8HIpAzMNCgvp.jpg">بزرگ‌تر</a>]</p><h2>سدهٔ سیزدهم</h2><h3>خداوند پانتوکراتور (آتوس)</h3><p>صومعهٔ خیلاندار، کوه مقدس آتوس.</p><img src="https://res.bibleox.com/s/img/image/simple/69406737205184ec278d6fd8/s_p_hTWcEC5QtmbCrC5t.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69406737205184ec278d6fd8/m_p_hTWcEC5QtmbCrC5t.jpg">بزرگ‌تر</a>]</p><h3>مادر خدا با کودک عیسی (اودیگیتریا، آتوس)</h3><p>صومعهٔ خیلاندار، کوه مقدس آتوس.</p><img src="https://res.bibleox.com/s/img/image/simple/674f0cfadba77200011c7395/s_p_mQMRA7FGLEbqOYIx.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f0cfadba77200011c7395/m_p_mQMRA7FGLEbqOYIx.jpg">بزرگ‌تر</a>]</p><h2>سدهٔ چهاردهم</h2><h3>خداوند پانتوکراتور</h3><p>آیکون‌نگار مانوئل پانسلینوس.</p><img src="https://res.bibleox.com/s/img/image/simple/674f28d1dba77200011c739e/s_p_ma0z14hIFXCiEj7S.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f28d1dba77200011c739e/m_p_ma0z14hIFXCiEj7S.jpg">بزرگ‌تر</a>]</p><h3>مادر خدا (تسالونیکی)</h3><p>۱۳۱۰–۱۳۱۵ م. اورانتا. دیوارنگارهٔ کلیسای قدیس نیکلاس اورفانوس در تسالونیکی، یونان.</p><img src="https://res.bibleox.com/s/img/image/simple/674f29b7dba77200011c739f/s_p_PSuCdQIYdR4IYZgA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f29b7dba77200011c739f/m_p_PSuCdQIYdR4IYZgA.jpg">بزرگ‌تر</a>]</p><h3>ورود مقدس مادر خدا به معبد (قسطنطنیه)</h3><p>حدود ۱۳۱۶–۱۳۲۱ م. کاریه جامی، صومعهٔ خورا، استانبول (قسطنطنیه)، ترکیه.</p><img src="https://res.bibleox.com/s/img/image/simple/675343bddba7720001cd0ddf/s_p_AtF4vpmhv6FneUfA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/675343bddba7720001cd0ddf/m_p_AtF4vpmhv6FneUfA.jpg">بزرگ‌تر</a>]</p><h2>سدهٔ پانزدهم</h2><h3>رسول پولس (روس)</h3><p>دههٔ ۱۴۱۰. اثر: راهب مقدس آندری روبلف. گالری دولتی ترتیاکوف، مسکو، روسیه.</p><img src="https://res.bibleox.com/s/img/image/simple/6909fbca205184ec278d6e6a/s_p_ok25vNdlaQMM5P3c.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6909fbca205184ec278d6e6a/m_p_ok25vNdlaQMM5P3c.jpg">بزرگ‌تر</a>]</p><h2>مجموعه‌های آیکون</h2><ol><li><p>مجموعه‌ای با شمایل‌نگاری دخمه‌ها، فایل Word: <a href="https://disk.yandex.ru/d/mHc8dxUdHGqMEQ">پیوند</a></p></li><li><p>آثار آیکون‌نگار مانوئل پانسلینوس (سده‌های ۱۳–۱۴): <a href="https://vk.com/album-20034910_224123875">https://vk.com/album-20034910_224123875</a></p></li></ol>
