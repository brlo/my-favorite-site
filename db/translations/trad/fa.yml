      <h2>سدهٔ دوم</h2><h3><a href="https://ru.wikipedia.org/wiki/%D0%9F%D0%B0%D0%BF%D0%B8%D1%80%D1%83%D1%81_52">پاپیروس ۵۲</a> — یوح ۱۸:۳۱-۳۳,۳۷-۳۸ (~۱۵۰)</h3><img src="https://res.bibleox.com/s/img/image/simple/67c76e30dba7720001a4ab31/s_p_k5TLeFzzlkF84GaN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/67c76e30dba7720001a4ab31/m_p_k5TLeFzzlkF84GaN.jpg">بزرگ‌تر</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/67c77746dba7720001a4ab32/s_p_redMnT8D34cxZOYL.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/67c77746dba7720001a4ab32/m_p_redMnT8D34cxZOYL.jpg">بزرگ‌تر</a>]</p><h3><a href="https://en.wikipedia.org/wiki/Papyrus_90">پاپیروس ۹۰</a> — یوح ۱۸:۳۶-۴۰؛ یوح ۱۹:۱-۷ (~۱۵۰)</h3><img src="https://res.bibleox.com/s/img/image/simple/67c7784edba7720001a4ab33/s_p_H1o3KGBYNI9sl2F9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/67c7784edba7720001a4ab33/m_p_H1o3KGBYNI9sl2F9.jpg">بزرگ‌تر</a>]</p><h3><a href="https://en.wikipedia.org/wiki/Papyrus_104">پاپیروس ۱۰۴</a> — متی ۲۱:۳۴-۳۷؛ متی ۲۱:۴۳-۴۴ (~۱۵۰)</h3><img src="https://res.bibleox.com/s/img/image/simple/67c778a6dba7720001a4ab34/s_p_J8MmDkwHjJgq0wEA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/67c778a6dba7720001a4ab34/m_p_J8MmDkwHjJgq0wEA.jpg">بزرگ‌تر</a>]</p><h3><a href="https://en.wikipedia.org/wiki/Papyrus_98">پاپیروس ۹۸</a> — مکا ۱:۱۳-۲۰؛ مکا ۲:۱ (~۱۵۰-۲۵۰)</h3><img src="https://res.bibleox.com/s/img/image/simple/67c779a2dba7720001a4ab35/s_p_rPG5aCVLBBw75jo3.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/67c779a2dba7720001a4ab35/m_p_rPG5aCVLBBw75jo3.jpg">بزرگ‌تر</a>]</p><h2>سدهٔ سوم</h2><h3><a href="https://en.wikipedia.org/wiki/Papyrus_75">پاپیروس ۷۵</a> — لوق ۳:۱۸؛ یوح ۱:۱ (۱۷۵-۲۲۵)</h3><img src="https://res.bibleox.com/s/img/image/simple/67c77d00dba7720001a4ab3a/s_p_9dXrKwGPywze2DAo.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/67c77d00dba7720001a4ab3a/m_p_9dXrKwGPywze2DAo.jpg">بزرگ‌تر</a>]</p><h3><a href="https://en.wikipedia.org/wiki/Papyrus_46">پاپیروس ۴۶</a> — روم، عبرانیان، اول قرنتیان، دوم قرنتیان، افسسیان، غلاطیان، فیلیپیان، کولسیان، اول تسالونیکیان (~۱۷۵-۲۲۵)</h3><img src="https://res.bibleox.com/s/img/image/simple/6915b056205184ec278d6e7f/s_p_lPe15bGd8VVR6y2H.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6915b056205184ec278d6e7f/m_p_lPe15bGd8VVR6y2H.jpg">بزرگ‌تر</a>]</p><ul><li><p>روم ۱:۱۵:۱۷</p></li><li><p>روم ۵:۱۷ – ۶:۱۴</p></li><li><p>روم ۶:۱۴ – ۸:۱۵</p></li><li><p>روم ۸:۱۵ – ۱۱:۳۵</p></li><li><p>روم ۱۱:۳۵ – ۱۴:۸</p></li><li><p>روم ۱۴:۹ – ۱۵:۱۱</p></li><li><p>روم ۱۵:۱۱ — عبرانیان ۸:۸</p></li><li><p>عبرانیان ۸:۹ – ۹:۱۰</p></li><li><p>عبرانیان ۹:۱۰ – ۲۶</p></li><li><p>عبرانیان ۹:۲۶ – اول قرنتیان ۲:۳</p></li><li><p>اول قرنتیان ۲:۳ – ۳:۵</p></li><li><p>اول قرنتیان ۳:۶ – دوم قرنتیان ۹:۷</p></li><li><p>دوم قرنتیان ۹:۷ – تا پایان، افسسیان، غلاطیان ۱:۱ – ۶:۱۰</p></li><li><p>غلاطیان ۶:۱۰ — پایان، فیلیپیان، کولسیان، اول تسالونیکیان ۱:۱ – ۲:۳</p></li><li><p>اول تسالونیکیان ۲:۳–۵:۵</p></li><li><p>اول تسالونیکیان ۵:۵، ۲۳–۲۸</p></li><li><p>همچنین، احتمالاً: اول تسالونیکیان ۵:۲۸ – دوم تسالونیکیان و فلیمون</p></li></ul><h3><a href="https://en.wikipedia.org/wiki/Papyrus_32">پاپیروس ۳۲</a> — طیت ۱:۱۱-۱۵؛ طیت ۲:۳-۸ (~۲۰۰)</h3><img src="https://res.bibleox.com/s/img/image/simple/67c77f82dba7720001a4ab3c/s_p_37FYUloO3Px16M3p.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/67c77f82dba7720001a4ab3c/m_p_37FYUloO3Px16M3p.jpg">بزرگ‌تر</a>]</p><h3><a href="https://en.wikipedia.org/wiki/Papyrus_4">پاپیروس ۴</a> — لوق ۱:۵۸-۵۹؛ ۱:۶۲-۲:۱؛ ۲:۶-۷؛ ۳:۸-۴:۲؛ ۴:۲۹-۳۲، ۳۴-۳۵؛ ۵:۳-۸؛ ۵:۳۰-۶:۱۶ (۱۷۵-۲۵۰)</h3><img src="https://res.bibleox.com/s/img/image/simple/67c77ec9dba7720001a4ab3b/s_p_EOPj5ySHUxKuZhzv.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/67c77ec9dba7720001a4ab3b/m_p_EOPj5ySHUxKuZhzv.jpg">بزرگ‌تر</a>]</p><h3><a href="https://en.wikipedia.org/wiki/Papyrus_16">پاپیروس ۱۶</a> — فیل ۳:۱۰-۱۷؛ فیل ۴:۲-۸ (سدهٔ سوم)</h3><img src="https://res.bibleox.com/s/img/image/simple/67c77a33dba7720001a4ab36/s_p_ee63gtSd7dJORxL9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/67c77a33dba7720001a4ab36/m_p_ee63gtSd7dJORxL9.jpg">بزرگ‌تر</a>]</p><h3><a href="https://en.wikipedia.org/wiki/Papyrus_72">پاپیروس ۷۲</a> — <a class="mw-redirect" href="https://ru.wikipedia.org/wiki/1-%D0%B5_%D0%BF%D0%BE%D1%81%D0%BB%D0%B0%D0%BD%D0%B8%D0%B5_%D0%9F%D0%B5%D1%82%D1%80%D0%B0">اول پطرس</a>، <a class="mw-redirect" href="https://ru.wikipedia.org/wiki/2-%D0%B5_%D0%BF%D0%BE%D1%81%D0%BB%D0%B0%D0%BD%D0%B8%D0%B5_%D0%9F%D0%B5%D1%82%D1%80%D0%B0">دوم پطرس</a>، <a href="https://ru.wikipedia.org/wiki/%D0%9F%D0%BE%D1%81%D0%BB%D0%B0%D0%BD%D0%B8%D0%B5_%D0%98%D1%83%D0%B4%D1%8B">یهودا</a> (سده‌های سوم و چهارم)</h3><img src="https://res.bibleox.com/s/img/image/simple/67c77afddba7720001a4ab37/s_p_JCufSqhlLauLH7qF.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/67c77afddba7720001a4ab37/m_p_JCufSqhlLauLH7qF.jpg">بزرگ‌تر</a>]</p><h3><a href="https://en.wikipedia.org/wiki/Papyrus_78">پاپیروس ۷۸</a> — یهود ۱:۴-۵,۷-۸ (سده‌های سوم و چهارم)</h3><img src="https://res.bibleox.com/s/img/image/simple/67c77be8dba7720001a4ab38/s_p_8xpMewUexRgW9gyK.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/67c77be8dba7720001a4ab38/m_p_8xpMewUexRgW9gyK.jpg">بزرگ‌تر</a>]</p><h2>سدهٔ چهارم</h2><h3>نسخهٔ سینا (میانهٔ سدهٔ چهارم)</h3><p><a href="https://codexsinaiticus.org/en/manuscript.aspx">https://codexsinaiticus.org/en/manuscript.aspx</a></p><img src="https://res.bibleox.com/s/img/image/simple/69037c86205184ec278d6e4f/s_p_k8XUyHVBOuyRjeGi.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69037c86205184ec278d6e4f/m_p_k8XUyHVBOuyRjeGi.jpg">بزرگ‌تر</a>]</p><h3>نسخهٔ واتیکان (میانهٔ سدهٔ چهارم، اما احتمالاً پس از سال ۳۶۷)</h3><p><a href="https://archive.org/details/CodexAlexandrinus/Codex-Vaticanus-NT/mode/2up">https://archive.org/details/CodexAlexandrinus/Codex-Vaticanus-NT/mode/2up</a></p><p><a href="https://digi.vatlib.it/view/MSS_Vat.gr.1209">https://digi.vatlib.it/view/MSS_Vat.gr.1209</a></p><img src="https://res.bibleox.com/s/img/image/simple/69037c61205184ec278d6e4e/s_p_mNcBEIlZjg4rJctE.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69037c61205184ec278d6e4e/m_p_mNcBEIlZjg4rJctE.jpg">بزرگ‌تر</a>]</p><h2>سدهٔ پنجم</h2><h3>نسخهٔ اسکندریه (نیمهٔ اول سدهٔ پنجم)</h3><p><a href="https://archive.org/details/CodexAlexandrinus/Codex%20Alexandrinus">https://archive.org/details/CodexAlexandrinus/Codex%20Alexandrinus</a></p><img src="https://res.bibleox.com/s/img/image/simple/69037c31205184ec278d6e4d/s_p_nvIvhbabbnHZELvW.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69037c31205184ec278d6e4d/m_p_nvIvhbabbnHZELvW.jpg">بزرگ‌تر</a>]</p>
