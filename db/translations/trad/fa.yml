      </ol><p>ترجمه: رودیون ولاسوف با کمک هوش مصنوعی. متن پایه: اصل روسی. نقل‌قول‌های کتاب مقدس: ترجمه از متن روسی (سینودی)؛ چون هنوز ترجمهٔ کتاب مقدس به فارسی در سایت نیست، ارجاع‌ها بدون پیوند داده شده‌اند.</p>
