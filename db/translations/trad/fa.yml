    path: Lc4k_آشپزی_روزه
    title: "آشپزی روزه‌داری"
    body: |-
      <p>در این مقاله تنها به‌کوتاهی شیوهٔ تغذیهٔ روزه‌داری ترسیم می‌شود تا به کسی کمک شود که پیش‌تر روزه نگرفته و به پختن غذای روزه‌داری عادت ندارد و نمی‌داند در روزه چه می‌تواند بپزد.</p><blockquote><p>«عیسی در پاسخ به او گفت: مارتا! مارتا! تو برای چیزهای بسیار نگران و مضطربی، ولی فقط یک چیز لازم است؛ مریم سهم نیکو را برگزیده است و آن از او گرفته نخواهد شد» (لوق ۱۰:۴۱-۴۲)</p></blockquote><blockquote><p>«مراقب خود باشید مبادا دل‌های شما از پرخوری و مستی و نگرانی‌های زندگی سنگین شود و آن روز ناگهان شما را فراگیرد» (لوق ۲۱:۳۴)</p></blockquote><h2>سوپ‌ها</h2><h3>سوپ‌های بر پایهٔ آبِ پخت (عصارهٔ) سبزیجات (پیاز و هویج سرخ‌شده)</h3><p>تقریباً همه‌جا افزودن سیب‌زمینی مناسب خواهد بود:</p><ul><li><p><strong>سوپ‌های غله‌ای</strong> (گندم سیاه، برنج، جو مرواریدی، عدس، نخود فرنگی)،</p></li><li><p><strong>سوپ‌های ماکارونی</strong>،</p></li><li><p><strong>سوپ‌های سبزیجات</strong>،</p></li><li><p><strong>بورش</strong>،</p></li><li><p><strong>راسولنیک</strong> (با خیارشور)،</p></li><li><p><strong>شچی</strong>،</p></li><li><p><strong>اوخا</strong> (سوپ ماهی، آنگاه که آیین کلیسایی ماهی را اجازه می‌دهد).</p></li></ul><h2>غذاهای جانبی</h2><ul><li><p><strong>بلغور جو دوسر</strong> (پرک)،</p></li><li><p><strong>آب‌پز</strong>: برنج، گندم سیاه، عدس، کوسکوس، بلغور گندم، کینوا، پولنتا (فرنی از آرد ذرت) و دیگر غلات. افزودن تفت‌دادهٔ پیاز+هویج مناسب است.</p></li><li><p><strong>پلو</strong> (برای سیری می‌توان نخود افزود)،</p></li><li><p><strong>ترکیب‌ها با برنج آب‌پز</strong>: هاوایی، مکزیکی و غیره.</p></li><li><p><strong>ماکارونی</strong>: آب‌پز، از پیش تفت‌داده، ماکارونی با قارچ، با افزودن کنسرو ماهی (تن، ساردین و غیره، آنگاه که آیین کلیسایی اجازه می‌دهد)</p></li><li><p><strong>سیب‌زمینی</strong>: سرخ‌شده، تنوری، آب‌پز، پوره،</p></li><li><p><strong>کلم خورش‌شده</strong>،</p></li><li><p><strong>خورش سبزیجات</strong>: سیب‌زمینی، هویج، پیاز، کدو، فلفل دلمه‌ای، قارچ، رب گوجه‌فرنگی یا گوجه‌فرنگی، بادمجان،</p></li><li><p><strong>سبزیجات آب‌پز</strong> (گل‌کلم، کلم بروکلی، نخود فرنگی سبز، ذرت)،</p></li><li><p><strong>وارنیکی</strong>: با سیب‌زمینی، قارچ، گیلاس،</p></li><li><p><strong>توفو</strong>،</p></li><li><p><strong>نخود با سبزیجات</strong>،</p></li><li><p><strong>قارچ‌ها</strong> سرخ‌شده،</p></li><li><p><strong>کدوها</strong> سرخ‌شده،</p></li><li><p><strong>درانیکی</strong> (سیب‌زمینی یا کدوی رنده‌شده، آرد برنج یا گندم، نمک)،</p></li><li><p><strong>راتاتویی</strong>،</p></li><li><p><strong>کدو تنبل پخته در فر</strong>،</p></li><li><p><strong>سبزیجات گریل</strong>،</p></li><li><p><strong>کتلت سبزیجات</strong> (از لوبیا).</p></li></ul><h2>سالادها</h2><ul><li><p><strong>از سبزیجات تازه</strong>: خیار، گوجه‌فرنگی، کلم جوان، پیاز قرمز، کاهو، فلفل دلمه‌ای، سبزی، ادویه،</p></li><li><p><strong>از سبزیجات آب‌پز</strong>: وینگرت (سیب‌زمینی، چغندر، هویج، لوبیا، نخود فرنگی کنسروی، خیارشور، پیاز، کلم ترش)،</p></li><li><p><strong>سالاد کلم چینی</strong>: کلم چینی، ذرت، سس مایونز روزه‌داری[1]،</p></li><li><p><strong>چغندر آب‌پز</strong> با سس مایونز روزه‌داری[1]،</p></li><li><p><strong>سالاد میوه</strong>،</p></li><li><p><strong>سالاد آووکادو</strong>،</p></li></ul><h2>ترشی‌ها</h2><ul><li><p><strong>کلم ترش</strong>،</p></li><li><p><strong>خیارها</strong> شور، کم‌شور، له‌شده،</p></li><li><p><strong>هویج</strong> به سبک کره‌ای،</p></li><li><p><strong>پیاز</strong> ترشی‌شده در سرکه،</p></li><li><p>و غیره.</p></li></ul><h2>فرآورده‌های آردی</h2><ul><li><p><strong>نان</strong>،</p></li><li><p><strong>نان‌های روزه‌داری</strong>: می‌توان در فر پخت، در ماهیتابه، یا از فروشگاه خرید.</p></li><li><p><strong>پیراشکی با مواد درونی</strong>: با گیلاس، کلم خورش‌شده، سیب‌زمینی و پیاز،</p></li><li><p><strong>پنکیک‌های روزه‌داری</strong> (آب به‌جای شیر، موز به‌جای تخم‌مرغ)،</p></li></ul><h2>کنسروها</h2><ul><li><p><strong>خاویار</strong> <strong>کدویی</strong>،</p></li><li><p><strong>خاویار</strong> <strong>بادمجانی</strong>،</p></li><li><p><strong>حمص</strong>،</p></li><li><p><strong>ذرت</strong>،</p></li><li><p><strong>قارچ</strong>،</p></li><li><p><strong>لوبیا</strong>،</p></li><li><p><strong>نخود فرنگی سبز</strong>،</p></li><li><p><strong>گوجه‌فرنگی خشک‌شده</strong>،</p></li><li><p><strong>گواکاموله</strong> بدون پنیر،</p></li></ul><h2>میوه‌های خشک</h2><ul><li><p><strong>مغزها</strong>،</p></li><li><p><strong>توت‌ها و میوه‌های</strong> خشک یا سوبلیمه‌شده،</p></li><li><p><strong>حلوا</strong>،</p></li></ul><h2>ساندویچ‌ها و پیش‌غذاها</h2><ul><li><p>ساندویچ با عسل.</p></li><li><p>ساندویچ با گوجه‌فرنگی، ریحان و نمک</p></li></ul><h2>نوشیدنی‌ها</h2><ul><li><p>کواس</p></li><li><p>کیسل</p></li><li><p>کمپوت (از توت‌های تازه یا میوه‌های خشک)</p></li><li><p>مورس</p></li><li><p>اسموتی</p></li><li><p>لیموناد</p></li><li><p>چای</p></li><li><p>قهوه بدون شیر</p></li><li><p>آب</p></li></ul>
    references: |-
      <ol><li><p><strong>سس مایونز روزه‌داری</strong>: مایع کنسرو نخود فرنگی، روغن گیاهی، خردل، نمک، شکر، سرکه. با مخلوط‌کن یکدست کنید.</p></li></ol><p>ترجمه: رودیون ولاسوف با کمک هوش مصنوعی. متن پایه: اصل روسی. نقل‌قول‌های کتاب مقدس: ترجمه از متن روسی (سینودی)؛ چون هنوز ترجمهٔ کتاب مقدس به فارسی در سایت نیست، ارجاع‌ها بدون پیوند داده شده‌اند.</p>
