  - src: древние-иконы
    path: Ik1c_مجموعه_آیکون_های_کهن
    title: "مجموعهٔ آیکون‌های کهن"
    title_sub: "آیکون‌های مسیحی کهن با تصویر مسیح، مادر خدا، رسولان و دیگر مقدسان"
    body: |-
      <h2>~سدهٔ ۱۵ پیش از میلاد</h2><h3>خیمهٔ اجتماع</h3><p>بر پردهٔ میان معبد (میان قدس و قدس‌الاقداس) کروبیان تصویر شده‌اند (خرو ۲۶:۳۱)، و نیز بر پوشش‌ها (دیوارهای) گرداگرد (خرو ۲۶:۱؛ خرو ۳۶:۸)، که نویسندهٔ نقش آن‌ها را نکشیده است. خیمه تصویری (آیکونی) از واقعیت آسمانی است (خرو ۲۵:۸-۹,۴۰؛ عبر ۹:۲۴؛ اعمال ۷:۴۴). خداوند فرمان داد که معبد را گرامی بدارند (لاو ۱۹:۳۰؛ لاو ۲۶:۲).</p><img src="https://res.bibleox.com/s/img/image/simple/471/s_p_P2j4gLJt9iKSnkge.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/471/m_p_P2j4gLJt9iKSnkge.jpg">بزرگ‌تر</a>] [<a href="https://res.bibleox.com/s/img/image/simple/472/m_p_bNPh6hCNJDhzahar.jpg">نمای بیرونی</a>]</p><h3>تابوت عهد</h3><p>بر تابوت دو فرشتهٔ کروبی تصویر شده بود (<a href="https://bibleox.com/ru/ru/w/%D0%BA%D0%BE%D0%B2%D1%87%D0%B5%D0%B3_%D0%B7%D0%B0%D0%B2%D0%B5%D1%82%D0%B0/">ارجاع‌های کتاب مقدس (به روسی)</a>). یوشع بن نون نبی در برابر تابوت عهد سجده کرد (یوش ۷:۶).</p><img src="https://res.bibleox.com/s/img/image/simple/469/s_p_DUn5vqnI4F8yRiNA.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/469/m_p_DUn5vqnI4F8yRiNA.jpg">بزرگ‌تر</a>]</p><h3>اردوگاه اسرائیل</h3><p>اسرائیل به شکل صلیب جابه‌جا می‌شد (<a href="https://bibleox.com/ru/ru/w/%D0%B5%D0%B2%D1%80%D0%B5%D0%B9%D1%81%D0%BA%D0%B8%D0%B9-%D1%81%D1%82%D0%B0%D0%BD-%D0%BA%D1%80%D0%B5%D1%81%D1%82/">ارجاع‌های کتاب مقدس (به روسی)</a>).</p><img src="https://res.bibleox.com/s/img/image/simple/470/s_p_t8tRbbwlzsBzyVzk.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/470/m_p_t8tRbbwlzsBzyVzk.jpg">بزرگ‌تر</a>]</p><h2>~سدهٔ ۱۰ پیش از میلاد</h2><h3>معبد اورشلیم که سلیمان آن را ساخت</h3><p>نقش‌های کنده‌شدهٔ کروبیان بر دیوارهای معبد (۱پاد ۶:۳۲)، بر درِ ورودی (۱پاد ۶:۳۲؛ (۱پاد ۶:۳۵) و بر پردهٔ پیش از ورود به قدس‌الاقداس (۲توا ۳:۱۴؛ ۱مک ۱:۲۲) بود. در قدس‌الاقداس دو پیکرهٔ بزرگ چوبی زراندود از کروبیان قرار داشت (۱پاد ۶:۲۳). بر سرپوش تابوت عهد دو پیکرهٔ کروبی ساخته شده بود (خرو ۲۵:۱۸-۲۰). در حیاط معبد، بر پایه‌های بزرگ حوض‌های شست‌وشو، شیران، گاوان و کروبیان تصویر شده بودند (۱پاد ۷:۲۸-۲۹). (<a href="https://bibleox.com/ru/ru/w/%D0%B8%D0%B5%D1%80%D1%83%D1%81%D0%B0%D0%BB%D0%B8%D0%BC%D1%81%D0%BA%D0%B8%D0%B9-%D1%85%D1%80%D0%B0%D0%BC/">بیشتر (به روسی)</a>).</p><p>داوود نبی در برابر معبد سجده کرد (مز ۵:۷؛ مز ۹۸:۵؛ مز ۱۳۱:۷) و با این تصویر به خداوند حرمت نهاد.</p><img src="https://res.bibleox.com/s/img/image/simple/468/s_p_lv7GzNtM53C4Zqgr.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/468/m_p_lv7GzNtM53C4Zqgr.jpg">بزرگ‌تر</a>]</p><h2>سدهٔ دوم</h2><h3>مادر خدا با کودک عیسی، و پیامبری که به ستاره اشاره می‌کند (روم)</h3><p>سدهٔ ۲ تا آغاز سدهٔ ۳. دخمه‌های پریسیلا[6]. این کهن‌ترین تصویر مریم مقدس است. کسی که در کنار مادر خدا ایستاده، شاید کتابی در دست چپ دارد و با انگشت دست راستش به ستاره اشاره می‌کند.</p><img src="https://res.bibleox.com/s/img/image/simple/6751b012dba7720001514f69/s_p_jNTGMwic6Cse9xDG.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6751b012dba7720001514f69/m_p_jNTGMwic6Cse9xDG.jpg">بزرگ‌تر</a>] [<a href="https://res.bibleox.com/s/img/image/simple/67618740dba7720001cd0e2c/m_p_ckKuGWqzHuN1tR5Q.jpg">نسخه 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686cf0535f47da2505d3ae4d/m_p_dajA4xvStk0EnnSq.jpg">نسخه 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686cf7725f47da2505d3ae50/m_p_n79yEKK4QSCeorx3.jpg">نسخه 4</a>] [<a href="https://res.bibleox.com/s/img/image/simple/442/m_p_5zQEQbMmBkEs9J2S.jpg">نسخه 5</a>]</p><p>کسی که در کنار مادر خدا ایستاده، می‌تواند اشعیای نبی باشد که این پیش‌گویی را گفت:</p><blockquote><p>«پس خود خداوند به شما نشانه‌ای خواهد داد: اینک <strong>باکره آبستن می‌شود و پسری می‌زاید</strong>، و نام او را عمانوئیل خواهند خواند» (اشع ۷:۱۴)</p></blockquote><p>یا شاید بلعام باشد:</p><blockquote><p>«او را می‌بینم، اما هنوز نه؛ به او می‌نگرم، اما نه از نزدیک. <strong>ستاره‌ای از یعقوب برمی‌آید</strong> و عصایی از اسرائیل قیام می‌کند، و امیران موآب را می‌شکند و همهٔ فرزندان شیث را درهم می‌کوبد» (اعد ۲۴:۱۷)</p></blockquote><p>یا شاید نقاش به‌جای کتیبهٔ توضیحی فقط از این شیوه بهره گرفته است. او ما را فرا می‌خواند تا کتاب را برگیریم، پیش‌گویی دربارهٔ ستارهٔ برآینده را بخوانیم و دریابیم که او زایش کسی را تصویر کرده است که این پیش‌گویی از او سخن می‌گوید، یعنی زایش نجات‌دهنده از باکره.</p><h3>مسیح در سیمای شبان نیکو</h3><p>پایان سدهٔ ۲. روم. دخمه‌های کالیستوس (<a href="https://en.wikipedia.org/wiki/Catacomb_of_Callixtus#Paintings">Callixitus Catacomb, Crypt of Lucina</a>).</p><img src="https://res.bibleox.com/s/img/image/simple/473/s_p_mrIYHR2oqLQuPn0z.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/473/m_p_mrIYHR2oqLQuPn0z.jpg">بزرگ‌تر</a>]</p><h2>سدهٔ ۳</h2><h3>مادر خدا «اورانتا» (روم)</h3><p>Catacomba Maggiore, Roma[26][27]. در پیش‌زمینه، مریم مقدس و نوزاد مسیح تصویر شده‌اند.</p><img src="https://res.bibleox.com/s/img/image/simple/6751fe6ddba7720001514f7e/s_p_C1Iw2V4OhNy1SGOE.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6751fe6ddba7720001514f7e/m_p_C1Iw2V4OhNy1SGOE.jpg">بزرگ‌تر</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686cefb35f47da2505d3ae4c/m_p_70zYu2r0np0WFNUu.jpg">نسخه 2</a>]</p><h3>مسیح، رسولان، شهیدان گورگونیوس، پطرس، مارسلینوس و تیبورتیوس (روم)</h3><p>دخمه‌های پطرس و مارسلینوس</p><img src="https://res.bibleox.com/s/img/image/simple/6752012adba7720001514f82/s_p_x5I0ahjwMz1X5LoJ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6752012adba7720001514f82/m_p_x5I0ahjwMz1X5LoJ.jpg">بزرگ‌تر</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686d237a5f47da2505d3ae56/m_p_ST9me27UGtWHYDBc.jpg">نسخه 2</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/676082a6dba7720001cd0e22/s_p_YjPD3PzLDCF4wgh1.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/676082a6dba7720001cd0e22/m_p_YjPD3PzLDCF4wgh1.jpg">بزرگ‌تر</a>]</p><h3>زنی به شبان نیکو نیایش می‌کند (روم)</h3><p>سدهٔ ۳. دخمه‌های پریسیلا[6].</p><p>تصویرها یک ترکیب‌بندی می‌سازند. نقاش تصویرها را چنان چیده است که نیایش‌گرانِ گرداگرد به بالای اتاق می‌نگرند و دست‌ها را به آن سو برمی‌دارند، جایی که مسیح در سیمای <strong>شبان نیکو</strong> تصویر شده است (یوح ۱۰:۱۱). همهٔ صحنه‌های پیرامون شبان نیکو را یک موضوع به هم می‌پیوندد — <strong>نجات از مرگ</strong>.</p><img src="https://res.bibleox.com/s/img/image/simple/686bea5b5f47da2505d3ae31/s_p_pjRHeoFaUpKPoyEH.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686bea5b5f47da2505d3ae31/m_p_pjRHeoFaUpKPoyEH.jpg">بزرگ‌تر</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686cf7375f47da2505d3ae4f/m_p_MOsOWI2vEXUj5ELf.jpg">نسخه 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6904b3f2205184ec278d6e53/m_p_0GRveVCOh2GBz7eq.jpg">نسخه 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/431/m_p_LUZsrJtesEWiwHBO.jpg">نسخه 4</a>]</p><p>شبان نیکو — مسیح (لوقا ۱۵:۶-۷؛ یوحنا ۱۰:۱-۲۱؛ مزامیر ۲۳).</p><img src="https://res.bibleox.com/s/img/image/simple/69319f74205184ec278d6fa7/s_p_GR8gHxKZuC87xqlf.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69319f74205184ec278d6fa7/m_p_GR8gHxKZuC87xqlf.jpg">بزرگ‌تر</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686d2ac55f47da2505d3ae59/m_p_JDvtNt9RJrqnAsEW.jpg">نسخه 2</a>]</p><p>زنی با سر پوشیده با دست‌های برافراشته به بالا نیایش می‌کند (احتمالاً ساره: پیدایش ۱۸:۱-۱۵ و پیدایش ۲۱:۱-۷).</p><img src="https://res.bibleox.com/s/img/image/simple/686bea885f47da2505d3ae32/s_p_79wnuevuFIi3tnrH.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686bea885f47da2505d3ae32/m_p_79wnuevuFIi3tnrH.jpg">بزرگ‌تر</a>]</p><p>در سمت راست، صحنه‌ای از عهد عتیق: سه جوان (<a href="https://en.wikipedia.org/wiki/Catacomb_of_Priscilla#/media/File:Shadrach,_Meshach,_and_Abednego_in_the_fiery_furnace,_from_the_book_Die_Malereien_der_Katakomben_Roms,_plate_78,_levels_adjusted.jpg">سدرک، میساک و عبدنغو</a>) با دست‌های برافراشته به بالا نیایش می‌کنند (دانیال ۳:۱-۹۰).</p><img src="https://res.bibleox.com/s/img/image/simple/686cfc565f47da2505d3ae52/s_p_NmZJuoF70d9qohZs.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686cfc565f47da2505d3ae52/m_p_NmZJuoF70d9qohZs.jpg">بزرگ‌تر</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686cfc475f47da2505d3ae51/m_p_qzHB83d52LoU7QQL.jpg">نسخه 2</a>]</p><p>در سمت چپ، صحنه‌ای از عهد عتیق: ابراهیم و اسحاق با هیزم برای قربانی (پیدایش ۲۲:۱-۱۹).</p><img src="https://res.bibleox.com/s/img/image/simple/686d33c45f47da2505d3ae5a/s_p_QQLn5T52hx8gSrBf.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d33c45f47da2505d3ae5a/m_p_QQLn5T52hx8gSrBf.jpg">بزرگ‌تر</a>]</p><p>بالای درِ ورودی، یونس نبی تصویر شده است که جانوری دریایی او را می‌بلعد (یونس ۲:۱).</p><img src="https://res.bibleox.com/s/img/image/simple/476/s_p_aHV4YSuoWhVZ1H5y.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/476/m_p_aHV4YSuoWhVZ1H5y.jpg">بزرگ‌تر</a>]</p><p>شایسته است صحنهٔ زندگی زن نیایش‌گر در بخش جلویی اتاق را با تفصیل بیشتری توصیف کنیم.</p><img src="https://res.bibleox.com/s/img/image/simple/686d36265f47da2505d3ae5d/s_p_MGpxKQ94pikRfgFK.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d36265f47da2505d3ae5d/m_p_MGpxKQ94pikRfgFK.jpg">بزرگ‌تر</a>]</p><p><strong>رویدادهای صحنهٔ روبه‌رو</strong></p><p>هر بخش از ترکیب‌بندی اتاق یک صحنه را تصویر می‌کند. همهٔ صحنه‌ها اجزای مهم مضمون مسیحی‌اند. در بالا صحنهٔ شبان نیکو، در سمت چپ صحنهٔ ابراهیم، در سمت راست صحنهٔ سه جوان، و در راهرو صحنهٔ یونس نبی قرار دارد. در این ارتباط می‌توان گمان کرد که نقاش از این قاعده عدول نکرده است (یک بخش — یک صحنهٔ مهم) و در بخش جلویی اتاق نیز، که توصیف قطعی‌اش دشوار است، همین قاعده رعایت شده باشد. اینجا فقط یک فرض ارائه می‌شود. چون از همه سو (جز مرکز) صحنه‌های عهد عتیق تصویر شده‌اند، می‌توان در جبههٔ جلویی داستان هاجر را گمان کرد (پیدایش ۱۶، پیدایش ۲۱). اگر چنین باشد، نخست ابراهیم و هاجرِ رانده‌شده با پسرش اسماعیل (۱)، سپس نیایش ساره (۲)، و سپس هاجر که نوزاد را شیر می‌دهد (۳) تصویر شده‌اند.</p><p>بیایید این فرض را با تفصیل بیشتری بررسی کنیم:</p><p><strong>۱. رانده شدن هاجر</strong>. با بیشترین دقت می‌توان گفت که ابراهیم نشسته تصویر شده است (مو و ریش او مانند دیوارنگارهٔ ابراهیم در سمت مقابل است). در جامهٔ زرد، احتمالاً هاجر تصویر شده است (رنگ زرد می‌توانسته نشانهٔ وضعیت بردگی باشد). به نظر می‌رسد که در دست‌هایش مَشک‌های آب است (پید ۲۱:۱۴). در پسِ او، شاید پسرش اسماعیل تصویر شده باشد که در هنگام رانده شدن باید بیش از ۱۵ سال داشته باشد (<em>اسماعیل هنگامی زاده شد که ابراهیم ۸۶ ساله بود </em>پید ۱۶:۱۶<em>، اسحاق هنگامی زاده شد که ابراهیم ۱۰۰ ساله بود </em>پید ۲۱:۵<em>، و هاجر را هنگامی می‌رانند که اسحاق بزرگ شده و از شیر گرفته شده بود </em>پید ۲۱:۸-۱۳). به نظر می‌رسد که این زنی با پیش‌بند است، اما اگر چنین باشد، تنها می‌تواند خود هاجر باشد (سر زن بی‌شوهر پوشیده نیست)، و در این صورت، کسی که مشک‌ها را در دست دارد اسماعیل است. به هر حال، دو نفر باقی‌مانده هاجر و اسماعیل‌اند، که محتمل‌ترین فرض است. ممکن هم هست که تمام این ترکیب‌بندی از بخش‌های جداگانه ساخته نشده باشد، بلکه یک تصویر یکپارچه باشد، چون زن با نوزاد به زنی می‌نگرد که دست‌هایش را بالا برده است.</p><img src="https://res.bibleox.com/s/img/image/simple/686d33c95f47da2505d3ae5b/s_p_kuEcuyUnGenBuWPw.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d33c95f47da2505d3ae5b/m_p_kuEcuyUnGenBuWPw.jpg">بزرگ‌تر</a>]</p><p><strong>۲. نیایش ساره</strong>. ساره در جامهٔ سرخ با سر پوشیده تصویر شده است و به خدا نیایش می‌کند. رنگ سرخ جامه نشان‌دهندهٔ منزلت بلند است و سر پوشیده نشانهٔ زناشویی.</p><img src="https://res.bibleox.com/s/img/image/simple/686d3a855f47da2505d3ae5e/s_p_rpl3jnuNnx8ZisdR.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d3a855f47da2505d3ae5e/m_p_rpl3jnuNnx8ZisdR.jpg">بزرگ‌تر</a>]</p><p><strong>۳. هاجر نوزاد را شیر می‌دهد</strong>. به سود فرض هاجر این نکته گواهی می‌دهد که سرش پوشیده نیست (یعنی بی‌شوهر است)، و نیز شکل موهایش همانند موهای شخص زردپوش در صحنهٔ نخست است. نگاه ویژهٔ او نیز نشانهٔ اوست: به ساره می‌نگرد، که با او روابطی پرتنش داشت. جالب است که نقاش او را درست به همان گونه تصویر کرده که ابراهیم در سمت چپ نشسته است: بر صندلی و با جامه‌ای کاملاً همانند (نوارهای عمودی، دو نوار بر آستین، شنل).</p><img src="https://res.bibleox.com/s/img/image/simple/686d22a05f47da2505d3ae54/s_p_8fxd9vcRlXYszSJU.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d22a05f47da2505d3ae54/m_p_8fxd9vcRlXYszSJU.jpg">بزرگ‌تر</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686d33cd5f47da2505d3ae5c/m_p_qKPp740xLZNuDEFs.jpg">نسخه 2</a>]</p><p><strong>اندیشهٔ کلی اتاق — نجات از مرگ</strong></p><p>ترکیب‌بندی این کوبیکولوم اندیشه‌ای کلی و زیبا دارد — نجات از مرگ. مضمون کلی از پایین به بالا در چند سطح پیش می‌رود:</p><ul><li><p>پایین‌ترین سطح — مسیحیان مرده‌ای که به خاک سپرده شده‌اند و به فاتح مرگ، مسیح، ایمان داشتند.</p></li><li><p>سطح میانی — صحنه‌های کتاب مقدس دربارهٔ نجات از مرگ:</p><ul><li><p>سه جوان در کورهٔ بابل از مرگ در آتش نجات یافتند؛</p></li><li><p>یونس نبی از مرگ در شکم جانور دریایی نجات یافت؛</p></li><li><p>اسحاق از قربانی شدن نجات یافت و به‌جای او بره‌ای قربانی می‌شود؛</p></li><li><p>هاجر با پسرش اسماعیل از مرگ در بیابان نجات یافت.</p></li></ul></li><li><p>سطح ماقبل آخر — نمادهای مسیحی: طاووس (رستاخیز، بی‌مرگی، زندگی جاودان) و کبک (جان). یک کبک نزدیک گیاهی زنده (نماد زندگی) ایستاده و دیگری نزدیک گیاهی خشکیده (نماد مرگ). طاووس‌ها نیز ایستاده‌اند.</p></li><li><p>مرکز سقف — شبان نیکو که مؤمنان را از مرگ می‌رهاند. نکتهٔ جالب آنکه در اینجا اشارهٔ کوچک دیگری نیز به نجات از مرگ هست — در سمت چپ و راست شبان، کلاغ و کبوتری با شاخهٔ زیتون نشسته‌اند که نوح از کشتی فرستاد. بدین‌سان، کسانی که در کشتی از مرگ نجات یافتند، با این پرندگان به نجات‌دهنده از مرگ — مسیح — راهنمایی می‌شوند.</p></li></ul><h3>معبد دورا-اوروپوس (سوریه)</h3><p>۲۴۴ م. معبد دورا-اوروپوس، علاوه بر رویدادهای عهد عتیق، دیوارنگاره‌هایی با تصویر رویدادهای عهد جدید نیز داشت: نجات پطرس رسولِ در حال غرق شدن و شفای مفلوج در حوض گوسفندان. همچنین <a href="https://vk.com/@aletheia-de-sacris-imaginibus-venerandis?anchor=v-drugie-svyaschennye-izobrazhenia-v-donikeyskiy-period">این مقاله (به روسی)</a> را ببینید.</p><p><strong>مسیح در سیمای شبان نیکو (تصویر اصلی در تعمیدگاه)</strong></p><img src="https://res.bibleox.com/s/img/image/simple/6931870c205184ec278d6fa2/s_p_uBkNi8jGsMFpOQSM.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931870c205184ec278d6fa2/m_p_uBkNi8jGsMFpOQSM.jpg">بزرگ‌تر</a>]</p><p><strong>نجات پطرس رسولِ در حال غرق شدن</strong></p><img src="https://res.bibleox.com/s/img/image/simple/692c8038205184ec278d6f9e/s_p_QQ2Rml8gUWsyQtS9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/692c8038205184ec278d6f9e/m_p_QQ2Rml8gUWsyQtS9.jpg">بزرگ‌تر</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6786b88ddba77200015ae11c/m_p_do380IVDukCAfdFk.jpg">نسخه 2</a>]</p><p><strong>شفای مفلوج در حوض گوسفندان</strong></p><img src="https://res.bibleox.com/s/img/image/simple/6786b889dba77200015ae11b/s_p_k1a5GDBvfzTCWmZv.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6786b889dba77200015ae11b/m_p_k1a5GDBvfzTCWmZv.jpg">بزرگ‌تر</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6786bb0bdba77200015ae11d/m_p_dCRD85foL69l7kih.jpg">نسخهٔ دیگر</a>]</p><h3>مسیح در سیمای شبان نیکو، یونس نبی</h3><p>پایان سدهٔ ۳ تا آغاز سدهٔ ۴. روم. دخمه‌های پطرس و مارسلینوس.</p><p>در مرکز — مسیح در سیمای شبان نیکو. در دو سوی مرکز یونس تصویر شده است. در دیوارنگارهٔ سمت چپ، یونس را از کشتی به دریا می‌افکنند و در سمت راست، نهنگ او را می‌بلعد.</p><img src="https://res.bibleox.com/s/img/image/simple/478/s_p_yvJcnbLGPxZ6AzRu.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/478/m_p_yvJcnbLGPxZ6AzRu.jpg">بزرگ‌تر</a>]</p><p>یونس نبی</p><img src="https://res.bibleox.com/s/img/image/simple/481/s_p_7z5j4tAimokFaRMN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/481/m_p_7z5j4tAimokFaRMN.jpg">بزرگ‌تر</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/480/s_p_b8gqyOenKZcn2MCp.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/480/m_p_b8gqyOenKZcn2MCp.jpg">بزرگ‌تر</a>]</p><h3>مسیح در سیمای شبان نیکو</h3><p>سدهٔ ۳. روم. دخمه‌های کالیستوس (<a href="https://en.wikipedia.org/wiki/Catacomb_of_Callixtus#Paintings">Callixitus Catacomb, Crypt of Lucina</a>). می‌توان گمان کرد که در دیگچه شیر است، که نماد عشای ربانی است (نک. در نوشته‌های کلمنت اسکندریه).</p><img src="https://res.bibleox.com/s/img/image/simple/474/s_p_zcLmMd2qkyG3pDoj.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/474/m_p_zcLmMd2qkyG3pDoj.jpg">بزرگ‌تر</a>]</p><h3>شبان نیکو، گورستان هیسارتپه، نیقیه (ایزنیق)</h3><p>~سدهٔ ۳. یافتهٔ تازه است و تاریخ‌گذاری آن فرضی است (<a href="https://www.arkeolojikhaber.com/haber-iznikte-benzersiz-bir-kesif-anadolunun-tek-coban-isa-figuru-gun-yuzune-cikarildi-43079/">بیشتر</a>). این گورستان از سدهٔ ۲ تا ۵ به کار می‌رفت.</p><p>مختصات: 40.78204218462122, 29.928491677648932. نام محلی به ترکی: Hasartep Nekropolü.</p><img src="https://res.bibleox.com/s/img/image/simple/69444e49205184ec278d6fdb/s_p_SZTpvcDdpodujcbM.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/69444e49205184ec278d6fdb/m_p_SZTpvcDdpodujcbM.jpg">بزرگ‌تر</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6941a813205184ec278d6fda/s_p_CUoa7dSy5UxGf1UD.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6941a813205184ec278d6fda/m_p_CUoa7dSy5UxGf1UD.jpg">بزرگ‌تر</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6941a80f205184ec278d6fd9/m_p_xSCaRt10DUUReyMt.jpg">نسخه 2</a>] [<a href="https://res.bibleox.com/s/img/image/simple/693c7d1a205184ec278d6fcb/m_p_mR5ZaVgXbezmXDyo.jpg">نسخه 3</a>] [<a href="https://res.bibleox.com/s/img/image/simple/693d606b205184ec278d6fd3/m_p_TKCjvhxmnq0q50tW.jpg">نسخه 4</a>] [<a href="https://res.bibleox.com/s/img/image/simple/693d6101205184ec278d6fd7/m_p_1i6aL6lfDR08iA13.jpg">نسخه 5</a>] [<a href="https://res.bibleox.com/s/img/image/simple/693d60f8205184ec278d6fd6/m_p_b2uUaO6tzciaKAgC.jpg">نسخه 6</a>] [<a href="https://res.bibleox.com/s/img/image/simple/693d60f1205184ec278d6fd5/m_p_bErh7lbI0e08hPaa.jpg">نسخه 7</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/693c7db2205184ec278d6fd2/s_p_wCZsWPWG7jCNLjIr.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/693c7db2205184ec278d6fd2/m_p_wCZsWPWG7jCNLjIr.jpg">بزرگ‌تر</a>] [<a href="https://res.bibleox.com/s/img/image/simple/693d60ad205184ec278d6fd4/m_p_BCvsIiJX10j2Mf2k.jpg">مرد و زن</a>] [<a href="https://res.bibleox.com/s/img/image/simple/693c7daa205184ec278d6fd1/m_p_cjk36Xjpev9EFq2h.jpg">زن</a>]</p><h3>حلقهٔ ازدواج (بیزانس)</h3><p>سده‌های ۳-۴. <a href="https://www.metmuseum.org/art/collection/search/663485">موزهٔ متروپولیتن در خیابان پنجم، آمریکا</a>. (یونانی χάρις — فیض)</p><img src="https://res.bibleox.com/s/img/image/simple/68b5da8b45c75323d28a5e99/s_p_GNh1S8L7fcowsMEE.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5da8b45c75323d28a5e99/m_p_GNh1S8L7fcowsMEE.jpg">بزرگ‌تر</a>]</p><h3>برگزاری عشای ربانی</h3><p>سدهٔ ۳. روم. دخمه‌های کالیستوس (<a href="https://en.wikipedia.org/wiki/Catacomb_of_Callixtus#Paintings">Callixitus Catacomb, Crypt of Lucina</a>). احتمالاً کشیشی در هم‌خدمتی با شماس تصویر شده است. امروز نیز در کلیسای ارتدکس عشای ربانی به همین گونه برگزار می‌شود: کشیش هر دو دست را به بالا برمی‌دارد و شماس به عطایای مقدس اشاره می‌کند.</p><img src="https://res.bibleox.com/s/img/image/simple/479/s_p_Zbn405P2krjwNAYl.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/479/m_p_Zbn405P2krjwNAYl.jpg">بزرگ‌تر</a>]</p><h2>سدهٔ ۴</h2><h3>مسیح (روم)</h3><p>دخمه‌های کومودیللا.</p><img src="https://res.bibleox.com/s/img/image/simple/66cc2bd6dba77200019bc7d2/s_p_7xYGBb9wCmxBIGrZ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/66cc2bd6dba77200019bc7d2/m_p_7xYGBb9wCmxBIGrZ.jpg">بزرگ‌تر</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686d23425f47da2505d3ae55/s_p_LzqgbhnIsbqtghoc.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d23425f47da2505d3ae55/m_p_LzqgbhnIsbqtghoc.jpg">بزرگ‌تر</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a1e1205184ec278d6fa8/m_p_KC0MljXJf5po70pj.jpg">نسخه 2</a>]</p><h3>مسیح و رسولان (روم)</h3><p>~سال ۳۵۰. [8][9] آرامگاه سانتا کونستانتسا.</p><img src="https://res.bibleox.com/s/img/image/simple/686990665f47da2505d3ae19/s_p_5RDr4ou4ExBAh4KE.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686990665f47da2505d3ae19/m_p_5RDr4ou4ExBAh4KE.jpg">بزرگ‌تر</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686990425f47da2505d3ae17/s_p_CXn5KmuiWradhOvh.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686990425f47da2505d3ae17/m_p_CXn5KmuiWradhOvh.jpg">بزرگ‌تر</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686990545f47da2505d3ae18/s_p_IkgteAcecXoMC106.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686990545f47da2505d3ae18/m_p_IkgteAcecXoMC106.jpg">بزرگ‌تر</a>]</p><h3>تعمیدگاه سان جووانی این فونته (ناپل)</h3><p>۳۵۰-۴۰۰ م. [11][12]</p><img src="https://res.bibleox.com/s/img/image/simple/6869924c5f47da2505d3ae1a/s_p_t1iU8sClY3pnOnkK.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6869924c5f47da2505d3ae1a/m_p_t1iU8sClY3pnOnkK.jpg">بزرگ‌تر</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686992505f47da2505d3ae1b/s_p_BrRKZmtReJbgXm0w.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686992505f47da2505d3ae1b/m_p_BrRKZmtReJbgXm0w.jpg">بزرگ‌تر</a>]</p><h3>مسیح و فرشتگان، آمدن دوم (سالونیک، بیزانس)</h3><p>پایان سدهٔ ۴. [17][18] روتوندای سنت جرج پیروز (در آغاز آرامگاه امپراتور گالریوس).</p><img src="https://res.bibleox.com/s/img/image/simple/6931a254205184ec278d6fa9/s_p_bWn7Chqiox5UOEd4.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931a254205184ec278d6fa9/m_p_bWn7Chqiox5UOEd4.jpg">بزرگ‌تر</a>] [<a href="https://res.bibleox.com/s/img/image/simple/6931a2ba205184ec278d6faa/m_p_ROPWmBVyUxWMGo9Z.jpg">نسخه 2</a>]</p><p>موزائیک به‌خوبی حفظ نشده است. از تصویر مسیح تکه‌ای از هاله، دست و صلیب باقی مانده است. پیرامون آن چهره‌های فرشتگان به‌خوبی دیده می‌شود.</p><img src="https://res.bibleox.com/s/img/image/simple/686a91695f47da2505d3ae1f/s_p_EoOSmhaBPsy32XQQ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686a91695f47da2505d3ae1f/m_p_EoOSmhaBPsy32XQQ.jpg">بزرگ‌تر</a>]</p><h3>اسقفان مقدس، جنگاوران، پزشکان (سالونیک، بیزانس)</h3><p>پایان سدهٔ ۴ [17][18]. روتوندای قدیس گئورگیوس (جرج) پیروز (در اصل آرامگاه امپراتور گالریوس).</p><p>در میان موزائیک‌ها تصویر اسقفان مقدس، جنگاوران، پزشکان و نوازندگان با نام‌های رومان، کیریل، لئون، اونیسیفوروس، اوکارپیوس، واسیلیسک، پورفیریوس، فیلیمون، پریسکوس، فرینوس، کوسماس و دامیان دیده می‌شود.</p><img src="https://res.bibleox.com/s/img/image/simple/686aa0275f47da2505d3ae21/s_p_oIksDo9rIgSoAXvG.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa0275f47da2505d3ae21/m_p_oIksDo9rIgSoAXvG.jpg">بزرگ‌تر</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686aa02e5f47da2505d3ae22/s_p_nTZtC6C93KI8Fu6I.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa02e5f47da2505d3ae22/m_p_nTZtC6C93KI8Fu6I.jpg">بزرگ‌تر</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686aa0335f47da2505d3ae23/s_p_b1KhWllqTzipVhO9.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa0335f47da2505d3ae23/m_p_b1KhWllqTzipVhO9.jpg">بزرگ‌تر</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686aa0385f47da2505d3ae24/s_p_vvlbG9E89B9T0U8j.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa0385f47da2505d3ae24/m_p_vvlbG9E89B9T0U8j.jpg">بزرگ‌تر</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686aa03f5f47da2505d3ae25/s_p_d3lcRobegfAQOf6e.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa03f5f47da2505d3ae25/m_p_d3lcRobegfAQOf6e.jpg">بزرگ‌تر</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686aa0555f47da2505d3ae27/s_p_h1YgFpMukwaYc23Q.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa0555f47da2505d3ae27/m_p_h1YgFpMukwaYc23Q.jpg">بزرگ‌تر</a>]</p><p>قدیسان کوسماس و دامیان</p><img src="https://res.bibleox.com/s/img/image/simple/686aa04e5f47da2505d3ae26/s_p_LwMjPHLsabDDxEHy.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686aa04e5f47da2505d3ae26/m_p_LwMjPHLsabDDxEHy.jpg">بزرگ‌تر</a>]</p><h3>تصویر مسیح مصلوب در میان راهزنان (رم)</h3><p>آغاز سدهٔ ۴. کلیسای سانتا سابینا، یکی از لنگه‌های در. تصویر برجستهٔ مصلوب شدن.</p><img src="https://res.bibleox.com/s/img/image/simple/676183a8dba7720001cd0e2b/s_p_ccaA7HzLPDInwe1b.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/676183a8dba7720001cd0e2b/m_p_ccaA7HzLPDInwe1b.jpg">بزرگ‌تر</a>]</p><h3>ورود خداوند به اورشلیم (بیزانس)</h3><p>آغاز سدهٔ ۴. <a href="https://www.metmuseum.org/art/collection/search/466220">موزهٔ متروپولیتن در خیابان پنجم، آمریکا</a>. ۶۷.۳ × ۲۱۲.۱ × ۶۱.۹ سانتی‌متر.</p><img src="https://res.bibleox.com/s/img/image/simple/68b5e69845c75323d28a5e9d/s_p_Kk1dIB2OLr1OjQ1O.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68b5e69845c75323d28a5e9d/m_p_Kk1dIB2OLr1OjQ1O.jpg">بزرگ‌تر</a>]</p><h3>مسیح، سنگ‌لوح (خرسونس)</h3><p>سال‌های ۳۰۰-۵۰۰. <a href="https://collections.louvre.fr/en/ark:/53355/cl010276835">لوور، فرانسه</a>. موزه اعلام می‌کند که بخش دوم در ارمیتاژ نگهداری می‌شود. بر آن سخنانی خطاب به رسول پطرس حجاری شده است.</p><img src="https://res.bibleox.com/s/img/image/simple/68c41cec6594f46d35a87f04/s_p_esWl4etLsBMVz9bw.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/68c41cec6594f46d35a87f04/m_p_esWl4etLsBMVz9bw.jpg">بزرگ‌تر</a>]</p><h3>مسیح معلم (رم)</h3><p>دخمه‌های دومیتیلا. دیوارنگارهٔ لونت (طاقچهٔ هلالی) اتاقک تدفین.</p><img src="https://res.bibleox.com/s/img/image/simple/674ed2a4dba77200011c738a/s_p_4M8Vki7GNJBHkJPN.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674ed2a4dba77200011c738a/m_p_4M8Vki7GNJBHkJPN.jpg">بزرگ‌تر</a>]</p><h3>خداوند عیسی مسیح (رم)</h3><p>سده‌های ۳-۵. دخمه‌های جنروزا [7]</p><img src="https://res.bibleox.com/s/img/image/simple/674f2408dba77200011c739c/s_p_zVliPTIYBpqqnTGQ.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/674f2408dba77200011c739c/m_p_zVliPTIYBpqqnTGQ.jpg">بزرگ‌تر</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/6931a55a205184ec278d6faf/s_p_xXRXPudiFDi6GltL.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/6931a55a205184ec278d6faf/m_p_xXRXPudiFDi6GltL.jp