"src": "NqoW_О_посте",
"title": "О посте",
"title_sub": "Перевод с латинского",
"meta_desc": "Тертуллиан защищает монтанистские посты, сухоядение и продлённые стояния от упрёков в новшестве и язвительно обличает чревоугодие «душевных».",
"body": "<p><strong>Тертуллиан написал это сочинение в поздний период творчества, уверовав в Монтана и приняв ереси монтанистов.</strong></p><h2>1. Обвинения «душевных»</h2><p>Я удивлялся бы душевным,[1] если бы их тянула одна только похоть, из-за которой они женятся по нескольку раз, и не терзало бы ещё и обжорство, из-за которого они ненавидят посты. Это было бы чудом: похоть без чревоугодия! Ведь оба порока так тесно связаны и сращены, что, будь их вообще можно разделить, срамные части не прилегали бы прежде всего к самому животу. Взгляни на тело: это одна область. Порядок пороков отвечает расположению членов: сначала живот, и сразу под ним, опираясь на сытость, — всё остальное распутство. Через прожорливость проходит сладострастие.</p><p>Вот почему я узнаю эту душевную веру. Вся она из заботы о плоти и одинаково склонна и к многоядению, и к многобрачию. Понятно, что она винит духовный устав, соперника ей по самой своей сути, и за этот вид воздержания: он надевает узду на чрево тем, что временами вовсе не даёт пищи, или даёт её поздно, или сухую, — так же, как надевает узду на похоть единственным браком.</p><p>Уже досадно сходиться с такими людьми, стыдно с ними и спорить: у них и защита нескромна. Ведь как мне защищать чистоту и трезвость, не задевая противников? Кто же они? Назову их разом: внешние и внутренние колбасы душевных.[2]</p><p>Они спорят с Параклетом и потому отвергают новые пророчества. Не потому, что Монтан, Присцилла и Максимилла проповедуют другого Бога, и не потому, что они отвергают Иисуса Христа (1 Ин. 4:3), и не потому, что ниспровергают какое-нибудь правило веры или надежды, а просто потому, что учат поститься чаще, чем жениться.[3]</p><p>О мере брака мы уже выпустили защиту единобрачия. Теперь о пище: это второй, а вернее, первый бой воздержания. Нас обвиняют в том, что мы соблюдаем особые посты; что стояния[4] продлеваем обычно до вечера; что держим и сухоядения,[5] отделяя от пищи всё мясное, всё жидкое и всякие сочные плоды, чтобы не есть и не пить ничего винного; и воздержание от бани, соответствующее сухому столу.</p><p>Итак, они отбрасывают это как новшество и, ссылаясь на его незаконность, требуют: либо считать это ересью, если это человеческая выдумка, либо лжепророчеством, если это предписание духа. Так что в любом случае мы будем слышать «анафема» за то, что возвещаем иначе (Гал. 1:8).</p><h2>2. Их доводы</h2><p>Что касается постов, они выставляют против нас определённые дни, установленные Богом. Так, в Левите Господь заповедует Моисею десятый день седьмого месяца, день очищения: «Это будет для вас святой день, и смиряйте души ваши; а всякая душа, которая не смирит себя в этот день, истребится из народа своего» (Лев. 16:29; 23:27–29). В Евангелии же, считают они, постом определены лишь те дни, когда отнят жених (Мф. 9:15), и только они одни теперь законны для христианского поста: всё ветхое, законное и пророческое, отменено. Они ведь, когда им нужно, понимают, что значит: «Закон и пророки до Иоанна» (Лк. 16:16).</p><p>Поэтому в остальное время, говорят они, надо поститься по своему усмотрению, а не по приказу нового устава, смотря по времени и обстоятельствам каждого. Так же, мол, держали и апостолы, не налагая иного ига определённых и общих для всех постов (Деян. 15:10). То же о стояниях: и у них есть свои дни, среда и пятница, но идут они вольно, не по закону заповеди и не дальше конца дня, потому что и молитвы обычно заканчиваются в девятый час по примеру Петра, о котором рассказано в Деяниях (Деян. 3:1).</p><p>Сухоядение же, говорят, — новое имя показного обряда, близкое к языческому суеверию; такие воздержания очищают служителей Аписа, Исиды и Великой Матери исключением определённых яств. Вера, свободная во Христе, не должна даже иудейскому закону воздержания от некоторых яств: апостол раз навсегда допустил её на весь рынок, осудив тех, кто, запрещая вступать в брак, велит и воздерживаться от пищи, которую Бог сотворил. И уже тогда, значит, он предвидел нас: «В последние времена отступят некоторые от веры, внимая духам обольстителям и учениям лжецов, сожжённых в совести своей» (1 Тим. 4:1–3). Каким огнём, скажи на милость? Наверное, тем, на котором мы часто справляем свадьбы и ежедневно варим обеды!</p><p>Точно так же, говорят, вместе с галатами поражены и мы, наблюдающие «дни, месяцы, времена и годы» (Гал. 4:10). Бросают в нас и словами Исайи: «Такой ли пост Я избрал?» (Ис. 58:5), то есть не воздержание от пищи, а дела правды, перечисленные дальше. И Сам Господь в Евангелии, говорят, кратко ответил на всякую мелочность в пище: не то сквернит человека, что входит в уста, а что выходит из уст (Мк. 7:15; Мф. 15:11), притом что Сам Он ел и пил настолько, что о Нём говорили: «Вот человек, который любит есть и пить вино» (Мф. 11:19). Так и апостол учит, что «пища не приближает нас к Богу: ибо, едим ли мы, ничего не приобретаем; не едим ли, ничего не теряем» (1 Кор. 8:8).</p><p>Такими и подобными мыслями они искусно ведут к тому, что каждый, кто склонен к животу, может считать излишними и не особенно нужными и отказ от пищи, и её сокращение, и отсрочку: ведь Бог, мол, ставит выше дела правды и невинности. Мы знаем, как убеждают плотские удобства. Легко сказать: «Нужно мне верить всем сердцем, любить Бога и ближнего; на этих двух заповедях утверждаются весь закон и пророки» (Мф. 22:37–40), а не на пустоте моих лёгких и кишок.</p><h2>3. Адам погиб от еды</h2><p>Итак, сначала мы должны утвердить то, что исподволь подрывается: сколько значит перед Богом эта пустота, и прежде всего откуда взялось само основание так служить Богу. Необходимость соблюдения станет ясна тогда, когда просияет авторитет этого основания, проверенного с самого начала.</p><p>Адам получил от Бога закон: не вкушать от древа познания добра и зла, а вкусив, умереть. Но он, вернувшись к душевному после духовного исступления, в котором пророчествовал ту великую тайну о Христе и Церкви (Еф. 5:32),[6] и уже не вмещая того, что от духа, легче уступил животу, чем Богу, склонился к еде скорее, чем к заповеди, и продал спасение за чрево. Он поел — и погиб. Он спасся бы, если бы предпочёл поститься перед одним деревцем. Пусть отсюда душевная вера узнаёт своё семя, ведя от него своё влечение к плотскому и отказ от духовного.</p><p>Я держусь того, что чревоугодие от начала — человекоубийца, заслуживающее муки и наказания в день суда, даже если бы Бог не заповедал никаких постов. Показав, от чего погиб Адам, Он предоставил мне самому понять лекарства от проступка, потому что показал проступок. Я сам, какими бы способами и в какое бы время ни мог, считал бы пищу ядом и принимал бы противоядие — голод. Им я очищал бы причину смерти, от начала перешедшую и на меня вместе с родом. Я был бы уверен, что Бог хочет этого, раз не хотел противоположного, и не сомневался бы, что Ему угодит забота о воздержании, раз я узнал, что Он осудил вину невоздержания.</p><p>А так как Он и Сам заповедует пост и душу сокрушённую, сокрушённую, разумеется, прежде всего скудостью пищи, называет жертвой (Пс. 50:19), кто усомнится, что основание всех истязаний плоти в пище таково: через новый запрет пищи и соблюдение заповеди искупается изначальный грех? Человек удовлетворяет Бога тем же, чем оскорбил, то есть запретом пищи. Как сытость погасила спасение, так голод снова возжигает его, и за один недозволенный плод он презирает множество дозволенных.</p><h2>4. Почему Бог сначала разрешил всё</h2><p>Такое основание хранилось в промысле Божием, распределяющем всё по времени. Пусть никто не возражает, желая опровергнуть нас: почему же тогда Бог сразу не установил строгости в пище, а, напротив, расширил разрешение? Ведь сначала Он назначил человеку в пищу только травы и деревья: «Вот, Я дал вам всякую траву, сеющую семя, какая есть на всей земле, и всякое дерево, у которого плод древесный, сеющий семя: вам сие будет в пищу» (Быт. 1:29). А потом Ною, перечислив подчинение всех зверей земных, птиц небесных, пресмыкающихся по земле, рыб морских и всего живого, Он сказал: «Всё движущееся, что живёт, будет вам в пищу; как зелень травную даю вам всё. Только плоти с душою её, с кровью её, не ешьте» (Быт. 9:2–4). Исключив из пищи только мясо, душа которого не вытекла с кровью, Он явно разрешил всё остальное мясо.</p><p>На это мы отвечаем: не следовало обременять законом воздержания человека, который только что не вынес столь лёгкого запрета — от одного плода. Ему дали послабление, чтобы укрепить его самой свободой. Так и после потопа, при обновлении рода человеческого, хватало пока одного закона — воздерживаться от крови, а остальное разрешалось. Господь уже показал суд в потопе и ещё пригрозил взысканием крови от руки брата и от руки зверя (Быт. 9:5). Предваряя справедливость суда, Он дал простор свободе, послаблением подготавливая строгость. Он всё разрешил, чтобы кое-что отнять; намереваясь больше потребовать, раз больше вверил; намереваясь повелеть воздержание, раз наперёд дал снисхождение. Тем больше, как мы сказали, изначальный грех искупался делом большего воздержания при возможности большей вольности.</p><h2>5. Израиль и горшки с мясом</h2><p>Когда же стали собирать для Бога близкий Ему народ и можно было воспитывать человека к восстановлению, тогда были наложены все законы и уставы, и те, что ограничивали еду, отнимая некоторые яства как нечистые, чтобы человек, постоянно воздерживаясь от некоторого, легче переносил иногда посты.</p><p>Первый народ воспроизвёл вину первого человека, оказавшись склоннее к животу, чем к Богу. Вырванный крепкой рукой Божией и мышцею высокою из тяжкого египетского рабства, увидев своего Господа, назначенный в землю, где течёт молоко и мёд, он, едва соблазнившись видом обширной пустыни, вздохнул об утраченной египетской сытости и зароптал на Моисея и Аарона: «О, если бы мы умерли от руки Господней в земле Египетской, когда мы сидели у котлов с мясом, когда мы ели хлеб досыта! ибо вывели вы нас в эту пустыню, чтобы всё собрание это уморить голодом» (Исх. 16:2–3). С тем же предпочтением живота он плакался затем перед теми же вождями и посредниками Божиими, раздражая их желанием мяса и воспоминанием о египетском изобилии: «Кто накормит нас мясом? Мы помним рыбу, которую в Египте мы ели даром, огурцы и дыни, и лук, и репчатый лук и чеснок; а ныне душа наша изнывает; ничего нет, только манна в глазах наших» (Чис. 11:4–6).</p><p>Так и им не нравились ангельские хлебы сухоядения: чесноком и луком им пахнуть было милее, чем небом. Поэтому у столь неблагодарных и отняли всё приятное и вкусное, чтобы разом наказать чревоугодие и упражнять воздержание: первое осудить, второе воспитать.</p><h2>6. Сытый забывает Бога</h2><p>Если мы опрометчиво возводим основания строгости в пище, установленной Богом и соблюдаемой нами ради Бога, к опытам начала, спросим общее сознание. Сама природа скажет, какими делает она нас до еды и питья, с ещё девственной слюной, во всём, что относится к чувству, которым постигается божественное: насколько сильнее ум, насколько живее сердце, чем когда всё это жилище внутреннего человека, набитое яствами, залитое вином, кипя переваривающимися нечистотами, превращается в преддверие отхожего места, где ближе всего лишь мысли о распутстве. «И сел народ есть и пить, а после встал играть» (Исх. 32:6). Заметь стыдливость Святого Писания: оно упомянуло бы игру, только если она нечистая.</p><p>Да и сколько людей вспомнит о благочестии, когда заняты вместилища памяти и связаны члены мудрости? Никто не вспомнит о Боге так, как подобает, как должно, как полезно, в такое время, когда человек обычно и себя теряет. Всякий устав еда либо убивает, либо ранит. Пусть я солгу, если Сам Господь, упрекая Израиль в забвении, не приписывает причину пресыщению: «Утучнел Израиль, стал тучен, разжирел, и оставил Бога, создавшего его, и презрел твердыню спасения своего» (Втор. 32:15). И в том же Второзаконии, веля остерегаться той же причины: «Когда будешь есть и насыщаться, и построишь хорошие домы, и будет у тебя много крупного и мелкого скота, и будет много серебра и золота, то смотри, чтобы не надмилось сердце твоё и не забыл ты Господа, Бога твоего» (Втор. 8:12–14). Порче от богатства Он поставил вперёд чрезмерность обжорства, которой богатство и потворствует. От него ведь и утучнело сердце народа, чтобы не видеть глазами, не слышать ушами и не разуметь сердцем, забитым жиром (Ис. 6:10), который Он особо запретил в пищу (Лев. 3:17), отучая человека заботиться о сытости.</p><p>А тот, у кого сердце было скорее поднято, чем ожирело, сорок дней и столько же ночей выдержал пост сверх сил человеческой природы, причём духовная вера подавала ему силу. Он своими глазами увидел славу Божию, ушами услышал голос Божий, сердцем понял закон Бога, уже тогда учившего, что «не хлебом одним живёт человек, но всяким словом Божиим» (Втор. 8:3; Лк. 4:4). Народ, ожиревший, не мог смотреть твёрдо даже на самого Моисея, питавшегося Богом и с голодом, насыщенным Его именем.[7] Поэтому Господь и во плоти явился тому, кто разделял с Ним посты, и ещё Илии (Мф. 17:3).</p><p>Ведь и Илия уже тем, что призвал голод, достаточно посвятил себя постам: «Жив Господь, пред Которым я стою! в сии годы не будет ни росы, ни дождя» (3 Цар. 17:1). Затем, убегая от угроз Иезавели, после одной еды и питья, которые нашёл, разбуженный ангелом, он также сорок дней и ночей с пустым животом и сухими устами дошёл до горы Хорив. Когда он укрылся в пещере, как близко принял его Бог: «Что ты здесь, Илия?» (3 Цар. 19:9). Насколько дружественнее этот голос, чем «Адам, где ты?» (Быт. 3:9). Тот грозил человеку сытому, этот ласкал постящегося. Вот какое преимущество у ограниченной пищи: оно даёт человеку Бога в сотрапезники, равного с равным. Ведь если Бог вечный не алчет, как свидетельствует Он через Исайю (Ис. 40:28),[8] то в это время человек сравнивается с Богом, когда живёт без еды.</p><h2>7. Что совершил пост в Ветхом Завете</h2><p>Мы перешли к примерам, чтобы показать действенную силу этого служения: оно примиряет с человеком и разгневанного Бога.</p><p>Согрешил Израиль, но, собранный Самуилом для возлияния воды в Массифе, сразу омыл грех постом и одновременно избежал опасности битвы (1 Цар. 7:6–11). Самуил как раз приносил всесожжение, и мы слышим, что милость Божия заслужена ничем другим, как воздержанием народа. Филистимляне подступили к бою, и тогда Господь возгремел громким голосом над филистимлянами, и они были смущены и поражены перед Израилем. Мужи Израиля вышли из Массифы, преследовали филистимлян и били их до Беф-Кара: голодные — сытых, безоружные — вооружённых. Такова сила постящихся Богу: небо сражается за них. Вот тебе образец защиты, нужной и в духовных битвах.</p><p>Так и когда царь ассирийский Сеннахирим, уже взяв много городов, через Рабсака грозил и богохульствовал Израилю (4 Цар. 18:19), ничто другое не отвратило его замысла и не отвлекло к Эфиопии. И что другое истребило через ангела сто восемьдесят тысяч из его войска, как не смирение царя Езекии? Услышав о жестокости врага, он разодрал одежду, надел вретище и в том же виде велел старейшинам священников идти к Богу через Исаию. Разумеется, пост сопровождал прошения: при опасности не до еды, а во вретище не до пресыщения. Голод всегда следует за скорбью, как веселье сопровождает сытость.</p><p>Через это следствие скорби и голод был избавлен от предсказанной гибели и тот грешный город Ниневия. Покаяние в злодеяниях достаточно препоручило его Богу постом в три дня, когда изнурили и скот, на который Бог не гневался (Ион. 3).[9] И Содом с Гоморрой уцелели бы, если бы постились.</p><p>Знает это лекарство и Ахав. После беззакония, идолослужения и убийства Навуфея, которого Иезавель погубила из-за виноградника, Илия упрекнул его: «Ты убил, и ещё вступаешь в наследство? На том месте, где псы лизали кровь Навуфея, псы будут лизать и твою кровь» (3 Цар. 21:19). Он пал духом, возложил на тело вретище, постился и спал во вретище. И было слово Господне к Илии: «Видел ли ты, как смирился предо Мною Ахав? За то, что он смирился предо Мною, Я не наведу беды при его жизни; при сыне его наведу беду» (3 Цар. 21:29) — на того, кто не будет поститься. Так пост есть дело почтения к Богу.</p><p>Им же и Анна, жена Елканы, прежде бесплодная, легко испросила у Бога наполнить пустой от пищи живот сыном, притом пророком (1 Цар. 1).</p><p>Посты заслуживают у Бога не только перемены природы, отвращения опасностей и изглаживания грехов, но и познания тайн. Посмотри на пример Даниила. Из-за сна царя вавилонского все мудрецы в смятении и заявляют, что человеческими силами этого не узнать. Один Даниил, надеясь на Бога и зная, как заслужить милость Божию, просит времени на три дня[10] и постится вместе с братией. Так он, совершив молитвы, во всём узнаёт порядок и смысл сна; мудрецы тирана пощажены, Бог прославлен, Даниил почтён. Не меньшую милость Божию он получил и потом, в первый год царя Дария, когда, размышляя о времени, предсказанном Иеремией, обратил лицо своё к Богу в посте, вретище и пепле. Посланный к нему ангел сразу объявил причину божественного снисхождения: «Я пришёл возвестить тебе, что ты муж желаний» (Дан. 9:23),[11] то есть постом. Если для Бога он был достоин милости, то для львов в яме внушал страх; там постившемуся шесть дней ангел доставил обед.</p><h2>8. Пост в Новом Завете</h2><p>Вернём и остальное, ведь мы спешим к новым примерам. На пороге Евангелия Анна-пророчица, дочь Фануилова, узнавшая Младенца-Господа и много говорившая о Нём ожидавшим избавления Израиля, к славному званию древней вдовы одного мужа прибавляет ещё свидетельство постов (Лк. 2:36–38). Она показывает, какими служениями надо пребывать в Церкви и что никто лучше не понимает Христа, чем однажды бывшие в браке и часто постящиеся.</p><p>Сам Господь вскоре освятил постами Своё крещение, а в Своём и всех. Он мог бы делать хлебы из камней, может быть, и Иордан потёк бы вином, будь Он на самом деле едоком и пьяницей. Но Он посвящал нового человека в посрамление ветхого силою презрения к пище, чтобы показать диаволу, снова попытавшемуся искусить через еду, что Он сильнее всякого голода.</p><p>Затем Он установил закон: поститься без печали (Мф. 6:16). Зачем печалиться о спасительном? Он учил также, что постами надо сражаться с самыми лютыми бесами (Мф. 17:21). Что удивительного, если злой дух изгоняется тем же действием, каким вводится святой? И когда на сотника Корнилия, ещё не крещённого, поспешило снизойти благоволение Святого Духа, да ещё с даром пророчества, мы читаем, что услышаны были его посты (Деян. 10:30–31).[12] И апостол, думаю, во Втором послании к Коринфянам среди своих трудов, опасностей и лишений после голода и жажды перечисляет и «частые посты» (2 Кор. 11:27).</p><h2>9. Сухоядение и воздержание от вина</h2><p>Этот главный вид строгости в пище позволяет заранее судить и о младших видах воздержания: и они в своей мере полезны или необходимы. Исключение некоторых яств — это частичный пост. Рассмотрим же, новы ли или пусты сухоядения, если и в них нет действия столь же древнего, сколь и действенного благочестия.</p><p>Возвращаюсь к Даниилу и его братьям. Они предпочли царским блюдам и винам пищу из овощей и питьё из воды и оказались красивее, чтобы кто-нибудь не боялся и за красоту своего тела, а сверх того, и духом образованнее. Бог дал этим юношам знание и разумение во всякой книге, а Даниилу во всяком слове, сновидениях и всякой мудрости (Дан. 1:12–17), которой он понимал и то, какими способами испросить у Бога познание тайн. В третий год Кира, царя Персидского, когда размышлял о видении, он избрал другой вид смирения. «В те дни, — говорит он, — я, Даниил, был в сетовании три седмицы дней. Вкусного хлеба я не ел; мясо и вино не входили в уста мои, и мастями не умащал себя до исполнения трёх седмиц дней» (Дан. 10:2–3). После этого был послан ангел, говоривший: «Даниил, муж желаний! Не бойся, потому что с первого дня, как ты расположил сердце твоё, чтобы достигнуть разумения и смирить себя пред Богом твоим, слова твои услышаны, и я пришёл бы по твоим словам» (Дан. 10:11–12). Так милость и смирение сухоядения прогоняют страх, склоняют уши Божии и приобщают к сокровенному.</p><p>Возвращаюсь и к Илии. Вороны обычно насыщали его хлебом и мясом (3 Цар. 17:6). Почему же потом в Вирсавии Иудейской тот ангел, разбудив его, подал ему лишь хлеб и воду (3 Цар. 19:6)? Закончились вороны, которые кормили его щедрее? Или ангелу было трудно перенести к Илии откуда-нибудь с царского пира слугу с богатейшим блюдом, как принесён был обед жнецов голодному Даниилу в львиный ров? Нет, нужно было дать пример, учащий: во время притеснения, гонения и всякой беды надо жить сухоядением.</p><p>Такой пищей Давид выразил своё покаяние: ел пепел как хлеб, то есть хлеб, сухой и грязный, как пепел, а питьё растворял слезами, разумеется вместо вина (Пс. 101:10).</p><p>У воздержания от вина свои заслуги: оно и Самуила посвятило Богу, и Аарона освятило. О Самуиле мать говорит: «Вина и сикера не будет он пить» (1 Цар. 1:11),[13] ведь и сама она такая молилась Богу. А Господь говорит Аарону: «Вина и крепких напитков не пей ты и сыны твои с тобою, когда входите в скинию собрания, или приступаете к жертвеннику, чтобы вам не умереть» (Лев. 10:9). Значит, умрут те, кто служит в Церкви не трезвыми. Так Он упрекает Израиль: «Вы назореев поили вином» (Ам. 2:12).</p><p>И это ограничение питья есть часть сухоядения. Хотя там, где воздержание от вина либо требуется Богом, либо дано в обете человеком, надо понимать также стеснение и в пище, задающее образец питью. Какова еда, таково и питьё. Неправдоподобно, чтобы кто-то принёс Богу половину чрева, трезвый от воды и пьяный от яств.</p><p>А знал ли сухоядения и апостол, тот, кто прославлял большее — голод, жажду и частые посты (2 Кор. 11:27), кто отвергал пьянство и пиршества (Рим. 13:13), — достаточно доказывает ученик Тимофей. Из-за желудка и частых недугов он увещевает его употреблять немного вина (1 Тим. 5:23), от которого тот воздерживался не по уставу, а по благочестию (будь это не обет, желудку больше помогла бы привычка). Этим самым он и подтвердил, что воздержание от вина достойно Бога, хотя и отговорил от него по необходимости.</p><h2>10. Стояния и девятый час</h2><p>Точно так же они нападают на наши стояния как на недостойные, а некоторые, продлённые до вечера, обвиняют как новшество, говоря, что и это служение надо исполнять по своей воле и не держать дольше девятого часа, разумеется, по их обычаю.</p><p>О запрете вообще я отвечу разом по всем пунктам. Теперь же о своём предмете, то есть о мере времени, скажу: прежде надо спросить их, откуда они берут этот образец окончания стояний в девятом часу. Если потому, что Пётр и бывшие с ним, как мы читаем, шли в храм в девятый час молитвы (Деян. 3:1), то кто докажет мне, что они в тот день совершали стояние, чтобы считать девятый час концом и завершением стояния? Скорее найдёшь, что Пётр в шестом часу поднялся наверх помолиться, собираясь поесть (Деян. 10:9–10): значит, скорее шестой час мог бы завершать это служение, раз он как будто оканчивал его после молитвы.</p><p>И раз в той же книге Луки указан и третий час молитвы, когда посвящённых Духом Святым сочли пьяными (Деян. 2:15), и шестой, когда Пётр поднялся наверх, и девятый, когда вошли в храм, почему нам не понять так: при полном безразличии всегда, всюду и во всякое время молиться эти три часа, как особо заметные в человеческих делах, разделяющие день, различающие занятия, отмечаемые всенародно, так и в молитвах Божиих были особо торжественны? Об этом говорит и пример Даниила, молившегося три раза в день (Дан. 6:10), разумеется, в определённые часы, и притом самые заметные, впоследствии апостольские: третий, шестой, девятый. Поэтому и о Петре я скажу, что он соблюдал девятый час скорее по древнему обычаю, молясь в третий раз последней молитвой.</p><p>Это сказано ради тех, кто думает, будто следует образцу Петра, которого не знает. Мы не отвергаем девятый час, которым большей частью заканчиваем и среду, и пятницу. Но то, что соблюдается по преданию, надо тем более достойно обосновывать, чем меньше оно опирается на Писание, пока его не утвердит или не исправит какой-нибудь небесный дар. «Если же вы о чём иначе мыслите, то и это Бог вам откроет» (Флп. 3:15).</p><p>Итак, оставив пока Параклета, подтверждающего всё это, вождя всей истины, спрошу: не приводите ли вы менее достойного основания для соблюдения девятого часа? Ведь если Пётр тогда совершал стояние, основание надо приписать и ему. Оно идёт от смерти Господа. Вспоминать о ней надо всегда, без различия часов, но острее нас обязывает к этому именно само слово «стояние»: и воины, никогда не забывая присяги, особенно строго подчиняются на постах. Поэтому и стеснение надо соблюдать до того часа, когда мир, с шестого часа окутанный тьмой, совершил скорбное служение умершему Господу, и вернуться к радости нам тогда же, когда и миру вернулся свет.</p><p>Если это лучше согласуется с христианским благочестием, потому что больше прославляет славу Христа, я могу таким же образом, по тому же порядку событий, установить и основание позднего стояния: поститься до вечера, ожидая времени погребения Господа, когда Иосиф испросил и снял тело и положил его в гробницу. Отсюда нечестиво подкреплять плоть рабов раньше плоти Господина. Но это я говорю, вызванный их доводами, отражая догадки догадками, думаю, более верными.</p><p>Посмотрим, не защищает ли нас что-нибудь подобное и из древности. В Исходе, когда Моисей сражался с Амаликом молитвами и держался так до захода солнца (Исх. 17:12), разве это не было поздним стоянием? Думаем ли мы, что Иисус Навин, побивая аморреев, обедал в тот день, когда приказал стихиям стоять? «Стой, солнце, над Гаваоном, и луна, над долиною Аиалонскою! И остановилось солнце, и луна стояла, доколе народ мстил врагам своим… и стояло солнце среди неба и не спешило к западу почти целый день. И не было такого дня ни прежде ни после того, в который Господь так слышал бы глас человеческий» (Нав. 10:12–14) — разумеется, такого длинного, равного с солнцем человека, столько времени усердного в служении, совершавшего стояние дольше вечера.</p><p>Сам Саул, будучи на войне, прямо предписал это служение: «Проклят, кто вкусит хлеба до вечера, доколе я не отмщу врагам моим» (1 Цар. 14:24). И весь народ его не ел, и вся земля не обедала. Бог придал такую власть объявлению этого стояния, что Ионафан, сын Саула, по неведению о посте до вечера отведав мёду, вскоре был по жребию уличён и едва освобождён от опасности молитвой народа: он был виновен в чревоугодии, хотя и нечаянном.</p><p>И Даниил, в первый год царя Дария, когда постился во вретище и пепле, исповедуясь Богу, говорит: «И когда я ещё продолжал молитву, муж Гавриил, которого я видел прежде в видении, быстро прилетев, коснулся меня около времени вечерней жертвы» (Дан. 9:21). Вот и позднее стояние: постясь до вечера, оно приносит Богу тучную молитву.</p><h2>11. Новшество или восстановление?</h2><p>Всё это, думаю, неизвестно тем, кого смущают наши обычаи, или, может быть, известно лишь из чтения, но не из внимания, как и бывает с большинством невежд в славнейшем множестве душевных. Поэтому мы прошли по отдельности все виды: посты, сухоядения, стояния. Рассмотрев по обоим Заветам, сколько приносят пользы отказ от пищи, её сокращение и отсрочка, мы опровергаем тех, кто подрывает это как пустое. Показав, что это всегда было в строе благочестия, мы обличаем тех, кто обвиняет это как новое: нет нового в том, что было всегда, и нет пустого в том, что полезно.</p><p>Ясно и то, что одни из этих служений, предписанные Богом человеку, образовали закон, другие, принесённые человеком Богу, исполнили обет. Но и обет, принятый Богом, становится на будущее законом, по авторитету Принявшего: одобрив сделанное, Он тем самым велел делать это и дальше.</p><p>Так рушится и тот другой довод противной стороны: либо это лжепророчество, если эти торжественные обряды установил духовный голос, либо ересь, если их выдумала человеческая дерзость. Порицая образец, которым шла и древность, и обращая против неё то, что могли бы сказать враги древних, они должны либо отвергнуть и то, либо принять и это, тем более что и это, каков бы ни был его установитель, духовный или только верующий, служит тому же Богу, что и древнее. Ведь ересь и лжепророчество у нас, у всех служителей единого Бога Творца и Христа Его, определяются разностью божества. Поэтому я безразличен к этой стороне спора и предоставляю им выбирать, где встать.</p><p>«Это дух диавола», — говоришь ты, душевный. Но как же он предписывает служение нашему Богу и никому другому? Либо утверждай, что диавол заодно с нашим Богом, либо пусть Параклет считается сатаной. «Но это человек-антихрист», — утверждаешь ты: так Иоанн называет еретиков. Как же такой человек, кем бы он ни был, установил это служение нашему Господу во Христе нашем, когда служение антихристов обращено против нашего Христа? Какой же стороне подтверждён у нас дух, думаешь ты,[14] когда он повелевает или когда одобряет то, что наш Бог всегда и повелевал, и одобрял?</p><p>Но вы снова ставите Богу межевые столбы: как в благодати, так и в уставе, как в дарованиях, так и в торжественных обрядах, чтобы Его служения прекратились так же, как и Его благодеяния, и отрицаете, что Он и доныне налагает обязанности, потому что и здесь «Закон и пророки до Иоанна». Остаётся вам отнять всё, раз вы так праздны.</p><h2>12. Сытые мученики</h2><p>Вы ведь и в этом деле «уже пресытились, уже обогатились, стали царствовать» (1 Кор. 4:8): не вините себя в грехах, которые надо стирать постами, не нуждаетесь в знании откровений, добываемых сухоядениями, не боитесь своих войн, рассеиваемых стояниями.</p><p>Если бы Параклет и умолк со времён Иоанна, мы сами стали бы себе пророками, прежде всего вот почему: уже не для того, чтобы умилостивить гнев Божий или получить Его защиту и милость, а чтобы своими силами подготовиться к условиям последних времён, предписывая всякое смирение: надо ведь выучить темницу, упражняться в голоде и жажде, привыкать терпеть и отсутствие пищи, и тягостную пищу. Христианин должен войти в темницу таким, каким вышел бы из неё, и там терпеть не наказание, а дисциплину, не муки мира, а свои обычные упражнения. Тогда он выйдет на бой из заключения ещё увереннее: у него не будет плоти, в которой находили бы материал пытки. Он будет защищён одной сухой кожей, как панцирем, и окажется роговым против когтей. Сок крови уже выслан им вперёд, как обоз души, а скоро поспешит за ним и сама душа, которая, часто постясь, уже знает смерть вблизи.</p><p>А вы, конечно, устраиваете в темницах харчевни для сомнительных мучеников, чтобы они не искали привычного, чтобы им не опротивела жизнь, чтобы их не соблазнил новый устав воздержания, к которому не прикасался и этот ваш Пристин, не христианский мученик.[15] Вы его, откормленного какое-то время при возможности свободного содержания, водили по всем баням, будто они лучше крещения, по всем укромным местам роскоши, будто они святее Церкви, по всем соблазнам этой жизни, будто они дороже вечной, думаю, чтобы он не захотел умирать. Наконец, в самый день суда, средь бела дня, вы напоили его приправленным вином, как противоядием, и так его расслабили, что от нескольких когтей он только ощутил щекотку (это чувствовало опьянение) и не смог ответить наместнику, спросившему, какого Господа он исповедует. Вздёрнутый за это на дыбу, он издавал лишь икоту и отрыжку и переваривал при самом отречении.</p><p>Вот почему проповедующие устав трезвости — лжепророки, вот почему его соблюдающие — еретики. Что же вы медлите поверить Параклету, которого отрицаете в Монтане, — в Апиции?[16]</p><p>Вы заявляете, что торжественные обряды этой веры установлены Писанием или преданием старцев и нельзя прибавлять никакого соблюдения: новшество недозволено. Стойте на этом, если сможете.</p><h2>13. Вы сами постите и по своей воле</h2><p>Ведь вот я застаю вас за постами и помимо Пасхи, вне тех дней, когда отнят Жених, вы вставляете полупосты стояний, а иногда живёте на хлебе и воде, как кому покажется. На это вы отвечаете, что это делается по своей воле, а не по приказу. Значит, вы сдвинулись с места, выйдя за предание, делая то, что не установлено.</p><p>Что же это за дело: разрешать своей воле то, чего не даёшь приказу Божию? Больше будет дозволено человеческой воле, чем божественной власти? Я помню, что я свободен от мира, а не от Бога. Как мне принадлежит добровольно совершать служение Господу, так Ему принадлежит предписывать. Я должен не только повиноваться Ему, но и угождать; первое я оказываю Его приказу, второе — своей воле.</p><p>Хорошо и то, что и епископы имеют обыкновение предписывать посты всему народу. Не говорю о старании собрать пожертвования, по вашей корысти, а иногда и по какой-нибудь церковной заботе. Если и по указу человека вы все разом совершаете смирение, как можете вы осуждать у нас самое единство постов, сухоядений и стояний? Разве что мы грешим против постановлений сената и указов государей, запрещающих сборища.[17]</p><p>Дух Святой, проповедуя в каких хотел землях и через каких хотел людей, из предвидения надвигающихся искушений церковных или бедствий мирских, как Параклет, то есть заступник, чтобы умолить Судью, заповедовал такие лекарства служений. Положим, теперь ради упражнения в уставе трезвости и воздержания: мы, принимающие Его, по необходимости соблюдаем и установленное Им тогда. Посмотри на иудейские календари, и не найдёшь ничего нового: что заповедано отцам, всё потомство хранит с наследственным благочестием.</p><p>Кроме того, по Греции в определённых местах проводятся собрания от всех Церквей, на которых в общем обсуждаются более важные вопросы и с великим почтением прославляется само собрание всех, носящих христианское имя.[18] И как это достойно: под руководством веры собираться отовсюду ко Христу! «Как хорошо и как приятно жить братьям вместе!» (Пс. 132:1). Это ты не сумеешь легко пропеть, кроме как когда обедаешь с многими. А те собрания предварительно проводятся в стояниях и постах: они умеют скорбеть со скорбящими и только потом радоваться с радующимися. Если и мы в разных областях, представленные друг другу в духе, совершаем те торжественные обряды, которые поддержало слово, присутствовавшее тогда, то это закон таинства.</p><h2>14. «Галатство» и Пасха</h2><p>Значит, соблюдая времена, дни, месяцы и годы, мы становимся галатами? Да, если мы соблюдаем иудейские обряды и законные торжества: этому апостол и отучает, пресекая продолжение Ветхого Завета, погребённого во Христе, и утверждая Новый. Но если новому состоянию во Христе подобают и новые торжества, а если бы апостол совершенно изгладил всякое почитание времён, дней, месяцев и лет, то почему мы совершаем Пасху по годовому кругу в первый месяц? Почему потом пятьдесят дней проводим во всяком ликовании? Почему посвящаем стояниям среду и пятницу, а посту — день приготовления?[19] Вы же порой продолжаете пост и на субботу, хотя в субботу можно поститься только на Пасху, по причине, объяснённой в другом месте. Для нас же всякий день свят общим освящением. Значит, у апостола нет основания для различия: он разделяет новое и ветхое. Но и здесь ваше неравенство смешно: вы упрекаете нас за образец древности, обвиняя за новизну.</p><h2>15. Сколь мало мы запрещаем</h2><p>Он осуждает и тех, кто велит воздерживаться от пищи, но по предвидению Святого Духа, заранее осуждая еретиков, которые будут предписывать постоянное воздержание, чтобы разрушать и презирать дела Творца. Таких я найду у Маркиона, у Татиана, у Юпитера,[20] нынешнего еретика из пифагорейцев, но не у Параклета.</p><p>Как мал у нас запрет на пищу! Две недели сухоядения в год, и то не полностью, без суббот и воскресений, мы приносим Богу, воздерживаясь от того, что не отвергаем, а откладываем.</p><p>А пиша к римлянам, он колет вас, хулителей этого служения: «Ради пищи не разрушай дела Божия» (Рим. 14:20). Какого дела? Того, о котором сказано: «Лучше не есть мяса, не пить вина» (Рим. 14:21). «Кто сим служит Христу, тот угоден Богу» (Рим. 14:18). «Ибо иной уверен, что можно есть всё, а немощный ест овощи. Кто ест, не уничижай того, кто не ест… Кто ты, осуждающий чужого раба?.. Кто ест, для Господа ест, ибо благодарит Бога; и кто не ест, для Господа не ест, и благодарит Бога» (Рим. 14:2–6). Если он запрещает спор о человеческой воле, насколько больше о Божественной! Он умел осуждать некоторых строгих ограничителей пищи, воздерживающихся из отвращения, а не из служения, и одобрял тех, кто постится в честь Творца, а не в поношение.</p><p>И хотя он отдал тебе ключи от рынка, разрешив в пищу всё, кроме идоложертвенного, но не заключил в рынке Царство Божие. «Царство Божие не пища и питие» (Рим. 14:17) и «Пища не приближает нас к Богу» (1 Кор. 8:8). Не думай, что сказано о сухой пище: скорее о жирной и изысканной. Прибавляя: «едим ли мы, ничего не приобретаем; не едим ли, ничего не теряем», он обращается скорее к тебе, кто думает приобрести, если поест, и потерять, если не поест, и потому хулит это.</p><p>И как недостойно ты толкуешь в пользу своей похоти Господа, который ел и пил где попало! Но думаю, Он и постился, Он, назвавший блаженными не сытых, а алчущих и жаждущих (Мф. 5:6); Он, говоривший о пище не той, что думали ученики, а о совершении дела Отца (Ин. 4:34); учивший созидать пищу, пребывающую в жизнь вечную (Ин. 6:27), в обычной молитве повелевая просить хлеба, а не богатств Аттала.[21]</p><p>Так и Исаия не отрицал, что Бог избрал пост, а перечислил, какой Он не избрал: «Вот, в день поста вашего вы исполняете волю вашу и требуете тяжких трудов от других. Вот, вы поститесь для ссор и распрей и для того, чтобы дерзкою рукою бить других: такой ли пост Я избрал?» (Ис. 58:3–5). А какой избрал, он добавил и добавлением не отнял, а утвердил. Хотя Бог предпочитает дела правды, но не без жертвы, а это и есть душа, истязаемая постами.</p><h2>16. Бог наказывал чревоугодие</h2><p>Вот Бог, Которому не угодил ни невоздержанный в чреве народ, ни священник, ни пророк. Доныне остаются памятники похоти (Чис. 11:34), где погребён народ, столь жадный до мяса, что объелся перепелами до холеры. Падает перед дверьми храма старец Илий, сыновья его гибнут в бою, невестка умирает в родах (1 Цар. 4). Этот удар заслужил от Бога бесстыдный дом, обманывавший с плотскими жертвами.</p><p>Самей, человек Божий,[22] предсказав гибель идолослужению, введённому царём Иеровоамом, когда рука царя иссохла и тотчас исцелилась и жертвенник рассыпался, отказался из-за этих знамений принять и благодарность царя. Бог запретил ему вкушать там пищи. Но вскоре, обманутый другим старцем, лгавшим о пророчестве, он безрассудно поел и, по слову Божию, бывшему тут же за столом, не был погребён у отцов: лев напал на него на пути, и, похороненный на чужбине, он заплатил наказанием за нарушенный пост (3 Цар. 13). Вот примеры народу и епископам, даже духовным, если они допустят какое-нибудь невоздержание в чреве.</p><p>Но и в преисподней предупреждение не прекратилось: там мучаются пиры в богаче, а утешаются посты в нищем, имея наставниками Моисея и пророков (Лк. 16:29). И Иоиль воскликнул: «Назначьте пост, провозгласите торжественное собрание» (Иоил. 1:14), уже тогда предвидя, что и другие апостолы и пророки установят пост и будут проповедовать служения, угодные Богу. Отсюда и те, кто угождает, наряжая идолов, украшая алтари и приветствуя их в определённые часы, зовутся совершающими служение.</p><p>И всякое смирение знают язычники. Когда небо цепенеет и год иссыхает, объявляются шествия босиком, магистраты снимают пурпур, оборачивают фасции назад, возносят молитву, обновляют жертву. А в некоторых колониях ежегодным обрядом, покрытые вретищами и посыпанные пеплом, приносят идолам голод как мольбу; бани и таверны закрыты до девятого часа. На всю площадь один огонь на жертвенниках, воды нет и в сосудах. Прямо как траур ниневитян! Иудейский пост, конечно, справляется повсюду: оставив храмы, по всему побережью, где угодно под открытым небом они возносят молитву к небу. И хотя нарядом и убранством порочат служение скорби, всё же являют верность воздержанию и вздыхают о восходе медлящей звезды.</p><p>Хорошо, что ты, бросая хулу на наши сухоядения, сравниваешь их с воздержанием жрецов Исиды и Кибелы. Я принимаю сравнение как свидетельство: из него следует, что это от Бога, раз этому подражает диавол, соперник всего Божественного. Из истины строится ложь, из благочестия лепится суеверие. Отсюда ты тем нечестивее, чем язычник усерднее. Он убивает своё чрево ради идола, а ты не хочешь ради Бога. Ведь бог твой — живот, лёгкие — храм, брюхо — жертвенник, священник — повар, Дух Святой — запах жаркого, приправы — дарования, отрыжка — пророчество.</p><h2>17. Вот ваша религия</h2><p>Старик ты, если говорить правду, ты, столь потворствующий чреву, и недаром хвалишься, что ты первый. Я всегда вижу, что ты отдаёшь Исавом, ловцом зверей: так усердно ты всюду выслеживаешь дроздов, так возвращаешься с поля своего широчайшего устава, так изнемогаешь духом. Предложи я тебе красной чечевицы с варёным суслом, ты тут же продашь все свои первенства (Быт. 25:30–34). У тебя любовь кипит в кастрюлях, вера горит на кухнях, надежда лежит на блюдах. Но больше всего у тебя любовь,[23] из-за которой твои юноши спят с сёстрами.</p><p>Придатки чрева, конечно, — разврат и распутство. Эту связь знал и апостол: сказав «не предаваясь ни пированиям и пьянству», он прибавил: «ни сладострастию и распутству» (Рим. 13:13). К обвинению твоего чрева относится и то, что у вас предстоятелям уделяют двойную честь двойной порцией, тогда как апостол дал двойную честь как братьям и предстоятелям (1 Тим. 5:17). Кто у вас святее, чем тот, кто чаще пирует, щедрее угощает, лучше подкован по части чаш? Поделом вы, люди одной души и плоти, отвергаете духовное. Если бы таким нравились пророки, они не были бы моими.</p><p>Почему же вы не проповедуете твёрдо: «Станем есть и пить, ибо завтра умрём» (1 Кор. 15:32)? Как мы не сомневаемся открыто заповедать: будем поститься, братья и сёстры, чтобы не умереть завтра. Открыто отстоим свои уставы. Мы твёрдо знаем, что живущие по плоти Богу угодить не могут (Рим. 8:8), не вообще в сущности плоти, а в заботе, в склонности, в деле, в воле.</p><p>Худоба нам не неприятна: Бог не даёт плоть на вес, как и духа не даёт мерой (Ин. 3:34). Может быть, легче войдёт в тесные врата спасения плоть более тонкая (Мф. 7:14), скорее воскреснет плоть более лёгкая, дольше продержится в могиле плоть более сухая. Пусть откармливаются борцы и олимпийские кулачные бойцы: им подобает забота о теле, им нужна сила. И всё же и они крепнут сухоядением. У нас иные силы, иная мощь, как и иные состязания: у нас брань не против плоти и крови, а против мировых властей, против духов злобы (Еф. 6:12). Против них надо стоять не плотью и кровью, а верой и сильным духом. А разжиревший христианин, может быть, больше понадобится медведям и львам, чем Богу; разве что и против зверей ему надо будет упражняться в худобе.</p>",
"references": "<ol><li><p>Душевные (лат. psychici, от 1 Кор. 2:14: «душевный человек не принимает того, что от Духа Божия») — насмешливое имя, которое Тертуллиан-монтанист даёт православным христианам, не принявшим «нового пророчества». Себя он причисляет к «духовным» (spiritales).</p></li><li><p>Botuli — кровяные колбасы, начинённые кишки. Грубая насмешка: у таких людей и снаружи и внутри — одно нутро.</p></li><li><p>Монтан, Присцилла и Максимилла — основатели «нового пророчества» (вторая половина II века, Фригия).</p></li><li><p>Стояния (лат. stationes, букв. «караулы») — посты по средам и пятницам, обычно до девятого часа, то есть примерно до трёх пополудни.</p></li><li><p>Сухоядение (греч. ксерофагия) — пост, при котором едят только сухую пищу, без мяса, бульонов и сочных плодов; см. гл. 15.</p></li><li><p>Тертуллиан понимает сон Адама (Быт. 2:21, в греч. и лат. «исступление», ekstasis) как пророческий экстаз; ср. слова Адама в Быт. 2:23–24, истолкованные у Павла.</p></li><li><p>Исх. 34:28–30: лицо Моисея сияло, и народ боялся подойти.</p></li><li><p>В Синодальном переводе: «не утомляется и не изнемогает». Тертуллиан читает «не алчет» по Септуагинте.</p></li><li><p>В книге Ионы пост не назван трёхдневным; Тертуллиан, вероятно, связывает его с тремя днями пути через город (Ион. 3:3).</p></li><li><p>В Дан. 2:16 срок не назван, а пост не упомянут; Тертуллиан дополняет рассказ. Шесть дней поста Даниила ниже — из Дан. 14:31 (добавление о Виле и драконе), где ангел приносит ему обед через Аввакума.</p></li><li><p>Латинское miserabilis, «достойный милосердия» (у Тертуллиана здесь и в гл. 9), передаёт иной текст, чем Синодальный «муж желаний».</p></li><li><p>Упоминание поста есть в греческих рукописях Деян. 10:30 византийской традиции; Синодальный перевод его сохраняет.</p></li><li><p>Эти слова есть в Септуагинте; в Синодальном: «и бритва не коснётся головы его». Ср. Суд. 13:7.</p></li><li><p>Quo laterum — фраза в PL испорчена; передан общий смысл.</p></li><li><p>О Пристине больше ничего не известно. Тертуллиан издевается над казусом «мученика», отрёкшегося в пьяном виде.</p></li><li><p>Апиций — знаменитый римский гурман эпохи Тиберия, символ обжорства.</p></li><li><p>Намёк на запрет незаконных сообществ (collegia); Тертуллиан иронически ставит «душевных» на сторону гонителей.</p></li><li><p>Одно из ранних свидетельств о церковных соборах.</p></li><li><p>Parasceve — пятница. Вероятно, Великая Пятница.</p></li><li><p>Лицо неизвестное; имя Jupiter может быть и искажённым.</p></li><li><p>Аттал III, пергамский царь, чьё богатство вошло в пословицу.</p></li><li><p>Тертуллиан отождествляет безымянного человека Божия из 3 Цар. 13 с пророком Самеем (3 Цар. 12:22).</p></li><li><p>Игра слов: агапа — и христианская любовь, и трапеза любви (1 Кор. 13:13). Слова о спящих с сёстрами — злая клевета на эти трапезы, повторяющая то, что язычники говорили о христианах вообще.</p></li></ol><p>Перевёл Родион Власов, с использованием ИИ. Перевод с латинского по тексту Patrologia Latina, т. 2, стб. 953–978; неясные места сверены с английским переводом из Ante-Nicene Fathers, т. 4. Ссылки на Писание приведены к Синодальному переводу; ошибочные ссылки издания PL исправлены.</p>",
