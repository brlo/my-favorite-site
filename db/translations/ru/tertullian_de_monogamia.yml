"src": "4xbT_О_единоженстве",
"title": "О единобрачии",
"title_sub": "Перевод с латинского",
"meta_desc": "Тертуллиан-монтанист доказывает, что христианину позволен только один брак в жизни: второй брак после смерти супруга он приравнивает к прелюбодеянию.",
"body": "<p><strong>Тертуллиан написал это сочинение в поздний период творчества, уверовав в Монтана и приняв ереси монтанистов.</strong></p><h2>1. Между еретиками и душевными</h2><p>Еретики упраздняют брак, душевные[1] его навязывают. Те не женятся и однажды, эти — не однажды. Что тебе делать, закон Творца? Между чужими скопцами и своими лихими возницами ты жалуешься на послушание своих не меньше, чем на презрение чужих. И те, кто злоупотребляет тобой, вредят тебе так же, как те, кто тобой не пользуется.[2]</p><p>Но нельзя ни хвалить такое воздержание, потому что оно еретическое, ни защищать такую вольность, потому что она душевная. Первое богохульствует, вторая распутствует. Первое разрушает Бога брака, вторая Его позорит. У нас же, кого по праву зовут духовными за признание духовных дарований, и воздержание благочестиво, и вольность скромна, потому что то и другое заодно с Творцом. Воздержание чтит закон брака, вольность его умеряет. Первое не вынуждается, вторая управляется. Первое решается свободно, вторая знает меру.</p><p>Мы знаем один брак, как и единого Бога. Закон брака приносит больше чести там, где есть и стыдливость. Но душевным, не принимающим Духа, не нравится то, что от Духа. А раз не нравится то, что от Духа, будет нравиться то, что от плоти, как противное Духу. «Плоть желает противного Духу, а дух — противного плоти» (Гал. 5:17). А чего желать плоти, как не того, что больше от плоти? Поэтому она уже в начале стала чужой Духу: «Не вечно Духу Моему быть пренебрегаемым человеками, потому что они плоть» (Быт. 6:3).</p><h2>2. Мог ли Параклет дать новое?</h2><p>Итак, они попрекают устав единобрачия как ересь. И ни по какой другой причине не вынуждены они отрицать Параклета, как потому, что считают Его учредителем нового устава, и притом жесточайшего для них. Поэтому сначала надо рассмотреть вопрос вообще: мог ли Параклет учить такому, что можно посчитать либо новым вопреки вселенскому преданию, либо обременительным вопреки лёгкому бремени Господню (Мф. 11:30)?</p><p>Об обоих предметах высказался Сам Господь. Сказав: «Ещё многое имею сказать вам, но вы теперь не можете вместить. Когда же приидет Он, Дух истины, то наставит вас на всякую истину» (Ин. 16:12–13), Он достаточно заранее показал, что Тот будет делать вещи, которые могут показаться и новыми, поскольку раньше не были объявлены, и довольно обременительными, поскольку потому и не были объявлены.</p><p>«Значит, — говоришь ты, — по этому рассуждению Параклету можно приписать что угодно новое и тяжёлое, даже если это от духа противника». Вовсе нет. Дух противника был бы виден по несогласию проповеди: он прежде всего извратил бы правило веры, а потом и порядок устава. Что стоит на первой ступени, то и портится прежде, а это вера, которая предшествует уставу. Человек должен сначала стать еретиком в учении о Боге, а потом уже в обычаях. Параклет же, имея научить многому, что Господь оставил до Него по предопределённому порядку, сначала засвидетельствует о Самом Христе, в Которого мы веруем, со всем устроением Бога Творца, прославит Его и напомнит о Нём. Узнанный так по главному правилу, Он откроет то многое, что касается устава. Порукой этому будет целостность проповеди, пусть эти устроения и новые, потому что открываются теперь, пусть и тяжёлые, потому что и теперь их не выносят. Но принадлежат они не другому Христу, а Тому, Кто сказал, что имеет ещё многое, чему научит Параклет: для этих людей оно не менее тяжело, чем для тех, кто ещё не мог этого вынести.</p><h2>3. У апостола брак лишь разрешён</h2><p>Тяжело ли единобрачие, пусть судит всё ещё бесстыдная немощь плоти. Новое ли оно, это мы пока установим. Скажу даже больше: если бы Параклет сегодня определил полное и совершенное девство или воздержание, так что и одним браком не позволил бы унять пыл плоти, то и тогда, кажется, Он не вводил бы ничего нового. Сам Господь открывает Царство Небесное скопцам (Мф. 19:12), Он и Сам был скопцом. Глядя на Него и апостол сделал себя скопцом и предпочитает воздержание.</p><p>«Но, — говоришь ты, — при сохранении права вступать в брак». Да, при сохранении, а мы посмотрим, до каких пор. Уже тем оно разрушено с той стороны, что он предпочитает воздержание. «Хорошо человеку не касаться женщины» (1 Кор. 7:1). Значит, касаться плохо: ведь добру ничего не противоположно, кроме зла. Потому он и говорит: «Остаётся, чтобы имеющие жён были как не имеющие» (1 Кор. 7:29); тем более не имеющие не должны заводить. Он называет и причины такого совета: неженатые заботятся о Боге, а женатые о том, как угодить в браке (1 Кор. 7:32–33).</p><p>Я могу утверждать: не чистое добро то, что лишь разрешается. Чистое добро не разрешается, а дозволено само собою. У разрешения есть причина, иногда и вынужденная. И здесь разрешающий брак не желает его. Он хочет другого: «Желаю, чтобы все люди были, как и я» (1 Кор. 7:7). Показывая, что это лучше, чего же он желает, если не того, что назвал лучшим? Значит, если он разрешает другое, чем то, чего хотел, разрешая не по желанию, а по необходимости, он показывает, что не чистое добро то, что он неохотно позволил.</p><p>Говоря: «Лучше вступить в брак, нежели разжигаться» (1 Кор. 7:9), что он называет добром? То, что лучше наказания? То, что может показаться лучшим только в сравнении с наихудшим? Добро то, что держит это имя само по себе, без сравнения не только со злом, но и с другим добром. Даже если бы его затмило сравнение с другим добром, оно всё равно осталось бы добром. А если только сравнение со злом вынуждает называть его добром, то это не столько добро, сколько разновидность меньшего зла: большее зло его затмевает, и оно получает имя добра. Убери условие, не говори: «Лучше вступить в брак, нежели разжигаться», — и я спрошу, смеешь ли ты сказать: «Лучше вступить в брак», не прибавляя, чем лучше. Значит, это уже не лучше, а раз не лучше, то и не добро, с устранением условия, которое, делая его лучшим, заставляет считать его добром. Лучше потерять один глаз, чем два; но оставь сравнение двух зол, и не будет лучше иметь один глаз, потому что это не добро.</p><p>А что, если всё это снисхождение к браку он даёт от себя, то есть от человеческого разумения, по указанной необходимости? Ведь обратившись затем к другому вопросу, он говорит: «А вступившим в брак не я повелеваю, а Господь» (1 Кор. 7:10), показывая, что сказанное выше было не Господней властью, а человеческим соображением. Вернувшись же к воздержанию, он говорит: «Желаю, чтобы все были, как и я» и «думаю, что и я имею Духа Божия» (1 Кор. 7:7, 40), — чтобы отозвать властью Святого Духа то, что позволил по необходимости.</p><p>И Иоанн, увещевая, чтобы мы поступали, как и Господь (1 Ин. 2:6), конечно, увещевал поступать и в святости плоти, и говорит это совершенно ясно: «Всякий, имеющий сию надежду на Него, очищает себя, так как Он чист» (1 Ин. 3:3). И в другом месте: «Будьте святы, как и Он был свят» (1 Пет. 1:16),[3] разумеется, во плоти. О духе он не сказал бы, потому что дух сам собою признаётся святым и не ждёт увещания к святости, которая есть его природа. А плоть учится святости, и плоть во Христе была свята.</p><p>Итак, если всё это изглаживает вольность брака и рассмотрением её условия, и предпочтением воздержания, то почему не мог после апостолов тот же Дух, придя, чтобы постепенно, по ступеням времён, вести устав ко всей истине (Екклесиаст говорит: «Всему своё время»), наложить теперь на плоть последнюю застёжку? Он уже не окольным путём отзывает от брака, а прямо, раз время теперь стало ещё более сжатым, спустя примерно сто шестьдесят лет. Разве не сам ты рассудил бы так? Этот устав древний: он показан ещё в плоти Господа и в Его воле, потом и в советах, и в примерах Его апостолов. Мы давно предназначены к этой святости.</p><p>Параклет не вводит ничего нового. То, что Он предупредил, теперь определяет; то, что терпел, теперь требует. Обдумав это, ты легко убедишься: тем более подобало Параклету проповедовать один брак, что Он мог и никакого, и надо скорее поверить, что Он смягчил то, что приличнее было бы отнять, если понимать, чего хочет Христос. И в этом ты должен признать Параклета заступником: от полного воздержания Он освобождает твою немощь.</p><h2>4. Начало рода человеческого</h2><p>Оставим теперь упоминание Параклета, будто Он какой-то наш частный учитель. Развернём общие всем древние книги Писаний. Мы докажем именно это: устав единобрачия не нов и не чужд, но древен и принадлежит христианам. Тогда ты поймёшь, что Параклет скорее восстановитель его, чем учредитель.</p><p>Что касается древности, какой образец можно указать древнее самого замысла о роде человеческом? Одну женщину создал Бог мужчине, вынув одно ребро, хотя их было много. И в самом начале этого дела Он говорит: «Не хорошо быть человеку одному; сотворим ему помощника» (Быт. 2:18). Сказал бы «помощников», если бы предназначал ему многих жён. И прибавил закон на будущее. Пророчески сказано: «И будут двое одна плоть» (Быт. 2:24), не трое и не более. Если больше, то уже не двое. Закон устоял: союз супругов пребыл у родоначальников до конца, не потому что не было других женщин, а потому и не было их, чтобы первые плоды рода не осквернились двойным браком. Если бы Бог захотел, они могли бы быть: взял бы он из множества своих дочерей, ведь Ева была ему не меньше от костей и плоти его, если бы это было благочестиво.</p><p>Первое злодеяние — убийство — совершилось в братоубийстве, и никакое другое не заслужило второго места так, как двоежёнство. Нет разницы, имел ли кто две жены по очереди или разом: одно и то же число, и соединённых, и разделённых. Лишь однажды устав Божий претерпел насилие от Ламеха (Быт. 4:19) и затем устоял до конца того рода. Другой Ламех с двумя жёнами не появляется. Писание отрицает то, чего не отмечает. Иные беззакония навлекли потоп, каковы бы они ни были, отмщённые однажды, но не семьдесят раз всемеро, как заслужили два брака (Быт. 4:24).</p><p>И обновление второго рода человеческого имеет матерью единобрачие: снова двое в одном браке. Единобрачие видно и у самих животных, чтобы и звери не рождались от прелюбодеяния. Сказано: «Введи также в ковчег из всех животных, и от всякой плоти по паре, чтобы они остались с тобою в живых: мужеского пола и женского будут они. Из птиц по роду их, и из скотов по роду их, и из всех пресмыкающихся по земле по роду их, из всех по паре войдут к тебе» (Быт. 6:19–20). По тому же образцу велено и семь пар взять из самца и самки, одного и одной (Быт. 7:2–3). Что сказать больше? И нечистым птицам не позволено было входить с двумя самками.</p><h2>5. Всё возвращается к началу</h2><p>Вот свидетельство начал, защита нашего происхождения, предрешение божественного установления. А это, разумеется, закон, а не памятник: раз так было с начала, мы видим, что Христос направляет нас к началу. В вопросе о разводе, говоря, что Моисей разрешил его по жестокосердию, а от начала не было так (Мф. 19:8), Он, несомненно, возвращает к началу нерасторжимость брака. Значит, тех, кого Бог с начала соединил в одну плоть, сегодня человек не разлучит (Мф. 19:6).</p><p>И апостол пишет ефесянам, что Бог предположил в Себе, в устроении полноты времён, всё возглавить, то есть возвратить к началу во Христе, всё небесное и земное (Еф. 1:9–10). Так и Господь надел на Себя две буквы греческого алфавита, первую и последнюю, образы начала и конца, сходящихся в Нём (Откр. 1:8; 22:13). Как альфа движется до омеги и омега возвращается к альфе, так Он показывает, что в Нём и бег начала к концу, и возвращение конца к началу, чтобы всё устроение, завершаясь в Том, Кем началось, то есть в Слове Божием, ставшем плотью, завершилось так же, как и началось.</p><p>И всё во Христе настолько возвращается к началу, что вера обратилась от обрезания к целости той плоти, какой она была от начала; и свобода в пище с воздержанием только от крови, как было от начала; и нерасторжимость брака, как было от начала; и запрет развода, которого от начала не было; и наконец, весь человек призывается обратно в рай, где был от начала. Почему же он не должен вернуть туда хотя бы единобрачного Адама, если не может вернуть его таким нетронутым, каким тот оттуда вышел?</p><p>Итак, что касается восстановления начала, от тебя требуют этого и устроение Божие, и твоя надежда: то, что было от начала, по началу, которое считается в Адаме и пересчитывается в Ное. Выбери, кто из них твоё начало. В обоих тебя связывает строгость единобрачия.</p><p>А если начало ведёт к концу, как альфа к омеге, и конец возвращает к началу, как омега к альфе, и так наш счёт переносится на Христа, душевного на духовного, ибо не духовное прежде, но душевное, потом духовное (1 Кор. 15:46), то посмотрим, не должен ли ты то же самое и этому второму счёту. Не следует ли тебе быть в том же виде, в каком и последний Адам, в каком и первый? Последний Адам, то есть Христос, вовсе не вступал в брак, как и первый Адам до изгнания. Но Адам более совершенный, то есть Христос, совершеннее и тем, что цельнее, уступая твоей немощи пример своей плоти, встречает тебя, если хочешь, как скопец во плоти; а если не можешь, то как единобрачный в духе: он имеет одну невесту-Церковь, по образу Адама и Евы. Эту тайну апостол толкует великой, относя её ко Христу и Церкви (Еф. 5:32), и через духовное единобрачие подтверждает плотское. Видишь: обновляя свой счёт во Христе, ты не можешь отнести его туда без исповедания единобрачия, если не будешь во плоти тем, чем Он в духе, хотя ты должен бы быть и тем, чем Он был во плоти.</p><h2>6. Авраам и другие отцы</h2><p>Но поищем ещё для себя других родоначальников. Некоторым не нравятся единобрачные родители Адам и Ной, а может быть, и Христос. Они ссылаются на Авраама, хотя им запрещено признавать другого отца, кроме Бога (Мф. 23:9). Пусть же Авраам будет нашим отцом, пусть и Павел: «Я родил вас во Христе Иисусе благовествованием» (1 Кор. 4:15).</p><p>Покажи, что ты и сын Авраама. Счёт родства в нём у тебя не свободен: есть определённое время, когда он твой отец. Если мы по вере считаемся детьми Авраама, как учит апостол, говоря галатам: «Познайте же, что верующие суть сыны Авраама» (Гал. 3:7), то когда Авраам поверил Богу, и это вменилось ему в праведность (Быт. 15:6)? Думаю, ещё в единобрачии, потому что ещё не в обрезании. А если он потом изменился в обоих отношениях, и в двоежёнство через наложницу-рабыню, и в обрезание через печать завета, то ты можешь признавать его отцом только тогда, когда он поверил Богу: ведь ты сын его по вере, а не по плоти.</p><p>А если ты следуешь позднейшему Аврааму как отцу, то есть двоежёнцу, прими и обрезанного. Отвергаешь обрезанного — отвергнешь и двоежёнца. Двух его состояний, разных между собой в двух отношениях, ты смешать не сможешь. Двоежёнцем он стал вместе с обрезанием, единобрачным был в необрезании. Принимаешь двоежёнство — прими и обрезание. Держишься необрезания — обязан и единобрачию. Ты сын единобрачного Авраама так же, как сын необрезанного. Если ты обрежешься, ты уже не сын, потому что будешь не от веры, а от печати веры, оправданной в необрезании. Вот тебе апостол: учись с галатами. Так и введя в свою жизнь второй брак, ты не сын того Авраама, чья вера предшествовала в единобрачии. Хотя потом он и назван отцом многих народов, но тех, что от веры, предшествовавшей двоежёнству, должны были считаться детьми Авраама. А что было потом, пусть смотрят те дела сами.</p><p>Одно дело прообразы, другое — образцы. Одно дело образы, другое — определения. Образы проходят, исполнившись; определения остаются, чтобы их исполнять. Образы пророчествуют, определения управляют. Что предвещало двоежёнство Авраама, учит тот же апостол, истолкователь обоих Заветов (Гал. 4:22–26), так же, как определяет, что семя наше названо в Исааке (Рим. 9:7). Если ты от свободной, принадлежа к Исааку, то он, конечно, имел один брак.</p><p>Вот в ком, думаю, я числюсь. Других не знаю. Если смотришь на их примеры, на какого-то Давида, бравшего жён даже через кровь (2 Цар. 11), на какого-то Соломона, богатого даже жёнами (3 Цар. 11:3), то, зная, что велено следовать лучшему, у тебя есть и Иосиф единобрачный и, осмелюсь сказать, этим лучше отца; есть Моисей, вблизи беседовавший с Богом; есть Аарон, первосвященник. И второй Моисей второго народа, введший наш образ в обетование Божие, на котором первом освятилось имя Господне, не был двоежёнцем.[4]</p><h2>7. Закон: левират и священники</h2><p>После древних примеров первых лиц перейдём к древним книгам законных Писаний, чтобы по порядку перебрать всё наше снаряжение. Некоторые иногда говорят, что им нет дела до закона, который Христос не нарушил, но исполнил, а иногда хватаются за то из закона, что им нужно. Мы тоже скажем, что закон отступил так: его бремена, которые, по слову апостолов, не могли вынести и отцы (Деян. 15:10), отменены, а относящееся к праведности не только сохранилось, но и расширилось, чтобы наша праведность могла превзойти праведность книжников и фарисеев (Мф. 5:20). Если праведность, то, разумеется, и целомудрие.</p><p>Закон предписывает брать жену брата, умершего бездетным, чтобы восстановить семя брату (Втор. 25:5), и по той хитрой задаче саддукеев это может случаться с одним лицом несколько раз (Мф. 22:24–28). Поэтому они думают, что и в других случаях разрешены повторные браки. Но им надо сначала понять основание самого предписания, и тогда они увидят, что оно уже прекратилось, как часть упразднённого в законе.</p><p>Вступать в брак с женой умершего бездетным брата необходимо было, во-первых, потому что ещё должно было действовать то древнее благословение: «Плодитесь и размножайтесь» (Быт. 1:28). Во-вторых, потому что грехи отцов взыскивались и с детей (Исх. 20:5). В-третьих, потому что скопцы и бесплодные считались бесчестными. И чтобы не считать проклятыми тех, кто умер бездетным не по вине природы, а упреждённый смертью, им и доставлялось заместительное, как бы посмертное потомство от их рода.</p><p>Но когда конец времён упразднил «плодитесь и размножайтесь» и апостол ввёл: «Остаётся, чтобы имеющие жён были как не имеющие, потому что время уже коротко» (1 Кор. 7:29), и сказано: «Не будут уже говорить: отцы ели кислый виноград, а у детей на зубах оскомина; но каждый будет умирать за своё беззаконие» (Иер. 31:29–30), и скопцы не только лишились бесчестия, но и удостоились милости, приглашённые в Царство Небесное, закон брака с женой брата был похоронен, и утвердилось противоположное: не вступать в брак с женой брата. Как мы сказали, переставшее действовать с прекращением основания не может служить доводом для другого.</p><p>Итак, жена по смерти мужа не выйдет замуж: а если вышла бы, то за брата, ведь все мы братья, и выходящая в Господе должна выходить не за язычника, а за брата; и древний закон запрещает брак с иноплеменниками. Но и в Левите постановлено: «Если кто возьмёт жену брата своего: это гнусно; он открыл наготу брата своего, бездетны будут они» (Лев. 20:21). Значит, несомненно, если ему запрещено повторно жениться, то и ей запрещено, ведь она может выйти замуж только за брата. Как это согласуется у апостола с законом, с которым он не во всём борется, будет показано, когда дойдём до его послания. Пока же, что касается закона, его доводы скорее за нас.</p><p>Он запрещает священникам вступать в брак повторно (Лев. 21:13–14). Дочери священника, овдовевшей или изгнанной, если у неё нет потомства, велит вернуться в дом отца и питаться его хлебом (Лев. 22:13). «Если нет потомства» сказано не для того, чтобы, имея его, она снова вышла замуж: насколько меньше она выйдет, если есть дети! Но чтобы, имея детей, кормилась скорее от сына, чем от отца, чтобы и сын исполнил заповедь Божию: «Почитай отца и мать» (Исх. 20:12).</p><p>А нас Иисус, первосвященник и великий священник Отца, облекая Собою (ведь «все вы, во Христа крестившиеся, во Христа облеклись», Гал. 3:27), «соделал священниками Богу и Отцу Своему», по Иоанну (Откр. 1:6). И юношу, спешившего на похороны отца, Он останавливает для того, чтобы показать: Он призывает нас как священников (Мф. 8:21–22), которым закон запрещал присутствовать при погребении родителей: «И ни к какому умершему не должен входить; и прикосновением к отцу своему и матери своей он не может оскверниться» (Лев. 21:11). Значит, и мы должны соблюдать этот запрет? Вовсе нет: жив наш единственный Отец — Бог, и мать — Церковь; и сами мы не мертвы, живущие Богу, и мёртвых не хороним, потому что и они живы во Христе. Но мы, бесспорно, священники, призванные Христом, должники единобрачия по древнему закону Божию, который тогда в своих священниках пророчествовал о нас.</p><h2>8. Евангелие: начало и образы</h2><p>Обратившись теперь к нашему собственному закону, то есть к Евангелию, какими примерами мы встречаемы! Пока дойдём до изречений, вот сразу, как на пороге, встречают нас две предстоятельницы христианской святости, единобрачие и воздержание: одно скромное в священнике Захарии, другое нетронутое в Предтече Иоанне; одно умилостивляющее Бога, другое проповедующее Христа; одно возвещающее совершенного священника, другое показывающее больше пророка (Мф. 11:9), то есть того, кто не только проповедал или показал Христа воочию, но и крестил Его. Кто достойнее посвятил бы тело Господа, чем плоть такая же, какая Его и зачала, и родила?</p><p>Христа родила Дева, а после рождения вышла замуж один раз,[5] чтобы оба рода святости были отмечены в чувстве Христа через Мать, деву и единобрачную. Когда Младенца принесли в храм, кто принял Его на руки? Кто в духе первым узнал Его? Муж праведный и благочестивый (Лк. 2:25), и, конечно, не двоежёнец: хотя бы для того, чтобы Христос тут же не был достойнее возвещён женщиной, старой вдовой одного мужа (Лк. 2:36–38). Она, преданная храму, сама в себе довольно показывала, какие люди должны прилепляться к духовному храму, то есть к Церкви. Таких свидетелей узнал Господь младенцем, и не других имел взрослым.</p><p>Одного Петра я нахожу женатым, по тёще (Мф. 8:14); предполагаю, что он был единобрачным, по Церкви, которая, созданная на нём, должна была ставить все степени своего клира из единобрачных. Других я женатыми не нахожу и потому должен считать их скопцами или воздержными.</p><p>Если у греков одно общее слово значит и «женщины», и «жёны», из-за удобства обычая (хотя есть и особое слово для жён), то это не значит, что мы будем толковать Павла так, будто он показывает, что у апостолов были жёны. Если бы он говорил о браке (как дальше, где апостол скорее мог бы назвать какой-нибудь пример), то правильно казалось бы сказанным: «Или не имеем власти иметь спутницею жену, как и прочие апостолы и Кифа?» (1 Кор. 9:5). Но там, где он подчиняет это тому, что показывает его воздержание в содержании, говоря: «Или мы не имеем власти есть и пить?» (1 Кор. 9:4), он показывает не жён, которых водили с собой апостолы, ведь и не имеющие жён могут есть и пить, а просто женщин, которые по тому же образу служили им, как сопровождавшие Господа (Лк. 8:2–3).</p><p>Если Христос порицает книжников и фарисеев, сидящих на Моисеевом седалище и не делающих того, чему учат (Мф. 23:2–3), как мог бы Он посадить на Своё седалище тех, кто помнил бы только заповедовать святость плоти, но не соблюдать, — ту, которую Он всячески показал, чему надо и учить, и что делать, прежде всего Своим примером, затем другими доводами. Он говорит, что Царство Небесное детей (Мф. 18:3; 19:14); делает им причастными тех, кто после брака снова становится детьми; призывает к простоте голубя (Мф. 10:16), птицы не только незлобивой, но и целомудренной, у которой одна самка знает одного самца. Он отрицает, что у самарянки есть муж, показывая, что многократный муж — прелюбодей (Ин. 4:17–18). В явлении Своей славы из стольких святых и пророков Он предпочитает иметь при Себе Моисея и Илию (Мф. 17:3), одного единобрачного, другого скопца. Ведь Илия был не кто иной, как Иоанн, пришедший в духе и силе Илии (Лк. 1:17). Этот «человек, любящий есть и пить», посещавший обеды и ужины с мытарями и грешниками (Мф. 11:19), один раз обедает на одном браке (Ин. 2:1–2), хотя женилось многие: сколько раз Он хотел быть на браке, столько хотел, чтобы брак был.</p><h2>9. Чего Бог соединил, смерть разлучает лишь для Бога</h2><p>Но пусть эти доводы сочтут скорее притянутыми догадками, если нет изречений, высказанных Господом при рассмотрении развода: когда-то разрешённый, теперь Он его запрещает. Во-первых, потому что от начала не было так, как и числа браков. Затем, потому что «что Бог сочетал, того человек да не разлучает» (Мф. 19:6), разумеется, чтобы не идти против Господа. Разлучит только Тот, Кто и соединил, а разлучит не жестокостью развода, которую Он упрекает и обуздывает, а долгом смерти: ведь и одна из двух птиц не падает на землю без воли Отца (Мф. 10:29).</p><p>Итак, если кого Бог соединил, человек не должен разлучать разводом, то так же последовательно, чтобы кого Бог разлучил смертью, человек не соединял браком. Иначе, соединив разлучённое, он пойдёт против воли Божией так же, как разлучив соединённое.</p><p>Вот что касается воли Божией, которую нельзя разрушать, и образца начала, который надо восстанавливать. Но к этому присоединяется и другое основание, вернее не другое, а то самое, что установило образец начала и побудило волю Божию запретить развод: «Кто разведётся с женою своею, кроме вины любодеяния, тот подаёт ей повод прелюбодействовать; и кто женится на разведённой, тот прелюбодействует» (Мф. 5:32). Отвергнутая не может законно вступить в брак, а если сделает это без имени брака, разве не подпадёт под обвинение в прелюбодеянии, потому что прелюбодеяние есть преступление в браке? Бог судил иначе, чем люди: всякое принятие другого мужчины, через брак или случайно, Бог объявляет прелюбодеянием.</p><p>Посмотрим, что такое брак перед Богом, и тогда так же узнаем, что такое прелюбодеяние. Брак — это когда Бог соединяет двоих в одну плоть или, застав соединёнными в той же плоти, запечатлевает союз. Прелюбодеяние — это когда двое каким бы то ни было образом разделены, а другая, вернее чужая, плоть смешивается с той, о которой нельзя сказать: «Вот, это кость от костей моих и плоть от плоти моей» (Быт. 2:23). Сделанное и сказанное однажды, от начала и теперь, не может подойти к другой плоти.</p><p>Поэтому напрасно ты скажешь, что Бог не хочет, чтобы отвергнутая при живом муже соединялась с другим, будто бы хочет этого при умершем. Если она не связана с умершим, то и с живым. Развод расторгает брак так же, как смерть: она не будет связана с тем, с кем порвано то, чем была связана. Так что нет разницы, при живом или умершем муже она выходит замуж. Она согрешает не против него, а против самой себя. «Всякий грех, какой делает человек, есть вне тела, а блудник грешит против собственного тела» (1 Кор. 6:18). Прелюбодействует же, как мы показали выше, тот, кто смешивает с собой другую плоть помимо той прежней, которую Бог или соединил в двоих, или застал соединённой.</p><p>Потому Он и отнял развод, которого от начала не было, чтобы укрепить то, что от начала было: постоянство двоих в одной плоти, чтобы не прорвалась необходимость или повод третьего соединения плотей. Развод Он разрешает только по одной причине: если опередит то, от чего предостерегает. А что развода от начала не было, видно и из того, что у римлян только после шестисотого года основания Города отмечен такой жестокий случай.[6] Но они и без развода смешиваются в прелюбодеяниях, а нам, если бы мы и развелись, не будет позволено и выйти замуж.</p><h2>10. Вдова связана с умершим</h2><p>Вижу, что отсюда нас зовут к апостолу. Чтобы легче понять его мысль, надо тем настойчивее внушить, что женщина ещё больше связана с умершим мужем, чтобы не принимать другого. Вспомним: развод либо бывает от раздора, либо вызывает раздор, а смерть приходит по закону Божию, не из-за обиды человека, и это долг всех, а не только мужей.</p><p>Итак, если отвергнутая, разделённая душой и телом через раздор, гнев, ненависть и их причины, обиду, оскорбление или какую-нибудь жалобу, связана с врагом, чтобы не сказать с мужем, то насколько больше та, которая не по своей вине и не по вине мужа, а по случаю закона Господня не разлучена с браком, а оставлена, будет принадлежать и умершему, которому и умершему должна согласие! От кого не слышала развода, от того не ушла. Кому не написала развода, с тем и пребывает. Кого не хотела потерять, того удерживает. Вольность души при ней: воображаемое пользование представляет человеку всё, чего у него нет.</p><p>Спрошу самую женщину: скажи мне, сестра, в мире ли ты отпустила вперёд мужа? Что она ответит? Или в раздоре? Тогда она ещё больше связана с тем, с кем имеет дело перед Богом. Не ушла та, что удерживается. Значит, в мире. Тогда она должна пребывать в нём с тем, от кого уже не может отказаться, потому что и при возможности развода не вышла бы замуж.</p><p>Она ведь и молится о его душе, и просит ему пока покоя и общения в первом воскресении, и приносит приношение в годовщины его успения.[7] Если она этого не делает, то настоящим образом развелась, насколько это от неё зависит, и тем несправедливее, что вообще могла, и недостойнее, что он этого не заслужил.</p><p>Или мы будем ничем после смерти? Это по какому-нибудь Эпикуру, а не по Христу. Если же верим в воскресение мёртвых, то, конечно, будем связаны с теми, с кем воскреснем и дадим отчёт друг о друге. Если в том веке не женятся и не выходят замуж, но пребывают как ангелы (Мф. 22:30), то это не значит, что мы не будем связаны с умершими супругами, раз не будет восстановления брака. Напротив, тем более будем связаны, потому что мы назначены к лучшему состоянию, чтобы воскреснуть в духовное общение, узнать и самих себя, и своих.</p><p>Иначе как будем мы вечно петь благодарение Богу, если не останется в нас чувства и памяти этого долга? Если мы будем преобразованы по сущности, но не по сознанию? Значит, те, кто будет с Богом, будут вместе, так как все у Бога одно, хотя награда и различна, хотя и обителей много у одного Отца (Ин. 14:2), трудившись за один динарий той же платы, то есть жизни вечной (Мф. 20:9–10), в которой Он тем более не разлучит соединённых Богом, чем запрещает разлучать их в этой меньшей жизни.</p><p>Раз это так, как будет свободна для другого мужа та, которая занята своим и на будущее? Мы говорим для обоих полов, хотя речь обращена к одному: устав один. Будет у неё один в духе, другой во плоти? Это будет прелюбодеянием: сознание одной женщины при двух мужьях. Если один отделён от плоти, но остаётся в сердце, там (где и мысль без соединения плотей совершает и прелюбодеяние через похоть, и брак через волю, Мф. 5:28) он и сейчас муж, владея тем самым, через что стал мужем, то есть душой. Если в ней поселится другой, это будет преступлением. Он не изгнан оттого, что ушёл от низкого общения плоти. Он муж, ещё более почётный, раз стал чище.</p><h2>11. Как просить второго брака в Церкви?</h2><p>Итак, чтобы вступить в брак в Господе, по закону и апостолу (если тебя хоть это заботит), какова ты, прося такого брака, какого не могут иметь те, у кого просишь: у единобрачного епископа, у пресвитеров и диаконов того же обета, у вдов, чьё сообщество ты в себе отвергла? Они, конечно, будут раздавать мужей и жён, как кусочки хлеба. Ведь это у них значит: «всякому просящему давай» (Мф. 5:42). И они соединят вас в девственной Церкви, единственной невесте единого Христа. И ты будешь молиться о своих мужьях, новом и старом. Выбирай, кому будешь прелюбодейкой. Думаю, обоим. Если ты благоразумна, молчи об умершем. Пусть ему будет разводом твоё молчание, написанное уже на чужом брачном договоре. Так ты заслужишь нового мужа, если забудешь старого. Ты должна больше угождать тому, ради кого предпочла не угождать Богу.</p><p>Душевные хотят, чтобы это одобрил апостол, или чтобы он вовсе об этом не подумал, когда писал: «Жена связана законом, доколе жив муж её; если же муж её умрёт, свободна выйти, за кого хочет, только в Господе» (1 Кор. 7:39). Из этого места они защищают вольность второго брака, а значит, и многих: что перестало быть один раз, открыто всякому числу.</p><p>В каком смысле писал апостол, станет ясно, если сначала установить, что он писал не в том смысле, каким пользуются душевные. Это будет установлено, если вспомнить, что не согласуется с этим местом ни в учении, ни в желании, ни в собственном правиле самого Павла. Если он разрешает второй брак, которого от начала не было, как он утверждает, что всё собирается к началу во Христе? Если он хочет, чтобы мы повторяли браки, как он отстаивает наше семя в Исааке, родоначальнике единобрачном? Как он ставит весь строй Церкви из единобрачных, если этот устав не предшествует у мирян, из которых растёт церковный строй? Как он отзывает ещё состоящих в браке от плода брака, говоря, что время коротко, если снова призывает в брак тех, кто вышел из него через смерть?</p><p>Если всё это противоречит тому месту, о котором речь, то, как мы сказали, ясно, что он писал не в том смысле, каким пользуются душевные. Легче допустить, что у одного этого места есть какое-то основание, согласное с остальным, чем что апостол, казалось бы, учил противоречиво. Это основание мы можем узнать в самом предмете.</p><p>Какой предмет побудил апостола писать такое? Новобранчество новой и только возникающей Церкви, которую он питал молоком, а не твёрдой пищей более сильного учения (1 Кор. 3:2). Из-за такого младенчества веры они ещё не знали, что им делать с потребностью плоти и пола. Сами эти случаи понятны из его ответов, когда он говорит: «А о чём вы писали ко мне, то хорошо человеку не касаться женщины. Но, во избежание блуда, каждый имей свою жену» (1 Кор. 7:1–2). Он показывает, что были застигнутые верой в браке, которые боялись, не запрещено ли им теперь пользоваться браком, потому что они уверовали в святую плоть Христову. И всё же он уступает как снисхождение, а не как приказ, то есть разрешая, а не повелевая. Он предпочитал, чтобы все были как он.</p><p>Так и отвечая о разводе, он показывает, что некоторые думали и об этом, особенно потому, что не считали нужным оставаться после обращения в браках с язычниками. Спрашивали и совета о девах (заповеди Господа не было): хорошо человеку оставаться так, то есть каким его нашла вера (1 Кор. 7:25–26). «Соединён ли ты с женою? не ищи развода. Остался ли без жены? не ищи жены. Впрочем, если и женишься, не согрешишь» (1 Кор. 7:27–28), потому что освободившемуся от жены до обращения не будет считаться второй женой та, что после обращения первая: от веры считается и сама наша жизнь.</p><p>Но здесь он говорит, что щадит их: иначе наступит скорбь плоти, по стеснённым временам отвергающим препятствия брака, и лучше заботиться о том, чтобы угодить Господу, чем мужу. И так он отзывает то, что разрешил. В той же самой главе, где определяет, чтобы каждый оставался в том звании, в каком призван (1 Кор. 7:20), он прибавляет: «Жена связана законом, доколе жив муж её; если же муж её умрёт, свободна выйти, за кого хочет, только в Господе». И отсюда видно, что понимать надо ту, которая сама была застигнута свободной от мужа, как и муж свободным от жены, то есть через смерть, а не через развод: разведённым он не разрешил бы брака вопреки прежней заповеди. Значит, женщина, вышедшая замуж, не согрешит, потому что и здесь вторым мужем не будет считаться тот, кто первый от веры. Настолько это так, что он прибавил: «только в Господе», потому что речь шла о той, что имела мужа-язычника и, потеряв его, уверовала. Это чтобы она не решила, что и после обращения может выйти за язычника; хотя душевные и об этом не заботятся.</p><p>Да будет нам известно: в подлинном греческом тексте не так, как вошло в употребление из-за хитрого или простодушного искажения двух слогов: «если умрёт муж её» как бы о будущем, будто это относится к той, что потеряла мужа уже в вере.[8] Если бы это было так, то вольность, выпущенная без конца, давала бы мужа столько раз, сколько он теряется, без всякой стыдливости брака, подобающей и язычникам. Но даже если и о будущем: «если у кого муж умрёт», то это будущее относилось бы и к той, у которой муж умрёт до обращения. Понимай как угодно, только не ниспровергай прочего.</p><p>Ведь уступают место и те изречения: «Рабом ли ты призван, не смущайся», «Призван ли кто необрезанным, не обрезывайся», «Призван ли кто обрезанным, не скрывайся» (1 Кор. 7:21, 18), которым соответствует: «Соединён ли ты с женою? не ищи развода. Остался ли без жены? не ищи жены». Достаточно ясно, что это относится к тем, кто, находясь в новом и недавнем призвании, спрашивал о том, в чём их застала вера.</p><p>Таково толкование этого места. Проверять его надо тем, согласуется ли оно и со временем, и с предметом, и с примерами и доводами, идущими раньше, и с изречениями и мыслями, идущими после, и прежде всего с собственным советом и установлением самого апостола. Ведь ничего не надо так оберегать, как то, чтобы кто-нибудь не оказался в противоречии с самим собой.</p><h2>12. Только ли клир?</h2><p>Выслушай и тончайшее возражение. «Апостол, — говорят они, — настолько разрешил повторять брак, что игом единобрачия обязал только клириков: что предписано некоторым, то не предписано всем». А разве то, что он заповедует всем, не предписано епископам, если предписанное епископам не заповедано всем? Или, скорее, всем потому, что и епископам, и епископам потому, что и всем? Откуда епископы и клир? Не из всех ли? Если не все обязаны единобрачием, откуда взяться единобрачным для клира? Или надо особо учредить какое-то сословие единобрачных, из которого выбирать в клир?</p><p>Когда мы превозносимся и кичимся перед клиром, тогда мы все одно, тогда все священники, потому что Он сделал нас священниками Богу и Отцу (Откр. 1:6; 5:10). А когда нас призывают к равенству в священническом уставе, мы снимаем повязки и уже не равны!</p><p>Речь шла о церковных степенях: кого следует поставлять. Надо было на видном месте выставить образец общего устава, как объявление, что он будет действовать для всех как предписание. Чтобы народ лучше знал, что ему надо соблюдать порядок, который ставит предстоятелей, и чтобы сама честь не льстила себе вольностью, как бы преимуществом места. Дух Святой предвидел, что некоторые будут говорить: «Епископам всё позволено», как тот ваш епископ Утинский не убоялся и закона Скантиниева.[9] Сколько двоежёнцев председательствует у вас, глумясь над апостолом и не краснея, когда это читается при них!</p><p>Ну так, считающий, что единобрачие назначено только епископам, откажись и от других положений устава, вписанных для епископов вместе с единобрачием. Не будь непорочным, трезвым, благочинным, страннолюбивым, учительным; а будь пьяницей, скорым на побои, сварливым, сребролюбцем, не управляй домом, не заботься о воспитании детей и не имей доброго свидетельства от внешних (1 Тим. 3:2–7). Если у епископов свой закон о единобрачии, то и остальное, что должно сопутствовать единобрачию, написано для епископов. А мирянам, которым единобрачие не подходит, и остальное чуждо. Ты избежал, душевный, если хочешь, уз всего устава. Твёрдо заявляй, что не всем предписано то, что предписано некоторым. А если остальное общее, а единобрачие наложено только на епископов, то неужели одни они должны быть названы христианами, на кого возложен весь устав?</p><h2>13. Молодые вдовы и закон мужа</h2><p>Но, пишут Тимофею, апостол желает, чтобы молодые вдовы вступали в брак, рождали детей, управляли домом (1 Тим. 5:14). Он обращается к тем, кого обозначил выше: молодые вдовы, застигнутые во вдовстве и какое-то время державшиеся его, а потом, разнежившись в противность Христу, хотят вступать в брак, подлежа осуждению за то, что отвергли прежнюю верность (1 Тим. 5:11–12), то есть ту, в которой найдены во вдовстве и которую обещали, но не пребывают в ней. Поэтому он хочет, чтобы они выходили замуж, чтобы затем не отвергли прежнюю верность принятого вдовства, а не чтобы выходили замуж столько раз, сколько не захотят оставаться во вдовстве, испытанном и даже проведённом в удовольствии.</p><p>Мы читаем его и к римлянам: «Замужняя женщина привязана законом к живому мужу; а если умрёт муж, она освобождается от закона замужества. Посему, если при живом муже выйдет за другого, называется прелюбодейцею; если же умрёт муж, она свободна от закона, и не будет прелюбодейцею, выйдя за другого мужа» (Рим. 7:2–3). Но посмотри и дальше, куда идёт эта мысль, которая тебе так льстит: «Так и вы, братия мои, умерли для закона телом Христовым, чтобы принадлежать другому, Воскресшему из мёртвых, да приносим плод Богу. Ибо, когда мы жили по плоти, тогда страсти греховные, обнаруживаемые законом, действовали в членах наших, чтобы приносить плод смерти; но ныне, умерши для закона, которым были связаны, мы освободились от него, чтобы нам служить Богу в обновлении духа, а не по ветхой букве» (Рим. 7:4–6).</p><p>Итак, если он велит нам умереть для закона телом Христовым, то есть Церковью, стоящей на обновлении духа, а не на ветхости буквы, то есть закона, то, отнимая тебя у закона, который не удерживает жену при умершем муже от другого мужа, он приводит тебя к противоположному положению: потеряв мужа, не выходить замуж. Насколько ты не считалась бы прелюбодейкой, выйдя за другого после смерти мужа, если бы ещё жила по закону, настолько, из-за противоположности положения, он заранее признаёт тебя прелюбодейкой, выходящей за другого после смерти мужа. Раз ты уже умерла для закона, тебе не может быть дозволено то, что дозволялось там, откуда ты ушла.</p><h2>14. Снисхождение Павла отменено Параклетом</h2><p>Если бы даже апостол безусловно разрешил христианам вступать в брак после потери супруга, он поступил бы так же, как и в других случаях, поступая вопреки своему правилу по условиям времени. Он обрезал Тимофея ради вкравшихся лжебратий (Деян. 16:3; Гал. 2:4), ввёл в храм остриженных ради соблюдения иудейского обычая (Деян. 21:24), он, порицающий галатов, желающих жить под законом. Но обстоятельства требовали, чтобы для всех он сделался всем, чтобы всех приобрести (1 Кор. 9:22), снова в муках рождая их, доколе не изобразится в них Христос (Гал. 4:19), согревая как кормилица младенцев в вере (1 Фес. 2:7), уча кое-чему по снисхождению, а не по приказу. Ибо одно дело снисходить, другое приказывать. Так и он дал временную вольность снова вступать в брак по немощи плоти, как Моисей — разводиться по жестокосердию (Втор. 24:1; Мф. 19:8).</p><p>И здесь мы дополним смысл этого. Если Христос отнял то, что предписал Моисей, потому что от начала не было так (Мф. 19:8), и за это не сочтут, что Христос пришёл от другой силы, то почему бы и Параклету не отнять то, что дозволил Павел? И второго брака от начала не было, и не надо подозревать Его как чуждого духа, лишь бы вводимое было достойно Бога и Христа. Если достойно было Бога и Христа по исполнении времени обуздать жестокость сердца, почему ещё не достойнее Бога и Христа во времени, ещё более сжатом, рассеять немощь плоти?</p><p>Если справедливо не разделять брак, то, конечно, честно и не повторять его. И мир считает то и другое хорошим правилом: одно ради согласия, другое ради целомудрия. Царствовала жестокость сердца до Христа; пусть царствовала и немощь плоти до Параклета. Новый закон отнял развод, было что отнять. Новое пророчество отняло второй брак, это не меньше развод с первым. Но жестокость сердца легче уступила Христу, чем немощь плоти. Эта больше отстаивает себе Павла, чем та Моисея. Отстаивает, хватая его, когда он снисходит, и отвергая, когда предписывает, обходя его сильнейшие изречения и постоянную волю, не давая нам сделать то, что апостол предпочитает.</p><p>И до каких пор эта бесстыднейшая немощь будет упорствовать в борьбе против лучшего? Её время было, пока не стал действовать Параклет, на Которого Господь отложил то, что тогда нельзя было вынести. Уже никому не пристало не мочь нести, потому что не отсутствует Тот, через Кого дано мочь. До каких пор будем ссылаться на плоть, потому что Господь сказал: «Плоть немощна» (Мф. 26:41)? Но Он сначала сказал и: «Дух бодр», чтобы дух победил плоть и слабое уступило сильному. И сказал: «Кто может вместить, да вместит» (Мф. 19:12), то есть кто не может, пусть отойдёт. Отошёл и тот богач, не вместивший заповеди раздать имение нищим, и Господь оставил его при его мнении (Мф. 19:21–22). И нельзя ставить в вину Христу порок чьей-либо свободной воли. «Вот, Я сегодня предложил тебе жизнь и добро, смерть и зло» (Втор. 30:15). Выбери добро. Если не можешь, потому что не хочешь (а что можешь, если захочешь, Он показал, предложив твоей воле и то, и другое), ты должен отойти от Того, Чью волю не исполняешь.</p><h2>15. В чём наша ересь?</h2><p>В чём же тут наша жестокость, если мы отказываемся от не исполняющих волю Божию? Какая ересь, если мы считаем второй брак, как недозволенный, близким к прелюбодеянию? Ведь что такое прелюбодеяние, как не недозволенный брак? Апостол осуждает тех, кто вовсе запрещал вступать в брак и запрещал пищу, которую Бог создал (1 Тим. 4:3). Мы же, отвергая второй брак, упраздняем брак не больше, чем отвергаем пищу, постясь чаще. Одно дело упразднить, другое — умерить; одно дело установить закон не вступать в брак, другое — установить меру брака.</p><p>А те, кто упрекает нас в жестокости или ереси в этом деле, если так потакают немощи плоти, что считают нужным терпеть её в частых браках, почему не терпят её и не потакают в другом деле, когда под пытками её вынудили к отречению? Скорее следует извинять ту, что пала в бою, чем ту, что в спальне; ту, что поддалась на дыбе, чем ту, что в постели; ту, что уступила жестокости,[10] чем похоти; ту, что побеждена со стоном, чем ту, что с удовольствием. Но ту отлучают от общения, потому что не вытерпела до конца, а эту принимают, как будто и она вытерпела до конца. Поставь, чего не вытерпела та и другая, и увидишь, что дело благороднее у той, что не вынесла жестокости, чем у той, что не вынесла целомудрия. И всё же немощь плоти не извиняет ни кровавого отпадения, ни, тем более, нечистого.</p><h2>16. Смешная «немощь»</h2><p>Смешно мне, когда в оправдание выставляют немощь плоти, которую надо бы назвать высшей крепостью. Снова вступить в брак — дело сил; встать на дела плоти из покоя воздержания — дело поясницы. Такая немощь хватит и на третий, и на четвёртый, и, может быть, на седьмой брак. Сколько раз она немощна, столько раз и сильна. Но покровителем её будет уже не апостол, а какой-нибудь Гермоген, обычно женящийся чаще, чем пишущий картины. В нём избыток материи, откуда он выводит и душу, и тем более не имеет Духа от Бога. Он даже и не душевный, потому что и душа у него не от дуновения Божия.[11]</p><p>А если кто ссылается на бедность, тем самым открыто признавая продажу своей плоти, вступая в брак ради содержания и забыв, что не надо заботиться о пище и одежде (Мф. 6:25)? У него есть Бог, Кормилец воронов и Украситель цветов (Лк. 12:24, 27). А если кто ссылается на одиночество дома? Будто одна женщина может составить многолюдство человеку, готовому к бегству. Он имеет вдову, которую может взять: не одну такую жену, но можно иметь и нескольких.[12]</p><p>А если кто думает о потомстве теми же мыслями, какими смотрела жена Лота (Быт. 19:26), и потому снова вступает в брак, что от первого не имел детей? Христианин будет искать наследников, сам лишённый наследства всего мира? У него есть братья, есть мать-Церковь. Иное дело, если они считают, что и у Христа действуют Юлиевы законы, и думают, будто холостые и бездетные не могут получить целиком по завещанию Божию.[13]</p><p>Пусть же такие женятся до самого конца, чтобы в этом смешении плоти, как Содом и Гоморра и дни потопа (Лк. 17:26–29), их застала последняя гибель мира. Пусть прибавят третье слово: «Станем есть, и пить, и жениться, ибо завтра умрём» (1 Кор. 15:32), не вспоминая то «горе беременным и питающим сосцами» (Мф. 24:19), которое будет гораздо тяжелее и горше при потрясении всего мира, чем при опустошении одной части Иудеи. Пусть собирают в повторных браках плоды, весьма подходящие для последних времён: отвисшие груди, тошнотворные животы, пищащих младенцев. Пусть готовят Антихристу, на ком ему сладострастнее свирепствовать. Он пошлёт к ним палачей вместо повитух.</p><h2>17. Судьями будут и язычники</h2><p>Им будет что представить Христу: красивая привилегия — повсеместная немощь плоти. Но судить её будут уже не Исаак единобрачный, наш отец, не Иоанн, скопец Христов, не Иудифь, дочь Мерарии, и не столько других примеров святых. Обычно судьями назначаются язычники.</p><p>Восстанет царица Карфагена и вынесет приговор христианкам. Беженка на чужой земле, основательница столь великого города, она должна была бы сама желать брака с царём. Но чтобы не испытать второго брака, предпочла наоборот — сгореть, чем выйти замуж.[14] Рядом с ней сядет римская матрона, которая, хотя и по ночному насилию, но всё же испытав другого мужчину, смыла пятно плоти своей кровью, отстаивая в себе единобрачие.[15] Были и те, кто предпочитал умереть за мужей, чем выйти замуж после мужей.</p><p>Даже у идолов явны единобрачие и вдовство. Женской Фортуне возлагает венец только единобрачная, как и матери Матуте. Верховный понтифик и фламиника женятся один раз. Жрицы Цереры, при живых и согласных мужьях, по дружескому разделению становятся вдовами. Есть и те, кто будет судить нас о полном воздержании: девы Весты, Юноны Ахейской, Дианы Скифской и Аполлона Пифийского. И жрецы того египетского быка будут судить немощь христиан о воздержании.</p><p>Устыдись, плоть, облёкшаяся во Христа. Пусть довольно тебе однажды вступить в брак, в чём ты создана от начала, к чему призываешься от конца. Вернись к первому Адаму, если не можешь к последнему. Один раз он вкусил от дерева, один раз пожелал, один раз прикрыл стыд, один раз покраснел перед Богом, один раз скрыл свой стыд, один раз был изгнан из рая святости, один раз после этого вступил в брак. Если ты был в нём, у тебя есть твой образец. Если перешёл во Христа, ты должен быть лучше. Покажи третьего Адама, и этот пусть будет двоежёнцем, и тогда сможешь быть тем, чем между двумя быть не можешь.</p>",
"references": "<ol><li><p>Душевные (лат. psychici, от 1 Кор. 2:14) — насмешливое имя, которое Тертуллиан-монтанист даёт православным христианам, не принявшим «нового пророчества». Себя он причисляет к «духовным».</p></li><li><p>Еретики — маркиониты и другие гностики, отвергавшие брак как дело злого Творца; они для закона Творца «чужие». «Возницы» — те, кто гонит из брака в брак.</p></li><li><p>Тертуллиан называет автором Иоанна, но это слова из 1-го послания Петра (ср. Лев. 11:44).</p></li><li><p>Иисус Навин (евр. Иисус, лат. Jesus), «второй Моисей», образ Христа.</p></li><li><p>Тертуллиан полагал, что после рождения Христа Мария жила с Иосифом как жена (см. его «О плоти Христа», 23). Церковь исповедует приснодевство Богородицы.</p></li><li><p>Спурий Карвилий Руга, ок. 231 г. до Р. Х., как считалось в Риме, первым развёлся с женой (Авл Геллий, IV, 3).</p></li><li><p>Одно из ранних свидетельств о поминовении усопших.</p></li><li><p>Тертуллиан считает, что подлинное греческое чтение относится к прошлому («если умер», то есть до обращения), а в ходячем латинском тексте стоит будущее время. Современные издания греческого текста этого не подтверждают: глагол в 1 Кор. 7:39 стоит в аористе сослагательного наклонения, который обычно передают «если умрёт».</p></li><li><p>Lex Scantinia — римский закон против мужеложства. Имя епископа из Утины (Сев. Африка) неизвестно.</p></li><li><p>В PL стоит credulitati («легковерию»), а по смыслу, видимо, crudelitati («жестокости»); так читают издатели и английский перевод.</p></li><li><p>Гермоген — африканский живописец и еретик, против которого Тертуллиан написал особое сочинение: он учил о вечности материи и выводил из неё душу.</p></li><li><p>Намёк на обычай принимать на содержание вдову как сестру, для ведения дома.</p></li><li><p>Lex Iulia et Papia — законы Августа, ограничивавшие право холостых и бездетных получать наследство.</p></li><li><p>Дидона по древнему преданию (не вергилиевскому) взошла на костёр, чтобы избежать брака с ливийским царём Ярбой. Тертуллиан обыгрывает 1 Кор. 7:9.</p></li><li><p>Лукреция.</p></li></ol><p>Перевёл Родион Власов, с использованием ИИ. Перевод с латинского по тексту Patrologia Latina, т. 2, стб. 930–954; неясные места сверены с английским переводом из Ante-Nicene Fathers, т. 4. Ссылки на Писание приведены к Синодальному переводу; ошибочные ссылки издания PL исправлены. Единобрачие в понимании Тертуллиана — запрет любого второго брака, даже после смерти супруга, — учение монтанистов; Церковь его не приняла.</p>",
