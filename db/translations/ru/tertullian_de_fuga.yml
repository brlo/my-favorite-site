"title": "О бегстве во время гонений",
"title_sub": "Перевод с латинского",
"meta_desc": "Тертуллиан отвечает брату Фабию: можно ли христианину бежать от гонения или откупаться от него деньгами.",
"body": "<p><strong>Тертуллиан написал это сочинение в поздний период творчества, уверовав в Монтана и приняв ереси монтанистов.</strong></p><h2>1. Откуда приходит гонение</h2><p>Недавно, брат Фабий, ты спросил меня, следует ли бежать во время гонения: тогда как раз разнеслись какие-то слухи о нём. Я сразу возразил кое-что, насколько позволяли место и время, но некоторые люди мне мешали, и я унёс тему с собой разобранной лишь наполовину, чтобы теперь изложить её полнее на письме. Об этом просил твой вопрос, и того же настоятельно требовали сами времена.</p><p>Чем чаще грозят нам гонения, тем внимательнее надо рассудить, как вере их встречать. И особенно нужно это вам: вы ведь не принимаете Параклета, наставника на всякую истину,[1] вот и остаётесь, что вполне заслуженно, открыты и для других вопросов.</p><p>На твой вопрос я отвечу по порядку. Сначала нужно установить, что такое само гонение: от Бога оно приходит или от диавола. Тогда легче будет решить, как его встречать: всякую вещь проще рассмотреть, когда известно, кто её виновник.</p><p>Вообще-то достаточно было бы сказать заранее: ничто не происходит без воли Божией. Но я не стану сразу пускаться в рассуждения, в которые нас могут увести такие возражения: «Значит, и зло от Бога, и грех от Бога, и на долю диавола ничего не остаётся, и на нашу тоже?» Сейчас речь о гонении. Пока скажу о нём одном: без воли Божией оно не происходит, потому что оно достойно Бога и, если можно так выразиться, необходимо — для того чтобы одних из рабов Его признать устоявшими, а других отвергнуть.</p><p>Ведь к чему ведёт гонение, что оно производит, кроме испытания веры, через которое Господь проверяет Своих? Гонение и есть суд: на нём человека признают либо выдержавшим испытание, либо не выдержавшим. Суд же принадлежит одному Богу. Вот та лопата, которая и теперь очищает гумно Господне, то есть Церковь: она провеивает смешанную груду верующих, отделяя пшеницу мучеников от мякины отрёкшихся. Вот и та лестница, что снилась Иакову: одним она указывает путь наверх, другим — вниз.</p><p>Можно понимать гонение и как состязание. Кто объявляет состязание, если не тот, кто назначает венец и награды? В Апокалипсисе ты читаешь объявление об этом состязании: какими наградами призывает оно к победе тех, кто победит именно в гонении, — кто, побеждая, боролся поистине не против плоти и крови, а против духов злобы (Еф. 6:12). Так ты поймёшь, что решает исход поединка тот же устроитель игр, который и зовёт к награде.</p><p>Всё, что совершается в гонении, — это слава Бога, Который испытывает и отвергает, возлагает и низлагает. А то, что относится к славе Божией, разумеется, совершается по Его воле. Да и когда больше веруют в Бога, как не тогда, когда больше Его боятся, то есть во время гонения? Тогда Церковь замирает в напряжении, тогда и вера собранней и внимательней к делу, и строже соблюдаются посты, стояния,[2] молитвы, смирение, заботливая любовь друг к другу, святость и трезвость: ведь места остаётся только для страха и надежды. Уже отсюда видно, что нельзя приписывать диаволу то, что делает рабов Божиих лучше.</p><h2>2. Диавол лишь орудие</h2><p>Но, скажут, неправда не от Бога, а от диавола, а гонение состоит из неправды: что неправеднее, чем обращаться с епископами истинного Бога, со всеми последователями истины как с отъявленными злодеями? Поэтому, скажут, гонение и исходит от диавола: ведь это он творит неправду, из которой состоит гонение.</p><p>На это нужно ответить так. Без диавольской неправды нет гонения, а без гонения нет испытания веры. Но это значит лишь, что неправда необходима для испытания веры, и она не покровительствует гонению, а прислуживает ему. Впереди идёт воля Божия об испытании веры — в этом смысл гонения; за ней следует неправда диавола как орудие гонения — и в этом смысл испытания.</p><p>Да и вообще: неправда соперничает с правдой, и именно поэтому она служит материалом для свидетельства о той, с кем соперничает. Правда совершается в неправде так же, как сила совершается в немощи (2 Кор. 12:9). «Немощное мира избрал Бог, чтобы посрамить сильное, и немудрое мира, чтобы посрамить мудрое» (1 Кор. 1:27). Так и неправда привлекается к делу для того, чтобы правда была испытана и посрамила неправду.</p><p>Итак, служить — значит не решать, а исполнять. Решение принадлежит Господу: это гонение ради испытания веры. Служба принадлежит неправде диавола: она устраивает гонение. Поэтому мы и верим, что гонение приходит, может быть, через диавола, но не от диавола.</p><p>Над рабами Бога живого сатане ничего не позволено, если не попустит Господь. Попускает же Он либо затем, чтобы сокрушить его верой избранных, побеждающей в искушении, либо чтобы обличить как его слуг тех, кто к нему перешёл. Вот тебе пример Иова. Диавол не мог бы навести на него никакого искушения, если бы не получил власти от Бога. Он не коснулся даже его имущества, пока Господь не сказал: «Вот, всё, что у него, в руке твоей; только на него не простирай руки твоей» (Иов. 1:12). И на него самого диавол не простёр руки, пока на его новую просьбу Господь не сказал: «Вот, он в руке твоей, только душу его сбереги» (Иов. 2:6).</p><p>Так и на апостолов он просил позволения навести искушение: своей власти у него не было. Господь говорит в Евангелии Петру: «Се, сатана просил, чтобы сеять вас как пшеницу; но Я молился о тебе, чтобы не оскудела вера твоя» (Лк. 22:31–32), то есть чтобы диаволу не было позволено столько, чтобы вера оказалась в опасности. Отсюда видно: и потрясение веры, и защита её — в руках Бога, потому что и того и другого просят у Него: потрясения — диавол, защиты — Сын. И если даже Сын Божий, у Которого защита веры в Его власти, просит её у Отца, от Которого принял всякую власть на небе и на земле (Мф. 28:18), то как же потрясение веры могло бы быть во власти диавола?</p><p>Да и в молитве, которую нам заповедано читать, мы говорим Отцу: «Не введи нас во искушение» (Мф. 6:13). А какое искушение больше гонения? Значит, мы признаём: оно приходит от Того, Кого мы просим его отвратить. Об этом и следующие слова: «Но избавь нас от лукавого», то есть не вводи нас в искушение, предавая лукавому. Мы тогда избавлены от рук диавола, когда не преданы ему в искушении.</p><p>Даже над стадом свиней легион бесов не имел власти, пока не выпросил её у Бога (Мф. 8:31–32) — что же говорить об овцах Божиих! Я мог бы сказать, что и щетинки свиней были тогда сочтены у Бога, не то что волосы святых (Мф. 10:30).</p><p>Собственная власть у диавола, похоже, есть разве что над теми, кто Богу не принадлежит: над народами, которых Бог однажды счёл за каплю из ведра, за пыль на гумне и за плевок (Ис. 40:15)[3] и тем самым как бы оставил диаволу, словно бесхозное владение. На домашних же Божиих ему своей властью ничего не позволено. А когда и по каким причинам позволяется, показывают примеры, записанные в Писании.</p><p>Либо ради испытания ему даётся право искушать — когда его вызвали или он сам напросился, как в приведённых случаях. Либо ради отвержения ему, как палачу, отдаётся на казнь грешник, как Саул: «А от Саула отступил Дух Господень, и возмущал его злой дух от Господа» и душил его (1 Цар. 16:14). Либо ради обуздания: так апостол рассказывает, что ему дано жало, ангел сатаны, чтобы удручать его (2 Кор. 12:7). И этот вид власти диаволу разрешён ради смирения святых через страдания плоти, только затем, чтобы сила терпения могла совершиться в немощи. Ведь и сам апостол предал сатане Фигелла и Ермогена, «чтобы они научились не богохульствовать» (1 Тим. 1:20).[4] Видишь: диавол скорее получает власть даже от рабов Божиих, так что своей собственной у него и в помине нет.</p><h2>3. Бог посылает войну</h2><p>Такие случаи чаще всего бывают именно в гонениях: тогда нас больше всего испытывают или отвергают, смиряют или исправляют. Значит, всё это вообще[5] попускает или повелевает Тот же, Кто и в отдельных случаях: Тот, Кто говорит: «Я делаю мир и произвожу бедствия» (Ис. 45:7), то есть войну, потому что это противоположность миру. А что есть война для нашего мира, как не гонение?</p><p>Если исход гонения — чаще всего либо жизнь, либо смерть, либо рана, либо исцеление, то вот и его виновник: «Я поражаю и Я исцеляю; Я умерщвляю и оживляю» (Втор. 32:39). «Я расплавлю их, как плавят серебро, и испытаю их, как испытывают золото» (Зах. 13:9). Когда нас обжигает пламя гонения, тогда и проверяется, твёрдо ли мы держимся веры. Это и будут те «раскалённые стрелы» диавола (Еф. 6:16), которыми вера обжигается и переплавляется, но по воле Божией.</p><p>Не знаю, кто мог бы в этом усомниться, разве что вера легкомысленная и холодная, какая бывает у тех, кто с опаской собирается в церковь. Вы ведь говорите: «Мы собираемся беспорядочно, сходимся все сразу, сбегаемся толпами в церковь — вот нас и выслеживают язычники, и мы боимся их возмутить». Разве вы не знаете, что Бог — Господь всех? Захочет Бог — и ты потерпишь гонение; не захочет — язычники смолчат. Верь этому, если ты веришь в того Бога, без воли Которого и воробей ценой в один ассарий не падает на землю (Мф. 10:29). А мы, думаю, лучше многих малых птиц (Мф. 10:31).</p><h2>4. Бежать нельзя, да и не выйдет</h2><p>Итак, если ясно, от Кого приходит гонение, можно перейти к твоему вопросу и уже из сказанного заключить, что бежать во время гонения не следует. Если гонение приходит от Бога, то от него ни в коем случае не надо бежать. Здесь два основания: то, что приходит от Бога, и не следует избегать, и невозможно избежать.</p><p>Не следует — потому что это благо: всё, что Бог признал хорошим, необходимо есть благо. Разве не для того в книге Бытия и сказано: «И увидел Бог, что это хорошо» (Быт. 1:10)? Бог, конечно, и без того знал, что это хорошо, но этими словами Он дал понять: хорошо то, что Бог так увидел.</p><p>Бывает, конечно, много такого, что приходит от Бога и кому-то оборачивается бедой. И всё же это благо, именно потому что от Бога, потому что оно божественно и разумно. Что божественное неразумно и не благо? Что благое не божественно? А если кому-то кажется иначе, то мнение человека не решает, какова вещь на самом деле, — наоборот, вещь определяет мнение. Природа каждой вещи есть нечто определённое, и она предписывает мнению закон: думать о вещи то, что она есть.</p><p>Если же по своей сути то, что приходит от Бога, благо (от Бога не бывает ничего не благого: оно божественно и разумно), а мнению кажется злом, то с сутью всё в порядке, а порок — в мнении. По своей сути прекрасны целомудрие, истина и справедливость, а многим они не по душе. Разве из-за этого суть подчиняется мнению? Так и гонение по своей сути благо, потому что это божественное и разумное установление; не нравится же оно тем, кому оборачивается бедой.</p><p>Вот видишь, и эта беда — когда человек теряет в гонении спасение — имеет у Бога своё основание, как и то благо — когда человек в гонении преуспевает ко спасению. Разве что кто-то станет утверждать, будто человек гибнет или спасается у Господа без всякого основания. Иначе он не сможет назвать гонение злом: оно благо даже там, где кому-то несёт беду, потому что совершается разумно.</p><p>Итак, если гонение, как ни посмотри, — благо, потому что таково оно по сути, то мы вправе заключить: блага избегать нельзя, потому что отказ от блага — грех, тем более от того, что Бог признал хорошим. А ещё избежать его и невозможно: оно приходит от Бога, а Его воли никому не обойти. Выходит, кто считает, что надо бежать, тот либо упрекает Бога в зле, раз бежит от гонения как от зла (от блага ведь никто не бежит), либо считает себя сильнее Бога, раз думает, что сумеет уйти, если Бог решит иначе.</p><h2>5. «Я сделаю своё, а Бог — своё»</h2><p>Но вот что говорят: «Я делаю своё: бегу, чтобы не погибнуть, если отрекусь. А Его дело — вывести меня на суд, даже если я убегу, коли Он того захочет». Сначала ответь мне: ты уверен, что отречёшься, если не убежишь, или не уверен? Если уверен, то ты уже отрёкся: предполагая, что отречёшься, ты заранее обещал то, что предполагаешь. Напрасно ты теперь бежишь, чтобы не отречься: кто собирается отречься, тот уже отрёкся. А если не уверен, то почему, раз страх одинаково неопределёнен в обе стороны, ты не предполагаешь, что можешь и исповедать веру и спастись скорее тем, что не убежишь, — так же, как предполагаешь, что отречёшься, чтобы убежать?</p><p>И дальше: либо и то и другое зависит от нас, либо всё зависит от Бога. Если исповедать или отречься — в нашей власти, то почему мы не предполагаем лучшего, то есть что исповедаем? Разве что ты хочешь исповедать, но страдать не хочешь. Однако не хотеть исповедать — и значит отрекаться. А если всё зависит от Бога, то почему мы не оставляем всё на Его волю, признавая Его силу и власть? Он может вывести нас на суд, когда мы бежим, но может и укрыть нас, когда мы не бежим, даже посреди народа.</p><p>Что же это такое: когда дело доходит до бегства, ты воздаёшь Богу честь, говоря, что Он может вывести тебя на суд и беглого, а когда дело доходит до исповедания, бесчестишь Его, отчаиваясь в Его защите? Почему бы тебе, став на сторону стойкости и доверия к Богу, не сказать лучше: «Я делаю своё: не ухожу. Если Бог захочет, Он Сам меня защитит»? Нам больше подобает стоять, предавшись Его воле, чем бежать по своей.</p><p>Святейший мученик Рутилий столько раз бежал от гонения с места на место, даже откупался, как ему казалось, от опасности деньгами! И вот, после всех его предосторожностей, его внезапно схватили, привели к наместнику, истерзали пытками, думаю, в наказание за бегство, а потом предали огню. Так, по милости Божией, он принял страдание, которого избегал. Что ещё хотел показать нам Господь этим примером, как не то, что бежать не надо: бегство не поможет, если Бог того не захочет?</p><h2>6. «Бегите из города в город»: кому это сказано</h2><p>«Напротив, — возражают, — он выполнил заповедь, убегая из города в город». Так рассуждал один человек, тоже беглец, и так рассуждают те, кто не хочет понять смысл этих слов Господа, чтобы прикрыть ими свою трусость. А ведь слова эти относятся к определённым лицам, времени и обстоятельствам: «Когда же будут гнать вас в одном городе, бегите в другой» (Мф. 10:23).</p><p>Мы утверждаем: это сказано именно об апостолах, об их времени и их обстоятельствах. Это докажут и предшествующие, и последующие слова, которые подходят только к апостолам: «На путь к язычникам не ходите и в город Самарянский не входите, а идите наипаче к погибшим овцам дома Израилева» (Мф. 10:5–6). Нам же и путь к язычникам открыт: на нём нас и нашли, и по нему мы идём до конца. И нет исключённого города: мы проповедуем по всей земле. Об Израиле нам не поручено особой заботы, кроме той, что и всем народам мы должны проповедовать. И если нас схватят, нас поведут не в их судилища и не в их синагогах будут бить: нас поставят перед римскими властями и трибуналами.</p><p>Так что и заповеди бежать требовало положение апостолов: сначала им предстояло проповедовать «погибшим овцам дома Израилева». Чтобы проповедь исполнилась там, где должна была исполниться прежде всего, чтобы хлеб получили сперва дети, а потом псы, Господь и велит им тогда на время бежать. Это сделано не ради избегания опасности как таковой: Он, напротив, предсказывал им гонения и учил их переносить. Это сделано ради успеха проповеди, чтобы с их немедленной гибелью не погибло и распространение Евангелия.</p><p>Притом им надлежало перебираться в другой город не украдкой, а так, чтобы и там возвещать, и, следовательно, и там принимать гонения, пока не наполнят всё своим учением. Поэтому Он и говорит: «Не успеете обойти городов Израилевых» (Мф. 10:23). Значит, заповедь бежать не выходила за пределы Иудеи. У нас же нет границ проповеди, какими была Иудея: Дух Святой уже излит на всякую плоть.</p><p>Поэтому Павел и сами апостолы, помня заповедь Господа, свидетельствуют о ней Израилю, который уже наполнили своим учением: «Вам первым надлежало быть проповедану слову Божию, но как вы отвергаете его и сами себя делаете недостойными вечной жизни, то вот, мы обращаемся к язычникам» (Деян. 13:46). С тех пор и они, как прежде указали им их предшественники, обратились, пошли по пути к язычникам и вошли в города самарянские, чтобы по всей земле прошёл звук их и до пределов вселенной слова их (Пс. 18:5).</p><p>Если же отменён запрет идти к язычникам и входить в города самарян, то почему не отменена и заповедь бежать, данная вместе с ним? И действительно, с тех пор как, насытив Израиль, апостолы перешли к язычникам, они уже не бегали из города в город и не боялись страдать. Павел, который ещё позволил спустить себя со стены, спасаясь от гонения, пока заповедь для него действовала, под конец служения, когда заповедь исчерпала себя, не поддался тревоге учеников: они горячо умоляли его не идти в Иерусалим, где его ждало предсказанное Агавом. Он ответил: «Что вы делаете? что плачете и сокрушаете сердце моё? я не только хочу быть узником, но готов умереть в Иерусалиме за имя Господа Иисуса». И все сказали: «Да будет воля Господня!» (Деян. 21:13–14).</p><p>Какая это была воля Господня? Несомненно, та, что от гонения больше не надо бежать. Иначе те, кто хотел уберечь его от гонения, могли бы сослаться на прежнюю волю Господа, повелевшую бежать.</p><p>Итак, если уже при самих апостолах заповедь бежать была временной, как и прочие указания того же места, то у нас не может оставаться в силе то, что потеряло силу у наших учителей, — даже если бы оно не было адресовано лично им. А если Господь хотел, чтобы эта заповедь действовала и дальше, то апостолы согрешили, не заботясь о том, чтобы бежать до конца.</p><h2>7. Заповедь бегства не согласуется с другими словами Христа</h2><p>Посмотрим теперь, согласуются ли другие изречения Господа с постоянной заповедью бежать. Прежде всего: если гонение от Бога, как может Он приказывать бежать от того, что Сам же посылает? Если бы Он хотел, чтобы гонения избегали, лучше бы и не посылал, чтобы не казалось, будто Он идёт против собственной воли. Он хотел от нас либо страдания в гонении, либо бегства. Если бегства, то как же страдания? Если страдания, то как же бегства?</p><p>Какое же несоответствие между приказом бежать и призывом к страданию, противоположному бегству! «Всякого, кто исповедает Меня пред людьми, того исповедаю и Я пред Отцом Моим» (Мф. 10:32). Как он исповедует, если бежит? Как он побежит, если исповедует? «Кто постыдится Меня, того постыдится и Я пред Отцом» (Мк. 8:38; Лк. 9:26). Если я избегаю страдания, я стыжусь исповедания. «Блаженны вы, когда будут гнать вас за имя Моё» (Мф. 5:11). Значит, несчастны те, кто, убежав по заповеди, не пострадают. «Претерпевший до конца спасётся» (Мф. 10:22). Как же Ты хочешь, чтобы я терпел до конца, если велишь мне бежать? Раз такое разногласие в словах не подобает божественному величию, то и отсюда ясно: заповедь бежать имела тогда своё основание, которое мы показали.</p><p>«Но Господь, — говорят, — предвидя немощь некоторых, по Своему человеколюбию указал им всё-таки и гавань бегства». Неужели же Он не мог и без бегства, этого столь позорного, недостойного и рабского средства, сохранить в гонении тех, кого знал немощными?[6] На самом деле Он не потакает немощным, а всегда их отвергает. Прежде всего Он учит не бежать от гонителей, а не бояться их: «Не бойтесь убивающих тело, души же не могущих убить; а бойтесь более Того, Кто может и душу и тело погубить в геенне» (Мф. 10:28). А что Он назначает затем трусливым? «Кто любит душу свою более, нежели Меня, тот недостоин Меня»[7] и «Кто не несёт креста своего и идёт за Мною, не может быть Моим учеником» (Лк. 14:27). Наконец, в Апокалипсисе Он предлагает трусливым не бегство, а, вместе с другими отверженными, долю в озере, горящем огнём и серою, которое есть смерть вторая (Откр. 21:8).</p><h2>8. Что сделал Сам Господь</h2><p>Сам Он иногда уходил от насилия, но с тем же расчётом, с каким велел бежать апостолам: пока не исполнит Своего учения. Когда же оно было исполнено, Он не только устоял, но и не пожелал от Отца помощи ангельских воинств и даже запретил Петру меч. Правда, Он признал, что душа Его скорбит смертельно, а плоть немощна. Это для того, чтобы показать тебе, во-первых, что и душа, и плоть в Нём были человеческие: скорбеть свойственно душе, быть немощной — плоти. Иначе ты мог бы подумать, как некоторые сейчас утверждают,[8] что и плоть, и душа Христа были не такие, как у нас. Во-вторых, показав их состояние, Он хотел, чтобы ты знал: сами по себе, без духа, они бессильны.</p><p>Потому Он и начинает со слов: «Дух бодр» (Мф. 26:41), чтобы ты, взглянув на свойства той и другой, понял, что в тебе есть и крепость духа, как и немощь плоти, и уже отсюда знал, что от чего исходит и что чему подчинять, а именно слабое сильному. Не поступай так, как поступаешь теперь: оправдываешься немощью плоти, а о силе духа молчишь.</p><p>Он и Сам просил Отца, чтобы, если возможно, миновала Его чаша страданий. Проси и ты, но стоя, как Он, но только прося, но прибавляя и остальное: «Впрочем не как Я хочу, но как Ты» (Мф. 26:39). А как ты будешь об этом просить, если бежишь? Ты сам отводишь от себя чашу и делаешь не то, чего хочет Отец, а то, чего хочешь ты.</p><h2>9. Апостолы и Дух учат тому же</h2><p>Апостолы учили всему по Богу и хотели благовествовать всё. Где ты покажешь, что они возобновили заповедь бежать из города в город? Да они и не могли бы установить нечто столь противоположное собственным примерам и предписывать бегство, ведь они как раз из оков и с островов, где содержались за исповедание имени, а не за бегство от него, писали Церквям.</p><p>Павел велит поддерживать немощных (1 Фес. 5:14), но конечно не бегущих: как поддержать отсутствующих? Он говорит о терпеливой поддержке тех, кто преткнётся по слабости веры. Также велит он утешать малодушных, но не отсылать их в бегство. Когда он увещевает: «Не давайте места диаволу» (Еф. 4:27), он советует не бежать, а сдерживать гнев. И если он говорит: «Дорожите временем, потому что дни лукавы» (Еф. 5:16), то хочет, чтобы мы выигрывали время не бегством, а мудрым образом жизни. Кто велит нам светить как детям света (Еф. 5:8), не велит скрываться бегством как детям тьмы. Он приказывает стоять непоколебимо (1 Кор. 15:58), то есть не двигаться и в бегство, и препоясаться (Еф. 6:14): на бегство или навстречу Евангелию? Он показывает и оружие, которое не нужно беглецам, и среди него щит, «которым возможете угасить все раскалённые стрелы лукавого» (Еф. 6:16), — разумеется, сопротивляясь и принимая на себя весь его натиск.</p><p>Так и Иоанн учит полагать души свои за братьев (1 Ин. 3:16), тем более за Господа. Бегущие этого не выполнят. И он, помня свой Апокалипсис, где услышал, какой конец ждёт боязливых, сам предостерегает: страх надо изгнать. «В любви нет страха, но совершенная любовь изгоняет страх, потому что в страхе есть мучение» (1 Ин. 4:18) — понятно какое: огонь озера. «Боящийся не совершен» в любви, разумеется, к Богу. А кто побежит от гонения, если не боящийся? И кто боится, если не тот, кто не полюбил?</p><p>А если спросишь Духа, что Он одобряет больше? Его речь почти всех призывает к мученичеству, а не к бегству; вот и напомню одно из Его слов: «Тебя выставляют перед всеми? Это тебе во благо. Кого не выставляют перед людьми, того выставят перед Господом. Не стыдись: правда выводит тебя на середину. Что стыдиться, пожиная хвалу? Сила приходит, когда на тебя смотрят люди». И в другом месте: «Не желайте кончить жизнь в постелях, в выкидышах и расслабляющих лихорадках, но в мученичестве, чтобы прославился Тот, Кто пострадал за вас».[9]</p><h2>10. «Кто бежал, снова будет биться»</h2><p>Но некоторые, оставив божественные увещания, приспосабливают к себе скорее греческий стишок мирской мудрости: «Кто бежал, тот снова будет биться»,[10] — чтобы, пожалуй, снова бежать. Когда же победит тот, кто, убежав, побеждён? Хорошего воина даёт Христу, своему полководцу, тот, кто, так полно вооружённый апостолом, услышав трубу гонения, покидает строй в день гонения!</p><p>Отвечу и я чем-нибудь мирским: «Так ли уж горестно смерть принять?»[11] Пусть умрёт как угодно, побеждённым или победителем. Даже если отречётся и падёт, он всё же сражался под пытками. По мне, лучше быть достойным жалости, чем стыда. Прекраснее воин, павший в бою, чем спасшийся бегством.</p><p>Ты боишься человека, христианин? Ты, кого должны бояться ангелы, ведь ты будешь судить ангелов; кого должны бояться бесы, ведь ты получил власть и над бесами; кого должен бояться весь мир, ведь и мир будет судим в тебе. Ты облёкся во Христа, ведь ты крещён во Христа. Убегая от диавола, ты унизил Христа, Который в тебе. Ты сам сделал себя беглым рабом, перебежав к диаволу.[12] Но и убегая от Господа, ты показываешь всем беглецам, как напрасны их замыслы.</p><p>Бежал некогда от Господа и один дерзкий пророк: перебрался из Иоппии в Фарсис, как будто от Бога можно уплыть за море. Но я нахожу его не только на море и на суше, но даже во чреве зверя, где он три дня не мог ни умереть, ни таким образом уйти от Бога. Насколько лучше раб Божий! Если грозит ему враг Божий, он не бежит от него, а презирает его, полагаясь на защиту Господа. А если он страшится Бога, то тем более предстоит перед Его очами и говорит: «Это Господь, Он силён; всё Его; где бы я ни был, я в Его руке. Пусть делает что хочет: я не уйду. И если Он захочет, чтобы я погиб, пусть Сам погубит, лишь бы я сам сохранял себя для Него». Лучше мне вызвать на Него нарекания,[13] погибнув по Его воле, чем Его гнев, спасшись по своей.</p><h2>11. Клир и паства</h2><p>Так должен думать и поступать всякий раб Божий, даже низкого звания, чтобы занять более высокое, если перенесённое гонение поднимет его на ступень выше. Но когда бегут сами начальники, то есть диаконы, пресвитеры и епископы, как мирянин сможет понять, с каким смыслом сказано: «Бегите из города в город» (Мф. 10:23)? Когда бегут вожди, кто из рядовых станет слушать уговоры твёрдо стоять в строю?</p><p>Несомненно, добрый пастырь полагает жизнь за овец. Так, Моисей, ещё прежде явления Господа Христа, но уже прообразуя Его, говорит: «Если Ты губишь этот народ, то погуби и меня вместе с ним» (Исх. 32:32).[14] Христос же, подтверждая Свои прообразы, говорит: дурной пастырь тот, кто при виде волка бежит и оставляет овец на расхищение (Ин. 10:12). Такого пастуха выгонят из имения, в возмещение удержат ему плату за службу и даже взыщут с его прежних сбережений убытки хозяина. Ведь «кто имеет, тому дано будет, а кто не имеет, у того отнимется и то, что он думает иметь» (Мф. 13:12; Лк. 8:18). Так угрожает Захария: «Восстань, меч, на пастырей, и разгоните овец; и обращу руку Мою на пастырей» (Зах. 13:7).[15] Теми же угрозами разят их Иезекииль и Иеремия: они не только бессовестно кормятся от овец, пася самих себя, но и оставляют рассеянное стадо в добычу всем полевым зверям, потому что нет у них пастыря (Иез. 34:2–5; Иер. 23:1–2). А этого нигде не бывает больше, чем когда в гонении клир покидает Церковь.</p><p>Кто признаёт Духа, услышит, как Он клеймит и беглецов. Если же тем, кто стоит во главе стада, не подобает и не дозволено бежать, когда нападают волки (кто назвал такого пастыря дурным, тот, конечно, осудил его, а всё осуждённое, несомненно, недозволено), то предстоятелям Церкви в гонении бежать нельзя. Да если бы стадо должно было бежать, то и предстоятелю незачем было бы стоять: он стоял бы без нужды, охраняя стадо, которому эта охрана не нужна, раз ему разрешено бежать.</p><h2>12. Откуп: то же бегство</h2><p>Вот, брат, ответ на твой вопрос и моё увещание. Но кто спрашивает, надо ли бежать от гонения, неизбежно думает и о следующем вопросе: если бежать нельзя, то можно ли откупиться? Поэтому сам скажу тебе и об этом. Я утверждаю: от гонения, от которого, как доказано, нельзя бежать, нельзя и откупаться.</p><p>Разница только в цене. Бегство — это бесплатный откуп, а денежный откуп — это бегство. Бесспорно, и этот совет подсказан трусостью. От чего ты откупаешься, того и боишься, значит, ты бежишь. Ногами ты устоял, зато деньгами побежал. То самое, что ты устоял благодаря откупу, и есть твоё бегство.</p><p>Покупать деньгами человека, которого Христос купил Своей Кровью, — как это недостойно Бога и Его устроения! Он не пощадил Сына Своего за тебя (Рим. 8:32), чтобы Тот стал за нас проклятием, ибо «проклят всякий, висящий на древе» (Гал. 3:13). Он был веден как овца на заклание, и как агнец перед стригущим Его безгласен, так Он не отверзал уст Своих; Он предал хребет Свой биющим и ланиты Свои поражающим, лица Своего не закрывал от оплевания (Ис. 50:6), к злодеям был причтён (Ис. 53:7, 12), был предан на смерть, и смерть крестную (Флп. 2:8). Всё это, чтобы выкупить нас из грехов! Солнце уступило день нашей покупки. В преисподней совершилось наше освобождение, а договор наш записан на небесах.[16] Вечные врата поднялись, чтобы вошёл Царь славы, Господь сил (Пс. 23:9), купив человека с земли, а вернее из преисподней, для небес.</p><p>Кто же теперь борется с Ним, более того, сбивает цену и пятнает купленный Им товар, приобретённый такой дорогой ценой, Его драгоценнейшей Кровью? Тогда уж лучше бежать, чем так себя продешевить: человек не будет стоить себе столько, сколько стоил Господу. Господь выкупил его у ангелов, властвующих над миром, у духов злобы, у тьмы века сего, от вечного суда и вечной смерти (Еф. 6:12). А ты торгуешься о нём с доносчиком, или с солдатом, или с каким-нибудь наместником-воришкой, под полой, как говорится, будто он краденый, — того, кого Христос перед всем миром купил и даже отпустил на свободу!</p><p>И ты будешь оценивать этого свободного человека и владеть им по какой-то иной цене, кроме той, что он стоил Господу, то есть Его Крови? Зачем же ты выкупаешь Христа, словно человеческую собственность, в человеке, в котором Христос живёт? Именно это пытался сделать Симон, когда предлагал апостолам деньги за Духа Христова (Деян. 8:18–19). Значит, и этот, откупаясь, откупил Духа Христова, и он услышит: «Серебро твоё да будет в погибель с тобою, потому что ты помыслил дар Божий получить за деньги» (Деян. 8:20).</p><p>Кто же станет презирать такого отступника? А что говорит вымогатель? «Дай мне денег». Разумеется, для того чтобы тебя не выдать: он ведь продаёт тебе только то, чем одарит за плату. Когда ты платишь, ты желаешь не быть выданным. Но если тебя не выдадут, ты не будешь обличён. Значит, не желая быть выданным, ты не желаешь быть обличённым. А этим нежеланием ты отрёкся: ты не захотел, чтобы обнаружилось, кто ты есть.</p><p>«Напротив, — говоришь, — раз я не хочу, чтобы меня обличили как того, кто я есть, то я признал, что я тот, кем не желаю быть обличён, то есть христианин». Но можешь ли ты выдать себя за мученика, твёрдо явившего Христа? Откупаясь, ты Его не явил. Перед одним человеком ты, может быть, и исповедал, но перед многими отрёкся, не желая исповедать. Само твоё спасение свидетельствует, что человек пал, пока избегал опасности. Пал тот, кто предпочёл уцелеть. Отказ от мученичества — тоже отречение.</p><p>Христианин спасается деньгами и для того их держит, чтобы не страдать, а перед Богом будет богат. Но ведь Христос был богат для него Кровью. «Блаженны нищие, — говорит Он, — ибо их есть Царство Небесное» (Мф. 5:3), те, у кого только и есть что душа. Если нельзя служить Богу и маммоне (Мф. 6:24), разве можно быть искупленным и Богом, и маммоной? Кто больше послужит маммоне, чем тот, кого она выкупила?</p><p>Наконец, на какой пример ты сошлёшься, откупаясь от выдачи? Когда апостолы, преследуемые гонениями, освобождали себя деньгами? А денег у них хватало: цены имений клали к их ногам (Деян. 4:34–35), да и верующих богатых мужчин и женщин было много, и они их поддерживали. Когда Онисифор, или Акила, или Стефан[17] помогали им так во время гонения? Правитель Феликс надеялся получить за Павла деньги от учеников и даже наедине заводил с ним об этом речь (Деян. 24:26), но ни Павел за себя, ни ученики за него не заплатили. Это те самые ученики, которые плакали, что он упорно идёт в Иерусалим и не остерегается предсказанных там гонений, но в конце концов сказали: «Да будет воля Господня» (Деян. 21:14). Какая это воля? Конечно, чтобы он страдал за имя Господне, а не чтобы его выкупали.</p><p>Ведь как Христос положил за нас душу Свою, так и мы должны полагать её за Него (1 Ин. 3:16), и не только за Него, но и за братьев ради Него. Иоанн, уча этому, сказал не платить за братьев, а умирать за них. Нет разницы между тем, чтобы откупить христианина и чтобы купить его; ни того ни другого делать нельзя.</p><p>Такова и воля Божия. Посмотри на устройство царств и империй, тоже установленных Богом, в Чьей руке сердце царя (Притч. 21:1). Каждый день выдумываются всё новые способы пополнить казну: цензы, пошлины, сборы, подати. Но никогда доселе никому не приходило на ум сделать что-либо подобное с христианами — обложить их за выкуп их головы и их общины, хотя с такого множества, всем известного, можно было бы собрать огромный доход. Купленные кровью, кровью награждённые, мы не должны ни гроша за голову, потому что глава наша — Христос (Еф. 5:23).[18] Не подобает Христу стоить денег. И как могли бы совершаться мученичества во славу Господа, если бы мы оплачивали податью свободу нашей общины? Так что кто договаривается об этой свободе за плату, тот идёт против Божественного устроения.</p><p>Кесарь не наложил на нас никакой подобной дани, и наложить её нельзя: Антихрист уже близко, и он жаждет крови христиан, а не денег. Как же может кто-нибудь указывать мне на слова Писания: «Отдавайте кесарево кесарю» (Мф. 22:21)? С меня вымогает деньги солдат, или доносчик, или недруг. Для кесаря они ничего не требуют, а поступают наоборот: отпускают за плату христианина, виновного по законам человеческим. Другой денарий я должен кесарю, тот, что принадлежит ему, о котором тогда и шла речь, податной: его должны данники, а не свободные.</p><p>И как я отдам Божие Богу? Конечно, это образ и чеканка Его, надписанная Его именем, то есть человек-христианин. Что я должен Богу, как денарий кесарю, если не кровь, которую пролил за меня Его Сын? А если Богу я должен самого себя и свою кровь и как раз настало время, когда с меня требуют того, что я должен Богу, то, поступая так, чтобы не платить долга, я обманываю Бога. Хорошо же я соблюл заповедь, отдавая кесарю кесарево и отказывая Богу в Божием!</p><h2>13. Какие заповеди приводят в оправдание откупа</h2><p>«Но всякому просящему я дам», — скажешь (Мф. 5:42). Сказано это о милостыне, а не о вымогательстве: «просящему». Вымогатель не просит. Кто угрожает, если не получит, тот не просит, а вырывает. Милостыни не ждёт тот, кто приходит не как достойный жалости, а как внушающий страх. Я дам из милосердия, а не из страха: там, где принявший почитает Бога и воздаёт мне благословением, а не там, где он ещё считает, что сделал мне благодеяние, и, глядя на добычу, говорит: «Это с виновного».</p><p>«Накормлю и врага» (Рим. 12:20). Но у вражды другие причины, и здесь не сказано о предателе, гонителе или вымогателе. Ему я тем более соберу на голову горящие угли, если не стану откупаться.</p><p>Точно так же: «Кто возьмёт у тебя рубашку, отдай ему и верхнюю одежду» (Мф. 5:40) сказано о том, кто покушается на мою вещь, а не на мою веру. Я уступлю и плащ тому, кто не угрожает выдать меня. А если станет угрожать, потребую и рубашку обратно.</p><p>Каждому из изречений Господа положены свои причины и правила, свои границы; они не бесконечны и не обо всём. Ведь и Тот, Кто велит давать всякому просящему, Сам не даёт знамения просящим (Мф. 12:39). Иначе, если считаешь, что надо давать всем подряд, то, думаю, ты подал бы и горячечному вина, а желающему смерти — яд или меч.</p><p>А как понимать слова «Приобретайте себе друзей богатством неправедным» (Лк. 16:9), учит предшествующая притча. Она сказана об иудейском народе: он плохо распорядился вверенным ему счётом Господним, и должен был бы приобрести себе друзей, а не врагов, среди людей маммоны, какими были мы, и снять с нас долги грехов, которыми мы были связаны перед Богом, уделив нам от Господнего счёта. Тогда, когда благодать к нему иссякла бы, он, прибегнув к нашей вере, был бы принят в вечные обители. Пусть даже толкование притчи будет другим, какое угодно: понятно, что неправдоподобно, чтобы наши вымогатели, став нашими друзьями через маммону, приняли нас потом в вечные обители.</p><p>Но чего не внушит трусость! Будто Писание и бежать разрешает, и откупаться велит. И мало того, что так спасается один-другой. Целые Церкви сообща обложили себя данью. Не знаю, скорбеть или стыдиться, когда в списках бенефициариев и курьёзиев,[19] среди кабатчиков, мясников, банных воров, игроков и сводников значатся и христиане — плательщики! Такой ли образ епископства с большой прозорливостью установили апостолы, чтобы предстоятели могли спокойно пользоваться своей властью под предлогом заботы о пастве? Такой ли мир заповедал Христос, возвращаясь к Отцу: покупать его у солдат подарками, как на Сатурналии?[20]</p><h2>14. Как же тогда собираться</h2><p>«Но как мы будем собираться, — говоришь ты, — как будем совершать Господни праздники?» Разумеется, как и апостолы: под защитой веры, а не денег. Если вера может передвинуть гору (Мф. 17:20), то тем более солдата. Пусть твоей осторожностью будет мудрость, а не плата. Ведь даже подкупив военных чинов, ты не будешь сразу в безопасности и от народа. Значит, для защиты тебе нужны вера и мудрость: без них ты можешь потерять и свой откуп, а с ними откуп тебе не потребуется.</p><p>Наконец, если не можешь собираться днём, есть ночь, освещённая светом Христа. Если нельзя обойти всех поодиночке, пусть Церковью будут для тебя и трое (Мф. 18:20). Лучше иной раз не видеть своих толп, чем продавать их в рабство. Храни для Христа невесту-деву (2 Кор. 11:2). Пусть никто не наживается на ней.</p><p>Это, брат, тебе, может быть, покажется жёстким и невыносимым. Но вспомни, что сказал Бог: «Кто может вместить, да вместит» (Мф. 19:12), то есть кто не может, пусть отойдёт. Не может принадлежать Пострадавшему тот, кто боится страдать. А кто не боится страдать, тот будет совершен в любви, разумеется, Божией: «совершенная любовь изгоняет страх» (1 Ин. 4:18). Потому «много званых, а мало избранных» (Мф. 22:14). Спрашивается не о том, кто готов идти широким путём, а о том, кто узким (Мф. 7:13–14).</p><p>Потому и необходим Параклет, наставник на всякую истину, вдохновитель всякого терпения. Те, кто принял Его, не умеют ни бежать от гонения, ни откупаться от него: с ними Тот, Кто будет за нас, Кто и говорить будет на допросе, и поможет в страдании.</p>",
"references": "<ol><li><p>Параклет — греческое имя Святого Духа в Ин. 14:16, 26; 16:7–13 (в Синодальном переводе «Утешитель»). Здесь и в конце трактата Тертуллиан говорит как монтанист: он имеет в виду откровения «нового пророчества» Монтана, которые отвергала Церковь. К собеседнику он обращается как к одному из тех, кто этих откровений не принимает.</p></li><li><p>Стояния (лат. stationes, букв. «караулы») — установленные дни поста и молитвы, у Тертуллиана среда и пятница, с окончанием поста в девятом часу. Слово взято из военного обихода: христианин стоит на страже. См. трактат «О посте», гл. 10, 13–14.</p></li><li><p>Тертуллиан следует греческой Септуагинте; в Синодальном переводе: «как капля из ведра… как пылинка на весах».</p></li><li><p>Тертуллиан соединяет два места: в 1 Тим. 1:20 преданы сатане Именей и Александр, а Фигелл и Ермоген названы в 2 Тим. 1:15 как отвратившиеся от Павла.</p></li><li><p>В латинском тексте PL здесь испорченное место: catholice… a quo et ex parte. По-видимому, Тертуллиан говорит: что Бог делает отчасти, в отдельных случаях, то же происходит и в целом.</p></li><li><p>Латинская фраза в PL читается как утверждение (non enim idoneus erat…); по смыслу это ирония: «как будто Он не мог…». Так понимает и английский перевод.</p></li><li><p>Точно таких слов в Евангелиях нет: Тертуллиан свободно передаёт Мф. 10:37–39 и Лк. 14:26.</p></li><li><p>Намёк на гностиков-валентиниан, учивших, что у Христа была не человеческая, а особая плоть и душа. Против них написан трактат Тертуллиана «О плоти Христа».</p></li><li><p>Оба изречения — из сборников монтанистских пророчеств, для Тертуллиана это голос Параклета. Их нет в Писании. Церковь этих откровений не приняла. Первое обыгрывает слово publicari: одновременно «быть выставленным напоказ» и «лишиться имущества в пользу казны».</p></li><li><p>Стих, приписываемый Менандру и ставший пословицей; его связывали с бегством Демосфена из битвы при Херонее.</p></li><li><p>Вергилий, «Энеида», XII, 646.</p></li><li><p>В PL: Fugitivum cum diabolo te reddidisti, букв. «ты сделал себя беглецом вместе с диаволом». Место может быть испорчено.</p></li><li><p>Смелый оборот: «лучше пусть люди ропщут на Бога за мою гибель по Его воле, чем Он прогневается на меня за то, что я спасся по своей».</p></li><li><p>Свободная передача: в Синодальном переводе «прости им грех их, а если нет, то изгладь и меня из книги Твоей». У Тертуллиана здесь, как и часто, своя редакция латинского текста.</p></li><li><p>Тертуллиан цитирует своеобразный латинский текст; в Синодальном переводе «на пастыря Моего… и Я обращу руку Мою на малых».</p></li><li><p>Здесь и дальше Тертуллиан говорит языком римского права: emptio — купля, emancipatio — передача из-под чужой власти, stipulatio — скреплённый договор. Солнце «уступает день»: намёк на затмение при распятии.</p></li><li><p>Вероятно, Стефанин из 1 Кор. 16:15–17.</p></li><li><p>Игра слов: caput — и «голова», то есть подушная подать, и «глава».</p></li><li><p>Бенефициарии и курьёзии — младшие военные чины и агенты, исполнявшие полицейские обязанности. Судя по этому месту, они вели списки тех, с кого регулярно собирали мзду.</p></li><li><p>Saturnalitia — подарки к римскому празднику Сатурналий. Тертуллиан сравнивает откуп с праздничным подношением.</p></li></ol><p>Перевёл Родион Власов, с использованием ИИ. Перевод с латинского по тексту Patrologia Latina, т. 2, стб. 103–120; испорченные места сверены с английским переводом из Ante-Nicene Fathers, т. 4. Ссылки на Писание приведены к Синодальному переводу; ошибочные ссылки издания PL исправлены.</p>",
