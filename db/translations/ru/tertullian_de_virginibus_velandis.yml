"src": "2dNZ_О_покрывале_девственниц",
"title": "О покрывале дев",
"title_sub": "Перевод с латинского",
"meta_desc": "Тертуллиан доказывает из Писания, природы и церковного устава, что девы, достигшие зрелости, должны покрывать голову, как и замужние.",
"body": "<p><strong>Тертуллиан написал это сочинение в поздний период творчества, уверовав в Монтана и приняв ереси монтанистов. Параклетом (Утешителем, обещанным Христом) он называет дух, говоривший, по его убеждению, через Монтана и его пророчиц; поэтому местоимения, относящиеся к такому Параклету, в переводе написаны со строчной буквы.</strong></p><h2>1. Истина выше обычая</h2><p>Я уже защищал своё мнение особым сочинением,[1] а теперь покажу и по-латыни: наши девы должны покрываться с той поры, как перешли из одного возраста в другой. Этого требует истина, против которой ничего нельзя выставить: ни давность, ни покровительство лиц, ни преимущества отдельных областей. Ведь почти отсюда и берётся обычай: начавшись из какого-нибудь неведения или простоты, он от преемства к преемству укрепляется в привычке и так отстаивается против истины. Но Господь наш Христос назвал Себя истиной, а не обычаем. Если Христос вечен и прежде всех, то и истина вечна и древна. Пусть же подумают те, для кого новость то, что само по себе древнее. Ересь обличается не столько своей новизной, сколько истиной. Всё, что противно истине, будет ересью, будь это даже давний обычай. А если кто чего-то не знает, то по своей вине: чего не знаешь, то надо искать, а что узнал, то надо принять.</p><p>Правило веры одно-единственное, только оно неподвижно и неизменяемо. Это вера в единого Бога Вседержителя, Творца мира, и в Сына Его Иисуса Христа, рождённого от Девы Марии, распятого при Понтии Пилате, в третий день воскрешённого из мёртвых, принятого на небеса, ныне сидящего одесную Отца, грядущего судить живых и мёртвых, когда воскреснет и плоть.</p><p>Пока этот закон веры стоит незыблемо, всё остальное, что относится к уставу и образу жизни, допускает новые исправления: благодать Божия действует и движется вперёд до самого конца. Как это может быть, чтобы диавол не переставал трудиться и каждый день прибавлял к хитростям нечестия, а дело Божие остановилось или перестало идти вперёд? Для того и послал Господь Параклета,[2] чтобы человеческая слабость, которая не могла вместить всё сразу, понемногу направлялась и устраивалась и устав был доведён до совершенства этим наместником Господа — Духом Святым. «Ещё многое имею сказать вам, — говорит Он, — но вы теперь не можете вместить. Когда же приидет Он, Дух истины, то наставит вас на всякую истину и будущее возвестит вам» (Ин. 16:12–13). И выше Он говорил об этом его деле.</p><p>В чём же служение Параклета, если не в том, что направляется устав, раскрываются Писания, обновляется понимание, всё движется к лучшему? Ничто не обходится без своего возраста, всё ждёт своего времени. И Екклесиаст говорит: «Всему своё время» (Еккл. 3:1). Посмотри на само творение: оно понемногу идёт к плоду. Сначала зерно, из зерна вырастает росток, из ростка поднимается деревце, потом крепнут ветви и листва, и вот уже целое дерево. Затем набухает почка, из почки раскрывается цветок, из цветка показывается плод, поначалу незрелый и бесформенный; понемногу войдя в возраст, он обретает мягкость вкуса.</p><p>Так и праведность (ведь один и тот же Бог и праведности, и творения): сначала она была в младенческих зачатках, боясь Бога по природе; затем через Закон и пророков продвинулась в детство; затем через Евангелие вскипела юностью; теперь через Параклета устраивается в зрелость. Он один после Христа должен называться учителем и почитаться как учитель: ведь он говорит не от себя, а то, что заповедано Христом. Он единственный предшественник, потому что он один идёт следом за Христом. Кто принял его, ставит истину выше обычая. Кто слышал его пророчества, звучащие и поныне, а не только в давние времена, те покрывают дев.</p><h2>2. Обычай против обычая</h2><p>Но я пока не хочу возводить эту практику к истине. Пусть на время это будет обычай, и я выставлю против обычая обычай. В Греции и в некоторых прилегающих к ней варварских землях многие Церкви прячут своих дев. Есть такой порядок кое-где и под нашим небом, чтобы никто не приписывал этот обычай эллинскому или варварскому язычеству. Но я указал на те Церкви, которые основали сами апостолы или апостольские мужи, и, думаю, ещё раньше некоторых других.[3] Значит, и у них есть тот же авторитет обычая, и они могут выставить времена и предшественников больше, чем эти позднейшие.</p><p>Чего же нам держаться, что выбрать? Мы не можем отвергнуть обычай, которого не можем осудить: он не чужой, потому что это обычай не чужих, а тех, с кем мы разделяем право мира и имя братства. У нас с ними одна вера, один Бог, тот же Христос, та же надежда, те же таинства купели. Скажу разом: мы одна Церковь. Значит, наше всё, что принадлежит нашим. Иначе ты разделяешь тело.</p><p>Но здесь, как обычно бывает при всяком разнообразии установлений, сомнениях и неясности, следовало проверить, какой из двух столь различных обычаев больше подходит уставу Божию. И, конечно, выбрать надо тот, что укрывает дев, известных одному Богу. Им не только следует искать славы у Бога, а не у людей, но и стыдиться собственного достоинства.</p><p>Деву смутишь скорее похвалой, чем порицанием: у порока лицо твёрже, он в самом себе и от самого себя научился бесстыдству. Обычай, который лишает дев девства тем, что выставляет их напоказ, не одобрил бы никто, кроме людей того же сорта, что и сами эти девы. Такие глаза пожелают видеть деву, какие глаза у девы, желающей быть увиденной. Глаза одного рода ищут друг друга. Желание быть увиденным и желание видеть — одна и та же похоть. Святой муж покраснеет, увидев деву, так же как святая дева, если её увидит мужчина.</p><h2>3. Смута: девы человеческие против дев Божиих</h2><p>Но святейшие наши предшественники не стали разбираться между обычаями. Всё же у нас ещё недавно относились к этому терпимо и допускали оба обычая. Дело было оставлено на усмотрение: хочет каждая покрываться или выставляться напоказ — так же, как и выходить замуж, что не принуждается и не запрещается. Истина довольствовалась сделкой с обычаем, чтобы тихо, под именем обычая, пользоваться собой хотя бы отчасти.</p><p>Но познание стало расти, и при свободе обоих обычаев уже показывался признак лучшей стороны. И тут же противник всего доброго, тем более добрых установлений, сделал своё дело. Девы человеческие восстают против дев Божиих, с совершенно открытым лбом, подстрекаемые к дерзкой наглости. Девами считаются те, кто может чего-то требовать от мужчин, не говоря уж о таком деле: чтобы им выдали их соперниц, тем более свободных, что они служанки одного Христа.</p><p>«Мы соблазняемся, — говорят они, — оттого, что другие ходят иначе». И предпочитают соблазняться, а не воодушевиться примером. Соблазн, если не ошибаюсь, — пример не доброго, а дурного дела, наставляющий к греху. Доброе соблазняет только дурной ум. Если скромность, стыдливость, презрение к славе, стремление угодить одному Богу — благо, то пусть признают своё зло те, кто таким благом соблазняется. Что же, если и невоздержанные скажут, что воздержные их соблазняют, надо отменить воздержание? И чтобы не соблазнялись многобрачные, надо отвергнуть единобрачие? Почему бы этим покрытым не пожаловаться, что соблазн для них — задиристость и бесстыдство девства напоказ?</p><p>Значит, ради таких торгующих собою голов[4] святых дев будут тащить в Церковь, краснеющих от того, что их узнают посреди всех, трепещущих от того, что их обнажают, вызванных словно на насилие? Ведь и этого они не хотят претерпеть не меньше. Всякое выставление доброй девы напоказ есть претерпевание насилия. И всё же насилие над плотью — меньшее зло: оно идёт от отправления природы. А когда в деве оскорбляют сам дух, то, сняв покрывало, она научилась терять то, что берегла.</p><p>О святотатственные руки, сумевшие сорвать посвящённый Богу наряд! Что худшее сделал бы какой-нибудь гонитель, узнав, что дева это избрала? Ты обнажила голову девушки, и вот она уже не вполне дева для самой себя: она стала другой.</p><p>Восстань же, истина, восстань и как бы вырвись из своего терпения! Я не хочу, чтобы ты защищала какой бы то ни было обычай: ведь уже и тот, под которым ты пользовалась собой, упразднён. Покажи, что ты сама — та, кто покрывает дев. Сама истолкуй свои Писания, которых обычай не знает. Если бы знал, его никогда бы не было.</p><h2>4. Апостол сказал «жена» — значит, и о девах</h2><p>Но раз у обычая принято спорить против истины и на основании Писаний, нам сразу возражают: апостол, давая постановление о покрывале, не упомянул дев, а назвал только жён.[5] Если бы он хотел, чтобы покрывались и девы, он сказал бы и о девах, назвав их вместе с жёнами, как там, где говорит о браке и объясняет, что надо соблюдать и девам. Следовательно, говорят они, закон о покрытии головы их не касается, раз они в нём не названы; более того, этим они и открываются, потому что нет приказа тем, кого и не называют.</p><p>Мы обратим этот довод против них. Кто умел в других местах упоминать и тот и другой разряд, то есть деву и жену, иначе говоря, не деву, когда надо было их различить, тот, не называя девы и не проводя различия, показывает общность положения. Он мог бы и здесь установить разницу между девой и женой, как говорит в другом месте: «Разделены жена и дева».[6] Значит, тех, кого не разделил, он молча оставил без различия.</p><p>И то, что там жена и дева разделены, не станет защитой и здесь, как хотят некоторые. Многое из сказанного в одном месте не действует там, где это не сказано, если только дело не то же, что и в другом месте, так что достаточно сказать однажды. А там дело девы и жены далеко от этого вопроса. «Разделены жена и дева» (1 Кор. 7:34). Почему? Потому что незамужняя, то есть дева, «заботится о Господнем, как угодить Господу, чтобы быть святою и телом и духом», а замужняя, то есть не дева, «заботится о том, как угодить мужу». Вот объяснение этого разделения. В нашей главе ему нет места, потому что там говорится не о браке и не о мыслях жены и девы, а о покрытии головы. Святой Дух не пожелал здесь никакого различия и под одним именем жены велел разуметь и деву. Не называя её отдельно, Он не отделил её от жены и, не отделив, соединил с той, от кого не отделил.</p><p>Неужели это такая новость — употребить главное слово и подразумевать под ним всё остальное, когда нет нужды разбирать общее по отдельности? Краткость речи естественна, приятна и необходима, а растянутая речь и тягостна, и пуста. Вот мы и довольствуемся общими словами, включающими в себя понятие о частном.</p><p>Обратимся к самому слову. Природное название — «женщина», общее для этого природного названия — «жена», а частные у общего — «дева», «замужняя», «вдова» и сколько ещё имён прибавляется по возрасту. Частное подчинено общему, потому что общее первично; вторичное — предшествующему, часть — целому. Оно разумеется в том, чему подчинено, и обозначается в нём, потому что в нём содержится. Так, когда названо тело, не надо отдельно называть ни руку, ни ногу, ни другого члена. Скажешь «мир» — и там будет и небо со всем, что на нём: солнце, луна, звёзды, светила, земля, моря и весь перечень стихий. Всё назвал, назвав то, что из всего состоит. Так и называя жену, он назвал всё, что к жене относится.</p><h2>5. Ева была «женой» ещё девой</h2><p>Но они так толкуют имя «жена», будто оно подходит только той, что знала мужчину. Поэтому нужно доказать, что это имя относится к самому полу, а не к какой-то степени внутри пола, так что и девы причисляются сюда же.</p><p>Когда этот род второго человека был создан Богом в помощь человеку (Быт. 2:18), та женщина сразу же была названа женой: ещё счастливая, ещё достойная рая, ещё дева. «Она, — сказано, — будет называться женою» (Быт. 2:23). Вот тебе имя, которое не просто обще с девой, но принадлежит ей лично, потому что дева получила его от начала.</p><p>Некоторые, впрочем, изобретательно хотят видеть здесь будущее: «будет называться женою» — как той, кем она станет, лишившись девства. Ведь сказано дальше: «Потому оставит человек отца своего и мать свою и прилепится к жене своей; и будут одна плоть» (Быт. 2:24). Пусть же покажут сначала, в чём тут тонкость: если она названа женой в будущем, то какое имя она получила на то время? Не могла же она быть без имени, отвечающего её настоящему состоянию. Как могло быть, чтобы той, которой на будущее назначено имя, в настоящем не дали никакого? Адам всем животным дал имена, и никому по будущему состоянию, а по настоящему устройству, которому служило потом какое угодно состояние, каждого называя так, как пожелал с начала. Как же тогда она звалась? Да и всякий раз, когда Писание её называет, она зовётся женой ещё до брака и никогда — девой, хотя была девой. Это имя было тогда единственным, и притом тогда, когда пророчески ничего не сказано.</p><p>Когда Писание говорит, что были наги двое, Адам и жена его (Быт. 2:25), это не намёк на будущее, будто «жена» здесь значит будущую супругу. Она названа его женой, и не будучи замужем, потому что произошла из него: «Вот, это кость от костей моих и плоть от плоти моей; она будет называться женою» (Быт. 2:23). Отсюда, по безмолвному сознанию природы, божественность самой души ввела в обиход, без ведома людей (как и многое другое, что делается и говорится в согласии с Писанием, как мы сможем показать в другом месте), называть наших супруг жёнами. Хотя мы и выражаемся здесь не вполне точно: и греки, которые особенно часто употребляют слово «жена» о супруге, имеют для супруги другие, собственные слова.</p><p>Но я предпочитаю относить этот обычай к свидетельству Писания. Когда двое через брачный союз становятся одной плотью, плоть от плоти и кость от костей, супруга зовётся по происхождению женой того, из чьего существа она и считается созданной. Итак, «жена» не по природе есть имя супруги, а «супруга» по положению есть имя жены. Женой можно назвать ту, что не супруга; а супругой нельзя назвать ту, что не жена: ею и быть нельзя.</p><p>Итак, установив имя новой женщины, то есть жена, и объяснив, чем она была прежде, то есть дав имя, Он обращается затем к пророчеству: «Потому оставит человек отца своего и мать». Имя настолько отделено от пророчества, насколько отделено и от самого лица. Сказано это не о самой Еве, а о будущих женщинах, которых Он назвал в этой родоначальнице женского рода. Иначе Адам должен был бы оставить ради Евы отца и мать, которых у него не было. Значит, сказанное пророчески не относится к Еве, как не относится и к Адаму. Это предсказание о положении мужей, которые оставят родителей ради жены, а к Еве оно не могло относиться, как и к Адаму. Если так, то ясно, что она названа женой не из-за будущего, которое к ней не относится.</p><p>К тому же Он Сам объяснил причину этого имени. Сказав: «будет называться женою», Он прибавил: «ибо взята от мужа своего», а тот был ещё девственным. Об имени «муж» скажем в своём месте. Пусть же никто не толкует как пророчество имя, выведенное из другого значения. Тем более что видно, где она получила имя от будущего: там, где названа Евой, это уже личное имя, потому что природное предшествовало. Если Ева — мать всех живущих (Быт. 3:20), то вот она и названа по будущему, вот предвещается супруга, не дева. Это имя той, что выйдет замуж: мать получается из замужней. Так и здесь видно, что жена тогда названа не по будущему: потом она должна была получить имя будущего своего положения. На эту часть ответ дан достаточный.</p><h2>6. Мария названа женой</h2><p>Посмотрим теперь, соблюдает ли и апостол этот образец словоупотребления согласно книге Бытия, относя его к полу и называя жёной деву Марию так же, как книга Бытия — Еву. Галатам он пишет: «Бог послал Сына Своего, Который родился от жены» (Гал. 4:4), а она, бесспорно, была девой, хотя Евион[7] это и оспаривает. Знаю и об ангеле Гаврииле, посланном к деве, но, благословляя её, он причисляет её к жёнам, а не к девам: «Благословенна Ты между жёнами» (Лк. 1:28). Ангел тоже знал, что и дева зовётся женой.</p><p>Но и на эти два места кое-кто, как ему показалось, остроумно ответил: Мария была обручена, поэтому и ангел, и апостол назвали её женой, ведь обручённая в каком-то смысле замужем. Однако между «в каком-то смысле» и «на самом деле» разница велика, по крайней мере здесь: в других случаях это можно принять. Здесь же они назвали Марию женой не как уже замужнюю, а просто как женщину, которая была бы так названа и не будучи невестой, как именуемую этим именем с начала. Решать должно то, откуда идёт образец.</p><p>А что до нашей главы: если Мария здесь приравнена к обручённой, так что названа женой не как женщина, а как замужняя, то Христос родился уже не от девы, раз родился от обручённой, переставшей по этому имени быть девой. А если Он родился от девы, хотя бы и обручённой, но всё же нетронутой, признай, что и дева, и нетронутая зовётся женой. Здесь уж никак нельзя усмотреть пророчества: будто апостол, говоря «родился от жены», назвал будущую жену, то есть замужнюю. Он не мог назвать позднейшую жену, от которой Христос не должен был родиться, то есть познавшую мужа, а назвал ту, что была тогда, которая была девой и звалась женой по точному смыслу этого слова, согласно образцу начала: имя, закреплённое за девой, а значит, за всем родом жён.</p><h2>7. Доводы апостола подходят и девам</h2><p>Обратимся теперь к самим доводам, которыми апостол учит, что женщине следует покрываться, и посмотрим, относятся ли они и к девам. Тогда и отсюда станет ясна общность имени дев и не дев: одни и те же причины для покрывала находятся и там, и тут.</p><p>Если глава жены — муж (1 Кор. 11:3), то, разумеется, и девы, из которой получается та жена, что вышла замуж; разве только дева — какой-то третий род, чудовище со своей собственной головой. Если жене стыдно быть обритой или остриженной (1 Кор. 11:6), то, разумеется, и деве. Пусть посмотрит соперник Бога, мир сей, как он лживо приписывает деве красоту стриженых волос, как и мальчику, которому это позволено. Итак, кому одинаково не подобает быть обритой или остриженной, той одинаково подобает и покрываться. Если жена — слава мужа (1 Кор. 11:7), то тем более дева, которая и себе самой слава. Если жена от мужа и для мужа (1 Кор. 11:8–9), то ребро Адама сначала было девой.</p><p>Если жена должна иметь на голове знак власти (1 Кор. 11:10), то тем справедливее дева, к которой относится самая причина. Если это ради ангелов, тех, что, как мы читаем, отпали от Бога и неба из-за вожделения к женщинам,[8] кто может предположить, будто такие ангелы возжелали уже осквернённых тел и остатков человеческой похоти, а не воспылали скорее к девам, чей цвет извиняет и человеческую похоть? Ведь и Писание это подсказывает: «Когда люди начали умножаться на земле и родились у них дочери, тогда сыны Божии увидели дочерей человеческих, что они красивы, и брали их себе в жёны, какую кто избрал» (Быт. 6:1–2). Греческое слово «жёны» здесь значит «супруги», потому что речь о браке. Говоря о «дочерях человеческих», оно явно указывает на дев, которые ещё считаются при родителях: замужних ведь называют по мужьям. Могло бы быть сказано «жёны человеческие». Ангелы названы не прелюбодеями, а мужьями: они берут незамужних дочерей человеческих, о которых выше сказано, что те родились. Так обозначено их девство: сперва родились, а затем выданы за ангелов. Другого о них я не знаю, кроме того, что родились и потом вышли замуж.</p><p>Итак, должно быть затенено лицо столь опасное, бросившее соблазн до самого неба. Предстоя Богу, перед Которым она виновна в изгнании ангелов, пусть она устыдится и других ангелов и сдержит ту былую дурную свободу своей головы, не выставляя её больше и на глаза людям. Да и если бы те ангелы вожделели уже осквернённых женщин, тем более следовало бы девам покрываться ради ангелов: ещё вероятнее ангелы согрешили бы из-за дев.</p><p>Если апостол прибавляет ещё предуказание природы, что честь для жены — обилие волос, потому что волосы даны вместо покрывала (1 Кор. 11:15), то это, конечно, особенно украшение девы: сама их причёска такова, что, собранные на темени, волосы укрывают кольцом саму вершину головы.</p><h2>8. Закон для всех: «всякая жена»</h2><p>Противоположное всему этому и приводит к тому, что муж не покрывает головы: ему от природы не дано столько волос, ему не стыдно быть обритым или остриженным, не из-за него отступили ангелы, он слава и образ Божий, глава его — Христос (1 Кор. 11:3–7, 14).</p><p>Итак, говоря о муже и жене, почему той следует покрываться, а тому нет, апостол умолчал о деве по той же причине, по какой не назвал и мальчика, которого надо считать в числе мужей: он охватил весь строй обоих полов их собственными словами «жена» и «муж». Так и Адам, ещё нетронутый, назван в Бытии мужем: «Она будет называться женою, ибо взята от мужа» (Быт. 2:23). Адам — муж до брачного соединения, как и Ева жена.</p><p>Апостол сказал об обеих сторонах достаточно для всего вида каждого пола, и кратко, и полно, таким обстоятельным определением: «всякая жена» (1 Кор. 11:5). Что значит «всякая», если не всякого рода, всякого разряда, всякого положения, всякого достоинства, всякого возраста? Ведь «всякий» значит целый, полный, без нехватки какой-либо части. А дева — часть жён. Так же и о муже, который не покрывается: «всякий» (1 Кор. 11:4).</p><p>Вот два разных имени, муж и жена, и при каждом «всякий». Два взаимосвязанных закона: здесь покрываться, там открываться. Если, раз сказано «всякий муж», имя мужа обще и для ещё не мужа, для безбородого подростка, а имя по природе общее, то общий и закон не покрываться для того, кто среди мужей девствен по своему правилу. Почему же не считать решённым, что и всякая дева заключена в имени жены общностью имени, чтобы была заключена и общностью закона? Если дева не жена, то и подросток не муж. Если не покрывается дева, потому что она не жена, то пусть покрывается подросток, потому что он не муж. Одна и та же уступка пусть будет одному и тому же девству. Как девы не обязаны покрываться, так пусть и отроки не обязаны открываться.</p><p>Почему мы частично принимаем определение апостола как безусловное обо всяком муже и не спрашиваем, почему он не назвал и мальчика, а частично нарушаем его, хотя оно столь же безусловно обо всякой жене? «А если бы кто захотел спорить, то мы не имеем такого обычая, ни церкви Божии» (1 Кор. 11:16). Он показывает, что по этому вопросу был спор, и чтобы погасить его, говорит так кратко: не называет девы, показывая, что в её покрытии нельзя сомневаться, и называет всякую жену, чем и назвал деву. Так поняли и сами коринфяне: коринфяне и теперь покрывают своих дев. То, чему учили апостолы, подтверждают те, кто у них учился.</p><h2>9. Устав Церкви: дева не имеет преимуществ</h2><p>Посмотрим теперь: как мы показали, что доводы от природы и из существа дела относятся и к деве, так не относятся ли к деве и предписания церковного устава о жене? Жене не позволено говорить в церкви (1 Кор. 14:34; 1 Тим. 2:12), а также учить, крестить, приносить жертву и притязать на участие в каком бы то ни было мужском деле, тем более в священническом служении. Спросим: позволено ли что-либо из этого деве? Если деве не позволено, и она во всём подчинена тому же положению, и обязанность смирения одинакова у неё с женой, то откуда ей позволено это одно, что не позволено никакой женщине? Какое преимущество заслужила дева вопреки своему положению, если какая-нибудь дева решила освятить свою плоть? Разве для того ей даётся послабление в покрывале, чтобы она входила в церковь приметная и отличаемая, чтобы показывала честь святости свободой головы? Достойнее было бы почтить её каким-нибудь преимуществом мужской степени или должности.</p><p>Я точно знаю, что где-то деву, которой нет и двадцати лет, поместили в чин вдов.[9] Если епископ должен был оказать ей какую-то поддержку, он мог бы сделать это иначе, не нарушая устава, чтобы в Церкви не отмечалось теперь такое чудо, чтобы не сказать чудовище: дева-вдова. Тем более диковинное, что и как вдова она не покрыла головы, отрицая то и другое: и что она дева, раз считается вдовой, и что вдова, раз называется девой. Но она сидит там с непокрытой головой той же властью, которой и как дева. А на это место избирают не только женщин старше шестидесяти лет (1 Тим. 5:9), бывших женой одного мужа, то есть замужних, но и матерей, притом воспитавших детей. Это для того, чтобы, зная на опыте все чувства, они легко умели помогать другим и советом, и утешением и чтобы сами прошли всё, чем испытывается женщина. Вот насколько мало уважения по месту дано деве.</p><h2>10. Если бы девству полагался знак</h2><p>Так нет его и по каким-либо знакам отличия. Иначе было бы слишком бесчеловечно: женщины, во всём подчинённые мужчинам, носили бы почётный знак девства, чтобы братья смотрели на них с восхищением, оборачивались и прославляли их, а столько девственников-мужчин, столько добровольных скопцов ходили бы со своим скрытым благом, не имея ничего, что и их сделало бы заметными. Тогда и им надо будет завести себе какие-нибудь отличия: перья гарамантов, повязки варваров, цикад афинян, чубы германцев или татуировки бриттов.[10] Или наоборот: пусть в церкви прячутся, покрыв голову.</p><p>Мы уверены: если бы Дух Святой предписал что-то подобное женщинам, то ещё скорее предписал бы мужчинам. Сверх авторитета пола, мужчин следовало бы больше почтить и ради самого воздержания. Чем жаднее и горячее их пол к женщинам, тем труднее их воздержание, тем более жаркое, и потому оно достойнее всякой чести, если вообще выставлять напоказ — это достоинство девства.</p><p>Разве воздержание не выше девства, будь то воздержание вдовых или тех, кто по согласию отказался от общего бесчестия?[11] Девство держится благодатью, воздержание — добродетелью. Великая борьба — не желать того, к чему привык, желая. А если плода этого желания не знаешь, легко не будешь желать: нет противника, то есть желания плода. Как же Бог не предписал бы скорее мужчинам что-то такое в честь: либо потому, что он ближе, ведь это Его образ, либо потому, что он больше трудится? А если мужчине ничего, то тем более женщине.</p><h2>11. С какого возраста</h2><p>Вернусь к тому, что выше пропустил в ходе рассуждения, чтобы не нарушать его связности. Когда мы утвердились на безусловном определении апостола, что «всякая жена» понимается и всякого возраста, могли бы возразить: значит, деве надо покрываться с рождения, с первого упоминания о возрасте. Но это не так, а лишь с той поры, как она начнёт понимать себя, войдёт в разряд своей природы, выйдет из разряда дев и начнёт испытывать то новое, что свойственно другому возрасту.</p><p>Ведь и родоначальники рода Адам и Ева, пока у них не было понимания, ходили нагими (Быт. 2:25). А когда вкусили от древа познания, первое, что почувствовали, был стыд (Быт. 3:7). И каждый отметил понимание своего пола покровом.</p><p>И если покрываться надо ради ангелов, то закон покрывала, несомненно, начнёт действовать с того возраста, в каком дочери человеческие смогли вызвать к себе вожделение и вступить в брак. Дева перестаёт быть таковой с той поры, как может ею не быть. Поэтому в Израиле нельзя выдавать замуж прежде, чем кровь засвидетельствует зрелость: до этого знака дело неспелое. Итак, если дева остаётся девой, пока неспела, то, признанная зрелой, она перестаёт быть девой и как не дева подпадает под закон, как и под брак.</p><p>У обручённых есть пример Ревекки. Когда её, незнакомую, вели к незнакомому жениху и она узнала в увиденном издалека того самого, она не стала ждать пожатия рук, поцелуя, приветствия, а, признав то, что чувствовала, то есть что она замужем духом, отреклась от девичества и тут же покрылась покрывалом (Быт. 24:64–65). О жена, уже Христовой школы! Она показывает, что брак, как и блуд, совершается во взгляде и в уме. Правда, некоторые всё ещё покрывают Ревекку.[12]</p><p>Что до остальных, не обручённых, пусть отвечает родительская медлительность, идущая от бедности или излишней осторожности, пусть отвечает и сам обет воздержания. К возрасту, идущему своим сроком и выплачивающему зрелости своё, это не относится. Другая, сокрытая мать — природа — и другой, тайный отец — время — выдали замуж свою дочь по своим законам. Посмотри на эту твою деву: она уже замужем и душой, через ожидание, и плотью, через преображение. А ты готовишь ей ещё второго мужа. Вот уже и голос огрубел, и тело налилось, и стыдливость всюду покрылась, и месячные платят подать. А ты отрицаешь, что она жена, хотя и говоришь, что у неё женское!</p><p>Если жену делает соединение с мужем, пусть не покрываются до самого брачного совокупления. Но ведь и у язычников к жениху ведут покрытыми. А если покрываются к обручению, потому что телом и духом соединились с мужчиной через поцелуй и рукопожатие, которыми впервые сняли печать со стыдливости духа, через общий залог сознания, которым согласились на всё смущение, то тем более их покроет время, без которого нельзя обручиться и под напором которого они и без обручения перестают быть девами. Время соблюдают и язычники, отдавая по закону природы своё каждому возрасту: женщин они допускают к делам с двенадцати лет, мужчин двумя годами позже, определяя зрелость годами, а не обручением или браком. Матерью семейства называют и деву, отцом семейства — и безбородого. А мы не соблюдаем и природного, будто Бог природы другой, чем наш.</p><h2>12. Сам возраст свидетельствует</h2><p>Признай и жену, признай и замужнюю по свидетельствам тела и духа, по тому, что она испытывает и в сознании, и в плоти. Это первые таблички природного обручения и брака. Надень покрывало снаружи на ту, у которой покрывало внутри. Пусть будет покрыт верх у той, чей низ не наг.</p><p>Хочешь знать, какова власть возраста? Поставь рядом двух: ту, что преждевременно взята мужем, в наряде жены, и ту, что, войдя в зрелость, остаётся девой в своём наряде. Скорее усомнятся, что первая жена, чем поверят, что вторая дева. Возраст так убедителен, что его не заглушить и нарядом.</p><p>Да и наши сами нарядом признают перемену возраста. Как только поняли, что они жёны, они выходят из дев, прежде всего изменяя голову: перекручивают волосы, закалывают косу более игривой булавкой, разделив волосы ото лба, открыто заявляя о женской зрелости. Вот они уже спрашивают зеркало о красоте, вымачивают привередливое лицо в умываниях, может быть, и подправляют его каким-нибудь снадобьем, набрасывают плащ, обуваются в затейливую обувь, в баню берут больше снаряжения. К чему перечислять всё? Сами их явные приготовления разносят всю женскую зрелость. А девами они хотят быть одной непокрытой головой, одним видом отрицая то, что объявляют всем убранством.</p><h2>13. Показное девство</h2><p>Если они злоупотребляют нарядом ради людей, пусть выдерживают его и тем, что у язычников покрывают голову. А в церкви пусть прячут своё девство, раз скрывают его вне церкви. Боятся чужих — пусть устыдятся и братьев. Или пусть твёрдо решатся показываться девами на улицах так же, как решаются в церквах. Я похвалю силу духа, если они будут торговать своим девством и у язычников. Одна и та же природа снаружи и внутри, одно и то же установление перед людьми и перед Господом и держится одной свободой. Почему же снаружи они прячут своё благо, а в церкви выставляют?</p><p>Требую ответа: чтобы угодить братьям или Самому Богу? Если Самому Богу, то Он столь же способен видеть сделанное втайне, сколь справедлив воздать за сделанное для Него одного. Он и заповедует не трубить о том, что заслужит награду у Него, и не брать за это воздаяния от людей (Мф. 6:1–4). Если нам запрещено отдать один викториат[13] и всякое дело милостыни так, чтобы знала левая рука, то сколько тьмы должны мы напустить, принося Богу столь великую жертву — само тело и сам дух, посвящая Ему саму природу?</p><p>Значит, то, что нельзя считать совершённым ради Бога, потому что Бог не хочет, чтобы так совершалось, совершается ради людей, и это прежде всего недозволено, как похоть славы. Слава недозволена тем, кто проверяется всяким смирением. А если дар воздержания дан Богом, то «что хвалишься, как будто не получил?» (1 Кор. 4:7). А если не получил, то что у тебя есть, чего тебе не дано? Тем самым ясно: тебе дал это не Бог, раз ты посвящаешь это не одному Богу. Посмотрим же, прочно ли и истинно ли человеческое.</p><h2>14. Куда ведёт жажда славы</h2><p>Рассказывают, что когда этот вопрос только возник, некая дева сказала: «А как же мы будем привлекать других к такому подвигу?» Будто счастье наше в том, чтобы таких было больше, а не в благодати Божией и заслугах каждого! Девы ли украшают церковь перед Богом или Церковь — дев, или она их Ему препоручает? Значит, признано, что причина — слава. А где слава, там заискивание; где заискивание, там принуждение; где принуждение, там необходимость; где необходимость, там немощь.</p><p>Поэтому поделом, не покрывая голову, чтобы к ним заискивали ради славы, они вынуждены покрывать живот, павши по немощи. Выводит их вперёд соперничество, а не благочестие, а иногда бог их — сам живот (Флп. 3:19): братство ведь охотно содержит дев. И они не только падают, но и тянут за собой длинную верёвку грехов (Ис. 5:18). Выставленные на середину, гордые объявленным всем своим благом, осыпанные братьями всякой честью и делами любви, они, не имея возможности скрыться, если что случится, думают о том, что позора им будет столько же, сколько было чести.</p><p>Если непокрытая голова приписывается девству, то дева, отпавшая от благодати девства, чтобы себя не выдать, остаётся с непокрытой головой. Теперь она ходит в чужом наряде, тем, на который притязает девство, и продолжает в нём оставаться, хотя теперь он чужой, чтобы переменой себя не выдать. Зная за собой уже несомненное, они смеют подходить к Богу с открытой головой. Но ревнитель Бог и Господь, сказавший: «Нет ничего сокровенного, что не открылось бы» (Мф. 10:26),[14] многих выводит на свет. Сами они не признаются, пока их не выдаст плач собственных младенцев.</p><p>И насколько больше таких, не заподозришь ли их ещё и в больших преступлениях? Скажу, хоть и не хочу: нелегко однажды стать женой той, что не боится ею становиться и, став, может лгать перед Богом, что дева. На что она только не решится ради своего чрева, чтобы её не разоблачили и как мать! Бог знает, скольких младенцев, доношенных и целых, матери долго убивали во чреве.[15] Легко всегда зачинают и благополучно рожают такие девы, и притом детей, очень похожих на отцов.</p><p>Такие преступления совершает вынужденное и недобровольное девство. Само вожделение не оставаться в тени нецеломудренно. Оно испытывает нечто не свойственное деве: стремление нравиться, разумеется и мужчинам. Сколько угодно пусть старается с добрым намерением: выставляя себя, она неизбежно подвергается опасности, когда её пронзают неверные и многочисленные взгляды, когда щекочут указывающие пальцы, когда чрезмерно любят, когда разгорячается среди постоянных объятий и поцелуев. Так твердеет лоб, так стирается стыд, так он ослабевает, так учатся желать нравиться иначе.</p><h2>15. Настоящее девство</h2><p>Но подлинное, полное и чистое девство ничего так не боится, как самого себя. Оно не хочет терпеть и женских глаз; у него самого другие глаза. Оно прибегает к покрывалу головы, как к шлему, как к щиту, защищающему своё благо от ударов искушений, от стрел соблазнов, от подозрений, перешёптываний, соперничества и самой зависти.</p><p>Ведь даже у язычников есть нечто пугающее, что они называют сглазом: несчастный исход чрезмерной хвалы и славы. Мы иногда толкуем это как дело диавола, ибо ему свойственно ненавидеть доброе; иногда приписываем Богу, ибо это Его суд над гордыней: Он возвышает смиренных и низлагает превозносящихся. Так что более святая дева будет страшиться, хотя бы по имени сглаза, с одной стороны врага, с другой Бога: зависти того и взыскующего взора Этого. И будет радоваться, известная только себе и Богу. А если кто и узнает её, она поступит мудро, закрыв доступ искушениям. Кто осмелится вонзить свой взгляд в закрытое лицо, лицо ничего не чувствующее, лицо, скажу, суровое? Всякая дурная мысль разобьётся о самую эту строгость. Кто скрывает деву, та уже отрицает и жену.</p><h2>16. Итог и обращение к девам</h2><p>Вот на чём стоит защита нашего мнения: на Писании, на природе, на уставе. Писание устанавливает закон, природа свидетельствует, устав требует. Какая из этих трёх помогает мнению, основанному на обычае, что служит прикрасой противоположному взгляду? От Бога Писание, от Бога природа, от Бога устав. Всё, что противно им, не от Бога.</p><p>Если Писание неясно, то природа очевидна, и при её свидетельстве Писание не может быть неясным. Если сомневаются в природе, то устав показывает, что больше угодно Богу. Ничто Ему не дороже смирения, ничто не приятнее скромности, ничто не ненавистнее славы и старания нравиться людям. Пусть же будет для тебя и Писанием, и природой, и уставом то, что найдёшь угодным Богу, как и велено всё испытывать и хорошего держаться (1 Фес. 5:21).</p><p>Остаётся обратиться к ним самим, чтобы они охотнее это приняли. Прошу тебя, мать ли, сестра ли, дочь-дева (назову тебя по именам возраста): покрой голову. Если ты мать — ради сыновей; если сестра — ради братьев; если дочь — ради отцов. В тебе в опасности все возрасты. Надень доспех стыдливости, обведи себя валом скромности, воздвигни своему полу стену, которая и твоих глаз не выпустит, и чужих не впустит. Прими полный наряд жены, чтобы сохранить состояние девы. Солги немного о внутреннем, чтобы одному Богу открыть истину. Хотя ты и не лжёшь, назвавшись замужней: ты вышла замуж за Христа, Ему вручила плоть, с Ним обручила свою зрелость. Ходи по воле своего Жениха. Это Христос велит покрываться чужим невестам и жёнам, тем более Своим.</p><h2>17. Как покрываться</h2><p>Но и вас, жёны, вступившие в брак, увещаем о другом целомудрии: не отставайте от устава о покрывале ни на миг, не разрушайте его иначе, раз отвергнуть его не можете, ходя ни покрытыми, ни нагими. Некоторые не покрывают голову, а подвязывают её митрами и шерстяными лентами: спереди прикрыты, а там, где собственно голова, открыты. Другие покрывают лишь темя маленькими платочками, думаю, чтобы не давить на голову, и не опускают их даже до ушей. Мне жаль их, если у них такой слабый слух, что сквозь покров не слышат.</p><p>Пусть знают, что вся голова — жена. Её пределы и границы простираются до того места, откуда начинается одежда. Сколько могут занять распущенные волосы, столько занимает и область покрывала, чтобы охватить и шею. Ведь именно она должна быть подчинена, из-за неё и надо иметь знак власти на голове (1 Кор. 11:10). Покрывало — её ярмо.</p><p>Вас будут судить язычницы-аравитянки. Они покрывают не только голову, но и всё лицо так, что, оставив открытым один глаз, довольствуются половиной света, но не выставляют лицо напоказ. Одна римская царица называла их несчастнейшими, потому что они могут скорее полюбить, чем быть любимыми, хотя они счастливы, избавленные от другого, более частого несчастья, ведь женщин легче полюбить, чем им самим полюбить. Языческая строгость чище и, если можно так сказать, суровей.</p><p>Нам же Господь и откровениями отмерил пределы покрывала. Одной нашей сестре ангел во сне, как бы хлопая по шее, сказал: «Прекрасная шея, и поделом она обнажена! Хорошо бы тебе покрываться от головы до поясницы, чтобы и тебе эта свобода шеи не пошла в прок». И конечно, что сказано одной, сказано всем.</p><p>Какого же наказания заслуживают те, кто и за псалмами, и при всяком упоминании Бога остаются непокрытыми! А те, кто и на самой молитве легко кладут на темя бахрому, клочок или какую-нибудь нитку и считают себя покрытыми, — неужели так мала цена их голове? Другие, у которых ладонь, конечно, больше всякой бахромы и нити, не меньше злоупотребляют своей головой, как некое животное, скорее чем птица, хоть и крылатое: с малой головой, вытянутой шеей, в остальном высоконогое. Говорят, что, когда ему надо спрятаться, оно прячет в чащу одну только голову, а всё остальное оставляет на виду.[16] Так, обезопасив голову, но нагое там, где оно больше, оно целиком попадается вместе с головой. Такими будут и те, кто прикрыт меньше, чем полезно.</p><p>Итак, надо всегда и всюду ходить, помня закон, быть готовыми и наготове ко всякому упоминанию Бога. Если Он в сердце, то будет заметен и на голове женщин. Читающим это с добрым миром, предпочитающим истину обычаю, мир и благодать от Господа нашего Иисуса да преумножатся, вместе с Септимием Тертуллианом, чьё это небольшое сочинение.</p>",
"references": "<ol><li><p>Тертуллиан, видимо, уже писал об этом по-гречески; греческий текст не сохранился. Отсюда слова «и по-латыни».</p></li><li><p>Параклет — греческое имя Святого Духа (Ин. 14:16; в Синодальном переводе «Утешитель»). Как монтанист, Тертуллиан относит к Нему откровения «нового пророчества» и выводит из них ужесточение церковного устава. Церковь этого учения не приняла.</p></li><li><p>Намёк на то, что еретики появились позже, или на Церкви позднего основания, ссылающиеся на свою древность.</p></li><li><p>Capita nundinatitia — букв. «головы с рынка», то есть выставленные на продажу. Тертуллиан называет так неприкрытых дев.</p></li><li><p>Латинское mulier значит и «женщина вообще», и «замужняя». Именно на этом держится весь спор: о ком сказано в 1 Кор. 11 — обо всех женщинах или только о замужних? Поэтому mulier везде переведено библейским словом «жена», имеющим в русском языке то же двойное значение; foemina — «женщина», uxor — «супруга», vir — «муж», virgo — «дева».</p></li><li><p>1 Кор. 7:34; в Синодальном переводе «есть разность между замужнею и девицею». Тертуллиан следует латинскому тексту: Divisa est mulier et virgo.</p></li><li><p>Евион — предполагаемый основатель секты евионитов, отрицавших девственное рождение Христа.</p></li><li><p>Тертуллиан понимает «сынов Божиих» из Быт. 6:2 как ангелов — так толковала Книга Еноха, которую он почитал; тем же толкованием он объясняет «ради ангелов» в 1 Кор. 11:10. Позднейшая церковная традиция это толкование отвергла.</p></li><li><p>Чин вдов — особая группа пожилых женщин, служивших в общине и получавших её содержание (1 Тим. 5:9–10). Refrigerium, поддержка — по-видимому, здесь материальная помощь.</p></li><li><p>Гараманты — племя в Ливии. Афиняне старинных времён закалывали волосы золотыми цикадами. Stigmata — наколотые узоры, которыми, по античным авторам, покрывали тело бритты.</p></li><li><p>Супруги, по взаимному согласию прекратившие брачные отношения (ср. 1 Кор. 7:5). «Общее бесчестие» — резкое выражение Тертуллиана-монтаниста о брачной близости.</p></li><li><p>Смысл неясен, чтение спорно. Тертуллиан, по-видимому, говорит: некоторые ещё и объясняют её поступок иначе, «покрывая» его смысл.</p></li><li><p>Викториат — мелкая римская монета.</p></li><li><p>В латинском игра слов: revelare — и «открыть», и «снять покрывало».</p></li><li><p>Смысл спорен, но по контексту это обвинение в вытравливании плода.</p></li><li><p>Страус. Рассказ о том, что он прячет голову, известен уже античным авторам, например Плинию.</p></li></ol><p>Перевёл Родион Власов, с использованием ИИ. Перевод с латинского по тексту Patrologia Latina, т. 2, стб. 888–914; неясные места сверены с английским переводом из Ante-Nicene Fathers, т. 4. Ссылки на Писание приведены к Синодальному переводу; ошибочные ссылки издания PL исправлены.</p>",
