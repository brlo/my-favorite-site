- src: крест-Моисей
  path: Mo2s_십자가_모세
  title: 십자가 — 모세
  copy_cover: true
  body: <h2>아말렉과의 싸움</h2><p>예수 그리스도의 구원하는 십자가 제사를 미리 보여 준 구약의 사건이 있습니다. 바로 이스라엘 백성과 아말렉의 싸움입니다. 선지자 모세가 산 위에서 기도하며 손을 들면 이스라엘이 이겼고(<a href="https://bibleox.com/ko/ko-nkrv/ish/17/#L11">출 17:11</a>), 피곤하여 손을 내리면 백성이 적에게 밀렸습니다. 이스라엘과 아말렉이 싸울 때 산 위에 있는 선지자 모세, 그리고 그의 손을 붙든 아론과 훌(<a href="https://bibleox.com/ko/ko-nkrv/ish/17/#L11-12">출 17:11-12</a>). 싸움은 온종일 계속되었고 모세는 그렇게 오래 손을 들고 있을 수 없었으므로, 아론과 훌이 모세를 도왔습니다. 돌을 가져다가 모세 아래에 놓아 앉게 하고, 한 사람은 이쪽에서, 한 사람은 저쪽에서 손을 붙들어 올렸습니다(말하자면 못이 그리스도의 손을 붙든 것처럼). 그렇게 모세는 해가 질 때까지(<a href="https://bibleox.com/ko/ko-nkrv/ish/17/#L12">출 17:12</a>) 산 위에서 그 자세로 있었습니다(산 위에 선 그리스도의 십자가처럼, 그리고 그리스도께서 그러셨던 것처럼). 그러므로 이렇게 됩니다.</p><ul><li><p>여호수아(그리스어 Ἰησοῦς, 곧 “예수” — 이스라엘 군대 지휘관의 이름)의 군대가 [교회의 영도자이신 예수 그리스도의 군대처럼]</p></li><li><p>십자가의 도움으로 아말렉을 이겼습니다 [그리스도께서도 십자가로 승리하신 것처럼(<a href="https://bibleox.com/ko/ko-nkrv/ef/2/#L16">엡 2:16</a>)].</p></li><li><p>그 십자가는 모세가 산 위에서 몸으로 나타낸 것이며 [골고다 위 그리스도의 십자가처럼],</p></li><li><p>모세는 그 자세로 붙들려 있었고 [그리스도께서도 십자가 위에 붙들려 계셨던 것처럼]</p></li><li><p>해가 질 때까지 그러하였습니다 [그리스도께서도 그러하셨던 것처럼].</p></li></ul>
  meta_desc: 모세가 산 위에서 십자가 모양으로 손을 든 일의 예표적 의미에 관한 성경 구절
