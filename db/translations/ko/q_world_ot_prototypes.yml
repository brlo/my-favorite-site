  title: 십자가 — 이스라엘의 진영
  copy_cover: true
  body: '<p>하느님께서 이스라엘 진영에서 지파들의 배치를 정하십니다. 이렇게 진을 치고 이렇게 행진해야 합니다. 이스라엘의 진영은 십자가 모양을 이룹니다.</p><ul><li><p>진영의 중앙에는 회막이 있습니다.</p></li></ul><blockquote><p>“이스라엘 자손은 각각 자기의 진영의 군기와 자기의 조상의 가문의 기호 곁에 진을 치되 <strong>회막을 향하여 사방으로 치라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/chis/2/#L2">민 2:2</a>)</p></blockquote><p>레위 지파도 진영의 중앙에 자리합니다.</p><blockquote><p>“그 다음에 <strong>회막이 레위인의 진영과 함께 모든 진영의 중앙에 있어</strong> 행진하되 그들의 진 친 순서대로 각 사람은 자기의 위치에서 자기들의 기를 따라 앞으로 행진할지니라” (<a href="https://bibleox.com/ko/ko-nkrv/chis/2/#L17">민 2:17</a>)</p></blockquote><ul><li><p>동쪽: 유다 지파, 그다음 잇사갈, 그다음 스불론.</p></li></ul><blockquote><p>“<strong>동방 해 돋는 쪽</strong>에 진 칠 자는 그 진영별로 <strong>유다</strong>의 진영의 군기에 속한 자라 유다 자손의 지휘관은 암미나답의 아들 나손이요 &lt;…&gt; 그 곁에 진 칠 자는 <strong>잇사갈</strong> 지파라 잇사갈 자손의 지휘관은 수알의 아들 느다넬이요 &lt;…&gt; 그리고 <strong>스불론</strong> 지파라 스불론 자손의 지휘관은 헬론의 아들 엘리압이요” (<a href="https://bibleox.com/ko/ko-nkrv/chis/2/#L3,5,7">민 2:3,5,7</a>)</p></blockquote><ul><li><p>남쪽: 르우벤 지파, 그다음 시므온, 그다음 갓.</p></li></ul><blockquote><p>“<strong>남쪽</strong>에는 <strong>르우벤</strong> 군대 진영의 군기가 있을 것이라 르우벤 자손의 지휘관은 스데울의 아들 엘리술이요 &lt;…&gt; 그 곁에 진 칠 자는 <strong>시므온</strong> 지파라 시므온 자손의 지휘관은 수리삿대의 아들 슬루미엘이요 &lt;…&gt; 또 <strong>갓</strong> 지파라 갓 자손의 지휘관은 르우엘의 아들 엘리아삽이요” (<a href="https://bibleox.com/ko/ko-nkrv/chis/2/#L10,12,14">민 2:10,12,14</a>)</p></blockquote><ul><li><p>서쪽: 에브라임 지파(요셉의 자손), 그다음 므낫세(요셉의 자손), 그다음 베냐민.</p></li></ul><blockquote><p>“<strong>서쪽</strong>에는 <strong>에브라임</strong>의 군대의 진영의 군기가 있을 것이라 에브라임 자손의 지휘관은 암미훗의 아들 엘리사마요 &lt;…&gt; 그 곁에는 <strong>므낫세</strong> 지파가 있을 것이라 므낫세 자손의 지휘관은 브다술의 아들 가말리엘이요 &lt;…&gt; 또 <strong>베냐민</strong> 지파라 베냐민 자손의 지휘관은 기드오니의 아들 아비단이요” (<a href="https://bibleox.com/ko/ko-nkrv/chis/2/#L18,20,22">민 2:18,20,22</a>)</p></blockquote><ul><li><p>북쪽: 단 지파, 그다음 아셀, 그다음 납달리.</p></li></ul><blockquote><p>“<strong>북쪽</strong>에는 <strong>단</strong> 군대 진영의 군기가 있을 것이라 단 자손의 지휘관은 암미삿대의 아들 아히에셀이요 &lt;…&gt; 그 곁에 진 칠 자는 <strong>아셀</strong> 지파라 아셀 자손의 지휘관은 오그란의 아들 바기엘이요 &lt;…&gt; 또 <strong>납달리</strong> 지파라 납달리 자손의 지휘관은 에난의 아들 아히라요” (<a href="https://bibleox.com/ko/ko-nkrv/chis/2/#L25,27,29">민 2:25,27,29</a>)</p></blockquote><p>※ 이렇게 배치하려면 진영이 13개(1+3+3+3+3) 필요한데, 야곱의 아들은 열둘뿐이었습니다. 여기에는 모든 지파가 나오지만, 요셉 지파 하나 대신 그의 두 아들 므낫세와 에브라임의 두 지파가 진영에 들어 있습니다.</p><h2>십자가의 각 쪽은 중앙에 가장 가까운 지파의 이름으로 계수되었다</h2><p>먼저 유다 진영의 수가 나옵니다.</p><blockquote><p>“동방 해 돋는 쪽에 진 칠 자는 그 진영별로 유다의 진영의 군기에 속한 자라 유다 자손의 지휘관은 암미나답의 아들 나손이요 그의 군대로 계수된 자가 <strong>칠만 사천육백 명</strong>이며” (<a href="https://bibleox.com/ko/ko-nkrv/chis/2/#L3-4">민 2:3-4</a>)</p></blockquote><p>이어서 유다 다음에 오는 지파들의 사람 수가 나옵니다.</p><blockquote><p>“그의 군대로 계수된 자가 <strong>오만 사천사백 명</strong>이라” (<a href="https://bibleox.com/ko/ko-nkrv/chis/2/#L6">민 2:6</a>)</p></blockquote><blockquote><p>“그의 군대로 계수된 자가 <strong>오만 칠천사백 명</strong>이니” (<a href="https://bibleox.com/ko/ko-nkrv/chis/2/#L8">민 2:8</a>)</p></blockquote><p>그다음 모두 합하여 유다 진영(중앙에 가장 가까운 지파)이라고 부르는데, 그 수에는 이미 세 진영이 모두 들어 있습니다.</p><blockquote><p>“<strong>유다 진영에 속한 군대</strong>로 계수된 군인의 총계는 <strong>십팔만 육천사백 명</strong>이라 그들은 제일대로 행진할지니라” (<a href="https://bibleox.com/ko/ko-nkrv/chis/2/#L9">민 2:9</a>)</p></blockquote><p>십자가의 다른 모든 쪽에서도 똑같이 되풀이됩니다.</p><h2>진영은 십자가 모양으로 진을 쳤고, 그 모양으로 행진하였다</h2><blockquote><p>“그 다음에 회막이 레위인의 진영과 함께 모든 진영의 중앙에 있어 행진하되 <strong>그들의 진 친 순서대로 각 사람은 자기의 위치에서</strong> 자기들의 기를 따라 앞으로 행진할지니라 &lt;…&gt; 이스라엘 자손이 여호와께서 모세에게 명령하신 대로 다 준행하여 각기 종족과 조상의 가문에 따르며 자기들의 기를 따라 <strong>진 치기도 하며</strong> <strong>행진하기도 하였더라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/chis/2/#L17,34">민 2:17,34</a>)</p></blockquote>'
  meta_desc: 이스라엘 진영의 십자가 모양 배치에 관한 성경 구절
