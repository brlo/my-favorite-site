  path: An1m_흥미로운_동물들
  title: 흥미로운 동물들
  copy_cover: true
  body: <p>알을 낳는 날아다니는 뱀:</p><blockquote><p>“네겝 짐승들에 관한 경고라 사신들이 그들의 재물을 어린 나귀 등에 싣고 그들의 보물을 낙타 안장에 얹고 암사자와 수사자와 독사와 및 <strong>날아다니는 불뱀</strong>이 나오는 위험하고 곤고한 땅을 지나 자기에게 무익한 민족에게로 갔으나” (<a href="https://bibleox.com/ko/ko-nkrv/is/30/#L6">사 30:6</a>)</p></blockquote><blockquote><p>“부엉이가 거기에 깃들이고 <strong>알을 낳아 까서 그 그늘에 모으며</strong> 솔개들도 각각 제 짝과 함께 거기에 모이리라” (<a href="https://bibleox.com/ko/ko-nkrv/is/34/#L15">사 34:15</a>) <em>(개역개정의 “부엉이”는 뜻이 확실하지 않은 히브리어 단어(키포즈)를 옮긴 것입니다. 러시아어 시노달 역본은 이를 “날아다니는 뱀”으로 옮겼습니다.)</em></p></blockquote><blockquote><p>“블레셋 온 땅이여 너를 치던 막대기가 부러졌다고 기뻐하지 말라 뱀의 뿌리에서는 독사가 나겠고 그의 열매는 <strong>날아다니는 불뱀</strong>이 되리라” (<a href="https://bibleox.com/ko/ko-nkrv/is/14/#L29">사 14:29</a>)</p></blockquote><p>날개 달린 기는 것:</p><blockquote><p>“또 <strong>날기도 하고 기어다니기도 하는 것</strong>은 너희에게 부정하니 너희는 먹지 말 것이나” (<a href="https://bibleox.com/ko/ko-nkrv/vtor/14/#L19">신 14:19</a>)</p></blockquote><p>공룡을 묘사한 듯한 베헤못:</p><blockquote><p>“이제 소 같이 풀을 먹는 <strong>베헤못</strong>을 볼지어다 내가 너를 지은 것 같이 그것도 지었느니라 그것의 힘은 허리에 있고 그 뚝심은 배의 힘줄에 있고 <strong>그것이 꼬리 치는 것은 백향목이 흔들리는 것 같고</strong> 그 넓적다리 힘줄은 서로 얽혀 있으며 <strong>그 뼈는 놋관 같고 그 뼈대는 쇠 막대기 같으니</strong> 그것은 <strong>하나님이 만드신 것 중에 으뜸이라</strong> 그것을 지으신 이가 자기의 칼을 가져 오기를 바라노라 &lt;…&gt; 연 잎 그늘이 덮으며 시내 버들이 그를 감싸는도다 강물이 소용돌이칠지라도 그것이 놀라지 않고 요단 강 물이 쏟아져 그 입으로 들어가도 태연하니 그것이 눈을 뜨고 있을 때 누가 능히 잡을 수 있겠으며 갈고리로 그것의 코를 꿸 수 있겠느냐” (<a href="https://bibleox.com/ko/ko-nkrv/iov/40/#L15-19,22-24">욥 40:15-19,22-24</a>)</p></blockquote><p>공룡을 묘사한 듯한 리워야단:</p><blockquote><p>“네가 낚시로 <strong>리워야단</strong>을 끌어낼 수 있겠느냐 노끈으로 그 혀를 맬 수 있겠느냐 너는 밧줄로 그 코를 꿸 수 있겠느냐 갈고리로 그 아가미를 꿸 수 있겠느냐 그것이 어찌 네게 계속하여 간청하겠느냐 부드럽게 네게 말하겠느냐 어찌 그것이 너와 계약을 맺고 너는 그를 영원히 종으로 삼겠느냐 네가 어찌 그것을 새를 가지고 놀 듯 하겠으며 네 여종들을 위하여 그것을 매어두겠느냐 어찌 장사꾼들이 그것을 놓고 거래하겠으며 상인들이 그것을 나누어 가지겠느냐 네가 능히 많은 창으로 그 가죽을 찌르거나 작살을 그 머리에 꽂을 수 있겠느냐” (<a href="https://bibleox.com/ko/ko-nkrv/iov/41/#L1-7">욥 41:1-7</a>)</p></blockquote><blockquote><p>“참으로 잡으려는 그의 희망은 헛된 것이니라 그것의 모습을 보기만 해도 그는 기가 꺾이리라 &lt;…&gt; 내가 그것의 지체와 그것의 큰 용맹과 늠름한 체구에 대하여 잠잠하지 아니하리라 누가 그것의 겉가죽을 벗기겠으며 그것에게 겹재갈을 물릴 수 있겠느냐 누가 그것의 턱을 벌릴 수 있겠느냐 그의 둥근 이틀은 심히 두렵구나 <strong>그의 즐비한 비늘은 그의 자랑이로다</strong> 튼튼하게 봉인하듯이 닫혀 있구나 그것들이 서로 달라붙어 있어 바람이 그 사이로 지나가지 못하는구나 서로 이어져 붙었으니 능히 나눌 수도 없구나 그것이 재채기를 한즉 빛을 발하고 그것의 눈은 새벽의 눈꺼풀 빛 같으며 <strong>그것의 입에서는 횃불이 나오고 불꽃이 튀어 나오며</strong> <strong>그것의 콧구멍에서는 연기가 나오니</strong> 마치 갈대를 태울 때에 솥이 끓는 것과 같구나 그의 입김은 숯불을 지피며 그의 입은 불길을 뿜는구나 그것의 힘은 그의 목덜미에 있으니 그 앞에서는 절망만 감돌 뿐이구나 그것의 살껍질은 서로 밀착되어 탄탄하며 움직이지 않는구나 그것의 가슴은 돌처럼 튼튼하며 맷돌 아래짝 같이 튼튼하구나 그것이 일어나면 용사라도 두려워하며 달아나리라 칼이 그에게 꽂혀도 소용이 없고 창이나 투창이나 화살촉도 꽂히지 못하는구나 그것이 쇠를 지푸라기 같이, 놋을 썩은 나무 같이 여기니 화살이라도 그것을 물리치지 못하겠고 물맷돌도 그것에게는 겨 같이 되는구나 그것은 몽둥이도 지푸라기 같이 여기고 창이 날아오는 소리를 우습게 여기며 그것의 아래쪽에는 날카로운 토기 조각 같은 것이 달려 있고 그것이 지나갈 때는 진흙 바닥에 도리깨로 친 자국을 남기는구나 깊은 물을 솥의 물이 끓음 같게 하며 바다를 기름병 같이 다루는도다 그것의 뒤에서 빛나는 물줄기가 나오니 그는 깊은 바다를 백발로 만드는구나 세상에는 그것과 비할 것이 없으니 그것은 두려움이 없는 것으로 지음 받았구나 그것은 모든 높은 자를 내려다보며 모든 교만한 자들에게 군림하는 왕이니라” (<a href="https://bibleox.com/ko/ko-nkrv/iov/41/#L9,12-34">욥 41:9,12-34</a>)</p></blockquote>
