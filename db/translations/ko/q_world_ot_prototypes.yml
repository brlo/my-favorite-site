- src: крест-Иаков
  path: Jb5l_십자가_야곱의_축복
  title: 십자가 — 야곱의 축복
  copy_cover: true
  body: <p>야곱이 손자들을 십자 모양으로 축복합니다. 요셉은 아들들을 데려와 각각 아버지의 손에 맞게 세웠지만, 야곱은 손을 엇바꾸어 반대로 얹었습니다.</p><blockquote><p>“오른손으로는 에브라임을 이스라엘의 왼손을 향하게 하고 왼손으로는 므낫세를 이스라엘의 오른손을 향하게 하여 이끌어 그에게 가까이 나아가매 이스라엘이 <strong>오른손을 펴서 차남 에브라임의 머리에 얹고 왼손을 펴서 므낫세의 머리에 얹으니</strong> 므낫세는 장자라도 <strong><mark>팔을 엇바꾸어 얹었더라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gen/48/#L13-14">창 48:13-14</a>)</p></blockquote>
  meta_desc: 야곱이 손을 엇바꾸어 축복한 일의 예표적 의미에 관한 성경 구절
