- src: крест-и-крещение-переход-через-море
  path: Cb4s_십자가와_세례_홍해를_건넘
  title: 십자가와 세례 — 홍해를 건넘
  copy_cover: true
  body: <p>이스라엘 백성이 홍해 바닥을 지나 애굽의 종살이에서 벗어난 일은 세례(<a href="https://bibleox.com/ko/ko-nkrv/1kor/10/#L2">고전 10:2</a>), 곧 죄의 종살이에서 벗어나는 일의 예표입니다. 하느님께서는 선지자 모세에게 지팡이를 들어 바다를 가르라고 하셨고(<a href="https://bibleox.com/ko/ko-nkrv/ish/14/#L16,21">출 14:16,21</a>), 백성이 건너편에 이르자 손을 내밀어 물을 제자리로 돌아오게 하라고 하셨습니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/14/#L26-27">출 14:26-27</a>). 이것은 앞의 가르는 동작과 달리 자연스럽게 가로로 하는 동작입니다. 그 결과 십자가가 됩니다.</p><ul><li><p>“먼저” 하는 가르는 세로 동작,</p></li><li><p>“나중에” 하는 합치는 가로 동작.</p></li></ul><p>그 결과가 십자가입니다(“|”와 “—”를 합치면 “＋”). 십자가로 이스라엘 백성은 종살이에서 구원받았습니다. 우리도 세례의 물에 잠기며 그리스도의 십자가로 죄의 종살이에서 구원받습니다.</p>
  meta_desc: 홍해를 건넌 사건의 예표적 의미에 관한 성경 구절
