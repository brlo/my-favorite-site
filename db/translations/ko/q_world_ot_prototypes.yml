- src: прообраз-крестной-жертвы-Авраам-и-Исаак
  path: Ai1s_아브라함과_이삭
  title: 그리스도의 십자가 제사 — 아브라함과 이삭
  copy_cover: true
  body: <p>그리스도의 십자가 제사를 미리 보여 준 구약의 예표는 이삭을 바친 사건입니다. 아브라함(아버지)이 이삭(자기의 독자)을 제물로 바칩니다.</p><blockquote><p>“여호와께서 이르시되 <strong>네 아들 네 사랑하는 독자 이삭</strong>을 데리고 모리아 땅으로 가서 내가 네게 일러 준 한 산 거기서 그를 <strong>번제로 드리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gen/22/#L2">창 22:2</a>)</p></blockquote><blockquote><p>“<strong>하나님이 세상을 이처럼 사랑하사 독생자를 주셨으니</strong> 이는 그를 믿는 자마다 멸망하지 않고 영생을 얻게 하려 하심이라” (<a href="https://bibleox.com/ko/ko-nkrv/in/3/#L16">요 3:16</a>)</p></blockquote><p>이삭은 자기가 제물로 바쳐질 때 쓰일 것을 지고 산에 오릅니다.</p><blockquote><p>“아브라함이 이에 <strong>번제 나무를 가져다가 그의 아들 이삭에게 지우고</strong> 자기는 불과 칼을 손에 들고 두 사람이 동행하더니” (<a href="https://bibleox.com/ko/ko-nkrv/gen/22/#L6">창 22:6</a>)</p></blockquote><blockquote><p>“이에 예수를 십자가에 못 박도록 그들에게 넘겨 주니라 그들이 예수를 맡으매 예수께서 <strong>자기의 십자가를 지시고</strong> 해골(히브리 말로 골고다)이라 하는 곳에 나가시니 그들이 <strong>거기서 예수를 십자가에 못 박을새</strong> 다른 두 사람도 그와 함께 좌우편에 못 박으니 예수는 가운데 있더라” (<a href="https://bibleox.com/ko/ko-nkrv/in/19/#L16-18">요 19:16-18</a>)</p></blockquote><p>아브라함은 이삭을 제단에 바쳤습니다.</p><blockquote><p>“우리 조상 아브라함이 <strong>그 아들 이삭을 제단에 바칠 때에</strong> 행함으로 의롭다 하심을 받은 것이 아니냐” (<a href="https://bibleox.com/ko/ko-nkrv/iak/2/#L21">약 2:21</a>)</p></blockquote><blockquote><p>“그가 <strong>하나님께서 정하신 뜻과 미리 아신 대로 내준 바 되었거늘</strong> 너희가 법 없는 자들의 손을 빌려 못 박아 죽였으나” (<a href="https://bibleox.com/ko/ko-nkrv/act/2/#L23">행 2:23</a>)</p></blockquote><p>제단과 같은 십자가 위에서 인류의 구원이 이루어집니다.</p><blockquote><p>“또 <strong>십자가로 이 둘을 한 몸으로 하나님과 화목하게 하려 하심이라</strong> 원수 된 것을 십자가로 소멸하시고” (<a href="https://bibleox.com/ko/ko-nkrv/ef/2/#L16">엡 2:16</a>)</p></blockquote>
