- src: EMRx_Крест__буква_тау
  path: Tw6l_십자가_타우_글자
  title: "십자가 — 타우 글자 «\U00010915»"
  copy_cover: true
  body: "<p><strong>에스겔 선지자의 환상에서 서기관은 어떤 사람들의 이마에 «\U00010915»(페니키아 문자 타우) 표를 그려야 했습니다.</strong></p><p>에스겔 선지자는 하느님께서 가증히 여기시는 유다 사람들의 행위를 환상으로 봅니다. 하느님께서는 그 행위 때문에 그들에게 집행자들을 보내시는데, 그들 앞에는 서기관이 있습니다. 서기관은 그 모든 가증한 일을 하느님처럼 역겨워하는 사람들의 이마에 표를 그립니다. 하느님의 명령에 따라 이 표를 받은 사람들은 벌을 받지 않습니다.</p><blockquote><p>“여호와께서 이르시되 너는 예루살렘 성읍 중에 순행하여 그 가운데에서 행하는 모든 가증한 일로 말미암아 <strong>탄식하며 우는 자의 이마에 표를 그리라</strong> 그들에 대하여 내 귀에 이르시되 너희는 그를 따라 성읍 중에 다니며 불쌍히 여기지 말며 긍휼을 베풀지 말고 쳐서 늙은 자와 젊은 자와 처녀와 어린이와 여자를 다 죽이되 <strong>이마에 표 있는 자에게는 가까이 하지 말라</strong> 내 성소에서 시작할지니라 하시매 그들이 성전 앞에 있는 늙은 자들로부터 시작하더라” (<a href=\"https://bibleox.com/ko/ko-nkrv/iez/9/#L4-6\">겔 9:4-6</a>)</p></blockquote><p>히브리어로 “표를 그리라”는 «הִתְוִיתָ <strong>תָּו</strong>»(히트위타 타우)라고 씁니다.</p><p>글자 그대로 옮기면 “<strong>תָּ</strong>(타우 글자)를 그리라”가 됩니다. 그런데 에스겔 선지자가 태어났을 때 유대인들은 아직 페니키아 문자, 또는 페니키아 문자에서 나온 고대 히브리 문자를 썼고, 거기서 타우는 «\U00010915»처럼 씁니다. 그러므로 글자 그대로 하면 “<strong>\U00010915를 그리라</strong>”라고 적혀 있는 것입니다.</p><p>초대 그리스도인들도 이와 같이 이마에 십자가를 그었습니다: <a href=\"https://bibleox.com/ru/ru/w/крестное-знамение\">십자 성호</a> (러시아어).</p><p>유대인들은 대략 그리스도 탄생 전 10세기부터 7세기까지 페니키아 문자(페니키아 문자에서 나온 고대 히브리 문자)를 썼습니다. 곧 바빌론 포로기 이전에 쓰였습니다. 유대인들은 16년에 걸쳐 몇 차례 바빌론으로 끌려갔습니다(<a href=\"https://ko.wikipedia.org/wiki/바빌론_유수\">기원전 598–582년</a>).</p><p>에스겔 선지자는 <a href=\"https://en.wikipedia.org/wiki/Ezekiel\">기원전 622년경부터 570년경까지</a>(영어) 52년을 살았습니다.</p><p><a href=\"https://azbyka.ru/days/sv-iezekiil\">스물다섯 살</a>(러시아어)에 그는 백성과 함께 포로로 끌려갔습니다.</p><p>곧 그는 페니키아 문자가 아직 쓰이던 때에 태어나 교육을 받았습니다.</p><p><a href=\"https://en.wikipedia.org/wiki/Ezekiel\">서른 살</a>(영어)에 그의 예언 사역이 시작됩니다(<a href=\"https://bibleox.com/ko/ko-nkrv/iez/1/#L1\">겔 1:1</a>).</p><p>이때 에스겔은 예언서를 씁니다.</p><p>여기서 다루는 것은 8–9장에 나오는 사건으로, 그로부터 1년 2개월 뒤의 일입니다(<a href=\"https://bibleox.com/ko/ko-nkrv/iez/8/#L1\">겔 8:1</a>).</p><p>어쨌든 우리는 기원전 7–6세기 경계, 곧 바빌론 포로기가 막 시작되어 유대인들 사이에서 새 문자가 서서히 생겨나기 시작하던 때에 이릅니다. 문자는 한꺼번에 바뀌지 않았습니다. 그것은 포로기 동안 오랜 시간에 걸쳐 일어났습니다.</p><p>선지자는 아마 유대 백성이 알아보던 페니키아 문자를 여전히 썼을 것이고, 따라서 타우를 «\U00010915»처럼 썼을 것입니다. 이것이 맞다면 서기관은 사람들의 이마에 «\U00010915» 표를 그려 그들을 벌에서 건져야 했고, 이 또한 주님의 십자가가 지닌 구원의 의미를 가리킵니다.</p>"
  title_sub: 에스겔 선지자의 환상에 나오는, 초대 그리스도인들이 손가락으로 이마에 그은 십자 성호의 형상
  meta_desc: 에스겔 선지자의 환상에 나오는 타우 글자 표와 십자 성호
  menu:
    parent: 구약/예표
