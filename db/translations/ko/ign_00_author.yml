    title: 안티오키아의 이그나티오스 (테오포로스), 1세기
    title_sub: 순교자(35년경–107년), 안티오키아의 주교
    meta_desc: 안티오키아의 성 이그나티오스(테오포로스, '하느님을 모신 사람')의 생애와 일곱 편지, 그리고 그 편지들에 드러난 고대 교회의 신앙.
