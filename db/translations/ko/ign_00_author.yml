    body: |-
      <p>이그나티오스의 저작을 그리스어 원문으로 읽으려면 <a href="https://bibleox.com/ko/grc/w/Ιγνάτιος_Θεοφόρος_Αντιοχείας">여기</a>를 누르십시오. 저작 목록 위에서 다른 언어로 바꿀 수도 있습니다.</p><p><strong>축일</strong>: 12월 20일(신력 1월 2일), 1월 29일(신력 2월 11일)</p><h2>생애</h2><p>이그나티오스의 생애에 대해서는 알려진 것이 많지 않습니다. 그리스도께서 품에 안고 축복하신 어린이(<a href="https://bibleox.com/ko/ko-ctb/mf/18/#L2-5">마태 18:2-5</a>)가 바로 이그나티오스였다는 전승이 있지만, 대부분의 학자들은 이를 후대의 전설로 봅니다.</p><p>그의 편지들의 문체로 보아 그가 시리아 사람이었다고 보는 사람들도 있습니다. 분명한 것은 그가 유다인 출신이 아니었거나, 적어도 유다교 문화 속에서 자라지 않은 최초의 그리스도교 저술가 가운데 한 사람이었다는 점입니다. 카이사리아의 에우세비오스가 쓴 『교회사』에 따르면, 그는 트라야누스 황제 때 안티오키아에서 체포되어 사형을 받으러 로마로 압송되었습니다. 그 길에 그는 자기가 지나간 도시들의 교회 공동체(에페소, 마그네시아, 트랄레스, 필라델피아, 스미르나, 로마)에 일곱 통의 편지를 썼는데, 그 가운데 <a href="https://bibleox.com/ko/ko/w/Ig2P_폴리카르포스에게보낸편지">한 통</a>은 스미르나의 주교 폴리카르포스에게 보낸 것입니다. 로마에 이른 그는 107년 12월 20일 사자들에게 던져져 순교하였습니다.</p><p>폴리카르포스는 이그나티오스에게서 온 편지에 대하여 이렇게 씁니다.</p><blockquote><p>"여러분과 이그나티오스는 <strong>나에게 편지를 보내</strong>, 누가 시리아로 가면 여러분의 편지도 그곳에 가져가 달라고 했습니다"(<a href="https://bibleox.com/ko/en/w/Plk_Ph#HH-13">폴리카르포스, 「필립비 교회에 보낸 편지」 13장(영어)</a>)</p></blockquote><p>폴리카르포스는 이그나티오스의 편지들과 그에 관하여 알려진 모든 것을 모아 베껴 쓰고 널리 전하였습니다.</p><blockquote><p>"<strong>이그나티오스가 우리에게 보낸 편지들과 우리에게 있는 다른 편지들을, 여러분이 청한 대로 여러분에게 보냅니다</strong>. 그것들은 이 편지에 덧붙여 있습니다. 여러분은 그것들에서 큰 유익을 얻을 수 있을 것입니다. 거기에는 믿음과 인내와 우리 주님 안에서의 온갖 가르침이 담겨 있기 때문입니다. <strong>이그나티오스 자신과 그와 함께 있는 사람들에 대하여 확실한 소식을 알게 되면 우리에게도 알려 주십시오</strong>"(<a href="https://bibleox.com/ko/en/w/Plk_Ph#HH-13">폴리카르포스, 「필립비 교회에 보낸 편지」 13장(영어)</a>)</p></blockquote><p>카이사리아의 에우세비오스(3–4세기)도 이그나티오스에 대하여 자세히 쓰면서, 그의 일곱 편지를 열거하고 그 가운데 일부를 "그대로" 인용합니다.</p><blockquote><p>5. 그는 폴리카르포스가 있던 스미르나에 머무를 때 <strong>에페소</strong> 교회에 편지 한 통을 써서 그곳의 목자 오네시모를 언급하였습니다. 또 한 통은 마이안드로스 강가의 <strong>마그네시아</strong> 교회에 보낸 것으로, 거기서 그는 주교 다마스를 언급합니다. 그리고 <strong>트랄레스</strong> 교회에도 한 통을 썼는데, 그곳을 이끌던 사람이 폴리비오스였다고 적고 있습니다.</p><p>6. 이 밖에도 그는 <strong>로마</strong> 교회에 편지를 써서, 자기를 위하여 탄원하여 그토록 바라는 순교의 희망을 빼앗지 말아 달라고 간청합니다. 방금 말한 것을 뒷받침하기 위하여 그 편지에서 아주 짧은 부분을 인용하는 것이 좋겠습니다. 그는 글자 그대로 이렇게 씁니다.</p><p>〈편지의 대부분을 인용함〉</p><p>10. 그는 앞에서 말한 도시에서 위의 교회들에 이 편지들을 썼습니다. 스미르나를 떠난 뒤에는 트로아스에서 <strong>필라델피아</strong> 사람들과 <strong>스미르나</strong> 교회에, 그리고 특히 그 교회를 이끌던 <strong>폴리카르포스</strong>에게 편지를 썼습니다. 그는 폴리카르포스를 사도적인 사람으로 잘 알고 있었으므로, 참되고 선한 목자로서 안티오키아의 자기 양 떼를 그에게 맡기며 열심히 돌보아 달라고 부탁합니다.</p><p>11. 그는 스미르나 사람들에게 보내는 편지에서 그리스도에 관하여—어디에서 얻은 것인지는 모르겠지만—이런 말을 합니다. "나는 그분께서 부활하신 뒤에도 육신 안에 계셨다는 것을 알고 또 믿습니다. 그분께서 베드로와 함께 있던 사람들에게 오셨을 때 그들에게 말씀하셨습니다. '나를 만져 보아라. 내가 몸이 없는 마귀가 아니라는 것을 알 것이다.' 그러자 그들은 곧 그분을 만져 보고 믿었습니다"(「스미르나 교회에 보낸 편지」 <a href="https://bibleox.com/ko/ko/w/Ig2S_스미르나교회에보낸편지#HH-3">3:1-2</a>).</p></blockquote><p>(<a href="https://bibleox.com/ko/en/w/eusebius-the-church-history-3#HH-Ignatius-and-His-Epistles">에우세비오스, 『교회사』 3권 36장(영어)</a>)</p><p>에우세비오스는 또 리옹의 이레네오(2세기)의 잃어버린 저작에서 한 구절을 인용하는데, 거기서 이레네오는 이그나티오스가 로마 교회에 보낸 편지를 인용합니다.</p><blockquote><p>12. <strong>이레네오도</strong> 그의 순교를 알고 있었고, <strong>그의 편지들을 언급하며</strong> 이렇게 말합니다. "하느님에 대한 증언 때문에 맹수에게 던져지도록 선고받은 우리 가운데 한 사람이 [<strong>로마 교회에 보낸 편지에서</strong>] 말했듯이, '나는 하느님의 밀입니다. 맹수의 이빨에 갈려서 하느님의 깨끗한 빵이 될 것입니다.'[1]"</p><p>13. 폴리카르포스도 그의 이름으로 전해지는 필립비 교회에 보낸 편지에서 같은 일을 언급합니다.</p></blockquote><p>(<a href="https://bibleox.com/ko/en/w/eusebius-the-church-history-3#HH-Ignatius-and-His-Epistles">에우세비오스, 『교회사』 3권 36장(영어)</a>)</p><p>스트리돈의 성 <a href="https://bibleox.com/ko/en/w/3v5Z_Jerome_of_Stridon_4th_c">히에로니무스</a>(347년경–419년)도 이그나티오스의 편지들을 열거합니다.</p><blockquote><p>이그나티오스는 사도 베드로로부터 세어 안티오키아 교회의 세 번째 주교였습니다. 그는 로마로 압송되던 길에 요한의 제자 폴리카르포스가 주교로 있던 스미르나에 이르러, <strong>에페소 사람들</strong>에게 한 통, <strong>마그네시아 사람들</strong>에게 한 통, <strong>트랄레스 사람들</strong>에게 한 통, <strong>로마 사람들</strong>에게 한 통의 편지를 썼습니다. 그곳을 떠난 뒤에는 <strong>필라델피아 사람들</strong>과 <strong>스미르나 사람들</strong>에게, 그리고 특히 <strong>폴리카르포스</strong>에게 편지를 써서 안티오키아 교회를 그에게 맡겼습니다.</p></blockquote><p>(히에로니무스, 『명인록』 16장, <a href="https://azbyka.ru/otechnik/Ieronim_Stridonskij/o_znamenityh/1_9#sel=63:1,63:52">러시아어 번역</a>)</p><h2>신앙</h2><h3>그리스도는 하느님이시다</h3><blockquote><p>"의사는 오직 한 분이십니다. <strong>육으로나 영으로나, 나신 분이며 나지 않으신 분, <mark>사람 안에 계신 하느님</mark>, 죽음 안에 있는 참생명, 마리아에게서 나시고 하느님에게서 나신 분, 처음에는 고난을 받으실 수 있었으나 이제는 고난을 받지 않으시는 분, 곧 <mark>우리 주 예수 그리스도</mark></strong>이십니다"(「에페소 교회에 보낸 편지」 <a href="https://bibleox.com/ko/ko/w/Ig2E_에페소교회에보낸편지#HH-7">7:2</a>)</p></blockquote><blockquote><p>"<strong><mark>우리 하느님이신 예수 그리스도</mark></strong>께서는 하느님의 경륜에 따라 마리아에게 잉태되셨습니다. 다윗의 후손에게서, 그리고 성령에게서 나신 것입니다"(「에페소 교회에 보낸 편지」 <a href="https://bibleox.com/ko/ko/w/Ig2E_에페소교회에보낸편지#HH-18">18:2</a>)</p></blockquote><blockquote><p>"그때부터 모든 마술이 풀리고 악의 모든 사슬이 사라졌습니다. 무지가 걷히고 옛 왕국이 무너졌습니다. <strong><mark>하느님께서 사람의 모습으로 나타나시어</mark></strong> 영원한 생명의 새로움을 가져오셨기 때문입니다"(「에페소 교회에 보낸 편지」 <a href="https://bibleox.com/ko/ko/w/Ig2E_에페소교회에보낸편지#HH-19">19:3</a>)</p></blockquote><blockquote><p>"눈에 보이는 것 가운데 좋은 것은 하나도 없습니다. <strong><mark>우리 하느님이신 예수 그리스도</mark></strong>께서도 아버지 안에 계신 지금 더욱 뚜렷이 드러나십니다"(「로마 교회에 보낸 편지」 <a href="https://bibleox.com/ko/ko/w/Ig2R_로마교회에보낸편지#HH-3">3:3</a>)</p></blockquote><blockquote><p>"나는 여러분을 이토록 지혜롭게 해 주신 <strong><mark>하느님이신 예수 그리스도</mark></strong>께 영광을 드립니다. 나는 알았습니다. 여러분이 흔들리지 않는 믿음 안에서 온전해졌고, 육으로나 영으로나 주 예수 그리스도의 십자가에 못 박힌 듯하며, 그리스도의 피로 사랑 안에 굳게 서 있다는 것을 말입니다. 여러분은 우리 주님에 대하여 확신에 차 있습니다. 그분은 육으로는 참으로 다윗의 가문에서 나신 분이십니다"(「스미르나 교회에 보낸 편지」 <a href="https://bibleox.com/ko/ko/w/Ig2S_스미르나교회에보낸편지#HH-1">1:1</a>)</p></blockquote><blockquote><p>"시리아로 갈 자격을 얻게 될 사람에게 문안합니다. 은총이 언제나 그와 함께, 또 그를 보내는 폴리카르포스와 함께 있기를 빕니다. <strong><mark>우리 하느님이신 예수 그리스도</mark></strong> 안에서 여러분이 언제나 평안하기를 기도합니다"(「폴리카르포스에게 보낸 편지」 <a href="https://bibleox.com/ko/ko/w/Ig2P_폴리카르포스에게보낸편지#HH-8">8:2-3</a>)</p></blockquote><h3>하느님께서 마리아에게서 나셨다</h3><blockquote><p>"의사는 오직 한 분이십니다. <strong>육으로나 영으로나, <mark>나신 분</mark>이며 나지 않으신 분, <mark>사람 안에 계신 하느님</mark>, 죽음 안에 있는 참생명, <mark>마리아에게서 나시고</mark> 하느님에게서 나신 분, 처음에는 고난을 받으실 수 있었으나 이제는 고난을 받지 않으시는 분, 곧 <mark>우리 주 예수 그리스도</mark></strong>이십니다"(「에페소 교회에 보낸 편지」 <a href="https://bibleox.com/ko/ko/w/Ig2E_에페소교회에보낸편지#HH-7">7:2</a>)</p></blockquote><h3>성찬은 상징이 아니라 예수 그리스도의 참된 살과 피이다</h3><p>이그나티오스는 이단자들이 성찬이 고난을 받으시고 아버지께서 다시 살리신 예수 그리스도의 살이라는 것을 믿지 않는다고 비난합니다. 이단자들이 성찬이 그리스도의 살의 상징에 지나지 않는다는 것을 믿지 않았을 리는 없습니다. 상징을 믿지 않는다는 것은 생각하기조차 터무니없습니다. 그들이 믿지 않은 것은 바로 성찬 안에 고난을 받으시고 다시 살아나신 그리스도의 살 자체가 있다는 것이며, 그것은 다음과 같이 이야기됩니다.</p><blockquote><p>"아무도 속지 마십시오. 하늘의 것들도, 천사들의 영광도, 보이는 권세와 보이지 않는 권세도, <strong><mark>그리스도의 피를 믿지 않으면 그들에게도 심판이 있습니다</mark></strong>. "받아들일 수 있는 사람은 받아들여라." 〈…〉 그들(이단자들)은 성찬과 기도를 멀리합니다. <strong><mark>성찬이 우리의 죄 때문에 고난을 받으시고 아버지께서 당신의 자애로 다시 살리신 우리 구세주 예수 그리스도의 살</mark></strong>이라는 것을 인정하지 않기 때문입니다. 이렇게 <strong>하느님의 선물에 반대하는 자들은</strong> 논쟁 속에서 <strong>죽어 갑니다</strong>"(「스미르나 교회에 보낸 편지」 <a href="https://bibleox.com/ko/ko/w/Ig2S_스미르나교회에보낸편지#HH-6">6:1</a>, <a href="https://bibleox.com/ko/ko/w/Ig2S_스미르나교회에보낸편지#HH-7">7:1</a>)</p></blockquote><h3>그리스도인은 자기가 이미 구원받았다고 여기지 않는다</h3><blockquote><p>"<strong><mark>시작은 잘 준비되었습니다. 내가 나의 몫을 방해받지 않고 받아들일 은총을 얻는다</mark><u><mark>면</mark></u><mark> 말입니다</mark></strong>. 그러나 나는 여러분의 사랑이 나에게 해를 끼치지 않을까 두렵습니다. 여러분에게는 원하는 일을 하는 것이 쉽지만, 여러분이 나를 아낀다면 <strong><mark>나에게는 하느님께 이르는 일이 어렵기</mark></strong> 때문입니다. 〈…〉 <strong><mark>내가 이를 수 있도록 나를 위하여 기도해 주십시오</mark></strong>. 나는 육을 따라서가 아니라 하느님의 뜻을 따라 여러분에게 썼습니다. 내가 고난을 받는다면 그것은 여러분이 나를 위해 준 것이고, 내가 버림받는다면 그것은 여러분이 나를 미워한 것입니다. 〈…〉 <strong>나는 그들 가운데 하나라고 불리는 것이 부끄럽습니다. 나는 그럴 자격이 없는, 그들 가운데 가장 보잘것없는 사람이며 달을 채우지 못하고 태어난 사람이기 때문입니다</strong>. 그러나 <strong><mark>내가 하느님께 이른다</mark><u><mark>면</mark></u><mark>, 나는 무엇인가가 되는 자비를 입은 것입니다</mark></strong>. 나의 영과, 나를 나그네로가 아니라 예수 그리스도의 이름으로 맞아 준 교회들의 사랑이 여러분에게 문안합니다"(「로마 교회에 보낸 편지」 <a href="https://bibleox.com/ko/ko/w/Ig2R_로마교회에보낸편지#HH-1">1:2</a>, <a href="https://bibleox.com/ko/ko/w/Ig2R_로마교회에보낸편지#HH-8">8:3</a>, <a href="https://bibleox.com/ko/ko/w/Ig2R_로마교회에보낸편지#HH-9">9:2-3</a>)</p></blockquote><h3>그리스도인은 행실로 알려진다</h3><blockquote><p>"믿음을 고백하는 사람은 아무도 죄를 짓지 않고, 사랑을 얻은 사람은 아무도 미워하지 않습니다. "열매를 보아 나무를 알 수 있다." 이와 같이 <strong><mark>그리스도의 사람이라고 고백하는 이들은 </mark><u><mark>그들이 하는 일로 드러날 것입니다</mark></u></strong>. 지금 중요한 것은 고백이 아니라, 끝까지 믿음의 힘 안에서 발견되는 것입니다. <strong><mark>말을 하면서 (그리스도인이) 아닌 것보다, 침묵하면서 (그리스도인)인 것이 낫습니다</mark></strong>. 가르치는 것은 좋은 일입니다. 말하는 사람이 행한다면 말입니다"(「에페소 교회에 보낸 편지」 <a href="https://bibleox.com/ko/ko/w/Ig2E_에페소교회에보낸편지#HH-14">14:2</a>, <a href="https://bibleox.com/ko/ko/w/Ig2E_에페소교회에보낸편지#HH-15">15:1</a>)</p></blockquote><blockquote><p>"세례를 여러분의 무기로, 믿음을 투구로, 사랑을 창으로, 인내를 온 무장으로 삼으십시오. <strong><mark>여러분의 행실을 예금으로 삼으십시오. 그에 합당한 지급을 받기 위해서입니다</mark></strong>"(「폴리카르포스에게 보낸 편지」 <a href="https://bibleox.com/ko/ko/w/Ig2P_폴리카르포스에게보낸편지#HH-6">6:2</a>)</p></blockquote><h3>그리스도를 위한 고난은 하느님께 가까이 있다는 표지이다</h3><blockquote><p>"왜 나는 나 자신을 죽음에, 불에, 칼에, 맹수에게 내맡겼겠습니까? 아닙니다. <strong>칼에 가까이 있는 사람은 하느님께 가까이 있고, 맹수들 가운데 있는 사람은 하느님 가운데 있습니다. 다만 예수 그리스도의 이름 안에서라면 말입니다</strong>. 그분과 함께 고난을 받기 위하여 나는 모든 것을 견디고 있습니다. 완전한 사람이 되신 그분께서 나에게 힘을 주십니다"(「스미르나 교회에 보낸 편지」 <a href="https://bibleox.com/ko/ko/w/Ig2S_스미르나교회에보낸편지#HH-4">4:2</a>)</p></blockquote><h3>주교, 사제, 보제 없이는 교회가 없다</h3><p>곧, 두세 사람이 그저 모였다고 해서 그것이 교회는 아닙니다.</p><blockquote><p>"마찬가지로 모든 사람은 <strong><mark>보제들</mark>을 예수 그리스도처럼 <mark>존중하고</mark>, <mark>주교</mark>를 아버지의 모상으로, <mark>사제들</mark>을 하느님의 회의로, 사도들의 모임으로 존중하십시오. <mark>이들을 제쳐 놓고는 교회라고 불릴 수 없습니다</mark>. </strong>여러분이 이 일에서 그러하다고 나는 확신합니다. 〈…〉 그러므로 여러분에게 권합니다. 아니, 내가 아니라 예수 그리스도의 사랑이 권합니다. 그리스도인의 음식만을 먹고, 낯선 풀, 곧 이단을 멀리하십시오. <strong>그들은 신용을 얻으려고 자기들의 가르침에 예수 그리스도를 섞어 짭니다. 그것은 치명적인 독약을 꿀 섞은 포도주에 타서 주는 것과 같습니다. 아무것도 모르는 사람은 그것을 기꺼이 받아 마시고, 악한 쾌락 속에서 죽음을 받아들입니다</strong>"(「트랄레스 교회에 보낸 편지」 <a href="https://bibleox.com/ko/ko/w/Ig2T_트랄레스교회에보낸편지#HH-3">3:1</a>, <a href="https://bibleox.com/ko/ko/w/Ig2T_트랄레스교회에보낸편지#HH-6">6:1-2</a>)</p></blockquote><blockquote><p>"예수 그리스도께서 아버지를 따르셨듯이 모두 <strong>주교</strong>를 따르십시오. 사도들을 따르듯이 <strong>사제단</strong>을 따르십시오. <strong>보제들</strong>을 하느님의 계명처럼 존중하십시오. <strong>주교를 제쳐 놓고 교회에 관한 일을 아무도 해서는 안 됩니다</strong>(<a href="https://bibleox.com/ko/en/w/councils-the-canons-of-the-holy-apostles">「거룩한 사도 법규」 제39조(영어)</a> 참조). 주교 아래에서, 또는 주교가 맡긴 사람이 거행하는 성찬만을 확실한 것으로 여기십시오. <strong><u><mark>주교가 나타나는 곳에 회중도 있어야 합니다. 예수 그리스도께서 계신 곳에 보편 교회가 있는 것과 같습니다</mark></u></strong>. 주교를 제쳐 놓고 세례를 주거나 애찬(아가페)을 거행하는 것은 허락되지 않습니다. 그러나 주교가 옳다고 인정하는 것은 하느님께서도 기뻐하시는 것입니다. 그것은 여러분이 하는 모든 일이 흔들림 없고 확실하게 하려는 것입니다. 〈…〉 하느님과 주교를 아는 것은 좋은 일입니다. 주교를 공경하는 사람은 하느님께 공경을 받고, <strong><mark>주교 몰래 무슨 일을 하는 사람은 악마를 섬기는 것입니다</mark></strong>"(「스미르나 교회에 보낸 편지」 <a href="https://bibleox.com/ko/ko/w/Ig2S_스미르나교회에보낸편지#HH-8">8:1-2</a>, <a href="https://bibleox.com/ko/ko/w/Ig2S_스미르나교회에보낸편지#HH-9">9:1</a>)</p></blockquote><blockquote><p>"<strong><mark>여러분은 주교에게 마음을 기울이십시오. 하느님께서도 여러분에게 마음을 기울이시도록 말입니다</mark></strong>. <strong>주교와 사제들과 보제들에게 순종하는 사람들을 위하여 나는 내 목숨을 내놓습니다. 그들과 함께 하느님 안에서 내 몫을 얻을 수 있기를 빕니다</strong>. 서로 함께 수고하고, 함께 싸우고, 함께 달리고, 함께 고난을 받고, 함께 잠들고, 함께 일어나십시오. 하느님의 집의 관리인이며 측근이며 종으로서 말입니다. 〈…〉 우리 하느님이신 예수 그리스도 안에서 여러분이 언제나 평안하기를 기도합니다. 그분 안에서 하느님의 일치와 주교의 돌봄 안에 머무르십시오. 〈…〉 누가 주님의 살을 공경하여 정결 가운데 머무를 수 있다면, 자랑하지 말고 머무르십시오. <strong><mark>자랑한다면 그는 멸망하고, 주교보다 더 알려지기를 바란다면 그는 타락한 것입니다</mark></strong>"(「폴리카르포스에게 보낸 편지」 <a href="https://bibleox.com/ko/ko/w/Ig2P_폴리카르포스에게보낸편지#HH-6">6:1</a>, <a href="https://bibleox.com/ko/ko/w/Ig2P_폴리카르포스에게보낸편지#HH-8">8:3</a>, <a href="https://bibleox.com/ko/ko/w/Ig2P_폴리카르포스에게보낸편지#HH-5">5:2</a>)</p></blockquote><h3>세 품계의 성직(주교, 사제, 보제)</h3><p>성 이그나티오스는 시리아의 교회가 주교 없이 남게 되었다고 씁니다. 사제는 많았지만, 시리아의 주교는 이그나티오스 한 사람뿐이었고, 그는 이제 체포되어 사형을 받으러 로마로 압송되고 있었습니다. 사제들이 자기들끼리 주교를 세울 수 없었다는 것은 분명합니다. 그럴 수 있었다면 곧 그렇게 했을 것이고, 시리아가 주교 없이 남지는 않았을 것입니다.</p><blockquote><p>"여러분의 기도 가운데 <strong><mark>시리아에 있는 교회를 기억해 주십시오. 그 교회는 이제 나 대신 하느님을 목자로 모시고 있습니다</mark>. 예수 그리스도만이, 그리고 여러분의 사랑이 그 교회의 주교가 될 것입니다</strong>"(「로마 교회에 보낸 편지」 <a href="https://bibleox.com/ko/ko/w/Ig2R_로마교회에보낸편지#HH-9">9:1</a>)</p></blockquote><p>특히 주목할 것은, 주교는 언제나 단수로, 사제와 보제는 복수로 이야기된다는 점입니다(<a href="https://bibleox.com/ru/ru/w/трёхчинная-священническая-иерархия#HH-Тертуллиан-155-220">테르툴리아노스도 마찬가지입니다(러시아어)</a>). 곧 각 지역의 교회 위에는 한 사람의 우두머리, 곧 주교가 있고, 그 아래에 많은 사제(글자 그대로는 "그의 사제들")와 보제들이 있었던 것입니다.</p><blockquote><p>"나는 예수 그리스도의 피 안에서 이 교회에 문안합니다. 그 피는 영원하고 변함없는 기쁨입니다. 특히 사람들이 <strong><mark>주교와, 그와 함께 있는 사제들과 보제들</mark></strong>—곧 예수 그리스도의 뜻을 따라 세워진 사람들—과 하나가 되어 있을 때에 그러합니다. 주님께서는 당신 뜻에 따라 성령으로 그들을 굳게 세워 주셨습니다. 〈…〉 그러므로 하나의 성찬에 참여하도록 힘쓰십시오. 우리 주 예수 그리스도의 살은 하나이고, 그분의 피와 하나 되게 하는 잔도 하나이며, 제단도 하나입니다. 마찬가지로 <strong><mark>주교도 한 사람으로서, 사제단과 나의 동료 종인 보제들과 함께</mark></strong> 있습니다. 그것은 여러분이 무엇을 하든지 하느님을 따라 하게 하려는 것입니다. 〈…〉 나는 여러분 가운데 있을 때 외쳤습니다. 큰 소리로, 하느님의 목소리로 말했습니다. "<strong><mark>주교와 사제단과 보제들</mark></strong>에게 마음을 기울이십시오." 〈…〉 여러분이 원한다면 하느님의 이름을 위하여 이 일을 하는 것은 불가능하지 않습니다. 가장 가까운 교회들은 이미 <strong><mark>주교들</mark>을 보냈고, 다른 교회들은 <mark>사제들과 보제들</mark></strong>을 보냈습니다"(<a href="https://bibleox.com/ko/ko/w/Ig2F_필라델피아교회에보낸편지#HH-0">「필라델피아 교회에 보낸 편지」 인사말</a>, 「필라델피아 교회에 보낸 편지」 <a href="https://bibleox.com/ko/ko/w/Ig2F_필라델피아교회에보낸편지#HH-4">4장</a>, <a href="https://bibleox.com/ko/ko/w/Ig2F_필라델피아교회에보낸편지#HH-7">7:1</a>, <a href="https://bibleox.com/ko/ko/w/Ig2F_필라델피아교회에보낸편지#HH-10">10:3</a>)</p></blockquote><p>다른 곳에서도 마찬가지입니다. 한 사람의 주교(그리스도나 아버지 하느님께 비유됨)와 그 아래 있는 많은 사제들(사도들에게 비유됨)과 보제들입니다.</p><blockquote><p>"마찬가지로 모든 사람은 <strong><mark>보제들</mark>을 예수 그리스도처럼 <mark>존중하고</mark>, <mark>주교</mark>를 아버지의 모상으로, <mark>사제들</mark>을 하느님의 회의로, 사도들의 모임으로 존중하십시오. </strong>여러분이 이 일에서 그러하다고 나는 확신합니다. 이들을 제쳐 놓고는 교회라고 불릴 수 없습니다."(「트랄레스 교회에 보낸 편지」 <a href="https://bibleox.com/ko/ko/w/Ig2T_트랄레스교회에보낸편지#HH-3">3:1</a>)</p></blockquote><blockquote><p>"예수 그리스도께서 아버지를 따르셨듯이 모두 <strong><mark>주교</mark></strong>(한 사람—주)를 따르십시오. 사도들을 따르듯이 <strong><mark>사제단</mark></strong>을 따르십시오. <strong><mark>보제들</mark></strong>을 하느님의 계명처럼 존중하십시오. <strong>주교를 제쳐 놓고 교회에 관한 일을 아무도 해서는 안 됩니다</strong>. 주교 아래에서, 또는 주교가 맡긴 사람이 거행하는 성찬만을 확실한 것으로 여기십시오. 주교가 나타나는 곳에 회중도 있어야 합니다. 예수 그리스도께서 계신 곳에 보편 교회가 있는 것과 같습니다. 주교를 제쳐 놓고 세례를 주거나 애찬(아가페)을 거행하는 것은 허락되지 않습니다. 그러나 주교가 옳다고 인정하는 것은 하느님께서도 기뻐하시는 것입니다. 그것은 여러분이 하는 모든 일이 흔들림 없고 확실하게 하려는 것입니다. 〈…〉 하느님과 주교를 아는 것은 좋은 일입니다. 주교를 공경하는 사람은 하느님께 공경을 받고, 주교 몰래 무슨 일을 하는 사람은 악마를 섬기는 것입니다"(「스미르나 교회에 보낸 편지」 <a href="https://bibleox.com/ko/ko/w/Ig2S_스미르나교회에보낸편지#HH-8">8:1-2</a>, <a href="https://bibleox.com/ko/ko/w/Ig2S_스미르나교회에보낸편지#HH-9">9:1</a>)</p></blockquote><blockquote><p>"여러분은 주교에게 마음을 기울이십시오. 하느님께서도 여러분에게 마음을 기울이시도록 말입니다. <strong>주교와 사제들과 보제들에게 순종하는 사람들을 위하여 나는 내 목숨을 내놓습니다. 그들과 함께 하느님 안에서 내 몫을 얻을 수 있기를 빕니다</strong>. 서로 함께 수고하고, 함께 싸우고, 함께 달리고, 함께 고난을 받고, 함께 잠들고, 함께 일어나십시오. 하느님의 집의 관리인이며 측근이며 종으로서 말입니다. 〈…〉 우리 하느님이신 예수 그리스도 안에서 여러분이 언제나 평안하기를 기도합니다. 그분 안에서 하느님의 일치와 <strong>주교</strong>의 돌봄 안에 머무르십시오. 〈…〉 누가 주님의 살을 공경하여 정결 가운데 머무를 수 있다면, 자랑하지 말고 머무르십시오. 자랑한다면 그는 멸망하고, 주교보다 더 알려지기를 바란다면 그는 타락한 것입니다"(「폴리카르포스에게 보낸 편지」 <a href="https://bibleox.com/ko/ko/w/Ig2P_폴리카르포스에게보낸편지#HH-6">6:1</a>, <a href="https://bibleox.com/ko/ko/w/Ig2P_폴리카르포스에게보낸편지#HH-8">8:3</a>, <a href="https://bibleox.com/ko/ko/w/Ig2P_폴리카르포스에게보낸편지#HH-5">5:2</a>)</p></blockquote><h3>십자가는 그리스도와 그리스도인의 도구이다</h3><blockquote><p>"여러분은 아버지 성전의 돌로서 아버지 하느님의 건물을 위하여 준비되었고, <strong><mark>십자가이신 예수 그리스도의 기중기</mark>로</strong> 성령을 밧줄로 삼아 <strong><mark>높은 곳으로 들어 올려지고 있기</mark></strong> 때문입니다. 여러분의 믿음은 여러분을 끌어올리는 것이고, 사랑은 하느님께로 이끌어 올리는 길입니다"(「에페소 교회에 보낸 편지」 <a href="https://bibleox.com/ko/ko/w/Ig2E_에페소교회에보낸편지#HH-9">9:1</a>)</p></blockquote><h3>교회 일치의 소중함</h3><blockquote><p>"<strong><mark>일치에 마음을 쓰십시오. 그보다 좋은 것은 없습니다</mark></strong>"(「폴리카르포스에게 보낸 편지」 <a href="https://bibleox.com/ko/ko/w/Ig2P_폴리카르포스에게보낸편지#HH-1">1:2</a>)</p></blockquote><blockquote><p>""… <strong><mark>일치를 사랑하여라</mark>. 분열을 피하여라</strong>. 예수 그리스도께서 당신 아버지를 본받으셨듯이 너희도 예수 그리스도를 본받는 사람이 되어라." 그러므로 나는 일치를 위하여 준비된 사람으로서 내 할 일을 다했습니다. <strong>분열과 분노가 있는 곳에는 하느님께서 머물지 않으십니다</strong>. 그러나 회개하는 모든 사람을 <strong>주님께서는 <mark>용서하십니다. 그들이 회개하여 하느님의 일치</mark>와 주교의 회의<mark>로 돌아온다면</mark> 말입니다</strong>"(「필라델피아 교회에 보낸 편지」 <a href="https://bibleox.com/ko/ko/w/Ig2F_필라델피아교회에보낸편지#HH-7">7:2</a>, <a href="https://bibleox.com/ko/ko/w/Ig2F_필라델피아교회에보낸편지#HH-8">8:1</a>)</p></blockquote><blockquote><p>"나는 하느님께 가장 합당한 이름을 받았으므로, 지니고 다니는 이 사슬 속에서 <strong>교회들을 찬미하고 있습니다. 그리고 교회들 안에</strong>, 우리의 영원한 생명이신 <strong>예수 그리스도의 <mark>육과 영의 일치</mark></strong>, 무엇보다 앞서는 <strong><mark>믿음과 사랑의 일치</mark></strong>가 있기를 기도합니다"(「마그네시아 교회에 보낸 편지」 <a href="https://bibleox.com/ko/ko/w/Ig2M_마그네시아교회에보낸편지#HH-1">1:2</a>)</p></blockquote><blockquote><p>"<strong><mark>여러분을 갈라놓을 수 있는 것이 여러분 가운데 하나도 없어야 합니다</mark>. <mark>주교</mark>와, 앞장서 이끄는 사람들과 <mark>하나가 되십시오</mark></strong>. 그것이 불멸의 표징이 되고 가르침이 될 것입니다"(「마그네시아 교회에 보낸 편지」 <a href="https://bibleox.com/ko/ko/w/Ig2M_마그네시아교회에보낸편지#HH-6">6:2</a>)</p></blockquote><blockquote><p>"주교에게 순종하고 서로 순종하십시오. 예수 그리스도께서 아버지께 순종하시고, 사도들이 그리스도와 아버지께 순종하였듯이 말입니다. <strong>그것은 <mark>육과 영의 일치</mark>가 있게 하려는 것입니다</strong>"(「마그네시아 교회에 보낸 편지」 <a href="https://bibleox.com/ko/ko/w/Ig2M_마그네시아교회에보낸편지#HH-13">13:2</a>)</p></blockquote><blockquote><p>"내가 여러분 가운데서 분열을 보았다는 것이 아니라, 오히려 걸러 내어 깨끗해진 것을 보았습니다. <strong>하느님의 사람, 예수 그리스도의 사람은 모두 주교와 함께 있습니다. <mark>회개하고 교회의 일치로 돌아오는 사람들도 하느님의 사람이 되어</mark></strong> 예수 그리스도를 따라 살게 될 것입니다. 나의 형제 여러분, 속지 마십시오. <strong>분열을 일으키는 자를 따르는 사람은 하느님 나라를 차지하지 못합니다</strong>"(「필라델피아 교회에 보낸 편지」 <a href="https://bibleox.com/ko/ko/w/Ig2F_필라델피아교회에보낸편지#HH-3">3:1-3</a>)</p></blockquote><blockquote><p>"<strong>여러분끼리 따로 하는 일을 이치에 맞는 일처럼 보이게 하려고 하지 마십시오</strong>. 오히려 함께 모여, 하나의 기도, 하나의 간구, 하나의 생각, 사랑과 흠 없는 기쁨 안에서 하나의 희망을 가지십시오"(「마그네시아 교회에 보낸 편지」 <a href="https://bibleox.com/ko/ko/w/Ig2M_마그네시아교회에보낸편지#HH-7">7:1</a>)</p></blockquote><h3>수도 생활</h3><blockquote><p>"누가 주님의 살을 공경하여 정결 가운데 머무를 수 있다면, 자랑하지 말고 머무르십시오"(「폴리카르포스에게 보낸 편지」 <a href="https://bibleox.com/ko/ko/w/Ig2P_폴리카르포스에게보낸편지#HH-5">5:2</a>)</p></blockquote><h3>이단과 분열 속에서는 구원받을 수 없다</h3><blockquote><p>"그러므로 <strong>진리의 빛의 자녀 여러분, <mark>분열과 악한 가르침을 피하십시오</mark>. 목자가 있는 곳으로 양처럼 따라가십시오</strong>. 믿음직해 보이는 많은 이리들이 악한 쾌락으로 하느님께로 달려가는 사람들을 사로잡으려 합니다. 그러나 여러분이 일치해 있으면 그들이 끼어들 자리가 없습니다. <strong>나쁜 풀을 멀리하십시오. 그것은 예수 그리스도께서 가꾸지 않으시는 것입니다. <mark>그것들은 아버지께서 심으신 것이 아니기 때문입니다</mark></strong>. 내가 여러분 가운데서 분열을 보았다는 것이 아니라, 오히려 걸러 내어 깨끗해진 것을 보았습니다. <strong><mark>하느님의 사람, 예수 그리스도의 사람은 모두 주교와 함께 있습니다</mark></strong>. 회개하고 교회의 일치로 돌아오는 사람들도 하느님의 사람이 되어 예수 그리스도를 따라 살게 될 것입니다. 나의 형제 여러분, 속지 마십시오. <strong><mark>분열을 일으키는 자를 따르는 사람은 하느님 나라를 차지하지 못합니다. 다른 생각을 따라 걷는 사람은 (그리스도의) 수난에 동참하지 않는 것입니다</mark></strong>. 〈…〉 <strong>분열과 분노가 있는 곳에는 하느님께서 머물지 않으십니다</strong>. 그러나 회개하는 모든 사람을 <strong>주님께서는 용서하십니다. 그들이 회개하여 하느님의 일치와 주교의 회의로 돌아온다면 말입니다</strong>"(「필라델피아 교회에 보낸 편지」 <a href="https://bibleox.com/ko/ko/w/Ig2F_필라델피아교회에보낸편지#HH-2">2장</a>, <a href="https://bibleox.com/ko/ko/w/Ig2F_필라델피아교회에보낸편지#HH-3">3장</a>, <a href="https://bibleox.com/ko/ko/w/Ig2F_필라델피아교회에보낸편지#HH-8">8:1</a>)</p></blockquote><blockquote><p>"나의 형제 여러분, 속지 마십시오. 가정을 파괴하는 자들은 하느님 나라를 차지하지 못할 것입니다. 육으로 이런 짓을 하는 자들도 죽었는데, 하물며 <strong><mark>예수 그리스도께서 그것을 위하여 십자가에 못 박히신 하느님에 대한 믿음을 악한 가르침으로 썩게 하는 자는 어떻겠습니까? 그런 자는 더러워져서 꺼지지 않는 불로 들어갈 것이고, 그의 말을 듣는 사람도 마찬가지입니다</mark></strong>. 그 때문에 주님께서는 머리에 향유를 받으셨습니다. 교회에 불멸의 향기를 불어넣으시려는 것이었습니다. <strong>이 세상 권력자의 가르침의 악취를 몸에 바르지 마십시오. 그가 여러분을 사로잡아 여러분 앞에 놓인 생명에서 떼어 놓지 못하게 하십시오</strong>"(「에페소 교회에 보낸 편지」 <a href="https://bibleox.com/ko/ko/w/Ig2E_에페소교회에보낸편지#HH-16">16장</a>, <a href="https://bibleox.com/ko/ko/w/Ig2E_에페소교회에보낸편지#HH-17">17:1</a>)</p></blockquote><h3>이단자들에게서 떨어져 있어야 한다</h3><blockquote><p>"그러므로 <strong><mark>죽음을 가져오는 열매를 맺는 나쁜 곁가지를 피하십시오</mark></strong>. 누구든지 그것을 맛보면 곧 죽습니다. <strong><mark>그들은 아버지께서 심으신 것이 아니기 때문입니다</mark></strong>. 만일 그들이 아버지께서 심으신 것이라면, 그들은 십자가의 가지로 드러나고 그 열매는 썩지 않는 것이었을 것입니다"(「트랄레스 교회에 보낸 편지」 <a href="https://bibleox.com/ko/ko/w/Ig2T_트랄레스교회에보낸편지#HH-11">11:1-2</a>)</p></blockquote><h3>몸을 떠난 뒤의 영혼의 삶</h3><blockquote><p>"<strong>세상에서 하느님께로 지는 것은 좋은 일입니다. 그분 안에서 떠오르기 위해서입니다</strong>. 〈…〉 내가 (그리스도인으로) 드러난다면 그리스도인이라고 불릴 수도 있을 것이며, <strong><mark>내가 세상에 보이지 않게 될 때에야</mark> 충실한 사람<mark>이 될 것입니다</mark></strong>. <strong><mark>눈에 보이는 것 가운데 좋은 것은 하나도 없습니다</mark></strong>. 〈…〉 이제 나는 제자가 되기 시작했습니다. <strong><mark>보이는 것도 보이지 않는 것도 아무것도 나를 시기하여 내가 예수 그리스도께 이르는 것을 막지 말기를 빕니다</mark></strong>. 〈…〉 하느님의 사람이 되려는 사람을 <strong>세상에 넘겨주거나</strong> 물질로 꾀지 마십시오. <strong>내가 깨끗한 빛을 받게 해 주십시오. <mark>그곳에 이르면 나는 (참)사람이 될 것입니다</mark></strong>. 〈…〉 나는 살아서 여러분에게 이 편지를 쓰지만 죽기를 그리워합니다. 나의 사랑은 십자가에 못 박혔습니다. 내 안에는 물질을 사랑하는 불이 없습니다. 다만 살아 있는 물이 <strong><mark>내 안에서 말하며, 안에서 나에게 "아버지께로 오너라" 하고 말합니다</mark></strong>"(「로마 교회에 보낸 편지」 <a href="https://bibleox.com/ko/ko/w/Ig2R_로마교회에보낸편지#HH-2">2:2</a>, <a href="https://bibleox.com/ko/ko/w/Ig2R_로마교회에보낸편지#HH-3">3:2-3</a>, <a href="https://bibleox.com/ko/ko/w/Ig2R_로마교회에보낸편지#HH-5">5:3</a>, <a href="https://bibleox.com/ko/ko/w/Ig2R_로마교회에보낸편지#HH-6">6:2</a>, <a href="https://bibleox.com/ko/ko/w/Ig2R_로마교회에보낸편지#HH-7">7:2</a>)</p></blockquote><h3>유다 율법의 폐지</h3><blockquote><p>"<strong><mark>우리가 지금까지도 유다교를 따라 산다면, 은총을 받지 못했다고 스스로 인정하는 것이기 때문입니다</mark></strong>. 가장 거룩한 예언자들은 그리스도 예수를 따라 살았습니다. 그 때문에 박해를 받은 것입니다. 그들은 그분의 은총에 감도되어, 순종하지 않는 사람들에게 하느님은 한 분이시며 당신 아드님 예수 그리스도를 통하여 당신 자신을 드러내셨다는 것을 확신시켰습니다. 이 아드님은 침묵에서 나오신 하느님의 말씀이십니다. 〈…〉 옛 관습 속에서 살던 사람들이 새로운 희망에 이르러 <strong><mark>더 이상 안식일을 지키지 않고 주님의 날을 따라 살고 있다면</mark></strong>—그날에 그분과 그분의 죽음을 통하여 우리의 생명도 떠올랐습니다. <strong>어떤 사람들은 이 죽음을 부인하지만</strong>, 우리는 이 신비를 통하여 믿음을 받았고, 우리의 유일한 스승이신 예수 그리스도의 제자로 드러나기 위하여 인내하고 있습니다. 〈…〉 그러므로 <strong>그분의 제자가 된 우리는 그리스도교를 따라 사는 법을 배웁시다</strong>. 이 이름이 아닌 다른 이름으로 불리는 사람은 하느님의 사람이 아닙니다. 그러므로 <strong><mark>오래되어 시어진 나쁜 누룩을 버리고, 새 누룩, 곧 예수 그리스도로 바뀌십시오</mark></strong>. 그분 안에서 소금으로 간이 배게 하십시오. 여러분 가운데 아무도 썩지 않게 하려는 것입니다. 여러분은 그 냄새로 가려질 것입니다. <strong><mark>예수 그리스도를 입에 올리면서 유다교를 따라 사는 것은 터무니없는 일입니다</mark>. 그리스도교가 유다교를 믿은 것이 아니라 유다교가 그리스도교를 믿은 것이며</strong>, 하느님을 믿은 모든 말을 하는 민족들이 그 그리스도교로 모여들었기 때문입니다"(「마그네시아 교회에 보낸 편지」 <a href="https://bibleox.com/ko/ko/w/Ig2M_마그네시아교회에보낸편지#HH-8">8:1-2</a>, <a href="https://bibleox.com/ko/ko/w/Ig2M_마그네시아교회에보낸편지#HH-9">9:1</a>, <a href="https://bibleox.com/ko/ko/w/Ig2M_마그네시아교회에보낸편지#HH-10">10:1-3</a>)</p></blockquote><blockquote><p>"<strong><mark>누가 여러분에게 유다교를 풀이해 주거든 그의 말을 듣지 마십시오</mark>. 할례받지 않은 사람에게서 유다교를 듣는 것보다, 할례받은 사람에게서 그리스도교를 듣는 것이 낫습니다</strong>. 그러나 둘 다 예수 그리스도에 대하여 말하지 않는다면, 그들은 나에게 묘비요 죽은 이들의 무덤이며, 그 위에는 사람의 이름만 적혀 있을 뿐입니다"(「필라델피아 교회에 보낸 편지」 <a href="https://bibleox.com/ko/ko/w/Ig2F_필라델피아교회에보낸편지#HH-6">6:1</a>)</p></blockquote><h3>지옥에서의 끝없는 고통</h3><blockquote><p>"육으로 이런 짓을 하는 자들도 죽었는데, 하물며 예수 그리스도께서 그것을 위하여 십자가에 못 박히신 하느님에 대한 믿음을 악한 가르침으로 썩게 하는 자는 어떻겠습니까? 그런 자는 더러워져서 <strong><mark>꺼지지 않는 불</mark>로 들어갈 것이고</strong>, 그의 말을 듣는 사람도 마찬가지입니다"(「에페소 교회에 보낸 편지」 <a href="https://bibleox.com/ko/ko/w/Ig2E_에페소교회에보낸편지#HH-16">16:2</a>)</p></blockquote><h3>'오직 성경'으로 신앙을 세우려는 사람들에 대한 꾸짖음</h3><p>이그나티오스는 구약 성서로 증명되지 않는 것은 믿지 않겠다고 논쟁하고, 성서를 보여 주어도 본문의 뜻을 두고 계속 다투는 사람들에 대하여 말합니다. 이그나티오스는, 기록되어 있기는 하지만 그에게 "옛 기록"(가장 중요한 것)은 예수 그리스도와 그분의 믿음이라고 대답합니다. 그 믿음을 성 이그나티오스는 사도들과 그 제자들에게서 직접 받았습니다.</p><blockquote><p>"나는 예수 그리스도의 은총을 믿습니다. 그분께서 여러분에게서 모든 사슬을 풀어 주실 것입니다. 여러분에게 권합니다. <strong><mark>아무 일도 당파심으로 하지 말고, 그리스도에게서 배운 대로 하십시오</mark></strong>. <strong><mark>나는 어떤 사람들이 이렇게 말하는 것을 들었습니다</mark>. "<mark>옛 기록 안에서 찾지 못하면 복음에서도 믿지 않겠다</mark>."</strong> <strong>그래서 내가 "그것은 기록되어 있다" 하고 말하자, 그들은 "그것이야말로 증명해야 할 문제다" 하고 대답했습니다. <mark>그러나 나에게 옛 기록은 예수 그리스도이십니다</mark></strong>. 손댈 수 없는 기록은 그분의 십자가와 죽음과 부활, <strong><mark>그리고 그분을 통한 믿음입니다</mark></strong>. 나는 여러분의 기도로 이것들 안에서 의롭게 되기를 바랍니다"(「필라델피아 교회에 보낸 편지」 <a href="https://bibleox.com/ko/ko/w/Ig2F_필라델피아교회에보낸편지#HH-8">8:1-2</a>)</p></blockquote><h2>본문의 연대에 관하여</h2><p>이그나티오스의 편지들은 짧은 판, 중간 판, 긴 판의 몇 가지 형태로 전해집니다. 중간 판이 가장 오래되었고 가장 널리 알려져 있습니다. 3–4세기에 카이사리아의 에우세비오스가 언급하는 것도 이 편지 모음입니다.</p><p>개별 편지들은 그보다 먼저 언급되기도 합니다. 예를 들어 2세기에 이그나티오스와 같은 시대 사람인 스미르나의 폴리카르포스는 이그나티오스에게서 온 편지에 대하여 씁니다.</p><blockquote><p>"여러분과 이그나티오스는 <strong>나에게 편지를 보내</strong>, 누가 시리아로 가면 여러분의 편지도 그곳에 가져가 달라고 했습니다"(<a href="https://bibleox.com/ko/en/w/Plk_Ph#HH-13">폴리카르포스, 「필립비 교회에 보낸 편지」 13장(영어)</a>)</p></blockquote><p>폴리카르포스는 이그나티오스의 편지들과 그에 관하여 알려진 모든 것을 모아 베껴 쓰고 널리 전하였습니다.</p><blockquote><p>"<strong>이그나티오스가 우리에게 보낸 편지들과 우리에게 있는 다른 편지들을, 여러분이 청한 대로 여러분에게 보냅니다</strong>. 그것들은 이 편지에 덧붙여 있습니다. 여러분은 그것들에서 큰 유익을 얻을 수 있을 것입니다. 거기에는 믿음과 인내와 우리 주님 안에서의 온갖 가르침이 담겨 있기 때문입니다. <strong>이그나티오스 자신과 그와 함께 있는 사람들에 대하여 확실한 소식을 알게 되면 우리에게도 알려 주십시오</strong>"(<a href="https://bibleox.com/ko/en/w/Plk_Ph#HH-13">폴리카르포스, 「필립비 교회에 보낸 편지」 13장(영어)</a>)</p></blockquote><p>남아 있는 가장 오래된 그리스어 사본(5세기)은 앞에서 폴리카르포스가 언급한 스미르나 교회에 보낸 편지의 것입니다. 로마 교회에 보낸 편지의 그리스어 사본은 꽤 후대의 것만 남아 있지만, 5세기의 시리아어 번역과 고대 아르메니아어 번역이 있습니다. 또 로마 교회, 스미르나 교회, 폴리카르포스, 트랄레스 교회, 필라델피아 교회에 보낸 편지는 4세기의 콥트어 번역도 있습니다.</p><p>카이사리아의 에우세비오스(3–4세기)는 리옹의 이레네오(2세기)의 잃어버린 저작을 인용하는데, 거기서 이레네오는 이그나티오스가 로마 교회에 보낸 편지를 인용합니다.</p><blockquote><p>12. 이레네오도 그의 순교를 알고 있었고, 그의 편지들을 언급하며 이렇게 말합니다. "하느님에 대한 증언 때문에 맹수에게 던져지도록 선고받은 우리 가운데 한 사람이 말했듯이, '<strong>나는 하느님의 밀입니다. 맹수의 이빨에 갈려서 하느님의 깨끗한 빵이 될 것입니다</strong>.'"(「로마 교회에 보낸 편지」 <a href="https://bibleox.com/ko/ko/w/Ig2R_로마교회에보낸편지#HH-4">4:1</a>)</p></blockquote><p>(<a href="https://bibleox.com/ko/en/w/eusebius-the-church-history-3#HH-Ignatius-and-His-Epistles">에우세비오스, 『교회사』 3권 36장(영어)</a>)</p><p>에우세비오스는 중간 판의 본문을 인용합니다. 에우세비오스의 인용과 오늘날 전해지는 본문을 비교해 볼 수 있습니다. 다른 부분에는 밑줄을 그었습니다(두 단어가 더 있을 뿐이며 내용은 달라지지 않습니다. 고문의 종류를 늘어놓는 부분입니다).</p><table class="custom-table"><colgroup></colgroup><tbody><tr><td><p><strong>에우세비오스의 『교회사』에서</strong></p><p>ἀπὸ Συρίας μέχρι Ῥώμης θηριομαχῶ διὰ γῆς καὶ θαλάσσης, νυκτὸς καὶ ἡμέρας, ἐνδεδεμένος δέκα λεοπάρδοις, ὅ ἐστιν στρατιωτικὸν τάγμα, οἳ καὶ εὐεργετούμενοι χείρονες γίνονται, ἐν δὲ τοῖς ἀδικήμασιν αὐτῶν μᾶλλον μαθητεύομαι· ἀλλ' οὐ παρὰ τοῦτο δεδικαίωμαι. ὀναίμην τῶν θηρίων τῶν ἐμοὶ ἑτοίμων, ἃ καὶ εὔχομαι σύντομά μοι εὑρεθῆναι· ἃ καὶ κολακεύσω συντόμως με καταφαγεῖν, οὐχ ὥσπερ τινῶν δειλαινόμενα οὐχ ἥψαντο, κἂν αὐτὰ δὲ ἄκοντα μὴ θέλῃ, ἐγὼ προσβιάσομαι. συγγνώμην μοι ἔχετε· τί μοι συμφέρει, ἐγὼ γινώσκω, νῦν ἄρχομαι μαθητὴς εἶναι. μηδέν με ζηλώσαι τῶν ὁρατῶν καὶ ἀοράτων, ἵνα Ἰησοῦ Χριστοῦ ἐπιτύχω· πῦρ καὶ σταυρὸς θηρίων τε συστάσεις, <strong><u>___</u></strong> σκορπισμοὶ ὀστέων, συγκοπαὶ μελῶν, ἀλεσμοὶ ὅλου τοῦ σώματος, κολάσεις τοῦ διαβόλου εἰς ἐμὲ ἐρχέσθωσαν, μόνον ἵνα Ἰησοῦ Χριστοῦ ἐπιτύχω</p><p><a href="https://bibleox.com/ko/grc/w/ΕΚΚΛΗΣΙΑΣΤΙΚΗΣ_ΙΣΤΟΡΙΑΣ-3#HH-36">그리스어 원문</a></p></td><td><p><strong>이그나티오스의 편지에서</strong></p><p>Ἀπὸ Συρίας μέχρι Ῥώμης θηριομαχῶ, διὰ γῆς καὶ θαλάσσης, νυκτὸς καὶ ἡμέρας, δεδεμένος δέκα λεοπάρδοις, ὅ ἐστιν στρατιωτικὸν τάγμα· οἳ καὶ εὐεργετούμενοι χείρους γίνονται. ἐν δὲ τοῖς ἀδικήμασιν αὐτῶν μᾶλλον μαθητεύομαι, ἀλλ' οὐ παρὰ τοῦτο δεδικαίωμαι. ὀναίμην τῶν θηρίων τῶν ἐμοὶ ἡτοιμασμένων καὶ εὔχομαι σύντομά μοι εὑρεθῆναι· ἃ καὶ κολακεύσω, συντόμως με καταφαγεῖν, οὐχ ὥσπερ τινῶν δειλαινόμενα οὐχ ἥψαντο. κἂν αὐτὰ δὲ ἄκοντα μὴ θελήσῃ, ἐγὼ προσβιάσομαι. συγγνώμην μοι ἔχετε· τί μοι συμφέρει, ἐγὼ γινώσκω, νῦν ἄρχομαι μαθητὴς εἶναι. μηθέν με ζηλώσαι τῶν ὁρατῶν καὶ ἀοράτων, ἵνα Ἰησοῦ Χριστοῦ ἐπιτύχω. πῦρ καὶ σταυρὸς θηρίων τε συστάσεις, <strong><u>ἀνατομαί, διαιρέσεις</u></strong>, σκορπισμοὶ ὀστέων, συγκοπὴ μελῶν, ἀλεσμοὶ ὅλου τοῦ σώματος, κακαὶ κολάσεις τοῦ διαβόλου ἐπ' ἐμὲ ἐρχέσθωσαν, μόνον ἵνα Ἰησοῦ Χριστοῦ ἐπιτύχω</p><p><a href="https://bibleox.com/ko/grc/w/ΙγνΘ_Ρωμ#HH-5">그리스어 원문</a>(한국어 번역: 「로마 교회에 보낸 편지」 <a href="https://bibleox.com/ko/ko/w/Ig2R_로마교회에보낸편지#HH-5">5:3</a>)</p></td></tr></tbody></table><p>짧은 판의 편지 모음도 반드시 위작으로 생겨난 것은 아닙니다. 옛날에는 널리 알려진 작품을 줄여서 고쳐 쓰는 관습이 있었습니다. 예를 들어 2세기에 순교자 유스티노스의 제자 타티아노스는 네 복음서를 하나로 엮은 『디아테사론』을 만들었습니다. 이 작품은 널리 알려져 오랫동안 교회에서 읽혔고, 때로는 복음서 대신 읽히기까지 해서, 나중에는 복음서 자체를 읽는 것으로 되돌리기 위해 이를 물리쳐야 했습니다. 『디아테사론』은 위작으로 의도된 것이 아니라 보조적인 작품으로 만들어졌고, 바로 그런 방식으로 퍼졌습니다.</p><p>『디아테사론』이 있다고 해서 복음서가 가짜라는 뜻은 아니며, 복음서가 쓰인 시기가 2세기로 늦추어지는 것도 아닙니다. 『디아테사론』 자신도 1세기의 작품이라고 주장하지 않습니다. 그것은 2세기의 작품입니다.</p><p>순교자 이그나티오스의 저작은 학자들 사이에서 꽤 높은 신뢰를 받고 있습니다. 자세한 내용은 <a href="https://azbyka.ru/otechnik/Ignatij_Antiohijskij/ignatij-antiokhijskij-episkop-muchenik-i-proiskhozhdenie-episkopata/5">여기(러시아어)</a>를 보십시오.</p>
    references: |-
      <ol><li><p>「로마 교회에 보낸 편지」 <a href="https://bibleox.com/ko/ko/w/Ig2R_로마교회에보낸편지#HH-4">4:1</a>. 이레네오와 에우세비오스의 인용에는 '하느님의 깨끗한 빵', 편지 본문에는 '그리스도의 깨끗한 빵'으로 되어 있습니다.</p></li></ol>
      <p>이 사이트의 러시아어 페이지에서 번역: 로디온 블라소프(AI 도구 활용). 이그나티오스 편지의 인용은 이 사이트의 그리스어 원문 한국어 번역에 따름. 폴리카르포스, 에우세비오스, 히에로니무스의 인용은 그리스어와 라틴어 원문에서 번역하고 러시아어 번역과 대조함.</p>
