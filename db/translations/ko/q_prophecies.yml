  body: "<h2>요한계시록 교회들에 대한 평가</h2><p>교회의 반대자들은 요한계시록 2–3장(<a href=\"https://bibleox.com/ko/ko-nkrv/otkr/2/#L1\">계 2:1</a>)을 들어 교회가 참된 믿음을 버렸다는 논증을 세우려 하기도 합니다. 이 장들에서 주 예수 그리스도께서는 일곱 교회에 말씀하시며 그들의 장점과 단점을 지적하십니다. 그러나 본문을 살펴보면 실제로는 그 반대입니다. 교회들은 그리스도의 믿음을 지키고 있으며, 어떤 교회가 책망을 받는다면 그것은 그들의 <strong>행위</strong> 때문입니다.</p><h3>1. 에베소</h3><p>✅ 행위로 칭찬받습니다(악한 자들을 용납하지 않음, 거짓 사도들을 드러냄, 니골라 당의 행위를 미워함, 인내, 주님의 이름을 위한 수고).</p><p>❌ 처음 사랑을 버린 것 때문에 책망받고, 그 사랑으로 돌아와 “처음 <strong>행위</strong>”를 하라는 권면을 받습니다.</p><h3>2. 서머나</h3><p>✅ 행위로 칭찬받습니다(환난과 궁핍과 비방을 견딤). 앞으로 받을 박해를 두려워하지 말라는 부르심을 받습니다. 생명의 관이 약속됩니다. 아무것도 책망받지 않습니다.</p><h3>3. 버가모</h3><p>✅ 행위로 칭찬받습니다(박해의 위협 속에서도 그리스도의 믿음을 저버리지 않음).</p><p>❌ 우상의 제물을 먹고 행음한 니골라 당을 <strong>내보내지 않은</strong> 것 때문에 책망받습니다. 그러면서도 버가모 교회는 그리스도의 믿음을 저버리지 않았습니다: “<strong>나를 믿는 믿음</strong>을 저버리지 아니하였도다”.</p><h3>4. 두아디라</h3><p>✅ <strong>믿음</strong>과 행위(사랑, 섬김, 인내)로 칭찬받습니다.</p><p>❌ 마찬가지로 “이세벨”을 내보내지 않고, 그 여자가 믿는 이들을 꾀어 행음하게 하고 우상의 제물을 먹게 하도록 내버려 둔 것 때문에 책망받습니다(버가모의 니골라 당과 같음). 이세벨과 함께 간음한 자들만 벌을 받습니다. 나머지는 칭찬받습니다: “너희에게 있는 것을 내가 올 때까지 굳게 잡으라”.</p><h3>5. 사데</h3><p>✅ 옷을 더럽히지 않은 몇 사람만 칭찬받습니다.</p><p>❌ 다른 사람들 때문에 행위가 온전하지 못하여 죽은 자에 비유됩니다: “네 <strong>행위</strong>의 온전한 것을 찾지 못하였노니”. 깨어 있지 않은 것 때문에 책망받습니다.</p><h3>6. 빌라델비아</h3><p>✅ 행위(작은 능력을 가지고도 그리스도를 배반하지 않음)와, 그리스도의 인내의 말씀을 지킨 것으로 칭찬받습니다. “네가 가진 것을 굳게 잡아”라는 권면을 받습니다. 아무것도 책망받지 않습니다.</p><h3>7. 라오디게아</h3><p>칭찬받지 않습니다.</p><p>❌ 행위 때문에 책망받습니다: “내가 네 <strong>행위</strong>를 아노니 네가 차지도 아니하고 뜨겁지도 아니하도다”. 그리스도께 금과 흰 옷과 안약을 사라는 권면과, 열심을 내고 회개하라는 부르심을 받습니다: “열심을 내라 회개하라”.</p><h2>정리</h2><p>그러므로,</p><ul><li><p>\U0001F7E2 서머나(2)와 빌라델비아(6)는 전혀 책망받지 않습니다.</p></li><li><p>\U0001F7E1 버가모(3)와 두아디라(4)는 믿음을 지켰지만, 미혹하는 자들(니골라 당과 이세벨)을 내보내지 않은 것 때문에 책망받습니다. 벌을 받는 것은 바로 거짓 가르침에 속한 자들입니다. 교회 자체는 칭찬받습니다: “<strong>나를 믿는 믿음</strong>을 저버리지 아니하였도다”(버가모), “너희에게 있는 것을 내가 올 때까지 굳게 잡으라”(두아디라).</p></li><li><p>\U0001F7E0 에베소(1)는 경건과 믿음을 지킨 것으로 칭찬받고, 처음 사랑을 버린 것 때문에 책망받으며, 처음 <strong>행위</strong>를 하라는 권면을 받습니다.</p></li><li><p>\U0001F7E0 사데(5)는 옷을 지킨 몇 사람 때문에 칭찬받고, <strong>행위</strong>가 온전하지 못한 것 때문에 책망받습니다.</p></li><li><p>\U0001F534 라오디게아(7)는 아무것도 칭찬받지 못하고, <strong>행위</strong>의 미지근함 때문에 책망받으며, 회개하라는 부르심을 받습니다.</p></li></ul><h2>결론</h2><ul><li><p>믿음 때문에 책망받는 교회는 없고, 거의 모든 교회가 칭찬받습니다(1, 2, 3, 4, 6).</p></li><li><p>어떤 교회는 한 가지 행위의 부족으로 책망받지만, 믿음을 지킨 것으로 칭찬받습니다(3, 4).</p></li><li><p>다른 교회들은 행위에 더 심각한 부족이 있지만, 그들에게도 믿음은 지켜졌습니다(1, 5).</p></li><li><p>마지막 교회는 행위에 대한 무관심(미지근함) 때문에 책망받습니다(7).</p></li></ul><p>“행위”가 믿음을 뜻할 수도 있다고 생각할 수 있습니다. 그러나 분명히 믿음을 지킨 교회들이 행위의 부족 때문에 책망받으므로(3, 4), 그런 해석의 여지는 거의 없습니다. 그러므로 요한계시록의 교회들은 믿음(교리) 때문이 아니라 행위의 불완전함 때문에 책망받습니다. 그리고 어떤 교회들은 전혀 책망받지 않습니다.</p>"
