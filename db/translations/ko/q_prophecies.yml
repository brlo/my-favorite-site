    priority: 2
  references: '<ol><li><p>가이사랴의 성 안드레아(†637): “<em>두 죽음</em>이 있으니, 부활도 그만큼 받아들여야 한다. 첫째는 사람의 불순종에 대한 벌로 내려진 몸의 죽음이고, 둘째는 영원한 고통이다. 첫째 부활은 죽은 행실에서 다시 태어나는 것이고, 둘째는 몸이 썩음에서 썩지 않음으로 옮겨 가는 것이다”(<a href="https://azbyka.ru/otechnik/Andrej_Kesarijskij/tolkovanie_na_apokalipsis/20">요한계시록 주석 555</a>, 러시아어에서 옮김).</p></li><li><p>땅 위의 적그리스도의 나라에 관하여 자세히</p><blockquote><p>“무저갱에 던져 넣어 잠그고 그 위에 인봉하여 천 년이 차도록 다시는 만국을 미혹하지 못하게 하였는데 그 후에는 반드시 잠깐 놓이리라 &lt;…&gt; 천 년이 차매 사탄이 그 옥에서 놓여 나와서 땅의 사방 백성 곧 곡과 마곡을 미혹하고 모아 싸움을 붙이리니 그 수가 바다의 모래 같으리라” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/20/#L3,7-8">계 20:3,7-8</a>)</p></blockquote><p><strong>아마 삼 년 반(반드시 문자 그대로일 필요는 없음)</strong></p><p>여자(교회)는 삼 년 반 동안 적그리스도를 피하여 숨습니다.</p><blockquote><p>“그 여자가 큰 독수리의 두 날개를 받아 광야 자기 곳으로 날아가 거기서 그 뱀의 낯을 피하여 <strong>한 때와 두 때와 반 때</strong>를 양육 받으매” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/12/#L14">계 12:14</a>)</p></blockquote><p></p><blockquote><p>“그가 장차 지극히 높으신 이를 말로 대적하며 또 지극히 높으신 이의 성도를 괴롭게 할 것이며 그가 또 때와 법을 고치고자 할 것이며 성도들은 그의 손에 붙인 바 되어 <strong>한 때와 두 때와 반 때</strong>를 지내리라” (<a href="https://bibleox.com/ko/ko-nkrv/dan/7/#L25">단 7:25</a>)</p></blockquote><p>적그리스도에게 마흔두 달(12+12+12+6) 동안 권세가 주어집니다.</p><blockquote><p>“또 짐승이 과장되고 신성 모독을 말하는 입을 받고 또 <strong>마흔두 달</strong> 동안 일할 권세를 받으니라” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/13/#L5">계 13:5</a>)</p></blockquote><p>이방인들이 마흔두 달(12+12+12+6) 동안 교회와 싸울 것입니다.</p><blockquote><p>“성전 바깥 마당은 측량하지 말고 그냥 두라 이것은 이방인에게 주었은즉 그들이 거룩한 성을 <strong>마흔두 달</strong> 동안 짓밟으리라” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/11/#L2">계 11:2</a>)</p></blockquote><p>1290일(365+365+365+182, 13일이 모자람).</p><blockquote><p>“매일 드리는 제사를 폐하며 멸망하게 할 가증한 것을 세울 때부터 <strong>천이백구십 일</strong>을 지낼 것이요” (<a href="https://bibleox.com/ko/ko-nkrv/dan/12/#L11">단 12:11</a>)</p></blockquote><p><strong>택하신 자들을 위하여 적그리스도가 다스리는 때가 감해질 것이다</strong></p><blockquote><p>“그러므로 너희가 선지자 다니엘이 말한 바 멸망의 가증한 것이 거룩한 곳에 선 것을 보거든 (읽는 자는 깨달을진저) &lt;…&gt; 이는 그 때에 큰 환난이 있겠음이라 창세로부터 지금까지 이런 환난이 없었고 후에도 없으리라 <strong>그 날들을 감하지 아니하면 모든 육체가 구원을 얻지 못할 것이나 그러나 택하신 자들을 위하여 그 날들을 감하시리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/24/#L15,21-22">마 24:15,21-22</a>)</p></blockquote><p><strong>적그리스도는 자기를 하느님이라 내세울 것이다</strong></p><blockquote><p>“누가 어떻게 하여도 너희가 미혹되지 말라 먼저 배교하는 일이 있고 저 불법의 사람 곧 멸망의 아들이 나타나기 전에는 그 날이 이르지 아니하리니 그는 대적하는 자라 <strong>신이라고 불리는 모든 것과 숭배함을 받는 것에 대항하여 그 위에 자기를 높이고 하나님의 성전에 앉아 자기를 하나님이라고 내세우느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2sol/2/#L3-4">살후 2:3-4</a>)</p></blockquote><p><strong>적그리스도의 나라의 끝</strong></p><p>재림 바로 전에 하느님께서 적그리스도의 나라를 끝내시고, 적그리스도와 사탄에게 영원한 형벌을 내리십니다.</p><blockquote><p>“하늘에서 불이 내려와 그들을 태워버리고 또 그들을 미혹하는 <strong>마귀</strong>가 불과 유황 못에 던져지니 거기는 그 <strong>짐승과 거짓 선지자</strong>도 있어 세세토록 밤낮 괴로움을 받으리라” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/20/#L9-10">계 20:9-10</a>)</p></blockquote><p>참고 자료(러시아어): <a href="https://azbyka.ru/hiliazm">https://azbyka.ru/hiliazm</a>; <a href="https://azbyka.ru/otechnik/Oleg_Davydenkov/dogmaticheskoe-bogoslovie/13_4_1">https://azbyka.ru/otechnik/Oleg_Davydenkov/dogmaticheskoe-bogoslovie/13_4_1</a>; <a href="https://azbyka.ru/otechnik/Evgenij-Veselov/eshatologija-sekt-protestantskogo-proishozhdenija/#0_42">https://azbyka.ru/otechnik/Evgenij-Veselov/eshatologija-sekt-protestantskogo-proishozhdenija/#0_42</a>; <a href="https://azbyka.ru/otechnik/Aleksandr_Belyaev/skolko-vremeni-prodolzhitsja-tsarstvovanie-antihrista/">https://azbyka.ru/otechnik/Aleksandr_Belyaev/skolko-vremeni-prodolzhitsja-tsarstvovanie-antihrista/</a></p></li></ol><p>번역: 로디온 블라소프 (AI 도구 활용). 저본: 러시아어 원문. 참고: 영어·일본어 번역. 성경 인용과 링크는 개역개정에 따름.</p>'
