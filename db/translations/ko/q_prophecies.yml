- src: пророчества-о-ложных-учениях
  path: Ph5r_이단에_관한_예언
  title: 이단에 관한 예언
  copy_cover: true
  body: <h2>그리스도교 안에 많은 이단이 일어날 것이다</h2><blockquote><p>“<strong><mark>많은 사람이 내 이름으로 와서</mark></strong> 이르되 내가 그라 하여 <strong><mark>많은 사람을 미혹하리라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mk/13/#L6">막 13:6</a>)</p></blockquote><blockquote><p>“<strong><mark>거짓 선지자가 많이 일어나 많은 사람을 미혹하겠으며</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/24/#L11">마 24:11</a>)</p></blockquote><blockquote><p>“사랑하는 자들아 영을 다 믿지 말고 오직 영들이 하나님께 속하였나 분별하라 <strong><mark>많은 거짓 선지자</mark></strong>가 세상에 나왔음이라” (<a href="https://bibleox.com/ko/ko-nkrv/1in/4/#L1">요일 4:1</a>)</p></blockquote><h2>이단은 매우 널리 퍼질 것이다</h2><blockquote><p>“<strong><mark>그들의 말은 악성 종양이 퍼져나감과 같은데</mark></strong> 그 중에 후메내오와 빌레도가 있느니라 <strong>진리에 관하여는 그들이 그릇되었도다</strong> 부활이 이미 지나갔다 함으로 어떤 사람들의 믿음을 무너뜨리느니라” (<a href="https://bibleox.com/ko/ko-nkrv/2tim/2/#L17-18">딤후 2:17-18</a>)</p></blockquote><blockquote><p>“그러나 백성 가운데 또한 거짓 선지자들이 일어났었나니 이와 같이 너희 중에도 거짓 선생들이 있으리라 그들은 <strong>멸망하게 할 이단을 가만히 끌어들여</strong> 자기들을 사신 주를 부인하고 임박한 멸망을 스스로 취하는 자들이라 <strong><mark>여럿이 그들의 호색하는 것을 따르리니 이로 말미암아 진리의 도가 비방을 받을 것이요</mark></strong> 그들이 <strong>탐심으로써</strong> 지어낸 말을 가지고 너희로 <strong>이득을 삼으니</strong> 그들의 심판은 옛적부터 지체하지 아니하며 그들의 멸망은 잠들지 아니하느니라” (<a href="https://bibleox.com/ko/ko-nkrv/2pet/2/#L1-3">벧후 2:1-3</a>)</p></blockquote><h2>이단의 무리는 교회와 그 믿음의 일치에서 떨어져 나갈 것이다</h2><blockquote><p>“아이들아 지금은 마지막 때라 적그리스도가 오리라는 말을 너희가 들은 것과 같이 지금도 많은 적그리스도가 일어났으니 그러므로 우리가 마지막 때인 줄 아노라 <strong><mark>그들이 우리에게서 나갔으나 우리에게 속하지 아니하였나니 만일 우리에게 속하였더라면 우리와 함께 거하였으려니와</mark></strong> 그들이 나간 것은 다 우리에게 속하지 아니함을 나타내려 함이니라” (<a href="https://bibleox.com/ko/ko-nkrv/1in/2/#L18-19">요일 2:18-19</a>)</p></blockquote><blockquote><p>“그들이 너희에게 말하기를 <strong>마지막 때에</strong> 자기의 경건하지 않은 정욕대로 행하며 조롱하는 자들이 있으리라 하였나니 이 사람들은 <strong><mark>분열을 일으키는 자며</mark></strong> 육에 속한 자며 성령이 없는 자니라” (<a href="https://bibleox.com/ko/ko-nkrv/iud/1/#L18-19">유 1:18-19</a>)</p></blockquote><h2>거짓 교사들의 목적은 믿는 이를 교회에서 빼내어 자기를 따르게 하는 것이다</h2><blockquote><p>“내가 떠난 후에 <strong><mark>사나운 이리가 여러분에게 들어와서 그 양 떼를 아끼지 아니하며 또한 여러분 중에서도 제자들을 끌어 자기를 따르게 하려고 어그러진 말을 하는 사람들이 일어날 줄을</mark></strong> 내가 아노라” (<a href="https://bibleox.com/ko/ko-nkrv/act/20/#L29-30">행 20:29-30</a>)</p></blockquote><h2>거짓 교사들의 방법</h2><h3>1. 듣기 좋은 가르침</h3><p>거짓 교사들이 듣기 좋은 가르침을 지어내는 것은, 바로 듣는 사람들이 바른 교훈을 견디지 못하고 귀를 즐겁게 하는 가르침을 찾기 때문입니다.</p><blockquote><p>“때가 이르리니 사람이 <strong>바른 교훈을 받지 아니하며</strong> <strong><mark>귀가 가려워서 자기의 사욕을 따를 스승을 많이 두고</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2tim/4/#L3">딤후 4:3</a>)</p></blockquote><blockquote><p>“그러나 성령이 밝히 말씀하시기를 <strong><mark>후일에 어떤 사람들이 믿음에서 떠나 미혹하는 영과 귀신의 가르침을 따르리라</mark></strong> 하셨으니 자기 양심이 화인을 맞아서 외식함으로 거짓말하는 자들이라” (<a href="https://bibleox.com/ko/ko-nkrv/1tim/4/#L1-2">딤전 4:1-2</a>)</p></blockquote><h3>2. 겉모양뿐인 경건</h3><blockquote><p>“너는 이것을 알라 <strong>말세에</strong> 고통하는 때가 이르러 사람들이 자기를 사랑하며 돈을 사랑하며 자랑하며 교만하며 비방하며 부모를 거역하며 감사하지 아니하며 거룩하지 아니하며 &lt;…&gt; <strong><mark>경건의 모양은 있으나</mark></strong> 경건의 능력은 부인하니 이같은 자들에게서 네가 돌아서라 &lt;…&gt; 항상 배우나 끝내 진리의 지식에 이를 수 없느니라 얀네와 얌브레가 모세를 대적한 것 같이 그들도 <strong>진리를 대적하니 이 사람들은 그 마음이 부패한 자요 믿음에 관하여는 버림 받은 자들이라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2tim/3/#L1-2,5,7-8">딤후 3:1-2,5,7-8</a>)</p></blockquote><blockquote><p>“<strong>거짓 선지자들</strong>을 삼가라 <strong><mark>양의 옷을 입고 너희에게 나아오나</mark></strong> 속에는 노략질하는 이리라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/7/#L15">마 7:15</a>)</p></blockquote><h3>3. 보여 주기 위한 기적</h3><p>기적을 행하는 풍성한 능력은 사도들과 초대 그리스도인들에게 보여 주기 위해서가 아니라 유익을 위하여 주어졌습니다.</p><blockquote><p>“각 사람에게 성령을 나타내심은 <strong>유익하게 하려 하심이라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/12/#L7">고전 12:7</a>)</p></blockquote><p>작은 무리의 어부들은 짧은 생애 동안 목격자로서 온 세상에 복음을 전하기 위하여 큰 도움이 필요하였습니다. 사도들은 이 은사들이 그칠 것이라고 경고하였습니다.</p><blockquote><p>“사랑은 언제까지나 떨어지지 아니하되 <strong>예언도 폐하고 방언도 그치고</strong> 지식도 폐하리라” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/13/#L8">고전 13:8</a>)</p></blockquote><p>그리스도께서는 친히 표적을 구하는 것을 꾸짖으셨습니다.</p><blockquote><p>“예수께서 대답하여 이르시되 <strong>악하고 음란한 세대가 표적을 구하나</strong> 선지자 요나의 표적 밖에는 보일 표적이 없느니라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/12/#L39">마 12:39</a>)</p></blockquote><p>마지막 때에 거짓 선지자들은 바로 기적으로 사람들을 끌어갈 것입니다.</p><blockquote><p>“거짓 그리스도들과 거짓 선지자들이 일어나 <strong>큰 표적과 기사를 보여 할 수만 있으면 택하신 자들도 미혹하리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/24/#L24">마 24:24</a>; <a href="https://bibleox.com/ko/ko-nkrv/mk/13/#L22">막 13:22</a>)</p></blockquote><p>그 결과 심판 때에 많은 신자가 그리스도의 이름으로 기적을 행하고 예언하고 귀신을 쫓아냈으므로 자기가 구원받았다고 확신할 것입니다. 그러나 그들은 미혹되어 불법을 배운 자들로 드러나고, 그리스도께서는 그들을 알지 못한다 하시며 자기에게서 쫓아내십니다.</p><blockquote><p>“그 날에 많은 사람이 나더러 이르되 주여 주여 우리가 주의 이름으로 선지자 노릇 하며 주의 이름으로 귀신을 쫓아 내며 <strong>주의 이름으로 많은 권능을 행하지 아니하였나이까</strong> 하리니 그 때에 내가 그들에게 밝히 말하되 <strong>내가 너희를 도무지 알지 못하니</strong> 불법을 행하는 자들아 <strong>내게서 떠나가라</strong> 하리라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/7/#L22-23">마 7:22-23</a>)</p></blockquote><h2>거짓 선지자를 알아보는 법</h2><p>그의 예언은 이루어지지 않습니다.</p><blockquote><p>“만일 선지자가 있어 여호와의 이름으로 말한 일에 <strong>증험도 없고 성취함도 없으면</strong> 이는 여호와께서 말씀하신 것이 아니요 그 선지자가 제 마음대로 한 말이니 너는 그를 두려워하지 말지니라” (<a href="https://bibleox.com/ko/ko-nkrv/vtor/18/#L22">신 18:22</a>)</p></blockquote><p>그러나 선지자나 꿈꾸는 자가 어떤 표적이나 기적을 보이거나 그의 꿈이 이루어지더라도, 다른 신을 섬기자고 하면 그의 말을 듣지 말아야 합니다.</p><blockquote><p>“너희 중에 선지자나 꿈 꾸는 자가 일어나서 <strong>이적과 기사를 네게 보이고 그가 네게 말한 그 이적과 기사가 이루어지고</strong> <strong>너희가 알지 못하던 다른 신들을 우리가 따라 섬기자고 말할지라도</strong> <strong>너는 그 선지자나 꿈 꾸는 자의 말을 청종하지 말라</strong> 이는 너희의 하나님 여호와께서 너희가 마음을 다하고 뜻을 다하여 너희의 하나님 여호와를 사랑하는 여부를 알려 하사 너희를 시험하심이니라 너희는 너희의 하나님 여호와를 따르며 그를 경외하며 그의 명령을 지키며 그의 목소리를 청종하며 그를 섬기며 그를 의지하며” (<a href="https://bibleox.com/ko/ko-nkrv/vtor/13/#L1-4">신 13:1-4</a>)</p></blockquote>
  title_sub: 이단, 분열, 거짓 선지자
  meta_desc: 거짓 가르침이 퍼질 것에 관한 성경 구절
