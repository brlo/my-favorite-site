  title: 그리스도에 관한 예언
  copy_cover: true
  body: '<h2>예언</h2><ol><li><p>그리스도께서 오시기까지의 날 수(<a href="https://bibleox.com/ko/ko-nkrv/dan/9/#L24-25">단 9:24-25</a>).</p></li><li><p>그리스도께서는 <strong>둘째</strong> 예루살렘 성전(지금은 남아 있지 않음)에 오실 것이다(<a href="https://bibleox.com/ko/ko-nkrv/ag/2/#L9">학 2:9</a>).</p></li><li><p>그리스도께서는 유다 지파가 권세를 잃을 때 오실 것이다(<a href="https://bibleox.com/ko/ko-nkrv/gen/49/#L10">창 49:10</a>). <a href="https://ko.wikipedia.org/wiki/헤로데_대왕">헤롯 대왕</a>은 <a href="https://ko.wikipedia.org/wiki/에돔">에돔</a> 사람, 곧 유대인이 아니라 에서의 후손이었습니다. 그는 마카베오 가문이 속한 유대인의 <a href="https://ko.wikipedia.org/wiki/하스몬_왕조">하스몬 왕조</a>를 대신하였습니다.</p></li><li><p>그리스도께서는 베들레헴에서 나실 것이다(<a href="https://bibleox.com/ko/ko-nkrv/mih/5/#L2">미 5:2</a>).</p></li><li><p>그리스도께서는 다윗의 후손이실 것이다(<a href="https://bibleox.com/ko/ko-nkrv/ps/89/#L3-5,27-29,36">시 89:3-5,27-29,36</a>).</p></li><li><p>그리스도께서는 새 언약을 세우실 것이다(<a href="https://bibleox.com/ko/ko-nkrv/is/42/#L6">사 42:6</a>). 하느님과 맺은 모든 언약은 피로 세워졌고, 이 경우에는 예수 그리스도 자신의 피로 세워졌습니다.</p></li><li><p>그리스도께서는 은 삼십에 팔리실 것이다(<a href="https://bibleox.com/ko/ko-nkrv/zah/11/#L12-13">슥 11:12-13</a>).</p></li><li><p>그리스도께서는 강도들과 함께 처형되실 것이다(<a href="https://bibleox.com/ko/ko-nkrv/dan/9/#L26">단 9:26</a>; <a href="https://bibleox.com/ko/ko-nkrv/is/53/#L12">사 53:12</a>; <a href="https://bibleox.com/ko/ko-nkrv/zah/12/#L10">슥 12:10</a>).</p></li><li><p>그분의 손과 발이 찔릴 것이며(<a href="https://bibleox.com/ko/ko-nkrv/ps/22/#L16">시 22:16</a>), 그분은 (창에) 찔리실 것이다(<a href="https://bibleox.com/ko/ko-nkrv/zah/12/#L10">슥 12:10</a>) (비판에 대한 답은 아래 참조).</p></li><li><p>지나가는 자들이 그리스도를 비웃으며, 그가 하느님을 의지하니 하느님이 기뻐하시면 건지실 것이라고 말할 것이다(<a href="https://bibleox.com/ko/ko-nkrv/ps/22/#L7-8">시 22:7-8</a>).</p></li><li><p>그리스도께서 처형되신 뒤 예루살렘과 성전이 무너질 것이다(<a href="https://bibleox.com/ko/ko-nkrv/dan/9/#L26">단 9:26</a>).</p></li><li><p>그리스도의 구원하는 고난에 관한 이사야 선지자의 한 장 전체: <a href="https://bibleox.com/ko/ko-nkrv/is/53/#L1-12">사 53:1-12</a>: “<strong>그가 찔림은 우리의 허물 때문이요 그가 상함은 우리의 죄악 때문이라 그가 징계를 받으므로 우리는 평화를 누리고 그가 채찍에 맞으므로 우리는 나음을 받았도다</strong> 우리는 다 양 같아서 그릇 행하여 각기 제 길로 갔거늘 여호와께서는 우리 모두의 죄악을 그에게 담당시키셨도다 <strong>그가 곤욕을 당하여 괴로울 때에도</strong> 그의 입을 열지 아니하였음이여 <strong>마치 도수장으로 끌려 가는 어린 양</strong>과 털 깎는 자 앞에서 잠잠한 양 같이 그의 입을 열지 아니하였도다 그는 곤욕과 심문을 당하고 끌려 갔으나 그 세대 중에 누가 생각하기를 그가 살아 있는 자들의 땅에서 끊어짐은 마땅히 형벌 받을 내 백성의 허물 때문이라 하였으리요 그는 강포를 행하지 아니하였고 그의 입에 거짓이 없었으나 <strong>그의 무덤이 악인들과 함께 있었으며 그가 죽은 후에 부자와 함께 있었도다</strong> 여호와께서 그에게 상함을 받게 하시기를 원하사 <strong>질고를 당하게 하셨은즉 그의 영혼을 속건제물로 드리기에 이르면</strong> 그가 씨를 보게 되며 그의 날은 길 것이요 또 그의 손으로 여호와께서 기뻐하시는 뜻을 성취하리로다 <strong>그가 자기 영혼의 수고한 것을 보고 만족하게 여길 것이라 나의 의로운 종이</strong> 자기 지식으로 많은 사람을 의롭게 하며 또 그들의 죄악을 친히 담당하리로다 그러므로 내가 그에게 존귀한 자와 함께 몫을 받게 하며 강한 자와 함께 탈취한 것을 나누게 하리니 이는 <strong>그가 자기 영혼을 버려 사망에 이르게 하며 범죄자 중 하나로 헤아림을 받았음이니라</strong> 그러나 그가 많은 사람의 죄를 담당하며 범죄자를 위하여 기도하였느니라”(<a href="https://bibleox.com/ko/ko-nkrv/is/53/#L5-12">사 53:5-12</a>)</p></li></ol><h2>그리스도의 고난의 예표</h2><ol><li><p>하느님께서 대제사장 위임 예식을 정하셨습니다. 대제사장과 제사장들이 수소에게 안수하고 회막 문에서 잡습니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/29/#L10-11">출 29:10-11</a>). 마찬가지로 대제사장들과 제사장들은 밤에 그리스도를 잡기로 공모하였고(<a href="https://bibleox.com/ko/ko-nkrv/mf/26/#L45-47">마 26:45-47</a>), 그 뒤 예루살렘 성문 밖에서 그분을 처형하였습니다(<a href="https://bibleox.com/ko/ko-nkrv/evr/13/#L12">히 13:12</a>).</p></li><li><p>같은 곳에서 이어서, 수소의 피를 제단 뿔들에 바르고 나머지 피는 모두 제단 밑에 쏟습니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/29/#L12">출 29:12</a>). 그리스도께서 제물로 바쳐지신 제단은 십자가였습니다. 그리스도의 손과 발이 못 박히고 창에 찔리셨으므로 십자가는 그리스도의 피로 물들었고, 그 피는 십자가(제단) 밑으로 흘러내렸습니다.</p></li><li><p>위임 예식을 마치자 제단은 지극히 거룩해져, 제단에 닿는 것은 모두 거룩하게 됩니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/29/#L37">출 29:37</a>). 이와 같이 십자가(제단)는 그리스도인들에게 큰 성물이 되어 물과 물건과 사람을 거룩하게 하는 데 쓰입니다. 물을 축성할 때 십자가를 쓰며, 사람과 물건 위에 손으로 십자 성호를 긋습니다.</p></li></ol><h2>그리스도의 고난에 관한 예언</h2><ol><li><p>그리스도께서는 자신을 하느님의 아들이라 부르실 것이다.</p></li><li><p>그분의 말씀과 행위는 그분의 반대자들을 드러낼 것이다.</p></li><li><p>그분은 하느님을 자기 아버지라 부르실 것이다.</p></li><li><p>그리스도의 반대자들은 그분을 모욕하고 괴롭힐 것이다.</p></li><li><p>그들은 그분에게 수치스러운 죽음을 선고할 것이다.</p></li></ol><blockquote><p>“의인을 숨어 기다리자. <strong>그는 우리에게 거북하고 우리의 행위에 맞서며</strong>, <strong>율법을 어긴 죄를 들어 우리를 꾸짖고</strong> 우리가 배운 대로 저지른 <strong>죄를 들어 우리를 탓한다</strong>. <strong>그는 하느님을 안다고 공언하며 자신을 주님의 아이라고 부른다</strong>. 그는 <strong>우리 생각을 꾸짖는 자</strong>가 되었으니, <strong>그를 보기만 하여도 우리에게는 짐이다. 그의 삶은 다른 이들과 같지 않고 그의 길은 남다르기 때문이다. 그는 우리를 가짜로 여기고, 더러운 것을 피하듯 우리의 길을 멀리한다</strong>. 그는 의인들의 마지막을 복되다 하며 <strong>하느님이 자기 아버지라고 자랑한다</strong>. 그의 말이 참인지 보고, 그의 마지막이 어떠할지 시험해 보자. <strong>의인이 하느님의 아들이라면 하느님이 그를 도우시고 그를 대적하는 자들의 손에서 건지실 것이다</strong>. <strong>모욕과 고문으로 그를 시험하여</strong> 그의 온유함을 알고 그의 참을성을 시험해 보자. <strong>그에게 수치스러운 죽음을 선고하자</strong>. 그의 말대로라면 그에게 돌보심이 있을 것이다. 그들은 이렇게 생각하였으나 그릇되었으니, <strong>그들의 악이 그들의 눈을 멀게 하였다</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/prs/2/#L12-21">지혜 2:12-21</a>, 그리스어에서 번역) <em>(그리스어로 παῖδα κυρίου ἑαυτὸν ὀνομάζει — 자신을 “주님의 아이(종, 아들)”라고 부른다; εἰ γάρ ἐστιν ὁ δίκαιος υἱὸς θεοῦ — “의인이 하느님의 아들이라면”.)</em></p></blockquote><h2>비판</h2><h3>손과 발을 찔렀는가, 사자가 찢는가?</h3><p>후대의 마소라 본문(<a href="https://bibleox.com/ko/ko-nkrv/ps/22/#L17">시 22:17</a>, 히브리어 절 번호)에는 손과 발을 찔렀다는 말이 없습니다. 그 대신 “사자”라는 말(כָּאֲרִי, “사자처럼”)이 있습니다. 본문에는 “찢다”라는 동사도 전혀 없고, 사자의 행동이 손과 발과 어떻게 이어지는지도 분명하지 않습니다. 그래서 이 절은 번역마다 다릅니다. 개역개정은 “내 수족을 찔렀나이다”(<a href="https://bibleox.com/ko/ko-nkrv/ps/22/#L16">시 22:16</a>)로 옮겼지만, 영어 NRSV처럼 “내 손과 발이 오그라들었다”로 옮긴 번역도 있습니다.</p><p>그러나 “찔렀다”가 옳습니다. 칠십인역에는 ὤρυξαν χεῖράς μου καὶ πόδας, 곧 “그들이 내 손과 발을 찔렀다(뚫었다)”라고 되어 있고(<a href="https://bibleox.com/ko/gr-lxx-byz/ps/21/#L16">시 21:16</a>), 고대 쿰란 사본 4Q88[2]도 손과 발을 찔렀다는 것을 확인해 줍니다.</p><p>게다가 찌르는 일을 바로 말하는 다른 예언도 있습니다. 여기서 그 예언을 언급합니다.</p><blockquote><p>“또 다른 성경에 <strong><mark>그들이 그 찌른 자를 보리라</mark></strong> 하였느니라” (<a href="https://bibleox.com/ko/ko-nkrv/in/19/#L37">요 19:37</a>)</p></blockquote><p>그 예언은 이것입니다.</p><blockquote><p>“내가 다윗의 집과 예루살렘 주민에게 은총과 간구하는 심령을 부어 주리니 그들이 그 <strong><mark>찌른</mark></strong> 바 그를 바라보고 그를 위하여 애통하기를 독자를 위하여 애통하듯 하며 그를 위하여 통곡하기를 장자를 위하여 통곡하듯 하리로다” (<a href="https://bibleox.com/ko/ko-nkrv/zah/12/#L10">슥 12:10</a>)</p></blockquote><blockquote><p>“וְשָׁפַכְתִּי עַל ־ בֵּית דָּוִיד וְעַל ׀ יוֹשֵׁב יְרוּשָׁלִַם רוּחַ חֵן וְתַחֲנוּנִים וְהִבִּיטוּ אֵלַי אֵת אֲשֶׁר ־ <strong><mark>דָּקָרוּ</mark></strong> וְסָפְדוּ עָלָיו כְּמִסְפֵּד עַל ־ הַיָּחִיד וְהָמֵר עָלָיו כְּהָמֵר עַֽל ־ הַבְּכֽוֹר ׃” (<a href="https://bibleox.com/ko/heb-osm/zah/12/#L10">슥 12:10</a>)</p></blockquote><p>דָּקָ֑רוּ</p><p>דקר — 찌르다, 꿰뚫다; 찔리다, 꿰뚫리다.</p><p>쿰란 사본 4Q80[1]도 그분이 찔리셨다는 것을 확인해 줍니다.</p>'
