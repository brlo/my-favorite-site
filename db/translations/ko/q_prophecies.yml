  title: 그리스도의 재림
  copy_cover: true
  body: '<h2>그리스도의 재림 전에 일어날 사건</h2><h3>땅 위에 적그리스도의 짧은 나라</h3><blockquote><p>“형제들아 우리가 너희에게 구하는 것은 우리 주 예수 그리스도의 강림하심과 우리가 그 앞에 모임에 관하여 영으로나 또는 말로나 또는 우리에게서 받았다 하는 편지로나 주의 날이 이르렀다고 해서 쉽게 마음이 흔들리거나 두려워하거나 하지 말아야 한다는 것이라 누가 어떻게 하여도 너희가 미혹되지 말라 <strong>먼저 배교하는 일이 있고 저 불법의 사람 곧 멸망의 아들이 나타나기 전에는 그 날이 이르지 아니하리니</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2sol/2/#L1-3">살후 2:1-3</a>)</p></blockquote><p>자세한 내용은 주석에[2].</p><h2>주 예수 그리스도의 재림 때 일어날 사건</h2><h3>하늘에 십자가가 나타날 것이다</h3><blockquote><p>“그 때에 <strong>인자의 징조가 하늘에서 보이겠고</strong> 그 때에 땅의 모든 족속들이 통곡하며 그들이 인자가 구름을 타고 능력과 큰 영광으로 오는 것을 보리라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/24/#L30">마 24:30</a>)</p></blockquote><h3>그리스도께서 모든 거룩한 천사와 함께 오실 것이다</h3><p>그리스도의 재림은 아버지의 영광 가운데 모든 거룩한 천사와 함께 이루어질 것입니다.</p><blockquote><p>“<strong>인자가</strong> 자기 영광으로 <strong>모든 천사와 함께 올 때에</strong> 자기 영광의 보좌에 앉으리니” (<a href="https://bibleox.com/ko/ko-nkrv/mf/25/#L31">마 25:31</a>)</p></blockquote><blockquote><p>“누구든지 이 음란하고 죄 많은 세대에서 나와 내 말을 부끄러워하면 인자도 <strong>아버지의 영광으로 거룩한 천사들과 함께 올 때에</strong> 그 사람을 부끄러워하리라” (<a href="https://bibleox.com/ko/ko-nkrv/mk/8/#L38">막 8:38</a>)</p></blockquote><blockquote><p>“<strong>인자가 아버지의 영광으로 그 천사들과 함께 오리니</strong> 그 때에 각 사람이 행한 대로 갚으리라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/16/#L27">마 16:27</a>)</p></blockquote><blockquote><p>“아담의 칠대 손 에녹이 이 사람들에 대하여도 예언하여 이르되 보라 <strong>주께서 그 수만의 거룩한 자와 함께 임하셨나니</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/iud/1/#L14">유 1:14</a>)</p></blockquote><blockquote><p>“너희 마음을 굳건하게 하시고 <strong>우리 주 예수께서 그의 모든 성도와 함께 강림하실 때에</strong> 하나님 우리 아버지 앞에서 거룩함에 흠이 없게 하시기를 원하노라” (<a href="https://bibleox.com/ko/ko-nkrv/1sol/3/#L13">살전 3:13</a>)</p></blockquote><blockquote><p>“환난을 받는 너희에게는 우리와 함께 안식으로 갚으시는 것이 하나님의 공의시니 <strong>주 예수께서 자기의 능력의 천사들과 함께 하늘로부터</strong> 불꽃 가운데에 나타나실 때에” (<a href="https://bibleox.com/ko/ko-nkrv/2sol/1/#L7">살후 1:7</a>)</p></blockquote><blockquote><p>“그 산 골짜기는 아셀까지 이를지라 너희가 그 산 골짜기로 도망하되 유다 왕 웃시야 때에 지진을 피하여 도망하던 것 같이 하리라 <strong>나의 하나님 여호와께서 임하실 것이요 모든 거룩한 자들이 주와 함께 하리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/zah/14/#L5">슥 14:5</a>)</p></blockquote><h3>모든 죽은 자를 부활시키실 것이다</h3><p>지금까지 살았던 모든 사람, 곧 의인과 악인이 모두 부활할 것입니다.</p><blockquote><p>“그들이 기다리는 바 하나님께 향한 소망을 나도 가졌으니 곧 <strong>의인과 악인의 부활이 있으리라</strong> 함이니이다” (<a href="https://bibleox.com/ko/ko-nkrv/act/24/#L15">행 24:15</a>)</p></blockquote><p>부활은 변화된, 썩지 않을 몸으로 이루어지며, 의인들은 해와 같이 빛날 것입니다.</p><blockquote><p>“그 때에 <strong>의인들은 자기 아버지 나라에서 해와 같이 빛나리라</strong> 귀 있는 자는 들으라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/13/#L43">마 13:43</a>)</p></blockquote><p>재림 전에 죽은 사람들은 영혼으로 부활을 기다리는 곳에 머물러 있었습니다. 의인들의 영혼은 하늘에서 그리스도와 함께 기뻐하였고(<a href="https://bibleox.com/ko/ko-nkrv/evr/12/#L22-23">히 12:22-23</a>; <a href="https://bibleox.com/ko/ko-nkrv/otkr/6/#L9-11">계 6:9-11</a>), 죄인들의 영혼은 다른 곳에서 고통을 받았습니다(<a href="https://bibleox.com/ko/ko-nkrv/lk/16/#L23">눅 16:23</a>).</p><p>그리스도께서 재림하실 때까지 아직 죽음을 보지 않은 사람들의 몸도 죽은 자 가운데서 부활한 사람들의 몸처럼 변화될 것입니다.</p><blockquote><p>“<strong>죽은 자의 부활</strong>도 그와 같으니 썩을 것으로 심고 썩지 아니할 것으로 다시 살아나며 &lt;…&gt; 육의 몸으로 심고 신령한 몸으로 다시 살아나나니 육의 몸이 있은즉 또 영의 몸도 있느니라 &lt;…&gt; 보라 내가 너희에게 비밀을 말하노니 <strong>우리가 다 잠 잘 것이 아니요 마지막 나팔에 순식간에 홀연히 다 변화되리니</strong> 나팔 소리가 나매 <strong>죽은 자들이 썩지 아니할 것으로 다시 살아나고 우리도 변화되리라</strong> <strong>이 썩을 것이 반드시 썩지 아니할 것을 입겠고</strong> 이 죽을 것이 죽지 아니함을 입으리로다” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/15/#L42,44,51-53">고전 15:42,44,51-53</a>)</p></blockquote><blockquote><p>“형제들아 자는 자들에 관하여는 너희가 알지 못함을 우리가 원하지 아니하노니 이는 소망 없는 다른 이와 같이 슬퍼하지 않게 하려 함이라 우리가 예수께서 죽으셨다가 다시 살아나심을 믿을진대 이와 같이 예수 안에서 자는 자들도 하나님이 그와 함께 데리고 오시리라 우리가 주의 말씀으로 너희에게 이것을 말하노니 <strong>주께서 강림하실 때까지 우리 살아 남아 있는 자도 자는 자보다 결코 앞서지 못하리라</strong> 주께서 호령과 천사장의 소리와 하나님의 나팔 소리로 <strong>친히 하늘로부터 강림하시리니 그리스도 안에서 죽은 자들이 먼저 일어나고</strong> <strong>그 후에 우리 살아 남은 자들도</strong> <strong>그들과 함께 구름 속으로 끌어 올려 공중에서 주를 영접하게 하시리니</strong> 그리하여 우리가 항상 주와 함께 있으리라” (<a href="https://bibleox.com/ko/ko-nkrv/1sol/4/#L13-17">살전 4:13-17</a>)</p></blockquote><h3>그리스도께서 천사들을 보내어 모든 사람을 심판대로 모으실 것이다</h3><p>천사들이 의인과 악인을 모을 것입니다.</p><blockquote><p>“또 그 때에 그가 <strong>천사들을 보내어</strong> 자기가 <strong>택하신 자들을</strong> 땅 끝으로부터 하늘 끝까지 사방에서 <strong>모으리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mk/13/#L27">막 13:27</a>)</p></blockquote><blockquote><p>“<strong>인자가 그 천사들을 보내리니</strong> 그들이 그 나라에서 모든 넘어지게 하는 것과 또 <strong>불법을 행하는 자들을 거두어 내어</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/13/#L41">마 13:41</a>)</p></blockquote><h3>그리스도께서 판결을 내리실 것이다</h3><blockquote><p>“인자가 자기 영광으로 모든 천사와 함께 올 때에 <strong>자기 영광의 보좌에 앉으리니</strong> 모든 민족을 그 앞에 모으고 각각 구분하기를 목자가 양과 염소를 구분하는 것 같이 하여 양은 그 오른편에 염소는 왼편에 두리라 그 때에 임금이 그 오른편에 있는 자들에게 이르시되 <strong>내 아버지께 복 받을 자들이여 나아와 창세로부터 너희를 위하여 예비된 나라를 상속받으라</strong> 내가 주릴 때에 너희가 먹을 것을 주었고 목마를 때에 마시게 하였고 나그네 되었을 때에 영접하였고 헐벗었을 때에 옷을 입혔고 병들었을 때에 돌보았고 옥에 갇혔을 때에 와서 보았느니라 이에 의인들이 대답하여 이르되 주여 우리가 어느 때에 주께서 주리신 것을 보고 음식을 대접하였으며 목마르신 것을 보고 마시게 하였나이까 어느 때에 나그네 되신 것을 보고 영접하였으며 헐벗으신 것을 보고 옷 입혔나이까 어느 때에 병드신 것이나 옥에 갇히신 것을 보고 가서 뵈었나이까 하리니 임금이 대답하여 이르시되 내가 진실로 너희에게 이르노니 너희가 여기 내 형제 중에 지극히 작은 자 하나에게 한 것이 곧 내게 한 것이니라 하시고 또 왼편에 있는 자들에게 이르시되 <strong>저주를 받은 자들아 나를 떠나 마귀와 그 사자들을 위하여 예비된 영원한 불에 들어가라</strong> 내가 주릴 때에 너희가 먹을 것을 주지 아니하였고 목마를 때에 마시게 하지 아니하였고 나그네 되었을 때에 영접하지 아니하였고 헐벗었을 때에 옷 입히지 아니하였고 병들었을 때와 옥에 갇혔을 때에 돌보지 아니하였느니라 하시니 그들도 대답하여 이르되 주여 우리가 어느 때에 주께서 주리신 것이나 목마르신 것이나 나그네 되신 것이나 헐벗으신 것이나 병드신 것이나 옥에 갇히신 것을 보고 공양하지 아니하더이까 이에 임금이 대답하여 이르시되 내가 진실로 너희에게 이르노니 이 지극히 작은 자 하나에게 하지 아니한 것이 곧 내게 하지 아니한 것이니라 하시리니 그들은 영벌에, 의인들은 영생에 들어가리라 하시니라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/25/#L31-46">마 25:31-46</a>)</p></blockquote><h3>구원받은 이들은 그리스도와 함께하는 영원한 생명으로 들어갈 것이다</h3><p>그전에 그들은 몸의 부활을 기다리며 영혼으로만 그리스도와 함께 있었습니다. 이제 의인들은 변화된 몸을 받고(부활하여) 그리스도와 함께하는 영원한 생명으로 들려 올라갑니다.</p><blockquote><p>“주께서 호령과 천사장의 소리와 하나님의 나팔 소리로 친히 하늘로부터 강림하시리니 그리스도 안에서 죽은 자들이 먼저 일어나고 그 후에 우리 살아 남은 자들도 <strong>그들과 함께 구름 속으로 끌어 올려 공중에서 주를 영접하게 하시리니 그리하여 우리가 항상 주와 함께 있으리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1sol/4/#L16-17">살전 4:16-17</a>)</p></blockquote><h3>멸망한 자들은 영원한 형벌로 보내질 것이다</h3><blockquote><p>“<strong>그들은 영벌에</strong>, 의인들은 영생에 들어가리라 하시니라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/25/#L46">마 25:46</a>)</p></blockquote><p>기록된 대로 구원도 형벌도 영원할 것입니다.</p><h2>재림의 중요한 특징</h2><h3>오심은 번개와 같다</h3><p>그리스도의 재림은 번개가 번쩍이듯 순식간에 온 세상 모든 사람에게 알려질 것입니다.</p><blockquote><p>“사람이 너희에게 말하되 <strong>보라 저기 있다 보라 여기 있다 하리라</strong> 그러나 <strong>너희는 가지도 말고 따르지도 말라</strong> <strong>번개가</strong> 하늘 아래 이쪽에서 번쩍이어 하늘 아래 저쪽까지 비침같이 <strong>인자도 자기 날에 그러하리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/lk/17/#L23-24">눅 17:23-24</a>)</p></blockquote><blockquote><p>“그러면 사람들이 너희에게 말하되 <strong>보라 그리스도가 광야에 있다 하여도</strong> 나가지 말고 보라 골방에 있다 하여도 믿지 말라 <strong>번개가 동편에서 나서 서편까지 번쩍임 같이 인자의 임함도 그러하리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/24/#L26-27">마 24:26-27</a>)</p></blockquote><h3>그리스도께서는 같은 장성한 몸으로 오실 것이다</h3><p>그리스도께서는 다시 사람에게서 태어나지 않으시고, 이미 가지신 몸, 곧 우리 기원 1년에 하느님의 어머니 동정녀 마리아에게서 나실 때 받으신 그 몸으로 오실 것입니다.</p><blockquote><p>“이 말씀을 마치시고 그들이 보는데 올려져 가시니 구름이 그를 가리어 보이지 않게 하더라 올라가실 때에 제자들이 자세히 하늘을 쳐다보고 있는데 흰 옷 입은 두 사람이 그들 곁에 서서 이르되 갈릴리 사람들아 어찌하여 서서 하늘을 쳐다보느냐 너희 가운데서 <strong>하늘로 올려지신 이 예수는 하늘로 가심을 본 그대로 오시리라</strong> 하였느니라” (<a href="https://bibleox.com/ko/ko-nkrv/act/1/#L9-11">행 1:9-11</a>)</p></blockquote><h3>심판하러 오심</h3><p>주님께서는 가르치러 오시는 것이 아니라, 처음 오셨을 때 이미 주신 말씀으로 심판하러 오실 것입니다.</p><blockquote><p>“나를 저버리고 내 말을 받지 아니하는 자를 심판할 이가 있으니 곧 <strong>내가 한 그 말이 마지막 날에 그를 심판하리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/in/12/#L48">요 12:48</a>)</p></blockquote><blockquote><p>“인자가 아버지의 영광으로 그 천사들과 함께 오리니 그 때에 <strong>각 사람이 행한 대로 갚으리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/16/#L27">마 16:27</a>)</p></blockquote><blockquote><p>“<strong>인자가 자기 영광으로</strong> 모든 천사와 함께 올 때에 <strong>자기 영광의 보좌에 앉으리니</strong> <strong>모든 민족을 그 앞에 모으고</strong> <strong>각각 구분하기를</strong> 목자가 양과 염소를 구분하는 것 같이 하여 양은 그 오른편에 염소는 왼편에 두리라 &lt;…&gt; <strong>그들은 영벌에, 의인들은 영생에 들어가리라</strong> 하시니라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/25/#L31-33,46">마 25:31-33,46</a>)</p></blockquote><blockquote><p>“이는 <strong>하나님의 공의로운 심판</strong>의 표요 너희로 하여금 하나님의 나라에 합당한 자로 여김을 받게 하려 함이니 그 나라를 위하여 너희가 또한 고난을 받느니라 너희로 환난을 받게 하는 자들에게는 환난으로 갚으시고 환난을 받는 너희에게는 우리와 함께 안식으로 갚으시는 것이 하나님의 공의시니 <strong>주 예수께서 자기의 능력의 천사들과 함께 하늘로부터 불꽃 가운데에 나타나실 때에</strong> 하나님을 모르는 자들과 우리 주 예수의 복음에 복종하지 않는 자들에게 <strong>형벌을 내리시리니</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2sol/1/#L5-8">살후 1:5-8</a>)</p></blockquote><h3>재림과 심판은 떼려야 뗄 수 없다</h3><p>그리스도께서 재림하실 때 죄인들만이 아니라 모든 사람에 대한 심판이 이루어집니다. 주님께서는 어떤 이들에게는 상을 주시고, 다른 이들에게는 벌을 내리실 것입니다.</p><blockquote><p>“<strong>인자가 자기 영광으로 모든 천사와 함께 올 때에</strong> <strong>자기 영광의 보좌에 앉으리니</strong> <strong>모든 민족을 그 앞에 모으고</strong> <strong>각각 구분하기를</strong> 목자가 양과 염소를 구분하는 것 같이 하여 양은 그 오른편에 염소는 왼편에 두리라 &lt;…&gt; <strong>그들은 영벌에, 의인들은 영생에 들어가리라</strong> 하시니라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/25/#L31-33,46">마 25:31-33,46</a>)</p></blockquote><blockquote><p>“또 내가 크고 흰 보좌와 그 위에 앉으신 이를 보니 땅과 하늘이 그 앞에서 피하여 간 데 없더라 또 내가 보니 죽은 자들이 큰 자나 작은 자나 그 보좌 앞에 서 있는데 책들이 펴 있고 또 다른 책이 펴졌으니 곧 생명책이라 <strong>죽은 자들이 자기 행위를 따라 책들에 기록된 대로 심판을 받으니</strong> 바다가 그 가운데에서 죽은 자들을 내주고 또 <strong>사망과 음부도 그 가운데에서 죽은 자들을 내주매 각 사람이 자기의 행위대로 심판을 받고</strong> 사망과 음부도 불못에 던져지니 <strong>이것은 둘째 사망</strong> 곧 불못이라 누구든지 생명책에 기록되지 못한 자는 불못에 던져지더라” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/20/#L11-15">계 20:11-15</a>)</p></blockquote><blockquote><p>“<strong>인자가 아버지의 영광으로 그 천사들과 함께 오리니</strong> 그 때에 <strong>각 사람이 행한 대로 갚으리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/16/#L27">마 16:27</a>)</p></blockquote><blockquote><p>“<strong>인자가 자기 영광으로 모든 천사와 함께 올 때에 자기 영광의 보좌에 앉으리니</strong> <strong>모든 민족을 그 앞에 모으고</strong> <strong>각각 구분하기를</strong> 목자가 양과 염소를 구분하는 것 같이 하여 &lt;…&gt; 그 때에 <strong>임금이 그 오른편에 있는 자들에게</strong> 이르시되 내 아버지께 <strong>복 받을 자들</strong>이여 나아와 창세로부터 너희를 위하여 예비된 나라를 상속받으라 &lt;…&gt; 또 <strong>왼편에 있는 자들에게</strong> 이르시되 <strong>저주를 받은 자들</strong>아 나를 떠나 마귀와 그 사자들을 위하여 예비된 영원한 불에 들어가라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/25/#L31-32,34,41">마 25:31-32,34,41</a>)</p></blockquote><blockquote><p>“이는 하나님의 공의로운 심판의 표요 너희로 하여금 하나님의 나라에 합당한 자로 여김을 받게 하려 함이니 그 나라를 위하여 너희가 또한 고난을 받느니라 <strong>너희로 환난을 받게 하는 자들에게는 환난으로 갚으시고 환난을 받는 너희에게는 우리와 함께 안식으로 갚으시는 것이 하나님의 공의시니 주 예수께서 자기의 능력의 천사들과 함께 하늘로부터</strong> 불꽃 가운데에 나타나실 때에” (<a href="https://bibleox.com/ko/ko-nkrv/2sol/1/#L5-7">살후 1:5-7</a>)</p></blockquote><blockquote><p>“또 내게 말하되 이 두루마리의 예언의 말씀을 인봉하지 말라 때가 가까우니라 <strong>불의를 행하는 자는 그대로 불의를 행하고 더러운 자는 그대로 더럽고 의로운 자는 그대로 의를 행하고 거룩한 자는 그대로 거룩하게 하라 보라 내가 속히 오리니 내가 줄 상이 내게 있어 각 사람에게 그가 행한 대로 갚아 주리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/22/#L10-12">계 22:10-12</a>)</p></blockquote><h3>모든 사람이 심판을 받는다</h3><blockquote><p>“이는 <strong>우리가 다 반드시 그리스도의 심판대 앞에 나타나게 되어</strong> 각각 <strong>선악간에</strong> 그 몸으로 <strong>행한 것</strong>을 따라 받으려 함이라” (<a href="https://bibleox.com/ko/ko-nkrv/2kor/5/#L10">고후 5:10</a>)</p></blockquote><blockquote><p>“<strong>하나님은 모든 행위와 모든 은밀한 일을 선악 간에 심판하시리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ekl/12/#L14">전 12:14</a>)</p></blockquote><blockquote><p>“<strong>하나님의 집에서 심판을 시작할 때가 되었나니 만일 우리에게 먼저 하면</strong> 하나님의 복음을 순종하지 아니하는 자들의 그 마지막은 어떠하며 또 의인이 겨우 구원을 받으면 경건하지 아니한 자와 죄인은 어디에 서리요” (<a href="https://bibleox.com/ko/ko-nkrv/1pet/4/#L17-18">벧전 4:17-18</a>)</p></blockquote><blockquote><p>“네가 어찌하여 네 형제를 비판하느냐 어찌하여 네 형제를 업신여기느냐 <strong>우리가 다 하나님의 심판대 앞에 서리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/rim/14/#L10">롬 14:10</a>) <em>(비잔틴 본문(다수 사본)에는 “그리스도의 심판대”(τῷ βήματι τοῦ Χριστοῦ)라고 되어 있습니다.)</em></p></blockquote><blockquote><p>“너희는 자유의 율법대로 <strong>심판 받을 자처럼 말도 하고 행하기도 하라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/iak/2/#L12">약 2:12</a>)</p></blockquote><blockquote><p>“인자가 자기 영광으로 모든 천사와 함께 올 때에 자기 영광의 보좌에 앉으리니 <strong>모든 민족을 그 앞에 모으고</strong> 각각 구분하기를 목자가 양과 염소를 구분하는 것 같이 하여” (<a href="https://bibleox.com/ko/ko-nkrv/mf/25/#L31-32">마 25:31-32</a>)</p></blockquote><h3>심판은 교회에서 시작된다</h3><blockquote><p>“<strong>하나님의 집에서 심판을 시작할 때가 되었나니</strong> 만일 <strong>우리에게 먼저 하면</strong> 하나님의 복음을 순종하지 아니하는 자들의 그 마지막은 어떠하며 또 <strong>의인이 겨우 구원을 받으면</strong> 경건하지 아니한 자와 죄인은 어디에 서리요” (<a href="https://bibleox.com/ko/ko-nkrv/1pet/4/#L17-18">벧전 4:17-18</a>)</p></blockquote><h3>성도들이 세상을 심판한다</h3><blockquote><p>“예수께서 이르시되 내가 진실로 너희에게 이르노니 세상이 새롭게 되어 인자가 자기 영광의 보좌에 앉을 때에 나를 따르는 <strong>너희도 열두 보좌에 앉아 이스라엘 열두 지파를 심판하리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/19/#L28">마 19:28</a>)</p></blockquote><blockquote><p>“내 아버지께서 나라를 내게 맡기신 것 같이 나도 너희에게 맡겨 너희로 내 나라에 있어 내 상에서 먹고 마시며 또는 <strong>보좌에 앉아 이스라엘 열두 지파를 다스리게 하려 하노라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/lk/22/#L29-30">눅 22:29-30</a>) <em>(그리스어 κρίνοντες는 “심판하며”라는 뜻입니다.)</em></p></blockquote><blockquote><p>“<strong>성도가 세상을 판단할 것을</strong> 너희가 알지 못하느냐 세상도 너희에게 판단을 받겠거든 지극히 작은 일 판단하기를 감당하지 못하겠느냐” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/6/#L2">고전 6:2</a>)</p></blockquote><h3>많은 사람이 구원받지 못하여 놀랄 것이다</h3><p>그들은 자기가 구원받았다고 생각하였습니다.</p><blockquote><p>“그 날에 <strong>많은 사람이</strong> 나더러 이르되 주여 주여 우리가 주의 이름으로 <strong>선지자 노릇 하며</strong> 주의 이름으로 <strong>귀신을 쫓아 내며</strong> 주의 이름으로 <strong>많은 권능을 행하지 아니하였나이까</strong> 하리니 그 때에 내가 그들에게 밝히 말하되 <strong>내가 너희를 도무지 알지 못하니 불법을 행하는 자들아 내게서 떠나가라</strong> 하리라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/7/#L22-23">마 7:22-23</a>)</p></blockquote><h3>세상의 변화</h3><blockquote><p>“또 내가 <strong>새 하늘과 새 땅</strong>을 보니 처음 하늘과 처음 땅이 없어졌고 바다도 다시 있지 않더라 또 내가 보매 거룩한 성 새 예루살렘이 하나님께로부터 하늘에서 내려오니 그 준비한 것이 신부가 남편을 위하여 단장한 것 같더라 내가 들으니 보좌에서 큰 음성이 나서 이르되 보라 하나님의 장막이 사람들과 함께 있으매 하나님이 그들과 함께 계시리니 그들은 하나님의 백성이 되고 하나님은 친히 그들과 함께 계셔서 모든 눈물을 그 눈에서 닦아 주시니 다시는 사망이 없고 애통하는 것이나 곡하는 것이나 아픈 것이 다시 있지 아니하리니 처음 것들이 다 지나갔음이러라 보좌에 앉으신 이가 이르시되 <strong>보라 내가 만물을 새롭게 하노라</strong> 하시고 또 이르시되 이 말은 신실하고 참되니 기록하라 하시고 또 내게 말씀하시되 이루었도다 나는 알파와 오메가요 처음과 마지막이라 내가 생명수 샘물을 목마른 자에게 값없이 주리니” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/21/#L1-6">계 21:1-6</a>)</p></blockquote><h2>“천 년”이라는 표현에 관하여</h2><h3>천 년은 그리스도의 초림부터 재림까지의 기간을 비유로 부르는 이름이다</h3><p>초림은 이미 있었습니다. 하느님의 아들께서는 이전의 그분(하느님)이시기를 그치지 않으시면서 사람도 되셨습니다. 그분은 가르치시고, 고난을 받으시고, 부활하시고, 하늘에 앉으시고, (땅의 교회와 하늘의 교회가 하나인) 교회를 세우시고, 복음을 전하라고 보내셨습니다. 그리스도의 복음에 응답하여 그분의 교회에 들어오고 구원과 하늘에서 그분과 함께하는 삶에 이른 이들에 대하여, 그들의 몸은 죽은 자로서 아직 땅에 있지만 <a href="https://bibleox.com/ru/ru/w/жизнь-души-после-смерти-тела">그들의 영혼은 그리스도와 함께 있으므로</a> 그분과 함께 왕 노릇 한다고 말합니다. 이는 하느님 외에는 아무도 그 때를 알지 못하는(<a href="https://bibleox.com/ko/ko-nkrv/act/1/#L7">행 1:7</a>) 주 예수 그리스도의 재림 때까지 계속됩니다. 초림부터 재림까지의 이 기간 전체를 비유로 천 년이라고 부릅니다.</p><blockquote><p>“또 내가 보매 천사가 무저갱의 열쇠와 큰 쇠사슬을 그의 손에 가지고 하늘로부터 내려와서 용을 잡으니 곧 옛 뱀이요 마귀요 사탄이라 잡아서 <strong>천 년</strong> 동안 결박하여 무저갱에 던져 넣어 잠그고 그 위에 인봉하여 <strong>천 년</strong>이 차도록 다시는 만국을 미혹하지 못하게 하였는데 그 후에는 반드시 잠깐 놓이리라 또 내가 보좌들을 보니 거기에 앉은 자들이 있어 심판하는 권세를 받았더라 또 내가 보니 예수를 증언함과 하나님의 말씀 때문에 목 베임을 당한 자들의 영혼들과 또 짐승과 그의 우상에게 경배하지 아니하고 그들의 이마와 손에 그의 표를 받지 아니한 자들이 살아서 그리스도와 더불어 천 년 동안 왕 노릇 하니 (그 나머지 죽은 자들은 그 <strong>천 년이 차기까지</strong> 살지 못하더라) 이는 첫째 부활이라 이 첫째 부활에 참여하는 자들은 복이 있고 거룩하도다 둘째 사망이 그들을 다스리는 권세가 없고 도리어 그들이 하나님과 그리스도의 제사장이 되어 <strong>천 년</strong> 동안 그리스도와 더불어 왕 노릇 하리라” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/20/#L1-6">계 20:1-6</a>)</p></blockquote><h3>천년왕국설(천년설)이라는 이단에 관하여</h3><p>천년왕국설(천년설)은 그리스도께서 천 년 동안 땅에서 다스리신다는 가르침입니다. 정교회 그리스도인은 다음과 같은 이유로 이 가르침을 받아들일 수 없습니다.</p><ul><li><p><strong>두</strong> 번의 <strong>몸의 부활</strong>을 인정할 수 없습니다(주님께서는 몸의 부활을 한 번만 가르치셨습니다).</p></li><li><p><strong>두</strong> 번의 <strong>최후 심판</strong>을 인정할 수 없습니다(주님께서는 역시 한 번의 심판만 가르치십니다).</p></li><li><p>땅을 다스리기 위하여 최후 심판 전에 그리스도께서 <strong>따로 오신다</strong>는 것을 인정할 수 없습니다.</p></li><li><p>하늘나라와 다른, 이 세상에서 이루어지는 그리스도의 <strong>특별한 천년왕국</strong>을 인정할 수 없습니다.</p></li></ul><p>자세히: <a href="https://bibleox.com/ru/ru/w/хилиазм">천년왕국설</a> (러시아어).</p><h2>두 사망과 두 부활에 관하여</h2><p>사도 신학자 요한의 요한계시록에는(<a href="https://bibleox.com/ko/ko-nkrv/otkr/20/#L1-6">계 20:1-6</a>) 두 사망과 두 부활이 나옵니다.</p><p>첫째 사망은 이 땅에서 맞는 몸의 죽음입니다[1].</p><p>둘째 사망은 모든 사람에 대한 무서운 심판 때 하느님께서 내리시는 영원한 정죄와 형벌입니다.</p><p>첫째 부활은 영적인 부활, 곧 하느님께 돌아옴, 믿음, 회개, 세례, 삶을 고침입니다.</p><p>둘째 부활은 주 예수 그리스도께서 재림하실 때 이루어지는 몸의 부활입니다.</p><h3>첫째 부활은 복음과 세례를 통하여 하느님께 돌아오는 것이다</h3><p>주님께서 사탄을 결박하셨습니다. 이교 숭배는 그리스도교에 지기 시작하여 사라져 갔습니다. 사람들은 세례와 성찬과 교회 안의 삶을 통하여 하느님과 함께하는 영원한 생명으로 영적으로 부활할 수 있게 되었습니다. 영원한 생명으로 향하는 이 영적 부활을 본문은 첫째 부활이라고 부릅니다.</p><blockquote><p>“(그 나머지 죽은 자들은 그 천 년이 차기까지 살지 못하더라) 이는 <strong>첫째 부활</strong>이라 이 첫째 부활에 참여하는 자들은 복이 있고 거룩하도다 둘째 사망이 그들을 다스리는 권세가 없고 도리어 그들이 하나님과 그리스도의 제사장이 되어 천 년 동안 그리스도와 더불어 왕 노릇 하리라” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/20/#L5-6">계 20:5-6</a>)</p></blockquote><p>하느님께 돌아오는 것을 죽음에서 생명으로 옮기는 것이라고 부릅니다.</p><blockquote><p>“<strong>허물로 죽은 우리를 그리스도와 함께 살리셨고</strong> (너희는 은혜로 구원을 받은 것이라) 또 함께 일으키사 그리스도 예수 안에서 함께 하늘에 앉히시니” (<a href="https://bibleox.com/ko/ko-nkrv/ef/2/#L5-6">엡 2:5-6</a>)</p></blockquote><p>믿는 이는 사망에서 생명으로 옮겼습니다.</p><blockquote><p>“내가 진실로 진실로 너희에게 이르노니 <strong>내 말을 듣고 또 나 보내신 이를 믿는 자는 영생을 얻었고</strong> 심판에 이르지 아니하나니 <strong>사망에서 생명으로 옮겼느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/in/5/#L24">요 5:24</a>)</p></blockquote><p>믿지 않는 이들은 바로 죽은 자라고 불립니다.</p><blockquote><p>“이르시되 <strong>죽은 자들로 자기의 죽은 자들을 장사하게 하고</strong> 너는 가서 하나님의 나라를 전파하라 하시고” (<a href="https://bibleox.com/ko/ko-nkrv/lk/9/#L60">눅 9:60</a>)</p></blockquote><h3>둘째 부활은 모든 사람이 심판을 위하여 몸으로 부활하는 것이다</h3><p>둘째 부활은 모든 사람에게 해당합니다. 이는 지금까지 살았던 모든 사람이 모든 사람에 대한 심판을 위하여 부활하는 것을 뜻합니다. 모든 영혼은 회복된 자기 몸으로 돌아갑니다. 하느님을 향하였던 모든 것(영혼과 몸)은 상을 받고, 죄를 지은 모든 것(영혼과 몸)은 벌을 받게 하려는 것입니다.</p><blockquote><p>“그들이 기다리는 바 하나님께 향한 소망을 나도 가졌으니 곧 <strong>의인과 악인의 부활이 있으리라</strong> 함이니이다” (<a href="https://bibleox.com/ko/ko-nkrv/act/24/#L15">행 24:15</a>)</p></blockquote><h3>“두 부활”에 관하여 자세히</h3><blockquote><p>“또 내가 보매 천사가 무저갱의 열쇠와 큰 쇠사슬을 그의 손에 가지고 하늘로부터 내려와서 용을 잡으니 곧 옛 뱀이요 마귀요 사탄이라 잡아서 천 년 동안 결박하여 무저갱에 던져 넣어 잠그고 그 위에 인봉하여 천 년이 차도록 다시는 만국을 미혹하지 못하게 하였는데 그 후에는 반드시 잠깐 놓이리라 또 내가 보좌들을 보니 거기에 앉은 자들이 있어 심판하는 권세를 받았더라 또 내가 보니 예수를 증언함과 하나님의 말씀 때문에 목 베임을 당한 자들의 영혼들과 또 짐승과 그의 우상에게 경배하지 아니하고 그들의 이마와 손에 그의 표를 받지 아니한 자들이 살아서 그리스도와 더불어 천 년 동안 왕 노릇 하니 (그 나머지 죽은 자들은 그 천 년이 차기까지 살지 못하더라) <strong>이는 첫째 부활이라</strong> 이 <strong>첫째 부활에</strong> 참여하는 자들은 복이 있고 거룩하도다 <strong>둘째 사망</strong>이 그들을 다스리는 권세가 없고 도리어 그들이 하나님과 그리스도의 제사장이 되어 천 년 동안 그리스도와 더불어 왕 노릇 하리라” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/20/#L1-6">계 20:1-6</a>)</p></blockquote><p>이 구절에 대한 주석:</p><blockquote><p>“(<strong>그 나머지 죽은 자들은 그 천 년이 차기까지 살지 못하더라) 이는 첫째 부활이라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/20/#L5">계 20:5</a>)</p></blockquote><p>첫째 부활의 기간에 부활할 수 있도록 모든 사람에게 시간이 주어졌고, 그것을 위한 모든 것이 주어졌습니다. 그러나 죽은 자들이 부활해야 할 때, 곧 (그것을 위하여 정해진) 천 년 내내, 어떤 이들은 부활하였고 다른 이들은 부활하지 않았습니다. “까지”라는 말에 관하여 자세히: <a href="https://bibleox.com/ko/ko/w/Th9m_하느님의_어머니#HH-아들을-낳을-때까지-동침하지-않고마태-125">하느님의 어머니</a>.</p><p>앞의 사람들은 몸으로 살아 있을 때 부활하였습니다. 곧 그리스도께 돌아왔습니다.</p><blockquote><p>“이 첫째 부활에 참여하는 자들은 복이 있고 거룩하도다 둘째 사망이 그들을 다스리는 권세가 없고 도리어 그들이 <strong>하나님과 그리스도의 제사장이 되어 천 년 동안 그리스도와 더불어 왕 노릇 하리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/20/#L6">계 20:6</a>)</p></blockquote><p>그들에게는 <strong>둘째 사망</strong>이 권세를 갖지 못할 것입니다.</p><p>다음은 모든 사람이 모든 사람에 대한 심판을 위하여 몸으로 부활하는 것입니다.</p><blockquote><p>“바다가 그 가운데에서 죽은 자들을 내주고 또 사망과 음부도 그 가운데에서 죽은 자들을 내주매 각 사람이 자기의 행위대로 심판을 받고 사망과 음부도 불못에 던져지니 이것은 둘째 사망 곧 불못이라 <strong>누구든지 생명책에 기록되지 못한 자는 불못에 던져지더라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/20/#L13-15">계 20:13-15</a>)</p></blockquote><p>불못에 던져지는 것이 <strong>둘째 사망</strong>입니다. 생명책에 기록된 이들은 그곳에 던져지지 않았습니다. 곧 20:6에서 둘째 사망이 그들을 다스리는 권세가 없다고 한 이들입니다.</p>'
  title_sub: 재림과 관련된 사건들
  meta_desc: 성경에 따른 그리스도의 재림과 심판, 천 년에 관한 성경 구절
