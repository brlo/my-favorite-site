- src: лжехристос
  path: Fc6t_거짓_그리스도
  title: 거짓 그리스도
  copy_cover: true
  body: '<h2>머리말</h2><p>주 예수 그리스도께서는 2000여 년 전, <a href="https://bibleox.com/ru/ru/w/пророчества-о-Христе">옛 선지자들의 말씀</a>대로 지극히 순결하신 동정녀 마리아에게서 (남편 없이) 나셨습니다. 그분은 이미 소년 시절(열두 살)에 큰 지혜를 지니셔서 예루살렘 성전의 선생들을 놀라게 하셨습니다. 서른 살까지 예수 그리스도께서는 요셉에게 순종하며 평범한 일을 하셨고, 서른 살에 복음을 전하러 나서셨습니다. 이 시기에 관하여 자세히: <a href="https://bibleox.com/ru/ru/w/Христос-жизнь-в-Палестине">그리스도 — 팔레스타인에서의 삶</a>.</p><p>그 뒤 주 예수 그리스도께서는 복음을 전하시고, 제자들(사도들)을 가르치시고, 배반당하시고, 십자가에서 고난을 받으시고, 사흘째 되는 날 부활하시고, 40일 동안 따르는 이들에게 나타나 하늘나라에 관하여 가르치신 뒤 하늘로 올라가 하느님 오른편에 앉으셨으며, 온 세상을 심판하시려고 올라가신 그대로 다시 오시겠다고 약속하셨습니다. 그리고 10일 뒤(부활 후 50일째 되는 날) 그분은 자기 교회를 세우시고 성령을 교회에 영원히 보내셨습니다.</p><h2>거짓 그리스도에 관하여</h2><h3>미혹하는 자들</h3><p>주 예수 그리스도께서는 친히, 자기를 그리스도라 내세우는 미혹하는 자들이 올 것이며 많은 사람이 그들을 믿을 것이라고 경고하셨습니다.</p><blockquote><p>“예수께서 감람 산 위에 앉으셨을 때에 제자들이 조용히 와서 이르되 우리에게 이르소서 어느 때에 이런 일이 있겠사오며 또 주의 임하심과 세상 끝에는 무슨 징조가 있사오리이까 예수께서 대답하여 이르시되 <strong>너희가 사람의 미혹을 받지 않도록 주의하라 많은 사람이 내 이름으로 와서 이르되 나는 그리스도라 하여 많은 사람을 미혹하리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/24/#L3-5">마 24:3-5</a>)</p></blockquote><h2>그리스도의 오심에 관하여</h2><h3>오심은 번개와 같을 것이다</h3><p>그러나 그리스도의 재림은 번개가 번쩍이듯 순식간에 온 세상 모든 사람에게 알려질 것입니다.</p><blockquote><p>“사람이 너희에게 말하되 <strong>보라 저기 있다 보라 여기 있다 하리라</strong> 그러나 <strong>너희는 가지도 말고 따르지도 말라</strong> <strong>번개가</strong> 하늘 아래 이쪽에서 번쩍이어 하늘 아래 저쪽까지 비침같이 <strong>인자도 자기 날에 그러하리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/lk/17/#L23-24">눅 17:23-24</a>)</p></blockquote><blockquote><p>“그러면 사람들이 너희에게 말하되 <strong>보라 그리스도가 광야에 있다 하여도</strong> 나가지 말고 보라 골방에 있다 하여도 믿지 말라 <strong>번개가 동편에서 나서 서편까지 번쩍임 같이 인자의 임함도 그러하리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/24/#L26-27">마 24:26-27</a>)</p></blockquote><h3>모든 천사와 함께 오심</h3><p>그리스도의 재림은 아버지의 영광 가운데 그분의 모든 거룩한 자들과 함께 이루어질 것입니다.</p><blockquote><p>“그 산 골짜기는 아셀까지 이를지라 너희가 그 산 골짜기로 도망하되 유다 왕 웃시야 때에 지진을 피하여 도망하던 것 같이 하리라 <strong>나의 하나님 여호와께서 임하실 것이요 모든 거룩한 자들이 주와 함께 하리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/zah/14/#L5">슥 14:5</a>)</p></blockquote><blockquote><p>“<strong>인자가 자기 영광으로 모든 천사와 함께 올 때에</strong> 자기 영광의 보좌에 앉으리니” (<a href="https://bibleox.com/ko/ko-nkrv/mf/25/#L31">마 25:31</a>)</p></blockquote><blockquote><p>“누구든지 이 음란하고 죄 많은 세대에서 나와 내 말을 부끄러워하면 인자도 <strong>아버지의 영광으로 거룩한 천사들과 함께 올 때에</strong> 그 사람을 부끄러워하리라” (<a href="https://bibleox.com/ko/ko-nkrv/mk/8/#L38">막 8:38</a>)</p></blockquote><blockquote><p>“<strong>인자가 아버지의 영광으로 그 천사들과 함께 오리니</strong> 그 때에 각 사람이 행한 대로 갚으리라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/16/#L27">마 16:27</a>)</p></blockquote><blockquote><p>“아담의 칠대 손 에녹이 이 사람들에 대하여도 예언하여 이르되 보라 <strong>주께서 그 수만의 거룩한 자와 함께 임하셨나니</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/iud/1/#L14">유 1:14</a>)</p></blockquote><blockquote><p>“너희 마음을 굳건하게 하시고 <strong>우리 주 예수께서 그의 모든 성도와 함께 강림하실 때에</strong> 하나님 우리 아버지 앞에서 거룩함에 흠이 없게 하시기를 원하노라” (<a href="https://bibleox.com/ko/ko-nkrv/1sol/3/#L13">살전 3:13</a>)</p></blockquote><blockquote><p>“환난을 받는 너희에게는 우리와 함께 안식으로 갚으시는 것이 하나님의 공의시니 <strong>주 예수께서 자기의 능력의 천사들과 함께 하늘로부터 불꽃 가운데에 나타나실 때에</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2sol/1/#L7">살후 1:7</a>)</p></blockquote><h3>이미 가지신 장성한 몸으로 오심</h3><p>그리스도께서는 다시 사람에게서 태어나지 않으시고, 이미 가지신 몸, 곧 우리 기원 1년에 하느님의 어머니 동정녀 마리아에게서 나실 때 받으신 그 몸으로 오실 것입니다.</p><blockquote><p>“이 말씀을 마치시고 그들이 보는데 올려져 가시니 구름이 그를 가리어 보이지 않게 하더라 올라가실 때에 제자들이 자세히 하늘을 쳐다보고 있는데 흰 옷 입은 두 사람이 그들 곁에 서서 이르되 갈릴리 사람들아 어찌하여 서서 하늘을 쳐다보느냐 너희 가운데서 <strong>하늘로 올려지신 이 예수는 하늘로 가심을 본 그대로 오시리라</strong> 하였느니라” (<a href="https://bibleox.com/ko/ko-nkrv/act/1/#L9-11">행 1:9-11</a>)</p></blockquote><h3>심판하러 오심</h3><p>주님께서는 가르치러 오시는 것이 아니라, 처음 오셨을 때 이미 주신 말씀으로 심판하러 오실 것입니다.</p><blockquote><p>“나를 저버리고 내 말을 받지 아니하는 자를 심판할 이가 있으니 곧 <strong>내가 한 그 말이 마지막 날에 그를 심판하리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/in/12/#L48">요 12:48</a>)</p></blockquote><blockquote><p>“인자가 아버지의 영광으로 그 천사들과 함께 오리니 그 때에 <strong>각 사람이 행한 대로 갚으리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/16/#L27">마 16:27</a>)</p></blockquote><blockquote><p>“<strong>인자가 자기 영광으로</strong> 모든 천사와 함께 올 때에 <strong>자기 영광의 보좌에 앉으리니</strong> <strong>모든 민족을 그 앞에 모으고</strong> <strong>각각 구분하기를</strong> 목자가 양과 염소를 구분하는 것 같이 하여 양은 그 오른편에 염소는 왼편에 두리라 &lt;…&gt; <strong>그들은 영벌에, 의인들은 영생에 들어가리라</strong> 하시니라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/25/#L31-33,46">마 25:31-33,46</a>)</p></blockquote><blockquote><p>“이는 <strong>하나님의 공의로운 심판</strong>의 표요 너희로 하여금 하나님의 나라에 합당한 자로 여김을 받게 하려 함이니 그 나라를 위하여 너희가 또한 고난을 받느니라 너희로 환난을 받게 하는 자들에게는 환난으로 갚으시고 환난을 받는 너희에게는 우리와 함께 안식으로 갚으시는 것이 하나님의 공의시니 <strong>주 예수께서 자기의 능력의 천사들과 함께 하늘로부터 불꽃 가운데에 나타나실 때에</strong> 하나님을 모르는 자들과 우리 주 예수의 복음에 복종하지 않는 자들에게 <strong>형벌을 내리시리니</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2sol/1/#L5-8">살후 1:5-8</a>)</p></blockquote>'
