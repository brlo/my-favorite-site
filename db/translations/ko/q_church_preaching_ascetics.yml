  title: 믿는 사람으로 보이기를 부끄러워함
  copy_cover: true
  body: <h2>그리스도의 사람이라 불리기를 부끄러워함</h2><blockquote><p>“<strong>누구든지 이 음란하고 죄 많은 세대에서 나와 내 말을 부끄러워하면 인자도</strong> 아버지의 영광으로 거룩한 천사들과 함께 올 때에 <strong>그 사람을 부끄러워하리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mk/8/#L38">막 8:38</a>)</p></blockquote><blockquote><p>“<strong>누구든지 나와 내 말을 부끄러워하면 인자도</strong> 자기와 아버지와 거룩한 천사들의 영광으로 올 때에 <strong>그 사람을 부끄러워하리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/lk/9/#L26">눅 9:26</a>)</p></blockquote><blockquote><p>“그분의 자비 안에서 너희 영혼이 기뻐하고 <strong>그분을 찬양하는 일을 부끄러워하지 말라</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/prsir/51/#L29">집회 51:29</a>, 그리스어에서 번역)</p></blockquote><blockquote><p>“그러나 <strong>두려워하는 자들</strong>과 믿지 아니하는 자들과 흉악한 자들과 살인자들과 음행하는 자들과 점술가들과 우상 숭배자들과 거짓말하는 모든 자들은 불과 유황으로 타는 못에 던져지리니 이것이 둘째 사망이라” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/21/#L8">계 21:8</a>)</p></blockquote><h2>그리스도를 위한 고난</h2><p><a href="https://bibleox.com/ru/ru/w/страдание-за-Христа">그리스도를 위한 고난</a></p>
