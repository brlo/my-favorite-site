  title: 믿는 사람으로 보이기를 부끄러워함
  copy_cover: true
  body: <h2>그리스도의 사람이라 불리기를 부끄러워함</h2><blockquote><p>“절개 없고 죄 많은 이 세대에서 <strong>누구든지 나와 내 말을 부끄럽게 여기면 사람의 아들도</strong> 아버지의 영광에 싸여 거룩한 천사들을 거느리고 올 때에 <strong>그를 부끄럽게 여길 것이다</strong>.‘” (<a href="https://bibleox.com/ko/ko-ctb/mk/8/#L38">마르 8:38</a>)</p></blockquote><blockquote><p>“<strong>누구든지 나와 내 말을 부끄럽게 여기면 사람의 아들도</strong> 아버지의 영광에 싸여 거룩한 천사들을 거느리고 영광스럽게 올 때에 <strong>그를 부끄럽게 여길 것이다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/lk/9/#L26">루가 9:26</a>)</p></blockquote><blockquote><p>“그분의 자비 안에서 너희 영혼이 기뻐하고 <strong>그분을 찬양하는 일을 부끄러워하지 말라</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/prsir/51/#L29">집회 51:29</a>, 그리스어에서 번역)</p></blockquote><blockquote><p>“그러나 <strong>비겁한 자</strong>와 믿음이 없는 자와 흉측스러운 자와 살인자와 간음한 자와 마술장이와 우상숭배자와 모든 거짓말장이들이 차지할 곳은 불과 유황이 타오르는 바다 뿐이다. 이것이 둘째 사망이다.‘” (<a href="https://bibleox.com/ko/ko-ctb/otkr/21/#L8">묵시 21:8</a>)</p></blockquote><h2>그리스도를 위한 고난</h2><p><a href="https://bibleox.com/ru/ru/w/страдание-за-Христа">그리스도를 위한 고난</a></p>
