  copy_cover: true
  body: <blockquote><p>“그리스도의 말씀이 너희 속에 풍성히 거하여 모든 지혜로 피차 가르치며 권면하고 시와 찬송과 신령한 노래를 부르며 감사하는 마음으로 하나님을 찬양하고” (<a href="https://bibleox.com/ko/ko-nkrv/kol/3/#L16">골 3:16</a>)</p></blockquote><blockquote><p>“그러므로 피차 권면하고 서로 덕을 세우기를 너희가 하는 것 같이 하라” (<a href="https://bibleox.com/ko/ko-nkrv/1sol/5/#L11">살전 5:11</a>)</p></blockquote><blockquote><p>“오직 오늘이라 일컫는 동안에 매일 피차 권면하여 너희 중에 누구든지 죄의 유혹으로 완고하게 되지 않도록 하라” (<a href="https://bibleox.com/ko/ko-nkrv/evr/3/#L13">히 3:13</a>)</p></blockquote><blockquote><p>“서로 돌아보아 사랑과 선행을 격려하며” (<a href="https://bibleox.com/ko/ko-nkrv/evr/10/#L24">히 10:24</a>)</p></blockquote><blockquote><p>“모이기를 폐하는 어떤 사람들의 습관과 같이 하지 말고 오직 권하여 그 날이 가까움을 볼수록 더욱 그리하자” (<a href="https://bibleox.com/ko/ko-nkrv/evr/10/#L25">히 10:25</a>)</p></blockquote><blockquote><p>“주의 종은 마땅히 다투지 아니하고 모든 사람에 대하여 온유하며 가르치기를 잘하며 참으며 거역하는 자를 온유함으로 훈계할지니 혹 하나님이 그들에게 회개함을 주사 진리를 알게 하실까 하며” (<a href="https://bibleox.com/ko/ko-nkrv/2tim/2/#L24-25">딤후 2:24-25</a>)</p></blockquote>
