  title: 논쟁
  copy_cover: true
  body: <h2>논쟁의 성격</h2><h3>어린 양처럼</h3><blockquote><p>“떠나라. 이제 내가 <strong>너희를 보내는 것이 마치</strong> <strong><mark>어린 양을 이리떼 가운데 보내는 것과 같구나</mark></strong>. &lt;…&gt; 그러나 어떤 동네에 들어 갔을 때 사람들이 너희를 환영하지 않거든 길거리에 나가서 당신네 동네에서 묻은 발의 먼지를 당신들한테 털어 놓고 갑니다. 그러나 하느님 나라가 다가 왔다는 것만은 알아 두시오 하고 일러 주어라.” (<a href="https://bibleox.com/ko/ko-ctb/lk/10/#L3,10-11">루가 10:3,10-11</a>)</p></blockquote><blockquote><p>“‘이제 내가 너희를 보내는 것은 마치 <strong><mark>양을 이리떼 가운데 보내는 것과 같다</mark></strong>. 그러므로 너희는 <strong><mark>뱀같이 슬기롭고 비둘기같이 양순해야 한다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/mf/10/#L16">마태 10:16</a>)</p></blockquote><h3>온유와 사랑</h3><blockquote><p>“여러분의 마음 속에 그리스도를 주님으로 우러러 모시고 <strong><mark>여러분이 간직하고 있는 희망에 대해서 설명을 듣고 싶어하는 사람들에게는 언제라도 답변할 수 있도록 준비해 두십시오</mark></strong>. 그러나 답변을 할 때에는 부드러운 태도로 조심스럽게 해야 합니다. 여러분은 언제나 깨끗한 양심을 지니고 사십시오. 그러면 그리스도를 믿는 여러분의 착한 행실을 헐뜯던 자들이 바로 그 일로 부끄러움을 당하게 될 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/1pet/3/#L15-16">1베드 3:15-16</a>)</p></blockquote><blockquote><p>“통치자들과 지배자들에게 복종하고 순종하며 언제나 착한 일을 할 수 있는 백성이 되라고 교우들에게 깨우쳐 주시오. 그리고 <strong><mark>누구를 헐뜯거나 싸움질을 하지 말고 온순한 사람이 되어서 모든 사람을 언제나 온유하게 대하도록</mark></strong> 가르치시오.” (<a href="https://bibleox.com/ko/ko-ctb/tit/3/#L1-2">디도 3:1-2</a>)</p></blockquote><blockquote><p>“그대는 청춘의 욕정을 피하고 깨끗한 마음으로 주님을 찾는 사람들과 함께 정의와 믿음과 사랑과 평화를 힘써 구하시오. 어리석고 유치한 논쟁을 피하시오. 그대도 알다시피 그것은 싸움을 일으킬 뿐입니다. 주님의 종은 다투어서는 안 됩니다. 도리어 모든 사람을 온유하게 대하고 잘 가르치고 참을성이 있어야 합니다. 또 <strong><mark>반대자들을 부드러운 마음으로 바로잡아 주어야 합니다</mark></strong>. 그렇게 하면 하느님께서는 그들에게 회개할 기회를 주셔서 진리를 깨닫게 해 주실 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/2tim/2/#L22-25">2디모 2:22-25</a>)</p></blockquote><blockquote><p>“여러분 가운데 지혜롭고 지식이 있는 사람이 있다면 그 사람은 <strong><mark>지혜로운 사람답게 온유한 마음을 가지고 착한 생활을 함으로써</mark></strong> 그 증거를 보여 주도록 하십시오. 여러분은 마음 속에 <strong>고약한 시기심과 이기적인 야심을 품고 있으니 공연히 잘난 체하지 마십시오</strong>. 진리를 거슬러 거짓말을 해서는 안 되겠습니다.” (<a href="https://bibleox.com/ko/ko-ctb/iak/3/#L13-14">야고 3:13-14</a>)</p></blockquote><blockquote><p>“나 바울로는 <strong><mark>온유하시고 관대하신 그리스도의 이름으로 여러분에게 간청합니다</mark></strong>. 나는 여러분과 대면하고 있을 때에는 유순하지만 떨어져 있을 때에는 강경하다는 말을 듣습니다.” (<a href="https://bibleox.com/ko/ko-ctb/2kor/10/#L1">2고린 10:1</a>)</p></blockquote><blockquote><p>“주님을 위해서 일하다가 감옥에 갇힌 내가 <strong><mark>여러분에게 권고합니다</mark></strong>. 하느님께서 여러분을 불러 주셨으니 <strong><mark>그 불러 주신 목적에 합당하게 살아 가십시오. 겸손과 온유와 인내를 다하여</mark></strong> 사랑으로 서로 너그럽게 대하십시오.” (<a href="https://bibleox.com/ko/ko-ctb/ef/4/#L1-2">에페 4:1-2</a>)</p></blockquote><blockquote><p>“내가 그런 일을 금하는 목적은 <strong><mark>깨끗한 마음과 맑은 양심과 순수한 믿음에서 우러나오는 사랑을 불러 일으키자는 것입니다</mark></strong>. 그런데 어떤 사람들은 이 목적에서 벗어나 길을 잃고 쓸 데 없는 토론만 일삼고 있습니다. 그들은 율법교사로 자처하지만 사실은 자기들이 무엇을 말하는지 무엇을 주장하는지조차 알지 못하고 있습니다.” (<a href="https://bibleox.com/ko/ko-ctb/1tim/1/#L5-7">1디모 1:5-7</a>)</p></blockquote><blockquote><p>“<strong>내가 인간의 여러 언어를 말하고</strong> 천사의 말까지 한다 하더라도 사랑이 없으면 나는 울리는 징과 요란한 꽹과리와 다를 것이 없습니다. 내가 하느님의 말씀을 받아 전할 수 있다 하더라도 <strong><mark>온갖 신비를 환히 꿰뚫어 보고 모든 지식을 가졌다 하더라도 산을 옮길만한 완전한 믿음을 가졌다 하더라도 사랑이 없으면 나는 아무것도 아닙니다</mark></strong>. <strong><mark>내가 비록 모든 재산을 남에게 나누어 준다 하더라도 또 내가 남을 위하여 불 속에 뛰어 든다 하더라도 사랑이 없으면 모두 아무 소용이 없습니다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/13/#L1-3">1고린 13:1-3</a>)</p></blockquote><blockquote><p>“그러나 <strong><mark>위에서 내려 오는 지혜는 첫째 순결하고 다음은 평화롭고 점잖고 고분고분하고 자비와 착한 행실로 가득 차 있으며 편견과 위선이 없습니다</mark></strong>. 평화를 위해서 일하는 사람들은 평화를 심어서 정의의 열매를 거두어 들입니다.” (<a href="https://bibleox.com/ko/ko-ctb/iak/3/#L17-18">야고 3:17-18</a>)</p></blockquote><h2>어리석은 논쟁을 피하십시오</h2><blockquote><p>“그대는 청춘의 욕정을 피하고 깨끗한 마음으로 주님을 찾는 사람들과 함께 정의와 믿음과 사랑과 평화를 힘써 구하시오. <strong><mark>어리석고 유치한 논쟁을 피하시오</mark></strong>. 그대도 알다시피 <strong>그것은 싸움을 일으킬 뿐입니다</strong>. <strong>주님의 종은 다투어서는 안 됩니다</strong>. 도리어 모든 사람을 온유하게 대하고 잘 가르치고 참을성이 있어야 합니다. 또 반대자들을 부드러운 마음으로 바로잡아 주어야 합니다. 그렇게 하면 하느님께서는 그들에게 회개할 기회를 주셔서 진리를 깨닫게 해 주실 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/2tim/2/#L22-25">2디모 2:22-25</a>)</p></blockquote><blockquote><p>“다른 교리를 가르치거나 우리 주 예수 그리스도의 건전한 말씀을 받아 들이지 않거나 경건한 생활 원칙을 따르지 않는 사람은 잔뜩 교만해져서 아무 것도 모르면서도 <strong><mark>쓸데 없는 질문과 토론에만 미친듯이 열중합니다. 그런 데서 시기와 다툼과 비방과 못된 의심과</mark></strong>” (<a href="https://bibleox.com/ko/ko-ctb/1tim/6/#L3-4">1디모 6:3-4</a>)</p></blockquote><blockquote><p>“다음과 같은 것을 신도들에게 깨우쳐 주시오. <strong><mark>말을 가지고 논쟁을 벌이지 말라고</mark></strong> 하느님 앞에서 엄숙히 명령하시오. 그것은 <strong>아무런 이익이 없을뿐 아니라 듣는 사람들을 파멸에 이르게 합니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/2tim/2/#L14">2디모 2:14</a>)</p></blockquote><blockquote><p>“<strong><mark>어리석은 논쟁은 피하고 족보를 캐거나 말다툼을 하거나 율법을 가지고 싸우거나 하는 일을 멀리하시오. 이와 같은 일은 헛된 일이며 이로울 것이 없습니다</mark></strong>. <strong><mark>이단자는 한두 번 경고해 보고 그래도 말을 듣지 않거든 그와 관계를 끊으시오</mark></strong>. 그대도 알다시피 이런 사람은 옳은 길을 이미 벗어나서 죄를 짓고 있으며 스스로를 단죄하고 있는 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/tit/3/#L9-11">디도 3:9-11</a>)</p></blockquote>
