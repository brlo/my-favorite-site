  title: 논쟁
  copy_cover: true
  body: <h2>논쟁의 성격</h2><h3>어린 양처럼</h3><blockquote><p>“갈지어다 <strong>내가 너희를 보냄이</strong> <strong><mark>어린 양을 이리 가운데로 보냄과 같도다</mark></strong> &lt;…&gt; 어느 동네에 들어가든지 너희를 영접하지 아니하거든 그 거리로 나와서 말하되 너희 동네에서 우리 발에 묻은 먼지도 너희에게 떨어버리노라 그러나 하나님의 나라가 가까이 온 줄을 알라 하라” (<a href="https://bibleox.com/ko/ko-nkrv/lk/10/#L3,10-11">눅 10:3,10-11</a>)</p></blockquote><blockquote><p>“보라 내가 너희를 보냄이 <strong><mark>양을 이리 가운데로 보냄과 같도다</mark></strong> 그러므로 너희는 <strong><mark>뱀 같이 지혜롭고 비둘기 같이 순결하라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/10/#L16">마 10:16</a>)</p></blockquote><h3>온유와 사랑</h3><blockquote><p>“너희 마음에 그리스도를 주로 삼아 거룩하게 하고 <strong><mark>너희 속에 있는 소망에 관한 이유를 묻는 자에게는 대답할 것을 항상 준비하되</mark></strong> 온유와 두려움으로 하고 선한 양심을 가지라 이는 그리스도 안에 있는 너희의 선행을 욕하는 자들로 그 비방하는 일에 부끄러움을 당하게 하려 함이라” (<a href="https://bibleox.com/ko/ko-nkrv/1pet/3/#L15-16">벧전 3:15-16</a>)</p></blockquote><blockquote><p>“너는 그들로 하여금 통치자들과 권세 잡은 자들에게 복종하며 순종하며 모든 선한 일 행하기를 준비하게 하며 <strong><mark>아무도 비방하지 말며 다투지 말며 관용하며 범사에 온유함을 모든 사람에게 나타낼 것을</mark></strong> 기억하게 하라” (<a href="https://bibleox.com/ko/ko-nkrv/tit/3/#L1-2">딛 3:1-2</a>)</p></blockquote><blockquote><p>“또한 너는 청년의 정욕을 피하고 주를 깨끗한 마음으로 부르는 자들과 함께 의와 믿음과 사랑과 화평을 따르라 어리석고 무식한 변론을 버리라 이에서 다툼이 나는 줄 앎이라 주의 종은 마땅히 다투지 아니하고 모든 사람에 대하여 온유하며 가르치기를 잘하며 참으며 <strong><mark>거역하는 자를 온유함으로 훈계할지니</mark></strong> 혹 하나님이 그들에게 회개함을 주사 진리를 알게 하실까 하며” (<a href="https://bibleox.com/ko/ko-nkrv/2tim/2/#L22-25">딤후 2:22-25</a>)</p></blockquote><blockquote><p>“너희 중에 지혜와 총명이 있는 자가 누구냐 그는 <strong><mark>선행으로 말미암아 지혜의 온유함으로 그 행함을 보일지니라</mark></strong> 그러나 <strong>너희 마음 속에 독한 시기와 다툼이 있으면 자랑하지 말라</strong> 진리를 거슬러 거짓말하지 말라” (<a href="https://bibleox.com/ko/ko-nkrv/iak/3/#L13-14">약 3:13-14</a>)</p></blockquote><blockquote><p>“너희를 대면하면 유순하고 떠나 있으면 너희에 대하여 담대한 나 바울은 이제 <strong><mark>그리스도의 온유와 관용으로 친히 너희를 권하고</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2kor/10/#L1">고후 10:1</a>)</p></blockquote><blockquote><p>“그러므로 주 안에서 갇힌 내가 <strong><mark>너희를 권하노니</mark></strong> <strong><mark>너희가 부르심을 받은 일에 합당하게 행하여 모든 겸손과 온유로 하고 오래 참음으로</mark></strong> 사랑 가운데서 서로 용납하고” (<a href="https://bibleox.com/ko/ko-nkrv/ef/4/#L1-2">엡 4:1-2</a>)</p></blockquote><blockquote><p>“이 교훈의 목적은 <strong><mark>청결한 마음과 선한 양심과 거짓이 없는 믿음에서 나오는 사랑이거늘</mark></strong> 사람들이 이에서 벗어나 헛된 말에 빠져 율법의 선생이 되려 하나 자기가 말하는 것이나 자기가 확증하는 것도 깨닫지 못하는도다” (<a href="https://bibleox.com/ko/ko-nkrv/1tim/1/#L5-7">딤전 1:5-7</a>)</p></blockquote><blockquote><p>“<strong>내가 사람의 방언과 천사의 말을 할지라도</strong> 사랑이 없으면 소리 나는 구리와 울리는 꽹과리가 되고 내가 예언하는 능력이 있어 <strong><mark>모든 비밀과 모든 지식을 알고 또 산을 옮길 만한 모든 믿음이 있을지라도 사랑이 없으면 내가 아무 것도 아니요</mark></strong> <strong><mark>내가 내게 있는 모든 것으로 구제하고 또 내 몸을 불사르게 내줄지라도 사랑이 없으면 내게 아무 유익이 없느니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/13/#L1-3">고전 13:1-3</a>)</p></blockquote><blockquote><p>“오직 <strong><mark>위로부터 난 지혜는 첫째 성결하고 다음에 화평하고 관용하고 양순하며 긍휼과 선한 열매가 가득하고 편견과 거짓이 없나니</mark></strong> 화평하게 하는 자들은 화평으로 심어 의의 열매를 거두느니라” (<a href="https://bibleox.com/ko/ko-nkrv/iak/3/#L17-18">약 3:17-18</a>)</p></blockquote><h2>어리석은 논쟁을 피하십시오</h2><blockquote><p>“또한 너는 청년의 정욕을 피하고 주를 깨끗한 마음으로 부르는 자들과 함께 의와 믿음과 사랑과 화평을 따르라 <strong><mark>어리석고 무식한 변론을 버리라</mark></strong> <strong>이에서 다툼이 나는 줄 앎이라</strong> <strong>주의 종은 마땅히 다투지 아니하고</strong> 모든 사람에 대하여 온유하며 가르치기를 잘하며 참으며 거역하는 자를 온유함으로 훈계할지니 혹 하나님이 그들에게 회개함을 주사 진리를 알게 하실까 하며” (<a href="https://bibleox.com/ko/ko-nkrv/2tim/2/#L22-25">딤후 2:22-25</a>)</p></blockquote><blockquote><p>“누구든지 다른 교훈을 하며 바른 말 곧 우리 주 예수 그리스도의 말씀과 경건에 관한 교훈을 따르지 아니하면 그는 교만하여 아무 것도 알지 못하고 <strong><mark>변론과 언쟁을 좋아하는 자니 이로써 투기와 분쟁과 비방과 악한 생각이 나며</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1tim/6/#L3-4">딤전 6:3-4</a>)</p></blockquote><blockquote><p>“너는 그들로 이 일을 기억하게 하여 <strong><mark>말다툼을 하지 말라고</mark></strong> 하나님 앞에서 엄히 명하라 이는 <strong>유익이 하나도 없고 도리어 듣는 자들을 망하게 함이라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2tim/2/#L14">딤후 2:14</a>)</p></blockquote><blockquote><p>“그러나 <strong><mark>어리석은 변론과 족보 이야기와 분쟁과 율법에 대한 다툼은 피하라 이것은 무익한 것이요 헛된 것이니라</mark></strong> <strong><mark>이단에 속한 사람을 한두 번 훈계한 후에 멀리하라</mark></strong> 이러한 사람은 네가 아는 바와 같이 부패하여 스스로 정죄한 자로서 죄를 짓느니라” (<a href="https://bibleox.com/ko/ko-nkrv/tit/3/#L9-11">딛 3:9-11</a>)</p></blockquote>
