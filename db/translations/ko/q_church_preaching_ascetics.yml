  copy_cover: true
  body: <blockquote><p>“그리스도의 말씀이 풍부한 생명력으로 여러분 안에 살아 있기에 빕니다. 여러분은 모든 지혜를 다하여 서로 가르치고 충고하십시오. 그리고 성시와 찬송가와 영가를 부르며 감사에 넘치는 진정한 마음으로 하느님을 찬양하십시오.” (<a href="https://bibleox.com/ko/ko-ctb/kol/3/#L16">골로 3:16</a>)</p></blockquote><blockquote><p>“그러므로 여러분은 이미 하고 있는 그대로 서로 격려하고 서로 도와 주십시오.” (<a href="https://bibleox.com/ko/ko-ctb/1sol/5/#L11">1데살 5:11</a>)</p></blockquote><blockquote><p>“성서에 ‘오늘’이라고 한 말은 우리에게도 해당하는 말이니 날마다 서로 격려해서 아무도 죄의 속임수에 넘어 가 고집부리는 일이 없도록 하십시오.” (<a href="https://bibleox.com/ko/ko-ctb/evr/3/#L13">히브 3:13</a>)</p></blockquote><blockquote><p>“서로 격려해서 사랑과 좋은 일을 하도록 마음을 씁시다.” (<a href="https://bibleox.com/ko/ko-ctb/evr/10/#L24">히브 10:24</a>)</p></blockquote><blockquote><p>“그리고 어떤 사람들처럼 같이 모이는 일을 폐지하지 말고 서로 격려해서 자주 모입시다. 더구나 그 날이 가까와 오는 것을 아는 이상 더욱 열심히 모이도록 합시다.” (<a href="https://bibleox.com/ko/ko-ctb/evr/10/#L25">히브 10:25</a>)</p></blockquote><blockquote><p>“주님의 종은 다투어서는 안 됩니다. 도리어 모든 사람을 온유하게 대하고 잘 가르치고 참을성이 있어야 합니다. 또 반대자들을 부드러운 마음으로 바로잡아 주어야 합니다. 그렇게 하면 하느님께서는 그들에게 회개할 기회를 주셔서 진리를 깨닫게 해 주실 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/2tim/2/#L24-25">2디모 2:24-25</a>)</p></blockquote>
