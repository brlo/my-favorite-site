- src: искушения
  path: Tm18p_시련과_유혹
  title: 시련과 유혹
  copy_cover: true
  body: <h2>믿는 사람은 시련을 준비해야 합니다</h2><blockquote><p>“<strong>얘야, 주님을 섬기러 나아가거든 네 영혼을 시련에 대비시켜라.</strong> 네 마음을 바로잡고 꿋꿋이 견디며 재난의 때에 서두르지 말라. 그분께 매달려 떠나지 말라. 그러면 네 마지막 날에 번성할 것이다. 네게 닥치는 모든 것을 받아들이고 <strong>굴욕의 변화 속에서도 오래 참아라. 금은 불 속에서 단련되기</strong> 때문이다” (<a href="https://bibleox.com/ko/gr-lxx-byz/prsir/2/#L1-5">집회 2:1-5</a>, 그리스어에서 번역)</p></blockquote><h2>시련은 유익합니다</h2><blockquote><p>“<strong>많은 사람이 연단을 받아 스스로 정결하게 하며 희게 할 것이나</strong> 악한 사람은 악을 행하리니 악한 자는 아무것도 깨닫지 못하되 오직 지혜 있는 자는 깨달으리라” (<a href="https://bibleox.com/ko/ko-nkrv/dan/12/#L10">단 12:10</a>)</p></blockquote><blockquote><p>“네 영혼을 <strong>시련에 대비시켜라</strong>. … 그러면 <strong>네 마지막 날에 번성할 것이다</strong>. <strong>네게 닥치는 모든 것을 받아들이라</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/prsir/2/#L1-5">집회 2:1-5</a>, 그리스어에서 번역)</p></blockquote><blockquote><p>“<strong>내 형제들아 너희가 여러 가지 시험을 당하거든 온전히 기쁘게 여기라</strong> 이는 너희 믿음의 시련이 인내를 만들어 내는 줄 너희가 앎이라 인내를 온전히 이루라 이는 너희로 온전하고 구비하여 조금도 부족함이 없게 하려 함이라” (<a href="https://bibleox.com/ko/ko-nkrv/iak/1/#L2-4">약 1:2-4</a>)</p></blockquote><blockquote><p>“<strong>시험을 참는 자는 복이 있나니</strong> 이는 시련을 견디어 낸 자가 주께서 자기를 사랑하는 자들에게 약속하신 생명의 면류관을 얻을 것이기 때문이라” (<a href="https://bibleox.com/ko/ko-nkrv/iak/1/#L12">약 1:12</a>)</p></blockquote><blockquote><p>“그러므로 너희가 이제 <strong>여러 가지 시험으로 말미암아</strong> 잠깐 근심하게 되지 않을 수 없으나 <strong>오히려 크게 기뻐하는도다</strong> 너희 믿음의 확실함은 불로 연단하여도 없어질 금보다 더 귀하여 예수 그리스도께서 나타나실 때에 칭찬과 영광과 존귀를 얻게 할 것이니라” (<a href="https://bibleox.com/ko/ko-nkrv/1pet/1/#L6-7">벧전 1:6-7</a>)</p></blockquote><blockquote><p>“사랑하는 자들아 <strong>너희를 연단하려고 오는 불 시험을</strong> 이상한 일 당하는 것 같이 이상히 여기지 말고 오히려 너희가 그리스도의 고난에 참여하는 것으로 즐거워하라 이는 그의 영광을 나타내실 때에 너희로 즐거워하고 기뻐하게 하려 함이라” (<a href="https://bibleox.com/ko/ko-nkrv/1pet/4/#L12-13">벧전 4:12-13</a>)</p></blockquote><h2>하느님께서는 힘에 겨운 시련을 허락하지 않으시고 힘을 주십니다</h2><blockquote><p>“사람이 감당할 시험 밖에는 너희가 당한 것이 없나니 오직 하나님은 미쁘사 너희가 <strong>감당하지 못할 시험 당함을 허락하지 아니하시고</strong> 시험 당할 즈음에 또한 <strong>피할 길을 내사 너희로 능히 감당하게 하시느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/10/#L13">고전 10:13</a>)</p></blockquote><blockquote><p>“<strong>주께서 경건한 자는 시험에서 건지실 줄 아시고</strong> 불의한 자는 형벌 아래에 두어 심판 날까지 지키시며” (<a href="https://bibleox.com/ko/ko-nkrv/2pet/2/#L9">벧후 2:9</a>)</p></blockquote><h2>시련을 이기는 법</h2><p>영적인 깨어 있음과 기도가 필요합니다:</p><blockquote><p>“시험에 들지 않게 <strong>깨어 기도하라</strong> 마음에는 원이로되 육신이 약하도다 하시고” (<a href="https://bibleox.com/ko/ko-nkrv/mf/26/#L41">마 26:41</a>; <a href="https://bibleox.com/ko/ko-nkrv/mk/14/#L38">막 14:38</a>; <a href="https://bibleox.com/ko/ko-nkrv/lk/22/#L40">눅 22:40</a>; <a href="https://bibleox.com/ko/ko-nkrv/lk/22/#L46">눅 22:46</a>)</p></blockquote><h2>유혹에 빠짐</h2><blockquote><p>“<strong>부하려 하는 자들은 시험과 올무와</strong> 여러 가지 어리석고 해로운 욕심에 떨어지나니 곧 사람으로 파멸과 멸망에 빠지게 하는 것이라” (<a href="https://bibleox.com/ko/ko-nkrv/1tim/6/#L9">딤전 6:9</a>)</p></blockquote>
  meta_desc: 시련과 유혹에 관한 성경 구절
