- src: мирный-дух
  path: Pc30s_평화로운_영
  title: 평화로운 영
  copy_cover: true
  body: <h2>하느님의 안식</h2><blockquote><p>“이렇게 하느님께서는 모든 것을 새로 지으시고 <strong>이렛날에는 쉬시고</strong> 이 날을 거룩한 날로 정하시어 복을 주셨다.” (<a href="https://bibleox.com/ko/ko-ctb/gen/2/#L3">창 2:3</a>)</p></blockquote><blockquote><p>“그러나 예수께서는 그들에게 ‘<strong>내 아버지께서 언제나 일하고 계시니 나도 일하는 것이다</strong>’하고 말씀하셨다.” (<a href="https://bibleox.com/ko/ko-ctb/in/5/#L17">요한 5:17</a>)</p></blockquote><blockquote><p>“이것은 하느님께서 ‘내가 노하여 맹세한 대로 <strong>그들은 결코 나의 안식처에 들어 오지 못하리라</strong>’고 말씀하신 대로입니다. 그러나 <strong>우리는 믿었기 때문에 그 안식처에 들어 가게 될 것입니다</strong>. 사실 하느님께서도 세상을 창조하셨을 때에 일을 다 마치시고 쉬셨습니다.” (<a href="https://bibleox.com/ko/ko-ctb/evr/4/#L3">히브 4:3</a>; <a href="https://bibleox.com/ko/ko-ctb/ps/95/#L11">시편 95:11</a>; <a href="https://bibleox.com/ko/ko-ctb/evr/3/#L11">히브 3:11</a>)</p></blockquote><h2>하느님의 평화</h2><blockquote><p>“‘<strong><mark>나는 너희에게 평화를 주고 간다. 내 평화를 너희에게 주는 것이다. 내가 주는 평화는 세상이 주는 평화와는 다르다. 걱정하거나 두려워하지 말라</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/in/14/#L27">요한 14:27</a>)</p></blockquote><blockquote><p>“나는 마음이 온유하고 겸손하니 <strong>내 멍에를 메고 나에게 배워라</strong>. 그러면 <strong><mark>너희의 영혼이 안식을 얻을 것이다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/mf/11/#L29">마태 11:29</a>)</p></blockquote><blockquote><p>“그러면 <strong><mark>사람으로서는 감히 생각할 수도 없는 하느님의 평화가</mark></strong> 그리스도 예수를 믿는 <strong><mark>여러분의 마음과 생각을 지켜 주실 것입니다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/fil/4/#L7">필립 4:7</a>)</p></blockquote><blockquote><p>“하느님께서 당신의 일을 마치고 쉬신 것처럼 <strong>하느님의 안식처에 들어 간 이도 그의 일손을 멈추고 쉬는 것입니다</strong>. 그러니 우리도 <strong><mark>그 안식을 누리도록 힘써야겠습니다</mark></strong>. 옛사람들처럼 순종하지 않다가 낭패를 보아서야 되겠습니까?” (<a href="https://bibleox.com/ko/ko-ctb/evr/4/#L10-11">히브 4:10-11</a>)</p></blockquote><blockquote><p>“야훼께서 너희를 위하여 싸워 주실 터이니 <strong>모두들 진정하여라</strong>.‘” (<a href="https://bibleox.com/ko/ko-ctb/ish/14/#L14">출 14:14</a>)</p></blockquote><blockquote><p>“야훼께서 대답하셨다. ‘내가 친히 너를 데리고 가서 <strong>너를 편하게 하리라</strong>.’” (<a href="https://bibleox.com/ko/ko-ctb/ish/33/#L14">출 33:14</a>)</p></blockquote><blockquote><p>“내 백성 이스라엘은 <strong>내가 마련해 준 이 땅에 정착하고 걱정없이 살게 되었다</strong>. 다시는 전처럼 악한 무리에게 억눌려 고생하는 일이 없으리라.” (<a href="https://bibleox.com/ko/ko-ctb/1par/17/#L9">역상 17:9</a>)</p></blockquote><blockquote><p>“나는 울화가 터져 맹세하였다. ‘이들은 <strong>내 안식</strong>에 들지 못하리라.’” (<a href="https://bibleox.com/ko/ko-ctb/ps/95/#L11">시편 95:11</a>)</p></blockquote>
