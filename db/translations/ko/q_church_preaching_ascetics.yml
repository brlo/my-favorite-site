- src: мало-проповедников
  path: Fp10r_적은_설교자
  title: 적은 설교자
  copy_cover: true
  body: <blockquote><p>“너희가 만일 내가 정해 준 규정들을 따르고, 내가 지시한 계명들을 지켜 그대로 하면 &lt;…&gt; 너희 원수들은 너희에게 쫓기다가 너희의 칼에 맞아 쓰러지리라. 너희는 다섯 명이 원수 백 명을 추격하고, 백 명이 원수 만 명을 추격할 수 있을 것이다. 너희 원수들은 너희의 칼에 맞아 쓰러지리라. 나는 너희를 부드러운 얼굴로 굽어 보며 너희 자손을 일으키고 너희를 불어나게 하여 내가 너희와 맺은 계약을 이루리라.” (<a href="https://bibleox.com/ko/ko-ctb/lev/26/#L3,7-9">레 26:3,7-9</a>)</p></blockquote><blockquote><p>“이렇게 분부하셨다. ‘추수할 것은 많은데 일꾼이 적으니 주인에게 추수할 일꾼들을 보내 달라고 청하여라.” (<a href="https://bibleox.com/ko/ko-ctb/lk/10/#L2">루가 10:2</a>)</p></blockquote><blockquote><p>“제자들에게 이렇게 말씀하셨다. ‘추수할 것은 많은데 일꾼이 적으니 그 주인에게 추수할 일꾼들을 보내 달라고 청하여라.’” (<a href="https://bibleox.com/ko/ko-ctb/mf/9/#L37-38">마태 9:37-38</a>)</p></blockquote>
  meta_desc: 설교자에 관한 성경 구절
