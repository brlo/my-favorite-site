  title: 사도들은 공동체를 오래 가르쳤습니다
  copy_cover: true
  body: <p>사도 바울은 아시아의 장로들을 3년 동안 가르쳤습니다:</p><blockquote><p>“그러므로 여러분이 일깨어 내가 <strong>삼 년이나 밤낮 쉬지 않고 눈물로 각 사람을 훈계하던</strong> 것을 기억하라” (<a href="https://bibleox.com/ko/ko-nkrv/act/20/#L31">행 20:31</a>)</p></blockquote><p>사도 바울은 에베소의 그리스도인들을 2년 3개월 동안 가르쳤습니다:</p><blockquote><p>“바울이 회당에 들어가 석 달 동안 담대히 하나님 나라에 관하여 강론하며 권면하되 어떤 사람들은 마음이 굳어 순종하지 않고 무리 앞에서 이 도를 비방하거늘 바울이 그들을 떠나 제자들을 따로 세우고 두란노 서원에서 날마다 강론하니라 <strong>두 해 동안</strong> 이같이 하니 아시아에 사는 자는 유대인이나 헬라인이나 다 주의 말씀을 듣더라” (<a href="https://bibleox.com/ko/ko-nkrv/act/19/#L8-10">행 19:8-10</a>)</p></blockquote>
