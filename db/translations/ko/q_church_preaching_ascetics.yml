- src: пост
  path: Fs19t_단식
  title: 단식
  copy_cover: true
  body: '<p>수덕 생활 전반에 관하여:</p><blockquote><p>“<strong>경기에 나서는 사람들은 온갖 어려움을 이겨 내야 합니다</strong>. 그들은 썩어 없어질 <strong>월계관</strong>을 얻으려고 그렇게 애쓰지만 <strong>우리는 불멸의 월계관을 얻으려고 애쓰는 것입니다</strong>. 그러므로 나는 달음질을 하되 목표없이 달리지 않고 권투를 하되 허공을 치지 않습니다. <strong>나는 내 몸을 사정없이 단련하여</strong> 언제나 민첩하게 움직일 수 있게 합니다. 이것은 내가 남들에게서 이기자고 외쳐 놓고 나 자신이 <strong>실격자가 되지 않게</strong> 하려는 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/9/#L25-27">1고린 9:25-27</a>)</p></blockquote><p>하느님께서는 단식하며 당신께 돌아오라고 부르십니다:</p><blockquote><p>“그러나 이제라도, 야훼의 말이다, 진심으로 뉘우쳐 <strong>나에게 돌아 오라. 단식하며</strong> 가슴을 치고 울어라.‘” (<a href="https://bibleox.com/ko/ko-ctb/iol/2/#L12">요엘 2:12</a>)</p></blockquote><p>주 예수 그리스도께서는 단식으로 복음 선포를 시작하셨습니다:</p><blockquote><p>“<strong>사십 주야를 단식하시고</strong> 나서 몹시 시장하셨을 때에” (<a href="https://bibleox.com/ko/ko-ctb/mf/4/#L2">마태 4:2</a>)</p></blockquote><p>주님께서는 올바르게 단식하는 법을 가르치셨습니다:</p><blockquote><p>“‘너희는 <strong>단식할 때에</strong> 위선자들처럼 침통한 얼굴을 하지 말아라. 그들은 단식한다는 것을 남에게 보이려고 얼굴에 그 기색을 하고 다닌다. 나는 분명히 말한다. 그들은 이미 받을 상을 다 받았다.” (<a href="https://bibleox.com/ko/ko-ctb/mf/6/#L16">마태 6:16</a>)</p></blockquote><blockquote><p>“<strong>단식할 때에는</strong> 얼굴을 씻고 머리에 기름을 발라라.” (<a href="https://bibleox.com/ko/ko-ctb/mf/6/#L17">마태 6:17</a>)</p></blockquote><p>예언자 요한의 제자들은 단식했습니다:</p><blockquote><p>“그 때에 요한의 제자들이 예수께 와서 ‘<strong>우리와 바리사이파 사람들은 자주 단식하는데</strong> 선생님의 제자들은 왜 단식하지 않습니까?’ 하고 묻자” (<a href="https://bibleox.com/ko/ko-ctb/mf/9/#L14">마태 9:14</a>; <a href="https://bibleox.com/ko/ko-ctb/mk/2/#L18">마르 2:18</a>)</p></blockquote><p>그리스도의 제자들은 그리스도께서 십자가에 못박히신 뒤에 단식할 것입니다:</p><blockquote><p>“예수께서 이렇게 대답하셨다. ‘잔치에 온 신랑의 친구들이 신랑과 함께 있을 동안에야 어떻게 슬퍼할 수 있겠느냐? 그러나 곧 신랑을 빼앗길 날이 올 터인데 그 때에 가서는 <strong>그들도 단식할 것이다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/mf/9/#L15">마태 9:15</a>; <a href="https://bibleox.com/ko/ko-ctb/mk/2/#L20">마르 2:20</a>; <a href="https://bibleox.com/ko/ko-ctb/lk/5/#L35">루가 5:35</a>)</p></blockquote><p>어떤 악령은 단식 없이는 사람에게서 쫓아낼 수 없습니다:</p><blockquote><p>“예수께서는 ‘<strong>기도하지 않고서는</strong> 그런 것을 쫓아 낼 수 없다’하고 대답하셨다.” (<a href="https://bibleox.com/ko/ko-ctb/mk/9/#L29">마르 9:29</a>) <em>(비잔틴 본문(다수 사본)에는 “기도와 <strong>단식</strong>”으로 되어 있고, 마태 17:21에도 같은 말씀이 있습니다.)</em></p></blockquote><p>주님의 성전에서 한 과부는 밤낮으로 기도와 단식으로 하느님을 섬겼습니다:</p><blockquote><p>“과부가 되어 여든 네 살이 되도록 성전을 떠나지 않고 <strong>밤낮없이 단식과 기도로써 하느님을 섬겨 왔다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/lk/2/#L37">루가 2:37</a>)</p></blockquote><p>백인대장에게 천사가 파견된 것은 단식 중이었습니다:</p><blockquote><p>“고르넬리오는 이렇게 대답하였다. ‘나흘 전 이맘 때쯤 나는 집에서 <strong>오후 세 시의 기도를 드리고 있었습니다</strong>. 그때 갑자기 눈부신 옷을 입은 사람이 앞에 나타나” (<a href="https://bibleox.com/ko/ko-ctb/act/10/#L30">사도 10:30</a>) <em>(비잔틴 본문(다수 사본): “나는 <strong>단식하고</strong> 있었고 … 기도하고 있었습니다.”)</em></p></blockquote><p>성령께서는 단식 중에 첫 그리스도인들에게 말씀하셨습니다:</p><blockquote><p>“그들이 <strong>단식을 하며 주님께 예배드리고 있을 때에</strong> 성령께서 ‘바르나바와 사울을 따로 세워라. 내가 그들에게 맡기기로 정해 놓은 일이 있다’하고 말씀하셨다.” (<a href="https://bibleox.com/ko/ko-ctb/act/13/#L2">사도 13:2</a>)</p></blockquote><p>첫 그리스도인들은 모든 중요한 일에서 기도에 단식을 더했습니다:</p><blockquote><p>“그리고 각 교회에서 신도들을 위하여 원로들을 뽑아 세우고 <strong>단식하며 기도한 뒤에</strong> 그들이 믿는 주님께 원로들을 보호해 주시기를 빌고 떠났다.” (<a href="https://bibleox.com/ko/ko-ctb/act/14/#L23">사도 14:23</a>)</p></blockquote><p>부부는 단식을 위해 잠시 서로 떨어져 있을 수 있습니다:</p><blockquote><p>“서로 상대방의 요구를 거절하지 마십시오. 다만 <strong>기도에 전념하기 위해서</strong> 서로 합의하여 얼마 동안 떨어져 있는 것은 무방합니다. 그러나 자제하는 힘이 없어서 사탄의 유혹에 빠질지도 모르니 그 기간이 끝나면 다시 정상적인 관계로 돌아 가야 합니다.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/7/#L5">1고린 7:5</a>) <em>(비잔틴 본문(다수 사본): “<strong>단식과</strong> 기도에”)</em></p></blockquote><p>사도들은 단식으로 자신이 하느님의 일꾼임을 보여 줍니다:</p><blockquote><p>“우리는 무슨 일에나 하느님의 일꾼으로서 일할 따름입니다. 그래서 우리는 환난과 궁핍과 역경도 잘 참아냈고 매질과 옥살이와 폭동을 잘 겪어 냈으며 심한 노동을 하고 잠을 못 자고 <strong>굶주리면서도</strong> 그 고통을 잘 견디어 냈습니다. 우리는 순결과 지식과 끈기와 착한 마음을 가지고 성령의 도우심과 꾸밈없는 사랑과” (<a href="https://bibleox.com/ko/ko-ctb/2kor/6/#L4-6">2고린 6:4-6</a>) <em>(그리스어: ἐν νηστείαις, “단식으로”)</em></p></blockquote><p>사도는 어쩔 수 없이 자랑하는 자신을 나무라면서(<a href="https://bibleox.com/ko/ko-ctb/2kor/11/#L21">2고린 11:21</a>) 단식을 자랑합니다:</p><blockquote><p>“그리고 노동과 고역에 시달렸고 수없는 밤을 뜬 눈으로 새웠고 주리고 목말랐으며 <strong>여러 번 굶고</strong> 추위에 떨며 헐벗은 일도 있었습니다.” (<a href="https://bibleox.com/ko/ko-ctb/2kor/11/#L27">2고린 11:27</a>) <em>(그리스어: ἐν νηστείαις, “자주 단식하며”)</em></p></blockquote><p>사도는 디모테오 주교에게 건강이 나쁘니 단식을 늦추어도 된다고 합니다:</p><blockquote><p>“<strong>이제는 물만 마시지 말고</strong> 위장을 위해서나 자주 앓는 그대의 병을 위해서 포도주를 좀 마시도록 하시오.” (<a href="https://bibleox.com/ko/ko-ctb/1tim/5/#L23">1디모 5:23</a>)</p></blockquote><p>선한 일 = 기도 + 단식 + 자선 + 의로움:</p><blockquote><p>“<strong>기도는 단식</strong>과 자선과 의로움과 함께할 때 <strong>좋다</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/tov/12/#L8">토비 12:8</a>, 그리스어에서 번역)</p></blockquote><p>왕이자 예언자인 다윗은 재난의 때에 단식으로 하느님 앞에 자신을 낮추었습니다:</p><blockquote><p>“그들이 병들었을 때 나는 자루옷 걸치고 <strong>심신이 다 닳도록 재계를 하며</strong> 기도에 또 기도를 거듭거듭 올렸고” (<a href="https://bibleox.com/ko/ko-ctb/ps/35/#L13">시편 35:13</a>) <em>(히브리어: “단식으로 내 영혼을 괴롭혔다”)</em></p></blockquote>'
