  references: "<p>번역: 로디온 블라소프 (AI 도구 활용). 저본: 러시아어 원문. 참고: 영어·일본어 번역. 성경 인용과 링크는 공동번역 성서에 따름.</p>"
- src: монашество
  path: Mn24s_수도_생활
  title: 수도 생활
  copy_cover: true
  body: <h2>수도 생활에 관한 성경 말씀</h2><h3>하느님 마음에 드는 것을 택하는 고자들</h3><p>하느님께서는 혼인하지 않고 하느님의 법을 지키는 데 특별히 마음을 쓰는 이들을 특별히 구별하십니다. 그들은 다른 “아들 딸”보다 높아진 것과 같습니다:</p><blockquote><p>“야훼께서 말씀하신다. ‘<strong><mark>고자라도</mark></strong> 나의 안식일을 지키고 나의 뜻에 맞는 일만 하고 <strong><mark>나의 계약을 굳게 지키면</mark></strong>, 나의 집, 나의 울 안에 그들의 송덕비를 세워 주리라. <strong><mark>어떤 아들 딸이 그보다 나은 이름을 남기랴</mark></strong>! 나 그들에게 영원히 지워지지 않을 이름을 주리라.” (<a href="https://bibleox.com/ko/ko-ctb/is/56/#L4-5">이사 56:4-5</a>)</p></blockquote><blockquote><p>“<strong>또한 복되다, 고자는</strong>. 그의 손은 불법을 저지르지 않았고 주님을 거슬러 악을 꾀하지 않았으니, <strong>그의 신실함에 대해 뛰어난 은총이 주어지고 주님의 성전에서 더없이 기쁜 몫을 얻으리라</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/prs/3/#L14">지혜 3:14</a>, 그리스어에서 번역)</p></blockquote><h3>계명을 지키는 것보다 높은 완전의 길</h3><p>구원의 길을 찾던 부자 청년은 구세주께 구원을 위해 계명을 지켜야 한다는 확인을 받습니다. 그러나 청년이 더 큰 것을 묻자 주님께서는 더 큰 것, 곧 구원받을 뿐 아니라 완전해지는 길을 가리켜 주십니다. 그러려면 재산을 모두 내주고 그분을 따르라고 부르십니다:</p><blockquote><p>“예수께서는 ‘<strong><mark>네가 완전한 사람이 되려거든 가서 너의 재산을 다 팔아 가난한 사람들에게 나누어 주어라</mark></strong>. 그러면 하늘에서 보화를 얻게 될 것이다. 그러니 내가 시키는 대로 하고 나서 <strong><mark>나를 따라 오너라</mark></strong>’ 하셨다.” (<a href="https://bibleox.com/ko/ko-ctb/mf/19/#L21">마태 19:21</a>)</p></blockquote><h3>하늘 나라를 위해 스스로 고자가 된 사람들</h3><p>수도자들은 지상의 모든 재물과 애착을 떠나 온 삶을 하느님을 향한 지향과 섬김에 바칩니다. 수도자는 하늘 나라를 위해 박탈을 받아들인 고자입니다:</p><blockquote><p>“제자들이 이 말씀을 듣고 예수께 ‘남편과 아내의 관계가 그런 것이라면 <strong>차라리 결혼하지 않는 것이 좋겠습니다</strong>’ 하였더니 예수께서 이렇게 대답하셨다. ‘<strong>그것은 아무나 할 수 있는 일이 아니다. 다만 하느님께서 허락하신 사람만이 할 수 있다</strong>. 처음부터 결혼하지 못할 몸으로 태어난 사람도 있고 사람의 손으로 그렇게 된 사람도 있고 또 <strong><mark>하늘 나라를 위하여 스스로 결혼하지 않는 사람도 있다</mark></strong>. <strong>이 말을 받아 들일만한 사람은 받아 들여라</strong>.’” (<a href="https://bibleox.com/ko/ko-ctb/mf/19/#L10-12">마태 19:10-12</a>) <em>(“결혼하지 않는 사람”은 그리스어로 εὐνοῦχοι, “고자”입니다.)</em></p></blockquote><p>고자에 관한 이 말씀은 아내를 버리지 말라는 금지를 사도들이 들은 뒤에 하신 것입니다. 사도들은 그렇다면 혼인하지 않는 편이 낫다고 판단했습니다. 주님께서는 이 결론을 반박하지 않으시고, 모두가 이 길을 택할 수 있는 것은 아니라고만 가리키셨습니다. 그러나 할 수 있는 사람은 택하라고 하십니다. 곧 이것은 수덕자들의 특별한 길입니다.</p><h3>사도의 권고</h3><p>사도는 독신에 관한 생각을 이번에는 드러내어 되풀이합니다:</p><blockquote><p>“이제 여러분이 적어 보낸 여러 가지 질문에 대답해 드리겠습니다. <strong>남자는 여자와 관계를 맺지 않는 것이 좋습니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/7/#L1">1고린 7:1</a>)</p></blockquote><p>사도 바울로에게는 아내가 없었고, 그는 혼인하지 않은 이들과 과부들에게 자기처럼 지내며 새 남편을 찾지 말라고 조언합니다(명령이 아니라 바로 조언입니다):</p><blockquote><p>“결혼하지 않은 사람들과 과부들에게는 <strong><mark>나처럼 그대로 독신으로 지내는 것이 좋겠다고</mark></strong> 말하고 싶습니다.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/7/#L8">1고린 7:8</a>)</p></blockquote><p>사도는 이 권고의 이유를 설명합니다:</p><blockquote><p>“그러나 남자가 결혼한다고 해서 죄를 짓는다거나 처녀가 결혼한다고 해서 죄를 짓는다는 것은 아닙니다. 다만 결혼한 사람들은 세상 고통에 시달릴 터이므로 여러분을 아끼는 마음에서 이 말을 하는 것입니다. 형제 여러분, 내 말을 명심하여 들으십시오. 이제 때가 얼마 남지 않았으니 이제부터는 아내가 있는 사람은 아내가 없는 사람처럼 살고 슬픔이 있는 사람은 슬픔이 없는 사람처럼 지내고 기쁜 일이 있는 사람은 기쁜 일이 없는 사람처럼 살고 물건을 산 사람은 그 물건이 자기 것이 아닌 것처럼 생각하고 세상과 거래를 하는 사람은 세상과 거래를 하지 않는 사람처럼 살아야 합니다. 우리가 보는 이 세상은 사라져 가고 있기 때문입니다. 나는 여러분이 근심 걱정을 모르고 살기를 바랍니다. <strong><mark>결혼하지 않은 남자는 어떻게 하면 주님을 기쁘시게 해 드릴 수 있을까 하고 주님의 일에 마음을 쓰지만 결혼한 남자는 어떻게 하면 자기 아내를 기쁘게 할 수 있을까 하고 세상일에 마음을 쓰게 되어</mark></strong> 마음이 갈라집니다. <strong>남편이 없는 여자나 처녀는 어떻게 하면 몸과 마음을 거룩하게 할 수 있을까 하고 주님의 일에 마음을 쓰지만 남편이 있는 여자는 어떻게 하면 자기 남편을 기쁘게 할 수 있을까 하고 세상일에 마음을 씁니다</strong>. 나는 여러분 자신의 이익을 위하여 이 말을 합니다. 여러분을 속박하려는 것이 아니라 오히려 여러분이 아름답게 살며 딴 생각 없이 오직 주님만을 섬기게 하려는 것입니다. 어떤 사람이 욕정을 억제할 수 없어서 자기 약혼녀와의 약속을 어겨야 할 경우 그 약혼녀에 대해서 떳떳하지 못하다는 생각이 들겠지만 어쩔 수 없을 때는 원하는 대로 그와 결혼하십시오. 그래도 죄가 되지 않습니다. 그러나 그가 단단히 마음을 먹고 구태여 그렇게 하지 않고도 자기 생각을 다스릴 힘이 있어서 <strong>자기 약혼녀를 그대로 두기로 결심한다면 그것은 잘하는 일입니다</strong>. 이와 같이 자기 약혼녀와 결혼하는 것도 잘하는 일이지만 <strong>결혼하지 않는 것이 더 잘하는 일입니다</strong>. 아내는 남편이 살아 있는 동안은 남편에게 매이지만 남편이 죽으면 자기가 원하는 남자와 결혼할 자유가 있습니다. 그러나 꼭 교우하고만 결혼해야 합니다. 그리고 이것은 내 의견입니다만 <strong><mark>과부는 과부로 혼자 지내는 것이 더 행복합니다</mark></strong>. 나에게도 하느님의 성령이 계시다고 나는 생각합니다.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/7/#L28-40">1고린 7:28-40</a>)</p></blockquote><p>동정으로 삶을 마친 그리스도인들은 하늘에서 그리스도께서 가시는 곳이면 어디든 따라갑니다:</p><blockquote><p>“그리고 나는 어린 양이 시온산 위에 서 있는 것을 보았습니다. 그 어린 양과 함께 <strong>십 사만 사천 명</strong>이 서 있었는데 그들의 이마에는 어린 양과 그 아버지의 이름이 적혀져 있었습니다. 그리고 큰 물소리와도 같은 요란한 천둥소리와도 같은 소리가 하늘로부터 울려 오는 것을 들었습니다. 또 그 소리는 거문고 타는 사람들의 거문고 소리처럼 들렸습니다. 그 십 사만 사천 명은 옥좌와 네 생물과 원로들 앞에서 <strong>새로운 노래를 부르고</strong> 있었습니다. 그러나 <strong><mark>그 노래는 땅으로부터 구출된 십 사만 사천 명 외에는 아무도 배울 수 없었습니다</mark></strong>. <strong><mark>그들은 여자들과 더불어 몸을 더럽힌 일이 없는 사람들이며 숫총각들입니다. 그들은 어린 양이 가는 곳이면 어디든지 따라 다닙니다</mark></strong>. 그들은 사람들 가운데서 구출되어 하느님과 어린 양에게 바쳐진 첫 열매입니다. 그들의 입에서는 거짓말을 찾아 볼 수 없었으며 그들은 아무런 흠도 없는 사람들입니다.” (<a href="https://bibleox.com/ko/ko-ctb/otkr/14/#L1-5">묵시 14:1-5</a>)</p></blockquote><h3>첫 그리스도인 공동체는 공동생활 수도원이었습니다</h3><blockquote><p>“<strong><mark>믿는 사람은 모두 함께 지내며 그들의 모든 것을 공동 소유로 내어 놓고 재산과 물건을 팔아서 모든 사람에게 필요한 만큼 나누어 주었다</mark></strong>. 그리고 <strong><mark>한 마음이 되어 날마다 열심히 성전에 모였으며</mark></strong> 집집마다 돌아 가며 빵을 나누고 순수한 마음으로 기쁘게 음식을 함께 먹으며” (<a href="https://bibleox.com/ko/ko-ctb/act/2/#L44-46">사도 2:44-46</a>)</p></blockquote><blockquote><p>“그 많은 신도들이 다 한 마음 한 뜻이 되어 <strong><mark>아무도 자기 소유를 자기 것이라고 하지 않고 모든 것을 공동으로 사용하였다</mark></strong>. &lt;…&gt; 그들 가운데 가난한 사람은 하나도 없었다. <strong><mark>땅이나 집을 가진 사람들이 그것을 팔아서 그 돈을 사도들 앞에 가져다 놓고 저마다 쓸 만큼 나누어 받았기 때문이다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/act/4/#L32,34-35">사도 4:32,34-35</a>)</p></blockquote><blockquote><p>“그러나 <strong><mark>다른 사람들은 신도들의 모임에 끼어 들 생각을 감히 하지 못하였다</mark></strong>. 그러면서도 백성들은 그들을 칭찬하였으며” (<a href="https://bibleox.com/ko/ko-ctb/act/5/#L13">사도 5:13</a>)</p></blockquote><h2>수도 생활의 본보기</h2><h3>주 예수 그리스도</h3><ul><li><p>혼인하지 않으셨습니다;</p></li><li><p>자기 집이 없으셨습니다(<a href="https://bibleox.com/ko/ko-ctb/mf/8/#L20">마태 8:20</a>; <a href="https://bibleox.com/ko/ko-ctb/lk/9/#L58">루가 9:58</a>; <a href="https://bibleox.com/ko/ko-ctb/mf/19/#L21">마태 19:21</a>);</p></li><li><p>개인 돈이 없으셨고 재물을 탐하지 않으셨습니다(<a href="https://bibleox.com/ko/ko-ctb/mk/12/#L15">마르 12:15</a>; <a href="https://bibleox.com/ko/ko-ctb/mf/17/#L24-27">마태 17:24-27</a>; <a href="https://bibleox.com/ko/ko-ctb/mf/19/#L21">마태 19:21</a>);</p></li><li><p>홀로 밤새워 많이 기도하셨습니다(<a href="https://bibleox.com/ko/ko-ctb/lk/6/#L12">루가 6:12</a>; <a href="https://bibleox.com/ko/ko-ctb/mf/6/#L6">마태 6:6</a>; <a href="https://bibleox.com/ko/ko-ctb/mf/14/#L23,25">마태 14:23,25</a>; <a href="https://bibleox.com/ko/ko-ctb/mk/14/#L32,35,37,39-41">마르 14:32,35,37,39-41</a>);</p></li><li><p>제자들이 있었습니다(<a href="https://bibleox.com/ko/ko-ctb/lk/6/#L13">루가 6:13</a>; <a href="https://bibleox.com/ko/ko-ctb/lk/10/#L1">루가 10:1</a>);</p></li><li><p>기도를 가르치시고 제자들에게 기도의 틀을 주셨습니다(<a href="https://bibleox.com/ko/ko-ctb/mf/6/#L9">마태 6:9</a>);</p></li><li><p>찾아오는 이들을 위로하고 꾸짖고 가르치고 이끄셨습니다(<a href="https://bibleox.com/ko/ko-ctb/mk/6/#L31">마르 6:31</a>).</p></li></ul><h3>하느님의 어머니 동정 마리아</h3><ul><li><p>독신 서원을 하고 형식적으로 혼인했으며 부부 관계가 없었습니다(“저는 남자를 알지 못합니다”, <a href="https://bibleox.com/ru/ru/w/Богородица">자세히</a>);</p></li><li><p>재산이 없었고, 어려서 성전에 맡겨져 자랐으며, 그 뒤 요셉과 약혼했고, 주님께서 사도 요한에게 맡기셨습니다(<a href="https://bibleox.com/ko/ko-ctb/in/19/#L27">요한 19:27</a>).</p></li></ul><h3>예언자 세례자 요한</h3><ul><li><p>혼인하지 않았습니다;</p></li><li><p>집 없이 광야에서 살았습니다(<a href="https://bibleox.com/ko/ko-ctb/lk/1/#L80">루가 1:80</a>);</p></li><li><p>거친 손수 지은 옷을 입었습니다(<a href="https://bibleox.com/ko/ko-ctb/mf/3/#L4">마태 3:4</a>);</p></li><li><p>광야에서 찾은 아주 소박한 음식을 먹었습니다(<a href="https://bibleox.com/ko/ko-ctb/mf/3/#L4">마태 3:4</a>);</p></li><li><p>손수 지은 옷과 찾아 먹은 음식은 그에게 돈이 없었음을 가리킵니다;</p></li><li><p>기도를 가르치고 기도의 틀을 주었습니다(<a href="https://bibleox.com/ko/ko-ctb/lk/11/#L1">루가 11:1</a>);</p></li><li><p>제자들이 있었습니다(<a href="https://bibleox.com/ko/ko-ctb/mf/11/#L2">마태 11:2</a>; <a href="https://bibleox.com/ko/ko-ctb/in/1/#L35">요한 1:35</a>; <a href="https://bibleox.com/ko/ko-ctb/in/3/#L25">요한 3:25</a>);</p></li><li><p>찾아오는 이들을 위로하고 꾸짖고 가르치고 이끌었습니다(<a href="https://bibleox.com/ko/ko-ctb/lk/3/#L18">루가 3:18</a>; <a href="https://bibleox.com/ko/ko-ctb/lk/3/#L10-20">루가 3:10-20</a>; <a href="https://bibleox.com/ko/ko-ctb/mk/6/#L31">마르 6:31</a>).</p></li></ul><h3>예언자 엘리야</h3><ul><li><p>혼인하지 않았습니다;</p></li><li><p>자주 광야와 동굴 같은 거친 곳에서 살았습니다(<a href="https://bibleox.com/ko/ko-ctb/3ts/17/#L3-7">열상 17:3-7</a>; <a href="https://bibleox.com/ko/ko-ctb/3ts/19/#L9">열상 19:9</a>; <a href="https://bibleox.com/ko/ko-ctb/3ts/19/#L4">열상 19:4</a>);</p></li><li><p>짐승 털로 된 소박한 옷을 입고 가죽띠를 둘렀습니다(<a href="https://bibleox.com/ko/ko-ctb/4ts/1/#L8">열하 1:8</a>);</p></li><li><p>까마귀들이 날라다 주는 소박한 음식을 먹었습니다(<a href="https://bibleox.com/ko/ko-ctb/3ts/17/#L6">열상 17:6</a>);</p></li><li><p>제자가 있었습니다(<a href="https://bibleox.com/ko/ko-ctb/3ts/19/#L19-21">열상 19:19-21</a>);</p></li><li><p>하느님의 명으로 백성의 불경을 꾸짖었습니다(<a href="https://bibleox.com/ko/ko-ctb/3ts/18/#L17-40">열상 18:17-40</a>).</p></li></ul><h3>예언자 다니엘</h3><ul><li><p>혼인하지 않았습니다;</p></li><li><p>왕의 음식을 거절하고 소박한 음식을 먹었습니다(<a href="https://bibleox.com/ko/ko-ctb/dan/1/#L12">다니 1:12</a>);</p></li><li><p>자주 기도했습니다(<a href="https://bibleox.com/ko/ko-ctb/dan/6/#L11">다니 6:11</a>);</p></li><li><p>불경을 꾸짖었습니다(<a href="https://bibleox.com/ko/ko-ctb/dan/5/#L17-28">다니 5:17-28</a>).</p></li></ul><h3>예언자 예레미야</h3><ul><li><p>하느님의 명으로 혼인하지 않았습니다(<a href="https://bibleox.com/ko/ko-ctb/ier/16/#L2">예레 16:2</a>);</p></li><li><p>자주 감금과 유배 속에서 홀로 살았습니다(<a href="https://bibleox.com/ko/ko-ctb/ier/37/#L15-16">예레 37:15-16</a>);</p></li><li><p>민족들을 가르치고 꾸짖었습니다(<a href="https://bibleox.com/ko/ko-ctb/ier/1/#L9-10">예레 1:9-10</a>).</p></li></ul>
