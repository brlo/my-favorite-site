  title: 적은 설교자
  copy_cover: true
  body: <blockquote><p>“너희가 내 규례와 계명을 준행하면 &lt;…&gt; 너희의 원수들을 쫓으리니 그들이 너희 앞에서 칼에 엎드러질 것이라 또 너희 다섯이 백을 쫓고 너희 백이 만을 쫓으리니 너희 대적들이 너희 앞에서 칼에 엎드러질 것이며 내가 너희를 돌보아 너희를 번성하게 하고 너희를 창대하게 할 것이며 내가 너희와 함께 한 내 언약을 이행하리라” (<a href="https://bibleox.com/ko/ko-nkrv/lev/26/#L3,7-9">레 26:3,7-9</a>)</p></blockquote><blockquote><p>“이르시되 추수할 것은 많되 일꾼이 적으니 그러므로 추수하는 주인에게 청하여 추수할 일꾼들을 보내 주소서 하라” (<a href="https://bibleox.com/ko/ko-nkrv/lk/10/#L2">눅 10:2</a>)</p></blockquote><blockquote><p>“이에 제자들에게 이르시되 추수할 것은 많되 일꾼이 적으니 그러므로 추수하는 주인에게 청하여 추수할 일꾼들을 보내 주소서 하라 하시니라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/9/#L37-38">마 9:37-38</a>)</p></blockquote>
  meta_desc: 설교자에 관한 성경 구절
