- src: искушения
  path: Tm18p_시련과_유혹
  title: 시련과 유혹
  copy_cover: true
  body: <h2>믿는 사람은 시련을 준비해야 합니다</h2><blockquote><p>“<strong>얘야, 주님을 섬기러 나아가거든 네 영혼을 시련에 대비시켜라.</strong> 네 마음을 바로잡고 꿋꿋이 견디며 재난의 때에 서두르지 말라. 그분께 매달려 떠나지 말라. 그러면 네 마지막 날에 번성할 것이다. 네게 닥치는 모든 것을 받아들이고 <strong>굴욕의 변화 속에서도 오래 참아라. 금은 불 속에서 단련되기</strong> 때문이다” (<a href="https://bibleox.com/ko/gr-lxx-byz/prsir/2/#L1-5">집회 2:1-5</a>, 그리스어에서 번역)</p></blockquote><h2>시련은 유익합니다</h2><blockquote><p>“그 동안 <strong>많은 사람들이 단련을 받아 깨끗해져서 빛날 것이다</strong>. 악한 사람들은 끝내 눈이 열리지 않아 악한 짓을 계속하겠지만 슬기로운 지도자들은 눈이 열려 환하게 알 것이다.” (<a href="https://bibleox.com/ko/ko-ctb/dan/12/#L10">다니 12:10</a>)</p></blockquote><blockquote><p>“네 영혼을 <strong>시련에 대비시켜라</strong>. … 그러면 <strong>네 마지막 날에 번성할 것이다</strong>. <strong>네게 닥치는 모든 것을 받아들이라</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/prsir/2/#L1-5">집회 2:1-5</a>, 그리스어에서 번역)</p></blockquote><blockquote><p>“<strong>내 형제 여러분, 여러 가지 시련을 당할 때 여러분은 그것을 다시 없는 기쁨으로 여기십시오</strong>. 믿음의 시련을 받으면 인내력이 생긴다는 것을 여러분은 잘 알고 있습니다. 인내력을 한껏 발휘하십시오. 그러면 여러분은 조금도 흠잡을 데 없이 완전하고도 원만한 사람이 될 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/iak/1/#L2-4">야고 1:2-4</a>)</p></blockquote><blockquote><p>“<strong>시련을 견디어 내는 사람은 행복합니다</strong>. 시련을 이겨 낸 사람은 생명의 월계관을 받을 것입니다. 그 월계관은 하느님께서 당신을 사랑하는 사람들에게 주시겠다고 약속하신 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/iak/1/#L12">야고 1:12</a>)</p></blockquote><blockquote><p>“<strong>그러므로 기뻐하십시오. 여러분이 지금 얼마 동안은 갖가지 시련을 겪으면서</strong> 슬퍼할 수밖에 없겠지만 그것은 여러분의 믿음을 순수하게 만들기 위한 것입니다. 결국 없어지고 말 황금도 불로 단련을 받습니다. 그러므로 황금보다 훨씬 더 귀한 여러분의 믿음은 많은 단련을 받아 순수한 것이 되어 예수 그리스도께서 나타나시는 날에 칭찬과 영광과 영예를 차지하게 될 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/1pet/1/#L6-7">1베드 1:6-7</a>)</p></blockquote><blockquote><p>“사랑하는 여러분, <strong>시련의 불길이 여러분 가운데 일어나더라도</strong> 그것은 여러분을 시험하려는 것이니 무슨 큰 일이나 생긴 것처럼 놀라지 마십시오. 여러분은 그리스도의 고난에 참여하는 것이니 오히려 기뻐하십시오. 여러분은 그리스도께서 영광스럽게 나타나실 때에 기뻐서 뛰며 즐거워하게 될 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/1pet/4/#L12-13">1베드 4:12-13</a>)</p></blockquote><h2>하느님께서는 힘에 겨운 시련을 허락하지 않으시고 힘을 주십니다</h2><blockquote><p>“여러분이 겪은 시련은 모두 인간이 능히 감당해 낼 수 있는 시련들이었습니다. 하느님은 신의가 있는 분이십니다. 하느님께서는 여러분에게 <strong>힘에 겨운 시련을 겪게 하지는 않으십니다</strong>. 시련을 주시더라도 그것을 <strong>극복하고 벗어날 수 있는 길을 마련해 주실 것입니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/10/#L13">1고린 10:13</a>)</p></blockquote><blockquote><p>“<strong>주님께서는 당신을 경외하는 사람들은 유혹에서 건져 내시고</strong> 악인들은 심판 날까지 계속 벌을 받게 하실 수 있으십니다.” (<a href="https://bibleox.com/ko/ko-ctb/2pet/2/#L9">2베드 2:9</a>)</p></blockquote><h2>시련을 이기는 법</h2><p>영적인 깨어 있음과 기도가 필요합니다:</p><blockquote><p>“유혹에 빠지지 않도록 <strong>깨어 기도하라</strong>. 마음은 간절하나 몸이 말을 듣지 않는구나!‘ 하시며 한탄하셨다.” (<a href="https://bibleox.com/ko/ko-ctb/mf/26/#L41">마태 26:41</a>; <a href="https://bibleox.com/ko/ko-ctb/mk/14/#L38">마르 14:38</a>; <a href="https://bibleox.com/ko/ko-ctb/lk/22/#L40">루가 22:40</a>; <a href="https://bibleox.com/ko/ko-ctb/lk/22/#L46">루가 22:46</a>)</p></blockquote><h2>유혹에 빠짐</h2><blockquote><p>“<strong>부자가 되려고 애쓰는 사람은 유혹에 빠지고</strong> 올가미에 걸리고 어리석고도 해로운 온갖 욕심에 사로잡혀서 파멸의 구렁텅이에 떨어지게 됩니다.” (<a href="https://bibleox.com/ko/ko-ctb/1tim/6/#L9">1디모 6:9</a>)</p></blockquote>
  meta_desc: 시련과 유혹에 관한 성경 구절
