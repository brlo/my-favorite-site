    title: 금식
    priority: 19
  references: "<p>번역: 로디온 블라소프 (AI 도구 활용). 저본: 러시아어 원문. 참고: 영어·일본어 번역. 성경 인용과 링크는 개역개정에 따름.</p>"
- src: монашество
  path: Mn24s_수도_생활
  title: 수도 생활
  copy_cover: true
  body: <h2>수도 생활에 관한 성경 말씀</h2><h3>하느님 마음에 드는 것을 택하는 고자들</h3><p>하느님께서는 혼인하지 않고 하느님의 법을 지키는 데 특별히 마음을 쓰는 이들을 특별히 구별하십니다. 그들은 다른 “아들 딸”보다 높아진 것과 같습니다:</p><blockquote><p>“여호와께서 이와 같이 말씀하시기를 나의 안식일을 지키며 내가 기뻐하는 일을 선택하며 <strong><mark>나의 언약을 굳게 잡는</mark></strong> <strong><mark>고자들</mark></strong>에게는 내가 내 집에서, 내 성 안에서 <strong><mark>아들이나 딸보다 나은 기념물과 이름을</mark></strong> 그들에게 주며 영원한 이름을 주어 끊어지지 아니하게 할 것이며” (<a href="https://bibleox.com/ko/ko-nkrv/is/56/#L4-5">사 56:4-5</a>)</p></blockquote><blockquote><p>“<strong>또한 복되다, 고자는</strong>. 그의 손은 불법을 저지르지 않았고 주님을 거슬러 악을 꾀하지 않았으니, <strong>그의 신실함에 대해 뛰어난 은총이 주어지고 주님의 성전에서 더없이 기쁜 몫을 얻으리라</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/prs/3/#L14">지혜 3:14</a>, 그리스어에서 번역)</p></blockquote><h3>계명을 지키는 것보다 높은 완전의 길</h3><p>구원의 길을 찾던 부자 청년은 구세주께 구원을 위해 계명을 지켜야 한다는 확인을 받습니다. 그러나 청년이 더 큰 것을 묻자 주님께서는 더 큰 것, 곧 구원받을 뿐 아니라 완전해지는 길을 가리켜 주십니다. 그러려면 재산을 모두 내주고 그분을 따르라고 부르십니다:</p><blockquote><p>“예수께서 이르시되 <strong><mark>네가 온전하고자 할진대 가서 네 소유를 팔아 가난한 자들에게 주라</mark></strong> 그리하면 하늘에서 보화가 네게 있으리라 그리고 <strong><mark>와서 나를 따르라</mark></strong> 하시니” (<a href="https://bibleox.com/ko/ko-nkrv/mf/19/#L21">마 19:21</a>)</p></blockquote><h3>하늘 나라를 위해 스스로 고자가 된 사람들</h3><p>수도자들은 지상의 모든 재물과 애착을 떠나 온 삶을 하느님을 향한 지향과 섬김에 바칩니다. 수도자는 하늘 나라를 위해 박탈을 받아들인 고자입니다:</p><blockquote><p>“제자들이 이르되 만일 사람이 아내에게 이같이 할진대 <strong>장가 들지 않는 것이 좋겠나이다</strong> 예수께서 이르시되 <strong>사람마다 이 말을 받지 못하고 오직 타고난 자라야 할지니라</strong> 어머니의 태로부터 된 고자도 있고 사람이 만든 고자도 있고 <strong><mark>천국을 위하여 스스로 된 고자도 있도다</mark></strong> <strong>이 말을 받을 만한 자는 받을지어다</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/19/#L10-12">마 19:10-12</a>)</p></blockquote><p>고자에 관한 이 말씀은 아내를 버리지 말라는 금지를 사도들이 들은 뒤에 하신 것입니다. 사도들은 그렇다면 혼인하지 않는 편이 낫다고 판단했습니다. 주님께서는 이 결론을 반박하지 않으시고, 모두가 이 길을 택할 수 있는 것은 아니라고만 가리키셨습니다. 그러나 할 수 있는 사람은 택하라고 하십니다. 곧 이것은 수덕자들의 특별한 길입니다.</p><h3>사도의 권고</h3><p>사도는 독신에 관한 생각을 이번에는 드러내어 되풀이합니다:</p><blockquote><p>“너희가 쓴 문제에 대하여 말하면 <strong>남자가 여자를 가까이 아니함이 좋으나</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/7/#L1">고전 7:1</a>)</p></blockquote><p>사도 바울에게는 아내가 없었고, 그는 혼인하지 않은 이들과 과부들에게 자기처럼 지내며 새 남편을 찾지 말라고 조언합니다(명령이 아니라 바로 조언입니다):</p><blockquote><p>“내가 결혼하지 아니한 자들과 과부들에게 이르노니 <strong><mark>나와 같이 그냥 지내는 것이 좋으니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/7/#L8">고전 7:8</a>)</p></blockquote><p>사도는 이 권고의 이유를 설명합니다:</p><blockquote><p>“그러나 장가 가도 죄 짓는 것이 아니요 처녀가 시집 가도 죄 짓는 것이 아니로되 이런 이들은 육신에 고난이 있으리니 나는 너희를 아끼노라 형제들아 내가 이 말을 하노니 그 때가 단축하여진 고로 이후부터 아내 있는 자들은 없는 자 같이 하며 우는 자들은 울지 않는 자 같이 하며 기쁜 자들은 기쁘지 않은 자 같이 하며 매매하는 자들은 없는 자 같이 하며 세상 물건을 쓰는 자들은 다 쓰지 못하는 자 같이 하라 이 세상의 외형은 지나감이니라 너희가 염려 없기를 원하노라 <strong><mark>장가 가지 않은 자는 주의 일을 염려하여 어찌하여야 주를 기쁘시게 할까 하되 장가 간 자는 세상 일을 염려하여 어찌하여야 아내를 기쁘게 할까 하여</mark></strong> 마음이 갈라지며 <strong>시집 가지 않은 자와 처녀는 주의 일을 염려하여 몸과 영을 다 거룩하게 하려 하되 시집 간 자는 세상 일을 염려하여 어찌하여야 남편을 기쁘게 할까 하느니라</strong> 내가 이것을 말함은 너희의 유익을 위함이요 너희에게 올무를 놓으려 함이 아니니 오직 너희로 하여금 이치에 합당하게 하여 흐트러짐이 없이 주를 섬기게 하려 함이라 그러므로 만일 누가 자기의 약혼녀에 대한 행동이 합당하지 못한 줄로 생각할 때에 그 약혼녀의 혼기도 지나고 그같이 할 필요가 있거든 원하는 대로 하라 그것은 죄 짓는 것이 아니니 그들로 결혼하게 하라 그러나 그가 마음을 정하고 또 부득이한 일도 없고 자기 뜻대로 할 권리가 있어서 <strong>그 약혼녀를 그대로 두기로 하여도 잘하는 것이니라</strong> 그러므로 결혼하는 자도 잘하거니와 <strong>결혼하지 아니하는 자는 더 잘하는 것이니라</strong> 아내는 그 남편이 살아 있는 동안에 매여 있다가 남편이 죽으면 자유로워 자기 뜻대로 시집 갈 것이나 주 안에서만 할 것이니라 그러나 내 뜻에는 <strong><mark>그냥 지내는 것이 더욱 복이 있으리로다</mark></strong> 나도 또한 하나님의 영을 받은 줄로 생각하노라” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/7/#L28-40">고전 7:28-40</a>)</p></blockquote><p>동정으로 삶을 마친 그리스도인들은 하늘에서 그리스도께서 가시는 곳이면 어디든 따라갑니다:</p><blockquote><p>“또 내가 보니 보라 어린 양이 시온 산에 섰고 그와 함께 <strong>십사만 사천이</strong> 서 있는데 그들의 이마에는 어린 양의 이름과 그 아버지의 이름을 쓴 것이 있더라 내가 하늘에서 나는 소리를 들으니 많은 물 소리와도 같고 큰 우렛소리와도 같은데 내가 들은 소리는 거문고 타는 자들이 그 거문고를 타는 것 같더라 그들이 보좌 앞과 네 생물과 장로들 앞에서 <strong>새 노래를 부르니</strong> <strong><mark>땅에서 속량함을 받은 십사만 사천 밖에는 능히 이 노래를 배울 자가 없더라</mark></strong> <strong><mark>이 사람들은 여자와 더불어 더럽히지 아니하고 순결한 자라 어린 양이 어디로 인도하든지 따라가는 자며</mark></strong> 사람 가운데에서 속량함을 받아 처음 익은 열매로 하나님과 어린 양에게 속한 자들이니 그 입에 거짓말이 없고 흠이 없는 자들이더라” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/14/#L1-5">계 14:1-5</a>)</p></blockquote><h3>첫 그리스도인 공동체는 공동생활 수도원이었습니다</h3><blockquote><p>“<strong><mark>믿는 사람이 다 함께 있어 모든 물건을 서로 통용하고 또 재산과 소유를 팔아 각 사람의 필요를 따라 나눠 주며</mark></strong> <strong><mark>날마다 마음을 같이하여 성전에 모이기를 힘쓰고</mark></strong> 집에서 떡을 떼며 기쁨과 순전한 마음으로 음식을 먹고” (<a href="https://bibleox.com/ko/ko-nkrv/act/2/#L44-46">행 2:44-46</a>)</p></blockquote><blockquote><p>“믿는 무리가 한마음과 한 뜻이 되어 모든 물건을 서로 통용하고 <strong><mark>자기 재물을 조금이라도 자기 것이라 하는 이가 하나도 없더라</mark></strong> &lt;…&gt; 그 중에 가난한 사람이 없으니 이는 <strong><mark>밭과 집 있는 자는 팔아 그 판 것의 값을 가져다가 사도들의 발 앞에 두매 그들이 각 사람의 필요를 따라 나누어 줌이라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/act/4/#L32,34-35">행 4:32,34-35</a>)</p></blockquote><blockquote><p>“<strong><mark>그 나머지는 감히 그들과 상종하는 사람이 없으나</mark></strong> 백성이 칭송하더라” (<a href="https://bibleox.com/ko/ko-nkrv/act/5/#L13">행 5:13</a>)</p></blockquote><h2>수도 생활의 본보기</h2><h3>주 예수 그리스도</h3><ul><li><p>혼인하지 않으셨습니다;</p></li><li><p>자기 집이 없으셨습니다(<a href="https://bibleox.com/ko/ko-nkrv/mf/8/#L20">마 8:20</a>; <a href="https://bibleox.com/ko/ko-nkrv/lk/9/#L58">눅 9:58</a>; <a href="https://bibleox.com/ko/ko-nkrv/mf/19/#L21">마 19:21</a>);</p></li><li><p>개인 돈이 없으셨고 재물을 탐하지 않으셨습니다(<a href="https://bibleox.com/ko/ko-nkrv/mk/12/#L15">막 12:15</a>; <a href="https://bibleox.com/ko/ko-nkrv/mf/17/#L24-27">마 17:24-27</a>; <a href="https://bibleox.com/ko/ko-nkrv/mf/19/#L21">마 19:21</a>);</p></li><li><p>홀로 밤새워 많이 기도하셨습니다(<a href="https://bibleox.com/ko/ko-nkrv/lk/6/#L12">눅 6:12</a>; <a href="https://bibleox.com/ko/ko-nkrv/mf/6/#L6">마 6:6</a>; <a href="https://bibleox.com/ko/ko-nkrv/mf/14/#L23,25">마 14:23,25</a>; <a href="https://bibleox.com/ko/ko-nkrv/mk/14/#L32,35,37,39-41">막 14:32,35,37,39-41</a>);</p></li><li><p>제자들이 있었습니다(<a href="https://bibleox.com/ko/ko-nkrv/lk/6/#L13">눅 6:13</a>; <a href="https://bibleox.com/ko/ko-nkrv/lk/10/#L1">눅 10:1</a>);</p></li><li><p>기도를 가르치시고 제자들에게 기도의 틀을 주셨습니다(<a href="https://bibleox.com/ko/ko-nkrv/mf/6/#L9">마 6:9</a>);</p></li><li><p>찾아오는 이들을 위로하고 꾸짖고 가르치고 이끄셨습니다(<a href="https://bibleox.com/ko/ko-nkrv/mk/6/#L31">막 6:31</a>).</p></li></ul><h3>하느님의 어머니 동정 마리아</h3><ul><li><p>독신 서원을 하고 형식적으로 혼인했으며 부부 관계가 없었습니다(“저는 남자를 알지 못합니다”, <a href="https://bibleox.com/ru/ru/w/Богородица">자세히</a>);</p></li><li><p>재산이 없었고, 어려서 성전에 맡겨져 자랐으며, 그 뒤 요셉과 약혼했고, 주님께서 사도 요한에게 맡기셨습니다(<a href="https://bibleox.com/ko/ko-nkrv/in/19/#L27">요 19:27</a>).</p></li></ul><h3>예언자 세례 요한</h3><ul><li><p>혼인하지 않았습니다;</p></li><li><p>집 없이 광야에서 살았습니다(<a href="https://bibleox.com/ko/ko-nkrv/lk/1/#L80">눅 1:80</a>);</p></li><li><p>거친 손수 지은 옷을 입었습니다(<a href="https://bibleox.com/ko/ko-nkrv/mf/3/#L4">마 3:4</a>);</p></li><li><p>광야에서 찾은 아주 소박한 음식을 먹었습니다(<a href="https://bibleox.com/ko/ko-nkrv/mf/3/#L4">마 3:4</a>);</p></li><li><p>손수 지은 옷과 찾아 먹은 음식은 그에게 돈이 없었음을 가리킵니다;</p></li><li><p>기도를 가르치고 기도의 틀을 주었습니다(<a href="https://bibleox.com/ko/ko-nkrv/lk/11/#L1">눅 11:1</a>);</p></li><li><p>제자들이 있었습니다(<a href="https://bibleox.com/ko/ko-nkrv/mf/11/#L2">마 11:2</a>; <a href="https://bibleox.com/ko/ko-nkrv/in/1/#L35">요 1:35</a>; <a href="https://bibleox.com/ko/ko-nkrv/in/3/#L25">요 3:25</a>);</p></li><li><p>찾아오는 이들을 위로하고 꾸짖고 가르치고 이끌었습니다(<a href="https://bibleox.com/ko/ko-nkrv/lk/3/#L18">눅 3:18</a>; <a href="https://bibleox.com/ko/ko-nkrv/lk/3/#L10-20">눅 3:10-20</a>; <a href="https://bibleox.com/ko/ko-nkrv/mk/6/#L31">막 6:31</a>).</p></li></ul><h3>예언자 엘리야</h3><ul><li><p>혼인하지 않았습니다;</p></li><li><p>자주 광야와 동굴 같은 거친 곳에서 살았습니다(<a href="https://bibleox.com/ko/ko-nkrv/3ts/17/#L3-7">왕상 17:3-7</a>; <a href="https://bibleox.com/ko/ko-nkrv/3ts/19/#L9">왕상 19:9</a>; <a href="https://bibleox.com/ko/ko-nkrv/3ts/19/#L4">왕상 19:4</a>);</p></li><li><p>짐승 털로 된 소박한 옷을 입고 가죽띠를 둘렀습니다(<a href="https://bibleox.com/ko/ko-nkrv/4ts/1/#L8">왕하 1:8</a>);</p></li><li><p>까마귀들이 날라다 주는 소박한 음식을 먹었습니다(<a href="https://bibleox.com/ko/ko-nkrv/3ts/17/#L6">왕상 17:6</a>);</p></li><li><p>제자가 있었습니다(<a href="https://bibleox.com/ko/ko-nkrv/3ts/19/#L19-21">왕상 19:19-21</a>);</p></li><li><p>하느님의 명으로 백성의 불경을 꾸짖었습니다(<a href="https://bibleox.com/ko/ko-nkrv/3ts/18/#L17-40">왕상 18:17-40</a>).</p></li></ul><h3>예언자 다니엘</h3><ul><li><p>혼인하지 않았습니다;</p></li><li><p>왕의 음식을 거절하고 소박한 음식을 먹었습니다(<a href="https://bibleox.com/ko/ko-nkrv/dan/1/#L12">단 1:12</a>);</p></li><li><p>자주 기도했습니다(<a href="https://bibleox.com/ko/ko-nkrv/dan/6/#L10">단 6:10</a>);</p></li><li><p>불경을 꾸짖었습니다(<a href="https://bibleox.com/ko/ko-nkrv/dan/5/#L17-28">단 5:17-28</a>).</p></li></ul><h3>예언자 예레미야</h3><ul><li><p>하느님의 명으로 혼인하지 않았습니다(<a href="https://bibleox.com/ko/ko-nkrv/ier/16/#L2">렘 16:2</a>);</p></li><li><p>자주 감금과 유배 속에서 홀로 살았습니다(<a href="https://bibleox.com/ko/ko-nkrv/ier/37/#L15-16">렘 37:15-16</a>);</p></li><li><p>민족들을 가르치고 꾸짖었습니다(<a href="https://bibleox.com/ko/ko-nkrv/ier/1/#L9-10">렘 1:9-10</a>).</p></li></ul>
