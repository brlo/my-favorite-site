- src: пост
  path: Fs19t_단식
  title: 금식
  copy_cover: true
  body: '<p>수덕 생활 전반에 관하여:</p><blockquote><p>“<strong>이기기를 다투는 자마다 모든 일에 절제하나니</strong> 그들은 썩을 승리자의 <strong>관</strong>을 얻고자 하되 <strong>우리는 썩지 아니할 것을 얻고자 하노라</strong> 그러므로 나는 달음질하기를 향방 없는 것 같이 아니하고 싸우기를 허공을 치는 것 같이 아니하며 <strong>내가 내 몸을 쳐 복종하게 함은</strong> 내가 남에게 전파한 후에 자신이 도리어 <strong>버림을 당할까</strong> 두려워함이로다” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/9/#L25-27">고전 9:25-27</a>)</p></blockquote><p>하느님께서는 금식하며 당신께 돌아오라고 부르십니다:</p><blockquote><p>“여호와의 말씀에 너희는 이제라도 <strong>금식하고</strong> 울며 애통하고 마음을 다하여 <strong>내게로 돌아오라</strong> 하셨나니” (<a href="https://bibleox.com/ko/ko-nkrv/iol/2/#L12">욜 2:12</a>)</p></blockquote><p>주 예수 그리스도께서는 금식으로 복음 선포를 시작하셨습니다:</p><blockquote><p>“<strong>사십 일을 밤낮으로 금식하신 후에</strong> 주리신지라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/4/#L2">마 4:2</a>)</p></blockquote><p>주님께서는 올바르게 금식하는 법을 가르치셨습니다:</p><blockquote><p>“<strong>금식할 때에</strong> 너희는 외식하는 자들과 같이 슬픈 기색을 보이지 말라 그들은 금식하는 것을 사람에게 보이려고 얼굴을 흉하게 하느니라 내가 진실로 너희에게 이르노니 그들은 자기 상을 이미 받았느니라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/6/#L16">마 6:16</a>)</p></blockquote><blockquote><p>“너는 <strong>금식할 때에</strong> 머리에 기름을 바르고 얼굴을 씻으라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/6/#L17">마 6:17</a>)</p></blockquote><p>예언자 요한의 제자들은 금식했습니다:</p><blockquote><p>“그 때에 요한의 제자들이 예수께 나아와 이르되 <strong>우리와 바리새인들은 금식하는데</strong> 어찌하여 당신의 제자들은 금식하지 아니하나이까” (<a href="https://bibleox.com/ko/ko-nkrv/mf/9/#L14">마 9:14</a>; <a href="https://bibleox.com/ko/ko-nkrv/mk/2/#L18">막 2:18</a>)</p></blockquote><p>그리스도의 제자들은 그리스도께서 십자가에 못박히신 뒤에 금식할 것입니다:</p><blockquote><p>“예수께서 그들에게 이르시되 혼인집 손님들이 신랑과 함께 있을 동안에 슬퍼할 수 있느냐 그러나 신랑을 빼앗길 날이 이르리니 <strong>그 때에는 금식할 것이니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/9/#L15">마 9:15</a>; <a href="https://bibleox.com/ko/ko-nkrv/mk/2/#L20">막 2:20</a>; <a href="https://bibleox.com/ko/ko-nkrv/lk/5/#L35">눅 5:35</a>)</p></blockquote><p>어떤 악령은 금식 없이는 사람에게서 쫓아낼 수 없습니다:</p><blockquote><p>“이르시되 <strong>기도 외에 다른 것으로는</strong> 이런 종류가 나갈 수 없느니라 하시니라” (<a href="https://bibleox.com/ko/ko-nkrv/mk/9/#L29">막 9:29</a>) <em>(비잔틴 본문(다수 사본)에는 “기도와 <strong>금식</strong>”으로 되어 있고, 마태복음 17:21에도 같은 말씀이 있습니다(개역개정에는 이 절이 없습니다).)</em></p></blockquote><p>주님의 성전에서 한 과부는 밤낮으로 기도와 금식으로 하느님을 섬겼습니다:</p><blockquote><p>“과부가 되고 팔십사 세가 되었더라 이 사람이 성전을 떠나지 아니하고 <strong>주야로 금식하며 기도함으로 섬기더니</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/lk/2/#L37">눅 2:37</a>)</p></blockquote><p>백인대장에게 천사가 파견된 것은 금식 중이었습니다:</p><blockquote><p>“고넬료가 이르되 내가 나흘 전 이맘때까지 내 집에서 <strong>제 구 시 기도를 하는데</strong> 갑자기 한 사람이 빛난 옷을 입고 내 앞에 서서” (<a href="https://bibleox.com/ko/ko-nkrv/act/10/#L30">행 10:30</a>) <em>(비잔틴 본문(다수 사본): “나는 <strong>금식하고</strong> 있었고 … 기도하고 있었습니다.”)</em></p></blockquote><p>성령께서는 금식 중에 첫 그리스도인들에게 말씀하셨습니다:</p><blockquote><p>“<strong>주를 섬겨 금식할 때에</strong> 성령이 이르시되 내가 불러 시키는 일을 위하여 바나바와 사울을 따로 세우라 하시니” (<a href="https://bibleox.com/ko/ko-nkrv/act/13/#L2">행 13:2</a>)</p></blockquote><p>첫 그리스도인들은 모든 중요한 일에서 기도에 금식을 더했습니다:</p><blockquote><p>“각 교회에서 장로들을 택하여 <strong>금식 기도 하며</strong> 그들이 믿는 주께 그들을 위탁하고” (<a href="https://bibleox.com/ko/ko-nkrv/act/14/#L23">행 14:23</a>)</p></blockquote><p>부부는 금식을 위해 잠시 서로 떨어져 있을 수 있습니다:</p><blockquote><p>“서로 분방하지 말라 다만 <strong>기도할 틈을 얻기 위하여</strong> 합의상 얼마 동안은 하되 다시 합하라 이는 너희가 절제 못함으로 말미암아 사탄이 너희를 시험하지 못하게 하려 함이라” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/7/#L5">고전 7:5</a>) <em>(비잔틴 본문(다수 사본): “<strong>금식과</strong> 기도에”)</em></p></blockquote><p>사도들은 금식으로 자신이 하느님의 일꾼임을 보여 줍니다:</p><blockquote><p>“오직 모든 일에 하나님의 일꾼으로 자천하여 많이 견디는 것과 환난과 궁핍과 고난과 매 맞음과 갇힘과 난동과 수고로움과 자지 못함과 <strong>먹지 못함</strong> 가운데서도 깨끗함과 지식과 오래 참음과 자비함과 성령의 감화와 거짓이 없는 사랑과” (<a href="https://bibleox.com/ko/ko-nkrv/2kor/6/#L4-6">고후 6:4-6</a>) <em>(그리스어: ἐν νηστείαις, “금식으로”)</em></p></blockquote><p>사도는 어쩔 수 없이 자랑하는 자신을 나무라면서(<a href="https://bibleox.com/ko/ko-nkrv/2kor/11/#L21">고후 11:21</a>) 금식을 자랑합니다:</p><blockquote><p>“또 수고하며 애쓰고 여러 번 자지 못하고 주리며 목마르고 <strong>여러 번 굶고</strong> 춥고 헐벗었노라” (<a href="https://bibleox.com/ko/ko-nkrv/2kor/11/#L27">고후 11:27</a>) <em>(그리스어: ἐν νηστείαις, “자주 금식하며”)</em></p></blockquote><p>사도는 디모데 주교에게 건강이 나쁘니 금식을 늦추어도 된다고 합니다:</p><blockquote><p>“<strong>이제부터는 물만 마시지 말고</strong> 네 위장과 자주 나는 병을 위하여는 포도주를 조금씩 쓰라” (<a href="https://bibleox.com/ko/ko-nkrv/1tim/5/#L23">딤전 5:23</a>)</p></blockquote><p>선한 일 = 기도 + 금식 + 자선 + 의로움:</p><blockquote><p>“<strong>기도는 금식</strong>과 자선과 의로움과 함께할 때 <strong>좋다</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/tov/12/#L8">토비 12:8</a>, 그리스어에서 번역)</p></blockquote><p>왕이자 예언자인 다윗은 재난의 때에 금식으로 하느님 앞에 자신을 낮추었습니다:</p><blockquote><p>“나는 그들이 병 들었을 때에 굵은 베 옷을 입으며 <strong>금식하여 내 영혼을 괴롭게 하였더니</strong> 내 기도가 내 품으로 돌아왔도다” (<a href="https://bibleox.com/ko/ko-nkrv/ps/35/#L13">시 35:13</a>)</p></blockquote>'
  meta_desc: 주 예수 그리스도와 예언자들, 사도들, 세례 요한의 제자들과 교회는 금식했습니다
