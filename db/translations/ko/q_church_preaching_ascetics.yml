- src: мирный-дух
  path: Pc30s_평화로운_영
  title: 평화로운 영
  copy_cover: true
  body: <h2>하느님의 안식</h2><blockquote><p>“하나님이 그 일곱째 날을 복되게 하사 거룩하게 하셨으니 이는 하나님이 그 창조하시며 만드시던 모든 일을 마치시고 <strong>그 날에 안식하셨음이니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gen/2/#L3">창 2:3</a>)</p></blockquote><blockquote><p>“예수께서 그들에게 이르시되 <strong>내 아버지께서 이제까지 일하시니 나도 일한다</strong> 하시매” (<a href="https://bibleox.com/ko/ko-nkrv/in/5/#L17">요 5:17</a>)</p></blockquote><blockquote><p>“<strong>이미 믿는 우리들은 저 안식에 들어가는도다</strong> 그가 말씀하신 바와 같으니 내가 노하여 맹세한 바와 같이 <strong>그들이 내 안식에 들어오지 못하리라</strong> 하셨다 하였으나 세상을 창조할 때부터 그 일이 이루어졌느니라” (<a href="https://bibleox.com/ko/ko-nkrv/evr/4/#L3">히 4:3</a>; <a href="https://bibleox.com/ko/ko-nkrv/ps/95/#L11">시 95:11</a>; <a href="https://bibleox.com/ko/ko-nkrv/evr/3/#L11">히 3:11</a>)</p></blockquote><h2>하느님의 평화</h2><blockquote><p>“<strong><mark>평안을 너희에게 끼치노니 곧 나의 평안을 너희에게 주노라 내가 너희에게 주는 것은 세상이 주는 것과 같지 아니하니라 너희는 마음에 근심하지도 말고 두려워하지도 말라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/in/14/#L27">요 14:27</a>)</p></blockquote><blockquote><p>“나는 마음이 온유하고 겸손하니 <strong>나의 멍에를 메고 내게 배우라</strong> 그리하면 <strong><mark>너희 마음이 쉼을 얻으리니</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/11/#L29">마 11:29</a>)</p></blockquote><blockquote><p>“그리하면 <strong><mark>모든 지각에 뛰어난 하나님의 평강이</mark></strong> 그리스도 예수 안에서 <strong><mark>너희 마음과 생각을 지키시리라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/fil/4/#L7">빌 4:7</a>)</p></blockquote><blockquote><p>“<strong>이미 그의 안식에 들어간 자는 하나님이 자기의 일을 쉬심과 같이 그도 자기의 일을 쉬느니라</strong> 그러므로 우리가 <strong><mark>저 안식에 들어가기를 힘쓸지니</mark></strong> 이는 누구든지 저 순종하지 아니하는 본에 빠지지 않게 하려 함이라” (<a href="https://bibleox.com/ko/ko-nkrv/evr/4/#L10-11">히 4:10-11</a>)</p></blockquote><blockquote><p>“여호와께서 너희를 위하여 싸우시리니 <strong>너희는 가만히 있을지니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ish/14/#L14">출 14:14</a>)</p></blockquote><blockquote><p>“여호와께서 이르시되 내가 친히 가리라 <strong>내가 너를 쉬게 하리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ish/33/#L14">출 33:14</a>)</p></blockquote><blockquote><p>“내가 또 내 백성 이스라엘을 위하여 한 곳을 정하여 <strong>그들을 심고 그들이 그 곳에 거주하면서 다시는 옮겨가지 아니하게 하며</strong> 악한 사람들에게 전과 같이 그들을 해치지 못하게 하여” (<a href="https://bibleox.com/ko/ko-nkrv/1par/17/#L9">대상 17:9</a>)</p></blockquote><blockquote><p>“그러므로 내가 노하여 맹세하기를 그들은 <strong>내 안식</strong>에 들어오지 못하리라 하였도다” (<a href="https://bibleox.com/ko/ko-nkrv/ps/95/#L11">시 95:11</a>)</p></blockquote>
