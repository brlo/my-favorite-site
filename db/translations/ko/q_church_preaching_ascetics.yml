  title: 사도들은 공동체를 오래 가르쳤습니다
  copy_cover: true
  body: <p>사도 바울로는 아시아의 원로들을 3년 동안 가르쳤습니다:</p><blockquote><p>“그러므로 여러분은 언제나 깨어 있으시오. 그리고 내가 <strong>삼 년 동안이나 밤낮으로 눈물을 흘리며 각 사람에게 쉬지 않고 훈계하던</strong> 것을 잊지 마시오.” (<a href="https://bibleox.com/ko/ko-ctb/act/20/#L31">사도 20:31</a>)</p></blockquote><p>사도 바울로는 에페소의 그리스도인들을 2년 3개월 동안 가르쳤습니다:</p><blockquote><p>“바울로는 <strong>석 달 동안</strong> 회당을 드나들며 대담하게 증언하고 하느님 나라에 관하여 토론도 하고 알아 듣도록 설명도 해 주었다. 그러나 어떤 사람들은 오히려 마음이 더 굳어져서 믿으려 하지 않고 바울로가 전하는 그리스도교를 회중 앞에서 비난하였다. 그래서 바울로는 그들과 손을 끊고 신도들을 데리고 나가 디란노 학원에서 날마다 토론을 벌였다. 이렇게 <strong>두 해를</strong> 계속하는 동안에 아시아에 사는 사람들은 유다인이나 이방인이나 할 것 없이 모두 주님의 말씀을 듣게 되었다.” (<a href="https://bibleox.com/ko/ko-ctb/act/19/#L8-10">사도 19:8-10</a>)</p></blockquote>
  meta_desc: 사도들이 공동체를 오래 가르친 일에 관한 성경 구절
