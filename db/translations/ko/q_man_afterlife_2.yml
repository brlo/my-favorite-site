  title: 그리스도의 부활 이전에는 모든 사람의 혼이 음부로 내려갔습니다
  copy_cover: true
  body: '<h2>구약의 의인들은 죽은 뒤 음부로 내려간다고 말합니다</h2><blockquote><p>“나의 날이 지나갔고 내 계획, 내 마음의 소원이 다 끊어졌구나 그들은 밤으로 낮을 삼고 빛 앞에서 어둠이 가깝다 하는구나 <strong><mark>내가 스올이 내 집이 되기를 희망하여 내 침상을 흑암에 펴놓으매</mark></strong> 무덤에게 너는 내 아버지라, 구더기에게 너는 내 어머니, 내 자매라 할지라도 <strong>나의 희망이 어디 있으며</strong> 나의 희망을 누가 보겠느냐 우리가 흙 속에서 쉴 때에는 <strong><mark>희망이 스올의 문으로 내려갈 뿐이니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/iov/17/#L11-16">욥 17:11-16</a>)</p></blockquote><blockquote><p>“그의 모든 자녀가 위로하되 그가 그 위로를 받지 아니하여 이르되 <strong><mark>내가 슬퍼하며 스올로 내려가 아들에게로 가리라</mark></strong> 하고 그의 아버지가 그를 위하여 울었더라” (<a href="https://bibleox.com/ko/ko-nkrv/gen/37/#L35">창 37:35</a>)</p></blockquote><blockquote><p>“<strong><mark>모든 사람의 결국은 일반이라</mark></strong> 이것은 해 아래에서 행해지는 모든 일 중의 악한 것이니 곧 인생의 마음에는 악이 가득하여 그들의 평생에 미친 마음을 품고 있다가 <strong><mark>후에는 죽은 자들에게로 돌아가는 것이라 모든 산 자들 중에 들어 있는 자에게는 누구나 소망이 있음은 산 개가 죽은 사자보다 낫기 때문이니라</mark></strong> 산 자들은 죽을 줄을 알되 죽은 자들은 아무것도 모르며 그들이 다시는 상을 받지 못하는 것은 그들의 이름이 잊어버린 바 됨이니라” (<a href="https://bibleox.com/ko/ko-nkrv/ekl/9/#L3-5">전 9:3-5</a>)</p></blockquote><blockquote><p>“나의 때가 얼마나 짧은지 기억하소서 주께서 모든 사람을 어찌 그리 허무하게 창조하셨는지요 <strong><mark>누가 살아서 죽음을 보지 아니하고 자기의 영혼을 스올의 권세에서 건지리이까</mark></strong> (셀라)” (<a href="https://bibleox.com/ko/ko-nkrv/ps/89/#L47-48">시 89:47-48</a>)</p></blockquote><h2>그리스도의 부활 뒤 하늘 실재의 변화</h2><p>그리스도 이전에는 세상을 떠난 의인들의 혼이 하늘에서 하느님과 함께하는 삶에 이르지 못했다는 것을 확인하려면, 그리스도 이전과 그리스도의 부활 이후의 하늘 실재에 대한 묘사를 비교해 볼 수 있습니다.</p><p>그리스도 이전에 하늘 실재는 산 위에서 선지자 모세에게 보여졌습니다. 선지자가 본 모습대로 땅의 성전(성막, 성소)을 짓게 하려는 것이었습니다:</p><blockquote><p>“내가 그들 중에 거할 <strong>성소를</strong> <strong><mark>그들이 나를 위하여 짓되</mark></strong> <strong><mark>무릇 내가 네게 보이는 모양대로</mark></strong> <strong>장막을 짓고</strong> 기구들도 그 모양을 따라 <strong>지을지니라</strong> &lt;…&gt; 너는 삼가 <strong>이 산에서 네게 보인 양식대로 할지니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ish/25/#L8-9,40">출 25:8-9,40</a>)</p></blockquote><blockquote><p>“그리스도께서는 <strong><mark>참 것의 그림자인 손으로 만든 성소에</mark></strong> 들어가지 아니하시고 바로 그 하늘에 들어가사 이제 우리를 위하여 하나님 앞에 나타나시고” (<a href="https://bibleox.com/ko/ko-nkrv/evr/9/#L24">히 9:24</a>)</p></blockquote><p>구약 성전의 <a href="https://bibleox.com/ru/ru/w/иерусалимский-храм">구조</a>와 형상들을 살펴보면, 그리스도의 희생 이전에는 하늘에 하느님(보이지 않게)과 거룩한 천사들만 있다는 것을 알 수 있습니다(<a href="https://bibleox.com/ko/ko-nkrv/3ts/6/#L29">왕상 6:29</a>).</p><p>그리스도의 부활과 승천 뒤에는 인성으로 보이시는 하느님께서 하늘에 앉아 계시며(<a href="https://bibleox.com/ko/ko-nkrv/ef/1/#L20-21">엡 1:20-21</a>; <a href="https://bibleox.com/ko/ko-nkrv/otkr/3/#L21">계 3:21</a>), 그곳에는 여전히 천사들이 있고(<a href="https://bibleox.com/ko/ko-nkrv/otkr/8/#L3">계 8:3</a>; <a href="https://bibleox.com/ko/ko-nkrv/otkr/15/#L6">계 15:6</a>), 의인들의 혼도 나타납니다(<a href="https://bibleox.com/ko/ko-nkrv/otkr/6/#L9-11">계 6:9-11</a>; <a href="https://bibleox.com/ko/ko-nkrv/otkr/14/#L1,3-5">계 14:1,3-5</a>). 우리는 이 새 하늘 실재를 신학자 요한의 계시록에서 봅니다.</p><p>이처럼 새 하늘 실재에는 하느님과 천사들 말고도, 그리스도의 부활 이전에는 그곳에 없던 의인들의 혼이 나타납니다.</p><h3>구약 — 성전에는 하느님과 천사들만</h3><p>그리스도의 희생 이전, 구약에서 하느님께서는 산 위에서 선지자 모세에게 성전을 보여 주시며, 땅에서 모든 것을 보여 주신 모습대로 만들라고 명하십니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/25/#L8-9,40">출 25:8-9,40</a>; <a href="https://bibleox.com/ko/ko-nkrv/evr/9/#L24">히 9:24</a>). 결국 모세는 하느님을 어떤 모습으로도 나타내지 않은 성전을 짓고, 하느님께서 나타나시는 곳(궤의 덮개) 둘레에는 천사들의 상을 두며, 모든 벽과 휘장에도 천사들의 형상이 있습니다.</p><h4>보이지 않는 하느님</h4><p>하느님의 명령으로 지은 구약의 성전에는 하느님의 형상이 없었습니다. 하느님은 보이지 않으셨기 때문입니다. 가장 중요한 곳에는 거룩한 물건들이 담긴 궤(상자)만 있었고, 그 덮개 위 두 그룹 사이에서 하느님께서 나타나시고 말씀하셨습니다:</p><blockquote><p>“<strong>거기서 내가 너와 만나고 속죄소 위 곧 증거궤 위에 있는 두 그룹 사이에서</strong> 내가 이스라엘 자손을 위하여 네게 명령할 모든 일을 네게 이르리라” (<a href="https://bibleox.com/ko/ko-nkrv/ish/25/#L22">출 25:22</a>)</p></blockquote><h4>거룩한 천사들</h4><p>성전은 곳곳이 천사(그룹)의 형상으로 가득했습니다:</p><blockquote><p>“<strong>금으로 그룹 둘을</strong> <strong>속죄소 두 끝에</strong> 쳐서 만들되 한 그룹은 이 끝에, 또 한 그룹은 저 끝에 곧 속죄소 두 끝에 속죄소와 한 덩이로 연결할지며 그룹들은 그 날개를 높이 펴서 그 날개로 속죄소를 덮으며 그 얼굴을 서로 대하여 속죄소를 향하게 하고” (<a href="https://bibleox.com/ko/ko-nkrv/ish/25/#L18-20">출 25:18-20</a>)</p></blockquote><blockquote><p>“<strong>내소 안에 감람나무로 두 그룹을 만들었는데</strong> 그 높이가 각각 십 규빗이라 &lt;…&gt; <strong>솔로몬이 내소 가운데에 그룹을 두었으니</strong> 그룹들의 날개가 퍼져 있는데 이쪽 그룹의 날개는 이쪽 벽에 닿았고 저쪽 그룹의 날개는 저쪽 벽에 닿았으며 두 날개는 성전의 중앙에서 서로 닿았더라” (<a href="https://bibleox.com/ko/ko-nkrv/3ts/6/#L23,27">왕상 6:23,27</a>)</p></blockquote><blockquote><p>“청색 자색 홍색 실과 고운 베로 <strong>휘장문을</strong> 짓고 <strong>그 위에 그룹의 형상을 수놓았더라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2par/3/#L14">대하 3:14</a>; <a href="https://bibleox.com/ko/gr-lxx-byz/1mak/1/#L22">1마카 1:22</a>)</p></blockquote><blockquote><p>“<strong>내 외소 사방 벽에는 모두 그룹들과 종려와 핀 꽃 형상을 아로새겼고</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/3ts/6/#L29">왕상 6:29</a>)</p></blockquote><p>성전의 구조에 대해 자세히: <a href="https://bibleox.com/ru/ru/w/иерусалимский-храм">예루살렘 성전</a> (러시아어)</p><h3>신약 — 성전에는 하느님과 천사들과 의인들의 혼</h3><p>하느님의 아들께서 사람이 되시고 죽음을 이기신 뒤, 우리는 다른 하늘 실재를 봅니다. 신학자 요한은 계시록에서 그것을 묘사합니다. 첫째, 하느님께서 보이게 되시고 보좌에 앉으십니다. 둘째, 이제 하늘에서는 천사들만이 아니라 거룩한 의인들의 수많은 혼도 그분을 섬깁니다.</p><h4>그리스도</h4><blockquote><p>“주 예수께서 말씀을 마치신 후에 하늘로 올려지사 <strong><mark>하나님 우편에 앉으시니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mk/16/#L19">막 16:19</a>)</p></blockquote><blockquote><p>“그의 능력이 그리스도 안에서 역사하사 죽은 자들 가운데서 다시 살리시고 <strong><mark>하늘에서 자기의 오른편에 앉히사</mark></strong> 모든 통치와 권세와 능력과 주권과 이 세상뿐 아니라 오는 세상에 일컫는 모든 이름 위에 뛰어나게 하시고” (<a href="https://bibleox.com/ko/ko-nkrv/ef/1/#L20-21">엡 1:20-21</a>)</p></blockquote><blockquote><p>“이기는 그에게는 내가 <strong>내 보좌에</strong> 함께 앉게 하여 주기를 내가 이기고 <strong><mark>아버지 보좌에 함께 앉은 것과 같이</mark></strong> 하리라” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/3/#L21">계 3:21</a>)</p></blockquote><h4>거룩한 천사들</h4><blockquote><p>“또 다른 <strong>천사가</strong> 와서 제단 곁에 서서 금 향로를 가지고 많은 향을 받았으니 이는 모든 성도의 기도와 합하여 보좌 앞 금 제단에 드리고자 함이라” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/8/#L3">계 8:3</a>)</p></blockquote><blockquote><p>“일곱 재앙을 가진 <strong>일곱 천사가</strong> 성전으로부터 나와 맑고 빛난 세마포 옷을 입고 가슴에 금 띠를 띠고” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/15/#L6">계 15:6</a>)</p></blockquote><h4>거룩한 의인들의 혼</h4><blockquote><p>“다섯째 인을 떼실 때에 내가 보니 <strong><mark>하나님의 말씀과 그들이 가진 증거로 말미암아 죽임을 당한 영혼들이 제단 아래에 있어</mark></strong> 큰 소리로 불러 이르되 거룩하고 참되신 대주재여 땅에 거하는 자들을 심판하여 우리 피를 갚아 주지 아니하시기를 어느 때까지 하시려 하나이까 하니 각각 그들에게 <strong>흰 두루마기를</strong> 주시며 이르시되 아직 잠시 동안 쉬되 <strong>그들의 동무 종들과 형제들도 자기처럼 죽임을 당하여 그 수가 차기까지</strong> 하라 하시더라” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/6/#L9-11">계 6:9-11</a>)</p></blockquote><blockquote><p>“또 내가 보니 보라 <strong>어린 양이</strong> 시온 산에 섰고 <strong><mark>그와 함께 십사만 사천이 서 있는데</mark></strong> 그들의 이마에는 어린 양의 이름과 그 아버지의 이름을 쓴 것이 있더라 &lt;…&gt; 그들이 보좌 앞과 네 생물과 장로들 앞에서 새 노래를 부르니 <strong><mark>땅에서 속량함을 받은</mark></strong> 십사만 사천 밖에는 능히 이 노래를 배울 자가 없더라 이 사람들은 <strong>여자와 더불어 더럽히지 아니하고</strong> 순결한 자라 <strong>어린 양이 어디로 인도하든지 따라가는 자며</strong> 사람 가운데에서 속량함을 받아 처음 익은 열매로 하나님과 어린 양에게 속한 자들이니 그 입에 거짓말이 없고 흠이 없는 자들이더라” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/14/#L1,3-5">계 14:1,3-5</a>)</p></blockquote><h2>하늘에서 내려온 아들 말고는 아무도 하늘에 올라가지 않았습니다</h2><blockquote><p>“<strong><mark>하늘에서 내려온 자 곧 인자 외에는 하늘에 올라간 자가 없느니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/in/3/#L13">요 3:13</a>)</p></blockquote><blockquote><p>“형제들아 내가 <strong>조상 다윗에 대하여 담대히 말할 수 있노니 다윗이 죽어 장사되어</strong> 그 묘가 오늘까지 우리 중에 있도다 &lt;…&gt; <strong><mark>다윗은 하늘에 올라가지 못하였으나</mark></strong> 친히 말하여 이르되 주께서 내 주에게 말씀하시기를” (<a href="https://bibleox.com/ko/ko-nkrv/act/2/#L29,34">행 2:29,34</a>)</p></blockquote><h2>“내 영혼을 음부에 버리지 아니하시며” — 다윗에 관한 말씀이 아닙니다</h2><p>다윗 왕이 시편에서 말한 예언(<a href="https://bibleox.com/ko/ko-nkrv/ps/16/#L10">시 16:10</a>), 곧 혼이 음부에 버려지지 않고 육신이 썩음을 당하지 않으리라는 예언은 다윗이 아니라 그리스도에 관한 것입니다. 그러므로 다윗 왕의 <strong>육신</strong>은 썩음을 당했고, 그의 <strong>혼</strong>은 그리스도께서 음부에 내려가실 때까지 음부에 남아 있었습니다.</p><blockquote><p>“이는 내 영혼을 음부에 버리지 아니하시며 주의 거룩한 자로 썩음을 당하지 않게 하실 것임이로다 &lt;…&gt; 형제들아 내가 <strong>조상 다윗에 대하여 담대히 말할 수 있노니 다윗이 죽어 장사되어</strong> 그 묘가 오늘까지 우리 중에 있도다 &lt;…&gt; 미리 본 고로 <strong><mark>그리스도의 부활을 말하되 그가 음부에 버림이 되지 않고 그의 육신이 썩음을 당하지 아니하시리라</mark></strong> 하더니 &lt;…&gt; <strong>다윗은 하늘에 올라가지 못하였으나</strong> 친히 말하여 이르되 주께서 내 주에게 말씀하시기를” (<a href="https://bibleox.com/ko/ko-nkrv/act/2/#L27,29,31,34">행 2:27,29,31,34</a>) <em>(31절, 비잔틴 본문(다수 사본): “<strong>그의 혼이</strong> 음부에 버림이 되지 않고”(ἡ ψυχὴ αὐτοῦ).)</em></p></blockquote><h2>그리스도께서는 음부에 내려가 선포하시고, 친히 나오시며 의인들을 음부에서 이끌어 내셨습니다</h2><p>음부에서 그리스도께서는 온 세상의 홍수 때부터 그곳에 있던 영들(혼들)에게 선포하셨습니다:</p><blockquote><p>“그리스도께서도 단번에 죄를 위하여 죽으사 의인으로서 불의한 자를 대신하셨으니 이는 우리를 하나님 앞으로 인도하려 하심이라 <strong>육체로는 죽임을 당하시고 영으로는 살리심을 받으셨으니</strong> <strong><mark>그가 또한 영으로 가서 옥에 있는 영들에게 선포하시니라</mark></strong> 그들은 전에 노아의 날 방주를 준비할 동안 하나님이 오래 참고 기다리실 때에 복종하지 아니하던 자들이라 방주에서 물로 말미암아 구원을 얻은 자가 몇 명뿐이니 겨우 여덟 명이라” (<a href="https://bibleox.com/ko/ko-nkrv/1pet/3/#L18-20">벧전 3:18-20</a>; <a href="https://bibleox.com/ko/ko-nkrv/1pet/4/#L5-6">벧전 4:5-6</a>)</p></blockquote><blockquote><p>“이를 위하여 <strong>죽은 자들에게도 복음이 전파되었으니</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1pet/4/#L6">벧전 4:6</a>)</p></blockquote><h2>의인들은 음부의 포로였지만 그리스도께서 이 포로 상태를 없애셨습니다</h2><blockquote><p>“그러므로 이르기를 그가 위로 올라가실 때에 <strong><mark>사로잡혔던 자들을 사로잡으시고</mark></strong> 그 사람들에게 선물을 주셨다 하였도다 <strong>올라가셨다 하였은즉 땅 아래 낮은 곳으로 내리셨던 것이 아니면 무엇이냐</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ef/4/#L8-9">엡 4:8-9</a>)</p></blockquote><blockquote><p>“내가 볼 때에 그의 발 앞에 엎드러져 죽은 자 같이 되매 그가 오른손을 내게 얹고 이르시되 두려워하지 말라 나는 처음이요 마지막이니 곧 살아 있는 자라 내가 전에 죽었었노라 볼지어다 이제 세세토록 살아 있어 <strong><mark>사망과 음부의 열쇠를 가졌노니</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/1/#L17-18">계 1:17-18</a>)</p></blockquote><h2>구약의 의인들은 모두 약속을 받지 못했으며, 신약의 의인들 없이는 온전해지지 못했습니다</h2><p>그들은 하늘의 것을 기다리며 바랐지만 받지 못했습니다:</p><blockquote><p>“믿음은 <strong>바라는 것들의</strong> <strong>실상이요</strong> 보이지 않는 것들의 증거니 선진들이 이로써 증거를 얻었느니라 &lt;…&gt; 믿음으로 아벨은 가인보다 더 나은 제사를 하나님께 드림으로 의로운 자라 하시는 증거를 얻었으니 하나님이 그 예물에 대하여 증언하심이라 그가 죽었으나 그 믿음으로써 지금도 말하느니라 믿음으로 에녹은 죽음을 보지 않고 옮겨졌으니 하나님이 그를 옮기심으로 다시 보이지 아니하였느니라 그는 옮겨지기 전에 하나님을 기쁘시게 하는 자라 하는 증거를 받았느니라 &lt;…&gt; 믿음으로 노아는 아직 보이지 않는 일에 경고하심을 받아 경외함으로 방주를 준비하여 그 집을 구원하였으니 이로 말미암아 세상을 정죄하고 믿음을 따르는 의의 상속자가 되었느니라 믿음으로 아브라함은 부르심을 받았을 때에 순종하여 장래의 유업으로 받을 땅에 나아갈새 갈 바를 알지 못하고 나아갔으며 믿음으로 그가 <strong>이방의 땅에 있는 것 같이 약속의 땅에 거류하여</strong> 동일한 약속을 유업으로 함께 받은 이삭 및 야곱과 더불어 장막에 거하였으니 이는 그가 <strong><mark>하나님이 계획하시고 지으실 터가 있는 성을 바랐음이라</mark></strong> 믿음으로 사라 자신도 나이가 많아 단산하였으나 잉태할 수 있는 힘을 얻었으니 이는 약속하신 이를 미쁘신 줄 알았음이라 &lt;…&gt; <strong><mark>이 사람들은 다 믿음을 따라 죽었으며 약속을 받지 못하였으되</mark></strong> <strong><mark>그것들을 멀리서 보고 환영하며</mark></strong> 또 땅에서는 외국인과 나그네임을 증언하였으니 그들이 이같이 말하는 것은 자기들이 본향 찾는 자임을 나타냄이라 그들이 나온 바 본향을 생각하였더라면 돌아갈 기회가 있었으려니와 그들이 이제는 <strong><mark>더 나은 본향을 사모하니 곧 하늘에 있는 것이라</mark></strong> 이러므로 하나님이 그들의 하나님이라 일컬음 받으심을 부끄러워하지 아니하시고 <strong><mark>그들을 위하여 한 성을 예비하셨느니라</mark></strong> 아브라함은 시험을 받을 때에 믿음으로 이삭을 드렸으니 그는 약속들을 받은 자로되 그 외아들을 드렸느니라 &lt;…&gt; 믿음으로 이삭은 장차 있을 일에 대하여 야곱과 에서에게 축복하였으며 믿음으로 야곱은 죽을 때에 요셉의 각 아들에게 축복하고 그 지팡이 머리에 의지하여 경배하였으며 믿음으로 요셉은 임종시에 이스라엘 자손들이 떠날 것을 말하고 또 자기 뼈를 위하여 명하였으며 믿음으로 모세가 났을 때에 그 부모가 아름다운 아이임을 보고 석 달 동안 숨겨 왕의 명령을 무서워하지 아니하였으며 &lt;…&gt; 내가 무슨 말을 더 하리요 기드온, 바락, 삼손, 입다, 다윗 및 사무엘과 선지자들의 일을 말하려면 내게 시간이 부족하리로다 &lt;…&gt; <strong><mark>이 사람들은 다 믿음으로 말미암아 증거를 받았으나 약속된 것을 받지 못하였으니</mark></strong> 이는 하나님이 우리를 위하여 더 좋은 것을 예비하셨은즉 <strong><mark>우리가 아니면 그들로 온전함을 이루지 못하게 하려 하심이라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/evr/11/#L1-2,4-5,7-11,13-17,20-23,32,39-40">히 11:1-2,4-5,7-11,13-17,20-23,32,39-40</a>)</p></blockquote><h2>그리스도의 희생은 믿는 의인들을 전에 지은 죄에서 해방합니다</h2><blockquote><p>“우리가 알거니와 무릇 율법이 말하는 바는 율법 아래에 있는 자들에게 말하는 것이니 이는 모든 입을 막고 온 세상으로 하나님의 심판 아래에 있게 하려 함이라 그러므로 <strong><mark>율법의 행위로 그의 앞에 의롭다 하심을 얻을 육체가 없나니</mark></strong> 율법으로는 죄를 깨달음이니라 <strong><mark>이제는 율법 외에 하나님의 한 의가 나타났으니</mark></strong> <strong><mark>율법과 선지자들에게 증거를 받은 것이라 곧 예수 그리스도를 믿음으로 말미암아 모든 믿는 자에게 미치는 하나님의 의니</mark></strong> <strong><mark>차별이 없느니라</mark></strong> <strong><mark>모든 사람이 죄를 범하였으매 하나님의 영광에 이르지 못하더니 그리스도 예수 안에 있는 속량으로 말미암아 하나님의 은혜로 값 없이 의롭다 하심을 얻은 자 되었느니라 이 예수를 하나님이 그의 피로써 믿음으로 말미암는 화목제물로 세우셨으니</mark></strong> 이는 하나님께서 길이 참으시는 중에 <strong><mark>전에 지은 죄를 간과하심으로</mark></strong> 자기의 의로우심을 <strong><mark>나타내려 하심이니 곧 이 때에 자기의 의로우심을 나타내사</mark></strong> 자기도 의로우시며 또한 예수 믿는 자를 의롭다 하려 하심이라 그런즉 자랑할 데가 어디냐 있을 수가 없느니라 무슨 법으로냐 행위로냐 아니라 오직 믿음의 법으로니라” (<a href="https://bibleox.com/ko/ko-nkrv/rim/3/#L19-27">롬 3:19-27</a>)</p></blockquote>'
  title_sub: 의인들의 혼을 포함한 모든 혼은 죽을 때 몸에서 떨어진 뒤 음부로 내려갔습니다
