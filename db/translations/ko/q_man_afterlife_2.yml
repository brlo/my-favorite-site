    title: 그리스도 이전에는 모두 음부로
    priority: 6
  references: '<ol><li><p>“그러나 의인들은 썩지 않고 시들지 않는 나라를 얻을 것이다. 그들은 지금 음부에 머물러 있지만, 불의한 자들과 같은 곳에 있지 않다. 이곳으로 내려가는 길은 하나인데, 그 문에는 천사장이 군대와 함께 서 있다고 우리는 믿는다. 혼들을 맡은 천사들에게 인도된 이들이 이 문을 지나면, 모두 같은 길로 가지 않는다. 의인들은 빛 속에서 오른쪽으로 인도되고, 그곳에 선 천사들의 찬송을 받으며, 빛으로 가득한 곳에 이른다. 그곳에는 처음부터의 의인들이 필연에 매이지 않고 산다. 그들은 눈앞에 있는 좋은 것들을 늘 바라보며 즐거워하고, 언제나 새로운 다른 좋은 것들을 기대하며 기뻐하고, 그것들이 이것들보다 늘 더 낫다고 여긴다. 그곳은 그들에게 아무 수고도 주지 않는다. 거기에는 타는 듯한 더위도, 추위도, 가시도 없다. 조상들과 의인들의 얼굴은 늘 미소를 띠고 있으며, 그들은 이곳 다음에 올 하늘의 안식과 영원한 소생을 기다린다. 우리는 그곳을 아브라함의 품이라고 부른다…</p><p>음부에 관해서는 이만큼만 말하겠다. 하느님께서 정하신 때까지 모든 이의 혼이 그곳에 머물러 있다. 그때에 그분께서는 혼들을 다른 몸으로 옮기는 것이 아니라 몸 자체를 일으키시어 모든 이를 부활시키실 것이다.”</p><p>로마의 성 순교자 히폴리토스, <a href="https://bibleox.com/en/en/w/hippolytus-against-plato-on-the-cause-of-the-universe/">“플라톤을 반박하여, 우주의 원인에 관하여”</a> (영어 번역에서 옮김)</p><p>“아브라함의 품이란 조상들의 숨은 안식이 아니고 무엇이겠습니까? 진리께서는 그것에 대해 이렇게 말씀하십니다. 내가 너희에게 이르노니 동서로부터 많은 사람이 이르러 아브라함과 이삭과 야곱과 함께 천국에 앉으려니와(마 8:11-12). 자색 옷과 고운 베옷을 입은 자는 마땅히 나라의 본 자손이라 불립니다. 그는 멀리서 나사로를 보려고 눈을 들었습니다. 믿지 않는 이들은 정죄받은 아래쪽에 있으면서, 마지막 심판의 날까지 자기들 위에서 안식하는 모든 신자를 바라보지만, 그 뒤에는 그들의 기쁨을 결코 볼 수 없기 때문입니다.”</p><p>대화자 그레고리우스, “복음서 강론 40편” 중 40 (러시아어 번역에서 옮김).</p></li></ol><p>번역: 로디온 블라소프 (AI 도구 활용). 저본: 러시아어 원문. 참고: 영어·일본어 번역. 성경 인용과 링크는 개역개정에 따름.</p>'
- src: bib_Неодинаковая_мера_воздаяния:_мучения_и_блаженства
  path: Ud50m_같지_않은_보응
  title: '같지 않은 보응: 고통과 복'
  copy_cover: true
  body: <h2>지옥의 고통은 같지 않습니다</h2><h3>알고도 어긴 사람은 모르고 어긴 사람보다 더 무거운 벌을 받습니다</h3><blockquote><p>“<strong>주인의 뜻을 알고도</strong> 준비하지 아니하고 <strong><mark>그 뜻대로 행하지 아니한 종은 많이 맞을 것이요 알지 못하고</mark></strong> <strong><mark>맞을 일을 행한 종은 적게 맞으리라</mark></strong> 무릇 많이 받은 자에게는 많이 요구할 것이요 <strong>많이 맡은 자에게는 많이 달라 할 것이니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/lk/12/#L47-48">눅 12:47-48</a>)</p></blockquote><h3>외식하는 자들은 더 엄중한 심판을 받을 것입니다</h3><blockquote><p>“화 있을진저 외식하는 서기관들과 바리새인들이여, 너희는 과부의 가산을 삼키고 남에게 보이려고 길게 기도하니, <strong>그러므로 더 엄중한 심판을 받으리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/23/#L13">마 23:13</a>) <em>(마태복음 23:14. 개역개정에는 이 절이 없습니다(“없음”). 비잔틴 본문(다수 사본)에서는 13절에 있어 옮겼습니다.)</em></p></blockquote><blockquote><p>“긴 옷을 입고 다니는 것을 원하며 시장에서 문안 받는 것과 회당의 높은 자리와 잔치의 윗자리를 좋아하는 <strong>서기관들을 삼가라</strong> 그들은 과부의 가산을 삼키며 외식으로 길게 기도하니 <strong><mark>그들이 더 엄중한 심판을 받으리라</mark></strong> 하시니라” (<a href="https://bibleox.com/ko/ko-nkrv/lk/20/#L46-47">눅 20:46-47</a>)</p></blockquote><h3>죄를 짓는 교사는 더 큰 심판을 받을 것입니다</h3><blockquote><p>“내 형제들아 너희는 <strong><mark>선생된 우리가 더 큰 심판을 받을 줄 알고 선생이 많이 되지 말라</mark></strong> 우리가 다 실수가 많으니 만일 말에 실수가 없는 자라면 곧 온전한 사람이라 능히 온 몸도 굴레 씌우리라” (<a href="https://bibleox.com/ko/ko-nkrv/iak/3/#L1-2">약 3:1-2</a>)</p></blockquote><h3>그리스도 이전의 죄 많은 성읍들이, 분명한 기적을 보고도 그리스도를 거부한 성읍들보다 심판 날에 견디기 쉬울 것입니다</h3><blockquote><p>“내가 너희에게 이르노니 <strong>심판 날에 두로와 시돈이 너희보다 견디기 쉬우리라</strong> 가버나움아 네가 하늘에까지 높아지겠느냐 음부에까지 낮아지리라 네게 행한 모든 권능을 소돔에서 행하였더라면 그 성이 오늘까지 있었으리라 내가 너희에게 이르노니 <strong><mark>심판 날에 소돔 땅이 너보다 견디기 쉬우리라</mark></strong> 하시니라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/11/#L22-24">마 11:22-24</a>)</p></blockquote><blockquote><p>“어느 곳에서든지 <strong>너희를 영접하지 아니하고</strong> 너희 말을 듣지도 아니하거든 거기서 나갈 때에 발 아래 먼지를 떨어버려 그들에게 증거를 삼으라 하시니” (<a href="https://bibleox.com/ko/ko-nkrv/mk/6/#L11">막 6:11</a>; <a href="https://bibleox.com/ko/ko-nkrv/mf/10/#L14-15">마 10:14-15</a>) <em>(비잔틴 본문(다수 사본)의 마가복음 6:11에는 “<strong>내가 진실로 너희에게 이르노니 심판 날에 소돔과 고모라가 그 성보다 견디기 쉬우리라</strong>”가 이어집니다. 마태복음 10:15에도 같은 말씀이 있습니다.)</em></p></blockquote><blockquote><p>“화 있을진저 고라신아, 화 있을진저 벳새다야, 너희에게 행한 모든 권능을 두로와 시돈에서 행하였더라면 그들이 벌써 베옷을 입고 재에 앉아 회개하였으리라 <strong><mark>심판 때에 두로와 시돈이 너희보다 견디기 쉬우리라</mark></strong> 가버나움아 네가 하늘에까지 높아지겠느냐 음부에까지 낮아지리라” (<a href="https://bibleox.com/ko/ko-nkrv/lk/10/#L13-15">눅 10:13-15</a>; <a href="https://bibleox.com/ko/ko-nkrv/mf/11/#L20-22">마 11:20-22</a>)</p></blockquote><h3>실족하게 하는 자에게는 화가 있습니다</h3><blockquote><p>“예수께서 제자들에게 이르시되 <strong><mark>실족하게 하는 것이 없을 수는 없으나 그렇게 하게 하는 자에게는 화로다 그가 이 작은 자 중의 하나를 실족하게 할진대 차라리 연자맷돌이 그 목에 매여 바다에 던져지는 것이 나으리라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/lk/17/#L1-2">눅 17:1-2</a>)</p></blockquote><h3>믿는 이들을 실족하게 하는 자에게는 화가 있습니다</h3><blockquote><p>“또 누구든지 내 이름으로 이런 어린 아이 하나를 영접하면 곧 나를 영접함이니 <strong><mark>누구든지 나를 믿는 이 작은 자 중 하나를 실족하게 하면 차라리 연자 맷돌이 그 목에 달려서 깊은 바다에 빠뜨려지는 것이 나으니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/18/#L5-6">마 18:5-6</a>)</p></blockquote><h3>그리스도를 판 자에게는 화가 있으며, 그는 차라리 태어나지 않았더라면 좋았을 것입니다</h3><blockquote><p>“인자는 자기에 대하여 기록된 대로 가거니와 <strong><mark>인자를 파는 그 사람에게는 화가 있으리로다 그 사람은 차라리 태어나지 아니하였더라면 제게 좋을 뻔하였느니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/26/#L24">마 26:24</a>; <a href="https://bibleox.com/ko/ko-nkrv/mk/14/#L21">막 14:21</a>; <a href="https://bibleox.com/ko/ko-nkrv/lk/22/#L22">눅 22:22</a>)</p></blockquote><h2>하늘 나라의 복은 같지 않습니다</h2><h3>선의 분량에 따른 상</h3><blockquote><p>“기쁜 마음으로 섬기기를 주께 하듯 하고 사람들에게 하듯 하지 말라 이는 <strong><mark>각 사람이 무슨 선을 행하든지 종이나 자유인이나 주께로부터 그대로 받을 줄을 앎이라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ef/6/#L7-8">엡 6:7-8</a>)</p></blockquote><blockquote><p>“나는 심었고 아볼로는 물을 주었으되 오직 하나님께서 자라나게 하셨나니 그런즉 심는 이나 물 주는 이는 아무 것도 아니로되 오직 자라게 하시는 이는 하나님뿐이니라 심는 이와 물 주는 이는 한가지이나 <strong><mark>각각 자기가 일한 대로 자기의 상을 받으리라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/3/#L6-8">고전 3:6-8</a>)</p></blockquote><blockquote><p>“이것이 곧 <strong><mark>적게 심는 자는 적게 거두고 많이 심는 자는 많이 거둔다</mark></strong> 하는 말이로다” (<a href="https://bibleox.com/ko/ko-nkrv/2kor/9/#L6">고후 9:6</a>)</p></blockquote><blockquote><p>“인자가 아버지의 영광으로 그 천사들과 함께 오리니 그 때에 <strong>각 사람이 행한 대로 갚으리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/16/#L27">마 16:27</a>; <a href="https://bibleox.com/ko/ko-nkrv/rim/2/#L5-6">롬 2:5-6</a>)</p></blockquote><blockquote><p>“주라 그리하면 너희에게 줄 것이니 곧 <strong>후히 되어 누르고 흔들어 넘치도록 하여 너희에게 안겨 주리라</strong> <strong><mark>너희가 헤아리는 그 헤아림으로 너희도 헤아림을 도로 받을 것이니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/lk/6/#L38">눅 6:38</a>)</p></blockquote><h3>사도는 더 많은 것을 얻으려고 힘씁니다</h3><blockquote><p>“<strong>내가 이미 얻었다 함도 아니요</strong> 온전히 이루었다 함도 아니라 <strong>오직 내가 그리스도 예수께 잡힌 바 된 그것을 잡으려고 달려가노라</strong> 형제들아 <strong><mark>나는 아직 내가 잡은 줄로 여기지 아니하고</mark></strong> 오직 한 일 즉 뒤에 있는 것은 잊어버리고 앞에 있는 것을 잡으려고 <strong><mark>푯대를 향하여 그리스도 예수 안에서 하나님이 위에서 부르신 부름의 상을 위하여 달려가노라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/fil/3/#L12-14">빌 3:12-14</a>)</p></blockquote><h3>계명을 지키고 남에게도 지키도록 가르치는 사람은 크다 일컬어질 것입니다</h3><blockquote><p>“그러므로 누구든지 이 계명 중의 지극히 작은 것 하나라도 버리고 또 그같이 사람을 가르치는 자는 천국에서 지극히 작다 일컬음을 받을 것이요 <strong><mark>누구든지 이를 행하며 가르치는 자는 천국에서 크다 일컬음을 받으리라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/5/#L19">마 5:19</a>)</p></blockquote><h3>하늘 나라에는 거할 곳이 많습니다</h3><blockquote><p>“<strong>내 아버지 집에 거할 곳이 많도다</strong> 그렇지 않으면 너희에게 일렀으리라 내가 너희를 위하여 거처를 예비하러 가노니” (<a href="https://bibleox.com/ko/ko-nkrv/in/14/#L2">요 14:2</a>)</p></blockquote><h3>선지자의 상과 의인의 상</h3><blockquote><p>“너희를 영접하는 자는 나를 영접하는 것이요 나를 영접하는 자는 나를 보내신 이를 영접하는 것이니라 <strong><mark>선지자의 이름으로 선지자를 영접하는 자는 선지자의 상을 받을 것이요</mark></strong> <strong><mark>의인의 이름으로 의인을 영접하는 자는 의인의 상을 받을 것이요</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/10/#L40-41">마 10:40-41</a>)</p></blockquote><h3>종들은 서로 다르게 상을 받습니다</h3><blockquote><p>“귀인이 왕위를 받아가지고 돌아와서 은화를 준 종들이 각각 어떻게 장사하였는지를 알고자 하여 그들을 부르니 그 첫째가 나아와 이르되 주인이여 당신의 한 므나로 열 므나를 남겼나이다 주인이 이르되 잘하였다 착한 종이여 네가 지극히 작은 것에 충성하였으니 <strong><mark>열 고을 권세를 차지하라</mark></strong> 하고 그 둘째가 와서 이르되 주인이여 당신의 한 므나로 다섯 므나를 만들었나이다 주인이 그에게도 이르되 <strong><mark>너도 다섯 고을을 차지하라</mark></strong> 하고” (<a href="https://bibleox.com/ko/ko-nkrv/lk/19/#L15-19">눅 19:15-19</a>)</p></blockquote><blockquote><p>“또 어떤 사람이 타국에 갈 때 그 종들을 불러 <strong>자기 소유를 맡김과 같으니</strong> <strong>각각 그 재능대로</strong> <strong>한 사람에게는 금 다섯 달란트를, 한 사람에게는 두 달란트를, 한 사람에게는 한 달란트를</strong> 주고 떠났더니 <strong>다섯 달란트 받은 자는 바로 가서 그것으로 장사하여 또 다섯 달란트를</strong> 남기고 두 달란트 받은 자도 그같이 하여 또 두 달란트를 남겼으되 한 달란트 받은 자는 가서 땅을 파고 그 주인의 돈을 감추어 두었더니 오랜 후에 그 종들의 주인이 돌아와 그들과 결산할새 다섯 달란트 받았던 자는 다섯 달란트를 더 가지고 와서 이르되 주인이여 내게 다섯 달란트를 주셨는데 보소서 내가 또 다섯 달란트를 남겼나이다 그 주인이 이르되 잘하였도다 착하고 충성된 종아 네가 적은 일에 충성하였으매 내가 많은 것을 네게 맡기리니 네 주인의 즐거움에 참여할지어다 하고 두 달란트 받았던 자도 와서 이르되 주인이여 내게 두 달란트를 주셨는데 보소서 내가 또 두 달란트를 남겼나이다 그 주인이 이르되 잘하였도다 착하고 충성된 종아 네가 적은 일에 충성하였으매 내가 많은 것을 네게 맡기리니 네 주인의 즐거움에 참여할지어다 하고 한 달란트 받았던 자는 와서 이르되 주인이여 당신은 굳은 사람이라 심지 않은 데서 거두고 헤치지 않은 데서 모으는 줄을 내가 알았으므로 두려워하여 나가서 당신의 달란트를 땅에 감추어 두었었나이다 보소서 당신의 것을 가지셨나이다 그 주인이 대답하여 이르되 악하고 게으른 종아 나는 심지 않은 데서 거두고 헤치지 않은 데서 모으는 줄로 네가 알았느냐 그러면 네가 마땅히 내 돈을 취리하는 자들에게나 맡겼다가 내가 돌아와서 내 원금과 이자를 받게 하였을 것이니라 하고 <strong>그에게서 그 한 달란트를 빼앗아 열 달란트 가진 자에게 주라</strong> 무릇 있는 자는 받아 풍족하게 되고 없는 자는 그 있는 것까지 빼앗기리라 이 무익한 종을 바깥 어두운 데로 내쫓으라 거기서 슬피 울며 이를 갈리라 하니라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/25/#L14-30">마 25:14-30</a>)</p></blockquote><p>*모두가 똑같이 상을 받는 포도원 품꾼의 비유(<a href="https://bibleox.com/ko/ko-nkrv/mf/20/#L1-16">마 20:1-16</a>)는 바리새인들이 있는 자리에서 하신 말씀입니다(<a href="https://bibleox.com/ko/ko-nkrv/mf/19/#L3">마 19:3</a>). 일찍 와서 더 많이 수고한 이들이, 늦게 돌아와 덜 수고한 이들보다 자기를 높이지 않도록 하신 말씀입니다. 늦은 짧은 시간에도 필요한 것을 얻을 수 있으니 낙심하지 말아야 합니다.</p><h3>동정을 지킨 이들은 그리스도께 특별히 가까이 있습니다</h3><blockquote><p>“이 사람들은 <strong>여자와 더불어 더럽히지 아니하고</strong> 순결한 자라 <strong><mark>어린 양이 어디로 인도하든지 따라가는 자며</mark></strong> 사람 가운데에서 속량함을 받아 처음 익은 열매로 하나님과 어린 양에게 속한 자들이니” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/14/#L4">계 14:4</a>)</p></blockquote>
