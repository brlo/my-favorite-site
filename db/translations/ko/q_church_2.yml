  title: 교회 — 눈에 보이는 일치
  copy_cover: true
  body: <h2>머리말</h2><p>먼저 짚어 둘 것은, 성경에는 자기 교회를 세우고 스스로 그 목자라고 선포한 예도 근거도 하나도 없다는 점입니다. 그리스도께서는 눈에 보이는 하나의 교회를 세우셨고 그 일치에 대한 당신의 뜻을 밝히셨습니다.</p><h2>교회의 눈에 보이는 일치에 대한 그리스도와 사도들의 뜻</h2><blockquote><p>“나는 이 사람들만을 위하여 간구하는 것이 아니라 이 사람들의 말을 듣고 나를 믿는 사람들을 위하여 <strong><mark>간구합니다</mark></strong>. 아버지, <strong><mark>이 사람들이 모두 하나가 되게 하여 주십시오</mark></strong>. 아버지께서 내 안에 계시고 내가 아버지 안에 있는 것과 같이 <strong><mark>이 사람들도 우리들 안에 있게 하여 주십시오. 그러면 아버지께서 나를 보내셨다는 것을 세상이 믿게 될 것입니다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/in/17/#L20-21">요한 17:20-21</a>)</p></blockquote><blockquote><p>“형제 여러분, 나는 우리 주 예수 그리스도의 이름으로 여러분에게 <strong><mark>호소합니다</mark></strong>. <strong><mark>여러분은 모두 의견을 통일시켜 갈라지지 말고</mark></strong> <strong><mark>같은 생각과 같은 뜻으로 굳게 단합하십시오</mark></strong>. 내 형제 여러분, 나는 클로에의 집안 사람들한테 들어서 <strong>여러분이 서로 다투고 있다</strong>는 것을 알게 되었습니다. 말하자면 여러분은 저마다 ‘나는 바울로파다’ ‘나는 아폴로파다’ ‘나는 베드로파다’ ‘나는 그리스도파다’하며 떠들고 다닌다는 것입니다. 그렇다면 <strong>그리스도가 갈라졌다는 말입니까</strong>? 여러분을 위하여 십자가에 달린 것이 바울로였습니까? 또 여러분이 바울로의 이름으로 세례를 받았단 말입니까?” (<a href="https://bibleox.com/ko/ko-ctb/1kor/1/#L10-13">1고린 1:10-13</a>; <a href="https://bibleox.com/ko/ko-ctb/1kor/3/#L4">1고린 3:4</a>)</p></blockquote><p>하느님께서는 몸(교회)의 지체들을 분열이 없고 모두가 서로 돌보며 함께 아파하고 함께 기뻐하도록 배치하셨습니다:</p><blockquote><p>“유다인이든지 그리이스인이든 종이든 자유인이든 우리는 모두 <strong>한 성령으로 세례를 받아 한 몸이 되었고</strong> 같은 성령을 받아 마셨습니다. <strong>몸은 한 지체로 된 것이 아니라 많은 지체로 되어 있습니다</strong>. &lt;…&gt; <strong><mark>눈이 손더러 ‘너는 나에게 소용이 없다’고 말할 수도 없고 머리가 발더러 ‘너는 나에게 소용이 없다’고 말할 수도 없습니다</mark></strong>. 그뿐만 아니라 몸 가운데서 다른 것들보다 약하다고 여겨지는 부분이 오히려 더 요긴합니다. 우리는 몸 가운데서 별로 중요하게 여기지 않는 부분을 더욱 조심스럽게 감싸고 또 보기 흉한 부분을 더 보기 좋게 꾸밉니다. 그러나 보기 좋은 지체들에게는 그렇게 할 필요가 없습니다. 이렇게 <strong><mark>하느님께서도 변변치 못한 부분을 더 귀중하게 여겨 주셔서 몸의 조화를 이루게 해 주셨습니다</mark></strong>. 이것은 <strong><mark>몸 안에 분열이 생기지 않고</mark></strong> 모든 지체가 서로 도와 나가도록 하시려는 것입니다. <strong>한 지체가 고통을 당하면 다른 모든 지체도 함께 아파하지 않겠습니까? 또 한 지체가 영광스럽게 되면 다른 모든 지체도 함께 기뻐하지 않겠습니까</strong>?” (<a href="https://bibleox.com/ko/ko-ctb/1kor/12/#L13-14,21-26">1고린 12:13-14,21-26</a>)</p></blockquote><p>몸의 이 여러 지체는 무엇입니까? 교회 안의 여러 직무와 은사입니다:</p><blockquote><p>“<strong>몸은 하나이지만 많은 지체를 가지고 있고</strong> 몸에 딸린 지체는 많지만 그 모두가 한 몸을 이루는 것처럼 그리스도의 몸도 그러합니다. &lt;…&gt; <strong>몸은 한 지체로 된 것이 아니라 많은 지체로 되어 있습니다</strong>. &lt;…&gt; <strong>여러분은 다 함께 그리스도의 몸을 이루고 있으며</strong> 한 사람 한 사람은 그 지체가 되어 있습니다. <strong>하느님께서는 교회 안에 다음과 같은 직책을 두셨습니다</strong>. 첫째는 사도요 둘째는 하느님의 말씀을 받아 전하는 사람이요 셋째는 가르치는 사람이요 다음은 기적을 행하는 사람이요 또 그 다음은 병 고치는 능력을 받은 사람, 남을 도와 주는 사람, 지도하는 사람, 이상한 언어를 말하는 사람 등입니다. <strong>모두가 다 사도일 수는 없지 않겠습니까</strong>? 모두가 다 하느님의 말씀을 받아 전하는 사람일 수는 없지 않겠습니까? 모두가 다 가르치는 사람일 수는 없지 않겠습니까? 모두가 다 기적을 행할 수는 없지 않겠습니까? 모두가 다 병 고치는 능력을 받을 수는 없지 않겠습니까? 모두가 다 이상한 언어를 말할 수는 없지 않겠습니까? 모두가 다 해석하는 사람일 수는 없지 않겠습니까?” (<a href="https://bibleox.com/ko/ko-ctb/1kor/12/#L12,14,27-30">1고린 12:12,14,27-30</a>)</p></blockquote><p>이처럼 하느님께서는 이 모든 직무와 은사를 배치하셔서 몸에 분열이 없게 하셨고, 사도는 편지 첫머리에서 이 분열을 막습니다(<a href="https://bibleox.com/ko/ko-ctb/1kor/1/#L10-13">1고린 1:10-13</a>). 곧 하느님께서는 일치를 원하실 뿐 아니라(<a href="https://bibleox.com/ko/ko-ctb/in/17/#L20-21">요한 17:20-21</a>) 일치를 돌보십니다. 여기서 하느님께 직무를 받은 사도는 눈에 보이는 일치를 돌보며 고린토 사람들이 눈에 보이는 분열을 만들지 못하게 합니다.</p><p>일치는 그리스도의 뜻이므로, 구원받는 사람은 하느님의 뜻을 실천하는 사람이라는 것을 이해해야 합니다(<a href="https://bibleox.com/ko/ko-ctb/mf/7/#L21">마태 7:21</a>).</p><h2>그리스도의 적들은 그리스도의 뜻을 어기고 드러나게 교회의 경계 밖으로 나갑니다</h2><p>그리스도의 적들은 사도들의 공동체에서 나갑니다:</p><blockquote><p>“어린 자녀들이여, 마지막 때가 왔습니다. 여러분은 그리스도의 적이 오리라는 말을 들어 왔는데 <strong><mark>벌써 그리스도의 적들이 많이 나타났습니다</mark></strong>. 그러니 마지막 때가 왔다는 것이 분명합니다. <strong><mark>이런 자들은 본래 우리의 사람들이 아니었기 때문에 우리에게서 떨어져 나갔습니다. 만일 그들이 우리의 사람들이었다면 우리와 함께 그대로 남아 있었을 것입니다</mark></strong>. 그러나 결국 그들은 우리에게서 떨어져 나갔고 그것으로 그들이 우리의 사람이 아니라는 것이 분명히 드러났습니다.” (<a href="https://bibleox.com/ko/ko-ctb/1in/2/#L18-19">1요한 2:18-19</a>)</p></blockquote><p>그들은 그리스도를 섬기지 않습니다:</p><blockquote><p>“형제 여러분, 여러분이 배운 교훈과는 달리 <strong><mark>남들을 분열시키고 죄짓게 하는 사람들을 경계하고 멀리하시기 바랍니다</mark></strong>. <strong><mark>그런 자들은 우리 주 예수 그리스도를 섬기는 것이 아니라</mark></strong> 자기네 뱃속을 채우고 있으며 그럴 듯한 말과 아첨하는 언사로 순진한 사람들의 마음을 유혹하고 있는 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/rim/16/#L17-18">로마 16:17-18</a>)</p></blockquote><h2>교회의 본래의 눈에 보이는 일치</h2><h3>외부인은 따로 있었습니다</h3><p>교회에는 처음부터 분명히 눈에 보이는 경계가 있었습니다:</p><blockquote><p>“그러나 <strong>다른 사람들은 신도들의 모임에 끼어 들 생각을 감히 하지 못하였다</strong>. 그러면서도 백성들은 그들을 칭찬하였으며” (<a href="https://bibleox.com/ko/ko-ctb/act/5/#L13">사도 5:13</a>)</p></blockquote><h3>공동의 재산</h3><p>교회는 한 덩어리의 공동체였습니다:</p><blockquote><p>“그 많은 신도들이 다 <strong>한 마음 한 뜻이 되어</strong> 아무도 자기 소유를 자기 것이라고 하지 않고 <strong>모든 것을 공동으로 사용하였다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/act/4/#L32">사도 4:32</a>)</p></blockquote><h3>논란이 되는 문제의 공동 해결</h3><p>교회에는 공동의 문제가 있고, 교회는 분명하고 눈에 보이는 공의회로 모여 함께 문제를 해결합니다:</p><blockquote><p>“<strong>사도들과 원로들은 이 문제를 검토하려고 회의를 열었다</strong>. &lt;…&gt; 그래서 <strong>사도들과 원로들은 교회의 모든 신도들과 의논하여</strong> 대표들을 뽑아 바울로와 바르나바와 함께 안티오키아로 보내기로 작정하였다. 거기에서 뽑힌 사람들은 교우들 가운데서 지도자적인 위치에 있던 바르사빠라는 유다와 실라였다.” (<a href="https://bibleox.com/ko/ko-ctb/act/15/#L6,22">사도 15:6,22</a>)</p></blockquote><h3>공동의 규정</h3><p>교회에는 모두에게 공통된 분명한 규정이 있습니다:</p><blockquote><p>“바울로 일행은 <strong>여러 도시를 두루 다니면서</strong> 예루살렘에 있는 <strong>사도들과 원로들이 정한 규정들을 전해 주며 지키라고 하였다</strong>. 그래서 교회들은 믿음이 점점 더 굳건해졌으며 신도의 수효는 나날이 늘어 갔다.” (<a href="https://bibleox.com/ko/ko-ctb/act/16/#L4-5">사도 16:4-5</a>)</p></blockquote><h3>파당으로 갈라지는 것을 금지함</h3><p>교회에서는 갈라지려는 시도를 모두 막습니다:</p><blockquote><p>“형제 여러분, 나는 우리 주 예수 그리스도의 이름으로 여러분에게 <strong><mark>호소합니다</mark></strong>. <strong><mark>여러분은 모두 의견을 통일시켜 갈라지지 말고</mark></strong> <strong><mark>같은 생각과 같은 뜻으로 굳게 단합하십시오</mark></strong>. 내 형제 여러분, 나는 클로에의 집안 사람들한테 들어서 <strong>여러분이 서로 다투고 있다</strong>는 것을 알게 되었습니다. 말하자면 여러분은 저마다 ‘나는 바울로파다’ ‘나는 아폴로파다’ ‘나는 베드로파다’ ‘나는 그리스도파다’하며 떠들고 다닌다는 것입니다. 그렇다면 <strong>그리스도가 갈라졌다는 말입니까</strong>? 여러분을 위하여 십자가에 달린 것이 바울로였습니까? 또 여러분이 바울로의 이름으로 세례를 받았단 말입니까?” (<a href="https://bibleox.com/ko/ko-ctb/1kor/1/#L10-13">1고린 1:10-13</a>; <a href="https://bibleox.com/ko/ko-ctb/1kor/3/#L4">1고린 3:4</a>)</p></blockquote><h3>하나의 신앙과 성사</h3><p>교회에는 모두에게 공통된 분명한 신앙이 하나만 있습니다:</p><blockquote><p>“주님도 한 분이시고 <strong>믿음도 하나이고</strong> 세례도 하나이며” (<a href="https://bibleox.com/ko/ko-ctb/ef/4/#L5">에페 4:5</a>)</p></blockquote><blockquote><p>“<strong>그리스도의 교훈을 지키지 않고 지나치게 앞서 나가는 자는 누구든지 하느님을 모시지 않는 자입니다</strong>. 그리스도의 교훈을 지키는 사람은 하느님 아버지와 그 아들을 함께 모시는 사람입니다.” (<a href="https://bibleox.com/ko/ko-ctb/2in/1/#L9">2요한 1:9</a>)</p></blockquote><p>구세주께서 말씀하시듯, 신앙은 사도들의 말을 따른 것입니다:</p><blockquote><p>“나는 이 사람들만을 위하여 간구하는 것이 아니라 <strong>이 사람들의 말을 듣고 나를 믿는 사람들</strong>을 위하여 간구합니다.” (<a href="https://bibleox.com/ko/ko-ctb/in/17/#L20">요한 17:20</a>)</p></blockquote><p>교회는 장차 하나의 신앙에서 갈라져 나가려는 사람들이 나타나리라는 것을 알고 있었습니다. 이런 사람들은 교회라고 불리지 않습니다:</p><blockquote><p>“마지막 때에 하느님을 두려워하지 않고 자기들의 욕정을 따라 사는 자들이 나타나 여러분을 조롱할 것이라고 사도들이 여러분에게 말했습니다. 이런 자들은 성령을 따라 살지 않고 본능적인 욕정을 좇아서 살면서 <strong>분열을 일으킵니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/iud/1/#L18-19">유다 1:18-19</a>)</p></blockquote><h3>하나의 사제 품계</h3><blockquote><p>“밀레도스에서 바울로는 에페소에 사람을 보내어 그 교회 원로들을 불렀다. 원로들이 오자 바울로는 이렇게 말하였다. ‘여러분은 내가 아시아에 발을 들여 놓은 첫날부터 지금까지 여러분과 함께 어떻게 지내왔는지를 잘 알고 있습니다. &lt;…&gt; 여러분은 늘 자신을 살피며 성령께서 맡겨 주신 양떼를 잘 돌보시오. <strong>성령께서는 여러분을 감독으로 세우셔서</strong> 하느님께서 당신 아드님의 피로 값을 치르고 얻으신 당신의 <strong>교회를 보살피게 하셨습니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/act/20/#L17-18,28">사도 20:17-18,28</a>)</p></blockquote><p><a href="https://bibleox.com/ru/ru/w/Таинство-Священства">신품성사</a>에 관하여 자세히.</p><p>이처럼 교회는 분명하고 눈에 보이는 공동체(유기체)입니다. 교회에는 공통된 사도적 신앙이 하나 있고, 모두에게 공통된 규정이 있으며, 사도들이 세운 지도자들은 모든 면에서 일치해 있고, 지체들 사이에는 장벽이 없습니다.</p><h2>교회의 경계와 성체성혈성사</h2><p>구약의 교회는 신약의 교회와 달리 그리스도의 몸이라고 불리지 않았습니다. 신약의 교회는 신비로운 신인(神人)의 유기체, <a href="https://bibleox.com/ru/ru/w/Церковь">그리스도의 몸</a>입니다. 그러므로 교회의 경계는 몸의 경계가 있는 곳에 있습니다. 사람 몸의 경계는 어디입니까? 피가 도는 곳이 몸이고, 피가 돌지 않는 곳은 몸이 아닙니다. 피가 없으면 사람의 부분들에 생명이 없습니다. 잘린 손은 더 이상 몸의 일부가 아니며, 피가 흘러 들어오지 않아 곧 썩게 됩니다. 참된 성체성혈이 있는 곳에 몸, 곧 교회가 있습니다:</p><blockquote><p>“우리가 감사를 드리면서 그 축복의 잔을 마시는 것은 우리가 <strong>그리스도의 피를 나누어</strong> 머시는 것이 아니겠습니까?또 우리가 그 빵을 떼는 것은 <strong>그리스도의 몸을 나누어 먹는 것</strong>이 아니겠습니까? 빵은 하나이고 우리 모두가 <strong>그 한 덩어리의 빵을 나누어 먹는 사람들이니 비록 우리가 여럿이지만 모두 한 몸인 것입니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/10/#L16-17">1고린 10:16-17</a>)</p></blockquote><blockquote><p>“<strong>여러분은 다 함께 그리스도의 몸을 이루고</strong> 있으며 한 사람 한 사람은 그 지체가 되어 있습니다.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/12/#L27">1고린 12:27</a>)</p></blockquote><blockquote><p>“이렇게 여러분이 전에는 하느님과 멀리 떨어져 있었지만 이제는 <strong>그리스도께서 피를 흘리심으로써</strong> 그리스도 예수를 말미암아 <strong>하느님과 가까와졌습니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/ef/2/#L13">에페 2:13</a>)</p></blockquote><p>그래서 사람들은 교회 안에서만 구원받습니다. 그리스도께서는 <a href="https://bibleox.com/ru/ru/w/Церковь">몸, 곧 교회</a>의 구세주이시기 때문입니다:</p><blockquote><p>“그리스도께서 <strong>당신의 몸인 교회의 구원자로서</strong> 그 <strong>교회의 머리</strong>가 되시는 것처럼 남편은 아내의 주인이 됩니다.” (<a href="https://bibleox.com/ko/ko-ctb/ef/5/#L23">에페 5:23</a>)</p></blockquote><p><a href="https://bibleox.com/ru/ru/w/Евхаристия">성체성혈성사</a>에 관하여 자세히.</p><h3>안티오키아의 주교, 성 이그나티오스 순교자(1세기), <a href="https://bibleox.com/ko/ko/w/Ig2S_스미르나교회에보낸편지/">스미르나 교회에 보낸 편지</a></h3><blockquote><p>“8장. … 주교를 제쳐 놓고 교회에 관한 일을 아무도 해서는 안 됩니다. <strong>주교 아래에서, 또는 주교가 맡긴 사람이 거행하는 성찬만을 확실한 것으로 여기십시오.</strong>”</p></blockquote>
