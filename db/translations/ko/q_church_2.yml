- src: Церковь-возвышение-над-миром
  path: Rw8m_교회_세상_위로_오름
  title: 교회 — 세상 위로 오름
  copy_cover: true
  body: <blockquote><p>“<strong>여러분은 세상이나 세상에 속한 것들을 사랑하지 마십시오</strong>. 세상을 사랑하는 사람에게는 그 마음 속에 아버지를 향한 사랑이 없습니다. 세상에 있는 모든 것, 곧 <strong>육체의 쾌락과 눈의 쾌락을 좇는 것이나 재산을 가지고 자랑하는 것</strong>은 아버지께로부터 나온 것이 아니고 세상에서 나온 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/1in/2/#L15-16">1요한 2:15-16</a>)</p></blockquote><blockquote><p>“여러분이 <strong>전에는 아무것도 모르고 욕심대로 살았지만</strong> 이제는 잘 순종하는 자녀로서 하느님께 복종하십시오.” (<a href="https://bibleox.com/ko/ko-ctb/1pet/1/#L14">1베드 1:14</a>)</p></blockquote><p>이 시대의 모습이 아니라 하느님의 모습을 향해 나아가야 합니다:</p><blockquote><p>“여러분은 <strong>이 세상을 본받지 말고</strong> 마음을 새롭게 하여 새 사람이 되십시오. 이리하여 <strong>무엇이 하느님의 뜻인지</strong>, 무엇이 선하고 무엇이 그분 마음에 들며 무엇이 완전한 것인지를 분간하도록 하십시오.” (<a href="https://bibleox.com/ko/ko-ctb/rim/12/#L2">로마 12:2</a>)</p></blockquote>
