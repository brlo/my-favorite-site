- src: церковь-епископы-равны
  path: Be6q_교회_주교들은_동등합니다
  title: 교회 — 주교들은 동등합니다
  copy_cover: true
  body: '<p>사도들과 주교들은 서로 동등합니다. 사도들은 자기들 가운데 누가 가장 큰지 자주 다투었습니다. 그리스도께서는 서로 위에 권력을 찾지 말라고 하셨습니다:</p><blockquote><p>“<strong>제자 중에서 누가 크냐 하는 변론이 일어나니</strong> &lt;…&gt; 그들에게 이르시되 누구든지 내 이름으로 이런 어린 아이를 영접하면 곧 나를 영접함이요 또 누구든지 나를 영접하면 곧 나를 보내신 이를 영접함이라 너희 모든 사람 중에 가장 작은 그가 큰 자니라” (<a href="https://bibleox.com/ko/ko-nkrv/lk/9/#L46,48">눅 9:46,48</a>)</p></blockquote><blockquote><p>“또 <strong>그들 사이에 그 중 누가 크냐 하는 다툼이 난지라</strong> 예수께서 이르시되 이방인의 임금들은 그들을 주관하며 그 집권자들은 은인이라 칭함을 받으나 <strong>너희는 그렇지 않을지니 너희 중에 큰 자는 젊은 자와 같고 다스리는 자는 섬기는 자와 같을지니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/lk/22/#L24-26">눅 22:24-26</a>)</p></blockquote><blockquote><p>“그들이 잠잠하니 이는 <strong>길에서 서로 누가 크냐 하고 쟁론하였음이라</strong> 예수께서 앉으사 열두 제자를 불러서 이르시되 <strong>누구든지 첫째가 되고자 하면 뭇 사람의 끝이 되며 뭇 사람을 섬기는 자가 되어야 하리라</strong> 하시고” (<a href="https://bibleox.com/ko/ko-nkrv/mk/9/#L34-35">막 9:34-35</a>)</p></blockquote><p>사도 야고보와 요한이 그리스도의 나라에서 그분의 오른편과 왼편에 앉게 해 달라고 청했을 때 다른 사도들은 화를 냈습니다. 그리스도께서는 그들 모두에게 서로 위에 권력을 찾지 말라고 하셨습니다:</p><blockquote><p>“예수께서 제자들을 불러다가 이르시되 이방인의 집권자들이 그들을 임의로 주관하고 그 고관들이 그들에게 권세를 부리는 줄을 너희가 알거니와 <strong>너희 중에는 그렇지 않아야 하나니</strong> 너희 중에 누구든지 크고자 하는 자는 너희를 섬기는 자가 되고 너희 중에 누구든지 으뜸이 되고자 하는 자는 너희의 종이 되어야 하리라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/20/#L25-27">마 20:25-27</a>)</p></blockquote><p>여기에서도 마찬가지입니다: <a href="https://bibleox.com/ko/ko-nkrv/mk/10/#L41-44">막 10:41-44</a>. 다른 모든 정교회에서 떨어져 나간 로마 교회는 사도 베드로의 특별한 권위를 내세웁니다:</p><blockquote><p>“내가 천국 열쇠를 네게 주리니 <strong>네가 땅에서 무엇이든지 매면 하늘에서도 매일 것이요</strong> 네가 땅에서 무엇이든지 풀면 하늘에서도 풀리리라 하시고” (<a href="https://bibleox.com/ko/ko-nkrv/mf/16/#L19">마 16:19</a>)</p></blockquote><p>그러나 이 권위는 모든 사도에게 주어졌습니다:</p><blockquote><p>“진실로 너희에게 이르노니 <strong>무엇이든지 너희가 땅에서 매면 하늘에서도 매일 것이요</strong> 무엇이든지 땅에서 풀면 하늘에서도 풀리리라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/18/#L18">마 18:18</a>)</p></blockquote><blockquote><p>“이 말씀을 하시고 그들을 향하사 숨을 내쉬며 이르시되 성령을 받으라 <strong>너희가 누구의 죄든지 사하면 사하여질 것이요</strong> 누구의 죄든지 그대로 두면 그대로 있으리라 하시니라” (<a href="https://bibleox.com/ko/ko-nkrv/in/20/#L22-23">요 20:22-23</a>)</p></blockquote><p>의미심장하게도 주님께서는 바로 사도 베드로의 발을 씻어 주시고 다른 사도들의 발도 씻어 주시며 본을 보이시고 권력욕을 경계하셨습니다:</p><blockquote><p>“내가 주와 또는 선생이 되어 너희 발을 씻었으니 너희도 서로 발을 씻어 주는 것이 옳으니라 <strong>내가 너희에게 행한 것 같이 너희도 행하게 하려 하여 본을 보였노라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/in/13/#L14-15">요 13:14-15</a>)</p></blockquote><p>나중에 사도 바울은 모임에서 사도 베드로를 책망하고(<a href="https://bibleox.com/ko/ko-nkrv/gal/2/#L11">갈 2:11</a>), 예루살렘의 첫 사도 회의에서는 사도 야고보가 주재하며(<a href="https://bibleox.com/ko/ko-nkrv/act/15/#L13,19">행 15:13,19</a>), 사도 베드로 자신도 로마에서만이 아니라 예를 들어 안디옥에서도 주교들을 세웠습니다.</p><p>사도들의 제자들은 주교들이 사도들의 후계자라고 씁니다. 사도들에게 해당하는 모든 것은 주교들에게도 해당합니다. 이에 관한 사도들의 제자들과 초기 그리스도인들의 글: <a href="https://bibleox.com/ru/ru/w/qeuY_Епископы__преемники_апостолов">주교는 사도들의 후계자</a>.</p>'
  meta_desc: 주교들의 동등함에 관한 성경 구절
