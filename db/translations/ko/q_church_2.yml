  title: 교회 — 주교들은 동등합니다
  copy_cover: true
  body: '<p>사도들과 주교들은 서로 동등합니다. 사도들은 자기들 가운데 누가 가장 큰지 자주 다투었습니다. 그리스도께서는 서로 위에 권력을 찾지 말라고 하셨습니다:</p><blockquote><p>“<strong>제자들 가운데 누가 제일 높으냐 하는 문제로 그들 사이에서 말다툼이 일어났다</strong>. &lt;…&gt; 제자들에게 이렇게 말씀하셨다. ‘누구든지 내 이름으로 이런 어린이를 받아 들이면 곧 나를 받아 들이는 것이며 또 나를 받아 들이면 나를 보내신 분을 받아 들이는 것이다. 너희 중에서 제일 낮은 사람이 제일 높은 사람이다.’” (<a href="https://bibleox.com/ko/ko-ctb/lk/9/#L46,48">루가 9:46,48</a>)</p></blockquote><blockquote><p>“<strong>제자들 사이에서 누구를 제일 높게 볼 것이냐는 문제로 옥신각신하는</strong> 것을 보시고 예수께서 이렇게 말씀하셨다. ‘이 세상의 왕들은 강제로 백성을 다스린다. 그리고 백성들에게 권력을 휘두르는 사람들은 백성의 은인으로 행세한다. <strong>그러나 너희는 그래서는 안 된다. 오히려 너희 중에서 제일 높은 사람은 제일 낮은 사람처럼 처신해야</strong> 하고 지배하는 사람은 섬기는 사람처럼 처신해야 한다.” (<a href="https://bibleox.com/ko/ko-ctb/lk/22/#L24-26">루가 22:24-26</a>)</p></blockquote><blockquote><p>“<strong>제자들은 길에서 누가 제일 높은 사람이냐 하는 문제로 서로 다투었기 때문에</strong> 아무 대답도 하지 못하였다. 예수께서는 자리에 앉아 열 두 제자를 곁으로 부르셨다. 그리고 ‘<strong>첫째가 되고자 하는 사람은 꼴찌가 되어 모든 사람을 섬기는 사람이 되어야 한다</strong>.’하고 말씀하신 다음” (<a href="https://bibleox.com/ko/ko-ctb/mk/9/#L34-35">마르 9:34-35</a>)</p></blockquote><p>사도 야고보와 요한이 그리스도의 나라에서 그분의 오른편과 왼편에 앉게 해 달라고 청했을 때 다른 사도들은 화를 냈습니다. 그리스도께서는 그들 모두에게 서로 위에 권력을 찾지 말라고 하셨습니다:</p><blockquote><p>“예수께서는 그들을 가까이 불러 놓고 ‘너희도 알다시피 세상에서는 통치자들이 백성을 강제로 지배하고 높은 사람들이 백성을 권력으로 내리누른다. <strong>그러나 너희는 그래서는 안 된다</strong>. 너희 사이에서 높은 사람이 되고자 하는 사람은 남을 섬기는 사람이 되어야 하고 으뜸이 되고자 하는 사람은 종이 되어야 한다.” (<a href="https://bibleox.com/ko/ko-ctb/mf/20/#L25-27">마태 20:25-27</a>)</p></blockquote><p>여기에서도 마찬가지입니다: <a href="https://bibleox.com/ko/ko-ctb/mk/10/#L41-44">마르 10:41-44</a>. 다른 모든 정교회에서 떨어져 나간 로마 교회는 사도 베드로의 특별한 권위를 내세웁니다:</p><blockquote><p>“또 나는 너에게 하늘 나라의 열쇠를 주겠다. <strong>네가 무엇이든지 땅에서 매면 하늘에도 매여 있을 것이며</strong> 땅에서 풀면 하늘에도 풀려 있을 것이다‘ 하고 말씀하셨다.” (<a href="https://bibleox.com/ko/ko-ctb/mf/16/#L19">마태 16:19</a>)</p></blockquote><p>그러나 이 권위는 모든 사도에게 주어졌습니다:</p><blockquote><p>“나는 분명히 말한다. <strong>너희가 무엇이든지 땅에서 매면 하늘에도 매어 있을 것이며</strong> 땅에서 풀면 하늘에도 풀려 있을 것이다.‘” (<a href="https://bibleox.com/ko/ko-ctb/mf/18/#L18">마태 18:18</a>)</p></blockquote><blockquote><p>“이렇게 말씀하신 다음 예수께서는 그들에게 숨을 내쉬시며 말씀을 계속하셨다. ‘성령을 받아라. <strong>누구의 죄든지 너희가 용서해 주면 그들의 죄는 용서받을 것이고</strong> 용서해 주지 않으면 용서받지 못한 채 남아 있을 것이다.’” (<a href="https://bibleox.com/ko/ko-ctb/in/20/#L22-23">요한 20:22-23</a>)</p></blockquote><p>의미심장하게도 주님께서는 바로 사도 베드로의 발을 씻어 주시고 다른 사도들의 발도 씻어 주시며 본을 보이시고 권력욕을 경계하셨습니다:</p><blockquote><p>“그런데 스승이며 주(主)인 내가 너희의 발을 씻어 주었으니 너희도 서로 발을 씻어 주어야 한다. <strong>내가 너희에게 한 일을 너희도 그대로 하라고 본을 보여 준 것이다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/in/13/#L14-15">요한 13:14-15</a>)</p></blockquote><p>나중에 사도 바울로는 모임에서 사도 베드로를 책망하고(<a href="https://bibleox.com/ko/ko-ctb/gal/2/#L11">갈라 2:11</a>), 예루살렘의 첫 사도 회의에서는 사도 야고보가 주재하며(<a href="https://bibleox.com/ko/ko-ctb/act/15/#L13,19">사도 15:13,19</a>), 사도 베드로 자신도 로마에서만이 아니라 예를 들어 안티오키아에서도 주교들을 세웠습니다.</p><p>사도들의 제자들은 주교들이 사도들의 후계자라고 씁니다. 사도들에게 해당하는 모든 것은 주교들에게도 해당합니다. 이에 관한 사도들의 제자들과 초기 그리스도인들의 글: <a href="https://bibleox.com/ru/ru/w/qeuY_Епископы__преемники_апостолов">주교는 사도들의 후계자</a>.</p>'
  meta_desc: 주교들의 동등함에 관한 성경 구절
