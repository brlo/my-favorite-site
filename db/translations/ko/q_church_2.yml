- src: храм-образ-небесной-реальности
  path: Th4h_성전_천상_실재의_형상
  title: 성전 — 천상 실재의 형상
  copy_cover: true
  body: '<h2>보이지 않는 것의 눈에 보이는 형상</h2><h3>우주</h3><p>하느님께서는 보이지 않는 것이 보이는 것을 통해 알려지도록 세상을 창조하셨습니다. 사람이 눈에 보이는 피조물을 바라보며 보이지 않는 창조주를 알게 하시려는 것입니다:</p><blockquote><p>“이는 <strong>하나님을 알 만한 것이</strong> 그들 속에 보임이라 <strong>하나님께서 이를 그들에게 보이셨느니라</strong> 창세로부터 그의 <strong>보이지 아니하는 것들</strong> 곧 그의 영원하신 능력과 신성이 <strong>그가 만드신 만물에</strong> 분명히 보여 알려졌나니 그러므로 그들이 핑계하지 못할지니라” (<a href="https://bibleox.com/ko/ko-nkrv/rim/1/#L19-20">롬 1:19-20</a>)</p></blockquote><h3>성전</h3><p>눈에 보이는 지상의 성전은 보이지 않는 천상 실재의 형상입니다. 예언자는 산에서 보여 주신 모양대로 성전을 지으라는 명령을 받습니다:</p><blockquote><p>“<strong>내가 그들 중에 거할 성소</strong>를 그들이 나를 위하여 짓되 무릇 <strong>내가 네게 보이는 모양대로 장막을 짓고</strong> 기구들도 그 모양을 따라 지을지니라 &lt;…&gt; 너는 삼가 <strong>이 산에서 네게 보인 양식대로 할지니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ish/25/#L8-9,40">출 25:8-9,40</a>)</p></blockquote><p>사도는 성전이 참 성소의 형상대로 지어졌음을 가리킵니다:</p><blockquote><p>“그리스도께서는 <strong>참 것의 그림자인 손으로 만든 성소</strong>에 들어가지 아니하시고 바로 그 하늘에 들어가사 이제 우리를 위하여 하나님 앞에 나타나시고” (<a href="https://bibleox.com/ko/ko-nkrv/evr/9/#L24">히 9:24</a>)</p></blockquote><blockquote><p>“광야에서 우리 조상들에게 증거의 장막이 있었으니 이것은 모세에게 말씀하신 이가 명하사 <strong>그가 본 그 양식대로 만들게 하신 것이라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/act/7/#L44">행 7:44</a>)</p></blockquote><h2>구약: 성전에는 하느님과 천사들만</h2><h3>보이지 않으시는 하느님</h3><p>하느님의 명령으로 지어진 구약의 성전에서 가장 중요한 자리에는 거룩한 것들이 담긴 궤(상자)만 놓여 있었고, 그 덮개 위 두 그룹 사이에서 하느님께서 당신을 드러내시고 말씀하셨습니다:</p><blockquote><p>“<strong>거기서 내가 너와 만나고 속죄소 위 곧 증거궤 위에 있는 두 그룹 사이에서</strong> 내가 이스라엘 자손을 위하여 네게 명령할 모든 일을 네게 이르리라” (<a href="https://bibleox.com/ko/ko-nkrv/ish/25/#L22">출 25:22</a>)</p></blockquote><h3>거룩한 천사들</h3><p>성전은 곳곳이 천사(그룹)의 형상으로 가득했습니다.</p><h4>궤 덮개 위의 그룹</h4><blockquote><p>“금으로 <strong>그룹 둘을 속죄소 두 끝에 쳐서 만들되</strong> 한 그룹은 이 끝에, 또 한 그룹은 저 끝에 곧 속죄소 두 끝에 속죄소와 한 덩이로 연결할지며 그룹들은 그 날개를 높이 펴서 그 날개로 <strong>속죄소를 덮으며</strong> 그 얼굴을 서로 대하여 속죄소를 향하게 하고” (<a href="https://bibleox.com/ko/ko-nkrv/ish/25/#L18-20">출 25:18-20</a>)</p></blockquote><h4>궤 좌우의 그룹</h4><blockquote><p>“<strong>내소 안에 감람나무로 두 그룹을 만들었는데 그 높이가 각각 십 규빗이라</strong> &lt;…&gt; 솔로몬이 내소 가운데에 <strong>그룹</strong>을 두었으니 그룹들의 날개가 퍼져 있는데 이쪽 그룹의 날개는 이쪽 벽에 닿았고 저쪽 그룹의 날개는 저쪽 벽에 닿았으며 두 날개는 성전의 중앙에서 서로 닿았더라” (<a href="https://bibleox.com/ko/ko-nkrv/3ts/6/#L23,27">왕상 6:23,27</a>)</p></blockquote><h4>휘장의 그룹</h4><blockquote><p>“청색 자색 홍색 실과 고운 베로 <strong>휘장문을 짓고 그 위에 그룹의 형상을 수놓았더라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2par/3/#L14">대하 3:14</a>; <a href="https://bibleox.com/ko/gr-lxx-byz/1mak/1/#L22">1마카 1:22</a>)</p></blockquote><h4>성전 벽의 그룹</h4><blockquote><p>“내 외소 <strong>사방 벽에는 모두 그룹들과</strong> 종려와 핀 꽃 형상을 아로새겼고” (<a href="https://bibleox.com/ko/ko-nkrv/3ts/6/#L29">왕상 6:29</a>)</p></blockquote><p>성전의 구조에 관하여 자세히: <a href="https://bibleox.com/ru/ru/w/иерусалимский-храм">예루살렘 성전</a>.</p><h2>신약: 성전에는 하느님과 천사들과 의인들의 영혼</h2><h3>천상의 실재가 달라졌습니다</h3><p>하느님께서 사람이 되시어 눈에 보이게 되시고, 고난을 받으시고, 부활하시고, 하늘에 오르시어 눈에 보이게 왕좌에 앉으셨습니다(<a href="https://bibleox.com/ko/ko-nkrv/mk/16/#L19">막 16:19</a>; <a href="https://bibleox.com/ko/ko-nkrv/ef/1/#L20-21">엡 1:20-21</a>; <a href="https://bibleox.com/ko/ko-nkrv/otkr/3/#L21">계 3:21</a>).</p><h3>하느님이신 그리스도</h3><blockquote><p>“주 예수께서 말씀을 마치신 후에 하늘로 올려지사 <strong><mark>하나님 우편에 앉으시니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mk/16/#L19">막 16:19</a>)</p></blockquote><blockquote><p>“그의 능력이 그리스도 안에서 역사하사 죽은 자들 가운데서 다시 살리시고 하늘에서 <strong><mark>자기의 오른편에 앉히사</mark></strong> 모든 통치와 권세와 능력과 주권과 이 세상뿐 아니라 오는 세상에 일컫는 모든 이름 위에 뛰어나게 하시고” (<a href="https://bibleox.com/ko/ko-nkrv/ef/1/#L20-21">엡 1:20-21</a>)</p></blockquote><blockquote><p>“이기는 그에게는 내가 <strong>내 보좌</strong>에 함께 앉게 하여 주기를 내가 이기고 <strong><mark>아버지 보좌에 함께 앉은</mark></strong> 것과 같이 하리라” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/3/#L21">계 3:21</a>)</p></blockquote><h3>거룩한 천사들</h3><blockquote><p>“또 다른 <strong>천사</strong>가 와서 제단 곁에 서서 금 향로를 가지고 많은 향을 받았으니 이는 모든 성도의 기도와 합하여 보좌 앞 금 제단에 드리고자 함이라” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/8/#L3">계 8:3</a>)</p></blockquote><blockquote><p>“일곱 재앙을 가진 <strong>일곱 천사</strong>가 성전으로부터 나와 맑고 빛난 세마포 옷을 입고 가슴에 금 띠를 띠고” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/15/#L6">계 15:6</a>)</p></blockquote><h3>거룩한 의인들의 영혼</h3><blockquote><p>“다섯째 인을 떼실 때에 내가 보니 <strong>하나님의 말씀과 그들이 가진 증거로 말미암아 죽임을 당한 영혼들이 제단 아래에 있어</strong> 큰 소리로 불러 이르되 거룩하고 참되신 대주재여 땅에 거하는 자들을 심판하여 우리 피를 갚아 주지 아니하시기를 어느 때까지 하시려 하나이까 하니 각각 그들에게 흰 두루마기를 주시며 이르시되 아직 잠시 동안 쉬되 <strong>그들의 동무 종들과 형제들도 자기처럼 죽임을 당하여</strong> 그 수가 차기까지 하라 하시더라” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/6/#L9-11">계 6:9-11</a>)</p></blockquote><blockquote><p>“또 내가 보니 보라 <strong>어린 양이 시온 산에 섰고 그와 함께 십사만 사천이</strong> 서 있는데 그들의 이마에는 어린 양의 이름과 그 아버지의 이름을 쓴 것이 있더라 &lt;…&gt; 그들이 보좌 앞과 네 생물과 장로들 앞에서 새 노래를 부르니 <strong>땅에서 속량함을 받은</strong> 십사만 사천 밖에는 능히 이 노래를 배울 자가 없더라 이 사람들은 <strong>여자와 더불어 더럽히지 아니하고</strong> 순결한 자라 <strong>어린 양이 어디로 인도하든지 따라가는 자며</strong> 사람 가운데에서 속량함을 받아 처음 익은 열매로 하나님과 어린 양에게 속한 자들이니 그 입에 거짓말이 없고 흠이 없는 자들이더라” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/14/#L1,3-5">계 14:1,3-5</a>)</p></blockquote><h3>노래</h3><blockquote><p>“홀연히 수많은 천군이 그 천사들과 함께 하나님을 찬송하여 이르되 지극히 높은 곳에서는 하나님께 영광이요 땅에서는 하나님이 기뻐하신 사람들 중에 평화로다 하니라” (<a href="https://bibleox.com/ko/ko-nkrv/lk/2/#L13-14">눅 2:13-14</a>)</p></blockquote><blockquote><p>“또 내가 보니 보라 <strong>어린 양이 시온 산에 섰고 그와 함께 십사만 사천이</strong> 서 있는데 그들의 이마에는 어린 양의 이름과 그 아버지의 이름을 쓴 것이 있더라 &lt;…&gt; 그들이 보좌 앞과 네 생물과 장로들 앞에서 <strong>새 노래를 부르니</strong> 땅에서 속량함을 받은 십사만 사천 밖에는 능히 이 노래를 배울 자가 없더라 이 사람들은 여자와 더불어 더럽히지 아니하고 순결한 자라 어린 양이 어디로 인도하든지 따라가는 자며 사람 가운데에서 속량함을 받아 처음 익은 열매로 하나님과 어린 양에게 속한 자들이니 그 입에 거짓말이 없고 흠이 없는 자들이더라” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/14/#L1,3-5">계 14:1,3-5</a>)</p></blockquote><h3>천상 성전을 측량하라는 명령</h3><blockquote><p>“또 내게 지팡이 같은 갈대를 주며 말하기를 일어나서 <strong><mark>하나님의 성전과 제단과 그 안에서 경배하는 자들을 측량하되</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/11/#L1">계 11:1</a>)</p></blockquote><h3>보좌</h3><blockquote><p>“이십사 장로들이 <strong>보좌에 앉으신 이</strong> 앞에 엎드려 세세토록 살아 계시는 이에게 경배하고 자기의 관을 보좌 앞에 드리며 이르되” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/4/#L10">계 4:10</a>)</p></blockquote><blockquote><p>“하나님 앞에서 자기 보좌에 앉아 있던 이십사 장로가 엎드려 얼굴을 땅에 대고 하나님께 경배하여” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/11/#L16">계 11:16</a>)</p></blockquote><h3>제단</h3><blockquote><p>“또 다른 천사가 와서 <strong>제단 곁에</strong> 서서 금 향로를 가지고 많은 향을 받았으니 이는 모든 성도의 기도와 합하여 <strong>보좌 앞 금 제단</strong>에 드리고자 함이라” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/8/#L3">계 8:3</a>)</p></blockquote><blockquote><p>“천사가 향로를 가지고 <strong>제단의 불</strong>을 담아다가 땅에 쏟으매 우레와 음성과 번개와 지진이 나더라” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/8/#L5">계 8:5</a>)</p></blockquote><blockquote><p>“여섯째 천사가 나팔을 불매 내가 들으니 하나님 앞 <strong>금 제단</strong> 네 뿔에서 한 음성이 나서” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/9/#L13">계 9:13</a>)</p></blockquote><h3>일곱 가지 등잔대</h3><blockquote><p>“보좌로부터 번개와 음성과 우렛소리가 나고 <strong>보좌 앞에 켠 등불 일곱이</strong> 있으니 이는 하나님의 일곱 영이라” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/4/#L5">계 4:5</a>)</p></blockquote><h3>분향</h3><blockquote><p>“또 다른 천사가 와서 제단 곁에 서서 금 향로를 가지고 많은 향을 받았으니 이는 모든 성도의 기도와 합하여 보좌 앞 금 제단에 드리고자 함이라 &lt;…&gt; <strong>천사가 향로를 가지고</strong> 제단의 불을 담아다가 땅에 쏟으매 우레와 음성과 번개와 지진이 나더라” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/8/#L3,5">계 8:3,5</a>)</p></blockquote><h3>리옹의 이레네오(2세기): 성전은 천상 실재의 형상입니다</h3><p>성전이 천상 실재의 형상대로 지어졌다는 것은 리옹의 성 이레네오(2세기)가 확인해 줍니다. 이레네오는 신학자 요한의 묵시록을 근거로, 지상의 것들이 하느님께서 창조하신 천상의 것들의 형상인 것이 합당하다고 말합니다:</p><blockquote><p>“그러므로 그분께서는 이런 봉사가 필요하지 않으시지만 우리가 열매 없이 지내지 않도록 우리 자신을 위해 그것을 바치기를 바라십니다. 이처럼 말씀께서는 예물이 필요하지 않으셨지만, 백성이 하느님을 섬기는 법을 배우도록 예물을 바치라는 바로 그 계명을 주셨습니다. 그러므로 <strong>우리도 제단에 예물을</strong> 자주, 끊임없이 <strong>바치는 것</strong>이 그분의 뜻입니다. <strong><mark>그러므로 제단은 하늘에 있습니다</mark></strong>(우리의 기도와 봉헌이 그곳을 향하기 때문입니다). <strong><mark>성전도 그러합니다</mark></strong>. 요한이 묵시록에서 “하느님의 성전이 열리고”(묵시 11:19)라고 말하는 대로입니다. 장막도 그러합니다. “보라, 하느님의 장막이 사람들과 함께 있다”(묵시 21:3)고 하기 때문입니다. 예물과 봉헌과 모든 제사를 백성은 산에서 모세에게 보여 주신 대로 표상으로 받았으며, 이는 오늘날 모든 민족 가운데 교회에서 이름이 찬양받으시는 한 분 같은 하느님에게서 온 것입니다. <strong><mark>우리 둘레에 펼쳐진 지상의 것들이 천상의 것들의 표상인 것은 합당합니다</mark></strong>. 둘 다 같은 하느님께서 창조하셨기 때문입니다. <strong>달리는 그분께서 영적인 것들의 형상을 [우리가 이해하도록] 나타내실 수 없었을 것입니다</strong>.”</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b4/">이단 반박 4권 18~19장</a>, 영어)</p><h2>하느님께서는 성전을 공경하라고 명하셨습니다</h2><p>성전은 <a href="https://bibleox.com/ru/ru/w/храм-образ-небесной-реальности">천상 실재의 형상</a>입니다. 하느님께서는 이 형상을 공경하라고 명하셨습니다:</p><blockquote><p>“내 안식일을 지키고 <strong>내 성소를 귀히 여기라</strong> 나는 여호와이니라” (<a href="https://bibleox.com/ko/ko-nkrv/lev/19/#L30">레 19:30</a>)</p></blockquote><blockquote><p>“너희는 내 안식일을 지키며 <strong>내 성소를 경외하라</strong> 나는 여호와이니라” (<a href="https://bibleox.com/ko/ko-nkrv/lev/26/#L2">레 26:2</a>)</p></blockquote><p>신약의 성전은 신학자 요한의 묵시록에 나오는 형상대로 지어집니다.</p>'
