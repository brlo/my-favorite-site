  references: "<p>번역: 로디온 블라소프 (AI 도구 활용). 저본: 러시아어 원문. 참고: 영어·일본어 번역. 성경 인용과 링크는 공동번역 성서에 따름.</p>"
- src: церковь-новый-израиль
  path: Ni5t_교회_새_이스라엘
  title: 교회 — 새 이스라엘
  copy_cover: true
  body: '<h2>그리스도는 교회의 뿌리이십니다</h2><blockquote><p>“여러분은 <strong><mark>그리스도 예수를</mark></strong> 주님으로 받아 들였으니 그분을 모시고 살아 가십시오. 그리고 여러분은 그리스도에 대한 믿음에 <strong><mark>뿌리를 박고</mark></strong> 그 터 위에 굳건히 서서 가르침을 받은 대로 믿음을 더욱 견고히 하여 넘치는 감사를 하느님께 드리십시오.” (<a href="https://bibleox.com/ko/ko-ctb/kol/2/#L6-7">골로 2:6-7</a>)</p></blockquote><blockquote><p>“<strong><mark>나 예수는</mark></strong> 내 천사를 보내어 모든 교회에 이 모든 것을 증언하게 하였다. <strong><mark>나는 다윗의 뿌리에서 돋은 그의 자손이며</mark></strong> 빛나는 샛별이다.‘” (<a href="https://bibleox.com/ko/ko-ctb/otkr/22/#L16">묵시 22:16</a>) <em>(그리스어: “나는 다윗의 뿌리이며 자손이다”)</em></p></blockquote><h3>그리스도는 가지들을 기르시는 포도나무이시기도 합니다</h3><blockquote><p>“‘<strong><mark>나는 참 포도 나무요</mark></strong> 나의 아버지는 농부이시다. 나에게 붙어 있으면서 열매를 맺지 못하는 가지는 아버지께서 모조리 쳐내시고 열매를 맺는 가지는 더 많은 열매를 맺도록 잘 가꾸신다. 너희는 내 교훈을 받아 이미 잘 가꾸어진 가지들이다. 너희는 <strong>나를 떠나지 말라</strong>. 나도 너희를 떠나지 않겠다. 포도나무에 붙어 있지 않는 가지가 스스로 열매를 맺을 수 없는 것처럼 너희도 나에게 붙어 있지 않으면 열매를 맺지 못할 것이다. <strong><mark>나는 포도 나무요 너희는 가지다</mark></strong>. 누구든지 나에게서 떠나지 않고 내가 그와 함께 있으면 그는 많은 열매를 맺는다. 나를 떠나서는 너희가 아무것도 할 수 없다. <strong>나를 떠난 사람은 잘려 나간 거지처럼 밖에 버려져 말라 버린다</strong>. 그러면 사람들이 이런 가지를 모아다가 불에 던져 태워 버린다.” (<a href="https://bibleox.com/ko/ko-ctb/in/15/#L1-6">요한 15:1-6</a>)</p></blockquote><h3>그리스도는 교회의 머리이시기도 합니다</h3><blockquote><p>“그리스도는 또한 <strong><mark>당신의 몸인 교회의 머리이십니다</mark></strong>. 그분은 모든 것의 시작이시고 죽은 자들 가운데서 살아나신 최초의 분이시며 만물의 으뜸이 되셨습니다.” (<a href="https://bibleox.com/ko/ko-ctb/kol/1/#L18">골로 1:18</a>)</p></blockquote><blockquote><p>“하느님께서는 만물을 그리스도의 발 아래 굴복시키셨으며 그분을 <strong><mark>교회의 머리</mark></strong>로 삼으셔서 모든 것을 지배하게 하셨습니다. <strong>교회는 그리스도의 몸</strong>이며 만물을 완성하시는 분의 계획이 그 안에서 완전히 이루어집니다.” (<a href="https://bibleox.com/ko/ko-ctb/ef/1/#L22-23">에페 1:22-23</a>)</p></blockquote><blockquote><p>“그리고 그들은 <strong><mark>그리스도를 머리로 하는 몸</mark></strong>의 지체가 아닙니다. 몸 전체는 각 마디와 힘줄을 통하여 영양을 받으며 서로 연결되어 하느님의 계획대로 자라나는 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/kol/2/#L19">골로 2:19</a>)</p></blockquote><h2>이스라엘의 일부(가지들)가 그리스도(뿌리)에게서 떨어져 나갔습니다</h2><p>이스라엘의 일부는 떨어져 나갔고, 이방 민족들이 뿌리(그리스도)에 접붙여졌습니다. 잘려 나간 유다인들은 뿌리의 잘린 일부가 아니라 잘린 가지들이라고 불립니다:</p><blockquote><p>“떡 반죽에서 떼낸 첫부분을 하느님께 드리면 그 반죽덩어리 전체도 거룩합니다. 또 나무 뿌리가 거룩하면 그 가지도 다 거룩합니다. 올리브나무가 한 그루 있는데 <strong><mark>그 가지 몇 개가 잘리고</mark></strong> <strong>그 자리에 야생 올리브나무 가지를 접붙였다고 합시다</strong>. 그러면 그 접붙인 가지들은 <strong><mark>올리브나무 원 뿌리에서 양분을 같이 받게 됩니다</mark></strong>. 말하자면 여러분은 이 야생 올리브나무 가지들입니다. 그러니 여러분은 잘려 나간 가지들을 업신여겨서는 안 됩니다. 그럴 생각이 날 때에는 여러분이 뿌리를 지탱하는 것이 아니고 뿌리가 여러분을 지탱한다는 사실을 기억하십시오.” (<a href="https://bibleox.com/ko/ko-ctb/rim/11/#L16-18">로마 11:16-18</a>)</p></blockquote><blockquote><p>“또 이사야는 더욱 담대하게 ‘<strong>나를 찾지 않던 사람들이 나를 만났고</strong> 나를 구하지 않던 사람들이 나를 보았다’고 하였습니다. 그러나 <strong><mark>이스라엘에 대해서는</mark></strong> ‘<strong><mark>나는 온종일 내 팔을 벌려 이 백성을 기다렸으나 그들은 순종하지 않고 오히려 나를 거역하고 있다</mark></strong>’고 말하였습니다.” (<a href="https://bibleox.com/ko/ko-ctb/rim/10/#L20-21">로마 10:20-21</a>)</p></blockquote><blockquote><p>“나는 또 묻겠습니다. <strong>하느님께서 당신의 백성을 버리셨다고 할 수 있겠습니까? 절대로 그렇지 않습니다</strong>. 나도 아브라함의 후손으로서 베냐민 지파에 속하는 한 이스라엘 사람입니다. &lt;…&gt; 하느님께서는 무엇이라고 대답하셨습니까? ‘나에게는 아직도 <strong>바알신 앞에 무릎을 꿇지 않은 사람이 칠천 명이나 있다</strong>’고 말씀하시지 않았습니까? 이와 같이 지금도 <strong><mark>은총으로 뽑힌 사람들이 남아 있습니다</mark></strong>. &lt;…&gt; 결국 어떻게 되었습니까? 이스라엘은 자기들이 찾던 것을 얻지 못했는데 <strong><mark>뽑힌 사람들은 그것을 얻었습니다. 뽑히지 못한 사람들은 마음이 완고해져서</mark></strong>,” (<a href="https://bibleox.com/ko/ko-ctb/rim/11/#L1,4-5,7">로마 11:1,4-5,7</a>)</p></blockquote><h2>떨어져 나간 가지들(이스라엘의 일부) 자리에 새 가지(다른 모든 민족)가 뿌리에 접붙여집니다</h2><blockquote><p>“그리하여 야곱은 배부르게 먹었고 여수룬은 뚱뚱하게 살이 올랐다. 그러자 <strong>저를 지으신 신을 버리고</strong> 자기를 살려 주신 반석을 우습게 여겼다. 다른 신을 섬겨 그의 질투를 사고 역겨운 짓을 하여 그의 속을 썩여 드렸다. 하느님 아닌 귀신 듣지도 보지도 못하던 신들, 너희 선조들이 섬긴 일 없는 새로 나타난 신들에게 제물을 잡아 바치고 <strong>너희를 낳은 반석을 버리고</strong> 너희를 낳느라 고생한 하느님을 잊어 버렸다. 야훼께서는 이 모양을 보고 속이 상하셔서 당신의 아들 딸이건만 아니꼽게 여기시고 이렇게 말씀하신다. ‘<strong><mark>그들에게 내 얼굴을 보이지 아니하리라. 그리고 결국 어찌 되는가 두고 보리라</mark></strong>. 이 변덕이 죽끓듯하는 세대, 진실이란 털끝만큼도 없는 자들아! 신 아닌 것을 모시어 내 질투심을 터뜨리고 허수아비를 섬겨 내 속을 썩여 주었으니, <strong><mark>나 또한 사람이라고 할 수 없는 것들을 돌봐 주어 그들로 하여금 질투를 하게 하고</mark></strong> 무지한 민족을 돌봐 주어 그들의 속을 썩여 주리라.” (<a href="https://bibleox.com/ko/ko-ctb/vtor/32/#L15-21">신 32:15-21</a>)</p></blockquote><blockquote><p>“<strong>앞으로 내가</strong> 이스라엘과 유다의 가문과 <strong><mark>새 계약을 맺을 날이 온다</mark></strong>. 나 야훼가 분명히 일러 둔다. <strong><mark>이 새 계약은 그 백성의 조상들의 손을 잡아 에집트에서 데려 내 오던 때에 맺은 것과는 같지 않다</mark></strong>. 나는 그들을 내 것으로 삼았지만, 그들은 나와 맺은 계약을 깨뜨리고 말았다. 귀담아 들어라. 그 날 내가 이스라엘 가문과 맺을 계약이란 그들의 가슴에 새겨 줄 내 법을 말한다. 내가 분명히 말해 둔다. <strong><mark>그 마음에 내 법을 새겨주어, 나는 그들의 하느님이 되고 그들은 내 백성이 될 것이다</mark></strong>. 내가 그들의 잘못을 다시는 기억하지 아니하고 그 죄를 용서하여 주리니, 다시는 이웃이나 동기끼리 서로 깨우쳐 주며 야훼의 심정을 알아 드리자고 하지 않아도 될 것이며, 높은 사람이나 낮은 사람이나 내 마음을 모르는 사람이 없으리라. 이는 내 말이라, 어김이 없다.‘ 해를 두어 낮을 환하게 하시는 이, 달과 별을 두어 밤을 비추도록 정하신 이, 파도소리 요란하게 바다를 뒤흔드시는 이, 그 이름 만군의 야훼께서 말씀하신다. 이것은 내가 만든 법칙, 이것이 내 앞에서 사라진다면, 이스라엘 후손도 한 나라를 이루지 못하고 사라지리라. 이는 내 말이라, 어김이 없다. 나 야훼가 말한다. 누가 저 높은 하늘을 잴 수 있다면, 깊은 땅속 주춧돌들을 파헤칠 수 있다면, 이스라엘이 한 모든 일을 생각하여 나도 이스라엘 후손을 다 내버리리라.” (<a href="https://bibleox.com/ko/ko-ctb/ier/31/#L31-37">예레 31:31-37</a>)</p></blockquote><blockquote><p>“떡 반죽에서 떼낸 첫부분을 하느님께 드리면 그 반죽덩어리 전체도 거룩합니다. 또 나무 뿌리가 거룩하면 그 가지도 다 거룩합니다. 올리브나무가 한 그루 있는데 그 가지 몇 개가 잘리고 그 자리에 <strong><mark>야생 올리브나무 가지를 접붙였다고 합시다</mark></strong>. 그러면 그 접붙인 가지들은 <strong><mark>올리브나무 원 뿌리에서 양분을 같이 받게 됩니다</mark></strong>. 말하자면 여러분은 이 야생 올리브나무 가지들입니다. 그러니 여러분은 잘려 나간 가지들을 업신여겨서는 안 됩니다. 그럴 생각이 날 때에는 여러분이 뿌리를 지탱하는 것이 아니고 뿌리가 여러분을 지탱한다는 사실을 기억하십시오.” (<a href="https://bibleox.com/ko/ko-ctb/rim/11/#L16-18">로마 11:16-18</a>)</p></blockquote><blockquote><p>“나에게 빌지도 않던 자의 청까지도 나는 들어 주었고, 나를 찾지도 않던 자 또한 만나 주었다. <strong><mark>나의 이름을 부르지도 않던 민족에게 ‘나 여기 있다, 나 여기 있다’ 하고 말해 주었다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/is/65/#L1">이사 65:1</a>)</p></blockquote><blockquote><p>“나는 이스라엘을 내 것으로 이 땅에 심으리라. <strong>로루하마를 귀여워해 주고</strong> <strong><mark>버린 자식을 ‘내 자식’ 이라 하리니</mark></strong>, 그제야 입을 열어 ‘나의 하느님’ 하고 부르리라.” (<a href="https://bibleox.com/ko/ko-ctb/os/2/#L25">호세 2:25</a>) <em>(공동번역의 절 번호는 히브리어 본문을 따릅니다(다른 번역에서는 2:23).)</em></p></blockquote><blockquote><p>“그 자비의 그릇은 바로 우리들입니다. <strong><mark>하느님께서 불러 주신 우리들 가운데는 유다인뿐 아니라 이방인도 있습니다</mark></strong>. 호세아서에 이런 말씀이 있습니다. ‘<strong><mark>내 백성이 아니었던 사람들을 내 백성이라 부르겠고 내 사랑을 받지 못하던 백성을 내 사랑하는 백성이라 부르리라</mark></strong>. 너희는 내 백성이 아니다 하고 말씀하신 바로 그 곳에서 그들은 <strong><mark>살아 계신 하느님의 자녀라고 불리리라</mark></strong>.’” (<a href="https://bibleox.com/ko/ko-ctb/rim/9/#L24-26">로마 9:24-26</a>)</p></blockquote><h2>교회에서는 민족이 더 이상 중요하지 않습니다</h2><p>사도는 <a href="https://bibleox.com/ko/ko-ctb/rim/11/#L16-18">로마 11:16-18</a>에서 극단 하나, 곧 유다인을 업신여기고 그들 위에 자신을 높이는 태도를 물리칩니다. 다른 극단은 그들 앞에 굽실거리는 태도입니다. 중용은 교회 안에 민족이 없는 것입니다. 거기서는 모두가 서로 형제이고, 교회에 들어오는 모든 이는 민족과 상관없이, 하느님께서 어디서 어떤 사람으로 태어나게 하셨든 형제가 됩니다:</p><blockquote><p>“여기에는 <strong><mark>그리이스인과 유다인</mark></strong>, 할례받은 사람과 받지 않은 사람, <strong><mark>타국인, 야만인</mark></strong>, <strong>노예, 자유인</strong> 따위의 구별이 없습니다. 오직 그리스도만이 전부로서 모든 사람 위에 군림하십니다.” (<a href="https://bibleox.com/ko/ko-ctb/kol/3/#L11">골로 3:11</a>) <em>(그리스어: “야만인, 스키타이인”)</em></p></blockquote><h2>교회 안에서는 유다인과 이방인의 차이가 없습니다</h2><blockquote><p>“오랜 토론 끝에 베드로가 일어나서 그들에게 이렇게 말하였다. ‘형제 여러분, 여러분이 아시는 바와 같이 하느님께서는 내 입을 빌어 이방인들도 복음을 믿게 하시려고 일찌기 여러분 가운데서 나를 뽑아 주셨습니다. 그리고 사람의 마음 속을 아시는 하느님께서는 성령을 그들에게도 내리셔서 우리와 똑같이 인정해 주셨습니다. 그리고 그들의 믿음을 보시고 그들의 마음을 깨끗하게 하셔서 <strong><mark>우리와 그들 사이에 아무런 차별도 두지 않으셨습니다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/act/15/#L7-9">사도 15:7-9</a>)</p></blockquote><blockquote><p>“이렇게 여러분이 전에는 하느님과 멀리 떨어져 있었지만 이제는 그리스도께서 피를 흘리심으로써 그리스도 예수를 말미암아 하느님과 가까와졌습니다. 그리스도야말로 우리의 평화이십니다. 그분은 자신의 몸을 바쳐서 유다인과 이방인이 서로 원수가 되어 갈리게 했던 담을 헐어 버리시고 그들을 <strong><mark>화해시켜 하나로 만드시고</mark></strong> <strong>율법 조문과 규정을 모두 폐지하셨습니다</strong>. 그리스도께서는 자신을 희생하여 <strong><mark>유다인과 이방인을 하나의 새 민족으로 만들어</mark></strong> 평화를 이룩하시어 또 십자가에서 죽으심으로써 <strong><mark>둘을 한 몸으로 만드셔서 하느님과 화해시키시고</mark></strong> 원수되었던 모든 요소를 없이하셨습니다. &lt;…&gt; 그래서 이방인 여러분과 우리 유다인들은 <strong><mark>모두 그리스도로 말미암아 같은 성령을 받아 아버지께로 가까이 나아가게 되었습니다</mark></strong>. &lt;…&gt; 여러분이 건물이라면 그리스도께서는 그 건물의 <strong>가장 요긴한 모퉁이돌</strong>이 되시며 사도들과 예언자들은 그 건물의 기초가 됩니다.” (<a href="https://bibleox.com/ko/ko-ctb/ef/2/#L13-16,18,20">에페 2:13-16,18,20</a>)</p></blockquote><h2>이스라엘 백성은 구세주께서 세상에 오시도록 선택되었습니다. 이 목적은 이루어졌습니다.</h2><p><a href="https://bibleox.com/ru/ru/w/ветхий-завет">자세히</a></p><h2>아브라함의 자손은 믿는 사람들입니다</h2><blockquote><p>“성서에도 기록되어 있듯이 아브라함은 하느님을 믿었고 하느님께서는 그의 믿음을 보시고 그를 올바른 사람으로 인정해 주셨습니다. 그러므로 여러분은 <strong><mark>믿음으로 사는 사람만이 아브라함의 참 자손이 된다</mark></strong>는 것을 알아야 합니다. 하느님께서는 이방인들도 믿기만 하면 당신과의 올바른 관계를 가지게 해 주시리라는 것을 성서는 미리 내다보았습니다. 그래서 성서는 아브라함에게 ‘너로 말미암아 <strong>만백성</strong>이 복을 받으리라’는 복음을 미리 전해 주었던 것입니다. 그러므로 <strong>믿음으로 사는 사람들은 믿음의 사람 아브라함과 함께 복을 누리는 것입니다</strong>. 성서에 ‘율법서에 기록된 모든 것을 꾸준히 지키지 않는 사람은 저주를 받을 것이다’라고 기록되어 있듯이 <strong>율법을 지키는 것에 의존하는 사람은 언제나 저주의 위협을 받고 있습니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/gal/3/#L6-10">갈라 3:6-10</a>)</p></blockquote><h2>유다인은 겉이 아니라 영적으로(속으로) 그러한 사람입니다</h2><blockquote><p>“그러므로 <strong>유다인의 겉모양만 갖추었다 해서 참 유다인이 되는 것도 아니고</strong> 몸에 할례의 흔적을 지녔다고 해서 참 할례를 받았다고 할 수도 없습니다. 오히려 <strong><mark>유다인의 속 마음을 가져야 진정한 유다인이 되며</mark></strong> 할례도 법조문을 따라서가 아니라 성령으로 말미암아 마음에 받는 할례가 참 할례입니다. 이런 사람은 사람의 칭찬을 받는 것이 아니라 하느님의 칭찬을 받습니다.” (<a href="https://bibleox.com/ko/ko-ctb/rim/2/#L28-29">로마 2:28-29</a>)</p></blockquote><blockquote><p>“<strong><mark>할례를 받고 안 받는 것이 문제가 아니라</mark></strong> 새로운 사람이 되는 것이 중요합니다.” (<a href="https://bibleox.com/ko/ko-ctb/gal/6/#L15">갈라 6:15</a>)</p></blockquote><h2>모든 민족에서 나올 신약의 사제직에 관한 예언</h2><p>구약의 교회에서 사제는 유다 백성의 레위 지파, 아론의 가문에서만 세워졌습니다. 그러나 신약의 교회에서 사제는 유다 백성(아론 가문)만이 아니라 모든 민족에서 세워질 것입니다:</p><blockquote><p>“나는 가서 <strong><mark>다른 말을 쓰는 모든 민족들을 모아 오리라</mark></strong>. 그들은 와서 나의 영광을 볼 것이다. 그들 가운데 난을 면할 자들에게 표를 주어 다르싯, 풋트, 룻, 모섹, 로스, 두발, 야반 등 여러 민족들, <strong>나의 소문을 듣지도 못하고 나의 영광을 보지도 못한</strong> 먼 섬나라에 사는 사람들에게 보내어, 만방에 나의 영광을 전하게 하리라. 그들은 민족들 가운데서 너희 모든 겨레를 말과 수레와 포장마차와 노새와 낙타에 태워 나의 거룩한 산 예루살렘에 데려다가 선물로 야훼에게 바칠 것이다. 이스라엘 백성이 정한 그릇에 선물을 담아다가 야훼의 성전에 바치듯이 바칠 것이다. 야훼가 말한다. <strong><mark>내가 그들 가운데서 더러는 사제로, 더러는 레위인으로 뽑아 세우리라. 야훼가 말한다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/is/66/#L18-21">이사 66:18-21</a>)</p></blockquote>'
