  title: 교회 — 눈에 보이는 일치
  copy_cover: true
  body: <h2>머리말</h2><p>먼저 짚어 둘 것은, 성경에는 자기 교회를 세우고 스스로 그 목자라고 선포한 예도 근거도 하나도 없다는 점입니다. 그리스도께서는 눈에 보이는 하나의 교회를 세우셨고 그 일치에 대한 당신의 뜻을 밝히셨습니다.</p><h2>교회의 눈에 보이는 일치에 대한 그리스도와 사도들의 뜻</h2><blockquote><p>“내가 <strong><mark>비옵는 것은</mark></strong> 이 사람들만 위함이 아니요 또 그들의 말로 말미암아 나를 믿는 사람들도 위함이니 아버지여, 아버지께서 내 안에, 내가 아버지 안에 있는 것 같이 <strong><mark>그들도 다 하나가 되어</mark></strong> <strong><mark>우리 안에 있게 하사 세상으로 아버지께서 나를 보내신 것을 믿게 하옵소서</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/in/17/#L20-21">요 17:20-21</a>)</p></blockquote><blockquote><p>“형제들아 내가 우리 주 예수 그리스도의 이름으로 너희를 <strong><mark>권하노니</mark></strong> <strong><mark>모두가 같은 말을 하고 너희 가운데 분쟁이 없이</mark></strong> <strong><mark>같은 마음과 같은 뜻으로 온전히 합하라</mark></strong> 내 형제들아 글로에의 집 편으로 너희에 대한 말이 내게 들리니 곧 <strong>너희 가운데 분쟁이 있다</strong>는 것이라 내가 이것을 말하거니와 너희가 각각 이르되 나는 바울에게, 나는 아볼로에게, 나는 게바에게, 나는 그리스도에게 속한 자라 한다는 것이니 <strong>그리스도께서 어찌 나뉘었느냐</strong> 바울이 너희를 위하여 십자가에 못 박혔으며 바울의 이름으로 너희가 세례를 받았느냐” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/1/#L10-13">고전 1:10-13</a>; <a href="https://bibleox.com/ko/ko-nkrv/1kor/3/#L4">고전 3:4</a>)</p></blockquote><p>하느님께서는 몸(교회)의 지체들을 분열이 없고 모두가 서로 돌보며 함께 아파하고 함께 기뻐하도록 배치하셨습니다:</p><blockquote><p>“우리가 유대인이나 헬라인이나 종이나 자유인이나 다 한 성령으로 세례를 받아 한 몸이 되었고 또 다 한 성령을 마시게 하셨느니라 <strong>몸은 한 지체뿐만 아니요 여럿이니</strong> &lt;…&gt; <strong><mark>눈이 손더러 내가 너를 쓸 데가 없다 하거나 또한 머리가 발더러 내가 너를 쓸 데가 없다 하지 못하리라</mark></strong> 그뿐 아니라 더 약하게 보이는 몸의 지체가 도리어 요긴하고 우리가 몸의 덜 귀히 여기는 그것들을 더욱 귀한 것들로 입혀 주며 우리의 아름답지 못한 지체는 더욱 아름다운 것을 얻느니라 그런즉 우리의 아름다운 지체는 그럴 필요가 없느니라 오직 <strong><mark>하나님이 몸을 고르게 하여 부족한 지체에게 귀중함을 더하사</mark></strong> <strong><mark>몸 가운데서 분쟁이 없고</mark></strong> 오직 여러 지체가 서로 같이 돌보게 하셨느니라 <strong>만일 한 지체가 고통을 받으면 모든 지체가 함께 고통을 받고 한 지체가 영광을 얻으면 모든 지체가 함께 즐거워하느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/12/#L13-14,21-26">고전 12:13-14,21-26</a>)</p></blockquote><p>몸의 이 여러 지체는 무엇입니까? 교회 안의 여러 직무와 은사입니다:</p><blockquote><p>“<strong>몸은 하나인데 많은 지체가 있고</strong> 몸의 지체가 많으나 한 몸임과 같이 그리스도도 그러하니라 &lt;…&gt; <strong>몸은 한 지체뿐만 아니요 여럿이니</strong> &lt;…&gt; <strong>너희는 그리스도의 몸이요</strong> 지체의 각 부분이라 <strong>하나님이 교회 중에 몇을 세우셨으니</strong> 첫째는 사도요 둘째는 선지자요 셋째는 교사요 그 다음은 능력을 행하는 자요 그 다음은 병 고치는 은사와 서로 돕는 것과 다스리는 것과 각종 방언을 말하는 것이라 <strong>다 사도이겠느냐</strong> 다 선지자이겠느냐 다 교사이겠느냐 다 능력을 행하는 자이겠느냐 다 병 고치는 은사를 가진 자이겠느냐 다 방언을 말하는 자이겠느냐 다 통역하는 자이겠느냐” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/12/#L12,14,27-30">고전 12:12,14,27-30</a>)</p></blockquote><p>이처럼 하느님께서는 이 모든 직무와 은사를 배치하셔서 몸에 분열이 없게 하셨고, 사도는 편지 첫머리에서 이 분열을 막습니다(<a href="https://bibleox.com/ko/ko-nkrv/1kor/1/#L10-13">고전 1:10-13</a>). 곧 하느님께서는 일치를 원하실 뿐 아니라(<a href="https://bibleox.com/ko/ko-nkrv/in/17/#L20-21">요 17:20-21</a>) 일치를 돌보십니다. 여기서 하느님께 직무를 받은 사도는 눈에 보이는 일치를 돌보며 고린도 사람들이 눈에 보이는 분열을 만들지 못하게 합니다.</p><p>일치는 그리스도의 뜻이므로, 구원받는 사람은 하느님의 뜻을 실천하는 사람이라는 것을 이해해야 합니다(<a href="https://bibleox.com/ko/ko-nkrv/mf/7/#L21">마 7:21</a>).</p><h2>그리스도의 적들은 그리스도의 뜻을 어기고 드러나게 교회의 경계 밖으로 나갑니다</h2><p>그리스도의 적들은 사도들의 공동체에서 나갑니다:</p><blockquote><p>“아이들아 지금은 마지막 때라 적그리스도가 오리라는 말을 너희가 들은 것과 같이 <strong><mark>지금도 많은 적그리스도가 일어났으니</mark></strong> 그러므로 우리가 마지막 때인 줄 아노라 <strong><mark>그들이 우리에게서 나갔으나 우리에게 속하지 아니하였나니 만일 우리에게 속하였더라면 우리와 함께 거하였으려니와</mark></strong> 그들이 나간 것은 다 우리에게 속하지 아니함을 나타내려 함이니라” (<a href="https://bibleox.com/ko/ko-nkrv/1in/2/#L18-19">요일 2:18-19</a>)</p></blockquote><p>그들은 그리스도를 섬기지 않습니다:</p><blockquote><p>“형제들아 내가 너희를 권하노니 너희가 배운 교훈을 거슬러 <strong><mark>분쟁을 일으키거나 거치게 하는 자들을 살피고 그들에게서 떠나라</mark></strong> <strong><mark>이같은 자들은 우리 주 그리스도를 섬기지 아니하고</mark></strong> 다만 자기들의 배만 섬기나니 교활한 말과 아첨하는 말로 순진한 자들의 마음을 미혹하느니라” (<a href="https://bibleox.com/ko/ko-nkrv/rim/16/#L17-18">롬 16:17-18</a>)</p></blockquote><h2>교회의 본래의 눈에 보이는 일치</h2><h3>외부인은 따로 있었습니다</h3><p>교회에는 처음부터 분명히 눈에 보이는 경계가 있었습니다:</p><blockquote><p>“<strong>그 나머지는 감히 그들과 상종하는 사람이 없으나</strong> 백성이 칭송하더라” (<a href="https://bibleox.com/ko/ko-nkrv/act/5/#L13">행 5:13</a>)</p></blockquote><h3>공동의 재산</h3><p>교회는 한 덩어리의 공동체였습니다:</p><blockquote><p>“믿는 무리가 <strong>한마음과 한 뜻이 되어</strong> <strong>모든 물건을 서로 통용하고</strong> 자기 재물을 조금이라도 자기 것이라 하는 이가 하나도 없더라” (<a href="https://bibleox.com/ko/ko-nkrv/act/4/#L32">행 4:32</a>)</p></blockquote><h3>논란이 되는 문제의 공동 해결</h3><p>교회에는 공동의 문제가 있고, 교회는 분명하고 눈에 보이는 공의회로 모여 함께 문제를 해결합니다:</p><blockquote><p>“<strong>사도와 장로들이 이 일을 의논하러 모여</strong> &lt;…&gt; 이에 <strong>사도와 장로와 온 교회가</strong> 그 중에서 사람들을 택하여 바울과 바나바와 함께 안디옥으로 보내기를 결정하니 곧 형제 중에 인도자인 바사바라 하는 유다와 실라더라” (<a href="https://bibleox.com/ko/ko-nkrv/act/15/#L6,22">행 15:6,22</a>)</p></blockquote><h3>공동의 규정</h3><p>교회에는 모두에게 공통된 분명한 규정이 있습니다:</p><blockquote><p>“<strong>여러 성으로 다녀 갈 때에</strong> 예루살렘에 있는 <strong>사도와 장로들이 작정한 규례를 그들에게 주어 지키게 하니</strong> 이에 여러 교회가 믿음이 더 굳건해지고 수가 날마다 늘어가니라” (<a href="https://bibleox.com/ko/ko-nkrv/act/16/#L4-5">행 16:4-5</a>)</p></blockquote><h3>파당으로 갈라지는 것을 금지함</h3><p>교회에서는 갈라지려는 시도를 모두 막습니다:</p><blockquote><p>“형제들아 내가 우리 주 예수 그리스도의 이름으로 너희를 <strong><mark>권하노니</mark></strong> <strong><mark>모두가 같은 말을 하고 너희 가운데 분쟁이 없이</mark></strong> <strong><mark>같은 마음과 같은 뜻으로 온전히 합하라</mark></strong> 내 형제들아 글로에의 집 편으로 너희에 대한 말이 내게 들리니 곧 <strong>너희 가운데 분쟁이 있다</strong>는 것이라 내가 이것을 말하거니와 너희가 각각 이르되 나는 바울에게, 나는 아볼로에게, 나는 게바에게, 나는 그리스도에게 속한 자라 한다는 것이니 <strong>그리스도께서 어찌 나뉘었느냐</strong> 바울이 너희를 위하여 십자가에 못 박혔으며 바울의 이름으로 너희가 세례를 받았느냐” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/1/#L10-13">고전 1:10-13</a>; <a href="https://bibleox.com/ko/ko-nkrv/1kor/3/#L4">고전 3:4</a>)</p></blockquote><h3>하나의 신앙과 성사</h3><p>교회에는 모두에게 공통된 분명한 신앙이 하나만 있습니다:</p><blockquote><p>“주도 한 분이시요 <strong>믿음도 하나요</strong> 세례도 하나요” (<a href="https://bibleox.com/ko/ko-nkrv/ef/4/#L5">엡 4:5</a>)</p></blockquote><blockquote><p>“<strong>지나쳐 그리스도의 교훈 안에 거하지 아니하는 자는 다 하나님을 모시지 못하되</strong> 교훈 안에 거하는 그 사람은 아버지와 아들을 모시느니라” (<a href="https://bibleox.com/ko/ko-nkrv/2in/1/#L9">요이 1:9</a>)</p></blockquote><p>구세주께서 말씀하시듯, 신앙은 사도들의 말을 따른 것입니다:</p><blockquote><p>“내가 비옵는 것은 이 사람들만 위함이 아니요 또 <strong>그들의 말로 말미암아 나를 믿는 사람들</strong>도 위함이니” (<a href="https://bibleox.com/ko/ko-nkrv/in/17/#L20">요 17:20</a>)</p></blockquote><p>교회는 장차 하나의 신앙에서 갈라져 나가려는 사람들이 나타나리라는 것을 알고 있었습니다. 이런 사람들은 교회라고 불리지 않습니다:</p><blockquote><p>“그들이 너희에게 말하기를 마지막 때에 자기의 경건하지 않은 정욕대로 행하며 조롱하는 자들이 있으리라 하였나니 이 사람들은 <strong>분열을 일으키는 자며</strong> 육에 속한 자며 성령이 없는 자니라” (<a href="https://bibleox.com/ko/ko-nkrv/iud/1/#L18-19">유 1:18-19</a>)</p></blockquote><h3>하나의 사제 품계</h3><blockquote><p>“바울이 밀레도에서 사람을 에베소로 보내어 교회 장로들을 청하니 오매 그들에게 말하되 아시아에 들어온 첫날부터 지금까지 내가 항상 여러분 가운데서 어떻게 행하였는지를 여러분도 아는 바니 &lt;…&gt; 여러분은 자기를 위하여 또는 온 양 떼를 위하여 삼가라 <strong>성령이 그들 가운데 여러분을 감독자로 삼고</strong> 하나님이 자기 피로 사신 <strong>교회를 보살피게 하셨느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/act/20/#L17-18,28">행 20:17-18,28</a>)</p></blockquote><p><a href="https://bibleox.com/ru/ru/w/Таинство-Священства">신품성사</a>에 관하여 자세히.</p><p>이처럼 교회는 분명하고 눈에 보이는 공동체(유기체)입니다. 교회에는 공통된 사도적 신앙이 하나 있고, 모두에게 공통된 규정이 있으며, 사도들이 세운 지도자들은 모든 면에서 일치해 있고, 지체들 사이에는 장벽이 없습니다.</p><h2>교회의 경계와 성체성혈성사</h2><p>구약의 교회는 신약의 교회와 달리 그리스도의 몸이라고 불리지 않았습니다. 신약의 교회는 신비로운 신인(神人)의 유기체, <a href="https://bibleox.com/ru/ru/w/Церковь">그리스도의 몸</a>입니다. 그러므로 교회의 경계는 몸의 경계가 있는 곳에 있습니다. 사람 몸의 경계는 어디입니까? 피가 도는 곳이 몸이고, 피가 돌지 않는 곳은 몸이 아닙니다. 피가 없으면 사람의 부분들에 생명이 없습니다. 잘린 손은 더 이상 몸의 일부가 아니며, 피가 흘러 들어오지 않아 곧 썩게 됩니다. 참된 성체성혈이 있는 곳에 몸, 곧 교회가 있습니다:</p><blockquote><p>“우리가 축복하는 바 축복의 잔은 <strong>그리스도의 피에 참여함이</strong> 아니며 우리가 떼는 떡은 <strong>그리스도의 몸에 참여함이</strong> 아니냐 <strong>떡이 하나요 많은 우리가 한 몸이니 이는 우리가 다 한 떡에 참여함이라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/10/#L16-17">고전 10:16-17</a>)</p></blockquote><blockquote><p>“<strong>너희는 그리스도의 몸이요</strong> 지체의 각 부분이라” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/12/#L27">고전 12:27</a>)</p></blockquote><blockquote><p>“이제는 전에 멀리 있던 너희가 그리스도 예수 안에서 <strong>그리스도의 피로</strong> <strong>가까워졌느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ef/2/#L13">엡 2:13</a>)</p></blockquote><p>그래서 사람들은 교회 안에서만 구원받습니다. 그리스도께서는 <a href="https://bibleox.com/ru/ru/w/Церковь">몸, 곧 교회</a>의 구세주이시기 때문입니다:</p><blockquote><p>“이는 남편이 아내의 머리 됨이 그리스도께서 교회의 머리 됨과 같음이니 <strong>그가 바로 몸의 구주시니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ef/5/#L23">엡 5:23</a>)</p></blockquote><p><a href="https://bibleox.com/ru/ru/w/Евхаристия">성체성혈성사</a>에 관하여 자세히.</p><h3>안디옥의 주교, 성 이그나티오스 순교자(1세기), <a href="https://bibleox.com/ko/ko/w/Ig2S_스미르나교회에보낸편지/">스미르나 교회에 보낸 편지</a></h3><blockquote><p>“8장. … 주교를 제쳐 놓고 교회에 관한 일을 아무도 해서는 안 됩니다. <strong>주교 아래에서, 또는 주교가 맡긴 사람이 거행하는 성찬만을 확실한 것으로 여기십시오.</strong>”</p></blockquote>
  meta_desc: "“그러나 다른 사람들은 신도들의 모임에 끼어 들 생각을 감히 하지 못하였다” (사도 5:13)"
