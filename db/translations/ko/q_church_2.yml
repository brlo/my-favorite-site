  title: 교회 — 새 이스라엘
  copy_cover: true
  body: <h2>그리스도는 교회의 뿌리이십니다</h2><blockquote><p>“그러므로 너희가 그리스도 예수를 주로 받았으니 그 안에서 행하되 그 안에 <strong><mark>뿌리를 박으며</mark></strong> 세움을 받아 교훈을 받은 대로 믿음에 굳게 서서 감사함을 넘치게 하라” (<a href="https://bibleox.com/ko/ko-nkrv/kol/2/#L6-7">골 2:6-7</a>)</p></blockquote><blockquote><p>“나 예수는 교회들을 위하여 내 사자를 보내어 이것들을 너희에게 증언하게 하였노라 <strong><mark>나는 다윗의 뿌리요 자손이니</mark></strong> 곧 광명한 새벽 별이라 하시더라” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/22/#L16">계 22:16</a>)</p></blockquote><h3>그리스도는 가지들을 기르시는 포도나무이시기도 합니다</h3><blockquote><p>“나는 참포도나무요 내 아버지는 농부라 무릇 내게 붙어 있어 열매를 맺지 아니하는 가지는 아버지께서 그것을 제거해 버리시고 무릇 열매를 맺는 가지는 더 열매를 맺게 하려 하여 그것을 깨끗하게 하시느니라 너희는 내가 일러준 말로 이미 깨끗하여졌으니 <strong>내 안에 거하라</strong> 나도 너희 안에 거하리라 가지가 포도나무에 붙어 있지 아니하면 스스로 열매를 맺을 수 없음 같이 너희도 내 안에 있지 아니하면 그러하리라 <strong><mark>나는 포도나무요 너희는 가지라</mark></strong> 그가 내 안에, 내가 그 안에 거하면 사람이 열매를 많이 맺나니 나를 떠나서는 너희가 아무 것도 할 수 없음이라 <strong>사람이 내 안에 거하지 아니하면 가지처럼 밖에 버려져 마르나니</strong> 사람들이 그것을 모아다가 불에 던져 사르느니라” (<a href="https://bibleox.com/ko/ko-nkrv/in/15/#L1-6">요 15:1-6</a>)</p></blockquote><h3>그리스도는 교회의 머리이시기도 합니다</h3><blockquote><p>“<strong><mark>그는 몸인 교회의 머리시라</mark></strong> 그가 근본이시요 죽은 자들 가운데서 먼저 나신 이시니 이는 친히 만물의 으뜸이 되려 하심이요” (<a href="https://bibleox.com/ko/ko-nkrv/kol/1/#L18">골 1:18</a>)</p></blockquote><blockquote><p>“또 만물을 그의 발 아래에 복종하게 하시고 그를 만물 위에 교회의 머리로 삼으셨느니라 <strong>교회는 그의 몸이니</strong> 만물 안에서 만물을 충만하게 하시는 이의 충만함이니라” (<a href="https://bibleox.com/ko/ko-nkrv/ef/1/#L22-23">엡 1:22-23</a>)</p></blockquote><blockquote><p>“머리를 붙들지 아니하는지라 <strong><mark>온 몸이 머리로 말미암아</mark></strong> 마디와 힘줄로 공급함을 받고 연합하여 하나님이 자라게 하시므로 자라느니라” (<a href="https://bibleox.com/ko/ko-nkrv/kol/2/#L19">골 2:19</a>)</p></blockquote><h2>이스라엘의 일부(가지들)가 그리스도(뿌리)에게서 떨어져 나갔습니다</h2><p>이스라엘의 일부는 떨어져 나갔고, 이방 민족들이 뿌리(그리스도)에 접붙여졌습니다. 잘려 나간 유대인들은 뿌리의 잘린 일부가 아니라 잘린 가지들이라고 불립니다:</p><blockquote><p>“제사하는 처음 익은 곡식 가루가 거룩한즉 떡덩이도 그러하고 뿌리가 거룩한즉 가지도 그러하니라 또한 <strong><mark>가지 얼마가 꺾이었는데</mark></strong> <strong>돌감람나무인 네가 그들 중에 접붙임이 되어</strong> <strong><mark>참감람나무 뿌리의 진액을 함께 받는 자가 되었은즉</mark></strong> 그 가지들을 향하여 자랑하지 말라 자랑할지라도 네가 뿌리를 보전하는 것이 아니요 뿌리가 너를 보전하는 것이니라” (<a href="https://bibleox.com/ko/ko-nkrv/rim/11/#L16-18">롬 11:16-18</a>)</p></blockquote><blockquote><p>“이사야는 매우 담대하여 <strong>내가 나를 찾지 아니한 자들에게 찾은 바 되고</strong> 내게 묻지 아니한 자들에게 나타났노라 말하였고 <strong><mark>이스라엘에 대하여</mark></strong> 이르되 <strong><mark>순종하지 아니하고 거슬러 말하는 백성에게 내가 종일 내 손을 벌렸노라</mark></strong> 하였느니라” (<a href="https://bibleox.com/ko/ko-nkrv/rim/10/#L20-21">롬 10:20-21</a>)</p></blockquote><blockquote><p>“그러므로 내가 말하노니 <strong>하나님이 자기 백성을 버리셨느냐 그럴 수 없느니라</strong> 나도 이스라엘인이요 아브라함의 씨에서 난 자요 베냐민 지파라 &lt;…&gt; 그에게 하신 대답이 무엇이냐 내가 나를 위하여 <strong>바알에게 무릎을 꿇지 아니한 사람 칠천 명</strong>을 남겨 두었다 하셨으니 그런즉 이와 같이 지금도 <strong><mark>은혜로 택하심을 따라 남은 자가 있느니라</mark></strong> &lt;…&gt; 그런즉 어떠하냐 이스라엘이 구하는 그것을 얻지 못하고 <strong><mark>오직 택하심을 입은 자가 얻었고 그 남은 자들은 우둔하여졌느니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/rim/11/#L1,4-5,7">롬 11:1,4-5,7</a>)</p></blockquote><h2>떨어져 나간 가지들(이스라엘의 일부) 자리에 새 가지(다른 모든 민족)가 뿌리에 접붙여집니다</h2><blockquote><p>“그런데 여수룬이 기름지매 발로 찼도다 네가 살찌고 비대하고 윤택하매 <strong>자기를 지으신 하나님을 버리고</strong> 자기를 구원하신 반석을 업신여겼도다 그들이 다른 신으로 그의 질투를 일으키며 가증한 것으로 그의 진노를 격발하였도다 그들은 하나님께 제사하지 아니하고 귀신들에게 하였으니 곧 그들이 알지 못하던 신들, 근래에 들어온 새로운 신들 너희의 조상들이 두려워하지 아니하던 것들이로다 <strong>너를 낳은 반석을 네가 상관하지 아니하고</strong> 너를 내신 하나님을 네가 잊었도다 그러므로 여호와께서 보시고 미워하셨으니 그 자녀가 그를 격노하게 한 까닭이로다 그가 말씀하시기를 <strong><mark>내가 내 얼굴을 그들에게서 숨겨 그들의 종말이 어떠함을 보리니</mark></strong> 그들은 심히 패역한 세대요 진실이 없는 자녀임이로다 그들이 하나님이 아닌 것으로 내 질투를 일으키며 허무한 것으로 내 진노를 일으켰으니 <strong><mark>나도 백성이 아닌 자로 그들에게 시기가 나게 하며</mark></strong> 어리석은 민족으로 그들의 분노를 일으키리로다” (<a href="https://bibleox.com/ko/ko-nkrv/vtor/32/#L15-21">신 32:15-21</a>)</p></blockquote><blockquote><p>“여호와의 말씀이니라 <strong>보라 날이 이르리니</strong> 내가 이스라엘 집과 유다 집에 <strong><mark>새 언약을 맺으리라</mark></strong> <strong><mark>이 언약은 내가 그들의 조상들의 손을 잡고 애굽 땅에서 인도하여 내던 날에 맺은 것과 같지 아니할 것은</mark></strong> 내가 그들의 남편이 되었어도 그들이 내 언약을 깨뜨렸음이라 여호와의 말씀이니라 그러나 그 날 후에 내가 이스라엘 집과 맺을 언약은 이러하니 곧 내가 <strong><mark>나의 법을 그들의 속에 두며 그들의 마음에 기록하여 나는 그들의 하나님이 되고 그들은 내 백성이 될 것이라</mark></strong> 여호와의 말씀이니라 그들이 다시는 각기 이웃과 형제를 가리켜 이르기를 너는 여호와를 알라 하지 아니하리니 이는 작은 자로부터 큰 자까지 다 나를 알기 때문이라 내가 그들의 악행을 사하고 다시는 그 죄를 기억하지 아니하리라 여호와의 말씀이니라 여호와께서 이와 같이 말씀하셨느니라 그는 해를 낮의 빛으로 주셨고 달과 별들을 밤의 빛으로 정하였고 바다를 뒤흔들어 그 파도로 소리치게 하나니 그의 이름은 만군의 여호와니라 이 법도가 내 앞에서 폐할진대 이스라엘 자손도 내 앞에서 끊어져 영원히 나라가 되지 못하리라 여호와의 말씀이니라 여호와께서 이와 같이 말씀하시니라 위에 있는 하늘을 측량할 수 있으며 밑에 있는 땅의 기초를 탐지할 수 있다면 내가 이스라엘 자손이 행한 모든 일로 말미암아 그들을 다 버리리라 여호와의 말씀이니라” (<a href="https://bibleox.com/ko/ko-nkrv/ier/31/#L31-37">렘 31:31-37</a>)</p></blockquote><blockquote><p>“제사하는 처음 익은 곡식 가루가 거룩한즉 떡덩이도 그러하고 뿌리가 거룩한즉 가지도 그러하니라 또한 가지 얼마가 꺾이었는데 <strong><mark>돌감람나무인 네가 그들 중에 접붙임이 되어</mark></strong> <strong><mark>참감람나무 뿌리의 진액을 함께 받는 자가 되었은즉</mark></strong> 그 가지들을 향하여 자랑하지 말라 자랑할지라도 네가 뿌리를 보전하는 것이 아니요 뿌리가 너를 보전하는 것이니라” (<a href="https://bibleox.com/ko/ko-nkrv/rim/11/#L16-18">롬 11:16-18</a>)</p></blockquote><blockquote><p>“나는 나를 구하지 아니하던 자에게 물음을 받았으며 나를 찾지 아니하던 자에게 찾아냄이 되었으며 <strong><mark>내 이름을 부르지 아니하던 나라에 내가 여기 있노라 내가 여기 있노라 하였노라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/is/65/#L1">사 65:1</a>)</p></blockquote><blockquote><p>“내가 나를 위하여 그를 이 땅에 심고 <strong>긍휼히 여김을 받지 못하였던 자를 긍휼히 여기며</strong> <strong><mark>내 백성 아니었던 자에게 향하여 이르기를 너는 내 백성이라 하리니</mark></strong> 그들은 이르기를 주는 내 하나님이시라 하리라 하시니라” (<a href="https://bibleox.com/ko/ko-nkrv/os/2/#L23">호 2:23</a>)</p></blockquote><blockquote><p>“이 그릇은 우리니 곧 <strong><mark>유대인 중에서뿐 아니라 이방인 중에서도 부르신 자니라</mark></strong> 호세아의 글에도 이르기를 <strong><mark>내가 내 백성 아닌 자를 내 백성이라, 사랑하지 아니한 자를 사랑한 자라 부르리라</mark></strong> 너희는 내 백성이 아니라 한 그 곳에서 그들이 <strong><mark>살아 계신 하나님의 아들이라 일컬음을 받으리라</mark></strong> 함과 같으니라” (<a href="https://bibleox.com/ko/ko-nkrv/rim/9/#L24-26">롬 9:24-26</a>)</p></blockquote><h2>교회에서는 민족이 더 이상 중요하지 않습니다</h2><p>사도는 <a href="https://bibleox.com/ko/ko-nkrv/rim/11/#L16-18">롬 11:16-18</a>에서 극단 하나, 곧 유대인을 업신여기고 그들 위에 자신을 높이는 태도를 물리칩니다. 다른 극단은 그들 앞에 굽실거리는 태도입니다. 중용은 교회 안에 민족이 없는 것입니다. 거기서는 모두가 서로 형제이고, 교회에 들어오는 모든 이는 민족과 상관없이, 하느님께서 어디서 어떤 사람으로 태어나게 하셨든 형제가 됩니다:</p><blockquote><p>“거기에는 <strong><mark>헬라인이나 유대인이나</mark></strong> 할례파나 무할례파나 <strong><mark>야만인이나 스구디아인이나</mark></strong> <strong>종이나 자유인이</strong> 차별이 있을 수 없나니 오직 그리스도는 만유시요 만유 안에 계시니라” (<a href="https://bibleox.com/ko/ko-nkrv/kol/3/#L11">골 3:11</a>)</p></blockquote><h2>교회 안에서는 유대인과 이방인의 차이가 없습니다</h2><blockquote><p>“많은 변론이 있은 후에 베드로가 일어나 말하되 형제들아 너희도 알거니와 하나님이 이방인들로 내 입에서 복음의 말씀을 들어 믿게 하시려고 오래 전부터 너희 가운데서 나를 택하시고 또 마음을 아시는 하나님이 우리에게와 같이 그들에게도 성령을 주어 증언하시고 믿음으로 그들의 마음을 깨끗이 하사 <strong><mark>그들이나 우리나 차별하지 아니하셨느니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/act/15/#L7-9">행 15:7-9</a>)</p></blockquote><blockquote><p>“이제는 전에 멀리 있던 너희가 그리스도 예수 안에서 그리스도의 피로 가까워졌느니라 그는 우리의 화평이신지라 <strong><mark>둘로 하나를 만드사</mark></strong> 원수 된 것 곧 중간에 막힌 담을 자기 육체로 허시고 <strong>법조문으로 된 계명의 율법을 폐하셨으니</strong> 이는 <strong><mark>이 둘로 자기 안에서 한 새 사람을 지어</mark></strong> 화평하게 하시고 또 십자가로 <strong><mark>이 둘을 한 몸으로 하나님과 화목하게 하려</mark></strong> 하심이라 원수 된 것을 십자가로 소멸하시고 &lt;…&gt; 이는 그로 말미암아 <strong><mark>우리 둘이 한 성령 안에서 아버지께 나아감을 얻게 하려 하심이라</mark></strong> &lt;…&gt; 너희는 사도들과 선지자들의 터 위에 세우심을 입은 자라 그리스도 예수께서 친히 <strong>모퉁잇돌</strong>이 되셨느니라” (<a href="https://bibleox.com/ko/ko-nkrv/ef/2/#L13-16,18,20">엡 2:13-16,18,20</a>)</p></blockquote><h2>이스라엘 백성은 구세주께서 세상에 오시도록 선택되었습니다. 이 목적은 이루어졌습니다.</h2><p><a href="https://bibleox.com/ru/ru/w/ветхий-завет">자세히</a></p><h2>아브라함의 자손은 믿는 사람들입니다</h2><blockquote><p>“아브라함이 하나님을 믿으매 그것을 그에게 의로 정하셨다 함과 같으니라 그런즉 <strong><mark>믿음으로 말미암은 자들은 아브라함의 자손인 줄 알지어다</mark></strong> 또 하나님이 이방을 믿음으로 말미암아 의로 정하실 것을 성경이 미리 알고 먼저 아브라함에게 복음을 전하되 <strong>모든 이방인이</strong> 너로 말미암아 복을 받으리라 하였느니라 그러므로 <strong>믿음으로 말미암은 자는 믿음이 있는 아브라함과 함께 복을 받느니라</strong> 무릇 <strong>율법 행위에 속한 자들은 저주 아래에 있나니</strong> 기록된 바 누구든지 율법 책에 기록된 대로 모든 일을 항상 행하지 아니하는 자는 저주 아래에 있는 자라 하였음이라” (<a href="https://bibleox.com/ko/ko-nkrv/gal/3/#L6-10">갈 3:6-10</a>)</p></blockquote><h2>유대인은 겉이 아니라 영적으로(속으로) 그러한 사람입니다</h2><blockquote><p>“무릇 <strong>표면적 유대인이 유대인이 아니요</strong> 표면적 육신의 할례가 할례가 아니니라 오직 <strong><mark>이면적 유대인이 유대인이며</mark></strong> 할례는 마음에 할지니 영에 있고 율법 조문에 있지 아니한 것이라 그 칭찬이 사람에게서가 아니요 다만 하나님에게서니라” (<a href="https://bibleox.com/ko/ko-nkrv/rim/2/#L28-29">롬 2:28-29</a>)</p></blockquote><blockquote><p>“<strong><mark>할례나 무할례가 아무 것도 아니로되</mark></strong> 오직 새로 지으심을 받는 것만이 중요하니라” (<a href="https://bibleox.com/ko/ko-nkrv/gal/6/#L15">갈 6:15</a>)</p></blockquote><h2>모든 민족에서 나올 신약의 사제직에 관한 예언</h2><p>구약의 교회에서 사제는 유다 백성의 레위 지파, 아론의 가문에서만 세워졌습니다. 그러나 신약의 교회에서 사제는 유다 백성(아론 가문)만이 아니라 모든 민족에서 세워질 것입니다:</p><blockquote><p>“내가 그들의 행위와 사상을 아노라 때가 이르면 <strong><mark>뭇 나라와 언어가 다른 민족들을 모으리니</mark></strong> 그들이 와서 나의 영광을 볼 것이며 내가 그들 가운데에서 징조를 세워서 그들 가운데에서 도피한 자를 여러 나라 곧 다시스와 뿔과 활을 당기는 룻과 및 두발과 야완과 또 <strong>나의 명성을 듣지도 못하고 나의 영광을 보지도 못한</strong> 먼 섬들로 보내리니 그들이 나의 영광을 뭇 나라에 전파하리라 나 여호와가 말하노라 이스라엘 자손이 예물을 깨끗한 그릇에 담아 여호와의 집에 드림 같이 그들이 너희 모든 형제를 뭇 나라에서 나의 성산 예루살렘으로 말과 수레와 교자와 노새와 낙타에 태워다가 여호와께 예물로 드릴 것이요 <strong><mark>나는 그 가운데에서 택하여 제사장과 레위인을 삼으리라 여호와의 말이니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/is/66/#L18-21">사 66:18-21</a>)</p></blockquote>
