  body: <blockquote><p>“<strong>이 세상이나 세상에 있는 것들을 사랑하지 말라</strong> 누구든지 세상을 사랑하면 아버지의 사랑이 그 안에 있지 아니하니 이는 세상에 있는 모든 것이 <strong>육신의 정욕과 안목의 정욕과 이생의 자랑</strong>이니 다 아버지께로부터 온 것이 아니요 세상으로부터 온 것이라” (<a href="https://bibleox.com/ko/ko-nkrv/1in/2/#L15-16">요일 2:15-16</a>)</p></blockquote><blockquote><p>“너희가 순종하는 자식처럼 <strong>전에 알지 못할 때에 따르던 너희 사욕을</strong> 본받지 말고” (<a href="https://bibleox.com/ko/ko-nkrv/1pet/1/#L14">벧전 1:14</a>)</p></blockquote><p>이 시대의 모습이 아니라 하느님의 모습을 향해 나아가야 합니다:</p><blockquote><p>“너희는 <strong>이 세대를 본받지 말고</strong> 오직 마음을 새롭게 함으로 변화를 받아 <strong>하나님의 선하시고 기뻐하시고 온전하신 뜻이 무엇인지</strong> 분별하도록 하라” (<a href="https://bibleox.com/ko/ko-nkrv/rim/12/#L2">롬 12:2</a>)</p></blockquote>
