  title: 성전 — 천상 실재의 형상
  copy_cover: true
  body: '<h2>보이지 않는 것의 눈에 보이는 형상</h2><h3>우주</h3><p>하느님께서는 보이지 않는 것이 보이는 것을 통해 알려지도록 세상을 창조하셨습니다. 사람이 눈에 보이는 피조물을 바라보며 보이지 않는 창조주를 알게 하시려는 것입니다:</p><blockquote><p>“사람들이 <strong>하느님께 관해서 알 만한 것은</strong> <strong>하느님께서 밝히 보여 주셨기 때문에</strong> 너무나도 명백합니다. 하느님께서는 세상을 창조하신 때부터 <strong>창조물을 통하여</strong> 당신의 영원하신 능력과 신성과 같은 <strong>보이지 않는 특성</strong>을 나타내 보이셔서 인간이 보고 깨달을 수 있게 하셨습니다. 그러니 사람들이 무슨 핑계를 대겠습니까?” (<a href="https://bibleox.com/ko/ko-ctb/rim/1/#L19-20">로마 1:19-20</a>)</p></blockquote><h3>성전</h3><p>눈에 보이는 지상의 성전은 보이지 않는 천상 실재의 형상입니다. 예언자는 산에서 보여 주신 모양대로 성전을 지으라는 명령을 받습니다:</p><blockquote><p>“내가 이 백성들 가운데서 살고자 하니 그들에게 <strong>내가 있을 성소</strong>를 지으라고 하여라. <strong>내가 너에게 보여 주는 설계대로 성소를 짓고</strong> 거기에서 쓸 기구들도 내가 보여 주는 도본에 따라 만들어라. &lt;…&gt; <strong>산 위에서 너에게 보여 준 모양대로 만들어라</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/ish/25/#L8-9,40">출 25:8-9,40</a>)</p></blockquote><p>사도는 성전이 참 성소의 형상대로 지어졌음을 가리킵니다:</p><blockquote><p>“그리스도께서는 <strong>인간이 하늘의 참 성소를 본떠서 만든 지상의 성소</strong>에 들어 가신 것이 아니라 우리를 위해서 하느님 앞에 나타나시려고 바로 그 하늘의 성소에 들어 가신 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/evr/9/#L24">히브 9:24</a>)</p></blockquote><blockquote><p>“우리 조상들은 광야에 있을 때에 <strong>증거의 장막</strong>을 가지고 있었습니다. 그것은 모세가 하느님의 지시를 받고 만든 것인데 하느님께서는 모세에게 <strong>모형을 보여 주시며</strong> 그대로 만들라고 분부하셨던 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/act/7/#L44">사도 7:44</a>)</p></blockquote><h2>구약: 성전에는 하느님과 천사들만</h2><h3>보이지 않으시는 하느님</h3><p>하느님의 명령으로 지어진 구약의 성전에서 가장 중요한 자리에는 거룩한 것들이 담긴 궤(상자)만 놓여 있었고, 그 덮개 위 두 거룹 사이에서 하느님께서 당신을 드러내시고 말씀하셨습니다:</p><blockquote><p>“<strong>내가 거기에서 너를 만나, 속죄판 위 곧 증거궤 위에 있는 두 거룹 사이에서</strong> 이스라엘 자손들을 위하여 너에게 명할 모든 일들을 일러 주리라.” (<a href="https://bibleox.com/ko/ko-ctb/ish/25/#L22">출 25:22</a>)</p></blockquote><h3>거룩한 천사들</h3><p>성전은 곳곳이 천사(거룹)의 형상으로 가득했습니다.</p><h4>궤 덮개 위의 거룹</h4><blockquote><p>“속죄판은 마치로 두드려 늘여서 <strong>거룹 둘이 양쪽에 자리잡게 만드는데</strong> 거룹 하나 이쪽에, 또 한 거룹은 맞은쪽에 자리잡게 만들어라. 그 두 거룹은 <strong>속죄판 양쪽을</strong> 늘여서 만든다. 거룹들은 날개를 위로 펴서 속죄판을 덮고 속죄판 쪽으로 얼굴을 맞대게 하여라.” (<a href="https://bibleox.com/ko/ko-ctb/ish/25/#L18-20">출 25:18-20</a>)</p></blockquote><h4>궤 좌우의 거룹</h4><blockquote><p>“<strong>밀실에는 올리브나무로 높이 십 척 되는 거룹을 둘 만들어 놓았다</strong>. &lt;…&gt; 솔로몬은 이 <strong>거룹</strong>의 한 쪽 날개가 한 벽에 닿았고, 다른 거룹의 한쪽 날개가 다른 벽에 닿아 있었으며 각각 나머지 날개는 전의 중앙에서 서로 잇대어 있었다.” (<a href="https://bibleox.com/ko/ko-ctb/3ts/6/#L23,27">열상 6:23,27</a>)</p></blockquote><h4>휘장의 거룹</h4><blockquote><p>“그는 또 자주실과 붉은 실과 심홍 색실로 <strong>휘장을 짜고 그 위에 거룹들을 수놓았다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/2par/3/#L14">역하 3:14</a>; <a href="https://bibleox.com/ko/gr-lxx-byz/1mak/1/#L22">1마카 1:22</a>)</p></blockquote><h4>성전 벽의 거룹</h4><blockquote><p>“그는 <strong>전의 온 벽을 돌아 가며 거룹과</strong> 종려나무와 핀 꽃모양을 돋을 새김으로 새겨 놓았다.” (<a href="https://bibleox.com/ko/ko-ctb/3ts/6/#L29">열상 6:29</a>)</p></blockquote><p>성전의 구조에 관하여 자세히: <a href="https://bibleox.com/ru/ru/w/иерусалимский-храм">예루살렘 성전</a>.</p><h2>신약: 성전에는 하느님과 천사들과 의인들의 영혼</h2><h3>천상의 실재가 달라졌습니다</h3><p>하느님께서 사람이 되시어 눈에 보이게 되시고, 고난을 받으시고, 부활하시고, 하늘에 오르시어 눈에 보이게 왕좌에 앉으셨습니다(<a href="https://bibleox.com/ko/ko-ctb/mk/16/#L19">마르 16:19</a>; <a href="https://bibleox.com/ko/ko-ctb/ef/1/#L20-21">에페 1:20-21</a>; <a href="https://bibleox.com/ko/ko-ctb/otkr/3/#L21">묵시 3:21</a>).</p><h3>하느님이신 그리스도</h3><blockquote><p>“주님이신 예수께서 제자들에게 말씀을 다 하시고 승천하셔서 <strong><mark>하느님 오른편에 앉으셨다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/mk/16/#L19">마르 16:19</a>)</p></blockquote><blockquote><p>“하느님께서는 그 능력을 떨치시어 그리스도를 죽은 자들 가운데서 다시 살려 내시고 하늘 나라에 불러 올리셔서 <strong><mark>당신의 오른편에 앉히시고</mark></strong> 권세와 세력과 능력과 주권의 여러 천신들을 지배하게 하시고 또 현세와 내세의 모든 권력자들 위에 올려 놓으셨습니다.” (<a href="https://bibleox.com/ko/ko-ctb/ef/1/#L20-21">에페 1:20-21</a>)</p></blockquote><blockquote><p>“승리하는 자는 마치 내가 승리한 후에 <strong><mark>내 아버지와 함께 아버지의 옥좌에 앉은</mark></strong> 것같이 나와 함께 <strong>내 옥좌</strong>에 앉게 하여 주겠다.” (<a href="https://bibleox.com/ko/ko-ctb/otkr/3/#L21">묵시 3:21</a>)</p></blockquote><h3>거룩한 천사들</h3><blockquote><p>“다른 <strong>천사</strong> 하나가 금향로를 들고 제단 앞에 와 섰습니다. 그 천사는 모든 성도들의 기도를 향에 섞어서 옥좌 앞에 있는 황금제단에 드리려고 많은 향을 받아 들었습니다.” (<a href="https://bibleox.com/ko/ko-ctb/otkr/8/#L3">묵시 8:3</a>)</p></blockquote><blockquote><p>“그 성전으로부터는 재난을 하나씩 손에 든 <strong>일곱 천사</strong>가 나왔습니다. 그들은 깨끗하고 눈부신 모시옷을 입고 가슴에는 금띠를 두르고 있었습니다.” (<a href="https://bibleox.com/ko/ko-ctb/otkr/15/#L6">묵시 15:6</a>)</p></blockquote><h3>거룩한 의인들의 영혼</h3><blockquote><p>“어린 양이 다섯째 봉인을 떼셨을 때에 나는 <strong>하느님의 말씀 때문에 그리고 그 말씀을 증언했기 때문에 죽임을 당한 사람들의 영혼이 제단 아래</strong> 자리잡고 있는 것을 보았습니다. 그들은 큰 소리로 ‘거룩하시고 진실하신 대왕님, 우리가 얼마나 더 오래 기다려야 땅 위에 사는 자들을 심판하시고 또 우리가 흘린 피의 원수를 갚아 주시겠습니까?’하고 부르짖었습니다. 또 그들은 <strong>흰 두루마기</strong> 한 벌씩을 받았습니다. 그리고 <strong>그들처럼 죽임을 당하기로 되어 있는 동료 종들과 형제들</strong>이 다 죽어서 그 수가 찰 때까지 잠시 쉬라는 분부를 받았습니다.” (<a href="https://bibleox.com/ko/ko-ctb/otkr/6/#L9-11">묵시 6:9-11</a>)</p></blockquote><blockquote><p>“그리고 나는 <strong>어린 양</strong>이 시온산 위에 서 있는 것을 보았습니다. <strong>그 어린 양과 함께 십 사만 사천 명</strong>이 서 있었는데 그들의 이마에는 어린 양과 그 아버지의 이름이 적혀져 있었습니다. &lt;…&gt; 그 십 사만 사천 명은 옥좌와 네 생물과 원로들 앞에서 새로운 노래를 부르고 있었습니다. 그러나 그 노래는 <strong>땅으로부터 구출된</strong> 십 사만 사천 명 외에는 아무도 배울 수 없었습니다. 그들은 <strong>여자들과 더불어 몸을 더럽힌 일이 없는</strong> 사람들이며 숫총각들입니다. 그들은 <strong>어린 양이 가는 곳이면 어디든지 따라 다닙니다</strong>. 그들은 사람들 가운데서 구출되어 하느님과 어린 양에게 바쳐진 첫 열매입니다. 그들의 입에서는 거짓말을 찾아 볼 수 없었으며 그들은 아무런 흠도 없는 사람들입니다.” (<a href="https://bibleox.com/ko/ko-ctb/otkr/14/#L1,3-5">묵시 14:1,3-5</a>)</p></blockquote><h3>노래</h3><blockquote><p>“이 때에 갑자기 수많은 하늘의 군대가 나타나 그 천사와 함께 하느님을 찬양하였다. 하늘 높은 곳에는 하느님께 영광, 땅에서는 그가 사랑하시는 사람들에게 평화!‘” (<a href="https://bibleox.com/ko/ko-ctb/lk/2/#L13-14">루가 2:13-14</a>)</p></blockquote><blockquote><p>“그리고 나는 <strong>어린 양</strong>이 시온산 위에 서 있는 것을 보았습니다. <strong>그 어린 양과 함께 십 사만 사천 명</strong>이 서 있었는데 그들의 이마에는 어린 양과 그 아버지의 이름이 적혀져 있었습니다. &lt;…&gt; 그 십 사만 사천 명은 옥좌와 네 생물과 원로들 앞에서 <strong>새로운 노래를 부르고</strong> 있었습니다. 그러나 그 노래는 땅으로부터 구출된 십 사만 사천 명 외에는 아무도 배울 수 없었습니다. 그들은 여자들과 더불어 몸을 더럽힌 일이 없는 사람들이며 숫총각들입니다. 그들은 어린 양이 가는 곳이면 어디든지 따라 다닙니다. 그들은 사람들 가운데서 구출되어 하느님과 어린 양에게 바쳐진 첫 열매입니다. 그들의 입에서는 거짓말을 찾아 볼 수 없었으며 그들은 아무런 흠도 없는 사람들입니다.” (<a href="https://bibleox.com/ko/ko-ctb/otkr/14/#L1,3-5">묵시 14:1,3-5</a>)</p></blockquote><h3>천상 성전을 측량하라는 명령</h3><blockquote><p>“또 나는 지팡이 같은 측량자 하나를 받았는데 그 때 이런 말씀이 나에게 들려 왔습니다. ‘일어나서 <strong><mark>하느님의 성전과 제단을 측량하고</mark></strong> 성전 안에서 예배하는 사람들을 세어 보아라.” (<a href="https://bibleox.com/ko/ko-ctb/otkr/11/#L1">묵시 11:1</a>)</p></blockquote><h3>옥좌</h3><blockquote><p>“스물 네 원로는 <strong>옥좌에 앉아 계신 그분</strong> 앞에 엎드려 영원무궁토록 살아 계신 그분에게 경배를 드리고 있었습니다. 그리고 자기들의 금관을 벗어서 옥좌 앞에 내 놓으며” (<a href="https://bibleox.com/ko/ko-ctb/otkr/4/#L10">묵시 4:10</a>)</p></blockquote><blockquote><p>“그리고 하느님 앞에서 자기 자리에 앉아 있던 스물 네 원로도 엎드려 하느님께 경배하며,” (<a href="https://bibleox.com/ko/ko-ctb/otkr/11/#L16">묵시 11:16</a>)</p></blockquote><h3>제단</h3><blockquote><p>“다른 천사 하나가 금향로를 들고 <strong>제단 앞에</strong> 와 섰습니다. 그 천사는 모든 성도들의 기도를 향에 섞어서 <strong>옥좌 앞에 있는 황금제단</strong>에 드리려고 많은 향을 받아 들었습니다.” (<a href="https://bibleox.com/ko/ko-ctb/otkr/8/#L3">묵시 8:3</a>)</p></blockquote><blockquote><p>“그 뒤에 그 천사는 향로를 가져다가 거기에 <strong>제단 불</strong>을 가득히 담아서 땅에 던졌습니다. 그러자 천둥과 요란한 소리와 번개와 지진이 일어났습니다.” (<a href="https://bibleox.com/ko/ko-ctb/otkr/8/#L5">묵시 8:5</a>)</p></blockquote><blockquote><p>“여섯째 천사가 나팔을 불었습니다. 그러자 나는 하느님 앞에 있는 <strong>금제단</strong>의 네 모퉁이에 달린 뿔에서 나오는 한 음성을 들었습니다.” (<a href="https://bibleox.com/ko/ko-ctb/otkr/9/#L13">묵시 9:13</a>)</p></blockquote><h3>일곱 가지 등잔대</h3><blockquote><p>“그 옥좌에서는 번개가 번쩍였고 요란한 소리와 천둥소리가 터져 나왔습니다. 그리고 <strong>옥좌 앞에서는 일곱 횃불이</strong> 훨훨 타고 있었습니다. 그 일곱 횃불은 하느님의 일곱 영신이십니다.” (<a href="https://bibleox.com/ko/ko-ctb/otkr/4/#L5">묵시 4:5</a>)</p></blockquote><h3>분향</h3><blockquote><p>“다른 천사 하나가 <strong>금향로</strong>를 들고 제단 앞에 와 섰습니다. 그 천사는 모든 성도들의 기도를 향에 섞어서 옥좌 앞에 있는 황금제단에 드리려고 <strong>많은 향</strong>을 받아 들었습니다. &lt;…&gt; 그 뒤에 그 <strong>천사는 향로를 가져다가</strong> 거기에 제단 불을 가득히 담아서 땅에 던졌습니다. 그러자 천둥과 요란한 소리와 번개와 지진이 일어났습니다.” (<a href="https://bibleox.com/ko/ko-ctb/otkr/8/#L3,5">묵시 8:3,5</a>)</p></blockquote><h3>리옹의 이레네오(2세기): 성전은 천상 실재의 형상입니다</h3><p>성전이 천상 실재의 형상대로 지어졌다는 것은 리옹의 성 이레네오(2세기)가 확인해 줍니다. 이레네오는 신학자 요한의 묵시록을 근거로, 지상의 것들이 하느님께서 창조하신 천상의 것들의 형상인 것이 합당하다고 말합니다:</p><blockquote><p>“그러므로 그분께서는 이런 봉사가 필요하지 않으시지만 우리가 열매 없이 지내지 않도록 우리 자신을 위해 그것을 바치기를 바라십니다. 이처럼 말씀께서는 예물이 필요하지 않으셨지만, 백성이 하느님을 섬기는 법을 배우도록 예물을 바치라는 바로 그 계명을 주셨습니다. 그러므로 <strong>우리도 제단에 예물을</strong> 자주, 끊임없이 <strong>바치는 것</strong>이 그분의 뜻입니다. <strong><mark>그러므로 제단은 하늘에 있습니다</mark></strong>(우리의 기도와 봉헌이 그곳을 향하기 때문입니다). <strong><mark>성전도 그러합니다</mark></strong>. 요한이 묵시록에서 “하느님의 성전이 열리고”(묵시 11:19)라고 말하는 대로입니다. 장막도 그러합니다. “보라, 하느님의 장막이 사람들과 함께 있다”(묵시 21:3)고 하기 때문입니다. 예물과 봉헌과 모든 제사를 백성은 산에서 모세에게 보여 주신 대로 표상으로 받았으며, 이는 오늘날 모든 민족 가운데 교회에서 이름이 찬양받으시는 한 분 같은 하느님에게서 온 것입니다. <strong><mark>우리 둘레에 펼쳐진 지상의 것들이 천상의 것들의 표상인 것은 합당합니다</mark></strong>. 둘 다 같은 하느님께서 창조하셨기 때문입니다. <strong>달리는 그분께서 영적인 것들의 형상을 [우리가 이해하도록] 나타내실 수 없었을 것입니다</strong>.”</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b4/">이단 반박 4권 18~19장</a>, 영어)</p><h2>하느님께서는 성전을 공경하라고 명하셨습니다</h2><p>성전은 <a href="https://bibleox.com/ru/ru/w/храм-образ-небесной-реальности">천상 실재의 형상</a>입니다. 하느님께서는 이 형상을 공경하라고 명하셨습니다:</p><blockquote><p>“너희는 나의 안식일을 지키고, <strong>나의 성소를 소중하게 여겨라</strong>. 나는 야훼이다.” (<a href="https://bibleox.com/ko/ko-ctb/lev/19/#L30">레 19:30</a>)</p></blockquote><blockquote><p>“너희는 나의 안식일을 지키고, <strong>나의 성소를 어려워하여라</strong>. 나는 야훼이다.” (<a href="https://bibleox.com/ko/ko-ctb/lev/26/#L2">레 26:2</a>)</p></blockquote><p>신약의 성전은 신학자 요한의 묵시록에 나오는 형상대로 지어집니다.</p>'
