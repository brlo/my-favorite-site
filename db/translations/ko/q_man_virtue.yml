  title: 사랑
  copy_cover: true
  body: <h2>하느님과 이웃에 대한 사랑은 가장 큰 계명입니다</h2><blockquote><p>“예수께서 대답하시되 첫째는 이것이니 이스라엘아 들으라 주 곧 우리 하나님은 유일한 주시라 <strong><mark>네 마음을 다하고 목숨을 다하고 뜻을 다하고 힘을 다하여 주 너의 하나님을 사랑하라</mark></strong> 하신 것이요 둘째는 이것이니 <strong><mark>네 이웃을 네 자신과 같이 사랑하라</mark></strong> 하신 것이라 이보다 더 큰 계명이 없느니라” (<a href="https://bibleox.com/ko/ko-nkrv/mk/12/#L29-31">막 12:29-31</a>; <a href="https://bibleox.com/ko/ko-nkrv/vtor/6/#L5">신 6:5</a>; <a href="https://bibleox.com/ko/ko-nkrv/lev/19/#L18">레 19:18</a>)</p></blockquote><blockquote><p>“어떤 율법교사가 일어나 예수를 시험하여 이르되 선생님 <strong>내가 무엇을 하여야 영생을 얻으리이까</strong> 예수께서 이르시되 율법에 무엇이라 기록되었으며 네가 어떻게 읽느냐 대답하여 이르되 <strong><mark>네 마음을 다하며 목숨을 다하며 힘을 다하며 뜻을 다하여 주 너의 하나님을 사랑하고</mark></strong> 또한 <strong><mark>네 이웃을 네 자신 같이 사랑하라</mark></strong> 하였나이다 예수께서 이르시되 네 대답이 옳도다 이를 행하라 그러면 살리라 하시니” (<a href="https://bibleox.com/ko/ko-nkrv/lk/10/#L25-28">눅 10:25-28</a>)</p></blockquote><h2>무엇보다 사랑</h2><blockquote><p>“<strong><mark>내가</mark></strong> 사람의 방언과 천사의 말을 할지라도 사랑이 없으면 소리 나는 구리와 울리는 꽹과리가 되고 내가 예언하는 능력이 있어 모든 비밀과 모든 지식을 알고 또 산을 옮길 만한 모든 믿음이 있을지라도 <strong><mark>사랑이 없으면 내가 아무 것도 아니요</mark></strong> 내가 내게 있는 모든 것으로 구제하고 또 내 몸을 불사르게 내줄지라도 사랑이 없으면 내게 아무 유익이 없느니라” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/13/#L1-3">고전 13:1-3</a>)</p></blockquote><blockquote><p>“많은 물도 이 사랑을 끄지 못하겠고 홍수라도 삼키지 못하나니 <strong><mark>사람이 그의 온 가산을 다 주고 사랑과 바꾸려 할지라도 오히려 멸시를 받으리라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/pp/8/#L7">아 8:7</a>)</p></blockquote><h2>사랑은 영원합니다</h2><blockquote><p>“<strong><mark>사랑은 언제까지나 떨어지지 아니하되</mark></strong> 예언도 폐하고 방언도 그치고 지식도 폐하리라” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/13/#L8">고전 13:8</a>)</p></blockquote><blockquote><p>“너는 나를 도장 같이 마음에 품고 도장 같이 팔에 두라 사랑은 죽음 같이 강하고 질투는 스올 같이 잔인하며 불길 같이 일어나니 그 기세가 여호와의 불과 같으니라 <strong><mark>많은 물도 이 사랑을 끄지 못하겠고 홍수라도 삼키지 못하나니</mark></strong> 사람이 그의 온 가산을 다 주고 사랑과 바꾸려 할지라도 오히려 멸시를 받으리라” (<a href="https://bibleox.com/ko/ko-nkrv/pp/8/#L6-7">아 8:6-7</a>)</p></blockquote><h2>사랑은 어떤 모습일 수 있는가</h2><blockquote><p>“사랑은 <strong>오래 참고</strong> 사랑은 <strong>온유하며</strong> <strong>시기하지 아니하며</strong> 사랑은 <strong>자랑하지 아니하며</strong> <strong>교만하지 아니하며</strong> <strong>무례히 행하지 아니하며</strong> <strong>자기의 유익을 구하지 아니하며</strong> <strong>성내지 아니하며</strong> <strong>악한 것을 생각하지 아니하며</strong> <strong>불의를 기뻐하지 아니하며</strong> <strong>진리와 함께 기뻐하고</strong> <strong>모든 것을 참으며</strong> <strong>모든 것을 믿으며</strong> <strong>모든 것을 바라며</strong> <strong>모든 것을 견디느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/13/#L4-7">고전 13:4-7</a>)</p></blockquote><blockquote><p>“<strong><mark>내 아들아 여호와의 징계를 경히 여기지 말라 그 꾸지람을 싫어하지 말라 대저 여호와께서 그 사랑하시는 자를 징계하시기를</mark></strong> 마치 아비가 그 기뻐하는 아들을 징계함 같이 하시느니라” (<a href="https://bibleox.com/ko/ko-nkrv/pr/3/#L11-12">잠 3:11-12</a>)</p></blockquote><blockquote><p>“<strong><mark>주께서 그 사랑하시는 자를 징계하시고</mark></strong> 그가 받아들이시는 아들마다 채찍질하심이라 하였으니” (<a href="https://bibleox.com/ko/ko-nkrv/evr/12/#L6">히 12:6</a>)</p></blockquote><blockquote><p>“<strong><mark>무릇 내가 사랑하는 자를 책망하여 징계하노니</mark></strong> 그러므로 네가 열심을 내라 회개하라” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/3/#L19">계 3:19</a>)</p></blockquote><blockquote><p>“우리가 판단을 받는 것은 <strong>주께 징계를 받는 것이니 이는 우리로 세상과 함께 정죄함을 받지 않게 하려 하심이라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/11/#L32">고전 11:32</a>)</p></blockquote><blockquote><p>“볼지어다 <strong>하나님께 징계 받는 자에게는 복이 있나니</strong> 그런즉 너는 전능자의 징계를 업신여기지 말지니라 하나님은 아프게 하시다가 싸매시며 상하게 하시다가 그의 손으로 고치시나니” (<a href="https://bibleox.com/ko/ko-nkrv/iov/5/#L17-18">욥 5:17-18</a>)</p></blockquote><blockquote><p>“너는 나를 도장 같이 마음에 품고 도장 같이 팔에 두라 <strong><mark>사랑은 죽음 같이 강하고</mark></strong> <strong><mark>질투는 스올 같이 잔인하며</mark></strong> <strong><mark>불길 같이 일어나니</mark></strong> <strong><mark>그 기세가 여호와의 불과 같으니라</mark></strong> 많은 물도 이 사랑을 끄지 못하겠고 홍수라도 삼키지 못하나니 사람이 그의 온 가산을 다 주고 사랑과 바꾸려 할지라도 오히려 멸시를 받으리라” (<a href="https://bibleox.com/ko/ko-nkrv/pp/8/#L6-7">아 8:6-7</a>)</p></blockquote>
