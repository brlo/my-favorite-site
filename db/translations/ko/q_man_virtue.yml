- src: Незлобие-милосердие-прощение
  path: Ml6c_악의를_품지_않음
  title: 악의를 품지 않음(긍휼)
  copy_cover: true
  body: <blockquote><p>“<strong><mark>내 사랑하는 자들아 너희가 친히 원수를 갚지 말고 하나님의 진노하심에 맡기라</mark></strong> 기록되었으되 원수 갚는 것이 내게 있으니 내가 갚으리라고 주께서 말씀하시니라” (<a href="https://bibleox.com/ko/ko-nkrv/rim/12/#L19">롬 12:19</a>)</p></blockquote><blockquote><p>“<strong><mark>너는 악을 갚겠다 말하지 말고 여호와를 기다리라</mark></strong> 그가 너를 구원하시리라” (<a href="https://bibleox.com/ko/ko-nkrv/pr/20/#L22">잠 20:22</a>)</p></blockquote>
  menu:
    parent: 사람/덕
