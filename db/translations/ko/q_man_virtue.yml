- src: благодарение
  path: Th5g_감사
  title: 감사
  copy_cover: true
  body: <blockquote><p>“항상 기뻐하라 쉬지 말고 기도하라 <strong>범사에 감사하라</strong> 이것이 그리스도 예수 안에서 너희를 향하신 하나님의 뜻이니라” (<a href="https://bibleox.com/ko/ko-nkrv/1sol/5/#L16-18">살전 5:16-18</a>)</p></blockquote><blockquote><p>“너희가 모든 일에 넉넉하여 너그럽게 연보를 함은 그들이 우리로 말미암아 <strong>하나님께 감사하게 하는 것이라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2kor/9/#L11">고후 9:11</a>)</p></blockquote><blockquote><p>“이 봉사의 직무가 성도들의 부족한 것을 보충할 뿐 아니라 사람들이 하나님께 드리는 <strong>많은 감사로 말미암아</strong> 넘쳤느니라” (<a href="https://bibleox.com/ko/ko-nkrv/2kor/9/#L12">고후 9:12</a>)</p></blockquote><blockquote><p>“그 안에 뿌리를 박으며 세움을 받아 교훈을 받은 대로 믿음에 굳게 서서 <strong>감사함을 넘치게 하라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/kol/2/#L7">골 2:7</a>)</p></blockquote><blockquote><p>“또 무엇을 하든지 말에나 일에나 다 주 예수의 이름으로 하고 그를 힘입어 <strong>하나님 아버지께 감사하라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/kol/3/#L17">골 3:17</a>)</p></blockquote><blockquote><p>“아무 것도 염려하지 말고 다만 모든 일에 기도와 간구로, 너희 구할 것을 <strong>감사함으로 하나님께 아뢰라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/fil/4/#L6">빌 4:6</a>)</p></blockquote><blockquote><p>“누추함과 어리석은 말이나 희롱의 말이 마땅치 아니하니 <strong>오히려 감사하는 말을 하라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ef/5/#L4">엡 5:4</a>)</p></blockquote><blockquote><p>“기도를 계속하고 <strong>기도에 감사함으로 깨어 있으라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/kol/4/#L2">골 4:2</a>)</p></blockquote><blockquote><p>“하나님을 알되 하나님을 영화롭게도 아니하며 <strong>감사하지도 아니하고</strong> 오히려 그 생각이 허망하여지며 미련한 마음이 어두워졌나니” (<a href="https://bibleox.com/ko/ko-nkrv/rim/1/#L21">롬 1:21</a>)</p></blockquote><blockquote><p>“사람들이 자기를 사랑하며 돈을 사랑하며 자랑하며 교만하며 비방하며 부모를 거역하며 <strong>감사하지 아니하며</strong> 거룩하지 아니하며” (<a href="https://bibleox.com/ko/ko-nkrv/2tim/3/#L2">딤후 3:2</a>)</p></blockquote><p>감사는 지금 가진 좋은 것에 만족하는 마음을 뜻합니다:</p><blockquote><p>“그러나 <strong>자족하는 마음이 있으면 경건은 큰 이익이 되느니라</strong> &lt;…&gt; <strong>우리가 먹을 것과 입을 것이 있은즉 족한 줄로 알 것이니라</strong> 부하려 하는 자들은 시험과 올무와 여러 가지 어리석고 해로운 욕심에 떨어지나니 곧 사람으로 파멸과 멸망에 빠지게 하는 것이라” (<a href="https://bibleox.com/ko/ko-nkrv/1tim/6/#L6,8-9">딤전 6:6,8-9</a>)</p></blockquote><blockquote><p>“내가 궁핍하므로 말하는 것이 아니니라 <strong>어떠한 형편에든지 나는 자족하기를 배웠노니</strong> 나는 비천에 처할 줄도 알고 풍부에 처할 줄도 알아 모든 일 곧 배부름과 배고픔과 풍부와 궁핍에도 처할 줄 아는 일체의 비결을 배웠노라” (<a href="https://bibleox.com/ko/ko-nkrv/fil/4/#L11-12">빌 4:11-12</a>)</p></blockquote><blockquote><p>“이 사람들은 <strong>원망하는 자며 불만을 토하는 자며</strong> 그 정욕대로 행하는 자라 그 입으로 자랑하는 말을 하며 이익을 위하여 아첨하느니라” (<a href="https://bibleox.com/ko/ko-nkrv/iud/1/#L16">유 1:16</a>)</p></blockquote>
  meta_desc: 감사의 덕에 관한 성경 구절
