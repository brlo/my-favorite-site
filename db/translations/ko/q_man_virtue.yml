  body: <h2>구제, 가난한 이에 대한 사랑, 너그러움</h2><blockquote><p>“네 하나님 여호와께서 네게 주신 땅 어느 성읍에서든지 <strong>가난한 형제가</strong> 너와 함께 거주하거든 그 가난한 형제에게 네 마음을 완악하게 하지 말며 <strong>네 손을 움켜 쥐지 말고</strong> <strong>반드시 네 손을 그에게 펴서</strong> 그에게 필요한 대로 쓸 것을 넉넉히 꾸어주라 삼가 너는 마음에 악한 생각을 품지 말라 곧 이르기를 일곱째 해 면제년이 가까이 왔다 하고 <strong>네 궁핍한 형제를 악한 눈으로 바라보며</strong> 아무것도 주지 아니하면 그가 너를 여호와께 호소하리니 그것이 네게 죄가 되리라 너는 반드시 그에게 줄 것이요, 줄 때에는 아끼는 마음을 품지 말 것이니라 이로 말미암아 네 하나님 여호와께서 네가 하는 모든 일과 네 손이 닿는 모든 일에 네게 복을 주시리라 <strong>땅에는 언제든지 가난한 자가 그치지 아니하겠으므로</strong> 내가 네게 명령하여 이르노니 너는 반드시 <strong>네 땅 안에 네 형제 중 곤란한 자와 궁핍한 자에게 네 손을 펼지니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/vtor/15/#L7-11">신 15:7-11</a>)</p></blockquote><blockquote><p>“네 손이 선을 베풀 힘이 있거든 <strong>마땅히 받을 자에게 베풀기를 아끼지 말며</strong> 네게 있거든 이웃에게 이르기를 갔다가 다시 오라 내일 주겠노라 하지 말며” (<a href="https://bibleox.com/ko/ko-nkrv/pr/3/#L27-28">잠 3:27-28</a>)</p></blockquote><blockquote><p>“<strong>가난한 이에게 네 손을 내밀어라.</strong> 그래야 네 복이 온전해진다. <strong>선물의 은혜를 모든 산 이에게 베풀고, 죽은 이에게도 은혜를 거두지 말라</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/prsir/7/#L32-33">집회 7:32-33</a>, 그리스어에서 번역)</p></blockquote><blockquote><p>“기도는 금식과 구제와 의로움과 함께할 때 좋다. … 금을 쌓아 두는 것보다 구제하는 것이 낫다. <strong>구제는 죽음에서 건져 주고 모든 죄를 깨끗하게 씻어 준다</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/tov/12/#L8-9">토비 12:8-9</a>, 그리스어에서 번역)</p></blockquote><blockquote><p>“그러나 <strong>그 안에 있는 것으로 구제하라</strong> <strong>그리하면 모든 것이 너희에게 깨끗하리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/lk/11/#L41">눅 11:41</a>)</p></blockquote><blockquote><p>“<strong>긍휼히 여기는 자는 복이 있나니 그들이 긍휼히 여김을 받을 것임이요</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/5/#L7">마 5:7</a>)</p></blockquote>
