- src: Единомыслие
  path: Lk4m_한마음
  title: 한마음
  copy_cover: true
  body: <h2>지혜는 형제들의 한마음과 화목으로 아름다워집니다</h2><p>집회서에서 지혜는 자기를 찬양하며(<a href="https://bibleox.com/ko/gr-lxx-byz/prsir/24/#L1-3">집회 24:1-3</a>) 이렇게 말합니다:</p><blockquote><p>“나는 세 가지로 아름다워졌고, 주님과 사람들 앞에 아름답게 섰다. <strong>형제들의 한마음과 이웃들의 우정과 서로 잘 맞는 아내와 남편이다</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/prsir/25/#L1">집회 25:1</a>, 그리스어에서 번역)</p></blockquote><h2>교회에 일치와 한마음을 주시기를 비는 기도</h2><blockquote><p>“아버지여, 아버지께서 내 안에, 내가 아버지 안에 있는 것 같이 <strong><mark>그들도 다 하나가 되어</mark></strong> 우리 안에 있게 하사 <strong>세상으로 아버지께서 나를 보내신 것을 믿게 하옵소서</strong> 내게 주신 영광을 내가 그들에게 주었사오니 이는 <strong><mark>우리가 하나가 된 것 같이 그들도 하나가 되게 하려 함이니이다</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/in/17/#L21-22">요 17:21-22</a>)</p></blockquote><blockquote><p>“이제 인내와 위로의 하나님이 너희로 그리스도 예수를 본받아 <strong><mark>서로 뜻이 같게 하여 주사</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/rim/15/#L5">롬 15:5</a>)</p></blockquote><h2>한마음이 되라는 계명</h2><p>하느님의 선물은 사람의 뜻을 거슬러 주어지지 않습니다. 예를 들어 사랑은 하느님의 선물이지만(<a href="https://bibleox.com/ko/ko-nkrv/1in/4/#L7-8">요일 4:7-8</a>; <a href="https://bibleox.com/ko/ko-nkrv/gal/5/#L22-23">갈 5:22-23</a>; <a href="https://bibleox.com/ko/ko-nkrv/rim/5/#L5">롬 5:5</a>) 사람에게 억지로 지워지지 않으며, 온 뒤에도 그의 뜻을 거슬러 그 안에 머물지 않습니다. 누구나 사랑을 얻으려고 수고해야 하고(<a href="https://bibleox.com/ko/ko-nkrv/1kor/13/#L1-2,13">고전 13:1-2,13</a>; <a href="https://bibleox.com/ko/ko-nkrv/kol/3/#L14">골 3:14</a>) 자기 뜻을 사랑의 행위로 기울여야 하며(<a href="https://bibleox.com/ko/ko-nkrv/in/13/#L34">요 13:34</a>; <a href="https://bibleox.com/ko/ko-nkrv/in/15/#L12">요 15:12</a>; <a href="https://bibleox.com/ko/ko-nkrv/in/15/#L17">요 15:17</a>; <a href="https://bibleox.com/ko/ko-nkrv/1pet/1/#L22">벧전 1:22</a>), 하느님께서는 이 노력에 응답하여 선물을 주시고 지켜 주십니다(<a href="https://bibleox.com/ko/ko-nkrv/pr/21/#L31">잠 21:31</a>).</p><p>한마음도 하느님께로부터 옵니다. 그리스도와 사도들이 이것을 하느님께 기도했기 때문입니다(<a href="https://bibleox.com/ko/ko-nkrv/in/17/#L21-22">요 17:21-22</a>; <a href="https://bibleox.com/ko/ko-nkrv/rim/15/#L5">롬 15:5</a>). 사랑과 한마음의 선물은 성령께서 교회에 주셨지만, 교회 안의 누구나 수고하여 이 선물을 얻고 지켜야 합니다. 믿는 이 한 사람 한 사람은 사랑을 거슬러서도, 한마음을 거슬러서도 죄를 지을 수 있습니다. 그러므로 누구나 사랑과 한마음을 지키라는 부름을 받습니다:</p><blockquote><p>“<strong><mark>서로 마음을 같이하며</mark></strong> 높은 데 마음을 두지 말고 도리어 <strong>낮은 데 처하며</strong> 스스로 지혜 있는 체 하지 말라” (<a href="https://bibleox.com/ko/ko-nkrv/rim/12/#L16">롬 12:16</a>)</p></blockquote><blockquote><p>“형제들아 내가 우리 주 예수 그리스도의 이름으로 너희를 권하노니 <strong>모두가 같은 말을 하고</strong> 너희 가운데 분쟁이 없이 <strong><mark>같은 마음과 같은 뜻으로 온전히 합하라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/1/#L10">고전 1:10</a>)</p></blockquote><blockquote><p>“마지막으로 말하노니 형제들아 기뻐하라 온전하게 되며 위로를 받으며 <strong><mark>마음을 같이하며</mark></strong> 평안할지어다 또 사랑과 평강의 하나님이 너희와 함께 계시리라 거룩하게 입맞춤으로 서로 문안하라” (<a href="https://bibleox.com/ko/ko-nkrv/2kor/13/#L11">고후 13:11</a>)</p></blockquote><blockquote><p>“<strong><mark>마음을 같이하여</mark></strong> 같은 사랑을 가지고 <strong><mark>뜻을 합하며 한마음을 품어</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/fil/2/#L2">빌 2:2</a>)</p></blockquote><blockquote><p>“마지막으로 말하노니 <strong><mark>너희가 다 마음을 같이하여</mark></strong> 동정하며 형제를 사랑하며 불쌍히 여기며 겸손하며” (<a href="https://bibleox.com/ko/ko-nkrv/1pet/3/#L8">벧전 3:8</a>)</p></blockquote><h2>반론</h2><h3>너희 중에 파당이 있어야 한다</h3><blockquote><p>“너희 중에 <strong>파당이</strong> 있어야 너희 중에 옳다 인정함을 받은 자들이 나타나게 되리라” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/11/#L19">고전 11:19</a>)</p></blockquote><p>원문에는 “파당” 대신 “이단들”(그리스어 αἱρέσεις)이라는 말이 있습니다. 곧 “너희 중에 이단이 있어야 한다”는 것입니다. 이것은 이단이 생겨나리라는 예언일 뿐입니다. 이단을 퍼뜨리는 자는 사도의 말에 따르면 하느님 나라를 유업으로 받지 못합니다:</p><blockquote><p>“육체의 일은 분명하니 곧 음행과 더러운 것과 호색과 우상 숭배와 주술과 원수 맺는 것과 분쟁과 시기와 분냄과 당 짓는 것과 분열함과 <strong>이단과</strong> 투기와 술 취함과 방탕함과 또 그와 같은 것들이라 전에 너희에게 경계한 것 같이 경계하노니 이런 일을 하는 자들은 <strong>하나님의 나라를 유업으로 받지 못할 것이요</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gal/5/#L19-21">갈 5:19-21</a>)</p></blockquote>
  meta_desc: 한마음에 관한 성경 구절
