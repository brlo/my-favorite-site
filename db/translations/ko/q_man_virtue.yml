- src: смирение
  path: Hm2l_겸손
  title: 겸손
  copy_cover: true
  body: '<p><strong>겸손</strong>(겸비)은 교만과 반대되는 덕입니다.</p><ul><li><p>하느님의 피조물로서 자기에 대한 <strong>하느님의 뜻</strong>을 평온하게 받아들이는 것.</p></li><li><p>작은 일에서나 큰 일에서나 하느님께, 그분의 규례와 섭리에 순종하는 것.</p></li><li><p>자기를 낮게 여기고, 하느님을 신뢰하며 그분께 희망을 두는 것.</p></li></ul><h2>주님은 겸손한 이들의 하느님이십니다</h2><blockquote><p>“주님의 힘은 많은 수에 있지 않고 주님의 권능은 강한 자들에게 있지 않습니다. <strong>주님은 겸손한 이들의 하느님</strong>, 작은 이들의 도움이시며, 약한 이들의 보호자, 버림받은 이들의 피난처, 희망 없는 이들의 구원자이십니다” (<a href="https://bibleox.com/ko/gr-lxx-byz/iudf/9/#L11">유딧 9:11</a>, 그리스어에서 번역)</p></blockquote><h2>겸손의 계명</h2><p>주 예수 그리스도께서는 당신에게서 겸손을 배우라고 부르십니다:</p><blockquote><p>“수고하고 무거운 짐 진 자들아 <strong>다 내게로 오라</strong> 내가 너희를 쉬게 하리라 나는 <strong><mark>마음이 온유하고 겸손하니</mark></strong> <strong>나의 멍에를 메고</strong> <strong><mark>내게 배우라</mark></strong> 그리하면 너희 마음이 쉼을 얻으리니” (<a href="https://bibleox.com/ko/ko-nkrv/mf/11/#L28-29">마 11:28-29</a>)</p></blockquote><blockquote><p>“서로 마음을 같이하며 높은 데 마음을 두지 말고 <strong><mark>도리어 낮은 데 처하며</mark></strong> 스스로 지혜 있는 체 하지 말라” (<a href="https://bibleox.com/ko/ko-nkrv/rim/12/#L16">롬 12:16</a>)</p></blockquote><blockquote><p>“사람아 주께서 선한 것이 무엇임을 네게 보이셨나니 <strong>여호와께서 네게 구하시는 것은</strong> 오직 정의를 행하며 인자를 사랑하며 <strong><mark>겸손하게 네 하나님과 함께 행하는 것이 아니냐</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mih/6/#L8">미 6:8</a>)</p></blockquote><blockquote><p>“그러므로 너희는 마음에 할례를 행하고 <strong><mark>다시는 목을 곧게 하지 말라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/vtor/10/#L16">신 10:16</a>) <em>(*목이 곧은 백성이란 하느님 앞에 머리를 숙이지 않는 백성, 곧 자기를 낮추지 않는 백성입니다.)</em></p></blockquote><h2>하느님의 어머니께서는 겸손 때문에 하느님께 택함을 받으셨습니다</h2><blockquote><p>“<strong><mark>그의 여종의 비천함을 돌보셨음이라</mark></strong> 보라 이제 후로는 만세에 나를 복이 있다 일컬으리로다” (<a href="https://bibleox.com/ko/ko-nkrv/lk/1/#L48">눅 1:48</a>) <em>(그리스어: ἐπέβλεψεν ἐπὶ τὴν ταπείνωσιν, 당신 여종의 “<strong>겸손</strong>”(낮음)을 돌보셨다.)</em></p></blockquote><h2>하느님께서는 겸손한 이들에게 은혜를 주십니다</h2><blockquote><p>“젊은 자들아 이와 같이 장로들에게 순종하고 다 서로 겸손으로 허리를 동이라 <strong><mark>하나님은 교만한 자를 대적하시되 겸손한 자들에게는 은혜를 주시느니라</mark></strong> 그러므로 <strong><mark>하나님의 능하신 손 아래에서 겸손하라 때가 되면 너희를 높이시리라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1pet/5/#L5-6">벧전 5:5-6</a>)</p></blockquote><blockquote><p>“그러나 더욱 큰 은혜를 주시나니 그러므로 일렀으되 하나님이 <strong><mark>교만한 자를 물리치시고 겸손한 자에게 은혜를 주신다</mark></strong> 하였느니라” (<a href="https://bibleox.com/ko/ko-nkrv/iak/4/#L6">약 4:6</a>)</p></blockquote><blockquote><p>“<strong><mark>진실로 그는 거만한 자를 비웃으시며 겸손한 자에게 은혜를 베푸시나니</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/pr/3/#L34">잠 3:34</a>)</p></blockquote><blockquote><p>“<strong>네가 클수록 그만큼 너 자신을 낮추어라. 그러면 주님 앞에서 은총을 얻으리라.</strong> … 주님의 권능은 크시니 <strong>그분은 겸손한 이들에게서 영광을 받으신다</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/prsir/3/#L17-20">집회 3:17-20</a>, 그리스어에서 번역)</p></blockquote><blockquote><p>“교만이 오면 욕도 오거니와 <strong>겸손한 자에게는 지혜가 있느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/pr/11/#L2">잠 11:2</a>)</p></blockquote><h2>하느님께서는 겸손한 이들을 구원하십니다</h2><blockquote><p>“여호와는 마음이 상한 자를 가까이 하시고 <strong><mark>충심으로 통회하는 자를 구원하시는도다</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ps/34/#L18">시 34:18</a>; <a href="https://bibleox.com/ko/gr-lxx-byz/ps/33/#L18">시 33:18</a>) <em>(칠십인역(시 33:19): τοὺς ταπεινοὺς τῷ πνεύματι σώσει, “영이 <strong>겸손한</strong> 이들을 구원하시리라”.)</em></p></blockquote><blockquote><p>“여호와께서는 자기 백성을 기뻐하시며 <strong><mark>겸손한 자를 구원으로 아름답게 하심이로다</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ps/149/#L4">시 149:4</a>)</p></blockquote><blockquote><p>“<strong><mark>겸손과</mark></strong> 여호와를 경외함의 보상은 재물과 영광과 <strong><mark>생명이니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/pr/22/#L4">잠 22:4</a>)</p></blockquote><h2>하느님께서는 겸손한 이들을 높이십니다</h2><blockquote><p>“<strong><mark>여호와께서 겸손한 자들은 붙드시고</mark></strong> 악인들은 땅에 엎드러뜨리시는도다” (<a href="https://bibleox.com/ko/ko-nkrv/ps/147/#L6">시 147:6</a>)</p></blockquote><blockquote><p>“여호와께서는 자기 백성을 기뻐하시며 <strong><mark>겸손한 자를 구원으로 아름답게 하심이로다</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ps/149/#L4">시 149:4</a>)</p></blockquote><blockquote><p>“여호와를 경외하는 것은 지혜의 훈계라 <strong><mark>겸손은 존귀의 길잡이니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/pr/15/#L33">잠 15:33</a>)</p></blockquote><blockquote><p>“사람의 마음의 교만은 멸망의 선봉이요 <strong><mark>겸손은 존귀의 길잡이니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/pr/18/#L12">잠 18:12</a>)</p></blockquote><blockquote><p>“<strong><mark>겸손과</mark></strong> 여호와를 경외함의 보상은 재물과 <strong><mark>영광과</mark></strong> 생명이니라” (<a href="https://bibleox.com/ko/ko-nkrv/pr/22/#L4">잠 22:4</a>)</p></blockquote><blockquote><p>“사람이 교만하면 낮아지게 되겠고 <strong><mark>마음이 겸손하면 영예를 얻으리라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/pr/29/#L23">잠 29:23</a>)</p></blockquote><h2>하느님께서는 겸손한 이들의 기도를 들으십니다</h2><blockquote><p>“여호와여 <strong><mark>주는 겸손한 자의 소원을 들으셨사오니</mark></strong> 그들의 마음을 준비하시며 귀를 기울여 들으시고” (<a href="https://bibleox.com/ko/ko-nkrv/ps/10/#L17">시 10:17</a>)</p></blockquote><blockquote><p>“<strong>겸손한 이의 기도는 구름을 꿰뚫는다</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/prsir/35/#L17">집회 35:17</a>, 그리스어에서 번역)</p></blockquote><blockquote><p>“나 여호와가 말하노라 내 손이 이 모든 것을 지었으므로 그들이 생겼느니라 <strong><mark>무릇 마음이 가난하고 심령에 통회하며 내 말을 듣고 떠는 자 그 사람은 내가 돌보려니와</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/is/66/#L2">사 66:2</a>)</p></blockquote><blockquote><p>“<strong><mark>그들이 여호와 앞에 기도를 드리며</mark></strong> 각기 악한 길을 떠나리라 여호와께서 이 백성에 대하여 선포하신 노여움과 분이 크니라” (<a href="https://bibleox.com/ko/ko-nkrv/ier/36/#L7">렘 36:7</a>) <em>(히브리어 תְּחִנָּה는 은혜를 구하는 간청, 탄원입니다. 러시아어 시노달 번역은 “<strong>겸손한</strong> 간구”로 옮깁니다.)</em></p></blockquote><blockquote><p>“다만 <strong>상한 마음과 겸손한 영으로 우리를 받아 주소서</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/dan/3/#L39">단 3:39</a>, 그리스어에서 번역)</p></blockquote><blockquote><p>“하나님께서 구하시는 제사는 상한 심령이라 하나님이여 <strong><mark>상하고 통회하는 마음을 주께서 멸시하지 아니하시리이다</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ps/51/#L17">시 51:17</a>; <a href="https://bibleox.com/ko/gr-lxx-byz/ps/50/#L17">시 50:17</a>) <em>(칠십인역(시 50:19)에서 마음은 “상하고 <strong>낮아진</strong>” 마음입니다(συντετριμμένην καὶ τεταπεινωμένην).)</em></p></blockquote><h2>하느님께서는 겸손한 이들을 위로하십니다</h2><blockquote><p>“그러나 <strong><mark>낙심한 자들을 위로하시는 하나님이</mark></strong> 디도가 옴으로 우리를 위로하셨으니” (<a href="https://bibleox.com/ko/ko-nkrv/2kor/7/#L6">고후 7:6</a>) <em>(그리스어: ὁ παρακαλῶν τοὺς ταπεινούς, “<strong>겸손한</strong> 이들을 위로하시는”.)</em></p></blockquote><blockquote><p>“여호와께서는 높이 계셔도 <strong><mark>낮은 자를 굽어살피시며</mark></strong> 멀리서도 교만한 자를 아심이니이다” (<a href="https://bibleox.com/ko/ko-nkrv/ps/138/#L6">시 138:6</a>)</p></blockquote><h2>하느님께서는 겸손한 이들을 지키십니다</h2><blockquote><p>“여호와의 규례를 지키는 세상의 모든 <strong><mark>겸손한 자들아</mark></strong> 너희는 여호와를 찾으며 공의와 겸손을 구하라 너희가 혹시 <strong><mark>여호와의 분노의 날에 숨김을 얻으리라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/sof/2/#L3">습 2:3</a>)</p></blockquote><blockquote><p>“주님께서는 민족들의 뿌리를 뽑으시고 <strong>그 자리에 겸손한 이들을 심으셨다</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/prsir/10/#L15">집회 10:15</a>, 그리스어에서 번역) <em>(러시아어 성경에서는 10:18.)</em></p></blockquote><blockquote><p>“<strong><mark>내가 곤고하고 가난한 백성을 네 가운데에 남겨 두리니</mark></strong> 그들이 <strong>여호와의 이름을 의탁하여</strong> 보호를 받을지라” (<a href="https://bibleox.com/ko/ko-nkrv/sof/3/#L12">습 3:12</a>)</p></blockquote><h2>하느님께서는 겸손한 이들과 함께 계십니다</h2><blockquote><p>“지극히 존귀하며 영원히 거하시며 거룩하다 이름하는 이가 이와 같이 말씀하시되 <strong><mark>내가 높고 거룩한 곳에 있으며</mark></strong> <strong><mark>또한 통회하고 마음이 겸손한 자와 함께 있나니</mark></strong> 이는 겸손한 자의 영을 소생시키며 통회하는 자의 마음을 소생시키려 함이라” (<a href="https://bibleox.com/ko/ko-nkrv/is/57/#L15">사 57:15</a>)</p></blockquote><h2>겸손에 관한 비유</h2><h3>혼인 잔치에서 자리를 고르는 일</h3><blockquote><p>“청함을 받은 사람들이 높은 자리 택함을 보시고 그들에게 비유로 말씀하여 이르시되 네가 누구에게나 혼인 잔치에 청함을 받았을 때에 <strong><mark>높은 자리에 앉지 말라</mark></strong> 그렇지 않으면 너보다 더 높은 사람이 청함을 받은 경우에 너와 그를 청한 자가 와서 너더러 이 사람에게 자리를 내주라 하리니 그 때에 네가 부끄러워 끝자리로 가게 되리라 청함을 받았을 때에 <strong><mark>차라리 가서 끝자리에 앉으라</mark></strong> 그러면 너를 청한 자가 와서 너더러 벗이여 올라 앉으라 하리니 그 때에야 함께 앉은 모든 사람 앞에서 영광이 있으리라” (<a href="https://bibleox.com/ko/ko-nkrv/lk/14/#L7-10">눅 14:7-10</a>)</p></blockquote><h3>세리와 바리새인</h3><blockquote><p>“<strong><mark>세리는 멀리 서서 감히 눈을 들어 하늘을 쳐다보지도 못하고</mark></strong> 다만 가슴을 치며 이르되 하나님이여 불쌍히 여기소서 나는 <strong><mark>죄인이로소이다</mark></strong> 하였느니라 내가 너희에게 이르노니 이에 저 바리새인이 아니고 이 사람이 의롭다 하심을 받고 그의 집으로 내려갔느니라 <strong><mark>무릇 자기를 높이는 자는 낮아지고 자기를 낮추는 자는 높아지리라</mark></strong> 하시니라” (<a href="https://bibleox.com/ko/ko-nkrv/lk/18/#L13-14">눅 18:13-14</a>)</p></blockquote><blockquote><p>“두 사람이 기도하러 성전에 올라가니 하나는 바리새인이요 하나는 세리라 바리새인은 서서 따로 기도하여 이르되 하나님이여 나는 다른 사람들 곧 토색, 불의, 간음을 하는 자들과 같지 아니하고 이 세리와도 같지 아니함을 감사하나이다 나는 이레에 두 번씩 금식하고 또 소득의 십일조를 드리나이다 하고 <strong><mark>세리는 멀리 서서 감히 눈을 들어 하늘을 쳐다보지도 못하고</mark></strong> 다만 가슴을 치며 이르되 하나님이여 불쌍히 여기소서 나는 <strong><mark>죄인이로소이다</mark></strong> 하였느니라 내가 너희에게 이르노니 이에 저 바리새인이 아니고 이 사람이 의롭다 하심을 받고 그의 집으로 내려갔느니라 무릇 <strong>자기를 높이는 자는 낮아지고</strong> <strong><mark>자기를 낮추는 자는 높아지리라</mark></strong> 하시니라” (<a href="https://bibleox.com/ko/ko-nkrv/lk/18/#L10-14">눅 18:10-14</a>)</p></blockquote>'
