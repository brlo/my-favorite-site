- src: отвержение-Христа-отвержение-Бога
  path: Ry7p_그리스도를배척하는것은하느님을배척하는것
  title: 그리스도를 배척하는 것은 하느님을 배척하는 것입니다
  copy_cover: true
  body: <blockquote><p>“이렇게 꾸짖으시고 제자들에게 ‘너희의 말을 듣는 사람은 나의 말을 듣는 사람이고 너희를 배척하는 사람은 나를 배척하는 사람이며 <strong>나를 배척하는 사람은 곧 나를 보내신 분을 배척하는 사람이다</strong>.’하고 말씀하셨다.” (<a href="https://bibleox.com/ko/ko-ctb/lk/10/#L16">루가 10:16</a>)</p></blockquote><blockquote><p>“<strong>나를 미워하는 자는 나의 아버지까지도 미워한다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/in/15/#L23">요한 15:23</a>)</p></blockquote><blockquote><p>“<strong>누구든지 아들을 부인하는 사람은 아버지까지도 부인하며</strong> 그와 반대로 아들을 인정하는 사람은 아버지까지도 인정합니다.” (<a href="https://bibleox.com/ko/ko-ctb/1in/2/#L23">1요한 2:23</a>)</p></blockquote><blockquote><p>“<strong>그리스도의 교훈을 지키지 않고 지나치게 앞서 나가는 자는 누구든지 하느님을 모시지 않는 자입니다</strong>. 그리스도의 교훈을 지키는 사람은 하느님 아버지와 그 아들을 함께 모시는 사람입니다.” (<a href="https://bibleox.com/ko/ko-ctb/2in/1/#L9">2요한 1:9</a>)</p></blockquote><blockquote><p>“그러므로 아들을 믿는 사람은 영원한 생명을 얻을 것이며 <strong>아들을 믿지 않는 사람은 생명을 얻기는 커녕 오히려 하느님의 영원한 분노를 사게 될 것이다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/in/3/#L36">요한 3:36</a>)</p></blockquote>
  meta_desc: 그리스도를 배척하는 것이 곧 하느님을 배척하는 것임을 보여 주는 성경 구절
