  title: 예수 그리스도 — 구세주
  copy_cover: true
  body: '<p>이 글은 예수 그리스도께서 구세주이심을 보여 줄 뿐 아니라, 그분이 어떤 구세주이신지, 곧 모든 사람의 구세주이심을 보여 줍니다. 모든 사람이 그리스도께 부름을 받았지만 모두가 구원받는 것은 아닙니다.</p><h2>이교의 신들은 신이 아닙니다</h2><p>다른 하느님은 없습니다:</p><blockquote><p>“그러므로 우상의 제물을 먹는 일에 대하여는 우리가 우상은 세상에 아무 것도 아니며 또한 <strong>하나님은 한 분밖에 없는 줄 아노라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/8/#L4">고전 8:4</a>)</p></blockquote><p>이교도들이 전에 섬기던 것은 신이 아닙니다:</p><blockquote><p>“그러나 너희가 그 때에는 하나님을 알지 못하여 <strong>본질상 하나님이 아닌 자들</strong>에게 종 노릇 하였더니” (<a href="https://bibleox.com/ko/ko-nkrv/gal/4/#L8">갈 4:8</a>)</p></blockquote><p>거짓 신들입니다:</p><blockquote><p>“이르되 여러분이여 어찌하여 이러한 일을 하느냐 우리도 여러분과 같은 성정을 가진 사람이라 여러분에게 복음을 전하는 것은 <strong>이런 헛된 일을 버리고</strong> 천지와 바다와 그 가운데 만물을 지으시고 <strong>살아 계신 하나님께로 돌아오게 함이라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/act/14/#L15">행 14:15</a>)</p></blockquote><p>지난날 모든 민족은 하느님의 길이 아니라 자기 길을 걸었습니다:</p><blockquote><p>“하나님이 지나간 세대에는 <strong>모든 민족으로 자기들의 길들을 가게 방임하셨으나</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/act/14/#L16">행 14:16</a>)</p></blockquote><p>이와 같은 인용구가 더 많이 있습니다: <a href="https://bibleox.com/ru/ru/w/Бог-один">하느님은 한 분이십니다</a></p><h2>그리스도를 배척하는 것은 하느님을 배척하는 것입니다</h2><blockquote><p>“너희 말을 듣는 자는 곧 내 말을 듣는 것이요 너희를 저버리는 자는 곧 나를 저버리는 것이요 <strong>나를 저버리는 자는 나 보내신 이를 저버리는 것이라</strong> 하시니라” (<a href="https://bibleox.com/ko/ko-nkrv/lk/10/#L16">눅 10:16</a>)</p></blockquote><blockquote><p>“<strong>나를 미워하는 자는 또 내 아버지를 미워하느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/in/15/#L23">요 15:23</a>)</p></blockquote><blockquote><p>“<strong>아들을 부인하는 자에게는 또한 아버지가 없으되</strong> 아들을 시인하는 자에게는 아버지도 있느니라” (<a href="https://bibleox.com/ko/ko-nkrv/1in/2/#L23">요일 2:23</a>)</p></blockquote><blockquote><p>“지나쳐 <strong>그리스도의 교훈 안에 거하지 아니하는 자는 다 하나님을 모시지 못하되</strong> 교훈 안에 거하는 그 사람은 아버지와 아들을 모시느니라” (<a href="https://bibleox.com/ko/ko-nkrv/2in/1/#L9">요이 1:9</a>)</p></blockquote><blockquote><p>“아들을 믿는 자에게는 영생이 있고 <strong>아들에게 순종하지 아니하는 자는 영생을 보지 못하고 도리어 하나님의 진노가 그 위에 머물러 있느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/in/3/#L36">요 3:36</a>)</p></blockquote><h2>그리스도를 믿지 않고는 구원받을 수 없습니다</h2><blockquote><p>“너희와 모든 이스라엘 백성들은 알라 너희가 십자가에 못 박고 하나님이 죽은 자 가운데서 살리신 <strong>나사렛 예수 그리스도의 이름으로</strong> 이 사람이 건강하게 되어 너희 앞에 섰느니라 이 예수는 너희 건축자들의 버린 돌로서 집 모퉁이의 머릿돌이 되었느니라 <strong>다른 이로써는 구원을 받을 수 없나니</strong> <strong>천하 사람 중에 구원을 받을 만한 다른 이름을 우리에게 주신 일이 없음이라</strong> 하였더라” (<a href="https://bibleox.com/ko/ko-nkrv/act/4/#L10-12">행 4:10-12</a>)</p></blockquote><blockquote><p>“<strong>믿음이 없이는 하나님을 기쁘시게 하지 못하나니</strong> 하나님께 나아가는 자는 반드시 그가 계신 것과 또한 그가 자기를 찾는 자들에게 상 주시는 이심을 믿어야 할지니라” (<a href="https://bibleox.com/ko/ko-nkrv/evr/11/#L6">히 11:6</a>)</p></blockquote><h2>이단과 교회로부터의 분리는 구원을 잃게 합니다</h2><p>이단을 꾸며 내는 사람들은 하느님 나라를 차지하지 못합니다:</p><blockquote><p>“육체의 일은 분명하니 곧 음행과 더러운 것과 호색과 우상 숭배와 주술과 원수 맺는 것과 분쟁과 시기와 분냄과 당 짓는 것과 <strong>분열함과 이단과</strong> 투기와 술 취함과 방탕함과 또 그와 같은 것들이라 전에 너희에게 경계한 것 같이 경계하노니 이런 일을 하는 자들은 <strong>하나님의 나라를 유업으로 받지 못할 것이요</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gal/5/#L19-21">갈 5:19-21</a>)</p></blockquote><p>교회에 분열을 일으키는 사람들은 주 예수 그리스도를 섬기지 않습니다:</p><blockquote><p>“형제들아 내가 너희를 권하노니 너희가 배운 교훈을 거슬러 <strong>분쟁을 일으키거나 거치게 하는 자들을</strong> 살피고 그들에게서 떠나라 <strong>이같은 자들은 우리 주 그리스도를 섬기지 아니하고</strong> 다만 자기들의 배만 섬기나니 교활한 말과 아첨하는 말로 순진한 자들의 마음을 미혹하느니라” (<a href="https://bibleox.com/ko/ko-nkrv/rim/16/#L17-18">롬 16:17-18</a>)</p></blockquote><blockquote><p>“그들이 너희에게 말하기를 마지막 때에 자기의 경건하지 않은 정욕대로 행하며 조롱하는 자들이 있으리라 하였나니 이 사람들은 <strong>분열을 일으키는 자며</strong> 육에 속한 자며 성령이 없는 자니라” (<a href="https://bibleox.com/ko/ko-nkrv/iud/1/#L18-19">유 1:18-19</a>)</p></blockquote><p>교회는 그리스도의 몸이고 그리스도께서는 그 몸의 구세주이십니다:</p><blockquote><p>“하나님을 찬미하며 또 온 백성에게 칭송을 받으니 <strong>주께서 구원 받는 사람을 날마다 더하게 하시니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/act/2/#L47">행 2:47</a>)</p></blockquote><blockquote><p>“나는 이제 너희를 위하여 받는 괴로움을 기뻐하고 그리스도의 남은 고난을 <strong>그의 몸된 교회</strong>를 위하여 내 육체에 채우노라” (<a href="https://bibleox.com/ko/ko-nkrv/kol/1/#L24">골 1:24</a>)</p></blockquote><blockquote><p>“이는 남편이 아내의 머리 됨이 그리스도께서 교회의 머리 됨과 같음이니 그가 바로 <strong>몸의 구주시니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ef/5/#L23">엡 5:23</a>)</p></blockquote><h2>모든 사람이 심판을 받습니다</h2><blockquote><p>“이는 <strong>우리가 다 반드시 그리스도의 심판대 앞에 나타나게 되어</strong> 각각 <strong>선악간에</strong> <strong>그 몸으로 행한 것을 따라 받으려 함이라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2kor/5/#L10">고후 5:10</a>)</p></blockquote><blockquote><p>“<strong>하나님은 모든 행위와 모든 은밀한 일을</strong> <strong>선악 간에 심판하시리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ekl/12/#L14">전 12:14</a>)</p></blockquote><h3>심판은 교회에서 시작됩니다</h3><blockquote><p>“<strong>하나님의 집에서 심판을 시작할 때가 되었나니</strong> <strong>만일 우리에게 먼저 하면</strong> 하나님의 복음을 순종하지 아니하는 자들의 그 마지막은 어떠하며 또 <strong>의인이 겨우 구원을 받으면</strong> 경건하지 아니한 자와 죄인은 어디에 서리요” (<a href="https://bibleox.com/ko/ko-nkrv/1pet/4/#L17-18">벧전 4:17-18</a>)</p></blockquote><h3>우리는 모두 많은 죄를 짓습니다</h3><blockquote><p>“<strong>우리가 다 실수가 많으니</strong> 만일 말에 실수가 없는 자라면 곧 온전한 사람이라 능히 온 몸도 굴레 씌우리라” (<a href="https://bibleox.com/ko/ko-nkrv/iak/3/#L2">약 3:2</a>)</p></blockquote><blockquote><p>“<strong>만일 우리가 죄가 없다고 말하면 스스로 속이고</strong> 또 진리가 우리 속에 있지 아니할 것이요 &lt;…&gt; 만일 우리가 범죄하지 아니하였다 하면 하나님을 거짓말하는 이로 만드는 것이니 또한 그의 말씀이 우리 속에 있지 아니하니라” (<a href="https://bibleox.com/ko/ko-nkrv/1in/1/#L8,10">요일 1:8,10</a>)</p></blockquote><h3>많은 이들이 구원받지 못함을 알고 놀랄 것입니다</h3><p>그들은 자기가 구원받은 줄로 생각했습니다:</p><blockquote><p>“그 날에 많은 사람이 나더러 이르되 주여 주여 우리가 주의 이름으로 <strong>선지자 노릇 하며</strong> 주의 이름으로 <strong>귀신을 쫓아 내며</strong> 주의 이름으로 <strong>많은 권능을 행하지</strong> 아니하였나이까 하리니 그 때에 내가 그들에게 밝히 말하되 <strong>내가 너희를 도무지 알지 못하니 불법을 행하는 자들아 내게서 떠나가라</strong> 하리라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/7/#L22-23">마 7:22-23</a>)</p></blockquote><h2>많은 이들이 구원받지 못할 것입니다</h2><h3>모두가 구원받는 것은 아닙니다</h3><blockquote><p>“좁은 문으로 들어가기를 힘쓰라 내가 너희에게 이르노니 <strong>들어가기를 구하여도</strong> <strong>못하는 자가 많으리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/lk/13/#L24">눅 13:24</a>)</p></blockquote><blockquote><p>“좁은 문으로 들어가라 <strong>멸망으로 인도하는 문은 크고 그 길이 넓어 그리로 들어가는 자가 많고</strong> <strong>생명으로 인도하는 문은 좁고 길이 협착하여 찾는 자가 적음이라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/7/#L13-14">마 7:13-14</a>)</p></blockquote><blockquote><p>“<strong>나더러 주여 주여 하는 자마다 다 천국에 들어갈 것이 아니요</strong> 다만 하늘에 계신 내 아버지의 뜻대로 행하는 자라야 들어가리라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/7/#L21">마 7:21</a>)</p></blockquote><blockquote><p>“<strong>모두가 구원받는 것은 아니다</strong>” (<a href="https://bibleox.com/ko/en-nrsv/3ezd/8/#L41">3에스 8:41</a>, 영어 번역(NRSV)에서 옮김)</p></blockquote><h3>구원받는 이는 적습니다</h3><blockquote><p>“어떤 사람이 여짜오되 주여 <strong>구원을 받는 자가 적으니이까</strong> 그들에게 이르시되 좁은 문으로 들어가기를 힘쓰라 내가 너희에게 이르노니 <strong>들어가기를 구하여도 못하는 자가 많으리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/lk/13/#L23-24">눅 13:23-24</a>)</p></blockquote><blockquote><p>“좁은 문으로 들어가라 <strong>멸망으로 인도하는 문은 크고 그 길이 넓어 그리로 들어가는 자가 많고</strong> <strong>생명으로 인도하는 문은 좁고 길이 협착하여 찾는 자가 적음이라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/7/#L13-14">마 7:13-14</a>)</p></blockquote><blockquote><p>“그 날에 많은 사람이 나더러 이르되 주여 주여 우리가 주의 이름으로 선지자 노릇 하며 주의 이름으로 귀신을 쫓아 내며 주의 이름으로 많은 권능을 행하지 아니하였나이까 하리니 그 때에 내가 그들에게 밝히 말하되 내가 너희를 도무지 알지 못하니 <strong>불법을 행하는 자들아 내게서 떠나가라</strong> 하리라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/7/#L22-23">마 7:22-23</a>)</p></blockquote><blockquote><p>“<strong>적은 무리여</strong> 무서워 말라 너희 아버지께서 그 나라를 너희에게 주시기를 기뻐하시느니라” (<a href="https://bibleox.com/ko/ko-nkrv/lk/12/#L32">눅 12:32</a>)</p></blockquote><blockquote><p>“불의를 행하는 자는 그대로 불의를 행하고 더러운 자는 그대로 더럽고 의로운 자는 그대로 의를 행하고 <strong>거룩한 자는 그대로 거룩하게 하라</strong> 보라 내가 속히 오리니 내가 줄 상이 내게 있어 <strong>각 사람에게 그가 행한 대로 갚아 주리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/22/#L11-12">계 22:11-12</a>)</p></blockquote>'
