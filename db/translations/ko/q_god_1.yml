  title: 그리스도 — 구속자
  copy_cover: true
  body: <p>아담의 죄로 온 인류가 단죄를 받았습니다:</p><blockquote><p>“그런즉 <strong>한 범죄로 많은 사람이 정죄에 이른 것 같이</strong> 한 의로운 행위로 말미암아 많은 사람이 의롭다 하심을 받아 생명에 이르렀느니라” (<a href="https://bibleox.com/ko/ko-nkrv/rim/5/#L18">롬 5:18</a>)</p></blockquote><p>그리스도께서는 인류의 저주를 당신께 지셨습니다:</p><blockquote><p>“그리스도께서 <strong>우리를 위하여 저주를 받은 바 되사</strong> 율법의 저주에서 우리를 속량하셨으니 기록된 바 나무에 달린 자마다 저주 아래에 있는 자라 하였음이라” (<a href="https://bibleox.com/ko/ko-nkrv/gal/3/#L13">갈 3:13</a>)</p></blockquote><p>그리스도께서는 당신의 피로 사람을 구속하셨습니다:</p><blockquote><p>“<strong>너희가</strong> 알거니와 너희 <strong>조상이 물려 준 헛된 행실에서 대속함을 받은 것은</strong> 은이나 금 같이 없어질 것으로 된 것이 아니요 오직 흠 없고 점 없는 어린 양 같은 <strong>그리스도의 보배로운 피로</strong> 된 것이니라” (<a href="https://bibleox.com/ko/ko-nkrv/1pet/1/#L18-19">벧전 1:18-19</a>)</p></blockquote><blockquote><p>“그들이 새 노래를 불러 이르되 두루마리를 가지시고 그 인봉을 떼기에 합당하시도다 일찍이 죽임을 당하사 각 족속과 방언과 백성과 나라 가운데에서 <strong>사람들을 피로 사서</strong> <strong>하나님께 드리시고</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/5/#L9">계 5:9</a>)</p></blockquote>
  meta_desc: "“당신은 죽임을 당하셨고 당신의 피로 값을 치러 모든 민족과 언어와 백성과 나라로부터 사람들을 구해 내셔서 하느님께 바치셨습니다” (묵시 5:9)"
