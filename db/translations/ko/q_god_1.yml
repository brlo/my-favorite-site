- src: Христос-безгрешен
  path: Ze4b_그리스도는죄가없으시다
  title: 그리스도는 죄가 없으십니다
  copy_cover: true
  body: <blockquote><p>“우리를 위해서 하느님께서는 <strong>죄를 모르시는 그리스도</strong>를 죄있는 분으로 여기셨습니다. 그래서 우리는 그리스도로 말미암아 하느님께로부터 무죄선언을 받게 되었습니다.” (<a href="https://bibleox.com/ko/ko-ctb/2kor/5/#L21">2고린 5:21</a>)</p></blockquote><blockquote><p>“우리의 사제는 연약한 우리의 사정을 몰라 주시는 분이 아니라 우리와 마찬가지로 모든 일에 유혹을 받으신 분입니다. 그러나 <strong>죄는 짓지 않으셨습니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/evr/4/#L15">히브 4:15</a>)</p></blockquote><blockquote><p>“우리에게는 이렇게 <strong>거룩하고 순결하고 흠도 죄도 없고</strong> 하늘보다 더 높으신 대사제가 필요합니다.” (<a href="https://bibleox.com/ko/ko-ctb/evr/7/#L26">히브 7:26</a>)</p></blockquote><blockquote><p>“하물며 성령을 통하여 당신 자신을 하느님께 <strong>흠없는 제물로</strong> 바치신 그리스도의 피는 우리의 양심을 깨끗하게 하는 데나 죽음의 행실을 버리게 하고 살아 계신 하느님을 섬기게 하는 데 얼마나 큰 힘이 되겠습니까?” (<a href="https://bibleox.com/ko/ko-ctb/evr/9/#L14">히브 9:14</a>)</p></blockquote><blockquote><p>“여러분도 아시다시피 그리스도께서는 죄를 없애시려고 이 세상에 나타나셨던 것입니다. <strong>그리스도는 죄가 없는 분이십니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/1in/3/#L5">1요한 3:5</a>)</p></blockquote><blockquote><p>“너희와 이야기를 나눌 시간도 얼마 남지 않았다. <strong>이 세상의 권력자가</strong> 가까이 오고 있다. <strong>그가 나를 어떻게 할 수는 없지만</strong>” (<a href="https://bibleox.com/ko/ko-ctb/in/14/#L30">요한 14:30</a>)</p></blockquote><blockquote><p>“<strong>너희 가운데 누가 나에게 죄가 있다고 증명할 수 있느냐</strong>? 내가 진리를 말하는데도 왜 나를 믿지 않느냐?” (<a href="https://bibleox.com/ko/ko-ctb/in/8/#L46">요한 8:46</a>)</p></blockquote><blockquote><p>“<strong>폭행을 저지른 일도 없었고 입에 거짓을 담은 적도 없었지만</strong> 그는 죄인들과 함께 처형당하고, 불의한 자들과 함께 묻혔다.” (<a href="https://bibleox.com/ko/ko-ctb/is/53/#L9">이사 53:9</a>)</p></blockquote>
  meta_desc: 그리스도께서 죄가 없으심에 관한 성경 구절
