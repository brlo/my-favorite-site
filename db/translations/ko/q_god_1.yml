  body: <h2>하느님의 아들은 세상 창조 이전에 희생제물로 정해졌습니다</h2><blockquote><p>“오직 흠 없고 점 없는 어린 양 같은 그리스도의 보배로운 피로 된 것이니라 그는 <strong>창세 전부터 미리 알린 바 되신 이나</strong> 이 말세에 너희를 위하여 나타내신 바 되었으니” (<a href="https://bibleox.com/ko/ko-nkrv/1pet/1/#L19-20">벧전 1:19-20</a>)</p></blockquote><h2>아브라함의 복</h2><blockquote><p>“그리스도께서 우리를 위하여 저주를 받은 바 되사 율법의 저주에서 우리를 속량하셨으니 기록된 바 나무에 달린 자마다 저주 아래에 있는 자라 하였음이라 이는 <strong>그리스도 예수 안에서 아브라함의 복이 이방인에게 미치게 하고</strong> 또 우리로 하여금 믿음으로 말미암아 성령의 약속을 받게 하려 함이라” (<a href="https://bibleox.com/ko/ko-nkrv/gal/3/#L13-14">갈 3:13-14</a>)</p></blockquote><h2>구속</h2><blockquote><p>“<strong>너희가</strong> 알거니와 너희 조상이 물려 준 <strong>헛된 행실에서 대속함을 받은 것은</strong> 은이나 금 같이 없어질 것으로 된 것이 아니요 오직 <strong>흠 없고 점 없는 어린 양 같은 그리스도의 보배로운 피로</strong> 된 것이니라” (<a href="https://bibleox.com/ko/ko-nkrv/1pet/1/#L18-19">벧전 1:18-19</a>)</p></blockquote><blockquote><p>“그리스도께서 우리를 위하여 저주를 받은 바 되사 <strong>율법의 저주에서 우리를 속량하셨으니</strong> 기록된 바 나무에 달린 자마다 저주 아래에 있는 자라 하였음이라” (<a href="https://bibleox.com/ko/ko-nkrv/gal/3/#L13">갈 3:13</a>)</p></blockquote><blockquote><p>“이와 같이 <strong>그리스도도 많은 사람의 죄를 담당하시려고 단번에 드리신 바 되셨고</strong> 구원에 이르게 하기 위하여 죄와 상관 없이 자기를 바라는 자들에게 두 번째 나타나시리라” (<a href="https://bibleox.com/ko/ko-nkrv/evr/9/#L28">히 9:28</a>)</p></blockquote><h2>화해</h2><blockquote><p>“<strong>그는 우리의 화평이신지라</strong> <strong>둘로 하나를 만드사</strong> 원수 된 것 곧 중간에 막힌 담을 자기 육체로 허시고 법조문으로 된 계명의 율법을 폐하셨으니 이는 이 둘로 자기 안에서 한 새 사람을 지어 화평하게 하시고 또 <strong>십자가로 이 둘을 한 몸으로 하나님과 화목하게 하려 하심이라 원수 된 것을 십자가로 소멸하시고</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ef/2/#L14-16">엡 2:14-16</a>)</p></blockquote><blockquote><p>“곧 우리가 원수 되었을 때에 <strong>그의 아들의 죽으심으로 말미암아 하나님과 화목하게 되었은즉</strong> 화목하게 된 자로서는 더욱 그의 살아나심으로 말미암아 구원을 받을 것이니라” (<a href="https://bibleox.com/ko/ko-nkrv/rim/5/#L10">롬 5:10</a>)</p></blockquote><blockquote><p>“모든 것이 하나님께로서 났으며 그가 <strong>그리스도로 말미암아 우리를 자기와 화목하게 하시고</strong> 또 우리에게 화목하게 하는 직분을 주셨으니” (<a href="https://bibleox.com/ko/ko-nkrv/2kor/5/#L18">고후 5:18</a>)</p></blockquote><blockquote><p>“곧 <strong>하나님께서 그리스도 안에 계시사 세상을 자기와 화목하게 하시며</strong> 그들의 죄를 그들에게 돌리지 아니하시고 화목하게 하는 말씀을 우리에게 부탁하셨느니라” (<a href="https://bibleox.com/ko/ko-nkrv/2kor/5/#L19">고후 5:19</a>)</p></blockquote><blockquote><p>“그의 십자가의 피로 화평을 이루사 <strong>만물 곧 땅에 있는 것들이나 하늘에 있는 것들이 그로 말미암아 자기와 화목하게 되기를</strong> 기뻐하심이라” (<a href="https://bibleox.com/ko/ko-nkrv/kol/1/#L20">골 1:20</a>)</p></blockquote><blockquote><p>“이제는 <strong>그의 육체의 죽음으로 말미암아 화목하게 하사 너희를 거룩하고 흠 없고 책망할 것이 없는 자로</strong> 그 앞에 세우고자 하셨으니” (<a href="https://bibleox.com/ko/ko-nkrv/kol/1/#L22">골 1:22</a>)</p></blockquote><h2>하느님과의 결합</h2><blockquote><p>“<strong>그리스도께서도 단번에 죄를 위하여 죽으사</strong> 의인으로서 불의한 자를 대신하셨으니 이는 <strong>우리를 하나님 앞으로 인도하려 하심이라</strong> 육체로는 죽임을 당하시고 영으로는 살리심을 받으셨으니” (<a href="https://bibleox.com/ko/ko-nkrv/1pet/3/#L18">벧전 3:18</a>)</p></blockquote><h2>성체성혈성사 (그리스도의 몸과 피를 모심)</h2><blockquote><p>“우리에게 제단이 있는데 장막에서 섬기는 자들은 그 제단에서 먹을 권한이 없나니 이는 죄를 위한 짐승의 피는 대제사장이 가지고 성소에 들어가고 그 육체는 영문 밖에서 불사름이라 그러므로 <strong>예수도 자기 피로써 백성을 거룩하게 하려고 성문 밖에서 고난을 받으셨느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/evr/13/#L10-12">히 13:10-12</a>)</p></blockquote><blockquote><p>“그들이 먹을 때에 예수께서 떡을 가지사 축복하시고 떼어 제자들에게 주시며 이르시되 받아서 먹으라 이것은 내 몸이니라 하시고 또 잔을 가지사 감사 기도 하시고 그들에게 주시며 이르시되 <strong>너희가 다 이것을 마시라 이것은 죄 사함을 얻게 하려고 많은 사람을 위하여 흘리는 바 나의 피 곧 언약의 피니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/26/#L26-28">마 26:26-28</a>) <em>(비잔틴 본문(다수 사본)에는 “<strong>새로운</strong> 계약의 피”라고 되어 있습니다.)</em></p></blockquote><blockquote><p>“축사하시고 떼어 이르시되 <strong>이것은 너희를 위하는 내 몸이니</strong> 이것을 행하여 나를 기념하라 하시고 식후에 또한 그와 같이 잔을 가지시고 이르시되 이 잔은 내 피로 세운 새 언약이니 이것을 행하여 마실 때마다 나를 기념하라 하셨으니” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/11/#L24-25">고전 11:24-25</a>)</p></blockquote><h2>새로운 계약</h2><blockquote><p>“축사하시고 떼어 이르시되 이것은 너희를 위하는 내 몸이니 이것을 행하여 나를 기념하라 하시고 식후에 또한 그와 같이 잔을 가지시고 이르시되 <strong>이 잔은 내 피로 세운 새 언약이니</strong> 이것을 행하여 마실 때마다 나를 기념하라 하셨으니” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/11/#L24-25">고전 11:24-25</a>)</p></blockquote><h2>나라</h2><blockquote><p>“이를 위하여 <strong>그리스도께서 죽었다가 다시 살아나셨으니 곧 죽은 자와 산 자의 주가 되려 하심이라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/rim/14/#L9">롬 14:9</a>)</p></blockquote><p>성부의 뜻과 예언과 약속의 성취</p><blockquote><p>“내가 말하노니 그리스도께서 <strong>하나님의 진실하심을 위하여</strong> 할례의 추종자가 되셨으니 이는 <strong>조상들에게 주신 약속들을 견고하게 하시고</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/rim/15/#L8">롬 15:8</a>)</p></blockquote><h2>본보기</h2><blockquote><p>“이를 위하여 너희가 부르심을 받았으니 <strong>그리스도도 너희를 위하여 고난을 받으사 너희에게 본을 끼쳐 그 자취를 따라오게 하려 하셨느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1pet/2/#L21">벧전 2:21</a>)</p></blockquote><blockquote><p>“<strong>그가 모든 사람을 대신하여 죽으심은 살아 있는 자들로 하여금 다시는 그들 자신을 위하여 살지 않고 오직 그들을 대신하여 죽었다가 다시 살아나신 이를 위하여 살게 하려 함이라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2kor/5/#L15">고후 5:15</a>)</p></blockquote><h2>무슬림의 질문</h2><h3>자비로우신 하느님께서 그냥 용서하실 수 있는데 왜 희생이 필요합니까?</h3><p>그리스도인들이 믿는 하느님은 사랑이라 불리십니다:</p><blockquote><p>“사랑하지 아니하는 자는 하나님을 알지 못하나니 이는 <strong>하나님은 사랑이심이라</strong> &lt;…&gt; 하나님이 우리를 사랑하시는 사랑을 우리가 알고 믿었노니 <strong>하나님은 사랑이시라</strong> 사랑 안에 거하는 자는 하나님 안에 거하고 하나님도 그의 안에 거하시느니라” (<a href="https://bibleox.com/ko/ko-nkrv/1in/4/#L8,16">요일 4:8,16</a>)</p></blockquote><p>하느님께서는 바로 피조물의 구원을 위해 당신을 희생으로 내어 주심으로써 그들을 향한 사랑을 보이십니다. 하느님께서 친히 이렇게 말씀하셨기 때문입니다:</p><blockquote><p>“<strong><mark>사람이 친구를 위하여 자기 목숨을 버리면 이보다 더 큰 사랑이 없나니</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/in/15/#L13">요 15:13</a>)</p></blockquote><p>이처럼 그분은 희생적 사랑으로 구원하시려는 이들을 당신께 이끄십니다:</p><blockquote><p>“<strong>내가 땅에서 들리면 모든 사람을 내게로 이끌겠노라</strong> 하시니 이렇게 말씀하심은 <strong>자기가 어떠한 죽음으로 죽을 것을 보이심이러라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/in/12/#L32-33">요 12:32-33</a>)</p></blockquote><p>그러나 지극히 지혜로우신 하느님께서는 구원을 지혜롭게 마련하십니다. 사랑 외에 하느님의 정의를 충족시키는 일도 말할 수 있습니다. 하느님께서는 자비로우실 뿐 아니라 의로우시기 때문입니다. 그분은 지혜와 자비와 정의와 사랑을 한꺼번에 하나로 이루실 줄 아십니다.</p>
