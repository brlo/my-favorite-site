- src: Христос-безгрешен
  path: Ze4b_그리스도는죄가없으시다
  title: 그리스도는 죄가 없으십니다
  copy_cover: true
  body: <blockquote><p>“하나님이 <strong>죄를 알지도 못하신 이를</strong> 우리를 대신하여 죄로 삼으신 것은 우리로 하여금 그 안에서 하나님의 의가 되게 하려 하심이라” (<a href="https://bibleox.com/ko/ko-nkrv/2kor/5/#L21">고후 5:21</a>)</p></blockquote><blockquote><p>“우리에게 있는 대제사장은 우리의 연약함을 동정하지 못하실 이가 아니요 모든 일에 우리와 똑같이 시험을 받으신 이로되 <strong>죄는 없으시니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/evr/4/#L15">히 4:15</a>)</p></blockquote><blockquote><p>“이러한 대제사장은 우리에게 합당하니 <strong>거룩하고 악이 없고 더러움이 없고 죄인에게서 떠나 계시고</strong> 하늘보다 높이 되신 이라” (<a href="https://bibleox.com/ko/ko-nkrv/evr/7/#L26">히 7:26</a>)</p></blockquote><blockquote><p>“하물며 영원하신 성령으로 말미암아 <strong>흠 없는 자기를 하나님께 드린</strong> 그리스도의 피가 어찌 너희 양심을 죽은 행실에서 깨끗하게 하고 살아 계신 하나님을 섬기게 하지 못하겠느냐” (<a href="https://bibleox.com/ko/ko-nkrv/evr/9/#L14">히 9:14</a>)</p></blockquote><blockquote><p>“그가 우리 죄를 없애려고 나타나신 것을 너희가 아나니 <strong>그에게는 죄가 없느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1in/3/#L5">요일 3:5</a>)</p></blockquote><blockquote><p>“이후에는 내가 너희와 말을 많이 하지 아니하리니 <strong>이 세상의 임금이</strong> 오겠음이라 그러나 <strong>그는 내게 관계할 것이 없으니</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/in/14/#L30">요 14:30</a>)</p></blockquote><blockquote><p>“<strong>너희 중에 누가 나를 죄로 책잡겠느냐</strong> 내가 진리를 말하는데도 어찌하여 나를 믿지 아니하느냐” (<a href="https://bibleox.com/ko/ko-nkrv/in/8/#L46">요 8:46</a>)</p></blockquote><blockquote><p>“<strong>그는 강포를 행하지 아니하였고 그의 입에 거짓이 없었으나</strong> 그의 무덤이 악인들과 함께 있었으며 그가 죽은 후에 부자와 함께 있었도다” (<a href="https://bibleox.com/ko/ko-nkrv/is/53/#L9">사 53:9</a>)</p></blockquote>
