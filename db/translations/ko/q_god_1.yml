- src: Христос-жертва
  path: Ns8q_희생제물그리스도
  title: 그리스도 — 희생제물
  copy_cover: true
  body: <h2>하느님의 아들은 세상 창조 이전에 희생제물로 정해졌습니다</h2><blockquote><p>“흠도 티도 없는 어린 양의 피 같은 그리스도의 귀한 피로 얻은 것입니다. 하느님께서는 <strong>천지를 창조하시기 전에 그리스도를 구세주로 미리 정하셨고</strong> 이 마지막 때에 여러분을 위해서 그분을 세상에 나타나게 하셨습니다.” (<a href="https://bibleox.com/ko/ko-ctb/1pet/1/#L19-20">1베드 1:19-20</a>)</p></blockquote><h2>아브라함의 복</h2><blockquote><p>“나무에 달린 자는 누구나 저주받을 자다‘라고 성서에 기록되어 있듯이 그리스도께서는 우리를 위하여 십자가에 달려 저주받은 자가 되셔서 우리를 율법의 저주에서 구원해 내셨습니다. 그리하여 <strong>하느님께서 아브라함에게 약속하신 복이 그리스도 예수를 믿는 이방인들에게까지 마치게 되었고</strong> 또 우리는 믿음으로 약속된 성령을 받게 되었습니다.” (<a href="https://bibleox.com/ko/ko-ctb/gal/3/#L13-14">갈라 3:13-14</a>)</p></blockquote><h2>구속</h2><blockquote><p>“<strong>여러분은</strong> 조상들에게서 물려 받은 헛된 생활에서 <strong>해방되었습니다</strong>. 그러나 아시다시피 그것은 은이나 금 따위의 없어질 물건으로 값을 치르고 된 일이 아니라 <strong>흠도 티도 없는 어린 양의 피 같은 그리스도의 귀한 피로</strong> 얻은 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/1pet/1/#L18-19">1베드 1:18-19</a>)</p></blockquote><blockquote><p>“나무에 달린 자는 누구나 저주받을 자다‘라고 성서에 기록되어 있듯이 그리스도께서는 우리를 위하여 십자가에 달려 저주받은 자가 되셔서 <strong>우리를 율법의 저주에서 구원해 내셨습니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/gal/3/#L13">갈라 3:13</a>)</p></blockquote><blockquote><p>“<strong>그리스도께서도 단 한 번 당신 자신을 제물로 바치셨습니다. 그러나 많은 사람의 죄를 없애 주셨고</strong> 다시 나타나실 때에는 인간의 죄 때문에 다시 희생제물이 되시는 일이 없이 당신을 갈망하고 있는 사람들에게 구원을 가져다 주실 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/evr/9/#L28">히브 9:28</a>)</p></blockquote><h2>화해</h2><blockquote><p>“<strong>그리스도야말로 우리의 평화이십니다</strong>. 그분은 자신의 몸을 바쳐서 유다인과 이방인이 서로 원수가 되어 갈리게 했던 담을 헐어 버리시고 <strong>그들을 화해시켜 하나로 만드시고</strong> 율법 조문과 규정을 모두 폐지하셨습니다. 그리스도께서는 자신을 희생하여 유다인과 이방인을 하나의 새 민족으로 만들어 평화를 이룩하시어 또 <strong>십자가에서 죽으심으로써 둘을 한 몸으로 만드셔서 하느님과 화해시키시고 원수되었던 모든 요소를 없이하셨습니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/ef/2/#L14-16">에페 2:14-16</a>)</p></blockquote><blockquote><p>“우리가 하느님의 원수였던 때에도 <strong>그 아들의 죽음으로 하느님과 화해하게 되었다면</strong> 하물며 그분과 화해가 이루어진 지금에 와서 우리가 살아 계신 그리스도를 통해서 구원받으리라는 것은 더욱 확실한 일이 아니겠습니까?” (<a href="https://bibleox.com/ko/ko-ctb/rim/5/#L10">로마 5:10</a>)</p></blockquote><blockquote><p>“이것은 모두 다 하느님께로부터 왔습니다. 하느님께서는 <strong>그리스도를 내세워 우리를 당신과 화해하게 해 주셨고</strong> 또 사람들을 당신과 화해시키는 임무를 우리에게 주셨습니다.” (<a href="https://bibleox.com/ko/ko-ctb/2kor/5/#L18">2고린 5:18</a>)</p></blockquote><blockquote><p>“곧 하느님께서는 인간의 죄를 묻지 않으시고 <strong>그리스도를 내세워 인간과 화해하셨습니다</strong>. 그리고 이 화해의 이치를 우리에게 맡겨 전하게 하셨습니다.” (<a href="https://bibleox.com/ko/ko-ctb/2kor/5/#L19">2고린 5:19</a>)</p></blockquote><blockquote><p>“<strong>그리스도를 내세워 하늘과 땅의 만물을 당신과 화해시켜 주셨습니다</strong>. 곧 십자가에서 흘리신 예수의 피로써 평화를 이룩하셨습니다.” (<a href="https://bibleox.com/ko/ko-ctb/kol/1/#L20">골로 1:20</a>)</p></blockquote><blockquote><p>“그러나 이제는 하느님께서 <strong>당신의 아들의 몸을 희생시키시어 여러분과 화해하시고 여러분을 거룩하고 흠없고 탓할 데 없는 사람으로서</strong> 당신 앞에 서게 하여 주셨습니다.” (<a href="https://bibleox.com/ko/ko-ctb/kol/1/#L22">골로 1:22</a>)</p></blockquote><h2>하느님과의 결합</h2><blockquote><p>“<strong>그리스도께서도 여러분의 죄 때문에 죽으셨습니다</strong>. 죄 없으신 분이 죄인을 위해서 죽으신 것입니다. 그리스도께서는 단 한 번 죽으심으로써 여러분의 죄를 용서해 주시고 <strong>하느님께로 인도해 주셨습니다</strong>. 그리스도께서는 몸으로는 죽으셨지만 영적으로는 다시 사셨습니다.” (<a href="https://bibleox.com/ko/ko-ctb/1pet/3/#L18">1베드 3:18</a>)</p></blockquote><h2>성체성혈성사 (그리스도의 몸과 피를 모심)</h2><blockquote><p>“유다교의 천막 성소에서 제사를 드리는 사제들은 우리 제단의 제물을 먹을 권리가 없습니다. 유다인의 대사제는 짐승의 피를 지성소에 가지고 들어 가서 속죄의 제물로 바칩니다. 그러나 짐승의 몸은 영문 밖에서 불살라 버립니다. 이와 같이 <strong>예수께서도 당신의 피로 백성을 거룩하게 만드시려고 성문 밖에서 고난을 당하셨습니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/evr/13/#L10-12">히브 13:10-12</a>)</p></blockquote><blockquote><p>“그들이 음식을 먹을 때에 예수께서 빵을 들어 축복하시고 제자들에게 나누어 주시며 ‘받아 먹어라. 이것은 내 몸이다’ 하시고 또 잔을 들어 감사의 기도를 올리시고 그들에게 돌리시며 ‘<strong>너희는 모두 이 잔을 받아 마셔라. 이것은 나의 피다. 죄를 용서해 주려고 많은 사람을 위하여 내가 흘리는 계약의 피다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/mf/26/#L26-28">마태 26:26-28</a>) <em>(비잔틴 본문(다수 사본)에는 “<strong>새로운</strong> 계약의 피”라고 되어 있습니다.)</em></p></blockquote><blockquote><p>“감사의 기도를 드리신 다음 빵을 떼시고 ‘<strong>이것은 너희들을 위하여 주는 내 몸이니</strong> 나를 기억하여 이 예를 행하여라’하고 말씀하셨습니다. 또 식후에 잔을 드시고 감사의 기도를 드리신 다음 ‘이것은 내 피로 맺는 새로운 계약의 잔이니 마실 때마다 나를 기억하여 이 예를 행하여라’하고 말씀하셨습니다.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/11/#L24-25">1고린 11:24-25</a>)</p></blockquote><h2>새로운 계약</h2><blockquote><p>“감사의 기도를 드리신 다음 빵을 떼시고 ‘이것은 너희들을 위하여 주는 내 몸이니 나를 기억하여 이 예를 행하여라’하고 말씀하셨습니다. 또 식후에 잔을 드시고 감사의 기도를 드리신 다음 ‘<strong>이것은 내 피로 맺는 새로운 계약의 잔이니</strong> 마실 때마다 나를 기억하여 이 예를 행하여라’하고 말씀하셨습니다.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/11/#L24-25">1고린 11:24-25</a>)</p></blockquote><h2>나라</h2><blockquote><p>“<strong>그리스도께서는 죽은 자의 주님도 되시고 산 자의 주님도 되시기 위해서 죽으셨다가 다시 살아 나셨습니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/rim/14/#L9">로마 14:9</a>)</p></blockquote><p>성부의 뜻과 예언과 약속의 성취</p><blockquote><p>“그리스도께서는 <strong>하느님의 진실성을 드러내시기 위하여</strong> 할례받은 사람들의 종이 되셨습니다. 이리하여 하느님께서 그들의 <strong>조상에게 약속하신 것을 이루셨고</strong>” (<a href="https://bibleox.com/ko/ko-ctb/rim/15/#L8">로마 15:8</a>)</p></blockquote><h2>본보기</h2><blockquote><p>“여러분은 바로 그렇게 살아 가라고 부르심을 받은 사람들입니다. <strong>그리스도께서도 여러분을 위해서 고난을 받으심으로써 당신의 발자취를 따르라고 본보기를 남겨 주셨습니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/1pet/2/#L21">1베드 2:21</a>)</p></blockquote><blockquote><p>“<strong>그리스도께서 이렇게 죽으신 것은 사람들이 이제는 자기 자신을 위하여 살지 않고 자기들을 위해서 죽으셨다가 다시 살아나신 분을 위해서 살게 하시려는 것이었습니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/2kor/5/#L15">2고린 5:15</a>)</p></blockquote><h2>무슬림의 질문</h2><h3>자비로우신 하느님께서 그냥 용서하실 수 있는데 왜 희생이 필요합니까?</h3><p>그리스도인들이 믿는 하느님은 사랑이라 불리십니다:</p><blockquote><p>“사랑하지 않는 사람은 하느님을 알지 못합니다. <strong>하느님은 사랑이시기 때문입니다</strong>. &lt;…&gt; 우리는 하느님께서 우리에게 베푸시는 사랑을 알고 또 믿습니다. <strong>하느님은 사랑이십니다</strong>. 사랑 안에 있는 사람은 하느님 안에 있으며 하느님께서는 그 사람 안에 계십니다.” (<a href="https://bibleox.com/ko/ko-ctb/1in/4/#L8,16">1요한 4:8,16</a>)</p></blockquote><p>하느님께서는 바로 피조물의 구원을 위해 당신을 희생으로 내어 주심으로써 그들을 향한 사랑을 보이십니다. 하느님께서 친히 이렇게 말씀하셨기 때문입니다:</p><blockquote><p>“<strong><mark>벗을 위하여 제 목숨을 바치는 것보다 더 큰 사랑은 없다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/in/15/#L13">요한 15:13</a>)</p></blockquote><p>이처럼 그분은 희생적 사랑으로 구원하시려는 이들을 당신께 이끄십니다:</p><blockquote><p>“<strong>내가 이 세상을 떠나 높이 들이게 될 때에는 모든 사람을 이끌어 나에게 오게 할 것이다</strong>.‘하고 말씀하셨다. 이것은 예수께서 <strong>당신이 어떻게 돌아 가시리라는 것을 암시하신 말씀이었다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/in/12/#L32-33">요한 12:32-33</a>)</p></blockquote><p>그러나 지극히 지혜로우신 하느님께서는 구원을 지혜롭게 마련하십니다. 사랑 외에 하느님의 정의를 충족시키는 일도 말할 수 있습니다. 하느님께서는 자비로우실 뿐 아니라 의로우시기 때문입니다. 그분은 지혜와 자비와 정의와 사랑을 한꺼번에 하나로 이루실 줄 아십니다.</p>
