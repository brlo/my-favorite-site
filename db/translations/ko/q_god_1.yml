- src: отвержение-Христа-отвержение-Бога
  path: Ry7p_그리스도를배척하는것은하느님을배척하는것
  title: 그리스도를 배척하는 것은 하느님을 배척하는 것입니다
  copy_cover: true
  body: <blockquote><p>“너희 말을 듣는 자는 곧 내 말을 듣는 것이요 너희를 저버리는 자는 곧 나를 저버리는 것이요 <strong>나를 저버리는 자는 나 보내신 이를 저버리는 것이라</strong> 하시니라” (<a href="https://bibleox.com/ko/ko-nkrv/lk/10/#L16">눅 10:16</a>)</p></blockquote><blockquote><p>“<strong>나를 미워하는 자는 또 내 아버지를 미워하느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/in/15/#L23">요 15:23</a>)</p></blockquote><blockquote><p>“<strong>아들을 부인하는 자에게는 또한 아버지가 없으되</strong> 아들을 시인하는 자에게는 아버지도 있느니라” (<a href="https://bibleox.com/ko/ko-nkrv/1in/2/#L23">요일 2:23</a>)</p></blockquote><blockquote><p>“지나쳐 <strong>그리스도의 교훈 안에 거하지 아니하는 자는 다 하나님을 모시지 못하되</strong> 교훈 안에 거하는 그 사람은 아버지와 아들을 모시느니라” (<a href="https://bibleox.com/ko/ko-nkrv/2in/1/#L9">요이 1:9</a>)</p></blockquote><blockquote><p>“아들을 믿는 자에게는 영생이 있고 <strong>아들에게 순종하지 아니하는 자는 영생을 보지 못하고 도리어 하나님의 진노가 그 위에 머물러 있느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/in/3/#L36">요 3:36</a>)</p></blockquote>
