  title: 예수 그리스도 — 구세주
  copy_cover: true
  body: '<p>이 글은 예수 그리스도께서 구세주이심을 보여 줄 뿐 아니라, 그분이 어떤 구세주이신지, 곧 모든 사람의 구세주이심을 보여 줍니다. 모든 사람이 그리스도께 부름을 받았지만 모두가 구원받는 것은 아닙니다.</p><h2>이교의 신들은 신이 아닙니다</h2><p>다른 하느님은 없습니다:</p><blockquote><p>“우상 앞에 놓았던 제물을 먹는 문제가 나왔지만 우리가 알고 있는 대로 세상에 있는 우상은 아무것도 아니고 또 <strong>하느님은 한 분밖에 안 계십니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/8/#L4">1고린 8:4</a>)</p></blockquote><p>이교도들이 전에 섬기던 것은 신이 아닙니다:</p><blockquote><p>“여러분이 하느님을 모르고 있을 때에는 <strong>본래 하느님이 아닌 신들</strong>의 종노릇을 하였습니다.” (<a href="https://bibleox.com/ko/ko-ctb/gal/4/#L8">갈라 4:8</a>)</p></blockquote><p>거짓 신들입니다:</p><blockquote><p>“여러분, 이게 무슨 짓입니까? 우리도 여러분과 똑같은 사람입니다. 우리는 다만 여러분에게 복음을 전하여 여러분이 <strong>이런 헛된 우상을 버리고 살아 계신 하느님께 돌아 오게 하려고</strong> 왔을 따름입니다. 이 하느님은 하늘과 땅과 바다와 그 안에 있는 모든 것을 만드신 분입니다.” (<a href="https://bibleox.com/ko/ko-ctb/act/14/#L15">사도 14:15</a>)</p></blockquote><p>지난날 모든 민족은 하느님의 길이 아니라 자기 길을 걸었습니다:</p><blockquote><p>“지난 날에는 하느님께서 <strong>모든 나라 사람을 제멋대로 살게 내버려 두셨습니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/act/14/#L16">사도 14:16</a>)</p></blockquote><p>이와 같은 인용구가 더 많이 있습니다: <a href="https://bibleox.com/ru/ru/w/Бог-один">하느님은 한 분이십니다</a></p><h2>그리스도를 배척하는 것은 하느님을 배척하는 것입니다</h2><blockquote><p>“이렇게 꾸짖으시고 제자들에게 ‘너희의 말을 듣는 사람은 나의 말을 듣는 사람이고 너희를 배척하는 사람은 나를 배척하는 사람이며 <strong>나를 배척하는 사람은 곧 나를 보내신 분을 배척하는 사람이다</strong>.’하고 말씀하셨다.” (<a href="https://bibleox.com/ko/ko-ctb/lk/10/#L16">루가 10:16</a>)</p></blockquote><blockquote><p>“<strong>나를 미워하는 자는 나의 아버지까지도 미워한다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/in/15/#L23">요한 15:23</a>)</p></blockquote><blockquote><p>“<strong>누구든지 아들을 부인하는 사람은 아버지까지도 부인하며</strong> 그와 반대로 아들을 인정하는 사람은 아버지까지도 인정합니다.” (<a href="https://bibleox.com/ko/ko-ctb/1in/2/#L23">1요한 2:23</a>)</p></blockquote><blockquote><p>“<strong>그리스도의 교훈을 지키지 않고 지나치게 앞서 나가는 자는 누구든지 하느님을 모시지 않는 자입니다</strong>. 그리스도의 교훈을 지키는 사람은 하느님 아버지와 그 아들을 함께 모시는 사람입니다.” (<a href="https://bibleox.com/ko/ko-ctb/2in/1/#L9">2요한 1:9</a>)</p></blockquote><blockquote><p>“그러므로 아들을 믿는 사람은 영원한 생명을 얻을 것이며 <strong>아들을 믿지 않는 사람은 생명을 얻기는 커녕 오히려 하느님의 영원한 분노를 사게 될 것이다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/in/3/#L36">요한 3:36</a>)</p></blockquote><h2>그리스도를 믿지 않고는 구원받을 수 없습니다</h2><blockquote><p>“불구자였던 저 사람이 성한 몸으로 여러분 앞에 서게 된 것은 <strong>나자렛 예수 그리스도의 이름을 힘입어</strong> 된 것입니다. 그분은 여러분이 십자가에 못박아 죽였지만 하느님께서 죽은 자들 가운데서 다시 살리신 분입니다. 여러분과 이스라엘의 모든 백성은 이것을 아셔야 합니다. 이 예수는 집짓는 사람들 곧 여러분에게 버림을 받았지만 모퉁이의 머릿돌이 되신 분입니다. <strong>이분을 힘입지 않고는 아무도 구원받을 수 없습니다</strong>. <strong>사람에게 주신 이름 가운데 우리를 구원할 수 있는 이름은 이 이름밖에는 없습니다</strong>.‘” (<a href="https://bibleox.com/ko/ko-ctb/act/4/#L10-12">사도 4:10-12</a>)</p></blockquote><blockquote><p>“<strong>믿음이 없이는 하느님을 기쁘게 해 드릴 수 없습니다</strong>. 하느님께로 가까이 가는 사람은 하느님이 계시다는 것과 하느님께서 당신을 찾는 사람들에게 상을 주신 다는 것을 믿어야 합니다.” (<a href="https://bibleox.com/ko/ko-ctb/evr/11/#L6">히브 11:6</a>)</p></blockquote><h2>이단과 교회로부터의 분리는 구원을 잃게 합니다</h2><p>이단을 꾸며 내는 사람들은 하느님 나라를 차지하지 못합니다:</p><blockquote><p>“육정이 빚어내는 일은 명백합니다. 곧 음행, 추행, 방탕, 우상 숭배, 마술, 원수맺는 것, 싸움, 시기, 분노, 이기심, <strong>분열, 당파심</strong>, 질투, 술주정, 흥청대며 먹고 마시는 것, 그 밖에 그와 비슷한 것들입니다. 내가 전에도 경고한 바 있지만 지금 또다시 경고합니다. 이런 짓을 일삼는 자들은 <strong>결코 하느님 나라를 차지하지 못할 것입니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/gal/5/#L19-21">갈라 5:19-21</a>) <em>(“분열”은 그리스어 원문에서 διχοστασίαι(갈라짐), “당파심”은 αἱρέσεις(<strong>이단</strong>)입니다.)</em></p></blockquote><p>교회에 분열을 일으키는 사람들은 주 예수 그리스도를 섬기지 않습니다:</p><blockquote><p>“형제 여러분, 여러분이 배운 교훈과는 달리 <strong>남들을 분열시키고 죄짓게 하는 사람들을</strong> 경계하고 멀리하시기 바랍니다. <strong>그런 자들은 우리 주 예수 그리스도를 섬기는 것이 아니라</strong> 자기네 뱃속을 채우고 있으며 그럴 듯한 말과 아첨하는 언사로 순진한 사람들의 마음을 유혹하고 있는 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/rim/16/#L17-18">로마 16:17-18</a>)</p></blockquote><blockquote><p>“마지막 때에 하느님을 두려워하지 않고 자기들의 욕정을 따라 사는 자들이 나타나 여러분을 조롱할 것이라고 사도들이 여러분에게 말했습니다. 이런 자들은 성령을 따라 살지 않고 본능적인 욕정을 좇아서 살면서 <strong>분열을 일으킵니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/iud/1/#L18-19">유다 1:18-19</a>)</p></blockquote><p>교회는 그리스도의 몸이고 그리스도께서는 그 몸의 구세주이십니다:</p><blockquote><p>“하느님을 찬양하였다. 이것을 보고 모든 사람이 그들을 우러러 보게 되었다. <strong>주께서는 구원받을 사람을 날마다 늘려 주셔서 신도의 모임이 커 갔다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/act/2/#L47">사도 2:47</a>)</p></blockquote><blockquote><p>“그래서 나는, 여러분을 위하여 기꺼이 고통을 겪고 있습니다. 그리고 나는 <strong>그리스도의 몸인 교회</strong>를 위하여 그리스도의 남은 고난을 내 몸으로 채우고 있습니다.” (<a href="https://bibleox.com/ko/ko-ctb/kol/1/#L24">골로 1:24</a>)</p></blockquote><blockquote><p>“그리스도께서 <strong>당신의 몸인 교회의 구원자로서</strong> 그 교회의 머리가 되시는 것처럼 남편은 아내의 주인이 됩니다.” (<a href="https://bibleox.com/ko/ko-ctb/ef/5/#L23">에페 5:23</a>)</p></blockquote><h2>모든 사람이 심판을 받습니다</h2><blockquote><p>“<strong>우리가 다 그리스도의 심판대 앞에 나가는 날에는</strong> 우리가 육체에 머물러 있는 동안에 <strong>한 일들이</strong> 숨김없이 드러나서 <strong>잘한 일은 상을 받고 잘못한 일은 벌을 받게 될 것이기</strong> 때문입니다.” (<a href="https://bibleox.com/ko/ko-ctb/2kor/5/#L10">2고린 5:10</a>)</p></blockquote><blockquote><p>“<strong>좋은 일이든 나쁜 일이든</strong>, 심지어 남몰래 한 일까지도 <strong>사람이 한 모든 일을 하느님께서는 심판에 붙이신다는</strong> 사실을 명하여라.” (<a href="https://bibleox.com/ko/ko-ctb/ekl/12/#L14">전도 12:14</a>)</p></blockquote><h3>심판은 교회에서 시작됩니다</h3><blockquote><p>“<strong>심판의 때는 왔습니다. 하느님의 백성이 먼저 심판을 받을 것입니다</strong>. 하느님께서 당신의 백성인 <strong>우리를 먼저 심판하신다면</strong> 하느님의 복음을 믿지 않는 자들의 말로가 어떠하겠습니까? <strong>의로운 사람이 겨우 구원을 받는다면</strong> 경건치 못한 죄인은 어떻게 되겠습니까?” (<a href="https://bibleox.com/ko/ko-ctb/1pet/4/#L17-18">1베드 4:17-18</a>)</p></blockquote><h3>우리는 모두 많은 죄를 짓습니다</h3><blockquote><p>“<strong>우리는 모두 실수하는 일이 많습니다</strong>. 말에 실수가 없는 사람은 온 몸을 잘 다스릴 수 있는 완전한 사람입니다.” (<a href="https://bibleox.com/ko/ko-ctb/iak/3/#L2">야고 3:2</a>)</p></blockquote><blockquote><p>“<strong>만일 우리가 죄없는 사람이라고 말한다면 우리는 자신을 속이는 것이고</strong> 진리를 저버리는 것이 됩니다. &lt;…&gt; 만일 우리가 죄를 짓지 않았다고 말한다면 우리는 하느님을 거짓말장이로 만드는 것이며 그분의 말씀을 저버리는 것이 됩니다.” (<a href="https://bibleox.com/ko/ko-ctb/1in/1/#L8,10">1요한 1:8,10</a>)</p></blockquote><h3>많은 이들이 구원받지 못함을 알고 놀랄 것입니다</h3><p>그들은 자기가 구원받은 줄로 생각했습니다:</p><blockquote><p>“그 날에는 <strong>많은 사람이</strong> 나를 보고 주님, 주님! 우리가 주님의 이름으로 <strong>예언을 하고</strong> 주님의 이름으로 <strong>마귀를 쫓아 내고</strong> 또 주님의 이름으로 <strong>많은 기적을 행하지</strong> 않았습니까? 하고 말할 것이다. 그러나 그 때에 나는 분명히 그들에게 악한 일을 일삼는 자들아, <strong>나에게서 물러가라. 나는 너희를 도무지 알지 못한다</strong> 고 말할 것이다.‘” (<a href="https://bibleox.com/ko/ko-ctb/mf/7/#L22-23">마태 7:22-23</a>)</p></blockquote><h2>많은 이들이 구원받지 못할 것입니다</h2><h3>모두가 구원받는 것은 아닙니다</h3><blockquote><p>“사실 <strong>많은 사람들이</strong> 구원의 문으로 들어 가려고 하겠지만 <strong>들어 가지 못할 것이다</strong>. 그러니 좁은 문으로 들어 가도록 있는 힘을 다하여라.” (<a href="https://bibleox.com/ko/ko-ctb/lk/13/#L24">루가 13:24</a>)</p></blockquote><blockquote><p>“‘좁은 문으로 들어 가거라. <strong>멸망에 이르는 문은 크고 또 그 길이 넓어서 그리로 가는 사람이 많지만</strong> <strong>생명에 이르는 문은 좁고 또 그 길이 험해서 그리로 찾아 드는 사람이 적다</strong>.’” (<a href="https://bibleox.com/ko/ko-ctb/mf/7/#L13-14">마태 7:13-14</a>)</p></blockquote><blockquote><p>“‘<strong>나더러 주님, 주님 하고 부른다고 다 하늘 나라에 들어 가는 것이 아니다</strong>. 하늘에 계신 내 아버지의 뜻을 실천하는 사람이라야 들어 간다.” (<a href="https://bibleox.com/ko/ko-ctb/mf/7/#L21">마태 7:21</a>)</p></blockquote><blockquote><p>“<strong>모두가 구원받는 것은 아니다</strong>” (<a href="https://bibleox.com/ko/en-nrsv/3ezd/8/#L41">3에스 8:41</a>, 영어 번역(NRSV)에서 옮김)</p></blockquote><h3>구원받는 이는 적습니다</h3><blockquote><p>“그런데 어떤 사람이 ‘선생님, <strong>구원받을 사람은 얼마 안 되겠지요</strong>?’하고 물었다. 예수께서 사람들에게 이렇게 대답하셨다. 사실 <strong>많은 사람들이 구원의 문으로 들어 가려고 하겠지만 들어 가지 못할 것이다</strong>. 그러니 좁은 문으로 들어 가도록 있는 힘을 다하여라.” (<a href="https://bibleox.com/ko/ko-ctb/lk/13/#L23-24">루가 13:23-24</a>)</p></blockquote><blockquote><p>“‘좁은 문으로 들어 가거라. <strong>멸망에 이르는 문은 크고 또 그 길이 넓어서 그리로 가는 사람이 많지만</strong> <strong>생명에 이르는 문은 좁고 또 그 길이 험해서 그리로 찾아 드는 사람이 적다</strong>.’” (<a href="https://bibleox.com/ko/ko-ctb/mf/7/#L13-14">마태 7:13-14</a>)</p></blockquote><blockquote><p>“그 날에는 <strong>많은 사람이</strong> 나를 보고 주님, 주님! 우리가 주님의 이름으로 예언을 하고 주님의 이름으로 마귀를 쫓아 내고 또 주님의 이름으로 많은 기적을 행하지 않았습니까? 하고 말할 것이다. 그러나 그 때에 나는 분명히 그들에게 <strong>악한 일을 일삼는 자들아, 나에게서 물러가라</strong>. 나는 너희를 도무지 알지 못한다 고 말할 것이다.‘” (<a href="https://bibleox.com/ko/ko-ctb/mf/7/#L22-23">마태 7:22-23</a>)</p></blockquote><blockquote><p>“내 <strong>어린 양떼들아</strong>, 조금도 무서워하지 말라. 너희 아버지께서는 하늘 나라를 너희에게 기꺼이 주시기로 하셨다.‘” (<a href="https://bibleox.com/ko/ko-ctb/lk/12/#L32">루가 12:32</a>)</p></blockquote><blockquote><p>“불의를 행하는 자는 불의를 행하도록 내버려 두고 더러운 자는 그냥 더러운 채로 내버려 두어라. 올바른 사람은 그대로 올바른 일을 하게 하고 <strong>거룩한 사람은 그대로 거룩한 사람이 되게 하여라</strong>‘ 주님께서는 이렇게 말씀하셨습니다. ’자, 내가 곧 가겠다. <strong>나는 너희 각 사람에게 자기 행적대로 갚아 주기 위해서</strong> 상을 가지고 가겠다.” (<a href="https://bibleox.com/ko/ko-ctb/otkr/22/#L11-12">묵시 22:11-12</a>)</p></blockquote>'
  meta_desc: 예수 그리스도께서 모든 사람의 구세주이시며, 모든 사람이 그리스도께 부름을 받았지만 모두가 구원받는 것은 아님을 보여 주는 성경 구절
