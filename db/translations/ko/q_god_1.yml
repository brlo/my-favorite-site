  body: <p>아담의 죄로 온 인류가 단죄를 받았습니다:</p><blockquote><p>“그러므로 <strong>한 사람이 죄를 지어 모든 사람이 유죄판결을 받은 것과는 달리</strong> 한 사람의 올바른 행위로 모든 사람이 무죄판결을 받고 길이 살게 되었습니다.” (<a href="https://bibleox.com/ko/ko-ctb/rim/5/#L18">로마 5:18</a>)</p></blockquote><p>그리스도께서는 인류의 저주를 당신께 지셨습니다:</p><blockquote><p>“나무에 달린 자는 누구나 저주받을 자다‘라고 성서에 기록되어 있듯이 그리스도께서는 <strong>우리를 위하여 십자가에 달려 저주받은 자가 되셔서</strong> 우리를 율법의 저주에서 구원해 내셨습니다.” (<a href="https://bibleox.com/ko/ko-ctb/gal/3/#L13">갈라 3:13</a>)</p></blockquote><p>그리스도께서는 당신의 피로 사람을 구속하셨습니다:</p><blockquote><p>“<strong>여러분은</strong> <strong>조상들에게서 물려 받은 헛된 생활에서 해방되었습니다</strong>. 그러나 아시다시피 그것은 은이나 금 따위의 없어질 물건으로 값을 치르고 된 일이 아니라 흠도 티도 없는 어린 양의 피 같은 <strong>그리스도의 귀한 피로</strong> 얻은 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/1pet/1/#L18-19">1베드 1:18-19</a>)</p></blockquote><blockquote><p>“그리고 그들은 다음과 같은 새로운 노래를 불렀습니다. ‘당신은 두루마리를 받으실 자격이 있고 봉인을 떼실 자격이 있습니다. 당신은 죽임을 당하셨고 <strong>당신의 피로 값을 치러</strong> 모든 민족과 언어와 백성과 나라로부터 <strong>사람들을 구해 내셔서</strong> 하느님께 바치셨습니다.” (<a href="https://bibleox.com/ko/ko-ctb/otkr/5/#L9">묵시 5:9</a>)</p></blockquote>
  meta_desc: "“당신은 죽임을 당하셨고 당신의 피로 값을 치러 모든 민족과 언어와 백성과 나라로부터 사람들을 구해 내셔서 하느님께 바치셨습니다” (묵시 5:9)"
