  path: Ps5r_성인들에게_드리는_기도
  title: 성인들에게 드리는 기도
  copy_cover: true
  body: '<h2>정교회의 이해</h2><p>정교회는 주 예수 그리스도께서 유일한 중재자이시라고 가르칩니다. 그러나 어떤 중재자이십니까? 모든 이를 위해 당신 자신을 대속물로 내주신 분입니다(<a href="https://bibleox.com/ko/ko-ctb/1tim/2/#L5-6">1디모 2:5-6</a>). 다른 거룩한 사람들이나 천사들 가운데 구속자는 없습니다. 그러나 함께 기도해 주는 이들은 많습니다:</p><blockquote><p>“하느님께서는 과연 그렇게 어려운 죽을 고비에서 우리를 건져 내 주셨고 <strong>앞으로도 건져 내 주실 것입니다</strong>. 이렇게 우리는 하느님께서 앞으로도 건져 내 주시리라는 희망을 가지고 있습니다. <strong>여러분은 기도로써 우리를 도와 주십시오. 하느님께서 많은 사람의 기도를 들으시고 우리에게 축복을 내리실 것이며 그것을 보고 많은 사람이 하느님께 감사를 드리게 될 것입니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/2kor/1/#L10-11">2고린 1:10-11</a>)</p></blockquote><p>거룩하고 의로운 하느님의 벗들, 곧 하느님의 어머니, 천사들, 예언자들, 사도들, 순교자들과 다른 성인들도 그러합니다. 이 세상에서 사도에게 기도를 청했듯이 저세상에서도 그에게 기도를 청합니다. 각자가 자기만을 위해 하느님께 기도해야 한다는 생각은 성경에 낯섭니다. 오히려 성경에서는 온 교회가 서로를 위해 기도하라는 부름을 거듭 받습니다(<a href="https://bibleox.com/ko/ko-ctb/iak/5/#L16">야고 5:16</a>)[1]. 위대한 의인들과 하느님께 택함받은 이들까지 모두가 하느님께 기도를 그치지 않으면서 신자들에게 자기를 위해 기도해 달라고 청했고, 자신들도 신자들을 위해 끊임없이 기도했으며, 앞으로도 이 질서를 지키라고 명했습니다. 이것을 서로를 위한 전구라고도 합니다.</p><p>우리는 교회에서 알고 성경에서 확인합니다. 의인들은 몸에서 떠나면 하느님과 함께하는 삶으로 옮아가 계속 그분께 기도를 바칩니다. 그러므로 사람들이 이 의인들이 지상에서 몸으로 살 때 기도를 청했듯이, 몸에서 떠나 하늘에서 그리스도와 함께 드러난 삶으로 옮아간 뒤에도 똑같이 기도를 청합니다(<a href="https://bibleox.com/ko/ko-ctb/evr/12/#L22-23">히브 12:22-23</a>). 그들은 더 나쁜 상태가 아니라 더 좋은 상태로 옮아갔기 때문입니다(<a href="https://bibleox.com/ko/ko-ctb/fil/1/#L23">필립 1:23</a>). 우리는 사랑이 가실 줄을 모른다고 믿습니다(<a href="https://bibleox.com/ko/ko-ctb/1kor/13/#L8">1고린 13:8</a>). 그러므로 온 교회, 곧 지상에서 싸우는 교회와 하늘에서 승리한 교회는 하나이고 온전하며, 서로 소통하고 서로를 위해 함께 기도하며, 사랑으로 모든 지체를 돌봅니다. 우리는 수호천사들이 하느님과 친교를 나누고(<a href="https://bibleox.com/ko/ko-ctb/mf/18/#L10">마태 18:10</a>) 구원을 상속받을 이들을 섬기도록 파견된다고(<a href="https://bibleox.com/ko/ko-ctb/evr/1/#L14">히브 1:14</a>) 믿고 교회에서 알며 성경으로 보여 줍니다. 거룩한 의인들도 하느님의 빛 안에 머물며 지상의 일을 알고 교회를 위해 하느님께 기도를 바칩니다(<a href="https://bibleox.com/ko/ko-ctb/otkr/6/#L9-11">묵시 6:9-11</a>). 영원한 사랑은 그리스도의 한 몸 안에서, 하늘에서도 땅에서도 모두를 서로의 친교와 돌봄으로 움직입니다.</p><h2>천사들의 기도</h2><h3>사람에게는 수호천사가 있습니다</h3><blockquote><p>“‘너희는 이 보잘 것 없는 사람들 가운데 누구 하나라도 업신여기는 일이 없도록 조심하여라. 하늘에 있는 <strong>그들의 천사들이</strong> 하늘에 계신 내 아버지를 항상 모시고 있다는 것을 알아 두어라.’” (<a href="https://bibleox.com/ko/ko-ctb/mf/18/#L10">마태 18:10</a>)</p></blockquote><h3>천사들은 구원받는 이들을 돌보도록 파견됩니다</h3><blockquote><p>“그런데 하느님께서 어느 천사에게 ‘내가 네 원수를 네 발 아래 굴복시킬 때까지 너는 내 오른편에 앉아 있어라’ 하고 말씀하신 적이 있으십니까? 천사들은 모두 하느님을 섬기는 영적인 존재들로서 결국은 <strong>구원의 유산을 받을 사람들을 섬기라고 파견된 일꾼들</strong>이 아닙니까?” (<a href="https://bibleox.com/ko/ko-ctb/evr/1/#L13-14">히브 1:13-14</a>)</p></blockquote><h3>하늘의 천사들은 사람의 회개를 기뻐합니다</h3><blockquote><p>“잘 들어 두어라. 이와 같이 회개할 것 없는 의인 아흔 아홉보다 <strong>죄인 한 사람이 회개하는 것을 하늘에서는 더 기뻐할 것이다</strong>.‘ &lt;…&gt; 잘 들어 두어라. 이와 같이 <strong>죄인 하나가 회개하면 하느님의 천사들이 기뻐할 것이다</strong>.’” (<a href="https://bibleox.com/ko/ko-ctb/lk/15/#L7,10">루가 15:7,10</a>)</p></blockquote><h3>천사는 사람들을 위해 하느님 앞에 전구합니다</h3><p>천사는 유다 성읍 주민들을 위해 자비를 청합니다:</p><blockquote><p>“이 말을 듣고 그 천사가 야훼께 아뢰었다. ‘<strong>만군의 야훼여, 언제까지 예루살렘과 유다 성읍들을 불쌍히 여기시지 않으시고</strong> 내버려 두시렵니까? 주께서 노하신 지 이미 칠십 년이 되었습니다.’ 야훼께서 나와 말하던 그 천사를 좋은 말로 위로하시자,” (<a href="https://bibleox.com/ko/ko-ctb/zah/1/#L12-13">즈가 1:12-13</a>)</p></blockquote><h3>천사와의 소통</h3><blockquote><p>“동틀 무렵에 <strong>하느님의 천사들이 롯을 재촉하였다</strong>. ‘이 성에 벌이 내릴 때 함께 죽지 않으려거든, 네 아내와 시집가지 않은 두 딸을 데리고 어서 떠나거라.’” (<a href="https://bibleox.com/ko/ko-ctb/gen/19/#L15">창 19:15</a>)</p></blockquote><blockquote><p>“야훼의 천사가 아비에젤의 후손 요아스의 성 오브라에 있는 상수리나무 밑에 와서 앉았다. 마침 요아스의 아들 기드온이 미디안 사람들에게 들키지 않으려고 밀 이삭을 포도주틀에서 떨고 있었는데, <strong>야훼의 천사가 그에게 나타나 일렀다</strong>. ‘힘센 장사야, 야훼께서 너와 함께 계신다.’ <strong>기드온이 반문하였다</strong>. ‘외람된 말씀입니다만, 야훼께서 우리와 함께 계시는데 왜 우리가 지금 이 모든 어려움을 겪고 있는 것입니까? 우리를 에집트에서 올라 오게 하실 때 야훼께서 온갖 기적을 행하셨다는 말을 우리는 선조들에게서 들었습니다마는 그 기적들이 지금 다 어디로 갔습니까? 지금은 야훼께서 우리를 버리셨습니다. 우리를 이렇게 미디안 사람들의 손에 붙이시지 않으셨습니까?’” (<a href="https://bibleox.com/ko/ko-ctb/sud/6/#L11-13">판관 6:11-13</a>)</p></blockquote><blockquote><p>“그 때 소라 지방에 단 지파 출신 마노아라는 사람이 있었다. 그의 아내는 아기를 낳지 못하는 돌계집이었는데, <strong>야훼의 천사가 그 여인에게 나타나 말하였다</strong>. ‘보아라. 너는 아기를 낳아 보지 못한 돌계집이지만 이제 임신하여 아들을 낳으리라.” (<a href="https://bibleox.com/ko/ko-ctb/sud/13/#L2-3">판관 13:2-3</a>)</p></blockquote><blockquote><p>“그때 하늘에서 <strong>천사가 그분께 나타나 힘을 북돋아 드렸다</strong>” (<a href="https://bibleox.com/ko/en-nrsv/lk/22/#L43">루가 22:43</a>, 영어 번역(NRSV)에서 옮김)</p></blockquote><blockquote><p>“헤로데가 유다의 왕이었을 때에 아비야 조에 속하는 사제 한 사람이 있었는데 그 이름은 즈가리야였고 그의 아내는 사제 아론의 후예로서 이름은 엘리사벳이었다. &lt;…&gt; 그 때에 <strong>주님의 천사가 즈가리야에게 나타나</strong> 분향 제단 오른쪽에 서 있었다. &lt;…&gt; 그 때에 <strong>천사가 이렇게 말하였다</strong>. ‘두려워하지 말라. 즈가리야, 하느님께서 네 간구를 들어 주셨다. 네 아내 엘리사벳이 아들을 낳을 터이니 아기의 이름을 요한이라 하여라. &lt;…&gt; 이 말을 들은 <strong>즈가리야가</strong> ’저는 늙은이입니다. 제 아내도 나이가 많습니다. 무엇을 보고 그런 일을 믿으라는 말씀입니까?‘하고 말하자 <strong>천사는 이렇게 대답하였다</strong>. ’나는 하느님을 모시는 시종 가브리엘이다. 이 기쁜 소식을 전하라는 분부를 받들고 너에게 와 일러 주었는데” (<a href="https://bibleox.com/ko/ko-ctb/lk/1/#L5,11,13,18-19">루가 1:5,11,13,18-19</a>)</p></blockquote><blockquote><p>“엘리사벳이 아기를 가진 지 여섯 달이 되었을 때에 하느님께서는 <strong>천사 가브리엘을</strong> 갈릴래아 지방 나자렛이라는 동네로 보내시어 다윗 가문의 요셉이라는 사람과 약혼한 <strong>처녀</strong>를 찾아 가게 하셨다. 그 처녀의 이름은 마리아였다. <strong>천사는 마리아의 집으로 들어 가</strong> ‘은총을 가득히 받은 이여, 기뻐하여라. 주께서 너와 함께 계신다’하고 인사하였다. &lt;…&gt; 그러자 <strong>천사는 다시</strong> ‘두려워하지 말라. 마리아, 너는 하느님의 은총을 받았다. 이제 아기를 가져 아들을 낳을 터이니 이름을 예수라 하여라. &lt;…&gt; 이 말을 듣고 <strong>마리아가</strong> ’이 몸은 처녀입니다. 어떻게 그런 일이 있을 수 있겠습니까?‘하자 <strong>천사는 이렇게 대답하였다</strong>. ’성령이 너에게 내려 오시고 지극히 높으신 분의 힘이 감싸 주실 것이다. 그러므로 태어나실 그 거룩한 아기를 하느님의 아들이라 부르게 될 것이다.” (<a href="https://bibleox.com/ko/ko-ctb/lk/1/#L26-28,30-31,34-35">루가 1:26-28,30-31,34-35</a>)</p></blockquote><blockquote><p>“어느 날 밤 바울로는 거기에서 신비로운 영상을 보았다. 마케도니아 사람 하나가 바울로 앞에 서서 ‘마케도니아로 건너 와서 우리를 도와 주십시오’하고 <strong>간청하였던 것이다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/act/16/#L9">사도 16:9</a>)</p></blockquote><blockquote><p>“그런데 갑자기 <strong>주의 천사가 나타나 베드로 앞에 서자</strong> 환한 빛이 감방을 비추었다. 천사가 <strong>베드로의 옆구리를 찔러 깨우며</strong> ‘빨리 일어나라’하고 재촉하였다. 그러자 곧 쇠사슬이 그의 두 손목에서 벗겨졌다. 허리띠를 띠고 신을 신어라‘하는 <strong>천사의 말을 듣고</strong> 베드로는 그대로 하였다. 그랬더니 천사는 ’겉옷을 걸치고 나를 따라 오너라‘ 하였다.” (<a href="https://bibleox.com/ko/ko-ctb/act/12/#L7-8">사도 12:7-8</a>)</p></blockquote><blockquote><p>“이 책은 예수 그리스도께서 계시하신 일들을 기록한 책이다. 하느님께서 곧 일어날 일들을 당신의 종들에게 보이시려고 그리스도에게 계시하셨고 그리스도께서는 <strong>당신의 천사를 당신의 종 요한에게 보내어</strong> 알려 주셨습니다.” (<a href="https://bibleox.com/ko/ko-ctb/otkr/1/#L1">묵시 1:1</a>)</p></blockquote><h2>죽은 이들의 기도</h2><p>예언자 바룩은 안식한 의인들의 기도를 들어 달라고 하느님께 청합니다:</p><blockquote><p>“주님, 들으시고 자비를 베푸소서. <strong>저희가 주님께 죄를 지었습니다</strong>. … 전능하신 주님, 이스라엘의 하느님, <strong>이제 이스라엘의 죽은 이들의 기도를 들어 주소서</strong>, 주님께 죄지은 이들의 자녀들의 기도를 들어 주소서” (<a href="https://bibleox.com/ko/gr-lxx-byz/var/3/#L2-4">바룩 3:2-4</a>, 그리스어에서 번역)</p></blockquote><p>안식한 라헬, 곧 족장 야곱의 아내는 바빌론 유배 때 아들들의 죽음과 고난을 슬퍼합니다. 주님께서는 그에게 대답하시고 위로하시며 그들을 해방하겠다고 약속하시고, 그대로 이루어졌습니다:</p><blockquote><p>“나 야훼가 말한다. 라마에서 통곡소리가 들린다. 애절한 울음소리가 들린다. <strong>라헬이 자식을 잃고 울고 있구나. 그 눈앞에 아이들이 없어 위로하는 말이 하나도 귀에 들어 가지 않는구나</strong>. <strong>이 야훼의 말을 들어라. 울음을 그치고 눈물을 거두어라. 애태운 보람이 있어</strong> 자식들이 적국에서 돌아 오리라. 이는 내 말이라, 어김이 없다. 밝은 앞날이 너를 기다리고 있다. 내가 분명히 말한다. 너의 자식들이 고향으로 돌아 오리라.” (<a href="https://bibleox.com/ko/ko-ctb/ier/31/#L15-17">예레 31:15-17</a>)</p></blockquote><p>이 구절은 비유로도, 글자 그대로도 이해할 수 있습니다.</p><h2>의인들의 기도</h2><h3>의인의 기도는 하느님 마음에 더 듭니다</h3><blockquote><p>“야훼께선 악한 사람의 제물을 역겨워하시고 <strong>바른 사람의 기도는 반가와하신다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/pr/15/#L8">잠언 15:8</a>)</p></blockquote><blockquote><p>“야훼께서는 나쁜 사람을 멀리하시고 <strong>착한 사람의 기도는 들어 주신다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/pr/15/#L29">잠언 15:29</a>)</p></blockquote><blockquote><p>“그러므로 여러분은 서로 죄를 고백하고 서로 남을 위하여 기도하십시오. 그러면 모두 온전해질 것입니다. <strong>올바른 사람의 간구는 큰 효과를 나타냅니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/iak/5/#L16">야고 5:16</a>)</p></blockquote><h3>하느님께서는 의인이 죄의 용서를 위해 기도하기를 요구하십니다</h3><h4>욥</h4><blockquote><p>“이제 너희는 수소 일곱 마리와 수양 일곱 마리를 가지고 나의 종 욥에게로 가서 너희를 위하여 번제를 드려라. <strong>나의 종 욥이 너희를 위하여 기도를 드려 주리라. 그러면 그의 기도를 듣고</strong> 나는 너희를 크게 벌하지 않으리라. 너희는 내 이야기를 할 때 나의 종 욥처럼 솔직하지 못하였다.‘” (<a href="https://bibleox.com/ko/ko-ctb/iov/42/#L8">욥 42:8</a>)</p></blockquote><blockquote><p>“네가 마음에 걸릴 일을 하지 않은 줄은 나도 안다. 그러나 나에게 죄를 짓지 못하게 너를 지켜 준 이가 누군지 아느냐? 너로 하여금 그 여인을 건드리지 못하게 한 것은 바로 나다. 그러니 그 여인을 곧 남편에게 돌려 보내라. <strong>그 남편은 예언자다. 그가 너를 위하여 기도해 주어야 네가 죽지 않으리라. 만일 그 여인을 돌려 보내지 않으면 너는 물론 네 식구들도 다 죽으리라</strong>.‘” (<a href="https://bibleox.com/ko/ko-ctb/gen/20/#L6-7">창 20:6-7</a>)</p></blockquote><h4>예언자 모세</h4><p>예언자 모세는 하느님과 온 백성 사이의 중재자였습니다:</p><blockquote><p>“이제 내가 한 마디 충고할 터이니 들어 보게. 아무쪼록 하느님께서 자네를 도와 주시기 바라네. <strong>자네는 백성의 대변인이 되어</strong> 그들이 제시하는 소송을 하느님 앞에 내어 놓게.” (<a href="https://bibleox.com/ko/ko-ctb/ish/18/#L19">출 18:19</a>)</p></blockquote><p>모세의 청 덕분에 하느님께서는 백성의 죄를 용서하셨습니다:</p><blockquote><p>“하느님의 사랑은 그지없으시어 이 백성을 에집트에서 여기까지 이끌어 오시는 동안 참아 주시었습니다. 이번에도 이 백성의 죄를 용서해 주십시오.‘ 야훼께서 대답하셨다. ’<strong>내가 네 말대로 용서해 준다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/chis/14/#L19-20">민 14:19-20</a>)</p></blockquote><p>그러나 다른 때에 하느님께서는 모세의 말로도 용서하지 않으시겠다고 가리키십니다:</p><blockquote><p>“야훼께서 나에게 대답하셨다. ‘<strong>비록 모세나 사무엘이 내 앞에 서서 빌더라도, 나는 이 백성을 불쌍히 여기지 않으리라</strong>. 이 백성을 내 앞에서 쫓아 내어라!” (<a href="https://bibleox.com/ko/ko-ctb/ier/15/#L1">예레 15:1</a>)</p></blockquote><p>그는 결정을 바꾸시도록 하느님께 간청했습니다:</p><blockquote><p>“나를 말리지 말아라. <strong>내가 진노를 내려 저들을 모조리 쓸어 버리리라</strong>. 그리고 너에게서 큰 백성을 일으키리라.‘ <strong>모세는 그의 하느님 야훼의 노기를 풀어 드리려고 애원하였다</strong>. ’야훼여, 당신께서는 그 강하신 팔을 휘두르시어 놀라운 힘으로 당신의 백성을 에집트 땅에서 데려 내 오시지 않으셨습니까? 그런데 어찌하여 이 백성에게 이토록 화를 내시옵니까? 어찌하여 ‘아하, 그가 화를 내어 그 백성을 데려 내다가 산골짜기에서 죽여 없애 버리고 땅에 씨도 남기지 않았구나’ 하는 말을 에집트인들에게서 들으시려 하십니까? 제발 화를 내지 마시고 <strong>당신 백성에게 내리시려던 재앙을 거두어 주십시오</strong>. 당신의 명예를 걸고 ‘너의 후손을 하늘의 별처럼 많게 하고, 내가 약속한 이 땅을 다 너의 후손에게 주어 길이 유산으로 차지하게 하겠다’ 고 맹세해 주셨던 당신의 종 아브라함과 이사악과 이스라엘을 기억해 주십시오.‘ 이 말을 들으시고 <strong>야훼께서는 당신의 백성에게 내리시겠다던 재앙을 거두셨다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/ish/32/#L10-14">출 32:10-14</a>)</p></blockquote><p>그 뒤 다시 백성을 위해 전구하러 갔습니다:</p><blockquote><p>“이튿날 모세가 백성에게 일렀다. ‘<strong>너희가 이토록 잘못을 저질렀는데 그 잘못을 용서받을 수 있을지 나 이제 야훼께 올라 가 보아야겠다</strong>.’” (<a href="https://bibleox.com/ko/ko-ctb/ish/32/#L30">출 32:30</a>)</p></blockquote><p>그리고 다시 하느님의 결정을 바꾸었습니다:</p><blockquote><p>“야훼께서는 마치 친구끼리 말을 주고 받듯이 얼굴을 마주 대시고 모세와 말씀을 나누셨다. 모세가 진지로 돌아 온 뒤에도 모세의 젊은 시종인 눈의 아들 여호수아만은 장막을 떠나지 않았다. 모세가 야훼께 아뢰었다. ‘이제 당신께서는 저에게 이 백성을 이끌고 올라 가라고 하셨습니다. 하지만 당신의 파송을 받아 저와 갈 분이 누구신지 아직 가르쳐 주시지 않으셨습니다. 당신께서는 저에게 ’너는 잊을 수 없는 이름, 너는 내 눈에 든 사람‘ 이라고 하셨는데, &lt;…&gt; 모세가 야훼께 다짐하였다. ’<strong>만일 당신께서 함께 가시지 않으시려거든, 우리도 여기를 떠나 올라 가지 않게 하십시오</strong>. &lt;…&gt; 야훼께서 모세의 말을 받아 주셨다. ‘<strong>너야말로 과연 내 마음에 드는 자요, 잊을 수 없는 이름이다. 지금 네가 청한 것을 다 들어 주리라</strong>.’” (<a href="https://bibleox.com/ko/ko-ctb/ish/33/#L11-12,15,17">출 33:11-12,15,17</a>)</p></blockquote><h4>하느님의 사람</h4><blockquote><p>“이렇게 되자 왕은 하느님의 사람에게, 야훼 하느님께 은총을 빌어 자기 손이 다시 회복되도록 <strong>기도해 달라고 애걸하였다. 하느님의 사람이 야훼께 기도하자</strong> 왕의 손이 즉시 나아서 전과 같이 되었다.” (<a href="https://bibleox.com/ko/ko-ctb/3ts/13/#L6">열상 13:6</a>)</p></blockquote><h2>다른 사람들을 위한 사제직의 기도</h2><p>사제들이 다른 사람을 위해 기도함으로써(여기에 중재가 있습니다) 죄가 용서될 수 있습니다:</p><blockquote><p>“<strong>여러분 가운데 앓는 사람이 있으면 그 사람은 교회의 원로들을 청하십시오</strong>. 원로들은 주님의 이름으로 그에게 기름을 바르고 <strong>그를 위하여 기도해 주어야 합니다</strong>. 믿고 구하는 기도는 앓는 사람을 낫게 할 것이며 주님께서 그를 일으켜 주실 것입니다. 또 <strong>그가 지은 죄가 있으면 그 죄도 용서를 받을 것입니다</strong>. 그러므로 여러분은 서로 죄를 고백하고 서로 남을 위하여 기도하십시오. 그러면 모두 온전해질 것입니다. 올바른 사람의 간구는 큰 효과를 나타냅니다.” (<a href="https://bibleox.com/ko/ko-ctb/iak/5/#L14-16">야고 5:14-16</a>)</p></blockquote><h2>교회의 지체들이 서로를 위해 드리는 기도</h2><p>하느님께 드리는 개인 기도만으로 충분합니까?</p><h3>사도들에게는 자기를 위한 기도가 필요합니다</h3><blockquote><p>“그리고 <strong>우리를 위해서도 기도해 주십시오</strong>. 하느님께서 우리에게 당신의 말씀을 전할 수 있는 기회를 터 주셔서 그리스도의 심오한 진리를 전파할 수 있게 기도해 주십시오. 나는 이 진리를 위해서 지금 갇혀 있습니다.” (<a href="https://bibleox.com/ko/ko-ctb/kol/4/#L3">골로 4:3</a>)</p></blockquote><blockquote><p>“교우 여러분, <strong>우리를 위해서도 기도해 주십시오</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/1sol/5/#L25">1데살 5:25</a>)</p></blockquote><blockquote><p>“교우 여러분, 마지막으로 부탁합니다. <strong>우리를 위해서 기도해 주십시오</strong>. 주님의 말씀이 여러분 가운데 속히 퍼져서 찬양을 받은 것처럼 어디서나 그렇게 되도록 빌어 주십시오.” (<a href="https://bibleox.com/ko/ko-ctb/2sol/3/#L1">2데살 3:1</a>)</p></blockquote><blockquote><p>“<strong>우리를 위해서 기도해 주십시오</strong>. 우리는 무슨 일에나 정직하게 살려고 하므로 양심에 거리끼는 일은 하나도 없다고 확신하는 바입니다.” (<a href="https://bibleox.com/ko/ko-ctb/evr/13/#L18">히브 13:18</a>)</p></blockquote><blockquote><p>“형제 여러분, 나는 성령이 베푸시는 사랑을 믿고 우리 주 예수 그리스도의 이름으로 여러분에게 부탁합니다. 여러분도 <strong>나를 위하여 하느님께 간곡히 기도하여 주십시오</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/rim/15/#L30">로마 15:30</a>)</p></blockquote><blockquote><p>“하느님께서는 과연 그렇게 어려운 죽을 고비에서 우리를 건져 내 주셨고 앞으로도 건져 내 주실 것입니다. 이렇게 우리는 하느님께서 앞으로도 건져 내 주시리라는 희망을 가지고 있습니다. 여러분은 <strong>기도로써 우리를 도와 주십시오</strong>. 하느님께서 <strong>많은 사람의 기도를</strong> 들으시고 우리에게 축복을 내리실 것이며 그것을 보고 많은 사람이 하느님께 감사를 드리게 될 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/2kor/1/#L10-11">2고린 1:10-11</a>)</p></blockquote><blockquote><p>“내가 지금은 갇혀 있지만 그것이 마침내는 <strong>여러분의 기도와</strong> 예수 그리스도의 성령의 도우심으로 나에게 <strong>구원을 가져 오리라는 것을</strong> 알고 있기 때문입니다.” (<a href="https://bibleox.com/ko/ko-ctb/fil/1/#L19">필립 1:19</a>)</p></blockquote><blockquote><p>“내가 들 방도 하나 마련해 주시오. 하느님께서 <strong>여러분의 기도를 들으시고</strong> 나를 여러분에게 보내 주실 것을 나는 바라고 있습니다.” (<a href="https://bibleox.com/ko/ko-ctb/fm/1/#L22">필레 1:22</a>)</p></blockquote><h3>사도들은 늘 그리스도인들을 위해 기도합니다</h3><blockquote><p>“<strong>기도할 때마다 언제나 여러분을 기억하며</strong> 하느님께 감사를 드리고 있습니다.” (<a href="https://bibleox.com/ko/ko-ctb/ef/1/#L16">에페 1:16</a>)</p></blockquote><blockquote><p>“기도할 때마다 언제나 <strong>여러분 모두를 위해서 기쁜 마음으로 간구합니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/fil/1/#L4">필립 1:4</a>)</p></blockquote><blockquote><p>“우리는 언제나 여러분 모두를 생각하면서 하느님께 감사를 드립니다. 그리고, <strong>여러분을 위해서 기도할 때마다</strong>” (<a href="https://bibleox.com/ko/ko-ctb/1sol/1/#L2">1데살 1:2</a>)</p></blockquote><blockquote><p>“여러분의 동향인인 에바프라도 여러분에게 문안합니다. 그리스도 예수의 종인 에바프라는 여러분이 성숙한 사람으로 굳건히 서서 하느님의 뜻을 이루는 데 온전히 헌신할 수 있도록 <strong>언제나 열심히 기도하고 있습니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/kol/4/#L12">골로 4:12</a>)</p></blockquote><blockquote><p>“<strong>나는 밤낮으로 기도할 때마다 그대를 기억하면서</strong> 하느님께 감사드립니다. 나는 내 조상들과 마찬가지로 깨끗한 양심을 가지고 하느님을 섬깁니다.” (<a href="https://bibleox.com/ko/ko-ctb/2tim/1/#L3">2디모 1:3</a>)</p></blockquote><blockquote><p>“나는 <strong>기도할 때마다 그대를 생각하면서</strong> 언제나 하느님께 감사를 드리고 있습니다.” (<a href="https://bibleox.com/ko/ko-ctb/fm/1/#L4">필레 1:4</a>)</p></blockquote><h3>사도들은 그리스도인들에게 서로를 위해 기도하라고 불렀습니다</h3><blockquote><p>“그러므로 여러분은 서로 죄를 고백하고 <strong>서로 남을 위하여 기도하십시오</strong>. 그러면 모두 온전해질 것입니다. 올바른 사람의 간구는 큰 효과를 나타냅니다.” (<a href="https://bibleox.com/ko/ko-ctb/iak/5/#L16">야고 5:16</a>)</p></blockquote><blockquote><p>“여러분은 또한 언제나 기도하며 하느님의 도우심을 청하십시오. 모든 경우에 성령의 도움을 받아 기도하십시오. 늘 깨어서 꾸준히 기도하며 <strong>모든 성도들을 위하여 간구하십시오</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/ef/6/#L18">에페 6:18</a>)</p></blockquote><blockquote><p>“나는 무엇보다도 먼저 <strong>모든 사람을 위해서</strong> 간구와 기원과 간청과 감사의 <strong>기도를 드리라고</strong> 권하는 바입니다.” (<a href="https://bibleox.com/ko/ko-ctb/1tim/2/#L1">1디모 2:1</a>)</p></blockquote><h2>온 교회는 소통하고 돌보는 그리스도의 하나인 몸입니다</h2><h3>교회는 그리스도의 몸입니다</h3><blockquote><p>“<strong>여러분은 다 함께 그리스도의 몸을 이루고</strong> 있으며 한 사람 한 사람은 그 지체가 되어 있습니다.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/12/#L27">1고린 12:27</a>)</p></blockquote><blockquote><p>“<strong>여러분의 몸이 그리스도의 지체</strong>라는 것을 알지 못합니까? 그런데 그리스도의 몸의 한 부분을 떼어서 창녀의 몸의 지체로 만들어서야 되겠습니까? 절대로 그럴 수 없습니다.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/6/#L15">1고린 6:15</a>)</p></blockquote><h3>교회의 지체들은 하느님께 참여합니다</h3><blockquote><p>“그리스도께서는 당신이 가지신 하느님의 능력으로 우리에게 경건한 생활을 하는 데 필요한 모든 것을 주셨습니다. 그래서 우리를 부르셔서 당신의 영광과 능력을 누리게 하신 그분을 알게 해 주셨습니다. 우리는 그 영광과 능력을 힘입어 귀중하고 가장 훌륭한 약속을 받았습니다. 여러분은 그 덕분으로 정욕에서 나오는 이 세상의 부패에서 멀리 떠나 <strong>하느님의 본성을 나누어 받게 되었습니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/2pet/1/#L3-4">2베드 1:3-4</a>)</p></blockquote><h3>몸의 모든 지체는 서로 돌봅니다</h3><blockquote><p>“이것은 몸 안에 분열이 생기지 않고 모든 지체가 서로 도와 나가도록 하시려는 것입니다. <strong>한 지체가 고통을 당하면 다른 모든 지체도 함께 아파하지 않겠습니까</strong>? 또 <strong>한 지체가 영광스럽게 되면 다른 모든 지체도 함께 기뻐하지 않겠습니까</strong>?” (<a href="https://bibleox.com/ko/ko-ctb/1kor/12/#L25-26">1고린 12:25-26</a>)</p></blockquote><h3>사도들은 늘 교회를 위해 기도합니다</h3><blockquote><p>“우리는 그 소식을 들은 날부터 여러분을 위하여 <strong>끊임없이 하느님께 기도해 왔습니다</strong>. 우리는 여러분이 성령께서 주시는 모든 지혜와 판단력으로 하느님의 뜻을 충분히 깨닫게 되기를 빌어 왔습니다.” (<a href="https://bibleox.com/ko/ko-ctb/kol/1/#L9">골로 1:9</a>)</p></blockquote><h2>지상 교회와 천상 교회의 일치</h2><h3>우리는 이미 천상 교회에 와 있습니다</h3><p>부활 뒤 미래가 아니라 이미 지금입니다:</p><blockquote><p>“그러나 <strong>여러분이 와 있는 곳은</strong> 시온산이고 살아 계신 하느님의 도성이며 하늘의 예루살렘입니다. 거기에는 수많은 천사들이 있고, 잔치가 벌어져 있고 또 하늘에 등록된 장자들의 교회가 있고 만민의 심판자이신 하느님이 계시고 <strong>완전히 올바른 사람들의 영혼</strong>이 있습니다. 그리고 새로운 계약의 중재자이신 예수가 게시고 아벨의 피보다도 더 큰 힘을 발휘하는 속죄의 피가 있습니다.” (<a href="https://bibleox.com/ko/ko-ctb/evr/12/#L22-24">히브 12:22-24</a>)</p></blockquote><h3>분열이 없고, 모두가 서로 돌보고 함께 느낍니다</h3><blockquote><p>“그래서 한 몸에 많은 지체가 있는 것입니다. &lt;…&gt; 그러나 보기 좋은 지체들에게는 그렇게 할 필요가 없습니다. 이렇게 하느님께서도 변변치 못한 부분을 더 귀중하게 여겨 주셔서 몸의 조화를 이루게 해 주셨습니다. 이것은 <strong>몸 안에 분열이 생기지 않고 모든 지체가 서로 도와 나가도록</strong> 하시려는 것입니다. 한 지체가 고통을 당하면 다른 <strong>모든 지체도</strong> 함께 아파하지 않겠습니까? 또 한 지체가 영광스럽게 되면 다른 <strong>모든 지체도</strong> 함께 기뻐하지 않겠습니까?” (<a href="https://bibleox.com/ko/ko-ctb/1kor/12/#L20,24-26">1고린 12:20,24-26</a>)</p></blockquote><blockquote><p>“잘 들어 두어라. 이와 같이 회개할 것 없는 의인 아흔 아홉보다 <strong>죄인 한 사람이 회개하는 것을 하늘에서는 더 기뻐할 것이다</strong>.‘ &lt;…&gt; 잘 들어 두어라. 이와 같이 <strong>죄인 하나가 회개하면 하느님의 천사들이 기뻐할 것이다</strong>.’” (<a href="https://bibleox.com/ko/ko-ctb/lk/15/#L7,10">루가 15:7,10</a>)</p></blockquote><h3>하늘과 땅의 것이 그리스도 안에서 하나가 됩니다</h3><blockquote><p>“우리 주 예수 그리스도의 아버지 하느님께 찬양을 드립니다. 하느님께서는 그리스도를 통해서 하늘의 온갖 영적 축복을 우리에게 베풀어 주셨습니다. &lt;…&gt; 당신의 심오한 뜻을 알게 해 주셨습니다. 이것은 그리스도를 시켜 이루시려고 하느님께서 미리 세워 놓으셨던 계획대로 된 것으로서 <strong>때가 차면</strong> 이 계획이 이루어져서 <strong>하늘과 땅에 있는 모든 것이 그리스도를 머리로 하고 하나가 될 것입니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/ef/1/#L3,9-10">에페 1:3,9-10</a>)</p></blockquote><blockquote><p>“나는 <strong>하늘과 땅에 있는 모든 가족</strong>에게 이름을 주신 하느님 아버지 앞에 무릎을 꿇고 기도드립니다.” (<a href="https://bibleox.com/ko/ko-ctb/ef/3/#L14">에페 3:14</a>)</p></blockquote><blockquote><p>“그리스도는 또한 당신의 몸인 교회의 머리이십니다. 그분은 모든 것의 시작이시고 죽은 자들 가운데서 살아나신 최초의 분이시며 만물의 으뜸이 되셨습니다. 하느님께서는 <strong>당신의 완전한 본질을 그리스도에게 기꺼이 주시고</strong> 그리스도를 내세워 <strong>하늘과 땅의 만물을 당신과 화해시켜</strong> 주셨습니다. 곧 십자가에서 흘리신 예수의 피로써 평화를 이룩하셨습니다.” (<a href="https://bibleox.com/ko/ko-ctb/kol/1/#L18-20">골로 1:18-20</a>)</p></blockquote><blockquote><p>“<strong>그리스도께서는</strong> <strong>죽은 자의 주님도 되시고 산 자의 주님도</strong> 되시기 위해서 죽으셨다가 다시 살아 나셨습니다.” (<a href="https://bibleox.com/ko/ko-ctb/rim/14/#L9">로마 14:9</a>)</p></blockquote><p>함께 보기: <a href="https://bibleox.com/ru/ru/w/Церковь">교회: 지상 교회와 천상 교회의 일치</a>.</p><h2>성인들은 하늘에서 하느님께 기도합니다</h2><h3>성인들의 기도는 하느님 마음에 듭니다</h3><blockquote><p>“그 어린 양이 두루마리를 받아 들자 네 생물과 스물 네 원로는 각각 거문고와 <strong>향이 가득 담긴 금대접을</strong> 가지고 어린 양 앞에 엎드렸습니다. <strong>그 향은 곧 성도들의 기도입니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/otkr/5/#L8">묵시 5:8</a>)</p></blockquote><blockquote><p>“다른 천사 하나가 금향로를 들고 제단 앞에 와 섰습니다. 그 천사는 <strong>모든 성도들의 기도를</strong> 향에 섞어서 옥좌 앞에 있는 황금제단에 드리려고 많은 향을 받아 들었습니다.” (<a href="https://bibleox.com/ko/ko-ctb/otkr/8/#L3">묵시 8:3</a>)</p></blockquote><blockquote><p>“이런 일이 있은 뒤에 <strong>큰 군중이 우렁차게 외치는 듯한 음성이 하늘에서 들려 왔습니다. ‘할렐루야! 구원과 영광과 권세가 우리 하느님의 것이다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/otkr/19/#L1">묵시 19:1</a>)</p></blockquote><p>그들은 지상에서 일어나는 일을 압니다:</p><blockquote><p>“어린 양이 다섯째 봉인을 떼셨을 때에 나는 <strong>하느님의 말씀 때문에 그리고 그 말씀을 증언했기 때문에 죽임을 당한 사람들의 영혼</strong>이 제단 아래 자리잡고 있는 것을 보았습니다. 그들은 큰 소리로 ‘<strong>거룩하시고 진실하신 대왕님, 우리가 얼마나 더 오래 기다려야 땅 위에 사는 자들을 심판하시고 또 우리가 흘린 피의 원수를 갚아 주시겠습니까</strong>?’하고 부르짖었습니다. 또 그들은 흰 두루마기 한 벌씩을 받았습니다. 그리고 그들처럼 죽임을 당하기로 되어 있는 동료 종들과 형제들이 다 죽어서 그 수가 찰 때까지 잠시 쉬라는 분부를 받았습니다.” (<a href="https://bibleox.com/ko/ko-ctb/otkr/6/#L9-11">묵시 6:9-11</a>)</p></blockquote><h3>성인들은 더 나쁜 상태가 아니라 더 좋은 상태로 옮아갑니다</h3><blockquote><p>“나는 그 둘 사이에 끼어 있으나 마음 같아서는 <strong><mark>이 세상을 떠나서 그리스도와 함께 살고 싶습니다. 또 그 편이 훨씬 낫겠습니다</mark></strong>. 그러나 여러분을 위해서는 내가 이 세상에 더 살아 있어야 하겠습니다.” (<a href="https://bibleox.com/ko/ko-ctb/fil/1/#L23-24">필립 1:23-24</a>)</p></blockquote><h3>몸에서 떠난 뒤에도 성인들은 소통할 능력을 잃지 않습니다</h3><p>타보르산에서 구세주께서 변모하실 때 사도들은 이미 죽은 예언자 모세가 나타나 그리스도와 앞으로 받으실 십자가 고난에 관해 이야기하는 것을 봅니다. 곧 예언자는 죽었지만(<a href="https://bibleox.com/ko/ko-ctb/vtor/34/#L7">신 34:7</a>; <a href="https://bibleox.com/ko/ko-ctb/nav/1/#L2">여호 1:2</a>) 사라지지도 의식을 잃지도 않았고, 그리스도와 <strong>소통합니다</strong>:</p><blockquote><p>“그리고 난데없이 <strong>모세와 엘리야가 나타나서 예수와 함께 이야기하고 있었다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/mf/17/#L3">마태 17:3</a>)</p></blockquote><blockquote><p>“예수께서 기도하시는 동안에 그 모습이 변하고 옷이 눈부시게 빛났다. 그러자 난데없이 <strong>두 사람이 나타나 예수와 함께 이야기하고 있었다. 그들은 모세와 엘리야였다</strong>. 영광에 싸여 나타난 그들은 예수께서 멀지 않아 예루살렘에서 이루시려고 하시는 일 곧 그의 죽음에 관하여 예수와 함께 <strong>이야기를 나누고 있었다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/lk/9/#L29-31">루가 9:29-31</a>)</p></blockquote><h3>사랑은 언제나 남을 돌보도록 움직입니다</h3><blockquote><p>“<strong><mark>사랑은 가실 줄을 모릅니다</mark></strong>. 말씀을 받아 전하는 특권도 사라지고 이상한 언어를 말하는 능력도 끊어지고 지식도 사라질 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/13/#L8">1고린 13:8</a>)</p></blockquote><h2>비판</h2><h3>한 분이신 중재자</h3><h4>짧은 답변</h4><p>정교인들은 성인들에게 드리는 기도 때문에 그리스도만이 유일한 중재자라는 비난을 받습니다. 답변은 이렇습니다. 그리스도께서는 사람들을 구속하신 유일한 중재자이시며, 구절은 이어서 그렇게 말합니다:</p><blockquote><p>“하느님은 한 분뿐이시고 <strong><mark>하느님과 사람 사이의 중재자도 한 분뿐이신데 그분이 바로 사람으로 오셨던 그리스도 예수이십니다</mark></strong>. 그분은 <strong><mark>자기 자신을 모든 사람을 위한 대속물로 바치셨습니다</mark></strong>. 이렇게 해서 하느님의 뜻을 적절한 시기에 분명히 나타내 주셨습니다.” (<a href="https://bibleox.com/ko/ko-ctb/1tim/2/#L5-6">1디모 2:5-6</a>)</p></blockquote><p>성인들은 구속자가 아니라 함께 기도해 주는 이들입니다(<a href="https://bibleox.com/ko/ko-ctb/iak/5/#L16">야고 5:16</a>). 문제는 뜻에 있습니다. 우리의 반대자들(대체로 개신교인)은 서로의 필요를 위해 기도합니다. 그들이 서로에게 중재자라면 성인들도 우리의 중재자입니다. 그들이 서로를 위해 함께 기도해 주는 이들이라면 성인들도 그렇습니다. 우리는 그저 우리를 위해 기도해 달라고, 하느님께 드리는 기도에 함께해 달라고 청할 뿐입니다. 우리는 그들을 신으로 여기지 않고 신에게 하듯 기도하지 않습니다. 개신교인들도 자기를 위해 기도해 달라고 청할 때 동료들을 신으로 여기지 않습니다.</p><p>기도에 중재자가 있을 수 있습니까? 성경을 보면 있을 수 있습니다. 예를 들어 교회 원로들의 기도를 통해 다른 사람의 죄가 용서될 수 있습니다.</p><blockquote><p>“여러분 가운데 앓는 사람이 있으면 그 사람은 <strong><mark>교회의 원로들을 청하십시오</mark></strong>. 원로들은 주님의 이름으로 그에게 기름을 바르고 <strong><mark>그를 위하여 기도해 주어야 합니다</mark></strong>. 믿고 구하는 기도는 앓는 사람을 낫게 할 것이며 <strong>주님께서 그를 일으켜 주실 것입니다</strong>. 또 <strong><mark>그가 지은 죄가 있으면 그 죄도 용서를 받을 것입니다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/iak/5/#L14-15">야고 5:14-15</a>)</p></blockquote><p>분명한 전구입니다. 그러므로 성인들에게 드리는 기도의 반대자들이 내놓는, 그리스도께서 유일한 중재자이시라는 말씀의 이해(<a href="https://bibleox.com/ko/ko-ctb/1tim/2/#L5-6">1디모 2:5-6</a>)는 옳지 않습니다. 이 구절은 기도의 중재자를 반대하지 않습니다.</p><h4>“중재자”라는 말에 관하여 더</h4><p>번역의 세부 사항도 있습니다. “중재자”는 그리스어 μεσίτης의 번역입니다. 이 말은 “화해시키는 이”, 곧 양쪽의 화해를 돕는 사람으로 옮길 수 있습니다. 곧 그리스도께서는 하느님과 사람 사이의 유일한 <strong>화해자</strong>이십니다. 사도들은 다른 곳에서 이를 더 분명히 말합니다:</p><blockquote><p>“이것은 모두 다 하느님께로부터 왔습니다. <strong><mark>하느님께서는 그리스도를 내세워 우리를 당신과 화해하게 해 주셨고</mark></strong> 또 <strong>사람들을 당신과 화해시키는 임무</strong>를 우리에게 주셨습니다. 곧 <strong><mark>하느님께서는 인간의 죄를 묻지 않으시고 그리스도를 내세워 인간과 화해하셨습니다</mark></strong>. 그리고 <strong>이 화해의 이치를 우리에게 맡겨</strong> 전하게 하셨습니다.” (<a href="https://bibleox.com/ko/ko-ctb/2kor/5/#L18-19">2고린 5:18-19</a>)</p></blockquote><blockquote><p>“나는 믿음의 자녀인 여러분이 죄를 짓지 않게 하려고 여러분에게 이 편지를 씁니다. 그러나 <strong><mark>혹 누가 죄를 짓더라도 아버지 앞에서 우리를 변호해 주시는 분이 계십니다</mark></strong>. 그분은 의로우신 예수 그리스도이십니다. 그분은 <strong><mark>우리의 죄를 용서해 주시려고 친히 제물이 되셨습니다</mark></strong>. 우리의 죄뿐만 아니라 온 세상의 죄를 용서해 주시려고 제물이 되신 것입니다. &lt;…&gt; 사랑하는 자녀들이여, <strong><mark>여러분의 죄가 그리스도를 통하여 용서를 받았기</mark></strong> 때문에 나는 이 편지를 씁니다.” (<a href="https://bibleox.com/ko/ko-ctb/1in/2/#L1-2,12">1요한 2:1-2,12</a>)</p></blockquote><p>“중재자”를 <strong>화해자</strong>로 옮기는 것은 앞서 가리킨 문장의 끝과도 맞습니다. “자기 자신을 모든 사람을 위한 대속물로 바치셨습니다”(<a href="https://bibleox.com/ko/ko-ctb/1tim/2/#L5-6">1디모 2:5-6</a>). 곧 자신을 제물로 바쳐 인류의 죄를 하느님 앞에서 속량하신 화해자이십니다. 그러므로 이 구절은 성인들에게 드리는 기도를 반대하지 않고, 인류와 하느님의 <strong>화해자</strong>이신 그리스도를 말합니다. 그리스도께서는 사람들 서로의 <strong>화해자</strong>이시기도 합니다(<a href="https://bibleox.com/ko/ko-ctb/ef/2/#L14">에페 2:14</a>).</p><h3>“저희를 구원하소서”라는 표현에 관하여</h3><p>정교인들은 성인에게 드리는 기도에서 “저희를 구원하소서”라는 표현을 쓴다고 비난을 받습니다. 여기서도 문제는 뜻에 있습니다. 구원은 그리스도께서 단번에 이루셨습니다. 이런 뜻의 구원자는 다른 이가 없습니다. 그러나 많은 이가 어떤 사람의 개인적 구원을 도울 수 있습니다. 성경에도 그런 표현이 자주 나옵니다:</p><h4>사도가 구원합니다</h4><blockquote><p>“나는 내 동족 유다인들에게 시기심을 불러 일으켜 그들 가운데 <strong><mark>일부나마 구해 주고 싶습니다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/rim/11/#L14">로마 11:14</a>)</p></blockquote><blockquote><p>“그리고 내가 믿음이 약한 사람들을 대할 때에는 그들을 얻으려고 약한 사람이 되었습니다. 이와 같이 내가 어떤 사람을 대하든지 그들처럼 된 것은 <strong><mark>어떻게 해서든지 그들 중에서 다만 몇 사람이라도 구원하려고</mark></strong> 한 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/9/#L22">1고린 9:22</a>)</p></blockquote><h4>아내가 구원합니다</h4><blockquote><p>“<strong><mark>여자 교우가 자기 남편을 구원할 수 있을지도</mark></strong> 모를 일이며 또 <strong><mark>남자 교우가 자기 아내를 구원할 수 있을지도</mark></strong> 모를 일입니다.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/7/#L16">1고린 7:16</a>)</p></blockquote><h4>다른 사람들을 구원하라는 사도의 부름</h4><blockquote><p>“의심을 품는 사람들을 동정해 주고 죄악의 불구덩이에 빠진 사람들을 끌어 내어 <strong><mark>구해 주십시오</mark></strong>. 또 본능적인 욕정에 빠진 사람들에 대해서는 욕정으로 더럽혀진 그들의 속옷까지도 미워하되 조심스럽게 자비를 베푸십시오.” (<a href="https://bibleox.com/ko/ko-ctb/iud/1/#L22-23">유다 1:22-23</a>)</p></blockquote><blockquote><p>“그대 자신을 조심하고 그대의 가르침의 내용을 잘 살피시오. 이렇게 꾸준히 일을 해 나가면 그대 자신을 구원할 뿐아니라 그대의 말을 듣는 사람들을 모두 <strong><mark>구원할 수 있을 것입니다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/1tim/4/#L16">1디모 4:16</a>)</p></blockquote><h4>그리스도 외에 누가 실제로 구원할 수 있습니까?</h4><p>사도도 아내와 남편도 주 예수 그리스도께서 구세주이신 뜻, 곧 인류의 유일한 구속자이자 죽음과 지옥에서 건지시는 분이며 부활과 하느님과 함께하는 영원한 삶을 주시는 분이라는 뜻의 구원자가 아닙니다. 그러나 보다시피 사도들은 “구원하겠다”는 표현을 씁니다. 우리는 이런 표현의 뜻을 바르게 이해합니다. 사람들은 구원을 도울 수 있습니다:</p><blockquote><p>“우리는 하느님을 위해서 <strong>함께 일하는 일꾼들</strong>이고 여러분은 하느님의 밭이며 하느님의 건물입니다.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/3/#L9">1고린 3:9</a>)</p></blockquote><h3>“자비를 베푸소서”라는 표현에 관하여</h3><p>여기서도 “구원하다”는 말과 상황이 같습니다(위 참조). 이런 말은 성인들만이 아니라 평범한 사람들에게도 합니다. 자비를 베푼다는 것은 불쌍히 여긴다는 뜻입니다. 예를 들어 의로운 욥은 벗들에게 말합니다:</p><blockquote><p>“<strong>벗들이여, 불쌍하고 가련하지 아니한가</strong>? 하느님의 손이 나를 치셨는데” (<a href="https://bibleox.com/ko/ko-ctb/iov/19/#L21">욥 19:21</a>) <em>(히브리어: “나를 불쌍히 여기게, 불쌍히 여기게, 벗들이여”)</em></p></blockquote><h3>성인들은 어떻게 온 세상의 기도를 들을 수 있습니까?</h3><p>성인들에게 드리는 기도의 반대자들은 말합니다. “하느님은 어디에나 계시고 전능하시지만, 성인들에게 그런 속성이 없다면 어떻게 지구 곳곳의 수많은 사람들의 기도를 들을 수 있는가?”</p><h4>성인들은 자기 힘이 아니라 하느님의 힘으로 예언하고 기적을 행했습니다</h4><p>성인들은 하느님과 따로 떼어 생각하지 않습니다. 하느님의 힘은 그들이 지상에서 몸으로 살 때에도 그들 안에 머물렀고, 하늘로 옮아가 그리스도와 함께 살게 된 뒤에는 더욱 그러합니다. 예언자 하가보는 모든 것을 아는 이가 아니었지만 온 세상의 기근을 알렸습니다(<a href="https://bibleox.com/ko/ko-ctb/act/11/#L28">사도 11:28</a>). 사도 베드로는 전능하지 않았지만 다비타를 살렸습니다(<a href="https://bibleox.com/ko/ko-ctb/act/9/#L40">사도 9:40</a>). 자기 힘이 아니라 하느님의 힘으로 그렇게 했습니다.</p><p>성인들은 사도의 말대로 더 나쁜 상태가 아니라 비교할 수 없이 더 좋은 상태로 옮아갑니다(<a href="https://bibleox.com/ko/ko-ctb/fil/1/#L23-24">필립 1:23-24</a>). 잃는 것이 아니라 얻습니다(<a href="https://bibleox.com/ko/ko-ctb/fil/1/#L21">필립 1:21</a>). 그들은 하느님과 결합되어 그분의 빛과 은총 안에 있습니다. 그들의 존재를 우리 존재와 비교할 수 없습니다. 그들은 지상의 일을 압니다(<a href="https://bibleox.com/ko/ko-ctb/otkr/6/#L10">묵시 6:10</a>). 사도들은 몸으로 이 세상에 있을 때에도 영으로 그리스도인들과 함께 있다고 씁니다:</p><h4>사도는 공동체의 상태를 몸이 아니라 영으로 압니다</h4><blockquote><p>“내가 비록 <strong>몸으로는 여러분과 멀리 떨어져 있지만 마음으로는 여러분과 항상 함께 있습니다</strong>. 그리고 여러분의 교회에 질서가 바로 잡히고 또 여러분이 그리스도를 견실하게 믿는다는 것을 <strong>알고 기뻐하고 있습니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/kol/2/#L5">골로 2:5</a>)</p></blockquote><blockquote><p>“나는 <strong>몸은 비록 멀리 떨어져 있지만 마음으로는 여러분과 함께 있습니다</strong>. 그래서 <strong>내가 여러분과 함께 있는 것과 다름없이</strong> 그런 짓을 한 자를 우리 주 예수의 이름으로 <strong>이미 단죄하였습니다</strong>. 그 때에 한 자리에 모인 여러분과 나의 마음이 우리와 함께 계신 우리 주 예수의 권능으로 그런 자를 사탄에게 내어 주어 그 육체를 멸망시키도록 판결한 것입니다. 그것은 주님의 날에 그의 영혼은 구원을 받도록 하려는 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/5/#L3-5">1고린 5:3-5</a>)</p></blockquote><h4>구원받는 이들에게는 수호천사가 있습니다</h4><p>기록된 대로 천사들은 구원받는 이들을 섬기도록 파견됩니다:</p><blockquote><p>“<strong>천사들은 모두 하느님을 섬기는 영적인 존재들로서 결국은 구원의 유산을 받을 사람들을 섬기라고 파견된 일꾼들이 아닙니까</strong>?” (<a href="https://bibleox.com/ko/ko-ctb/evr/1/#L14">히브 1:14</a>)</p></blockquote><p>또 천사들은 하느님의 얼굴을 뵙습니다(<a href="https://bibleox.com/ko/ko-ctb/mf/18/#L10">마태 18:10</a>). 그들만으로도 우리의 기도를 전할 수 있습니다. 우리는 거룩한 사람들만이 아니라 거룩한 천사들에게도 기도합니다. 우리를 위해 기도해 달라고 청하고, 그들의 수고와 돌봄에 감사합니다.</p><p>지상 교회와 천상 교회의 친교를 반대하는 이들은 우리를 섬기도록 파견된 수호천사에게 감사하는 것조차 허락하지 않습니다. 수호천사는 우리 말을 듣기 위해 어디에나 있거나 전능할 필요가 없는데도 말입니다.</p><p>그러므로 교회는 성인들이 하느님의 빛과 은총 안에 머물기 때문에 우리 기도를 듣는다고 믿습니다. 하느님과의 결합이 그들에게 이 능력을 줍니다. 하느님께서 친히 이 능력을 주십니다. 아주 쉽게 말해 성인들은 자기 능력이 아니라 하느님과 그분의 능력 덕분에 기도를 듣습니다.</p><h3>교회는 누가 성인인지 어떻게 압니까? 사람이 하느님 대신 결정하는 것이 아닙니까?</h3><p>사람이 하느님 대신 결정하지 않습니다. 하느님께서는 약속대로(<a href="https://bibleox.com/ru/ru/w/почитание-святых-в-Библии">인용문</a>) 친히 당신의 성인들을 영광스럽게 하시고, 기적을 나타내시고, 그들의 기도를 들으십니다. 교회는 이를 증언하고, 혼란이 없도록 백성의 성인 공경을 질서 있게 정리할 뿐입니다. 사도도 그렇게 명했습니다:</p><blockquote><p>“다만 나는 여러분이 <strong>모든 일에 점잖게 또 질서있게 처리해 주시기를</strong> 바랄 뿐입니다.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/14/#L40">1고린 14:40</a>)</p></blockquote><blockquote><p>“그런데 여러분 가운데는 <strong>게으른 생활을 하며</strong> 아무 일도 하지 않고 남의 일에만 참견하는 사람이 있다는 말이 들립니다.” (<a href="https://bibleox.com/ko/ko-ctb/2sol/3/#L11">2데살 3:11</a>) <em>(그리스어 ἀτάκτως는 “무질서하게”라는 뜻입니다.)</em></p></blockquote><p>교회가 의인의 거룩함을 증언하고 공경의 질서를 세우는 일(시성)은 대체로 의인이 죽은 뒤 오랜 시간이 지나서 이루어집니다. 그래야 이 문제를 살필 때 의인의 지상 생활만이 아니라 그가 하늘로 옮아가 하느님과 함께 살게 된 뒤에 하느님께서 그에 관해 드러내신 것도 볼 수 있습니다.</p><p>교회의 지체들에게서 의인의 무덤에서 일어난 기적과 치유, 의인의 기도의 도움에 관한 증언을 모읍니다[2]. 그의 삶과 신앙의 순수함을 꼼꼼히 살핍니다. 그런 다음 교회는 모은 자료를 공의회적으로 검토하여 의인을 성인으로 공경하는 것을 승인할 수 있으며, 교회 본문과 이콘을 만들고 기념일을 정합니다. 이것은 부분적으로 교회 백성 사이에 이미 있는 공경을 질서 있게 정리하고, 그 공경이 옳음을 가리키며, 예배에 포함하는 일입니다.</p><p>그러나 성경과 교회의 성전에서 나오는 많은 의인의 거룩함은 증언할 필요가 없습니다. 잘 알려진 성인 가운데에는 의심할 바 없이 <a href="https://bibleox.com/ru/ru/w/Богородица">하느님의 어머니 동정 마리아</a>(하느님께서 큰 일을 해 주신 분, <a href="https://bibleox.com/ko/ko-ctb/lk/1/#L49">루가 1:49</a>), 선조들, 예언자들, 사도들, 그들이 세운 주교와 사제와 보제들(예를 들어 보제이자 첫 순교자 스테파노, <a href="https://bibleox.com/ko/ko-ctb/act/7/#L55-60">사도 7:55-60</a>), 수많은 순교자들이 있습니다. 또 교회는 거룩한 사람들만이 아니라 천사들, 곧 대천사 미카엘과 가브리엘과 다른 많은 천사들, <a href="https://bibleox.com/ru/ru/w/ангел-хранитель">수호천사</a>에게도 기도합니다. 천사들은 하느님의 알려진 종이므로 그들의 거룩함을 증언할 필요가 없습니다.</p><h2>중요한 참고 사항</h2><p>성인들에게 드리는 기도를 변호하기 전에 핵심을 분명히 알아야 합니다. 반대자들의 설명에는 금지의 긍정적인 부분이 없습니다. 그들의 논증의 기초는 “성경에 그런 말이 없다”는 한마디입니다. 이것은 설명의 부정적인 부분이고, 그들은 이를 고집할 것입니다. 긍정적인 부분, 곧 왜 금지되는지에 대한 분명한 이해가 없습니다.</p><p>재림교인들은 사람의 몸이 죽은 뒤 영혼이 산다는 것을 믿지 않으므로 부분적으로 이해를 내놓을 수 있습니다. 그러나 재림교인들도 천사의 존재는 (아직) 부정하지 않으므로 천사에게 드리는 기도의 금지는 설명하지 못합니다. 성경에 따르면 천사들은 구원받는 이들에게 배정되어 사람의 구원을 돌봅니다(<a href="https://bibleox.com/ko/ko-ctb/evr/1/#L14">히브 1:14</a>). 왜 그들에게 아무 말도 할 수 없습니까? 그들은 이를 설명하지 못합니다.</p><p>다른 (신)개신교인들은 대부분 몸에서 떠난 뒤 영혼이 산다고 믿으며, 우리가 이미 지금 와 있는 천상 교회(<a href="https://bibleox.com/ko/ko-ctb/evr/12/#L22-23">히브 12:22-23</a>)와 왜 소통하면 안 되는지, 왜 족장과 사도와 순교자와 천사와 이야기하면 안 되는지 전혀 설명하지 못합니다. 물론 무언가를 내놓으려 하겠지만 언제나 설득력이 없을 것입니다. 예를 들어 성인들이 하느님의 안식에 들어갔으므로 지상의 일에 더 이상 신경 쓰지 않는다고 말할 것입니다. 그러나 그러면 같은 안식에 계신 하느님께서도 지상의 일에 신경 쓰지 않으신다는 결론이 나옵니다. 다른 설명 시도도 똑같이 불합리합니다.</p><p>성인들에게 기도해야 한다는 것은 성경에서 암묵적으로(단계적으로) 도출됩니다. 곧 드러나게 가리켜진 것이 아니라 함축되어 있습니다. 이것은 정상입니다. 성경에 모든 것이 직접 말해져 있지는 않기 때문입니다. 삼위일체 하느님에 관한 가장 중요한 가르침도 성경에서 암묵적으로 도출됩니다. 우리의 반대자들도 성경에서 많은 것을 암묵적으로 도출합니다. 예를 들어 유아에게 세례를 주면 안 된다는 말은 어디에도 없지만 그들은 근거 없이 그렇게 주장하며, 성경에 그런 말이 없어도 개의치 않습니다. 그들은 이 금지를 성경의 다른 진술에서 암묵적으로 도출하려 합니다. 그러므로 그들을 이 영역으로 이끌어, 성인들에게 기도하는 것을 금하는 이유를 이해할 수 있게 설명해 달라고 청하는 것이 매우 중요합니다.</p><p>벗이여, 또 기억하십시오. 성인들에게 드리는 기도의 반대자들은 전구 기도를 반대하는 것이 전혀 아닙니다(그들이 서로를 위해 기도할 때 서로에게 중재자임은 쉽게 증명됩니다. 아무리 반박해도 그렇습니다). 그들이 가장 반대하는 것은 <strong>지상 교회와 천상 교회의 친교</strong>, 곧 거룩한 영들, 거룩한 천사들과 거룩한 사람들, 하느님의 벗들과의 모든 친교입니다. 마치 지상 교회가 천상 교회에 토라져 말하기 싫어하는 듯하고, 그리스도의 몸의 한 부분이 같은 몸의 다른 부분과 소통하기를 원하지 않는 듯합니다. 그들은 한마디도 허락하지 못합니다. 우리를 돌보는 수호천사에게 감사하는 것조차 허락하지 않습니다. 영적 세계의 성인들과의 소통을 조금이라도 인정하면, 단계적으로 지상 교회와 천상 교회의 친교에 속하는 다른 모든 것도 인정할 수밖에 없기 때문입니다. 그러므로 질문 가운데 하나로, 성경에 매우 널리 나오는 천사와의 소통 가능성을 살펴볼 만합니다.</p>'
