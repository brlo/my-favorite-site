    title: 성인들에게 드리는 기도
    priority: 6
  references: '<ol><li><p>카르타고의 성 치프리아노 순교자(200년경~258년): “<em>우리는 서로 마음을 합하여 기억합시다. </em><strong><em>양쪽에서 언제나 서로를 위해 기도합시다</em></strong><em>. 서로의 사랑으로 짐과 고난을 덜어 줍시다. </em><strong><em>우리 가운데 누가 하느님의 빠른 은혜로 먼저 이곳을 떠나더라도, 우리의 사랑은 주님 앞에서 이어지고 형제자매를 위한 기도는 그치지 않기를 바랍니다</em></strong><em>. 아버지의 자비 앞에서 말입니다</em>” (<a href="https://bibleox.com/en/en/w/cyprian-the-epistles-of-cyprian-2/">유배 중인 코르넬리오에게 그의 신앙 고백에 관하여 보낸 편지</a>, 영어)</p></li><li><p>유해의 썩지 않음이 의인을 성인으로 시성하는 필수 표지는 아닙니다. 많은 성인의 유해는 썩습니다. 그러나 어떤 의인들의 거룩한 유해는 흙이 되지 않을 뿐 아니라 향기를 내기도 하며, 이는 하느님의 기적으로 여겨집니다. 예를 들어 스비르의 성 알렉산드르는 16세기에 안식했지만 그의 유해는 썩지 않았고 그의 이름을 지닌 수도원에 모셔져 있습니다. 이 문제는 본질적이지 않습니다. 유해의 보존 자체가 사람의 거룩함을 말해 주는 것은 아니기 때문입니다. 기적도 마찬가지로, 여러 종교 공동체에서 기적의 소식이 들려오지만 그 본질과 근원은 단순한 속임수나 타락한 세력의 활동까지 다양할 수 있습니다. 유해가 보존되는 까닭은 때로 매장지의 온도와 습도 같은 자연적인 것이거나, 사람의 거룩함과 상관없는 하느님 섭리의 신비로운 활동일 수 있습니다. 부정적인 예로 <a href="https://azbyka.ru/otechnik/sekty/opyt-sistematicheskago-posobija-pri-polemike-s-staroobrjadtsami-s-kratkim-ocherkom-razvitija-drevnih-sekt-i-russkogo-raskolostaroobrjadchestva/7_6">19세기의 사례</a>(러시아어)를 들 수 있습니다. 구교도들이 그 지역에 잘 알려진 무슬림 체르케스인 세 사람의 유해를 성인의 유해로 인정했고(그 곁에는 토끼와 개의 비슷한 유해도 있었습니다), 그 뒤 신자들을 속였다는 비난에 변명했습니다.</p></li></ol><p>번역: 로디온 블라소프 (AI 도구 활용). 저본: 러시아어 원문. 참고: 영어·일본어 번역. 성경 인용과 링크는 개역개정에 따름.</p>'
