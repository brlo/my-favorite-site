  path: Ps5r_성인들에게_드리는_기도
  title: 성인들에게 드리는 기도
  copy_cover: true
  body: '<h2>정교회의 이해</h2><p>정교회는 주 예수 그리스도께서 유일한 중재자이시라고 가르칩니다. 그러나 어떤 중재자이십니까? 모든 이를 위해 당신 자신을 대속물로 내주신 분입니다(<a href="https://bibleox.com/ko/ko-nkrv/1tim/2/#L5-6">딤전 2:5-6</a>). 다른 거룩한 사람들이나 천사들 가운데 구속자는 없습니다. 그러나 함께 기도해 주는 이들은 많습니다:</p><blockquote><p>“그가 이같이 큰 사망에서 우리를 건지셨고 또 건지실 것이며 <strong>이후에도 건지시기를 그에게 바라노라</strong> <strong>너희도 우리를 위하여 간구함으로 도우라 이는 우리가 많은 사람의 기도로 얻은 은사로 말미암아 많은 사람이 우리를 위하여 감사하게 하려 함이라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2kor/1/#L10-11">고후 1:10-11</a>)</p></blockquote><p>거룩하고 의로운 하느님의 벗들, 곧 하느님의 어머니, 천사들, 예언자들, 사도들, 순교자들과 다른 성인들도 그러합니다. 이 세상에서 사도에게 기도를 청했듯이 저세상에서도 그에게 기도를 청합니다. 각자가 자기만을 위해 하느님께 기도해야 한다는 생각은 성경에 낯섭니다. 오히려 성경에서는 온 교회가 서로를 위해 기도하라는 부름을 거듭 받습니다(<a href="https://bibleox.com/ko/ko-nkrv/iak/5/#L16">약 5:16</a>)[1]. 위대한 의인들과 하느님께 택함받은 이들까지 모두가 하느님께 기도를 그치지 않으면서 신자들에게 자기를 위해 기도해 달라고 청했고, 자신들도 신자들을 위해 끊임없이 기도했으며, 앞으로도 이 질서를 지키라고 명했습니다. 이것을 서로를 위한 전구라고도 합니다.</p><p>우리는 교회에서 알고 성경에서 확인합니다. 의인들은 몸에서 떠나면 하느님과 함께하는 삶으로 옮아가 계속 그분께 기도를 바칩니다. 그러므로 사람들이 이 의인들이 지상에서 몸으로 살 때 기도를 청했듯이, 몸에서 떠나 하늘에서 그리스도와 함께 드러난 삶으로 옮아간 뒤에도 똑같이 기도를 청합니다(<a href="https://bibleox.com/ko/ko-nkrv/evr/12/#L22-23">히 12:22-23</a>). 그들은 더 나쁜 상태가 아니라 더 좋은 상태로 옮아갔기 때문입니다(<a href="https://bibleox.com/ko/ko-nkrv/fil/1/#L23">빌 1:23</a>). 우리는 사랑이 가실 줄을 모른다고 믿습니다(<a href="https://bibleox.com/ko/ko-nkrv/1kor/13/#L8">고전 13:8</a>). 그러므로 온 교회, 곧 지상에서 싸우는 교회와 하늘에서 승리한 교회는 하나이고 온전하며, 서로 소통하고 서로를 위해 함께 기도하며, 사랑으로 모든 지체를 돌봅니다. 우리는 수호천사들이 하느님과 친교를 나누고(<a href="https://bibleox.com/ko/ko-nkrv/mf/18/#L10">마 18:10</a>) 구원을 상속받을 이들을 섬기도록 파견된다고(<a href="https://bibleox.com/ko/ko-nkrv/evr/1/#L14">히 1:14</a>) 믿고 교회에서 알며 성경으로 보여 줍니다. 거룩한 의인들도 하느님의 빛 안에 머물며 지상의 일을 알고 교회를 위해 하느님께 기도를 바칩니다(<a href="https://bibleox.com/ko/ko-nkrv/otkr/6/#L9-11">계 6:9-11</a>). 영원한 사랑은 그리스도의 한 몸 안에서, 하늘에서도 땅에서도 모두를 서로의 친교와 돌봄으로 움직입니다.</p><h2>천사들의 기도</h2><h3>사람에게는 수호천사가 있습니다</h3><blockquote><p>“삼가 이 작은 자 중의 하나도 업신여기지 말라 너희에게 말하노니 <strong>그들의 천사들이</strong> 하늘에서 하늘에 계신 내 아버지의 얼굴을 항상 뵈옵느니라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/18/#L10">마 18:10</a>)</p></blockquote><h3>천사들은 구원받는 이들을 돌보도록 파견됩니다</h3><blockquote><p>“어느 때에 천사 중 누구에게 내가 네 원수로 네 발등상이 되게 하기까지 너는 내 우편에 앉아 있으라 하셨느냐 모든 천사들은 섬기는 영으로서 <strong>구원 받을 상속자들을 위하여 섬기라고 보내심이 아니냐</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/evr/1/#L13-14">히 1:13-14</a>)</p></blockquote><h3>하늘의 천사들은 사람의 회개를 기뻐합니다</h3><blockquote><p>“내가 너희에게 이르노니 이와 같이 <strong>죄인 한 사람이 회개하면 하늘에서는</strong> 회개할 것 없는 의인 아흔아홉으로 말미암아 <strong>기뻐하는 것보다 더하리라</strong> &lt;…&gt; 내가 너희에게 이르노니 이와 같이 <strong>죄인 한 사람이 회개하면 하나님의 사자들 앞에 기쁨이 되느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/lk/15/#L7,10">눅 15:7,10</a>)</p></blockquote><h3>천사는 사람들을 위해 하느님 앞에 전구합니다</h3><p>천사는 유다 성읍 주민들을 위해 자비를 청합니다:</p><blockquote><p>“여호와의 천사가 대답하여 이르되 <strong>만군의 여호와여 여호와께서 언제까지 예루살렘과 유다 성읍들을 불쌍히 여기지 아니하시려 하나이까</strong> 이를 노하신 지 칠십 년이 되었나이다 하매 여호와께서 내게 말하는 천사에게 선한 말씀, 위로하는 말씀으로 대답하시더라” (<a href="https://bibleox.com/ko/ko-nkrv/zah/1/#L12-13">슥 1:12-13</a>)</p></blockquote><h3>천사와의 소통</h3><blockquote><p>“동틀 때에 <strong>천사가 롯을 재촉하여</strong> 이르되 일어나 여기 있는 네 아내와 두 딸을 이끌어 내라 이 성의 죄악 중에 함께 멸망할까 하노라” (<a href="https://bibleox.com/ko/ko-nkrv/gen/19/#L15">창 19:15</a>)</p></blockquote><blockquote><p>“여호와의 사자가 아비에셀 사람 요아스에게 속한 오브라에 이르러 상수리나무 아래에 앉으니라 마침 요아스의 아들 기드온이 미디안 사람에게 알리지 아니하려 하여 밀을 포도주 틀에서 타작하더니 <strong>여호와의 사자가 기드온에게 나타나 이르되</strong> 큰 용사여 여호와께서 너와 함께 계시도다 하매 <strong>기드온이 그에게 대답하되</strong> 오 나의 주여 여호와께서 우리와 함께 계시면 어찌하여 이 모든 일이 우리에게 일어났나이까 또 우리 조상들이 일찍이 우리에게 이르기를 여호와께서 우리를 애굽에서 올라오게 하신 것이 아니냐 한 그 모든 이적이 어디 있나이까 이제 여호와께서 우리를 버리사 미디안의 손에 우리를 넘겨 주셨나이다 하니” (<a href="https://bibleox.com/ko/ko-nkrv/sud/6/#L11-13">삿 6:11-13</a>)</p></blockquote><blockquote><p>“소라 땅에 단 지파의 가족 중에 마노아라 이름하는 자가 있더라 그의 아내가 임신하지 못하므로 출산하지 못하더니 <strong>여호와의 사자가 그 여인에게 나타나서</strong> 그에게 이르시되 보라 네가 본래 임신하지 못하므로 출산하지 못하였으나 이제 임신하여 아들을 낳으리니” (<a href="https://bibleox.com/ko/ko-nkrv/sud/13/#L2-3">삿 13:2-3</a>)</p></blockquote><blockquote><p>“그때 하늘에서 <strong>천사가 그분께 나타나 힘을 북돋아 드렸다</strong>” (<a href="https://bibleox.com/ko/en-nrsv/lk/22/#L43">눅 22:43</a>, 영어 번역(NRSV)에서 옮김)</p></blockquote><blockquote><p>“유대 왕 헤롯 때에 아비야 반열에 제사장 한 사람이 있었으니 이름은 사가랴요 그의 아내는 아론의 자손이니 이름은 엘리사벳이라 &lt;…&gt; <strong>주의 사자가 그에게 나타나</strong> 향단 우편에 선지라 &lt;…&gt; <strong>천사가 그에게 이르되</strong> 사가랴여 무서워하지 말라 너의 간구함이 들린지라 네 아내 엘리사벳이 네게 아들을 낳아 주리니 그 이름을 요한이라 하라 &lt;…&gt; <strong>사가랴가 천사에게 이르되</strong> 내가 이것을 어떻게 알리요 내가 늙고 아내도 나이가 많으니이다 <strong>천사가 대답하여 이르되</strong> 나는 하나님 앞에 서 있는 가브리엘이라 이 좋은 소식을 전하여 네게 말하라고 보내심을 받았노라” (<a href="https://bibleox.com/ko/ko-nkrv/lk/1/#L5,11,13,18-19">눅 1:5,11,13,18-19</a>)</p></blockquote><blockquote><p>“여섯째 달에 <strong>천사 가브리엘이</strong> 하나님의 보내심을 받아 갈릴리 나사렛이란 동네에 가서 다윗의 자손 요셉이라 하는 사람과 약혼한 처녀에게 이르니 그 처녀의 이름은 마리아라 <strong>그에게 들어가 이르되</strong> 은혜를 받은 자여 평안할지어다 주께서 너와 함께 하시도다 하니 &lt;…&gt; <strong>천사가 이르되</strong> 마리아여 무서워하지 말라 네가 하나님께 은혜를 입었느니라 보라 네가 잉태하여 아들을 낳으리니 그 이름을 예수라 하라 &lt;…&gt; 마리아가 천사에게 말하되 나는 남자를 알지 못하니 어찌 이 일이 있으리이까 <strong>천사가 대답하여 이르되</strong> 성령이 네게 임하시고 지극히 높으신 이의 능력이 너를 덮으시리니 이러므로 나실 바 거룩한 이는 하나님의 아들이라 일컬어지리라” (<a href="https://bibleox.com/ko/ko-nkrv/lk/1/#L26-28,30-31,34-35">눅 1:26-28,30-31,34-35</a>)</p></blockquote><blockquote><p>“밤에 환상이 바울에게 보이니 마게도냐 사람 하나가 서서 <strong>그에게 청하여 이르되</strong> 마게도냐로 건너와서 우리를 도우라 하거늘” (<a href="https://bibleox.com/ko/ko-nkrv/act/16/#L9">행 16:9</a>)</p></blockquote><blockquote><p>“<strong>홀연히 주의 사자가 나타나매</strong> 옥중에 광채가 빛나며 또 <strong>베드로의 옆구리를 쳐 깨워</strong> 이르되 급히 일어나라 하니 쇠사슬이 그 손에서 벗어지더라 <strong>천사가 이르되</strong> 띠를 띠고 신을 신으라 하거늘 베드로가 그대로 하니 천사가 또 이르되 겉옷을 입고 따라오라 한대” (<a href="https://bibleox.com/ko/ko-nkrv/act/12/#L7-8">행 12:7-8</a>)</p></blockquote><blockquote><p>“예수 그리스도의 계시라 이는 하나님이 그에게 주사 반드시 속히 일어날 일들을 그 종들에게 보이시려고 <strong>그의 천사를 그 종 요한에게 보내어</strong> 알게 하신 것이라” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/1/#L1">계 1:1</a>)</p></blockquote><h2>죽은 이들의 기도</h2><p>예언자 바룩은 안식한 의인들의 기도를 들어 달라고 하느님께 청합니다:</p><blockquote><p>“주님, 들으시고 자비를 베푸소서. <strong>저희가 주님께 죄를 지었습니다</strong>. … 전능하신 주님, 이스라엘의 하느님, <strong>이제 이스라엘의 죽은 이들의 기도를 들어 주소서</strong>, 주님께 죄지은 이들의 자녀들의 기도를 들어 주소서” (<a href="https://bibleox.com/ko/gr-lxx-byz/var/3/#L2-4">바룩 3:2-4</a>, 그리스어에서 번역)</p></blockquote><p>안식한 라헬, 곧 족장 야곱의 아내는 바벨론 유배 때 아들들의 죽음과 고난을 슬퍼합니다. 주님께서는 그에게 대답하시고 위로하시며 그들을 해방하겠다고 약속하시고, 그대로 이루어졌습니다:</p><blockquote><p>“여호와께서 이와 같이 말씀하시니라 라마에서 슬퍼하며 통곡하는 소리가 들리니 <strong>라헬이 그 자식 때문에 애곡하는 것이라 그가 자식이 없어져서 위로 받기를 거절하는도다</strong> 여호와께서 이와 같이 말씀하시니라 <strong>네 울음 소리와 네 눈물을 멈추어라 네 일에 삯을 받을 것인즉</strong> 그들이 그의 대적의 땅에서 돌아오리라 여호와의 말씀이니라 너의 장래에 소망이 있을 것이라 너의 자녀가 자기들의 지경으로 돌아오리라 여호와의 말씀이니라” (<a href="https://bibleox.com/ko/ko-nkrv/ier/31/#L15-17">렘 31:15-17</a>)</p></blockquote><p>이 구절은 비유로도, 글자 그대로도 이해할 수 있습니다.</p><h2>의인들의 기도</h2><h3>의인의 기도는 하느님 마음에 더 듭니다</h3><blockquote><p>“악인의 제사는 여호와께서 미워하셔도 <strong>정직한 자의 기도는 그가 기뻐하시느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/pr/15/#L8">잠 15:8</a>)</p></blockquote><blockquote><p>“여호와는 악인을 멀리 하시고 <strong>의인의 기도를 들으시느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/pr/15/#L29">잠 15:29</a>)</p></blockquote><blockquote><p>“그러므로 너희 죄를 서로 고백하며 병이 낫기를 위하여 서로 기도하라 <strong>의인의 간구는 역사하는 힘이 큼이니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/iak/5/#L16">약 5:16</a>)</p></blockquote><h3>하느님께서는 의인이 죄의 용서를 위해 기도하기를 요구하십니다</h3><h4>욥</h4><blockquote><p>“그런즉 너희는 수소 일곱과 숫양 일곱을 가지고 내 종 욥에게 가서 너희를 위하여 번제를 드리라 <strong>내 종 욥이 너희를 위하여 기도할 것인즉 내가 그를 기쁘게 받으리니</strong> 너희가 우매한 만큼 너희에게 갚지 아니하리라 이는 너희가 나를 가리켜 말한 것이 내 종 욥의 말 같이 옳지 못함이라” (<a href="https://bibleox.com/ko/ko-nkrv/iov/42/#L8">욥 42:8</a>)</p></blockquote><blockquote><p>“하나님이 꿈에 또 그에게 이르시되 네가 온전한 마음으로 이렇게 한 줄을 나도 알았으므로 너를 막아 내게 범죄하지 아니하게 하였나니 여인에게 가까이 하지 못하게 함이 이 때문이니라 이제 그 사람의 아내를 돌려보내라 <strong>그는 선지자라 그가 너를 위하여 기도하리니 네가 살려니와 네가 돌려보내지 아니하면 너와 네게 속한 자가 다 반드시 죽을 줄 알지니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gen/20/#L6-7">창 20:6-7</a>)</p></blockquote><h4>예언자 모세</h4><p>예언자 모세는 하느님과 온 백성 사이의 중재자였습니다:</p><blockquote><p>“이제 내 말을 들으라 내가 네게 방침을 가르치리니 하나님이 너와 함께 계실지로다 <strong>너는 하나님 앞에서 그 백성을 위하여</strong> 그 사건들을 하나님께 가져오며” (<a href="https://bibleox.com/ko/ko-nkrv/ish/18/#L19">출 18:19</a>)</p></blockquote><p>모세의 청 덕분에 하느님께서는 백성의 죄를 용서하셨습니다:</p><blockquote><p>“구하옵나니 주의 인자의 광대하심을 따라 이 백성의 죄악을 사하시되 애굽에서부터 지금까지 이 백성을 사하신 것 같이 사하시옵소서 여호와께서 이르시되 <strong>내가 네 말대로 사하노라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/chis/14/#L19-20">민 14:19-20</a>)</p></blockquote><p>그러나 다른 때에 하느님께서는 모세의 말로도 용서하지 않으시겠다고 가리키십니다:</p><blockquote><p>“여호와께서 내게 이르시되 <strong>모세와 사무엘이 내 앞에 섰다 할지라도 내 마음은 이 백성을 향할 수 없나니</strong> 그들을 내 앞에서 쫓아 내보내라” (<a href="https://bibleox.com/ko/ko-nkrv/ier/15/#L1">렘 15:1</a>)</p></blockquote><p>그는 결정을 바꾸시도록 하느님께 간청했습니다:</p><blockquote><p>“그런즉 내가 하는 대로 두라 <strong>내가 그들에게 진노하여 그들을 진멸하고</strong> 너를 큰 나라가 되게 하리라 <strong>모세가 그의 하나님 여호와께 구하여</strong> 이르되 여호와여 어찌하여 그 큰 권능과 강한 손으로 애굽 땅에서 인도하여 내신 주의 백성에게 진노하시나이까 어찌하여 애굽 사람들이 이르기를 여호와가 자기의 백성을 산에서 죽이고 지면에서 진멸하려는 악한 의도로 인도해 내었다고 말하게 하시려 하나이까 주의 맹렬한 노를 그치시고 뜻을 돌이키사 <strong>주의 백성에게 이 화를 내리지 마옵소서</strong> 주의 종 아브라함과 이삭과 이스라엘을 기억하소서 주께서 그들을 위하여 주를 가리켜 맹세하여 이르시기를 내가 너희의 자손을 하늘의 별처럼 많게 하고 내가 허락한 이 온 땅을 너희의 자손에게 주어 영원한 기업이 되게 하리라 하셨나이다 <strong>여호와께서 뜻을 돌이키사 말씀하신 화를 그 백성에게 내리지 아니하시니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ish/32/#L10-14">출 32:10-14</a>)</p></blockquote><p>그 뒤 다시 백성을 위해 전구하러 갔습니다:</p><blockquote><p>“이튿날 모세가 백성에게 이르되 <strong>너희가 큰 죄를 범하였도다 내가 이제 여호와께로 올라가노니 혹 너희를 위하여 속죄가 될까 하노라</strong> 하고” (<a href="https://bibleox.com/ko/ko-nkrv/ish/32/#L30">출 32:30</a>)</p></blockquote><p>그리고 다시 하느님의 결정을 바꾸었습니다:</p><blockquote><p>“사람이 자기의 친구와 이야기함 같이 여호와께서는 모세와 대면하여 말씀하시며 모세는 진으로 돌아오나 눈의 아들 젊은 수종자 여호수아는 회막을 떠나지 아니하니라 모세가 여호와께 아뢰되 보시옵소서 주께서 내게 이 백성을 인도하여 올라가라 하시면서 나와 함께 보낼 자를 내게 지시하지 아니하시나이다 주께서 전에 말씀하시기를 나는 이름으로도 너를 알고 너도 내 앞에 은총을 입었다 하셨사온즉 &lt;…&gt; 모세가 여호와께 아뢰되 <strong>주께서 친히 가지 아니하시려거든 우리를 이 곳에서 올려 보내지 마옵소서</strong> &lt;…&gt; 여호와께서 모세에게 이르시되 <strong>네가 말하는 이 일도 내가 하리니 너는 내 목전에 은총을 입었고 내가 이름으로도 너를 앎이니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ish/33/#L11-12,15,17">출 33:11-12,15,17</a>)</p></blockquote><h4>하느님의 사람</h4><blockquote><p>“왕이 하나님의 사람에게 말하여 이르되 청하건대 <strong>너는 나를 위하여 네 하나님 여호와께 은혜를 구하여 내 손이 다시 성하게 기도하라 하나님의 사람이 여호와께 은혜를 구하니</strong> 왕의 손이 다시 성하도록 전과 같이 되니라” (<a href="https://bibleox.com/ko/ko-nkrv/3ts/13/#L6">왕상 13:6</a>)</p></blockquote><h2>다른 사람들을 위한 사제직의 기도</h2><p>사제들이 다른 사람을 위해 기도함으로써(여기에 중재가 있습니다) 죄가 용서될 수 있습니다:</p><blockquote><p>“<strong>너희 중에 병든 자가 있느냐 그는 교회의 장로들을 청할 것이요</strong> 그들은 주의 이름으로 기름을 바르며 <strong>그를 위하여 기도할지니라</strong> 믿음의 기도는 병든 자를 구원하리니 주께서 그를 일으키시리라 <strong>혹시 죄를 범하였을지라도 사하심을 받으리라</strong> 그러므로 너희 죄를 서로 고백하며 병이 낫기를 위하여 서로 기도하라 의인의 간구는 역사하는 힘이 큼이니라” (<a href="https://bibleox.com/ko/ko-nkrv/iak/5/#L14-16">약 5:14-16</a>)</p></blockquote><h2>교회의 지체들이 서로를 위해 드리는 기도</h2><p>하느님께 드리는 개인 기도만으로 충분합니까?</p><h3>사도들에게는 자기를 위한 기도가 필요합니다</h3><blockquote><p>“또한 <strong>우리를 위하여 기도하되</strong> 하나님이 전도할 문을 우리에게 열어 주사 그리스도의 비밀을 말하게 하시기를 구하라 내가 이 일 때문에 매임을 당하였노라” (<a href="https://bibleox.com/ko/ko-nkrv/kol/4/#L3">골 4:3</a>)</p></blockquote><blockquote><p>“형제들아 <strong>우리를 위하여 기도하라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1sol/5/#L25">살전 5:25</a>)</p></blockquote><blockquote><p>“끝으로 형제들아 <strong>너희는 우리를 위하여 기도하기를</strong> 주의 말씀이 너희 가운데서와 같이 퍼져 나가 영광스럽게 되고” (<a href="https://bibleox.com/ko/ko-nkrv/2sol/3/#L1">살후 3:1</a>)</p></blockquote><blockquote><p>“<strong>우리를 위하여 기도하라</strong> 우리가 모든 일에 선하게 행하려 하므로 우리에게 선한 양심이 있는 줄을 확신하노니” (<a href="https://bibleox.com/ko/ko-nkrv/evr/13/#L18">히 13:18</a>)</p></blockquote><blockquote><p>“형제들아 내가 우리 주 예수 그리스도와 성령의 사랑으로 말미암아 너희를 권하노니 <strong>너희 기도에 나와 힘을 같이하여 나를 위하여 하나님께 빌어</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/rim/15/#L30">롬 15:30</a>)</p></blockquote><blockquote><p>“그가 이같이 큰 사망에서 우리를 건지셨고 또 건지실 것이며 이후에도 건지시기를 그에게 바라노라 <strong>너희도 우리를 위하여 간구함으로 도우라</strong> 이는 우리가 <strong>많은 사람의 기도로</strong> 얻은 은사로 말미암아 많은 사람이 우리를 위하여 감사하게 하려 함이라” (<a href="https://bibleox.com/ko/ko-nkrv/2kor/1/#L10-11">고후 1:10-11</a>)</p></blockquote><blockquote><p>“이것이 <strong>너희의 간구와</strong> 예수 그리스도의 성령의 도우심으로 <strong>나를 구원에 이르게 할 줄</strong> 아는 고로” (<a href="https://bibleox.com/ko/ko-nkrv/fil/1/#L19">빌 1:19</a>)</p></blockquote><blockquote><p>“오직 너는 나를 위하여 숙소를 마련하라 <strong>너희 기도로</strong> 내가 너희에게 나아갈 수 있기를 바라노라” (<a href="https://bibleox.com/ko/ko-nkrv/fm/1/#L22">몬 1:22</a>)</p></blockquote><h3>사도들은 늘 그리스도인들을 위해 기도합니다</h3><blockquote><p>“<strong>내가 기도할 때에 기억하며</strong> 너희로 말미암아 감사하기를 그치지 아니하고” (<a href="https://bibleox.com/ko/ko-nkrv/ef/1/#L16">엡 1:16</a>)</p></blockquote><blockquote><p>“간구할 때마다 <strong>너희 무리를 위하여 기쁨으로 항상 간구함은</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/fil/1/#L4">빌 1:4</a>)</p></blockquote><blockquote><p>“우리가 너희 모두로 말미암아 항상 하나님께 감사하며 <strong>기도할 때에 너희를 기억함은</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1sol/1/#L2">살전 1:2</a>)</p></blockquote><blockquote><p>“그리스도 예수의 종인 너희에게서 온 에바브라가 너희에게 문안하느니라 그가 <strong>항상 너희를 위하여 애써 기도하여</strong> 너희로 하나님의 모든 뜻 가운데서 완전하고 확신 있게 서기를 구하나니” (<a href="https://bibleox.com/ko/ko-nkrv/kol/4/#L12">골 4:12</a>)</p></blockquote><blockquote><p>“<strong>내가 밤낮 간구하는 가운데 쉬지 않고 너를 생각하여</strong> 청결한 양심으로 조상적부터 섬겨 오는 하나님께 감사하고” (<a href="https://bibleox.com/ko/ko-nkrv/2tim/1/#L3">딤후 1:3</a>)</p></blockquote><blockquote><p>“내가 항상 내 하나님께 감사하고 <strong>기도할 때에 너를 말함은</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/fm/1/#L4">몬 1:4</a>)</p></blockquote><h3>사도들은 그리스도인들에게 서로를 위해 기도하라고 불렀습니다</h3><blockquote><p>“그러므로 너희 죄를 서로 고백하며 병이 낫기를 위하여 <strong>서로 기도하라</strong> 의인의 간구는 역사하는 힘이 큼이니라” (<a href="https://bibleox.com/ko/ko-nkrv/iak/5/#L16">약 5:16</a>)</p></blockquote><blockquote><p>“모든 기도와 간구를 하되 항상 성령 안에서 기도하고 이를 위하여 깨어 구하기를 항상 힘쓰며 <strong>여러 성도를 위하여 구하라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ef/6/#L18">엡 6:18</a>)</p></blockquote><blockquote><p>“그러므로 내가 첫째로 권하노니 <strong>모든 사람을 위하여</strong> <strong>간구와 기도와 도고와 감사를 하되</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1tim/2/#L1">딤전 2:1</a>)</p></blockquote><h2>온 교회는 소통하고 돌보는 그리스도의 하나인 몸입니다</h2><h3>교회는 그리스도의 몸입니다</h3><blockquote><p>“<strong>너희는 그리스도의 몸이요</strong> 지체의 각 부분이라” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/12/#L27">고전 12:27</a>)</p></blockquote><blockquote><p>“<strong>너희 몸이 그리스도의 지체인 줄을</strong> 알지 못하느냐 내가 그리스도의 지체를 가지고 창녀의 지체를 만들겠느냐 결코 그럴 수 없느니라” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/6/#L15">고전 6:15</a>)</p></blockquote><h3>교회의 지체들은 하느님께 참여합니다</h3><blockquote><p>“그의 신기한 능력으로 생명과 경건에 속한 모든 것을 우리에게 주셨으니 이는 자기의 영광과 덕으로써 우리를 부르신 이를 앎으로 말미암음이라 이로써 그 보배롭고 지극히 큰 약속을 우리에게 주사 이 약속으로 말미암아 너희가 정욕 때문에 세상에서 썩어질 것을 피하여 <strong>신성한 성품에 참여하는 자가 되게 하려 하셨느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2pet/1/#L3-4">벧후 1:3-4</a>)</p></blockquote><h3>몸의 모든 지체는 서로 돌봅니다</h3><blockquote><p>“몸 가운데서 분쟁이 없고 오직 여러 지체가 서로 같이 돌보게 하셨느니라 <strong>만일 한 지체가 고통을 받으면 모든 지체가 함께 고통을 받고</strong> <strong>한 지체가 영광을 얻으면 모든 지체가 함께 즐거워하느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/12/#L25-26">고전 12:25-26</a>)</p></blockquote><h3>사도들은 늘 교회를 위해 기도합니다</h3><blockquote><p>“이로써 우리도 듣던 날부터 <strong>너희를 위하여 기도하기를 그치지 아니하고 구하노니</strong> 너희로 하여금 모든 신령한 지혜와 총명에 하나님의 뜻을 아는 것으로 채우게 하시고” (<a href="https://bibleox.com/ko/ko-nkrv/kol/1/#L9">골 1:9</a>)</p></blockquote><h2>지상 교회와 천상 교회의 일치</h2><h3>우리는 이미 천상 교회에 와 있습니다</h3><p>부활 뒤 미래가 아니라 이미 지금입니다:</p><blockquote><p>“그러나 <strong>너희가 이른 곳은</strong> 시온 산과 살아 계신 하나님의 도성인 하늘의 예루살렘과 천만 천사와 하늘에 기록된 장자들의 모임과 교회와 만민의 심판자이신 하나님과 및 <strong>온전하게 된 의인의 영들과</strong> 새 언약의 중보자이신 예수와 및 아벨의 피보다 더 나은 것을 말하는 뿌린 피니라” (<a href="https://bibleox.com/ko/ko-nkrv/evr/12/#L22-24">히 12:22-24</a>)</p></blockquote><h3>분열이 없고, 모두가 서로 돌보고 함께 느낍니다</h3><blockquote><p>“이제 지체는 많으나 몸은 하나라 &lt;…&gt; 우리의 아름다운 지체는 그럴 필요가 없느니라 오직 하나님이 몸을 고르게 하여 부족한 지체에게 귀중함을 더하사 <strong>몸 가운데서 분쟁이 없고 오직 여러 지체가 서로 같이 돌보게 하셨느니라</strong> 만일 한 지체가 고통을 받으면 <strong>모든 지체가 함께 고통을 받고</strong> 한 지체가 영광을 얻으면 <strong>모든 지체가 함께 즐거워하느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/12/#L20,24-26">고전 12:20,24-26</a>)</p></blockquote><blockquote><p>“내가 너희에게 이르노니 이와 같이 <strong>죄인 한 사람이 회개하면 하늘에서는</strong> 회개할 것 없는 의인 아흔아홉으로 말미암아 <strong>기뻐하는 것보다 더하리라</strong> &lt;…&gt; 내가 너희에게 이르노니 이와 같이 <strong>죄인 한 사람이 회개하면 하나님의 사자들 앞에 기쁨이 되느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/lk/15/#L7,10">눅 15:7,10</a>)</p></blockquote><h3>하늘과 땅의 것이 그리스도 안에서 하나가 됩니다</h3><blockquote><p>“찬송하리로다 하나님 곧 우리 주 예수 그리스도의 아버지께서 그리스도 안에서 하늘에 속한 모든 신령한 복을 우리에게 주시되 &lt;…&gt; 그 뜻의 비밀을 우리에게 알리신 것이요 그의 기뻐하심을 따라 그리스도 안에서 <strong>때가 찬 경륜을 위하여</strong> 예정하신 것이니 <strong>하늘에 있는 것이나 땅에 있는 것이 다 그리스도 안에서 통일되게 하려 하심이라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ef/1/#L3,9-10">엡 1:3,9-10</a>)</p></blockquote><blockquote><p>“이러므로 내가 <strong>하늘과 땅에 있는 각 족속</strong>에게” (<a href="https://bibleox.com/ko/ko-nkrv/ef/3/#L14">엡 3:14</a>)</p></blockquote><blockquote><p>“그는 몸인 교회의 머리시라 그가 근본이시요 죽은 자들 가운데서 먼저 나신 이시니 이는 친히 만물의 으뜸이 되려 하심이요 <strong>아버지께서는 모든 충만으로 예수 안에 거하게 하시고</strong> 그의 십자가의 피로 화평을 이루사 <strong>만물 곧 땅에 있는 것들이나 하늘에 있는 것들이 그로 말미암아 자기와 화목하게 되기를</strong> 기뻐하심이라” (<a href="https://bibleox.com/ko/ko-nkrv/kol/1/#L18-20">골 1:18-20</a>)</p></blockquote><blockquote><p>“이를 위하여 <strong>그리스도께서</strong> 죽었다가 다시 살아나셨으니 곧 <strong>죽은 자와 산 자의 주가 되려 하심이라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/rim/14/#L9">롬 14:9</a>)</p></blockquote><p>함께 보기: <a href="https://bibleox.com/ru/ru/w/Церковь">교회: 지상 교회와 천상 교회의 일치</a>.</p><h2>성인들은 하늘에서 하느님께 기도합니다</h2><h3>성인들의 기도는 하느님 마음에 듭니다</h3><blockquote><p>“그 두루마리를 취하시매 네 생물과 이십사 장로들이 그 어린 양 앞에 엎드려 각각 거문고와 <strong>향이 가득한 금 대접을</strong> 가졌으니 <strong>이 향은 성도의 기도들이라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/5/#L8">계 5:8</a>)</p></blockquote><blockquote><p>“또 다른 천사가 와서 제단 곁에 서서 금 향로를 가지고 많은 향을 받았으니 이는 <strong>모든 성도의 기도와</strong> 합하여 보좌 앞 금 제단에 드리고자 함이라” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/8/#L3">계 8:3</a>)</p></blockquote><blockquote><p>“이 일 후에 내가 들으니 <strong>하늘에 허다한 무리의 큰 음성 같은 것이 있어 이르되 할렐루야 구원과 영광과 능력이 우리 하나님께 있도다</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/19/#L1">계 19:1</a>)</p></blockquote><p>그들은 지상에서 일어나는 일을 압니다:</p><blockquote><p>“다섯째 인을 떼실 때에 내가 보니 <strong>하나님의 말씀과 그들이 가진 증거로 말미암아 죽임을 당한 영혼들</strong>이 제단 아래에 있어 큰 소리로 불러 이르되 <strong>거룩하고 참되신 대주재여 땅에 거하는 자들을 심판하여 우리 피를 갚아 주지 아니하시기를 어느 때까지 하시려 하나이까</strong> 하니 각각 그들에게 흰 두루마기를 주시며 이르시되 아직 잠시 동안 쉬되 그들의 동무 종들과 형제들도 자기처럼 죽임을 당하여 그 수가 차기까지 하라 하시더라” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/6/#L9-11">계 6:9-11</a>)</p></blockquote><h3>성인들은 더 나쁜 상태가 아니라 더 좋은 상태로 옮아갑니다</h3><blockquote><p>“내가 그 둘 사이에 끼었으니 <strong><mark>차라리 세상을 떠나서 그리스도와 함께 있는 것이 훨씬 더 좋은 일이라</mark></strong> 그렇게 하고 싶으나 내가 육신으로 있는 것이 너희를 위하여 더 유익하리라” (<a href="https://bibleox.com/ko/ko-nkrv/fil/1/#L23-24">빌 1:23-24</a>)</p></blockquote><h3>몸에서 떠난 뒤에도 성인들은 소통할 능력을 잃지 않습니다</h3><p>타보르산에서 구세주께서 변모하실 때 사도들은 이미 죽은 예언자 모세가 나타나 그리스도와 앞으로 받으실 십자가 고난에 관해 이야기하는 것을 봅니다. 곧 예언자는 죽었지만(<a href="https://bibleox.com/ko/ko-nkrv/vtor/34/#L7">신 34:7</a>; <a href="https://bibleox.com/ko/ko-nkrv/nav/1/#L2">수 1:2</a>) 사라지지도 의식을 잃지도 않았고, 그리스도와 <strong>소통합니다</strong>:</p><blockquote><p>“그 때에 <strong>모세와 엘리야가 예수와 더불어 말하는 것이 그들에게 보이거늘</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/17/#L3">마 17:3</a>)</p></blockquote><blockquote><p>“기도하실 때에 용모가 변화되고 그 옷이 희어져 광채가 나더라 문득 <strong>두 사람이 예수와 함께 말하니 이는 모세와 엘리야라</strong> 영광중에 나타나서 <strong>장차 예수께서 예루살렘에서 별세하실 것을 말할새</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/lk/9/#L29-31">눅 9:29-31</a>)</p></blockquote><h3>사랑은 언제나 남을 돌보도록 움직입니다</h3><blockquote><p>“<strong><mark>사랑은 언제까지나 떨어지지 아니하되</mark></strong> 예언도 폐하고 방언도 그치고 지식도 폐하리라” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/13/#L8">고전 13:8</a>)</p></blockquote><h2>비판</h2><h3>한 분이신 중재자</h3><h4>짧은 답변</h4><p>정교인들은 성인들에게 드리는 기도 때문에 그리스도만이 유일한 중재자라는 비난을 받습니다. 답변은 이렇습니다. 그리스도께서는 사람들을 구속하신 유일한 중재자이시며, 구절은 이어서 그렇게 말합니다:</p><blockquote><p>“하나님은 한 분이시요 또 <strong><mark>하나님과 사람 사이에 중보자도 한 분이시니 곧 사람이신 그리스도 예수라</mark></strong> 그가 <strong><mark>모든 사람을 위하여 자기를 대속물로 주셨으니</mark></strong> 기약이 이르러 주신 증거니라” (<a href="https://bibleox.com/ko/ko-nkrv/1tim/2/#L5-6">딤전 2:5-6</a>)</p></blockquote><p>성인들은 구속자가 아니라 함께 기도해 주는 이들입니다(<a href="https://bibleox.com/ko/ko-nkrv/iak/5/#L16">약 5:16</a>). 문제는 뜻에 있습니다. 우리의 반대자들(대체로 개신교인)은 서로의 필요를 위해 기도합니다. 그들이 서로에게 중재자라면 성인들도 우리의 중재자입니다. 그들이 서로를 위해 함께 기도해 주는 이들이라면 성인들도 그렇습니다. 우리는 그저 우리를 위해 기도해 달라고, 하느님께 드리는 기도에 함께해 달라고 청할 뿐입니다. 우리는 그들을 신으로 여기지 않고 신에게 하듯 기도하지 않습니다. 개신교인들도 자기를 위해 기도해 달라고 청할 때 동료들을 신으로 여기지 않습니다.</p><p>기도에 중재자가 있을 수 있습니까? 성경을 보면 있을 수 있습니다. 예를 들어 교회 장로들의 기도를 통해 다른 사람의 죄가 용서될 수 있습니다.</p><blockquote><p>“너희 중에 병든 자가 있느냐 그는 <strong><mark>교회의 장로들을 청할 것이요</mark></strong> 그들은 주의 이름으로 기름을 바르며 <strong><mark>그를 위하여 기도할지니라</mark></strong> 믿음의 기도는 병든 자를 구원하리니 <strong>주께서 그를 일으키시리라</strong> <strong><mark>혹시 죄를 범하였을지라도 사하심을 받으리라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/iak/5/#L14-15">약 5:14-15</a>)</p></blockquote><p>분명한 전구입니다. 그러므로 성인들에게 드리는 기도의 반대자들이 내놓는, 그리스도께서 유일한 중재자이시라는 말씀의 이해(<a href="https://bibleox.com/ko/ko-nkrv/1tim/2/#L5-6">딤전 2:5-6</a>)는 옳지 않습니다. 이 구절은 기도의 중재자를 반대하지 않습니다.</p><h4>“중재자”라는 말에 관하여 더</h4><p>번역의 세부 사항도 있습니다. “중재자”는 그리스어 μεσίτης의 번역입니다. 이 말은 “화해시키는 이”, 곧 양쪽의 화해를 돕는 사람으로 옮길 수 있습니다. 곧 그리스도께서는 하느님과 사람 사이의 유일한 <strong>화해자</strong>이십니다. 사도들은 다른 곳에서 이를 더 분명히 말합니다:</p><blockquote><p>“모든 것이 하나님께로서 났으며 그가 <strong><mark>그리스도로 말미암아 우리를 자기와 화목하게 하시고</mark></strong> 또 우리에게 <strong>화목하게 하는 직분</strong>을 주셨으니 곧 <strong><mark>하나님께서 그리스도 안에 계시사 세상을 자기와 화목하게 하시며 그들의 죄를 그들에게 돌리지 아니하시고</mark></strong> <strong>화목하게 하는 말씀을 우리에게 부탁하셨느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2kor/5/#L18-19">고후 5:18-19</a>)</p></blockquote><blockquote><p>“나의 자녀들아 내가 이것을 너희에게 씀은 너희로 죄를 범하지 않게 하려 함이라 <strong><mark>만일 누가 죄를 범하여도 아버지 앞에서 우리에게 대언자가 있으니</mark></strong> 곧 의로우신 예수 그리스도시라 <strong><mark>그는 우리 죄를 위한 화목 제물이니</mark></strong> 우리만 위할 뿐 아니요 온 세상의 죄를 위하심이라 &lt;…&gt; 자녀들아 내가 너희에게 쓰는 것은 <strong><mark>너희 죄가 그의 이름으로 말미암아 사함을 받았음이요</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1in/2/#L1-2,12">요일 2:1-2,12</a>)</p></blockquote><p>“중재자”를 <strong>화해자</strong>로 옮기는 것은 앞서 가리킨 문장의 끝과도 맞습니다. “자기 자신을 모든 사람을 위한 대속물로 바치셨습니다”(<a href="https://bibleox.com/ko/ko-nkrv/1tim/2/#L5-6">딤전 2:5-6</a>). 곧 자신을 제물로 바쳐 인류의 죄를 하느님 앞에서 속량하신 화해자이십니다. 그러므로 이 구절은 성인들에게 드리는 기도를 반대하지 않고, 인류와 하느님의 <strong>화해자</strong>이신 그리스도를 말합니다. 그리스도께서는 사람들 서로의 <strong>화해자</strong>이시기도 합니다(<a href="https://bibleox.com/ko/ko-nkrv/ef/2/#L14">엡 2:14</a>).</p><h3>“저희를 구원하소서”라는 표현에 관하여</h3><p>정교인들은 성인에게 드리는 기도에서 “저희를 구원하소서”라는 표현을 쓴다고 비난을 받습니다. 여기서도 문제는 뜻에 있습니다. 구원은 그리스도께서 단번에 이루셨습니다. 이런 뜻의 구원자는 다른 이가 없습니다. 그러나 많은 이가 어떤 사람의 개인적 구원을 도울 수 있습니다. 성경에도 그런 표현이 자주 나옵니다:</p><h4>사도가 구원합니다</h4><blockquote><p>“이는 혹 내 골육을 아무쪼록 시기하게 하여 <strong><mark>그들 중에서 얼마를 구원하려 함이라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/rim/11/#L14">롬 11:14</a>)</p></blockquote><blockquote><p>“약한 자들에게 내가 약한 자와 같이 된 것은 약한 자들을 얻고자 함이요 내가 여러 사람에게 여러 모습이 된 것은 <strong><mark>아무쪼록 몇 사람이라도 구원하고자 함이니</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/9/#L22">고전 9:22</a>)</p></blockquote><h4>아내가 구원합니다</h4><blockquote><p>“<strong><mark>아내 된 자여 네가 남편을 구원할는지</mark></strong> 어찌 알 수 있으며 <strong><mark>남편 된 자여 네가 네 아내를 구원할는지</mark></strong> 어찌 알 수 있으리요” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/7/#L16">고전 7:16</a>)</p></blockquote><h4>다른 사람들을 구원하라는 사도의 부름</h4><blockquote><p>“어떤 의심하는 자들을 긍휼히 여기라 또 어떤 자를 <strong><mark>불에서 끌어내어 구원하라</mark></strong> 또 어떤 자를 그 육체로 더럽힌 옷까지도 미워하되 두려움으로 긍휼히 여기라” (<a href="https://bibleox.com/ko/ko-nkrv/iud/1/#L22-23">유 1:22-23</a>)</p></blockquote><blockquote><p>“네가 네 자신과 가르침을 살펴 이 일을 계속하라 이것을 행함으로 <strong><mark>네 자신과 네게 듣는 자를 구원하리라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1tim/4/#L16">딤전 4:16</a>)</p></blockquote><h4>그리스도 외에 누가 실제로 구원할 수 있습니까?</h4><p>사도도 아내와 남편도 주 예수 그리스도께서 구세주이신 뜻, 곧 인류의 유일한 구속자이자 죽음과 지옥에서 건지시는 분이며 부활과 하느님과 함께하는 영원한 삶을 주시는 분이라는 뜻의 구원자가 아닙니다. 그러나 보다시피 사도들은 “구원하겠다”는 표현을 씁니다. 우리는 이런 표현의 뜻을 바르게 이해합니다. 사람들은 구원을 도울 수 있습니다:</p><blockquote><p>“우리는 <strong>하나님의 동역자들이요</strong> 너희는 하나님의 밭이요 하나님의 집이니라” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/3/#L9">고전 3:9</a>)</p></blockquote><h3>“자비를 베푸소서”라는 표현에 관하여</h3><p>여기서도 “구원하다”는 말과 상황이 같습니다(위 참조). 이런 말은 성인들만이 아니라 평범한 사람들에게도 합니다. 자비를 베푼다는 것은 불쌍히 여긴다는 뜻입니다. 예를 들어 의로운 욥은 벗들에게 말합니다:</p><blockquote><p>“나의 친구야 너희는 <strong>나를 불쌍히 여겨다오 나를 불쌍히 여겨다오</strong> 하나님의 손이 나를 치셨구나” (<a href="https://bibleox.com/ko/ko-nkrv/iov/19/#L21">욥 19:21</a>)</p></blockquote><h3>성인들은 어떻게 온 세상의 기도를 들을 수 있습니까?</h3><p>성인들에게 드리는 기도의 반대자들은 말합니다. “하느님은 어디에나 계시고 전능하시지만, 성인들에게 그런 속성이 없다면 어떻게 지구 곳곳의 수많은 사람들의 기도를 들을 수 있는가?”</p><h4>성인들은 자기 힘이 아니라 하느님의 힘으로 예언하고 기적을 행했습니다</h4><p>성인들은 하느님과 따로 떼어 생각하지 않습니다. 하느님의 힘은 그들이 지상에서 몸으로 살 때에도 그들 안에 머물렀고, 하늘로 옮아가 그리스도와 함께 살게 된 뒤에는 더욱 그러합니다. 예언자 아가보는 모든 것을 아는 이가 아니었지만 온 세상의 기근을 알렸습니다(<a href="https://bibleox.com/ko/ko-nkrv/act/11/#L28">행 11:28</a>). 사도 베드로는 전능하지 않았지만 다비다를 살렸습니다(<a href="https://bibleox.com/ko/ko-nkrv/act/9/#L40">행 9:40</a>). 자기 힘이 아니라 하느님의 힘으로 그렇게 했습니다.</p><p>성인들은 사도의 말대로 더 나쁜 상태가 아니라 비교할 수 없이 더 좋은 상태로 옮아갑니다(<a href="https://bibleox.com/ko/ko-nkrv/fil/1/#L23-24">빌 1:23-24</a>). 잃는 것이 아니라 얻습니다(<a href="https://bibleox.com/ko/ko-nkrv/fil/1/#L21">빌 1:21</a>). 그들은 하느님과 결합되어 그분의 빛과 은총 안에 있습니다. 그들의 존재를 우리 존재와 비교할 수 없습니다. 그들은 지상의 일을 압니다(<a href="https://bibleox.com/ko/ko-nkrv/otkr/6/#L10">계 6:10</a>). 사도들은 몸으로 이 세상에 있을 때에도 영으로 그리스도인들과 함께 있다고 씁니다:</p><h4>사도는 공동체의 상태를 몸이 아니라 영으로 압니다</h4><blockquote><p>“이는 <strong>내가 육신으로는 떠나 있으나 심령으로는 너희와 함께 있어</strong> 너희가 질서 있게 행함과 그리스도를 믿는 너희 믿음이 굳건한 것을 <strong>기쁘게 봄이라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/kol/2/#L5">골 2:5</a>)</p></blockquote><blockquote><p>“<strong>내가 실로 몸으로는 떠나 있으나 영으로는 함께 있어서</strong> <strong>거기 있는 것 같이</strong> 이런 일 행한 자를 <strong>이미 판단하였노라</strong> 주 예수의 이름으로 너희가 내 영과 함께 모여서 우리 주 예수의 능력으로 이런 자를 사탄에게 내주었으니 이는 육신은 멸하고 영은 주 예수의 날에 구원을 받게 하려 함이라” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/5/#L3-5">고전 5:3-5</a>)</p></blockquote><h4>구원받는 이들에게는 수호천사가 있습니다</h4><p>기록된 대로 천사들은 구원받는 이들을 섬기도록 파견됩니다:</p><blockquote><p>“<strong>모든 천사들은 섬기는 영으로서 구원 받을 상속자들을 위하여 섬기라고 보내심이 아니냐</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/evr/1/#L14">히 1:14</a>)</p></blockquote><p>또 천사들은 하느님의 얼굴을 뵙습니다(<a href="https://bibleox.com/ko/ko-nkrv/mf/18/#L10">마 18:10</a>). 그들만으로도 우리의 기도를 전할 수 있습니다. 우리는 거룩한 사람들만이 아니라 거룩한 천사들에게도 기도합니다. 우리를 위해 기도해 달라고 청하고, 그들의 수고와 돌봄에 감사합니다.</p><p>지상 교회와 천상 교회의 친교를 반대하는 이들은 우리를 섬기도록 파견된 수호천사에게 감사하는 것조차 허락하지 않습니다. 수호천사는 우리 말을 듣기 위해 어디에나 있거나 전능할 필요가 없는데도 말입니다.</p><p>그러므로 교회는 성인들이 하느님의 빛과 은총 안에 머물기 때문에 우리 기도를 듣는다고 믿습니다. 하느님과의 결합이 그들에게 이 능력을 줍니다. 하느님께서 친히 이 능력을 주십니다. 아주 쉽게 말해 성인들은 자기 능력이 아니라 하느님과 그분의 능력 덕분에 기도를 듣습니다.</p><h3>교회는 누가 성인인지 어떻게 압니까? 사람이 하느님 대신 결정하는 것이 아닙니까?</h3><p>사람이 하느님 대신 결정하지 않습니다. 하느님께서는 약속대로(<a href="https://bibleox.com/ru/ru/w/почитание-святых-в-Библии">인용문</a>) 친히 당신의 성인들을 영광스럽게 하시고, 기적을 나타내시고, 그들의 기도를 들으십니다. 교회는 이를 증언하고, 혼란이 없도록 백성의 성인 공경을 질서 있게 정리할 뿐입니다. 사도도 그렇게 명했습니다:</p><blockquote><p>“<strong>모든 것을 품위 있게 하고 질서있게 하라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/14/#L40">고전 14:40</a>)</p></blockquote><blockquote><p>“우리가 들은즉 너희 가운데 <strong>게으르게 행하여</strong> 도무지 일하지 아니하고 일을 만들기만 하는 자들이 있다 하니” (<a href="https://bibleox.com/ko/ko-nkrv/2sol/3/#L11">살후 3:11</a>) <em>(그리스어 ἀτάκτως는 “무질서하게”라는 뜻입니다.)</em></p></blockquote><p>교회가 의인의 거룩함을 증언하고 공경의 질서를 세우는 일(시성)은 대체로 의인이 죽은 뒤 오랜 시간이 지나서 이루어집니다. 그래야 이 문제를 살필 때 의인의 지상 생활만이 아니라 그가 하늘로 옮아가 하느님과 함께 살게 된 뒤에 하느님께서 그에 관해 드러내신 것도 볼 수 있습니다.</p><p>교회의 지체들에게서 의인의 무덤에서 일어난 기적과 치유, 의인의 기도의 도움에 관한 증언을 모읍니다[2]. 그의 삶과 신앙의 순수함을 꼼꼼히 살핍니다. 그런 다음 교회는 모은 자료를 공의회적으로 검토하여 의인을 성인으로 공경하는 것을 승인할 수 있으며, 교회 본문과 이콘을 만들고 기념일을 정합니다. 이것은 부분적으로 교회 백성 사이에 이미 있는 공경을 질서 있게 정리하고, 그 공경이 옳음을 가리키며, 예배에 포함하는 일입니다.</p><p>그러나 성경과 교회의 성전에서 나오는 많은 의인의 거룩함은 증언할 필요가 없습니다. 잘 알려진 성인 가운데에는 의심할 바 없이 <a href="https://bibleox.com/ru/ru/w/Богородица">하느님의 어머니 동정 마리아</a>(하느님께서 큰 일을 해 주신 분, <a href="https://bibleox.com/ko/ko-nkrv/lk/1/#L49">눅 1:49</a>), 선조들, 예언자들, 사도들, 그들이 세운 주교와 사제와 보제들(예를 들어 보제이자 첫 순교자 스데반, <a href="https://bibleox.com/ko/ko-nkrv/act/7/#L55-60">행 7:55-60</a>), 수많은 순교자들이 있습니다. 또 교회는 거룩한 사람들만이 아니라 천사들, 곧 대천사 미카엘과 가브리엘과 다른 많은 천사들, <a href="https://bibleox.com/ru/ru/w/ангел-хранитель">수호천사</a>에게도 기도합니다. 천사들은 하느님의 알려진 종이므로 그들의 거룩함을 증언할 필요가 없습니다.</p><h2>중요한 참고 사항</h2><p>성인들에게 드리는 기도를 변호하기 전에 핵심을 분명히 알아야 합니다. 반대자들의 설명에는 금지의 긍정적인 부분이 없습니다. 그들의 논증의 기초는 “성경에 그런 말이 없다”는 한마디입니다. 이것은 설명의 부정적인 부분이고, 그들은 이를 고집할 것입니다. 긍정적인 부분, 곧 왜 금지되는지에 대한 분명한 이해가 없습니다.</p><p>재림교인들은 사람의 몸이 죽은 뒤 영혼이 산다는 것을 믿지 않으므로 부분적으로 이해를 내놓을 수 있습니다. 그러나 재림교인들도 천사의 존재는 (아직) 부정하지 않으므로 천사에게 드리는 기도의 금지는 설명하지 못합니다. 성경에 따르면 천사들은 구원받는 이들에게 배정되어 사람의 구원을 돌봅니다(<a href="https://bibleox.com/ko/ko-nkrv/evr/1/#L14">히 1:14</a>). 왜 그들에게 아무 말도 할 수 없습니까? 그들은 이를 설명하지 못합니다.</p><p>다른 (신)개신교인들은 대부분 몸에서 떠난 뒤 영혼이 산다고 믿으며, 우리가 이미 지금 와 있는 천상 교회(<a href="https://bibleox.com/ko/ko-nkrv/evr/12/#L22-23">히 12:22-23</a>)와 왜 소통하면 안 되는지, 왜 족장과 사도와 순교자와 천사와 이야기하면 안 되는지 전혀 설명하지 못합니다. 물론 무언가를 내놓으려 하겠지만 언제나 설득력이 없을 것입니다. 예를 들어 성인들이 하느님의 안식에 들어갔으므로 지상의 일에 더 이상 신경 쓰지 않는다고 말할 것입니다. 그러나 그러면 같은 안식에 계신 하느님께서도 지상의 일에 신경 쓰지 않으신다는 결론이 나옵니다. 다른 설명 시도도 똑같이 불합리합니다.</p><p>성인들에게 기도해야 한다는 것은 성경에서 암묵적으로(단계적으로) 도출됩니다. 곧 드러나게 가리켜진 것이 아니라 함축되어 있습니다. 이것은 정상입니다. 성경에 모든 것이 직접 말해져 있지는 않기 때문입니다. 삼위일체 하느님에 관한 가장 중요한 가르침도 성경에서 암묵적으로 도출됩니다. 우리의 반대자들도 성경에서 많은 것을 암묵적으로 도출합니다. 예를 들어 유아에게 세례를 주면 안 된다는 말은 어디에도 없지만 그들은 근거 없이 그렇게 주장하며, 성경에 그런 말이 없어도 개의치 않습니다. 그들은 이 금지를 성경의 다른 진술에서 암묵적으로 도출하려 합니다. 그러므로 그들을 이 영역으로 이끌어, 성인들에게 기도하는 것을 금하는 이유를 이해할 수 있게 설명해 달라고 청하는 것이 매우 중요합니다.</p><p>벗이여, 또 기억하십시오. 성인들에게 드리는 기도의 반대자들은 전구 기도를 반대하는 것이 전혀 아닙니다(그들이 서로를 위해 기도할 때 서로에게 중재자임은 쉽게 증명됩니다. 아무리 반박해도 그렇습니다). 그들이 가장 반대하는 것은 <strong>지상 교회와 천상 교회의 친교</strong>, 곧 거룩한 영들, 거룩한 천사들과 거룩한 사람들, 하느님의 벗들과의 모든 친교입니다. 마치 지상 교회가 천상 교회에 토라져 말하기 싫어하는 듯하고, 그리스도의 몸의 한 부분이 같은 몸의 다른 부분과 소통하기를 원하지 않는 듯합니다. 그들은 한마디도 허락하지 못합니다. 우리를 돌보는 수호천사에게 감사하는 것조차 허락하지 않습니다. 영적 세계의 성인들과의 소통을 조금이라도 인정하면, 단계적으로 지상 교회와 천상 교회의 친교에 속하는 다른 모든 것도 인정할 수밖에 없기 때문입니다. 그러므로 질문 가운데 하나로, 성경에 매우 널리 나오는 천사와의 소통 가능성을 살펴볼 만합니다.</p>'
