  body: <ul><li><p>처음이요 마지막이신 분 (<a href="https://bibleox.com/ko/ko-nkrv/is/44/#L6">사 44:6</a>; <a href="https://bibleox.com/ko/ko-nkrv/is/48/#L12">사 48:12</a>)</p></li><li><p>너희 선조들의 하느님, 아브라함의 하느님, 이삭의 하느님, 야곱의 하느님 (<a href="https://bibleox.com/ko/ko-nkrv/ish/3/#L15">출 3:15</a>)</p></li><li><p>계시는 분 (<a href="https://bibleox.com/ko/ko-nkrv/ish/3/#L14">출 3:14</a>)</p></li><li><p>사랑 (<a href="https://bibleox.com/ko/ko-nkrv/1in/4/#L8">요일 4:8</a>)</p></li><li><p>지으신 분 (<a href="https://bibleox.com/ko/ko-nkrv/ps/149/#L2">시 149:2</a>)</p></li><li><p>아버지 (<a href="https://bibleox.com/ko/ko-nkrv/vtor/32/#L6">신 32:6</a>; <a href="https://bibleox.com/ko/ko-nkrv/is/64/#L7">사 64:7</a>)</p></li><li><p>구속자 (<a href="https://bibleox.com/ko/ko-nkrv/is/43/#L14">사 43:14</a>)</p></li><li><p>치료하시는 분 (<a href="https://bibleox.com/ko/ko-nkrv/ish/15/#L26">출 15:26</a>)</p></li><li><p>거룩하신 분 (<a href="https://bibleox.com/ko/ko-nkrv/lev/21/#L8">레 21:8</a>; <a href="https://bibleox.com/ko/ko-nkrv/lev/11/#L44-45">레 11:44-45</a>; <a href="https://bibleox.com/ko/ko-nkrv/is/40/#L25">사 40:25</a>)</p></li><li><p>거룩하게 하시는 분 (<a href="https://bibleox.com/ko/ko-nkrv/ish/31/#L13">출 31:13</a>; <a href="https://bibleox.com/ko/ko-nkrv/lev/20/#L8">레 20:8</a>; <a href="https://bibleox.com/ko/ko-nkrv/lev/21/#L15,23">레 21:15,23</a>; <a href="https://bibleox.com/ko/ko-nkrv/lev/22/#L9,16,32">레 22:9,16,32</a>)</p></li><li><p>숨어 계신 분 (<a href="https://bibleox.com/ko/ko-nkrv/is/45/#L15">사 45:15</a>)</p></li><li><p>의로우신 분 (<a href="https://bibleox.com/ko/ko-nkrv/vtor/32/#L4">신 32:4</a>)</p></li><li><p>진리 (<a href="https://bibleox.com/ko/ko-nkrv/vtor/32/#L4">신 32:4</a>)</p></li><li><p>질투하시는 분 (<a href="https://bibleox.com/ko/ko-nkrv/ish/34/#L14">출 34:14</a>; <a href="https://bibleox.com/ko/ko-nkrv/ish/20/#L5">출 20:5</a>; <a href="https://bibleox.com/ko/ko-nkrv/vtor/4/#L24">신 4:24</a>, <a href="https://bibleox.com/ko/ko-nkrv/vtor/5/#L9">신 5:9</a>)</p></li><li><p>벌하시는 분 (<a href="https://bibleox.com/ko/ko-nkrv/iez/7/#L9">겔 7:9</a>)</p></li><li><p>빛 (<a href="https://bibleox.com/ko/ko-nkrv/in/12/#L46">요 12:46</a>)</p></li><li><p>삼키는 불 (<a href="https://bibleox.com/ko/ko-nkrv/vtor/4/#L24">신 4:24</a>; <a href="https://bibleox.com/ko/ko-nkrv/evr/12/#L29">히 12:29</a>)</p></li></ul><p>*이 글은 아직 고쳐 쓰는 중입니다.</p>
