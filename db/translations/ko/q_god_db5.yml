- src: Бог-везде
  path: 93tj_하느님은어디에나계시다
  title: 하느님은 어디에나 계십니다
  copy_cover: true
  body: <blockquote><p>“이 지식이 내게 너무 기이하니 높아서 내가 능히 미치지 못하나이다 <strong>내가 주의 영을 떠나 어디로 가며 주의 앞에서 어디로 피하리이까</strong> <strong>내가 하늘에 올라갈지라도 거기 계시며 스올에 내 자리를 펼지라도 거기 계시니이다</strong> 내가 새벽 날개를 치며 바다 끝에 가서 거주할지라도 거기서도 주의 손이 나를 인도하시며 주의 오른손이 나를 붙드시리이다 내가 혹시 말하기를 흑암이 반드시 나를 덮고 나를 두른 빛은 밤이 되리라 할지라도 주에게서는 흑암이 숨기지 못하며 밤이 낮과 같이 비추이나니 주에게는 흑암과 빛이 같음이니이다” (<a href="https://bibleox.com/ko/ko-nkrv/ps/139/#L6-12">시 139:6-12</a>)</p></blockquote><blockquote><p>“모든 육체의 일이 그분 앞에 있으니, <strong>그분의 눈을 피해 숨을 수 없다</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/prsir/39/#L19">집회 39:19</a>, 그리스어에서 번역)</p></blockquote>
  meta_desc: 하느님께서 어디에나 계심에 관한 성경 구절
