  title: 수호천사
  copy_cover: true
  body: <h2>천사는 몸이 없는 영이다</h2><blockquote><p>“어느 때에 <strong><mark>천사</mark></strong> 중 누구에게 내가 네 원수로 네 발등상이 되게 하기까지 너는 내 우편에 앉아 있으라 하셨느냐 <strong><mark>모든 천사들은 섬기는 영으로서</mark></strong> 구원 받을 상속자들을 위하여 섬기라고 보내심이 아니냐” (<a href="https://bibleox.com/ko/ko-nkrv/evr/1/#L13-14">히 1:13-14</a>)</p></blockquote><blockquote><p>“내 손과 발을 보고 나인 줄 알라 또 나를 만져 보라 <strong><mark>영은 살과 뼈가 없으되</mark></strong> 너희 보는 바와 같이 나는 있느니라” (<a href="https://bibleox.com/ko/ko-nkrv/lk/24/#L39">눅 24:39</a>)</p></blockquote><h2>천사는 구원받을 사람들을 섬기라고 보내심을 받는다</h2><blockquote><p>“어느 때에 <strong><mark>천사</mark></strong> 중 누구에게 내가 네 원수로 네 발등상이 되게 하기까지 너는 내 우편에 앉아 있으라 하셨느냐 모든 천사들은 <strong><mark>섬기는 영으로서 구원 받을 상속자들을 위하여 섬기라고 보내심</mark></strong>이 아니냐” (<a href="https://bibleox.com/ko/ko-nkrv/evr/1/#L13-14">히 1:13-14</a>)</p></blockquote><h2>하느님을 경외하는 사람들과 함께하는 천사</h2><blockquote><p>“<strong><mark>여호와의 천사가 주를 경외하는 자를 둘러 진 치고 그들을 건지시는도다</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ps/34/#L7">시 34:7</a>)</p></blockquote><blockquote><p>“<strong>지존자의 은밀한 곳에 거주하며</strong> 전능자의 그늘 아래에 사는 자여, 나는 여호와를 향하여 말하기를 그는 나의 피난처요 나의 요새요 내가 의뢰하는 하나님이라 하리니 이는 그가 너를 새 사냥꾼의 올무에서와 심한 전염병에서 건지실 것임이로다 &lt;…&gt; 네가 말하기를 여호와는 나의 피난처시라 하고 <strong>지존자를 너의 거처로 삼았으므로</strong> <strong>화가 네게 미치지 못하며</strong> 재앙이 네 장막에 가까이 오지 못하리니 <strong><mark>그가 너를 위하여 그의 천사들을 명령하사 네 모든 길에서 너를 지키게 하심이라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ps/91/#L1-3,9-11">시 91:1-3,9-11</a>)</p></blockquote><h2>믿는 이들의 천사</h2><blockquote><p>“삼가 이 작은 자 중의 하나도 업신여기지 말라 너희에게 말하노니 <strong><mark>그들의 천사들</mark></strong>이 하늘에서 하늘에 계신 내 아버지의 얼굴을 항상 뵈옵느니라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/18/#L10">마 18:10</a>)</p></blockquote><h2>천사들은 의인들의 영혼을 내세로 인도한다</h2><blockquote><p>“이에 그 거지가 죽어 <strong><mark>천사들에게 받들려</mark></strong> 아브라함의 품에 들어가고 부자도 죽어 장사되매” (<a href="https://bibleox.com/ko/ko-nkrv/lk/16/#L22">눅 16:22</a>)</p></blockquote><h2>구약의 의인들과 그리스도인들이 천사를 믿음</h2><blockquote><p>“만일 <strong>일천 천사 가운데 하나가 그 사람의 중보자로</strong> 함께 있어서 <strong>그의 정당함을 보일진대</strong> 하나님이 그 사람을 불쌍히 여기사 <strong>그를 건져서 구덩이에 내려가지 않게 하라</strong> 내가 대속물을 얻었다 하시리라” (<a href="https://bibleox.com/ko/ko-nkrv/iov/33/#L23-24">욥 33:23-24</a>)</p></blockquote><blockquote><p>“베드로의 음성인 줄 알고 기뻐하여 문을 미처 열지 못하고 달려 들어가 말하되 베드로가 대문 밖에 섰더라 하니 그들이 말하되 네가 미쳤다 하나 여자 아이는 힘써 말하되 참말이라 하니 그들이 말하되 <strong>그러면 그의 천사라</strong> 하더라” (<a href="https://bibleox.com/ko/ko-nkrv/act/12/#L14-15">행 12:14-15</a>)</p></blockquote><h2>주님이시며 하느님이신 예수 그리스도의 천사들(사람으로서)</h2><h3>사람이신 예수 그리스도께 수호천사가 힘을 더하였다</h3><blockquote><p>“<strong>천사가 하늘로부터 예수께 나타나 힘을 더하더라</strong> 예수께서 힘쓰고 애써 더욱 간절히 기도하시니 땀이 땅에 떨어지는 핏방울 같이 되더라” (<a href="https://bibleox.com/ko/ko-nkrv/lk/22/#L43-44">눅 22:43-44</a>)</p></blockquote><h3>그리스도의 두 수호천사가 그분에 대하여 증언한다</h3><h4>두 천사가 함께</h4><blockquote><p>“마리아는 무덤 밖에 서서 울고 있더니 울면서 구부려 무덤 안을 들여다보니 <strong>흰 옷 입은 두 천사가 예수의 시체 뉘었던 곳에 하나는 머리 편에, 하나는 발 편에 앉았더라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/in/20/#L11-12">요 20:11-12</a>)</p></blockquote><blockquote><p>“들어가니 주 예수의 시체가 보이지 아니하더라 이로 인하여 근심할 때에 문득 <strong>찬란한 옷을 입은 두 사람이 곁에 섰는지라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/lk/24/#L3-4">눅 24:3-4</a>)</p></blockquote><blockquote><p>“올라가실 때에 제자들이 자세히 하늘을 쳐다보고 있는데 <strong>흰 옷 입은 두 사람이 그들 곁에 서서</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/act/1/#L10">행 1:10</a>)</p></blockquote><h4>무덤 밖의 한 천사</h4><blockquote><p>“큰 지진이 나며 <strong>주의 천사</strong>가 하늘로부터 내려와 <strong>돌을 굴려 내고 그 위에 앉았는데</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/28/#L2">마 28:2</a>)</p></blockquote><h4>무덤 안의 한 천사</h4><blockquote><p>“<strong>무덤에 들어가서 흰 옷을 입은 한 청년이</strong> 우편에 앉은 것을 보고 놀라매” (<a href="https://bibleox.com/ko/ko-nkrv/mk/16/#L5">막 16:5</a>)</p></blockquote><h2>천사가 사도를 풀어 주다</h2><blockquote><p>“<strong>홀연히 주의 사자가 나타나매 옥중에 광채가 빛나며 또 베드로의 옆구리를 쳐 깨워 이르되 급히 일어나라 하니</strong> 쇠사슬이 그 손에서 벗어지더라 천사가 이르되 띠를 띠고 신을 신으라 하거늘 베드로가 그대로 하니 천사가 또 이르되 겉옷을 입고 따라오라 한대 베드로가 나와서 따라갈새 천사가 하는 것이 생시인 줄 알지 못하고 환상을 보는가 하니라 이에 첫째와 둘째 파수를 지나 시내로 통한 쇠문에 이르니 문이 저절로 열리는지라 나와서 한 거리를 지나매 천사가 곧 떠나더라 이에 베드로가 정신이 들어 이르되 내가 이제야 참으로 주께서 그의 천사를 보내어 나를 헤롯의 손과 유대 백성의 모든 기대에서 벗어나게 하신 줄 알겠노라 하여 깨닫고 마가라 하는 요한의 어머니 마리아의 집에 가니 여러 사람이 거기에 모여 기도하고 있더라 베드로가 대문을 두드린대 로데라 하는 여자 아이가 영접하러 나왔다가 베드로의 음성인 줄 알고 기뻐하여 문을 미처 열지 못하고 달려 들어가 말하되 베드로가 대문 밖에 섰더라 하니 그들이 말하되 네가 미쳤다 하나 여자 아이는 힘써 말하되 참말이라 하니 그들이 말하되 <strong>그러면 그의 천사라</strong> 하더라” (<a href="https://bibleox.com/ko/ko-nkrv/act/12/#L7-15">행 12:7-15</a>)</p></blockquote>
