- src: диавол
  path: Dv1l_마귀
  title: 마귀(사탄)
  copy_cover: true
  body: <h2>마귀(사탄)는 타락한 천사다</h2><p>마귀는 하느님께서 창조하신 수많은 천사 가운데 하나였으나, 그 뒤 하느님을 섬기기를 원하지 않아 하느님에게서 떨어져 나가 타락하였습니다.</p><blockquote><p>“인자야 두로 왕을 위하여 슬픈 노래를 지어 그에게 이르기를 주 여호와의 말씀에 너는 완전한 도장이었고 지혜가 충족하며 온전히 아름다웠도다 네가 옛적에 하나님의 동산 에덴에 있어서 각종 보석 곧 홍보석과 황보석과 금강석과 황옥과 홍마노와 창옥과 청보석과 남보석과 홍옥과 황금으로 단장하였음이여 네가 지음을 받던 날에 너를 위하여 소고와 비파가 준비되었도다 <strong>너는 기름 부음을 받고 지키는 그룹임이여 내가 너를 세우매 네가 하나님의 성산에 있어서 불타는 돌들 사이에 왕래하였도다 네가 지음을 받던 날로부터 네 모든 길에 완전하더니 마침내 네게서 불의가 드러났도다</strong> 네 무역이 많으므로 네 가운데에 강포가 가득하여 <strong>네가 범죄하였도다 너 지키는 그룹아 그러므로 내가 너를 더럽게 여겨 하나님의 산에서 쫓아냈고</strong> 불타는 돌들 사이에서 멸하였도다 <strong>네가 아름다우므로 마음이 교만하였으며</strong> 네가 영화로우므로 네 지혜를 더럽혔음이여 <strong>내가 너를 땅에 던져</strong> 왕들 앞에 두어 그들의 구경 거리가 되게 하였도다 네가 죄악이 많고 무역이 불의하므로 네 모든 성소를 더럽혔음이여 <strong>내가 네 가운데에서 불을 내어 너를 사르게 하고</strong> 너를 보고 있는 모든 자 앞에서 너를 땅 위에 재가 되게 하였도다 만민 중에 너를 아는 자가 너로 말미암아 다 놀랄 것임이여 네가 공포의 대상이 되고 네가 영원히 다시 있지 못하리로다 하셨다 하라” (<a href="https://bibleox.com/ko/ko-nkrv/iez/28/#L12-19">겔 28:12-19</a>)</p></blockquote><p>하느님에게서 떨어져 나간 이런 천사들은 여러 이름으로 불립니다. 귀신(<a href="https://bibleox.com/ko/ko-nkrv/mf/8/#L31">마 8:31</a>; <a href="https://bibleox.com/ko/gr-lxx-byz/tov/6/#L8">토비 6:8</a>), 사탄의 사자(천사)(<a href="https://bibleox.com/ko/ko-nkrv/2kor/12/#L7">고후 12:7</a>), 더러운 귀신(영)(<a href="https://bibleox.com/ko/ko-nkrv/mf/10/#L1">마 10:1</a>), 악마(흔히 쓰는 말). 사탄은 또 뱀(<a href="https://bibleox.com/ko/ko-nkrv/gen/3/#L1">창 3:1</a>; <a href="https://bibleox.com/ko/ko-nkrv/is/27/#L1">사 27:1</a>; <a href="https://bibleox.com/ko/ko-nkrv/otkr/12/#L9">계 12:9</a>; <a href="https://bibleox.com/ko/ko-nkrv/otkr/20/#L2">계 20:2</a>), 용(<a href="https://bibleox.com/ko/ko-nkrv/otkr/12/#L9">계 12:9</a>; <a href="https://bibleox.com/ko/ko-nkrv/otkr/20/#L2">계 20:2</a>), 아침의 아들 계명성(<a href="https://bibleox.com/ko/ko-nkrv/is/14/#L12">사 14:12</a>), 리워야단(<a href="https://bibleox.com/ko/ko-nkrv/is/27/#L1">사 27:1</a>), 이 세상의 임금(<a href="https://bibleox.com/ko/ko-nkrv/in/12/#L31">요 12:31</a>), 악한 자(<a href="https://bibleox.com/ko/ko-nkrv/mf/13/#L19">마 13:19</a>), 거짓말하는 영(<a href="https://bibleox.com/ko/ko-nkrv/3ts/22/#L22">왕상 22:22</a>)이라고도 불립니다. 마귀는 비인격적인 감정도, 사람 안의 추상적인 충동도, 비유도 아닙니다. 마귀는 실제로 존재하는 인격입니다. 마귀는 처음으로 죄를 지은 존재입니다.</p><blockquote><p>“죄를 짓는 자는 마귀에게 속하나니 <strong>마귀는 처음부터 범죄함이라</strong> 하나님의 아들이 나타나신 것은 마귀의 일을 멸하려 하심이라” (<a href="https://bibleox.com/ko/ko-nkrv/1in/3/#L8">요일 3:8</a>)</p></blockquote><h2>마귀에게는 자기 뜻이 있다</h2><blockquote><p>“그들로 깨어 마귀의 올무에서 벗어나 하나님께 사로잡힌 바 되어 <strong>그 뜻을 따르게 하실까 함이라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2tim/2/#L26">딤후 2:26</a>) <em>(개역개정은 “하나님께 사로잡힌 바 되어 그 뜻을 따르게”로 옮겼지만, 그리스어 본문(ὑπ᾽ αὐτοῦ εἰς τὸ ἐκείνου θέλημα)은 “그(마귀)에게 사로잡혀 그의 뜻을 따르게”로도 읽을 수 있고, 러시아어 시노달 역본도 그렇게 옮깁니다. 이 글의 논지는 이 읽기에 근거합니다.)</em></p></blockquote><h2>마귀는 사람에게 악한 생각을 넣어 활동한다</h2><blockquote><p>“베드로가 이르되 아나니아야 <strong>어찌하여 사탄이 네 마음에 가득하여 네가 성령을 속이고</strong> 땅 값 얼마를 감추었느냐” (<a href="https://bibleox.com/ko/ko-nkrv/act/5/#L3">행 5:3</a>)</p></blockquote><blockquote><p>“<strong>마귀가 벌써 시몬의 아들 가룟 유다의 마음에 예수를 팔려는 생각을 넣었더라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/in/13/#L2">요 13:2</a>)</p></blockquote><h2>사탄은 하늘에서 떨어졌다</h2><blockquote><p>“예수께서 이르시되 <strong>사탄이 하늘로부터 번개 같이 떨어지는 것을 내가 보았노라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/lk/10/#L18">눅 10:18</a>; <a href="https://bibleox.com/ko/ko-nkrv/iez/28/#L12-19">겔 28:12-19</a>)</p></blockquote><h2>사탄은 다른 천사들도 끌고 갔다</h2><blockquote><p>“<strong>하나님이 범죄한 천사들을 용서하지 아니하시고</strong> 지옥에 던져 어두운 구덩이에 두어 심판 때까지 지키게 하셨으며” (<a href="https://bibleox.com/ko/ko-nkrv/2pet/2/#L4">벧후 2:4</a>)</p></blockquote><h2>마귀 때문에 세상에 죽음이 들어왔다</h2><blockquote><p>“그러나 <strong>악마의 시기로 죽음이 세상에 들어왔고</strong>, 그에게 속한 자들은 그것을 겪는다” (<a href="https://bibleox.com/ko/gr-lxx-byz/prs/2/#L24">지혜 2:24</a>, 그리스어에서 번역)</p></blockquote><h2>마귀는 사람들의 대적이다. 멸망으로 끌고 갈 사람을 찾는다</h2><blockquote><p>“근신하라 깨어라 <strong>너희 대적 마귀</strong>가 우는 사자 같이 두루 다니며 <strong>삼킬 자를 찾나니</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1pet/5/#L8">벧전 5:8</a>)</p></blockquote><h2>마귀는 사람의 구원을 대적한다</h2><blockquote><p>“이 비유는 이러하니라 씨는 하나님의 말씀이요 길 가에 있다는 것은 말씀을 들은 자니 이에 <strong>마귀가 가서</strong> 그들이 <strong>믿어 구원을 얻지 못하게 하려고 말씀을 그 마음에서 빼앗는 것이요</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/lk/8/#L11-12">눅 8:11-12</a>)</p></blockquote><blockquote><p>“대제사장 여호수아는 여호와의 천사 앞에 섰고 <strong>사탄은 그의 오른쪽에 서서 그를 대적하는 것을</strong> 여호와께서 내게 보이시니라” (<a href="https://bibleox.com/ko/ko-nkrv/zah/3/#L1">슥 3:1</a>)</p></blockquote><h2>마귀는 하느님의 천사로 가장한다</h2><blockquote><p>“이것은 이상한 일이 아니니라 <strong>사탄도 자기를 광명의 천사로 가장하나니</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2kor/11/#L14">고후 11:14</a>)</p></blockquote><h2>하느님께 복종하고 마귀를 물리치는 사람에게서 마귀는 달아난다</h2><blockquote><p>“그런즉 너희는 <strong>하나님께 복종할지어다 마귀를 대적하라 그리하면 너희를 피하리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/iak/4/#L7">약 4:7</a>)</p></blockquote><h2>마귀는 성경을 알고, 그 뜻을 비틀어 성경으로 유혹한다</h2><blockquote><p>“또 이끌고 예루살렘으로 가서 성전 꼭대기에 세우고 이르되 네가 만일 하나님의 아들이어든 <strong>여기서 뛰어내리라</strong> <strong>기록되었으되</strong> 하나님이 너를 위하여 그 사자들을 명하사 너를 지키게 하시리라 하였고 또한 그들이 손으로 너를 받들어 네 발이 돌에 부딪치지 않게 하시리라 하였느니라 예수께서 대답하여 이르시되 주 너의 하나님을 시험하지 말라 하였느니라” (<a href="https://bibleox.com/ko/ko-nkrv/lk/4/#L9-12">눅 4:9-12</a>)</p></blockquote><h2>마귀는 거짓의 아비다</h2><blockquote><p>“너희는 너희 아비 마귀에게서 났으니 너희 아비의 욕심대로 너희도 행하고자 하느니라 그는 처음부터 살인한 자요 <strong>진리가 그 속에 없으므로</strong> 진리에 서지 못하고 거짓을 말할 때마다 제 것으로 말하나니 이는 그가 <strong>거짓말쟁이요 거짓의 아비가 되었음이라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/in/8/#L44">요 8:44</a>)</p></blockquote><h2>마귀는 기적을 일으키고 하늘에서 불을 내릴 수 있다</h2><blockquote><p>“<strong>여호와께서 사탄에게 이르시되</strong> 내가 <strong>그의 소유물을 다 네 손에 맡기노라</strong> 다만 그의 몸에는 네 손을 대지 말지니라 사탄이 곧 여호와 앞에서 물러가니라 &lt;…&gt; 그가 아직 말하는 동안에 또 한 사람이 와서 아뢰되 <strong>하나님의 불이 하늘에서 떨어져서 양과 종들을 살라 버렸나이다</strong> 나만 홀로 피하였으므로 주인께 아뢰러 왔나이다” (<a href="https://bibleox.com/ko/ko-nkrv/iov/1/#L12,16">욥 1:12,16</a>)</p></blockquote><blockquote><p>“악한 자의 나타남은 <strong>사탄의 활동을 따라 모든 능력과 표적과 거짓 기적과</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2sol/2/#L9">살후 2:9</a>)</p></blockquote><h2>마귀는 하느님의 천사들과 다툰다</h2><blockquote><p>“<strong>천사장 미가엘이 모세의 시체에 관하여 마귀와 다투어 변론할 때에</strong> 감히 비방하는 판결을 내리지 못하고 다만 말하되 주께서 너를 꾸짖으시기를 원하노라 하였거늘” (<a href="https://bibleox.com/ko/ko-nkrv/iud/1/#L9">유 1:9</a>)</p></blockquote><h2>타락한 천사들을 위하여 영원한 고통의 장소가 예비되어 있다</h2><blockquote><p>“또 왼편에 있는 자들에게 이르시되 저주를 받은 자들아 나를 떠나 <strong>마귀와 그 사자들을 위하여 예비된 영원한 불</strong>에 들어가라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/25/#L41">마 25:41</a>)</p></blockquote><blockquote><p>“또 그들을 미혹하는 <strong>마귀가</strong> <strong>불과 유황 못에 던져지니</strong> 거기는 그 짐승과 거짓 선지자도 있어 세세토록 밤낮 괴로움을 받으리라” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/20/#L10">계 20:10</a>)</p></blockquote><h3>귀신들도 이를 안다</h3><blockquote><p>“이에 그들이 소리 질러 이르되 하나님의 아들이여 우리가 당신과 무슨 상관이 있나이까 <strong>때가 이르기 전에 우리를 괴롭게 하려고</strong> 여기 오셨나이까 하더니” (<a href="https://bibleox.com/ko/ko-nkrv/mf/8/#L29">마 8:29</a>)</p></blockquote><h2>귀신들은 하느님의 뜻을 자유롭게(스스로) 구하지 않지만, 하느님의 명령에 복종하지 않을 수 없다</h2><blockquote><p>“다 놀라 서로 물어 이르되 이는 어찜이냐 권위 있는 새 교훈이로다 <strong>더러운 귀신들에게 명한즉 순종하는도다</strong> 하더라” (<a href="https://bibleox.com/ko/ko-nkrv/mk/1/#L27">막 1:27</a>)</p></blockquote><blockquote><p>“귀신들이 예수께 간구하여 이르되 <strong>만일 우리를 쫓아 내시려면</strong> 돼지 떼에 들여 보내 주소서 하니” (<a href="https://bibleox.com/ko/ko-nkrv/mf/8/#L31">마 8:31</a>)</p></blockquote>
  meta_desc: 사탄은 하느님의 대적이며, 스스로 하느님을 섬기기를 그만두고 떨어져 나간 인격적 존재, 곧 천사(영)입니다
