    body: |-
      <h2>0</h2><p>이그나티오스 곧 테오포로스가, 우리 구세주 그리스도 예수 안에서 아버지 하느님의 은총으로 복을 받은, 마이안드로스 강가의 마그네시아에 있는 교회에 보냅니다. 나는 그분 안에서 이 교회에 문안하며, 아버지 하느님과 예수 그리스도 안에서 진심으로 기쁨을 빕니다.</p>
      <h2>1</h2><p>1. 하느님을 따르는 여러분의 사랑이 참으로 질서 정연하다는 것을 알고, 나는 기뻐하며 예수 그리스도께 대한 믿음 안에서 여러분에게 말을 건네기로 하였습니다.</p><p>2. 나는 하느님께 가장 합당한 이름[1]을 받았으므로, 지니고 다니는 이 사슬 속에서 교회들을 찬미하고 있습니다. 그리고 교회들 안에, 우리의 영원한 생명이신 예수 그리스도의 육과 영의 일치, 무엇보다 앞서는 믿음과 사랑의 일치, 그리고 무엇보다 중요한 예수님과 아버지의 일치가 있기를 기도합니다.</p><p>3. 그분 안에서 이 세상 권력자의 모든 공격을 견디어 내고 그것을 벗어나면, 우리는 하느님께 이를 것입니다.</p>
      <h2>2</h2><p>나는 하느님께 합당한 여러분의 주교 다마스와, 합당한 사제 바소스와 아폴로니오스, 그리고 나의 동료 종인 보제 조티온을 통하여 여러분을 볼 수 있게 되었습니다. 나는 조티온으로 말미암아 기쁨을 누리고 싶습니다. 그는 하느님의 은총에 순종하듯이 주교에게 순종하고, 예수 그리스도의 법에 순종하듯이 사제단에게 순종하기 때문입니다.</p>
      <h2>3</h2><p>1. 여러분도 주교가 젊다는 것을 기화로 그를 업신여겨서는 안 됩니다[2]. 아버지 하느님의 능력에 따라 그에게 모든 공경을 드려야 합니다. 내가 알기로는, 거룩한 사제들도 겉보기에 젊은 그의 나이를 얕보지 않고, 하느님 안에서 슬기로운 사람으로서 그에게 순종하고 있습니다. 그러나 그것은 그에게가 아니라, 예수 그리스도의 아버지, 곧 모든 이의 주교께 순종하는 것입니다.</p><p>2. 그러므로 우리를 원하신 그분의 영예를 위하여 위선 없이 순종하는 것이 마땅합니다. 눈에 보이는 이 주교를 속이는 사람은 사실 보이지 않는 분을 속이려는 것이기 때문입니다[3]. 이런 경우에 문제가 되는 것은 육이 아니라, 숨은 일을 아시는 하느님이십니다.</p>
      <h2>4</h2><p>그러므로 그리스도인이라고 불리기만 할 것이 아니라 실제로 그리스도인이어야 마땅합니다. 어떤 사람들은 주교라는 말을 입에 올리면서도 그를 제쳐 놓고 모든 일을 합니다. 이런 사람들은 양심을 따르는 것으로 보이지 않습니다. 계명에 따라 올바르게 모이지 않기 때문입니다[4].</p>
      <h2>5</h2><p>1. 모든 일에는 끝이 있고, 죽음과 생명이라는 두 가지가 함께 우리 앞에 놓여 있으며, 저마다 자기 자리로 가게 되어 있습니다.</p><p>2. 돈에 두 가지가 있어, 하나는 하느님의 것이고 하나는 세상의 것이며, 저마다 고유한 각인이 찍혀 있듯이, 믿지 않는 사람들은 이 세상의 각인을, 믿는 사람들은 사랑 안에서 예수 그리스도를 통한 아버지 하느님의 각인을 지니고 있습니다. 그분을 통하여 그분의 수난에 참여하여 죽기를 스스로 원하지 않는다면, 그분의 생명은 우리 안에 있지 않습니다[5].</p>
      <h2>6</h2><p>1. 앞에서 이름을 든 사람들 안에서 나는 믿음으로 여러분 모두를 보았고 사랑하였습니다. 그래서 권합니다. 하느님과 한마음이 되어 모든 일을 하도록 힘쓰십시오. 주교는 하느님의 자리에, 사제들은 사도들의 회의의 자리에 앉아 이끌고, 나에게 가장 정다운 보제들은 예수 그리스도를 섬기는 직무를 맡았습니다. 그분은 세상이 있기 전부터 아버지와 함께 계셨고, 마지막 때에 나타나셨습니다.</p><p>2. 그러므로 모두 하느님과 같은 마음을 받아 서로 존중하십시오. 아무도 이웃을 육의 눈으로 보지 말고, 예수 그리스도 안에서 늘 서로 사랑하십시오. 여러분을 갈라놓을 수 있는 것이 여러분 가운데 하나도 없어야 합니다. 주교와, 앞장서 이끄는 사람들과 하나가 되십시오. 그것이 불멸의 표징이 되고 가르침이 될 것입니다[6].</p>
      <h2>7</h2><p>1. 주님께서 아버지와 하나이시면서 당신 스스로도, 사도들을 통해서도 아버지를 떠나서는 아무것도 하지 않으셨듯이[7], 여러분도 주교와 사제들을 떠나서는 아무것도 하지 마십시오. 또 여러분끼리 따로 하는 일을 이치에 맞는 일처럼 보이게 하려고 하지 마십시오[8]. 오히려 함께 모여, 하나의 기도, 하나의 간구, 하나의 생각, 사랑과 흠 없는 기쁨 안에서 하나의 희망을 가지십시오. 그 기쁨이 곧 예수 그리스도이시며, 그분보다 더 좋은 것은 없습니다.</p><p>2. 모두 하나의 하느님 성전으로, 하나의 제단으로, 한 분 예수 그리스도께로 달려가듯이 모이십시오. 그분은 한 분이신 아버지에게서 나오셨고, 한 분과 함께 계셨으며, 한 분께로 돌아가셨습니다.</p>
      <h2>8</h2><p>1. 다른 가르침이나 쓸모없는 옛 꾸며낸 이야기에 속지 마십시오[9]. 우리가 지금까지도 유다교를 따라 산다면, 은총을 받지 못했다고 스스로 인정하는 것이기 때문입니다.</p><p>2. 가장 거룩한 예언자들은 그리스도 예수를 따라 살았습니다. 그 때문에 박해를 받은 것입니다. 그들은 그분의 은총에 감도되어, 순종하지 않는 사람들에게 하느님은 한 분이시며 당신 아드님 예수 그리스도를 통하여 당신 자신을 드러내셨다는 것을 확신시켰습니다. 이 아드님은 침묵에서 나오신 하느님의 말씀이시며[10], 모든 일에서 당신을 보내신 분의 마음에 드셨습니다.</p>
      <h2>9</h2><p>1. 옛 관습 속에서 살던 사람들이 새로운 희망에 이르러 더 이상 안식일을 지키지 않고 주님의 날[11]을 따라 살고 있다면—그날에 그분과 그분의 죽음을 통하여 우리의 생명도 떠올랐습니다. 어떤 사람들은 이 죽음을 부인하지만, 우리는 이 신비를 통하여 믿음을 받았고, 우리의 유일한 스승이신 예수 그리스도의 제자로 드러나기 위하여 인내하고 있습니다—</p><p>2. 어떻게 우리가 그분을 떠나 살 수 있겠습니까? 예언자들도 영으로는 그분의 제자였고, 그분을 스승으로 기다렸습니다. 그러므로 그들이 올바르게 기다리던 분께서 오셨을 때, 그들을 죽은 이들 가운데서 일으키셨습니다[12].</p>
      <h2>10</h2><p>1. 그러므로 우리는 그분의 자비에 무감각해서는 안 됩니다. 그분께서 우리가 하는 대로 우리에게 갚으신다면[13], 우리는 더 이상 남아 있지 못할 것입니다. 그러므로 그분의 제자가 된 우리는 그리스도교[14]를 따라 사는 법을 배웁시다. 이 이름이 아닌 다른 이름으로 불리는 사람은 하느님의 사람이 아닙니다.</p><p>2. 그러므로 오래되어 시어진 나쁜 누룩을 버리고, 새 누룩, 곧 예수 그리스도로 바뀌십시오[15]. 그분 안에서 소금으로 간이 배게 하십시오. 여러분 가운데 아무도 썩지 않게 하려는 것입니다. 여러분은 그 냄새로 가려질 것입니다.</p><p>3. 예수 그리스도를 입에 올리면서 유다교를 따라 사는 것은 터무니없는 일입니다. 그리스도교가 유다교를 믿은 것이 아니라 유다교가 그리스도교를 믿은 것이며, 하느님을 믿은 모든 말을 하는 민족들이 그 그리스도교로 모여들었기 때문입니다[16].</p>
      <h2>11</h2><p>사랑하는 여러분, 내가 이것을 쓰는 것은 여러분 가운데 누군가가 그렇다는 것을 알았기 때문이 아닙니다. 여러분보다 보잘것없는 사람으로서, 여러분이 헛된 영광의 낚싯바늘에 걸리지 않도록 미리 지켜 주고 싶은 것입니다. 오히려 본티오 빌라도가 총독이던 때에 일어난 탄생과 수난과 부활에 대하여 확신을 가지십시오. 이것은 우리의 희망이신 예수 그리스도께서 참으로, 그리고 확실하게 이루신 일입니다. 여러분 가운데 아무도 이 희망에서 벗어나지 않기를 빕니다.</p>
      <h2>12</h2><p>내가 합당한 사람이라면, 모든 일에서 여러분으로 말미암아 기쁨을 누리고 싶습니다. 나는 묶여 있지만, 풀려나 있는 여러분 가운데 한 사람에게도 미치지 못합니다. 여러분이 교만하지 않다는 것을 나는 압니다. 여러분은 자기 안에 예수 그리스도를 모시고 있기 때문입니다. 오히려 내가 여러분을 칭찬하면 여러분이 부끄러워한다는 것을 압니다. "의인은 자기 자신을 고발하는 사람이다"[17] 하고 기록되어 있는 대로입니다.</p>
      <h2>13</h2><p>1. 그러므로 주님과 사도들의 가르침 안에 굳건히 서도록 힘쓰십시오. 그리하여 여러분이 하는 모든 일이 육과 영에서, 믿음과 사랑에서, 아들과 아버지와 성령 안에서, 처음과 끝에서 순조롭게 이루어지기를 바랍니다. 가장 존경스러운 여러분의 주교와, 아름답게 엮인 영적인 화관인 여러분의 사제단과, 하느님을 따르는 보제들과 함께 말입니다.</p><p>2. 주교에게 순종하고 서로 순종하십시오. 예수 그리스도께서 아버지께 순종하시고, 사도들이 그리스도와 아버지께 순종하였듯이 말입니다. 그것은 육과 영의 일치가 있게 하려는 것입니다[18].</p>
      <h2>14</h2><p>여러분이 하느님으로 가득 차 있음을 알기에 짧게 권하였습니다. 여러분의 기도 가운데 나를 기억해 주십시오. 내가 하느님께 이르기 위해서입니다. 또 시리아에 있는 교회도 기억해 주십시오. 나는 그 교회의 사람이라고 불릴 자격도 없습니다. 시리아의 교회가 여러분의 교회를 통하여 이슬에 젖듯 새로워질 자격을 얻도록, 나는 하느님 안에서 하나 된 여러분의 기도와 사랑이 필요합니다.</p>
      <h2>15</h2><p>에페소 사람들[19]이 하느님의 영광을 위하여 스미르나에 와 있으면서 여러분에게 문안합니다. 나도 그 스미르나에서 여러분에게 이 편지를 씁니다. 그들은 여러분과 마찬가지로, 스미르나 사람들의 주교 폴리카르포스와 함께 모든 면에서 나를 쉬게 해 주었습니다. 다른 교회들도 예수 그리스도의 영예 안에서 여러분에게 문안합니다. 하느님과 한마음이 되어, 갈라지지 않는 영—그분은 예수 그리스도이십니다—을 지니고 안녕히 계십시오.</p>
    references: |-
      <ol><li><p>θεοπρεπέστατον ὄνομα. 그리스도를 위하여 묶여 순교를 향해 가는 사람이라는 영예로운 이름을 가리키는 것으로 보입니다. '하느님을 모신 사람'(테오포로스)이라는 이름으로 보는 사람도 있습니다.</p></li><li><p>νεωτερικὴ τάξις — '젊음(겉보기의 젊은 나이)'. 마그네시아의 주교 다마스가 젊었다는 것을 가리킵니다(<a href="https://bibleox.com/ko/ko-ctb/1tim/4/#L12">1디모 4:12</a> 참조). 주교직이 새로운 제도라는 뜻으로 보는 학자들도 있습니다.</p></li><li><p>보이지 않는 주교는 아버지 하느님이십니다(3:1 '모든 이의 주교').</p></li><li><p>주교와 사제들을 제쳐 놓고 따로 모이는 것을 가리킵니다.</p></li><li><p><a href="https://bibleox.com/ko/ko-ctb/rim/6/#L3-5">로마 6:3-5</a> 참조.</p></li><li><p>주교와의 일치는 불멸의 생명을 비추어 보여 주는 표징이며, 그것을 사람들에게 가르치는 것이기도 하다는 뜻으로 풀이됩니다.</p></li><li><p><a href="https://bibleox.com/ko/ko-ctb/in/5/#L19">요한 5:19</a>, <a href="https://bibleox.com/ko/ko-ctb/in/5/#L30">5:30</a>, <a href="https://bibleox.com/ko/ko-ctb/in/8/#L28">요한 8:28</a> 참조.</p></li><li><p>주교와 사제들을 떠난 별도의 모임을 말합니다.</p></li><li><p><a href="https://bibleox.com/ko/ko-ctb/1tim/1/#L4">1디모 1:4</a>, <a href="https://bibleox.com/ko/ko-ctb/1tim/4/#L7">4:7</a>, <a href="https://bibleox.com/ko/ko-ctb/tit/1/#L14">디도 1:14</a> 참조.</p></li><li><p>λόγος ἀπὸ σιγῆς προελθών. 하느님의 영원한 침묵 뒤에 말씀께서 세상에 나타나셨다는 뜻입니다(<a href="https://bibleox.com/ko/ko/w/Ig2E_에페소교회에보낸편지#HH-19">「에페소 교회에 보낸 편지」 19:1</a>, <a href="https://bibleox.com/ko/ko-ctb/rim/16/#L25-26">로마 16:25-26</a> 참조). 후대의 사본(러시아어 번역은 이를 따름)은 '영원한 말씀으로서 침묵에서 나오지 않으신 분'(λόγος ἀΐδιος οὐκ ἀπὸ σιγῆς προελθών)으로 읽습니다. 영지주의자들이 '침묵'(시게)을 신적인 존재의 하나로 여겼기 때문에, 그것과 혼동되지 않도록 고친 것으로 보입니다.</p></li><li><p>κυριακή — 주님의 날, 곧 일요일(<a href="https://bibleox.com/ko/ko-ctb/otkr/1/#L10">묵시 1:10</a>). 일부 사본에는 '주님의 생명을 따라 산다'(κατὰ κυριακὴν ζωήν).</p></li><li><p><a href="https://bibleox.com/ko/ko-ctb/mf/27/#L52-53">마태 27:52-53</a> 참조.</p></li><li><p>직역하면 '그분께서 우리가 하는 대로 우리를 본받으신다면'. 우리의 죄대로 갚으신다면, 이라는 뜻입니다(<a href="https://bibleox.com/ko/ko-ctb/ps/130/#L3">시편 130:3</a> 참조).</p></li><li><p>Χριστιανισμός. '그리스도교'라는 말은 남아 있는 문헌 가운데 이그나티오스의 편지에 처음 나타납니다(<a href="https://bibleox.com/ko/ko/w/Ig2R_로마교회에보낸편지#HH-3">「로마 교회에 보낸 편지」 3:3</a>, <a href="https://bibleox.com/ko/ko/w/Ig2F_필라델피아교회에보낸편지#HH-6">「필라델피아 교회에 보낸 편지」 6:1</a> 참조). '그리스도인'이라는 이름에 대해서는 <a href="https://bibleox.com/ko/ko-ctb/act/11/#L26">사도 11:26</a> 참조.</p></li><li><p><a href="https://bibleox.com/ko/ko-ctb/1kor/5/#L7-8">1고린 5:7-8</a> 참조.</p></li><li><p><a href="https://bibleox.com/ko/ko-ctb/is/66/#L18">이사 66:18</a> 참조.</p></li><li><p><a href="https://bibleox.com/ko/ko-ctb/pr/18/#L17">잠언 18:17</a>(칠십인역에 따름. 공동번역은 히브리어 본문에서 번역하여 표현이 다름).</p></li><li><p>바깥의 일치와 안의 일치(<a href="https://bibleox.com/ko/ko-ctb/ef/4/#L4">에페 4:4</a> 참조).</p></li><li><p>이그나티오스를 위해 스미르나에 와 있던 에페소의 그리스도인들(<a href="https://bibleox.com/ko/ko/w/Ig2E_에페소교회에보낸편지#HH-1">「에페소 교회에 보낸 편지」 1:3</a>, <a href="https://bibleox.com/ko/ko/w/Ig2E_에페소교회에보낸편지#HH-2">「에페소 교회에 보낸 편지」 2:1</a> 참조).</p></li></ol>
      <p>번역: 로디온 블라소프 (AI 도구 활용). 저본: 그리스어 원문(<a href="https://bibleox.com/ko/grc/w/ΙγνΘ_Μαγ">이 사이트의 그리스어판</a>. 명백한 누락은 라이트풋판과 홈스판으로 보충함). 참고: 러시아어 번역(『초기 교부 선집』, 브뤼셀, 1988년), 영어 번역(Roberts–Donaldson), 프랑스어 번역(Genoude, 1837년). 성경 인용과 링크는 공동번역 성서에 따름.</p>
