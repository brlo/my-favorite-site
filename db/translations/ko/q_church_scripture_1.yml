  body: <ol><li><p><a href="https://bibleox.com/ko/ko-nkrv/rim/1/">롬 1:</a> — 로마에 가기 전에 서신을 먼저 보냄;</p></li><li><p><a href="https://bibleox.com/ko/ko-nkrv/1kor/1/">고전 1:</a> — 근친상간한 자, 파당을 짓는 일, 애찬의 무질서, 방언의 은사를 내세워 자기를 높이는 일을 책망함;</p></li><li><p><a href="https://bibleox.com/ko/ko-nkrv/2kor/1/">고후 1:</a> — 자기 사도직의 증거, 헌금을 권함;</p></li><li><p><a href="https://bibleox.com/ko/ko-nkrv/gal/1/">갈 1:</a> — 그리스도인에게 할례가 필요하다는 거짓 가르침을 책망함;</p></li><li><p><a href="https://bibleox.com/ko/ko-nkrv/ef/1/">엡 1:</a> — 하느님의 신비를 묵상한 것을 나누고, 슬퍼하는 이들을 위로함;</p></li><li><p><a href="https://bibleox.com/ko/ko-nkrv/fil/1/">빌 1:</a> — 사도를 가장 사랑한 교회에 보낸 문안 서신;</p></li><li><p><a href="https://bibleox.com/ko/ko-nkrv/kol/1/">골 1:</a> — 거짓 가르침, 곧 영지주의와 철학과 유대교의 거짓 가르침이 뒤섞인 것을 반박함;</p></li><li><p><a href="https://bibleox.com/ko/ko-nkrv/1sol/1/">살전 1:</a> — 죽은 이들의 운명에 관해 위로하고 도덕적 병을 고침;</p></li><li><p><a href="https://bibleox.com/ko/ko-nkrv/2sol/1/">살후 1:</a> — 재림에 관한 가르침을 분명히 함;</p></li><li><p><a href="https://bibleox.com/ko/ko-nkrv/1tim/1/">딤전 1:</a> — 에베소에서 거짓 교사들의 힘이 커지던 때에 디모데를 격려하고 가르침;</p></li><li><p><a href="https://bibleox.com/ko/ko-nkrv/2tim/1/">딤후 1:</a> — 죽음을 앞둔 사도의 유언;</p></li><li><p><a href="https://bibleox.com/ko/ko-nkrv/tit/1/">딛 1:</a> — 그레데 사람들 가운데서 디도에게 권위를 줌;</p></li><li><p><a href="https://bibleox.com/ko/ko-nkrv/fm/1/">몬 1:</a> — 빌레몬을 그의 종 오네시모와 화해시키려 함;</p></li><li><p><a href="https://bibleox.com/ko/ko-nkrv/evr/1/">히 1:</a> — 유대교로 되돌아가는 그리스도인들, 옛 언약보다 새 언약이 뛰어남을 증언하고, 그리스도인들에게 슬픔을 견디라고 격려함.</p></li></ol>
  title_sub: 사도 바울이 서신을 쓴 이유
