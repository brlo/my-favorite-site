  title: 성경
  copy_cover: true
  body: <h2>하느님께서는 성경을 통해 말씀하십니다</h2><blockquote><p>“이 복음은 <strong>하나님이</strong> <strong>선지자들을 통하여</strong> 그의 아들에 관하여 <strong>성경에 미리 약속하신 것이라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/rim/1/#L2">롬 1:2</a>)</p></blockquote><blockquote><p>“형제들아 <strong>성령이</strong> 다윗의 입을 통하여 예수 잡는 자들의 길잡이가 된 유다를 가리켜 <strong>미리 말씀하신 성경이</strong> 응하였으니 마땅하도다” (<a href="https://bibleox.com/ko/ko-nkrv/act/1/#L16">행 1:16</a>)</p></blockquote><blockquote><p>“<strong>모든 성경은 하나님의 감동으로 된 것으로</strong> 교훈과 책망과 바르게 함과 의로 교육하기에 유익하니” (<a href="https://bibleox.com/ko/ko-nkrv/2tim/3/#L16">딤후 3:16</a>)</p></blockquote><h2>사도들의 설교는 하느님의 말씀입니다</h2><blockquote><p>“살라미에 이르러 <strong><mark>하나님의 말씀을 유대인의 여러 회당에서 전할새</mark></strong> 요한을 수행원으로 두었더라” (<a href="https://bibleox.com/ko/ko-nkrv/act/13/#L5">행 13:5</a>)</p></blockquote><blockquote><p>“데살로니가에 있는 유대인들은 <strong><mark>바울이 하나님의 말씀을 베뢰아에서도 전하는 줄을</mark></strong> 알고 거기도 가서 무리를 움직여 소동하게 하거늘” (<a href="https://bibleox.com/ko/ko-nkrv/act/17/#L13">행 17:13</a>)</p></blockquote><blockquote><p>“이러므로 우리가 하나님께 끊임없이 감사함은 <strong><mark>너희가 우리에게 들은 바 하나님의 말씀을 받을 때에 사람의 말로 받지 아니하고 하나님의 말씀으로 받음이니 진실로 그러하도다</mark></strong> 이 말씀이 또한 너희 믿는 자 가운데에서 역사하느니라” (<a href="https://bibleox.com/ko/ko-nkrv/1sol/2/#L13">살전 2:13</a>)</p></blockquote><h2>성경을 읽으라는 구세주의 명령</h2><blockquote><p>“너희가 성경에서 영생을 얻는 줄 생각하고 <strong>성경을 연구하거니와</strong> 이 성경이 곧 내게 대하여 증언하는 것이니라” (<a href="https://bibleox.com/ko/ko-nkrv/in/5/#L39">요 5:39</a>)</p></blockquote><blockquote><p>“예수께서 대답하여 이르시되 <strong>너희가 성경도, 하나님의 능력도 알지 못하는 고로 오해하였도다</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/22/#L29">마 22:29</a>; <a href="https://bibleox.com/ko/ko-nkrv/mk/12/#L24">막 12:24</a>)</p></blockquote><h2>성경을 읽는 것은 구원에 유익합니다</h2><blockquote><p>“또 어려서부터 성경을 알았나니 <strong>성경은 능히 너로 하여금 그리스도 예수 안에 있는 믿음으로 말미암아 구원에 이르는 지혜가 있게 하느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2tim/3/#L15">딤후 3:15</a>)</p></blockquote><h2>성경은 폐하지 못합니다</h2><blockquote><p>“<strong>성경은 폐하지 못하나니</strong> 하나님의 말씀을 받은 사람들을 신이라 하셨거든” (<a href="https://bibleox.com/ko/ko-nkrv/in/10/#L35">요 10:35</a>)</p></blockquote><h3>성경은 지난 역사의 기록이 아니라 오늘의 사람을 위해 기록되었습니다</h3><blockquote><p>“무엇이든지 전에 기록된 바는 <strong>우리의 교훈을 위하여 기록된 것이니</strong> 우리로 하여금 인내로 또는 성경의 위로로 소망을 가지게 함이니라” (<a href="https://bibleox.com/ko/ko-nkrv/rim/15/#L4">롬 15:4</a>)</p></blockquote><h2>성경을 깨닫는 일</h2><blockquote><p>“먼저 알 것은 <strong>성경의 모든 예언은 사사로이 풀 것이 아니니</strong> 예언은 언제든지 사람의 뜻으로 낸 것이 아니요 오직 <strong>성령의 감동하심을 받은 사람들이</strong> 하나님께 받아 말한 것임이라” (<a href="https://bibleox.com/ko/ko-nkrv/2pet/1/#L20-21">벧후 1:20-21</a>)</p></blockquote><h3>사도들은 성경을 알았지만 구세주의 설명이 필요했습니다</h3><blockquote><p>“이에 모세와 모든 선지자의 글로 시작하여 <strong>모든 성경에 쓴 바 자기에 관한 것을 자세히 설명하시니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/lk/24/#L27">눅 24:27</a>; <a href="https://bibleox.com/ko/ko-nkrv/lk/24/#L32">눅 24:32</a>)</p></blockquote><h3>하느님께서 사도들에게 성경을 깨닫는 능력을 주셨습니다</h3><blockquote><p>“이에 <strong>그들의 마음을 열어 성경을 깨닫게 하시고</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/lk/24/#L45">눅 24:45</a>)</p></blockquote><h3>사도들은 회당에서 유대인들에게 성경을 바르게 깨닫도록 가르쳤습니다</h3><blockquote><p>“밤에 형제들이 곧 바울과 실라를 베뢰아로 보내니 그들이 이르러 유대인의 회당에 들어가니라 베뢰아에 있는 사람들은 데살로니가에 있는 사람들보다 더 너그러워서 간절한 마음으로 말씀을 받고 <strong>이것이 그러한가 하여 날마다 성경을 상고하므로</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/act/17/#L10-11">행 17:10-11</a>)</p></blockquote><h3>성경의 모든 것이 쉽게 이해되지는 않습니다. 무식한 자들은 성경을 억지로 풉니다</h3><blockquote><p>“또 그 모든 <strong>편지에도</strong> 이런 일에 관하여 말하였으되 <strong>그 중에 알기 어려운 것이 더러 있으니</strong> 무식한 자들과 굳세지 못한 자들이 다른 성경과 같이 그것도 억지로 풀다가 스스로 멸망에 이르느니라” (<a href="https://bibleox.com/ko/ko-nkrv/2pet/3/#L16">벧후 3:16</a>)</p></blockquote><h3>유대인 아볼로는 성경으로 예수께서 그리스도이심을 증언했습니다</h3><blockquote><p>“이는 <strong>성경으로써 예수는 그리스도라고 증언하여</strong> 공중 앞에서 힘있게 유대인의 말을 이김이러라” (<a href="https://bibleox.com/ko/ko-nkrv/act/18/#L28">행 18:28</a>)</p></blockquote>
