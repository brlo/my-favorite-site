  references: "<p>번역: 로디온 블라소프 (AI 도구 활용). 저본: 러시아어 원문. 참고: 영어·일본어 번역. 성경 인용과 링크는 개역개정에 따름.</p>"
- src: Предание
  path: Tr4n_거룩한_전승
  title: 거룩한 전승(성전, 聖傳)
  copy_cover: true
  body: <h2>전승이란 무엇인가?</h2><p>전승은 하느님 아버지의 계시입니다. 아버지께서는 당신의 독생자를 통해 이 계시를 사도들에게 전하셨고, 사도들은 교회의 나머지 사람들에게 전했으며, 교회는 말(입으로 하는 말과 글)과 행위로 이것을 대대로 전합니다. 개역개정은 παράδοσις를 “전통”으로 옮깁니다:</p><blockquote><p>“<strong>나는 아버지께서 내게 주신 말씀들을 그들에게 주었사오며 그들은 이것을 받고</strong> 내가 아버지께로부터 나온 줄을 참으로 아오며 아버지께서 나를 보내신 줄도 믿었사옵나이다” (<a href="https://bibleox.com/ko/ko-nkrv/in/17/#L8">요 17:8</a>)</p></blockquote><blockquote><p>“<strong>너희가 모든 일에 나를 기억하고 또 내가 너희에게 전하여 준 대로 그 전통을 너희가 지키므로</strong> 너희를 칭찬하노라” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/11/#L2">고전 11:2</a>)</p></blockquote><h2>전승은 글만이 아니라 신앙을 전하는 들은 말이기도 합니다</h2><blockquote><p>“이러므로 우리가 하나님께 끊임없이 감사함은 <strong><mark>너희가 우리에게 들은 바 하나님의 말씀을 받을 때에</mark></strong> 사람의 말로 받지 아니하고 하나님의 말씀으로 받음이니 진실로 그러하도다 이 말씀이 또한 너희 믿는 자 가운데에서 역사하느니라” (<a href="https://bibleox.com/ko/ko-nkrv/1sol/2/#L13">살전 2:13</a>)</p></blockquote><blockquote><p>“너는 그리스도 예수 안에 있는 믿음과 사랑으로써 <strong><mark>내게 들은 바 바른 말을 본받아 지키고</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2tim/1/#L13">딤후 1:13</a>)</p></blockquote><blockquote><p>“또 네가 많은 증인 앞에서 <strong><mark>내게 들은 바를</mark></strong> <strong>충성된 사람들에게 부탁하라</strong> 그들이 또 다른 사람들을 가르칠 수 있으리라” (<a href="https://bibleox.com/ko/ko-nkrv/2tim/2/#L2">딤후 2:2</a>)</p></blockquote><blockquote><p>“그러므로 형제들아 <strong>굳건하게 서서</strong> <strong><mark>말로나</mark></strong> <strong>우리의 편지로</strong> <strong>가르침을 받은 전통을 지키라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2sol/2/#L15">살후 2:15</a>)</p></blockquote><blockquote><p>“너희는 <strong>처음부터 들은 것을 너희 안에 거하게 하라</strong> <strong><mark>처음부터 들은 것이 너희 안에 거하면 너희가 아들과 아버지 안에 거하리라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1in/2/#L24">요일 2:24</a>)</p></blockquote><blockquote><p>“<strong><mark>너희가 모든 일에 나를 기억하고</mark></strong> 또 내가 너희에게 전하여 준 대로 그 전통을 너희가 지키므로 너희를 칭찬하노라” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/11/#L2">고전 11:2</a>)</p></blockquote><blockquote><p>“그러므로 <strong><mark>네가 어떻게 받았으며 어떻게 들었는지 생각하고 지켜</mark></strong> 회개하라 만일 일깨지 아니하면 내가 도둑 같이 이르리니 어느 때에 네게 이를는지 네가 알지 못하리라” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/3/#L3">계 3:3</a>)</p></blockquote><h2>사도들은 전승을 사용했습니다</h2><p>사도는 성경에 이름이 나오지 않는 애굽의 두 술사의 이름을 듭니다:</p><blockquote><p>“<strong>얀네와 얌브레가</strong> 모세를 대적한 것 같이 그들도 진리를 대적하니 이 사람들은 그 마음이 부패한 자요 믿음에 관하여는 버림 받은 자들이라” (<a href="https://bibleox.com/ko/ko-nkrv/2tim/3/#L8">딤후 3:8</a>)</p></blockquote><p>사도 유다는 성경에 없는 논쟁을 이야기합니다:</p><blockquote><p>“<strong>천사장 미가엘이 모세의 시체에 관하여 마귀와 다투어 변론할 때에</strong> 감히 비방하는 판결을 내리지 못하고 다만 말하되 주께서 너를 꾸짖으시기를 원하노라 하였거늘” (<a href="https://bibleox.com/ko/ko-nkrv/iud/1/#L9">유 1:9</a>)</p></blockquote><p>성경에 없는 에녹의 말에 대해:</p><blockquote><p>“아담의 칠대 손 <strong>에녹이</strong> 이 사람들에 대하여도 <strong>예언하여 이르되 보라 주께서 그 수만의 거룩한 자와 함께 임하셨나니</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/iud/1/#L14">유 1:14</a>)</p></blockquote><p>사도 바울은 나무 속에 숨었다가 톱으로 켜져 죽은 선지자 이사야를 말합니다:</p><blockquote><p>“돌로 치는 것과 <strong>톱으로 켜는 것과</strong> 시험과 칼로 죽임을 당하고 양과 염소의 가죽을 입고 유리하여 궁핍과 환난과 학대를 받았으니” (<a href="https://bibleox.com/ko/ko-nkrv/evr/11/#L37">히 11:37</a>)</p></blockquote><p>복음서 저자 누가는 목격자들에게서 들은 말을 바탕으로, 곧 전승을 받아 복음서를 기록합니다:</p><blockquote><p>“우리 중에 이루어진 사실에 대하여 <strong>처음부터 목격자와 말씀의 일꾼 된 자들이 전하여 준 그대로</strong> 내력을 저술하려고 붓을 든 사람이 많은지라 그 모든 일을 근원부터 자세히 미루어 살핀 나도 데오빌로 각하에게 차례대로 써 보내는 것이 좋은 줄 알았노니” (<a href="https://bibleox.com/ko/ko-nkrv/lk/1/#L1-3">눅 1:1-3</a>)</p></blockquote><h3>사도들은 복음서에 없는 내용을 전합니다</h3><p>사도 바울은 에베소의 목자들과 이야기하면서 복음서에 없는 구세주 그리스도의 가르침을 가리킵니다:</p><blockquote><p>“범사에 여러분에게 모본을 보여준 바와 같이 수고하여 약한 사람들을 돕고 또 <strong>주 예수께서 친히 말씀하신 바 주는 것이 받는 것보다 복이 있다 하심을</strong> 기억하여야 할지니라” (<a href="https://bibleox.com/ko/ko-nkrv/act/20/#L35">행 20:35</a>)</p></blockquote><p>부활하신 그리스도께서 많은 사람에게 나타나신 일도 전하는데, 이것 역시 복음서에 기록되어 있지 않습니다:</p><blockquote><p>“그 후에 <strong>오백여 형제에게 일시에 보이셨나니</strong> 그 중에 지금까지 대다수는 살아 있고 어떤 사람은 잠들었으며 그 후에 야고보에게 보이셨으며 그 후에 모든 사도에게와” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/15/#L6-7">고전 15:6-7</a>)</p></blockquote><h2>전승의 중요성</h2><p>그릇된 가르침은 하느님께로 이끌지 않습니다:</p><blockquote><p>“<strong>지나쳐 그리스도의 교훈 안에 거하지 아니하는 자는 다 하나님을 모시지 못하되</strong> 교훈 안에 거하는 그 사람은 아버지와 아들을 모시느니라” (<a href="https://bibleox.com/ko/ko-nkrv/2in/1/#L9">요이 1:9</a>)</p></blockquote><p>이단(거짓 가르침)은 하느님 나라를 유업으로 받지 못합니다:</p><blockquote><p>“우상 숭배와 주술과 원수 맺는 것과 분쟁과 시기와 분냄과 당 짓는 것과 분열함과 <strong>이단과</strong> 투기와 술 취함과 방탕함과 또 그와 같은 것들이라 전에 너희에게 경계한 것 같이 경계하노니 이런 일을 하는 자들은 <strong>하나님의 나라를 유업으로 받지 못할 것이요</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gal/5/#L20-21">갈 5:20-21</a>)</p></blockquote><h2>전승이 필요한 이유</h2><p>성경이 예수 그리스도에 관한 모든 정보의 원천은 아닙니다:</p><blockquote><p>“예수께서 제자들 앞에서 <strong>이 책에 기록되지 아니한</strong> 다른 표적도 많이 행하셨으나 오직 이것을 기록함은 너희로 예수께서 하나님의 아들 그리스도이심을 믿게 하려 함이요 또 너희로 믿고 그 이름을 힘입어 생명을 얻게 하려 함이니라” (<a href="https://bibleox.com/ko/ko-nkrv/in/20/#L30-31">요 20:30-31</a>)</p></blockquote><blockquote><p>“<strong>예수께서 행하신 일이 이 외에도 많으니</strong> 만일 낱낱이 기록된다면 이 세상이라도 이 기록된 책을 두기에 부족할 줄 아노라” (<a href="https://bibleox.com/ko/ko-nkrv/in/21/#L25">요 21:25</a>)</p></blockquote><p>어느 서신에도 세례를 바르게 베푸는 법, 보제와 사제와 주교를 세우는 법에 관한 가르침이 없습니다:</p><blockquote><p>“그러므로 우리가 그리스도의 도의 초보를 버리고 죽은 행실을 회개함과 하나님께 대한 신앙과 <strong>세례들과 안수와</strong> 죽은 자의 부활과 영원한 심판에 관한 교훈의 <strong>터를 다시 닦지 말고</strong> 완전한 데로 나아갈지니라” (<a href="https://bibleox.com/ko/ko-nkrv/evr/6/#L1-2">히 6:1-2</a>)</p></blockquote><p>위에서 보았듯이 사도들은 어떤 내용을 입으로 전하기를 원했습니다:</p><blockquote><p>“내가 너희에게 쓸 것이 많으나 <strong>종이와 먹으로 쓰기를 원하지 아니하고</strong> 오히려 너희에게 가서 대면하여 말하려 하니 이는 너희 기쁨을 충만하게 하려 함이라” (<a href="https://bibleox.com/ko/ko-nkrv/2in/1/#L12">요이 1:12</a>)</p></blockquote><blockquote><p>“<strong>내가 네게 쓸 것이 많으나 먹과 붓으로 쓰기를 원하지 아니하고</strong> <strong>속히 보기를 바라노니 또한 우리가 대면하여 말하리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/3in/1/#L13-14">요삼 1:13-14</a>)</p></blockquote><p>사도 바울은 서신으로만이 아니라 말로도 받은 전승(사도들의 가르침)을 지키라고 당부합니다:</p><blockquote><p>“그러므로 형제들아 굳건하게 서서 <strong>말로나</strong> 우리의 편지로 <strong>가르침을 받은</strong> 전통을 지키라” (<a href="https://bibleox.com/ko/ko-nkrv/2sol/2/#L15">살후 2:15</a>)</p></blockquote><blockquote><p>“또 네가 많은 증인 앞에서 <strong>내게 들은 바를 충성된 사람들에게 부탁하라</strong> 그들이 또 다른 사람들을 가르칠 수 있으리라” (<a href="https://bibleox.com/ko/ko-nkrv/2tim/2/#L2">딤후 2:2</a>)</p></blockquote><h3>사도들의 입으로 한 설교 기간</h3><p>사도 바울은 아시아의 장로들을 3년 동안 밤낮으로 가르쳤습니다:</p><blockquote><p>“그러므로 여러분이 일깨어 <strong><mark>내가 삼 년이나 밤낮 쉬지 않고 눈물로 각 사람을 훈계하던</mark></strong> 것을 기억하라” (<a href="https://bibleox.com/ko/ko-nkrv/act/20/#L31">행 20:31</a>)</p></blockquote><p>고린도에서는 1년 6개월 동안 공동체를 가르쳤습니다:</p><blockquote><p>“그 후에 바울이 아덴을 떠나 고린도에 이르러 &lt;…&gt; <strong><mark>일 년 육 개월을 머물며 그들 가운데서 하나님의 말씀을 가르치니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/act/18/#L1,11">행 18:1,11</a>)</p></blockquote><p>에베소에서는 처음 석 달 동안 회당에서, 그 뒤 두 해 동안 서원에서 제자들과 함께 설교했습니다:</p><blockquote><p>“바울이 회당에 들어가 <strong>석 달 동안</strong> 담대히 하나님 나라에 관하여 강론하며 권면하되 어떤 사람들은 마음이 굳어 순종하지 않고 무리 앞에서 이 도를 비방하거늘 바울이 그들을 떠나 <strong>제자들을 따로 세우고 두란노 서원에서 날마다 강론하니라</strong> <strong><mark>두 해 동안 이같이 하니</mark></strong> 아시아에 사는 자는 유대인이나 헬라인이나 다 주의 말씀을 듣더라” (<a href="https://bibleox.com/ko/ko-nkrv/act/19/#L8-10">행 19:8-10</a>)</p></blockquote><p>사도 바울 한 사람만 해도 회심한 33-34년부터 세상을 떠난 64-67년까지 적어도 30년 동안 설교했습니다.</p><h2>전승을 지키고 그에 따라 가르치라는 명령</h2><blockquote><p>“내가 마게도냐로 갈 때에 너를 권하여 에베소에 머물라 한 것은 어떤 사람들을 명하여 <strong>다른 교훈을 가르치지 말며</strong> 신화와 족보에 끝없이 몰두하지 말게 하려 함이라 이런 것은 믿음 안에 있는 하나님의 경륜을 이룸보다 도리어 변론을 내는 것이라” (<a href="https://bibleox.com/ko/ko-nkrv/1tim/1/#L3-4">딤전 1:3-4</a>)</p></blockquote><blockquote><p>“또 네가 많은 증인 앞에서 <strong>내게 들은 바를 충성된 사람들에게 부탁하라</strong> 그들이 또 다른 사람들을 가르칠 수 있으리라” (<a href="https://bibleox.com/ko/ko-nkrv/2tim/2/#L2">딤후 2:2</a>)</p></blockquote><blockquote><p>“그러므로 형제들아 <strong>굳건하게 서서</strong> <strong>말로나</strong> <strong>우리의 편지로</strong> <strong>가르침을 받은 전통을 지키라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2sol/2/#L15">살후 2:15</a>)</p></blockquote><blockquote><p>“너희가 모든 일에 나를 기억하고 또 내가 너희에게 전하여 준 대로 <strong>그 전통을 너희가 지키므로</strong> 너희를 칭찬하노라” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/11/#L2">고전 11:2</a>)</p></blockquote><blockquote><p>“형제들아 내가 너희에게 전한 복음을 너희에게 알게 하노니 이는 너희가 받은 것이요 또 그 가운데 선 것이라 너희가 만일 <strong>내가 전한 그 말을 굳게 지키고</strong> 헛되이 믿지 아니하였으면 그로 말미암아 구원을 받으리라” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/15/#L1-2">고전 15:1-2</a>)</p></blockquote><blockquote><p>“사랑하는 자들아 우리가 일반으로 받은 구원에 관하여 내가 너희에게 편지하려는 생각이 간절하던 차에 <strong>성도에게 단번에 주신 믿음의 도를 위하여 힘써 싸우라</strong>는 편지로 너희를 권하여야 할 필요를 느꼈노니” (<a href="https://bibleox.com/ko/ko-nkrv/iud/1/#L3">유 1:3</a>)</p></blockquote><blockquote><p>“그러므로 형제들아 우리가 끝으로 주 예수 안에서 너희에게 구하고 <strong>권면하노니</strong> <strong>너희가 마땅히 어떻게 행하며 하나님을 기쁘시게 할 수 있는지를 우리에게 배웠으니 곧 너희가 행하는 바라 더욱 많이 힘쓰라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1sol/4/#L1">살전 4:1</a>)</p></blockquote><blockquote><p>“<strong>미쁜 말씀의 가르침을 그대로 지켜야 하리니</strong> 이는 능히 바른 교훈으로 권면하고 거슬러 말하는 자들을 책망하게 하려 함이라 <strong>불순종하고 헛된 말을 하며 속이는 자가 많은 중</strong> 할례파 가운데 특히 그러하니 그들의 입을 막을 것이라 이런 자들이 더러운 이득을 취하려고 마땅하지 아니한 것을 가르쳐 가정들을 온통 무너뜨리는도다” (<a href="https://bibleox.com/ko/ko-nkrv/tit/1/#L9-11">딛 1:9-11</a>)</p></blockquote><blockquote><p>“뱀이 그 간계로 하와를 미혹한 것 같이 너희 마음이 그리스도를 향하는 진실함과 깨끗함에서 떠나 부패할까 두려워하노라 만일 누가 가서 <strong>우리가 전파하지 아니한 다른 예수를 전파하거나</strong> 혹은 너희가 받지 아니한 다른 영을 받게 하거나 혹은 <strong>너희가 받지 아니한 다른 복음을</strong> 받게 할 때에는 너희가 잘 용납하는구나 &lt;…&gt; 그런 사람들은 거짓 사도요 속이는 일꾼이니 자기를 그리스도의 사도로 가장하는 자들이니라 이것은 이상한 일이 아니니라 사탄도 자기를 광명의 천사로 가장하나니 그러므로 사탄의 일꾼들도 자기를 의의 일꾼으로 가장하는 것이 또한 대단한 일이 아니니라 그들의 마지막은 그 행위대로 되리라” (<a href="https://bibleox.com/ko/ko-nkrv/2kor/11/#L3-4,13-15">고후 11:3-4,13-15</a>)</p></blockquote><h2>새 가르침을 들여오는 이들을 멀리하십시오</h2><blockquote><p>“<strong>이단에 속한 사람을 한두 번 훈계한 후에 멀리하라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/tit/3/#L10">딛 3:10</a>)</p></blockquote><blockquote><p>“<strong>누구든지 다른 교훈을 하며</strong> 바른 말 곧 우리 주 예수 그리스도의 말씀과 경건에 관한 교훈을 따르지 아니하면 <strong>그는 교만하여 아무 것도 알지 못하고 변론과 언쟁을 좋아하는 자니</strong> 이로써 투기와 분쟁과 비방과 악한 생각이 나며 마음이 부패하여지고 진리를 잃어 버려 경건을 이익의 방도로 생각하는 자들의 다툼이 일어나느니라” (<a href="https://bibleox.com/ko/ko-nkrv/1tim/6/#L3-5">딤전 6:3-5</a>) <em>(비잔틴 본문(다수 사본)에는 끝에 <strong>“이런 자들에게서 떠나라”</strong>(ἀφίστασο ἀπὸ τῶν τοιούτων)가 이어집니다.)</em></p></blockquote><blockquote><p>“디모데야 <strong>망령되고 헛된 말과 거짓된 지식의 반론을 피함으로</strong> <strong>네게 부탁한 것을 지키라</strong> 이것을 따르는 사람들이 있어 믿음에서 벗어났느니라 은혜가 너희와 함께 있을지어다” (<a href="https://bibleox.com/ko/ko-nkrv/1tim/6/#L20-21">딤전 6:20-21</a>)</p></blockquote><blockquote><p>“형제들아 우리 주 예수 그리스도의 이름으로 너희를 명하노니 게으르게 행하고 <strong>우리에게서 받은 전통대로 행하지 아니하는</strong> <strong>모든 형제에게서 떠나라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2sol/3/#L6">살후 3:6</a>)</p></blockquote><blockquote><p>“형제들아 내가 너희를 권하노니 <strong>너희가 배운 교훈을 거슬러 분쟁을 일으키거나 거치게 하는 자들을 살피고 그들에게서 떠나라</strong> 이같은 자들은 우리 주 그리스도를 섬기지 아니하고 다만 자기들의 배만 섬기나니 교활한 말과 아첨하는 말로 순진한 자들의 마음을 미혹하느니라” (<a href="https://bibleox.com/ko/ko-nkrv/rim/16/#L17-18">롬 16:17-18</a>)</p></blockquote><blockquote><p>“<strong>누구든지 이 교훈을 가지지 않고 너희에게 나아가거든 그를 집에 들이지도 말고</strong> 인사도 하지 말라 그에게 인사하는 자는 그 악한 일에 참여하는 자임이라” (<a href="https://bibleox.com/ko/ko-nkrv/2in/1/#L10-11">요이 1:10-11</a>)</p></blockquote><blockquote><p>“그러나 우리나 혹은 하늘로부터 온 천사라도 <strong>우리가 너희에게 전한 복음 외에 다른 복음을 전하면 저주를 받을지어다</strong> 우리가 전에 말하였거니와 내가 지금 다시 말하노니 <strong>만일 누구든지 너희가 받은 것 외에 다른 복음을 전하면 저주를 받을지어다</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gal/1/#L8-9">갈 1:8-9</a>)</p></blockquote><p><strong>아나테마</strong>(그리스어 ἀνάθεμα, 개역개정 “저주”) — 교회에서 끊어짐.</p><h2>전승을 왜곡하는 것(이단)을 드러내십시오</h2><blockquote><p>“<strong>죽기까지 진리를 위해 싸워라.</strong> 주 하느님께서 너를 위해 싸워 주시리라” (<a href="https://bibleox.com/ko/gr-lxx-byz/prsir/4/#L28">집회 4:28</a>, 그리스어에서 번역) <em>(러시아어 성경에서는 4:32.)</em></p></blockquote><blockquote><p>“사랑하는 자들아 우리가 일반으로 받은 구원에 관하여 내가 너희에게 편지하려는 생각이 간절하던 차에 <strong>성도에게 단번에 주신 믿음의 도를 위하여 힘써 싸우라</strong>는 편지로 너희를 권하여야 할 필요를 느꼈노니” (<a href="https://bibleox.com/ko/ko-nkrv/iud/1/#L3">유 1:3</a>)</p></blockquote><blockquote><p>“어떤 의심하는 자들을 긍휼히 여기라 또 어떤 자를 <strong>불에서 끌어내어 구원하라</strong> 또 어떤 자를 그 육체로 더럽힌 옷까지도 미워하되 두려움으로 긍휼히 여기라” (<a href="https://bibleox.com/ko/ko-nkrv/iud/1/#L22-23">유 1:22-23</a>) <em>(러시아어 시노달 번역은 일부 고대 사본을 따라 여기에 “책망하라”(ἐλέγχετε)를 넣습니다.)</em></p></blockquote><blockquote><p>“너희는 열매 없는 어둠의 일에 참여하지 말고 <strong>도리어 책망하라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ef/5/#L11">엡 5:11</a>)</p></blockquote>
