  title: 성경은 하느님의 받아쓰기가 아닙니다
  copy_cover: true
  body: <p>성경의 구절들은 하느님의 영의 감동으로(하느님의 감동으로) 기록되었지만 하느님께서 불러 주신 것을 받아쓴 것이 아니며, 기록한 이들은 하느님 손에 쥐어진 연필처럼 인격 없는 도구가 아닙니다. 목자였던 선지자는 쉬운 말로 쓰고, 왕궁 출신의 선지자는 많이 배운 사람처럼 씁니다. 둘 다 자기 삶의 방식에 맞는 예를 듭니다. 그래서 다른 사도들은 사도 바울의 서신에 알기 어려운 것이 있다고 씁니다:</p><blockquote><p>“또 그 모든 편지에도 이런 일에 관하여 말하였으되 그 중에 <strong>알기 어려운 것이 더러 있으니</strong> 무식한 자들과 굳세지 못한 자들이 다른 성경과 같이 그것도 억지로 풀다가 스스로 멸망에 이르느니라” (<a href="https://bibleox.com/ko/ko-nkrv/2pet/3/#L16">벧후 3:16</a>)</p></blockquote><p>사도 바울 자신도 말에는 부족하지만 지식에는 그렇지 않다고 말합니다:</p><blockquote><p>“내가 비록 <strong>말에는 부족하나</strong> 지식에는 그렇지 아니하니 이것을 우리가 모든 사람 가운데서 모든 일로 너희에게 나타내었노라” (<a href="https://bibleox.com/ko/ko-nkrv/2kor/11/#L6">고후 11:6</a>)</p></blockquote><p>곧 그는 지식이 모자라지 않지만 자기가 할 수 있는 대로 씁니다. 실제로 사도 바울은 배운 바리새인으로서 복잡한 의미 구조를 씁니다. 더구나 때로 사도들은 자기 이름으로 쓴다고 바로 말합니다:</p><blockquote><p>“처녀에 대하여는 <strong>내가 주께 받은 계명이 없으되</strong> 주의 자비하심을 받아서 충성스러운 자가 된 내가 <strong>의견을 말하노니</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/7/#L25">고전 7:25</a>)</p></blockquote><p>성경은 하느님과 사람이 함께 이룬 일(협력, 시너지)이라고 하는 편이 더 정확할 것입니다:</p><blockquote><p>“우리는 <strong>하나님의 동역자들이요</strong> 너희는 하나님의 밭이요 하나님의 집이니라” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/3/#L9">고전 3:9</a>)</p></blockquote>
  menu:
    parent: 교회/성경
    title: 성경은 받아쓰기가 아닙니다
