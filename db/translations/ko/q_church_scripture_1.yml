- src: толкование-писания
  path: Ip7w_성경_해석
  title: 성경 해석
  copy_cover: true
  body: <h2>성경을 읽는 것은 구원에 유익합니다</h2><p>사도 바울은 성경을 공부하는 것이 구원받는 데 도움이 될 수 있다고 말합니다:</p><blockquote><p>“또 어려서부터 성경을 알았나니 <strong>성경은 능히 너로 하여금 그리스도 예수 안에 있는 믿음으로 말미암아 구원에 이르는 지혜가 있게 하느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2tim/3/#L15">딤후 3:15</a>)</p></blockquote><p>그러나 교회의 가르침 없이 성경을 그릇되게 해석하면 사람은 멸망에 이를 수 있습니다:</p><blockquote><p>“또 우리 주의 오래 참으심이 구원이 될 줄로 여기라 우리가 사랑하는 형제 바울도 그 받은 지혜대로 너희에게 이같이 썼고 또 <strong>그 모든 편지에도</strong> 이런 일에 관하여 말하였으되 그 중에 알기 어려운 것이 더러 있으니 <strong><mark>무식한 자들과 굳세지 못한 자들이</mark></strong> <strong><mark>다른 성경과 같이 그것도 억지로 풀다가 스스로 멸망에 이르느니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2pet/3/#L15-16">벧후 3:15-16</a>)</p></blockquote><h2>성경을 바르게 해석해야 합니다</h2><h3>성령으로 기록된 것은 성령을 지닌 이들이 깨닫습니다</h3><p>성령의 감동을 받은 사람들이 기록한 것은 같은 성령의 감동을 받은 같은 부류의 사람들만 바르게 깨달을 수 있습니다:</p><blockquote><p>“또 <strong>우리에게는 더 확실한 예언이 있어</strong> 어두운 데를 비추는 등불과 같으니 날이 새어 샛별이 너희 마음에 떠오르기까지 <strong>너희가 이것을 주의하는 것이 옳으니라</strong> 먼저 알 것은 <strong>성경의 모든 예언은 사사로이 풀 것이 아니니</strong> 예언은 언제든지 사람의 뜻으로 낸 것이 아니요 <strong>오직 성령의 감동하심을 받은 사람들이 하나님께 받아 말한 것임이라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2pet/1/#L19-21">벧후 1:19-21</a>)</p></blockquote><h3>성경을 그릇되게 해석하면 멸망에 이를 수 있습니다</h3><p>교회 안에 굳게 서지 못한 무지한 사람들은 성경을 해석하다가 스스로 멸망에 이릅니다:</p><blockquote><p>“또 우리 주의 오래 참으심이 구원이 될 줄로 여기라 우리가 사랑하는 형제 바울도 그 받은 지혜대로 너희에게 이같이 썼고 또 <strong>그 모든 편지에도</strong> 이런 일에 관하여 말하였으되 그 중에 알기 어려운 것이 더러 있으니 <strong><mark>무식한 자들과 굳세지 못한 자들이</mark></strong> <strong><mark>다른 성경과 같이 그것도 억지로 풀다가 스스로 멸망에 이르느니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2pet/3/#L15-16">벧후 3:15-16</a>)</p></blockquote><p>또 사도는 성경 공부 자체를, 자기가 이미 설교로 직접 가르친 것에 더해지는 일종의 보탬으로 제시합니다:</p><blockquote><p>“그러나 <strong>너는 배우고 확신한 일에 거하라</strong> 너는 네가 누구에게서 배운 것을 알며 <strong><mark>또 어려서부터 성경을 알았나니</mark></strong> 성경은 능히 너로 하여금 그리스도 예수 안에 있는 믿음으로 말미암아 구원에 이르는 지혜가 있게 하느니라” (<a href="https://bibleox.com/ko/ko-nkrv/2tim/3/#L14-15">딤후 3:14-15</a>) <em>(“또” — 앞에서 말한 것에 더하여. 곧 성경을 아는 것은 기초, 곧 사도에게서 받은 가르침에 더해질 때 유익합니다.)</em></p></blockquote><p>다음 절이 이 생각을 확인해 줍니다:</p><blockquote><p>“<strong>모든 성경은</strong> 하나님의 감동으로 된 것으로 <strong>교훈과 책망과 바르게 함과 의로 교육하기에 유익하니</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2tim/3/#L16">딤후 3:16</a>)</p></blockquote><p>곧 성경은 홀로 서 있는 것이 아니라, 디모데 주교가 가르치고 책망하고 바르게 하고 교육하는 일, 곧 사도적 신앙을 <strong>전하는</strong>(전승하는) 일에 쓰는 유익한 도구입니다.</p><blockquote><p>“<strong>미쁜 말씀의 가르침을 그대로 지켜야 하리니</strong> 이는 능히 바른 교훈으로 권면하고 거슬러 말하는 자들을 책망하게 하려 함이라 <strong>불순종하고 헛된 말을 하며 속이는 자가 많은 중</strong> 할례파 가운데 특히 그러하니 그들의 입을 막을 것이라 이런 자들이 더러운 이득을 취하려고 마땅하지 아니한 것을 가르쳐 가정들을 온통 무너뜨리는도다” (<a href="https://bibleox.com/ko/ko-nkrv/tit/1/#L9-11">딛 1:9-11</a>)</p></blockquote><h3>사도들은 그리스도의 말씀을 잘못 알아들었습니다</h3><blockquote><p>“제자들이 건너편으로 갈새 떡 가져가기를 잊었더니 예수께서 이르시되 삼가 바리새인과 사두개인들의 누룩을 주의하라 하시니 제자들이 서로 논의하여 이르되 우리가 떡을 가져오지 아니하였도다 하거늘 예수께서 아시고 이르시되 믿음이 작은 자들아 어찌 떡이 없으므로 서로 논의하느냐 <strong>너희가 아직도 깨닫지 못하느냐</strong> 떡 다섯 개로 오천 명을 먹이고 주운 것이 몇 바구니며 떡 일곱 개로 사천 명을 먹이고 주운 것이 몇 광주리였는지를 기억하지 못하느냐 <strong>어찌 내 말한 것이 떡에 관함이 아닌 줄을 깨닫지 못하느냐</strong> 오직 바리새인과 사두개인들의 누룩을 주의하라 하시니 그제서야 제자들이 떡의 누룩이 아니요 바리새인과 사두개인들의 교훈을 삼가라고 말씀하신 줄을 깨달으니라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/16/#L5-12">마 16:5-12</a>)</p></blockquote><h3>에디오피아 내시는 성경을 깨닫지 못했습니다</h3><blockquote><p>“성령이 빌립더러 이르시되 이 수레로 가까이 나아가라 하시거늘 빌립이 달려가서 선지자 이사야의 글 읽는 것을 듣고 말하되 읽는 것을 깨닫느냐 대답하되 <strong>지도해 주는 사람이 없으니 어찌 깨달을 수 있느냐</strong> 하고 빌립을 청하여 수레에 올라 같이 앉으라 하니라” (<a href="https://bibleox.com/ko/ko-nkrv/act/8/#L29-31">행 8:29-31</a>)</p></blockquote><h3>그리스도께서는 사도들에게 성경의 예언을 풀어 주셨습니다</h3><blockquote><p>“이르시되 미련하고 선지자들이 말한 모든 것을 마음에 더디 믿는 자들이여 그리스도가 이런 고난을 받고 자기의 영광에 들어가야 할 것이 아니냐 하시고 이에 <strong>모세와 모든 선지자의 글로 시작하여 모든 성경에 쓴 바 자기에 관한 것을 자세히 설명하시니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/lk/24/#L25-27">눅 24:25-27</a>)</p></blockquote><h2>구약</h2><h3>성경을 해석해야 합니다</h3><p>구약에서도 성경을 백성 앞에서 그냥 읽기만 한 것이 아니라, 제사장 에스라가 다른 지혜로운 이들과 함께 백성이 깨닫도록 해석을 덧붙였습니다:</p><blockquote><p>“그 때에 학사 에스라가 특별히 지은 나무 강단에 서고 그의 곁 오른쪽에 선 자는 맛디댜와 스마와 아나야와 우리야와 힐기야와 마아세야요 그의 왼쪽에 선 자는 브다야와 미사엘과 말기야와 하숨과 하스밧다나와 스가랴와 므술람이라 &lt;…&gt; 하나님의 율법책을 낭독하고 <strong>그 뜻을 해석하여</strong> <strong>백성에게 그 낭독하는 것을 다 깨닫게 하니</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/neem/8/#L4,8">느 8:4,8</a>)</p></blockquote>
  title_sub: 성경을 바르게 깨닫는 일에 관한 성경 구절
