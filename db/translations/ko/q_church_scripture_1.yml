  references: "<p>번역: 로디온 블라소프 (AI 도구 활용). 저본: 러시아어 원문. 참고: 영어·일본어 번역. 성경 인용과 링크는 개역개정에 따름.</p>"
- src: евангелисты-обращаются-к-Септуагинте
  path: Lx6s_복음서_저자들은_칠십인역을_인용합니다
  title: 복음서 저자들은 칠십인역을 인용합니다
  copy_cover: true
  body: '<h2>칠십인역(LXX)이란 무엇인가?</h2><p><strong>칠십인역</strong>(라틴어 Septuaginta, “칠십”, 줄여서 LXX)은 기원전 3-2세기에 일흔(일흔둘) 명의 유대인 번역자가 구약 성경의 책들을 히브리어에서 고대 그리스어로 옮긴 번역입니다.</p><p>이 그리스어 본문 외에 히브리어 본문, 곧 마소라 본문이 있습니다.</p><p><strong>마소라 본문</strong>은 구약 성경의 히브리어 본문으로, 7-10세기에 모음 부호가 붙었습니다. 모음 부호란 무엇입니까? 간단히 말하면 낱말 위아래에 붙인 여러 획과 점으로, 낱말에 빠져 있는 모음과 읽는 법의 특징을 알려 주어 낱말을 바르게 읽게 해 줍니다. 이런 부호를 발음 구별 부호라고 합니다. 히브리어 본문은 자음만으로 이루어져 있었으므로, 읽는 전통(전승)을 아는 사람만 바르게 읽을 수 있었습니다. 모음 부호는 본문에 하나의 분명한 읽기를 주려고 붙였습니다.</p><p>칠십인역이 중요한 까닭은, 그것이 유대 백성이 예수를 그리스도요 하느님으로 거부하기 전에 마련된 유대인 자신의 본문이기 때문입니다. 곧 그때는 아직 성경을 주 예수 그리스도의 자리가 점점 줄어들도록 이해할 필요가 없었습니다. 또 모든 번역은 언제나 해석이라는 점을 기억해야 합니다. 칠십인역은 언어와 전승을 몸에 지닌 이들이, 읽을 수 있는 사람이 적은 히브리어에서 많은 이가 알아듣는 그리스어로 옮긴 해석이자 번역입니다.</p><p>(참고: 개역개정을 비롯한 한국어 구약 번역은 대부분 마소라 본문을 옮긴 것입니다. 그래서 아래에서 칠십인역의 읽기는 그리스어에서 직접 옮겼습니다.)</p><h2>처녀인가, 젊은 여자인가</h2><p>복음서 저자 마태는 그리스도께서 처녀에게서 나시리라는 이사야의 예언을 가리킵니다:</p><blockquote><p>“보라 <strong>처녀가</strong> 잉태하여 아들을 낳을 것이요 그의 이름은 임마누엘이라 하리라 하셨으니 이를 번역한즉 하나님이 우리와 함께 계시다 함이라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/1/#L23">마 1:23</a>)</p></blockquote><p>칠십인역에 따르면 그리스도께서는 처녀에게서 나셔야 했습니다:</p><blockquote><p>“보라, <strong>처녀가</strong> 잉태하여 아들을 낳으리니” (<a href="https://bibleox.com/ko/gr-lxx-byz/is/7/#L14">사 7:14</a>)</p></blockquote><p>그러나 마소라 본문에는 혼인하지 않은 젊은 여자, 히브리어 עַלְמָ֗ה(알마)가 있습니다. NRSV는 “젊은 여자”(young woman)로 옮깁니다. 개역개정은 마태복음을 따라 “처녀”로 옮겼습니다:</p><blockquote><p>“그러므로 주께서 친히 징조를 너희에게 주실 것이라 보라 <strong>처녀가</strong> 잉태하여 아들을 낳을 것이요 그의 이름을 임마누엘이라 하리라” (<a href="https://bibleox.com/ko/ko-nkrv/is/7/#L14">사 7:14</a>)</p></blockquote><h2>지팡이인가, 침상 머리인가</h2><p>사도 바울은 히브리서(!)에서 야곱이 지팡이 머리에 의지하여 경배한 일을 상기시킵니다:</p><blockquote><p>“믿음으로 야곱은 죽을 때에 요셉의 각 아들에게 축복하고 그 <strong>지팡이 머리에 의지하여</strong> 경배하였으며” (<a href="https://bibleox.com/ko/ko-nkrv/evr/11/#L21">히 11:21</a>)</p></blockquote><p>칠십인역에 따르면 야곱은 지팡이 끝에 경배했습니다:</p><blockquote><p>“이스라엘이 <strong>그 지팡이 끝에</strong> 경배하였다” (<a href="https://bibleox.com/ko/gr-lxx-byz/gen/47/#L31">창 47:31</a>)</p></blockquote><p>그러나 마소라 본문에 따르면 야곱은 침상 머리에서 경배했습니다. 히브리어 מִּטָּֽה(밋타, “침상”):</p><blockquote><p>“야곱이 또 이르되 내게 맹세하라 하매 그가 맹세하니 이스라엘이 <strong>침상 머리에서</strong> 하나님께 경배하니라” (<a href="https://bibleox.com/ko/ko-nkrv/gen/47/#L31">창 47:31</a>)</p></blockquote><h2>주 예수 그리스도의 족보에 나오는 가이난</h2><p>복음서 저자 누가는 구세주의 족보를 들면서 살라와 아박삿 사이에 가이난을 언급합니다:</p><blockquote><p>“그 위는 스룩이요 그 위는 르우요 그 위는 벨렉이요 그 위는 헤버요 그 위는 살라요 <strong>그 위는 가이난이요</strong> 그 위는 아박삿이요 그 위는 셈이요 그 위는 노아요 그 위는 레멕이요 그 위는 므두셀라요 그 위는 에녹이요 그 위는 야렛이요 그 위는 마할랄렐이요 그 위는 가이난이요 그 위는 에노스요 그 위는 셋이요 그 위는 아담이요 그 위는 하나님이시니라” (<a href="https://bibleox.com/ko/ko-nkrv/lk/3/#L35-38">눅 3:35-38</a>)</p></blockquote><p>칠십인역에는 가이난(130+330년)이 있습니다. 그는 아르박삿에게서 났고 셀라를 낳았습니다:</p><blockquote><p>“아르박삿은 <strong>가이난을 낳은 뒤</strong> 사백삼십 년을 살며 아들딸을 낳고 죽었다. <strong>가이난은 백삼십 년을 살고 셀라를 낳았다</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/gen/11/#L13">창 11:13</a>)</p></blockquote><p>마소라 본문에서는 아르박삿(35+403년)이 바로 셀라를 낳으며, 가이난은 전혀 나오지 않습니다:</p><blockquote><p>“아르박삿은 삼십오 세에 셀라를 낳았고 셀라를 낳은 후에 사백삼 년을 지내며 자녀를 낳았으며” (<a href="https://bibleox.com/ko/ko-nkrv/gen/11/#L12-13">창 11:12-13</a>)</p></blockquote><p>한 장 앞에도 비슷한 경우가 있습니다: <a href="https://bibleox.com/ko/ko-nkrv/gen/10/#L22,24">창 10:22,24</a>.</p><h2>“눈 먼 자에게 다시 보게 함”인가, “갇힌 자에게 놓임”인가</h2><p>복음서 저자 누가는 선지자 이사야의 예언을 칠십인역에 따라 인용합니다:</p><blockquote><p>“주의 성령이 내게 임하셨으니 이는 가난한 자에게 복음을 전하게 하시려고 내게 기름을 부으시고 나를 보내사 포로 된 자에게 자유를, <strong>눈 먼 자에게 다시 보게 함을</strong> 전파하며 눌린 자를 자유롭게 하고 주의 은혜의 해를 전파하게 하려 하심이라 하였더라” (<a href="https://bibleox.com/ko/ko-nkrv/lk/4/#L18-19">눅 4:18-19</a>)</p></blockquote><p>칠십인역의 이 자리에는 “눈 먼 자에게 다시 보게 함”(그리스어 τυφλοῖς ἀνάβλεψιν)이 있습니다:</p><blockquote><p>“주의 영이 내게 임하셨으니 … 포로 된 자에게 자유를, <strong>눈 먼 자에게 다시 보게 함을</strong> 선포하며” (<a href="https://bibleox.com/ko/gr-lxx-byz/is/61/#L1-2">사 61:1-2</a>)</p></blockquote><p>그러나 마소라 본문에는 “갇힌 자에게 놓임”이 있습니다. 히브리어 אֲסוּרִים פְּקַח־קוֹחַ(아수림 페카흐-코아흐):</p><blockquote><p>“주 여호와의 영이 내게 내리셨으니 이는 여호와께서 내게 기름을 부으사 가난한 자에게 아름다운 소식을 전하게 하려 하심이라 나를 보내사 마음이 상한 자를 고치며 포로된 자에게 자유를, <strong>갇힌 자에게 놓임을</strong> 선포하며 여호와의 은혜의 해와 우리 하나님의 보복의 날을 선포하여 모든 슬픈 자를 위로하되” (<a href="https://bibleox.com/ko/ko-nkrv/is/61/#L1-2">사 61:1-2</a>)</p></blockquote><p>더구나 마소라 본문에서는 같은 생각이 다른 말로 되풀이됩니다: “포로된 자에게 자유를, 갇힌 자에게 놓임을”.</p><h2>손과 발을 찔렀는가, 사자가 물어뜯는가?</h2><p>칠십인역에는 그리스도에 관한 예언이 있습니다:</p><blockquote><p>“그들이 <strong>내 손과 내 발을 찔렀나이다</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/ps/21/#L16">시 21:16</a>) <em>(칠십인역의 시편 번호. 개역개정에서는 22:16입니다.)</em></p></blockquote><p>나중의 마소라 본문(히브리어 성경의 22:17, 개역개정의 <a href="https://bibleox.com/ko/ko-nkrv/ps/22/#L16">시 22:16</a>)에는 그리스도의 손과 발을 찔렀다는 말이 없습니다. 그 대신 “사자”(כָּאֲרִי, “사자처럼”)라는 말이 있습니다. “물어뜯다”라는 동사는 본문에 아예 없으며, 사자의 행동이 손과 발에 어떻게 관련되는지도 분명하지 않습니다.</p><p>그러나 “찔렀다”가 옳습니다. 고대 쿰란 사본 4Q88[2]이 손과 발을 찔렀음을 확인해 줍니다. 개역개정도 이렇게 옮깁니다:</p><blockquote><p>“개들이 나를 에워쌌으며 악한 무리가 나를 둘러 <strong>내 수족을 찔렀나이다</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ps/22/#L16">시 22:16</a>)</p></blockquote><p>그 밖에도 그분이 찔리시리라는 예언이 하나 더 있습니다. 여기에서 언급됩니다:</p><blockquote><p>“또 다른 성경에 <strong><mark>그들이 그 찌른 자를 보리라</mark></strong> 하였느니라” (<a href="https://bibleox.com/ko/ko-nkrv/in/19/#L37">요 19:37</a>)</p></blockquote><p>가리키는 곳은 여기입니다:</p><blockquote><p>“내가 다윗의 집과 예루살렘 주민에게 은총과 간구하는 심령을 부어 주리니 그들이 <strong><mark>그 찌른 바</mark></strong> 그를 바라보고 그를 위하여 애통하기를 독자를 위하여 애통하듯 하며 그를 위하여 통곡하기를 장자를 위하여 통곡하듯 하리로다” (<a href="https://bibleox.com/ko/ko-nkrv/zah/12/#L10">슥 12:10</a>)</p></blockquote><blockquote><p>“… דָּקָ֑רוּ …” (<a href="https://bibleox.com/ko/heb-osm/zah/12/#L10">슥 12:10</a>, 히브리어 본문)</p></blockquote><p>דָּקָ֑רוּ</p><p>דקר — 찌르다, 꿰뚫다. 또 찔리다, 꿰뚫리다.</p><p>쿰란 사본 4Q80[1]은 그분이 찔리셨음을 확인해 줍니다.</p>'
