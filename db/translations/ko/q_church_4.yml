- src: 2R3w_Требования_к_ставленнику_в_епископы_пресвитеры_диаконы
  path: Qb8e_주교_사제_보제_후보자의_자격
  title: 주교, 사제, 보제 후보자의 자격
  copy_cover: true
  body: '<p>개역개정의 “감독”은 주교, “장로”는 사제, “집사”는 보제에 해당합니다.</p><h2>비교표</h2><table class="custom-table"><colgroup></colgroup><tbody><tr><td><p><strong>디모데</strong> (에베소 시, 딤전 1:3)</p><p>(<a href="https://bibleox.com/ko/ko-nkrv/1tim/3/#L1-13">딤전 3:1-13</a>)</p></td><td><p><strong>디도</strong> (그레데 섬, 딛 1:5)</p><p>(<a href="https://bibleox.com/ko/ko-nkrv/tit/1/#L5-9">딛 1:5-9</a>)</p></td></tr><tr><td><p>책망할 것이 없으며</p></td><td><p>책망할 것이 없고<br>감독은 하나님의 청지기로서 책망할 것이 없고</p></td></tr><tr><td><p>한 아내의 남편이 되며</p></td><td><p>한 아내의 남편이며</p></td></tr><tr><td><p>절제하며</p></td><td><p>절제하며</p></td></tr><tr><td><p>신중하며</p></td><td><p>신중하며</p></td></tr><tr><td><p>단정하며</p></td><td><p>거룩하며</p></td></tr><tr><td><p> </p></td><td><p>의로우며</p></td></tr><tr><td><p>나그네를 대접하며</p></td><td><p>나그네를 대접하며</p></td></tr><tr><td><p>가르치기를 잘하며</p></td><td><p>미쁜 말씀의 가르침을 그대로 지켜야 하리니 이는 능히 바른 교훈으로 권면하고 거슬러 말하는 자들을 책망하게 하려 함이라</p></td></tr><tr><td><p>술을 즐기지 아니하며</p></td><td><p>술을 즐기지 아니하며</p></td></tr><tr><td><p>구타하지 아니하며</p></td><td><p>구타하지 아니하며</p></td></tr><tr><td><p>다투지 아니하며</p></td><td><p>제 고집대로 하지 아니하며</p></td></tr><tr><td><p>(비잔틴 본문: 더러운 이득을 탐하지 아니하며)</p></td><td><p>더러운 이득을 탐하지 아니하며</p></td></tr><tr><td><p>관용하며</p></td><td><p>급히 분내지 아니하며</p></td></tr><tr><td><p>돈을 사랑하지 아니하며</p></td><td><p> </p></td></tr><tr><td><p>자기 집을 잘 다스려</p></td><td><p> </p></td></tr><tr><td><p>자녀들로 모든 공손함으로 복종하게 하는 자라야 할지며 (사람이 자기 집을 다스릴 줄 알지 못하면 어찌 하나님의 교회를 돌보리요)</p></td><td><p>방탕하다는 비난을 받거나 불순종하는 일이 없는 믿는 자녀를 둔 자라야 할지라</p></td></tr><tr><td><p>새로 입교한 자도 말지니 교만하여져서 마귀를 정죄하는 그 정죄에 빠질까 함이요</p></td><td><p> </p></td></tr><tr><td><p>외인에게서도 선한 증거를 얻은 자라야 할지니 비방과 마귀의 올무에 빠질까 염려하라</p></td><td><p>선행을 좋아하며</p></td></tr></tbody></table><h2>성경 구절</h2><blockquote><p>“미쁘다 이 말이여, 곧 사람이 <strong>감독</strong>의 직분을 얻으려 함은 선한 일을 사모하는 것이라 함이로다 그러므로 감독은 책망할 것이 없으며 한 아내의 남편이 되며 절제하며 신중하며 단정하며 나그네를 대접하며 가르치기를 잘하며 술을 즐기지 아니하며 구타하지 아니하며 오직 관용하며 다투지 아니하며 돈을 사랑하지 아니하며 자기 집을 잘 다스려 자녀들로 모든 공손함으로 복종하게 하는 자라야 할지며 (사람이 자기 집을 다스릴 줄 알지 못하면 어찌 하나님의 교회를 돌보리요) 새로 입교한 자도 말지니 교만하여져서 마귀를 정죄하는 그 정죄에 빠질까 함이요 또한 외인에게서도 선한 증거를 얻은 자라야 할지니 비방과 마귀의 올무에 빠질까 염려하라 이와 같이 <strong>집사들</strong>도 정중하고 일구이언을 하지 아니하고 술에 인박히지 아니하고 더러운 이를 탐하지 아니하고 깨끗한 양심에 믿음의 비밀을 가진 자라야 할지니 이에 이 사람들을 먼저 시험하여 보고 그 후에 책망할 것이 없으면 집사의 직분을 맡게 할 것이요 <strong>여자들도</strong> 이와 같이 정숙하고 모함하지 아니하며 절제하며 모든 일에 충성된 자라야 할지니라 <strong>집사</strong>들은 한 아내의 남편이 되어 자녀와 자기 집을 잘 다스리는 자일지니 집사의 직분을 잘한 자들은 아름다운 지위와 그리스도 예수 안에 있는 믿음에 큰 담력을 얻느니라” (<a href="https://bibleox.com/ko/ko-nkrv/1tim/3/#L1-13">딤전 3:1-13</a>)</p></blockquote><blockquote><p>“내가 너를 그레데에 남겨 둔 이유는 남은 일을 정리하고 내가 명한 대로 각 성에 <strong>장로들</strong>을 세우게 하려 함이니 책망할 것이 없고 한 아내의 남편이며 방탕하다는 비난을 받거나 불순종하는 일이 없는 믿는 자녀를 둔 자라야 할지라 <strong>감독</strong>은 하나님의 청지기로서 책망할 것이 없고 제 고집대로 하지 아니하며 급히 분내지 아니하며 술을 즐기지 아니하며 구타하지 아니하며 더러운 이득을 탐하지 아니하며 오직 나그네를 대접하며 선행을 좋아하며 신중하며 의로우며 거룩하며 절제하며 미쁜 말씀의 가르침을 그대로 지켜야 하리니 이는 능히 바른 교훈으로 권면하고 거슬러 말하는 자들을 책망하게 하려 함이라” (<a href="https://bibleox.com/ko/ko-nkrv/tit/1/#L5-9">딛 1:5-9</a>)</p></blockquote>'
  title_sub: 주교 후보자의 자격
