- src: 2R3w_Требования_к_ставленнику_в_епископы_пресвитеры_диаконы
  path: Qb8e_주교_사제_보제_후보자의_자격
  title: 주교, 사제, 보제 후보자의 자격
  copy_cover: true
  body: '<p>공동번역의 “감독”은 주교, “원로”는 사제, “보조자”는 보제에 해당합니다.</p><h2>비교표</h2><table class="custom-table"><colgroup></colgroup><tbody><tr><td><p><strong>디모테오</strong> (에페소 시, 1디모 1:3)</p><p>(<a href="https://bibleox.com/ko/ko-ctb/1tim/3/#L1-13">1디모 3:1-13</a>)</p></td><td><p><strong>디도</strong> (크레타 섬, 디도 1:5)</p><p>(<a href="https://bibleox.com/ko/ko-ctb/tit/1/#L5-9">디도 1:5-9</a>)</p></td></tr><tr><td><p>탓할 데가 없는 사람</p></td><td><p>흠잡힐 데가 없는 사람<br>하느님의 집안 일을 관리하는 사람으로서 흠잡힐 데가 없고</p></td></tr><tr><td><p>한 여자만을 아내로 가져야</p></td><td><p>한 여자만을 아내로 가진 사람</p></td></tr><tr><td><p>자제력이 있고</p></td><td><p>자기를 억제할 줄 알고</p></td></tr><tr><td><p>신중하고</p></td><td><p>신중하고</p></td></tr><tr><td><p>품위가 있어야</p></td><td><p>거룩하고</p></td></tr><tr><td><p> </p></td><td><p>올바르고</p></td></tr><tr><td><p>남을 후하게 대접할 줄 알며</p></td><td><p>손님 대접을 잘하고</p></td></tr><tr><td><p>남을 가르치는 능력이 있어야</p></td><td><p>교회가 가르치는 진실된 말씀을 굳게 지키는 사람이어야 합니다. 그래야 그가 건전한 가르침으로 남을 가르칠 수도 있고 반대자들을 반박할 수도 있을 것입니다</p></td></tr><tr><td><p>술을 즐기지 않으며</p></td><td><p>술을 즐기지 않고</p></td></tr><tr><td><p>난폭하지 않고</p></td><td><p>폭행을 하지 않고</p></td></tr><tr><td><p>남과 다투지 않고</p></td><td><p>거만하지 않고</p></td></tr><tr><td><p>(비잔틴 본문: 부정한 이득을 탐내지 않고)</p></td><td><p>부당한 이득을 탐내지 않는</p></td></tr><tr><td><p>온순하며</p></td><td><p>쉽사리 성내지 않고</p></td></tr><tr><td><p>돈에 욕심이 없어야</p></td><td><p> </p></td></tr><tr><td><p>자기 가정을 잘 다스릴 줄 알고</p></td><td><p> </p></td></tr><tr><td><p>큰 위엄을 가지고 자기 자녀들을 복종시킬 줄 아는 사람(자기 가정도 다스릴 줄 모르는 사람이 어떻게 하느님의 교회를 돌볼 수 있겠습니까?)</p></td><td><p>그의 자녀들은 신자라야 하고 방탕하거나 순종하지 않는다는 비난을 받아서는 안 됩니다</p></td></tr><tr><td><p>입교한 지 얼마 되지 않은 사람이 교회의 감독이 되어서는 안 됩니다. 그런 사람이 감독이 되면 교만해져서 악마가 받는 것과 같은 심판을 받을지도 모릅니다</p></td><td><p> </p></td></tr><tr><td><p>교회 밖의 사람들에게도 좋은 평을 받는 사람이어야 합니다. 그래야 남의 비난을 받지 않고 악마의 올무에 걸려 드는 일도 없을 것입니다</p></td><td><p>선을 사랑하고</p></td></tr></tbody></table><h2>성경 구절</h2><blockquote><p>“교회의 <strong>감독</strong>이 되고 싶어하는 사람은 훌륭한 직분을 바라는 사람이다 라는 말이 있는데, 이 말을 사실입니다. 그런데 감독은 탓할 데가 없는 사람이어야 하고 한 여자만을 아내로 가져야 하고 자제력이 있고 신중하고 품위가 있어야 하고 남을 후하게 대접할 줄 알며 남을 가르치는 능력이 있어야 합니다. 그리고 술을 즐기지 않으며 난폭하지 않고 온순하며 남과 다투지 않고 돈에 욕심이 없어야 합니다. 또한 자기 가정을 잘 다스릴 줄 알고 큰 위엄을 가지고 자기 자녀들을 복종시킬 줄 아는 사람이어야 합니다. (자기 가정도 다스릴 줄 모르는 사람이 어떻게 하느님의 교회를 돌볼 수 있겠습니까?) 입교한 지 얼마 되지 않은 사람이 교회의 감독이 되어서는 안 됩니다. 그런 사람이 감독이 되면 교만해져서 악마가 받는 것과 같은 심판을 받을지도 모릅니다. 감독은 또한 교회 밖의 사람들에게도 좋은 평을 받는 사람이어야 합니다. 그래야 남의 비난을 받지 않고 악마의 올무에 걸려 드는 일도 없을 것입니다. 또 <strong>보조자들</strong>은 근엄하고 한 입으로 두 가지 말을 하지 않으며 과음하지 않고 부정한 이득을 탐내지 않아야 합니다. 그리고 깨끗한 양심을 가지고 믿음의 심오한 진리를 간직하는 사람이어야 합니다. 보조자가 될 사람은 먼저 시험을 받아야 하고 그 시험에서 흠이 없다는 것이 드러났을 때에 비로소 그 직분을 받는 것입니다. <strong>보조자의 아내들</strong>도 마찬가지로 근엄해야 하고 남을 비방하지 않고 절제가 있어야 하며 모든 일에 진실성이 있어야 합니다. <strong>보조자</strong>는 한 여자만을 아내로 가져야하고 자기 자녀들과 자기 가정을 잘 다스리는 사람이어야 합니다. 보조자로서의 직무를 잘 수행한 사람은 훌륭한 지위에 오르게 되고 그리스도 예수를 믿는 믿음에 더욱 더 확신을 가지게 됩니다.” (<a href="https://bibleox.com/ko/ko-ctb/1tim/3/#L1-13">1디모 3:1-13</a>)</p></blockquote><blockquote><p>“내가 그대를 그레데섬에 홀로 남겨 두고 온 것은 내가 거기에서 다하지 못한 일을 그대가 완성하고 내가 일러 둔 대로 도시마다 교회의 <strong>원로</strong>들을 임명하게 하기 위한 것이었습니다. 원로가 될 사람은 흠잡힐 데가 없는 사람이어야 하고 한 여자만을 아내로 가진 사람이어야 합니다. 그리고 그의 자녀들은 신자라야 하고 방탕하거나 순종하지 않는다는 비난을 받아서는 안 됩니다. <strong>감독자</strong>는 하느님의 집안 일을 관리하는 사람으로서 흠잡힐 데가 없고 거만하지 않고 쉽사리 성내지 않고 술을 즐기지 않고 폭행을 하지 않고 거만하지 않고 부당한 이득을 탐내지 않는 사람이어야 하는 것입니다. 감독자는 오히려 손님 대접을 잘하고 선을 사랑하고 신중하고 올바르고 거룩하고 자기를 억제할 줄 알고 교회가 가르치는 진실된 말씀을 굳게 지키는 사람이어야 합니다. 그래야 그가 건전한 가르침으로 남을 가르칠 수도 있고 반대자들을 반박할 수도 있을 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/tit/1/#L5-9">디도 1:5-9</a>)</p></blockquote>'
  title_sub: 주교 후보자의 자격
