  path: As9k_아나니아와_삽피라
  title: 아나니아와 삽비라
  copy_cover: true
  body: <p>교회 생활의 초기에 주님께서는 교회 안 생활의 순결을 특별히 엄하게 지켜보십니다. 그래서 교회를 속이려 한 부부(아나니아와 삽비라)는 사도의 말에 쓰러져 죽습니다:</p><blockquote><p>“아나니아라 하는 사람이 그의 아내 <strong>삽비라</strong>와 더불어 소유를 팔아 <strong>그 값에서 얼마를 감추매</strong> 그 아내도 알더라 얼마만 가져다가 사도들의 발 앞에 두니 베드로가 이르되 <strong>아나니아야 어찌하여 사탄이 네 마음에 가득하여 네가 성령을 속이고 땅 값 얼마를 감추었느냐</strong> 땅이 그대로 있을 때에는 네 땅이 아니며 판 후에도 네 마음대로 할 수가 없더냐 어찌하여 이 일을 네 마음에 두었느냐 <strong>사람에게 거짓말한 것이 아니요 하나님께로다</strong> <strong>아나니아가 이 말을 듣고 엎드러져 혼이 떠나니</strong> 이 일을 듣는 사람이 다 크게 두려워하더라 젊은 사람들이 일어나 시신을 싸서 메고 나가 장사하니라 세 시간쯤 지나 그의 아내가 그 일어난 일을 알지 못하고 들어오니 베드로가 이르되 그 땅 판 값이 이것뿐이냐 내게 말하라 하니 이르되 예 이것뿐이라 하더라 베드로가 이르되 너희가 어찌 함께 꾀하여 주의 영을 시험하려 하느냐 보라 네 남편을 장사하고 오는 사람들의 발이 문 앞에 이르렀으니 또 너를 메어 내가리라 하니 <strong>곧 그가 베드로의 발 앞에 엎드러져 혼이 떠나는지라 젊은 사람들이 들어와 죽은 것을 보고 메어다가 그의 남편 곁에 장사하니</strong> 온 교회와 이 일을 듣는 사람들이 다 크게 두려워하니라” (<a href="https://bibleox.com/ko/ko-nkrv/act/5/#L1-11">행 5:1-11</a>)</p></blockquote><p>구약의 교회도 그러했습니다. 그 교회 생활의 초기에 한 사람은 안식일의 쉼을 어겨 죽음의 벌을 받았습니다:</p><blockquote><p>“이스라엘 자손이 광야에 거류할 때에 <strong>안식일에 어떤 사람이 나무하는 것을 발견한지라</strong> 그 나무하는 자를 발견한 자들이 그를 모세와 아론과 온 회중 앞으로 끌어왔으나 어떻게 처치할는지 지시하심을 받지 못한 고로 가두었더니 <strong>여호와께서 모세에게 이르시되 그 사람을 반드시 죽일지니</strong> 온 회중이 진영 밖에서 돌로 그를 칠지니라 온 회중이 곧 그를 진영 밖으로 끌어내고 돌로 그를 쳐죽여서 여호와께서 모세에게 명령하신 대로 하니라” (<a href="https://bibleox.com/ko/ko-nkrv/chis/15/#L32-36">민 15:32-36</a>)</p></blockquote><p>나중에 유대인들은 안식일을 거듭 어겼고(<a href="https://bibleox.com/ko/ko-nkrv/neem/13/#L15-16,18">느 13:15-16,18</a>; <a href="https://bibleox.com/ko/ko-nkrv/iez/20/#L13,16,21,24">겔 20:13,16,21,24</a>; <a href="https://bibleox.com/ko/ko-nkrv/iez/22/#L8">겔 22:8</a>; <a href="https://bibleox.com/ko/ko-nkrv/iez/23/#L38">겔 23:38</a>) 사제들까지 그러했지만(<a href="https://bibleox.com/ko/ko-nkrv/iez/22/#L26">겔 22:26</a>), 즉각적인 죽음의 벌 대신 안식일 위반을 막으려는 노력이 있었습니다:</p><blockquote><p>“안식일 전 예루살렘 성문이 어두워갈 때에 <strong>내가 성문을 닫고 안식일이 지나기 전에는 열지 말라 하고</strong> 나를 따르는 종자 몇을 성문마다 세워 <strong>안식일에는 아무 짐도 들어오지 못하게 하였으므로</strong> 장사꾼들과 각양 물건 파는 자들이 한두 번 예루살렘 성 밖에서 자므로 내가 그들에게 경계하여 이르기를 너희가 어찌하여 성 밑에서 자느냐 다시 이같이 하면 내가 잡으리라 하였더니 그후부터는 안식일에 그들이 다시 오지 아니하였느니라 내가 또 <strong>레위 사람들에게 몸을 정결하게 하고 와서 성문을 지켜서 안식일을 거룩하게 하라</strong> 하였느니라 내 하나님이여 나를 위하여 이 일도 기억하시옵고 주의 크신 은혜대로 나를 아끼시옵소서” (<a href="https://bibleox.com/ko/ko-nkrv/neem/13/#L19-22">느 13:19-22</a>)</p></blockquote><blockquote><p>“<strong>여호와께서 내게 이와 같이 말씀하시되</strong> 너는 가서 유다 왕들이 출입하는 <strong>평민의 문</strong>과 예루살렘 모든 문에 서서 무리에게 이르기를 이 문으로 들어오는 유다 왕들과 유다 모든 백성과 <strong>예루살렘 모든 주민</strong>인 너희는 여호와의 말씀을 들을지어다 여호와께서 이와 같이 말씀하시되 너희는 스스로 삼가서 <strong>안식일에 짐을 지고 예루살렘 문으로 들어오지 말며 안식일에 너희 집에서 짐을 내지 말며 어떤 일이라도 하지 말고 내가 너희 조상들에게 명령함 같이 안식일을 거룩히 할지어다</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ier/17/#L19-22">렘 17:19-22</a>)</p></blockquote>
  meta_desc: 아나니아와 삽비라가 받은 벌을 이해하기 위한 성경 구절
