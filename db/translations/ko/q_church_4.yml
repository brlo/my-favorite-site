  title: 합당하지 않은 이를 통한 은총의 작용
  copy_cover: true
  body: <h2>대사제 가야파</h2><p>그리스도를 죽이려는 사람을 통해 예언이 나옵니다. 자기 생각이 아니라 다만 그 해의 대사제였기 때문입니다:</p><blockquote><p>“그 해의 대사제인 <strong><mark>가야파</mark></strong>가 그 자리에 와 있다가 이렇게 말하였다. ‘당신들은 그렇게도 아둔합니까? <strong><mark>온 민족이 멸망하는 것보다 한 사람이 백성을 대신해서 죽는 편이 더 낫다는 것도 모릅니까?’ 이 말은 가야파가 자기 생각으로 한 것이 아니라 그 해의 대사제로서 예언을 한 셈이다. 그 예언은 예수께서 유다 민족을 대신해서 죽게 되리라는 것과</mark></strong>” (<a href="https://bibleox.com/ko/ko-ctb/in/11/#L49-51">요한 11:49-51</a>)</p></blockquote><h2>가리옷 사람 유다</h2><blockquote><p>“예수께서 <strong>열 두 제자를 불러</strong> <strong><mark>악령들을 제어하는 권능을 주시어 그것들을 쫓아 내고 병자와 허약한 사람들을 모두 고쳐 주게 하셨다</mark></strong>. 열 두 사도의 이름은 이러하다. 베드로라고 하는 시몬과 그의 동생 안드레아를 비롯하여 세베대오의 아들 야고보와 요한 형제, 필립보와 바르톨로메오, 토마와 세리였던 마태오, 알패오의 아들 야고보와 타대오, 가나안 사람 시몬, 그리고 예수를 팔아 넘긴 <strong><mark>가리옷 사람 유다</mark></strong>이다. 예수께서 이 열 두 사람을 파견하시면서 이렇게 분부하셨다. ‘이방인들이 사는 곳으로도 가지 말고 사마리아 사람들의 도시에도 들어 가지 말라. &lt;…&gt; <strong>앓는 사람은 고쳐 주고 죽은 사람은 살려 주어라. 나병환자는 깨끗이 낫게 해주고 마귀는 쫓아 내어라</strong>. 너희가 거저 받았으니 거저 주어라.’” (<a href="https://bibleox.com/ko/ko-ctb/mf/10/#L1-5,8">마태 10:1-5,8</a>)</p></blockquote><blockquote><p>“예수의 제자로서 장차 예수를 배반할 <strong><mark>가리옷 사람 유다</mark></strong>가 &lt;…&gt; 유다는 가난한 사람들을 생각해서가 아니라 그가 <strong><mark>도둑</mark></strong>이어서 이런 말을 한 것이다. 그는 돈주머니를 맡아 가지고 거기 들어 있는 것을 늘 꺼내 쓰곤 하였다.” (<a href="https://bibleox.com/ko/ko-ctb/in/12/#L4,6">요한 12:4,6</a>)</p></blockquote><h2>하느님의 신의는 사람의 불신보다 높습니다</h2><blockquote><p>“그런데 <strong>어떤 유다인들이 신의를 저버렸다고 합시다. 그렇다고 해서 하느님께서도 신의를 저버리시겠습니까? 절대로 그럴 수 없습니다</strong>. 세상 모든 사람이 거짓말장이라 하더라도 하느님만은 언제나 진실하십니다. 성서에도, ‘당신의 말씀에는 언제나 정의가 드러나고 재판을 받으시면 반드시 이기십니다’라는 말씀이 있지 않습니까?” (<a href="https://bibleox.com/ko/ko-ctb/rim/3/#L3-4">로마 3:3-4</a>)</p></blockquote><h2>사제의 책임</h2><blockquote><p>“그러나 주인의 뜻을 몰랐다면 매맞을 만한 짓을 하였어도 덜 맞을 것이다. <strong>많이 받은 사람은 많은 것을 돌려 주어야 하며 많이 맡은 사람은 더 많은 것을 내어 놓아야 한다</strong>.‘” (<a href="https://bibleox.com/ko/ko-ctb/lk/12/#L48">루가 12:48</a>)</p></blockquote>
