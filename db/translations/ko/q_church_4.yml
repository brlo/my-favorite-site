  title: 재혼
  copy_cover: true
  body: <h2>그리스도교의 이상</h2><p>그리스도교의 이상은 영원히 단 한 번의 혼인입니다.</p><h2>평신도를 위한 관용</h2><p>아내나 남편이 죽으면 새 혼인은 권장되지 않지만(그리스도인은 죽음 뒤의 삶과 죽은 이들의 공동 부활을 믿기 때문입니다), 사도가 말한 대로 사람이 무거운 죄에 빠져 아주 멸망하지 않도록 관용의 조치로 허락됩니다:</p><blockquote><p>“결혼하지 않은 사람들과 <strong>과부들에게는</strong> 나처럼 그대로 독신으로 지내는 것이 좋겠다고 말하고 싶습니다. 그러나 <strong><mark>자제할 수 없거든 결혼하십시오. 욕정에 불타는 것보다 결혼하는 편이 낫습니다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/7/#L8-9">1고린 7:8-9</a>)</p></blockquote><blockquote><p>“그러므로 <strong>젊은 과부들은 재혼하여</strong> 자녀를 낳고 가정을 다스리기를 바랍니다. 그래야 반대자에게 조금도 비방거리가 되지 않을 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/1tim/5/#L14">1디모 5:14</a>)</p></blockquote><p>구세주께서도 이혼 금지를 말씀하시면서 음행(간음)의 경우는 예외로 하십니다:</p><blockquote><p>“‘또한 누구든지 아내를 버리려면 그에게 이혼장을 써 주어라고 하신 말씀이 있다. 그러나 나는 이렇게 말한다. 누구든지 <strong>음행한 경우를 제외하고</strong> 아내를 버리면, 이것은 그 여자를 간음하게 하는 것이다. 또 그 버림받은 여자와 결혼하면 그것도 간음하는 것이다.’” (<a href="https://bibleox.com/ko/ko-ctb/mf/5/#L31-32">마태 5:31-32</a>)</p></blockquote><p>그러므로 배우자가 죽었거나 부정을 저질렀다면 새 혼인이 가능합니다. 그러나 끝없이 되는 것은 아니며, 관용의 조치로 두 번까지만 더 할 수 있습니다.</p><p>교회는 비슷한 이유로 다른 사유들도 덧붙였습니다. 예를 들면 배우자가 생명을 위협하는 경우 <a href="https://azbyka.ru/otechnik/dokumenty/osnovy-sotsialnoj-kontseptsii-russkoj-pravoslavnoj-tserkvi/#0_10_3">등입니다</a>(러시아어).</p><h2>사제직에는 한 번 혼인한 사람을 뽑아야 합니다</h2><p>이것을 언급하는 까닭은 한 번의 혼인에 머무는 것이 참으로 더 합당한 삶의 방식으로 여겨진다는 것을 보기 위해서입니다:</p><blockquote><p>“그런데 <strong>감독</strong>은 <strong>탓할 데가 없는 사람이어야 하고 한 여자만을 아내로 가져야</strong> 하고 자제력이 있고 신중하고 품위가 있어야 하고 남을 후하게 대접할 줄 알며 남을 가르치는 능력이 있어야 합니다.” (<a href="https://bibleox.com/ko/ko-ctb/1tim/3/#L2">1디모 3:2</a>)</p></blockquote><blockquote><p>“<strong>보조자는 한 여자만을 아내로 가져야</strong>하고 자기 자녀들과 자기 가정을 잘 다스리는 사람이어야 합니다.” (<a href="https://bibleox.com/ko/ko-ctb/1tim/3/#L12">1디모 3:12</a>)</p></blockquote><blockquote><p>“내가 그대를 그레데섬에 홀로 남겨 두고 온 것은 내가 거기에서 다하지 못한 일을 그대가 완성하고 내가 일러 둔 대로 <strong>도시마다 교회의 원로들을 임명</strong>하게 하기 위한 것이었습니다. 원로가 될 사람은 <strong>흠잡힐 데가 없는 사람이어야 하고 한 여자만을 아내로 가진 사람</strong>이어야 합니다. 그리고 그의 자녀들은 신자라야 하고 방탕하거나 순종하지 않는다는 비난을 받아서는 안 됩니다.” (<a href="https://bibleox.com/ko/ko-ctb/tit/1/#L5-6">디도 1:5-6</a>)</p></blockquote>
