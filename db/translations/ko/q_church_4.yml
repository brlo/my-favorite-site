  title: 재혼
  copy_cover: true
  body: <h2>그리스도교의 이상</h2><p>그리스도교의 이상은 영원히 단 한 번의 혼인입니다.</p><h2>평신도를 위한 관용</h2><p>아내나 남편이 죽으면 새 혼인은 권장되지 않지만(그리스도인은 죽음 뒤의 삶과 죽은 이들의 공동 부활을 믿기 때문입니다), 사도가 말한 대로 사람이 무거운 죄에 빠져 아주 멸망하지 않도록 관용의 조치로 허락됩니다:</p><blockquote><p>“내가 결혼하지 아니한 자들과 <strong>과부들에게</strong> 이르노니 나와 같이 그냥 지내는 것이 좋으니라 만일 <strong><mark>절제할 수 없거든 결혼하라 정욕이 불 같이 타는 것보다 결혼하는 것이 나으니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/7/#L8-9">고전 7:8-9</a>)</p></blockquote><blockquote><p>“그러므로 <strong>젊은이는 시집 가서</strong> 아이를 낳고 집을 다스리고 대적에게 비방할 기회를 조금도 주지 말기를 원하노라” (<a href="https://bibleox.com/ko/ko-nkrv/1tim/5/#L14">딤전 5:14</a>) <em>(문맥상 젊은 과부들을 가리킵니다(그리스어 νεωτέρας, “더 젊은 여자들”).)</em></p></blockquote><p>구세주께서도 이혼 금지를 말씀하시면서 음행(간음)의 경우는 예외로 하십니다:</p><blockquote><p>“또 일렀으되 누구든지 아내를 버리려거든 이혼 증서를 줄 것이라 하였으나 나는 너희에게 이르노니 누구든지 <strong>음행한 이유 없이</strong> 아내를 버리면 이는 그로 간음하게 함이요 또 누구든지 버림받은 여자에게 장가드는 자도 간음함이니라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/5/#L31-32">마 5:31-32</a>)</p></blockquote><p>그러므로 배우자가 죽었거나 부정을 저질렀다면 새 혼인이 가능합니다. 그러나 끝없이 되는 것은 아니며, 관용의 조치로 두 번까지만 더 할 수 있습니다.</p><p>교회는 비슷한 이유로 다른 사유들도 덧붙였습니다. 예를 들면 배우자가 생명을 위협하는 경우 <a href="https://azbyka.ru/otechnik/dokumenty/osnovy-sotsialnoj-kontseptsii-russkoj-pravoslavnoj-tserkvi/#0_10_3">등입니다</a>(러시아어).</p><h2>사제직에는 한 번 혼인한 사람을 뽑아야 합니다</h2><p>이것을 언급하는 까닭은 한 번의 혼인에 머무는 것이 참으로 더 합당한 삶의 방식으로 여겨진다는 것을 보기 위해서입니다:</p><blockquote><p>“그러므로 감독은 <strong>책망할 것이 없으며 한 아내의 남편이 되며</strong> 절제하며 신중하며 단정하며 나그네를 대접하며 가르치기를 잘하며” (<a href="https://bibleox.com/ko/ko-nkrv/1tim/3/#L2">딤전 3:2</a>)</p></blockquote><blockquote><p>“<strong>집사들은 한 아내의 남편이 되어</strong> 자녀와 자기 집을 잘 다스리는 자일지니” (<a href="https://bibleox.com/ko/ko-nkrv/1tim/3/#L12">딤전 3:12</a>)</p></blockquote><blockquote><p>“내가 너를 그레데에 남겨 둔 이유는 남은 일을 정리하고 내가 명한 대로 <strong>각 성에 장로들을 세우게</strong> 하려 함이니 <strong>책망할 것이 없고 한 아내의 남편이며</strong> 방탕하다는 비난을 받거나 불순종하는 일이 없는 믿는 자녀를 둔 자라야 할지라” (<a href="https://bibleox.com/ko/ko-nkrv/tit/1/#L5-6">딛 1:5-6</a>)</p></blockquote>
