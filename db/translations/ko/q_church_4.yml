  title: 아나니아와 삽피라
  copy_cover: true
  body: <p>교회 생활의 초기에 주님께서는 교회 안 생활의 순결을 특별히 엄하게 지켜보십니다. 그래서 교회를 속이려 한 부부(아나니아와 삽피라)는 사도의 말에 쓰러져 죽습니다:</p><blockquote><p>“그런데 <strong>아나니아</strong>라는 사람은 그의 아내 <strong>삽피라</strong>와 함께 자기 땅을 판 다음 의논한 끝에 <strong>그 돈의 일부는 빼 돌리고</strong> 나머지만 사도들 앞에 가져다 바쳤다. 그 때에 베드로가 그를 이렇게 꾸짖었다. ‘<strong>아나니아, 왜 사탄에게 마음을 빼앗겨 성령을 속이고 땅 판 돈의 일부를 빼돌렸소</strong>? 팔기 전에도 그 땅은 당신 것이었고 판 뒤에도 그 돈은 당신 마음대로 할 수 있었던 것이 아니오? 그런데 어쩌자고 그런 생각을 품었소? <strong>당신은 사람을 속인 것이 아니라 하느님을 속인 것이오</strong>!’ 이 말이 떨어지자 <strong>아나니아는 그 자리에 거꾸러져 숨지고 말았다</strong>. 이 말을 들은 사람마다 모두 두려워하였다. 젊은이들이 들어 와 그 시체를 싸 가지고 내어다 묻었다. 세 시간쯤 뒤에 그의 아내가 그 동안에 무슨 일이 일어났는지도 모르고 들어 왔다. 베드로가 그 여자를 불러 놓고 ‘당신들이 땅을 판 돈이 이게 전부란 말이오?’하고 묻자 ‘예, 전부입니다’하고 대답하였다. 어쩌자고 당신들은 서로 짜고 주의 성령을 떠보는 거요? 자, 당신의 남편을 묻고 돌아 오는 사람들이 지금 막 문 밖에 왔소. 이번에는 당신을 메고 갈 차례요‘하고 베드로가 말하였다. 그러자 <strong>그 여자도 당장 베드로의 발 앞에 거꾸러져 숨지고 말았다. 그 때 그 젊은이들이 들어 와 보니 그 여자도 죽어 있었으므로 떠메고 나가 그 남편 곁에 묻었다</strong>. 온 교회는 물론이고 다른 사람들도 이 말을 듣고는 모두 몹시 두려워하였다.” (<a href="https://bibleox.com/ko/ko-ctb/act/5/#L1-11">사도 5:1-11</a>)</p></blockquote><p>구약의 교회도 그러했습니다. 그 교회 생활의 초기에 한 사람은 안식일의 쉼을 어겨 죽음의 벌을 받았습니다:</p><blockquote><p>“이스라엘 백성이 광야에 있을 때, <strong>안식일에 나무를 하는 사람이 있었다</strong>. 그 나무를 하는 사람을 본 사람들이 그를 모세와 아론과 온 회중 앞에 끌고 왔다. 그러나 이런 사람을 어떻게 다스려야 할 지, 그 전례가 없었으므로 그를 그냥 가두어 두는 수밖에 없었다. 그 때 <strong>야훼께서 모세에게 말씀을 내리셨다. ‘그를 사형에 처하여라</strong>. 온 회중이 그를 진지 밖으로 끌어 내다가 돌로 쳐죽여라.’ 온 회중은 야훼께서 모세에게 명령하신 대로 그를 진지 밖으로 끌어 내다가 돌로 쳐죽였다.” (<a href="https://bibleox.com/ko/ko-ctb/chis/15/#L32-36">민 15:32-36</a>)</p></blockquote><p>나중에 유다인들은 안식일을 거듭 어겼고(<a href="https://bibleox.com/ko/ko-ctb/neem/13/#L15-16,18">느헤 13:15-16,18</a>; <a href="https://bibleox.com/ko/ko-ctb/iez/20/#L13,16,21,24">에제 20:13,16,21,24</a>; <a href="https://bibleox.com/ko/ko-ctb/iez/22/#L8">에제 22:8</a>; <a href="https://bibleox.com/ko/ko-ctb/iez/23/#L38">에제 23:38</a>) 사제들까지 그러했지만(<a href="https://bibleox.com/ko/ko-ctb/iez/22/#L26">에제 22:26</a>), 즉각적인 죽음의 벌 대신 안식일 위반을 막으려는 노력이 있었습니다:</p><blockquote><p>“그리고 나는 이렇게 지시하였다. ‘안식일이 되기 전 예루살렘 성문에 그림자만 드리우면 <strong>성문을 닫아라</strong>.’ 또 <strong>안식일이 지나기 까지 문을 열지 못하게 지시한 다음</strong>, 나의 수하 젊은 이들을 성문마다 배치하여 <strong>안식일에 아무 것도 들이지 못하게 하였다</strong>. 그 후에도 한두 번 갖가지 물건을 파는 상인들이 밤에 예루살렘성밖에서 묵는 것을 보고, 나는 그들을 꾸짖었다. ‘왜 너희는 성 앞에서 밤을 새우느냐? 또다시 그러면 잡아 들이리라.’ 그 후로 그들은 안식일에 나타나지 않았다. 나는 <strong>레위인들에게 목욕재계하고 와서 성문들을 지켜 안식일을 거룩하게 지키도록</strong> 하라고 일렀다. 나의 하느님이여, 저의 이런 일도 부디 잊지 말아 주십시오. 그지없으신 사랑을 믿고 비오니, 이 몸 너그러이 보아 주십시오.” (<a href="https://bibleox.com/ko/ko-ctb/neem/13/#L19-22">느헤 13:19-22</a>)</p></blockquote><blockquote><p>“<strong>야훼께서 나에게 이렇게 말씀하셨다</strong>. ‘너는 유다의 임금들이 드나드는 ’<strong>백성의 문</strong>‘ 뿐 아니라 예루살렘의 다른 모든 성문에 서서, 그 성문으로 드나드는 유다의 임금들과 온 유다 국민과 <strong>예루살렘 시민</strong>에게 일러 주어라. 야훼가 하는 말이다. 너희 목숨을 부지하고 싶거든 <strong>안식일에 짐을 가지고 예루살렘 성문으로 들어 오지 말아라. 안식일에는 집에서 짐을 내어 가지도 말고, 아무 일도 하지 말아라. 내가 너희 조상에게 말한 대로 안식일을 거룩하게 지켜야 한다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/ier/17/#L19-22">예레 17:19-22</a>)</p></blockquote>
