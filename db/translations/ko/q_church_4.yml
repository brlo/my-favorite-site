- src: DZxa_Действие_благодати_через_недостойных
  path: Gu4w_합당하지_않은_이를_통한_은총의_작용
  title: 합당하지 않은 이를 통한 은총의 작용
  copy_cover: true
  body: <h2>대사제 가야바</h2><p>그리스도를 죽이려는 사람을 통해 예언이 나옵니다. 자기 생각이 아니라 다만 그 해의 대사제였기 때문입니다:</p><blockquote><p>“그 중의 한 사람 그 해의 대제사장인 <strong><mark>가야바</mark></strong>가 그들에게 말하되 너희가 아무 것도 알지 못하는도다 <strong><mark>한 사람이 백성을 위하여 죽어서 온 민족이 망하지 않게 되는 것이 너희에게 유익한 줄을 생각하지 아니하는도다 하였으니 이 말은 스스로 함이 아니요 그 해의 대제사장이므로 예수께서 그 민족을 위하시고</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/in/11/#L49-51">요 11:49-51</a>)</p></blockquote><h2>가룟 유다</h2><blockquote><p>“예수께서 그의 <strong>열두 제자를 부르사</strong> <strong><mark>더러운 귀신을 쫓아내며 모든 병과 모든 약한 것을 고치는 권능을 주시니라</mark></strong> 열두 사도의 이름은 이러하니 베드로라 하는 시몬을 비롯하여 그의 형제 안드레와 세베대의 아들 야고보와 그의 형제 요한, 빌립과 바돌로매, 도마와 세리 마태, 알패오의 아들 야고보와 다대오, 가나나인 시몬 및 <strong><mark>가룟 유다</mark></strong> 곧 예수를 판 자라 예수께서 이 열둘을 내보내시며 명하여 이르시되 이방인의 길로도 가지 말고 사마리아인의 고을에도 들어가지 말고 &lt;…&gt; <strong>병든 자를 고치며 죽은 자를 살리며 나병환자를 깨끗하게 하며 귀신을 쫓아내되</strong> 너희가 거저 받았으니 거저 주라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/10/#L1-5,8">마 10:1-5,8</a>)</p></blockquote><blockquote><p>“제자 중 하나로서 예수를 잡아 줄 <strong><mark>가룟 유다</mark></strong>가 말하되 &lt;…&gt; 이렇게 말함은 가난한 자들을 생각함이 아니요 그는 도둑이라 돈궤를 맡고 거기 넣는 것을 훔쳐 감이러라” (<a href="https://bibleox.com/ko/ko-nkrv/in/12/#L4,6">요 12:4,6</a>)</p></blockquote><h2>하느님의 신의는 사람의 불신보다 높습니다</h2><blockquote><p>“<strong>어떤 자들이 믿지 아니하였으면 어찌하리요 그 믿지 아니함이 하나님의 미쁘심을 폐하겠느냐 그럴 수 없느니라</strong> 사람은 다 거짓되되 오직 하나님은 참되시다 할지어다 기록된 바 주께서 주의 말씀에 의롭다 함을 얻으시고 판단 받으실 때에 이기려 하심이라 함과 같으니라” (<a href="https://bibleox.com/ko/ko-nkrv/rim/3/#L3-4">롬 3:3-4</a>)</p></blockquote><h2>사제의 책임</h2><blockquote><p>“알지 못하고 맞을 일을 행한 종은 적게 맞으리라 무릇 <strong>많이 받은 자에게는 많이 요구할 것이요 많이 맡은 자에게는 많이 달라 할 것이니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/lk/12/#L48">눅 12:48</a>)</p></blockquote>
