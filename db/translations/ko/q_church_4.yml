  references: '<ol><li><p>교회 봉사를 위해 과부를 뽑을 때 “한 남편의 아내였던” 사람을 뽑았습니다(<a href="https://bibleox.com/ko/ko-ctb/1tim/5/#L9">1디모 5:9</a>). 자세히(러시아어): <a href="https://azbyka.ru/otechnik/Mihail_Zheltov/tserkovnoe-blagoslovenie-povtornyh-brakov/">https://azbyka.ru/otechnik/Mihail_Zheltov/tserkovnoe-blagoslovenie-povtornyh-brakov/</a></p></li></ol><p>번역: 로디온 블라소프 (AI 도구 활용). 저본: 러시아어 원문. 참고: 영어·일본어 번역. 성경 인용과 링크는 공동번역 성서에 따름.</p>'
