- src: Христос-Единородный-Сын-Божий
  path: Kq7d_그리스도_하느님의_외아들
  title: 그리스도 — 하느님의 외아들(독생자)
  copy_cover: true
  body: <h2>외아들(독생자)은 아버지의 하나뿐인 아들이다</h2><p>외아들(독생자)은 하나뿐인 아들, 곧 하느님의 아들께서 나신 것처럼 그렇게 난 이는 아무도 없다는 뜻입니다.</p><blockquote><p>“<strong>말씀이 육신이 되어</strong> 우리 가운데 거하시매 우리가 그의 영광을 보니 <strong>아버지의 독생자</strong>의 영광이요 은혜와 진리가 충만하더라” (<a href="https://bibleox.com/ko/ko-nkrv/in/1/#L14">요 1:14</a>)</p></blockquote><blockquote><p>“본래 하나님을 본 사람이 없으되 아버지 품 속에 있는 <strong>독생하신 하나님</strong>이 나타내셨느니라” (<a href="https://bibleox.com/ko/ko-nkrv/in/1/#L18">요 1:18</a>) <em>(비잔틴 본문(다수 사본)에는 “독생하신 아들”(ὁ μονογενὴς υἱός)이라고 되어 있습니다.)</em></p></blockquote><blockquote><p>“<strong>하나님이</strong> 세상을 이처럼 사랑하사 <strong>독생자를 주셨으니</strong> 이는 그를 믿는 자마다 멸망하지 않고 영생을 얻게 하려 하심이라” (<a href="https://bibleox.com/ko/ko-nkrv/in/3/#L16">요 3:16</a>)</p></blockquote><blockquote><p>“그를 믿는 자는 심판을 받지 아니하는 것이요 믿지 아니하는 자는 <strong>하나님의 독생자</strong>의 이름을 믿지 아니하므로 벌써 심판을 받은 것이니라” (<a href="https://bibleox.com/ko/ko-nkrv/in/3/#L18">요 3:18</a>)</p></blockquote><blockquote><p>“때가 차매 <strong>하나님이 그 아들을 보내사</strong> 여자에게서 나게 하시고 율법 아래에 나게 하신 것은” (<a href="https://bibleox.com/ko/ko-nkrv/gal/4/#L4">갈 4:4</a>)</p></blockquote><blockquote><p>“하나님의 사랑이 우리에게 이렇게 나타난 바 되었으니 하나님이 <strong>자기의 독생자</strong>를 세상에 보내심은 그로 말미암아 우리를 살리려 하심이라” (<a href="https://bibleox.com/ko/ko-nkrv/1in/4/#L9">요일 4:9</a>)</p></blockquote><p>아브라함이 외아들을 바친 일은 하느님의 외아들께서 십자가에서 바쳐지신 일의 예표입니다.</p><blockquote><p>“아브라함은 시험을 받을 때에 믿음으로 이삭을 드렸으니 그는 약속들을 받은 자로되 <strong>그 외아들을 드렸느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/evr/11/#L17">히 11:17</a>)</p></blockquote><h2>예수 그리스도 — 맏아들</h2><p>그리스도는 맏아들이라고 불리십니다.</p><blockquote><p>“하나님이 미리 아신 자들을 또한 그 아들의 형상을 본받게 하기 위하여 미리 정하셨으니 이는 그로 <strong>많은 형제 중에서 맏아들</strong>이 되게 하려 하심이니라” (<a href="https://bibleox.com/ko/ko-nkrv/rim/8/#L29">롬 8:29</a>)</p></blockquote><blockquote><p>“또 그가 <strong>맏아들</strong>을 이끌어 세상에 다시 들어오게 하실 때에 하나님의 모든 천사들은 그에게 경배할지어다 말씀하시며” (<a href="https://bibleox.com/ko/ko-nkrv/evr/1/#L6">히 1:6</a>)</p></blockquote><p>그리스도께서는 왜 맏아들이신가? 죽은 자 가운데서 처음으로 부활하셨기 때문입니다.</p><blockquote><p>“그는 몸인 교회의 머리시라 그가 근본이시요 <strong>죽은 자들 가운데서 먼저 나신 이</strong>시니 이는 친히 만물의 으뜸이 되려 하심이요” (<a href="https://bibleox.com/ko/ko-nkrv/kol/1/#L18">골 1:18</a>)</p></blockquote><blockquote><p>“또 충성된 증인으로 <strong>죽은 자들 가운데에서 먼저 나시고</strong> 땅의 임금들의 머리가 되신 예수 그리스도로 말미암아 은혜와 평강이 너희에게 있기를 원하노라 우리를 사랑하사 그의 피로 우리 죄에서 우리를 해방하시고” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/1/#L5">계 1:5</a>)</p></blockquote><blockquote><p>“곧 그리스도가 고난을 받으실 것과 <strong>죽은 자 가운데서 먼저 다시 살아나사</strong> 이스라엘과 이방인들에게 빛을 전하시리라 함이니이다 하니라” (<a href="https://bibleox.com/ko/ko-nkrv/act/26/#L23">행 26:23</a>)</p></blockquote><h2>덧붙여</h2><p>이슬람에 따르면 알라는 낳지도 않고 나지도 않았습니다.</p><blockquote><p>“그분(알라)은 낳지도 않으시고 나지도 않으셨다”(쿠란 112장 3절)</p></blockquote>
  meta_desc: 하느님의 외아들(독생자)에 관한 성경 구절
