  path: Xr2m_시작이_없으신_하느님의_아들이_사람의_아들로_시작하시다
  title: 시작이 없으신 하느님의 아들이 사람의 아들로 시작하시다
  copy_cover: true
  body: <h2>하느님의 아들께는 시작이 없으나, 시작이 있는 모든 것에 시작을 주신다</h2><blockquote><p>“태초에 말씀이 계시니라 이 말씀이 하나님과 함께 계셨으니 이 말씀은 곧 하나님이시니라 &lt;…&gt; <strong>만물이 그로 말미암아 지은 바 되었으니 지은 것이 하나도 그가 없이는 된 것이 없느니라</strong> &lt;…&gt; 말씀이 육신이 되어 우리 가운데 거하시매 우리가 그의 영광을 보니 아버지의 독생자의 영광이요 은혜와 진리가 충만하더라” (<a href="https://bibleox.com/ko/ko-nkrv/in/1/#L1,3,14">요 1:1,3,14</a>)</p></blockquote><h2>멜기세덱 제사장은 시작한 날이 없으신(시작이 없으신) 하느님의 아들의 형상이다</h2><blockquote><p>“아버지도 없고 어머니도 없고 족보도 없고 <strong>시작한 날도 없고 생명의 끝도 없어 하나님의 아들과 닮아서</strong> 항상 제사장으로 있느니라” (<a href="https://bibleox.com/ko/ko-nkrv/evr/7/#L3">히 7:3</a>)</p></blockquote><h2>시작이 없으신 분이 시작하신다</h2><p>시작이 없으신 <a href="https://bibleox.com/ru/ru/w/Христос-Бог">하느님</a>께서 시작하십니다. 예언대로(<a href="https://bibleox.com/ko/ko-nkrv/is/7/#L14">사 7:14</a>) 처녀에게서 사람으로 나십니다.</p><blockquote><p>“때가 차매 하나님이 그 아들을 <strong>보내사</strong> <strong>여자에게서 나게 하시고</strong> 율법 아래에 나게 하신 것은” (<a href="https://bibleox.com/ko/ko-nkrv/gal/4/#L4">갈 4:4</a>)</p></blockquote><blockquote><p>“그는 근본 하나님의 본체시나 하나님과 동등됨을 취할 것으로 여기지 아니하시고 오히려 자기를 비워 <strong>종의 형체를 가지사 사람들과 같이 되셨고 사람의 모양으로 나타나사</strong> 자기를 낮추시고 죽기까지 복종하셨으니 곧 십자가에 죽으심이라” (<a href="https://bibleox.com/ko/ko-nkrv/fil/2/#L6-8">빌 2:6-8</a>)</p></blockquote><blockquote><p>“태초에 말씀이 계시니라 이 말씀이 하나님과 함께 계셨으니 <strong>이 말씀은 곧 하나님이시니라</strong> &lt;…&gt; 만물이 그로 말미암아 지은 바 되었으니 지은 것이 하나도 그가 없이는 된 것이 없느니라 &lt;…&gt; <strong>말씀이 육신이 되어</strong> 우리 가운데 거하시매 우리가 그의 영광을 보니 아버지의 독생자의 영광이요 은혜와 진리가 충만하더라” (<a href="https://bibleox.com/ko/ko-nkrv/in/1/#L1,3,14">요 1:1,3,14</a>)</p></blockquote>
