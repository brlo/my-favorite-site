  title: 성령은 인격이시다
  copy_cover: true
  body: '<h2>성령께서는 인칭 대명사를 써서 자신에 관하여 말씀하신다</h2><blockquote><p>“베드로가 그 환상에 대하여 생각할 때에 <strong>성령께서 그에게 말씀하시되</strong> 두 사람이 너를 찾으니 일어나 내려가 의심하지 말고 함께 가라 <strong><mark>내가 그들을 보내었느니라</mark></strong> 하시니” (<a href="https://bibleox.com/ko/ko-nkrv/act/10/#L19-20">행 10:19-20</a>) <em>(그리스어: ἐγὼ ἀπέσταλκα αὐτούς — “내가 그들을 보내었다”.)</em></p></blockquote><blockquote><p>“주를 섬겨 금식할 때에 <strong>성령이 이르시되</strong> <strong><mark>내가 불러 시키는 일을 위하여</mark></strong> 바나바와 사울을 따로 세우라 하시니” (<a href="https://bibleox.com/ko/ko-nkrv/act/13/#L2">행 13:2</a>) <em>(그리스어: ἀφορίσατε δή μοι — “나를 위하여 따로 세우라”.)</em></p></blockquote><h2>성령께서 말씀하신다</h2><blockquote><p>“<strong>성령이 빌립더러 이르시되</strong> 이 수레로 가까이 나아가라 하시거늘” (<a href="https://bibleox.com/ko/ko-nkrv/act/8/#L29">행 8:29</a>; <a href="https://bibleox.com/ko/ko-nkrv/act/10/#L19-20">행 10:19-20</a>; <a href="https://bibleox.com/ko/ko-nkrv/act/13/#L2">행 13:2</a>)</p></blockquote><h2>성령께서 생각하시고 간구하신다</h2><blockquote><p>“마음을 살피시는 이가 <strong>성령의 생각</strong>을 아시나니 이는 성령이 하나님의 뜻대로 <strong>성도를 위하여 간구하심이니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/rim/8/#L27">롬 8:27</a>)</p></blockquote><h2>성령께서 원하시는 대로 행하신다</h2><blockquote><p>“이 모든 일은 같은 한 <strong>성령이</strong> 행하사 <strong>그의 뜻대로</strong> 각 사람에게 나누어 주시는 것이니라” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/12/#L11">고전 12:11</a>)</p></blockquote><h2>성령께서 선지자들을 통하여 말씀하신다</h2><blockquote><p>“서로 맞지 아니하여 흩어질 때에 바울이 한 말로 이르되 <strong>성령이 선지자 이사야를 통하여</strong> 너희 조상들에게 <strong>말씀하신 것이</strong> 옳도다 일렀으되 이 백성에게 가서 말하기를 너희가 듣기는 들어도 도무지 깨닫지 못하며 보기는 보아도 도무지 알지 못하는도다” (<a href="https://bibleox.com/ko/ko-nkrv/act/28/#L25-26">행 28:25-26</a>)</p></blockquote><blockquote><p>“그러므로 <strong>성령이 이르신 바와 같이</strong> 오늘 너희가 그의 음성을 듣거든” (<a href="https://bibleox.com/ko/ko-nkrv/evr/3/#L7">히 3:7</a>)</p></blockquote><h2>사람의 마음에서 아버지를 부르신다</h2><blockquote><p>“너희가 아들이므로 하나님이 그 아들의 <strong>영을</strong> 우리 마음 가운데 <strong>보내사</strong> <strong>아빠 아버지라 부르게 하셨느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gal/4/#L6">갈 4:6</a>) <em>(그리스어 κρᾶζον(“부르짖으시는”)은 영께서 친히 부르짖으신다는 뜻입니다.)</em></p></blockquote><h2>들으신다</h2><blockquote><p>“그러나 진리의 성령이 오시면 그가 너희를 모든 진리 가운데로 인도하시리니 그가 스스로 말하지 않고 오직 <strong>들은 것을 말하며</strong> 장래 일을 너희에게 알리시리라” (<a href="https://bibleox.com/ko/ko-nkrv/in/16/#L13">요 16:13</a>)</p></blockquote><h2>옳게 여기신다</h2><blockquote><p>“<strong>성령과 우리는</strong> 이 요긴한 것들 외에는 아무 짐도 너희에게 지우지 아니하는 것이 <strong>옳은 줄 알았노니</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/act/15/#L28">행 15:28</a>)</p></blockquote><h2>거하신다</h2><blockquote><p>“너희는 너희가 하나님의 성전인 것과 <strong>하나님의 성령이 너희 안에 계시는</strong> 것을 알지 못하느냐” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/3/#L16">고전 3:16</a>)</p></blockquote><h2>보이신다</h2><blockquote><p>“<strong>성령이 이로써 보이신 것은</strong> 첫 장막이 서 있을 동안에는 성소에 들어가는 길이 아직 나타나지 아니한 것이라” (<a href="https://bibleox.com/ko/ko-nkrv/evr/9/#L8">히 9:8</a>)</p></blockquote><h2>증언하신다</h2><blockquote><p>“또한 <strong>성령이 우리에게 증언하시되</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/evr/10/#L15">히 10:15</a>)</p></blockquote><h2>사람들이 성령을 시험한다</h2><blockquote><p>“베드로가 이르되 너희가 어찌 함께 꾀하여 <strong>주의 영을 시험하려 하느냐</strong> 보라 네 남편을 장사하고 오는 사람들의 발이 문 앞에 이르렀으니 또 너를 메어 내가리라 하니” (<a href="https://bibleox.com/ko/ko-nkrv/act/5/#L9">행 5:9</a>)</p></blockquote><h2>욕되게 한다</h2><blockquote><p>“하물며 하나님의 아들을 짓밟고 자기를 거룩하게 한 언약의 피를 부정한 것으로 여기고 <strong>은혜의 성령을 욕되게 하는</strong> 자가 당연히 받을 형벌은 얼마나 더 무겁겠느냐 너희는 생각하라” (<a href="https://bibleox.com/ko/ko-nkrv/evr/10/#L29">히 10:29</a>)</p></blockquote><h2>모독한다</h2><blockquote><p>“그러므로 내가 너희에게 이르노니 사람에 대한 모든 죄와 모독은 사하심을 얻되 <strong>성령을 모독하는 것</strong>은 사하심을 얻지 못하겠고” (<a href="https://bibleox.com/ko/ko-nkrv/mf/12/#L31">마 12:31</a>)</p></blockquote><h2>속이려 한다</h2><blockquote><p>“베드로가 이르되 아나니아야 어찌하여 사탄이 네 마음에 가득하여 네가 <strong>성령을 속이고</strong> 땅 값 얼마를 감추었느냐” (<a href="https://bibleox.com/ko/ko-nkrv/act/5/#L3">행 5:3</a>)</p></blockquote><h2>거스른다</h2><blockquote><p>“목이 곧고 마음과 귀에 할례를 받지 못한 사람들아 너희도 너희 조상과 같이 <strong>항상 성령을 거스르는도다</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/act/7/#L51">행 7:51</a>)</p></blockquote>'
  meta_desc: 성령께서는 언제나 인격으로 행하십니다. 거하시고, 말씀하시고, 들으시고, 옳게 여기시고, 보이십니다. 사람들은 성령을 시험하고, 욕되게 하고, 모독하고, 속이고, 거스릅니다
