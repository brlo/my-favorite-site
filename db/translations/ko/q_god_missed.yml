- src: Бог-нелицеприятный
  path: 1U24_하느님은_외모로_사람을_취하지_않으신다
  title: 하느님은 외모로 사람을 취하지 않으신다
  copy_cover: true
  body: <blockquote><p>“<strong>고관을 외모로 대하지 아니하시며 가난한 자들 앞에서 부자의 낯을 세워주지 아니하시나니</strong> 이는 그들이 다 그의 손으로 지으신 바가 됨이라” (<a href="https://bibleox.com/ko/ko-nkrv/iov/34/#L19">욥 34:19</a>)</p></blockquote><blockquote><p>“그런즉 너희는 여호와를 두려워하는 마음으로 삼가 행하라 <strong>우리의 하나님 여호와께서는 사람들 앞에서 불의함도 없으시고 치우침도 없으시고 뇌물을 받는 일도 없으시니라</strong> 하니라” (<a href="https://bibleox.com/ko/ko-nkrv/2par/19/#L7">대하 19:7</a>)</p></blockquote><blockquote><p>“<strong>주님은 심판자이시니, 그분께는 사람의 얼굴을 보아 주는 일이 없다. 그분은 가난한 이에게도 치우치지 않으시고</strong> 억울한 이의 간구를 들으신다” (<a href="https://bibleox.com/ko/gr-lxx-byz/prsir/35/#L12-13">집회 35:12-13</a>, 그리스어에서 번역) <em>(영어·러시아어 번역에서는 절 번호가 다릅니다.)</em></p></blockquote><blockquote><p>“와서 이르되 선생님이여 우리가 아노니 당신은 참되시고 아무도 꺼리는 일이 없으시니 이는 <strong>사람을 외모로 보지 않고</strong> 오직 진리로써 하나님의 도를 가르치심이니이다 가이사에게 세금을 바치는 것이 옳으니이까 옳지 아니하니이까” (<a href="https://bibleox.com/ko/ko-nkrv/mk/12/#L14">막 12:14</a>; <a href="https://bibleox.com/ko/ko-nkrv/lk/20/#L21">눅 20:21</a>)</p></blockquote><blockquote><p>“이는 <strong>하나님께서 외모로 사람을 취하지 아니하심이라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/rim/2/#L11">롬 2:11</a>)</p></blockquote><blockquote><p>“상전들아 너희도 그들에게 이와 같이 하고 위협을 그치라 이는 그들과 너희의 상전이 하늘에 계시고 그에게는 <strong>사람을 외모로 취하는 일이 없는 줄</strong> 너희가 앎이라” (<a href="https://bibleox.com/ko/ko-nkrv/ef/6/#L9">엡 6:9</a>)</p></blockquote><blockquote><p>“불의를 행하는 자는 불의의 보응을 받으리니 <strong>주는 사람을 외모로 취하심이 없느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/kol/3/#L25">골 3:25</a>)</p></blockquote><blockquote><p>“<strong>외모로 보시지 않고 각 사람의 행위대로 심판하시는 이를 너희가 아버지라 부른즉</strong> 너희가 나그네로 있을 때를 두려움으로 지내라” (<a href="https://bibleox.com/ko/ko-nkrv/1pet/1/#L17">벧전 1:17</a>)</p></blockquote>
  title_sub: 하느님께서는 사람의 신분을 보지 않으시고 왕과 평민을 똑같이 받아들이신다
