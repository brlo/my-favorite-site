- src: Христос-на-небе
  path: Pw4n_하늘에_계신_그리스도
  title: 하늘에 계신 그리스도
  copy_cover: true
  body: <blockquote><p>“주 예수께서 말씀을 마치신 후에 <strong>하늘로 올려지사 하나님 우편에 앉으시니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mk/16/#L19">막 16:19</a>)</p></blockquote><blockquote><p>“이는 하나님의 영광의 광채시요 그 본체의 형상이시라 그의 능력의 말씀으로 만물을 붙드시며 죄를 정결하게 하는 일을 하시고 <strong>높은 곳에 계신 지극히 크신 이의 우편에 앉으셨느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/evr/1/#L3">히 1:3</a>)</p></blockquote><blockquote><p>“지금 우리가 하는 말의 요점은 <strong>이러한 대제사장이 우리에게 있다는 것이라 그는 하늘에서 지극히 크신 이의 보좌 우편에 앉으셨으니</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/evr/8/#L1">히 8:1</a>)</p></blockquote><blockquote><p>“오직 그리스도는 죄를 위하여 한 영원한 제사를 드리시고 <strong>하나님 우편에 앉으사</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/evr/10/#L12">히 10:12</a>)</p></blockquote><blockquote><p>“믿음의 주요 또 온전하게 하시는 이인 예수를 바라보자 그는 그 앞에 있는 기쁨을 위하여 십자가를 참으사 부끄러움을 개의치 아니하시더니 <strong>하나님 보좌 우편에 앉으셨느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/evr/12/#L2">히 12:2</a>)</p></blockquote><blockquote><p>“<strong>그리스도께서는</strong> 참 것의 그림자인 손으로 만든 성소에 들어가지 아니하시고 <strong>바로 그 하늘에 들어가사</strong> 이제 우리를 위하여 하나님 앞에 나타나시고” (<a href="https://bibleox.com/ko/ko-nkrv/evr/9/#L24">히 9:24</a>)</p></blockquote><blockquote><p>“스데반이 성령 충만하여 하늘을 우러러 주목하여 하나님의 영광과 및 <strong>예수께서 하나님 우편에 서신 것을 보고 말하되 보라 하늘이 열리고 인자가 하나님 우편에 서신 것을 보노라</strong> 한대” (<a href="https://bibleox.com/ko/ko-nkrv/act/7/#L55-56">행 7:55-56</a>)</p></blockquote>
