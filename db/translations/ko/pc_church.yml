  copy_cover: true
  body: '<p><strong>정교회</strong>(그리스어 Ἡ Ὀρθόδοξη Ἐκκλησία, 영어 Eastern Orthodox Church, 일본어 正教会)는 —</p><ol><li><p>가장 단순한 의미로, 그리스도를 정교한 방식으로 믿는 모든 사람들 — 땅에 살고 있거나 이미 하늘에서 그리스도와 함께 살기 위해 떠난 사람들의 모임이며;</p></li><li><p>더 복잡하지만 깊은 의미로, 머리는 그리스도시고 몸의 지체들은 정교한 <strong>믿음</strong>, <strong>성사(聖祕)</strong>와 <strong>성직 제도</strong>로 결합된, 그리스도를 올바르게 믿는 모든 사람들인 신인(神人)적 유기체입니다.</p></li></ol><h2>이름</h2><p>그리스도께서 세우신 교회는 처음부터 기독교인의 교회로도, 정교회로도 불리지 않았습니다. 신자들이 기독교인이라 불리게 된 것은 그 후, 같은 1세기에 안티오키아에서였습니다(<a href="https://bibleox.com/ko/ko-nkrv/act/11/#L26">행 11:26</a>). 기독교인들이 자신들을 <a href="https://bibleox.com/ru/ru/w/%D0%BF%D0%BE%D1%87%D0%B5%D0%BC%D1%83-%D1%86%D0%B5%D1%80%D0%BA%D0%BE%D0%B2%D1%8C-%D0%BF%D1%80%D0%B0%D0%B2%D0%BE%D1%81%D0%BB%D0%B0%D0%B2%D0%BD%D0%B0%D1%8F" lang="ru">정교인</a>이라 부르게 된 것은 2세기에[1] 교회의 믿음을 이단적 공동체(영지주의자들 등)의 믿음과 구별하기 위해서였습니다.</p><h2>구조</h2><h3>지방 교회[3]</h3><ol><li><p><strong>알바니아 정교회</strong>;</p></li><li><p><strong>알렉산드리아 정교회</strong>;</p></li><li><p><strong>안티오키아 정교회</strong>;</p></li><li><p><strong>불가리아 정교회</strong>;</p></li><li><p><strong>조지아 정교회</strong>;</p></li><li><p><strong>예루살렘 정교회</strong>;</p></li><li><p><strong>키프로스 정교회</strong>;</p></li><li><p><strong>콘스탄티노플 정교회</strong>;</p></li><li><p><strong>마케도니아 정교회 — 오흐리드 대관구</strong>;</p></li><li><p><strong>폴란드 정교회</strong>;</p></li><li><p><strong>아메리카 정교회</strong>;</p></li><li><p><strong>체코와 슬로바키아 정교회</strong>;</p></li><li><p><strong>러시아 정교회</strong>;</p></li><li><p><strong>루마니아 정교회</strong>;</p></li><li><p><strong>세르비아 정교회</strong>;</p></li><li><p><strong>그리스 정교회</strong>.</p></li></ol><h3>자치 교회</h3><ol><li><p><strong>중국 자치 정교회</strong>;</p></li><li><p><strong>핀란드 자치 정교회</strong>;</p></li><li><p><strong>일본 자치 정교회</strong>.</p></li></ol><h2>역사</h2><p>정교회는 그리스도 강생 후 33년, 그리스도 부활 후 50째 되는 날, 이른바 오순절 날에 세워졌습니다. 그날에 성령이 예루살렘의 한 집에 모인 그리스도의 제자들(사도들) 위에 강림하였습니다. 그들은 온 세계에 복음을 전하는 데 필요한 초자연적 은사들을 받았습니다. 이윽고 사도들은 온 세계로 나아가 교회 공동체들을 세우고, 그 안에 사제들(프리스비테로스)을 서품하였습니다. 이렇게 정교회는 점차 자라나 1세기 말에는 로마 제국 영토 전체에 이르는 규모에 이르렀고, 그 경계를 넘어섰습니다.</p><h2>1~4세기 — 박해의 시기</h2><p>정교회는 유대교 신자들로부터의 혹독한 박해의 시기를 지나고 있었고, 이윽고 이방 종교 신자들, 그리고 당시 이방 종교였던 로마 제국의 국가 기구까지 박해에 가담하였습니다.</p><h2>4세기 — 자유의 획득, 신학</h2><p>313년 로마 제국에서 <a href="https://bibleox.com/ru/ru/w/%D0%9C%D0%B8%D0%BB%D0%B0%D0%BD%D1%81%D0%BA%D0%B8%D0%B9_%D1%8D%D0%B4%D0%B8%D0%BA%D1%82_%D0%BE_%D1%81%D0%B2%D0%BE%D0%B1%D0%BE%D0%B4%D0%B5_%D1%85%D1%80%D0%B8%D1%81%D1%82%D0%B8%D0%B0%D0%BD%D1%81%D0%BA%D0%BE%D0%B9_%D0%B2%D0%B5%D1%80%D1%8B_313%D0%B3" lang="ru">밀라노 칙령</a>이 반포되어 기독교를 포함한 모든 종교에 대한 관용이 선언되었습니다. 박해가 끝났습니다. 박해 기간에 빼앗긴 건물들이 정교회에 돌아왔습니다. 정교 신앙에 관해 상세히 저술하고 그것을 변호하고 전파하는 유명한 신학자들이 많이 나타났습니다.</p><h2>4~8세기 — 공의회의 시기</h2><p>자유를 얻은 뒤 정교회는 생겨난 거짓 가르침과 관련한 문제들을 결정하고 교회를 평화와 일치 안에 지키기 위해 모든 주교들(수석 사제들)의 회의를 소집할 수 있게 되었습니다. 전 교회의 주교들로 이루어진 이러한 회의들은 「공의회」라는 이름을 얻었으며, 비록 그 이전에도 작은 지방 공의회들이 있었지만, 급한 문제들을 공의회적으로 결정하는 사도적 관행의 계속이었습니다(<a href="https://bibleox.com/ko/ko-nkrv/act/15/#L6-22">행 15:6-22</a>).</p><p>모든 공의회는 한 번 전해지고 교회 안에 보존된 믿음과 진리를 왜곡하려는 시도에 대한 정교회의 응답이었습니다. 예를 들어 교회에는 하느님에 관한 단순한 믿음이 주어졌습니다: 하느님은 분리되신 분이시면서, 아버지께서 하느님이시고, 아들이 하느님이시며, 성령께서 하느님이시고, 이들 사이에는 통공이 있으며, 이들 가운데 오직 한 분(하느님의 아들)만이 시간 안에 죄와 죽음으로부터 사람들을 구원하기 위하여 동정녀 마리아께서 낳으셨고, 자기 교회를 세우셨습니다. 교회는 단순한 마음으로 이 믿음을 받아들이고 지켰습니다. 그러나 다른 가르침을 내놓는 사람들이 일어날 때마다 — 아들은 신성한 존엄을 부인하고, 성령의 신성을 부인하고, 아들을 예수님으로부터 분리시키고 — 교회는 믿음과 일치를 지키기 위해 모여 오류를 지적하였습니다.</p><p>함께 모여 믿음을 옹호하면서 교회는 잘못된 믿음을 지적할 뿐 아니라 올바른 믿음을 설명하고, 이 믿음의 이 부분을 왜곡하려는 시도에 대한 방패가 되는 정의들을 내리지 않을 수 없었습니다. 이 시대 초기의 성스러운 주교가 이에 관해 이렇게 씁니다:</p><p><strong>푸아티에의 성 힐라리오, 주교(315~367경)</strong></p><blockquote><p>“<strong><em>오직</em> 이단자들의 악의가 우리로 하여금 허락되지 않은 일을 하게 하고, 다다를 수 없는 고봉에 오르게 하고, 말할 수 없는 대상에 관해 말하게 하고, 금지된 탐구에 착수하게 합니다. <mark>우리는 진실한 믿음으로 우리에게 명령된 것을 행하는 것으로 족하게 될 터이니, 곧 아버지이신 하느님을 예배하고, 그분과 함께 하느님의 아드님을 공경하며, 성령으로 충만해지는 것입니다.</mark> 그러나 이제 우리는 말할 수 없는 신비를 드러내기 위해 우리의 연약한 말을 쓸 수밖에 없게 되었습니다.</strong><em> 다른 이들의 오류가 우리로 하여금, 경건한 믿음으로 우리 영혼 깊은 곳에 보존해야 할 신비들을 인간의 말로 설명하는 위험한 길을 걷게 합니다.</em>”</p></blockquote><p>(<a href="https://azbyka.ru/otechnik/Ilarij_Piktavijskij/o-troitse/" lang="ru">『<u>지성삼위</u>에 관하여』 2:2</a>)</p><p>대체로 성경 자체(경전 목록으로 확정된 형태)는 이 목록을 왜곡하려는 시도에 대한 교회의 응답으로 나타났습니다:</p><p><strong>테르툴리아누스(155~220경)</strong></p><blockquote><p>“이 <strong>이단(영지주의 — 주)은 성경의 일부 (책)들을 받아들이지 않으며</strong>, 받아들이는 것들조차 전체로 받아들이지 않고 자기 계획에 맞게 삽입과 누락으로 왜곡합니다”.</p></blockquote><p>(<a href="https://azbyka.ru/otechnik/Tertullian/o_prescript/" lang="ru">『이단들에 대한 규정』</a>)</p><p>공의회의 결실을 간략히:</p><h3>제1차 공의회 — 제1차 니케아 공의회, 325년, 주교 318명</h3><ul><li><p><strong>아리우스의 정죄</strong>. 그리스도께서 하느님이 아니라 하느님이 지으신 특별한 피조물이라고 가르친 아리우스의 이단 정죄.</p></li><li><p><strong>신경</strong>. 신경의 첫 7개 조항이 확정되었습니다.</p></li><li><p><strong>부활절 날짜</strong>. 춘분 이후의 보름이 지난 뒤 첫 주일에 부활절을 지냅니다.</p></li></ul><h3>제2차 공의회 — 제1차 콘스탄티노플 공의회, 381년, 주교 150명</h3><ul><li><p><strong>마케도니오스의 정죄.</strong> 성령께서 하느님이 아니라 아버지와 아들의 능력이라고 가르친 마케도니오스의 이단이 정죄되었습니다.</p></li><li><p><strong>신경 완성</strong>. 신경에 5개 조항이 더해졌습니다.</p></li></ul><h3>제3차 공의회 — 에페소 공의회, 431년, 주교 160명</h3><ul><li><p><strong>네스토리우스의 정죄</strong>. 그리스도께서 보통 사람이시며 태어난 뒤 하느님이 성전처럼 그 안에 들어 사신다고 가르친 네스토리우스의 이단이 정죄되었습니다.</p></li><li><p><strong>정의</strong>. 그리스도는 참 하느님이시며 참 사람이십니다. 동정녀 마리아는 하느님의 어머니이십니다.</p></li><li><p><strong>신경 변경 금지</strong>.</p></li></ul><h3>제4차 공의회 — 칼케돈 공의회, 451년, 주교 520명</h3><ul><li><p><strong>단성론의 정죄</strong>. 그리스도의 인성이 신성에 온전히 흡수되어 그 안에 인성 없이 오직 신성만 남았다고 가르친 에우티케스의 이단이 정죄되었습니다.</p></li><li><p><strong>정의</strong>. 하느님의 아들의 인격 안에 두 본성(신적 본성과 인적 본성)이 결합되었습니다: <strong>혼합되지 않고 변하지 않으며, 분리되지 않고 떨어지지 않습니다</strong>. 본성들이 하나로 합쳐진 것이 아니며, 결합으로 인해 어느 본성도 변하지 않았고, 결합은 분리 없이 영원히 이룹니다.</p></li></ul><h3>제5차 공의회 — 제2차 콘스탄티노플 공의회, 553년, 주교 165명</h3><ul><li><p><strong>오리게네스의 정죄. </strong>지옥의 형벌이 유한하고 종국적으로 모든 사람이 구원된다는 그릇된 가르침을 편 오리게네스가 정죄되었습니다[2].</p></li><li><p><strong>저작들의 정죄</strong>:</p><ul><li><p>모프수에스티아의 테오도로(본인도 네스토리우스의 스승으로 정죄됨);</p></li><li><p>에데사의 이바(네스토리우스주의 혐의);</p></li><li><p>키로스의 테오도레토(알렉산드리아의 성 키릴로의 가르침 비판).</p></li></ul></li></ul><h3>제6차 공의회 — 제3차 콘스탄티노플 공의회, 680년, 주교 170명</h3><ul><li><p><strong>단의론의 정죄</strong>. 그리스도 안에 한 의지(오직 신적 의지)만 있다고 가르친 이단이 정죄되었습니다.</p></li><li><p><strong>정의</strong>. 그리스도 안에는 하느님으로서 신적 의지가, 사람으로서 인적 의지가 있습니다. 인적 의지는 신적 의지에 복종합니다.</p></li></ul><h3>제7차 공의회 — 제2차 니케아 공의회, 787년, 주교 219명과 수사 131명</h3><ul><li><p><strong>성상파괴주의의 정죄</strong>. 교회의 성상들을 우상으로 여기고, 그리스도와 성인들을 묘사하는 것도 이들을 공경하는 것도 허락하지 않았던 이단이 정죄되었습니다.</p></li></ul><h2>10~11세기 — 로마 지방 교회의 이탈</h2><p>이 시기에 로마의 정교 주교들이 신앙의 가르침을 바꾸고 새것을 도입하며 다른 모든 교회들에 이것을 인정할 것을 요구하였습니다.</p><p>로마 교회의 주요 오류 중 하나는 성령이 아버지로부터만이 아니라 아들로부터도 발출된다는 가르침(필리오퀘, filioque)이었습니다. 이는 복음 안에서 그리스도께서 직접 하신 말씀(<a href="https://bibleox.com/ru/ru/w/f18sRKqQ_%D0%92%D0%BE%D0%B7%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D1%8F_%D0%BF%D1%80%D0%BE%D1%82%D0%B8%D0%B2_%D1%84%D0%B8%D0%BB%D0%B8%D0%BE%D0%BA%D0%B2%D0%B5" lang="ru">자세히</a>)과 성교부들 모두와 모순됩니다. 이 가르침은 로마 교회 자신이 일찍이 자기 역사 안에서 정죄한 바 있습니다. 그러나 여기서 시작하여 로마에서는 교회에 관한 가르침도 바꾸어, 로마 주교를 온 세계 전체 교회의 수장으로 삼았으니 이는 결코 있던 일이 아니었습니다. 여기에 가톨릭은 동정녀 마리아의 원죄 없는 잉태, 연옥, 공덕 보고(그로부터 나오는 면죄부), 교의석(ex cathedra)에서의 가르침에 있어 로마 주교의 무류성에 관한 가르침을 더했습니다. 교회는 첫 천 년 동안 이것들을 알지도 못했고 고백하지도 않았습니다. 이 모든 것은 새것, 왜곡, 이단입니다.</p><p>나머지 모든 정교회들(예루살렘, 안티오키아, 알렉산드리아, 콘스탄티노플, 조지아 교회)은 이 새것들을 거부하였습니다.</p><p>안티오키아 교회는 대화를 통해 로마 교회가 새것들을 버리도록 설득하려 하였으나(<a href="https://bibleox.com/ru/ru/w/VuAM_%D0%9A%D0%BE%D0%BD%D1%82%D0%B5%D0%BA%D1%81%D1%82_%D1%81%D0%BE%D0%B1%D1%8B%D1%82%D0%B8%D0%B9_1054_%D0%B3%D0%BE%D0%B4%D0%B0" lang="ru">자세히</a>), 결국 이후 몇 세기에 걸쳐 분열이 최종적으로 굳어졌습니다. 마지막 단계는 정교 비잔티움 제국의 수도 콘스탄티노플에 대한 가톨릭 제4차 십자군의 공격이었습니다. 이 공격의 성격 자체가 결정적이었습니다. 모든 가톨릭 십자군은 로마 주교의 발의로 예루살렘과 성지를 무슬림 정복자들에게서 해방시키기 위해 파견되었습니다. 그러나 제4차 십자군의 조직자들은 정교 콘스탄티노플과 영토 통과에 관한 이미 익숙한 합의를 갖고 있으면서 갑자기 목표를 예루살렘에서 콘스탄티노플 자체로 바꾸었습니다. 배신적으로 공격하여 점령하고, 주민들을 죽이고, 성물들을 약탈하고, 도시의 잔해 위에 라틴 제국을 세웠으며 — 예루살렘에는 가지 않았습니다.</p><p>이로써 로마 교회는 마침내 보편 정교회에서 완전히 이탈하였습니다.</p><p>정교회는 인구의 언어에 따라 다르게 불렸습니다. 그리스어를 쓰는 주민들은 교회를 정교회(그리스어 ορθοδόξω) 또는 보편의(그리스어 καθολικός), 그러나 더 흔히 정교회라고 불렀습니다. 라틴어를 쓰는 주민들도 교회를 정교회(라틴어 ortodox)와 보편의(라틴어 catholic)라 불렀지만, 더 흔히 보편의(catholic)라 불렀습니다. 그리스어 “καθολικός”는 「ㅎ」 소리로 발음되어 “카톨리코스”였으나, 라틴어로 차용된 뒤에는 「ㅌ」 소리를 통해 “카톨릭”으로 발음되었습니다.</p><p>모든 정교회들로부터 이탈한 뒤 로마 교회는 점점 가톨릭이라는 이름으로만 알려지게 되었고, 마침내 로마 가톨릭 교회, 곧 간단히 가톨릭 교회라는 이름을 받았습니다.</p><h2>11~21세기</h2><p>정교회는 점차 자라나 새로운 지방 교회들이 나타났습니다(세르비아, 폴란드 등[3]). 논쟁에서 교회는 주로 로마 가톨릭 교회(RCC)의 확장에 대한 대항이라는 도전과 마주쳤고, 최근 세기에는 RCC와의 대항 속에서 서방에서 태어난 개신교 공동체들과도 마주쳤습니다.</p><p>교회의 믿음을 왜곡하려는 시도는 끝난 적이 없습니다. 개신교의 발생은 주로 교회에 관한 가르침의 왜곡이었으나, 오늘날 개신교 공동체들은 과거의 온갖 이단들을 여러 가지 순서로 조합하여 담고 있습니다. 전체적으로, 이교적 오류에 이르기까지 과거 모든 세기의 오류들의 회귀가 정교회가 직면한 현대적 도전입니다.</p>'
