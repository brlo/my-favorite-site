    meta_desc: 안티오키아의 성 이그나티오스(테오포로스)가 스미르나의 주교 폴리카르포스에게 보낸 편지. 그리스어 원문에서 번역하고 주석을 붙임.
    menu: { parent: "편지", title: "폴리카르포스에게 보낸 편지", priority: 3 }
    body: |-
      <h2>0</h2><p>이그나티오스 곧 테오포로스[1]가, 스미르나 사람들의 교회의 주교 폴리카르포스—아니, 오히려 아버지 하느님과 주 예수 그리스도께서 돌보시는 주교 폴리카르포스—에게 진심으로 문안합니다.</p>
      <h2>1</h2><p>1. 흔들리지 않는 바위 위에 세워진 듯한[2] 하느님 안에서의 그대의 뜻을 받아들이며, 나는 하느님께 크게 영광을 드립니다. 그대의 흠 없는 얼굴을 볼 수 있게 되었기 때문입니다[3]. 하느님 안에서 그대로 말미암아 기쁨을 누리고 싶습니다.</p><p>2. 그대가 입고 있는 은총으로 그대에게 권합니다. 그대가 달리는 길을 더욱 힘써 달리고, 모든 사람이 구원받도록 권하십시오. 육과 영의 모든 보살핌으로 그대의 직무[4]를 다하십시오. 일치에 마음을 쓰십시오. 그보다 좋은 것은 없습니다. 주님께서 그대를 짊어지시듯이 모든 사람을 짊어지십시오[5]. 지금도 그러하듯이 사랑 안에서 모든 사람을 참아 주십시오.</p><p>3. 끊임없이 기도하는 데 힘쓰십시오[6]. 지금 지닌 것보다 더 많은 깨달음을 청하십시오. 잠들지 않는 영을 지니고 깨어 있으십시오. 한 사람 한 사람에게 하느님과 같은 마음으로 말하십시오. 완전한 운동선수처럼 모든 사람의 병을 짊어지십시오[7]. 수고가 많은 곳에 얻는 것도 많습니다.</p>
      <h2>2</h2><p>1. 좋은 제자들만 사랑한다면 그대에게 무슨 칭찬거리가 되겠습니까[8]? 오히려 더 다루기 힘든 사람들을 온유함으로 따르게 하십시오. 모든 상처가 같은 고약으로 낫는 것은 아닙니다. 발작은 찜질로 가라앉히십시오.</p><p>2. 모든 일에서 뱀처럼 슬기롭고 언제나 비둘기처럼 순박하십시오[9]. 그대가 육적이면서 영적인 것은, 눈앞에 드러나는 일을 부드럽게 다루기 위해서입니다. 보이지 않는 것은 그대에게 드러나도록 청하십시오[10]. 그러면 그대는 아무것도 모자라지 않고 모든 은사가 넘칠 것입니다.</p><p>3. 키잡이가 바람을 찾고 폭풍을 만난 사람이 항구를 찾듯이, 시대가 그대를 찾고 있습니다. 하느님께 이르기 위해서입니다. 하느님의 운동선수로서 절제하십시오[11]. 상은 불멸과 영원한 생명이며, 그대도 그것을 확신하고 있습니다. 나와, 그대가 사랑해 준 이 사슬은 모든 면에서 그대를 위하여 대신 바치는 목숨입니다.</p>
      <h2>3</h2><p>1. 믿음직해 보이면서 다른 것을 가르치는 자들 때문에 놀라지 마십시오. 두들겨 맞는 모루처럼 굳건히 서 있으십시오. 얻어맞으면서 이기는 것이 위대한 운동선수의 몫입니다. 무엇보다 하느님을 위하여 우리는 모든 것을 견뎌야 합니다. 그분께서도 우리를 참아 주시도록 말입니다.</p><p>2. 지금보다 더 열심을 내십시오. 시대를 분별하십시오. 시대를 넘어서신 분, 시간이 없으신 분, 보이지 않으시나 우리를 위하여 보이게 되신 분, 만질 수 없으신 분, 고난을 받지 않으시나 우리를 위하여 고난을 받으실 수 있게 되신 분, 모든 방법으로 우리를 위하여 참아 주신 분을 기다리십시오.</p>
      <h2>4</h2><p>1. 과부들을 소홀히 하지 마십시오[12]. 주님 다음으로 그대가 그들을 돌보는 사람이 되십시오. 그대의 동의 없이 아무 일도 이루어져서는 안 됩니다. 그대도 하느님을 제쳐 놓고 아무것도 하지 마십시오. 실제로 그대는 그렇게 하지 않습니다. 굳건히 서 있으십시오.</p><p>2. 모임을 더 자주 가지십시오. 모든 사람을 이름을 불러 찾으십시오.</p><p>3. 남종과 여종을 업신여기지 마십시오. 그러나 그들 자신도 교만해서는 안 되며, 하느님의 영광을 위하여 더욱 잘 섬겨야 합니다. 하느님에게서 더 나은 자유를 얻기 위해서입니다[13]. 공동의 돈으로 자유를 얻기를 바라지 마십시오. 욕망의 종으로 드러나지 않기 위해서입니다.</p>
      <h2>5</h2><p>1. 악한 술책[14]을 피하십시오. 오히려 그것에 대하여 설교하십시오. 나의 자매들에게는 주님을 사랑하고 육으로나 영으로나 남편에게 만족하라고 말하십시오. 마찬가지로 나의 형제들에게도 예수 그리스도의 이름으로, 주님께서 교회를 사랑하셨듯이 아내를 사랑하라고 명하십시오[15].</p><p>2. 누가 주님의 살을 공경하여[16] 정결 가운데 머무를 수 있다면, 자랑하지 말고 머무르십시오. 자랑한다면 그는 멸망하고, 주교보다 더 알려지기를 바란다면 그는 타락한 것입니다. 장가드는 남자와 시집가는 여자는 주교의 동의를 얻어 결합하는 것이 마땅합니다[17]. 그것은 혼인이 욕망을 따르지 않고 주님을 따르게 하려는 것입니다. 모든 것을 하느님의 영예를 위하여 하십시오.</p>
      <h2>6</h2><p>1. 여러분은 주교에게 마음을 기울이십시오[18]. 하느님께서도 여러분에게 마음을 기울이시도록 말입니다. 주교와 사제들과 보제들에게 순종하는 사람들을 위하여 나는 내 목숨을 내놓습니다. 그들과 함께 하느님 안에서 내 몫을 얻을 수 있기를 빕니다. 서로 함께 수고하고, 함께 싸우고, 함께 달리고, 함께 고난을 받고, 함께 잠들고, 함께 일어나십시오. 하느님의 집의 관리인[19]이며 측근이며 종으로서 말입니다.</p><p>2. 여러분이 섬기는 분, 여러분에게 봉급을 주시는 분의 마음에 들도록 하십시오[20]. 여러분 가운데 아무도 탈영병으로 드러나지 않게 하십시오[21]. 세례를 여러분의 무기로, 믿음을 투구로, 사랑을 창으로, 인내를 온 무장으로 삼으십시오[22]. 여러분의 행실을 예금으로 삼으십시오. 그에 합당한 지급을 받기 위해서입니다[23]. 그러므로 하느님께서 여러분에게 그러하시듯이 온유함 안에서 서로 참아 주십시오. 언제나 여러분으로 말미암아 기쁨을 누리고 싶습니다.</p>
      <h2>7</h2><p>1. 여러분의 기도 덕분에 시리아의 안티오키아 교회가 평화를 얻었다는 소식이 나에게 전해졌습니다. 그래서 나도 하느님 안에서 걱정을 덜고 더욱 마음이 밝아졌습니다. 고난을 받음으로써 하느님께 이르고, 여러분의 간구로[24] 제자로 드러난다면 말입니다.</p><p>2. 하느님께 가장 복을 받은 폴리카르포스여, 하느님께 가장 합당한 회의를 열어, 여러분이 몹시 사랑하고 수고를 아끼지 않는 사람 하나를 뽑는 것[25]이 마땅합니다. 그는 '하느님의 길을 달리는 사람'이라고 불릴 수 있을 것입니다. 그를 합당한 사람으로 여겨 시리아로 가게 하여, 하느님의 영광을 위하여 수고를 아끼지 않는 여러분의 사랑을 찬미하게 하십시오.</p><p>3. 그리스도인은 자기 자신에 대한 권한이 없고, 하느님을 위하여 시간을 씁니다. 이 일은 하느님의 일이며, 여러분이 이 일을 이루어 낼 때 여러분의 일도 됩니다. 나는 여러분이 하느님께 합당한 선행을 할 준비가 되어 있다고 은총으로 믿습니다. 진리를 향한 여러분의 열성을 알기에 짧은 편지로 여러분에게 권하였습니다.</p>
      <h2>8</h2><p>1. 나는 (하느님의) 뜻이 명하는 대로 트로아스에서 네아폴리스로 갑자기 배를 타고 떠나게 되어[26] 모든 교회에 편지를 쓸 수 없었습니다. 그러니 하느님의 뜻을 지닌 그대가 앞에 있는 교회들에 편지를 써서, 그들도 같은 일을 하게 하십시오. 걸어서 사람을 보낼 수 있는 교회는 사람을 보내고, 다른 교회들은 그대가 보내는 사람들 편에 편지를 보내게 하십시오. 그리하여 그럴 자격이 있는 그대가 영원한 일로 영광을 받게 하십시오.</p><p>2. 나는 모든 사람에게 이름을 불러 문안합니다. 에피트로포스의 아내[27]에게도, 그의 온 집안과 자녀들과 함께 문안합니다. 나의 사랑하는 아탈로스에게 문안합니다. 시리아로 갈 자격을 얻게 될 사람에게 문안합니다. 은총이 언제나 그와 함께, 또 그를 보내는 폴리카르포스와 함께 있기를 빕니다.</p><p>3. 우리 하느님이신 예수 그리스도 안에서 여러분이 언제나 평안하기를 기도합니다. 그분 안에서 하느님의 일치와 주교의 돌봄[28] 안에 머무르십시오. 나에게 그리운 이름인 알케에게 문안합니다. 주님 안에서 안녕히 계십시오.</p>
    references: |-
      <ol><li><p>이그나티오스는 트로아스에서 네아폴리스로 배를 타고 떠나기 전에 스미르나의 주교 폴리카르포스에게 이 편지를 썼습니다. 주교의 직무에 관한 사목적 권고의 편지입니다. 1–5장은 폴리카르포스 개인에게(2인칭 단수로), 6장부터는 교회 전체에게 말합니다. 폴리카르포스는 뒷날 스미르나에서 순교하였습니다(155년경).</p></li><li><p><a href="https://bibleox.com/ko/ko-ctb/mf/7/#L24-25">마태 7:24-25</a> 참조.</p></li><li><p>이그나티오스가 로마로 가는 길에 스미르나에 머물렀을 때 폴리카르포스를 만난 일을 가리킵니다.</p></li><li><p>τόπος — '자리, 지위'. 여기서는 주교의 직무를 말합니다.</p></li><li><p><a href="https://bibleox.com/ko/ko-ctb/gal/6/#L2">갈라 6:2</a> 참조.</p></li><li><p><a href="https://bibleox.com/ko/ko-ctb/1sol/5/#L17">1데살 5:17</a> 참조.</p></li><li><p><a href="https://bibleox.com/ko/ko-ctb/mf/8/#L17">마태 8:17</a> 참조.</p></li><li><p><a href="https://bibleox.com/ko/ko-ctb/lk/6/#L32">루가 6:32</a> 참조.</p></li><li><p><a href="https://bibleox.com/ko/ko-ctb/mf/10/#L16">마태 10:16</a> 참조.</p></li><li><p>사람의 숨은 성향과 마음속을 꿰뚫어 볼 수 있도록, 이라는 뜻으로 풀이됩니다.</p></li><li><p><a href="https://bibleox.com/ko/ko-ctb/1kor/9/#L25">1고린 9:25</a> 참조.</p></li><li><p><a href="https://bibleox.com/ko/ko-ctb/1tim/5/#L3">1디모 5:3</a> 참조.</p></li><li><p><a href="https://bibleox.com/ko/ko-ctb/1kor/7/#L21-22">1고린 7:21-22</a> 참조.</p></li><li><p>κακοτεχνίαι. 그릇된 가르침과 이단의 술책을 가리킨다고도 하고, 말재주의 기교를 가리킨다고도 합니다.</p></li><li><p><a href="https://bibleox.com/ko/ko-ctb/ef/5/#L25">에페 5:25</a> 참조.</p></li><li><p>주님의 살(그리스도의 몸인 교회, 그리고 주님께서 당신의 지체로 삼으신 우리의 몸)을 공경하여, 라는 뜻입니다.</p></li><li><p><a href="https://bibleox.com/ko/ko-ctb/1kor/7/#L39">1고린 7:39</a> '다만 주님을 믿는 사람이어야 합니다' 참조.</p></li><li><p>여기서부터 편지는 교회 전체에게(2인칭 복수로) 말합니다.</p></li><li><p><a href="https://bibleox.com/ko/ko-ctb/1kor/4/#L1-2">1고린 4:1-2</a> 참조.</p></li><li><p><a href="https://bibleox.com/ko/ko-ctb/2tim/2/#L3-4">2디모 2:3-4</a> 참조. 아래는 로마 군대의 생활에 빗댄 말입니다.</p></li><li><p>δεσέρτωρ — 라틴어 desertor(탈영병)에서 빌려 온 말. 무기를 버리고 달아나는 병사를 말합니다.</p></li><li><p><a href="https://bibleox.com/ko/ko-ctb/ef/6/#L11-17">에페 6:11-17</a> 참조.</p></li><li><p>δεπόσιτα와 ἄκκεπτα — 라틴어 deposita(예금)와 accepta(지급)에서 빌려 온 말. 로마 병사들은 보수와 전리품의 일부를 군기 아래 맡겨 두었다가 제대할 때 한꺼번에 받았습니다.</p></li><li><p>사본과 이 사이트의 그리스어 본문은 ἐν τῇ ἀναστάσει ὑμῶν '여러분의 부활 때에'로 읽지만, 라이트풋 등의 교정자들은 ἐν τῇ αἰτήσει ὑμῶν '여러분의 간구(기도)로'로 고쳐 읽으며, 이 번역도 이를 따랐습니다. 사본대로라면 '(마지막 날) 여러분이 부활할 때에 제자로 드러난다'는 뜻이 됩니다.</p></li><li><p>χειροτονῆσαι. <a href="https://bibleox.com/ko/ko/w/Ig2F_필라델피아교회에보낸편지#HH-10">「필라델피아 교회에 보낸 편지」 10:1</a>의 주석 참조.</p></li><li><p><a href="https://bibleox.com/ko/ko-ctb/act/16/#L11">사도 16:11</a> 참조. 바울로도 트로아스에서 네아폴리스로 건너갔습니다.</p></li><li><p>τὴν τοῦ Ἐπιτρόπου — '에피트로포스의 아내'. 에피트로포스를 사람 이름이 아니라 '(로마의) 관리관'으로 보아 '관리관의 아내'로 풀이하는 견해도 있습니다.</p></li><li><p>ἐπισκοπή — '돌봄, 감독'. 사본에 따라서는 ἐπισκόπῳ '주교(아래에)'로 읽습니다.</p></li></ol>
      <p>번역: 로디온 블라소프 (AI 도구 활용). 저본: 그리스어 원문(<a href="https://bibleox.com/ko/grc/w/ΙγνΘ_Πολ">이 사이트의 그리스어판</a>. 명백한 누락은 라이트풋판과 홈스판으로 보충함). 참고: 러시아어 번역(『초기 교부 선집』, 브뤼셀, 1988년), 영어 번역(Roberts–Donaldson), 프랑스어 번역(Genoude, 1837년). 성경 인용과 링크는 공동번역 성서에 따름.</p>
