    meta_desc: 안티오키아의 성 이그나티오스(테오포로스)가 로마 교회에 보낸 편지. 순교를 향한 열망을 이야기한다. 그리스어 원문에서 번역하고 주석을 붙임.
    menu: { parent: "편지", title: "로마 교회에 보낸 편지", priority: 4 }
    body: |-
      <h2>0</h2><p>이그나티오스 곧 테오포로스가, 지극히 높으신 아버지와 그분의 외아들 예수 그리스도의 위엄 안에서 자비를 입은 교회에 보냅니다. 이 교회는 존재하는 모든 것을 원하신 분의 뜻에 따라, 우리 하느님이신 예수 그리스도의 사랑을 따라 사랑받고 빛을 받은 교회이며, 로마 사람들의 지역에서 으뜸 자리에 있는 교회[1], 하느님께 합당하고, 영예에 합당하고, 복되다 불리기에 합당하고, 칭찬받기에 합당하고, 성취에 합당하고, 정결함에 합당한 교회, 사랑에서 으뜸 자리에 있으며[2], 그리스도의 이름을 지니고 아버지의 이름을 지닌 교회[3]입니다. 나는 아버지의 아들 예수 그리스도의 이름으로 이 교회에 문안합니다. 육으로나 영으로나 그분의 모든 계명에 결합되어 있고, 차별 없이 하느님의 은총으로 가득 차 있으며, 모든 낯선 색깔에서 걸러져 깨끗해진 사람들[4]에게, 우리 하느님이신 예수 그리스도 안에서 흠 없는 기쁨을 진심으로 빕니다.</p>
      <h2>1</h2><p>1. 나는 하느님께 기도하여 하느님께 합당한 여러분의 얼굴을 볼 수 있게 되었습니다. 청한 것보다 더 많은 것을 받은 셈입니다. 나는 그리스도 예수 안에서 묶인 몸으로 여러분에게 문안하기를 바랍니다. 내가 끝까지 (달려갈) 자격을 얻는 것이 하느님의 뜻이라면 말입니다.</p><p>2. 시작은 잘 준비되었습니다. 내가 나의 몫을 방해받지 않고 받아들일 은총을 얻는다면 말입니다. 그러나 나는 여러분의 사랑이 나에게 해를 끼치지 않을까 두렵습니다. 여러분에게는 원하는 일을 하는 것이 쉽지만, 여러분이 나를 아낀다면 나에게는 하느님께 이르는 일이 어렵기 때문입니다.</p>
      <h2>2</h2><p>1. 나는 여러분이 사람의 마음에 들려고 하지 말고 하느님의 마음에 들기를 바랍니다[5]. 사실 여러분은 하느님의 마음에 들고 있습니다. 내가 하느님께 이를 이런 기회는 다시없을 것이고, 여러분도 침묵을 지켜 준다면 이보다 더 좋은 일에 이름이 기록될 수는 없을 것입니다. 여러분이 나에 대하여 침묵하면 나는 하느님의 말씀이 되겠지만, 내 육신을 사랑한다면 나는 다시 한낱 목소리가 될 것입니다[6].</p><p>2. 제단이 아직 마련되어 있는 동안, 내가 하느님께 부어 드리는 제물이 되는 것[7] 말고는 아무것도 나에게 베풀지 마십시오. 그리하여 여러분이 사랑 안에서 합창단이 되어 그리스도 예수 안에서 아버지께 노래하게 하십시오. 하느님께서 시리아의 주교를 해 뜨는 곳에서 해 지는 곳으로 불러 그곳에 있게 하셨다고 말입니다. 세상에서 하느님께로 지는 것은 좋은 일입니다. 그분 안에서 떠오르기 위해서입니다.</p>
      <h2>3</h2><p>1. 여러분은 아무도 시기한 적이 없고, 다른 사람들을 가르쳐 왔습니다. 내가 바라는 것은, 여러분이 제자들을 가르치며 명하는 그 일들이 (나에게서도) 확실해지는 것입니다.</p><p>2. 다만 내가 안팎으로 힘을 얻도록 기도해 주십시오. 그리하여 내가 말만 하는 사람이 아니라 원하는 사람이 되고, 그리스도인이라고 불리기만 하는 것이 아니라 실제로 그리스도인으로 드러나게 해 주십시오. 내가 그렇게 드러난다면 그리스도인이라고 불릴 수도 있을 것이며, 내가 세상에 보이지 않게 될 때에야 충실한 사람이 될 것입니다.</p><p>3. 눈에 보이는 것 가운데 좋은 것은 하나도 없습니다[8]. 우리 하느님이신 예수 그리스도께서도 아버지 안에 계신 지금 더욱 뚜렷이 드러나십니다. 그리스도교는 설득의 일이 아니라 위대함의 일입니다. 특히 세상에게 미움을 받을 때에 그러합니다[9].</p>
      <h2>4</h2><p>1. 나는 모든 교회에 편지를 쓰고 모든 사람에게 알립니다. 여러분이 막지만 않는다면 나는 하느님을 위하여 기꺼이 죽는다고 말입니다. 부탁합니다. 때에 맞지 않는 호의를 나에게 베풀지 마십시오. 나를 맹수의 먹이가 되게 해 주십시오. 맹수를 통하여 나는 하느님께 이를 수 있습니다. 나는 하느님의 밀입니다. 맹수의 이빨에 갈려서 그리스도의 깨끗한 빵이 될 것입니다.</p><p>2. 오히려 맹수를 달래 주십시오. 맹수가 나의 무덤이 되고 내 몸의 아무것도 남기지 않게 하려는 것입니다. 그러면 내가 잠든 뒤에 누구에게도 짐이 되지 않을 것입니다. 세상이 내 몸조차 보지 못하게 될 때, 그때에 나는 참으로 예수 그리스도의 제자가 될 것입니다. 이 도구들(맹수)을 통하여 내가 하느님께 바치는 제물로 드러나도록 나를 위하여 그리스도께 간구해 주십시오.</p><p>3. 나는 베드로나 바울로처럼 여러분에게 명령하지 않습니다. 그들은 사도였고 나는 단죄받은 사람입니다. 그들은 자유인이었고 나는 지금까지 종입니다. 그러나 내가 고난을 받는다면 나는 예수 그리스도께서 자유롭게 해 주신 사람[10]이 될 것이며, 그분 안에서 자유인으로 부활할 것입니다. 지금 나는 묶여서 아무것도 탐내지 않는 법을 배우고 있습니다.</p>
      <h2>5</h2><p>1. 시리아에서 로마까지, 땅에서도 바다에서도, 밤낮으로 나는 맹수와 싸우고 있습니다. 열 마리 표범, 곧 한 무리의 군인들에게 묶여 있는 것입니다. 그들은 잘해 줄수록 더 사나워집니다[11]. 그러나 그들의 부당한 대우를 통하여 나는 더욱 제자가 되는 법을 배우고 있습니다. 그렇다고 내가 의롭게 되는 것은 아닙니다[12].</p><p>2. 나를 위하여 마련된 맹수들로 말미암아 기쁨을 누리고 싶습니다. 맹수들이 나에게 빨리 덤벼들기를 기도합니다. 나는 맹수들을 달래서 나를 빨리 먹어 치우게 하겠습니다. 어떤 사람들에게 그랬듯이 겁을 먹고 손을 대지 않는 일이 없도록 말입니다. 맹수들이 싫어하며 원하지 않는다면 내가 억지로라도 그렇게 하게 하겠습니다.</p><p>3. 나를 용서해 주십시오. 무엇이 나에게 유익한지 나는 압니다. 이제 나는 제자가 되기 시작했습니다. 보이는 것도 보이지 않는 것도 아무것도 나를 시기하여 내가 예수 그리스도께 이르는 것을 막지 말기를 빕니다. 불도, 십자가도, 맹수의 떼도, 베임도, 찢김도, 뼈가 흩어지는 것도, 사지가 잘리는 것도, 온몸이 짓이겨지는 것도, 악마의 끔찍한 형벌도 나에게 닥쳐오라. 다만 내가 예수 그리스도께 이르기만 한다면.</p>
      <h2>6</h2><p>1. 세상의 끝[13]도, 이 세상의 왕국들도 나에게는 아무 유익이 없습니다. 땅끝까지 다스리는 것보다 그리스도 예수를 위하여 죽는 것이 나에게는 더 좋습니다[14]. 우리를 위하여 돌아가신 그분을 나는 찾습니다. 우리를 위하여 다시 살아나신 그분을 나는 원합니다. 해산의 때가 나에게 다가왔습니다[15].</p><p>2. 형제 여러분, 나를 용서해 주십시오. 내가 사는 것을 막지 마십시오. 내가 죽기를 바라지 마십시오. 하느님의 사람이 되려는 사람을 세상에 넘겨주거나 물질로 꾀지 마십시오. 내가 깨끗한 빛을 받게 해 주십시오. 그곳에 이르면 나는 (참)사람이 될 것입니다.</p><p>3. 내가 나의 하느님의 수난을 본받는 사람이 되게 해 주십시오. 누구든지 자기 안에 그분을 모시고 있는 사람은 내가 무엇을 원하는지 깨닫고, 나를 짓누르는 것을 알아 나와 마음을 같이해 주십시오.</p>
      <h2>7</h2><p>1. 이 세상 권력자는 나를 낚아채어 하느님을 향한 나의 뜻을 꺾으려 합니다. 그러므로 그곳에 있는 여러분 가운데 아무도 그를 돕지 마십시오. 오히려 내 편, 곧 하느님 편에 서십시오. 입으로는 예수 그리스도를 말하면서 마음으로 세상을 탐내지 마십시오. 시기가 여러분 가운데 자리 잡지 않게 하십시오.</p><p>2. 내가 그곳에 가서 여러분에게 부탁하더라도 내 말을 듣지 마십시오. 오히려 지금 여러분에게 쓰는 이 말을 따르십시오. 나는 살아서 여러분에게 이 편지를 쓰지만 죽기를 그리워합니다. 나의 사랑(에로스)은 십자가에 못 박혔습니다[16]. 내 안에는 물질을 사랑하는 불이 없습니다. 다만 살아 있는 물[17]이 내 안에서 말하며, 안에서 나에게 "아버지께로 오너라" 하고 말합니다.</p><p>3. 나는 썩어 없어질 음식도, 이 세상의 쾌락도 즐기지 않습니다. 내가 원하는 것은 하느님의 빵, 곧 다윗의 후손에게서 나신 예수 그리스도의 살입니다. 그리고 마실 것으로는 그분의 피를 원합니다. 그것은 썩지 않는 사랑입니다.</p>
      <h2>8</h2><p>1. 나는 더 이상 사람을 따라 살고 싶지 않습니다. 여러분이 원한다면 그렇게 될 것입니다. 원해 주십시오. 여러분도 (하느님께) 받아들여지도록 말입니다.</p><p>2. 나는 짧은 편지로 여러분에게 부탁합니다. 나를 믿어 주십시오. 예수 그리스도께서 내가 진실을 말하고 있다는 것을 여러분에게 밝혀 주실 것입니다. 그분은 거짓 없는 입이시며, 그 입을 통하여 아버지께서 참되게 말씀하셨습니다[18].</p><p>3. 내가 이를 수 있도록 나를 위하여 기도해 주십시오. 나는 육을 따라서가 아니라 하느님의 뜻을 따라 여러분에게 썼습니다. 내가 고난을 받는다면 그것은 여러분이 나를 위해 준 것이고, 내가 버림받는다면 그것은 여러분이 나를 미워한 것입니다.</p>
      <h2>9</h2><p>1. 여러분의 기도 가운데 시리아에 있는 교회를 기억해 주십시오. 그 교회는 이제 나 대신 하느님을 목자로 모시고 있습니다. 예수 그리스도만이, 그리고 여러분의 사랑이 그 교회의 주교가 될 것입니다.</p><p>2. 나는 그들 가운데 하나라고 불리는 것이 부끄럽습니다. 나는 그럴 자격이 없는, 그들 가운데 가장 보잘것없는 사람이며 달을 채우지 못하고 태어난 사람[19]이기 때문입니다. 그러나 내가 하느님께 이른다면, 나는 무엇인가가 되는 자비를 입은 것입니다.</p><p>3. 나의 영과, 나를 나그네로가 아니라 예수 그리스도의 이름으로 맞아 준 교회들의 사랑이 여러분에게 문안합니다. 육신의 길로는 내가 지나는 길에 있지 않은 교회들조차 이 도시 저 도시로 나를 배웅해 주었습니다.</p>
      <h2>10</h2><p>1. 나는 이 편지를 스미르나에서, 참으로 복된 에페소 사람들 편에 써 보냅니다. 내 곁에는 다른 사람들과 함께, 나에게 그리운 이름인 크로코스도 있습니다.</p><p>2. 하느님의 영광을 위하여 나보다 먼저 시리아에서 로마로 간 사람들에 대해서는 여러분도 이미 알고 있으리라 믿습니다. 내가 가까이 와 있다고 그들에게 알려 주십시오. 그들은 모두 하느님께도 여러분에게도 합당한 사람들입니다. 모든 면에서 그들을 쉬게 해 주는 것이 여러분에게 마땅합니다.</p><p>3. 나는 이 편지를 9월 초하루 아흐레 전[20]에 썼습니다. 예수 그리스도의 인내 안에서 끝까지 안녕히 계십시오.</p>
    references: |-
      <ol><li><p>ἥτις καὶ προκάθηται ἐν τόπῳ χωρίου Ῥωμαίων. 로마와 그 주변 지역에서 (교회를) 다스리며 으뜸 자리에 있다는 뜻입니다. 로마 교회의 특별한 지위를 말한 것으로 보는 학자들도 있습니다.</p></li><li><p>προκαθημένη τῆς ἀγάπης. '사랑에서 으뜸가는'으로도, '사랑의 친교(교회들의 친교)를 이끄는'으로도 풀이됩니다. 로마 교회는 다른 교회의 가난한 형제들을 돕는 자선으로 잘 알려져 있었습니다.</p></li><li><p>χριστώνυμος, πατρώνυμος. 옛 라틴어, 시리아어, 아르메니아어 번역은 χριστόνομος '그리스도의 법을 지닌'으로 읽습니다.</p></li><li><p>낯선 색깔, 곧 그릇된 가르침에서 걸러져 깨끗해진 사람들이라는 뜻입니다.</p></li><li><p><a href="https://bibleox.com/ko/ko-ctb/gal/1/#L10">갈라 1:10</a> 참조.</p></li><li><p>여러분이 나의 순교를 막지 않고 침묵해 준다면 나의 죽음 자체가 하느님의 말씀(하느님에 대한 증언)이 되겠지만, 내 목숨을 아낀다면 나는 의미 없는 목소리에 머물 것이라는 뜻입니다. 시리아어 번역은 '나는 하느님의 말씀이 될 것이다'로 읽습니다.</p></li><li><p>σπονδισθῆναι — '부어 바치는 제물로 부어지다'. <a href="https://bibleox.com/ko/ko-ctb/fil/2/#L17">필립 2:17</a>, <a href="https://bibleox.com/ko/ko-ctb/2tim/4/#L6">2디모 4:6</a> 참조.</p></li><li><p>옛 라틴어, 시리아어, 아르메니아어 번역은 이 뒤에 '보이는 것은 잠깐이지만 보이지 않는 것은 영원하다'(<a href="https://bibleox.com/ko/ko-ctb/2kor/4/#L18">2고린 4:18</a>)를 덧붙이지만, 그리스어 본문에는 없습니다.</p></li><li><p><a href="https://bibleox.com/ko/ko-ctb/in/15/#L18-19">요한 15:18-19</a> 참조.</p></li><li><p>ἀπελεύθερος — '해방된 노예'. <a href="https://bibleox.com/ko/ko-ctb/1kor/7/#L22">1고린 7:22</a> 참조.</p></li><li><p>그리스도인들이 호송하는 군인들의 엄격함을 누그러뜨리려고 그들에게 선물을 준 일을 가리키는 것으로 보입니다.</p></li><li><p><a href="https://bibleox.com/ko/ko-ctb/1kor/4/#L4">1고린 4:4</a> 참조.</p></li><li><p>τὰ πέρατα τοῦ κόσμου. 사본에 따라서는 τὰ τερπνὰ τοῦ κόσμου '세상의 즐거움'.</p></li><li><p><a href="https://bibleox.com/ko/ko-ctb/mf/16/#L26">마태 16:26</a>, <a href="https://bibleox.com/ko/ko-ctb/fil/1/#L21">필립 1:21</a> 참조.</p></li><li><p>ὁ τοκετός — '해산'. 순교를 통하여 하늘의 생명으로 태어나는 것을 가리킵니다. 옛 라틴어 번역은 '이득'(lucrum)으로 옮겼습니다.</p></li><li><p>ὁ ἐμὸς ἔρως ἐσταύρωται. 이 세상 것들에 대한 나의 욕망은 십자가에 못 박혀 죽었다는 뜻입니다(<a href="https://bibleox.com/ko/ko-ctb/gal/5/#L24">갈라 5:24</a>, <a href="https://bibleox.com/ko/ko-ctb/gal/6/#L14">6:14</a> 참조). 예로부터 '내가 사랑하는 분(그리스도)께서 십자가에 못 박히셨다'로도 풀이되고 그렇게 인용되어 왔습니다.</p></li><li><p>살아 있는 물 — 순교로 이끌며 힘을 주시는 성령(<a href="https://bibleox.com/ko/ko-ctb/in/4/#L10">요한 4:10</a>, <a href="https://bibleox.com/ko/ko-ctb/in/7/#L38">요한 7:38</a> 참조).</p></li><li><p><a href="https://bibleox.com/ko/ko-ctb/in/14/#L6">요한 14:6</a>, <a href="https://bibleox.com/ko/ko-ctb/evr/6/#L18">히브 6:18</a> 참조.</p></li><li><p>ἔκτρωμα — '달을 채우지 못하고 태어난 사람'. <a href="https://bibleox.com/ko/ko-ctb/1kor/15/#L8-9">1고린 15:8-9</a> 참조.</p></li><li><p>로마력으로 '9월 초하루(칼렌다이) 아흐레 전', 곧 8월 24일.</p></li></ol>
      <p>번역: 로디온 블라소프 (AI 도구 활용). 저본: 그리스어 원문(<a href="https://bibleox.com/ko/grc/w/ΙγνΘ_Ρωμ">이 사이트의 그리스어판</a>. 명백한 누락은 라이트풋판과 홈스판으로 보충함). 참고: 러시아어 번역(『초기 교부 선집』, 브뤼셀, 1988년), 영어 번역(Roberts–Donaldson), 프랑스어 번역(Genoude, 1837년). 성경 인용과 링크는 공동번역 성서에 따름.</p>
