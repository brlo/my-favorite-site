  title: 예수 그리스도께 드리는 기도
  copy_cover: true
  body: '<h2>예수 그리스도께 기도해도 됩니까?</h2><p>물론 됩니다. 그러나 이 계명은 성경이 아니라 거룩한 전승(성전, 聖傳)에서 받은 것입니다.</p><h2>성경만을 근거로 예수 그리스도께 기도해야 한다고 주장할 수 있습니까?</h2><p>성경에는 예수 그리스도께 기도하라는 계명이 없습니다. 다만 <a href="https://bibleox.com/ko/ko-nkrv/in/14/#L14">요 14:14</a>에 그런 암시가 있습니다: “내 이름으로 무엇이든지 <strong>내게</strong> 구하면 내가 행하리라”(그리스어 ἐάν τι αἰτήσητέ με).</p><p>예수 그리스도께서는 아버지께 기도하셨고(<a href="https://bibleox.com/ko/ko-nkrv/mk/14/#L36">막 14:36</a>; <a href="https://bibleox.com/ko/ko-nkrv/lk/22/#L42">눅 22:42</a>) “주님의 기도”를 주셨습니다(<a href="https://bibleox.com/ko/ko-nkrv/mf/6/#L9">마 6:9</a>; <a href="https://bibleox.com/ko/ko-nkrv/lk/11/#L2">눅 11:2</a>). 곧 아버지께 기도하라고 가르치셨습니다.</p><p>성전 없이 성경만으로(물론 자기 나름의 성경 이해로) 신앙을 세우는 사람들도 예수 그리스도께 드리는 기도를 부정하지는 못합니다. 그래서 그들은 예수 그리스도께 기도하는 실천이 있으니 기도해도 된다고 말합니다. 그러나 그 실천을 보여 주는 일조차 쉽지 않은 경우가 많습니다. 드물기 때문입니다. 물론 있기는 합니다. 예를 들면:</p><blockquote><p>“그들이 돌로 스데반을 치니 스데반이 <strong>부르짖어</strong> 이르되 <strong>주 예수여</strong> 내 영혼을 받으시옵소서 하고” (<a href="https://bibleox.com/ko/ko-nkrv/act/7/#L59">행 7:59</a>)</p></blockquote><h2>비판</h2><h3>“내 이름으로 구하는 것이면”</h3><p>개신교인들은 이 구절에 계명이 있다고 반박합니다:</p><blockquote><p>“<strong>내 이름으로</strong> 무엇이든지 내게 구하면 내가 행하리라” (<a href="https://bibleox.com/ko/ko-nkrv/in/14/#L14">요 14:14</a>)</p></blockquote><p>그러나 같은 고별 설교에서 주 예수 그리스도께서는 아버지께 구하라고 가르치십니다:</p><blockquote><p>“그 날에는 너희가 아무 것도 내게 묻지 아니하리라 내가 진실로 진실로 너희에게 이르노니 너희가 무엇이든지 <strong><mark>아버지께 구하는 것을</mark></strong> 내 이름으로 주시리라” (<a href="https://bibleox.com/ko/ko-nkrv/in/16/#L23">요 16:23</a>)</p></blockquote>'
