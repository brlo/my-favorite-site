    title: "“필리오퀘”에 대한 반박"
    priority: 100
  references: '<ol><li><p>예를 들어 2세기에 유스티노 순교자는 이렇게 썼습니다: “낳아지지 않으신 만물의 아버지께는 <strong>주어진 이름이 없습니다</strong>. 어떤 이름으로 불리든 그 이름을 지어 준 이가 그분보다 먼저 있게 되기 때문입니다. 아버지, 하느님, 창조주, 주님, 주재자라는 말은 이름이 아니라 그분의 선행과 활동에서 나온 호칭입니다.” (<a href="https://bibleox.com/en/en/w/Justin_Philosopher-Apology_2/">호교론 2</a>(영어), 6장)</p></li></ol><p>번역: 로디온 블라소프 (AI 도구 활용). 저본: 러시아어 원문. 참고: 영어·일본어 번역. 성경 인용과 링크는 개역개정에 따름.</p>'
