  title: "“필리오퀘”에 대한 반박"
  copy_cover: true
  body: '<h2>“필리오퀘”라는 용어</h2><p>“필리오퀘”는 성령께서 아버지에게서만이 아니라 “그리고 아들에게서도”(라틴어 Filioque) 나오신다는 가톨릭교회의 가르침입니다.</p><p>게오르기 막시모프 사제가 필리오퀘를 자세히 반박한 영상(러시아어): <a href="https://rutube.ru/video/c1878056726d0e041ba83802090cf308/">Rutube</a>, <a href="https://youtu.be/xuOSiS8zCO4">YouTube</a>.</p><h2>성령께서는 아버지에게서 나오십니다</h2><p>우리는 하느님의 본성을 알지 못하지만, 하느님의 아들 예수 그리스도께서는 아십니다:</p><blockquote><p>“내 아버지께서 모든 것을 내게 주셨으니 아버지 외에는 아들을 아는 자가 없고 <strong>아들과 또 아들의 소원대로 계시를 받는 자</strong> 외에는 아버지를 아는 자가 없느니라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/11/#L27">마 11:27</a>)</p></blockquote><p>그분께서는 사도들에게 하느님의 계시를 주셨습니다:</p><blockquote><p>“이제부터는 너희를 종이라 하지 아니하리니 종은 주인이 하는 것을 알지 못함이라 너희를 친구라 하였노니 내가 <strong>내 아버지께 들은 것을 다 너희에게 알게 하였음이라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/in/15/#L15">요 15:15</a>)</p></blockquote><p>하느님의 아들께서는 성령께서 아버지에게서 나오신다고 말씀하셨습니다:</p><blockquote><p>“내가 아버지께로부터 너희에게 보낼 보혜사 곧 <strong><mark>아버지께로부터 나오시는</mark></strong> 진리의 성령이 오실 때에 그가 나를 증언하실 것이요” (<a href="https://bibleox.com/ko/ko-nkrv/in/15/#L26">요 15:26</a>)</p></blockquote><p>아버지, 아들, 성령은 고유한 이름이 아닙니다. 하느님께는 고유한 이름이 없습니다. 이름은 더 높은 이가 지어 주는데, 하느님보다 높은 이는 없습니다[1].</p><p>아버지, 아들, 성령이라는 말은 이 하느님의 위격들이 서로 어떤 관계에 있는지를 가리킬 뿐입니다.</p><ul><li><p><strong>아버지</strong>께서는 <strong>낳으십니다</strong>. 그래서 아버지이십니다. 그러나 낳아지지 않으시므로 아들이 아니시고, 나오시지 않으므로 성령이 아니십니다.</p></li><li><p><strong>아들</strong>께서는 <strong>낳아지십니다</strong>. 그래서 아들이십니다. 그러나 낳지 않으시므로 아버지가 아니시고, 나오시지도 않으므로 성령이 아니십니다.</p></li><li><p><strong>성령</strong>께서는 낳아지지도 낳지도 않으시므로 아버지도 아들도 아니십니다. 나오시므로 성령이십니다.</p></li></ul><p>각 위격에게는 서로를 구별할 수 있는 구별점(위격적 특성)이 하나씩만 있습니다. 아버지, 아들, 성령이라는 말은 이 특성을 가리키게 해 줍니다.</p><p>우리가 이 세상에서 보는 하느님의 활동은 하느님의 본성 자체가 아니라 그분의 <strong>활동(에네르게이아)</strong>일 뿐이며, 우리는 이것을 은총이라고도 부릅니다.</p><p>아버지만이 모든 것의 원인이십니다. 그분만이 아들의 존재의 원인이시고 성령의 존재의 원인이십니다. 원인은 둘도 셋도 아니고 오직 하나입니다.</p><p>동시에 아버지께서는 모든 면에서 아들과 성령과 같으시며, 오직 <strong>낳아지지 않으심</strong>으로만 구별되십니다.</p><p>아들께서는 오직 <strong>낳아지심</strong>으로만 아버지와 성령과 구별되십니다.</p><p>마찬가지로 성령께서는 오직 <strong>나오심</strong>으로만 아버지와 아들과 구별되십니다.</p><p>이것을 <strong>위격적 특성</strong>이라고 합니다. 본성적 특성은 모든 위격에게 똑같습니다. 본성이 하나이기 때문입니다. 하느님은 한 분이시고 위격은 셋이며, 각 위격에게는 다른 위격들과 구별되는 점이 <strong>하나</strong> 있습니다.</p><h2>“필리오퀘” 지지자들의 반론</h2><h3>“아버지와 나는 하나이다”</h3><p>성령께서 아버지에게서만이 아니라 아들에게서도 나오신다는 가톨릭의 가르침을 증명하려고 다음 구절을 듭니다:</p><blockquote><p>“나와 아버지는 하나이니라 하신대” (<a href="https://bibleox.com/ko/ko-nkrv/in/10/#L30">요 10:30</a>)</p></blockquote><p>또 비슷한 말씀들도 듭니다:</p><blockquote><p>“그러나 <strong>진리의 성령</strong>이 오시면 그가 너희를 모든 진리 가운데로 인도하시리니 그가 스스로 말하지 않고 오직 들은 것을 말하며 장래 일을 너희에게 알리시리라 그가 내 영광을 나타내리니 <strong>내 것을 가지고 너희에게 알리시겠음이라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/in/16/#L13-14">요 16:13-14</a>)</p></blockquote><blockquote><p>“무릇 <strong>아버지께 있는 것은 다 내 것이라</strong> 그러므로 내가 말하기를 그가 내 것을 가지고 너희에게 알리시리라 하였노라” (<a href="https://bibleox.com/ko/ko-nkrv/in/16/#L15">요 16:15</a>)</p></blockquote><p>그러나 “아버지와 나는 하나이다”라는 말씀에서 성령께서 “아들에게서도” 나오신다는 결론이 나온다면, 성령께서 자기 자신에게서도 나오신다는 결론도 나옵니다. 아버지와 아들만이 아니라 성령께서도 그분들과 “하나”이시기 때문입니다. 성령께도 아버지와 아들께 있는 모든 것이 있습니다.</p><p>이 논증은 성령께서 하느님이 아니라 어떤 광채나 사랑의 감정일 뿐일 때에만 논리적으로 성립할 수 있습니다. 그러나 그렇게 되면 성령의 신성을 부정하는 또 다른 큰 오류가 됩니다.</p><p>이 논증을 따르면 다음 가운데 하나를 인정해야 합니다:</p><ul><li><p>“하나”인 것은 아버지와 아들뿐이고 성령께서는 다른 무엇(사랑의 감정, 광채일 뿐)이다;</p></li><li><p>또는 성령께서는 아버지에게서도, 아들에게서도, 그리고… 성령에게서도 나오신다.</p></li></ul><p>성령께서 성령에게서도 나오신다는 주장을 끝까지 밀고 가면 다른 불합리한 결론도 많이 나옵니다. 예를 들어 아들께서는 아버지에게서만 낳아지시는 것이 아니라(바로 그래서 아버지를 아버지라고 부르는데) 모두가 아들을 낳고, 아들께서 자기 자신도 낳으신다는 결론입니다. 그러나 아들은 낳아지시기 때문에 아들이라 불리고, 아버지는 낳으시기 때문에 아버지라 불리며, 성령께서도 나오시기 때문에 성령이라 불리십니다.</p><p>“필리오퀘” 지지자들이 성령께서 자기 자신에게서 나오신다는 것을 인정할 수 없다면, 이 구절은 다른 것을 말하고 있으며 “필리오퀘”를 변호하는 데 맞지 않는다는 것을 인정해야 합니다. 이 표현을 더 자세히 살펴봅시다.</p><h3>“내 것을 가지고 너희에게 알리시겠음이라”</h3><blockquote><p>“그가 내 영광을 나타내리니 <strong>내 것을 가지고</strong> 너희에게 <strong><mark>알리시겠음이라</mark></strong> 무릇 아버지께 있는 것은 다 내 것이라 그러므로 내가 말하기를 그가 <strong>내 것을 가지고</strong> 너희에게 <strong><mark>알리시리라</mark></strong> 하였노라” (<a href="https://bibleox.com/ko/ko-nkrv/in/16/#L14-15">요 16:14-15</a>)</p></blockquote><p>여기서는 성령께서 무엇을 <strong>전하실지</strong>를 말합니다. 곧 그리스도와 어긋나는 말씀을 하지 않으시리라는 것입니다. 하느님 안에는 하나의 앎과 뜻이 있습니다. 하느님의 아들께서는 성령께서 다른 가르침을 주시지 않으리라고 제자들에게 미리 알려 주십니다. 성령께서도 하느님으로부터 말씀하시기 때문입니다. 그리스도 이후에 몬타누스가 나타나 자신을 성령의 강생이라고 내세우며 그리스도의 가르침이 아닌 자기 가르침을 폈습니다. 뛰어난 그리스도교 신학자 테르툴리아누스도 몬타누스의 가르침에 빠졌습니다.</p><h3>하느님의 아들께서 숨을 내쉬어 성령을 보내십니다</h3><p>그리스도께서는 사도들에게 나타나 숨을 내쉬시며 성령을 받으라고 하십니다:</p><blockquote><p>“예수께서 또 이르시되 너희에게 평강이 있을지어다 아버지께서 나를 보내신 것 같이 나도 너희를 보내노라 이 말씀을 하시고 그들을 향하사 <strong>숨을 내쉬며</strong> 이르시되 <strong>성령을 받으라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/in/20/#L21-22">요 20:21-22</a>)</p></blockquote><p>이 구절은 아들께서 성령의 근원이시라는 뜻이 아니라, 성령께서 시간 안에서(곧 교회의 지상 역사, 구원 경륜 안에서) 아들을 통해 아버지로부터 파견되신다는 뜻입니다. 곧 전에는 파견되지 않으셨지만(물론 언제나 존재하시며 아버지에게서 나오셨습니다) 이제 시간 안에서 아버지로부터 교회로 파견되십니다. 그리스도께서 몇 장 앞에서 친히 말씀하신 대로입니다:</p><blockquote><p>“<strong><mark>내가 아버지께로부터 너희에게 보낼</mark></strong> 보혜사 곧 <strong><mark>아버지께로부터 나오시는</mark></strong> 진리의 성령이 오실 때에 그가 나를 증언하실 것이요” (<a href="https://bibleox.com/ko/ko-nkrv/in/15/#L26">요 15:26</a>)</p></blockquote><p>하느님의 아들께서는 당신이 성령을 보내시겠다고 말씀하시되 아버지에게서 보내시겠다고 하십니다. 성령께서 아버지에게서 나오시기 때문입니다. 곧 성령의 나오심의 원인은 아버지뿐이시고 아들이 아니십니다.</p><h2>역사적 배경</h2><p>교회는 처음부터 언제나 성령께서 아버지에게서 나오신다고 가르쳤습니다(<a href="https://bibleox.com/ru/ru/w/cLrG_Против_Филиокве_Filioque/">인용문 모음</a>, 러시아어).</p><p>8세기에 서방에서 성령께서 “아들에게서도” 나오신다는 생각이 생겨납니다. 서방에서도 791년에 아퀼레이아의 총대주교 파울리노가 이 생각을 단죄합니다.</p><p>11세기에 신앙의 왜곡과 교회 구조에 관한 견해 때문에 공동체 하나가 정교회에서 떨어져 나갑니다. 바로 로마 공동체(오늘날의 로마 가톨릭교회)입니다.</p><p>로마에서는 프랑크 왕 샤를마뉴의 정치적 압력 아래 교리를 바꾸었습니다:</p><ol><li><p>세계공의회에서 채택되었고 세계공의회가 바꾸지 못하도록 금지한 “신경”을 독단으로 바꾸었습니다(<a href="https://bibleox.com/en/en/w/councils-the-third-ecumenical-council-the-council-of-ephesus-431/">제3차 세계공의회 법규 7</a>, 영어);</p></li><li><p>교회가 한 번도 가르친 적 없는 필리오퀘(성령께서 아버지에게서만이 아니라 아들에게서도 나오신다는 가르침)를 거기에 덧붙였습니다;</p></li><li><p>교황이 온 교회의 무오한 머리라는 주장을 내세워 온 교회가 받아들이도록 요구했습니다. 이런 일은 전에 없었고 성경과도 분명히 어긋납니다(머리는 그리스도이십니다, <a href="https://bibleox.com/ko/ko-nkrv/ef/1/#L22">엡 1:22</a>). 역사적으로도 교황은 교회의 머리였던 적이 없고, 세계공의회가 로마에서 열린 적도 한 번도 없습니다. 그리스도께서는 사도들이 누가 가장 큰지 다투는 것을 막으시며 그런 것을 찾지 못하게 하셨습니다(<a href="https://bibleox.com/ko/ko-nkrv/mk/9/#L34">막 9:34</a>; <a href="https://bibleox.com/ko/ko-nkrv/mf/20/#L25-28">마 20:25-28</a>).</p></li></ol><p>이 큰 역사적 사건을 평가하려면 <strong>이탈리아의 정치 상황</strong>을 이해하는 것이 매우 중요합니다.</p><p><strong>5세기부터</strong> 로마는 야만족의 습격으로 큰 피해를 입었고, 교황좌는 자주 몹시 불안정한 처지에 놓였습니다. 비잔티움은 다른 방면에 힘을 쏟느라 서쪽 전선을 돌볼 여력이 점점 줄었습니다. 그리하여 로마 교황은 시간이 지나면서 사실상 종교 권력만이 아니라 국가 권력까지 대표하게 되었습니다.</p><p><strong>8~9세기 무렵</strong> 교황들은 자기 지위를 지키려고 비잔티움 황제에게서 프랑크 왕 샤를마뉴(748년경~814년)에게로 정치적 방향을 급히 바꿉니다.</p><p><strong>800년에</strong> 교황 레오 3세는 샤를을 신성 로마 제국의 계승자로 선포하고 대관하여 인정합니다.</p><p>교황에게 그런 권한이 있다는 것을 정당화하려고 위조 문서 몇 가지가 만들어졌습니다:</p><ul><li><p><strong>콘스탄티누스의 기증장</strong> – <a href="https://en.wikipedia.org/wiki/Donation_of_Constantine">https://en.wikipedia.org/wiki/Donation_of_Constantine</a></p></li><li><p><strong>위(僞)이시도루스 교령집</strong> – <a href="https://en.wikipedia.org/wiki/Pseudo-Isidorean_Decretals">https://en.wikipedia.org/wiki/Pseudo-Isidorean_Decretals</a></p></li></ul><p>이 조치는 교황들에게 다음 조치를 요구하는 상황을 만들었습니다.</p><p>콘스탄티노플이 제국의 중심이었던 것은 황제가 그곳에 있었기 때문만이 아니라, 콘스탄티노플의 주도로 세계공의회가 그 도시나 그 근처에서 열렸기 때문이기도 합니다.</p><p>다시 제국의 정치적·종교적 중심이 되려면 로마가 공의회와 신학 확립의 주도권을 쥐어야 했습니다. 그러나 공의회는 큰 이단이 있을 때에만 열렸는데 당시에는 그런 이단이 없었습니다. 그래서 서방에서는 “낡은 스페인 궤짝”에서 <strong>7~8세기의 필리오퀘 가르침</strong>을 꺼내어 정치적으로 밀어붙여 “신경”에 공식으로 넣고, 교황이 교회의 전권을 가진 머리라고 멋대로 선포한 뒤, 온 교회가 이 모든 조치를 인정하도록 요구했습니다.</p><p>중요한 것은 신경에 대한 이 첨가가 이미 서방에서도(791년 아퀼레이아의 총대주교 파울리노에게) 단죄되었고, 프랑크 왕에게 관을 씌운 교황 레오 3세 자신도 필리오퀘를 “신경”에 넣는 것을 인정하지 않았다는 점입니다.</p><p>그럼에도 저항을 무릅쓰고 9세기 말에 로마는 “필리오퀘”를 받아들였고, 그 결과 먼저 “포티오스 분열”이, 나중에는 1054년 콘스탄티노플의 충돌이 일어났습니다.</p><p>이 사건들을 보면 되살아난 스페인의 <strong>“필리오퀘” 가르침은 교회를 지배할 권력을 세우기 위한 구실이었을 뿐</strong>입니다. 필리오퀘는 그 자체가 목적이 아니었고, 아주 구체적인 목적을 위해 되살려진 것입니다.</p><p><strong>선례가 필요했습니다</strong>: 교황은 세계공의회 없이도 혼자서 교리적 진리를 선포할 수 있고, 자신의 “무오한” 새 가르침을 받아들이도록 온 교회에 요구할 수 있다는 선례입니다.</p><p>신학적 근거도 역사적 근거도 없는 교황의 이러한 권력 주장을 다른 모든 지역 교회는 단호히 거부했습니다.</p>'
