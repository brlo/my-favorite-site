- src: притча-о-десяти-девах-мудрых-и-неразумных
  path: Tv10n_열_처녀
  title: 열 처녀의 비유
  copy_cover: true
  body: <blockquote><p>“그 때에 천국은 마치 등을 들고 신랑을 맞으러 나간 열 처녀와 같다 하리니 그 중의 <strong>다섯은 미련하고 다섯은 슬기 있는 자라</strong> 미련한 자들은 등을 가지되 기름을 가지지 아니하고 슬기 있는 자들은 <strong>그릇에 기름을 담아</strong> 등과 함께 가져갔더니 신랑이 더디 오므로 다 졸며 잘새 밤중에 소리가 나되 보라 신랑이로다 맞으러 나오라 하매 이에 그 처녀들이 다 일어나 등을 준비할새 미련한 자들이 슬기 있는 자들에게 이르되 우리 등불이 꺼져가니 너희 기름을 좀 나눠 달라 하거늘 슬기 있는 자들이 대답하여 이르되 우리와 너희가 쓰기에 다 부족할까 하노니 차라리 파는 자들에게 가서 너희 쓸 것을 사라 하니 그들이 사러 간 사이에 신랑이 오므로 준비하였던 자들은 함께 혼인 잔치에 들어가고 <strong>문은 닫힌지라</strong> 그 후에 남은 처녀들이 와서 이르되 주여 주여 우리에게 열어 주소서 대답하여 이르되 진실로 너희에게 이르노니 <strong>내가 너희를 알지 못하노라</strong> 하였느니라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/25/#L1-12">마 25:1-12</a>)</p></blockquote>
  title_sub: 열 처녀에 관한 복음서의 비유
