- src: притча-о-работниках-в-винограднике
  path: Lv2y_포도원_품꾼들
  title: 포도원 품꾼들의 비유
  copy_cover: true
  body: <p>포도원에서 일한 여러 품꾼에게 똑같은 품삯을 준 일에 관한 예수 그리스도의 비유:</p><blockquote><p>“천국은 마치 품꾼을 얻어 포도원에 들여보내려고 이른 아침에 나간 집 주인과 같으니 그가 하루 한 데나리온씩 품꾼들과 약속하여 포도원에 들여보내고 또 제삼시에 나가 보니 장터에 놀고 서 있는 사람들이 또 있는지라 그들에게 이르되 너희도 포도원에 들어가라 내가 너희에게 상당하게 주리라 하니 그들이 가고 제육시와 제구시에 또 나가 그와 같이 하고 제십일시에도 나가 보니 서 있는 사람들이 또 있는지라 이르되 너희는 어찌하여 종일토록 놀고 여기 서 있느냐 이르되 우리를 품꾼으로 쓰는 이가 없음이니이다 이르되 너희도 포도원에 들어가라 하니라 저물매 포도원 주인이 청지기에게 이르되 품꾼들을 불러 나중 온 자로부터 시작하여 먼저 온 자까지 삯을 주라 하니 제십일시에 온 자들이 와서 한 데나리온씩을 받거늘 먼저 온 자들이 와서 더 받을 줄 알았더니 그들도 한 데나리온씩 받은지라 받은 후 집 주인을 원망하여 이르되 나중 온 이 사람들은 한 시간밖에 일하지 아니하였거늘 그들을 종일 수고하며 더위를 견딘 우리와 같게 하였나이다 주인이 그 중의 한 사람에게 대답하여 이르되 친구여 내가 네게 잘못한 것이 없노라 네가 나와 한 데나리온의 약속을 하지 아니하였느냐 네 것이나 가지고 가라 <strong>나중 온 이 사람에게 너와 같이 주는 것이 내 뜻이니라</strong> 내 것을 가지고 내 뜻대로 할 것이 아니냐 내가 선하므로 네가 악하게 보느냐 이와 같이 <strong>나중 된 자로서 먼저 되고 먼저 된 자로서 나중 되리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/20/#L1-16">마 20:1-16</a>)</p></blockquote>
