- src: притча_о_богаче_и_Лазаре
  path: Rl10z_부자와_나사로
  title: 부자와 나사로
  copy_cover: true
  body: <blockquote><p>“한 부자가 있어 자색 옷과 고운 베옷을 입고 날마다 호화롭게 즐기더라 그런데 나사로라 이름하는 한 거지가 헌데 투성이로 그의 대문 앞에 버려진 채 그 부자의 상에서 떨어지는 것으로 배불리려 하매 심지어 개들이 와서 그 헌데를 핥더라 이에 그 거지가 죽어 <strong>천사들에게 받들려 아브라함의 품에 들어가고</strong> 부자도 죽어 장사되매 그가 <strong>음부에서 고통중에</strong> 눈을 들어 멀리 아브라함과 그의 품에 있는 나사로를 보고 불러 이르되 아버지 아브라함이여 나를 긍휼히 여기사 나사로를 보내어 그 손가락 끝에 물을 찍어 내 혀를 서늘하게 하소서 내가 이 불꽃 가운데서 괴로워하나이다 아브라함이 이르되 얘 너는 살았을 때에 좋은 것을 받았고 나사로는 고난을 받았으니 이것을 기억하라 이제 그는 여기서 위로를 받고 너는 괴로움을 받느니라 그뿐 아니라 너희와 우리 사이에 <strong>큰 구렁텅이가 놓여 있어</strong> 여기서 너희에게 건너가고자 하되 갈 수 없고 거기서 우리에게 건너올 수도 없게 하였느니라 이르되 그러면 아버지여 구하노니 나사로를 내 아버지의 집에 보내소서 내 형제 다섯이 있으니 그들에게 증언하게 하여 그들로 이 고통 받는 곳에 오지 않게 하소서 아브라함이 이르되 그들에게 모세와 선지자들이 있으니 그들에게 들을지니라 이르되 그렇지 아니하니이다 아버지 아브라함이여 만일 죽은 자에게서 그들에게 가는 자가 있으면 회개하리이다 이르되 <strong>모세와 선지자들에게 듣지 아니하면 비록 죽은 자 가운데서 살아나는 자가 있을지라도 권함을 받지 아니하리라</strong> 하였다 하시니라” (<a href="https://bibleox.com/ko/ko-nkrv/lk/16/#L19-31">눅 16:19-31</a>)</p></blockquote>
