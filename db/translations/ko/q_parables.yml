- src: о-мытаре-и-фарисее
  path: Pt2c_바리새인과_세리
  title: 바리새인과 세리
  copy_cover: true
  body: <blockquote><p>“두 사람이 기도하러 성전에 올라가니 <strong>하나는 바리새인이요 하나는 세리라</strong> 바리새인은 서서 따로 기도하여 이르되 하나님이여 나는 다른 사람들 곧 토색, 불의, 간음을 하는 자들과 같지 아니하고 이 세리와도 같지 아니함을 감사하나이다 나는 이레에 두 번씩 금식하고 또 소득의 십일조를 드리나이다 하고 세리는 멀리 서서 감히 눈을 들어 하늘을 쳐다보지도 못하고 다만 가슴을 치며 이르되 <strong>하나님이여 불쌍히 여기소서 나는 죄인이로소이다</strong> 하였느니라 내가 너희에게 이르노니 이에 저 바리새인이 아니고 이 사람이 의롭다 하심을 받고 그의 집으로 내려갔느니라 <strong><mark>무릇 자기를 높이는 자는 낮아지고 자기를 낮추는 자는 높아지리라</mark></strong> 하시니라” (<a href="https://bibleox.com/ko/ko-nkrv/lk/18/#L10-14">눅 18:10-14</a>)</p></blockquote>
