- src: притча-о-двух-сынах
  path: Ts3s_두_아들
  title: 두 아들의 비유
  copy_cover: true
  body: <p>두 아들에 관한 예수 그리스도의 비유:</p><blockquote><p>“그러나 너희 생각에는 어떠하냐 어떤 사람에게 두 아들이 있는데 맏아들에게 가서 이르되 얘 오늘 포도원에 가서 일하라 하니 대답하여 이르되 아버지 <strong>가겠나이다 하더니 가지 아니하고</strong> 둘째 아들에게 가서 또 그와 같이 말하니 대답하여 이르되 <strong>싫소이다 하였다가 그 후에 뉘우치고 갔으니</strong> 그 둘 중의 누가 아버지의 뜻대로 하였느냐 이르되 <strong>둘째 아들이니이다</strong> 예수께서 그들에게 이르시되 내가 진실로 너희에게 이르노니 세리들과 창녀들이 너희보다 먼저 하나님의 나라에 들어가리라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/21/#L28-31">마 21:28-31</a>) <em>(개역개정에서는 맏아들이 “가겠다” 하고 가지 않으며, 둘째 아들이 뉘우치고 갑니다. 사본마다 두 아들의 순서가 다르지만 뜻은 같습니다.)</em></p></blockquote>
  meta_desc: 두 아들에 관한 예수 그리스도의 비유
