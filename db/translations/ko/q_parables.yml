- src: Притча_о_блудном_сына
  path: Ps3n_탕자
  title: 탕자의 비유
  copy_cover: true
  body: <blockquote><p>“또 이르시되 어떤 사람에게 두 아들이 있는데 그 둘째가 아버지에게 말하되 아버지여 재산 중에서 내게 돌아올 분깃을 내게 주소서 하는지라 아버지가 그 살림을 각각 나눠 주었더니 그 후 며칠이 안 되어 둘째 아들이 재물을 다 모아 가지고 먼 나라에 가 거기서 허랑방탕하여 그 재산을 낭비하더니 다 없앤 후 그 나라에 크게 흉년이 들어 그가 비로소 궁핍한지라 가서 그 나라 백성 중 한 사람에게 붙여 사니 그가 그를 들로 보내어 돼지를 치게 하였는데 그가 돼지 먹는 쥐엄 열매로 배를 채우고자 하되 주는 자가 없는지라 <strong>이에 스스로 돌이켜</strong> 이르되 내 아버지에게는 양식이 풍족한 품꾼이 얼마나 많은가 나는 여기서 주려 죽는구나 내가 일어나 아버지께 가서 이르기를 <strong>아버지 내가 하늘과 아버지께 죄를 지었사오니</strong> 지금부터는 아버지의 아들이라 일컬음을 감당하지 못하겠나이다 나를 품꾼의 하나로 보소서 하리라 하고 이에 일어나서 아버지께로 돌아가니라 <strong>아직도 거리가 먼데 아버지가 그를 보고 측은히 여겨 달려가 목을 안고 입을 맞추니</strong> 아들이 이르되 아버지 내가 하늘과 아버지께 죄를 지었사오니 지금부터는 아버지의 아들이라 일컬음을 감당하지 못하겠나이다 하나 아버지는 종들에게 이르되 제일 좋은 옷을 내어다가 입히고 손에 가락지를 끼우고 발에 신을 신기라 그리고 살진 송아지를 끌어다가 잡으라 우리가 먹고 즐기자 <strong>이 내 아들은 죽었다가 다시 살아났으며 내가 잃었다가 다시 얻었노라</strong> 하니 그들이 즐거워하더라 맏아들은 밭에 있다가 돌아와 집에 가까이 왔을 때에 풍악과 춤추는 소리를 듣고 한 종을 불러 이 무슨 일인가 물은대 대답하되 당신의 동생이 돌아왔으매 당신의 아버지가 건강한 그를 다시 맞아들이게 됨으로 인하여 살진 송아지를 잡았나이다 하니 그가 노하여 들어가고자 하지 아니하거늘 아버지가 나와서 권한대 아버지께 대답하여 이르되 내가 여러 해 아버지를 섬겨 명을 어김이 없거늘 내게는 염소 새끼라도 주어 나와 내 벗으로 즐기게 하신 일이 없더니 아버지의 살림을 창녀들과 함께 삼켜 버린 이 아들이 돌아오매 이를 위하여 살진 송아지를 잡으셨나이다 아버지가 이르되 얘 너는 항상 나와 함께 있으니 내 것이 다 네 것이로되 이 네 동생은 죽었다가 살아났으며 내가 잃었다가 얻었기로 우리가 즐거워하고 기뻐하는 것이 마땅하다 하니라” (<a href="https://bibleox.com/ko/ko-nkrv/lk/15/#L11-32">눅 15:11-32</a>)</p></blockquote>
