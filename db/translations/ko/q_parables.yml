- src: притча-о-двух-рабах-_благоразумном-и-злом
  path: Tw10s_두_종
  title: 두 종의 비유
  copy_cover: true
  body: <blockquote><p>“<strong>충성되고 지혜 있는 종</strong>이 되어 주인에게 그 집 사람들을 맡아 때를 따라 양식을 나눠 줄 자가 누구냐 주인이 올 때에 그 종이 이렇게 하는 것을 보면 그 종이 복이 있으리로다 내가 진실로 너희에게 이르노니 주인이 그의 모든 소유를 그에게 맡기리라 만일 <strong>그 악한 종</strong>이 마음에 생각하기를 <strong>주인이 더디 오리라</strong> 하여 동료들을 때리며 술친구들과 더불어 먹고 마시게 되면 <strong>생각하지 않은 날 알지 못하는 시각에</strong> 그 종의 주인이 이르러 엄히 때리고 외식하는 자가 받는 벌에 처하리니 거기서 슬피 울며 이를 갈리라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/24/#L45-51">마 24:45-51</a>)</p></blockquote>
  meta_desc: 충성되고 지혜 있는 종과 악한 종의 비유
