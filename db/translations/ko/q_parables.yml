- src: притча-об-овцах-и-козлах-по-разную-сторону-от-Господа
  path: Sg20s_양과_염소
  title: 양과 염소
  copy_cover: true
  body: <blockquote><p>“인자가 자기 영광으로 모든 천사와 함께 올 때에 자기 영광의 보좌에 앉으리니 모든 민족을 그 앞에 모으고 각각 구분하기를 <strong>목자가 양과 염소를 구분하는 것 같이</strong> 하여 양은 그 오른편에 염소는 왼편에 두리라 그 때에 임금이 그 오른편에 있는 자들에게 이르시되 내 아버지께 복 받을 자들이여 나아와 창세로부터 너희를 위하여 예비된 나라를 상속받으라 내가 주릴 때에 너희가 먹을 것을 주었고 목마를 때에 마시게 하였고 나그네 되었을 때에 영접하였고 헐벗었을 때에 옷을 입혔고 병들었을 때에 돌보았고 옥에 갇혔을 때에 와서 보았느니라 이에 의인들이 대답하여 이르되 주여 우리가 어느 때에 주께서 주리신 것을 보고 음식을 대접하였으며 목마르신 것을 보고 마시게 하였나이까 어느 때에 나그네 되신 것을 보고 영접하였으며 헐벗으신 것을 보고 옷 입혔나이까 어느 때에 병드신 것이나 옥에 갇히신 것을 보고 가서 뵈었나이까 하리니 임금이 대답하여 이르시되 내가 진실로 너희에게 이르노니 <strong>너희가 여기 내 형제 중에 지극히 작은 자 하나에게 한 것이 곧 내게 한 것이니라</strong> 하시고 또 왼편에 있는 자들에게 이르시되 저주를 받은 자들아 나를 떠나 마귀와 그 사자들을 위하여 예비된 영원한 불에 들어가라 내가 주릴 때에 너희가 먹을 것을 주지 아니하였고 목마를 때에 마시게 하지 아니하였고 나그네 되었을 때에 영접하지 아니하였고 헐벗었을 때에 옷 입히지 아니하였고 병들었을 때와 옥에 갇혔을 때에 돌보지 아니하였느니라 하시니 그들도 대답하여 이르되 주여 우리가 어느 때에 주께서 주리신 것이나 목마르신 것이나 나그네 되신 것이나 헐벗으신 것이나 병드신 것이나 옥에 갇히신 것을 보고 공양하지 아니하더이까 이에 임금이 대답하여 이르시되 내가 진실로 너희에게 이르노니 <strong>이 지극히 작은 자 하나에게 하지 아니한 것이 곧 내게 하지 아니한 것이니라</strong> 하시리니 <strong>그들은 영벌에, 의인들은 영생에 들어가리라</strong> 하시니라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/25/#L31-46">마 25:31-46</a>)</p></blockquote>
  meta_desc: 양과 염소를 오른편과 왼편으로 구분하는 일에 관한 예수 그리스도의 비유
