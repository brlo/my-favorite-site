- src: о_милосердном_самарянине
  path: Gs3m_선한_사마리아_사람
  title: 선한 사마리아 사람
  copy_cover: true
  body: <h2>비유</h2><blockquote><p>“그 사람이 자기를 옳게 보이려고 예수께 여짜오되 그러면 내 이웃이 누구니이까 예수께서 대답하여 이르시되 어떤 사람이 예루살렘에서 여리고로 내려가다가 강도를 만나매 강도들이 그 옷을 벗기고 때려 거의 죽은 것을 버리고 갔더라 마침 한 제사장이 그 길로 내려가다가 그를 보고 피하여 지나가고 또 이와 같이 한 레위인도 그 곳에 이르러 그를 보고 피하여 지나가되 어떤 사마리아 사람은 여행하는 중 거기 이르러 그를 보고 불쌍히 여겨 가까이 가서 <strong><mark>기름과 포도주를 그 상처에 붓고 싸매고</mark></strong> <strong><mark>자기 짐승에 태워</mark></strong> <strong><mark>주막으로 데리고 가서 돌보아 주니라</mark></strong> 그 이튿날 그가 주막 주인에게 데나리온 둘을 내어 주며 이르되 이 사람을 돌보아 주라 비용이 더 들면 내가 돌아올 때에 갚으리라 하였으니 네 생각에는 이 세 사람 중에 누가 강도 만난 자의 이웃이 되겠느냐 이르되 자비를 베푼 자니이다 예수께서 이르시되 가서 너도 이와 같이 하라 하시니라” (<a href="https://bibleox.com/ko/ko-nkrv/lk/10/#L29-37">눅 10:29-37</a>)</p></blockquote><h2>비유의 해설</h2><h3>게오르기 막시모프 사제</h3><blockquote><p><strong>선한 사마리아 사람의 비유는 무엇에 관한 것인가?</strong></p><p>오늘 우리는 복음서 봉독에서 선한 사마리아 사람의 비유를 들었습니다. 먼저 이 비유를 말씀하신 상황이 나옵니다. 한 율법교사가 그리스도를 시험하려고 와서 “무엇을 하여야 구원을 받겠습니까?” 하고 물었습니다. 거룩한 교부들의 설명에 따르면, 그는 모세의 율법에 어긋난다고 내세울 수 있는 말을 그리스도에게서 끌어내려 하였습니다. 그러나 예수께서는 그의 마음을 보시고 “율법에 무엇이라 기록되었느냐?” 하고 물으십니다. 그는 하느님과 이웃을 사랑하라는 계명으로 대답합니다. 그러자 주님께서 말씀하십니다. “네 대답이 옳도다. 이를 행하라.” 이로써 주님께서는 이 사람의 교활한 계획을 무너뜨리시는 동시에 그 질문이 얼마나 어리석은지도 보여 주셨습니다. 이미 답을 알면서 왜 묻는가?</p><p>그러나 복음서 기자가 말하듯 “자기를 옳게 보이려고”, 곧 교활해서가 아니라 잘 몰라서 묻는 것처럼 보이려고 율법교사는 “그러면 내 이웃이 누구니이까?” 하고 묻습니다. 주님께서는 선한 사마리아 사람의 비유로 대답하시고, 끝에 이렇게 물으십니다. 이 비유에 나오는 사람들 가운데 누가 강도 만난 자의 이웃이라고 생각하느냐? 그러자 질문한 사람은 사마리아 사람이 이웃이었다고 인정할 수밖에 없습니다.</p><p>은둔자 성 테오판이 말하였듯이, 주님의 첫 대답에서 우리는 구원에 필요한 모든 것을 성경에서 알 수 있다는 것을 봅니다. 그런데 이어서 이 사람은 구약 성경에 분명한 답이 없는 질문을 던집니다. 그러자 그리스도께서는 그의 양심 자체가 어떻게 행하는 것이 옳은지 증언한다는 것을 보여 주십니다. 우리 각 사람은 이미 이 양심의 소리로 무엇이 옳은 행동이며, 반대로 무엇이 그릇되고 하느님을 기쁘시게 하지 않는 행동인지 압니다. 여기에는 부활 후 그리스도의 무서운 심판에서 우리가 어떻게 심판받을지가 상징되어 있습니다. 많은 성인이 말하기를, 그때 사람의 양심이 그 사람을 거슬러 증언할 것이라고 하였습니다. 곧 사람 자신이 자기를 고발하는 자, 검사가 된다는 것입니다. 그러므로 그 심판에서는 “나는 그런 일을 하지 않았다, 몰랐다” 하는 다툼이나 항변이 없을 것입니다. 이 율법교사의 양심이 증언한 것처럼 각 사람의 양심이 증언할 것이기 때문입니다. 우리는 그것이 하느님을 기쁘시게 하지 않는다는 것을 알았고, 양심에 따라 어떻게 바르게 행해야 하는지도 알았습니다. 그런데도 그릇되게 행하였다면, 우리의 양심은 우리가 자기를 변명하도록 두지 않을 것입니다.</p><p>주님께서 들려주신 비유는 글자 그대로 보면, 유대인들이 생각한 것처럼 같은 민족이나 같은 생각을 가진 사람만 이웃으로 여겨서는 안 된다고 말합니다. 그리스도께서는 율법교사에게, 그 시대의 모든 유대인이 먼 사람으로 여기던 사람도 이웃이 될 수 있다고 그 자신의 양심이 증언한다는 것을 보여 주셨습니다. 그래서 유대인들이 업신여기던 사마리아 사람을 예로 드셨습니다. 아울러 주님께서는 이 비유에서, 바로 사랑과 자비와 선의 행위가 우리를 우리가 선을 베푸는 모든 사람의 이웃이 되게 한다는 것을 보여 주십니다.</p><p>이 비유를 영적으로 이해하면, 복된 테오필락트의 설명에 따라 강도 만난 사람은 온 인류입니다. 강도들은 마귀와 악령들을 가리킵니다. 다친 사람을 피하여 지나간 제사장과 레위인은 옛 율법을 가리키는데, 그 율법은 무엇이 선하고 무엇이 악한지 설명할 수는 있었지만 사람을 구원하지는 못하였습니다. 그리고 마침내 사마리아 사람의 모습으로 주 예수 그리스도 자신이 나타나십니다.</p><p>그가 다친 사람을 데려간 주막은 교회를 가리킵니다. 주막 주인은 교회의 목자들입니다. 사마리아 사람이 다친 사람의 치료를 위하여 준 두 데나리온은 구약과 신약입니다. 옛 동전에 왕의 형상이 새겨져 있었듯이, 구약과 신약에도 똑같이 하늘의 왕이신 우리 주님의 형상이 새겨져 있습니다. 그가 다친 사람의 상처를 기름과 포도주로 치료한 것은 교회의 성사들을 뜻합니다. 기름은 견진성사(성유 바름)를, 포도주는 성찬을 뜻합니다. 이 일을 주막 주인이 아니라 사마리아 사람이 한 것은 성사를 집전하시는 분이 목자들이 아니라 그리스도 자신이시라는 것을 가리킵니다. 끝으로 사마리아 사람의 말, 곧 “이 두 데나리온 말고도 이 사람을 고치는 데 비용이 더 들면 내가 나중에 갚으리라”는 말은 교회의 많은 목자가 자기 양 떼를 위하여 기울인 수고와 비용을 가리킵니다. 여러분은 성인전에서, 많은 목자가 그 일에 재산뿐 아니라 건강과 목숨까지 바쳤다는 것을 알고 있습니다. 주님께서 재림하여 돌아오실 때 이 모든 것을 백 배로 갚아 주실 것입니다.</p><p>이 복음 말씀으로 가르침을 받아 우리도 그리스도의 교회를 굳게 붙들고, 성경에서 배우며, 자비의 일을 하도록 힘씁시다. 선행은 우리 영혼에 빛을 가져다주고 우리를 그리스도를 닮게 합니다. 주님께서 온 인류와 우리에게 자비를 베푸신 것처럼, 우리도 궁핍하거나 어려움을 당한 사람에게 자비를 베풀 때 조금이나마 주님을 닮게 됩니다. 이 길을 걸어가면, 우리는 주님께서 우리 모두가 있기를 원하시는 곳, 곧 하늘나라에 이르게 될 것입니다.</p></blockquote><p>(러시아어에서 옮김; <a href="https://vk.com/wall293099986_47857">출처, 러시아어</a>)</p>
