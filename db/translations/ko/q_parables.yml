- src: притча_о_выборе_места_на_свадьбе
  path: Cp5w_혼인_잔치에서_자리를_고르는_일
  title: 혼인 잔치에서 자리를 고르는 일
  copy_cover: true
  body: <blockquote><p>“네가 누구에게나 혼인 잔치에 청함을 받았을 때에 <strong>높은 자리에 앉지 말라</strong> 그렇지 않으면 너보다 더 높은 사람이 청함을 받은 경우에 너와 그를 청한 자가 와서 너더러 이 사람에게 자리를 내주라 하리니 그 때에 <strong>네가 부끄러워 끝자리로 가게 되리라</strong> 청함을 받았을 때에 차라리 가서 <strong>끝자리에 앉으라</strong> 그러면 너를 청한 자가 와서 너더러 <strong>벗이여 올라 앉으라 하리니 그 때에야 함께 앉은 모든 사람 앞에서 영광이 있으리라</strong> <strong><mark>무릇 자기를 높이는 자는 낮아지고 자기를 낮추는 자는 높아지리라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/lk/14/#L8-11">눅 14:8-11</a>)</p></blockquote>
  meta_desc: 혼인 잔치에서 높은 자리와 끝자리에 관한 예수 그리스도의 비유
