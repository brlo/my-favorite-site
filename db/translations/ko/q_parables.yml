- src: притча-о-званных-на-пир
  path: Wf4t_혼인_잔치에_청함받은_사람들
  title: 혼인 잔치에 청함받은 사람들
  copy_cover: true
  body: <p>혼인 잔치에 청함받은 사람들에 관한 예수 그리스도의 비유:</p><blockquote><p>“천국은 마치 자기 아들을 위하여 혼인 잔치를 베푼 어떤 임금과 같으니 그 종들을 보내어 그 청한 사람들을 혼인 잔치에 오라 하였더니 <strong>오기를 싫어하거늘</strong> 다시 다른 종들을 보내며 이르되 청한 사람들에게 이르기를 내가 오찬을 준비하되 나의 소와 살진 짐승을 잡고 모든 것을 갖추었으니 혼인 잔치에 오소서 하라 하였더니 그들이 돌아 보지도 않고 한 사람은 자기 밭으로, 한 사람은 자기 사업하러 가고 그 남은 자들은 종들을 잡아 모욕하고 죽이니 임금이 노하여 군대를 보내어 그 살인한 자들을 진멸하고 그 동네를 불사르고 이에 종들에게 이르되 혼인 잔치는 준비되었으나 <strong>청한 사람들은 합당하지 아니하니</strong> 네거리 길에 가서 사람을 만나는 대로 혼인 잔치에 청하여 오라 한대 종들이 길에 나가 악한 자나 선한 자나 만나는 대로 모두 데려오니 혼인 잔치에 손님들이 가득한지라 임금이 손님들을 보러 들어올새 거기서 <strong>예복을 입지 않은 한 사람</strong>을 보고 이르되 친구여 어찌하여 예복을 입지 않고 여기 들어왔느냐 하니 그가 아무 말도 못하거늘 임금이 사환들에게 말하되 그 손발을 묶어 바깥 어두운 데에 내던지라 거기서 슬피 울며 이를 갈게 되리라 하니라 <strong><mark>청함을 받은 자는 많되 택함을 입은 자는 적으니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/22/#L2-14">마 22:2-14</a>)</p></blockquote>
  meta_desc: 혼인 잔치에 청함받은 사람들에 관한 예수 그리스도의 비유
