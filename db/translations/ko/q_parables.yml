- src: притча-о-трёх-рабах-и-талантах-5-2-1
  path: Tl15t_달란트
  title: 달란트의 비유(다섯, 둘, 하나)
  copy_cover: true
  body: <blockquote><p>“또 어떤 사람이 타국에 갈 때 그 종들을 불러 자기 소유를 맡김과 같으니 <strong>각각 그 재능대로</strong> 한 사람에게는 금 다섯 달란트를, 한 사람에게는 두 달란트를, 한 사람에게는 한 달란트를 주고 떠났더니 다섯 달란트 받은 자는 바로 가서 그것으로 장사하여 또 다섯 달란트를 남기고 두 달란트 받은 자도 그같이 하여 또 두 달란트를 남겼으되 한 달란트 받은 자는 가서 <strong>땅을 파고 그 주인의 돈을 감추어 두었더니</strong> 오랜 후에 그 종들의 주인이 돌아와 그들과 결산할새 다섯 달란트 받았던 자는 다섯 달란트를 더 가지고 와서 이르되 주인이여 내게 다섯 달란트를 주셨는데 보소서 내가 또 다섯 달란트를 남겼나이다 그 주인이 이르되 잘하였도다 <strong>착하고 충성된 종아 네가 적은 일에 충성하였으매 내가 많은 것을 네게 맡기리니</strong> 네 주인의 즐거움에 참여할지어다 하고 두 달란트 받았던 자도 와서 이르되 주인이여 내게 두 달란트를 주셨는데 보소서 내가 또 두 달란트를 남겼나이다 그 주인이 이르되 잘하였도다 착하고 충성된 종아 네가 적은 일에 충성하였으매 내가 많은 것을 네게 맡기리니 네 주인의 즐거움에 참여할지어다 하고 한 달란트 받았던 자는 와서 이르되 주인이여 당신은 굳은 사람이라 심지 않은 데서 거두고 헤치지 않은 데서 모으는 줄을 내가 알았으므로 두려워하여 나가서 당신의 달란트를 땅에 감추어 두었었나이다 보소서 당신의 것을 가지셨나이다 그 주인이 대답하여 이르되 <strong>악하고 게으른 종아</strong> 나는 심지 않은 데서 거두고 헤치지 않은 데서 모으는 줄로 네가 알았느냐 그러면 네가 마땅히 내 돈을 취리하는 자들에게나 맡겼다가 내가 돌아와서 내 원금과 이자를 받게 하였을 것이니라 하고 그에게서 그 한 달란트를 빼앗아 열 달란트 가진 자에게 주라 <strong>무릇 있는 자는 받아 풍족하게 되고 없는 자는 그 있는 것까지 빼앗기리라</strong> 이 무익한 종을 바깥 어두운 데로 내쫓으라 거기서 슬피 울며 이를 갈리라 하니라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/25/#L14-30">마 25:14-30</a>)</p></blockquote>
