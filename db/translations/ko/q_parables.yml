  title: 악한 농부들의 비유
  copy_cover: true
  body: <p>악한 농부들에 관한 예수 그리스도의 비유:</p><blockquote><p>“다른 한 비유를 들으라 한 집 주인이 포도원을 만들어 산울타리로 두르고 거기에 즙 짜는 틀을 만들고 망대를 짓고 농부들에게 세로 주고 타국에 갔더니 열매 거둘 때가 가까우매 그 열매를 받으려고 자기 종들을 농부들에게 보내니 농부들이 종들을 잡아 하나는 심히 때리고 하나는 죽이고 하나는 돌로 쳤거늘 다시 다른 종들을 처음보다 많이 보내니 그들에게도 그렇게 하였는지라 <strong>후에 자기 아들을 보내며</strong> 이르되 그들이 내 아들은 존대하리라 하였더니 농부들이 그 아들을 보고 서로 말하되 <strong>이는 상속자니 자 죽이고</strong> 그의 유산을 차지하자 하고 이에 잡아 <strong>포도원 밖에 내쫓아 죽였느니라</strong> 그러면 포도원 주인이 올 때에 그 농부들을 어떻게 하겠느냐 그들이 말하되 그 악한 자들을 진멸하고 포도원은 제 때에 열매를 바칠 만한 다른 농부들에게 세로 줄지니이다 &lt;…&gt; 대제사장들과 바리새인들이 예수의 비유를 듣고 <strong>자기들을 가리켜 말씀하심인 줄 알고</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/21/#L33-41,45">마 21:33-41,45</a>)</p></blockquote>
