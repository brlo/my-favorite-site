    body: |-
      <h2>0</h2><p>이그나티오스[1] 곧 테오포로스[2]가, 아시아의 에페소에 있는, 참으로 복된 교회에 보냅니다. 이 교회는 아버지 하느님의 충만한 위대하심 안에서 복을 받았고, 세상이 시작되기 전부터[3] 변함없고 흔들리지 않는 영원한 영광에 이르도록 늘 예정되었으며, 참된 수난 안에서 아버지와 우리 하느님이신 예수 그리스도의 뜻에 따라 하나가 되고 뽑힌 교회입니다. 예수 그리스도 안에서, 그리고 흠 없는 기쁨 가운데 진심으로 문안합니다.</p>
      <h2>1</h2><p>1. 하느님 안에서 깊이 사랑받는 여러분의 이름을 나는 받아들였습니다. 그 이름은 우리 구세주 그리스도 예수께 대한 믿음과 사랑에 따라, 올바른 본성으로 여러분이 얻은 것입니다. 여러분은 하느님을 본받는 사람들로서, 하느님의 피[4]로 다시 불타올라 한 가족에게 어울리는 일을 완전히 이루었습니다.</p><p>2. 내가 공동의 이름과 희망을 위하여[5] 시리아에서 묶여 왔다는 것, 그리고 여러분의 기도로 로마에서 맹수와 싸우는 일을 이루고, 그것을 이룸으로써 제자가 될 수 있기를[6] 바란다는 것을 듣고, 여러분은 서둘러 나를 만나러 왔습니다.</p><p>3. 그리하여 나는 하느님의 이름으로, 말할 수 없는 사랑의 사람이요 육신으로 여러분의 주교인 오네시모[7] 안에서 여러분 모두를 맞아들였습니다. 여러분이 예수 그리스도를 따라 그를 사랑하고, 모두 그를 닮기를 나는 기도합니다. 이런 주교를 모시기에 합당한 여러분에게 그를 선물로 주신 분은 찬미받으소서.</p>
      <h2>2</h2><p>1. 나의 동료 종[8]이며 하느님을 따르는 여러분의 보제로서 모든 일에 복을 받은 부루스에 관해서는, 그가 여러분과 주교의 영예를 위하여 이곳에 머물러 주기를 바랍니다. 또 하느님께도 여러분에게도 합당한 크로코스는, 내가 여러분의 사랑을 보여 주는 살아 있는 본보기[9]로 맞아들인 사람인데, 모든 면에서 나를 쉬게 해 주었습니다. 예수 그리스도의 아버지께서 오네시모, 부루스, 에우플로스, 프론톤과 함께 그도 위로해 주시기를 빕니다. 나는 그들을 통하여 사랑 안에서 여러분 모두를 보았습니다.</p><p>2. 내가 합당한 사람이라면, 언제까지나 여러분으로 말미암아 기쁨을 누리고 싶습니다[10]. 그러므로 여러분을 영광스럽게 해 주신 예수 그리스도를 모든 방법으로 찬양하는 것이 마땅합니다. 그리하여 여러분이 한 가지 순종 안에서 온전해지고, 주교와 사제단[11]에게 순종하여 모든 일에서 거룩해지기를 바랍니다[12].</p>
      <h2>3</h2><p>1. 나는 무슨 대단한 사람이라도 되는 듯이 여러분에게 명령하는 것이 아닙니다. 이 이름 때문에 묶여 있기는 하지만, 나는 아직 예수 그리스도 안에서 완전해지지 못했습니다. 이제 겨우 제자가 되기 시작했을 뿐이며, 나의 동료 학생[13]인 여러분에게 말을 건네는 것입니다. 오히려 내가 여러분에게서 믿음과 훈계와 인내와 관용으로 기름부음을 받아 준비되어야[14] 했습니다.</p><p>2. 그러나 사랑이 여러분에 대하여 침묵하도록 나를 내버려 두지 않으므로, 여러분이 하느님의 뜻[15]에 발맞추어 나아가도록 먼저 권하기로 한 것입니다. 우리의 떨어질 수 없는 생명이신 예수 그리스도께서는 아버지의 뜻이시며, 마찬가지로 땅끝까지 세워진 주교들도 예수 그리스도의 뜻 안에 있기 때문입니다.</p>
      <h2>4</h2><p>1. 그러므로 여러분도 주교의 뜻에 발맞추어 나아가는 것이 마땅하며, 실제로 여러분은 그렇게 하고 있습니다. 이름 높고 하느님께 합당한 여러분의 사제단은 거문고에 줄이 맞추어지듯 주교와 조화를 이루고 있습니다. 그러므로 여러분의 한마음과 조화로운 사랑 안에서 예수 그리스도께서 노래로 찬양받으십니다.</p><p>2. 여러분도 한 사람 한 사람이 합창단이 되십시오. 그리하여 한마음으로 조화를 이루고, 하나가 되어 하느님의 음조[16]를 받아, 예수 그리스도를 통하여 한목소리로 아버지께 노래하십시오. 그러면 아버지께서 여러분의 노래를 들으시고, 여러분이 행하는 선한 일을 보시고 여러분이 당신 아드님의 지체임을 알아보실 것입니다. 그러므로 여러분이 흠 없는 일치 안에 있는 것은 유익합니다. 그래야 언제나 하느님께도 참여할 수 있습니다.</p>
      <h2>5</h2><p>1. 내가 짧은 시간에 여러분의 주교와 이처럼 친밀한 사귐을—인간적인 것이 아니라 영적인 사귐을—가졌다면, 교회가 예수 그리스도와, 또 예수 그리스도께서 아버지와 결합되어 계시듯이 주교와 이토록 깊이 결합되어 모든 것이 일치 안에서 조화를 이루는 여러분은 얼마나 더 행복하다고 하겠습니까?</p><p>2. 아무도 속지 마십시오. 제단 안[17]에 있지 않은 사람은 하느님의 빵[18]을 얻지 못합니다. 한두 사람의 기도에도 그만한 힘이 있다면[19], 주교와 온 교회의 기도는 얼마나 더하겠습니까?</p><p>3. 그러므로 함께 모이지 않는 사람은 이미 교만해졌고, 스스로 (교회에서) 자신을 갈라놓은 것입니다. 성서에 "하느님께서는 교만한 자를 물리치신다"[20]고 기록되어 있기 때문입니다. 그러므로 하느님께 순종하는 사람이 되기 위하여, 주교에게 맞서지 않도록 힘씁시다.</p>
      <h2>6</h2><p>1. 주교가 침묵하는 것[21]을 보면 볼수록 더욱 그를 두려워하고 공경하십시오. 집주인이 자기 집을 관리하라고 보내는 사람은 누구든지, 보낸 분 자신을 맞아들이듯이 맞아들여야 하기 때문입니다[22]. 그러므로 주교를 주님 자신을 우러러보듯이 우러러보아야 한다는 것은 분명합니다.</p><p>2. 실제로 오네시모 자신도 하느님 안에서 여러분이 지키는 좋은 질서를 크게 칭찬하고 있습니다. 여러분은 모두 진리를 따라 살고, 여러분 가운데에는 어떤 이단도 자리 잡고 있지 않으며, 오히려 진리 안에서 예수 그리스도에 관하여 말하는 사람 말고는 아무의 말에도 귀를 기울이지 않는다고 말입니다.</p>
      <h2>7</h2><p>1. 어떤 사람들은 악한 속임수로 (그리스도의) 이름을 내세우고 다니면서, 하느님께 합당하지 않은 다른 일들을 하곤 합니다. 여러분은 그들을 맹수처럼 피해야 합니다. 그들은 미친개요, 몰래 무는 자들이기 때문입니다. 그들은 고치기 어려운 자들이니 여러분은 그들을 경계해야 합니다.</p><p>2. 의사는 오직 한 분이십니다. 육으로나 영으로나, 나신 분이며 나지 않으신 분[23], 사람 안에 계신 하느님[24], 죽음 안에 있는 참생명, 마리아에게서 나시고 하느님에게서 나신 분, 처음에는 고난을 받으실 수 있었으나 이제는 고난을 받지 않으시는 분, 곧 우리 주 예수 그리스도이십니다.</p>
      <h2>8</h2><p>1. 그러므로 아무에게도 속지 마십시오. 물론 여러분은 온전히 하느님의 사람들이므로 속지 않고 있습니다. 여러분을 괴롭힐 수 있는 어떤 다툼도 여러분 가운데 뿌리내리지 않았다면, 여러분은 참으로 하느님을 따라 살고 있는 것입니다. 나는 여러분을 위한 속죄물[25]입니다. 세세에 이름난 교회인 여러분 에페소 사람들을 위하여 나는 나 자신을 바칩니다.</p><p>2. 육적인 사람은 영적인 일을 할 수 없고, 영적인 사람은 육적인 일을 할 수 없습니다. 믿음이 불신앙의 일을, 불신앙이 믿음의 일을 할 수 없는 것과 같습니다. 그러나 여러분은 육으로 하는 일조차 영적입니다. 여러분은 모든 일을 예수 그리스도 안에서 하기 때문입니다.</p>
      <h2>9</h2><p>1. 그런데 나는 어떤 사람들이 그곳에서[26] 지나와 나쁜 가르침을 가져왔다는 것을 알았습니다. 그러나 여러분은 그들이 여러분 가운데 씨를 뿌리지 못하게 하였고, 그들이 뿌리는 것을 받아들이지 않으려고 귀를 막았습니다. 여러분은 아버지 성전의 돌[27]로서 아버지 하느님의 건물을 위하여 준비되었고, 십자가이신 예수 그리스도의 기중기로 성령을 밧줄로 삼아 높은 곳으로 들어 올려지고 있기 때문입니다. 여러분의 믿음은 여러분을 끌어올리는 것이고, 사랑은 하느님께로 이끌어 올리는 길입니다.</p><p>2. 그러므로 여러분은 모두 함께 길을 가는 동행자이며, 하느님을 모신 사람, 성전을 모신 사람, 그리스도를 모신 사람, 거룩한 것을 모신 사람[28]으로서, 모든 면에서 예수 그리스도의 계명으로 꾸며져 있습니다. 나도 여러분 때문에 기뻐하며, 이 편지로 여러분과 이야기를 나누고 함께 기뻐하는 것을 허락받았습니다. 여러분은 인간의 삶에서 오직 하느님 말고는 아무것도 사랑하지 않기 때문입니다.</p>
      <h2>10</h2><p>1. 다른 사람들[29]을 위해서도 끊임없이 기도하십시오. 그들에게도 회개의 희망이 있어 하느님께 이를 수 있기 때문입니다. 그러므로 적어도 여러분의 행실을 보고 그들이 배울 수 있게 하십시오.</p><p>2. 그들의 분노에는 온유로, 그들의 큰소리에는 겸손으로, 그들의 모독에는 기도로, 그들의 잘못에는 믿음의 굳건함으로, 그들의 난폭함에는 온화함으로 대하십시오. 그들에게 앙갚음하려고 애쓰지 마십시오.</p><p>3. 너그러움으로 우리가 그들의 형제임을 보여 줍시다. 그리고 주님을 본받는 사람이 되도록 힘씁시다. 누가 더 많이 부당한 일을 당하고, 누가 더 많이 빼앗기고, 누가 더 많이 업신여김을 받는지 겨루면서 말입니다[30]. 그리하여 악마의 가라지[31]가 여러분 가운데 하나도 보이지 않고, 여러분이 완전한 순결과 절제 가운데 육으로나 영으로나 예수 그리스도 안에 머물기를 바랍니다.</p>
      <h2>11</h2><p>1. 지금은 마지막 때입니다. 그러므로 우리는 부끄러워하며 하느님의 인내를 두려워합시다. 그것이 우리에게 심판이 되지 않게 하기 위해서입니다. 다가올 진노를 두려워하든지, 지금 있는 은총을 사랑하든지, 둘 중의 하나입니다. 다만 참생명을 위하여 그리스도 예수 안에서 발견되기만 하면 됩니다.</p><p>2. 그분을 떠나서는 아무것도 여러분에게 어울리지 않습니다. 나는 그분 안에서 이 사슬을 지니고 다닙니다. 이 사슬은 영적인 진주[32]입니다. 여러분의 기도로 이 사슬을 지닌 채 내가 부활할 수 있기를 빕니다. 내가 언제나 그 기도에 참여하는 사람이 되기를 빕니다. 그리하여 예수 그리스도의 힘으로 언제나 사도들과 한마음이었던 에페소 그리스도인들의 몫 안에서 내가 발견되기를 빕니다.</p>
      <h2>12</h2><p>1. 나는 내가 누구이며 누구에게 편지를 쓰고 있는지 압니다. 나는 단죄받은 사람이고 여러분은 자비를 입은 사람들입니다. 나는 위험 속에 있고 여러분은 굳게 서 있습니다.</p><p>2. 여러분은 하느님께로 가기 위해 죽임을 당하는 사람들이 지나가는 길목[33]입니다. 여러분은 거룩하게 되었고 증언을 받았으며 참으로 복된 바울로와 함께 신비에 참여하는 사람들입니다. 내가 하느님께 이를 때 그의 발자취 안에서 발견되기를 빕니다. 그는 모든 편지에서[34] 그리스도 예수 안에서 여러분을 기억하고 있습니다.</p>
      <h2>13</h2><p>1. 그러므로 하느님께 감사의 제사(성찬)[35]를 드리고 영광을 드리기 위하여 더 자주 모이도록 힘쓰십시오. 여러분이 자주 함께 모이면 사탄의 세력은 무너지고, 그가 가져오는 멸망은 여러분의 한마음 한뜻인 믿음 안에서 풀려 사라집니다.</p><p>2. 평화보다 더 좋은 것은 없습니다. 평화 안에서 하늘의 것들과 땅의 것들의 모든 싸움이 그칩니다.</p>
      <h2>14</h2><p>1. 여러분이 예수 그리스도께 대한 믿음과 사랑을 완전히 지니고 있다면, 이 가운데 어느 것도 여러분에게 감추어져 있지 않습니다. 믿음과 사랑은 생명의 시작이요 끝입니다. 시작은 믿음이고 끝은 사랑입니다. 이 둘이 하나로 결합된 것이 하느님이시며[36], 그 밖의 모든 선한 것은 이를 뒤따라옵니다.</p><p>2. 믿음을 고백하는 사람은 아무도 죄를 짓지 않고, 사랑을 얻은 사람은 아무도 미워하지 않습니다. "열매를 보아 나무를 알 수 있다"[37]. 이와 같이 그리스도의 사람이라고 고백하는 이들은 그들이 하는 일로 드러날 것입니다. 지금 중요한 것은 고백이 아니라, 끝까지 믿음의 힘 안에서 발견되는 것입니다.</p>
      <h2>15</h2><p>1. 말을 하면서 (그리스도인이) 아닌 것보다, 침묵하면서 (그리스도인)인 것이 낫습니다. 가르치는 것은 좋은 일입니다. 말하는 사람이 행한다면 말입니다. 그러므로 스승은 한 분뿐이십니다. 그분은 "말씀 한 마디에 모든 것이 생기게"[38] 하셨고, 그분이 침묵 가운데 하신 일들도 아버지께 합당합니다.</p><p>2. 예수님의 말씀을 참으로 얻은 사람은 그분의 침묵도 들을 수 있습니다. 그리하여 완전한 사람이 되어, 말하는 것으로 행하고 침묵하는 것으로 알려질 것입니다.</p><p>3. 주님께 감추어진 것은 아무것도 없으며, 우리의 숨은 일들조차 그분께 가까이 있습니다. 그러므로 그분이 우리 안에 계신 것처럼 모든 일을 합시다. 그리하여 우리는 그분의 성전이 되고[39], 그분은 우리 안에서 우리 하느님이 되실 것입니다. 실제로 그러하며, 그것은 우리 눈앞에 드러날 것입니다. 그러므로 우리가 그분을 사랑하는 것은 마땅합니다.</p>
      <h2>16</h2><p>1. 나의 형제 여러분, 속지 마십시오. 가정을 파괴하는 자들[40]은 하느님 나라를 차지하지 못할 것입니다.</p><p>2. 육으로 이런 짓을 하는 자들도 죽었는데, 하물며 예수 그리스도께서 그것을 위하여 십자가에 못 박히신 하느님에 대한 믿음을 악한 가르침으로 썩게 하는 자는 어떻겠습니까? 그런 자는 더러워져서 꺼지지 않는 불로 들어갈 것이고, 그의 말을 듣는 사람도 마찬가지입니다.</p>
      <h2>17</h2><p>1. 그 때문에 주님께서는 머리에 향유를 받으셨습니다[41]. 교회에 불멸의 향기를 불어넣으시려는 것이었습니다. 이 세상 권력자[42]의 가르침의 악취를 몸에 바르지 마십시오. 그가 여러분을 사로잡아 여러분 앞에 놓인 생명에서 떼어 놓지 못하게 하십시오.</p><p>2. 우리는 하느님에 대한 앎, 곧 예수 그리스도를 받았으면서도 왜 모두 슬기로워지지 않습니까? 왜 주님께서 참으로 보내 주신 선물을 알지 못하고 어리석게 멸망해 갑니까?</p>
      <h2>18</h2><p>1. 나의 영은 십자가를 위한 속죄물입니다. 십자가는 믿지 않는 사람들에게는 걸림돌이지만 우리에게는 구원이요 영원한 생명입니다[43]. "지혜로운 자가 어디 있고, 이론가가 어디 있습니까?"[44] 슬기롭다는 자들의 자랑은 어디 있습니까?</p><p>2. 우리 하느님이신 예수 그리스도께서는 하느님의 경륜에 따라 마리아에게 잉태되셨습니다. 다윗의 후손에게서[45], 그리고 성령에게서 나신 것입니다. 그분은 태어나셨고 세례를 받으셨는데, 그것은 당신의 수난으로 물을 깨끗하게 하시기 위해서였습니다[46].</p>
      <h2>19</h2><p>1. 이 세상 권력자는 마리아의 동정과 그의 출산을, 그리고 주님의 죽음도 알지 못하였습니다. 이것은 하느님의 침묵 속에서 이루어진, 소리 높여 선포되어야 할 세 가지 신비[47]입니다.</p><p>2. 그러면 그것들은 어떻게 세상에 드러났습니까? 하늘에 별 하나가 빛났습니다[48]. 그 별은 모든 별보다 밝게 빛났고, 그 빛은 이루 말할 수 없었으며, 그 새로움은 놀라움을 자아냈습니다. 다른 모든 별들은 해와 달과 함께 그 별을 둘러싼 합창단이 되었지만, 그 별의 빛은 모든 것을 능가했습니다. 그리고 자기들과 같지 않은 이 새로운 것이 어디에서 왔는지 혼란이 일어났습니다.</p><p>3. 그때부터 모든 마술이 풀리고 악의 모든 사슬이 사라졌습니다. 무지가 걷히고 옛 왕국이 무너졌습니다. 하느님께서 사람의 모습으로 나타나시어 영원한 생명의 새로움을 가져오셨기 때문입니다. 하느님 곁에서 완전히 준비되었던 일이 시작된 것입니다. 그때부터 죽음의 멸망이 계획되고 있었으므로 만물이 뒤흔들렸습니다.</p>
      <h2>20</h2><p>1. 만일 예수 그리스도께서 여러분의 기도로 나를 합당한 사람으로 여겨 주시고 그것이 그분의 뜻이라면, 내가 여러분에게 쓰려고 하는 두 번째 작은 책[49]에서, 내가 이야기하기 시작한 새 인간 예수 그리스도에 관한 경륜, 곧 그분에 대한 믿음과 사랑, 그분의 수난과 부활에 대하여 더 밝혀 드리겠습니다.</p><p>2. 특히 주님께서 나에게 계시해 주신다면 그렇게 하겠습니다. 여러분이 한 사람도 빠짐없이 모두 함께, 은총 안에서 이름을 불리며, 한 믿음 안에서, 그리고 육으로는 다윗의 가문에서 나신 사람의 아들이요 하느님의 아들이신 예수 그리스도 안에서 모여, 흐트러지지 않는 마음으로 주교와 사제단에게 순종하며, 하나의 빵을 떼고 있다는 것을 말입니다. 이 빵은 불사의 약[50]이요, 죽지 않고 예수 그리스도 안에서 영원히 살게 하는 해독제입니다.</p>
      <h2>21</h2><p>1. 나는 여러분과, 여러분이 하느님의 영예를 위하여 스미르나로 보낸 사람들을 위하여 내 목숨을 내놓는 사람[51]입니다. 나는 바로 그 스미르나에서 여러분에게 이 편지를 씁니다. 주님께 감사하며, 여러분을 사랑하듯이 폴리카르포스를 사랑하면서 말입니다. 예수 그리스도께서 여러분을 기억하시듯이 나를 기억해 주십시오.</p><p>2. 시리아에 있는 교회를 위하여 기도해 주십시오. 나는 그곳에서 묶여 로마로 끌려갑니다. 나는 그곳 신자들 가운데 가장 보잘것없는 사람이지만, 하느님의 영예를 위하여 발견되기에 합당한 사람이 되었습니다. 아버지 하느님과 우리의 공동의 희망이신 예수 그리스도 안에서 안녕히 계십시오.</p>
    references: |-
      <ol><li><p>이그나티오스가 호송되던 길에 스미르나에 이르렀을 때, 에페소 교회는 주교 오네시모, 보제 부루스, 크로코스, 에우플로스, 프론톤을 보내 그를 찾아보았습니다(<a href="#HH-1">1장</a>, <a href="#HH-2">2장</a>, <a href="#HH-21">21장</a>). 이그나티오스는 이 편지에서 그들의 사랑에 감사하고, 한마음으로 주교와 사제단에게 순종할 것(3–6장)과 그릇된 가르침을 피할 것(7–10장)을 권하며, 그리스도의 강생과 수난의 신비에 대하여 말합니다. 편지는 스미르나에서 쓰였습니다(<a href="#HH-21">21:1</a>).</p></li><li><p>그리스어 Θεοφόρος — '하느님을 모신 사람'. 이그나티오스 자신은 같은 말을 모든 그리스도인에게 씁니다(<a href="#HH-9">9:2</a>).</p></li><li><p><a href="https://bibleox.com/ko/ko-ctb/ef/1/#L4-5">에페 1:4-5</a>, <a href="https://bibleox.com/ko/ko-ctb/ef/1/#L11">에페 1:11</a> 참조.</p></li><li><p><a href="https://bibleox.com/ko/ko-ctb/act/20/#L28">사도 20:28</a> 참조. 이그나티오스는 그리스도를 '우리 하느님'이라고 부르며(인사말, <a href="#HH-18">18:2</a>), 그분의 피를 '하느님의 피'라고 합니다.</p></li><li><p>그리스도의 이름(그리스도인이라는 이름)을 위하여.</p></li><li><p>이그나티오스는 순교를 통해서야 참된 제자가 된다고 생각합니다(<a href="https://bibleox.com/ko/ko/w/Ig2R_로마교회에보낸편지#HH-4">「로마 교회에 보낸 편지」 4:2</a>, <a href="https://bibleox.com/ko/ko/w/Ig2R_로마교회에보낸편지#HH-5">「로마 교회에 보낸 편지」 5:3</a>). 일부 사본과 고대 번역(러시아어 번역과 영어 번역도 이를 따름)은 여기에 '우리를 위하여 당신 자신을 하느님께 예물과 제물로 바치신 분의'(<a href="https://bibleox.com/ko/ko-ctb/ef/5/#L2">에페 5:2</a>)를 덧붙이지만, 그리스어 본문에는 없습니다.</p></li><li><p>'육신으로'(ἐν σαρκί)는 이 사이트의 그리스어 본문에는 빠져 있으나, 표준 비평본(라이트풋, 홈스)에는 있습니다. 눈에 보이는 주교라는 뜻으로, 보이지 않는 주교이신 그리스도와 대비됩니다(<a href="https://bibleox.com/ko/ko/w/Ig2M_마그네시아교회에보낸편지#HH-3">「마그네시아 교회에 보낸 편지」 3:1-2</a>, <a href="https://bibleox.com/ko/ko/w/Ig2R_로마교회에보낸편지#HH-9">「로마 교회에 보낸 편지」 9:1</a>).</p></li><li><p>σύνδουλος. 이그나티오스는 보제들을 이렇게 부릅니다(<a href="https://bibleox.com/ko/ko/w/Ig2M_마그네시아교회에보낸편지#HH-2">「마그네시아 교회에 보낸 편지」 2장</a>, <a href="https://bibleox.com/ko/ko/w/Ig2F_필라델피아교회에보낸편지#HH-4">「필라델피아 교회에 보낸 편지」 4장</a>, <a href="https://bibleox.com/ko/ko/w/Ig2S_스미르나교회에보낸편지#HH-12">「스미르나 교회에 보낸 편지」 12:2</a>).</p></li><li><p>ἐξεμπλάριον — 라틴어 exemplarium에서 빌려 온 말로, '여러분의 사랑을 몸으로 보여 주는 사람'이라는 뜻입니다.</p></li><li><p>ὀναίμην — '여러분에게서 덕을 보고 싶다, 기쁨을 누리고 싶다'. 주교 오네시모(Ὀνήσιμος, '유익한 사람')의 이름을 빌린 말놀이로, 바울로도 필레몬에게 보낸 편지에서 같은 말놀이를 합니다(<a href="https://bibleox.com/ko/ko-ctb/fm/1/#L20">필레 1:20</a>).</p></li><li><p>πρεσβυτέριον — 주교 아래 있는 사제들(πρεσβύτεροι, 본디 '원로')의 모임. 이그나티오스의 편지에는 주교, 사제, 보제의 세 품계가 뚜렷이 나타납니다.</p></li><li><p>일부 번역(러시아어, 영어)은 여기에 '같은 마음과 같은 생각으로 굳게 결합하여 모두 같은 말을 하도록'(<a href="https://bibleox.com/ko/ko-ctb/1kor/1/#L10">1고린 1:10</a>)을 덧붙이지만, 그리스어 본문에는 없습니다.</p></li><li><p>συνδιδασκαλῖται — '함께 배우는 사람들'. '함께 가르치는 사람들'로 보는 번역도 있습니다.</p></li><li><p>ὑπαλειφθῆναι — 운동선수가 경기 전에 기름을 바르듯이 준비되는 것.</p></li><li><p>γνώμη — '생각, 뜻, 경륜'.</p></li><li><p>χρῶμα — 음악 용어로 '음조, 음색'. 모두가 하느님의 음조를 받아 하나가 되어 노래한다는 비유입니다.</p></li><li><p>주교 아래 하나의 제단을 둘러싸고 모이는 교회의 친교 안에, 라는 뜻입니다(<a href="https://bibleox.com/ko/ko/w/Ig2M_마그네시아교회에보낸편지#HH-7">「마그네시아 교회에 보낸 편지」 7:2</a>, <a href="https://bibleox.com/ko/ko/w/Ig2T_트랄레스교회에보낸편지#HH-7">「트랄레스 교회에 보낸 편지」 7:2</a>, <a href="https://bibleox.com/ko/ko/w/Ig2F_필라델피아교회에보낸편지#HH-4">「필라델피아 교회에 보낸 편지」 4장</a>).</p></li><li><p><a href="https://bibleox.com/ko/ko-ctb/in/6/#L33">요한 6:33</a> 참조.</p></li><li><p><a href="https://bibleox.com/ko/ko-ctb/mf/18/#L19-20">마태 18:19-20</a> 참조.</p></li><li><p><a href="https://bibleox.com/ko/ko-ctb/pr/3/#L34">잠언 3:34</a>(칠십인역에 따름. 공동번역은 히브리어 본문에서 번역하여 표현이 다름). <a href="https://bibleox.com/ko/ko-ctb/iak/4/#L6">야고 4:6</a>, <a href="https://bibleox.com/ko/ko-ctb/1pet/5/#L5">1베드 5:5</a>에도 인용되어 있으며, 여기서는 야고보서의 공동번역 표현을 따랐습니다.</p></li><li><p>자기 권위를 내세우지 않는 온유한 주교를 말합니다. 이그나티오스는 침묵을 덕으로 여깁니다(<a href="#HH-15">15:1-2</a>, <a href="https://bibleox.com/ko/ko/w/Ig2F_필라델피아교회에보낸편지#HH-1">「필라델피아 교회에 보낸 편지」 1:1</a>).</p></li><li><p><a href="https://bibleox.com/ko/ko-ctb/mf/21/#L33-37">마태 21:33-37</a>, <a href="https://bibleox.com/ko/ko-ctb/in/13/#L20">요한 13:20</a>, <a href="https://bibleox.com/ko/ko-ctb/mf/10/#L40">마태 10:40</a> 참조.</p></li><li><p>γεννητὸς καὶ ἀγέννητος — 사람으로서는 마리아에게서 나셨고, 하느님으로서는 시작이 없으신 분이라는 뜻입니다. 후대의 신학 용어로는 성자께서 성부에게서 '나셨다'고 하기 때문에, 아타나시오스(『공의회들에 관하여』 47)는 이 구절을 γενητὸς καὶ ἀγένητος '(사람으로서) 지음을 받으셨고 (하느님으로서) 지음을 받지 않으신 분'이라는 뜻으로 풀이하고, 정통적인 표현이라고 변호합니다.</p></li><li><p>고대의 인용(아타나시오스, 테오도레토스)과 일부 사본에는 '육신을 취하신 하느님'(ἐν σαρκὶ γενόμενος θεός).</p></li><li><p>περίψημα — 본디 '닦아 낸 찌꺼기'(<a href="https://bibleox.com/ko/ko-ctb/1kor/4/#L13">1고린 4:13</a> '온갖 것의 찌꺼기'). 당시에는 '나는 여러분을 위하여 나를 바치는 사람'이라는 헌신의 관용구로도 쓰였습니다. <a href="#HH-18">18:1</a>에도 나옵니다.</p></li><li><p>거짓 교사들이 어디에서 왔는지는 밝혀져 있지 않습니다.</p></li><li><p><a href="https://bibleox.com/ko/ko-ctb/ef/2/#L20-22">에페 2:20-22</a>, <a href="https://bibleox.com/ko/ko-ctb/1pet/2/#L5">1베드 2:5</a> 참조. 돌을 높이 들어 올리는 기중기가 십자가, 그 밧줄이 성령으로 비유되어 있습니다.</p></li><li><p>이교 축제 행렬에서 신상과 신당을 메고 가는 사람들의 모습을 빌려, 그리스도인은 자기 안에 하느님과 성전과 그리스도를 모시고 있다고 말합니다(<a href="https://bibleox.com/ko/ko-ctb/1kor/3/#L16">1고린 3:16</a>). 이그나티오스 자신의 별명 '테오포로스'와 같은 말입니다.</p></li><li><p>믿지 않는 사람들, 길을 잃은 사람들을 말합니다.</p></li><li><p>부당한 일을 당하는 데 있어서 주님을 본받는 경쟁을 하라는 뜻입니다(<a href="https://bibleox.com/ko/ko-ctb/1kor/6/#L7">1고린 6:7</a>). 이 구절을 주님에 관한 말로 보아 '누가 그분보다 더 부당한 일을 당하셨는가'로 옮기는 읽기도 있습니다.</p></li><li><p><a href="https://bibleox.com/ko/ko-ctb/mf/13/#L25">마태 13:25</a>, <a href="https://bibleox.com/ko/ko/w/Ig2T_트랄레스교회에보낸편지#HH-6">「트랄레스 교회에 보낸 편지」 6:1</a>, <a href="https://bibleox.com/ko/ko/w/Ig2F_필라델피아교회에보낸편지#HH-3">「필라델피아 교회에 보낸 편지」 3:1</a> 참조.</p></li><li><p>사슬을 장신구인 진주에 비유하고 있습니다.</p></li><li><p>하느님께로 가기 위해 죽임을 당하는 사람들은 에페소를 거쳐 갔습니다. 바울로도 에페소의 원로들에게 작별을 고하고 예루살렘으로 향했습니다(<a href="https://bibleox.com/ko/ko-ctb/act/20/#L17-38">사도 20:17-38</a>). 이그나티오스도 지금 그 길을 걷고 있습니다.</p></li><li><p>바울로는 여러 편지에서 에페소를 언급하며(<a href="https://bibleox.com/ko/ko-ctb/1kor/15/#L32">1고린 15:32</a>, <a href="https://bibleox.com/ko/ko-ctb/1kor/16/#L8">16:8</a>, <a href="https://bibleox.com/ko/ko-ctb/1tim/1/#L3">1디모 1:3</a>, <a href="https://bibleox.com/ko/ko-ctb/2tim/1/#L18">2디모 1:18</a>, <a href="https://bibleox.com/ko/ko-ctb/2tim/4/#L12">4:12</a>), 에페소인들에게 보낸 편지도 따로 있습니다.</p></li><li><p>εὐχαριστία — 본디 '감사'. 여기서는 교회가 함께 모여 거행하는 성찬(감사의 제사)을 가리킵니다(<a href="https://bibleox.com/ko/ko/w/Ig2F_필라델피아교회에보낸편지#HH-4">「필라델피아 교회에 보낸 편지」 4장</a>, <a href="https://bibleox.com/ko/ko/w/Ig2S_스미르나교회에보낸편지#HH-7">「스미르나 교회에 보낸 편지」 7:1</a>, <a href="https://bibleox.com/ko/ko/w/Ig2S_스미르나교회에보낸편지#HH-8">「스미르나 교회에 보낸 편지」 8:1</a>).</p></li><li><p>믿음과 사랑이 하나로 결합된 곳에 하느님께서 계신다는 뜻입니다(<a href="https://bibleox.com/ko/ko-ctb/1in/4/#L16">1요한 4:16</a>).</p></li><li><p><a href="https://bibleox.com/ko/ko-ctb/mf/12/#L33">마태 12:33</a> 참조.</p></li><li><p><a href="https://bibleox.com/ko/ko-ctb/ps/33/#L9">시편 33:9</a>(칠십인역으로는 32:9).</p></li><li><p><a href="https://bibleox.com/ko/ko-ctb/1kor/3/#L16">1고린 3:16</a>, <a href="https://bibleox.com/ko/ko-ctb/1kor/6/#L19">6:19</a> 참조.</p></li><li><p>οἰκοφθόροι — 간음하는 자들(<a href="https://bibleox.com/ko/ko-ctb/1kor/6/#L9-10">1고린 6:9-10</a>). 이그나티오스는 이 말을 하느님의 집(교회)을 무너뜨리는 거짓 교사들에게 적용합니다.</p></li><li><p><a href="https://bibleox.com/ko/ko-ctb/mf/26/#L7">마태 26:7</a>, <a href="https://bibleox.com/ko/ko-ctb/mk/14/#L3">마르 14:3</a> 참조.</p></li><li><p>악마를 말합니다(<a href="https://bibleox.com/ko/ko-ctb/in/12/#L31">요한 12:31</a>, <a href="https://bibleox.com/ko/ko-ctb/1kor/2/#L6-8">1고린 2:6-8</a>).</p></li><li><p><a href="https://bibleox.com/ko/ko-ctb/1kor/1/#L18">1고린 1:18</a>, <a href="https://bibleox.com/ko/ko-ctb/1kor/1/#L23">1:23</a> 참조.</p></li><li><p><a href="https://bibleox.com/ko/ko-ctb/1kor/1/#L20">1고린 1:20</a> 참조.</p></li><li><p><a href="https://bibleox.com/ko/ko-ctb/rim/1/#L3">로마 1:3</a>, <a href="https://bibleox.com/ko/ko-ctb/2tim/2/#L8">2디모 2:8</a> 참조.</p></li><li><p>그리스도께서는 당신의 세례와 수난으로 물을 거룩하게 하시어 우리가 세례받는 물이 되게 하셨습니다.</p></li><li><p>τρία μυστήρια κραυγῆς — 직역하면 '외침의 세 가지 신비'. 하느님의 침묵, 곧 영원한 경륜 안에서 이루어지고 뒤에 온 세상에 소리 높여 선포된 신비라는 뜻입니다. 악마가 그리스도의 죽음 자체를 몰랐던 것이 아니라, 그것이 하느님의 경륜이라는 것을 몰랐던 것입니다(<a href="https://bibleox.com/ko/ko-ctb/1kor/2/#L7-8">1고린 2:7-8</a>).</p></li><li><p><a href="https://bibleox.com/ko/ko-ctb/mf/2/#L2">마태 2:2</a>, <a href="https://bibleox.com/ko/ko-ctb/mf/2/#L9-10">2:9-10</a> 참조.</p></li><li><p>이그나티오스는 이 책을 쓰지 못하고 순교한 것으로 여겨집니다.</p></li><li><p>φάρμακον ἀθανασίας — 성찬의 빵을 가리킵니다(<a href="https://bibleox.com/ko/ko-ctb/in/6/#L50-51">요한 6:50-51</a>, <a href="https://bibleox.com/ko/ko-ctb/in/6/#L54">6:54</a>, <a href="https://bibleox.com/ko/ko-ctb/in/6/#L58">6:58</a>).</p></li><li><p>ἀντίψυχον — '대신 바치는 목숨'. 여러분을 위하여 내 목숨을 내놓는다는 뜻입니다(<a href="https://bibleox.com/ko/ko/w/Ig2S_스미르나교회에보낸편지#HH-10">「스미르나 교회에 보낸 편지」 10:2</a>, <a href="https://bibleox.com/ko/ko/w/Ig2P_폴리카르포스에게보낸편지#HH-2">「폴리카르포스에게 보낸 편지」 2:3</a>, <a href="https://bibleox.com/ko/ko/w/Ig2P_폴리카르포스에게보낸편지#HH-6">「폴리카르포스에게 보낸 편지」 6:1</a>).</p></li></ol>
      <p>번역: 로디온 블라소프 (AI 도구 활용). 저본: 그리스어 원문(<a href="https://bibleox.com/ko/grc/w/ΙγνΘ_Εφ">이 사이트의 그리스어판</a>. 명백한 누락은 라이트풋판과 홈스판으로 보충함). 참고: 러시아어 번역(『초기 교부 선집』, 브뤼셀, 1988년), 영어 번역(Roberts–Donaldson), 프랑스어 번역(Genoude, 1837년). 성경 인용과 링크는 공동번역 성서에 따름.</p>
