- src: медицина
  path: Md11c_의학
  title: 의학
  copy_cover: true
  body: <p>선지자 이사야는 약으로 치료하는 것을 허락합니다:</p><blockquote><p>“이사야가 이르되 <strong>무화과 반죽을 가져오라</strong> 하매 <strong>무리가 가져다가 그 상처에 놓으니</strong> 나으니라” (<a href="https://bibleox.com/ko/ko-nkrv/4ts/20/#L7">왕하 20:7</a>)</p></blockquote><p>하느님께서는 식물을 지으시어 그 가운데 어떤 것들이 약효를 지니게 하셨습니다:</p><blockquote><p>“의사를 그의 쓰임에 따라 존중하여라. 주님께서 그를 창조하셨다. … <strong>주님께서 땅에서 약을 창조하셨으니</strong> 지혜로운 사람은 그것을 꺼리지 않는다” (<a href="https://bibleox.com/ko/gr-lxx-byz/prsir/38/#L1-4">집회 38:1-4</a>, 그리스어에서 번역)</p></blockquote><p>의사를 찾을 때에도 하느님께 희망을 두어라:</p><blockquote><p>“얘야, <strong>병들었을 때 소홀히 하지 말고 주님께 기도하여라. 그러면 그분께서 너를 고쳐 주시리라</strong> … 그리고 <strong>의사에게 자리를 내주어라. 주님께서 그를 창조하셨다. 그가 너를 떠나지 않게 하여라. 그가 필요하기 때문이다</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/prsir/38/#L9-14">집회 38:9-14</a>, 그리스어에서 번역)</p></blockquote><p>모든 희망을 의사에게만 두는 것은 옳지 않습니다:</p><blockquote><p>“아사가 왕이 된 지 삼십구 년에 그의 발이 병들어 매우 위독했으나 <strong>병이 있을 때에 그가 여호와께 구하지 아니하고 의원들에게 구하였더라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2par/16/#L12">대하 16:12</a>)</p></blockquote><p>사도이자 복음서 저자인 누가는 의사였습니다:</p><blockquote><p>“<strong>사랑을 받는 의사 누가와</strong> 또 데마가 너희에게 문안하느니라” (<a href="https://bibleox.com/ko/ko-nkrv/kol/4/#L14">골 4:14</a>)</p></blockquote>
