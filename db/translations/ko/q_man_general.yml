- src: образование
  path: Ed7c_교육
  title: 교육
  copy_cover: true
  body: <blockquote><p>“얘야, <strong>젊을 때부터 교육을 택하여라</strong>. 그러면 머리가 셀 때까지 <strong>지혜를 얻으리라</strong>. … 교육받지 않은 이들에게 지혜는 <strong>몹시 거칠게 보이니</strong>, 생각 없는 이는 그 안에 머물지 못한다” (<a href="https://bibleox.com/ko/gr-lxx-byz/prsir/6/#L18-21">집회 6:18-21</a>, 그리스어에서 번역)</p></blockquote><blockquote><p>“<strong>너희 어리석은 자들은 어리석음을 좋아하며</strong> 거만한 자들은 거만을 기뻐하며 미련한 자들은 지식을 미워하니 어느 때까지 하겠느냐 &lt;…&gt; <strong>어리석은 자의 퇴보는 자기를 죽이며 미련한 자의 안일은 자기를 멸망시키려니와</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/pr/1/#L22,32">잠 1:22,32</a>)</p></blockquote><blockquote><p>“가난하여도 성실하게 행하는 자는 입술이 패역하고 <strong>미련한 자보다</strong> 나으니라 지식 없는 소원은 선하지 못하고 발이 급한 사람은 잘못 가느니라 <strong>사람이 미련하므로 자기 길을 굽게 하고</strong> 마음으로 여호와를 원망하느니라” (<a href="https://bibleox.com/ko/ko-nkrv/pr/19/#L1-3">잠 19:1-3</a>)</p></blockquote><blockquote><p>“<strong>지혜를 얻는 자는 자기 영혼을 사랑하고</strong> 명철을 지키는 자는 복을 얻느니라” (<a href="https://bibleox.com/ko/ko-nkrv/pr/19/#L8">잠 19:8</a>)</p></blockquote><blockquote><p>“내가 게으른 자의 밭과 <strong>지혜 없는 자의</strong> 포도원을 지나며 본즉 <strong>가시덤불이 그 전부에 퍼졌으며</strong> 그 지면이 거친 풀로 덮였고 돌담이 무너져 있기로” (<a href="https://bibleox.com/ko/ko-nkrv/pr/24/#L30-31">잠 24:30-31</a>)</p></blockquote><blockquote><p>“<strong>네가 네 자신과 가르침을 살펴 이 일을 계속하라</strong> 이것을 행함으로 네 자신과 네게 듣는 자를 구원하리라” (<a href="https://bibleox.com/ko/ko-nkrv/1tim/4/#L16">딤전 4:16</a>)</p></blockquote><blockquote><p>“<strong>백성 중의 어리석은 자들아 너희는 생각하라</strong> <strong>무지한 자들아</strong> 너희가 언제나 지혜로울까” (<a href="https://bibleox.com/ko/ko-nkrv/ps/94/#L8">시 94:8</a>)</p></blockquote><blockquote><p>“훈계를 좋아하는 자는 지식을 좋아하거니와 <strong>징계를 싫어하는 자는 짐승과 같으니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/pr/12/#L1">잠 12:1</a>)</p></blockquote><blockquote><p>“<strong>어리석은 자의 퇴보는 자기를 죽이며</strong> 미련한 자의 안일은 자기를 멸망시키려니와” (<a href="https://bibleox.com/ko/ko-nkrv/pr/1/#L32">잠 1:32</a>)</p></blockquote><blockquote><p>“<strong>어리석은 자는 어리석음으로 기업을 삼아도</strong> 슬기로운 자는 지식으로 면류관을 삼느니라” (<a href="https://bibleox.com/ko/ko-nkrv/pr/14/#L18">잠 14:18</a>)</p></blockquote><blockquote><p>“지혜로운 자의 재물은 그의 면류관이요 <strong>미련한 자의 소유는 다만 미련한 것이니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/pr/14/#L24">잠 14:24</a>)</p></blockquote><blockquote><p>“거짓말은 사람에게 나쁜 흠이니, <strong>교육받지 못한 이들의 입에 늘 붙어 다닌다</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/prsir/20/#L24">집회 20:24</a>, 그리스어에서 번역)</p></blockquote><blockquote><p>“<strong>지혜의 시작은 교육을 바라는 참된 갈망이요, 교육에 마음 쓰는 것은 지혜를 사랑하는 것이다</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/prs/6/#L17-18">지혜 6:17-18</a>, 그리스어에서 번역)</p></blockquote><blockquote><p>“얀네와 얌브레가 모세를 대적한 것 같이 그들도 <strong>진리를 대적하니</strong> 이 사람들은 그 마음이 부패한 자요 <strong>믿음에 관하여는 버림 받은 자들이라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2tim/3/#L8">딤후 3:8</a>)</p></blockquote><blockquote><p>“또 그 모든 편지에도 이런 일에 관하여 말하였으되 그 중에 알기 어려운 것이 더러 있으니 <strong>무식한 자들과</strong> 굳세지 못한 자들이 <strong>다른 성경과 같이 그것도 억지로 풀다가 스스로 멸망에 이르느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2pet/3/#L16">벧후 3:16</a>)</p></blockquote>
  title_sub: 교육이 필요하다는 성경 구절
