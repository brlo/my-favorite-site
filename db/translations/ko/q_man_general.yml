  path: Cm3h_사람의_구성
  title: 사람의 구성
  copy_cover: true
  body: '<p>사람의 본성은 다음으로 이루어져 있습니다:</p><ol><li><p>살로 된 몸;</p></li><li><p>혼(영혼);</p></li><li><p>영(혼의 능력).</p></li></ol><h2>육체</h2><blockquote><p>“나는 … 어머니 태 속에서 <strong>살로 빚어졌다</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/prs/7/#L1-2">지혜 7:1-2</a>, 그리스어에서 번역)</p></blockquote><h2>혼과 영</h2><blockquote><p>“평강의 하나님이 친히 너희를 <strong>온전히</strong> 거룩하게 하시고 또 너희의 온 <strong>영과</strong> <strong>혼과</strong> <strong>몸이</strong> 우리 주 예수 그리스도께서 강림하실 때에 흠 없게 보전되기를 원하노라” (<a href="https://bibleox.com/ko/ko-nkrv/1sol/5/#L23">살전 5:23</a>)</p></blockquote><blockquote><p>“다만 <strong>그의 살이</strong> 아프고 <strong>그의 영혼이</strong> 애곡할 뿐이니이다” (<a href="https://bibleox.com/ko/ko-nkrv/iov/14/#L22">욥 14:22</a>)</p></blockquote><blockquote><p>“하나님이여 주는 나의 하나님이시라 내가 간절히 주를 찾되 물이 없어 마르고 황폐한 땅에서 <strong>내 영혼이</strong> 주를 갈망하며 <strong>내 육체가</strong> 주를 앙모하나이다” (<a href="https://bibleox.com/ko/ko-nkrv/ps/63/#L1">시 63:1</a>)</p></blockquote><blockquote><p>“<strong>내 영혼이</strong> 여호와의 궁정을 사모하여 쇠약함이여 내 마음과 <strong>육체가</strong> 살아 계시는 하나님께 부르짖나이다” (<a href="https://bibleox.com/ko/ko-nkrv/ps/84/#L2">시 84:2</a>)</p></blockquote><blockquote><p>“인자한 자는 <strong>자기의 영혼을</strong> 이롭게 하고 잔인한 자는 <strong>자기의 몸을</strong> 해롭게 하느니라” (<a href="https://bibleox.com/ko/ko-nkrv/pr/11/#L17">잠 11:17</a>)</p></blockquote><h2>사람이 죽을 때 혼은 몸에서 떨어집니다</h2><blockquote><p>“<strong>몸은 죽여도 영혼은 능히 죽이지 못하는 자들을</strong> 두려워하지 말고 오직 몸과 영혼을 능히 지옥에 멸하실 수 있는 이를 두려워하라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/10/#L28">마 10:28</a>; <a href="https://bibleox.com/ko/ko-nkrv/lk/12/#L4">눅 12:4</a>)</p></blockquote><blockquote><p>“유두고라 하는 청년이 창에 걸터 앉아 있다가 깊이 졸더니 바울이 강론하기를 더 오래 하매 졸음을 이기지 못하여 삼 층에서 <strong>떨어지거늘</strong> <strong>일으켜보니 죽었는지라</strong> 바울이 내려가서 그 위에 엎드려 그 몸을 안고 말하되 <strong>떠들지 말라 생명이 그에게 있다</strong> 하고” (<a href="https://bibleox.com/ko/ko-nkrv/act/20/#L9-10">행 20:9-10</a>) <em>(그리스어: ἡ γὰρ ψυχὴ αὐτοῦ ἐν αὐτῷ ἐστιν, “그의 <strong>혼</strong>이 그 안에 있다”.)</em></p></blockquote><h2>죽은 뒤에 사람의 육체는 썩지만 혼은 계속 존재합니다</h2><blockquote><p>“미리 본 고로 그리스도의 부활을 말하되 <strong>그가 음부에 버림이 되지 않고</strong> <strong>그의 육신이</strong> 썩음을 당하지 아니하시리라 하더니” (<a href="https://bibleox.com/ko/ko-nkrv/act/2/#L31">행 2:31</a>) <em>(비잔틴 본문(다수 사본): “<strong>그의 혼이</strong> 음부에 버림이 되지 않고”(ἡ ψυχὴ αὐτοῦ).)</em></p></blockquote><p><a href="https://bibleox.com/ru/ru/w/жизнь-души-после-смерти-тела">사람의 혼이 죽지 않음</a>에 관한 구절.</p><h2>부활 때에 사람의 이전 육체가 회복되고 혼이 돌아와 자기 육체와 다시 결합합니다</h2><blockquote><p>“<strong>내가 알기에는 나의 대속자가 살아 계시니</strong> 마침내 그가 땅 위에 서실 것이라 내 가죽이 벗김을 당한 뒤에도 <strong><mark>내가 육체 밖에서 하나님을 보리라 내가 그를 보리니 내 눈으로 그를 보기를 낯선 사람처럼 하지 않을 것이라</mark></strong> 내 마음이 초조하구나” (<a href="https://bibleox.com/ko/ko-nkrv/iov/19/#L25-27">욥 19:25-27</a>) <em>(히브리어 מִבְּשָׂרִי는 “내 육체로부터”라는 뜻이며 “내 육체 안에서”(NKJV: in my flesh)로도 옮깁니다. 개역개정의 “육체 밖에서”는 해석입니다. 칠십인역(욥 19:26): ἀναστήσαι τὸ δέρμα μου, “내 가죽을 다시 일으키소서”.)</em></p></blockquote>'
