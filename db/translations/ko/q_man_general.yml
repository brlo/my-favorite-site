- src: болезни
  path: Ds9s_질병
  title: 질병
  copy_cover: true
  body: '<h2>첫 그리스도인들도 병을 앓았습니다</h2><p>디모데(에베소의 주교)는 위장병을 앓았습니다. 사도 바울이 병 때문에 금식을 늦추라고 할 정도였습니다:</p><blockquote><p>“<strong>이제부터는 물만 마시지 말고</strong> <strong>네 위장과 자주 나는 병을 위하여는</strong> 포도주를 조금씩 쓰라” (<a href="https://bibleox.com/ko/ko-nkrv/1tim/5/#L23">딤전 5:23</a>)</p></blockquote><p>사도 바울 자신도 교만해지지 않도록 병을 받았습니다:</p><blockquote><p>“여러 계시를 받은 것이 지극히 크므로 너무 자만하지 않게 하시려고 <strong>내 육체에 가시</strong> 곧 사탄의 사자를 주셨으니 이는 나를 쳐서 <strong>너무 자만하지 않게 하려 하심이라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2kor/12/#L7">고후 12:7</a>)</p></blockquote><p>에바브로디도(사도 바울의 동역자)는 병들어 죽을 뻔했습니다:</p><blockquote><p>“그러나 <strong>에바브로디도를</strong> 너희에게 보내는 것이 필요한 줄로 생각하노니 그는 나의 형제요 함께 수고하고 함께 군사 된 자요 너희 사자로 내가 쓸 것을 돕는 자라 그가 너희 무리를 간절히 사모하고 <strong>자기가 병든 것을 너희가 들은 줄을 알고</strong> 심히 근심한지라 <strong>그가 병들어 죽게 되었으나</strong> 하나님이 그를 긍휼히 여기셨고 그뿐 아니라 또 나를 긍휼히 여기사 내 근심 위에 근심을 면하게 하셨느니라 &lt;…&gt; 그가 그리스도의 일을 위하여 죽기에 이르러도 자기 목숨을 돌보지 아니한 것은 나를 섬기는 너희의 일에 부족함을 채우려 함이니라” (<a href="https://bibleox.com/ko/ko-nkrv/fil/2/#L25-27,30">빌 2:25-27,30</a>)</p></blockquote><p>사도 바울은 죄짓는 그리스도인을 사탄에게 내주어 병으로 치게 합니다:</p><blockquote><p>“내가 실로 몸으로는 떠나 있으나 영으로는 함께 있어서 거기 있는 것 같이 이런 일 행한 자를 이미 판단하였노라 &lt;…&gt; <strong>이런 자를 사탄에게 내주었으니 이는 육신은 멸하고 영은 주 예수의 날에 구원을 받게 하려 함이라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/5/#L3,5">고전 5:3,5</a>)</p></blockquote><p>성체성혈성사에 합당하지 않게 참여하여 많은 그리스도인이 병들고 약해지고 죽기까지 했습니다:</p><blockquote><p>“그러므로 <strong>너희 중에 약한 자와 병든 자가 많고</strong> 잠자는 자도 적지 아니하니” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/11/#L30">고전 11:30</a>)</p></blockquote><p>구약의 의인들도 병들었습니다:</p><blockquote><p>“이삭이 나이가 많아 <strong>눈이 어두워 잘 보지 못하더니</strong> 맏아들 에서를 불러 이르되 내 아들아 하매 그가 이르되 내가 여기 있나이다 하니” (<a href="https://bibleox.com/ko/ko-nkrv/gen/27/#L1">창 27:1</a>)</p></blockquote><h2>몸의 고난이 주는 유익</h2><h3>죄를 떠나는 데 도움이 됩니다</h3><blockquote><p>“그리스도께서 이미 육체의 고난을 받으셨으니 너희도 같은 마음으로 갑옷을 삼으라 이는 <strong>육체의 고난을 받은 자는 죄를 그쳤음이니</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1pet/4/#L1">벧전 4:1</a>)</p></blockquote><h3>교만을 막아 줍니다</h3><blockquote><p>“<strong>여러 계시를 받은 것이 지극히 크므로 너무 자만하지 않게 하시려고 내 육체에 가시 곧 사탄의 사자를 주셨으니 이는 나를 쳐서 너무 자만하지 않게 하려 하심이라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2kor/12/#L7">고후 12:7</a>)</p></blockquote><h3>정신을 차리게 합니다</h3><blockquote><p>“그때에야 그는 꺾여서 큰 교만을 버리기 시작했고, <strong>하느님의 채찍 아래 정신을 차리기 시작했다</strong>. 그는 순간순간 고통에 시달렸다” (<a href="https://bibleox.com/ko/gr-lxx-byz/2mak/9/#L11">2마카 9:11</a>, 그리스어에서 번역)</p></blockquote><h2>하느님께서는 병으로 벌하실 수 있습니다</h2><p>하느님께서는 불법과 죄 때문에 벌하실 수 있습니다:</p><blockquote><p>“너는 어찌하여 네 상처 때문에 부르짖느냐 <strong>네 고통이 심하도다</strong> <strong>네 악행이 많고 네 죄가 허다하므로 내가 이 일을 너에게 행하였느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ier/30/#L15">렘 30:15</a>)</p></blockquote><p>하느님께서는 모세를 비방한 미리암(아론과 모세의 누이)을 나병으로 벌하셨습니다:</p><blockquote><p>“그와는 내가 대면하여 명백히 말하고 은밀한 말로 하지 아니하며 그는 또 여호와의 형상을 보거늘 너희가 어찌하여 내 종 모세 비방하기를 두려워하지 아니하느냐 <strong>여호와께서 그들을 향하여 진노하시고</strong> 떠나시매 구름이 장막 위에서 떠나갔고 <strong>미리암은 나병에 걸려 눈과 같더라</strong> 아론이 미리암을 본즉 나병에 걸렸는지라” (<a href="https://bibleox.com/ko/ko-nkrv/chis/12/#L8-10">민 12:8-10</a>)</p></blockquote><p>이스라엘 백성이 하느님 섬기기를 떠나자 염병이 닥쳤습니다:</p><blockquote><p>“이스라엘이 바알브올에게 가담한지라 <strong>여호와께서 이스라엘에게 진노하시니라</strong> &lt;…&gt; <strong>그 염병으로 죽은 자가 이만 사천 명이었더라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/chis/25/#L3,9">민 25:3,9</a>)</p></blockquote><p>구세주께서는 죄를 병의 원인으로 가리키십니다:</p><blockquote><p>“그 후에 예수께서 성전에서 그 사람을 만나 이르시되 보라 <strong>네가 나았으니 더 심한 것이 생기지 않게 다시는 죄를 범하지 말라</strong> 하시니” (<a href="https://bibleox.com/ko/ko-nkrv/in/5/#L14">요 5:14</a>)</p></blockquote><p>하느님께서는 긍휼히 여기시어 병에서 지켜 주실 수도 있습니다:</p><blockquote><p>“이르시되 <strong>너희가 너희 하나님 나 여호와의 말을 들어 순종하고</strong> 내가 보기에 의를 행하며 내 계명에 귀를 기울이며 내 모든 규례를 지키면 내가 애굽 사람에게 내린 <strong>모든 질병 중 하나도 너희에게 내리지 아니하리니</strong> 나는 너희를 치료하는 여호와임이라” (<a href="https://bibleox.com/ko/ko-nkrv/ish/15/#L26">출 15:26</a>)</p></blockquote><h2>모든 병이 죄에서 오는 것은 아닙니다</h2><blockquote><p>“예수께서 길을 가실 때에 날 때부터 맹인 된 사람을 보신지라 제자들이 물어 이르되 랍비여 이 사람이 맹인으로 난 것이 누구의 죄로 인함이니이까 자기니이까 그의 부모니이까 예수께서 대답하시되 <strong>이 사람이나 그 부모의 죄로 인한 것이 아니라 그에게서 하나님이 하시는 일을 나타내고자 하심이라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/in/9/#L1-3">요 9:1-3</a>)</p></blockquote><p>참고: <a href="https://bibleox.com/ru/ru/w/медицина">의학</a>.</p><h2>디다케 — 1-2세기의 그리스도교 문헌</h2><blockquote><p>“너에게 일어나는 일은 무엇이든 좋은 것으로 받아들여라. 하느님 없이는 아무 일도 일어나지 않음을 알라.”</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/Didache/#HH-3">디다케 3장</a>, 그리스어에서 옮김)</p>'
