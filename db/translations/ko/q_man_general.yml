- src: 3QXG_Одежда
  path: Cl15t_옷
  title: 옷
  copy_cover: true
  body: <p>옷에 대해 구약에는 이런 금지가 있습니다:</p><blockquote><p>“<strong>여자는 남자의 의복을 입지 말 것이요 남자는 여자의 의복을 입지 말 것이라</strong> 이같이 하는 자는 네 하나님 여호와께 가증한 자이니라” (<a href="https://bibleox.com/ko/ko-nkrv/vtor/22/#L5">신 22:5</a>)</p></blockquote><p>이 금지는 분명히 <a href="https://bibleox.com/ru/ru/w/XBGN_Трансвестизм">도착</a>, 곧 사람이 일부러 반대 성처럼 보이려 하거나 비정상적인 상태에 있는 경우를 겨냥한 것입니다.</p><p>신약에는 머리를 가리는 것에 관한 말씀이 있습니다:</p><blockquote><p>“무릇 <strong>여자로서 머리에 쓴 것을 벗고 기도나 예언을 하는 자는</strong> 그 머리를 욕되게 하는 것이니 이는 머리를 민 것과 다름이 없음이라” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/11/#L5">고전 11:5</a>)</p></blockquote><p>오늘날 세상에는 여성용 바지를 비롯해 여자를 위한 여러 옷이 고안되었지만, 교회 전통은 교인들의 겉모습(단정해야 합니다)에 관해 몇 가지 규칙을 받아들였습니다. 여자들은 치마를 입고 머리를 가리고 화장은 되도록 적게 하고 오라고 권합니다. 남자들에게는 적당히 몸을 가리는 옷을 권합니다(반바지와 민소매 셔츠는 성당에 어울리지 않는 옷입니다). 이것은 하느님 앞에 단정하게 나타나기 위해서이며(속의 질서는 겉의 질서를 배제하지 않습니다), 또 기도하러 성당에 온 이웃들의 주의를 자극적인 겉모습으로 흐트러뜨리지 않기 위해서입니다.</p><p>전통을 지키는 데 이런저런 실제적인 어려움이 있을 때 여자들은 스카프 같은 것을 가져와서 성당에 들어가기 전에 바지 위에 두르기도 합니다.</p><p>어떤 교인들은 이 전통을 어긴 사람들에게 적절하지 않게 반응하기도 합니다. 그 사람들은 악의가 있어서가 아니라, 호기심으로 또는 기도하러 성당에 들어왔다가 이 전통을 몰랐을 뿐입니다. 그런 교인들에게는 사람들을 놀라게 하거나 쫓아내지 말고, 더구나 무례하게 대하지 말라고 당부합니다.</p>
