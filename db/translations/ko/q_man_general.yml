- src: христианин-раб-Бога
  path: Sv14g_하느님의_종인_그리스도인
  title: 그리스도인 — 하느님의 종
  copy_cover: true
  body: <p>그리스도인들은 자기를 하느님의 종, 글자 그대로는 노예(그리스어 δοῦλοι)라고 부릅니다. 그리스도 하느님의 뜻을 행하려 애쓰기 때문입니다. 그리스도인들은 그리스도를 섬기며, 그분의 종이고, 그분께 자기 뜻을 맡기며, 그것을 스스로 원해서 합니다. 그리스도는 그분의 종이 되는 것이 부끄럽지 않은 분이십니다. 세상을 지으신 분의 종이 되는 것도 부끄럽지 않습니다. 그리스도인들이 바라는 그리스도의 나라에서는 만왕의 왕의 순종하는 종이 되는 것이 오히려 영광입니다:</p><blockquote><p>“<strong><mark>주인이 와서 깨어 있는 것을 보면 그 종들은 복이 있으리로다</mark></strong> 내가 진실로 너희에게 이르노니 주인이 띠를 띠고 그 종들을 자리에 앉히고 나아와 <strong>수종들리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/lk/12/#L37">눅 12:37</a>)</p></blockquote><h2>그리스도께서는 우리에게 자신을 당신의 종이라고 부르라고 명하십니다</h2><blockquote><p>“이와 같이 너희도 명령 받은 것을 다 행한 후에 <strong><mark>이르기를 우리는 무익한 종이라</mark></strong> 우리가 하여야 할 일을 한 것뿐이라 할지니라” (<a href="https://bibleox.com/ko/ko-nkrv/lk/17/#L10">눅 17:10</a>)</p></blockquote><blockquote><p>“<strong>너희가 나를</strong> 선생이라 또는 <strong><mark>주라 하니 너희 말이 옳도다 내가 그러하다</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/in/13/#L13">요 13:13</a>)</p></blockquote><blockquote><p>“내가 너희에게 <strong>종이 주인보다 더 크지 못하다</strong> 한 말을 기억하라 사람들이 나를 박해하였은즉 너희도 박해할 것이요 내 말을 지켰은즉 너희 말도 지킬 것이라” (<a href="https://bibleox.com/ko/ko-nkrv/in/15/#L20">요 15:20</a>)</p></blockquote><h2>사도들은 그리스도의 종이 되라고 명합니다</h2><blockquote><p>“종들아 두려워하고 떨며 성실한 마음으로 육체의 상전에게 순종하기를 그리스도께 하듯 하라 눈가림만 하여 사람을 기쁘게 하는 자처럼 하지 말고 <strong>그리스도의 종들처럼</strong> 마음으로 하나님의 뜻을 행하고” (<a href="https://bibleox.com/ko/ko-nkrv/ef/6/#L5-6">엡 6:5-6</a>)</p></blockquote><blockquote><p>“<strong>주 안에서 부르심을 받은 자는 종이라도</strong> 주께 속한 자유인이요 또 그와 같이 자유인으로 있을 때에 부르심을 받은 자는 <strong>그리스도의 종이니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/7/#L22">고전 7:22</a>)</p></blockquote><blockquote><p>“너희는 자유가 있으나 그 자유로 악을 가리는 데 쓰지 말고 오직 <strong>하나님의 종과 같이 하라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1pet/2/#L16">벧전 2:16</a>)</p></blockquote><h2>사도들은 자기를 그리스도의 종이라고 부릅니다</h2><blockquote><p>“이제 내가 사람들에게 좋게 하랴 하나님께 좋게 하랴 사람들에게 기쁨을 구하랴 내가 지금까지 사람들의 기쁨을 구하였다면 <strong>그리스도의 종이 아니니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gal/1/#L10">갈 1:10</a>)</p></blockquote><blockquote><p>“<strong>하나님의 종이요 예수 그리스도의 사도인 나 바울이</strong> 사도 된 것은 하나님이 택하신 자들의 믿음과 경건함에 속한 진리의 지식과” (<a href="https://bibleox.com/ko/ko-nkrv/tit/1/#L1">딛 1:1</a>)</p></blockquote><blockquote><p>“<strong>예수 그리스도의 종이요 야고보의 형제인 유다는</strong> 부르심을 받은 자 곧 하나님 아버지 안에서 사랑을 얻고 예수 그리스도를 위하여 지키심을 받은 자들에게 편지하노라” (<a href="https://bibleox.com/ko/ko-nkrv/iud/1/#L1">유 1:1</a>)</p></blockquote><blockquote><p>“<strong>하나님과 주 예수 그리스도의 종 야고보는</strong> 흩어져 있는 열두 지파에게 문안하노라” (<a href="https://bibleox.com/ko/ko-nkrv/iak/1/#L1">약 1:1</a>)</p></blockquote><blockquote><p>“<strong>예수 그리스도의 종이며 사도인 시몬 베드로는</strong> 우리 하나님과 구주 예수 그리스도의 의를 힘입어 동일하게 보배로운 믿음을 우리와 함께 받은 자들에게 편지하노니” (<a href="https://bibleox.com/ko/ko-nkrv/2pet/1/#L1">벧후 1:1</a>)</p></blockquote><blockquote><p>“<strong>예수 그리스도의 종 바울은</strong> 사도로 부르심을 받아 하나님의 복음을 위하여 택정함을 입었으니” (<a href="https://bibleox.com/ko/ko-nkrv/rim/1/#L1">롬 1:1</a>)</p></blockquote><blockquote><p>“<strong>그리스도 예수의 종인 너희에게서 온 에바브라가</strong> 너희에게 문안하느니라 그가 항상 너희를 위하여 애써 기도하여 너희로 하나님의 모든 뜻 가운데서 완전하고 확신 있게 서기를 구하나니” (<a href="https://bibleox.com/ko/ko-nkrv/kol/4/#L12">골 4:12</a>)</p></blockquote><h2>하느님의 어머니께서는 자기를 주님의 여종이라고 부르십니다</h2><blockquote><p>“마리아가 이르되 <strong>주의 여종이오니</strong> 말씀대로 내게 이루어지이다 하매 천사가 떠나가니라” (<a href="https://bibleox.com/ko/ko-nkrv/lk/1/#L38">눅 1:38</a>)</p></blockquote><h2>구약에서 하느님께서는 믿는 이들을 당신의 종이라고 부르셨습니다</h2><blockquote><p>“이러므로 주 여호와께서 이와 같이 말씀하시니라 보라 <strong>나의 종들은 먹을 것이로되</strong> 너희는 주릴 것이니라 보라 나의 종들은 마실 것이로되 너희는 갈할 것이니라 보라 나의 종들은 기뻐할 것이로되 너희는 수치를 당할 것이니라 보라 <strong>나의 종들은 마음이 즐거우므로</strong> 노래할 것이로되 너희는 마음이 슬프므로 울며 심령이 상하므로 통곡할 것이며” (<a href="https://bibleox.com/ko/ko-nkrv/is/65/#L13-14">사 65:13-14</a>)</p></blockquote><blockquote><p>“내가 야곱에게서 씨를 내며 유다에게서 나의 산들을 기업으로 얻을 자를 내리니 내가 택한 자가 이를 기업으로 얻을 것이요 <strong>나의 종들이</strong> 거기에 살 것이라” (<a href="https://bibleox.com/ko/ko-nkrv/is/65/#L9">사 65:9</a>)</p></blockquote><h2>선지자들과 믿는 이들은 자기를 하느님의 종이라고 불렀습니다</h2><blockquote><p>“<strong>저는 당신의 종이며 당신 여종의 아들</strong>, 약하고 수명이 짧은 사람입니다” (<a href="https://bibleox.com/ko/gr-lxx-byz/prs/9/#L5">지혜 9:5</a>, 그리스어에서 번역)</p></blockquote><blockquote><p>“내가 그들에게 대답하여 이르되 하늘의 하나님이 우리를 형통하게 하시리니 <strong>그의 종들인 우리가</strong> 일어나 건축하려니와 오직 너희에게는 예루살렘에서 아무 기업도 없고 권리도 없고 기억되는 바도 없다 하였느니라” (<a href="https://bibleox.com/ko/ko-nkrv/neem/2/#L20">느 2:20</a>)</p></blockquote><blockquote><p>“<strong>이들은</strong> 주께서 일찍이 큰 권능과 강한 손으로 구속하신 <strong>주의 종들이요</strong> 주의 백성이니이다” (<a href="https://bibleox.com/ko/ko-nkrv/neem/1/#L10">느 1:10</a>)</p></blockquote><blockquote><p>“서원하여 이르되 만군의 여호와여 만일 <strong>주의 여종의 고통을</strong> 돌보시고 나를 기억하사 <strong>주의 여종을</strong> 잊지 아니하시고 주의 여종에게 아들을 주시면 내가 그의 평생에 그를 여호와께 드리고 삭도를 그의 머리에 대지 아니하겠나이다” (<a href="https://bibleox.com/ko/ko-nkrv/1ts/1/#L11">삼상 1:11</a>)</p></blockquote><blockquote><p>“주님의 <strong>종들아</strong>, 주님을 찬미하여라. 영원히 그분을 찬송하고 드높여라” (<a href="https://bibleox.com/ko/gr-lxx-byz/dan/3/#L85">단 3:85</a>, 그리스어에서 번역)</p></blockquote><blockquote><p>“그들은 우리에게 “<strong>우리는 하늘과 땅을 창조하신 주님의 종들이다</strong>” 하고 대답하였다” (<a href="https://bibleox.com/ko/gr-lxx-byz/2ezd/6/#L12">1에스 6:12</a>, 그리스어에서 번역) <em>(러시아어 성경에서는 6:13.)</em></p></blockquote><h2>자기 주인을 사랑한 종들도 있었습니다</h2><blockquote><p>“그를 놓아 자유하게 할 때에는 빈 손으로 가게 하지 말고 &lt;…&gt; <strong>종이 만일 너와 네 집을 사랑하므로 너와 동거하기를 좋게 여겨 네게 향하여 내가 주인을 떠나지 아니하겠노라 하거든</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/vtor/15/#L13,16">신 15:13,16</a>)</p></blockquote>
