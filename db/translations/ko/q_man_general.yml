- src: Исцеления
  path: Hl13g_치유
  title: 치유
  copy_cover: true
  body: <h2>유해를 통해</h2><blockquote><p>“마침 사람을 장사하는 자들이 그 도적 떼를 보고 그의 시체를 엘리사의 묘실에 들이던지매 시체가 <strong>엘리사의 뼈에</strong> 닿자 곧 회생하여 일어섰더라” (<a href="https://bibleox.com/ko/ko-nkrv/4ts/13/#L21">왕하 13:21</a>)</p></blockquote><h2>물을 통해</h2><blockquote><p>“이는 <strong>천사가 가끔 못에 내려와</strong> <strong><mark>물을 움직이게 하는데 움직인 후에 먼저 들어가는 자는 어떤 병에 걸렸든지 낫게 됨이러라</mark></strong>]” (<a href="https://bibleox.com/ko/ko-nkrv/in/5/#L4">요 5:4</a>) <em>(개역개정은 3절 끝부분과 이 절을 대괄호 안에 넣었습니다. 대괄호는 일부 고대 사본에 없는 본문이라는 표시입니다. 비잔틴 본문(다수 사본)에는 이 절이 있습니다.)</em></p></blockquote><h2>옷을 통해</h2><blockquote><p>“심지어 사람들이 <strong>바울의 몸에서 손수건이나 앞치마를 가져다가</strong> 병든 사람에게 얹으면 그 병이 떠나고 악귀도 나가더라” (<a href="https://bibleox.com/ko/ko-nkrv/act/19/#L12">행 19:12</a>)</p></blockquote><h2>사도의 모습(그림자)을 통해</h2><blockquote><p>“심지어 <strong>병든 사람을 메고 거리에 나가</strong> 침대와 요 위에 누이고 <strong>베드로가 지날 때에 혹 그의 그림자라도 누구에게 덮일까 바라고</strong> 예루살렘 부근의 수많은 사람들도 모여 병든 사람과 더러운 귀신에게 괴로움 받는 사람을 데리고 와서 <strong>다 나음을 얻으니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/act/5/#L15-16">행 5:15-16</a>)</p></blockquote><h2>하느님의 말씀으로 직접</h2><blockquote><p>“그러므로 내가 주께 나아가기도 감당하지 못할 줄을 알았나이다 <strong>말씀만 하사 내 하인을 낫게 하소서</strong> &lt;…&gt; 보내었던 사람들이 집으로 돌아가 보매 종이 이미 나아 있었더라” (<a href="https://bibleox.com/ko/ko-nkrv/lk/7/#L7,10">눅 7:7,10</a>)</p></blockquote><h2>물건을 통한 은총의 작용</h2><blockquote><p>“<strong>지팡이를</strong> 들고 손을 바다 위로 내밀어 그것이 갈라지게 하라 이스라엘 자손이 바다 가운데서 마른 땅으로 행하리라” (<a href="https://bibleox.com/ko/ko-nkrv/ish/14/#L16">출 14:16</a>)</p></blockquote>
