- src: человек-образ-Бога
  path: Im4g_하느님의_형상인_사람
  title: 사람 — 하느님의 형상
  copy_cover: true
  body: '<h2>사람은 하느님의 형상과 모양으로 계획되었습니다:</h2><blockquote><p>“하나님이 이르시되 <strong>우리의 형상을 따라</strong> <strong>우리의 모양대로</strong> 우리가 사람을 만들고 그들로 바다의 물고기와 하늘의 새와 가축과 온 땅과 땅에 기는 모든 것을 다스리게 하자 하시고” (<a href="https://bibleox.com/ko/ko-nkrv/gen/1/#L26">창 1:26</a>)</p></blockquote><p>그러나 사람은 형상대로만 창조되었습니다:</p><blockquote><p>“하나님이 <strong>자기 형상 곧 하나님의 형상대로 사람을 창조하시되</strong> 남자와 여자를 창조하시고” (<a href="https://bibleox.com/ko/ko-nkrv/gen/1/#L27">창 1:27</a>)</p></blockquote><blockquote><p>“이것은 아담의 계보를 적은 책이니라 하나님이 사람을 창조하실 때에 <strong>하나님의 모양대로 지으시되</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gen/5/#L1">창 5:1</a>) <em>(교회 슬라브어 본문이 따르는 칠십인역(창 5:1): κατ᾿ εἰκόνα θεοῦ ἐποίησεν αὐτόν, “하느님의 <strong>형상</strong>대로 그를 지으셨다”.)</em></p></blockquote><blockquote><p>“다른 사람의 피를 흘리면 그 사람의 피도 흘릴 것이니 이는 <strong>하나님이 자기 형상대로 사람을 지으셨음이니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gen/9/#L6">창 9:6</a>)</p></blockquote><h3>사람 안의 하느님의 형상</h3><p>영원한 존재:</p><blockquote><p>“하느님께서는 사람을 썩지 않게 창조하시고 <strong>당신 영원성의 형상으로</strong> 그를 만드셨다” (<a href="https://bibleox.com/ko/gr-lxx-byz/prs/2/#L23">지혜 2:23</a>, 그리스어에서 번역)</p></blockquote><h3>사람 안의 하느님의 모양</h3><p>사람은 하느님을 닮도록 부름받았을 뿐입니다:</p><blockquote><p>“나는 마음이 온유하고 겸손하니 나의 멍에를 메고 <strong>내게 배우라</strong> 그리하면 <strong>너희 마음이 쉼을 얻으리니</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/11/#L29">마 11:29</a>)</p></blockquote><blockquote><p>“하나님이 미리 아신 자들을 또한 <strong>그 아들의 형상을 본받게 하기 위하여</strong> 미리 정하셨으니 이는 그로 많은 형제 중에서 맏아들이 되게 하려 하심이니라” (<a href="https://bibleox.com/ko/ko-nkrv/rim/8/#L29">롬 8:29</a>)</p></blockquote>'
