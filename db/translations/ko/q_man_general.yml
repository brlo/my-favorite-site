- src: человек-труд
  path: Wk8l_노동
  title: 노동
  copy_cover: true
  body: <blockquote><p>“네가 흙으로 돌아갈 때까지 <strong><mark>얼굴에 땀을 흘려야 먹을 것을 먹으리니</mark></strong> 네가 그것에서 취함을 입었음이라 너는 흙이니 흙으로 돌아갈 것이니라 하시니라” (<a href="https://bibleox.com/ko/ko-nkrv/gen/3/#L19">창 3:19</a>)</p></blockquote><blockquote><p>“너희가 온 마게도냐 모든 형제에 대하여 과연 이것을 행하도다 형제들아 <strong><mark>권하노니</mark></strong> 더욱 그렇게 행하고 또 <strong><mark>너희에게 명한 것 같이 조용히 자기 일을 하고 너희 손으로 일하기를 힘쓰라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1sol/4/#L10-11">살전 4:10-11</a>)</p></blockquote><blockquote><p>“그 후에 <strong>바울이</strong> 아덴을 떠나 고린도에 이르러 &lt;…&gt; <strong>생업이 같으므로</strong> 함께 살며 일을 하니 <strong><mark>그 생업은 천막을 만드는 것이더라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/act/18/#L1,3">행 18:1,3</a>)</p></blockquote><blockquote><p>“바로 이 시각까지 우리가 주리고 목마르며 헐벗고 매맞으며 정처가 없고 또 <strong><mark>수고하여 친히 손으로 일을 하며</mark></strong> 모욕을 당한즉 축복하고 박해를 받은즉 참고” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/4/#L11-12">고전 4:11-12</a>)</p></blockquote><blockquote><p>“도둑질하는 자는 다시 도둑질하지 말고 돌이켜 가난한 자에게 구제할 수 있도록 <strong><mark>자기 손으로 수고하여 선한 일을 하라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ef/4/#L28">엡 4:28</a>)</p></blockquote><blockquote><p>“<strong>내가 아무의 은이나 금이나 의복을 탐하지 아니하였고</strong> 여러분이 아는 바와 같이 <strong><mark>이 손으로 나와 내 동행들이 쓰는 것을 충당하여</mark></strong> 범사에 여러분에게 모본을 보여준 바와 같이 수고하여 약한 사람들을 돕고 또 주 예수께서 친히 말씀하신 바 주는 것이 받는 것보다 복이 있다 하심을 기억하여야 할지니라” (<a href="https://bibleox.com/ko/ko-nkrv/act/20/#L33-35">행 20:33-35</a>)</p></blockquote><blockquote><p>“우리의 권면은 간사함이나 부정에서 난 것이 아니요 속임수로 하는 것도 아니라 &lt;…&gt; 너희도 알거니와 우리가 아무 때에도 아첨하는 말이나 <strong>탐심의 탈을 쓰지 아니한 것을</strong> 하나님이 증언하시느니라 &lt;…&gt; 형제들아 우리의 수고와 애쓴 것을 너희가 기억하리니 <strong><mark>너희 아무에게도 폐를 끼치지 아니하려고 밤낮으로 일하면서</mark></strong> 너희에게 하나님의 복음을 전하였노라” (<a href="https://bibleox.com/ko/ko-nkrv/1sol/2/#L3,5,9">살전 2:3,5,9</a>)</p></blockquote><blockquote><p>“<strong><mark>누구에게서든지 음식을 값없이 먹지 않고 오직 수고하고 애써 주야로 일함은 너희 아무에게도 폐를 끼치지 아니하려 함이니</mark></strong> 우리에게 권리가 없는 것이 아니요 오직 스스로 너희에게 본을 보여 우리를 본받게 하려 함이니라 우리가 너희와 함께 있을 때에도 너희에게 명하기를 <strong>누구든지 일하기 싫어하거든 먹지도 말게 하라</strong> 하였더니” (<a href="https://bibleox.com/ko/ko-nkrv/2sol/3/#L8-10">살후 3:8-10</a>)</p></blockquote><blockquote><p>“<strong>힘든 일을 미워하지 말라</strong>. 지극히 높으신 분께서 지으신 농사일도 그러하다” (<a href="https://bibleox.com/ko/gr-lxx-byz/prsir/7/#L15">집회 7:15</a>, 그리스어에서 번역)</p></blockquote><blockquote><p>“<strong>일하며 모든 것이 넉넉한 이가</strong>, 뽐내며 다니면서 빵이 모자란 이보다 <strong>낫다</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/prsir/10/#L27">집회 10:27</a>, 그리스어에서 번역)</p></blockquote><blockquote><p>“그가 게으르지 않도록 일을 시켜라. <strong>게으름은 많은 악을 가르친다</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/prsir/33/#L28-29">집회 33:28-29</a>, 그리스어에서 번역)</p></blockquote><blockquote><p>“내가 <strong>게으른 자의</strong> 밭과 지혜 없는 자의 포도원을 지나며 본즉 가시덤불이 그 전부에 퍼졌으며 그 지면이 거친 풀로 덮였고 돌담이 무너져 있기로” (<a href="https://bibleox.com/ko/ko-nkrv/pr/24/#L30-31">잠 24:30-31</a>)</p></blockquote>
