- src: расы-и-народы
  path: Rn6p_인종과_민족
  title: 인종과 민족
  copy_cover: true
  body: '<p>처음에 하느님께서는 아담을 창조하셨습니다:</p><blockquote><p>“<strong>여호와 하나님이 땅의 흙으로 사람을 지으시고</strong> 생기를 그 코에 불어넣으시니 사람이 생령이 되니라” (<a href="https://bibleox.com/ko/ko-nkrv/gen/2/#L7">창 2:7</a>)</p></blockquote><p>그다음 아담의 갈빗대로 하와를 창조하셨습니다:</p><blockquote><p>“아담이 모든 가축과 공중의 새와 들의 모든 짐승에게 이름을 주니라 <strong>아담이 돕는 배필이 없으므로</strong> 여호와 하나님이 아담을 깊이 잠들게 하시니 잠들매 그가 그 갈빗대 하나를 취하고 살로 대신 채우시고 여호와 하나님이 <strong>아담에게서 취하신 그 갈빗대로 여자를 만드시고</strong> 그를 아담에게로 이끌어 오시니” (<a href="https://bibleox.com/ko/ko-nkrv/gen/2/#L20-22">창 2:20-22</a>)</p></blockquote><p>아담에게서 많은 자녀가 태어났습니다:</p><blockquote><p>“아담은 <strong>셋을 낳은 후</strong> 팔백 년을 지내며 <strong>자녀들을 낳았으며</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gen/5/#L4">창 5:4</a>)</p></blockquote><p>셋 뒤에도(곧 이미 세 아들이 태어난 뒤에도: <a href="https://bibleox.com/ko/ko-nkrv/gen/4/#L1">창 4:1</a>, <a href="https://bibleox.com/ko/ko-nkrv/gen/4/#L2">창 4:2</a>, <a href="https://bibleox.com/ko/ko-nkrv/gen/4/#L25">창 4:25</a>) 아들딸이 더 태어났습니다. 그러나 창세기 저자는 그들에게 더 주의를 기울이지 않습니다. 그의 눈길은 독자에게 중요하다고 여기는 이야기의 세부에만 향하기 때문입니다. 이어서 가인과 셋에게서 (유대 전통에 따라) 아버지 쪽으로 이어지는 몇몇 계보만 나열됩니다. 가인에게서는 악기를 만든 이(<a href="https://bibleox.com/ko/ko-nkrv/gen/4/#L21">창 4:21</a>), 무기를 만든 이(<a href="https://bibleox.com/ko/ko-nkrv/gen/4/#L22">창 4:22</a>), 일부다처의 시작(<a href="https://bibleox.com/ko/ko-nkrv/gen/4/#L19">창 4:19</a>)으로 이어지는 계보가 언급됩니다. 셋에게서 노아까지의 조상 가운데 몇이 나열됩니다(<a href="https://bibleox.com/ko/ko-nkrv/gen/5/#L6-29">창 5:6-29</a>). 셋은 많은 아들딸을 낳았지만(<a href="https://bibleox.com/ko/ko-nkrv/gen/5/#L7">창 5:7</a>) 그 가운데 에노스 한 사람만 언급됩니다(<a href="https://bibleox.com/ko/ko-nkrv/gen/4/#L26">창 4:26</a>). 나머지도 마찬가지입니다. 그 뒤 사람들은 번성하고 하느님을 잊으며, 먼저 죄에, 그다음 홍수의 물에 빠집니다. 노아의 가족 말고는 모든 사람이 죽습니다. 이제 모든 인종은 바로 노아의 가족에게서 나옵니다(<a href="https://bibleox.com/ko/ko-nkrv/gen/9/#L19">창 9:19</a>). 노아는 셈과 함과 야벳을 낳았습니다:</p><blockquote><p>“노아는 오백 세 된 후에 셈과 함과 야벳을 낳았더라” (<a href="https://bibleox.com/ko/ko-nkrv/gen/5/#L32">창 5:32</a>)</p></blockquote><blockquote><p>“세 아들을 낳았으니 셈과 함과 야벳이라” (<a href="https://bibleox.com/ko/ko-nkrv/gen/6/#L10">창 6:10</a>)</p></blockquote><blockquote><p>“곧 그 날에 노아와 그의 아들 셈, 함, 야벳과 노아의 아내와 세 며느리가 다 방주로 들어갔고” (<a href="https://bibleox.com/ko/ko-nkrv/gen/7/#L13">창 7:13</a>)</p></blockquote><blockquote><p>“방주에서 나온 노아의 아들들은 셈과 함과 야벳이며 함은 가나안의 아버지라” (<a href="https://bibleox.com/ko/ko-nkrv/gen/9/#L18">창 9:18</a>)</p></blockquote><p>함:</p><blockquote><p>“함의 아들은 구스와 미스라임과 붓과 가나안이요” (<a href="https://bibleox.com/ko/ko-nkrv/gen/10/#L6">창 10:6</a>)</p></blockquote><blockquote><p>“함의 자손은 구스와 미스라임과 붓과 가나안이요” (<a href="https://bibleox.com/ko/ko-nkrv/1par/1/#L8">대상 1:8</a>)</p></blockquote><p><strong>구스</strong> — 에티오피아(흑인), <strong>미스라임</strong> — 애굽(가무잡잡한 피부), <strong>붓</strong> — 리비아(백인), <strong>가나안</strong> — 비옥한 초승달 지대 서쪽(흑인이 아님). 노아가 저주한 이가 바로 가나안입니다(<a href="https://bibleox.com/ko/ko-nkrv/gen/9/#L25,27">창 9:25,27</a>). 수메르인(흑인이 아님)도 구스의 후손(니므롯 — <a href="https://bibleox.com/ko/ko-nkrv/gen/10/#L8">창 10:8</a>)에게서 나왔습니다. [<a href="https://www.youtube.com/watch?v=JPGyRZqSZkY">자세한 분석(러시아어)</a>] <strong>참고</strong>: 아담의 아들들은 자기 누이들을 아내로 맞았습니다. 번성하라는 하느님의 명령을 이룰 다른 길이 없었습니다. 더구나 노아의 손자들에게도 비슷한 상황이 생겼습니다. 홍수 뒤에 땅 위의 모든 사람은 가장 가까운 친족이었습니다. 근친혼은 훨씬 뒤에 선지자 모세 때에 금지됩니다. 유대 백성은 오누이인 아브라함과 사라에게서 나왔습니다(<a href="https://bibleox.com/ko/ko-nkrv/gen/20/#L12">창 20:12</a>). 이 글의 나머지는 아직 손볼 곳이 있습니다. 성경에 나오는 여러 민족과 인종의 조상에 관한 정보를 더 서술해야 합니다.</p>'
  title_sub: 인종과 민족에 관한 성경 구절
  meta_desc: 인류와 인종과 민족의 기원에 관한 성경 구절
