  title: 빚지고 사는 삶(신용)
  copy_cover: true
  body: <blockquote><p>“부자는 가난한 자를 주관하고 <strong><mark>빚진 자는 채주의 종이 되느니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/pr/22/#L7">잠 22:7</a>)</p></blockquote><blockquote><p>“너는 사람과 더불어 손을 잡지 말며 남의 빚에 보증을 서지 말라 <strong><mark>만일 갚을 것이 네게 없으면 네 누운 침상도 빼앗길 것이라</mark></strong> 네가 어찌 그리하겠느냐” (<a href="https://bibleox.com/ko/ko-nkrv/pr/22/#L26-27">잠 22:26-27</a>)</p></blockquote><blockquote><p>“그러나 <strong>자족하는 마음이 있으면 경건은 큰 이익이 되느니라</strong> 우리가 세상에 아무 것도 가지고 온 것이 없으매 또한 아무 것도 가지고 가지 못하리니 <strong><mark>우리가 먹을 것과 입을 것이 있은즉 족한 줄로 알 것이니라</mark></strong> 부하려 하는 자들은 시험과 올무와 여러 가지 어리석고 해로운 욕심에 떨어지나니 곧 사람으로 파멸과 멸망에 빠지게 하는 것이라 <strong><mark>돈을 사랑함이 일만 악의 뿌리가 되나니</mark></strong> 이것을 탐내는 자들은 미혹을 받아 믿음에서 떠나 많은 근심으로써 자기를 찔렀도다” (<a href="https://bibleox.com/ko/ko-nkrv/1tim/6/#L6-10">딤전 6:6-10</a>)</p></blockquote><blockquote><p>“돈을 사랑하지 말고 <strong><mark>있는 바를 족한 줄로 알라</mark></strong> 그가 친히 말씀하시기를 내가 결코 너희를 버리지 아니하고 너희를 떠나지 아니하리라 하셨느니라” (<a href="https://bibleox.com/ko/ko-nkrv/evr/13/#L5">히 13:5</a>)</p></blockquote>
