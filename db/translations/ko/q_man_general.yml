- src: человек-храм-Божий
  path: Tm5g_하느님의_성전인_사람
  title: 사람 — 하느님의 성전
  copy_cover: true
  body: <blockquote><p>“<strong>너희 몸은 너희가 하나님께로부터 받은 바 너희 가운데 계신 성령의 전인 줄을</strong> 알지 못하느냐 너희는 너희 자신의 것이 아니라” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/6/#L19">고전 6:19</a>)</p></blockquote><blockquote><p>“누구든지 하나님의 성전을 더럽히면 하나님이 그 사람을 멸하시리라 하나님의 성전은 거룩하니 <strong>너희도 그러하니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/3/#L17">고전 3:17</a>)</p></blockquote><blockquote><p>“너희는 <strong>너희가 하나님의 성전인 것과</strong> 하나님의 성령이 너희 안에 계시는 것을 알지 못하느냐” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/3/#L16">고전 3:16</a>)</p></blockquote><blockquote><p>“하나님의 성전과 우상이 어찌 일치가 되리요 <strong>우리는 살아 계신 하나님의 성전이라</strong> 이와 같이 하나님께서 이르시되 <strong>내가 그들 가운데 거하며 두루 행하여</strong> 나는 그들의 하나님이 되고 그들은 나의 백성이 되리라” (<a href="https://bibleox.com/ko/ko-nkrv/2kor/6/#L16">고후 6:16</a>)</p></blockquote><blockquote><p>“유대인들이 이르되 이 성전은 사십육 년 동안에 지었거늘 네가 삼 일 동안에 일으키겠느냐 하더라 그러나 예수는 <strong>성전된 자기 육체를</strong> 가리켜 말씀하신 것이라” (<a href="https://bibleox.com/ko/ko-nkrv/in/2/#L20-21">요 2:20-21</a>)</p></blockquote><blockquote><p>“그리스도는 하나님의 집을 맡은 아들로서 그와 같이 하셨으니 우리가 소망의 확신과 자랑을 끝까지 굳게 잡고 있으면 <strong>우리는 그의 집이라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/evr/3/#L6">히 3:6</a>)</p></blockquote><blockquote><p>“그의 안에서 건물마다 서로 연결하여 주 안에서 성전이 되어 가고 <strong>너희도 성령 안에서 하나님이 거하실 처소가 되기 위하여 그리스도 예수 안에서 함께 지어져 가느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ef/2/#L21-22">엡 2:21-22</a>)</p></blockquote>
