- src: все-люди-грешны
  path: As12n_모든_사람은_죄인입니다
  title: 모든 사람은 죄인입니다
  copy_cover: true
  body: <p><strong>원죄</strong>란:</p><p>1) 아담과 하와의 조상의 죄.</p><p>2) 사람 본성의 손상. 이제 본성은 죄스러운 생각과 말과 행위에 끌립니다(악은 하고 싶고, 선을 행하려면 의지의 노력이 필요합니다). 이 상태는 태어날 때 후손에게 전해집니다. 주 예수 그리스도를 빼고 모두에게 그렇습니다.</p><h2>모든 사람은 잉태될 때부터 첫 조상(아담과 하와)에게서 죄성을 물려받습니다</h2><blockquote><p>“누가 깨끗한 것을 더러운 것 가운데에서 낼 수 있으리이까 <strong>하나도 없나이다</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/iov/14/#L4">욥 14:4</a>)</p></blockquote><blockquote><p>“그러면 어떠하냐 우리는 나으냐 결코 아니라 유대인이나 헬라인이나 <strong>다 죄 아래에 있다고</strong> 우리가 이미 선언하였느니라 기록된 바 <strong>의인은 없나니 하나도 없으며</strong> 깨닫는 자도 없고 하나님을 찾는 자도 없고 다 치우쳐 함께 무익하게 되고 선을 행하는 자는 없나니 하나도 없도다” (<a href="https://bibleox.com/ko/ko-nkrv/rim/3/#L9-12">롬 3:9-12</a>)</p></blockquote><blockquote><p>“<strong>모든 사람이 죄를 범하였으매</strong> 하나님의 영광에 이르지 못하더니” (<a href="https://bibleox.com/ko/ko-nkrv/rim/3/#L23">롬 3:23</a>)</p></blockquote><blockquote><p>“그러므로 <strong>한 사람으로 말미암아 죄가 세상에 들어오고</strong> 죄로 말미암아 사망이 들어왔나니 이와 같이 <strong>모든 사람이 죄를 지었으므로 사망이 모든 사람에게 이르렀느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/rim/5/#L12">롬 5:12</a>)</p></blockquote><blockquote><p>“<strong>한 사람이 순종하지 아니함으로 많은 사람이 죄인 된 것 같이</strong> 한 사람이 순종하심으로 많은 사람이 의인이 되리라” (<a href="https://bibleox.com/ko/ko-nkrv/rim/5/#L19">롬 5:19</a>)</p></blockquote><blockquote><p>“우리가 율법은 신령한 줄 알거니와 <strong>나는 육신에 속하여 죄 아래에 팔렸도다</strong> &lt;…&gt; 내 속사람으로는 하나님의 법을 즐거워하되 <strong>내 지체 속에서 한 다른 법이 내 마음의 법과 싸워</strong> 내 지체 속에 있는 <strong>죄의 법으로 나를 사로잡는 것을</strong> 보는도다” (<a href="https://bibleox.com/ko/ko-nkrv/rim/7/#L14,22-23">롬 7:14,22-23</a>)</p></blockquote><blockquote><p>“전에는 <strong>우리도 다</strong> 그 가운데서 우리 육체의 욕심을 따라 지내며 육체와 마음의 원하는 것을 하여 다른 이들과 같이 <strong>본질상 진노의 자녀이었더니</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ef/2/#L3">엡 2:3</a>)</p></blockquote><blockquote><p>“내가 죄악 중에서 출생하였음이여 <strong>어머니가 죄 중에서 나를 잉태하였나이다</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ps/51/#L5">시 51:5</a>)</p></blockquote><blockquote><p>“<strong>만물보다 거짓되고 심히 부패한 것은 마음이라</strong> 누가 능히 이를 알리요마는” (<a href="https://bibleox.com/ko/ko-nkrv/ier/17/#L9">렘 17:9</a>)</p></blockquote><h2>자라면서 모든 사람은 자기 죄성도 얻습니다</h2><blockquote><p>“선을 행하고 <strong>전혀 죄를 범하지 아니하는 의인은 세상에 없기 때문이로다</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ekl/7/#L20">전 7:20</a>)</p></blockquote><blockquote><p>“참으로 <strong>태어난 이들 가운데 악하게 행하지 않은 사람은 하나도 없고</strong>, 존재한 이들 가운데 잘못하지 않은 사람은 하나도 없습니다” (<a href="https://bibleox.com/ko/en-nrsv/3ezd/8/#L35">3에스 8:35</a>, 영어 번역(NRSV)에서 옮김) <em>(에스드라 2서(러시아어 성경의 에스드라 3서). 개역개정에는 이 책이 없습니다.)</em></p></blockquote><blockquote><p>“<strong>만일 우리가 죄가 없다고 말하면 스스로 속이고</strong> 또 진리가 우리 속에 있지 아니할 것이요” (<a href="https://bibleox.com/ko/ko-nkrv/1in/1/#L8">요일 1:8</a>)</p></blockquote><blockquote><p>“<strong>주께 범죄하지 아니하는 사람이 없사오니</strong> 그들이 주께 범죄하므로 주께서 그들에게 진노하사 그들을 적국에게 넘기시매 적국이 그들을 사로잡아 땅의 원근을 막론하고 끌고 간 후에” (<a href="https://bibleox.com/ko/ko-nkrv/2par/6/#L36">대하 6:36</a>)</p></blockquote><blockquote><p>“그럴 수 없느니라 <strong>사람은 다 거짓되되</strong> 오직 하나님은 참되시다 할지어다 기록된 바 주께서 주의 말씀에 의롭다 함을 얻으시고 판단 받으실 때에 이기려 하심이라 함과 같으니라” (<a href="https://bibleox.com/ko/ko-nkrv/rim/3/#L4">롬 3:4</a>)</p></blockquote><blockquote><p>“기록된 바 <strong>의인은 없나니 하나도 없으며</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/rim/3/#L10">롬 3:10</a>)</p></blockquote><blockquote><p>“그러나 <strong>성경이 모든 것을 죄 아래에 가두었으니</strong> 이는 예수 그리스도를 믿음으로 말미암는 약속을 믿는 자들에게 주려 함이라” (<a href="https://bibleox.com/ko/ko-nkrv/gal/3/#L22">갈 3:22</a>)</p></blockquote><h2>하느님께서는 회개하고 고치라고 부르십니다</h2><blockquote><p>“알지 못하던 시대에는 하나님이 간과하셨거니와 <strong><mark>이제는 어디든지 사람에게 다 명하사 회개하라 하셨으니</mark></strong> 이는 정하신 사람으로 하여금 천하를 공의로 심판할 날을 작정하시고 이에 그를 죽은 자 가운데서 다시 살리신 것으로 모든 사람에게 믿을 만한 증거를 주셨음이니라 하니라” (<a href="https://bibleox.com/ko/ko-nkrv/act/17/#L30-31">행 17:30-31</a>)</p></blockquote><blockquote><p>“베드로가 이르되 <strong><mark>너희가 회개하여 각각 예수 그리스도의 이름으로 세례를 받고 죄 사함을 받으라</mark></strong> 그리하면 성령의 선물을 받으리니” (<a href="https://bibleox.com/ko/ko-nkrv/act/2/#L38">행 2:38</a>)</p></blockquote><blockquote><p>“<strong><mark>믿고 세례를 받는 사람은 구원을 얻을 것이요</mark></strong> <strong><mark>믿지 않는 사람은 정죄를 받으리라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mk/16/#L16">막 16:16</a>)</p></blockquote><p>하느님께서는 2000년 전에 당신이 세우신 <a href="https://bibleox.com/ru/ru/w/Церковь">정교회</a>를 통해 구원으로 부르시며, <a href="https://bibleox.com/ru/ru/w/крещение">세례</a>로 그 교회에 들어갑니다.</p>
