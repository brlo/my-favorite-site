    body: |-
      <h2>0</h2><p>이그나티오스 곧 테오포로스[1]가, 아버지 하느님과 사랑하시는 예수 그리스도의 교회에 보냅니다. 이 교회는 모든 은사로 자비를 입었고, 믿음과 사랑으로 가득 차 있으며, 어떤 은사에도 모자람이 없고, 하느님께 가장 합당하며, 거룩한 것을 모신, 아시아의 스미르나에 있는 교회입니다. 흠 없는 영과 하느님의 말씀 안에서 진심으로 기쁨을 빕니다.</p>
      <h2>1</h2><p>1. 나는 여러분을 이토록 지혜롭게 해 주신 하느님이신 예수 그리스도께 영광을 드립니다. 나는 알았습니다. 여러분이 흔들리지 않는 믿음 안에서 온전해졌고, 육으로나 영으로나 주 예수 그리스도의 십자가에 못 박힌 듯하며, 그리스도의 피로 사랑 안에 굳게 서 있다는 것을 말입니다. 여러분은 우리 주님에 대하여 확신에 차 있습니다. 그분은 육으로는 참으로 다윗의 가문에서 나신 분[2]이시고, 하느님의 뜻과 능력으로는 하느님의 아들이시며, 참으로 동정녀에게서 태어나셨고, "의로운 일을 다 이루기 위하여"[3] 요한에게 세례를 받으셨습니다.</p><p>2. 그분은 본티오 빌라도와 영주 헤로데[4] 아래에서 우리를 위하여 육으로 참으로 못 박히셨습니다. 그 열매에서, 곧 하느님께 복을 받은 그분의 수난에서 우리가 태어났습니다. 그것은 그분께서 부활을 통하여, 유다인 가운데에서나 이방인 가운데에서나 당신의 거룩하고 믿음 깊은 사람들을 위하여, 당신 교회의 한 몸 안에[5], 영원히 깃발을 세우시려는 것이었습니다[6].</p>
      <h2>2</h2><p>그분은 우리가 구원받도록 우리를 위하여 이 모든 고난을 받으셨습니다. 그리고 참으로 고난을 받으셨듯이 참으로 당신 자신을 다시 살리셨습니다. 어떤 불신자들이 말하듯이 그분께서 겉보기로만 고난을 받으셨다[7]는 것이 아닙니다. 겉보기에 지나지 않는 것은 바로 그들 자신입니다. 그들이 생각하는 대로 그들에게 일어날 것입니다. 그들은 몸이 없는, 마귀 같은 존재가 될 것입니다.</p>
      <h2>3</h2><p>1. 나는 그분께서 부활하신 뒤에도 육신 안에 계셨다는 것을 알고 또 믿습니다.</p><p>2. 그분께서 베드로와 함께 있던 사람들에게 오셨을 때 그들에게 말씀하셨습니다. "나를 만져 보아라. 내가 몸이 없는 마귀가 아니라는 것을 알 것이다."[8] 그러자 그들은 곧 그분을 만져 보고 믿었으며, 그분의 육과 영에 굳게 결합되었습니다. 그 때문에 그들은 죽음도 가볍게 여겼고, 죽음을 넘어선 사람들로 드러났습니다.</p><p>3. 부활하신 뒤에 그분께서는 육신을 지니신 분으로서 그들과 함께 먹고 마셨습니다[9]. 영으로는 아버지와 하나이셨지만 말입니다.</p>
      <h2>4</h2><p>1. 사랑하는 여러분, 내가 이런 것들을 권하는 것은 여러분도 그러하다는 것을 알기 때문입니다. 그러나 나는 사람의 모습을 한 짐승들로부터 여러분을 미리 지켜 주고 싶습니다. 여러분은 그들을 받아들여서는 안 될 뿐 아니라, 할 수만 있다면 만나지도 말아야 합니다. 다만 그들을 위하여 기도하십시오. 어떻게든 그들이 회개하도록 말입니다. 그것은 어려운 일이지만, 우리의 참생명이신 예수 그리스도께서는 그 일을 하실 능력이 있으십니다.</p><p>2. 만일 이 일들이 우리 주님께서 겉보기로만 하신 것이라면, 내가 묶여 있는 것도 겉보기에 지나지 않을 것입니다. 왜 나는 나 자신을 죽음에, 불에, 칼에, 맹수에게 내맡겼겠습니까? 아닙니다. 칼에 가까이 있는 사람은 하느님께 가까이 있고, 맹수들 가운데 있는 사람은 하느님 가운데 있습니다. 다만 예수 그리스도의 이름 안에서라면 말입니다. 그분과 함께 고난을 받기 위하여 나는 모든 것을 견디고 있습니다. 완전한 사람이 되신 그분[10]께서 나에게 힘을 주십니다.</p>
      <h2>5</h2><p>1. 어떤 사람들은 알지 못하여 그분을 부인합니다. 아니, 오히려 그들이 그분에게서 부인당한 것입니다[11]. 그들은 진리의 변호인이 아니라 죽음의 변호인입니다. 예언도, 모세의 율법도, 지금까지 복음도, 우리 각자가 받는 고난도 그들을 설득하지 못했습니다.</p><p>2. 그들은 우리에 대해서도 같은 생각을 하고 있습니다[12]. 누가 나를 칭찬하면서 나의 주님께서 육신을 지니셨음을 인정하지 않고 그분을 모독한다면, 그것이 나에게 무슨 유익이 있겠습니까? 이렇게 말하는 사람은 그분을 완전히 부인한 것이며, 그 자신이 시체를 지닌 사람[13]입니다.</p><p>3. 그들의 이름은 믿음이 없는 것이므로 적지 않기로 했습니다. 그들이 수난—그것은 우리의 부활입니다—으로 회개하여 돌아올 때까지는 그들을 떠올리는 일조차 나에게 없기를 바랍니다.</p>
      <h2>6</h2><p>1. 아무도 속지 마십시오. 하늘의 것들도, 천사들의 영광도, 보이는 권세와 보이지 않는 권세도[14], 그리스도의 피를 믿지 않으면 그들에게도 심판이 있습니다. "받아들일 수 있는 사람은 받아들여라."[15] 지위 때문에 아무도 교만해져서는 안 됩니다. 모든 것은 믿음과 사랑이며, 이보다 앞서는 것은 아무것도 없습니다.</p><p>2. 우리에게 온 예수 그리스도의 은총에 대하여 다른 생각을 품은 자들을 잘 살펴보십시오. 그들이 하느님의 뜻에 얼마나 맞서고 있는지를 말입니다. 그들은 사랑에 관심이 없습니다. 과부에게도, 고아에게도, 괴로움을 당하는 사람에게도, 묶여 있는 사람이나 풀려난 사람에게도, 굶주린 사람이나 목마른 사람에게도 관심이 없습니다.</p>
      <h2>7</h2><p>1. 그들은 성찬(감사의 제사)과 기도를 멀리합니다. 성찬이 우리의 죄 때문에 고난을 받으시고 아버지께서 당신의 자애로 다시 살리신 우리 구세주 예수 그리스도의 살이라는 것을 인정하지 않기 때문입니다[16]. 이렇게 하느님의 선물에 반대하는 자들은 논쟁 속에서 죽어 갑니다. 그들이 애찬(아가페)을 지켰더라면[17] 그들에게 유익했을 것입니다. 그러면 그들도 부활했을 것입니다.</p><p>2. 이런 사람들을 멀리하고, 사사로이든 공공연히든 그들에 대하여 말하지 않는 것이 마땅합니다. 오히려 예언자들에게, 특히 복음에 마음을 기울이십시오. 복음 안에서 수난은 우리에게 밝혀졌고 부활은 완성되었습니다. 분열을 악의 시작으로 여겨 피하십시오.</p>
      <h2>8</h2><p>1. 예수 그리스도께서 아버지를 따르셨듯이 모두 주교를 따르십시오. 사도들을 따르듯이 사제단을 따르십시오. 보제들을 하느님의 계명처럼 존중하십시오. 주교를 제쳐 놓고 교회에 관한 일을 아무도 해서는 안 됩니다. 주교 아래에서, 또는 주교가 맡긴 사람이 거행하는 성찬만을 확실한 것으로 여기십시오.</p><p>2. 주교가 나타나는 곳에 회중도 있어야 합니다. 예수 그리스도께서 계신 곳에 보편 교회[18]가 있는 것과 같습니다. 주교를 제쳐 놓고 세례를 주거나 애찬(아가페)을 거행하는 것[19]은 허락되지 않습니다. 그러나 주교가 옳다고 인정하는 것은 하느님께서도 기뻐하시는 것입니다. 그것은 여러분이 하는 모든 일이 흔들림 없고 확실하게 하려는 것입니다.</p>
      <h2>9</h2><p>1. 아직 하느님께 회개할 때가 있는 동안 우리가 정신을 차리는 것은 이치에 맞는 일입니다. 하느님과 주교를 아는 것은 좋은 일입니다. 주교를 공경하는 사람은 하느님께 공경을 받고, 주교 몰래 무슨 일을 하는 사람은 악마를 섬기는 것입니다.</p><p>2. 그러므로 모든 것이 은총 안에서 여러분에게 넘치기를 바랍니다. 여러분은 그럴 자격이 있습니다. 여러분은 모든 면에서 나를 쉬게 해 주었습니다. 예수 그리스도께서도 여러분을 쉬게 해 주시기를 빕니다. 내가 없을 때에도 있을 때에도 여러분은 나를 사랑해 주었습니다. 하느님께서 여러분의 상급이십니다. 그분을 위하여 모든 것을 견디면 여러분은 그분께 이를 것입니다.</p>
      <h2>10</h2><p>1. 하느님의 말씀을 위하여 나를 따라온 필론과 레오스 아가토푸스를 하느님의 일꾼으로 맞아들인 것은 잘한 일입니다. 그들도 여러분이 모든 방법으로 그들을 쉬게 해 준 것에 대하여 여러분을 위해 주님께 감사드리고 있습니다. 여러분에게는 아무것도 헛되이 되지 않을 것입니다.</p><p>2. 나의 영과 나의 사슬은 여러분을 위하여 대신 바치는 목숨입니다[20]. 여러분은 이 사슬을 업신여기지도 부끄러워하지도 않았습니다[21]. 완전한 희망이신 예수 그리스도께서도 여러분을 부끄러워하지 않으실 것입니다.</p>
      <h2>11</h2><p>1. 여러분의 기도는 시리아의 안티오키아 교회에까지 이르렀습니다. 나는 그곳에서 하느님께 가장 합당한 사슬에 묶여 와서 모든 사람에게 문안합니다. 나는 그곳에 속할 자격도 없는, 그들 가운데 가장 보잘것없는 사람이지만, (하느님의) 뜻으로 합당한 사람이 되었습니다. 그것은 나의 양심 때문이 아니라 하느님의 은총 때문입니다. 이 은총이 나에게 완전히 주어져 여러분의 기도로 내가 하느님께 이르기를 바랍니다.</p><p>2. 그러므로 땅에서도 하늘에서도 여러분의 일이 완전해지도록, 여러분의 교회는 하느님의 영예를 위하여 하느님의 사절을 뽑아[22] 시리아로 보내서, 그들이 평화를 얻고 본래의 위대함을 되찾았으며 그들 자신의 몸(공동체)이 회복된 것을 함께 기뻐하게 하는 것이 마땅합니다.</p><p>3. 여러분 가운데 한 사람을 편지와 함께 보내어, 하느님께서 그들에게 주신 고요함을 함께 찬미하게 하는 것이 하느님께 합당한 일이라고 나는 생각했습니다. 여러분의 기도로 그들은 이미 항구에 이르렀습니다. 여러분은 완전한 사람들이니 완전한 것을 생각하십시오[23]. 여러분이 선을 행하고자 하면 하느님께서는 언제나 베풀어 주실 준비가 되어 계십니다.</p>
      <h2>12</h2><p>1. 트로아스에 있는 형제들의 사랑이 여러분에게 문안합니다. 나는 그 트로아스에서 부루스 편에 여러분에게 이 편지를 씁니다. 그는 여러분이 여러분의 형제인 에페소 사람들과 함께 나에게 딸려 보내 준 사람으로, 모든 면에서 나를 쉬게 해 주었습니다. 하느님을 섬기는 살아 있는 본보기인 그를 모두가 본받았으면 좋겠습니다. 은총이 모든 면에서 그에게 갚아 주기를 빕니다.</p><p>2. 나는 하느님께 합당한 주교와, 하느님께 합당한 사제단과, 나의 동료 종인 보제들과, 여러분 한 사람 한 사람과 모두에게, 예수 그리스도의 이름으로, 그분의 살과 피 안에서, 육과 영으로 겪으신 그분의 수난과 부활 안에서, 하느님과 여러분의 일치 안에서 문안합니다. 은총과 자비와 평화와 인내가 언제나 여러분에게 있기를 빕니다.</p>
      <h2>13</h2><p>1. 나는 나의 형제들의 가족에게 그 아내와 자녀들과 함께 문안합니다. 그리고 과부라고 불리는 동정녀들[24]에게도 문안합니다. 아버지의 능력 안에서 안녕히 계십시오. 나와 함께 있는 필론이 여러분에게 문안합니다.</p><p>2. 나는 타우이아의 집안에 문안합니다. 그가 육으로나 영으로나 믿음과 사랑 안에 굳게 서기를 기도합니다. 나에게 그리운 이름인 알케와, 비길 데 없는 다프노스와, 에우테크노스와, 모든 사람에게 이름을 불러 문안합니다. 하느님의 은총 안에서 안녕히 계십시오.</p>
    references: |-
      <ol><li><p>이그나티오스는 트로아스에서 보제 부루스 편에 이 편지를 스미르나로 보냈습니다(<a href="#HH-12">12:1</a>). 그리스도의 강생과 수난을 굳게 믿는 것을 칭찬한 뒤, 그리스도의 탄생과 수난과 부활의 진실을 부인하는 가현설주의자들을 물리치고(2–7장), 주교에게 순종하라고 권하며(8–9장), 끝으로 감사와 문안을 전합니다(10–13장).</p></li><li><p><a href="https://bibleox.com/ko/ko-ctb/rim/1/#L3-4">로마 1:3-4</a> 참조.</p></li><li><p><a href="https://bibleox.com/ko/ko-ctb/mf/3/#L15">마태 3:15</a> 참조.</p></li><li><p>갈릴래아의 영주 헤로데 안티파스(<a href="https://bibleox.com/ko/ko-ctb/lk/3/#L1">루가 3:1</a>, <a href="https://bibleox.com/ko/ko-ctb/lk/23/#L7">루가 23:7</a> 참조).</p></li><li><p><a href="https://bibleox.com/ko/ko-ctb/ef/2/#L16">에페 2:16</a> 참조.</p></li><li><p>σύσσημον — '깃발'. <a href="https://bibleox.com/ko/ko-ctb/is/49/#L22">이사 49:22</a> 참조. 십자가에 못 박히고 부활하신 그리스도께 민족들이 모여든다는 뜻입니다.</p></li><li><p>τὸ δοκεῖν — '겉보기'. <a href="https://bibleox.com/ko/ko/w/Ig2T_트랄레스교회에보낸편지#HH-10">「트랄레스 교회에 보낸 편지」 10장</a>의 주석 참조.</p></li><li><p><a href="https://bibleox.com/ko/ko-ctb/lk/24/#L39">루가 24:39</a> 참조. 이그나티오스는 이 말씀을 루가 복음서와 조금 다른 형태로 인용합니다. 구전에서 온 것이라고도 하고 외경 문헌에서 온 것이라고도 합니다(히에로니무스는 『나자렛 사람들의 복음서』를, 오리게네스는 『베드로의 가르침』을 듭니다).</p></li><li><p><a href="https://bibleox.com/ko/ko-ctb/lk/24/#L42-43">루가 24:42-43</a>, <a href="https://bibleox.com/ko/ko-ctb/act/10/#L41">사도 10:41</a> 참조.</p></li><li><p><a href="https://bibleox.com/ko/ko-ctb/ef/4/#L13">에페 4:13</a> 참조.</p></li><li><p><a href="https://bibleox.com/ko/ko-ctb/mf/10/#L33">마태 10:33</a> 참조.</p></li><li><p>우리의 고난(순교)도 겉보기에 지나지 않는다고 생각한다는 뜻입니다.</p></li><li><p>σαρκοφόρος '육신을 지닌'과 νεκροφόρος '시체를 지닌'을 엮은 말놀이입니다.</p></li><li><p>천사의 품계를 포함한 하늘의 권능을 말합니다.</p></li><li><p><a href="https://bibleox.com/ko/ko-ctb/mf/19/#L12">마태 19:12</a> 참조.</p></li><li><p>가현설주의자들은 성찬이 고난을 받으시고 아버지께서 다시 살리신 그리스도의 참된 살이라는 것을 인정하지 않았습니다. 성찬이 그리스도의 몸의 '상징'이라는 것이라면 누구나 받아들일 수 있습니다. 그들이 거부한 것은 그것이 참된 살이라는 사실입니다(<a href="https://bibleox.com/ko/ko-ctb/in/6/#L54">요한 6:54</a> 참조).</p></li><li><p>ἀγαπᾶν. 직역하면 '사랑하다'이지만, 여기서는 성찬과 결합된 '애찬(아가페)을 지키다'의 뜻으로 보았습니다. 문맥이 성찬에 관한 것이고, '그들도 부활하도록'이라는 목적은 주님의 살과 피를 받는 사람은 마지막 날에 다시 살아난다는 말씀(<a href="https://bibleox.com/ko/ko-ctb/in/6/#L54">요한 6:54</a>)과 맞닿아 있습니다. 또 같은 말이 <a href="#HH-8">8:2</a>에서는 주교의 허락 없이는 거행할 수 없는 애찬을 가리켜 쓰였습니다. 주교의 허락 없이는 '사랑할' 수 없다는 것은 말이 되지 않으므로, 거기서는 분명히 애찬을 뜻합니다.</p></li><li><p>ἡ καθολικὴ ἐκκλησία — '보편적인, 전체로서의 교회'. 남아 있는 문헌에서 이 표현이 쓰인 것은 이곳이 처음입니다. 니케아-콘스탄티노폴리스 신경의 '하나이고 거룩하고 보편되며 사도로부터 이어오는 교회'의 '보편된'이 같은 말입니다.</p></li><li><p>ἀγάπην ποιεῖν — '애찬(아가페)을 거행하다'. 당시 빵 나눔(성찬)과 결합되어 행해지던 교회의 공동 식사입니다.</p></li><li><p>ἀντίψυχον. <a href="https://bibleox.com/ko/ko/w/Ig2E_에페소교회에보낸편지#HH-21">「에페소 교회에 보낸 편지」 21:1</a>의 주석 참조.</p></li><li><p><a href="https://bibleox.com/ko/ko-ctb/2tim/1/#L16">2디모 1:16</a> 참조.</p></li><li><p>θεοπρεσβευτής — '하느님의 사절'. χειροτονῆσαι(뽑다)에 대해서는 <a href="https://bibleox.com/ko/ko/w/Ig2F_필라델피아교회에보낸편지#HH-10">「필라델피아 교회에 보낸 편지」 10:1</a>의 주석 참조.</p></li><li><p><a href="https://bibleox.com/ko/ko-ctb/fil/3/#L15">필립 3:15</a> 참조.</p></li><li><p>과부로 교회에 등록되어 봉사하던 여성들 가운데 동정녀도 있었음을 보여 줍니다(<a href="https://bibleox.com/ko/ko-ctb/1tim/5/#L3-10">1디모 5:3-10</a> 참조).</p></li></ol>
      <p>번역: 로디온 블라소프 (AI 도구 활용). 저본: 그리스어 원문(<a href="https://bibleox.com/ko/grc/w/ΙγνΘ_Σμ">이 사이트의 그리스어판</a>. 명백한 누락은 라이트풋판과 홈스판으로 보충함). 참고: 러시아어 번역(『초기 교부 선집』, 브뤼셀, 1988년), 영어 번역(Roberts–Donaldson), 프랑스어 번역(Genoude, 1837년). 성경 인용과 링크는 공동번역 성서에 따름.</p>
