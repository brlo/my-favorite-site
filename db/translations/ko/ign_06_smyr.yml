    title: 스미르나 교회에 보낸 편지
    meta_desc: 안티오키아의 성 이그나티오스(테오포로스)가 스미르나 교회에 보낸 편지. 그리스도의 강생과 성찬의 진실을 이야기한다. 그리스어 원문에서 번역하고 주석을 붙임.
