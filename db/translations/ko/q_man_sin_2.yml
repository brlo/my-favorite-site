  body: <h2>교회의 눈에 보이는 일치를 바라는 그리스도와 사도들의 뜻</h2><blockquote><p>“내가 <strong><mark>비옵는 것은</mark></strong> 이 사람들만 위함이 아니요 또 그들의 말로 말미암아 나를 믿는 사람들도 위함이니 아버지여, 아버지께서 내 안에, 내가 아버지 안에 있는 것 같이 <strong><mark>그들도 다 하나가 되어</mark></strong> <strong><mark>우리 안에 있게 하사 세상으로 아버지께서 나를 보내신 것을 믿게 하옵소서</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/in/17/#L20-21">요 17:20-21</a>)</p></blockquote><blockquote><p>“형제들아 내가 우리 주 예수 그리스도의 이름으로 너희를 <strong><mark>권하노니</mark></strong> <strong><mark>모두가 같은 말을 하고</mark></strong> <strong><mark>너희 가운데 분쟁이 없이</mark></strong> <strong><mark>같은 마음과 같은 뜻으로 온전히 합하라</mark></strong> 내 형제들아 글로에의 집 편으로 너희에 대한 말이 내게 들리니 곧 <strong>너희 가운데 분쟁이 있다는 것이라 내가 이것을 말하거니와 너희가 각각 이르되 나는 바울에게, 나는 아볼로에게, 나는 게바에게, 나는 그리스도에게 속한 자라 한다는 것이니 그리스도께서 어찌 나뉘었느냐</strong> 바울이 너희를 위하여 십자가에 못 박혔으며 바울의 이름으로 너희가 세례를 받았느냐” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/1/#L10-13">고전 1:10-13</a>; <a href="https://bibleox.com/ko/ko-nkrv/1kor/3/#L4">고전 3:4</a>) <em>(10절의 “분쟁”은 그리스어로 σχίσματα, 곧 “<strong>분열</strong>”입니다.)</em></p></blockquote><p>하느님께서는 몸(교회)의 지체들을 배치하시어 분열이 없고 모두가 서로 돌보며 함께 고통받고 함께 기뻐하게 하셨습니다:</p><blockquote><p>“우리가 유대인이나 헬라인이나 종이나 자유인이나 <strong>다 한 성령으로 세례를 받아 한 몸이 되었고</strong> 또 다 한 성령을 마시게 하셨느니라 <strong>몸은 한 지체뿐만 아니요 여럿이니</strong> &lt;…&gt; <strong><mark>눈이 손더러 내가 너를 쓸 데가 없다 하거나 또한 머리가 발더러 내가 너를 쓸 데가 없다 하지 못하리라</mark></strong> 그뿐 아니라 더 약하게 보이는 몸의 지체가 도리어 요긴하고 우리가 몸의 덜 귀히 여기는 그것들을 더욱 귀한 것들로 입혀 주며 우리의 아름답지 못한 지체는 더욱 아름다운 것을 얻느니라 그런즉 우리의 아름다운 지체는 그럴 필요가 없느니라 오직 <strong><mark>하나님이 몸을 고르게 하여</mark></strong> 부족한 지체에게 귀중함을 더하사 <strong><mark>몸 가운데서 분쟁이 없고</mark></strong> 오직 여러 지체가 서로 같이 돌보게 하셨느니라 <strong>만일 한 지체가 고통을 받으면 모든 지체가 함께 고통을 받고 한 지체가 영광을 얻으면 모든 지체가 함께 즐거워하느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/12/#L13-14,21-26">고전 12:13-14,21-26</a>) <em>(25절의 “분쟁”은 그리스어로 σχίσμα, 곧 “<strong>분열</strong>”입니다.)</em></p></blockquote><p>몸의 이 여러 지체는 무엇입니까? 교회 안의 여러 직분과 은사입니다:</p><blockquote><p>“<strong>몸은 하나인데 많은 지체가 있고 몸의 지체가 많으나 한 몸임과 같이</strong> 그리스도도 그러하니라 &lt;…&gt; <strong>몸은 한 지체뿐만 아니요 여럿이니</strong> &lt;…&gt; <strong>너희는 그리스도의 몸이요 지체의 각 부분이라</strong> <strong>하나님이 교회 중에 몇을 세우셨으니</strong> 첫째는 <strong>사도요</strong> 둘째는 <strong>선지자요</strong> 셋째는 <strong>교사요</strong> 그 다음은 <strong>능력을 행하는 자요</strong> 그 다음은 <strong>병 고치는 은사와</strong> 서로 돕는 것과 다스리는 것과 각종 방언을 말하는 것이라 <strong>다 사도이겠느냐 다 선지자이겠느냐 다 교사이겠느냐 다 능력을 행하는 자이겠느냐</strong> <strong>다 병 고치는 은사를 가진 자이겠느냐</strong> <strong>다 방언을 말하는 자이겠느냐</strong> <strong>다 통역하는 자이겠느냐</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/12/#L12,14,27-30">고전 12:12,14,27-30</a>)</p></blockquote><p>이처럼 하느님께서는 이 모든 직분과 은사를 배치하시어 몸 안에 분열이 없게 하셨습니다. 사도는 서신 첫머리에서 이것을 막습니다(<a href="https://bibleox.com/ko/ko-nkrv/1kor/1/#L10-13">고전 1:10-13</a>). 곧 하느님께서는 일치를 원하실 뿐 아니라(<a href="https://bibleox.com/ko/ko-nkrv/in/17/#L20-21">요 17:20-21</a>) 일치를 돌보십니다. 여기서 하느님께서 직분에 세우신 사도는 눈에 보이는 일치를 돌보며, 고린도 교인들에게 눈에 보이는 분열을 만들지 말라고 금합니다.</p><h2>교회 안의 분열은 사람에게 하느님 나라에 이르는 길을 막는 죄입니다</h2><blockquote><p>“육체의 일은 분명하니 곧 음행과 더러운 것과 호색과 우상 숭배와 주술과 원수 맺는 것과 분쟁과 시기와 분냄과 당 짓는 것과 <strong><mark>분열함과</mark></strong> 이단과 투기와 술 취함과 방탕함과 또 그와 같은 것들이라 전에 너희에게 경계한 것 같이 경계하노니 이런 일을 하는 자들은 <strong><mark>하나님의 나라를 유업으로 받지 못할 것이요</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gal/5/#L19-21">갈 5:19-21</a>) <em>(“분열함”(διχοστασίαι)은 갈라짐, 둘로 쪼개짐을 뜻합니다.)</em></p></blockquote><blockquote><p>“형제들아 내가 너희를 권하노니 너희가 배운 교훈을 거슬러 <strong><mark>분쟁을 일으키거나 거치게 하는 자들을 살피고</mark></strong> 그들에게서 떠나라 <strong><mark>이같은 자들은 우리 주 그리스도를 섬기지 아니하고</mark></strong> 다만 자기들의 배만 섬기나니 교활한 말과 아첨하는 말로 순진한 자들의 마음을 미혹하느니라” (<a href="https://bibleox.com/ko/ko-nkrv/rim/16/#L17-18">롬 16:17-18</a>) <em>(17절의 “분쟁”은 그리스어로 διχοστασίας, 곧 “<strong>분열</strong>”입니다.)</em></p></blockquote><h2>분열에 관한 예언</h2><blockquote><p>“그들이 너희에게 말하기를 <strong>마지막 때에</strong> 자기의 경건하지 않은 정욕대로 행하며 <strong>조롱하는 자들이 있으리라</strong> 하였나니 이 사람들은 <strong>분열을 일으키는 자며 육에 속한 자며</strong> 성령이 없는 자니라” (<a href="https://bibleox.com/ko/ko-nkrv/iud/1/#L18-19">유 1:18-19</a>)</p></blockquote><blockquote><p>“아이들아 지금은 마지막 때라 적그리스도가 오리라는 말을 너희가 들은 것과 같이 <strong><mark>지금도 많은 적그리스도가 일어났으니</mark></strong> 그러므로 우리가 마지막 때인 줄 아노라 <strong><mark>그들이 우리에게서 나갔으나 우리에게 속하지 아니하였나니 만일 우리에게 속하였더라면 우리와 함께 거하였으려니와</mark></strong> 그들이 나간 것은 다 우리에게 속하지 아니함을 나타내려 함이니라” (<a href="https://bibleox.com/ko/ko-nkrv/1in/2/#L18-19">요일 2:18-19</a>)</p></blockquote><h2>분열의 예</h2><blockquote><p>“내가 두어 자를 교회에 썼으나 그들 중에 으뜸되기를 좋아하는 <strong>디오드레베가</strong> 우리를 맞아들이지 아니하니 그러므로 내가 가면 그 행한 일을 잊지 아니하리라 그가 <strong>악한 말로 우리를 비방하고도 오히려 부족하여 형제들을 맞아들이지도 아니하고 맞아들이고자 하는 자를 금하여 교회에서 내쫓는도다</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/3in/1/#L9-10">요삼 1:9-10</a>)</p></blockquote><h2>사도들은 분열하려는 시도를 막았습니다</h2><blockquote><p>“내 형제들아 글로에의 집 편으로 너희에 대한 말이 내게 들리니 곧 너희 가운데 분쟁이 있다는 것이라 내가 이것을 말하거니와 너희가 각각 이르되 <strong>나는 바울에게, 나는 아볼로에게, 나는 게바에게, 나는 그리스도에게 속한 자라 한다는 것이니</strong> <strong>그리스도께서 어찌 나뉘었느냐</strong> 바울이 너희를 위하여 십자가에 못 박혔으며 바울의 이름으로 너희가 세례를 받았느냐” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/1/#L11-13">고전 1:11-13</a>)</p></blockquote><blockquote><p>“형제들아 내가 우리 주 예수 그리스도의 이름으로 너희를 <strong>권하노니</strong> <strong>모두가 같은 말을 하고 너희 가운데 분쟁이 없이</strong> 같은 마음과 같은 뜻으로 온전히 합하라” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/1/#L10">고전 1:10</a>)</p></blockquote><blockquote><p>“<strong>몸 가운데서 분쟁이 없고</strong> 오직 여러 지체가 서로 같이 돌보게 하셨느니라” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/12/#L25">고전 12:25</a>)</p></blockquote>
