  title: 이단
  copy_cover: true
  body: '<h2>이단의 정의</h2><p><strong>이단</strong>(고대 그리스어 <a href="https://bibleox.com/ru/words/αιρεσις">αἵρεσις</a> — 방향, 가르침, 학파, 선택)은 앞선 가르침의 생각 위에서, 대개 그 가르침에 맞서 생겨난 나중의 따로 떨어진 가르침입니다. 이단을 따르는 이들은 자기가 갈라져 나온 가르침을 그르다고 여기며, 상대편도 그들을 똑같이 여깁니다.</p><p>성경의 맥락에서는 가르침을 크게 왜곡하는 것은 모두 이단으로 여겨졌습니다:</p><ul><li><p><strong>바리새인</strong> — 구원에 관한 그릇된 가르침. 그들은 여러 면에서 구원을 외적 규정을 정확히 지키는 일로 축소했습니다;</p></li><li><p><strong>사두개인</strong> — 영적 실재에 관한 그릇된 가르침. 그들은 영적 실재, 곧 몸이 죽은 뒤의 혼의 삶, 영들과 천사들의 존재, 죽은 이들의 부활을 부정했습니다;</p></li><li><p><strong>후메내오와 빌레도의 가르침</strong> — 부활에 관한 그릇된 가르침. 그들은 부활이 이미 지나갔다고 가르쳤습니다;</p></li><li><p><strong>니골라당</strong> — 도덕적 삶에 관한 그릇된 가르침. 그들은 육체의 방탕을 허용했습니다.</p></li></ul><p>이 이단들은 모두 하느님에 관한 가르침을 직접 다루지 않고 가르침의 다른 점들을 다루지만, 그래도 이단입니다.</p><h2>이단은 구원을 잃게 하는 죄입니다</h2><blockquote><p>“육체의 일은 분명하니 곧 음행과 더러운 것과 호색과 우상 숭배와 주술과 원수 맺는 것과 분쟁과 시기와 분냄과 당 짓는 것과 분열함과 <strong><mark>이단과</mark></strong> 투기와 술 취함과 방탕함과 또 그와 같은 것들이라 전에 너희에게 경계한 것 같이 경계하노니 <strong><mark>이런 일을 하는 자들은 하나님의 나라를 유업으로 받지 못할 것이요</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gal/5/#L19-21">갈 5:19-21</a>)</p></blockquote><blockquote><p>“형제들아 내가 너희를 권하노니 <strong>너희가 배운 교훈을 거슬러</strong> <strong>분쟁을 일으키거나 거치게 하는 자들을 살피고</strong> 그들에게서 떠나라 <strong><mark>이같은 자들은 우리 주 그리스도를 섬기지 아니하고</mark></strong> 다만 자기들의 배만 섬기나니 교활한 말과 아첨하는 말로 순진한 자들의 마음을 미혹하느니라” (<a href="https://bibleox.com/ko/ko-nkrv/rim/16/#L17-18">롬 16:17-18</a>)</p></blockquote><p>그릇된 가르침은 하느님께로 이끌지 않습니다:</p><blockquote><p>“<strong><mark>지나쳐 그리스도의 교훈 안에 거하지 아니하는 자는 다 하나님을 모시지 못하되</mark></strong> 교훈 안에 거하는 그 사람은 아버지와 아들을 모시느니라” (<a href="https://bibleox.com/ko/ko-nkrv/2in/1/#L9">요이 1:9</a>)</p></blockquote><blockquote><p>“<strong>비뚤어진 생각은 하느님에게서 떼어 놓는다</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/prs/1/#L3">지혜 1:3</a>, 그리스어에서 번역)</p></blockquote><h2>예수 그리스도의 반대자들은 그분의 가르침을 여러 이단 가운데 하나로 여겼습니다</h2><p>사도들을 고발하는 이들은 그리스도의 가르침을 나사렛(그리스도께서는 나사렛에서 자라셨습니다, <a href="https://bibleox.com/ko/ko-nkrv/in/1/#L45-46">요 1:45-46</a>) 이단이라고 부릅니다:</p><blockquote><p>“우리가 보니 이 사람은 전염병 같은 자라 천하에 흩어진 유대인을 다 소요하게 하는 자요 <strong>나사렛 이단의 우두머리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/act/24/#L5">행 24:5</a>)</p></blockquote><p>사도들은 바리새인과 사두개인이 자기들의 가르침을 이단으로 여긴다는 것을 확인합니다:</p><blockquote><p>“그러나 이것을 당신께 고백하리이다 나는 <strong>그들이 이단이라 하는 도를 따라</strong> 조상의 하나님을 섬기고 율법과 선지자들의 글에 기록된 것을 다 믿으며” (<a href="https://bibleox.com/ko/ko-nkrv/act/24/#L14">행 24:14</a>)</p></blockquote><p>공회에서는 그리스도의 가르침을 여러 가르침 가운데 하나로 여깁니다. 바리새인 가말리엘은 새 가르침들의 예를 듭니다:</p><blockquote><p>“<strong>바리새인 가말리엘은 율법교사로</strong> 모든 백성에게 존경을 받는 자라 공회 중에 일어나 명하여 사도들을 잠깐 밖에 나가게 하고 말하되 이스라엘 사람들아 너희가 이 사람들에게 대하여 어떻게 하려는지 조심하라 <strong><mark>이전에 드다가 일어나 스스로 선전하매 사람이 약 사백 명이나 따르더니</mark></strong> 그가 죽임을 당하매 따르던 모든 사람들이 흩어져 없어졌고 그 후 호적할 때에 <strong><mark>갈릴리의 유다가 일어나 백성을 꾀어 따르게 하다가</mark></strong> 그도 망한즉 따르던 모든 사람들이 흩어졌느니라” (<a href="https://bibleox.com/ko/ko-nkrv/act/5/#L34-37">행 5:34-37</a>)</p></blockquote><p>참고: <a href="https://bibleox.com/ko/ko-nkrv/lk/23/#L2">눅 23:2</a>, <a href="https://bibleox.com/ko/ko-nkrv/in/7/#L12">요 7:12</a>.</p><h3>그리스도의 가르침은 왜 이단이 아닌가?</h3><p>간단히 말하면 그분은 하느님이시고(<a href="https://bibleox.com/ru/ru/w/Христос-Бог">구절</a>), 진리이시며(<a href="https://bibleox.com/ko/ko-nkrv/in/14/#L6">요 14:6</a>), 입법자이시기 때문입니다(“옛 사람에게 말한 바 … 하였다는 것을 너희가 들었으나 나는 너희에게 이르노니…” — <a href="https://bibleox.com/ko/ko-nkrv/mf/5/#L21-22">마 5:21-22</a>).</p><p>그리스도의 가르침을 거짓되고 따로 떨어진 것으로 여기는 이들은, 예수를 그리스도요 하느님으로 여기지 않는 이들, 그분이 바로 아브라함과 이삭과 야곱과 말씀하신(<a href="https://bibleox.com/ko/ko-nkrv/ish/3/#L15">출 3:15</a>; <a href="https://bibleox.com/ko/ko-nkrv/in/8/#L25">요 8:25</a>) 하느님이요 입법자이시며, 이스라엘에게 율법을 주시고(<a href="https://bibleox.com/ko/ko-nkrv/gal/3/#L19">갈 3:19</a>) 이스라엘에 선지자들을 보내신(<a href="https://bibleox.com/ko/ko-nkrv/mf/23/#L34">마 23:34</a>) 분이심을 믿지 않는 이들뿐입니다. 예수 그리스도께서는 하느님이시므로, 입법자로서 오시어 당신이 주신 질서를 바꾸시고 당신의 포도원을 다른 이들에게 주셨습니다(<a href="https://bibleox.com/ko/ko-nkrv/lk/20/#L16">눅 20:16</a>; <a href="https://bibleox.com/ko/ko-nkrv/mk/12/#L9">막 12:9</a>).</p><p>그러므로 그리스도를 믿지 않는 이들만 그리스도의 가르침을 이단으로 여기고, 그리스도를 믿는 이들은 그분의 가르침을 유일하게 참된 것으로 여깁니다(<a href="https://bibleox.com/ko/ko-nkrv/2in/1/#L9">요이 1:9</a>; <a href="https://bibleox.com/ko/ko-nkrv/in/3/#L36">요 3:36</a>). 그러나 그리스도와 사도들은 그들 뒤에 거짓 가르침들이 나타나리라고 경고하며, 교회에 단번에 전해진 것을 지켜야 한다고 했습니다:</p><blockquote><p>“사랑하는 자들아 우리가 일반으로 받은 구원에 관하여 내가 너희에게 편지하려는 생각이 간절하던 차에 성도에게 <strong>단번에 주신</strong> 믿음의 도를 위하여 힘써 싸우라는 편지로 너희를 권하여야 할 필요를 느꼈노니” (<a href="https://bibleox.com/ko/ko-nkrv/iud/1/#L3">유 1:3</a>)</p></blockquote><h3>예수 그리스도에 대해 말하기만 하면 그 가르침은 모두 참된가?</h3><p>사도들은 다른 사람들이 다른 예수, 다른 복음을 전하고 다른 영을 줄 수 있다고 경고합니다:</p><blockquote><p>“뱀이 그 간계로 하와를 미혹한 것 같이 너희 마음이 그리스도를 향하는 진실함과 깨끗함에서 떠나 부패할까 <strong>두려워하노라</strong> <strong>만일 누가 가서 우리가 전파하지 아니한 다른 예수를 전파하거나</strong> 혹은 너희가 받지 아니한 <strong>다른 영을</strong> 받게 하거나 혹은 너희가 받지 아니한 <strong>다른 복음을</strong> 받게 할 때에는 너희가 잘 용납하는구나” (<a href="https://bibleox.com/ko/ko-nkrv/2kor/11/#L3-4">고후 11:3-4</a>)</p></blockquote><h2>이단에 관한 예언</h2><h3>그리스도교 안에 많은 이단이 생겨날 것입니다</h3><blockquote><p>“<strong><mark>많은 사람이 내 이름으로 와서</mark></strong> 이르되 내가 그라 하여 <strong><mark>많은 사람을 미혹하리라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mk/13/#L6">막 13:6</a>)</p></blockquote><blockquote><p>“<strong><mark>거짓 선지자가 많이 일어나 많은 사람을 미혹하겠으며</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/24/#L11">마 24:11</a>)</p></blockquote><blockquote><p>“사랑하는 자들아 영을 다 믿지 말고 오직 영들이 하나님께 속하였나 분별하라 <strong><mark>많은 거짓 선지자가</mark></strong> 세상에 나왔음이라” (<a href="https://bibleox.com/ko/ko-nkrv/1in/4/#L1">요일 4:1</a>)</p></blockquote><p><a href="https://bibleox.com/en/en/w/Didache/">디다케</a>(영어, 1-2세기)에도 이런 말이 있습니다:</p><blockquote><p>“<strong>마지막 날에는 거짓 선지자들과 타락시키는 자들이 많아질 것이며</strong>, 양들이 이리로 변하고 사랑이 미움으로 변할 것이다” (디다케 16장, 그리스어에서 옮김)</p></blockquote><h3>이단은 아주 널리 퍼질 것입니다</h3><blockquote><p>“<strong><mark>그들의 말은 악성 종양이 퍼져나감과 같은데</mark></strong> 그 중에 후메내오와 빌레도가 있느니라 <strong>진리에 관하여는 그들이 그릇되었도다</strong> 부활이 이미 지나갔다 함으로 어떤 사람들의 믿음을 무너뜨리느니라” (<a href="https://bibleox.com/ko/ko-nkrv/2tim/2/#L17-18">딤후 2:17-18</a>)</p></blockquote><blockquote><p>“그러나 백성 가운데 또한 거짓 선지자들이 일어났었나니 이와 같이 너희 중에도 거짓 선생들이 있으리라 그들은 <strong>멸망하게 할 이단을 가만히 끌어들여</strong> 자기들을 사신 주를 부인하고 임박한 멸망을 스스로 취하는 자들이라 <strong><mark>여럿이 그들의 호색하는 것을 따르리니 이로 말미암아 진리의 도가 비방을 받을 것이요</mark></strong> <strong>그들이 탐심으로써 지어낸 말을 가지고 너희로 이득을 삼으니</strong> 그들의 심판은 옛적부터 지체하지 아니하며 그들의 멸망은 잠들지 아니하느니라” (<a href="https://bibleox.com/ko/ko-nkrv/2pet/2/#L1-3">벧후 2:1-3</a>)</p></blockquote><h3>이단자들의 공동체는 교회와 교회의 믿음의 일치에서 갈라져 나갈 것입니다</h3><blockquote><p>“아이들아 지금은 마지막 때라 적그리스도가 오리라는 말을 너희가 들은 것과 같이 지금도 많은 적그리스도가 일어났으니 그러므로 우리가 마지막 때인 줄 아노라 <strong><mark>그들이 우리에게서 나갔으나 우리에게 속하지 아니하였나니 만일 우리에게 속하였더라면 우리와 함께 거하였으려니와</mark></strong> 그들이 나간 것은 다 우리에게 속하지 아니함을 나타내려 함이니라” (<a href="https://bibleox.com/ko/ko-nkrv/1in/2/#L18-19">요일 2:18-19</a>)</p></blockquote><blockquote><p>“그들이 너희에게 말하기를 <strong>마지막 때에</strong> 자기의 경건하지 않은 정욕대로 행하며 조롱하는 자들이 있으리라 하였나니 이 사람들은 <strong><mark>분열을 일으키는 자며 육에 속한 자며</mark></strong> 성령이 없는 자니라” (<a href="https://bibleox.com/ko/ko-nkrv/iud/1/#L18-19">유 1:18-19</a>)</p></blockquote><h3>거짓 교사들의 목적은 믿는 이를 교회에서 빼앗아 자기 뒤로 끌어가는 것입니다</h3><blockquote><p>“<strong><mark>내가 떠난 후에 사나운 이리가 여러분에게 들어와서 그 양 떼를 아끼지 아니하며 또한 여러분 중에서도 제자들을 끌어 자기를 따르게 하려고 어그러진 말을 하는 사람들이 일어날 줄을 내가 아노라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/act/20/#L29-30">행 20:29-30</a>)</p></blockquote><h3>거짓 교사들의 수단</h3><h4>듣기 좋은 가르침</h4><p>거짓 교사들은 듣기 좋은 가르침을 지어낼 것입니다. 듣는 이들이 바른 교훈을 견디지 못하고 귀에 듣기 좋은 가르침을 찾을 것이기 때문입니다:</p><blockquote><p>“때가 이르리니 사람이 <strong>바른 교훈을 받지 아니하며</strong> 귀가 가려워서 <strong>자기의 사욕을 따를</strong> <strong><mark>스승을 많이 두고</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2tim/4/#L3">딤후 4:3</a>)</p></blockquote><blockquote><p>“그러나 성령이 밝히 말씀하시기를 <strong><mark>후일에 어떤 사람들이 믿음에서 떠나 미혹하는 영과 귀신의 가르침을 따르리라</mark></strong> 하셨으니 자기 양심이 화인을 맞아서 외식함으로 거짓말하는 자들이라” (<a href="https://bibleox.com/ko/ko-nkrv/1tim/4/#L1-2">딤전 4:1-2</a>)</p></blockquote><h4>거짓 경건</h4><blockquote><p>“너는 이것을 알라 <strong>말세에</strong> 고통하는 때가 이르러 사람들이 자기를 사랑하며 돈을 사랑하며 자랑하며 교만하며 비방하며 부모를 거역하며 감사하지 아니하며 거룩하지 아니하며 &lt;…&gt; <strong><mark>경건의 모양은 있으나 경건의 능력은 부인하니</mark></strong> 이같은 자들에게서 네가 돌아서라 &lt;…&gt; 항상 배우나 끝내 진리의 지식에 이를 수 없느니라 얀네와 얌브레가 모세를 대적한 것 같이 그들도 <strong>진리를 대적하니 이 사람들은 그 마음이 부패한 자요 믿음에 관하여는 버림 받은 자들이라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2tim/3/#L1-2,5,7-8">딤후 3:1-2,5,7-8</a>)</p></blockquote><blockquote><p>“<strong>거짓 선지자들을</strong> 삼가라 <strong><mark>양의 옷을 입고 너희에게 나아오나</mark></strong> 속에는 노략질하는 이리라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/7/#L15">마 7:15</a>)</p></blockquote><h4>기적</h4><p>사도들과 옛 그리스도인들에게는 보여 주기 위해서가 아니라 유익을 위해 기적을 행하는 능력이 넉넉히 주어졌습니다:</p><blockquote><p>“각 사람에게 성령을 나타내심은 <strong>유익하게 하려 하심이라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/12/#L7">고전 12:7</a>)</p></blockquote><p>적은 무리의 어부들이 짧은 생애 동안 온 세상에 설교를 전하려면 큰 도움이 필요했습니다. 사도들은 이 은사들이 그치리라고 경고했습니다:</p><blockquote><p>“사랑은 언제까지나 떨어지지 아니하되 <strong>예언도 폐하고 방언도 그치고</strong> 지식도 폐하리라” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/13/#L8">고전 13:8</a>)</p></blockquote><p>그리스도께서도 친히 표적을 구하는 것을 꾸짖으셨습니다:</p><blockquote><p>“예수께서 대답하여 이르시되 <strong>악하고 음란한 세대가 표적을 구하나</strong> 선지자 요나의 표적 밖에는 보일 표적이 없느니라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/12/#L39">마 12:39</a>)</p></blockquote><p>마지막 때에 거짓 선지자들은 바로 기적으로 사람들을 미혹할 것입니다:</p><blockquote><p>“거짓 그리스도들과 거짓 선지자들이 일어나 <strong>큰 표적과 기사를 보여 할 수만 있으면 택하신 자들도 미혹하리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/24/#L24">마 24:24</a>; <a href="https://bibleox.com/ko/ko-nkrv/mk/13/#L22">막 13:22</a>)</p></blockquote><p>그 결과 심판 때에 많은 신자가 그리스도의 이름으로 기적을 행하고 예언하고 귀신을 쫓아냈으니 구원받았다고 확신할 것입니다. 그러나 그들은 미혹되어 불법을 배운 것으로 드러났고, 그리스도께서는 그들을 모른다고 하시며 당신에게서 쫓아내십니다:</p><blockquote><p>“그 날에 많은 사람이 나더러 이르되 주여 주여 우리가 주의 이름으로 선지자 노릇 하며 주의 이름으로 귀신을 쫓아 내며 <strong>주의 이름으로 많은 권능을 행하지 아니하였나이까</strong> 하리니 그 때에 내가 그들에게 밝히 말하되 <strong>내가 너희를 도무지 알지 못하니</strong> 불법을 행하는 자들아 <strong>내게서 떠나가라</strong> 하리라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/7/#L22-23">마 7:22-23</a>)</p></blockquote><h2>1세기 이단의 예</h2><h3>바리새인</h3><p>사도들은 바리새인의 가르침을 이단(따로 떨어진 그릇된 가르침)이라고 불렀습니다:</p><blockquote><p>“<strong>바리새파</strong> 중에 어떤 믿는 사람들이 일어나 말하되 이방인에게 <strong>할례를 행하고</strong> <strong>모세의 율법을 지키라</strong> 명하는 것이 마땅하다 하니라” (<a href="https://bibleox.com/ko/ko-nkrv/act/15/#L5">행 15:5</a>) <em>(“바리새파”는 그리스어로 τῆς αἱρέσεως τῶν Φαρισαίων, 곧 “바리새인들의 <strong>이단</strong>(분파)”입니다.)</em></p></blockquote><p>바리새인 가운데 믿게 된 이들은 이방인이 구원받으려면 할례를 받고 모세의 율법을 지켜야 한다고 생각했습니다.</p><p>복음서 저자 마태도 바리새인과 사두개인의 가르침의 위험을 가리킵니다:</p><blockquote><p>“예수께서 이르시되 삼가 <strong>바리새인과 사두개인들의 누룩을 주의하라</strong> 하시니 &lt;…&gt; 어찌 내 말한 것이 떡에 관함이 아닌 줄을 깨닫지 못하느냐 오직 바리새인과 사두개인들의 누룩을 주의하라 하시니 그제서야 제자들이 떡의 누룩이 아니요 <strong>바리새인과 사두개인들의 교훈을 삼가라고</strong> 말씀하신 줄을 깨달으니라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/16/#L6,11-12">마 16:6,11-12</a>)</p></blockquote><h3>사두개인</h3><p>사도들은 사두개인의 가르침을 이단(따로 떨어진 그릇된 가르침)이라고 불렀습니다:</p><blockquote><p>“대제사장과 그와 함께 있는 사람 즉 <strong>사두개인의 당파가</strong> 다 마음에 시기가 가득하여 일어나서” (<a href="https://bibleox.com/ko/ko-nkrv/act/5/#L17">행 5:17</a>) <em>(그리스어: αἵρεσις τῶν Σαδδουκαίων, “사두개인들의 <strong>이단</strong>(분파)”.)</em></p></blockquote><p>사두개인의 가르침은 죽은 이들의 부활과 죽은 뒤 혼의 삶, 그리고 천사와 영들의 존재 자체를 부정했습니다:</p><blockquote><p>“<strong>부활이 없다 하는 사두개인들이</strong> 예수께 와서 물어 이르되 &lt;…&gt; 예수께서 이르시되 <strong>너희가 성경도 하나님의 능력도 알지 못하므로 오해함이 아니냐</strong> &lt;…&gt; <strong>죽은 자가 살아난다는 것을 말할진대 너희가 모세의 책 중</strong> 가시나무 떨기에 관한 글에 하나님께서 모세에게 이르시되 나는 아브라함의 하나님이요 이삭의 하나님이요 야곱의 하나님이로라 하신 말씀을 읽어보지 못하였느냐 하나님은 죽은 자의 하나님이 아니요 산 자의 하나님이시라 <strong>너희가 크게 오해하였도다</strong> 하시니라” (<a href="https://bibleox.com/ko/ko-nkrv/mk/12/#L18,24,26-27">막 12:18,24,26-27</a>)</p></blockquote><blockquote><p>“이는 <strong>사두개인은 부활도 없고 천사도 없고 영도 없다 하고</strong> 바리새인은 다 있다 함이라” (<a href="https://bibleox.com/ko/ko-nkrv/act/23/#L8">행 23:8</a>)</p></blockquote><p>바리새인들은 사두개인들과 논쟁했습니다:</p><blockquote><p>“바울이 <strong>그 중 일부는 사두개인이요 다른 일부는 바리새인인 줄 알고</strong> 공회에서 외쳐 이르되 여러분 형제들아 나는 바리새인이요 또 바리새인의 아들이라 죽은 자의 소망 곧 부활로 말미암아 내가 심문을 받노라 그 말을 한즉 <strong>바리새인과 사두개인 사이에 다툼이 생겨 무리가 나누어지니</strong> 이는 사두개인은 부활도 없고 천사도 없고 영도 없다 하고 바리새인은 다 있다 함이라” (<a href="https://bibleox.com/ko/ko-nkrv/act/23/#L6-8">행 23:6-8</a>)</p></blockquote><h3>후메내오와 빌레도의 가르침</h3><p>후메내오와 빌레도의 가르침. 그들은 진리에 관하여 그릇되었습니다. 그릇되었다면 전에는 그리스도인이었다는 뜻입니다. 이제 그들은 부활에 대해 그릇되게 가르치며, 이것은 분명히 퍼져 나갈 이단이고 그것에서 떠나야 합니다:</p><blockquote><p>“망령되고 헛된 말을 버리라 그들은 경건하지 아니함에 점점 나아가나니 <strong>그들의 말은 악성 종양이 퍼져나감과 같은데 그 중에 후메내오와 빌레도가 있느니라 진리에 관하여는 그들이 그릇되었도다 부활이 이미 지나갔다 함으로</strong> 어떤 사람들의 믿음을 무너뜨리느니라 그러나 하나님의 견고한 터는 섰으니 인침이 있어 일렀으되 주께서 자기 백성을 아신다 하며 또 <strong>주의 이름을 부르는 자마다 불의에서 떠날지어다</strong> 하였느니라” (<a href="https://bibleox.com/ko/ko-nkrv/2tim/2/#L16-19">딤후 2:16-19</a>)</p></blockquote><h3>니골라당</h3><p>주 예수 그리스도께서는 니골라당의 가르침을 미워하십니다. 곧 분명히 그들의 가르침은 이단입니다:</p><blockquote><p>“이와 같이 네게도 <strong>니골라 당의 교훈을 지키는 자들이 있도다</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/2/#L15">계 2:15</a>) <em>(공인본문(TR)에는 끝에 “<strong>내가 이것을 미워하노라</strong>”가 있습니다.)</em></p></blockquote><blockquote><p>“오직 네게 이것이 있으니 <strong>네가 니골라 당의 행위를 미워하는도다 나도 이것을 미워하노라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/2/#L6">계 2:6</a>)</p></blockquote><h2>2세기 이단의 예</h2><p>철학자 성 순교자 유스티노(~100-165)는, 스스로 그리스도인이라 부르고 예수 그리스도를 주님으로 인정하면서도 미혹의 영들의 가르침, 곧 따로 떨어진 거짓 가르침(이단)을 전하는 사람들이 있다고 씁니다:</p><blockquote><p>“<strong>스스로 그리스도인이라 고백하고 십자가에 못 박히신 예수를 주님이시며 그리스도로 인정하면서도, 그분의 가르침이 아니라 미혹의 영들의 가르침을 가르치는 사람들</strong>이 있다는 사실 … 우리는 그들과 아무것도 함께하지 않습니다.”</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/Justin_Martyr-Dialogue_with_Trypho/#HH-35">트리폰과의 대화 35장</a>, 영어 번역에서 옮김)</p><p>리옹의 성 순교자 이레네오(~130-202)도 셀 수 없이 많은 그리스도교 이단에 대해 씁니다. 예를 들어 그는 철학자 유스티노의 제자 타티아노스에 대해 씁니다. 타티아노스는 유스티노가 순교하기 전에는 이단을 말하지 않았으나 그 뒤에 자기 가르침을 지어냈습니다:</p><blockquote><p>“1. 우리가 서술한 이단자들에게서 이미 수많은 이단의 많은 곁가지가 생겨났습니다. 이는 <strong><mark>그들 가운데 많은 이가, 아니 모두가 스스로 교사가 되기를 바라고, 자기가 속했던 특정 이단에서 갈라져 나가기를 원하기 때문입니다. 그들은 전혀 다른 견해 체계에서 한 갈래의 교리를 만들고, 또 다른 것들에서 또 다른 것을 만들어, 무언가 새로운 것을 가르치겠다고 고집하며, 자기가 만들어 낼 수 있었던 어떤 견해든 그 창시자라고 내세웁니다</mark></strong>. 예를 들면, 사투르니노스와 마르키온에게서 나온 이른바 엔크라테이아파(절제파)는 <strong>혼인을 반대하여</strong> 하느님의 본래 창조를 무시하고, 인류의 번성을 위해 남자와 여자를 만드신 분을 간접적으로 비난했습니다. 그들 가운데 어떤 이들은 <strong>고기를 먹지 않는 절제를 들여와</strong>, 만물을 지으신 하느님께 감사하지 않는 자임을 드러냈습니다. <strong>그들은 또 처음 창조된 사람의 구원을 부정합니다</strong>. 그러나 이 견해는 최근에 그들 사이에서 지어낸 것입니다. 타티아노스라는 사람이 처음 이 모독을 들여왔습니다. 그는 유스티노의 제자였는데, 유스티노와 함께 있는 동안에는 그런 견해를 말하지 않았습니다. 그러나 유스티노가 순교한 뒤 교회에서 갈라져 나가, 교사가 된다는 생각에 들뜨고 우쭐하여 마치 남보다 뛰어난 듯이 자기 나름의 교리를 지었습니다. 그는 발렌티노스의 추종자들처럼 보이지 않는 아이온들의 체계를 지어냈고, 마르키온과 사투르니노스처럼 혼인은 타락과 음행일 뿐이라고 선언했습니다. 그러나 아담의 구원을 부정한 것은 전적으로 그 자신의 견해였습니다. 2. 또 다른 이들은 바실레이데스와 카르포크라테스를 따라 문란한 성관계와 여러 아내를 두는 것을 들여왔고, 우상에게 바친 고기를 먹는 것에 무관심하며, 하느님께서는 그런 일을 크게 상관하지 않으신다고 주장합니다. 그러나 왜 계속하겠습니까? <strong>어떤 식으로든 진리에서 떨어져 나간 이들을 모두 언급하는 것은 불가능한 일이기 때문입니다</strong>.”</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b1/#HH-28">이단 반박 1권 28장</a>, 영어 번역에서 옮김)</p><h2>교회는 하나의 믿음, 일치와 한마음입니다</h2><h3>교회 안에는 하나의 믿음이 있습니다</h3><blockquote><p>“몸이 하나요 성령도 한 분이시니 이와 같이 너희가 부르심의 한 소망 안에서 부르심을 받았느니라 주도 한 분이시요 <strong>믿음도 하나요</strong> 세례도 하나요” (<a href="https://bibleox.com/ko/ko-nkrv/ef/4/#L4-5">엡 4:4-5</a>)</p></blockquote><h3>한마음이 되라는 계명</h3><blockquote><p>“<strong><mark>서로 마음을 같이하며</mark></strong> 높은 데 마음을 두지 말고 도리어 <strong>낮은 데 처하며</strong> 스스로 지혜 있는 체 하지 말라” (<a href="https://bibleox.com/ko/ko-nkrv/rim/12/#L16">롬 12:16</a>)</p></blockquote><blockquote><p>“형제들아 내가 우리 주 예수 그리스도의 이름으로 너희를 권하노니 <strong><mark>모두가 같은 말을 하고</mark></strong> 너희 가운데 분쟁이 없이 <strong><mark>같은 마음과 같은 뜻으로 온전히 합하라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/1/#L10">고전 1:10</a>)</p></blockquote><p>한마음에 관한 더 많은 구절: <a href="https://bibleox.com/ru/ru/w/Единомыслие">한마음</a></p><h3>일치를 바라시는 하느님의 뜻</h3><p>주님께서는 사도들의 말을 통해 당신을 믿는 이들이 하나 되기를 바라십니다</p><blockquote><p>“내가 비옵는 것은 이 사람들만 위함이 아니요 또 <strong><mark>그들의 말로 말미암아 나를 믿는 사람들도 위함이니 아버지여, 아버지께서 내 안에, 내가 아버지 안에 있는 것 같이 그들도 다 하나가 되어</mark></strong> 우리 안에 있게 하사 세상으로 아버지께서 나를 보내신 것을 믿게 하옵소서” (<a href="https://bibleox.com/ko/ko-nkrv/in/17/#L20-21">요 17:20-21</a>)</p></blockquote><h2>이단에 맞서야 합니다</h2><blockquote><p>“<strong>죽기까지 진리를 위해 싸워라.</strong> 주 하느님께서 너를 위해 싸워 주시리라” (<a href="https://bibleox.com/ko/gr-lxx-byz/prsir/4/#L28">집회 4:28</a>, 그리스어에서 번역) <em>(러시아어 성경에서는 4:32.)</em></p></blockquote><blockquote><p>“사랑하는 자들아 우리가 일반으로 받은 구원에 관하여 내가 너희에게 편지하려는 생각이 간절하던 차에 <strong>성도에게 단번에 주신 믿음의 도를 위하여 힘써 싸우라</strong>는 편지로 너희를 권하여야 할 필요를 느꼈노니” (<a href="https://bibleox.com/ko/ko-nkrv/iud/1/#L3">유 1:3</a>)</p></blockquote><blockquote><p>“너희는 열매 없는 어둠의 일에 참여하지 말고 <strong>도리어 책망하라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ef/5/#L11">엡 5:11</a>)</p></blockquote><blockquote><p>“어떤 의심하는 자들을 긍휼히 여기라 또 어떤 자를 <strong>불에서 끌어내어 구원하라</strong> 또 어떤 자를 그 육체로 더럽힌 옷까지도 미워하되 두려움으로 긍휼히 여기라” (<a href="https://bibleox.com/ko/ko-nkrv/iud/1/#L22-23">유 1:22-23</a>) <em>(러시아어 시노달 번역은 일부 고대 사본을 따라 여기에 “책망하라”(ἐλέγχετε)를 넣습니다.)</em></p></blockquote><h2>마귀는 언제나 교회와 싸울 것입니다</h2><blockquote><p>“여호와 하나님이 뱀에게 이르시되 네가 이렇게 하였으니 네가 모든 가축과 들의 모든 짐승보다 더욱 저주를 받아 배로 다니고 살아 있는 동안 흙을 먹을지니라 <strong>내가 너로 여자와 원수가 되게 하고</strong> <strong>네 후손도 여자의 후손과 원수가 되게 하리니</strong> 여자의 후손은 네 머리를 상하게 할 것이요 너는 그의 발꿈치를 상하게 할 것이니라 하시고” (<a href="https://bibleox.com/ko/ko-nkrv/gen/3/#L14-15">창 3:14-15</a>)</p></blockquote><blockquote><p>“용이 자기가 땅으로 내쫓긴 것을 보고 남자를 낳은 여자를 박해하는지라 &lt;…&gt; <strong>용이 여자에게 분노하여 돌아가서 그 여자의 남은 자손</strong> 곧 하나님의 계명을 지키며 예수의 증거를 가진 자들과 <strong>더불어 싸우려고</strong> 바다 모래 위에 서 있더라” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/12/#L13,17">계 12:13,17</a>)</p></blockquote><h2>비판에 대한 답변</h2><h3>너희는 기적을 사모하지 않는다</h3><p>이단을 따르는 이들은 흔히 기적과 치유와 귀신 쫓기로 사람들을 자기 단체로 끌어들이려 합니다. 이를 위해 다음 구절을 씁니다:</p><blockquote><p>“사랑을 추구하며 <strong>신령한 것들을 사모하되</strong> 특별히 예언을 하려고 하라” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/14/#L1">고전 14:1</a>)</p></blockquote><p>같은 구절로 그들은 교회가 사모하지 않으므로 교회 안에 대대적인 기적이 나타나지 않는다고 나무랍니다.</p><p>그러나 사도들과 옛 그리스도인들에게는 보여 주기 위해서가 아니라 유익을 위해 기적을 행하는 능력이 넉넉히 주어졌습니다:</p><blockquote><p>“각 사람에게 성령을 나타내심은 <strong>유익하게 하려 하심이라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/12/#L7">고전 12:7</a>)</p></blockquote><p>적은 무리의 어부들이 짧은 생애 동안 온 세상에 설교를 전하려면 큰 도움이 필요했습니다. 사도들은 이 은사들이 그치리라고 경고했습니다:</p><blockquote><p>“사랑은 언제까지나 떨어지지 아니하되 <strong>예언도 폐하고 방언도 그치고</strong> 지식도 폐하리라” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/13/#L8">고전 13:8</a>)</p></blockquote><p>그리스도께서도 친히 표적을 구하는 것을 꾸짖으셨습니다:</p><blockquote><p>“예수께서 대답하여 이르시되 <strong>악하고 음란한 세대가 표적을 구하나</strong> 선지자 요나의 표적 밖에는 보일 표적이 없느니라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/12/#L39">마 12:39</a>)</p></blockquote><p>마지막 때에 거짓 선지자들은 바로 기적으로 사람들을 미혹할 것입니다:</p><blockquote><p>“거짓 그리스도들과 거짓 선지자들이 일어나 <strong>큰 표적과 기사를 보여 할 수만 있으면 택하신 자들도 미혹하리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/24/#L24">마 24:24</a>; <a href="https://bibleox.com/ko/ko-nkrv/mk/13/#L22">막 13:22</a>)</p></blockquote><p>그 결과 심판 때에 많은 신자가 그리스도의 이름으로 기적을 행하고 예언하고 귀신을 쫓아냈으니 구원받았다고 확신할 것입니다. 그러나 그들은 미혹되어 불법을 배운 것으로 드러났고, 그리스도께서는 그들을 모른다고 하시며 당신에게서 쫓아내십니다:</p><blockquote><p>“그 날에 많은 사람이 나더러 이르되 주여 주여 우리가 주의 이름으로 선지자 노릇 하며 주의 이름으로 귀신을 쫓아 내며 <strong>주의 이름으로 많은 권능을 행하지 아니하였나이까</strong> 하리니 그 때에 내가 그들에게 밝히 말하되 <strong>내가 너희를 도무지 알지 못하니</strong> 불법을 행하는 자들아 <strong>내게서 떠나가라</strong> 하리라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/7/#L22-23">마 7:22-23</a>)</p></blockquote><h3>너희에게는 사랑이 없다</h3><p>교회와 따로 떨어진 단체를 따르는 이들과 대화할 때, 흔히 논의하던 주제를 떠나 상대의 인격과 성품을 논하는 쪽으로 옮겨 가려는 방어적 반응이 나옵니다. 대개 어려운 질문 뒤에 그렇습니다. 아무리 조심스럽고 예의 바르게 말해도 다음과 같은 비난을 받을 수 있습니다:</p><ul><li><p>정죄한다;</p></li><li><p>교만하다;</p></li><li><p>사랑이 없다.</p></li></ul><p><strong>정죄한다</strong> — 이단 안에서는 구원받을 수 없다고 말하기 때문입니다. 그러나 사도도 이렇게 말하고(<a href="https://bibleox.com/ko/ko-nkrv/gal/5/#L20">갈 5:20</a>), 1세기부터 거룩한 교부들도 그렇게 말합니다(<a href="https://bibleox.com/ru/ru/w/7Ut6v4xr_Спасение_возможно_только_в_Церкви">구절</a> (러시아어)). 주님께서는 정죄하지 말라고 명하셨지만(<a href="https://bibleox.com/ko/ko-nkrv/lk/6/#L37">눅 6:37</a>), 한편으로 공의롭게 판단하라고 하셨습니다(<a href="https://bibleox.com/ko/ko-nkrv/in/7/#L24">요 7:24</a>).</p><p><strong>교만하다</strong> — <a href="https://bibleox.com/ru/ru/w/X7l9DcTY_Спасение_возможно_только_в_Церкви">구원은 그리스도의 교회, 곧</a> <a href="https://bibleox.com/ru/ru/w/Церковь">하나이며 눈에 보이고 일치된 교회 안에서만</a> 가능하다고 말하기 때문입니다. 그러나 성경도 이렇게 말합니다. 그리스도는 몸(교회)의 구주시며(<a href="https://bibleox.com/ko/ko-nkrv/ef/5/#L23">엡 5:23</a>), 그리스도 없이는 아무도 구원받지 못한다는 것입니다(<a href="https://bibleox.com/ru/ru/w/Иисус_Христос-единственный-спаситель-человечества">구절</a>). 거룩한 교부들도 같은 것을 말합니다(<a href="https://bibleox.com/ru/ru/w/7Ut6v4xr_Спасение_возможно_только_в_Церкви">구절</a> (러시아어)).</p><p><strong>사랑</strong>에 대해서는 이렇습니다. 그리스도인은 의심할 여지 없이 온유하고 겸손해야 하며 언제나 사랑으로 행해야 합니다. 그러나 그 사랑은 어떤 것일 수 있고 어떤 것이어야 합니까? 우리는 주 예수 그리스도와 사도들에게 사랑이 없다고 비난할 수 없습니다. 그런데 성경에서는 이런 가르침을 볼 수 있습니다:</p><blockquote><p>“내 아들아 여호와의 징계를 경히 여기지 말라 그 꾸지람을 싫어하지 말라 대저 <strong><mark>여호와께서 그 사랑하시는 자를 징계하시기를</mark></strong> 마치 아비가 그 기뻐하는 아들을 징계함 같이 하시느니라” (<a href="https://bibleox.com/ko/ko-nkrv/pr/3/#L11-12">잠 3:11-12</a>)</p></blockquote><blockquote><p>“<strong><mark>주께서 그 사랑하시는 자를 징계하시고</mark></strong> 그가 받아들이시는 아들마다 채찍질하심이라 하였으니” (<a href="https://bibleox.com/ko/ko-nkrv/evr/12/#L6">히 12:6</a>)</p></blockquote><blockquote><p>“<strong><mark>무릇 내가 사랑하는 자를 책망하여 징계하노니</mark></strong> 그러므로 네가 열심을 내라 회개하라” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/3/#L19">계 3:19</a>)</p></blockquote><blockquote><p>“볼지어다 <strong><mark>하나님께 징계 받는 자에게는 복이 있나니</mark></strong> 그런즉 너는 <strong>전능자의 징계를 업신여기지 말지니라</strong> 하나님은 아프게 하시다가 싸매시며 상하게 하시다가 그의 손으로 고치시나니” (<a href="https://bibleox.com/ko/ko-nkrv/iov/5/#L17-18">욥 5:17-18</a>)</p></blockquote><p>그러므로 모든 책망을 미움의 표현으로 여긴다면, 스스로 거짓을 드러냈을 뿐 아니라 다른 이들에게도 그렇게 하라고 부른 하느님과 사도들을 미움으로 고발하게 된다는 것을 기억해야 합니다:</p><blockquote><p>“너희는 열매 없는 어둠의 일에 참여하지 말고 <strong><mark>도리어 책망하라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ef/5/#L11">엡 5:11</a>)</p></blockquote><p>어떤 가르침이 거짓임을 보여 주려는 시도는 미움의 표현일 수도 있지만(어떤 이들은 실제로 교만과 미움으로 그렇게 합니다), 사랑의 표현, 이웃에 대한 배려, 그의 구원을 바라는 마음의 표현일 수도 있습니다:</p><blockquote><p>“내 형제들아 너희 중에 <strong>미혹되어 진리를 떠난 자를</strong> 누가 돌아서게 하면 너희가 알 것은 <strong>죄인을 미혹된 길에서 돌아서게 하는 자가 그의 영혼을 사망에서 구원할 것이며 허다한 죄를 덮을 것임이라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/iak/5/#L19-20">약 5:19-20</a>)</p></blockquote><p>누구도 모욕하지 않도록 애써야 하며, 대화가 인격 논의로 흐르지 않게 해야 합니다. 그러면 흔히 서로 정죄하기가 시작됩니다. 사람의 성품이 아니라 가르침에 대해 말해야 합니다.</p>'
