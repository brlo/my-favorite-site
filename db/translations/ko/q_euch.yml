  title: 성체성혈성사
  copy_cover: true
  body: '<h2>성체성혈성사의 제정</h2><p>주님이시며 하느님이신 예수 그리스도께서는 마지막 만찬에서 열두 사도만 모으시고 성체성혈성사를 세우셨습니다:</p><blockquote><p>“그들이 음식을 먹을 때에 예수께서 빵을 들어 축복하시고 제자들에게 나누어 주시며 ‘<strong>받아 먹어라. 이것은 내 몸이다</strong>’ 하시고 또 잔을 들어 감사의 기도를 올리시고 그들에게 돌리시며 ‘<strong>너희는 모두 이 잔을 받아 마셔라. 이것은 나의 피다</strong>. 죄를 용서해 주려고 많은 사람을 위하여 내가 흘리는 계약의 피다.” (<a href="https://bibleox.com/ko/ko-ctb/mf/26/#L26-28">마태 26:26-28</a>; <a href="https://bibleox.com/ko/ko-ctb/mk/14/#L22-24">마르 14:22-24</a>; <a href="https://bibleox.com/ko/ko-ctb/lk/22/#L19-20">루가 22:19-20</a>) <em>(비잔틴 본문(다수 사본)에는 “<strong>새로운</strong> 계약의 피”(τὸ τῆς καινῆς διαθήκης)라고 되어 있습니다.)</em></p></blockquote><p>구세주의 부활 뒤에 사도가 된 사도 바울로는 부활하신 예수 그리스도께 따로 직접 성찬 집전을 배웠습니다:</p><blockquote><p>“<strong>내가 여러분에게 전해 준 것은 주님께로부터 받은 것입니다</strong>. 곧 주 예수께서 잡히시던 날 밤에 빵을 손에 드시고 감사의 기도를 드리신 다음 빵을 떼시고 ‘<strong>이것은 너희들을 위하여 주는 내 몸이니</strong> 나를 기억하여 이 예를 행하여라’하고 말씀하셨습니다. 또 식후에 잔을 드시고 감사의 기도를 드리신 다음 ‘<strong>이것은 내 피로 맺는 새로운 계약의 잔이니</strong> 마실 때마다 나를 기억하여 이 예를 행하여라’하고 말씀하셨습니다.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/11/#L23-25">1고린 11:23-25</a>)</p></blockquote><h2>성체성혈성사를 통해 한 몸으로 결합합니다</h2><blockquote><p>“내 살은 참된 양식이며 내 피는 참된 음료이기 때문이다. <strong>내 살을 먹고 내 피를 마시는 사람은 내 안에서 살고 나도 그 안에서 산다</strong>. 살아 계신 아버지께서 나를 보내셨고 내가 아버지의 힘으로 사는 것과 같이 나를 먹는 사람도 나의 힘으로 살 것이다.” (<a href="https://bibleox.com/ko/ko-ctb/in/6/#L55-57">요한 6:55-57</a>)</p></blockquote><p>성사에 참여하는 이들은 참으로(실제로) 그리스도와, 또 그분의 몸 안에서 서로 결합합니다:</p><blockquote><p>“우리가 감사를 드리면서 <strong>그 축복의 잔을</strong> 마시는 것은 우리가 <strong>그리스도의 피를 나누어 머시는 것</strong>이 아니겠습니까?또 우리가 <strong>그 빵을 떼는 것은</strong> <strong>그리스도의 몸을 나누어 먹는 것</strong>이 아니겠습니까? <strong>빵은 하나이고 우리 모두가 그 한 덩어리의 빵을 나누어 먹는 사람들이니 비록 우리가 여럿이지만 모두 한 몸인 것입니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/10/#L16-17">1고린 10:16-17</a>)</p></blockquote><blockquote><p>“<strong>여러분은 다 함께 그리스도의 몸을 이루고 있으며</strong> 한 사람 한 사람은 그 지체가 되어 있습니다.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/12/#L27">1고린 12:27</a>)</p></blockquote><blockquote><p>“이렇게 여러분이 전에는 하느님과 멀리 떨어져 있었지만 이제는 <strong>그리스도께서 피를 흘리심으로써 그리스도 예수를 말미암아 하느님과 가까와졌습니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/ef/2/#L13">에페 2:13</a>)</p></blockquote><blockquote><p>“<strong>우리는 그리스도의 몸의 지체들입니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/ef/5/#L30">에페 5:30</a>) <em>(비잔틴 본문(다수 사본)에는 “그분의 <strong>살과 뼈로 된</strong>”이라는 말이 이어집니다.)</em></p></blockquote><p>자세히: <a href="https://bibleox.com/ru/ru/w/Церковь">그리스도와의 결합, 그분의 몸(교회)에 들어감</a>.</p><h2>성체성혈성사에 참여하지 않고는 구원이 불가능합니다</h2><blockquote><p>“예수께서는 다시 이렇게 말씀하셨다. ‘정말 잘 들어 두어라. <strong>만일 너희가 사람의 아들의 살과 피를 먹고 마시지 않으면 너희 안에 생명을 간직하지 못할 것이다</strong>. 그러나 내 살을 먹고 내 피를 마시는 사람은 영원한 생명을 누릴 것이며 내가 마지막 날에 그를 살릴 것이다. 내 살은 참된 양식이며 내 피는 참된 음료이기 때문이다. 내 살을 먹고 내 피를 마시는 사람은 내 안에서 살고 나도 그 안에서 산다. 살아 계신 아버지께서 나를 보내셨고 내가 아버지의 힘으로 사는 것과 같이 나를 먹는 사람도 나의 힘으로 살 것이다. 이것이 바로 하늘에서 내려 온 빵이다. 이 빵은 너희의 조상들이 먹고도 결국 죽어 간 그런 빵이 아니다. <strong>이 빵을 먹는 사람은 영원히 살 것이다</strong>.’” (<a href="https://bibleox.com/ko/ko-ctb/in/6/#L53-58">요한 6:53-58</a>)</p></blockquote><p>성체성혈성사를 통해 우리는 그리스도와 결합하고, 그리스도께서는 몸의 구세주이십니다:</p><blockquote><p>“그리스도께서 <strong><mark>당신의 몸인 교회의 구원자로서</mark></strong> 그 교회의 머리가 되시는 것처럼 남편은 아내의 주인이 됩니다.” (<a href="https://bibleox.com/ko/ko-ctb/ef/5/#L23">에페 5:23</a>)</p></blockquote><h2>성체는 예수 그리스도의 참된 살과 피입니다</h2><h3>빵은 그리스도께서 세상의 생명을 위하여 내어 주실 살입니다</h3><p>성체성혈성사에서 신자들은 그리스도께서 십자가에서 당신을 바쳐 세상의 생명을 위하여 내어 주신 예수 그리스도의 참된 몸과 참된 피를 받아 모십니다:</p><blockquote><p>“나는 생명의 빵이다. 너희의 조상들은 광야에서 만나를 먹고도 다 죽었지만 하늘에서 내려 온 이 빵을 먹는 사람은 죽지 않는다. 나는 하늘에서 내려 온 살아 있는 빵이다. 이 빵을 먹는 사람은 누구든지 영원히 살 것이다. <strong>내가 줄 빵은 곧 나의 살이다. 세상은 그것으로 생명을 얻게 될 것이다</strong>‘하고 말씀하셨다.” (<a href="https://bibleox.com/ko/ko-ctb/in/6/#L48-51">요한 6:48-51</a>)</p></blockquote><p>여기서 주님께서는 이 하늘의 빵이 당신이 <strong>지금</strong> 가지고 계시고 <strong>앞으로</strong> 세상의 생명을 위하여 내어 주실 당신의 살이라고 바로 말씀하십니다. 앞으로 처형에 내어 주실 것은 상징도 기념도 가르침도 아니라 그분의 실제 살입니다. 바로 이 하늘의 빵을 먹으라고 주시는 것입니다.</p><h3>계약의 피는 위대한 성물입니다</h3><p>계약의 피를 거룩하게 여기지 않고 은총의 성령을 모욕하는 사람은 가장 무거운 벌을 받게 됩니다:</p><blockquote><p>“모세의 율법을 무시한 자도 두 세 증인만 있으면 용서없이 사형을 받습니다. 그러니 <strong><mark>하느님의 아들을 짓밟고 자기를 거룩하게 해준 계약의 피를 더럽히고 은총의 성령을 모욕한 자가 받을 벌이야 얼마나 더 가혹하겠습니까</mark></strong>?” (<a href="https://bibleox.com/ko/ko-ctb/evr/10/#L28-29">히브 10:28-29</a>)</p></blockquote><blockquote><p>“<strong>성령을 모독하는 사람은</strong> 영원히 용서받지 못할 것이며 그 죄는 <strong>영원히 벗어날 길이 없을 것이다</strong>‘” (<a href="https://bibleox.com/ko/ko-ctb/mk/3/#L29">마르 3:29</a>)</p></blockquote><h3>사람의 아들의 살</h3><p>성체성혈성사를 말씀하시면서 그리스도께서는 당신의 인성을 강조하십니다:</p><blockquote><p>“예수께서는 다시 이렇게 말씀하셨다. ‘정말 잘 들어 두어라. 만일 너희가 <strong><mark>사람의 아들의 살과 피</mark></strong>를 먹고 마시지 않으면 너희 안에 생명을 간직하지 못할 것이다.” (<a href="https://bibleox.com/ko/ko-ctb/in/6/#L53">요한 6:53</a>)</p></blockquote><h3>합당하지 않게 영하는 이들에게 오는 병과 죽음</h3><p>영하기 전에 자신을 살펴야 합니다. 합당하지 않게 영하는 이들은 죄를 짓고 병들며 심지어 죽기까지 합니다:</p><blockquote><p>“그러니 올바른 마음가짐 없이 그 빵을 먹거나 주님의 잔을 마시는 사람은 주님의 몸과 피를 모독하는 죄를 범하는 것입니다. 각 사람은 자신을 살피고 나서 그 빵을 먹고 그 잔을 마셔야 합니다. 주님의 몸이 의미하는 바를 깨닫지 못하고 먹고 마시는 사람은 그렇게 먹고 마심으로써 <strong>자기 자신을 단죄하는 것입니다</strong>. <strong>여러분 중에 몸이 약한 자와 병든 자가 많고 죽은 자도 적지 않은 것도 이 때문입니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/11/#L27-30">1고린 11:27-30</a>) <em>(비잔틴 본문(다수 사본) 29절에는 “<strong>합당하지 않게</strong> 먹고 마시는 사람은”(ἀναξίως)이라고 되어 있습니다.)</em></p></blockquote><h2>성사를 위한 준비의 필요성</h2><blockquote><p>“<strong>각 사람은 자신을 살피고 나서</strong> 그 빵을 먹고 그 잔을 마셔야 합니다.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/11/#L28">1고린 11:28</a>)</p></blockquote><h2>교회에서 성체성혈성사는 예수 그리스도께서 오실 때까지 거행될 것입니다</h2><blockquote><p>“그러므로 여러분은 이 빵을 먹고 이 잔을 마실 때마다 주님의 죽으심을 선포하고, 이것을 <strong>주님께서 다시 오실 때까지</strong> 하십시오.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/11/#L26">1고린 11:26</a>)</p></blockquote><h2>성체성혈성사의 구약 예형</h2><h3>과월절 어린 양</h3><p>흠 없는 일 년 된 수컷 어린 양은 사람들의 죄를 위하여 실제로 <strong>죽고</strong>, 실제로 남김없이 <strong>먹혀야</strong> 했습니다. 어린 양이신 그리스도께서는 이 두 가지를 문자 그대로 이루십니다. 사람들의 죄를 위하여 실제로(비유가 아니라) 돌아가시고, 사람들은 실제로(비유가 아니라) 그분을 먹습니다.</p><blockquote><p>“너희는 이스라엘의 모든 회중에게 알려라. 이 달 십일에 사람마다 한 가문에 한 마리씩, 한 집에 한 마리씩 <strong>새끼 양을</strong> 마련해 놓아라. &lt;…&gt; <strong>흠이 없는 일년 된 수컷</strong>이면 양이든 염소든 상관없다. 너희는 그것을 이 달 십 사일까지 두었다가 <strong>이스라엘 온 회중이 모여서 해질 무렵에 잡도록 하여라</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/ish/12/#L3,5-6">출 12:3,5-6</a>; <a href="https://bibleox.com/ko/ko-ctb/ish/12/#L21-22,25">출 12:21-22,25</a>)</p></blockquote><blockquote><p>“<strong>그를 찌른 것은 우리의 반역죄요</strong>, 그를 으스러뜨린 것은 우리의 악행이었다. 그 몸에 채찍을 맞음으로 우리를 성하게 해 주었고 <strong>그 몸에 상처를 입음으로 우리의 병을 고쳐 주었구나</strong>. 우리 모두 양처럼 길을 잃고 헤매며 제 멋대로들 놀아났지만, <strong>야훼께서 우리 모두의 죄악을 그에게 지우셨구나</strong>. 그는 온갖 굴욕을 받으면서도 입 한번 열지 않고 참았다. <strong>도살장으로 끌려 가는 어린 양처럼</strong> 가만히 서서 털을 깎이는 어미 양처럼 결코 입을 열지 않았다.” (<a href="https://bibleox.com/ko/ko-ctb/is/53/#L5-7">이사 53:5-7</a>; <a href="https://bibleox.com/ko/ko-ctb/act/8/#L32">사도 8:32</a>)</p></blockquote><blockquote><p>“죽을 자리에 끌려 가면서도 아무 것도 모르는 <strong>어린 양처럼</strong>, 나는 사람들이 나를 해치려고 하는 줄을 몰랐었다. ‘나무가 싱싱할 때 찍어 버리자. 인간 세상에서 없애 버리자. 이름조차 남지 못하게 만들자’ 하며 음모를 꾸몄지만, 도무지 나는 알지 못하였다.” (<a href="https://bibleox.com/ko/ko-ctb/ier/11/#L19">예레 11:19</a>)</p></blockquote><blockquote><p>“다음 날 요한은 예수께서 자기한테 오시는 것을 보고 이렇게 말하였다. ‘<strong>이 세상의 죄를 없애시는 하느님의 어린 양</strong>이 저기 오신다. &lt;…&gt; 마침 예수께서 걸어 가시는 것을 보고 ’<strong>하느님의 어린 양</strong>이 저기 가신다‘하고 말하였다.” (<a href="https://bibleox.com/ko/ko-ctb/in/1/#L29,36">요한 1:29,36</a>)</p></blockquote><blockquote><p>“<strong>여러분은</strong> 조상들에게서 물려 받은 헛된 생활에서 <strong>해방되었습니다</strong>. 그러나 아시다시피 그것은 은이나 금 따위의 없어질 물건으로 값을 치르고 된 일이 아니라 <strong>흠도 티도 없는 어린 양의 피 같은 그리스도의 귀한 피로</strong> 얻은 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/1pet/1/#L18-19">1베드 1:18-19</a>)</p></blockquote><blockquote><p>“그들은 큰 소리로 ‘<strong>죽임을 당하신 어린 양</strong>은 권능과 부귀와 지혜와 힘과 영예와 영광과 찬양을 받으실 자격이 있으십니다’하고 외치고 있었습니다.” (<a href="https://bibleox.com/ko/ko-ctb/otkr/5/#L12">묵시 5:12</a>; <a href="https://bibleox.com/ko/ko-ctb/otkr/7/#L17">묵시 7:17</a>; <a href="https://bibleox.com/ko/ko-ctb/otkr/14/#L1">묵시 14:1</a>)</p></blockquote><h3>만나</h3><p>만나는 에집트의 종살이에서 약속의 땅으로 가는 길에 광야에서 유다 백성의 힘을 북돋아 주었습니다. 그들은 광야에서 실제로 만나를 먹었습니다. 만나는 실제로 사람들을 죽음에서 지켜 주고 생명을 주었습니다(광야에는 다른 음식이 없었습니다):</p><blockquote><p>“그러자 야훼께서 모세에게 말씀하셨다. ‘이제 <strong>내가 하늘에서 너희에게 먹을 것을 내려 줄 터이니</strong>, 백성들은 <strong>날마다</strong> 나가서 하루 먹을 것만 거두어 들이게 하여라. 이렇게 하여 이 백성이 나의 지시를 따르는지 따르지 않는지 시험해 보리라. &lt;…&gt; 이스라엘 사람들은 이것을 <strong>만나라고 이름지어 불렀다</strong>. 그것은 고수씨같이 희었고 맛은 벌꿀과자 같았다.” (<a href="https://bibleox.com/ko/ko-ctb/ish/16/#L4,31">출 16:4,31</a>)</p></blockquote><blockquote><p>“밤에 <strong>이슬이 내리면서</strong> 그들이 진을 친 곳에 <strong>만나도 함께 내리곤 하였다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/chis/11/#L9">민 11:9</a>)</p></blockquote><p>만나는 예표, 곧 앞으로 올 것의 그림자일 뿐 실체가 아니었으므로 영원한 생명을 주지 못하고 지상의 생명을 늘려 굶주림에서 구해 주었을 뿐입니다. 그 유다인들은 결국 다른 사람들처럼 죽었습니다. 그러나 그리스도께서는 당신을 먹는 사람은 영원히 살 것이라고 말씀하십니다:</p><blockquote><p>“그는 <strong>하늘에서 빵을 내려다가 그들을 먹이셨다</strong>는 성경 말씀대로 우리 조상들은 <strong>광야에서 만나를 먹었습니다</strong>‘하고 말했다. 예수께서는 이렇게 말씀하셨다. ’정말 잘 들어 두어라. 하늘에서 빵을 내려다가 너희를 먹인 사람은 모세가 아니다. 하늘에서 너희에게 진정한 빵을 내려 주시는 분은 내 아버지이시다. <strong>하느님께서 주시는 빵은 하늘에서 내려 오는 것이며 세상에 생명을 준다</strong>.‘ &lt;…&gt; 예수께서는 이렇게 대답하셨다. ’<strong>내가 바로 생명의 빵이다</strong>. 나에게 오는 사람은 결코 배고프지 않고 나를 믿는 사람은 결코 목마르지 않을 것이다. &lt;…&gt; <strong>나는 생명의 빵이다</strong>. 너희의 조상들은 <strong>광야에서 만나를 먹고도 다 죽었지만</strong> <strong>하늘에서 내려 온 이 빵을 먹는 사람은 죽지 않는다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/in/6/#L31-33,35,48-50">요한 6:31-33,35,48-50</a>)</p></blockquote><blockquote><p>“그러나 <strong>내 살을 먹고 내 피를 마시는 사람은 영원한 생명을 누릴 것이며</strong> 내가 마지막 날에 그를 살릴 것이다. 내 살은 참된 양식이며 내 피는 참된 음료이기 때문이다. &lt;…&gt; 살아 계신 아버지께서 나를 보내셨고 내가 아버지의 힘으로 사는 것과 같이 <strong>나를 먹는 사람도 나의 힘으로 살 것이다</strong>. 이것이 바로 하늘에서 내려 온 빵이다. <strong>이 빵은 너희의 조상들이 먹고도 결국 죽어 간 그런 빵이 아니다. 이 빵을 먹는 사람은 영원히 살 것이다</strong>.‘” (<a href="https://bibleox.com/ko/ko-ctb/in/6/#L54-55,57-58">요한 6:54-55,57-58</a>)</p></blockquote><p>더 나아가 에집트의 종살이에서 약속의 땅에 이르는 유다인들의 모든 여정을 죄의 종살이에서 하늘 나라에 이르는 그리스도인의 여정으로 본다면, 여기서도 만나는 문자 그대로 성체성혈성사를 가리킵니다:</p><ul><li><p>실제 에집트의 포로 생활 — 실제 죄의 종살이.</p></li><li><p>바다 밑을 지난 실제 탈출 — 실제 세례(<a href="https://bibleox.com/ko/ko-ctb/1kor/10/#L2">1고린 10:2</a>).</p></li><li><p>실제 사십 년 광야 생활 — 교회 안의 실제 지상 생활.</p></li><li><p>실제 만나와 물 — 하느님께서 주시는 구세주의 실제 살과 피.</p></li><li><p>유다인들에게 약속된 실제 땅 — 이제는 지상이 아니라 하늘의 실제 나라.</p></li></ul><h3>마라의 단 물</h3><blockquote><p>“모세는 이스라엘 사람들을 거느리고 홍해바다에서 수르 광야로 진을 옮겼다. 그들은 사흘 동안 가면서도 물을 만나지 못하다가 마라에 다다랐으나 그 곳 물은 써서 마실 수가 없었다. 그래서 그 고장을 마라라고 불렀다. 백성들은 모세에게, 무엇을 마시라는 말이냐고 하면서 투덜거렸다 모세가 야훼께 부르짖자, 야훼께서 <strong>나무 한 그루를 보여 주셨다. 그 나무를 물에 던지니 단 물이 되었다</strong>. 야훼께서는 바로 여기에서 그들이 지켜야 할 규칙을 주시고 그들을 시험해 보셨다.” (<a href="https://bibleox.com/ko/ko-ctb/ish/15/#L22-25">출 15:22-25</a>)</p></blockquote><h3>집 입구에 어린 양의 피를 바름</h3><p>집 입구에 피를 바르는 일은 죽음에서 구해 주었습니다:</p><blockquote><p>“그리고 <strong>그 피를 받아, 그것을 문설주와 문 상인방에 바르라고</strong> 하여라. &lt;…&gt; 우슬초 묶음을 가져다가 <strong>대야에 받은 피를 묻혀 문 상인방과 좌우 문설주에 바르시오</strong>. 아침까지 아무도 문 밖으로 나가서는 안되오. 야훼께서 에집트인들을 치며 지나가시다가 <strong>문 상인방과 좌우 문설주에 바른 피를 보시고는 그 문을 그냥 지나가시고 파괴자를 당신들의 집에 들여 보내어 치게 하는 일이 없게 하실 것이오</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/ish/12/#L7,22-23">출 12:7,22-23</a>)</p></blockquote><h3>죄를 깨끗하게 하는 제단의 숯불</h3><p>예언자 이사야의 죄는 제단에서 가져온 뜨거운 숯이 입술에 닿음으로써 깨끗해졌습니다:</p><blockquote><p>“내가 부르짖었다. ‘큰일났구나. 이제 나는 죽었다. <strong>나는 입술이 더러운 사람</strong>, 입술이 더러운 사람들 틈에 끼어 살면서 만군의 야훼, 나의 왕을 눈으로 뵙다니...’ 그러자 스랍들 가운데 하나가 <strong>제단에서 뜨거운 돌을 불집게로 집어</strong> 가지고 날아 와서 <strong>그것을 내 입에 대고 말하였다. ‘보아라, 이제 너의 입술에 이것이 닿았으니 너의 악은 가시고 너의 죄는 사라졌다</strong>.’” (<a href="https://bibleox.com/ko/ko-ctb/is/6/#L5-7">이사 6:5-7</a>)</p></blockquote><h3>나무의 열매를 먹음</h3><p>인류는 나무 열매를 실제로 먹고 하느님에게서 떨어져 나갔습니다(<a href="https://bibleox.com/ko/ko-ctb/gen/3/#L6">창 3:6</a>). 그러므로 인류는 십자가 나무의 열매를 먹음으로써 하느님께 돌아갑니다. 사람은 불순종의 나무를 통해 하느님에게서 떠났고, 십자가의 순종의 나무를 통해 돌아갑니다(<a href="https://bibleox.com/ko/ko-ctb/fil/2/#L8">필립 2:8</a>; <a href="https://bibleox.com/ko/ko-ctb/mf/16/#L24">마태 16:24</a>). 나무 열매가 생명을 앗아 갔고, 나무 열매가 생명을 돌려줍니다. 사람은 나간 문으로 다시 들어옵니다. 그때 주님께서는 “먹지 말아라”(<a href="https://bibleox.com/ko/ko-ctb/gen/2/#L17">창 2:17</a>) 하셨으나 그들은 먹었습니다. 이제는 “받아 먹어라”(<a href="https://bibleox.com/ko/ko-ctb/mf/26/#L26">마태 26:26</a>) 하시는데, 많은 이들이 같은 잘못을 반대로 되풀이하여 먹지 않습니다. 그때나 지금이나 이 계명을 지키는 일은 어렵지 않았는데도 말입니다:</p><blockquote><p>“<strong>죽지 않으려거든</strong> 이 동산 한가운데 있는 나무 열매만은 <strong>따먹지도 말고</strong> 만지지도 말라고 하셨다.‘” (<a href="https://bibleox.com/ko/ko-ctb/gen/3/#L3">창 3:3</a>; <a href="https://bibleox.com/ko/ko-ctb/gen/2/#L17">창 2:17</a>)</p></blockquote><blockquote><p>“그들이 음식을 먹을 때에 예수께서 빵을 들어 축복하시고 제자들에게 나누어 주시며 ‘<strong>받아 먹어라</strong>. 이것은 내 몸이다’ 하시고” (<a href="https://bibleox.com/ko/ko-ctb/mf/26/#L26">마태 26:26</a>; <a href="https://bibleox.com/ko/ko-ctb/in/6/#L58">요한 6:58</a>)</p></blockquote><h3>감사의 화목제</h3><p>구약에는 두 종류의 화목제가 있습니다:</p><ul><li><p>찬양의 제사 (תודה, 토다);</p></li><li><p>감사(또는 구원)의 제사 (셀라밈 또는 נדר, 네데르).</p></li></ul><p>화목제에는 빵과 짐승 제물을 함께 바쳤습니다. 찬양의 화목제는 누룩 없는 빵으로 바쳤고, 거기에 더하여 감사의 화목제를 바칠 때에는 누룩 든 빵으로 바쳤습니다:</p><blockquote><p>“그리고 이런 예물은 <strong>누룩 넣은 빵과자</strong>를 곁들이고 받은 축복이 고마와서 드리는 희생제물을 얹어서 바쳐야 한다.” (<a href="https://bibleox.com/ko/ko-ctb/lev/7/#L13">레 7:13</a>)</p></blockquote><p>신약에서 하느님께 빵을 바치는 성사는 “에우카리스티아”(그리스어로 감사)라고 불립니다. 그리스도께서 친히 제자들에게 주시기 전에 하느님께 감사드리고 빵을 축복하셨기 때문입니다 (<a href="https://bibleox.com/ko/ko-ctb/lk/22/#L19">루가 22:19</a>; <a href="https://bibleox.com/ko/ko-ctb/1kor/11/#L23-24">1고린 11:23-24</a>).</p><p>곧 정교회의 성체성혈성사에서는 오늘날 문자 그대로 이렇게 합니다:</p><ul><li><p>누룩 든 빵을 취합니다;</p></li><li><p>감사를 드립니다;</p></li><li><p>다만 희생 짐승을 함께 바치지 않습니다. 희생 제물, 어린 양, 과월절은 십자가에 달리시고 부활하신 그리스도이시기 때문입니다.</p></li></ul><p>누룩 없는 빵은 고난의 빵(«ἄζυμα, ἄρτον κακώσεως», <a href="https://bibleox.com/ko/ko-ctb/vtor/16/#L3">신 16:3</a>)이라 불리고, 누룩 든 빵을 바치는 화목제는 감사의 제사 또는 구원의 제사(תֹּודַ֥ת — 감사, σωτηρίου — 구원, <a href="https://bibleox.com/ko/ko-ctb/lev/7/#L13">레 7:13</a>)라고 불린다는 점에 주목할 만합니다.</p><p>참고: 제물의 고기는 그날 아침까지 남기지 않고 먹거나(과월절처럼) 이틀에 걸쳐 먹을 수 있었지만, 사흘째까지 남겨 두는 것은 엄격히 금지되었습니다. 사흘째까지 다 먹지 못하면 남은 것을 태워야 했고, 그렇지 않으면 제물은 하느님께 거부되고 부정과 죄가 되었습니다. 이는 구세주의 부활을 가리킵니다. 사흘째 날에 무덤은 비어 있었습니다. 곧 이 경우 누룩 든 빵은 신약, 구세주의 부활에 속합니다.</p><h2>사물의 본성이 바뀜</h2><ul><li><p>지팡이가 뱀으로, 다시 지팡이로 (<a href="https://bibleox.com/ko/ko-ctb/ish/4/#L3-4">출 4:3-4</a>; <a href="https://bibleox.com/ko/ko-ctb/ish/7/#L9-10,15">출 7:9-10,15</a>);</p></li><li><p>물이 피로 (<a href="https://bibleox.com/ko/ko-ctb/ish/7/#L17,19-21">출 7:17,19-21</a>);</p></li><li><p>물이 포도주로 (<a href="https://bibleox.com/ko/ko-ctb/in/2/#L7-10">요한 2:7-10</a>).</p></li></ul><h2>빵과 포도주의 축복</h2><p>처음에 무에서 우주를 창조하시고, 온 세상에 홍수를 일으키시고, 해를 멈추시고, 어디서나 기적으로 먹을 것과 물을 주시고, 강과 바다를 가르시고, 사물의 본성을 여러 번 바꾸시고(지팡이, 물), 사람이 되시어 축복으로 빵과 물고기를 늘리시고(<a href="https://bibleox.com/ko/ko-ctb/mf/14/#L15-21">마태 14:15-21</a>; <a href="https://bibleox.com/ko/ko-ctb/mf/15/#L32-38">마태 15:32-38</a>; <a href="https://bibleox.com/ko/ko-ctb/mk/6/#L35-44">마르 6:35-44</a>; <a href="https://bibleox.com/ko/ko-ctb/mk/8/#L1-9">마르 8:1-9</a>; <a href="https://bibleox.com/ko/ko-ctb/lk/9/#L12-17">루가 9:12-17</a>; <a href="https://bibleox.com/ko/ko-ctb/in/6/#L5-13">요한 6:5-13</a>), 나면서부터 소경인 사람에게 눈을 만들어 주시고, 썩어 가던 라자로의 살을 되살리신 비물질적인 하느님께서 제자들과의 과월절 만찬에서 빵과 포도주를 나누어 주셨을 뿐 아니라 기도하신 뒤 <strong>그것을 축복하시고</strong> 당신의 살과 피라고 부르셨습니다:</p><blockquote><p>“그들이 음식을 먹을 때에 예수께서 빵을 들어 <strong>축복하시고</strong> 제자들에게 나누어 주시며 ‘받아 먹어라. <strong>이것은 내 몸이다</strong>’ 하시고 또 잔을 들어 감사의 기도를 올리시고 그들에게 돌리시며 ‘너희는 모두 이 잔을 받아 마셔라. <strong>이것은 나의 피다</strong>. 죄를 용서해 주려고 많은 사람을 위하여 내가 흘리는 계약의 피다.” (<a href="https://bibleox.com/ko/ko-ctb/mf/26/#L26-28">마태 26:26-28</a>)</p></blockquote><p>이 축복을 사소하고 공허한 것으로 이해할 수는 없습니다.</p><h2>성체성혈성사에 관한 구약의 예언</h2><blockquote><p>“<strong>지혜가</strong> 일곱 기둥을 세워 제 집을 짓고 <strong>소를 잡고 술을 따라</strong> 손수 잔치를 베푼다. 시녀들을 내보내어 마을 언덕에서 외치게 한다. 어리석은 이여, 이리 들어 오시오.‘ 그리고 속없는 사람을 이렇게 초대한다. <strong>와서 내가 차린 음식을 먹고 내가 빚은 술을 받아 마시지 않겠소</strong>? 복되게 살려거든 철없는 짓을 버리고 슬기로운 길에 나서 보시오.’” (<a href="https://bibleox.com/ko/ko-ctb/pr/9/#L1-6">잠언 9:1-6</a>)</p></blockquote><blockquote><p>“<strong>너희 목마른 자들아, 오너라. 여기에 물이 있다</strong>. 너희 먹을 것 없는 자들아, 오너라. 돈 없이 양식을 <strong>사서 먹어라</strong>. 값 없이 술과 젖을 사서 마셔라. 그런데 어찌하여 돈을 써 가며 <strong>양식도 못되는 것을</strong> 얻으려 하느냐? 애써 번 돈을 <strong>배부르게도 못하는 데</strong> 써 버리느냐? 들어라, 나의 말을 들어 보아라. 맛좋은 음식을 먹으며 기름진 것을 푸짐하게 먹으리라. 귀를 기울이고 나에게로 오너라. 나의 말을 들어라. 너희에게 생기가 솟으리라. 내가 너희와 <strong>영원한 계약</strong>을 맺으리라. 다윗에게 약속한 호의를 지키리라.” (<a href="https://bibleox.com/ko/ko-ctb/is/55/#L1-3">이사 55:1-3</a>)</p></blockquote><blockquote><p>“<strong>지혜</strong>는 스스로를 찬양하고 자기 백성 가운데서 자랑한다. … <strong>나를 바라는 이들아, 내게로 와서 내 열매로 배불러라. 나를 먹는 이들은 더욱 배고프고, 나를 마시는 이들은 더욱 목마르리라</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/prsir/24/#L1,19,21">집회 24:1,19,21</a>, 그리스어에서 번역)</p></blockquote><h2>비판</h2><h3>그리스도를 문에 비유한 것은 비유적 표현인가?</h3><p>그리스도께서는 군중에게 말씀하시며 당신을 양 우리의 문에 비유하십니다:</p><blockquote><p>“예수께서 또 말씀하셨다. ‘정말 잘 들어 두어라. <strong>나는 양이 드나드는 문이다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/in/10/#L7">요한 10:7</a>)</p></blockquote><p>그리스도께서 당신을 비유로 문이라 하셨으니, 성체성혈성사의 살과 피에 관한 말씀도 비유로 이해해야 하겠습니까? 전혀 그렇지 않습니다. 문에 비유하시기 전에 구세주께서는 문으로 양 우리에 들어가는 목자와 다른 데로 넘어 들어오는 도둑의 비유를 말씀하셨습니다. 문에 비유하심으로써 구세주께서는 이 비유를 마무리하며 군중에게 풀이해 주신 것뿐입니다. 그리스도께서는 군중에게 언제나 비유로 말씀하셨고, 제자들에게는 따로 모든 것을 풀이해 주셨습니다:</p><blockquote><p>“제자들이 예수께 와서 ‘<strong>저 사람들에게는 왜 비유로 말씀하십니까</strong>?’ 하고 묻자 예수께서 이렇게 대답하셨다. ‘<strong>너희는 하늘 나라의 신비를 알 수 있는 특권을 받았지만 다른 사람들은 받지 못하였다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/mf/13/#L10-11">마태 13:10-11</a>)</p></blockquote><blockquote><p>“<strong>내가 그들에게 비유로 말하는 이유는</strong> 그들이 보아도 보지 못하고 <strong>들어도 듣지 못하고 깨닫지도 못하기 때문이다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/mf/13/#L13">마태 13:13</a>)</p></blockquote><blockquote><p>“예수께서는 이렇게 대답하셨다. ‘너희에게는 하느님 나라의 신비를 알게 해 주었지만 <strong>다른 사람들에게는 모든 것을 비유로 들려 준다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/mk/4/#L11">마르 4:11</a>)</p></blockquote><blockquote><p>“예수께서는 그들이 알아 들을 수 있을 정도로 이와 같은 여러 가지 비유로써 말씀을 전하셨다. 그들에게는 이렇게 비유로만 말씀하셨지만 <strong><mark>제자들에게는 따로 일일이 그 뜻을 풀이해 주셨다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/mk/4/#L33-34">마르 4:33-34</a>)</p></blockquote><p>시온의 다락방에서 <strong>제자들만 있을 때</strong> 성체성혈성사를 말씀하시면서 그리스도께서는 비유를 덧붙이지 않으셨습니다. 더구나 몸과 피에 관한 비유는 없었습니다. 곧 그리스도께서는 비유가 아니라 문자 그대로 말씀하셨습니다. 군중에게 말씀하실 때도 성체성혈성사에 관한 말씀에 비유를 덧붙이지 않으셨습니다. 그분은 구약의 만나 이야기에서 시작하셨습니다. 이것은 비유가 아니라 실제입니다. 유다인들은 죽지 않으려고 실제로 만나를 먹었습니다. 주님께서는 만나가 예표일 뿐임을 듣는 이들에게 알려 주시려고, 그들이 만나를 먹었어도 굶주림에서 구원받았을 뿐 결국 모든 사람처럼 죽었지만, 당신을 먹는 사람은 죽지 않을 것이라고 말씀하십니다(이것은 이미 예표가 아니라 예표가 가리키던 것, 곧 영원한 생명을 주는 참된 하늘의 빵이기 때문입니다):</p><blockquote><p>“살아 계신 아버지께서 나를 보내셨고 내가 아버지의 힘으로 사는 것과 같이 나를 먹는 사람도 나의 힘으로 살 것이다. <strong>이것이 바로 하늘에서 내려 온 빵이다. 이 빵은 너희의 조상들이 먹고도 결국 죽어 간 그런 빵이 아니다. 이 빵을 먹는 사람은 영원히 살 것이다</strong>.‘” (<a href="https://bibleox.com/ko/ko-ctb/in/6/#L57-58">요한 6:57-58</a>)</p></blockquote><h3>“포도로 빚은 것을 나는 결코 마시지 않겠다”</h3><p>어떤 이들은 마지막 만찬에서 포도나무 열매에 관해 하신 그리스도의 말씀을 들어 성체성혈성사의 살과 피를 실제로 이해하는 것에 반대합니다.</p><p>포도나무 열매에 관해서는 세 복음사가, 마태오, 마르코, 루가가 말합니다(<a href="https://bibleox.com/ko/ko-ctb/mf/26/#L29">마태 26:29</a>; <a href="https://bibleox.com/ko/ko-ctb/mk/14/#L25">마르 14:25</a>; <a href="https://bibleox.com/ko/ko-ctb/lk/22/#L18">루가 22:18</a>). 복음사가 루가는 마르코와 마태오와 달리 만찬을 더 자세히 묘사하여 여러 잔을 마신 것을 언급합니다:</p><h4>첫째 잔</h4><blockquote><p>“내가 고난을 당하기 전에 너희와 이 과월절 음식을 함께 나누려고 얼마나 별려 왔는지 모른다. 잘 들어 두어라. 나는 과월절 음식의 본뜻이 하느님 나라에서 성취되기까지는 이 과월절 음식을 다시는 먹지 않겠다‘하고 말씀하셨다. 그리고 <strong><mark>잔을 들어</mark></strong> 감사의 기도를 올리신 다음 ’자, <strong><mark>이 잔을 받아 나누어 마셔라</mark></strong>. 잘 들어라. 이제부터 하느님 나라가 올 때까지는 포도로 빚은 것을 나는 결코 마시지 않겠다‘ 하시고는” (<a href="https://bibleox.com/ko/ko-ctb/lk/22/#L15-18">루가 22:15-18</a>)</p></blockquote><p>그리스도께서는 잔을 제자들에게 나누라고 명하십니다. 이 잔은 나누어 마셔집니다. 아직 성체성혈성사도, 몸과 피에 관한 말씀도 없었습니다. 그것은 과월절 음식일 뿐이었습니다. 이 포도주 잔 뒤에 그리스도께서는 곧바로, 더는 마시지 않겠다는 포도나무 열매에 관한 말씀을 하십니다:</p><blockquote><p>“잘 들어라. 이제부터 하느님 나라가 올 때까지는 <strong>포도로 빚은 것을 나는 결코 마시지 않겠다</strong>‘ 하시고는” (<a href="https://bibleox.com/ko/ko-ctb/lk/22/#L18">루가 22:18</a>)</p></blockquote><p>그리고 <strong>음식을 나눈 뒤에야</strong>(<a href="https://bibleox.com/ko/ko-ctb/lk/22/#L20">루가 22:20</a>; <a href="https://bibleox.com/ko/ko-ctb/1kor/11/#L25">1고린 11:25</a>) 그리스도께서는 빵을 드시고 다시 잔을 드시어(첫 잔은 이미 마셨으므로 다른 잔입니다) 성체성혈성사를 행하시고 제자들에게 주시며, 그제야 당신의 몸과 피를 말씀하십니다:</p><h4>둘째 잔</h4><blockquote><p>“또 <strong>빵을 들어 감사 기도를 올리신 다음 그것을 떼어 제자들에게 주시며</strong> ‘이것은 너희를 위하여 내어 주는 내 몸이다. 나를 기념하여 이 예식을 행하여라’하고 말씀하셨다. <strong><mark>음식을 나눈 뒤에 또 그와 같이 잔을 들어 ‘이것은 내 피로 맺는 새로운 계약의 잔이다</mark></strong>. 나는 너희를 위하여 이 피를 흘리는 것이다’ 하셨다.” (<a href="https://bibleox.com/ko/ko-ctb/lk/22/#L19-20">루가 22:19-20</a>)</p></blockquote><p>이처럼 첫 부분에는 유다인의 전통적인 과월절 음식만 있습니다. 그때에는 반드시 물을 탄 <strong>포도주 네 잔</strong>을 마시며 하느님께 감사드렸습니다. 성경에는 이 네 잔을 마시라는 명령이 없습니다. 이것은 유다인의 관습일 뿐이었습니다. 유다인의 과월절 관습은 미쉬나에 더 자세히 나옵니다:</p><p><strong>미쉬나 제1조</strong></p><blockquote><p>(א) עַרְבֵי פְסָחִים סָמוּךְ לַמִּנְחָה, לֹא יֹאכַל אָדָם עַד שֶׁתֶּחְשַׁךְ. וַאֲפִלּוּ עָנִי שֶׁבְּיִשְׂרָאֵל לֹא יֹאכַל עַד שֶׁיָּסֵב. וְלֹא יִפְחֲתוּ לוֹ מֵאַרְבָּעָה כוֹסוֹת שֶׁל יַיִן, וַאֲפִלּוּ מִן הַתַּמְחוּי</p><p>과월절 전날 오후 제사 무렵부터 어두워질 때까지 사람은 음식을 먹어서는 안 된다. 이스라엘에서 가장 가난한 사람이라도 비스듬히 기대어 앉기 전에는 먹어서는 안 된다. 구호 식당에서 음식을 얻는 사람이라도 <strong>포도주 네 잔보다 적게 주어서는 안 된다</strong>.</p></blockquote><p>(<a href="https://toldot.com/articles/articles_30013.html">미쉬나 페사힘 10</a>, 러시아어)</p><p>처음에 그리스도께서는 이 관습만 행하십니다. 잔을 드시어 감사하시고 제자들에게 주시며, 이것이 당신의 피라는 말씀은 하지 않으시고 그들끼리 나누라고 하십니다. 그들은 분명 그렇게 하였습니다. 잔은 비워졌습니다. 처음에는 빵에 관한 언급이 없습니다. 만찬 뒤에야 빵이 언급되고 잔이 다시 언급되며, 그제야 그리스도의 몸과 피에 관한 말씀이 나옵니다. 그러므로 포도나무 열매에 관한 말씀은 첫째 포도주 잔에 관한 것이고, 그리스도의 피에 관한 말씀은 둘째 잔에 관한 것입니다. 이 잔에서는 신비로운 방식으로 더는 포도주가 아니라 우리가 믿는 그리스도의 참된 피가 제자들에게 주어졌습니다.</p><h3>“살리는 것은 영이요 육은 아무 쓸모가 없다”</h3><p>정교회의 성체성혈성사 가르침을 반대하는 이들은 그리스도께서 당신 살을 먹는 일을 상징으로만 말씀하셨다고 주장하며 다음 말씀을 듭니다:</p><blockquote><p>“<strong>육적인 것은 아무 쓸모가 없지만</strong> 영적인 것은 생명을 준다. 내가 너희에게 한 말은 영적인 것이며 생명이다.” (<a href="https://bibleox.com/ko/ko-ctb/in/6/#L63">요한 6:63</a>) <em>(그리스어 원문은 τὸ πνεῦμά ἐστιν τὸ ζῳοποιοῦν, ἡ σὰρξ οὐκ ὠφελεῖ οὐδέν — “살리는 것은 영이요 <strong>육은</strong> 아무 쓸모가 없다”입니다.)</em></p></blockquote><p>상징설을 주장하는 이들은 이 구절을 그리스도의 살을 먹는 일이 아무 유익도 없다는 뜻으로 설명합니다.</p><p>그러나 우리는 “육은 아무 쓸모가 없다”는 말씀이 아무 유익이 없는 육적인 생각에 관한 것임을 보여 줍니다. 이는 오로지 땅의 것만, 거칠고 일상적으로, 자기 삶에서 보아 온 방식으로만 생각하여 영적인 신비로 정신을 들어 올리지 못하는 사람들에 관한 말씀입니다[1].</p><p>성경의 다른 많은 곳에서도 오로지 땅의 것만 생각하는 사람들에 관해 이런 말이 쓰입니다:</p><blockquote><p>“예수께서는 ‘시몬 바르요나, <strong>너에게 그것을 알려 주신 분은 사람이 아니라</strong> 하늘에 계신 내 아버지시니 너는 복이 있다.” (<a href="https://bibleox.com/ko/ko-ctb/mf/16/#L17">마태 16:17</a>) <em>(“사람”은 그리스어 원문에서 σὰρξ καὶ αἷμα — “<strong>살과 피</strong>”입니다.)</em></p></blockquote><blockquote><p>“당신의 아들을 이방인들에게 널리 알리게 하시려고 기꺼이 그 아들을 나에게 나타내 주셨습니다. 그 때 <strong>나는 어떤 사람과도 상의하지 않았고</strong>” (<a href="https://bibleox.com/ko/ko-ctb/gal/1/#L16">갈라 1:16</a>) <em>(“어떤 사람”은 그리스어 원문에서 σαρκὶ καὶ αἵματι — “<strong>살과 피</strong>”입니다.)</em></p></blockquote><blockquote><p>“여러분은 그렇게도 어리석은 사람들입니까? <strong>성령의 힘으로 시작한 일을 지금 와서 인간의 힘으로 마치려 드는 것입니까</strong>?” (<a href="https://bibleox.com/ko/ko-ctb/gal/3/#L3">갈라 3:3</a>) <em>(“인간의 힘”은 그리스어 원문에서 σαρκί — “<strong>육</strong>”입니다.)</em></p></blockquote><blockquote><p>“야훼가 하는 말이다. 나에게서 마음이 멀어져 사람을 믿는 자들, <strong>사람이 힘이 되어 주려니 하고 믿는 자들은 천벌을 받으리라</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/ier/17/#L5">예레 17:5</a>) <em>(“사람”은 히브리어 원문에서 בָּשָׂר — “<strong>육</strong>”입니다.)</em></p></blockquote><p>그런 사람들은 자기 앞에 있는 분이 평범한 사람, 요셉의 아들이라고 생각했습니다. 평범한 사람이 어떻게 자기 살을 먹으라고 줄 수 있겠습니까? 자기 몸에서 떼어 먹을 것으로 주는 수밖에 없습니다. 이런 생각은 그들에게 아무 유익이 없었습니다. 그들은 몹시 당황하여 “이렇게 말씀이 어려워서야 누가 알아들을 수 있겠는가?”(<a href="https://bibleox.com/ko/ko-ctb/in/6/#L60">요한 6:60</a>) 하고는 떠나갔습니다.</p><p>그러나 그리스도께서는 보통 사람이 아니라 전능하신 하느님이십니다. 그분은 빵과 포도주의 형상 아래 당신의 생명을 주는 살과 피가 신비롭게 주어지는 성사를 세우시며, 이는 하느님의 능력으로 이루어집니다. 이를 위해서는 영적으로 생각하여, 정신으로 언제나 이해할 수는 없는 일이 신비롭게 이루어질 여지, 땅의 질서를 넘어서는 그리스도의 말씀이 초자연적으로 이루어질 여지를 남겨 두어야 합니다:</p><blockquote><p>“예수께서는 다시 이렇게 말씀하셨다. ‘정말 잘 들어 두어라. <strong>만일 너희가 사람의 아들의 살과 피를 먹고 마시지 않으면 너희 안에 생명을 간직하지 못할 것이다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/in/6/#L53">요한 6:53</a>)</p></blockquote><h3>왜 “하느님을 먹는다”고 합니까?</h3><p>무슬림은 이렇게 묻습니다. 개신교 신자들은 정교회에 조금 다른 형태로 묻지만 본질은 같습니다.</p><p>이 물음에 대한 답은 길어질 수 있지만, 여기서는 핵심만 말하겠습니다. 영성체는 사람을 하느님이신 그리스도와 가장 가깝게, 영적으로만이 아니라 육체적으로도 결합시킵니다. 하느님께서는 사람을 영혼으로만이 아니라 육체로도 창조하셨기 때문입니다.</p><p>사실 아담과 하와를 제외한 모든 사람은 이 세상에 생겨나는 순간부터 다른 사람의 몸, 곧 어머니의 몸으로 양분을 얻어 왔습니다. 그렇게 하지 않으면 생명을 가질 수도 자라고 발달할 수도 없고 틀림없이 죽을 것입니다. 수정란이 착상하지 못할 때 그런 일이 일어납니다.</p><p>아기가 태어날 때 그 몸은 어머니의 몸으로 이루어져 있습니다. 어머니의 몸은 자신을 내어 주어 아기에게 생명을 주었고, 어머니와 아기는 육체적으로 결합되어 있었습니다. 태어난 뒤에도 아기는 오랫동안 어머니의 몸으로 양분을 얻습니다. 젖은 어머니의 몸에서 그 피로 만들어지기 때문입니다. 그런 뜻에서 젖은 어머니의 피입니다.</p><p>이 두 과정(출산과 성체성혈성사)을 세우신 분은 하느님이십니다.</p><p>하느님께서 창조하신 사람의 본성과 출생과 양육의 과정을 알게 되면, 성체성혈성사에서 비슷한 과정을 보고 놀랄 이유가 없습니다. 거기서 우리는 어머니의 몸이 아니라 하느님이신 그리스도의 몸으로 양육되어, 영적으로뿐 아니라 육체적으로도 하느님과 결합합니다. 곧 영과 몸으로 그리스도와 온전히 결합합니다:</p><blockquote><p>“<strong><mark>우리는 그리스도의 몸의 지체들입니다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/ef/5/#L30">에페 5:30</a>) <em>(비잔틴 본문(다수 사본)에는 “그분의 <strong>살과 뼈로 된</strong>”(ἐκ τῆς σαρκὸς αὐτοῦ καὶ ἐκ τῶν ὀστέων αὐτοῦ)이라는 말이 이어집니다.)</em></p></blockquote>'
  title_sub: 주 예수 그리스도의 몸과 피를 모시는 성사에 관한 성경 구절
  meta_desc: 성체성혈성사에 관한 성경 구절
