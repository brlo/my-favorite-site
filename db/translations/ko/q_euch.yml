    parent: 교회/성사
    title: 성체성혈성사
    priority: 1
  references: "<ol><li><p><strong>성 요한 크리소스토모스:</strong> “그 뒤 그리스도께서는 그들의 어려움에 또 다른 해답을 주시며 ‘살리는 것은 영이요 육은 아무 쓸모가 없다’(6:63)고 말씀하십니다. 곧 나에 관해 하는 말은 영적으로 들어야 하며, 육적으로 듣는 사람은 아무것도 얻지 못하고 유익을 받지 못한다는 뜻입니다. 어떻게 그분이 하늘에서 내려오셨는가 의심하고, 그분을 요셉의 아들로 생각하고, ‘이 사람이 어떻게 자기 살을 우리에게 먹으라고 줄 수 있단 말인가?’(6:52) 하고 묻는 것은 육적으로 듣는 일이었습니다. 이 모든 것은 신비롭게, 영적으로 깨달아야 했습니다. … 그렇다면 그분의 살은 살이 아닙니까? 틀림없이 살입니다. 그런데 어떻게 ‘육은 아무 쓸모가 없다’고 하십니까? 이것은 당신 살에 관해서가 결코 아니라 당신 말씀을 육적으로 알아듣는 사람들에 관해서 하신 말씀입니다. … 그분의 살을 먹지 않고 그분의 피를 마시지 않는 사람은 자기 안에 생명이 없습니다. 그것 없이는 살 수 없는데 어떻게 살이 아무 쓸모가 없겠습니까? ‘육은 아무 쓸모가 없다’는 말씀이 당신 살에 관해서가 아니라 육적으로 듣는 것에 관해서 하신 말씀임을 보지 못하십니까?” (요한 복음 강해)</p></li></ol><p>번역: 로디온 블라소프 (AI 도구 활용). 저본: 러시아어 원문. 참고: 영어·일본어 번역. 성경 인용과 링크는 개역개정에 따름.</p>"
