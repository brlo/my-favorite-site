  title: 성체성혈성사
  copy_cover: true
  body: '<h2>성체성혈성사의 제정</h2><p>주님이시며 하느님이신 예수 그리스도께서는 마지막 만찬에서 열두 사도만 모으시고 성체성혈성사를 세우셨습니다:</p><blockquote><p>“그들이 먹을 때에 예수께서 떡을 가지사 축복하시고 떼어 제자들에게 주시며 이르시되 <strong>받아서 먹으라 이것은 내 몸이니라</strong> 하시고 또 잔을 가지사 감사 기도 하시고 그들에게 주시며 이르시되 <strong>너희가 다 이것을 마시라 이것은 죄 사함을 얻게 하려고 많은 사람을 위하여 흘리는 바 나의 피 곧 언약의 피니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/26/#L26-28">마 26:26-28</a>; <a href="https://bibleox.com/ko/ko-nkrv/mk/14/#L22-24">막 14:22-24</a>; <a href="https://bibleox.com/ko/ko-nkrv/lk/22/#L19-20">눅 22:19-20</a>) <em>(비잔틴 본문(다수 사본)에는 “<strong>새로운</strong> 계약의 피”(τὸ τῆς καινῆς διαθήκης)라고 되어 있습니다.)</em></p></blockquote><p>구세주의 부활 뒤에 사도가 된 사도 바울은 부활하신 예수 그리스도께 따로 직접 성찬 집전을 배웠습니다:</p><blockquote><p>“<strong>내가 너희에게 전한 것은 주께 받은 것이니</strong> 곧 주 예수께서 잡히시던 밤에 떡을 가지사 축사하시고 떼어 이르시되 <strong>이것은 너희를 위하는 내 몸이니</strong> 이것을 행하여 나를 기념하라 하시고 식후에 또한 그와 같이 잔을 가지시고 이르시되 <strong>이 잔은 내 피로 세운 새 언약이니</strong> 이것을 행하여 마실 때마다 나를 기념하라 하셨으니” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/11/#L23-25">고전 11:23-25</a>)</p></blockquote><h2>성체성혈성사를 통해 한 몸으로 결합합니다</h2><blockquote><p>“내 살은 참된 양식이요 내 피는 참된 음료로다 <strong>내 살을 먹고 내 피를 마시는 자는 내 안에 거하고 나도 그의 안에 거하나니</strong> 살아 계신 아버지께서 나를 보내시매 내가 아버지로 말미암아 사는 것 같이 나를 먹는 그 사람도 나로 말미암아 살리라” (<a href="https://bibleox.com/ko/ko-nkrv/in/6/#L55-57">요 6:55-57</a>)</p></blockquote><p>성사에 참여하는 이들은 참으로(실제로) 그리스도와, 또 그분의 몸 안에서 서로 결합합니다:</p><blockquote><p>“우리가 축복하는 바 <strong>축복의 잔은</strong> <strong>그리스도의 피에 참여함이 아니며</strong> <strong>우리가 떼는 떡은</strong> <strong>그리스도의 몸에 참여함이 아니냐</strong> <strong>떡이 하나요 많은 우리가 한 몸이니 이는 우리가 다 한 떡에 참여함이라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/10/#L16-17">고전 10:16-17</a>)</p></blockquote><blockquote><p>“<strong>너희는 그리스도의 몸이요 지체의 각 부분이라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/12/#L27">고전 12:27</a>)</p></blockquote><blockquote><p>“이제는 전에 멀리 있던 너희가 <strong>그리스도 예수 안에서 그리스도의 피로 가까워졌느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ef/2/#L13">엡 2:13</a>)</p></blockquote><blockquote><p>“<strong>우리는 그 몸의 지체임이라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ef/5/#L30">엡 5:30</a>) <em>(비잔틴 본문(다수 사본)에는 “그분의 <strong>살과 뼈로 된</strong>”이라는 말이 이어집니다.)</em></p></blockquote><p>자세히: <a href="https://bibleox.com/ru/ru/w/Церковь">그리스도와의 결합, 그분의 몸(교회)에 들어감</a>.</p><h2>성체성혈성사에 참여하지 않고는 구원이 불가능합니다</h2><blockquote><p>“예수께서 이르시되 내가 진실로 진실로 너희에게 이르노니 <strong>인자의 살을 먹지 아니하고 인자의 피를 마시지 아니하면 너희 속에 생명이 없느니라</strong> 내 살을 먹고 내 피를 마시는 자는 영생을 가졌고 마지막 날에 내가 그를 다시 살리리니 내 살은 참된 양식이요 내 피는 참된 음료로다 내 살을 먹고 내 피를 마시는 자는 내 안에 거하고 나도 그의 안에 거하나니 살아 계신 아버지께서 나를 보내시매 내가 아버지로 말미암아 사는 것 같이 나를 먹는 그 사람도 나로 말미암아 살리라 이것은 하늘에서 내려온 떡이니 조상들이 먹고도 죽은 그것과 같지 아니하여 <strong>이 떡을 먹는 자는 영원히 살리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/in/6/#L53-58">요 6:53-58</a>)</p></blockquote><p>성체성혈성사를 통해 우리는 그리스도와 결합하고, 그리스도께서는 몸의 구세주이십니다:</p><blockquote><p>“이는 남편이 아내의 머리 됨이 그리스도께서 교회의 머리 됨과 같음이니 <strong><mark>그가 바로 몸의 구주시니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ef/5/#L23">엡 5:23</a>)</p></blockquote><h2>성체는 예수 그리스도의 참된 살과 피입니다</h2><h3>빵은 그리스도께서 세상의 생명을 위하여 내어 주실 살입니다</h3><p>성체성혈성사에서 신자들은 그리스도께서 십자가에서 당신을 바쳐 세상의 생명을 위하여 내어 주신 예수 그리스도의 참된 몸과 참된 피를 받아 모십니다:</p><blockquote><p>“내가 곧 생명의 떡이니라 너희 조상들은 광야에서 만나를 먹었어도 죽었거니와 이는 하늘에서 내려오는 떡이니 사람으로 하여금 먹고 죽지 아니하게 하는 것이니라 나는 하늘에서 내려온 살아 있는 떡이니 사람이 이 떡을 먹으면 영생하리라 <strong>내가 줄 떡은 곧 세상의 생명을 위한 내 살이니라</strong> 하시니라” (<a href="https://bibleox.com/ko/ko-nkrv/in/6/#L48-51">요 6:48-51</a>)</p></blockquote><p>여기서 주님께서는 이 하늘의 빵이 당신이 <strong>지금</strong> 가지고 계시고 <strong>앞으로</strong> 세상의 생명을 위하여 내어 주실 당신의 살이라고 바로 말씀하십니다. 앞으로 처형에 내어 주실 것은 상징도 기념도 가르침도 아니라 그분의 실제 살입니다. 바로 이 하늘의 빵을 먹으라고 주시는 것입니다.</p><h3>계약의 피는 위대한 성물입니다</h3><p>계약의 피를 거룩하게 여기지 않고 은총의 성령을 모욕하는 사람은 가장 무거운 벌을 받게 됩니다:</p><blockquote><p>“모세의 법을 폐한 자도 두세 증인으로 말미암아 불쌍히 여김을 받지 못하고 죽었거든 하물며 <strong><mark>하나님의 아들을 짓밟고 자기를 거룩하게 한 언약의 피를 부정한 것으로 여기고 은혜의 성령을 욕되게 하는 자가 당연히 받을 형벌은 얼마나 더 무겁겠느냐</mark></strong> 너희는 생각하라” (<a href="https://bibleox.com/ko/ko-nkrv/evr/10/#L28-29">히 10:28-29</a>)</p></blockquote><blockquote><p>“누구든지 <strong>성령을 모독하는 자는</strong> <strong>영원히 사하심을 얻지 못하고</strong> 영원한 죄가 되느니라 하시니” (<a href="https://bibleox.com/ko/ko-nkrv/mk/3/#L29">막 3:29</a>)</p></blockquote><h3>사람의 아들의 살</h3><p>성체성혈성사를 말씀하시면서 그리스도께서는 당신의 인성을 강조하십니다:</p><blockquote><p>“예수께서 이르시되 내가 진실로 진실로 너희에게 이르노니 <strong><mark>인자의 살을 먹지 아니하고 인자의 피를 마시지</mark></strong> 아니하면 너희 속에 생명이 없느니라” (<a href="https://bibleox.com/ko/ko-nkrv/in/6/#L53">요 6:53</a>)</p></blockquote><h3>합당하지 않게 영하는 이들에게 오는 병과 죽음</h3><p>영하기 전에 자신을 살펴야 합니다. 합당하지 않게 영하는 이들은 죄를 짓고 병들며 심지어 죽기까지 합니다:</p><blockquote><p>“그러므로 누구든지 주의 떡이나 잔을 합당하지 않게 먹고 마시는 자는 <strong>주의 몸과 피에 대하여 죄를 짓는 것이니라</strong> 사람이 자기를 살피고 그 후에야 이 떡을 먹고 이 잔을 마실지니 주의 몸을 분별하지 못하고 먹고 마시는 자는 <strong>자기의 죄를 먹고 마시는 것이니라</strong> 그러므로 <strong>너희 중에 약한 자와 병든 자가 많고 잠자는 자도 적지 아니하니</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/11/#L27-30">고전 11:27-30</a>) <em>(비잔틴 본문(다수 사본) 29절에는 “<strong>합당하지 않게</strong> 먹고 마시는 사람은”(ἀναξίως)이라고 되어 있습니다.)</em></p></blockquote><h2>성사를 위한 준비의 필요성</h2><blockquote><p>“<strong>사람이 자기를 살피고</strong> 그 후에야 이 떡을 먹고 이 잔을 마실지니” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/11/#L28">고전 11:28</a>)</p></blockquote><h2>교회에서 성체성혈성사는 예수 그리스도께서 오실 때까지 거행될 것입니다</h2><blockquote><p>“너희가 이 떡을 먹으며 이 잔을 마실 때마다 주의 죽으심을 <strong>그가 오실 때까지</strong> 전하는 것이니라” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/11/#L26">고전 11:26</a>)</p></blockquote><h2>성체성혈성사의 구약 예형</h2><h3>과월절 어린 양</h3><p>흠 없는 일 년 된 수컷 어린 양은 사람들의 죄를 위하여 실제로 <strong>죽고</strong>, 실제로 남김없이 <strong>먹혀야</strong> 했습니다. 어린 양이신 그리스도께서는 이 두 가지를 문자 그대로 이루십니다. 사람들의 죄를 위하여 실제로(비유가 아니라) 돌아가시고, 사람들은 실제로(비유가 아니라) 그분을 먹습니다.</p><blockquote><p>“너희는 이스라엘 온 회중에게 말하여 이르라 이 달 열흘에 너희 각자가 <strong>어린 양을</strong> 잡을지니 각 가족대로 그 식구를 위하여 어린 양을 취하되 &lt;…&gt; 너희 어린 양은 <strong>흠 없고 일 년 된 수컷으로</strong> 하되 양이나 염소 중에서 취하고 이 달 열나흗날까지 간직하였다가 <strong>해 질 때에 이스라엘 회중이 그 양을 잡고</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ish/12/#L3,5-6">출 12:3,5-6</a>; <a href="https://bibleox.com/ko/ko-nkrv/ish/12/#L21-22,25">출 12:21-22,25</a>)</p></blockquote><blockquote><p>“<strong>그가 찔림은 우리의 허물 때문이요</strong> 그가 상함은 우리의 죄악 때문이라 그가 징계를 받으므로 우리는 평화를 누리고 <strong>그가 채찍에 맞으므로 우리는 나음을 받았도다</strong> 우리는 다 양 같아서 그릇 행하여 각기 제 길로 갔거늘 <strong>여호와께서는 우리 모두의 죄악을 그에게 담당시키셨도다</strong> 그가 곤욕을 당하여 괴로울 때에도 그의 입을 열지 아니하였음이여 마치 <strong>도수장으로 끌려 가는 어린 양과</strong> 털 깎는 자 앞에서 잠잠한 양 같이 그의 입을 열지 아니하였도다” (<a href="https://bibleox.com/ko/ko-nkrv/is/53/#L5-7">사 53:5-7</a>; <a href="https://bibleox.com/ko/ko-nkrv/act/8/#L32">행 8:32</a>)</p></blockquote><blockquote><p>“나는 끌려서 도살 당하러 가는 순한 <strong>어린 양과 같으므로</strong> 그들이 나를 해하려고 꾀하기를 우리가 그 나무와 열매를 함께 박멸하자 그를 살아 있는 자의 땅에서 끊어서 그의 이름이 다시 기억되지 못하게 하자 함을 내가 알지 못하였나이다” (<a href="https://bibleox.com/ko/ko-nkrv/ier/11/#L19">렘 11:19</a>)</p></blockquote><blockquote><p>“이튿날 요한이 예수께서 자기에게 나아오심을 보고 이르되 보라 <strong>세상 죄를 지고 가는 하나님의 어린 양이로다</strong> &lt;…&gt; 예수께서 거니심을 보고 말하되 보라 <strong>하나님의 어린 양이로다</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/in/1/#L29,36">요 1:29,36</a>)</p></blockquote><blockquote><p>“<strong>너희가</strong> 알거니와 너희 조상이 물려 준 헛된 행실에서 <strong>대속함을 받은 것은</strong> 은이나 금 같이 없어질 것으로 된 것이 아니요 오직 <strong>흠 없고 점 없는 어린 양 같은 그리스도의 보배로운 피로</strong> 된 것이니라” (<a href="https://bibleox.com/ko/ko-nkrv/1pet/1/#L18-19">벧전 1:18-19</a>)</p></blockquote><blockquote><p>“큰 음성으로 이르되 <strong>죽임을 당하신 어린 양</strong>은 능력과 부와 지혜와 힘과 존귀와 영광과 찬송을 받으시기에 합당하도다 하더라” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/5/#L12">계 5:12</a>; <a href="https://bibleox.com/ko/ko-nkrv/otkr/7/#L17">계 7:17</a>; <a href="https://bibleox.com/ko/ko-nkrv/otkr/14/#L1">계 14:1</a>)</p></blockquote><h3>만나</h3><p>만나는 에집트의 종살이에서 약속의 땅으로 가는 길에 광야에서 유다 백성의 힘을 북돋아 주었습니다. 그들은 광야에서 실제로 만나를 먹었습니다. 만나는 실제로 사람들을 죽음에서 지켜 주고 생명을 주었습니다(광야에는 다른 음식이 없었습니다):</p><blockquote><p>“그 때에 여호와께서 모세에게 이르시되 보라 <strong>내가 너희를 위하여 하늘에서 양식을 비 같이 내리리니</strong> 백성이 나가서 일용할 것을 날마다 거둘 것이라 이같이 하여 그들이 내 율법을 준행하나 아니하나 내가 시험하리라 &lt;…&gt; 이스라엘 족속이 <strong>그 이름을 만나라 하였으며</strong> 깟씨 같이 희고 맛은 꿀 섞은 과자 같았더라” (<a href="https://bibleox.com/ko/ko-nkrv/ish/16/#L4,31">출 16:4,31</a>)</p></blockquote><blockquote><p>“<strong>밤에 이슬이 진영에 내릴 때에</strong> <strong>만나도 함께 내렸더라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/chis/11/#L9">민 11:9</a>)</p></blockquote><p>만나는 예표, 곧 앞으로 올 것의 그림자일 뿐 실체가 아니었으므로 영원한 생명을 주지 못하고 지상의 생명을 늘려 굶주림에서 구해 주었을 뿐입니다. 그 유다인들은 결국 다른 사람들처럼 죽었습니다. 그러나 그리스도께서는 당신을 먹는 사람은 영원히 살 것이라고 말씀하십니다:</p><blockquote><p>“기록된 바 <strong>하늘에서 그들에게 떡을 주어 먹게 하였다</strong> 함과 같이 우리 조상들은 <strong>광야에서 만나를 먹었나이다</strong> 예수께서 이르시되 내가 진실로 진실로 너희에게 이르노니 모세가 너희에게 하늘로부터 떡을 준 것이 아니라 내 아버지께서 너희에게 하늘로부터 참 떡을 주시나니 <strong>하나님의 떡은 하늘에서 내려 세상에 생명을 주는 것이니라</strong> &lt;…&gt; 예수께서 이르시되 <strong>나는 생명의 떡이니</strong> 내게 오는 자는 결코 주리지 아니할 터이요 나를 믿는 자는 영원히 목마르지 아니하리라 &lt;…&gt; <strong>내가 곧 생명의 떡이니라</strong> 너희 조상들은 <strong>광야에서 만나를 먹었어도 죽었거니와</strong> <strong>이는 하늘에서 내려오는 떡이니 사람으로 하여금 먹고 죽지 아니하게 하는 것이니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/in/6/#L31-33,35,48-50">요 6:31-33,35,48-50</a>)</p></blockquote><blockquote><p>“<strong>내 살을 먹고 내 피를 마시는 자는 영생을 가졌고</strong> 마지막 날에 내가 그를 다시 살리리니 내 살은 참된 양식이요 내 피는 참된 음료로다 &lt;…&gt; 살아 계신 아버지께서 나를 보내시매 내가 아버지로 말미암아 사는 것 같이 <strong>나를 먹는 그 사람도 나로 말미암아 살리라</strong> 이것은 하늘에서 내려온 떡이니 <strong>조상들이 먹고도 죽은 그것과 같지 아니하여 이 떡을 먹는 자는 영원히 살리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/in/6/#L54-55,57-58">요 6:54-55,57-58</a>)</p></blockquote><p>더 나아가 에집트의 종살이에서 약속의 땅에 이르는 유다인들의 모든 여정을 죄의 종살이에서 하늘 나라에 이르는 그리스도인의 여정으로 본다면, 여기서도 만나는 문자 그대로 성체성혈성사를 가리킵니다:</p><ul><li><p>실제 에집트의 포로 생활 — 실제 죄의 종살이.</p></li><li><p>바다 밑을 지난 실제 탈출 — 실제 세례(<a href="https://bibleox.com/ko/ko-nkrv/1kor/10/#L2">고전 10:2</a>).</p></li><li><p>실제 사십 년 광야 생활 — 교회 안의 실제 지상 생활.</p></li><li><p>실제 만나와 물 — 하느님께서 주시는 구세주의 실제 살과 피.</p></li><li><p>유다인들에게 약속된 실제 땅 — 이제는 지상이 아니라 하늘의 실제 나라.</p></li></ul><h3>마라의 단 물</h3><blockquote><p>“모세가 홍해에서 이스라엘을 인도하매 그들이 나와서 수르 광야로 들어가서 거기서 사흘길을 걸었으나 물을 얻지 못하고 마라에 이르렀더니 그 곳 물이 써서 마시지 못하겠으므로 그 이름을 마라라 하였더라 백성이 모세에게 원망하여 이르되 우리가 무엇을 마실까 하매 모세가 여호와께 부르짖었더니 <strong>여호와께서 그에게 한 나무를 가리키시니 그가 물에 던지니 물이 달게 되었더라</strong> 거기서 여호와께서 그들을 위하여 법도와 율례를 정하시고 그들을 시험하실새” (<a href="https://bibleox.com/ko/ko-nkrv/ish/15/#L22-25">출 15:22-25</a>)</p></blockquote><h3>집 입구에 어린 양의 피를 바름</h3><p>집 입구에 피를 바르는 일은 죽음에서 구해 주었습니다:</p><blockquote><p>“<strong>그 피를 양을 먹을 집 좌우 문설주와 인방에 바르고</strong> &lt;…&gt; 우슬초 묶음을 가져다가 그릇에 담은 피에 적셔서 <strong>그 피를 문 인방과 좌우 설주에 뿌리고</strong> 아침까지 한 사람도 자기 집 문 밖에 나가지 말라 여호와께서 애굽 사람들에게 재앙을 내리려고 지나가실 때에 <strong>문 인방과 좌우 문설주의 피를 보시면 여호와께서 그 문을 넘으시고 멸하는 자에게 너희 집에 들어가서 너희를 치지 못하게 하실 것임이니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ish/12/#L7,22-23">출 12:7,22-23</a>)</p></blockquote><h3>죄를 깨끗하게 하는 제단의 숯불</h3><p>예언자 이사야의 죄는 제단에서 가져온 뜨거운 숯이 입술에 닿음으로써 깨끗해졌습니다:</p><blockquote><p>“그 때에 내가 말하되 화로다 나여 망하게 되었도다 <strong>나는 입술이 부정한 사람이요</strong> 나는 입술이 부정한 백성 중에 거주하면서 만군의 여호와이신 왕을 뵈었음이로다 하였더라 그 때에 그 스랍 중의 하나가 <strong>부젓가락으로 제단에서 집은 바 핀 숯을</strong> 손에 가지고 내게로 날아와서 <strong>그것을 내 입술에 대며 이르되 보라 이것이 네 입에 닿았으니 네 악이 제하여졌고 네 죄가 사하여졌느니라</strong> 하더라” (<a href="https://bibleox.com/ko/ko-nkrv/is/6/#L5-7">사 6:5-7</a>)</p></blockquote><h3>나무의 열매를 먹음</h3><p>인류는 나무 열매를 실제로 먹고 하느님에게서 떨어져 나갔습니다(<a href="https://bibleox.com/ko/ko-nkrv/gen/3/#L6">창 3:6</a>). 그러므로 인류는 십자가 나무의 열매를 먹음으로써 하느님께 돌아갑니다. 사람은 불순종의 나무를 통해 하느님에게서 떠났고, 십자가의 순종의 나무를 통해 돌아갑니다(<a href="https://bibleox.com/ko/ko-nkrv/fil/2/#L8">빌 2:8</a>; <a href="https://bibleox.com/ko/ko-nkrv/mf/16/#L24">마 16:24</a>). 나무 열매가 생명을 앗아 갔고, 나무 열매가 생명을 돌려줍니다. 사람은 나간 문으로 다시 들어옵니다. 그때 주님께서는 “먹지 말아라”(<a href="https://bibleox.com/ko/ko-nkrv/gen/2/#L17">창 2:17</a>) 하셨으나 그들은 먹었습니다. 이제는 “받아 먹어라”(<a href="https://bibleox.com/ko/ko-nkrv/mf/26/#L26">마 26:26</a>) 하시는데, 많은 이들이 같은 잘못을 반대로 되풀이하여 먹지 않습니다. 그때나 지금이나 이 계명을 지키는 일은 어렵지 않았는데도 말입니다:</p><blockquote><p>“동산 중앙에 있는 나무의 열매는 하나님의 말씀에 너희는 <strong>먹지도 말고</strong> 만지지도 말라 <strong>너희가 죽을까 하노라</strong> 하셨느니라” (<a href="https://bibleox.com/ko/ko-nkrv/gen/3/#L3">창 3:3</a>; <a href="https://bibleox.com/ko/ko-nkrv/gen/2/#L17">창 2:17</a>)</p></blockquote><blockquote><p>“그들이 먹을 때에 예수께서 떡을 가지사 축복하시고 떼어 제자들에게 주시며 이르시되 <strong>받아서 먹으라</strong> 이것은 내 몸이니라 하시고” (<a href="https://bibleox.com/ko/ko-nkrv/mf/26/#L26">마 26:26</a>; <a href="https://bibleox.com/ko/ko-nkrv/in/6/#L58">요 6:58</a>)</p></blockquote><h3>감사의 화목제</h3><p>구약에는 두 종류의 화목제가 있습니다:</p><ul><li><p>찬양의 제사 (תודה, 토다);</p></li><li><p>감사(또는 구원)의 제사 (셀라밈 또는 נדר, 네데르).</p></li></ul><p>화목제에는 빵과 짐승 제물을 함께 바쳤습니다. 찬양의 화목제는 누룩 없는 빵으로 바쳤고, 거기에 더하여 감사의 화목제를 바칠 때에는 누룩 든 빵으로 바쳤습니다:</p><blockquote><p>“또 <strong>유교병을</strong> 화목제의 감사제물과 함께 그 예물로 드리되” (<a href="https://bibleox.com/ko/ko-nkrv/lev/7/#L13">레 7:13</a>)</p></blockquote><p>신약에서 하느님께 빵을 바치는 성사는 “에우카리스티아”(그리스어로 감사)라고 불립니다. 그리스도께서 친히 제자들에게 주시기 전에 하느님께 감사드리고 빵을 축복하셨기 때문입니다 (<a href="https://bibleox.com/ko/ko-nkrv/lk/22/#L19">눅 22:19</a>; <a href="https://bibleox.com/ko/ko-nkrv/1kor/11/#L23-24">고전 11:23-24</a>).</p><p>곧 정교회의 성체성혈성사에서는 오늘날 문자 그대로 이렇게 합니다:</p><ul><li><p>누룩 든 빵을 취합니다;</p></li><li><p>감사를 드립니다;</p></li><li><p>다만 희생 짐승을 함께 바치지 않습니다. 희생 제물, 어린 양, 과월절은 십자가에 달리시고 부활하신 그리스도이시기 때문입니다.</p></li></ul><p>누룩 없는 빵은 고난의 빵(«ἄζυμα, ἄρτον κακώσεως», <a href="https://bibleox.com/ko/ko-nkrv/vtor/16/#L3">신 16:3</a>)이라 불리고, 누룩 든 빵을 바치는 화목제는 감사의 제사 또는 구원의 제사(תֹּודַ֥ת — 감사, σωτηρίου — 구원, <a href="https://bibleox.com/ko/ko-nkrv/lev/7/#L13">레 7:13</a>)라고 불린다는 점에 주목할 만합니다.</p><p>참고: 제물의 고기는 그날 아침까지 남기지 않고 먹거나(과월절처럼) 이틀에 걸쳐 먹을 수 있었지만, 사흘째까지 남겨 두는 것은 엄격히 금지되었습니다. 사흘째까지 다 먹지 못하면 남은 것을 태워야 했고, 그렇지 않으면 제물은 하느님께 거부되고 부정과 죄가 되었습니다. 이는 구세주의 부활을 가리킵니다. 사흘째 날에 무덤은 비어 있었습니다. 곧 이 경우 누룩 든 빵은 신약, 구세주의 부활에 속합니다.</p><h2>사물의 본성이 바뀜</h2><ul><li><p>지팡이가 뱀으로, 다시 지팡이로 (<a href="https://bibleox.com/ko/ko-nkrv/ish/4/#L3-4">출 4:3-4</a>; <a href="https://bibleox.com/ko/ko-nkrv/ish/7/#L9-10,15">출 7:9-10,15</a>);</p></li><li><p>물이 피로 (<a href="https://bibleox.com/ko/ko-nkrv/ish/7/#L17,19-21">출 7:17,19-21</a>);</p></li><li><p>물이 포도주로 (<a href="https://bibleox.com/ko/ko-nkrv/in/2/#L7-10">요 2:7-10</a>).</p></li></ul><h2>빵과 포도주의 축복</h2><p>처음에 무에서 우주를 창조하시고, 온 세상에 홍수를 일으키시고, 해를 멈추시고, 어디서나 기적으로 먹을 것과 물을 주시고, 강과 바다를 가르시고, 사물의 본성을 여러 번 바꾸시고(지팡이, 물), 사람이 되시어 축복으로 빵과 물고기를 늘리시고(<a href="https://bibleox.com/ko/ko-nkrv/mf/14/#L15-21">마 14:15-21</a>; <a href="https://bibleox.com/ko/ko-nkrv/mf/15/#L32-38">마 15:32-38</a>; <a href="https://bibleox.com/ko/ko-nkrv/mk/6/#L35-44">막 6:35-44</a>; <a href="https://bibleox.com/ko/ko-nkrv/mk/8/#L1-9">막 8:1-9</a>; <a href="https://bibleox.com/ko/ko-nkrv/lk/9/#L12-17">눅 9:12-17</a>; <a href="https://bibleox.com/ko/ko-nkrv/in/6/#L5-13">요 6:5-13</a>), 나면서부터 소경인 사람에게 눈을 만들어 주시고, 썩어 가던 라자로의 살을 되살리신 비물질적인 하느님께서 제자들과의 과월절 만찬에서 빵과 포도주를 나누어 주셨을 뿐 아니라 기도하신 뒤 <strong>그것을 축복하시고</strong> 당신의 살과 피라고 부르셨습니다:</p><blockquote><p>“그들이 먹을 때에 예수께서 떡을 가지사 축복하시고 떼어 제자들에게 주시며 이르시되 받아서 먹으라 <strong>이것은 내 몸이니라</strong> 하시고 또 잔을 가지사 감사 기도 하시고 그들에게 주시며 이르시되 너희가 다 이것을 마시라 이것은 죄 사함을 얻게 하려고 많은 사람을 위하여 흘리는 바 <strong>나의 피 곧 언약의 피니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/26/#L26-28">마 26:26-28</a>)</p></blockquote><p>이 축복을 사소하고 공허한 것으로 이해할 수는 없습니다.</p><h2>성체성혈성사에 관한 구약의 예언</h2><blockquote><p>“지혜가 그의 집을 짓고 일곱 기둥을 다듬고 <strong>짐승을 잡으며 포도주를 혼합하여</strong> 상을 갖추고 자기의 여종을 보내어 성중 높은 곳에서 불러 이르기를 어리석은 자는 이리로 돌이키라 또 지혜 없는 자에게 이르기를 <strong>너는 와서 내 식물을 먹으며 내 혼합한 포도주를 마시고</strong> 어리석음을 버리고 생명을 얻으라 명철의 길을 행하라 하느니라” (<a href="https://bibleox.com/ko/ko-nkrv/pr/9/#L1-6">잠 9:1-6</a>)</p></blockquote><blockquote><p>“오호라 <strong>너희 모든 목마른 자들아 물로 나아오라</strong> 돈 없는 자도 오라 너희는 와서 <strong>사 먹되</strong> 돈 없이, 값 없이 와서 포도주와 젖을 사라 너희가 어찌하여 <strong>양식이 아닌 것을 위하여</strong> 은을 달아 주며 <strong>배부르게 하지 못할 것을 위하여</strong> 수고하느냐 내게 듣고 들을지어다 그리하면 너희가 좋은 것을 먹을 것이며 너희 자신들이 기름진 것으로 즐거움을 얻으리라 너희는 귀를 기울이고 내게로 나아와 들으라 그리하면 너희의 영혼이 살리라 내가 너희를 위하여 <strong>영원한 언약</strong>을 맺으리니 곧 다윗에게 허락한 확실한 은혜이니라” (<a href="https://bibleox.com/ko/ko-nkrv/is/55/#L1-3">사 55:1-3</a>)</p></blockquote><blockquote><p>“<strong>지혜</strong>는 스스로를 찬양하고 자기 백성 가운데서 자랑한다. … <strong>나를 바라는 이들아, 내게로 와서 내 열매로 배불러라. 나를 먹는 이들은 더욱 배고프고, 나를 마시는 이들은 더욱 목마르리라</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/prsir/24/#L1,19,21">집회 24:1,19,21</a>, 그리스어에서 번역)</p></blockquote><h2>비판</h2><h3>그리스도를 문에 비유한 것은 비유적 표현인가?</h3><p>그리스도께서는 군중에게 말씀하시며 당신을 양 우리의 문에 비유하십니다:</p><blockquote><p>“그러므로 예수께서 다시 이르시되 내가 진실로 진실로 너희에게 말하노니 <strong>나는 양의 문이라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/in/10/#L7">요 10:7</a>)</p></blockquote><p>그리스도께서 당신을 비유로 문이라 하셨으니, 성체성혈성사의 살과 피에 관한 말씀도 비유로 이해해야 하겠습니까? 전혀 그렇지 않습니다. 문에 비유하시기 전에 구세주께서는 문으로 양 우리에 들어가는 목자와 다른 데로 넘어 들어오는 도둑의 비유를 말씀하셨습니다. 문에 비유하심으로써 구세주께서는 이 비유를 마무리하며 군중에게 풀이해 주신 것뿐입니다. 그리스도께서는 군중에게 언제나 비유로 말씀하셨고, 제자들에게는 따로 모든 것을 풀이해 주셨습니다:</p><blockquote><p>“제자들이 예수께 나아와 이르되 <strong>어찌하여 그들에게 비유로 말씀하시나이까</strong> 대답하여 이르시되 <strong>천국의 비밀을 아는 것이 너희에게는 허락되었으나 그들에게는 아니되었나니</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/13/#L10-11">마 13:10-11</a>)</p></blockquote><blockquote><p>“그러므로 <strong>내가 그들에게 비유로 말하는 것은</strong> 그들이 보아도 보지 못하며 <strong>들어도 듣지 못하며 깨닫지 못함이니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/13/#L13">마 13:13</a>)</p></blockquote><blockquote><p>“이르시되 하나님 나라의 비밀을 너희에게는 주었으나 <strong>외인에게는 모든 것을 비유로 하나니</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mk/4/#L11">막 4:11</a>)</p></blockquote><blockquote><p>“예수께서 이러한 많은 비유로 그들이 알아 들을 수 있는 대로 말씀을 가르치시되 비유가 아니면 말씀하지 아니하시고 다만 <strong><mark>혼자 계실 때에 그 제자들에게 모든 것을 해석하시더라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mk/4/#L33-34">막 4:33-34</a>)</p></blockquote><p>시온의 다락방에서 <strong>제자들만 있을 때</strong> 성체성혈성사를 말씀하시면서 그리스도께서는 비유를 덧붙이지 않으셨습니다. 더구나 몸과 피에 관한 비유는 없었습니다. 곧 그리스도께서는 비유가 아니라 문자 그대로 말씀하셨습니다. 군중에게 말씀하실 때도 성체성혈성사에 관한 말씀에 비유를 덧붙이지 않으셨습니다. 그분은 구약의 만나 이야기에서 시작하셨습니다. 이것은 비유가 아니라 실제입니다. 유다인들은 죽지 않으려고 실제로 만나를 먹었습니다. 주님께서는 만나가 예표일 뿐임을 듣는 이들에게 알려 주시려고, 그들이 만나를 먹었어도 굶주림에서 구원받았을 뿐 결국 모든 사람처럼 죽었지만, 당신을 먹는 사람은 죽지 않을 것이라고 말씀하십니다(이것은 이미 예표가 아니라 예표가 가리키던 것, 곧 영원한 생명을 주는 참된 하늘의 빵이기 때문입니다):</p><blockquote><p>“살아 계신 아버지께서 나를 보내시매 내가 아버지로 말미암아 사는 것 같이 나를 먹는 그 사람도 나로 말미암아 살리라 <strong>이것은 하늘에서 내려온 떡이니 조상들이 먹고도 죽은 그것과 같지 아니하여 이 떡을 먹는 자는 영원히 살리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/in/6/#L57-58">요 6:57-58</a>)</p></blockquote><h3>“포도로 빚은 것을 나는 결코 마시지 않겠다”</h3><p>어떤 이들은 마지막 만찬에서 포도나무 열매에 관해 하신 그리스도의 말씀을 들어 성체성혈성사의 살과 피를 실제로 이해하는 것에 반대합니다.</p><p>포도나무 열매에 관해서는 세 복음사가, 마태, 마가, 누가가 말합니다(<a href="https://bibleox.com/ko/ko-nkrv/mf/26/#L29">마 26:29</a>; <a href="https://bibleox.com/ko/ko-nkrv/mk/14/#L25">막 14:25</a>; <a href="https://bibleox.com/ko/ko-nkrv/lk/22/#L18">눅 22:18</a>). 복음사가 누가는 마가와 마태와 달리 만찬을 더 자세히 묘사하여 여러 잔을 마신 것을 언급합니다:</p><h4>첫째 잔</h4><blockquote><p>“이르시되 내가 고난을 받기 전에 너희와 함께 이 유월절 먹기를 원하고 원하였노라 내가 너희에게 이르노니 이 유월절이 하나님의 나라에서 이루기까지 다시 먹지 아니하리라 하시고 이에 <strong><mark>잔을 받으사</mark></strong> 감사 기도 하시고 이르시되 <strong><mark>이것을 갖다가 너희끼리 나누라</mark></strong> 내가 너희에게 이르노니 내가 이제부터 하나님의 나라가 임할 때까지 포도나무에서 난 것을 다시 마시지 아니하리라 하시고” (<a href="https://bibleox.com/ko/ko-nkrv/lk/22/#L15-18">눅 22:15-18</a>)</p></blockquote><p>그리스도께서는 잔을 제자들에게 나누라고 명하십니다. 이 잔은 나누어 마셔집니다. 아직 성체성혈성사도, 몸과 피에 관한 말씀도 없었습니다. 그것은 과월절 음식일 뿐이었습니다. 이 포도주 잔 뒤에 그리스도께서는 곧바로, 더는 마시지 않겠다는 포도나무 열매에 관한 말씀을 하십니다:</p><blockquote><p>“내가 너희에게 이르노니 내가 이제부터 하나님의 나라가 임할 때까지 <strong>포도나무에서 난 것을 다시 마시지 아니하리라</strong> 하시고” (<a href="https://bibleox.com/ko/ko-nkrv/lk/22/#L18">눅 22:18</a>)</p></blockquote><p>그리고 <strong>음식을 나눈 뒤에야</strong>(<a href="https://bibleox.com/ko/ko-nkrv/lk/22/#L20">눅 22:20</a>; <a href="https://bibleox.com/ko/ko-nkrv/1kor/11/#L25">고전 11:25</a>) 그리스도께서는 빵을 드시고 다시 잔을 드시어(첫 잔은 이미 마셨으므로 다른 잔입니다) 성체성혈성사를 행하시고 제자들에게 주시며, 그제야 당신의 몸과 피를 말씀하십니다:</p><h4>둘째 잔</h4><blockquote><p>“또 <strong>떡을 가져 감사 기도 하시고 떼어 그들에게 주시며</strong> 이르시되 이것은 너희를 위하여 주는 내 몸이라 너희가 이를 행하여 나를 기념하라 하시고 <strong><mark>저녁 먹은 후에 잔도 그와 같이 하여 이르시되 이 잔은 내 피로 세우는 새 언약이니</mark></strong> 곧 너희를 위하여 붓는 것이라” (<a href="https://bibleox.com/ko/ko-nkrv/lk/22/#L19-20">눅 22:19-20</a>)</p></blockquote><p>이처럼 첫 부분에는 유다인의 전통적인 과월절 음식만 있습니다. 그때에는 반드시 물을 탄 <strong>포도주 네 잔</strong>을 마시며 하느님께 감사드렸습니다. 성경에는 이 네 잔을 마시라는 명령이 없습니다. 이것은 유다인의 관습일 뿐이었습니다. 유다인의 과월절 관습은 미쉬나에 더 자세히 나옵니다:</p><p><strong>미쉬나 제1조</strong></p><blockquote><p>(א) עַרְבֵי פְסָחִים סָמוּךְ לַמִּנְחָה, לֹא יֹאכַל אָדָם עַד שֶׁתֶּחְשַׁךְ. וַאֲפִלּוּ עָנִי שֶׁבְּיִשְׂרָאֵל לֹא יֹאכַל עַד שֶׁיָּסֵב. וְלֹא יִפְחֲתוּ לוֹ מֵאַרְבָּעָה כוֹסוֹת שֶׁל יַיִן, וַאֲפִלּוּ מִן הַתַּמְחוּי</p><p>과월절 전날 오후 제사 무렵부터 어두워질 때까지 사람은 음식을 먹어서는 안 된다. 이스라엘에서 가장 가난한 사람이라도 비스듬히 기대어 앉기 전에는 먹어서는 안 된다. 구호 식당에서 음식을 얻는 사람이라도 <strong>포도주 네 잔보다 적게 주어서는 안 된다</strong>.</p></blockquote><p>(<a href="https://toldot.com/articles/articles_30013.html">미쉬나 페사힘 10</a>, 러시아어)</p><p>처음에 그리스도께서는 이 관습만 행하십니다. 잔을 드시어 감사하시고 제자들에게 주시며, 이것이 당신의 피라는 말씀은 하지 않으시고 그들끼리 나누라고 하십니다. 그들은 분명 그렇게 하였습니다. 잔은 비워졌습니다. 처음에는 빵에 관한 언급이 없습니다. 만찬 뒤에야 빵이 언급되고 잔이 다시 언급되며, 그제야 그리스도의 몸과 피에 관한 말씀이 나옵니다. 그러므로 포도나무 열매에 관한 말씀은 첫째 포도주 잔에 관한 것이고, 그리스도의 피에 관한 말씀은 둘째 잔에 관한 것입니다. 이 잔에서는 신비로운 방식으로 더는 포도주가 아니라 우리가 믿는 그리스도의 참된 피가 제자들에게 주어졌습니다.</p><h3>“살리는 것은 영이요 육은 아무 쓸모가 없다”</h3><p>정교회의 성체성혈성사 가르침을 반대하는 이들은 그리스도께서 당신 살을 먹는 일을 상징으로만 말씀하셨다고 주장하며 다음 말씀을 듭니다:</p><blockquote><p>“<strong>살리는 것은 영이니 육은 무익하니라</strong> 내가 너희에게 이른 말은 영이요 생명이라” (<a href="https://bibleox.com/ko/ko-nkrv/in/6/#L63">요 6:63</a>)</p></blockquote><p>상징설을 주장하는 이들은 이 구절을 그리스도의 살을 먹는 일이 아무 유익도 없다는 뜻으로 설명합니다.</p><p>그러나 우리는 “육은 아무 쓸모가 없다”는 말씀이 아무 유익이 없는 육적인 생각에 관한 것임을 보여 줍니다. 이는 오로지 땅의 것만, 거칠고 일상적으로, 자기 삶에서 보아 온 방식으로만 생각하여 영적인 신비로 정신을 들어 올리지 못하는 사람들에 관한 말씀입니다[1].</p><p>성경의 다른 많은 곳에서도 오로지 땅의 것만 생각하는 사람들에 관해 이런 말이 쓰입니다:</p><blockquote><p>“예수께서 대답하여 이르시되 바요나 시몬아 네가 복이 있도다 <strong>이를 네게 알게 한 이는 혈육이 아니요</strong> 하늘에 계신 내 아버지시니라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/16/#L17">마 16:17</a>)</p></blockquote><blockquote><p>“그의 아들을 이방에 전하기 위하여 그를 내 속에 나타내시기를 기뻐하셨을 때에 <strong>내가 곧 혈육과 의논하지 아니하고</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gal/1/#L16">갈 1:16</a>)</p></blockquote><blockquote><p>“너희가 이같이 어리석으냐 <strong>성령으로 시작하였다가 이제는 육체로 마치겠느냐</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gal/3/#L3">갈 3:3</a>)</p></blockquote><blockquote><p>“여호와께서 이와 같이 말씀하시니라 <strong>무릇 사람을 믿으며 육신으로 그의 힘을 삼고 마음이 여호와에게서 떠난 그 사람은 저주를 받을 것이라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ier/17/#L5">렘 17:5</a>)</p></blockquote><p>그런 사람들은 자기 앞에 있는 분이 평범한 사람, 요셉의 아들이라고 생각했습니다. 평범한 사람이 어떻게 자기 살을 먹으라고 줄 수 있겠습니까? 자기 몸에서 떼어 먹을 것으로 주는 수밖에 없습니다. 이런 생각은 그들에게 아무 유익이 없었습니다. 그들은 몹시 당황하여 “이렇게 말씀이 어려워서야 누가 알아들을 수 있겠는가?”(<a href="https://bibleox.com/ko/ko-nkrv/in/6/#L60">요 6:60</a>) 하고는 떠나갔습니다.</p><p>그러나 그리스도께서는 보통 사람이 아니라 전능하신 하느님이십니다. 그분은 빵과 포도주의 형상 아래 당신의 생명을 주는 살과 피가 신비롭게 주어지는 성사를 세우시며, 이는 하느님의 능력으로 이루어집니다. 이를 위해서는 영적으로 생각하여, 정신으로 언제나 이해할 수는 없는 일이 신비롭게 이루어질 여지, 땅의 질서를 넘어서는 그리스도의 말씀이 초자연적으로 이루어질 여지를 남겨 두어야 합니다:</p><blockquote><p>“예수께서 이르시되 내가 진실로 진실로 너희에게 이르노니 <strong>인자의 살을 먹지 아니하고 인자의 피를 마시지 아니하면 너희 속에 생명이 없느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/in/6/#L53">요 6:53</a>)</p></blockquote><h3>왜 “하느님을 먹는다”고 합니까?</h3><p>무슬림은 이렇게 묻습니다. 개신교 신자들은 정교회에 조금 다른 형태로 묻지만 본질은 같습니다.</p><p>이 물음에 대한 답은 길어질 수 있지만, 여기서는 핵심만 말하겠습니다. 영성체는 사람을 하느님이신 그리스도와 가장 가깝게, 영적으로만이 아니라 육체적으로도 결합시킵니다. 하느님께서는 사람을 영혼으로만이 아니라 육체로도 창조하셨기 때문입니다.</p><p>사실 아담과 하와를 제외한 모든 사람은 이 세상에 생겨나는 순간부터 다른 사람의 몸, 곧 어머니의 몸으로 양분을 얻어 왔습니다. 그렇게 하지 않으면 생명을 가질 수도 자라고 발달할 수도 없고 틀림없이 죽을 것입니다. 수정란이 착상하지 못할 때 그런 일이 일어납니다.</p><p>아기가 태어날 때 그 몸은 어머니의 몸으로 이루어져 있습니다. 어머니의 몸은 자신을 내어 주어 아기에게 생명을 주었고, 어머니와 아기는 육체적으로 결합되어 있었습니다. 태어난 뒤에도 아기는 오랫동안 어머니의 몸으로 양분을 얻습니다. 젖은 어머니의 몸에서 그 피로 만들어지기 때문입니다. 그런 뜻에서 젖은 어머니의 피입니다.</p><p>이 두 과정(출산과 성체성혈성사)을 세우신 분은 하느님이십니다.</p><p>하느님께서 창조하신 사람의 본성과 출생과 양육의 과정을 알게 되면, 성체성혈성사에서 비슷한 과정을 보고 놀랄 이유가 없습니다. 거기서 우리는 어머니의 몸이 아니라 하느님이신 그리스도의 몸으로 양육되어, 영적으로뿐 아니라 육체적으로도 하느님과 결합합니다. 곧 영과 몸으로 그리스도와 온전히 결합합니다:</p><blockquote><p>“<strong><mark>우리는 그 몸의 지체임이라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ef/5/#L30">엡 5:30</a>) <em>(비잔틴 본문(다수 사본)에는 “그분의 <strong>살과 뼈로 된</strong>”(ἐκ τῆς σαρκὸς αὐτοῦ καὶ ἐκ τῶν ὀστέων αὐτοῦ)이라는 말이 이어집니다.)</em></p></blockquote>'
  title_sub: 주 예수 그리스도의 몸과 피를 모시는 성사에 관한 성경 구절
  meta_desc: 성체성혈성사에 관한 성경 구절
