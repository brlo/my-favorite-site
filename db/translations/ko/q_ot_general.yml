- src: Ветхий-Завет-конец
  path: Oe9d_구약의_끝
  title: 구약 — 끝
  copy_cover: true
  body: <h2>새 언약이 맺어지리라는 예언</h2><p>유대 백성이 깨뜨린 언약 대신 새 백성과 새 언약을 맺으리라는 구약의 예언:</p><blockquote><p>“그런데 <strong>여수룬이 기름지매 발로 찼도다</strong> 네가 살찌고 비대하고 윤택하매 <strong>자기를 지으신 하나님을 버리고</strong> 자기를 구원하신 반석을 업신여겼도다 그들이 <strong>다른 신으로 그의 질투를 일으키며</strong> 가증한 것으로 그의 진노를 격발하였도다 <strong>그들은 하나님께 제사하지 아니하고 귀신들에게 하였으니</strong> 곧 그들이 알지 못하던 신들, 근래에 들어온 새로운 신들 너희의 조상들이 두려워하지 아니하던 것들이로다 너를 낳은 반석을 네가 상관하지 아니하고 너를 내신 하나님을 네가 잊었도다 그러므로 여호와께서 보시고 미워하셨으니 그 자녀가 그를 격노하게 한 까닭이로다 그가 말씀하시기를 <strong>내가 내 얼굴을 그들에게서 숨겨 그들의 종말이 어떠함을 보리니</strong> 그들은 심히 패역한 세대요 진실이 없는 자녀임이로다 그들이 <strong>하나님이 아닌 것으로 내 질투를 일으키며</strong> 허무한 것으로 내 진노를 일으켰으니 <strong>나도 백성이 아닌 자로 그들에게 시기가 나게 하며</strong> 어리석은 민족으로 그들의 분노를 일으키리로다” (<a href="https://bibleox.com/ko/ko-nkrv/vtor/32/#L15-21">신 32:15-21</a>)</p></blockquote><blockquote><p>“여호와의 말씀이니라 보라 날이 이르리니 <strong>내가 이스라엘 집과 유다 집에 새 언약을 맺으리라</strong> 이 언약은 내가 그들의 조상들의 손을 잡고 애굽 땅에서 인도하여 내던 날에 맺은 것과 같지 아니할 것은 <strong>내가 그들의 남편이 되었어도 그들이 내 언약을 깨뜨렸음이라</strong> 여호와의 말씀이니라 그러나 <strong>그 날 후에 내가 이스라엘 집과 맺을 언약은 이러하니</strong> 곧 내가 나의 법을 그들의 속에 두며 그들의 마음에 기록하여 <strong>나는 그들의 하나님이 되고 그들은 내 백성이 될 것이라</strong> 여호와의 말씀이니라 &lt;…&gt; 이 법도가 내 앞에서 폐할진대 <strong>이스라엘 자손도 내 앞에서 끊어져 영원히 나라가 되지 못하리라</strong> 여호와의 말씀이니라 여호와께서 이와 같이 말씀하시니라 위에 있는 하늘을 측량할 수 있으며 밑에 있는 땅의 기초를 탐지할 수 있다면 <strong>내가 이스라엘 자손이 행한 모든 일로 말미암아 그들을 다 버리리라</strong> 여호와의 말씀이니라” (<a href="https://bibleox.com/ko/ko-nkrv/ier/31/#L31-33,36-37">렘 31:31-33,36-37</a>)</p></blockquote><blockquote><p>“나는 <strong>나를 구하지 아니하던 자에게 물음을 받았으며</strong> <strong>나를 찾지 아니하던 자에게 찾아냄이 되었으며</strong> <strong>내 이름을 부르지 아니하던 나라에</strong> 내가 여기 있노라 내가 여기 있노라 하였노라” (<a href="https://bibleox.com/ko/ko-nkrv/is/65/#L1">사 65:1</a>)</p></blockquote><blockquote><p>“내가 나를 위하여 그를 이 땅에 심고 긍휼히 여김을 받지 못하였던 자를 긍휼히 여기며 <strong>내 백성 아니었던 자에게 향하여 이르기를 너는 내 백성이라 하리니 그들은 이르기를 주는 내 하나님이시라 하리라</strong> 하시니라” (<a href="https://bibleox.com/ko/ko-nkrv/os/2/#L23">호 2:23</a>)</p></blockquote><h2>옛 언약의 끝</h2><blockquote><p>“그들의 잘못을 지적하여 말씀하시되 주께서 이르시되 볼지어다 날이 이르리니 내가 이스라엘 집과 유다 집과 더불어 <strong><mark>새 언약을</mark></strong> 맺으리라 &lt;…&gt; 새 언약이라 말씀하셨으매 <strong><mark>첫 것은 낡아지게 하신 것이니</mark></strong> <strong>낡아지고 쇠하는 것은 없어져 가는 것이니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/evr/8/#L8,13">히 8:8,13</a>)</p></blockquote><blockquote><p>“그러나 그들의 마음이 완고하여 오늘까지도 <strong><mark>구약을 읽을 때에</mark></strong> <strong>그 수건이</strong> 벗겨지지 아니하고 있으니 그 수건은 <strong>그리스도 안에서 없어질 것이라</strong> 오늘까지 모세의 글을 읽을 때에 수건이 그 마음을 덮었도다 그러나 언제든지 주께로 돌아가면 그 수건이 벗겨지리라” (<a href="https://bibleox.com/ko/ko-nkrv/2kor/3/#L14-16">고후 3:14-16</a>)</p></blockquote><blockquote><p>“그가 또한 우리를 <strong><mark>새 언약의 일꾼 되기에 만족하게 하셨으니 율법 조문으로 하지 아니하고 오직 영으로 함이니</mark></strong> 율법 조문은 죽이는 것이요 영은 살리는 것이니라” (<a href="https://bibleox.com/ko/ko-nkrv/2kor/3/#L6">고후 3:6</a>)</p></blockquote><blockquote><p>“이제는 우리가 얽매였던 것에 대하여 죽었으므로 <strong>율법에서 벗어났으니</strong> 이러므로 우리가 영의 새로운 것으로 섬길 것이요 <strong><mark>율법 조문의 묵은 것으로 아니할지니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/rim/7/#L6">롬 7:6</a>)</p></blockquote><blockquote><p>“믿음이 오기 전에 우리는 <strong>율법 아래에 매인 바 되고</strong> 계시될 믿음의 때까지 갇혔느니라 이같이 <strong>율법이 우리를 그리스도께로 인도하는 초등교사가 되어</strong> 우리로 하여금 믿음으로 말미암아 의롭다 함을 얻게 하려 함이라 믿음이 온 후로는 <strong><mark>우리가 초등교사 아래에 있지 아니하도다</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gal/3/#L23-25">갈 3:23-25</a>)</p></blockquote><h3>그리스도인의 자유를 악용하지 말라는 경고:</h3><blockquote><p>“형제들아 <strong>너희가 자유를 위하여 부르심을 입었으나 그러나 그 자유로 육체의 기회를 삼지 말고</strong> 오직 사랑으로 서로 종 노릇 하라” (<a href="https://bibleox.com/ko/ko-nkrv/gal/5/#L13">갈 5:13</a>)</p></blockquote>
