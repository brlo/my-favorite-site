  references: "<p>번역: 로디온 블라소프 (AI 도구 활용). 저본: 러시아어 원문. 참고: 영어·일본어 번역. 성경 인용과 링크는 개역개정에 따름.</p>"
- src: языческая-вера-в-идола
  path: Pi50d_우상에_대한_이교의_믿음
  title: 우상에 대한 이교의 믿음
  copy_cover: true
  body: <h2>우상에 대한 이교 신앙의 종류</h2><p>우상에 대한 이교 신앙은 고대에 가장 널리 퍼졌던 것부터 세 가지가 있습니다:</p><ol><li><p><strong>우상이 곧 신 자체입니다</strong>. 이교도가 손수 만든 물건이 신입니다.</p></li><li><p><strong>우상은 멀리 있는 신의 형상</strong>이며, 신이 그런 모습일 것이라고 여깁니다.</p></li><li><p><strong>우상은 신격화된 자연력</strong>, 곧 바다, 바람, 비, 불, 땅을 <strong>지어낸 형상</strong>입니다.</p></li></ol><p>세 경우 모두 존재하지 않는 거짓 신을 섬깁니다. 이것은 거짓을 믿는 것입니다.</p><p>성경에서 우리가 만나는 것은 바로 첫째 경우입니다. 가장 널리 퍼진 이교 신앙은 물건 자체(물질)를 신으로 만드는 것입니다.</p><h2>이교도들은 만든 물건 자체를 신으로 여깁니다</h2><blockquote><p>“그러므로 내가 이 일을 예로부터 네게 알게 하였고 일이 이루어지기 전에 그것을 네게 듣게 하였느니라 그것을 네가 듣게 하여 네가 이것을 <strong>내 신이 행한 바요 내가 새긴 신상과 부어 만든 신상이 명령한 바라</strong> 말하지 못하게 하였느니라” (<a href="https://bibleox.com/ko/ko-nkrv/is/48/#L5">사 48:5</a>)</p></blockquote><blockquote><p>“그것들은 <strong>거짓되며 말하지 못한다</strong>. … 사제들은 자기 신들에게서 금과 은을 몰래 빼내기도 한다. … 그들은 신들에게 옷을 입히지만, 그 신들은 <strong>녹과 좀에서 자기를 지키지 못한다</strong>. … 그것들은 자기를 모욕하는 자를 멸하지 못하고 … 전쟁과 강도에게서 자기를 지키지 못한다. … 그러니 <strong>그것들이 신이 아님이 분명하다(!)</strong> … 사제들은 신전을 문과 자물쇠와 빗장으로 단단히 지켜 도둑맞지 않게 한다. … 박쥐와 제비와 새들이 그것들의 몸과 머리에 앉고 고양이도 앉는다. 이것으로 <strong>그것들이 신이 아님을 알라</strong>. … 그것들은 어깨에 메여 다니고, 땅에 넘어지면 스스로 일어나지 못한다. … 그것들은 목수와 금장이가 만든 것이니 장인들이 원하는 것 말고는 아무것도 될 수 없다. … <strong>그것들은 신이 아니라 사람 손으로 만든 것이며 그 안에는 하느님의 일이 하나도 없다</strong>. … 오이밭의 허수아비처럼 아무것도 지키지 못한다” (<a href="https://bibleox.com/ko/gr-lxx-byz/pos/1/#L8-72">예편 1:8-72</a>, 그리스어에서 번역) <em>(예레미야의 편지(바룩서 6장). 개역개정에는 이 책이 없습니다.)</em></p></blockquote><h2>이교에 빠진 이스라엘 사람들도 만든 물건 자체와 자연력을 신으로 여겼습니다</h2><blockquote><p>“우상을 만드는 자는 다 허망하도다 그들이 원하는 것들은 무익한 것이거늘 <strong>그것들의 증인들은 보지도 못하며 알지도 못하니</strong> 그러므로 수치를 당하리라 신상을 만들며 무익한 우상을 부어 만든 자가 누구냐 보라 그와 같은 무리들이 다 수치를 당할 것이라 그 대장장이들은 사람일 뿐이라 그들이 다 모여 서서 두려워하며 함께 수치를 당할 것이니라 철공은 철로 연장을 만들고 숯불로 일하며 망치를 가지고 그것을 만들며 그의 힘센 팔로 그 일을 하나 배가 고프면 기운이 없고 물을 마시지 아니하면 피로하니라 목공은 줄을 늘여 재고 붓으로 긋고 대패로 밀고 곡선자로 그어 사람의 아름다움을 따라 사람의 모양을 만들어 집에 두게 하며 그는 자기를 위하여 백향목을 베며 디르사 나무와 상수리나무를 취하며 숲의 나무들 가운데에서 자기를 위하여 한 나무를 정하며 나무를 심고 비를 맞고 자라게도 하느니라 <strong>이 나무는 사람이 땔감을 삼는 것이거늘 그가 그것을 가지고 자기 몸을 덥게도 하고 불을 피워 떡을 굽기도 하고 신상을 만들어 경배하며 우상을 만들고 그 앞에 엎드리기도 하는구나</strong> 그 중의 절반은 불에 사르고 그 절반으로는 고기를 구워 먹고 배불리며 또 몸을 덥게 하여 이르기를 아하 따뜻하다 내가 불을 보았구나 하면서 <strong>그 나머지로 신상 곧 자기의 우상을 만들고 그 앞에 엎드려 경배하며 그것에게 기도하여 이르기를 너는 나의 신이니 나를 구원하라 하는도다</strong> 그들이 알지도 못하고 깨닫지도 못함은 그들의 눈이 가려서 보지 못하며 그들의 마음이 어두워져서 깨닫지 못함이니라 마음에 생각도 없고 지식도 없고 총명도 없으므로 <strong>내가 그것의 절반을 불 사르고 또한 그 숯불 위에서 떡도 굽고 고기도 구워 먹었거늘</strong> 내가 어찌 그 나머지로 가증한 물건을 만들겠으며 <strong>내가 어찌 그 나무 토막 앞에 굴복하리요</strong> 말하지 아니하니” (<a href="https://bibleox.com/ko/ko-nkrv/is/44/#L9-19">사 44:9-19</a>)</p></blockquote><blockquote><p>“그들은 <strong>불이나 바람이나 빠른 공기나 별들의 궤도나 거센 물이나 하늘의 빛들을 세상을 다스리는 신들로 여겼다</strong>. … 그러나 죽은 것에 희망을 두는 그들은 비참하니, <strong>사람의 손으로 만든 것들을 신이라 불렀다(!)</strong> … 목수는 쓸모 있는 그릇을 만들고, 남은 조각들로 음식을 해 먹는다. 그런데 아무 데도 쓸모없는, 굽고 옹이투성이인 나무 막대기 하나를 가져다가 한가할 때 정성껏 깎아 <strong>사람의 모습(!)으로</strong> 만든다. … 그것이 넘어지지 않도록 쇠로 고정한다. <strong>그것이 스스로를 돕지 못함을 알기 때문이다</strong>. … 그는 <strong>죽은 것에게 생명을, 한 걸음도 떼지 못하는 것에게 길을, 손에 힘이 없는 것에게 힘을</strong> 구한다” (<a href="https://bibleox.com/ko/gr-lxx-byz/prs/13/#L1-19">지혜 13:1-19</a>, 그리스어에서 번역)</p></blockquote><blockquote><p>“배를 타고 거친 물결을 건너려는 사람은 자기를 태운 배보다 더 썩기 쉬운 <strong>나무토막을 부른다</strong>. … <strong>손으로 만든 것</strong>은 저주받을 것이니, 썩을 것을 <strong>신이라 불렀기 때문이다</strong>. … 갑자기 아이를 잃고 슬픔에 잠긴 아버지가 <strong>그 아이의 형상을 만들어</strong>, 전에 죽은 사람을 이제 <strong>신으로 공경했다</strong>. … <strong>새긴 형상들(!)이 섬김을 받았다</strong>. … 장인은 그 모습을 더 아름답게 다듬었고, 무리는 작품의 매력에 이끌려 얼마 전까지 사람으로 공경하던 이를 이제 경배의 대상으로 여겼다. … 그들은 함께 나눌 수 없는 이름을 <strong>돌과 나무에 붙였다</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/prs/14/#L1-21">지혜 14:1-21</a>, 그리스어에서 번역)</p></blockquote><p>시내 산 아래에서 이스라엘 사람들은 글자 그대로 신을 만들어 달라고 했습니다:</p><blockquote><p>“백성이 모세가 산에서 내려옴이 더딤을 보고 모여 백성이 아론에게 이르러 말하되 일어나라 <strong>우리를 위하여 우리를 인도할 신을 만들라</strong> 이 모세 곧 우리를 애굽 땅에서 인도하여 낸 사람은 어찌 되었는지 알지 못함이니라 아론이 그들에게 이르되 너희의 아내와 자녀의 귀에서 금 고리를 빼어 내게로 가져오라 &lt;…&gt; 아론이 그들의 손에서 금 고리를 받아 부어서 <strong>조각칼로 새겨 송아지 형상을 만드니</strong> 그들이 말하되 <strong>이스라엘아 이는 너희를 애굽 땅에서 인도하여 낸 너희의 신이로다</strong> 하는지라 &lt;…&gt; 그들이 내게 말하기를 우리를 위하여 우리를 인도할 신을 만들라 이 모세 곧 우리를 애굽 땅에서 인도하여 낸 사람은 어찌 되었는지 알 수 없노라 하기에” (<a href="https://bibleox.com/ko/ko-nkrv/ish/32/#L1-2,4,23">출 32:1-2,4,23</a>)</p></blockquote><blockquote><p>“모세가 여호와께로 다시 나아가 여짜오되 슬프도소이다 이 백성이 <strong>자기들을 위하여 금 신을 만들었사오니</strong> 큰 죄를 범하였나이다” (<a href="https://bibleox.com/ko/ko-nkrv/ish/32/#L31">출 32:31</a>)</p></blockquote><p>그들은 하느님이 아니라 뱀에게 분향하고, 그것에 이름을 붙였습니다. 곧 신을 지어냈습니다:</p><blockquote><p>“그가 여러 산당들을 제거하며 주상을 깨뜨리며 아세라 목상을 찍으며 <strong>모세가 만들었던 놋뱀을 이스라엘 자손이 이때까지 향하여 분향하므로</strong> 그것을 부수고 <strong>느후스단이라 일컬었더라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/4ts/18/#L4">왕하 18:4</a>)</p></blockquote><p>그들은 신들을 훔쳤습니다(훔친 것은 만든 물건일 뿐인데도). 곧 물건 자체를 신이라고 부릅니다:</p><blockquote><p>“이제 네가 네 아버지 집을 사모하여 돌아가려는 것은 옳거니와 <strong>어찌 내 신을 도둑질하였느냐</strong> 야곱이 라반에게 대답하여 이르되 내가 생각하기를 외삼촌이 외삼촌의 딸들을 내게서 억지로 빼앗으리라 하여 두려워하였음이니이다 <strong>외삼촌의 신을 누구에게서 찾든지 그는 살지 못할 것이요</strong> 우리 형제들 앞에서 무엇이든지 외삼촌의 것이 발견되거든 외삼촌에게로 가져가소서 하니 야곱은 <strong>라헬이 그것을 도둑질한 줄을</strong> 알지 못함이었더라” (<a href="https://bibleox.com/ko/ko-nkrv/gen/31/#L30-32">창 31:30-32</a>)</p></blockquote><p>손으로 만들어 경배한 신들은 금지되었습니다:</p><blockquote><p>“너희는 헛된 것들에게로 향하지 말며 <strong>너희를 위하여 신상들을 부어 만들지 말라</strong> 나는 너희의 하나님 여호와이니라” (<a href="https://bibleox.com/ko/ko-nkrv/lev/19/#L4">레 19:4</a>)</p></blockquote><blockquote><p>“그 땅에는 우상도 가득하므로 그들이 <strong>자기 손으로 짓고 자기 손가락으로 만든 것을 경배하여</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/is/2/#L8">사 2:8</a>)</p></blockquote><h2>이스라엘에서 우상을 만든 이유</h2><blockquote><p>“그의 마음에 스스로 이르기를 <strong>나라가 이제 다윗의 집으로 돌아가리로다</strong> 만일 이 백성이 예루살렘에 있는 여호와의 성전에 제사를 드리고자 하여 올라가면 이 백성의 마음이 유다 왕 된 그들의 주 르호보암에게로 돌아가서 나를 죽이고 유다의 왕 르호보암에게로 돌아가리로다 하고 이에 계획하고 <strong>두 금송아지를 만들고</strong> 무리에게 말하기를 너희가 다시는 예루살렘에 올라갈 것이 없도다 이스라엘아 <strong>이는 너희를 애굽 땅에서 인도하여 올린 너희의 신들이라</strong> 하고 하나는 벧엘에 두고 하나는 단에 둔지라 &lt;…&gt; 여덟째 달 곧 그 달 열다섯째 날로 절기를 정하여 유다의 절기와 비슷하게 하고 제단에 올라가되 벧엘에서 그와 같이 행하여 <strong>그가 만든 송아지에게 제사를 드렸으며</strong> 그가 지은 산당의 제사장을 벧엘에서 세웠더라” (<a href="https://bibleox.com/ko/ko-nkrv/3ts/12/#L26-29,32">왕상 12:26-29,32</a>)</p></blockquote><h2>바벨론에서는 구리로 만든 물건 자체와 짐승을 신으로 여겼습니다</h2><blockquote><p>“바벨론 사람들에게는 <strong><mark>벨이라는 우상</mark></strong>이 있었는데, 날마다 고운 밀가루 열두 아르타바와 양 사십 마리와 포도주 여섯 메트레테스를 바쳤다. <strong><mark>왕은 그것을 공경하며 날마다 가서 경배하였으나</mark></strong>, 다니엘은 자기 하느님께 경배하였다. 왕이 그에게 ‘너는 어찌하여 벨에게 경배하지 않느냐?’ 하고 물으니, 그가 대답하였다. ‘저는 손으로 만든 우상들을 섬기지 않고, 하늘과 땅을 창조하시고 모든 육체를 다스리시는 살아 계신 하느님을 섬깁니다.’ 왕이 말하였다. ‘<strong><mark>너는 벨이 살아 있는 신이라고 생각하지 않느냐? 그가 날마다 얼마나 먹고 마시는지 보지 못하느냐?</mark></strong>’ 다니엘이 웃으며 말하였다. ‘왕이여, 속지 마십시오. 이것은 속은 진흙이고 겉은 구리이며, 무엇을 먹거나 마신 적이 없습니다.’ … (다니엘은 바닥에 재를 뿌려, 밤마다 사제들과 그 가족들이 비밀 문으로 들어와 제물을 먹는다는 것을 드러낸다.) … 왕은 벨을 다니엘에게 넘겨주었고, 다니엘은 그것과 그 신전을 허물었다. <strong><mark>그곳에는 바벨론 사람들이 공경하는 큰 용도 있었다</mark></strong>. 왕이 다니엘에게 말하였다. ‘<strong><mark>너는 이것도 구리라고 말하지 못하리라. 보라, 이것은 살아서 먹고 마신다. 너는 이것이 살아 있는 신이 아니라고 말할 수 없다</mark></strong>. 그러니 이것에게 경배하라.’ 다니엘이 말하였다. ‘저는 주 저의 하느님께 경배합니다. 그분은 살아 계신 하느님이십니다. 왕이여, 허락해 주시면 칼이나 몽둥이 없이 이 용을 죽이겠습니다.’ … 다니엘은 역청과 기름과 털을 함께 끓여 덩어리를 만들어 <strong><mark>용의 입에 던져 넣으니, 용이 터져 죽었다</mark></strong>. 다니엘이 말하였다. ‘보십시오, 여러분이 경배하던 것이 이것입니다!’”</p></blockquote><p>(벨과 용(다니엘 14:3-28, 칠십인역의 다니엘서 부록), 그리스어에서 줄여 옮김. 개역개정에는 이 부분이 없습니다.)</p><h2>우상은 아무것도 하지 못하며 스스로 돌봄을 받아야 합니다</h2><p>우상이 아무것도 하지 못한다는 점에 거듭 주의를 돌립니다:</p><blockquote><p>“우상에게 제물이 무슨 소용이 있느냐? <strong>그것은 먹지도 냄새 맡지도 못한다</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/prsir/30/#L19">집회 30:19</a>, 그리스어에서 번역)</p></blockquote><blockquote><p>“이 재앙에 죽지 않고 남은 사람들은 손으로 행한 일을 회개하지 아니하고 오히려 여러 귀신과 또는 <strong>보거나 듣거나 다니거나 하지 못하는 금, 은, 동과 목석의 우상에게</strong> 절하고” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/9/#L20">계 9:20</a>)</p></blockquote><p>그러나 우상이 형상일 뿐이라면 아무것도 하지 못한다고 말할 필요가 없을 것입니다. 이교도들 스스로 웃으며 “물론 못 하지, 형상일 뿐인걸” 하고 말할 것입니다.</p><h2>우상 없이는 우상 섬김이 이루어지지 않습니다</h2><blockquote><p>“주 여호와께서 이같이 말씀하셨느니라 이스라엘 족속아 너희가 내 말을 듣지 아니하려거든 <strong>가서 각각 그 우상을 섬기라</strong> 그렇게 하려거든 이 후에 다시는 너희 예물과 너희 우상들로 내 거룩한 이름을 더럽히지 말지니라” (<a href="https://bibleox.com/ko/ko-nkrv/iez/20/#L39">겔 20:39</a>)</p></blockquote><h2>신약의 우상</h2><p>우상 자체를 신으로 여깁니다:</p><blockquote><p>“즉 데메드리오라 하는 어떤 은장색이 은으로 아데미의 신상 모형을 만들어 직공들에게 적지 않은 벌이를 하게 하더니 그가 그 직공들과 그러한 영업하는 자들을 모아 이르되 여러분도 알거니와 우리의 풍족한 생활이 이 생업에 있는데 이 바울이 에베소뿐 아니라 거의 전 아시아를 통하여 수많은 사람을 권유하여 말하되 <strong>사람의 손으로 만든 것들은 신이 아니라</strong> 하니 이는 그대들도 보고 들은 것이라 <strong><mark>우리의 이 영업이 천하여질 위험이 있을 뿐 아니라</mark></strong> 큰 여신 아데미의 신전도 무시 당하게 되고 온 아시아와 천하가 위하는 그의 위엄도 떨어질까 하노라 하더라” (<a href="https://bibleox.com/ko/ko-nkrv/act/19/#L24-27">행 19:24-27</a>)</p></blockquote><h2>참 하느님께서는 우상을 섬기는 자에게 응답하지 않으십니다</h2><blockquote><p>“그런즉 너는 그들에게 말하여 이르라 나 주 여호와가 말하노라 이스라엘 족속 중에 <strong>그 우상을 마음에 들이며</strong> 죄악의 걸림돌을 자기 앞에 두고 선지자에게로 가는 모든 자에게 <strong>나 여호와가 그 우상의 수효대로 보응하리니</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/iez/14/#L4">겔 14:4</a>)</p></blockquote><blockquote><p>“이는 <strong>이스라엘 족속이 다 그 우상으로 말미암아 나를 배반하였으므로</strong> 내가 그들이 마음먹은 대로 그들을 잡으려 함이라” (<a href="https://bibleox.com/ko/ko-nkrv/iez/14/#L5">겔 14:5</a>)</p></blockquote><blockquote><p>“너희가 또 너희 아들을 화제로 삼아 불 가운데로 지나게 하며 오늘까지 <strong>너희 자신을 우상들로 말미암아 더럽히느냐</strong> 이스라엘 족속아 너희가 내게 묻기를 내가 용납하겠느냐 주 여호와의 말씀이니라 내가 나의 삶을 두고 맹세하노니 <strong>너희가 내게 묻기를 내가 용납하지 아니하리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/iez/20/#L31">겔 20:31</a>)</p></blockquote><h2>그 밖의 말씀</h2><blockquote><p>“<strong>우상을 생각해 낸 것이 음행의 시작이요</strong>, 우상을 만들어 낸 것이 생명의 타락이다” (<a href="https://bibleox.com/ko/gr-lxx-byz/prs/14/#L12">지혜 14:12</a>, 그리스어에서 번역)</p></blockquote><blockquote><p>“이름 없는 우상들을 섬기는 것은 <strong>모든 악의 시작이요 원인이며 끝이다</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/prs/14/#L27">지혜 14:27</a>, 그리스어에서 번역)</p></blockquote><blockquote><p>“그들은 <strong>생명 없는 우상들을 믿으므로</strong>, 거짓 맹세를 하고도 해를 입으리라 생각하지 않는다” (<a href="https://bibleox.com/ko/gr-lxx-byz/prs/14/#L29">지혜 14:29</a>, 그리스어에서 번역)</p></blockquote><blockquote><p>“내가 이방 사람을 맞으러 나가니 <strong>그가 자기 우상들의 이름으로 나를 저주하였다</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/ps/151/#L6">시 151:6</a>, 그리스어에서 번역) <em>(칠십인역의 시편 151편. 개역개정에는 이 시편이 없습니다.)</em></p></blockquote>
