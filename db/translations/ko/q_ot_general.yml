- src: главное-в-законе
  path: Ml2w_율법의_더_중한_것
  title: 율법의 더 중한 것
  copy_cover: true
  body: '<h2>가장 중요한 것</h2><ul><li><p>정의</p></li><li><p>긍휼</p></li><li><p>믿음</p></li></ul><h2>주 하느님 예수 그리스도의 가르침</h2><blockquote><p>“화 있을진저 외식하는 서기관들과 바리새인들이여 너희가 박하와 회향과 근채의 십일조는 드리되 <strong>율법의 더 중한 바</strong> <strong>정의와 긍휼과 믿음은</strong> 버렸도다 그러나 이것도 행하고 저것도 버리지 말아야 할지니라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/23/#L23">마 23:23</a>)</p></blockquote><blockquote><p>“선생님 <strong>율법 중에서 어느 계명이 크니이까</strong> 예수께서 이르시되 네 마음을 다하고 목숨을 다하고 뜻을 다하여 <strong>주 너의 하나님을 사랑하라</strong> 하셨으니 <strong>이것이 크고 첫째 되는 계명이요</strong> 둘째도 그와 같으니 <strong>네 이웃을 네 자신 같이 사랑하라</strong> 하셨으니 <strong>이 두 계명이 온 율법과 선지자의 강령이니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/22/#L36-40">마 22:36-40</a>)</p></blockquote><h2>사도들의 가르침</h2><blockquote><p>“<strong>온 율법은 네 이웃 사랑하기를 네 자신 같이 하라 하신 한 말씀에서 이루어졌나니</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gal/5/#L14">갈 5:14</a>)</p></blockquote><h2>선지자들의 가르침</h2><blockquote><p>“사람아 주께서 선한 것이 무엇임을 네게 보이셨나니 여호와께서 네게 구하시는 것은 오직 <strong>정의를 행하며</strong> <strong>인자를 사랑하며</strong> <strong>겸손하게 네 하나님과 함께 행하는 것이 아니냐</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mih/6/#L8">미 6:8</a>)</p></blockquote><blockquote><p>“그런즉 너의 하나님께로 돌아와서 <strong>인애와</strong> <strong>정의를 지키며</strong> <strong>항상 너의 하나님을 바랄지니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/os/12/#L6">호 12:6</a>)</p></blockquote><blockquote><p>“이스라엘 자손들아 여호와의 말씀을 들으라 여호와께서 이 땅 주민과 논쟁하시나니 이 땅에는 <strong>진실도 없고</strong> <strong>인애도 없고</strong> <strong>하나님을 아는 지식도 없고</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/os/4/#L1">호 4:1</a>)</p></blockquote><blockquote><p>“<strong>나는 인애를 원하고</strong> 제사를 원하지 아니하며 번제보다 <strong>하나님을 아는 것을 원하노라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/os/6/#L6">호 6:6</a>)</p></blockquote><blockquote><p>“만군의 여호와가 이같이 말하여 이르시기를 너희는 <strong>진실한 재판을 행하며</strong> <strong>서로 인애와 긍휼을 베풀며</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/zah/7/#L9">슥 7:9</a>)</p></blockquote><blockquote><p>“<strong>여호와께서 정의를 사랑하시고</strong> 그의 성도를 버리지 아니하심이로다 그들은 영원히 보호를 받으나 악인의 자손은 끊어지리로다” (<a href="https://bibleox.com/ko/ko-nkrv/ps/37/#L28">시 37:28</a>)</p></blockquote><blockquote><p>“<strong>그는 공의와 정의를 사랑하심이여</strong> 세상에는 <strong>여호와의 인자하심이</strong> 충만하도다” (<a href="https://bibleox.com/ko/ko-nkrv/ps/33/#L5">시 33:5</a>; <a href="https://bibleox.com/ko/gr-lxx-byz/ps/32/#L5">시 32:5</a>) <em>(칠십인역(시 32:5): ἀγαπᾷ ἐλεημοσύνην καὶ κρίσιν, “그분은 <strong>긍휼</strong>(구제)과 정의를 사랑하신다”.)</em></p></blockquote><h2>그 밖의 말씀</h2><blockquote><p>“그러나 <strong>그 안에 있는 것으로 구제하라</strong> <strong>그리하면 모든 것이 너희에게 깨끗하리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/lk/11/#L41">눅 11:41</a>)</p></blockquote><blockquote><p>“타오르는 불은 물이 끄고, <strong>구제는 죄를 속한다</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/prsir/3/#L30">집회 3:30</a>, 그리스어에서 번역)</p></blockquote>'
