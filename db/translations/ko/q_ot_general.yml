- src: женщина-ветхий-завет
  path: Wm7l_모세_율법의_여성
  title: 모세 율법에서의 여성
  copy_cover: true
  body: '<p>율법은 대부분 여성에게 고유한 삶의 상황과 남녀 관계의 여러 상황을 다룹니다. 그 가운데 다음 영역을 들 수 있습니다:</p><ul><li><p>출산(<a href="https://bibleox.com/ko/ko-nkrv/lev/12/">레 12:</a>)</p></li><li><p>피의 유출(<a href="https://bibleox.com/ko/ko-nkrv/lev/15/#L19-30">레 15:19-30</a>, <a href="https://bibleox.com/ko/ko-nkrv/lev/18/#L19">레 18:19</a>, <a href="https://bibleox.com/ko/ko-nkrv/lev/20/#L18">레 20:18</a>)</p></li><li><p>하체(벌거벗음)(<a href="https://bibleox.com/ko/ko-nkrv/lev/18/">레 18:</a>)</p></li><li><p>남자와의 관계, 남편 고르기(<a href="https://bibleox.com/ko/ko-nkrv/lev/19/#L20">레 19:20</a>, <a href="https://bibleox.com/ko/ko-nkrv/lev/21/#L7-14">레 21:7-14</a>, <a href="https://bibleox.com/ko/ko-nkrv/chis/5/#L12-31">민 5:12-31</a>, <a href="https://bibleox.com/ko/ko-nkrv/chis/36/">민 36:</a>)</p></li><li><p>서원(<a href="https://bibleox.com/ko/ko-nkrv/lev/27/#L3-8">레 27:3-8</a>, <a href="https://bibleox.com/ko/ko-nkrv/chis/6/">민 6:</a>, <a href="https://bibleox.com/ko/ko-nkrv/chis/30/#L3-16">민 30:3-16</a>)</p></li><li><p>죄에 빠짐(<a href="https://bibleox.com/ko/ko-nkrv/lev/19/#L20">레 19:20</a>, <a href="https://bibleox.com/ko/ko-nkrv/lev/20/#L10-21">레 20:10-21</a>)</p></li></ul><p>이 영역들을 차례대로 따로 살펴보겠습니다.</p><h2>출산</h2><p>아이를 낳은 뒤 율법은 여인에게 정결 기간을 정하는데, 그 기간은 태어난 아이의 성별에 따라 다릅니다. 남자 아기를 낳으면 여인은 7일 동안 부정하고 33일의 정결 기간을 지내야 하며, 그동안 거룩한 것을 만지거나 성소에 들어갈 수 없습니다(<a href="https://bibleox.com/ko/ko-nkrv/lev/12/#L2-4">레 12:2-4</a>). 여자 아기의 경우 이 기간이 두 배가 됩니다(<a href="https://bibleox.com/ko/ko-nkrv/lev/12/#L5">레 12:5</a>).</p><h2>피의 유출</h2><p>먼저 율법은 몸에서 나오는 유출은 모두 사람을 부정하게 한다고 말한다는 점을 짚어 둘 만합니다:</p><blockquote><p>“이스라엘 자손에게 말하여 이르라 <strong>누구든지 그의 몸에 유출병이 있으면 그 유출병으로 말미암아 부정한 자라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/lev/15/#L2">레 15:2</a>)</p></blockquote><p>그러나 분명한 이유로 여성에 대해서는 따로, 꽤 길게 말합니다.</p><p>대체로 여인은 피의 유출이 있는 동안 부정하며, 그 뒤 7일의 정결 기간이 정해집니다. 피의 유출이 늘 있으면 늘 부정합니다. 부정한 여인은 남편과 동침할 수 없으며, 그렇지 않으면 남편도 아내와 똑같이 부정해지고 아내와 같은 규정이 남편에게도 적용됩니다. 피의 유출이 있는 여인이 눕거나 앉은 모든 것은 부정해지고, 그것을 만지는 사람은 저녁까지 부정합니다. 정결 기간이 지나면 산비둘기 두 마리나 집비둘기 새끼 두 마리를 예물로 바쳐야 하며(<a href="https://bibleox.com/ko/ko-nkrv/lev/15/#L29-30">레 15:29-30</a>), 그 뒤 여인은 정결한 것으로 여겨집니다.</p><p>피의 유출과 관련된 다른 규정도 있지만 그것은 다음 부분에서 다루겠습니다.</p><h2>하체(벌거벗음)</h2><blockquote><p>“<strong>각 사람은 자기의 살붙이를 가까이 하여 그의 하체를 범하지 말라</strong> 나는 여호와이니라” (<a href="https://bibleox.com/ko/ko-nkrv/lev/18/#L6">레 18:6</a>)</p></blockquote><p>이 장에는 남자(아버지)의 하체도 언급되지만, 논리상 주로 피를 나눈 친족만이 아닌 여러 촌수의 여인들의 하체를 범하지 말라는 금지가 나열됩니다:</p><blockquote><p>“<strong>너는 네 며느리의 하체를 범하지 말라</strong> 그는 네 아들의 아내이니 그의 하체를 범하지 말지니라” (<a href="https://bibleox.com/ko/ko-nkrv/lev/18/#L15">레 18:15</a>)</p></blockquote><p>앞에서 말한 피의 유출에 관한 율법 규정으로 돌아가, 남편에게 주어진 이 금지도 언급해 둡니다:</p><blockquote><p>“<strong>너는 여인이 월경으로 불결한 동안에 그에게 가까이 하여 그의 하체를 범하지 말지니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/lev/18/#L19">레 18:19</a>)</p></blockquote><h2>남자와의 관계, 남편 고르기</h2><p>어떤 남자가 다른 남자와 정혼한 여종을 범하면, 자유인 여인(곧 종이 아닌 여인)을 범한 경우와 달리(<a href="https://bibleox.com/ko/ko-nkrv/vtor/22/#L25">신 22:25</a>) 사형에 처하지 않고 속건제물, 곧 숫양 한 마리만 바치면 됩니다(<a href="https://bibleox.com/ko/ko-nkrv/lev/19/#L20-21">레 19:20-21</a>).</p><p>남편과 아내는 동침한 뒤 저녁까지 부정한 것으로 여겨집니다(<a href="https://bibleox.com/ko/ko-nkrv/lev/15/#L18">레 15:18</a>).</p><p>제사장의 아내는 처녀만 될 수 있었고(<a href="https://bibleox.com/ko/ko-nkrv/lev/21/#L13">레 21:13</a>), 과부나 이혼당한 여인, 더럽혀진 여인이나 창녀는 될 수 없었습니다.</p><p>남자 상속자가 없어 여인이 땅을 상속받으면, 그 여인은 자기 아버지 지파의 사람과만 혼인할 수 있었습니다(<a href="https://bibleox.com/ko/ko-nkrv/chis/36/#L8">민 36:8</a>). 기업이 다른 지파로 넘어가지 않게 하려는 것입니다.</p><p>남편이 아내의 간음을 의심할 때 어떻게 해야 하는지 정한 규례도 있습니다(<a href="https://bibleox.com/ko/ko-nkrv/chis/5/#L12-31">민 5:12-31</a>).</p><h2>서원(하느님께 드리는 약속)</h2><p>하느님께 어떤 서원을 하는 사람들이 있었고, 그 가운데 어떤 이들은 나실인이라 불렸습니다(혼동하지 마십시오. 예수 그리스도께서는 나사렛 출신이시므로 나사렛 사람이라 불리셨습니다). 그들은 포도로 만든 것은 무엇이든 마시거나 먹지 않고, 머리를 깎지 않으며, 시체 가까이 가지 않기로 약속했습니다. 이런 서원은 일정한 기간 동안 할 수도 있고 평생 할 수도 있었습니다. 여기서 이것을 언급하는 것은 남자와 여자가 모두 나실인이었다는 사실을 강조하기 위해서일 뿐입니다.</p><p>율법은 판 것을 무를 수 있게 했고(<a href="https://bibleox.com/ko/ko-nkrv/lev/25/#L25">레 25:25</a>), 이와 비슷하게 성소를 섬기는 일로 자기 삶을 하느님께 바친 사람에게도 값이 정해집니다. 여기서 남자와 여자의 생명이 다르게 매겨진다는 점을 볼 수 있습니다. 예를 들어 스무 살부터 예순 살까지의 남자는 성소의 세겔로 은 오십 세겔, 여자는 삼십 세겔로 정해집니다(<a href="https://bibleox.com/ko/ko-nkrv/lev/27/#L3-4">레 27:3-4</a>). A. P. 로푸힌은 이 차이를 각 경우 성소에 바쳐진 사람의 노동력이 다르기 때문이라고 설명합니다. 그에게는 성소를 위해 나무를 패고 물을 긷는 등의 육체노동이 요구되었습니다.</p><blockquote><p>“<strong>사람이 여호와께 서원하였거나 결심하고 서약하였으면 깨뜨리지 말고 그가 입으로 말한 대로 다 이행할 것이니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/chis/30/#L2">민 30:2</a>)</p></blockquote><p>이처럼 맹세한 사람은 자기 맹세를 이행해야 하지만, 여인에 대해서는 단서가 붙습니다. 아내가 맹세나 서원을 하면 그것을 들은 남편은 이 맹세를 무효로 할 수 있으며, 그러면 그 맹세는 없었던 것으로 여겨집니다. 아버지도 어린 딸의 맹세를 들으면 그것을 무효로 할 수 있습니다.</p><h2>죄에 빠짐</h2><p>죄에 빠진 일에 무거운 벌을 내리는 여러 율법이 서술됩니다. 예를 들면:</p><ul><li><p>간음(<a href="https://bibleox.com/ko/ko-nkrv/lev/20/#L10-12">레 20:10-12</a>),</p></li><li><p>짐승과의 교합(특히 여인에 대해 서술됨: <a href="https://bibleox.com/ko/ko-nkrv/lev/20/#L16">레 20:16</a>, <a href="https://bibleox.com/ko/ko-nkrv/lev/18/#L23">레 18:23</a>),</p></li><li><p>남색(<a href="https://bibleox.com/ko/ko-nkrv/lev/20/#L13">레 20:13</a>) 등.</p></li></ul><p>율법을 거스른 이런 죄는 사형으로 벌했습니다.</p>'
  meta_desc: 구약의 여성에 관한 성경 구절
