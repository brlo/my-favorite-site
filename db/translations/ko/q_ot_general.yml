  title: 옛 언약의 체결
  copy_cover: true
  body: <h2>아브라함과 맺은 언약</h2><h3>약속</h3><blockquote><p>“여호와께서 아브람에게 이르시되 너는 너의 고향과 친척과 아버지의 집을 떠나 내가 네게 보여 줄 땅으로 가라 <strong>내가 너로 큰 민족을 이루고</strong> <strong>네게 복을 주어</strong> <strong>네 이름을 창대하게 하리니</strong> <strong>너는 복이 될지라</strong> 너를 축복하는 자에게는 내가 복을 내리고 너를 저주하는 자에게는 내가 저주하리니 땅의 모든 족속이 너로 말미암아 복을 얻을 것이라 하신지라” (<a href="https://bibleox.com/ko/ko-nkrv/gen/12/#L1-3">창 12:1-3</a>)</p></blockquote><h3>언약</h3><blockquote><p>“보라 내 언약이 너와 함께 있으니 <strong>너는 여러 민족의 아버지가 될지라</strong> 이제 후로는 네 이름을 아브람이라 하지 아니하고 아브라함이라 하리니 이는 내가 너를 여러 민족의 아버지가 되게 함이니라 내가 너로 심히 번성하게 하리니 내가 네게서 민족들이 나게 하며 왕들이 네게로부터 나오리라 <strong>내가 내 언약을 나와 너 및 네 대대 후손 사이에 세워서 영원한 언약을 삼고 너와 네 후손의 하나님이 되리라</strong> 내가 너와 네 후손에게 네가 거류하는 이 땅 곧 <strong>가나안 온 땅을 주어 영원한 기업이 되게 하고 나는 그들의 하나님이 되리라</strong> 하나님이 또 아브라함에게 이르시되 그런즉 너는 내 언약을 지키고 네 후손도 대대로 지키라 <strong>너희 중 남자는 다 할례를 받으라</strong> 이것이 나와 너희와 너희 후손 사이에 지킬 내 언약이니라 너희는 포피를 베어라 <strong>이것이 나와 너희 사이의 언약의 표징이니라</strong> 너희의 대대로 모든 남자는 집에서 난 자나 또는 너희 자손이 아니라 이방 사람에게서 돈으로 산 자를 막론하고 난 지 팔 일 만에 할례를 받을 것이라 너희 집에서 난 자든지 너희 돈으로 산 자든지 할례를 받아야 하리니 이에 내 언약이 너희 살에 있어 영원한 언약이 되려니와 할례를 받지 아니한 남자 곧 그 포피를 베지 아니한 자는 백성 중에서 끊어지리니 그가 내 언약을 배반하였음이니라 하나님이 또 아브라함에게 이르시되 네 아내 사래는 이름을 사래라 하지 말고 사라라 하라 내가 그에게 복을 주어 그가 네게 아들을 낳아 주게 하며 내가 그에게 복을 주어 그를 여러 민족의 어머니가 되게 하리니 민족의 여러 왕이 그에게서 나리라” (<a href="https://bibleox.com/ko/ko-nkrv/gen/17/#L4-16">창 17:4-16</a>)</p></blockquote><h3>시내 산 언약</h3><blockquote><p>“그러므로 이스라엘 자손에게 말하기를 나는 여호와라 내가 애굽 사람의 무거운 짐 밑에서 너희를 빼내며 그들의 노역에서 너희를 건지며 편 팔과 여러 큰 심판들로써 너희를 속량하여 <strong>너희를 내 백성으로 삼고 나는 너희의 하나님이 되리니</strong> 나는 애굽 사람의 무거운 짐 밑에서 너희를 빼낸 너희의 하나님 여호와인 줄 너희가 알지라 <strong>내가 아브라함과 이삭과 야곱에게 주기로 맹세한 땅으로 너희를 인도하고 그 땅을 너희에게 주어 기업을 삼게 하리라</strong> 나는 여호와라 하셨다 하라” (<a href="https://bibleox.com/ko/ko-nkrv/ish/6/#L6-8">출 6:6-8</a>)</p></blockquote><h2>구세주께서 오시리라는 약속</h2><h3>첫 사람들에게</h3><blockquote><p>“여호와 하나님이 뱀에게 이르시되 네가 이렇게 하였으니 네가 모든 가축과 들의 모든 짐승보다 더욱 저주를 받아 배로 다니고 살아 있는 동안 흙을 먹을지니라 <strong><mark>내가 너로 여자와 원수가 되게 하고 네 후손도 여자의 후손과 원수가 되게 하리니</mark></strong> 여자의 후손은 네 머리를 상하게 할 것이요 너는 그의 발꿈치를 상하게 할 것이니라 하시고” (<a href="https://bibleox.com/ko/ko-nkrv/gen/3/#L14-15">창 3:14-15</a>)</p></blockquote><h3>아브라함에게</h3><blockquote><p>“이르시되 여호와께서 이르시기를 내가 나를 가리켜 맹세하노니 네가 이같이 행하여 네 아들 네 독자도 아끼지 아니하였은즉 <strong>내가 네게 큰 복을 주고 네 씨가 크게 번성하여</strong> 하늘의 별과 같고 바닷가의 모래와 같게 하리니 <strong>네 씨가 그 대적의 성문을 차지하리라</strong> 또 <strong><mark>네 씨로 말미암아 천하 만민이 복을 받으리니</mark></strong> 이는 네가 나의 말을 준행하였음이니라 하셨다 하니라” (<a href="https://bibleox.com/ko/ko-nkrv/gen/22/#L16-18">창 22:16-18</a>)</p></blockquote><h3>이삭에게</h3><blockquote><p>“여호와께서 이삭에게 나타나 이르시되 애굽으로 내려가지 말고 내가 네게 지시하는 땅에 거주하라 이 땅에 거류하면 <strong>내가 너와 함께 있어 네게 복을 주고</strong> 내가 이 모든 땅을 너와 네 자손에게 주리라 내가 네 아버지 아브라함에게 맹세한 것을 이루어 <strong>네 자손을 하늘의 별과 같이 번성하게 하며 이 모든 땅을 네 자손에게 주리니</strong> <strong><mark>네 자손으로 말미암아 천하 만민이 복을 받으리라</mark></strong> 이는 아브라함이 내 말을 순종하고 내 명령과 내 계명과 내 율례와 내 법도를 지켰음이라 하시니라” (<a href="https://bibleox.com/ko/ko-nkrv/gen/26/#L2-5">창 26:2-5</a>)</p></blockquote><h3>야곱에게</h3><blockquote><p>“또 본즉 여호와께서 그 위에 서서 이르시되 나는 여호와니 너의 조부 아브라함의 하나님이요 이삭의 하나님이라 <strong>네가 누워 있는 땅을 내가 너와 네 자손에게 주리니</strong> <strong>네 자손이 땅의 티끌 같이 되어</strong> 네가 서쪽과 동쪽과 북쪽과 남쪽으로 퍼져나갈지며 <strong><mark>땅의 모든 족속이 너와 네 자손으로 말미암아 복을 받으리라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gen/28/#L13-14">창 28:13-14</a>)</p></blockquote><h2>이스라엘 백성과 맺은 언약</h2><blockquote><p>“내가 애굽 사람에게 어떻게 행하였음과 내가 어떻게 독수리 날개로 너희를 업어 내게로 인도하였음을 너희가 보았느니라 세계가 다 내게 속하였나니 <strong><mark>너희가 내 말을 잘 듣고 내 언약을 지키면 너희는 모든 민족 중에서 내 소유가 되겠고</mark></strong> &lt;…&gt; 백성이 일제히 응답하여 이르되 여호와께서 명령하신 대로 <strong>우리가 다 행하리이다</strong> 모세가 백성의 말을 여호와께 전하매” (<a href="https://bibleox.com/ko/ko-nkrv/ish/19/#L4-5,8">출 19:4-5,8</a>)</p></blockquote><blockquote><p>“<strong>네가 그의 목소리를 잘 청종하고 내 모든 말대로 행하면</strong> 내가 네 원수에게 원수가 되고 네 대적에게 대적이 될지라” (<a href="https://bibleox.com/ko/ko-nkrv/ish/23/#L22">출 23:22</a>)</p></blockquote><blockquote><p>“언약서를 가져다가 백성에게 낭독하여 듣게 하니 그들이 이르되 <strong>여호와의 모든 말씀을 우리가 준행하리이다</strong> 모세가 그 피를 가지고 백성에게 뿌리며 이르되 <strong>이는 여호와께서 이 모든 말씀에 대하여 너희와 세우신 언약의 피니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ish/24/#L7-8">출 24:7-8</a>)</p></blockquote><h2>이스라엘이 하느님을 떠남</h2><blockquote><p>“여호와께서 모세에게 이르시되 너는 내려가라 네가 애굽 땅에서 인도하여 낸 네 백성이 부패하였도다 <strong>그들이 내가 그들에게 명령한 길을 속히 떠나</strong> 자기를 위하여 송아지를 부어 만들고 그것을 예배하며 그것에게 제물을 드리며 말하기를 이스라엘아 이는 너희를 애굽 땅에서 인도하여 낸 너희 신이라 하였도다” (<a href="https://bibleox.com/ko/ko-nkrv/ish/32/#L7-8">출 32:7-8</a>)</p></blockquote><blockquote><p>“<strong>내 백성이</strong> 두 가지 악을 행하였나니 곧 <strong>그들이 생수의 근원되는 나를 버린 것과</strong> 스스로 웅덩이를 판 것인데 그것은 그 물을 가두지 못할 터진 웅덩이들이니라” (<a href="https://bibleox.com/ko/ko-nkrv/ier/2/#L13">렘 2:13</a>)</p></blockquote><blockquote><p>“<strong>내 백성이</strong> 나무에게 묻고 그 막대기는 그들에게 고하나니 이는 그들이 음란한 마음에 미혹되어 <strong>하나님을 버리고 음행하였음이니라</strong> 그들이 산 꼭대기에서 제사를 드리며 작은 산 위에서 분향하되 참나무와 버드나무와 상수리나무 아래에서 하니 이는 그 나무 그늘이 좋음이라 이러므로 너희 딸들은 음행하며 너희 며느리들은 간음을 행하는도다” (<a href="https://bibleox.com/ko/ko-nkrv/os/4/#L12-13">호 4:12-13</a>)</p></blockquote><blockquote><p>“소는 그 임자를 알고 나귀는 그 주인의 구유를 알건마는 <strong>이스라엘은 알지 못하고 나의 백성은 깨닫지 못하는도다</strong> 하셨도다 슬프다 <strong>범죄한 나라요 허물 진 백성이요 행악의 종자요 행위가 부패한 자식이로다 그들이 여호와를 버리며 이스라엘의 거룩하신 이를 만홀히 여겨</strong> 멀리하고 물러갔도다 <strong>너희가 어찌하여 매를 더 맞으려고 패역을 거듭하느냐 온 머리는 병들었고 온 마음은 피곤하였으며 발바닥에서 머리까지 성한 곳이 없이</strong> 상한 것과 터진 것과 새로 맞은 흔적뿐이거늘 그것을 짜며 싸매며 기름으로 부드럽게 함을 받지 못하였도다” (<a href="https://bibleox.com/ko/ko-nkrv/is/1/#L3-6">사 1:3-6</a>)</p></blockquote><blockquote><p>“여호와여 주의 눈이 진리를 찾지 아니하시나이까 주께서 그들을 치셨을지라도 그들이 아픈 줄을 알지 못하며 그들을 멸하셨을지라도 그들이 <strong>징계를 받지 아니하고</strong> 그들의 얼굴을 바위보다 굳게 하여 <strong>돌아오기를 싫어하므로</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ier/5/#L3">렘 5:3</a>)</p></blockquote><blockquote><p>“내가 너희 중의 성읍 무너뜨리기를 하나님인 내가 소돔과 고모라를 무너뜨림 같이 하였으므로 너희가 불붙는 가운데서 빼낸 나무 조각 같이 되었으나 <strong>너희가 내게로 돌아오지 아니하였느니라</strong> 여호와의 말씀이니라” (<a href="https://bibleox.com/ko/ko-nkrv/am/4/#L11">암 4:11</a>)</p></blockquote><h3>하느님께서는 무엇 때문에 이스라엘을 약속의 땅에서 쫓아내실지 경고하셨습니다</h3><h4>경고</h4><p>유대 백성은 하느님께서 약속하신 땅을 자기 의로움 때문에 받는 것이 아니라는 경고를 받았습니다. 이전 민족들은 죄의 분량이 넘쳤기 때문에 하느님의 땅에서 쫓겨나고, 이스라엘은 만일 같은 죄를 지으면 하느님께서 그들도 당신의 땅에서 쫓아내시리라는 경고와 함께 이 땅에 들어갑니다:</p><blockquote><p>“네 하나님 여호와께서 그들을 네 앞에서 쫓아내신 후에 네가 심중에 이르기를 내 공의로움으로 말미암아 여호와께서 나를 이 땅으로 인도하여 들여서 그것을 차지하게 하셨다 하지 말라 이 민족들이 악함으로 말미암아 여호와께서 그들을 네 앞에서 쫓아내심이니라 네가 가서 그 땅을 차지함은 <strong><mark>네 공의로 말미암음도 아니며 네 마음이 정직함으로 말미암음도 아니요 이 민족들이 악함으로 말미암아 네 하나님 여호와께서 그들을 네 앞에서 쫓아내심이라</mark></strong> 여호와께서 이같이 하심은 네 조상 아브라함과 이삭과 야곱에게 하신 맹세를 이루려 하심이니라 그러므로 네가 알 것은 <strong><mark>네 하나님 여호와께서 네게 이 아름다운 땅을 기업으로 주신 것이 네 공의로 말미암음이 아니니라 너는 목이 곧은 백성이니라</mark></strong> 너는 광야에서 <strong>네 하나님 여호와를 격노하게 하던 일을 잊지 말고 기억하라</strong> 네가 애굽 땅에서 나오던 날부터 이 곳에 이르기까지 늘 여호와를 거역하였으되 호렙 산에서 너희가 여호와를 격노하게 하였으므로 여호와께서 진노하사 너희를 멸하려 하셨느니라” (<a href="https://bibleox.com/ko/ko-nkrv/vtor/9/#L4-8">신 9:4-8</a>; <a href="https://bibleox.com/ko/ko-nkrv/vtor/7/#L1">신 7:1</a>; <a href="https://bibleox.com/ko/ko-nkrv/nav/3/#L10">수 3:10</a>; <a href="https://bibleox.com/ko/ko-nkrv/ish/3/#L8,17">출 3:8,17</a>)</p></blockquote><blockquote><p>“너희는 너희가 거주하던 애굽 땅의 풍속을 따르지 말며 <strong>내가 너희를 인도할 가나안 땅의 풍속과 규례도 행하지 말고</strong> &lt;…&gt; <strong>너희는 이 모든 일로 스스로 더럽히지 말라</strong> 내가 너희 앞에서 쫓아내는 족속들이 이 모든 일로 말미암아 더러워졌고 그 땅도 더러워졌으므로 내가 그 악으로 말미암아 벌하고 그 땅도 스스로 그 주민을 토하여 내느니라 그러므로 너희 곧 너희의 동족이나 혹은 너희 중에 거류하는 거류민이나 <strong><mark>내 규례와 내 법도를 지키고</mark></strong> 이런 가증한 일의 하나라도 행하지 말라 너희가 전에 있던 그 땅 주민이 이 모든 가증한 일을 행하였고 그 땅도 더러워졌느니라 <strong><mark>너희도 더럽히면 그 땅이 너희가 있기 전 주민을 토함 같이 너희를 토할까 하노라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/lev/18/#L3,24-28">레 18:3,24-28</a>)</p></blockquote><blockquote><p>“<strong><mark>네가 만일 네 하나님 여호와의 말씀을 순종하지 아니하여</mark></strong> 내가 오늘 네게 명령하는 그의 모든 명령과 규례를 지켜 행하지 아니하면 이 모든 저주가 네게 임하며 네게 이를 것이니 &lt;…&gt; 네가 만일 이 책에 기록한 이 율법의 모든 말씀을 지켜 행하지 아니하고 네 하나님 여호와라 하는 영화롭고 두려운 이름을 경외하지 아니하면 &lt;…&gt; 여호와께서 너희에게 선을 행하시고 너희를 번성하게 하시기를 기뻐하시던 것 같이 이제는 <strong><mark>여호와께서 너희를 망하게 하시며 멸하시기를 기뻐하시리니 너희가 들어가 차지할 땅에서 뽑힐 것이요</mark></strong> 여호와께서 너를 땅 이 끝에서 저 끝까지 만민 중에 흩으시리니 네가 그 곳에서 너와 네 조상들이 알지 못하던 목석 우상을 섬길 것이라” (<a href="https://bibleox.com/ko/ko-nkrv/vtor/28/#L15,58,63-64">신 28:15,58,63-64</a>)</p></blockquote><h4>이스라엘 백성은 죄 때문에 앞서 쫓겨난 민족들보다 더 악하게 행했고 그들도 쫓겨났습니다</h4><blockquote><p>“이 백성이 듣지 아니하였고 므낫세의 꾐을 받고 악을 행한 것이 <strong><mark>여호와께서 이스라엘 자손 앞에서 멸하신 여러 민족보다 더 심하였더라</mark></strong> 여호와께서 그의 종 모든 선지자들을 통하여 말씀하여 이르시되 유다 왕 므낫세가 이 가증한 일과 악을 행함이 <strong><mark>그 전에 있던 아모리 사람들의 행위보다 더욱 심하였고</mark></strong> 또 그들의 우상으로 유다를 범죄하게 하였도다” (<a href="https://bibleox.com/ko/ko-nkrv/4ts/21/#L9-11">왕하 21:9-11</a>)</p></blockquote><blockquote><p>“주 여호와의 말씀이니라 너는 화 있을진저 화 있을진저 네가 모든 악을 행한 후에 &lt;…&gt; 네 음란함이 다른 여인과 같지 아니함은 행음하려고 너를 따르는 자가 없음이며 또 네가 값을 받지 아니하고 도리어 값을 줌이라 그런즉 다른 여인과 같지 아니하니라 그러므로 너 음녀야 여호와의 말씀을 들을지어다 &lt;…&gt; 너는 그 남편과 자녀를 싫어한 어머니의 딸이요 너는 그 남편과 자녀를 싫어한 형의 동생이로다 <strong>네 어머니는 헷 사람이요 네 아버지는 아모리 사람이며</strong> 네 형은 그 딸들과 함께 네 왼쪽에 거주하는 사마리아요 네 아우는 그 딸들과 함께 네 오른쪽에 거주하는 소돔이라 <strong><mark>네가 그들의 행위대로만 행하지 아니하며 그 가증한 대로만 행하지 아니하고 그것을 적게 여겨서 네 모든 행위가 그보다 더욱 부패하였도다</mark></strong> 주 여호와의 말씀이니라 내가 나의 삶을 두고 맹세하노니 <strong><mark>네 아우 소돔 곧 그와 그의 딸들은 너와 네 딸들의 행위 같이 행하지 아니하였느니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/iez/16/#L23,34-35,45-48">겔 16:23,34-35,45-48</a>)</p></blockquote><p>예수 그리스도께서 십자가에 못 박히시기 전에 유대 백성이 받은 가장 큰 벌은 약 70년 동안 이어진 바벨론 포로 생활이었습니다. 그러나 그리스도를 거부하고 죽인 뒤 유대 백성은 약 2000년 동안 자기 땅에서 쫓겨났고, 성전은 오늘까지 회복되지 않았습니다.</p><h2>옛 언약의 끝</h2><p><a href="https://bibleox.com/ru/ru/w/Ветхий-Завет-конец">구약 — 끝</a></p>
