- src: 10-заповедей
  path: Tc4m_십계명
  title: 십계명
  copy_cover: true
  body: <h2>하느님께서 돌판에 새겨 선지자 모세에게 주신 열 가지 계명</h2><p>하느님의 명령은 이 계명들에 그치지 않았지만, 돌판에 새겨 주신 것은 바로 이 명령들이었습니다.</p><h3>1</h3><blockquote><p>“나는 너를 애굽 땅, 종 되었던 집에서 인도하여 낸 <strong>네 하나님 여호와니라</strong> <strong>너는 나 외에는 다른 신들을 네게 두지 말라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ish/20/#L2-3">출 20:2-3</a>; <a href="https://bibleox.com/ko/ko-nkrv/vtor/5/#L6-7">신 5:6-7</a>; <a href="https://bibleox.com/ko/ko-nkrv/lev/19/#L2">레 19:2</a>)</p></blockquote><h3>2</h3><blockquote><p>“<strong>너를 위하여 새긴 우상을 만들지 말고</strong> 또 위로 하늘에 있는 것이나 아래로 땅에 있는 것이나 땅 아래 물 속에 있는 것의 어떤 형상도 만들지 말며 그것들에게 절하지 말며 그것들을 섬기지 말라 나 네 하나님 여호와는 질투하는 하나님인즉 나를 미워하는 자의 죄를 갚되 아버지로부터 아들에게로 삼사 대까지 이르게 하거니와” (<a href="https://bibleox.com/ko/ko-nkrv/ish/20/#L4-5">출 20:4-5</a>; <a href="https://bibleox.com/ko/ko-nkrv/vtor/5/#L8-9">신 5:8-9</a>; <a href="https://bibleox.com/ko/ko-nkrv/lev/19/#L4">레 19:4</a>)</p></blockquote><h3>3</h3><blockquote><p>“<strong>너는 네 하나님 여호와의 이름을 망령되게 부르지 말라</strong> 여호와는 그의 이름을 망령되게 부르는 자를 죄 없다 하지 아니하리라” (<a href="https://bibleox.com/ko/ko-nkrv/ish/20/#L7">출 20:7</a>; <a href="https://bibleox.com/ko/ko-nkrv/vtor/5/#L11">신 5:11</a>; <a href="https://bibleox.com/ko/ko-nkrv/lev/19/#L12">레 19:12</a>)</p></blockquote><h3>4</h3><blockquote><p>“<strong>안식일을 기억하여 거룩하게 지키라</strong> 엿새 동안은 힘써 네 모든 일을 행할 것이나 일곱째 날은 네 하나님 여호와의 안식일인즉 너나 네 아들이나 네 딸이나 네 남종이나 네 여종이나 네 가축이나 네 문안에 머무는 객이라도 아무 일도 하지 말라” (<a href="https://bibleox.com/ko/ko-nkrv/ish/20/#L8-10">출 20:8-10</a>; <a href="https://bibleox.com/ko/ko-nkrv/vtor/5/#L12-15">신 5:12-15</a>; <a href="https://bibleox.com/ko/ko-nkrv/lev/19/#L3">레 19:3</a>; <a href="https://bibleox.com/ko/ko-nkrv/lev/19/#L30">레 19:30</a>; <a href="https://bibleox.com/ko/ko-nkrv/ier/17/#L21">렘 17:21</a>; <a href="https://bibleox.com/ko/ko-nkrv/neem/13/#L15-18">느 13:15-18</a>)</p></blockquote><h3>5</h3><blockquote><p>“<strong>네 부모를 공경하라</strong> 그리하면 네 하나님 여호와가 네게 준 땅에서 네 생명이 길리라” (<a href="https://bibleox.com/ko/ko-nkrv/ish/20/#L12">출 20:12</a>; <a href="https://bibleox.com/ko/ko-nkrv/vtor/5/#L16">신 5:16</a>; <a href="https://bibleox.com/ko/ko-nkrv/lev/19/#L3">레 19:3</a>)</p></blockquote><h3>6</h3><blockquote><p>“<strong>살인하지 말라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ish/20/#L13">출 20:13</a>; <a href="https://bibleox.com/ko/ko-nkrv/vtor/5/#L17">신 5:17</a>; <a href="https://bibleox.com/ko/ko-nkrv/lev/19/#L17-18">레 19:17-18</a>)</p></blockquote><h3>7</h3><blockquote><p>“<strong>간음하지 말라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ish/20/#L14">출 20:14</a>; <a href="https://bibleox.com/ko/ko-nkrv/vtor/5/#L18">신 5:18</a>; <a href="https://bibleox.com/ko/ko-nkrv/lev/19/#L20">레 19:20</a>)</p></blockquote><h3>8</h3><blockquote><p>“<strong>도둑질하지 말라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ish/20/#L15">출 20:15</a>; <a href="https://bibleox.com/ko/ko-nkrv/vtor/5/#L19">신 5:19</a>; <a href="https://bibleox.com/ko/ko-nkrv/lev/19/#L11">레 19:11</a>; <a href="https://bibleox.com/ko/ko-nkrv/lev/19/#L13">레 19:13</a>)</p></blockquote><h3>9</h3><blockquote><p>“<strong>네 이웃에 대하여 거짓 증거하지 말라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ish/20/#L16">출 20:16</a>; <a href="https://bibleox.com/ko/ko-nkrv/vtor/5/#L20">신 5:20</a>; <a href="https://bibleox.com/ko/ko-nkrv/lev/19/#L11">레 19:11</a>)</p></blockquote><h3>10</h3><blockquote><p>“<strong>네 이웃의 집을 탐내지 말라</strong> 네 이웃의 아내나 그의 남종이나 그의 여종이나 그의 소나 그의 나귀나 무릇 네 이웃의 소유를 탐내지 말라” (<a href="https://bibleox.com/ko/ko-nkrv/ish/20/#L17">출 20:17</a>; <a href="https://bibleox.com/ko/ko-nkrv/vtor/5/#L21">신 5:21</a>; <a href="https://bibleox.com/ko/ko-nkrv/lev/19/#L17">레 19:17</a>)</p></blockquote><h2>해설</h2><p><a href="https://bibleox.com/ru/ru/w/Z1BU_Изъяснение_десяти_заповедей">십계명 해설(러시아어)</a></p>
