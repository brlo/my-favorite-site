  body: '<h2>제사장 위임</h2><h3>예식</h3><p>기름 부음으로 이루어집니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/28/#L41">출 28:41</a>). 위임에는 거룩한 옷이 필요하며(<a href="https://bibleox.com/ko/ko-nkrv/ish/28/#L2-3">출 28:2-3</a>), 그 옷은 직분과 함께 물려집니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/29/#L29">출 29:29</a>).</p><h3>제사장은 아론의 후손만</h3><p>선지자 모세의 형 아론과 그의 후손만 제사장이 될 수 있었습니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/28/#L1">출 28:1</a>; <a href="https://bibleox.com/ko/ko-nkrv/ish/28/#L4">출 28:4</a>; <a href="https://bibleox.com/ko/ko-nkrv/ish/29/#L9">출 29:9</a>). 외인이 제사장 직무를 맡으면 죽임을 당해야 했습니다(<a href="https://bibleox.com/ko/ko-nkrv/chis/3/#L10">민 3:10</a>).</p><h3>후보자의 자격</h3><h4>제사장은 몸에 흠이 없어야 합니다</h4><blockquote><p>“아론에게 말하여 이르라 누구든지 너의 자손 중 대대로 <strong>육체에 흠이 있는 자는</strong> 그 하나님의 음식을 드리려고 <strong>가까이 오지 못할 것이니라</strong> 누구든지 흠이 있는 자는 가까이 하지 못할지니 곧 <strong>맹인이나 다리 저는 자나</strong> 코가 불완전한 자나 지체가 더한 자나 발 부러진 자나 손 부러진 자나 등 굽은 자나 키 못 자란 자나 눈에 백막이 있는 자나 습진이나 버짐이 있는 자나 고환 상한 자나 제사장 아론의 자손 중에 흠이 있는 자는 나와 여호와께 화제를 드리지 못할지니 그는 흠이 있은즉 나와서 그의 하나님께 음식을 드리지 못하느니라” (<a href="https://bibleox.com/ko/ko-nkrv/lev/21/#L17-21">레 21:17-21</a>)</p></blockquote><h3>의무</h3><p>머리털과 수염을 길러야 합니다:</p><blockquote><p>“여호와께서 모세에게 이르시되 <strong>아론의 자손 제사장들에게 말하여 이르라</strong> 그의 백성 중에서 죽은 자를 만짐으로 말미암아 스스로를 더럽히지 말려니와 &lt;…&gt; 제사장들은 <strong>머리털을 깎아 대머리 같게 하지 말며 자기의 수염 양쪽을 깎지 말며</strong> 살을 베지 말고” (<a href="https://bibleox.com/ko/ko-nkrv/lev/21/#L1,5">레 21:1,5</a>)</p></blockquote><p>이혼당한 여인을 아내로 맞아서는 안 됩니다:</p><blockquote><p>“그들은 <strong>부정한 창녀나 이혼 당한 여인을 취하지 말지니</strong> 이는 그가 여호와 하나님께 거룩함이니라” (<a href="https://bibleox.com/ko/ko-nkrv/lev/21/#L7">레 21:7</a>)</p></blockquote><p>죽은 자를 만져서는 안 되지만, 죽은 친족을 만지는 것은 허락됩니다:</p><blockquote><p>“여호와께서 모세에게 이르시되 아론의 자손 제사장들에게 말하여 이르라 그의 백성 중에서 <strong>죽은 자를 만짐으로 말미암아 스스로를 더럽히지 말려니와</strong> <strong>그의 살붙이인</strong> 그의 어머니나 그의 아버지나 그의 아들이나 그의 딸이나 그의 형제나 출가하지 아니한 처녀인 그의 자매로 말미암아서는 몸을 더럽힐 수 있느니라 제사장은 그의 백성의 어른인즉 자신을 더럽혀 속되게 하지 말지니라” (<a href="https://bibleox.com/ko/ko-nkrv/lev/21/#L1-4">레 21:1-4</a>)</p></blockquote><h3>대제사장의 의무</h3><p>대제사장은 죽은 친족도 만질 수 없습니다:</p><blockquote><p>“자기의 형제 중 관유로 부음을 받고 위임되어 그 예복을 입은 <strong>대제사장은</strong> 그의 머리를 풀지 말며 그의 옷을 찢지 말며 <strong>어떤 시체에든지 가까이 하지 말지니 그의 부모로 말미암아서도 더러워지게 하지 말며</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/lev/21/#L10-11">레 21:10-11</a>)</p></blockquote><p>그의 아내는 혼인한 적 없는 처녀여야 합니다:</p><blockquote><p>“<strong>그는 처녀를 데려다가 아내를 삼을지니</strong> <strong>과부나 이혼 당한 여자나 창녀 짓을 하는 더러운 여인을 취하지 말고 자기 백성 중에서 처녀를 취하여 아내를 삼아</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/lev/21/#L13-14">레 21:13-14</a>)</p></blockquote><p>머리를 풀지 말아야 합니다:</p><blockquote><p>“자기의 형제 중 관유로 부음을 받고 위임되어 그 예복을 입은 대제사장은 <strong>그의 머리를 풀지 말며</strong> 그의 옷을 찢지 말며” (<a href="https://bibleox.com/ko/ko-nkrv/lev/21/#L10">레 21:10</a>) <em>(러시아어 시노달 번역: “머리를 드러내지 말며”.)</em></p></blockquote>'
