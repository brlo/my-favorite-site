  references: '<ol><li><p>함께 보기: <a href="https://bibleox.com/ru/ru/w/храм-образ-небесной-реальности">성전 — 천상 실재의 형상</a></p></li></ol><p>번역: 로디온 블라소프 (AI 도구 활용). 저본: 러시아어 원문. 참고: 영어·일본어 번역. 성경 인용과 링크는 공동번역 성서에 따름.</p>'
- src: чин-порядок-обряд
  path: Or20d_질서_예식
  title: 질서, 예식, 의례
  copy_cover: true
  body: <h2>정의</h2><p><strong>예식(의식)</strong>은 어떤 반복되는 행위의 정해진 질서입니다. 질서가 있는 것은 무엇이든 예식이라고 부를 수 있습니다.</p><p><strong>예식서</strong>는 어떤 예배의 내용을 차례대로 자세히 서술한 것입니다.</p><p>성사도 정해진 질서, 곧 예식에 따라 거행됩니다.</p><h2>교회에서는 모든 일을 질서 있게 해야 합니다</h2><blockquote><p>“다만 나는 여러분이 모든 일에 점잖게 또 <strong>질서있게</strong> 처리해 주시기를 바랄 뿐입니다.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/14/#L40">1고린 14:40</a>)</p></blockquote><blockquote><p>“교우 여러분, 우리는 주 예수 그리스도의 이름으로 여러분에게 명령합니다. 누구를 막론하고 <strong>게으른 생활을 하거나</strong> 우리에게서 받은 전통을 따르지 않는 교우는 여러분이 멀리해야 합니다.” (<a href="https://bibleox.com/ko/ko-ctb/2sol/3/#L6">2데살 3:6</a>) <em>(그리스어 ἀτάκτως는 “무질서하게”라는 뜻입니다.)</em></p></blockquote><blockquote><p>“그런데 여러분 가운데는 <strong>게으른 생활을 하며</strong> 아무 일도 하지 않고 남의 일에만 참견하는 사람이 있다는 말이 들립니다.” (<a href="https://bibleox.com/ko/ko-ctb/2sol/3/#L11">2데살 3:11</a>) <em>(그리스어 ἀτάκτως는 “무질서하게”라는 뜻입니다.)</em></p></blockquote>
