  title: 그리스도교 성당
  copy_cover: true
  body: '<blockquote><p>“그러자 군중 속에 끼어 있던 바리사이파 사람들은 ‘선생님, 제자들이 저러는데 왜 꾸짖지 않으십니까?’하고 말하였다. 그러나 예수께서는 ‘잘 들어라. <strong>그들이 입을 다물면 돌들이 소리지를 것이다</strong>’하고 대답하셨다.” (<a href="https://bibleox.com/ko/ko-ctb/lk/19/#L39-40">루가 19:39-40</a>)</p></blockquote><blockquote><p>“너희는 나의 안식일을 지키고, <strong>나의 성소를 소중하게 여겨라</strong>. 나는 야훼이다.” (<a href="https://bibleox.com/ko/ko-ctb/lev/19/#L30">레 19:30</a>; <a href="https://bibleox.com/ko/ko-ctb/lev/26/#L2">레 26:2</a>)</p></blockquote><h2>그리스도의 지상 생애 동안</h2><p>그리스도께서는 성체성혈성사를 위해 준비된 큰 방에 제자들을 모으십니다:</p><blockquote><p>“그러면 그가 <strong>이미 자리가 마련된 큰 이층방</strong>을 보여 줄 터이니 거기에다 준비해 좋아라‘하고 말씀하셨다.” (<a href="https://bibleox.com/ko/ko-ctb/mk/14/#L15">마르 14:15</a>)</p></blockquote><p>그리스도인들은 교회가 세워진 뒤 성전에 모입니다:</p><blockquote><p>“그리고 한 마음이 되어 <strong><mark>날마다 열심히 성전에 모였으며</mark></strong> 집집마다 돌아 가며 빵을 나누고 순수한 마음으로 기쁘게 음식을 함께 먹으며” (<a href="https://bibleox.com/ko/ko-ctb/act/2/#L46">사도 2:46</a>)</p></blockquote><blockquote><p>“<strong><mark>날마다 성전에서</mark></strong> 하느님을 찬미하며 지냈다.” (<a href="https://bibleox.com/ko/ko-ctb/lk/24/#L53">루가 24:53</a>)</p></blockquote><h2>그리스도의 승천 뒤</h2><p>그리스도인들은 성전을 꾸준히 찾아갔습니다:</p><blockquote><p>“날마다 <strong><mark>성전에서</mark></strong> 하느님을 찬미하며 지냈다.” (<a href="https://bibleox.com/ko/ko-ctb/lk/24/#L53">루가 24:53</a>)</p></blockquote><blockquote><p>“그리고 한 마음이 되어 날마다 열심히 <strong><mark>성전에 모였으며</mark></strong> <strong>집집마다 돌아 가며 빵을 나누고</strong> 순수한 마음으로 기쁘게 음식을 함께 먹으며” (<a href="https://bibleox.com/ko/ko-ctb/act/2/#L46">사도 2:46</a>)</p></blockquote><blockquote><p>“어느 날 베드로와 요한은 오후 세 시 기도하는 시간이 되어 <strong><mark>성전으로 올라 가고 있었는데</mark></strong>” (<a href="https://bibleox.com/ko/ko-ctb/act/3/#L1">사도 3:1</a>)</p></blockquote><blockquote><p>“‘그 뒤 나는 예루살렘으로 돌아 왔습니다. 그런데 하루는 내가 <strong><mark>성전에서 기도하고 있을 때</mark></strong> 무아지경에 빠져” (<a href="https://bibleox.com/ko/ko-ctb/act/22/#L17">사도 22:17</a>)</p></blockquote><blockquote><p>“각하께서도 확인해 볼 수 있는 일입니다만 제가 <strong>순례하러 예루살렘에 올라 온지는</strong> 이제 열 이틀밖에 되지 않습니다. 그 동안에 <strong><mark>성전이나</mark></strong> 회당이나 거리에서 어느 누구와도 논쟁을 벌인 일도 없으며 군중을 선동한 일도 없습니다.” (<a href="https://bibleox.com/ko/ko-ctb/act/24/#L11-12">사도 24:11-12</a>)</p></blockquote><p>그리스도인들은 자기들만의 장소에도 모였습니다:</p><blockquote><p>“그를 만나 안티오키아로 데리고 왔다. 거기에서 두 사람은 <strong><mark>만 일 년 동안 그 곳 교회 신도들과 함께 지내면서</mark></strong> 많은 사람들을 가르쳤다. 이 때부터 안티오키아에 있는 신도들이 처음으로 그리스도인이라고 불리게 되었다.” (<a href="https://bibleox.com/ko/ko-ctb/act/11/#L26">사도 11:26</a>)</p></blockquote><blockquote><p>“무엇보다도 <strong>여러분이 모이는 교회</strong> 안에 당파가 생겼다는 말을 들었는데 나는 그것이 전연 헛소문만은 아니라고 생각합니다. 하기야 여러분 가운데서 진실한 사람들이 드러나려면 분파도 있어야 할 것입니다. 하지만 여러분이 한 자리에 모여서 나누는 식사는 주님의 성찬을 나누는 것이라 할 수가 없습니다. 여러분은 모여서 음식을 먹을 때에 각각 자기가 가져 온 것을 먼저 먹어 치우고 따라서 굶주리는 사람이 생기는가 하면 술에 만취하는 사람도 생기니 말입니다. <strong>각각 자기 집이 없어서 거기에서 먹고 마시는 겁니까</strong>? 그렇지 않으면 <strong><mark>하느님의 교회를 멸시하고</mark></strong> 가난한 사람들에게 창피를 주려고 그러는 것입니까? 내가 무엇이라고 말해야 하겠습니까? 이래도 여러분을 칭찬해야 하겠습니까? 이 일만은 칭찬할 수 없습니다.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/11/#L18-22">1고린 11:18-22</a>)</p></blockquote><blockquote><p>“여자들은 <strong><mark>교회 집회에서</mark></strong> 말할 권리가 없으니 말을 하지 마십시오. 율법에도 있듯이 여자들은 남자에게 복종해야 합니다. 알고 싶은 것이 있으면 <strong>집에 돌아 가서 남편들에게 물어 보도록 하십시오</strong>. <strong><mark>여자가 교회 집회에서 말하는 것은 자기에게 수치가 됩니다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/14/#L34-35">1고린 14:34-35</a>)</p></blockquote><h2>천상 성전의 예언적 묘사</h2><p>묵시록의 천상 성전 묘사</p><p><strong>천상 성전을 측량하라는 명령</strong></p><blockquote><p>“또 나는 지팡이 같은 측량자 하나를 받았는데 그 때 이런 말씀이 나에게 들려 왔습니다. ‘일어나서 <strong><mark>하느님의 성전과 제단을 측량하고</mark></strong> 성전 안에서 예배하는 사람들을 세어 보아라.” (<a href="https://bibleox.com/ko/ko-ctb/otkr/11/#L1">묵시 11:1</a>)</p></blockquote><p><strong>옥좌</strong></p><blockquote><p>“스물 네 원로는 <strong><mark>옥좌에 앉아 계신 그분</mark></strong> 앞에 엎드려 영원무궁토록 살아 계신 그분에게 경배를 드리고 있었습니다. 그리고 자기들의 금관을 벗어서 옥좌 앞에 내 놓으며” (<a href="https://bibleox.com/ko/ko-ctb/otkr/4/#L10">묵시 4:10</a>)</p></blockquote><blockquote><p>“그리고 하느님 앞에서 자기 자리에 앉아 있던 스물 네 원로도 엎드려 하느님께 경배하며,” (<a href="https://bibleox.com/ko/ko-ctb/otkr/11/#L16">묵시 11:16</a>)</p></blockquote><p><strong>제단</strong></p><blockquote><p>“다른 천사 하나가 금향로를 들고 <strong><mark>제단 앞에</mark></strong> 와 섰습니다. 그 천사는 모든 성도들의 기도를 향에 섞어서 <strong><mark>옥좌 앞에 있는 황금제단</mark></strong>에 드리려고 많은 향을 받아 들었습니다.” (<a href="https://bibleox.com/ko/ko-ctb/otkr/8/#L3">묵시 8:3</a>)</p></blockquote><blockquote><p>“그 뒤에 그 천사는 향로를 가져다가 거기에 <strong><mark>제단 불</mark></strong>을 가득히 담아서 땅에 던졌습니다. 그러자 천둥과 요란한 소리와 번개와 지진이 일어났습니다.” (<a href="https://bibleox.com/ko/ko-ctb/otkr/8/#L5">묵시 8:5</a>)</p></blockquote><blockquote><p>“여섯째 천사가 나팔을 불었습니다. 그러자 나는 하느님 앞에 있는 <strong><mark>금제단</mark></strong>의 네 모퉁이에 달린 뿔에서 나오는 한 음성을 들었습니다.” (<a href="https://bibleox.com/ko/ko-ctb/otkr/9/#L13">묵시 9:13</a>)</p></blockquote><p><strong>일곱 가지 등잔대</strong></p><blockquote><p>“그 옥좌에서는 번개가 번쩍였고 요란한 소리와 천둥소리가 터져 나왔습니다. 그리고 <strong>옥좌 앞에서는</strong> <strong><mark>일곱 횃불이</mark></strong> 훨훨 타고 있었습니다. 그 일곱 횃불은 하느님의 일곱 영신이십니다.” (<a href="https://bibleox.com/ko/ko-ctb/otkr/4/#L5">묵시 4:5</a>)</p></blockquote><p><strong>분향</strong></p><blockquote><p>“다른 천사 하나가 <strong>금향로</strong>를 들고 제단 앞에 와 섰습니다. 그 천사는 모든 성도들의 기도를 향에 섞어서 옥좌 앞에 있는 황금제단에 드리려고 <strong><mark>많은 향</mark></strong>을 받아 들었습니다. &lt;…&gt; 그 뒤에 그 <strong>천사는 향로를 가져다가</strong> 거기에 제단 불을 가득히 담아서 땅에 던졌습니다. 그러자 천둥과 요란한 소리와 번개와 지진이 일어났습니다.” (<a href="https://bibleox.com/ko/ko-ctb/otkr/8/#L3,5">묵시 8:3,5</a>)</p></blockquote><h2>하느님께서는 성전을 공경하라고 명하셨습니다</h2><p>성전은 <a href="https://bibleox.com/ru/ru/w/храм-образ-небесной-реальности">천상 실재의 형상</a>입니다. 하느님께서는 이 형상을 공경하라고 명하셨습니다:</p><blockquote><p>“너희는 나의 안식일을 지키고, <strong>나의 성소를 소중하게 여겨라</strong>. 나는 야훼이다.” (<a href="https://bibleox.com/ko/ko-ctb/lev/19/#L30">레 19:30</a>)</p></blockquote><blockquote><p>“너희는 나의 안식일을 지키고, <strong>나의 성소를 어려워하여라</strong>. 나는 야훼이다.” (<a href="https://bibleox.com/ko/ko-ctb/lev/26/#L2">레 26:2</a>)</p></blockquote><p>신약의 성전은 신학자 요한의 묵시록에 나오는 형상대로 지어집니다.</p><h2>비판</h2><h3>사도들은 깨닫지 못해서 성전을 찾아갔는가?</h3><p>사도들이 신앙 문제를 잘 깨닫지 못한 때도 있었습니다. 예를 들어 그들은 그리스도께서 예루살렘에서 왕이 되시리라 생각했고(<a href="https://bibleox.com/ko/ko-ctb/mk/10/#L37-39">마르 10:37-39</a>), 그리스도의 고난과 부활에 관한 말씀을 깨닫지 못하면서 묻기를 두려워했습니다(<a href="https://bibleox.com/ko/ko-ctb/mk/9/#L31-32">마르 9:31-32</a>; <a href="https://bibleox.com/ko/ko-ctb/lk/9/#L45">루가 9:45</a>).</p><p>그러나 이 모든 일은 그리스도 부활 당일(<a href="https://bibleox.com/ko/ko-ctb/in/20/#L21-23">요한 20:21-23</a>)과 부활 후 50일째(<a href="https://bibleox.com/ko/ko-ctb/act/2/#L1-4">사도 2:1-4</a>)에 성령의 은사를 받기 전까지의 일입니다. 게다가 부활 뒤에 그리스도께서는 성경을 깨닫도록 그들의 마음을 열어 주셨습니다(<a href="https://bibleox.com/ko/ko-ctb/lk/24/#L45">루가 24:45</a>). 부활 전에도 그리스도께서는 반박할 수 없는 지혜를 사도들에게 주시겠다고 약속하셨고(<a href="https://bibleox.com/ko/ko-ctb/lk/21/#L15">루가 21:15</a>), 사도는 나중에 하느님께서 온갖 지혜와 총명을 넘치도록 주셨다고 전합니다(<a href="https://bibleox.com/ko/ko-ctb/ef/1/#L8">에페 1:8</a>). 사도 바울로는 자신이 말재주는 없어도 지식은 모자라지 않는다고 합니다(<a href="https://bibleox.com/ko/ko-ctb/2kor/11/#L6">2고린 11:6</a>).</p><p>개신교인들은 신앙 문제에서 자기들이 사도들보다 “더 높은” 깨달음을 지녔음을 보이려고 성령이 사도들에게 내려오시기 전의 여러 일을 내세웁니다. 그러나 이는 옳지 않습니다. 교회는 그 뒤에 세워지고 갖추어졌으며, 그때 사도들에게는 더 이상 신앙을 잘못 이해하는 일이 없었습니다.</p><p>그러니 성령을 받은 뒤 사도들은 신앙 문제를 깨달았고 지식이 부족하지 않았습니다. 설령 무언가 깨닫지 못한 일이 있었더라도 주님께서 사라지신 것이 아니고 사도들을 가르쳐 주셨습니다. 예를 들어 주님께서는 환시를 통해 사도 베드로에게 백인대장 고르넬리오, 곧 유다인이 아닌 사람에게 세례를 주어야 함을 보여 주셨습니다. 이 일은 당시 교회의 일부 사람들을 당혹스럽게 했습니다.</p><h3>하느님께는 성전이 아니라 영과 진리로 예배해야 하는가?</h3><p>성경을 따르면 이 대화는 성전에 관한 것이 아니라 예배 장소에 관한 것입니다.</p><blockquote><p>“그랬더니 그 여자는 ‘과연 선생님은 예언자이십니다. 그런데 우리 조상은 저 산에서 하느님께 예배드렸는데 선생님네들은 <strong>예배드릴 곳</strong>이 예루살렘에 있다고 합니다’하고 말하였다.” (<a href="https://bibleox.com/ko/ko-ctb/in/4/#L19-20">요한 4:19-20</a>)</p></blockquote><p>사마리아 여인은 질문으로 그리스도를 어떤 틀 안에 넣습니다. 어디서 예배해야 합니까?</p><ul><li><p>그리짐 산;</p></li><li><p>예루살렘 성전.</p></li></ul><p>그러나 그리스도께서는 사람들이 산에서도 예루살렘에서도 아니라 영과 진리로 예배할 때가 오며 이미 왔다고 말씀하십니다:</p><blockquote><p>“예수께서는 이렇게 말씀하셨다. ‘내 말을 들어라. 사람들이 아버지께 예배를 드릴 때에 <strong>이 산이다 또는 예루살렘이다 하고 굳이 장소를 가리지 않아도 될 때가 올 것이다</strong>. 너희는 무엇인지도 모르고 예배하지만 우리는 우리가 예배드리는 분을 잘 알고 있다. 구원은 유다인에게서 오기 때문이다. 그러나 <strong>진실하게 예배하는 사람들이 영적으로 참되게 아버지께 예배를 드릴 때가 올 터인데 바로 지금이 그 때이다</strong>. 아버지께서는 이렇게 예배하는 사람들을 찾고 계신다.” (<a href="https://bibleox.com/ko/ko-ctb/in/4/#L21-23">요한 4:21-23</a>)</p></blockquote><p>보시다시피 여기에는 성전 이야기가 없습니다. 성전에 관한 말씀이라고 생각하는 사람은 산에서 기도하는 것도 금해야 합니다. 그리스도께서 산도 말씀하시기 때문입니다. 그렇다면 성전을 금하는 사람들은 산도 금해야 합니다. 산에 사십니까? 기도하지 마십시오. 물론 이것은 합리적이지 않습니다.</p><p>그리스도께서 이 예배의 때가 이미 왔다고 말씀하신 점도 주목해야 합니다. 그럼에도 그리스도께서는 예루살렘 성전에 오셔서 그곳을 아버지의 집, 기도의 집이라 부르시고, 아무것도 기도를 방해하지 않도록 돌보십니다.</p><p>곧 영과 진리로 예배할 때가 이미 왔어도 성전이 폐지되지는 않았습니다. 이 집이 황폐하게 버려진 것은 이스라엘의 대다수가 구세주를 거부한 뒤의 일입니다. 그리스도께서는 포도밭을 이전 소작인들(구약의 사제직)에게서 빼앗아 다른 이들, 곧 사도들에게 주시고, 버리신 이들에게 그들의 집이 황폐해진다고, 곧 하느님의 은총이 떠난다고 말씀하십니다:</p><blockquote><p>“<strong>너희 성전은 하느님께 버림을 받아 황폐해지리라</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/mf/23/#L38">마태 23:38</a>)</p></blockquote><p>그리스도께서 십자가에서 돌아가신 뒤 바위가 갈라지고 휘장이 찢어진 것이 그 상징입니다:</p><blockquote><p>“바로 그 때에 <strong>성전 휘장이 위에서 아래까지 두 폭으로 찢어지고 땅이 흔들리며 바위가 갈라지고</strong>” (<a href="https://bibleox.com/ko/ko-ctb/mf/27/#L51">마태 27:51</a>)</p></blockquote><p>그때부터 그리스도인들은 온 세상 어디서나 기도했고, 건물 안에서도 밖에서도 어디서나 성체성혈성사의 새 제사를 바쳤습니다.</p><h3>왜 성당이 필요한가? 휘장이 찢어졌으니(마태 27:51) 하느님께서 성전을 떠나신 것이 아닌가?</h3><p>구원을 위해 성당(돌로 지은 건물)이 필요한 것은 아닙니다. 정교회의 많은 성인이 광야에서 구원받았습니다. 그러나 구원을 위해서는 성사에 참여해야 하고, 성사는 예배에서 거행되며, 예배에는 자연스러운 이유로 건물이 필요합니다. 필요할 때 정교회는 건물 없이도 지냅니다.</p><p>건물이 있으면 교회는 그곳을 하느님께 봉헌된 장소, 곧 성당으로 여깁니다. 이곳에서 사람들은 하느님의 이름을 부르고, 성사에서 하느님의 은총이 나타나며, 성체성혈성사 안에 그리스도께서 친히 계십니다. 그래서 정교인들은 이런 곳을 하느님께서 나타나시는 곳으로 특별히 공경합니다. 하느님 자신이 당신께서 나타나시는 곳을 공경하라고 요구하시고(<a href="https://bibleox.com/ko/ko-ctb/ish/3/#L5">출 3:5</a>) 성전을 공경하라고 요구하시기 때문입니다(<a href="https://bibleox.com/ko/ko-ctb/lev/19/#L30">레 19:30</a>; <a href="https://bibleox.com/ko/ko-ctb/lev/26/#L2">레 26:2</a>).</p><p>구약 성전의 찢어진 휘장은 구약 교회의 폐지를 가리킵니다. 곧 예루살렘 성전이 구약 교회(이스라엘)와 하느님이 만나는 곳으로서 하느님께 버림받았음을 가리킵니다. 포도밭은 구약 교회에서 거두어져(<a href="https://bibleox.com/ko/ko-ctb/mf/21/#L43">마태 21:43</a>) 그리스도께서 세우신 신약 교회에 주어졌고, 그리스도께서는 계약과 사제직을 바꾸셨습니다(<a href="https://bibleox.com/ko/ko-ctb/evr/7/#L12">히브 7:12</a>).</p><p>신약 교회는 버림받은 구약 교회의 성전을 쓰지 않고, 그곳에서 예배하지 않으며, 그곳에서 하느님께서 나타나시기를 기대하지 않습니다.</p><h3>성전은 하나였고 파괴되었으니 성당을 지어서는 안 되는가?</h3><p>성전이 파괴된 것은 처음이 아닙니다. 이미 두 번째 성전이었습니다. 그 전에는 이동식 성전인 회막이 있어서 이스라엘 사람들이 시나이 광야에서 옮기고 다녔습니다. 느부갓네살이 처음 성전을 파괴했을 때 하느님께서 성전 예배의 가능성을 거부하신 것입니까? 아니라면 나중에 로마인들이 다시 파괴했을 때 왜 그렇게 되어야 합니까?</p><p>그리스도를 거부한 유다인들은 예루살렘 성전에서만 기도하고 하느님께 예배할 수 있다고 생각했습니다. 그들은 첫 순교자 대보제 스테파노를 의회의 재판에 불러, 이곳이 파괴되고 관습이 바뀐다고 가르친다고 고발했습니다(<a href="https://bibleox.com/ko/ko-ctb/act/6/#L13-14">사도 6:13-14</a>). 대보제는 조상들의 역사를 자세히 이야기하며, 그들이 어디서나 기도하고 제물을 바쳤으며 어디에 있든 하느님께서 함께하셨음을 보여 주는 것으로 변론했습니다(<a href="https://bibleox.com/ko/ko-ctb/act/7/#L2-53">사도 7:2-53</a>).</p><p>끝으로 그는 이 성전도 조상 다윗의 바람과 기도에 따라 솔로몬이 지었지만, 하느님께서는 당신을 위해 집을 지을 필요가 없음을 분명히 하셨다고 가리킵니다:</p><blockquote><p>“<strong>다윗</strong>은 하느님의 은총을 입은 사람으로서 야곱의 후손을 위하여 <strong>성전을 짓게 해 달라고 간구하였지만</strong> 성전을 지은 사람은 솔로몬이었습니다. 그러나 <strong>지극히 높으신 분은 사람의 손으로 지은 집에는 사시지 않습니다</strong>. 예언자는 이렇게 말하고 있습니다. 주님의 말씀을 들어라. 하늘은 나의 옥좌요, 땅은 나의 발판이다. 그러니 <strong>너희가 나를 위하여 어떤 집을 지어 줄 것이며 내가 쉴 곳이 어디냐</strong>?” (<a href="https://bibleox.com/ko/ko-ctb/act/7/#L46-49">사도 7:46-49</a>)</p></blockquote><p>이처럼 옛 계약이 맺어지기 전에도 의인들은 어디서나 기도하고 제물을 바쳤습니다. 나중에 하느님께서는 이스라엘에게 성전 하나와 대사제 한 사람이 있는 중앙집중적 예배 형식을 정해 주셨습니다. 그들이 지리적으로 늘 가까이 있었기 때문입니다. 이런 형식은 하느님께서 바라시는 일치를 지키기 위한 것이었습니다.</p><p>그러나 주님께서는 예언대로(<a href="https://bibleox.com/ko/ko-ctb/is/66/#L18-21">이사 66:18-21</a>) 모든 민족을 교회로 부르시면서 어느 민족에게서나 어디서나 예배할 조건도 마련하십니다. 그분 자신이 대사제가 되시고(하느님으로서 어디에나 계십니다), 어느 한 사람이 아니라 많은 사도에게 은총을 보내시고 권한을 주시며(<a href="https://bibleox.com/ko/ko-ctb/mf/18/#L18">마태 18:18</a>), 성체성혈의 제사를 어떤 장소에 묶지 않으시고(<a href="https://bibleox.com/ko/ko-ctb/lk/22/#L19">루가 22:19</a>), 사도들을 온 세상에 보내십니다(<a href="https://bibleox.com/ko/ko-ctb/mk/16/#L15">마르 16:15</a>).</p><p>그리스도인의 예배는 바로 성체성혈성사를 중심으로 이루어집니다. 이를 위해 성당이 꼭 필요한 것은 아닙니다. 정교인은 예배를 드리려면 반드시 성당이 있어야 한다고 말하는 사람들은 우리가 가르치지 않는 것을 지어내는 것입니다. 필요할 때 예배는 병원, 군대, 감옥, 배와 비행기와 기차 안, 숲속 등 어디서나 드립니다.</p><p>우리는 구원을 위해 성당(돌로 지은 건물)이 필요하다고 가르치지 않습니다. 정교회의 많은 성인이 광야에서 구원받았습니다. 그러나 구원을 위해서는 성사에 참여해야 하고, 성사는 예배에서 거행되며, 예배에는 자연스러운 이유로 건물이 필요합니다. 필요할 때 정교회는 건물 없이도 지냅니다.</p><p>건물이 있으면 교회는 그곳을 하느님께 봉헌된 장소, 곧 성당으로 여깁니다. 이곳에서 사람들은 하느님의 이름을 부르고, 성사에서 하느님의 은총이 나타나며, 성체성혈성사 안에 그리스도께서 친히 계십니다. 그래서 정교인들은 이런 곳을 하느님께서 나타나시는 곳으로 특별히 공경합니다. 하느님 자신이 당신께서 나타나시는 곳을 공경하라고 요구하시기 때문입니다:</p><blockquote><p>“하느님께서는 ‘이리로 가까이 오지 말아라. <strong>네가 서 있는 것은 거룩한 땅이니</strong> 네 발에서 신을 벗어라.’ 하시고는” (<a href="https://bibleox.com/ko/ko-ctb/ish/3/#L5">출 3:5</a>)</p></blockquote><p>또 당신의 성전을 공경하라고 요구하십니다(<a href="https://bibleox.com/ko/ko-ctb/lev/19/#L30">레 19:30</a>; <a href="https://bibleox.com/ko/ko-ctb/lev/26/#L2">레 26:2</a>).</p><p>그리스도의 신약 교회는 예루살렘에서만, 사마리아의 산에서만, 또는 성당에서만 예배할 수 있다고 가르치지 않습니다. 하느님께는 어디서나 예배하고 기도할 수 있습니다.</p><p>정교인들은 옛 계약에 들어가거나 모세의 율법을 지키려고 성당을 짓는 것이 아닙니다. 옛 계약은 끝났고 모세의 율법은 폐지되었습니다.</p><p>우리는 함께 모여 기도하고 제사를 바칠 장소를 짓습니다. 이런 장소를 짓는 것을 금한 사람은 아무도 없습니다.</p><p>구약의 성전은 개념으로서 중요합니다. 하느님께서는 천상 실재에 빗대어 그것을 지으라고 명하셨습니다. 곧 성전은 본래 하늘의 이콘이어야 했습니다.</p><p>성경의 모든 근거를 들어 자세히 다룬 글: <a href="https://bibleox.com/ru/ru/w/храм-образ-небесной-реальности">성전 — 천상 실재의 형상</a>.</p><p>구약 시대에 하느님께서는 보이지 않으셨고 하늘에는 천사들만 있었습니다.</p><p>신약에서 하느님이신 그리스도께서는 눈에 보이게 하늘의 왕좌에 앉으시고, 천사들 외에 사람들도 그곳에 있게 됩니다. 그래서 그리스도인들에게 모임 장소가 생기자 그들은 이전과 같은 하느님의 뜻대로, 성전이 하늘을 나타내도록 꾸몄습니다.</p><p>하늘이 달라졌으므로 성전도 달라졌습니다. 이제 성전은 사람이 되신 하느님을 나타내고, 천사들 외에 하늘의 다른 주민들, 곧 의로운 사람들도 나타냅니다.</p><p>하느님께서는 개신교인들이 자주 요구하는 것처럼 비어 있고 뜻 없는 공간을 만드신 적이 없습니다. 그분은 세상 자체를 우리가 보고 창조주에 관해 무언가를 배우도록 지으셨습니다. 곧 세상이 우리에게 설교합니다. 성전도 빈 흰 벽이 아니라 그리스도와 그분의 하늘 나라를 전하도록 꾸며집니다.</p><h3>이콘을 기념하는 성당</h3><p>정교회 성당은 오직 하느님의 이름으로 지어집니다. 안에서 드리는 예배는 오직 하느님께 드립니다. 기도의 95%는 하느님께, 나머지는 그분의 성인들, 곧 천사들과 하늘의 의인들에게 드립니다.</p><p>모든 성당은 거룩한 기념과 연결되어 있습니다. 예를 들어 그리스도의 변모나 승천을 기념하는 성당이 있습니다. 이것은 거기서 승천이나 변모라는 사건에게 기도한다는 뜻이 아닙니다. 어떤 이콘이 (기적적으로) 주어진 일이나 이콘과 관련하여 도시가 적에게서 구원받은 일을 기념하는 성당도 있습니다. 이것은 거룩한 기념입니다. 성당이 거룩한 기념의 이름을 가졌다고 해서 거기서 그 기념에게 기도한다는 뜻이 아닙니다. 모든 성당의 예배는 같습니다.</p>'
