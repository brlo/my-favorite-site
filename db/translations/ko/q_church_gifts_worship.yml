  references: '<ol><li><p>함께 보기: <a href="https://bibleox.com/ru/ru/w/храм-образ-небесной-реальности">성전 — 천상 실재의 형상</a></p></li></ol><p>번역: 로디온 블라소프 (AI 도구 활용). 저본: 러시아어 원문. 참고: 영어·일본어 번역. 성경 인용과 링크는 개역개정에 따름.</p>'
- src: чин-порядок-обряд
  path: Or20d_질서_예식
  title: 질서, 예식, 의례
  copy_cover: true
  body: <h2>정의</h2><p><strong>예식(의식)</strong>은 어떤 반복되는 행위의 정해진 질서입니다. 질서가 있는 것은 무엇이든 예식이라고 부를 수 있습니다.</p><p><strong>예식서</strong>는 어떤 예배의 내용을 차례대로 자세히 서술한 것입니다.</p><p>성사도 정해진 질서, 곧 예식에 따라 거행됩니다.</p><h2>교회에서는 모든 일을 질서 있게 해야 합니다</h2><blockquote><p>“모든 것을 품위 있게 하고 <strong>질서있게</strong> 하라” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/14/#L40">고전 14:40</a>)</p></blockquote><blockquote><p>“형제들아 우리 주 예수 그리스도의 이름으로 너희를 명하노니 <strong>게으르게 행하고</strong> 우리에게서 받은 전통대로 행하지 아니하는 모든 형제에게서 떠나라” (<a href="https://bibleox.com/ko/ko-nkrv/2sol/3/#L6">살후 3:6</a>) <em>(그리스어 ἀτάκτως는 “무질서하게”라는 뜻입니다.)</em></p></blockquote><blockquote><p>“우리가 들은즉 너희 가운데 <strong>게으르게 행하여</strong> 도무지 일하지 아니하고 일을 만들기만 하는 자들이 있다 하니” (<a href="https://bibleox.com/ko/ko-nkrv/2sol/3/#L11">살후 3:11</a>) <em>(그리스어 ἀτάκτως는 “무질서하게”라는 뜻입니다.)</em></p></blockquote>
