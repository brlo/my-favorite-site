  title: 다른 언어의 은사
  copy_cover: true
  body: '<p>공동번역은 “다른 언어”(ἑτέραι γλῶσσαι, γλῶσσαι)를 사도행전에서는 “외국어”로, 고린토 1서에서는 “이상한 언어”로 옮겼습니다. 그리스어로는 같은 말입니다.</p><h2>하느님께서는 바벨에서 언어를 뒤섞으셨습니다</h2><p>바벨탑 건설은 상징적으로 하느님 없이 자기 힘으로 하늘에 닿으려는 시도입니다. 이 일로 언어가 뒤섞이고 서로의 말을 알아듣지 못하게 되었습니다:</p><blockquote><p>“또 사람들은 의논하였다. ‘어서 도시를 세우고 그 가운데 <strong><mark>꼭대기가 하늘에 닿게 탑을 쌓아</mark></strong> 우리 이름을 날려 사방으로 흩어지지 않도록 하자.’ 야훼께서 땅에 내려 오시어 사람들이 이렇게 세운 도시와 탑을 보시고 생각하셨다. ‘<strong>사람들이 한 종족이라 말이 같아서</strong> 안 되겠구나. 이것은 사람들이 하려는 일의 시작에 지나지 않겠지. 앞으로 하려고만 하면 못할 일이 없겠구나. 당장 땅에 내려 가서 <strong><mark>사람들이 쓰는 말을 뒤섞어 놓아 서로 듣지 못하게 해야겠다</mark></strong>.’ 야훼께서는 사람들을 거기에서 온 땅으로 흩으셨다. 그리하여 사람들은 도시를 세우던 일을 그만 두었다. <strong>야훼께서 온 세상의 말을 거기에서 뒤섞어 놓아</strong> 사람들은 온 땅을 흩으셨다고 해서 그 도시의 이름을 바벨이라고 불렀다.” (<a href="https://bibleox.com/ko/ko-ctb/gen/11/#L4-9">창 11:4-9</a>)</p></blockquote><h2>하느님께서는 교회 안에서 언어의 혼란을 극복하셨습니다</h2><p>교회가 이루어지고 성령께서 내려오신 날, 하느님께서는 사도들에게 외국어의 은사를 주십니다:</p><blockquote><p>“마침내 오순절이 되어 신도들이 모두 한 곳에 모여 있었는데 갑자기 하늘에서 세찬 바람이 부는 듯한 소리가 들려 오더니 그들이 앉아 있던 온 집안을 가득 채웠다. 그러자 혀 같은 것들이 나타나 불길처럼 갈라지며 각 사람 위에 내렸다. <strong><mark>그들의 마음은 성령으로 가득 차서 성령이 시키시는 대로 여러 가지 외국어로 말을 하기 시작하였다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/act/2/#L1-4">사도 2:1-4</a>)</p></blockquote><h2>다른 언어는 외국어입니다</h2><p>다른 나라에서 온 사람들은 갈릴래아 사람들(사도들)이 외국어로 말하는 것을 보고 놀랐습니다:</p><blockquote><p>“그 때 예루살렘에는 세계 각국에서 온 경건한 유다인들이 살고 있었다. 그 소리가 나자 많은 사람들이 몰려 들었다. 그리고 사도들이 말하는 것이 <strong><mark>사람들에게는 저마다 자기네 지방말로 들리므로</mark></strong> 모두 어리둥절해졌다. 그들은 놀라고 또 한편 신기하게 여기며 ‘<strong>지금 말하고 있는 저 사람들은 모두 갈릴래아 사람들이 아닌가</strong>! 그런데 우리는 저 사람들이 하는 말을 저마다 자기가 태어난 지방의 말로 듣고 있으니 어찌된 셈인가? 이 가운데는 <strong><mark>바르티아 사람, 메대 사람, 엘람 사람</mark></strong>이 있는가 하면 <strong><mark>메소포타미아, 유다, 갑바도기아, 본도, 아시아</mark></strong>에서 온 사람도 있고 <strong><mark>프리기아, 밤필리아, 에집트, 또 키레네에 가까운 리비야</mark></strong>의 여러 지방 사람들도 있다. 그리고 <strong><mark>로마</mark></strong>에서 나그네로 온 유다인들과 유다교에 개종한 이방인들이 있고 <strong><mark>그레데 사람들과 아라비아 사람들</mark></strong>도 있다. 그런데 저 사람들이 지금 하느님께서 하신 큰 일들을 전하고 있는데 그것을 <strong><mark>우리는 저마다 자기네 말로 듣고 있지 않은가</mark></strong>?’하고 말하였다. 이렇게 모두 놀라고 어안이 벙벙하여 ‘도대체 어찌 된 영문인가?’하며 웅성거렸는데” (<a href="https://bibleox.com/ko/ko-ctb/act/2/#L5-12">사도 2:5-12</a>)</p></blockquote><h2>모두에게 언어의 은사가 있는 것은 아닙니다</h2><ol><li><p><strong>모두가</strong> 다른 언어를 아는 은사를 받는 것은 <strong>아닙니다</strong>.</p></li><li><p>언어의 은사를 받은 이들은 <strong>서로 다른</strong> 언어를 압니다.</p></li><li><p>언어의 은사를 포함한 모든 은사는 일의 <strong>유익을 위해</strong> 주어집니다.</p></li></ol><blockquote><p>“<strong><mark>은총의 선물은 여러가지이지만</mark></strong> 그것을 주시는 분은 같은 성령이십니다. 주님을 섬기는 <strong>직책은 여러가지이지만</strong> 우리가 섬기는 분은 같은 주님이십니다. 일의 결과는 여러가지이지만 모든 사람 안에서 모든 일을 이루어 주시는 분은 같은 하느님이십니다. 성령께서는 <strong><mark>각 사람에게 각각 다른 은총의 선물을 주셨는데</mark></strong> 그것은 <strong><mark>공동이익을 위한 것입니다</mark></strong>. 어떤 사람은 성령에게서 <strong>지혜의 말씀</strong>을 받았고 어떤 사람은 같은 성령에게서 지식의 말씀을 받았으며 어떤 사람은 같은 성령에게서 믿음을 받았고 어떤 사람은 성령에게서 병 고치는 능력을 선물로 받았습니다. 어떤 사람은 기적을 행하는 능력을, 어떤 사람은 하느님의 말씀을 받아서 전하는 직책을, 어떤 사람은 어느 것이 성령의 활동인지를 가려 내는 힘을, 어떤 사람은 <strong><mark>이상한 언어를 말하는 능력을</mark></strong>, 어떤 사람은 그 이상한 언어를 해석하는 힘을 받았습니다.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/12/#L4-10">1고린 12:4-10</a>) <em>(그리스어: “<strong>여러 종류의</strong> 언어”)</em></p></blockquote><blockquote><p>“하느님께서는 교회 안에 다음과 같은 직책을 두셨습니다. 첫째는 사도요 둘째는 하느님의 말씀을 받아 전하는 사람이요 셋째는 가르치는 사람이요 다음은 기적을 행하는 사람이요 또 그 다음은 병 고치는 능력을 받은 사람, 남을 도와 주는 사람, 지도하는 사람, <strong><mark>이상한 언어를 말하는 사람</mark></strong> 등입니다. 모두가 다 사도일 수는 없지 않겠습니까? 모두가 다 하느님의 말씀을 받아 전하는 사람일 수는 없지 않겠습니까? 모두가 다 가르치는 사람일 수는 없지 않겠습니까? 모두가 다 기적을 행할 수는 없지 않겠습니까? 모두가 다 병 고치는 능력을 받을 수는 없지 않겠습니까? <strong><mark>모두가 다 이상한 언어를 말할 수는 없지 않겠습니까</mark></strong>? 모두가 다 해석하는 사람일 수는 없지 않겠습니까? 여러분은 더 큰 은총의 선물을 간절히 구하십시오. 내가 이제 가장 좋은 길을 여러분에게 보여 드리겠습니다.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/12/#L28-31">1고린 12:28-31</a>)</p></blockquote><h2>사도가 모든 사람에게 복음을 전하기에 그리스어 지식만으로는 충분하지 않았습니다</h2><p>로마 군대의 지휘관은 사도가 가장 널리 쓰이는 그리스어를 아는 것에 놀랍니다. 곧 그리스어가 널리 쓰였더라도(공통어) 모두가 알아들은 것은 아닙니다.</p><p>모든 백성이 알고 존경하던 율법교사 가믈리엘(<a href="https://bibleox.com/ko/ko-ctb/act/22/#L3">사도 22:3</a>)에게서 배운 사도 바울로는 학식이 높은 사람으로, 바리사이이자(<a href="https://bibleox.com/ko/ko-ctb/act/5/#L34">사도 5:34</a>) 그리스 철학자와 작가들을 인용하는 사람이었습니다(<a href="https://bibleox.com/ko/ko-ctb/act/17/#L28">사도 17:28</a> [1]; <a href="https://bibleox.com/ko/ko-ctb/tit/1/#L12">디도 1:12</a> [2]). 그가 로마 지휘관에게 그리스어로 말을 겁니다. 지휘관은 사도 바울로가 그리스어를 아는 것에 놀랍니다:</p><blockquote><p>“파견대장은 가까이 가서 바울로를 체포하고 부하들을 시켜 쇠사슬 둘로 그를 결박한 다음 그가 누구인지 또 무슨 짓을 했는지 물어 보았다. &lt;…&gt; 병영 문 앞까지 끌려 간 바울로는 파견대장을 보고 ‘한 말씀 드려도 좋겠습니까?’하고 물었다. 그러자 파견대장은 ‘<strong><mark>당신은 그리이스말을 할 줄 아오</mark></strong>?” (<a href="https://bibleox.com/ko/ko-ctb/act/21/#L33,37">사도 21:33,37</a>)</p></blockquote><p>로마 지휘관은 유다인이 로마 제국에서 가장 널리 쓰이는 언어를 아는 것에 놀랍니다. 이것은 그 일이 <strong>드물 때에만</strong> 놀라운 일입니다. 그렇게 학식 있는 사람이 그리스어를 아는 것도 놀라운 일이라면, 대부분 평범한 어부로서 배우지 못한 소박한 사람들이었던 다른 사도들(<a href="https://bibleox.com/ko/ko-ctb/act/4/#L13">사도 4:13</a>)이 그리스어를 자연스럽게 아는 일은 더 말할 것도 없습니다. 또 문제는 설교자(사도)가 언어를 알아야 한다는 것만이 아닙니다. 듣는 사람도 그리스어를 알아야 합니다.</p><p>그러므로 그리스어 지식만으로는 충분하지 않았고, 예수 그리스도의 생애와 부활과 가르침의 살아 있는 증인인 사도들에게는 그리스도에 대한 증언이 신앙과 함께 모든 민족에게 전해지도록 언어 지식을 비롯한 초자연적 은사가 필요했습니다.</p><h2>다른 언어로 말하는 사람을 아무도 알아듣지 못하면 유익이 없습니다</h2><blockquote><p>“형제 여러분, 내가 여러분에게 가서 <strong><mark>이상한 언어로 말한다고 하더라도</mark></strong> 만일 어떤 계시나 지식이나 하느님께로부터 받은 말씀이나 가르침을 전해 드리지 못한다면 <strong><mark>내가 무슨 도움이 되겠습니까</mark></strong>? &lt;…&gt; 이와 같이 여러분도 이상한 언어로 알아 들을 수 없는 말을 한다면 그것이 무슨 말인지를 누가 알겠습니까? 결국 여러분은 <strong>허공에다 대고 말하는</strong> 셈입니다. 세상에는 <strong>갖가지 말</strong>이 있지만 <strong>뜻없는 말은 하나도 없습니다</strong>. 그런데 내가 어떤 말의 뜻을 알아 듣지 못한다면 그런 말을 하는 사람과 나는 서로 외국인입니다. 성령의 선물은 여러분이 갈망하는 것이니 되도록 풍성하게 받으십시오. 그러나 <strong><mark>그것은 교회를 돕는 것이어야 합니다</mark></strong>. 그러므로 이상한 언어로 말하는 사람은 그것을 <strong>해석하는 능력</strong>까지 얻으려고 기도하십시오. &lt;…&gt; 만일 여러분이 심령으로만 감사의 기도를 드린다면 그 집회에 참석한 보통 교인들은 당신이 말하는 것을 알아 듣지 못할 터이니 어떻게 그 감사의 기도 끝에 ‘아멘’하고 응답할 수 있겠습니까? 여러분은 훌륭하게 감사의 기도를 드리지만 <strong><mark>남에게는 아무런 도움이 되지 못합니다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/14/#L6,9-13,16-17">1고린 14:6,9-13,16-17</a>)</p></blockquote><h2>교회에서는 통역 없이 다른 언어로 말하지 마십시오</h2><blockquote><p>“이상한 언어를 말할 때에는 둘이나 많아야 셋이 차례로 말해야 하고 한 사람은 그것을 해석해 주어야 합니다. <strong><mark>해석할 사람이 없을 때에는 교회 안에는 그런 말을 쓰지 말고</mark></strong> 혼자서 말하거나 하느님하고만 말하십시오. &lt;…&gt; 하느님께서 바라시는 것은 무질서가 아니고 평화이기 때문입니다. 성도들의 모든 교회가 하고 있는 대로” (<a href="https://bibleox.com/ko/ko-ctb/1kor/14/#L27-28,33">1고린 14:27-28,33</a>)</p></blockquote><p>예언자들이 하던 일은 설교였습니다:</p><blockquote><p>“<strong>예언자인 유다와 실라도 교우들을 여러 말로 격려하며</strong> 힘을 북돋아 주었다.” (<a href="https://bibleox.com/ko/ko-ctb/act/15/#L32">사도 15:32</a>)</p></blockquote><h2>다른 언어보다 예언(설교와 해석)의 은사를 더 구하라는 권고</h2><blockquote><p>“힘써 남을 사랑하고 <strong><mark>성령의 선물을 간절히 구하십시오. 특히 하느님의 말씀을 받아 전하는 은혜를 간절히 구하십시오</mark></strong>. 이상한 언어를 말하는 사람은 성령의 힘으로 신비한 일을 말하는 것이므로 아무도 알아 들을 수가 없습니다. 그러므로 그것은 사람들에게 말하는 것이 아니라 하느님께 말씀드리는 것입니다. 그러나 말씀을 받아 전하는 사람은 사람들을 <strong>키워주고</strong> <strong>격려해 주고</strong> <strong>위로해 주려고</strong> 사람들에게 말하는 것입니다. 이상한 언어로 말하는 사람은 자기 자신을 도울 뿐이지만 <strong><mark>말씀을 받아서 전하는 사람은 교회에 도움을 줍니다</mark></strong>. 나는 여러분이 모두 이상한 언어로 말할 수 있었으면 합니다. 그러나 <strong><mark>그보다는 하느님의 말씀을 받아 전할 수 있으면 더 좋겠습니다</mark></strong>. 만일 이상한 언어를 해석해 주는 사람이 있어서 그것이 교회의 이익이 되다면 몰라도 그렇지 않다면 <strong><mark>이상한 언어로 말하는 사람보다는 하느님의 말씀을 받아 전하는 사람이 더 위대합니다</mark></strong>. &lt;…&gt; 그러므로 형제 여러분, <strong><mark>하느님의 말씀을 받아 전하는 은혜를 간절히 구하십시오</mark></strong>. 그리고 이상한 언어를 말하는 것도 굳이 막지는 마십시오.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/14/#L1-5,39">1고린 14:1-5,39</a>)</p></blockquote><h2>언어는 그칠 것입니다</h2><blockquote><p>“사랑은 가실 줄을 모릅니다. 말씀을 받아 전하는 특권도 사라지고 <strong>이상한 언어를 말하는 능력도 끊어지고</strong> 지식도 사라질 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/13/#L8">1고린 13:8</a>)</p></blockquote><h2>사랑은 우리가 추구해야 할 가장 큰 은사입니다</h2><blockquote><p>“<strong><mark>내가 인간의 여러 언어를 말하고</mark></strong> 천사의 말까지 한다 하더라도 <strong><mark>사랑이 없으면</mark></strong> 나는 울리는 징과 요란한 꽹과리와 다를 것이 없습니다. 내가 하느님의 말씀을 받아 전할 수 있다 하더라도 온갖 신비를 환히 꿰뚫어 보고 모든 지식을 가졌다 하더라도 산을 옮길만한 완전한 믿음을 가졌다 하더라도 <strong><mark>사랑이 없으면 나는 아무것도 아닙니다</mark></strong>. &lt;…&gt; 그러므로 믿음과 희망과 사랑, 이 세 가지는 언제까지나 남아 있을 것입니다. 이 중에서 <strong>가장 위대한 것은 사랑입니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/13/#L1-2,13">1고린 13:1-2,13</a>)</p></blockquote><h2>사도들이 주지 않은 다른 영</h2><blockquote><p>“사실 어떤 사람이 와서 우리가 전한 것과는 <strong>다른 예수</strong>를 전하고 <strong><mark>여러분이 받은 성령과는 다른 것을 주며</mark></strong> 또 전에 받아 들인 것과는 <strong>다른 복음</strong>을 전파하는데도 여러분은 아무렇지도 않게 여기니까 하는 말입니다.” (<a href="https://bibleox.com/ko/ko-ctb/2kor/11/#L4">2고린 11:4</a>)</p></blockquote><h2>오늘날 선교사들은 언어를 배웁니다</h2><p>옛날에 사도들과 첫 그리스도인들은 아직 아주 작은 교회가 널리 퍼져 모든 민족에게 복음을 전할 수 있도록, 비상한 필요 때문에 외국어의 은사를 받았습니다. 그러나 오늘날 선교사들은 언어를 배워야, 곧 수고해야 합니다. 이를 위한 수단은 이제 다 있고, 없는 것이 있다면 열의뿐입니다.</p><p>그리스도를 믿는 사람들의 단체 가운데(은사주의자와 오순절파) 다른 언어와 그 해석의 은사가 있다고 주장하는 이들이 있지만, 그들이 외국에 가면 외국인들은 그들의 말을 알아듣지 못합니다. 그래서 그런 선교사들은 모국어로 말하거나 교재와 교사의 도움으로 평범하게 언어를 배워야 합니다.</p><p>우리 시대에는 이 은사가 거의 없습니다. 정교회에는 20세기 성인 아토스의 성 파이시오스가 있습니다. 그는 모국어(그리스어) 외에 다른 언어를 배운 적이 없고 다른 언어의 은사가 있다고 주장하지도 않았지만, 외국인들이 찾아오면 통역 없이 프랑스어로, 또 다른 때에는 영어로 그와 이야기할 수 있었습니다.</p><h2>비판</h2><h3>고린토 1서 14장 본문에 관한 여러 질문</h3><p>고린토 1서 14장에 관해서는 질문이 많으므로 장 전체를 차례로 살펴보는 것이 좋습니다. 이 일은 <a href="https://bibleox.com/ru/ru/w/K5Ou_Иные_языки_древних_христиан_и_позднейшие_симуляции">별도의 글</a>에서 다룹니다.</p><h3>언어는 오는 세상에서야 그치는가?</h3><p>정교인들은 오순절파와 은사주의자들에게 언어가 그칠 것이라는 사도 바울로의 말씀(<a href="https://bibleox.com/ko/ko-ctb/1kor/13/#L8">1고린 13:8</a>)을 가리켜 보입니다. 곧 이 은사는 멈출 것입니다. 물론 완전히 사라지지는 않습니다. 정교회의 매우 드문 현대 성인들에게 외국어를 말하는 은사가 있었음이 알려져 있습니다. 그러나 대체로 첫 그리스도인들에게서 보는 것과 같은 대규모 현상은 더 이상 없을 것입니다.</p><p>이에 대해 신개신교 오순절파는 언어가 그리스도의 재림 뒤 오는 세상에서야 그친다고 대답합니다. 그들 가운데 일부는 이 의견의 근거를 “완전한 것이 오면”이라는 이어지는 말씀(<a href="https://bibleox.com/ko/ko-ctb/1kor/13/#L10">1고린 13:10</a>)에서 찾습니다.</p><p>이 본문을 더 넓은 문맥에서 살펴봅시다:</p><blockquote><p>“<strong>사랑은 가실 줄을 모릅니다</strong>. <strong><mark>말씀을 받아 전하는 특권도 사라지고 이상한 언어를 말하는 능력도 끊어지고</mark></strong> <strong><mark>지식도 사라질 것입니다. 우리가 아는 것도 불완전하고 말씀을 받아 전하는 것도 불완전하지만</mark></strong> <strong><mark>완전한 것이 오면 불완전한 것은 사라집니다</mark></strong>. 내가 어렸을 때에는 어린이의 말을 하고 어린이의 생각을 하고 어린이의 판단을 했습니다. 그러나 어른이 되어서는 어렸을 때의 것들을 버렸습니다. 우리가 지금은 <strong>거울에 비추어 보듯이 희미하게</strong> 보지만 그 때에 가서는 얼굴을 맞대고 볼 것입니다. <strong><mark>지금은 불완전하게 알 뿐이지만</mark></strong> 그 때에 가서는 하느님께서 나를 아시듯이 나도 완전하게 알게 될 것입니다. 그러므로 믿음과 희망과 사랑, 이 세 가지는 언제까지나 남아 있을 것입니다. 이 중에서 가장 위대한 것은 사랑입니다.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/13/#L8-13">1고린 13:8-13</a>)</p></blockquote><p>사도는 “완전한 것이 오면” “불완전한” 것이 사라진다고 말했습니다. 불완전한 것은 무엇입니까? <strong>지식</strong>입니다. 이 문장에서 사도는 “<strong>지식</strong>도 사라질 것”이라는 어려운 표현을 풀어 설명하기 시작합니다. 사라지는 것이 지식 자체(아무것도 모르게 된다는 뜻)가 아니라, 지금 가진 부분적인 지식이 사라지고 온전한 지식이 오리라는 생각을 전해야 합니다. 그는 바로 이 생각을 이어 갑니다.</p><ol><li><p>지금 지식은 이미 <strong>부분적으로</strong> 있고, 다른 지식은 예언을 통해 <strong>부분적으로</strong> 드러납니다.</p></li><li><p>“부분적”이 아닌 완전한 지식이 주어질 때가 올 것입니다.</p></li><li><p>지금 지식은 흐린 거울을 들여다보듯 희미하게 얻어집니다.</p></li></ol><p>여기서 사도는 언어의 은사가 아니라 지식을 말하고 있습니다. 그리스도인들은 외국어를 부분적으로 알지 않았습니다. 그랬다면 복음을 다른 종족과 민족들에게 온전히 전하지 못했을 것입니다. 그들은 언어의 은사를 완전히 지니고 있었습니다. 오순절에 예루살렘에 온 사람들이 사도들이 자기네 말로 말하는 것을 듣고 놀란 까닭이 바로 이것입니다(<a href="https://bibleox.com/ko/ko-ctb/act/2/#L5-12">사도 2:5-12</a>). 이것은 부분적인 것이 아니었습니다. 부분적인 것은 지식이었고, 지식뿐이었습니다. 사도가 이어서 논하는 것도 바로 지식입니다.</p><p>그러면 언어의 은사는 언제 그칩니까? 엄밀히 말해 여기에는 나오지 않습니다. 그칠 것이라고만 합니다. 20세기가 지난 지금 돌아보면 이 말씀은 꽤 일찍 이루어졌습니다. 복음이 널리 퍼지고 그리스도인이 아주 많아져 언어의 은사가 그토록 절실히 필요하지 않게 되었습니다. 절실히 필요한 것은 사랑이지 언어의 은사가 아닙니다. 그래서 그때부터 언어를 배우게 되었습니다.</p><p>사랑만이 영원 속에서 그치지 않는다는 말씀은 끝나는 것들이 영원 속에서 끝난다는 뜻이 아닙니다. 다른 모든 것은 언제든 끝날 수 있지만, 영원에 관해서는 사랑이 거기서 끝나지 않는다는 것만 말합니다. 사랑이 영원하며 오는 세상에서도 그치지 않는다는 데에는 논란의 여지가 없습니다.</p><p>사람들은 성경의 이 구절을 오순절파처럼 이해했습니까?</p><p>예를 들어 4세기에 요한 크리소스토모스는 언어의 은사가 그치는 일이 오는 세상이 아니라 지금 세상의 일이라고 보았습니다.</p><p><strong>성 요한 크리소스토모스(347년경~407년)</strong></p><blockquote><p>“‘예언도 사라지고 언어도 그칠 것입니다.’ <strong><mark>이 둘은 믿음을 위해 주어진 것이므로, 믿음이 어디에나 뿌려지면 이것들의 쓰임은 이제 불필요해집니다. 그러나 서로 사랑하는 일은 그치지 않고, 이 세상에서도 저세상에서도 오히려 더 나아갈 것입니다</mark></strong>. … 그러나 예언과 언어가 사라지는 것은 놀랍지 않더라도 지식이 사라진다는 말은 당혹스러울 수 있습니다. 그러면 무엇입니까? 우리가 무지 속에 살게 된다는 말입니까? 결코 아닙니다. 오히려 그때 우리의 지식은 더욱 깊어질 것입니다. … 그러므로 사라지는 것은 지식이 아니라 우리의 지식이 부분적이라는 사정입니다. 우리는 그만큼 아는 데 그치지 않고 훨씬 더 많이 알게 될 것입니다.”</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/chrysostom-homilies-on-first-corinthians-4/#HH-Homily-XXXIV">고린토 1서 강해 34</a>, 영어)</p><p>더 많은 인용: <a href="https://bibleox.com/ru/ru/w/ew9Dk6So_Говорение_на_языках">다른 언어에 관한 교부들의 글</a>.</p><h3>사람의 언어와 천사의 언어</h3><p>신개신교인들은 다른 언어가 다른 민족의 외국어라는 구절을 보면 이에 동의하면서도, 천사의 언어라는 은사도 있다며 다른 구절을 내놓습니다:</p><blockquote><p>“내가 <strong><mark>인간의 여러 언어를 말하고 천사의 말까지 한다 하더라도</mark></strong> 사랑이 없으면 나는 울리는 징과 요란한 꽹과리와 다를 것이 없습니다.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/13/#L1">1고린 13:1</a>)</p></blockquote><p>그러나 이 의견은 잘못입니다. 천사는 몸이 없는 영입니다. 그들에게는 발성 기관도, 혀도, 폐도, 성대도 없으며, 공기의 진동을 만들어 소통하기 위한 대기도 필요하지 않습니다. 그러므로 성대로 내는 어떤 사람의 소리도 천사의 언어일 수 없습니다. 천사에게는 살과 뼈로 된 몸이 없듯이 성대도 없습니다(<a href="https://bibleox.com/ko/ko-ctb/lk/24/#L39">루가 24:39</a>).</p><p>그러면 사도는 천사의 언어를 말하면서 무엇을 뜻합니까? 이것은 수사적 표현일 뿐입니다. 한쪽을 극도로 높인 다음 다른 쪽으로 낮추는 것입니다. 사도는 사랑 없는 은사가 빈 소리임을 보여 줄 뿐입니다. 고린토 사람들은 다른 민족의 언어를 말하는 것을 이미 대단하게 여겼기에, 사도는 더 높여서 천사의 언어로 말할 수 있다 해도 사랑이 없으면 아무 유익이 없다고 합니다.</p><p>이것은 사도의 수사적 표현일 뿐입니다. 성 요한 크리소스토모스의 글에서도 이를 읽을 수 있습니다.</p><p><strong>성 요한 크리소스토모스(347년경~407년)</strong></p><blockquote><p>“여기서 그는 <strong>“천사의 언어”를 말하지만 천사에게 몸을 입히는 것이 아닙니다</strong>. 그의 뜻은 이렇습니다. ‘내가 천사들이 서로 말하듯이 말한다 해도, 이것이 없으면 나는 아무것도 아니고 오히려 짐이 될 뿐입니다.’ 다른 예를 하나 들면, 그가 “하늘과 땅과 땅 아래 있는 모든 것이 그분께 무릎을 꿇고”(필립 2:10)라고 말할 때 <strong>천사들에게 무릎과 뼈가 있다고 말하는 것이 아니라</strong>, 그들의 깊은 경배를 우리의 관습에 빗대어 나타내려는 것입니다. 여기서도 살로 된 기관을 뜻하여 “언어”라고 하는 것이 아니라, 우리에게 알려진 방식으로 천사들의 서로 간의 소통을 나타내려는 것입니다.”</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/chrysostom-homilies-on-first-corinthians-4/#HH-Homily-XXXII">고린토 1서 강해 32</a>, 영어)</p><p><strong>키로스의 복자 테오도레토스(386년경~457년)</strong></p><blockquote><p>“<strong>천사의 언어란 감각되는 언어가 아니라 어떤 영적인 언어를 말합니다</strong>. 천사들은 그 언어로 만물의 하느님을 찬양하고 서로 이야기합니다. 이사야는 그들이 노래하는 것을 들었고, 에제키엘과 다니엘, 즈가리야와 미가는 그들이 이야기하는 것을 들었습니다. 거룩한 사도는 <strong>사랑의 탁월함을 보여 주려고 이를 과장하여 표현했습니다</strong>.”</p></blockquote><p>(<a href="https://azbyka.ru/otechnik/Feodorit_Kirskij/tolkovanie_na_pervoe_poslanie_k_korinfinam/13#sel=9:83,9:128">고린토 1서 주해 13장</a>, 러시아어에서 번역)</p><p>그리스도께서도 비슷한 수사적 표현, 곧 한쪽을 극도로 높여 다른 쪽으로 낮추는 표현을 쓰셨습니다:</p><blockquote><p>“<strong>사람이 온 세상을 얻는다 해도 제 목숨을 잃으면</strong> 무슨 소용이 있겠느냐? 사람의 목숨과 무엇과 바꾸겠느냐?” (<a href="https://bibleox.com/ko/ko-ctb/mf/16/#L26">마태 16:26</a>; <a href="https://bibleox.com/ko/ko-ctb/mk/8/#L36">마르 8:36</a>)</p></blockquote><p>그러므로 사람에게 천사의 언어를 말하는 은사가 있다는 말은 성립하지 않습니다. 사람은 몸을 통해 소통하는데 천사에게는 몸이 없기 때문입니다. 천사의 언어에 대한 언급은 수사적 표현일 뿐입니다.</p><h3>전직 오순절파 목사의 증언</h3><p>오순절파 공동체의 목사였다가 정교회로 온 파벨은 11분짜리 짧은 음성 메시지에서 오순절파의 “다른 언어”에 대한 자기 느낌과 경험을 들려주며, 이전의 경험을 정교회에서 얻은 경험과 비교합니다.</p><p>음성 파일(러시아어): <a href="https://disk.yandex.ru/d/hHzrMNPi_lVy2w">https://disk.yandex.ru/d/hHzrMNPi_lVy2w</a></p>'
