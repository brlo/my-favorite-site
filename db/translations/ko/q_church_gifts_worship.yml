  path: Tg25s_다른_언어의_은사
  title: 다른 언어의 은사
  copy_cover: true
  body: '<p>개역개정은 “다른 언어”(ἑτέραι γλῶσσαι, γλῶσσαι)를 사도행전 2:4에서는 “다른 언어들”로, 고린도전서에서는 “방언”으로 옮겼습니다. 그리스어로는 같은 말입니다. 사도행전 2:6, 8의 “방언”은 또 다른 낱말 διάλεκτος, 곧 지방의 말입니다.</p><h2>하느님께서는 바벨에서 언어를 뒤섞으셨습니다</h2><p>바벨탑 건설은 상징적으로 하느님 없이 자기 힘으로 하늘에 닿으려는 시도입니다. 이 일로 언어가 뒤섞이고 서로의 말을 알아듣지 못하게 되었습니다:</p><blockquote><p>“또 말하되 자, 성읍과 탑을 건설하여 그 <strong><mark>탑 꼭대기를 하늘에 닿게 하여</mark></strong> 우리 이름을 내고 온 지면에 흩어짐을 면하자 하였더니 여호와께서 사람들이 건설하는 그 성읍과 탑을 보려고 내려오셨더라 여호와께서 이르시되 <strong>이 무리가 한 족속이요 언어도 하나이므로</strong> 이같이 시작하였으니 이후로는 그 하고자 하는 일을 막을 수 없으리로다 자, 우리가 내려가서 거기서 <strong><mark>그들의 언어를 혼잡하게 하여 그들이 서로 알아듣지 못하게 하자</mark></strong> 하시고 여호와께서 거기서 그들을 온 지면에 흩으셨으므로 그들이 그 도시를 건설하기를 그쳤더라 그러므로 그 이름을 바벨이라 하니 이는 <strong>여호와께서 거기서 온 땅의 언어를 혼잡하게 하셨음이니라</strong> 여호와께서 거기서 그들을 온 지면에 흩으셨더라” (<a href="https://bibleox.com/ko/ko-nkrv/gen/11/#L4-9">창 11:4-9</a>)</p></blockquote><h2>하느님께서는 교회 안에서 언어의 혼란을 극복하셨습니다</h2><p>교회가 이루어지고 성령께서 내려오신 날, 하느님께서는 사도들에게 외국어의 은사를 주십니다:</p><blockquote><p>“오순절 날이 이미 이르매 그들이 다같이 한 곳에 모였더니 홀연히 하늘로부터 급하고 강한 바람 같은 소리가 있어 그들이 앉은 온 집에 가득하며 마치 불의 혀처럼 갈라지는 것들이 그들에게 보여 각 사람 위에 하나씩 임하여 있더니 <strong><mark>그들이 다 성령의 충만함을 받고 성령이 말하게 하심을 따라 다른 언어들로 말하기를 시작하니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/act/2/#L1-4">행 2:1-4</a>)</p></blockquote><h2>다른 언어는 외국어입니다</h2><p>다른 나라에서 온 사람들은 갈릴리 사람들(사도들)이 외국어로 말하는 것을 보고 놀랐습니다:</p><blockquote><p>“그 때에 경건한 유대인들이 천하 각국으로부터 와서 예루살렘에 머물러 있더니 이 소리가 나매 큰 무리가 모여 <strong><mark>각각 자기의 방언으로 제자들이 말하는 것을 듣고</mark></strong> 소동하여 다 놀라 신기하게 여겨 이르되 보라 <strong>이 말하는 사람들이 다 갈릴리 사람이 아니냐</strong> 우리가 우리 각 사람이 난 곳 방언으로 듣게 되는 것이 어찌 됨이냐 우리는 <strong><mark>바대인과 메대인과 엘람인과</mark></strong> 또 <strong><mark>메소보다미아, 유대와 갑바도기아, 본도와 아시아</mark></strong>, <strong><mark>브루기아와 밤빌리아, 애굽과 및 구레네에 가까운 리비야</mark></strong> 여러 지방에 사는 사람들과 로마로부터 온 나그네 곧 유대인과 유대교에 들어온 사람들과 <strong><mark>그레데인과 아라비아인들이라</mark></strong> <strong><mark>우리가 다 우리의 각 언어로 하나님의 큰 일을 말함을 듣는도다</mark></strong> 하고 다 놀라며 당황하여 서로 이르되 이 어찌 된 일이냐 하며” (<a href="https://bibleox.com/ko/ko-nkrv/act/2/#L5-12">행 2:5-12</a>)</p></blockquote><h2>모두에게 언어의 은사가 있는 것은 아닙니다</h2><ol><li><p><strong>모두가</strong> 다른 언어를 아는 은사를 받는 것은 <strong>아닙니다</strong>.</p></li><li><p>언어의 은사를 받은 이들은 <strong>서로 다른</strong> 언어를 압니다.</p></li><li><p>언어의 은사를 포함한 모든 은사는 일의 <strong>유익을 위해</strong> 주어집니다.</p></li></ol><blockquote><p>“<strong><mark>은사는 여러 가지나</mark></strong> 성령은 같고 <strong>직분은 여러 가지나</strong> 주는 같으며 또 사역은 여러 가지나 모든 것을 모든 사람 가운데서 이루시는 하나님은 같으니 <strong><mark>각 사람에게 성령을 나타내심은</mark></strong> <strong><mark>유익하게 하려 하심이라</mark></strong> 어떤 사람에게는 성령으로 말미암아 <strong>지혜의 말씀</strong>을, 어떤 사람에게는 같은 성령을 따라 지식의 말씀을, 다른 사람에게는 같은 성령으로 믿음을, 어떤 사람에게는 한 성령으로 병 고치는 은사를, 어떤 사람에게는 능력 행함을, 어떤 사람에게는 예언함을, 어떤 사람에게는 영들 분별함을, 다른 사람에게는 <strong><mark>각종 방언 말함을</mark></strong>, 어떤 사람에게는 방언들 통역함을 주시나니” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/12/#L4-10">고전 12:4-10</a>) <em>(“방언”은 그리스어로 γλῶσσαι, 곧 “언어들”입니다.)</em></p></blockquote><blockquote><p>“하나님이 교회 중에 몇을 세우셨으니 첫째는 사도요 둘째는 선지자요 셋째는 교사요 그 다음은 능력을 행하는 자요 그 다음은 병 고치는 은사와 서로 돕는 것과 다스리는 것과 <strong><mark>각종 방언을 말하는 것</mark></strong>이라 다 사도이겠느냐 다 선지자이겠느냐 다 교사이겠느냐 다 능력을 행하는 자이겠느냐 다 병 고치는 은사를 가진 자이겠느냐 <strong><mark>다 방언을 말하는 자이겠느냐</mark></strong> 다 통역하는 자이겠느냐 너희는 더욱 큰 은사를 사모하라 내가 또한 가장 좋은 길을 너희에게 보이리라” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/12/#L28-31">고전 12:28-31</a>)</p></blockquote><h2>사도가 모든 사람에게 복음을 전하기에 그리스어 지식만으로는 충분하지 않았습니다</h2><p>로마 군대의 지휘관은 사도가 가장 널리 쓰이는 그리스어를 아는 것에 놀랍니다. 곧 그리스어가 널리 쓰였더라도(공통어) 모두가 알아들은 것은 아닙니다.</p><p>모든 백성이 알고 존경하던 율법교사 가믈리엘(<a href="https://bibleox.com/ko/ko-nkrv/act/22/#L3">행 22:3</a>)에게서 배운 사도 바울은 학식이 높은 사람으로, 바리새인이자(<a href="https://bibleox.com/ko/ko-nkrv/act/5/#L34">행 5:34</a>) 그리스 철학자와 작가들을 인용하는 사람이었습니다(<a href="https://bibleox.com/ko/ko-nkrv/act/17/#L28">행 17:28</a> [1]; <a href="https://bibleox.com/ko/ko-nkrv/tit/1/#L12">딛 1:12</a> [2]). 그가 로마 지휘관에게 그리스어로 말을 겁니다. 지휘관은 사도 바울이 그리스어를 아는 것에 놀랍니다:</p><blockquote><p>“이에 천부장이 가까이 가서 바울을 잡아 두 쇠사슬로 결박하라 명하고 그가 누구이며 그가 무슨 일을 하였느냐 물으니 &lt;…&gt; 바울을 데리고 영내로 들어가려 할 그 때에 바울이 천부장에게 이르되 내가 당신에게 말할 수 있느냐 이르되 <strong><mark>네가 헬라 말을 아느냐</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/act/21/#L33,37">행 21:33,37</a>)</p></blockquote><p>로마 지휘관은 유대인이 로마 제국에서 가장 널리 쓰이는 언어를 아는 것에 놀랍니다. 이것은 그 일이 <strong>드물 때에만</strong> 놀라운 일입니다. 그렇게 학식 있는 사람이 그리스어를 아는 것도 놀라운 일이라면, 대부분 평범한 어부로서 배우지 못한 소박한 사람들이었던 다른 사도들(<a href="https://bibleox.com/ko/ko-nkrv/act/4/#L13">행 4:13</a>)이 그리스어를 자연스럽게 아는 일은 더 말할 것도 없습니다. 또 문제는 설교자(사도)가 언어를 알아야 한다는 것만이 아닙니다. 듣는 사람도 그리스어를 알아야 합니다.</p><p>그러므로 그리스어 지식만으로는 충분하지 않았고, 예수 그리스도의 생애와 부활과 가르침의 살아 있는 증인인 사도들에게는 그리스도에 대한 증언이 신앙과 함께 모든 민족에게 전해지도록 언어 지식을 비롯한 초자연적 은사가 필요했습니다.</p><h2>다른 언어로 말하는 사람을 아무도 알아듣지 못하면 유익이 없습니다</h2><blockquote><p>“그런즉 형제들아 내가 너희에게 나아가서 <strong><mark>방언으로 말하고</mark></strong> 계시나 지식이나 예언이나 가르치는 것으로 말하지 아니하면 <strong><mark>너희에게 무엇이 유익하리요</mark></strong> &lt;…&gt; 이와 같이 너희도 혀로써 알아 듣기 쉬운 말을 하지 아니하면 그 말하는 것을 어찌 알리요 이는 <strong>허공에다 말하는 것</strong>이라 이같이 세상에 <strong>소리의 종류</strong>가 많으나 <strong>뜻 없는 소리는 없나니</strong> 그러므로 내가 그 소리의 뜻을 알지 못하면 내가 말하는 자에게 외국인이 되고 말하는 자도 내게 외국인이 되리니 그러므로 너희도 영적인 것을 사모하는 자인즉 <strong><mark>교회의 덕을 세우기 위하여</mark></strong> 그것이 풍성하기를 구하라 그러므로 방언을 말하는 자는 <strong>통역하기를</strong> 기도할지니 &lt;…&gt; 그렇지 아니하면 네가 영으로 축복할 때에 알지 못하는 처지에 있는 자가 네가 무슨 말을 하는지 알지 못하고 네 감사에 어찌 아멘 하리요 너는 감사를 잘하였으나 그러나 <strong><mark>다른 사람은 덕 세움을 받지 못하리라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/14/#L6,9-13,16-17">고전 14:6,9-13,16-17</a>)</p></blockquote><h2>교회에서는 통역 없이 다른 언어로 말하지 마십시오</h2><blockquote><p>“만일 누가 방언으로 말하거든 두 사람이나 많아야 세 사람이 차례를 따라 하고 한 사람이 통역할 것이요 <strong><mark>만일 통역하는 자가 없으면 교회에서는 잠잠하고</mark></strong> 자기와 하나님께 말할 것이요 &lt;…&gt; 하나님은 무질서의 하나님이 아니시요 오직 화평의 하나님이시니라” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/14/#L27-28,33">고전 14:27-28,33</a>)</p></blockquote><p>예언자들이 하던 일은 설교였습니다:</p><blockquote><p>“<strong>유다와 실라도 선지자라 여러 말로 형제를 권면하여</strong> 굳게 하고” (<a href="https://bibleox.com/ko/ko-nkrv/act/15/#L32">행 15:32</a>)</p></blockquote><h2>다른 언어보다 예언(설교와 해석)의 은사를 더 구하라는 권고</h2><blockquote><p>“사랑을 추구하며 <strong><mark>신령한 것들을 사모하되 특별히 예언을 하려고 하라</mark></strong> 방언을 말하는 자는 사람에게 하지 아니하고 하나님께 하나니 이는 알아 듣는 자가 없고 영으로 비밀을 말함이라 그러나 예언하는 자는 사람에게 말하여 <strong>덕을 세우며</strong> <strong>권면하며</strong> <strong>위로하는 것이요</strong> 방언을 말하는 자는 자기의 덕을 세우고 <strong><mark>예언하는 자는 교회의 덕을 세우나니</mark></strong> 나는 너희가 다 방언 말하기를 원하나 <strong><mark>특별히 예언하기를 원하노라</mark></strong> 만일 <strong><mark>방언을 말하는 자가 통역하여 교회의 덕을 세우지 아니하면 예언하는 자만 못하니라</mark></strong> &lt;…&gt; 그런즉 내 형제들아 <strong><mark>예언하기를 사모하며</mark></strong> 방언 말하기를 금하지 말라” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/14/#L1-5,39">고전 14:1-5,39</a>)</p></blockquote><h2>언어는 그칠 것입니다</h2><blockquote><p>“사랑은 언제까지나 떨어지지 아니하되 예언도 폐하고 <strong>방언도 그치고</strong> 지식도 폐하리라” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/13/#L8">고전 13:8</a>)</p></blockquote><h2>사랑은 우리가 추구해야 할 가장 큰 은사입니다</h2><blockquote><p>“<strong><mark>내가 사람의 방언과</mark></strong> 천사의 말을 할지라도 사랑이 없으면 소리 나는 구리와 울리는 꽹과리가 되고 내가 예언하는 능력이 있어 모든 비밀과 모든 지식을 알고 또 산을 옮길 만한 모든 믿음이 있을지라도 <strong><mark>사랑이 없으면 내가 아무 것도 아니요</mark></strong> &lt;…&gt; 그런즉 믿음, 소망, 사랑, 이 세 가지는 항상 있을 것인데 <strong>그 중의 제일은 사랑이라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/13/#L1-2,13">고전 13:1-2,13</a>)</p></blockquote><h2>사도들이 주지 않은 다른 영</h2><blockquote><p>“만일 누가 가서 우리가 전파하지 아니한 다른 예수를 전파하거나 혹은 <strong><mark>너희가 받지 아니한 다른 영을 받게 하거나</mark></strong> 혹은 너희가 받지 아니한 다른 복음을 받게 할 때에는 너희가 잘 용납하는구나” (<a href="https://bibleox.com/ko/ko-nkrv/2kor/11/#L4">고후 11:4</a>)</p></blockquote><h2>오늘날 선교사들은 언어를 배웁니다</h2><p>옛날에 사도들과 첫 그리스도인들은 아직 아주 작은 교회가 널리 퍼져 모든 민족에게 복음을 전할 수 있도록, 비상한 필요 때문에 외국어의 은사를 받았습니다. 그러나 오늘날 선교사들은 언어를 배워야, 곧 수고해야 합니다. 이를 위한 수단은 이제 다 있고, 없는 것이 있다면 열의뿐입니다.</p><p>그리스도를 믿는 사람들의 단체 가운데(은사주의자와 오순절파) 다른 언어와 그 해석의 은사가 있다고 주장하는 이들이 있지만, 그들이 외국에 가면 외국인들은 그들의 말을 알아듣지 못합니다. 그래서 그런 선교사들은 모국어로 말하거나 교재와 교사의 도움으로 평범하게 언어를 배워야 합니다.</p><p>우리 시대에는 이 은사가 거의 없습니다. 정교회에는 20세기 성인 아토스의 성 파이시오스가 있습니다. 그는 모국어(그리스어) 외에 다른 언어를 배운 적이 없고 다른 언어의 은사가 있다고 주장하지도 않았지만, 외국인들이 찾아오면 통역 없이 프랑스어로, 또 다른 때에는 영어로 그와 이야기할 수 있었습니다.</p><h2>비판</h2><h3>고린도 1서 14장 본문에 관한 여러 질문</h3><p>고린도 1서 14장에 관해서는 질문이 많으므로 장 전체를 차례로 살펴보는 것이 좋습니다. 이 일은 <a href="https://bibleox.com/ru/ru/w/K5Ou_Иные_языки_древних_христиан_и_позднейшие_симуляции">별도의 글</a>에서 다룹니다.</p><h3>언어는 오는 세상에서야 그치는가?</h3><p>정교인들은 오순절파와 은사주의자들에게 언어가 그칠 것이라는 사도 바울의 말씀(<a href="https://bibleox.com/ko/ko-nkrv/1kor/13/#L8">고전 13:8</a>)을 가리켜 보입니다. 곧 이 은사는 멈출 것입니다. 물론 완전히 사라지지는 않습니다. 정교회의 매우 드문 현대 성인들에게 외국어를 말하는 은사가 있었음이 알려져 있습니다. 그러나 대체로 첫 그리스도인들에게서 보는 것과 같은 대규모 현상은 더 이상 없을 것입니다.</p><p>이에 대해 신개신교 오순절파는 언어가 그리스도의 재림 뒤 오는 세상에서야 그친다고 대답합니다. 그들 가운데 일부는 이 의견의 근거를 “완전한 것이 오면”이라는 이어지는 말씀(<a href="https://bibleox.com/ko/ko-nkrv/1kor/13/#L10">고전 13:10</a>)에서 찾습니다.</p><p>이 본문을 더 넓은 문맥에서 살펴봅시다:</p><blockquote><p>“<strong>사랑은 언제까지나 떨어지지 아니하되</strong> <strong><mark>예언도 폐하고 방언도 그치고</mark></strong> <strong><mark>지식도 폐하리라 우리는 부분적으로 알고 부분적으로 예언하니</mark></strong> <strong><mark>온전한 것이 올 때에는 부분적으로 하던 것이 폐하리라</mark></strong> 내가 어렸을 때에는 말하는 것이 어린 아이와 같고 깨닫는 것이 어린 아이와 같고 생각하는 것이 어린 아이와 같다가 장성한 사람이 되어서는 어린 아이의 일을 버렸노라 우리가 지금은 <strong>거울로 보는 것 같이 희미하나</strong> 그 때에는 얼굴과 얼굴을 대하여 볼 것이요 <strong><mark>지금은 내가 부분적으로 아나</mark></strong> 그 때에는 주께서 나를 아신 것 같이 내가 온전히 알리라 그런즉 믿음, 소망, 사랑, 이 세 가지는 항상 있을 것인데 그 중의 제일은 사랑이라” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/13/#L8-13">고전 13:8-13</a>)</p></blockquote><p>사도는 “완전한 것이 오면” “불완전한” 것이 사라진다고 말했습니다. 불완전한 것은 무엇입니까? <strong>지식</strong>입니다. 이 문장에서 사도는 “<strong>지식</strong>도 사라질 것”이라는 어려운 표현을 풀어 설명하기 시작합니다. 사라지는 것이 지식 자체(아무것도 모르게 된다는 뜻)가 아니라, 지금 가진 부분적인 지식이 사라지고 온전한 지식이 오리라는 생각을 전해야 합니다. 그는 바로 이 생각을 이어 갑니다.</p><ol><li><p>지금 지식은 이미 <strong>부분적으로</strong> 있고, 다른 지식은 예언을 통해 <strong>부분적으로</strong> 드러납니다.</p></li><li><p>“부분적”이 아닌 완전한 지식이 주어질 때가 올 것입니다.</p></li><li><p>지금 지식은 흐린 거울을 들여다보듯 희미하게 얻어집니다.</p></li></ol><p>여기서 사도는 언어의 은사가 아니라 지식을 말하고 있습니다. 그리스도인들은 외국어를 부분적으로 알지 않았습니다. 그랬다면 복음을 다른 종족과 민족들에게 온전히 전하지 못했을 것입니다. 그들은 언어의 은사를 완전히 지니고 있었습니다. 오순절에 예루살렘에 온 사람들이 사도들이 자기네 말로 말하는 것을 듣고 놀란 까닭이 바로 이것입니다(<a href="https://bibleox.com/ko/ko-nkrv/act/2/#L5-12">행 2:5-12</a>). 이것은 부분적인 것이 아니었습니다. 부분적인 것은 지식이었고, 지식뿐이었습니다. 사도가 이어서 논하는 것도 바로 지식입니다.</p><p>그러면 언어의 은사는 언제 그칩니까? 엄밀히 말해 여기에는 나오지 않습니다. 그칠 것이라고만 합니다. 20세기가 지난 지금 돌아보면 이 말씀은 꽤 일찍 이루어졌습니다. 복음이 널리 퍼지고 그리스도인이 아주 많아져 언어의 은사가 그토록 절실히 필요하지 않게 되었습니다. 절실히 필요한 것은 사랑이지 언어의 은사가 아닙니다. 그래서 그때부터 언어를 배우게 되었습니다.</p><p>사랑만이 영원 속에서 그치지 않는다는 말씀은 끝나는 것들이 영원 속에서 끝난다는 뜻이 아닙니다. 다른 모든 것은 언제든 끝날 수 있지만, 영원에 관해서는 사랑이 거기서 끝나지 않는다는 것만 말합니다. 사랑이 영원하며 오는 세상에서도 그치지 않는다는 데에는 논란의 여지가 없습니다.</p><p>사람들은 성경의 이 구절을 오순절파처럼 이해했습니까?</p><p>예를 들어 4세기에 요한 크리소스토모스는 언어의 은사가 그치는 일이 오는 세상이 아니라 지금 세상의 일이라고 보았습니다.</p><p><strong>성 요한 크리소스토모스(347년경~407년)</strong></p><blockquote><p>“‘예언도 사라지고 언어도 그칠 것입니다.’ <strong><mark>이 둘은 믿음을 위해 주어진 것이므로, 믿음이 어디에나 뿌려지면 이것들의 쓰임은 이제 불필요해집니다. 그러나 서로 사랑하는 일은 그치지 않고, 이 세상에서도 저세상에서도 오히려 더 나아갈 것입니다</mark></strong>. … 그러나 예언과 언어가 사라지는 것은 놀랍지 않더라도 지식이 사라진다는 말은 당혹스러울 수 있습니다. 그러면 무엇입니까? 우리가 무지 속에 살게 된다는 말입니까? 결코 아닙니다. 오히려 그때 우리의 지식은 더욱 깊어질 것입니다. … 그러므로 사라지는 것은 지식이 아니라 우리의 지식이 부분적이라는 사정입니다. 우리는 그만큼 아는 데 그치지 않고 훨씬 더 많이 알게 될 것입니다.”</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/chrysostom-homilies-on-first-corinthians-4/#HH-Homily-XXXIV">고린도 1서 강해 34</a>, 영어)</p><p>더 많은 인용: <a href="https://bibleox.com/ru/ru/w/ew9Dk6So_Говорение_на_языках">다른 언어에 관한 교부들의 글</a>.</p><h3>사람의 언어와 천사의 언어</h3><p>신개신교인들은 다른 언어가 다른 민족의 외국어라는 구절을 보면 이에 동의하면서도, 천사의 언어라는 은사도 있다며 다른 구절을 내놓습니다:</p><blockquote><p>“<strong><mark>내가 사람의 방언과 천사의 말을 할지라도</mark></strong> 사랑이 없으면 소리 나는 구리와 울리는 꽹과리가 되고” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/13/#L1">고전 13:1</a>)</p></blockquote><p>그러나 이 의견은 잘못입니다. 천사는 몸이 없는 영입니다. 그들에게는 발성 기관도, 혀도, 폐도, 성대도 없으며, 공기의 진동을 만들어 소통하기 위한 대기도 필요하지 않습니다. 그러므로 성대로 내는 어떤 사람의 소리도 천사의 언어일 수 없습니다. 천사에게는 살과 뼈로 된 몸이 없듯이 성대도 없습니다(<a href="https://bibleox.com/ko/ko-nkrv/lk/24/#L39">눅 24:39</a>).</p><p>그러면 사도는 천사의 언어를 말하면서 무엇을 뜻합니까? 이것은 수사적 표현일 뿐입니다. 한쪽을 극도로 높인 다음 다른 쪽으로 낮추는 것입니다. 사도는 사랑 없는 은사가 빈 소리임을 보여 줄 뿐입니다. 고린도 사람들은 다른 민족의 언어를 말하는 것을 이미 대단하게 여겼기에, 사도는 더 높여서 천사의 언어로 말할 수 있다 해도 사랑이 없으면 아무 유익이 없다고 합니다.</p><p>이것은 사도의 수사적 표현일 뿐입니다. 성 요한 크리소스토모스의 글에서도 이를 읽을 수 있습니다.</p><p><strong>성 요한 크리소스토모스(347년경~407년)</strong></p><blockquote><p>“여기서 그는 <strong>“천사의 언어”를 말하지만 천사에게 몸을 입히는 것이 아닙니다</strong>. 그의 뜻은 이렇습니다. ‘내가 천사들이 서로 말하듯이 말한다 해도, 이것이 없으면 나는 아무것도 아니고 오히려 짐이 될 뿐입니다.’ 다른 예를 하나 들면, 그가 “하늘과 땅과 땅 아래 있는 모든 것이 그분께 무릎을 꿇고”(필립 2:10)라고 말할 때 <strong>천사들에게 무릎과 뼈가 있다고 말하는 것이 아니라</strong>, 그들의 깊은 경배를 우리의 관습에 빗대어 나타내려는 것입니다. 여기서도 살로 된 기관을 뜻하여 “언어”라고 하는 것이 아니라, 우리에게 알려진 방식으로 천사들의 서로 간의 소통을 나타내려는 것입니다.”</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/chrysostom-homilies-on-first-corinthians-4/#HH-Homily-XXXII">고린도 1서 강해 32</a>, 영어)</p><p><strong>키로스의 복자 테오도레토스(386년경~457년)</strong></p><blockquote><p>“<strong>천사의 언어란 감각되는 언어가 아니라 어떤 영적인 언어를 말합니다</strong>. 천사들은 그 언어로 만물의 하느님을 찬양하고 서로 이야기합니다. 이사야는 그들이 노래하는 것을 들었고, 에스겔과 다니엘, 스가랴와 미가는 그들이 이야기하는 것을 들었습니다. 거룩한 사도는 <strong>사랑의 탁월함을 보여 주려고 이를 과장하여 표현했습니다</strong>.”</p></blockquote><p>(<a href="https://azbyka.ru/otechnik/Feodorit_Kirskij/tolkovanie_na_pervoe_poslanie_k_korinfinam/13#sel=9:83,9:128">고린도 1서 주해 13장</a>, 러시아어에서 번역)</p><p>그리스도께서도 비슷한 수사적 표현, 곧 한쪽을 극도로 높여 다른 쪽으로 낮추는 표현을 쓰셨습니다:</p><blockquote><p>“<strong>사람이 만일 온 천하를 얻고도 제 목숨을 잃으면</strong> 무엇이 유익하리요 사람이 무엇을 주고 제 목숨과 바꾸겠느냐” (<a href="https://bibleox.com/ko/ko-nkrv/mf/16/#L26">마 16:26</a>; <a href="https://bibleox.com/ko/ko-nkrv/mk/8/#L36">막 8:36</a>)</p></blockquote><p>그러므로 사람에게 천사의 언어를 말하는 은사가 있다는 말은 성립하지 않습니다. 사람은 몸을 통해 소통하는데 천사에게는 몸이 없기 때문입니다. 천사의 언어에 대한 언급은 수사적 표현일 뿐입니다.</p><h3>전직 오순절파 목사의 증언</h3><p>오순절파 공동체의 목사였다가 정교회로 온 파벨은 11분짜리 짧은 음성 메시지에서 오순절파의 “다른 언어”에 대한 자기 느낌과 경험을 들려주며, 이전의 경험을 정교회에서 얻은 경험과 비교합니다.</p><p>음성 파일(러시아어): <a href="https://disk.yandex.ru/d/hHzrMNPi_lVy2w">https://disk.yandex.ru/d/hHzrMNPi_lVy2w</a></p>'
