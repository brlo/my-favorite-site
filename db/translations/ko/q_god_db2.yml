- src: Христос-Бог
  path: 8HYB_예수그리스도는하느님이시다
  title: 예수 그리스도는 하느님이십니다
  copy_cover: true
  body: '<h2>머리말</h2><blockquote><p>“들어라, 내 백성아, 내가 말하리라. 이스라엘아, 내가 너의 죄상을 밝히리라. <strong>나 하느님, 너희의 하느님은</strong>” (<a href="https://bibleox.com/ko/ko-ctb/ps/50/#L7">시편 50:7</a>)</p></blockquote><h2>사도가 모두가 보는 앞에서 그리스도를 하느님이라 부르고, 그리스도께서 그의 믿음을 인정하십니다 (<a href="https://bibleox.com/ko/ko-ctb/in/20/#L28-29">요한 20:28-29</a>)</h2><p>이것은 가장 논란의 여지가 없는 구절입니다. 사도가 그리스도를 참 하느님으로 믿는다는 것을 확신하는 데 필요한 모든 것이 여기에 있습니다. 그 자리에 있던 어떤 사도도 그에게 반박하지 않았고, 그리스도께서 친히 이 믿음을 인정하십니다. 여기서는 θεὸς(하느님)라는 낱말에 정관사 ὁ까지 붙어 있어서, 그리스도를 하느님으로 믿는 믿음에 대한 반대자들의 이의가 모두 사라집니다. 이 구절을 보면 그리스도께서 바로 최고의 의미에서 하느님이라 불리신다는 것을 알 수 있습니다:</p><blockquote><p>“토마가 예수께 ‘<strong>나의 주님, 나의 하느님</strong>!’하고 대답하자 예수께서는 ‘너는 나를 보고야 <strong>믿느냐</strong>? 나를 보지 않고도 믿는 사람은 행복하다’하고 말씀하셨다.” (<a href="https://bibleox.com/ko/ko-ctb/in/20/#L28-29">요한 20:28-29</a>)</p></blockquote><blockquote><p>“ἀπεκρίθη Θωμᾶς καὶ εἶπεν αὐτῷ, Ὁ κύριός μου καὶ <strong><u>ὁ</u> θεός</strong> μου. λέγει αὐτῷ ὁ Ἰησοῦς, Ὅτι ἑώρακάς με πεπίστευκας; μακάριοι οἱ μὴ ἰδόντες καὶ πιστεύσαντες” (<a href="https://bibleox.com/ko/gr-lxx-byz/in/20/#L28-29">요한 20:28-29</a>)</p></blockquote><p>이에 맞서 그리스도의 신성에 관한 가르침의 반대자들은 “사도가 그저 감격하여 놀란 나머지 외쳤을 뿐”이라는 설득력 없는 말을 내놓을 뿐입니다. 그러나 이는 기록된 내용과 어긋납니다. 토마가 이 말을 그리스도께 직접 드렸다고 분명히 쓰여 있기 때문입니다. 그리스어 원문에는 “<strong>그분께 대답하여 말하였다</strong>”(ἀπεκρίθη … καὶ εἶπεν αὐτῷ)라고 되어 있어, “<strong>나의 주님, 나의 하느님</strong>”이라는 말은 본문에 따르면 그리스도께 직접 드린 말입니다.</p><p>이렇게 그리스도께 말씀드렸는데도 아무도 사도를 바로잡지 않았고, 그리스도께서는 “믿느냐”라고 하시며 그의 믿음을 인정하셨습니다. 그가 그리스도의 부활을 믿게 된 것은 분명하지만, 이 믿음을 얻자 그는 곧바로 자기가 얻은 믿음이 어떤 믿음인지, 곧 그리스도를 하느님으로 믿는 믿음임을 보여 줍니다. 비판자들의 문법적 요구도 여기서 모두 충족됩니다. 이 말은 사도가 그리스도와 사도들 앞에서 하였고, 아무도 반박하지 않았으며, 그리스도께서는 인정까지 하셨습니다. 이것으로도 믿지 않는 사람들을 설득하지 못한다면 무엇이 그들을 설득할 수 있겠습니까?</p><h2>그리스도는 만물 위에 계시는 하느님이십니다 (<a href="https://bibleox.com/ko/ko-ctb/rim/9/#L3-5">로마 9:3-5</a>)</h2><p>사도는 그리스도를 최고의 의미에서 하느님이라 부릅니다:</p><blockquote><p>“나는 혈육을 같이하는 내 동족을 위해서라면 나 자신이 저주를 받아 그리스도에게서 떨어져 나갈지라도 조금도 한이 없겠습니다. 나의 동족은 이스라엘 사람들입니다. 그들에게는 하느님의 자녀가 되는 특권이 있고 하느님을 모시는 영광이 있고 하느님과 맺은 계약이 있습니다. 그리고 그들에게는 율법이 있고 참된 예배가 있고 하느님의 약속이 있습니다. 그들은 저 훌륭한 선조들의 후손들이며 <strong>그리스도도 인성으로 말하면 그들에게서 나셨습니다</strong>. 만물을 다스리시는 하느님을 영원토록 찬양합시다. 아멘.” (<a href="https://bibleox.com/ko/ko-ctb/rim/9/#L3-5">로마 9:3-5</a>) <em>(공동번역은 끝부분을 “만물을 다스리시는 하느님을 영원토록 찬양합시다”라는 별도의 문장으로 옮겼습니다. 그리스어 원문은 ὁ ὢν ἐπὶ πάντων θεὸς εὐλογητὸς εἰς τοὺς αἰῶνας로, 관계대명사처럼 그리스도에게 이어집니다: “그리스도께서는 <strong>만물 위에 계시는 하느님</strong>으로서 영원히 찬미받으실 분이십니다”.)</em></p></blockquote><blockquote><p>“ὧν οἱ πατέρες, καὶ ἐξ ὧν ὁ <strong>Χριστὸς</strong> τὸ κατὰ σάρκα· <strong><u>ὁ</u></strong> ὢν ἐπὶ πάντων <strong>θεὸς</strong> εὐλογητὸς εἰς τοὺς αἰῶνας, ἀμήν” (<a href="https://bibleox.com/ko/gr-lxx-byz/rim/9/#L5">로마 9:5</a>)</p></blockquote><p>그리스도를 하느님으로 믿는 믿음의 반대자들은 θεὸς(하느님)라는 낱말에 정관사가 없으므로 여기서 그리스도는 최고의 의미에서 하느님이라 불리는 것이 아니라거나, “하느님”이라는 말이 아예 그리스도를 가리키지 않는다고 반론합니다.</p><p>이에 대해서는 여러 견해가 있습니다. 한 인격을 묘사하는 모든 속성 앞에 놓인 공통의 정관사로 충분하다고 볼 근거가 있습니다: «<strong>ὁ</strong> ὢν ἐπὶ πάντων θεὸς»(만물 위에 계시는 하느님). 어쨌든 우리는 처음에 이미, 정관사가 붙은 “하느님”이라는 말이 그리스도께 쓰인 분명한 예를 보았습니다(<a href="https://bibleox.com/ko/ko-ctb/in/20/#L28-29">요한 20:28-29</a>). 여기에 관사가 없다 해서 믿음에 무엇이 더 부족하겠습니까?</p><h2>그리스도는 참 하느님이십니다 (<a href="https://bibleox.com/ko/ko-ctb/1in/5/#L20">1요한 5:20</a>)</h2><blockquote><p>“그러나 하느님의 아들이 오셔서 참 하느님을 알 수 있는 힘을 우리에게 주셨습니다. 그리고 우리는 참되신 분 곧 <strong>그분의 아들 예수 그리스도</strong> 안에서 살고 있습니다. <strong>그분이야말로 참 하느님이시며</strong> 영원한 생명이십니다.” (<a href="https://bibleox.com/ko/ko-ctb/1in/5/#L20">1요한 5:20</a>)</p></blockquote><blockquote><p>“οἴδαμεν δὲ ὅτι ὁ υἱὸς τοῦ θεοῦ ἥκει, καὶ δέδωκεν ἡμῖν διάνοιαν ἵνα γινώσκομεν τὸν ἀληθινόν· καὶ ἐσμὲν ἐν τῷ ἀληθινῷ, ἐν τῷ υἱῷ αὐτοῦ <strong>Ἰησοῦ Χριστῷ. οὗτός ἐστιν <u>ὁ</u> ἀληθινὸς θεὸς</strong> καὶ ζωὴ αἰώνιος” (<a href="https://bibleox.com/ko/gr-lxx-byz/1in/5/#L20">1요한 5:20</a>)</p></blockquote><p>사도 요한이 “그분이야말로”(οὗτός ἐστιν)라고 쓸 때, 이 대명사가 가리키는 것은 바로 앞에 나오는 예수 그리스도(Ἰησοῦ Χριστῷ)라는 이름입니다. 이것이 가장 가까운 선행사입니다. θεὸς 앞의 정관사 ὁ는 이것이 방금 말한 인격, 곧 예수 그리스도의 분명한 속성임을 강조합니다. 문법적으로나 논리적으로나 여기서는 <strong>“그분[예수 그리스도]이야말로 참 하느님이시며 영원한 생명이십니다”</strong>라고 말하고 있습니다.</p><h2>하느님이신 그리스도께서 당신 피로 교회를 얻으셨습니다 (<a href="https://bibleox.com/ko/ko-ctb/act/20/#L28">사도 20:28</a>)</h2><p>이 구절은 그리스도의 신성을 가리킵니다. 자기 피로 교회를 얻으신 분이 여기서 하느님이라 불리기 때문입니다. 신성에는 피가 없습니다. 피는 강생하신 성자께만 있습니다. 당신의 피로 교회를 얻으시어 하느님이라 불리는 분은 바로 성자이십니다.</p><blockquote><p>“여러분은 늘 자신을 살피며 성령께서 맡겨 주신 양떼를 잘 돌보시오. 성령께서는 여러분을 감독으로 세우셔서 <strong>하느님께서</strong> 당신 <strong>아드님의 피로</strong> 값을 치르고 얻으신 <strong>당신의 교회</strong>를 보살피게 하셨습니다.” (<a href="https://bibleox.com/ko/ko-ctb/act/20/#L28">사도 20:28</a>) <em>(그리스어 원문에는 “아드님”이라는 말이 없고 διὰ τοῦ αἵματος τοῦ ἰδίου — “<strong>당신 자신의 피로</strong>”라고 되어 있습니다.)</em></p></blockquote><blockquote><p>“προσέχετε ἑαυτοῖς καὶ παντὶ τῷ ποιμνίῳ, ἐν ᾧ ὑμᾶς τὸ πνεῦμα τὸ ἅγιον ἔθετο ἐπισκόπους, ποιμαίνειν <strong>τὴν ἐκκλησίαν τοῦ θεοῦ</strong>, ἣν περιεποιήσατο διὰ <strong>τοῦ αἵματος τοῦ <u>ἰδίου</u></strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/act/20/#L28">사도 20:28</a>)</p></blockquote><h2>전에는 아무도 보지 못하던 하느님께서 육신으로 나타나 당신을 보이셨습니다 (<a href="https://bibleox.com/ko/ko-ctb/1tim/3/#L15-16">1디모 3:15-16</a>)</h2><p>“그분은 사람으로 이 세상에 오셨고”에서 “그분”은 하느님을 가리킵니다. 바로 앞에서 “<strong>하느님의 집</strong>은 <strong>살아 계신 하느님의 교회</strong>”라고 하느님에 관해 말하고 있기 때문입니다. 그리고 여기서 하느님이라 불리는 분이 바로 예수 그리스도이심은 뒤따르는 말에서 분명해집니다. 사람의 몸으로 나타나 천사들에게 보이신 분은 성부가 아니라 성자, 곧 예수 그리스도이시고(성부 하느님께서는 보이지 않으십니다), 영광 가운데 승천하신 분도 성자이시기 때문입니다:</p><blockquote><p>“만일 내가 늦어지더라도 그대가 <strong>하느님의 집</strong>에서 어떻게 행동해야 할 것인가를 가르쳐 주기 위해서 이 편지를 쓰고 있습니다. 하느님의 집은 <strong>살아 계신 하느님의 교회</strong>이고 진리의 기둥이며 터전입니다. 우리가 믿는 종교의 진리는 참으로 심오합니다. <strong>그분은 사람으로 이 세상에 오셨고</strong> 성령이 그분의 본성을 입증하셨으며 <strong>천사들이 그분을 보았습니다</strong>. 그분은 만방에 전해져서 온 세상이 그분을 믿게 되었으며 <strong>영광 가운데 승천하셨습니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/1tim/3/#L15-16">1디모 3:15-16</a>) <em>(비잔틴 본문(다수 사본)에는 θεὸς ἐφανερώθη ἐν σαρκί — “<strong>하느님께서</strong> 육신으로 나타나셨고”라고 되어 있습니다.)</em></p></blockquote><blockquote><p>“ἐὰν δὲ βραδύνω, ἵνα εἰδῇς πῶς δεῖ ἐν οἴκῳ θεοῦ ἀναστρέφεσθαι, ἥτις ἐστὶν ἐκκλησία θεοῦ ζῶντος, στῦλος καὶ ἑδραίωμα τῆς ἀληθείας. καὶ ὁμολογουμένως μέγα ἐστὶν τὸ τῆς εὐσεβείας μυστήριον· <strong>Ὃς ἐφανερώθη ἐν σαρκί</strong>, ἐδικαιώθη ἐν πνεύματι, <strong>ὤφθη ἀγγέλοις</strong>, ἐκηρύχθη ἐν ἔθνεσιν, ἐπιστεύθη ἐν κόσμῳ, <strong>ἀνελήμφθη ἐν δόξῃ</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/1tim/3/#L15-16">1디모 3:15-16</a>)</p></blockquote><h2>하느님이시며 주님이신 예수 그리스도 (<a href="https://bibleox.com/ko/ko-ctb/2tim/4/#L1">2디모 4:1</a>, <a href="https://bibleox.com/ko/ko-ctb/2pet/1/#L1">2베드 1:1</a>)</h2><p>이 구절에서 예수께서는 하느님이자 그리스도라고 불리십니다(“그리스도”는 그리스어로 “기름부음받은 이”라는 뜻이며, 기다리던 세상의 구세주를 가리키는 칭호입니다: <a href="https://bibleox.com/ko/ko-ctb/act/2/#L36">사도 2:36</a>). 그리스어 원문은 문자 그대로 “하느님과 그리스도 예수 앞에서”(τοῦ θεοῦ καὶ Χριστοῦ Ἰησοῦ)입니다.</p><p>여기서 두 분, 곧 하느님과 예수 그리스도를 말하는 것이라고 반론할 수 있습니다. 그러나 이 반론은 타당하지 않습니다. 두 낱말이 하나의 관사 τοῦ(속격 정관사)를 공유하므로, 둘 다 같은 한 인격, 곧 예수를 가리키기 때문입니다. 또한 뒤이어 나오는 τοῦ μέλλοντος(“장차 … 하실 분”)는 단수로서, 앞에서 한 분에 관해 말하고 있음을 덧붙여 보여 줍니다:</p><blockquote><p>“나는 <strong>하느님 앞에서 그리고</strong> 산 자와 죽은 자를 심판하실 <strong>그리스도 예수 앞에서</strong> 그대에게 엄숙히 명령합니다. 그리고 그리스도께서 다시 나타나실 것과 군림하실 것을 믿고 그대에게 당부합니다.” (<a href="https://bibleox.com/ko/ko-ctb/2tim/4/#L1">2디모 4:1</a>)</p></blockquote><blockquote><p>“Διαμαρτύρομαι ἐνώπιον <strong><u>τοῦ</u> θεοῦ <u>καὶ</u> Χριστοῦ Ἰησοῦ</strong>, τοῦ μέλλοντος κρίνειν ζῶντας καὶ νεκρούς, καὶ τὴν ἐπιφάνειαν αὐτοῦ καὶ τὴν βασιλείαν αὐτοῦ·” (<a href="https://bibleox.com/ko/gr-lxx-byz/2tim/4/#L1">2디모 4:1</a>)</p></blockquote><p>다음은 하나의 공통 관사를 가진 비슷한 문법 구조입니다:</p><blockquote><p>“우리 주 예수 그리스도의 <strong>아버지 하느님</strong>을 찬양합시다. 하느님께서는 당신의 크신 자비로 우리를 다시 낳아 주시고 예수 그리스도를 죽은 자들 가운데서 다시 살리심으로써 우리에게 산 희망을 안겨 주셨습니다.” (<a href="https://bibleox.com/ko/ko-ctb/1pet/1/#L3">1베드 1:3</a>)</p></blockquote><blockquote><p>“Εὐλογητὸς <strong><u>ὁ</u> θεὸς <u>καὶ</u> πατὴρ</strong> τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὁ κατὰ τὸ πολὺ αὐτοῦ ἔλεος ἀναγεννήσας ἡμᾶς εἰς ἐλπίδα ζῶσαν δι᾿ ἀναστάσεως Ἰησοῦ Χριστοῦ ἐκ νεκρῶν” (<a href="https://bibleox.com/ko/gr-lxx-byz/1pet/1/#L3">1베드 1:3</a>)</p></blockquote><p>여기서 “하느님과 아버지”라는 두 낱말은 하나의 공통 관사 ὁ(주격 정관사)를 가지므로, 서로 다른 두 인격이 아니라 한 인격을 묘사합니다.</p><p>그리스도께서 하느님이라 불리시는 다음 구조도 같은 규칙을 따릅니다:</p><blockquote><p>“예수 그리스도의 종이며 사도인 나 시몬 베드로는 <strong>우리의 하느님이시며 구세주이신 예수 그리스도</strong>의 정의를 힘입어 귀중한 믿음을 우리와 함께 간직하게 된 여러분에게 이 편지를 씁니다.” (<a href="https://bibleox.com/ko/ko-ctb/2pet/1/#L1">2베드 1:1</a>)</p></blockquote><blockquote><p>“Συμεὼν Πέτρος δοῦλος καὶ ἀπόστολος Ἰησοῦ Χριστοῦ τοῖς ἰσότιμον ἡμῖν λαχοῦσιν πίστιν ἐν δικαιοσύνῃ <strong><u>τοῦ</u> θεοῦ</strong> ἡμῶν <strong>καὶ σωτῆρος Ἰησοῦ Χριστοῦ</strong>·” (<a href="https://bibleox.com/ko/gr-lxx-byz/2pet/1/#L1">2베드 1:1</a>)</p></blockquote><h2>복음사가 루가는 그리스도를 하느님이라 부릅니다 (<a href="https://bibleox.com/ko/ko-ctb/lk/8/#L39">루가 8:39</a>)</h2><p>복음사가 루가가 기록한 구절을 살펴봅시다. 인용문의 앞부분은 예수 그리스도의 말씀이고, 뒷부분은 서술자, 곧 복음사가 루가의 말입니다. 그리스도께서는 고침을 받은 사람에게 하느님께서 해 주신 일을 전하라고 보내시는데, 복음사가 루가는 고침을 받은 사람이 예수께서 해 주신 일을 알렸다고 기록합니다. 곧 복음사가 루가의 이해로는 여기서 예수와 하느님은 같은 분이십니다:</p><blockquote><p>“집으로 돌아 가서 <strong>하느님께서 너에게 베풀어 주신 모든 일</strong>을 이야기하라‘하고 이르셨다. 그는 물러가 <strong>예수께서 자기에게 해 주신 일</strong>을 온 동네에 널리 알렸다.” (<a href="https://bibleox.com/ko/ko-ctb/lk/8/#L39">루가 8:39</a>)</p></blockquote><blockquote><p>“Ὑπόστρεφε εἰς τὸν οἶκόν σου, καὶ διηγοῦ ὅσα σοι <strong>ἐποίησεν ὁ θεός</strong>. καὶ ἀπῆλθεν καθ᾿ ὅλην τὴν πόλιν κηρύσσων ὅσα <strong>ἐποίησεν</strong> αὐτῷ <strong>ὁ Ἰησοῦς</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/lk/8/#L39">루가 8:39</a>)</p></blockquote><p>그리스도를 하느님으로 믿는 믿음의 반대자들은 복음사가 루가가 고침을 받은 사람의 행동을 묘사했을 뿐이라고 반론할지 모릅니다. 예수께서는 하느님께서 하신 일을 전하라고 명하셨는데, 고침을 받은 사람이 잘못 알아듣고 하느님이 아니라 예수께서 하신 일을 전했다는 것입니다. 그러나 이들 반대자는 복음사가 루가도 그리스도의 신성을 반대한 사람, 곧 루가도 그리스도를 하느님으로 여기지 않았다고 본다는 점을 알아야 합니다. 그렇다면 복음사가는 고침을 받은 사람이 예수께서 시키신 일과 전혀 다른 일을 했다는 잘못을 틀림없이 어떻게든 지적했을 것입니다. 적어도 “그러나” 같은 접속사를 써서 “<em>예수께서는 돌아가서 하느님께서 하신 일을 전하라고 하셨다.</em> <strong><em><u>그러나</u></em></strong> <em>그는 가서 예수께서 하신 일을 전하였다</em>”라고 썼을 것입니다. 더 나아가, 고침을 받은 사람이 잘못해서 예수를 하느님으로 여겼기 때문에 하느님이 아니라 예수를 전하였다고 분명히 말했을 것입니다. 이것은 사소한 일이 아니라 믿음의 기초입니다.</p><p>그러나 복음사가는 아무런 대조도 하지 않습니다. 오히려 같은 구조를 되풀이합니다: “하느님께서 베풀어 주신 … 예수께서 해 주신”(그리스어로는 두 번 다 ἐποίησεν입니다). 이것은 복음사가가 그리스도의 신성을 믿었다는 무게 있는 증거입니다.</p><h2>그리스도 안에는 하느님의 완전한 신성이 깃들어 있습니다 (<a href="https://bibleox.com/ko/ko-ctb/kol/2/#L6,9">골로 2:6,9</a>)</h2><p>이 구절은 물론 여러 가지로 해석될 수 있지만, 다른 구절들에 더하여 주목할 만합니다:</p><blockquote><p>“여러분은 그리스도 예수를 주님으로 받아 들였으니 그분을 모시고 살아 가십시오. &lt;…&gt; <strong>그리스도의 인성 안에는 하느님의 완전한 신성이 깃들어 있습니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/kol/2/#L6,9">골로 2:6,9</a>)</p></blockquote><blockquote><p>“Ὡς οὖν παρελάβετε τὸν Χριστὸν Ἰησοῦν τὸν κύριον, ἐν αὐτῷ περιπατεῖτε, &lt;…&gt; ὅτι ἐν αὐτῷ κατοικεῖ πᾶν <strong>τὸ πλήρωμα τῆς θεότητος σωματικῶς</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/kol/2/#L6,9">골로 2:6,9</a>)</p></blockquote><h2>사도들은 사람들에게 그리스도를 하느님으로 전합니다 (<a href="https://bibleox.com/ko/ko-ctb/act/17/#L3,23">사도 17:3,23</a>)</h2><blockquote><p>“바울로는 성서를 풀이하면서 그리스도는 반드시 고난을 받고 죽었다가 다시 살아나야 한다는 것을 보여 주고 ‘<strong><mark>내가 여러분에게 전하고 있는 예수가</mark></strong> 바로 그 그리스도입니다’하고 말하였다. &lt;…&gt; 내가 아테네시를 돌아 다니며 여러분이 예배하는 곳을 살펴 보았더니 <strong><mark>알지 못하는 신에게</mark></strong> 라고 새겨진 <strong>제단</strong>까지 있었습니다. 여러분이 미처 알지 못한 채 예배해 온 그분을 <strong><mark>이제 여러분에게 알려 드리겠습니다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/act/17/#L3,23">사도 17:3,23</a>) <em>(“전하고 있는”과 “알려 드리겠습니다”는 그리스어 원문에서 같은 동사 καταγγέλλω입니다. “신”은 θεός입니다.)</em></p></blockquote><h2>하느님께서 사람이 되셨습니다 (<a href="https://bibleox.com/ko/ko-ctb/in/1/#L1-18">요한 1:1-18</a>)</h2><p>사도 요한은 말씀을 하느님이라 부르고, 이어서 그 말씀이 사람이 되셨다고 말합니다. 예언자 세례자 요한이 가리킨 분은 바로 사람이 되신 그 말씀이며, 그가 가리킨 분은 예수 그리스도이십니다:</p><blockquote><p>“한 처음, 천지가 창조되기 전부터 말씀이 계셨다. 말씀은 하느님과 함께 계셨고 <strong>하느님과 똑같은 분이셨다</strong>. 말씀은 한 처음, 천지가 창조되기 전부터 하느님과 함께 계셨다. 모든 것은 말씀을 통하여 생겨났고 이 말씀 없이 생겨난 것은 하나도 없다. 생겨난 모든 것이 &lt;…&gt; <strong>말씀이 사람이 되셔서</strong> 우리와 함께 계셨는데 우리는 그분의 영광을 보았다. 그것은 <strong>외아들</strong>이 아버지에게서 받은 영광이었다. 그분에게는 은총과 충만하였다. 요한은 그분을 증언하여 외치기를 ‘그분은 내 뒤에 오시지만 사실은 내가 나기 전부터 계셨기 때문에, 나보다 앞서신 분이라고 말한 것은 바로 이분을 두고 한 말이다’라고 하였다. &lt;…&gt; 일찌기 하느님을 본 사람은 없다. 그런데 아버지의 품안에 계신 외아들로서 하느님과 똑같으신 그분이 하느님을 알려 주셨다.” (<a href="https://bibleox.com/ko/ko-ctb/in/1/#L1-3,14-15,18">요한 1:1-3,14-15,18</a>) <em>(“하느님과 똑같은 분이셨다”는 그리스어 원문에서 θεὸς ἦν ὁ λόγος — “<strong>말씀은 하느님이셨다</strong>”입니다.)</em></p></blockquote><p>사도는 여기서 그리스도를 단순히 성부의 아들이 아니라 외아들(독생자)이라고 부릅니다. 이는 그리스도처럼 성부의 아들인 분은 아무도 없다는 뜻입니다. 맏아들(먼저 태어난 이)이 아니라 외아들(오직 하나뿐인 아들)입니다. 다른 아들은 없습니다.</p><p><strong>“맏아들”에 관한 반론</strong></p><p>그리스도를 하느님으로 믿는 가르침의 반대자들은 다른 두 곳에서 그리스도가 맏아들로도 불린다고 반론할 것입니다:</p><blockquote><p>“하느님께서는 이미 오래 전에 택하신 사람들이 당신의 아들과 같은 모습을 가지도록 미리 정하셨습니다. 그래서 그리스도께서는 <strong>많은 형제 중에서 맏아들이 되셨습니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/rim/8/#L29">로마 8:29</a>)</p></blockquote><blockquote><p>“하느님께서 당신의 <strong>맏아들</strong>을 세상에 보내실 때에는, ‘하느님의 천사들은 모두 그에게 예배를 드려라’ 하고 말씀하셨습니다.” (<a href="https://bibleox.com/ko/ko-ctb/evr/1/#L6">히브 1:6</a>)</p></blockquote><p>이에 대해서는 이렇게 말해야 합니다. 그리스도께서 맏아들이라 불리시는 것은 죽은 자들 가운데서 맨 먼저 부활하셨기 때문입니다. 나중에 다시 죽는 그런 부활이 아니라(그런 부활은 전에 예언자들도 일으켰습니다), 죽음을 이기신 분으로서 변모한 모습으로 부활하시어 영원히 사시고(<a href="https://bibleox.com/ko/ko-ctb/rim/6/#L9">로마 6:9</a>), 영원히 다스리시려고 영광 가운데 하늘에 오르셨습니다. 그리스도 이전에는 아무도 이렇게 부활하지 못했습니다. 그분께서 처음으로 이렇게 부활하셨습니다. 곧 죽은 이들 가운데서 맏아들, 첫 열매로 나타나셨습니다:</p><blockquote><p>“그리스도는 또한 당신의 몸인 교회의 머리이십니다. 그분은 모든 것의 시작이시고 <strong>죽은 자들 가운데서 살아나신 최초의 분</strong>이시며 만물의 으뜸이 되셨습니다.” (<a href="https://bibleox.com/ko/ko-ctb/kol/1/#L18">골로 1:18</a>)</p></blockquote><blockquote><p>“그리고 진실한 증인이시며 <strong>죽음으로부터 제일 먼저 살아 나신 분</strong>이시며 땅 위의 모든 왕들의 지배자이신 예수 그리스도께서 여러분에게 은총과 평화를 내려 주시기를 빕니다. 우리를 사랑하신 나머지 당신의 피로써 우리를 죄에서 해방시켜 주시고” (<a href="https://bibleox.com/ko/ko-ctb/otkr/1/#L5">묵시 1:5</a>)</p></blockquote><blockquote><p>“곧 그리스도는 고난을 받고 <strong>죽은 자들 가운데서 제일 먼저 부활하여</strong> 이스라엘 백성과 이방인에게 구원의 빛을 선포하실 분이라는 것입니다.‘” (<a href="https://bibleox.com/ko/ko-ctb/act/26/#L23">사도 26:23</a>)</p></blockquote><p>그 밖의 인용구: <a href="https://bibleox.com/ru/ru/w/Христос-Единородный-Сын-Божий">그리스도 — 하느님의 외아들</a></p><h2>시편에서 하느님에 관해 하신 말씀이 성자에 관해 하신 말씀입니다 (<a href="https://bibleox.com/ko/ko-ctb/evr/1/#L8-12">히브 1:8-12</a>)</h2><p>사도는 예언적인 시편을 그리스도께 적용하며, 그 말씀은 성자에 관해 하신 것이라고 말합니다:</p><ol><li><p>성자는 하느님이십니다.</p></li><li><p>성자께서 하늘과 땅을 세우셨습니다.</p></li><li><p>하느님께서 하느님이신 성자에게 기름을 부으셨습니다(그리스어 Χριστός — 기름부음받은 이).</p></li></ol><blockquote><p>“그러나 <strong>아들에 관해서는</strong> 이렇게 말씀하셨습니다. ‘<strong>당신은 하느님이십니다</strong>. 당신의 왕권은 영원무궁하시며 당신이 잡으신 지팡이는 정의의 지팡이입니다. 당신은 정의를 사랑하시고 불의를 미워하셨습니다. 그러므로 <strong>하느님 곧 당신의 하느님께서는</strong> 당신에게 즐거움의 기름을 부어 왕으로 삼으시고 당신의 동료들보다 더 기쁘게 해 주셨습니다. ’ 또 이런 말씀도 있습니다. ‘<strong>주님, 한 처음 땅을 만드신 이도 주님이시요 하늘을 손수 만드신 이도 주님이십니다</strong>. 하늘과 땅은 없어질지라도 주님은 영원히 계십니다. 만물은 옷처럼 낡아질 것이요 주님은 그것들을 겉옷처럼 말아 치우실 것입니다. 만물은 옷처럼 변할지라도 주님은 언제나 같으시고 주님은 영원히 늙지 않으십니다.” (<a href="https://bibleox.com/ko/ko-ctb/evr/1/#L8-12">히브 1:8-12</a>) <em>(앞부분은 <a href="https://bibleox.com/ko/ko-ctb/ps/45/#L6-7">시편 45:6-7</a>을 인용한 것으로, 히브리어에서 “하느님”은 אֱלֹהִים(엘로힘)입니다.)</em></p></blockquote><p>그리스도를 하느님으로 믿는 믿음의 반대자들은 여기서 하느님이 일반적인 히브리어 낱말 엘로힘으로 불렸을 뿐이고, 이 말은 참 하느님에게도 거짓 신들에게도 쓰였다고 반론할 것입니다. 그들은 하느님이 네 글자 이름(테트라그람마톤) <strong>יְהוָֽה (YHWH, 야훼)</strong>로 표시되기를 요구할 것입니다. 사도가 인용하는 두 번째 시편(<a href="https://bibleox.com/ko/ko-ctb/ps/102/#L25-27">시편 102:25-27</a>)은 이 요구를 충족합니다. 이 시편 전체가 <strong>하느님(יְהוָֽה, YHWH)</strong>께 드리는 말씀이며, 하느님은 여기서 “야훼”라는 이름으로 불리십니다(<a href="https://bibleox.com/ko/ko-ctb/ps/102/#L1">시편 102:1</a>, <a href="https://bibleox.com/ko/ko-ctb/ps/102/#L19">시편 102:19</a>, <a href="https://bibleox.com/ko/ko-ctb/ps/102/#L22">시편 102:22</a>). 히브리어 본문의 시편 표제도 “기운이 다하여 야훼 앞에 근심을 쏟아 놓는 고통받는 이의 기도”입니다. 이처럼 사도가 인용한 구절을 포함한 이 시편 전체가 하느님께 드리는 기도이고, 거기서 하느님은 그들이 바라는 대로 야훼라 불리십니다. 그런데 사도는 이 말씀이 성자에 관해 하신 것이라고 합니다. 곧 야훼는 성자, 예수 그리스도이십니다.</p><h2>하느님은 구세주이시고, 예수 그리스도는 구세주이십니다 (<a href="https://bibleox.com/ko/ko-ctb/tit/1/#L3-4">디도 1:3-4</a>)</h2><blockquote><p>“하느님께서는 적절한 시기에 우리의 전도를 통해서 당신의 뜻을 분명히 드러내셨으며 나는 <strong>우리 구세주 하느님</strong>의 명령으로 이 사도직을 맡았습니다. 나와 같은 믿음의 생활을 하는 진실된 아들 디도에게 이 편지를 씁니다. 하느님 아버지와 <strong>우리 구세주 그리스도 예수</strong>께서 은총과 평화를 그대에게 내려 주시기를 빕니다.” (<a href="https://bibleox.com/ko/ko-ctb/tit/1/#L3-4">디도 1:3-4</a>)</p></blockquote><blockquote><p>“그리고 <strong>위대하신 하느님과 우리 구세주 예수 그리스도</strong>께서 영광스럽게 나타나실 그 복된 희망의 날을 기다리게 해 줍니다.” (<a href="https://bibleox.com/ko/ko-ctb/tit/2/#L13">디도 2:13</a>) <em>(그리스어 원문은 τοῦ μεγάλου θεοῦ καὶ σωτῆρος ἡμῶν Ἰησοῦ Χριστοῦ — 하나의 관사로 묶인 “<strong>우리의 위대하신 하느님이시며 구세주이신 예수 그리스도</strong>”입니다.)</em></p></blockquote><h2>예수는 구약의 하느님과 같은 하느님이십니다 (<a href="https://bibleox.com/ko/ko-ctb/mf/23/#L34">마태 23:34</a>, <a href="https://bibleox.com/ko/ko-ctb/ier/7/#L21,25">예레 7:21,25</a>)</h2><p>그리스도를 하느님으로 믿는 믿음의 반대자들은 사도들이 그리스도를 문자 그대로 하느님이라 부른다는 것을 보면 “하느님이라 불리는 것만으로는 부족하다”고 반론합니다. 예언자 모세도 하느님이라 불렸다는 것입니다:</p><blockquote><p>“야훼께서 모세에게 이르셨다. ‘보아라, <strong>내가 너를 파라오 앞에 하느님처럼 세우리니</strong>, 너의 형 아론이 너의 대변자가 되리라.” (<a href="https://bibleox.com/ko/ko-ctb/ish/7/#L1">출 7:1</a>) <em>(히브리어 원문은 נְתַתִּיךָ אֱלֹהִים לְפַרְעֹה — “내가 너를 파라오에게 <strong>하느님으로</strong> 세웠다”입니다.)</em></p></blockquote><blockquote><p>“καὶ εἶπεν κύριος πρὸς Μωυσῆν λέγων Ἰδοὺ δέδωκά σε <strong>θεὸν</strong> Φαραω, καὶ Ααρων ὁ ἀδελφός σου ἔσται σου προφήτης·” (<a href="https://bibleox.com/ko/gr-lxx-byz/ish/7/#L1">출 7:1</a>)</p></blockquote><p>첫째, 여기서는 비판자들 자신이 앞서 내세운 요구, 곧 “하느님”이라는 말에 관사가 있어야 한다는 요구가 충족되지 않습니다. 여기에는 관사가 없습니다. 실제로 본문을 보면 예언자 모세는 파라오에 대하여 주어진 역할을 맡았을 뿐입니다. 모세가 본성으로 신이며 신성을 자기의 변함없는 속성으로 지녔다는 것을 보여 주는 내용은 아무것도 없습니다. 또한 비판자들이 우리의 논거에 내세우는 둘째 요구도 충족되지 않습니다. 히브리어 본문에도 여기에는 테트라그람마톤 YHWH가 아니라 일반적인 낱말 אֱלֹהִ֖ים(엘로힘)이 있습니다. 곧 최고의 의미에서 참 하느님을 말하는 것이 아닙니다.</p><p>둘째, 예수 그리스도께서 바로 그 참 하느님, 곧 창조주이시며 야훼이시고 조상들(아브라함, 이사악, 야곱)의 하느님이심은 사도들의 다른 말씀으로 확실히 알 수 있습니다. 예를 들어 그리스도께서는 친히 이스라엘에 예언자들을 보낸 분이 당신이라고 말씀하시는데, 구약에서는 모든 예언자를 보내신 분이 하느님 야훼라고 합니다. 여기에서도 그리스도께서 사람이 되신 하느님 야훼이심이 바로 나옵니다. 다른 예는 아래에 있습니다.</p><h3>예언자를 보내신 분은 하느님뿐이신데, 그리스도께서 예언자를 보내셨습니다</h3><p>그리스도께서는 친히 이스라엘에 예언자들을 보내시는 분이 당신이라고 말씀하십니다:</p><blockquote><p>“<strong>나는 예언자들과 현인들과 학자들을 너희에게 보내겠다</strong>. 그러나 너희는 그들을 더러는 죽이고 더러는 십자가에 매달고 또 더러는 회당에서 채찍질하며 이 동네 저 동네로 잡으러 다닐 것이다.” (<a href="https://bibleox.com/ko/ko-ctb/mf/23/#L34">마태 23:34</a>)</p></blockquote><p>하느님께서는 친히(중개자 없이) 예언자들에게 말씀하시고 그들을 보내십니다:</p><blockquote><p>“<strong>나 만군의 야훼가</strong> 이스라엘의 하느님으로서 선언한다. 친교제에다가 번제를 보태어 바치고, 그 고기를 처먹어라. &lt;…&gt; 너희 조상들이 에집트에서 나오던 날부터 오늘에 이르도록 <strong>나의 종 예언자들을 줄곧 보냈지만</strong>,” (<a href="https://bibleox.com/ko/ko-ctb/ier/7/#L21,25">예레 7:21,25</a>) <em>(“야훼”는 히브리어 원문에서 יְהוָה(YHWH)입니다.)</em></p></blockquote><blockquote><p>“하느님께서 대답하셨다. ‘내가 네 힘이 되어 주겠다. 이것이 바로 <strong>내가 너를 보냈다는</strong> 증거가 되리라. 너는 나의 백성을 에집트에서 이끌어 낸 다음 이 산에서 하느님을 예배하리라.’” (<a href="https://bibleox.com/ko/ko-ctb/ish/3/#L12">출 3:12</a>)</p></blockquote><blockquote><p>“보아라, 이제 풀무불처럼 모든 것을 살라 버릴 날이 다가왔다. 그 날이 오면, 멋대로 살던 사람들은 모두 검불처럼 타 버려 뿌리도 가지도 남지 않으리라. 만군의 야훼가 말한다. &lt;…&gt; 이 야훼가 나타날 날, 그 무서운 날을 앞두고 <strong>내가 틀림없이 예언자 엘리야를 너희에게 보내리니</strong>,” (<a href="https://bibleox.com/ko/ko-ctb/mal/4/#L1,5">말라 4:1,5</a>)</p></blockquote><blockquote><p>“<strong>야훼께서는 한 예언자를 이스라엘 백성에게 보내시어</strong> 당신의 말씀을 전하게 하셨다. ‘이스라엘의 하느님 야훼께서 이렇게 말씀하신다. ’내가 너희를 에집트에서 나오게 하였다. 종살이하던 집에서 너희를 구출해 내었다.” (<a href="https://bibleox.com/ko/ko-ctb/sud/6/#L8">판관 6:8</a>)</p></blockquote><blockquote><p>“그때문에 <strong>야훼께서는</strong> 아마지야에게 크게 노하시어 <strong>예언자를 보내시었다</strong>. ‘이 우상들은 제 백성을 임금님의 손에서 건져 내지도 못했는데 이 우상들에게 복을 빌다니 어찌 된 일입니까?’” (<a href="https://bibleox.com/ko/ko-ctb/2par/25/#L15">역하 25:15</a>)</p></blockquote><blockquote><p>“사무엘이 사울에게 전하였다. ‘<strong>야훼께서 나를 보내시어</strong> 그대에게 기름을 부어 당신의 백성 이스라엘을 다스릴 왕으로 세우라고 하셨소” (<a href="https://bibleox.com/ko/ko-ctb/1ts/15/#L1">삼상 15:1</a>)</p></blockquote><blockquote><p>“<strong>야훼께서 예언자 나단을 다윗에게 보내셨다</strong>” (<a href="https://bibleox.com/ko/ko-ctb/2ts/12/#L1">삼하 12:1</a>)</p></blockquote><blockquote><p>“야훼께서 그 아이를 사랑하셨다. <strong>야훼께서 예언자 나단을 보내시어</strong> 당신이 사랑하는 아이라 하여 여디디야라는 이름을 내리셨다.” (<a href="https://bibleox.com/ko/ko-ctb/2ts/12/#L24-25">삼하 12:24-25</a>)</p></blockquote><blockquote><p>“<strong>나는 나의 종 예언자들을 너희에게 보냈다.</strong> 그러나 너희는 그들을 잡아 죽이고 그들의 몸을 찢었다. 나는 그들의 피를 너희에게서 찾으리라. 주님의 말씀이다” (<a href="https://bibleox.com/ko/en-nrsv/3ezd/1/#L32">3에스 1:32</a>, 영어 번역(NRSV)에서 옮김)</p></blockquote><h2>유다인들은 예언자 모세 때에 광야에서 그리스도를 시험하였습니다 (<a href="https://bibleox.com/ko/ko-ctb/1kor/10/#L9">1고린 10:9</a>, <a href="https://bibleox.com/ko/ko-ctb/ps/95/#L6-9">시편 95:6-9</a>)</h2><blockquote><p>“또 <strong>어떤 사람들은 주님을 떠보다가 뱀에게 물려 죽었습니다</strong>. 우리는 그들처럼 주님을 떠보는 자가 되어서는 안 되겠습니다.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/10/#L9">1고린 10:9</a>) <em>(“주님”은 그리스어 원문에서 τὸν Χριστόν — “<strong>그리스도를</strong>”입니다. 비잔틴 본문도 같습니다.)</em></p></blockquote><p>광야에서 유다인들이 시험한 분은 바로 하느님, 창조주이셨습니다. 그러므로 그리스도께서는 그들이 시험한 바로 그 하느님이십니다:</p><blockquote><p>“어서 와 허리 굽혀 경배드리자. <strong>우리를 지으신 야훼께</strong> 무릎을 꿇자. <strong>그는 우리의 하느님</strong>, 우리는 그의 기르시는 백성, 이끄시는 양떼. 오늘 너희는 그의 말씀을 듣게 되리니 므리바에서, 그 날 마싸 광야에서의 너희 선조들처럼 너희는 마음을 완고하게 굳히지 말아라. 그들은 거기에서 내가 하는 일을 보고서도 <strong>나의 속을 떠보고 나를 시험하였다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/ps/95/#L6-9">시편 95:6-9</a>)</p></blockquote><h2>고대 사본[1]</h2><ol><li><p><strong>유다 5절.</strong> 오늘날의 많은 본문에는 “주님께서 백성을 에집트 땅에서 구해 내신 뒤 믿지 않은 자들을 멸망시키셨다”고 되어 있습니다. 공동번역은 “여호수아”로 옮겼는데, 이는 그리스어 Ἰησοῦς(예수, 여호수아)를 옮긴 것입니다(<a href="https://bibleox.com/ko/ko-ctb/iud/1/#L5">유다 1:5</a>). 사도 유다의 편지를 담은 가장 오래된 파피루스 <a href="https://en.wikipedia.org/wiki/Papyrus_72">p72</a>(3세기)에는 “<a href="http://earlynewtestament.com/papyrus72.htm"><strong><em>하느님 그리스도</em></strong><em> (Theos Christos)</em></a>께서 백성을 에집트 땅에서 구해 내신 뒤 믿지 않은 자들을 멸망시키셨다”고 되어 있습니다. <em>(최신 비평 본문 NA28에도 Ἰησοῦς — “<strong>예수께서</strong>”로 되어 있습니다.)</em></p></li><li><p><strong>골로 2:2.</strong> 비잔틴 본문과 러시아어 시노드 역본의 끝부분은 “하느님 아버지와 그리스도의 신비”(τοῦ θεοῦ καὶ πατρὸς καὶ τοῦ Χριστοῦ)입니다. 그러나 사도 바울로의 편지를 전하는 가장 오래된 파피루스 <a href="https://en.wikipedia.org/wiki/Papyrus_46">p46</a>(2세기 말)에는 “<strong>하느님 그리스도</strong>(tou Theou Christou)의 신비”라고 되어 있습니다. 공동번역의 “하느님의 심오한 진리인 그리스도”도 이 오래된 읽기에 가깝습니다(<a href="https://bibleox.com/ko/ko-ctb/kol/2/#L2">골로 2:2</a>).</p></li><li><p><strong>2베드 1:2.</strong> 오늘날의 본문은 “하느님과 우리 주 예수를 알게 됨으로써”입니다(<a href="https://bibleox.com/ko/ko-ctb/2pet/1/#L2">2베드 1:2</a>). 그러나 이 편지의 가장 오래된 사본에는 “<strong>하느님 예수</strong>(tou Theou Iesou), 우리 주님을 알게 됨으로써”라고 되어 있습니다.</p></li><li><p><strong>요한 1:18.</strong> 비잔틴 본문과 러시아어 시노드 역본은 “아버지의 품안에 계신 외아들”(ὁ μονογενὴς υἱός)입니다. 그러나 요한 복음서의 가장 이른 사본인 파피루스 <a href="https://en.wikipedia.org/wiki/Papyrus_75">p75</a>(3세기 중엽)와 <a href="https://en.wikipedia.org/wiki/Papyrus_66">p66</a>(2세기 말)에는 “<strong>외아드님이신 하느님</strong>(μονογενὴς θεός), 아버지의 품안에 계신 분”이라고 되어 있습니다. 리옹의 성 이레네오스도 이 구절을 같은 형태로 인용합니다.</p></li></ol><h2>그리스도는 두 세계, 곧 하느님의 세계와 사람의 세계에 사시는 분이십니다</h2><p>하느님과 사람 양쪽에 손을 얹어 줄 중재자는 없습니다. 이 두 세계는 서로 닿지 않고, 어떤 것으로도 누구로도 이어져 있지 않기 때문입니다:</p><blockquote><p>“그러나, <strong>우리 사이를 중재해 줄 이가 있어 그가 우리의 어깨에 손이라도 얹어 준다면</strong>,” (<a href="https://bibleox.com/ko/ko-ctb/iov/9/#L33">욥 9:33</a>) <em>(러시아어 번역과 칠십인역을 따르면 “우리 사이에는 … 중재자가 <strong>없습니다</strong>”입니다.)</em></p></blockquote><p>예수 그리스도(창조되지 않은 하느님이시며 창조된 사람이신 분)께서는 당신 자신으로 이 두 세계를 이으십니다:</p><blockquote><p>“하느님은 한 분뿐이시고 <strong>하느님과 사람 사이의 중재자도 한 분뿐이신데</strong> 그분이 바로 사람으로 오셨던 그리스도 예수이십니다.” (<a href="https://bibleox.com/ko/ko-ctb/1tim/2/#L5">1디모 2:5</a>)</p></blockquote><h2>구약과의 평행 구절</h2><h3>그리스도는 하느님과 똑같이 왕 중의 왕, 주 중의 주이십니다</h3><p>예언자들은 하느님을 주 중의 주라고 부릅니다:</p><blockquote><p>“모든 신들의 하느님께 감사노래 불러라. ‘그의 사랑 영원하시다.’ <strong>모든 주인들의 주님께</strong> 감사노래 불러라. ‘그의 사랑 영원하시다.’” (<a href="https://bibleox.com/ko/ko-ctb/ps/136/#L2-3">시편 136:2-3</a>)</p></blockquote><p>사도들은 하느님을 주 중의 주, 왕 중의 왕이라고 부릅니다:</p><blockquote><p>“그리스도께서는 하느님께서 친히 정하신 때에 나타나실 것입니다. 하느님은 오직 한 분이시고 복되신 주권자이시며 <strong>왕 중의 왕이시고 군주 중의 군주이십니다</strong>. 그분은 홀로 불멸하시고 사람이 가까이 갈 수 없는 빛 가운데 계시며 사람이 일찌기 본 일이 없고 또 볼 수도 없는 분이십니다. 영예와 권세가 영원히 그분에게 있기를 빕니다. 아멘.” (<a href="https://bibleox.com/ko/ko-ctb/1tim/6/#L15-16">1디모 6:15-16</a>)</p></blockquote><p>사도들은 예수 그리스도를 주 중의 주, 왕 중의 왕이라고 부릅니다:</p><blockquote><p>“그들은 어린 양에게 싸움을 걸겠지만 마침내 <strong>모든 군주의 군주이시며 모든 왕의 왕이신 어린 양</strong>이 이기실 것이며, 그의 부르심을 받고 뽑혀서 충성을 다하는 부하들도 함께 승리할 것이다.‘” (<a href="https://bibleox.com/ko/ko-ctb/otkr/17/#L14">묵시 17:14</a>)</p></blockquote><blockquote><p>“그분의 옷과 넓적다리에는 ‘<strong>모든 왕의 왕, 모든 군주의 군주</strong>’라는 칭호가 적혀 있었습니다.” (<a href="https://bibleox.com/ko/ko-ctb/otkr/19/#L16">묵시 19:16</a>)</p></blockquote><h3>그리스도는 하느님처럼 전능하신 분이십니다</h3><p>하느님은 전능하신 분이십니다:</p><blockquote><p>“여보게, 하느님께 매를 맞는 일이야 즐거운 일 아닌가! 그러니 <strong>전능하신 분</strong>의 교훈을 물리치지 말게.” (<a href="https://bibleox.com/ko/ko-ctb/iov/5/#L17">욥 5:17</a>; <a href="https://bibleox.com/ko/ko-ctb/otkr/15/#L3">묵시 15:3</a>)</p></blockquote><p>그리스도는 전능하신 분이십니다:</p><blockquote><p>“지금 계시고 전에도 계셨고 장차 오실 <strong>전능하신 주 하느님</strong>께서 ‘<strong>나는 알파요 오메가다</strong>’하고 말씀하셨습니다” (<a href="https://bibleox.com/ko/ko-ctb/otkr/1/#L8">묵시 1:8</a>) <em>(이 구절의 말씀은 뒤의 <a href="https://bibleox.com/ko/ko-ctb/otkr/1/#L17-18">묵시 1:17-18</a>과 <a href="https://bibleox.com/ko/ko-ctb/otkr/22/#L13">묵시 22:13</a>에서 그리스도의 말씀으로 이어집니다.)</em></p></blockquote><blockquote><p>“그 아들은 하느님의 영광을 드러내는 찬란한 빛이시요, 하느님의 본질을 그대로 간직하신 분이시며 <strong>그의 능력의 말씀으로 만물을 보존하시는 분</strong>이십니다. 그분은 인간의 죄를 깨끗하게 씻어 주셨고 지극히 높은 곳에 계신 전능하신 분의 오른편에 앉아 계십니다.” (<a href="https://bibleox.com/ko/ko-ctb/evr/1/#L3">히브 1:3</a>)</p></blockquote><p>같은 책의 뒷부분에서 하느님은 전능하신 분이라 불리십니다:</p><blockquote><p>“하느님의 종 모세의 노래와 어린 양의 노래를 이렇게 부르고 있었습니다. ‘<strong>전능하신 주 하느님</strong>, 주께서 하시는 일은 크고도 놀랍습니다. <strong>만민의 왕이시여</strong>, 주님의 길은 바르고 참되십니다.” (<a href="https://bibleox.com/ko/ko-ctb/otkr/15/#L3">묵시 15:3</a>)</p></blockquote><h3>하느님께서 모든 성인과 함께 오시듯이 그리스도께서도 그러하십니다</h3><p>하느님(야훼)께서는 모든 성인과 함께 오십니다:</p><blockquote><p>“그 바람에 고아에서 야솔까지 뻗은 힌놈 골짜기가 유다 왕 우찌야 시대에 지진으로 메워진 것처럼 메워지리라. 그 뒤에 <strong>야훼 하느님께서 당신의 백성으로 뽑으신 사람들을 모두 이끌고 오실 것이다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/zah/14/#L5">즈가 14:5</a>) <em>(히브리어 원문은 כָּל־קְדֹשִׁים עִמָּךְ — “<strong>모든 거룩한 이들이</strong> 당신과 함께”입니다.)</em></p></blockquote><blockquote><p>“이런 자들에게 아담의 칠대 손 에녹은 이렇게 예언했습니다. ‘<strong>주님께서 거룩한 천사들을 무수히 거느리고 오셔서</strong>” (<a href="https://bibleox.com/ko/ko-ctb/iud/1/#L14">유다 1:14</a>)</p></blockquote><p>그리스도께서는 모든 성인과 함께 오십니다:</p><blockquote><p>“그리하여 여러분의 마음이 굳건해져서 <strong>우리 주 예수께서 당신의 모든 성도들과 함께 다시 오시는 날</strong> 우리 아버지 하느님 앞에 거룩하고 흠없는 사람으로 나설 수 있게 되기를 빕니다.” (<a href="https://bibleox.com/ko/ko-ctb/1sol/3/#L13">1데살 3:13</a>)</p></blockquote><blockquote><p>“‘<strong>사람의 아들이 영광을 떨치며 모든 천사들을 거느리고 와서</strong> 영광스러운 왕좌에 앉게 되면” (<a href="https://bibleox.com/ko/ko-ctb/mf/25/#L31">마태 25:31</a>) <em>(비잔틴 본문(다수 사본)에는 “모든 <strong>거룩한</strong> 천사들”(πάντες οἱ ἅγιοι ἄγγελοι)이라고 되어 있습니다.)</em></p></blockquote><h2>창조주이시며 심판자이신 분 — 하느님</h2><ol><li><p><a href="https://bibleox.com/ru/ru/w/Христос-Творец-мира">그리스도 — 창조주</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/Христос-судья">그리스도 — 심판자</a></p></li><li><p>창조주이시며 심판자이신 분 — 하느님</p></li></ol><blockquote><p>“그리고 큰 소리로 ‘너희는 <strong>하느님을 두려워하고</strong> 찬양하여라. <strong>그분이 심판할 때가 왔다</strong>. <strong>하늘과 땅과 바다와 샘물을 만드신 분을 예배하여라</strong>’하고 외쳤습니다.” (<a href="https://bibleox.com/ko/ko-ctb/otkr/14/#L7">묵시 14:7</a>)</p></blockquote><h2>무슬림이 알아 두면 좋은 구절</h2><blockquote><p>“<strong>우리를 위하여 태어날 한 아기</strong>, 우리에게 주시는 아드님, 그 어깨에는 주권이 메어지겠고 그 이름은 탁월한 경륜가, <strong>용사이신 하느님, 영원한 아버지, 평화의 왕</strong>이라 불릴 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/is/9/#L5">이사 9:5</a>)</p></blockquote><blockquote><p>“그러나 에브라다 지방 <strong>베들레헴</strong>아, 너는 비록 유다 부족들 가운데서 보잘 것 없으나 나 대신 이스라엘을 다스릴 자 <strong>너에게서 난다</strong>. <strong>그의 핏줄을 더듬으면, 까마득한 옛날로 올라 간다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/mih/5/#L1">미가 5:1</a>)</p></blockquote><blockquote><p>“너희의 조상 아브라함은 내 날을 보리라는 희망에 차 있었고 과연 그 날을 보고 기뻐하였다.‘ 유다인들은 이 말씀을 듣고 ’<strong>당신이 아직 쉰 살도 못되었는데 아브라함을 보았단 말이오</strong>?‘하고 따지고 들었다. <strong>예수께서는</strong> ’정말 잘 들어 두어라. <strong>나는 아브라함이 태어나기 전부터 있었다</strong>.‘하고 대답하셨다.” (<a href="https://bibleox.com/ko/ko-ctb/in/8/#L56-58">요한 8:56-58</a>)</p></blockquote><blockquote><p>“예수께서 ‘<strong>나는 사탄이 하늘에서 번갯불처럼 떨어지는 것을 보았다</strong>” (<a href="https://bibleox.com/ko/ko-ctb/lk/10/#L18">루가 10:18</a>)</p></blockquote><blockquote><p>“배 안에 있던 사람들이 <strong>그 앞에 엎드려 절하며 ‘주님은 참으로 하느님의 아들이십니다</strong>’ 하고 말하였다.” (<a href="https://bibleox.com/ko/ko-ctb/mf/14/#L33">마태 14:33</a>)</p></blockquote><blockquote><p>“<strong>예수께서는</strong> 그들의 믿음을 보시고 중풍병자에게 ‘<strong>너는 죄를 용서받았다</strong>.’하고 말씀하셨다. 거기 앉아 있던 율법학자 몇 사람이 속으로 이 사람이 어떻게 감히 이런 말을 하여 하느님을 모독하는가? <strong>하느님 말고 누가 죄를 용서할 수 있단 말인가</strong>?‘하며 중얼거렸다.” (<a href="https://bibleox.com/ko/ko-ctb/mk/2/#L5-7">마르 2:5-7</a>)</p></blockquote><blockquote><p>“이 때문에 <strong>유다인들은 예수를 죽이려는 마음을 더욱 굳혔다</strong>. 예수께서 안식일법을 어기셨을뿐만 아니라 <strong>하느님을 자기 아버지라고 하시며 자기를 하느님과 같다고 하셨기 때문이다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/in/5/#L18">요한 5:18</a>)</p></blockquote><blockquote><p>“<strong>아버지께서</strong> 죽은 이들을 일으켜 다시 살리시듯이 <strong>아들도 살리고 싶은 사람들은 살릴 것이다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/in/5/#L21">요한 5:21</a>)</p></blockquote><blockquote><p>“<strong>단 두세 사람이라도 내 이름으로 모인 곳에는 나도 함께 있기 때문이다</strong>.‘” (<a href="https://bibleox.com/ko/ko-ctb/mf/18/#L20">마태 18:20</a>) <em>(“나”는 예수 그리스도이십니다.)</em></p></blockquote>'
