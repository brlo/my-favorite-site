- src: Христос-Бог
  path: 8HYB_예수그리스도는하느님이시다
  title: 예수 그리스도는 하느님이십니다
  copy_cover: true
  body: '<h2>머리말</h2><blockquote><p>“내 백성아 들을지어다 내가 말하리라 이스라엘아 내가 네게 증언하리라 <strong>나는 하나님 곧 네 하나님이로다</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ps/50/#L7">시 50:7</a>)</p></blockquote><h2>사도가 모두가 보는 앞에서 그리스도를 하느님이라 부르고, 그리스도께서 그의 믿음을 인정하십니다 (<a href="https://bibleox.com/ko/ko-nkrv/in/20/#L28-29">요 20:28-29</a>)</h2><p>이것은 가장 논란의 여지가 없는 구절입니다. 사도가 그리스도를 참 하느님으로 믿는다는 것을 확신하는 데 필요한 모든 것이 여기에 있습니다. 그 자리에 있던 어떤 사도도 그에게 반박하지 않았고, 그리스도께서 친히 이 믿음을 인정하십니다. 여기서는 θεὸς(하느님)라는 낱말에 정관사 ὁ까지 붙어 있어서, 그리스도를 하느님으로 믿는 믿음에 대한 반대자들의 이의가 모두 사라집니다. 이 구절을 보면 그리스도께서 바로 최고의 의미에서 하느님이라 불리신다는 것을 알 수 있습니다:</p><blockquote><p>“도마가 대답하여 이르되 <strong>나의 주님이시요 나의 하나님이시니이다</strong> 예수께서 이르시되 너는 나를 본 고로 믿느냐 보지 못하고 믿는 자들은 복되도다 하시니라” (<a href="https://bibleox.com/ko/ko-nkrv/in/20/#L28-29">요 20:28-29</a>)</p></blockquote><blockquote><p>“ἀπεκρίθη Θωμᾶς καὶ εἶπεν αὐτῷ, Ὁ κύριός μου καὶ <strong><u>ὁ</u> θεός</strong> μου. λέγει αὐτῷ ὁ Ἰησοῦς, Ὅτι ἑώρακάς με πεπίστευκας; μακάριοι οἱ μὴ ἰδόντες καὶ πιστεύσαντες” (<a href="https://bibleox.com/ko/gr-lxx-byz/in/20/#L28-29">요 20:28-29</a>)</p></blockquote><p>이에 맞서 그리스도의 신성에 관한 가르침의 반대자들은 “사도가 그저 감격하여 놀란 나머지 외쳤을 뿐”이라는 설득력 없는 말을 내놓을 뿐입니다. 그러나 이는 기록된 내용과 어긋납니다. 토마가 이 말을 그리스도께 직접 드렸다고 분명히 쓰여 있기 때문입니다. 그리스어 원문에는 “<strong>그분께 대답하여 말하였다</strong>”(ἀπεκρίθη … καὶ εἶπεν αὐτῷ)라고 되어 있어, “<strong>나의 주님, 나의 하느님</strong>”이라는 말은 본문에 따르면 그리스도께 직접 드린 말입니다.</p><p>이렇게 그리스도께 말씀드렸는데도 아무도 사도를 바로잡지 않았고, 그리스도께서는 “믿느냐”라고 하시며 그의 믿음을 인정하셨습니다. 그가 그리스도의 부활을 믿게 된 것은 분명하지만, 이 믿음을 얻자 그는 곧바로 자기가 얻은 믿음이 어떤 믿음인지, 곧 그리스도를 하느님으로 믿는 믿음임을 보여 줍니다. 비판자들의 문법적 요구도 여기서 모두 충족됩니다. 이 말은 사도가 그리스도와 사도들 앞에서 하였고, 아무도 반박하지 않았으며, 그리스도께서는 인정까지 하셨습니다. 이것으로도 믿지 않는 사람들을 설득하지 못한다면 무엇이 그들을 설득할 수 있겠습니까?</p><h2>그리스도는 만물 위에 계시는 하느님이십니다 (<a href="https://bibleox.com/ko/ko-nkrv/rim/9/#L3-5">롬 9:3-5</a>)</h2><p>사도는 그리스도를 최고의 의미에서 하느님이라 부릅니다:</p><blockquote><p>“나의 형제 곧 골육의 친척을 위하여 내 자신이 저주를 받아 그리스도에게서 끊어질지라도 원하는 바로라 그들은 이스라엘 사람이라 그들에게는 양자 됨과 영광과 언약들과 율법을 세우신 것과 예배와 약속들이 있고 조상들도 그들의 것이요 <strong>육신으로 하면 그리스도가 그들에게서 나셨으니</strong> <strong><mark>그는 만물 위에 계셔서 세세에 찬양을 받으실 하나님이시니라</mark></strong> 아멘” (<a href="https://bibleox.com/ko/ko-nkrv/rim/9/#L3-5">롬 9:3-5</a>)</p></blockquote><blockquote><p>“ὧν οἱ πατέρες, καὶ ἐξ ὧν ὁ <strong>Χριστὸς</strong> τὸ κατὰ σάρκα· <strong><u>ὁ</u></strong> ὢν ἐπὶ πάντων <strong>θεὸς</strong> εὐλογητὸς εἰς τοὺς αἰῶνας, ἀμήν” (<a href="https://bibleox.com/ko/gr-lxx-byz/rim/9/#L5">롬 9:5</a>)</p></blockquote><p>그리스도를 하느님으로 믿는 믿음의 반대자들은 θεὸς(하느님)라는 낱말에 정관사가 없으므로 여기서 그리스도는 최고의 의미에서 하느님이라 불리는 것이 아니라거나, “하느님”이라는 말이 아예 그리스도를 가리키지 않는다고 반론합니다.</p><p>이에 대해서는 여러 견해가 있습니다. 한 인격을 묘사하는 모든 속성 앞에 놓인 공통의 정관사로 충분하다고 볼 근거가 있습니다: «<strong>ὁ</strong> ὢν ἐπὶ πάντων θεὸς»(만물 위에 계시는 하느님). 어쨌든 우리는 처음에 이미, 정관사가 붙은 “하느님”이라는 말이 그리스도께 쓰인 분명한 예를 보았습니다(<a href="https://bibleox.com/ko/ko-nkrv/in/20/#L28-29">요 20:28-29</a>). 여기에 관사가 없다 해서 믿음에 무엇이 더 부족하겠습니까?</p><h2>그리스도는 참 하느님이십니다 (<a href="https://bibleox.com/ko/ko-nkrv/1in/5/#L20">요일 5:20</a>)</h2><blockquote><p>“또 아는 것은 하나님의 아들이 이르러 우리에게 지각을 주사 우리로 참된 자를 알게 하신 것과 또한 우리가 참된 자 곧 <strong>그의 아들 예수 그리스도</strong> 안에 있는 것이니 <strong>그는 참 하나님이시요</strong> 영생이시라” (<a href="https://bibleox.com/ko/ko-nkrv/1in/5/#L20">요일 5:20</a>)</p></blockquote><blockquote><p>“οἴδαμεν δὲ ὅτι ὁ υἱὸς τοῦ θεοῦ ἥκει, καὶ δέδωκεν ἡμῖν διάνοιαν ἵνα γινώσκομεν τὸν ἀληθινόν· καὶ ἐσμὲν ἐν τῷ ἀληθινῷ, ἐν τῷ υἱῷ αὐτοῦ <strong>Ἰησοῦ Χριστῷ. οὗτός ἐστιν <u>ὁ</u> ἀληθινὸς θεὸς</strong> καὶ ζωὴ αἰώνιος” (<a href="https://bibleox.com/ko/gr-lxx-byz/1in/5/#L20">요일 5:20</a>)</p></blockquote><p>사도 요한이 “그분이야말로”(οὗτός ἐστιν)라고 쓸 때, 이 대명사가 가리키는 것은 바로 앞에 나오는 예수 그리스도(Ἰησοῦ Χριστῷ)라는 이름입니다. 이것이 가장 가까운 선행사입니다. θεὸς 앞의 정관사 ὁ는 이것이 방금 말한 인격, 곧 예수 그리스도의 분명한 속성임을 강조합니다. 문법적으로나 논리적으로나 여기서는 <strong>“그분[예수 그리스도]이야말로 참 하느님이시며 영원한 생명이십니다”</strong>라고 말하고 있습니다.</p><h2>하느님이신 그리스도께서 당신 피로 교회를 얻으셨습니다 (<a href="https://bibleox.com/ko/ko-nkrv/act/20/#L28">행 20:28</a>)</h2><p>이 구절은 그리스도의 신성을 가리킵니다. 자기 피로 교회를 얻으신 분이 여기서 하느님이라 불리기 때문입니다. 신성에는 피가 없습니다. 피는 강생하신 성자께만 있습니다. 당신의 피로 교회를 얻으시어 하느님이라 불리는 분은 바로 성자이십니다.</p><blockquote><p>“여러분은 자기를 위하여 또는 온 양 떼를 위하여 삼가라 성령이 그들 가운데 여러분을 감독자로 삼고 <strong>하나님이</strong> <strong><mark>자기 피로</mark></strong> <strong>사신 교회</strong>를 보살피게 하셨느니라” (<a href="https://bibleox.com/ko/ko-nkrv/act/20/#L28">행 20:28</a>)</p></blockquote><blockquote><p>“προσέχετε ἑαυτοῖς καὶ παντὶ τῷ ποιμνίῳ, ἐν ᾧ ὑμᾶς τὸ πνεῦμα τὸ ἅγιον ἔθετο ἐπισκόπους, ποιμαίνειν <strong>τὴν ἐκκλησίαν τοῦ θεοῦ</strong>, ἣν περιεποιήσατο διὰ <strong>τοῦ αἵματος τοῦ <u>ἰδίου</u></strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/act/20/#L28">행 20:28</a>)</p></blockquote><h2>전에는 아무도 보지 못하던 하느님께서 육신으로 나타나 당신을 보이셨습니다 (<a href="https://bibleox.com/ko/ko-nkrv/1tim/3/#L15-16">딤전 3:15-16</a>)</h2><p>“그분은 사람으로 이 세상에 오셨고”에서 “그분”은 하느님을 가리킵니다. 바로 앞에서 “<strong>하느님의 집</strong>은 <strong>살아 계신 하느님의 교회</strong>”라고 하느님에 관해 말하고 있기 때문입니다. 그리고 여기서 하느님이라 불리는 분이 바로 예수 그리스도이심은 뒤따르는 말에서 분명해집니다. 사람의 몸으로 나타나 천사들에게 보이신 분은 성부가 아니라 성자, 곧 예수 그리스도이시고(성부 하느님께서는 보이지 않으십니다), 영광 가운데 승천하신 분도 성자이시기 때문입니다:</p><blockquote><p>“만일 내가 지체하면 너로 하여금 <strong>하나님의 집</strong>에서 어떻게 행하여야 할지를 알게 하려 함이니 이 집은 <strong>살아 계신 하나님의 교회</strong>요 진리의 기둥과 터니라 크도다 경건의 비밀이여, 그렇지 않다 하는 이 없도다 <strong>그는 육신으로 나타난 바 되시고</strong> 영으로 의롭다 하심을 받으시고 <strong>천사들에게 보이시고</strong> 만국에서 전파되시고 세상에서 믿은 바 되시고 <strong>영광 가운데서 올려지셨느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1tim/3/#L15-16">딤전 3:15-16</a>) <em>(비잔틴 본문(다수 사본)에는 θεὸς ἐφανερώθη ἐν σαρκί — “<strong>하느님께서</strong> 육신으로 나타나셨고”라고 되어 있습니다.)</em></p></blockquote><blockquote><p>“ἐὰν δὲ βραδύνω, ἵνα εἰδῇς πῶς δεῖ ἐν οἴκῳ θεοῦ ἀναστρέφεσθαι, ἥτις ἐστὶν ἐκκλησία θεοῦ ζῶντος, στῦλος καὶ ἑδραίωμα τῆς ἀληθείας. καὶ ὁμολογουμένως μέγα ἐστὶν τὸ τῆς εὐσεβείας μυστήριον· <strong>Ὃς ἐφανερώθη ἐν σαρκί</strong>, ἐδικαιώθη ἐν πνεύματι, <strong>ὤφθη ἀγγέλοις</strong>, ἐκηρύχθη ἐν ἔθνεσιν, ἐπιστεύθη ἐν κόσμῳ, <strong>ἀνελήμφθη ἐν δόξῃ</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/1tim/3/#L15-16">딤전 3:15-16</a>)</p></blockquote><h2>하느님이시며 주님이신 예수 그리스도 (<a href="https://bibleox.com/ko/ko-nkrv/2tim/4/#L1">딤후 4:1</a>, <a href="https://bibleox.com/ko/ko-nkrv/2pet/1/#L1">벧후 1:1</a>)</h2><p>이 구절에서 예수께서는 하느님이자 그리스도라고 불리십니다(“그리스도”는 그리스어로 “기름부음받은 이”라는 뜻이며, 기다리던 세상의 구세주를 가리키는 칭호입니다: <a href="https://bibleox.com/ko/ko-nkrv/act/2/#L36">행 2:36</a>). 그리스어 원문은 문자 그대로 “하느님과 그리스도 예수 앞에서”(τοῦ θεοῦ καὶ Χριστοῦ Ἰησοῦ)입니다.</p><p>여기서 두 분, 곧 하느님과 예수 그리스도를 말하는 것이라고 반론할 수 있습니다. 그러나 이 반론은 타당하지 않습니다. 두 낱말이 하나의 관사 τοῦ(속격 정관사)를 공유하므로, 둘 다 같은 한 인격, 곧 예수를 가리키기 때문입니다. 또한 뒤이어 나오는 τοῦ μέλλοντος(“장차 … 하실 분”)는 단수로서, 앞에서 한 분에 관해 말하고 있음을 덧붙여 보여 줍니다:</p><blockquote><p>“<strong>하나님 앞과</strong> 살아 있는 자와 죽은 자를 심판하실 그리스도 예수 앞에서 그가 나타나실 것과 그의 나라를 두고 엄히 명하노니” (<a href="https://bibleox.com/ko/ko-nkrv/2tim/4/#L1">딤후 4:1</a>)</p></blockquote><blockquote><p>“Διαμαρτύρομαι ἐνώπιον <strong><u>τοῦ</u> θεοῦ <u>καὶ</u> Χριστοῦ Ἰησοῦ</strong>, τοῦ μέλλοντος κρίνειν ζῶντας καὶ νεκρούς, καὶ τὴν ἐπιφάνειαν αὐτοῦ καὶ τὴν βασιλείαν αὐτοῦ·” (<a href="https://bibleox.com/ko/gr-lxx-byz/2tim/4/#L1">딤후 4:1</a>)</p></blockquote><p>다음은 하나의 공통 관사를 가진 비슷한 문법 구조입니다:</p><blockquote><p>“우리 주 예수 그리스도의 <strong>아버지 하나님</strong>을 찬송하리로다 그의 많으신 긍휼대로 예수 그리스도를 죽은 자 가운데서 부활하게 하심으로 말미암아 우리를 거듭나게 하사 산 소망이 있게 하시며” (<a href="https://bibleox.com/ko/ko-nkrv/1pet/1/#L3">벧전 1:3</a>)</p></blockquote><blockquote><p>“Εὐλογητὸς <strong><u>ὁ</u> θεὸς <u>καὶ</u> πατὴρ</strong> τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὁ κατὰ τὸ πολὺ αὐτοῦ ἔλεος ἀναγεννήσας ἡμᾶς εἰς ἐλπίδα ζῶσαν δι᾿ ἀναστάσεως Ἰησοῦ Χριστοῦ ἐκ νεκρῶν” (<a href="https://bibleox.com/ko/gr-lxx-byz/1pet/1/#L3">벧전 1:3</a>)</p></blockquote><p>여기서 “하느님과 아버지”라는 두 낱말은 하나의 공통 관사 ὁ(주격 정관사)를 가지므로, 서로 다른 두 인격이 아니라 한 인격을 묘사합니다.</p><p>그리스도께서 하느님이라 불리시는 다음 구조도 같은 규칙을 따릅니다:</p><blockquote><p>“예수 그리스도의 종이며 사도인 시몬 베드로는 <strong>우리 하나님과 구주 예수 그리스도</strong>의 의를 힘입어 동일하게 보배로운 믿음을 우리와 함께 받은 자들에게 편지하노니” (<a href="https://bibleox.com/ko/ko-nkrv/2pet/1/#L1">벧후 1:1</a>)</p></blockquote><blockquote><p>“Συμεὼν Πέτρος δοῦλος καὶ ἀπόστολος Ἰησοῦ Χριστοῦ τοῖς ἰσότιμον ἡμῖν λαχοῦσιν πίστιν ἐν δικαιοσύνῃ <strong><u>τοῦ</u> θεοῦ</strong> ἡμῶν <strong>καὶ σωτῆρος Ἰησοῦ Χριστοῦ</strong>·” (<a href="https://bibleox.com/ko/gr-lxx-byz/2pet/1/#L1">벧후 1:1</a>)</p></blockquote><h2>복음사가 누가는 그리스도를 하느님이라 부릅니다 (<a href="https://bibleox.com/ko/ko-nkrv/lk/8/#L39">눅 8:39</a>)</h2><p>복음사가 누가가 기록한 구절을 살펴봅시다. 인용문의 앞부분은 예수 그리스도의 말씀이고, 뒷부분은 서술자, 곧 복음사가 누가의 말입니다. 그리스도께서는 고침을 받은 사람에게 하느님께서 해 주신 일을 전하라고 보내시는데, 복음사가 누가는 고침을 받은 사람이 예수께서 해 주신 일을 알렸다고 기록합니다. 곧 복음사가 누가의 이해로는 여기서 예수와 하느님은 같은 분이십니다:</p><blockquote><p>“집으로 돌아가 <strong>하나님이 네게 어떻게 큰 일을 행하셨는지를</strong> 말하라 하시니 그가 가서 <strong>예수께서 자기에게 어떻게 큰 일을 행하셨는지를</strong> 온 성내에 전파하니라” (<a href="https://bibleox.com/ko/ko-nkrv/lk/8/#L39">눅 8:39</a>)</p></blockquote><blockquote><p>“Ὑπόστρεφε εἰς τὸν οἶκόν σου, καὶ διηγοῦ ὅσα σοι <strong>ἐποίησεν ὁ θεός</strong>. καὶ ἀπῆλθεν καθ᾿ ὅλην τὴν πόλιν κηρύσσων ὅσα <strong>ἐποίησεν</strong> αὐτῷ <strong>ὁ Ἰησοῦς</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/lk/8/#L39">눅 8:39</a>)</p></blockquote><p>그리스도를 하느님으로 믿는 믿음의 반대자들은 복음사가 누가가 고침을 받은 사람의 행동을 묘사했을 뿐이라고 반론할지 모릅니다. 예수께서는 하느님께서 하신 일을 전하라고 명하셨는데, 고침을 받은 사람이 잘못 알아듣고 하느님이 아니라 예수께서 하신 일을 전했다는 것입니다. 그러나 이들 반대자는 복음사가 누가도 그리스도의 신성을 반대한 사람, 곧 누가도 그리스도를 하느님으로 여기지 않았다고 본다는 점을 알아야 합니다. 그렇다면 복음사가는 고침을 받은 사람이 예수께서 시키신 일과 전혀 다른 일을 했다는 잘못을 틀림없이 어떻게든 지적했을 것입니다. 적어도 “그러나” 같은 접속사를 써서 “<em>예수께서는 돌아가서 하느님께서 하신 일을 전하라고 하셨다.</em> <strong><em><u>그러나</u></em></strong> <em>그는 가서 예수께서 하신 일을 전하였다</em>”라고 썼을 것입니다. 더 나아가, 고침을 받은 사람이 잘못해서 예수를 하느님으로 여겼기 때문에 하느님이 아니라 예수를 전하였다고 분명히 말했을 것입니다. 이것은 사소한 일이 아니라 믿음의 기초입니다.</p><p>그러나 복음사가는 아무런 대조도 하지 않습니다. 오히려 같은 구조를 되풀이합니다: “하느님께서 베풀어 주신 … 예수께서 해 주신”(그리스어로는 두 번 다 ἐποίησεν입니다). 이것은 복음사가가 그리스도의 신성을 믿었다는 무게 있는 증거입니다.</p><h2>그리스도 안에는 하느님의 완전한 신성이 깃들어 있습니다 (<a href="https://bibleox.com/ko/ko-nkrv/kol/2/#L6,9">골 2:6,9</a>)</h2><p>이 구절은 물론 여러 가지로 해석될 수 있지만, 다른 구절들에 더하여 주목할 만합니다:</p><blockquote><p>“그러므로 너희가 그리스도 예수를 주로 받았으니 그 안에서 행하되 &lt;…&gt; <strong>그 안에는 신성의 모든 충만이 육체로 거하시고</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/kol/2/#L6,9">골 2:6,9</a>)</p></blockquote><blockquote><p>“Ὡς οὖν παρελάβετε τὸν Χριστὸν Ἰησοῦν τὸν κύριον, ἐν αὐτῷ περιπατεῖτε, &lt;…&gt; ὅτι ἐν αὐτῷ κατοικεῖ πᾶν <strong>τὸ πλήρωμα τῆς θεότητος σωματικῶς</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/kol/2/#L6,9">골 2:6,9</a>)</p></blockquote><h2>사도들은 사람들에게 그리스도를 하느님으로 전합니다 (<a href="https://bibleox.com/ko/ko-nkrv/act/17/#L3,23">행 17:3,23</a>)</h2><blockquote><p>“뜻을 풀어 그리스도가 해를 받고 죽은 자 가운데서 다시 살아나야 할 것을 증언하고 이르되 <strong><mark>내가 너희에게 전하는 이 예수가</mark></strong> 곧 그리스도라 하니 &lt;…&gt; 내가 두루 다니며 너희가 위하는 것들을 보다가 알지 못하는 신에게라고 새긴 <strong>단</strong>도 보았으니 그런즉 너희가 알지 못하고 위하는 그것을 <strong><mark>내가 너희에게 알게 하리라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/act/17/#L3,23">행 17:3,23</a>) <em>(“전하고 있는”과 “알려 드리겠습니다”는 그리스어 원문에서 같은 동사 καταγγέλλω입니다. “신”은 θεός입니다.)</em></p></blockquote><h2>하느님께서 사람이 되셨습니다 (<a href="https://bibleox.com/ko/ko-nkrv/in/1/#L1-18">요 1:1-18</a>)</h2><p>사도 요한은 말씀을 하느님이라 부르고, 이어서 그 말씀이 사람이 되셨다고 말합니다. 예언자 세례 요한이 가리킨 분은 바로 사람이 되신 그 말씀이며, 그가 가리킨 분은 예수 그리스도이십니다:</p><blockquote><p>“태초에 말씀이 계시니라 이 말씀이 하나님과 함께 계셨으니 <strong>이 말씀은 곧 하나님이시니라</strong> 그가 태초에 하나님과 함께 계셨고 만물이 그로 말미암아 지은 바 되었으니 지은 것이 하나도 그가 없이는 된 것이 없느니라 &lt;…&gt; <strong>말씀이 육신이 되어</strong> 우리 가운데 거하시매 우리가 그의 영광을 보니 <strong>아버지의 독생자</strong>의 영광이요 은혜와 진리가 충만하더라 요한이 그에 대하여 증언하여 외쳐 이르되 내가 전에 말하기를 내 뒤에 오시는 이가 나보다 앞선 것은 나보다 먼저 계심이라 한 것이 이 사람을 가리킴이라 하니라 &lt;…&gt; 본래 하나님을 본 사람이 없으되 아버지 품 속에 있는 독생하신 하나님이 나타내셨느니라” (<a href="https://bibleox.com/ko/ko-nkrv/in/1/#L1-3,14-15,18">요 1:1-3,14-15,18</a>) <em>(“하느님과 똑같은 분이셨다”는 그리스어 원문에서 θεὸς ἦν ὁ λόγος — “<strong>말씀은 하느님이셨다</strong>”입니다.)</em></p></blockquote><p>사도는 여기서 그리스도를 단순히 성부의 아들이 아니라 외아들(독생자)이라고 부릅니다. 이는 그리스도처럼 성부의 아들인 분은 아무도 없다는 뜻입니다. 맏아들(먼저 태어난 이)이 아니라 외아들(오직 하나뿐인 아들)입니다. 다른 아들은 없습니다.</p><p><strong>“맏아들”에 관한 반론</strong></p><p>그리스도를 하느님으로 믿는 가르침의 반대자들은 다른 두 곳에서 그리스도가 맏아들로도 불린다고 반론할 것입니다:</p><blockquote><p>“하나님이 미리 아신 자들을 또한 그 아들의 형상을 본받게 하기 위하여 미리 정하셨으니 이는 그로 <strong>많은 형제 중에서 맏아들이 되게</strong> 하려 하심이니라” (<a href="https://bibleox.com/ko/ko-nkrv/rim/8/#L29">롬 8:29</a>)</p></blockquote><blockquote><p>“또 그가 <strong>맏아들</strong>을 이끌어 세상에 다시 들어오게 하실 때에 하나님의 모든 천사들은 그에게 경배할지어다 말씀하시며” (<a href="https://bibleox.com/ko/ko-nkrv/evr/1/#L6">히 1:6</a>)</p></blockquote><p>이에 대해서는 이렇게 말해야 합니다. 그리스도께서 맏아들이라 불리시는 것은 죽은 자들 가운데서 맨 먼저 부활하셨기 때문입니다. 나중에 다시 죽는 그런 부활이 아니라(그런 부활은 전에 예언자들도 일으켰습니다), 죽음을 이기신 분으로서 변모한 모습으로 부활하시어 영원히 사시고(<a href="https://bibleox.com/ko/ko-nkrv/rim/6/#L9">롬 6:9</a>), 영원히 다스리시려고 영광 가운데 하늘에 오르셨습니다. 그리스도 이전에는 아무도 이렇게 부활하지 못했습니다. 그분께서 처음으로 이렇게 부활하셨습니다. 곧 죽은 이들 가운데서 맏아들, 첫 열매로 나타나셨습니다:</p><blockquote><p>“그는 몸인 교회의 머리시라 그가 근본이시요 <strong>죽은 자들 가운데서 먼저 나신 이시니</strong> 이는 친히 만물의 으뜸이 되려 하심이요” (<a href="https://bibleox.com/ko/ko-nkrv/kol/1/#L18">골 1:18</a>)</p></blockquote><blockquote><p>“또 충성된 증인으로 <strong>죽은 자들 가운데에서 먼저 나시고</strong> 땅의 임금들의 머리가 되신 예수 그리스도로 말미암아 은혜와 평강이 너희에게 있기를 원하노라 우리를 사랑하사 그의 피로 우리 죄에서 우리를 해방하시고” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/1/#L5">계 1:5</a>)</p></blockquote><blockquote><p>“곧 그리스도가 고난을 받으실 것과 <strong>죽은 자 가운데서 먼저 다시 살아나사</strong> 이스라엘과 이방인들에게 빛을 전하시리라 함이니이다 하니라” (<a href="https://bibleox.com/ko/ko-nkrv/act/26/#L23">행 26:23</a>)</p></blockquote><p>그 밖의 인용구: <a href="https://bibleox.com/ru/ru/w/Христос-Единородный-Сын-Божий">그리스도 — 하느님의 외아들</a></p><h2>시편에서 하느님에 관해 하신 말씀이 성자에 관해 하신 말씀입니다 (<a href="https://bibleox.com/ko/ko-nkrv/evr/1/#L8-12">히 1:8-12</a>)</h2><p>사도는 예언적인 시편을 그리스도께 적용하며, 그 말씀은 성자에 관해 하신 것이라고 말합니다:</p><ol><li><p>성자는 하느님이십니다.</p></li><li><p>성자께서 하늘과 땅을 세우셨습니다.</p></li><li><p>하느님께서 하느님이신 성자에게 기름을 부으셨습니다(그리스어 Χριστός — 기름부음받은 이).</p></li></ol><blockquote><p>“<strong>아들에 관하여는</strong> <strong>하나님이여 주의 보좌는 영영하며</strong> 주의 나라의 규는 공평한 규이니이다 주께서 의를 사랑하시고 불법을 미워하셨으니 그러므로 <strong>하나님 곧 주의 하나님이</strong> 즐거움의 기름을 주께 부어 주를 동류들보다 뛰어나게 하셨도다 하였고 또 <strong>주여 태초에 주께서 땅의 기초를 두셨으며 하늘도 주의 손으로 지으신 바라</strong> 그것들은 멸망할 것이나 오직 주는 영존할 것이요 그것들은 다 옷과 같이 낡아지리니 의복처럼 갈아입을 것이요 그것들은 옷과 같이 변할 것이나 주는 여전하여 연대가 다함이 없으리라 하였으나” (<a href="https://bibleox.com/ko/ko-nkrv/evr/1/#L8-12">히 1:8-12</a>) <em>(앞부분은 <a href="https://bibleox.com/ko/ko-nkrv/ps/45/#L6-7">시 45:6-7</a>을 인용한 것으로, 히브리어에서 “하느님”은 אֱלֹהִים(엘로힘)입니다.)</em></p></blockquote><p>그리스도를 하느님으로 믿는 믿음의 반대자들은 여기서 하느님이 일반적인 히브리어 낱말 엘로힘으로 불렸을 뿐이고, 이 말은 참 하느님에게도 거짓 신들에게도 쓰였다고 반론할 것입니다. 그들은 하느님이 네 글자 이름(테트라그람마톤) <strong>יְהוָֽה (YHWH, 야훼)</strong>로 표시되기를 요구할 것입니다. 사도가 인용하는 두 번째 시편(<a href="https://bibleox.com/ko/ko-nkrv/ps/102/#L25-27">시 102:25-27</a>)은 이 요구를 충족합니다. 이 시편 전체가 <strong>하느님(יְהוָֽה, YHWH)</strong>께 드리는 말씀이며, 하느님은 여기서 “야훼”라는 이름으로 불리십니다(<a href="https://bibleox.com/ko/ko-nkrv/ps/102/#L1">시 102:1</a>, <a href="https://bibleox.com/ko/ko-nkrv/ps/102/#L19">시 102:19</a>, <a href="https://bibleox.com/ko/ko-nkrv/ps/102/#L22">시 102:22</a>). 히브리어 본문의 시편 표제도 “기운이 다하여 야훼 앞에 근심을 쏟아 놓는 고통받는 이의 기도”입니다. 이처럼 사도가 인용한 구절을 포함한 이 시편 전체가 하느님께 드리는 기도이고, 거기서 하느님은 그들이 바라는 대로 야훼라 불리십니다. 그런데 사도는 이 말씀이 성자에 관해 하신 것이라고 합니다. 곧 야훼는 성자, 예수 그리스도이십니다.</p><h2>하느님은 구세주이시고, 예수 그리스도는 구세주이십니다 (<a href="https://bibleox.com/ko/ko-nkrv/tit/1/#L3-4">딛 1:3-4</a>)</h2><blockquote><p>“자기 때에 자기의 말씀을 전도로 나타내셨으니 이 전도는 <strong>우리 구주 하나님</strong>이 명하신 대로 내게 맡기신 것이라 같은 믿음을 따라 나의 참 아들 된 디도에게 편지하노니 하나님 아버지와 <strong>그리스도 예수 우리 구주</strong>로부터 은혜와 평강이 네게 있을지어다” (<a href="https://bibleox.com/ko/ko-nkrv/tit/1/#L3-4">딛 1:3-4</a>)</p></blockquote><blockquote><p>“복스러운 소망과 <strong>우리의 크신 하나님 구주 예수 그리스도</strong>의 영광이 나타나심을 기다리게 하셨으니” (<a href="https://bibleox.com/ko/ko-nkrv/tit/2/#L13">딛 2:13</a>) <em>(그리스어 원문은 τοῦ μεγάλου θεοῦ καὶ σωτῆρος ἡμῶν Ἰησοῦ Χριστοῦ — 하나의 관사로 묶인 “<strong>우리의 위대하신 하느님이시며 구세주이신 예수 그리스도</strong>”입니다.)</em></p></blockquote><h2>예수는 구약의 하느님과 같은 하느님이십니다 (<a href="https://bibleox.com/ko/ko-nkrv/mf/23/#L34">마 23:34</a>, <a href="https://bibleox.com/ko/ko-nkrv/ier/7/#L21,25">렘 7:21,25</a>)</h2><p>그리스도를 하느님으로 믿는 믿음의 반대자들은 사도들이 그리스도를 문자 그대로 하느님이라 부른다는 것을 보면 “하느님이라 불리는 것만으로는 부족하다”고 반론합니다. 예언자 모세도 하느님이라 불렸다는 것입니다:</p><blockquote><p>“여호와께서 모세에게 이르시되 볼지어다 <strong>내가 너를 바로에게 신 같이 되게 하였은즉</strong> 네 형 아론은 네 대언자가 되리니” (<a href="https://bibleox.com/ko/ko-nkrv/ish/7/#L1">출 7:1</a>) <em>(“신 같이”는 히브리어 원문에서 נְתַתִּיךָ אֱלֹהִים לְפַרְעֹה — “내가 너를 파라오에게 <strong>하느님(엘로힘)으로</strong> 세웠다”입니다.)</em></p></blockquote><blockquote><p>“καὶ εἶπεν κύριος πρὸς Μωυσῆν λέγων Ἰδοὺ δέδωκά σε <strong>θεὸν</strong> Φαραω, καὶ Ααρων ὁ ἀδελφός σου ἔσται σου προφήτης·” (<a href="https://bibleox.com/ko/gr-lxx-byz/ish/7/#L1">출 7:1</a>)</p></blockquote><p>첫째, 여기서는 비판자들 자신이 앞서 내세운 요구, 곧 “하느님”이라는 말에 관사가 있어야 한다는 요구가 충족되지 않습니다. 여기에는 관사가 없습니다. 실제로 본문을 보면 예언자 모세는 파라오에 대하여 주어진 역할을 맡았을 뿐입니다. 모세가 본성으로 신이며 신성을 자기의 변함없는 속성으로 지녔다는 것을 보여 주는 내용은 아무것도 없습니다. 또한 비판자들이 우리의 논거에 내세우는 둘째 요구도 충족되지 않습니다. 히브리어 본문에도 여기에는 테트라그람마톤 YHWH가 아니라 일반적인 낱말 אֱלֹהִ֖ים(엘로힘)이 있습니다. 곧 최고의 의미에서 참 하느님을 말하는 것이 아닙니다.</p><p>둘째, 예수 그리스도께서 바로 그 참 하느님, 곧 창조주이시며 야훼이시고 조상들(아브라함, 이삭, 야곱)의 하느님이심은 사도들의 다른 말씀으로 확실히 알 수 있습니다. 예를 들어 그리스도께서는 친히 이스라엘에 예언자들을 보낸 분이 당신이라고 말씀하시는데, 구약에서는 모든 예언자를 보내신 분이 하느님 야훼라고 합니다. 여기에서도 그리스도께서 사람이 되신 하느님 야훼이심이 바로 나옵니다. 다른 예는 아래에 있습니다.</p><h3>예언자를 보내신 분은 하느님뿐이신데, 그리스도께서 예언자를 보내셨습니다</h3><p>그리스도께서는 친히 이스라엘에 예언자들을 보내시는 분이 당신이라고 말씀하십니다:</p><blockquote><p>“그러므로 <strong>내가 너희에게 선지자들과 지혜 있는 자들과 서기관들을 보내매</strong> 너희가 그 중에서 더러는 죽이거나 십자가에 못 박고 그 중에서 더러는 너희 회당에서 채찍질하고 이 동네에서 저 동네로 따라다니며 박해하리라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/23/#L34">마 23:34</a>)</p></blockquote><p>하느님께서는 친히(중개자 없이) 예언자들에게 말씀하시고 그들을 보내십니다:</p><blockquote><p>“<strong>만군의 여호와</strong> 이스라엘의 하나님께서 이와 같이 말씀하시되 너희 희생제물과 번제물의 고기를 아울러 먹으라 &lt;…&gt; 너희 조상들이 애굽 땅에서 나온 날부터 오늘까지 <strong>내가 내 종 선지자들을 너희에게 보내되 끊임없이 보내었으나</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ier/7/#L21,25">렘 7:21,25</a>) <em>(“야훼”는 히브리어 원문에서 יְהוָה(YHWH)입니다.)</em></p></blockquote><blockquote><p>“하나님이 이르시되 내가 반드시 너와 함께 있으리라 네가 그 백성을 애굽에서 인도하여 낸 후에 너희가 이 산에서 하나님을 섬기리니 이것이 <strong>내가 너를 보낸</strong> 증거니라” (<a href="https://bibleox.com/ko/ko-nkrv/ish/3/#L12">출 3:12</a>)</p></blockquote><blockquote><p>“만군의 여호와가 이르노라 보라 용광로 불 같은 날이 이르리니 교만한 자와 악을 행하는 자는 다 지푸라기 같을 것이라 그 이르는 날에 그들을 살라 그 뿌리와 가지를 남기지 아니할 것이로되 &lt;…&gt; 보라 여호와의 크고 두려운 날이 이르기 전에 <strong>내가 선지자 엘리야를 너희에게 보내리니</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mal/4/#L1,5">말 4:1,5</a>)</p></blockquote><blockquote><p>“<strong>여호와께서 이스라엘 자손에게 한 선지자를 보내시니</strong> 그가 그들에게 이르되 여호와께서 이같이 말씀하시기를 이스라엘의 하나님 내가 너희를 애굽에서 인도하여 내며 너희를 그 종 되었던 집에서 나오게 하여” (<a href="https://bibleox.com/ko/ko-nkrv/sud/6/#L8">삿 6:8</a>)</p></blockquote><blockquote><p>“그러므로 <strong>여호와께서</strong> 아마샤에게 진노하사 <strong>한 선지자를 그에게 보내시니</strong> 그가 이르되 저 백성의 신들이 그들의 백성을 왕의 손에서 능히 구원하지 못하였거늘 왕은 어찌하여 그 신들에게 구하나이까 하며” (<a href="https://bibleox.com/ko/ko-nkrv/2par/25/#L15">대하 25:15</a>)</p></blockquote><blockquote><p>“사무엘이 사울에게 이르되 <strong>여호와께서 나를 보내어</strong> 왕에게 기름을 부어 그의 백성 이스라엘 위에 왕으로 삼으셨은즉” (<a href="https://bibleox.com/ko/ko-nkrv/1ts/15/#L1">삼상 15:1</a>)</p></blockquote><blockquote><p>“<strong>여호와께서 나단을 다윗에게 보내시니</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2ts/12/#L1">삼하 12:1</a>)</p></blockquote><blockquote><p>“여호와께서 그를 사랑하사 <strong>선지자 나단을 보내</strong> 그의 이름을 여디디야라 하시니 이는 여호와께서 사랑하셨기 때문이더라” (<a href="https://bibleox.com/ko/ko-nkrv/2ts/12/#L24-25">삼하 12:24-25</a>)</p></blockquote><blockquote><p>“<strong>나는 나의 종 예언자들을 너희에게 보냈다.</strong> 그러나 너희는 그들을 잡아 죽이고 그들의 몸을 찢었다. 나는 그들의 피를 너희에게서 찾으리라. 주님의 말씀이다” (<a href="https://bibleox.com/ko/en-nrsv/3ezd/1/#L32">3에스 1:32</a>, 영어 번역(NRSV)에서 옮김)</p></blockquote><h2>유다인들은 예언자 모세 때에 광야에서 그리스도를 시험하였습니다 (<a href="https://bibleox.com/ko/ko-nkrv/1kor/10/#L9">고전 10:9</a>, <a href="https://bibleox.com/ko/ko-nkrv/ps/95/#L6-9">시 95:6-9</a>)</h2><blockquote><p>“그들 가운데 <strong>어떤 사람들이 주를 시험하다가 뱀에게 멸망하였나니</strong> 우리는 그들과 같이 시험하지 말자” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/10/#L9">고전 10:9</a>) <em>(“주님”은 그리스어 원문에서 τὸν Χριστόν — “<strong>그리스도를</strong>”입니다. 비잔틴 본문도 같습니다.)</em></p></blockquote><p>광야에서 유다인들이 시험한 분은 바로 하느님, 창조주이셨습니다. 그러므로 그리스도께서는 그들이 시험한 바로 그 하느님이십니다:</p><blockquote><p>“오라 우리가 굽혀 경배하며 <strong>우리를 지으신 여호와</strong> 앞에 무릎을 꿇자 <strong>그는 우리의 하나님이시요</strong> 우리는 그가 기르시는 백성이며 그의 손이 돌보시는 양이기 때문이라 너희가 오늘 그의 음성을 듣거든 너희는 므리바에서와 같이 또 광야의 맛사에서 지냈던 날과 같이 너희 마음을 완악하게 하지 말지어다 그 때에 너희 조상들이 내가 행한 일을 보고서도 <strong>나를 시험하고 조사하였도다</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ps/95/#L6-9">시 95:6-9</a>)</p></blockquote><h2>고대 사본[1]</h2><ol><li><p><strong>유다 5절.</strong> 오늘날의 많은 본문에는 “주님께서 백성을 에집트 땅에서 구해 내신 뒤 믿지 않은 자들을 멸망시키셨다”고 되어 있습니다. 개역개정도 “주께서”로 옮겼습니다(<a href="https://bibleox.com/ko/ko-nkrv/iud/1/#L5">유 1:5</a>). 사도 유다의 편지를 담은 가장 오래된 파피루스 <a href="https://en.wikipedia.org/wiki/Papyrus_72">p72</a>(3세기)에는 “<a href="http://earlynewtestament.com/papyrus72.htm"><strong><em>하느님 그리스도</em></strong><em> (Theos Christos)</em></a>께서 백성을 에집트 땅에서 구해 내신 뒤 믿지 않은 자들을 멸망시키셨다”고 되어 있습니다. <em>(최신 비평 본문 NA28에도 Ἰησοῦς — “<strong>예수께서</strong>”로 되어 있습니다.)</em></p></li><li><p><strong>골로 2:2.</strong> 비잔틴 본문과 러시아어 시노드 역본의 끝부분은 “하느님 아버지와 그리스도의 신비”(τοῦ θεοῦ καὶ πατρὸς καὶ τοῦ Χριστοῦ)입니다. 그러나 사도 바울의 편지를 전하는 가장 오래된 파피루스 <a href="https://en.wikipedia.org/wiki/Papyrus_46">p46</a>(2세기 말)에는 “<strong>하느님 그리스도</strong>(tou Theou Christou)의 신비”라고 되어 있습니다. 공동번역의 “하느님의 심오한 진리인 그리스도”도 이 오래된 읽기에 가깝습니다(<a href="https://bibleox.com/ko/ko-nkrv/kol/2/#L2">골 2:2</a>).</p></li><li><p><strong>2베드 1:2.</strong> 오늘날의 본문은 “하느님과 우리 주 예수를 알게 됨으로써”입니다(<a href="https://bibleox.com/ko/ko-nkrv/2pet/1/#L2">벧후 1:2</a>). 그러나 이 편지의 가장 오래된 사본에는 “<strong>하느님 예수</strong>(tou Theou Iesou), 우리 주님을 알게 됨으로써”라고 되어 있습니다.</p></li><li><p><strong>요한 1:18.</strong> 비잔틴 본문과 러시아어 시노드 역본은 “아버지의 품안에 계신 외아들”(ὁ μονογενὴς υἱός)입니다. 그러나 요한 복음서의 가장 이른 사본인 파피루스 <a href="https://en.wikipedia.org/wiki/Papyrus_75">p75</a>(3세기 중엽)와 <a href="https://en.wikipedia.org/wiki/Papyrus_66">p66</a>(2세기 말)에는 “<strong>외아드님이신 하느님</strong>(μονογενὴς θεός), 아버지의 품안에 계신 분”이라고 되어 있습니다. 리옹의 성 이레네오스도 이 구절을 같은 형태로 인용합니다.</p></li></ol><h2>그리스도는 두 세계, 곧 하느님의 세계와 사람의 세계에 사시는 분이십니다</h2><p>하느님과 사람 양쪽에 손을 얹어 줄 중재자는 없습니다. 이 두 세계는 서로 닿지 않고, 어떤 것으로도 누구로도 이어져 있지 않기 때문입니다:</p><blockquote><p>“<strong>우리 사이에 손을 얹을 판결자도 없구나</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/iov/9/#L33">욥 9:33</a>)</p></blockquote><p>예수 그리스도(창조되지 않은 하느님이시며 창조된 사람이신 분)께서는 당신 자신으로 이 두 세계를 이으십니다:</p><blockquote><p>“하나님은 한 분이시요 또 <strong>하나님과 사람 사이에 중보자도 한 분이시니</strong> 곧 사람이신 그리스도 예수라” (<a href="https://bibleox.com/ko/ko-nkrv/1tim/2/#L5">딤전 2:5</a>)</p></blockquote><h2>구약과의 평행 구절</h2><h3>그리스도는 하느님과 똑같이 왕 중의 왕, 주 중의 주이십니다</h3><p>예언자들은 하느님을 주 중의 주라고 부릅니다:</p><blockquote><p>“신들 중에 뛰어난 하나님께 감사하라 그 인자하심이 영원함이로다 <strong>주들 중에 뛰어난 주께</strong> 감사하라 그 인자하심이 영원함이로다” (<a href="https://bibleox.com/ko/ko-nkrv/ps/136/#L2-3">시 136:2-3</a>)</p></blockquote><p>사도들은 하느님을 주 중의 주, 왕 중의 왕이라고 부릅니다:</p><blockquote><p>“기약이 이르면 하나님이 그의 나타나심을 보이시리니 하나님은 복되시고 유일하신 주권자이시며 <strong>만왕의 왕이시며 만주의 주시요</strong> 오직 그에게만 죽지 아니함이 있고 가까이 가지 못할 빛에 거하시고 어떤 사람도 보지 못하였고 또 볼 수 없는 이시니 그에게 존귀와 영원한 권능을 돌릴지어다 아멘” (<a href="https://bibleox.com/ko/ko-nkrv/1tim/6/#L15-16">딤전 6:15-16</a>)</p></blockquote><p>사도들은 예수 그리스도를 주 중의 주, 왕 중의 왕이라고 부릅니다:</p><blockquote><p>“그들이 어린 양과 더불어 싸우려니와 어린 양은 <strong>만주의 주시요 만왕의 왕이시므로</strong> 그들을 이기실 터이요 또 그와 함께 있는 자들 곧 부르심을 받고 택하심을 받은 진실한 자들도 이기리로다” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/17/#L14">계 17:14</a>)</p></blockquote><blockquote><p>“그 옷과 그 다리에 이름을 쓴 것이 있으니 <strong>만왕의 왕이요 만주의 주</strong>라 하였더라” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/19/#L16">계 19:16</a>)</p></blockquote><h3>그리스도는 하느님처럼 전능하신 분이십니다</h3><p>하느님은 전능하신 분이십니다:</p><blockquote><p>“볼지어다 하나님께 징계 받는 자에게는 복이 있나니 그런즉 너는 <strong>전능자</strong>의 징계를 업신여기지 말지니라” (<a href="https://bibleox.com/ko/ko-nkrv/iov/5/#L17">욥 5:17</a>; <a href="https://bibleox.com/ko/ko-nkrv/otkr/15/#L3">계 15:3</a>)</p></blockquote><p>그리스도는 전능하신 분이십니다:</p><blockquote><p>“<strong>주 하나님이</strong> 이르시되 <strong>나는 알파와 오메가라</strong> 이제도 있고 전에도 있었고 장차 올 자요 <strong>전능한 자라</strong> 하시더라” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/1/#L8">계 1:8</a>) <em>(이 구절의 말씀은 뒤의 <a href="https://bibleox.com/ko/ko-nkrv/otkr/1/#L17-18">계 1:17-18</a>과 <a href="https://bibleox.com/ko/ko-nkrv/otkr/22/#L13">계 22:13</a>에서 그리스도의 말씀으로 이어집니다.)</em></p></blockquote><blockquote><p>“이는 하나님의 영광의 광채시요 그 본체의 형상이시라 <strong>그의 능력의 말씀으로 만물을 붙드시며</strong> 죄를 정결하게 하는 일을 하시고 높은 곳에 계신 지극히 크신 이의 우편에 앉으셨느니라” (<a href="https://bibleox.com/ko/ko-nkrv/evr/1/#L3">히 1:3</a>)</p></blockquote><p>같은 책의 뒷부분에서 하느님은 전능하신 분이라 불리십니다:</p><blockquote><p>“하나님의 종 모세의 노래, 어린 양의 노래를 불러 이르되 <strong>주 하나님 곧 전능하신 이시여</strong> 하시는 일이 크고 놀라우시도다 <strong>만국의 왕이시여</strong> 주의 길이 의롭고 참되시도다” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/15/#L3">계 15:3</a>)</p></blockquote><h3>하느님께서 모든 성인과 함께 오시듯이 그리스도께서도 그러하십니다</h3><p>하느님(야훼)께서는 모든 성인과 함께 오십니다:</p><blockquote><p>“그 산 골짜기는 아셀까지 이를지라 너희가 그 산 골짜기로 도망하되 유다 왕 웃시야 때에 지진을 피하여 도망하던 것 같이 하리라 <strong>나의 하나님 여호와께서 임하실 것이요 모든 거룩한 자들이 주와 함께 하리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/zah/14/#L5">슥 14:5</a>)</p></blockquote><blockquote><p>“아담의 칠대 손 에녹이 이 사람들에 대하여도 예언하여 이르되 보라 <strong>주께서 그 수만의 거룩한 자와 함께 임하셨나니</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/iud/1/#L14">유 1:14</a>)</p></blockquote><p>그리스도께서는 모든 성인과 함께 오십니다:</p><blockquote><p>“너희 마음을 굳건하게 하시고 <strong>우리 주 예수께서 그의 모든 성도와 함께 강림하실 때에</strong> 하나님 우리 아버지 앞에서 거룩함에 흠이 없게 하시기를 원하노라” (<a href="https://bibleox.com/ko/ko-nkrv/1sol/3/#L13">살전 3:13</a>)</p></blockquote><blockquote><p>“<strong>인자가 자기 영광으로 모든 천사와 함께 올 때에</strong> 자기 영광의 보좌에 앉으리니” (<a href="https://bibleox.com/ko/ko-nkrv/mf/25/#L31">마 25:31</a>) <em>(비잔틴 본문(다수 사본)에는 “모든 <strong>거룩한</strong> 천사들”(πάντες οἱ ἅγιοι ἄγγελοι)이라고 되어 있습니다.)</em></p></blockquote><h2>창조주이시며 심판자이신 분 — 하느님</h2><ol><li><p><a href="https://bibleox.com/ru/ru/w/Христос-Творец-мира">그리스도 — 창조주</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/Христос-судья">그리스도 — 심판자</a></p></li><li><p>창조주이시며 심판자이신 분 — 하느님</p></li></ol><blockquote><p>“그가 큰 음성으로 이르되 <strong>하나님을 두려워하며</strong> 그에게 영광을 돌리라 이는 <strong>그의 심판의 시간이 이르렀음이니</strong> <strong>하늘과 땅과 바다와 물들의 근원을 만드신 이를 경배하라</strong> 하더라” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/14/#L7">계 14:7</a>)</p></blockquote><h2>무슬림이 알아 두면 좋은 구절</h2><blockquote><p>“이는 <strong>한 아기가 우리에게 났고</strong> 한 아들을 우리에게 주신 바 되었는데 그의 어깨에는 정사를 메었고 그의 이름은 기묘자라, 모사라, <strong>전능하신 하나님이라, 영존하시는 아버지라, 평강의 왕이라</strong> 할 것임이라” (<a href="https://bibleox.com/ko/ko-nkrv/is/9/#L6">사 9:6</a>)</p></blockquote><blockquote><p>“<strong>베들레헴</strong> 에브라다야 너는 유다 족속 중에 작을지라도 이스라엘을 다스릴 자가 <strong>네게서 내게로 나올 것이라</strong> <strong>그의 근본은 상고에, 영원에 있느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mih/5/#L2">미 5:2</a>)</p></blockquote><blockquote><p>“너희 조상 아브라함은 나의 때 볼 것을 즐거워하다가 보고 기뻐하였느니라 유대인들이 이르되 <strong>네가 아직 오십 세도 못되었는데 아브라함을 보았느냐</strong> <strong>예수께서</strong> 이르시되 진실로 진실로 너희에게 이르노니 <strong>아브라함이 나기 전부터 내가 있느니라</strong> 하시니” (<a href="https://bibleox.com/ko/ko-nkrv/in/8/#L56-58">요 8:56-58</a>)</p></blockquote><blockquote><p>“예수께서 이르시되 <strong>사탄이 하늘로부터 번개 같이 떨어지는 것을 내가 보았노라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/lk/10/#L18">눅 10:18</a>)</p></blockquote><blockquote><p>“배에 있는 사람들이 <strong>예수께 절하며 이르되 진실로 하나님의 아들이로소이다</strong> 하더라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/14/#L33">마 14:33</a>)</p></blockquote><blockquote><p>“<strong>예수께서</strong> 그들의 믿음을 보시고 중풍병자에게 이르시되 작은 자야 <strong>네 죄 사함을 받았느니라</strong> 하시니 어떤 서기관들이 거기 앉아서 마음에 생각하기를 이 사람이 어찌 이렇게 말하는가 신성 모독이로다 <strong>오직 하나님 한 분 외에는 누가 능히 죄를 사하겠느냐</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mk/2/#L5-7">막 2:5-7</a>)</p></blockquote><blockquote><p>“<strong>유대인들이 이로 말미암아 더욱 예수를 죽이고자 하니</strong> 이는 안식일을 범할 뿐만 아니라 <strong>하나님을 자기의 친 아버지라 하여 자기를 하나님과 동등으로 삼으심이러라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/in/5/#L18">요 5:18</a>)</p></blockquote><blockquote><p>“아버지께서 죽은 자들을 일으켜 살리심 같이 <strong>아들도 자기가 원하는 자들을 살리느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/in/5/#L21">요 5:21</a>)</p></blockquote><blockquote><p>“<strong>두세 사람이 내 이름으로 모인 곳에는 나도 그들 중에 있느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/18/#L20">마 18:20</a>) <em>(“나”는 예수 그리스도이십니다.)</em></p></blockquote>'
