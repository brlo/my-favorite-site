  references: '<ol><li><p>“<em>그러므로 이렇게 말하라고 하면서 </em><strong><em>그분께서 율법을 도움으로 주셨다</em></strong><em>고 덧붙입니다. 곧 복음의 율법을 주셨으니, 그 율법에 귀 기울이는 이들은 이렇게 말할 것입니다. </em><strong><em>이 말과 같지 아니하니, 이를 위해서는 예물을 바칠 필요가 없다</em></strong><em>. 자기 마음에서 나온 것만 말하는 자들은 거짓을 팔기 때문입니다. 그러나 하느님의 구원하는 참된 율법, 곧 복음의 계시는 땅에 사는 이들에게 도움으로 주어진 것이며 </em><strong><em>이 말과 같지 않습니다</em></strong><em>. 곧 거짓 선지자들의 말과 같지 않습니다. 또 그것을 위해 예물을 바칠 필요도 없습니다. 조금 전에 말했듯이 어떤 이들은 술사들의 거짓말을 돈을 주고 사지만, 하늘의 계시는 원하는 이들에게 (값없이) 주어지기 때문입니다</em>” (<a href="https://azbyka.ru/otechnik/Kirill_Aleksandrijskij/tolkovanie-na-proroka-isaiyu/1">알렉산드리아의 키릴로스(376-444)</a>, 이사야서 주해, 러시아어 번역에서 옮김)</p></li><li><p><a href="https://en.wikipedia.org/wiki/Sola_scriptura">https://en.wikipedia.org/wiki/Sola_scriptura</a></p></li><li><p><em>“교회에서 떨어져 나간 이들이 모두 언제나 성경을 존중한다고 말하면서도 아주 빨리 성경의 책들 자체를 왜곡하는 데로 넘어간다는 것은 놀라운 일이 아닙니까! 사람들이 교회를 떠나자마자 저마다 성경을 제 방식대로 해석하기 시작하며, 각자 다르게 해석합니다. 그리스도께서는 당신을 믿는 모든 이가 하나 되기를 하느님 아버지께 기도하셨고, 사도들은 한마음이 되라고 권하며 믿음의 일치를 말했습니다. 교회 없이는 어떤 일치도 불가능하다는 것이 드러납니다. 또다시 바벨의 ‘언어 혼잡’이 생길 수밖에 없습니다. 교회 안에서 믿음은 천 년이 지나도 하나이며 언제나 같습니다. 그러나 교회에서 떨어져 나간 이들에게서는 믿음이 거의 날마다 바뀝니다. 새로운 이단자와 분파주의자가 끊임없이 나타나고, 그들의 교사는 저마다 다르게 가르칩니다. 교회 없이는 무엇보다 그리스도의 가르침이 사라지고 덧없는 사람의 생각이 그 자리를 차지한다는 것이 분명합니다”</em> (<a href="https://azbyka.ru/otechnik/Ilarion_Troitskij/khristianstva-net-bez-tserkvi/#">성 순교자 일라리온(트로이츠키)(1886-1929), 교회 없이는 그리스도교도 없다</a>, 러시아어에서 옮김)</p></li><li><p>칠십인역: “그분께서 율법을 도움으로 주셨으니, 그들이 이 말과 같지 아니하다고 말하게 하려 하심이라. 이를 위해서는 바칠 예물이 없다” (<a href="https://bibleox.com/ko/gr-lxx-byz/is/8/#L20">사 8:20, 칠십인역</a>, 그리스어에서 옮김). 여기서는 모세 오경만을 말합니다. 표현의 차이 말고도, 점쟁이들이 자기 예언의 값으로 돈을 요구한다는 점을 가리킵니다.</p></li></ol><h3>도움이 되는 자료(러시아어)</h3><ol><li><p><a href="https://azbyka.ru/otechnik/Nikolaj_Varzhanskij/oruzhie-pravdy/3_1">https://azbyka.ru/otechnik/Nikolaj_Varzhanskij/oruzhie-pravdy/3_1</a></p></li><li><p>성경 안에서 “솔라 스크립투라”를 보여 주려는 시도를 분석한 글: <a href="https://bibleox.com/ru/ru/w/tynP_%D0%9A%D0%B0%D0%BA_%D0%BF%D1%80%D0%BE%D1%82%D0%B5%D1%81%D1%82%D0%B0%D0%BD%D1%82_%D0%BF%D0%BE%D1%81%D1%82%D1%83%D0%BB%D0%B0%D1%82_%D1%82%D0%BE%D0%BB%D1%8C%D0%BA%D0%BE_%D0%9F%D0%B8%D1%81%D0%B0%D0%BD%D0%B8%D0%B5_%D0%B7%D0%B0%D1%89%D0%B8%D1%89%D0%B0%D0%BB">https://bibleox.com/ru/ru/w/tynP_Как_протестант_постулат_только_Писание_защищал</a></p></li><li><p>“솔라 스크립투라”의 관점에서 본, 오순절파에서 정교회로 온 길: <a href="https://youtu.be/f3bOTveRdXY?si=0RdgWh51R4aqa14q">https://youtu.be/f3bOTveRdXY?si=0RdgWh51R4aqa14q</a></p></li></ol><p>번역: 로디온 블라소프 (AI 도구 활용). 저본: 러시아어 원문. 참고: 영어·일본어 번역. 성경 인용과 링크는 개역개정에 따름.</p>'
