  title: "“솔라 스크립투라”(오직 성경) 반박"
  copy_cover: true
  body: '<h2>머리말</h2><p>솔라 스크립투라는 자기 교회를 세우는 데 쓰이는 속임수입니다. 야바위꾼의 손놀림처럼 단순하지만 재빠른 동작이 듣는 이들을 혼란스럽게 하여, 그들은 눈앞에서 바꿔치기가 일어나는 것을 알아차리지 못합니다. 그들은 결코 “오직 성경에 따른” 가르침을 배우는 것이 아니라, 새 교사의 개인적 믿음(그의 견해)과 맞지 않는 것은 모두 버린 또 하나의 성경 해석을 받을 뿐입니다. 교사의 개인적 믿음은 듣는 이들에게 전해져 또 하나의 사람의 전통이 됩니다. 그러나 이 전통은 전통이라고 불리지 않습니다. 바로 여기에 속임수가 있습니다. 듣는 이들은 자기가 오직 성경에 따라 믿는다는 착각을 갖게 됩니다. 이전의 이단 단체들도 이렇게 생겨났습니다. 그들은 사도들에게서 성경과 함께 곧바로 받은 교회의 믿음을 버리고, 저마다 다른 자기 교사들의 개인적 견해를 무엇보다 높였습니다. 분파가 아무리 많이 생겨나도, 그들의 교사들은 성경에서 그야말로 어떤 믿음이든 해석해 낼 수 있습니다.</p><p><strong>리옹의 성 순교자 이레네오(~130-202)</strong></p><blockquote><p>“그들은 복음서 저자들과 사도들의 글에서만 비뚤어진 해석과 거짓된 풀이를 써서 자기 견해의 증거를 끌어내려 하는 것이 아니라, <strong><mark>율법과 선지자들도 똑같이 다룹니다</mark></strong> … 그들 가운데 다른 이들은 <strong><mark>매우 교묘하게 성경의 그런 부분들을 자기들의 꾸며 낸 이야기에 맞추어, 굳건한 믿음을 지키지 못하는 이들을 진리에서 사로잡아 끌고 갑니다</mark></strong> … 벗이여, 보십시오. 이 사람들이 성경을 남용하여 그것으로 자기 체계를 뒷받침하려 애쓰면서 <strong><mark>스스로를 속이는 방법</mark></strong>이 이러합니다. … 이제 이 이단자들의 일관되지 않은 견해를 살펴봅시다. (<strong>그들은 둘이나 셋인데도</strong>) 같은 문제를 다루는 데 서로 일치하지 않고, 사물과 이름에서 <strong><mark>서로 어긋나는 견해를 내놓습니다</mark></strong>.”</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b1/">이단 반박 1권</a>, 영어 번역에서 옮김)</p><blockquote><p>“그들 사이에서는 한 [구절]을 두고 이런 차이가 있으며, <strong><mark>같은 성경을 두고 서로 어긋나는 견해를 가집니다</mark></strong>.”</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/irenaeus-against-heresies-b4/">이단 반박 4권 35장 4절</a>, 영어 번역에서 옮김)</p><p><strong>스트리돈의 복된 히에로니무스(~347-420)</strong></p><blockquote><p>“이미 긴 논의를 했고 오랜 논쟁으로 청중의 주의가 지쳤으니, 내 생각을 짧게 숨김없이 말하겠습니다. <strong><mark>우리는 사도들이 세웠고 오늘까지 이어지는 그 교회 안에 머물러야 합니다. 그리스도인이라 불리는 이들이 주 예수 그리스도가 아니라 다른 누구, 이를테면 마르키온파, 발렌티노스파, 산의 사람들, 들의 사람들처럼 그 이름을 딴다는 말을 듣거든, 그곳은 그리스도의 교회가 아니라 적그리스도의 회당임을 알아도 좋습니다. 그들이 교회가 세워진 뒤에 생겨났다는 사실 자체가, 사도가 그들이 오리라고 미리 말한 자들임을 증명하기 때문입니다</mark></strong>. <strong><mark>그리고 자기 주장에 성경의 권위가 있다고 생각한다면 우쭐대지 말라. 마귀 자신도 성경을 인용했고, 성경의 본질은 글자가 아니라 뜻에 있기 때문입니다. 그렇지 않고 글자를 따른다면 우리도 새 교리를 지어낼 수 있습니다</mark></strong>. 신을 신고 겉옷을 두 벌 가진 사람은 교회에 받아들이면 안 된다고 주장할 수도 있습니다.”</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/jerome-the-dialogue-against-the-luciferians/">루키페르파 반박 대화</a>, 영어 번역에서 옮김)</p><p><strong>레랭의 성 빈켄티우스(450년 이전 별세)</strong></p><blockquote><p>“우리는 또 네스토리우스의 사악한 오만도 꾸짖었습니다. 그는 <strong><mark>자기가 성경을 깨달은 처음이자 유일한 사람이며, 자기보다 앞서 거룩한 말씀을 풀이한 모든 교사, 곧 모든 사제단, 모든 고백자와 순교자들은 무지했다고 자랑했습니다. 그들 가운데 어떤 이들은 하느님의 율법에 관한 주해를 펴냈고</mark></strong>, 다른 이들은 그들의 주해에 동의하거나 따랐는데도 말입니다. 한마디로 그는 <strong><mark>온 교회가 지금도 잘못에 빠져 있고 언제나 잘못에 빠져 있었다고</mark></strong> 자신 있게 주장했습니다. 그가 보기에 교회는 무지하고 그릇된 교사들을 따랐고 지금도 따르고 있다는 것입니다.”</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/oXFe_For_the_Antiquity_and_Universality_of_the_Catholic_Faith_Against_the_Profane_Novelties_of_All_Heresies/">비망록</a>, 영어 번역에서 옮김)</p><p>이와 같은 다른 <a href="https://bibleox.com/ru/ru/w/WxNK_Против_Sola_Scriptura">말씀들</a>(러시아어)도 보십시오.</p><h2>솔라 스크립투라</h2><p><strong>“솔라 스크립투라”</strong>(라틴어 Sola Scriptura, “오직 성경”)는 16세기에 종교개혁가들(<a href="https://bibleox.com/ru/ru/w/3SlQ_Протестантизм">개신교</a> 운동을 일으킨 이들)이 내놓은 교리 수립 방법입니다. 이에 따르면 교리를 세우는 최고 권위는 오직 성경(읽는 이가 주관적으로 이해한 성경)뿐입니다.</p><p>이론과 달리 개신교인과 신개신교인 사이에서는 “솔라 스크립투라”를 전승을 완전히 거부하는 것으로 이해하는 경우가 널리 퍼져 있습니다. 교부들의 유산을 놓고 논쟁할 준비가 된 개신교인은 많지 않으며, 정교인과 개신교인의 토론에서는 교부들의 작품은 물론 교부들의 이름만 꺼내도 날카로운 거부와 조롱을 받는 경우가 많습니다. 개신교 단체들에서는 “전통”이라는 말 자체가 “장로들의 전통”(<a href="https://bibleox.com/ko/ko-nkrv/mf/15/#L2">마 15:2</a>)과 동일시되어 부정적인 뜻을 띱니다. 그러면서 사도들 스스로 지키라고 명한(<a href="https://bibleox.com/ko/ko-nkrv/2sol/2/#L15">살후 2:15</a>) 사도적 전승, 곧 주님과 사도들이 여러 방법으로 교회에 심어 주셨고 교회 안에서 끊임없이 지켜지며 조상에게서 후손에게 전해지는 믿음의 존재는 완전히 무시됩니다.</p><h2>솔라 스크립투라를 정당화하려는 시도</h2><p>솔라 스크립투라를 옹호하는 이들은 성경 구절들을 들면서, 그것들이 성경을 신앙의 최고 권위 또는 유일한 권위로 여겨야 한다고 말하는 것처럼 내세웁니다. 그러나 실제로 그들이 드는 구절 가운데 어느 하나도 솔라 스크립투라를, 곧 <strong>오직</strong> 성경만이(그 밖의 무엇도 아니고) 교리에서 어떤 독점적이고 최고이며 유일한 역할을 한다는 것을 말하지 않습니다.</p><p>솔라 스크립투라를 옹호하려고 다음과 같은 종류의 구절들을 내놓습니다.</p><h3>1. 하느님의 말씀은 진리입니다</h3><p>하느님께서 어떤 방법으로든(입으로, 글로, 환상으로, 천사나 선지자나 사도 같은 전달자를 통해) 알려 주시는 것은 진리입니다:</p><blockquote><p>“그들을 진리로 거룩하게 하옵소서 <strong>아버지의 말씀은 진리니이다</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/in/17/#L17">요 17:17</a>)</p></blockquote><p>우리는 이것을 반박하지 않습니다. 하느님의 모든 말씀은 진리이며, 기록된 말씀만이 아닙니다. 입으로 전한 전승도 하느님의 말씀이라고 불립니다:</p><blockquote><p>“이러므로 우리가 하나님께 끊임없이 감사함은 <strong>너희가 우리에게 들은 바 하나님의 말씀을</strong> 받을 때에 사람의 말로 받지 아니하고 <strong>하나님의 말씀으로 받음이니</strong> 진실로 그러하도다 이 말씀이 또한 너희 믿는 자 가운데에서 역사하느니라” (<a href="https://bibleox.com/ko/ko-nkrv/1sol/2/#L13">살전 2:13</a>; <a href="https://bibleox.com/ko/ko-nkrv/1pet/1/#L23-25">벧전 1:23-25</a>)</p></blockquote><p>모든 성경이 하느님의 감동으로 된 것이라는 것도 우리는 반박하지 않습니다:</p><blockquote><p>“<strong>모든 성경은 하나님의 감동으로 된 것으로</strong> 교훈과 책망과 바르게 함과 의로 교육하기에 유익하니” (<a href="https://bibleox.com/ko/ko-nkrv/2tim/3/#L16">딤후 3:16</a>)</p></blockquote><h3>2. 성경은 믿는 이들에게 중요합니다</h3><p>성경은 믿는 이들에게 큰 의미가 있습니다:</p><blockquote><p>“<strong>모든 성경은</strong> 하나님의 감동으로 된 것으로 교훈과 책망과 바르게 함과 의로 교육하기에 <strong>유익하니</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2tim/3/#L16">딤후 3:16</a>)</p></blockquote><blockquote><p>“너희가 성경에서 영생을 얻는 줄 생각하고 <strong>성경을 연구하거니와</strong> 이 성경이 곧 내게 대하여 증언하는 것이니라” (<a href="https://bibleox.com/ko/ko-nkrv/in/5/#L39">요 5:39</a>)</p></blockquote><p>이것도 우리는 반박하지 않습니다.</p><p>이 모든 것은 참입니다. 정교회는 위의 어느 것도 반박하지 않으며, 오히려 이 모두를 스스로 확언합니다.</p><p>그러나:</p><ul><li><p>이 구절들은 진리가 <strong>오직</strong> 성경에만 있고 전승은 진리가 아니라는 것을 보여 주지 않습니다. 전승에 관한 같은 종류의 구절들은 그냥 무시됩니다(<a href="#HH-전승을-지키고-그에-따라-가르치라는-명령">아래</a> 참조). 솔라 스크립투라를 따르는 이들에게는 전승이 필요하다는 것을 옹호할 목적이 없기 때문입니다.</p></li><li><p>이 구절들은 하느님의 <strong>모든</strong> 계시가 성경에 기록되어 있으므로 전승을 버려도 된다는 것을 보여 주지 않습니다. 전승을 버리는 것은 성경을 거스르는 행위입니다(<a href="https://bibleox.com/ko/ko-nkrv/2sol/2/#L15">살후 2:15</a>).</p></li></ul><p>그들이 드는 구절 가운데 어느 것도 “오직 성경”이라는 개념의 “오직”이라는 말에 대해 아무것도 말하지 않습니다. 모두 하느님의 계시가 필요하고 참되다는 것을 가리킬 뿐이며, 그 계시를 어떤 형태로 받든, 곧 글로든 말로든 눈으로 보여 주신 것으로든 마찬가지입니다. 우리는 이것을 믿으며, 여기에는 “솔라 스크립투라”가 전혀 없습니다.</p><h2>솔라 스크립투라 설교자들의 속임수</h2><p>듣는 이에게 성경에 높은 권위가 있고 성경에 귀 기울이는 것은 하느님께 귀 기울이는 것과 같다는 것을 보여 준 다음, 듣는 이가 전혀 알아차리지 못하게 바꿔치기가 일어납니다. 하느님과 성경 대신 설교자가 말하기 시작하고 성경을 제 방식대로 해석합니다. 이제 듣는 이는 설교자의 말, 곧 성경 해석에서 서로 모순되는 수천 단체 가운데 하나를 세운 사람의 말을 하느님의 말씀으로 받아들이라는 요구를 받습니다.</p><p>물론 설교자는 계속 성경을 들며 자기 말을 여러 구절로 뒷받침하지만, 분명한 문제는 개신교가 이런 식으로 하느님과 그분의 행위와 구원의 길에 관한 온갖 가르침 수천 가지를 낳았다는 것입니다. 더구나 그리스도교가 시작될 때부터 교회 밖의 단체들은 바로 성경을 왜곡하여 믿음을 비틀고 사람들을 자기 뒤로 끌어가려 했습니다. 마귀도 그렇게 하여, 바로 성경으로 그리스도를 시험했습니다:</p><blockquote><p>“이에 마귀가 예수를 거룩한 성으로 데려다가 성전 꼭대기에 세우고 이르되 네가 만일 하나님의 아들이어든 <strong>뛰어내리라 기록되었으되 그가 너를 위하여 그의 사자들을 명하시리니 그들이 손으로 너를 받들어 발이 돌에 부딪치지 않게 하리로다</strong> 하였느니라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/4/#L5-6">마 4:5-6</a>)</p></blockquote><p>마귀는 하느님의 말씀을 구실로 삼아 첫 사람들을 타락으로 이끌기도 했습니다:</p><blockquote><p>“그런데 뱀은 여호와 하나님이 지으신 들짐승 중에 가장 간교하니라 <strong>뱀이 여자에게 물어 이르되 하나님이 참으로 너희에게 동산 모든 나무의 열매를 먹지 말라 하시더냐</strong> 여자가 뱀에게 말하되 동산 나무의 열매를 우리가 먹을 수 있으나 동산 중앙에 있는 나무의 열매는 하나님의 말씀에 너희는 먹지도 말고 만지지도 말라 너희가 죽을까 하노라 하셨느니라 <strong>뱀이 여자에게 이르되 너희가 결코 죽지 아니하리라</strong> 너희가 그것을 먹는 날에는 너희 눈이 밝아져 하나님과 같이 되어 선악을 알 줄 하나님이 아심이니라” (<a href="https://bibleox.com/ko/ko-nkrv/gen/3/#L1-5">창 3:1-5</a>)</p></blockquote><p>이처럼 마귀와, 교회와 원수가 된 단체들을 세운 이들은 바로 성경을 써서 사람들을 미혹했습니다. 어떻게 이런 일이 일어납니까? 성경에 대한 사사로운 해석에 성경의 권위를 입히기 때문입니다.</p><h2>솔라 스크립투라의 근본 문제 — 주관주의</h2><p>이렇게 믿음을 세우는 방법의 근본 문제는 <strong>성경에 대한 객관적 이해가 없다</strong>는 것입니다. 사람은 누구나 자기가 쌓은 경험, 세계관, 관심과 기호라는 프리즘을 통해 성경을 받아들입니다. 곧 <strong>주관적으로</strong> 받아들입니다. 간단히 말해 문제는 이것입니다. <strong>무엇이 성경에 맞고 무엇이 맞지 않는지 누가 결정하는가?</strong> 솔라 스크립투라는 이 물음에 답하지 않습니다. 바로 이 때문에 솔라 스크립투라는 실천할 수 없는 이론에 지나지 않습니다. 그리고 이것은 근거 없는 주장이 아닙니다.</p><p>솔라 스크립투라를 처음 쓴 이들(종교개혁가들) 자신이 성경에 대한 저마다 다른 이해에 근거해 서로 다른 교리를 내놓았습니다. 의견 차이는 가장 중요한 문제들에 관한 것이었습니다:</p><ul><li><p>구원;</p></li><li><p>사람이 구원받도록 예정되었는가;</p></li><li><p>사람의 죄성;</p></li><li><p>믿는 이들의 삶에서 성사의 역할;</p></li><li><p>성체성혈성사 안에 그리스도께서 실제로 계시는가;</p></li><li><p>유아 세례가 가능한가;</p></li><li><p>믿는 이들의 삶에 이콘이 있는가.</p></li></ul><p>서로 다른 교리는 곧바로 서로 다른 단체를 낳았습니다. 그리고 이것은 시작에 지나지 않습니다. 시간이 흐르면서 솔라 스크립투라를 쓰는 이들 사이의 의견 차이와 분열은 빠르게 늘어나, 몇 개의 교리와 단체에서 시작하여 500년 만에 믿음의 온갖 문제, 심지어 하느님과 그리스도의 위격에 관한 가장 중요한 문제에 이르기까지 수만 가지 분열과 의견 차이에 이르렀습니다.</p><p>이처럼 솔라 스크립투라라는 개념은 실제로 사람의 덧붙임을 걸러 내고 성경 저자들의 믿음에 이르게 해 주지 못했습니다. 지지자들의 요란한 주장과 달리 솔라 스크립투라는 새로운 사람의 덧붙임, 곧 새로운 전통이 많이 생겨날 길을 열어 줄 뿐입니다. 이에 대해서는 아래에서 다룹니다.</p><h2>솔라 스크립투라는 많은 전통을 낳았습니다</h2><p>종교개혁가들이 밝힌 의도에 따르면 솔라 스크립투라는 사람의 전통을 걸러 내야 했습니다. 실제로는 또 하나의 개신교 단체를 세운 새 창시자마다 또 하나의 사람의 전통을 세운 셈이 되었습니다. 그는 자기 믿음에 성경 구절을 입혔을 뿐이며, 이것은 권위 있는 말과 글이 생겨난 때부터(<a href="https://bibleox.com/ko/ko-nkrv/gen/3/#L1,4-5">창 3:1,4-5</a>) 종교개혁가들보다 훨씬 앞서 여러 이단의 우두머리들이 해 온 일입니다.</p><p>새 지도자 둘레에 단체가 생겨났고, 그 단체는 바로 이 지도자의 믿음을 받아 지키고 후손에게 전했습니다. 누군가 이 단체에 들어가려 하면, 그는 그 단체 지도자의 믿음을 받아들이고 바로 그 단체가 이해하는 대로 성경을 이해해야 합니다. 침례교에 오면 침례교의 전통에 따른 믿음을 받고, 오순절파에서는 오순절파의 전통에 따른 믿음을, 재림교회에서는 재림교회의 전통에 따른 믿음을 받으며, 나머지도 모두 그렇습니다. 단체들은 서로의 전통을 정죄합니다. 침례교인은 재림교회 단체를 가르치도록 허락받지 못하고, 오순절파 신자는 침례교 단체를 가르치도록 허락받지 못합니다.</p><p>결국 이런 단체들은 모두 솔라 스크립투라에서 출발하여, 결코 “오직 성경에 따라”가 아니라 엄격히 자기들의 전통에 따라, 곧 언젠가 자기 지도자가 말한 대로, 그리고 단체가 설교와 교사들의 책으로 조상에게서 후손에게 지식을 전하며 전통으로 지켜 온 대로만 믿어야 한다는 데 이르렀습니다. 다만 이것을 전통이라고, 하물며 “사람의 전통”이라고 부르지 않을 뿐입니다. 그 이름은 허수아비처럼 교회의 전승에만 붙이는 것이 관례입니다.</p><h2>단체의 지도자가 믿음의 원천입니다</h2><p>만일 성경이 그 자체로 충분한 믿음의 원천이라면, “오직 성경 위에” 믿음을 세우겠다고 나선 모든 이가 솔라 스크립투라를 쓰는 다른 이들과 같은 믿음을 가졌을 것입니다. 그러나 그들은 모두 서로 다른 믿음에 이르렀으니, 믿음의 원천도 다르다는 뜻입니다. 그 원천은 단체를 세운 <strong>사람</strong>입니다. 그가 그 믿음을 지어내어 따르는 이들에게 전했고, 그들은 자기 지도자의 믿음을 지킵니다.</p><h2>사실상 개신교 단체들에서는 성경이 아니라 자기들의 전통이 첫자리를 차지합니다</h2><p>이런 단체들에서는 모두 바로 자기들의 전통에 첫자리를 주고, 성경은 전통을 정당화하는 데 쓸모 있는 구절을 골라내는 보조 도구로만 씁니다. 그런 공동체 가운데 하나에서 받은 믿음이 사실상 성경보다 우위에 서며, 성경 본문은 듣는 이 둘레에 비눗방울을, 곧 여기서는 오직 성경에 따라 믿는다는, 주의를 흐리는 착각을 만드는 데만 쓰입니다. 그 사이에 설교를 통해 그의 생각 속에 바로 그가 속하게 된 공동체의 전통이 심어집니다.</p><p>전통과 모순되면 성경은 쉽게 무시될 수 있습니다. 예를 들어 성경 어디에도 유아에게 세례를 주면 안 된다는 말이 없고, 오히려 세례의 예표(할례)는 바로 유아에게 행해졌는데도(<a href="https://bibleox.com/ko/ko-nkrv/gen/17/#L10-12">창 17:10-12</a>) 많은 개신교인은 성경에서 간접적인 이유를 들며 유아 세례를 금해야 한다고 고집합니다. 성경은 유아가 세례 없이 구원받는다고 말하지 않으며, 오히려 구세주께서는 물과 성령으로 나지 않으면 아무도 하늘 나라를 볼 수도 들어갈 수도 없다고 말씀하셨고(<a href="https://bibleox.com/ko/ko-nkrv/in/3/#L3,5-6">요 3:3,5-6</a>), 구약에서도 세례의 예표 없이는 사람이 백성 중에서 끊어져야 했습니다(<a href="https://bibleox.com/ko/ko-nkrv/gen/17/#L14">창 17:14</a>). 그런데도 많은 개신교인은 유아가 세례 없이 구원받는다고 가르치며, 이번에도 성경의 간접적인 구절을 들려 하지만 그보다 자기 추론에 더 기댑니다.</p><p>그들은 자기 전통에만 있는 것을 믿음으로 지키면서, 서품을 통해 사제직의 은총이 전해진다는 가르침을 두고 교회를 비난하며, 안수를 <strong>통해</strong> 하느님의 은사가 전해진다는 가장 분명한 말씀(<a href="https://bibleox.com/ko/ko-nkrv/2tim/1/#L6">딤후 1:6</a>; <a href="https://bibleox.com/ko/ko-nkrv/act/8/#L18">행 8:18</a>)을 쉽게 버립니다. 왜 그렇습니까? 그들의 전통이 다른 믿음을 내놓기 때문이며, 전통이 성경보다 우위에 서므로 직접적인 성경 본문은 버려집니다. 이 단체가 언젠가 배운 것과 다르게 믿어서는 안 되기 때문입니다. 실제로 그렇지만 이것을 그런 말로 말해서는 안 됩니다. 전통이라는 말을 써서는 안 되고(이 말은 교회를 공격할 때만 씁니다), 여기서는 바로 이 단체를 세운 사람의 믿음만 전한다고 드러내 놓고 말해서도 안 됩니다.</p><h2>정직하지 않은 대비</h2><p>솔라 스크립투라를 따르는 이들이 세운 단체들에는 이런 대비가 널리 퍼져 있습니다. 교회는 성경을 버리고 오직 전승에 따라 믿는 반면, 개신교 단체는 모두 거꾸로 전승을 버리고 오직 성경에 따라 믿는다는 것입니다.</p><p>실제로는:</p><ul><li><p>교회는 오직 전승에 따라 믿지 않으며, 전승과 똑같이 성경을 씁니다.</p></li><li><p>개신교 단체들도 오직 성경에 따라 믿지 않으며, 자기 지도자의 믿음만 옳다고 여기고 그것을 전통으로 지킵니다.</p></li></ul><p>이처럼 실제로는 어떤 솔라 스크립투라도 존재하지 않습니다. 그것은 이론으로만 존재합니다. 누구든 이 개념을 실천하면 반드시 또 하나의 새 믿음, 새로운 성경 이해, 새 단체, 그 결과 새 전통이 생겨납니다.</p><p>이것을 증명하기는 전혀 어렵지 않습니다. 실험을 해 보면 됩니다. 어떤 사람이 이런 단체 가운데 하나에 왔는데 단체가 자기 지식을 전해 주지 않고 그의 손에 성경만 쥐여 준다면, 이 사람은 성경만 읽어서는 100% 이 단체의 믿음에 이르지 못할 것입니다. 그가 그들의 믿음에 이르는 경우는 오직 하나, 단체가 자기 믿음을 그에게 전해 줄 때뿐입니다.</p><p>정교회는 자기의 모든 가르침을 성경으로 확인합니다. 그러나 개신교 단체들은 성경에 대한 <strong>교회의 이해</strong>에 동의하지 않으며, 그 대신 “오직 성경”이 아니라(말없이) <strong>자기들의 이해와 믿음</strong>을 내놓습니다.</p><h2>솔라 스크립투라는 성경과 정면으로 충돌합니다</h2><p>솔라 스크립투라에 대한 정교회의 반론은 “성경”이라는 말이 아니라 “오직”이라는 말에 관한 것입니다. 그리고 이 반론은 성경 자체 위에 세워져 있습니다:</p><ol><li><p><strong>성경에는 “솔라 스크립투라”가 없습니다</strong>. 성경 자체에는 오직 성경 위에 믿음을 세우거나 오직 성경에만 우선권을 주라는 요구가 없습니다. 그래서 개신교인들은 성경의 중요성에 관한 구절만 듭니다(전승의 중요성에 관한 구절은 말하지 않습니다). 성경에는 솔라 스크립투라에 관한 구절이 그냥 없기 때문입니다.</p></li><li><p><strong>오히려 성경은 입으로 전한 전승을 지키라고 말합니다</strong>. 전승, 곧 기록된 것만이 아니라 사도들의 입으로 한 설교도 지키라는 요구가 거듭 나옵니다(<a href="https://bibleox.com/ru/ru/w/Предание#HH-Предание--не-только-тексты-но-и-услышанные-слова-которыми-передаётся-вера">구절들</a>). 그리고 사도들은 입으로 한 설교를 첫자리에 둡니다(<a href="https://bibleox.com/ko/ko-nkrv/2sol/2/#L15">살후 2:15</a>).</p></li><li><p><strong>성경은 교회의 교사들에게서 배우라고 요구합니다.</strong> 하느님께서는 교회에 장로들과 교사들을 세우시고(<a href="https://bibleox.com/ko/ko-nkrv/1kor/12/#L28">고전 12:28</a>; <a href="https://bibleox.com/ko/ko-nkrv/ef/4/#L11">엡 4:11</a>) 그들에게 교회의 양 떼를 이끌고 가르치는 일을 맡기십니다. 솔라 스크립투라를 따르는 이들은 교회에서 배우기를 거부합니다. 교회 안에서 제자가 되기를 원하지 않는 이 사람들은 스스로 교사라고 선언했습니다(<a href="https://bibleox.com/ko/ko-nkrv/2tim/4/#L3">딤후 4:3</a>).</p></li><li><p><strong>성경은 그릇되게 해석될 수 있습니다</strong>. 성경은 교회 안에 굳게 서지 못한 사람들이 성경을 해석하다가 스스로 멸망에 이른다고 가리킵니다(<a href="https://bibleox.com/ko/ko-nkrv/2pet/3/#L15-16">벧후 3:15-16</a>). 솔라 스크립투라를 따르는 이들은 교회에서 배울 생각조차 없습니다. 교사들을 거부하고 교과서만 들고서 성경을 되는 대로 해석하며, 그 결과 서로 다른 믿음과 교과서(성경)에 대한 서로 다른 이해를 가진 수많은 분열된 단체가 생겨났습니다. 그리고 성경은 교회의 가르침 없이 성경을 제멋대로 해석하면 성경을 억지로 풀어 멸망에 이른다고 말합니다(<a href="https://bibleox.com/ko/ko-nkrv/2pet/3/#L15-16">벧후 3:15-16</a>).</p></li></ol><p>이처럼 솔라 스크립투라를 따르는 이들은 다음과 같은 점에서 성경을 거슬러 행합니다:</p><ol><li><p><strong>그들은 성경에 없는 것을 가르칩니다</strong>. 성경에는 “솔라 스크립투라”라는 가르침이 없습니다;</p></li><li><p><strong>그들은 사도들의 입으로 전한 전승을 거부합니다</strong>. 그들은 오직 성경만이 가장 중요하다고 말하며, 성경에 기록된 사도들의 말, 곧 전승을 지키라고 요구하면서 입으로 한 설교를 먼저, 그다음에 기록된 것을 두는 말씀(<a href="https://bibleox.com/ko/ko-nkrv/2sol/2/#L15">살후 2:15</a>)을 거스릅니다;</p></li><li><p><strong>그들은 교회의 가르치는 직분</strong>과 하느님께서 세우신 교회의 교사들을 거부하며, 이것은 성경(<a href="https://bibleox.com/ko/ko-nkrv/1kor/12/#L28">고전 12:28</a>; <a href="https://bibleox.com/ko/ko-nkrv/ef/4/#L11">엡 4:11</a>)을 정면으로 거스르는 것입니다.</p></li><li><p><strong>그들은 교회 안에 굳게 서지 않은 채 성경을 해석합니다</strong>. 개신교 단체마다 자기 나름의 성경 이해가 있고, 단체 안의 공동체마다, 심지어 공동체 안에서도 저마다 원하는 대로 성경을 이해할 수 있습니다. 솔라 스크립투라는 성경(읽는 이가 이해한 성경) 외에 다른 어떤 교리의 원천에도 최고 권위를 인정하지 말라고 부추기기 때문입니다. 누군가 다른 성경 이해가 마음에 들면 그것이 참된 것으로 여겨질 것입니다. 성경은 설교자의 말, 개신교 설교자의 말보다도 위에 있기 때문입니다.</p></li></ol><h2>솔라 스크립투라라는 생각이 틀렸다는 가장 큰 증거</h2><p>솔라 스크립투라를 지어낸 목적이 그리스도교 세계를 가능한 한 크게 분열시키는 것이었다면, 이 생각은 매우 효과적이었습니다. 그러나 그 목적이 사도들의 믿음을 찾는 것이었다면, 솔라 스크립투라는 목표에서 멀어지게 하고 많은 전통과 분열을 낳기만 한 잘못된 생각이 되었습니다.</p><p>솔라 스크립투라가 틀렸다는 가장 큰 증거는 솔라 스크립투라를 쓰는 이들 자신, 곧 “오직 성경”이라는 구호 아래 지어낸 교리를 가진, 서로 모순되는 셀 수 없이 많은 단체입니다. 다른 어떤 생각도 “솔라 스크립투라”만큼 그리스도를 믿는 이들 사이에 많은 분열을 만들지 않았습니다. 그리고 이것은 성경을 정면으로 거슬러 이루어졌습니다(<a href="https://bibleox.com/ko/ko-nkrv/in/17/#L20-21">요 17:20-21</a>; <a href="https://bibleox.com/ko/ko-nkrv/1kor/1/#L10">고전 1:10</a>; <a href="https://bibleox.com/ko/ko-nkrv/1in/2/#L18-19">요일 2:18-19</a>).</p><blockquote><p>“내가 비옵는 것은 이 사람들만 위함이 아니요 또 그들의 말로 말미암아 나를 믿는 사람들도 위함이니 아버지여, 아버지께서 내 안에, 내가 아버지 안에 있는 것 같이 <strong>그들도 다 하나가 되어</strong> 우리 안에 있게 하사 <strong>세상으로 아버지께서 나를 보내신 것을 믿게 하옵소서</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/in/17/#L20-21">요 17:20-21</a>)</p></blockquote><blockquote><p>“형제들아 내가 우리 주 예수 그리스도의 이름으로 너희를 권하노니 <strong>모두가 같은 말을 하고 너희 가운데 분쟁이 없이</strong> 같은 마음과 같은 뜻으로 온전히 합하라” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/1/#L10">고전 1:10</a>)</p></blockquote><blockquote><p>“아이들아 지금은 마지막 때라 적그리스도가 오리라는 말을 너희가 들은 것과 같이 지금도 많은 적그리스도가 일어났으니 그러므로 우리가 마지막 때인 줄 아노라 <strong>그들이 우리에게서 나갔으나</strong> 우리에게 속하지 아니하였나니 <strong>만일 우리에게 속하였더라면 우리와 함께 거하였으려니와</strong> 그들이 나간 것은 다 우리에게 속하지 아니함을 나타내려 함이니라” (<a href="https://bibleox.com/ko/ko-nkrv/1in/2/#L18-19">요일 2:18-19</a>)</p></blockquote><p>16세기에 종교개혁가 루터가 솔라 스크립투라라는 개념을 내놓았습니다. 그 뒤 종교개혁가마다 믿음을 세우기 시작했는데, 그들 말에 따르면 “오직 성경”(성경에 대한 자기 이해)에 최고 권위를 주었습니다. 오직 성경 위에 믿음을 세우면 사도들의 믿음에 이르리라고 여겼습니다. 이렇게 바로 이 방법이, 그리고 오직 이 방법만이 사람을 사도들의 믿음에 이르게 한다고 선언했습니다. 그러나 결국 의도와 달리 종교개혁가들은 모두 서로 다른 믿음에 이르렀습니다.</p><p>처음에 “솔라 스크립투라”라는 방식은 성경을 서로 다르게 이해하는 세 흐름, 곧 루터교, 칼뱅주의(개혁교회), 성공회를 낳았습니다. 나중에 이 개념 덕분에 지구 위의 누구든 자기 교리를 가진 자기 단체를 세울 수 있게 되었습니다. 성경을 손에 들기만 하면 됩니다. 이렇게 저마다 자기 믿음과 자기 성경 이해를 가진 이른바 교파 수천 개가 생겨났습니다. 이 과정은 오늘도 이어지고 있습니다. 믿음이 다르기 때문에 그들은 <strong>사람의 방식</strong>(<a href="https://bibleox.com/ko/ko-nkrv/1kor/3/#L3">고전 3:3</a>)을 따라 모두 서로 갈라지며, 모두 다른 <strong>믿음</strong>, 다른 <strong>세례</strong>, 하느님에 대한 다른 <strong>생각</strong>을 가집니다. 이 모든 것은 교회 안에서 마땅히 있어야 할 모습과 어긋납니다:</p><blockquote><p>“몸이 하나요 성령도 한 분이시니 이와 같이 너희가 부르심의 한 소망 안에서 부르심을 받았느니라 <strong><mark>주도 한 분이시요 믿음도 하나요 세례도 하나요</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ef/4/#L4-5">엡 4:4-5</a>)</p></blockquote><p>하느님에 대한 믿음이 다르다는 말에 대해, 누구나 예수를 믿는다고 반론할 수도 있습니다. 그러나 모든 이가 그리스도를 하느님으로 믿는 사도적 믿음을 가진 것은 아닙니다. 본성으로는 한 분이시고 위격으로는 셋이신 하느님, 곧 아버지와 아들과 성령을 믿는 믿음을 부정하는 개신교 유니테리언도 적지 않습니다. 또 많은 단체가 하느님과 그분의 뜻과 그분을 기쁘시게 하는 길에 대해 서로 다른 생각을 가집니다. 예를 들어 오순절파/은사주의자들은 자기들의 알아들을 수 없는 중얼거림과 바닥에 쓰러지는 일이 하느님을 기쁘시게 하며, 이 모든 것이 성령, 곧 하느님의 활동이라고 믿습니다. 그러나 다른 단체들은 하느님에 대한 오순절파의 이런 생각을 거부하고 그 자리에 자기 생각을 내놓습니다. 이처럼 그들은 하느님에 대해 서로 다른 생각을, 때로는 하느님에 관한 서로 다른 가르침을 가집니다.</p><p>성경을 손에 들고 서로 모순되며 “오직 성경에 따라” 또 하나의 믿음을 세웠다고 주장하는 셀 수 없이 많은 사람들이야말로 솔라 스크립투라에 반대하는 가장 뚜렷한 논거입니다. 사람들은 “오직 성경”을 통해 믿음을 “사람의 덧붙임”에서 해방하여 하나의 사도적 믿음에 이르는 길을 약속받았지만, 실제로 이 방식은 사람의 덧붙임을 아주 많이 낳았고, 믿는 이들의 일치를 바라시는 하느님의 뜻을 거슬러(<a href="https://bibleox.com/ko/ko-nkrv/in/17/#L20-21">요 17:20-21</a>; <a href="https://bibleox.com/ko/ko-nkrv/1kor/1/#L10">고전 1:10</a>; <a href="https://bibleox.com/ko/ko-nkrv/1in/2/#L18-19">요일 2:18-19</a>) 그리스도교 세계에 셀 수 없는 분열만 가져다주었습니다.</p><blockquote><p>“내가 비옵는 것은 이 사람들만 위함이 아니요 또 그들의 말로 말미암아 나를 믿는 사람들도 위함이니 아버지여, 아버지께서 내 안에, 내가 아버지 안에 있는 것 같이 <strong><mark>그들도 다 하나가 되어 우리 안에 있게 하사 세상으로 아버지께서 나를 보내신 것을 믿게 하옵소서</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/in/17/#L20-21">요 17:20-21</a>)</p></blockquote><blockquote><p>“형제들아 내가 우리 주 예수 그리스도의 이름으로 너희를 <strong><mark>권하노니</mark></strong> <strong><mark>모두가 같은 말을 하고 너희 가운데 분쟁이 없이</mark></strong> <strong><mark>같은 마음과 같은 뜻으로 온전히 합하라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/1/#L10">고전 1:10</a>)</p></blockquote><h3>구약의 평행 사례[3]</h3><p>구약에서도 바벨 성읍과 탑을 쌓을 때 비슷한 분열이 일어났습니다(<a href="https://bibleox.com/ko/ko-nkrv/gen/11/#L1-9">창 11:1-9</a>). 사람들은 자기 힘으로 성읍과 하늘에 닿는 탑을 쌓기로 했지만(<a href="https://bibleox.com/ko/ko-nkrv/gen/11/#L4">창 11:4</a>), 서로 다르게 말하기 시작하여(<a href="https://bibleox.com/ko/ko-nkrv/gen/11/#L7">창 11:7</a>) 갈라지고 흩어졌습니다(<a href="https://bibleox.com/ko/ko-nkrv/gen/11/#L8">창 11:8</a>). 지금도 그렇습니다.</p><p>하느님께서는 교회를 세우시고, 교회에 영원히 성령을 보내 주셨으며(<a href="https://bibleox.com/ko/ko-nkrv/in/14/#L16">요 14:16</a>), 친히 언제나 교회와 함께 계시겠다고 약속하셨고(<a href="https://bibleox.com/ko/ko-nkrv/mf/28/#L20">마 28:20</a>), 가르침을 입으로 전하셨으며, 사제들(<a href="https://bibleox.com/ko/ko-nkrv/act/20/#L17-18,28">행 20:17-18,28</a>)과 교사들(<a href="https://bibleox.com/ko/ko-nkrv/1kor/12/#L28">고전 12:28</a>)을 세우셨습니다. 그들은 입으로 가르쳤지만 편지도 주고받았습니다.</p><p>열다섯 세기도 더 지나 사람들이 와서, 교회가 보존한 몇몇 사도(모두가 아닌)의 편지만 교회에서 가져가고, 바로 그 편지들을 거슬러 이기지 못할 교회(<a href="https://bibleox.com/ko/ko-nkrv/mf/16/#L18">마 16:18</a>), 곧 하느님께서 놓으신 <strong>터</strong>를 버리고, 사도들에게서 받아 교회 안에 지켜진 믿음, 곧 사도들의 전승(<a href="https://bibleox.com/ko/ko-nkrv/2sol/2/#L15">살후 2:15</a>과 <a href="#HH-전승을-지키고-그에-따라-가르치라는-명령">다른 구절들</a>)과 하느님께서 세우신 사제들(<a href="https://bibleox.com/ko/ko-nkrv/act/20/#L17-18,28">행 20:17-18,28</a>)과 교사들(<a href="https://bibleox.com/ko/ko-nkrv/1kor/12/#L28">고전 12:28</a>)을 버리고, 하느님께서 세우신 교회와 상관없이 자기 지성과 힘으로(역사, 고고학, 언어학 따위의 연구로) 제 성읍을 쌓기로 했습니다. 다른 건축자들도 그들에게 합류합니다. 결국 그들은 서로 다르게 말하기 시작하여 갈라지고 흩어졌으며, 저마다 자기 소통 언어를 가진 정착지를 짓기 시작하고, “<strong>터</strong>가 있는 성, 그 성을 계획하시고 지으실 이는 하나님이시니라”(<a href="https://bibleox.com/ko/ko-nkrv/evr/11/#L10">히 11:10</a>)는 그 성에서 살기를 원하지 않습니다.</p><h2>“오직 성경”은 “오직”의 사고방식으로 이끕니다</h2><p>“오직”이라는 말이 들어간 공리를 많이 담은 개신교의 가르침은 지지자들을 흔히 짧게 “오직”의 사고방식이라고 부를 수 있는 생각의 틀로 이끕니다. 이 사고방식 때문에 많은 이가 본문 가운데 마음에 드는 부분에만 주의를 기울이고, 필요한 곳에 “오직”이라는 말을 상상하여 넣으며, 마치 스스로에게 “이 말만 고려해야 한다”고 말하듯 그 위에 어떤 구조를 세웁니다. 본문의 저자가 한 주제의 여러 면을 차례로 또는 작품의 여러 곳에서 다룰 때, 개신교인들은 흔히 하나만 골라 그것을 절대화합니다.</p><ul><li><p>예를 들어 사도들은 구원에 믿음과 행위가 모두 필요하다고 씁니다. “오직”의 사고방식은 여기서 믿음에 관한 본문 조각을 골라 “오직”이라는 말을 넣게 합니다.</p></li><li><p>사도들은 성경과 전승이 모두 필요하다고 씁니다. “오직”의 사고방식은 여기서 성경의 중요성에 관한 본문 조각을 골라 “오직”이라는 말을 넣게 합니다.</p></li></ul><p>고대 저술가들의 글을 연구할 때 이 사고방식은 거의 모든 데서 드러납니다.</p><ul><li><p>예를 들어 성체성혈성사를 설명할 때 저자들은 두 가지 설명(문자적 설명과 상징적 설명)을 하는데, 개신교인들은 상징적 설명만 보고 이 저자들을 자기들의 “오직”의 가르침을 지지하는 이들로 내세우려는 경향이 있습니다.</p></li></ul><p>많은 이단이 이 원리에서 생겨났습니다. 예수 그리스도께서 사람이시라는 것이 그분이 오직 사람이시라는 뜻입니까? 아닙니다. 그분은 하느님이시기도 합니다. 그분이 하느님이시라면 오직 하느님이시라는 뜻입니까? 아닙니다. 그분은 사람이시기도 합니다. 그리스도께서 아버지의 형상이시라면 오직 형상(그저 그림)이시라는 뜻입니까? 아닙니다. 그분은 참 하느님이시며 참 사람이시기도 합니다. 얼마나 많은 이가 여기에 걸려 넘어졌고 지금도 넘어집니까. 여기서도 그렇습니다. 상징적 설명은 문자적 설명을 물리치지 않고, 문자적 설명은 상징적 설명을 물리치지 않습니다.</p><p>정교인은 성경과 전승이 모두 필요하고 믿음과 행위가 모두 필요하다고 인정하며, 성체성혈성사의 문자적 이해를 인정하면서 상징적 의미도 덧붙여 인정하는 데 아무 걸림이 없습니다. 많은 개신교인은 같은 저자들의 다른 말들은 그냥 무시하고 어디서나 “오직”이라는 말을 고집합니다.</p><h2>예루살렘 공의회와 성경</h2><p>교회가 “오직 성경”의 원리로 살지 않았다는 가장 분명한 증거 가운데 하나는 사도들이 이끈 첫 교회 공의회인 예루살렘 공의회의 사건입니다.</p><p>예루살렘 공의회에서는 성경의 지시 없이 모세 율법이 폐지됩니다. 할례, 부정한 음식 금지, 안식일의 쉼, 죽은 이를 만지지 말라는 금지, 이방인과 사귀지 말라는 금지 등이 그렇습니다. 이 결정은 교회가 모여 의논하여 내렸습니다(<a href="https://bibleox.com/ko/ko-nkrv/act/15/#L22">행 15:22</a>). 성경 없이 이루어졌습니다. 성경의 저자이신 성령께서 교회 안에 계시기 때문입니다. 그래서 <strong>공의회의 결정은 “성경에 기록되었으니”라는 말로 확증되지 않고</strong>, 성령과 교회의 뜻을 가리키는 말로 확증됩니다. “<strong>성령과 우리는 … 옳은 줄 알았노니</strong>”(<a href="https://bibleox.com/ko/ko-nkrv/act/15/#L28-29">행 15:28-29</a>).</p><p>이처럼 모세 율법의 폐지는 성령과 교회의 결정입니다. 반대편에는 바리새파에서 믿게 된 그리스도인들이 있었습니다(<a href="https://bibleox.com/ko/ko-nkrv/act/15/#L5">행 15:5</a>). 그들 편에는 성경의 분명한 말씀도 있었습니다(<a href="https://bibleox.com/ko/ko-nkrv/gen/17/#L14">창 17:14</a>). 그러나 사도들 편에는 바로 교회의 권위가 있었습니다. 기록된 대로 그들은 온 교회와 함께 의논하고(<a href="https://bibleox.com/ko/ko-nkrv/act/15/#L22">행 15:22</a>) 공동의 결정을 알렸기 때문입니다. 그들은 성경에 따라 율법을 지키라고 요구하는 이들에게 성경 없이 자기들의 말만으로 율법의 폐지를 가리켰습니다.</p><p>성경은 할례를 받아야 하며 할례를 받지 않은 자는 백성 중에서 끊어지리라고 말합니다(<a href="https://bibleox.com/ko/ko-nkrv/gen/17/#L14">창 17:14</a>). 그러나 사도들은 이것을 가르치라는 지시를 하지 않았습니다:</p><blockquote><p>“들은즉 우리 가운데서 어떤 사람들이 <strong><mark>우리의 지시도 없이</mark></strong> 나가서 말로 너희를 괴롭게 하고 마음을 혼란하게 한다 하기로” (<a href="https://bibleox.com/ko/ko-nkrv/act/15/#L24">행 15:24</a>) <em>(비잔틴 본문(다수 사본)에는 “<strong>할례를 받고 율법을 지켜야 한다고 말하여</strong>”(λέγοντες περιτέμνεσθαι καὶ τηρεῖν τὸν νόμον)가 있습니다.)</em></p></blockquote><p>그러나 이것은 성경에 말씀되어 있지 않습니까? 무엇을 근거로 이것을 가르쳐서는 안 됩니까? 어떤 성경을 근거로 할례를 받지 않아도 된다고 결정했습니까? 어떤 성경이 돼지고기를 먹어도 된다고 허락했습니까? 이것은 성경에 따라서가 아니라 진리를 세우는 온 교회의(<a href="https://bibleox.com/ko/ko-nkrv/1tim/3/#L15">딤전 3:15</a>) 공의회 결정으로 이루어졌습니다.</p><p>그때부터 예루살렘 공의회의 결정은 교회의 전승이 되었습니다:</p><blockquote><p>“여러 성으로 다녀 갈 때에 예루살렘에 있는 사도와 장로들이 작정한 <strong><mark>규례를 그들에게 주어 지키게 하니</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/act/16/#L4">행 16:4</a>)</p></blockquote><p>예루살렘 사도 공의회를 이끈 사도 야고보는 연설에서 선지자 아모스의 말을 상기시킵니다. 이 예언에는 할례에 관한 말이 없습니다:</p><blockquote><p>“그 날에 내가 다윗의 무너진 장막을 일으키고 그것들의 틈을 막으며 그 허물어진 것을 일으켜서 옛적과 같이 세우고 그들이 에돔의 남은 자와 내 이름으로 일컫는 만국을 기업으로 얻게 하리라 이 일을 행하시는 여호와의 말씀이니라” (<a href="https://bibleox.com/ko/ko-nkrv/am/9/#L11-12">암 9:11-12</a>)</p></blockquote><p>이것을 근거로(성경에 대한 어떤 암시적 언급과 성령에 대한 언급으로) 예루살렘 공의회에서 이루어진 일을 받아들인다면, 예루살렘 공의회뿐 아니라 정교회의 모든 세계 공의회도 당연히 받아들여야 합니다. 성령께서는 예루살렘 공의회를 위해서만이 아니라 영원히 교회에 보내지셨기 때문입니다:</p><blockquote><p>“내가 아버지께 구하겠으니 그가 또 다른 보혜사를 너희에게 주사 <strong><mark>영원토록 너희와 함께 있게 하리니</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/in/14/#L16">요 14:16</a>)</p></blockquote><p>그리스도께서도 친히 언제나 교회와 함께 계시겠다고 약속하셨습니다:</p><blockquote><p>“내가 너희에게 분부한 모든 것을 가르쳐 지키게 하라 볼지어다 내가 <strong><mark>세상 끝날까지 너희와 항상 함께 있으리라</mark></strong> 하시니라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/28/#L20">마 28:20</a>)</p></blockquote><p>이콘 공경을 옹호한 제7차를 비롯한 모든 공의회에서는 성경에서 훨씬 더 무게 있는 근거가 제시되었습니다. 성령께서는 지금도 교회 안에 계십니다. 이런 논거에 따라 모든 공의회를 받아들여야 합니다.</p><h2>교회의 가르치는 직분</h2><h3>양 떼는 감독자인 장로들에게 맡겨졌습니다</h3><blockquote><p>“바울이 밀레도에서 사람을 에베소로 보내어 교회 장로들을 청하니 오매 그들에게 말하되 아시아에 들어온 첫날부터 지금까지 내가 항상 여러분 가운데서 어떻게 행하였는지를 여러분도 아는 바니 &lt;…&gt; 여러분은 자기를 위하여 또는 온 양 떼를 위하여 삼가라 <strong><mark>성령이 그들 가운데 여러분을 감독자로 삼고</mark></strong> <strong><mark>하나님이 자기 피로 사신 교회를 보살피게 하셨느니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/act/20/#L17-18,28">행 20:17-18,28</a>)</p></blockquote><h3>하느님께서 교회에 교사들을 세우셨으며, 모두가 교사는 아닙니다</h3><blockquote><p>“<strong><mark>그가</mark></strong> 어떤 사람은 사도로, 어떤 사람은 선지자로, 어떤 사람은 복음 전하는 자로, 어떤 사람은 <strong><mark>목사와 교사로 삼으셨으니</mark></strong> 이는 성도를 온전하게 하여 봉사의 일을 하게 하며 그리스도의 몸을 세우려 하심이라” (<a href="https://bibleox.com/ko/ko-nkrv/ef/4/#L11-12">엡 4:11-12</a>)</p></blockquote><blockquote><p>“<strong><mark>하나님이 교회 중에 몇을 세우셨으니</mark></strong> 첫째는 사도요 둘째는 선지자요 셋째는 <strong><mark>교사요</mark></strong> 그 다음은 능력을 행하는 자요 그 다음은 병 고치는 은사와 서로 돕는 것과 다스리는 것과 각종 방언을 말하는 것이라 다 사도이겠느냐 다 선지자이겠느냐 <strong><mark>다 교사이겠느냐</mark></strong> 다 능력을 행하는 자이겠느냐” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/12/#L28-29">고전 12:28-29</a>)</p></blockquote><h3>교회 안에 굳게 서지 못한 사람들은 성경을 해석하다가 스스로 멸망에 이릅니다</h3><blockquote><p>“또 우리 주의 오래 참으심이 구원이 될 줄로 여기라 우리가 사랑하는 형제 바울도 그 받은 지혜대로 너희에게 이같이 썼고 또 <strong><mark>그 모든 편지에도 이런 일에 관하여 말하였으되 그 중에 알기 어려운 것이 더러 있으니 무식한 자들과 굳세지 못한 자들이 다른 성경과 같이 그것도 억지로 풀다가 스스로 멸망에 이르느니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2pet/3/#L15-16">벧후 3:15-16</a>)</p></blockquote><h2>성경은 그릇되게 해석될 수 있습니다</h2><blockquote><p>“또 우리 주의 오래 참으심이 구원이 될 줄로 여기라 우리가 사랑하는 형제 바울도 그 받은 지혜대로 너희에게 이같이 썼고 또 <strong><mark>그 모든 편지에도 이런 일에 관하여 말하였으되 그 중에 알기 어려운 것이 더러 있으니 무식한 자들과 굳세지 못한 자들이 다른 성경과 같이 그것도 억지로 풀다가 스스로 멸망에 이르느니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2pet/3/#L15-16">벧후 3:15-16</a>)</p></blockquote><p>자세히: <a href="https://bibleox.com/ru/ru/w/толкование-писания">성경 해석</a></p><blockquote><p>“이런 당황과 헛된 말이 무지에서 나온 것이라면, 성경이 그들에게 가르쳐 줄 것입니다. <strong><mark>이단의 창시자인 마귀</mark></strong>는 악에 붙어 있는 악취 때문에 <strong><mark>성경의 말을 빌려, 그것을 외투 삼아 자기 독을 뿌리고 순박한 이들을 꾀어냅니다</mark></strong>. 그렇게 하와를 속였고, 그렇게 이전의 이단들을 지어냈으며, <strong><mark>이번에는 아리우스를 설득하여 이전의 이단들을 반대하는 척하게 함으로써 자기 이단을 눈에 띄지 않게 들여오게 했습니다</mark></strong>. … 누가 이런 가르침을 들어 본 적이 있습니까? <strong>이 이단의 옹호자와 삯꾼들은 그것을 어디서, 누구에게서 얻었습니까? 그들이 배울 때 누가 그렇게 풀이해 주었습니까?</strong> … 그런데 그들 스스로 이것을 이제야 처음 들었다고 인정한다면, 이 이단이 낯선 것이며 <strong>우리 교부들에게서 온 것이 아님</strong>을 어떻게 부정할 수 있겠습니까? 우리 교부들에게서 오지 않고 오늘에야 드러난 것이라면, 복된 바울이 미리 말한 것(딤전 4:1-2; 딛 1:14), 곧 ‘후일에 어떤 사람들이 건전한 믿음에서 떠나 미혹하는 영과 귀신의 가르침을 따르리니, 이는 자기 양심이 화인을 맞아서 외식함으로 거짓말하는 자들이며 진리를 배반하는 자들이라’는 바로 그것이 아니고 무엇이겠습니까?”</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/athanasius-four-discourses-against-the-arians-1/">대 아타나시오스, 아리우스파 반박 제1강화 8장</a>, 영어 번역에서 옮김)</p><h2>전승이란 무엇인가?</h2><p>전승은 하느님 아버지의 계시입니다. 아버지께서는 당신의 독생자를 통해 이 계시를 사도들에게 전하셨고, 사도들은 교회에 전했으며, 교회는 말(입으로 하는 말과 글)과 행위로 이것을 믿음으로 대대로 전합니다:</p><blockquote><p>“<strong><mark>나는 아버지께서 내게 주신 말씀들을 그들에게 주었사오며 그들은 이것을 받고</mark></strong> 내가 아버지께로부터 나온 줄을 참으로 아오며 아버지께서 나를 보내신 줄도 믿었사옵나이다” (<a href="https://bibleox.com/ko/ko-nkrv/in/17/#L8">요 17:8</a>)</p></blockquote><blockquote><p>“<strong><mark>너희가 모든 일에 나를 기억하고 또 내가 너희에게 전하여 준 대로 그 전통을 너희가 지키므로</mark></strong> 너희를 칭찬하노라” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/11/#L2">고전 11:2</a>)</p></blockquote><h2>전승을 지키고 그에 따라 가르치라는 명령</h2><blockquote><p>“그러므로 형제들아 <strong><mark>굳건하게 서서</mark></strong> <strong>말로나</strong> <strong>우리의 편지로</strong> <strong><mark>가르침을 받은 전통을 지키라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2sol/2/#L15">살후 2:15</a>)</p></blockquote><blockquote><p>“너희가 모든 일에 나를 기억하고 또 <strong><mark>내가 너희에게 전하여 준 대로 그 전통을 너희가 지키므로</mark></strong> 너희를 칭찬하노라” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/11/#L2">고전 11:2</a>)</p></blockquote><blockquote><p>“형제들아 내가 너희에게 전한 복음을 너희에게 알게 하노니 이는 너희가 받은 것이요 또 그 가운데 선 것이라 너희가 만일 <strong><mark>내가 전한 그 말을 굳게 지키고</mark></strong> 헛되이 믿지 아니하였으면 <strong><mark>그로 말미암아 구원을 받으리라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/15/#L1-2">고전 15:1-2</a>)</p></blockquote><blockquote><p>“또 네가 많은 증인 앞에서 <strong><mark>내게 들은 바를</mark></strong> <strong><mark>충성된 사람들에게 부탁하라</mark></strong> 그들이 또 다른 사람들을 가르칠 수 있으리라” (<a href="https://bibleox.com/ko/ko-nkrv/2tim/2/#L2">딤후 2:2</a>)</p></blockquote><blockquote><p>“그러므로 형제들아 우리가 끝으로 주 예수 안에서 너희에게 구하고 <strong><mark>권면하노니</mark></strong> <strong><mark>너희가 마땅히 어떻게 행하며 하나님을 기쁘시게 할 수 있는지를 우리에게 배웠으니 곧 너희가 행하는 바라 더욱 많이 힘쓰라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1sol/4/#L1">살전 4:1</a>)</p></blockquote><blockquote><p>“사랑하는 자들아 우리가 일반으로 받은 구원에 관하여 내가 너희에게 편지하려는 생각이 간절하던 차에 <strong><mark>성도에게 단번에 주신 믿음의 도를 위하여 힘써 싸우라</mark></strong>는 편지로 너희를 권하여야 할 필요를 느꼈노니” (<a href="https://bibleox.com/ko/ko-nkrv/iud/1/#L3">유 1:3</a>)</p></blockquote><blockquote><p>“<strong><mark>미쁜 말씀의 가르침을 그대로 지켜야 하리니</mark></strong> 이는 능히 바른 교훈으로 권면하고 거슬러 말하는 자들을 책망하게 하려 함이라 <strong>불순종하고 헛된 말을 하며 속이는 자가 많은 중</strong> 할례파 가운데 특히 그러하니 그들의 입을 막을 것이라 이런 자들이 더러운 이득을 취하려고 마땅하지 아니한 것을 가르쳐 가정들을 온통 무너뜨리는도다” (<a href="https://bibleox.com/ko/ko-nkrv/tit/1/#L9-11">딛 1:9-11</a>)</p></blockquote><blockquote><p>“뱀이 그 간계로 하와를 미혹한 것 같이 너희 마음이 그리스도를 향하는 진실함과 깨끗함에서 떠나 부패할까 두려워하노라 만일 누가 가서 <strong><mark>우리가 전파하지 아니한 다른 예수를 전파하거나</mark></strong> 혹은 너희가 받지 아니한 다른 영을 받게 하거나 혹은 <strong><mark>너희가 받지 아니한 다른 복음을</mark></strong> 받게 할 때에는 너희가 잘 용납하는구나 &lt;…&gt; 그런 사람들은 거짓 사도요 속이는 일꾼이니 자기를 그리스도의 사도로 가장하는 자들이니라 이것은 이상한 일이 아니니라 사탄도 자기를 광명의 천사로 가장하나니 그러므로 사탄의 일꾼들도 자기를 의의 일꾼으로 가장하는 것이 또한 대단한 일이 아니니라 그들의 마지막은 그 행위대로 되리라” (<a href="https://bibleox.com/ko/ko-nkrv/2kor/11/#L3-4,13-15">고후 11:3-4,13-15</a>)</p></blockquote><blockquote><p>“내가 마게도냐로 갈 때에 너를 권하여 에베소에 머물라 한 것은 어떤 사람들을 명하여 <strong><mark>다른 교훈을 가르치지 말며</mark></strong> 신화와 족보에 끝없이 몰두하지 말게 하려 함이라 이런 것은 믿음 안에 있는 하나님의 경륜을 이룸보다 도리어 변론을 내는 것이라” (<a href="https://bibleox.com/ko/ko-nkrv/1tim/1/#L3-4">딤전 1:3-4</a>)</p></blockquote><h2>전승은 글만이 아니라 들은 말이기도 합니다</h2><blockquote><p>“이러므로 우리가 하나님께 끊임없이 감사함은 <strong><mark>너희가 우리에게 들은 바 하나님의 말씀을 받을 때에</mark></strong> 사람의 말로 받지 아니하고 하나님의 말씀으로 받음이니 진실로 그러하도다 이 말씀이 또한 너희 믿는 자 가운데에서 역사하느니라” (<a href="https://bibleox.com/ko/ko-nkrv/1sol/2/#L13">살전 2:13</a>)</p></blockquote><blockquote><p>“너는 그리스도 예수 안에 있는 믿음과 사랑으로써 <strong><mark>내게 들은 바 바른 말을 본받아 지키고</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2tim/1/#L13">딤후 1:13</a>)</p></blockquote><blockquote><p>“또 네가 많은 증인 앞에서 <strong><mark>내게 들은 바를</mark></strong> <strong>충성된 사람들에게 부탁하라</strong> 그들이 또 다른 사람들을 가르칠 수 있으리라” (<a href="https://bibleox.com/ko/ko-nkrv/2tim/2/#L2">딤후 2:2</a>)</p></blockquote><blockquote><p>“그러므로 형제들아 <strong>굳건하게 서서</strong> <strong><mark>말로나</mark></strong> <strong>우리의 편지로</strong> <strong>가르침을 받은 전통을 지키라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2sol/2/#L15">살후 2:15</a>)</p></blockquote><blockquote><p>“너희는 <strong>처음부터 들은 것을 너희 안에 거하게 하라</strong> <strong><mark>처음부터 들은 것이 너희 안에 거하면 너희가 아들과 아버지 안에 거하리라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1in/2/#L24">요일 2:24</a>)</p></blockquote><blockquote><p>“<strong><mark>너희가 모든 일에 나를 기억하고</mark></strong> 또 내가 너희에게 전하여 준 대로 그 전통을 너희가 지키므로 너희를 칭찬하노라” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/11/#L2">고전 11:2</a>)</p></blockquote><blockquote><p>“그러므로 <strong><mark>네가 어떻게 받았으며 어떻게 들었는지 생각하고 지켜</mark></strong> 회개하라 만일 일깨지 아니하면 내가 도둑 같이 이르리니 어느 때에 네게 이를는지 네가 알지 못하리라” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/3/#L3">계 3:3</a>)</p></blockquote><h2>전승이 필요한 이유</h2><h3>성경이 예수 그리스도에 관한 모든 정보의 원천은 아닙니다</h3><blockquote><p>“예수께서 제자들 앞에서 <strong>이 책에 기록되지 아니한</strong> 다른 표적도 많이 행하셨으나 오직 이것을 기록함은 너희로 예수께서 하나님의 아들 그리스도이심을 믿게 하려 함이요 또 너희로 믿고 그 이름을 힘입어 생명을 얻게 하려 함이니라” (<a href="https://bibleox.com/ko/ko-nkrv/in/20/#L30-31">요 20:30-31</a>)</p></blockquote><blockquote><p>“<strong>예수께서 행하신 일이 이 외에도 많으니</strong> 만일 낱낱이 기록된다면 이 세상이라도 이 기록된 책을 두기에 부족할 줄 아노라” (<a href="https://bibleox.com/ko/ko-nkrv/in/21/#L25">요 21:25</a>)</p></blockquote><h3>안수에 관한 가르침은 성경에 서술되어 있지 않습니다</h3><p>어느 서신에도 세례를 바르게 베푸는 법, 보제와 사제와 주교를 세우는 법에 관한 가르침이 없습니다:</p><blockquote><p>“그러므로 우리가 그리스도의 도의 초보를 버리고 죽은 행실을 회개함과 하나님께 대한 신앙과 <strong>세례들과 안수와</strong> 죽은 자의 부활과 영원한 심판에 관한 교훈의 <strong>터를 다시 닦지 말고</strong> 완전한 데로 나아갈지니라” (<a href="https://bibleox.com/ko/ko-nkrv/evr/6/#L1-2">히 6:1-2</a>)</p></blockquote><h3>사도들은 입으로 하는 소통을 더 좋아했습니다</h3><blockquote><p>“내가 너희에게 쓸 것이 많으나 <strong>종이와 먹으로 쓰기를 원하지 아니하고</strong> 오히려 너희에게 가서 대면하여 말하려 하니 이는 너희 기쁨을 충만하게 하려 함이라” (<a href="https://bibleox.com/ko/ko-nkrv/2in/1/#L12">요이 1:12</a>)</p></blockquote><blockquote><p>“<strong>내가 네게 쓸 것이 많으나 먹과 붓으로 쓰기를 원하지 아니하고</strong> <strong>속히 보기를 바라노니 또한 우리가 대면하여 말하리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/3in/1/#L13-14">요삼 1:13-14</a>)</p></blockquote><h3>입으로 한 설교와 기록된 설교를 모두 지켜야 합니다</h3><p>사도 바울은 서신으로만이 아니라 말로도 받은 전승(사도들의 가르침)을 지키라고 당부합니다:</p><blockquote><p>“그러므로 형제들아 굳건하게 서서 <strong>말로나</strong> <strong>우리의 편지로</strong> <strong>가르침을 받은</strong> 전통을 지키라” (<a href="https://bibleox.com/ko/ko-nkrv/2sol/2/#L15">살후 2:15</a>)</p></blockquote><blockquote><p>“또 네가 많은 증인 앞에서 <strong>내게 들은 바를</strong> <strong>충성된 사람들에게 부탁하라</strong> 그들이 또 다른 사람들을 가르칠 수 있으리라” (<a href="https://bibleox.com/ko/ko-nkrv/2tim/2/#L2">딤후 2:2</a>)</p></blockquote><h3>사도들은 입으로 오랫동안 설교했습니다</h3><h4>3년</h4><p>사도 바울은 아시아의 장로들을 3년 동안 밤낮으로 가르쳤습니다:</p><blockquote><p>“그러므로 여러분이 일깨어 <strong><mark>내가 삼 년이나 밤낮 쉬지 않고 눈물로 각 사람을 훈계하던</mark></strong> 것을 기억하라” (<a href="https://bibleox.com/ko/ko-nkrv/act/20/#L31">행 20:31</a>)</p></blockquote><h4>1년 6개월</h4><p>고린도에서는 1년 6개월 동안 공동체를 가르쳤습니다:</p><blockquote><p>“그 후에 바울이 아덴을 떠나 고린도에 이르러 &lt;…&gt; <strong><mark>일 년 육 개월을 머물며 그들 가운데서 하나님의 말씀을 가르치니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/act/18/#L1,11">행 18:1,11</a>)</p></blockquote><h4>2년 3개월</h4><p>에베소에서는 처음 석 달 동안 회당에서, 그 뒤 두 해 동안 서원에서 제자들과 함께 설교했습니다:</p><blockquote><p>“바울이 회당에 들어가 <strong>석 달 동안</strong> 담대히 하나님 나라에 관하여 강론하며 권면하되 어떤 사람들은 마음이 굳어 순종하지 않고 무리 앞에서 이 도를 비방하거늘 바울이 그들을 떠나 <strong>제자들을 따로 세우고 두란노 서원에서 날마다 강론하니라</strong> <strong><mark>두 해 동안 이같이 하니</mark></strong> 아시아에 사는 자는 유대인이나 헬라인이나 다 주의 말씀을 듣더라” (<a href="https://bibleox.com/ko/ko-nkrv/act/19/#L8-10">행 19:8-10</a>)</p></blockquote><p>사도 바울 한 사람만 해도 회심한 33-34년부터 세상을 떠난 64-67년까지 적어도 30년 동안 설교했습니다.</p><h2>사도들은 전승을 사용했습니다</h2><p>사도는 성경에 이름이 나오지 않는 애굽의 두 술사의 이름을 듭니다:</p><blockquote><p>“<strong>얀네와 얌브레가</strong> 모세를 대적한 것 같이 그들도 진리를 대적하니 이 사람들은 그 마음이 부패한 자요 믿음에 관하여는 버림 받은 자들이라” (<a href="https://bibleox.com/ko/ko-nkrv/2tim/3/#L8">딤후 3:8</a>)</p></blockquote><p>사도 유다는 성경에 없는 논쟁을 이야기합니다:</p><blockquote><p>“천사장 미가엘이 <strong>모세의 시체에 관하여 마귀와 다투어 변론할 때에</strong> 감히 비방하는 판결을 내리지 못하고 다만 말하되 주께서 너를 꾸짖으시기를 원하노라 하였거늘” (<a href="https://bibleox.com/ko/ko-nkrv/iud/1/#L9">유 1:9</a>)</p></blockquote><p>성경에 없는 에녹의 말에 대해:</p><blockquote><p>“아담의 칠대 손 <strong>에녹이</strong> 이 사람들에 대하여도 <strong>예언하여</strong> 이르되 보라 주께서 그 수만의 거룩한 자와 함께 임하셨나니” (<a href="https://bibleox.com/ko/ko-nkrv/iud/1/#L14">유 1:14</a>)</p></blockquote><p>사도 바울은 나무 속에 숨었다가 톱으로 켜져 죽은 선지자 이사야를 말합니다:</p><blockquote><p>“돌로 치는 것과 <strong>톱으로 켜는 것과</strong> 시험과 칼로 죽임을 당하고 양과 염소의 가죽을 입고 유리하여 궁핍과 환난과 학대를 받았으니” (<a href="https://bibleox.com/ko/ko-nkrv/evr/11/#L37">히 11:37</a>)</p></blockquote><p>복음서 저자 누가는 목격자들에게서 들은 말을 바탕으로, 곧 전승을 받아 복음서를 기록합니다:</p><blockquote><p>“우리 중에 이루어진 사실에 대하여 <strong>처음부터 목격자와 말씀의 일꾼 된 자들이 전하여 준 그대로</strong> 내력을 저술하려고 붓을 든 사람이 많은지라 그 모든 일을 근원부터 자세히 미루어 살핀 나도 데오빌로 각하에게 차례대로 써 보내는 것이 좋은 줄 알았노니” (<a href="https://bibleox.com/ko/ko-nkrv/lk/1/#L1-3">눅 1:1-3</a>)</p></blockquote><h3>사도들은 복음서에 없는 내용을 전합니다</h3><p>사도 바울은 에베소의 목자들과 이야기하면서 복음서에 없는 구세주 그리스도의 가르침을 가리킵니다:</p><blockquote><p>“범사에 여러분에게 모본을 보여준 바와 같이 수고하여 약한 사람들을 돕고 또 <strong>주 예수께서 친히 말씀하신 바 주는 것이 받는 것보다 복이 있다 하심을</strong> 기억하여야 할지니라” (<a href="https://bibleox.com/ko/ko-nkrv/act/20/#L35">행 20:35</a>)</p></blockquote><p>부활하신 그리스도께서 많은 사람에게 나타나신 일도 전하는데, 이것 역시 복음서에 기록되어 있지 않습니다:</p><blockquote><p>“그 후에 <strong>오백여 형제에게 일시에 보이셨나니</strong> 그 중에 지금까지 대다수는 살아 있고 어떤 사람은 잠들었으며 그 후에 야고보에게 보이셨으며 그 후에 모든 사도에게와” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/15/#L6-7">고전 15:6-7</a>)</p></blockquote><h2>전승의 중요성</h2><p>그릇된 가르침은 하느님께로 이끌지 않습니다:</p><blockquote><p>“<strong>지나쳐 그리스도의 교훈 안에 거하지 아니하는 자는 다 하나님을 모시지 못하되</strong> 교훈 안에 거하는 그 사람은 아버지와 아들을 모시느니라” (<a href="https://bibleox.com/ko/ko-nkrv/2in/1/#L9">요이 1:9</a>)</p></blockquote><p>이단(거짓 가르침)은 하느님 나라를 유업으로 받지 못합니다:</p><blockquote><p>“우상 숭배와 주술과 원수 맺는 것과 분쟁과 시기와 분냄과 당 짓는 것과 분열함과 <strong>이단과</strong> 투기와 술 취함과 방탕함과 또 그와 같은 것들이라 전에 너희에게 경계한 것 같이 경계하노니 이런 일을 하는 자들은 <strong>하나님의 나라를 유업으로 받지 못할 것이요</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gal/5/#L20-21">갈 5:20-21</a>)</p></blockquote><h2>새 가르침을 들여오는 이들을 멀리하십시오</h2><blockquote><p>“<strong>이단에 속한 사람을 한두 번 훈계한 후에 멀리하라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/tit/3/#L10">딛 3:10</a>)</p></blockquote><blockquote><p>“<strong>누구든지 다른 교훈을 하며</strong> 바른 말 곧 우리 주 예수 그리스도의 말씀과 경건에 관한 교훈을 따르지 아니하면 <strong>그는 교만하여 아무 것도 알지 못하고 변론과 언쟁을 좋아하는 자니</strong> 이로써 투기와 분쟁과 비방과 악한 생각이 나며 마음이 부패하여지고 진리를 잃어 버려 경건을 이익의 방도로 생각하는 자들의 다툼이 일어나느니라” (<a href="https://bibleox.com/ko/ko-nkrv/1tim/6/#L3-5">딤전 6:3-5</a>) <em>(비잔틴 본문(다수 사본)에는 끝에 <strong>“이런 자들에게서 떠나라”</strong>(ἀφίστασο ἀπὸ τῶν τοιούτων)가 이어집니다.)</em></p></blockquote><blockquote><p>“디모데야 <strong><mark>망령되고 헛된 말과 거짓된 지식의 반론을 피함으로</mark></strong> <strong>네게 부탁한 것을 지키라</strong> 이것을 따르는 사람들이 있어 믿음에서 벗어났느니라 은혜가 너희와 함께 있을지어다” (<a href="https://bibleox.com/ko/ko-nkrv/1tim/6/#L20-21">딤전 6:20-21</a>)</p></blockquote><blockquote><p>“형제들아 우리 주 예수 그리스도의 이름으로 너희를 명하노니 게으르게 행하고 <strong>우리에게서 받은 전통대로 행하지 아니하는</strong> <strong><mark>모든 형제에게서 떠나라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2sol/3/#L6">살후 3:6</a>)</p></blockquote><blockquote><p>“형제들아 내가 너희를 권하노니 <strong><mark>너희가 배운 교훈을 거슬러 분쟁을 일으키거나 거치게 하는 자들을 살피고 그들에게서 떠나라</mark></strong> 이같은 자들은 우리 주 그리스도를 섬기지 아니하고 다만 자기들의 배만 섬기나니 교활한 말과 아첨하는 말로 순진한 자들의 마음을 미혹하느니라” (<a href="https://bibleox.com/ko/ko-nkrv/rim/16/#L17-18">롬 16:17-18</a>)</p></blockquote><blockquote><p>“<strong><mark>누구든지 이 교훈을 가지지 않고 너희에게 나아가거든 그를 집에 들이지도 말고</mark></strong> 인사도 하지 말라 그에게 인사하는 자는 그 악한 일에 참여하는 자임이라” (<a href="https://bibleox.com/ko/ko-nkrv/2in/1/#L10-11">요이 1:10-11</a>)</p></blockquote><blockquote><p>“그러나 우리나 혹은 하늘로부터 온 천사라도 <strong>우리가 너희에게 전한 복음 외에 다른 복음을 전하면 저주를 받을지어다</strong> 우리가 전에 말하였거니와 내가 지금 다시 말하노니 <strong><mark>만일 누구든지 너희가 받은 것 외에 다른 복음을 전하면 저주를 받을지어다</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gal/1/#L8-9">갈 1:8-9</a>)</p></blockquote><p><strong>아나테마</strong>(그리스어 ἀνάθεμα, 개역개정 “저주”) — 교회에서 끊어짐.</p><h2>성인들을 공경하고 본받아야 합니다</h2><blockquote><p>“하나님의 말씀을 너희에게 일러 주고 <strong><mark>너희를 인도하던 자들을 생각하며</mark></strong> 그들의 행실의 결말을 주의하여 보고 <strong><mark>그들의 믿음을 본받으라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/evr/13/#L7">히 13:7</a>)</p></blockquote><blockquote><p>“그러므로 내가 너희에게 권하노니 <strong><mark>너희는 나를 본받는 자가 되라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/4/#L16">고전 4:16</a>)</p></blockquote><blockquote><p>“<strong><mark>형제들아 너희는 함께 나를 본받으라 그리고 너희가 우리를 본받은 것처럼 그와 같이 행하는 자들을 눈여겨 보라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/fil/3/#L17">빌 3:17</a>)</p></blockquote><p>성인 공경에 대해 자세히: <a href="https://bibleox.com/ru/ru/w/почитание-святых-в-Библии">성인 공경</a></p><h2>비판에 대한 답변</h2><h3>“율법과 증거의 말씀을 따를지니”(사 8:20)[4]</h3><p>솔라 스크립투라를 옹호하려고 구약의 다음 구절을 듭니다:</p><blockquote><p>“어떤 사람이 너희에게 말하기를 <strong>주절거리며 속살거리는 신접한 자와 마술사에게 물으라 하거든</strong> 백성이 자기 하나님께 구할 것이 아니냐 산 자를 위하여 죽은 자에게 구하겠느냐 하라 <strong>마땅히 율법과 증거의 말씀을 따를지니 그들이 말하는 바가 이 말씀에 맞지 아니하면 그들이 정녕 아침 빛을 보지 못하고</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/is/8/#L19-20">사 8:19-20</a>)</p></blockquote><ol><li><p>여기에는 성경이 전승보다 우월하다는 말이 전혀 없습니다. 말할 것도 없이 <strong>술사와 성경 사이에서는 성경을 골라야 합니다</strong>. 이 구절들은 모세 오경(토라)과 계시(선지자들의 말)를, 백성 가운데 아예 있어서는 안 될 술사와 신접한 자들의 말(<a href="https://bibleox.com/ko/ko-nkrv/vtor/18/#L9-14">신 18:9-14</a>)과 비교하는 것에 관한 것입니다. 선지자 이사야는 토라와 선지자의 말을 술사들을 드러내는 외적 수단으로 쓰자고 제안하며, 백성에게 술사들의 말과 하느님의 말씀의 차이를 가리킵니다.</p></li><li><p>더구나 구약 시대에는 성경을 원리적으로 전승과 떼어 놓을 수 없었습니다. 전승 없이는 성경을 바르게 이해할 수 없을 뿐 아니라 바르게 읽을 수조차 없었습니다. 자음만으로 기록되었기 때문입니다(<a href="https://bibleox.com/ru/ru/w/евангелисты-обращаются-к-Септуагинте">자세히</a>). 읽는 법을 모르면 같은 낱말을 여러 가지로 읽을 수 있습니다. 낱말을 바르게 읽으려면 읽기의 <strong>전통</strong> 안에 있어야 하며, 그것은 조상에게서 후손에게 전승으로 전해졌습니다. 그러므로 성경에 관한 어떤 말도 전승과 떼어 놓을 수 없습니다.</p></li><li><p>반대자들에게 그들 자신의 명제를 상기시킬 만합니다. “솔라 스크립투라”는 “솔라”(오직)라는 말, 곧 오직 성경만이 최고 권위라는 것을 고집합니다. 그러나 인용된 구절에는 “오직 성경”을 지지하는 이들이 보고 싶어 하는 그런 성경 권위의 독점성, “오직”이라는 말(또는 그 비슷한 무엇)이 없습니다. 전승이 직접 언급되지 않았다는 이유만으로 그 말을 여기에 덧붙인다면, 일관되게 성경이 언급되지 않은 다른 비슷한 구절들은 오직 전승 위에 믿음을 세우라고 제안한다고 인정해야 합니다:</p></li></ol><blockquote><p>“너는 그리스도 예수 안에 있는 믿음과 사랑으로써 <strong><mark>내게 들은 바 바른 말을</mark></strong> <strong>본받아 지키고</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2tim/1/#L13">딤후 1:13</a>)</p></blockquote><blockquote><p>“또 네가 많은 증인 앞에서 <strong><mark>내게 들은 바를</mark></strong> <strong><mark>충성된 사람들에게 부탁하라</mark></strong> 그들이 또 다른 사람들을 가르칠 수 있으리라” (<a href="https://bibleox.com/ko/ko-nkrv/2tim/2/#L2">딤후 2:2</a>)</p></blockquote><p>들은 전승을 따르면 옳고 그름을 가릴 수 있을 뿐 아니라, 그보다 한없이 더 큰 것, 곧 하느님 안에 거할 수 있습니다:</p><blockquote><p>“너희는 <strong><mark>처음부터 들은 것을</mark></strong> <strong>너희 안에 거하게 하라</strong> <strong><mark>처음부터 들은 것이 너희 안에 거하면 너희가 아들과 아버지 안에 거하리라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1in/2/#L24">요일 2:24</a>)</p></blockquote><p>주 예수 그리스도께서도 친히 들은 것을 지키라고 부르십니다. 그때는 신약 성경이 거의 다 기록된 뒤였습니다:</p><blockquote><p>“그러므로 <strong><mark>네가 어떻게 받았으며 어떻게 들었는지 생각하고 지켜</mark></strong> 회개하라 만일 일깨지 아니하면 내가 도둑 같이 이르리니 어느 때에 네게 이를는지 네가 알지 못하리라” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/3/#L3">계 3:3</a>)</p></blockquote><p>그렇다면 주님과 사도들이 “오직 전승”을 가르친다는 뜻입니까? 바로 이 성경을 기록하고서도 여기서는 성경을 언급조차 하지 않고 전승을 따르라고 요구하니 말입니다.</p><p>이 구절들만 가져다가 교회의 반대자들은 똑같이 반대쪽 극단, 곧 “오직 전승”이라는 명제를 지어낼 수도 있었을 것입니다. 그러나 그들은 사도들보다 열다섯 세기(그 이상) 뒤에 생겨나 사도들의 전승을 받지 못했고, 전승을 옹호할 목적도 없으므로 전승에 관해서는 그런 극단을 끌어내지 않습니다. 그러나 사도들에게서 전승과 성경을 모두 받은 교회는 어느 것도 버리지 않으며, 입으로 전한 전승을 지키라는 사도들의 명령도 버리지 않고, 성경과 전승을 똑같이 참된 것으로 여깁니다.</p><h3>“기록된 말씀 밖으로 넘어가지 말라”(고전 4:6)</h3><blockquote><p>“형제들아 내가 너희를 위하여 이 일에 나와 아볼로를 들어서 본을 보였으니 이는 너희로 하여금 <strong>기록된 말씀 밖으로 넘어가지 말라</strong> 한 것을 <strong>우리에게서 배워</strong> 서로 대적하여 교만한 마음을 가지지 말게 하려 함이라” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/4/#L6">고전 4:6</a>)</p></blockquote><p>여기서는 어떤 기록된 본문을 말하는데, 그 본문을 근거로 서로 대적하여 교만해서는 안 된다는 것을 깨달아야 합니다. 어떤 본문을 말합니까? 같은 서신의 앞 장, 곧 자기를 낮게 여기라는 가르침이 주어진 곳입니다. 사도는 방금 기록한 것 밖으로 넘어가지 말고, <strong>그들에게서 배워</strong> 서로 대적하여 <strong>교만해지지 말라</strong>고 권합니다.</p><p>이 서신은 고린도 공동체에 생긴 분열 때문에 쓰였습니다. 2장 내내 사도는 그리스도를 높이면서 자기와 아볼로의 의미를 낮추어, 고린도 교인들이 바울을 따르는 이들과 아볼로를 따르는 이들로 갈라지는 것(<a href="https://bibleox.com/ko/ko-nkrv/1kor/3/#L4-7">고전 3:4-7</a>), 곧 교회가 파당으로 갈라지는 것을 막으려 했습니다. 갈라진 이들은 가르침이 달랐던 것이 아니라(그랬다면 사도는 가르침에 대해 말했을 것입니다) 서로에 대한 태도가 달랐습니다. 그들은 교회 교사의 이름에 따라 갈라졌습니다. 마치 교회 안의 모든 이가 같은 교사에게서 배운 이들하고만 사귀고 다른 교회 교사들의 제자들은 물리쳐야 하는 것처럼 말입니다. 이 그릇된 생각을 바로잡으려고 사도는 분열의 근거가 된 이름들의 의미를 낮추었습니다. 곧 그리스도를 높이면서 자기와 아볼로를 낮추었습니다.</p><p>조금 뒤에 사도는 앞에서 말한 것을 정리하며 같은 것을 다른 말로 말하는데, 이제는 기록된 것이 아니라 자기를 본받으라고 부릅니다:</p><blockquote><p>“<strong><mark>그러므로 내가 너희에게 권하노니 너희는 나를 본받는 자가 되라</mark></strong> 이로 말미암아 내가 주 안에서 내 사랑하고 신실한 아들 디모데를 너희에게 보내었으니 그가 너희로 하여금 그리스도 예수 안에서 나의 행사 곧 내가 각처 각 교회에서 가르치는 것을 생각나게 하리라” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/4/#L16-17">고전 4:16-17</a>)</p></blockquote><p>이처럼 이 구절은 그리스도인들이 <strong>기록된 사도의 본보기를 넘어 자기를 높이 여기지 말고</strong>, 자기를 낮게 여기라는 부름을 따라 서로 대적하여 교만하지 말며 갈라지지 말라는 것입니다.</p><h3>사도나 천사라도 다르게 가르치면 듣지 말라는 것인가?</h3><p>솔라 스크립투라를 따르는 이들에게서, 사도가 자기 편지를 자기 자신보다, 심지어 하느님의 천사보다도 위에 둔다는 논거를 들을 수 있습니다. 그들은 이 구절을 듭니다:</p><blockquote><p>“그러나 <strong>우리나 혹은 하늘로부터 온 천사라도 우리가 너희에게 전한 복음 외에 다른 복음을 전하면</strong> <strong>저주를 받을지어다</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gal/1/#L8">갈 1:8</a>)</p></blockquote><p>사도는 여기서 자기에 대해 말하는 것이 아니라, 마치 사도들의 이름으로 쓴 것처럼 공동체들에 보내진 거짓 편지들을 염두에 두고 있습니다:</p><blockquote><p>“영으로나 또는 말로나 또는 <strong>우리에게서 받았다 하는 편지로나</strong> 주의 날이 이르렀다고 해서 <strong>쉽게 마음이 흔들리거나</strong> 두려워하거나 하지 말아야 한다는 것이라 누가 어떻게 하여도 너희가 미혹되지 말라 먼저 배교하는 일이 있고 저 불법의 사람 곧 멸망의 아들이 나타나기 전에는 그 날이 이르지 아니하리니” (<a href="https://bibleox.com/ko/ko-nkrv/2sol/2/#L2-3">살후 2:2-3</a>)</p></blockquote><p>그는 또 천사의 말로 말하는 척하며 천사들에게서 받은 것처럼 예언하는 사람들의 계시에 귀 기울이지 말라고 가르칩니다.</p><p>편지가 사도에게서 온 것이 아니고 계시가 천사에게서 온 것이 아님을 어떻게 알 수 있습니까? 그 안에 다른 믿음이 전해지기 때문입니다. 사도들이 한때 전한 그 믿음이 아닙니다. 물론 사도는 하느님께서 사도들에게 주신 권위를 빼앗으려는 것이 아닙니다. 앞의 구절들, 아니 서신 전체가 갈라디아 교인들을 유대교로 꾀어 가던 교사들을 반대하여 쓰였습니다.</p><blockquote><p>“어리석도다 <strong>갈라디아 사람들아</strong> 예수 그리스도께서 십자가에 못 박히신 것이 너희 눈 앞에 밝히 보이거늘 <strong>누가 너희를 꾀더냐</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gal/3/#L1">갈 3:1</a>)</p></blockquote><blockquote><p>“내가 <strong>너희를 위하여 수고한 것이 헛될까 두려워하노라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gal/4/#L11">갈 4:11</a>)</p></blockquote><blockquote><p>“너희가 달음질을 잘 하더니 <strong>누가 너희를 막아</strong> 진리를 순종하지 못하게 하더냐 &lt;…&gt; <strong>너희를 어지럽게 하는 자들은 스스로 베어 버리기를 원하노라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gal/5/#L7,12">갈 5:7,12</a>)</p></blockquote><p>사도의 의도는 거짓 교사들로부터 자기 양 떼를 지키는 것이지, 자기 자신으로부터, 하물며 하느님의 천사들로부터 지키는 것이 아닙니다. 거룩한 천사들은 자기가 섬기는 하느님의 교회를 참된 길에서 벗어나게 할 수 없습니다. 사도는 자기가 한때 전한 믿음을 붙들어야 하며, 누구든 다르게 가르치면 사도인 척하거나 하느님의 천사인 척하더라도 받아들이지 말라는 것을 분명히 할 뿐입니다.</p><p>(고전 4:6) 이 구절에는 세 단계의 뜻이 있습니다:</p><ol><li><p><strong>이 일들을</strong> 내가 너희를 위하여 나와 아볼로에게 <strong>빗대어 적용하였으니</strong>(μετεσχημάτισα), <strong>이는(ἵνα)</strong></p></li><li><p><strong>너희가 우리에게서 배워</strong> 기록된 것 [한 장 앞에 기록된 것] 밖으로 [자기를] 넘어 생각하지 않게 하려는 것이요, <strong>이는(ἵνα)</strong></p></li><li><p>너희 가운데 아무도 한 사람을 편들어 다른 사람을 대적하여 <strong>교만하지</strong> 않게 하려는 것이다.</p></li></ol><p>사도는 어디서 자기와 아볼로를 다른 형제들 앞에서 교만하지 않은 이들로 그렸습니까? 한 장 앞에서입니다:</p><blockquote><p>“어떤 이는 말하되 나는 바울에게라 하고 다른 이는 나는 아볼로에게라 하니 너희가 육의 사람이 아니리요 그런즉 <strong>아볼로는 무엇이며 바울은 무엇이냐 그들은</strong> 주께서 각각 주신 대로 너희로 하여금 믿게 한 <strong>사역자들이니라</strong> <strong><mark>나는 심었고 아볼로는 물을 주었으되 오직 하나님께서 자라나게 하셨나니 그런즉 심는 이나 물 주는 이는 아무 것도 아니로되</mark></strong> 오직 자라게 하시는 이는 하나님뿐이니라” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/3/#L4-7">고전 3:4-7</a>)</p></blockquote><p>사도는 다른 서신에서도 비슷하게 한마음이 되라고 부릅니다:</p><blockquote><p>“<strong>서로 마음을 같이하며</strong> <strong><mark>높은 데 마음을 두지 말고</mark></strong> 도리어 <strong>낮은 데 처하며</strong> 스스로 지혜 있는 체 하지 말라” (<a href="https://bibleox.com/ko/ko-nkrv/rim/12/#L16">롬 12:16</a>)</p></blockquote><p>구세주께서도 같은 것을 가르치셨습니다:</p><ul><li><p>“누구든지 자기를 높이는 자는 낮아지고 누구든지 자기를 낮추는 자는 높아지리라”(<a href="https://bibleox.com/ko/ko-nkrv/mf/23/#L12">마 23:12</a>)</p></li><li><p>“너희 중에 누구든지 크고자 하는 자는 너희를 섬기는 자가 되고”(<a href="https://bibleox.com/ko/ko-nkrv/mk/10/#L43">막 10:43</a>)</p></li></ul><p>이처럼 사도는 앞에서 자기와 아볼로에 대해 기록한 것을 가리키며 겸손과 일치를 부를 뿐입니다.</p><p>같은 서신에서 사도는 고린도 교인들이 전통을 지킨다고 칭찬합니다:</p><blockquote><p>“<strong><mark>너희가 모든 일에 나를 기억하고 또 내가 너희에게 전하여 준 대로 그 전통을 너희가 지키므로</mark></strong> 너희를 칭찬하노라” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/11/#L2">고전 11:2</a>)</p></blockquote><p>그리고 고린도 교인들이 가르침받은 것을 전해 들은 대로 굳게 지키기만 하면 구원받는다고 말합니다:</p><blockquote><p>“형제들아 내가 너희에게 전한 복음을 너희에게 알게 하노니 이는 너희가 받은 것이요 또 그 가운데 선 것이라 너희가 만일 <strong><mark>내가 전한 그 말을 굳게 지키고</mark></strong> <strong><mark>헛되이 믿지 아니하였으면</mark></strong> 그로 말미암아 구원을 받으리라” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/15/#L1-2">고전 15:1-2</a>)</p></blockquote><p>앞에서 이미 언급한, 입으로 전한 전승에 관한 다른 말씀도 많습니다. 그 가운데 몇 가지를 들어 보겠습니다:</p><blockquote><p>“너는 그리스도 예수 안에 있는 믿음과 사랑으로써 <strong>내게 들은 바 바른 말을</strong> 본받아 지키고” (<a href="https://bibleox.com/ko/ko-nkrv/2tim/1/#L13">딤후 1:13</a>)</p></blockquote><blockquote><p>“또 네가 많은 증인 앞에서 <strong>내게 들은 바를</strong> <strong>충성된 사람들에게 부탁하라</strong> 그들이 또 다른 사람들을 가르칠 수 있으리라” (<a href="https://bibleox.com/ko/ko-nkrv/2tim/2/#L2">딤후 2:2</a>)</p></blockquote><blockquote><p>“너희는 <strong>처음부터 들은 것을</strong> <strong>너희 안에 거하게 하라</strong> <strong>처음부터 들은 것이 너희 안에 거하면 너희가 아들과 아버지 안에 거하리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1in/2/#L24">요일 2:24</a>)</p></blockquote><h2>맺음말</h2><p>“오직 성경”이라는 명제를 옹호하기 위해 다음과 같은 전술을 씁니다. 솔라 스크립투라에 관한 분명한 구절이 없으니 성경의 중요성에 관한 구절을 보여 주면서, <strong>전승의 중요성에 관한 구절은 무시하고 말하지 않는</strong> 것입니다. 이렇게 하여 듣는 이는 오직 성경만이 중요하다는 인상을 받게 됩니다.</p><p>개신교인들은 흔히 정교인들을 이렇게 나무랍니다:</p><blockquote><p>— 이콘을 공경하라, 성인들에게 기도하라 같은 것이 어디 기록되어 있는지 <strong>성경에서 보여 주기만 하십시오</strong>.</p></blockquote><p>우리는 보여 줍니다. 그러나 그들에게 이렇게 말합니다:</p><blockquote><p>— 전승도 중요합니다. 성경도 이것을 확인해 줍니다.</p></blockquote><p>그러면 그들은 말합니다:</p><blockquote><p>— 아니요, 오직 성경만 중요합니다.</p></blockquote><p>그러면 우리는 그들에게 묻습니다:</p><blockquote><p>— 오직 성경만 중요하다는 것, 또는 성경이 전승보다 더 중요하다는 것을 <strong>성경에서 보여 주기만 하십시오</strong>.</p></blockquote><p>그들은 이것을 보여 줄 수 없습니다. 성경에는 그런 말이 없기 때문입니다. 우리에게 이콘이나 성인들에게 드리는 기도에 관한 그런 구절을 보여 달라고 요구하면서, 그들은 모든 것이 오직 성경에 있어야 한다는 똑같은 종류의 구절을 보여 주지 못합니다. 그들은 자기 요구를 스스로 채우지 못하며 이중 잣대를 드러냅니다.</p><p>그들 스스로 이것을 지어냈고, 스스로 우리에게 모든 것을 성경에서 보여 달라고 요구하면서, 정작 자기 원리는 성경에서 보여 주지 못합니다.</p><p>이처럼 “솔라 스크립투라”라는 명제는 스스로 모순되며, 그것을 지어낸 이들을 사도적 믿음에 이르게 하지 못하고, 오히려 그리스도를 믿는 이들 사이에 수천 가지 새 믿음과 분열을 낳았습니다. 솔라 스크립투라는 그리스도의 교회에 낯선 사람이면 누구나 자기 말에 하느님의 권위를 입히고 자기 견해를 바탕으로 따로 단체를 모으려 할 때 쓰는 속임수로 인기를 얻었습니다.</p>'
