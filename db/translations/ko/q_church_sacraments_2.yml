  path: Pt8h_신품성사
  title: 신품성사
  copy_cover: true
  body: '<p>개역개정의 “감독”은 주교, “장로”는 사제, “집사”는 보제에 해당합니다.</p><h2>구약에서 하느님께서 세우신 사제직</h2><p>사제는 아론의 후손뿐입니다:</p><blockquote><p>“아론과 그의 아들들에게 띠를 띠우며 관을 씌워 <strong>그들에게 제사장의 직분을 맡겨 영원한 규례가 되게 하라</strong> 너는 이같이 아론과 그의 아들들에게 위임하여 거룩하게 할지니라” (<a href="https://bibleox.com/ko/ko-nkrv/ish/29/#L9">출 29:9</a>)</p></blockquote><p>사제직은 거룩한 옷과 함께 기름 부음으로 이어집니다:</p><blockquote><p>“<strong>아론의 성의는 후에 아론의 아들들에게 돌릴지니</strong> 그들이 그것을 입고 <strong>기름 부음으로 위임을 받을 것이며</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ish/29/#L29">출 29:29</a>)</p></blockquote><p>거룩한 봉사에 다가오는 외부인은 죽어야 했습니다. 사제직의 임무는 이를 지키는 것이었습니다:</p><blockquote><p>“너는 아론과 그의 아들들을 세워 제사장 직무를 행하게 하라 <strong>외인이 가까이 하면 죽임을 당할 것이니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/chis/3/#L10">민 3:10</a>)</p></blockquote><p>자세히:</p><blockquote><p>“<strong><mark>여호와께서 아론에게 이르시되</mark></strong> <strong>너와 네 아들들과</strong> 네 조상의 가문은 성소에 대한 죄를 함께 담당할 것이요 너와 네 아들들은 너희의 제사장 직분에 대한 죄를 함께 담당할 것이니라 너는 <strong>네 형제 레위 지파</strong> 곧 네 조상의 지파를 데려다가 너와 함께 있게 하여 너와 네 아들들이 증거의 장막 앞에 있을 때 <strong>그들이 너를 돕게 하라</strong> 레위인은 네 직무와 장막의 모든 직무를 지키려니와 성소의 기구와 제단에는 가까이 하지 못하리니 두렵건대 그들과 너희가 죽을까 하노라 &lt;…&gt; <strong><mark>너와 네 아들들은 제단과 휘장 안의 모든 일에 대하여 제사장의 직분을 지켜 섬기라 내가 제사장의 직분을 너희에게 선물로 주었은즉 거기 가까이 하는 외인은 죽임을 당할지니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/chis/18/#L1-3,7">민 18:1-3,7</a>)</p></blockquote><h2>신약에서 사제직이 바뀝니다</h2><p>주 예수 그리스도께서는 새 계약을 맺으시고(<a href="https://bibleox.com/ko/ko-nkrv/lk/22/#L20">눅 22:20</a>; <a href="https://bibleox.com/ko/ko-nkrv/evr/8/#L8">히 8:8</a>) 율법을 바꾸시며 사제직을 바꾸십니다(폐지가 아니라 바꾸십니다):</p><blockquote><p>“<strong>제사 직분이 바꾸어졌은즉 율법도 반드시 바꾸어지리니</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/evr/7/#L12">히 7:12</a>) <em>(“제사 직분”은 그리스어로 ἱερωσύνη, “사제직”입니다.)</em></p></blockquote><p>구세주께서는 사도들에게 성령을 보내시어 멜기세덱의 품계를 따르는 사제직의 위계를 세우시고, 친히 대사제가 되십니다:</p><blockquote><p>“그리로 앞서 가신 예수께서 <strong>멜기세덱의 반차를 따라 영원히 대제사장이 되어</strong> 우리를 위하여 들어 가셨느니라” (<a href="https://bibleox.com/ko/ko-nkrv/evr/6/#L20">히 6:20</a>)</p></blockquote><blockquote><p>“이 멜기세덱은 살렘 왕이요 지극히 높으신 하나님의 제사장이라 여러 왕을 쳐서 죽이고 돌아오는 아브라함을 만나 복을 빈 자라 아브라함이 모든 것의 십분의 일을 그에게 나누어 주니라 그 이름을 해석하면 먼저는 <strong>의의 왕</strong>이요 그 다음은 살렘 왕이니 곧 <strong>평강의 왕</strong>이요 아버지도 없고 어머니도 없고 족보도 없고 <strong>시작한 날도 없고 생명의 끝도 없어 하나님의 아들과 닮아서 항상 제사장으로 있느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/evr/7/#L1-3">히 7:1-3</a>)</p></blockquote><blockquote><p>“지금 우리가 하는 말의 요점은 이러한 대제사장이 우리에게 있다는 것이라 그는 <strong>하늘에서 지극히 크신 이의 보좌 우편에 앉으셨으니</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/evr/8/#L1">히 8:1</a>)</p></blockquote><h2>교회 위계의 형성</h2><p>오순절에 성령께서는 사도들과 온 교회 모임, 곧 온 교회에 파견되십니다. 그러나 그 전에 구세주께서는 사도들에게만 나타나시어 그들에게만 성령을 보내시고, 사제로서 죄를 용서할 권한을 주시며, 곧 위계를 세우십니다:</p><blockquote><p>“예수께서 또 이르시되 너희에게 평강이 있을지어다 아버지께서 나를 보내신 것 같이 나도 너희를 보내노라 이 말씀을 하시고 그들을 향하사 <strong>숨을 내쉬며</strong> 이르시되 <strong>성령을 받으라</strong> <strong>너희가 누구의 죄든지 사하면 사하여질 것이요 누구의 죄든지 그대로 두면 그대로 있으리라</strong> 하시니라” (<a href="https://bibleox.com/ko/ko-nkrv/in/20/#L21-23">요 20:21-23</a>)</p></blockquote><p>마찬가지로 구약의 교회에서도 죄를 깨끗하게 하는 일은 바로 사제직에 속했습니다:</p><blockquote><p>“이 중 하나에 허물이 있을 때에는 아무 일에 <strong>잘못하였노라 자복하고</strong> 그 잘못으로 말미암아 여호와께 속죄제를 드리되 양 떼의 암컷 어린 양이나 염소를 끌어다가 속죄제를 드릴 것이요 <strong>제사장은 그의 허물을 위하여 속죄할지니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/lev/5/#L5-6">레 5:5-6</a>)</p></blockquote><h2>새 위계의 권한</h2><p>주님께서는 사도들에게 하늘 나라의 열쇠와, 금하고 허락하는(매고 푸는) 권한을 주십니다:</p><blockquote><p>“내가 천국 열쇠를 네게 주리니 <strong>네가 땅에서 무엇이든지 매면 하늘에서도 매일 것이요 네가 땅에서 무엇이든지 풀면 하늘에서도 풀리리라</strong> 하시고” (<a href="https://bibleox.com/ko/ko-nkrv/mf/16/#L19">마 16:19</a>)</p></blockquote><blockquote><p>“진실로 너희에게 이르노니 <strong>무엇이든지 너희가 땅에서 매면 하늘에서도 매일 것이요 무엇이든지 땅에서 풀면 하늘에서도 풀리리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/18/#L18">마 18:18</a>)</p></blockquote><p>사도들이 사제들을 뽑아 서품했지만, 성경은 교회를 돌보도록 사제들을 세우신 분이 성령이시라고 말합니다:</p><blockquote><p>“바울이 밀레도에서 사람을 에베소로 보내어 <strong>교회 장로들을 청하니</strong> 오매 그들에게 말하되 아시아에 들어온 첫날부터 지금까지 내가 항상 여러분 가운데서 어떻게 행하였는지를 여러분도 아는 바니 &lt;…&gt; 여러분은 자기를 위하여 또는 온 양 떼를 위하여 삼가라 <strong>성령이 그들 가운데 여러분을 감독자로 삼고</strong> 하나님이 자기 피로 사신 <strong>교회를 보살피게 하셨느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/act/20/#L17-18,28">행 20:17-18,28</a>)</p></blockquote><p>이 모든 일은 구약 예언의 성취이며, 이에 관해서는 이어서 말합니다.</p><h2>신약의 사제직에 관한 예언</h2><p>구약의 교회에서 사제는 유다 백성의 레위 지파, 아론의 가문에서만 세워졌습니다. 그러나 신약의 교회에서 사제는 유다 백성(아론 가문)만이 아니라 모든 민족에서 세워질 것입니다:</p><blockquote><p>“내가 그들의 행위와 사상을 아노라 때가 이르면 <strong>뭇 나라와 언어가 다른 민족들을 모으리니</strong> 그들이 와서 나의 영광을 볼 것이며 내가 그들 가운데에서 징조를 세워서 그들 가운데에서 도피한 자를 여러 나라 곧 다시스와 뿔과 활을 당기는 룻과 및 두발과 야완과 또 <strong>나의 명성을 듣지도 못하고 나의 영광을 보지도 못한</strong> 먼 섬들로 보내리니 그들이 나의 영광을 뭇 나라에 전파하리라 나 여호와가 말하노라 이스라엘 자손이 예물을 깨끗한 그릇에 담아 여호와의 집에 드림 같이 그들이 너희 모든 형제를 뭇 나라에서 나의 성산 예루살렘으로 말과 수레와 교자와 노새와 낙타에 태워다가 여호와께 예물로 드릴 것이요 <strong>나는 그 가운데에서 택하여 제사장과 레위인을 삼으리라 여호와의 말이니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/is/66/#L18-21">사 66:18-21</a>)</p></blockquote><h2>사도적 계승과 서품에 관한 가르침</h2><h3>주교 서품</h3><p>디모데 주교에게는 사도의 안수와, 먼저 서품된 다른 주교들의 안수를 통한 특별한 은사가 있습니다:</p><blockquote><p>“그러므로 내가 <strong><mark>나의 안수함으로 네 속에 있는 하나님의 은사</mark></strong>를 다시 불일듯 하게 하기 위하여 너로 생각하게 하노니” (<a href="https://bibleox.com/ko/ko-nkrv/2tim/1/#L6">딤후 1:6</a>)</p></blockquote><blockquote><p>“<strong><mark>네 속에 있는 은사 곧 장로의 회에서 안수 받을 때에</mark></strong> 예언을 통하여 받은 것을 가볍게 여기지 말며” (<a href="https://bibleox.com/ko/ko-nkrv/1tim/4/#L14">딤전 4:14</a>)</p></blockquote><p>마술사 시몬은 모든 그리스도인이 성령을 주려고 손을 얹을 수 있는 것은 아님을 보았습니다. 글자 그대로 모두에게 그런 권한이 있는 것이 아닙니다. 그는 자기에게도 그런 권한을 달라고 사도들에게 뇌물을 가져왔습니다(사도들은 그를 저주했습니다):</p><blockquote><p>“시몬이 <strong>사도들의 안수로 성령 받는 것을 보고</strong> 돈을 드려 이르되 <strong>이 권능을 내게도 주어</strong> <strong><mark>누구든지 내가 안수하는 사람은 성령을 받게 하여 주소서</mark></strong> 하니 베드로가 이르되 네가 <strong><mark>하나님의 선물</mark></strong>을 돈 주고 살 줄로 생각하였으니 네 은과 네가 함께 망할지어다” (<a href="https://bibleox.com/ko/ko-nkrv/act/8/#L18-20">행 8:18-20</a>)</p></blockquote><h3>사도 바울의 서품</h3><blockquote><p>“주를 섬겨 금식할 때에 성령이 이르시되 내가 불러 시키는 일을 위하여 바나바와 사울을 따로 세우라 하시니 이에 금식하며 기도하고 <strong><mark>두 사람에게 안수하여 보내니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/act/13/#L2-3">행 13:2-3</a>)</p></blockquote><h3>보제 서품</h3><blockquote><p>“사도들 앞에 세우니 사도들이 기도하고 <strong>그들에게 안수하니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/act/6/#L6">행 6:6</a>; <a href="https://bibleox.com/ko/ko-nkrv/act/21/#L8">행 21:8</a>)</p></blockquote><h3>서품에 관한 가르침</h3><p>안수에 관한 사도의 가르침:</p><blockquote><p>“세례들과 안수와 죽은 자의 부활과 영원한 심판에 관한 <strong>교훈의 터</strong>를 다시 닦지 말고 완전한 데로 나아갈지니라” (<a href="https://bibleox.com/ko/ko-nkrv/evr/6/#L2">히 6:2</a>)</p></blockquote><p>서둘러 (사제로) 서품하지 말라는 경고:</p><blockquote><p>“<strong>아무에게나 경솔히 안수하지 말고</strong> 다른 사람의 죄에 간섭하지 말며 네 자신을 지켜 정결하게 하라” (<a href="https://bibleox.com/ko/ko-nkrv/1tim/5/#L22">딤전 5:22</a>)</p></blockquote><h2>주교와 사제의 차이</h2><p>주교(그리스어 ἐπίσκοπος, “감독자, 돌보는 이”)와 사제(그리스어 πρεσβύτερος, “장로, 공동체의 어른”)라는 말은 섞여 쓰이며 서로 바꾸어 쓸 수 있는 듯합니다. 그러나 어떻게 불리든 각 사람의 기능과 권한은 분명히 보입니다. 디도는 사도의 일을 마무리하고 그레데에 사제들을 세워야 했습니다:</p><blockquote><p>“내가 너를 그레데에 남겨 둔 이유는 남은 일을 정리하고 내가 명한 대로 <strong>각 성에 장로들을 세우게</strong> 하려 함이니” (<a href="https://bibleox.com/ko/ko-nkrv/tit/1/#L5">딛 1:5</a>)</p></blockquote><p>디모데는 자기 사제들을 재판하고, 믿는 이들을 꾸짖고 금할 수 있었습니다:</p><blockquote><p>“<strong>장로에 대한 고발</strong>은 두세 증인이 없으면 받지 말 것이요” (<a href="https://bibleox.com/ko/ko-nkrv/1tim/5/#L19">딤전 5:19</a>)</p></blockquote><blockquote><p>“너는 말씀을 전파하라 때를 얻든지 못 얻든지 항상 힘쓰라 범사에 오래 참음과 가르침으로 <strong>경책하며 경계하며 권하라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2tim/4/#L2">딤후 4:2</a>)</p></blockquote><p>그러므로 디도와 디모데는 사제라고 불렸더라도 오늘날의 뜻으로 주교였습니다.</p><h2>모두가 사제인가?</h2><h3>구약의 말씀과의 대응</h3><p>사도 베드로는 구약의 말씀을 되풀이하여 모든 그리스도인을 왕의 사제이자 거룩한 겨레라고 부릅니다:</p><blockquote><p>“그러나 너희는 <strong>택하신 족속이요 왕 같은 제사장들이요 거룩한 나라요</strong> 그의 소유가 된 백성이니 이는 너희를 어두운 데서 불러 내어 그의 기이한 빛에 들어가게 하신 이의 아름다운 덕을 선포하게 하려 하심이라” (<a href="https://bibleox.com/ko/ko-nkrv/1pet/2/#L9">벧전 2:9</a>)</p></blockquote><p>구약에서 같은 말씀이 온 이스라엘에게 주어집니다:</p><blockquote><p>“세계가 다 내게 속하였나니 너희가 내 말을 잘 듣고 내 언약을 지키면 너희는 모든 민족 중에서 내 소유가 되겠고 <strong>너희가 내게 대하여 제사장 나라가 되며 거룩한 백성이 되리라</strong> 너는 이 말을 이스라엘 자손에게 전할지니라” (<a href="https://bibleox.com/ko/ko-nkrv/ish/19/#L5-6">출 19:5-6</a>)</p></blockquote><p>이처럼 하느님께서는 이미 구약의 이스라엘을 사제의 나라, 거룩한 백성이라 부르십니다. 그러나 전례적인 뜻에서 모든 유대인이 사제였던 것은 아닙니다. 율법에 따르면 아론의 사제직만 성막에 들어갈 수 있었고, 다른 이들은 성막에 들어가면 목숨으로 값을 치러야, 곧 죽어야 했습니다(<a href="https://bibleox.com/ko/ko-nkrv/chis/3/#L10">민 3:10</a>; <a href="https://bibleox.com/ko/ko-nkrv/chis/3/#L38">민 3:38</a>; <a href="https://bibleox.com/ko/ko-nkrv/chis/18/#L7">민 18:7</a>).</p><p>구약에서 “사제의 나라”(모두가 아님)와 “거룩한 백성”(모두)을 구별한다면, 신약의 사도 말씀에서도 같은 구별을 인정해야 합니다. 왕의 사제(모두가 아님), 거룩한 겨레(모두)입니다(<a href="https://bibleox.com/ko/ko-nkrv/1pet/2/#L9">벧전 2:9</a>). 이 말씀은 글자 그대로든 비유로든 이해할 수 있지만, 어떤 경우든 두 표현을 연결하여 같은 방식으로 이해해야 합니다.</p><h3>구약에서 만인 사제직을 세우려는 시도</h3><p>구약에서 하느님께서는 아론의 후손만 사제가 될 수 있는 질서를 세우셨습니다:</p><blockquote><p>“아론의 성의는 후에 아론의 아들들에게 돌릴지니 그들이 그것을 입고 기름 부음으로 위임을 받을 것이며” (<a href="https://bibleox.com/ko/ko-nkrv/ish/29/#L29">출 29:29</a>)</p></blockquote><p>아론의 가문에서도 모두가 사제가 될 수는 없었습니다:</p><blockquote><p>“<strong>제사장 아론의 자손 중에 흠이 있는 자는 나와 여호와께 화제를 드리지 못할지니</strong> 그는 흠이 있은즉 나와서 그의 하나님께 음식을 드리지 못하느니라 &lt;…&gt; 휘장 안에 들어가지 못할 것이요 제단에 가까이 하지 못할지니 이는 그가 흠이 있음이니라 이와 같이 그가 <strong>내 성소를 더럽히지 못할 것은</strong> 나는 그들을 거룩하게 하는 여호와임이니라” (<a href="https://bibleox.com/ko/ko-nkrv/lev/21/#L21,23">레 21:21,23</a>)</p></blockquote><p>이 하느님의 질서에 <strong>고라, 다단, 아비람, 온</strong>이 맞서서, 아론의 가문에서만이 아니라 온 백성에서 사제를 세우라고 예언자 모세에게 요구했습니다. 그들은 바로 그 표현(<a href="https://bibleox.com/ko/ko-nkrv/ish/19/#L5-6">출 19:5-6</a>)을 근거로 모두가 거룩하다고 말했습니다:</p><blockquote><p>“그들이 모여서 모세와 아론을 거슬러 그들에게 이르되 너희가 분수에 지나도다 <strong>회중이 다 각각 거룩하고 여호와께서도 그들 중에 계시거늘</strong> 너희가 어찌하여 여호와의 총회 위에 스스로 높이느냐” (<a href="https://bibleox.com/ko/ko-nkrv/chis/16/#L3">민 16:3</a>)</p></blockquote><blockquote><p>“하나님이 너와 네 모든 형제 레위 자손으로 너와 함께 가까이 오게 하셨거늘 <strong>너희가 오히려 제사장의 직분을 구하느냐</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/chis/16/#L10">민 16:10</a>)</p></blockquote><p>그 뒤 하느님의 영광이 나타나고 땅이 반역자들을 삼켰습니다:</p><blockquote><p>“고라가 온 회중을 회막 문에 모아 놓고 그 두 사람을 대적하려 하매 여호와의 영광이 온 회중에게 나타나시니라 여호와께서 모세와 아론에게 말씀하여 이르시되 너희는 이 회중에게서 떠나라 <strong>내가 순식간에 그들을 멸하려 하노라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/chis/16/#L19-21">민 16:19-21</a>)</p></blockquote><p>하느님께서는 반역자들의 제물을 향로에서 쏟아 버리고, 향로로 제단 덮개를 만들어 후대에 기억하게 하라고 말씀하셨습니다:</p><blockquote><p>“너는 제사장 아론의 아들 엘르아살에게 명령하여 붙는 불 가운데에서 향로를 가져다가 <strong>그 불을 다른 곳에 쏟으라</strong> 그 향로는 거룩함이니라 사람들은 범죄하여 그들의 생명을 스스로 해하였거니와 그들이 향로를 여호와 앞에 드렸으므로 그 향로가 거룩하게 되었나니 그 향로를 쳐서 제단을 싸는 철판을 만들라 <strong>이스라엘 자손에게 표가 되리라</strong> 하신지라” (<a href="https://bibleox.com/ko/ko-nkrv/chis/16/#L37-38">민 16:37-38</a>)</p></blockquote><blockquote><p>“<strong>그들에게 일어난 이런 일은</strong> 본보기가 되고 또한 말세를 만난 <strong>우리를 깨우치기 위하여</strong> <strong>기록되었느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/10/#L11">고전 10:11</a>)</p></blockquote><p>사도 유다도 고라의 파멸을 부른 고집을 떠올립니다:</p><blockquote><p>“화 있을진저 이 사람들이여, 가인의 길에 행하였으며 삯을 위하여 발람의 어그러진 길로 몰려 갔으며 <strong>고라의 패역을 따라 멸망을 받았도다</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/iud/1/#L11">유 1:11</a>)</p></blockquote><p>마지막 때에 이런 사람들이 일어나리라는 예언도 있습니다:</p><blockquote><p>“때가 이르리니 사람이 바른 교훈을 받지 아니하며 <strong>귀가 가려워서 자기의 사욕을 따를 스승을 많이 두고</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2tim/4/#L3">딤후 4:3</a>)</p></blockquote><h3>신약에서 사제를 세운다는 예언</h3><p>구약에 이미 신약에서도 사제와 봉사자가 세워지되, 아론의 가문에서만이 아니라 모든 민족에서 세워지리라는 예언이 있습니다:</p><blockquote><p>“내가 그들의 행위와 사상을 아노라 때가 이르면 <strong>뭇 나라와 언어가 다른 민족들을 모으리니</strong> 그들이 와서 나의 영광을 볼 것이며 내가 그들 가운데에서 징조를 세워서 그들 가운데에서 도피한 자를 여러 나라 곧 다시스와 뿔과 활을 당기는 룻과 및 두발과 야완과 또 나의 명성을 듣지도 못하고 나의 영광을 보지도 못한 먼 섬들로 보내리니 그들이 나의 영광을 뭇 나라에 전파하리라 나 여호와가 말하노라 이스라엘 자손이 예물을 깨끗한 그릇에 담아 여호와의 집에 드림 같이 그들이 너희 모든 형제를 뭇 나라에서 나의 성산 예루살렘으로 말과 수레와 교자와 노새와 낙타에 태워다가 여호와께 예물로 드릴 것이요 <strong>나는 그 가운데에서 택하여 제사장과 레위인을 삼으리라 여호와의 말이니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/is/66/#L18-21">사 66:18-21</a>)</p></blockquote><p>신약은 아무도 사제직을 스스로 취할 수 없다고 가리킵니다:</p><blockquote><p>“대제사장마다 사람 가운데서 택한 자이므로 <strong>하나님께 속한 일에 사람을 위하여</strong> 예물과 속죄하는 제사를 드리게 하나니 그가 무식하고 미혹된 자를 능히 용납할 수 있는 것은 자기도 연약에 휩싸여 있음이라 그러므로 백성을 위하여 속죄제를 드림과 같이 또한 자신을 위하여도 드리는 것이 마땅하니라 <strong>이 존귀는 아무도 스스로 취하지 못하고 오직 아론과 같이</strong> 하나님의 부르심을 받은 자라야 할 것이니라 또한 이와 같이 <strong>그리스도께서 대제사장 되심도 스스로 영광을 취하심이 아니요</strong> 오직 말씀하신 이가 그에게 이르시되 너는 내 아들이니 내가 오늘 너를 낳았다 하셨고” (<a href="https://bibleox.com/ko/ko-nkrv/evr/5/#L1-5">히 5:1-5</a>)</p></blockquote><h3>믿고 세례를 받은 마술사 시몬에게는 성령의 은사를 주는 은사가 없습니다</h3><p>기록된 대로 마술사 시몬은 믿고 세례를 받았습니다:</p><blockquote><p>“<strong>시몬도 믿고 세례를 받은 후에</strong> 전심으로 빌립을 따라다니며 그 나타나는 표적과 큰 능력을 보고 놀라니라” (<a href="https://bibleox.com/ko/ko-nkrv/act/8/#L13">행 8:13</a>)</p></blockquote><p>그러나 모든 그리스도인이 성령의 은사를 줄 수 있는 것이 아님을 알자 그는 사도들에게서 이 은사를 사려 했습니다. 사도들은 그 때문에 그를 저주했습니다:</p><blockquote><p>“<strong><mark>시몬이 사도들의 안수로 성령 받는 것을 보고 돈을 드려 이르되 이 권능을 내게도 주어 누구든지 내가 안수하는 사람은 성령을 받게 하여 주소서</mark></strong> 하니 베드로가 이르되 <strong><mark>네가 하나님의 선물을 돈 주고 살 줄로 생각하였으니 네 은과 네가 함께 망할지어다</mark></strong> 하나님 앞에서 네 마음이 바르지 못하니 이 도에는 네가 관계도 없고 분깃 될 것도 없느니라 그러므로 너의 이 악함을 회개하고 주께 기도하라 혹 마음에 품은 것을 사하여 주시리라 내가 보니 너는 악독이 가득하며 불의에 매인 바 되었도다” (<a href="https://bibleox.com/ko/ko-nkrv/act/8/#L18-23">행 8:18-23</a>)</p></blockquote><p>이로써 모든 그리스도인이 성령을 줄 권한과 하느님의 은사를 지닌 사제가 아니었음이 분명합니다. 사마리아 사람들에게 세례를 준 보제 빌립에게도 이 은사가 없었습니다(<a href="https://bibleox.com/ko/ko-nkrv/act/21/#L8">행 21:8</a>). 이 은사를 지닌 이들은 사도들의 안수(<a href="https://bibleox.com/ko/ko-nkrv/2tim/1/#L6">딤후 1:6</a>)와 사제단의 안수(<a href="https://bibleox.com/ko/ko-nkrv/1tim/4/#L14">딤전 4:14</a>)를 통해 받았습니다.</p><p>그러므로:</p><ul><li><p>모두가 가르치고 세례를 주라는 사명을 받은 것은 아닙니다: “너희는 <strong>가서</strong> 이 세상 모든 사람들을 <strong>내 제자로 삼아</strong> 아버지와 아들과 성령의 이름으로 그들에게 <strong>세례를 베풀고</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/28/#L19">마 28:19</a>)</p></li><li><p>모두가 이런 명령을 받은 것은 아닙니다: “나를 기념하여 <strong>이 예식을 행하여라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/lk/22/#L19">눅 22:19</a>; <a href="https://bibleox.com/ko/ko-nkrv/1kor/11/#L24">고전 11:24</a>)</p></li><li><p>모두에게 매고 푸는 권한이 주어진 것은 아닙니다: “너희가 무엇이든지 땅에서 <strong>매면</strong> 하늘에도 매어 있을 것이며 땅에서 <strong>풀면</strong> 하늘에도 풀려 있을 것이다” (<a href="https://bibleox.com/ko/ko-nkrv/mf/18/#L18">마 18:18</a>)</p></li><li><p>모두에게 죄를 용서하고 그대로 두는 권한이 주어진 것은 아닙니다: “누구의 죄든지 너희가 <strong>용서해 주면</strong> 그들의 죄는 용서받을 것이고 <strong>용서해 주지 않으면</strong> 용서받지 못한 채 남아 있을 것이다” (<a href="https://bibleox.com/ko/ko-nkrv/in/20/#L23">요 20:23</a>)</p></li><li><p>모두에게 성령을 주려고 손을 얹는 권한이 주어진 것은 아닙니다: “<strong>사도들이 손을 얹어 성령을 받게 하는</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/act/8/#L18">행 8:18</a>)</p></li><li><p>사도는 바로 사제들을 부르라고 명합니다. 그들의 기도와 거룩한 행위(기름을 발랐습니다)를 통해 병자의 죄가 용서받을 수 있습니다: “너희 중에 <strong>병든 자가 있느냐 그는 교회의 장로들을 청할 것이요</strong> 그들은 주의 이름으로 <strong>기름을 바르며 그를 위하여 기도할지니라</strong> 믿음의 기도는 병든 자를 구원하리니 주께서 그를 일으키시리라 <strong>혹시 죄를 범하였을지라도 사하심을 받으리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/iak/5/#L14-15">약 5:14-15</a>)</p></li></ul><h2>왕의 사제직은 어떻게 이해해야 합니까?</h2><p>구약에서나 신약에서나 믿는 이는 저마다 자기 성전, 곧 자기 몸에서 사제가 되도록 부름받습니다. <a href="https://bibleox.com/ru/ru/w/человек-храм-Божий">사람은 하느님의 성전</a>이며, 사제는 이 성전에서 하느님께 제사를 바치는 사람입니다. 사도 베드로는 왕의 사제직을 말하기 전에 바로 이 생각으로 시작합니다:</p><blockquote><p>“너희도 <strong><mark>산 돌 같이 신령한 집으로 세워지고</mark></strong> 예수 그리스도로 말미암아 하나님이 기쁘게 받으실 신령한 제사를 드릴 <strong><mark>거룩한 제사장이 될지니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1pet/2/#L5">벧전 2:5</a>)</p></blockquote><p>사도 베드로는 왕의 사제직을 말하면서 같은 편지에서 목자들과 그들에게 순종해야 함을 말합니다:</p><blockquote><p>“젊은 자들아 이와 같이 <strong>장로들에게 순종하고</strong> 다 서로 겸손으로 허리를 동이라 <strong>하나님은 교만한 자를 대적하시되 겸손한 자들에게는 은혜를 주시느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1pet/5/#L5">벧전 5:5</a>)</p></blockquote><p>그리스도인을 사제라고 부르는 말씀이 하나 더 있습니다:</p><blockquote><p>“또 충성된 증인으로 죽은 자들 가운데에서 먼저 나시고 땅의 임금들의 머리가 되신 예수 그리스도로 말미암아 은혜와 평강이 너희에게 있기를 원하노라 우리를 사랑하사 그의 피로 우리 죄에서 우리를 해방하시고 그의 아버지 하나님을 위하여 <strong>우리를 나라와 제사장으로 삼으신</strong> 그에게 영광과 능력이 세세토록 있기를 원하노라 아멘” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/1/#L5-6">계 1:5-6</a>; <a href="https://bibleox.com/ko/ko-nkrv/otkr/5/#L9-10">계 5:9-10</a>; <a href="https://bibleox.com/ko/ko-nkrv/otkr/20/#L6">계 20:6</a>)</p></blockquote><p>그리스도인이 왕인 그 뜻으로 그는 사제이기도 합니다. 지금 외부 사람들을 다스리지 않는다면, 외부 사람들에게 사제인 것도 아닙니다. 이런 설명은 문맥에 정직하고 상식에도 맞습니다.</p><p>그리스도인은 자기 몸을 다스리고, 정신을 몸의 욕망 위에 세우며, 하느님의 이 성전(몸과 마음)을 깨끗하게 하고, 거기서 하느님 마음에 드는 제사, 곧 깨끗한 생각과 말과 행실, 기도와 찬양을 바치도록 부름받습니다.</p><h2>사제에 대한 존경</h2><blockquote><p>“잘 다스리는 장로들은 <strong>배나 존경할 자로 알되</strong> 말씀과 가르침에 수고하는 이들에게는 더욱 그리할 것이니라” (<a href="https://bibleox.com/ko/ko-nkrv/1tim/5/#L17">딤전 5:17</a>)</p></blockquote><blockquote><p>“온 마음으로 주님을 두려워하고 <strong>그분의 사제들을 공경하여라</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/prsir/7/#L29">집회 7:29</a>, 그리스어에서 번역)</p></blockquote><blockquote><p>“주님을 두려워하고 <strong>사제를 영화롭게 하여라</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/prsir/7/#L31">집회 7:31</a>, 그리스어에서 번역)</p></blockquote><h2>사제직에 순종해야 합니다</h2><blockquote><p>“<strong><mark>너희를 인도하는 자들에게 순종하고 복종하라 그들은 너희 영혼을 위하여 경성하기를</mark></strong> 자신들이 청산할 자인 것 같이 하느니라 그들로 하여금 즐거움으로 이것을 하게 하고 근심으로 하게 하지 말라 그렇지 않으면 너희에게 유익이 없느니라” (<a href="https://bibleox.com/ko/ko-nkrv/evr/13/#L17">히 13:17</a>)</p></blockquote><blockquote><p>“젊은 자들아 이와 같이 <strong><mark>장로들에게 순종하고</mark></strong> 다 서로 겸손으로 허리를 동이라 <strong>하나님은 교만한 자를 대적하시되 겸손한 자들에게는 은혜를 주시느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1pet/5/#L5">벧전 5:5</a>)</p></blockquote><p>구약에서 사제이자 재판관에게 불순종하는 것은 죽을죄입니다:</p><blockquote><p>“사람이 만일 무법하게 행하고 <strong>네 하나님 여호와 앞에 서서 섬기는 제사장이나 재판장에게 듣지 아니하거든 그 사람을 죽여</strong> 이스라엘 중에서 악을 제하여 버리라” (<a href="https://bibleox.com/ko/ko-nkrv/vtor/17/#L12">신 17:12</a>)</p></blockquote><h2>비판</h2><h3>안수로 성령께서 내려오신다는 것은 시몬의 인식일 뿐인가?</h3><p>정교인들은 안수를 통해 성령을 주는 특별한 은사에 관한 성경 구절을 보여 줍니다. 그 가운데 마술사 시몬의 경우가 있습니다.</p><p>마술사 시몬은 모든 그리스도인이 성령을 주려고 손을 얹을 수 있는 것은 아님을 보았습니다. 글자 그대로 모두에게 그런 권한이 있는 것이 아닙니다. 그는 자기에게도 그런 권한을 달라고 사도들에게 뇌물을 가져왔습니다(사도들은 그를 저주했습니다):</p><blockquote><p>“시몬이 <strong>사도들의 안수로 성령 받는 것을 보고</strong> 돈을 드려 이르되 <strong>이 권능을 내게도 주어</strong> <strong><mark>누구든지 내가 안수하는 사람은 성령을 받게 하여 주소서</mark></strong> 하니 베드로가 이르되 네가 <strong><mark>하나님의 선물</mark></strong>을 돈 주고 살 줄로 생각하였으니 네 은과 네가 함께 망할지어다” (<a href="https://bibleox.com/ko/ko-nkrv/act/8/#L18-20">행 8:18-20</a>)</p></blockquote><p>비판자들은 이것이 마술사 시몬의 잘못된 인식일 뿐이라고 말합니다. 그는 마술사여서 모든 것을 잘못 이해했다는 것입니다.</p><p>그러면 사도 바울도 마술사였습니까?</p><blockquote><p>“그러므로 내가 <strong><mark>나의 안수함으로 네 속에 있는 하나님의 은사</mark></strong>를 다시 불일듯 하게 하기 위하여 너로 생각하게 하노니” (<a href="https://bibleox.com/ko/ko-nkrv/2tim/1/#L6">딤후 1:6</a>)</p></blockquote><blockquote><p>“<strong><mark>네 속에 있는 은사 곧 장로의 회에서 안수 받을 때에</mark></strong> 예언을 통하여 받은 것을 가볍게 여기지 말며” (<a href="https://bibleox.com/ko/ko-nkrv/1tim/4/#L14">딤전 4:14</a>)</p></blockquote><p>사도는 하느님의 은사가 자기의 안수를 통해 있다고 직접 말합니다.</p><p>다시 시몬의 경우로 돌아갑시다. 사도행전의 이 이야기는 복음사가 누가가 씁니다(<a href="https://bibleox.com/ko/ko-nkrv/lk/1/#L3">눅 1:3</a>; <a href="https://bibleox.com/ko/ko-nkrv/act/1/#L1">행 1:1</a>). 그는 마술사 시몬이 사건을 잘못 이해했다고 쓰는 것이 아니라 시몬이 보았다고 씁니다. 무엇을 보았습니까? 복음사가 누가가 씁니다. “사도들이 손을 얹어 성령을 받게 하는 것을” 보았습니다. 이것은 시몬의 말이 아니라 복음사가 누가의 말입니다. 또 사도 베드로의 말을 보면 실제로 그러하다는 것이 분명합니다. 사도는 이 하느님의 선물을 줄 수 있으며, 그가 시몬을 비난하는 것은 바로 <strong>하느님의 선물</strong>을 <strong>돈으로</strong> 얻으려 했기 때문입니다.</p><h3>사도 바울은 사람을 통해 서품받지 않았는가?</h3><p>정교인들은 사도 바울이 교회를 통해 직무에 서품되었음을 보여 줍니다:</p><blockquote><p>“주를 섬겨 금식할 때에 성령이 이르시되 내가 불러 시키는 일을 위하여 바나바와 사울을 따로 세우라 하시니 이에 금식하며 기도하고 <strong><mark>두 사람에게 안수하여 보내니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/act/13/#L2-3">행 13:2-3</a>)</p></blockquote><p>비판자들은 사도 바울이 사람에게서 서품받지 않았다고 반박하며 이 구절을 듭니다:</p><blockquote><p>“<strong><mark>사람들에게서 난 것도 아니요 사람으로 말미암은 것도 아니요</mark></strong> 오직 예수 그리스도와 그를 죽은 자 가운데서 살리신 하나님 아버지로 말미암아 사도 된 바울은” (<a href="https://bibleox.com/ko/ko-nkrv/gal/1/#L1">갈 1:1</a>)</p></blockquote><p>그러나 이 주장은 근거가 없습니다. 여기서는 선택의 방식만 말할 뿐, 하느님의 은사를 주는 일을 말하지 않습니다.</p><p>사울에게 손을 얹기 전에 그를 택하시고 성령께서 그를 부르신 직무를 위해 따로 세우라고 교회에 명하시는 분은 실제로 성령이십니다. 비판자들이 왜 이 구절을 드는지 알 수 없습니다. 모순이 없기 때문입니다. 사울은 사람에게서도 사람을 통해서도 택함을 받지 않았고, 성령께서 친히 그를 택하시어 직무를 위해 따로 세우라고 교회에 명하셨으며, 그 뒤 교회가 사울을 서품합니다:</p><blockquote><p>“주를 섬겨 금식할 때에 <strong><mark>성령이</mark></strong> 이르시되 내가 불러 시키는 일을 위하여 <strong><mark>바나바와 사울을 따로 세우라</mark></strong> 하시니 이에 금식하며 기도하고 <strong><mark>두 사람에게 안수하여 보내니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/act/13/#L2-3">행 13:2-3</a>)</p></blockquote><p>그러므로 선택은 성령께서 하시고, 은총은 교회 없이가 아니라 교회를 통해, 곧 교회 봉사자들의 안수를 통해 파견됩니다.</p><p>비판자들은 자기들이 세운 공동체가 첫 그리스도인들과 직접적인 연결이 없다는 것과, 자기들끼리 목자와 교사를 뽑는 것을 정당화하려 합니다. 하느님께 교회를 이끌고 가르칠 권한을 받지 못한 사람들이 누구에게도 그런 권한을 줄 수 없음은 분명합니다. 그러나 그들에게는 성령께서 그렇게 하실 수 있었다는 것, 곧 그들 이전에 이미 있던 교회와 아무 연결 없이 그들의 목자를 직무에 세우실 수 있었다는 것을 보이는 일이 중요합니다.</p><p>그러나 성령께서는 원하시는 대로 무엇이든 하실 자유가 있지만, 성경에서 하느님께서 그리스도께서 세우신 하나의 눈에 보이는 교회와 따로 사람들을 직무에 세우시고 구원하신 경우는 하나도 없습니다.</p><p>하느님께서는 사울을 택하셨고 친히 직무에 세우실 수 있었음이 틀림없지만, 당신의 교회 없이 그렇게 하지 않으셨습니다. 첫 이방인들, 곧 에티오피아 내시(<a href="https://bibleox.com/ko/ko-nkrv/act/8/#L27">행 8:27</a>)와 백인대장 고넬료(<a href="https://bibleox.com/ko/ko-nkrv/act/10/#L1">행 10:1</a>)의 세례에서도 같습니다.</p><ol><li><p>에티오피아 내시는 성경을 읽었지만 이해하지 못했습니다. <strong>하느님께서는 친히</strong> 내시를 가르치시고 세례의 구원하는 은총을 주실 수 있었지만, <strong>교회와 따로 그렇게 하지 않으십니다</strong>. 하느님께서는 내시에게 교회를 보내시고, 교회가 그에게 성경을 이해하도록 가르치고 세례에서 은총을 줍니다.</p></li><li><p>백인대장 고넬료는 하느님께 기도하고 선행을 했습니다. <strong>하느님께서는 친히</strong> 고넬료에게 구원하는 은총을 주실 수 있었지만, <strong>교회와 따로 그렇게 하지 않으십니다</strong>. 그 대신 그에게 천사를 보내시어 교회(사도 베드로의 모습으로)를 찾으라고 명하십니다. 사도가 온 뒤에야 성령께서 고넬료에게 오십니다. 사도 없이 더 일찍 오실 수도 있었지만 그렇게 하지 않으셨습니다.</p></li><li><p>그리스도인을 박해하던 사울(훗날의 사도 바울)은 그리스도인을 박해하러 다메섹으로 갑니다. 그리스도께서 눈부신 빛으로 나타나시고, 사울은 무엇을 해야 하는지 묻습니다. <strong>하느님이신 그리스도께서는 친히</strong> 사울에게 은총을 주실 수 있었지만, <strong>교회와 따로 그렇게 하지 않으시고</strong>, 다메섹에서 교회(사도 아나니아의 모습으로)를 찾으라고 명하십니다. 그곳에서 교회를 통해서만 사도는 치유(<a href="https://bibleox.com/ko/ko-nkrv/act/9/#L17">행 9:17</a>)와 성령의 은총(<a href="https://bibleox.com/ko/ko-nkrv/act/9/#L17">행 9:17</a>)과 죄를 씻어 준 세례의 구원하는 은총(<a href="https://bibleox.com/ko/ko-nkrv/act/22/#L16">행 22:16</a>)을 받습니다.</p></li></ol><p>사울을 특별한 사도직에 서품한 일도 다른 경우와 모두 같습니다. 하느님께서 친히 사울을 택하시고 당신의 은사를 친히 주실 수 있었지만, 당신의 교회와 따로 그렇게 하지 않으십니다. 성령께서 교회에 말씀하시고 교회가 사울을 서품합니다(<a href="https://bibleox.com/ko/ko-nkrv/act/13/#L2-3">행 13:2-3</a>).</p><p>그러므로 교회와 따로 자기 목자들이 특별히 부름받았다는 분리된 단체들의 주장은 모두 성경에 근거가 없습니다. 성경에는 그런 경우가 전혀 없습니다.</p><h3>안수는 이교에서 빌려 왔다</h3><p>자기 나름대로 교회를 세운 사람들은 먼저 그리스도께서 단번에 세우신 교회가 타락했다고 증명해야 합니다. 교회가 타락하지 않았다면 그들의 새 공동체는 필요 없고 그리스도의 교회에 들어가면 되기 때문입니다. 교회의 타락을 증명하려고 되도록 무서운 “딱지 붙이기”를 자주 합니다. 그래서 교회가 이교의 관습을 빌려 와 하느님에게서 이교로 떨어져 나갔다고 자주 비난합니다. 그런 관습으로 다음을 듭니다:</p><ul><li><p>거룩한 성당의 존재,</p></li><li><p>거룩한 장소,</p></li><li><p>거룩한 물건,</p></li><li><p>거룩한 형상,</p></li><li><p>특별한 거룩한 사람들(사제),</p></li><li><p>거룩한 예식과 성사(하느님께 영향을 주는 처방이라고 합니다), 그 가운데 안수.</p></li></ul><p>이것은 몹시 어처구니없는 비난입니다. 이 모든 것은 하느님께서 친히 세우셨고 성경에 분명히 기록되어 있기 때문입니다. 교회에 딱지를 붙이려고 이교도를 끌어들인 것입니다. 이 모든 거룩한 건물, 장소, 물건, 행위, 사람들은 구약과 신약의 성경에 있으며, 별도의 글에서 알아볼 수 있습니다:</p><ul><li><p><a href="https://bibleox.com/ru/ru/w/святыня">거룩한 것들</a></p></li></ul><h4>구약의 안수</h4><p>야곱은 기도하며 손자들에게 손을 얹어 축복했습니다:</p><blockquote><p>“이스라엘이 <strong><mark>오른손을 펴서 차남 에브라임의 머리에 얹고</mark></strong> <strong><mark>왼손을 펴서 므낫세의 머리에 얹으니</mark></strong> 므낫세는 장자라도 팔을 엇바꾸어 얹었더라 그가 요셉을 위하여 <strong><mark>축복하여</mark></strong> 이르되 내 조부 아브라함과 아버지 이삭이 섬기던 하나님, 나의 출생으로부터 지금까지 나를 기르신 하나님, 나를 모든 환난에서 건지신 <strong><mark>여호와의 사자께서 이 아이들에게 복을 주시오며</mark></strong> 이들로 내 이름과 내 조상 아브라함과 이삭의 이름으로 칭하게 하시오며 이들이 세상에서 번식되게 하시기를 원하나이다” (<a href="https://bibleox.com/ko/ko-nkrv/gen/48/#L14-16">창 48:14-16</a>)</p></blockquote><p>하느님께서는 예언자 모세에게 안수로 눈의 아들 여호수아를 직무에 세우라고 명하셨습니다:</p><blockquote><p>“<strong><mark>여호와께서 모세에게 이르시되</mark></strong> 눈의 아들 여호수아는 그 안에 영이 머무는 자니 너는 <strong><mark>데려다가 그에게 안수하고</mark></strong> &lt;…&gt; 모세가 여호와께서 자기에게 명령하신 대로 하여 여호수아를 데려다가 제사장 엘르아살과 온 회중 앞에 세우고 <strong><mark>그에게 안수하여 위탁하되</mark></strong> 여호와께서 모세에게 명령하신 대로 하였더라” (<a href="https://bibleox.com/ko/ko-nkrv/chis/27/#L18,22-23">민 27:18,22-23</a>)</p></blockquote><blockquote><p>“<strong><mark>모세가 눈의 아들 여호수아에게 안수하였으므로 그에게 지혜의 영이 충만하니</mark></strong> 이스라엘 자손이 여호와께서 모세에게 명령하신 대로 여호수아의 말을 순종하였더라” (<a href="https://bibleox.com/ko/ko-nkrv/vtor/34/#L9">신 34:9</a>)</p></blockquote><p>하느님께서는 레위인들을 안수로 성소의 봉사에 세우라고 명하셨습니다:</p><blockquote><p>“레위인을 여호와 앞에 나오게 하고 <strong><mark>이스라엘 자손이 그들에게 안수하게 한 후에</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/chis/8/#L10">민 8:10</a>)</p></blockquote><h4>신약의 안수</h4><blockquote><p>“그러므로 내가 <strong><mark>나의 안수함으로 네 속에 있는 하나님의 은사</mark></strong>를 다시 불일듯 하게 하기 위하여 너로 생각하게 하노니” (<a href="https://bibleox.com/ko/ko-nkrv/2tim/1/#L6">딤후 1:6</a>)</p></blockquote><blockquote><p>“<strong><mark>네 속에 있는 은사 곧 장로의 회에서 안수 받을 때에</mark></strong> 예언을 통하여 받은 것을 가볍게 여기지 말며” (<a href="https://bibleox.com/ko/ko-nkrv/1tim/4/#L14">딤전 4:14</a>)</p></blockquote><blockquote><p>“세례들과 안수와 죽은 자의 부활과 영원한 심판에 관한 <strong><mark>교훈의 터</mark></strong>를 다시 닦지 말고 완전한 데로 나아갈지니라” (<a href="https://bibleox.com/ko/ko-nkrv/evr/6/#L2">히 6:2</a>)</p></blockquote><p>성경을 살펴보면 교회가 사도들 뒤에 이런 관습과 태도를 이교도에게서 가져왔다는 비난이 놀랍습니다. 사도들 자신이 자기들의 안수를 통해 주어진 하느님의 은사를 쓰며 이를 가르침의 일부로 말하기 때문입니다. 이 모든 것은 (방식 자체도) 새로운 것이 아니라, 사도들 이전에 같은 환경에서 수백 년 동안 있었고 이교도가 아니라 하느님께서 친히 세우신 것입니다.</p><h3>신약에서는 사제라고 부르지 않았는가?</h3><p>“사제직”이라는 말은 신약의 문맥에 나옵니다. 그리스도께서는 사제직을 폐지하신 것이 아니라 바꾸셨습니다:</p><blockquote><p>“<strong><mark>제사 직분이 바꾸어졌은즉</mark></strong> 율법도 반드시 바꾸어지리니” (<a href="https://bibleox.com/ko/ko-nkrv/evr/7/#L12">히 7:12</a>) <em>(그리스어: ἱερωσύνη, “사제직”)</em></p></blockquote><p>그리스도께서는 영원한 대사제가 되셨지만 사제들은 폐지되지 않았습니다. 그들을 뽑아 세우는 일은 예언에 나옵니다:</p><blockquote><p>“내가 그들의 행위와 사상을 아노라 때가 이르면 <strong><mark>뭇 나라와 언어가 다른 민족들을 모으리니</mark></strong> 그들이 와서 나의 영광을 볼 것이며 내가 그들 가운데에서 징조를 세워서 그들 가운데에서 도피한 자를 여러 나라 곧 다시스와 뿔과 활을 당기는 룻과 및 두발과 야완과 또 나의 명성을 듣지도 못하고 나의 영광을 보지도 못한 먼 섬들로 보내리니 그들이 나의 영광을 뭇 나라에 전파하리라 나 여호와가 말하노라 이스라엘 자손이 예물을 깨끗한 그릇에 담아 여호와의 집에 드림 같이 그들이 너희 모든 형제를 뭇 나라에서 나의 성산 예루살렘으로 말과 수레와 교자와 노새와 낙타에 태워다가 여호와께 예물로 드릴 것이요 <strong><mark>나는 그 가운데에서 택하여 제사장과 레위인을 삼으리라 여호와의 말이니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/is/66/#L18-21">사 66:18-21</a>) <em>(“제사장”: ἱερεῖς, כֹּהֲנִ֥ים, 곧 “사제들”)</em></p></blockquote><p>게다가 다른 누구도 아닌 사도들이 실제로 사제였습니다. 구약에서 사람을 죄에서 깨끗하게 하는 임무는 사제에게 있었고(<a href="https://bibleox.com/ko/ko-nkrv/lev/5/#L5-6">레 5:5-6</a>), 신약에서도 새 교회 위계가 세워질 때 이 권한, 곧 죄를 용서하고 그대로 두는 권한이 주어집니다:</p><blockquote><p>“예수께서 또 이르시되 너희에게 평강이 있을지어다 아버지께서 나를 보내신 것 같이 나도 너희를 보내노라 이 말씀을 하시고 그들을 향하사 <strong>숨을 내쉬며</strong> 이르시되 <strong>성령을 받으라</strong> <strong>너희가 누구의 죄든지 사하면 사하여질 것이요 누구의 죄든지 그대로 두면 그대로 있으리라</strong> 하시니라” (<a href="https://bibleox.com/ko/ko-nkrv/in/20/#L21-23">요 20:21-23</a>)</p></blockquote><p>가장 오래된 그리스도인들은 사제(presbyter)가 또한 제사장이었음을 확인해 줍니다: <a href="https://bibleox.com/ru/ru/w/gq8M_Новозаветные_пресвитеры__священники">인용문</a>.</p>'
