  path: Pt8h_신품성사
  title: 신품성사
  copy_cover: true
  body: '<p>공동번역의 “감독”은 주교, “원로”는 사제, “보조자”는 보제에 해당합니다.</p><h2>구약에서 하느님께서 세우신 사제직</h2><p>사제는 아론의 후손뿐입니다:</p><blockquote><p>“띠를 띠우고, 두건을 씌워 주어라. 법으로 정해 준 <strong>그들의 사제직은 영원한 것이다</strong>. 너는 이런 절차로 <strong>아론과 그의 아들들에게</strong> 일을 맡겨라.” (<a href="https://bibleox.com/ko/ko-ctb/ish/29/#L9">출 29:9</a>)</p></blockquote><p>사제직은 거룩한 옷과 함께 기름 부음으로 이어집니다:</p><blockquote><p>“아론의 자손 가운데 <strong>대를 이을 사람이 거룩한 아론의 옷을 이어 받아야 한다</strong>. 그는 이 옷을 입고 <strong>기름 붓는 의식을 거쳐 사제직을 맡아야 한다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/ish/29/#L29">출 29:29</a>)</p></blockquote><p>거룩한 봉사에 다가오는 외부인은 죽어야 했습니다. 사제직의 임무는 이를 지키는 것이었습니다:</p><blockquote><p>“너는 아론과 그의 아들들을 세워 사제 일을 맡아 보게 하여라. <strong>다른 사람이 나섰다가는 죽으리라</strong>.‘” (<a href="https://bibleox.com/ko/ko-ctb/chis/3/#L10">민 3:10</a>)</p></blockquote><p>자세히:</p><blockquote><p>“<strong><mark>야훼께서 아론에게 이르셨다</mark></strong>. ‘성소를 범하는 일이 생기면 <strong>너와 너의 자손</strong>과 네가 거느리는 너의 가문이 책임을 져야 한다. 너희가 맡은 사제직을 잘못 수행하면 네가 거느리는 너의 자식들과 네가 책임을 져야 한다. <strong>레위 지파에 속한 너의 일족도</strong> 너와 함께 내 앞에 나오게 하여라. 그리하여 너와 네 아들들이 증거의 장막 앞에서 예배드릴 때 <strong>너의 지도 아래 너의 일을 거들게</strong> 하여라. 그들은 네 일을 거들고 장막에서 시중드는 일은 모두 맡을 수 있지만 거룩한 기구나 제단에는 가까이 못한다. 가까이하다가는 그들뿐 아니라 너희도 죽으리라. &lt;…&gt; 너와 네 아들들은 사제로서 제단에서 할 모든 일과 휘장 안에서 할 일을 성심껏 해야 한다. <strong><mark>내가 너희에게 사제직을 맡기면서 시킨 일들을 충실히 지켜라. 다른 사람이 네 옆에서 시중들었다가는 죽고 말리라</mark></strong>.’” (<a href="https://bibleox.com/ko/ko-ctb/chis/18/#L1-3,7">민 18:1-3,7</a>)</p></blockquote><h2>신약에서 사제직이 바뀝니다</h2><p>주 예수 그리스도께서는 새 계약을 맺으시고(<a href="https://bibleox.com/ko/ko-ctb/lk/22/#L20">루가 22:20</a>; <a href="https://bibleox.com/ko/ko-ctb/evr/8/#L8">히브 8:8</a>) 율법을 바꾸시며 사제직을 바꾸십니다(폐지가 아니라 바꾸십니다):</p><blockquote><p>“<strong>사제 제도가 변하면 율법도 변하게 마련입니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/evr/7/#L12">히브 7:12</a>) <em>(“사제 제도”는 그리스어로 ἱερωσύνη입니다.)</em></p></blockquote><p>구세주께서는 사도들에게 성령을 보내시어 멜기세덱의 품계를 따르는 사제직의 위계를 세우시고, 친히 대사제가 되십니다:</p><blockquote><p>“예수께서는 <strong>멜기세덱의 사제 직분을 따라 영원한 대사제가 되셔서</strong> 우리보다 앞서 그 곳에 들어 가셨습니다.” (<a href="https://bibleox.com/ko/ko-ctb/evr/6/#L20">히브 6:20</a>)</p></blockquote><blockquote><p>“이 멜기세덱은 살렘왕이며 높으신 하느님의 사제였습니다. 그는 여러 왕들을 무찌르고 돌아 오는 아브라함을 맞아 축복해 주었고 아브라함은 그에게 모든 전리품의 십분의 일을 나누어 주었습니다. 첫째로 멜기세덱이라는 이름은 <strong>정의의 왕</strong>이라는 뜻이고 그 다음 살렘왕이라는 칭호는 <strong>평화의 왕</strong>이라는 뜻입니다. 그는 아버지도 없고 어머니도 없고 족보도 없으며 <strong>생애의 시작도 끝도 없이 하느님의 아들을 닮아서 영원히 사제직을 맡아 보는 분입니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/evr/7/#L1-3">히브 7:1-3</a>)</p></blockquote><blockquote><p>“위에서 말한 요점을 말하면 우리는 <strong>하늘에서 전능하신 이의 옥좌 오른편에 앉아 계시는 대사제를 모시고 있다</strong>는 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/evr/8/#L1">히브 8:1</a>)</p></blockquote><h2>교회 위계의 형성</h2><p>오순절에 성령께서는 사도들과 온 교회 모임, 곧 온 교회에 파견되십니다. 그러나 그 전에 구세주께서는 사도들에게만 나타나시어 그들에게만 성령을 보내시고, 사제로서 죄를 용서할 권한을 주시며, 곧 위계를 세우십니다:</p><blockquote><p>“예수께서 다시 ‘너희에게 평화가 있기를! 내 아버지께서 나를 보내 주신 것처럼 나도 너희를 보낸다’하고 말씀하셨다. 이렇게 말씀하신 다음 예수께서는 그들에게 <strong>숨을 내쉬시며</strong> 말씀을 계속하셨다. ‘<strong>성령을 받아라</strong>. <strong>누구의 죄든지 너희가 용서해 주면 그들의 죄는 용서받을 것이고 용서해 주지 않으면 용서받지 못한 채 남아 있을 것이다</strong>.’” (<a href="https://bibleox.com/ko/ko-ctb/in/20/#L21-23">요한 20:21-23</a>)</p></blockquote><p>마찬가지로 구약의 교회에서도 죄를 깨끗하게 하는 일은 바로 사제직에 속했습니다:</p><blockquote><p>“위에 말한 것 중의 어느 하나에라도 걸렸을 경우에는 <strong>자기가 어긴 그 잘못을 고백하고</strong> 그 벌로 야훼께 속죄제물을 드리는 데 양떼 가운데서 면양이든지 염소든지 암컷 한 마리를 바쳐야 한다. <strong>이렇게 사제가 그의 죄를 벗겨 주면</strong> 그는 죄를 용서받을 것이다.” (<a href="https://bibleox.com/ko/ko-ctb/lev/5/#L5-6">레 5:5-6</a>)</p></blockquote><h2>새 위계의 권한</h2><p>주님께서는 사도들에게 하늘 나라의 열쇠와, 금하고 허락하는(매고 푸는) 권한을 주십니다:</p><blockquote><p>“또 나는 너에게 하늘 나라의 열쇠를 주겠다. <strong>네가 무엇이든지 땅에서 매면 하늘에도 매여 있을 것이며 땅에서 풀면 하늘에도 풀려 있을 것이다</strong>‘ 하고 말씀하셨다.” (<a href="https://bibleox.com/ko/ko-ctb/mf/16/#L19">마태 16:19</a>)</p></blockquote><blockquote><p>“나는 분명히 말한다. <strong>너희가 무엇이든지 땅에서 매면 하늘에도 매어 있을 것이며 땅에서 풀면 하늘에도 풀려 있을 것이다</strong>.‘” (<a href="https://bibleox.com/ko/ko-ctb/mf/18/#L18">마태 18:18</a>)</p></blockquote><p>사도들이 사제들을 뽑아 서품했지만, 성경은 교회를 돌보도록 사제들을 세우신 분이 성령이시라고 말합니다:</p><blockquote><p>“밀레도스에서 바울로는 에페소에 사람을 보내어 그 <strong>교회 원로들을 불렀다</strong>. 원로들이 오자 바울로는 이렇게 말하였다. ‘여러분은 내가 아시아에 발을 들여 놓은 첫날부터 지금까지 여러분과 함께 어떻게 지내왔는지를 잘 알고 있습니다. &lt;…&gt; 여러분은 늘 자신을 살피며 성령께서 맡겨 주신 양떼를 잘 돌보시오. <strong>성령께서는 여러분을 감독으로 세우셔서</strong> 하느님께서 당신 아드님의 피로 값을 치르고 얻으신 당신의 <strong>교회를 보살피게 하셨습니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/act/20/#L17-18,28">사도 20:17-18,28</a>)</p></blockquote><p>이 모든 일은 구약 예언의 성취이며, 이에 관해서는 이어서 말합니다.</p><h2>신약의 사제직에 관한 예언</h2><p>구약의 교회에서 사제는 유다 백성의 레위 지파, 아론의 가문에서만 세워졌습니다. 그러나 신약의 교회에서 사제는 유다 백성(아론 가문)만이 아니라 모든 민족에서 세워질 것입니다:</p><blockquote><p>“나는 가서 <strong>다른 말을 쓰는 모든 민족들을 모아 오리라</strong>. 그들은 와서 나의 영광을 볼 것이다. 그들 가운데 난을 면할 자들에게 표를 주어 다르싯, 풋트, 룻, 모섹, 로스, 두발, 야반 등 여러 민족들, <strong>나의 소문을 듣지도 못하고 나의 영광을 보지도 못한</strong> 먼 섬나라에 사는 사람들에게 보내어, 만방에 나의 영광을 전하게 하리라. 그들은 민족들 가운데서 너희 모든 겨레를 말과 수레와 포장마차와 노새와 낙타에 태워 나의 거룩한 산 예루살렘에 데려다가 선물로 야훼에게 바칠 것이다. 이스라엘 백성이 정한 그릇에 선물을 담아다가 야훼의 성전에 바치듯이 바칠 것이다. 야훼가 말한다. <strong>내가 그들 가운데서 더러는 사제로, 더러는 레위인으로 뽑아 세우리라. 야훼가 말한다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/is/66/#L18-21">이사 66:18-21</a>)</p></blockquote><h2>사도적 계승과 서품에 관한 가르침</h2><h3>주교 서품</h3><p>디모테오 주교에게는 사도의 안수와, 먼저 서품된 다른 주교들의 안수를 통한 특별한 은사가 있습니다:</p><blockquote><p>“그래서 나는 다시 그대를 깨우쳐 줍니다. <strong><mark>내가 그대에게 안수했을 때에 하느님께서 그대에게 주신 그 은총의 선물</mark></strong>을 생생하게 간직하시오.” (<a href="https://bibleox.com/ko/ko-ctb/2tim/1/#L6">2디모 1:6</a>)</p></blockquote><blockquote><p>“<strong><mark>그대가 선물로 받은 그 거룩한 직무 곧 원로들이 그대에게 안수하며</mark></strong> 예언해 준 말씀을 통해서 그대에게 맡겨진 직무를 등한히 하지 마시오.” (<a href="https://bibleox.com/ko/ko-ctb/1tim/4/#L14">1디모 4:14</a>)</p></blockquote><p>마술사 시몬은 모든 그리스도인이 성령을 주려고 손을 얹을 수 있는 것은 아님을 보았습니다. 글자 그대로 모두에게 그런 권한이 있는 것이 아닙니다. 그는 자기에게도 그런 권한을 달라고 사도들에게 뇌물을 가져왔습니다(사도들은 그를 저주했습니다):</p><blockquote><p>“시몬은 <strong>사도들이 손을 얹어 성령을 받게 하는 것을 보고</strong> 사도들에게 돈을 내면서 <strong>나에게도 그런 권능을 주어</strong> <strong><mark>내가 손을 얹는 사람마다 성령을 받을 수 있게 해 주십시오</mark></strong>‘하고 청하였다. 베드로는 이렇게 대답하였다. ’당신은 <strong><mark>하느님의 선물</mark></strong>을 돈으로 살 작정이오? 당신은 그 돈과 함께 망할 것이오.” (<a href="https://bibleox.com/ko/ko-ctb/act/8/#L18-20">사도 8:18-20</a>)</p></blockquote><h3>사도 바울로의 서품</h3><blockquote><p>“그들이 단식을 하며 주님께 예배드리고 있을 때에 성령께서 ‘바르나바와 <strong><mark>사울</mark></strong>을 따로 세워라. 내가 그들에게 맡기기로 정해 놓은 일이 있다’하고 말씀하셨다. 그래서 그들은 다시 단식하며 기도를 하고 나서 <strong><mark>그들에게 안수를 해 주고</mark></strong> 떠나 보냈다.” (<a href="https://bibleox.com/ko/ko-ctb/act/13/#L2-3">사도 13:2-3</a>)</p></blockquote><h3>보제 서품</h3><blockquote><p>“사도들 앞에 내세웠다. 사도들은 기도하고 <strong>그들에게 안수하였다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/act/6/#L6">사도 6:6</a>; <a href="https://bibleox.com/ko/ko-ctb/act/21/#L8">사도 21:8</a>)</p></blockquote><h3>서품에 관한 가르침</h3><p>안수에 관한 사도의 가르침:</p><blockquote><p>“세례와 <strong>안수</strong>, 그리고 죽은 자들의 부활과 영원한 심판과 같은 <strong>기초적인 교리</strong>를 다시 배우는 일은 없도록 합시다.” (<a href="https://bibleox.com/ko/ko-ctb/evr/6/#L2">히브 6:2</a>)</p></blockquote><p>서둘러 (사제로) 서품하지 말라는 경고:</p><blockquote><p>“그대는 누구를 막론하고 <strong>너무 서둘러서 안수해 주는 일이 없도록 하시오</strong>. 그리고 남의 죄에 대한 책임을 뒤집어 쓰지 말고 자신의 결백을 지키시오.” (<a href="https://bibleox.com/ko/ko-ctb/1tim/5/#L22">1디모 5:22</a>)</p></blockquote><h2>주교와 사제의 차이</h2><p>주교(그리스어 ἐπίσκοπος, “감독자, 돌보는 이”)와 사제(그리스어 πρεσβύτερος, “원로, 공동체의 어른”)라는 말은 섞여 쓰이며 서로 바꾸어 쓸 수 있는 듯합니다. 그러나 어떻게 불리든 각 사람의 기능과 권한은 분명히 보입니다. 디도는 사도의 일을 마무리하고 크레타에 사제들을 세워야 했습니다:</p><blockquote><p>“내가 그대를 그레데섬에 홀로 남겨 두고 온 것은 내가 거기에서 다하지 못한 일을 그대가 완성하고 내가 일러 둔 대로 <strong>도시마다 교회의 원로들을 임명하게</strong> 하기 위한 것이었습니다.” (<a href="https://bibleox.com/ko/ko-ctb/tit/1/#L5">디도 1:5</a>)</p></blockquote><p>디모테오는 자기 사제들을 재판하고, 믿는 이들을 꾸짖고 금할 수 있었습니다:</p><blockquote><p>“두 사람이나 세 사람의 증인이 없이는 <strong>원로에 대한 고발</strong>을 들어 주지 마시오.” (<a href="https://bibleox.com/ko/ko-ctb/1tim/5/#L19">1디모 5:19</a>)</p></blockquote><blockquote><p>“하느님의 말씀을 전파하시오. 기회가 좋든지 나쁘든지 꾸준히 전하고 끝까지 참고 가르치면서 사람들을 <strong>책망하고 훈계하고</strong> 격려하시오.” (<a href="https://bibleox.com/ko/ko-ctb/2tim/4/#L2">2디모 4:2</a>)</p></blockquote><p>그러므로 디도와 디모테오는 사제라고 불렸더라도 오늘날의 뜻으로 주교였습니다.</p><h2>모두가 사제인가?</h2><h3>구약의 말씀과의 대응</h3><p>사도 베드로는 구약의 말씀을 되풀이하여 모든 그리스도인을 왕의 사제이자 거룩한 겨레라고 부릅니다:</p><blockquote><p>“그러나 여러분은 <strong>선택된 민족이고 왕의 사제들이며 거룩한 겨레이고</strong> 하느님의 소유가 된 백성입니다. 그러므로 여러분은 어두운 데서 여러분을 불러 내어 그 놀라운 빛 가운데로 인도해 주신 하느님의 놀라운 능력을 널리 찬양해야 합니다.” (<a href="https://bibleox.com/ko/ko-ctb/1pet/2/#L9">1베드 2:9</a>)</p></blockquote><p>구약에서 같은 말씀이 온 이스라엘에게 주어집니다:</p><blockquote><p>“이제 너희가 나의 말을 듣고 내가 세워 준 계약을 지킨다면 너희야말로 뭇 민족 가운데서 내 것이 되리라. 온 세계가 나의 것이 아니냐? <strong>너희야말로 사제의 직책을 맡은 내 나라, 거룩한 내 백성이 되리라</strong>.‘ 이것이 네가 이스라엘 자손에게 일러 줄 말이다.’” (<a href="https://bibleox.com/ko/ko-ctb/ish/19/#L5-6">출 19:5-6</a>)</p></blockquote><p>이처럼 하느님께서는 이미 구약의 이스라엘을 사제의 나라, 거룩한 백성이라 부르십니다. 그러나 전례적인 뜻에서 모든 유다인이 사제였던 것은 아닙니다. 율법에 따르면 아론의 사제직만 성막에 들어갈 수 있었고, 다른 이들은 성막에 들어가면 목숨으로 값을 치러야, 곧 죽어야 했습니다(<a href="https://bibleox.com/ko/ko-ctb/chis/3/#L10">민 3:10</a>; <a href="https://bibleox.com/ko/ko-ctb/chis/3/#L38">민 3:38</a>; <a href="https://bibleox.com/ko/ko-ctb/chis/18/#L7">민 18:7</a>).</p><p>구약에서 “사제의 나라”(모두가 아님)와 “거룩한 백성”(모두)을 구별한다면, 신약의 사도 말씀에서도 같은 구별을 인정해야 합니다. 왕의 사제(모두가 아님), 거룩한 겨레(모두)입니다(<a href="https://bibleox.com/ko/ko-ctb/1pet/2/#L9">1베드 2:9</a>). 이 말씀은 글자 그대로든 비유로든 이해할 수 있지만, 어떤 경우든 두 표현을 연결하여 같은 방식으로 이해해야 합니다.</p><h3>구약에서 만인 사제직을 세우려는 시도</h3><p>구약에서 하느님께서는 아론의 후손만 사제가 될 수 있는 질서를 세우셨습니다:</p><blockquote><p>“아론의 자손 가운데 대를 이을 사람이 거룩한 아론의 옷을 이어 받아야 한다. 그는 이 옷을 입고 기름 붓는 의식을 거쳐 사제직을 맡아야 한다.” (<a href="https://bibleox.com/ko/ko-ctb/ish/29/#L29">출 29:29</a>)</p></blockquote><p>아론의 가문에서도 모두가 사제가 될 수는 없었습니다:</p><blockquote><p>“<strong>사제 아론의 후손으로서 몸이 성하지 못한 사람은 아무도 야훼께 가까이 나와 번제를 드리지 못한다</strong>. 몸이 성하지 못한 사람은 그의 하느님께 양식을 바치러 가까이 나오지 못한다. &lt;…&gt; 하지만 그는 몸이 성하지 못한 사람이기 때문에 휘장 안으로 들어 가거나 제단 앞으로 나가서 <strong>나의 성소를 더럽혀서는 안 된다</strong>. 사제들을 거룩하게 하는 이는 나 야훼이다.‘’” (<a href="https://bibleox.com/ko/ko-ctb/lev/21/#L21,23">레 21:21,23</a>)</p></blockquote><p>이 하느님의 질서에 <strong>코라, 다단, 아비람, 온</strong>이 맞서서, 아론의 가문에서만이 아니라 온 백성에서 사제를 세우라고 예언자 모세에게 요구했습니다. 그들은 바로 그 표현(<a href="https://bibleox.com/ko/ko-ctb/ish/19/#L5-6">출 19:5-6</a>)을 근거로 모두가 거룩하다고 말했습니다:</p><blockquote><p>“그들이 모세와 아론에게 모여 와서 항의하였다. ‘당신들은 지나치오. <strong>야훼께서 온 회중 가운데 계시어 온 회중이 다 거룩한데</strong>, 어찌하여 당신들만이 야훼의 회중 위에 군림하오?’” (<a href="https://bibleox.com/ko/ko-ctb/chis/16/#L3">민 16:3</a>)</p></blockquote><blockquote><p>“하느님은 그대에게 그대의 일족인 레위인들을 모두 거느리고 하느님 앞에 나와 섬기는 특권을 주시었다. <strong>그런데 이제 그대들은 사제직마저 요구하는가</strong>?” (<a href="https://bibleox.com/ko/ko-ctb/chis/16/#L10">민 16:10</a>)</p></blockquote><p>그 뒤 하느님의 영광이 나타나고 땅이 반역자들을 삼켰습니다:</p><blockquote><p>“코라는 온 회중을 만남의 장막 문 앞으로 모아 두 사람과 대결하게 하였다. 모인 회중에게 야훼의 영광이 나타났다. 야훼께서 모세와 아론에게 말씀하셨다. 너희는 이 회중에게서 떨어져 서라. <strong>내가 순식간에 그들을 없애버리리라</strong>.‘” (<a href="https://bibleox.com/ko/ko-ctb/chis/16/#L19-21">민 16:19-21</a>)</p></blockquote><p>하느님께서는 반역자들의 제물을 향로에서 쏟아 버리고, 향로로 제단 덮개를 만들어 후대에 기억하게 하라고 말씀하셨습니다:</p><blockquote><p>“너는 아론 사제의 아들 엘르아잘을 시켜 불탄 자리에서 향로를 모으게 하고 <strong>불은 멀리 가져다 쏟아 버리게 하여라</strong>. 이 향로와 불은 아무나 건드릴 수 없다. 큰 잘못을 저지르고 목숨을 잃은 이 사람들의 향로를 모아다가 두드려 펴서 제단에 씌워, <strong>이스라엘 백성이 그것을 보고 이 사실을 생각하게 하여라</strong>. 이것은 야훼 앞에 가져왔던 것인 만큼 이미 거룩하게 되었다.‘” (<a href="https://bibleox.com/ko/ko-ctb/chis/16/#L37-38">민 16:37-38</a>)</p></blockquote><blockquote><p>“<strong>그들이 이런 일들을 당함으로써</strong> 다른 사람들에게는 경고가 되었으며 그것이 <strong>기록에 남아서</strong> 이제 세상의 종말을 눈앞에 둔 <strong>우리에게는 교훈이 되었습니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/10/#L11">1고린 10:11</a>)</p></blockquote><p>사도 유다도 코라의 파멸을 부른 고집을 떠올립니다:</p><blockquote><p>“그들은 화를 입을 것입니다. 그들은 카인의 길을 따라 갔고 발람처럼 돈을 탐내다가 잘못에 빠져 들어 갔으며 <strong>코라처럼 반역을 하다가 멸망하고 말았습니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/iud/1/#L11">유다 1:11</a>)</p></blockquote><p>마지막 때에 이런 사람들이 일어나리라는 예언도 있습니다:</p><blockquote><p>“사람들이 건전한 가르침을 듣기 싫어할 때가 올 것입니다. 그 때에 그들은 <strong>자기네 귀를 만족시키기 위해서 마음에 맞는 교사들을 끌어 들일 것입니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/2tim/4/#L3">2디모 4:3</a>)</p></blockquote><h3>신약에서 사제를 세운다는 예언</h3><p>구약에 이미 신약에서도 사제와 봉사자가 세워지되, 아론의 가문에서만이 아니라 모든 민족에서 세워지리라는 예언이 있습니다:</p><blockquote><p>“나는 가서 <strong>다른 말을 쓰는 모든 민족들을 모아 오리라</strong>. 그들은 와서 나의 영광을 볼 것이다. 그들 가운데 난을 면할 자들에게 표를 주어 다르싯, 풋트, 룻, 모섹, 로스, 두발, 야반 등 여러 민족들, 나의 소문을 듣지도 못하고 나의 영광을 보지도 못한 먼 섬나라에 사는 사람들에게 보내어, 만방에 나의 영광을 전하게 하리라. 그들은 민족들 가운데서 너희 모든 겨레를 말과 수레와 포장마차와 노새와 낙타에 태워 나의 거룩한 산 예루살렘에 데려다가 선물로 야훼에게 바칠 것이다. 이스라엘 백성이 정한 그릇에 선물을 담아다가 야훼의 성전에 바치듯이 바칠 것이다. 야훼가 말한다. <strong>내가 그들 가운데서 더러는 사제로, 더러는 레위인으로 뽑아 세우리라. 야훼가 말한다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/is/66/#L18-21">이사 66:18-21</a>)</p></blockquote><p>신약은 아무도 사제직을 스스로 취할 수 없다고 가리킵니다:</p><blockquote><p>“대사제는 누구나 사람들 가운데서 뽑혀서 <strong>사람들을 대표하여 하느님을 섬기는 일을 맡은 사람입니다</strong>. 그래서 대사제는 속죄를 위해서 예물과 희생제물을 바치는 것입니다. 대사제는 자기도 연약한 인간이므로 무지하거나 유혹에 빠진 사람들을 동정할 수 있습니다. 그는 또 이렇게 연약하기 때문에 백성을 위해서뿐만 아니라 자신을 위해서도 속죄의 제물을 바쳐야 하는 것입니다. <strong>이 영예로운 직무는 자기 스스로 얻는 것이 아니라 아론처럼</strong> 하느님의 부르심을 받아서 얻는 것입니다. 이와 같이 <strong>그리스도께서도 대사제의 영광스러운 자리를 스스로 차지하신 것이 아닙니다</strong>. 그 영광스러운 자리는 ‘너는 내 아들, 내가 오늘 너를 낳았다’하고 말씀하신 하느님께서 주신 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/evr/5/#L1-5">히브 5:1-5</a>)</p></blockquote><h3>믿고 세례를 받은 마술사 시몬에게는 성령의 은사를 주는 은사가 없습니다</h3><p>기록된 대로 마술사 시몬은 믿고 세례를 받았습니다:</p><blockquote><p>“마침내는 <strong>시몬까지도 믿게 되었다. 시몬은 세례를 받은 뒤</strong> 필립보를 따라 다니며 많은 기적과 놀라운 일들이 일어나는 것을 보고는 깜짝 놀랐다.” (<a href="https://bibleox.com/ko/ko-ctb/act/8/#L13">사도 8:13</a>)</p></blockquote><p>그러나 모든 그리스도인이 성령의 은사를 줄 수 있는 것이 아님을 알자 그는 사도들에게서 이 은사를 사려 했습니다. 사도들은 그 때문에 그를 저주했습니다:</p><blockquote><p>“<strong><mark>시몬은 사도들이 손을 얹어 성령을 받게 하는 것을 보고 사도들에게 돈을 내면서 나에게도 그런 권능을 주어 내가 손을 얹는 사람마다 성령을 받을 수 있게 해 주십시오</mark></strong>‘하고 청하였다. 베드로는 이렇게 대답하였다. ’<strong><mark>당신은 하느님의 선물을 돈으로 살 작정이오? 당신은 그 돈과 함께 망할 것이오</mark></strong>. 하느님 보시기에 당신은 마음이 바르지 못하니 이 일에 끼어들 수 없소. 그러니 당신은 그 못된 생각을 뉘우치고 주님께 간구하시오. 혹시 마음에 품었던 생각을 하느님께서 용서해 주실지도 모르오. 내가 보기에 당신은 죄에 얽매여 마음이 고약해졌소.‘” (<a href="https://bibleox.com/ko/ko-ctb/act/8/#L18-23">사도 8:18-23</a>)</p></blockquote><p>이로써 모든 그리스도인이 성령을 줄 권한과 하느님의 은사를 지닌 사제가 아니었음이 분명합니다. 사마리아 사람들에게 세례를 준 보제 필립보에게도 이 은사가 없었습니다(<a href="https://bibleox.com/ko/ko-ctb/act/21/#L8">사도 21:8</a>). 이 은사를 지닌 이들은 사도들의 안수(<a href="https://bibleox.com/ko/ko-ctb/2tim/1/#L6">2디모 1:6</a>)와 사제단의 안수(<a href="https://bibleox.com/ko/ko-ctb/1tim/4/#L14">1디모 4:14</a>)를 통해 받았습니다.</p><p>그러므로:</p><ul><li><p>모두가 가르치고 세례를 주라는 사명을 받은 것은 아닙니다: “너희는 <strong>가서</strong> 이 세상 모든 사람들을 <strong>내 제자로 삼아</strong> 아버지와 아들과 성령의 이름으로 그들에게 <strong>세례를 베풀고</strong>” (<a href="https://bibleox.com/ko/ko-ctb/mf/28/#L19">마태 28:19</a>)</p></li><li><p>모두가 이런 명령을 받은 것은 아닙니다: “나를 기념하여 <strong>이 예식을 행하여라</strong>” (<a href="https://bibleox.com/ko/ko-ctb/lk/22/#L19">루가 22:19</a>; <a href="https://bibleox.com/ko/ko-ctb/1kor/11/#L24">1고린 11:24</a>)</p></li><li><p>모두에게 매고 푸는 권한이 주어진 것은 아닙니다: “너희가 무엇이든지 땅에서 <strong>매면</strong> 하늘에도 매어 있을 것이며 땅에서 <strong>풀면</strong> 하늘에도 풀려 있을 것이다” (<a href="https://bibleox.com/ko/ko-ctb/mf/18/#L18">마태 18:18</a>)</p></li><li><p>모두에게 죄를 용서하고 그대로 두는 권한이 주어진 것은 아닙니다: “누구의 죄든지 너희가 <strong>용서해 주면</strong> 그들의 죄는 용서받을 것이고 <strong>용서해 주지 않으면</strong> 용서받지 못한 채 남아 있을 것이다” (<a href="https://bibleox.com/ko/ko-ctb/in/20/#L23">요한 20:23</a>)</p></li><li><p>모두에게 성령을 주려고 손을 얹는 권한이 주어진 것은 아닙니다: “<strong>사도들이 손을 얹어 성령을 받게 하는</strong>” (<a href="https://bibleox.com/ko/ko-ctb/act/8/#L18">사도 8:18</a>)</p></li><li><p>사도는 바로 사제들을 부르라고 명합니다. 그들의 기도와 거룩한 행위(기름을 발랐습니다)를 통해 병자의 죄가 용서받을 수 있습니다: “여러분 가운데 <strong>앓는 사람이 있으면 그 사람은 교회의 원로들을 청하십시오</strong>. 원로들은 주님의 이름으로 <strong>그에게 기름을 바르고 그를 위하여 기도해 주어야 합니다</strong>. 믿고 구하는 기도는 앓는 사람을 낫게 할 것이며 주님께서 그를 일으켜 주실 것입니다. 또 <strong>그가 지은 죄가 있으면 그 죄도 용서를 받을 것입니다</strong>” (<a href="https://bibleox.com/ko/ko-ctb/iak/5/#L14-15">야고 5:14-15</a>)</p></li></ul><h2>왕의 사제직은 어떻게 이해해야 합니까?</h2><p>구약에서나 신약에서나 믿는 이는 저마다 자기 성전, 곧 자기 몸에서 사제가 되도록 부름받습니다. <a href="https://bibleox.com/ru/ru/w/человек-храм-Божий">사람은 하느님의 성전</a>이며, 사제는 이 성전에서 하느님께 제사를 바치는 사람입니다. 사도 베드로는 왕의 사제직을 말하기 전에 바로 이 생각으로 시작합니다:</p><blockquote><p>“여러분도 <strong><mark>신령한 집을 짓는 데 쓰일 산 돌이 되십시오. 그리고 거룩한 사제가 되어</mark></strong> 하느님께서 기쁘게 받으실 만한 <strong>신령한 제사를</strong> 예수 그리스도를 통하여 드리십시오.” (<a href="https://bibleox.com/ko/ko-ctb/1pet/2/#L5">1베드 2:5</a>)</p></blockquote><p>사도 베드로는 왕의 사제직을 말하면서 같은 편지에서 목자들과 그들에게 순종해야 함을 말합니다:</p><blockquote><p>“이번에는 젊은이들에게 말합니다. 여러분은 <strong>원로들에게 복종하십시오</strong>. 여러분은 모두 겸손의 옷을 입고 서로 섬기십시오. <strong>하느님께서는 교만한 자를 물리치시고 겸손한 사람에게 은총을 베푸십니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/1pet/5/#L5">1베드 5:5</a>)</p></blockquote><p>그리스도인을 사제라고 부르는 말씀이 하나 더 있습니다:</p><blockquote><p>“그리고 진실한 증인이시며 죽음으로부터 제일 먼저 살아 나신 분이시며 땅 위의 모든 왕들의 지배자이신 예수 그리스도께서 여러분에게 은총과 평화를 내려 주시기를 빕니다. 우리를 사랑하신 나머지 당신의 피로써 우리를 죄에서 해방시켜 주시고 우리로 하여금 <strong>한 왕국을 이루게 하시고 또 당신의 하느님 아버지를 섬기는 사제가 되게 하신</strong> 그분에게 영광과 권세를 영원무궁토록 누리시기를 빕니다. 아멘.” (<a href="https://bibleox.com/ko/ko-ctb/otkr/1/#L5-6">묵시 1:5-6</a>; <a href="https://bibleox.com/ko/ko-ctb/otkr/5/#L9-10">묵시 5:9-10</a>; <a href="https://bibleox.com/ko/ko-ctb/otkr/20/#L6">묵시 20:6</a>)</p></blockquote><p>그리스도인이 왕인 그 뜻으로 그는 사제이기도 합니다. 지금 외부 사람들을 다스리지 않는다면, 외부 사람들에게 사제인 것도 아닙니다. 이런 설명은 문맥에 정직하고 상식에도 맞습니다.</p><p>그리스도인은 자기 몸을 다스리고, 정신을 몸의 욕망 위에 세우며, 하느님의 이 성전(몸과 마음)을 깨끗하게 하고, 거기서 하느님 마음에 드는 제사, 곧 깨끗한 생각과 말과 행실, 기도와 찬양을 바치도록 부름받습니다.</p><h2>사제에 대한 존경</h2><blockquote><p>“남을 잘 지도하는 원로들은 <strong>갑절의 대우를 받아야 합니다</strong>. 특히 말씀을 전하고 가르치는 일에 수고하는 사람들을 존경하시오.” (<a href="https://bibleox.com/ko/ko-ctb/1tim/5/#L17">1디모 5:17</a>)</p></blockquote><blockquote><p>“온 마음으로 주님을 두려워하고 <strong>그분의 사제들을 공경하여라</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/prsir/7/#L29">집회 7:29</a>, 그리스어에서 번역)</p></blockquote><blockquote><p>“주님을 두려워하고 <strong>사제를 영화롭게 하여라</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/prsir/7/#L31">집회 7:31</a>, 그리스어에서 번역)</p></blockquote><h2>사제직에 순종해야 합니다</h2><blockquote><p>“<strong><mark>여러분의 지도자들을 따르고 그들에게 복종하십시오. 그들은 쉬지 않고 여러분의 영혼을 돌보아 주고 있습니다</mark></strong>. 그리고 그들은 장차 하느님께 자기가 한 일을 낱낱이 아뢰어야 할 사람들입니다. 그러므로 그들이 괴로움 없이 기쁜 마음으로 이 일을 할 수 있게 해 주십시오. 그렇지 않으면 그들의 일이 여러분에게 아무런 도움도 되지 못할 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/evr/13/#L17">히브 13:17</a>)</p></blockquote><blockquote><p>“이번에는 젊은이들에게 말합니다. 여러분은 <strong><mark>원로들에게 복종하십시오</mark></strong>. 여러분은 모두 겸손의 옷을 입고 서로 섬기십시오. <strong>하느님께서는 교만한 자를 물리치시고 겸손한 사람에게 은총을 베푸십니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/1pet/5/#L5">1베드 5:5</a>)</p></blockquote><p>구약에서 사제이자 재판관에게 불순종하는 것은 죽을죄입니다:</p><blockquote><p>“거기에서 야훼를 섬기는 <strong>당직사제나 재판관의 말을 업신여기고 불복하는 자가 있으면, 누구든지 사형에 처하여라</strong>. 그리하여 이런 나쁜 일을 이스라엘에서 송두리째 뿌리 뽑아야 한다.” (<a href="https://bibleox.com/ko/ko-ctb/vtor/17/#L12">신 17:12</a>)</p></blockquote><h2>비판</h2><h3>안수로 성령께서 내려오신다는 것은 시몬의 인식일 뿐인가?</h3><p>정교인들은 안수를 통해 성령을 주는 특별한 은사에 관한 성경 구절을 보여 줍니다. 그 가운데 마술사 시몬의 경우가 있습니다.</p><p>마술사 시몬은 모든 그리스도인이 성령을 주려고 손을 얹을 수 있는 것은 아님을 보았습니다. 글자 그대로 모두에게 그런 권한이 있는 것이 아닙니다. 그는 자기에게도 그런 권한을 달라고 사도들에게 뇌물을 가져왔습니다(사도들은 그를 저주했습니다):</p><blockquote><p>“시몬은 <strong>사도들이 손을 얹어 성령을 받게 하는 것을 보고</strong> 사도들에게 돈을 내면서 <strong>나에게도 그런 권능을 주어</strong> <strong><mark>내가 손을 얹는 사람마다 성령을 받을 수 있게 해 주십시오</mark></strong>‘하고 청하였다. 베드로는 이렇게 대답하였다. ’당신은 <strong><mark>하느님의 선물</mark></strong>을 돈으로 살 작정이오? 당신은 그 돈과 함께 망할 것이오.” (<a href="https://bibleox.com/ko/ko-ctb/act/8/#L18-20">사도 8:18-20</a>)</p></blockquote><p>비판자들은 이것이 마술사 시몬의 잘못된 인식일 뿐이라고 말합니다. 그는 마술사여서 모든 것을 잘못 이해했다는 것입니다.</p><p>그러면 사도 바울로도 마술사였습니까?</p><blockquote><p>“그래서 나는 다시 그대를 깨우쳐 줍니다. <strong><mark>내가 그대에게 안수했을 때에 하느님께서 그대에게 주신 그 은총의 선물</mark></strong>을 생생하게 간직하시오.” (<a href="https://bibleox.com/ko/ko-ctb/2tim/1/#L6">2디모 1:6</a>)</p></blockquote><blockquote><p>“<strong><mark>그대가 선물로 받은 그 거룩한 직무 곧 원로들이 그대에게 안수하며</mark></strong> 예언해 준 말씀을 통해서 그대에게 맡겨진 직무를 등한히 하지 마시오.” (<a href="https://bibleox.com/ko/ko-ctb/1tim/4/#L14">1디모 4:14</a>)</p></blockquote><p>사도는 하느님의 은사가 자기의 안수를 통해 있다고 직접 말합니다.</p><p>다시 시몬의 경우로 돌아갑시다. 사도행전의 이 이야기는 복음사가 루가가 씁니다(<a href="https://bibleox.com/ko/ko-ctb/lk/1/#L3">루가 1:3</a>; <a href="https://bibleox.com/ko/ko-ctb/act/1/#L1">사도 1:1</a>). 그는 마술사 시몬이 사건을 잘못 이해했다고 쓰는 것이 아니라 시몬이 보았다고 씁니다. 무엇을 보았습니까? 복음사가 루가가 씁니다. “사도들이 손을 얹어 성령을 받게 하는 것을” 보았습니다. 이것은 시몬의 말이 아니라 복음사가 루가의 말입니다. 또 사도 베드로의 말을 보면 실제로 그러하다는 것이 분명합니다. 사도는 이 하느님의 선물을 줄 수 있으며, 그가 시몬을 비난하는 것은 바로 <strong>하느님의 선물</strong>을 <strong>돈으로</strong> 얻으려 했기 때문입니다.</p><h3>사도 바울로는 사람을 통해 서품받지 않았는가?</h3><p>정교인들은 사도 바울로가 교회를 통해 직무에 서품되었음을 보여 줍니다:</p><blockquote><p>“그들이 단식을 하며 주님께 예배드리고 있을 때에 성령께서 ‘바르나바와 <strong><mark>사울</mark></strong>을 따로 세워라. 내가 그들에게 맡기기로 정해 놓은 일이 있다’하고 말씀하셨다. 그래서 그들은 다시 단식하며 기도를 하고 나서 <strong><mark>그들에게 안수를 해 주고</mark></strong> 떠나 보냈다.” (<a href="https://bibleox.com/ko/ko-ctb/act/13/#L2-3">사도 13:2-3</a>)</p></blockquote><p>비판자들은 사도 바울로가 사람에게서 서품받지 않았다고 반박하며 이 구절을 듭니다:</p><blockquote><p>“<strong><mark>사도인 나 바울로가 이 편지를 씁니다. 나는 사도직을 사람에게서나 사람을 통해서 받은 것이 아니라</mark></strong> 예수 그리스도와 그분을 죽은 자들 가운데서 다시 살리신 하느님 아버지께로부터 받았습니다.” (<a href="https://bibleox.com/ko/ko-ctb/gal/1/#L1">갈라 1:1</a>)</p></blockquote><p>그러나 이 주장은 근거가 없습니다. 여기서는 선택의 방식만 말할 뿐, 하느님의 은사를 주는 일을 말하지 않습니다.</p><p>사울에게 손을 얹기 전에 그를 택하시고 성령께서 그를 부르신 직무를 위해 따로 세우라고 교회에 명하시는 분은 실제로 성령이십니다. 비판자들이 왜 이 구절을 드는지 알 수 없습니다. 모순이 없기 때문입니다. 사울은 사람에게서도 사람을 통해서도 택함을 받지 않았고, 성령께서 친히 그를 택하시어 직무를 위해 따로 세우라고 교회에 명하셨으며, 그 뒤 교회가 사울을 서품합니다:</p><blockquote><p>“그들이 단식을 하며 주님께 예배드리고 있을 때에 <strong><mark>성령께서</mark></strong> ‘<strong><mark>바르나바와 사울을 따로 세워라. 내가 그들에게 맡기기로 정해 놓은 일이 있다</mark></strong>’하고 말씀하셨다. 그래서 그들은 다시 단식하며 기도를 하고 나서 <strong><mark>그들에게 안수를 해 주고</mark></strong> 떠나 보냈다.” (<a href="https://bibleox.com/ko/ko-ctb/act/13/#L2-3">사도 13:2-3</a>)</p></blockquote><p>그러므로 선택은 성령께서 하시고, 은총은 교회 없이가 아니라 교회를 통해, 곧 교회 봉사자들의 안수를 통해 파견됩니다.</p><p>비판자들은 자기들이 세운 공동체가 첫 그리스도인들과 직접적인 연결이 없다는 것과, 자기들끼리 목자와 교사를 뽑는 것을 정당화하려 합니다. 하느님께 교회를 이끌고 가르칠 권한을 받지 못한 사람들이 누구에게도 그런 권한을 줄 수 없음은 분명합니다. 그러나 그들에게는 성령께서 그렇게 하실 수 있었다는 것, 곧 그들 이전에 이미 있던 교회와 아무 연결 없이 그들의 목자를 직무에 세우실 수 있었다는 것을 보이는 일이 중요합니다.</p><p>그러나 성령께서는 원하시는 대로 무엇이든 하실 자유가 있지만, 성경에서 하느님께서 그리스도께서 세우신 하나의 눈에 보이는 교회와 따로 사람들을 직무에 세우시고 구원하신 경우는 하나도 없습니다.</p><p>하느님께서는 사울을 택하셨고 친히 직무에 세우실 수 있었음이 틀림없지만, 당신의 교회 없이 그렇게 하지 않으셨습니다. 첫 이방인들, 곧 에티오피아 내시(<a href="https://bibleox.com/ko/ko-ctb/act/8/#L27">사도 8:27</a>)와 백인대장 고르넬리오(<a href="https://bibleox.com/ko/ko-ctb/act/10/#L1">사도 10:1</a>)의 세례에서도 같습니다.</p><ol><li><p>에티오피아 내시는 성경을 읽었지만 이해하지 못했습니다. <strong>하느님께서는 친히</strong> 내시를 가르치시고 세례의 구원하는 은총을 주실 수 있었지만, <strong>교회와 따로 그렇게 하지 않으십니다</strong>. 하느님께서는 내시에게 교회를 보내시고, 교회가 그에게 성경을 이해하도록 가르치고 세례에서 은총을 줍니다.</p></li><li><p>백인대장 고르넬리오는 하느님께 기도하고 선행을 했습니다. <strong>하느님께서는 친히</strong> 고르넬리오에게 구원하는 은총을 주실 수 있었지만, <strong>교회와 따로 그렇게 하지 않으십니다</strong>. 그 대신 그에게 천사를 보내시어 교회(사도 베드로의 모습으로)를 찾으라고 명하십니다. 사도가 온 뒤에야 성령께서 고르넬리오에게 오십니다. 사도 없이 더 일찍 오실 수도 있었지만 그렇게 하지 않으셨습니다.</p></li><li><p>그리스도인을 박해하던 사울(훗날의 사도 바울로)은 그리스도인을 박해하러 다마스커스로 갑니다. 그리스도께서 눈부신 빛으로 나타나시고, 사울은 무엇을 해야 하는지 묻습니다. <strong>하느님이신 그리스도께서는 친히</strong> 사울에게 은총을 주실 수 있었지만, <strong>교회와 따로 그렇게 하지 않으시고</strong>, 다마스커스에서 교회(사도 아나니아의 모습으로)를 찾으라고 명하십니다. 그곳에서 교회를 통해서만 사도는 치유(<a href="https://bibleox.com/ko/ko-ctb/act/9/#L17">사도 9:17</a>)와 성령의 은총(<a href="https://bibleox.com/ko/ko-ctb/act/9/#L17">사도 9:17</a>)과 죄를 씻어 준 세례의 구원하는 은총(<a href="https://bibleox.com/ko/ko-ctb/act/22/#L16">사도 22:16</a>)을 받습니다.</p></li></ol><p>사울을 특별한 사도직에 서품한 일도 다른 경우와 모두 같습니다. 하느님께서 친히 사울을 택하시고 당신의 은사를 친히 주실 수 있었지만, 당신의 교회와 따로 그렇게 하지 않으십니다. 성령께서 교회에 말씀하시고 교회가 사울을 서품합니다(<a href="https://bibleox.com/ko/ko-ctb/act/13/#L2-3">사도 13:2-3</a>).</p><p>그러므로 교회와 따로 자기 목자들이 특별히 부름받았다는 분리된 단체들의 주장은 모두 성경에 근거가 없습니다. 성경에는 그런 경우가 전혀 없습니다.</p><h3>안수는 이교에서 빌려 왔다</h3><p>자기 나름대로 교회를 세운 사람들은 먼저 그리스도께서 단번에 세우신 교회가 타락했다고 증명해야 합니다. 교회가 타락하지 않았다면 그들의 새 공동체는 필요 없고 그리스도의 교회에 들어가면 되기 때문입니다. 교회의 타락을 증명하려고 되도록 무서운 “딱지 붙이기”를 자주 합니다. 그래서 교회가 이교의 관습을 빌려 와 하느님에게서 이교로 떨어져 나갔다고 자주 비난합니다. 그런 관습으로 다음을 듭니다:</p><ul><li><p>거룩한 성당의 존재,</p></li><li><p>거룩한 장소,</p></li><li><p>거룩한 물건,</p></li><li><p>거룩한 형상,</p></li><li><p>특별한 거룩한 사람들(사제),</p></li><li><p>거룩한 예식과 성사(하느님께 영향을 주는 처방이라고 합니다), 그 가운데 안수.</p></li></ul><p>이것은 몹시 어처구니없는 비난입니다. 이 모든 것은 하느님께서 친히 세우셨고 성경에 분명히 기록되어 있기 때문입니다. 교회에 딱지를 붙이려고 이교도를 끌어들인 것입니다. 이 모든 거룩한 건물, 장소, 물건, 행위, 사람들은 구약과 신약의 성경에 있으며, 별도의 글에서 알아볼 수 있습니다:</p><ul><li><p><a href="https://bibleox.com/ru/ru/w/святыня">거룩한 것들</a></p></li></ul><h4>구약의 안수</h4><p>야곱은 기도하며 손자들에게 손을 얹어 축복했습니다:</p><blockquote><p>“그러자 이스라엘은 손을 엇갈리게 내밀어 아우인 <strong><mark>에브라임의 머리에는 오른손을</mark></strong>, 맏아들인 <strong><mark>므나쎄의 머리에는 왼손을 얹고</mark></strong> 이렇게 <strong><mark>복을 빌어 주었다</mark></strong>. ‘나의 조상 아브라함과 이사악이 살아 가는 것을 지켜 보아 주신 하느님, 태어날 때부터 이날까지 나의 목자가 되어 주신 하느님, 온갖 어려움에서 나를 건져 내준 <strong><mark>하느님의 천사가 이 아이들에게 복을 내려 주시기를 빕니다</mark></strong>. 나의 이름과 조상들의 이름 아브라함과 이사악이 이 아이들에게 살아 있기를. 이 세상 한복판에서 왕성하게 불어나기를 빕니다.’” (<a href="https://bibleox.com/ko/ko-ctb/gen/48/#L14-16">창 48:14-16</a>)</p></blockquote><p>하느님께서는 예언자 모세에게 안수로 눈의 아들 여호수아를 직무에 세우라고 명하셨습니다:</p><blockquote><p>“<strong><mark>야훼께서 모세에게 대답하셨다</mark></strong>. ‘<strong><mark>눈의 아들 여호수아는</mark></strong> 정기가 있는 사람이니 <strong><mark>그를 데려다가 손을 얹어라</mark></strong>. &lt;…&gt; 모세는 야훼께서 분부하신 대로 하였다. 그는 여호수아를 불러 내어 엘르아잘 사제와 온 회중 앞에 세운 다음 야훼께서 분부하신 대로 <strong><mark>그에게 손을 얹어 임관식을 치렀다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/chis/27/#L18,22-23">민 27:18,22-23</a>)</p></blockquote><blockquote><p>“<strong><mark>눈의 아들 여호수아는 하느님의 영을 받아 지혜가 넘쳤다. 모세가 그에게 손을 얹어 주었던 것이다</mark></strong>. 그의 지휘 아래 이스라엘 백성은 야훼께서 이미 모세에게 분부하신 일을 다 이루었다.” (<a href="https://bibleox.com/ko/ko-ctb/vtor/34/#L9">신 34:9</a>)</p></blockquote><p>하느님께서는 레위인들을 안수로 성소의 봉사에 세우라고 명하셨습니다:</p><blockquote><p>“네가 레위인들을 야훼 앞에 나서게 하면, 이스라엘 백성이 <strong><mark>레위인들에게 손을 얹을 것이다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/chis/8/#L10">민 8:10</a>)</p></blockquote><h4>신약의 안수</h4><blockquote><p>“그래서 나는 다시 그대를 깨우쳐 줍니다. <strong><mark>내가 그대에게 안수했을 때에 하느님께서 그대에게 주신 그 은총의 선물</mark></strong>을 생생하게 간직하시오.” (<a href="https://bibleox.com/ko/ko-ctb/2tim/1/#L6">2디모 1:6</a>)</p></blockquote><blockquote><p>“<strong><mark>그대가 선물로 받은 그 거룩한 직무 곧 원로들이 그대에게 안수하며</mark></strong> 예언해 준 말씀을 통해서 그대에게 맡겨진 직무를 등한히 하지 마시오.” (<a href="https://bibleox.com/ko/ko-ctb/1tim/4/#L14">1디모 4:14</a>)</p></blockquote><blockquote><p>“세례와 <strong><mark>안수</mark></strong>, 그리고 죽은 자들의 부활과 영원한 심판과 같은 <strong><mark>기초적인 교리</mark></strong>를 다시 배우는 일은 없도록 합시다.” (<a href="https://bibleox.com/ko/ko-ctb/evr/6/#L2">히브 6:2</a>)</p></blockquote><p>성경을 살펴보면 교회가 사도들 뒤에 이런 관습과 태도를 이교도에게서 가져왔다는 비난이 놀랍습니다. 사도들 자신이 자기들의 안수를 통해 주어진 하느님의 은사를 쓰며 이를 가르침의 일부로 말하기 때문입니다. 이 모든 것은 (방식 자체도) 새로운 것이 아니라, 사도들 이전에 같은 환경에서 수백 년 동안 있었고 이교도가 아니라 하느님께서 친히 세우신 것입니다.</p><h3>신약에서는 사제라고 부르지 않았는가?</h3><p>“사제직”이라는 말은 신약의 문맥에 나옵니다. 그리스도께서는 사제직을 폐지하신 것이 아니라 바꾸셨습니다:</p><blockquote><p>“<strong><mark>사제 제도가 변하면</mark></strong> 율법도 변하게 마련입니다.” (<a href="https://bibleox.com/ko/ko-ctb/evr/7/#L12">히브 7:12</a>) <em>(그리스어: ἱερωσύνη)</em></p></blockquote><p>그리스도께서는 영원한 대사제가 되셨지만 사제들은 폐지되지 않았습니다. 그들을 뽑아 세우는 일은 예언에 나옵니다:</p><blockquote><p>“나는 가서 <strong><mark>다른 말을 쓰는 모든 민족들을 모아 오리라</mark></strong>. 그들은 와서 나의 영광을 볼 것이다. 그들 가운데 난을 면할 자들에게 표를 주어 다르싯, 풋트, 룻, 모섹, 로스, 두발, 야반 등 여러 민족들, 나의 소문을 듣지도 못하고 나의 영광을 보지도 못한 먼 섬나라에 사는 사람들에게 보내어, 만방에 나의 영광을 전하게 하리라. 그들은 민족들 가운데서 너희 모든 겨레를 말과 수레와 포장마차와 노새와 낙타에 태워 나의 거룩한 산 예루살렘에 데려다가 선물로 야훼에게 바칠 것이다. 이스라엘 백성이 정한 그릇에 선물을 담아다가 야훼의 성전에 바치듯이 바칠 것이다. 야훼가 말한다. <strong><mark>내가 그들 가운데서 더러는 사제로, 더러는 레위인으로 뽑아 세우리라. 야훼가 말한다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/is/66/#L18-21">이사 66:18-21</a>) <em>(“사제”: ἱερεῖς, כֹּהֲנִ֥ים)</em></p></blockquote><p>게다가 다른 누구도 아닌 사도들이 실제로 사제였습니다. 구약에서 사람을 죄에서 깨끗하게 하는 임무는 사제에게 있었고(<a href="https://bibleox.com/ko/ko-ctb/lev/5/#L5-6">레 5:5-6</a>), 신약에서도 새 교회 위계가 세워질 때 이 권한, 곧 죄를 용서하고 그대로 두는 권한이 주어집니다:</p><blockquote><p>“예수께서 다시 ‘너희에게 평화가 있기를! 내 아버지께서 나를 보내 주신 것처럼 나도 너희를 보낸다’하고 말씀하셨다. 이렇게 말씀하신 다음 예수께서는 그들에게 <strong>숨을 내쉬시며</strong> 말씀을 계속하셨다. ‘<strong>성령을 받아라</strong>. <strong>누구의 죄든지 너희가 용서해 주면 그들의 죄는 용서받을 것이고 용서해 주지 않으면 용서받지 못한 채 남아 있을 것이다</strong>.’” (<a href="https://bibleox.com/ko/ko-ctb/in/20/#L21-23">요한 20:21-23</a>)</p></blockquote><p>가장 오래된 그리스도인들은 사제(presbyter)가 또한 제사장이었음을 확인해 줍니다: <a href="https://bibleox.com/ru/ru/w/gq8M_Новозаветные_пресвитеры__священники">인용문</a>.</p>'
