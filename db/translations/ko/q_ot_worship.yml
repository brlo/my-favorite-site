  title: 언약궤
  copy_cover: true
  body: <h2>언약궤(증거궤)</h2><p><a href="https://bibleox.com/ru/ru/w/иерусалимский-храм">예루살렘 성전</a>의 <a href="https://bibleox.com/ru/ru/w/иерусалимский-храм">지성소</a> 가운데, 그룹들의 날개 아래에 언약궤가 있었고(<a href="https://bibleox.com/ko/ko-nkrv/3ts/6/#L19">왕상 6:19</a>; <a href="https://bibleox.com/ko/ko-nkrv/3ts/8/#L6">왕상 8:6</a>; <a href="https://bibleox.com/ko/ko-nkrv/2par/5/#L7">대하 5:7</a>), 궤를 메는 채도 함께 있었습니다(<a href="https://bibleox.com/ko/ko-nkrv/3ts/8/#L7">왕상 8:7</a>; <a href="https://bibleox.com/ko/ko-nkrv/2par/5/#L9">대하 5:9</a>; <a href="https://bibleox.com/ko/ko-nkrv/ish/25/#L15">출 25:15</a>).</p><h3>궤</h3><p>크기는 2.5 × 1.5규빗, 높이 1.5규빗입니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/25/#L10">출 25:10</a>). 조각목(아카시아 나무)으로 만들었습니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/25/#L10">출 25:10</a>). 안팎을 금으로 쌌고, 위쪽 가장자리에는 금 테를 둘렀습니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/25/#L11">출 25:11</a>).</p><h3>고리</h3><p>궤의 아래 네 모퉁이에는 궤를 메기 위한 금 고리를 달았습니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/25/#L14">출 25:14</a>). 고리는 모두 넷입니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/25/#L12">출 25:12</a>).</p><h3>채</h3><p>고리에는 조각목으로 만든 채 둘을 꿰었습니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/25/#L13">출 25:13</a>). 채는 금으로 쌌습니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/25/#L13">출 25:13</a>). 채는 궤에서 빼내면 안 됩니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/25/#L15">출 25:15</a>).</p><h3>덮개(속죄소)</h3><p>크기는 궤와 같이 2.5 × 1.5규빗이며, 순금으로 만들었습니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/25/#L17">출 25:17</a>).</p><h3>그룹</h3><p>궤의 덮개 위에는 금으로 그룹 두 형상을 만들었습니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/25/#L18">출 25:18</a>). 한 그룹은 덮개 이 끝에, 다른 그룹은 저 끝에 있으며(<a href="https://bibleox.com/ko/ko-nkrv/ish/25/#L19">출 25:19</a>), 서로 마주 보고 덮개를 향합니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/25/#L20">출 25:20</a>). 날개는 높이 펴서 덮개를 덮습니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/25/#L20">출 25:20</a>).</p><h3>궤 안에 있던 것</h3><p>궤 안에는 선지자 모세가 넣은 언약의 돌판 둘(<a href="https://bibleox.com/ko/ko-nkrv/3ts/8/#L9">왕상 8:9</a>; <a href="https://bibleox.com/ko/ko-nkrv/2par/5/#L10">대하 5:10</a>), 만나(<a href="https://bibleox.com/ko/ko-nkrv/ish/16/#L32-34">출 16:32-34</a>), 그리고 꽃이 피고 살구 열매가 열린 아론의 지팡이가 있었습니다(<a href="https://bibleox.com/ko/ko-nkrv/chis/17/#L8-11">민 17:8-11</a>).</p><h2>궤 위에서 말씀하시는 하느님</h2><p>하느님께서는 궤의 덮개 위, 두 그룹 사이에서 나타나시고 말씀하십니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/25/#L22">출 25:22</a>).</p>
  title_sub: 언약궤의 구조
  meta_desc: 언약궤의 구조에 관한 성경 구절
  menu:
    parent: 구약/예배
    title: 언약궤
    priority: 2
  references: "<p>번역: 로디온 블라소프 (AI 도구 활용). 저본: 러시아어 원문. 참고: 영어·일본어 번역. 성경 인용과 링크는 개역개정에 따름.</p>"
- src: ветхозаветный-священник
  path: Pr3o_구약의_제사장
  title: 구약의 제사장
  copy_cover: true
  body: '<h2>제사장 직분에 들어가는 조건</h2><h3>제사장은 아론의 자손만</h3><p>아론(선지자 모세의 형)과 그의 자손만 제사장이 될 수 있었습니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/28/#L1">출 28:1</a>; <a href="https://bibleox.com/ko/ko-nkrv/ish/28/#L4">출 28:4</a>).</p><h3>대제사장 직분의 계승</h3><p>아론(선지자 모세의 형)과 그의 자손만 제사장이 될 수 있었습니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/28/#L1">출 28:1</a>; <a href="https://bibleox.com/ko/ko-nkrv/ish/28/#L4">출 28:4</a>; <a href="https://bibleox.com/ko/ko-nkrv/ish/29/#L9">출 29:9</a>). 대제사장의 후계자는 이레 동안 옷을 입고 기름 부음을 받았습니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/29/#L29-30">출 29:29-30</a>). 직분과 함께 거룩한 옷도 물려주었습니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/29/#L29">출 29:29</a>). 외인이 제사장의 일을 맡으면 죽임을 당하였습니다(<a href="https://bibleox.com/ko/ko-nkrv/chis/3/#L10">민 3:10</a>).</p><h3>후보자의 조건</h3><p>몸에 흠이 없어야 합니다(<a href="https://bibleox.com/ko/ko-nkrv/lev/21/#L17-21">레 21:17-21</a>):</p><ul><li><p>맹인,</p></li><li><p>다리 저는 자,</p></li><li><p>코가 불완전하거나 지체가 더한 자,</p></li><li><p>발 부러진 자나 손 부러진 자,</p></li><li><p>등 굽은 자,</p></li><li><p>눈에 백막이 있는 자,</p></li><li><p>습진이나 버짐이 있는 자나 고환 상한 자.</p></li></ul><h3>제사장에게 요구되는 것</h3><ul><li><p>머리털을 밀거나 수염 양쪽을 깎지 말아야 합니다(<a href="https://bibleox.com/ko/ko-nkrv/lev/21/#L1,5">레 21:1,5</a>).</p></li><li><p>이혼당한 여인(<a href="https://bibleox.com/ko/ko-nkrv/lev/21/#L7">레 21:7</a>), 기생이나 부정한 여인을 아내로 맞지 말아야 하며(<a href="https://bibleox.com/ko/ko-nkrv/lev/21/#L7">레 21:7</a>), 대제사장의 아내는 처녀여야 합니다(<a href="https://bibleox.com/ko/ko-nkrv/lev/21/#L13-14">레 21:13-14</a>).</p></li><li><p>시체를 만지지 말아야 하며(<a href="https://bibleox.com/ko/ko-nkrv/lev/21/#L1-4">레 21:1-4</a>), 대제사장은 죽은 친족도 가까이하지 못합니다(<a href="https://bibleox.com/ko/ko-nkrv/lev/21/#L10-11">레 21:10-11</a>).</p></li><li><p>대제사장은 머리를 풀지 말아야 합니다(<a href="https://bibleox.com/ko/ko-nkrv/lev/21/#L10">레 21:10</a>).</p></li></ul><h2>위임 예식</h2><h3>요약</h3><p>제물을 드림, 씻음, 기름 부음(<a href="https://bibleox.com/ko/ko-nkrv/ish/28/#L41">출 28:41</a>), 짐승의 피를 뿌림, 그리고 식사로 이루어집니다. 위임에는 거룩한 옷이 필요하며(<a href="https://bibleox.com/ko/ko-nkrv/ish/28/#L2-3">출 28:2-3</a>), 이 옷은 직분과 함께 물려줍니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/29/#L29">출 29:29</a>).</p><h3>구약 대제사장의 위임</h3><h4>제물</h4><p>위임을 위하여 흠 없는 짐승(<a href="https://bibleox.com/ko/ko-nkrv/ish/29/#L1">출 29:1</a>)과 고운 밀가루로 만든 무교병(<a href="https://bibleox.com/ko/ko-nkrv/ish/29/#L2">출 29:2</a>)을 드려야 합니다.</p><ul><li><p><strong>어린 수소 하나</strong>,</p></li><li><p><strong>숫양 둘</strong>,</p></li><li><p>기름 섞은 무교 <strong>과자</strong>와 기름 바른 무교 전병,</p></li><li><p>고운 밀가루로 만든 <strong>무교병</strong>.</p></li></ul><p>대제사장과 제사장들이 수소의 머리에 안수하고, 회막 문에서 수소를 잡습니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/29/#L10-11">출 29:10-11</a>)(그리스도께서 죽임당하심의 예표).</p><p>수소의 피를 제단 뿔들에 바르고 나머지 피는 모두 제단 밑에 쏟습니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/29/#L12">출 29:12</a>)(십자가 제단 위에서 그리스도께서 받으신 고난의 예표). 수소의 내장(간 꺼풀, 콩팥 등)은 제단 위에서 불사릅니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/29/#L13">출 29:13</a>). 수소의 고기와 가죽과 똥은 진 밖에서 불사릅니다. 이것은 속죄제입니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/29/#L14">출 29:14</a>).</p><p>마찬가지로 대제사장과 제사장들이 숫양 한 마리의 머리에 안수하고(<a href="https://bibleox.com/ko/ko-nkrv/ish/29/#L15">출 29:15</a>), 숫양을 잡아 그 피를 제단 둘레에 뿌립니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/29/#L16">출 29:16</a>). 숫양은 각을 뜨고 내장을 씻은 뒤 제단 위에서 불사릅니다. 이것은 여호와께 드리는 번제입니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/29/#L17-18">출 29:17-18</a>).</p><p>대제사장과 제사장들은 다른 숫양의 머리에도 안수하고(<a href="https://bibleox.com/ko/ko-nkrv/ish/29/#L19">출 29:19</a>) 그것을 잡아(<a href="https://bibleox.com/ko/ko-nkrv/ish/29/#L20">출 29:20</a>), 그 피를 아론과 그 아들들의 오른쪽 귓부리와 오른손 엄지와 오른발 엄지에 바르고(<a href="https://bibleox.com/ko/ko-nkrv/ish/29/#L20">출 29:20</a>), 나머지 피는 제단 둘레에 뿌렸습니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/29/#L20">출 29:20</a>).</p><p>제단 위의 피와 관유를 아론과 그 아들들과 그들의 옷에 뿌렸습니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/29/#L21">출 29:21</a>). 이제 그들은 거룩하게 됩니다.</p><p>이어서 숫양의 기름(<a href="https://bibleox.com/ko/ko-nkrv/ish/29/#L22">출 29:22</a>)과, 무교병 광주리에서 떡 한 개와 기름 바른 과자 한 개와 전병 한 개를 가져다가(<a href="https://bibleox.com/ko/ko-nkrv/ish/29/#L23">출 29:23</a>) 아론과 그 아들들의 손에 두었다가(<a href="https://bibleox.com/ko/ko-nkrv/ish/29/#L24">출 29:24</a>) 다시 받아 제단 위에서 불살랐습니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/29/#L25">출 29:25</a>). 숫양의 가슴도 드렸습니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/29/#L26-28">출 29:26-28</a>).</p><h4>씻음</h4><p>위임 전에 물로 씻습니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/29/#L4">출 29:4</a>).</p><h4>제사장의 옷을 입힘</h4><p>씻은 뒤에 거룩한 옷을 입힙니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/29/#L5-6">출 29:5-6</a>). 제사장들에게도 옷을 입힙니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/29/#L8-9">출 29:8-9</a>).</p><h4>머리에 기름을 부음</h4><p>옷을 입힌 뒤에 기름을 붓습니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/28/#L41">출 28:41</a>). 기름은 머리에 붓습니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/29/#L7">출 29:7</a>).</p><h4>식사</h4><p>숫양의 고기는 거룩한 곳에서 삶았고(<a href="https://bibleox.com/ko/ko-nkrv/ish/29/#L31">출 29:31</a>), 대제사장과 제사장들은 그것을 회막 문에서 먹어야 했습니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/29/#L32">출 29:32</a>). 외인은 이 식사에 참여할 수 없었습니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/29/#L33">출 29:33</a>). 고기가 아침까지 남으면 불살라야 했습니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/29/#L34">출 29:34</a>).</p><h4>이레 동안 되풀이함</h4><p>제물을 드리고 위임하는 이 모든 예식을 이레 동안 되풀이하였습니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/29/#L35">출 29:35</a>; <a href="https://bibleox.com/ko/ko-nkrv/lev/8/#L33-34">레 8:33-34</a>). 그 결과 제단은 지극히 거룩하게 되어, 제단에 닿는 것은 모두 거룩하게 됩니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/29/#L37">출 29:37</a>)(거룩한 것이 된 그리스도의 십자가의 예표).</p><h2>옷</h2><h3>목적</h3><p>영화롭고 아름답게 하며 거룩하게 구별하기 위함이고(<a href="https://bibleox.com/ko/ko-nkrv/ish/28/#L2-3">출 28:2-3</a>), 대제사장 직분을 물려주기 위함입니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/29/#L29">출 29:29</a>).</p><h3>구성</h3><p>대제사장의 옷은 다음과 같습니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/28/#L4">출 28:4</a>):</p><ul><li><p><strong>흉패</strong>,</p></li><li><p><strong>에봇</strong>(겉에 입는 옷),</p></li><li><p><strong>겉옷</strong>(에봇 받침 겉옷),</p></li><li><p>반포 <strong>속옷</strong>,</p></li><li><p><strong>관</strong>(머리에 쓰는 것),</p></li><li><p><strong>띠</strong>.</p></li></ul><h3>에봇(소매 없는 겉옷)</h3><p>금 실과 여러 색 실(청색, 자색, 홍색)과 가늘게 꼰 베 실로 만듭니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/28/#L5-6">출 28:5-6</a>).</p><h4>견대</h4><p>에봇은 한 장으로 되어 있지 않고 뒤쪽과 앞쪽으로 되어 있어서, 어깨에서 “견대”로 잇습니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/28/#L7">출 28:7</a>).</p><p>두 견대를 위하여 장식 둘을 만들었습니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/28/#L12">출 28:12</a>). 금 테에 물린 호마노 두 개입니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/28/#L10">출 28:10</a>). 이 보석에는 이스라엘 지파의 이름 열둘을 새겼습니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/28/#L9">출 28:9</a>). 태어난 순서대로 한 보석에 여섯 이름, 다른 보석에 여섯 이름입니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/28/#L10">출 28:10</a>). 보석은 금 테에 물리고 금사슬로 꾸몄습니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/28/#L13-14">출 28:13-14</a>).</p><p>에봇의 가장자리, 아마 띠 가까이에는 흉패를 매기 위한 고리 둘이 있었던 것으로 보입니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/28/#L28">출 28:28</a>).</p><h3>띠</h3><p>정교하게 짠 띠는 에봇 위에 띠며, 에봇과 같은 재료, 곧 금 실과 청색 자색 홍색 실과 가늘게 꼰 베 실로 만듭니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/28/#L8">출 28:8</a>). 띠는 수 놓아 만들었습니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/28/#L39">출 28:39</a>).</p><h3>흉패</h3><p>두 겹으로 접은 네모난 천입니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/28/#L16">출 28:16</a>). 크기: 길이와 너비가 한 뼘씩, 약 23 × 23센티미터(<a href="https://bibleox.com/ko/ko-nkrv/ish/28/#L16">출 28:16</a>). 한 뼘은 손을 폈을 때 엄지 끝에서 새끼손가락 끝까지의 길이로 약 23센티미터입니다. 에봇과 같은 재료(금 실, 색실, 베 실)로 만듭니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/28/#L15">출 28:15</a>).</p><p>이 천에 보석 열두 개를 물립니다. 한 줄에 세 개씩 모두 네 줄입니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/28/#L17">출 28:17</a>; 보석의 이름은 개역개정을 따름):</p><ul><li><p>홍보석, 황옥, 녹주옥(<a href="https://bibleox.com/ko/ko-nkrv/ish/28/#L17">출 28:17</a>),</p></li><li><p>석류석, 남보석, 홍마노(<a href="https://bibleox.com/ko/ko-nkrv/ish/28/#L18">출 28:18</a>),</p></li><li><p>호박, 백마노, 자수정(<a href="https://bibleox.com/ko/ko-nkrv/ish/28/#L19">출 28:19</a>),</p></li><li><p>녹보석, 호마노, 벽옥(<a href="https://bibleox.com/ko/ko-nkrv/ish/28/#L20">출 28:20</a>).</p></li></ul><p>보석에는 이스라엘 열두 지파의 이름을 하나씩 새겼습니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/28/#L21">출 28:21</a>).</p><p>흉패는 견대에 매었습니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/28/#L23">출 28:23</a>). 이를 위하여 흉패 위쪽 두 끝에 금 고리를 달고(<a href="https://bibleox.com/ko/ko-nkrv/ish/28/#L23">출 28:23</a>) 순금 사슬(<a href="https://bibleox.com/ko/ko-nkrv/ish/28/#L22">출 28:22</a>)을 꿰었으며(<a href="https://bibleox.com/ko/ko-nkrv/ish/28/#L24">출 28:24</a>), 사슬의 다른 끝은 앞쪽 견대에 매었습니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/28/#L22">출 28:22</a>; <a href="https://bibleox.com/ko/ko-nkrv/ish/28/#L25">출 28:25</a>).</p><p>흉패 아래쪽 두 끝에는 금 고리 넷이 있었습니다. 둘은 안쪽(에봇 쪽)에(<a href="https://bibleox.com/ko/ko-nkrv/ish/28/#L26">출 28:26</a>), 둘은 바깥쪽에 있었습니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/28/#L27">출 28:27</a>). 이 고리들을 청색 끈으로 에봇의 고리에 매어(<a href="https://bibleox.com/ko/ko-nkrv/ish/28/#L28">출 28:28</a>) 흉패가 띠 위에 붙어 에봇에서 떨어지지 않게 하였습니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/28/#L28">출 28:28</a>).</p><p>흉패는 성소(성전)에 들어갈 때마다 붙였습니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/28/#L29">출 28:29</a>).</p><h4>우림과 둠밈</h4><p>흉패 안에는(두 겹으로 접은 천이었으므로) <a href="https://bibleox.com/ru/ru/w/ковчег_завета">언약궤</a>처럼 신비한 물건을 넣었습니다(<a href="https://bibleox.com/ko/ko-nkrv/lev/8/#L8">레 8:8</a>). 그것이 <strong>우림과 둠밈</strong>[1][2]이며, 칠십인역과 교회 슬라브어 번역에서는 <strong>“나타냄과 진리”</strong>라고 합니다(<a href="https://bibleox.com/ko/gr-lxx-byz/ish/28/#L30">출 28:30</a>). 대제사장은 이것을 가슴에 붙여야 했습니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/28/#L30">출 28:30</a>).</p><h3>겉옷</h3><p>청색 천으로 만듭니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/28/#L31">출 28:31</a>). 겉옷에는 머리가 들어갈 구멍이 있어야 합니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/28/#L32">출 28:32</a>). 구멍 둘레에는 찢어지지 않도록 짜서 깃을 둡니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/28/#L32">출 28:32</a>).</p><p>겉옷 아래 가장자리에는 청색 자색 홍색 실로 석류를 수놓습니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/28/#L33">출 28:33</a>). 석류 사이에는 금방울을 답니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/28/#L33">출 28:33</a>). 한 금방울, 한 석류, 한 금방울, 한 석류가 겉옷 가장자리로 돌아가며 있습니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/28/#L34">출 28:34</a>).</p><h3>관</h3><p>관은 가는 베 실로 만듭니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/28/#L39">출 28:39</a>).</p><h4>금 패</h4><p>관에는 “여호와께 성결”이라고 새긴 순금 패를 달았습니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/28/#L36">출 28:36</a>). 패는 청색 끈으로 관 앞쪽에 매어(<a href="https://bibleox.com/ko/ko-nkrv/ish/28/#L37">출 28:37</a>) 이마에 오게 합니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/28/#L38">출 28:38</a>).</p><h3>속옷</h3><p>속옷은 가는 베 실로 짭니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/28/#L39">출 28:39</a>). 그 아래에는 허리에서 넓적다리까지 이르는 베 속바지를 입습니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/28/#L42">출 28:42</a>).</p><h2>일반 제사장</h2><p>일반 제사장의 옷은 자세히 묘사되어 있지 않습니다. 그들의 옷도 영화롭고 아름답게 하기 위하여 만듭니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/28/#L40">출 28:40</a>).</p><p>제사장은 속옷(<a href="https://bibleox.com/ko/ko-nkrv/ish/28/#L40">출 28:40</a>), 띠(<a href="https://bibleox.com/ko/ko-nkrv/ish/28/#L39">출 28:39</a>–<a href="https://bibleox.com/ko/ko-nkrv/ish/28/#L40">출 28:40</a>), 그리고 관(두건)이 있어야 합니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/28/#L40">출 28:40</a>).</p><p>이 옷은 회막에 들어갈 때와 성소(성전)에서 섬길 때 입습니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/28/#L43">출 28:43</a>).</p><h2>제사</h2><p>날마다 회막 문에서(<a href="https://bibleox.com/ko/ko-nkrv/ish/29/#L42">출 29:42</a>) <strong>일 년 된 어린 양 둘</strong>을 드려야 합니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/29/#L38">출 29:38</a>). 하나는 아침에, 하나는 저녁에 드립니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/29/#L39">출 29:39</a>).</p><p>어린 양과 함께 <strong>고운 가루</strong>와 <strong>기름</strong>과 <strong>포도주</strong>를 드립니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/29/#L40">출 29:40</a>).</p><p>제사를 드리는 곳은 하느님의 영광으로 거룩하게 됩니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/29/#L43">출 29:43</a>).</p>'
