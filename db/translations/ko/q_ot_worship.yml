    title: 구약의 제사장
    priority: 3
  references: '<ol><li><p>로푸힌(A. P. Lopukhin)의 해설 참조(러시아어): <a href="https://bible.optina.ru/old:ish:28:30#lopuxin_ap">https://bible.optina.ru/old:ish:28:30#lopuxin_ap</a></p></li><li><p><a href="https://ko.wikipedia.org/wiki/우림과_둠밈">https://ko.wikipedia.org/wiki/우림과_둠밈</a></p></li></ol><p>번역: 로디온 블라소프 (AI 도구 활용). 저본: 러시아어 원문. 참고: 영어·일본어 번역. 성경 인용과 링크는 개역개정에 따름.</p>'
- src: фимиам
  path: In20c_향
  title: 향, 유향, 향로
  copy_cover: true
  body: <h2>정의</h2><p><strong>향</strong> — 유향(나무진)을 태울 때 나는 연기, 또는 태우는 향기로운 혼합물입니다.</p><p><strong>유향</strong>(히브리어 ‘레보나’, 곧 “흰 것”) — 몇몇 나무에서 나오는 향기로운 나무진입니다. 유향을 태우면 좋은 향기가 납니다. 거룩한 예식과 거룩한 향을 만드는 데 쓰입니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/30/#L34-36">출 30:34-36</a>).</p><p><strong>분향</strong> — 유향을 태우는 일, 곧 향의 연기가 피어오르게 하는 것입니다.</p><p><strong>향로</strong> — 향기로운 혼합물(유향을 섞은 것)을 태우는 기구(그릇)입니다.</p><h2>성경 구절</h2><h3>유향을 섞은 향은 지극히 거룩하다</h3><blockquote><p>“여호와께서 모세에게 이르시되 너는 소합향과 나감향과 풍자향의 <strong>향품을 가져다가</strong> 그 향품을 <strong>유향</strong>에 섞되 각기 같은 분량으로 하고 그것으로 향을 만들되 향 만드는 법대로 만들고 그것에 소금을 쳐서 성결하게 하고 그 향 얼마를 곱게 찧어 내가 너와 만날 회막 안 증거궤 앞에 두라 이 향은 너희에게 <strong>지극히 거룩하니라</strong> <strong>네가 여호와를 위하여 만들 향은 거룩한 것이니</strong> 너희를 위하여는 그 방법대로 만들지 말라 냄새를 맡으려고 이같은 것을 만드는 모든 자는 그 백성 중에서 끊어지리라” (<a href="https://bibleox.com/ko/ko-nkrv/ish/30/#L34-38">출 30:34-38</a>)</p></blockquote><h3>소제에는 기름과 함께 유향을 놓고, 제사장이 그 예물을 불사른다</h3><blockquote><p>“누구든지 <strong>소제의 예물</strong>을 여호와께 드리려거든 고운 가루로 예물을 삼아 그 위에 기름을 붓고 또 <strong><mark>그 위에 유향을 놓아</mark></strong> 아론의 자손 제사장들에게로 가져갈 것이요 제사장은 그 고운 가루 한 움큼과 기름과 그 모든 유향을 가져다가 <strong>기념물로 제단 위에서 불사를지니</strong> 이는 화제라 여호와께 향기로운 냄새니라” (<a href="https://bibleox.com/ko/ko-nkrv/lev/2/#L1-2">레 2:1-2</a>)</p></blockquote><h3>유향 없이 드리는 예물도 있다</h3><blockquote><p>“그의 아내를 데리고 제사장에게로 가서 그를 위하여 보리 가루 십분의 일 에바를 <strong>헌물로 드리되</strong> 그것에 기름도 붓지 말고 <strong>유향도 두지 말라</strong> 이는 의심의 소제요 죄악을 기억나게 하는 기억의 소제라” (<a href="https://bibleox.com/ko/ko-nkrv/chis/5/#L15">민 5:15</a>)</p></blockquote><h3>분향만을 위한 제단</h3><p>분향하는 제단은 따로 만들게 하셨고, 그 위에는 다른 것을 사르지 못하게 하셨습니다. 분향은 제사와 상관없이 그 자체로 드립니다. 아침마다, 저녁마다 등불을 손질할 때 분향합니다.</p><blockquote><p>“<strong>너는 분향할 제단을 만들지니</strong> 곧 조각목으로 만들되 &lt;…&gt; 그 제단을 증거궤 위 속죄소 맞은편 곧 <strong>증거궤 앞에 있는 휘장 밖에</strong> 두라 그 속죄소는 내가 너와 만날 곳이며 <strong>아론이 아침마다 그 위에 향기로운 향을 사르되 등불을 손질할 때에 사를지며</strong> 또 저녁 때 등불을 켤 때에 사를지니 이 향은 너희가 대대로 여호와 앞에 끊지 못할지며 너희는 그 위에 다른 향을 사르지 말며 번제나 소제를 드리지 말며 전제의 술을 붓지 말며” (<a href="https://bibleox.com/ko/ko-nkrv/ish/30/#L1,6-9">출 30:1,6-9</a>)</p></blockquote><h3>향은 기도를 상징한다</h3><blockquote><p>“<strong>나의 기도가 주의 앞에 분향함과 같이 되며</strong> 나의 손 드는 것이 저녁 제사 같이 되게 하소서” (<a href="https://bibleox.com/ko/ko-nkrv/ps/141/#L2">시 141:2</a>)</p></blockquote><blockquote><p>“그 두루마리를 취하시매 네 생물과 이십사 장로들이 그 어린 양 앞에 엎드려 각각 거문고와 <strong>향이 가득한 금 대접</strong>을 가졌으니 <strong>이 향은 성도의 기도들이라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/5/#L8">계 5:8</a>)</p></blockquote><h3>향은 하느님께 드리는 독립된 예물이다</h3><p>향은 따로 언급되며, 다른 거룩한 예식들과 나란히 열거됩니다(무엇에 덧붙이는 것이나, 다른 것과 함께해야만 하는 것으로 나오지 않습니다).</p><blockquote><p>“이스라엘 모든 지파 중에서 <strong>내가 그를 택하여</strong> 내 제사장으로 삼아 그가 내 제단에 올라 <strong>분향하며</strong> 내 앞에서 에봇을 입게 하지 아니하였느냐 이스라엘 자손이 드리는 모든 화제를 내가 네 조상의 집에 주지 아니하였느냐” (<a href="https://bibleox.com/ko/ko-nkrv/1ts/2/#L28">삼상 2:28</a>)</p></blockquote><blockquote><p>“이때에 저희에게는 통치자도 예언자도 지도자도 없고, 번제도 희생 제물도 예물도 <strong>향도 없으며</strong>, 주님 앞에 맏물을 바쳐 자비를 얻을 곳도 없습니다” (<a href="https://bibleox.com/ko/gr-lxx-byz/dan/3/#L38">단 3:38</a>, 그리스어에서 번역) <em>(다니엘서의 그리스어 본문에 있는 아자리야의 기도. 개역개정에는 없습니다.)</em></p></blockquote><blockquote><p>“만군의 여호와가 이르노라 해 뜨는 곳에서부터 해 지는 곳까지의 이방 민족 중에서 내 이름이 크게 될 것이라 <strong>각처에서 내 이름을 위하여 분향하며</strong> 깨끗한 제물을 드리리니 이는 내 이름이 이방 민족 중에서 크게 될 것임이니라” (<a href="https://bibleox.com/ko/ko-nkrv/mal/1/#L11">말 1:11</a>)</p></blockquote><blockquote><p>“그들은 새 거룩한 기구들을 만들고, 등잔대와 <strong>분향 제단</strong>과 상을 성전 안으로 들여놓았다. 그리고 <strong>제단 위에 분향하고</strong> 등잔대 위의 등불을 켜서 성전을 밝혔다” (<a href="https://bibleox.com/ko/gr-lxx-byz/1mak/4/#L49-50">1마카 4:49-50</a>, 그리스어에서 번역)</p></blockquote><blockquote><p>“주님께서는 그에게 명하시어 주님의 이름을 위하여 성읍을 짓고 거기서 주님께 <strong>향</strong>과 제물을 드리게 하셨습니다” (<a href="https://bibleox.com/ko/ru/3ezd/3/#L24">3에스 3:24</a>, 러시아어 시노달 역본에서 옮김) <em>(영어 번역(NRSV)에는 “예물”만 있고 향은 나오지 않습니다.)</em></p></blockquote><blockquote><p>“요시야에 대한 기억은 향 만드는 사람의 솜씨로 빚은 <strong>향의 혼합물</strong> 같아서, 모든 입에 꿀처럼 달고 포도주 잔치의 음악 같다” (<a href="https://bibleox.com/ko/gr-lxx-byz/prsir/49/#L1">집회 49:1</a>, 그리스어에서 번역)</p></blockquote><blockquote><p>“백성에게 둘러싸여 휘장 집에서 나올 때 그[대제사장 시몬]는 얼마나 영광스러웠던가! … <strong>향로 위의 불과 유향</strong> 같았다” (<a href="https://bibleox.com/ko/gr-lxx-byz/prsir/50/#L5,9">집회 50:5,9</a>, 그리스어에서 번역)</p></blockquote><blockquote><p>“나의 기도가 주의 앞에 <strong>분향함과 같이</strong> 되며 나의 손 드는 것이 저녁 제사 같이 되게 하소서” (<a href="https://bibleox.com/ko/ko-nkrv/ps/141/#L2">시 141:2</a>)</p></blockquote><blockquote><p>“그가 강성하여지매 그의 마음이 교만하여 악을 행하여 그의 하나님 여호와께 범죄하되 곧 <strong>여호와의 성전에 들어가서 향단에 분향하려</strong> 한지라” (<a href="https://bibleox.com/ko/ko-nkrv/2par/26/#L16">대하 26:16</a>)</p></blockquote><blockquote><p>“<strong>몰약과 유향</strong>과 상인의 여러 가지 향품으로 향내 풍기며 연기 기둥처럼 거친 들에서 오는 자가 누구인가” (<a href="https://bibleox.com/ko/ko-nkrv/pp/3/#L6">아 3:6</a>)</p></blockquote><blockquote><p>“네 번제의 양을 내게로 가져오지 아니하였고 네 제물로 나를 공경하지 아니하였느니라 나는 제물로 말미암아 너를 수고롭게 하지 아니하였고 <strong>유향으로 말미암아 너를 괴롭게 하지 아니하였거늘</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/is/43/#L23">사 43:23</a>)</p></blockquote><blockquote><p>“또 다른 천사가 와서 제단 곁에 서서 금 향로를 가지고 <strong>많은 향</strong>을 받았으니 이는 <strong>모든 성도의 기도와 합하여 보좌 앞 금 제단에 드리고자</strong> 함이라” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/8/#L3">계 8:3</a>)</p></blockquote><blockquote><p>“<strong>향연이 성도의 기도와 함께 천사의 손으로부터 하나님 앞으로 올라가는지라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/8/#L4">계 8:4</a>)</p></blockquote><h3>거짓 신들에게 분향하면 하느님께서 노하신다</h3><blockquote><p>“무리가 나를 버리고 <strong>다른 신들에게 분향하며</strong> 자기 손으로 만든 것들에 절하였은즉 내가 나의 심판을 그들에게 선고하여 그들의 모든 죄악을 징계하리라” (<a href="https://bibleox.com/ko/ko-nkrv/ier/1/#L16">렘 1:16</a>)</p></blockquote><blockquote><p>“곧 동산에서 제사하며 <strong>벽돌 위에서 분향하여</strong> 내 앞에서 항상 내 노를 일으키는 백성이라” (<a href="https://bibleox.com/ko/ko-nkrv/is/65/#L3">사 65:3</a>)</p></blockquote><blockquote><p>“너희의 죄악과 너희 조상들의 죄악은 한 가지니 그들이 <strong>산 위에서 분향하며</strong> 작은 산 위에서 나를 능욕하였음이라 그러므로 내가 먼저 그들의 행위를 헤아리고 그들의 품에 보응하리라 여호와가 말하였느니라” (<a href="https://bibleox.com/ko/ko-nkrv/is/65/#L7">사 65:7</a>)</p></blockquote><p>거룩한 향을 자기를 위하여 쓰면 사형에 처합니다.</p><blockquote><p>“네가 여호와를 위하여 만들 향은 거룩한 것이니 너희를 위하여는 그 방법대로 만들지 말라 <strong>냄새를 맡으려고 이같은 것을 만드는 모든 자는 그 백성 중에서 끊어지리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ish/30/#L37-38">출 30:37-38</a>)</p></blockquote>
