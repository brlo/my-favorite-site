  path: Jt1t_예루살렘_성전
  title: 구약의 예루살렘 성전
  copy_cover: true
  body: '<h2>개요</h2><p>성전은 솔로몬이 모리아 산 위(<a href="https://bibleox.com/ko/ko-nkrv/2par/3/#L1">대하 3:1</a>), 여부스 사람 오르난(아라우나)의 타작 마당(곡식을 모아 떠는 곳)이 있던 자리에 지었습니다(<a href="https://bibleox.com/ko/ko-nkrv/2par/3/#L1">대하 3:1</a>). 그곳은 솔로몬의 아버지 다윗이 백성을 치는 천사를 본 곳이며, 선지자 갓도 그곳을 가리켜 주었습니다(<a href="https://bibleox.com/ko/ko-nkrv/2ts/24/#L16-18">삼하 24:16-18</a>). 성전 건축은 이스라엘 자손이 애굽에서 나온 지 480년째(칠십인역으로는 440년째) 되는 해, 곧 솔로몬 즉위 넷째 해 시브월에 시작되었습니다(<a href="https://bibleox.com/ko/ko-nkrv/3ts/6/#L37">왕상 6:37</a>; <a href="https://bibleox.com/ko/ko-nkrv/2par/3/#L2">대하 3:2</a>). 건축은 7년 뒤, 솔로몬 즉위 열한째 해 불월에 끝났습니다(<a href="https://bibleox.com/ko/ko-nkrv/3ts/6/#L38">왕상 6:38</a>).</p><h2>성전을 지으라는 하느님의 명령</h2><blockquote><p>“여호와께서 모세에게 말씀하여 이르시되 이스라엘 자손에게 명령하여 내게 예물을 가져오라 하고 기쁜 마음으로 내는 자가 내게 바치는 모든 것을 너희는 받을지니라 &lt;…&gt; <strong>내가 그들 중에 거할 성소를 그들이 나를 위하여 짓되</strong> &lt;…&gt; <strong>너는 삼가 이 산에서 네게 보인 양식대로 할지니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ish/25/#L1-2,8,40">출 25:1-2,8,40</a>)</p></blockquote><blockquote><p>“광야에서 우리 조상들에게 <strong>증거의 장막</strong>이 있었으니 이것은 모세에게 말씀하신 이가 명하사 <strong>그가 본 그 양식대로 만들게 하신 것이라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/act/7/#L44">행 7:44</a>)</p></blockquote><p>땅의 성전은 하늘에 있는 참된 것을 본떠 지어졌습니다.</p><blockquote><p>“그리스도께서는 <strong>참 것의 그림자인 손으로 만든 성소</strong>에 들어가지 아니하시고 바로 그 하늘에 들어가사 이제 우리를 위하여 하나님 앞에 나타나시고” (<a href="https://bibleox.com/ko/ko-nkrv/evr/9/#L24">히 9:24</a>)</p></blockquote><h2>예루살렘 성전의 구조</h2><p>성전의 벽은 돌로 쌓았습니다.</p><p>아래의 치수는 규빗으로 나타냅니다. 미터로 대략 바꾸려면 규빗 수를 2로 나누면 됩니다.</p><h3>성전의 크기(왕상 6:2; 대하 3:3)</h3><ul><li><p>길이 60규빗(벽으로 20규빗과 40규빗으로 나뉨),</p></li><li><p>너비 20규빗,</p></li><li><p>높이 30규빗.</p></li></ul><p>미터로는 31.5 × 10.5 × 15.75미터입니다.</p><p>성전은 돌벽으로 두 부분(20규빗과 40규빗)으로 나뉘었습니다(<a href="https://bibleox.com/ko/ko-nkrv/3ts/6/#L16-17">왕상 6:16-17</a>).</p><ul><li><p>20규빗 부분은 “지성소”(또는 “내소”)라고 부릅니다.</p></li><li><p>40규빗 부분은 “성소”(“외소”)라고 부릅니다.</p></li></ul><p>성전에는 창틀이 있는 붙박이 창문이 있었습니다(<a href="https://bibleox.com/ko/ko-nkrv/3ts/6/#L4">왕상 6:4</a>).</p><h3>주랑(낭실)</h3><p>성전 앞에는 주랑(현관)도 지었습니다(성전의 길이에는 들어가지 않습니다). 주랑의 크기(<a href="https://bibleox.com/ko/ko-nkrv/3ts/6/#L3">왕상 6:3</a>):</p><ul><li><p>길이 20규빗,</p></li><li><p>너비 10규빗,</p></li><li><p>높이 120규빗(<a href="https://bibleox.com/ko/ko-nkrv/2par/3/#L4">대하 3:4</a>)?</p></li></ul><h3>다락</h3><p>성전 둘레에는 3층 다락을 지었는데(<a href="https://bibleox.com/ko/ko-nkrv/3ts/6/#L5">왕상 6:5</a>), 성전 벽에 박히지 않게 하였습니다(<a href="https://bibleox.com/ko/ko-nkrv/3ts/6/#L6">왕상 6:6</a>). 아래층부터 각 층의 너비는 5, 6, 7규빗이었습니다.</p><h3>골방</h3><p>성전 둘레에는 또 백향목 들보로 성전에 연접한 다락방들도 지었습니다(<a href="https://bibleox.com/ko/ko-nkrv/3ts/6/#L10">왕상 6:10</a>). 높이는 5규빗이었습니다.</p><h3>성전의 벽</h3><p>벽은 다듬은 돌로 쌓았습니다. 안쪽에서는 성전의 벽과 천장을 백향목 널판으로 입혔고(<a href="https://bibleox.com/ko/ko-nkrv/3ts/6/#L9,16">왕상 6:9,16</a>), 성전 마루에는 잣나무 널판을 깔았습니다(<a href="https://bibleox.com/ko/ko-nkrv/3ts/6/#L15">왕상 6:15</a>). 모든 것을 나무로 덮어 안에서는 돌이 보이지 않았습니다(<a href="https://bibleox.com/ko/ko-nkrv/3ts/6/#L18">왕상 6:18</a>). 성전의 벽과 마루는 금으로도 입혔습니다(<a href="https://bibleox.com/ko/ko-nkrv/3ts/6/#L22">왕상 6:22</a>; <a href="https://bibleox.com/ko/ko-nkrv/2par/3/#L5">대하 3:5</a>; <a href="https://bibleox.com/ko/ko-nkrv/2par/3/#L7">대하 3:7</a>; <a href="https://bibleox.com/ko/ko-nkrv/3ts/6/#L30">왕상 6:30</a>). 아로새긴 형상들도 대개 금으로 입혔습니다(<a href="https://bibleox.com/ko/ko-nkrv/3ts/6/#L32">왕상 6:32</a>). 백향목 널판(벽과 천장)에는 그룹들과 종려와 핀 꽃(<a href="https://bibleox.com/ko/ko-nkrv/3ts/6/#L29">왕상 6:29</a>), 그리고 박(<a href="https://bibleox.com/ko/ko-nkrv/3ts/6/#L18">왕상 6:18</a>)을 아로새겼습니다. 이 조각은 “내외소”(<a href="https://bibleox.com/ko/ko-nkrv/3ts/6/#L29">왕상 6:29</a>), 곧 지성소(성전의 안쪽 부분)와 성소(바깥쪽 부분)에 모두 있었습니다. 성전은 보석으로도 꾸몄습니다(<a href="https://bibleox.com/ko/ko-nkrv/2par/3/#L6">대하 3:6</a>). 중요한 점은, 그룹의 형상이 그 이전에도 성막의 휘장(벽)에 있었다는 것입니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/26/#L1">출 26:1</a>; <a href="https://bibleox.com/ko/ko-nkrv/ish/36/#L8">출 36:8</a>).</p><h2>지성소</h2><p>크기는 20 × 20 × 20규빗이며(<a href="https://bibleox.com/ko/ko-nkrv/3ts/6/#L20">왕상 6:20</a>; <a href="https://bibleox.com/ko/ko-nkrv/2par/3/#L8">대하 3:8</a>), 정금으로 입혔습니다. 금사슬로 건너질렀습니다(<a href="https://bibleox.com/ko/ko-nkrv/3ts/6/#L21">왕상 6:21</a>).</p><h3>들어가는 문</h3><p>지성소에는 감람나무로 만든 문으로 들어갔습니다(<a href="https://bibleox.com/ko/ko-nkrv/3ts/6/#L31">왕상 6:31</a>; <a href="https://bibleox.com/ko/ko-nkrv/2par/4/#L22">대하 4:22</a>). 개역개정은 이 문에 대하여 “그 문인방과 문설주는 벽의 오분의 일”이라고 하는데, 러시아어 시노달 역본은 이 문을 “오각형” 문이라고 부릅니다. 문에도(벽처럼) 그룹들과 종려와 핀 꽃을 아로새기고 금으로 입혔습니다(<a href="https://bibleox.com/ko/ko-nkrv/3ts/6/#L32">왕상 6:32</a>). 여기에는 또 성막에서처럼(<a href="https://bibleox.com/ko/ko-nkrv/ish/26/#L31">출 26:31</a>) 청색 자색 홍색 실로 짜고 그룹의 형상을 수놓은 휘장이 있었습니다(<a href="https://bibleox.com/ko/ko-nkrv/2par/3/#L14">대하 3:14</a>; <a href="https://bibleox.com/ko/gr-lxx-byz/1mak/1/#L22">1마카 1:22</a>). 휘장 앞에는 꺼지지 않는 등불이 늘 켜져 있었습니다(<a href="https://bibleox.com/ko/ko-nkrv/lev/24/#L1-4">레 24:1-4</a>).</p><h3>두 그룹</h3><p>감람나무로 만든 커다란 그룹 두 형상을 세웠습니다(<a href="https://bibleox.com/ko/ko-nkrv/3ts/6/#L23">왕상 6:23</a>). 그룹은 금으로 입혔습니다(<a href="https://bibleox.com/ko/ko-nkrv/3ts/6/#L28">왕상 6:28</a>; <a href="https://bibleox.com/ko/ko-nkrv/2par/3/#L10">대하 3:10</a>). 그룹의 높이와 너비는 10규빗이었는데(<a href="https://bibleox.com/ko/ko-nkrv/3ts/6/#L23">왕상 6:23</a>), 너비는 한쪽 날개 끝에서 다른 쪽 날개 끝까지 잰 것입니다(<a href="https://bibleox.com/ko/ko-nkrv/3ts/6/#L24-27">왕상 6:24-27</a>; <a href="https://bibleox.com/ko/ko-nkrv/2par/3/#L11">대하 3:11</a>). 각 그룹의 한 날개는 벽에 닿았고, 다른 날개는 옆 그룹의 날개에 닿았습니다(<a href="https://bibleox.com/ko/ko-nkrv/2par/3/#L11-12">대하 3:11-12</a>). 그룹들의 얼굴은 성전(외소) 쪽을 향하였습니다(<a href="https://bibleox.com/ko/ko-nkrv/2par/3/#L13">대하 3:13</a>).</p><h3>언약궤</h3><p>가운데, 그룹들의 날개 아래에는 언약궤가 있었고(<a href="https://bibleox.com/ko/ko-nkrv/3ts/6/#L19">왕상 6:19</a>; <a href="https://bibleox.com/ko/ko-nkrv/3ts/8/#L6">왕상 8:6</a>; <a href="https://bibleox.com/ko/ko-nkrv/2par/5/#L7">대하 5:7</a>), 궤를 메는 채도 함께 있었습니다(<a href="https://bibleox.com/ko/ko-nkrv/3ts/8/#L7">왕상 8:7</a>; <a href="https://bibleox.com/ko/ko-nkrv/2par/5/#L9">대하 5:9</a>; <a href="https://bibleox.com/ko/ko-nkrv/ish/25/#L15">출 25:15</a>). 궤의 크기는 2.5 × 1.5 × 1.5규빗이었습니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/25/#L10">출 25:10</a>). 궤는 조각목(아카시아 나무)으로 만들었고(<a href="https://bibleox.com/ko/ko-nkrv/ish/25/#L10">출 25:10</a>) 안팎을 금으로 쌌습니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/25/#L11">출 25:11</a>). 궤 아래 네 모퉁이에는 금 고리가 하나씩 있었고(<a href="https://bibleox.com/ko/ko-nkrv/ish/25/#L12">출 25:12</a>), 거기에 궤를 메는 데 쓰는, 금으로 싼 나무 채를 꿰었습니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/25/#L13">출 25:13</a>). 궤 안에는 선지자 모세가 친히 넣은 언약의 돌판 둘(<a href="https://bibleox.com/ko/ko-nkrv/3ts/8/#L9">왕상 8:9</a>; <a href="https://bibleox.com/ko/ko-nkrv/2par/5/#L10">대하 5:10</a>), 만나(<a href="https://bibleox.com/ko/ko-nkrv/ish/16/#L32-34">출 16:32-34</a>), 그리고 꽃이 피고 살구 열매가 열린 아론의 지팡이가 있었습니다(<a href="https://bibleox.com/ko/ko-nkrv/chis/17/#L8-11">민 17:8-11</a>). 언약궤 위는 2.5 × 1.5규빗의 덮개(속죄소)로 덮었습니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/25/#L17">출 25:17</a>). 덮개 위에는 서로 마주 보는 금 그룹 두 형상이 있었습니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/25/#L18-20">출 25:18-20</a>). 그룹들은 날개를 높이 펴서 그 날개로 궤의 덮개를 덮었습니다. 궤의 덮개 위, 두 그룹 사이에서 하느님께서 나타나시고 말씀하셨습니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/25/#L22">출 25:22</a>).</p><h2>성소</h2><h3>들어가는 문</h3><p>성소에는 잣나무로 만든, <strong>두 짝으로 접게 된 문</strong>으로 들어갔고(<a href="https://bibleox.com/ko/ko-nkrv/3ts/6/#L34">왕상 6:34</a>), 문설주는 감람나무로 만들었습니다(<a href="https://bibleox.com/ko/ko-nkrv/3ts/6/#L33">왕상 6:33</a>; 개역개정: “벽의 사분의 일”). 이 문짝에도 그룹들과 종려와 핀 꽃을 아로새기고 금으로 입혔습니다(<a href="https://bibleox.com/ko/ko-nkrv/3ts/6/#L35">왕상 6:35</a>).</p><h3>제단</h3><p>지성소 문 앞에는 <a href="https://bibleox.com/ru/ru/w/фимиам">분향</a>하는 제단이 있었습니다. 나무로 만들고 금으로 입혔습니다(<a href="https://bibleox.com/ko/ko-nkrv/3ts/6/#L22">왕상 6:22</a>; <a href="https://bibleox.com/ko/ko-nkrv/3ts/7/#L48">왕상 7:48</a>).</p><h3>상</h3><p>그 곁에는 진설병을 두는 금 상이 있었습니다(<a href="https://bibleox.com/ko/ko-nkrv/3ts/7/#L48">왕상 7:48</a>; <a href="https://bibleox.com/ko/ko-nkrv/2par/4/#L8">대하 4:8</a>).</p><h3>등잔대</h3><p>좌우로 금 등잔대가 오른쪽에 다섯, 왼쪽에 다섯 있었습니다(<a href="https://bibleox.com/ko/ko-nkrv/3ts/7/#L49">왕상 7:49</a>). 등잔대는 모두 정금으로 만들었고, 등잔과 불집게와 꽃과 대접과 주발과 숟가락과 문의 돌쩌귀도 모두 금이었습니다(<a href="https://bibleox.com/ko/ko-nkrv/3ts/7/#L50">왕상 7:50</a>; <a href="https://bibleox.com/ko/ko-nkrv/2par/4/#L19-22">대하 4:19-22</a>).</p><h2>주랑</h2><p>안은 순금으로 입혔습니다(<a href="https://bibleox.com/ko/ko-nkrv/2par/3/#L4">대하 3:4</a>).</p><h3>두 기둥: 야긴과 보아스</h3><p>주랑 입구 앞에는 똑같이 생긴 커다란 놋기둥 둘을 세우고 이름을 붙였습니다. 오른쪽 기둥은 야긴, 왼쪽 기둥은 보아스입니다(<a href="https://bibleox.com/ko/ko-nkrv/3ts/7/#L21">왕상 7:21</a>; <a href="https://bibleox.com/ko/ko-nkrv/2par/3/#L17">대하 3:17</a>). 기둥의 높이는 <strong>18규빗</strong>이었습니다(<a href="https://bibleox.com/ko/ko-nkrv/3ts/7/#L15">왕상 7:15</a>)(35규빗 — <a href="https://bibleox.com/ko/ko-nkrv/2par/3/#L15">대하 3:15</a>). 둘레는 12규빗 되는 줄을 두를 만하였습니다(<a href="https://bibleox.com/ko/ko-nkrv/3ts/7/#L15">왕상 7:15</a>). 기둥 위에는 높이가 각각 5규빗인 머리가 있었습니다(<a href="https://bibleox.com/ko/ko-nkrv/3ts/7/#L16">왕상 7:16</a>). 기둥 머리는 그물과 사슬 모양으로 땋은 것으로 꾸몄는데(<a href="https://bibleox.com/ko/ko-nkrv/3ts/7/#L16">왕상 7:16</a>), 머리마다 일곱이었습니다(<a href="https://bibleox.com/ko/ko-nkrv/3ts/7/#L17">왕상 7:17</a>). 기둥 머리에는 석류 두 줄이 둘려 있었습니다(<a href="https://bibleox.com/ko/ko-nkrv/3ts/7/#L18">왕상 7:18</a>). 주랑 기둥 머리의 네 규빗은 백합화 모양이었다고도 합니다(<a href="https://bibleox.com/ko/ko-nkrv/3ts/7/#L19">왕상 7:19</a>). 놋으로 만든 기구는 모두 빛난 놋이었습니다(<a href="https://bibleox.com/ko/ko-nkrv/3ts/7/#L45">왕상 7:45</a>).</p><h2>뜰</h2><p>성전 앞에는 <strong>안뜰(제사장의 뜰)</strong>을 만들었습니다(<a href="https://bibleox.com/ko/ko-nkrv/3ts/6/#L36">왕상 6:36</a>; <a href="https://bibleox.com/ko/ko-nkrv/2par/4/#L9">대하 4:9</a>). 안뜰은 다듬은 돌 세 켜와 백향목 판자 한 켜로 둘렀습니다(<a href="https://bibleox.com/ko/ko-nkrv/3ts/6/#L36">왕상 6:36</a>; <a href="https://bibleox.com/ko/ko-nkrv/3ts/7/#L12">왕상 7:12</a>). 바깥의 큰 뜰도 둘러막았습니다(<a href="https://bibleox.com/ko/ko-nkrv/3ts/7/#L12">왕상 7:12</a>; <a href="https://bibleox.com/ko/ko-nkrv/2par/4/#L9">대하 4:9</a>).</p><h3>제단</h3><p>크기: 20 × 20규빗, 높이 10규빗(<a href="https://bibleox.com/ko/ko-nkrv/2par/4/#L1">대하 4:1</a>).</p><h3>놋바다</h3><p>제사장들이 씻는 데 쓰는 둥근 그릇입니다(<a href="https://bibleox.com/ko/ko-nkrv/2par/4/#L6">대하 4:6</a>). 첫째 뜰(안뜰)에는 놋을 부어 만든 둥근 “바다”가 있었습니다. 크기: 지름 10규빗, 높이 5규빗(<a href="https://bibleox.com/ko/ko-nkrv/3ts/7/#L23">왕상 7:23</a>; <a href="https://bibleox.com/ko/ko-nkrv/2par/4/#L2">대하 4:2</a>), 두께는 한 손 너비(<a href="https://bibleox.com/ko/ko-nkrv/3ts/7/#L26">왕상 7:26</a>; <a href="https://bibleox.com/ko/ko-nkrv/2par/4/#L5">대하 4:5</a>). 둘레는 30규빗 되는 줄을 두를 만하였습니다(<a href="https://bibleox.com/ko/ko-nkrv/3ts/7/#L23">왕상 7:23</a>). 가장자리 아래에는 박 두 줄이 둘려 있었는데, 한 규빗에 열 개씩이었습니다(<a href="https://bibleox.com/ko/ko-nkrv/3ts/7/#L24">왕상 7:24</a>). 2,000밧을 담았습니다(<a href="https://bibleox.com/ko/ko-nkrv/3ts/7/#L26">왕상 7:26</a>). 성전 동남쪽에 두었습니다(<a href="https://bibleox.com/ko/ko-nkrv/3ts/7/#L39">왕상 7:39</a>; <a href="https://bibleox.com/ko/ko-nkrv/2par/4/#L10">대하 4:10</a>).</p><h3>소 열두 마리</h3><p>놋바다는 소 열두 마리 위에 놓였습니다(<a href="https://bibleox.com/ko/ko-nkrv/3ts/7/#L25">왕상 7:25</a>; <a href="https://bibleox.com/ko/ko-nkrv/2par/4/#L3-4">대하 4:3-4</a>; <a href="https://bibleox.com/ko/ko-nkrv/2par/4/#L15">대하 4:15</a>). 세 마리는 북쪽을, 나머지 세 마리씩은 각각 다른 방향을 향하였습니다.</p><h3>물두멍 열 개</h3><p>번제물을 드리기 전에 씻는 그릇입니다(<a href="https://bibleox.com/ko/ko-nkrv/2par/4/#L6">대하 4:6</a>). 물두멍 하나에 [40]밧이 들어갔습니다. 성전 곁에 다섯은 왼쪽, 다섯은 오른쪽에 두었습니다(<a href="https://bibleox.com/ko/ko-nkrv/3ts/7/#L39">왕상 7:39</a>). 물두멍마다 바퀴 달린 받침 수레가 있었습니다.</p><h3>받침 수레 열 개</h3><p>놋으로 만든 네모난 받침 수레 열 개가 있었습니다(<a href="https://bibleox.com/ko/ko-nkrv/3ts/7/#L27">왕상 7:27</a>; <a href="https://bibleox.com/ko/ko-nkrv/3ts/7/#L31">왕상 7:31</a>). 길이와 너비는 4규빗, 높이는 3규빗이었습니다. 받침 수레의 판에는 사자와 소와 그룹들이 있었고, 그 위에는 화환 모양이 있었습니다(<a href="https://bibleox.com/ko/ko-nkrv/3ts/7/#L28-29">왕상 7:28-29</a>). 받침 수레는 놋바퀴 넷으로 움직였습니다(<a href="https://bibleox.com/ko/ko-nkrv/3ts/7/#L30">왕상 7:30</a>). 바퀴의 높이는 한 규빗 반이었습니다(<a href="https://bibleox.com/ko/ko-nkrv/3ts/7/#L32">왕상 7:32</a>). 받침 수레는 모두 같은 모양이었습니다(<a href="https://bibleox.com/ko/ko-nkrv/3ts/7/#L37">왕상 7:37</a>).</p><h3>노래하는 자와 나팔 부는 자</h3><p>성전 봉헌 때 레위 사람들은 노래하며 악기(제금과 비파와 수금)를 연주하였고, 제사장들은 나팔을 불었습니다(<a href="https://bibleox.com/ko/ko-nkrv/2par/5/#L12">대하 5:12</a>). 악기는 성전을 위하여 따로 만든 것이었습니다(<a href="https://bibleox.com/ko/ko-nkrv/2par/7/#L6">대하 7:6</a>).</p><h2>형상</h2><p>그룹들을 아로새긴 형상은 성전의 벽(<a href="https://bibleox.com/ko/ko-nkrv/3ts/6/#L32">왕상 6:32</a>), 들어가는 문(<a href="https://bibleox.com/ko/ko-nkrv/3ts/6/#L32">왕상 6:32</a>; <a href="https://bibleox.com/ko/ko-nkrv/3ts/6/#L35">왕상 6:35</a>), 지성소 입구 앞의 휘장(<a href="https://bibleox.com/ko/ko-nkrv/2par/3/#L14">대하 3:14</a>; <a href="https://bibleox.com/ko/gr-lxx-byz/1mak/1/#L22">1마카 1:22</a>)에 있었습니다. 지성소에는 금으로 입힌 커다란 나무 그룹 두 형상이 서 있었습니다(<a href="https://bibleox.com/ko/ko-nkrv/3ts/6/#L23">왕상 6:23</a>). 언약궤 덮개 위에도 그룹 두 형상을 만들었습니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/25/#L18-20">출 25:18-20</a>). 성전 뜰에서는 물두멍의 커다란 받침 수레에 사자와 소와 그룹들을 새겼습니다(<a href="https://bibleox.com/ko/ko-nkrv/3ts/7/#L28-29">왕상 7:28-29</a>).</p><h2>기도</h2><p>성전 봉헌 때 솔로몬 왕의 기도: <a href="https://bibleox.com/ko/ko-nkrv/3ts/8/#L22-53">왕상 8:22-53</a>; <a href="https://bibleox.com/ko/ko-nkrv/2par/6/#L14-42">대하 6:14-42</a></p><p>솔로몬의 기도에 대한 하느님의 응답: <a href="https://bibleox.com/ko/ko-nkrv/2par/7/#L12-22">대하 7:12-22</a></p>'
