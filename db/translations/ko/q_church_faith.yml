  body: '<p>주 예수 그리스도께서는 사도들의 말을 통해 당신을 믿는 신앙을 말씀하십니다:</p><blockquote><p>“또 그들을 위하여 내가 나를 거룩하게 하오니 이는 그들도 진리로 거룩함을 얻게 하려 함이니이다 내가 비옵는 것은 이 사람들만 위함이 아니요 또 <strong><mark>그들의 말로 말미암아 나를 믿는 사람들도 위함이니 아버지여, 아버지께서 내 안에, 내가 아버지 안에 있는 것 같이 그들도 다 하나가 되어</mark></strong> 우리 안에 있게 하사 세상으로 아버지께서 나를 보내신 것을 믿게 하옵소서” (<a href="https://bibleox.com/ko/ko-nkrv/in/17/#L19-21">요 17:19-21</a>)</p></blockquote><p>사도들은 단번에 전해진 신앙을 지켜야 한다고 거듭 가리켰습니다: [<a href="https://bibleox.com/ru/ru/w/Предание">거룩한 전승</a>]</p>'
