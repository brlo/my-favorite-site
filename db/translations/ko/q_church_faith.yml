- src: Авраам-отец-верующих
  path: Ab2k_믿는_이들의_아버지_아브라함
  title: 믿는 이들의 아버지 아브라함
  copy_cover: true
  body: <p>아브라함은 율법 없이, 할례를 받기도 전에 올바른 사람이 되었습니다:</p><blockquote><p>“그래서 다윗도 선행과는 관계없이 하느님께로부터 올바른 사람으로 인정받은 사람의 행복을 이렇게 읊었습니다. 하느님께서 잘못을 용서해 주시고 죄를 덮어 두신 사람들은 행복하다. 주께서 죄없다고 인정해 주시는 사람도 행복하다.‘ 이러한 행복은 할례를 받은 사람만이 누리는 것입니까? 그렇지 않으면 할례를 받지 않은 사람도 누리는 것입니까? 우리는 앞에서 ’하느님께서는 아브라함의 믿음을 보시고 그를 올바른 사람으로 인정해 주셨다‘고 하였습니다. <strong>언제 그렇게 되었습니까? 그가 할례를 받은 후입니까? 받기 전입니까? 할례를 받은 후가 아니라 받기 전의 일입니다</strong>. 아브라함은 할례를 받기 전에 믿음을 통해서 하느님과 올바른 관계를 가지게 되었습니다. 그 뒤 그것을 확인하는 표로 그는 할례를 받았던 것입니다. 이리하여 <strong>할례를 받지 않고도 믿음으로써 올바른 사람이라고 인정받은 모든 사람의 조상이 되었습니다</strong>. 또 아브라함은 할례받은 사람들의 조상이기도 합니다. 여기서 할례받은 사람들이란 그저 할례를 받는 데 그치지 않고 우리 조상 아브라함이 할례받기 전에 보여 준 믿음을 본받아 사는 사람들을 가리킵니다. 하느님께서는 <strong>아브라함과 그의 후손들에게 세상을 물려 주겠다고 약속하셨는데 그것은 아브라함이 율법을 지켰다고 해서가 아니라</strong> 하느님께서 그의 믿음을 보시고 그를 올바른 사람으로 인정하셨기 때문에 하신 약속이었습니다. 만일 율법을 지키는 사람들만이 상속자가 될 수 있다면 믿음은 무의미하게 되고 그 약속은 무효가 됩니다. 법이 없으면 법을 어기는 일도 없게 됩니다. 법이 있으면 법을 어기게 되어 하느님의 진노를 사게 마련입니다. 그러므로 하느님께서는 사람의 믿음을 보시고 그를 상속자로 삼으십니다. 이렇게 하느님께서는 사람의 믿음을 보시고 그를 상속자로 삼으십니다. 이렇게 하느님께서는 은총을 베푸시며 율법을 지키는 사람들에게만 아니라 <strong>아브라함의 믿음을 따르는 사람들에게까지 곧 아브라함의 모든 후손들에게 그 약속을 보장해 주십니다. 아브라함은 우리 모두의 조상입니다</strong>. 성서에 ’내가 너를 만민의 조상으로 삼았다‘고 하지 않았습니까? 그는 죽은 자를 살리시고 없는 것을 있게 만드시는 하느님을 믿었던 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/rim/4/#L6-17">로마 4:6-17</a>)</p></blockquote><blockquote><p>“아브람이 구십 구 세 되던 해에 야훼께서 아브람에게 나타나시어 말씀하셨다. ‘나는 전능한 신이다. 너는 내 앞을 떠나지 말고 흠 없이 살아라. &lt;…&gt; 내가 너와 계약을 맺는다. <strong>너는 많은 민족의 조상이 되리라</strong>. <strong>내가 너를 많은 민족의 조상으로 삼으리니</strong>, 네 이름은 이제 아브람이 아니라 아브라함이라 불리리라.” (<a href="https://bibleox.com/ko/ko-ctb/gen/17/#L1,4-5">창 17:1,4-5</a>)</p></blockquote><p>믿는 이들은 아브라함의 자손입니다:</p><blockquote><p>“성서에도 기록되어 있듯이 아브라함은 하느님을 믿었고 하느님께서는 그의 믿음을 보시고 그를 올바른 사람으로 인정해 주셨습니다. 그러므로 여러분은 <strong>믿음으로 사는 사람만이 아브라함의 참 자손이 된다</strong>는 것을 알아야 합니다. 하느님께서는 이방인들도 믿기만 하면 당신과의 올바른 관계를 가지게 해 주시리라는 것을 성서는 미리 내다보았습니다. 그래서 성서는 아브라함에게 ‘<strong>너로 말미암아 만백성이 복을 받으리라</strong>’는 복음을 미리 전해 주었던 것입니다. 그러므로 <strong>믿음으로 사는 사람들은 믿음의 사람 아브라함과 함께 복을 누리는 것입니다</strong>. 성서에 ‘율법서에 기록된 모든 것을 꾸준히 지키지 않는 사람은 저주를 받을 것이다’라고 기록되어 있듯이 율법을 지키는 것에 의존하는 사람은 언제나 저주의 위협을 받고 있습니다. 그러니 율법을 통해서는 아무도 하느님과의 올바른 관계를 맺을 수 없다는 것이 분명합니다. 성서에도 ‘믿음을 통해서 하느님과의 올바른 관계를 가진 사람은 살 것이다’라는 말씀이 있습니다. 율법은 믿음에 기초를 둔 것이 아닙니다. 율법은 다만 ‘율법을 지키는 자는 그것을 지킴으로 산다’고 말합니다. 나무에 달린 자는 누구나 저주받을 자다‘라고 성서에 기록되어 있듯이 그리스도께서는 우리를 위하여 십자가에 달려 저주받은 자가 되셔서 우리를 율법의 저주에서 구원해 내셨습니다. 그리하여 하느님께서 <strong>아브라함에게 약속하신 복이 그리스도 예수를 믿는 이방인들에게까지</strong> 마치게 되었고 또 우리는 믿음으로 약속된 성령을 받게 되었습니다. 형제 여러분, 세상의 관례를 들어서 말해 봅시다. 사람들이 맺은 계약도 한번 맺은 다음에는 아무도 그것을 무효로 만들거나 무엇을 덧붙이거나 할 수 없는 것입니다. 하느님께서는 아브라함과 그의 후손에게 약속하실 때에 <strong>많은 사람을 가리키는 ’후손들에게‘라는 말 대신 한 사람만을 가리키는 ’네 후손에게‘라는 말을 쓰셨습니다. 한 사람이란 그리스도를 가리킵니다</strong>. &lt;…&gt; 세례를 받아서 그리스도 안으로 들어 간 여러분은 모두 그리스도를 옷 입듯이 입었습니다. &lt;…&gt; <strong>여러분이 그리스도에게 속했다면 여러분은 아브라함의 자손이며</strong> 따라서 약속에 의한 상속자들입니다.” (<a href="https://bibleox.com/ko/ko-ctb/gal/3/#L6-16,27,29">갈라 3:6-16,27,29</a>)</p></blockquote><blockquote><p>“너에게 복을 비는 사람에게는 내가 복을 내릴 것이며 너를 저주하는 사람에게는 저주를 내리리라. <strong>세상 사람들이 네 덕을 입을 것이다</strong>.‘” (<a href="https://bibleox.com/ko/ko-ctb/gen/12/#L3">창 12:3</a>)</p></blockquote><blockquote><p>“그리하여 하느님께서 <strong>아브라함에게 약속하신 복이 그리스도 예수를 믿는 이방인들에게까지</strong> 마치게 되었고 또 우리는 <strong>믿음으로</strong> 약속된 성령을 받게 되었습니다.” (<a href="https://bibleox.com/ko/ko-ctb/gal/3/#L14">갈라 3:14</a>)</p></blockquote><h2>예수 그리스도께서 말씀하신 아브라함의 자녀</h2><blockquote><p>“그리고 아브라함이 우리 조상이다 하는 말은 아예 할 생각도 말아라. 사실 <strong>하느님은 이 돌들로도 아브라함의 자녀를 만드실 수 있다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/mf/3/#L9">마태 3:9</a>; <a href="https://bibleox.com/ko/ko-ctb/lk/3/#L8">루가 3:8</a>)</p></blockquote><h2>교회는 새 이스라엘입니다</h2><blockquote><p>“그러나 여러분은 선택된 민족이고 왕의 사제들이며 거룩한 겨레이고 하느님의 소유가 된 백성입니다. 그러므로 여러분은 어두운 데서 여러분을 불러 내어 그 놀라운 빛 가운데로 인도해 주신 하느님의 놀라운 능력을 널리 찬양해야 합니다. <strong>여러분이 전에는 하느님의 백성이 아니었지만 지금은 하느님의 백성이며 전에는 하느님의 자비를 받지 못했지만 지금은 그분의 자비를 받게 되었습니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/1pet/2/#L9-10">1베드 2:9-10</a>)</p></blockquote>
