- src: бездетность
  path: Ch7i_자녀가_없음
  title: 자녀가 없음
  copy_cover: true
  body: <p>여기서는 자녀를 원하지만 불임으로 가질 수 없는 사람들을 말합니다:</p><blockquote><p>“죄의 잠자리를 알지 못한 흠 없는 <strong>불임의 여인은 복되다</strong>. 그 여인은 <strong>영혼들을 살피실 때에 열매를 맺을 것이다</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/prs/3/#L13">지혜 3:13</a>, 그리스어에서 번역)</p></blockquote><blockquote><p>“<strong>덕을 지닌 자녀 없음</strong>이 더 낫다. <strong>덕의 기억에는 불멸이 있으니, 하느님께도</strong> 사람들에게도 <strong>알려지기 때문이다</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/prs/4/#L1">지혜 4:1</a>, 그리스어에서 번역)</p></blockquote>
