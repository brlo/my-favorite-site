  body: '<h2>모든 민족이 그리스도 신앙으로 부름받았습니다 — 신약의 증언</h2><p>그리스도께서는 사도들을 보내시어 모든 민족과 종족, 어떤 언어를 쓰는 사람에게든, 온 세상에 복음을 전하게 하십니다:</p><blockquote><p>“그러므로 <strong>너희는 가서 이 세상 모든 사람들을 내 제자로 삼아 아버지와 아들과 성령의 이름으로 그들에게 세례를 베풀고 내가 너희에게 명한 모든 것을 지키도록 가르쳐라</strong>. 내가 세상 끝날까지 항상 너희와 함께 있겠다.‘” (<a href="https://bibleox.com/ko/ko-ctb/mf/28/#L19-20">마태 28:19-20</a>)</p></blockquote><blockquote><p>“내가 은총으로 사도직을 받은 것도 그분을 통해서였습니다. 이것은 <strong>모든 이방인들에게 하느님을 믿고 복종할 것을 가르침으로써</strong> 그분의 영광을 드러내기 위한 것이었습니다.” (<a href="https://bibleox.com/ko/ko-ctb/rim/1/#L5">로마 1:5</a>)</p></blockquote><blockquote><p>“하느님께서는 내가 전하는 <strong>복음</strong> 곧 예수 그리스도에 관한 가르침을 통해서, 그리고 오랜 세월 동안 감추어 두셨던 그 심오한 진리를 나타내 보여주심으로써 여러분의 믿음을 굳세게 해 주십니다. 그 진리는 이제 예언자들의 글에서 명백하게 드러났고 영원하신 하느님의 명령을 따라 <strong>모든 이방인들에게 알려져</strong> 그들도 <strong>믿고 복종하게 되었습니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/rim/16/#L25-26">로마 16:25-26</a>)</p></blockquote><blockquote><p>“<strong>이 하늘 나라의 복음이 온 세상에 전파되어 모든 백성에게 밝히 알려질 것이다</strong>. 그리고 나서야 끝이 올 것이다.‘” (<a href="https://bibleox.com/ko/ko-ctb/mf/24/#L14">마태 24:14</a>)</p></blockquote><blockquote><p>“나는 또 다른 천사가 하늘 한가운데서 높이 날아 다니는 것을 보았습니다. 그 천사는 <strong>땅에서 살고 있는 사람들과 모든 나라와 종족과 언어와 백성에게 전할</strong> 영원한 복음을 가지고 있었습니다.” (<a href="https://bibleox.com/ko/ko-ctb/otkr/14/#L6">묵시 14:6</a>)</p></blockquote><h2>모든 민족이 그리스도 신앙으로 부름받았습니다 — 구약의 증언</h2><p>아브라함에게 그의 후손을 통해(후손 가운데 한 분을 통해) 모든 민족이 복을 받으리라고 하신 약속:</p><blockquote><p>“네가 이렇게 내 말을 들었기 때문에 <strong>세상 만민</strong>이 네 후손의 덕을 입을 것이다.‘” (<a href="https://bibleox.com/ko/ko-ctb/gen/22/#L18">창 22:18</a>)</p></blockquote><p>모든 민족이 참 하느님께 돌아오리라는 예언:</p><blockquote><p>“주여, 주께서 내신 <strong>민족들이 모두 와서</strong> 예배드리고 당신의 이름을 찬양하리이다.” (<a href="https://bibleox.com/ko/ko-ctb/ps/86/#L9">시편 86:9</a>)</p></blockquote><blockquote><p>“만왕이 다 그 앞에 엎드리고 <strong>만백성</strong>이 그를 섬기게 되리라.” (<a href="https://bibleox.com/ko/ko-ctb/ps/72/#L11">시편 72:11</a>)</p></blockquote><blockquote><p>“해가 그 빛을 잃기까지 왕의 이름 영원토록 기림받게 하소서. <strong>뭇 민족이 그의 은덕을 입고</strong> 뭇 백성 그를 일컬어 복되다 하리이다.” (<a href="https://bibleox.com/ko/ko-ctb/ps/72/#L17">시편 72:17</a>)</p></blockquote><blockquote><p>“너희 모든 백성들아, 야훼를 찬양하여라. <strong>너희 모든 나라들아</strong>, 그를 송축하여라.” (<a href="https://bibleox.com/ko/ko-ctb/ps/117/#L1">시편 117:1</a>)</p></blockquote><blockquote><p>“나는 가서 <strong>다른 말을 쓰는 모든 민족들</strong>을 모아 오리라. 그들은 와서 나의 영광을 볼 것이다. 그들 가운데 난을 면할 자들에게 표를 주어 다르싯, 풋트, 룻, 모섹, 로스, 두발, 야반 등 여러 민족들, 나의 소문을 듣지도 못하고 나의 영광을 보지도 못한 먼 섬나라에 사는 사람들에게 보내어, 만방에 나의 영광을 전하게 하리라. 그들은 <strong>민족들 가운데서</strong> 너희 모든 겨레를 말과 수레와 포장마차와 노새와 낙타에 태워 나의 거룩한 산 예루살렘에 데려다가 선물로 야훼에게 바칠 것이다. 이스라엘 백성이 정한 그릇에 선물을 담아다가 야훼의 성전에 바치듯이 바칠 것이다. 야훼가 말한다. <strong>내가 그들 가운데서 더러는 사제로</strong>, 더러는 레위인으로 뽑아 세우리라. 야훼가 말한다.” (<a href="https://bibleox.com/ko/ko-ctb/is/66/#L18-21">이사 66:18-21</a>)</p></blockquote><blockquote><p>“<strong>온 세상 모든 인간들아, 머리를 돌려 나에게로 와서 구원을 받아라</strong>. 나만이 하느님, 다른 신은 없다.” (<a href="https://bibleox.com/ko/ko-ctb/is/45/#L22">이사 45:22</a>)</p></blockquote><blockquote><p>“네가 나의 종으로서 할 일은 야곱의 지파들을 다시 일으키고 살아 남은 이스라엘 사람을 돌아 오게 하는 것으로 그치지 않는다. 나는 너를 만국의 빛으로 세운다. 너는 <strong>땅 끝까지 나의 구원이 이르게 하여라</strong>.‘” (<a href="https://bibleox.com/ko/ko-ctb/is/49/#L6">이사 49:6</a>)</p></blockquote><blockquote><p>“세상이 당신의 길을 알게 하시고 <strong>만방이 당신의 구원을 깨닫게 하소서</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/ps/67/#L2">시편 67:2</a>)</p></blockquote><blockquote><p>“주권과 영화와 나라가 그에게 맡겨지고 <strong>인종과 말이 다른 뭇 백성들</strong>의 섬김을 받게 되었다. 그의 주권은 스러지지 아니하고 영원히 갈 것이며 그의 나라는 멸망하지 아니하리라.” (<a href="https://bibleox.com/ko/ko-ctb/dan/7/#L14">다니 7:14</a>)</p></blockquote><blockquote><p>“놀라운 일을 이루시어 이름을 떨치셨으니, <strong>뭇 민족, 뭇 족속</strong>에게 이를 알리어라.” (<a href="https://bibleox.com/ko/ko-ctb/1par/16/#L24">역상 16:24</a>)</p></blockquote><blockquote><p>“그리하여 다른 신은 없고 야훼만이 하느님이시라는 것을 <strong>땅 위의 모든 백성들</strong>이 알게 되기를 빕니다.” (<a href="https://bibleox.com/ko/ko-ctb/3ts/8/#L60">열상 8:60</a>)</p></blockquote><blockquote><p>“뭇 민족도 뒤흔들리라. 그리하면 <strong>뭇 민족이 보화를 가지고 오리니</strong> 내가 내리는 영광이 이 성전에 차고 넘치리라. 야훼의 말이다.” (<a href="https://bibleox.com/ko/ko-ctb/ag/2/#L7">하깨 2:7</a>)</p></blockquote><blockquote><p>“땅에서 새싹이 돋아 나듯 동산에 뿌린 씨가 움트듯 <strong>주 야훼께서는 만백성이 보는 앞에서 정의가 서고 찬양이 넘쳐 흐르게 하신다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/is/61/#L11">이사 61:11</a>)</p></blockquote><h2>다른 민족들의 신앙은 구원하지 못합니다</h2><p>예수 그리스도에 대한 사도적 신앙은 구원을 줍니다. 다른 민족들의 신앙은 구원하지 못합니다:</p><blockquote><p>“지난 날에는 하느님께서 <strong>모든 나라 사람을 제멋대로 살게 내버려 두셨습니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/act/14/#L16">사도 14:16</a>)</p></blockquote><p>자세히: <a href="https://bibleox.com/ru/ru/w/Бог-один">다른 민족들의 신은 신이 아닙니다</a>.</p><p>동시에 예수 그리스도에 대한 사도적 신앙과 이 신앙을 통한 구원은 예외 없이 모든 사람에게 열려 있습니다.</p>'
