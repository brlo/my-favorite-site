  copy_cover: true
  body: '<h2>예수 그리스도께서 마지막 심판에서 모든 사람을 심판하십니다</h2><blockquote><p>“<strong>사람의 아들</strong>이 아버지의 영광에 싸여 자기 천사들을 거느리고 올 터인데 그 때에 그는 <strong>각자에게 그 행한 대로 갚아 줄 것이다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/mf/16/#L27">마태 16:27</a>)</p></blockquote><blockquote><p>“‘<strong>사람의 아들</strong>이 영광을 떨치며 모든 천사들을 거느리고 와서 영광스러운 왕좌에 앉게 되면 모든 민족들을 앞에 불러 놓고 마치 목자가 양과 염소를 갈라 놓듯이 <strong>그들을 갈라</strong>” (<a href="https://bibleox.com/ko/ko-ctb/mf/25/#L31-32">마태 25:31-32</a>)</p></blockquote><blockquote><p>“또한 아버지께서는 친히 아무도 심판하지 않으시고 <strong>그 권한을 모두 아들에게 맡기셔서</strong>” (<a href="https://bibleox.com/ko/ko-ctb/in/5/#L22">요한 5:22</a>)</p></blockquote><blockquote><p>“<strong>나자렛 예수</strong>에 관한 일들입니다. 하느님께서는 그분에게 성령과 능력을 부어 주시고 그분과 함께 계셨습니다. 그래서 그분은 두루 다니시며 좋은 일을 해 주시고 악마에게 짓눌린 사람들을 모두 고쳐 주셨습니다. &lt;…&gt; 그분은 우리에게 <strong>하느님께서 자기를 산 이들과 죽은 이들의 심판자로 정하셨다</strong>는 것을 사람들에게 선포하고 증언하라고 분부하셨습니다.” (<a href="https://bibleox.com/ko/ko-ctb/act/10/#L38,42">사도 10:38,42</a>)</p></blockquote><blockquote><p>“과연 하느님께서는 <strong>당신이 택하신 분을 시켜 온 세상을 올바르게 심판하실 날을 정하셨고</strong> 또 그분을 <strong>죽은 자들 가운데서 다시 살리심으로써</strong> 모든 사람에게 그 증거를 보이셨습니다.‘” (<a href="https://bibleox.com/ko/ko-ctb/act/17/#L31">사도 17:31</a>)</p></blockquote><blockquote><p>“우리가 다 <strong>그리스도의 심판대</strong> 앞에 나가는 날에는 우리가 육체에 머물러 있는 동안에 한 일들이 숨김없이 드러나서 잘한 일은 상을 받고 잘못한 일은 벌을 받게 될 것이기 때문입니다.” (<a href="https://bibleox.com/ko/ko-ctb/2kor/5/#L10">2고린 5:10</a>)</p></blockquote><blockquote><p>“나는 <strong>하느님 앞에서 그리고 산 자와 죽은 자를 심판하실 그리스도 예수</strong> 앞에서 그대에게 엄숙히 명령합니다. 그리고 그리스도께서 다시 나타나실 것과 군림하실 것을 믿고 그대에게 당부합니다.” (<a href="https://bibleox.com/ko/ko-ctb/2tim/4/#L1">2디모 4:1</a>)</p></blockquote><h2>모두가 심판을 받습니다</h2><blockquote><p>“<strong><mark>우리가 다 그리스도의 심판대 앞에 나가는 날에는</mark></strong> 우리가 육체에 머물러 있는 동안에 한 일들이 숨김없이 드러나서 <strong>잘한 일은 상을 받고 잘못한 일은 벌을 받게</strong> 될 것이기 때문입니다.” (<a href="https://bibleox.com/ko/ko-ctb/2kor/5/#L10">2고린 5:10</a>)</p></blockquote><blockquote><p>“그런데 어떻게 우리가 형제를 심판할 수 있으며 또 멸시할 수 있겠습니까? <strong><mark>우리는 다 하느님의 심판대 앞에 설 사람이 아닙니까</mark></strong>?” (<a href="https://bibleox.com/ko/ko-ctb/rim/14/#L10">로마 14:10</a>) <em>(비잔틴 본문(다수 사본): “그리스도의 심판대”)</em></p></blockquote><blockquote><p>“여러분은 인간에게 자유를 주는 법에 따라서 <strong><mark>장차 심판받을 사람들이니</mark></strong> 그런 사람답게 말하기도 하고 행하기도 하십시오.” (<a href="https://bibleox.com/ko/ko-ctb/iak/2/#L12">야고 2:12</a>)</p></blockquote><blockquote><p>“<strong>좋은 일이든 나쁜 일이든</strong>, 심지어 남몰래 한 일까지도 <strong><mark>사람이 한 모든 일을 하느님께서는 심판에 붙이신다</mark></strong>는 사실을 명하여라.” (<a href="https://bibleox.com/ko/ko-ctb/ekl/12/#L14">전도 12:14</a>)</p></blockquote><blockquote><p>“‘<strong>사람의 아들</strong>이 영광을 떨치며 모든 천사들을 거느리고 와서 <strong>영광스러운 왕좌에 앉게 되면</strong> <strong><mark>모든 민족들을 앞에 불러 놓고</mark></strong> 마치 목자가 <strong><mark>양과 염소를 갈라 놓듯이 그들을 갈라</mark></strong>” (<a href="https://bibleox.com/ko/ko-ctb/mf/25/#L31-32">마태 25:31-32</a>)</p></blockquote><h2>심판은 교회에서 시작됩니다</h2><blockquote><p>“<strong><mark>심판의 때는 왔습니다. 하느님의 백성이 먼저 심판을 받을 것입니다</mark></strong>. 하느님께서 당신의 백성인 <strong><mark>우리를 먼저 심판하신다면</mark></strong> 하느님의 복음을 믿지 않는 자들의 말로가 어떠하겠습니까? <strong>의로운 사람이 겨우 구원을 받는다면</strong> 경건치 못한 죄인은 어떻게 되겠습니까?” (<a href="https://bibleox.com/ko/ko-ctb/1pet/4/#L17-18">1베드 4:17-18</a>)</p></blockquote><blockquote><p>“<strong><mark>내가 여러분에게서 심판을 받든지 세상 법정에서 심판을 받든지 나는 조금도 마음을 쓰지 않습니다. 또 내가 나 자신을 심판하지도 않습니다</mark></strong>. 나는 양심에 조금도 거리끼는 일이 없습니다. <strong><mark>그렇다고 해서 나에게 죄가 없다는 말은 아닙니다. 나를 심판하시는 분은 주님이십니다</mark></strong>. 그러므로 주님께서 오실 때까지는 <strong>무슨 일이나 미리 앞질러 심판해서는 안 됩니다</strong>. 주님께서 오시면 어둠 속에 감추어진 것을 밝혀 내시고 사람의 마음 속 생각을 드러내실 것입니다. 그 때에는 각 사람이 하느님께로부터 응분의 칭찬을 받게 될 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/4/#L3-5">1고린 4:3-5</a>)</p></blockquote><h2>그리스도께서는 사람이 몸으로 사는 동안 한 일을 심판하십니다</h2><blockquote><p>“우리가 다 그리스도의 심판대 앞에 나가는 날에는 <strong><mark>우리가 육체에 머물러 있는 동안에 한 일들이 숨김없이 드러나서</mark></strong> 잘한 일은 상을 받고 잘못한 일은 벌을 받게 될 것이기 때문입니다.” (<a href="https://bibleox.com/ko/ko-ctb/2kor/5/#L10">2고린 5:10</a>)</p></blockquote><p>심판은 몸으로 행한 지상의 행실을 근거로 이루어집니다:</p><blockquote><p>“그리고 왼편에 있는 사람들에게는 이렇게 말할 것이다. <strong>이 저주받은 자들아, 나에게서 떠나 악마와 그의 졸도들을 가두려고 준비한 영원한 불 속에 들어가라. 너희는 내가 주렸을 때에 먹을 것을 주지 않았고</strong>, 목말랐을 때에 마실 것을 주지 않았으며 나그네 되었을 때에 따뜻하게 맞이하지 않았고, 헐벗었을 때에 입을 것을 주지 않았으며, 또 병들었을 때나 감옥에 갇혔을 때에 돌보아 주지 않았다. 이 말을 듣고 그들도 이렇게 대답할 것이다. 주님, 주님께서 언제 굶주리고 목마르셨으며, 언제 나그네 되시고 헐벗으셨으며, 또 언제 병드시고 감옥에 갇히셨기에 저희가 모른 체하고 돌보아 드리지 않았다는 말씀입니까? 그러면 임금은 똑똑히 들어라. <strong>여기 있는 형제들 중에 가장 보잘 것 없는 사람 하나에게 해 주지 않은 것이 곧 나에게 해 주지 않은 것이다</strong> 하고 말할 것이다. <strong>이리하여 그들은 영원히 벌받는 곳으로 쫓겨 날 것이며, 의인들은 영원한 생명의 나라로 들어 갈 것이다</strong>.‘” (<a href="https://bibleox.com/ko/ko-ctb/mf/25/#L41-46">마태 25:41-46</a>) <em>(“졸도”는 그리스어로 “천사들”입니다.)</em></p></blockquote>'
