- src: предопределение
  path: Pd9j_예정_운명
  title: 예정(운명)
  copy_cover: true
  body: <h2>하느님께서는 모든 사람이 구원받기를 바라십니다</h2><blockquote><p>“이것이 <strong><mark>우리 구주 하나님</mark></strong> 앞에 선하고 받으실 만한 것이니 하나님은 <strong><mark>모든 사람이 구원을 받으며 진리를 아는 데에 이르기를 원하시느니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1tim/2/#L3-4">딤전 2:3-4</a>)</p></blockquote><blockquote><p>“혹 네가 <strong><mark>하나님의 인자하심이 너를 인도하여 회개하게 하심</mark></strong>을 알지 못하여 그의 인자하심과 용납하심과 길이 참으심이 풍성함을 멸시하느냐 다만 <strong><mark>네 고집과 회개하지 아니한 마음을 따라 진노의 날 곧 하나님의 의로우신 심판이 나타나는 그 날에 임할 진노를 네게 쌓는도다</mark></strong> 하나님께서 각 사람에게 그 행한 대로 보응하시되 참고 선을 행하여 영광과 존귀와 썩지 아니함을 구하는 자에게는 영생으로 하시고 오직 당을 지어 진리를 따르지 아니하고 불의를 따르는 자에게는 진노와 분노로 하시리라” (<a href="https://bibleox.com/ko/ko-nkrv/rim/2/#L4-8">롬 2:4-8</a>)</p></blockquote><h2>구원은 강제로 이루어지지 않고 찾는 이들에게 열립니다</h2><blockquote><p>“믿음이 없이는 하나님을 기쁘시게 하지 못하나니 하나님께 나아가는 자는 반드시 그가 계신 것과 또한 그가 <strong><mark>자기를 찾는 자들에게 상 주시는 이심</mark></strong>을 믿어야 할지니라” (<a href="https://bibleox.com/ko/ko-nkrv/evr/11/#L6">히 11:6</a>)</p></blockquote><blockquote><p>“<strong>내가 여호와께 간구하매 내게 응답하시고</strong> 내 모든 두려움에서 나를 건지셨도다 <strong><mark>그들이 주를 앙망하고 광채를 내었으니</mark></strong> 그들의 얼굴은 부끄럽지 아니하리로다” (<a href="https://bibleox.com/ko/ko-nkrv/ps/34/#L4-5">시 34:4-5</a>)</p></blockquote><blockquote><p>“나를 사랑하는 자들이 나의 사랑을 입으며 <strong><mark>나를 간절히 찾는 자가 나를 만날 것이니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/pr/8/#L17">잠 8:17</a>)</p></blockquote><blockquote><p>“내 아들 솔로몬아 너는 네 아버지의 하나님을 알고 온전한 마음과 기쁜 뜻으로 섬길지어다 여호와께서는 모든 마음을 감찰하사 모든 의도를 아시나니 <strong><mark>네가 만일 그를 찾으면 만날 것이요</mark></strong> 만일 네가 그를 버리면 그가 너를 영원히 버리시리라” (<a href="https://bibleox.com/ko/ko-nkrv/1par/28/#L9">대상 28:9</a>)</p></blockquote><blockquote><p>“혹 네가 하나님의 인자하심이 너를 인도하여 회개하게 하심을 알지 못하여 그의 인자하심과 용납하심과 길이 참으심이 풍성함을 멸시하느냐 다만 네 고집과 회개하지 아니한 마음을 따라 진노의 날 곧 하나님의 의로우신 심판이 나타나는 그 날에 임할 진노를 네게 쌓는도다 하나님께서 <strong><mark>각 사람에게 그 행한 대로 보응하시되</mark></strong> <strong><mark>참고 선을 행하여 영광과 존귀와 썩지 아니함을 구하는 자에게는 영생으로 하시고 오직 당을 지어 진리를 따르지 아니하고</mark></strong> 불의를 따르는 자에게는 <strong>진노와 분노로</strong> 하시리라” (<a href="https://bibleox.com/ko/ko-nkrv/rim/2/#L4-8">롬 2:4-8</a>)</p></blockquote><h2>하느님께서는 죄인의 멸망을 슬퍼하시고 되도록 많은 이를 구원하려 하십니다</h2><blockquote><p>“주 여호와의 말씀이니라 <strong><mark>내가 어찌 악인이 죽는 것을 조금인들 기뻐하랴</mark></strong> <strong><mark>그가 돌이켜 그 길에서 떠나 사는 것을 어찌 기뻐하지 아니하겠느냐</mark></strong> &lt;…&gt; 그런데 너희는 이르기를 주의 길이 공평하지 아니하다 하는도다 이스라엘 족속아 들을지어다 <strong>내 길이 어찌 공평하지 아니하냐 너희 길이 공평하지 아니한 것이 아니냐</strong> &lt;…&gt; 주 여호와의 말씀이니라 이스라엘 족속아 내가 너희 각 사람이 행한 대로 심판할지라 <strong><mark>너희는 돌이켜 회개하고 모든 죄에서 떠날지어다 그리한즉 그것이 너희에게 죄악의 걸림돌이 되지 아니하리라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/iez/18/#L23,25,30">겔 18:23,25,30</a>)</p></blockquote><blockquote><p>“너는 그들에게 말하라 주 여호와의 말씀이니라 나의 삶을 두고 맹세하노니 <strong><mark>나는 악인이 죽는 것을 기뻐하지 아니하고</mark></strong> 악인이 그의 길에서 돌이켜 떠나 사는 것을 기뻐하노라 이스라엘 족속아 돌이키고 돌이키라 너희 악한 길에서 떠나라 <strong><mark>어찌 죽고자 하느냐</mark></strong> 하셨다 하라” (<a href="https://bibleox.com/ko/ko-nkrv/iez/33/#L11">겔 33:11</a>)</p></blockquote><blockquote><p>“예수께서 대답하여 이르시되 <strong><mark>건강한 자에게는 의사가 쓸 데 없고 병든 자에게라야 쓸 데 있나니 내가 의인을 부르러 온 것이 아니요 죄인을 불러 회개시키러 왔노라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/lk/5/#L31-32">눅 5:31-32</a>)</p></blockquote><blockquote><p>“<strong><mark>주의 약속은 어떤 이들이 더디다고 생각하는 것 같이 더딘 것이 아니라</mark></strong> 오직 주께서는 너희를 대하여 <strong><mark>오래 참으사 아무도 멸망하지 아니하고 다 회개하기에 이르기를 원하시느니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2pet/3/#L9">벧후 3:9</a>)</p></blockquote><h2>사람은 자기 뜻을 하느님께 돌리려 하지 않기 때문에 멸망합니다</h2><blockquote><p>“예루살렘아 예루살렘아 선지자들을 죽이고 네게 파송된 자들을 돌로 치는 자여 암탉이 그 새끼를 날개 아래에 모음 같이 <strong><mark>내가 네 자녀를 모으려 한 일이 몇 번이더냐</mark></strong> <strong><mark>그러나 너희가 원하지 아니하였도다</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/23/#L37">마 23:37</a>)</p></blockquote><blockquote><p>“그 정죄는 이것이니 곧 빛이 세상에 왔으되 <strong><mark>사람들이 자기 행위가 악하므로 빛보다 어둠을 더 사랑한 것이니라</mark></strong> <strong><mark>악을 행하는 자마다 빛을 미워하여 빛으로 오지 아니하나니 이는 그 행위가 드러날까 함이요</mark></strong> 진리를 따르는 자는 빛으로 오나니 이는 그 행위가 하나님 안에서 행한 것임을 나타내려 함이라 하시니라” (<a href="https://bibleox.com/ko/ko-nkrv/in/3/#L19-21">요 3:19-21</a>)</p></blockquote><blockquote><p>“혹 네가 <strong><mark>하나님의 인자하심이 너를 인도하여 회개하게 하심</mark></strong>을 알지 못하여 그의 인자하심과 용납하심과 길이 참으심이 풍성함을 멸시하느냐 다만 <strong><mark>네 고집과 회개하지 아니한 마음을 따라 진노의 날 곧 하나님의 의로우신 심판이 나타나는 그 날에 임할 진노를 네게 쌓는도다</mark></strong> 하나님께서 각 사람에게 그 행한 대로 보응하시되 참고 선을 행하여 영광과 존귀와 썩지 아니함을 구하는 자에게는 영생으로 하시고 <strong><mark>오직 당을 지어 진리를 따르지 아니하고</mark></strong> 불의를 따르는 자에게는 진노와 분노로 하시리라” (<a href="https://bibleox.com/ko/ko-nkrv/rim/2/#L4-8">롬 2:4-8</a>)</p></blockquote><h2>하느님께서는 미리 아신(곧 그들이 선택하리라는 것을 미리 아신) 이들을 구원으로 예정하셨습니다</h2><p>예정은 사람의 행실과 상관없이 이루어지지 않습니다. 시간 밖에 계신 하느님께서는 행실을 미리 아시며, 바로 이 앎(예지)을 바탕으로 예정하십니다. 이것이 핵심입니다. 예정은 아무렇게나 이루어지는 것이 아니라, 하느님께서 시간 밖에 계시며 행하기 <strong>전에</strong> 아시는 각 사람의 행실을 고려하여 이루어집니다:</p><blockquote><p>“<strong><mark>하나님이 미리 아신 자들을</mark></strong> 또한 그 아들의 형상을 본받게 하기 위하여 <strong><mark>미리 정하셨으니</mark></strong> 이는 그로 많은 형제 중에서 맏아들이 되게 하려 하심이니라 또 <strong>미리 정하신 그들을 또한 부르시고</strong> 부르신 그들을 또한 의롭다 하시고 의롭다 하신 그들을 또한 영화롭게 하셨느니라” (<a href="https://bibleox.com/ko/ko-nkrv/rim/8/#L29-30">롬 8:29-30</a>)</p></blockquote><blockquote><p>“예수 그리스도의 사도 베드로는 본도, 갈라디아, 갑바도기아, 아시아와 비두니아에 흩어진 나그네 곧 <strong><mark>하나님 아버지의 미리 아심을 따라</mark></strong> 성령이 거룩하게 하심으로 순종하고 예수 그리스도의 피 뿌림을 얻기 위하여 택하심을 받은 자들에게 편지하노니 은혜와 평강이 너희에게 더욱 많을지어다” (<a href="https://bibleox.com/ko/ko-nkrv/1pet/1/#L1-2">벧전 1:1-2</a>)</p></blockquote><blockquote><p>“모든 사람은 흙에서 나왔고 아담은 땅에서 지어졌다. <strong>주님께서는 넘치는 지식으로</strong> 그들을 구별하시고 <strong>그들의 길을 달리 정하셨다</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/prsir/33/#L10-11">집회 33:10-11</a>, 그리스어에서 번역)</p></blockquote><blockquote><p>“이방인들이 듣고 기뻐하여 하나님의 말씀을 찬송하며 <strong>영생을 주시기로 작정된 자는 다 믿더라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/act/13/#L48">행 13:48</a>)</p></blockquote><h2>사람의 운명은 하느님의 손에 있습니다</h2><p>(러시아 시노달 번역은 그리스어 κρίματα와 히브리어 מִשְׁפָּט, 곧 “판단, 판결”을 흔히 “운명”으로 옮깁니다. 개역개정은 이 말을 “심판”, “판단”, “작정” 등으로 옮깁니다.)</p><blockquote><p>“주의 공의는 하나님의 산들과 같고 <strong><mark>주의 심판은 큰 바다와 같으니이다</mark></strong> 여호와여 주는 사람과 짐승을 구하여 주시나이다” (<a href="https://bibleox.com/ko/ko-nkrv/ps/36/#L6">시 36:6</a>)</p></blockquote><blockquote><p>“<strong><mark>사람의 걸음은 여호와로 말미암나니</mark></strong> 사람이 어찌 자기의 길을 알 수 있으랴” (<a href="https://bibleox.com/ko/ko-nkrv/pr/20/#L24">잠 20:24</a>)</p></blockquote><blockquote><p>“주권자에게 은혜를 구하는 자가 많으나 <strong><mark>사람의 일의 작정은 여호와께로 말미암느니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/pr/29/#L26">잠 29:26</a>)</p></blockquote><blockquote><p>“옹기장이의 손에 있는 진흙처럼 — 그의 모든 길이 그의 뜻대로이듯 — 사람들은 <strong>자기를 지으신 분의 손에</strong> 있으니, 그분의 판단대로 갚아 주시리라” (<a href="https://bibleox.com/ko/gr-lxx-byz/prsir/33/#L13">집회 33:13</a>, 그리스어에서 번역)</p></blockquote><blockquote><p>“이도 <strong>만군의 여호와께로부터 난 것이라 그의 경영은 기묘하며</strong> 지혜는 광대하니라” (<a href="https://bibleox.com/ko/ko-nkrv/is/28/#L29">사 28:29</a>)</p></blockquote><blockquote><p>“깊도다 하나님의 지혜와 지식의 풍성함이여, <strong><mark>그의 판단은 헤아리지 못할 것이며</mark></strong> 그의 길은 찾지 못할 것이로다” (<a href="https://bibleox.com/ko/ko-nkrv/rim/11/#L33">롬 11:33</a>)</p></blockquote><h2>하느님께서는 예수 그리스도의 십자가 고난을 예정하셨습니다</h2><blockquote><p>“과연 헤롯과 본디오 빌라도는 이방인과 이스라엘 백성과 합세하여 하나님께서 기름 부으신 거룩한 종 예수를 거슬러 <strong>하나님의 권능과 뜻대로</strong> 이루려고 <strong><mark>예정하신 그것을</mark></strong> 행하려고 이 성에 모였나이다” (<a href="https://bibleox.com/ko/ko-nkrv/act/4/#L27-28">행 4:27-28</a>)</p></blockquote><h2>하느님께서는 사도 바울을 미리 택하셨습니다</h2><blockquote><p>“그가 또 이르되 우리 조상들의 하나님이 <strong><mark>너를 택하여</mark></strong> 너로 하여금 자기 뜻을 알게 하시며 그 의인을 보게 하시고 그 입에서 나오는 음성을 듣게 하셨으니” (<a href="https://bibleox.com/ko/ko-nkrv/act/22/#L14">행 22:14</a>)</p></blockquote><h2>비판</h2><h3>하느님께서 모두를 구원하기를 바라시는데 모두가 구원받지는 않는다면 전능하지 않다</h3><p>사랑은 자유로운 감정입니다. 억지로 사랑받을 수는 없습니다. 하느님께서는 당신의 피조물이 하느님을 사랑할 수 있기를 바라시며, 그래서 하느님을 자유로이 선택하거나 선택하지 않을 가능성, 곧 사랑하거나 미워할 가능성을 주십니다.</p><p>하느님께서 모두를 구원하실 수 있습니까? 있습니다. 하느님께서 모두의 구원을 바라십니까? 바라십니다. 다만 하느님에 대한 사랑을 지닌 상태로 구원받기를 바라십니다. 하느님께서는 당신을 미워하는 사람들을 당신과 함께하는 영원한 삶으로 몰아넣기를 바라지 않으십니다. 그래서 바라지 않으시는 일을 하지 않으십니다. 그렇다고 하느님께서 전능하지 않으십니까? 아닙니다. 하느님께서는 누구에게도 사랑을 강요하기를 바라지 않으시기 때문입니다.</p><p>사랑이신 하느님께서 사람들에게 당신을 자유로이 사랑하거나 미워할 가능성을 주실 수 있습니까? 있습니다. 만일 선택의 자유를 주실 수 없다면 그분은 전능하시겠습니까?</p>
