  body: '<p>주 예수 그리스도께서는 사도들의 말을 통해 당신을 믿는 신앙을 말씀하십니다:</p><blockquote><p>“내가 이 사람들을 위하여 이 몸을 아버지께 바치는 것은 이 사람들도 참으로 아버지께 자기 몸을 바치게 하려는 것입니다.‘ 나는 이 사람들만을 위하여 간구하는 것이 아니라 <strong><mark>이 사람들의 말을 듣고 나를 믿는 사람들을 위하여 간구합니다. 아버지, 이 사람들이 모두 하나가 되게 하여 주십시오</mark></strong>. 아버지께서 내 안에 계시고 내가 아버지 안에 있는 것과 같이 이 사람들도 우리들 안에 있게 하여 주십시오. 그러면 아버지께서 나를 보내셨다는 것을 세상이 믿게 될 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/in/17/#L19-21">요한 17:19-21</a>)</p></blockquote><p>사도들은 단번에 전해진 신앙을 지켜야 한다고 거듭 가리켰습니다: [<a href="https://bibleox.com/ru/ru/w/Предание">성전(聖傳)</a>]</p>'
