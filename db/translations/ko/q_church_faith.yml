- src: предопределение
  path: Pd9j_예정_운명
  title: 예정(운명)
  copy_cover: true
  body: <h2>하느님께서는 모든 사람이 구원받기를 바라십니다</h2><blockquote><p>“이렇게 기도하는 것은 좋은 일이며 <strong><mark>우리 구세주 하느님</mark></strong>을 기쁘시게 해 드리는 일입니다. 하느님께서는 <strong><mark>모든 사람이 다 구원을 받게 되고 진리를 알게 되기를 바라십니다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/1tim/2/#L3-4">1디모 2:3-4</a>)</p></blockquote><blockquote><p>“더구나 <strong><mark>사람을 회개시키려고 베푸시는 하느님의 자비</mark></strong>를 깨닫기는 커녕 오히려 그 크신 자비와 관용과 인내를 업신여기는 자가 있다니 될 말입니까? 그러고도 <strong><mark>마음이 완고해서 회개할 생각도 하지 않으니 이런 자는 하느님의 공정한 심판이 내릴 진노의 날에 자기가 받을 벌을 쌓아 올리고 있는 것입니다</mark></strong>. 하느님께서는 각 사람에게 그 행실대로 갚아 주실 것입니다. 꾸준히 선을 행하면서 영광과 명예와 불멸의 것을 추구하는 사람들에게는 영원한 생명을 주실 것이고 자기 이익만을 생각하면서 진리를 물리치고 옳지 않은 것을 따르는 사람들에게는 진노와 벌을 내리실 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/rim/2/#L4-8">로마 2:4-8</a>)</p></blockquote><h2>구원은 강제로 이루어지지 않고 찾는 이들에게 열립니다</h2><blockquote><p>“믿음이 없이는 하느님을 기쁘게 해 드릴 수 없습니다. 하느님께로 가까이 가는 사람은 하느님이 계시다는 것과 하느님께서 <strong><mark>당신을 찾는 사람들에게 상을 주신 다는 것</mark></strong>을 믿어야 합니다.” (<a href="https://bibleox.com/ko/ko-ctb/evr/11/#L6">히브 11:6</a>)</p></blockquote><blockquote><p>“<strong>야훼 찾아 호소할 때 들어 주시고</strong> 몸서리쳐지는 곤경에서 건져 주셨다. <strong><mark>그를 쳐다보는 자, 그 얼굴 빛나고</mark></strong> 부끄러운 꼴 당하지 아니하리라.” (<a href="https://bibleox.com/ko/ko-ctb/ps/34/#L4-5">시편 34:4-5</a>)</p></blockquote><blockquote><p>“나를 사랑하면 내 사랑을 받고 <strong><mark>애타게 찾으면 나를 만나리라</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/pr/8/#L17">잠언 8:17</a>)</p></blockquote><blockquote><p>“솔로몬아, 이 아비를 보살펴 주시던 하느님을 스스로 마음을 다 바쳐 사랑하며 섬기도록 하여라. 야훼께서는 사람의 마음을 헤아리시고 속셈까지 꿰뚫어 보신다. <strong><mark>네가 찾으면 만나 주시지만</mark></strong>, 네가 저버리면 너를 아주 버리실 것이다.” (<a href="https://bibleox.com/ko/ko-ctb/1par/28/#L9">역상 28:9</a>)</p></blockquote><blockquote><p>“더구나 사람을 회개시키려고 베푸시는 하느님의 자비를 깨닫기는 커녕 오히려 그 크신 자비와 관용과 인내를 업신여기는 자가 있다니 될 말입니까? 그러고도 마음이 완고해서 회개할 생각도 하지 않으니 이런 자는 하느님의 공정한 심판이 내릴 진노의 날에 자기가 받을 벌을 쌓아 올리고 있는 것입니다. 하느님께서는 <strong><mark>각 사람에게 그 행실대로 갚아 주실 것입니다</mark></strong>. <strong><mark>꾸준히 선을 행하면서 영광과 명예와 불멸의 것을 추구하는 사람들에게는 영원한 생명을 주실 것이고 자기 이익만을 생각하면서 진리를 물리치고</mark></strong> 옳지 않은 것을 따르는 사람들에게는 <strong>진노와 벌을</strong> 내리실 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/rim/2/#L4-8">로마 2:4-8</a>)</p></blockquote><h2>하느님께서는 죄인의 멸망을 슬퍼하시고 되도록 많은 이를 구원하려 하십니다</h2><blockquote><p>“그가 못된 행실을 한 자라고 해서 <strong><mark>사람이 죽는 것을 내가 기뻐하겠느냐</mark></strong>? 주 야훼가 하는 말이다. 그런 사람이라도 <strong><mark>그 가던 길에서 발길을 돌려 살게 되는 것이 어찌 내 기쁨이 되지 않겠느냐</mark></strong>? &lt;…&gt; 너희는 이 야훼가 하는 일을 부당하다고 한다마는, 이스라엘 족속아, 들어라. <strong>너희가 하는 일이 부당하지 내가 하는 일이 부당하냐</strong>? &lt;…&gt; 나는 너희 하나하나를 너희의 행실대로 다스리리라. 주 야훼가 하는 말이다. 이스라엘 족속들아, 너희 행실을 고쳐라. <strong><mark>거역하며 저지르던 죄악을 모두 버리고 마음을 돌려라. 그래야 올가미에 걸려 망하지 아니할 것이다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/iez/18/#L23,25,30">에제 18:23,25,30</a>)</p></blockquote><blockquote><p>“일러 주어라. ‘내가 맹세한다. <strong><mark>죄인이라고 해도 죽는 것을 나는 기뻐하지 않는다</mark></strong>. 주 야훼가 하는 말이다. 죄인이라도 마음을 바로잡아 버릇을 고치고 사는 것을 나는 기뻐한다. 그러나 너희는 돌아 오라. 나쁜 버릇을 고치고 돌아 오라. 이스라엘 족속아, <strong><mark>어찌하여 너희는 죽으려고 하느냐</mark></strong>!’” (<a href="https://bibleox.com/ko/ko-ctb/iez/33/#L11">에제 33:11</a>)</p></blockquote><blockquote><p>“예수께서 이 말을 들으시고 이렇게 대답하셨다. ‘<strong><mark>건강한 사람에게는 의사가 필요하지 않으나 병자에게는 필요하다. 나는 의인을 불러 회개시키러 온 것이 아니라 죄인들을 불러 회개시키러 왔다</mark></strong>.’” (<a href="https://bibleox.com/ko/ko-ctb/lk/5/#L31-32">루가 5:31-32</a>)</p></blockquote><blockquote><p>“어떤 이들은 <strong><mark>주님께서 약속하신 것을 미루신다고</mark></strong> 생각하고 있지만 사실은 여러분을 위해서 <strong><mark>참고 기다리시는 것입니다. 아무도 멸망하지 않고 모두 회개하게 되기를 바라시기 때문입니다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/2pet/3/#L9">2베드 3:9</a>)</p></blockquote><h2>사람은 자기 뜻을 하느님께 돌리려 하지 않기 때문에 멸망합니다</h2><blockquote><p>“‘예루살렘아! 예루살렘아! 너는 예언자들을 죽이고 너에게 보낸 이들을 돌로 치는구나. 암닭이 병아리를 날개 아래 모으듯이 <strong><mark>내가 몇 번이나 네 자녀를 모으려 했던가</mark></strong>. <strong><mark>그러나 너는 응하지 않았다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/mf/23/#L37">마태 23:37</a>)</p></blockquote><blockquote><p>“빛이 세상에 왔지만 <strong><mark>사람들은 자기들의 행실이 악하여 빛보다 어둠을 더 사랑했다</mark></strong>. 이것이 벌써 죄인으로 판결받았다는 것을 말해 준다. 과연 <strong><mark>악한 일을 일삼는 자는 누구나 자기 죄상이 드러날까 봐 빛을 미워하고 멀리한다</mark></strong>. 그러나 진리를 따라 사는 사람은 빛이 있는데로 나아간다. 그리하여 그가 한 일은 모두 하느님의 뜻을 따라 한 일이라는 것이 드러나게 된다.‘” (<a href="https://bibleox.com/ko/ko-ctb/in/3/#L19-21">요한 3:19-21</a>)</p></blockquote><blockquote><p>“더구나 <strong><mark>사람을 회개시키려고 베푸시는 하느님의 자비</mark></strong>를 깨닫기는 커녕 오히려 그 크신 자비와 관용과 인내를 업신여기는 자가 있다니 될 말입니까? 그러고도 <strong><mark>마음이 완고해서 회개할 생각도 하지 않으니 이런 자는 하느님의 공정한 심판이 내릴 진노의 날에 자기가 받을 벌을 쌓아 올리고 있는 것입니다</mark></strong>. 하느님께서는 각 사람에게 그 행실대로 갚아 주실 것입니다. 꾸준히 선을 행하면서 영광과 명예와 불멸의 것을 추구하는 사람들에게는 영원한 생명을 주실 것이고 <strong><mark>자기 이익만을 생각하면서 진리를 물리치고</mark></strong> 옳지 않은 것을 따르는 사람들에게는 진노와 벌을 내리실 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/rim/2/#L4-8">로마 2:4-8</a>)</p></blockquote><h2>하느님께서는 미리 아신(곧 그들이 선택하리라는 것을 미리 아신) 이들을 구원으로 예정하셨습니다</h2><p>예정은 사람의 행실과 상관없이 이루어지지 않습니다. 시간 밖에 계신 하느님께서는 행실을 미리 아시며, 바로 이 앎(예지)을 바탕으로 예정하십니다. 이것이 핵심입니다. 예정은 아무렇게나 이루어지는 것이 아니라, 하느님께서 시간 밖에 계시며 행하기 <strong>전에</strong> 아시는 각 사람의 행실을 고려하여 이루어집니다:</p><blockquote><p>“하느님께서는 <strong><mark>이미 오래 전에 택하신 사람들이</mark></strong> 당신의 아들과 같은 모습을 가지도록 <strong><mark>미리 정하셨습니다</mark></strong>. 그래서 그리스도께서는 많은 형제 중에서 맏아들이 되셨습니다. 하느님께서는 <strong>미리 정하신 사람들을 불러 주시고</strong> 부르신 사람들을 당신과 올바른 관계에 놓아 주시고, 당신과 올바른 관계를 가진 사람들을 영광스럽게 해 주셨습니다.” (<a href="https://bibleox.com/ko/ko-ctb/rim/8/#L29-30">로마 8:29-30</a>) <em>(“택하신”은 그리스어로 προέγνω, “<strong>미리 아신</strong>”입니다.)</em></p></blockquote><blockquote><p>“예수 그리스도의 사도인 나 베드로는 본도와 갈라디아와 가빠도기아와 아시아와 비티니아에 흩어져서 나그네 생활을 하고 있는 여러분에게 이 편지를 씁니다. 여러분은 <strong><mark>하느님 아버지께서 미리 세우신 계획에 따라 뽑혀서</mark></strong> 성령으로 거룩하게 되어 예수 그리스도께 복종하게 되었으며 그분의 피로 씻겨진 사람들입니다. 여러분에게 은총과 평화가 충만하기를 빕니다.” (<a href="https://bibleox.com/ko/ko-ctb/1pet/1/#L1-2">1베드 1:1-2</a>) <em>(“미리 세우신 계획”은 그리스어로 πρόγνωσις, “<strong>미리 아심</strong>”입니다.)</em></p></blockquote><blockquote><p>“모든 사람은 흙에서 나왔고 아담은 땅에서 지어졌다. <strong>주님께서는 넘치는 지식으로</strong> 그들을 구별하시고 <strong>그들의 길을 달리 정하셨다</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/prsir/33/#L10-11">집회 33:10-11</a>, 그리스어에서 번역)</p></blockquote><blockquote><p>“바울로의 말을 듣고 이방인들은 기뻐하며 주님의 말씀을 찬양하였으며 <strong>영원한 생명을 얻도록 작정된 사람들은 모두 신도가 되었다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/act/13/#L48">사도 13:48</a>)</p></blockquote><h2>사람의 운명은 하느님의 손에 있습니다</h2><p>(러시아 시노달 번역은 그리스어 κρίματα와 히브리어 מִשְׁפָּט, 곧 “판단, 판결”을 흔히 “운명”으로 옮깁니다. 공동번역은 이 말을 “공평”, “판결”, “판단” 등으로 옮깁니다.)</p><blockquote><p>“당신의 공변되심 우람한 산줄기 같고 <strong><mark>당신의 공평하심 깊은 바다와도 같사옵니다</mark></strong>. 사람과 함께 짐승도 구해 주시니, 야훼여,” (<a href="https://bibleox.com/ko/ko-ctb/ps/36/#L6">시편 36:6</a>)</p></blockquote><blockquote><p>“<strong><mark>사람이 하는 일은 야훼께 달렸으니</mark></strong> 사람이 어찌 스스로 이루랴.” (<a href="https://bibleox.com/ko/ko-ctb/pr/20/#L24">잠언 20:24</a>)</p></blockquote><blockquote><p>“많은 사람이 통치자의 마음을 사려 하지만 <strong><mark>판결은 야훼께서 내리신다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/pr/29/#L26">잠언 29:26</a>)</p></blockquote><blockquote><p>“옹기장이의 손에 있는 진흙처럼 — 그의 모든 길이 그의 뜻대로이듯 — 사람들은 <strong>자기를 지으신 분의 손에</strong> 있으니, 그분의 판단대로 갚아 주시리라” (<a href="https://bibleox.com/ko/gr-lxx-byz/prsir/33/#L13">집회 33:13</a>, 그리스어에서 번역)</p></blockquote><blockquote><p>“이 생각도 만군의 야훼께서 가르쳐 주신 것이다. <strong>놀라운 계획을 멋지게 이루시는 야훼</strong>께서 가르쳐 주신 것이다.” (<a href="https://bibleox.com/ko/ko-ctb/is/28/#L29">이사 28:29</a>)</p></blockquote><blockquote><p>“오! 하느님의 풍요와 지혜와 지식은 심오합니다. <strong><mark>누가 그분의 판단을 헤아릴 수 있으며</mark></strong> 그분이 하시는 일을 이해할 수 있겠습니까?” (<a href="https://bibleox.com/ko/ko-ctb/rim/11/#L33">로마 11:33</a>)</p></blockquote><h2>하느님께서는 예수 그리스도의 십자가 고난을 예정하셨습니다</h2><blockquote><p>“과연 헤로데와 빌라도는 이 도성에서 이방인들과 이스라엘 백성과 작당하여 주께서 기름부어 그리스도로 주님의 거룩한 종 예수를 거슬렀습니다. 이리하여 <strong>주님의 권능과 뜻으로</strong> <strong><mark>미리 정해 두신 일들</mark></strong>을 모두 이루었습니다.” (<a href="https://bibleox.com/ko/ko-ctb/act/4/#L27-28">사도 4:27-28</a>)</p></blockquote><h2>하느님께서는 사도 바울로를 미리 택하셨습니다</h2><blockquote><p>“그 때 아나니아는 이런 말을 하였습니다. 우리 조상들의 하느님께서는 뜻하신 바를 깨닫게 하시고 그 죄 없으신 분을 알아 보게 하시고 또 친히 하시는 말씀을 듣게 하시려고 <strong><mark>당신을 택하셨습니다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/act/22/#L14">사도 22:14</a>)</p></blockquote><h2>비판</h2><h3>하느님께서 모두를 구원하기를 바라시는데 모두가 구원받지는 않는다면 전능하지 않다</h3><p>사랑은 자유로운 감정입니다. 억지로 사랑받을 수는 없습니다. 하느님께서는 당신의 피조물이 하느님을 사랑할 수 있기를 바라시며, 그래서 하느님을 자유로이 선택하거나 선택하지 않을 가능성, 곧 사랑하거나 미워할 가능성을 주십니다.</p><p>하느님께서 모두를 구원하실 수 있습니까? 있습니다. 하느님께서 모두의 구원을 바라십니까? 바라십니다. 다만 하느님에 대한 사랑을 지닌 상태로 구원받기를 바라십니다. 하느님께서는 당신을 미워하는 사람들을 당신과 함께하는 영원한 삶으로 몰아넣기를 바라지 않으십니다. 그래서 바라지 않으시는 일을 하지 않으십니다. 그렇다고 하느님께서 전능하지 않으십니까? 아닙니다. 하느님께서는 누구에게도 사랑을 강요하기를 바라지 않으시기 때문입니다.</p><p>사랑이신 하느님께서 사람들에게 당신을 자유로이 사랑하거나 미워할 가능성을 주실 수 있습니까? 있습니다. 만일 선택의 자유를 주실 수 없다면 그분은 전능하시겠습니까?</p>
