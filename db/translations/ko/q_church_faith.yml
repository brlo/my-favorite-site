  copy_cover: true
  body: '<h2>예수 그리스도께서 마지막 심판에서 모든 사람을 심판하십니다</h2><blockquote><p>“<strong>인자</strong>가 아버지의 영광으로 그 천사들과 함께 오리니 그 때에 <strong>각 사람이 행한 대로 갚으리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/16/#L27">마 16:27</a>)</p></blockquote><blockquote><p>“<strong>인자</strong>가 자기 영광으로 모든 천사와 함께 올 때에 자기 영광의 보좌에 앉으리니 모든 민족을 그 앞에 모으고 <strong>각각 구분하기를</strong> 목자가 양과 염소를 구분하는 것 같이 하여” (<a href="https://bibleox.com/ko/ko-nkrv/mf/25/#L31-32">마 25:31-32</a>)</p></blockquote><blockquote><p>“아버지께서 아무도 심판하지 아니하시고 <strong>심판을 다 아들에게 맡기셨으니</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/in/5/#L22">요 5:22</a>)</p></blockquote><blockquote><p>“하나님이 <strong>나사렛 예수</strong>에게 성령과 능력을 기름 붓듯 하셨으매 그가 두루 다니시며 선한 일을 행하시고 마귀에게 눌린 모든 사람을 고치셨으니 이는 하나님이 함께 하셨음이라 &lt;…&gt; 우리에게 명하사 백성에게 전도하되 <strong>하나님이 살아 있는 자와 죽은 자의 재판장으로 정하신 자가</strong> 곧 이 사람인 것을 증언하게 하셨고” (<a href="https://bibleox.com/ko/ko-nkrv/act/10/#L38,42">행 10:38,42</a>)</p></blockquote><blockquote><p>“이는 <strong>정하신 사람으로 하여금 천하를 공의로 심판할 날을 작정하시고</strong> 이에 <strong>그를 죽은 자 가운데서 다시 살리신 것으로</strong> 모든 사람에게 믿을 만한 증거를 주셨음이니라 하니라” (<a href="https://bibleox.com/ko/ko-nkrv/act/17/#L31">행 17:31</a>)</p></blockquote><blockquote><p>“이는 우리가 다 반드시 <strong>그리스도의 심판대</strong> 앞에 나타나게 되어 각각 선악간에 그 몸으로 행한 것을 따라 받으려 함이라” (<a href="https://bibleox.com/ko/ko-nkrv/2kor/5/#L10">고후 5:10</a>)</p></blockquote><blockquote><p>“<strong>하나님 앞과 살아 있는 자와 죽은 자를 심판하실 그리스도 예수</strong> 앞에서 그가 나타나실 것과 그의 나라를 두고 엄히 명하노니” (<a href="https://bibleox.com/ko/ko-nkrv/2tim/4/#L1">딤후 4:1</a>)</p></blockquote><h2>모두가 심판을 받습니다</h2><blockquote><p>“이는 <strong><mark>우리가 다 반드시 그리스도의 심판대 앞에 나타나게 되어</mark></strong> <strong>각각 선악간에 그 몸으로 행한 것을 따라 받으려 함이라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2kor/5/#L10">고후 5:10</a>)</p></blockquote><blockquote><p>“네가 어찌하여 네 형제를 비판하느냐 어찌하여 네 형제를 업신여기느냐 <strong><mark>우리가 다 하나님의 심판대 앞에 서리라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/rim/14/#L10">롬 14:10</a>) <em>(비잔틴 본문(다수 사본): “그리스도의 심판대”)</em></p></blockquote><blockquote><p>“너희는 자유의 율법대로 <strong><mark>심판 받을 자처럼</mark></strong> 말도 하고 행하기도 하라” (<a href="https://bibleox.com/ko/ko-nkrv/iak/2/#L12">약 2:12</a>)</p></blockquote><blockquote><p>“<strong><mark>하나님은 모든 행위와 모든 은밀한 일을</mark></strong> <strong>선악 간에</strong> 심판하시리라” (<a href="https://bibleox.com/ko/ko-nkrv/ekl/12/#L14">전 12:14</a>)</p></blockquote><blockquote><p>“<strong>인자</strong>가 자기 영광으로 모든 천사와 함께 올 때에 <strong>자기 영광의 보좌에 앉으리니</strong> <strong><mark>모든 민족을 그 앞에 모으고</mark></strong> 각각 구분하기를 <strong><mark>목자가 양과 염소를 구분하는 것 같이</mark></strong> 하여” (<a href="https://bibleox.com/ko/ko-nkrv/mf/25/#L31-32">마 25:31-32</a>)</p></blockquote><h2>심판은 교회에서 시작됩니다</h2><blockquote><p>“<strong><mark>하나님의 집에서 심판을 시작할 때가 되었나니</mark></strong> <strong><mark>만일 우리에게 먼저 하면</mark></strong> 하나님의 복음을 순종하지 아니하는 자들의 그 마지막은 어떠하며 또 <strong>의인이 겨우 구원을 받으면</strong> 경건하지 아니한 자와 죄인은 어디에 서리요” (<a href="https://bibleox.com/ko/ko-nkrv/1pet/4/#L17-18">벧전 4:17-18</a>)</p></blockquote><blockquote><p>“<strong><mark>너희에게나 다른 사람에게나 판단 받는 것이 내게는 매우 작은 일이라 나도 나를 판단하지 아니하노니</mark></strong> 내가 자책할 아무 것도 깨닫지 못하나 <strong><mark>이로 말미암아 의롭다 함을 얻지 못하노라 다만 나를 심판하실 이는 주시니라</mark></strong> 그러므로 <strong>때가 이르기 전 곧 주께서 오시기까지 아무 것도 판단하지 말라</strong> 그가 어둠에 감추인 것들을 드러내고 마음의 뜻을 나타내시리니 그 때에 각 사람에게 하나님으로부터 칭찬이 있으리라” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/4/#L3-5">고전 4:3-5</a>)</p></blockquote><h2>그리스도께서는 사람이 몸으로 사는 동안 한 일을 심판하십니다</h2><blockquote><p>“이는 우리가 다 반드시 그리스도의 심판대 앞에 나타나게 되어 각각 선악간에 <strong><mark>그 몸으로 행한 것을 따라 받으려 함이라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2kor/5/#L10">고후 5:10</a>)</p></blockquote><p>심판은 몸으로 행한 지상의 행실을 근거로 이루어집니다:</p><blockquote><p>“또 왼편에 있는 자들에게 이르시되 <strong>저주를 받은 자들아 나를 떠나 마귀와 그 사자들을 위하여 예비된 영원한 불에 들어가라 내가 주릴 때에 너희가 먹을 것을 주지 아니하였고</strong> 목마를 때에 마시게 하지 아니하였고 나그네 되었을 때에 영접하지 아니하였고 헐벗었을 때에 옷 입히지 아니하였고 병들었을 때와 옥에 갇혔을 때에 돌보지 아니하였느니라 하시니 그들도 대답하여 이르되 주여 우리가 어느 때에 주께서 주리신 것이나 목마르신 것이나 나그네 되신 것이나 헐벗으신 것이나 병드신 것이나 옥에 갇히신 것을 보고 공양하지 아니하더이까 이에 임금이 대답하여 이르시되 내가 진실로 너희에게 이르노니 <strong>이 지극히 작은 자 하나에게 하지 아니한 것이 곧 내게 하지 아니한 것이니라</strong> 하시리니 <strong>그들은 영벌에, 의인들은 영생에 들어가리라</strong> 하시니라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/25/#L41-46">마 25:41-46</a>) <em>(“사자들”은 그리스어로 ἄγγελοι, “천사들”입니다.)</em></p></blockquote>'
