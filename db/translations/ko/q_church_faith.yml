  body: '<h2>모든 민족이 그리스도 신앙으로 부름받았습니다 — 신약의 증언</h2><p>그리스도께서는 사도들을 보내시어 모든 민족과 종족, 어떤 언어를 쓰는 사람에게든, 온 세상에 복음을 전하게 하십니다:</p><blockquote><p>“그러므로 <strong>너희는 가서 모든 민족을 제자로 삼아 아버지와 아들과 성령의 이름으로 세례를 베풀고 내가 너희에게 분부한 모든 것을 가르쳐 지키게 하라</strong> 볼지어다 내가 세상 끝날까지 너희와 항상 함께 있으리라 하시니라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/28/#L19-20">마 28:19-20</a>)</p></blockquote><blockquote><p>“그로 말미암아 우리가 은혜와 사도의 직분을 받아 그의 이름을 위하여 <strong>모든 이방인 중에서 믿어 순종하게 하나니</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/rim/1/#L5">롬 1:5</a>)</p></blockquote><blockquote><p>“나의 복음과 예수 그리스도를 전파함은 영세 전부터 감추어졌다가 이제는 나타내신 바 되었으며 영원하신 하나님의 명을 따라 선지자들의 글로 말미암아 <strong>모든 민족이 믿어 순종하게 하시려고 알게 하신 바</strong> 그 신비의 계시를 따라 된 것이니 이 복음으로 너희를 능히 견고하게 하실” (<a href="https://bibleox.com/ko/ko-nkrv/rim/16/#L25-26">롬 16:25-26</a>)</p></blockquote><blockquote><p>“<strong>이 천국 복음이 모든 민족에게 증언되기 위하여 온 세상에 전파되리니</strong> 그제야 끝이 오리라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/24/#L14">마 24:14</a>)</p></blockquote><blockquote><p>“또 보니 다른 천사가 공중에 날아가는데 <strong>땅에 거주하는 자들 곧 모든 민족과 종족과 방언과 백성에게 전할</strong> 영원한 복음을 가졌더라” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/14/#L6">계 14:6</a>)</p></blockquote><h2>모든 민족이 그리스도 신앙으로 부름받았습니다 — 구약의 증언</h2><p>아브라함에게 그의 후손을 통해(후손 가운데 한 분을 통해) 모든 민족이 복을 받으리라고 하신 약속:</p><blockquote><p>“또 네 씨로 말미암아 <strong>천하 만민</strong>이 복을 받으리니 이는 네가 나의 말을 준행하였음이니라 하셨다 하니라” (<a href="https://bibleox.com/ko/ko-nkrv/gen/22/#L18">창 22:18</a>)</p></blockquote><p>모든 민족이 참 하느님께 돌아오리라는 예언:</p><blockquote><p>“주여 주께서 지으신 <strong>모든 민족이 와서</strong> 주의 앞에 경배하며 주의 이름에 영광을 돌리리이다” (<a href="https://bibleox.com/ko/ko-nkrv/ps/86/#L9">시 86:9</a>)</p></blockquote><blockquote><p>“모든 왕이 그의 앞에 부복하며 <strong>모든 민족이</strong> 다 그를 섬기리로다” (<a href="https://bibleox.com/ko/ko-nkrv/ps/72/#L11">시 72:11</a>)</p></blockquote><blockquote><p>“그의 이름이 영구함이여 그의 이름이 해와 같이 장구하리로다 사람들이 그로 말미암아 복을 받으리니 <strong>모든 민족이 다 그를 복되다 하리로다</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ps/72/#L17">시 72:17</a>)</p></blockquote><blockquote><p>“<strong>너희 모든 나라들아</strong> 여호와를 찬양하며 너희 모든 백성들아 그를 찬송할지어다” (<a href="https://bibleox.com/ko/ko-nkrv/ps/117/#L1">시 117:1</a>)</p></blockquote><blockquote><p>“내가 그들의 행위와 사상을 아노라 때가 이르면 <strong>뭇 나라와 언어가 다른 민족들</strong>을 모으리니 그들이 와서 나의 영광을 볼 것이며 내가 그들 가운데에서 징조를 세워서 그들 가운데에서 도피한 자를 여러 나라 곧 다시스와 뿔과 활을 당기는 룻과 및 두발과 야완과 또 나의 명성을 듣지도 못하고 나의 영광을 보지도 못한 먼 섬들로 보내리니 그들이 나의 영광을 뭇 나라에 전파하리라 나 여호와가 말하노라 이스라엘 자손이 예물을 깨끗한 그릇에 담아 여호와의 집에 드림 같이 그들이 너희 모든 형제를 <strong>뭇 나라에서</strong> 나의 성산 예루살렘으로 말과 수레와 교자와 노새와 낙타에 태워다가 여호와께 예물로 드릴 것이요 <strong>나는 그 가운데에서 택하여 제사장과</strong> 레위인을 삼으리라 여호와의 말이니라” (<a href="https://bibleox.com/ko/ko-nkrv/is/66/#L18-21">사 66:18-21</a>)</p></blockquote><blockquote><p>“<strong>땅의 모든 끝이여 내게로 돌이켜 구원을 받으라</strong> 나는 하나님이라 다른 이가 없느니라” (<a href="https://bibleox.com/ko/ko-nkrv/is/45/#L22">사 45:22</a>)</p></blockquote><blockquote><p>“그가 이르시되 네가 나의 종이 되어 야곱의 지파들을 일으키며 이스라엘 중에 보전된 자를 돌아오게 할 것은 매우 쉬운 일이라 내가 또 너를 이방의 빛으로 삼아 <strong>나의 구원을 베풀어서 땅 끝까지 이르게 하리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/is/49/#L6">사 49:6</a>)</p></blockquote><blockquote><p>“주의 도를 땅 위에, <strong>주의 구원을 모든 나라에게 알리소서</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ps/67/#L2">시 67:2</a>)</p></blockquote><blockquote><p>“그에게 권세와 영광과 나라를 주고 <strong>모든 백성과 나라들과 다른 언어를 말하는 모든 자들</strong>이 그를 섬기게 하였으니 그의 권세는 소멸되지 아니하는 영원한 권세요 그의 나라는 멸망하지 아니할 것이니라” (<a href="https://bibleox.com/ko/ko-nkrv/dan/7/#L14">단 7:14</a>)</p></blockquote><blockquote><p>“그의 영광을 <strong>모든 민족 중에</strong>, 그의 기이한 행적을 <strong>만민 중에</strong> 선포할지어다” (<a href="https://bibleox.com/ko/ko-nkrv/1par/16/#L24">대상 16:24</a>)</p></blockquote><blockquote><p>“이에 <strong>세상 만민</strong>에게 여호와께서만 하나님이시고 그 외에는 없는 줄을 알게 하시기를 원하노라” (<a href="https://bibleox.com/ko/ko-nkrv/3ts/8/#L60">왕상 8:60</a>)</p></blockquote><blockquote><p>“또한 모든 나라를 진동시킬 것이며 <strong>모든 나라의 보배가 이르리니</strong> 내가 이 성전에 영광이 충만하게 하리라 만군의 여호와의 말이니라” (<a href="https://bibleox.com/ko/ko-nkrv/ag/2/#L7">학 2:7</a>)</p></blockquote><blockquote><p>“땅이 싹을 내며 동산이 거기 뿌린 것을 움돋게 함 같이 <strong>주 여호와께서 공의와 찬송을 모든 나라 앞에 솟아나게 하시리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/is/61/#L11">사 61:11</a>)</p></blockquote><h2>다른 민족들의 신앙은 구원하지 못합니다</h2><p>예수 그리스도에 대한 사도적 신앙은 구원을 줍니다. 다른 민족들의 신앙은 구원하지 못합니다:</p><blockquote><p>“하나님이 지나간 세대에는 <strong>모든 민족으로 자기들의 길들을 가게 방임하셨으나</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/act/14/#L16">행 14:16</a>)</p></blockquote><p>자세히: <a href="https://bibleox.com/ru/ru/w/Бог-один">다른 민족들의 신은 신이 아닙니다</a>.</p><p>동시에 예수 그리스도에 대한 사도적 신앙과 이 신앙을 통한 구원은 예외 없이 모든 사람에게 열려 있습니다.</p>'
