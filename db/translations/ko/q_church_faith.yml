  title: 믿는 이들의 아버지 아브라함
  copy_cover: true
  body: <p>아브라함은 율법 없이, 할례를 받기도 전에 올바른 사람이 되었습니다:</p><blockquote><p>“일한 것이 없이 하나님께 의로 여기심을 받는 사람의 복에 대하여 다윗이 말한 바 불법이 사함을 받고 죄가 가리어짐을 받는 사람들은 복이 있고 주께서 그 죄를 인정하지 아니하실 사람은 복이 있도다 함과 같으니라 그런즉 이 복이 할례자에게냐 혹은 무할례자에게도냐 무릇 우리가 말하기를 아브라함에게는 그 믿음이 의로 여겨졌다 하노라 <strong>그런즉 그것이 어떻게 여겨졌느냐 할례시냐 무할례시냐 할례시가 아니요 무할례시니라</strong> 그가 할례의 표를 받은 것은 무할례시에 믿음으로 된 의를 인친 것이니 이는 <strong>무할례자로서 믿는 모든 자의 조상이 되어</strong> 그들도 의로 여기심을 얻게 하려 하심이라 또한 할례자의 조상이 되었나니 곧 할례 받을 자에게뿐 아니라 우리 조상 아브라함이 무할례시에 가졌던 믿음의 자취를 따르는 자들에게도 그러하니라 <strong>아브라함이나 그 후손에게 세상의 상속자가 되리라고 하신 언약은 율법으로 말미암은 것이 아니요</strong> 오직 믿음의 의로 말미암은 것이니라 만일 율법에 속한 자들이 상속자이면 믿음은 헛것이 되고 약속은 파기되었느니라 율법은 진노를 이루게 하나니 율법이 없는 곳에는 범법도 없느니라 그러므로 상속자가 되는 그것이 은혜에 속하기 위하여 믿음으로 되나니 이는 <strong>그 약속을 그 모든 후손에게 굳게 하려 하심이라 율법에 속한 자에게뿐만 아니라 아브라함의 믿음에 속한 자에게도 그러하니 아브라함은 우리 모든 사람의 조상이라</strong> 기록된 바 내가 너를 많은 민족의 조상으로 세웠다 하심과 같으니 그가 믿은 바 하나님은 죽은 자를 살리시며 없는 것을 있는 것으로 부르시는 이시니라” (<a href="https://bibleox.com/ko/ko-nkrv/rim/4/#L6-17">롬 4:6-17</a>)</p></blockquote><blockquote><p>“아브람이 구십구 세 때에 여호와께서 아브람에게 나타나서 그에게 이르시되 나는 전능한 하나님이라 너는 내 앞에서 행하여 완전하라 &lt;…&gt; 보라 내 언약이 너와 함께 있으니 <strong>너는 여러 민족의 아버지가 될지라</strong> 이제 후로는 네 이름을 아브람이라 하지 아니하고 아브라함이라 하리니 이는 <strong>내가 너를 여러 민족의 아버지가 되게 함이니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gen/17/#L1,4-5">창 17:1,4-5</a>)</p></blockquote><p>믿는 이들은 아브라함의 자손입니다:</p><blockquote><p>“아브라함이 하나님을 믿으매 그것을 그에게 의로 정하셨다 함과 같으니라 그런즉 <strong>믿음으로 말미암은 자들은 아브라함의 자손인 줄 알지어다</strong> 또 하나님이 이방을 믿음으로 말미암아 의로 정하실 것을 성경이 미리 알고 먼저 아브라함에게 복음을 전하되 <strong>모든 이방인이 너로 말미암아 복을 받으리라</strong> 하였느니라 그러므로 <strong>믿음으로 말미암은 자는 믿음이 있는 아브라함과 함께 복을 받느니라</strong> 무릇 율법 행위에 속한 자들은 저주 아래에 있나니 기록된 바 누구든지 율법 책에 기록된 대로 모든 일을 항상 행하지 아니하는 자는 저주 아래에 있는 자라 하였음이라 또 하나님 앞에서 아무도 율법으로 말미암아 의롭게 되지 못할 것이 분명하니 이는 의인은 믿음으로 살리라 하였음이라 율법은 믿음에서 난 것이 아니니 율법을 행하는 자는 그 가운데서 살리라 하였느니라 그리스도께서 우리를 위하여 저주를 받은 바 되사 율법의 저주에서 우리를 속량하셨으니 기록된 바 나무에 달린 자마다 저주 아래에 있는 자라 하였음이라 이는 그리스도 예수 안에서 <strong>아브라함의 복이 이방인에게 미치게 하고</strong> 또 우리로 하여금 믿음으로 말미암아 성령의 약속을 받게 하려 함이라 형제들아 내가 사람의 예대로 말하노니 사람의 언약이라도 정한 후에는 아무도 폐하거나 더하거나 하지 못하느니라 이 약속들은 아브라함과 그 자손에게 말씀하신 것인데 <strong>여럿을 가리켜 그 자손들이라 하지 아니하시고 오직 한 사람을 가리켜 네 자손이라 하셨으니 곧 그리스도라</strong> &lt;…&gt; 누구든지 그리스도와 합하기 위하여 세례를 받은 자는 그리스도로 옷 입었느니라 &lt;…&gt; <strong>너희가 그리스도의 것이면 곧 아브라함의 자손이요</strong> 약속대로 유업을 이을 자니라” (<a href="https://bibleox.com/ko/ko-nkrv/gal/3/#L6-16,27,29">갈 3:6-16,27,29</a>)</p></blockquote><blockquote><p>“너를 축복하는 자에게는 내가 복을 내리고 너를 저주하는 자에게는 내가 저주하리니 <strong>땅의 모든 족속이 너로 말미암아 복을 얻을 것이라</strong> 하신지라” (<a href="https://bibleox.com/ko/ko-nkrv/gen/12/#L3">창 12:3</a>)</p></blockquote><blockquote><p>“이는 그리스도 예수 안에서 <strong>아브라함의 복이 이방인에게 미치게 하고</strong> 또 우리로 하여금 믿음으로 말미암아 성령의 약속을 받게 하려 함이라” (<a href="https://bibleox.com/ko/ko-nkrv/gal/3/#L14">갈 3:14</a>)</p></blockquote><h2>예수 그리스도께서 말씀하신 아브라함의 자녀</h2><blockquote><p>“속으로 아브라함이 우리 조상이라고 생각하지 말라 내가 너희에게 이르노니 <strong>하나님이 능히 이 돌들로도 아브라함의 자손이 되게 하시리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/3/#L9">마 3:9</a>; <a href="https://bibleox.com/ko/ko-nkrv/lk/3/#L8">눅 3:8</a>)</p></blockquote><h2>교회는 새 이스라엘입니다</h2><blockquote><p>“그러나 너희는 택하신 족속이요 왕 같은 제사장들이요 거룩한 나라요 그의 소유가 된 백성이니 이는 너희를 어두운 데서 불러 내어 그의 기이한 빛에 들어가게 하신 이의 아름다운 덕을 선포하게 하려 하심이라 <strong>너희가 전에는 백성이 아니더니 이제는 하나님의 백성이요 전에는 긍휼을 얻지 못하였더니 이제는 긍휼을 얻은 자니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1pet/2/#L9-10">벧전 2:9-10</a>)</p></blockquote>
