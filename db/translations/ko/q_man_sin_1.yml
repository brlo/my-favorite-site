- src: непрощение
  path: Uf2g_용서하지_않음
  title: 용서하지 않음
  copy_cover: true
  body: <blockquote><p>“<strong>긍휼히 여기는 자는</strong> 복이 있나니 그들이 <strong>긍휼히 여김을 받을 것임이요</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/5/#L7">마 5:7</a>)</p></blockquote><blockquote><p>“그러므로 너희는 이렇게 기도하라 하늘에 계신 우리 아버지여 이름이 거룩히 여김을 받으시오며 &lt;…&gt; <strong>우리가 우리에게 죄 지은 자를 사하여 준 것 같이 우리 죄를 사하여 주시옵고</strong> &lt;…&gt; <strong>너희가 사람의 잘못을 용서하면 너희 하늘 아버지께서도 너희 잘못을 용서하시려니와 너희가 사람의 잘못을 용서하지 아니하면 너희 아버지께서도 너희 잘못을 용서하지 아니하시리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/6/#L9,12,14-15">마 6:9,12,14-15</a>)</p></blockquote><blockquote><p>“비판하지 말라 그리하면 너희가 비판을 받지 않을 것이요 정죄하지 말라 그리하면 너희가 정죄를 받지 않을 것이요 <strong>용서하라 그리하면 너희가 용서를 받을 것이요</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/lk/6/#L37">눅 6:37</a>)</p></blockquote><blockquote><p>“그 때에 베드로가 나아와 이르되 주여 <strong>형제가 내게 죄를 범하면 몇 번이나 용서하여 주리이까</strong> 일곱 번까지 하오리이까 예수께서 이르시되 네게 이르노니 일곱 번뿐 아니라 일곱 번을 일흔 번까지라도 할지니라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/18/#L21-22">마 18:21-22</a>)</p></blockquote><blockquote><p>“서로 친절하게 하며 불쌍히 여기며 <strong>서로 용서하기를</strong> <strong>하나님이 그리스도 안에서 너희를 용서하심과 같이 하라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ef/4/#L32">엡 4:32</a>)</p></blockquote><blockquote><p>“<strong>우리도</strong> <strong>전에는</strong> 어리석은 자요 순종하지 아니한 자요 속은 자요 여러 가지 정욕과 행락에 종 노릇 한 자요 <strong>악독과 투기를 일삼은 자요</strong> 가증스러운 자요 <strong>피차 미워한 자였으나</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/tit/3/#L3">딛 3:3</a>)</p></blockquote><blockquote><p>“그러므로 <strong>예물을 제단에 드리려다가 거기서 네 형제에게 원망들을 만한 일이 있는 것이 생각나거든 예물을 제단 앞에 두고 먼저 가서 형제와 화목하고</strong> 그 후에 와서 예물을 드리라 <strong>너를 고발하는 자와 함께 길에 있을 때에 급히 사화하라</strong> 그 고발하는 자가 너를 재판관에게 내어 주고 재판관이 옥리에게 내어 주어 옥에 가둘까 염려하라 진실로 네게 이르노니 네가 한 푼이라도 남김이 없이 다 갚기 전에는 결코 거기서 나오지 못하리라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/5/#L23-26">마 5:23-26</a>)</p></blockquote><blockquote><p>“<strong>형제들아 서로 원망하지 말라 그리하여야 심판을 면하리라</strong> 보라 심판주가 문 밖에 서 계시니라” (<a href="https://bibleox.com/ko/ko-nkrv/iak/5/#L9">약 5:9</a>)</p></blockquote><blockquote><p>“곧 모든 불의, 추악, 탐욕, 악의가 가득한 자요 시기, 살인, <strong>분쟁</strong>, 사기, 악독이 가득한 자요 수군수군하는 자요 비방하는 자요 하나님께서 미워하시는 자요 <strong>능욕하는 자요</strong> <strong>교만한 자요</strong> 자랑하는 자요 악을 도모하는 자요 부모를 거역하는 자요 우매한 자요 배약하는 자요 <strong>무정한 자요</strong> <strong>무자비한 자라</strong> 그들이 <strong>이같은 일을 행하는 자는 사형에 해당한다고</strong> 하나님께서 정하심을 알고도 자기들만 행할 뿐 아니라 또한 그런 일을 행하는 자들을 옳다 하느니라” (<a href="https://bibleox.com/ko/ko-nkrv/rim/1/#L29-32">롬 1:29-32</a>)</p></blockquote><blockquote><p>“육체의 일은 분명하니 곧 음행과 더러운 것과 호색과 우상 숭배와 주술과 원수 맺는 것과 <strong>분쟁과</strong> 시기와 <strong>분냄과</strong> 당 짓는 것과 <strong>분열함과</strong> 이단과 투기와 술 취함과 방탕함과 또 그와 같은 것들이라 전에 너희에게 경계한 것 같이 경계하노니 이런 일을 하는 자들은 <strong>하나님의 나라를 유업으로 받지 못할 것이요</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gal/5/#L19-21">갈 5:19-21</a>)</p></blockquote><blockquote><p>“이에 주인이 그를 불러다가 말하되 <strong>악한 종아 네가 빌기에 내가 네 빚을 전부 탕감하여 주었거늘 내가 너를 불쌍히 여김과 같이 너도 네 동료를 불쌍히 여김이 마땅하지 아니하냐</strong> 하고 주인이 노하여 그 빚을 다 갚도록 그를 옥졸들에게 넘기니라 <strong>너희가 각각 마음으로부터 형제를 용서하지 아니하면 나의 하늘 아버지께서도 너희에게 이와 같이 하시리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/18/#L32-35">마 18:32-35</a>)</p></blockquote>
  meta_desc: 용서하지 않는 죄, 무자비함과 잔인함에 관한 성경 구절
