  references: "<p>번역: 로디온 블라소프 (AI 도구 활용). 저본: 러시아어 원문. 참고: 영어·일본어 번역. 성경 인용과 링크는 개역개정에 따름.</p>"
- src: колдовство
  path: Wc8f_주술
  title: 주술
  copy_cover: true
  body: <h2>죄입니다</h2><p>“주술”이라는 항목에는 다음 모든 것도 들어갑니다:</p><ul><li><p>(어떤 종류든) 점치기,</p></li><li><p>영을 불러내기,</p></li><li><p>(검은 것이든 흰 것이든 어떤 종류든) 마술을 믿는 것,</p></li><li><p>부적(빨간 실 포함)의 힘을 믿는 것,</p></li><li><p>주문을 건 물건,</p></li><li><p>별점(점성술),</p></li><li><p>영매를 찾아가는 것,</p></li><li><p>술사,</p></li><li><p>마술사,</p></li><li><p>무당,</p></li><li><p>점쟁이,</p></li><li><p>주문 외는 자,</p></li><li><p>“액운”, “저주”, “조상의 저주”를 풀어 준다는 노파들</p></li><li><p>등등:</p></li></ul><blockquote><p>“네 하나님 여호와께서 네게 주시는 땅에 들어가거든 너는 그 민족들의 가증한 행위를 본받지 말 것이니 그의 아들이나 딸을 불 가운데로 지나게 하는 자나 <strong>점쟁이나 길흉을 말하는 자나 요술하는 자나 무당이나 진언자나 신접자나 박수나 초혼자를 너희 가운데에 용납하지 말라</strong> <strong>이런 일을 행하는 모든 자를 여호와께서 가증히 여기시나니</strong> 이런 가증한 일로 말미암아 네 하나님 여호와께서 그들을 네 앞에서 쫓아내시느니라 너는 네 하나님 여호와 앞에서 완전하라 네가 쫓아낼 이 민족들은 길흉을 말하는 자나 점쟁이의 말을 듣거니와 네게는 네 하나님 여호와께서 이런 일을 용납하지 아니하시느니라” (<a href="https://bibleox.com/ko/ko-nkrv/vtor/18/#L9-14">신 18:9-14</a>)</p></blockquote><blockquote><p>“또 자기 자녀를 불 가운데로 지나가게 하며 <strong>복술과 사술을 행하고</strong> 스스로 팔려 여호와 보시기에 악을 행하여 그를 격노하게 하였으므로” (<a href="https://bibleox.com/ko/ko-nkrv/4ts/17/#L17">왕하 17:17</a>)</p></blockquote><blockquote><p>“또 힌놈의 아들 골짜기에서 그의 아들들을 불 가운데로 지나가게 하며 또 <strong>점치며 사술과 요술을 행하며 신접한 자와 박수를 신임하여</strong> 여호와 보시기에 악을 많이 행하여 여호와를 진노하게 하였으며 또 자기가 만든 아로새긴 목상을 하나님의 전에 세웠더라 옛적에 하나님이 이 성전에 대하여 다윗과 그의 아들 솔로몬에게 이르시기를 내가 이스라엘 모든 지파 중에서 택한 이 성전과 예루살렘에 내 이름을 영원히 둘지라” (<a href="https://bibleox.com/ko/ko-nkrv/2par/33/#L6-7">대하 33:6-7</a>)</p></blockquote><blockquote><p>“어떤 사람이 너희에게 말하기를 주절거리며 속살거리는 <strong>신접한 자와 마술사에게 물으라 하거든 백성이 자기 하나님께 구할 것이 아니냐</strong> 산 자를 위하여 죽은 자에게 구하겠느냐 하라” (<a href="https://bibleox.com/ko/ko-nkrv/is/8/#L19">사 8:19</a>)</p></blockquote><blockquote><p>“너희는 너희 선지자나 <strong>복술가나 꿈꾸는 자나 술사나 요술자가</strong> 이르기를 너희가 바벨론의 왕을 섬기게 되지 아니하리라 하여도 <strong>너희는 듣지 말라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ier/27/#L9">렘 27:9</a>)</p></blockquote><blockquote><p>“만군의 여호와 이스라엘의 하나님께서 이와 같이 말하노라 너희 중에 있는 선지자들에게와 <strong>점쟁이에게 미혹되지 말며</strong> 너희가 꾼 꿈도 곧이 듣고 믿지 말라” (<a href="https://bibleox.com/ko/ko-nkrv/ier/29/#L8">렘 29:8</a>)</p></blockquote><blockquote><p>“이르기를 주 여호와의 말씀에 사람의 영혼을 사냥하려고 <strong>손목마다 부적을 꿰어 매고</strong> 키가 큰 자나 작은 자의 머리를 위하여 수건을 만드는 여자들에게 화 있을진저 너희가 어찌하여 내 백성의 영혼은 사냥하면서 자기를 위하여는 영혼을 살리려 하느냐” (<a href="https://bibleox.com/ko/ko-nkrv/iez/13/#L18">겔 13:18</a>)</p></blockquote><blockquote><p>“그러므로 나 주 여호와가 이같이 말하노라 너희가 새를 사냥하듯 영혼들을 사냥하는 <strong>그 부적을 내가 너희 팔에서 떼어 버리고</strong> 너희가 새처럼 사냥한 그 영혼들을 놓아 주며” (<a href="https://bibleox.com/ko/ko-nkrv/iez/13/#L20">겔 13:20</a>)</p></blockquote><blockquote><p>“네 구속자요 모태에서 너를 지은 나 여호와가 이같이 말하노라 나는 만물을 지은 여호와라 홀로 하늘을 폈으며 나와 함께 한 자 없이 땅을 펼쳤고 헛된 말을 하는 자들의 징표를 폐하며 <strong>점 치는 자들을 미치게 하며</strong> 지혜로운 자들을 물리쳐 그들의 지식을 어리석게 하며” (<a href="https://bibleox.com/ko/ko-nkrv/is/44/#L24-25">사 44:24-25</a>)</p></blockquote><blockquote><p>“내가 또 <strong>복술을 네 손에서 끊으리니 네게 다시는 점쟁이가 없게 될 것이며</strong> 내가 네가 새긴 우상과 주상을 너희 가운데에서 멸절하리니 네가 네 손으로 만든 것을 다시는 섬기지 아니하리라 내가 또 네 아세라 목상을 너희 가운데에서 빼버리고 네 성읍들을 멸할 것이며” (<a href="https://bibleox.com/ko/ko-nkrv/mih/5/#L12-14">미 5:12-14</a>)</p></blockquote><blockquote><p>“또 그 살인과 <strong>복술과</strong> 음행과 도둑질을 회개하지 아니하더라” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/9/#L21">계 9:21</a>)</p></blockquote><blockquote><p>“이기는 자는 이것들을 상속으로 받으리라 나는 그의 하나님이 되고 그는 내 아들이 되리라 그러나 두려워하는 자들과 믿지 아니하는 자들과 흉악한 자들과 살인자들과 음행하는 자들과 <strong>점술가들과</strong> 우상 숭배자들과 거짓말하는 모든 자들은 <strong>불과 유황으로 타는 못에 던져지리니</strong> 이것이 둘째 사망이라” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/21/#L7-8">계 21:7-8</a>)</p></blockquote><blockquote><p>“개들과 <strong>점술가들과</strong> 음행하는 자들과 살인자들과 우상 숭배자들과 및 거짓말을 좋아하며 지어내는 자는 <strong>다 성 밖에 있으리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/22/#L15">계 22:15</a>)</p></blockquote><h2>주문 외는 자들과 술사들은 하느님 앞에서 아무것도 아닙니다. 그들은 사람들을 그분의 벌에서 구하지 못합니다</h2><blockquote><p>“한 날에 갑자기 자녀를 잃으며 과부가 되는 이 두 가지 일이 네게 임할 것이라 <strong>네가 무수한 주술과 많은 주문을 빌릴지라도 이 일이 온전히 네게 임하리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/is/47/#L9">사 47:9</a>)</p></blockquote><blockquote><p>“이제 너는 젊어서부터 힘쓰던 <strong>주문과 많은 주술을 가지고 맞서 보라</strong> 혹시 유익을 얻을 수 있을는지, 혹시 놀라게 할 수 있을는지, 네가 많은 계략으로 말미암아 피곤하게 되었도다 <strong>하늘을 살피는 자와 별을 보는 자와 초하룻날에 예고하는 자들에게 일어나</strong> 네게 임할 그 일에서 너를 구원하게 하여 보라 보라 <strong>그들은 초개 같아서 불에 타리니</strong> 그 불꽃의 세력에서 스스로 구원하지 못할 것이라 이 불은 덥게 할 숯불이 아니요 그 앞에 앉을 만한 불도 아니니라 네가 같이 힘쓰던 자들이 네게 이같이 되리니 어려서부터 너와 함께 장사하던 자들이 각기 제 길로 흩어지고 너를 구원할 자가 없으리라” (<a href="https://bibleox.com/ko/ko-nkrv/is/47/#L12-15">사 47:12-15</a>)</p></blockquote><h2>어둠의 세력을 찾는 것은 하느님을 배반하는 것(간음)입니다</h2><blockquote><p>“<strong>무당의 자식, 간음자와 음녀의 자식들아</strong> 너희는 가까이 오라 너희가 누구를 희롱하느냐 누구를 향하여 입을 크게 벌리며 혀를 내미느냐 너희는 패역의 자식, 거짓의 후손이 아니냐 너희가 상수리나무 사이, 모든 푸른 나무 아래에서 음욕을 피우며 골짜기 가운데 바위 틈에서 자녀를 도살하는도다” (<a href="https://bibleox.com/ko/ko-nkrv/is/57/#L3-5">사 57:3-5</a>)</p></blockquote><blockquote><p>“이는 <strong>마술에 능숙한 미모의 음녀가</strong> 많은 음행을 함이라 그가 그의 음행으로 여러 나라를 미혹하고 <strong>그의 마술로 여러 족속을 미혹하느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/naum/3/#L4">나 3:4</a>)</p></blockquote><blockquote><p>“내가 심판하러 너희에게 임할 것이라 <strong>점치는 자에게와 간음하는 자에게와</strong> 거짓 맹세하는 자에게와 품꾼의 삯에 대하여 억울하게 하며 과부와 고아를 압제하며 나그네를 억울하게 하며 나를 경외하지 아니하는 자들에게 속히 증언하리라 만군의 여호와가 말하였느니라” (<a href="https://bibleox.com/ko/ko-nkrv/mal/3/#L5">말 3:5</a>)</p></blockquote><h2>그리스도교로 돌아선 사람들은 주술을 버렸습니다</h2><blockquote><p>“믿은 사람들이 많이 와서 자복하여 행한 일을 알리며 또 <strong>마술을 행하던 많은 사람이 그 책을 모아 가지고 와서 모든 사람 앞에서 불사르니</strong> 그 책 값을 계산한즉 은 오만이나 되더라” (<a href="https://bibleox.com/ko/ko-nkrv/act/19/#L18-19">행 19:18-19</a>)</p></blockquote>
