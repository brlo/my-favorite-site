- src: cICd_Ложь_обман
  path: Ly3g_거짓말
  title: 거짓말(속임)
  copy_cover: true
  body: <blockquote><p>“너희는 너희 아비 <strong><mark>마귀</mark></strong>에게서 났으니 너희 아비의 욕심대로 너희도 행하고자 하느니라 그는 처음부터 살인한 자요 진리가 그 속에 없으므로 진리에 서지 못하고 거짓을 말할 때마다 제 것으로 말하나니 이는 그가 <strong><mark>거짓말쟁이요 거짓의 아비가 되었음이라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/in/8/#L44">요 8:44</a>)</p></blockquote><blockquote><p>“거짓 증인은 벌을 면하지 못할 것이요 <strong>거짓말을 하는 자도 피하지 못하리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/pr/19/#L5">잠 19:5</a>)</p></blockquote><blockquote><p>“<strong>네 이웃에 대하여 거짓 증거하지 말라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ish/20/#L16">출 20:16</a>)</p></blockquote><blockquote><p>“너희는 도둑질하지 말며 <strong>속이지 말며 서로 거짓말하지 말며</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/lev/19/#L11">레 19:11</a>)</p></blockquote><blockquote><p>“이제는 너희가 이 모든 것을 벗어 버리라 곧 분함과 노여움과 악의와 비방과 너희 입의 부끄러운 말이라 <strong>너희가 서로 거짓말을 하지 말라</strong> 옛 사람과 그 행위를 벗어 버리고” (<a href="https://bibleox.com/ko/ko-nkrv/kol/3/#L8-9">골 3:8-9</a>)</p></blockquote><blockquote><p>“그런즉 <strong>거짓을 버리고 각각 그 이웃과 더불어 참된 것을 말하라</strong> 이는 우리가 서로 지체가 됨이라” (<a href="https://bibleox.com/ko/ko-nkrv/ef/4/#L25">엡 4:25</a>)</p></blockquote><blockquote><p>“<strong>모든 불의가 죄로되</strong> 사망에 이르지 아니하는 죄도 있도다” (<a href="https://bibleox.com/ko/ko-nkrv/1in/5/#L17">요일 5:17</a>)</p></blockquote><blockquote><p>“<strong>거짓 입술은 여호와께 미움을 받아도</strong> 진실하게 행하는 자는 그의 기뻐하심을 받느니라” (<a href="https://bibleox.com/ko/ko-nkrv/pr/12/#L22">잠 12:22</a>)</p></blockquote><blockquote><p>“오만한 자들이 주의 목전에 서지 못하리이다 주는 모든 행악자를 미워하시며 <strong>거짓말하는 자들을 멸망시키시리이다</strong> 여호와께서는 피 흘리기를 즐기는 자와 속이는 자를 싫어하시나이다” (<a href="https://bibleox.com/ko/ko-nkrv/ps/5/#L5-6">시 5:5-6</a>)</p></blockquote><blockquote><p>“짐승 떼 가운데에 수컷이 있거늘 그 서원하는 일에 흠 있는 것으로 <strong>속여 내게 드리는 자는 저주를 받으리니</strong> 나는 큰 임금이요 내 이름은 이방 민족 중에서 두려워하는 것이 됨이니라 만군의 여호와의 말이니라” (<a href="https://bibleox.com/ko/ko-nkrv/mal/1/#L14">말 1:14</a>)</p></blockquote>
  menu:
    parent: 사람/죄
