- src: аборт-грех
  path: Ab7r_낙태
  title: 낙태
  copy_cover: true
  body: <h2>살인은 죄입니다</h2><blockquote><p>“<strong>살인하지 말라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ish/20/#L13">출 20:13</a>; <a href="https://bibleox.com/ko/ko-nkrv/vtor/5/#L17">신 5:17</a>)</p></blockquote><blockquote><p>“이르되 어느 계명이오니이까 예수께서 이르시되 <strong>살인하지 말라</strong>, 간음하지 말라, 도둑질하지 말라, 거짓 증언 하지 말라,” (<a href="https://bibleox.com/ko/ko-nkrv/mf/19/#L18">마 19:18</a>; <a href="https://bibleox.com/ko/ko-nkrv/mf/5/#L21">마 5:21</a>; <a href="https://bibleox.com/ko/ko-nkrv/mk/10/#L19">막 10:19</a>; <a href="https://bibleox.com/ko/ko-nkrv/lk/18/#L20">눅 18:20</a>; <a href="https://bibleox.com/ko/ko-nkrv/rim/13/#L9">롬 13:9</a>)</p></blockquote><p>아기는 모태 안에 있든 이미 나왔든 사람입니다. 그리고 사람을 죽이는 것은 죄입니다. 고대 그리스도교 문헌(디다케)은 이것을 분명히 말합니다:</p><blockquote><p>“<strong>아이를 낙태로 죽이지 말고</strong>, 태어난 아이도 죽이지 말라” (디다케 2장, 그리스어에서 옮김)</p></blockquote><h2>아기는 모태 안에서도 모태 밖에서도 사람입니다</h2><p>성경은 만삭보다 훨씬 이르게(임신 3-4개월에) 태어난 이들도 아기라고 부릅니다:</p><blockquote><p>“한 살 된 아이들이 소리 내어 말하고, <strong>임신한 여자들이 석 달, 넉 달 만에 덜 자란 아이들을 낳을 것인데, 그들이 살아서 뛰놀 것이다</strong>” (<a href="https://bibleox.com/ko/en-nrsv/3ezd/6/#L21">3에스 6:21</a>, 영어 번역(NRSV)에서 옮김) <em>(에스드라 2서(러시아어 성경의 에스드라 3서). 개역개정에는 이 책이 없습니다.)</em></p></blockquote><p>갓난 사내아이들을 죽이기를 거부한 산파들에 대한 칭찬:</p><blockquote><p>“그러나 <strong>산파들이 하나님을 두려워하여 애굽 왕의 명령을 어기고 남자 아기들을 살린지라</strong> &lt;…&gt; <strong>하나님이 그 산파들에게 은혜를 베푸시니</strong> 그 백성은 번성하고 매우 강해지니라 그 산파들은 하나님을 경외하였으므로 하나님이 그들의 집안을 흥왕하게 하신지라” (<a href="https://bibleox.com/ko/ko-nkrv/ish/1/#L17,20-21">출 1:17,20-21</a>)</p></blockquote><p>선지자 세례 요한은 태어나기 전, 바로 어머니의 모태에서 성령으로 충만했습니다. 곧 언젠가 사람이 될 “무엇”이 아니라 선지자 요한 자신이 아직 모태에 있을 때 하느님의 영의 성전이 됩니다.</p><blockquote><p>“이는 그가 주 앞에 큰 자가 되며 포도주나 독한 술을 마시지 아니하며 <strong>모태로부터 성령의 충만함을 받아</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/lk/1/#L15">눅 1:15</a>)</p></blockquote><p>하느님께서는 어머니의 모태에서 나중에 사람이 될 “무엇”이 아니라 사람 자신을 지으셨고, 그 사람은 나중에 모태에서 나왔을 뿐, 곧 태어났을 뿐입니다. 그리고 하느님께서는 태어나기 전에 이미 그 사람을 성별하셨습니다:</p><blockquote><p>“<strong>내가 너를 모태에 짓기 전에 너를 알았고 네가 배에서 나오기 전에 너를 성별하였고</strong> 너를 여러 나라의 선지자로 세웠노라 하시기로” (<a href="https://bibleox.com/ko/ko-nkrv/ier/1/#L5">렘 1:5</a>)</p></blockquote><p>고난을 많이 겪은 선지자 욥도 같은 것을 말합니다. 하느님께서는 나중에 사람이 될 “무엇”이 아니라 우리를 태 속에서 지으십니다:</p><blockquote><p>“<strong>나를 태 속에 만드신 이가</strong> 그도 만들지 아니하셨느냐 <strong>우리를 뱃속에 지으신 이가</strong> 한 분이 아니시냐” (<a href="https://bibleox.com/ko/ko-nkrv/iov/31/#L15">욥 31:15</a>)</p></blockquote><p>사람이 어머니의 모태에서 자라는 과정은 하느님 자신의 창조 행위로 묘사됩니다. 사람이 이미 존재하고, 세상에 나오기 위해 옷처럼 살을 입는 것으로 묘사됩니다. 욥은 자라서 나중에 욥이 된 어떤 재료에 대해 말하지 않습니다. 그는 곧바로 태아를 자기 자신으로 말합니다. 주께서 내게 살을 입히지 않으셨습니까?</p><blockquote><p>“<strong>주의 손으로 나를 빚으셨으며 만드셨는데</strong> 이제 나를 멸하시나이다 기억하옵소서 주께서 내 몸 지으시기를 흙을 뭉치듯 하셨거늘 다시 나를 티끌로 돌려보내려 하시나이까 주께서 나를 젖과 같이 쏟으셨으며 엉긴 젖처럼 엉기게 하지 아니하셨나이까 <strong>피부와 살을 내게 입히시며 뼈와 힘줄로 나를 엮으시고</strong> 생명과 은혜를 내게 주시고 나를 보살피심으로 내 영을 지키셨나이다” (<a href="https://bibleox.com/ko/ko-nkrv/iov/10/#L8-12">욥 10:8-12</a>)</p></blockquote><p>선지자 다윗도 같은 것을 묘사합니다:</p><blockquote><p>“주께서 내 내장을 지으시며 <strong>나의 모태에서 나를 만드셨나이다</strong> &lt;…&gt; 내가 은밀한 데서 지음을 받고 땅의 깊은 곳에서 기이하게 지음을 받은 때에 나의 형체가 주의 앞에 숨겨지지 못하였나이다 <strong>내 형질이 이루어지기 전에 주의 눈이 보셨으며</strong> 나를 위하여 정한 날이 하루도 되기 전에 주의 책에 다 기록이 되었나이다” (<a href="https://bibleox.com/ko/ko-nkrv/ps/139/#L13,15-16">시 139:13,15-16</a>)</p></blockquote>
  title_sub: 낙태(아이를 죽이는 일)에 관한 성경 구절
  meta_desc: 낙태(아이를 죽이는 일)에 관한 성경 구절
