  path: Pr1d_교만
  title: 교만
  copy_cover: true
  body: <h2>교만에 대한 정죄</h2><blockquote><p>“젊은 자들아 이와 같이 장로들에게 순종하고 다 서로 겸손으로 허리를 동이라 <strong>하나님은 교만한 자를 대적하시되</strong> 겸손한 자들에게는 은혜를 주시느니라” (<a href="https://bibleox.com/ko/ko-nkrv/1pet/5/#L5">벧전 5:5</a>; <a href="https://bibleox.com/ko/ko-nkrv/iak/4/#L6">약 4:6</a>)</p></blockquote><blockquote><p>“<strong>무릇 마음이 교만한 자를 여호와께서 미워하시나니</strong> 피차 손을 잡을지라도 벌을 면하지 못하리라” (<a href="https://bibleox.com/ko/ko-nkrv/pr/16/#L5">잠 16:5</a>)</p></blockquote><blockquote><p>“<strong>여호와를 경외하는 것은 악을 미워하는 것이라 나는 교만과 거만과</strong> 악한 행실과 패역한 입을 미워하느니라” (<a href="https://bibleox.com/ko/ko-nkrv/pr/8/#L13">잠 8:13</a>)</p></blockquote><h2>교만이 드러나는 모습</h2><blockquote><p>“사람에게 보이려고 그들 앞에서 너희 의를 행하지 않도록 주의하라 그리하지 아니하면 하늘에 계신 너희 아버지께 상을 받지 못하느니라 그러므로 구제할 때에 <strong>외식하는 자가 사람에게서 영광을 받으려고 회당과 거리에서 하는 것 같이 너희 앞에 나팔을 불지 말라</strong> 진실로 너희에게 이르노니 그들은 자기 상을 이미 받았느니라 너는 구제할 때에 오른손이 하는 것을 왼손이 모르게 하여 네 구제함을 은밀하게 하라 은밀한 중에 보시는 너의 아버지께서 갚으시리라 또 너희는 기도할 때에 외식하는 자와 같이 하지 말라 그들은 <strong>사람에게 보이려고</strong> 회당과 큰 거리 어귀에 서서 기도하기를 좋아하느니라 내가 진실로 너희에게 이르노니 그들은 자기 상을 이미 받았느니라 너는 기도할 때에 네 골방에 들어가 문을 닫고 은밀한 중에 계신 네 아버지께 기도하라 은밀한 중에 보시는 네 아버지께서 갚으시리라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/6/#L1-6">마 6:1-6</a>)</p></blockquote><blockquote><p>“또 <strong>자기를 의롭다고 믿고 다른 사람을 멸시하는 자들에게</strong> 이 비유로 말씀하시되 두 사람이 기도하러 성전에 올라가니 하나는 바리새인이요 하나는 세리라 바리새인은 서서 따로 기도하여 이르되 하나님이여 <strong>나는 다른 사람들 곧 토색, 불의, 간음을 하는 자들과 같지 아니하고</strong> 이 세리와도 같지 아니함을 감사하나이다 나는 이레에 두 번씩 금식하고 또 소득의 십일조를 드리나이다 하고” (<a href="https://bibleox.com/ko/ko-nkrv/lk/18/#L9-12">눅 18:9-12</a>)</p></blockquote><blockquote><p>“<strong>비판하지 말라</strong> 그리하면 너희가 비판을 받지 않을 것이요 정죄하지 말라 그리하면 너희가 정죄를 받지 않을 것이요 용서하라 그리하면 너희가 용서를 받을 것이요” (<a href="https://bibleox.com/ko/ko-nkrv/lk/6/#L37">눅 6:37</a>)</p></blockquote><blockquote><p>“맹인 된 인도자여 <strong>하루살이는 걸러 내고 낙타는 삼키는도다</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/23/#L24">마 23:24</a>)</p></blockquote><h2>교만은 마귀의 죄입니다</h2><blockquote><p>“인자야 두로 왕을 위하여 슬픈 노래를 지어 그에게 이르기를 주 여호와의 말씀에 너는 완전한 도장이었고 지혜가 충족하며 온전히 아름다웠도다 네가 옛적에 하나님의 동산 에덴에 있어서 각종 보석 곧 홍보석과 황보석과 금강석과 황옥과 홍마노와 창옥과 청보석과 남보석과 홍옥과 황금으로 단장하였음이여 네가 지음을 받던 날에 너를 위하여 소고와 비파가 준비되었도다 <strong>너는 기름 부음을 받고 지키는 그룹임이여</strong> 내가 너를 세우매 네가 하나님의 성산에 있어서 불타는 돌들 사이에 왕래하였도다 네가 지음을 받던 날로부터 네 모든 길에 완전하더니 <strong>마침내 네게서 불의가 드러났도다</strong> 네 무역이 많으므로 <strong>네 가운데에 강포가 가득하여 네가 범죄하였도다</strong> 너 지키는 그룹아 그러므로 내가 너를 더럽게 여겨 하나님의 산에서 쫓아냈고 불타는 돌들 사이에서 멸하였도다 <strong><mark>네가 아름다우므로 마음이 교만하였으며 네가 영화로우므로 네 지혜를 더럽혔음이여</mark></strong> 내가 너를 땅에 던져 왕들 앞에 두어 그들의 구경 거리가 되게 하였도다” (<a href="https://bibleox.com/ko/ko-nkrv/iez/28/#L12-17">겔 28:12-17</a>)</p></blockquote><blockquote><p>“너 아침의 아들 계명성이여 어찌 그리 하늘에서 떨어졌으며 너 열국을 엎은 자여 어찌 그리 땅에 찍혔는고 <strong><mark>네가 네 마음에 이르기를 내가 하늘에 올라 하나님의 뭇 별 위에 내 자리를 높이리라 내가 북극 집회의 산 위에 앉으리라 가장 높은 구름에 올라가 지극히 높은 이와 같아지리라 하는도다</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/is/14/#L12-14">사 14:12-14</a>)</p></blockquote>
