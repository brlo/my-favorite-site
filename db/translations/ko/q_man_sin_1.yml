  title: 죽음에 이르는 죄
  copy_cover: true
  body: <p>성경에 나오는 죽음에 이르는 죄 가운데 몇 가지:</p><blockquote><p>“곧 모든 불의, 추악, 탐욕, 악의가 가득한 자요 시기, 살인, 분쟁, 사기, 악독이 가득한 자요 수군수군하는 자요 비방하는 자요 하나님께서 미워하시는 자요 능욕하는 자요 교만한 자요 자랑하는 자요 악을 도모하는 자요 부모를 거역하는 자요 우매한 자요 배약하는 자요 무정한 자요 무자비한 자라 그들이 <strong>이같은 일을 행하는 자는 사형에 해당한다고</strong> 하나님께서 정하심을 알고도 자기들만 행할 뿐 아니라 또한 그런 일을 행하는 자들을 옳다 하느니라” (<a href="https://bibleox.com/ko/ko-nkrv/rim/1/#L29-32">롬 1:29-32</a>)</p></blockquote><blockquote><p>“육체의 일은 분명하니 곧 음행과 더러운 것과 호색과 우상 숭배와 주술과 원수 맺는 것과 분쟁과 시기와 분냄과 당 짓는 것과 분열함과 이단과 투기와 술 취함과 방탕함과 또 그와 같은 것들이라 전에 너희에게 경계한 것 같이 경계하노니 <strong>이런 일을 하는 자들은 하나님의 나라를 유업으로 받지 못할 것이요</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gal/5/#L19-21">갈 5:19-21</a>)</p></blockquote><blockquote><p>“불의한 자가 하나님의 나라를 유업으로 받지 못할 줄을 알지 못하느냐 미혹을 받지 말라 음행하는 자나 우상 숭배하는 자나 간음하는 자나 탐색하는 자나 남색하는 자나 도적이나 탐욕을 부리는 자나 술 취하는 자나 모욕하는 자나 속여 빼앗는 자들은 <strong>하나님의 나라를 유업으로 받지 못하리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/6/#L9-10">고전 6:9-10</a>)</p></blockquote><blockquote><p>“너희도 정녕 이것을 알거니와 음행하는 자나 더러운 자나 탐하는 자 곧 우상 숭배자는 다 <strong>그리스도와 하나님의 나라에서 기업을 얻지 못하리니</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ef/5/#L5">엡 5:5</a>)</p></blockquote><blockquote><p>“그러나 두려워하는 자들과 믿지 아니하는 자들과 흉악한 자들과 살인자들과 음행하는 자들과 점술가들과 우상 숭배자들과 거짓말하는 모든 자들은 <strong>불과 유황으로 타는 못에 던져지리니</strong> 이것이 둘째 사망이라” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/21/#L8">계 21:8</a>)</p></blockquote><blockquote><p>“자기 두루마기를 빠는 자들은 복이 있으니 이는 그들이 생명나무에 나아가며 문들을 통하여 성에 들어갈 권세를 받으려 함이로다 개들과 점술가들과 음행하는 자들과 살인자들과 우상 숭배자들과 및 거짓말을 좋아하며 지어내는 자는 <strong>다 성 밖에 있으리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/22/#L14-15">계 22:14-15</a>)</p></blockquote><blockquote><p>“거짓 증인은 벌을 면하지 못할 것이요 <strong><mark>거짓말을 하는 자도 피하지 못하리라</mark></strong> &lt;…&gt; 거짓 증인은 벌을 면하지 못할 것이요 <strong><mark>거짓말을 뱉는 자는 망할 것이니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/pr/19/#L5,9">잠 19:5,9</a>)</p></blockquote><p>모든 죄는 사람이 살아 있어 회개하고 그리스도의 교회에 들어올 수 있는 동안 용서받을 수 있습니다. 사람은 몸으로 살아 있는 동안 행한 것에 따라 심판을 받습니다:</p><blockquote><p>“이는 우리가 다 반드시 그리스도의 심판대 앞에 나타나게 되어 각각 선악간에 <strong>그 몸으로 행한 것을</strong> 따라 받으려 함이라” (<a href="https://bibleox.com/ko/ko-nkrv/2kor/5/#L10">고후 5:10</a>)</p></blockquote>
