- src: грех-осуждение
  path: Jd4m_남을_판단하는_죄
  title: 남을 판단하는 죄
  copy_cover: true
  body: <p>주 예수 그리스도께서는 남을 판단하는 것을 금하십니다:</p><blockquote><p>“<strong>비판을 받지 아니하려거든 비판하지 말라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/7/#L1">마 7:1</a>)</p></blockquote><blockquote><p>“<strong>비판하지 말라</strong> 그리하면 너희가 비판을 받지 않을 것이요 <strong>정죄하지 말라</strong> 그리하면 너희가 정죄를 받지 않을 것이요 용서하라 그리하면 너희가 용서를 받을 것이요” (<a href="https://bibleox.com/ko/ko-nkrv/lk/6/#L37">눅 6:37</a>)</p></blockquote><p>이 말씀은 자기는 더 큰 죄로 가득하면서 남을 판단하는 이들에게 하신 것입니다:</p><blockquote><p>“보라 <strong>네 눈 속에 들보가 있는데</strong> 어찌하여 형제에게 말하기를 나로 네 눈 속에 있는 티를 빼게 하라 하겠느냐 외식하는 자여 <strong>먼저 네 눈 속에서 들보를 빼어라</strong> 그 후에야 밝히 보고 형제의 눈 속에서 티를 빼리라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/7/#L4-5">마 7:4-5</a>)</p></blockquote><p>그러면서 공의롭게 판단하라고 가르치십니다:</p><blockquote><p>“<strong>외모로 판단하지 말고 공의롭게 판단하라</strong> 하시니라” (<a href="https://bibleox.com/ko/ko-nkrv/in/7/#L24">요 7:24</a>)</p></blockquote><blockquote><p>“그러므로 어리석은 자가 되지 말고 오직 <strong>주의 뜻이 무엇인가 이해하라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ef/5/#L17">엡 5:17</a>)</p></blockquote><blockquote><p>“또 어찌하여 <strong>옳은 것을 스스로 판단하지 아니하느냐</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/lk/12/#L57">눅 12:57</a>)</p></blockquote><p>사도들은 판단이 필요하다고 말합니다:</p><blockquote><p>“밖에 있는 사람들을 판단하는 것이야 내게 무슨 상관이 있으리요마는 <strong>교회 안에 있는 사람들이야 너희가 판단하지 아니하랴</strong> 밖에 있는 사람들은 하나님이 심판하시려니와 이 악한 사람은 너희 중에서 내쫓으라” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/5/#L12-13">고전 5:12-13</a>)</p></blockquote><blockquote><p>“너희 중에 누가 다른 이와 더불어 다툼이 있는데 구태여 불의한 자들 앞에서 고발하고 성도 앞에서 하지 아니하느냐 <strong>성도가 세상을 판단할 것을</strong> 너희가 알지 못하느냐 세상도 너희에게 판단을 받겠거든 지극히 작은 일 판단하기를 감당하지 못하겠느냐 &lt;…&gt; 내가 너희를 부끄럽게 하려 하여 이 말을 하노니 너희 가운데 <strong>그 형제간의 일을 판단할 만한 지혜 있는 자가</strong> 이같이 하나도 없느냐” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/6/#L1-2,5">고전 6:1-2,5</a>)</p></blockquote>
  meta_desc: 남을 판단하는 죄에 관한 성경 구절
