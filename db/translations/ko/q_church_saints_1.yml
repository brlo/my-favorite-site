  title: 성물(거룩한 것들)
  copy_cover: true
  body: '<h2>신약의 성물</h2><h3>거룩한 성전</h3><p>예루살렘 성전은 참 성소의 형상이었습니다:</p><blockquote><p>“그리스도께서는 <strong><mark>인간이 하늘의 참 성소를 본떠서 만든 지상의 성소</mark></strong>에 들어 가신 것이 아니라 우리를 위해서 하느님 앞에 나타나시려고 바로 그 하늘의 성소에 들어 가신 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/evr/9/#L24">히브 9:24</a>)</p></blockquote><blockquote><p>“유다인들의 과월절이 가까와지자 예수께서는 예루살렘에 올라 가셨다. 그리고 <strong><mark>성전 뜰에서</mark></strong> 소와 양과 비둘기를 파는 장사꾼들과 환금상들이 앉아 있는 것을 보시고 밧줄로 채찍을 만들어 <strong>양과 소를 모두 쫓아내시고</strong> 환금상들의 돈을 쏟아 버리며 그 상을 둘러 엎으셨다. 그리고 비둘기 장수들에게 ‘이것들을 거두어 가라. <strong><mark>다시는 내 아버지의 집을 장사하는 집으로 만들지 말라</mark></strong>’하고 꾸짖으셨다.” (<a href="https://bibleox.com/ko/ko-ctb/in/2/#L13-16">요한 2:13-16</a>)</p></blockquote><blockquote><p>“<strong><mark>날마다 성전에서</mark></strong> 하느님을 찬미하며 지냈다.” (<a href="https://bibleox.com/ko/ko-ctb/lk/24/#L53">루가 24:53</a>)</p></blockquote><blockquote><p>“그리고 한 마음이 되어 <strong>날마다 열심히</strong> <strong><mark>성전에 모였으며</mark></strong> 집집마다 돌아 가며 빵을 나누고 순수한 마음으로 기쁘게 음식을 함께 먹으며” (<a href="https://bibleox.com/ko/ko-ctb/act/2/#L46">사도 2:46</a>)</p></blockquote><p>사도는 성전에서 기도하고, 거기서 그리스도께서 환시 중에 나타나십니다:</p><blockquote><p>“‘그 뒤 나는 예루살렘으로 돌아 왔습니다. 그런데 하루는 내가 <strong><mark>성전에서 기도하고 있을 때 무아지경에 빠져</mark></strong>” (<a href="https://bibleox.com/ko/ko-ctb/act/22/#L17">사도 22:17</a>)</p></blockquote><p>그리스도의 적(불법의 사람)은 하느님의 성전에 앉을 것입니다(분명히 그러려면 하느님의 성전이 있어야 합니다. 제우스의 신전도 페룬의 신전도 아닌 하느님의 성전입니다):</p><blockquote><p>“여러분은 아무에게도 절대로 속아 넘어가지 마십시오. 그날이 오기 전에 먼저 사람들이 하느님을 배반하게 될 것이며, 또 <strong>멸망할 운명을 지닌 악한 자</strong>가 나타날 것입니다. 그자는 <strong>사람들이 신으로 여기는 것이나 예배의 대상으로 삼는 모든 것에 대항하고 자기 자신을 그보다도 더 높이 올려 놓을 것입니다</strong>. 그뿐만 아니라 <strong><mark>하느님의 성전에 자리잡고 앉아서</mark></strong> 자기 자신을 하느님이라고 주장할 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/2sol/2/#L3-4">2데살 2:3-4</a>)</p></blockquote><h3>거룩한 곳</h3><p>듣는 이들은 거룩한 곳에서 무언가를 보아야 합니다:</p><blockquote><p>“‘그러므로 너희는 예언자 다니엘이 말한 대로 <strong>황폐의 상징인 흉측한 우상이</strong> <strong><mark>거룩한 곳에 선 것을</mark></strong> 보게 될 것이다. (독자는 알아 들으라)” (<a href="https://bibleox.com/ko/ko-ctb/mf/24/#L15">마태 24:15</a>)</p></blockquote><h3>거룩한 물건</h3><h4>성전과 제단은 여전히 거룩하며 거룩하게 합니다</h4><blockquote><p>“이 어리석고 눈먼 자들아, 어느 것이 더 중하냐? 황금이냐? 아니면 <strong><mark>그 황금을 거룩하게 만드는 성전</mark></strong>이냐! &lt;…&gt; 이 눈먼 자들아, 어느 것이 더 중하냐? 제물이냐? 아니면 <strong><mark>그 제물을 거룩하게 만드는 제단</mark></strong>이냐?” (<a href="https://bibleox.com/ko/ko-ctb/mf/23/#L17,19">마태 23:17,19</a>)</p></blockquote><h4>천사가 물을 통해 치유를 줍니다</h4><blockquote><p>“이따금 <strong>주님의 천사가</strong> 그 못에 내려 와 <strong><mark>물을 휘젓곤 하였는데 물이 움직일 때에 맨먼저 못에 들어 가는 사람은</mark></strong> <strong><mark>무슨 병이라도 다 나았던 것이다</mark></strong>.)” (<a href="https://bibleox.com/ko/ko-ctb/in/5/#L4">요한 5:4</a>)</p></blockquote><h4>사도들은 기름을 발라 병을 고쳤습니다</h4><blockquote><p>“열 두 제자를 불러 더러운 악령을 제어하는 권세를 주시고 둘씩 짝지어 파견하셨다. &lt;…&gt; 이 말씀을 듣고 열 두 제자는 나가서 사람들에게 회개하라고 가르치며 마귀들을 많이 쫓아내고 <strong><mark>수많은 병자들에게 기름을 발라 병을 고쳐 주었다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/mk/6/#L7,12-13">마르 6:7,12-13</a>)</p></blockquote><blockquote><p>“여러분 가운데 앓는 사람이 있으면 그 사람은 <strong>교회의 원로들을 청하십시오</strong>. 원로들은 <strong><mark>주님의 이름으로 그에게 기름을 바르고 그를 위하여 기도해 주어야 합니다</mark></strong>. 믿고 구하는 기도는 앓는 사람을 낫게 할 것이며 주님께서 그를 일으켜 주실 것입니다. 또 그가 지은 죄가 있으면 그 죄도 용서를 받을 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/iak/5/#L14-15">야고 5:14-15</a>)</p></blockquote><h4>그리스도의 피는 성물입니다</h4><blockquote><p>“모세의 율법을 무시한 자도 두 세 증인만 있으면 용서없이 사형을 받습니다. 그러니 <strong><mark>하느님의 아들을 짓밟고 자기를 거룩하게 해준 계약의 피를 더럽히고 은총의 성령을 모욕한 자가 받을 벌이야 얼마나 더 가혹하겠습니까</mark></strong>?” (<a href="https://bibleox.com/ko/ko-ctb/evr/10/#L28-29">히브 10:28-29</a>)</p></blockquote><h4>사람들은 사도가 남긴 옷에 닿아 나았습니다</h4><blockquote><p>“<strong><mark>바울로의 몸에 닿았던 수건이나 앞치마를 병자에게 대기만 해도 병이 낫고 악령들이 쫓겨 나갔다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/act/19/#L12">사도 19:12</a>)</p></blockquote><h4>그리스도의 적은 거룩한 것 위에 자신을 높일 것입니다</h4><p>분명히 거룩한 것 위에 자신을 높이려면 거룩한 것이 있어야 합니다:</p><blockquote><p>“여러분은 아무에게도 절대로 속아 넘어가지 마십시오. 그날이 오기 전에 먼저 사람들이 하느님을 배반하게 될 것이며, 또 <strong>멸망할 운명을 지닌 악한 자</strong>가 나타날 것입니다. 그자는 <strong>사람들이 신으로 여기는 것이나</strong> <strong><mark>예배의 대상으로 삼는 모든 것에 대항하고 자기 자신을 그보다도 더 높이 올려 놓을 것입니다</mark></strong>. 그뿐만 아니라 하느님의 성전에 자리잡고 앉아서 자기 자신을 하느님이라고 주장할 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/2sol/2/#L3-4">2데살 2:3-4</a>)</p></blockquote><h3>거룩한 형상</h3><h4>사람들은 사도의 그림자에서 치유를 기대했습니다</h4><blockquote><p>“사람들은 심지어 <strong>병자들을 길거리에 메고 나가</strong> 들것이나 요에 눕혀 놓고 <strong>베드로가 지나갈 때 행여나 그 그림자만이라도 그 몇 사람에게 스쳐 지나갔으면 하였다</strong>. 예루살렘 근방에 있는 여러 동네에서도 많은 사람들이 병자들과 악령이 들려 고생하는 사람들을 데리고 몰려 왔는데 <strong>그들의 병도 모두 고쳐졌다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/act/5/#L15-16">사도 5:15-16</a>)</p></blockquote><h3>거룩한 사람들(사제)</h3><h4>그리스도께서는 사도들에게만 나타나시고 그들에게만 권한을 주십니다</h4><blockquote><p>“예수께서 다시 ‘너희에게 평화가 있기를! 내 아버지께서 나를 보내 주신 것처럼 나도 너희를 보낸다’하고 말씀하셨다. 이렇게 말씀하신 다음 예수께서는 그들에게 <strong>숨을 내쉬시며</strong> 말씀을 계속하셨다. ‘<strong>성령을 받아라</strong>. <strong>누구의 죄든지 너희가 용서해 주면 그들의 죄는 용서받을 것이고 용서해 주지 않으면 용서받지 못한 채 남아 있을 것이다</strong>.’” (<a href="https://bibleox.com/ko/ko-ctb/in/20/#L21-23">요한 20:21-23</a>)</p></blockquote><blockquote><p>“나는 분명히 말한다. <strong>너희가 무엇이든지 땅에서 매면 하늘에도 매어 있을 것이며 땅에서 풀면 하늘에도 풀려 있을 것이다</strong>.‘” (<a href="https://bibleox.com/ko/ko-ctb/mf/18/#L18">마태 18:18</a>)</p></blockquote><h3>거룩한 예식과 성사</h3><p>(신약의) 성체성혈의 제사. 주님께서는 사도들에게만 이를 거행하는 법을 가르치십니다:</p><blockquote><p>“그들이 음식을 먹을 때에 예수께서 <strong><mark>빵을 들어 축복하시고 제자들에게 나누어 주시며 ‘받아 먹어라. 이것은 내 몸이다</mark></strong>’ 하시고 또 <strong><mark>잔을 들어 감사의 기도를 올리시고 그들에게 돌리시며 ‘너희는 모두 이 잔을 받아 마셔라. 이것은 나의 피다</mark></strong>. 죄를 용서해 주려고 많은 사람을 위하여 내가 흘리는 계약의 피다.” (<a href="https://bibleox.com/ko/ko-ctb/mf/26/#L26-28">마태 26:26-28</a>; <a href="https://bibleox.com/ko/ko-ctb/mk/14/#L22-24">마르 14:22-24</a>; <a href="https://bibleox.com/ko/ko-ctb/lk/22/#L19-20">루가 22:19-20</a>)</p></blockquote><blockquote><p>“또 <strong><mark>빵을 들어 감사 기도를 올리신 다음 그것을 떼어 제자들에게 주시며 ‘이것은 너희를 위하여 내어 주는 내 몸이다. 나를 기념하여 이 예식을 행하여라</mark></strong>’하고 말씀하셨다. 음식을 나눈 뒤에 <strong><mark>또 그와 같이 잔을 들어</mark></strong> ‘이것은 내 피로 맺는 새로운 계약의 잔이다. 나는 너희를 위하여 이 피를 흘리는 것이다’ 하셨다.” (<a href="https://bibleox.com/ko/ko-ctb/lk/22/#L19-20">루가 22:19-20</a>)</p></blockquote><p>그 뒤 나중에 회심한 사도 바울로에게 따로 같은 예식을 가르치십니다:</p><blockquote><p>“내가 여러분에게 전해 준 것은 <strong>주님께로부터 받은 것입니다</strong>. 곧 주 예수께서 잡히시던 날 밤에 <strong><mark>빵을 손에 드시고 감사의 기도를 드리신 다음</mark></strong> <strong><mark>빵을 떼시고</mark></strong> ‘<strong>이것은 너희들을 위하여 주는 내 몸이니</strong> <strong><mark>나를 기억하여 이 예를 행하여라</mark></strong>’하고 말씀하셨습니다. 또 <strong><mark>식후에 잔을 드시고</mark></strong> 감사의 기도를 드리신 다음 ‘<strong>이것은 내 피로 맺는 새로운 계약의 잔이니</strong> 마실 때마다 나를 기억하여 이 예를 행하여라’하고 말씀하셨습니다.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/11/#L23-25">1고린 11:23-25</a>)</p></blockquote><h3>기도와 함께하는 안수</h3><blockquote><p>“그래서 나는 다시 그대를 깨우쳐 줍니다. <strong><mark>내가 그대에게 안수했을 때에 하느님께서 그대에게 주신 그 은총의 선물</mark></strong>을 생생하게 간직하시오.” (<a href="https://bibleox.com/ko/ko-ctb/2tim/1/#L6">2디모 1:6</a>)</p></blockquote><blockquote><p>“<strong><mark>그대가 선물로 받은 그 거룩한 직무 곧 원로들이 그대에게 안수하며</mark></strong> 예언해 준 말씀을 통해서 그대에게 맡겨진 직무를 등한히 하지 마시오.” (<a href="https://bibleox.com/ko/ko-ctb/1tim/4/#L14">1디모 4:14</a>)</p></blockquote><blockquote><p>“그들이 단식을 하며 주님께 예배드리고 있을 때에 성령께서 ‘바르나바와 <strong><mark>사울</mark></strong>을 따로 세워라. 내가 그들에게 맡기기로 정해 놓은 일이 있다’하고 말씀하셨다. 그래서 그들은 다시 단식하며 기도를 하고 나서 <strong><mark>그들에게 안수를 해 주고</mark></strong> 떠나 보냈다.” (<a href="https://bibleox.com/ko/ko-ctb/act/13/#L2-3">사도 13:2-3</a>)</p></blockquote><blockquote><p>“사도들 앞에 내세웠다. 사도들은 기도하고 <strong><mark>그들에게 안수하였다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/act/6/#L6">사도 6:6</a>; <a href="https://bibleox.com/ko/ko-ctb/act/21/#L8">사도 21:8</a>)</p></blockquote><blockquote><p>“세례와 <strong><mark>안수</mark></strong>, 그리고 죽은 자들의 부활과 영원한 심판과 같은 <strong><mark>기초적인 교리</mark></strong>를 다시 배우는 일은 없도록 합시다.” (<a href="https://bibleox.com/ko/ko-ctb/evr/6/#L2">히브 6:2</a>)</p></blockquote><blockquote><p>“시몬은 <strong><mark>사도들이 손을 얹어 성령을 받게 하는 것을 보고</mark></strong> 사도들에게 돈을 내면서 나에게도 그런 권능을 주어 내가 손을 얹는 사람마다 성령을 받을 수 있게 해 주십시오‘하고 청하였다. 베드로는 이렇게 대답하였다. ’당신은 <strong>하느님의 선물</strong>을 돈으로 살 작정이오? 당신은 그 돈과 함께 망할 것이오.” (<a href="https://bibleox.com/ko/ko-ctb/act/8/#L18-20">사도 8:18-20</a>)</p></blockquote><blockquote><p>“그들은 주 예수의 이름으로 세례는 받았지만 아직 성령은 받지 못했던 것이다. 베드로와 요한이 <strong><mark>그들에게 손을 얹자 그들도 성령을 받게 되었다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/act/8/#L16-17">사도 8:16-17</a>)</p></blockquote><h3>은총을 주는 하느님의 선물</h3><blockquote><p>“그러자 베드로는 ‘나는 돈이 없습니다. 그러나 <strong><mark>내가 줄 수 있는 것은 이것입니다</mark></strong>. 나자렛 예수 그리스도의 이름으로 걸어 가시오’하며 그의 오른손을 잡아 일으켰다. 그러자 그 앉은뱅이는 당장에 다리와 발목에 힘을 얻어 벌떡 일어나 걷기 시작하였다. 그리고 그들과 함께 성전으로 들어 가면서 걷기도 하고 껑충껑충 뛰기도 하며 하느님을 찬양하였다.” (<a href="https://bibleox.com/ko/ko-ctb/act/3/#L6-8">사도 3:6-8</a>)</p></blockquote><h2>구약의 성물</h2><h3>거룩한 성전</h3><blockquote><p>“<strong>야훼께서 모세에게 말씀하셨다</strong>. 이스라엘 백성에게 일러 <strong>나에게 선물을 가져오라고</strong> 하여라. 누구든지 마음에 우러나서 가져오는 선물이면 받아 놓아라. &lt;…&gt; 내가 이 백성들 가운데서 살고자 하니 그들에게 <strong><mark>내가 있을 성소</mark></strong>를 지으라고 하여라. <strong><mark>내가 너에게 보여 주는 설계대로</mark></strong> 성소를 짓고 거기에서 쓸 기구들도 내가 보여 주는 도본에 따라 만들어라.” (<a href="https://bibleox.com/ko/ko-ctb/ish/25/#L1-2,8-9">출 25:1-2,8-9</a>) <em>(“성소”는 칠십인역 그리스어로 ἁγίασμα, “거룩한 것”입니다.)</em></p></blockquote><blockquote><p>“이제 네가 한 아들을 얻을 터인데, 그 아들은 태평을 누리게 될 것이다. 내가 사방에 있는 적들을 다 물리쳐 태평을 누리게 해 주리라. 그러니 그의 이름을 솔로몬이라고 하여라. 나는 그가 다스리는 동안 이스라엘에 번영과 평화를 내릴 것이다. 그가 바로 <strong>내 이름으로 불릴 성전을 지을 사람</strong>이다. 그는 나의 아들이 되고 나는 그의 아버지가 되어 줄 것이다. 나는 그가 이스라엘을 길이 다스리도록 그의 왕좌를 튼튼히 세워 주리라.‘” (<a href="https://bibleox.com/ko/ko-ctb/1par/22/#L9-10">역상 22:9-10</a>)</p></blockquote><blockquote><p>“당신의 크신 사랑만을 믿고 나는 당신 집에 왔사옵니다. 주님 두려워하는 마음으로 <strong><mark>당신의 거룩한 성전</mark></strong>을 <strong>향하여 엎드립니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/ps/5/#L7">시편 5:7</a>)</p></blockquote><h3>거룩한 곳</h3><blockquote><p>“하느님께서는 ‘이리로 가까이 오지 말아라. <strong><mark>네가 서 있는 것은 거룩한 땅이니</mark></strong> 네 발에서 신을 벗어라.’ 하시고는” (<a href="https://bibleox.com/ko/ko-ctb/ish/3/#L5">출 3:5</a>)</p></blockquote><blockquote><p>“야훼 군대의 총사령관이 지시하였다. ‘네 발에서 신을 벗어라. <strong><mark>네가 서 있는 곳은 거룩한 곳이다</mark></strong>.’ 여호수아는 그대로 하였다.” (<a href="https://bibleox.com/ko/ko-ctb/nav/5/#L15">여호 5:15</a>)</p></blockquote><blockquote><p>“또 너는 임직식 제물로 드린 수양 고기 가운데서 살코기를 가져다가 <strong><mark>거룩한 곳에서</mark></strong> 삶아라.” (<a href="https://bibleox.com/ko/ko-ctb/ish/29/#L31">출 29:31</a>)</p></blockquote><h3>거룩한 물건</h3><p>거룩한 기름(성유)은 성물입니다. 이 기름을 바른 성전과 성전의 모든 기물은 거룩합니다. 사람 가운데에서는 아론의 후손만 사제가 되도록 이 기름을 바를 수 있습니다:</p><blockquote><p>“너는 제일 좋은 향료를 이렇게 구해 들여라. 나무에서 나와 엉긴 몰약을 오백 세겔, 향기 좋은 육계향을 그 절반인 이백 오십 세겔, 향기 좋은 향초 줄거리를 이백 오십 세겔, 들계피를 성소 세겔로 오백 세겔, 그리고 올리브 기름 한 힌을 마련하여라. 이런 것들을 향 제조공이 하듯이 잘 섞어서 <strong><mark>성별하는 기름</mark></strong>을 만들어라. 이것이 성별하는 기름이다. <strong>만남의 장막과 증거궤에 이 기름을 발라</strong> 거룩하게 하여라. <strong>젯상</strong>과 그 모든 기구들, <strong>등잔대</strong>와 그 모든 기구들, <strong>분향단</strong>과 <strong>번제단</strong>과 그 모든 기구들, <strong>물두멍</strong>과 그 밑받침에 기름을 발라라. <strong><mark>너는 이렇게 이런 것들을 거룩하게 하여라. 그리하면 이것들이 가장 거룩한 것이 되어 거기 닿는 모든 것이 거룩해지리라</mark></strong>. 너는 <strong>아론과 그의 아들들에게 이 기름을 발라 주어</strong> 나를 섬기는 사제로 성별하여라. 너는 이스라엘 백성에게, ‘이 기름은 너희가 대대로 성별하는데에만 써야 한다.’ 고 일러 주어라. <strong>몸치장에 써서는 안 된다</strong>. 또 그런 배합법으로 똑같은 것을 만들어도 안된다. <strong><mark>그것은 거룩한 것이니 너희가 거룩하게 다루어야 한다</mark></strong>. 그런 식으로 섞어 향을 만들거나 그것을 아무에게나 발라 주는 자는 족보에서 제명당할 줄 알라고 일러 주어라.‘” (<a href="https://bibleox.com/ko/ko-ctb/ish/30/#L23-33">출 30:23-33</a>)</p></blockquote><p>제단은 지극히 거룩합니다:</p><blockquote><p>“그리고 성별하는 향유를 가져다가 성막과 그 안에 있는 모든 것에 발라 성막과 거기에 있는 모든 기구를 성별하여라. 그리하면 모든 것이 거룩하게 되리라. 번제단과 거기에 딸린 모든 기구에 기름을 발라라. 이렇게 제단을 성별하여라. 그러하면 <strong><mark>이 제단은 거룩한 것 가운데서도 가장 거룩한 것이 되리라</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/ish/40/#L9-10">출 40:9-10</a>)</p></blockquote><blockquote><p>“이레 동안 제단 위에 속죄제물을 올려 제단을 거룩하게 하여라. 그러면 <strong><mark>그 제단은 가장 거룩한 것이 되어</mark></strong> <strong>제단에 닿는 모든 것이 거룩해지리라</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/ish/29/#L37">출 29:37</a>)</p></blockquote><p><a href="https://bibleox.com/ru/ru/w/фимиам">향</a>(제단에서 사르는 향기로운 물질)은 지극히 거룩합니다:</p><blockquote><p>“야훼께서 모세에게 이르셨다. ‘향료 자료를 구하여라. 때죽나무와 향조껍질과 풍지향 등 향료 자료를 구하여 순수한 향과 같은 분량으로 하여 향 제조공이 하듯이 잘 섞은 다음 소금을 쳐서 <strong><mark>순수하고 거룩한 가루향</mark></strong>을 만들어라. 너는 그것을 조금씩 빻아서, 내가 너를 만나 대화하기로 정한 만남의 장막 안 증거궤 앞에 놓아 두어라. <strong><mark>이 향은 가장 거룩한 것으로 다루어야 한다</mark></strong>. 너는 향을 사사로이 쓰려고 같은 배합법으로 만들어서는 안 된다. 이것은 네가 <strong><mark>야훼를 섬기는 데 쓰는 거룩한 것</mark></strong>인 줄 알아야 한다. 냄새를 즐기려고 이것을 만드는 자는 족보에서 제명당할 줄 알아라.’” (<a href="https://bibleox.com/ko/ko-ctb/ish/30/#L34-38">출 30:34-38</a>)</p></blockquote><h3>거룩한 형상</h3><blockquote><p>“세공인 가운데서도 재주있는 사람들이 <strong><mark>성막을 만들었다</mark></strong>. 우선 가늘게 꼰 모시실과 자주빛 털실, 붉은 털실, 진홍색 털실로 <strong><mark>거룹 무늬를 놓아 가며 천 열 폭을 짰다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/ish/36/#L8">출 36:8</a>; <a href="https://bibleox.com/ko/ko-ctb/ish/26/#L1">출 26:1</a>)</p></blockquote><blockquote><p>“그리고 <strong>성별하는 향유를 가져다가</strong> <strong><mark>성막과 그 안에 있는 모든 것에 발라</mark></strong> 성막과 <strong><mark>거기에 있는 모든 기구를 성별하여라</mark></strong>. 그리하면 <strong><mark>모든 것이 거룩하게 되리라</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/ish/40/#L9">출 40:9</a>)</p></blockquote><h3>거룩한 사람들(사제)</h3><p><a href="https://bibleox.com/ru/ru/w/Таинство-Священства">사제</a>는 아론의 후손뿐입니다:</p><blockquote><p>“띠를 띠우고, 두건을 씌워 주어라. 법으로 정해 준 <strong>그들의 사제직은 영원한 것이다</strong>. 너는 이런 절차로 <strong>아론과 그의 아들들에게</strong> 일을 맡겨라.” (<a href="https://bibleox.com/ko/ko-ctb/ish/29/#L9">출 29:9</a>)</p></blockquote><p>사제직은 거룩한 옷과 함께 기름 부음으로 이어집니다:</p><blockquote><p>“아론의 자손 가운데 <strong>대를 이을 사람이 거룩한 아론의 옷을 이어 받아야 한다</strong>. 그는 이 옷을 입고 <strong>기름 붓는 의식을 거쳐 사제직을 맡아야 한다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/ish/29/#L29">출 29:29</a>)</p></blockquote><p>거룩한 봉사에 다가오는 외부인은 죽어야 했습니다. 사제직의 임무는 이를 지키는 것이었습니다:</p><blockquote><p>“너는 아론과 그의 아들들을 세워 사제 일을 맡아 보게 하여라. <strong>다른 사람이 나섰다가는 죽으리라</strong>.‘” (<a href="https://bibleox.com/ko/ko-ctb/chis/3/#L10">민 3:10</a>)</p></blockquote><h4>예언자 엘리사의 몸에 닿아 치유되었습니다</h4><blockquote><p>“한번은 어떤 사람들이 시체를 묻으려다가 그 강도떼들을 만나 시체를 엘리사의 무덤 속에 던지고 달아났다. 그런데 <strong>그 시체가 엘리사의 뼈에 닿자 다시 살아나서 일어섰다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/4ts/13/#L21">열하 13:21</a>)</p></blockquote><h3>거룩한 예식과 성사</h3><p>구약에는 매우 많은 예식이 있었습니다. 레위기에서 알 수 있습니다. 예를 들어 대사제 임명 예식: <a href="https://bibleox.com/ru/ru/w/ветхозаветный-священник">구약의 사제</a>.</p><p>(구약의) 성체성혈 제사의 예표:</p><p><a href="https://bibleox.com/ru/ru/w/Евхаристия">성체성혈성사</a></p><h3>기도와 함께하는 안수</h3><h4>야곱이 손자들을 축복합니다</h4><p>야곱은 기도하며 손자들에게 손을 얹어 축복했습니다:</p><blockquote><p>“그러자 이스라엘은 손을 엇갈리게 내밀어 아우인 <strong><mark>에브라임의 머리에는 오른손을</mark></strong>, 맏아들인 <strong><mark>므나쎄의 머리에는 왼손을 얹고</mark></strong> 이렇게 <strong><mark>복을 빌어 주었다</mark></strong>. ‘나의 조상 아브라함과 이사악이 살아 가는 것을 지켜 보아 주신 하느님, 태어날 때부터 이날까지 나의 목자가 되어 주신 하느님, 온갖 어려움에서 나를 건져 내준 <strong><mark>하느님의 천사가 이 아이들에게 복을 내려 주시기를 빕니다</mark></strong>. 나의 이름과 조상들의 이름 아브라함과 이사악이 이 아이들에게 살아 있기를. 이 세상 한복판에서 왕성하게 불어나기를 빕니다.’” (<a href="https://bibleox.com/ko/ko-ctb/gen/48/#L14-16">창 48:14-16</a>)</p></blockquote><h4>모세가 눈의 아들 여호수아를 직무에 세웁니다</h4><p>하느님께서는 예언자 모세에게 안수로 눈의 아들 여호수아를 직무에 세우라고 명하셨습니다:</p><blockquote><p>“<strong><mark>야훼께서 모세에게 대답하셨다</mark></strong>. ‘<strong><mark>눈의 아들 여호수아는</mark></strong> 정기가 있는 사람이니 <strong><mark>그를 데려다가 손을 얹어라</mark></strong>. &lt;…&gt; 모세는 야훼께서 분부하신 대로 하였다. 그는 여호수아를 불러 내어 엘르아잘 사제와 온 회중 앞에 세운 다음 야훼께서 분부하신 대로 <strong><mark>그에게 손을 얹어 임관식을 치렀다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/chis/27/#L18,22-23">민 27:18,22-23</a>)</p></blockquote><h4>레위인을 직무에 세우는 방식</h4><p>하느님께서는 레위인들을 안수로 성소의 봉사에 세우라고 명하셨습니다:</p><blockquote><p>“네가 레위인들을 야훼 앞에 나서게 하면, 이스라엘 백성이 <strong><mark>레위인들에게 손을 얹을 것이다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/chis/8/#L10">민 8:10</a>)</p></blockquote><h2>비판</h2><h3>하느님께서는 사람의 손으로 지은 성전에 사시지 않는다</h3><p>성전에 반대하는 교회 비판자들은 이 구절을 듭니다:</p><blockquote><p>“다윗은 하느님의 은총을 입은 사람으로서 야곱의 후손을 위하여 성전을 짓게 해 달라고 간구하였지만 성전을 지은 사람은 솔로몬이었습니다. 그러나 <strong>지극히 높으신 분은 사람의 손으로 지은 집에는 사시지 않습니다</strong>. 예언자는 이렇게 말하고 있습니다. 주님의 말씀을 들어라. 하늘은 나의 옥좌요, 땅은 나의 발판이다. 그러니 너희가 나를 위하여 어떤 집을 지어 줄 것이며 내가 쉴 곳이 어디냐?” (<a href="https://bibleox.com/ko/ko-ctb/act/7/#L46-49">사도 7:46-49</a>)</p></blockquote><p>그러나 이것은 결코 성전에 반대되는 증언이 아닙니다. 다윗이 하느님을 위해 집(성전)을 지으려 했을 때, 하느님께서는 이미 예언자 모세에게 성막을 짓고 축성하고 사제를 세우고 예식을 지키고 성물(궤)을 두라고 명하셨고, 하느님께서 세우신 질서를 어기면 사형에 처하도록 정하셨기 때문입니다. 이 구절은 하느님께서 성전에만 계시지 않고 어디에나 계심을 설명할 뿐입니다. 성전은 사람이 아니라 하느님 자신이 세우신 것이며, 이교도에게서 빌려 온 것이 결코 아닙니다.</p><h2>참고</h2><h3>거룩한 것에 대항하고 자신을 높이는 것은 그리스도의 적의 표지 가운데 하나입니다</h3><blockquote><p>“여러분은 아무에게도 절대로 속아 넘어가지 마십시오. 그날이 오기 전에 먼저 사람들이 하느님을 배반하게 될 것이며, 또 <strong><mark>멸망할 운명을 지닌 악한 자</mark></strong>가 나타날 것입니다. 그자는 <strong><mark>사람들이 신으로 여기는 것이나 예배의 대상으로 삼는 모든 것에 대항하고 자기 자신을 그보다도 더 높이 올려 놓을 것입니다</mark></strong>. 그뿐만 아니라 하느님의 성전에 자리잡고 앉아서 자기 자신을 하느님이라고 주장할 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/2sol/2/#L3-4">2데살 2:3-4</a>)</p></blockquote><blockquote><p>“어린 자녀들이여, 마지막 때가 왔습니다. 여러분은 그리스도의 적이 오리라는 말을 들어 왔는데 <strong><mark>벌써 그리스도의 적들이 많이 나타났습니다</mark></strong>. 그러니 마지막 때가 왔다는 것이 분명합니다.” (<a href="https://bibleox.com/ko/ko-ctb/1in/2/#L18">1요한 2:18</a>)</p></blockquote><h3>짐승은 하늘에 사는 이들을 모독할 것입니다</h3><blockquote><p>“그래서 그 짐승은 하느님을 모독하기 시작했고 하느님의 이름과 하느님의 집을 모독했으며 <strong><mark>하늘에서 사는 자들에게 욕설을 퍼부었습니다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/otkr/13/#L6">묵시 13:6</a>)</p></blockquote><h3>의인들의 영혼과 천사들은 하늘에 삽니다</h3><blockquote><p>“그러나 <strong><mark>여러분이 와 있는 곳은</mark></strong> 시온산이고 살아 계신 하느님의 도성이며 <strong><mark>하늘의 예루살렘입니다. 거기에는 수많은 천사들이 있고</mark></strong>, 잔치가 벌어져 있고 또 <strong>하늘에 등록된 장자들의 교회</strong>가 있고 만민의 심판자이신 하느님이 계시고 <strong><mark>완전히 올바른 사람들의 영혼</mark></strong>이 있습니다.” (<a href="https://bibleox.com/ko/ko-ctb/evr/12/#L22-23">히브 12:22-23</a>)</p></blockquote>'
