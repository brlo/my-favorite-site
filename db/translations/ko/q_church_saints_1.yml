  title: 은총
  copy_cover: true
  body: '<h2>정의</h2><p><strong>은총(고대 그리스어 χάρις, 히브리어 חֵ֣ן)</strong>은 주된 뜻으로, 사람의 구원을 위해 사람에게 작용하는 하느님의 힘입니다.[1]</p><ol><li><p><strong>하느님의 힘, 하느님의 활동</strong> (<a href="https://bibleox.com/ko/ko-nkrv/1kor/15/#L10">고전 15:10</a> — “내가 오늘의 내가 된 것은 하느님의 은총의 덕입니다” — χάριτι δὲ θεοῦ εἰμι ὅ εἰμι, καὶ ἡ χάρις αὐτοῦ ἡ εἰς ἐμὲ οὐ κενὴ ἐγενήθη, ἀλλὰ περισσότερον αὐτῶν πάντων ἐκοπίασα, οὐκ ἐγὼ δὲ ἀλλὰ ἡ χάρις τοῦ θεοῦ [ἡ] σὺν ἐμοί);</p></li><li><p><strong>자비, 호의, 선물, 어떤 이에 대한 은혜와 사랑</strong> (<a href="https://bibleox.com/ko/ko-nkrv/gen/18/#L3">창 18:3</a> — ἄρα εὗρον χάριν ἐναντίον σου), (<a href="https://bibleox.com/ko/ko-nkrv/sud/6/#L17">삿 6:17</a> — εἰ εὗρον χάριν ἐν ὀφθαλμοῖς σου), (<a href="https://bibleox.com/ko/ko-nkrv/1ts/16/#L22">삼상 16:22</a> — εὗρεν χάριν ἐν ὀφθαλμοῖς μου), (<a href="https://bibleox.com/ko/ko-nkrv/3ts/11/#L19">왕상 11:19</a> — καὶ εὗρεν Αδερ χάριν ἐναντίον Φαραω), (<a href="https://bibleox.com/ko/ko-nkrv/act/2/#L47">행 2:47</a> — ἔχοντες χάριν πρὸς ὅλον τὸν λαόν), (<a href="https://bibleox.com/ko/ko-nkrv/act/7/#L46">행 7:46</a> — ὃς εὗρεν χάριν ἐνώπιον τοῦ θεοῦ), (<a href="https://bibleox.com/ko/ko-nkrv/1kor/16/#L3">고전 16:3</a> — ἀπενεγκεῖν τὴν χάριν ὑμῶν εἰς Ἰερουσαλήμ);</p></li><li><p><strong>하느님께 드리는 감사, 하느님 마음에 듦</strong> (<a href="https://bibleox.com/ko/ko-nkrv/2kor/9/#L15">고후 9:15</a> — χάρις τῷ θεῷ ἐπὶ τῇ ἀνεκδιηγήτῳ αὐτοῦ δωρεᾷ), (<a href="https://bibleox.com/ko/ko-nkrv/1pet/2/#L19">벧전 2:19</a> — τοῦτο γὰρ χάρις εἰ διὰ συνείδησιν θεοῦ ὑποφέρει τις λύπας);</p></li><li><p><strong>아름다움</strong> (<a href="https://bibleox.com/ko/ko-nkrv/pr/5/#L19">잠 5:19</a> — πῶλος σῶν χαρίτων), (<a href="https://bibleox.com/ko/ko-nkrv/pr/3/#L22">잠 3:22</a> — χάρις ᾖ περὶ σῷ τραχήλῳ);</p></li><li><p><strong>귀한 것</strong> (<a href="https://bibleox.com/ko/ko-nkrv/pr/17/#L8">잠 17:8</a> — אֶֽבֶן ־ חֵן), (<a href="https://bibleox.com/ko/ko-nkrv/ekl/10/#L12">전 10:12</a> — λόγοι στόματος σοφοῦ χάρις), (<a href="https://bibleox.com/ko/ko-nkrv/ps/45/#L2">시 45:2</a> — ἐξεχύθη χάρις ἐν χείλεσίν σου);</p></li><li><p><strong>영예, 존경, 영광</strong> (<a href="https://bibleox.com/ko/gr-lxx-byz/iudf/8/#L23">유딧 8:23</a> — κατευθυνθήσεται ἡ δουλεία ἡμῶν εἰς χάριν)</p></li></ol><h2>부르시는 은총의 활동</h2><blockquote><p>“<strong><mark>그리스도의 은혜로 너희를 부르신 이를</mark></strong> 이같이 속히 떠나 다른 복음을 따르는 것을 내가 이상하게 여기노라” (<a href="https://bibleox.com/ko/ko-nkrv/gal/1/#L6">갈 1:6</a>)</p></blockquote><blockquote><p>“그러나 <strong>내 어머니의 태로부터</strong> 나를 택정하시고 <strong><mark>그의 은혜로 나를 부르신 이가</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gal/1/#L15">갈 1:15</a>)</p></blockquote><h2>하느님의 선물인 은총</h2><blockquote><p>“<strong><mark>주 예수 그리스도의 은혜가 너희와 함께 하고</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/16/#L23">고전 16:23</a>)</p></blockquote><blockquote><p>“<strong>하나님 우리 아버지와</strong> 주 예수 그리스도로부터 <strong><mark>은혜와 평강이 있기를</mark></strong> 원하노라” (<a href="https://bibleox.com/ko/ko-nkrv/2kor/1/#L2">고후 1:2</a>)</p></blockquote><blockquote><p>“오직 <strong><mark>성령이 너희에게 임하시면 너희가 권능을 받고</mark></strong> 예루살렘과 온 유대와 사마리아와 땅 끝까지 이르러 내 증인이 되리라 하시니라” (<a href="https://bibleox.com/ko/ko-nkrv/act/1/#L8">행 1:8</a>)</p></blockquote><blockquote><p>“<strong><mark>나를 능하게 하신</mark></strong> 그리스도 예수 우리 주께 내가 감사함은 나를 충성되이 여겨 내게 직분을 맡기심이니” (<a href="https://bibleox.com/ko/ko-nkrv/1tim/1/#L12">딤전 1:12</a>)</p></blockquote><blockquote><p>“이 복음을 위하여 <strong><mark>그의 능력이 역사하시는 대로 내게 주신 하나님의 은혜의 선물을 따라</mark></strong> 내가 일꾼이 되었노라” (<a href="https://bibleox.com/ko/ko-nkrv/ef/3/#L7">엡 3:7</a>)</p></blockquote><blockquote><p>“<strong><mark>우리 각 사람에게 그리스도의 선물의 분량대로 은혜를 주셨나니</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ef/4/#L7">엡 4:7</a>)</p></blockquote><blockquote><p>“또 그들이 너희를 위하여 간구하며 <strong><mark>하나님이 너희에게 주신 지극한 은혜</mark></strong>로 말미암아 너희를 사모하느니라” (<a href="https://bibleox.com/ko/ko-nkrv/2kor/9/#L14">고후 9:14</a>)</p></blockquote><blockquote><p>“<strong><mark>하나님이 능히 모든 은혜를 너희에게 넘치게 하시나니</mark></strong> 이는 너희로 모든 일에 항상 모든 것이 넉넉하여 모든 착한 일을 넘치게 하게 하려 하심이라” (<a href="https://bibleox.com/ko/ko-nkrv/2kor/9/#L8">고후 9:8</a>)</p></blockquote><blockquote><p>“여러 계시를 받은 것이 지극히 크므로 너무 자만하지 않게 하시려고 내 육체에 가시 곧 사탄의 사자를 주셨으니 이는 나를 쳐서 너무 자만하지 않게 하려 하심이라 이것이 내게서 떠나가게 하기 위하여 내가 세 번 주께 간구하였더니 나에게 이르시기를 <strong><mark>내 은혜가 네게 족하도다 이는 내 능력이 약한 데서 온전하여짐이라</mark></strong> 하신지라 그러므로 도리어 크게 기뻐함으로 나의 여러 약한 것들에 대하여 자랑하리니 이는 <strong><mark>그리스도의 능력이 내게 머물게 하려 함이라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2kor/12/#L7-9">고후 12:7-9</a>) <em>(“은혜”: χάρις, “능력”: δύναμις)</em></p></blockquote><blockquote><p>“우리가 하나님과 함께 일하는 자로서 너희를 권하노니 <strong><mark>하나님의 은혜를 헛되이 받지 말라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2kor/6/#L1">고후 6:1</a>)</p></blockquote><blockquote><p>“그러나 내가 나 된 것은 하나님의 은혜로 된 것이니 <strong><mark>내게 주신 그의 은혜가 헛되지 아니하여</mark></strong> 내가 모든 사도보다 <strong>더 많이 수고하였으나</strong> <strong><mark>내가 한 것이 아니요 오직 나와 함께 하신 하나님의 은혜로라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/15/#L10">고전 15:10</a>)</p></blockquote><blockquote><p>“베드로가 이르되 너희가 회개하여 각각 예수 그리스도의 이름으로 세례를 받고 죄 사함을 받으라 그리하면 <strong><mark>성령의 선물을 받으리니</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/act/2/#L38">행 2:38</a>)</p></blockquote><blockquote><p>“우리를 너희와 함께 그리스도 안에서 굳건하게 하시고 우리에게 기름을 부으신 이는 하나님이시니 그가 또한 우리에게 인치시고 <strong><mark>보증으로 우리 마음에 성령을 주셨느니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2kor/1/#L21-22">고후 1:21-22</a>)</p></blockquote><blockquote><p>“만일 <strong><mark>너희 속에 하나님의 영이 거하시면</mark></strong> 너희가 육신에 있지 아니하고 영에 있나니 누구든지 그리스도의 영이 없으면 그리스도의 사람이 아니라” (<a href="https://bibleox.com/ko/ko-nkrv/rim/8/#L9">롬 8:9</a>)</p></blockquote><blockquote><p>“너희는 너희가 하나님의 성전인 것과 <strong>하나님의 성령이 너희 안에 계시는 것</strong>을 알지 못하느냐” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/3/#L16">고전 3:16</a>)</p></blockquote><blockquote><p>“너희는 다시 무서워하는 종의 영을 받지 아니하고 <strong><mark>양자의 영을 받았으므로 우리가 아빠 아버지라고 부르짖느니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/rim/8/#L15">롬 8:15</a>)</p></blockquote><blockquote><p>“너희가 아들이므로 <strong><mark>하나님이 그 아들의 영을 우리 마음 가운데 보내사</mark></strong> <strong><mark>아빠 아버지</mark></strong>라 부르게 하셨느니라” (<a href="https://bibleox.com/ko/ko-nkrv/gal/4/#L6">갈 4:6</a>)</p></blockquote><blockquote><p>“너희는 <strong><mark>주께 받은 바 기름 부음이 너희 안에 거하나니</mark></strong> 아무도 너희를 가르칠 필요가 없고 오직 <strong><mark>그의 기름 부음이 모든 것을 너희에게 가르치며</mark></strong> 또 참되고 거짓이 없으니 너희를 가르치신 그대로 주 안에 거하라” (<a href="https://bibleox.com/ko/ko-nkrv/1in/2/#L27">요일 2:27</a>)</p></blockquote><blockquote><p>“우리가 하나님과 함께 일하는 자로서 너희를 권하노니 <strong><mark>하나님의 은혜를 헛되이 받지 말라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2kor/6/#L1">고후 6:1</a>)</p></blockquote><blockquote><p>“하나님의 성전과 우상이 어찌 일치가 되리요 우리는 살아 계신 하나님의 성전이라 이와 같이 하나님께서 이르시되 <strong><mark>내가 그들 가운데 거하며 두루 행하여</mark></strong> 나는 그들의 하나님이 되고 그들은 나의 백성이 되리라” (<a href="https://bibleox.com/ko/ko-nkrv/2kor/6/#L16">고후 6:16</a>)</p></blockquote><blockquote><p>“예수께서 대답하여 이르시되 사람이 나를 사랑하면 내 말을 지키리니 내 아버지께서 그를 사랑하실 것이요 <strong><mark>우리가 그에게 가서 거처를 그와 함께 하리라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/in/14/#L23">요 14:23</a>)</p></blockquote><blockquote><p>“여러 가지 다른 교훈에 끌리지 말라 <strong><mark>마음은 은혜로써 굳게 함이 아름답고</mark></strong> 음식으로써 할 것이 아니니 음식으로 말미암아 행한 자는 유익을 얻지 못하였느니라” (<a href="https://bibleox.com/ko/ko-nkrv/evr/13/#L9">히 13:9</a>)</p></blockquote><blockquote><p>“그러므로 우리가 흔들리지 않는 나라를 받았은즉 <strong><mark>은혜를 받자</mark></strong> 이로 말미암아 경건함과 두려움으로 하나님을 기쁘시게 섬길지니” (<a href="https://bibleox.com/ko/ko-nkrv/evr/12/#L28">히 12:28</a>)</p></blockquote><blockquote><p>“사람들이 예수께서 <strong>만져 주심을 바라고</strong> <strong>어린 아이들을 데리고 오매</strong> 제자들이 꾸짖거늘 예수께서 보시고 노하시어 이르시되 어린 아이들이 내게 오는 것을 용납하고 금하지 말라 하나님의 나라가 이런 자의 것이니라 &lt;…&gt; <strong>그 어린 아이들을 안고</strong> <strong><mark>그들 위에 안수하시고 축복하시니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mk/10/#L13-14,16">막 10:13-14,16</a>)</p></blockquote><blockquote><p>“예수께서 그들을 데리고 베다니 앞까지 나가사 <strong><mark>손을 들어 그들에게 축복하시더니</mark></strong> 축복하실 때에 그들을 떠나” (<a href="https://bibleox.com/ko/ko-nkrv/lk/24/#L50-51">눅 24:50-51</a>)</p></blockquote><h2>사람을 통한 은총의 활동</h2><blockquote><p>“그러므로 내가 그리스도 예수 안에서 하나님의 일에 대하여 자랑하는 것이 있거니와 <strong><mark>그리스도께서 이방인들을 순종하게 하기 위하여 나를 통하여 역사하신 것 외에는</mark></strong> 내가 감히 말하지 아니하노라 그 일은 말과 행위로 <strong>표적과 기사의 능력으로</strong> <strong><mark>성령의 능력으로</mark></strong> 이루어졌으며 그리하여 내가 예루살렘으로부터 두루 행하여 일루리곤까지 그리스도의 복음을 편만하게 전하였노라” (<a href="https://bibleox.com/ko/ko-nkrv/rim/15/#L17-19">롬 15:17-19</a>) <em>(“능력”: δύναμις)</em></p></blockquote><blockquote><p>“그러므로 내가 <strong><mark>나의 안수함으로</mark></strong> 네 속에 있는 <strong><mark>하나님의 은사</mark></strong>를 다시 불일듯 하게 하기 위하여 너로 생각하게 하노니” (<a href="https://bibleox.com/ko/ko-nkrv/2tim/1/#L6">딤후 1:6</a>)</p></blockquote><p>그들은 민족들을 복종으로 이끌려고 은총을 받았습니다:</p><blockquote><p>“그로 말미암아 우리가 <strong><mark>은혜와</mark></strong> <strong>사도의 직분을</strong> 받아 그의 이름을 위하여 <strong><mark>모든 이방인 중에서 믿어 순종하게 하나니</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/rim/1/#L5">롬 1:5</a>)</p></blockquote><blockquote><p>“무릇 더러운 말은 너희 입 밖에도 내지 말고 오직 <strong>덕을 세우는 데 소용되는 대로 선한 말을 하여</strong> <strong>듣는 자들에게 은혜를 끼치게 하라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ef/4/#L29">엡 4:29</a>)</p></blockquote><blockquote><p>“<strong>너희 말을 항상 은혜 가운데서 소금으로 맛을 냄과 같이 하라</strong> 그리하면 각 사람에게 마땅히 대답할 것을 알리라” (<a href="https://bibleox.com/ko/ko-nkrv/kol/4/#L6">골 4:6</a>)</p></blockquote><h2>은총은 겸손한 이에게 주어집니다</h2><blockquote><p>“진실로 그는 거만한 자를 비웃으시며 <strong><mark>겸손한 자에게 은혜를 베푸시나니</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/pr/3/#L34">잠 3:34</a>)</p></blockquote><blockquote><p>“그러나 더욱 큰 은혜를 주시나니 그러므로 일렀으되 하나님이 교만한 자를 물리치시고 <strong><mark>겸손한 자에게 은혜를 주신다</mark></strong> 하였느니라” (<a href="https://bibleox.com/ko/ko-nkrv/iak/4/#L6">약 4:6</a>)</p></blockquote><blockquote><p>“젊은 자들아 이와 같이 장로들에게 순종하고 다 서로 겸손으로 허리를 동이라 하나님은 교만한 자를 대적하시되 <strong><mark>겸손한 자들에게는 은혜를 주시느니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1pet/5/#L5">벧전 5:5</a>)</p></blockquote><h2>은총을 일깨워야 합니다</h2><blockquote><p>“그러므로 내가 <strong><mark>나의 안수함으로 네 속에 있는 하나님의 은사를 다시 불일듯 하게 하기 위하여</mark></strong> 너로 생각하게 하노니” (<a href="https://bibleox.com/ko/ko-nkrv/2tim/1/#L6">딤후 1:6</a>)</p></blockquote>'
