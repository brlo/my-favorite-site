  title: 성물(거룩한 것들)
  copy_cover: true
  body: '<h2>신약의 성물</h2><h3>거룩한 성전</h3><p>예루살렘 성전은 참 성소의 형상이었습니다:</p><blockquote><p>“그리스도께서는 <strong><mark>참 것의 그림자인 손으로 만든 성소</mark></strong>에 들어가지 아니하시고 바로 그 하늘에 들어가사 이제 우리를 위하여 하나님 앞에 나타나시고” (<a href="https://bibleox.com/ko/ko-nkrv/evr/9/#L24">히 9:24</a>)</p></blockquote><blockquote><p>“유대인의 유월절이 가까운지라 예수께서 예루살렘으로 올라가셨더니 <strong><mark>성전 안에서</mark></strong> 소와 양과 비둘기 파는 사람들과 돈 바꾸는 사람들이 앉아 있는 것을 보시고 노끈으로 채찍을 만드사 <strong>양이나 소를 다 성전에서 내쫓으시고</strong> 돈 바꾸는 사람들의 돈을 쏟으시며 상을 엎으시고 비둘기 파는 사람들에게 이르시되 이것을 여기서 가져가라 <strong><mark>내 아버지의 집으로 장사하는 집을 만들지 말라</mark></strong> 하시니” (<a href="https://bibleox.com/ko/ko-nkrv/in/2/#L13-16">요 2:13-16</a>)</p></blockquote><blockquote><p>“<strong><mark>늘 성전에서</mark></strong> 하나님을 찬송하니라” (<a href="https://bibleox.com/ko/ko-nkrv/lk/24/#L53">눅 24:53</a>)</p></blockquote><blockquote><p>“<strong>날마다 마음을 같이하여</strong> <strong><mark>성전에 모이기를 힘쓰고</mark></strong> 집에서 떡을 떼며 기쁨과 순전한 마음으로 음식을 먹고” (<a href="https://bibleox.com/ko/ko-nkrv/act/2/#L46">행 2:46</a>)</p></blockquote><p>사도는 성전에서 기도하고, 거기서 그리스도께서 환시 중에 나타나십니다:</p><blockquote><p>“후에 내가 예루살렘으로 돌아와서 <strong><mark>성전에서 기도할 때에 황홀한 중에</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/act/22/#L17">행 22:17</a>)</p></blockquote><p>그리스도의 적(불법의 사람)은 하느님의 성전에 앉을 것입니다(분명히 그러려면 하느님의 성전이 있어야 합니다. 제우스의 신전도 페룬의 신전도 아닌 하느님의 성전입니다):</p><blockquote><p>“누가 어떻게 하여도 너희가 미혹되지 말라 먼저 배교하는 일이 있고 저 <strong>불법의 사람 곧 멸망의 아들</strong>이 나타나기 전에는 그 날이 이르지 아니하리니 그는 대적하는 자라 <strong>신이라고 불리는 모든 것과 숭배함을 받는 것에 대항하여 그 위에 자기를 높이고</strong> <strong><mark>하나님의 성전에 앉아</mark></strong> 자기를 하나님이라고 내세우느니라” (<a href="https://bibleox.com/ko/ko-nkrv/2sol/2/#L3-4">살후 2:3-4</a>)</p></blockquote><h3>거룩한 곳</h3><p>듣는 이들은 거룩한 곳에서 무언가를 보아야 합니다:</p><blockquote><p>“그러므로 너희가 선지자 다니엘이 말한 바 <strong>멸망의 가증한 것이</strong> 거룩한 곳에 선 것을 보거든 (읽는 자는 깨달을진저)” (<a href="https://bibleox.com/ko/ko-nkrv/mf/24/#L15">마 24:15</a>)</p></blockquote><h3>거룩한 물건</h3><h4>성전과 제단은 여전히 거룩하며 거룩하게 합니다</h4><blockquote><p>“어리석은 맹인들이여 어느 것이 크냐 그 금이냐 <strong><mark>그 금을 거룩하게 하는 성전</mark></strong>이냐 &lt;…&gt; 맹인들이여 어느 것이 크냐 그 예물이냐 <strong><mark>그 예물을 거룩하게 하는 제단</mark></strong>이냐” (<a href="https://bibleox.com/ko/ko-nkrv/mf/23/#L17,19">마 23:17,19</a>)</p></blockquote><h4>천사가 물을 통해 치유를 줍니다</h4><blockquote><p>“이는 <strong>천사가 가끔 못에 내려와</strong> <strong><mark>물을 움직이게 하는데 움직인 후에 먼저 들어가는 자는 어떤 병에 걸렸든지 낫게 됨이러라</mark></strong>]” (<a href="https://bibleox.com/ko/ko-nkrv/in/5/#L4">요 5:4</a>) <em>(개역개정은 3절 끝부분과 이 절을 대괄호 안에 넣었습니다. 대괄호는 일부 고대 사본에 없는 본문이라는 표시입니다. 비잔틴 본문(다수 사본)에는 이 절이 있습니다.)</em></p></blockquote><h4>사도들은 기름을 발라 병을 고쳤습니다</h4><blockquote><p>“열두 제자를 부르사 둘씩 둘씩 보내시며 더러운 귀신을 제어하는 권능을 주시고 &lt;…&gt; 제자들이 나가서 회개하라 전파하고 많은 귀신을 쫓아내며 <strong><mark>많은 병자에게 기름을 발라 고치더라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mk/6/#L7,12-13">막 6:7,12-13</a>)</p></blockquote><blockquote><p>“너희 중에 병든 자가 있느냐 그는 <strong>교회의 장로들을 청할 것이요</strong> 그들은 <strong><mark>주의 이름으로 기름을 바르며 그를 위하여 기도할지니라</mark></strong> 믿음의 기도는 병든 자를 구원하리니 주께서 그를 일으키시리라 혹시 죄를 범하였을지라도 사하심을 받으리라” (<a href="https://bibleox.com/ko/ko-nkrv/iak/5/#L14-15">약 5:14-15</a>)</p></blockquote><h4>그리스도의 피는 성물입니다</h4><blockquote><p>“모세의 법을 폐한 자도 두세 증인으로 말미암아 불쌍히 여김을 받지 못하고 죽었거든 하물며 <strong><mark>하나님의 아들을 짓밟고 자기를 거룩하게 한 언약의 피를 부정한 것으로 여기고 은혜의 성령을 욕되게 하는 자가 당연히 받을 형벌은 얼마나 더 무겁겠느냐</mark></strong> 너희는 생각하라” (<a href="https://bibleox.com/ko/ko-nkrv/evr/10/#L28-29">히 10:28-29</a>)</p></blockquote><h4>사람들은 사도가 남긴 옷에 닿아 나았습니다</h4><blockquote><p>“심지어 사람들이 <strong><mark>바울의 몸에서 손수건이나 앞치마를 가져다가 병든 사람에게 얹으면 그 병이 떠나고 악귀도 나가더라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/act/19/#L12">행 19:12</a>)</p></blockquote><h4>그리스도의 적은 거룩한 것 위에 자신을 높일 것입니다</h4><p>분명히 거룩한 것 위에 자신을 높이려면 거룩한 것이 있어야 합니다:</p><blockquote><p>“누가 어떻게 하여도 너희가 미혹되지 말라 먼저 배교하는 일이 있고 저 <strong>불법의 사람 곧 멸망의 아들</strong>이 나타나기 전에는 그 날이 이르지 아니하리니 그는 대적하는 자라 <strong>신이라고 불리는 모든 것과</strong> <strong><mark>숭배함을 받는 것에 대항하여 그 위에 자기를 높이고</mark></strong> 하나님의 성전에 앉아 자기를 하나님이라고 내세우느니라” (<a href="https://bibleox.com/ko/ko-nkrv/2sol/2/#L3-4">살후 2:3-4</a>)</p></blockquote><h3>거룩한 형상</h3><h4>사람들은 사도의 그림자에서 치유를 기대했습니다</h4><blockquote><p>“심지어 <strong>병든 사람을 메고 거리에 나가</strong> 침대와 요 위에 누이고 <strong>베드로가 지날 때에 혹 그의 그림자라도 누구에게 덮일까 바라고</strong> 예루살렘 부근의 수많은 사람들도 모여 병든 사람과 더러운 귀신에게 괴로움 받는 사람을 데리고 와서 <strong>다 나음을 얻으니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/act/5/#L15-16">행 5:15-16</a>)</p></blockquote><h3>거룩한 사람들(사제)</h3><h4>그리스도께서는 사도들에게만 나타나시고 그들에게만 권한을 주십니다</h4><blockquote><p>“예수께서 또 이르시되 너희에게 평강이 있을지어다 아버지께서 나를 보내신 것 같이 나도 너희를 보내노라 이 말씀을 하시고 그들을 향하사 <strong>숨을 내쉬며</strong> 이르시되 <strong>성령을 받으라</strong> <strong>너희가 누구의 죄든지 사하면 사하여질 것이요 누구의 죄든지 그대로 두면 그대로 있으리라</strong> 하시니라” (<a href="https://bibleox.com/ko/ko-nkrv/in/20/#L21-23">요 20:21-23</a>)</p></blockquote><blockquote><p>“진실로 너희에게 이르노니 <strong>무엇이든지 너희가 땅에서 매면 하늘에서도 매일 것이요 무엇이든지 땅에서 풀면 하늘에서도 풀리리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/18/#L18">마 18:18</a>)</p></blockquote><h3>거룩한 예식과 성사</h3><p>(신약의) 성체성혈의 제사. 주님께서는 사도들에게만 이를 거행하는 법을 가르치십니다:</p><blockquote><p>“그들이 먹을 때에 예수께서 <strong><mark>떡을 가지사 축복하시고 떼어 제자들에게 주시며 이르시되 받아서 먹으라 이것은 내 몸이니라</mark></strong> 하시고 또 <strong><mark>잔을 가지사 감사 기도 하시고 그들에게 주시며 이르시되 너희가 다 이것을 마시라</mark></strong> 이것은 죄 사함을 얻게 하려고 많은 사람을 위하여 흘리는 바 <strong><mark>나의 피</mark></strong> 곧 언약의 피니라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/26/#L26-28">마 26:26-28</a>; <a href="https://bibleox.com/ko/ko-nkrv/mk/14/#L22-24">막 14:22-24</a>; <a href="https://bibleox.com/ko/ko-nkrv/lk/22/#L19-20">눅 22:19-20</a>)</p></blockquote><blockquote><p>“또 <strong><mark>떡을 가져 감사 기도 하시고 떼어 그들에게 주시며 이르시되 이것은 너희를 위하여 주는 내 몸이라 너희가 이를 행하여 나를 기념하라</mark></strong> 하시고 저녁 먹은 후에 <strong><mark>잔도 그와 같이 하여</mark></strong> 이르시되 이 잔은 내 피로 세우는 새 언약이니 곧 너희를 위하여 붓는 것이라” (<a href="https://bibleox.com/ko/ko-nkrv/lk/22/#L19-20">눅 22:19-20</a>)</p></blockquote><p>그 뒤 나중에 회심한 사도 바울에게 따로 같은 예식을 가르치십니다:</p><blockquote><p>“내가 너희에게 전한 것은 <strong>주께 받은 것이니</strong> 곧 주 예수께서 잡히시던 밤에 <strong><mark>떡을 가지사</mark></strong> <strong><mark>축사하시고 떼어</mark></strong> 이르시되 <strong>이것은 너희를 위하는 내 몸이니</strong> <strong><mark>이것을 행하여 나를 기념하라</mark></strong> 하시고 <strong><mark>식후에 또한 그와 같이 잔을 가지시고</mark></strong> 이르시되 <strong>이 잔은 내 피로 세운 새 언약이니</strong> 이것을 행하여 마실 때마다 나를 기념하라 하셨으니” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/11/#L23-25">고전 11:23-25</a>)</p></blockquote><h3>기도와 함께하는 안수</h3><blockquote><p>“그러므로 내가 <strong><mark>나의 안수함으로 네 속에 있는 하나님의 은사</mark></strong>를 다시 불일듯 하게 하기 위하여 너로 생각하게 하노니” (<a href="https://bibleox.com/ko/ko-nkrv/2tim/1/#L6">딤후 1:6</a>)</p></blockquote><blockquote><p>“<strong><mark>네 속에 있는 은사 곧 장로의 회에서 안수 받을 때에</mark></strong> 예언을 통하여 받은 것을 가볍게 여기지 말며” (<a href="https://bibleox.com/ko/ko-nkrv/1tim/4/#L14">딤전 4:14</a>)</p></blockquote><blockquote><p>“주를 섬겨 금식할 때에 성령이 이르시되 내가 불러 시키는 일을 위하여 바나바와 사울을 따로 세우라 하시니 이에 금식하며 기도하고 <strong><mark>두 사람에게 안수하여 보내니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/act/13/#L2-3">행 13:2-3</a>)</p></blockquote><blockquote><p>“사도들 앞에 세우니 사도들이 기도하고 <strong><mark>그들에게 안수하니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/act/6/#L6">행 6:6</a>; <a href="https://bibleox.com/ko/ko-nkrv/act/21/#L8">행 21:8</a>)</p></blockquote><blockquote><p>“세례들과 안수와 죽은 자의 부활과 영원한 심판에 관한 <strong><mark>교훈의 터</mark></strong>를 다시 닦지 말고 완전한 데로 나아갈지니라” (<a href="https://bibleox.com/ko/ko-nkrv/evr/6/#L2">히 6:2</a>)</p></blockquote><blockquote><p>“시몬이 <strong><mark>사도들의 안수로 성령 받는 것을 보고</mark></strong> 돈을 드려 이르되 이 권능을 내게도 주어 누구든지 내가 안수하는 사람은 성령을 받게 하여 주소서 하니 베드로가 이르되 네가 <strong>하나님의 선물</strong>을 돈 주고 살 줄로 생각하였으니 네 은과 네가 함께 망할지어다” (<a href="https://bibleox.com/ko/ko-nkrv/act/8/#L18-20">행 8:18-20</a>)</p></blockquote><blockquote><p>“이는 아직 한 사람에게도 성령 내리신 일이 없고 오직 주 예수의 이름으로 세례만 받을 뿐이더라 이에 <strong><mark>두 사도가 그들에게 안수하매 성령을 받는지라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/act/8/#L16-17">행 8:16-17</a>)</p></blockquote><h3>은총을 주는 하느님의 선물</h3><blockquote><p>“베드로가 이르되 은과 금은 내게 없거니와 <strong><mark>내게 있는 이것을 네게 주노니</mark></strong> 나사렛 예수 그리스도의 이름으로 일어나 걸으라 하고 오른손을 잡아 일으키니 발과 발목이 곧 힘을 얻고 뛰어 서서 걸으며 그들과 함께 성전으로 들어가면서 걷기도 하고 뛰기도 하며 하나님을 찬송하니” (<a href="https://bibleox.com/ko/ko-nkrv/act/3/#L6-8">행 3:6-8</a>)</p></blockquote><h2>구약의 성물</h2><h3>거룩한 성전</h3><blockquote><p>“<strong>여호와께서 모세에게 말씀하여 이르시되</strong> 이스라엘 자손에게 명령하여 <strong>내게 예물을 가져오라</strong> 하고 기쁜 마음으로 내는 자가 내게 바치는 모든 것을 너희는 받을지니라 &lt;…&gt; <strong><mark>내가 그들 중에 거할 성소</mark></strong>를 그들이 나를 위하여 짓되 무릇 <strong><mark>내가 네게 보이는 모양대로</mark></strong> 장막을 짓고 기구들도 그 모양을 따라 지을지니라” (<a href="https://bibleox.com/ko/ko-nkrv/ish/25/#L1-2,8-9">출 25:1-2,8-9</a>) <em>(“성소”는 칠십인역 그리스어로 ἁγίασμα, “거룩한 것”입니다.)</em></p></blockquote><blockquote><p>“보라 한 아들이 네게서 나리니 그는 온순한 사람이라 내가 그로 주변 모든 대적에게서 평온을 얻게 하리라 그의 이름을 솔로몬이라 하리니 이는 내가 그의 생전에 평안과 안일함을 이스라엘에게 줄 것임이니라 그가 <strong>내 이름을 위하여 성전을 건축할지라</strong> 그는 내 아들이 되고 나는 그의 아버지가 되어 그 나라 왕위를 이스라엘 위에 굳게 세워 영원까지 이르게 하리라 하셨나니” (<a href="https://bibleox.com/ko/ko-nkrv/1par/22/#L9-10">대상 22:9-10</a>)</p></blockquote><blockquote><p>“오직 나는 주의 풍성한 사랑을 힘입어 주의 집에 들어가 주를 경외함으로 <strong><mark>성전을 향하여 예배하리이다</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ps/5/#L7">시 5:7</a>)</p></blockquote><h3>거룩한 곳</h3><blockquote><p>“하나님이 이르시되 이리로 가까이 오지 말라 <strong><mark>네가 선 곳은 거룩한 땅이니</mark></strong> 네 발에서 신을 벗으라” (<a href="https://bibleox.com/ko/ko-nkrv/ish/3/#L5">출 3:5</a>)</p></blockquote><blockquote><p>“여호와의 군대 대장이 여호수아에게 이르되 네 발에서 신을 벗으라 <strong><mark>네가 선 곳은 거룩하니라</mark></strong> 하니 여호수아가 그대로 행하니라” (<a href="https://bibleox.com/ko/ko-nkrv/nav/5/#L15">수 5:15</a>)</p></blockquote><blockquote><p>“너는 위임식 숫양을 가져다가 <strong><mark>거룩한 곳에서</mark></strong> 그 고기를 삶고” (<a href="https://bibleox.com/ko/ko-nkrv/ish/29/#L31">출 29:31</a>)</p></blockquote><h3>거룩한 물건</h3><p>거룩한 기름(성유)은 성물입니다. 이 기름을 바른 성전과 성전의 모든 기물은 거룩합니다. 사람 가운데에서는 아론의 후손만 사제가 되도록 이 기름을 바를 수 있습니다:</p><blockquote><p>“너는 상등 향품을 가지되 액체 몰약 오백 세겔과 그 반수의 향기로운 육계 이백오십 세겔과 향기로운 창포 이백오십 세겔과 계피 오백 세겔을 성소의 세겔로 하고 감람 기름 한 힌을 가지고 그것으로 <strong><mark>거룩한 관유</mark></strong>를 만들되 향을 제조하는 법대로 향기름을 만들지니 그것이 거룩한 관유가 될지라 너는 그것을 <strong>회막과 증거궤에 바르고</strong> <strong>상과 그 모든 기구</strong>이며 등잔대와 그 기구이며 분향단과 및 번제단과 그 모든 기구와 물두멍과 그 받침에 발라 <strong><mark>그것들을 지극히 거룩한 것으로 구별하라 이것에 접촉하는 것은 모두 거룩하리라</mark></strong> 너는 <strong>아론과 그의 아들들에게 기름을 발라</strong> 그들을 거룩하게 하고 그들이 내게 제사장 직분을 행하게 하고 이스라엘 자손에게 말하여 이르기를 이것은 너희 대대로 내게 거룩한 관유니 <strong>사람의 몸에 붓지 말며</strong> 이 방법대로 이와 같은 것을 만들지 말라 <strong><mark>이는 거룩하니 너희는 거룩히 여기라</mark></strong> 이와 같은 것을 만드는 모든 자와 이것을 타인에게 붓는 모든 자는 그 백성 중에서 끊어지리라 하라” (<a href="https://bibleox.com/ko/ko-nkrv/ish/30/#L23-33">출 30:23-33</a>)</p></blockquote><p>제단은 지극히 거룩합니다:</p><blockquote><p>“또 관유를 가져다가 성막과 그 안에 있는 모든 것에 발라 그것과 그 모든 기구를 거룩하게 하라 그것이 거룩하리라 너는 또 번제단과 그 모든 기구에 발라 그 안을 거룩하게 하라 <strong><mark>그 제단이 지극히 거룩하리라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ish/40/#L9-10">출 40:9-10</a>)</p></blockquote><blockquote><p>“너는 이레 동안 제단을 위하여 속죄하여 거룩하게 하라 그리하면 <strong><mark>지극히 거룩한 제단이 되리니</mark></strong> <strong>제단에 접촉하는 모든 것이 거룩하리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ish/29/#L37">출 29:37</a>)</p></blockquote><p><a href="https://bibleox.com/ru/ru/w/фимиам">향</a>(제단에서 사르는 향기로운 물질)은 지극히 거룩합니다:</p><blockquote><p>“여호와께서 모세에게 이르시되 너는 소합향과 나감향과 풍자향의 향품을 가져다가 그 향품을 유향에 섞되 각기 같은 분량으로 하고 그것으로 향을 만들되 향 만드는 법대로 만들고 그것에 소금을 쳐서 성결하게 하고 <strong><mark>그 향 얼마를 곱게 찧어</mark></strong> 내가 너와 만날 회막 안 증거궤 앞에 두라 <strong><mark>이 향은 너희에게 지극히 거룩하니라</mark></strong> 네가 <strong><mark>여호와를 위하여 만들 향은 거룩한 것이니</mark></strong> 너희를 위하여는 그 방법대로 만들지 말라 냄새를 맡으려고 이같은 것을 만드는 모든 자는 그 백성 중에서 끊어지리라” (<a href="https://bibleox.com/ko/ko-nkrv/ish/30/#L34-38">출 30:34-38</a>)</p></blockquote><h3>거룩한 형상</h3><blockquote><p>“일하는 사람 중에 마음이 지혜로운 모든 사람이 <strong><mark>열 폭 휘장으로 성막을 지었으니</mark></strong> 곧 가늘게 꼰 베 실과 청색 자색 홍색 실로 <strong><mark>그룹들을 무늬 놓아 짜서 지은 것이라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ish/36/#L8">출 36:8</a>; <a href="https://bibleox.com/ko/ko-nkrv/ish/26/#L1">출 26:1</a>)</p></blockquote><blockquote><p>“또 <strong>관유를 가져다가</strong> 성막과 그 안에 있는 모든 것에 발라 <strong><mark>그것과 그 모든 기구를 거룩하게 하라</mark></strong> <strong><mark>그것이 거룩하리라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ish/40/#L9">출 40:9</a>)</p></blockquote><h3>거룩한 사람들(사제)</h3><p><a href="https://bibleox.com/ru/ru/w/Таинство-Священства">사제</a>는 아론의 후손뿐입니다:</p><blockquote><p>“아론과 그의 아들들에게 띠를 띠우며 관을 씌워 <strong>그들에게 제사장의 직분을 맡겨 영원한 규례가 되게 하라</strong> 너는 이같이 아론과 그의 아들들에게 위임하여 거룩하게 할지니라” (<a href="https://bibleox.com/ko/ko-nkrv/ish/29/#L9">출 29:9</a>)</p></blockquote><p>사제직은 거룩한 옷과 함께 기름 부음으로 이어집니다:</p><blockquote><p>“<strong>아론의 성의는 후에 아론의 아들들에게 돌릴지니</strong> 그들이 그것을 입고 <strong>기름 부음으로 위임을 받을 것이며</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ish/29/#L29">출 29:29</a>)</p></blockquote><p>거룩한 봉사에 다가오는 외부인은 죽어야 했습니다. 사제직의 임무는 이를 지키는 것이었습니다:</p><blockquote><p>“너는 아론과 그의 아들들을 세워 제사장 직무를 행하게 하라 <strong>외인이 가까이 하면 죽임을 당할 것이니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/chis/3/#L10">민 3:10</a>)</p></blockquote><h4>예언자 엘리사의 몸에 닿아 치유되었습니다</h4><blockquote><p>“마침 사람을 장사하는 자들이 그 도적 떼를 보고 그의 시체를 엘리사의 묘실에 들이던지매 <strong>시체가 엘리사의 뼈에 닿자 곧 회생하여 일어섰더라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/4ts/13/#L21">왕하 13:21</a>)</p></blockquote><h3>거룩한 예식과 성사</h3><p>구약에는 매우 많은 예식이 있었습니다. 레위기에서 알 수 있습니다. 예를 들어 대사제 임명 예식: <a href="https://bibleox.com/ru/ru/w/ветхозаветный-священник">구약의 사제</a>.</p><p>(구약의) 성체성혈 제사의 예표:</p><p><a href="https://bibleox.com/ru/ru/w/Евхаристия">성체성혈성사</a></p><h3>기도와 함께하는 안수</h3><h4>야곱이 손자들을 축복합니다</h4><p>야곱은 기도하며 손자들에게 손을 얹어 축복했습니다:</p><blockquote><p>“이스라엘이 <strong><mark>오른손을 펴서 차남 에브라임의 머리에 얹고</mark></strong> <strong><mark>왼손을 펴서 므낫세의 머리에 얹으니</mark></strong> 므낫세는 장자라도 팔을 엇바꾸어 얹었더라 그가 요셉을 위하여 <strong><mark>축복하여</mark></strong> 이르되 내 조부 아브라함과 아버지 이삭이 섬기던 하나님, 나의 출생으로부터 지금까지 나를 기르신 하나님, 나를 모든 환난에서 건지신 <strong><mark>여호와의 사자께서 이 아이들에게 복을 주시오며</mark></strong> 이들로 내 이름과 내 조상 아브라함과 이삭의 이름으로 칭하게 하시오며 이들이 세상에서 번식되게 하시기를 원하나이다” (<a href="https://bibleox.com/ko/ko-nkrv/gen/48/#L14-16">창 48:14-16</a>)</p></blockquote><h4>모세가 눈의 아들 여호수아를 직무에 세웁니다</h4><p>하느님께서는 예언자 모세에게 안수로 눈의 아들 여호수아를 직무에 세우라고 명하셨습니다:</p><blockquote><p>“<strong><mark>여호와께서 모세에게 이르시되</mark></strong> 눈의 아들 여호수아는 그 안에 영이 머무는 자니 너는 <strong><mark>데려다가 그에게 안수하고</mark></strong> &lt;…&gt; 모세가 여호와께서 자기에게 명령하신 대로 하여 여호수아를 데려다가 제사장 엘르아살과 온 회중 앞에 세우고 <strong><mark>그에게 안수하여 위탁하되</mark></strong> 여호와께서 모세에게 명령하신 대로 하였더라” (<a href="https://bibleox.com/ko/ko-nkrv/chis/27/#L18,22-23">민 27:18,22-23</a>)</p></blockquote><h4>레위인을 직무에 세우는 방식</h4><p>하느님께서는 레위인들을 안수로 성소의 봉사에 세우라고 명하셨습니다:</p><blockquote><p>“레위인을 여호와 앞에 나오게 하고 <strong><mark>이스라엘 자손이 그들에게 안수하게 한 후에</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/chis/8/#L10">민 8:10</a>)</p></blockquote><h2>비판</h2><h3>하느님께서는 사람의 손으로 지은 성전에 사시지 않는다</h3><p>성전에 반대하는 교회 비판자들은 이 구절을 듭니다:</p><blockquote><p>“다윗이 하나님 앞에서 은혜를 받아 야곱의 집을 위하여 하나님의 처소를 준비하게 하여 달라고 하더니 솔로몬이 그를 위하여 집을 지었느니라 그러나 <strong>지극히 높으신 이는 손으로 지은 곳에 계시지 아니하시나니</strong> 선지자가 말한 바 주께서 이르시되 하늘은 나의 보좌요 땅은 나의 발등상이니 너희가 나를 위하여 무슨 집을 짓겠으며 나의 안식할 처소가 어디냐” (<a href="https://bibleox.com/ko/ko-nkrv/act/7/#L46-49">행 7:46-49</a>)</p></blockquote><p>그러나 이것은 결코 성전에 반대되는 증언이 아닙니다. 다윗이 하느님을 위해 집(성전)을 지으려 했을 때, 하느님께서는 이미 예언자 모세에게 성막을 짓고 축성하고 사제를 세우고 예식을 지키고 성물(궤)을 두라고 명하셨고, 하느님께서 세우신 질서를 어기면 사형에 처하도록 정하셨기 때문입니다. 이 구절은 하느님께서 성전에만 계시지 않고 어디에나 계심을 설명할 뿐입니다. 성전은 사람이 아니라 하느님 자신이 세우신 것이며, 이교도에게서 빌려 온 것이 결코 아닙니다.</p><h2>참고</h2><h3>거룩한 것에 대항하고 자신을 높이는 것은 그리스도의 적의 표지 가운데 하나입니다</h3><blockquote><p>“누가 어떻게 하여도 너희가 미혹되지 말라 먼저 배교하는 일이 있고 저 <strong><mark>불법의 사람 곧 멸망의 아들</mark></strong>이 나타나기 전에는 그 날이 이르지 아니하리니 그는 대적하는 자라 <strong><mark>신이라고 불리는 모든 것과 숭배함을 받는 것에 대항하여 그 위에 자기를 높이고</mark></strong> 하나님의 성전에 앉아 자기를 하나님이라고 내세우느니라” (<a href="https://bibleox.com/ko/ko-nkrv/2sol/2/#L3-4">살후 2:3-4</a>)</p></blockquote><blockquote><p>“아이들아 지금은 마지막 때라 적그리스도가 오리라는 말을 너희가 들은 것과 같이 <strong><mark>지금도 많은 적그리스도가 일어났으니</mark></strong> 그러므로 우리가 마지막 때인 줄 아노라” (<a href="https://bibleox.com/ko/ko-nkrv/1in/2/#L18">요일 2:18</a>)</p></blockquote><h3>짐승은 하늘에 사는 이들을 모독할 것입니다</h3><blockquote><p>“짐승이 입을 벌려 하나님을 향하여 비방하되 그의 이름과 그의 장막 곧 <strong><mark>하늘에 사는 자들을 비방하더라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/13/#L6">계 13:6</a>)</p></blockquote><h3>의인들의 영혼과 천사들은 하늘에 삽니다</h3><blockquote><p>“그러나 <strong><mark>너희가 이른 곳은</mark></strong> 시온 산과 살아 계신 하나님의 도성인 <strong><mark>하늘의 예루살렘과 천만 천사와</mark></strong> <strong>하늘에 기록된 장자들의 모임과 교회와</strong> 만민의 심판자이신 하나님과 및 <strong><mark>온전하게 된 의인의 영들과</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/evr/12/#L22-23">히 12:22-23</a>)</p></blockquote>'
