  title: 은총
  copy_cover: true
  body: '<h2>정의</h2><p><strong>은총(고대 그리스어 χάρις, 히브리어 חֵ֣ן)</strong>은 주된 뜻으로, 사람의 구원을 위해 사람에게 작용하는 하느님의 힘입니다.[1]</p><ol><li><p><strong>하느님의 힘, 하느님의 활동</strong> (<a href="https://bibleox.com/ko/ko-ctb/1kor/15/#L10">1고린 15:10</a> — “내가 오늘의 내가 된 것은 하느님의 은총의 덕입니다” — χάριτι δὲ θεοῦ εἰμι ὅ εἰμι, καὶ ἡ χάρις αὐτοῦ ἡ εἰς ἐμὲ οὐ κενὴ ἐγενήθη, ἀλλὰ περισσότερον αὐτῶν πάντων ἐκοπίασα, οὐκ ἐγὼ δὲ ἀλλὰ ἡ χάρις τοῦ θεοῦ [ἡ] σὺν ἐμοί);</p></li><li><p><strong>자비, 호의, 선물, 어떤 이에 대한 은혜와 사랑</strong> (<a href="https://bibleox.com/ko/ko-ctb/gen/18/#L3">창 18:3</a> — ἄρα εὗρον χάριν ἐναντίον σου), (<a href="https://bibleox.com/ko/ko-ctb/sud/6/#L17">판관 6:17</a> — εἰ εὗρον χάριν ἐν ὀφθαλμοῖς σου), (<a href="https://bibleox.com/ko/ko-ctb/1ts/16/#L22">삼상 16:22</a> — εὗρεν χάριν ἐν ὀφθαλμοῖς μου), (<a href="https://bibleox.com/ko/ko-ctb/3ts/11/#L19">열상 11:19</a> — καὶ εὗρεν Αδερ χάριν ἐναντίον Φαραω), (<a href="https://bibleox.com/ko/ko-ctb/act/2/#L47">사도 2:47</a> — ἔχοντες χάριν πρὸς ὅλον τὸν λαόν), (<a href="https://bibleox.com/ko/ko-ctb/act/7/#L46">사도 7:46</a> — ὃς εὗρεν χάριν ἐνώπιον τοῦ θεοῦ), (<a href="https://bibleox.com/ko/ko-ctb/1kor/16/#L3">1고린 16:3</a> — ἀπενεγκεῖν τὴν χάριν ὑμῶν εἰς Ἰερουσαλήμ);</p></li><li><p><strong>하느님께 드리는 감사, 하느님 마음에 듦</strong> (<a href="https://bibleox.com/ko/ko-ctb/2kor/9/#L15">2고린 9:15</a> — χάρις τῷ θεῷ ἐπὶ τῇ ἀνεκδιηγήτῳ αὐτοῦ δωρεᾷ), (<a href="https://bibleox.com/ko/ko-ctb/1pet/2/#L19">1베드 2:19</a> — τοῦτο γὰρ χάρις εἰ διὰ συνείδησιν θεοῦ ὑποφέρει τις λύπας);</p></li><li><p><strong>아름다움</strong> (<a href="https://bibleox.com/ko/ko-ctb/pr/5/#L19">잠언 5:19</a> — πῶλος σῶν χαρίτων), (<a href="https://bibleox.com/ko/ko-ctb/pr/3/#L22">잠언 3:22</a> — χάρις ᾖ περὶ σῷ τραχήλῳ);</p></li><li><p><strong>귀한 것</strong> (<a href="https://bibleox.com/ko/ko-ctb/pr/17/#L8">잠언 17:8</a> — אֶֽבֶן ־ חֵן), (<a href="https://bibleox.com/ko/ko-ctb/ekl/10/#L12">전도 10:12</a> — λόγοι στόματος σοφοῦ χάρις), (<a href="https://bibleox.com/ko/ko-ctb/ps/45/#L2">시편 45:2</a> — ἐξεχύθη χάρις ἐν χείλεσίν σου);</p></li><li><p><strong>영예, 존경, 영광</strong> (<a href="https://bibleox.com/ko/gr-lxx-byz/iudf/8/#L23">유딧 8:23</a> — κατευθυνθήσεται ἡ δουλεία ἡμῶν εἰς χάριν)</p></li></ol><h2>부르시는 은총의 활동</h2><blockquote><p>“그리스도의 <strong><mark>은총으로 하느님의 자녀가 된</mark></strong> 여러분이 그렇게도 빨리 하느님을 외면하고 또 다른 복음을 따라 가고 있다니 놀라지 않을 수 없습니다.” (<a href="https://bibleox.com/ko/ko-ctb/gal/1/#L6">갈라 1:6</a>)</p></blockquote><blockquote><p>“그러나 하느님께서는 <strong>내가 나기 전에 이미</strong> <strong><mark>은총으로 나를 택하셔서 불러 주셨고</mark></strong>” (<a href="https://bibleox.com/ko/ko-ctb/gal/1/#L15">갈라 1:15</a>)</p></blockquote><h2>하느님의 선물인 은총</h2><blockquote><p>“주 예수께서 <strong><mark>여러분에게 은총을 내려 주시기를</mark></strong> 바랍니다.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/16/#L23">1고린 16:23</a>)</p></blockquote><blockquote><p>“<strong>하느님 우리 아버지와</strong> 주 예수 그리스도께서 <strong><mark>은총과 평화를 여러분에게</mark></strong> 내려 주시기를 빕니다.” (<a href="https://bibleox.com/ko/ko-ctb/2kor/1/#L2">2고린 1:2</a>)</p></blockquote><blockquote><p>“그러나 <strong><mark>성령이 너희에게 오시면 너희는 힘을 받아</mark></strong> 예루살렘과 온 유다와 사마리아뿐만 아니라 땅 끝에 이르기까지 어디에서나 나의 증인이 될 것이다.‘” (<a href="https://bibleox.com/ko/ko-ctb/act/1/#L8">사도 1:8</a>)</p></blockquote><blockquote><p>“내가 맡은 일을 감당할 수 있도록 <strong><mark>힘을 주신</mark></strong> 우리 주 그리스도 예수께 나는 감사합니다. 주께서 나를 성실한 사람으로 인정하셔서 당신을 섬기는 직분을 나에게 맡겨 주신 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/1tim/1/#L12">1디모 1:12</a>)</p></blockquote><blockquote><p>“나는 <strong><mark>하느님께서 거저 주신 은총을 받고 내 속에서 활동하시는 하느님의 능력에 힘입어</mark></strong> 이 복음을 전하는 일꾼이 되었습니다.” (<a href="https://bibleox.com/ko/ko-ctb/ef/3/#L7">에페 3:7</a>)</p></blockquote><blockquote><p>“그리스도께서는 <strong><mark>우리들에게 각각 다른 은총을 알맞게 나누어 주셨습니다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/ef/4/#L7">에페 4:7</a>)</p></blockquote><blockquote><p>“그들은 또한 <strong><mark>여러분에게 주신 하느님의 넘치는 은총</mark></strong>을 보고 여러분을 그리워하며 여러분을 위하여 기도할 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/2kor/9/#L14">2고린 9:14</a>)</p></blockquote><blockquote><p>“<strong><mark>하느님께서는 여러분에게 모든 은총을 충분히 주실 수 있는</mark></strong> 능력을 자기고 계십니다. 그래서 여러분은 언제나 모든 것을 넉넉하게 가질 수 있고 온갖 좋은 일을 얼마든지 행할 수 있을 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/2kor/9/#L8">2고린 9:8</a>)</p></blockquote><blockquote><p>“내가 굉장한 계시를 받았다 해서 잔뜩 교만해질까봐 하느님께서 내 몸에 가시로 찌르는 것 같은 병을 하나 주셨습니다. 그것은 사탄의 하수인으로서 나를 줄곧 괴롭혀 왔습니다. 그래서 나는 교만에 빠지지 않게 되었습니다. 나는 그 고통이 내게서 떠나게 해 주시기를 주님께 세 번이나 간청하였습니다. 그러나 주님께서는 ‘<strong><mark>너는 이미 내 은총을 충분히 받았다. 내 권능은 약한 자 안에서 완전히 드러난다</mark></strong>’하고 번번이 말씀하셨습니다. 그래서 나는 <strong><mark>그리스도의 권능이 내게 머무르도록</mark></strong> 하려고 더없이 기쁜 마음으로 나의 약점을 자랑하려고 합니다.” (<a href="https://bibleox.com/ko/ko-ctb/2kor/12/#L7-9">2고린 12:7-9</a>) <em>(“은총”: χάρις, “권능”: δύναμις)</em></p></blockquote><blockquote><p>“우리는 하느님과 함께 일하는 사람으로서 여러분에게 간곡히 부탁합니다. <strong><mark>여러분이 받은 하느님의 은총을 헛되게 하지 마십시오</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/2kor/6/#L1">2고린 6:1</a>)</p></blockquote><blockquote><p>“그러나 내가 오늘의 내가 된 것은 하느님의 은총의 덕입니다. <strong><mark>하느님께서 나에게 주신 은총은 헛되지 않았습니다</mark></strong>. 과연 나는 어느 사도들보다도 더 <strong>열심히 일했습니다</strong>. 그러나 <strong><mark>이것은 내가 한 것이 아니라 나에게 주신 하느님의 은총으로 된 것입니다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/15/#L10">1고린 15:10</a>)</p></blockquote><blockquote><p>“베드로가 이렇게 대답하였다. ‘회개하시오. 그리고 여러분은 한 사람도 빠짐없이 예수 그리스도의 이름으로 세례를 받고 여러분의 죄를 용서받으시오. 그리하면 <strong><mark>성령을 선물로 받게 될 것입니다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/act/2/#L38">사도 2:38</a>)</p></blockquote><blockquote><p>“그리스도를 통해서 여러분과 우리를 굳세게 해주시고 우리에게 기름을 부어 사명을 맡겨 주신 분은 하느님이십니다. 하느님께서는 우리를 당신의 사람으로 확인해 주셨고 그것을 <strong><mark>보증하는 표로 우리의 마음에 성령을 보내 주셨습니다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/2kor/1/#L21-22">2고린 1:21-22</a>)</p></blockquote><blockquote><p>“사실 <strong><mark>하느님의 성령께서 여러분 안에 계시다면</mark></strong> 여러분은 육체를 따라 사는 사람이 아니라 성령을 따라 사는 사람입니다. 그러나 그리스도의 성령을 모시지 못한 사람은 그리스도의 사람이 아닙니다.” (<a href="https://bibleox.com/ko/ko-ctb/rim/8/#L9">로마 8:9</a>)</p></blockquote><blockquote><p>“여러분은 자신이 하느님의 성전이며 <strong>하느님의 성령께서 자기 안에 살아 계시다는 것</strong>을 모르십니까?” (<a href="https://bibleox.com/ko/ko-ctb/1kor/3/#L16">1고린 3:16</a>)</p></blockquote><blockquote><p>“여러분이 받은 성령은 여러분을 다시 노예로 만들어서 공포에 몰아 넣으시는 분이 아니라 <strong><mark>여러분을 하느님의 자녀로 만들어 주시는 분이십니다. 그래서 우리는 그 성령에 힘입어 하느님을 ‘아빠, 아버지’라고 부릅니다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/rim/8/#L15">로마 8:15</a>)</p></blockquote><blockquote><p>“이제 여러분은 하느님의 자녀가 되었으므로 <strong><mark>하느님께서는 여러분의 마음 속에 당신의 아들의 성령을 보내 주셨습니다</mark></strong>. 그래서 여러분은 마음 속에 당신의 아들의 성령을 보내 주셨습니다. 그래서 여러분은 하느님을 ‘<strong><mark>아빠, 아버지</mark></strong>’라고 부를 수 있게 되었습니다.” (<a href="https://bibleox.com/ko/ko-ctb/gal/4/#L6">갈라 4:6</a>)</p></blockquote><blockquote><p>“그러나 여러분으로 말하자면 <strong><mark>그리스도께서 부어 주신 성령이 여러분의 마음 속에 살아 계시는 한</mark></strong> 아무에게도 가르침을 받을 필요가 없습니다. <strong><mark>그리스도께서 부어 주신 성령은 여러분에게 모든 것을 가르쳐 주십니다</mark></strong>. 그리고 그분은 진실하셔서 거짓말을 하지 않습니다. 여러분은 그 성령께서 가르쳐 주신 대로 그리스도와 함께 살아 가시오.” (<a href="https://bibleox.com/ko/ko-ctb/1in/2/#L27">1요한 2:27</a>) <em>(“그리스도께서 부어 주신 성령”은 그리스어로 χρῖσμα, “기름 부음”입니다.)</em></p></blockquote><blockquote><p>“우리는 하느님과 함께 일하는 사람으로서 여러분에게 간곡히 부탁합니다. <strong><mark>여러분이 받은 하느님의 은총을 헛되게 하지 마십시오</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/2kor/6/#L1">2고린 6:1</a>)</p></blockquote><blockquote><p>“하느님의 성전에 우상이 어떻게 어울리겠습니까? 우리는 살아 계신 하느님의 성전입니다. 하느님께서도 이렇게 말씀하셨습니다. ‘<strong><mark>나는 그들 가운데서 살며 그들 사이를 거닐 것이다</mark></strong>. 나는 그들의 하느님이 되고 그들은 내 백성이 되리라.’” (<a href="https://bibleox.com/ko/ko-ctb/2kor/6/#L16">2고린 6:16</a>)</p></blockquote><blockquote><p>“예수께서는 이렇게 대답하셨다. ‘나를 사랑하는 사람은 내 말을 지킬 것이다. 그러면 나의 아버지께서도 그를 사랑하시겠고 <strong><mark>내 아버지와 나는 그를 찾아 가 그와 함께 살 것이다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/in/14/#L23">요한 14:23</a>)</p></blockquote><blockquote><p>“음식에 관한 여러 가지 이상한 교훈에 속지 마십시오. 음식에 관한 규정을 지키는 것보다 <strong><mark>은총으로 마음을 튼튼하게 하는 것이 더 좋습니다</mark></strong>. 음식에 관한 규정을 지키는 사람들이 그것 때문에 이득을 본 일은 없습니다.” (<a href="https://bibleox.com/ko/ko-ctb/evr/13/#L9">히브 13:9</a>)</p></blockquote><blockquote><p>“우리는 흔들리지 않는 나라를 차지했으니 <strong><mark>감사를 드립시다</mark></strong>. 그리고 하느님께서 기뻐하시도록 경건한 마음과 두려워하는 마음으로 하느님께 예배를 드립시다.” (<a href="https://bibleox.com/ko/ko-ctb/evr/12/#L28">히브 12:28</a>) <em>(그리스어: ἔχωμεν χάριν, “은총을 지니자”)</em></p></blockquote><blockquote><p>“사람들이 <strong>어린이들을 예수께 데리고 와서</strong> <strong>손을 얹어 축복해 주시기를</strong> 청하자 제자들이 그들을 나무랐다. 그러나 예수께서는 화를 내시며 ‘어린이들이 나에게 오는 것을 막지 말고 그대로 두어라. 하느님의 나라는 이런 어린이와 같은 사람들의 것이다. &lt;…&gt; 그리고 <strong>어린이들을 안으시고</strong> <strong><mark>머리 위에 손을 얹어 축복해 주셨다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/mk/10/#L13-14,16">마르 10:13-14,16</a>)</p></blockquote><blockquote><p>“예수께서 그들을 베다니아 근처로 데리고 나가셔서 <strong><mark>두 손을 들어 축복해 주셨다</mark></strong>. 이렇게 축복하시면서 그들을 떠나 하늘로 올라 가셨다.” (<a href="https://bibleox.com/ko/ko-ctb/lk/24/#L50-51">루가 24:50-51</a>)</p></blockquote><h2>사람을 통한 은총의 활동</h2><blockquote><p>“그러므로 나는 그리스도 예수와 한 몸이 되어 하느님을 위하여 일하는 것을 자랑으로 여깁니다. <strong><mark>이방인들을 하느님께 복종시키신 분은 그리스도이시고 나는 다만 그분의 일꾼 노릇을 했을 따름</mark></strong>이라는 것을 강조하고 싶습니다. 나는 그분에게서 <strong>기적과 놀라운 일</strong>을 할 수 있는 힘 곧 <strong><mark>성령의 힘을</mark></strong> 받아 예루살렘에서 일리리쿰에 이르기까지 두루 다니면서 말과 활동으로 그리스도의 복음을 남김없이 전파하였습니다.” (<a href="https://bibleox.com/ko/ko-ctb/rim/15/#L17-19">로마 15:17-19</a>) <em>(“힘”: δύναμις)</em></p></blockquote><blockquote><p>“그래서 나는 다시 그대를 깨우쳐 줍니다. <strong><mark>내가 그대에게 안수했을 때에</mark></strong> 하느님께서 그대에게 주신 그 <strong><mark>은총의 선물</mark></strong>을 생생하게 간직하시오.” (<a href="https://bibleox.com/ko/ko-ctb/2tim/1/#L6">2디모 1:6</a>)</p></blockquote><p>그들은 민족들을 복종으로 이끌려고 은총을 받았습니다:</p><blockquote><p>“내가 <strong><mark>은총으로</mark></strong> <strong>사도직</strong>을 받은 것도 그분을 통해서였습니다. 이것은 <strong><mark>모든 이방인들에게 하느님을 믿고 복종할 것을 가르침으로써</mark></strong> 그분의 영광을 드러내기 위한 것이었습니다.” (<a href="https://bibleox.com/ko/ko-ctb/rim/1/#L5">로마 1:5</a>)</p></blockquote><blockquote><p>“남을 해치는 말은 입 밖에도 내지 마십시오. 오히려 기회 있는 대로 남에게 <strong>이로운 말</strong>을 하여 도움을 주고 <strong>듣는 사람에게 기쁨을 주도록</strong> 하십시오.” (<a href="https://bibleox.com/ko/ko-ctb/ef/4/#L29">에페 4:29</a>) <em>(그리스어: ἵνα δῷ χάριν, “듣는 이들에게 은총을 주도록”)</em></p></blockquote><blockquote><p>“여러분은 <strong>언제나 친절하게 유익한 말을 하고</strong>, 묻는 사람에게는 누구에게나 적절한 대답을 할 줄 알아야 합니다.” (<a href="https://bibleox.com/ko/ko-ctb/kol/4/#L6">골로 4:6</a>) <em>(그리스어: ἐν χάριτι, “은총 안에서”)</em></p></blockquote><h2>은총은 겸손한 이에게 주어집니다</h2><blockquote><p>“야훼께서는 교만한 자를 업신여기시고 <strong><mark>겸손한 사람에게 은혜를 베푸신다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/pr/3/#L34">잠언 3:34</a>)</p></blockquote><blockquote><p>“그러나 하느님의 은총은 그것으로 그치지 않습니다. 그래서 성서에도 ‘하느님께서는 교만한 자를 물리치시고 <strong><mark>겸손한 사람에게 은총을 주신다</mark></strong>’는 말씀이 있습니다.” (<a href="https://bibleox.com/ko/ko-ctb/iak/4/#L6">야고 4:6</a>)</p></blockquote><blockquote><p>“이번에는 젊은이들에게 말합니다. 여러분은 원로들에게 복종하십시오. 여러분은 모두 겸손의 옷을 입고 서로 섬기십시오. 하느님께서는 교만한 자를 물리치시고 <strong><mark>겸손한 사람에게 은총을 베푸십니다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/1pet/5/#L5">1베드 5:5</a>)</p></blockquote><h2>은총을 일깨워야 합니다</h2><blockquote><p>“그래서 나는 다시 그대를 깨우쳐 줍니다. <strong><mark>내가 그대에게 안수했을 때에 하느님께서 그대에게 주신 그 은총의 선물을 생생하게 간직하시오</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/2tim/1/#L6">2디모 1:6</a>)</p></blockquote>'
