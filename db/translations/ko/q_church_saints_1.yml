  body: <ol><li><p><strong>거룩함</strong>은 어떤 것을 한 가지 목적을 위해 완전히 따로 떼어 놓는 것입니다.</p></li><li><p><strong>거룩함</strong>은 하느님께 바쳐진 삶의 방식입니다.</p></li><li><p><strong>성인</strong>은 죄 없이 하느님의 뜻대로 사는 사람입니다.</p></li></ol><blockquote><p>“그리스도께서는 <strong>단 한 번 죽으심으로써 죄의 권세를 꺾으셨고 다시 살아나셔서는 하느님을 위해서 살고 계십니다</strong>. 이와 같이 여러분도 그리스도 예수와 함께 죽어서 <strong>죄의 권세를 벗어나 그와 함께 하느님을 위해서 살아야 한다고 생각하십시오</strong>. 그러므로 결국 죽어 버릴 육체의 욕망에 굴복하지 마십시오. 그래야 <strong>죄의 지배를 받지 않을 것입니다</strong>. 또 <strong>여러분의 지체를 죄에 내맡기어</strong> 악의 도구가 되게 하는 일은 없어야 합니다. 오히려 여러분은 죽었다가 다시 살아난 사람으로서 여러분 자신을 하느님께 바치고 여러분의 지체가 하느님을 위한 정의의 도구로 쓰이게 하십시오. &lt;…&gt; 그리고 여러분은 죄의 권세를 벗어나서 이제는 정의의 종이 되었습니다. &lt;…&gt; 그러나 이제는 여러분이 <strong>죄에서 해방되어 하느님의 종이 되었습니다. 그 결과로 여러분은 거룩한 사람이 되었고</strong> 마침내 영원한 생명을 누리게 되었습니다.” (<a href="https://bibleox.com/ko/ko-ctb/rim/6/#L10-13,18,22">로마 6:10-13,18,22</a>)</p></blockquote><blockquote><p>“누구든지 하느님께로부터 난 사람은 자기 안에 하느님의 본성을 지녔으므로 죄를 짓지 않습니다. 그는 하느님께로부터 난 사람이기 때문에 도대체 <strong>죄를 지을 수가 없습니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/1in/3/#L9">1요한 3:9</a>)</p></blockquote><blockquote><p>“우리가 아는 바와 같이 <strong>하느님께로부터 난 사람은 누구나 죄를 짓지 않습니다</strong>. 하느님의 아들이 그를 지켜 주시기 때문에 악마가 그를 다치지 못합니다.” (<a href="https://bibleox.com/ko/ko-ctb/1in/5/#L18">1요한 5:18</a>)</p></blockquote><blockquote><p>“모든 사람과 <strong>화평하게 지내며</strong> 거룩한 사람이 되도록 힘쓰시오. <strong>거룩해지지 않으면 아무도 주님을 뵙지 못할 것입니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/evr/12/#L14">히브 12:14</a>)</p></blockquote><blockquote><p>“<strong>그 도성</strong>에는 태양이나 달이 비칠 필요가 없습니다. 하느님의 영광이 그 도성을 밝혀 주며 어린 양이 그 도성의 등불이기 때문입니다. &lt;…&gt; 그 도성에는 밤이 없으므로 종일토록 대문들을 닫는 일이 없을 것입니다. &lt;…&gt; 그러나 <strong>더러운 것은 아무것도 그 도성으로 들어 가지 못하고 흉측한 짓과 거짓을 일삼는 자도 결코 들어가지 못합니다</strong>. 그 도성에 들어 갈 수 있는 자는 다만 어린 양의 생명의 책에 이름이 올라 있는 사람들뿐입니다.” (<a href="https://bibleox.com/ko/ko-ctb/otkr/21/#L23,25,27">묵시 21:23,25,27</a>)</p></blockquote>
