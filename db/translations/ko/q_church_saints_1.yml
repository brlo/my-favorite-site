  body: <ol><li><p><strong>거룩함</strong>은 어떤 것을 한 가지 목적을 위해 완전히 따로 떼어 놓는 것입니다.</p></li><li><p><strong>거룩함</strong>은 하느님께 바쳐진 삶의 방식입니다.</p></li><li><p><strong>성인</strong>은 죄 없이 하느님의 뜻대로 사는 사람입니다.</p></li></ol><blockquote><p>“<strong>그가 죽으심은 죄에 대하여 단번에 죽으심이요 그가 살아 계심은 하나님께 대하여 살아 계심이니</strong> 이와 같이 너희도 <strong>너희 자신을 죄에 대하여는 죽은 자요 그리스도 예수 안에서 하나님께 대하여는 살아 있는 자로 여길지어다</strong> 그러므로 너희는 <strong>죄가 너희 죽을 몸을 지배하지 못하게 하여</strong> 몸의 사욕에 순종하지 말고 또한 <strong>너희 지체를 불의의 무기로 죄에게 내주지 말고</strong> 오직 너희 자신을 죽은 자 가운데서 다시 살아난 자 같이 하나님께 드리며 너희 지체를 의의 무기로 하나님께 드리라 &lt;…&gt; 죄로부터 해방되어 의에게 종이 되었느니라 &lt;…&gt; 그러나 이제는 너희가 <strong>죄로부터 해방되고 하나님께 종이 되어 거룩함에 이르는 열매를 맺었으니</strong> 그 마지막은 영생이라” (<a href="https://bibleox.com/ko/ko-nkrv/rim/6/#L10-13,18,22">롬 6:10-13,18,22</a>)</p></blockquote><blockquote><p>“하나님께로부터 난 자마다 죄를 짓지 아니하나니 이는 하나님의 씨가 그의 속에 거함이요 그도 <strong>범죄하지 못하는 것은</strong> 하나님께로부터 났음이라” (<a href="https://bibleox.com/ko/ko-nkrv/1in/3/#L9">요일 3:9</a>)</p></blockquote><blockquote><p>“<strong>하나님께로부터 난 자는 다 범죄하지 아니하는 줄을</strong> 우리가 아노라 하나님께로부터 나신 자가 그를 지키시매 악한 자가 그를 만지지도 못하느니라” (<a href="https://bibleox.com/ko/ko-nkrv/1in/5/#L18">요일 5:18</a>)</p></blockquote><blockquote><p>“모든 사람과 더불어 <strong>화평함과</strong> <strong>거룩함을 따르라 이것이 없이는 아무도 주를 보지 못하리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/evr/12/#L14">히 12:14</a>)</p></blockquote><blockquote><p>“<strong>그 성은</strong> 해나 달의 비침이 쓸 데 없으니 이는 하나님의 영광이 비치고 어린 양이 그 등불이 되심이라 &lt;…&gt; 낮에 성문들을 도무지 닫지 아니하리니 거기에는 밤이 없음이라 &lt;…&gt; <strong>무엇이든지 속된 것이나 가증한 일 또는 거짓말하는 자는 결코 그리로 들어가지 못하되</strong> 오직 어린 양의 생명책에 기록된 자들만 들어가리라” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/21/#L23,25,27">계 21:23,25,27</a>)</p></blockquote>
