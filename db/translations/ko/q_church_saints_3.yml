  title: 성인 유해 공경
  copy_cover: true
  body: '<h2>거룩한 의인들의 유해를 공경하는 까닭</h2><p>거룩한 의인들의 유해는 의인들 자체를 공경하는 것과 같은 이유로 공경받습니다(자세한 내용은 <a href="https://bibleox.com/ru/ru/w/почитание-святых-в-Библии">성인 공경</a>에 있습니다). 곧 하느님께 참여하기 때문에, 그들 안에 하느님의 은총이 활동하기 때문입니다(<a href="https://bibleox.com/ru/ru/w/человек-храм-Божий">사람은 하느님의 성전</a>). 의인은 어떤 부분이 아니라 온전히 공경받습니다(<a href="https://bibleox.com/ru/ru/w/состав-человека">사람 본성의 구성</a>). <strong>영혼</strong>만이 아니라 <strong>몸</strong>(<a href="https://bibleox.com/ko/ko-nkrv/4ts/13/#L21">왕하 13:21</a>), 나아가 의인의 <strong>개인 소지품</strong>(<a href="https://bibleox.com/ko/ko-nkrv/act/19/#L12">행 19:12</a>)과 <strong>형상</strong>(<a href="https://bibleox.com/ko/ko-nkrv/act/5/#L15">행 5:15</a>)도 공경받습니다. 하느님께서는 이를 통해 은총을 주시어 기적과 치유를 행하십니다.</p><p>성인들은 <strong>하느님께 참여하고 그들 안에 하느님의 은총이 활동하기 때문에 공경받으며</strong>, 하느님께서는 성인들의 살아 있는 몸만이 아니라 죽은 몸을 통해서도 은총을 주시므로(<a href="https://bibleox.com/ko/ko-nkrv/4ts/13/#L21">왕하 13:21</a>), 성인들의 몸은 은총 때문에 생전에만이 아니라 죽은 뒤에도(몸과 영혼이 나뉜 뒤에도) 공경받습니다.</p><p>하느님께서는 당신 벗들의 유해를 꺼리지 않으십니다. 하느님께서는 의인들의 유해를 돌보시고(<a href="https://bibleox.com/ko/ko-nkrv/ps/34/#L19-20">시 34:19-20</a>; <a href="https://bibleox.com/ko/ko-nkrv/in/19/#L33,36">요 19:33,36</a>) 그것을 통해 계속 활동하십니다(<a href="https://bibleox.com/ko/ko-nkrv/4ts/13/#L21">왕하 13:21</a>). 향료를 가져간 여인들도 유해를 꺼리지 않았습니다. 그들은 구세주께서 돌아가신 지 사흘째에 그리스도의 죽은 몸에 향료를 바르려고 무덤을 열러 갔습니다(<a href="https://bibleox.com/ko/ko-nkrv/mk/16/#L1-3">막 16:1-3</a>). 모세의 율법은 친족 외에는 시신에 손대지 못하게 했는데도 말입니다(<a href="https://bibleox.com/ko/ko-nkrv/lev/21/#L1-4">레 21:1-4</a>).</p><h2>자주 묻는 질문</h2><h3>왜 유해가 땅이 아니라 성당에 있습니까?</h3><p><strong>성당은 의인의 유해를 모신 무덤입니다.</strong> 유해는 성당에서 석관(유해함, 궤)에 모십니다. 사람은 흙이므로 흙으로 돌아간다는 하느님의 말씀(<a href="https://bibleox.com/ko/ko-nkrv/gen/3/#L19">창 3:19</a>)은 흙으로 지어진[1] 사람의 몸이 다시 흙이 된다는, 곧 썩어 흩어져 본래의 것, 곧 흙이 된다는 뜻입니다.</p><p>많은 의인은 글자 그대로 땅에 묻히지 않았습니다. 오히려 의인들은 의인들을 특별한 방식으로 장사지내려 했고, 흔히 특별한 묘실을 택했습니다.</p><ol><li><p><strong>아브라함은 특별히 사들인 동굴에 가족을 묻었습니다.</strong> 그는 주민들에게 매장지를 구했고, 그들은 자기 묘지 가운데 <strong>가장 좋은</strong> 곳을 내주겠다고 했습니다(<a href="https://bibleox.com/ko/ko-nkrv/gen/23/#L2-6">창 23:2-6</a>). 결국 아브라함은 자기가 가리킨 동굴을 청하여 자기 소유로 사서(<a href="https://bibleox.com/ko/ko-nkrv/gen/23/#L7-13,17-20">창 23:7-13,17-20</a>) 그곳에 친족을 묻었습니다. 아브라함 자신도(<a href="https://bibleox.com/ko/ko-nkrv/gen/25/#L9-10">창 25:9-10</a>), 그의 아내 사라도(<a href="https://bibleox.com/ko/ko-nkrv/gen/23/#L19">창 23:19</a>), 이삭과 그의 아내 리브가도(<a href="https://bibleox.com/ko/ko-nkrv/gen/49/#L1,29-33">창 49:1,29-33</a>), 야곱과 그의 아내 레아도(<a href="https://bibleox.com/ko/ko-nkrv/gen/49/#L1,29-33">창 49:1,29-33</a>; <a href="https://bibleox.com/ko/ko-nkrv/gen/50/#L12-13">창 50:12-13</a>) 이 동굴에 묻혔습니다;</p></li><li><p><strong>주 예수 그리스도께서는 바위에 판 특별한 묘실에 묻히셨습니다.</strong> 부자인 아리마대 사람 요셉이 자기를 위해 판 곳입니다(<a href="https://bibleox.com/ko/ko-nkrv/mf/27/#L57,60">마 27:57,60</a>; <a href="https://bibleox.com/ko/ko-nkrv/mk/15/#L46">막 15:46</a>; <a href="https://bibleox.com/ko/ko-nkrv/lk/23/#L50-53">눅 23:50-53</a>; <a href="https://bibleox.com/ko/ko-nkrv/in/19/#L41">요 19:41</a>). 하느님께서 처음부터 그렇게 정하시어 예언자 이사야를 통해 미리 알리신 대로입니다: “그의 무덤이 악인들과 함께 있었으며 그가 죽은 후에 부자와 함께 있었도다”(<a href="https://bibleox.com/ko/ko-nkrv/is/53/#L9">사 53:9</a>);</p></li><li><p><strong>초기 그리스도인들은 흔히 카타콤바의 특별한 묘실에 의인들을 묻고</strong> 유해 곁에서 예배를 드렸습니다(<a href="https://bibleox.com/ru/ru/w/почитание-мощей-цитаты-святых">예</a> (러시아어));</p></li><li><p>300년 뒤인 4세기에 그리스도교에 안전한 때가 오자 성인들의 유해를 성당에 모시기 시작했습니다. 의로운 요셉처럼 석관에 넣기도 하고(<a href="https://bibleox.com/ko/ko-nkrv/gen/50/#L26">창 50:26</a>, <a href="https://bibleox.com/ru/ru/w/почитание-мощей-цитаты-святых">예</a> (러시아어)), 성당의 주요 부분(제단) 아래 특별한 묘실(지하 묘소)에 모시기도 하고, 특별한 별도의 건물(순교자 기념 성당)을 짓기도 했습니다(<a href="https://bibleox.com/ru/ru/w/почитание-мощей-цитаты-святых">예</a> (러시아어)).</p></li></ol><p>그러므로 <strong>아주 오래전부터 의인들은 의인들을 땅이 아니라 특별한 묘실에 모셨습니다.</strong> 오늘날 교회에서도 같습니다. 의인의 유해는 석관에 담겨 특별한 공간, 곧 예배를 드리는 성당에 모셔집니다.</p><p>어느 쪽으로 하든 본질은 같습니다:</p><ul><li><p>성인의 유해를 담은 석관을 모시려고 순교자 기념 성당을 짓고 교회가 거기 모여 예배를 드리거나,</p></li><li><p>반대로 예배를 드리려고 성당을 짓고 거기에 성인의 유해를 담은 석관을 모십니다.</p></li></ul><p>교회는 처음부터 성인들의 관을 모실 공간을 짓고 거기서 예배를 드립니다.</p><h3>유해의 이장</h3><p>성경에서 의인들의 유해를 옮긴 일은 여러 번 있었고 아무도 비난하지 않았습니다. 예를 들어 족장 요셉은 이집트에서 석관(유해함, 궤)에 모셔졌고(<a href="https://bibleox.com/ko/ko-nkrv/gen/50/#L26">창 50:26</a>), 나중에 예언자 모세와 백성은 요셉이 청한 곳에 묻으려고 40년 넘게 광야에서 요셉의 유해를 모시고 다녔습니다. 자세히는 <a href="#HH-성경에-나오는-유해에-관한-일화들">아래</a>에 있습니다.</p><h3>유해의 나눔</h3><p>아주 오래전부터 거룩한 의인들의 유해는 가장 잔혹한 고문(토막 내기, 불태우기) 뒤에 온전하지 않은 채, 모든 부분이 한꺼번에 오지 못한 채 교회에 왔습니다(<a href="https://bibleox.com/ko/ko-nkrv/mf/14/#L11">마 14:11</a>; <a href="https://bibleox.com/ko/ko-nkrv/mk/6/#L28">막 6:28</a>). 그 뒤에도 하느님께서는 유해가 모여 있든 아니든 의인들의 유해를 통해 활동하셨습니다. 교회는 의인의 유해가 온전히 보존되었다면 성당에 놓인 특별한 관(석관, 유해함)에 온전히 모십니다. 자연재해나 적의 공격 때 유해를 구하려고 어쩔 수 없이 나누기도 했습니다. 때로는 다른 곳에서 의인을 공경하도록 유해에서 아주 작은 조각을 떼어 냅니다.</p><h2>사람의 유해에 대한 하느님의 태도</h2><h3>하느님께서는 의인들의 유해를 지키십니다</h3><blockquote><p>“<strong><mark>의인은</mark></strong> 고난이 많으나 여호와께서 그의 모든 고난에서 건지시는도다 <strong><mark>그의 모든 뼈를 보호하심이여 그 중에서 하나도 꺾이지 아니하도다</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ps/34/#L19-20">시 34:19-20</a>)</p></blockquote><blockquote><p>“예수께 이르러서는 이미 죽으신 것을 보고 <strong>다리를 꺾지 아니하고</strong> &lt;…&gt; 이 일이 일어난 것은 <strong><mark>그 뼈가 하나도 꺾이지 아니하리라 한 성경을 응하게 하려 함이라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/in/19/#L33,36">요 19:33,36</a>)</p></blockquote><p>여기서 성인들의 유해에 대한 하느님의 태도를 볼 수 있습니다. 그럼에도 하느님께서는 때로 의인들의 고문, 심지어 참수까지 (원하시는 것은 아니지만) 허락하십니다. 예언자 세례 요한이 그러했습니다(<a href="https://bibleox.com/ko/ko-nkrv/mf/14/#L11">마 14:11</a>; <a href="https://bibleox.com/ko/ko-nkrv/mk/6/#L28">막 6:28</a>). 그러나 하느님께서는 나뉜 성인들의 유해를 통해서도 은총을 주십니다.</p><h3>하느님께서는 죄인들의 유해를 치욕에 넘기십니다</h3><blockquote><p>“그들이 두려움이 없는 곳에서 크게 두려워하였으니 <strong><mark>너를 대항하여 진 친 그들의 뼈를 하나님이 흩으심이라</mark></strong> 하나님이 그들을 버리셨으므로 네가 그들에게 수치를 당하게 하였도다” (<a href="https://bibleox.com/ko/ko-nkrv/ps/53/#L5">시 53:5</a>)</p></blockquote><h2>하느님께서는 의인의 죽은 몸을 통해 계속 활동하십니다</h2><p>예언자 엘리사의 유해에 닿자 죽은 사람이 살아났습니다. 곁에서 기도한 흔적도 없습니다:</p><blockquote><p>“마침 사람을 장사하는 자들이 그 도적 떼를 보고 그의 시체를 엘리사의 묘실에 들이던지매 <strong><mark>시체가 엘리사의 뼈에 닿자 곧 회생하여 일어섰더라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/4ts/13/#L21">왕하 13:21</a>)</p></blockquote><h2>하느님께서는 의인이 몸에 지녔던 물건을 통해 계속 활동하십니다</h2><p>사도의 옷으로 인한 치유:</p><blockquote><p>“심지어 사람들이 <strong><mark>바울의 몸에서 손수건이나 앞치마를</mark></strong> 가져다가 병든 사람에게 얹으면 그 병이 떠나고 악귀도 나가더라” (<a href="https://bibleox.com/ko/ko-nkrv/act/19/#L12">행 19:12</a>)</p></blockquote><h2>하느님께서는 의인의 형상을 통해 활동하십니다</h2><p>사도의 형상으로 인한 치유:</p><blockquote><p>“심지어 <strong>병든 사람을 메고 거리에 나가</strong> 침대와 요 위에 누이고 <strong>베드로가 지날 때에 혹 그의 그림자라도 누구에게 덮일까 바라고</strong> 예루살렘 부근의 수많은 사람들도 모여 병든 사람과 더러운 귀신에게 괴로움 받는 사람을 데리고 와서 <strong>다 나음을 얻으니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/act/5/#L15-16">행 5:15-16</a>)</p></blockquote><h2>성인에게 드리는 절</h2><p>십계명의 둘째 계명(<a href="https://bibleox.com/ko/ko-nkrv/ish/20/#L2-3">출 20:2-3</a>; <a href="https://bibleox.com/ko/ko-nkrv/vtor/5/#L6-7">신 5:6-7</a>)은 거짓 신(우상) 숭배를 금합니다. 거짓 신은 거짓일 뿐 아니라 존재하지도 않습니다.</p><p>그러나 성인들은 존재하고 하느님의 벗이며, 신으로 숭배받지 않습니다. 성인과 그 유해에게 드리는 절은 하느님의 벗인 그분들에 대한 존경의 표현입니다. 천사와 사람과 사물에게 드리는 이런 절은 성경에 나오며 우상 숭배가 아닙니다. 우상 숭배는 거짓 신을 숭배하는 것이기 때문입니다. 의인들은 사람과 여러 사물과 천사에게 늘 절하고, 다른 사람들은 예언자에게 절합니다.</p><h4>천사의 모습으로 나타나신 하느님께 드리는 절</h4><blockquote><p>“눈을 들어 본즉 <strong>사람 셋이</strong> 맞은편에 서 있는지라 그가 그들을 보자 곧 장막 문에서 달려나가 영접하며 <strong>몸을 땅에 굽혀</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gen/18/#L2">창 18:2</a>)</p></blockquote><h4>천사에게 드리는 절</h4><blockquote><p>“그가 이르되 아니라 나는 여호와의 군대 대장으로 지금 왔느니라 하는지라 여호수아가 <strong>얼굴을 땅에 대고 엎드려 절하고</strong> 그에게 이르되 내 주여 종에게 무슨 말씀을 하려 하시나이까” (<a href="https://bibleox.com/ko/ko-nkrv/nav/5/#L14">수 5:14</a>)</p></blockquote><h4>예언자에게 드리는 절</h4><blockquote><p>“맞은편 여리고에 있는 선지자의 제자들이 그를 보며 말하기를 엘리야의 성령이 하시는 역사가 엘리사 위에 머물렀다 하고 가서 그에게로 나아가 <strong>땅에 엎드려 그에게 경배하고</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/4ts/2/#L15">왕하 2:15</a>)</p></blockquote><h4>성전을 향한 절</h4><blockquote><p>“오직 나는 주의 풍성한 사랑을 힘입어 주의 집에 들어가 주를 경외함으로 <strong>성전을 향하여 예배하리이다</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ps/5/#L7">시 5:7</a>)</p></blockquote><h4>하느님의 발판에 드리는 절</h4><blockquote><p>“너희는 여호와 우리 하나님을 높여 <strong>그의 발등상 앞에서 경배할지어다</strong> <strong>그는 거룩하시도다</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ps/99/#L5">시 99:5</a>)</p></blockquote><blockquote><p>“우리가 <strong>그의 계신 곳으로 들어가서 그의 발등상 앞에서 엎드려 예배하리로다</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ps/132/#L7">시 132:7</a>)</p></blockquote><h4>궤 앞의 절</h4><blockquote><p>“여호수아가 옷을 찢고 이스라엘 장로들과 함께 <strong>여호와의 궤 앞에서 땅에 엎드려</strong> 머리에 티끌을 뒤집어쓰고 저물도록 있다가” (<a href="https://bibleox.com/ko/ko-nkrv/nav/7/#L6">수 7:6</a>)</p></blockquote><h4>지팡이에 드리는 절</h4><blockquote><p>“야곱이 또 이르되 내게 맹세하라 하매 그가 맹세하니 <strong>이스라엘이 침상 머리에서 하나님께 경배하니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gen/47/#L31">창 47:31</a>; <a href="https://bibleox.com/ko/ko-nkrv/evr/11/#L21">히 11:21</a>) <em>(칠십인역에는 “지팡이 끝에”(προσεκύνησεν Ισραηλ ἐπὶ τὸ ἄκρον τῆς ῥάβδου αὐτοῦ)로 되어 있습니다. 히브리서 11:21도 같습니다.)</em></p></blockquote><p>더 많은 예: <a href="https://bibleox.com/ru/ru/w/поклоны">절</a>.</p><h2>성경에 나오는 유해에 관한 일화들</h2><h3>장사 뒤 사흘째에 향료를 가져간 여인들은 무덤을 열고 주 예수 그리스도의 거룩한 몸에 손을 대려고 갔습니다</h3><blockquote><p>“안식일이 지나매 막달라 마리아와 야고보의 어머니 마리아와 또 살로메가 가서 <strong>예수께 바르기 위하여 향품을 사다 두었다가</strong> 안식 후 첫날 매우 일찍이 해 돋을 때에 그 무덤으로 가며 서로 말하되 <strong>누가 우리를 위하여 무덤 문에서 돌을 굴려 주리요</strong> 하더니” (<a href="https://bibleox.com/ko/ko-nkrv/mk/16/#L1-3">막 16:1-3</a>)</p></blockquote><blockquote><p>“안식 후 첫날 새벽에 이 여자들이 <strong>그 준비한 향품을 가지고 무덤에 가서</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/lk/24/#L1">눅 24:1</a>)</p></blockquote><blockquote><p>“안식일이 다 지나고 안식 후 첫날이 되려는 새벽에 막달라 마리아와 다른 마리아가 <strong>무덤을 보려고 갔더니</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/28/#L1">마 28:1</a>)</p></blockquote><blockquote><p>“안식 후 첫날 일찍이 아직 어두울 때에 막달라 마리아가 <strong>무덤에 와서</strong> 돌이 무덤에서 옮겨진 것을 보고” (<a href="https://bibleox.com/ko/ko-nkrv/in/20/#L1">요 20:1</a>)</p></blockquote><h3>유해의 이장</h3><h4>요셉</h4><p>요셉(야곱의 아들)은 나중에 자기 유해를 이집트에서 하느님께서 주시겠다고 약속하신 땅으로 옮겨 달라고 청합니다:</p><blockquote><p>“요셉이 그의 형제들에게 이르되 나는 죽을 것이나 하나님이 당신들을 돌보시고 당신들을 이 땅에서 인도하여 내사 아브라함과 이삭과 야곱에게 맹세하신 땅에 이르게 하시리라 하고 요셉이 또 이스라엘 자손에게 맹세시켜 이르기를 하나님이 반드시 당신들을 돌보시리니 <strong>당신들은 여기서 내 해골을 메고 올라가겠다 하라</strong> 하였더라” (<a href="https://bibleox.com/ko/ko-nkrv/gen/50/#L24-25">창 50:24-25</a>)</p></blockquote><p>요셉이 죽자 이집트에서 석관(유해함, 궤)에 모십니다:</p><blockquote><p>“요셉이 백십 세에 죽으매 그들이 <strong>그의 몸에 향 재료를 넣고 애굽에서 입관하였더라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gen/50/#L26">창 50:26</a>)</p></blockquote><p>예언자 모세는 요셉의 청을 이룹니다:</p><blockquote><p>“그러므로 하나님이 홍해의 광야 길로 돌려 백성을 인도하시매 이스라엘 자손이 애굽 땅에서 대열을 지어 나올 때에 <strong>모세가 요셉의 유골을 가졌으니</strong> 이는 요셉이 이스라엘 자손으로 단단히 맹세하게 하여 이르기를 하나님이 반드시 너희를 찾아오시리니 너희는 내 유골을 여기서 가지고 나가라 하였음이더라” (<a href="https://bibleox.com/ko/ko-nkrv/ish/13/#L18-19">출 13:18-19</a>)</p></blockquote><p>예언자 모세와 이스라엘 백성은 요셉의 유해와 함께 <strong>40년 넘게</strong> 시내 반도를 다녔습니다. 나중에 눈의 아들 여호수아가 요셉의 유해를 세겜에 묻습니다(<a href="https://bibleox.com/ko/ko-nkrv/nav/24/#L32">수 24:32</a>).</p><p>시내 광야의 40년 여정, 곧 이스라엘이 이집트 종살이에서 약속의 땅으로 나아간 일이 사람들을 죄의 종살이에서 하느님께서 약속하신 하늘 나라로 이끄는 신약 교회의 삶의 예표임을 생각하면, 교회 생활의 이 모든 기간 내내 하느님의 백성은 의인의 유해를 늘 지니고 있었습니다. 교회의 구약적 표상은 자기 나라에 이를 때까지 의인의 유해를 늘 지니고 있었습니다.</p><h4>사울</h4><p>사울은 불레셋 사람들에게 죽었고, 야베스 주민들은 시신을 태워 뼈를 자기 성읍의 나무 아래 묻었습니다:</p><blockquote><p>“그의 갑옷은 아스다롯의 집에 두고 그의 시체는 벧산 성벽에 못 박으매 길르앗 야베스 주민들이 블레셋 사람들이 사울에게 행한 일을 듣고 모든 장사들이 일어나 밤새도록 달려가서 <strong>사울의 시체와 그의 아들들의 시체를 벧산 성벽에서 내려</strong> 가지고 야베스에 돌아가서 <strong>거기서 불사르고 그의 뼈를 가져다가 야베스 에셀 나무 아래에 장사하고</strong> 칠 일 동안 금식하였더라” (<a href="https://bibleox.com/ko/ko-nkrv/1ts/31/#L10-13">삼상 31:10-13</a>; <a href="https://bibleox.com/ko/ko-nkrv/1par/10/#L12">대상 10:12</a>)</p></blockquote><p>다윗은 사울의 유해를 베냐민 땅으로 옮겨 사울의 아버지 유해와 함께 묻습니다:</p><blockquote><p>“다윗이 가서 <strong>사울의 뼈와 그의 아들 요나단의 뼈를</strong> 길르앗 야베스 사람에게서 가져가니 이는 전에 블레셋 사람들이 사울을 길보아에서 죽여 블레셋 사람들이 벧산 거리에 매단 것을 그들이 가만히 가져온 것이라 다윗이 그 곳에서 <strong>사울의 뼈와 그의 아들 요나단의 뼈를 가지고 올라오매</strong> 사람들이 그 달려 죽은 자들의 뼈를 거두어다가 <strong>사울과 그의 아들 요나단의 뼈와 함께</strong> 베냐민 땅 셀라에서 <strong>그의 아버지 기스의 묘에 장사하되</strong> 모두 왕의 명령을 따라 행하니라 그 후에야 하나님이 그 땅을 위한 기도를 들으시니라” (<a href="https://bibleox.com/ko/ko-nkrv/2ts/21/#L12-14">삼하 21:12-14</a>)</p></blockquote><h3>장례가 늦어진 경우</h3><p>야곱은 77일이 넘어 장사되었습니다:</p><blockquote><p>“요셉이 그의 아버지 얼굴에 구푸려 울며 입맞추고 그 수종 드는 의원에게 명하여 아버지의 몸을 향으로 처리하게 하매 의원이 이스라엘에게 그대로 하되 사십 일이 걸렸으니 향으로 처리하는 데는 이 날수가 걸림이며 애굽 사람들은 <strong>칠십 일 동안 그를 위하여 곡하였더라</strong> &lt;…&gt; 우리 아버지가 나로 맹세하게 하여 이르되 내가 죽거든 <strong>가나안 땅에 내가 파 놓은 묘실에 나를 장사하라</strong> 하였나니 나로 올라가서 아버지를 장사하게 하소서 내가 다시 오리이다 하라 하였더니 &lt;…&gt; 그들이 요단 강 건너편 아닷 타작 마당에 이르러 거기서 크게 울고 애통하며 요셉이 아버지를 위하여 칠 일 동안 애곡하였더니” (<a href="https://bibleox.com/ko/ko-nkrv/gen/50/#L1-3,5,10">창 50:1-3,5,10</a>)</p></blockquote><h3>예언자가 다른 예언자의 유해와 함께 묻히기를 청합니다</h3><blockquote><p>“<strong>늙은 선지자가</strong> 하나님의 사람의 시체를 들어 나귀에 실어 가지고 돌아와 자기 성읍으로 들어가서 슬피 울며 장사하되 곧 그의 시체를 자기의 묘실에 두고 오호라 내 형제여 하며 그를 위하여 슬피우니라 그 사람을 장사한 후에 그가 그 아들들에게 말하여 이르되 <strong>내가 죽거든 하나님의 사람을 장사한 묘실에 나를 장사하되 내 뼈를 그의 뼈 곁에 두라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/3ts/13/#L29-31">왕상 13:29-31</a>)</p></blockquote><h2>야곱이 아내의 유해를 공경합니다</h2><blockquote><p>“라헬이 죽으매 에브랏 곧 베들레헴 길에 장사되었고 <strong>야곱이 라헬의 묘에 비를 세웠더니</strong> 지금까지 라헬의 묘비라 일컫더라” (<a href="https://bibleox.com/ko/ko-nkrv/gen/35/#L19-20">창 35:19-20</a>)</p></blockquote><h2>요시야 왕이 예언자의 유해를 공경합니다</h2><p>요시야에 관해서는 마음과 영혼과 힘을 다해 하느님께 돌아간 왕이 그 전에도 후에도 없었다고 합니다(<a href="https://bibleox.com/ko/ko-nkrv/4ts/23/#L25">왕하 23:25</a>). 유다 왕 요시야는 어려서부터 하느님께 순종했고, 장성하자 나라에서 이교를 없애기 시작했습니다. 그는 이교 신상과 제단과 분향하는 산당과 거룩한 숲을 없애고, 우상 사제들의 봉사를 금하고, 마술사와 혼백을 부르는 자들을 없애고, 예루살렘의 하느님 성전에서 이교의 물건들을 없애고 수리했으며, 성경을 찾아내어 백성에게 읽어 주었고, 백성은 하느님과 계약을 맺었습니다. 요시야는 이교의 성소를 없앴을 뿐 아니라 사람의 뼈를 흩어 그것을 더럽히려 했습니다:</p><blockquote><p>“또 예루살렘 앞 멸망의 산 오른쪽에 세운 산당들을 왕이 더럽게 하였으니 이는 옛적에 이스라엘 왕 솔로몬이 시돈 사람의 가증한 아스다롯과 모압 사람의 가증한 그모스와 암몬 자손의 가증한 밀곰을 위하여 세웠던 것이며 왕이 또 석상들을 깨뜨리며 아세라 목상들을 찍고 <strong>사람의 해골로 그 곳에 채웠더라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/4ts/23/#L13-14">왕하 23:13-14</a>)</p></blockquote><p>요시야는 여로보암의 옛 우상을 없애고 그곳의 무덤을 더럽혔습니다:</p><blockquote><p>“또한 이스라엘에게 범죄하게 한 느밧의 아들 여로보암이 벧엘에 세운 제단과 산당들을 왕이 헐고 또 그 산당을 불사르고 빻아서 가루를 만들며 또 아세라 목상을 불살랐더라 <strong>요시야가 몸을 돌이켜 산에 있는 무덤들을 보고 보내어 그 무덤에서 해골을 가져다가 제단 위에서 불살라 그 제단을 더럽게 하니라</strong> 이 일을 하나님의 사람이 전하였더니 그 전한 여호와의 말씀대로 되었더라” (<a href="https://bibleox.com/ko/ko-nkrv/4ts/23/#L15-16">왕하 23:15-16</a>)</p></blockquote><p>그러나 그는 어떤 비석을 만나 이것이 이 일을 예언한 예언자의 무덤임을 알자 그 유해를 공경하여 대합니다. 게다가 비석이 있다는 것 자체가 예언자를 일찍부터 공경했음을 보여 줍니다:</p><blockquote><p>“요시야가 이르되 <strong>내게 보이는 저것은 무슨 비석이냐</strong> 하니 성읍 사람들이 그에게 말하되 왕께서 벧엘의 제단에 대하여 행하신 이 일을 전하러 <strong>유다에서 왔던 하나님의 사람의 묘실이니이다</strong> 하니라 이르되 <strong><mark>그대로 두고 그의 뼈를 옮기지 말라 하매 무리가 그의 뼈와 사마리아에서 온 선지자의 뼈는 그대로 두었더라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/4ts/23/#L17-18">왕하 23:17-18</a>)</p></blockquote><p>이 하느님의 사람은 일찍이 이런 일이 일어나리라고 예언했습니다:</p><blockquote><p>“하나님의 사람이 제단을 향하여 여호와의 말씀으로 외쳐 이르되 제단아 제단아 여호와께서 이와 같이 말씀하시기를 <strong>다윗의 집에 요시야라 이름하는 아들을 낳으리니</strong> <strong>그가 네 위에 분향하는 산당 제사장을 네 위에서 제물로 바칠 것이요 또 사람의 뼈를 네 위에서 사르리라</strong> 하셨느니라 하고” (<a href="https://bibleox.com/ko/ko-nkrv/3ts/13/#L2">왕상 13:2</a>)</p></blockquote><h2>시몬이 가족의 유해를 공경합니다</h2><p>대사제 <a href="https://en.wikipedia.org/wiki/Jonathan_Apphus">요나단</a>(<a href="https://bibleox.com/ko/gr-lxx-byz/1mak/10/#L20">1마카 10:20</a>; <a href="https://bibleox.com/ko/gr-lxx-byz/1mak/11/#L57">1마카 11:57</a>)은 바스카마에 묻혔습니다. 나중에 그의 형제 대사제 시몬(<a href="https://bibleox.com/ko/gr-lxx-byz/1mak/13/#L36,42">1마카 13:36,42</a>)은 그의 유해를 조상들의 도성 모데인으로 옮겼습니다. 유다도 전에 그곳에 묻혔습니다(<a href="https://bibleox.com/ko/gr-lxx-byz/1mak/9/#L19">1마카 9:19</a>). 시몬은 큰 건축물을 세워 가족의 유해를 공경하려 했습니다:</p><blockquote><p>“그는 요나단을 죽였고, <strong>요나단은 그곳에 묻혔다</strong>. … 시몬은 사람을 보내어 <strong>자기 형제 요나단의 뼈를 가져다가 조상들의 도성 모데인에 묻었다</strong>. … 시몬은 아버지와 형제들의 무덤 위에 건축물을 세워 다듬은 돌로 높였고 … 기둥 위에 <strong>영원한 이름을 위해</strong> 갑옷 장식을 만들었다. <strong>이것이 그가 모데인에 만든 무덤</strong>이며 오늘날까지 있다” (<a href="https://bibleox.com/ko/gr-lxx-byz/1mak/13/#L23-30">1마카 13:23-30</a>, 그리스어에서 번역)</p></blockquote><h2>관련 구절</h2><ol><li><p><a href="https://bibleox.com/ru/ru/w/почитание-святых-в-Библии">성인 공경</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/иконы-иконопочитание-иконоборчество">이콘 공경</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/молитвы-святым">성인들에게 드리는 기도</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/человек-храм-Божий">사람은 하느님의 성전</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/состав-человека">사람의 구성</a></p></li></ol>'
  title_sub: 거룩한 의인들의 유해 공경
