  references: "<ol><li><p>모든 생물은 몸을 이루기 위해 땅에 있는 것을 먹거나, 땅의 것을 먹는 것들을 먹습니다.</p></li></ol><p>번역: 로디온 블라소프 (AI 도구 활용). 저본: 러시아어 원문. 참고: 영어·일본어 번역. 성경 인용과 링크는 공동번역 성서에 따름.</p>"
- src: страдание-за-Христа
  path: Sf7x_그리스도를_위한_고난
  title: 그리스도를 위한 고난
  copy_cover: true
  body: <h2>그리스도인에게는 믿는 것만이 아니라 그리스도를 위해 고난받는 것도 허락됩니다</h2><blockquote><p>“여러분은 그리스도의 복음을 받은 사람다운 생활을 하십시오. 그리고 내가 여러분을 찾아 가서 만나게 되든지 이렇게 떨어져 있든지간에 나는 여러분이 복음의 교리를 위하여 한 마음 한 뜻으로 굳게 서서 분투 노력하며 반대자들이 무슨 짓을 하더라도 조금도 겁내지 않는다는 소식을 듣고 싶습니다. 그러한 용기가 그들에게는 멸망의 징조가 되고 여러분에게는 <strong>구원의 징조</strong>가 될 것입니다. 구원은 하느님께서 주시는 것입니다. 여러분은 <strong><mark>그리스도를 믿을 특권뿐만 아니라 그분을 위해서 고난까지 당하는 특권</mark></strong>, 곧 그리스도를 섬기는 특권을 받았습니다. 여러분은 내가 전에 그리스도를 위해서 싸우는 것을 보았고 또 지금도 계속해서 싸우고 있다는 것을 듣고 있을 터이지만 지금 여러분도 <strong>같은 싸움을</strong> 하고 있습니다.” (<a href="https://bibleox.com/ko/ko-ctb/fil/1/#L27-30">필립 1:27-30</a>)</p></blockquote><h2>그리스도 때문에 받을 박해에 관한 예언</h2><blockquote><p>“종은 그 주인보다 더 나을 수가 없다고 한 내 말을 기억하여라. <strong><mark>그들이 나를 박해했으면 너희도 박해할 것이고</mark></strong> 내 말을 지켰으면 너희의 말도 지킬 것이다.” (<a href="https://bibleox.com/ko/ko-ctb/in/15/#L20">요한 15:20</a>)</p></blockquote><blockquote><p>“옳은 일을 하다가 박해를 받는 사람은 행복하다. 하늘 나라가 그들의 것이다. <strong><mark>나 때문에 모욕을 당하고 박해를 받으며 터무니없는 말로 갖은 비난을 다 받게 되면 너희는 행복하다</mark></strong>. 기뻐하고 즐거워하여라. <strong>너희가 받을 큰 상이 하늘에 마련되어 있다</strong>. 옛 예언자들도 너희에 앞서 같은 박해를 받았다.‘” (<a href="https://bibleox.com/ko/ko-ctb/mf/5/#L10-12">마태 5:10-12</a>)</p></blockquote><blockquote><p>“<strong><mark>사람의 아들 때문에 사람들에게 미움을 사고 내어 쫓기고 욕을 먹고 누명을 쓰면 너희는 행복하다</mark></strong>. 그럴 때에 너희는 기뻐하고 즐거워하라. <strong>하늘에서 너희가 받을 상이 클 것이다</strong>. 그들의 조상들도 예언자들을 그렇게 대하였다.” (<a href="https://bibleox.com/ko/ko-ctb/lk/6/#L22-23">루가 6:22-23</a>)</p></blockquote><h2>예언의 성취</h2><p>사도들은 그리스도를 위해 고난받은 것을 기뻐했습니다:</p><blockquote><p>“사도들은 <strong><mark>예수의 이름으로 말미암아 모욕을 당하게 된 것을 특권으로 생각하고 기뻐하면서</mark></strong> 의회를 물러 나왔다.” (<a href="https://bibleox.com/ko/ko-ctb/act/5/#L41">사도 5:41</a>)</p></blockquote><blockquote><p>“우리는 그리스도를 위하여 바보가 되었고 여러분은 그리스도를 믿어 현명한 사람이 되었습니다. 우리는 약자이고 여러분은 강자입니다. 여러분은 명예를 누리고 있는데 우리는 멸시만 받습니다. 우리는 <strong>지금 이 시간에도</strong> 굶주리고 목마르고 헐벗고 매맞으며 집없이 떠돌아 다니고 있습니다. 그리고 손발이 부르트도록 노동을 하고 있습니다. 그러면서 <strong><mark>우리를 욕하는 사람을 축복해 주고</mark></strong> <strong><mark>우리가 받는 박해를 참아 내고</mark></strong> <strong><mark>비방을 받을 때는</mark></strong> 좋은 말로 대답해 줍니다. 그래서 우리는 지금도 이 세상의 쓰레기처럼 인간의 찌꺼기처럼 살고 있습니다.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/4/#L10-13">1고린 4:10-13</a>)</p></blockquote><h2>그리스도를 위한 고난을 두려워하지 말라는 부름</h2><blockquote><p>“사랑하는 여러분, <strong>시련의 불길이 여러분 가운데 일어나더라도</strong> 그것은 여러분을 시험하려는 것이니 무슨 큰 일이나 생긴 것처럼 놀라지 마십시오. 여러분은 그리스도의 고난에 참여하는 것이니 오히려 기뻐하십시오. 여러분은 그리스도께서 영광스럽게 나타나실 때에 기뻐서 뛰며 즐거워하게 될 것입니다. <strong><mark>여러분이 그리스도 때문에 모욕을 당하면 행복합니다</mark></strong>. 영광의 성령 곧 하느님의 성령이 여러분에게 머물러 계시기 때문입니다. 여러분 중에는 아무도 살인자나 도둑이나 악한이나 사기한 따위가 되어 고난을 당하는 사람이 없도록 하십시오. 그러나 <strong><mark>여러분이 그리스도인이기 때문에 고난을 당한다면 부끄러워하지 말고 오히려 그리스도인이 된 것을 하느님께 감사하십시오</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/1pet/4/#L12-16">1베드 4:12-16</a>)</p></blockquote><blockquote><p>“여러분이 선한 일에 열성을 낸다면 누가 여러분을 해치겠습니까? 그러나 만일 여러분이 <strong>옳은 일을 하다가 고난을 받는다 해도 여러분은 행복합니다</strong>. 사람들이 여러분을 협박하더라도 무서워하거나 흔들리지 마십시오.” (<a href="https://bibleox.com/ko/ko-ctb/1pet/3/#L13-14">1베드 3:13-14</a>)</p></blockquote><h2>그리스도 때문에 받는 박해를 견디는 이들에게 약속된 상</h2><p>그리스도를 위한 고난은 구원의 표지입니다:</p><blockquote><p>“여러분은 그리스도의 복음을 받은 사람다운 생활을 하십시오. 그리고 내가 여러분을 찾아 가서 만나게 되든지 이렇게 떨어져 있든지간에 나는 여러분이 복음의 교리를 위하여 한 마음 한 뜻으로 굳게 서서 분투 노력하며 <strong>반대자들이 무슨 짓을 하더라도 조금도 겁내지 않는다</strong>는 소식을 듣고 싶습니다. 그러한 용기가 그들에게는 멸망의 징조가 되고 여러분에게는 <strong>구원의 징조</strong>가 될 것입니다. 구원은 하느님께서 주시는 것입니다. 여러분은 그리스도를 믿을 특권뿐만 아니라 <strong>그분을 위해서 고난까지 당하는 특권</strong>, 곧 그리스도를 섬기는 특권을 받았습니다. 여러분은 내가 전에 그리스도를 위해서 싸우는 것을 보았고 또 지금도 계속해서 싸우고 있다는 것을 듣고 있을 터이지만 지금 여러분도 <strong>같은 싸움을</strong> 하고 있습니다.” (<a href="https://bibleox.com/ko/ko-ctb/fil/1/#L27-30">필립 1:27-30</a>)</p></blockquote><p>그리스도와 함께 고난받는 사람은 그분과 함께 영광도 받습니다:</p><blockquote><p>“자녀가 되면 또한 상속자도 되는 것입니다. 과연 우리는 하느님의 상속자로서 그리스도와 함께 상속을 받을 사람입니다. 우리가 <strong>그리스도와 함께 고난을 받고 있으니 영광도 그와 함께 받을 것이 아닙니까</strong>?” (<a href="https://bibleox.com/ko/ko-ctb/rim/8/#L17">로마 8:17</a>)</p></blockquote><p>그리스도와 함께 죽는 사람은 그분과 함께 살고 다스립니다. 그리스도께서는 당신을 부인하는 사람을 부인하십니다:</p><blockquote><p>“예수 그리스도를 기억하시오. 그분은 다윗의 후손이며 죽은 자들 가운데서 다시 살아나신 분이십니다. 내가 전한 <strong>복음</strong>이 바로 이것입니다. 나는 <strong>이 복음을 위해서 고통을 당하고 죄인처럼 감옥에 갇히기까지</strong> 했습니다. 그러나 하느님의 말씀이 감옥에 갇혀 있는 것은 아닙니다. 그러므로 나는 하느님께서 뽑으신 사람들이 그리스도 예수를 믿고 구원과 영원한 영광을 얻기를 바라는 마음으로 모든 것을 참고 있습니다. <strong>우리가 그분과 함께 죽었으니 그분과 함께 살 것이고 우리가 끝까지 참고 견디면 그분과 함께 다스리게 될 것이다. 우리가 그분을 모른다고 하면 그분도 우리를 모른다고 하실 것이다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/2tim/2/#L8-12">2디모 2:8-12</a>)</p></blockquote><p>주님 안에서 죽는 이들은 복됩니다:</p><blockquote><p>“나는 또 ‘이제부터는 <strong>주님을 섬기다가 죽는 사람들이 행복하다</strong>고 기록하여라’하고 외치는 소리가 하늘에서 나는 것을 들었습니다. 그러자 성령께서 ‘옳은 말이다. 그들은 수고를 그치고 쉬게 될 것이다. 그들의 업적이 언제나 남아 있기 때문이다’하고 말씀하셨습니다.” (<a href="https://bibleox.com/ko/ko-ctb/otkr/14/#L13">묵시 14:13</a>)</p></blockquote><p>그리스도 때문에 죽임을 당한 이들의 영혼은 하늘에서 그분과 함께 삽니다:</p><blockquote><p>“어린 양이 다섯째 봉인을 떼셨을 때에 나는 <strong>하느님의 말씀 때문에 그리고 그 말씀을 증언했기 때문에 죽임을 당한 사람들의 영혼</strong>이 제단 아래 자리잡고 있는 것을 보았습니다. 그들은 큰 소리로 ‘<strong>거룩하시고 진실하신 대왕님, 우리가 얼마나 더 오래 기다려야 땅 위에 사는 자들을 심판하시고 또 우리가 흘린 피의 원수를 갚아 주시겠습니까</strong>?’하고 부르짖었습니다. 또 그들은 <strong>흰 두루마기 한 벌씩을 받았습니다</strong>. 그리고 <strong>그들처럼 죽임을 당하기로 되어 있는 동료 종들과 형제들이 다 죽어서 그 수가 찰 때까지</strong> 잠시 쉬라는 분부를 받았습니다.” (<a href="https://bibleox.com/ko/ko-ctb/otkr/6/#L9-11">묵시 6:9-11</a>)</p></blockquote>
