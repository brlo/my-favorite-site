  references: "<ol><li><p>모든 생물은 몸을 이루기 위해 땅에 있는 것을 먹거나, 땅의 것을 먹는 것들을 먹습니다.</p></li></ol><p>번역: 로디온 블라소프 (AI 도구 활용). 저본: 러시아어 원문. 참고: 영어·일본어 번역. 성경 인용과 링크는 개역개정에 따름.</p>"
- src: страдание-за-Христа
  path: Sf7x_그리스도를_위한_고난
  title: 그리스도를 위한 고난
  copy_cover: true
  body: <h2>그리스도인에게는 믿는 것만이 아니라 그리스도를 위해 고난받는 것도 허락됩니다</h2><blockquote><p>“오직 너희는 그리스도의 복음에 합당하게 생활하라 이는 내가 너희에게 가 보나 떠나 있으나 너희가 한마음으로 서서 한 뜻으로 복음의 신앙을 위하여 협력하는 것과 무슨 일에든지 대적하는 자들 때문에 두려워하지 아니하는 이 일을 듣고자 함이라 이것이 그들에게는 멸망의 증거요 너희에게는 <strong>구원의 증거니</strong> 이는 하나님께로부터 난 것이라 <strong><mark>그리스도를 위하여 너희에게 은혜를 주신 것은 다만 그를 믿을 뿐 아니라 또한 그를 위하여 고난도 받게 하려 하심이라</mark></strong> 너희에게도 <strong>그와 같은 싸움이</strong> 있으니 너희가 내 안에서 본 바요 이제도 내 안에서 듣는 바니라” (<a href="https://bibleox.com/ko/ko-nkrv/fil/1/#L27-30">빌 1:27-30</a>)</p></blockquote><h2>그리스도 때문에 받을 박해에 관한 예언</h2><blockquote><p>“내가 너희에게 종이 주인보다 더 크지 못하다 한 말을 기억하라 <strong><mark>사람들이 나를 박해하였은즉 너희도 박해할 것이요</mark></strong> 내 말을 지켰은즉 너희 말도 지킬 것이라” (<a href="https://bibleox.com/ko/ko-nkrv/in/15/#L20">요 15:20</a>)</p></blockquote><blockquote><p>“의를 위하여 박해를 받은 자는 복이 있나니 천국이 그들의 것임이라 <strong><mark>나로 말미암아 너희를 욕하고 박해하고 거짓으로 너희를 거슬러 모든 악한 말을 할 때에는 너희에게 복이 있나니</mark></strong> 기뻐하고 즐거워하라 <strong>하늘에서 너희의 상이 큼이라</strong> 너희 전에 있던 선지자들도 이같이 박해하였느니라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/5/#L10-12">마 5:10-12</a>)</p></blockquote><blockquote><p>“<strong><mark>인자로 말미암아 사람들이 너희를 미워하며 멀리하고 욕하고 너희 이름을 악하다 하여 버릴 때에는 너희에게 복이 있도다</mark></strong> 그 날에 기뻐하고 뛰놀라 <strong>하늘에서 너희 상이 큼이라</strong> 그들의 조상들이 선지자들에게 이와 같이 하였느니라” (<a href="https://bibleox.com/ko/ko-nkrv/lk/6/#L22-23">눅 6:22-23</a>)</p></blockquote><h2>예언의 성취</h2><p>사도들은 그리스도를 위해 고난받은 것을 기뻐했습니다:</p><blockquote><p>“사도들은 <strong><mark>그 이름을 위하여 능욕 받는 일에 합당한 자로 여기심을 기뻐하면서</mark></strong> 공회 앞을 떠나니라” (<a href="https://bibleox.com/ko/ko-nkrv/act/5/#L41">행 5:41</a>)</p></blockquote><blockquote><p>“우리는 그리스도 때문에 어리석으나 너희는 그리스도 안에서 지혜롭고 우리는 약하나 너희는 강하고 너희는 존귀하나 우리는 비천하여 <strong>바로 이 시각까지</strong> 우리가 주리고 목마르며 헐벗고 매맞으며 정처가 없고 또 수고하여 친히 손으로 일을 하며 <strong><mark>모욕을 당한즉 축복하고</mark></strong> <strong><mark>박해를 받은즉 참고</mark></strong> <strong><mark>비방을 받은즉</mark></strong> 권면하니 우리가 지금까지 세상의 더러운 것과 만물의 찌꺼기 같이 되었도다” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/4/#L10-13">고전 4:10-13</a>)</p></blockquote><h2>그리스도를 위한 고난을 두려워하지 말라는 부름</h2><blockquote><p>“사랑하는 자들아 <strong>너희를 연단하려고 오는 불 시험을</strong> 이상한 일 당하는 것 같이 이상히 여기지 말고 오히려 너희가 그리스도의 고난에 참여하는 것으로 즐거워하라 이는 그의 영광을 나타내실 때에 너희로 즐거워하고 기뻐하게 하려 함이라 <strong><mark>너희가 그리스도의 이름으로 치욕을 당하면 복 있는 자로다</mark></strong> 영광의 영 곧 하나님의 영이 너희 위에 계심이라 너희 중에 누구든지 살인이나 도둑질이나 악행이나 남의 일을 간섭하는 자로 고난을 받지 말려니와 <strong><mark>만일 그리스도인으로 고난을 받으면 부끄러워하지 말고 도리어 그 이름으로 하나님께 영광을 돌리라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1pet/4/#L12-16">벧전 4:12-16</a>)</p></blockquote><blockquote><p>“또 너희가 열심으로 선을 행하면 누가 너희를 해하리요 그러나 <strong>의를 위하여 고난을 받으면 복 있는 자니</strong> 그들이 두려워하는 것을 두려워하지 말며 근심하지 말고” (<a href="https://bibleox.com/ko/ko-nkrv/1pet/3/#L13-14">벧전 3:13-14</a>)</p></blockquote><h2>그리스도 때문에 받는 박해를 견디는 이들에게 약속된 상</h2><p>그리스도를 위한 고난은 구원의 표지입니다:</p><blockquote><p>“오직 너희는 그리스도의 복음에 합당하게 생활하라 이는 내가 너희에게 가 보나 떠나 있으나 너희가 한마음으로 서서 한 뜻으로 복음의 신앙을 위하여 협력하는 것과 무슨 일에든지 <strong>대적하는 자들 때문에 두려워하지 아니하는</strong> 이 일을 듣고자 함이라 이것이 그들에게는 멸망의 증거요 너희에게는 <strong>구원의 증거니</strong> 이는 하나님께로부터 난 것이라 그리스도를 위하여 너희에게 은혜를 주신 것은 다만 그를 믿을 뿐 아니라 또한 <strong>그를 위하여 고난도 받게 하려 하심이라</strong> 너희에게도 <strong>그와 같은 싸움이</strong> 있으니 너희가 내 안에서 본 바요 이제도 내 안에서 듣는 바니라” (<a href="https://bibleox.com/ko/ko-nkrv/fil/1/#L27-30">빌 1:27-30</a>)</p></blockquote><p>그리스도와 함께 고난받는 사람은 그분과 함께 영광도 받습니다:</p><blockquote><p>“자녀이면 또한 상속자 곧 하나님의 상속자요 그리스도와 함께 한 상속자니 <strong>우리가 그와 함께 영광을 받기 위하여 고난도 함께 받아야 할 것이니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/rim/8/#L17">롬 8:17</a>)</p></blockquote><p>그리스도와 함께 죽는 사람은 그분과 함께 살고 다스립니다. 그리스도께서는 당신을 부인하는 사람을 부인하십니다:</p><blockquote><p>“내가 전한 복음대로 다윗의 씨로 죽은 자 가운데서 다시 살아나신 예수 그리스도를 기억하라 <strong>복음으로 말미암아 내가 죄인과 같이 매이는 데까지 고난을 받았으나</strong> 하나님의 말씀은 매이지 아니하니라 그러므로 내가 택함 받은 자들을 위하여 모든 것을 참음은 그들도 그리스도 예수 안에 있는 구원을 영원한 영광과 함께 받게 하려 함이라 미쁘다 이 말이여 <strong>우리가 주와 함께 죽었으면 또한 함께 살 것이요 참으면 또한 함께 왕 노릇 할 것이요 우리가 주를 부인하면 주도 우리를 부인하실 것이라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2tim/2/#L8-12">딤후 2:8-12</a>)</p></blockquote><p>주님 안에서 죽는 이들은 복됩니다:</p><blockquote><p>“또 내가 들으니 하늘에서 음성이 나서 이르되 기록하라 지금 이후로 <strong>주 안에서 죽는 자들은 복이 있도다</strong> 하시매 성령이 이르시되 그러하다 그들이 수고를 그치고 쉬리니 이는 그들의 행한 일이 따름이라 하시더라” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/14/#L13">계 14:13</a>)</p></blockquote><p>그리스도 때문에 죽임을 당한 이들의 영혼은 하늘에서 그분과 함께 삽니다:</p><blockquote><p>“다섯째 인을 떼실 때에 내가 보니 <strong>하나님의 말씀과 그들이 가진 증거로 말미암아 죽임을 당한 영혼들</strong>이 제단 아래에 있어 큰 소리로 불러 이르되 <strong>거룩하고 참되신 대주재여 땅에 거하는 자들을 심판하여 우리 피를 갚아 주지 아니하시기를 어느 때까지 하시려 하나이까</strong> 하니 각각 그들에게 <strong>흰 두루마기를 주시며</strong> 이르시되 아직 잠시 동안 쉬되 <strong>그들의 동무 종들과 형제들도 자기처럼 죽임을 당하여 그 수가 차기까지</strong> 하라 하시더라” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/6/#L9-11">계 6:9-11</a>)</p></blockquote>
