  title: 성인 유해 공경
  copy_cover: true
  body: '<h2>거룩한 의인들의 유해를 공경하는 까닭</h2><p>거룩한 의인들의 유해는 의인들 자체를 공경하는 것과 같은 이유로 공경받습니다(자세한 내용은 <a href="https://bibleox.com/ru/ru/w/почитание-святых-в-Библии">성인 공경</a>에 있습니다). 곧 하느님께 참여하기 때문에, 그들 안에 하느님의 은총이 활동하기 때문입니다(<a href="https://bibleox.com/ru/ru/w/человек-храм-Божий">사람은 하느님의 성전</a>). 의인은 어떤 부분이 아니라 온전히 공경받습니다(<a href="https://bibleox.com/ru/ru/w/состав-человека">사람 본성의 구성</a>). <strong>영혼</strong>만이 아니라 <strong>몸</strong>(<a href="https://bibleox.com/ko/ko-ctb/4ts/13/#L21">열하 13:21</a>), 나아가 의인의 <strong>개인 소지품</strong>(<a href="https://bibleox.com/ko/ko-ctb/act/19/#L12">사도 19:12</a>)과 <strong>형상</strong>(<a href="https://bibleox.com/ko/ko-ctb/act/5/#L15">사도 5:15</a>)도 공경받습니다. 하느님께서는 이를 통해 은총을 주시어 기적과 치유를 행하십니다.</p><p>성인들은 <strong>하느님께 참여하고 그들 안에 하느님의 은총이 활동하기 때문에 공경받으며</strong>, 하느님께서는 성인들의 살아 있는 몸만이 아니라 죽은 몸을 통해서도 은총을 주시므로(<a href="https://bibleox.com/ko/ko-ctb/4ts/13/#L21">열하 13:21</a>), 성인들의 몸은 은총 때문에 생전에만이 아니라 죽은 뒤에도(몸과 영혼이 나뉜 뒤에도) 공경받습니다.</p><p>하느님께서는 당신 벗들의 유해를 꺼리지 않으십니다. 하느님께서는 의인들의 유해를 돌보시고(<a href="https://bibleox.com/ko/ko-ctb/ps/34/#L19-20">시편 34:19-20</a>; <a href="https://bibleox.com/ko/ko-ctb/in/19/#L33,36">요한 19:33,36</a>) 그것을 통해 계속 활동하십니다(<a href="https://bibleox.com/ko/ko-ctb/4ts/13/#L21">열하 13:21</a>). 향료를 가져간 여인들도 유해를 꺼리지 않았습니다. 그들은 구세주께서 돌아가신 지 사흘째에 그리스도의 죽은 몸에 향료를 바르려고 무덤을 열러 갔습니다(<a href="https://bibleox.com/ko/ko-ctb/mk/16/#L1-3">마르 16:1-3</a>). 모세의 율법은 친족 외에는 시신에 손대지 못하게 했는데도 말입니다(<a href="https://bibleox.com/ko/ko-ctb/lev/21/#L1-4">레 21:1-4</a>).</p><h2>자주 묻는 질문</h2><h3>왜 유해가 땅이 아니라 성당에 있습니까?</h3><p><strong>성당은 의인의 유해를 모신 무덤입니다.</strong> 유해는 성당에서 석관(유해함, 궤)에 모십니다. 사람은 흙이므로 흙으로 돌아간다는 하느님의 말씀(<a href="https://bibleox.com/ko/ko-ctb/gen/3/#L19">창 3:19</a>)은 흙으로 지어진[1] 사람의 몸이 다시 흙이 된다는, 곧 썩어 흩어져 본래의 것, 곧 흙이 된다는 뜻입니다.</p><p>많은 의인은 글자 그대로 땅에 묻히지 않았습니다. 오히려 의인들은 의인들을 특별한 방식으로 장사지내려 했고, 흔히 특별한 묘실을 택했습니다.</p><ol><li><p><strong>아브라함은 특별히 사들인 동굴에 가족을 묻었습니다.</strong> 그는 주민들에게 매장지를 구했고, 그들은 자기 묘지 가운데 <strong>가장 좋은</strong> 곳을 내주겠다고 했습니다(<a href="https://bibleox.com/ko/ko-ctb/gen/23/#L2-6">창 23:2-6</a>). 결국 아브라함은 자기가 가리킨 동굴을 청하여 자기 소유로 사서(<a href="https://bibleox.com/ko/ko-ctb/gen/23/#L7-13,17-20">창 23:7-13,17-20</a>) 그곳에 친족을 묻었습니다. 아브라함 자신도(<a href="https://bibleox.com/ko/ko-ctb/gen/25/#L9-10">창 25:9-10</a>), 그의 아내 사라도(<a href="https://bibleox.com/ko/ko-ctb/gen/23/#L19">창 23:19</a>), 이사악과 그의 아내 리브가도(<a href="https://bibleox.com/ko/ko-ctb/gen/49/#L1,29-33">창 49:1,29-33</a>), 야곱과 그의 아내 레아도(<a href="https://bibleox.com/ko/ko-ctb/gen/49/#L1,29-33">창 49:1,29-33</a>; <a href="https://bibleox.com/ko/ko-ctb/gen/50/#L12-13">창 50:12-13</a>) 이 동굴에 묻혔습니다;</p></li><li><p><strong>주 예수 그리스도께서는 바위에 판 특별한 묘실에 묻히셨습니다.</strong> 부자인 아리마태아 사람 요셉이 자기를 위해 판 곳입니다(<a href="https://bibleox.com/ko/ko-ctb/mf/27/#L57,60">마태 27:57,60</a>; <a href="https://bibleox.com/ko/ko-ctb/mk/15/#L46">마르 15:46</a>; <a href="https://bibleox.com/ko/ko-ctb/lk/23/#L50-53">루가 23:50-53</a>; <a href="https://bibleox.com/ko/ko-ctb/in/19/#L41">요한 19:41</a>). 하느님께서 처음부터 그렇게 정하시어 예언자 이사야를 통해 미리 알리신 대로입니다: “그의 무덤은 악인들과 함께 있었으나 죽어서는 부자와 함께였다”(<a href="https://bibleox.com/ko/ko-ctb/is/53/#L9">이사 53:9</a>; 공동번역은 “불의한 자들과 함께 묻혔다”로 옮겼으며, 히브리어에는 “부자”가 있습니다);</p></li><li><p><strong>초기 그리스도인들은 흔히 카타콤바의 특별한 묘실에 의인들을 묻고</strong> 유해 곁에서 예배를 드렸습니다(<a href="https://bibleox.com/ru/ru/w/почитание-мощей-цитаты-святых">예</a>);</p></li><li><p>300년 뒤인 4세기에 그리스도교에 안전한 때가 오자 성인들의 유해를 성당에 모시기 시작했습니다. 의로운 요셉처럼 석관에 넣기도 하고(<a href="https://bibleox.com/ko/ko-ctb/gen/50/#L26">창 50:26</a>, <a href="https://bibleox.com/ru/ru/w/почитание-мощей-цитаты-святых">예</a>), 성당의 주요 부분(제단) 아래 특별한 묘실(지하 묘소)에 모시기도 하고, 특별한 별도의 건물(순교자 기념 성당)을 짓기도 했습니다(<a href="https://bibleox.com/ru/ru/w/почитание-мощей-цитаты-святых">예</a>).</p></li></ol><p>그러므로 <strong>아주 오래전부터 의인들은 의인들을 땅이 아니라 특별한 묘실에 모셨습니다.</strong> 오늘날 교회에서도 같습니다. 의인의 유해는 석관에 담겨 특별한 공간, 곧 예배를 드리는 성당에 모셔집니다.</p><p>어느 쪽으로 하든 본질은 같습니다:</p><ul><li><p>성인의 유해를 담은 석관을 모시려고 순교자 기념 성당을 짓고 교회가 거기 모여 예배를 드리거나,</p></li><li><p>반대로 예배를 드리려고 성당을 짓고 거기에 성인의 유해를 담은 석관을 모십니다.</p></li></ul><p>교회는 처음부터 성인들의 관을 모실 공간을 짓고 거기서 예배를 드립니다.</p><h3>유해의 이장</h3><p>성경에서 의인들의 유해를 옮긴 일은 여러 번 있었고 아무도 비난하지 않았습니다. 예를 들어 족장 요셉은 이집트에서 석관(유해함, 궤)에 모셔졌고(<a href="https://bibleox.com/ko/ko-ctb/gen/50/#L26">창 50:26</a>), 나중에 예언자 모세와 백성은 요셉이 청한 곳에 묻으려고 40년 넘게 광야에서 요셉의 유해를 모시고 다녔습니다. 자세히는 <a href="#HH-성경에-나오는-유해에-관한-일화들">아래</a>에 있습니다.</p><h3>유해의 나눔</h3><p>아주 오래전부터 거룩한 의인들의 유해는 가장 잔혹한 고문(토막 내기, 불태우기) 뒤에 온전하지 않은 채, 모든 부분이 한꺼번에 오지 못한 채 교회에 왔습니다(<a href="https://bibleox.com/ko/ko-ctb/mf/14/#L11">마태 14:11</a>; <a href="https://bibleox.com/ko/ko-ctb/mk/6/#L28">마르 6:28</a>). 그 뒤에도 하느님께서는 유해가 모여 있든 아니든 의인들의 유해를 통해 활동하셨습니다. 교회는 의인의 유해가 온전히 보존되었다면 성당에 놓인 특별한 관(석관, 유해함)에 온전히 모십니다. 자연재해나 적의 공격 때 유해를 구하려고 어쩔 수 없이 나누기도 했습니다. 때로는 다른 곳에서 의인을 공경하도록 유해에서 아주 작은 조각을 떼어 냅니다.</p><h2>사람의 유해에 대한 하느님의 태도</h2><h3>하느님께서는 의인들의 유해를 지키십니다</h3><blockquote><p>“<strong><mark>올바른 사람에게</mark></strong> 불행이 겹쳐도 야훼께서는 모든 곤경에서 그를 구해 주시고 <strong><mark>뼈 한 마디도 부러지지 않도록 고이고이 지켜 주신다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/ps/34/#L19-20">시편 34:19-20</a>)</p></blockquote><blockquote><p>“예수에게 가서는 이미 숨을 거두신 것을 보고 <strong>다리를 꺽는 대신</strong> &lt;…&gt; 이렇게 해서 ‘<strong><mark>그의 뼈는 하나도 부러지지 않을 것이다’라는 성서의 말씀이 이루어졌다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/in/19/#L33,36">요한 19:33,36</a>)</p></blockquote><p>여기서 성인들의 유해에 대한 하느님의 태도를 볼 수 있습니다. 그럼에도 하느님께서는 때로 의인들의 고문, 심지어 참수까지 (원하시는 것은 아니지만) 허락하십니다. 예언자 세례자 요한이 그러했습니다(<a href="https://bibleox.com/ko/ko-ctb/mf/14/#L11">마태 14:11</a>; <a href="https://bibleox.com/ko/ko-ctb/mk/6/#L28">마르 6:28</a>). 그러나 하느님께서는 나뉜 성인들의 유해를 통해서도 은총을 주십니다.</p><h3>하느님께서는 죄인들의 유해를 치욕에 넘기십니다</h3><blockquote><p>“저자들은 겁에 질려 소스라치리라. <strong><mark>하느님께서 에워 싼 자들의 뼈를 흩으시고</mark></strong> 물리치시면 저들은 웃음거리가 되리라.” (<a href="https://bibleox.com/ko/ko-ctb/ps/53/#L5">시편 53:5</a>)</p></blockquote><h2>하느님께서는 의인의 죽은 몸을 통해 계속 활동하십니다</h2><p>예언자 엘리사의 유해에 닿자 죽은 사람이 살아났습니다. 곁에서 기도한 흔적도 없습니다:</p><blockquote><p>“한번은 어떤 사람들이 시체를 묻으려다가 그 강도떼들을 만나 시체를 엘리사의 무덤 속에 던지고 달아났다. 그런데 <strong><mark>그 시체가 엘리사의 뼈에 닿자 다시 살아나서 일어섰다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/4ts/13/#L21">열하 13:21</a>)</p></blockquote><h2>하느님께서는 의인이 몸에 지녔던 물건을 통해 계속 활동하십니다</h2><p>사도의 옷으로 인한 치유:</p><blockquote><p>“<strong><mark>바울로의 몸에 닿았던 수건이나 앞치마를</mark></strong> 병자에게 대기만 해도 병이 낫고 악령들이 쫓겨 나갔다.” (<a href="https://bibleox.com/ko/ko-ctb/act/19/#L12">사도 19:12</a>)</p></blockquote><h2>하느님께서는 의인의 형상을 통해 활동하십니다</h2><p>사도의 형상으로 인한 치유:</p><blockquote><p>“사람들은 심지어 <strong>병자들을 길거리에 메고 나가</strong> 들것이나 요에 눕혀 놓고 <strong>베드로가 지나갈 때 행여나 그 그림자만이라도 그 몇 사람에게 스쳐 지나갔으면 하였다</strong>. 예루살렘 근방에 있는 여러 동네에서도 많은 사람들이 병자들과 악령이 들려 고생하는 사람들을 데리고 몰려 왔는데 <strong>그들의 병도 모두 고쳐졌다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/act/5/#L15-16">사도 5:15-16</a>)</p></blockquote><h2>성인에게 드리는 절</h2><p>십계명의 둘째 계명(<a href="https://bibleox.com/ko/ko-ctb/ish/20/#L2-3">출 20:2-3</a>; <a href="https://bibleox.com/ko/ko-ctb/vtor/5/#L6-7">신 5:6-7</a>)은 거짓 신(우상) 숭배를 금합니다. 거짓 신은 거짓일 뿐 아니라 존재하지도 않습니다.</p><p>그러나 성인들은 존재하고 하느님의 벗이며, 신으로 숭배받지 않습니다. 성인과 그 유해에게 드리는 절은 하느님의 벗인 그분들에 대한 존경의 표현입니다. 천사와 사람과 사물에게 드리는 이런 절은 성경에 나오며 우상 숭배가 아닙니다. 우상 숭배는 거짓 신을 숭배하는 것이기 때문입니다. 의인들은 사람과 여러 사물과 천사에게 늘 절하고, 다른 사람들은 예언자에게 절합니다.</p><h4>천사의 모습으로 나타나신 하느님께 드리는 절</h4><blockquote><p>“고개를 들어 <strong>웬 사람 셋이</strong> 자기를 향해 서 있는 것을 보았다. 그는 그들을 보자마자 천막 문에서 뛰어 나가 맞으며 <strong>땅에 엎드려</strong>” (<a href="https://bibleox.com/ko/ko-ctb/gen/18/#L2">창 18:2</a>)</p></blockquote><h4>천사에게 드리는 절</h4><blockquote><p>“그가 대답하였다. ‘아니다. 나는 야훼 군대의 총사령관으로서 이제 온 것이다.’ 이 대답을 듣고 여호수아는 <strong>엎드려 얼굴을 땅에 대고 절하며</strong> 물었다. ‘내 주여, 당신의 종에게 무슨 말씀을 하시렵니까?’” (<a href="https://bibleox.com/ko/ko-ctb/nav/5/#L14">여호 5:14</a>)</p></blockquote><h4>예언자에게 드리는 절</h4><blockquote><p>“예리고에서 온 예언자 수련생들이 멀리서 그 광경을 보고 말했다.‘엘리야의 영검이 엘리사에게 내렸구나.’ 그러면서 엘리사 앞으로나와 <strong>땅에 엎드려 절하였다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/4ts/2/#L15">열하 2:15</a>)</p></blockquote><h4>성전을 향한 절</h4><blockquote><p>“당신의 크신 사랑만을 믿고 나는 당신 집에 왔사옵니다. 주님 두려워하는 마음으로 <strong>당신의 거룩한 성전을 향하여 엎드립니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/ps/5/#L7">시편 5:7</a>)</p></blockquote><h4>하느님의 발판에 드리는 절</h4><blockquote><p>“야훼 우리 하느님을 기리어라. <strong>그분의 발판 아래 엎드려라</strong>. <strong>그분은 거룩하시다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/ps/99/#L5">시편 99:5</a>)</p></blockquote><blockquote><p>“<strong>그분 계시는 곳으로 들어 가자. 그 발 앞에 엎드려 경배하자</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/ps/132/#L7">시편 132:7</a>)</p></blockquote><h4>궤 앞의 절</h4><blockquote><p>“여호수아와 이스라엘의 장로들은 옷을 찢고 머리에 먼지를 쓴 채 저물 때까지 <strong>야훼의 궤 앞에 엎드려 있었다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/nav/7/#L6">여호 7:6</a>)</p></blockquote><h4>지팡이에 드리는 절</h4><blockquote><p>“그러면 이제 나에게 맹세하여라.‘ 요셉이 시키는 대로 맹세하자, <strong>이스라엘은 침상 머리맡에 엎드려</strong> 하느님께 경배드렸다.” (<a href="https://bibleox.com/ko/ko-ctb/gen/47/#L31">창 47:31</a>; <a href="https://bibleox.com/ko/ko-ctb/evr/11/#L21">히브 11:21</a>) <em>(칠십인역에는 “지팡이 끝에”(προσεκύνησεν Ισραηλ ἐπὶ τὸ ἄκρον τῆς ῥάβδου αὐτοῦ)로 되어 있습니다. 히브리 11:21도 같습니다.)</em></p></blockquote><p>더 많은 예: <a href="https://bibleox.com/ru/ru/w/поклоны">절</a>.</p><h2>성경에 나오는 유해에 관한 일화들</h2><h3>장사 뒤 사흘째에 향료를 가져간 여인들은 무덤을 열고 주 예수 그리스도의 거룩한 몸에 손을 대려고 갔습니다</h3><blockquote><p>“안식일이 지나자 막달라 여자 마리아와 야고보의 어머니 마리아와 살로메는 <strong>무덤에 가서 예수의 몸에 발라 드리려고 향료를 샀다</strong>. 그리고 안식일 다음날 이른 아침 해가 뜨자 그들은 무덤으로 가면서 <strong>그 무덤 입구를 막은 돌을 굴려 내 줄 사람이 있을까요</strong>?‘하고 말을 주고 받았다.” (<a href="https://bibleox.com/ko/ko-ctb/mk/16/#L1-3">마르 16:1-3</a>)</p></blockquote><blockquote><p>“안식일 다음 날 아직 동이 채 트기도 전에 그 여자들은 <strong>준비해 두었던 향료를 가지고 무덤으로 갔다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/lk/24/#L1">루가 24:1</a>)</p></blockquote><blockquote><p>“안식일이 지나고 그 이튿날 동틀 무렵에 막달라 여자 마리아와 다른 마리아가 <strong>무덤을 보러 갔다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/mf/28/#L1">마태 28:1</a>)</p></blockquote><blockquote><p>“안식일 다음 날 이른 새벽의 일이었다. 아직 어두울 때에 막달라 여자 마리아가 <strong>무덤에 가 보니</strong> 무덤을 막았던 돌이 이미 치워져 있었다.” (<a href="https://bibleox.com/ko/ko-ctb/in/20/#L1">요한 20:1</a>)</p></blockquote><h3>유해의 이장</h3><h4>요셉</h4><p>요셉(야곱의 아들)은 나중에 자기 유해를 이집트에서 하느님께서 주시겠다고 약속하신 땅으로 옮겨 달라고 청합니다:</p><blockquote><p>“<strong>요셉이</strong> 일가 사람들에게 말하였다. ‘나는 이제 죽을 터이지만 하느님께서는 반드시 너희를 찾아 오시어 이 땅에서 이끌어 내시고 아브라함과 이사악, 야곱에게 주시마고 맹세하신 땅으로 올라 가게 하실 것이다.’ 다시 요셉은 이스라엘 자손에게 서약을 시켰다. ‘하느님께서 너희를 반드시 찾아 오실 것이다. 너희는 그 때 <strong>여기에서 내 뼈를 가지고 그리로 올라 가거라</strong>.’” (<a href="https://bibleox.com/ko/ko-ctb/gen/50/#L24-25">창 50:24-25</a>)</p></blockquote><p>요셉이 죽자 이집트에서 석관(유해함, 궤)에 모십니다:</p><blockquote><p>“<strong>요셉이</strong> 백 십 세에 죽자 사람들이 그를 썩지 않게 만들어 <strong>관에 넣어 에집트에 모셨다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/gen/50/#L26">창 50:26</a>)</p></blockquote><p>예언자 모세는 요셉의 청을 이룹니다:</p><blockquote><p>“그래서 하느님은 그들을 홍해바다에 이르는 광야 길로 돌아 가게 하셨다. 이스라엘 백성은 단단히 무장하고 에집트 땅에서 나왔다. 이 때, <strong>모세는 요셉의 유해를 모시고 떠났다</strong>. 요셉이 ‘하느님께서 너희를 돌보아 찾아 오실 터이니, 그 때 너희는 내 뼈를 여기에서 옮겨다오.’ 하고 이스라엘 백성에게 단단히 다짐해 두었던 것이다.” (<a href="https://bibleox.com/ko/ko-ctb/ish/13/#L18-19">출 13:18-19</a>)</p></blockquote><p>예언자 모세와 이스라엘 백성은 요셉의 유해와 함께 <strong>40년 넘게</strong> 시나이 반도를 다녔습니다. 나중에 눈의 아들 여호수아가 요셉의 유해를 세겜에 묻습니다(<a href="https://bibleox.com/ko/ko-ctb/nav/24/#L32">여호 24:32</a>).</p><p>시나이 광야의 40년 여정, 곧 이스라엘이 이집트 종살이에서 약속의 땅으로 나아간 일이 사람들을 죄의 종살이에서 하느님께서 약속하신 하늘 나라로 이끄는 신약 교회의 삶의 예표임을 생각하면, 교회 생활의 이 모든 기간 내내 하느님의 백성은 의인의 유해를 늘 지니고 있었습니다. 교회의 구약적 표상은 자기 나라에 이를 때까지 의인의 유해를 늘 지니고 있었습니다.</p><h4>사울</h4><p>사울은 불레셋 사람들에게 죽었고, 야베스 주민들은 시신을 태워 뼈를 자기 성읍의 나무 아래 묻었습니다:</p><blockquote><p>“그리고 나서 그가 입었던 갑옷은 아스다롯 신당에 보관하고 시체는 벳산 성벽에 못박아 달아 놓았다. 야베스 길르앗에 살던 사람들은 불레셋군이 사울을 이렇게 해치웠다는 소식을 듣고 용사들이 모두 길을 떠나 밤을 도와 벳산에 이르러 <strong>사울 부자의 시체를 그 곳 성벽에서 내려다가</strong> 야베스로 옮겨 <strong>화장한 다음, 그 뼈를 야베스에 있는 위성류나무 아래 매장하고</strong> 칠 일간 단식하였다.” (<a href="https://bibleox.com/ko/ko-ctb/1ts/31/#L10-13">삼상 31:10-13</a>; <a href="https://bibleox.com/ko/ko-ctb/1par/10/#L12">역상 10:12</a>)</p></blockquote><p>다윗은 사울의 유해를 베냐민 땅으로 옮겨 사울의 아버지 유해와 함께 묻습니다:</p><blockquote><p>“<strong>사울의 뼈와 그 아들 요나단의 뼈를</strong> 야베스 길르앗 사람들에게서 찾아 왔다. 불레셋 사라들이 사울을 길보아에서 죽여 벳산 광장에 매달아 둔 것을 그들이 몰래 거두어 두었던 것이다. 다윗은 거기에서 <strong>사울의 뼈와 그 아들 요나단의 뼈를 가져오고</strong> 사람들이 나무에 매달았던 자들의 뼈도 모았다. 그들은 <strong>사울의 뼈와 그의 아들 요나단의 뼈와 함께</strong> 베냐민 지방 셀라에 있는 <strong>사울의 아버지 키스의 무덤에 합장했다</strong>. 모두 어명을 따라 한 일이었다. 그런 다음에야 하느님께서는 기도를 들어 주시고 나라를 돌보시게 되었다.” (<a href="https://bibleox.com/ko/ko-ctb/2ts/21/#L12-14">삼하 21:12-14</a>)</p></blockquote><h3>장례가 늦어진 경우</h3><p>야곱은 77일이 넘어 장사되었습니다:</p><blockquote><p>“요셉은 아버지의 얼굴에 엎드려 울며 입을 맞추었다. 요셉은 자기의 시의들을 시켜 아버지의 몸을 썩지 않게 만들었다. 이렇게 썩지 않게 만드는 데 채워야 하는 날수 <strong>사십 일</strong>이 지났다. 에집트인들은 그를 생각하고 <strong>칠십 일 동안 곡을 했다</strong>. &lt;…&gt; 제 아버지가 운명하시면서 <strong>당신께서 가나안 땅에 파 둔 무덤에 묻어 달라고</strong> 저에게 맹세를 시키셨습니다. 그러니 제가 올라 가 제 아버지를 장사지내고 오게 허락해 주십시오.‘ &lt;…&gt; 그들은 요르단강 건너편에 있는 아닷의 타작 마당에 이르러 성대하고 장중하게 장례식을 올렸는데 요셉은 아버지를 생각하고 <strong>칠 일 동안</strong> 곡했다.” (<a href="https://bibleox.com/ko/ko-ctb/gen/50/#L1-3,5,10">창 50:1-3,5,10</a>)</p></blockquote><h3>예언자가 다른 예언자의 유해와 함께 묻히기를 청합니다</h3><blockquote><p>“예언자는 장례를 치러 주려고 그 하느님의 사람의 시체를 나귀에 싣고 성으로 돌아 왔다. 그는 그 시체를 자기 가족묘지에 안장하고 자식들과 함께 ‘아이고, 이 사람아!’ 하며 슬프게 곡을 하였다. 그를 매장한 후에 <strong>늙은 예언자는</strong> 자식들에게 이렇게 말하였다. ‘<strong>내가 죽거든 이 하느님의 사람이 묻힌 무덤에 같이 묻어 다오. 내 뼈를 그의 뼈 옆에 나란히 묻어라</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/3ts/13/#L29-31">열상 13:29-31</a>)</p></blockquote><h2>야곱이 아내의 유해를 공경합니다</h2><blockquote><p>“라헬은 에브랏으로 가는 길가에 묻혔다. 에브랏은 곧 베들레헴이다. <strong>야곱은 라헬의 무덤 위에 비석을 세웠다</strong>. 그것이 이날까지 라헬의 묘비로 알려져 있다.” (<a href="https://bibleox.com/ko/ko-ctb/gen/35/#L19-20">창 35:19-20</a>)</p></blockquote><h2>요시아 왕이 예언자의 유해를 공경합니다</h2><p>요시아에 관해서는 마음과 영혼과 힘을 다해 하느님께 돌아간 왕이 그 전에도 후에도 없었다고 합니다(<a href="https://bibleox.com/ko/ko-ctb/4ts/23/#L25">열하 23:25</a>). 유다 왕 요시아는 어려서부터 하느님께 순종했고, 장성하자 나라에서 이교를 없애기 시작했습니다. 그는 이교 신상과 제단과 분향하는 산당과 거룩한 숲을 없애고, 우상 사제들의 봉사를 금하고, 마술사와 혼백을 부르는 자들을 없애고, 예루살렘의 하느님 성전에서 이교의 물건들을 없애고 수리했으며, 성경을 찾아내어 백성에게 읽어 주었고, 백성은 하느님과 계약을 맺었습니다. 요시아는 이교의 성소를 없앴을 뿐 아니라 사람의 뼈를 흩어 그것을 더럽히려 했습니다:</p><blockquote><p>“또 왕은 이스라엘 왕 솔로몬이 시돈 사람들의 역겨운 아스다롯 여신상과 모압인의 역겨운 그모스 신상과 암몬인의 역겨운 밀곰 신상을 모시기 위하여 예루살렘을 마주 보는 그 멸망의 산 남쪽에세웠던 산당들을 부정한 곳으로 만들었다. 석상들을 부수고 목상들은 토막을 내고 <strong>사람의 해골을 거기에 너저분하게 널어 놓았다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/4ts/23/#L13-14">열하 23:13-14</a>)</p></blockquote><p>요시아는 여로보암의 옛 우상을 없애고 그곳의 무덤을 더럽혔습니다:</p><blockquote><p>“왕은 또한 이스라엘을 죄에 빠뜨린 느밧의 아들 여로보암이 베델에 세웠던 산당과 제단도 허물고 돌들을 부수어 가루를 만들었으며 아세라 목상은 태워 버렸다. <strong>요시아는 산 위에 공동묘지가 있는 것을 보고 사람을 보내어 무덤속에서 해골을 꺼내어 제단 위에 놓고 불살라 그 제단을 부정하게하였다</strong>. 여로보암이 축제 때에 그 제단 앞에서 제사드릴 때 하느님의 사람이 외친 야훼의 말씀이 이렇게 이루어졌다. 거기에는 그 하느님의 사람이 묻힌 무덤이 있었는데, 요시아는 그무덤을 보고” (<a href="https://bibleox.com/ko/ko-ctb/4ts/23/#L15-16">열하 23:15-16</a>)</p></blockquote><p>그러나 그는 어떤 비석을 만나 이것이 이 일을 예언한 예언자의 무덤임을 알자 그 유해를 공경하여 대합니다. 게다가 비석이 있다는 것 자체가 예언자를 일찍부터 공경했음을 보여 줍니다:</p><blockquote><p>“<strong>저기 보이는 저 비석이 무엇이냐고</strong> 물었다. 그 마을 사람들이 ‘<strong>유다에서 온 하느님의 사람의 무덤입니다</strong>. 그가 일찌기 말하기를임금님께서 베델의 제단을 이렇게 하시리라고 했습니다.’ 그러자 왕이 말하였다. ‘<strong><mark>그분의 유골은 사마리아에서 온 예언자의유골과 함께 아무도 손을 대지 않았으므로 그대로 남아 있게 되었다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/4ts/23/#L17-18">열하 23:17-18</a>)</p></blockquote><p>이 하느님의 사람은 일찍이 이런 일이 일어나리라고 예언했습니다:</p><blockquote><p>“하느님의 사람이 제단을 바라보며 야훼께 받은 말씀을 외치기 시작하였다. ‘오, 제단아, 제단아, 야훼가 말한다. <strong>다윗의 가문에서 요시야란 한 아들이 태어나리니</strong>, 두고 보아라, <strong>그가 네 위에 분향하는 산당의 사제들을 죽여 그 뼈를 네 위에서 태우리라</strong>.’” (<a href="https://bibleox.com/ko/ko-ctb/3ts/13/#L2">열상 13:2</a>)</p></blockquote><h2>시몬이 가족의 유해를 공경합니다</h2><p>대사제 <a href="https://en.wikipedia.org/wiki/Jonathan_Apphus">요나단</a>(<a href="https://bibleox.com/ko/gr-lxx-byz/1mak/10/#L20">1마카 10:20</a>; <a href="https://bibleox.com/ko/gr-lxx-byz/1mak/11/#L57">1마카 11:57</a>)은 바스카마에 묻혔습니다. 나중에 그의 형제 대사제 시몬(<a href="https://bibleox.com/ko/gr-lxx-byz/1mak/13/#L36,42">1마카 13:36,42</a>)은 그의 유해를 조상들의 도성 모데인으로 옮겼습니다. 유다도 전에 그곳에 묻혔습니다(<a href="https://bibleox.com/ko/gr-lxx-byz/1mak/9/#L19">1마카 9:19</a>). 시몬은 큰 건축물을 세워 가족의 유해를 공경하려 했습니다:</p><blockquote><p>“그는 요나단을 죽였고, <strong>요나단은 그곳에 묻혔다</strong>. … 시몬은 사람을 보내어 <strong>자기 형제 요나단의 뼈를 가져다가 조상들의 도성 모데인에 묻었다</strong>. … 시몬은 아버지와 형제들의 무덤 위에 건축물을 세워 다듬은 돌로 높였고 … 기둥 위에 <strong>영원한 이름을 위해</strong> 갑옷 장식을 만들었다. <strong>이것이 그가 모데인에 만든 무덤</strong>이며 오늘날까지 있다” (<a href="https://bibleox.com/ko/gr-lxx-byz/1mak/13/#L23-30">1마카 13:23-30</a>, 그리스어에서 번역)</p></blockquote><h2>관련 구절</h2><ol><li><p><a href="https://bibleox.com/ru/ru/w/почитание-святых-в-Библии">성인 공경</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/иконы-иконопочитание-иконоборчество">이콘 공경</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/молитвы-святым">성인들에게 드리는 기도</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/человек-храм-Божий">사람은 하느님의 성전</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/состав-человека">사람의 구성</a></p></li></ol>'
  title_sub: 거룩한 의인들의 유해 공경
