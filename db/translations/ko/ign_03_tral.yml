    body: |-
      <h2>0</h2><p>이그나티오스 곧 테오포로스가, 예수 그리스도의 아버지 하느님께 사랑받는, 아시아의 트랄레스에 있는 거룩한 교회에 보냅니다. 이 교회는 뽑힌 교회, 하느님께 합당한 교회이며, 우리의 희망이신 예수 그리스도의 수난으로, 또 그분께로 향하는 우리의 부활로 육과 영으로 평화를 누리는 교회입니다. 나는 사도들의 방식을 따라 이 교회에 넘치는 문안을 드리며[1], 진심으로 기쁨을 빕니다.</p>
      <h2>1</h2><p>1. 여러분이 인내 가운데 흠 없고 흔들림 없는 마음을 지니고 있다는 것을 나는 알게 되었습니다. 그것은 한때의 습관이 아니라 본성에서 나온 것입니다. 여러분의 주교 폴리비오스가 그것을 나에게 밝혀 주었습니다. 그는 하느님과 예수 그리스도의 뜻으로 스미르나에 와서, 그리스도 예수 안에서 묶여 있는 나와 함께 크게 기뻐해 주었으므로, 나는 그 안에서 여러분 모두를 본 듯하였습니다.</p><p>2. 그리하여 나는 하느님을 따르는 여러분의 호의를 그를 통하여 받고 하느님께 영광을 드렸습니다. 내가 알고 있던 대로, 여러분이 하느님을 본받는 사람들이라는 것을 발견했기 때문입니다[2].</p>
      <h2>2</h2><p>1. 여러분이 예수 그리스도께 순종하듯이 주교에게 순종할 때, 여러분은 사람을 따라 사는 것이 아니라 우리를 위하여 돌아가신 예수 그리스도를 따라 사는 것으로 보입니다. 그것은 여러분이 그분의 죽음을 믿어 죽음을 벗어나게 하려는 것입니다.</p><p>2. 그러므로 여러분이 지금 하고 있는 대로, 주교를 제쳐 놓고는 아무것도 하지 않는 것이 필요합니다. 또 우리의 희망이신 예수 그리스도의 사도들에게 순종하듯이 사제단에게도 순종하십시오. 그분 안에서 살아가면 우리는 그분 안에서 발견될 것입니다.</p><p>3. 예수 그리스도의 신비를 섬기는 보제들[3]도 모든 방법으로 모든 사람의 마음에 들어야 합니다. 그들은 음식과 음료를 시중드는 사람이 아니라 하느님의 교회를 섬기는 사람이기 때문입니다[4]. 그러므로 그들은 비난받을 일을 불을 피하듯 피해야 합니다.</p>
      <h2>3</h2><p>1. 마찬가지로 모든 사람은 보제들을 예수 그리스도처럼 존중하고, 주교를 아버지의 모상[5]으로, 사제들을 하느님의 회의로, 사도들의 모임으로 존중하십시오. 이들을 제쳐 놓고는 교회라고 불릴 수 없습니다.</p><p>2. 여러분이 이 일에서 그러하다고 나는 확신합니다. 나는 여러분의 사랑을 보여 주는 살아 있는 본보기를 여러분의 주교 안에서 받았고, 지금도 그가 나와 함께 있습니다. 그의 몸가짐 자체가 큰 가르침이고, 그의 온유함이 곧 힘입니다. 하느님을 믿지 않는 사람들조차 그를 존중할 것이라고 나는 생각합니다.</p><p>3. 나는 여러분을 사랑하기에 이 일에 대하여 더 엄하게 쓸 수 있지만 삼가고 있습니다. 단죄받은 사람이면서 사도처럼 여러분에게 명령하려는 생각은 나에게 없습니다.</p>
      <h2>4</h2><p>1. 나는 하느님 안에서 많은 것을 깨닫고 있지만, 자랑하다가 멸망하지 않도록 나 자신을 헤아려 절제합니다. 이제야말로 나는 더 두려워해야 하며, 나를 우쭐하게 하는 사람들에게 마음을 주어서는 안 됩니다. 나에게 (칭찬의) 말을 하는 사람들은 나를 채찍질하는 것이기 때문입니다[6].</p><p>2. 나는 고난받기를 사랑하지만, 내가 그럴 자격이 있는지는 모릅니다. 이 열망은 많은 사람에게 보이지 않지만, 나를 더욱 거세게 공격합니다[7]. 그러므로 나에게는 온유함이 필요합니다. 온유함으로 이 세상 권력자는 무너집니다.</p>
      <h2>5</h2><p>1. 내가 여러분에게 하늘의 일들을 써 보낼 수 없겠습니까? 그러나 아직 어린아이인 여러분에게 해를 끼칠까 두렵습니다[8]. 나를 너그러이 보아주십시오. 여러분이 받아들이지 못하고 숨이 막히지 않도록 하려는 것입니다.</p><p>2. 나 자신도 묶여 있고, 하늘의 일들과 천사들의 자리와 권세들의 무리, 보이는 것과 보이지 않는 것[9]을 깨달을 수 있다고 해서 이미 제자가 된 것은 아닙니다. 하느님을 놓치지 않으려면 우리에게는 아직 부족한 것이 많습니다.</p>
      <h2>6</h2><p>1. 그러므로 여러분에게 권합니다. 아니, 내가 아니라 예수 그리스도의 사랑이 권합니다. 그리스도인의 음식만을 먹고, 낯선 풀, 곧 이단을 멀리하십시오.</p><p>2. 그들은 신용을 얻으려고 자기들의 가르침에 예수 그리스도를 섞어 짭니다. 그것은 치명적인 독약을 꿀 섞은 포도주에 타서 주는 것과 같습니다. 아무것도 모르는 사람은 그것을 기꺼이 받아 마시고, 악한 쾌락 속에서 죽음을 받아들입니다.</p>
      <h2>7</h2><p>1. 그러므로 이런 자들을 경계하십시오. 여러분이 교만하지 않고, 하느님이신 예수 그리스도와 주교와 사도들의 규정에서 떨어지지 않는다면 그렇게 할 수 있을 것입니다.</p><p>2. 제단 안에 있는 사람은 깨끗하고, 제단 밖에 있는 사람은 깨끗하지 않습니다[10]. 곧 주교와 사제단과 보제들을 제쳐 놓고 무엇을 하는 사람은 양심이 깨끗하지 않습니다.</p>
      <h2>8</h2><p>1. 내가 이렇게 쓰는 것은 여러분 가운데 이런 일이 있다는 것을 알았기 때문이 아닙니다. 여러분은 나의 사랑하는 사람들이므로, 악마의 덫을 미리 내다보고 여러분을 지켜 주려는 것입니다. 그러므로 여러분은 온유함을 입고, 주님의 살인 믿음과 예수 그리스도의 피인 사랑 안에서 자신을 새롭게 하십시오.</p><p>2. 여러분 가운데 아무도 이웃에게 원한을 품지 마십시오. 이방인들에게 구실을 주지 마십시오. 몇몇 어리석은 사람 때문에 하느님 안에 있는 무리가 모독받지 않게 하려는 것입니다. "내 이름이 헛되이 어떤 사람들 가운데서 모독받게 하는 자는 불행하다"[11]고 하였기 때문입니다.</p>
      <h2>9</h2><p>1. 그러므로 누가 예수 그리스도를 제쳐 놓고 여러분에게 말할 때에는 귀를 막으십시오. 그분은 다윗의 가문에서 나신 분, 마리아에게서 나신 분으로서, 참으로 태어나시고 먹고 마셨으며, 본티오 빌라도 아래에서 참으로 박해를 받으시고, 하늘과 땅과 땅 아래 있는 것들이 보는 앞에서[12] 참으로 십자가에 못 박혀 돌아가셨습니다.</p><p>2. 그분은 참으로 죽은 이들 가운데서 다시 살아나셨습니다. 그분의 아버지께서 그분을 일으키셨습니다. 그분의 아버지께서는 그분을 믿는 우리도 마찬가지로 그리스도 예수 안에서 일으키실 것입니다[13]. 그분을 떠나서는 우리에게 참생명이 없습니다.</p>
      <h2>10</h2><p>그러나 만일 어떤 사람들—곧 하느님을 믿지 않는 자들, 불신자들—이 말하듯이 그분께서 겉보기로만 고난을 받으셨다면[14]—사실은 그들 자신이야말로 겉보기에 지나지 않는데—, 나는 왜 묶여 있습니까? 나는 왜 맹수와 싸우기를 바랍니까? 그렇다면 나는 헛되이 죽는 것입니다. 그렇다면 나는 주님에 대하여 거짓을 말하고 있는 것입니다[15].</p>
      <h2>11</h2><p>1. 그러므로 죽음을 가져오는 열매를 맺는 나쁜 곁가지를 피하십시오. 누구든지 그것을 맛보면 곧 죽습니다. 그들은 아버지께서 심으신 것이 아니기 때문입니다[16].</p><p>2. 만일 그들이 아버지께서 심으신 것이라면, 그들은 십자가의 가지로 드러나고 그 열매는 썩지 않는 것이었을 것입니다. 그리스도께서는 이 십자가로, 당신의 수난 안에서 당신의 지체인 여러분을 부르고 계십니다[17]. 머리는 지체 없이 혼자 태어날 수 없습니다. 하느님께서 일치를 약속하셨고, 그 일치는 바로 하느님 자신이십니다.</p>
      <h2>12</h2><p>1. 나는 스미르나에서, 나와 함께 있는 하느님의 교회들과 더불어 여러분에게 문안합니다. 그들은 모든 면에서 육으로나 영으로나 나를 쉬게 해 주었습니다.</p><p>2. 내가 예수 그리스도를 위하여 지니고 다니며 하느님께 이르기를 간구하는 이 사슬이 여러분에게 권합니다. 여러분의 한마음과 서로를 위한 기도 안에 머무르십시오. 여러분 각자, 특히 사제들은 아버지와 예수 그리스도와 사도들의 영예를 위하여 주교를 기운 나게 해 드리는 것이 마땅합니다.</p><p>3. 내가 쓴 것이 여러분에게 불리한 증언이 되지 않도록, 사랑으로 내 말을 들어 주기를 바랍니다. 나를 위해서도 기도해 주십시오. 나는 하느님의 자비 안에서 여러분의 사랑이 필요합니다. 그것은 내가 정해진 몫에 이를 자격을 얻고, 실격자가 되지 않기 위해서입니다[18].</p>
      <h2>13</h2><p>1. 스미르나 사람들과 에페소 사람들의 사랑이 여러분에게 문안합니다. 여러분의 기도 가운데 시리아에 있는 교회를 기억해 주십시오. 나는 그 교회에서 가장 보잘것없는 사람이며, 그 교회의 일원이라고 불릴 자격도 없습니다[19].</p><p>2. 예수 그리스도 안에서 안녕히 계십시오. 계명에 순종하듯이 주교에게 순종하고, 마찬가지로 사제단에게도 순종하십시오. 여러분 각자는 갈라지지 않는 마음으로 서로 사랑하십시오.</p><p>3. 나의 영은 여러분을 위한 속죄물입니다[20]. 지금만이 아니라 내가 하느님께 이를 때에도 그러합니다. 나는 아직 위험 속에 있기 때문입니다. 그러나 아버지께서는 예수 그리스도 안에서 진실하시어 나의 간구와 여러분의 간구를 이루어 주실 것입니다[21]. 그분 안에서 여러분이 흠 없는 사람으로 드러나기를 빕니다.</p>
    references: |-
      <ol><li><p>ἐν τῷ πληρώματι ἐν ἀποστολικῷ χαρακτῆρι. 사도들이 편지에서 문안한 것과 같은 방식으로 교회 전체에 문안한다는 뜻입니다. '사도적 권위의 충만함 안에서'로 보는 사람도 있습니다.</p></li><li><p>옛 라틴어 번역과 아르메니아어 번역은 '여러분이 하느님을 본받는 사람들임을 발견하고 (하느님께) 영광을 드렸다'로 읽으며, 이 번역도 이를 따랐습니다.</p></li><li><p>보제들이 '예수 그리스도의 신비를 섬기는 사람들'이라고 불립니다. 성찬 예식에서 봉사하는 직무를 가리키는 것으로 보입니다(<a href="https://bibleox.com/ko/ko-ctb/1kor/4/#L1">1고린 4:1</a> 참조).</p></li><li><p>사도행전 6장의 '식탁 시중'과 대비됩니다(<a href="https://bibleox.com/ko/ko-ctb/act/6/#L2">사도 6:2</a> 참조).</p></li><li><p>τύπος — '모상, 형상'. 주교는 아버지 하느님의 모습을 드러내는 사람으로 여겨집니다(<a href="https://bibleox.com/ko/ko/w/Ig2M_마그네시아교회에보낸편지#HH-6">「마그네시아 교회에 보낸 편지」 6:1</a>, <a href="https://bibleox.com/ko/ko/w/Ig2M_마그네시아교회에보낸편지#HH-3">「마그네시아 교회에 보낸 편지」 3:1</a> 참조).</p></li><li><p>이그나티오스에게 '당신은 순교자가 될 것이다' 하고 칭찬하던 사람들을 가리키는 것으로 보입니다. 칭찬이 교만의 유혹이 되므로 '채찍질'이라고 말합니다.</p></li><li><p>순교에 대한 열망. 이그나티오스는 그 열망에 교만이나 헛된 영광이 섞이지 않을까 두려워합니다.</p></li><li><p><a href="https://bibleox.com/ko/ko-ctb/1kor/3/#L1-2">1고린 3:1-2</a> 참조.</p></li><li><p><a href="https://bibleox.com/ko/ko-ctb/kol/1/#L16">골로 1:16</a> 참조.</p></li><li><p>'제단'은 성찬을 받으려고 신자들이 모이는 교회를 말합니다(<a href="https://bibleox.com/ko/ko/w/Ig2E_에페소교회에보낸편지#HH-5">「에페소 교회에 보낸 편지」 5:2</a>, <a href="https://bibleox.com/ko/ko/w/Ig2F_필라델피아교회에보낸편지#HH-4">「필라델피아 교회에 보낸 편지」 4장</a> 참조).</p></li><li><p><a href="https://bibleox.com/ko/ko-ctb/is/52/#L5">이사 52:5</a>(칠십인역에 따름). <a href="https://bibleox.com/ko/ko-ctb/rim/2/#L24">로마 2:24</a>에도 인용되어 있습니다.</p></li><li><p><a href="https://bibleox.com/ko/ko-ctb/fil/2/#L10">필립 2:10</a> 참조.</p></li><li><p><a href="https://bibleox.com/ko/ko-ctb/2kor/4/#L14">2고린 4:14</a> 참조.</p></li><li><p>τὸ δοκεῖν — '겉보기, 그렇게 보일 뿐'. 그리스도께서는 참된 육신을 지니지 않으셨고 고난도 겉보기에 지나지 않았다고 주장한 가현설주의자들을 말합니다. 이그나티오스는 9장에서 '참으로'라는 말을 거듭하여 그들에게 답합니다.</p></li><li><p><a href="https://bibleox.com/ko/ko-ctb/1kor/15/#L14-15">1고린 15:14-15</a> 참조.</p></li><li><p><a href="https://bibleox.com/ko/ko-ctb/mf/15/#L13">마태 15:13</a>, <a href="https://bibleox.com/ko/ko/w/Ig2F_필라델피아교회에보낸편지#HH-3">「필라델피아 교회에 보낸 편지」 3:1</a> 참조.</p></li><li><p><a href="https://bibleox.com/ko/ko-ctb/1kor/12/#L27">1고린 12:27</a> 참조.</p></li><li><p>ἀδόκιμος — '실격자'(<a href="https://bibleox.com/ko/ko-ctb/1kor/9/#L27">1고린 9:27</a> 참조).</p></li><li><p><a href="https://bibleox.com/ko/ko-ctb/1kor/15/#L8-9">1고린 15:8-9</a> 참조.</p></li><li><p>ἁγνίζεται ὑμῶν τὸ ἐμὸν πνεῦμα. <a href="https://bibleox.com/ko/ko/w/Ig2E_에페소교회에보낸편지#HH-8">「에페소 교회에 보낸 편지」 8:1</a>과 같은 헌신의 표현입니다.</p></li><li><p><a href="https://bibleox.com/ko/ko-ctb/1sol/5/#L24">1데살 5:24</a> 참조.</p></li></ol>
