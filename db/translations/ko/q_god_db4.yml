- src: Единый_Бог_троичен_в_личностях
  path: YHXd_하느님은삼위일체이시다
  title: 하느님은 삼위일체이십니다
  copy_cover: true
  body: '<h2>하느님은 한 분이시지만 홀로 고독하신 분이 아닙니다</h2><blockquote><p>“<strong><mark>하나님이</mark></strong> 이르시되 <strong>우리의 형상을 따라 우리의 모양대로</strong> <strong>우리가 사람을 만들고</strong> 그들로 바다의 물고기와 하늘의 새와 가축과 온 땅과 땅에 기는 모든 것을 다스리게 하자 하시고” (<a href="https://bibleox.com/ko/ko-nkrv/gen/1/#L26">창 1:26</a>)</p></blockquote><blockquote><p>“<strong><mark>여호와 하나님이</mark></strong> 이르시되 보라 <strong><mark>이 사람이 선악을 아는 일에 우리 중 하나 같이 되었으니</mark></strong> 그가 그의 손을 들어 생명 나무 열매도 따먹고 영생할까 하노라 하시고” (<a href="https://bibleox.com/ko/ko-nkrv/gen/3/#L22">창 3:22</a>)</p></blockquote><h2>한 분이신 하느님은 위격으로는 삼위이십니다: 성부, 성자, 성령</h2><ul><li><p><a href="https://bibleox.com/ru/ru/w/Бог-один">하느님은 한 분이십니다</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/Отец-Бог">성부는 하느님이십니다</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/Христос-Бог">성자는 하느님이십니다</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/СвятойДух-Бог">성령은 하느님이십니다</a></p></li></ul><h2>하느님의 아들은 성부와 하나이십니다</h2><blockquote><p>“<strong>나와 아버지는 하나이니라</strong> 하신대” (<a href="https://bibleox.com/ko/ko-nkrv/in/10/#L30">요 10:30</a>)</p></blockquote><blockquote><p>“무릇 <strong>아버지께 있는 것은 다 내 것이라</strong> 그러므로 내가 말하기를 그가 내 것을 가지고 너희에게 알리시리라 하였노라” (<a href="https://bibleox.com/ko/ko-nkrv/in/16/#L15">요 16:15</a>)</p></blockquote><h2>성령은 성부에게서 나오십니다</h2><blockquote><p>“내가 아버지께로부터 너희에게 보낼 보혜사 곧 <strong>아버지께로부터 나오시는 진리의 성령</strong>이 오실 때에 그가 나를 증언하실 것이요” (<a href="https://bibleox.com/ko/ko-nkrv/in/15/#L26">요 15:26</a>)</p></blockquote><p><strong>[이 글은 아직 작성 중입니다]</strong></p>'
