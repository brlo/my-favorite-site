  path: YHXd_하느님은삼위일체이시다
  title: 하느님은 삼위일체이십니다
  copy_cover: true
  body: '<h2>하느님은 한 분이시지만 홀로 고독하신 분이 아닙니다</h2><blockquote><p>“<strong><mark>하느님께서는</mark></strong> ‘<strong><mark>우리</mark></strong> <strong>모습을</strong> <strong>닮은 사람을 만들자</strong>! 그래서 바다의 고기와 공중의 새, 또 집짐승과 모든 들짐승과 땅 위를 기어다니는 모든 길짐승을 다스리게 하자!’ 하시고,” (<a href="https://bibleox.com/ko/ko-ctb/gen/1/#L26">창 1:26</a>)</p></blockquote><blockquote><p>“<strong><mark>야훼 하느님께서는</mark></strong> ‘이제 <strong><mark>이 사람이 우리들처럼</mark></strong> 선과 악을 알게 되었으니, 손을 내밀어 생명나무 열매까지 따 먹고 끝없이 살게 되어서는 안 되겠다’ 고 생각하시고” (<a href="https://bibleox.com/ko/ko-ctb/gen/3/#L22">창 3:22</a>)</p></blockquote><h2>한 분이신 하느님은 위격으로는 삼위이십니다: 성부, 성자, 성령</h2><ul><li><p><a href="https://bibleox.com/ru/ru/w/Бог-один">하느님은 한 분이십니다</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/Отец-Бог">성부는 하느님이십니다</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/Христос-Бог">성자는 하느님이십니다</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/СвятойДух-Бог">성령은 하느님이십니다</a></p></li></ul><h2>하느님의 아들은 성부와 하나이십니다</h2><blockquote><p>“<strong>아버지와 나는 하나이다</strong>‘하고 대답하셨다.” (<a href="https://bibleox.com/ko/ko-ctb/in/10/#L30">요한 10:30</a>)</p></blockquote><blockquote><p>“<strong>아버지께서 가지고 계신 것은 모두 다 나의 것이다</strong>. 그래서 성령께서 내게 들은 것을 너희에게 알려 주시리라고 내가 말했던 것이다.‘” (<a href="https://bibleox.com/ko/ko-ctb/in/16/#L15">요한 16:15</a>)</p></blockquote><h2>성령은 성부에게서 나오십니다</h2><blockquote><p>“내가 아버지께 청하여 너희에게 보낼 협조자 곧 <strong>아버지께로부터 나오시는 진리의 성령</strong>이 오시면 그분이 나를 증언할 것이다.” (<a href="https://bibleox.com/ko/ko-ctb/in/15/#L26">요한 15:26</a>)</p></blockquote><p><strong>[이 글은 아직 작성 중입니다]</strong></p>'
