  title: 성령은 하느님이십니다
  copy_cover: true
  body: <h2>아나니아는 성령을, 곧 하느님을 속였습니다</h2><blockquote><p>“그 때에 베드로가 그를 이렇게 꾸짖었다. ‘아나니아, 왜 사탄에게 마음을 빼앗겨 <strong>성령을 속이고</strong> 땅 판 돈의 일부를 빼돌렸소? 팔기 전에도 그 땅은 당신 것이었고 판 뒤에도 그 돈은 당신 마음대로 할 수 있었던 것이 아니오? 그런데 어쩌자고 그런 생각을 품었소? <strong>당신은 사람을 속인 것이 아니라 하느님을 속인 것이오</strong>!’” (<a href="https://bibleox.com/ko/ko-ctb/act/5/#L3-4">사도 5:3-4</a>)</p></blockquote><h2>하느님께서 예언자들을 통하여 말씀하셨습니다</h2><blockquote><p>“<strong>하느님께서</strong> 예전에는 <strong>예언자들을 시켜</strong> 여러 번 여러 가지 모양으로 우리 조상들에게 말씀하셨습니다.” (<a href="https://bibleox.com/ko/ko-ctb/evr/1/#L1">히브 1:1</a>)</p></blockquote><blockquote><p>“그리스도 예수의 종, 나 바울로가 이 편지를 씁니다. 나는 사도로 부르심을 받아 <strong>하느님의 복음을</strong> 전하는 특별한 사명을 띤 사람입니다. 이 복음은 성서에 있는 바와 같이 일찌기 <strong>하느님께서 당신의 예언자들을 통하여 약속하신 것입니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/rim/1/#L1-2">로마 1:1-2</a>)</p></blockquote><blockquote><p>“<strong>하느님께서는 모든 예언자의 입을 빌어</strong> 그리스도가 고난을 받을 것이라고 말씀하셨는데 그 말씀이 미리 예언하신 대로 이루어진 것입니다. &lt;…&gt; 예수께서는 만물을 새롭게 하시는 그 때가 오기까지 하늘에 계셔야 합니다. 이것은 <strong>하느님께서 오래 전부터 당신의 거룩한 예언자들의 입을 빌어</strong> 말씀하신 대로입니다.” (<a href="https://bibleox.com/ko/ko-ctb/act/3/#L18,21">사도 3:18,21</a>)</p></blockquote><h2>예언자들을 통하여 말씀하신 분은 성령이십니다</h2><blockquote><p>“이렇게 서로 의견을 달리한 채 흩어지려 하자 바울로가 이렇게 한 마디 덧붙였다. ‘<strong>성령께서 예언자 이사야를 시켜</strong> 당신들의 조상에게 하신 말씀은 지당합니다. 들어 보십시오. 이 백성에게 가서 말하여라. 너희가 듣고 또 들어도 알아 듣지 못하고 보고 또 보아도 알아 보지 못함은” (<a href="https://bibleox.com/ko/ko-ctb/act/28/#L25-26">사도 28:25-26</a>)</p></blockquote><blockquote><p>“그러므로 <strong>성령께서는 이렇게 말씀하십니다</strong>. ‘너희가 오늘 하느님의 음성을 듣거든” (<a href="https://bibleox.com/ko/ko-ctb/evr/3/#L7">히브 3:7</a>)</p></blockquote><blockquote><p>“교우 여러분, 예수를 잡아 자들의 앞잡이가 된 유다에 관하여 <strong>성령께서 다윗의 입을 빌어 예언하신</strong> 말씀은 정녕 이루어져야만 했습니다.” (<a href="https://bibleox.com/ko/ko-ctb/act/1/#L16">사도 1:16</a>)</p></blockquote>
