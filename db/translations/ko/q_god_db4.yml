  path: xBks_하느님은찾는이에게자신을드러내신다
  title: 하느님은 당신을 찾는 이에게 당신을 드러내십니다
  copy_cover: true
  body: <blockquote><p>“나를 사랑하면 내 사랑을 받고 <strong>애타게 찾으면 나를 만나리라</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/pr/8/#L17">잠언 8:17</a>)</p></blockquote><blockquote><p>“솔로몬아, 이 아비를 보살펴 주시던 하느님을 스스로 마음을 다 바쳐 사랑하며 섬기도록 하여라. 야훼께서는 사람의 마음을 헤아리시고 속셈까지 꿰뚫어 보신다. <strong>네가 찾으면 만나 주시지만</strong>, 네가 저버리면 너를 아주 버리실 것이다.” (<a href="https://bibleox.com/ko/ko-ctb/1par/28/#L9">역상 28:9</a>)</p></blockquote><blockquote><p>“야훼여, <strong>당신을 찾는 자를 아니 버리시기에</strong>, 당신 이름 받드는 자 그 품에 안기옵니다.” (<a href="https://bibleox.com/ko/ko-ctb/ps/9/#L10">시편 9:10</a>)</p></blockquote><blockquote><p>“야훼, 하늘에서 세상 굽어 보시며 혹시나 <strong>슬기로운 사람 있는지, 하느님 찾는 자 혹시라도 있는지</strong> 이리저리 두루 살피시지만” (<a href="https://bibleox.com/ko/ko-ctb/ps/14/#L2">시편 14:2</a>)</p></blockquote><blockquote><p>“<strong>야훼 찾아 호소할 때 들어 주시고</strong> 몸서리쳐지는 곤경에서 건져 주셨다. <strong>그를 쳐다보는 자, 그 얼굴 빛나고</strong> 부끄러운 꼴 당하지 아니하리라.” (<a href="https://bibleox.com/ko/ko-ctb/ps/34/#L4-5">시편 34:4-5</a>)</p></blockquote><blockquote><p>“맹수들은 먹이 찾아 배고플지 모르나 <strong>야훼를 찾는 사람은 온갖 복을 받아 부족함이 없으리라</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/ps/34/#L10">시편 34:10</a>)</p></blockquote><blockquote><p>“나의 말을 들어라. 정의를 추구하고 <strong>야훼를 찾는 자들아</strong>. 너희를 떼어 낸 바위를 우러러 보고 너희를 파낸 동굴을 쳐다보아라.” (<a href="https://bibleox.com/ko/ko-ctb/is/51/#L1">이사 51:1</a>)</p></blockquote><blockquote><p>“‘구하라, 받을 것이다. <strong>찾으라, 얻을 것이다</strong>. 문을 두드려라, 열릴 것이다.” (<a href="https://bibleox.com/ko/ko-ctb/mf/7/#L7">마태 7:7</a>)</p></blockquote><blockquote><p>“믿음이 없이는 하느님을 기쁘게 해 드릴 수 없습니다. 하느님께로 가까이 가는 사람은 하느님이 계시다는 것과 <strong>하느님께서 당신을 찾는 사람들에게 상을 주신 다는 것</strong>을 믿어야 합니다.” (<a href="https://bibleox.com/ko/ko-ctb/evr/11/#L6">히브 11:6</a>)</p></blockquote><blockquote><p>“더구나 사람을 회개시키려고 베푸시는 하느님의 자비를 깨닫기는 커녕 오히려 그 크신 자비와 관용과 인내를 업신여기는 자가 있다니 될 말입니까? 그러고도 마음이 완고해서 회개할 생각도 하지 않으니 이런 자는 <strong>하느님의 공정한 심판</strong>이 내릴 진노의 날에 자기가 받을 벌을 쌓아 올리고 있는 것입니다. 하느님께서는 <strong>각 사람에게 그 행실대로 갚아 주실 것입니다</strong>. <strong>꾸준히 선을 행하면서 영광과 명예와 불멸의 것을 추구하는 사람들에게는 영원한 생명을 주실 것이고</strong> <strong>자기 이익만을 생각하면서 진리를 물리치고 옳지 않은 것을 따르는 사람들에게는 진노와 벌을 내리실 것입니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/rim/2/#L4-8">로마 2:4-8</a>)</p></blockquote><blockquote><p>“그 거룩하신 이름을 자랑하여라. <strong>야훼 찾는 마음에 기쁨 있어라. 야훼를 찾아라</strong>, 그의 힘을 빌어라. 잠시도 그의 곁을 떠나지 말아라.” (<a href="https://bibleox.com/ko/ko-ctb/ps/105/#L3-4">시편 105:3-4</a>)</p></blockquote>
