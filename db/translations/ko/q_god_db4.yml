  path: X9CT_성령은하느님이시다
  title: 성령은 하느님이십니다
  copy_cover: true
  body: <h2>아나니아는 성령을, 곧 하느님을 속였습니다</h2><blockquote><p>“베드로가 이르되 아나니아야 어찌하여 사탄이 네 마음에 가득하여 네가 <strong>성령을 속이고</strong> 땅 값 얼마를 감추었느냐 땅이 그대로 있을 때에는 네 땅이 아니며 판 후에도 네 마음대로 할 수가 없더냐 어찌하여 이 일을 네 마음에 두었느냐 <strong>사람에게 거짓말한 것이 아니요 하나님께로다</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/act/5/#L3-4">행 5:3-4</a>)</p></blockquote><h2>하느님께서 예언자들을 통하여 말씀하셨습니다</h2><blockquote><p>“옛적에 <strong>선지자들을 통하여</strong> 여러 부분과 여러 모양으로 우리 조상들에게 말씀하신 <strong>하나님이</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/evr/1/#L1">히 1:1</a>)</p></blockquote><blockquote><p>“예수 그리스도의 종 바울은 사도로 부르심을 받아 <strong>하나님의 복음을</strong> 위하여 택정함을 입었으니 이 복음은 <strong>하나님이 선지자들을 통하여</strong> 그의 아들에 관하여 <strong>성경에 미리 약속하신 것이라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/rim/1/#L1-2">롬 1:1-2</a>)</p></blockquote><blockquote><p>“그러나 <strong>하나님이 모든 선지자의 입을 통하여</strong> 자기의 그리스도께서 고난 받으실 일을 미리 알게 하신 것을 이와 같이 이루셨느니라 &lt;…&gt; <strong>하나님이 영원 전부터 거룩한 선지자들의 입을 통하여</strong> 말씀하신 바 만물을 회복하실 때까지는 하늘이 마땅히 그를 받아 두리라” (<a href="https://bibleox.com/ko/ko-nkrv/act/3/#L18,21">행 3:18,21</a>)</p></blockquote><h2>예언자들을 통하여 말씀하신 분은 성령이십니다</h2><blockquote><p>“서로 맞지 아니하여 흩어질 때에 바울이 한 말로 이르되 <strong>성령이 선지자 이사야를 통하여</strong> 너희 조상들에게 말씀하신 것이 옳도다 일렀으되 이 백성에게 가서 말하기를 너희가 듣기는 들어도 도무지 깨닫지 못하며 보기는 보아도 도무지 알지 못하는도다” (<a href="https://bibleox.com/ko/ko-nkrv/act/28/#L25-26">행 28:25-26</a>)</p></blockquote><blockquote><p>“그러므로 <strong>성령이 이르신 바와 같이</strong> 오늘 너희가 그의 음성을 듣거든” (<a href="https://bibleox.com/ko/ko-nkrv/evr/3/#L7">히 3:7</a>)</p></blockquote><blockquote><p>“형제들아 <strong>성령이 다윗의 입을 통하여</strong> 예수 잡는 자들의 길잡이가 된 유다를 가리켜 <strong>미리 말씀하신</strong> 성경이 응하였으니 마땅하도다” (<a href="https://bibleox.com/ko/ko-nkrv/act/1/#L16">행 1:16</a>)</p></blockquote>
