  title: 하느님은 변하지 않으십니다
  copy_cover: true
  body: <blockquote><p>“나는 야훼라, <strong>나는 변하지 않는다</strong>. 너희를 여전히 야곱의 후손으로 대접하리라.” (<a href="https://bibleox.com/ko/ko-ctb/mal/3/#L6">말라 3:6</a>)</p></blockquote><blockquote><p>“온갖 훌륭한 은혜와 모든 완전한 선물은 위로부터 오는 것입니다. 하늘의 빛들을 만드신 아버지께로부터 내려 오는 것입니다. <strong>하느님 아버지는 변함도 없으시고</strong> 우리를 외면하심으로써 그늘 속에 버려 두시는 일도 없으십니다.” (<a href="https://bibleox.com/ko/ko-ctb/iak/1/#L17">야고 1:17</a>)</p></blockquote><blockquote><p>“하느님께서는 사람처럼 거짓말하실 리도 없고 <strong>사람의 아들처럼 변덕을 부리실 리도 없으시다오</strong>. 말씀만 하시고 그대로 하지 않으실 리 없고 하신 말씀을 그대로 이루지 않으실 리 없으시다오.” (<a href="https://bibleox.com/ko/ko-ctb/chis/23/#L19">민 23:19</a>)</p></blockquote><blockquote><p>“그 옛날부터 든든히 다지신 이 땅이, 손수 만드신 저 하늘들이 사라질지라도 하느님은 그대로 계시옵니다. 옷처럼 모든 것이 삭아 빠져도 갈아 입는 헌옷처럼 모든 것이 바뀌어도 <strong>하느님은 언제나 같으신 분, 해가 바뀌고 또 바뀌어도 영원히 계시옵니다</strong>.‘” (<a href="https://bibleox.com/ko/ko-ctb/ps/102/#L25-27">시편 102:25-27</a>; <a href="https://bibleox.com/ko/ko-ctb/evr/1/#L10-12">히브 1:10-12</a>)</p></blockquote><blockquote><p>“<strong>예수 그리스도는 어제나 오늘이나 또 영원히 변하지 않으시는 분입니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/evr/13/#L8">히브 13:8</a>)</p></blockquote><blockquote><p>“주님, 곧 전능하신 분께서 … <strong>당신의 지혜의 위대한 업적을 질서 있게 하셨으니, 그분은 영원 전부터 영원까지 계시고 더해진 것도 줄어든 것도 없다</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/prsir/42/#L17,21">집회 42:17,21</a>, 그리스어에서 번역)</p></blockquote><blockquote><p>“우리 종교는 영원한 생명에 대한 희망을 가져다 줍니다. 이 영원한 생명은 <strong>거짓말을 하시지 않는 하느님께서</strong> 아득한 옛날에 벌써 약속해 주신 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/tit/1/#L2">디도 1:2</a>)</p></blockquote>
