- src: Бог-открывается-ищущим-Его
  path: xBks_하느님은찾는이에게자신을드러내신다
  title: 하느님은 당신을 찾는 이에게 당신을 드러내십니다
  copy_cover: true
  body: <blockquote><p>“나를 사랑하는 자들이 나의 사랑을 입으며 <strong>나를 간절히 찾는 자가 나를 만날 것이니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/pr/8/#L17">잠 8:17</a>)</p></blockquote><blockquote><p>“내 아들 솔로몬아 너는 네 아버지의 하나님을 알고 온전한 마음과 기쁜 뜻으로 섬길지어다 여호와께서는 모든 마음을 감찰하사 모든 의도를 아시나니 <strong>네가 만일 그를 찾으면 만날 것이요</strong> 만일 네가 그를 버리면 그가 너를 영원히 버리시리라” (<a href="https://bibleox.com/ko/ko-nkrv/1par/28/#L9">대상 28:9</a>)</p></blockquote><blockquote><p>“여호와여 주의 이름을 아는 자는 주를 의지하오리니 이는 <strong>주를 찾는 자들을 버리지 아니하심이니이다</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ps/9/#L10">시 9:10</a>)</p></blockquote><blockquote><p>“여호와께서 하늘에서 인생을 굽어살피사 <strong>지각이 있어 하나님을 찾는 자가 있는가</strong> 보려 하신즉” (<a href="https://bibleox.com/ko/ko-nkrv/ps/14/#L2">시 14:2</a>)</p></blockquote><blockquote><p>“<strong>내가 여호와께 간구하매 내게 응답하시고</strong> 내 모든 두려움에서 나를 건지셨도다 <strong>그들이 주를 앙망하고 광채를 내었으니</strong> 그들의 얼굴은 부끄럽지 아니하리로다” (<a href="https://bibleox.com/ko/ko-nkrv/ps/34/#L4-5">시 34:4-5</a>)</p></blockquote><blockquote><p>“젊은 사자는 궁핍하여 주릴지라도 <strong>여호와를 찾는 자는 모든 좋은 것에 부족함이 없으리로다</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ps/34/#L10">시 34:10</a>)</p></blockquote><blockquote><p>“의를 따르며 <strong>여호와를 찾아 구하는 너희는</strong> 내게 들을지어다 너희를 떠낸 반석과 너희를 파낸 우묵한 구덩이를 생각하여 보라” (<a href="https://bibleox.com/ko/ko-nkrv/is/51/#L1">사 51:1</a>)</p></blockquote><blockquote><p>“구하라 그리하면 너희에게 주실 것이요 <strong>찾으라 그리하면 찾아낼 것이요</strong> 문을 두드리라 그리하면 너희에게 열릴 것이니” (<a href="https://bibleox.com/ko/ko-nkrv/mf/7/#L7">마 7:7</a>)</p></blockquote><blockquote><p>“믿음이 없이는 하나님을 기쁘시게 하지 못하나니 하나님께 나아가는 자는 반드시 그가 계신 것과 또한 <strong>그가 자기를 찾는 자들에게 상 주시는 이심을</strong> 믿어야 할지니라” (<a href="https://bibleox.com/ko/ko-nkrv/evr/11/#L6">히 11:6</a>)</p></blockquote><blockquote><p>“혹 네가 하나님의 인자하심이 너를 인도하여 회개하게 하심을 알지 못하여 그의 인자하심과 용납하심과 길이 참으심이 풍성함을 멸시하느냐 다만 네 고집과 회개하지 아니한 마음을 따라 진노의 날 곧 <strong>하나님의 의로우신 심판</strong>이 나타나는 그 날에 임할 진노를 네게 쌓는도다 하나님께서 <strong>각 사람에게 그 행한 대로 보응하시되</strong> <strong>참고 선을 행하여 영광과 존귀와 썩지 아니함을 구하는 자에게는 영생으로 하시고</strong> <strong>오직 당을 지어 진리를 따르지 아니하고 불의를 따르는 자에게는 진노와 분노로 하시리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/rim/2/#L4-8">롬 2:4-8</a>)</p></blockquote><blockquote><p>“그의 거룩한 이름을 자랑하라 <strong>여호와를 구하는 자들은 마음이 즐거울지로다 여호와와 그의 능력을 구할지어다</strong> 그의 얼굴을 항상 구할지어다” (<a href="https://bibleox.com/ko/ko-nkrv/ps/105/#L3-4">시 105:3-4</a>)</p></blockquote>
