- src: Бог-не-похож-на-человека-внешне
  path: HaNW_하느님은겉모습이사람과같지않으시다
  title: 하느님은 겉모습이 사람과 같지 않으십니다
  copy_cover: true
  body: <p>하느님께서는 사람을 당신의 모습대로 창조하셨지만:</p><blockquote><p>“<strong>하나님이 자기 형상 곧 하나님의 형상대로 사람을 창조하시되</strong> 남자와 여자를 창조하시고” (<a href="https://bibleox.com/ko/ko-nkrv/gen/1/#L27">창 1:27</a>)</p></blockquote><p>이것은 하느님께서 겉모습으로 사람과 닮으셨다는 뜻이 아닙니다. 하느님께 손과 발, 눈과 귀 같은 것이 있다는 뜻이 아닙니다:</p><blockquote><p>“<strong>주께도 육신의 눈이 있나이까 주께서 사람처럼 보시나이까</strong> 주의 날이 어찌 사람의 날과 같으며 주의 해가 어찌 인생의 해와 같기로” (<a href="https://bibleox.com/ko/ko-nkrv/iov/10/#L4-5">욥 10:4-5</a>)</p></blockquote><blockquote><p>“이는 <strong>내 생각이 너희의 생각과 다르며 내 길은 너희의 길과 다름이니라</strong> 여호와의 말씀이니라 이는 하늘이 땅보다 높음 같이 <strong>내 길은 너희의 길보다 높으며 내 생각은 너희의 생각보다 높으니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/is/55/#L8-9">사 55:8-9</a>)</p></blockquote><blockquote><p>“<strong>하나님은 사람이 아니시니 거짓말을 하지 않으시고</strong> 인생이 아니시니 후회가 없으시도다 어찌 그 말씀하신 바를 행하지 않으시며 하신 말씀을 실행하지 않으시랴” (<a href="https://bibleox.com/ko/ko-nkrv/chis/23/#L19">민 23:19</a>)</p></blockquote><p>사람은 육체와 영혼과 영으로 이루어져 있습니다. 그러나 하느님께서는 육체로 이루어져 있지 않으십니다. 하느님은 영이십니다:</p><blockquote><p>“<strong>하나님은 영이시니</strong> 예배하는 자가 영과 진리로 예배할지니라” (<a href="https://bibleox.com/ko/ko-nkrv/in/4/#L24">요 4:24</a>)</p></blockquote><p>하느님께서는 물질로 이루어져 있지 않으십니다. 세상과 물질이 창조되기 전부터 계시기 때문입니다:</p><blockquote><p>“태초에 말씀이 계시니라 이 말씀이 하나님과 함께 계셨으니 이 말씀은 곧 하나님이시니라 &lt;…&gt; <strong>만물이 그로 말미암아 지은 바 되었으니 지은 것이 하나도 그가 없이는 된 것이 없느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/in/1/#L1,3">요 1:1,3</a>)</p></blockquote><p>이것은 하느님의 본성에 관한 말씀입니다. 물론 하느님께서는 사람이 되셨고(사람과 닮으신 것이 아니라 참 사람이 되셨고), 그때부터 우리는 그분을 사람으로도 말할 수 있습니다. 그러나 사람이 되셨다고 해서 전에 그러하셨던 대로 하느님이심을 그치신 것은 아닙니다. 여기서 말하는 것은 하느님의 본성입니다.</p>
