  title: 하느님은 변하지 않으십니다
  copy_cover: true
  body: <blockquote><p>“<strong>나 여호와는 변하지 아니하나니</strong> 그러므로 야곱의 자손들아 너희가 소멸되지 아니하느니라” (<a href="https://bibleox.com/ko/ko-nkrv/mal/3/#L6">말 3:6</a>)</p></blockquote><blockquote><p>“온갖 좋은 은사와 온전한 선물이 다 위로부터 빛들의 아버지께로부터 내려오나니 <strong>그는 변함도 없으시고</strong> 회전하는 그림자도 없으시니라” (<a href="https://bibleox.com/ko/ko-nkrv/iak/1/#L17">약 1:17</a>)</p></blockquote><blockquote><p>“하나님은 사람이 아니시니 거짓말을 하지 않으시고 <strong>인생이 아니시니 후회가 없으시도다</strong> 어찌 그 말씀하신 바를 행하지 않으시며 하신 말씀을 실행하지 않으시랴” (<a href="https://bibleox.com/ko/ko-nkrv/chis/23/#L19">민 23:19</a>)</p></blockquote><blockquote><p>“주께서 옛적에 땅의 기초를 놓으셨사오며 하늘도 주의 손으로 지으신 바니이다 천지는 없어지려니와 주는 영존하시겠고 그것들은 다 옷 같이 낡으리니 의복 같이 바꾸시면 바뀌려니와 <strong>주는 한결같으시고 주의 연대는 무궁하리이다</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ps/102/#L25-27">시 102:25-27</a>; <a href="https://bibleox.com/ko/ko-nkrv/evr/1/#L10-12">히 1:10-12</a>)</p></blockquote><blockquote><p>“<strong>예수 그리스도는 어제나 오늘이나 영원토록 동일하시니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/evr/13/#L8">히 13:8</a>)</p></blockquote><blockquote><p>“주님, 곧 전능하신 분께서 … <strong>당신의 지혜의 위대한 업적을 질서 있게 하셨으니, 그분은 영원 전부터 영원까지 계시고 더해진 것도 줄어든 것도 없다</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/prsir/42/#L17,21">집회 42:17,21</a>, 그리스어에서 번역)</p></blockquote><blockquote><p>“영생의 소망을 위함이라 이 영생은 <strong>거짓이 없으신 하나님이</strong> 영원 전부터 약속하신 것인데” (<a href="https://bibleox.com/ko/ko-nkrv/tit/1/#L2">딛 1:2</a>)</p></blockquote>
  meta_desc: 하느님께서 변하지 않으심에 관한 성경 구절
