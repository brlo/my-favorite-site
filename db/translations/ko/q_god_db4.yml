  path: HaNW_하느님은겉모습이사람과같지않으시다
  title: 하느님은 겉모습이 사람과 같지 않으십니다
  copy_cover: true
  body: <p>하느님께서는 사람을 당신의 모습대로 창조하셨지만:</p><blockquote><p>“<strong>당신의 모습대로 사람을 지어 내셨다</strong>. 하느님의 모습대로 사람을 지어 내시되 남자와 여자로 지어 내시고” (<a href="https://bibleox.com/ko/ko-ctb/gen/1/#L27">창 1:27</a>)</p></blockquote><p>이것은 하느님께서 겉모습으로 사람과 닮으셨다는 뜻이 아닙니다. 하느님께 손과 발, 눈과 귀 같은 것이 있다는 뜻이 아닙니다:</p><blockquote><p>“<strong>당신의 눈은 사람의 눈과 같으시며 사람이 보는 만큼밖에는 보지 못하십니까</strong>? 당신의 수명은 사람의 수명과 같으시며 인간이 사는 만큼밖에는 살지 못하십니까?” (<a href="https://bibleox.com/ko/ko-ctb/iov/10/#L4-5">욥 10:4-5</a>)</p></blockquote><blockquote><p>“<strong>내 생각은 너희 생각과 같지 않다. 나의 길은 너희 길과 같지 않다</strong>.‘ 야훼의 말씀이시다. 하늘이 땅에서 아득하듯 <strong>나의 길은 너희 길보다 높다. 나의 생각은 너희 생각보다 높다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/is/55/#L8-9">이사 55:8-9</a>)</p></blockquote><blockquote><p>“<strong>하느님께서는 사람처럼 거짓말하실 리도 없고</strong> 사람의 아들처럼 변덕을 부리실 리도 없으시다오. 말씀만 하시고 그대로 하지 않으실 리 없고 하신 말씀을 그대로 이루지 않으실 리 없으시다오.” (<a href="https://bibleox.com/ko/ko-ctb/chis/23/#L19">민 23:19</a>)</p></blockquote><p>사람은 육체와 영혼과 영으로 이루어져 있습니다. 그러나 하느님께서는 육체로 이루어져 있지 않으십니다. 하느님은 영이십니다:</p><blockquote><p>“<strong>하느님은 영적인 분이시다</strong>. 그러므로 예배하는 사람들은 영적으로 참되게 하느님께 예배드려야 한다.‘” (<a href="https://bibleox.com/ko/ko-ctb/in/4/#L24">요한 4:24</a>) <em>(그리스어 원문은 πνεῦμα ὁ θεός — “<strong>하느님은 영이시다</strong>”입니다.)</em></p></blockquote><p>하느님께서는 물질로 이루어져 있지 않으십니다. 세상과 물질이 창조되기 전부터 계시기 때문입니다:</p><blockquote><p>“한 처음, 천지가 창조되기 전부터 말씀이 계셨다. 말씀은 하느님과 함께 계셨고 하느님과 똑같은 분이셨다. &lt;…&gt; <strong>모든 것은 말씀을 통하여 생겨났고 이 말씀 없이 생겨난 것은 하나도 없다</strong>. 생겨난 모든 것이” (<a href="https://bibleox.com/ko/ko-ctb/in/1/#L1,3">요한 1:1,3</a>)</p></blockquote><p>이것은 하느님의 본성에 관한 말씀입니다. 물론 하느님께서는 사람이 되셨고(사람과 닮으신 것이 아니라 참 사람이 되셨고), 그때부터 우리는 그분을 사람으로도 말할 수 있습니다. 그러나 사람이 되셨다고 해서 전에 그러하셨던 대로 하느님이심을 그치신 것은 아닙니다. 여기서 말하는 것은 하느님의 본성입니다.</p>
