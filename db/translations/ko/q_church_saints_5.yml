- src: Богородица
  path: Th9m_하느님의_어머니
  title: 하느님의 어머니(성모님)
  copy_cover: true
  body: '<h2>예비 질문</h2><p>이 글은 <strong>그리스도께서 하느님이시라는</strong> 사실에서 출발합니다(<a href="https://bibleox.com/ru/ru/w/Христос-Бог">성경 구절</a>).</p><p>동정 마리아는 성인 공경의 가르침에 따라 공경받으므로, 먼저 <a href="https://bibleox.com/ru/ru/w/почитание-святых-в-Библии">성인 공경</a>과 <a href="https://bibleox.com/ru/ru/w/молитвы-святым">성인들에게 드리는 기도</a>를 증명해야 합니다.</p><p>여기서는 동정 마리아를 성인 가운데 한 분으로서 공경하는 근거만이 아니라, <strong>하느님의 거룩한 종과 벗 가운데 가장 크신 분</strong>으로서, 예수 그리스도의 어머니(곧 예수 그리스도께서 하느님이시므로 하느님의 어머니)로서 특별히 공경하는 근거를 살핍니다.</p><h2>하느님의 어머니를 특별히 공경하는 까닭</h2><ol><li><p><strong>하느님의 말씀에 대한 동정 마리아의 특별한 경청;</strong></p></li><li><p><strong>하느님께 대한 완전하고 겸손한 순종;</strong></p></li><li><p><strong>하느님께 택함받음.</strong> 우주의 어느 누구도 하느님을 그분의 인성으로 낳는 영예를 받지 못했습니다. 공로는 낳았다는 데 있지 않고, 하느님께서 마리아의 자질을 미리 아시고(<a href="https://bibleox.com/ko/ko-ctb/rim/8/#L29">로마 8:29</a>) 그 자질 때문에 택하셨다는 데 있습니다. 이 택하심으로 하느님께서는 그분의 위대함을 가리키십니다;</p></li><li><p><strong>하느님의 아들께서 동정 마리아를 어머니로 공경하십니다.</strong> 다른 누구도(우주의 어떤 존재도) 하느님의 아들의 어머니가 아닙니다;</p></li><li><p><strong>예언의 성취:</strong> “이제부터는 온 백성이 나를 복되다 하리니”(<a href="https://bibleox.com/ko/ko-ctb/lk/1/#L48">루가 1:48</a>). 곧 사람들의 모든 세대(γενεαί, 게네아이)입니다. 하느님께서는 동정 마리아에게 큰 일을 해 주셨습니다: “<strong>전능하신 분께서 나에게 큰 일을 해 주신</strong> 덕분입니다. 주님은 거룩하신 분”(<a href="https://bibleox.com/ko/ko-ctb/lk/1/#L49">루가 1:49</a>).</p></li></ol><h2>겸손 때문에 택함받으셨습니다</h2><blockquote><p>“이 말을 듣고 마리아는 이렇게 노래를 불렀다. ‘내 영혼이 주님을 찬양하며 내 구세주 하느님을 생각하는 기쁨에 이 마음 설레입니다. <strong><mark>주께서 여종의 비천한 신세를 돌보셨습니다</mark></strong>. 이제부터는 온 백성이 나를 복되다 하리니” (<a href="https://bibleox.com/ko/ko-ctb/lk/1/#L46-48">루가 1:46-48</a>)</p></blockquote><p>가장 큰 예언자의 아버지(즈가리야)조차 불신, 곧 믿지 못하고 의심한 탓에 대천사에게 벌을 받았습니다(<a href="https://bibleox.com/ko/ko-ctb/lk/1/#L20">루가 1:20</a>). 그러나 하느님의 어머니는 자기에게 정해진 일을 순종하여 받아들이며 겸손히 대답하셨습니다:</p><blockquote><p>“이 말을 들은 마리아는 ‘이 몸은 주님의 종입니다. <strong><mark>지금 말씀대로 저에게 이루어지기를 바랍니다</mark></strong>’하고 대답하였다. 그러자 천사는 마리아에게서 떠나 갔다.” (<a href="https://bibleox.com/ko/ko-ctb/lk/1/#L38">루가 1:38</a>)</p></blockquote><p>겸손의 중요성에 관하여:</p><blockquote><p>“주님은 <strong>겸손한 이들의 하느님</strong>, 약한 이들의 도움이십니다” (<a href="https://bibleox.com/ko/gr-lxx-byz/iudf/9/#L11">유딧 9:11</a>, 그리스어에서 번역)</p></blockquote><blockquote><p>“네가 위대할수록 <strong>더욱 자신을 낮추어라</strong>. … 주님의 힘은 크시고 겸손한 이들로 영광을 받으신다” (<a href="https://bibleox.com/ko/gr-lxx-byz/prsir/3/#L18,20">집회 3:18,20</a>, 그리스어에서 번역)</p></blockquote><p>겸손에 관한 중요한 구절: <a href="https://bibleox.com/ru/ru/w/смирение">겸손</a>.</p><h2>하느님의 말씀을 가장 주의 깊게 들으신 분</h2><blockquote><p>“내 아들아, <strong><mark>내 말을 명심하고 내가 일러 준 길을 기꺼이 따라라</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/pr/23/#L26">잠언 23:26</a>)</p></blockquote><blockquote><p>“<strong><mark>마리아는 이 모든 일을 마음 속 깊이 새겨 오래 간직하였다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/lk/2/#L19">루가 2:19</a>)</p></blockquote><blockquote><p>“예수는 부모를 따라 나자렛으로 돌아 와 부모에게 순종하며 살았다. 그 어머니는 <strong><mark>이 모든 일을 마음 속에 간직하였다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/lk/2/#L51">루가 2:51</a>)</p></blockquote><blockquote><p>“예수께서 이 말씀을 하고 계실 때 군중 속에서 한 여자가 큰 소리로 ‘당신을 낳아서 젖을 먹인 여인은 얼마나 행복합니까!’ 하고 외치자 예수께서는 ‘<strong>하느님의 말씀을 듣고</strong> 그 말씀을 <strong>지키는 사람들이 오히려 행복하다</strong>’하고 대답하셨다.” (<a href="https://bibleox.com/ko/ko-ctb/lk/11/#L27-28">루가 11:27-28</a>)</p></blockquote><p>성 이그나티 브랸차니노프의 말대로 그분은 하느님의 가르침을 가장 주의 깊게 꾸준히 듣고 실천하신 분이었습니다:</p><blockquote><p>“평생 동정이신 분은 하느님이시며 사람이신 분의 어머니가 되셨기 때문에, 또 <strong>하느님이시며 사람이신 분이 전하신 가르침을 가장 꾸준히, 가장 주의 깊게 듣고 실천하신 분</strong>이기 때문에 모든 거룩한 사람들보다 높으십니다.”</p></blockquote><p>(<a href="https://azbyka.ru/otechnik/Ignatij_Brjanchaninov/asketicheskaya_propoved/54">하느님의 어머니에 관한 정교회 가르침의 해설</a>, 러시아어에서 번역)</p><h2>그리스도 하느님의 어머니가 되셨습니다</h2><p>하느님의 어머니를 특별히 공경하는 까닭 가운데 하나는 그분이 (인성으로) 하느님의 어머니이시라는 사실입니다. 우주의 어떤 존재도 하느님의 어머니가 아닙니다. 하느님의 계명은 부모를 공경하라고 합니다(<a href="https://bibleox.com/ru/ru/w/10-заповедей">다섯째 계명</a>). 그러므로 그리스도 하느님 자신이 하느님의 어머니를 당신의 어머니로 공경하시고, 그분을 따라 믿는 제자들도 공경합니다.</p><h3>동정 마리아는 하느님의 아들을 낳으셨습니다</h3><p>바로 하느님의 외아들께서 참으로 여인에게서 나셨습니다:</p><blockquote><p>“그러나 때가 찼을 때 <strong><mark>하느님께서 당신의 아들을 보내시어 여자의 몸에서 나게 하시고</mark></strong> 율법의 지배를 받게 하시어” (<a href="https://bibleox.com/ko/ko-ctb/gal/4/#L4">갈라 4:4</a>)</p></blockquote><p>외아들, 하느님의 말씀께서 참으로 사람이 되셨습니다:</p><blockquote><p>“<strong><mark>말씀이 사람이 되셔서</mark></strong> 우리와 함께 계셨는데 우리는 그분의 영광을 보았다. 그것은 <strong>외아들</strong>이 아버지에게서 받은 영광이었다. 그분에게는 은총과 충만하였다.” (<a href="https://bibleox.com/ko/ko-ctb/in/1/#L14">요한 1:14</a>)</p></blockquote><p>대천사 가브리엘은 동정 마리아의 아기를 하느님의 아들이라고 직접 부릅니다:</p><blockquote><p>“천사는 이렇게 대답하였다. ‘성령이 너에게 내려 오시고 지극히 높으신 분의 힘이 감싸 주실 것이다. 그러므로 태어나실 그 거룩한 아기를 <strong><mark>하느님의 아들</mark></strong>이라 부르게 될 것이다.” (<a href="https://bibleox.com/ko/ko-ctb/lk/1/#L35">루가 1:35</a>)</p></blockquote><h3>동정 마리아는 하느님의 아들의 어머니이십니다</h3><p>예언자 세례자 요한의 어머니인 의로운 엘리사벳은 동정 마리아를 하느님의 어머니라고 직접 부릅니다:</p><blockquote><p>“<strong><mark>주님의 어머니</mark></strong>께서 나를 찾아 주시다니 어찌된 일입니까?” (<a href="https://bibleox.com/ko/ko-ctb/lk/1/#L43">루가 1:43</a>)</p></blockquote><blockquote><p>“그 집에 들어 가 <strong><mark>어머니 마리아</mark></strong>와 함께 있는 아기를 보고 엎드려 경배하였다. 그리고 보물 상자를 열어 황금과 유황과 몰약을 예물로 드렸다.” (<a href="https://bibleox.com/ko/ko-ctb/mf/2/#L11">마태 2:11</a>)</p></blockquote><blockquote><p>“<strong><mark>예수께서는 당신의 어머니</mark></strong>와 그 곁에 서 있는 사랑하시는 제자를 보시고 먼저 <strong><mark>어머니에게</mark></strong> ‘어머니, 이 사람이 어머니의 아들입니다’ 하시고” (<a href="https://bibleox.com/ko/ko-ctb/in/19/#L26">요한 19:26</a>)</p></blockquote><blockquote><p>“그러자 <strong><mark>예수의 어머니</mark></strong>는 하인들에게 ‘무엇이든지 그가 시키는 대로 하여라’하고 일렀다.” (<a href="https://bibleox.com/ko/ko-ctb/in/2/#L5">요한 2:5</a>)</p></blockquote><blockquote><p>“이런 일이 있은 지 사흘째 되던 날 갈릴래아 지방 가나에 혼인잔치가 있었다. 그 자리에는 <strong><mark>예수의 어머니</mark></strong>도 계셨고” (<a href="https://bibleox.com/ko/ko-ctb/in/2/#L1">요한 2:1</a>)</p></blockquote><p>(<a href="https://bibleox.com/ko/ko-ctb/mf/2/#L14">마태 2:14</a>; <a href="https://bibleox.com/ko/ko-ctb/mf/2/#L20">마태 2:20</a>; <a href="https://bibleox.com/ko/ko-ctb/mf/2/#L21">마태 2:21</a>; <a href="https://bibleox.com/ko/ko-ctb/mf/12/#L46">마태 12:46</a>; <a href="https://bibleox.com/ko/ko-ctb/mk/3/#L31">마르 3:31</a>; <a href="https://bibleox.com/ko/ko-ctb/lk/2/#L33">루가 2:33</a>; <a href="https://bibleox.com/ko/ko-ctb/lk/2/#L34">루가 2:34</a>; <a href="https://bibleox.com/ko/ko-ctb/lk/2/#L43">루가 2:43</a>; <a href="https://bibleox.com/ko/ko-ctb/lk/2/#L48">루가 2:48</a>; <a href="https://bibleox.com/ko/ko-ctb/lk/2/#L51">루가 2:51</a>; <a href="https://bibleox.com/ko/ko-ctb/lk/8/#L19">루가 8:19</a>; <a href="https://bibleox.com/ko/ko-ctb/in/2/#L3">요한 2:3</a>; <a href="https://bibleox.com/ko/ko-ctb/in/2/#L12">요한 2:12</a>; <a href="https://bibleox.com/ko/ko-ctb/in/19/#L25">요한 19:25</a>; <a href="https://bibleox.com/ko/ko-ctb/in/19/#L26">요한 19:26</a>; <a href="https://bibleox.com/ko/ko-ctb/act/1/#L14">사도 1:14</a>)</p><p>하느님의 아들께서 영원히 사람이 되셨다면(이것은 참입니다), 동정 마리아는 영원히 하느님의 아들의 어머니가 되셨습니다.</p><h3>하느님의 아들은 동정 마리아의 아들이십니다</h3><blockquote><p>“그러나 아들을 낳을 때까지 동침하지 않고 지내다가 <strong><mark>마리아가 아들을 낳자</mark></strong> 그 아기를 예수라고 불렀다.” (<a href="https://bibleox.com/ko/ko-ctb/mf/1/#L25">마태 1:25</a>)</p></blockquote><h3>동정 마리아는 하느님을 낳으신 분(테오토코스)이십니다</h3><p>동정 마리아는 예수 그리스도를 낳으셨습니다.</p><p>하느님의 아들 예수 그리스도는 <a href="https://bibleox.com/ru/ru/w/Христос-Бог">우리 하느님</a>이십니다.</p><p>동정 마리아에게서 나신 분은 <a href="https://bibleox.com/ru/ru/w/Христос-Бог">우리 하느님</a>이십니다. 그러므로 그분은 하느님을 낳으신 분, 곧 테오토코스(하느님의 어머니)이십니다.</p><p>동정 마리아는 시간과 공간 밖에 있는 영원한 신성을 낳으신 것이 아니라, <a href="https://bibleox.com/ru/ru/w/Сын-безначальный-начинается">시작이 있는</a> 하느님의 아들의 인성을 낳으셨습니다. 그 인성은 존재의 처음부터 온전히 하느님의 아들(하느님)의 위격에 속했습니다.</p><p>곧 동정 마리아는 하느님을 그분의 인성으로 낳으셨습니다.</p><p>그러나 하느님의 어머니의 위대함은 바로 하느님의 어머니로 택함받으셨다는 데 있습니다. 공로는 낳았다는 데 있지 않습니다. 많은 이가 낳습니다. 공로는 하느님께서 마리아의 자질을 미리 아시고(<a href="https://bibleox.com/ko/ko-ctb/rim/8/#L29">로마 8:29</a>) 존재했던 모든 사람 가운데 다른 누구도 아닌 바로 동정 마리아를 택하셨다는 데 있습니다.</p><h2>하느님의 어머니는 동정이셨고 동정으로 머무십니다</h2><h3>예수 그리스도의 탄생 전 마리아의 동정</h3><p>동정 마리아는 의로운 요셉과 부부 관계가 없었습니다. 요셉과 약혼했지만(<a href="https://bibleox.com/ko/ko-ctb/lk/1/#L27">루가 1:27</a>), 부부 관계가 없는데 어떻게 아들이 태어날 수 있는지 이해하지 못하셨습니다:</p><blockquote><p>“이 말을 듣고 마리아가 ‘<strong><mark>이 몸은 처녀입니다</mark></strong>. 어떻게 그런 일이 있을 수 있겠습니까?’하자” (<a href="https://bibleox.com/ko/ko-ctb/lk/1/#L34">루가 1:34</a>) <em>(그리스어: “저는 남자를 알지 못합니다”)</em></p></blockquote><p>이 질문은 동정 마리아가 동정을 지키겠다고 하느님께 약속했을 때에만 뜻이 있다는 점도 주목할 만합니다. 그렇지 않다면, 그때까지 의로운 요셉과 부부 관계가 없었더라도 하느님의 천사가 아들이 태어나리라고 알릴 때 분명히 하느님께 순종하여 남편과 부부 관계를 맺어 예언이 이루어지게 하면 됩니다. 그러나 동정 마리아가 하느님께 동정의 삶을 약속했다면 곧바로 질문이 생깁니다. “하느님께 드린 서원은 깰 수 없는데(<a href="https://bibleox.com/ko/ko-ctb/chis/30/#L2">민 30:2</a>) 어떻게 아들이 태어날 수 있습니까?”</p><p>천사는 마리아에게 예고된 일이 남자 없이 하느님의 힘의 기적적인 활동으로 이루어지리라고 대답했습니다:</p><blockquote><p>“천사는 이렇게 대답하였다. ‘<strong>성령이 너에게 내려 오시고 지극히 높으신 분의 힘이 감싸 주실 것이다</strong>. 그러므로 태어나실 그 거룩한 아기를 하느님의 아들이라 부르게 될 것이다.” (<a href="https://bibleox.com/ko/ko-ctb/lk/1/#L35">루가 1:35</a>)</p></blockquote><p>예수 그리스도께서 요셉의 아들이었던 것은 사람들의 생각일 뿐입니다:</p><blockquote><p>“예수께서는 서른 살 가량 되어 전도하기 시작하셨는데 <strong><mark>사람들이 알기에는 그는 요셉의 아들이요</mark></strong>, 요셉은 엘리의 아들이며” (<a href="https://bibleox.com/ko/ko-ctb/lk/3/#L23">루가 3:23</a>)</p></blockquote><p>실제로 그리스도께서는 요셉이 아니라 성령의 힘으로 잉태되셨습니다.</p><h3>예수 그리스도의 탄생 뒤 마리아의 동정</h3><p>마리아의 평생 동정(오늘까지의 동정)에 관한 예언, 곧 그분에게서 한 분만 나시리라는 예언입니다. 그분은 하느님 예수 그리스도이시며, 동정 마리아, 곧 하느님의 어머니를 통해 문으로 들어오듯 우리 세상에 들어오셨습니다:</p><blockquote><p>“그에게 이끌려 성소 밖으로 나가는 동문 쪽으로 다시 가 보니, 그 문은 잠겨 있었다. 야훼께서 나에게 이르셨다. ‘<strong><mark>이 문은 잠가 두어야 한다. 이 문은 열 수 없다. 이 문으로 이스라엘의 하느님 나 야훼가 들어 왔기 때문에, 아무도 이 문으로 들어 오지 못한다. 그러므로 잠가 두어야 한다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/iez/44/#L1-2">에제 44:1-2</a>)</p></blockquote><p>그러므로 동정 마리아는 예수 그리스도 외에 다른 자녀를 낳지 않으셨습니다. 또 마리아의 동정은 깨지지 않았습니다.</p><p>십자가에 못박히신 날 그리스도께서 사랑하시는 제자 신학자 요한에게 어머니를 돌보라고 맡기신 것도 주목할 만합니다(<a href="https://bibleox.com/ko/ko-ctb/in/19/#L26-27">요한 19:26-27</a>). 이는 동정 마리아에게 외아들 그리스도 외에 돌보아 줄 남편도 다른 자녀도 없었음을 가리킵니다.</p><p>의로운 요셉은 그리스도께서 나실 때 이미 나이가 많았으므로 그리스도께서 십자가에 못박히실 때는 오래전에 죽었습니다. 실제로 예수 그리스도의 어린 시절 이야기 뒤에 성경은 요셉을 더 언급하지 않습니다.</p><p>동정 마리아가 요한에게 맡겨진 것은 그가 다른 사도들보다 지상에서 더 오래 살 것이기 때문입니다. 주님께서 친히 사도 베드로는 그리스도를 위해 고난을 받겠지만 사도 요한은 훨씬 더 오래 살 것이라고 가리키십니다(<a href="https://bibleox.com/ko/ko-ctb/in/21/#L22">요한 21:22</a>). 알다시피 요한은 사도 가운데 가장 젊었고 1세기 말까지 지상에서 일했으며, 다른 사도들은 순교했습니다. 그래서 사도 요한은 누구보다 오래 동정 마리아를 돌볼 수 있었습니다.</p><p>이 사실도 동정 마리아를 돌볼 다른 자녀가 없었음을 가리킵니다.</p><h2>모든 세대가 하느님의 어머니를 복되다 할 것입니다</h2><p>하느님의 어머니는 복되다 불릴 것입니다. 하느님께서 그분께 큰 일을 해 주셨습니다:</p><blockquote><p>“주께서 여종의 <strong>비천한 신세</strong>를 돌보셨습니다. 이제부터는 <strong><mark>온 백성이 나를 복되다 하리니</mark></strong> <strong><mark>전능하신 분께서 나에게 큰 일을 해 주신</mark></strong> 덕분입니다. 주님은 거룩하신 분” (<a href="https://bibleox.com/ko/ko-ctb/lk/1/#L48-49">루가 1:48-49</a>) <em>(“복되다 하리니”: μακαριοῦσίν; “온 백성”은 그리스어로 “모든 세대”입니다.)</em></p></blockquote><p>그리스도 자신에 관해서도 비슷한 말씀이 있습니다:</p><blockquote><p>“해가 그 빛을 잃기까지 왕의 이름 영원토록 기림받게 하소서. 뭇 민족이 그의 은덕을 입고 <strong>뭇 백성 그를 일컬어 복되다 하리이다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/ps/72/#L17">시편 72:17</a>) <em>(칠십인역: μακαριοῦσιν)</em></p></blockquote><h2>그리스도와 어머니의 특별한 관계</h2><h3>하느님의 아들은 동정 마리아를 어머니로 공경하십니다</h3><p>하느님의 아들은 율법 아래 나셨습니다:</p><blockquote><p>“그러나 때가 찼을 때 하느님께서 당신의 아들을 보내시어 여자의 몸에서 나게 하시고 <strong><mark>율법의 지배를 받게 하시어</mark></strong>” (<a href="https://bibleox.com/ko/ko-ctb/gal/4/#L4">갈라 4:4</a>)</p></blockquote><p>하느님께서는 아버지와 어머니를 공경하라고 명하십니다:</p><blockquote><p>“<strong><mark>너희는 부모를 공경하여라</mark></strong>. 그래야 너희는 너희 하느님 야훼께서 주신 땅에서 오래 살 것이다.” (<a href="https://bibleox.com/ko/ko-ctb/ish/20/#L12">출 20:12</a>; <a href="https://bibleox.com/ko/ko-ctb/vtor/5/#L16">신 5:16</a>; <a href="https://bibleox.com/ko/ko-ctb/ish/21/#L17">출 21:17</a>; <a href="https://bibleox.com/ko/ko-ctb/lev/20/#L9">레 20:9</a>; <a href="https://bibleox.com/ko/ko-ctb/ish/21/#L15">출 21:15</a>)</p></blockquote><blockquote><p>“간음하지 말라. 살인하지 말라. 도둑질하지 말라. 거짓 증언하지 말라. <strong><mark>네 부모를 공경하라</mark></strong>고 한 계명들을 알고 있지 않느냐?‘” (<a href="https://bibleox.com/ko/ko-ctb/lk/18/#L20">루가 18:20</a>)</p></blockquote><blockquote><p>“그리고 이어서 이렇게 말씀하셨다. ‘너희는 그 전통을 지킨다는 구실로 교묘하게 <strong>하느님의 계명</strong>을 어기고 있다. &lt;…&gt; 너희는 누구든지 아버지나 어머니에게 제가 해 드려야 할 것을 하느님께 바쳤습니다 라는 뜻으로 코르반이라고 한 마디만 하면 된다고 하면서 <strong><mark>자기 아버지나 어머니에게 아무것도 해 드리지 못하게</mark></strong> 하고 있으니” (<a href="https://bibleox.com/ko/ko-ctb/mk/7/#L9,11-12">마르 7:9,11-12</a>)</p></blockquote><p>동정 마리아 외에 우주의 어떤 존재도 하느님의 아들의 어머니가 아닙니다. 이 점에서 천사와 사람 가운데 아무도 동정 마리아보다 높지 않습니다. 하느님의 아들, 하느님 자신이 그분을 어머니로 공경하시기 때문입니다.</p><h3>그리스도께서는 어머니의 말을 들으십니다</h3><p>그리스도께서는 설교와 기적(당신 영광의 드러남)의 때가 아직 오지 않았다고 가리키시지만, 어머니의 청을 위해 첫 기적을 행하십니다:</p><blockquote><p>“그런데 잔치 도중에 포도주가 다 떨어지자 <strong>예수의 어머니는 예수께 포도주가 떨어졌다고 알렸다</strong>. 예수께서는 어머니를 보시고 ‘<strong><mark>어머니, 그것이 저에게 무슨 상관이 있다고 그러십니까? 아직 제 때가 오지 않았습니다</mark></strong>’하고 말씀하셨다. 그러자 예수의 어머니는 하인들에게 ‘무엇이든지 그가 시키는 대로 하여라’하고 일렀다. &lt;…&gt; 예수께서 하인들에게 ‘<strong>그 항아리마다 모두 물을 가득히 부어라</strong>’하고 이르셨다. 그들이 여섯 항아리에 물을 가득 채우자 예수께서 ‘<strong>이제는 퍼서 잔치 맡은 이에게 갖다 주어라</strong>’ 하셨다. 하인들이 잔치 맡은 이에게 갖다 주었더니 &lt;…&gt; 이렇게 예수께서는 <strong><mark>첫번째 기적을</mark></strong> 갈릴래아 지방 가나에서 행하시어 <strong><mark>당신의 영광을 드러내셨다</mark></strong>. 그리하여 제자들은 예수를 믿게 되었다.” (<a href="https://bibleox.com/ko/ko-ctb/in/2/#L3-5,7-8,11">요한 2:3-5,7-8,11</a>)</p></blockquote><h3>그리스도께서는 어머니를 돌보십니다</h3><p>십자가의 잔혹한 고통 속에서 그리스도께서는 어머니를 돌보십니다:</p><blockquote><p>“예수께서는 당신의 어머니와 그 곁에 서 있는 사랑하시는 제자를 보시고 먼저 <strong><mark>어머니에게 ‘어머니, 이 사람이 어머니의 아들입니다’ 하시고 그 제자에게는 ‘이분이 네 어머니시다’하고 말씀하셨다. 이 때부터 그 제자는 마리아를 자기 집에 모셨다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/in/19/#L26-27">요한 19:26-27</a>)</p></blockquote><h3>그리스도와 어머니의 개인적 관계의 성격</h3><p>가장 끔찍한 시간에 십자가에서 무서운 육체의 고통, 배신, 제자들의 도망, 버림받은 인간적 느낌(아홉째 시간: “엘로이, 엘로이, 레마 사박타니?” 곧 “나의 하느님, 나의 하느님, <strong>어찌하여 나를 버리셨나이까?</strong>” <a href="https://bibleox.com/ko/ko-ctb/mk/15/#L34">마르 15:34</a>)을 견디시면서 주님께서는 끝까지 당신을 따른 어머니를 돌보십니다.</p><p>이 가장 어려운 때에 그분은 어머니에게 관심을 돌리시고 특별히 돌보시며, 사랑하시는 제자에게 맡기십니다. 그것도 단지 “돌보아 드려라”가 아니라 “네 어머니”로 모시라고 하십니다.</p><blockquote><p>“예수께서는 당신의 어머니와 그 곁에 서 있는 사랑하시는 제자를 보시고 먼저 어머니에게 ‘어머니, 이 사람이 어머니의 아들입니다’ 하시고 그 제자에게는 ‘<strong>이분이 네 어머니시다</strong>’하고 말씀하셨다. 이 때부터 그 제자는 마리아를 자기 집에 모셨다.” (<a href="https://bibleox.com/ko/ko-ctb/in/19/#L26-27">요한 19:26-27</a>)</p></blockquote><p>그리스도께서 “바로 이 사람들이 내 어머니이며 내 형제들이다”(<a href="https://bibleox.com/ko/ko-ctb/mf/12/#L48-50">마태 12:48-50</a>)라고 가리키신 사람들은 모두 그분을 혼자 버려 두었지만(<a href="https://bibleox.com/ko/ko-ctb/in/16/#L32">요한 16:32</a>), 어머니는 끝까지 그분과 함께 계셨습니다.</p><blockquote><p>“그러나 이제 너희가 <strong>나를 혼자 버려 두고</strong> 제각기 자기 갈 곳으로 흩어져 갈 때가 올 것이다. 아니 그 때는 이미 왔다. 하지만 아버지께서 나와 함께 계시니 나는 혼자 있는 것이 아니다.” (<a href="https://bibleox.com/ko/ko-ctb/in/16/#L32">요한 16:32</a>)</p></blockquote><blockquote><p>“나를 보내신 분은 나와 함께 계시고 <strong>나를 혼자 버려 두시지는 않는다</strong>. <strong>나는 언제나 아버지께서 기뻐하시는 일을 하기 때문이다</strong>.‘하고 말씀하셨다.” (<a href="https://bibleox.com/ko/ko-ctb/in/8/#L29">요한 8:29</a>)</p></blockquote><p>그리스도께서도 같은 이유로 어머니를 혼자 두지 않으셨습니다.</p><h3>하느님의 어머니가 끝까지 그리스도와 함께 계신 것이 중요합니까?</h3><p>사도 바울로도 죽기 전에 비슷한 버림받음을 겪었습니다:</p><blockquote><p>“그대도 알다시피 피겔로와 헤르모게네를 비롯해서 <strong>아시아 사람들이 다 나에게서 떠나가 버렸습니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/2tim/1/#L15">2디모 1:15</a>)</p></blockquote><blockquote><p>“데마는 이 <strong>현세를 사랑한 나머지 나를 버리고</strong> 데살로니카로 가 버렸습니다. 그레스겐스는 갈라디아로 갔고 디도는 달마디아로 갔으며 <strong>루가만이 나와 함께 있습니다</strong>. 마르코는 내가 하는 일에 꼭 필요한 사람이니 그를 데리고 오시오.” (<a href="https://bibleox.com/ko/ko-ctb/2tim/4/#L10-11">2디모 4:10-11</a>)</p></blockquote><p>하느님의 어머니는 처음부터 끝까지 모든 일에서 하느님께 주의 깊고 순종하며 충실하셨습니다. 그분은 언제나 하느님과 함께 계셨고 지금도 그러하십니다.</p><h2>비판</h2><h3>“테오토코스”라는 말은 성경에 없습니다</h3><p>“삼위일체”라는 말도 성경에 없습니다. 그래서 어떻다는 말입니까? 성경은 “테오토코스”라는 말과 같은 것을 말합니다. 동정 마리아는 예수 그리스도의 어머니이십니다. 예수 그리스도는 하느님이십니다. 동정 마리아는 예수 그리스도를 낳으셨으니, 곧 하느님을, 분명히 그분의 인성으로 낳으셨습니다. 그분에게서 나신 분은 하느님이십니다. 동정 마리아는 하느님을 낳으신 분, 줄여서 테오토코스이십니다.</p><h3>“당신을 낳아서 젖을 먹인 여인은 행복합니다”</h3><p>사람들은 하느님의 어머니를 혈연 때문에, 곧 그리스도를 낳고 젖을 먹였기 때문에 칭송했습니다. 그러나 그리스도께서는 이 이해를 바로잡으시며(강조점을 두시며), 어머니의 위대함이 하느님의 말씀을 특별히 주의 깊게 듣고 온전히 겸손하게 순종한 데 있음을 가리키셨습니다:</p><blockquote><p>“예수께서 이 말씀을 하고 계실 때 군중 속에서 한 여자가 큰 소리로 ‘<strong>당신을 낳아서 젖을 먹인 여인은 얼마나 행복합니까</strong>!’ 하고 외치자 예수께서는 ‘<strong><mark>하느님의 말씀을 듣고</mark></strong> <strong><mark>그 말씀을 지키는 사람들이 오히려 행복하다</mark></strong>’하고 대답하셨다.” (<a href="https://bibleox.com/ko/ko-ctb/lk/11/#L27-28">루가 11:27-28</a>)</p></blockquote><blockquote><p>“<strong><mark>마리아는 이 모든 일을 마음 속 깊이 새겨 오래 간직하였다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/lk/2/#L19">루가 2:19</a>)</p></blockquote><blockquote><p>“예수는 부모를 따라 나자렛으로 돌아 와 부모에게 순종하며 살았다. <strong><mark>그 어머니는 이 모든 일을 마음 속에 간직하였다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/lk/2/#L51">루가 2:51</a>)</p></blockquote><h3>“누가 내 어머니이며 내 형제들이냐?”</h3><p>여기서도 그리스도께서는 강조점을 두십니다. 동정 마리아의 위대함은 사람들 생각처럼 혈연에 있다기보다 하느님의 뜻을 조건 없이 실천한 데 있습니다:</p><blockquote><p>“그래서 어떤 사람이 예수께 ‘선생님, 선생님의 어머님과 형제분들이 선생님과 이야기를 하시겠다고 밖에 서서 찾고 계십니다.’ 하고 알려 드렸다. 예수께서는 말을 전해 준 사람에게 ‘<strong>누가 내 어머니이며 내 형제들이냐</strong>?’ 하고 물으셨다. 그리고 제자들을 가리키시며 ‘바로 이 사람들이 내 어머니이며 내 형제들이다. <strong><mark>하늘에 계신 내 아버지의 뜻을 실천하는 사람이면 누구나 다 내 형제요 자매요 어머니이다</mark></strong>’ 하고 말씀하셨다.” (<a href="https://bibleox.com/ko/ko-ctb/mf/12/#L47-50">마태 12:47-50</a>)</p></blockquote><h3>“아들을 낳을 때까지 동침하지 않고”(마태 1:25)</h3><blockquote><p>“그러나 <strong><mark>아들을 낳을 때까지 동침하지 않고</mark></strong> 지내다가 마리아가 아들을 낳자 그 아기를 예수라고 불렀다.” (<a href="https://bibleox.com/ko/ko-ctb/mf/1/#L25">마태 1:25</a>)</p></blockquote><p>“아들을 낳을 때까지 동침하지 않고”라는 표현은 아들을 낳은 뒤에 동침했다는 뜻이 아닙니다. 이것은 성경에 흔한 표현이며, 그 뒤에 무언가 달라졌다는 뜻이 아닙니다.</p><p>예를 들면:</p><blockquote><p>“내가 너희에게 명한 모든 것을 지키도록 가르쳐라. <strong><mark>내가 세상 끝날까지 항상 너희와 함께 있겠다</mark></strong>.‘” (<a href="https://bibleox.com/ko/ko-ctb/mf/28/#L20">마태 28:20</a>)</p></blockquote><p>그러나 세상 끝 뒤에도 그리스도께서는 분명히 당신을 믿는 이들과 함께 계실 것입니다.</p><blockquote><p>“예수께서는 이렇게 대답하셨다. ‘<strong>빛이 너희와 같이 있는 것도 잠시뿐이니</strong> 빛이 있는 동안에 걸어 가라. 그리하면 어둠이 너희를 덮치지 못할 것이다. 어둠속을 걸어 가는 사람은 자기가 어디로 가는지 모른다. 그러니 <strong><mark>빛이 있는 동안에 빛을 믿고</mark></strong> 빛의 자녀가 되어라.’ 이 말씀을 마치시고 예수께서는 그들의 눈을 피하여 몸을 숨기셨다.” (<a href="https://bibleox.com/ko/ko-ctb/in/12/#L35-36">요한 12:35-36</a>)</p></blockquote><p>그러나 그리스도께서 승천하신 뒤에도 빛(그리스도)을 믿어야 합니다.</p><blockquote><p>“그리스도께서는 하느님께서 <strong><mark>모든 원수를 그리스도의 발 아래 굴복시키실 때까지 군림하셔야 합니다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/15/#L25">1고린 15:25</a>)</p></blockquote><p>그러나 원수들을 굴복시키신 뒤에도 그리스도께서는 분명히 다스리실 것입니다(<a href="https://bibleox.com/ko/ko-ctb/lk/1/#L33">루가 1:33</a>; <a href="https://bibleox.com/ko/ko-ctb/2pet/1/#L11">2베드 1:11</a>).</p><blockquote><p>“야훼께서 내 주께 선언하셨다. ‘<strong><mark>내 오른편에 앉아 있어라. 내가 네 원수들을 네 발판으로 삼을 때</mark></strong>” (<a href="https://bibleox.com/ko/ko-ctb/ps/110/#L1">시편 110:1</a>)</p></blockquote><p>그러나 원수들이 그분의 발 아래 놓인 뒤에도 그리스도께서는 분명히 아버지 오른편에 앉아 계실 것입니다. 곧 다스리실 것입니다.</p><blockquote><p>“그러나 티아디라에 있는 사람들 중에서 그 여자의 가르침을 받아 들이지 않은 사람들, 곧 사탄의 비밀을 배우지 않은 나머지 사람들에게 나는 이렇게 말한다. 나는 너희에게 다른 짐을 지우지 않겠으니 다만 <strong><mark>내가 올 때까지 너희가 가지고 있는 것을 단단히 간직하고 있어라</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/otkr/2/#L24-25">묵시 2:24-25</a>)</p></blockquote><p>그러나 그리스도께서 오신 뒤에도 분명히 덕과 믿음을 지녀야 합니다.</p><blockquote><p>“그 뒤 사울의 딸 미갈은 <strong><mark>죽는 날까지 자식을 낳지 못했다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/2ts/6/#L23">삼하 6:23</a>)</p></blockquote><p>그러나 죽은 뒤에도 분명히 미갈에게는 자식이 없었습니다.</p><p>다음 대목에도 주목할 만합니다:</p><blockquote><p>“보라, 내가 택한 나의 종 내 사랑하는 사람, 내 마음에 드는 사람, 그에게 내 성령을 부어 주리니 그는 이방인들에게 정의를 선포하리라. 그는 다투지도 않고 큰 소리도 내지 않으리니 거리에서 그의 소리를 들을 자 없으리라. 그는 <strong><mark>상한 갈대도 꺾지 않고 꺼져 가는 심지도 끄지 않으리라. 드디어 그는 정의를 승리로 이끌어 가리니</mark></strong>” (<a href="https://bibleox.com/ko/ko-ctb/mf/12/#L18-20">마태 12:18-20</a>)</p></blockquote><h3>맏아들을 낳았다면 다른 자녀들도 있었습니까?</h3><p>성경에서 하느님의 어머니의 아들은 맏아들이라 불립니다:</p><blockquote><p>“그러나 아들을 낳을 때까지 동침하지 않고 지내다가 <strong><mark>마리아가 아들을 낳자</mark></strong> 그 아기를 예수라고 불렀다.” (<a href="https://bibleox.com/ko/ko-ctb/mf/1/#L25">마태 1:25</a>) <em>(비잔틴 본문(다수 사본)에는 “<strong>맏아들</strong>”(τὸν πρωτότοκον)이 있습니다. 시나이 사본과 바티칸 사본에는 없지만, 이 말은 루가 2:7에 있습니다.)</em></p></blockquote><blockquote><p>“드디어 <strong><mark>첫 아들을 낳았다</mark></strong>. 여관에는 그들이 머무를 방이 없었기 때문에 아기는 포대기에 싸서 말구유에 눕혔다.” (<a href="https://bibleox.com/ko/ko-ctb/lk/2/#L7">루가 2:7</a>)</p></blockquote><p>정교회 가르침의 반대자들은 이를 동정 마리아에게 다른 자녀들도 있었다는 표지로 여기며 “맏아들이 있으면 다른 자녀들도 있다”고 말합니다. 이 생각이 잘못임을 성경 자체가 보여 줍니다.</p><p>하느님께서 친히 성경에서 <strong>“맏아들”을 모든 육신 가운데 모태를 여는 것</strong>으로 정의하십니다:</p><blockquote><p>“<strong><mark>처음으로 모태를 열고 나온 것</mark></strong>으로서 나에게 바친 것이면 사람이건 짐승이건 다 너에게로 돌아 간다. 그러나 <strong><mark>처음 난 사람은</mark></strong> 속전을 받고 돌려 주어야 한다. <strong><mark>처음 난 짐승이라도</mark></strong> 정하지 못하면 속전을 받고 돌려 주어야 한다.” (<a href="https://bibleox.com/ko/ko-ctb/chis/18/#L15">민 18:15</a>)</p></blockquote><blockquote><p>“<strong><mark>모태에서 처음으로 태어나는 것은 다 나의 것이다</mark></strong>. 큰 가축이건 작은 가축이건 첫 새끼 수컷은 다 나의 것이다. 처음 난 나귀 새끼는 양을 대신 바치고 물러내어라. 물러내기 싫으면 목을 부러뜨려 죽여라. <strong><mark>너희 맏아들은</mark></strong> 제물을 대신 바치고 물러내야 한다. 아무도 빈손으로는 내 앞에 나타나지 못한다.” (<a href="https://bibleox.com/ko/ko-ctb/ish/34/#L19-20">출 34:19-20</a>)</p></blockquote><p>모든 맏이는 하느님께 속합니다. 그러므로:</p><ol><li><p>사람의 맏아들은 성전에 데려가 사제들에게서 값을 치르고 물러내야 했습니다.</p></li><li><p>정결한 짐승의 맏이는 성전에 데려가 내주었고, 죽여서 하느님께 제물로 바쳤습니다.</p></li><li><p>부정한 짐승의 맏이는 제물로 바칠 수 없으므로 값을 치르고 물러내야 했습니다.</p></li></ol><p>사람이나 짐승이 첫 새끼를 낳자마자 하느님께 예물로 바치거나 물러내야 했습니다. 그 순간 이 갓난아기는 외아들인 것이 너무나 분명한데도 하느님께서는 맏이라고 부르십니다. 모태를 열었기 때문입니다. 곧 <strong>모든 외아들은 맏아들이지만</strong>, 모든 맏아들이 외아들은 아닙니다[2].</p><p>교회의 가르침을 반대하는 이들처럼 형제자매가 있는 사람만 맏아들이라 불린다고 생각하면, 첫아이를 낳은 이들은 사제에게 이렇게 말해야 합니다. “둘째가 태어날 때까지 기다려 주십시오. 그래야 이 아이가 맏아들이라 불립니다. 지금은 맏아들이 아니라 외아들이니 하느님께 데려와 물러낼 필요가 없습니다.” 그러나 이 불합리한 생각도 성경과 상식에 어긋납니다. 외아들이신 구세주께서는 바로 이 맏아들에 관한 율법에 따라 성전에 오시기 때문입니다:</p><blockquote><p>“그리고 <strong>모세가 정한 법대로</strong> 정결 예식을 치르는 날이 되자 부모는 <strong>아기를 데리고 예루살렘으로 올라갔다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/lk/2/#L22">루가 2:22</a>)</p></blockquote><p>여기서 주 예수 그리스도께서는 분명히 <strong>외아들</strong>이신데 <strong>맏아들</strong>로서 성전에 오십니다. 그러므로 이 경우 맏아들은 하느님의 말씀에 따라 모든 육신 가운데 모태를 여는 이를 뜻하며, 어머니에게 다른 자녀가 태어났는지는 가리키지 않습니다.</p><h3>예수 그리스도의 형제들</h3><p>성경은 그리스도께 형제들이 있었다고 말합니다:</p><blockquote><p>“저 사람은 그 목수의 아들이 아닌가? 어머니는 마리아요, <strong>그 형제들은</strong> 야고보, 요셉, 시몬, 유다가 아닌가?” (<a href="https://bibleox.com/ko/ko-ctb/mf/13/#L55">마태 13:55</a>)</p></blockquote><blockquote><p>“이렇듯 <strong>예수의 형제들</strong>조차도 그분을 믿지 않았던 것이다.” (<a href="https://bibleox.com/ko/ko-ctb/in/7/#L5">요한 7:5</a>)</p></blockquote><blockquote><p>“그 때 예수의 어머니와 <strong>형제들이</strong> 밖에 와 서서 예수를 불러 달라고 사람을 들여 보냈다.” (<a href="https://bibleox.com/ko/ko-ctb/mk/3/#L31">마르 3:31</a>)</p></blockquote><blockquote><p>“우리라고 해서 다른 사도들에게나 <strong>주님의 형제들</strong>이나 베드로처럼 그리스도를 믿는 아내를 데리고 다닐 권리가 없단 말입니까?” (<a href="https://bibleox.com/ko/ko-ctb/1kor/9/#L5">1고린 9:5</a>)</p></blockquote><p>이들은 요셉의 첫 혼인에서 난 형제들이거나 그냥 친척입니다. 친척은 모두 그냥 형제라고 불립니다. 예를 들어 롯은 아브라함의 조카였지만 성경에서 형제라고도 불립니다:</p><blockquote><p>“소돔에 살고 있는 <strong><mark>아브람의 조카 롯</mark></strong>도 끌고 가면서 그의 재물도 빼앗았다.” (<a href="https://bibleox.com/ko/ko-ctb/gen/14/#L12">창 14:12</a>)</p></blockquote><blockquote><p>“아브람이 롯에게 말하였다. ‘<strong><mark>너와 나는 한 골육이 아니냐</mark></strong>? 네 목자들과 내 목자들이 서로 다투어서야 되겠느냐?” (<a href="https://bibleox.com/ko/ko-ctb/gen/13/#L8">창 13:8</a>) <em>(히브리어와 칠십인역: “우리는 형제다”)</em></p></blockquote><p>마리아는 남편 없이 지낼 수 없었기에 요셉은 이미 나이 든 후견인으로 약혼했습니다. 마리아가 알려진 남편 없이 그리스도를 낳았다면 율법에 따라 돌에 맞아야 했을 것입니다(<a href="https://bibleox.com/ko/ko-ctb/vtor/22/#L20-21">신 22:20-21</a>). 모두가 음행(혼외 관계)을 했다고 생각했을 것이기 때문입니다. 그래서 주님께서는 마리아에게 남편이 있게 하시되, 성령께서 내려오시어 남자 없이 기적적으로 잉태하게 하십니다(<a href="https://bibleox.com/ko/ko-ctb/mf/1/#L18-25">마태 1:18-25</a>; <a href="https://bibleox.com/ko/ko-ctb/lk/1/#L34-35">루가 1:34-35</a>).</p><p>예수의 어린 시절 뒤에 약혼자 요셉은 성경에 더 나오지 않지만, 동정 마리아는 끝까지, 십자가 고난까지 예수 그리스도와 함께하셨고(<a href="https://bibleox.com/ko/ko-ctb/in/19/#L25-26">요한 19:25-26</a>), 부활 뒤 오순절 전에도 언급됩니다(<a href="https://bibleox.com/ko/ko-ctb/act/1/#L14">사도 1:14</a>).</p><p>그리스도께서는 어머니를 사랑하시는 제자 요한에게 맡기십니다(<a href="https://bibleox.com/ko/ko-ctb/in/19/#L27">요한 19:27</a>). 그때 요셉은 분명히 이미 죽었습니다.</p><p>그러므로 예수 그리스도의 형제들은 그냥 친척이며 결코 동정 마리아의 다른 자녀가 아닙니다.</p><p>예언은 동정 마리아에게서 주 예수 그리스도만 나시리라고 분명히 말합니다:</p><blockquote><p>“그에게 이끌려 성소 밖으로 나가는 동문 쪽으로 다시 가 보니, 그 문은 잠겨 있었다. 야훼께서 나에게 이르셨다. ‘<strong><mark>이 문은 잠가 두어야 한다. 이 문은 열 수 없다. 이 문으로 이스라엘의 하느님 나 야훼가 들어 왔기 때문에, 아무도 이 문으로 들어 오지 못한다. 그러므로 잠가 두어야 한다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/iez/44/#L1-2">에제 44:1-2</a>)</p></blockquote><h3>맏아들</h3><p>그리스도를 동정 마리아의 맏아들이라 부르는 구절이 있습니다:</p><blockquote><p>“그러나 아들을 낳을 때까지 동침하지 않고 지내다가 <strong>마리아가 아들을 낳자</strong> 그 아기를 예수라고 불렀다.” (<a href="https://bibleox.com/ko/ko-ctb/mf/1/#L25">마태 1:25</a>) <em>(비잔틴 본문(다수 사본)에는 “맏아들”이 있습니다.)</em></p></blockquote><blockquote><p>“드디어 <strong>첫 아들을</strong> 낳았다. 여관에는 그들이 머무를 방이 없었기 때문에 아기는 포대기에 싸서 말구유에 눕혔다.” (<a href="https://bibleox.com/ko/ko-ctb/lk/2/#L7">루가 2:7</a>)</p></blockquote><p>어떤 이들은 여기서 맏아들 외에 둘째와 셋째 자녀도 태어났다는 표지를 보려 합니다.</p><p>그러나 “맏아들”이라는 말은 그 아이가 처음 태어났다는 뜻일 뿐입니다. 자녀의 수를 가리키지 않습니다. 성경에서 이 말은 바로 그렇게 쓰입니다. 나중에 자녀가 있었든 없었든 “모태를 여는” 이는 모두 맏이라 불립니다:</p><blockquote><p>“<strong><mark>처음으로 모태를 열고 나온 것</mark></strong>으로서 나에게 바친 것이면 사람이건 짐승이건 다 너에게로 돌아 간다. 그러나 <strong><mark>처음 난 사람은</mark></strong> 속전을 받고 돌려 주어야 한다. 처음 난 짐승이라도 정하지 못하면 속전을 받고 돌려 주어야 한다.” (<a href="https://bibleox.com/ko/ko-ctb/chis/18/#L15">민 18:15</a>)</p></blockquote><blockquote><p>“<strong><mark>모태에서 처음으로 태어나는 것은</mark></strong> 다 나의 것이다. 큰 가축이건 작은 가축이건 첫 새끼 수컷은 다 나의 것이다. 처음 난 나귀 새끼는 양을 대신 바치고 물러내어라. 물러내기 싫으면 목을 부러뜨려 죽여라. <strong><mark>너희 맏아들은</mark></strong> 제물을 대신 바치고 물러내야 한다. 아무도 빈손으로는 내 앞에 나타나지 못한다.” (<a href="https://bibleox.com/ko/ko-ctb/ish/34/#L19-20">출 34:19-20</a>)</p></blockquote><p>어머니의 모든 외아들(하나뿐인 자녀)은 그 어머니의 맏아들이지만, 모든 맏아들이 외아들은 아닙니다.</p><p>그러므로 이 말은 동정 마리아에게 그리스도 외에 다른 자녀가 있었다는 증거가 아닙니다. 동정 마리아가 의로운 요셉과 부부 관계를 맺었다는 증거도 아닙니다. 주 예수 그리스도는 동정 마리아의 외아들이십니다. 더 보기[2].</p><h3>동정 마리아가 그리스도를 믿지 않았다는 말은 어디에도 없습니다</h3><p>교회 비판자들은 동정 마리아가 자기 아들이 사람들의 구세주, 약속된 메시아, 그리스도임을 믿지 않았다는 생각을 자주 되풀이합니다. 그러나 이것은 그저 사실이 아닙니다. 성경에 그런 말은 없습니다. 형제들(이복형제, 요셉의 첫 혼인에서 난 아들들)이 그리스도를 믿지 않았다고만 합니다:</p><blockquote><p>“이렇듯 <strong>예수의 형제들조차도 그분을 믿지 않았던 것이다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/in/7/#L5">요한 7:5</a>)</p></blockquote><p>이것은 충분히 예상할 수 있는 일입니다. 그들은 요셉의 첫 혼인에서 난 자녀들로 이미 어른이었고 소년 예수가 자라는 것을 보았습니다. 그래서 그리스도의 다른 동향인들(갈릴래아 주민들)처럼 믿기 어려웠습니다(<a href="https://bibleox.com/ko/ko-ctb/mf/13/#L54-58">마태 13:54-58</a>). 그러나 나중에 형제들도 믿었습니다(<a href="https://bibleox.com/ko/ko-ctb/act/1/#L14">사도 1:14</a>; <a href="https://bibleox.com/ko/ko-ctb/gal/1/#L19">갈라 1:19</a>).</p><h3>왕의 어머니는 왕후입니다</h3><p>비판자들은 교회가 하느님의 어머니를 왕후라고 부른다고 나무랍니다. 그러나 왕의 어머니는 바로 왕후입니다.</p><blockquote><p>“당신의 사랑을 받는 여인들 중에는 외국의 공주들이 끼여 있고, 오빌의 황금으로 단장한 <strong><mark>왕후는 당신 오른편에 서 있습니다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/ps/45/#L9">시편 45:9</a>)</p></blockquote><p>사도들은 그리스도의 나라에서 그분의 오른편과 왼편에 앉을 권리를 거절당했습니다:</p><blockquote><p>“그러나 <strong><mark>내 오른편이나 왼편 자리에 앉는 특권은</mark></strong> 내가 주는 것이 아니다. <strong>그 자리에 앉을 사람들은 하느님께서 미리 정해 놓으셨다</strong>.‘” (<a href="https://bibleox.com/ko/ko-ctb/mk/10/#L40">마르 10:40</a>)</p></blockquote><p>사도들이 “앉지” 않았다면 누가 앉았습니까? 정교회의 “최후의 심판” 이콘에는 그리스도 곁에 바로 하느님의 어머니(오른편)와, 여인에게서 난 이 가운데 가장 큰 예언자 세례자 요한(<a href="https://bibleox.com/ko/ko-ctb/mf/11/#L11">마태 11:11</a>, 왼편)이 그려져 있습니다.</p><h3>“지극히 거룩하신 하느님의 어머니, 저희를 구원하소서”라는 표현</h3><p>여기서는 뜻을 바르게 이해해야 합니다. 구원자는 한 분이시지만, 구원의 일에 함께 일하는 이들은 많습니다:</p><blockquote><p>“우리는 하느님을 위해서 <strong><mark>함께 일하는 일꾼들</mark></strong>이고 여러분은 하느님의 밭이며 하느님의 건물입니다.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/3/#L9">1고린 3:9</a>)</p></blockquote><p>사도는 사람들을 구원하려 합니다:</p><blockquote><p>“그리고 내가 믿음이 약한 사람들을 대할 때에는 그들을 얻으려고 약한 사람이 되었습니다. 이와 같이 내가 어떤 사람을 대하든지 그들처럼 된 것은 <strong><mark>어떻게 해서든지 그들 중에서 다만 몇 사람이라도 구원하려고</mark></strong> 한 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/9/#L22">1고린 9:22</a>)</p></blockquote><blockquote><p>“나는 내 동족 유다인들에게 시기심을 불러 일으켜 그들 가운데 <strong><mark>일부나마 구해 주고 싶습니다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/rim/11/#L14">로마 11:14</a>)</p></blockquote><p>아내는 남편을, 남편은 아내를 구원할 수 있습니다:</p><blockquote><p>“<strong><mark>여자 교우가 자기 남편을 구원할 수 있을지도</mark></strong> 모를 일이며 또 <strong><mark>남자 교우가 자기 아내를 구원할 수 있을지도</mark></strong> 모를 일입니다.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/7/#L16">1고린 7:16</a>)</p></blockquote><p>사람들을 구원하라는 사도의 부름:</p><blockquote><p>“의심을 품는 사람들을 동정해 주고 죄악의 불구덩이에 빠진 사람들을 끌어 내어 <strong><mark>구해 주십시오</mark></strong>. 또 본능적인 욕정에 빠진 사람들에 대해서는 욕정으로 더럽혀진 그들의 속옷까지도 미워하되 조심스럽게 자비를 베푸십시오.” (<a href="https://bibleox.com/ko/ko-ctb/iud/1/#L22-23">유다 1:22-23</a>)</p></blockquote><blockquote><p>“그대 자신을 조심하고 그대의 가르침의 내용을 잘 살피시오. 이렇게 꾸준히 일을 해 나가면 그대 자신을 구원할 뿐아니라 그대의 말을 듣는 사람들을 모두 <strong><mark>구원할 수 있을 것입니다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/1tim/4/#L16">1디모 4:16</a>)</p></blockquote><h3>“하느님의 어머니의 종들”이라는 표현</h3><p>구원의 경우와 같습니다. 뜻을 바르게 이해해야 합니다.</p><p>우리는 하느님의 어머니를 하느님으로 섬기지 않지만 그분을 섬깁니다. 하느님의 어머니가 우리에게 무언가를 청하신다면 기꺼이 섬기겠습니다. 그리스도인이 달리 행동한다는 것을 상상할 수 있겠습니까?</p><p>성경에는 의로운 사람들이 하느님만이 아니라 다른 이의 종(노예)이라고도 자칭하는 대목이 있습니다. 그러면서도 한 분 하느님의 종으로 남습니다.</p><p>사도들은 그리스도인들의 종입니다:</p><blockquote><p>“우리가 선전하는 것은 우리 자신이 아닙니다. 예수 그리스도가 주님이시고 우리는 예수를 위해서 일하는 <strong><mark>여러분의 종이라는 것을</mark></strong> 선포하고 있습니다.” (<a href="https://bibleox.com/ko/ko-ctb/2kor/4/#L5">2고린 4:5</a>)</p></blockquote><p>예언자들을 박해에서 숨겨 준 하느님을 경외하는 사람 오바디야는 자신을 예언자 엘리야의 종이라 하고 엘리야를 주인이라 부릅니다:</p><blockquote><p>“아합은 궁내대신인 오바디야를 불렀다. 오바디야는 야훼를 지극히 경외하는 사람이었다. 그는 왕후 이세벨이 야훼의 예언자들을 학살할 때 예언자 백 명을 오십 명씩 동굴에 숨기고 먹을 것과 물을 날라다 주어 살려 낸 사람이었다. &lt;…&gt; 오바디야는 돌아 다니다가 자기를 만나러 온 엘리야와 마주치게 되었다. 그는 엘리야를 알아 보고 그 앞에 엎드려 인사를 하였다. ‘아니, <strong>엘리야 선생님이 아니십니까</strong>?’ 엘리야가 대답하였다. ‘그렇소. 가서 왕에게 엘리야가 여기에 와 있다고 전하시오.’ 그러나 오바디야는 놀라며 말하였다. ‘내가 무슨 잘못을 저질렀다고 나를 아합의 손에 넘겨 죽이시려는 것입니까? &lt;…&gt; 내가 선생님을 떠난 즉시 야훼의 영이 선생님을 알지 못하는 곳으로 옮겨 가면 어떻게 합니까? 나의 보고를 듣고 왕이 왔을 때 선생님은 여기 계시지 않겠지요. 그렇게 되면 그는 나를 죽일 것입니다. 나는 어릴 때부터 야훼를 경외한 사람입니다.” (<a href="https://bibleox.com/ko/ko-ctb/3ts/18/#L3-4,7-9,12">열상 18:3-4,7-9,12</a>) <em>(히브리어: “내 주 엘리야”, “당신의 종”)</em></p></blockquote><h3>하느님의 어머니는 장사된 뒤 다시 살아나셨습니다</h3><p>하느님의 어머니 공경의 반대자들은 주 예수 그리스도께서 어머니를 살리셨다는 정교회의 성전을 불가능한 일인 양 반대하며, 그리스도만 부활하셨다고 생각합니다. 그러나 성경 쪽에서는 문제가 없습니다. 그리스도의 부활 뒤에 많은 성인이 살아났기 때문입니다(이 부활의 성격을 어떻게 이해하든 그렇습니다):</p><blockquote><p>“바로 그 때에 성전 휘장이 위에서 아래까지 두 폭으로 찢어지고 땅이 흔들리며 바위가 갈라지고 무덤이 열리면서 <strong><mark>잠들었던 많은 옛 성인들이 다시 살아났다. 그들은 무덤에서 나와 예수께서 부활하신 뒤에</mark></strong> 거룩한 도시에 들어 가서 많은 사람에게 나타났다.” (<a href="https://bibleox.com/ko/ko-ctb/mf/27/#L51-53">마태 27:51-53</a>)</p></blockquote><p>주님께서 부활하신 뒤에 많은 성인을 살리셨다면, 당신의 강생을 위해 택하시고 기적을 행하실 때 그 말을 들으시고 사랑하시는 제자에게 맡겨 돌보신 어머니를 더욱 살리실 수 있습니다.</p><p>하느님의 어머니가 살아나셨다는 성전을 뒷받침하는 사실로, 교회는 아주 오래전부터 성인들의 유해를 경건하게 대했는데도(<a href="https://bibleox.com/ru/ru/w/почитание-мощей-цитаты-святых">자세히</a>), 주 예수 그리스도의 유해가 없듯이(그분이 부활하셨기 때문입니다) 하느님의 어머니의 유해도 없다는 점도 주목할 만합니다.</p>'
