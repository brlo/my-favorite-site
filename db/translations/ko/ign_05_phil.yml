    title: 필라델피아 교회에 보낸 편지
    meta_desc: 안티오키아의 성 이그나티오스(테오포로스)가 필라델피아 교회에 보낸 편지. 그리스어 원문에서 번역하고 주석을 붙임.
    menu: { parent: "편지", title: "필라델피아 교회에 보낸 편지", priority: 7 }
    body: |-
      <h2>0</h2><p>이그나티오스 곧 테오포로스[1]가, 아시아의 필라델피아에 있는 아버지 하느님과 주 예수 그리스도의 교회에 보냅니다. 이 교회는 자비를 입었고, 하느님과의 한마음 안에 굳게 서 있으며, 우리 주님의 수난을 의심 없이 기뻐하고, 그분의 부활로 모든 자비 안에서 확신에 차 있습니다. 나는 예수 그리스도의 피 안에서 이 교회에 문안합니다[2]. 그 피는 영원하고 변함없는 기쁨입니다. 특히 사람들이 주교와, 그와 함께 있는 사제들과 보제들—곧 예수 그리스도의 뜻을 따라 세워진 사람들—과 하나가 되어 있을 때에 그러합니다. 주님께서는 당신 뜻에 따라 성령으로 그들을 굳게 세워 주셨습니다.</p>
      <h2>1</h2><p>1. 내가 알기로 여러분의 주교는 공동체에 속하는 섬김의 직무를 자기 스스로 얻은 것도, 사람들을 통하여 얻은 것도 아니며[3], 헛된 영광을 위하여 얻은 것도 아니라, 아버지 하느님과 주 예수 그리스도의 사랑 안에서 얻은 것입니다. 나는 그의 너그러움에 감탄하였습니다. 그는 침묵하면서도 헛된 말을 하는 사람들보다 더 많은 일을 할 수 있습니다.</p><p>2. 그는 거문고가 줄과 어울리듯이 계명과 조화를 이루고 있습니다. 그러므로 내 영혼은 하느님을 향한 그의 뜻을 복되다고 합니다. 나는 그 뜻이 덕스럽고 완전하다는 것을, 그리고 살아 계신 하느님의 온갖 너그러움 안에서 그가 흔들리지 않고 성내지 않는다는 것을 알았습니다.</p>
      <h2>2</h2><p>1. 그러므로 진리의 빛의 자녀 여러분, 분열과 악한 가르침을 피하십시오. 목자가 있는 곳으로 양처럼 따라가십시오.</p><p>2. 믿음직해 보이는 많은 이리들이[4] 악한 쾌락으로 하느님께로 달려가는 사람들을 사로잡으려 합니다. 그러나 여러분이 일치해 있으면 그들이 끼어들 자리가 없습니다.</p>
      <h2>3</h2><p>1. 나쁜 풀을 멀리하십시오. 그것은 예수 그리스도께서 가꾸지 않으시는 것입니다. 그것들은 아버지께서 심으신 것이 아니기 때문입니다[5]. 내가 여러분 가운데서 분열을 보았다는 것이 아니라, 오히려 걸러 내어 깨끗해진 것을 보았습니다[6].</p><p>2. 하느님의 사람, 예수 그리스도의 사람은 모두 주교와 함께 있습니다. 회개하고 교회의 일치로 돌아오는 사람들도 하느님의 사람이 되어 예수 그리스도를 따라 살게 될 것입니다.</p><p>3. 나의 형제 여러분, 속지 마십시오. 분열을 일으키는 자를 따르는 사람은 하느님 나라를 차지하지 못합니다[7]. 다른 생각을 따라 걷는 사람은 (그리스도의) 수난에 동참하지 않는 것입니다[8].</p>
      <h2>4</h2><p>그러므로 하나의 성찬(감사의 제사)에 참여하도록 힘쓰십시오. 우리 주 예수 그리스도의 살은 하나이고, 그분의 피와 하나 되게 하는 잔도 하나이며[9], 제단도 하나입니다. 마찬가지로 주교도 한 사람으로서, 사제단과 나의 동료 종인 보제들과 함께 있습니다. 그것은 여러분이 무엇을 하든지 하느님을 따라 하게 하려는 것입니다.</p>
      <h2>5</h2><p>1. 나의 형제 여러분, 나는 여러분을 사랑하여 내 마음을 온통 쏟아붓고 있으며, 크게 기뻐하며 여러분을 지키려 합니다. 그러나 그것은 내가 아니라 예수 그리스도께서 하시는 것입니다. 나는 그분 안에서 묶여 있지만, 아직 완전해지지 못한 사람으로서[10] 더욱 두려워합니다. 그러나 여러분의 기도가 하느님 앞에서 나를 완전하게 해 줄 것입니다. 그것은 내가 자비로 받은 몫에 이르기 위해서입니다. 나는 예수님의 살에 의지하듯이 복음에 의지하고, 교회의 사제단에 의지하듯이 사도들에게 의지합니다[11].</p><p>2. 우리는 예언자들도 사랑합시다. 그들도 복음을 미리 선포하였고, 그분께 희망을 두고 그분을 기다렸기 때문입니다[12]. 그들은 그분을 믿어 구원을 받았으며, 예수 그리스도와의 일치 안에 있었습니다. 그들은 사랑스럽고 감탄할 만한 거룩한 사람들로서, 예수 그리스도께 증언을 받았고 우리 공동의 희망인 복음 안에 함께 헤아려졌습니다.</p>
      <h2>6</h2><p>1. 누가 여러분에게 유다교를 풀이해 주거든 그의 말을 듣지 마십시오. 할례받지 않은 사람에게서 유다교를 듣는 것보다, 할례받은 사람에게서 그리스도교를 듣는 것이 낫습니다. 그러나 둘 다 예수 그리스도에 대하여 말하지 않는다면, 그들은 나에게 묘비요 죽은 이들의 무덤이며, 그 위에는 사람의 이름만 적혀 있을 뿐입니다.</p><p>2. 그러므로 이 세상 권력자의 간계와 덫을 피하십시오. 그의 생각에 시달려 사랑 안에서 약해지지 않도록 하려는 것입니다. 오히려 모두 갈라지지 않는 마음으로 함께 모이십시오.</p><p>3. 나는 나의 하느님께 감사드립니다. 나는 여러분에 대하여 떳떳하며, 내가 작은 일에서든 큰 일에서든 누구에게 짐을 지웠다고 남몰래든 드러내 놓고든 자랑할 수 있는 사람은 아무도 없습니다[13]. 내가 말을 건넨 모든 사람에 대해서도, 내 말이 그들에게 불리한 증언이 되지 않기를 기도합니다[14].</p>
      <h2>7</h2><p>1. 어떤 사람들이 육을 따라 나를 속이려 했다 하더라도, 영은 하느님에게서 나온 것이므로 속지 않습니다. 영은 어디에서 와서 어디로 가는지 알고[15], 숨은 것을 드러냅니다[16]. 나는 여러분 가운데 있을 때 외쳤습니다. 큰 소리로, 하느님의 목소리로 말했습니다. "주교와 사제단과 보제들에게 마음을 기울이십시오."</p><p>2. 어떤 사람들은 내가 몇몇 사람의 분열을 미리 알고 이렇게 말했다고 의심했습니다. 그러나 내가 그분 때문에 묶여 있는 그분께서 나의 증인이십니다. 나는 사람의 육으로부터 그것을 알게 된 것이 아닙니다. 영께서 이렇게 선포하셨습니다. "주교를 제쳐 놓고는 아무것도 하지 마라. 너희의 육을 하느님의 성전으로 지켜라[17]. 일치를 사랑하여라. 분열을 피하여라. 예수 그리스도께서 당신 아버지를 본받으셨듯이 너희도 예수 그리스도를 본받는 사람이 되어라."</p>
      <h2>8</h2><p>1. 그러므로 나는 일치를 위하여 준비된 사람으로서 내 할 일을 다했습니다. 분열과 분노가 있는 곳에는 하느님께서 머물지 않으십니다. 그러나 회개하는 모든 사람을 주님께서는 용서하십니다. 그들이 회개하여 하느님의 일치와 주교의 회의로 돌아온다면 말입니다. 나는 예수 그리스도의 은총을 믿습니다. 그분께서 여러분에게서 모든 사슬을 풀어 주실 것입니다.</p><p>2. 여러분에게 권합니다. 아무 일도 당파심으로 하지 말고[18], 그리스도에게서 배운 대로 하십시오. 나는 어떤 사람들이 이렇게 말하는 것을 들었습니다. "옛 기록[19] 안에서 찾지 못하면 복음에서도 믿지 않겠다." 그래서 내가 "그것은 기록되어 있다" 하고 말하자, 그들은 "그것이야말로 증명해야 할 문제다"[20] 하고 대답했습니다. 그러나 나에게 옛 기록은 예수 그리스도이십니다. 손댈 수 없는 기록은 그분의 십자가와 죽음과 부활, 그리고 그분을 통한 믿음입니다[21]. 나는 여러분의 기도로 이것들 안에서 의롭게 되기를 바랍니다.</p>
      <h2>9</h2><p>1. 사제들도 좋습니다. 그러나 지성소를 맡은 대사제께서는 더 뛰어나십니다[22]. 그분만이 하느님의 숨은 일들을 맡으셨습니다. 그분이야말로 아버지께로 가는 문이시며[23], 아브라함과 이사악과 야곱도, 예언자들도, 사도들도, 교회도 이 문을 통하여 들어갑니다. 이 모든 것은 하느님의 일치로 향합니다.</p><p>2. 그러나 복음에는 특별한 것이 있습니다. 구세주이신 우리 주 예수 그리스도의 오심과 그분의 수난과 부활입니다. 사랑스러운 예언자들은 그분을 미리 알렸지만, 복음은 불멸의 완성입니다. 여러분이 사랑 안에서 믿는다면, 이 모든 것이 함께 좋습니다.</p>
      <h2>10</h2><p>1. 여러분의 기도와 그리스도 예수 안에서 여러분이 지닌 자비로운 마음 덕분에, 시리아의 안티오키아 교회가 평화를 얻었다는 소식이 나에게 전해졌습니다. 그러므로 하느님의 교회인 여러분은 보제 한 사람을 뽑아[24] 하느님의 사절로 그곳에 보내어, 함께 모인 그들과 더불어 기뻐하고 그 이름을 찬미하게 하는 것이 마땅합니다.</p><p>2. 이러한 섬김에 합당하다고 인정받는 사람은 예수 그리스도 안에서 복됩니다. 여러분도 영광을 받을 것입니다.</p><p>3. 여러분이 원한다면 하느님의 이름을 위하여 이 일을 하는 것은 불가능하지 않습니다. 가장 가까운 교회들은 이미 주교들을 보냈고, 다른 교회들은 사제들과 보제들을 보냈습니다.</p>
      <h2>11</h2><p>1. 킬리키아의 보제 필론으로 말하자면, 그는 좋은 평판을 받는 사람으로서, 지금도 뽑힌 사람 레오스 아가토푸스와 함께 하느님의 말씀 안에서 나를 섬기고 있습니다. 아가토푸스는 이 세상의 삶을 버리고 시리아에서부터 나를 따라왔습니다. 그들은 여러분에 대해서도 증언합니다. 나도 여러분이 그들을 맞아들인 것에 대하여, 주님께서 여러분을 맞아들이셨듯이, 여러분을 위하여 하느님께 감사드립니다. 그러나 그들을 업신여긴 사람들은 예수 그리스도의 은총 안에서 구속받기를 빕니다.</p><p>2. 트로아스에 있는 형제들의 사랑이 여러분에게 문안합니다. 나는 그 트로아스에서 부루스 편에 이 편지를 써 보냅니다. 부루스는 존경의 표시로 에페소 사람들과 스미르나 사람들이 나와 함께 보낸 사람입니다. 주 예수 그리스도께서 그들을 귀하게 여기실 것입니다. 그들은 육과 혼과 영으로[25], 믿음과 사랑과 한마음 안에서 그분께 희망을 두고 있습니다. 우리 공동의 희망이신 그리스도 예수 안에서 안녕히 계십시오.</p>
    references: |-
      <ol><li><p>이그나티오스는 스미르나를 떠나 트로아스에 이르렀고, 그곳에서 오는 길에 지나온 리디아의 필라델피아(<a href="https://bibleox.com/ko/ko-ctb/otkr/3/#L7">묵시 3:7</a> 참조) 교회에 이 편지를 썼습니다(<a href="#HH-11">11:2</a>). 주교에게 순종하고 분열을 피할 것(1–4장), 복음에 유다교를 섞지 말 것(5–9장)을 권하고, 평화를 되찾은 안티오키아에 사절을 보내 달라고 부탁합니다(10–11장).</p></li><li><p>그리스도의 피 안에서, 곧 당신의 피로 우리를 구속하시고 사랑의 끈으로 하나 되게 하신 그리스도 안에서, 라는 뜻입니다.</p></li><li><p><a href="https://bibleox.com/ko/ko-ctb/gal/1/#L1">갈라 1:1</a> 참조.</p></li><li><p><a href="https://bibleox.com/ko/ko-ctb/mf/7/#L15">마태 7:15</a>, <a href="https://bibleox.com/ko/ko-ctb/in/10/#L12">요한 10:12</a> 참조.</p></li><li><p><a href="https://bibleox.com/ko/ko-ctb/mf/15/#L13">마태 15:13</a>, <a href="https://bibleox.com/ko/ko/w/Ig2T_트랄레스교회에보낸편지#HH-11">「트랄레스 교회에 보낸 편지」 11:1</a> 참조.</p></li><li><p>ἀποδιϋλισμός — '걸러 냄'. 그릇된 가르침을 따르는 사람들이 떨어져 나간 것을, 교회가 낯선 잡초에서 걸러져 깨끗해진 것으로 봅니다.</p></li><li><p><a href="https://bibleox.com/ko/ko-ctb/1kor/6/#L9-10">1고린 6:9-10</a>, <a href="https://bibleox.com/ko/ko/w/Ig2E_에페소교회에보낸편지#HH-16">「에페소 교회에 보낸 편지」 16:1</a> 참조.</p></li><li><p>그리스도께서는 당신의 수난으로 교회를 세우셨으므로, 교회의 일치를 깨는 사람은 그 수난을 거스르는 것이라는 뜻입니다.</p></li><li><p><a href="https://bibleox.com/ko/ko-ctb/1kor/10/#L16-17">1고린 10:16-17</a> 참조.</p></li><li><p>ἀναπάρτιστος — '아직 완전해지지 못한'. 긴 교정본과 옛 라틴어, 아르메니아어 번역에 따른 읽기입니다.</p></li><li><p>복음 안에 그리스도께서 몸소 육신으로 계시듯이, 사도들이 지금도 살아서 교회의 사제단을 이루고 있듯이 그것에 의지한다는 뜻입니다.</p></li><li><p><a href="https://bibleox.com/ko/ko-ctb/lk/24/#L25-27">루가 24:25-27</a> 참조.</p></li><li><p><a href="https://bibleox.com/ko/ko-ctb/2kor/11/#L9">2고린 11:9</a>, <a href="https://bibleox.com/ko/ko-ctb/2kor/12/#L13">2고린 12:13</a> 참조.</p></li><li><p><a href="https://bibleox.com/ko/ko/w/Ig2T_트랄레스교회에보낸편지#HH-12">「트랄레스 교회에 보낸 편지」 12:3</a> 참조.</p></li><li><p><a href="https://bibleox.com/ko/ko-ctb/in/3/#L8">요한 3:8</a> 참조.</p></li><li><p><a href="https://bibleox.com/ko/ko-ctb/1kor/2/#L10">1고린 2:10</a> 참조.</p></li><li><p><a href="https://bibleox.com/ko/ko-ctb/1kor/3/#L16-17">1고린 3:16-17</a>, <a href="https://bibleox.com/ko/ko-ctb/1kor/6/#L19">6:19</a> 참조.</p></li><li><p>κατ᾽ ἐριθείαν — '당파심으로'. <a href="https://bibleox.com/ko/ko-ctb/fil/2/#L3">필립 2:3</a> 참조.</p></li><li><p>ἀρχεῖα — '기록, 공문서'. 여기서는 구약 성서를 말합니다. 유다교의 영향을 받은 사람들은 그리스도의 탄생과 수난에 관한 복음의 진리를 옛 예언으로 증명하라고 요구했습니다.</p></li><li><p>πρόκειται — '그것이야말로 문제다, 증명해야 할 일이다'.</p></li><li><p>그리스도께서 가져오신 믿음, 곧 그리스도의 가르침.</p></li><li><p>사제들은 구약의 사제들을, 대사제는 그리스도를 가리킵니다(<a href="https://bibleox.com/ko/ko-ctb/evr/4/#L14">히브 4:14</a>, <a href="https://bibleox.com/ko/ko-ctb/evr/9/#L7">히브 9:7</a> 참조).</p></li><li><p><a href="https://bibleox.com/ko/ko-ctb/in/10/#L7">요한 10:7</a>, <a href="https://bibleox.com/ko/ko-ctb/in/10/#L9">10:9</a> 참조.</p></li><li><p>χειροτονῆσαι — 본디 '손을 들어 (뽑다)'. 여기서는 공동체가 사절을 뽑는 것을 말합니다. 이 말은 나중에 서품(안수)을 뜻하는 교회 용어가 되었습니다.</p></li><li><p><a href="https://bibleox.com/ko/ko-ctb/1sol/5/#L23">1데살 5:23</a> 참조.</p></li></ol>
      <p>번역: 로디온 블라소프 (AI 도구 활용). 저본: 그리스어 원문(<a href="https://bibleox.com/ko/grc/w/ΙγνΘ_Φιλ">이 사이트의 그리스어판</a>. 명백한 누락은 라이트풋판과 홈스판으로 보충함). 참고: 러시아어 번역(『초기 교부 선집』, 브뤼셀, 1988년), 영어 번역(Roberts–Donaldson), 프랑스어 번역(Genoude, 1837년). 성경 인용과 링크는 공동번역 성서에 따름.</p>
