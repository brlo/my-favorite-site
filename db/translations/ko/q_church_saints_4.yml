  path: Ic8v_이콘_공경
  title: 이콘 공경
  copy_cover: true
  body: '<p>정교인들은 우상 숭배를 한다는 비난을 받습니다. 이콘은 우상이라 불리고 이콘 공경은 우상 숭배라 불립니다. 이 글은 성경에 따라 이콘 공경의 주제를 살피며 이런 비난을 검토합니다.</p><p>먼저 짧은 답변을 내놓고, 이어서 비판을 조금 더 자세히 살핀 다음, 끝으로 성경을 검토하며 가장 자세한 답변을 드립니다.</p><h2>이콘 공경의 가장 짧은 변호</h2><p>하느님께서 사람이 되시기 전, 구약의 이스라엘에게 율법을 세우실 때 하느님께서는 당신의 형상을 드러내지 않으셨고, 거짓 신(우상)의 형상을 만들어 공경하는 것을 금하셨습니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/20/#L4-5">출 20:4-5</a>; <a href="https://bibleox.com/ko/ko-nkrv/vtor/5/#L8-9">신 5:8-9</a>; <a href="https://bibleox.com/ko/ko-nkrv/vtor/4/#L15-19">신 4:15-19</a>). 그러나 하느님께서는 당신의 거룩한 종들을 형상으로 나타내라고 명하셨고(<a href="https://bibleox.com/ko/ko-nkrv/ish/25/#L1">출 25:1</a>; <a href="https://bibleox.com/ko/ko-nkrv/ish/26/#L1">출 26:1</a>; <a href="https://bibleox.com/ko/ko-nkrv/ish/25/#L18-20">출 25:18-20</a>), 예언자들은 형상이 있는 성물 앞에 엎드렸습니다(<a href="https://bibleox.com/ko/ko-nkrv/nav/7/#L6">수 7:6</a>; <a href="https://bibleox.com/ko/ko-nkrv/ps/5/#L7">시 5:7</a>). 정교인들이 형상이 있는 성물을 공경하는 태도는 예언자들의 태도와 똑같습니다.</p><p>게다가 하느님의 뜻에 따라 성전 자체가 하늘의 이콘입니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/25/#L8-9,40">출 25:8-9,40</a>; <a href="https://bibleox.com/ko/ko-nkrv/evr/9/#L24">히 9:24</a>; <a href="https://bibleox.com/ko/ko-nkrv/act/7/#L44">행 7:44</a>). 하느님께서는 성전을 공경하라고 명하셨고(<a href="https://bibleox.com/ko/ko-nkrv/lev/19/#L30">레 19:30</a>; <a href="https://bibleox.com/ko/ko-nkrv/lev/26/#L2">레 26:2</a>), 사람들은 성전을 공경하며 그 앞에 엎드렸습니다(<a href="https://bibleox.com/ko/ko-nkrv/ps/5/#L7">시 5:7</a>; <a href="https://bibleox.com/ko/ko-nkrv/ps/99/#L5">시 99:5</a>; <a href="https://bibleox.com/ko/ko-nkrv/ps/132/#L7">시 132:7</a>). 정교회의 공경이 바로 이것입니다. 형상을 공경하면서 원형을 공경합니다.</p><p>누가 예언자들의 성물 공경에 적용하려는 어떤 변호도 정교회의 공경에 적용됩니다(둘은 같은 것이기 때문입니다). 또 누가 정교회의 공경에 돌리려는 어떤 단죄도 예언자들의 공경에 돌아갑니다.</p><p>핵심은 형상이나 그 공경이 전혀 아닙니다. 우상은 하느님에 관한 모든 거짓 관념이므로, 핵심은 1) 형상 자체와 2) 공경하는 사람이 거기 담는 의미가 진리와 어떤 관계에 있느냐입니다. 둘 가운데 하나라도 근본적으로 거짓이면 우상 숭배가 되며[1], 사람을 진리에서 멀어지게 합니다. 바로 이것이 문제입니다. 우상은 하느님께로 이끌지 않습니다. 하느님에 관한 거짓 관념은 참 하느님께로 이끌지 않습니다. 거짓은 진리로 이끌지 않고 진리에서 멀어지게 하기 때문입니다[2].</p><p>이콘 공경 반대자와의 대화에서 이 주장을 짧게 시험해 봅시다:</p><p><strong>이콘 반대자</strong>: 물건 앞에 절하는 것은 우상 숭배입니다.</p><p><strong>정교인</strong>: 그러면 성전과 형상이 있는 궤 앞에 절한 하느님의 예언자들은 우상 숭배자가 되었습니까?</p><p><strong>반대자</strong>: 하느님께서는 만들라고만 하셨지 공경하거나 절하라고는 하지 않으셨습니다.</p><p><strong>정교인</strong>: 그러면 예언자들은 해서는 안 되는 일, 기록되지도 명령되지도 않은 일을 했으니 우상 숭배에 빠진 것입니까?</p><p><strong>반대자</strong>: 예언자들은 성전이나 궤 자체에 절한 것이 아니라 그 절을 하느님께 돌렸습니다.</p><p><strong>정교인</strong>: 바로 그렇습니다. 정교인들도 나무와 물감이 아니라 그려진 분께 절합니다. 가르침이 말하는 대로 형상을 통해 원형을 공경합니다. 예언자들이 그랬듯이 말입니다. 차이가 없습니다.</p><p>이런 식으로 이어집니다. 이 규칙은 언제나 통합니다. 예언자들의 공경과 정교회의 공경에는 차이가 없기 때문입니다. 이제 문제를 더 자세히 살펴봅시다.</p><h2>이콘 반대자들의 말: “하느님의 말씀은 형상을 만들지 말라고 분명히 말하는데 당신들은 만듭니다”</h2><p><strong>답변</strong>: 이것은 문맥에서 분명하듯이 하느님만을 형상으로 나타내지 말라는 모세 율법의 구약 금지입니다:</p><ul><li><p>처음 네 계명은 바로 <strong>하느님에 관한</strong> 것입니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/20/#L4-5">출 20:4-5</a>; <a href="https://bibleox.com/ko/ko-nkrv/vtor/5/#L8-9">신 5:8-9</a>);</p></li><li><p>하느님께서는 금지를 세우시며 그 이유를 말씀하십니다. 율법을 주실 때 바로 <strong>당신의 형상</strong>을 드러내지 않으셨습니다(<a href="https://bibleox.com/ko/ko-nkrv/vtor/4/#L15-19">신 4:15-19</a>). 하느님을 보지 못했으니 그분을 나타내지 말라는 것입니다.</p></li></ul><p>그러므로 금지는 바로 하느님의 형상에 관한 것입니다. 당신의 거룩한 종들에 관해서는 하느님께서 금하지 않으셨을 뿐 아니라 나타내라고 명하셨고(<a href="https://bibleox.com/ko/ko-nkrv/ish/25/#L1">출 25:1</a>; <a href="https://bibleox.com/ko/ko-nkrv/ish/26/#L1">출 26:1</a>), 의인들은 성전과 이런 형상이 있는 성물에 절했습니다(<a href="https://bibleox.com/ko/ko-nkrv/nav/7/#L6">수 7:6</a>; <a href="https://bibleox.com/ko/ko-nkrv/ps/5/#L7">시 5:7</a>; <a href="https://bibleox.com/ko/ko-nkrv/ps/99/#L5">시 99:5</a>; <a href="https://bibleox.com/ko/ko-nkrv/ps/132/#L7">시 132:7</a>).</p><p>구약의 교회에는 이콘이 있었고 공경받았습니다. 무엇보다 <strong>구약의 성전 자체가 이콘입니다.</strong> 성전은 지상의 건물이지만 하느님의 본래 뜻에 따라 하늘에서 일어나는 일의 형상이 되어야 했습니다. 하느님께서 예언자 모세에게 성전을 지으라고 명하신 것은 성전이 필요해서가 아니라(하느님께는 필요하지 않습니다: <a href="https://bibleox.com/ko/ko-nkrv/is/66/#L1">사 66:1</a>; <a href="https://bibleox.com/ko/ko-nkrv/ps/50/#L13">시 50:13</a>; <a href="https://bibleox.com/ko/ko-nkrv/is/1/#L11">사 1:11</a>), 바로 하늘의 이콘으로서, 예언자에게 보여 주신 천상 실재의 형상으로서 짓게 하신 것입니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/25/#L8-9,40">출 25:8-9,40</a>; <a href="https://bibleox.com/ko/ko-nkrv/evr/9/#L24">히 9:24</a>; <a href="https://bibleox.com/ko/ko-nkrv/act/7/#L44">행 7:44</a>). 하느님께서는 이 이콘을 공경하라고 명하십니다(<a href="https://bibleox.com/ko/ko-nkrv/lev/19/#L30">레 19:30</a>; <a href="https://bibleox.com/ko/ko-nkrv/lev/26/#L2">레 26:2</a>). 예언자 다윗은 그 앞에 엎드립니다(<a href="https://bibleox.com/ko/ko-nkrv/ps/5/#L7">시 5:7</a>; <a href="https://bibleox.com/ko/ko-nkrv/ps/99/#L5">시 99:5</a>; <a href="https://bibleox.com/ko/ko-nkrv/ps/132/#L7">시 132:7</a>). 악한 왕들이 성전에 이교 우상을 세워(<a href="https://bibleox.com/ko/ko-nkrv/4ts/21/#L3-7">왕하 21:3-7</a>) 천상 실재의 형상을 망가뜨리자, 하느님께서는 성전을 버리셨습니다(<a href="https://bibleox.com/ko/ko-nkrv/4ts/23/#L27">왕하 23:27</a>).</p><p>성전이 하늘의 이콘이기 때문에 신약에서 (내부 구조와 형상이) 달라집니다. 천상 실재가 달라지기 때문입니다. 구약에서 천상 실재에는 <strong>천사들만</strong> 영적으로 보이게 머물렀습니다. 하느님께서는 완전히 보이지 않으시고 물질이 아니시며, 사람들은 아직 하늘의 삶에 이르지 못했습니다(<a href="https://bibleox.com/ru/ru/w/9VFT_До_жертвы_Христовой_ветхозаветные_праведники_сходили_в_ад">자세히</a>).</p><p>신약에서, 정확히는 주 예수 그리스도께서 오시면서 큰 변화가 일어났습니다:</p><ol><li><p><strong>하느님께서 인성으로 보이게 되셨습니다</strong>(<a href="https://bibleox.com/ko/ko-nkrv/in/1/#L18">요 1:18</a>; <a href="https://bibleox.com/ko/ko-nkrv/1in/1/#L1-2">요일 1:1-2</a>);</p></li><li><p><strong>하느님께서 하늘에서 보이게 왕좌에 앉으셨습니다</strong>(<a href="https://bibleox.com/ko/ko-nkrv/ef/1/#L20-21">엡 1:20-21</a>; <a href="https://bibleox.com/ko/ko-nkrv/otkr/3/#L21">계 3:21</a>);</p></li><li><p><strong>사람들이 하늘에 나타났습니다.</strong> 주 예수 그리스도와 함께하는 삶에 이를 가능성을 얻었습니다(<a href="https://bibleox.com/ko/ko-nkrv/otkr/6/#L9-11">계 6:9-11</a>; <a href="https://bibleox.com/ko/ko-nkrv/otkr/14/#L1,3-5">계 14:1,3-5</a>);</p></li><li><p><strong>하느님께서 새 계약을 맺으십니다</strong>(<a href="https://bibleox.com/ko/ko-nkrv/ier/31/#L31">렘 31:31</a>; <a href="https://bibleox.com/ko/ko-nkrv/evr/8/#L8">히 8:8</a>; <a href="https://bibleox.com/ko/ko-nkrv/lk/22/#L20">눅 22:20</a>; <a href="https://bibleox.com/ko/ko-nkrv/1kor/11/#L25">고전 11:25</a>). <strong>옛 계약은 모세의 율법과 함께 끝났습니다</strong>(<a href="https://bibleox.com/ko/ko-nkrv/rim/7/#L6">롬 7:6</a>; <a href="https://bibleox.com/ko/ko-nkrv/gal/3/#L21-25">갈 3:21-25</a>; <a href="https://bibleox.com/ko/ko-nkrv/ef/2/#L14-16">엡 2:14-16</a>). 하느님을 나타내지 말라는 금지는 그리스도께서 오시며 폐지된 모세 율법의 일부이므로 효력을 잃습니다(<a href="https://bibleox.com/ru/ru/w/Библия-Закон-Моисея-отмена">자세히</a>).</p></li></ol><p>곧 구약의 성전은 구약의 천상 실재의 형상이었고, 그 실재는 신약에서 달라졌습니다. 이전의 것은 이제 없습니다. 성전은 하느님의 본래 뜻에 따라 천상 실재의 형상이었으므로, 그 실재가 달라진 뒤에는 옛것을 나타낼 까닭이 없습니다. 그래서 그리스도인들은 아주 오래전부터 새 천상 실재를 나타내어, 모든 것의 머리에 하늘에서 드러나게 왕좌에 앉으신 예수 그리스도(하느님)의 형상을 두고, 그 둘레에 천사들만이 아니라 사람들도 포함한 그분의 거룩한 종들의 형상을 둡니다.</p><p>상징적인 사건은 그리스도의 희생 뒤에 예루살렘 성전에 일어난 손상입니다:</p><blockquote><p>“이에 <strong>성소 휘장이 위로부터 아래까지 찢어져 둘이 되고 땅이 진동하며 바위가 터지고</strong> 무덤들이 열리며 <strong>자던 성도의 몸이 많이 일어나되 예수의 부활 후에 그들이 무덤에서 나와서</strong> 거룩한 성에 들어가 많은 사람에게 보이니라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/27/#L51-53">마 27:51-53</a>)</p></blockquote><p>70년대에 성전은 로마인들에게 완전히 파괴되어, 그 뒤 수천 년 동안 새로운 천상 실재의 형상, 곧 정교회 성당에 자리를 내주었습니다.</p><img src="https://res.bibleox.com/s/img/image/simple/686bea5b5f47da2505d3ae31/s_p_pjRHeoFaUpKPoyEH.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686bea5b5f47da2505d3ae31/m_p_pjRHeoFaUpKPoyEH.jpg">크게 보기</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686cf7375f47da2505d3ae4f/m_p_MOsOWI2vEXUj5ELf.jpg">다른 그림</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686d23425f47da2505d3ae55/s_p_LzqgbhnIsbqtghoc.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d23425f47da2505d3ae55/m_p_LzqgbhnIsbqtghoc.jpg">크게 보기</a>]</p><p>더 많은 고대 이콘: <a href="https://bibleox.com/ru/ru/w/древние-иконы">고대 이콘</a>.</p><p>천상 실재의 구약 형상만이 아니라, 그 필수 부분인 모세 율법을 포함한 옛 계약 자체도 낡아 이제 의미를 잃었습니다. 하느님을 나타내지 말라는 금지 외에도 신약에서 더 이상 적용되지 않는 규정이 많습니다:</p><blockquote><p>“<strong>여호와의 이름을 모독하면 그를 반드시 죽일지니</strong> 온 회중이 돌로 그를 칠 것이니라 거류민이든지 본토인이든지 여호와의 이름을 모독하면 <strong>그를 죽일지니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/lev/24/#L16">레 24:16</a>)</p></blockquote><p>하느님의 이름을 모독하는 것은 <strong>셋째 계명</strong>을 거스르는 죄입니다. 모세 율법의 벌은 죽음입니다(<a href="https://bibleox.com/ko/ko-nkrv/lev/24/#L16">레 24:16</a>). 알려진 바로는 이콘 반대자들은 하느님을 모독한 사람을 죽여야 한다고 가르치지 않습니다. 그들은 “이것은 하느님의 말씀이다”라며 구절을 보이고 하느님을 나타내지 말라는 구약의 금지를 지키라고 요구하지만, 모독자를 죽이라는 계명도 하느님의 말씀이고 분명히 기록되어 있는데도 지키지 않습니다. 왜입니까? 모세의 율법이 폐지되었기 때문입니다.</p><p><strong>넷째 계명</strong>은 안식일의 쉼, 곧 일을 삼가는 것을 정합니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/20/#L8-10">출 20:8-10</a>; <a href="https://bibleox.com/ko/ko-nkrv/vtor/5/#L12-15">신 5:12-15</a>; <a href="https://bibleox.com/ko/ko-nkrv/lev/19/#L3">레 19:3</a>; <a href="https://bibleox.com/ko/ko-nkrv/lev/19/#L30">레 19:30</a>). 모세 율법의 벌은 죽음입니다. 이것도 하느님의 말씀이고 분명히 기록되어 있지만, 이콘 반대자들은 안식일을 어긴 사람을 죽여야 한다고 가르치지 않으며, 대부분 안식일의 쉼조차 지키지 않습니다. 왜입니까? 모세의 율법이 폐지되었기 때문입니다.</p><p>그러므로 사람이 되신 하느님을 나타내지 말라고 금하는 것은:</p><ol><li><p><strong>유다교로 돌아가는 것</strong>입니다. 모세의 율법대로 계속 사는 것입니다(그런데 같은 이유로 어떤 이들은 <a href="https://bibleox.com/ru/ru/w/ozcY_О_десятине">십일조</a>를 걷습니다);</p></li><li><p><strong>하느님의 강생을 간접적으로 부정하는 것</strong>입니다. 그리스도께서 하느님이심을 부정하거나 그분이 보이는 분이심을 부정하는 것입니다.</p></li></ol><p>이제 문제를 더 자세히 살펴봅시다.</p><h2>모세 율법의 둘째 계명</h2><p>이콘 반대자들은 이콘이 <a href="https://bibleox.com/ru/ru/w/10-заповедей">모세 율법</a>의 둘째 계명을 어긴다고 여깁니다:</p><blockquote><p>“<strong>너를 위하여 새긴 우상을 만들지 말고</strong> 또 위로 하늘에 있는 것이나 아래로 땅에 있는 것이나 땅 아래 물 속에 있는 것의 어떤 형상도 만들지 말며 <strong>그것들에게 절하지 말며 그것들을 섬기지 말라</strong> 나 네 하나님 여호와는 질투하는 하나님인즉 나를 미워하는 자의 죄를 갚되 아버지로부터 아들에게로 삼사 대까지 이르게 하거니와” (<a href="https://bibleox.com/ko/ko-nkrv/ish/20/#L4-5">출 20:4-5</a>; <a href="https://bibleox.com/ko/ko-nkrv/vtor/5/#L8-9">신 5:8-9</a>)</p></blockquote><p>모세의 십계명은 두 부분(두 판)으로 나뉩니다:</p><ul><li><p>하느님에 대한 사랑에 관한 네 계명;</p></li><li><p>이웃에 대한 사랑에 관한 여섯 계명.</p></li></ul><p>둘째 계명은 하느님에 대한 사랑의 표현에 속하며, 모든 형상과 절을 금하는 것이 아니라 유일한 참 하느님 대신 신으로 공경할 물건을 만드는 것을 금합니다. 곧 <strong>이 계명은 거짓 신 숭배를 금합니다.</strong> 그래서 성경에는 이 계명에 어긋나지 않는 형상과 절이 나옵니다. 이에 관해서는 아래에 더 있습니다.</p><h3>“형상을 만들지 말라”</h3><h4>하느님께서는 당신의 성전에 형상을 만들라고 명하십니다</h4><p>둘째 계명이 형상을 금하는데도, 이 계명을 주신 바로 그 하느님께서 당신의 성전(성막)에 곧 성막의 천과 지성소로 들어가는 휘장에 그룹 형상을 만들고, 계약궤의 덮개에 금으로 그룹 상을 만들라고 명하십니다:</p><blockquote><p>“일하는 사람 중에 마음이 지혜로운 모든 사람이 <strong><mark>열 폭 휘장으로 성막을 지었으니</mark></strong> 곧 가늘게 꼰 베 실과 청색 자색 홍색 실로 <strong><mark>그룹들을 무늬 놓아 짜서 지은 것이라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ish/36/#L8">출 36:8</a>; <a href="https://bibleox.com/ko/ko-nkrv/ish/25/#L1">출 25:1</a>; <a href="https://bibleox.com/ko/ko-nkrv/ish/26/#L1">출 26:1</a>)</p></blockquote><blockquote><p>“너는 청색 자색 홍색 실과 가늘게 꼰 베 실로 짜서 <strong><mark>휘장을 만들고 그 위에 그룹들을 정교하게 수 놓아서</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ish/26/#L31">출 26:31</a>)</p></blockquote><blockquote><p>“금으로 <strong>그룹 둘을</strong> <strong><mark>속죄소 두 끝에</mark></strong> 쳐서 만들되” (<a href="https://bibleox.com/ko/ko-nkrv/ish/25/#L18">출 25:18</a>)</p></blockquote><p>나중에 솔로몬이 지은 성전에는 더 많은 형상과 조각이 있었습니다:</p><blockquote><p>“청색 자색 홍색 실과 고운 베로 <strong><mark>휘장문을 짓고</mark></strong> <strong>그 위에 그룹의 형상을 수놓았더라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2par/3/#L14">대하 3:14</a>)</p></blockquote><blockquote><p>“<strong><mark>지성소 안에</mark></strong> <strong>두 그룹의 형상을</strong> 새겨 만들어 금으로 입혔으니” (<a href="https://bibleox.com/ko/ko-nkrv/2par/3/#L10">대하 3:10</a>)</p></blockquote><blockquote><p>“<strong><mark>내소 안에</mark></strong> 감람나무로 <strong>두 그룹을</strong> 만들었는데 그 높이가 각각 십 규빗이라” (<a href="https://bibleox.com/ko/ko-nkrv/3ts/6/#L23">왕상 6:23</a>)</p></blockquote><p>성전의 자세한 구조: <a href="https://bibleox.com/ru/ru/w/иерусалимский-храм">예루살렘 성전</a>.</p><p>성전 기물을 만들도록 하느님께서는 장인들에게 성령의 은사를 주셨습니다:</p><blockquote><p>“여호와께서 모세에게 말씀하여 이르시되 내가 유다 지파 훌의 손자요 우리의 아들인 브살렐을 지명하여 부르고 <strong>하나님의 영을 그에게 충만하게 하여 지혜와 총명과 지식과 여러 가지 재주로</strong> 정교한 일을 연구하여 금과 은과 놋으로 만들게 하며 보석을 깎아 물리며 여러 가지 기술로 나무를 새겨 만들게 하리라” (<a href="https://bibleox.com/ko/ko-nkrv/ish/31/#L1-5">출 31:1-5</a>)</p></blockquote><h4>하느님께서는 뱀의 형상을 만들라고 명하셨습니다</h4><p>하느님께서는 또 놋뱀을 만들게 하시어, 사람들이 그것을 바라보면 뱀에게 물린 데서 기적적으로 구원받게 하십니다:</p><blockquote><p>“여호와께서 모세에게 이르시되 <strong>불뱀을 만들어</strong> 장대 위에 매달아라 물린 자마다 그것을 보면 살리라” (<a href="https://bibleox.com/ko/ko-nkrv/chis/21/#L8">민 21:8</a>)</p></blockquote><p>매우 중요한 것은 이 뱀이 예수 그리스도의 형상이었고 그분의 장차 있을 십자가 고난을 가리켰다는 점입니다:</p><blockquote><p>“<strong>모세가 광야에서 뱀을 든 것 같이 인자도 들려야 하리니</strong> 이는 그를 믿는 자마다 영생을 얻게 하려 하심이니라” (<a href="https://bibleox.com/ko/ko-nkrv/in/3/#L14-15">요 3:14-15</a>)</p></blockquote><p>나중에 이스라엘 사람들이 뱀 자체를 신으로 여기며 참 하느님과 아무 상관 없는 거짓 이름(느후스단)을 붙이자 히스기야 왕이 이 뱀을 없앴습니다. 그들은 참 하느님을 버리고 둘째 계명을 어겼습니다:</p><blockquote><p>“그가 여러 산당들을 제거하며 주상을 깨뜨리며 아세라 목상을 찍으며 <strong><mark>모세가 만들었던 놋뱀을 이스라엘 자손이 이때까지 향하여 분향하므로</mark></strong> 그것을 부수고 느후스단이라 일컬었더라” (<a href="https://bibleox.com/ko/ko-nkrv/4ts/18/#L4">왕하 18:4</a>)</p></blockquote><h3>형상에 절하지 말라</h3><p>형상에 절하는 것이 금지되었는데도 의인들은 사람과 여러 사물과 천사에게 늘 절하고, 다른 사람들은 예언자에게 절합니다. 아무도 그들을 우상 숭배로 단죄하지 않습니다. 이 절은 거짓 신(우상)에게 드리는 것이 아니기 때문입니다.</p><h4>천사의 모습으로 나타나신 하느님께 드리는 절</h4><p>아브라함은 세 사람의 모습으로 나타나신 하느님께 절합니다:</p><blockquote><p>“<strong>여호와께서</strong> 마므레의 상수리나무들이 있는 곳에서 <strong>아브라함에게 나타나시니라</strong> 날이 뜨거울 때에 그가 장막 문에 앉아 있다가 눈을 들어 본즉 <strong>사람 셋이</strong> 맞은편에 서 있는지라 그가 그들을 보자 곧 장막 문에서 달려나가 영접하며 <strong>몸을 땅에 굽혀</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gen/18/#L1-2">창 18:1-2</a>)</p></blockquote><p>하느님께서는 왜 형상으로 나타나셨습니까? 하느님은 본성상 보이지 않으시고 아무도 그분을 본 적이 없기 때문입니다(<a href="https://bibleox.com/ko/ko-nkrv/1tim/6/#L16">딤전 6:16</a>; <a href="https://bibleox.com/ko/ko-nkrv/in/1/#L18">요 1:18</a>).</p><h4>천사에게 드리는 절</h4><p>먼저 천사는 영이고(<a href="https://bibleox.com/ko/ko-nkrv/evr/1/#L13-14">히 1:13-14</a>) 영에게는 살과 뼈가 없음을(<a href="https://bibleox.com/ko/ko-nkrv/lk/24/#L39">눅 24:39</a>) 짚어 두어야 합니다. 곧 천사도 사람의 모습으로 사람들에게 나타납니다. 그러므로 천사에게 절하는 사람은 <strong>보이지 않는 영(천사)의 보이는 형상에 절하는</strong> 것입니다:</p><blockquote><p>“그가 이르되 아니라 나는 여호와의 군대 대장으로 지금 왔느니라 하는지라 여호수아가 <strong>얼굴을 땅에 대고 엎드려 절하고</strong> 그에게 이르되 내 주여 종에게 무슨 말씀을 하려 하시나이까” (<a href="https://bibleox.com/ko/ko-nkrv/nav/5/#L14">수 5:14</a>)</p></blockquote><h4>예언자에게 드리는 절</h4><blockquote><p>“맞은편 여리고에 있는 선지자의 제자들이 그를 보며 말하기를 엘리야의 성령이 하시는 역사가 엘리사 위에 머물렀다 하고 가서 그에게로 나아가 <strong>땅에 엎드려 그에게 경배하고</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/4ts/2/#L15">왕하 2:15</a>)</p></blockquote><h4>성전을 향한 절</h4><p>다윗은 그 자체로 하늘의 이콘이고(<a href="https://bibleox.com/ko/ko-nkrv/lev/19/#L30">레 19:30</a>; <a href="https://bibleox.com/ko/ko-nkrv/lev/26/#L2">레 26:2</a>) 거룩한 천사들의 형상으로 가득한(<a href="https://bibleox.com/ko/ko-nkrv/ish/25/#L1">출 25:1</a>; <a href="https://bibleox.com/ko/ko-nkrv/ish/26/#L1">출 26:1</a>) 성전을 향해 절했습니다:</p><blockquote><p>“오직 나는 주의 풍성한 사랑을 힘입어 주의 집에 들어가 주를 경외함으로 <strong>성전을 향하여 예배하리이다</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ps/5/#L7">시 5:7</a>)</p></blockquote><p>또 하느님께서는 성전을 공경하라고 명하셨습니다(<a href="https://bibleox.com/ko/ko-nkrv/lev/19/#L30">레 19:30</a>; <a href="https://bibleox.com/ko/ko-nkrv/lev/26/#L2">레 26:2</a>).</p><h4>하느님의 발판(성전)에 드리는 절</h4><blockquote><p>“너희는 여호와 우리 하나님을 높여 <strong>그의 발등상 앞에서 경배할지어다</strong> <strong>그는 거룩하시도다</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ps/99/#L5">시 99:5</a>)</p></blockquote><blockquote><p>“우리가 <strong>그의 계신 곳으로 들어가서 그의 발등상 앞에서 엎드려 예배하리로다</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ps/132/#L7">시 132:7</a>)</p></blockquote><h4>궤 앞의 절</h4><p>눈의 아들 여호수아는 거룩한 그룹 상이 있는 계약궤 앞에 엎드렸습니다:</p><blockquote><p>“여호수아가 옷을 찢고 이스라엘 장로들과 함께 <strong>여호와의 궤 앞에서 땅에 엎드려</strong> 머리에 티끌을 뒤집어쓰고 저물도록 있다가” (<a href="https://bibleox.com/ko/ko-nkrv/nav/7/#L6">수 7:6</a>)</p></blockquote><h4>지팡이에 드리는 절</h4><blockquote><p>“야곱이 또 이르되 내게 맹세하라 하매 그가 맹세하니 <strong>이스라엘이 침상 머리에서 하나님께 경배하니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gen/47/#L31">창 47:31</a>; <a href="https://bibleox.com/ko/ko-nkrv/evr/11/#L21">히 11:21</a>) <em>(칠십인역에는 “지팡이 끝에”(προσεκύνησεν Ισραηλ ἐπὶ τὸ ἄκρον τῆς ῥάβδου αὐτοῦ)로 되어 있습니다. 히브리서 11:21도 같습니다.)</em></p></blockquote><p>더 많은 예: <a href="https://bibleox.com/ru/ru/w/поклоны">절</a>.</p><h3>이교의 우상 신앙은 둘째 계명을 어깁니다</h3><p>이교의 우상 신앙은 어떤 경우든 존재하지 않는 거짓 신을 숭배하게 하므로 둘째 계명을 어기게 합니다. 몰록, 바알, 제우스, 유피테르, 페룬은 존재하지 않습니다. 그들은 거짓 신입니다.</p><p>이교의 우상 신앙은 세 종류이며, 가장 널리 퍼진 것부터 말하면 다음과 같습니다:</p><ol><li><p><strong>우상이 곧 신입니다.</strong> 이교도가 만든 물건(우상) 자체가 신입니다.</p></li><li><p><strong>우상은 거짓 신의 형상입니다.</strong> 그 신은 멀리 있지만 이렇게 생겼다고 여깁니다.</p></li><li><p><strong>우상은 (신격화된) 자연 현상의 지어낸 형상입니다.</strong> 바다, 바람, 비, 불, 땅입니다.</p></li></ol><p>세 경우 모두 존재하지 않는 거짓 신을 공경합니다. 이것은 거짓에 대한 믿음입니다.</p><p>성경에서 만나는 것은 첫째 종류입니다. 성경에 묘사된 가장 흔한 이교 신앙은 물건 자체(물질)의 신격화입니다. 이교도는 손에 있는 재료로 신을 만들거나, 동물, 나무, 돌, 산, 해, 별, 바람, 바다, 뇌우 같은 자연물이나 현상을 신격화했습니다. 예언자들은 이교도가 나무 한쪽으로 음식을 만들고 같은 나무의 다른 쪽을 신이라 부른다고 우상 숭배를 고발합니다:</p><blockquote><p>“그는 자기를 위하여 <strong>백향목을 베며 디르사 나무와 상수리나무를 취하며</strong> 숲의 나무들 가운데에서 자기를 위하여 한 나무를 정하며 나무를 심고 비를 맞고 자라게도 하느니라 <strong><mark>이 나무는 사람이 땔감을 삼는 것이거늘 그가 그것을 가지고 자기 몸을 덥게도 하고 불을 피워 떡을 굽기도 하고 신상을 만들어 경배하며 우상을 만들고 그 앞에 엎드리기도 하는구나</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/is/44/#L14-15">사 44:14-15</a>)</p></blockquote><blockquote><p>“그 때에 라반이 양털을 깎으러 갔으므로 라헬은 <strong>그의 아버지의 드라빔을 도둑질하고</strong> &lt;…&gt; 이제 네가 네 아버지 집을 사모하여 돌아가려는 것은 옳거니와 <strong><mark>어찌 내 신을 도둑질하였느냐</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gen/31/#L19,30">창 31:19,30</a>)</p></blockquote><blockquote><p>“또 어떤 이는 항해를 떠나며 <strong>자기를 태운 배보다 더 썩은 나무를 부른다</strong>. … 그 뒤 불경한 관습이 굳어져 법처럼 지켜졌고, <strong>새긴 상들이 숭배되었다</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/prs/14/#L1,16">지혜 14:1,16</a>, 그리스어에서 번역)</p></blockquote><blockquote><p>“왕이 말했다. <strong><mark>‘너는 벨이 살아 있는 신이라고 생각하지 않느냐? 그가 날마다 얼마나 먹고 마시는지 보지 못하느냐?’</mark></strong>” (벨과 용, 다니 14:6; 러시아 시노달 번역에서 옮김)</p></blockquote><blockquote><p>“우상에게 맏물이 무슨 소용이 있는가? <strong>그것은 먹지도 냄새를 맡지도 못한다</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/prsir/30/#L19">집회 30:19</a>, 그리스어에서 번역)</p></blockquote><blockquote><p>“즉 데메드리오라 하는 어떤 은장색이 은으로 아데미의 신상 모형을 만들어 직공들에게 적지 않은 벌이를 하게 하더니 그가 그 직공들과 그러한 영업하는 자들을 모아 이르되 여러분도 알거니와 우리의 풍족한 생활이 이 생업에 있는데 이 바울이 에베소뿐 아니라 거의 전 아시아를 통하여 수많은 사람을 권유하여 말하되 <strong><mark>사람의 손으로 만든 것들은 신이 아니라</mark></strong> 하니 이는 그대들도 보고 들은 것이라 <strong>우리의 이 영업이 천하여질 위험이</strong> 있을 뿐 아니라 큰 여신 아데미의 신전도 무시 당하게 되고 온 아시아와 천하가 위하는 그의 위엄도 떨어질까 하노라 하더라” (<a href="https://bibleox.com/ko/ko-nkrv/act/19/#L24-27">행 19:24-27</a>)</p></blockquote><p>성경의 비슷한 다른 대목: <a href="https://bibleox.com/ru/ru/w/языческая-вера-в-идола">이교의 우상 신앙</a>.</p><p>생각하는 사람들인 고대 철학자들은 이교 신앙을 변호하면서 사람의 손으로 가공한 물질이 신일 수 없음을 깨달았습니다. 그들은 그것이 신의 형상이거나 자연 현상의 지어낸 형상일 뿐이라는 등의 판단을 내놓았습니다. 그러나 둘째 계명은 여전히 깨집니다. 그들은 참 하느님이 아니라 <strong>거짓 신</strong>을 숭배하기 때문입니다.</p><p>이교의 신은 이름이나 형상 때문만이 아니라 거짓입니다. 신에 관한 거짓은 신의 수, 능력, 본질적 속성, 그리고 가장 중요하게는 계명에 드러난 피조물에 대한 하느님의 뜻에서도 나타납니다.</p><p>분명히 하기 위해 항목별로 비교해 봅시다.</p><h4>이교의 신들</h4><ul><li><p>거짓 이름(몰록, 바알, 제우스, 페룬 등),</p></li><li><p>거짓 모습(여러 사람 같은 형상),</p></li><li><p>거짓 능력(제한적이며, 많은 이교 신의 능력이 저마다 다릅니다),</p></li><li><p>거짓 뜻(참 하느님께서 계명으로 나타내신 뜻이 아닙니다),</p></li><li><p>거짓된 본질적 속성(영원하지도, 어디에나 있지도, 모든 것을 알지도, 무한하지도, 불사도, 거룩하지도 않습니다),</p></li><li><p>다른 곳(거짓된 곳)으로, 다른 길(거짓된 길)로 부릅니다.</p></li></ul><h4>정교회가 믿는 하느님</h4><ul><li><p>성경에 나오는 참 하느님의 이름(계시는 분, 아버지, 아들, 성령, 예수 그리스도와 <a href="https://bibleox.com/ru/ru/w/Бог-имена">다른 이름들</a>);</p></li><li><p>그분이 친히 세상에 드러내신 형상(아브라함에게 나타난 세 천사 — <a href="https://bibleox.com/ko/ko-nkrv/gen/18/#L1-2">창 18:1-2</a>, 비둘기 — <a href="https://bibleox.com/ko/ko-nkrv/lk/3/#L22">눅 3:22</a>, 끝으로 하느님의 아들께서 참으로 되신 사람의 모습 — 예수 그리스도);</p></li><li><p>우주의 전능하신 창조주를 나타냅니다;</p></li><li><p>하느님의 계명을 지키라고 부르시는 분입니다(그리스도께서는 당신의 계명이 적힌 펼친 책을 드신 모습으로 그려집니다);</p></li><li><p>십자가의 길을 통해 당신과 함께하는 삶으로 부르시는 하느님을 나타냅니다(그리스도께서는 십자 모양 후광과 함께 십자가에 달린 모습으로 그려집니다).</p></li></ul><p>이처럼 이교도는 형상을 신이나 (거짓) 신의 형상으로 여기지만, 정교회는 참 하느님을 나타내며 물건 자체(이콘)를 신으로 여기지 않습니다.</p><p>정교회는 하느님의 벗들, 곧 하느님의 어머니 동정 마리아, 천사들, 사도들, 의인들도 나타냅니다. 이것은 거짓이 아닙니다. 그들은 모두 실제로 존재합니다. 이 거룩한 사람들과 천사들 자신도, 그들의 형상도 신으로 여겨지지 않습니다.</p><p>정교회의 모든 이콘은 복음서와 십자가처럼 성물로서 공경받습니다. 그 공경은 참 하느님과 그분의 실제로 존재하는 벗들에게 돌아갑니다.</p><h3>둘째 계명의 이유</h3><p>이처럼 하느님께서는 성인들의 형상을 만드는 것을 금하지 않으셨을 뿐 아니라 만들라고 명하셨지만(<a href="https://bibleox.com/ko/ko-nkrv/ish/25/#L1">출 25:1</a>; <a href="https://bibleox.com/ko/ko-nkrv/ish/26/#L1">출 26:1</a>), 둘째 계명으로 당신의 형상을 만드는 것은 금하셨습니다. 그분은 금지의 이유를 설명하십니다. 율법을 주실 때 하느님께서는 <strong>당신의</strong> 어떤 형상도 드러내지 않으셨습니다. 이스라엘 사람들이 <strong>그분을</strong> 나타내려 하다가 유일한 참 하느님 대신 형상과 조각(상) 자체를 신으로 섬기지 않게 하시려는 것입니다:</p><blockquote><p>“여호와께서 호렙 산 불길 중에서 너희에게 말씀하시던 날에 <strong><mark>너희가 어떤 형상도 보지 못하였은즉</mark></strong> 너희는 깊이 삼가라 그리하여 스스로 부패하여 자기를 위해 <strong><mark>어떤 형상대로든지 우상을 새겨 만들지 말라</mark></strong> 남자의 형상이든지, 여자의 형상이든지, 땅 위에 있는 어떤 짐승의 형상이든지, 하늘을 나는 날개 가진 어떤 새의 형상이든지, 땅 위에 기는 어떤 곤충의 형상이든지, 땅 아래 물 속에 있는 어떤 어족의 형상이든지 만들지 말라 또 그리하여 네가 하늘을 향하여 눈을 들어 해와 달과 별들, 하늘 위의 모든 천체 곧 너희의 하나님 여호와께서 천하 만민을 위하여 배정하신 것을 보고 <strong><mark>미혹하여 그것에 경배하며 섬기지 말라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/vtor/4/#L15-19">신 4:15-19</a>)</p></blockquote><p>이 경고에는 충분한 근거가 있었습니다. 당시 온 지구는 이교였고 그런 우상을 숭배했기 때문입니다. 오늘날에는 이교도가 자기 손으로 만든 물건을 글자 그대로 신으로 여겼다는 것을 설명해야 할 정도입니다.</p><h2>그리스도께서 오시면서 변화가 일어납니다</h2><h3>1. 옛 계약과 모세의 율법이 끝납니다</h3><blockquote><p>“이제는 <strong>우리가 얽매였던 것에 대하여 죽었으므로 율법에서 벗어났으니</strong> 이러므로 우리가 영의 새로운 것으로 섬길 것이요 율법 조문의 묵은 것으로 아니할지니라” (<a href="https://bibleox.com/ko/ko-nkrv/rim/7/#L6">롬 7:6</a>)</p></blockquote><blockquote><p>“이같이 <strong>율법이 우리를 그리스도께로 인도하는 초등교사가 되어</strong> 우리로 하여금 믿음으로 말미암아 의롭다 함을 얻게 하려 함이라 믿음이 온 후로는 <strong>우리가 초등교사 아래에 있지 아니하도다</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gal/3/#L24-25">갈 3:24-25</a>)</p></blockquote><blockquote><p>“그는 우리의 화평이신지라 둘로 하나를 만드사 원수 된 것 곧 중간에 막힌 담을 자기 육체로 허시고 <strong>법조문으로 된 계명의 율법을 폐하셨으니</strong> 이는 이 둘로 자기 안에서 한 새 사람을 지어 화평하게 하시고” (<a href="https://bibleox.com/ko/ko-nkrv/ef/2/#L14-15">엡 2:14-15</a>)</p></blockquote><p><strong>그리스도께서는 새 계약을 맺으시어 모세의 율법이 있는 옛 계약을 끝내십니다</strong>(<a href="https://bibleox.com/ko/ko-nkrv/rim/7/#L6">롬 7:6</a>; <a href="https://bibleox.com/ko/ko-nkrv/gal/3/#L21-25">갈 3:21-25</a>; <a href="https://bibleox.com/ko/ko-nkrv/ef/2/#L14-16">엡 2:14-16</a>). 하느님을 나타내지 말라는 금지는 그리스도께서 오시며 폐지된 모세 율법의 일부였습니다(<a href="https://bibleox.com/ru/ru/w/Библия-Закон-Моисея-отмена">자세히</a>). 하느님께서 모세를 통해 주신 계명들은 글자 그대로의 뜻을 잃습니다. 우리는 안식일의 쉼을 지키지 않고(안식일을 어긴 사람을 죽이지도 않고), 짐승을 제물로 바치지 않고, 할례를 받지 않고, 유대인의 명절을 지키지 않고, 십일조를 내지 않으며, 모세 율법의 다른 수많은 명령을 지키지 않습니다. 옛 계약과 모세의 율법은 그 자체로 폐지되었고, 신약의 믿는 이들은 문자가 아니라 영의 봉사자로 부름받았습니다(<a href="https://bibleox.com/ko/ko-nkrv/2kor/3/#L6">고후 3:6</a>). 곧 이런저런 하느님의 제도의 이유를 이해하고, 그 뜻을 깨달아 계명의 본질을 지켜야 합니다.</p><p>둘째 계명의 글자 그대로의 뜻은 하느님만을 나타내지 말라는 것이었고, 그분의 거룩한 종들은 금하지 않았습니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/25/#L1">출 25:1</a>; <a href="https://bibleox.com/ko/ko-nkrv/ish/26/#L1">출 26:1</a>).</p><p>둘째 계명의 본질은 <strong>거짓 신을 숭배하지 말라</strong>는 것입니다.</p><p>따라서 정교회는 성인들을 나타냅니다. 이것은 금지된 적이 없고 오히려 명령되었으며(<a href="https://bibleox.com/ko/ko-nkrv/ish/25/#L1">출 25:1</a>; <a href="https://bibleox.com/ko/ko-nkrv/ish/26/#L1">출 26:1</a>), 의인들은 그 형상 앞에 절했습니다(<a href="https://bibleox.com/ko/ko-nkrv/nav/7/#L6">수 7:6</a>; <a href="https://bibleox.com/ko/ko-nkrv/ps/5/#L7">시 5:7</a>). 반면 하느님을 나타내는 것은 아무도 하느님을 보지 못했기 때문에 구약에서만 모세의 율법으로 금지되었습니다. 모세의 율법이 폐지되었으므로, 그 일부인 하느님을 나타내지 말라는 금지도 폐지되었습니다.</p><h3>2. 하느님께서 인성을 취하시어(사람이 되시어) 보이게 되셨습니다</h3><p>구약에서 하느님께서는 백성이 율법을 받을 때 당신의 형상을 드러내지 않으셨다고 설명하시며 당신을 나타내는 것을 금하십니다(<a href="https://bibleox.com/ko/ko-nkrv/vtor/4/#L15-19">신 4:15-19</a>). 그러나 새 계약을 맺으시고 새 가르침을 주시며(<a href="https://bibleox.com/ko/ko-nkrv/ef/2/#L15">엡 2:15</a>) 하느님께서는 인성 안에서 보이게 되시어 당신을 드러내시고 모세의 율법을 폐지하셨습니다. 그러므로 이제는 성인들만이 아니라 하느님 자신도 그분이 드러내신 모습으로 나타낼 수 있습니다:</p><blockquote><p>“<strong>본래 하나님을 본 사람이 없으되</strong> 아버지 품 속에 있는 <strong>독생하신 하나님</strong>이 <strong>나타내셨느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/in/1/#L18">요 1:18</a>)</p></blockquote><blockquote><p>“태초부터 있는 생명의 말씀에 관하여는 우리가 들은 바요 <strong>눈으로 본 바요 자세히 보고 우리의 손으로 만진 바라</strong> 이 생명이 나타내신 바 된지라 이 영원한 생명을 우리가 보았고 증언하여 너희에게 전하노니 이는 <strong>아버지와 함께 계시다가 우리에게 나타내신 바 된 이시니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1in/1/#L1-2">요일 1:1-2</a>)</p></blockquote><h3>3. 천상 실재가 달라집니다</h3><p>성전은 지상의 건물이지만 하느님의 뜻에 따라 처음부터 천상 실재의 형상이었습니다. 하느님께서 예언자 모세에게 성전을 지으라고 명하신 것은 성전이 필요해서가 아니라(필요하지 않습니다: <a href="https://bibleox.com/ko/ko-nkrv/is/66/#L1">사 66:1</a>; <a href="https://bibleox.com/ko/ko-nkrv/ps/50/#L13">시 50:13</a>; <a href="https://bibleox.com/ko/ko-nkrv/is/1/#L11">사 1:11</a>), 바로 하늘의 이콘으로서, 예언자에게 보여 주신 천상 실재의 형상으로서 짓게 하신 것입니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/25/#L8-9,40">출 25:8-9,40</a>; <a href="https://bibleox.com/ko/ko-nkrv/evr/9/#L24">히 9:24</a>). 구약의 천상 실재와 신약의 천상 실재는 다릅니다. 전에는 <strong>천사들만</strong> 천상 실재에 영적으로 보이게 머물렀습니다. 하느님은 완전히 물질이 아니시고 보이지 않으시며(하느님의 아들께서 아직 보이는 인성을 취하지 않으셨습니다), 사람들은 아직 하늘의 삶에 이르지 못하고 죽은 뒤 저승으로 내려갔습니다(<a href="https://bibleox.com/ru/ru/w/9VFT_До_жертвы_Христовой_ветхозаветные_праведники_сходили_в_ад">자세히</a>).</p><p>그러나 그리스도께서 오신 뒤 변화가 일어납니다:</p><ol><li><p><strong>하느님이신 그리스도께서 하늘에서 보이게 왕좌에 앉으셨습니다</strong>(<a href="https://bibleox.com/ko/ko-nkrv/ef/1/#L20-21">엡 1:20-21</a>; <a href="https://bibleox.com/ko/ko-nkrv/otkr/3/#L21">계 3:21</a>);</p></li><li><p><strong>(그리스도 외에도) 사람들이 하늘에 나타났습니다.</strong> 하늘에서 그리스도와 함께하는 삶에 이를 수 있게 되었습니다(<a href="https://bibleox.com/ko/ko-nkrv/otkr/6/#L9-11">계 6:9-11</a>; <a href="https://bibleox.com/ko/ko-nkrv/otkr/14/#L1,3-5">계 14:1,3-5</a>; <a href="https://bibleox.com/ko/ko-nkrv/evr/12/#L22-24">히 12:22-24</a>).</p></li></ol><p>천상 실재가 달라졌습니다. 이전의 것은 이제 없습니다. 예루살렘 성전은 현재가 아닌 과거의 천상 실재의 형상이 되었습니다. 그래서 그리스도인들은 아주 오래전부터 새 천상 실재를 나타내어, 모든 것의 머리에 하늘에서 드러나게 왕좌에 앉으신 예수 그리스도(하느님)의 형상을 두고, 그 둘레에 이제 사람들도 포함한 그분의 거룩한 종들을 둡니다.</p><p>상징적인 사건은 그리스도의 희생 뒤에 예루살렘 성전에 일어난 손상입니다:</p><blockquote><p>“이에 <strong>성소 휘장이 위로부터 아래까지 찢어져 둘이 되고 땅이 진동하며 바위가 터지고</strong> 무덤들이 열리며 <strong>자던 성도의 몸이 많이 일어나되 예수의 부활 후에 그들이 무덤에서 나와서</strong> 거룩한 성에 들어가 많은 사람에게 보이니라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/27/#L51-53">마 27:51-53</a>)</p></blockquote><p>70년대에 성전은 로마인들에게 완전히 파괴되어, 그 뒤 수천 년 동안 새로운 천상 실재의 형상, 곧 정교회 성당에 자리를 내주었습니다.</p><img src="https://res.bibleox.com/s/img/image/simple/686bea5b5f47da2505d3ae31/s_p_pjRHeoFaUpKPoyEH.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686bea5b5f47da2505d3ae31/m_p_pjRHeoFaUpKPoyEH.jpg">크게 보기</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686cf7375f47da2505d3ae4f/m_p_MOsOWI2vEXUj5ELf.jpg">다른 그림</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686d23425f47da2505d3ae55/s_p_LzqgbhnIsbqtghoc.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d23425f47da2505d3ae55/m_p_LzqgbhnIsbqtghoc.jpg">크게 보기</a>]</p><p>더 많은 고대 이콘: <a href="https://bibleox.com/ru/ru/w/древние-иконы">고대 이콘</a>.</p><h2>하느님께서 당신의 이콘을 만드셨습니다</h2><p>아무도 하느님을 본 적이 없습니다:</p><blockquote><p>“<strong><mark>본래 하나님을 본 사람이 없으되</mark></strong> 아버지 품 속에 있는 독생하신 하나님이 나타내셨느니라” (<a href="https://bibleox.com/ko/ko-nkrv/in/1/#L18">요 1:18</a>)</p></blockquote><p>그럼에도 하느님께서는 여러 번 형상(이콘)의 모습으로 나타나셨습니다:</p><h3>하느님께서는 세 천사의 모습으로 아브라함에게 나타나셨습니다</h3><p>세 천사는 하느님의 실제 모습, 세상 창조 전부터 그러하신 모습이 아닙니다. 곧 이것은 하느님의 <strong>형상</strong>(그리스어 εἰκόνα, 이콘)이며, 아브라함은 하느님의 이콘 앞에 절합니다:</p><blockquote><p>“<strong>여호와께서</strong> 마므레의 상수리나무들이 있는 곳에서 <strong>아브라함에게 나타나시니라</strong> 날이 뜨거울 때에 그가 장막 문에 앉아 있다가 눈을 들어 본즉 <strong>사람 셋이</strong> 맞은편에 서 있는지라 그가 그들을 보자 곧 장막 문에서 달려나가 영접하며 <strong>몸을 땅에 굽혀</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gen/18/#L1-2">창 18:1-2</a>)</p></blockquote><p>아브라함이 세 천사의 모습으로 나타나신 하느님의 형상에 절했을 때, 하느님을 섬겼습니까, 하느님의 형상을 섬겼습니까? 분명히 하느님을 섬겼습니다.</p><h3>하느님께서는 보이게 야곱과 씨름하셨습니다</h3><blockquote><p>“야곱은 홀로 남았더니 어떤 사람이 날이 새도록 야곱과 씨름하다가 &lt;…&gt; 그가 이르되 네 이름을 다시는 야곱이라 부를 것이 아니요 이스라엘이라 부를 것이니 이는 <strong>네가 하나님과 및 사람들과 겨루어 이겼음이니라</strong> &lt;…&gt; 그러므로 야곱이 그 곳 이름을 브니엘이라 하였으니 그가 이르기를 <strong>내가 하나님과 대면하여 보았으나 내 생명이 보전되었다</strong> 함이더라” (<a href="https://bibleox.com/ko/ko-nkrv/gen/32/#L24,28,30">창 32:24,28,30</a>)</p></blockquote><h3>하느님께서는 형상을 통해 예언자 모세와 말씀하셨습니다</h3><blockquote><p>“이르시되 내 말을 들으라 <strong>너희 중에 선지자가 있으면 나 여호와가 환상으로 나를 그에게 알리기도 하고</strong> 꿈으로 그와 말하기도 하거니와 <strong>내 종 모세와는 그렇지 아니하니</strong> 그는 내 온 집에 충성함이라 <strong>그와는 내가 대면하여 명백히 말하고 은밀한 말로 하지 아니하며 그는 또 여호와의 형상을 보거늘</strong> 너희가 어찌하여 내 종 모세 비방하기를 두려워하지 아니하느냐” (<a href="https://bibleox.com/ko/ko-nkrv/chis/12/#L6-8">민 12:6-8</a>)</p></blockquote><h3>하느님께서는 비둘기처럼 예수 그리스도 위에 내려오셨습니다</h3><blockquote><p>“<strong>성령이 비둘기 같은 형체로 그의 위에 강림하시더니</strong> 하늘로부터 소리가 나기를 너는 내 사랑하는 아들이라 내가 너를 기뻐하노라 하시니라” (<a href="https://bibleox.com/ko/ko-nkrv/lk/3/#L22">눅 3:22</a>; <a href="https://bibleox.com/ko/ko-nkrv/mf/3/#L16">마 3:16</a>; <a href="https://bibleox.com/ko/ko-nkrv/mk/1/#L10">막 1:10</a>; <a href="https://bibleox.com/ko/ko-nkrv/in/1/#L32">요 1:32</a>)</p></blockquote><h3>사람은 하느님의 이콘입니다</h3><blockquote><p>“<strong>하나님이 자기 형상 곧 하나님의 형상대로 사람을 창조하시되</strong> 남자와 여자를 창조하시고” (<a href="https://bibleox.com/ko/ko-nkrv/gen/1/#L27">창 1:27</a>) <em>(“형상”은 칠십인역 그리스어로 εἰκών, “이콘”입니다.)</em></p></blockquote><blockquote><p>“이것은 아담의 계보를 적은 책이니라 하나님이 사람을 창조하실 때에 <strong>하나님의 모양대로 지으시되</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gen/5/#L1">창 5:1</a>) <em>(칠십인역: εἰκόνα)</em></p></blockquote><blockquote><p>“다른 사람의 피를 흘리면 그 사람의 피도 흘릴 것이니 이는 <strong>하나님이 자기 형상대로 사람을 지으셨음이니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gen/9/#L6">창 9:6</a>) <em>(칠십인역: εἰκόνι)</em></p></blockquote><blockquote><p>“하느님께서는 사람을 불멸하도록 창조하시고 <strong>당신 영원성의 형상(εἰκόνα)으로</strong> 만드셨다” (<a href="https://bibleox.com/ko/gr-lxx-byz/prs/2/#L23">지혜 2:23</a>, 그리스어에서 번역)</p></blockquote><h2>예수 그리스도는 아버지 하느님의 형상(이콘)이십니다</h2><blockquote><p>“너희 안에 이 마음을 품으라 곧 그리스도 예수의 마음이니 <strong>그는 근본 하나님의 본체시나</strong> 하나님과 동등됨을 취할 것으로 여기지 아니하시고” (<a href="https://bibleox.com/ko/ko-nkrv/fil/2/#L5-6">빌 2:5-6</a>) <em>(그리스어: ἐν μορφῇ θεοῦ, “하느님의 모습으로”)</em></p></blockquote><blockquote><p>“이는 <strong>하나님의 영광의 광채시요 그 본체의 형상이시라</strong> 그의 능력의 말씀으로 만물을 붙드시며 죄를 정결하게 하는 일을 하시고 높은 곳에 계신 지극히 크신 이의 우편에 앉으셨느니라” (<a href="https://bibleox.com/ko/ko-nkrv/evr/1/#L3">히 1:3</a>)</p></blockquote><blockquote><p>“그 중에 이 세상의 신이 믿지 아니하는 자들의 마음을 혼미하게 하여 그리스도의 영광의 복음의 광채가 비치지 못하게 함이니 <strong>그리스도는 하나님의 형상이니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2kor/4/#L4">고후 4:4</a>) <em>(“형상”: εἰκών)</em></p></blockquote><blockquote><p>“우리로 하여금 빛 가운데서 성도의 기업의 부분을 얻기에 합당하게 하신 아버지께 감사하게 하시기를 원하노라 그가 우리를 흑암의 권세에서 건져내사 <strong>그의 사랑의 아들</strong>의 나라로 옮기셨으니 그 아들 안에서 우리가 속량 곧 죄 사함을 얻었도다 <strong>그는 보이지 아니하는 하나님의 형상이시요</strong> 모든 피조물보다 먼저 나신 이시니” (<a href="https://bibleox.com/ko/ko-nkrv/kol/1/#L12-15">골 1:12-15</a>) <em>(“형상”: εἰκών)</em></p></blockquote><blockquote><p>“빌립이 이르되 주여 <strong>아버지를 우리에게 보여 주옵소서</strong> 그리하면 족하겠나이다 예수께서 이르시되 빌립아 내가 이렇게 오래 너희와 함께 있으되 네가 나를 알지 못하느냐 <strong>나를 본 자는 아버지를 보았거늘</strong> 어찌하여 아버지를 보이라 하느냐” (<a href="https://bibleox.com/ko/ko-nkrv/in/14/#L8-9">요 14:8-9</a>)</p></blockquote><h3>아버지의 형상을 공경하지 않는 사람은 아버지를 공경하지 않습니다</h3><blockquote><p>“이는 모든 사람으로 아버지를 공경하는 것 같이 아들을 공경하게 하려 하심이라 <strong>아들을 공경하지 아니하는 자는 그를 보내신 아버지도 공경하지 아니하느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/in/5/#L23">요 5:23</a>)</p></blockquote><h3>아버지의 형상을 거부하는 사람에게는 아버지가 없습니다</h3><blockquote><p>“<strong>아들을 부인하는 자에게는 또한 아버지가 없으되</strong> 아들을 시인하는 자에게는 아버지도 있느니라” (<a href="https://bibleox.com/ko/ko-nkrv/1in/2/#L23">요일 2:23</a>)</p></blockquote><h3>아버지의 형상을 미워하는 사람은 아버지를 미워합니다</h3><blockquote><p>“<strong>나를 미워하는 자는 또 내 아버지를 미워하느니라</strong> 내가 아무도 못한 일을 그들 중에서 하지 아니하였더라면 그들에게 죄가 없었으려니와 지금은 그들이 <strong>나와 내 아버지를 보았고 또 미워하였도다</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/in/15/#L23-24">요 15:23-24</a>)</p></blockquote><h3>모든 피조물은 아버지의 형상 앞에 엎드려야 합니다</h3><blockquote><p>“<strong>하늘에 있는 자들과 땅에 있는 자들과 땅 아래에 있는 자들로 모든 무릎을 예수의 이름에 꿇게 하시고</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/fil/2/#L10">빌 2:10</a>)</p></blockquote><h2>하느님께서는 성인의 형상을 통해 치유하십니다</h2><p>하느님께서는 거룩한 사도들이 남긴 옷을 통해서만이 아니라(<a href="https://bibleox.com/ko/ko-nkrv/act/19/#L12">행 19:12</a>) 사도의 형상(그림자)을 통해서도 사람들에게 치유를 주십니다:</p><blockquote><p>“심지어 <strong>병든 사람을 메고 거리에 나가</strong> 침대와 요 위에 누이고 <strong>베드로가 지날 때에 혹 그의 그림자라도 누구에게 덮일까 바라고</strong> 예루살렘 부근의 수많은 사람들도 모여 병든 사람과 더러운 귀신에게 괴로움 받는 사람을 데리고 와서 <strong>다 나음을 얻으니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/act/5/#L15-16">행 5:15-16</a>)</p></blockquote><h2>하느님께서는 우상 숭배자들에게 응답하지 않으십니다</h2><blockquote><p>“이는 이스라엘 족속이 다 <strong>그 우상으로 말미암아 나를 배반하였으므로</strong> 내가 그들이 마음먹은 대로 그들을 잡으려 함이라” (<a href="https://bibleox.com/ko/ko-nkrv/iez/14/#L5">겔 14:5</a>)</p></blockquote><blockquote><p>“너희가 또 너희 아들을 화제로 삼아 불 가운데로 지나게 하며 오늘까지 <strong>너희 자신을 우상들로 말미암아 더럽히느냐</strong> 이스라엘 족속아 너희가 내게 묻기를 내가 용납하겠느냐 주 여호와의 말씀이니라 내가 나의 삶을 두고 맹세하노니 <strong>너희가 내게 묻기를 내가 용납하지 아니하리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/iez/20/#L31">겔 20:31</a>)</p></blockquote><p>그러나 이콘 반대자들은 대개 이콘을 공경하는 정교인들이 하느님과 친교를 나눌 수 있음을 인정합니다. 그런데 성경에는 하느님께서 우상 숭배자들에게 응답하지 않으신다고 기록되어 있습니다.</p><h2>이콘이 구원할 수 있습니까?</h2><p>정교인들은 “이콘이 구원했다”, “이콘이 치유했다”는 표현을 쓴다고 비난을 받습니다. 구원하고 치유하시는 분은 하느님이시며, 우리는 대개 “이콘이 구원했다”고 말하지 않지만, 이콘의 재료 자체가 아니라 하느님께서 그 재료를 통해 치유하고 구원하셨다는 뜻이라면 이런 표현은 허용됩니다.</p><h3>사도가 구원합니다</h3><blockquote><p>“이는 혹 내 골육을 아무쪼록 시기하게 하여 <strong>그들 중에서 얼마를 구원하려 함이라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/rim/11/#L14">롬 11:14</a>)</p></blockquote><blockquote><p>“약한 자들에게 내가 약한 자와 같이 된 것은 약한 자들을 얻고자 함이요 내가 여러 사람에게 여러 모습이 된 것은 <strong>아무쪼록 몇 사람이라도 구원하고자 함이니</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/9/#L22">고전 9:22</a>)</p></blockquote><h3>아내가 구원합니다</h3><blockquote><p>“<strong>아내 된 자여 네가 남편을 구원할는지</strong> 어찌 알 수 있으며 <strong>남편 된 자여 네가 네 아내를 구원할는지</strong> 어찌 알 수 있으리요” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/7/#L16">고전 7:16</a>)</p></blockquote><h3>사람들을 구원하라는 사도의 부름</h3><blockquote><p>“어떤 의심하는 자들을 긍휼히 여기라 또 어떤 자를 <strong>불에서 끌어내어 구원하라</strong> 또 어떤 자를 그 육체로 더럽힌 옷까지도 미워하되 두려움으로 긍휼히 여기라” (<a href="https://bibleox.com/ko/ko-nkrv/iud/1/#L22-23">유 1:22-23</a>)</p></blockquote><blockquote><p>“네가 네 자신과 가르침을 살펴 이 일을 계속하라 이것을 행함으로 <strong>네 자신과 네게 듣는 자를 구원하리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1tim/4/#L16">딤전 4:16</a>)</p></blockquote><h3>그리스도 외에 누가 실제로 구원할 수 있습니까?</h3><p>사도도 아내와 남편도 주 예수 그리스도께서 구세주이신 뜻, 곧 인류의 유일한 구속자이자 죽음과 지옥에서 건지시는 분이며 부활과 하느님과 함께하는 영원한 삶을 주시는 분이라는 뜻의 구원자가 아닙니다. 그러나 보다시피 사도들은 “구원하겠다”는 표현을 씁니다. 우리는 이런 표현의 뜻을 바르게 이해합니다. 사람들은 구원을 도울 수 있습니다: “우리는 하느님을 위해서 <strong>함께 일하는 일꾼들</strong>이고”(<a href="https://bibleox.com/ko/ko-nkrv/1kor/3/#L9">고전 3:9</a>).</p><p>이콘도 마찬가지입니다. 구원하는 것은 이콘이 아니라 하느님이시며, 하느님께서 물건을 통해 은총을 보내십니다. 성경에는 그런 예가 많으며, 아래에서 살펴보겠습니다.</p><h2>“이콘은 영적 세계를 향한 창”이라는 표현에 관하여</h2><p>이콘은 일종의 <strong>영적 세계를 향한 창</strong>입니다. 이 표현에는 신비로운 뜻이 없고 비유적인 표현입니다. 이콘을 바라보면 마치 창을 통해 보이지 않는 영적 세계를 들여다보는 듯하다는 뜻일 뿐입니다.</p><p>영적인 것은 보이지 않지만 이콘 화가는 상징을 사용해 보이지 않는 것을 보이게 나타냅니다. 예를 들어 성인들에게 있는 하느님의 은총은 머리 둘레의 후광으로 나타내고, 그림자가 없는 것은 하느님의 빛(평범한 빛이 아니며 그림자를 드리우지 않습니다) 안에 머무름을 뜻합니다. 손짓, 옷 색깔, 옷의 특별한 표지(하느님의 어머니의 세 별), 둘레의 사물과 건물과 공간 전체에 뜻이 담겨 있습니다. 이 모든 것을 보며 우리는 보이지 않는 영적 세계에 관해 무언가를 배웁니다. 그래서 이콘은 말하자면 영적 세계를 향한 창이라는 표현을 쓰기도 합니다(<a href="https://monastery.ru/propovedi/okno-v-dukhovnyy-mir/">자세히</a>, 러시아어).</p><p>왜 이것을 따로 설명해야 합니까? 정교회의 반대자들이 비난할 거리를 찾아 그저 비난을 지어내어 추종자들에게 심고 정교회에 대한 증오를 키우는 일을 거듭 보기 때문입니다. 예를 들어 교회의 반대자들은 정교인을 추악한 마술사처럼 묘사하려고, 정교인들이 이콘을 일종의 에너지 통로처럼 삼아 하느님과 연결되고, 그래서 하느님과 소통하려면 이콘이 필요하다는 생각을 지어냅니다. 이 모든 것은 사실이 아닙니다.</p><p>정교회는 이콘이 있든 없든 어디서나 기도하라고 부릅니다. 이콘은 교육과 기도를 돕는 수단일 뿐입니다. 기도할 때 이콘은 생각을 모으게 하여 흩어지거나 산만해지지 않게 돕습니다. 이콘은 또 거기 그려진 분에 대한 존경을 표현하는 수단입니다. 이콘을 포함한 여러 물건은 하느님께서 사람들에게 은총을 주시는 수단이 될 수 있습니다. 이에 관해서는 다음 부분에서 다룹니다.</p><h2>물건과 형상을 통한 하느님의 활동</h2><p>정교인들은 하느님께 직접만이 아니라 물건과 형상을 통해서도 하느님의 도움을 기대한다는 비난을 받습니다. 그러나 이 믿음도 성경에 어긋나지 않습니다. 성경에서 하느님께서는 물건과 형상을 통해 여러 번 활동하셨습니다.</p><h3>유해</h3><p>유해를 통한 부활입니다. 여기에는 누구의 믿음도 기도도 없고, 죽은 사람이 우연히 예언자의 유해에 닿은 일밖에 없습니다:</p><blockquote><p>“마침 <strong>사람을 장사하는 자들이</strong> 그 도적 떼를 보고 그의 시체를 엘리사의 묘실에 들이던지매 <strong><mark>시체가 엘리사의 뼈에 닿자 곧 회생하여 일어섰더라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/4ts/13/#L21">왕하 13:21</a>)</p></blockquote><h3>옷</h3><blockquote><p>“심지어 사람들이 <strong><mark>바울의 몸에서 손수건이나 앞치마를 가져다가 병든 사람에게 얹으면 그 병이 떠나고</mark></strong> 악귀도 나가더라” (<a href="https://bibleox.com/ko/ko-nkrv/act/19/#L12">행 19:12</a>)</p></blockquote><h3>형상</h3><blockquote><p>“심지어 <strong>병든 사람을 메고 거리에 나가</strong> 침대와 요 위에 누이고 <strong>베드로가 지날 때에 혹 그의 그림자라도 누구에게 덮일까 바라고</strong> 예루살렘 부근의 수많은 사람들도 모여 병든 사람과 더러운 귀신에게 괴로움 받는 사람을 데리고 와서 <strong>다 나음을 얻으니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/act/5/#L15-16">행 5:15-16</a>)</p></blockquote><h3>물</h3><blockquote><p>“천사가 가끔 못에 내려와 <strong>물을 움직이게 하는데, 물이 움직인 뒤에 먼저 들어가는 사람은 어떤 병에 걸렸든지 나았다</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/in/5/#L3">요 5:3</a>) <em>(요한복음 5:4. 개역개정에는 이 절이 없고(“없음”), 3절 끝에 “물의 움직임을 기다리니”만 괄호 안에 남아 있습니다. 비잔틴 본문(다수 사본)에서 옮겼습니다.)</em></p></blockquote><h3>그 밖에</h3><p><a href="https://bibleox.com/ru/ru/w/Исцеления">치유</a></p><h2>이콘 공경에 관한 정교회의 가르침</h2><h3>제7차 세계공의회(니케아, 787년) 367 교부의 이콘 공경 교의</h3><blockquote><p>“고백을 짧게 하자면, 우리는 기록으로든 구두로든 우리에게 전해진 모든 교회의 전통을 변함없이 지킵니다. 그 가운데 하나가 <strong>복음 선포의 역사에 맞는 형상을 만드는 일로서, 여러모로 유익한 전통이며, 특히 하느님 말씀의 강생이 환영이 아니라 참된 것임을 보여 줍니다. 이 둘은 서로를 가리키며 분명히 서로의 뜻을 드러냅니다</strong>. 그러므로 우리는 왕의 길을 따르고 거룩한 교부들의 하느님 영감에 따른 권위와 보편 교회의 전통을 따르며(우리가 알듯이 성령께서 교회 안에 머무십니다), 온전한 확신과 정확함으로 정의합니다. <strong><mark>귀하고 생명을 주는 십자가의 형상과 같이, 공경할 만한 거룩한 이콘들도</mark></strong> 그림이나 모자이크나 다른 알맞은 재료로 하느님의 거룩한 성당에, 거룩한 그릇과 제의와 휘장에, 그림으로 집과 길가에 두어야 합니다. 곧 <strong>우리 주 하느님이시며 구세주이신 예수 그리스도와, 티 없으신 우리 부인 하느님의 어머니, 공경할 천사들, 모든 성인과 경건한 이들의 형상입니다</strong>. 이들을 형상으로 자주 볼수록 <strong><mark>사람들은 그만큼 원형을 기억하고 그리워하게 되며, 이들에게 인사와 공경의 절(ἀσπασμὸν καὶ τιμητικὴν προσκύνησιν)을 드려야 합니다. 그러나 오직 하느님의 본성에만 속하는 신앙의 참된 예배(λατρείαν)는 드리지 않습니다</mark></strong>. <strong>귀하고 생명을 주는 십자가의 형상과 복음서와 다른 성물에 하듯이, 옛 경건한 관습에 따라 향과 등불을 바칠 수 있습니다</strong>. <strong><mark>형상에 드리는 영예는 그 형상이 나타내는 분에게 옮아가며, 이콘을 공경하는 사람은 거기 그려진 분을 공경하는 것입니다</mark></strong>. 이렇게 하여 땅끝에서 땅끝까지 복음을 받아들인 보편 교회의 전통, 곧 거룩한 교부들의 가르침이 굳건해집니다.”</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/councils-the-seventh-ecumenical-council-the-second-council-of-nicaea-787/">제7차 세계공의회: 제2차 니케아 공의회(787년)</a>, 영어)</p><h3>콘스탄티노플 총대주교 예레미아(1576년)</h3><blockquote><p>“모든 장의 마지막인 스물한째 장은 성인 공경을 말하며, 성인들이 믿음을 통해 어떻게 하느님의 은총과 도움을 받았는지 생각하면 그들을 기억하는 것이 믿음을 굳건하게 하는 데 유익하다고 합니다. 이에 대해 우리는 말합니다. <strong>부름은 주로 오직 하느님께 합당하며, 으뜸으로 또 고유하게 그분께 속합니다. 성인들에게 드리는 부름은 고유한 뜻이 아니라, 말하자면 부수적으로 은총에 따른 것입니다. 부르는 이들을 듣는 것은 베드로나 바울이 아니라 그들이 지닌 은총이기 때문입니다</strong>. 주님의 말씀대로입니다: “내가 세상 끝날까지 항상 너희와 함께 있겠다”(마태 28:20). … <strong><mark>우리도 엄밀한 뜻에서 부름을 한 분 하느님께 드린다는 것은 거룩한 예배에서 “하늘에 계신 우리 아버지” 등으로 외치는 데서 알 수 있습니다. 또 다른 곳에서는 “만군의 주님, 저희와 함께하소서. 슬픔 중에 주님 외에 다른 도움이 저희에게 없나이다”라고, 또 “주님 외에 다른 하느님을 저희가 알지 못하나이다”라고 합니다. 그러나 우리는 모든 성인, 무엇보다 주님의 어머니와 그분과 함께 천사와 성인의 무리를 중재자로 삼고, 성당과 봉헌과 부름과 거룩한 이콘으로 그들을 관계적으로 공경하며, 예배로 공경하지 않습니다. 예배는 으뜸으로 한 분 하느님께 드려야 하고, 그분 외에 누구도 하느님으로 인정해서는 안 되며, “다른 신”(시편 81:9)에게 절해서는 안 됨을 우리는 압니다</mark></strong>. 우리는 관계적 공경을 통해 신격화에 빠질까 두려워하기보다 차라리 우리 자신이 성인이 되기를 바라지 않겠습니다. 그럴 수는 없습니다. <strong><mark>거룩한 이콘에 관계적으로 절하지 않는 것은 불경하며 그리스도의 교회와 그 자녀들에게 낯선 일이기 때문입니다. 대 바실리오스가 말하듯 이콘에 드리는 영예는 원형에게 옮아갑니다</mark></strong>.”</p></blockquote><p>(<a href="https://azbyka.ru/otechnik/konfessii/otvety-lyuteranam/#0_25">루터교도들에게 보낸 첫째 답변</a>, 러시아어에서 발췌하여 번역)</p><p>이콘 공경을 자세히 살핀 더 긴 답변도 있습니다: <a href="https://azbyka.ru/otechnik/konfessii/otvety-lyuteranam/#0_34">둘째 답변</a> (러시아어).</p><p>짧은 셋째 답변도 있습니다: <a href="https://azbyka.ru/otechnik/konfessii/otvety-lyuteranam/#0_41">셋째 답변</a> (러시아어).</p><h3>정교 신앙에 관한 동방 보편 교회 총대주교들의 서신(1723년)</h3><blockquote><p>“거룩한 이콘과 성인 공경을 어떻게 생각해야 합니까? 앞서 말했듯이 성인들은 전구자이며 보편 교회도 그렇게 인정합니다. 우리는 <strong><mark>그들을 하느님의 벗으로서, 만유의 하느님께 우리를 위해 기도하는 이들로서 공경합니다</mark></strong>. … <strong>우리는 우리 구세주께서 세상을 구원하는 수난을 받으신 귀하고 생명을 주는 십자가의 나무와 생명을 주는 십자가의 표시, 베들레헴의 구유, 해골터, 생명을 주는 무덤과 다른 거룩한 공경의 대상, 그리고 거룩한 복음서와 피 없는 제사를 드리는 거룩한 그릇을 공경합니다</strong>. … <strong>우리는 주 예수 그리스도와 지극히 거룩한 하느님의 어머니와 모든 성인, 또 몇몇 선조와 예언자에게 나타난 대로 거룩한 천사들의 이콘을 공경하고 입 맞춥니다. 또 성령을 나타내기도 합니다</strong>. 비둘기의 모습으로 나타나신 대로입니다. 성인들과 그 이콘과 다른 것들을 공경한다고 우리가 우상 숭배를 한다고 말하는 이들이 있다면 우리는 이를 어리석고 경솔하다고 여깁니다. <strong>우리는 삼위일체 안의 유일한 하느님께만 예배(라트리아)를 드리고 다른 누구에게도 드리지 않습니다</strong>. … <strong><mark>거룩한 이콘은 관계적으로 공경합니다. 그 영예가 원형에게 돌아가기 때문입니다. 이콘을 공경하는 사람은 이콘을 통해 원형을 공경하며, 이콘에 드리는 영예는 그려진 분의 영예와 나뉘거나 떨어지지 않고, 왕의 사절에게 드리는 영예처럼 바로 그분께 드려지는 것입니다</mark></strong>. … <strong>우리는 성경을 읽을 때 때와 사람, 본보기와 이유를 살핍니다. 그래서 하느님께서 한편으로 “너희는 우상이나 어떤 형상도 만들지 말고 그것에 절하지도 섬기지도 말라”(출애 20:4-5; 신명 5:8-9)고 말씀하시고, 다른 한편으로 그룹을 만들라고 명하시는 것(출애 25:18)을 보며</strong> … <strong><mark>우리는 올바른 해석에 이르러, “우상이나 어떤 형상도 만들지 말라”는 말씀이 “다른 신들에게 절하지 말라”(출애 20:4), 곧 “우상을 숭배하지 말라”는 뜻이라고 결론짓습니다</mark></strong>. … <strong><mark>공의회는 이콘에 예배(라트리아)를 드리는 이들과, 이콘을 공경하는 정교인들이 우상 숭배를 한다고 말하는 이들을 모두 파문합니다. 우리도 공의회와 함께 성인이나 천사나 이콘이나 십자가나 성인 유해나 거룩한 그릇이나 복음서나 위로 하늘에 있는 것이나 땅이나 바다에 있는 어떤 것에든 예배(라트리아)를 드리는 이들을 파문하며, 예배는 삼위일체 안의 유일한 하느님께 드립니다. 또 이콘 공경이 이콘 예배라고 말하는 이들과, 교회가 전한 대로 십자가와 성인들을 공경하지 않는 이들을 파문합니다</mark></strong>.”</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/VQcM_Eastern_Orthodox_Confession_of_Faith_1672_1732/#HH-Q-4-How-ought-we-to-think-of-the-Holy-Icons-and-of-the-adoration-of-the-Saints">총대주교들의 서신, 질문 4</a>, 영어에서 발췌하여 번역)</p><h2>비판에 대한 답변</h2><h3>당신들은 하느님의 십계명 가운데 하나를 없앱니다</h3><p>당신은 안식일의 쉼에 관한 <a href="https://bibleox.com/ru/ru/w/10-заповедей">넷째 계명</a>을 지킵니까? 토요일에 일하지 않습니까? 토요일에 일하는 형제자매를 죽입니까? 모독이나 우상 숭배 때문에 그들을 죽입니까? 그렇게 하지 않는다면 무슨 이유입니까? 당신들은 하느님의 계명을 없애는 것이 아닙니까? 자기는 넷째 계명을 지키지 않으면서 둘째 계명을 지키라고 요구하는 것을 왜 모른 체합니까?</p><p>모세의 율법은 폐지되었습니다. 그리스도인은 그리스도를 따릅니다. 둘째 계명이 형상과 그 공경을 금하지 않았음은 분명합니다. 하느님께서는 당신의 성전에 형상을 만들라고 명하시고, 성전을 공경하라고 명하셨으며, 예언자들은 형상이 있는 성물 앞에 절했기 때문입니다. 이 계명은 하느님을 나타내는 것을 금했고, 우상 숭배(거짓 신의 공경과 섬김)를 금했습니다.</p><h3>당신들은 이스라엘 사람들이 느후스단에게 분향했듯이 이콘에 분향합니다</h3><p>이스라엘 사람들의 잘못은 분향한 것이 아니라(분향은 하느님께서 친히 세우셨습니다), 거짓 신을 지어내어 느후스단이라 부르고 하느님 대신 자기들이 지어낸 느후스단을 섬기기 시작한 것입니다. 분명히 이스라엘 사람들에게 늘 그랬듯이 물건 자체를 신으로 여겼습니다(<a href="https://bibleox.com/ru/ru/w/языческая-вера-в-идола">자세히</a>). 이름만이 아니라 느후스단을 기쁘게 하는 방법과 그에게서 지어낸 뜻(계명)을 따르는 일까지 지어냈습니다. 이것이 우상 숭배, 곧 거짓 신을 섬기는 일입니다. 이것은 하느님과 그분의 뜻에 따른 삶에서 멀어지게 하고, 느후스단(곧 그 저자)의 뜻에 따른 삶으로 이끕니다.</p><p>정교인들은 참 하느님을 나타내고, 그분을 그분의 이름으로 부르며, 그분의 계명을 지키고, 물건(이콘)을 신으로 여기지 않으며, 이콘이 아니라 하느님께 절하고 분향합니다. 이것은 우상 숭배가 아닙니다. 느후스단을 섬긴 이들과 달리 여기에는 거짓 신도, 거짓 신 섬김도 없기 때문입니다.</p><h3>하느님께서는 나타내라고 하셨지 공경하라고는 하지 않으셨습니다</h3><p>그렇지 않습니다. 성경을 보면 하느님께서는 형상을 만들라고도, 공경하라고도 명하셨습니다. 성경에는 형상을 공경한 실천도 있습니다.</p><p>하느님께서는 당신의 뜻에 따라 천상 실재의 형상(이콘)인 성전을 공경하라고 말씀하셨습니다. 예언자 다윗은 형상이 있는 성전 앞에 절했고, 예언자 눈의 아들 여호수아는 형상이 있는 계약궤 앞에 절했습니다. 그러므로 하느님께서는 형상을 공경하라고 명하셨고, 예언자들은 형상이 있는 성물을 공경하며 그 앞에 절했습니다. 예언자들이 이 공경을 하느님께 돌렸음은 의심할 여지가 없습니다. 곧 형상을 공경하며 원형을 공경했습니다. 정교인들도 똑같이 합니다.</p><h3>만일을 위해 이콘을 포기하자는 제안</h3><p>우리 설명을 듣고 이콘 공경 반대자들은 우리의 이콘 공경이 허용된다는 데 자주 동의하면서도, 우리 가운데 모두가 교회의 가르침을 잘 아는 것은 아니고 여전히 이콘을 우상처럼 대하니, 유혹을 피하려면 이콘을 치우는 것이 낫다고 말합니다.</p><p>우리는 이에 동의하지 않습니다. 이콘은 필요하며, 잘못된 태도는 깨우침, 곧 올바른 신앙의 설명으로 없애야 합니다.</p><p>어떤 사람들은 성경을 잘못 이해하지만, 그렇다고 유혹을 피하려고 성경을 포기하지는 않습니다. 깨우침과 성경 말씀의 올바른 설명이 필요할 뿐입니다.</p><h3>역사와 교부 전통에 관한 비판에 대한 답변</h3><p><a href="https://bibleox.com/ru/ru/w/иконы-почитают">이콘은 공경받습니다: 비판</a></p><h2>결론</h2><p>그러므로 우리는 이콘 공경을 거짓 신(우상) 숭배와 같게 보는 이들이 잘못이며, 정교인에 대한 우상 숭배 비난은 믿는 이들에 대한 부당한 비난이고 정교 신앙에 대한 왜곡된 관념이라고 믿습니다.</p><p>이콘은 하느님과 사람들과 사건들에 대한 올바른 설명이자 기억일 뿐이며, 하느님으로도 하느님 대신으로도 공경받지 않습니다. 우리는 하느님과 관련된 것에 기본적인 존경을 나타낼 뿐입니다. 사람들이 특별한 천 때문이 아니라 나라에 대한 존경으로 나라의 국기를 존중하고, 종이와 물감의 품질 때문이 아니라 대통령 때문에 대통령의 초상을 존중하듯이, 희귀한 나무나 책의 재료 때문이 아니라 십자가에서 하느님께서 우리 구원을 위해 못박히셨고 책에 그분의 구원의 말씀이 기록되어 있기 때문에 십자가와 복음서를 존중합니다.</p><p>이콘은 사람들이 하느님과 그분의 어머니와 벗들에게 존경을 나타내도록 돕습니다. 이콘은 기도할 때 집중하고 정신을 하느님께 향하게 도울 수 있습니다.</p><p>때로 전혀 우리 뜻과 상관없이 하느님께서 친히 이콘과 다른 물건을 통해 기적과 치유를 나타내시며, 이는 자연히 그 물건을 특별히 공경하려는 생각으로 이끕니다. 그러나 하느님 대신이 아니라 하느님을 위해서입니다. 하느님께서 일찍이 예언자 모세에게 거룩한 땅을 공경해야 한다고 말씀하신 것과 같습니다:</p><blockquote><p>“하나님이 이르시되 이리로 가까이 오지 말라 <strong><mark>네가 선 곳은 거룩한 땅이니 네 발에서 신을 벗으라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ish/3/#L5">출 3:5</a>)</p></blockquote><p>예언자 다윗도 거룩한 것을 경외하며 그 앞에 엎드렸습니다:</p><blockquote><p>“너희는 여호와 우리 하나님을 높여 <strong><mark>그의 발등상 앞에서 경배할지어다</mark></strong> <strong><mark>그는 거룩하시도다</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ps/99/#L5">시 99:5</a>)</p></blockquote><p>그리고 그런 경외가 없는 이들에게 하느님께서는 죽음의 벌을 보내셨습니다:</p><blockquote><p>“도리어 자신을 하늘의 주재보다 높이며 <strong>그의 성전 그릇을 왕 앞으로 가져다가</strong> 왕과 귀족들과 왕후들과 후궁들이 다 <strong>그것으로 술을 마시고</strong> 왕이 또 보지도 듣지도 알지도 못하는 금, 은, 구리, 쇠와 나무, 돌로 만든 신상들을 찬양하고 도리어 왕의 호흡을 주장하시고 왕의 모든 길을 작정하시는 하나님께는 영광을 돌리지 아니한지라 &lt;…&gt; <strong>그 날 밤에 갈대아 왕 벨사살이 죽임을 당하였고</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/dan/5/#L23,30">단 5:23,30</a>)</p></blockquote><p>곧 더 쉽게 말해 <strong>거짓</strong> 신이나 <strong>거짓</strong> 신을 가리키는 것을 공경하면 우상 숭배, 곧 거짓 신(우상)의 공경과 숭배가 됩니다. 정교회는 사람과 물건과 형상을 그렇게 종교적으로 공경하라고 가르치지 않으며 이를 단죄합니다.</p><p>참 하느님을 공경하면 그분과 관련된 모든 것을 공경하게 됩니다. 하느님은 하느님으로서, 그분의 벗들과 충실한 종들은 그분의 벗들과 충실한 종들로서 공경받으며, 하느님으로서 공경받지 않습니다. 왕은 왕으로서, 그 측근들은 측근으로서 존경받으며 왕으로서 존경받지 않습니다. 이런 공경에는 거짓 신이 없습니다. 이것이 정교회가 가르치는 신앙입니다.</p><h2>관련 구절</h2><ol><li><p><a href="https://bibleox.com/ru/ru/w/почитание-святых-в-Библии">성인 공경</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/почитание-мощей-святых">성인 유해 공경</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/Выбор_места_как_форма_почитания">장소 선택은 공경의 한 형태입니다</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/молитвы-святым">성인들에게 드리는 기도</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/человек-храм-Божий">사람은 하느님의 성전</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/состав-человека">사람의 구성</a></p></li></ol>'
