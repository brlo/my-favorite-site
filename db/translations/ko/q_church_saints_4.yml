  path: Ic8v_이콘_공경
  title: 이콘 공경
  copy_cover: true
  body: '<p>정교인들은 우상 숭배를 한다는 비난을 받습니다. 이콘은 우상이라 불리고 이콘 공경은 우상 숭배라 불립니다. 이 글은 성경에 따라 이콘 공경의 주제를 살피며 이런 비난을 검토합니다.</p><p>먼저 짧은 답변을 내놓고, 이어서 비판을 조금 더 자세히 살핀 다음, 끝으로 성경을 검토하며 가장 자세한 답변을 드립니다.</p><h2>이콘 공경의 가장 짧은 변호</h2><p>하느님께서 사람이 되시기 전, 구약의 이스라엘에게 율법을 세우실 때 하느님께서는 당신의 형상을 드러내지 않으셨고, 거짓 신(우상)의 형상을 만들어 공경하는 것을 금하셨습니다(<a href="https://bibleox.com/ko/ko-ctb/ish/20/#L4-5">출 20:4-5</a>; <a href="https://bibleox.com/ko/ko-ctb/vtor/5/#L8-9">신 5:8-9</a>; <a href="https://bibleox.com/ko/ko-ctb/vtor/4/#L15-19">신 4:15-19</a>). 그러나 하느님께서는 당신의 거룩한 종들을 형상으로 나타내라고 명하셨고(<a href="https://bibleox.com/ko/ko-ctb/ish/25/#L1">출 25:1</a>; <a href="https://bibleox.com/ko/ko-ctb/ish/26/#L1">출 26:1</a>; <a href="https://bibleox.com/ko/ko-ctb/ish/25/#L18-20">출 25:18-20</a>), 예언자들은 형상이 있는 성물 앞에 엎드렸습니다(<a href="https://bibleox.com/ko/ko-ctb/nav/7/#L6">여호 7:6</a>; <a href="https://bibleox.com/ko/ko-ctb/ps/5/#L7">시편 5:7</a>). 정교인들이 형상이 있는 성물을 공경하는 태도는 예언자들의 태도와 똑같습니다.</p><p>게다가 하느님의 뜻에 따라 성전 자체가 하늘의 이콘입니다(<a href="https://bibleox.com/ko/ko-ctb/ish/25/#L8-9,40">출 25:8-9,40</a>; <a href="https://bibleox.com/ko/ko-ctb/evr/9/#L24">히브 9:24</a>; <a href="https://bibleox.com/ko/ko-ctb/act/7/#L44">사도 7:44</a>). 하느님께서는 성전을 공경하라고 명하셨고(<a href="https://bibleox.com/ko/ko-ctb/lev/19/#L30">레 19:30</a>; <a href="https://bibleox.com/ko/ko-ctb/lev/26/#L2">레 26:2</a>), 사람들은 성전을 공경하며 그 앞에 엎드렸습니다(<a href="https://bibleox.com/ko/ko-ctb/ps/5/#L7">시편 5:7</a>; <a href="https://bibleox.com/ko/ko-ctb/ps/99/#L5">시편 99:5</a>; <a href="https://bibleox.com/ko/ko-ctb/ps/132/#L7">시편 132:7</a>). 정교회의 공경이 바로 이것입니다. 형상을 공경하면서 원형을 공경합니다.</p><p>누가 예언자들의 성물 공경에 적용하려는 어떤 변호도 정교회의 공경에 적용됩니다(둘은 같은 것이기 때문입니다). 또 누가 정교회의 공경에 돌리려는 어떤 단죄도 예언자들의 공경에 돌아갑니다.</p><p>핵심은 형상이나 그 공경이 전혀 아닙니다. 우상은 하느님에 관한 모든 거짓 관념이므로, 핵심은 1) 형상 자체와 2) 공경하는 사람이 거기 담는 의미가 진리와 어떤 관계에 있느냐입니다. 둘 가운데 하나라도 근본적으로 거짓이면 우상 숭배가 되며[1], 사람을 진리에서 멀어지게 합니다. 바로 이것이 문제입니다. 우상은 하느님께로 이끌지 않습니다. 하느님에 관한 거짓 관념은 참 하느님께로 이끌지 않습니다. 거짓은 진리로 이끌지 않고 진리에서 멀어지게 하기 때문입니다[2].</p><p>이콘 공경 반대자와의 대화에서 이 주장을 짧게 시험해 봅시다:</p><p><strong>이콘 반대자</strong>: 물건 앞에 절하는 것은 우상 숭배입니다.</p><p><strong>정교인</strong>: 그러면 성전과 형상이 있는 궤 앞에 절한 하느님의 예언자들은 우상 숭배자가 되었습니까?</p><p><strong>반대자</strong>: 하느님께서는 만들라고만 하셨지 공경하거나 절하라고는 하지 않으셨습니다.</p><p><strong>정교인</strong>: 그러면 예언자들은 해서는 안 되는 일, 기록되지도 명령되지도 않은 일을 했으니 우상 숭배에 빠진 것입니까?</p><p><strong>반대자</strong>: 예언자들은 성전이나 궤 자체에 절한 것이 아니라 그 절을 하느님께 돌렸습니다.</p><p><strong>정교인</strong>: 바로 그렇습니다. 정교인들도 나무와 물감이 아니라 그려진 분께 절합니다. 가르침이 말하는 대로 형상을 통해 원형을 공경합니다. 예언자들이 그랬듯이 말입니다. 차이가 없습니다.</p><p>이런 식으로 이어집니다. 이 규칙은 언제나 통합니다. 예언자들의 공경과 정교회의 공경에는 차이가 없기 때문입니다. 이제 문제를 더 자세히 살펴봅시다.</p><h2>이콘 반대자들의 말: “하느님의 말씀은 형상을 만들지 말라고 분명히 말하는데 당신들은 만듭니다”</h2><p><strong>답변</strong>: 이것은 문맥에서 분명하듯이 하느님만을 형상으로 나타내지 말라는 모세 율법의 구약 금지입니다:</p><ul><li><p>처음 네 계명은 바로 <strong>하느님에 관한</strong> 것입니다(<a href="https://bibleox.com/ko/ko-ctb/ish/20/#L4-5">출 20:4-5</a>; <a href="https://bibleox.com/ko/ko-ctb/vtor/5/#L8-9">신 5:8-9</a>);</p></li><li><p>하느님께서는 금지를 세우시며 그 이유를 말씀하십니다. 율법을 주실 때 바로 <strong>당신의 형상</strong>을 드러내지 않으셨습니다(<a href="https://bibleox.com/ko/ko-ctb/vtor/4/#L15-19">신 4:15-19</a>). 하느님을 보지 못했으니 그분을 나타내지 말라는 것입니다.</p></li></ul><p>그러므로 금지는 바로 하느님의 형상에 관한 것입니다. 당신의 거룩한 종들에 관해서는 하느님께서 금하지 않으셨을 뿐 아니라 나타내라고 명하셨고(<a href="https://bibleox.com/ko/ko-ctb/ish/25/#L1">출 25:1</a>; <a href="https://bibleox.com/ko/ko-ctb/ish/26/#L1">출 26:1</a>), 의인들은 성전과 이런 형상이 있는 성물에 절했습니다(<a href="https://bibleox.com/ko/ko-ctb/nav/7/#L6">여호 7:6</a>; <a href="https://bibleox.com/ko/ko-ctb/ps/5/#L7">시편 5:7</a>; <a href="https://bibleox.com/ko/ko-ctb/ps/99/#L5">시편 99:5</a>; <a href="https://bibleox.com/ko/ko-ctb/ps/132/#L7">시편 132:7</a>).</p><p>구약의 교회에는 이콘이 있었고 공경받았습니다. 무엇보다 <strong>구약의 성전 자체가 이콘입니다.</strong> 성전은 지상의 건물이지만 하느님의 본래 뜻에 따라 하늘에서 일어나는 일의 형상이 되어야 했습니다. 하느님께서 예언자 모세에게 성전을 지으라고 명하신 것은 성전이 필요해서가 아니라(하느님께는 필요하지 않습니다: <a href="https://bibleox.com/ko/ko-ctb/is/66/#L1">이사 66:1</a>; <a href="https://bibleox.com/ko/ko-ctb/ps/50/#L13">시편 50:13</a>; <a href="https://bibleox.com/ko/ko-ctb/is/1/#L11">이사 1:11</a>), 바로 하늘의 이콘으로서, 예언자에게 보여 주신 천상 실재의 형상으로서 짓게 하신 것입니다(<a href="https://bibleox.com/ko/ko-ctb/ish/25/#L8-9,40">출 25:8-9,40</a>; <a href="https://bibleox.com/ko/ko-ctb/evr/9/#L24">히브 9:24</a>; <a href="https://bibleox.com/ko/ko-ctb/act/7/#L44">사도 7:44</a>). 하느님께서는 이 이콘을 공경하라고 명하십니다(<a href="https://bibleox.com/ko/ko-ctb/lev/19/#L30">레 19:30</a>; <a href="https://bibleox.com/ko/ko-ctb/lev/26/#L2">레 26:2</a>). 예언자 다윗은 그 앞에 엎드립니다(<a href="https://bibleox.com/ko/ko-ctb/ps/5/#L7">시편 5:7</a>; <a href="https://bibleox.com/ko/ko-ctb/ps/99/#L5">시편 99:5</a>; <a href="https://bibleox.com/ko/ko-ctb/ps/132/#L7">시편 132:7</a>). 악한 왕들이 성전에 이교 우상을 세워(<a href="https://bibleox.com/ko/ko-ctb/4ts/21/#L3-7">열하 21:3-7</a>) 천상 실재의 형상을 망가뜨리자, 하느님께서는 성전을 버리셨습니다(<a href="https://bibleox.com/ko/ko-ctb/4ts/23/#L27">열하 23:27</a>).</p><p>성전이 하늘의 이콘이기 때문에 신약에서 (내부 구조와 형상이) 달라집니다. 천상 실재가 달라지기 때문입니다. 구약에서 천상 실재에는 <strong>천사들만</strong> 영적으로 보이게 머물렀습니다. 하느님께서는 완전히 보이지 않으시고 물질이 아니시며, 사람들은 아직 하늘의 삶에 이르지 못했습니다(<a href="https://bibleox.com/ru/ru/w/9VFT_До_жертвы_Христовой_ветхозаветные_праведники_сходили_в_ад">자세히</a>).</p><p>신약에서, 정확히는 주 예수 그리스도께서 오시면서 큰 변화가 일어났습니다:</p><ol><li><p><strong>하느님께서 인성으로 보이게 되셨습니다</strong>(<a href="https://bibleox.com/ko/ko-ctb/in/1/#L18">요한 1:18</a>; <a href="https://bibleox.com/ko/ko-ctb/1in/1/#L1-2">1요한 1:1-2</a>);</p></li><li><p><strong>하느님께서 하늘에서 보이게 왕좌에 앉으셨습니다</strong>(<a href="https://bibleox.com/ko/ko-ctb/ef/1/#L20-21">에페 1:20-21</a>; <a href="https://bibleox.com/ko/ko-ctb/otkr/3/#L21">묵시 3:21</a>);</p></li><li><p><strong>사람들이 하늘에 나타났습니다.</strong> 주 예수 그리스도와 함께하는 삶에 이를 가능성을 얻었습니다(<a href="https://bibleox.com/ko/ko-ctb/otkr/6/#L9-11">묵시 6:9-11</a>; <a href="https://bibleox.com/ko/ko-ctb/otkr/14/#L1,3-5">묵시 14:1,3-5</a>);</p></li><li><p><strong>하느님께서 새 계약을 맺으십니다</strong>(<a href="https://bibleox.com/ko/ko-ctb/ier/31/#L31">예레 31:31</a>; <a href="https://bibleox.com/ko/ko-ctb/evr/8/#L8">히브 8:8</a>; <a href="https://bibleox.com/ko/ko-ctb/lk/22/#L20">루가 22:20</a>; <a href="https://bibleox.com/ko/ko-ctb/1kor/11/#L25">1고린 11:25</a>). <strong>옛 계약은 모세의 율법과 함께 끝났습니다</strong>(<a href="https://bibleox.com/ko/ko-ctb/rim/7/#L6">로마 7:6</a>; <a href="https://bibleox.com/ko/ko-ctb/gal/3/#L21-25">갈라 3:21-25</a>; <a href="https://bibleox.com/ko/ko-ctb/ef/2/#L14-16">에페 2:14-16</a>). 하느님을 나타내지 말라는 금지는 그리스도께서 오시며 폐지된 모세 율법의 일부이므로 효력을 잃습니다(<a href="https://bibleox.com/ru/ru/w/Библия-Закон-Моисея-отмена">자세히</a>).</p></li></ol><p>곧 구약의 성전은 구약의 천상 실재의 형상이었고, 그 실재는 신약에서 달라졌습니다. 이전의 것은 이제 없습니다. 성전은 하느님의 본래 뜻에 따라 천상 실재의 형상이었으므로, 그 실재가 달라진 뒤에는 옛것을 나타낼 까닭이 없습니다. 그래서 그리스도인들은 아주 오래전부터 새 천상 실재를 나타내어, 모든 것의 머리에 하늘에서 드러나게 왕좌에 앉으신 예수 그리스도(하느님)의 형상을 두고, 그 둘레에 천사들만이 아니라 사람들도 포함한 그분의 거룩한 종들의 형상을 둡니다.</p><p>상징적인 사건은 그리스도의 희생 뒤에 예루살렘 성전에 일어난 손상입니다:</p><blockquote><p>“바로 그 때에 <strong>성전 휘장이 위에서 아래까지 두 폭으로 찢어지고 땅이 흔들리며 바위가 갈라지고</strong> 무덤이 열리면서 <strong>잠들었던 많은 옛 성인들이 다시 살아났다. 그들은 무덤에서 나와 예수께서 부활하신 뒤에</strong> 거룩한 도시에 들어 가서 많은 사람에게 나타났다.” (<a href="https://bibleox.com/ko/ko-ctb/mf/27/#L51-53">마태 27:51-53</a>)</p></blockquote><p>70년대에 성전은 로마인들에게 완전히 파괴되어, 그 뒤 수천 년 동안 새로운 천상 실재의 형상, 곧 정교회 성당에 자리를 내주었습니다.</p><img src="https://res.bibleox.com/s/img/image/simple/686bea5b5f47da2505d3ae31/s_p_pjRHeoFaUpKPoyEH.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686bea5b5f47da2505d3ae31/m_p_pjRHeoFaUpKPoyEH.jpg">크게 보기</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686cf7375f47da2505d3ae4f/m_p_MOsOWI2vEXUj5ELf.jpg">다른 그림</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686d23425f47da2505d3ae55/s_p_LzqgbhnIsbqtghoc.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d23425f47da2505d3ae55/m_p_LzqgbhnIsbqtghoc.jpg">크게 보기</a>]</p><p>더 많은 고대 이콘: <a href="https://bibleox.com/ru/ru/w/древние-иконы">고대 이콘</a>.</p><p>천상 실재의 구약 형상만이 아니라, 그 필수 부분인 모세 율법을 포함한 옛 계약 자체도 낡아 이제 의미를 잃었습니다. 하느님을 나타내지 말라는 금지 외에도 신약에서 더 이상 적용되지 않는 규정이 많습니다:</p><blockquote><p>“<strong>야훼의 이름을 모욕한 자는 반드시 사형시켜야 한다</strong>. 온 회중이 그를 돌로 쳐 죽여야 한다. 내 이름을 모욕한 자는 외국인이든지 본국인이든지 <strong>사형에 처해야 한다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/lev/24/#L16">레 24:16</a>)</p></blockquote><p>하느님의 이름을 모독하는 것은 <strong>셋째 계명</strong>을 거스르는 죄입니다. 모세 율법의 벌은 죽음입니다(<a href="https://bibleox.com/ko/ko-ctb/lev/24/#L16">레 24:16</a>). 알려진 바로는 이콘 반대자들은 하느님을 모독한 사람을 죽여야 한다고 가르치지 않습니다. 그들은 “이것은 하느님의 말씀이다”라며 구절을 보이고 하느님을 나타내지 말라는 구약의 금지를 지키라고 요구하지만, 모독자를 죽이라는 계명도 하느님의 말씀이고 분명히 기록되어 있는데도 지키지 않습니다. 왜입니까? 모세의 율법이 폐지되었기 때문입니다.</p><p><strong>넷째 계명</strong>은 안식일의 쉼, 곧 일을 삼가는 것을 정합니다(<a href="https://bibleox.com/ko/ko-ctb/ish/20/#L8-10">출 20:8-10</a>; <a href="https://bibleox.com/ko/ko-ctb/vtor/5/#L12-15">신 5:12-15</a>; <a href="https://bibleox.com/ko/ko-ctb/lev/19/#L3">레 19:3</a>; <a href="https://bibleox.com/ko/ko-ctb/lev/19/#L30">레 19:30</a>). 모세 율법의 벌은 죽음입니다. 이것도 하느님의 말씀이고 분명히 기록되어 있지만, 이콘 반대자들은 안식일을 어긴 사람을 죽여야 한다고 가르치지 않으며, 대부분 안식일의 쉼조차 지키지 않습니다. 왜입니까? 모세의 율법이 폐지되었기 때문입니다.</p><p>그러므로 사람이 되신 하느님을 나타내지 말라고 금하는 것은:</p><ol><li><p><strong>유다교로 돌아가는 것</strong>입니다. 모세의 율법대로 계속 사는 것입니다(그런데 같은 이유로 어떤 이들은 <a href="https://bibleox.com/ru/ru/w/ozcY_О_десятине">십일조</a>를 걷습니다);</p></li><li><p><strong>하느님의 강생을 간접적으로 부정하는 것</strong>입니다. 그리스도께서 하느님이심을 부정하거나 그분이 보이는 분이심을 부정하는 것입니다.</p></li></ol><p>이제 문제를 더 자세히 살펴봅시다.</p><h2>모세 율법의 둘째 계명</h2><p>이콘 반대자들은 이콘이 <a href="https://bibleox.com/ru/ru/w/10-заповедей">모세 율법</a>의 둘째 계명을 어긴다고 여깁니다:</p><blockquote><p>“너희는 위로 하늘에 있는 것이나 아래로 땅 위에 있는 것이나, 땅 아래 물 속에 있는 어떤 것이든지 <strong>그 모양을 본따 새긴 우상을 섬기지 못한다</strong>. <strong>그 앞에 절하며 섬기지 못한다</strong>. 나 야훼 너희의 하느님은 질투하는 신이다. 나를 싫어하는 자에게는 아비의 죄를 그 후손 삼 대에까지 갚는다.” (<a href="https://bibleox.com/ko/ko-ctb/ish/20/#L4-5">출 20:4-5</a>; <a href="https://bibleox.com/ko/ko-ctb/vtor/5/#L8-9">신 5:8-9</a>)</p></blockquote><p>모세의 십계명은 두 부분(두 판)으로 나뉩니다:</p><ul><li><p>하느님에 대한 사랑에 관한 네 계명;</p></li><li><p>이웃에 대한 사랑에 관한 여섯 계명.</p></li></ul><p>둘째 계명은 하느님에 대한 사랑의 표현에 속하며, 모든 형상과 절을 금하는 것이 아니라 유일한 참 하느님 대신 신으로 공경할 물건을 만드는 것을 금합니다. 곧 <strong>이 계명은 거짓 신 숭배를 금합니다.</strong> 그래서 성경에는 이 계명에 어긋나지 않는 형상과 절이 나옵니다. 이에 관해서는 아래에 더 있습니다.</p><h3>“형상을 만들지 말라”</h3><h4>하느님께서는 당신의 성전에 형상을 만들라고 명하십니다</h4><p>둘째 계명이 형상을 금하는데도, 이 계명을 주신 바로 그 하느님께서 당신의 성전(성막)에 곧 성막의 천과 지성소로 들어가는 휘장에 거룹 형상을 만들고, 계약궤의 덮개에 금으로 거룹 상을 만들라고 명하십니다:</p><blockquote><p>“세공인 가운데서도 재주있는 사람들이 <strong><mark>성막을 만들었다</mark></strong>. 우선 가늘게 꼰 모시실과 자주빛 털실, 붉은 털실, 진홍색 털실로 <strong><mark>거룹 무늬를 놓아 가며 천 열 폭을 짰다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/ish/36/#L8">출 36:8</a>; <a href="https://bibleox.com/ko/ko-ctb/ish/25/#L1">출 25:1</a>; <a href="https://bibleox.com/ko/ko-ctb/ish/26/#L1">출 26:1</a>)</p></blockquote><blockquote><p>“자주빛 털실과 붉은 털실과 진홍빛 털실과 가늘게 꼰 모시실로 <strong><mark>거룹모양의 무늬를 놓아 가며 휘장을 짜라</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/ish/26/#L31">출 26:31</a>)</p></blockquote><blockquote><p>“속죄판은 마치로 두드려 늘여서 <strong>거룹 둘이</strong> <strong><mark>양쪽에 자리잡게</mark></strong> 만드는데” (<a href="https://bibleox.com/ko/ko-ctb/ish/25/#L18">출 25:18</a>)</p></blockquote><p>나중에 솔로몬이 지은 성전에는 더 많은 형상과 조각이 있었습니다:</p><blockquote><p>“그는 또 자주실과 붉은 실과 심홍 색실로 <strong><mark>휘장을 짜고</mark></strong> <strong>그 위에 거룹들을 수놓았다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/2par/3/#L14">역하 3:14</a>)</p></blockquote><blockquote><p>“<strong><mark>지성소 안에는</mark></strong> <strong>거룹 둘을</strong> 들였는데, 그것은 나무를 깎아 만들어 금을 입힌 것이었다.” (<a href="https://bibleox.com/ko/ko-ctb/2par/3/#L10">역하 3:10</a>)</p></blockquote><blockquote><p>“<strong><mark>밀실에는</mark></strong> 올리브나무로 높이 십 척 되는 <strong>거룹을 둘</strong> 만들어 놓았다.” (<a href="https://bibleox.com/ko/ko-ctb/3ts/6/#L23">열상 6:23</a>)</p></blockquote><p>성전의 자세한 구조: <a href="https://bibleox.com/ru/ru/w/иерусалимский-храм">예루살렘 성전</a>.</p><p>성전 기물을 만들도록 하느님께서는 장인들에게 성령의 은사를 주셨습니다:</p><blockquote><p>“야훼께서 모세에게 말씀하셨다. 들어라. 나는 유다 지파에서 후르의 손자이며 우리의 아들인 브살렐을 지명하여 불러 그에게 <strong>신통한 생각을 채워 주어, 온갖 일을 멋지게 해내는 지혜와 재간과 지식을 갖추게 하겠다</strong>. 그러면 그는 여러 가지를 고안하여 금, 은, 동으로 그것을 만들고 테에 박을 보석에 글자를 새기고 나무를 다듬는 온갖 일을 다 잘 해낼 것이다.” (<a href="https://bibleox.com/ko/ko-ctb/ish/31/#L1-5">출 31:1-5</a>) <em>(히브리어: “하느님의 영으로 채워”)</em></p></blockquote><h4>하느님께서는 뱀의 형상을 만들라고 명하셨습니다</h4><p>하느님께서는 또 구리뱀을 만들게 하시어, 사람들이 그것을 바라보면 뱀에게 물린 데서 기적적으로 구원받게 하십니다:</p><blockquote><p>“야훼께서 모세에게 대답하셨다. ‘<strong>너는 불뱀을 만들어</strong> 기둥에 달아 놓고 뱀에게 물린 사람마다 그것을 쳐다보게 하여라. 그리하면 죽지 아니하리라.’” (<a href="https://bibleox.com/ko/ko-ctb/chis/21/#L8">민 21:8</a>)</p></blockquote><p>매우 중요한 것은 이 뱀이 예수 그리스도의 형상이었고 그분의 장차 있을 십자가 고난을 가리켰다는 점입니다:</p><blockquote><p>“<strong>구리뱀이 광야에서 모세의 손에 높이 들렸던 것처럼 사람의 아들도 높이 들려야 한다</strong>. 그것은 그를 믿는 사람은 누구나 영원한 생명을 누리게 하려는 것이다.” (<a href="https://bibleox.com/ko/ko-ctb/in/3/#L14-15">요한 3:14-15</a>)</p></blockquote><p>나중에 이스라엘 사람들이 뱀 자체를 신으로 여기며 참 하느님과 아무 상관 없는 거짓 이름(느후스탄)을 붙이자 히즈키야 왕이 이 뱀을 없앴습니다. 그들은 참 하느님을 버리고 둘째 계명을 어겼습니다:</p><blockquote><p>“그는 산당들을 철거하고 석상들을 부수고 아세라 목상들을 찍어 버렸다. 그리고 모세가 만들었던 구리뱀을 산산조각을 내었다. 이스라엘 사람들이 그 때까지 <strong><mark>느후스탄이라고 불리우던 그 구리뱀에게 제물을 살라 바치고 있었던 것이다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/4ts/18/#L4">열하 18:4</a>)</p></blockquote><h3>형상에 절하지 말라</h3><p>형상에 절하는 것이 금지되었는데도 의인들은 사람과 여러 사물과 천사에게 늘 절하고, 다른 사람들은 예언자에게 절합니다. 아무도 그들을 우상 숭배로 단죄하지 않습니다. 이 절은 거짓 신(우상)에게 드리는 것이 아니기 때문입니다.</p><h4>천사의 모습으로 나타나신 하느님께 드리는 절</h4><p>아브라함은 세 사람의 모습으로 나타나신 하느님께 절합니다:</p><blockquote><p>“<strong>야훼께서</strong> 마므레의 상수리나무 곁에서 <strong>아브라함에게 나타나셨다</strong>. 아브라함은 한창 더운 대낮에 천막 문 어귀에 앉아 있다가 고개를 들어 <strong>웬 사람 셋이</strong> 자기를 향해 서 있는 것을 보았다. 그는 그들을 보자마자 천막 문에서 뛰어 나가 맞으며 <strong>땅에 엎드려</strong>” (<a href="https://bibleox.com/ko/ko-ctb/gen/18/#L1-2">창 18:1-2</a>)</p></blockquote><p>하느님께서는 왜 형상으로 나타나셨습니까? 하느님은 본성상 보이지 않으시고 아무도 그분을 본 적이 없기 때문입니다(<a href="https://bibleox.com/ko/ko-ctb/1tim/6/#L16">1디모 6:16</a>; <a href="https://bibleox.com/ko/ko-ctb/in/1/#L18">요한 1:18</a>).</p><h4>천사에게 드리는 절</h4><p>먼저 천사는 영이고(<a href="https://bibleox.com/ko/ko-ctb/evr/1/#L13-14">히브 1:13-14</a>) 영에게는 살과 뼈가 없음을(<a href="https://bibleox.com/ko/ko-ctb/lk/24/#L39">루가 24:39</a>) 짚어 두어야 합니다. 곧 천사도 사람의 모습으로 사람들에게 나타납니다. 그러므로 천사에게 절하는 사람은 <strong>보이지 않는 영(천사)의 보이는 형상에 절하는</strong> 것입니다:</p><blockquote><p>“그가 대답하였다. ‘아니다. 나는 야훼 군대의 총사령관으로서 이제 온 것이다.’ 이 대답을 듣고 여호수아는 <strong>엎드려 얼굴을 땅에 대고 절하며</strong> 물었다. ‘내 주여, 당신의 종에게 무슨 말씀을 하시렵니까?’” (<a href="https://bibleox.com/ko/ko-ctb/nav/5/#L14">여호 5:14</a>)</p></blockquote><h4>예언자에게 드리는 절</h4><blockquote><p>“예리고에서 온 예언자 수련생들이 멀리서 그 광경을 보고 말했다.‘엘리야의 영검이 엘리사에게 내렸구나.’ 그러면서 엘리사 앞으로나와 <strong>땅에 엎드려 절하였다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/4ts/2/#L15">열하 2:15</a>)</p></blockquote><h4>성전을 향한 절</h4><p>다윗은 그 자체로 하늘의 이콘이고(<a href="https://bibleox.com/ko/ko-ctb/lev/19/#L30">레 19:30</a>; <a href="https://bibleox.com/ko/ko-ctb/lev/26/#L2">레 26:2</a>) 거룩한 천사들의 형상으로 가득한(<a href="https://bibleox.com/ko/ko-ctb/ish/25/#L1">출 25:1</a>; <a href="https://bibleox.com/ko/ko-ctb/ish/26/#L1">출 26:1</a>) 성전을 향해 절했습니다:</p><blockquote><p>“당신의 크신 사랑만을 믿고 나는 당신 집에 왔사옵니다. 주님 두려워하는 마음으로 <strong>당신의 거룩한 성전을 향하여 엎드립니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/ps/5/#L7">시편 5:7</a>)</p></blockquote><p>또 하느님께서는 성전을 공경하라고 명하셨습니다(<a href="https://bibleox.com/ko/ko-ctb/lev/19/#L30">레 19:30</a>; <a href="https://bibleox.com/ko/ko-ctb/lev/26/#L2">레 26:2</a>).</p><h4>하느님의 발판(성전)에 드리는 절</h4><blockquote><p>“야훼 우리 하느님을 기리어라. <strong>그분의 발판 아래 엎드려라</strong>. <strong>그분은 거룩하시다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/ps/99/#L5">시편 99:5</a>)</p></blockquote><blockquote><p>“<strong>그분 계시는 곳으로 들어 가자. 그 발 앞에 엎드려 경배하자</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/ps/132/#L7">시편 132:7</a>)</p></blockquote><h4>궤 앞의 절</h4><p>눈의 아들 여호수아는 거룩한 거룹 상이 있는 계약궤 앞에 엎드렸습니다:</p><blockquote><p>“여호수아와 이스라엘의 장로들은 옷을 찢고 머리에 먼지를 쓴 채 저물 때까지 <strong>야훼의 궤 앞에 엎드려 있었다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/nav/7/#L6">여호 7:6</a>)</p></blockquote><h4>지팡이에 드리는 절</h4><blockquote><p>“그러면 이제 나에게 맹세하여라.‘ 요셉이 시키는 대로 맹세하자, <strong>이스라엘은 침상 머리맡에 엎드려</strong> 하느님께 경배드렸다.” (<a href="https://bibleox.com/ko/ko-ctb/gen/47/#L31">창 47:31</a>; <a href="https://bibleox.com/ko/ko-ctb/evr/11/#L21">히브 11:21</a>) <em>(칠십인역에는 “지팡이 끝에”(προσεκύνησεν Ισραηλ ἐπὶ τὸ ἄκρον τῆς ῥάβδου αὐτοῦ)로 되어 있습니다. 히브리 11:21도 같습니다.)</em></p></blockquote><p>더 많은 예: <a href="https://bibleox.com/ru/ru/w/поклоны">절</a>.</p><h3>이교의 우상 신앙은 둘째 계명을 어깁니다</h3><p>이교의 우상 신앙은 어떤 경우든 존재하지 않는 거짓 신을 숭배하게 하므로 둘째 계명을 어기게 합니다. 몰록, 바알, 제우스, 유피테르, 페룬은 존재하지 않습니다. 그들은 거짓 신입니다.</p><p>이교의 우상 신앙은 세 종류이며, 가장 널리 퍼진 것부터 말하면 다음과 같습니다:</p><ol><li><p><strong>우상이 곧 신입니다.</strong> 이교도가 만든 물건(우상) 자체가 신입니다.</p></li><li><p><strong>우상은 거짓 신의 형상입니다.</strong> 그 신은 멀리 있지만 이렇게 생겼다고 여깁니다.</p></li><li><p><strong>우상은 (신격화된) 자연 현상의 지어낸 형상입니다.</strong> 바다, 바람, 비, 불, 땅입니다.</p></li></ol><p>세 경우 모두 존재하지 않는 거짓 신을 공경합니다. 이것은 거짓에 대한 믿음입니다.</p><p>성경에서 만나는 것은 첫째 종류입니다. 성경에 묘사된 가장 흔한 이교 신앙은 물건 자체(물질)의 신격화입니다. 이교도는 손에 있는 재료로 신을 만들거나, 동물, 나무, 돌, 산, 해, 별, 바람, 바다, 뇌우 같은 자연물이나 현상을 신격화했습니다. 예언자들은 이교도가 나무 한쪽으로 음식을 만들고 같은 나무의 다른 쪽을 신이라 부른다고 우상 숭배를 고발합니다:</p><blockquote><p>“송백을 찍어 낸다. <strong>삼목이나 상수리나무를 베어 낸다</strong>. 숲 속에서 싱싱하게 자란 나무들이다. 심어 둔 송백이 비를 맞고 큰 것들이다. <strong><mark>땔감밖에 되지 않는 것들, 베어다가 몸이나 녹이고 빵이나 굽는 데 쓸 것들, 그런 나무로 신이랍시고 만들어 예배를 드리는구나. 신상이랍시고 만들어 놓고 그 앞에 엎드려 큰절을 하는구나</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/is/44/#L14-15">이사 44:14-15</a>)</p></blockquote><blockquote><p>“<strong>라헬은</strong> 마침 라반이 양털을 깎으러 나간 틈을 타 <strong>친정집 수호신들을 훔쳐 냈다</strong>. &lt;…&gt; 네가 아버지 집이 너무 그리워 떠나간다는 것은 알고도 남을 일이다. 하지만 <strong><mark>내 집 수호신들은 왜 훔쳐 가는 거냐</mark></strong>?‘” (<a href="https://bibleox.com/ko/ko-ctb/gen/31/#L19,30">창 31:19,30</a>)</p></blockquote><blockquote><p>“또 어떤 이는 항해를 떠나며 <strong>자기를 태운 배보다 더 썩은 나무를 부른다</strong>. … 그 뒤 불경한 관습이 굳어져 법처럼 지켜졌고, <strong>새긴 상들이 숭배되었다</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/prs/14/#L1,16">지혜 14:1,16</a>, 그리스어에서 번역)</p></blockquote><blockquote><p>“왕이 말했다. <strong>“너는 벨이 살아 있는 신이라고 생각하지 않느냐? 그가 날마다 얼마나 먹고 마시는지 보지 못하느냐?”</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/dan/14/#L6">다니 14:6</a>, 그리스어에서 번역)</p></blockquote><blockquote><p>“우상에게 맏물이 무슨 소용이 있는가? <strong>그것은 먹지도 냄새를 맡지도 못한다</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/prsir/30/#L19">집회 30:19</a>, 그리스어에서 번역)</p></blockquote><blockquote><p>“데메드리오라는 은장이가 여신 아르데미스의 신당 모형들을 만들어 직공들에게 큰 돈벌이를 시켜 주고 있었는데 하루는 자기 직공들과 동업자들을 한 자리에 불러 놓고 이런 말을 하였다. ‘여러분, 여러분도 알다시피 우리는 이 사업으로 잘 살아 왔습니다. 그런데 그 바울로라는 자가 <strong><mark>사람의 손으로 만든 것은 신이 아니라고</mark></strong> 하면서 이 에페소에서뿐만 아니라 거의 아시아 전역에서 많은 사람들을 설득하여 마음을 돌려 놓았다는 사실을 여러분은 보고 들었을 것입니다. 이대로 가다가는 <strong>우리의 사업이 타격을 입게 될</strong>뿐만 아니라 위대한 여신 아르데미스 신당이 괄시를 받게 되고 마침내는 온 아시아와 온 세계가 숭상하는 이 여신의 위신이 땅에 떨어지고 말 터이니 참으로 위험합니다.’” (<a href="https://bibleox.com/ko/ko-ctb/act/19/#L24-27">사도 19:24-27</a>)</p></blockquote><p>성경의 비슷한 다른 대목: <a href="https://bibleox.com/ru/ru/w/языческая-вера-в-идола">이교의 우상 신앙</a>.</p><p>생각하는 사람들인 고대 철학자들은 이교 신앙을 변호하면서 사람의 손으로 가공한 물질이 신일 수 없음을 깨달았습니다. 그들은 그것이 신의 형상이거나 자연 현상의 지어낸 형상일 뿐이라는 등의 판단을 내놓았습니다. 그러나 둘째 계명은 여전히 깨집니다. 그들은 참 하느님이 아니라 <strong>거짓 신</strong>을 숭배하기 때문입니다.</p><p>이교의 신은 이름이나 형상 때문만이 아니라 거짓입니다. 신에 관한 거짓은 신의 수, 능력, 본질적 속성, 그리고 가장 중요하게는 계명에 드러난 피조물에 대한 하느님의 뜻에서도 나타납니다.</p><p>분명히 하기 위해 항목별로 비교해 봅시다.</p><h4>이교의 신들</h4><ul><li><p>거짓 이름(몰록, 바알, 제우스, 페룬 등),</p></li><li><p>거짓 모습(여러 사람 같은 형상),</p></li><li><p>거짓 능력(제한적이며, 많은 이교 신의 능력이 저마다 다릅니다),</p></li><li><p>거짓 뜻(참 하느님께서 계명으로 나타내신 뜻이 아닙니다),</p></li><li><p>거짓된 본질적 속성(영원하지도, 어디에나 있지도, 모든 것을 알지도, 무한하지도, 불사도, 거룩하지도 않습니다),</p></li><li><p>다른 곳(거짓된 곳)으로, 다른 길(거짓된 길)로 부릅니다.</p></li></ul><h4>정교회가 믿는 하느님</h4><ul><li><p>성경에 나오는 참 하느님의 이름(계시는 분, 아버지, 아들, 성령, 예수 그리스도와 <a href="https://bibleox.com/ru/ru/w/Бог-имена">다른 이름들</a>);</p></li><li><p>그분이 친히 세상에 드러내신 형상(아브라함에게 나타난 세 천사 — <a href="https://bibleox.com/ko/ko-ctb/gen/18/#L1-2">창 18:1-2</a>, 비둘기 — <a href="https://bibleox.com/ko/ko-ctb/lk/3/#L22">루가 3:22</a>, 끝으로 하느님의 아들께서 참으로 되신 사람의 모습 — 예수 그리스도);</p></li><li><p>우주의 전능하신 창조주를 나타냅니다;</p></li><li><p>하느님의 계명을 지키라고 부르시는 분입니다(그리스도께서는 당신의 계명이 적힌 펼친 책을 드신 모습으로 그려집니다);</p></li><li><p>십자가의 길을 통해 당신과 함께하는 삶으로 부르시는 하느님을 나타냅니다(그리스도께서는 십자 모양 후광과 함께 십자가에 달린 모습으로 그려집니다).</p></li></ul><p>이처럼 이교도는 형상을 신이나 (거짓) 신의 형상으로 여기지만, 정교회는 참 하느님을 나타내며 물건 자체(이콘)를 신으로 여기지 않습니다.</p><p>정교회는 하느님의 벗들, 곧 하느님의 어머니 동정 마리아, 천사들, 사도들, 의인들도 나타냅니다. 이것은 거짓이 아닙니다. 그들은 모두 실제로 존재합니다. 이 거룩한 사람들과 천사들 자신도, 그들의 형상도 신으로 여겨지지 않습니다.</p><p>정교회의 모든 이콘은 복음서와 십자가처럼 성물로서 공경받습니다. 그 공경은 참 하느님과 그분의 실제로 존재하는 벗들에게 돌아갑니다.</p><h3>둘째 계명의 이유</h3><p>이처럼 하느님께서는 성인들의 형상을 만드는 것을 금하지 않으셨을 뿐 아니라 만들라고 명하셨지만(<a href="https://bibleox.com/ko/ko-ctb/ish/25/#L1">출 25:1</a>; <a href="https://bibleox.com/ko/ko-ctb/ish/26/#L1">출 26:1</a>), 둘째 계명으로 당신의 형상을 만드는 것은 금하셨습니다. 그분은 금지의 이유를 설명하십니다. 율법을 주실 때 하느님께서는 <strong>당신의</strong> 어떤 형상도 드러내지 않으셨습니다. 이스라엘 사람들이 <strong>그분을</strong> 나타내려 하다가 유일한 참 하느님 대신 형상과 조각(상) 자체를 신으로 섬기지 않게 하시려는 것입니다:</p><blockquote><p>“그러므로 너희는 깊이 명심하여라. 야훼께서 호렙의 불길 속에서 너희에게 말씀하시던 날 <strong><mark>너희는 아무 모습도 보지 못하지 않았느냐</mark></strong>? 그러니 너희는 남자의 모습이든 여자의 모습이든 일체 <strong><mark>어떤 모습을 본따 새긴 우상을 모시어 죄를 짓는 일이 없도록 하여라</mark></strong>. 땅 위에 있는 어떤 짐승의 모습이나 공중에서 날개치는 어떤 새의 모습이나, 땅 위를 기어 다니는 어떤 동물의 모습이나 땅 아래 물 속에 있는 어떤 물고기의 모습도 안 된다. 눈을 하늘로 향하여 해와 달과 별 등 하늘에 있는 모든 천체를 보고 <strong><mark>그 앞에 엎드려 예배하고 싶은 유혹에 빠져서도 안 된다</mark></strong>. 그런 것들은 너희 하느님 야훼께서 만 천하 다른 민족들에게 주어 섬기게 하신 것들이다.” (<a href="https://bibleox.com/ko/ko-ctb/vtor/4/#L15-19">신 4:15-19</a>)</p></blockquote><p>이 경고에는 충분한 근거가 있었습니다. 당시 온 지구는 이교였고 그런 우상을 숭배했기 때문입니다. 오늘날에는 이교도가 자기 손으로 만든 물건을 글자 그대로 신으로 여겼다는 것을 설명해야 할 정도입니다.</p><h2>그리스도께서 오시면서 변화가 일어납니다</h2><h3>1. 옛 계약과 모세의 율법이 끝납니다</h3><blockquote><p>“우리는 율법에 사로잡혀 있었지만 이제 <strong>우리는 죽어서 그 제약을 벗어났습니다</strong>. 그래서 우리는 낡은 법조문을 따라서 섬기지 않고 성령께서 주시는 새 생명을 가지고 섬기게 되었습니다.” (<a href="https://bibleox.com/ko/ko-ctb/rim/7/#L6">로마 7:6</a>)</p></blockquote><blockquote><p>“<strong>율법은 그리스도께서 오실 때까지 우리의 후견인 구실을 하였습니다</strong>. 그러나 그리스도께서 오신 뒤에는 우리가 믿음을 통하여 하느님과 올바른 관계를 맺게 되었습니다. 이렇게 믿음의 때가 이미 왔으니 <strong>우리에게는 이제 후견인이 필요하지 않습니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/gal/3/#L24-25">갈라 3:24-25</a>)</p></blockquote><blockquote><p>“그리스도야말로 우리의 평화이십니다. 그분은 자신의 몸을 바쳐서 유다인과 이방인이 서로 원수가 되어 갈리게 했던 담을 헐어 버리시고 그들을 화해시켜 하나로 만드시고 <strong>율법 조문과 규정을 모두 폐지하셨습니다</strong>. 그리스도께서는 자신을 희생하여 유다인과 이방인을 하나의 새 민족으로 만들어 평화를 이룩하시어” (<a href="https://bibleox.com/ko/ko-ctb/ef/2/#L14-15">에페 2:14-15</a>)</p></blockquote><p><strong>그리스도께서는 새 계약을 맺으시어 모세의 율법이 있는 옛 계약을 끝내십니다</strong>(<a href="https://bibleox.com/ko/ko-ctb/rim/7/#L6">로마 7:6</a>; <a href="https://bibleox.com/ko/ko-ctb/gal/3/#L21-25">갈라 3:21-25</a>; <a href="https://bibleox.com/ko/ko-ctb/ef/2/#L14-16">에페 2:14-16</a>). 하느님을 나타내지 말라는 금지는 그리스도께서 오시며 폐지된 모세 율법의 일부였습니다(<a href="https://bibleox.com/ru/ru/w/Библия-Закон-Моисея-отмена">자세히</a>). 하느님께서 모세를 통해 주신 계명들은 글자 그대로의 뜻을 잃습니다. 우리는 안식일의 쉼을 지키지 않고(안식일을 어긴 사람을 죽이지도 않고), 짐승을 제물로 바치지 않고, 할례를 받지 않고, 유다인의 명절을 지키지 않고, 십일조를 내지 않으며, 모세 율법의 다른 수많은 명령을 지키지 않습니다. 옛 계약과 모세의 율법은 그 자체로 폐지되었고, 신약의 믿는 이들은 문자가 아니라 영의 봉사자로 부름받았습니다(<a href="https://bibleox.com/ko/ko-ctb/2kor/3/#L6">2고린 3:6</a>). 곧 이런저런 하느님의 제도의 이유를 이해하고, 그 뜻을 깨달아 계명의 본질을 지켜야 합니다.</p><p>둘째 계명의 글자 그대로의 뜻은 하느님만을 나타내지 말라는 것이었고, 그분의 거룩한 종들은 금하지 않았습니다(<a href="https://bibleox.com/ko/ko-ctb/ish/25/#L1">출 25:1</a>; <a href="https://bibleox.com/ko/ko-ctb/ish/26/#L1">출 26:1</a>).</p><p>둘째 계명의 본질은 <strong>거짓 신을 숭배하지 말라</strong>는 것입니다.</p><p>따라서 정교회는 성인들을 나타냅니다. 이것은 금지된 적이 없고 오히려 명령되었으며(<a href="https://bibleox.com/ko/ko-ctb/ish/25/#L1">출 25:1</a>; <a href="https://bibleox.com/ko/ko-ctb/ish/26/#L1">출 26:1</a>), 의인들은 그 형상 앞에 절했습니다(<a href="https://bibleox.com/ko/ko-ctb/nav/7/#L6">여호 7:6</a>; <a href="https://bibleox.com/ko/ko-ctb/ps/5/#L7">시편 5:7</a>). 반면 하느님을 나타내는 것은 아무도 하느님을 보지 못했기 때문에 구약에서만 모세의 율법으로 금지되었습니다. 모세의 율법이 폐지되었으므로, 그 일부인 하느님을 나타내지 말라는 금지도 폐지되었습니다.</p><h3>2. 하느님께서 인성을 취하시어(사람이 되시어) 보이게 되셨습니다</h3><p>구약에서 하느님께서는 백성이 율법을 받을 때 당신의 형상을 드러내지 않으셨다고 설명하시며 당신을 나타내는 것을 금하십니다(<a href="https://bibleox.com/ko/ko-ctb/vtor/4/#L15-19">신 4:15-19</a>). 그러나 새 계약을 맺으시고 새 가르침을 주시며(<a href="https://bibleox.com/ko/ko-ctb/ef/2/#L15">에페 2:15</a>) 하느님께서는 인성 안에서 보이게 되시어 당신을 드러내시고 모세의 율법을 폐지하셨습니다. 그러므로 이제는 성인들만이 아니라 하느님 자신도 그분이 드러내신 모습으로 나타낼 수 있습니다:</p><blockquote><p>“<strong>일찌기 하느님을 본 사람은 없다</strong>. 그런데 아버지의 품안에 계신 <strong>외아들</strong>로서 하느님과 똑같으신 그분이 하느님을 <strong>알려 주셨다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/in/1/#L18">요한 1:18</a>)</p></blockquote><blockquote><p>“우리는 <strong>생명의 말씀</strong>에 관해서 말하려고 합니다. 그 말씀은 천지가 창조되기 전부터 계셨습니다. 우리는 그 말씀을 듣고 <strong>눈으로 보고 실제로 목격하고 손으로 만져 보았습니다</strong>. 그 생명이 나타났을 때에 우리는 그 생명을 보았기 때문에 그것을 증언합니다. 우리가 여러분에게 선포하는 이 영원한 생명은 <strong>아버지와 함께 있다가 우리에게 분명히 나타난 것입니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/1in/1/#L1-2">1요한 1:1-2</a>)</p></blockquote><h3>3. 천상 실재가 달라집니다</h3><p>성전은 지상의 건물이지만 하느님의 뜻에 따라 처음부터 천상 실재의 형상이었습니다. 하느님께서 예언자 모세에게 성전을 지으라고 명하신 것은 성전이 필요해서가 아니라(필요하지 않습니다: <a href="https://bibleox.com/ko/ko-ctb/is/66/#L1">이사 66:1</a>; <a href="https://bibleox.com/ko/ko-ctb/ps/50/#L13">시편 50:13</a>; <a href="https://bibleox.com/ko/ko-ctb/is/1/#L11">이사 1:11</a>), 바로 하늘의 이콘으로서, 예언자에게 보여 주신 천상 실재의 형상으로서 짓게 하신 것입니다(<a href="https://bibleox.com/ko/ko-ctb/ish/25/#L8-9,40">출 25:8-9,40</a>; <a href="https://bibleox.com/ko/ko-ctb/evr/9/#L24">히브 9:24</a>). 구약의 천상 실재와 신약의 천상 실재는 다릅니다. 전에는 <strong>천사들만</strong> 천상 실재에 영적으로 보이게 머물렀습니다. 하느님은 완전히 물질이 아니시고 보이지 않으시며(하느님의 아들께서 아직 보이는 인성을 취하지 않으셨습니다), 사람들은 아직 하늘의 삶에 이르지 못하고 죽은 뒤 저승으로 내려갔습니다(<a href="https://bibleox.com/ru/ru/w/9VFT_До_жертвы_Христовой_ветхозаветные_праведники_сходили_в_ад">자세히</a>).</p><p>그러나 그리스도께서 오신 뒤 변화가 일어납니다:</p><ol><li><p><strong>하느님이신 그리스도께서 하늘에서 보이게 왕좌에 앉으셨습니다</strong>(<a href="https://bibleox.com/ko/ko-ctb/ef/1/#L20-21">에페 1:20-21</a>; <a href="https://bibleox.com/ko/ko-ctb/otkr/3/#L21">묵시 3:21</a>);</p></li><li><p><strong>(그리스도 외에도) 사람들이 하늘에 나타났습니다.</strong> 하늘에서 그리스도와 함께하는 삶에 이를 수 있게 되었습니다(<a href="https://bibleox.com/ko/ko-ctb/otkr/6/#L9-11">묵시 6:9-11</a>; <a href="https://bibleox.com/ko/ko-ctb/otkr/14/#L1,3-5">묵시 14:1,3-5</a>; <a href="https://bibleox.com/ko/ko-ctb/evr/12/#L22-24">히브 12:22-24</a>).</p></li></ol><p>천상 실재가 달라졌습니다. 이전의 것은 이제 없습니다. 예루살렘 성전은 현재가 아닌 과거의 천상 실재의 형상이 되었습니다. 그래서 그리스도인들은 아주 오래전부터 새 천상 실재를 나타내어, 모든 것의 머리에 하늘에서 드러나게 왕좌에 앉으신 예수 그리스도(하느님)의 형상을 두고, 그 둘레에 이제 사람들도 포함한 그분의 거룩한 종들을 둡니다.</p><p>상징적인 사건은 그리스도의 희생 뒤에 예루살렘 성전에 일어난 손상입니다:</p><blockquote><p>“바로 그 때에 <strong>성전 휘장이 위에서 아래까지 두 폭으로 찢어지고 땅이 흔들리며 바위가 갈라지고</strong> 무덤이 열리면서 <strong>잠들었던 많은 옛 성인들이 다시 살아났다. 그들은 무덤에서 나와 예수께서 부활하신 뒤에</strong> 거룩한 도시에 들어 가서 많은 사람에게 나타났다.” (<a href="https://bibleox.com/ko/ko-ctb/mf/27/#L51-53">마태 27:51-53</a>)</p></blockquote><p>70년대에 성전은 로마인들에게 완전히 파괴되어, 그 뒤 수천 년 동안 새로운 천상 실재의 형상, 곧 정교회 성당에 자리를 내주었습니다.</p><img src="https://res.bibleox.com/s/img/image/simple/686bea5b5f47da2505d3ae31/s_p_pjRHeoFaUpKPoyEH.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686bea5b5f47da2505d3ae31/m_p_pjRHeoFaUpKPoyEH.jpg">크게 보기</a>] [<a href="https://res.bibleox.com/s/img/image/simple/686cf7375f47da2505d3ae4f/m_p_MOsOWI2vEXUj5ELf.jpg">다른 그림</a>]</p><img src="https://res.bibleox.com/s/img/image/simple/686d23425f47da2505d3ae55/s_p_LzqgbhnIsbqtghoc.jpg"><p>[<a href="https://res.bibleox.com/s/img/image/simple/686d23425f47da2505d3ae55/m_p_LzqgbhnIsbqtghoc.jpg">크게 보기</a>]</p><p>더 많은 고대 이콘: <a href="https://bibleox.com/ru/ru/w/древние-иконы">고대 이콘</a>.</p><h2>하느님께서 당신의 이콘을 만드셨습니다</h2><p>아무도 하느님을 본 적이 없습니다:</p><blockquote><p>“<strong><mark>일찌기 하느님을 본 사람은 없다</mark></strong>. 그런데 아버지의 품안에 계신 외아들로서 하느님과 똑같으신 그분이 하느님을 알려 주셨다.” (<a href="https://bibleox.com/ko/ko-ctb/in/1/#L18">요한 1:18</a>)</p></blockquote><p>그럼에도 하느님께서는 여러 번 형상(이콘)의 모습으로 나타나셨습니다:</p><h3>하느님께서는 세 천사의 모습으로 아브라함에게 나타나셨습니다</h3><p>세 천사는 하느님의 실제 모습, 세상 창조 전부터 그러하신 모습이 아닙니다. 곧 이것은 하느님의 <strong>형상</strong>(그리스어 εἰκόνα, 이콘)이며, 아브라함은 하느님의 이콘 앞에 절합니다:</p><blockquote><p>“<strong>야훼께서</strong> 마므레의 상수리나무 곁에서 <strong>아브라함에게 나타나셨다</strong>. 아브라함은 한창 더운 대낮에 천막 문 어귀에 앉아 있다가 고개를 들어 <strong>웬 사람 셋이</strong> 자기를 향해 서 있는 것을 보았다. 그는 그들을 보자마자 천막 문에서 뛰어 나가 맞으며 <strong>땅에 엎드려</strong>” (<a href="https://bibleox.com/ko/ko-ctb/gen/18/#L1-2">창 18:1-2</a>)</p></blockquote><p>아브라함이 세 천사의 모습으로 나타나신 하느님의 형상에 절했을 때, 하느님을 섬겼습니까, 하느님의 형상을 섬겼습니까? 분명히 하느님을 섬겼습니다.</p><h3>하느님께서는 보이게 야곱과 씨름하셨습니다</h3><blockquote><p>“그리고 야곱은 혼자 뒤떨어져 있었다. 그런데 어떤 분이 나타나 동이 트기까지 그와 씨름을 했다. &lt;…&gt; <strong>너는 하느님과 겨루어 냈고</strong> 사람과도 겨루어 이긴 사람이다. 그러니 다시는 너를 야곱이라 하지 말고 이스라엘이라 하여라.‘ 이 말을 듣고 &lt;…&gt; 야곱은 ’<strong>내가 여기서 하느님을 대면하고도 목숨을 건졌구나</strong>.‘ 하면서 그 곳 이름을 브니엘이라 불렀다.” (<a href="https://bibleox.com/ko/ko-ctb/gen/32/#L24,28,30">창 32:24,28,30</a>)</p></blockquote><h3>하느님께서는 형상을 통해 예언자 모세와 말씀하셨습니다</h3><blockquote><p>“말씀하셨다. ‘너희는 내 말을 들어라. 너희 가운데 <strong>예언자가 있다면 나는 그에게 환상으로 내 뜻을 알리고</strong> 꿈으로 말해 줄 것이다. <strong>나의 종 모세는 다르다</strong>. 나는 나의 온 집을 그에게 맡겼다. <strong>내가 모세와는 얼굴을 맞대고 이야기한다. 하나도 숨기지 않고 모두 말해 준다. 모세는 나 야훼의 모습까지 볼 수 있는 사람이다</strong>. 그런 나의 종 모세에게 감히 시비를 걸다니, 두렵지도 아니하냐?’” (<a href="https://bibleox.com/ko/ko-ctb/chis/12/#L6-8">민 12:6-8</a>)</p></blockquote><h3>하느님께서는 비둘기처럼 예수 그리스도 위에 내려오셨습니다</h3><blockquote><p>“<strong>성령이 비둘기 형상으로 그에게 내려 오셨다</strong>. 그리고 하늘에서는 ‘너는 내가 사랑하는 아들, 내 마음에 드는 아들이다’하는 소리가 들려 왔다.” (<a href="https://bibleox.com/ko/ko-ctb/lk/3/#L22">루가 3:22</a>; <a href="https://bibleox.com/ko/ko-ctb/mf/3/#L16">마태 3:16</a>; <a href="https://bibleox.com/ko/ko-ctb/mk/1/#L10">마르 1:10</a>; <a href="https://bibleox.com/ko/ko-ctb/in/1/#L32">요한 1:32</a>)</p></blockquote><h3>사람은 하느님의 이콘입니다</h3><blockquote><p>“<strong>당신의 모습대로 사람을 지어 내셨다. 하느님의 모습대로</strong> 사람을 지어 내시되 남자와 여자로 지어 내시고” (<a href="https://bibleox.com/ko/ko-ctb/gen/1/#L27">창 1:27</a>) <em>(“모습”은 칠십인역 그리스어로 εἰκών, “이콘, 형상”입니다.)</em></p></blockquote><blockquote><p>“아담의 계보는 이러하다. 하느님께서는 사람을 지어 내시던 날, 하느님께서는 <strong>당신 모습대로 사람을 만드시되</strong>” (<a href="https://bibleox.com/ko/ko-ctb/gen/5/#L1">창 5:1</a>) <em>(칠십인역: εἰκόνα)</em></p></blockquote><blockquote><p>“어떤 짐승에게도 앙갚음을 하리라. 사람이 같은 사람의 피를 흘리면, 그에게도 앙갚음을 하리라. <strong>사람은 하느님의 모습으로 만들어졌으니</strong> 남의 피를 흘리는 사람은 제 피도 흘리게 되리라.” (<a href="https://bibleox.com/ko/ko-ctb/gen/9/#L6">창 9:6</a>) <em>(칠십인역: εἰκόνι)</em></p></blockquote><blockquote><p>“하느님께서는 사람을 불멸하도록 창조하시고 <strong>당신 영원성의 형상(εἰκόνα)으로</strong> 만드셨다” (<a href="https://bibleox.com/ko/gr-lxx-byz/prs/2/#L23">지혜 2:23</a>, 그리스어에서 번역)</p></blockquote><h2>예수 그리스도는 아버지 하느님의 형상(이콘)이십니다</h2><blockquote><p>“여러분은 그리스도 예수께서 지니셨던 마음을 여러분의 마음으로 간직하십시오. <strong>그리스도 예수는 하느님과 본질이 같은 분이셨지만</strong> 굳이 하느님과 동등한 존재가 되려 하지 않으시고” (<a href="https://bibleox.com/ko/ko-ctb/fil/2/#L5-6">필립 2:5-6</a>) <em>(그리스어: ἐν μορφῇ θεοῦ, “하느님의 모습으로”)</em></p></blockquote><blockquote><p>“그 아들은 <strong>하느님의 영광을 드러내는 찬란한 빛이시요, 하느님의 본질을 그대로 간직하신 분이시며</strong> 그의 능력의 말씀으로 만물을 보존하시는 분이십니다. 그분은 인간의 죄를 깨끗하게 씻어 주셨고 지극히 높은 곳에 계신 전능하신 분의 오른편에 앉아 계십니다.” (<a href="https://bibleox.com/ko/ko-ctb/evr/1/#L3">히브 1:3</a>)</p></blockquote><blockquote><p>“그들이 믿지 않는 것은 이 세상의 악신이 그들의 마음을 어둡게 했기 때문입니다. 그들은 <strong>하느님의 형상이신 그리스도</strong>의 영광스러운 복음의 빛을 보지 못하게 되었습니다.” (<a href="https://bibleox.com/ko/ko-ctb/2kor/4/#L4">2고린 4:4</a>) <em>(“형상”: εἰκών)</em></p></blockquote><blockquote><p>“아버지께 감사를 드릴 수 있게 되기를 바랍니다. 아버지께서는 성도들이 광명의 나라에서 받을 상속에 참여할 자격을 우리에게 주셨습니다. 아버지께서는 우리를 흑암의 권세에서 건져 내시어 <strong>당신의 사랑하시는 아들</strong>의 나라로 옮겨 주셨습니다. 우리는 그 아들로 말미암아 죄를 용서받고 속박에서 풀려 났습니다. <strong>그리스도께서는 보이지 않는 하느님의 형상이시며</strong> 만물에 앞서 태어나신 분이십니다.” (<a href="https://bibleox.com/ko/ko-ctb/kol/1/#L12-15">골로 1:12-15</a>) <em>(“형상”: εἰκών)</em></p></blockquote><blockquote><p>“이번에는 필립보가 ‘주님, <strong>저희에게 아버지를 뵙게 하여 주시면</strong> 더 바랄 것이 없겠습니다’하고 간청하였다. 예수께서는 이렇게 대답하셨다. ‘필립보야, 들어라. 내가 이토록 오랫동안 너희와 같이 지냈는데도 너는 나를 모른다는 말이냐? <strong>나를 보았으면 곧 아버지를 본 것이다</strong>. 그런데도 아버지를 뵙게 해 달라니 무슨 말이냐?” (<a href="https://bibleox.com/ko/ko-ctb/in/14/#L8-9">요한 14:8-9</a>)</p></blockquote><h3>아버지의 형상을 공경하지 않는 사람은 아버지를 공경하지 않습니다</h3><blockquote><p>“모든 사람이 아버지를 존경하듯이 아들도 존경하게 하셨다. <strong>아들을 존경하지 않는 사람은 아들을 보내신 아버지도 존경하지 않는다</strong>.‘” (<a href="https://bibleox.com/ko/ko-ctb/in/5/#L23">요한 5:23</a>)</p></blockquote><h3>아버지의 형상을 거부하는 사람에게는 아버지가 없습니다</h3><blockquote><p>“<strong>누구든지 아들을 부인하는 사람은 아버지까지도 부인하며</strong> 그와 반대로 아들을 인정하는 사람은 아버지까지도 인정합니다.” (<a href="https://bibleox.com/ko/ko-ctb/1in/2/#L23">1요한 2:23</a>)</p></blockquote><h3>아버지의 형상을 미워하는 사람은 아버지를 미워합니다</h3><blockquote><p>“<strong>나를 미워하는 자는 나의 아버지까지도 미워한다</strong>. 내가 일찌기 아무도 하지 못한 일들을 그들 앞에서 하지 않았던들 그들에게는 죄가 없었을 것이다. 그런데 내가 한 일을 보고서도 그들은 <strong>나와 또 나의 아버지까지 미워한다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/in/15/#L23-24">요한 15:23-24</a>)</p></blockquote><h3>모든 피조물은 아버지의 형상 앞에 엎드려야 합니다</h3><blockquote><p>“그래서 <strong>하늘과 땅 위와 땅 아래에 있는 모든 것이 예수의 이름을 받들어 무릎을 꿇고</strong>” (<a href="https://bibleox.com/ko/ko-ctb/fil/2/#L10">필립 2:10</a>)</p></blockquote><h2>하느님께서는 성인의 형상을 통해 치유하십니다</h2><p>하느님께서는 거룩한 사도들이 남긴 옷을 통해서만이 아니라(<a href="https://bibleox.com/ko/ko-ctb/act/19/#L12">사도 19:12</a>) 사도의 형상(그림자)을 통해서도 사람들에게 치유를 주십니다:</p><blockquote><p>“사람들은 심지어 <strong>병자들을 길거리에 메고 나가</strong> 들것이나 요에 눕혀 놓고 <strong>베드로가 지나갈 때 행여나 그 그림자만이라도 그 몇 사람에게 스쳐 지나갔으면 하였다</strong>. 예루살렘 근방에 있는 여러 동네에서도 많은 사람들이 병자들과 악령이 들려 고생하는 사람들을 데리고 몰려 왔는데 <strong>그들의 병도 모두 고쳐졌다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/act/5/#L15-16">사도 5:15-16</a>)</p></blockquote><h2>하느님께서는 우상 숭배자들에게 응답하지 않으십니다</h2><blockquote><p>“비록 <strong>나를 떠나 우상을 섬기는 것들</strong>이지만, 이 이스라엘 족속의 마음을 그렇게 해서라도 잡아야겠다.” (<a href="https://bibleox.com/ko/ko-ctb/iez/14/#L5">에제 14:5</a>)</p></blockquote><blockquote><p>“바로 지금도 너희는 예물을 바치고 자식들을 불에 살라 바치면서 <strong>모든 우상들과 어울려 몸을 더럽히고 있다</strong>. 이스라엘 족속아. 내가 너희의 물음에 대답해 줄 것 같으냐? 주 야훼가 하는 말이다. <strong>어떤 일이 있어도 너희의 문의를 받아 주지 않으리라</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/iez/20/#L31">에제 20:31</a>)</p></blockquote><p>그러나 이콘 반대자들은 대개 이콘을 공경하는 정교인들이 하느님과 친교를 나눌 수 있음을 인정합니다. 그런데 성경에는 하느님께서 우상 숭배자들에게 응답하지 않으신다고 기록되어 있습니다.</p><h2>이콘이 구원할 수 있습니까?</h2><p>정교인들은 “이콘이 구원했다”, “이콘이 치유했다”는 표현을 쓴다고 비난을 받습니다. 구원하고 치유하시는 분은 하느님이시며, 우리는 대개 “이콘이 구원했다”고 말하지 않지만, 이콘의 재료 자체가 아니라 하느님께서 그 재료를 통해 치유하고 구원하셨다는 뜻이라면 이런 표현은 허용됩니다.</p><h3>사도가 구원합니다</h3><blockquote><p>“나는 내 동족 유다인들에게 시기심을 불러 일으켜 그들 가운데 <strong>일부나마 구해 주고 싶습니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/rim/11/#L14">로마 11:14</a>)</p></blockquote><blockquote><p>“그리고 내가 믿음이 약한 사람들을 대할 때에는 그들을 얻으려고 약한 사람이 되었습니다. 이와 같이 내가 어떤 사람을 대하든지 그들처럼 된 것은 <strong>어떻게 해서든지 그들 중에서 다만 몇 사람이라도 구원하려고</strong> 한 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/9/#L22">1고린 9:22</a>)</p></blockquote><h3>아내가 구원합니다</h3><blockquote><p>“<strong>여자 교우가 자기 남편을 구원할 수 있을지도</strong> 모를 일이며 또 <strong>남자 교우가 자기 아내를 구원할 수 있을지도</strong> 모를 일입니다.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/7/#L16">1고린 7:16</a>)</p></blockquote><h3>사람들을 구원하라는 사도의 부름</h3><blockquote><p>“의심을 품는 사람들을 동정해 주고 죄악의 불구덩이에 빠진 사람들을 끌어 내어 <strong>구해 주십시오</strong>. 또 본능적인 욕정에 빠진 사람들에 대해서는 욕정으로 더럽혀진 그들의 속옷까지도 미워하되 조심스럽게 자비를 베푸십시오.” (<a href="https://bibleox.com/ko/ko-ctb/iud/1/#L22-23">유다 1:22-23</a>)</p></blockquote><blockquote><p>“그대 자신을 조심하고 그대의 가르침의 내용을 잘 살피시오. 이렇게 꾸준히 일을 해 나가면 그대 자신을 구원할 뿐아니라 그대의 말을 듣는 사람들을 모두 <strong>구원할 수 있을 것입니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/1tim/4/#L16">1디모 4:16</a>)</p></blockquote><h3>그리스도 외에 누가 실제로 구원할 수 있습니까?</h3><p>사도도 아내와 남편도 주 예수 그리스도께서 구세주이신 뜻, 곧 인류의 유일한 구속자이자 죽음과 지옥에서 건지시는 분이며 부활과 하느님과 함께하는 영원한 삶을 주시는 분이라는 뜻의 구원자가 아닙니다. 그러나 보다시피 사도들은 “구원하겠다”는 표현을 씁니다. 우리는 이런 표현의 뜻을 바르게 이해합니다. 사람들은 구원을 도울 수 있습니다: “우리는 하느님을 위해서 <strong>함께 일하는 일꾼들</strong>이고”(<a href="https://bibleox.com/ko/ko-ctb/1kor/3/#L9">1고린 3:9</a>).</p><p>이콘도 마찬가지입니다. 구원하는 것은 이콘이 아니라 하느님이시며, 하느님께서 물건을 통해 은총을 보내십니다. 성경에는 그런 예가 많으며, 아래에서 살펴보겠습니다.</p><h2>“이콘은 영적 세계를 향한 창”이라는 표현에 관하여</h2><p>이콘은 일종의 <strong>영적 세계를 향한 창</strong>입니다. 이 표현에는 신비로운 뜻이 없고 비유적인 표현입니다. 이콘을 바라보면 마치 창을 통해 보이지 않는 영적 세계를 들여다보는 듯하다는 뜻일 뿐입니다.</p><p>영적인 것은 보이지 않지만 이콘 화가는 상징을 사용해 보이지 않는 것을 보이게 나타냅니다. 예를 들어 성인들에게 있는 하느님의 은총은 머리 둘레의 후광으로 나타내고, 그림자가 없는 것은 하느님의 빛(평범한 빛이 아니며 그림자를 드리우지 않습니다) 안에 머무름을 뜻합니다. 손짓, 옷 색깔, 옷의 특별한 표지(하느님의 어머니의 세 별), 둘레의 사물과 건물과 공간 전체에 뜻이 담겨 있습니다. 이 모든 것을 보며 우리는 보이지 않는 영적 세계에 관해 무언가를 배웁니다. 그래서 이콘은 말하자면 영적 세계를 향한 창이라는 표현을 쓰기도 합니다(<a href="https://monastery.ru/propovedi/okno-v-dukhovnyy-mir/">자세히</a>, 러시아어).</p><p>왜 이것을 따로 설명해야 합니까? 정교회의 반대자들이 비난할 거리를 찾아 그저 비난을 지어내어 추종자들에게 심고 정교회에 대한 증오를 키우는 일을 거듭 보기 때문입니다. 예를 들어 교회의 반대자들은 정교인을 추악한 마술사처럼 묘사하려고, 정교인들이 이콘을 일종의 에너지 통로처럼 삼아 하느님과 연결되고, 그래서 하느님과 소통하려면 이콘이 필요하다는 생각을 지어냅니다. 이 모든 것은 사실이 아닙니다.</p><p>정교회는 이콘이 있든 없든 어디서나 기도하라고 부릅니다. 이콘은 교육과 기도를 돕는 수단일 뿐입니다. 기도할 때 이콘은 생각을 모으게 하여 흩어지거나 산만해지지 않게 돕습니다. 이콘은 또 거기 그려진 분에 대한 존경을 표현하는 수단입니다. 이콘을 포함한 여러 물건은 하느님께서 사람들에게 은총을 주시는 수단이 될 수 있습니다. 이에 관해서는 다음 부분에서 다룹니다.</p><h2>물건과 형상을 통한 하느님의 활동</h2><p>정교인들은 하느님께 직접만이 아니라 물건과 형상을 통해서도 하느님의 도움을 기대한다는 비난을 받습니다. 그러나 이 믿음도 성경에 어긋나지 않습니다. 성경에서 하느님께서는 물건과 형상을 통해 여러 번 활동하셨습니다.</p><h3>유해</h3><p>유해를 통한 부활입니다. 여기에는 누구의 믿음도 기도도 없고, 죽은 사람이 우연히 예언자의 유해에 닿은 일밖에 없습니다:</p><blockquote><p>“한번은 <strong>어떤 사람들이 시체를 묻으려다가</strong> 그 강도떼들을 만나 시체를 엘리사의 무덤 속에 던지고 달아났다. 그런데 <strong><mark>그 시체가 엘리사의 뼈에 닿자 다시 살아나서 일어섰다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/4ts/13/#L21">열하 13:21</a>)</p></blockquote><h3>옷</h3><blockquote><p>“<strong><mark>바울로의 몸에 닿았던 수건이나 앞치마를 병자에게 대기만 해도 병이 낫고</mark></strong> 악령들이 쫓겨 나갔다.” (<a href="https://bibleox.com/ko/ko-ctb/act/19/#L12">사도 19:12</a>)</p></blockquote><h3>형상</h3><blockquote><p>“사람들은 심지어 <strong>병자들을 길거리에 메고 나가</strong> 들것이나 요에 눕혀 놓고 <strong>베드로가 지나갈 때 행여나 그 그림자만이라도 그 몇 사람에게 스쳐 지나갔으면 하였다</strong>. 예루살렘 근방에 있는 여러 동네에서도 많은 사람들이 병자들과 악령이 들려 고생하는 사람들을 데리고 몰려 왔는데 <strong>그들의 병도 모두 고쳐졌다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/act/5/#L15-16">사도 5:15-16</a>)</p></blockquote><h3>물</h3><blockquote><p>“이따금 주님의 천사가 그 못에 내려 와 <strong><mark>물을 휘젓곤 하였는데</mark></strong> <strong>물이 움직일 때에 맨먼저 못에 들어 가는 사람은 무슨 병이라도 다 나았던 것이다</strong>.)” (<a href="https://bibleox.com/ko/ko-ctb/in/5/#L4">요한 5:4</a>)</p></blockquote><h3>그 밖에</h3><p><a href="https://bibleox.com/ru/ru/w/Исцеления">치유</a></p><h2>이콘 공경에 관한 정교회의 가르침</h2><h3>제7차 세계공의회(니케아, 787년) 367 교부의 이콘 공경 교의</h3><blockquote><p>“고백을 짧게 하자면, 우리는 기록으로든 구두로든 우리에게 전해진 모든 교회의 전통을 변함없이 지킵니다. 그 가운데 하나가 <strong>복음 선포의 역사에 맞는 형상을 만드는 일로서, 여러모로 유익한 전통이며, 특히 하느님 말씀의 강생이 환영이 아니라 참된 것임을 보여 줍니다. 이 둘은 서로를 가리키며 분명히 서로의 뜻을 드러냅니다</strong>. 그러므로 우리는 왕의 길을 따르고 거룩한 교부들의 하느님 영감에 따른 권위와 보편 교회의 전통을 따르며(우리가 알듯이 성령께서 교회 안에 머무십니다), 온전한 확신과 정확함으로 정의합니다. <strong><mark>귀하고 생명을 주는 십자가의 형상과 같이, 공경할 만한 거룩한 이콘들도</mark></strong> 그림이나 모자이크나 다른 알맞은 재료로 하느님의 거룩한 성당에, 거룩한 그릇과 제의와 휘장에, 그림으로 집과 길가에 두어야 합니다. 곧 <strong>우리 주 하느님이시며 구세주이신 예수 그리스도와, 티 없으신 우리 부인 하느님의 어머니, 공경할 천사들, 모든 성인과 경건한 이들의 형상입니다</strong>. 이들을 형상으로 자주 볼수록 <strong><mark>사람들은 그만큼 원형을 기억하고 그리워하게 되며, 이들에게 인사와 공경의 절(ἀσπασμὸν καὶ τιμητικὴν προσκύνησιν)을 드려야 합니다. 그러나 오직 하느님의 본성에만 속하는 신앙의 참된 예배(λατρείαν)는 드리지 않습니다</mark></strong>. <strong>귀하고 생명을 주는 십자가의 형상과 복음서와 다른 성물에 하듯이, 옛 경건한 관습에 따라 향과 등불을 바칠 수 있습니다</strong>. <strong><mark>형상에 드리는 영예는 그 형상이 나타내는 분에게 옮아가며, 이콘을 공경하는 사람은 거기 그려진 분을 공경하는 것입니다</mark></strong>. 이렇게 하여 땅끝에서 땅끝까지 복음을 받아들인 보편 교회의 전통, 곧 거룩한 교부들의 가르침이 굳건해집니다.”</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/councils-the-seventh-ecumenical-council-the-second-council-of-nicaea-787/">제7차 세계공의회: 제2차 니케아 공의회(787년)</a>, 영어)</p><h3>콘스탄티노플 총대주교 예레미아(1576년)</h3><blockquote><p>“모든 장의 마지막인 스물한째 장은 성인 공경을 말하며, 성인들이 믿음을 통해 어떻게 하느님의 은총과 도움을 받았는지 생각하면 그들을 기억하는 것이 믿음을 굳건하게 하는 데 유익하다고 합니다. 이에 대해 우리는 말합니다. <strong>부름은 주로 오직 하느님께 합당하며, 으뜸으로 또 고유하게 그분께 속합니다. 성인들에게 드리는 부름은 고유한 뜻이 아니라, 말하자면 부수적으로 은총에 따른 것입니다. 부르는 이들을 듣는 것은 베드로나 바울로가 아니라 그들이 지닌 은총이기 때문입니다</strong>. 주님의 말씀대로입니다: “내가 세상 끝날까지 항상 너희와 함께 있겠다”(마태 28:20). … <strong><mark>우리도 엄밀한 뜻에서 부름을 한 분 하느님께 드린다는 것은 거룩한 예배에서 “하늘에 계신 우리 아버지” 등으로 외치는 데서 알 수 있습니다. 또 다른 곳에서는 “만군의 주님, 저희와 함께하소서. 슬픔 중에 주님 외에 다른 도움이 저희에게 없나이다”라고, 또 “주님 외에 다른 하느님을 저희가 알지 못하나이다”라고 합니다. 그러나 우리는 모든 성인, 무엇보다 주님의 어머니와 그분과 함께 천사와 성인의 무리를 중재자로 삼고, 성당과 봉헌과 부름과 거룩한 이콘으로 그들을 관계적으로 공경하며, 예배로 공경하지 않습니다. 예배는 으뜸으로 한 분 하느님께 드려야 하고, 그분 외에 누구도 하느님으로 인정해서는 안 되며, “다른 신”(시편 81:9)에게 절해서는 안 됨을 우리는 압니다</mark></strong>. 우리는 관계적 공경을 통해 신격화에 빠질까 두려워하기보다 차라리 우리 자신이 성인이 되기를 바라지 않겠습니다. 그럴 수는 없습니다. <strong><mark>거룩한 이콘에 관계적으로 절하지 않는 것은 불경하며 그리스도의 교회와 그 자녀들에게 낯선 일이기 때문입니다. 대 바실리오스가 말하듯 이콘에 드리는 영예는 원형에게 옮아갑니다</mark></strong>.”</p></blockquote><p>(<a href="https://azbyka.ru/otechnik/konfessii/otvety-lyuteranam/#0_25">루터교도들에게 보낸 첫째 답변</a>, 러시아어에서 발췌하여 번역)</p><p>이콘 공경을 자세히 살핀 더 긴 답변도 있습니다: <a href="https://azbyka.ru/otechnik/konfessii/otvety-lyuteranam/#0_34">둘째 답변</a> (러시아어).</p><p>짧은 셋째 답변도 있습니다: <a href="https://azbyka.ru/otechnik/konfessii/otvety-lyuteranam/#0_41">셋째 답변</a> (러시아어).</p><h3>정교 신앙에 관한 동방 보편 교회 총대주교들의 서신(1723년)</h3><blockquote><p>“거룩한 이콘과 성인 공경을 어떻게 생각해야 합니까? 앞서 말했듯이 성인들은 전구자이며 보편 교회도 그렇게 인정합니다. 우리는 <strong><mark>그들을 하느님의 벗으로서, 만유의 하느님께 우리를 위해 기도하는 이들로서 공경합니다</mark></strong>. … <strong>우리는 우리 구세주께서 세상을 구원하는 수난을 받으신 귀하고 생명을 주는 십자가의 나무와 생명을 주는 십자가의 표시, 베들레헴의 구유, 해골터, 생명을 주는 무덤과 다른 거룩한 공경의 대상, 그리고 거룩한 복음서와 피 없는 제사를 드리는 거룩한 그릇을 공경합니다</strong>. … <strong>우리는 주 예수 그리스도와 지극히 거룩한 하느님의 어머니와 모든 성인, 또 몇몇 선조와 예언자에게 나타난 대로 거룩한 천사들의 이콘을 공경하고 입 맞춥니다. 또 성령을 나타내기도 합니다</strong>. 비둘기의 모습으로 나타나신 대로입니다. 성인들과 그 이콘과 다른 것들을 공경한다고 우리가 우상 숭배를 한다고 말하는 이들이 있다면 우리는 이를 어리석고 경솔하다고 여깁니다. <strong>우리는 삼위일체 안의 유일한 하느님께만 예배(라트리아)를 드리고 다른 누구에게도 드리지 않습니다</strong>. … <strong><mark>거룩한 이콘은 관계적으로 공경합니다. 그 영예가 원형에게 돌아가기 때문입니다. 이콘을 공경하는 사람은 이콘을 통해 원형을 공경하며, 이콘에 드리는 영예는 그려진 분의 영예와 나뉘거나 떨어지지 않고, 왕의 사절에게 드리는 영예처럼 바로 그분께 드려지는 것입니다</mark></strong>. … <strong>우리는 성경을 읽을 때 때와 사람, 본보기와 이유를 살핍니다. 그래서 하느님께서 한편으로 “너희는 우상이나 어떤 형상도 만들지 말고 그것에 절하지도 섬기지도 말라”(출애 20:4-5; 신명 5:8-9)고 말씀하시고, 다른 한편으로 거룹을 만들라고 명하시는 것(출애 25:18)을 보며</strong> … <strong><mark>우리는 올바른 해석에 이르러, “우상이나 어떤 형상도 만들지 말라”는 말씀이 “다른 신들에게 절하지 말라”(출애 20:4), 곧 “우상을 숭배하지 말라”는 뜻이라고 결론짓습니다</mark></strong>. … <strong><mark>공의회는 이콘에 예배(라트리아)를 드리는 이들과, 이콘을 공경하는 정교인들이 우상 숭배를 한다고 말하는 이들을 모두 파문합니다. 우리도 공의회와 함께 성인이나 천사나 이콘이나 십자가나 성인 유해나 거룩한 그릇이나 복음서나 위로 하늘에 있는 것이나 땅이나 바다에 있는 어떤 것에든 예배(라트리아)를 드리는 이들을 파문하며, 예배는 삼위일체 안의 유일한 하느님께 드립니다. 또 이콘 공경이 이콘 예배라고 말하는 이들과, 교회가 전한 대로 십자가와 성인들을 공경하지 않는 이들을 파문합니다</mark></strong>.”</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/VQcM_Eastern_Orthodox_Confession_of_Faith_1672_1732/#HH-Q-4-How-ought-we-to-think-of-the-Holy-Icons-and-of-the-adoration-of-the-Saints">총대주교들의 서신, 질문 4</a>, 영어에서 발췌하여 번역)</p><h2>비판에 대한 답변</h2><h3>당신들은 하느님의 십계명 가운데 하나를 없앱니다</h3><p>당신은 안식일의 쉼에 관한 <a href="https://bibleox.com/ru/ru/w/10-заповедей">넷째 계명</a>을 지킵니까? 토요일에 일하지 않습니까? 토요일에 일하는 형제자매를 죽입니까? 모독이나 우상 숭배 때문에 그들을 죽입니까? 그렇게 하지 않는다면 무슨 이유입니까? 당신들은 하느님의 계명을 없애는 것이 아닙니까? 자기는 넷째 계명을 지키지 않으면서 둘째 계명을 지키라고 요구하는 것을 왜 모른 체합니까?</p><p>모세의 율법은 폐지되었습니다. 그리스도인은 그리스도를 따릅니다. 둘째 계명이 형상과 그 공경을 금하지 않았음은 분명합니다. 하느님께서는 당신의 성전에 형상을 만들라고 명하시고, 성전을 공경하라고 명하셨으며, 예언자들은 형상이 있는 성물 앞에 절했기 때문입니다. 이 계명은 하느님을 나타내는 것을 금했고, 우상 숭배(거짓 신의 공경과 섬김)를 금했습니다.</p><h3>당신들은 이스라엘 사람들이 느후스탄에게 분향했듯이 이콘에 분향합니다</h3><p>이스라엘 사람들의 잘못은 분향한 것이 아니라(분향은 하느님께서 친히 세우셨습니다), 거짓 신을 지어내어 느후스탄이라 부르고 하느님 대신 자기들이 지어낸 느후스탄을 섬기기 시작한 것입니다. 분명히 이스라엘 사람들에게 늘 그랬듯이 물건 자체를 신으로 여겼습니다(<a href="https://bibleox.com/ru/ru/w/языческая-вера-в-идола">자세히</a>). 이름만이 아니라 느후스탄을 기쁘게 하는 방법과 그에게서 지어낸 뜻(계명)을 따르는 일까지 지어냈습니다. 이것이 우상 숭배, 곧 거짓 신을 섬기는 일입니다. 이것은 하느님과 그분의 뜻에 따른 삶에서 멀어지게 하고, 느후스탄(곧 그 저자)의 뜻에 따른 삶으로 이끕니다.</p><p>정교인들은 참 하느님을 나타내고, 그분을 그분의 이름으로 부르며, 그분의 계명을 지키고, 물건(이콘)을 신으로 여기지 않으며, 이콘이 아니라 하느님께 절하고 분향합니다. 이것은 우상 숭배가 아닙니다. 느후스탄을 섬긴 이들과 달리 여기에는 거짓 신도, 거짓 신 섬김도 없기 때문입니다.</p><h3>하느님께서는 나타내라고 하셨지 공경하라고는 하지 않으셨습니다</h3><p>그렇지 않습니다. 성경을 보면 하느님께서는 형상을 만들라고도, 공경하라고도 명하셨습니다. 성경에는 형상을 공경한 실천도 있습니다.</p><p>하느님께서는 당신의 뜻에 따라 천상 실재의 형상(이콘)인 성전을 공경하라고 말씀하셨습니다. 예언자 다윗은 형상이 있는 성전 앞에 절했고, 예언자 눈의 아들 여호수아는 형상이 있는 계약궤 앞에 절했습니다. 그러므로 하느님께서는 형상을 공경하라고 명하셨고, 예언자들은 형상이 있는 성물을 공경하며 그 앞에 절했습니다. 예언자들이 이 공경을 하느님께 돌렸음은 의심할 여지가 없습니다. 곧 형상을 공경하며 원형을 공경했습니다. 정교인들도 똑같이 합니다.</p><h3>만일을 위해 이콘을 포기하자는 제안</h3><p>우리 설명을 듣고 이콘 공경 반대자들은 우리의 이콘 공경이 허용된다는 데 자주 동의하면서도, 우리 가운데 모두가 교회의 가르침을 잘 아는 것은 아니고 여전히 이콘을 우상처럼 대하니, 유혹을 피하려면 이콘을 치우는 것이 낫다고 말합니다.</p><p>우리는 이에 동의하지 않습니다. 이콘은 필요하며, 잘못된 태도는 깨우침, 곧 올바른 신앙의 설명으로 없애야 합니다.</p><p>어떤 사람들은 성경을 잘못 이해하지만, 그렇다고 유혹을 피하려고 성경을 포기하지는 않습니다. 깨우침과 성경 말씀의 올바른 설명이 필요할 뿐입니다.</p><h3>역사와 교부 전통에 관한 비판에 대한 답변</h3><p><a href="https://bibleox.com/ru/ru/w/иконы-почитают">이콘은 공경받습니다: 비판</a></p><h2>결론</h2><p>그러므로 우리는 이콘 공경을 거짓 신(우상) 숭배와 같게 보는 이들이 잘못이며, 정교인에 대한 우상 숭배 비난은 믿는 이들에 대한 부당한 비난이고 정교 신앙에 대한 왜곡된 관념이라고 믿습니다.</p><p>이콘은 하느님과 사람들과 사건들에 대한 올바른 설명이자 기억일 뿐이며, 하느님으로도 하느님 대신으로도 공경받지 않습니다. 우리는 하느님과 관련된 것에 기본적인 존경을 나타낼 뿐입니다. 사람들이 특별한 천 때문이 아니라 나라에 대한 존경으로 나라의 국기를 존중하고, 종이와 물감의 품질 때문이 아니라 대통령 때문에 대통령의 초상을 존중하듯이, 희귀한 나무나 책의 재료 때문이 아니라 십자가에서 하느님께서 우리 구원을 위해 못박히셨고 책에 그분의 구원의 말씀이 기록되어 있기 때문에 십자가와 복음서를 존중합니다.</p><p>이콘은 사람들이 하느님과 그분의 어머니와 벗들에게 존경을 나타내도록 돕습니다. 이콘은 기도할 때 집중하고 정신을 하느님께 향하게 도울 수 있습니다.</p><p>때로 전혀 우리 뜻과 상관없이 하느님께서 친히 이콘과 다른 물건을 통해 기적과 치유를 나타내시며, 이는 자연히 그 물건을 특별히 공경하려는 생각으로 이끕니다. 그러나 하느님 대신이 아니라 하느님을 위해서입니다. 하느님께서 일찍이 예언자 모세에게 거룩한 땅을 공경해야 한다고 말씀하신 것과 같습니다:</p><blockquote><p>“하느님께서는 ‘이리로 가까이 오지 말아라. <strong><mark>네가 서 있는 것은 거룩한 땅이니 네 발에서 신을 벗어라</mark></strong>.’ 하시고는” (<a href="https://bibleox.com/ko/ko-ctb/ish/3/#L5">출 3:5</a>)</p></blockquote><p>예언자 다윗도 거룩한 것을 경외하며 그 앞에 엎드렸습니다:</p><blockquote><p>“야훼 우리 하느님을 기리어라. <strong><mark>그분의 발판 아래 엎드려라</mark></strong>. <strong><mark>그분은 거룩하시다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/ps/99/#L5">시편 99:5</a>)</p></blockquote><p>그리고 그런 경외가 없는 이들에게 하느님께서는 죽음의 벌을 보내셨습니다:</p><blockquote><p>“오히려 하늘의 대주재를 거역하시고 <strong>그분의 집에서 쓰던 잔들을 이 자리에 내어다가</strong> 대신들과 왕비들과 후궁들과 함께 <strong>그 잔으로 술을 마셨습니다</strong>. 그리고는 금은동철이나 보석으로 만든 신상들, 보지도 듣지도 못하고 아무것도 알지 못하는 신들을 찬양하셨습니다. 그러시면서 임금님의 목숨을 손안에 쥐고 계시는 하느님, 임금님의 일거일동을 지켜 보시는 하느님을 공경하지 않으셨습니다. &lt;…&gt; <strong>바빌론 왕 벨사살은 그 날 밤으로 살해되었고</strong>,” (<a href="https://bibleox.com/ko/ko-ctb/dan/5/#L23,30">다니 5:23,30</a>)</p></blockquote><p>곧 더 쉽게 말해 <strong>거짓</strong> 신이나 <strong>거짓</strong> 신을 가리키는 것을 공경하면 우상 숭배, 곧 거짓 신(우상)의 공경과 숭배가 됩니다. 정교회는 사람과 물건과 형상을 그렇게 종교적으로 공경하라고 가르치지 않으며 이를 단죄합니다.</p><p>참 하느님을 공경하면 그분과 관련된 모든 것을 공경하게 됩니다. 하느님은 하느님으로서, 그분의 벗들과 충실한 종들은 그분의 벗들과 충실한 종들로서 공경받으며, 하느님으로서 공경받지 않습니다. 왕은 왕으로서, 그 측근들은 측근으로서 존경받으며 왕으로서 존경받지 않습니다. 이런 공경에는 거짓 신이 없습니다. 이것이 정교회가 가르치는 신앙입니다.</p><h2>관련 구절</h2><ol><li><p><a href="https://bibleox.com/ru/ru/w/почитание-святых-в-Библии">성인 공경</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/почитание-мощей-святых">성인 유해 공경</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/Выбор_места_как_форма_почитания">장소 선택은 공경의 한 형태입니다</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/молитвы-святым">성인들에게 드리는 기도</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/человек-храм-Божий">사람은 하느님의 성전</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/состав-человека">사람의 구성</a></p></li></ol>'
