  references: '<ol><li><p>예를 들어 하느님께서는 성전에 소를 형상으로 만들라고 명하셨지만(<a href="https://bibleox.com/ko/ko-ctb/3ts/7/#L25">열상 7:25</a>; <a href="https://bibleox.com/ko/ko-ctb/2par/4/#L3-4">역하 4:3-4</a>; <a href="https://bibleox.com/ko/ko-ctb/2par/4/#L15">역하 4:15</a>), 소를 하느님이라 부르는 것은 이미 우상 숭배입니다(<a href="https://bibleox.com/ko/ko-ctb/ish/32/#L4">출 32:4</a>; <a href="https://bibleox.com/ko/ko-ctb/3ts/12/#L28">열상 12:28</a>; <a href="https://bibleox.com/ko/ko-ctb/2par/13/#L8">역하 13:8</a>). 옛 사람들은 송아지 상 자체를 신으로 여겼지만, 하느님은 물질이 아니시고 더욱이 송아지가 아니십니다. 이처럼 여기서는 형상도 그 의미도 거짓입니다. 다른 경우에도 비슷한 일이 있습니다. 하느님께서는 구리뱀을 만들라고 명하셨고(<a href="https://bibleox.com/ko/ko-ctb/chis/21/#L8-9">민 21:8-9</a>), 나중에 그리스도께서는 그것이 당신의 십자가 고난의 형상이었다고 가리키십니다(<a href="https://bibleox.com/ko/ko-ctb/in/3/#L14">요한 3:14</a>). 그러나 하느님의 명으로 만든 형상에 거짓된 의미가 채워져 느후스탄으로 숭배되자, 그것도 우상 숭배로 잘려 나갔습니다(<a href="https://bibleox.com/ko/ko-ctb/4ts/18/#L4">열하 18:4</a>). 곧 첫째 경우에는 사람들이 형상을 왜곡했고(하느님은 송아지가 아니십니다), 둘째 경우에는 의미를 왜곡했습니다(뱀은 그리스도의 고난의 형상이지, 옛 사람들 일부가 지어낸 느후스탄이 아니었습니다).</p></li><li><p>그래서 우상에 관한 편지가 아닌데도 우상에 대한 갑작스러운 경고로 끝나는 것입니다(<a href="https://bibleox.com/ko/ko-ctb/1in/5/#L21">1요한 5:21</a>). 곧 일반적인 뜻에서 거짓을 따르지 말라는 부름입니다. 유스틴(포포비치) 성인은 이렇게 말합니다: “<em>그리스도 외에 다른 어떤 신을 인정하고 고백하고 전하는 것은 우상 숭배일 뿐입니다. 그렇습니다. 우상 숭배란 한 분 참 하느님이신 주 예수 그리스도를 예배하는 대신 어떤 우상을 예배하는 것입니다. 우상 숭배는 가장 조악하고 야만적인 미신에서 가장 고상한 상징까지 모든 것을 포함합니다. 우상 숭배에서는 돌과 나무와 동물과 행성과 조각상만이 아니라 사람과 영웅과 (선악의) 영, 발견과 사상과 정념과 문화와 정치와 과학과 철학과 예술, 곧 우상 숭배자들이 자기 뜻대로 참 하느님이자 주님이신 예수 그리스도에게 맞세우는(곧 그분의 자리에 놓는) 모든 것이 신으로 공경받습니다. 그래서 신약 진리의 “천둥의 아들” 성 요한 신학자는 그의 놀라운 기쁜 소식을 이렇게 끝맺습니다: </em><strong><em>자녀들이여, 우상을 멀리하십시오</em></strong><em>, 우상 숭배를 멀리하십시오. 아멘</em>” (<a href="https://azbyka.ru/otechnik/Iustin_Popovich/tolkovanie-na-pervoe-sobornoe-poslanie-ioanna-bogoslova/"><u>성 요한 신학자의 첫째 공동 서간 주해</u></a>, 러시아어에서 번역).</p></li></ol><p>번역: 로디온 블라소프 (AI 도구 활용). 저본: 러시아어 원문. 참고: 영어·일본어 번역. 성경 인용과 링크는 공동번역 성서에 따름.</p>'
