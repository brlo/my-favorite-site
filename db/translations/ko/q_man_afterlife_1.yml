- src: ад
  path: Hl3d_지옥
  title: 지옥
  copy_cover: true
  body: '<h2>정의</h2><p>지옥은 여러 가지로 이해할 수 있습니다.</p><ol><li><p>지옥(음부, 하데스) — 모든 이의 부활과 마지막 심판 때까지 죽은 이들의 혼이 머무는 곳.</p></li><li><p>지옥 — 그리스도의 영광스러운 재림과 모든 이의 부활과 마지막 심판 뒤에, 부활한 정죄받은 죄인들(곧 그들의 혼과 몸이 함께)이 머무는 곳. 마지막 심판 뒤에는 이 운명을 더 이상 바꿀 수 없습니다. 정죄받은 이들의 고통도 의인들의 복도 똑같이 영원히 이어집니다.</p></li></ol><h2>지옥, 게헨나, 불못, 영원한 불, 바깥 어두운 데, 옥 — 고통의 장소</h2><p>성경에서 지옥은 대개 고통의 장소를 뜻합니다. 이 장소는 여러 말로 불릴 수 있지만 그 본질은 바뀌지 않으며 고통의 장소로 남습니다. 지옥에서 사람들은 고통을 받습니다:</p><blockquote><p>“그 나라의 본 자손들은 <strong>바깥 어두운 데 쫓겨나</strong> 거기서 울며 이를 갈게 되리라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/8/#L12">마 8:12</a>)</p></blockquote><blockquote><p>“임금이 사환들에게 말하되 그 손발을 묶어 <strong>바깥 어두운 데에 내던지라 거기서 슬피 울며 이를 갈게 되리라</strong> 하니라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/22/#L13">마 22:13</a>)</p></blockquote><blockquote><p>“<strong>이 무익한 종을 바깥 어두운 데로 내쫓으라 거기서 슬피 울며 이를 갈리라</strong> 하니라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/25/#L30">마 25:30</a>)</p></blockquote><p>심판자이신 그리스도께서 친히 누가 어디로 갈지 정하십니다:</p><blockquote><p>“또 왼편에 있는 자들에게 이르시되 <strong>저주를 받은 자들아 나를 떠나 마귀와 그 사자들을 위하여 예비된 영원한 불에 들어가라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/25/#L41">마 25:41</a>)</p></blockquote><blockquote><p>“사람들을 삼가라 그들이 너희를 공회에 넘겨 주겠고 그들의 회당에서 채찍질하리라 &lt;…&gt; 몸은 죽여도 영혼은 능히 죽이지 못하는 자들을 두려워하지 말고 <strong>오직 몸과 영혼을 능히 지옥에 멸하실 수 있는 이를 두려워하라</strong> &lt;…&gt; 누구든지 사람 앞에서 나를 부인하면 <strong>나도 하늘에 계신 내 아버지 앞에서 그를 부인하리라</strong> 내가 세상에 화평을 주러 온 줄로 생각하지 말라 화평이 아니요 검을 주러 왔노라 &lt;…&gt; 또 <strong>자기 십자가를 지고 나를 따르지 않는 자도 내게 합당하지 아니하니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/10/#L17,28,33-34,38">마 10:17,28,33-34,38</a>)</p></blockquote><p>사람은 죽은 뒤 새 집으로 갑니다. 그리고 이 일은 울 만한 일입니다:</p><blockquote><p>“또한 그런 자들은 높은 곳을 두려워할 것이며 길에서는 놀랄 것이며 살구나무가 꽃이 필 것이며 메뚜기도 짐이 될 것이며 정욕이 그치리니 이는 사람이 <strong>자기의 영원한 집으로</strong> 돌아가고 조문객들이 거리로 왕래하게 됨이니라” (<a href="https://bibleox.com/ko/ko-nkrv/ekl/12/#L5">전 12:5</a>)</p></blockquote><p>죽은 뒤에 사람에게는 심판이 기다립니다:</p><blockquote><p>“<strong>한번 죽는 것은 사람에게 정해진 것이요 그 후에는 심판이 있으리니</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/evr/9/#L27">히 9:27</a>)</p></blockquote><p>지옥에서 그곳에 사는 이들은 의식을 지닌 채 존재합니다. 바벨론 왕을 지옥에 사는 모든 이가 맞이했습니다:</p><blockquote><p>“너는 바벨론 왕에 대하여 이 노래를 지어 이르기를 압제하던 자가 어찌 그리 그쳤으며 강포한 성이 어찌 그리 폐하였는고 &lt;…&gt; <strong>아래의 스올이 너로 말미암아 소동하여 네가 오는 것을 영접하되</strong> 그것이 세상의 모든 영웅을 너로 말미암아 움직이게 하며 열방의 모든 왕을 그들의 왕좌에서 일어서게 하므로 <strong>그들은 다 네게 말하여 이르기를 너도 우리 같이 연약하게 되었느냐</strong> 너도 우리 같이 되었느냐 하리로다” (<a href="https://bibleox.com/ko/ko-nkrv/is/14/#L4,9-10">사 14:4,9-10</a>)</p></blockquote><p>주님께서는 몸이 죽으신 뒤 온 세상의 홍수 때부터 그곳에 있던 영들에게 선포하시려고 음부에 내려가셨습니다:</p><blockquote><p>“그리스도께서도 단번에 죄를 위하여 죽으사 의인으로서 불의한 자를 대신하셨으니 이는 우리를 하나님 앞으로 인도하려 하심이라 <strong>육체로는 죽임을 당하시고 영으로는 살리심을 받으셨으니</strong> <strong>그가 또한 영으로 가서 옥에 있는 영들에게 선포하시니라</strong> 그들은 전에 <strong>노아의 날 방주를 준비할 동안</strong> 하나님이 오래 참고 기다리실 때에 복종하지 아니하던 자들이라 방주에서 물로 말미암아 구원을 얻은 자가 몇 명뿐이니 겨우 여덟 명이라” (<a href="https://bibleox.com/ko/ko-nkrv/1pet/3/#L18-20">벧전 3:18-20</a>)</p></blockquote><blockquote><p>“그러므로 이르기를 그가 위로 올라가실 때에 사로잡혔던 자들을 사로잡으시고 그 사람들에게 선물을 주셨다 하였도다 <strong>올라가셨다 하였은즉 땅 아래 낮은 곳으로 내리셨던 것이 아니면 무엇이냐</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ef/4/#L8-9">엡 4:8-9</a>)</p></blockquote><p>그리스도의 혼은 음부에 버려지지 않았습니다. 몸이 땅(무덤)에 버려지지 않았다는 것이 아니라 혼이 음부에 버려지지 않았다는 것입니다:</p><blockquote><p>“미리 본 고로 그리스도의 부활을 말하되 <strong>그가 음부에 버림이 되지 않고</strong> 그의 육신이 썩음을 당하지 아니하시리라 하더니” (<a href="https://bibleox.com/ko/ko-nkrv/act/2/#L31">행 2:31</a>) <em>(비잔틴 본문(다수 사본): “<strong>그의 혼이</strong> 음부에 버림이 되지 않고”(ἡ ψυχὴ αὐτοῦ).)</em></p></blockquote><p>죽은 이들이 보이고, 죽은 이들이 심판을 받으며, 음부가 죽은 이들을 내줍니다:</p><blockquote><p>“또 내가 보니 <strong>죽은 자들이 큰 자나 작은 자나 그 보좌 앞에 서 있는데</strong> 책들이 펴 있고 또 다른 책이 펴졌으니 곧 생명책이라 <strong>죽은 자들이 자기 행위를 따라 책들에 기록된 대로 심판을 받으니</strong> 바다가 그 가운데에서 죽은 자들을 내주고 또 <strong>사망과 음부도 그 가운데에서 죽은 자들을 내주매</strong> 각 사람이 자기의 행위대로 심판을 받고” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/20/#L12-13">계 20:12-13</a>)</p></blockquote>'
