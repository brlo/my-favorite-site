  title: 혼의 불멸
  copy_cover: true
  body: '<h2>몸과 혼</h2><h3>박해자들은 혼을 죽이지 못합니다</h3><p>주 예수 그리스도께서는 박해자들을 두려워하지 말라고 하십니다. 그들은 몸만 죽일 수 있을 뿐 혼은 죽이지 못하기 때문입니다. 그들은 혼을 해칠 수 없습니다. 죽은 뒤 혼의 존재를 부정하는 사람들은 혼이 몸과 함께 죽는다고 주장합니다. 그렇다면 물론 박해자들이 몸만이 아니라 혼도 죽인다는 뜻이 되지만, 이것은 그리스도의 말씀과 모순됩니다:</p><blockquote><p>“<strong><mark>몸은 죽여도 영혼은 능히 죽이지 못하는 자들을 두려워하지 말고</mark></strong> 오직 몸과 영혼을 능히 지옥에 멸하실 수 있는 이를 두려워하라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/10/#L28">마 10:28</a>)</p></blockquote><blockquote><p>“내가 내 친구 너희에게 말하노니 <strong>몸을 죽이고 그 후에는 능히 더 못하는 자들을 두려워하지 말라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/lk/12/#L4">눅 12:4</a>)</p></blockquote><h3>다볼 산에 나타난 세상을 떠난 선지자 모세의 혼</h3><p>구세주께서 다볼 산에서 변모하실 때, 사도들은 이미 죽은 선지자 모세가 나타나 그리스도와 함께 그분 앞에 놓인 십자가의 고난에 대해 이야기하는 것을 봅니다. 곧 선지자는 죽었지만(<a href="https://bibleox.com/ko/ko-nkrv/vtor/34/#L7">신 34:7</a>; <a href="https://bibleox.com/ko/ko-nkrv/nav/1/#L2">수 1:2</a>) (<a href="#HH-하느님께서-선지자-모세를-다시-살리셨는가">설명</a> 참조) 사라지지도 의식을 잃지도 않았습니다. 그는 그리스도와 <strong>대화합니다</strong>:</p><blockquote><p>“그 때에 <strong><mark>모세와 엘리야가 예수와 더불어 말하는 것이 그들에게 보이거늘</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/17/#L3">마 17:3</a>)</p></blockquote><blockquote><p>“기도하실 때에 용모가 변화되고 그 옷이 희어져 광채가 나더라 문득 <strong>두 사람이 예수와 함께 말하니 이는 모세와 엘리야라</strong> 영광중에 나타나서 장차 예수께서 예루살렘에서 별세하실 것을 <strong>말할새</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/lk/9/#L29-31">눅 9:29-31</a>)</p></blockquote><h3>죽은 뒤의 삶에 관한 사도의 말</h3><p>사도 바울은 땅의 장막(몸)이 무너지면 하늘에 우리의 집이 있다고 말합니다:</p><blockquote><p>“만일 <strong>땅에 있는 우리의 장막 집이 무너지면</strong> <strong>하나님께서 지으신 집</strong> 곧 손으로 지은 것이 아니요 <strong>하늘에 있는 영원한 집이</strong> 우리에게 있는 줄 아느니라 &lt;…&gt; 참으로 이 장막에 있는 우리가 짐진 것 같이 탄식하는 것은 <strong>벗고자 함이 아니요 오히려 덧입고자 함이니</strong> 죽을 것이 생명에 삼킨 바 되게 하려 함이라” (<a href="https://bibleox.com/ko/ko-nkrv/2kor/5/#L1,4">고후 5:1,4</a>)</p></blockquote><p>다른 곳에서, 어쩌면 가장 중요한 곳에서 사도는 하느님과 함께하는 삶으로 분명히 옮겨 가기 위해 되도록 빨리 죽기를 바란다고 쓰며, 죽음을 “유익”이라고 부릅니다. 그러나 사도가 죽은 뒤에 사라지거나 잠든다면 그는 아무것도 얻지 못하고 (의식을) 잃기만 합니다. 그렇다면 서둘러 죽어 활동하지 않는 상태로 넘어갈 까닭이 없습니다. 땅의 몸으로 살면서 설교하고 교회를 세우고 하느님과 사귀며 교회를 돕는 것(<strong>되도록 오래 교회를 떠나지 않는 것</strong> — 이것이 혼의 불멸에 관한 가르침의 반대자들이 늘 무시하는 핵심 생각입니다*)이 더 옳을 것입니다. 그러나 사도는 자기가 하늘에서 하느님과 함께하는 삶으로 옮겨 가리라는 것을 알기에, 몸으로 사는 땅의 삶에서 되도록 빨리 풀려나기를 바랍니다:</p><blockquote><p>“이는 내게 사는 것이 그리스도니 <strong>죽는 것도 유익함이라</strong> 그러나 만일 육신으로 사는 이것이 내 일의 열매일진대 무엇을 택해야 할는지 나는 알지 못하노라 내가 그 둘 사이에 끼었으니 <strong>차라리 세상을 떠나서 그리스도와 함께 있는 것이 훨씬 더 좋은 일이라</strong> 그렇게 하고 싶으나 내가 육신으로 있는 것이 너희를 위하여 더 유익하리라” (<a href="https://bibleox.com/ko/ko-nkrv/fil/1/#L21-24">빌 1:21-24</a>)</p></blockquote><p>*죽은 뒤 혼의 존재를 부정하는 이들은 대개 이 설명의 논거를 무시하고 이렇게 말합니다. “사도는 잠든 동안 시간이 어떻게 흘렀는지 모르고 곧바로 부활 때에 그리스도와 함께 깨어날 것이다.” 그러나 사도가 곧바로 그리스도와 함께하는 삶으로 옮겨 가지 않고 의식 없는 비활동 상태로 넘어갈 뿐이라면, 몸으로 남아 있는 것이 교회에 더 필요하다고 바로 그 자리에서 쓰는 사도가 서둘러 <strong>교회를 떠날</strong> 까닭이 없습니다.</p><p>몸을 떠나면 주님과 함께 있으리라고 믿기에 사도는 다시 몸을 떠나기를 더 원합니다. 그는 몸으로 살 때나 몸을 떠날 때나 하느님을 기쁘시게 하는 것이 중요하다고 가리킵니다:</p><blockquote><p>“그러므로 우리가 항상 담대하여 <strong>몸으로 있을 때에는 주와 따로 있는 줄을 아노니</strong> &lt;…&gt; 우리가 담대하여 원하는 바는 <strong>차라리 몸을 떠나 주와 함께 있는 그것이라</strong> 그런즉 우리는 몸으로 있든지 떠나든지 주를 기쁘시게 하는 자가 되기를 힘쓰노라” (<a href="https://bibleox.com/ko/ko-nkrv/2kor/5/#L6,8-9">고후 5:6,8-9</a>)</p></blockquote><p>사도는 성전 안에 있듯이 몸 안에 있지만(<a href="https://bibleox.com/ru/ru/w/человек-храм-Божий">사람은 하느님의 성전</a>), 곧 몸을 떠나 그 밖으로 나가야 합니다:</p><blockquote><p>“<strong>내가 이 장막에 있을 동안에</strong> 너희를 일깨워 생각나게 함이 옳은 줄로 여기노니 이는 우리 주 예수 그리스도께서 내게 지시하신 것 같이 <strong>나도 나의 장막을 벗어날 것이 임박한 줄을 앎이라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2pet/1/#L13-14">벧후 1:13-14</a>)</p></blockquote><p>사도는 몸 안에서도 몸 밖에서도 의식을 지닌 채 하늘에 있을 수 있었다고 씁니다:</p><blockquote><p>“내가 그리스도 안에 있는 한 사람을 아노니 그는 십사 년 전에 셋째 하늘에 이끌려 간 자라 (<strong>그가 몸 안에 있었는지 몸 밖에 있었는지 나는 모르거니와</strong> 하나님은 아시느니라)” (<a href="https://bibleox.com/ko/ko-nkrv/2kor/12/#L2">고후 12:2</a>)</p></blockquote><p>사도는 혼의 영원성을 가리킵니다:</p><blockquote><p>“그러므로 우리가 낙심하지 아니하노니 <strong>우리의 겉사람은 낡아지나 우리의 속사람은 날로 새로워지도다</strong> &lt;…&gt; 우리가 주목하는 것은 보이는 것이 아니요 보이지 않는 것이니 보이는 것은 잠깐이요 <strong>보이지 않는 것은 영원함이라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2kor/4/#L16,18">고후 4:16,18</a>)</p></blockquote><h3>몸 밖이 아니라 몸으로 살 때 한 행위가 심판을 받습니다</h3><p>하느님께서는 몸으로 사는 동안 한 활동만 심판하십니다:</p><blockquote><p>“이는 우리가 다 반드시 그리스도의 심판대 앞에 나타나게 되어 각각 선악간에 <strong>그 몸으로 행한 것을</strong> 따라 받으려 함이라” (<a href="https://bibleox.com/ko/ko-nkrv/2kor/5/#L10">고후 5:10</a>)</p></blockquote><h3>구약의 언급</h3><p>사람의 죽음을 몸만이 아니라 혼의 소멸로 여기는 이들은 그릇되게 생각합니다:</p><blockquote><p>“그들은 <strong>그릇되게 생각하며</strong> 서로 말하였다. “우리 인생은 짧고 슬프다. … 우리 콧속의 숨은 연기요, 말은 우리 심장의 고동에서 나는 불티일 뿐이니, <strong>그것이 꺼지면 몸은 재가 되고 영은 엷은 공기처럼 흩어지리라</strong>”” (<a href="https://bibleox.com/ko/gr-lxx-byz/prs/2/#L1-3">지혜 2:1-3</a>, 그리스어에서 번역)</p></blockquote><p>그뿐 아니라:</p><blockquote><p>“<strong>비뚤어진 생각은 하느님에게서 떼어 놓는다</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/prs/1/#L3">지혜 1:3</a>, 그리스어에서 번역)</p></blockquote><blockquote><p>“<strong>의인들의 영혼은 하느님의 손안에 있어</strong> 어떤 고통도 그들에게 닿지 않는다. <strong>어리석은 자들의 눈에는 그들이 죽은 것처럼 보이고</strong>, 그들의 떠남은 재앙으로, <strong>우리에게서 떠나감은 파멸로</strong> 여겨지지만, <strong>그들은 평화를 누린다</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/prs/3/#L1-3">지혜 3:1-3</a>, 그리스어에서 번역)</p></blockquote><h2>죽은 뒤의 삶을 부정하는 사두개인들에 대한 책망</h2><p>유대교의 모든 당파(바리새인, 사두개인, 에세네파 등) 가운데 죽은 뒤 사람이 사라진다고 믿은 것은 사두개인 하나뿐이었습니다(<a href="https://bibleox.com/ko/ko-nkrv/act/23/#L8">행 23:8</a>). 주님께서는 그들을 엄히 꾸짖으시며 오해와 성경에 대한 무지를 나무라십니다:</p><blockquote><p>“예수께서 대답하여 이르시되 <strong>너희가 성경도, 하나님의 능력도 알지 못하는 고로 오해하였도다</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/22/#L29">마 22:29</a>)</p></blockquote><blockquote><p>“<strong>하나님은 죽은 자의 하나님이 아니요 산 자의 하나님이시라</strong> <strong>너희가 크게 오해하였도다</strong> 하시니라” (<a href="https://bibleox.com/ko/ko-nkrv/mk/12/#L27">막 12:27</a>)</p></blockquote><h2>예수 그리스도의 사람의 혼</h2><p>주 예수 그리스도께서는 몸이 죽으신 뒤 혼으로 음부에 내려가셨습니다:</p><blockquote><p>“이는 주께서 <strong>내 영혼을 스올에 버리지 아니하시며</strong> 주의 거룩한 자를 멸망시키지 않으실 것임이니이다” (<a href="https://bibleox.com/ko/ko-nkrv/ps/16/#L10">시 16:10</a>; <a href="https://bibleox.com/ko/ko-nkrv/act/2/#L27">행 2:27</a>)</p></blockquote><blockquote><p>“미리 본 고로 그리스도의 부활을 말하되 <strong>그가 음부에 버림이 되지 않고</strong> 그의 육신이 썩음을 당하지 아니하시리라 하더니” (<a href="https://bibleox.com/ko/ko-nkrv/act/2/#L31">행 2:31</a>) <em>(비잔틴 본문(다수 사본): “<strong>그의 혼이</strong> 음부에 버림이 되지 않고”(ἡ ψυχὴ αὐτοῦ).)</em></p></blockquote><p>음부에서 그리스도께서는 온 세상의 홍수 때부터 그곳에 있던 영들(혼들)에게 선포하셨습니다:</p><blockquote><p>“그리스도께서도 단번에 죄를 위하여 죽으사 의인으로서 불의한 자를 대신하셨으니 이는 우리를 하나님 앞으로 인도하려 하심이라 <strong>육체로는 죽임을 당하시고 영으로는 살리심을 받으셨으니</strong> <strong>그가 또한 영으로 가서 옥에 있는 영들에게 선포하시니라</strong> 그들은 전에 <strong>노아의 날 방주를 준비할 동안</strong> 하나님이 오래 참고 기다리실 때에 복종하지 아니하던 자들이라 방주에서 물로 말미암아 구원을 얻은 자가 몇 명뿐이니 겨우 여덟 명이라” (<a href="https://bibleox.com/ko/ko-nkrv/1pet/3/#L18-20">벧전 3:18-20</a>; <a href="https://bibleox.com/ko/ko-nkrv/1pet/4/#L5-6">벧전 4:5-6</a>)</p></blockquote><blockquote><p>“그러므로 이르기를 그가 위로 올라가실 때에 사로잡혔던 자들을 사로잡으시고 그 사람들에게 선물을 주셨다 하였도다 <strong>올라가셨다 하였은즉 땅 아래 낮은 곳으로 내리셨던 것이 아니면 무엇이냐</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ef/4/#L8-9">엡 4:8-9</a>)</p></blockquote><p>결국 그리스도께서는 죽은 자와 산 자의 주님이십니다:</p><blockquote><p>“이를 위하여 <strong>그리스도께서 죽었다가 다시 살아나셨으니 곧 죽은 자와 산 자의 주가 되려 하심이라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/rim/14/#L9">롬 14:9</a>)</p></blockquote><h2>죽은 뒤 하늘에서 누리는 의인들의 삶</h2><p>그리스도를 위해 죽임을 당한 이들의 혼은 하늘에서 그분과 함께 살며, 땅에서 일어나는 일을 압니다(아직 그들의 피가 갚아지지 않았습니다):</p><blockquote><p>“다섯째 인을 떼실 때에 내가 보니 <strong>하나님의 말씀과 그들이 가진 증거로 말미암아 죽임을 당한 영혼들이</strong> 제단 아래에 있어 큰 소리로 불러 이르되 <strong>거룩하고 참되신 대주재여 땅에 거하는 자들을 심판하여 우리 피를 갚아 주지 아니하시기를 어느 때까지 하시려 하나이까</strong> 하니 <strong>각각 그들에게 흰 두루마기를 주시며</strong> 이르시되 아직 잠시 동안 쉬되 <strong>그들의 동무 종들과 형제들도 자기처럼 죽임을 당하여 그 수가 차기까지</strong> 하라 하시더라” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/6/#L9-11">계 6:9-11</a>)</p></blockquote><h2>그리스도를 위한 순교자들은 하늘에 삽니다</h2><blockquote><p>“또 우리 형제들이 어린 양의 피와 <strong>자기들이 증언하는 말씀으로써</strong> 그를 이겼으니 그들은 <strong>죽기까지 자기들의 생명을 아끼지 아니하였도다</strong> 그러므로 <strong>하늘과 그 가운데에 거하는 자들은 즐거워하라</strong> 그러나 땅과 바다는 화 있을진저 이는 마귀가 자기의 때가 얼마 남지 않은 줄을 알므로 크게 분내어 너희에게 내려갔음이라 하더라” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/12/#L11-12">계 12:11-12</a>)</p></blockquote><p>의인들은 하늘에 살며, 땅에 사는 우리는 이미 지금 하늘의 승리한 교회, 의인들의 영들에게 나아갑니다:</p><blockquote><p>“그러나 <strong>너희가 이른 곳은</strong> 시온 산과 살아 계신 하나님의 도성인 <strong>하늘의 예루살렘과</strong> 천만 천사와 <strong>하늘에 기록된 장자들의 모임과 교회와</strong> 만민의 심판자이신 하나님과 및 <strong>온전하게 된 의인의 영들과</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/evr/12/#L22-23">히 12:22-23</a>)</p></blockquote><p>동정을 지킨 이들은 그리스도께서 어디로 가시든 늘 따라갑니다:</p><blockquote><p>“이 사람들은 <strong>여자와 더불어 더럽히지 아니하고</strong> <strong>순결한 자라</strong> <strong>어린 양이 어디로 인도하든지 따라가는 자며</strong> 사람 가운데에서 속량함을 받아 처음 익은 열매로 하나님과 어린 양에게 속한 자들이니 그 입에 거짓말이 없고 <strong>흠이 없는 자들이더라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/14/#L4-5">계 14:4-5</a>) <em>(공인본문(TR)에는 5절 끝에 “하나님의 보좌 앞에서”가 있습니다.)</em></p></blockquote><p>죽은 이들은 심판을 받고, 음부는 그 가운데 있던 죽은 이들을 내줍니다:</p><blockquote><p>“또 내가 보니 <strong>죽은 자들이 큰 자나 작은 자나 그 보좌 앞에 서 있는데</strong> 책들이 펴 있고 또 다른 책이 펴졌으니 곧 생명책이라 <strong>죽은 자들이 자기 행위를 따라 책들에 기록된 대로 심판을 받으니</strong> 바다가 그 가운데에서 죽은 자들을 내주고 또 <strong>사망과 음부도 그 가운데에서 죽은 자들을 내주매</strong> 각 사람이 자기의 행위대로 심판을 받고” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/20/#L12-13">계 20:12-13</a>)</p></blockquote><h2>비판에 대한 답변</h2><h3>하느님께서 선지자 모세를 다시 살리셨는가?</h3><p>정교인들은 죽은 뒤 혼이 의식을 지닌 채 존재한다는 것을 옹호하며, 선지자 모세가 죽었지만(<a href="https://bibleox.com/ko/ko-nkrv/vtor/34/#L7">신 34:7</a>; <a href="https://bibleox.com/ko/ko-nkrv/nav/1/#L2">수 1:2</a>) 나타나서 그리스도와 <strong>대화한다</strong>는 논거를 듭니다:</p><blockquote><p>“그 때에 <strong><mark>모세와 엘리야가 예수와 더불어 말하는 것이 그들에게 보이거늘</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/17/#L3">마 17:3</a>)</p></blockquote><p>정교회의 반대자들, 특히 재림교인들은 이에 대해 하느님께서 선지자 모세를 데려가 다시 살리셨기 때문이라고 답합니다. 그들은 성경이 아니라 위경 “모세의 승천”을 근거로 듭니다(엘렌 화이트의 말을 직접 들 수는 없기 때문입니다).</p><p>우리도(그들도) 위경을 권위 있는 본문으로 인정하지 않습니다. 그러나 문제는 이 위경에도, 적어도 남아 있는 부분에는, 선지자 모세의 부활에 관한 말이 없다는 것입니다. 오히려 거기서 모세는 “조상들의 잠”으로 떠난다고 말합니다(<a href="https://azbyka.ru/otechnik/Biblia2/apokrificheskie-apokalipsisy/15#sel=15:41,15:57;27:1,27:7">출처</a>, 러시아어).</p><p>더구나 선지자의 부활은 성경과 모순됩니다. 죽은 자 가운데서 처음 나신 분은 바로 그리스도이시기 때문입니다:</p><blockquote><p>“그러나 이제 그리스도께서 죽은 자 가운데서 다시 살아나사 <strong>잠자는 자들의 첫 열매가 되셨도다</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/15/#L20">고전 15:20</a>)</p></blockquote><p>또 우리는 사람들 가운데(이 말씀은 사람들을 향한 것입니다) 아무도 하늘에 올라가지 않았고, 선지자들 가운데 아무도 하늘에 오르지 않았다는 것을 압니다:</p><blockquote><p>“<strong><mark>하늘에서 내려온 자 곧 인자 외에는 하늘에 올라간 자가 없느니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/in/3/#L13">요 3:13</a>)</p></blockquote><blockquote><p>“형제들아 내가 조상 다윗에 대하여 담대히 말할 수 있노니 다윗이 죽어 장사되어 그 묘가 오늘까지 우리 중에 있도다 &lt;…&gt; <strong>다윗은 하늘에 올라가지 못하였으나</strong> 친히 말하여 이르되 주께서 내 주에게 말씀하시기를” (<a href="https://bibleox.com/ko/ko-nkrv/act/2/#L29,34">행 2:29,34</a>)</p></blockquote><p>그리스도의 십자가 희생과 부활 이전에는 모든 사람이 죽은 뒤 음부로 내려갔다는 것에 대해 더 보십시오:</p><p><a href="https://bibleox.com/ru/ru/w/9VFT_До_жертвы_Христовой_ветхозаветные_праведники_сходили_в_ад">그리스도의 희생 이전에는 구약의 의인들도 음부로 내려갔습니다</a></p><h3>혼의 삶에 관한 가르침은 “결코 죽지 아니하리라”는 마귀의 말을 믿는 것인가?</h3><p>혼에 관한 가르침의 반대자들(재림교인)은 정교인들을 이렇게 비난합니다. 하느님께서는 “죽으리라” 하셨고 마귀는 “죽지 아니하리라” 했으니, 몸이 죽은 뒤 혼의 삶을 믿는 것은 “죽지 아니하리라”는 마귀의 말을 믿는 것이라는 것입니다. 따라서 그들은 몸이 죽은 뒤 혼의 삶을 믿는 이들을 마귀의 거짓말을 믿는다고 비난합니다.</p><p>비난은 요란하지만, 이 생각 자체에는 심각한 모순과 문맥상의 문제가 있습니다. 하느님께서는 “죽으리라”고만 하신 것이 아니라, 금지된 나무의 열매를 먹는 날에 죽으리라고 하셨습니다:</p><blockquote><p>“여호와 하나님이 그 사람에게 명하여 이르시되 동산 각종 나무의 열매는 네가 임의로 먹되 <strong><mark>선악을 알게 하는 나무의 열매는 먹지 말라 네가 먹는 날에는 반드시 죽으리라</mark></strong> 하시니라” (<a href="https://bibleox.com/ko/ko-nkrv/gen/2/#L16-17">창 2:16-17</a>)</p></blockquote><p>혼의 삶에 관한 가르침의 반대자들은 “죽으리라”는 말을 가장 단순하고 직접적으로, 곧 몸의 죽음과 사람의 모든 생명 활동의 끝, 그의 존재(적어도 의식적 존재)의 그침으로 이해합니다.</p><p>열매를 먹은 날에 사람들에게 이런 뜻의 죽음이 일어났습니까? 아닙니다. 아담은 훨씬 뒤 930세에 죽었습니다(<a href="https://bibleox.com/ko/ko-nkrv/gen/5/#L5">창 5:5</a>). 이것은 무엇을 뜻합니까? 하느님께서는 다른 죽음을 말씀하셨다는 뜻입니다. 그리고 마귀는 그 다른 죽음을 부정했습니다.</p><p>그렇지 않다면, 하느님께서는 사람들이 열매를 먹는 날에 죽으리라고 하셨으니 거짓말을 하셨고, 마귀는 죽지 않으리라고 했으니 참말을 했다고 인정해야 할 것입니다. 실제로 그날 육체적 의미의 죽음은 일어나지 않았기 때문입니다. 그러나 우리는 하느님(길과 진리와 생명 — <a href="https://bibleox.com/ko/ko-nkrv/in/14/#L6">요 14:6</a>)께서 거짓말을 하셨고 마귀(거짓말쟁이요 거짓의 아비 — <a href="https://bibleox.com/ko/ko-nkrv/in/8/#L44">요 8:44</a>)가 참말을 했다고 결코 인정할 수 없습니다. 그런데 혼에 관한 가르침의 반대자들의 해석은 바로 이 결론으로 이끕니다.</p><p>이 막다른 길에서 벗어나려면 그들은 구절의 일부를 반드시 비유적으로 다시 해석해야 할 것입니다:</p><ul><li><p>죽음 자체는 문자적으로 이해하고,</p></li><li><p>죽음의 날은 문자적으로 이해하지 않는 것입니다.</p></li></ul><p>정교회의 해석에는 이런 결함이 없습니다:</p><ul><li><p>죽음의 날도 문자적으로 이해하고,</p></li><li><p>죽음 자체도 문자적으로, 다만 사람의 영적 상태에 관해 이해합니다. 그러나 몸의 상태에도 변화가 일어났습니다. 적어도 사람들은 자기들이 벗은 것을 보았습니다.</p></li></ul><p>우리의 첫 조상들은 실제로 그날 죽었습니다. 그러나 이 죽음은 사라짐이 아니라 하느님에게서 떨어져 나간 상태이며, 모든 죄인이 이 상태에 있습니다. 그리스도 하느님께서는 친히 하느님 없이 사는 상태를 죽음이라고 부르십니다:</p><blockquote><p>“제자 중에 또 한 사람이 이르되 주여 내가 먼저 가서 내 아버지를 장사하게 허락하옵소서 예수께서 이르시되 <strong><mark>죽은 자들이 그들의 죽은 자들을 장사하게 하고</mark></strong> 너는 나를 따르라 하시니라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/8/#L21-22">마 8:21-22</a>)</p></blockquote><blockquote><p>“내가 진실로 진실로 너희에게 이르노니 내 말을 듣고 또 나 보내신 이를 믿는 자는 영생을 얻었고 심판에 이르지 아니하나니 <strong><mark>사망에서 생명으로 옮겼느니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/in/5/#L24">요 5:24</a>)</p></blockquote><blockquote><p>“사데 교회의 사자에게 편지하라 하나님의 일곱 영과 일곱 별을 가지신 이가 이르시되 내가 네 행위를 아노니 <strong><mark>네가 살았다 하는 이름은 가졌으나 죽은 자로다</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/3/#L1">계 3:1</a>)</p></blockquote><p>사도들도 같은 것을 말합니다. 사람들은 죽은 자로 살았습니다:</p><blockquote><p>“그는 <strong><mark>허물과 죄로 죽었던 너희를</mark></strong> 살리셨도다 그 때에 너희는 <strong><mark>그 가운데서 행하여</mark></strong> 이 세상 풍조를 따르고 공중의 권세 잡은 자를 따랐으니 곧 지금 불순종의 아들들 가운데서 역사하는 영이라” (<a href="https://bibleox.com/ko/ko-nkrv/ef/2/#L1-2">엡 2:1-2</a>)</p></blockquote><blockquote><p>“참 과부로서 외로운 자는 하나님께 소망을 두어 주야로 항상 간구와 기도를 하거니와 향락을 좋아하는 자는 <strong><mark>살았으나 죽었느니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1tim/5/#L5-6">딤전 5:5-6</a>)</p></blockquote><p>곧 죽음의 상태는 타락 직후 아담과 하와에게 찾아왔습니다. 이것은 하느님 없이 사는 내적 삶의 상태입니다. 그리고 이런 뜻에서 마귀는 그들이 죽지 않으리라고 말했을 때 거짓말을 했습니다. 그들은 하느님께서 말씀하신 대로, 바로 그날 죽었습니다.</p><p>이처럼 그 비난은 스스로 모순되고 성경의 문맥에서 떨어져 있어 진지하지 않습니다.</p>'
