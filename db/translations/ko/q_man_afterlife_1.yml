  title: 죽은 뒤 혼이 지나는 시련의 길
  copy_cover: true
  body: <h2>시련의 길에 대해 간단히</h2><p><a href="https://azbyka.ru/mytarstva">시련의 길(러시아어 мытарства, “세관들”)</a>(러시아어)은 사람이 죽은 뒤 타락한 천사들이 그의 혼을 차지하려 한다는 정교회의 가르침입니다. 그래서 혼은 무서운 시련을 겪으며, 그 시련에서 하느님의 천사들은 의로운 혼들을 지켜 하느님께로 이끌려고 애씁니다. 이 가르침은 상징적으로, 형상으로, 곧 혼이 이런저런 정념에 대해 시험받는 여러 정거장으로 표현됩니다. 이때 천사들은 하느님의 공의를 이루는 도구입니다.</p><h2>악한 날에 악의 영들을 대적하고 모든 일을 행한 후에 서기 위하여</h2><p>마귀는 공중의 권세 잡은 자입니다:</p><blockquote><p>“그는 허물과 죄로 죽었던 너희를 살리셨도다 그 때에 너희는 그 가운데서 행하여 이 세상 풍조를 따르고 <strong><mark>공중의 권세 잡은 자를</mark></strong> 따랐으니 곧 지금 불순종의 아들들 가운데서 역사하는 영이라” (<a href="https://bibleox.com/ko/ko-nkrv/ef/2/#L1-2">엡 2:1-2</a>)</p></blockquote><p>악한 날(죽음의 날)에 모든 것을 이기도록 준비해야 합니다:</p><blockquote><p>“<strong><mark>마귀의 간계를 능히 대적하기 위하여 하나님의 전신 갑주를 입으라</mark></strong> 우리의 씨름은 혈과 육을 상대하는 것이 아니요 통치자들과 권세들과 이 어둠의 세상 주관자들과 <strong><mark>하늘에 있는 악의 영들을 상대함이라</mark></strong> 그러므로 하나님의 전신 갑주를 취하라 이는 <strong><mark>악한 날에 너희가 능히 대적하고</mark></strong> <strong><mark>모든 일을 행한 후에 서기 위함이라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ef/6/#L11-13">엡 6:11-13</a>)</p></blockquote><h2>하느님의 허락 없이는 마귀가 의인에게 손댈 수 없으며, 그를 차지할 허락을 얻을 길을 찾습니다</h2><p>마귀는 사람을 차지하려고 그를 고발하거나 비방할 길을 찾습니다:</p><blockquote><p>“사탄이 여호와께 대답하여 이르되 가죽으로 가죽을 바꾸오니 사람이 그의 모든 소유물로 자기의 생명을 바꾸올지라 이제 주의 손을 펴서 그의 뼈와 살을 치소서 그리하시면 틀림없이 주를 향하여 욕하지 않겠나이까 여호와께서 사탄에게 이르시되 <strong><mark>내가 그를 네 손에 맡기노라 다만 그의 생명은 해하지 말지니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/iov/2/#L4-6">욥 2:4-6</a>)</p></blockquote><blockquote><p>“천사장 미가엘이 <strong><mark>모세의 시체에 관하여 마귀와 다투어 변론할 때에</mark></strong> 감히 비방하는 판결을 내리지 못하고 다만 말하되 주께서 너를 꾸짖으시기를 원하노라 하였거늘” (<a href="https://bibleox.com/ko/ko-nkrv/iud/1/#L9">유 1:9</a>)</p></blockquote><h2>마귀는 언제나 삼킬 자를 찾습니다</h2><blockquote><p>“근신하라 깨어라 <strong>너희 대적 마귀가 우는 사자 같이 두루 다니며 삼킬 자를 찾나니</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1pet/5/#L8">벧전 5:8</a>)</p></blockquote><h2>천사들은 구원받을 이들을 섬기라고 보내심을 받습니다</h2><blockquote><p>“어느 때에 천사 중 누구에게 내가 네 원수로 네 발등상이 되게 하기까지 너는 내 우편에 앉아 있으라 하셨느냐 <strong>모든 천사들은 섬기는 영으로서 구원 받을 상속자들을 위하여 섬기라고 보내심이 아니냐</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/evr/1/#L13-14">히 1:13-14</a>)</p></blockquote><h2>천사들은 의인들의 혼을 죽은 뒤에 “받들어” 갑니다</h2><p>혼은 몸에서 떨어진 뒤 움직입니다. 혼은 앞으로 머물 곳까지 길을 지나가야 합니다.</p><p>천사들은 의로운 나사로의 혼을 돌보았지만, 부자에 대해서는 그런 말이 없습니다:</p><blockquote><p>“한 부자가 있어 자색 옷과 고운 베옷을 입고 날마다 호화롭게 즐기더라 그런데 나사로라 이름하는 한 거지가 헌데 투성이로 그의 대문 앞에 버려진 채 그 부자의 상에서 떨어지는 것으로 배불리려 하매 심지어 개들이 와서 그 헌데를 핥더라 이에 <strong><mark>그 거지가 죽어 천사들에게 받들려</mark></strong> 아브라함의 품에 들어가고 <strong>부자도 죽어 장사되매</strong> 그가 <strong>음부에서 고통중에</strong> 눈을 들어 멀리 아브라함과 그의 품에 있는 나사로를 보고 불러 이르되 아버지 아브라함이여 나를 긍휼히 여기사 나사로를 보내어 그 손가락 끝에 물을 찍어 내 혀를 서늘하게 하소서 내가 이 불꽃 가운데서 괴로워하나이다 아브라함이 이르되 얘 <strong>너는 살았을 때에 좋은 것을 받았고 나사로는 고난을 받았으니 이것을 기억하라 이제 그는 여기서 위로를 받고 너는 괴로움을 받느니라</strong> 그뿐 아니라 너희와 우리 사이에 큰 구렁텅이가 놓여 있어 여기서 너희에게 건너가고자 하되 갈 수 없고 거기서 우리에게 건너올 수도 없게 하였느니라” (<a href="https://bibleox.com/ko/ko-nkrv/lk/16/#L19-26">눅 16:19-26</a>)</p></blockquote><p>죄 많은 혼은 갑자기 데려가집니다:</p><blockquote><p>“또 내가 내 영혼에게 이르되 영혼아 여러 해 쓸 물건을 많이 쌓아 두었으니 평안히 쉬고 먹고 마시고 즐거워하자 하리라 하되 하나님은 이르시되 <strong><mark>어리석은 자여 오늘 밤에 네 영혼을 도로 찾으리니</mark></strong> 그러면 네 준비한 것이 누구의 것이 되겠느냐 하셨으니 <strong>자기를 위하여 재물을 쌓아 두고 하나님께 대하여 부요하지 못한 자가 이와 같으니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/lk/12/#L19-21">눅 12:19-21</a>)</p></blockquote><h2>죽음의 때에 마귀는 그리스도께 오지만 그리스도를 고발할 것이 없습니다</h2><p>죽으시기 전날 그리스도께서는 마귀가 다가온다고 말씀하십니다. 마귀는 그리스도 안에 자기 것이 하나도 없으므로 그분을 죄로 고발할 수 없습니다:</p><blockquote><p>“이후에는 내가 너희와 말을 많이 하지 아니하리니 <strong><mark>이 세상의 임금이 오겠음이라 그러나 그는 내게 관계할 것이 없으니</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/in/14/#L30">요 14:30</a>)</p></blockquote><p>그러나 다른 사람들은 그렇지 않습니다:</p><blockquote><p>“<strong><mark>죄를 짓는 자는 마귀에게 속하나니</mark></strong> 마귀는 처음부터 범죄함이라 하나님의 아들이 나타나신 것은 마귀의 일을 멸하려 하심이라” (<a href="https://bibleox.com/ko/ko-nkrv/1in/3/#L8">요일 3:8</a>)</p></blockquote><h2>그리스도께서는 구름을 타고 공중을 지나 하늘로 오르셨습니다</h2><blockquote><p>“이 말씀을 마치시고 <strong><mark>그들이 보는데 올려져 가시니 구름이 그를 가리어 보이지 않게 하더라</mark></strong> <strong><mark>올라가실 때에</mark></strong> 제자들이 자세히 하늘을 쳐다보고 있는데 흰 옷 입은 두 사람이 그들 곁에 서서” (<a href="https://bibleox.com/ko/ko-nkrv/act/1/#L9-10">행 1:9-10</a>)</p></blockquote><h2>그리스도께서는 같은 모습으로 다시 오실 것입니다</h2><blockquote><p>“그러나 우리의 시민권은 하늘에 있는지라 <strong><mark>거기로부터 구원하는 자 곧 주 예수 그리스도를 기다리노니</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/fil/3/#L20">빌 3:20</a>)</p></blockquote><blockquote><p>“이르되 갈릴리 사람들아 어찌하여 서서 하늘을 쳐다보느냐 <strong><mark>너희 가운데서 하늘로 올려지신 이 예수는 하늘로 가심을 본 그대로 오시리라</mark></strong> 하였느니라” (<a href="https://bibleox.com/ko/ko-nkrv/act/1/#L11">행 1:11</a>)</p></blockquote>
