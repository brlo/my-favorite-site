- src: ад-бесконечность-мучений
  path: Eh5t_지옥_고통의_끝없음
  title: 지옥 — 고통의 끝없음
  copy_cover: true
  body: '<h2>정의</h2><p>지옥 — 그리스도의 영광스러운 재림과 마지막 심판 뒤에 정죄받은 죄인들이 머무는 곳. 마지막 심판 뒤에는 이 운명을 더 이상 바꿀 수 없습니다. 정죄받은 이들의 고통도 의인들의 복도 똑같이 영원히 이어집니다.</p><h2>지옥의 고통에는 끝이 없습니다</h2><blockquote><p>“그 고난의 연기가 <strong>세세토록</strong> 올라가리로다 짐승과 그의 우상에게 경배하고 그의 이름 표를 받는 자는 누구든지 <strong>밤낮 쉼을 얻지 못하리라</strong> 하더라” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/14/#L11">계 14:11</a>)</p></blockquote><blockquote><p>“만일 네 눈이 너를 범죄하게 하거든 빼버리라 한 눈으로 하나님의 나라에 들어가는 것이 두 눈을 가지고 지옥에 던져지는 것보다 나으니라 <strong>거기에서는 구더기도 죽지 않고 불도 꺼지지 아니하느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mk/9/#L47-48">막 9:47-48</a>)</p></blockquote><blockquote><p>“또 그들을 미혹하는 마귀가 불과 유황 못에 던져지니 거기는 그 짐승과 거짓 선지자도 있어 <strong>세세토록 밤낮 괴로움을 받으리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/20/#L10">계 20:10</a>)</p></blockquote><blockquote><p>“땅의 티끌 가운데에서 자는 자 중에서 많은 사람이 깨어나 영생을 받는 자도 있겠고 <strong>수치를 당하여서 영원히 부끄러움을 당할 자도 있을 것이며</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/dan/12/#L2">단 12:2</a>)</p></blockquote><blockquote><p>“<strong>그들은 영벌에</strong>, 의인들은 영생에 들어가리라 하시니라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/25/#L46">마 25:46</a>)</p></blockquote><blockquote><p>“누구든지 성령을 모독하는 자는 <strong>영원히 사하심을 얻지 못하고 영원한 죄가 되느니라</strong> 하시니” (<a href="https://bibleox.com/ko/ko-nkrv/mk/3/#L29">막 3:29</a>)</p></blockquote><blockquote><p>“하나님을 모르는 자들과 우리 주 예수의 복음에 복종하지 않는 자들에게 형벌을 내리시리니 이런 자들은 주의 얼굴과 그의 힘의 영광을 떠나 <strong>영원한 멸망의 형벌을 받으리로다</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2sol/1/#L8-9">살후 1:8-9</a>)</p></blockquote><blockquote><p>“이 사람들은 물 없는 샘이요 광풍에 밀려 가는 안개니 <strong>그들을 위하여 캄캄한 어둠이 예비되어 있나니</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2pet/2/#L17">벧후 2:17</a>) <em>(비잔틴 본문(다수 사본): “캄캄한 어둠이 <strong>영원히</strong> 예비되어 있나니”(εἰς αἰῶνα).)</em></p></blockquote><blockquote><p>“세례들과 안수와 죽은 자의 부활과 <strong>영원한 심판에 관한 교훈</strong>의 터를 다시 닦지 말고 완전한 데로 나아갈지니라” (<a href="https://bibleox.com/ko/ko-nkrv/evr/6/#L2">히 6:2</a>)</p></blockquote><blockquote><p>“너희로 환난을 받게 하는 자들에게는 환난으로 갚으시고 환난을 받는 너희에게는 우리와 함께 안식으로 갚으시는 것이 하나님의 공의시니 주 예수께서 자기의 능력의 천사들과 함께 하늘로부터 불꽃 가운데에 나타나실 때에 하나님을 모르는 자들과 우리 주 예수의 복음에 복종하지 않는 자들에게 형벌을 내리시리니 이런 자들은 주의 얼굴과 그의 힘의 영광을 떠나 <strong>영원한 멸망의 형벌을 받으리로다</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2sol/1/#L6-9">살후 1:6-9</a>)</p></blockquote><h2>하느님의 뜻을 알지 못한 이들도 벌을 받습니다</h2><blockquote><p>“주인의 뜻을 알고도 준비하지 아니하고 그 뜻대로 행하지 아니한 종은 많이 맞을 것이요 <strong>알지 못하고 맞을 일을 행한 종은 적게 맞으리라</strong> 무릇 많이 받은 자에게는 많이 요구할 것이요 많이 맡은 자에게는 많이 달라 할 것이니라” (<a href="https://bibleox.com/ko/ko-nkrv/lk/12/#L47-48">눅 12:47-48</a>)</p></blockquote><h2>비판에 대한 답변</h2><h3>지옥의 끝없는 고통에 관한 가르침은 사람들을 그리스도에게서 멀어지게 하는가?</h3><p>이것은 논거가 아닙니다. 죄인은 대개 죄에 대한 벌에 관해 듣기를 좋아하지 않습니다. 그렇다면 죄에 대해 복을 약속해야 합니까? 마찬가지로 죄를 사랑하는 사람은 다음과 같은 가르침을 듣기 좋아하지 않습니다:</p><ul><li><p>회개,</p></li><li><p>죄를 버리는 것,</p></li><li><p>삶을 고치는 것,</p></li><li><p>그리스도께서 유일한 구세주이시며 다른 길은 구원에 이르지 않는다는 것(<a href="https://bibleox.com/ko/ko-nkrv/act/4/#L12">행 4:12</a>),</p></li><li><p>원수를 사랑하고, 복수를 버리고, 빚을 탕감하고, 우리를 미워하는 이들에게 선을 행하는 것(<a href="https://bibleox.com/ko/ko-nkrv/mf/5/#L44">마 5:44</a>; <a href="https://bibleox.com/ko/ko-nkrv/lk/6/#L27">눅 6:27</a>; <a href="https://bibleox.com/ko/ko-nkrv/lk/6/#L35">눅 6:35</a>),</p></li><li><p>부를 좇지 않는 것(<a href="https://bibleox.com/ko/ko-nkrv/mf/19/#L24">마 19:24</a>),</p></li><li><p>일부일처(<a href="https://bibleox.com/ko/ko-nkrv/mf/19/#L10">마 19:10</a>).</p></li></ul><p>그러나 물론 이 모든 것을 포기해야 한다는 뜻은 아닙니다. 왜 그런 뜻이 아닙니까? 그것이 진리이기 때문입니다. 사람이 이 말씀을 듣지 않는다면 벌에 관한 경고는 정말로 이루어질 것입니다. 그 경고는 헛되지 않았습니다. 우리는 그런 일이 그에게 일어나지 않도록 그에게 경고합니다. 영원한 고통도 마찬가지입니다. 이것이 참된 가르침이라면 죄인이 듣기 불편한 것을 빼서 진리를 고쳐야 할 까닭이 어디 있습니까?</p><blockquote><p>“때가 이르리니 사람이 바른 교훈을 받지 아니하며 귀가 가려워서 자기의 사욕을 따를 <strong>스승을 많이 두고</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2tim/4/#L3">딤후 4:3</a>)</p></blockquote><p>가르칠 때는 사람들이 듣기 좋아하는 것이 아니라 진리에서 출발해야 합니다:</p><blockquote><p>“사랑하는 자들아 우리가 일반으로 받은 구원에 관하여 내가 너희에게 편지하려는 생각이 간절하던 차에 <strong>성도에게 단번에 주신 믿음의 도를 위하여 힘써 싸우라</strong>는 편지로 너희를 권하여야 할 필요를 느꼈노니” (<a href="https://bibleox.com/ko/ko-nkrv/iud/1/#L3">유 1:3</a>)</p></blockquote>'
