  title: 다른 이들의 믿음과 기도를 통한 하느님의 활동
  copy_cover: true
  body: <p>하느님 은총의 활동이 언제나 그 사람 자신의 믿음과 청으로 이루어지는 것은 아닙니다. 사랑하는 이를 위해 애쓰고 그를 위해 청하는(기도하는) 가까운 이들의 믿음을 통해 하느님께서 활동하신 경우가 적지 않습니다.</p><h2>네 친구와 중풍병자</h2><p>치유와 죄의 용서는 중풍병자를 그리스도께 데려오려고 몹시 애쓴 친구들의 믿음을 통해 이루어집니다:</p><blockquote><p>“예수께서는 <strong>그들의 믿음을 보시고</strong> 중풍병자에게 ‘<strong>너는 죄를 용서받았다</strong>.’하고 말씀하셨다.” (<a href="https://bibleox.com/ko/ko-ctb/mk/2/#L5">마르 2:5</a>)</p></blockquote><h2>백인대장과 그의 하인</h2><p>백인대장이 믿고 청하지만 낫는 것은 하인입니다:</p><blockquote><p>“백인대장은 ‘주님, 저는 주님을 제 집에 모실 만한 자격이 없습니다. 그저 한 말씀만 하시면 제 하인이 낫겠습니다. &lt;…&gt; 이 말을 들으시고 예수께서는 감탄하시며 따라 오는 사람들에게 이렇게 말씀하셨다. ’<strong>정말 어떤 이스라엘 사람에게서도 이런 믿음을 본 일이 없다</strong>. &lt;…&gt; 그리고 나서 백인대장에게 ‘가 보아라. 네가 믿는 대로 될 것이다.’ 하고 말씀하셨다. <strong>바로 그 시간에 그 하인의 병이 나았다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/mf/8/#L8,10,13">마태 8:8,10,13</a>)</p></blockquote><h2>아버지와 악령 들린 아들</h2><p>아버지가 믿고 청하지만 악령에게서 풀려나는 것은 아들입니다:</p><blockquote><p>“그들 가운데 한 사람이 나서서 ‘선생님, <strong>악령이 들려 말을 못하는 제 아들을</strong> 선생님께 보이려고 데려 왔습니다. 악령이 한번 발작하면 그 아이는 땅에 딩굴며 거품을 내뿜고 이를 갈다가 몸이 빳빳해지고 맙니다. 그래서 선생님의 제자들에게 악령을 쫓아내 달라고 했더니 쫓아내지 못했습니다’하였다. 예수께서는 ‘아, 이 세대가 왜 이다지도 믿음이 없을까! 내가 언제까지 너희와 함께 살며 이 성화를 받아야 한단 말이냐? 그 아이를 나에게 데려 오너라.’ 하셨다. 그들이 아이를 예수께 데려 오자 악령이 예수를 보고는 곧 아이에게 심한 발작을 일으키게 했다. 그래서 아이는 땅에 넘어져 입에서 거품을 흘리며 딩굴었다. 예수께서 그 아버지에게 ‘아이가 이렇게 된 지 얼마나 되었느냐?’ 하고 물으시자 그는 이렇게 대답하였다. ‘어렸을 때부터입니다. 악령의 발작으로 그 아이는 불 속에 뛰어 들기도 하고 물 속에 빠지기도 하였습니다. 그래서 여러 번 죽을 뻔하였습니다. 선생님께서 하실 수 있다면 자비를 베푸셔서 저희를 도와 주십시오.’ 이 말에 예수께서 ‘할 수만 있다면이 무슨 말이냐? <strong>믿는 사람에게는 안 되는 일이 없다</strong>.’ 하시자 아이 아버지는 큰 소리로 ‘저는 믿습니다. 그러나 제 믿음이 부족하다면 도와 주십시오’하고 청하였다. 예수께서는 사람들이 몰려 드는 것을 보시고 더러운 악령을 꾸짖으시며 ‘말 못하고 듣지 못하게 하는 악령아, 들어라. 그 아이에게서 썩 나와 다시는 들어가지 말아라’하고 호령하셨다. 그러자 악령이 소리를 지르며 그 아이에게 심한 발작을 일으켜 놓고 나가 버렸다. 그 바람에 아이가 죽은 것같이 되자 사람들은 모두 ‘아이가 죽었구나!’하고 웅성거렸다. 그러나 예수께서 아이의 손을 잡아 일으키시자 그 아이는 벌떡 일어났다.” (<a href="https://bibleox.com/ko/ko-ctb/mk/9/#L17-27">마르 9:17-27</a>)</p></blockquote><h2>가나안 어머니와 악령 들린 딸</h2><p>어머니가 믿고 청하지만 악령에게서 풀려나는 것은 가나안 여인(시로페니키아 사람, <a href="https://bibleox.com/ko/ko-ctb/mk/7/#L26">마르 7:26</a>)의 딸입니다:</p><blockquote><p>“이 때 그 지방에 와 사는 가나안 여자 하나가 나서서 큰 소리로 ‘다윗의 자손이시여, 저에게 자비를 베풀어 주십시오. <strong>제 딸이 마귀가 들려 몹시 시달리고 있습니다</strong>’ 하고 계속 간청하였다. 그러나 예수께서는 아무 대답도 하지 않으셨다. 그 때에 제자들이 가까이 와서 ‘저 여자가 소리를 지르며 따라 오고 있으니 돌려 보내시는 것이 좋겠습니다’ 하고 말씀드렸다. 예수께서는 ‘나는 길 잃은 양과 같은 이스라엘 백성만을 찾아 돌보라고 해서 왔다’ 하고 말씀하셨다. 그러자 그 여자가 예수께 다가와서 꿇어 엎드려 ‘주님, 저를 도와 주십시오’ 하고 애원하였다. 그러나 예수께서는 ‘자녀들이 먹을 빵을 강아지에게 던져 주는 것은 옳지 않다’ 하며 거절하였다. 그러자 그 여자는 ‘주님, 그렇긴 합니다만 강아지도 주인의 상에서 떨어지는 부스러기는 주워 먹지 않습니까?’ 하고 말하였다. 그제야 예수께서는 ‘여인아! <strong>참으로 네 믿음이 장하다</strong>. 네 소원대로 이루어질 것이다’ 하고 말씀하셨다. 바로 그 순간에 그 여자의 딸이 나았다.” (<a href="https://bibleox.com/ko/ko-ctb/mf/15/#L22-28">마태 15:22-28</a>)</p></blockquote><h2>야이로와 열두 살 된 딸</h2><p>아버지(야이로)가 믿고 청하지만 살아나 낫는 것은 딸입니다:</p><blockquote><p>“그 때에 야이로라는 회당장이 예수께 와서 그 발 앞에 엎드려 자기 집에 와 주시기를 간청하였다. 그의 열 두 살쯤 된 <strong>외딸</strong>이 거의 죽게 되었던 것이다. 예수께서 그 집으로 가실 때 군중이 그를 에워 싸고 떠밀며 쫓아 갔다. &lt;…&gt; 예수의 말씀이 채 끝나기 전에 회당장의 집에서 사람이 와서 회당장에게 ‘<strong>따님이 죽었습니다</strong>. 저 선생님께 수고를 끼쳐 드리지 마십시오’하고 말하였다. 예수께서 이 말을 들으시고 야이로에게 ‘<strong>두려워하지 말고 믿기만 하라. 그러면 딸이 살아나게 될 것이다</strong>’하고 말씀하셨다. 그 집에 이르러 예수께서는 베드로와 요한과 야고보와 아이의 부모 외에는 아무도 따라 오지 못하게 하셨다. 사람들은 모두 아이가 죽었다고 가슴을 치며 통곡하고 있었다. 예수께서 ‘울지 말라. 아이는 죽은 것이 아니라 잠을 자고 있다’하고 말씀하셨으나 사람들은 아이가 죽은 것을 알고 있었기 때문에 코웃음만 쳤다. 예수께서 아이의 손을 붙잡으시고 ‘아이야, 일어나거라!’하고 말씀하셨다. 그러자 그 아이는 숨을 다시 쉬며 벌떡 일어났다. 예수께서 아이에게 먹을 것을 주라고 하셨다.” (<a href="https://bibleox.com/ko/ko-ctb/lk/8/#L41-42,49-55">루가 8:41-42,49-55</a>)</p></blockquote><h2>고관과 그의 아들</h2><p>고관이 믿고 청하지만 낫는 것은 아들입니다:</p><blockquote><p>“예수께서는 전에 물로 포도주를 만드신 적이 있는 갈릴래아의 가나에 다시 가셨다. 거기에 고관 한 사람이 있었는데 <strong>그의 아들이 가파르나움에서 앓아 누워 있었다</strong>. 그는 예수께서 유다를 떠나 갈릴래아에 오셨다는 말을 듣고 예수를 찾아 와 자기 아들이 거의 죽게 되었으니 가파르나움으로 내려 가셔서 아들을 고쳐 달라고 사정하였다. 예수께서는 그에게 ‘너희는 기적이나 신기한 일을 보지 않고는 믿지 않는다.’하고 말씀하셨다. 그래도 그 고관은 ‘선생님, 제 자식이 죽기 전에 같이 좀 가 주십시오’하고 애원하였다. 예수께서 ‘집에 돌아 가라. 네 아들은 살 것이다’ 하시니 그는 <strong>예수의 말씀을 믿고</strong> 떠나 갔다.” (<a href="https://bibleox.com/ko/ko-ctb/in/4/#L46-50">요한 4:46-50</a>)</p></blockquote><h2>결론</h2><p>이처럼 구세주께서는 자녀들에게 하느님의 활동을 보이시기 위해 부모의 믿음을 기대하셨습니다. 그리고 부모의 청과 믿음을 통해 하느님의 은총이 자녀들에게 작용했습니다.</p>
