- src: длинные-молитвы
  path: Lp5r_긴_기도
  title: 긴 기도
  copy_cover: true
  body: '<h2>기도는 길 수 있습니다</h2><h3>언제나 기도하라는 계명</h3><blockquote><p>“항상 기뻐하라 <strong>쉬지 말고 기도하라</strong> 범사에 감사하라 이것이 그리스도 예수 안에서 너희를 향하신 하나님의 뜻이니라” (<a href="https://bibleox.com/ko/ko-nkrv/1sol/5/#L16-18">살전 5:16-18</a>)</p></blockquote><blockquote><p>“모든 기도와 간구를 하되 <strong>항상 성령 안에서 기도하고</strong> 이를 위하여 깨어 구하기를 항상 힘쓰며 여러 성도를 위하여 구하라” (<a href="https://bibleox.com/ko/ko-nkrv/ef/6/#L18">엡 6:18</a>)</p></blockquote><h3>주 예수 그리스도께서는 놀랄 만큼 오래 기도하셨습니다</h3><p>밤새워 기도하셨습니다:</p><blockquote><p>“이 때에 예수께서 기도하시러 산으로 가사 <strong>밤이 새도록 하나님께 기도하시고</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/lk/6/#L12">눅 6:12</a>)</p></blockquote><p>저녁부터 거의 아침까지 기도하셨습니다. 밤은 네 부분(경)으로 나뉩니다. 사경은 밤의 마지막 부분으로 거의 아침입니다. 그리스도께서는 거의 밤새 기도하셨습니다:</p><blockquote><p>“무리를 보내신 후에 <strong>기도하러</strong> 따로 산에 올라가시니라 <strong>저물매</strong> 거기 혼자 계시더니 &lt;…&gt; <strong>밤 사경에</strong> 예수께서 바다 위로 걸어서 제자들에게 오시니” (<a href="https://bibleox.com/ko/ko-nkrv/mf/14/#L23,25">마 14:23,25</a>)</p></blockquote><p>기도를 시작하시고 한 시간 뒤에 그리스도께서는 사도들을 깨우러 오셨고, 이 일이 두 번 더 있었습니다. 약 세 시간 기도하셨다고 짐작할 수 있습니다:</p><blockquote><p>“그들이 겟세마네라 하는 곳에 이르매 예수께서 제자들에게 이르시되 <strong>내가 기도할 동안에</strong> 너희는 여기 앉아 있으라 하시고 &lt;…&gt; 조금 나아가사 <strong>땅에 엎드리어</strong> 될 수 있는 대로 이 때가 자기에게서 지나가기를 구하여 &lt;…&gt; 돌아오사 제자들이 자는 것을 보시고 베드로에게 말씀하시되 시몬아 자느냐 네가 <strong><mark>한 시간도</mark></strong> 깨어 있을 수 없더냐 &lt;…&gt; <strong><mark>다시 나아가 동일한 말씀으로 기도하시고</mark></strong> 다시 오사 보신즉 그들이 자니 이는 그들의 눈이 심히 피곤함이라 그들이 예수께 무엇으로 대답할 줄을 알지 못하더라 세 번째 오사 그들에게 이르시되 이제는 자고 쉬라 그만 되었다 때가 왔도다 보라 인자가 죄인의 손에 팔리느니라” (<a href="https://bibleox.com/ko/ko-nkrv/mk/14/#L32,35,37,39-41">막 14:32,35,37,39-41</a>)</p></blockquote><h3>비유</h3><p>주님께서는 기도의 틀인 “주님의 기도”를 주시고 곧이어 기도의 끈기와 인내에 관한 비유를 덧붙이셨습니다:</p><blockquote><p>“또 이르시되 너희 중에 누가 벗이 있는데 밤중에 그에게 가서 말하기를 벗이여 떡 세 덩이를 내게 꾸어 달라 내 벗이 여행중에 내게 왔으나 내가 먹일 것이 없노라 하면 그가 안에서 대답하여 이르되 나를 괴롭게 하지 말라 문이 이미 닫혔고 아이들이 나와 함께 침실에 누웠으니 일어나 네게 줄 수가 없노라 하겠느냐 내가 너희에게 말하노니 비록 벗 됨으로 인하여서는 일어나서 주지 아니할지라도 <strong>그 간청함을 인하여 일어나 그 요구대로 주리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/lk/11/#L5-8">눅 11:5-8</a>)</p></blockquote><p>과부와 재판관의 비유:</p><blockquote><p>“예수께서 그들에게 <strong>항상 기도하고 낙심하지 말아야 할 것을</strong> 비유로 말씀하여 이르시되 어떤 도시에 하나님을 두려워하지 않고 사람을 무시하는 한 재판장이 있는데 그 도시에 한 과부가 있어 자주 그에게 가서 내 원수에 대한 나의 원한을 풀어 주소서 하되 그가 얼마 동안 듣지 아니하다가 후에 속으로 생각하되 내가 하나님을 두려워하지 않고 사람을 무시하나 이 과부가 나를 번거롭게 하니 내가 그 원한을 풀어 주리라 그렇지 않으면 늘 와서 나를 괴롭게 하리라 하였느니라 주께서 또 이르시되 불의한 재판장이 말한 것을 들으라 하물며 하나님께서 그 <strong>밤낮 부르짖는</strong> 택하신 자들의 원한을 풀어 주지 아니하시겠느냐 그들에게 오래 참으시겠느냐” (<a href="https://bibleox.com/ko/ko-nkrv/lk/18/#L1-7">눅 18:1-7</a>)</p></blockquote><h2>기도는 짧을 수 있습니다</h2><p>주님께서는 끊임없고 끈기 있는 기도가 필요하다는 과부와 재판관의 비유에 이어, 당신 마음에 든 세리의 짧은 기도에 관한 비유를 말씀하십니다. 물론 이 비유 자체는 복음사가가 설명하듯 자기 의로움을 헛되이 믿는 사람들에 관한 것입니다. 끝에 그리스도께서는 세리가 어떻게 하느님 마음에 들었는지 직접 가리키십니다. 자신과 자기 의로움을 낮게 보았기 때문입니다:</p><blockquote><p>“또 <strong>자기를 의롭다고 믿고 다른 사람을 멸시하는 자들</strong>에게 이 비유로 말씀하시되 두 사람이 기도하러 성전에 올라가니 하나는 바리새인이요 하나는 세리라 바리새인은 서서 따로 기도하여 이르되 하나님이여 나는 다른 사람들 곧 토색, 불의, 간음을 하는 자들과 같지 아니하고 이 세리와도 같지 아니함을 감사하나이다 나는 이레에 두 번씩 금식하고 또 소득의 십일조를 드리나이다 하고 세리는 멀리 서서 감히 눈을 들어 하늘을 쳐다보지도 못하고 다만 가슴을 치며 이르되 <strong>하나님이여 불쌍히 여기소서 나는 죄인이로소이다</strong> 하였느니라 내가 너희에게 이르노니 이에 저 바리새인이 아니고 이 사람이 의롭다 하심을 받고 그의 집으로 내려갔느니라 <strong><mark>무릇 자기를 높이는 자는 낮아지고 자기를 낮추는 자는 높아지리라</mark></strong> 하시니라” (<a href="https://bibleox.com/ko/ko-nkrv/lk/18/#L9-14">눅 18:9-14</a>)</p></blockquote><h2>비판</h2><h3>말을 많이 하지 말라</h3><p>마태 복음에는 “주님의 기도” 앞에 기도할 때 말을 많이 하지 말라는 그리스도의 말씀이 기록되어 있습니다:</p><blockquote><p>“또 기도할 때에 이방인과 같이 <strong>중언부언하지 말라</strong> 그들은 <strong>말을 많이 하여야</strong> 들으실 줄 생각하느니라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/6/#L7">마 6:7</a>)</p></blockquote><p>이것은 쓸데없는 말을 하지 말고, 하느님께서 이미 아시는 지상의 필요를 시시콜콜 청하지 말아야 한다는 뜻입니다. 주님 자신도 오래 기도하셨고 때로는 기도를 되풀이하셨습니다:</p><blockquote><p>“<strong>다시 나아가</strong> <strong>동일한 말씀으로 기도하시고</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mk/14/#L39">막 14:39</a>)</p></blockquote><p>여기도 보십시오: <a href="https://bibleox.com/ru/ru/w/молитва">기도: 빈말을 하지 않음</a>.</p>'
