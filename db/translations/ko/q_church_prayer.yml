- src: молитва_стоя
  path: Ps6t_서서_드리는_기도
  title: 서서 드리는 기도
  copy_cover: true
  body: <h2>하느님께서는 구약의 성전을 기도의 집이라고 부르십니다</h2><blockquote><p>“내가 곧 그들을 나의 성산으로 인도하여 <strong>기도하는 내 집</strong>에서 그들을 기쁘게 할 것이며 그들의 번제와 희생을 나의 제단에서 기꺼이 받게 되리니 이는 <strong><mark>내 집은 만민이 기도하는 집이라 일컬음이 될 것임이라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/is/56/#L7">사 56:7</a>; <a href="https://bibleox.com/ko/ko-nkrv/mf/21/#L13">마 21:13</a>; <a href="https://bibleox.com/ko/ko-nkrv/mk/11/#L17">막 11:17</a>)</p></blockquote><p>성전의 구조에는 앉을 자리가 마련되어 있지 않았습니다. <a href="https://bibleox.com/ru/ru/w/иерусалимский-храм">성전의 자세한 구조</a>.</p><h2>성전에서는 서서 기도했습니다</h2><blockquote><p>“유다 사람이 여호와께 도우심을 구하려 하여 유다 모든 성읍에서 모여와서 여호와께 간구하더라 &lt;…&gt; <strong><mark>유다 모든 사람들이 그들의 아내와 자녀와 어린이와 더불어 여호와 앞에 섰더라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2par/20/#L4,13">대하 20:4,13</a>)</p></blockquote><blockquote><p>“모세가 또 고라에게 이르되 너희 레위 자손들아 들으라 이스라엘의 하나님이 이스라엘 회중에서 너희를 구별하여 자기에게 가까이 하게 하사 <strong><mark>여호와의 성막에서 봉사하게 하시며 회중 앞에 서서</mark></strong> 그들을 대신하여 섬기게 하심이 너희에게 작은 일이겠느냐” (<a href="https://bibleox.com/ko/ko-nkrv/chis/16/#L8-9">민 16:8-9</a>)</p></blockquote><h2>하느님을 섬기는 존재들은 서 있는 모습으로 묘사됩니다</h2><blockquote><p>“이 두 <strong>그룹</strong>이 편 날개가 모두 이십 규빗이라 <strong><mark>그 얼굴을 내전으로 향하여 서 있으며</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2par/3/#L13">대하 3:13</a>)</p></blockquote><h2>그리스도께서는 사도들에게 일어나 기도하라고 하셨습니다</h2><blockquote><p>“<strong><mark>예수께서 힘쓰고 애써 더욱 간절히 기도하시니 땀이 땅에 떨어지는 핏방울 같이 되더라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/lk/22/#L44">눅 22:44</a>)</p></blockquote><blockquote><p>“기도 후에 일어나 제자들에게 가서 슬픔으로 인하여 잠든 것을 보시고 이르시되 어찌하여 자느냐 시험에 들지 않게 <strong><mark>일어나 기도하라</mark></strong> 하시니라” (<a href="https://bibleox.com/ko/ko-nkrv/lk/22/#L45-46">눅 22:45-46</a>)</p></blockquote><p>“일어나라”는 말은 “잠에서 깨어나라”는 뜻으로도 이해할 수 있습니다. 그러나 이 대목은 그리스도 자신이 큰 수고와 땀방울로 기도하셨음을 보여 준다는 점에서도 중요합니다.</p><h2>참고</h2><p>믿는 이들의 모임이 의자로 가득한 공간에 앉아서 하느님께 기도했다는 성경 구절은 없습니다.</p>
