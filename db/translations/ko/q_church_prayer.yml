  title: 긴 기도
  copy_cover: true
  body: '<h2>기도는 길 수 있습니다</h2><h3>언제나 기도하라는 계명</h3><blockquote><p>“항상 기뻐하십시오. <strong>늘 기도하십시오</strong>. 어떤 처지에서든지 감사하십시오. 이것이 그리스도 예수를 통해서 여러분에게 보여 주신 하느님의 뜻입니다.” (<a href="https://bibleox.com/ko/ko-ctb/1sol/5/#L16-18">1데살 5:16-18</a>)</p></blockquote><blockquote><p>“여러분은 또한 <strong>언제나 기도하며</strong> 하느님의 도우심을 청하십시오. 모든 경우에 성령의 도움을 받아 기도하십시오. 늘 깨어서 꾸준히 기도하며 모든 성도들을 위하여 간구하십시오.” (<a href="https://bibleox.com/ko/ko-ctb/ef/6/#L18">에페 6:18</a>)</p></blockquote><h3>주 예수 그리스도께서는 놀랄 만큼 오래 기도하셨습니다</h3><p>밤새워 기도하셨습니다:</p><blockquote><p>“그 무렵에 예수께서는 기도하시려고 산에 들어 가 <strong>밤을 새우시며 하느님께 기도하셨다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/lk/6/#L12">루가 6:12</a>)</p></blockquote><p>저녁부터 거의 아침까지 기도하셨습니다. 밤은 네 부분(경)으로 나뉩니다. 사경은 밤의 마지막 부분으로 거의 아침입니다. 그리스도께서는 거의 밤새 기도하셨습니다:</p><blockquote><p>“군중을 보내신 뒤에 조용히 <strong>기도하시려고</strong> 산으로 올라 가셔서 <strong>날이 이미 저물었는데도</strong> 거기에 혼자 계셨다. &lt;…&gt; <strong>새벽 네 시쯤</strong> 되어 예수께서 물 위를 걸어서 제자들에게 오셨다.” (<a href="https://bibleox.com/ko/ko-ctb/mf/14/#L23,25">마태 14:23,25</a>) <em>(그리스어: “밤 사경에”)</em></p></blockquote><p>기도를 시작하시고 한 시간 뒤에 그리스도께서는 사도들을 깨우러 오셨고, 이 일이 두 번 더 있었습니다. 약 세 시간 기도하셨다고 짐작할 수 있습니다:</p><blockquote><p>“그들은 게쎄마니라는 곳에 이르렀다. 예수께서 제자들에게 ‘<strong>내가 기도하는 동안</strong> 여기 앉아 있어라’ 하시고 &lt;…&gt; 조금 앞으로 나아가 <strong>땅에 엎드려 기도하셨다</strong>. 할 수만 있으면 수난의 시간을 겪지 않게 해 달라고 하시며 &lt;…&gt; 이렇게 기도하시고 나서 제자들에게 돌아 와 보시니 그들을 자고 있었다. 그래서 베드로에게 ‘시몬아, 자고 있느냐? <strong><mark>단 한 시간도</mark></strong> 깨어 있을 수 없단 말이냐? &lt;…&gt; <strong><mark>다시 가셔서 같은 말씀으로 기도하셨다</mark></strong>. 그리고 다시 돌아 와 보시니 그들은 여전히 자고 있었다. 그들은 너무나 졸려 눈을 뜨고 있을 수가 없었던 것이다. 그들은 무슨 말을 해야 할지 몰랐다. 예수께서는 <strong><mark>세 번째</mark></strong> 다녀 오셔서 ’아직도 자고 있느냐? 아직도 쉬고 있느냐? 그만하면 넉넉하다. 자, 때가 왔다. 사람의 아들이 죄인들 손에 넘어 가게 되었다.” (<a href="https://bibleox.com/ko/ko-ctb/mk/14/#L32,35,37,39-41">마르 14:32,35,37,39-41</a>)</p></blockquote><h3>비유</h3><p>주님께서는 기도의 틀인 “주님의 기도”를 주시고 곧이어 기도의 끈기와 인내에 관한 비유를 덧붙이셨습니다:</p><blockquote><p>“예수께서는 그들에게 또 이렇게 말씀하셨다. ‘너희 중 한 사람에게 어떤 친구가 있다고 하자. 한밤중에 그 친구를 찾아 가서 여보게, 빵 세 개만 꾸어 주게. 내 친구 하나가 먼 길을 가다가 우리 집에 들렀는데 내어 놓을 것이 있어야지 하고 사정을 한다면 그 친구는 안에서 귀찮게 굴지 말게. 벌써 문을 닫아 걸고 아이들도 나도 다 잠자리에 들었으니 일어나서 줄 수가 없네 하고 거절할 것이다. 잘 들어라. 이렇게 우정만으로는 일어나서 빵을 내어 주지 않겠지만 <strong>귀찮게 졸라대면 마침내는 자리에서 일어나 그의 청을 들어 주지 않겠느냐</strong>?” (<a href="https://bibleox.com/ko/ko-ctb/lk/11/#L5-8">루가 11:5-8</a>)</p></blockquote><p>과부와 재판관의 비유:</p><blockquote><p>“예수께서는 제자들에게 <strong>언제나 기도하고 용기를 잃지 말아야 한다고</strong> 이렇게 비유를 들어 가르치셨다. 어떤 도시에 하느님을 두려워하지 않고 사람도 거들떠 보지 않는 재판관이 있었다. 그 도시에는 어떤 과부가 있었는데 그 여자는 늘 그를 찾아 가서 저에게 억울한 일을 한 사람이 있습니다. 올바른 판결을 내려 주십시오 하고 졸라댔다. 오랫동안 그 여자의 청을 들어 주지 않던 재판관도 결국 나는 하느님도 두려워하지 않고 사람도 거들떠 보지 않는 사람이지만 이 과부가 너무도 성가시게 구니 그 소원대로 판결해 주어야지 하는 생각을 하게 되었다.‘ 주님께서는 계속해서 말씀하셨다. ’이 고약한 재판관의 말을 새겨 들어라. 하느님께서 택하신 백성이 <strong>밤낮 부르짖는데도</strong> 올바르게 판결해 주지 않으시고 오랫동안 그대로 내버려 두실 것 같으냐?” (<a href="https://bibleox.com/ko/ko-ctb/lk/18/#L1-7">루가 18:1-7</a>)</p></blockquote><h2>기도는 짧을 수 있습니다</h2><p>주님께서는 끊임없고 끈기 있는 기도가 필요하다는 과부와 재판관의 비유에 이어, 당신 마음에 든 세리의 짧은 기도에 관한 비유를 말씀하십니다. 물론 이 비유 자체는 복음사가가 설명하듯 자기 의로움을 헛되이 믿는 사람들에 관한 것입니다. 끝에 그리스도께서는 세리가 어떻게 하느님 마음에 들었는지 직접 가리키십니다. 자신과 자기 의로움을 낮게 보았기 때문입니다:</p><blockquote><p>“예수께서는 <strong>자기네만 옳은 줄 믿고 남을 업신여기는 사람들</strong>에게 이런 비유를 말씀하셨다. 두 사람이 기도하러 성전에 올라 갔는데 하나는 바리사이파 사람이었고 또 하나는 세리였다. 바리사이파 사람은 보라는 듯이 서서 오, 하느님! 감사합니다. 저는 다른 사람들과는 달리 욕심이 많거나 부정직하거나 음탕하지 않을뿐더러 세리와 같은 사람이 아닙니다. 저는 일주일에 두 번이나 단식하고 모든 수입의 십분의 일을 바칩니다 하고 기도하였다. 한편 세리는 멀찍이 서서 감히 하늘을 우러러 보지도 못하고 가슴을 치며 <strong>오, 하느님! 죄 많은 저에게 자비를 베풀어 주십시오</strong> 하고 기도하였다. 잘 들어라. 하느님께 올바른 사람으로 인정받고 집으로 돌아 간 사람은 바리사이파 사람이 아니라 바로 그 세리였다. <strong><mark>누구든지 자기를 높이면 낮아지고 자기를 낮추면 높아질 것이다</mark></strong>.‘” (<a href="https://bibleox.com/ko/ko-ctb/lk/18/#L9-14">루가 18:9-14</a>)</p></blockquote><h2>비판</h2><h3>말을 많이 하지 말라</h3><p>마태오 복음에는 “주님의 기도” 앞에 기도할 때 말을 많이 하지 말라는 그리스도의 말씀이 기록되어 있습니다:</p><blockquote><p>“‘너희는 기도할 때에 이방인들처럼 <strong>빈말을 되풀이하지 말아라</strong>. 그들은 <strong>말을 많이 해야만</strong> 하느님께서 들어 주시는 줄 안다.” (<a href="https://bibleox.com/ko/ko-ctb/mf/6/#L7">마태 6:7</a>)</p></blockquote><p>이것은 쓸데없는 말을 하지 말고, 하느님께서 이미 아시는 지상의 필요를 시시콜콜 청하지 말아야 한다는 뜻입니다. 주님 자신도 오래 기도하셨고 때로는 기도를 되풀이하셨습니다:</p><blockquote><p>“<strong>다시 가셔서</strong> <strong>같은 말씀으로 기도하셨다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/mk/14/#L39">마르 14:39</a>)</p></blockquote><p>여기도 보십시오: <a href="https://bibleox.com/ru/ru/w/молитва">기도: 빈말을 하지 않음</a>.</p>'
