  references: '<ol><li><p>어떤 이들은 여기서 사도 바울이 죽은 오네시보로를 위해 기도한다고 봅니다. 이 무렵 오네시보로가 이미 죽었다고 여기기 때문입니다. 사도는 그날에 주님께서 그에게 자비를 베푸시기를 빕니다(<a href="https://bibleox.com/ko/ko-nkrv/2tim/1/#L16-18">딤후 1:16-18</a>). 그럴 수도 있지만, 이때 오네시보로가 이미 죽었다고 볼 만한 확실한 근거는 아직 없는 듯합니다.</p></li></ol><p>번역: 로디온 블라소프 (AI 도구 활용). 저본: 러시아어 원문. 참고: 영어·일본어 번역. 성경 인용과 링크는 개역개정에 따름.</p>'
