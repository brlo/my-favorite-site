  title: 서서 드리는 기도
  copy_cover: true
  body: <h2>하느님께서는 구약의 성전을 기도의 집이라고 부르십니다</h2><blockquote><p>“나는 그들을 나의 거룩한 산에 불러다가 <strong>나의 기도처</strong>에서 기쁜 나날을 보내게 하리라. 그들이 나의 제단에 바치는 번제물과 희생제물을 내가 즐겨 받으리라. <strong><mark>나의 집은 뭇 백성이 모여 기도하는 집이라 불리리라</mark></strong>.‘” (<a href="https://bibleox.com/ko/ko-ctb/is/56/#L7">이사 56:7</a>; <a href="https://bibleox.com/ko/ko-ctb/mf/21/#L13">마태 21:13</a>; <a href="https://bibleox.com/ko/ko-ctb/mk/11/#L17">마르 11:17</a>)</p></blockquote><p>성전의 구조에는 앉을 자리가 마련되어 있지 않았습니다. <a href="https://bibleox.com/ru/ru/w/иерусалимский-храм">성전의 자세한 구조</a>.</p><h2>성전에서는 서서 기도했습니다</h2><blockquote><p>“그러자 유다 백성은 야훼께 도움을 청하려고 유다 온 성읍에서 모여 들어 야훼께 간구하였다. &lt;…&gt; <strong><mark>온 유다 백성은 부녀자들까지 야훼 앞에 나와 서 있었다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/2par/20/#L4,13">역하 20:4,13</a>)</p></blockquote><blockquote><p>“모세가 코라에게 말하였다. ‘그대, 레위의 후손이라는 분들은 내 말을 들어라. 이스라엘의 하느님께서 그대들을 이스라엘 회중 가운데서 구별하시어, 당신 앞에 나와 <strong><mark>야훼의 성막에서 섬기고 회중 앞에 나서서</mark></strong> 그들을 돌보게 하셨는데도 불만이냐?” (<a href="https://bibleox.com/ko/ko-ctb/chis/16/#L8-9">민 16:8-9</a>)</p></blockquote><h2>하느님을 섬기는 존재들은 서 있는 모습으로 묘사됩니다</h2><blockquote><p>“그래서 이 두 <strong>거룹</strong>이 날개를 펼친 것이 이십 척이었다. <strong><mark>이 거룹들은 서서</mark></strong> 똑바로 성소 쪽을 바라보고 있었다.” (<a href="https://bibleox.com/ko/ko-ctb/2par/3/#L13">역하 3:13</a>)</p></blockquote><h2>그리스도께서는 사도들에게 일어나 기도하라고 하셨습니다</h2><blockquote><p>“예수께서 고뇌에 싸여 <strong>더욱 간절히 기도하시니, 땀이 핏방울같이 되어</strong> 땅에 떨어졌다” (<a href="https://bibleox.com/ko/en-nrsv/lk/22/#L44">루가 22:44</a>, 영어 번역(NRSV)에서 옮김)</p></blockquote><blockquote><p>“기도를 마치시고 일어나 제자들에게 돌아 와 보시니 그들은 슬픔에 지쳐 잠들어 있었다. 이것을 보시고 예수께서는 제자들에게 ‘왜 이렇게들 잠만 자고 있느냐? 유혹에 빠지지 않도록 <strong><mark>일어나 기도하여라</mark></strong>’하고 말씀하셨다.” (<a href="https://bibleox.com/ko/ko-ctb/lk/22/#L45-46">루가 22:45-46</a>)</p></blockquote><p>“일어나라”는 말은 “잠에서 깨어나라”는 뜻으로도 이해할 수 있습니다. 그러나 이 대목은 그리스도 자신이 큰 수고와 땀방울로 기도하셨음을 보여 준다는 점에서도 중요합니다. 공동번역에는 43~44절이 없습니다.</p><h2>참고</h2><p>믿는 이들의 모임이 의자로 가득한 공간에 앉아서 하느님께 기도했다는 성경 구절은 없습니다.</p>
