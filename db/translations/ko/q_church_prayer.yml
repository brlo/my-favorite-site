- src: поклоны
  path: Bw7s_절
  title: 절
  copy_cover: true
  body: <h2>성전을 향한 절</h2><p>거룩한 그룹 <a href="https://bibleox.com/ru/ru/w/иерусалимский-храм">형상</a>으로 가득했던 <a href="https://bibleox.com/ru/ru/w/иерусалимский-храм">성전</a>을 향한 절:</p><blockquote><p>“오직 나는 주의 풍성한 사랑을 힘입어 주의 집에 들어가 주를 경외함으로 <strong>성전을 향하여 예배하리이다</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ps/5/#L7">시 5:7</a>)</p></blockquote><blockquote><p>“내가 <strong>주의 성전을 향하여 예배하며</strong> 주의 인자하심과 성실하심으로 말미암아 주의 이름에 감사하오리니 이는 주께서 주의 말씀을 주의 모든 이름보다 높게 하셨음이라” (<a href="https://bibleox.com/ko/ko-nkrv/ps/138/#L2">시 138:2</a>)</p></blockquote><h2>하느님의 발판(성전)에 드리는 절</h2><blockquote><p>“너희는 여호와 우리 하나님을 높여 <strong>그의 발등상 앞에서 경배할지어다</strong> <strong>그는 거룩하시도다</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ps/99/#L5">시 99:5</a>)</p></blockquote><blockquote><p>“우리가 <strong>그의 계신 곳으로 들어가서 그의 발등상 앞에서 엎드려 예배하리로다</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ps/132/#L7">시 132:7</a>)</p></blockquote><h2>계약궤 앞의 절</h2><p>예언자 눈의 아들 여호수아는 덮개에 그룹 형상이 있고 안에 거룩한 것들이 든 <a href="https://bibleox.com/ru/ru/w/ковчег_завета">계약궤</a> 앞에 엎드립니다:</p><blockquote><p>“여호수아가 옷을 찢고 이스라엘 장로들과 함께 <strong>여호와의 궤 앞에서 땅에 엎드려</strong> 머리에 티끌을 뒤집어쓰고 저물도록 있다가” (<a href="https://bibleox.com/ko/ko-nkrv/nav/7/#L6">수 7:6</a>)</p></blockquote><h2>세 천사의 모습으로 나타나신 하느님의 형상에 드리는 절</h2><p>아브라함은 세 사람의 모습으로 나타나신 하느님께 절합니다:</p><blockquote><p>“<strong>여호와께서</strong> 마므레의 상수리나무들이 있는 곳에서 <strong>아브라함에게 나타나시니라</strong> 날이 뜨거울 때에 그가 장막 문에 앉아 있다가 눈을 들어 본즉 <strong>사람 셋이</strong> 맞은편에 서 있는지라 그가 그들을 보자 곧 장막 문에서 달려나가 영접하며 <strong>몸을 땅에 굽혀</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gen/18/#L1-2">창 18:1-2</a>)</p></blockquote><p>하느님께서는 왜 형상으로 나타나셨습니까? 하느님은 본성상 보이지 않으시고 아무도 그분을 본 적이 없기 때문입니다(<a href="https://bibleox.com/ko/ko-nkrv/1tim/6/#L16">딤전 6:16</a>; <a href="https://bibleox.com/ko/ko-nkrv/in/1/#L18">요 1:18</a>). 그럼에도 성경은 나타나신 분이 바로 하느님(히브리어 יְהוָ֔ה, 여호와)이시라고 전합니다.</p><h2>사물에 드리는 절</h2><blockquote><p>“야곱이 또 이르되 내게 맹세하라 하매 그가 맹세하니 <strong>이스라엘이 침상 머리에서 하나님께 경배하니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gen/47/#L31">창 47:31</a>; <a href="https://bibleox.com/ko/ko-nkrv/evr/11/#L21">히 11:21</a>) <em>(칠십인역에는 “지팡이 끝에”(προσεκύνησεν Ισραηλ ἐπὶ τὸ ἄκρον τῆς ῥάβδου αὐτοῦ)로 되어 있습니다. 히브리서 11:21도 같습니다.)</em></p></blockquote><h2>천사에게 드리는 절</h2><p>먼저 천사는 영이고(<a href="https://bibleox.com/ko/ko-nkrv/evr/1/#L13-14">히 1:13-14</a>) 영에게는 살과 뼈가 없음을(<a href="https://bibleox.com/ko/ko-nkrv/lk/24/#L39">눅 24:39</a>) 짚어 두어야 합니다. 곧 천사도 사람의 모습으로 사람들에게 나타납니다. 그러므로 천사에게 절하는 사람은 <strong>보이지 않는 영(천사)의 보이는 형상에 절하는</strong> 것입니다:</p><blockquote><p>“그가 이르되 아니라 나는 여호와의 군대 대장으로 지금 왔느니라 하는지라 여호수아가 <strong>얼굴을 땅에 대고 엎드려 절하고</strong> 그에게 이르되 내 주여 종에게 무슨 말씀을 하려 하시나이까” (<a href="https://bibleox.com/ko/ko-nkrv/nav/5/#L14">수 5:14</a>)</p></blockquote><blockquote><p>“저녁 때에 그 두 천사가 소돔에 이르니 마침 롯이 소돔 성문에 앉아 있다가 그들을 보고 일어나 영접하고 <strong>땅에 엎드려 절하며</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gen/19/#L1">창 19:1</a>)</p></blockquote><blockquote><p>“불꽃이 제단에서부터 하늘로 올라가는 동시에 여호와의 사자가 제단 불꽃에 휩싸여 올라간지라 마노아와 그의 아내가 그것을 보고 그들의 <strong>얼굴을 땅에 대고 엎드리니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/sud/13/#L20">삿 13:20</a>)</p></blockquote><blockquote><p>“내가 그의 음성을 들었는데 그의 음성을 들을 때에 내가 <strong>얼굴을 땅에 대고</strong> 깊이 잠들었느니라” (<a href="https://bibleox.com/ko/ko-nkrv/dan/10/#L9">단 10:9</a>)</p></blockquote><blockquote><p>“그가 이런 말로 내게 이를 때에 내가 곧 <strong>얼굴을 땅에 향하고</strong> 말문이 막혔더니” (<a href="https://bibleox.com/ko/ko-nkrv/dan/10/#L15">단 10:15</a>)</p></blockquote><h2>예언자에게 드리는 절</h2><blockquote><p>“맞은편 여리고에 있는 <strong>선지자의 제자들이</strong> 그를 보며 말하기를 엘리야의 성령이 하시는 역사가 엘리사 위에 머물렀다 하고 가서 그에게로 나아가 <strong>땅에 엎드려 그에게 경배하고</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/4ts/2/#L15">왕하 2:15</a>)</p></blockquote><blockquote><p>“<strong>오바댜가</strong> 길에 있을 때에 엘리야가 그를 만난지라 <strong>그가 알아보고 엎드려</strong> 말하되 내 주 엘리야여 당신이시니이까” (<a href="https://bibleox.com/ko/ko-nkrv/3ts/18/#L7">왕상 18:7</a>)</p></blockquote><blockquote><p>“이에 <strong>느부갓네살 왕이 엎드려 다니엘에게 절하고</strong> 명하여 예물과 향품을 그에게 주게 하니라” (<a href="https://bibleox.com/ko/ko-nkrv/dan/2/#L46">단 2:46</a>)</p></blockquote><blockquote><p>“사울이 그에게 이르되 그의 모양이 어떠하냐 하니 그가 이르되 한 노인이 올라오는데 그가 겉옷을 입었나이다 하더라 사울이 그가 사무엘인 줄 알고 <strong>그의 얼굴을 땅에 대고 절하니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1ts/28/#L14">삼상 28:14</a>)</p></blockquote><blockquote><p>“아비가일이 다윗을 보고 급히 나귀에서 내려 <strong>다윗 앞에 엎드려 그의 얼굴을 땅에 대니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1ts/25/#L23">삼상 25:23</a>)</p></blockquote><h2>백성에게 드리는 절</h2><blockquote><p>“아브라함이 이에 그 땅의 백성 앞에서 <strong>몸을 굽히고</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gen/23/#L12">창 23:12</a>)</p></blockquote><h2>형에게 드리는 절</h2><blockquote><p>“자기는 그들 앞에서 나아가되 <strong>몸을 일곱 번 땅에 굽히며</strong> 그의 형 에서에게 가까이 가니” (<a href="https://bibleox.com/ko/ko-nkrv/gen/33/#L3">창 33:3</a>)</p></blockquote><blockquote><p>“때에 요셉이 나라의 총리로서 그 땅 모든 백성에게 곡식을 팔더니 <strong>요셉의 형들이</strong> 와서 그 앞에서 <strong>땅에 엎드려 절하매</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gen/42/#L6">창 42:6</a>)</p></blockquote><h2>장인에게 드리는 절</h2><blockquote><p>“모세가 나가서 그의 장인을 맞아 <strong>절하고</strong> 그에게 입 맞추고 그들이 서로 문안하고 함께 장막에 들어가서” (<a href="https://bibleox.com/ko/ko-nkrv/ish/18/#L7">출 18:7</a>)</p></blockquote>
