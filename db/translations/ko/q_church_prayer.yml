  body: <h2>성전을 향한 절</h2><p>거룩한 거룹 <a href="https://bibleox.com/ru/ru/w/иерусалимский-храм">형상</a>으로 가득했던 <a href="https://bibleox.com/ru/ru/w/иерусалимский-храм">성전</a>을 향한 절:</p><blockquote><p>“당신의 크신 사랑만을 믿고 나는 당신 집에 왔사옵니다. 주님 두려워하는 마음으로 <strong>당신의 거룩한 성전을 향하여 엎드립니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/ps/5/#L7">시편 5:7</a>)</p></blockquote><blockquote><p>“<strong>거룩한 당신의 궁전 향하여 엎드려</strong> 인자함과 성실함을 우러르며 당신의 이름 받들어 감사기도 드립니다. 언약하신 그 말씀, 당신 명성보다 크게 퍼졌사옵니다.” (<a href="https://bibleox.com/ko/ko-ctb/ps/138/#L2">시편 138:2</a>)</p></blockquote><h2>하느님의 발판(성전)에 드리는 절</h2><blockquote><p>“야훼 우리 하느님을 기리어라. <strong>그분의 발판 아래 엎드려라</strong>. <strong>그분은 거룩하시다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/ps/99/#L5">시편 99:5</a>)</p></blockquote><blockquote><p>“<strong>그분 계시는 곳으로 들어 가자. 그 발 앞에 엎드려 경배하자</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/ps/132/#L7">시편 132:7</a>)</p></blockquote><h2>계약궤 앞의 절</h2><p>예언자 눈의 아들 여호수아는 덮개에 거룹 형상이 있고 안에 거룩한 것들이 든 <a href="https://bibleox.com/ru/ru/w/ковчег_завета">계약궤</a> 앞에 엎드립니다:</p><blockquote><p>“여호수아와 이스라엘의 장로들은 옷을 찢고 머리에 먼지를 쓴 채 저물 때까지 <strong>야훼의 궤 앞에 엎드려 있었다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/nav/7/#L6">여호 7:6</a>)</p></blockquote><h2>세 천사의 모습으로 나타나신 하느님의 형상에 드리는 절</h2><p>아브라함은 세 사람의 모습으로 나타나신 하느님께 절합니다:</p><blockquote><p>“<strong>야훼께서</strong> 마므레의 상수리나무 곁에서 <strong>아브라함에게 나타나셨다</strong>. 아브라함은 한창 더운 대낮에 천막 문 어귀에 앉아 있다가 고개를 들어 <strong>웬 사람 셋이</strong> 자기를 향해 서 있는 것을 보았다. 그는 그들을 보자마자 천막 문에서 뛰어 나가 맞으며 <strong>땅에 엎드려</strong>” (<a href="https://bibleox.com/ko/ko-ctb/gen/18/#L1-2">창 18:1-2</a>)</p></blockquote><p>하느님께서는 왜 형상으로 나타나셨습니까? 하느님은 본성상 보이지 않으시고 아무도 그분을 본 적이 없기 때문입니다(<a href="https://bibleox.com/ko/ko-ctb/1tim/6/#L16">1디모 6:16</a>; <a href="https://bibleox.com/ko/ko-ctb/in/1/#L18">요한 1:18</a>). 그럼에도 성경은 나타나신 분이 바로 하느님(히브리어 יְהוָ֔ה, 야훼)이시라고 전합니다.</p><h2>사물에 드리는 절</h2><blockquote><p>“그러면 이제 나에게 맹세하여라.‘ 요셉이 시키는 대로 맹세하자, <strong>이스라엘은 침상 머리맡에 엎드려</strong> 하느님께 경배드렸다.” (<a href="https://bibleox.com/ko/ko-ctb/gen/47/#L31">창 47:31</a>; <a href="https://bibleox.com/ko/ko-ctb/evr/11/#L21">히브 11:21</a>) <em>(칠십인역에는 “지팡이 끝에”(προσεκύνησεν Ισραηλ ἐπὶ τὸ ἄκρον τῆς ῥάβδου αὐτοῦ)로 되어 있습니다. 히브리 11:21도 같습니다.)</em></p></blockquote><h2>천사에게 드리는 절</h2><p>먼저 천사는 영이고(<a href="https://bibleox.com/ko/ko-ctb/evr/1/#L13-14">히브 1:13-14</a>) 영에게는 살과 뼈가 없음을(<a href="https://bibleox.com/ko/ko-ctb/lk/24/#L39">루가 24:39</a>) 짚어 두어야 합니다. 곧 천사도 사람의 모습으로 사람들에게 나타납니다. 그러므로 천사에게 절하는 사람은 <strong>보이지 않는 영(천사)의 보이는 형상에 절하는</strong> 것입니다:</p><blockquote><p>“그가 대답하였다. ‘아니다. 나는 야훼 군대의 총사령관으로서 이제 온 것이다.’ 이 대답을 듣고 여호수아는 <strong>엎드려 얼굴을 땅에 대고 절하며</strong> 물었다. ‘내 주여, 당신의 종에게 무슨 말씀을 하시렵니까?’” (<a href="https://bibleox.com/ko/ko-ctb/nav/5/#L14">여호 5:14</a>)</p></blockquote><blockquote><p>“하느님의 천사 둘이 소돔에 다다른 것은 저녁 때였다. 롯이 때마침 성문께에 앉아 있다가 그들을 보고 일어나 맞으며 <strong>땅에 얼굴을 대고 엎드려</strong> 청하였다.” (<a href="https://bibleox.com/ko/ko-ctb/gen/19/#L1">창 19:1</a>)</p></blockquote><blockquote><p>“불길이 제단에서 하늘로 치솟는데 야훼의 천사가 그 불길을 타고 올라 가는 것이었다. 이를 보고 마노아와 그의 아내는 <strong>땅에 엎드렸다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/sud/13/#L20">판관 13:20</a>)</p></blockquote><blockquote><p>“그러는데 음성이 들려 왔다. 그 음성을 듣고 나는 그만 정신을 잃고 <strong>땅에 쓰러졌다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/dan/10/#L9">다니 10:9</a>)</p></blockquote><blockquote><p>“그의 말을 들으며 나는 아무 말도 못하고 <strong>땅에 엎드려 있었다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/dan/10/#L15">다니 10:15</a>)</p></blockquote><h2>예언자에게 드리는 절</h2><blockquote><p>“예리고에서 온 <strong>예언자 수련생들</strong>이 멀리서 그 광경을 보고 말했다.‘엘리야의 영검이 <strong>엘리사</strong>에게 내렸구나.’ 그러면서 엘리사 앞으로나와 <strong>땅에 엎드려 절하였다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/4ts/2/#L15">열하 2:15</a>)</p></blockquote><blockquote><p>“<strong>오바디야</strong>는 돌아 다니다가 자기를 만나러 온 엘리야와 마주치게 되었다. 그는 <strong>엘리야를 알아 보고 그 앞에 엎드려</strong> 인사를 하였다. ‘아니, 엘리야 선생님이 아니십니까?’” (<a href="https://bibleox.com/ko/ko-ctb/3ts/18/#L7">열상 18:7</a>)</p></blockquote><blockquote><p>“그러자 <strong>느부갓네살왕은 엎드려 다니엘에게 절을 하고</strong> 사람들더러 그에게 제사와 분향을 올리라는 분부를 내렸다.” (<a href="https://bibleox.com/ko/ko-ctb/dan/2/#L46">다니 2:46</a>)</p></blockquote><blockquote><p>“사울이 다시 그 여자에게 ‘어떤 모습이냐?’ 하고 묻자 ‘도포를 입은 노인이 올라옵니다’ 하고 대답하였다. 이 말에 사울은 그가 사무엘인 줄 알고 <strong>얼굴을 땅에 대고 절을 하였다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/1ts/28/#L14">삼상 28:14</a>)</p></blockquote><blockquote><p>“<strong>아비가일</strong>은 다윗을 보자 나귀에서 급히 내려 <strong>땅바닥에 엎드려 절하였다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/1ts/25/#L23">삼상 25:23</a>)</p></blockquote><h2>백성에게 드리는 절</h2><blockquote><p>“아브라함은 그 곳 백성들에게 <strong>절하고</strong>” (<a href="https://bibleox.com/ko/ko-ctb/gen/23/#L12">창 23:12</a>)</p></blockquote><h2>형에게 드리는 절</h2><blockquote><p>“그리고 야곱은 앞장서서 걸어 가다가 <strong>일곱 번 땅에 엎드려 절하면서</strong> 형에게로 나갔다.” (<a href="https://bibleox.com/ko/ko-ctb/gen/33/#L3">창 33:3</a>)</p></blockquote><blockquote><p>“그 때에 요셉은 이미 그 땅의 통치자가 되어 있었다. 그가 바로 그 땅 온 백성에게 곡식을 파는 책임자였다. <strong>요셉의 형들은</strong> 도착하는 길로 <strong>얼굴을 땅에 대고 그에게 절을 했다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/gen/42/#L6">창 42:6</a>)</p></blockquote><h2>장인에게 드리는 절</h2><blockquote><p>“모세는 장인을 맞으러 나가 <strong>엎드려 인사를 올리고</strong> 입을 맞추었다. 그들은 서로 안부를 물으며 천막으로 들어 갔다.” (<a href="https://bibleox.com/ko/ko-ctb/ish/18/#L7">출 18:7</a>)</p></blockquote>
