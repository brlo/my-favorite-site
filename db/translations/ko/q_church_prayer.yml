  title: 죽은 이들을 위한 기도
  copy_cover: true
  body: '<h2>머리말</h2><p>죽은 이를 위해 자비를 청하는 것은 사랑하는 마음, 곧 하느님과 이웃에 대한 사랑을 따르는 사람의 움직임입니다. 주님께서 죽은 이를 위한 이런저런 청원에 어떻게 응답하실지 우리는 모르지만, 희망의 근거와 돌보도록 움직이는 사랑이 있습니다. 그 근거는 무엇입니까? 하느님의 계시입니다. 계시에서 우리는 하느님께서 전능하시고, 저승과 죽음의 “열쇠”를 쥐고 계시며, 오는 세상에서도 용서받지 못할 죄가 있고(그러므로 다른 죄도 있음을 알 수 있습니다), 하느님께서 온갖 청원을 드리라고 우리를 부르셨음을 배웁니다. 또 죄인이 받는 벌의 정도가 <a href="https://bibleox.com/ru/ru/w/bib_Неодинаковая_мера_воздаяния:_мучения_и_блаженства">같지 않고</a> 의인의 복도 같지 않음을 알기에, 어떤 사람이 구원받지 못하더라도 그의 운명이 가벼워지기를 희망합니다. 구약에서도 죽은 이들을 돌보았고(<a href="#HH-구약-죽은-이들의-죄-용서를-위한-돌봄">아래</a> 참조), 가장 오래된 그리스도인들도 돌보았습니다(<a href="https://bibleox.com/ru/ru/w/91USaqiJ_молитвы_за_умерших">자세히</a>).</p><p>이 모든 일로 우리를 움직이는 것은 “가실 줄을 모르는” 사랑입니다(<a href="https://bibleox.com/ko/ko-ctb/1kor/13/#L8">1고린 13:8</a>).</p><h2>하느님은 전능하십니다</h2><blockquote><p>“나를 보아라. 야훼는 모든 사람을 낸 하느님이라, <strong>못할 일이 없다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/ier/32/#L27">예레 32:27</a>)</p></blockquote><p>다른 구절: <a href="https://bibleox.com/ru/ru/w/Бог-всемогущий">전능하신 하느님</a>.</p><h2>하느님께서는 계명을 지키는 이들이 믿음으로 청하는 것을 기도에서 받으리라고 약속하셨습니다</h2><blockquote><p>“그리고 <strong>우리가 무엇을 구하든지 하느님께로부터 다 받을 수 있습니다</strong>. 우리가 하느님의 계명을 지키고 있으며 하느님께서 기뻐하실 만한 일들을 하고 있기 때문입니다.” (<a href="https://bibleox.com/ko/ko-ctb/1in/3/#L22">1요한 3:22</a>)</p></blockquote><blockquote><p>“<strong>우리가 하느님께 청하는 것은 무엇이든지 다 들어 주신다</strong>는 것을 알고 있으니 우리가 하느님께 청한 것은 이미 다 받은 것이나 마찬가지입니다.” (<a href="https://bibleox.com/ko/ko-ctb/1in/5/#L15">1요한 5:15</a>)</p></blockquote><blockquote><p>“또 너희가 <strong>기도할 때에 믿고 구하는 것은 무엇이든지 다 받을 것이다</strong>.‘” (<a href="https://bibleox.com/ko/ko-ctb/mf/21/#L22">마태 21:22</a>)</p></blockquote><blockquote><p>“‘내가 다시 말한다. 너희 중의 두 사람이 이 세상에서 마음을 모아 구하면 하늘에 계신 내 아버지께서는 <strong>무슨 일이든 다 들어 주실 것이다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/mf/18/#L19">마태 18:19</a>)</p></blockquote><blockquote><p>“너희가 나를 택한 것이 아니라 내가 너희를 택하여 내세운 것이다. 그러니 너희는 세상에 나가 언제까지나 썩지 않을 열매를 맺어라. 그러면 <strong>아버지께서는 너희가 내 이름으로 구하는 것을 다 들어 주실 것이다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/in/15/#L16">요한 15:16</a>)</p></blockquote><p>이 말씀은 죄짓는 형제들의 구원을 위한 기도의 문맥에서 나옵니다. 하느님께서는 의인의 기도를 통해 그들을 구원하십니다:</p><blockquote><p>“<strong><mark>우리가 하느님께 청하는 것은 무엇이든지 다 들어 주신다</mark></strong>는 것을 알고 있으니 우리가 하느님께 청한 것은 이미 다 받은 것이나 마찬가지입니다. 어떤 사람이 <strong><mark>자기 형제가 죄짓는 것을 볼 때 그것이 죽을 죄가 아니라면 하느님께 간구하시오. 그러면 하느님께서 그 죄인을 살려 주실 것입니다</mark></strong>. 사실 죽을 죄가 있습니다. 이런 죄를 지은 사람을 위해서 간구하라고 말하는 것은 아닙니다.” (<a href="https://bibleox.com/ko/ko-ctb/1in/5/#L15-16">1요한 5:15-16</a>)</p></blockquote><h2>죄는 교회의 기도를 통해 용서받을 수 있습니다</h2><p>곧 죄는 본인이 회개하고 용서를 청할 때만이 아니라, 다른 이들이 그의 죄의 용서를 청할 때에도 용서받습니다:</p><blockquote><p>“여러분 가운데 앓는 사람이 있으면 그 사람은 <strong>교회의 원로들을 청하십시오</strong>. 원로들은 주님의 이름으로 그에게 기름을 바르고 <strong>그를 위하여 기도해 주어야 합니다</strong>. 믿고 구하는 기도는 앓는 사람을 낫게 할 것이며 주님께서 그를 일으켜 주실 것입니다. 또 <strong>그가 지은 죄가 있으면 그 죄도 용서를 받을 것입니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/iak/5/#L14-15">야고 5:14-15</a>)</p></blockquote><p>중풍에 걸린 동료의 친구들은 그를 그리스도께 데려오려고 몹시 애썼습니다. 그들의 믿음을 보시고 주님께서는 중풍병자의 죄를 용서하시고 고쳐 주셨습니다:</p><blockquote><p>“예수께서는 <strong>그들의 믿음을 보시고</strong> 중풍병자에게 ‘<strong>너는 죄를 용서받았다</strong>.’하고 말씀하셨다.” (<a href="https://bibleox.com/ko/ko-ctb/mk/2/#L5">마르 2:5</a>)</p></blockquote><h2>죄는 죽은 뒤에도 용서받을 수 있습니다</h2><p>주 예수 그리스도의 말씀에 따르면 죄의 용서는 이 세상에서만이 아니라 오는 세상에서도 가능합니다. 지금도 나중에도 용서받지 못할 죄가 있기 때문입니다:</p><blockquote><p>“그러므로 잘 들어라. 사람들이 어떤 죄를 짓거나 모독하는 말을 하더라도 그것은 다 용서받을 수 있지만 성령을 거슬러 모독한 죄만은 용서받지 못할 것이다. 또 사람의 아들을 거역해서 말하는 사람은 용서받을 수 있어도 성령을 거역해서 말하는 사람은 <strong>현세에서도 내세에서도 용서받지 못할 것이다</strong>.‘” (<a href="https://bibleox.com/ko/ko-ctb/mf/12/#L31-32">마태 12:31-32</a>)</p></blockquote><h2>그리스도께서는 저승과 죽음의 열쇠를 쥐고 계십니다</h2><blockquote><p>“나는 그분을 뵙자 마치 죽은 사람처럼 그분의 발 앞에 쓰러졌습니다. 그러자 그분은 나에게 오른손을 얹으시고 이렇게 말씀하셨습니다. ‘두려워하지 말아라. 나는 처음과 마지막이고 살아 있는 존재이다. 나는 죽었지만 이렇게 살아 있고 영원무궁토록 살 것이다. 그리고 <strong>죽음과 지옥의 열쇠를 내 손에 쥐고 있다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/otkr/1/#L17-18">묵시 1:17-18</a>) <em>(“지옥”은 그리스어로 ᾅδης, “저승”입니다.)</em></p></blockquote><h2>구약: 죽은 이들의 죄 용서를 위한 돌봄</h2><h3>죽은 이를 위한 단식</h3><p>이스라엘 사람들은 죽은 사울 왕과 그의 아들들과 전쟁에서 쓰러진 모든 이스라엘 사람을 위해 단식했습니다.</p><blockquote><p>“그리하여 그날, 사울과 그의 세 아들과 무기당번과 사울의 부하들이 모두 죽고 말았다.” (<a href="https://bibleox.com/ko/ko-ctb/1ts/31/#L6">삼상 31:6</a>)</p></blockquote><blockquote><p>“그 뼈를 야베스에 있는 위성류나무 아래 매장하고 <strong>칠 일간 단식하였다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/1ts/31/#L13">삼상 31:13</a>)</p></blockquote><blockquote><p>“그리고, 사울과 그의 아들 요나단, 야훼의 백성, 이스라엘 가문이 칼에 맞아 쓰러진 것을 슬퍼하여 <strong>해질 때까지 통곡하며 단식하였다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/2ts/1/#L12">삼하 1:12</a>)</p></blockquote><h3>죽은 이를 위한 기도와 제사</h3><p>유다인들은 전사자들의 죄가 용서받도록 기도했습니다. 또 죽은 이들을 위한 속죄 제사를 드리고 그들이 죄에서 깨끗해지도록 예루살렘 성전에 돈을 보냈습니다:</p><blockquote><p>“그들은 <strong>저지른 죄가 완전히 지워지기를 청하며</strong> 간구에 나섰다. … 그는 사람들에게서 <strong>은 이천 드라크마를 모아 예루살렘으로 보내어 속죄 제물을 바치게 했다. 그는 부활을 생각하여 참으로 훌륭하고 고귀하게 행동했다.</strong> 쓰러진 이들이 다시 일어나리라고 기대하지 않았다면 <strong>죽은 이들을 위해 기도하는 것은 쓸데없고 어리석은 일이었을 것이다.</strong> … 그래서 그는 <strong>죽은 이들이 죄에서 풀려나도록 속죄를 드렸다</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/2mak/12/#L42-45">2마카 12:42-45</a>, 그리스어에서 번역)</p></blockquote><h3>죽은 이를 위한 자선</h3><p>유다인들은 죽은 이를 위해 자선을 베풀었습니다:</p><blockquote><p>“모든 산 사람에게 은혜를 베풀고 <strong>죽은 이에게도 은혜를 거두지 말라</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/prsir/7/#L33">집회 7:33</a>, 그리스어에서 번역)</p></blockquote><blockquote><p>“<strong>의인들의 무덤 위에 네 빵을 놓아라</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/tov/4/#L17">토비 4:17</a>, 그리스어에서 번역)</p></blockquote><p>죽은 이를 위한 자선은 십일조에서 내지 않았습니다:</p><blockquote><p>“삼 년째 되는 해 곧 십일조를 바치는 해가 되면, <strong>네 모든 소출에서 열의 하나를 떼내어</strong> 레위인과 떠돌이와 고아와 과부에게 나누어 주고 그것을 너희 성 안에서 실컷 먹게 하여라. 그리고는 <strong>너희 하느님 야훼 앞에 아뢰어라</strong>. ‘주께서 분부하신 대로 거룩한 것을 집에서 모두 퍼내어 레위인과 떠돌이와 고아와 과부에게 나누어 주었습니다. 주께서 분부하신 것을 잊지 않고 어김없이 다 행하였습니다. 저는 상중에 그것을 먹은 일도 없고 부정한 몸으로 먹은 일도 없으며 <strong>죽은 혼령에게 바친 일도 없습니다</strong>. 저는 저의 하느님 야훼께서 이르신 말씀대로 했습니다. 분부하신 대로 다 행하였습니다.” (<a href="https://bibleox.com/ko/ko-ctb/vtor/26/#L12-14">신 26:12-14</a>)</p></blockquote><h2>하느님께는 모두가 살아 있습니다</h2><p>앞의 구절들은 유다인들의 믿음과 구체적인 실천을 보여 줍니다. 그들은 죽은 이들의 죄 용서를 위해 기도하고, 단식하고, 제사를 바치고, 자선을 베풀며 죽은 뒤의 운명을 돌보았습니다. 죽음 뒤의 존재를 부정한 것은 사두가이파뿐이었고, 주님께서는 그들의 오류와 성경에 대한 무지를 꾸짖으셨습니다:</p><blockquote><p>“예수께서 이렇게 대답하셨다. ‘<strong>너희는 성서도 모르고 하느님의 권능도 모르니까</strong> 그런 잘못된 생각을 하는 것이다.” (<a href="https://bibleox.com/ko/ko-ctb/mf/22/#L29">마태 22:29</a>)</p></blockquote><blockquote><p>“이 말씀은 하느님께서 <strong>죽은 이들의 하느님이 아니라 살아 있는 이들의 하느님</strong>이라는 뜻이다. 그러니 <strong>너희의 생각은 아주 잘못된 것이다</strong>.‘” (<a href="https://bibleox.com/ko/ko-ctb/mk/12/#L27">마르 12:27</a>)</p></blockquote><h2>죽은 이들을 위한 모든 도움에 대한 희망</h2><p>어떤 사람이 지옥에서 구원받지 못하더라도, 그의 고통은 지금이나 장차(공동 부활과 심판 뒤에) 가벼워질 수 있고 위로가 주어질 수 있습니다. 벌의 정도가 같지 않기 때문입니다:</p><blockquote><p>“<strong>자기 주인의 뜻을 알고도</strong> 아무런 준비를 하지 않았거나 <strong><mark>주인의 뜻대로 하지 않은 종은 매를 많이 맞을 것이다. 그러나 주인의 뜻을 몰랐다면</mark></strong> <strong><mark>매맞을 만한 짓을 하였어도 덜 맞을 것이다</mark></strong>. 많이 받은 사람은 많은 것을 돌려 주어야 하며 <strong>많이 맡은 사람은 더 많은 것을 내어 놓아야 한다</strong>.‘” (<a href="https://bibleox.com/ko/ko-ctb/lk/12/#L47-48">루가 12:47-48</a>)</p></blockquote><p>벌의 차이에 관한 더 많은 구절: <a href="https://bibleox.com/ru/ru/w/bib_Неодинаковая_мера_воздаяния:_мучения_и_блаженства">벌의 정도는 같지 않습니다</a>.</p>'
