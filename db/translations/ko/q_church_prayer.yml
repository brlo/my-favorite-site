- src: молитва-не-своими-словами
  path: Pm4t_정해진_틀에_따른_기도
  title: 정해진 틀에 따른 기도
  copy_cover: true
  body: <h2>정해진 틀에 따른 기도</h2><p>구약에는 하느님의 영감을 받은 큰 기도서, 곧 시편이 있습니다. 예언자이자 왕인 다윗이 지었습니다. 시편은 성전에서 쓰였고, 계단을 오르며 불렀습니다.</p><p>사도들은 주님께 기도를 가르쳐 달라고 청하면서, 예언자 세례 요한이 이미 제자들에게 기도를 가르쳤다는 것을 듭니다:</p><blockquote><p>“예수께서 한 곳에서 기도하시고 마치시매 제자 중 하나가 여짜오되 주여 <strong>요한이 자기 제자들에게 기도를 가르친 것과 같이 우리에게도 가르쳐 주옵소서</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/lk/11/#L1">눅 11:1</a>)</p></blockquote><p>그러자 그리스도께서는 당신의 말씀으로 기도의 틀을 주셨습니다:</p><blockquote><p>“예수께서 이르시되 너희는 기도할 때에 이렇게 하라 아버지여 이름이 거룩히 여김을 받으시오며 나라가 임하시오며 우리에게 날마다 일용할 양식을 주시옵고 우리가 우리에게 죄 지은 모든 사람을 용서하오니 우리 죄도 사하여 주시옵고 우리를 시험에 들게 하지 마시옵소서 하라” (<a href="https://bibleox.com/ko/ko-nkrv/lk/11/#L2-4">눅 11:2-4</a>; <a href="https://bibleox.com/ko/ko-nkrv/mf/6/#L9-13">마 6:9-13</a>)</p></blockquote><p>곧 기도문을 주고 정해진 틀(규정)에 따라 기도하는 것은 지극히 정상이며 성경적인 실천입니다.</p>
  title_sub: 기도는 자기 기도이되 자기 말이 아닐 수 있는가
