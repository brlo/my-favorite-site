  path: Pr1y_기도
  title: 기도
  copy_cover: true
  body: '<h2>기도하라는 계명</h2><h3>청원 기도</h3><blockquote><p>“‘<strong><mark>구하라, 받을 것이다</mark></strong>. 찾으라, 얻을 것이다. <strong>문을 두드려라, 열릴 것이다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/mf/7/#L7">마태 7:7</a>; <a href="https://bibleox.com/ko/ko-ctb/lk/11/#L9">루가 11:9</a>)</p></blockquote><h3>감사 기도</h3><blockquote><p>“<strong><mark>늘 기도하십시오. 어떤 처지에서든지 감사하십시오. 이것이 그리스도 예수를 통해서 여러분에게 보여 주신 하느님의 뜻입니다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/1sol/5/#L17-18">1데살 5:17-18</a>)</p></blockquote><blockquote><p>“아무 걱정도 하지 마십시오. <strong><mark>언제나 감사하는 마음으로 기도하고 간구하며</mark></strong> 여러분의 소원을 하느님께 아뢰십시오.” (<a href="https://bibleox.com/ko/ko-ctb/fil/4/#L6">필립 4:6</a>)</p></blockquote><blockquote><p>“술취하지 마십시오. 방탕한 생활이 거기에서 옵니다. 여러분은 성령을 가득히 받아야 합니다. 성시와 찬송가와 영가를 모두 같이 부르십시오. 그리고 진정한 마음으로 노래 불러 주님을 찬양하십시오. 또 <strong><mark>모든 일에 언제나 우리 주 예수 그리스도의 이름으로 하느님 아버지께 감사 드리십시오</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/ef/5/#L18-20">에페 5:18-20</a>)</p></blockquote><blockquote><p>“여러분은 무슨 말이나 무슨 일이나 모두 주 예수의 이름으로 하고 <strong><mark>그분을 통해서 하느님 아버지께 감사를 드리십시오</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/kol/3/#L17">골로 3:17</a>)</p></blockquote><h3>하느님을 찬양하는 기도(송영)</h3><blockquote><p>“<strong><mark>감사기도 드리며</mark></strong> 성문으로 들어 가거라. 찬양노래 부르며 뜰안으로 들어 가거라. <strong><mark>감사기도 드려라. 그 이름을 기리어라</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/ps/100/#L4">시편 100:4</a>)</p></blockquote><blockquote><p>“<strong><mark>나 어떤 일이 있어도 야훼를 찬양하리라. 주를 찬양하는 노래 내 입에서 그칠 날이 없으리라</mark></strong>. 나의 자랑, 야훼께 있으니 비천한 자들아 듣고 기뻐하여라.” (<a href="https://bibleox.com/ko/ko-ctb/ps/34/#L1-2">시편 34:1-2</a>)</p></blockquote><blockquote><p>“그러므로 우리는 예수의 이름으로 <strong><mark>언제나 하느님께 찬미의 제사를 드립시다</mark></strong>. <strong><mark>하느님의 이름을 우리의 입으로 찬양합시다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/evr/13/#L15">히브 13:15</a>)</p></blockquote><h2>끊임없는 기도와 하느님을 생각함</h2><blockquote><p>“여러분은 또한 <strong><mark>언제나 기도하며</mark></strong> 하느님의 도우심을 청하십시오. 모든 경우에 <strong>성령의 도움을 받아 기도하십시오</strong>. 늘 깨어서 꾸준히 기도하며 모든 성도들을 위하여 간구하십시오.” (<a href="https://bibleox.com/ko/ko-ctb/ef/6/#L18">에페 6:18</a>)</p></blockquote><blockquote><p>“<strong><mark>늘 기도하십시오</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/1sol/5/#L17">1데살 5:17</a>)</p></blockquote><blockquote><p>“예수께서는 제자들에게 <strong><mark>언제나 기도하고 용기를 잃지 말아야 한다고</mark></strong> 이렇게 비유를 들어 가르치셨다. 어떤 도시에 하느님을 두려워하지 않고 사람도 거들떠 보지 않는 재판관이 있었다. 그 도시에는 어떤 과부가 있었는데 그 여자는 늘 그를 찾아 가서 저에게 억울한 일을 한 사람이 있습니다. 올바른 판결을 내려 주십시오 하고 졸라댔다. 오랫동안 그 여자의 청을 들어 주지 않던 재판관도 결국 나는 하느님도 두려워하지 않고 사람도 거들떠 보지 않는 사람이지만 이 과부가 너무도 성가시게 구니 그 소원대로 판결해 주어야지 하는 생각을 하게 되었다.‘ 주님께서는 계속해서 말씀하셨다. ’이 고약한 재판관의 말을 새겨 들어라. <strong>하느님께서 택하신 백성이 밤낮 부르짖는데도</strong> 올바르게 판결해 주지 않으시고 오랫동안 그대로 내버려 두실 것 같으냐?” (<a href="https://bibleox.com/ko/ko-ctb/lk/18/#L1-7">루가 18:1-7</a>)</p></blockquote><h2>어떤 기도가 들어 허락됩니까</h2><h3>믿음</h3><blockquote><p>“만일 여러분 중에 지혜가 부족한 사람이 있으면 하느님께 구하십시오. 그러면 아무도 나무라지 않으시고 모든 사람에게 후하게 주시는 하느님께서 지혜를 주실 것입니다. <strong><mark>조금도 의심을 품지 말고 오직 믿음으로 구하십시오. 의심을 품는 사람은 바람에 밀려 흔들리는 바다 물결 같습니다</mark></strong>. <strong>그런 사람은 아예 주님으로부터 아무것도 받을 생각을 말아야 합니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/iak/1/#L5-7">야고 1:5-7</a>)</p></blockquote><blockquote><p>“또 너희가 <strong><mark>기도할 때에 믿고 구하는 것은</mark></strong> 무엇이든지 다 받을 것이다.‘” (<a href="https://bibleox.com/ko/ko-ctb/mf/21/#L22">마태 21:22</a>; <a href="https://bibleox.com/ko/ko-ctb/mk/11/#L24">마르 11:24</a>)</p></blockquote><h3>의로움(하느님의 뜻에 따른 삶, 죄에서 돌아섬)</h3><blockquote><p>“야훼께선 악한 사람의 제물을 역겨워하시고 <strong><mark>바른 사람의 기도는 반가와하신다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/pr/15/#L8">잠언 15:8</a>)</p></blockquote><blockquote><p>“야훼께서는 나쁜 사람을 멀리하시고 <strong><mark>착한 사람의 기도는 들어 주신다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/pr/15/#L29">잠언 15:29</a>)</p></blockquote><blockquote><p>“<strong><mark>너희가 나를 떠나지 않고 또 내 말을 간직해 둔다면</mark></strong> 무슨 소원이든지 구하는 대로 다 이루어질 것이다.” (<a href="https://bibleox.com/ko/ko-ctb/in/15/#L7">요한 15:7</a>)</p></blockquote><blockquote><p>“야훼께서 말씀하셨다. 이 백성은 말로만 나와 가까운 체하고 <strong>입술로만 나를 높이는 체하며 그 마음은 나에게서 멀어져만 간다</strong>. 그들이 나를 공경한다 하여도 사람들에게서 배운 관습일 따름이다.” (<a href="https://bibleox.com/ko/ko-ctb/is/29/#L13">이사 29:13</a>)</p></blockquote><h3>겸손하고 뉘우치는 마음</h3><blockquote><p>“하느님, 내 제물은 찢어진 마음뿐, <strong><mark>찢어지고 터진 마음을 당신께서 얕보지 아니하시니</mark></strong>,” (<a href="https://bibleox.com/ko/ko-ctb/ps/51/#L17">시편 51:17</a>)</p></blockquote><blockquote><p>“야훼여! 당신은 <strong><mark>미약한 사람들의 호소를 들으시고</mark></strong> 그 마음 든든하게 해 주시옵니다. 귀를 기울이시어” (<a href="https://bibleox.com/ko/ko-ctb/ps/10/#L17">시편 10:17</a>)</p></blockquote><blockquote><p>“<strong>겸손한 이의 기도는 구름을 꿰뚫는다</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/prsir/35/#L17">집회 35:17</a>, 그리스어에서 번역)</p></blockquote><blockquote><p>“모두 내가 이 손으로 지은 것이 아니냐? 다 나의 것이 아니냐?‘ 야훼의 말씀이시다. ’그러나 <strong><mark>내가 굽어 보는 사람은 억눌려 그 마음이 찢어지고</mark></strong> 나의 말을 송구스럽게 받는 사람이다.” (<a href="https://bibleox.com/ko/ko-ctb/is/66/#L2">이사 66:2</a>)</p></blockquote><blockquote><p>“그러니 어디에서 당신의 자비를 구할 수 있겠습니까? 그러나 <strong><mark>우리의 뉘우치는 마음과 겸손하게 된 정신을 받아 주소서</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/dan/3/#L39">다니 3:39</a>)</p></blockquote><blockquote><p>“예수께서는 <strong><mark>자기네만 옳은 줄 믿고 남을 업신여기는 사람들에게 이런 비유를 말씀하셨다</mark></strong>. 두 사람이 기도하러 성전에 올라 갔는데 하나는 바리사이파 사람이었고 또 하나는 세리였다. <strong>바리사이파 사람은 보라는 듯이 서서</strong> 오, 하느님! 감사합니다. <strong><mark>저는 다른 사람들과는 달리</mark></strong> 욕심이 많거나 부정직하거나 음탕하지 않을뿐더러 세리와 같은 사람이 아닙니다. 저는 일주일에 두 번이나 단식하고 모든 수입의 십분의 일을 바칩니다 하고 기도하였다. 한편 <strong>세리는 멀찍이 서서 감히 하늘을 우러러 보지도 못하고</strong> 가슴을 치며 <strong>오, 하느님! 죄 많은 저에게 자비를 베풀어 주십시오</strong> 하고 기도하였다. 잘 들어라. 하느님께 올바른 사람으로 인정받고 집으로 돌아 간 사람은 바리사이파 사람이 아니라 바로 그 세리였다. 누구든지 자기를 높이면 낮아지고 자기를 낮추면 높아질 것이다.‘” (<a href="https://bibleox.com/ko/ko-ctb/lk/18/#L9-14">루가 18:9-14</a>)</p></blockquote><p>함께 보기: <a href="https://bibleox.com/ru/ru/w/смирение">겸손</a>.</p><h3>모든 잘못을 용서함</h3><blockquote><p>“<strong><mark>너희가 일어서서 기도할 때에 어떤 사람과 서로 등진 일이 생각나거든 그를 용서하여라</mark></strong>. 그래야만 하늘에 계신 너희의 아버지께서도 너희의 잘못을 용서해 주실 것이다.” (<a href="https://bibleox.com/ko/ko-ctb/mk/11/#L25">마르 11:25</a>) <em>(비잔틴 본문(다수 사본)에는 26절이 이어집니다: “너희가 용서하지 않으면 하늘에 계신 너희 아버지께서도 너희의 잘못을 용서해 주지 않으실 것이다.”)</em></p></blockquote><blockquote><p>“<strong><mark>너희가 남의 잘못을 용서하면 하늘에 계신 아버지께서도 너희를 용서하실 것이다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/mf/6/#L14">마태 6:14</a>)</p></blockquote><h3>이웃과의 평화</h3><blockquote><p>“그러므로 제단에 예물을 드리려 할 때에 너에게 원한을 품고 있는 형제가 생각나거든 그 예물을 제단 앞에 두고 <strong><mark>먼저 그를 찾아 가 화해하고 나서 돌아와 예물을 드려라</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/mf/5/#L23-24">마태 5:23-24</a>)</p></blockquote><blockquote><p>“<strong>남편된 사람들도</strong> 이와 같이 자기 아내가 자기보다 연약한 여성이라는 것을 잘 이해하고 함께 살아 가며 생명의 은총을 상속받을 사람으로 여기고 <strong>존경하십시오</strong>. 그래야 <strong>여러분의 기도생활이 끊어지지 않을 것입니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/1pet/3/#L7">1베드 3:7</a>)</p></blockquote><h3>인내</h3><blockquote><p>“예수께서는 제자들에게 <strong><mark>언제나 기도하고 용기를 잃지 말아야 한다고</mark></strong> 이렇게 비유를 들어 가르치셨다. 어떤 도시에 하느님을 두려워하지 않고 사람도 거들떠 보지 않는 재판관이 있었다. 그 도시에는 어떤 과부가 있었는데 그 여자는 늘 그를 찾아 가서 저에게 억울한 일을 한 사람이 있습니다. 올바른 판결을 내려 주십시오 하고 졸라댔다. 오랫동안 그 여자의 청을 들어 주지 않던 재판관도 결국 나는 하느님도 두려워하지 않고 사람도 거들떠 보지 않는 사람이지만 이 과부가 너무도 성가시게 구니 그 소원대로 판결해 주어야지 하는 생각을 하게 되었다.‘ 주님께서는 계속해서 말씀하셨다. ’이 고약한 재판관의 말을 새겨 들어라. <strong>하느님께서 택하신 백성이 밤낮 부르짖는데도</strong> 올바르게 판결해 주지 않으시고 오랫동안 그대로 내버려 두실 것 같으냐?” (<a href="https://bibleox.com/ko/ko-ctb/lk/18/#L1-7">루가 18:1-7</a>)</p></blockquote><blockquote><p>“예수께서는 그들에게 또 이렇게 말씀하셨다. ‘너희 중 한 사람에게 어떤 친구가 있다고 하자. 한밤중에 그 친구를 찾아 가서 여보게, 빵 세 개만 꾸어 주게. 내 친구 하나가 먼 길을 가다가 우리 집에 들렀는데 내어 놓을 것이 있어야지 하고 사정을 한다면 그 친구는 안에서 귀찮게 굴지 말게. 벌써 문을 닫아 걸고 아이들도 나도 다 잠자리에 들었으니 일어나서 줄 수가 없네 하고 거절할 것이다. 잘 들어라. 이렇게 우정만으로는 일어나서 빵을 내어 주지 않겠지만 <strong><mark>귀찮게 졸라대면 마침내는 자리에서 일어나 그의 청을 들어 주지 않겠느냐? 그러므로 나는 말한다. 구하여라, 받을 것이다</mark></strong>. 찾아라, 얻을 것이다. 문을 두드려라, 열릴 것이다. 누구든지 구하면 받고 찾으면 얻고 문을 두드리면 열릴 것이다.” (<a href="https://bibleox.com/ko/ko-ctb/lk/11/#L5-10">루가 11:5-10</a>)</p></blockquote><h3>자선(어려운 이들을 실제로 도움)</h3><blockquote><p>“기도는 단식과 <strong>자선</strong>과 의로움과 함께할 때 좋다. … <strong>금을 쌓아 두는 것보다 자선을 베푸는 것이 낫다</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/tov/12/#L8">토비 12:8</a>, 그리스어에서 번역)</p></blockquote><blockquote><p>“복되어라, <strong>딱하고 가난한 사람 알아 주는 이</strong>여, 불행한 날에 야훼께서 그를 구해 주시리라. 그를 지켜 주시고 생명을 주시고 땅 위에서 복을 주시며 원수들에게 먹히지 않게 하시리라.” (<a href="https://bibleox.com/ko/ko-ctb/ps/41/#L1-2">시편 41:1-2</a>)</p></blockquote><blockquote><p>“<strong>없는 사람에게 적선하는 것은</strong> 야훼께 빚을 주는 셈. <strong>야훼께서 그 은혜를 갚아 주신다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/pr/19/#L17">잠언 19:17</a>)</p></blockquote><blockquote><p>“<strong>두 손 모아 아무리 빌어 보아라. 내가 보지 아니하리라. 빌고 또 빌어 보아라. 내가 듣지 아니하리라</strong>. 너희의 손은 피투성이, 몸을 씻어 정결케 하여라. 내 앞에서 악한 행실을 버려라. 깨끗이 악에서 손을 떼어라. <strong><mark>착한 길을 익히고 바른 삶을 찾아라. 억눌린 자를 풀어 주고, 고아의 인권을 찾아 주며 과부를 두둔해 주어라</mark></strong>.‘” (<a href="https://bibleox.com/ko/ko-ctb/is/1/#L15-17">이사 1:15-17</a>)</p></blockquote><blockquote><p>“그는 천사를 바라보자 겁에 질려서 ‘주님, 무슨 일이십니까?’하고 물었다. 천사는 ‘<strong><mark>하느님께서 너의 기도와 자선을 받아 들이시고 너를 기억하고 계신다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/act/10/#L4">사도 10:4</a>)</p></blockquote><h3>단식</h3><blockquote><p>“그러나 이제라도, 야훼의 말이다, <strong><mark>진심으로 뉘우쳐 나에게 돌아 오라. 단식하며</mark></strong> 가슴을 치고 울어라.‘” (<a href="https://bibleox.com/ko/ko-ctb/iol/2/#L12">요엘 2:12</a>)</p></blockquote><blockquote><p>“나는 삼베를 걸치고 <strong><mark>단식하며</mark></strong> 먼지를 들쓴 채 주 하느님을 우러러 <strong><mark>기도를 올리며 자비를 빌었다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/dan/9/#L3">다니 9:3</a>)</p></blockquote><blockquote><p>“그래서 그들은 다시 <strong>단식하며 기도를 하고</strong> 나서 그들에게 안수를 해 주고 떠나 보냈다.” (<a href="https://bibleox.com/ko/ko-ctb/act/13/#L3">사도 13:3</a>)</p></blockquote><blockquote><p>“<strong>단식으로</strong> 두 무릎은 후들거리고 내 살은 기름기가 없어서 말라 버렸습니다. &lt;…&gt; 야훼, 나의 하느님, 나를 도와 주소서. 당신 사랑에 어울리게 나를 건져 주소서.” (<a href="https://bibleox.com/ko/ko-ctb/ps/109/#L24,26">시편 109:24,26</a>)</p></blockquote><h3>위선이 없음</h3><blockquote><p>“‘<strong><mark>기도할 때에도 위선자들처럼 하지 말아라. 그들은 남에게 보이려고 회당이나 한 길 모퉁이에 서서 기도하기를 좋아한다</mark></strong>. 나는 분명히 말한다. <strong>그들은 이미 받을 상을 다 받았다</strong>. 너는 기도할 때에 골방에 들어가 문을 닫고 보이지 않는 네 아버지께 기도하여라. 그러면 숨은 일도 보시는 아버지께서 다 들어 주실 것이다.’” (<a href="https://bibleox.com/ko/ko-ctb/mf/6/#L5-6">마태 6:5-6</a>)</p></blockquote><h3>빈말을 하지 않음</h3><p>앞에서 이미 끊임없는 기도와 기도의 끈기와 인내가 요구된다고 말했습니다(<a href="https://bibleox.com/ko/ko-ctb/lk/18/#L1-7">루가 18:1-7</a>). 그러나 하느님께서는 말을 얼마나 자주 되풀이하느냐로 달래지시는 분이 아닙니다. 기도는 앞에서 말한 모든 것, 곧 믿음, 의로움, 하느님 마음에 드는 행실, 죄에서 돌아섬, 마음의 깨끗함, 잘못의 용서, 이웃과의 평화 등과 함께해야 합니다. 그런데 이방인들은 자신과 자기 삶을 바꾸지 않은 채, 잠든 듯한 자기 신들이 들을 때까지 더 크게 더 자주 외치면 된다고 여겼습니다(<a href="https://bibleox.com/ko/ko-ctb/3ts/18/#L26-28">열상 18:26-28</a> 참조).</p><blockquote><p>“‘너희는 <strong>기도할 때에 이방인들처럼 빈말을 되풀이하지 말아라. 그들은 말을 많이 해야만 하느님께서 들어 주시는 줄 안다</strong>. 그러니 그들을 본받지 말아라. 너희의 아버지께서는 구하기도 전에 벌써 너희에게 필요한 것을 알고 계신다.” (<a href="https://bibleox.com/ko/ko-ctb/mf/6/#L7-8">마태 6:7-8</a>)</p></blockquote><p>주 예수 그리스도께서도 자주 밤새워 기도하셨고, 때로는 기도를 되풀이하셨습니다:</p><blockquote><p>“<strong>다시 가셔서</strong> <strong>같은 말씀으로 기도하셨다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/mk/14/#L39">마르 14:39</a>)</p></blockquote><h2>하느님께서는 당신 뜻에 맞는 것을 주십니다</h2><blockquote><p>“<strong>구해도 얻지 못한다면 그것은 욕정을 채우려고 잘못 구하기 때문입니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/iak/4/#L3">야고 4:3</a>)</p></blockquote><blockquote><p>“무엇이든지 우리가 <strong>하느님의 뜻을 따라 청하면</strong> 하느님께서 우리의 청을 들어 주시리라는 것을 우리는 확신합니다.” (<a href="https://bibleox.com/ko/ko-ctb/1in/5/#L14">1요한 5:14</a>)</p></blockquote><blockquote><p>“<strong>너희가 나를 떠나지 않고 또 내 말을 간직해 둔다면</strong> 무슨 소원이든지 구하는 대로 다 이루어질 것이다.” (<a href="https://bibleox.com/ko/ko-ctb/in/15/#L7">요한 15:7</a>)</p></blockquote><blockquote><p>“너희 중에 아들이 빵을 달라는데 돌을 줄 사람이 어디 있으며 생선을 달라는데 뱀을 줄 사람이 어디 있겠느냐? 너희는 악하면서도 자기 자녀에게 좋은 것을 줄 줄 알거든 하물며 하늘에 계신 너희의 아버지께서야 구하는 사람에게 <strong>더 좋은 것을 주시지 않겠느냐</strong>?‘” (<a href="https://bibleox.com/ko/ko-ctb/mf/7/#L9-11">마태 7:9-11</a>)</p></blockquote><h2>혼자 드리는 기도</h2><blockquote><p>“<strong>너는 기도할 때에 골방에 들어가 문을 닫고 보이지 않는 네 아버지께 기도하여라</strong>. 그러면 숨은 일도 보시는 아버지께서 다 들어 주실 것이다.‘” (<a href="https://bibleox.com/ko/ko-ctb/mf/6/#L6">마태 6:6</a>)</p></blockquote><h2>함께 드리는 기도</h2><blockquote><p>“‘내가 다시 말한다. <strong>너희 중의 두 사람이 이 세상에서 마음을 모아 구하면</strong> 하늘에 계신 내 아버지께서는 무슨 일이든 다 들어 주실 것이다. <strong><mark>단 두세 사람이라도 내 이름으로 모인 곳에는 나도 함께 있기 때문이다</mark></strong>.’” (<a href="https://bibleox.com/ko/ko-ctb/mf/18/#L19-20">마태 18:19-20</a>)</p></blockquote><h2>다른 사람들을 위한 기도</h2><h3>이웃과 교회를 위한 기도</h3><blockquote><p>“그러므로 여러분은 서로 죄를 고백하고 <strong>서로 남을 위하여 기도하십시오</strong>. 그러면 모두 온전해질 것입니다. 올바른 사람의 간구는 큰 효과를 나타냅니다.” (<a href="https://bibleox.com/ko/ko-ctb/iak/5/#L16">야고 5:16</a>)</p></blockquote><blockquote><p>“그리고 <strong>우리를 위해서도 기도해 주십시오</strong>. 하느님께서 우리에게 당신의 말씀을 전할 수 있는 기회를 터 주셔서 그리스도의 심오한 진리를 전파할 수 있게 기도해 주십시오. 나는 이 진리를 위해서 지금 갇혀 있습니다.” (<a href="https://bibleox.com/ko/ko-ctb/kol/4/#L3">골로 4:3</a>)</p></blockquote><blockquote><p>“교우 여러분, <strong>우리를 위해서도 기도해 주십시오</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/1sol/5/#L25">1데살 5:25</a>)</p></blockquote><blockquote><p>“교우 여러분, 마지막으로 부탁합니다. <strong>우리를 위해서 기도해 주십시오</strong>. 주님의 말씀이 여러분 가운데 속히 퍼져서 찬양을 받은 것처럼 어디서나 그렇게 되도록 빌어 주십시오.” (<a href="https://bibleox.com/ko/ko-ctb/2sol/3/#L1">2데살 3:1</a>)</p></blockquote><blockquote><p>“<strong>우리를 위해서 기도해 주십시오</strong>. 우리는 무슨 일에나 정직하게 살려고 하므로 양심에 거리끼는 일은 하나도 없다고 확신하는 바입니다.” (<a href="https://bibleox.com/ko/ko-ctb/evr/13/#L18">히브 13:18</a>)</p></blockquote><blockquote><p>“우리는 약하더라도 여러분이 강하면 우리는 기쁩니다. <strong>우리가 기원하는 것은 여러분의 인격이 완성되는 것입니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/2kor/13/#L9">2고린 13:9</a>)</p></blockquote><blockquote><p>“<strong>우리는 언제나 여러분을 위해서 기도하면서</strong> 우리 하느님께서 여러분을 당신의 부르심에 적합하게 해 주시기를 빌며 선을 행하려는 여러분의 모든 의향과 여러분의 믿음의 행실을 당신의 능력으로 완성해 주시기를 빕니다.” (<a href="https://bibleox.com/ko/ko-ctb/2sol/1/#L11">2데살 1:11</a>)</p></blockquote><blockquote><p>“<strong>여러분은 기도로써 우리를 도와 주십시오</strong>. 하느님께서 많은 사람의 기도를 들으시고 우리에게 축복을 내리실 것이며 그것을 보고 많은 사람이 하느님께 감사를 드리게 될 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/2kor/1/#L11">2고린 1:11</a>)</p></blockquote><h3>우리에게 잘못하는 이들을 위한 기도</h3><blockquote><p>“그러나 나는 이렇게 말한다. 원수를 사랑하고 <strong>너희를 박해하는 사람들을 위하여 기도하여라</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/mf/5/#L44">마태 5:44</a>)</p></blockquote><blockquote><p>“너희를 저주하는 사람들을 축복해 주어라. 그리고 <strong>너희를 학대하는 사람들을 위하여 기도해 주어라</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/lk/6/#L28">루가 6:28</a>)</p></blockquote><h3>죽을죄가 아닌 죄를 지은 이들을 위한 기도</h3><blockquote><p>“어떤 사람이 <strong>자기 형제가 죄짓는 것을 볼 때 그것이 죽을 죄가 아니라면 하느님께 간구하시오. 그러면 하느님께서 그 죄인을 살려 주실 것입니다</strong>. 사실 죽을 죄가 있습니다. 이런 죄를 지은 사람을 위해서 간구하라고 말하는 것은 아닙니다. 옳지 못한 일은 모두 죄입니다. 그러나 죽음에까지는 이르게 하지 않는 죄가 있습니다.” (<a href="https://bibleox.com/ko/ko-ctb/1in/5/#L16-17">1요한 5:16-17</a>)</p></blockquote><h3>교회의 기도를 통해 사람들의 죄가 용서됩니다</h3><blockquote><p>“여러분 가운데 앓는 사람이 있으면 그 사람은 <strong>교회의 원로들을 청하십시오</strong>. 원로들은 주님의 이름으로 그에게 기름을 바르고 그를 위하여 기도해 주어야 합니다. 믿고 구하는 기도는 앓는 사람을 낫게 할 것이며 주님께서 그를 일으켜 주실 것입니다. 또 <strong>그가 지은 죄가 있으면 그 죄도 용서를 받을 것입니다</strong>. 그러므로 여러분은 서로 죄를 고백하고 서로 남을 위하여 기도하십시오. 그러면 모두 온전해질 것입니다. 올바른 사람의 간구는 큰 효과를 나타냅니다.” (<a href="https://bibleox.com/ko/ko-ctb/iak/5/#L14-16">야고 5:14-16</a>)</p></blockquote>'
