  title: 다른 이들의 믿음과 기도를 통한 하느님의 활동
  copy_cover: true
  body: <p>하느님 은총의 활동이 언제나 그 사람 자신의 믿음과 청으로 이루어지는 것은 아닙니다. 사랑하는 이를 위해 애쓰고 그를 위해 청하는(기도하는) 가까운 이들의 믿음을 통해 하느님께서 활동하신 경우가 적지 않습니다.</p><h2>네 친구와 중풍병자</h2><p>치유와 죄의 용서는 중풍병자를 그리스도께 데려오려고 몹시 애쓴 친구들의 믿음을 통해 이루어집니다:</p><blockquote><p>“예수께서 그들의 믿음을 보시고 중풍병자에게 이르시되 작은 자야 <strong>네 죄 사함을 받았느니라</strong> 하시니” (<a href="https://bibleox.com/ko/ko-nkrv/mk/2/#L5">막 2:5</a>)</p></blockquote><h2>백인대장과 그의 하인</h2><p>백인대장이 믿고 청하지만 낫는 것은 하인입니다:</p><blockquote><p>“백부장이 대답하여 이르되 주여 내 집에 들어오심을 나는 감당하지 못하겠사오니 다만 말씀으로만 하옵소서 그러면 내 하인이 낫겠사옵나이다 &lt;…&gt; 예수께서 들으시고 놀랍게 여겨 따르는 자들에게 이르시되 내가 진실로 너희에게 이르노니 <strong>이스라엘 중 아무에게서도 이만한 믿음을 보지 못하였노라</strong> &lt;…&gt; 예수께서 백부장에게 이르시되 가라 네 믿은 대로 될지어다 하시니 <strong>그 즉시 하인이 나으니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/8/#L8,10,13">마 8:8,10,13</a>)</p></blockquote><h2>아버지와 악령 들린 아들</h2><p>아버지가 믿고 청하지만 악령에게서 풀려나는 것은 아들입니다:</p><blockquote><p>“무리 중의 하나가 대답하되 선생님 <strong>말 못하게 귀신 들린 내 아들을</strong> 선생님께 데려왔나이다 귀신이 어디서든지 그를 잡으면 거꾸러져 거품을 흘리며 이를 갈며 그리고 파리해지는지라 내가 선생님의 제자들에게 내쫓아 달라 하였으나 그들이 능히 하지 못하더이다 대답하여 이르시되 믿음이 없는 세대여 내가 얼마나 너희와 함께 있으며 얼마나 너희에게 참으리요 그를 내게로 데려오라 하시매 이에 데리고 오니 귀신이 예수를 보고 곧 그 아이로 심히 경련을 일으키게 하는지라 그가 땅에 엎드러져 구르며 거품을 흘리더라 예수께서 그 아버지에게 물으시되 언제부터 이렇게 되었느냐 하시니 이르되 어릴 때부터니이다 귀신이 그를 죽이려고 불과 물에 자주 던졌나이다 그러나 무엇을 하실 수 있거든 우리를 불쌍히 여기사 도와 주옵소서 예수께서 이르시되 할 수 있거든이 무슨 말이냐 <strong>믿는 자에게는 능히 하지 못할 일이 없느니라</strong> 하시니 곧 그 아이의 아버지가 소리를 질러 이르되 내가 믿나이다 나의 믿음 없는 것을 도와 주소서 하더라 예수께서 무리가 달려와 모이는 것을 보시고 그 더러운 귀신을 꾸짖어 이르시되 말 못하고 못 듣는 귀신아 내가 네게 명하노니 그 아이에게서 나오고 다시 들어가지 말라 하시매 귀신이 소리 지르며 아이로 심히 경련을 일으키게 하고 나가니 그 아이가 죽은 것 같이 되어 많은 사람이 말하기를 죽었다 하나 예수께서 그 손을 잡아 일으키시니 이에 일어서니라” (<a href="https://bibleox.com/ko/ko-nkrv/mk/9/#L17-27">막 9:17-27</a>)</p></blockquote><h2>가나안 어머니와 악령 들린 딸</h2><p>어머니가 믿고 청하지만 악령에게서 풀려나는 것은 가나안 여인(시로페니키아 사람, <a href="https://bibleox.com/ko/ko-nkrv/mk/7/#L26">막 7:26</a>)의 딸입니다:</p><blockquote><p>“가나안 여자 하나가 그 지경에서 나와서 소리 질러 이르되 주 다윗의 자손이여 나를 불쌍히 여기소서 <strong>내 딸이 흉악하게 귀신 들렸나이다</strong> 하되 예수는 한 말씀도 대답하지 아니하시니 제자들이 와서 청하여 말하되 그 여자가 우리 뒤에서 소리를 지르오니 그를 보내소서 예수께서 대답하여 이르시되 나는 이스라엘 집의 잃어버린 양 외에는 다른 데로 보내심을 받지 아니하였노라 하시니 여자가 와서 예수께 절하며 이르되 주여 저를 도우소서 대답하여 이르시되 자녀의 떡을 취하여 개들에게 던짐이 마땅하지 아니하니라 여자가 이르되 주여 옳소이다마는 개들도 제 주인의 상에서 떨어지는 부스러기를 먹나이다 하니 이에 예수께서 대답하여 이르시되 <strong>여자여 네 믿음이 크도다</strong> 네 소원대로 되리라 하시니 그 때로부터 그의 딸이 나으니라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/15/#L22-28">마 15:22-28</a>)</p></blockquote><h2>야이로와 열두 살 된 딸</h2><p>아버지(야이로)가 믿고 청하지만 살아나 낫는 것은 딸입니다:</p><blockquote><p>“이에 회당장인 야이로라 하는 사람이 와서 예수의 발 아래에 엎드려 자기 집에 오시기를 간구하니 이는 자기에게 열두 살 된 외딸이 있어 죽어감이러라 &lt;…&gt; 아직 말씀하실 때에 회당장의 집에서 사람이 와서 말하되 <strong>당신의 딸이 죽었나이다</strong> 선생님을 더 괴롭게 하지 마소서 하거늘 예수께서 들으시고 이르시되 <strong>두려워하지 말고 믿기만 하라 그리하면 딸이 구원을 얻으리라</strong> 하시고 그 집에 이르러 베드로와 요한과 야고보와 아이의 부모 외에는 함께 들어가기를 허락하지 아니하시니라 모든 사람이 아이를 위하여 울며 통곡하매 예수께서 이르시되 울지 말라 죽은 것이 아니라 잔다 하시니 그들이 그 죽은 것을 아는 고로 비웃더라 예수께서 아이의 손을 잡고 불러 이르시되 아이야 일어나라 하시니 그 영이 돌아와 아이가 곧 일어나거늘 예수께서 먹을 것을 주라 명하시니” (<a href="https://bibleox.com/ko/ko-nkrv/lk/8/#L41-42,49-55">눅 8:41-42,49-55</a>)</p></blockquote><h2>고관과 그의 아들</h2><p>고관이 믿고 청하지만 낫는 것은 아들입니다:</p><blockquote><p>“예수께서 다시 갈릴리 가나에 이르시니 전에 물로 포도주를 만드신 곳이라 왕의 신하가 있어 <strong>그의 아들이 가버나움에서 병들었더니</strong> 그가 예수께서 유대로부터 갈릴리로 오셨다는 것을 듣고 가서 청하되 내려오셔서 내 아들의 병을 고쳐 주소서 하니 그가 거의 죽게 되었음이라 예수께서 이르시되 너희는 표적과 기사를 보지 못하면 도무지 믿지 아니하리라 신하가 이르되 주여 내 아이가 죽기 전에 내려오소서 예수께서 이르시되 가라 네 아들이 살아 있다 하시니 그 사람이 <strong>예수께서 하신 말씀을 믿고</strong> 가더니” (<a href="https://bibleox.com/ko/ko-nkrv/in/4/#L46-50">요 4:46-50</a>)</p></blockquote><h2>결론</h2><p>이처럼 구세주께서는 자녀들에게 하느님의 활동을 보이시기 위해 부모의 믿음을 기대하셨습니다. 그리고 부모의 청과 믿음을 통해 하느님의 은총이 자녀들에게 작용했습니다.</p>
