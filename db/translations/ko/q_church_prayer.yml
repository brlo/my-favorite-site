- src: молитвы-за-умерших
  path: Pd2e_죽은_이들을_위한_기도
  title: 죽은 이들을 위한 기도
  copy_cover: true
  body: '<h2>머리말</h2><p>죽은 이를 위해 자비를 청하는 것은 사랑하는 마음, 곧 하느님과 이웃에 대한 사랑을 따르는 사람의 움직임입니다. 주님께서 죽은 이를 위한 이런저런 청원에 어떻게 응답하실지 우리는 모르지만, 희망의 근거와 돌보도록 움직이는 사랑이 있습니다. 그 근거는 무엇입니까? 하느님의 계시입니다. 계시에서 우리는 하느님께서 전능하시고, 저승과 죽음의 “열쇠”를 쥐고 계시며, 오는 세상에서도 용서받지 못할 죄가 있고(그러므로 다른 죄도 있음을 알 수 있습니다), 하느님께서 온갖 청원을 드리라고 우리를 부르셨음을 배웁니다. 또 죄인이 받는 벌의 정도가 <a href="https://bibleox.com/ru/ru/w/bib_Неодинаковая_мера_воздаяния:_мучения_и_блаженства">같지 않고</a> 의인의 복도 같지 않음을 알기에, 어떤 사람이 구원받지 못하더라도 그의 운명이 가벼워지기를 희망합니다. 구약에서도 죽은 이들을 돌보았고(<a href="#HH-구약-죽은-이들의-죄-용서를-위한-돌봄">아래</a> 참조), 가장 오래된 그리스도인들도 돌보았습니다(<a href="https://bibleox.com/ru/ru/w/91USaqiJ_молитвы_за_умерших">자세히</a> (러시아어)).</p><p>이 모든 일로 우리를 움직이는 것은 “가실 줄을 모르는” 사랑입니다(<a href="https://bibleox.com/ko/ko-nkrv/1kor/13/#L8">고전 13:8</a>).</p><h2>하느님은 전능하십니다</h2><blockquote><p>“나는 여호와요 모든 육체의 하나님이라 <strong>내게 할 수 없는 일이 있겠느냐</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ier/32/#L27">렘 32:27</a>)</p></blockquote><p>다른 구절: <a href="https://bibleox.com/ru/ru/w/Бог-всемогущий">전능하신 하느님</a>.</p><h2>하느님께서는 계명을 지키는 이들이 믿음으로 청하는 것을 기도에서 받으리라고 약속하셨습니다</h2><blockquote><p>“<strong>무엇이든지 구하는 바를 그에게서 받나니</strong> 이는 우리가 그의 계명을 지키고 그 앞에서 기뻐하시는 것을 행함이라” (<a href="https://bibleox.com/ko/ko-nkrv/1in/3/#L22">요일 3:22</a>)</p></blockquote><blockquote><p>“<strong>우리가 무엇이든지 구하는 바를 들으시는 줄을 안즉</strong> 우리가 그에게 구한 그것을 얻은 줄을 또한 아느니라” (<a href="https://bibleox.com/ko/ko-nkrv/1in/5/#L15">요일 5:15</a>)</p></blockquote><blockquote><p>“<strong>너희가 기도할 때에 무엇이든지 믿고 구하는 것은 다 받으리라</strong> 하시니라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/21/#L22">마 21:22</a>)</p></blockquote><blockquote><p>“진실로 다시 너희에게 이르노니 너희 중의 두 사람이 땅에서 합심하여 무엇이든지 구하면 <strong>하늘에 계신 내 아버지께서 그들을 위하여 이루게 하시리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/18/#L19">마 18:19</a>)</p></blockquote><blockquote><p>“너희가 나를 택한 것이 아니요 내가 너희를 택하여 세웠나니 이는 너희로 가서 열매를 맺게 하고 또 너희 열매가 항상 있게 하여 <strong>내 이름으로 아버지께 무엇을 구하든지 다 받게 하려 함이라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/in/15/#L16">요 15:16</a>)</p></blockquote><p>이 말씀은 죄짓는 형제들의 구원을 위한 기도의 문맥에서 나옵니다. 하느님께서는 의인의 기도를 통해 그들을 구원하십니다:</p><blockquote><p>“<strong><mark>우리가 무엇이든지 구하는 바를 들으시는 줄을 안즉</mark></strong> 우리가 그에게 구한 그것을 얻은 줄을 또한 아느니라 <strong><mark>누구든지 형제가 사망에 이르지 아니하는 죄 범하는 것을 보거든 구하라 그리하면 사망에 이르지 아니하는 범죄자들을 위하여 그에게 생명을 주시리라</mark></strong> 사망에 이르는 죄가 있으니 이에 관하여 나는 구하라 하지 않노라” (<a href="https://bibleox.com/ko/ko-nkrv/1in/5/#L15-16">요일 5:15-16</a>)</p></blockquote><h2>죄는 교회의 기도를 통해 용서받을 수 있습니다</h2><p>곧 죄는 본인이 회개하고 용서를 청할 때만이 아니라, 다른 이들이 그의 죄의 용서를 청할 때에도 용서받습니다:</p><blockquote><p>“너희 중에 병든 자가 있느냐 그는 <strong>교회의 장로들을 청할 것이요</strong> 그들은 주의 이름으로 기름을 바르며 <strong>그를 위하여 기도할지니라</strong> 믿음의 기도는 병든 자를 구원하리니 주께서 그를 일으키시리라 <strong>혹시 죄를 범하였을지라도 사하심을 받으리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/iak/5/#L14-15">약 5:14-15</a>)</p></blockquote><p>중풍에 걸린 동료의 친구들은 그를 그리스도께 데려오려고 몹시 애썼습니다. 그들의 믿음을 보시고 주님께서는 중풍병자의 죄를 용서하시고 고쳐 주셨습니다:</p><blockquote><p>“예수께서 그들의 믿음을 보시고 중풍병자에게 이르시되 작은 자야 <strong>네 죄 사함을 받았느니라</strong> 하시니” (<a href="https://bibleox.com/ko/ko-nkrv/mk/2/#L5">막 2:5</a>)</p></blockquote><h2>죄는 죽은 뒤에도 용서받을 수 있습니다</h2><p>주 예수 그리스도의 말씀에 따르면 죄의 용서는 이 세상에서만이 아니라 오는 세상에서도 가능합니다. 지금도 나중에도 용서받지 못할 죄가 있기 때문입니다:</p><blockquote><p>“그러므로 내가 너희에게 이르노니 사람에 대한 모든 죄와 모독은 사하심을 얻되 성령을 모독하는 것은 사하심을 얻지 못하겠고 또 누구든지 말로 인자를 거역하면 사하심을 얻되 누구든지 말로 성령을 거역하면 <strong>이 세상과 오는 세상에서도 사하심을 얻지 못하리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/12/#L31-32">마 12:31-32</a>)</p></blockquote><h2>그리스도께서는 저승과 죽음의 열쇠를 쥐고 계십니다</h2><blockquote><p>“내가 볼 때에 그의 발 앞에 엎드러져 죽은 자 같이 되매 그가 오른손을 내게 얹고 이르시되 두려워하지 말라 나는 처음이요 마지막이니 곧 살아 있는 자라 내가 전에 죽었었노라 볼지어다 이제 세세토록 살아 있어 <strong>사망과 음부의 열쇠를 가졌노니</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/1/#L17-18">계 1:17-18</a>) <em>(“음부”는 그리스어로 ᾅδης, “저승”입니다.)</em></p></blockquote><h2>구약: 죽은 이들의 죄 용서를 위한 돌봄</h2><h3>죽은 이를 위한 금식</h3><p>이스라엘 사람들은 죽은 사울 왕과 그의 아들들과 전쟁에서 쓰러진 모든 이스라엘 사람을 위해 금식했습니다.</p><blockquote><p>“사울과 그의 세 아들과 무기를 든 자와 그의 모든 사람이 다 그 날에 함께 죽었더라” (<a href="https://bibleox.com/ko/ko-nkrv/1ts/31/#L6">삼상 31:6</a>)</p></blockquote><blockquote><p>“그의 뼈를 가져다가 야베스 에셀 나무 아래에 장사하고 <strong>칠 일 동안 금식하였더라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1ts/31/#L13">삼상 31:13</a>)</p></blockquote><blockquote><p>“사울과 그의 아들 요나단과 여호와의 백성과 이스라엘 족속이 칼에 죽음으로 말미암아 <strong>저녁 때까지 슬퍼하여 울며 금식하니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2ts/1/#L12">삼하 1:12</a>)</p></blockquote><h3>죽은 이를 위한 기도와 제사</h3><p>유대인들은 전사자들의 죄가 용서받도록 기도했습니다. 또 죽은 이들을 위한 속죄 제사를 드리고 그들이 죄에서 깨끗해지도록 예루살렘 성전에 돈을 보냈습니다:</p><blockquote><p>“그들은 <strong>저지른 죄가 완전히 지워지기를 청하며</strong> 간구에 나섰다. … 그는 사람들에게서 <strong>은 이천 드라크마를 모아 예루살렘으로 보내어 속죄 제물을 바치게 했다. 그는 부활을 생각하여 참으로 훌륭하고 고귀하게 행동했다.</strong> 쓰러진 이들이 다시 일어나리라고 기대하지 않았다면 <strong>죽은 이들을 위해 기도하는 것은 쓸데없고 어리석은 일이었을 것이다.</strong> … 그래서 그는 <strong>죽은 이들이 죄에서 풀려나도록 속죄를 드렸다</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/2mak/12/#L42-45">2마카 12:42-45</a>, 그리스어에서 번역)</p></blockquote><h3>죽은 이를 위한 자선</h3><p>유대인들은 죽은 이를 위해 자선을 베풀었습니다:</p><blockquote><p>“모든 산 사람에게 은혜를 베풀고 <strong>죽은 이에게도 은혜를 거두지 말라</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/prsir/7/#L33">집회 7:33</a>, 그리스어에서 번역)</p></blockquote><blockquote><p>“<strong>의인들의 무덤 위에 네 빵을 놓아라</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/tov/4/#L17">토비 4:17</a>, 그리스어에서 번역)</p></blockquote><p>죽은 이를 위한 자선은 십일조에서 내지 않았습니다:</p><blockquote><p>“셋째 해 곧 십일조를 드리는 해에 <strong>네 모든 소산의 십일조 내기를 마친 후에</strong> 그것을 레위인과 객과 고아와 과부에게 주어 네 성읍 안에서 먹고 배부르게 하라 그리 할 때에 <strong>네 하나님 여호와 앞에 아뢰기를</strong> 내가 성물을 내 집에서 내어 레위인과 객과 고아와 과부에게 주기를 주께서 내게 명령하신 명령대로 하였사오니 내가 주의 명령을 범하지도 아니하였고 잊지도 아니하였나이다 내가 애곡하는 날에 이 성물을 먹지 아니하였고 부정한 몸으로 이를 떼어두지 아니하였고 <strong>죽은 자를 위하여 이를 쓰지 아니하였고</strong> 내 하나님 여호와의 말씀을 청종하여 주께서 내게 명령하신 대로 다 행하였사오니” (<a href="https://bibleox.com/ko/ko-nkrv/vtor/26/#L12-14">신 26:12-14</a>)</p></blockquote><h2>하느님께는 모두가 살아 있습니다</h2><p>앞의 구절들은 유대인들의 믿음과 구체적인 실천을 보여 줍니다. 그들은 죽은 이들의 죄 용서를 위해 기도하고, 금식하고, 제사를 바치고, 자선을 베풀며 죽은 뒤의 운명을 돌보았습니다. 죽음 뒤의 존재를 부정한 것은 사두가이파뿐이었고, 주님께서는 그들의 오류와 성경에 대한 무지를 꾸짖으셨습니다:</p><blockquote><p>“예수께서 대답하여 이르시되 <strong>너희가 성경도, 하나님의 능력도 알지 못하는 고로 오해하였도다</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/22/#L29">마 22:29</a>)</p></blockquote><blockquote><p>“<strong>하나님은 죽은 자의 하나님이 아니요 산 자의 하나님이시라</strong> <strong>너희가 크게 오해하였도다</strong> 하시니라” (<a href="https://bibleox.com/ko/ko-nkrv/mk/12/#L27">막 12:27</a>)</p></blockquote><h2>죽은 이들을 위한 모든 도움에 대한 희망</h2><p>어떤 사람이 지옥에서 구원받지 못하더라도, 그의 고통은 지금이나 장차(공동 부활과 심판 뒤에) 가벼워질 수 있고 위로가 주어질 수 있습니다. 벌의 정도가 같지 않기 때문입니다:</p><blockquote><p>“<strong>주인의 뜻을 알고도</strong> 준비하지 아니하고 <strong><mark>그 뜻대로 행하지 아니한 종은 많이 맞을 것이요 알지 못하고</mark></strong> <strong><mark>맞을 일을 행한 종은 적게 맞으리라</mark></strong> 무릇 많이 받은 자에게는 많이 요구할 것이요 <strong>많이 맡은 자에게는 많이 달라 할 것이니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/lk/12/#L47-48">눅 12:47-48</a>)</p></blockquote><p>벌의 차이에 관한 더 많은 구절: <a href="https://bibleox.com/ru/ru/w/bib_Неодинаковая_мера_воздаяния:_мучения_и_блаженства">벌의 정도는 같지 않습니다</a>.</p>'
