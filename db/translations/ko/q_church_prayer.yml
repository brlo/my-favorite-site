  path: Pr1y_기도
  title: 기도
  copy_cover: true
  body: '<h2>기도하라는 계명</h2><h3>청원 기도</h3><blockquote><p>“<strong><mark>구하라 그리하면 너희에게 주실 것이요</mark></strong> 찾으라 그리하면 찾아낼 것이요 <strong>문을 두드리라 그리하면 너희에게 열릴 것이니</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/7/#L7">마 7:7</a>; <a href="https://bibleox.com/ko/ko-nkrv/lk/11/#L9">눅 11:9</a>)</p></blockquote><h3>감사 기도</h3><blockquote><p>“<strong><mark>쉬지 말고 기도하라 범사에 감사하라 이것이 그리스도 예수 안에서 너희를 향하신 하나님의 뜻이니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1sol/5/#L17-18">살전 5:17-18</a>)</p></blockquote><blockquote><p>“아무 것도 염려하지 말고 다만 <strong><mark>모든 일에 기도와 간구로, 너희 구할 것을 감사함으로 하나님께 아뢰라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/fil/4/#L6">빌 4:6</a>)</p></blockquote><blockquote><p>“술 취하지 말라 이는 방탕한 것이니 오직 성령으로 충만함을 받으라 시와 찬송과 신령한 노래들로 서로 화답하며 너희의 마음으로 주께 노래하며 찬송하며 <strong><mark>범사에 우리 주 예수 그리스도의 이름으로 항상 아버지 하나님께 감사하며</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ef/5/#L18-20">엡 5:18-20</a>)</p></blockquote><blockquote><p>“또 무엇을 하든지 말에나 일에나 다 주 예수의 이름으로 하고 <strong><mark>그를 힘입어 하나님 아버지께 감사하라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/kol/3/#L17">골 3:17</a>)</p></blockquote><h3>하느님을 찬양하는 기도(송영)</h3><blockquote><p>“<strong><mark>감사함으로 그의 문에 들어가며</mark></strong> 찬송함으로 그의 궁정에 들어가서 <strong><mark>그에게 감사하며 그의 이름을 송축할지어다</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ps/100/#L4">시 100:4</a>)</p></blockquote><blockquote><p>“<strong><mark>내가 여호와를 항상 송축함이여 내 입술로 항상 주를 찬양하리이다</mark></strong> 내 영혼이 여호와를 자랑하리니 곤고한 자들이 이를 듣고 기뻐하리로다” (<a href="https://bibleox.com/ko/ko-nkrv/ps/34/#L1-2">시 34:1-2</a>)</p></blockquote><blockquote><p>“그러므로 우리는 예수로 말미암아 <strong><mark>항상 찬송의 제사를 하나님께 드리자</mark></strong> 이는 <strong><mark>그 이름을 증언하는 입술의 열매니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/evr/13/#L15">히 13:15</a>)</p></blockquote><h2>끊임없는 기도와 하느님을 생각함</h2><blockquote><p>“<strong><mark>모든 기도와 간구를 하되</mark></strong> <strong>항상 성령 안에서 기도하고</strong> 이를 위하여 깨어 구하기를 항상 힘쓰며 여러 성도를 위하여 구하라” (<a href="https://bibleox.com/ko/ko-nkrv/ef/6/#L18">엡 6:18</a>)</p></blockquote><blockquote><p>“<strong><mark>쉬지 말고 기도하라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1sol/5/#L17">살전 5:17</a>)</p></blockquote><blockquote><p>“예수께서 그들에게 <strong><mark>항상 기도하고 낙심하지 말아야 할 것을</mark></strong> 비유로 말씀하여 이르시되 어떤 도시에 하나님을 두려워하지 않고 사람을 무시하는 한 재판장이 있는데 그 도시에 한 과부가 있어 자주 그에게 가서 내 원수에 대한 나의 원한을 풀어 주소서 하되 그가 얼마 동안 듣지 아니하다가 후에 속으로 생각하되 내가 하나님을 두려워하지 않고 사람을 무시하나 이 과부가 나를 번거롭게 하니 내가 그 원한을 풀어 주리라 그렇지 않으면 늘 와서 나를 괴롭게 하리라 하였느니라 주께서 또 이르시되 불의한 재판장이 말한 것을 들으라 하물며 <strong>하나님께서 그 밤낮 부르짖는 택하신 자들의</strong> 원한을 풀어 주지 아니하시겠느냐 그들에게 오래 참으시겠느냐” (<a href="https://bibleox.com/ko/ko-nkrv/lk/18/#L1-7">눅 18:1-7</a>)</p></blockquote><h2>어떤 기도가 들어 허락됩니까</h2><h3>믿음</h3><blockquote><p>“너희 중에 누구든지 지혜가 부족하거든 모든 사람에게 후히 주시고 꾸짖지 아니하시는 하나님께 구하라 그리하면 주시리라 <strong><mark>오직 믿음으로 구하고 조금도 의심하지 말라 의심하는 자는 마치 바람에 밀려 요동하는 바다 물결 같으니</mark></strong> <strong>이런 사람은 무엇이든지 주께 얻기를 생각하지 말라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/iak/1/#L5-7">약 1:5-7</a>)</p></blockquote><blockquote><p>“너희가 <strong><mark>기도할 때에 무엇이든지 믿고 구하는 것은</mark></strong> 다 받으리라 하시니라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/21/#L22">마 21:22</a>; <a href="https://bibleox.com/ko/ko-nkrv/mk/11/#L24">막 11:24</a>)</p></blockquote><h3>의로움(하느님의 뜻에 따른 삶, 죄에서 돌아섬)</h3><blockquote><p>“악인의 제사는 여호와께서 미워하셔도 <strong><mark>정직한 자의 기도는 그가 기뻐하시느니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/pr/15/#L8">잠 15:8</a>)</p></blockquote><blockquote><p>“여호와는 악인을 멀리 하시고 <strong><mark>의인의 기도를 들으시느니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/pr/15/#L29">잠 15:29</a>)</p></blockquote><blockquote><p>“<strong><mark>너희가 내 안에 거하고 내 말이 너희 안에 거하면</mark></strong> 무엇이든지 원하는 대로 구하라 그리하면 이루리라” (<a href="https://bibleox.com/ko/ko-nkrv/in/15/#L7">요 15:7</a>)</p></blockquote><blockquote><p>“주께서 이르시되 이 백성이 입으로는 나를 가까이 하며 <strong>입술로는 나를 공경하나 그들의 마음은 내게서 멀리 떠났나니</strong> 그들이 나를 경외함은 사람의 계명으로 가르침을 받았을 뿐이라” (<a href="https://bibleox.com/ko/ko-nkrv/is/29/#L13">사 29:13</a>)</p></blockquote><h3>겸손하고 뉘우치는 마음</h3><blockquote><p>“하나님께서 구하시는 제사는 상한 심령이라 하나님이여 <strong><mark>상하고 통회하는 마음을 주께서 멸시하지 아니하시리이다</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ps/51/#L17">시 51:17</a>)</p></blockquote><blockquote><p>“여호와여 주는 <strong><mark>겸손한 자의 소원을 들으셨사오니</mark></strong> 그들의 마음을 준비하시며 귀를 기울여 들으시고” (<a href="https://bibleox.com/ko/ko-nkrv/ps/10/#L17">시 10:17</a>)</p></blockquote><blockquote><p>“<strong>겸손한 이의 기도는 구름을 꿰뚫는다</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/prsir/35/#L17">집회 35:17</a>, 그리스어에서 번역)</p></blockquote><blockquote><p>“나 여호와가 말하노라 내 손이 이 모든 것을 지었으므로 그들이 생겼느니라 <strong><mark>무릇 마음이 가난하고 심령에 통회하며</mark></strong> 내 말을 듣고 떠는 자 그 사람은 내가 돌보려니와” (<a href="https://bibleox.com/ko/ko-nkrv/is/66/#L2">사 66:2</a>)</p></blockquote><blockquote><p>“다만 <strong>상한 마음과 겸손한 영으로 우리를 받아 주소서</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/dan/3/#L39">단 3:39</a>, 그리스어에서 번역)</p></blockquote><blockquote><p>“또 <strong><mark>자기를 의롭다고 믿고 다른 사람을 멸시하는 자들에게 이 비유로 말씀하시되</mark></strong> 두 사람이 기도하러 성전에 올라가니 하나는 바리새인이요 하나는 세리라 <strong>바리새인은 서서 따로 기도하여</strong> 이르되 하나님이여 <strong><mark>나는 다른 사람들</mark></strong> 곧 토색, 불의, 간음을 하는 자들과 같지 아니하고 이 세리와도 같지 아니함을 감사하나이다 나는 이레에 두 번씩 금식하고 또 소득의 십일조를 드리나이다 하고 <strong>세리는 멀리 서서 감히 눈을 들어 하늘을 쳐다보지도 못하고</strong> 다만 가슴을 치며 이르되 <strong>하나님이여 불쌍히 여기소서 나는 죄인이로소이다</strong> 하였느니라 내가 너희에게 이르노니 이에 저 바리새인이 아니고 이 사람이 의롭다 하심을 받고 그의 집으로 내려갔느니라 무릇 자기를 높이는 자는 낮아지고 자기를 낮추는 자는 높아지리라 하시니라” (<a href="https://bibleox.com/ko/ko-nkrv/lk/18/#L9-14">눅 18:9-14</a>)</p></blockquote><p>함께 보기: <a href="https://bibleox.com/ru/ru/w/смирение">겸손</a>.</p><h3>모든 잘못을 용서함</h3><blockquote><p>“<strong><mark>서서 기도할 때에 아무에게나 혐의가 있거든 용서하라</mark></strong> 그리하여야 하늘에 계신 너희 아버지께서도 너희 허물을 사하여 주시리라 하시니라” (<a href="https://bibleox.com/ko/ko-nkrv/mk/11/#L25">막 11:25</a>) <em>(비잔틴 본문(다수 사본)에는 26절이 이어집니다: “너희가 용서하지 않으면 하늘에 계신 너희 아버지께서도 너희의 잘못을 용서해 주지 않으실 것이다.”)</em></p></blockquote><blockquote><p>“<strong><mark>너희가 사람의 잘못을 용서하면 너희 하늘 아버지께서도 너희 잘못을 용서하시려니와</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/6/#L14">마 6:14</a>)</p></blockquote><h3>이웃과의 평화</h3><blockquote><p>“그러므로 예물을 제단에 드리려다가 거기서 네 형제에게 원망들을 만한 일이 있는 것이 생각나거든 예물을 제단 앞에 두고 <strong><mark>먼저 가서 형제와 화목하고 그 후에 와서 예물을 드리라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/5/#L23-24">마 5:23-24</a>)</p></blockquote><blockquote><p>“<strong>남편들아</strong> 이와 같이 지식을 따라 너희 아내와 동거하고 그를 더 연약한 그릇이요 또 생명의 은혜를 함께 이어받을 자로 알아 <strong>귀히 여기라</strong> 이는 <strong>너희 기도가 막히지 아니하게 하려 함이라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1pet/3/#L7">벧전 3:7</a>)</p></blockquote><h3>인내</h3><blockquote><p>“예수께서 그들에게 <strong><mark>항상 기도하고 낙심하지 말아야 할 것을</mark></strong> 비유로 말씀하여 이르시되 어떤 도시에 하나님을 두려워하지 않고 사람을 무시하는 한 재판장이 있는데 그 도시에 한 과부가 있어 자주 그에게 가서 내 원수에 대한 나의 원한을 풀어 주소서 하되 그가 얼마 동안 듣지 아니하다가 후에 속으로 생각하되 내가 하나님을 두려워하지 않고 사람을 무시하나 이 과부가 나를 번거롭게 하니 내가 그 원한을 풀어 주리라 그렇지 않으면 늘 와서 나를 괴롭게 하리라 하였느니라 주께서 또 이르시되 불의한 재판장이 말한 것을 들으라 하물며 <strong>하나님께서 그 밤낮 부르짖는 택하신 자들의</strong> 원한을 풀어 주지 아니하시겠느냐 그들에게 오래 참으시겠느냐” (<a href="https://bibleox.com/ko/ko-nkrv/lk/18/#L1-7">눅 18:1-7</a>)</p></blockquote><blockquote><p>“또 이르시되 너희 중에 누가 벗이 있는데 밤중에 그에게 가서 말하기를 벗이여 떡 세 덩이를 내게 꾸어 달라 내 벗이 여행중에 내게 왔으나 내가 먹일 것이 없노라 하면 그가 안에서 대답하여 이르되 나를 괴롭게 하지 말라 문이 이미 닫혔고 아이들이 나와 함께 침실에 누웠으니 일어나 네게 줄 수가 없노라 하겠느냐 내가 너희에게 말하노니 비록 벗 됨으로 인하여서는 일어나서 주지 아니할지라도 <strong><mark>그 간청함을 인하여 일어나 그 요구대로 주리라 내가 또 너희에게 이르노니 구하라 그러면 너희에게 주실 것이요</mark></strong> 찾으라 그러면 찾아낼 것이요 문을 두드리라 그러면 너희에게 열릴 것이니 구하는 이마다 받을 것이요 찾는 이는 찾아낼 것이요 두드리는 이에게는 열릴 것이니라” (<a href="https://bibleox.com/ko/ko-nkrv/lk/11/#L5-10">눅 11:5-10</a>)</p></blockquote><h3>자선(어려운 이들을 실제로 도움)</h3><blockquote><p>“기도는 금식과 <strong>자선</strong>과 의로움과 함께할 때 좋다. … <strong>금을 쌓아 두는 것보다 자선을 베푸는 것이 낫다</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/tov/12/#L8">토비 12:8</a>, 그리스어에서 번역)</p></blockquote><blockquote><p>“<strong>가난한 자를 보살피는 자</strong>에게 복이 있음이여 재앙의 날에 여호와께서 그를 건지시리로다 여호와께서 그를 지키사 살게 하시리니 그가 이 세상에서 복을 받을 것이라 주여 그를 그 원수들의 뜻에 맡기지 마소서” (<a href="https://bibleox.com/ko/ko-nkrv/ps/41/#L1-2">시 41:1-2</a>)</p></blockquote><blockquote><p>“<strong>가난한 자를 불쌍히 여기는 것은</strong> <strong>여호와께 꾸어 드리는 것이니 그의 선행을 그에게 갚아 주시리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/pr/19/#L17">잠 19:17</a>)</p></blockquote><blockquote><p>“<strong>너희가 손을 펼 때에 내가 내 눈을 너희에게서 가리고 너희가 많이 기도할지라도 내가 듣지 아니하리니</strong> 이는 너희의 손에 피가 가득함이라 너희는 스스로 씻으며 스스로 깨끗하게 하여 내 목전에서 너희 악한 행실을 버리며 행악을 그치고 <strong><mark>선행을 배우며 정의를 구하며 학대 받는 자를 도와 주며 고아를 위하여 신원하며 과부를 위하여 변호하라</mark></strong> 하셨느니라” (<a href="https://bibleox.com/ko/ko-nkrv/is/1/#L15-17">사 1:15-17</a>)</p></blockquote><blockquote><p>“고넬료가 주목하여 보고 두려워 이르되 주여 무슨 일이니이까 천사가 이르되 <strong><mark>네 기도와 구제가 하나님 앞에 상달되어 기억하신 바가 되었으니</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/act/10/#L4">행 10:4</a>)</p></blockquote><h3>금식</h3><blockquote><p>“여호와의 말씀에 <strong><mark>너희는 이제라도 금식하고 울며 애통하고 마음을 다하여 내게로 돌아오라</mark></strong> 하셨나니” (<a href="https://bibleox.com/ko/ko-nkrv/iol/2/#L12">욜 2:12</a>)</p></blockquote><blockquote><p>“내가 <strong><mark>금식하며</mark></strong> 베옷을 입고 재를 덮어쓰고 <strong><mark>주 하나님께 기도하며 간구하기를</mark></strong> 결심하고” (<a href="https://bibleox.com/ko/ko-nkrv/dan/9/#L3">단 9:3</a>)</p></blockquote><blockquote><p>“이에 <strong>금식하며 기도하고</strong> 두 사람에게 안수하여 보내니라” (<a href="https://bibleox.com/ko/ko-nkrv/act/13/#L3">행 13:3</a>)</p></blockquote><blockquote><p>“<strong>금식하므로</strong> 내 무릎이 흔들리고 내 육체는 수척하오며 &lt;…&gt; 여호와 나의 하나님이여 나를 도우시며 주의 인자하심을 따라 나를 구원하소서” (<a href="https://bibleox.com/ko/ko-nkrv/ps/109/#L24,26">시 109:24,26</a>)</p></blockquote><h3>위선이 없음</h3><blockquote><p>“또 너희는 <strong><mark>기도할 때에 외식하는 자와 같이 하지 말라 그들은 사람에게 보이려고 회당과 큰 거리 어귀에 서서 기도하기를 좋아하느니라</mark></strong> 내가 진실로 너희에게 이르노니 <strong>그들은 자기 상을 이미 받았느니라</strong> 너는 기도할 때에 네 골방에 들어가 문을 닫고 은밀한 중에 계신 네 아버지께 기도하라 은밀한 중에 보시는 네 아버지께서 갚으시리라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/6/#L5-6">마 6:5-6</a>)</p></blockquote><h3>빈말을 하지 않음</h3><p>앞에서 이미 끊임없는 기도와 기도의 끈기와 인내가 요구된다고 말했습니다(<a href="https://bibleox.com/ko/ko-nkrv/lk/18/#L1-7">눅 18:1-7</a>). 그러나 하느님께서는 말을 얼마나 자주 되풀이하느냐로 달래지시는 분이 아닙니다. 기도는 앞에서 말한 모든 것, 곧 믿음, 의로움, 하느님 마음에 드는 행실, 죄에서 돌아섬, 마음의 깨끗함, 잘못의 용서, 이웃과의 평화 등과 함께해야 합니다. 그런데 이방인들은 자신과 자기 삶을 바꾸지 않은 채, 잠든 듯한 자기 신들이 들을 때까지 더 크게 더 자주 외치면 된다고 여겼습니다(<a href="https://bibleox.com/ko/ko-nkrv/3ts/18/#L26-28">왕상 18:26-28</a> 참조).</p><blockquote><p>“또 <strong>기도할 때에 이방인과 같이 중언부언하지 말라 그들은 말을 많이 하여야 들으실 줄 생각하느니라</strong> 그러므로 그들을 본받지 말라 구하기 전에 너희에게 있어야 할 것을 하나님 너희 아버지께서 아시느니라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/6/#L7-8">마 6:7-8</a>)</p></blockquote><p>주 예수 그리스도께서도 자주 밤새워 기도하셨고, 때로는 기도를 되풀이하셨습니다:</p><blockquote><p>“<strong>다시 나아가</strong> <strong>동일한 말씀으로 기도하시고</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mk/14/#L39">막 14:39</a>)</p></blockquote><h2>하느님께서는 당신 뜻에 맞는 것을 주십니다</h2><blockquote><p>“<strong>구하여도 받지 못함은 정욕으로 쓰려고 잘못 구하기 때문이라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/iak/4/#L3">약 4:3</a>)</p></blockquote><blockquote><p>“그를 향하여 우리가 가진 바 담대함이 이것이니 <strong>그의 뜻대로 무엇을 구하면</strong> 들으심이라” (<a href="https://bibleox.com/ko/ko-nkrv/1in/5/#L14">요일 5:14</a>)</p></blockquote><blockquote><p>“<strong>너희가 내 안에 거하고 내 말이 너희 안에 거하면</strong> 무엇이든지 원하는 대로 구하라 그리하면 이루리라” (<a href="https://bibleox.com/ko/ko-nkrv/in/15/#L7">요 15:7</a>)</p></blockquote><blockquote><p>“너희 중에 누가 아들이 떡을 달라 하는데 돌을 주며 생선을 달라 하는데 뱀을 줄 사람이 있겠느냐 너희가 악한 자라도 좋은 것으로 자식에게 줄 줄 알거든 하물며 하늘에 계신 너희 아버지께서 구하는 자에게 <strong>좋은 것으로 주시지 않겠느냐</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/7/#L9-11">마 7:9-11</a>)</p></blockquote><h2>혼자 드리는 기도</h2><blockquote><p>“<strong>너는 기도할 때에 네 골방에 들어가 문을 닫고 은밀한 중에 계신 네 아버지께 기도하라</strong> 은밀한 중에 보시는 네 아버지께서 갚으시리라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/6/#L6">마 6:6</a>)</p></blockquote><h2>함께 드리는 기도</h2><blockquote><p>“진실로 다시 너희에게 이르노니 <strong>너희 중의 두 사람이 땅에서 합심하여 무엇이든지 구하면</strong> 하늘에 계신 내 아버지께서 그들을 위하여 이루게 하시리라 <strong><mark>두세 사람이 내 이름으로 모인 곳에는 나도 그들 중에 있느니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/18/#L19-20">마 18:19-20</a>)</p></blockquote><h2>다른 사람들을 위한 기도</h2><h3>이웃과 교회를 위한 기도</h3><blockquote><p>“그러므로 너희 죄를 서로 고백하며 병이 낫기를 위하여 <strong>서로 기도하라</strong> 의인의 간구는 역사하는 힘이 큼이니라” (<a href="https://bibleox.com/ko/ko-nkrv/iak/5/#L16">약 5:16</a>)</p></blockquote><blockquote><p>“또한 <strong>우리를 위하여 기도하되</strong> 하나님이 전도할 문을 우리에게 열어 주사 그리스도의 비밀을 말하게 하시기를 구하라 내가 이 일 때문에 매임을 당하였노라” (<a href="https://bibleox.com/ko/ko-nkrv/kol/4/#L3">골 4:3</a>)</p></blockquote><blockquote><p>“형제들아 <strong>우리를 위하여 기도하라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1sol/5/#L25">살전 5:25</a>)</p></blockquote><blockquote><p>“끝으로 형제들아 <strong>너희는 우리를 위하여 기도하기를</strong> 주의 말씀이 너희 가운데서와 같이 퍼져 나가 영광스럽게 되고” (<a href="https://bibleox.com/ko/ko-nkrv/2sol/3/#L1">살후 3:1</a>)</p></blockquote><blockquote><p>“<strong>우리를 위하여 기도하라</strong> 우리가 모든 일에 선하게 행하려 하므로 우리에게 선한 양심이 있는 줄을 확신하노니” (<a href="https://bibleox.com/ko/ko-nkrv/evr/13/#L18">히 13:18</a>)</p></blockquote><blockquote><p>“우리가 약할 때에 너희가 강한 것을 기뻐하고 또 이것을 위하여 구하니 곧 <strong>너희가 온전하게 되는 것이라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2kor/13/#L9">고후 13:9</a>)</p></blockquote><blockquote><p>“이러므로 <strong>우리도 항상 너희를 위하여 기도함은</strong> 우리 하나님이 너희를 그 부르심에 합당한 자로 여기시고 모든 선을 기뻐함과 믿음의 역사를 능력으로 이루게 하시고” (<a href="https://bibleox.com/ko/ko-nkrv/2sol/1/#L11">살후 1:11</a>)</p></blockquote><blockquote><p>“<strong>너희도 우리를 위하여 간구함으로 도우라</strong> 이는 우리가 많은 사람의 기도로 얻은 은사로 말미암아 많은 사람이 우리를 위하여 감사하게 하려 함이라” (<a href="https://bibleox.com/ko/ko-nkrv/2kor/1/#L11">고후 1:11</a>)</p></blockquote><h3>우리에게 잘못하는 이들을 위한 기도</h3><blockquote><p>“나는 너희에게 이르노니 너희 원수를 사랑하며 <strong>너희를 박해하는 자를 위하여 기도하라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/5/#L44">마 5:44</a>)</p></blockquote><blockquote><p>“너희를 저주하는 자를 위하여 축복하며 <strong>너희를 모욕하는 자를 위하여 기도하라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/lk/6/#L28">눅 6:28</a>)</p></blockquote><h3>죽을죄가 아닌 죄를 지은 이들을 위한 기도</h3><blockquote><p>“<strong>누구든지 형제가 사망에 이르지 아니하는 죄 범하는 것을 보거든 구하라 그리하면 사망에 이르지 아니하는 범죄자들을 위하여 그에게 생명을 주시리라</strong> 사망에 이르는 죄가 있으니 이에 관하여 나는 구하라 하지 않노라 모든 불의가 죄로되 사망에 이르지 아니하는 죄도 있도다” (<a href="https://bibleox.com/ko/ko-nkrv/1in/5/#L16-17">요일 5:16-17</a>)</p></blockquote><h3>교회의 기도를 통해 사람들의 죄가 용서됩니다</h3><blockquote><p>“너희 중에 병든 자가 있느냐 그는 <strong>교회의 장로들을 청할 것이요</strong> 그들은 주의 이름으로 기름을 바르며 그를 위하여 기도할지니라 믿음의 기도는 병든 자를 구원하리니 주께서 그를 일으키시리라 <strong>혹시 죄를 범하였을지라도 사하심을 받으리라</strong> 그러므로 너희 죄를 서로 고백하며 병이 낫기를 위하여 서로 기도하라 의인의 간구는 역사하는 힘이 큼이니라” (<a href="https://bibleox.com/ko/ko-nkrv/iak/5/#L14-16">약 5:14-16</a>)</p></blockquote>'
