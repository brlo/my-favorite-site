  title: 정해진 틀에 따른 기도
  copy_cover: true
  body: <h2>정해진 틀에 따른 기도</h2><p>구약에는 하느님의 영감을 받은 큰 기도서, 곧 시편이 있습니다. 예언자이자 왕인 다윗이 지었습니다. 시편은 성전에서 쓰였고, 계단을 오르며 불렀습니다.</p><p>사도들은 주님께 기도를 가르쳐 달라고 청하면서, 예언자 세례자 요한이 이미 제자들에게 기도를 가르쳤다는 것을 듭니다:</p><blockquote><p>“예수께서 하루는 어떤 곳에서 기도를 하고 계셨다. 기도를 마치셨을 때 제자 하나가 ‘주님, <strong>요한이 자기 제자들에게 가르쳐 준 것같이 저희에게도 기도를 가르쳐 주십시오</strong>’하고 말하였다.” (<a href="https://bibleox.com/ko/ko-ctb/lk/11/#L1">루가 11:1</a>)</p></blockquote><p>그러자 그리스도께서는 당신의 말씀으로 기도의 틀을 주셨습니다:</p><blockquote><p>“예수께서는 이렇게 가르쳐 주셨다. ‘너희는 기도할 때 이렇게 하여라. 아버지, 온 세상이 아버지를 하느님으로 받들게 하시며 아버지의 나라가 오게 하소서. 날마다 우리에게 필요한 양식을 주시고 우리가 우리에게 잘못한 이를 용서하오니 우리의 죄를 용서하시고 우리를 유혹에 빠지지 않게 하소서.’” (<a href="https://bibleox.com/ko/ko-ctb/lk/11/#L2-4">루가 11:2-4</a>; <a href="https://bibleox.com/ko/ko-ctb/mf/6/#L9-13">마태 6:9-13</a>)</p></blockquote><p>곧 기도문을 주고 정해진 틀(규정)에 따라 기도하는 것은 지극히 정상이며 성경적인 실천입니다.</p>
