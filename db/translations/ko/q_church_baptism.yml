  title: 세례
  copy_cover: true
  body: '<h2>세례성사의 본질</h2><p><strong>세례</strong>(“위로부터 남”, “영적 탄생”)는 교회에서 거행되는 성사로서, 이 성사에서 사람은:</p><ol><li><p>죄에서 씻기고(<a href="https://bibleox.com/ko/ko-nkrv/act/2/#L38">행 2:38</a>; <a href="https://bibleox.com/ko/ko-nkrv/1kor/6/#L11">고전 6:11</a>; <a href="https://bibleox.com/ko/ko-nkrv/act/22/#L16">행 22:16</a>),</p></li><li><p>영적으로 태어나며(<a href="https://bibleox.com/ko/ko-nkrv/in/3/#L3,5-6">요 3:3,5-6</a>; <a href="https://bibleox.com/ko/ko-nkrv/1kor/15/#L44">고전 15:44</a>; <a href="https://bibleox.com/ko/ko-nkrv/1kor/15/#L47-50">고전 15:47-50</a>; <a href="https://bibleox.com/ko/ko-nkrv/1kor/15/#L53">고전 15:53</a>; <a href="https://bibleox.com/ko/ko-nkrv/gal/3/#L27">갈 3:27</a>),</p></li><li><p>구원의 은총을 받고(<a href="https://bibleox.com/ko/ko-nkrv/2kor/6/#L1">고후 6:1</a>),</p></li><li><p>교회에 결합됩니다(<a href="https://bibleox.com/ko/ko-nkrv/1kor/12/#L13">고전 12:13</a>).</p></li></ol><h3>죄의 용서</h3><blockquote><p>“이제는 왜 주저하느냐 일어나 주의 이름을 불러 <strong><mark>세례를 받고 너의 죄를 씻으라</mark></strong> 하더라” (<a href="https://bibleox.com/ko/ko-nkrv/act/22/#L16">행 22:16</a>)</p></blockquote><blockquote><p>“너희 중에 이와 같은 자들이 있더니 주 예수 그리스도의 이름과 우리 하나님의 성령 안에서 <strong><mark>씻음과</mark></strong> <strong>거룩함과</strong> <strong>의롭다 하심을 받았느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/6/#L11">고전 6:11</a>)</p></blockquote><blockquote><p>“베드로가 이르되 너희가 회개하여 <strong>각각 예수 그리스도의 이름으로 세례를 받고</strong> <strong><mark>죄 사함을 받으라</mark></strong> 그리하면 성령의 선물을 받으리니” (<a href="https://bibleox.com/ko/ko-nkrv/act/2/#L38">행 2:38</a>)</p></blockquote><h3>물과 성령으로 남</h3><blockquote><p>“예수께서 대답하여 이르시되 진실로 진실로 네게 이르노니 사람이 <strong>거듭나지 아니하면</strong> 하나님의 나라를 볼 수 없느니라 &lt;…&gt; 예수께서 대답하시되 진실로 진실로 네게 이르노니 사람이 <strong><mark>물과 성령으로 나지 아니하면</mark></strong> 하나님의 나라에 들어갈 수 없느니라 <strong>육으로 난 것은 육이요</strong> <strong><mark>영으로 난 것은 영이니</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/in/3/#L3,5-6">요 3:3,5-6</a>)</p></blockquote><p>다른 구절은 아래 “<a href="#HH-유아-세례">유아 세례</a>”에 있습니다.</p><h3>그리스도의 몸에 결합됨</h3><blockquote><p>“우리가 유대인이나 헬라인이나 종이나 자유인이나 다 한 성령으로 <strong><mark>세례를 받아 한 몸이 되었고</mark></strong> 또 다 한 성령을 마시게 하셨느니라” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/12/#L13">고전 12:13</a>)</p></blockquote><h3>하느님 나라에 들어갈 가능성</h3><blockquote><p>“예수께서 대답하시되 진실로 진실로 네게 이르노니 <strong><mark>사람이 물과 성령으로 나지 아니하면 하나님의 나라에 들어갈 수 없느니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/in/3/#L5">요 3:5</a>)</p></blockquote><h3>구원받을 가능성</h3><blockquote><p>“물은 예수 그리스도께서 부활하심으로 말미암아 <strong><mark>이제 너희를 구원하는 표니 곧 세례라</mark></strong> 이는 <strong>육체의 더러운 것을 제하여 버림이 아니요</strong> 하나님을 향한 선한 양심의 간구니라” (<a href="https://bibleox.com/ko/ko-nkrv/1pet/3/#L21">벧전 3:21</a>; <a href="https://bibleox.com/ko/ko-nkrv/tit/3/#L5">딛 3:5</a>)</p></blockquote><h2>세례성사의 제정</h2><blockquote><p>“예수께서 나아와 말씀하여 이르시되 하늘과 땅의 모든 권세를 내게 주셨으니 그러므로 너희는 가서 모든 민족을 제자로 삼아 <strong>아버지와 아들과 성령의 이름으로 세례를 베풀고</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/28/#L18-19">마 28:18-19</a>)</p></blockquote><h2>세례성사의 질료는 물입니다</h2><p>물로, 물 속에서 베푸는 세례:</p><blockquote><p>“길 가다가 <strong>물 있는 곳에 이르러</strong> 그 내시가 말하되 <strong>보라 물이 있으니 내가 세례를 받음에 무슨 거리낌이 있느냐</strong> (없음) 이에 명하여 수레를 멈추고 <strong>빌립과 내시가 둘 다 물에 내려가</strong> 빌립이 <strong>세례를 베풀고</strong> <strong>둘이 물에서 올라올새</strong> 주의 영이 빌립을 이끌어간지라 내시는 기쁘게 길을 가므로 그를 다시 보지 못하니라” (<a href="https://bibleox.com/ko/ko-nkrv/act/8/#L36-39">행 8:36-39</a>)</p></blockquote><blockquote><p>“이에 베드로가 이르되 이 사람들이 우리와 같이 성령을 받았으니 누가 능히 <strong>물로 세례 베풂을</strong> 금하리요 하고” (<a href="https://bibleox.com/ko/ko-nkrv/act/10/#L47">행 10:47</a>)</p></blockquote><h2>세례에 관한 구약의 예언</h2><blockquote><p>“<strong>맑은 물을 너희에게 뿌려서 너희로 정결하게 하되 곧 너희 모든 더러운 것에서와 모든 우상 숭배에서 너희를 정결하게 할 것이며</strong> 또 새 영을 너희 속에 두고 새 마음을 너희에게 주되 너희 육신에서 굳은 마음을 제거하고 부드러운 마음을 줄 것이며 또 내 영을 너희 속에 두어 너희로 내 율례를 행하게 하리니 너희가 내 규례를 지켜 행할지라 내가 너희 조상들에게 준 땅에서 너희가 거주하면서 내 백성이 되고 나는 너희 하나님이 되리라” (<a href="https://bibleox.com/ko/ko-nkrv/iez/36/#L25-28">겔 36:25-28</a>)</p></blockquote><blockquote><p>“다시 우리를 불쌍히 여기셔서 우리의 죄악을 발로 밟으시고 <strong>우리의 모든 죄를 깊은 바다에 던지시리이다</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mih/7/#L19">미 7:19</a>)</p></blockquote><blockquote><p>“그 날에 <strong>죄와 더러움을 씻는</strong> <strong>샘이</strong> 다윗의 족속과 예루살렘 주민을 위하여 열리리라” (<a href="https://bibleox.com/ko/ko-nkrv/zah/13/#L1">슥 13:1</a>)</p></blockquote><h2>세례의 조건</h2><h3>믿음</h3><p>하느님, 곧 아버지와 아들과 성령을 믿어야 합니다(<a href="https://bibleox.com/ko/ko-nkrv/mf/28/#L19">마 28:19</a>):</p><blockquote><p>“길 가다가 물 있는 곳에 이르러 그 내시가 말하되 보라 물이 있으니 <strong>내가 세례를 받음에 무슨 거리낌이 있느냐</strong> (없음) 이에 명하여 수레를 멈추고 빌립과 내시가 둘 다 물에 내려가 빌립이 <strong>세례를 베풀고</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/act/8/#L36-38">행 8:36-38</a>) <em>(개역개정에는 37절이 없습니다(“없음”). 공인본문과 교회 슬라브어 성경에는 “<strong>온 마음으로 믿으면 받을 수 있습니다</strong>”, “<strong>나는 예수 그리스도가 하느님의 아들이심을 믿습니다</strong>”라는 말이 있습니다.)</em></p></blockquote><h3>회개</h3><p>죄를 회개해야 합니다:</p><blockquote><p>“베드로가 이르되 너희가 <strong>회개하여</strong> 각각 예수 그리스도의 이름으로 세례를 받고 죄 사함을 받으라 그리하면 성령의 선물을 받으리니” (<a href="https://bibleox.com/ko/ko-nkrv/act/2/#L38">행 2:38</a>)</p></blockquote><h2>유아 세례</h2><h3>모두가 영적으로 태어나야 합니다</h3><p>모든 사람은 하느님과 함께하는 영원한 삶을 위해 영적 탄생이 필요합니다:</p><blockquote><p>“<strong>하늘에 속한 형체도 있고 땅에 속한 형체도 있으나</strong> 하늘에 속한 것의 영광이 따로 있고 땅에 속한 것의 영광이 따로 있으니” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/15/#L40">고전 15:40</a>)</p></blockquote><blockquote><p>“육의 몸으로 심고 신령한 몸으로 다시 살아나나니 <strong>육의 몸이 있은즉 또 영의 몸도 있느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/15/#L44">고전 15:44</a>)</p></blockquote><blockquote><p>“<strong>육으로 난 것은 육이요</strong> 영으로 난 것은 영이니” (<a href="https://bibleox.com/ko/ko-nkrv/in/3/#L6">요 3:6</a>)</p></blockquote><p>아담의 썩을 몸을 이어받은 이들은 하느님 나라에 들어갈 수 없습니다:</p><blockquote><p>“<strong>첫 사람은 땅에서 났으니 흙에 속한 자이거니와</strong> 둘째 사람은 하늘에서 나셨느니라 <strong>무릇 흙에 속한 자들은 저 흙에 속한 자와 같고</strong> 무릇 하늘에 속한 자들은 저 하늘에 속한 이와 같으니 <strong>우리가 흙에 속한 자의 형상을 입은 것 같이</strong> 또한 하늘에 속한 이의 형상을 입으리라 형제들아 내가 이것을 말하노니 <strong>혈과 육은 하나님 나라를 이어 받을 수 없고</strong> 또한 <strong>썩는 것은 썩지 아니하는 것을 유업으로 받지 못하느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/15/#L47-50">고전 15:47-50</a>)</p></blockquote><p>그러므로 아담에게서 썩음을 물려받은 모든 이는 죽지만, 세례로 그리스도와 결합된 이들은 살아날 것입니다.</p><blockquote><p>“<strong>아담 안에서</strong> <strong>모든 사람이 죽은 것</strong> 같이 <strong>그리스도 안에서 모든 사람이 삶을 얻으리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/15/#L22">고전 15:22</a>)</p></blockquote><blockquote><p>“무릇 <strong>그리스도 예수와 합하여 세례를 받은</strong> 우리는 그의 죽으심과 합하여 세례를 받은 줄을 알지 못하느냐 &lt;…&gt; 만일 우리가 <strong>그의 죽으심과 같은 모양으로 연합한 자가 되었으면</strong> 또한 <strong>그의 부활과 같은 모양으로 연합한 자도 되리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/rim/6/#L3,5">롬 6:3,5</a>)</p></blockquote><p>죽을 모든 것은 불사를 입어야 합니다:</p><blockquote><p>“<strong>이 썩을 것이 반드시 썩지 아니할 것을 입겠고</strong> <strong>이 죽을 것이 죽지 아니함을 입으리로다</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/15/#L53">고전 15:53</a>)</p></blockquote><p>곧 세례로 그리스도를 입어야 합니다:</p><blockquote><p>“<strong>누구든지 그리스도와 합하기 위하여 세례를 받은 자는 그리스도로 옷 입었느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gal/3/#L27">갈 3:27</a>)</p></blockquote><h3>모두가 원죄에서 씻겨야 합니다</h3><p>또 모든 사람은 첫 조상들에게서 죄성을 물려받습니다. 곧 <a href="https://bibleox.com/ru/ru/w/все-люди-грешны">유아에게도</a> 있습니다:</p><blockquote><p>“누가 깨끗한 것을 더러운 것 가운데에서 낼 수 있으리이까 <strong>하나도 없나이다</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/iov/14/#L4">욥 14:4</a>)</p></blockquote><blockquote><p>“<strong>내가 죄악 중에서 출생하였음이여 어머니가 죄 중에서 나를 잉태하였나이다</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ps/51/#L5">시 51:5</a>)</p></blockquote><blockquote><p>“그러므로 <strong>한 사람으로 말미암아 죄가 세상에 들어오고</strong> 죄로 말미암아 사망이 들어왔나니 이와 같이 모든 사람이 죄를 지었으므로 <strong>사망이 모든 사람에게 이르렀느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/rim/5/#L12">롬 5:12</a>)</p></blockquote><blockquote><p>“<strong>한 사람이 순종하지 아니함으로 많은 사람이 죄인 된 것</strong> 같이 한 사람이 순종하심으로 많은 사람이 의인이 되리라” (<a href="https://bibleox.com/ko/ko-nkrv/rim/5/#L19">롬 5:19</a>)</p></blockquote><blockquote><p>“<strong>내가 원하는 바 선은 행하지 아니하고 도리어 원하지 아니하는 바 악을 행하는도다</strong> 만일 내가 원하지 아니하는 그것을 하면 이를 행하는 자는 내가 아니요 <strong>내 속에 거하는 죄</strong>니라 그러므로 내가 한 법을 깨달았노니 곧 선을 행하기 원하는 나에게 악이 함께 있는 것이로다 내 속사람으로는 하나님의 법을 즐거워하되 <strong>내 지체 속에서 한 다른 법이 내 마음의 법과 싸워 내 지체 속에 있는 죄의 법으로 나를 사로잡는 것을 보는도다</strong> 오호라 나는 곤고한 사람이로다 <strong>이 사망의 몸에서 누가 나를 건져내랴</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/rim/7/#L19-24">롬 7:19-24</a>)</p></blockquote><blockquote><p>“우리가 율법은 신령한 줄 알거니와 나는 육신에 속하여 <strong>죄 아래에 팔렸도다</strong> &lt;…&gt; 내 속사람으로는 하나님의 법을 즐거워하되 <strong>내 지체 속에서 한 다른 법이 내 마음의 법과 싸워</strong> <strong>내 지체 속에 있는 죄의 법으로 나를 사로잡는</strong> 것을 보는도다” (<a href="https://bibleox.com/ko/ko-nkrv/rim/7/#L14,22-23">롬 7:14,22-23</a>)</p></blockquote><blockquote><p>“전에는 우리도 다 그 가운데서 우리 육체의 욕심을 따라 지내며 육체와 마음의 원하는 것을 하여 <strong>다른 이들과 같이 본질상 진노의 자녀이었더니</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ef/2/#L3">엡 2:3</a>)</p></blockquote><h3>사도들은 온 가족(집안)에게 세례를 베풀었습니다</h3><blockquote><p>“내가 또한 <strong>스데바나 집 사람에게 세례를 베풀었고</strong> 그 외에는 다른 누구에게 세례를 베풀었는지 알지 못하노라” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/1/#L16">고전 1:16</a>)</p></blockquote><blockquote><p>“<strong>그와 그 집이 다 세례를 받고</strong> 우리에게 청하여 이르되 만일 나를 주 믿는 자로 알거든 내 집에 들어와 유하라 하고 강권하여 머물게 하니라” (<a href="https://bibleox.com/ko/ko-nkrv/act/16/#L15">행 16:15</a>)</p></blockquote><blockquote><p>“그들을 데리고 나가 이르되 선생들이여 내가 어떻게 하여야 구원을 받으리이까 하거늘 이르되 주 예수를 믿으라 그리하면 너와 네 집이 구원을 받으리라 하고 주의 말씀을 그 사람과 그 집에 있는 모든 사람에게 전하더라 그 밤 그 시각에 간수가 그들을 데려다가 그 맞은 자리를 씻어 주고 <strong>자기와 그 온 가족이 다 세례를 받은 후</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/act/16/#L30-33">행 16:30-33</a>)</p></blockquote><p>사도는 모두에게 세례를 받으라고 부르며, 약속이 그들(어른들)만이 아니라 그들의 자녀에게도 속한다고 말합니다:</p><blockquote><p>“베드로가 이르되 너희가 <strong>회개하여</strong> <strong>각각 예수 그리스도의 이름으로 세례를 받고</strong> 죄 사함을 받으라 그리하면 성령의 선물을 받으리니 이 약속은 <strong>너희와 너희 자녀와</strong> 모든 먼 데 사람 곧 주 우리 하나님이 얼마든지 부르시는 자들에게 <strong>하신 것이라</strong> 하고” (<a href="https://bibleox.com/ko/ko-nkrv/act/2/#L38-39">행 2:38-39</a>)</p></blockquote><p>여기서는 글자 그대로 젖먹이를 말합니다. 언급된 <strong>약속</strong>이 무엇인지 알려면 문맥을 살펴야 합니다. 이 장은 오순절에 교회 모임 위에 성령께서 내려오신 일을 전합니다. 사도 베드로는 이 사건을 설명하면서 예언자 요엘을 통해 주어진 약속을 가리킵니다:</p><blockquote><p>“<strong>그들이 다 성령의 충만함을 받고</strong> 성령이 말하게 하심을 따라 다른 언어들로 말하기를 시작하니라 &lt;…&gt; 베드로가 열한 사도와 함께 서서 소리를 높여 이르되 유대인들과 예루살렘에 사는 모든 사람들아 이 일을 너희로 알게 할 것이니 내 말에 귀를 기울이라 때가 제 삼 시니 너희 생각과 같이 이 사람들이 취한 것이 아니라 이는 곧 <strong>선지자 요엘을 통하여 말씀하신 것이니</strong> 일렀으되 하나님이 말씀하시기를 말세에 <strong>내가 내 영을 모든 육체에 부어 주리니</strong> 너희의 자녀들은 예언할 것이요 너희의 젊은이들은 환상을 보고 너희의 늙은이들은 꿈을 꾸리라 &lt;…&gt; 그들이 이 말을 듣고 마음에 찔려 베드로와 다른 사도들에게 물어 이르되 형제들아 우리가 어찌할꼬 하거늘 베드로가 이르되 <strong>너희가 회개하여 각각 예수 그리스도의 이름으로 세례를 받고</strong> 죄 사함을 받으라 그리하면 성령의 선물을 받으리니 이 약속은 <strong>너희와 너희 자녀와 모든 먼 데 사람</strong> 곧 주 우리 하나님이 얼마든지 부르시는 자들에게 하신 것이라 하고” (<a href="https://bibleox.com/ko/ko-nkrv/act/2/#L4,14-17,37-39">행 2:4,14-17,37-39</a>)</p></blockquote><p>곧 사도 베드로는 예언자 요엘을 인용합니다. 예언자 요엘의 글에서 이 약속을 살펴봅시다:</p><blockquote><p>“시온에서 나팔을 불며 나의 거룩한 산에서 경고의 소리를 질러 이 땅 주민들로 다 떨게 할지니 이는 여호와의 날이 이르게 됨이니라 이제 임박하였으니 &lt;…&gt; 너희는 시온에서 나팔을 불어 거룩한 금식일을 정하고 성회를 소집하라 <strong>백성을 모아 그 모임을 거룩하게 하고 장로들을 모으며 어린이와 젖 먹는 자를 모으며</strong> 신랑을 그 방에서 나오게 하며 신부도 그 신방에서 나오게 하고 여호와를 섬기는 제사장들은 낭실과 제단 사이에서 울며 이르기를 여호와여 주의 백성을 불쌍히 여기소서 주의 기업을 욕되게 하여 나라들로 그들을 관할하지 못하게 하옵소서 어찌하여 이방인으로 그들의 하나님이 어디 있느냐 말하게 하겠나이까 할지어다 그 때에 <strong>여호와께서 자기의 땅을 극진히 사랑하시어</strong> 그의 백성을 불쌍히 여기4)실 것이라 &lt;…&gt; 그 후에 <strong>내가 내 영을 만민에게 부어 주리니</strong> 너희 자녀들이 장래 일을 말할 것이며 너희 늙은이는 꿈을 꾸며 너희 젊은이는 이상을 볼 것이며” (<a href="https://bibleox.com/ko/ko-nkrv/iol/2/#L1,15-18,28">욜 2:1,15-18,28</a>)</p></blockquote><p>이것이 바로 그 약속입니다. 온 백성이 노인부터 젖먹이까지 이 장엄한 모임에 불려 나옵니다. 하느님께서는 이렇게 모인 온 백성에게 성령을 부어 주시겠다고, 기록된 대로 만민에게 부어 주시겠다고 약속하셨습니다. 그러므로 사도가 약속이 듣는 이들만이 아니라 그들의 자녀와 멀리 있는 이들에게도 속한다고 말할 때, 문맥을 따르면 자녀란 글자 그대로 젖먹이를 뜻합니다.</p><h3>다른 사람들의 믿음을 통한 하느님 은총의 활동</h3><p>유아가 세례를 받을 때 대부모의 믿음이 작용할 수 있습니다. 성경에는 다른 사람들의 믿음을 통해 하느님의 은총이 어떤 사람들에게 작용한 경우가 많습니다:</p><h4>구세주께서는 부모의 믿음을 통해 자녀를 고쳐 주십니다</h4><p>하느님께서는 부모의 믿음을 통해 자녀에게 활동하십니다:</p><ul><li><p>믿음은 아버지에게 요구되지만 악령에게서 풀려나는 것은 아들입니다(<a href="https://bibleox.com/ko/ko-nkrv/mk/9/#L17-24">막 9:17-24</a>);</p></li><li><p>믿음은 아버지에게 요구되지만 살아나 낫는 것은 야이로의 딸입니다(<a href="https://bibleox.com/ko/ko-nkrv/lk/8/#L41-42,49-55">눅 8:41-42,49-55</a>);</p></li><li><p>어머니가 믿지만 악령에게서 풀려나는 것은 가나안 여인의 딸입니다(<a href="https://bibleox.com/ko/ko-nkrv/mf/15/#L22-28">마 15:22-28</a>);</p></li><li><p>아버지가 믿지만 낫는 것은 고관의 아들입니다(<a href="https://bibleox.com/ko/ko-nkrv/in/4/#L46-50">요 4:46-50</a>).</p></li></ul><h4>가까운 이들의 믿음을 통한 치유(은총의 활동)</h4><ul><li><p>백인대장이 믿지만 낫는 것은 그의 하인입니다(<a href="https://bibleox.com/ko/ko-nkrv/mf/8/#L10,13">마 8:10,13</a>);</p></li><li><p>친구들이 믿지만 낫는 것은 중풍에 걸린 동료입니다(<a href="https://bibleox.com/ko/ko-nkrv/mk/2/#L5">막 2:5</a>). 여기서 중요한 것은 다른 사람들의 믿음을 통해 그 사람의 <strong>죄도 용서받았다</strong>는 점입니다.</p></li></ul><p>자세히: <a href="https://bibleox.com/ru/ru/w/действие-Бога-по-вере-родителей-и-друзей">부모와 친구들의 믿음을 통한 하느님의 활동</a>.</p><h3>태어날 아들을 하느님께 바치겠다는 서원</h3><p>부모들은 이미 태어난 아기(8일째)만이 아니라 아직 하느님께 청하고 있던 아기까지 바쳤습니다. 예언자 사무엘도 이렇게 태어났습니다:</p><blockquote><p>“서원하여 이르되 만군의 여호와여 만일 주의 여종의 고통을 돌보시고 나를 기억하사 주의 여종을 잊지 아니하시고 주의 여종에게 아들을 주시면 <strong>내가 그의 평생에 그를 여호와께 드리고 삭도를 그의 머리에 대지 아니하겠나이다</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1ts/1/#L11">삼상 1:11</a>)</p></blockquote><h2>세례의 구약적 예표</h2><h3>할례</h3><p>구약의 할례는 신약 세례의 예표입니다:</p><blockquote><p>“또 그 안에서 너희가 <strong>손으로 하지 아니한 할례를 받았으니</strong> 곧 육의 몸을 벗는 것이요 그리스도의 할례니라 <strong>너희가 세례로 그리스도와 함께 장사되고</strong> 또 죽은 자들 가운데서 그를 일으키신 하나님의 역사를 믿음으로 말미암아 그 안에서 함께 일으키심을 받았느니라” (<a href="https://bibleox.com/ko/ko-nkrv/kol/2/#L11-12">골 2:11-12</a>)</p></blockquote><p>구약의 할례 제정. 할례는 하느님과의 계약에 들어가는 일이었고, 아기들은 난 지 8일째에 들어갔습니다:</p><blockquote><p>“너희 중 남자는 다 할례를 받으라 <strong>이것이 나와 너희와 너희 후손 사이에 지킬 내 언약이니라</strong> 너희는 포피를 베어라 이것이 나와 너희 사이의 언약의 표징이니라 <strong>너희의 대대로 모든 남자는</strong> 집에서 난 자나 또는 너희 자손이 아니라 이방 사람에게서 돈으로 산 자를 막론하고 <strong>난 지 팔 일 만에 할례를 받을 것이라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gen/17/#L10-12">창 17:10-12</a>)</p></blockquote><h3>바다 밑을 지나 종살이에서 나옴</h3><p>히브리인들이 홍해 바닥을 지나 이집트의 종살이에서 나온 일은 신약 세례의 예표입니다. 온 백성이 종살이에서 나왔고, 젖먹이를 포함한 온 백성이 모세 안으로 세례를 받았습니다:</p><blockquote><p>“형제들아 나는 너희가 알지 못하기를 원하지 아니하노니 <strong>우리 조상들이 다 구름 아래에 있고 바다 가운데로 지나며 모세에게 속하여 다 구름과 바다에서 세례를 받고</strong> 다 같은 신령한 음식을 먹으며 다 같은 신령한 음료를 마셨으니 이는 그들을 따르는 신령한 반석으로부터 마셨으매 그 반석은 곧 그리스도시라” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/10/#L1-4">고전 10:1-4</a>)</p></blockquote><p>이 예표들은 직접적인 의미가 있습니다:</p><blockquote><p>“그들에게 일어난 이런 일은 본보기가 되고 또한 말세를 만난 <strong>우리를 깨우치기 위하여 기록되었느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/10/#L11">고전 10:11</a>)</p></blockquote><h2>피의 세례</h2><p>피의 세례는 그리스도를 위한 순교의 죽음입니다. 이것은 지하드나 자살 공격이 아닙니다. 순교자는 살기를 바라고 누구의 생명도 위협하지 않습니다. 다만 그리스도를 믿는다는 이유로 생명을 빼앗깁니다. 이런 사람들은 물의 세례 없이도 구원만이 아니라 하늘에서 그리스도와 함께하는 특별한 영광에 이릅니다.</p><h3>그리스도께서는 다가오는 고난과 죽음을 세례라고 말씀하십니다</h3><blockquote><p>“예수께서 대답하여 이르시되 너희는 너희가 구하는 것을 알지 못하는도다 내가 마시려는 잔을 너희가 마실 수 있느냐 그들이 말하되 할 수 있나이다 이르시되 너희가 과연 내 잔을 마시려니와 내 좌우편에 앉는 것은 내가 주는 것이 아니라 내 아버지께서 누구를 위하여 예비하셨든지 그들이 얻을 것이니라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/20/#L22-23">마 20:22-23</a>; <a href="https://bibleox.com/ko/ko-nkrv/mk/10/#L38">막 10:38</a>) <em>(비잔틴 본문(다수 사본)의 마태복음과 마가복음에는 “<strong>내가 받는 세례를</strong>” 받을 수 있느냐는 말씀이 있습니다.)</em></p></blockquote><h3>그리스도 때문에 죽임을 당한 이들은 하늘에서 흰 옷을 받습니다</h3><blockquote><p>“다섯째 인을 떼실 때에 내가 보니 <strong>하나님의 말씀과 그들이 가진 증거로 말미암아 죽임을 당한 영혼들이 제단 아래에 있어</strong> 큰 소리로 불러 이르되 거룩하고 참되신 대주재여 땅에 거하는 자들을 심판하여 우리 피를 갚아 주지 아니하시기를 어느 때까지 하시려 하나이까 하니 각각 그들에게 <strong>흰 두루마기를 주시며</strong> 이르시되 아직 잠시 동안 쉬되 그들의 동무 종들과 형제들도 자기처럼 죽임을 당하여 그 수가 차기까지 하라 하시더라” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/6/#L9-11">계 6:9-11</a>)</p></blockquote><p>그리스어로 순교자는 μάρτυς(증인)라고 합니다. 순교자들은 행동으로 그리스도와 부활에 대한 굳은 믿음을 증언하며, 이것이 흔히 다른 이들이 그리스도를 믿게 되는 계기가 되었습니다.</p><h3>순교자와 박해에 관한 그리스도의 말씀</h3><blockquote><p>“<strong>누구든지 사람 앞에서 나를 시인하면 나도 하늘에 계신 내 아버지 앞에서 그를 시인할 것이요</strong> 누구든지 사람 앞에서 나를 부인하면 나도 하늘에 계신 내 아버지 앞에서 그를 부인하리라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/10/#L32-33">마 10:32-33</a>)</p></blockquote><blockquote><p>“내가 또한 너희에게 말하노니 <strong>누구든지 사람 앞에서 나를 시인하면 인자도 하나님의 사자들 앞에서 그를 시인할 것이요</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/lk/12/#L8">눅 12:8</a>)</p></blockquote><blockquote><p>“<strong>의를 위하여 박해를 받은 자는 복이 있나니 천국이 그들의 것임이라</strong> <strong>나로 말미암아 너희를 욕하고 박해하고 거짓으로 너희를 거슬러 모든 악한 말을 할 때에는</strong> 너희에게 복이 있나니 기뻐하고 즐거워하라 <strong>하늘에서 너희의 상이 큼이라</strong> 너희 전에 있던 선지자들도 이같이 박해하였느니라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/5/#L10-12">마 5:10-12</a>)</p></blockquote><h2>세례 뒤에도 믿는 이들은 죄를 지을 수 있으며 자기 안의 죄와 싸워야 합니다</h2><blockquote><p>“우리가 <strong>진리를 아는 지식을 받은 후 짐짓 죄를 범한즉</strong> 다시 속죄하는 제사가 없고” (<a href="https://bibleox.com/ko/ko-nkrv/evr/10/#L26">히 10:26</a>)</p></blockquote><blockquote><p>“<strong>만일 우리가 죄가 없다고 말하면 스스로 속이고</strong> 또 진리가 우리 속에 있지 아니할 것이요 만일 우리가 우리 죄를 자백하면 그는 미쁘시고 의로우사 우리 죄를 사하시며 우리를 모든 불의에서 깨끗하게 하실 것이요” (<a href="https://bibleox.com/ko/ko-nkrv/1in/1/#L8-9">요일 1:8-9</a>)</p></blockquote><blockquote><p>“나의 자녀들아 내가 이것을 너희에게 씀은 <strong><mark>너희로 죄를 범하지 않게 하려 함이라</mark></strong> 만일 누가 죄를 범하여도 아버지 앞에서 우리에게 대언자가 있으니 곧 의로우신 예수 그리스도시라” (<a href="https://bibleox.com/ko/ko-nkrv/1in/2/#L1">요일 2:1</a>)</p></blockquote><blockquote><p>“<strong><mark>너희 중에 싸움이 어디로부터 다툼이 어디로부터 나느냐</mark></strong> 너희 지체 중에서 싸우는 정욕으로부터 나는 것이 아니냐” (<a href="https://bibleox.com/ko/ko-nkrv/iak/4/#L1">약 4:1</a>)</p></blockquote><blockquote><p>“너희 중에 병든 자가 있느냐 그는 <strong>교회의 장로들을 청할 것이요</strong> 그들은 주의 이름으로 기름을 바르며 그를 위하여 기도할지니라 <strong>믿음의 기도는 병든 자를 구원하리니</strong> 주께서 그를 일으키시리라 <strong><mark>혹시 죄를 범하였을지라도 사하심을 받으리라</mark></strong> 그러므로 <strong>너희 죄를 서로 고백하며 병이 낫기를 위하여 서로 기도하라 의인의 간구는 역사하는 힘이 큼이니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/iak/5/#L14-16">약 5:14-16</a>)</p></blockquote><blockquote><p>“<strong><mark>깨어 의를 행하고 죄를 짓지 말라</mark></strong> <strong>하나님을 알지 못하는 자가 있기로</strong> 내가 너희를 부끄럽게 하기 위하여 말하노라” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/15/#L34">고전 15:34</a>)</p></blockquote><blockquote><p>“서로 친절하게 하며 불쌍히 여기며 <strong><mark>서로 용서하기를</mark></strong> 하나님이 그리스도 안에서 너희를 용서하심과 같이 하라” (<a href="https://bibleox.com/ko/ko-nkrv/ef/4/#L32">엡 4:32</a>)</p></blockquote><p>끝으로 주 예수 그리스도께서는 제자들에게 죄의 용서를 청하라고 가르치시는 기도를 주십니다. 이것은 평생 한 번 하는 기도가 아닙니다. 제자들이 기도를 가르쳐 달라고 청하자 그리스도께서 이 틀을 주셨습니다:</p><blockquote><p>“예수께서 한 곳에서 기도하시고 마치시매 제자 중 하나가 여짜오되 주여 요한이 자기 제자들에게 기도를 가르친 것과 같이 우리에게도 가르쳐 주옵소서 예수께서 이르시되 <strong><mark>너희는 기도할 때에 이렇게 하라</mark></strong> 아버지여 이름이 거룩히 여김을 받으시오며 나라가 임하시오며 우리에게 날마다 일용할 양식을 주시옵고 우리가 우리에게 죄 지은 모든 사람을 용서하오니 <strong><mark>우리 죄도 사하여 주시옵고</mark></strong> 우리를 시험에 들게 하지 마시옵소서 하라” (<a href="https://bibleox.com/ko/ko-nkrv/lk/11/#L1-4">눅 11:1-4</a>; <a href="https://bibleox.com/ko/ko-nkrv/mf/6/#L7-13">마 6:7-13</a>)</p></blockquote><h2>비판</h2><h3>물과 성령으로 남(요한 3:5)이라는 말씀에서 물은 성령을 뜻하는가?</h3><p>신개신교인들은 구원을 위해 물과 성령으로 나야 한다는 구세주의 말씀을 비유로 풀이하여 물이 성령을 뜻한다고 말합니다. 그들은 다음 두 구절을 연결합니다:</p><blockquote><p>“예수께서 대답하시되 진실로 진실로 네게 이르노니 사람이 <strong><mark>물과 성령으로 나지</mark></strong> 아니하면 하나님의 나라에 들어갈 수 없느니라” (<a href="https://bibleox.com/ko/ko-nkrv/in/3/#L5">요 3:5</a>)</p></blockquote><blockquote><p>“나를 믿는 자는 성경에 이름과 같이 <strong><mark>그 배에서 생수의 강이 흘러나오리라 하시니 이는 그를 믿는 자들이 받을 성령을 가리켜 말씀하신 것이라</mark></strong> (예수께서 아직 영광을 받지 않으셨으므로 성령이 아직 그들에게 계시지 아니하시더라)” (<a href="https://bibleox.com/ko/ko-nkrv/in/7/#L38-39">요 7:38-39</a>)</p></blockquote><p>그러나 물을 성령으로 이해하면 동어반복이 됩니다. 그리스도께서 성령과 성령으로 나야 한다고 말씀하신 셈이 되기 때문입니다. 이 말씀에서 성령을 직접 말하는 것이 합당했다면 왜 비유까지 쓰시겠습니까? 비유라 해도 “성령의 물로” 또는 “물 <strong>곧</strong> 성령으로”라고 해야 했을 것입니다. 그러나 실제로는 성령으로 <strong>그리고</strong> 다른 것, 곧 물로 나야 한다고 되어 있습니다.</p><p>게다가 성경에서도 알 수 있듯이 사도들은 글자 그대로 물속에서 거듭나게 했습니다. 세례의 물은 언제나 실제의 물이었지만, 뱃속에서 강물이 (글자 그대로) 흘러나온 사람은 없습니다.</p><p>그러므로 사도들이 물로 세례를 베풀었고 세례가 성령으로 이루어졌으니, 우리는 물과 성령으로 난다는 구세주의 말씀을 사도들이 행한 방식에 적용하여 이해합니다. 곧 이 이해는 물로 세례를 베푼 사도들의 실천과 객관적으로 연결되어 있습니다. 옛 교회는 세례를 물 없이 순전히 생각으로만 이해한 적이 없고, 아버지와 아들과 성령의 이름을 부르며 축성된 물에 세 번 잠기는 것으로 이해했습니다.</p><h3>세례를 받으려면 회개해야 하는데 유아는 회개할 수 없으니 세례를 받을 수 없는가?</h3><p>교회에서 떨어져 나간 일부 단체는 교회가 유아를 세례에 받아들인다고 비난합니다. 그들은 사도가 듣는 이들에게 먼저 회개하고 세례를 받으라고 부르는 구절을 가리킵니다:</p><blockquote><p>“베드로가 이르되 너희가 <strong>회개하여</strong> <strong>각각 예수 그리스도의 이름으로 세례를 받고</strong> 죄 사함을 받으라 그리하면 성령의 선물을 받으리니 이 약속은 너희와 너희 자녀와 모든 먼 데 사람 곧 주 우리 하나님이 얼마든지 부르시는 자들에게 하신 것이라 하고” (<a href="https://bibleox.com/ko/ko-nkrv/act/2/#L38-39">행 2:38-39</a>)</p></blockquote><p>회개의 요구는 어른들에 관한 것입니다. 유아에게는 개인적인 죄가 없으므로 회개의 요구를 적용하기 어렵습니다. 곧 유아는 세례를 받아야 하지만, 개인적인 죄가 없으니 없는 것을 회개할 필요도 없습니다.</p><p>이 비난은 대체로 몹시 이상하게 들립니다. 그 말대로라면 유아가 그리스도를 입으려면(세례를 받으려면, <a href="https://bibleox.com/ko/ko-nkrv/gal/3/#L27">갈 3:27</a>) 먼저 죄를 지어야 하고, 죄를 짓기 전에는 회개할 수 없으니 세례를 받을 수 없습니다. 그리스도와 결합될 가능성을 얻으려면 먼저 그리스도께 죄를 지어야 한다는 불합리한 결론이 나옵니다. 물론 이것은 큰 잘못입니다. 세례는 모두에게 필요하지만 회개는 죄를 지은 이들에게만 필요합니다.</p><p>예언자 요한의 회개의 세례는 그리스도 안으로 받는 세례와 같지 않지만(<a href="https://bibleox.com/ko/ko-nkrv/act/19/#L4">행 19:4</a>) 이 논증이 옳음을 확인하게 해 줍니다. 예언자 요한은 회개의 세례를 베풀었는데, 그리스도께서 오시자 회개 없이 바로 물에 들어가십니다. 그리스도께는 죄가 없으므로 회개 없이 회개의 세례를 받으십니다. 유아도 마찬가지입니다. 그리스도께서 회개의 세례를 받기 위해 죄를 얻으실 필요가 없었듯이 유아도 그렇습니다. 모두가 세례로 부름받지만, 회개할 것이 있는 사람만 회개합니다.</p><h3>세례를 받으려면 믿음이 필요한데 유아는 믿음을 고백할 수 없으니 세례를 받을 수 없는가?</h3><p>교회에서 떨어져 나간 단체들은 주님께서 믿고 세례를 받으라고 말씀하시는 다른 구절도 가리킵니다:</p><blockquote><p>“<strong>믿고 세례를 받는 사람은</strong> 구원을 얻을 것이요 믿지 않는 사람은 정죄를 받으리라” (<a href="https://bibleox.com/ko/ko-nkrv/mk/16/#L16">막 16:16</a>)</p></blockquote><p>곧 구원의 필수 조건 가운데에는 <strong>믿음</strong>을 얻는 것과 <strong>세례</strong>를 받는 것이 있습니다. 이 조건을 이루지 않으면 사람은 구원받을 수 없습니다. 그러나 믿음의 요구를 유아에게 적용하기는 어려우므로, 유아는 대부모의 믿음을 통해 세례를 받으며, 여기에도 성경의 근거가 있습니다(<a href="#HH-다른-사람들의-믿음을-통한-하느님-은총의-활동">자세히</a>).</p><p>믿지 않는 사람은 정죄를 받는다는 말씀에도 특별히 주의해야 합니다. 그렇다면 믿을 수 없는 유아는 정죄를 받는다는 말이 됩니까?</p><blockquote><p>“믿고 세례를 받는 사람은 구원을 얻을 것이요 <strong>믿지 않는 사람은 정죄를 받으리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mk/16/#L16">막 16:16</a>)</p></blockquote><p>요점은 이 구절의 믿음 요구가 어른들에게만 해당한다는 것입니다. 세례 자체는 구세주께서 다른 곳에서 말씀하셨듯이(<a href="https://bibleox.com/ko/ko-nkrv/in/3/#L3,5-6">요 3:3,5-6</a>) 유아를 포함한 모두에게 필요합니다. 유아는 대부모의 믿음을 통해(<a href="#HH-다른-사람들의-믿음을-통한-하느님-은총의-활동">자세히</a>) 세례로 그리스도를 입은 채(<a href="https://bibleox.com/ko/ko-nkrv/gal/3/#L27">갈 3:27</a>) 자랄 것입니다. 능력이 자라는 대로 대부모가 믿음 안에서 그를 굳건하게 할 것입니다. 만일 불행히도 유아가 비극적으로 죽는다면, 세례받은 사람으로서 하늘 나라와 그리스도와 함께하는 영원한 삶에 이릅니다.</p><p>구세주 말씀의 순서(믿고 세례를 받음)에 관해 말하자면 반대 순서도 있습니다:</p><blockquote><p>“<strong>세례 요한이 광야에 이르러</strong> 죄 사함을 받게 하는 회개의 세례를 전파하니” (<a href="https://bibleox.com/ko/ko-nkrv/mk/1/#L4">막 1:4</a>) <em>(비잔틴 본문(다수 사본): “요한은 광야에서 <strong>세례를 베풀며</strong> 회개의 세례를 <strong>선포했다</strong>.”)</em></p></blockquote><p>그렇다면 여기서도 회개의 세례를 먼저 주고 그 다음에 선포를 들었다고 인정해야 할 것입니다.</p><h3>그리스도께서는 서른 살에야 세례를 받으시지 않았는가?</h3><p>예언자 세례 요한의 세례는 그리스도 안으로 받는 세례가 아닙니다. 사도 바울은 이미 요한의 세례를 받은 이들에게 그리스도 안으로 다시 세례를 베풀었습니다:</p><blockquote><p>“이르되 너희가 믿을 때에 성령을 받았느냐 이르되 아니라 우리는 성령이 계심도 듣지 못하였노라 바울이 이르되 <strong>그러면 너희가 무슨 세례를 받았느냐</strong> 대답하되 <strong>요한의 세례니라</strong> 바울이 이르되 <strong>요한이 회개의 세례를 베풀며</strong> 백성에게 말하되 내 뒤에 오시는 이를 믿으라 하였으니 이는 곧 예수라 하거늘 그들이 듣고 <strong>주 예수의 이름으로 세례를 받으니 바울이 그들에게 안수하매 성령이 그들에게 임하시므로</strong> 방언도 하고 예언도 하니” (<a href="https://bibleox.com/ko/ko-nkrv/act/19/#L2-6">행 19:2-6</a>)</p></blockquote><p>게다가 이런 비난을 그리스도를 이 점에서 본받지 않는 사람들에게서 듣는 것은 이상합니다. 그들은 서른 살에 세례를 받지 않고, 자녀들에게도 유아 때는 아니지만 서른 살을 기다리지 않고 8~12세에 세례를 줍니다. 세례 받는 나이에서 그리스도(요한에게서 받으신 세례)를 본받아야 한다고 믿는다면, 비난하는 사람은 세례를 받기 위해 서른 살까지 기다려야 할 것입니다. 그러나 이것은 틀렸습니다. 예언자 요한의 회개의 세례는 그리스도 안으로 받는 세례가 아니기 때문입니다(<a href="https://bibleox.com/ko/ko-nkrv/act/19/#L2-6">행 19:2-6</a>). 그리스도께서 서른 살까지 기다리신 것은 세례를 받기 위해서가 아니라 공적 활동에 나서기 위해서입니다(<a href="https://bibleox.com/ko/ko-nkrv/chis/4/#L3">민 4:3</a>). 곧 설교하고 당신의 영광을 드러내시기 위해서입니다. 그분의 설교는 예언자 요한의 증언으로 시작되었습니다. 요한은 세례를 받으러 온 예수를 그리스도라고 가리킵니다. 요한은 예언자입니다. 그는 구세주의 오심에 관한 예언의 성취를 언제 가리키겠습니까? 구세주께서 공적 활동에 나설 준비가 되셨을 때, 곧 서른 살에 가리킵니다(<a href="https://bibleox.com/ko/ko-nkrv/chis/4/#L3">민 4:3</a>).</p><h3>지혜로운 강도는 세례를 받지 못했지만 구원받지 않았는가?</h3><p>이것은 주님께서 아직 세례성사를 제정하시기 전의 일입니다. 믿고 회개한 강도는 물의 세례 없이 구원받았습니다. 구약의 의인들이 신약 교회가 세워지기 전에 구원받은 것과 같습니다. 신약 교회는 그리스도께서 십자가에 못박히신 뒤 52일(2+40+10)이 지나서야 나타납니다.</p><p><strong>세례는 물과 성령으로 나는 것입니다</strong></p><blockquote><p>“예수께서 대답하시되 진실로 진실로 네게 이르노니 <strong><mark>사람이 물과 성령으로 나지 아니하면 하나님의 나라에 들어갈 수 없느니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/in/3/#L5">요 3:5</a>)</p></blockquote><p><strong>그리스도께서 성령으로 세례를 베푸실 것입니다</strong></p><blockquote><p>“요한이 모든 사람에게 대답하여 이르되 나는 물로 너희에게 세례를 베풀거니와 나보다 능력이 많으신 이가 오시나니 나는 그의 신발끈을 풀기도 감당하지 못하겠노라 그는 <strong><mark>성령과 불로 너희에게 세례를 베푸실 것이요</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/lk/3/#L16">눅 3:16</a>; <a href="https://bibleox.com/ko/ko-nkrv/mf/3/#L11">마 3:11</a>; <a href="https://bibleox.com/ko/ko-nkrv/mk/1/#L8">막 1:8</a>)</p></blockquote><p><strong>그리스도께서 떠나시기 전에는 성령께서 오시지 않습니다</strong></p><blockquote><p>“그러나 내가 너희에게 실상을 말하노니 내가 떠나가는 것이 너희에게 유익이라 <strong><mark>내가 떠나가지 아니하면 보혜사가 너희에게로 오시지 아니할 것이요</mark></strong> 가면 내가 그를 너희에게로 보내리니” (<a href="https://bibleox.com/ko/ko-nkrv/in/16/#L7">요 16:7</a>; <a href="https://bibleox.com/ko/ko-nkrv/in/14/#L16">요 14:16</a>; <a href="https://bibleox.com/ko/ko-nkrv/in/14/#L26">요 14:26</a>; <a href="https://bibleox.com/ko/ko-nkrv/in/7/#L38-39">요 7:38-39</a>)</p></blockquote><blockquote><p>“<strong><mark>내가 아버지께로부터 너희에게 보낼 보혜사</mark></strong> 곧 아버지께로부터 나오시는 진리의 성령이 오실 때에 그가 나를 증언하실 것이요” (<a href="https://bibleox.com/ko/ko-nkrv/in/15/#L26">요 15:26</a>)</p></blockquote><blockquote><p>“볼지어다 내가 내 아버지께서 약속하신 것을 너희에게 보내리니 너희는 <strong>위로부터 능력으로 입혀질 때까지 이 성에 머물라</strong> 하시니라” (<a href="https://bibleox.com/ko/ko-nkrv/lk/24/#L49">눅 24:49</a>)</p></blockquote><p><strong>부활 뒤에도 그리스도께서는 아직 아버지께 올라가지 않으셨습니다</strong></p><blockquote><p>“예수께서 이르시되 나를 붙들지 말라 <strong><mark>내가 아직 아버지께로 올라가지 아니하였노라</mark></strong> 너는 내 형제들에게 가서 이르되 내가 내 아버지 곧 너희 아버지, 내 하나님 곧 너희 하나님께로 올라간다 하라 하시니” (<a href="https://bibleox.com/ko/ko-nkrv/in/20/#L17">요 20:17</a>)</p></blockquote><p><strong>약속된 성령 세례는 그리스도 부활 후 50일째에 처음으로 이루어졌습니다</strong></p><blockquote><p>“데오빌로여 내가 먼저 쓴 글에는 무릇 예수께서 행하시며 가르치시기를 시작하심부터 그가 택하신 사도들에게 성령으로 명하시고 승천하신 날까지의 일을 기록하였노라 그가 고난 받으신 후에 또한 그들에게 확실한 많은 증거로 친히 살아 계심을 나타내사 <strong><mark>사십 일 동안 그들에게 보이시며</mark></strong> 하나님 나라의 일을 말씀하시니라 사도와 함께 모이사 그들에게 분부하여 이르시되 <strong><mark>예루살렘을 떠나지 말고 내게서 들은 바 아버지께서 약속하신 것을 기다리라 요한은 물로 세례를 베풀었으나 너희는 몇 날이 못되어 성령으로 세례를 받으리라</mark></strong> 하셨느니라 &lt;…&gt; 오직 성령이 너희에게 임하시면 너희가 권능을 받고 예루살렘과 온 유대와 사마리아와 땅 끝까지 이르러 내 증인이 되리라 하시니라 이 말씀을 마치시고 그들이 보는데 올려져 가시니 구름이 그를 가리어 보이지 않게 하더라” (<a href="https://bibleox.com/ko/ko-nkrv/act/1/#L1-5,8-9">행 1:1-5,8-9</a>)</p></blockquote><blockquote><p>“<strong>오순절 날이 이미 이르매</strong> 그들이 다같이 한 곳에 모였더니 &lt;…&gt; <strong><mark>마치 불의 혀처럼 갈라지는 것들이 그들에게 보여 각 사람 위에 하나씩 임하여 있더니 그들이 다 성령의 충만함을 받고</mark></strong> 성령이 말하게 하심을 따라 다른 언어들로 말하기를 시작하니라” (<a href="https://bibleox.com/ko/ko-nkrv/act/2/#L1,3-4">행 2:1,3-4</a>)</p></blockquote><p>그러나 그리스도 부활 당일에도 성령의 파견이 언급되지만 세례는 언급되지 않습니다. 이것은 죄를 용서하고 그대로 두는 권한을 주심과 함께 사제 품계를 세우신 일이었습니다:</p><blockquote><p>“<strong>안식 후 첫날 일찍이</strong> 아직 어두울 때에 막달라 마리아가 무덤에 와서 돌이 무덤에서 옮겨진 것을 보고 &lt;…&gt; 이 날 곧 <strong>안식 후 첫날 저녁 때에</strong> 제자들이 유대인들을 두려워하여 모인 곳의 문들을 닫았더니 <strong>예수께서 오사</strong> 가운데 서서 이르시되 너희에게 평강이 있을지어다 &lt;…&gt; 이 말씀을 하시고 그들을 향하사 <strong>숨을 내쉬며 이르시되 성령을 받으라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/in/20/#L1,19,22">요 20:1,19,22</a>)</p></blockquote><h3>“어린이들이 그리스도께 오는 것을 막지 말라”</h3><p>교회에서 떨어져 나간 단체들은 세례 없이는 구원이 불가능하다는 교회의 가르침(<a href="https://bibleox.com/ko/ko-nkrv/in/3/#L3,5-6">요 3:3,5-6</a>)이 유아의 구원을 가로막는다고 비난합니다. 교회가 유아들을 그리스도께 가지 못하게 한다는 것입니다. 그들은 다음 구절을 듭니다:</p><blockquote><p>“사람들이 예수께서 만져 주심을 바라고 <strong>자기 어린 아기를 데리고 오매</strong> 제자들이 보고 꾸짖거늘 예수께서 그 어린 아이들을 불러 가까이 하시고 이르시되 <strong>어린 아이들이 내게 오는 것을 용납하고 금하지 말라</strong> 하나님의 나라가 이런 자의 것이니라” (<a href="https://bibleox.com/ko/ko-nkrv/lk/18/#L15-16">눅 18:15-16</a>)</p></blockquote><p>사실 이 구절은 바로 유아 세례 반대자들을 드러냅니다.</p><p>이 성경의 장면에서 글자 그대로 무슨 일이 일어납니까?</p><ol><li><p><strong>어머니들이 아기들을 그리스도께 데려옵니다.</strong> 주님께서 축복해 주시기를 바라서입니다;</p></li><li><p><strong>제자들이 어머니들의 길을 막습니다.</strong> 아기들을 그리스도께 데려오지 못하게 합니다;</p></li><li><p><strong>주님께서 어머니들에게 길을 열어 주십니다.</strong> 제자들에게 아기들을 데려오는 것을 막지 말라고 하시고 아기들을 축복하십니다(<a href="https://bibleox.com/ko/ko-nkrv/mk/10/#L16">막 10:16</a>).</p></li></ol><p>교회의 반대자들은 무엇을 합니까?</p><ol><li><p>어머니들은 아기를 태어날 때부터 그리스도와 결합시키고 싶어 합니다(이단에서 나온 어머니들에게서 직접 들어 압니다);</p></li><li><p>교회의 반대자들은 어머니들의 길을 막고, 성경이 그리스도를 입는 것이라고 부르는 세례를 글자 그대로 금합니다(<a href="https://bibleox.com/ko/ko-nkrv/gal/3/#L27">갈 3:27</a>).</p></li></ol><p>교회는 무엇을 합니까?</p><ol><li><p>어머니들을 아기들과 함께 그리스도께 부릅니다;</p></li><li><p>어머니들이 아기들을 데려오면 교회는 세례와 성체성혈성사와 성물을 통해 아기들을 그리스도와 결합시키고 축복합니다.</p></li></ol><p>교회의 반대자들은 모든 것을 거꾸로 뒤집습니다. 어머니와 아기를 그리스도께 부르는 교회의 초대를 그리스도와의 결합을 막는 것이라 하고, 어머니들이 아기에게 세례를 주지 못하게 하는 자기들의 금지를 어린이들이 그리스도께 오는 것을 “막지 않는 것”이라고 합니다.</p><p>유아가 세례 없이 구원받는다면 교회의 가르침은 그리스도께서 유아를 구원하시는 것을 조금도 막지 못합니다. 그러나 세례 없이는 아무도 하느님 나라에 들어갈 수 없다고 그리스도께서 말씀하셨으니(<a href="https://bibleox.com/ko/ko-nkrv/in/3/#L3,5-6">요 3:3,5-6</a>), 유아 세례를 금하는 이단자들의 금지는 유아의 구원을 크게 가로막습니다.</p><h3>죄의 용서는 물에 잠길 때가 아니라 믿음을 얻을 때 이루어지는가?</h3><p>많은 신개신교인은 물의 세례를 증언(일종의 표지)일 뿐이라고 하고, 사람의 거듭남과 죄의 용서는 그보다 먼저, 곧 사람이 믿고 하느님께 죄를 사과하자마자 이루어진다고 생각합니다. 그러나 성경을 보면 사람이 거듭나고 죄가 씻기는 것은 바로 물의 세례에서이며, 바로 이것이 사람을 구원합니다.</p><p>사울(훗날의 사도 바울)은 그리스도께 눈이 멀고 곧바로 그분을 <strong>믿지만</strong>, 이것으로 죄가 용서받지는 않습니다. 사울은 물의 세례를 받아 죄를 씻으려고 다메섹으로 보내집니다:</p><blockquote><p>“내가 대답하되 주님 누구시니이까 하니 이르시되 나는 네가 박해하는 나사렛 예수라 하시더라 &lt;…&gt; 내가 이르되 <strong><mark>주님 무엇을 하리이까</mark></strong> 주께서 이르시되 일어나 <strong>다메섹으로 들어가라</strong> 네가 해야 할 모든 것을 거기서 누가 이르리라 하시거늘 나는 그 빛의 광채로 말미암아 볼 수 없게 되었으므로 나와 함께 있는 사람들의 손에 끌려 다메섹에 들어갔노라 율법에 따라 경건한 사람으로 거기 사는 모든 유대인들에게 칭찬을 듣는 아나니아라 하는 이가 내게 와 곁에 서서 말하되 형제 사울아 다시 보라 하거늘 즉시 그를 쳐다보았노라” (<a href="https://bibleox.com/ko/ko-nkrv/act/22/#L8,10-13">행 22:8,10-13</a>)</p></blockquote><p>믿는 사울은 세례를 통해 죄를 씻어야 합니다:</p><blockquote><p>“이제는 왜 주저하느냐 일어나 주의 이름을 불러 <strong><mark>세례를 받고 너의 죄를 씻으라</mark></strong> 하더라” (<a href="https://bibleox.com/ko/ko-nkrv/act/22/#L16">행 22:16</a>)</p></blockquote><p>다른 곳에서는 세례가 (증언만 하는 것이 아니라) 구원한다고 직접 말합니다:</p><blockquote><p>“물은 예수 그리스도께서 부활하심으로 말미암아 <strong><mark>이제 너희를 구원하는 표니 곧 세례라</mark></strong> 이는 육체의 더러운 것을 제하여 버림이 아니요 하나님을 향한 선한 양심의 간구니라” (<a href="https://bibleox.com/ko/ko-nkrv/1pet/3/#L21">벧전 3:21</a>; <a href="https://bibleox.com/ko/ko-nkrv/tit/3/#L5">딛 3:5</a>)</p></blockquote><h3>사람은 그리스도에 관한 설교로 영적으로 태어나는가?</h3><p>성사 안에서의 하느님의 활동을 거부하는 신개신교인들은 세례의 물에서 일어나는 사람의 영적 탄생도 부정합니다. 그들은 “물과 성령으로” 나는 일(<a href="https://bibleox.com/ko/ko-nkrv/in/3/#L3,5">요 3:3,5</a>)이 설교를 듣는 순간에만 일어나고 나머지는 장엄한 상징 의식일 뿐이라고 가르칩니다. 이를 뒷받침하려고 이런 구절을 듭니다:</p><blockquote><p>“그가 그 피조물 중에 우리로 한 첫 열매가 되게 하시려고 자기의 뜻을 따라 <strong>진리의 말씀으로 우리를 낳으셨느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/iak/1/#L18">약 1:18</a>)</p></blockquote><blockquote><p>“너희가 <strong>거듭난 것은</strong> 썩어질 씨로 된 것이 아니요 썩지 아니할 씨로 된 것이니 <strong>살아 있고 항상 있는 하나님의 말씀으로 되었느니라</strong> 그러므로 모든 육체는 풀과 같고 그 모든 영광은 풀의 꽃과 같으니 풀은 마르고 꽃은 떨어지되” (<a href="https://bibleox.com/ko/ko-nkrv/1pet/1/#L23-24">벧전 1:23-24</a>)</p></blockquote><p>하느님께서는 듣는 이의 영혼에 작용하시어 교회의 복음 선포를 도우십니다. 이 설교는 사람에게 전환을 일으켜 회개로 부르고 생명의 길에 세울 수 있습니다. 하느님의 말씀은 사람을 죄의 잠에서 깨우고 회개를 일으키고 믿음을 낳는 수단입니다[1]. 그러나 이 설교가 아직 사람을 죄에서 깨끗하게 하지는 않으며, 물로 새로 나게 하는 씻음에서 이루어지는 물과 성령의 영적 탄생(<a href="https://bibleox.com/ko/ko-nkrv/in/3/#L3,5">요 3:3,5</a>)을 주지도 않습니다(<a href="https://bibleox.com/ko/ko-nkrv/ef/5/#L25-26">엡 5:25-26</a>; <a href="https://bibleox.com/ko/ko-nkrv/tit/3/#L5">딛 3:5</a>).</p><p>다른 곳에서는 죄의 용서를 위해 물에서 거행되는 세례성사를 받아야 한다고 분명히 말합니다:</p><blockquote><p>“이제는 왜 주저하느냐 <strong><mark>일어나 주의 이름을 불러 세례를 받고 너의 죄를 씻으라</mark></strong> 하더라” (<a href="https://bibleox.com/ko/ko-nkrv/act/22/#L16">행 22:16</a>)</p></blockquote><p>믿음과 회개가 없는 사람은 세례에 받아들여지지 않습니다. 그러므로 먼저 하느님의 말씀을 듣고, 들음에서 믿음이 생기고(<a href="https://bibleox.com/ko/ko-nkrv/rim/10/#L17">롬 10:17</a>), 그런 다음에야 물과 성령으로 나고, 죄에서 깨끗해지며, 세례와 견진에서 성령의 인장을 받습니다.</p><p>사도는 먼저 하느님의 말씀을 전하고, 설교를 들은 이들이 마음이 찔리면 죄의 용서를 위해 세례를 받으라고 부릅니다:</p><blockquote><p>“그들이 이 말을 듣고 <strong><mark>마음에 찔려</mark></strong> 베드로와 다른 사도들에게 물어 이르되 <strong>형제들아 우리가 어찌할꼬</strong> 하거늘 베드로가 이르되 <strong><mark>너희가 회개하여 각각 예수 그리스도의 이름으로 세례를 받고</mark></strong> <strong><mark>죄 사함을 받으라</mark></strong> 그리하면 성령의 선물을 받으리니” (<a href="https://bibleox.com/ko/ko-nkrv/act/2/#L37-38">행 2:37-38</a>)</p></blockquote><h3>“세례는 … 하나님을 향한 선한 양심의 간구니라”</h3><blockquote><p>“물은 예수 그리스도께서 부활하심으로 말미암아 이제 너희를 구원하는 표니 곧 세례라 이는 <strong>육체의 더러운 것을 제하여 버림이 아니요</strong> <strong><mark>하나님을 향한 선한 양심의 간구니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1pet/3/#L21">벧전 3:21</a>) <em>(“간구”는 그리스어로 ἐπερώτημα, “청원, 간구”입니다.)</em></p></blockquote><p>일부 번역(러시아 시노달 번역, 공동번역 등)은 이 대목을 “약속”이나 “서약”으로 옮기고, NKJV는 “선한 양심의 응답”으로 옮깁니다. 개역개정은 원문대로 “간구”라고 옮깁니다. 차이는 본질적입니다. “약속”에는 성사가 없고 하느님께 받는 것도 없으며, 오히려 그분께 약속을 드릴 뿐입니다. 그러나 하느님께 청할 때에는 하느님 쪽의 활동(성사)을 기대합니다. 곧 (하느님 쪽에서) 죄를 용서하심으로써 지난 죄의 짐이 없는 선하고 깨끗한 양심을 얻습니다(<a href="https://bibleox.com/ko/ko-nkrv/evr/9/#L14">히 9:14</a>). 개신교인들의 생각처럼 물에 잠길 때 아무 일도 일어나지 않는다면, 아무것도 주시지 않는 하느님께 왜 청하겠습니까?</p><p>사도 베드로의 편지는 그리스어로 쓰였습니다. 슬라브어도 알았던 그리스인 성 키릴로스와 메토디오스 형제는 ἐπερώτημα를 약속이 아니라 청원(간구)으로, 곧 선한 양심을 하느님께 청하는 것으로 옮겼습니다.</p><p>또 옛 그리스도인 가운데 그리스인이자 교회의 주교인 신학자 그레고리오스(4세기)도 이것이 하느님의 활동, 곧 청하는 사람에게 선한 양심을 주시는 일이라고 씁니다(<a href="https://azbyka.ru/otechnik/Grigorij_Bogoslov/slova-izd-2007-g/40">설교 40, 거룩한 세례에 관하여</a>, 러시아어).</p><p>신약 본문에서 이 말(과 그 동사)은 약속으로 옮겨진 적이 없고 언제나 질문, 물음의 뜻입니다.</p><ul><li><p>ἐπερωτῆσαι — 묻다 (마태 22:46)</p></li><li><p>ἐπερωτῶσιν — 묻는다 (마르 7:5)</p></li><li><p>ἐπερωτῆσαι — 묻다 (마르 9:32)</p></li><li><p>Ἐπερωτήσω — 내가 묻겠다 (마르 11:29)</p></li><li><p>ἐπερωτῆσαι — 묻다 (마르 12:34)</p></li><li><p>ἐπερωτῶντα — 묻는 (누가 2:46)</p></li><li><p>Ἐπερωτῶ — 내가 묻는다 (누가 6:9)</p></li><li><p>Ἐπερωτηθεὶς — 질문을 받고 (누가 17:20)</p></li><li><p>ἐπερωτᾶν — 묻다 (누가 20:40)</p></li><li><p>ἐπερωτήσατε — 물어보아라 (요한 9:23)</p></li><li><p>ἐπερωτήσας — 묻고 (사도 23:34)</p></li><li><p>ἐπερωτῶσιν — 묻는 이들에게 (로마 10:20)</p></li><li><p>ἐπερωτάτωσαν — 묻게 하라 (1고린 14:35)</p></li><li><p>ἐπερώτημα — 청원 (교회 슬라브어 번역) (1베드 3:21)</p></li></ul><p>곧 사람이 하느님께 무언가를 드리는 것이 아닙니다. 약속이라면 그렇겠지만, 사람은 청할 뿐이고 주시는 분은 하느님이십니다(“<strong>양심을 깨끗하게 하는</strong>”이라고 직접 기록되어 있습니다, <a href="https://bibleox.com/ko/ko-nkrv/evr/9/#L14">히 9:14</a>).</p><p>사도는 세례가 몸의 때를 씻는 것이 아니라 안으로 죄를 씻는다고 가리킵니다. 곧 세례는 성사, 눈에 감추어져 있고 다 이해하거나 설명할 수 없는 중대한 일입니다.</p><p>이 모든 일은 물에 작용하는 성령의 활동으로 이루어집니다. 그래서 주 예수 그리스도께서 사람들이 성령으로만이 아니라 물과 성령으로 난다고 말씀하셨습니다:</p><blockquote><p>“예수께서 대답하여 이르시되 진실로 진실로 네게 이르노니 사람이 거듭나지 아니하면 하나님의 나라를 볼 수 없느니라 &lt;…&gt; 예수께서 대답하시되 진실로 진실로 네게 이르노니 <strong>사람이 물과 성령으로 나지 아니하면 하나님의 나라에 들어갈 수 없느니라</strong> 육으로 난 것은 육이요 영으로 난 것은 영이니” (<a href="https://bibleox.com/ko/ko-nkrv/in/3/#L3,5-6">요 3:3,5-6</a>)</p></blockquote><p>게다가 사도는 끝에 세례가 구원한다고 말합니다:</p><blockquote><p>“물은 예수 그리스도께서 부활하심으로 말미암아 <strong><mark>이제 너희를 구원하는 표니 곧 세례라</mark></strong> 이는 육체의 더러운 것을 제하여 버림이 아니요 하나님을 향한 선한 양심의 간구니라” (<a href="https://bibleox.com/ko/ko-nkrv/1pet/3/#L21">벧전 3:21</a>)</p></blockquote><p>신개신교인들(침례교인들)은 이에 근본적으로 동의하지 않습니다. 그들에게 세례는 장엄한 약속일 뿐이고 형식이며 구원을 주지 않습니다. 그러나 사도는 바로 세례가 <strong>구원한다</strong>고 말합니다.</p><p>그들은 믿음과 회개를 얻는 순간 죄의 용서를 받는다고 믿습니다. 그러나 사도 바울은 믿었음에도 나중에 죄를 씻기 위해 세례를 받으라는 말을 들었습니다:</p><blockquote><p>“이제는 왜 주저하느냐 <strong><mark>일어나 주의 이름을 불러 세례를 받고 너의 죄를 씻으라</mark></strong> 하더라” (<a href="https://bibleox.com/ko/ko-nkrv/act/22/#L16">행 22:16</a>)</p></blockquote><p>여기에서도 같은 말을 합니다:</p><blockquote><p>“베드로가 이르되 너희가 회개하여 <strong><mark>각각 예수 그리스도의 이름으로 세례를 받고</mark></strong> <strong><mark>죄 사함을 받으라</mark></strong> 그리하면 성령의 선물을 받으리니” (<a href="https://bibleox.com/ko/ko-nkrv/act/2/#L38">행 2:38</a>)</p></blockquote><h3>죄를 씻는 것은 세례가 아니라 하느님의 말씀인가?</h3><blockquote><p>“남편들아 아내 사랑하기를 그리스도께서 교회를 사랑하시고 그 교회를 위하여 자신을 주심 같이 하라 이는 곧 <strong>물로 씻어 말씀으로 깨끗하게 하사 거룩하게 하시고</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ef/5/#L25-26">엡 5:25-26</a>)</p></blockquote><p>그리스도께서는 교회를 거룩하게 하시려고 당신을 내주셨습니다. 어떻게 깨끗하게 하십니까? “물로 씻는” 것, 곧 거룩한 세례로 하십니다. 세례에서는 물에 세 번 잠기며 아버지와 아들과 성령의 이름으로라는 말을 합니다(<a href="https://bibleox.com/ko/ko-nkrv/mf/28/#L19">마 28:19</a>). 여기서 말하는 것이 바로 이 말씀입니다. 물도, 아버지와 아들과 성령에 관한 말씀도 뺄 수 없습니다. 다르게 풀이하면 말을 문맥에서 떼어 내는 것입니다. 여기서는 물로 씻을 때 하는 말씀을 말합니다.</p><h3>백인대장 고넬료에 관하여. 성령은 세례 없이 주어지는가?</h3><p>은사주의 분파의 지지자들은 기도만으로 성령을 받는다는 자기들의 교리를 변호합니다. 이를 위해 세례 전에 성령께서 오신 유일한 경우를 듭니다:</p><blockquote><p>“베드로가 이 말을 할 때에 성령이 말씀 듣는 모든 사람에게 내려오시니” (<a href="https://bibleox.com/ko/ko-nkrv/act/10/#L44">행 10:44</a>)</p></blockquote><p>이것은 이방인이었던 백인대장 고넬료의 이야기입니다. 당시에는 그들이 세례를 받을 수 있는지, 이방인을 교회에 받아들일 수 있는지 분명하지 않았습니다.</p><p>그래서 주님께서는 이방인이 교회에 들어올 수 있음을 보이시려고 특별한 계시를 주십니다.</p><ol><li><p>하느님께서는 이방인 고넬료에게 성령이 아니라 천사를 보내시어, 구원받으려면 교회를 찾아 사도를 불러 그의 말을 들으라고 하십니다.</p></li><li><p>사도 베드로에게 같은 환시가 세 번 나타납니다. 종교적으로 부정한 음식이 내려오고, 음성이 잡아먹으라고 명하며 이렇게 설명합니다: “하느님께서 깨끗하게 만드신 것을 속되다고 하지 말라”(<a href="https://bibleox.com/ko/ko-nkrv/act/10/#L15">행 10:15</a>).</p></li><li><p>사도가 와서 설교를 시작하자 듣고 있던 이방인들에게 성령께서 내려오십니다.</p></li></ol><p>그러자 유대인 출신 그리스도인들은 이 일에 놀랍니다. 어떻게 이방인들에게 성령께서 오실 수 있습니까?</p><blockquote><p>“베드로와 함께 온 할례 받은 신자들이 <strong>이방인들에게도 성령 부어 주심으로 말미암아</strong> 놀라니” (<a href="https://bibleox.com/ko/ko-nkrv/act/10/#L45">행 10:45</a>)</p></blockquote><p>그리고 모든 일은 이방인들의 세례로 끝납니다. 하느님께서 친히 가리키셨으니 이제 의심 없이 세례를 줄 수 있었습니다:</p><blockquote><p>“이에 베드로가 이르되 이 사람들이 우리와 같이 성령을 받았으니 <strong>누가 능히 물로 세례 베풂을 금하리요</strong> 하고 명하여 <strong>예수 그리스도의 이름으로 세례를 베풀라</strong> 하니라 그들이 베드로에게 며칠 더 머물기를 청하니라” (<a href="https://bibleox.com/ko/ko-nkrv/act/10/#L47-48">행 10:47-48</a>)</p></blockquote><p>그러므로 이것은 성령께서 세례 전에 오신 유일한 경우입니다. 세례 대신이 아니라 세례 전입니다. 세례는 어차피 베풀어지기 때문입니다. 이 특별한 강림에는 예외적인 이유가 있습니다. 성령이신 하느님께서 이방인을 교회에 받아들일 수 있음을 보여 주신 것입니다.</p><p>사람에게 성령께서 내려오시는 것은 그 자체로 세례와 구별되는 성사입니다(<a href="https://bibleox.com/ru/ru/w/миропомазание">자세히</a>).</p><h3>내시는 사도 없이 성령을 받았는가?</h3><p>이 질문은 <a href="https://bibleox.com/ru/ru/w/миропомазание">견진성사</a>의 주제에 속합니다. 빌립과 내시의 경우(<a href="https://bibleox.com/ko/ko-nkrv/act/8/#L39">행 8:39</a>)에는 매우 중요한 세부 사항이 있습니다.</p><p>러시아 시노달 번역과 교회 슬라브어 번역에서 이 구절은 “성령께서 내시에게 내리시고, 주님의 천사가 빌립을 데려갔다”로 되어 있습니다. 그러나 가장 오래된 이들을 포함한 대부분의 주석가들, 그 가운데 성 요한 크리소스토모스는 성령의 강림에 관한 구절(αγιον επεπεϲεν επι τον ευνουχον αγγελοϲ δε) 없이 본문을 인용합니다. 그냥 이렇게 말합니다(개역개정과 NKJV, 대부분의 번역도 그렇습니다):</p><blockquote><p>“<strong>주의 영이 빌립을 이끌어간지라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/act/8/#L39">행 8:39</a>)</p></blockquote><p>이 말이 없는 시내 사본(4세기):</p><blockquote><p>καὶ ἐκέλευσεν στῆναι τὸ ἅρμα, καὶ κατέβησαν ἀμφότεροι εἰς τὸ ὕδωρ, ὁ τε Φίλιππος καὶ ὁ εὐνοῦχος, καὶ ἐβάπτισεν αὐτόν. ὅτε δὲ ἀνέβησαν ἐκ τοῦ ὕδατος, <strong>πνεῦμα Κυρίου ἥρπασεν τὸν Φίλιππον</strong>, καὶ οὐκ εἶδεν αὐτὸν οὐκέτι ὁ εὐνοῦχος· ἐπορεύετο γὰρ τὴν ὁδὸν αὐτοῦ χαίρων. Φίλιππος δὲ εὑρέθη εἰς Ἄζωτον, καὶ διερχόμενος εὐηγγελίζετο τὰς πόλεις πάσας, ἕως τοῦ ἐλθεῖν αὐτὸν εἰς Καισάριαν. (사도 8:39-40)</p></blockquote><p>이 말이 없는 바티칸 사본(4세기):</p><blockquote><p>και εκελευϲε ϲτηναι το αρμα και κατεβηϲαν αμφοτεροι ειϲ το υδωρ ο τε φιλιπποϲ και ο ευνουχοϲ και εβαπτιϲεν αυτον οτε δε ανεβηϲαν εκ του υδατοϲ <strong>πνευμα κ̅υ̅ ηρπαϲεν το̅ φιλιππον</strong> και ουκ ειδε̅ αυτον ουκετι ο ευνουχοϲ επορευετο γαρ αυτου την οδον χαιρων</p></blockquote><p>성 요한 크리소스토모스의 인용(성령의 강림에 관한 말이 없습니다):</p><blockquote><p>Ὅτε δὲ ἀνέβησαν ἀπὸ τοῦ ὕδατος, <strong>Πνεῦμα Κυρίου ἥρπασε τὸν Φίλιππον</strong>, καὶ οὐκ εἶδεν αὐτὸν οὐκ ἔτι ὁ εὐνοῦχος.</p></blockquote><p>(<a href="https://bibleox.com/el/grc/w/dNiR_Ὁμιλίαι_εἰς_τὰς_Πράξεις_τῶν_Ἀποστόλων#HH-ΟΜΙΛΙΑ-ΙΘʹ">In acta apostolorum, ΟΜΙΛΙΑ ΙΘ</a>, 그리스어)</p><p>미하일(루진) 주교의 주해:</p><blockquote><p>“<strong>성령께서 내시에게 내리시고, 주님의 천사가 빌립을 데려갔다</strong>: 이 대목은 소수의 고대 그리스어 사본과 번역(슬라브어와 러시아어 번역이 이를 따릅니다), 소수의 고대 주석가에게만 이렇게 되어 있습니다. 그러나 대부분의 사본과 번역과 주석가(그 가운데 성 크리소스토모스와 테오필락토스)에게는 ‘주님의 영이 빌립을 데려갔다’로 되어 있습니다. 어떤 사본의 첨가인지 다른 사본의 누락인지 판단하기 어렵지만 전자가 더 그럴듯하며, 그렇다면 내시가 성령을 받은 일에 대해 저자가 침묵하고 있어서 생긴 것으로 설명됩니다.”</p></blockquote><p>(<a href="https://azbyka.ru/biblia/in/?Act.8:39&r">출처</a>, 러시아어에서 번역)</p><h2>몇 가지 참고 사항</h2><h3>유아도 믿을 수 있습니다</h3><p>유아도 믿음을 증언하는 대답은 못 하지만 믿고 성령으로 가득 찰 수 있다고 볼 근거는 충분합니다.</p><p>예언자 다윗은 젖먹이 때부터 하느님을 신뢰했습니다:</p><blockquote><p>“오직 주께서 나를 모태에서 나오게 하시고 <strong>내 어머니의 젖을 먹을 때에 의지하게 하셨나이다</strong> 내가 날 때부터 주께 맡긴 바 되었고 모태에서 나올 때부터 주는 나의 하나님이 되셨나이다” (<a href="https://bibleox.com/ko/ko-nkrv/ps/22/#L9-10">시 22:9-10</a>)</p></blockquote><p>예언자 요한은 태어나기 전에도 구세주와의 만남을 느끼고 기뻐합니다:</p><blockquote><p>“이 때에 <strong>마리아가</strong> 일어나 빨리 산골로 가서 유대 한 동네에 이르러 사가랴의 집에 들어가 엘리사벳에게 문안하니 엘리사벳이 마리아가 문안함을 들으매 <strong>아이가 복중에서 뛰노는지라</strong> 엘리사벳이 성령의 충만함을 받아” (<a href="https://bibleox.com/ko/ko-nkrv/lk/1/#L39-41">눅 1:39-41</a>) <em>(마리아는 그리스도를 잉태했고, 아기는 예언자 요한입니다.)</em></p></blockquote><p>그리스도께서는 어린이를 앞에 세우시고 당신을 믿는 “이 작은 이들”을 말씀하십니다.</p><blockquote><p>“예수께서 <strong><mark>한 어린 아이를 불러</mark></strong> 그들 가운데 세우시고 이르시되 진실로 너희에게 이르노니 너희가 돌이켜 어린 아이들과 같이 되지 아니하면 결단코 천국에 들어가지 못하리라 그러므로 누구든지 <strong>이 어린 아이와 같이 자기를 낮추는 사람</strong>이 천국에서 큰 자니라 또 누구든지 내 이름으로 <strong>이런 어린 아이 하나를 영접하면</strong> 곧 나를 영접함이니 <strong><mark>누구든지 나를 믿는 이 작은 자 중 하나를 실족하게 하면</mark></strong> 차라리 연자 맷돌이 그 목에 달려서 깊은 바다에 빠뜨려지는 것이 나으니라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/18/#L2-6">마 18:2-6</a>)</p></blockquote><p>어린이들은 예루살렘에 들어가시는 그리스도를 찬양했습니다:</p><blockquote><p>“대제사장들과 서기관들이 예수께서 하시는 이상한 일과 또 성전에서 소리 질러 <strong>호산나 다윗의 자손이여 하는 어린이들</strong>을 보고 노하여 예수께 말하되 그들이 하는 말을 듣느냐 예수께서 이르시되 그렇다 어린 아기와 젖먹이들의 입에서 나오는 찬미를 온전하게 하셨나이다 함을 너희가 읽어 본 일이 없느냐 하시고” (<a href="https://bibleox.com/ko/ko-nkrv/mf/21/#L15-16">마 21:15-16</a>)</p></blockquote><h3>세례 없이 구원받을 수 있다는 말은 없습니다</h3><p>성경에는 세례 없이 구원받을 수 있다는 지시가 없습니다. 그러나 세례 없이는 아무도 하느님 나라에 들어갈 수 없다고 합니다(<a href="https://bibleox.com/ko/ko-nkrv/in/3/#L3,5-6">요 3:3,5-6</a>).</p>'
