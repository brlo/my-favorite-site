    title: 세례
    priority: 1
  references: '<ol><li><p>디미트리 블라디코프 수석사제: “하느님의 말씀을 통해 하느님께서 사람의 영혼에 작용하신다는 것은 의심할 여지가 없습니다. 하느님의 말씀은 사람의 영혼에 전환을 일으켜 회개와 참된 삶으로 부를 수 있지만, <strong>죄에서의 깨끗함과 죄와 싸울 힘을 주지는 않습니다</strong>. 그러므로 하느님의 말씀은 성사를 없애지 않으며 대신할 수도 없습니다. 사도 베드로의 말을 들은 예루살렘 사람들은 <strong>죄의 용서를 위해 세례를 받아야 했습니다</strong>(사도 2:38-41). 죄인이 그리스도께 돌아오는 과정에서 <strong>하느님의 말씀은 하느님께서 그에게 믿음과 회개를 낳으시는 수단</strong>이므로, 사도들은 그분이 “진리의 말씀으로 우리를 낳으셨다”(야고 1:18)고, 그리스도인은 “하느님의 말씀을 통해” 새로 났다고(1베드 1:23), 곧 죄의 잠에서 깨어났다고 말했습니다. 그러나 “하느님의 말씀을 통해 새로 난” 사람이 아직 죄에서 깨끗해진 것은 아니므로 물과 성령으로 나야 합니다. 세례반에서 나올 때 그는 죄의 더러움에서 씻기고 의로움과 거룩함을 사랑하게 되어 “위로부터” 나고 “새로 나게 하는 씻음”을 받습니다. 하느님의 말씀을 통한 거듭남은 세례에서의 거듭남을 대신하지 않고 그리로 이끕니다. 테오판 주교는 ‘(죄인의 회심의) 길은 이렇습니다. 먼저 (하느님의 말씀을) 듣고, 들음에서 믿음이 생기고, 마지막으로 세례와 견진에서 성령의 인장을 받습니다’라고 썼습니다.” (<a href="https://azbyka.ru/otechnik/Dimitrij_Vladykov/pravoslavnaja-tserkov-i-sektanty/1_86">https://azbyka.ru/otechnik/Dimitrij_Vladykov/pravoslavnaja-tserkov-i-sektanty/1_86</a>, 러시아어에서 번역)</p></li></ol><p>번역: 로디온 블라소프 (AI 도구 활용). 저본: 러시아어 원문. 참고: 영어·일본어 번역. 성경 인용과 링크는 공동번역 성서에 따름.</p>'
