  title: 세례
  copy_cover: true
  body: '<h2>세례성사의 본질</h2><p><strong>세례</strong>(“위로부터 남”, “영적 탄생”)는 교회에서 거행되는 성사로서, 이 성사에서 사람은:</p><ol><li><p>죄에서 씻기고(<a href="https://bibleox.com/ko/ko-ctb/act/2/#L38">사도 2:38</a>; <a href="https://bibleox.com/ko/ko-ctb/1kor/6/#L11">1고린 6:11</a>; <a href="https://bibleox.com/ko/ko-ctb/act/22/#L16">사도 22:16</a>),</p></li><li><p>영적으로 태어나며(<a href="https://bibleox.com/ko/ko-ctb/in/3/#L3,5-6">요한 3:3,5-6</a>; <a href="https://bibleox.com/ko/ko-ctb/1kor/15/#L44">1고린 15:44</a>; <a href="https://bibleox.com/ko/ko-ctb/1kor/15/#L47-50">1고린 15:47-50</a>; <a href="https://bibleox.com/ko/ko-ctb/1kor/15/#L53">1고린 15:53</a>; <a href="https://bibleox.com/ko/ko-ctb/gal/3/#L27">갈라 3:27</a>),</p></li><li><p>구원의 은총을 받고(<a href="https://bibleox.com/ko/ko-ctb/2kor/6/#L1">2고린 6:1</a>),</p></li><li><p>교회에 결합됩니다(<a href="https://bibleox.com/ko/ko-ctb/1kor/12/#L13">1고린 12:13</a>).</p></li></ol><h3>죄의 용서</h3><blockquote><p>“그러니 망설이지 말고 어서 일어나 그분의 이름을 부르며 <strong><mark>세례를 받고 죄를 깨끗이 씻어 버리시오</mark></strong>.‘” (<a href="https://bibleox.com/ko/ko-ctb/act/22/#L16">사도 22:16</a>)</p></blockquote><blockquote><p>“여러분 중에도 이런 사람이 더러 있습니다. 그러나 여러분은 주 예수 그리스도의 이름과 하느님의 성령으로 <strong><mark>깨끗이 씻겨지고</mark></strong> <strong>거룩하여졌으며</strong> <strong>하느님과의 올바른 관계에 놓이게 되었습니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/6/#L11">1고린 6:11</a>)</p></blockquote><blockquote><p>“베드로가 이렇게 대답하였다. ‘회개하시오. 그리고 여러분은 <strong>한 사람도 빠짐없이 예수 그리스도의 이름으로 세례를 받고</strong> <strong><mark>여러분의 죄를 용서받으시오</mark></strong>. 그리하면 성령을 선물로 받게 될 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/act/2/#L38">사도 2:38</a>)</p></blockquote><h3>물과 성령으로 남</h3><blockquote><p>“그러자 예수께서는 ‘정말 잘 들어 두어라. 누구든지 <strong>새로 나지 아니하면</strong> 아무도 하느님의 나라를 볼 수 없다’하고 말하였다. &lt;…&gt; 정말 잘 들어 두어라. <strong><mark>물과 성령으로 새로 나지 않으면</mark></strong> 아무도 하느님 나라에 들어 갈 수 없다. <strong>육에서 나온 것은 육이며</strong> <strong><mark>영에서 나온 것은 영이다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/in/3/#L3,5-6">요한 3:3,5-6</a>)</p></blockquote><p>다른 구절은 아래 “<a href="#HH-유아-세례">유아 세례</a>”에 있습니다.</p><h3>그리스도의 몸에 결합됨</h3><blockquote><p>“유다인이든지 그리이스인이든 종이든 자유인이든 우리는 모두 한 성령으로 <strong><mark>세례를 받아 한 몸이 되었고</mark></strong> 같은 성령을 받아 마셨습니다.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/12/#L13">1고린 12:13</a>)</p></blockquote><h3>하느님 나라에 들어갈 가능성</h3><blockquote><p>“정말 잘 들어 두어라. <strong><mark>물과 성령으로 새로 나지 않으면 아무도 하느님 나라에 들어 갈 수 없다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/in/3/#L5">요한 3:5</a>)</p></blockquote><h3>구원받을 가능성</h3><blockquote><p>“그것은 오늘날 여러분에게 <strong><mark>구원을 가져다 주는 세례</mark></strong>를 미리 보여 준 것입니다. 세례는 몸에서 <strong>더러운 때를 벗기는 것이 아니라</strong> 깨끗한 양심으로 살겠다고 하느님께 서약을 하는 것이며 예수 그리스도의 부활로써 이루어지는 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/1pet/3/#L21">1베드 3:21</a>; <a href="https://bibleox.com/ko/ko-ctb/tit/3/#L5">디도 3:5</a>)</p></blockquote><h2>세례성사의 제정</h2><blockquote><p>“예수께서는 그들에게 가까이 오셔서 이렇게 말씀하셨다. ‘나는 하늘과 땅의 모든 권한을 받았다. 그러므로 <strong>너희는 가서</strong> 이 세상 모든 사람들을 내 제자로 삼아 <strong>아버지와 아들과 성령의 이름으로 그들에게 세례를 베풀고</strong>” (<a href="https://bibleox.com/ko/ko-ctb/mf/28/#L18-19">마태 28:18-19</a>)</p></blockquote><h2>세례성사의 질료는 물입니다</h2><p>물로, 물 속에서 베푸는 세례:</p><blockquote><p>“그들이 같이 길을 가다가 <strong>물 있는 곳에 이르자</strong> 내시가 ‘<strong>자, 여기 물이 있습니다. 내가 세례를 받아서는 안 될 것이 무엇입니까</strong>?’하고 물었다. (없음) 내시는 마차를 세우게 하고 <strong>필립보와 함께 물로 내려 가</strong> 그에게 <strong>세례를 받았다</strong>. 그들이 <strong>물에서 올라 오자</strong> 주의 성령이 필립보를 어디론가 데리고 가셨다. 그래서 내시는 그를 볼 수 없게 되었지만 기쁨에 넘쳐 제 갈 길을 갔다.” (<a href="https://bibleox.com/ko/ko-ctb/act/8/#L36-39">사도 8:36-39</a>)</p></blockquote><blockquote><p>“이 사람들도 우리처럼 성령을 받았으니 이들이 <strong>물로 세례를 받는 것</strong>을 어떻게 막을 수 있겠는가?‘ 하며” (<a href="https://bibleox.com/ko/ko-ctb/act/10/#L47">사도 10:47</a>)</p></blockquote><h2>세례에 관한 구약의 예언</h2><blockquote><p>“<strong>정화수를 끼얹어 너희의 모든 부정을 깨끗이 씻어 주리라</strong>. 온갖 우상을 섬기는 중에 묻었던 때를 깨끗이 씻어 주고 새 마음을 넣어 주며 새 기운을 불어 넣어 주리라. 너희 몸에서 돌처럼 굳은 마음을 도려 내고 살처럼 부드러운 마음을 넣어 주리라. 나의 기운을 너희 속에 넣어 주리니, 그리 되면 너희는 내가 세워준 규정을 따라 살 수 있고 나에게서 받은 법도를 실천할 수 있게 되리라. 너희는 내가 너희 조상들에게 준 땅에서 살면서 나의 백성이 될 것이요 나는 너희의 하느님이 될 것이다.” (<a href="https://bibleox.com/ko/ko-ctb/iez/36/#L25-28">에제 36:25-28</a>)</p></blockquote><blockquote><p>“마음을 돌이키시어 우리를 불쌍히 여기시고 우리의 온갖 죄악을 부수어 주십시오. <strong>깊은 바다에 쓸어 넣어 주십시오</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/mih/7/#L19">미가 7:19</a>)</p></blockquote><blockquote><p>“그 날이 오면, <strong>샘이 터져</strong> 다윗 가문과 예루살렘 성민들의 <strong>죄와 때를 씻어 주리라</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/zah/13/#L1">즈가 13:1</a>)</p></blockquote><h2>세례의 조건</h2><h3>믿음</h3><p>하느님, 곧 아버지와 아들과 성령을 믿어야 합니다(<a href="https://bibleox.com/ko/ko-ctb/mf/28/#L19">마태 28:19</a>):</p><blockquote><p>“그들이 같이 길을 가다가 물 있는 곳에 이르자 내시가 ‘자, 여기 물이 있습니다. <strong>내가 세례를 받아서는 안 될 것이 무엇입니까</strong>?’하고 물었다. (없음) 내시는 마차를 세우게 하고 필립보와 함께 물로 내려 가 그에게 <strong>세례를 받았다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/act/8/#L36-38">사도 8:36-38</a>) <em>(공동번역에는 37절이 없습니다. 공인본문과 교회 슬라브어 성경에는 “<strong>온 마음으로 믿으면 받을 수 있습니다</strong>”, “<strong>나는 예수 그리스도가 하느님의 아들이심을 믿습니다</strong>”라는 말이 있습니다.)</em></p></blockquote><h3>회개</h3><p>죄를 회개해야 합니다:</p><blockquote><p>“베드로가 이렇게 대답하였다. ‘<strong>회개하시오</strong>. 그리고 여러분은 한 사람도 빠짐없이 예수 그리스도의 이름으로 세례를 받고 여러분의 죄를 용서받으시오. 그리하면 성령을 선물로 받게 될 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/act/2/#L38">사도 2:38</a>)</p></blockquote><h2>유아 세례</h2><h3>모두가 영적으로 태어나야 합니다</h3><p>모든 사람은 하느님과 함께하는 영원한 삶을 위해 영적 탄생이 필요합니다:</p><blockquote><p>“<strong>하늘에 속한 것들이 있고 또 땅에 속한 것들이 있습니다</strong>. 하늘에 속한 것들의 영광이 다르고 땅에 속한 것들의 영광도 다릅니다.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/15/#L40">1고린 15:40</a>)</p></blockquote><blockquote><p>“육체적인 몸으로 묻히지만 영적인 몸으로 다시 살아납니다. <strong>육체적인 몸이 있으면 영적인 몸도 있습니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/15/#L44">1고린 15:44</a>)</p></blockquote><blockquote><p>“<strong>육에서 나온 것은 육이며</strong> 영에서 나온 것은 영이다.” (<a href="https://bibleox.com/ko/ko-ctb/in/3/#L6">요한 3:6</a>)</p></blockquote><p>아담의 썩을 몸을 이어받은 이들은 하느님 나라에 들어갈 수 없습니다:</p><blockquote><p>“<strong>첫째 인간은 흙으로 만들어진 땅의 존재이지만</strong> 둘째 인간은 하늘에서 왔습니다. <strong>흙의 인간들은 흙으로 된 그 사람과 같고</strong> 하늘의 인간들은 하늘에 속한 그분과 같습니다. <strong>우리가 흙으로 된 그 사람의 형상을 지녔듯이</strong> 하늘에 속한 그분의 형상을 또한 지니게 될 것입니다. 형제 여러분, 이 말을 잘 들어 두십시오. <strong>살과 피는 하느님의 나라를 이어 받을 수 없고</strong> <strong>썩어 없어질 것은 불멸의 것을 이어 받을 수 없습니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/15/#L47-50">1고린 15:47-50</a>)</p></blockquote><p>그러므로 아담에게서 썩음을 물려받은 모든 이는 죽지만, 세례로 그리스도와 결합된 이들은 살아날 것입니다.</p><blockquote><p>“<strong>아담으로 말미암아</strong> 모든 사람이 <strong>모두 죽는 것</strong>과 마찬가지로 <strong>그리스도로 말미암아 모든 사람이 살게 될 것입니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/15/#L22">1고린 15:22</a>)</p></blockquote><blockquote><p>“<strong>세례를 받고 그리스도 예수와 하나가 된</strong> 우리는 이미 예수와 함께 죽었다는 것을 모르십니까? &lt;…&gt; 우리는 <strong>그리스도와 같이 죽어서</strong> 그분과 하나가 되었으니 <strong>그리스도와 같이 다시 살아나서</strong> 또한 그분과 하나가 될 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/rim/6/#L3,5">로마 6:3,5</a>)</p></blockquote><p>죽을 모든 것은 불사를 입어야 합니다:</p><blockquote><p>“<strong>이 썩을 몸은 불멸의 옷을 입어야 하고</strong> <strong>이 죽을 몸은 불사의 몸을 입어야</strong> 하기 때문입니다.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/15/#L53">1고린 15:53</a>)</p></blockquote><p>곧 세례로 그리스도를 입어야 합니다:</p><blockquote><p>“<strong>세례를 받아서 그리스도 안으로 들어 간 여러분은 모두 그리스도를 옷 입듯이 입었습니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/gal/3/#L27">갈라 3:27</a>)</p></blockquote><h3>모두가 원죄에서 씻겨야 합니다</h3><p>또 모든 사람은 첫 조상들에게서 죄성을 물려받습니다. 곧 <a href="https://bibleox.com/ru/ru/w/все-люди-грешны">유아에게도</a> 있습니다:</p><blockquote><p>“그 누가 부정한 데서 정한 것을 나오게 할 수 있겠습니까? <strong>아무 것도 없사옵니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/iov/14/#L4">욥 14:4</a>)</p></blockquote><blockquote><p>“<strong>이 몸은 죄 중에 태어났고, 모태에 있을 때부터 이미 죄인이었습니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/ps/51/#L5">시편 51:5</a>)</p></blockquote><blockquote><p>“<strong>한 사람이 죄를 지어 이 세상에 죄가 들어 왔고</strong> 죄는 또한 죽음을 불러 들인 것같이 모든 사람이 죄를 지어 <strong>죽음이 온 인류에게 미치게 되었습니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/rim/5/#L12">로마 5:12</a>)</p></blockquote><blockquote><p>“<strong>한 사람의 불순종으로 많은 사람이 죄인이 된 것</strong>과는 달리 한 사람의 순종으로 많은 사람이 하느님과 올바른 관계를 가지게 될 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/rim/5/#L19">로마 5:19</a>)</p></blockquote><blockquote><p>“<strong>나는 내가 해야 하겠다고 생각하는 선은 행하지 않고 해서는 안 되겠다고 생각하는 악을 행하고 있습니다</strong>. 그런 일을 하면서도 그것을 해서는 안 되겠다고 생각하고 있으니 결국 그런 일을 하는 것은 내가 아니라 <strong>내 속에 들어 있는 죄</strong>입니다. 여기에서 나는 한 법칙을 발견했습니다. 곧 내가 선을 행하려 할 때에는 언제나 바로 곁에 악이 도사리고 있다는 것입니다. 나는 내 마음 속으로는 하느님의 율법을 반기지만 <strong>내 몸 속에는 내 이성의 법과 대결하여 싸우고 있는 다른 법이 있다는 것을 알고 있습니다. 그 법은 나를 사로잡아 내 몸 속에 있는 죄의 법의 종이 되게 합니다</strong>. 나는 과연 비참한 인간입니다. <strong>누가 이 죽음의 육체에서 나를 구해 줄 것입니까</strong>?” (<a href="https://bibleox.com/ko/ko-ctb/rim/7/#L19-24">로마 7:19-24</a>)</p></blockquote><blockquote><p>“우리가 아는 대로 율법 자체는 영적인 것입니다. 그런데 나는 육정을 따라 사는 사람으로서 <strong>죄의 종으로 팔린 몸입니다</strong>. &lt;…&gt; 나는 내 마음 속으로는 하느님의 율법을 반기지만 <strong>내 몸 속에는 내 이성의 법과 대결하여 싸우고 있는 다른 법이 있다</strong>는 것을 알고 있습니다. 그 법은 <strong>나를 사로잡아 내 몸 속에 있는 죄의 법의 종이 되게</strong> 합니다.” (<a href="https://bibleox.com/ko/ko-ctb/rim/7/#L14,22-23">로마 7:14,22-23</a>)</p></blockquote><blockquote><p>“실상 <strong>우리도 다</strong> 그들과 같아서 전에는 본능적인 욕망을 따라서 육정에 끌려 살았던 사람들로서 <strong>본래 다른 사람들과 마찬가지로 하느님의 진노를 살 수밖에 없었던 것입니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/ef/2/#L3">에페 2:3</a>)</p></blockquote><h3>사도들은 온 가족(집안)에게 세례를 베풀었습니다</h3><blockquote><p>“하기는 <strong>스테파나 집안 사람들에게도 세례를 베푼 일이 있으나</strong> 그 밖에는 아무에게도 세례를 베푼 기억이 없습니다.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/1/#L16">1고린 1:16</a>)</p></blockquote><blockquote><p>“리디아는 <strong>온 집안 식구와 함께 세례를 받고</strong> 나서 ‘정말 저를 주님의 충실한 신도로 여기신다면 제 집에 오셔서 머물러 계십시오’하고 간청하면서 우리를 자기 집으로 데리고 갔다.” (<a href="https://bibleox.com/ko/ko-ctb/act/16/#L15">사도 16:15</a>)</p></blockquote><blockquote><p>“그리고 그들을 밖으로 데리고 나가서 ‘두 분 선생님, 제가 어떻게 해야 구원을 얻겠습니까?’하고 물었다. 주 예수를 믿으시오. 그러면 당신과 당신네 집안이 다 구원을 얻을 것입니다‘ 그들은 이렇게 대답하고 간수와 그 집안 온 식구들에게 주님의 말씀을 들려 주었다. 간수는 한밤중이었는데도 그 두 사람을 데려다가 상처를 씻어 주고 그 자리에서 <strong>그와 온 가족이 세례를 받았다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/act/16/#L30-33">사도 16:30-33</a>)</p></blockquote><p>사도는 모두에게 세례를 받으라고 부르며, 약속이 그들(어른들)만이 아니라 그들의 자녀에게도 속한다고 말합니다:</p><blockquote><p>“베드로가 이렇게 대답하였다. ‘<strong>회개하시오</strong>. 그리고 여러분은 <strong>한 사람도 빠짐없이 예수 그리스도의 이름으로 세례를 받고</strong> 여러분의 죄를 용서받으시오. 그리하면 성령을 선물로 받게 될 것입니다. 이것은 우리 주 하느님께서 <strong>여러분과 여러분의 자녀와</strong> 그리고 멀리 떨어져 있는 사람들, 곧 하느님께서 부르시는 모든 사람들에게 <strong>하신 약속입니다</strong>.’” (<a href="https://bibleox.com/ko/ko-ctb/act/2/#L38-39">사도 2:38-39</a>)</p></blockquote><p>여기서는 글자 그대로 젖먹이를 말합니다. 언급된 <strong>약속</strong>이 무엇인지 알려면 문맥을 살펴야 합니다. 이 장은 오순절에 교회 모임 위에 성령께서 내려오신 일을 전합니다. 사도 베드로는 이 사건을 설명하면서 예언자 요엘을 통해 주어진 약속을 가리킵니다:</p><blockquote><p>“<strong>그들의 마음은 성령으로 가득 차서</strong> 성령이 시키시는 대로 여러 가지 외국어로 말을 하기 시작하였다. &lt;…&gt; 그 때 <strong>베드로</strong>가 다른 열 한 사도들과 함께 일어서서 군중을 보고 큰 소리로 이렇게 말했다. ‘유다 동포와 예루살렘 시민 여러분, 내가 하는 말을 귀담아 듣고 잘 생각해 보십시오. 지금 시각이 아침 아홉 시인데 어떻게 술에 취했다고 생각하십니까? 이 사람들은 술에 취한 것이 아닙니다. 이것은 <strong>예언자 요엘이 예언한 대로 된 것입니다</strong>. 하느님께서 말씀하신다. 마지막 날에 나는 <strong>모든 사람에게 나의 성령을 부어 주리니</strong> 너희 아들 딸들은 예언을 하고 젊은이들은 계시의 영상을 보며 늙은이들은 꿈을 꾸리라. &lt;…&gt; 사람들은 이 말을 듣고 마음이 찔려 베드로와 사도들에게 ’형제 여러분, 그러면 우리는 어떻게 하면 좋겠습니까?‘하고 물었다. 베드로가 이렇게 대답하였다. ’<strong>회개하시오. 그리고 여러분은 한 사람도 빠짐없이 예수 그리스도의 이름으로 세례를 받고</strong> 여러분의 죄를 용서받으시오. 그리하면 성령을 선물로 받게 될 것입니다. 이것은 우리 주 하느님께서 <strong>여러분과 여러분의 자녀와 그리고 멀리 떨어져 있는 사람들</strong>, 곧 하느님께서 부르시는 모든 사람들에게 하신 약속입니다.‘” (<a href="https://bibleox.com/ko/ko-ctb/act/2/#L4,14-17,37-39">사도 2:4,14-17,37-39</a>)</p></blockquote><p>곧 사도 베드로는 예언자 요엘을 인용합니다. 예언자 요엘의 글에서 이 약속을 살펴봅시다:</p><blockquote><p>“시온에서 나팔을 불어라. 이 땅에 사는 모든 사람이 떨도록 나의 거룩한 산에서 경보를 울려라. 야훼께서 거둥하실 날이 왔다. 그 날이 다가 오고 있다. &lt;…&gt; 시온산 위에서 나팔을 불어라. 단식을 선포하고 성회를 열어라. <strong>백성을 불러 모으고, 거룩한 대회를 열어라. 노인들을 불러 모으고 어린이들을 모아 들여라. 젖먹이도 오라고 하여라</strong>. 신혼 부부도 신방에서 나와 모이게 하여라. 성전 현관과 제단 사이를 오가며 야훼를 섬기는 사제들아, 울며 빌어라. ‘야훼여, 당신 백성을 불쌍히 여겨 주십시오. 당신의 유산으로 삼으신 이 백성이 남에게 욕을 당하지 않게 하시고 ’너희 하느님이 어찌 되었느냐?‘ 며 손가락질받지 않게 하여 주십시오.’ <strong>야훼께서는 당신의 땅 생각에 가슴이 타고 당신의 백성 불쌍한 생각이 드시어</strong> &lt;…&gt; 그런 다음에 <strong>나는 내 영을 만민에게 부어 주리니</strong>, 너희의 아들과 딸은 예언을 하리라. 늙은이들은 꿈을 꾸고, 젊은이들은 환상을 보리라.” (<a href="https://bibleox.com/ko/ko-ctb/iol/2/#L1,15-18,28">요엘 2:1,15-18,28</a>)</p></blockquote><p>이것이 바로 그 약속입니다. 온 백성이 노인부터 젖먹이까지 이 장엄한 모임에 불려 나옵니다. 하느님께서는 이렇게 모인 온 백성에게 성령을 부어 주시겠다고, 기록된 대로 만민에게 부어 주시겠다고 약속하셨습니다. 그러므로 사도가 약속이 듣는 이들만이 아니라 그들의 자녀와 멀리 있는 이들에게도 속한다고 말할 때, 문맥을 따르면 자녀란 글자 그대로 젖먹이를 뜻합니다.</p><h3>다른 사람들의 믿음을 통한 하느님 은총의 활동</h3><p>유아가 세례를 받을 때 대부모의 믿음이 작용할 수 있습니다. 성경에는 다른 사람들의 믿음을 통해 하느님의 은총이 어떤 사람들에게 작용한 경우가 많습니다:</p><h4>구세주께서는 부모의 믿음을 통해 자녀를 고쳐 주십니다</h4><p>하느님께서는 부모의 믿음을 통해 자녀에게 활동하십니다:</p><ul><li><p>믿음은 아버지에게 요구되지만 악령에게서 풀려나는 것은 아들입니다(<a href="https://bibleox.com/ko/ko-ctb/mk/9/#L17-24">마르 9:17-24</a>);</p></li><li><p>믿음은 아버지에게 요구되지만 살아나 낫는 것은 야이로의 딸입니다(<a href="https://bibleox.com/ko/ko-ctb/lk/8/#L41-42,49-55">루가 8:41-42,49-55</a>);</p></li><li><p>어머니가 믿지만 악령에게서 풀려나는 것은 가나안 여인의 딸입니다(<a href="https://bibleox.com/ko/ko-ctb/mf/15/#L22-28">마태 15:22-28</a>);</p></li><li><p>아버지가 믿지만 낫는 것은 고관의 아들입니다(<a href="https://bibleox.com/ko/ko-ctb/in/4/#L46-50">요한 4:46-50</a>).</p></li></ul><h4>가까운 이들의 믿음을 통한 치유(은총의 활동)</h4><ul><li><p>백인대장이 믿지만 낫는 것은 그의 하인입니다(<a href="https://bibleox.com/ko/ko-ctb/mf/8/#L10,13">마태 8:10,13</a>);</p></li><li><p>친구들이 믿지만 낫는 것은 중풍에 걸린 동료입니다(<a href="https://bibleox.com/ko/ko-ctb/mk/2/#L5">마르 2:5</a>). 여기서 중요한 것은 다른 사람들의 믿음을 통해 그 사람의 <strong>죄도 용서받았다</strong>는 점입니다.</p></li></ul><p>자세히: <a href="https://bibleox.com/ru/ru/w/действие-Бога-по-вере-родителей-и-друзей">부모와 친구들의 믿음을 통한 하느님의 활동</a>.</p><h3>태어날 아들을 하느님께 바치겠다는 서원</h3><p>부모들은 이미 태어난 아기(8일째)만이 아니라 아직 하느님께 청하고 있던 아기까지 바쳤습니다. 예언자 사무엘도 이렇게 태어났습니다:</p><blockquote><p>“그는 서원을 하며 빌었다. ‘이 계집종의 가련한 모습을 굽어 살펴주십시오. 이 계집 종을 저버리지 마시고 사내 아이 하나만 점지해 주십시오. 그러면 저는 <strong>그 아이를 야훼께 바치겠습니다. 평생 그의 머리를 깍지 않도록 하겠습니다</strong>.’” (<a href="https://bibleox.com/ko/ko-ctb/1ts/1/#L11">삼상 1:11</a>)</p></blockquote><h2>세례의 구약적 예표</h2><h3>할례</h3><p>구약의 할례는 신약 세례의 예표입니다:</p><blockquote><p>“여러분은 세속적인 육체를 벗어 버리고 그리스도와 하나가 되어 <strong>형식이 아닌 진정한 할례 그리스도의 할례를 받았습니다</strong>. 여러분은 <strong>그리스도의 할례, 곧 세례를 그리스도와 함께 묻혔고</strong> 또 그리스도와 함께 다시 살아났습니다. 그리스도를 죽은 자들 가운데서 다시 살리신 하느님의 능력을 믿었기 때문입니다.” (<a href="https://bibleox.com/ko/ko-ctb/kol/2/#L11-12">골로 2:11-12</a>)</p></blockquote><p>구약의 할례 제정. 할례는 하느님과의 계약에 들어가는 일이었고, 아기들은 난 지 8일째에 들어갔습니다:</p><blockquote><p>“너희 남자들은 모두 할례를 받아라. 이것이 너와 네 후손과 나 사이에 세운 내 계약으로서 너희가 지켜야 할 일이다. 너희는 포경을 베어 할례를 베풀어야 한다. 이것이 <strong>나와 너희 사이에 세운 계약의 표다</strong>. <strong>대대로 너희 모든 남자는 난 지 팔 일만에 할례를 받아야 한다</strong>. 네 후손이 아닌, 네 집에서 난 씨종이나 외국인에게서 돈 주고 산 종이라도 할례를 받아야 한다.” (<a href="https://bibleox.com/ko/ko-ctb/gen/17/#L10-12">창 17:10-12</a>)</p></blockquote><h3>바다 밑을 지나 종살이에서 나옴</h3><p>히브리인들이 홍해 바닥을 지나 이집트의 종살이에서 나온 일은 신약 세례의 예표입니다. 온 백성이 종살이에서 나왔고, 젖먹이를 포함한 온 백성이 모세 안으로 세례를 받았습니다:</p><blockquote><p>“형제 여러분, 여러분은 다음과 같은 사실을 꼭 기억해 두셔야 하겠습니다. 모세 때에 우리 조상들은 <strong>구름의 인도를 받았고 모두가 홍해를 무사히 건넜습니다. 말하자면 그들은 모두 구름과 바다 속에서 세례를 받아 모세의 사람들이 되었던 것입니다</strong>. 그들은 모두 똑같은 영적 양식을 먹었고 또 똑같은 영적 음료를 마셨습니다. 그들의 동반자인 영적 바위에서 나오는 물을 마셨다는 말입니다. 그 바위는 곧 그리스도였습니다.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/10/#L1-4">1고린 10:1-4</a>)</p></blockquote><p>이 예표들은 직접적인 의미가 있습니다:</p><blockquote><p>“그들이 이런 일들을 당함으로써 다른 사람들에게는 경고가 되었으며 그것이 기록에 남아서 이제 세상의 종말을 눈앞에 둔 <strong>우리에게는 교훈이 되었습니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/10/#L11">1고린 10:11</a>)</p></blockquote><h2>피의 세례</h2><p>피의 세례는 그리스도를 위한 순교의 죽음입니다. 이것은 지하드나 자살 공격이 아닙니다. 순교자는 살기를 바라고 누구의 생명도 위협하지 않습니다. 다만 그리스도를 믿는다는 이유로 생명을 빼앗깁니다. 이런 사람들은 물의 세례 없이도 구원만이 아니라 하늘에서 그리스도와 함께하는 특별한 영광에 이릅니다.</p><h3>그리스도께서는 다가오는 고난과 죽음을 세례라고 말씀하십니다</h3><blockquote><p>“그래서 예수께서 그 형제들에게 ‘너희가 청하는 것이 무엇인지나 알고 있느냐? 내가 마실게 될 잔을 너희도 마실 수 있느냐?’ 하고 물으셨다. 그들이 ‘마실 수 있습니다’ 하고 대답하자 예수께서는 다시 이렇게 말씀하셨다. ‘너희도 내 잔을 마시게 될 것이다. 그러나 내 오른편과 내 왼편 자리에 앉는 특권은 내가 주는 것이 아니다. 그 자리에 앉을 사람들은 내 아버지께서 미리 정해 놓으셨다.’” (<a href="https://bibleox.com/ko/ko-ctb/mf/20/#L22-23">마태 20:22-23</a>; <a href="https://bibleox.com/ko/ko-ctb/mk/10/#L38">마르 10:38</a>) <em>(비잔틴 본문(다수 사본)의 마태오와 마르코에는 “<strong>내가 받는 세례를</strong>” 받을 수 있느냐는 말씀이 있습니다.)</em></p></blockquote><h3>그리스도 때문에 죽임을 당한 이들은 하늘에서 흰 옷을 받습니다</h3><blockquote><p>“어린 양이 다섯째 봉인을 떼셨을 때에 나는 <strong>하느님의 말씀 때문에 그리고 그 말씀을 증언했기 때문에 죽임을 당한 사람들의 영혼이 제단 아래</strong> 자리잡고 있는 것을 보았습니다. 그들은 큰 소리로 ‘거룩하시고 진실하신 대왕님, 우리가 얼마나 더 오래 기다려야 땅 위에 사는 자들을 심판하시고 또 우리가 흘린 피의 원수를 갚아 주시겠습니까?’하고 부르짖었습니다. 또 그들은 <strong>흰 두루마기 한 벌씩을 받았습니다</strong>. 그리고 그들처럼 죽임을 당하기로 되어 있는 동료 종들과 형제들이 다 죽어서 그 수가 찰 때까지 잠시 쉬라는 분부를 받았습니다.” (<a href="https://bibleox.com/ko/ko-ctb/otkr/6/#L9-11">묵시 6:9-11</a>)</p></blockquote><p>그리스어로 순교자는 μάρτυς(증인)라고 합니다. 순교자들은 행동으로 그리스도와 부활에 대한 굳은 믿음을 증언하며, 이것이 흔히 다른 이들이 그리스도를 믿게 되는 계기가 되었습니다.</p><h3>순교자와 박해에 관한 그리스도의 말씀</h3><blockquote><p>“‘<strong>누구든지 사람들 앞에서 나를 안다고 증언하면 나도 하늘에 계신 내 아버지 앞에서 그를 안다고 증언하겠다</strong>. 그러나 누구든지 사람들 앞에서 나를 모른다고 하면 나도 하늘에 계신 내 아버지 앞에서 그를 모른다고 하겠다.’” (<a href="https://bibleox.com/ko/ko-ctb/mf/10/#L32-33">마태 10:32-33</a>)</p></blockquote><blockquote><p>“‘잘 들어라. <strong>누구든지 사람들 앞에서 나를 안다고 증언하면 사람의 아들도 하느님의 천사들 앞에서 그를 안다고 증언하겠다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/lk/12/#L8">루가 12:8</a>)</p></blockquote><blockquote><p>“<strong>옳은 일을 하다가 박해를 받는 사람은 행복하다. 하늘 나라가 그들의 것이다</strong>. <strong>나 때문에 모욕을 당하고 박해를 받으며 터무니없는 말로 갖은 비난을 다 받게 되면</strong> 너희는 행복하다. 기뻐하고 즐거워하여라. <strong>너희가 받을 큰 상이 하늘에 마련되어 있다</strong>. 옛 예언자들도 너희에 앞서 같은 박해를 받았다.‘” (<a href="https://bibleox.com/ko/ko-ctb/mf/5/#L10-12">마태 5:10-12</a>)</p></blockquote><h2>세례 뒤에도 믿는 이들은 죄를 지을 수 있으며 자기 안의 죄와 싸워야 합니다</h2><blockquote><p>“우리가 가르침을 받아서 <strong>진리를 깨닫고도 짐짓 죄를 짓는다면</strong> 다시는 우리 죄를 용서받기 위해서 드릴 수 있는 제물이 없고” (<a href="https://bibleox.com/ko/ko-ctb/evr/10/#L26">히브 10:26</a>)</p></blockquote><blockquote><p>“<strong>만일 우리가 죄없는 사람이라고 말한다면 우리는 자신을 속이는 것이고</strong> 진리를 저버리는 것이 됩니다. 그러나 우리가 우리의 죄를 하느님께 고백하면 진실하시고 의로우신 하느님께서는 우리의 죄를 용서하시고 우리의 모든 불의를 깨끗이 씻어 주실 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/1in/1/#L8-9">1요한 1:8-9</a>)</p></blockquote><blockquote><p>“나는 믿음의 자녀인 여러분이 <strong><mark>죄를 짓지 않게 하려고 여러분에게 이 편지를 씁니다</mark></strong>. 그러나 혹 누가 죄를 짓더라도 아버지 앞에서 우리를 변호해 주시는 분이 계십니다. 그분은 의로우신 예수 그리스도이십니다.” (<a href="https://bibleox.com/ko/ko-ctb/1in/2/#L1">1요한 2:1</a>)</p></blockquote><blockquote><p>“<strong><mark>여러분은 무엇 때문에 서로 싸우고 분쟁을 일으킵니까</mark></strong>? 여러분의 지체 안에서 갈등을 일으키는 욕정에서 나오는 것이 아닙니까?” (<a href="https://bibleox.com/ko/ko-ctb/iak/4/#L1">야고 4:1</a>)</p></blockquote><blockquote><p>“여러분 가운데 앓는 사람이 있으면 그 사람은 <strong>교회의 원로들을 청하십시오</strong>. 원로들은 주님의 이름으로 그에게 기름을 바르고 그를 위하여 기도해 주어야 합니다. <strong>믿고 구하는 기도는 앓는 사람을 낫게 할 것이며</strong> 주님께서 그를 일으켜 주실 것입니다. 또 <strong><mark>그가 지은 죄가 있으면 그 죄도 용서를 받을 것입니다</mark></strong>. 그러므로 여러분은 서로 죄를 고백하고 <strong>서로 남을 위하여 기도하십시오. 그러면 모두 온전해질 것입니다. 올바른 사람의 간구는 큰 효과를 나타냅니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/iak/5/#L14-16">야고 5:14-16</a>)</p></blockquote><blockquote><p>“<strong><mark>정신을 똑바로 차리고 죄를 짓지 마십시오</mark></strong>. 여러분 중에는 <strong>하느님을 모르는 사람이 있어서</strong> 부끄러운 줄을 알라고 이런 말을 하는 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/15/#L34">1고린 15:34</a>)</p></blockquote><blockquote><p>“여러분은 서로 너그럽게 따뜻하게 대해 주며 하느님께서 그리스도를 통해서 여러분을 용서하신 것처럼 <strong><mark>서로 용서하십시오</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/ef/4/#L32">에페 4:32</a>)</p></blockquote><p>끝으로 주 예수 그리스도께서는 제자들에게 죄의 용서를 청하라고 가르치시는 기도를 주십니다. 이것은 평생 한 번 하는 기도가 아닙니다. 제자들이 기도를 가르쳐 달라고 청하자 그리스도께서 이 틀을 주셨습니다:</p><blockquote><p>“예수께서 하루는 어떤 곳에서 기도를 하고 계셨다. 기도를 마치셨을 때 제자 하나가 ‘주님, 요한이 자기 제자들에게 가르쳐 준 것같이 저희에게도 기도를 가르쳐 주십시오’하고 말하였다. 예수께서는 이렇게 가르쳐 주셨다. ‘<strong><mark>너희는 기도할 때 이렇게 하여라</mark></strong>. 아버지, 온 세상이 아버지를 하느님으로 받들게 하시며 아버지의 나라가 오게 하소서. 날마다 우리에게 필요한 양식을 주시고 우리가 우리에게 잘못한 이를 용서하오니 <strong><mark>우리의 죄를 용서하시고</mark></strong> 우리를 유혹에 빠지지 않게 하소서.’” (<a href="https://bibleox.com/ko/ko-ctb/lk/11/#L1-4">루가 11:1-4</a>; <a href="https://bibleox.com/ko/ko-ctb/mf/6/#L7-13">마태 6:7-13</a>)</p></blockquote><h2>비판</h2><h3>물과 성령으로 남(요한 3:5)이라는 말씀에서 물은 성령을 뜻하는가?</h3><p>신개신교인들은 구원을 위해 물과 성령으로 나야 한다는 구세주의 말씀을 비유로 풀이하여 물이 성령을 뜻한다고 말합니다. 그들은 다음 두 구절을 연결합니다:</p><blockquote><p>“정말 잘 들어 두어라. <strong><mark>물과 성령으로 새로 나지</mark></strong> 않으면 아무도 하느님 나라에 들어 갈 수 없다.” (<a href="https://bibleox.com/ko/ko-ctb/in/3/#L5">요한 3:5</a>)</p></blockquote><blockquote><p>“나를 믿는 사람은 성서의 말씀대로 그 속에서 <strong><mark>샘솟는 물이 강물처럼 흘러 나올 것이다.‘ 이것은 예수께서 당신을 믿는 사람들이 받을 성령을 가리켜 하신 말씀이었다</mark></strong>. 그 때는 예수께서 영광을 받지 않으셨기 때문에 성령이 아직 사람들에게 와 계시지 않으셨던 것이다.” (<a href="https://bibleox.com/ko/ko-ctb/in/7/#L38-39">요한 7:38-39</a>)</p></blockquote><p>그러나 물을 성령으로 이해하면 동어반복이 됩니다. 그리스도께서 성령과 성령으로 나야 한다고 말씀하신 셈이 되기 때문입니다. 이 말씀에서 성령을 직접 말하는 것이 합당했다면 왜 비유까지 쓰시겠습니까? 비유라 해도 “성령의 물로” 또는 “물 <strong>곧</strong> 성령으로”라고 해야 했을 것입니다. 그러나 실제로는 성령으로 <strong>그리고</strong> 다른 것, 곧 물로 나야 한다고 되어 있습니다.</p><p>게다가 성경에서도 알 수 있듯이 사도들은 글자 그대로 물속에서 거듭나게 했습니다. 세례의 물은 언제나 실제의 물이었지만, 뱃속에서 강물이 (글자 그대로) 흘러나온 사람은 없습니다.</p><p>그러므로 사도들이 물로 세례를 베풀었고 세례가 성령으로 이루어졌으니, 우리는 물과 성령으로 난다는 구세주의 말씀을 사도들이 행한 방식에 적용하여 이해합니다. 곧 이 이해는 물로 세례를 베푼 사도들의 실천과 객관적으로 연결되어 있습니다. 옛 교회는 세례를 물 없이 순전히 생각으로만 이해한 적이 없고, 아버지와 아들과 성령의 이름을 부르며 축성된 물에 세 번 잠기는 것으로 이해했습니다.</p><h3>세례를 받으려면 회개해야 하는데 유아는 회개할 수 없으니 세례를 받을 수 없는가?</h3><p>교회에서 떨어져 나간 일부 단체는 교회가 유아를 세례에 받아들인다고 비난합니다. 그들은 사도가 듣는 이들에게 먼저 회개하고 세례를 받으라고 부르는 구절을 가리킵니다:</p><blockquote><p>“베드로가 이렇게 대답하였다. ‘<strong>회개하시오</strong>. 그리고 여러분은 <strong>한 사람도 빠짐없이 예수 그리스도의 이름으로 세례를 받고</strong> 여러분의 죄를 용서받으시오. 그리하면 성령을 선물로 받게 될 것입니다. 이것은 우리 주 하느님께서 여러분과 여러분의 자녀와 그리고 멀리 떨어져 있는 사람들, 곧 하느님께서 부르시는 모든 사람들에게 하신 약속입니다.’” (<a href="https://bibleox.com/ko/ko-ctb/act/2/#L38-39">사도 2:38-39</a>)</p></blockquote><p>회개의 요구는 어른들에 관한 것입니다. 유아에게는 개인적인 죄가 없으므로 회개의 요구를 적용하기 어렵습니다. 곧 유아는 세례를 받아야 하지만, 개인적인 죄가 없으니 없는 것을 회개할 필요도 없습니다.</p><p>이 비난은 대체로 몹시 이상하게 들립니다. 그 말대로라면 유아가 그리스도를 입으려면(세례를 받으려면, <a href="https://bibleox.com/ko/ko-ctb/gal/3/#L27">갈라 3:27</a>) 먼저 죄를 지어야 하고, 죄를 짓기 전에는 회개할 수 없으니 세례를 받을 수 없습니다. 그리스도와 결합될 가능성을 얻으려면 먼저 그리스도께 죄를 지어야 한다는 불합리한 결론이 나옵니다. 물론 이것은 큰 잘못입니다. 세례는 모두에게 필요하지만 회개는 죄를 지은 이들에게만 필요합니다.</p><p>예언자 요한의 회개의 세례는 그리스도 안으로 받는 세례와 같지 않지만(<a href="https://bibleox.com/ko/ko-ctb/act/19/#L4">사도 19:4</a>) 이 논증이 옳음을 확인하게 해 줍니다. 예언자 요한은 회개의 세례를 베풀었는데, 그리스도께서 오시자 회개 없이 바로 물에 들어가십니다. 그리스도께는 죄가 없으므로 회개 없이 회개의 세례를 받으십니다. 유아도 마찬가지입니다. 그리스도께서 회개의 세례를 받기 위해 죄를 얻으실 필요가 없었듯이 유아도 그렇습니다. 모두가 세례로 부름받지만, 회개할 것이 있는 사람만 회개합니다.</p><h3>세례를 받으려면 믿음이 필요한데 유아는 믿음을 고백할 수 없으니 세례를 받을 수 없는가?</h3><p>교회에서 떨어져 나간 단체들은 주님께서 믿고 세례를 받으라고 말씀하시는 다른 구절도 가리킵니다:</p><blockquote><p>“<strong>믿고 세례를 받는 사람은</strong> 구원을 받겠지만 믿지 않는 사람은 단죄를 받을 것이다.” (<a href="https://bibleox.com/ko/ko-ctb/mk/16/#L16">마르 16:16</a>)</p></blockquote><p>곧 구원의 필수 조건 가운데에는 <strong>믿음</strong>을 얻는 것과 <strong>세례</strong>를 받는 것이 있습니다. 이 조건을 이루지 않으면 사람은 구원받을 수 없습니다. 그러나 믿음의 요구를 유아에게 적용하기는 어려우므로, 유아는 대부모의 믿음을 통해 세례를 받으며, 여기에도 성경의 근거가 있습니다(<a href="#HH-다른-사람들의-믿음을-통한-하느님-은총의-활동">자세히</a>).</p><p>믿지 않는 사람은 단죄를 받는다는 말씀에도 특별히 주의해야 합니다. 그렇다면 믿을 수 없는 유아는 단죄를 받는다는 말이 됩니까?</p><blockquote><p>“믿고 세례를 받는 사람은 구원을 받겠지만 <strong>믿지 않는 사람은 단죄를 받을 것이다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/mk/16/#L16">마르 16:16</a>)</p></blockquote><p>요점은 이 구절의 믿음 요구가 어른들에게만 해당한다는 것입니다. 세례 자체는 구세주께서 다른 곳에서 말씀하셨듯이(<a href="https://bibleox.com/ko/ko-ctb/in/3/#L3,5-6">요한 3:3,5-6</a>) 유아를 포함한 모두에게 필요합니다. 유아는 대부모의 믿음을 통해(<a href="#HH-다른-사람들의-믿음을-통한-하느님-은총의-활동">자세히</a>) 세례로 그리스도를 입은 채(<a href="https://bibleox.com/ko/ko-ctb/gal/3/#L27">갈라 3:27</a>) 자랄 것입니다. 능력이 자라는 대로 대부모가 믿음 안에서 그를 굳건하게 할 것입니다. 만일 불행히도 유아가 비극적으로 죽는다면, 세례받은 사람으로서 하늘 나라와 그리스도와 함께하는 영원한 삶에 이릅니다.</p><p>구세주 말씀의 순서(믿고 세례를 받음)에 관해 말하자면 반대 순서도 있습니다:</p><blockquote><p>“<strong>세례자 요한이 광야에 나타나</strong> ‘회개하고 세례를 받아라. 그러면 죄를 용서받을 것이다.’ 하고 선포하였다.” (<a href="https://bibleox.com/ko/ko-ctb/mk/1/#L4">마르 1:4</a>) <em>(비잔틴 본문(다수 사본): “요한은 광야에서 <strong>세례를 베풀며</strong> 회개의 세례를 <strong>선포했다</strong>.”)</em></p></blockquote><p>그렇다면 여기서도 회개의 세례를 먼저 주고 그 다음에 선포를 들었다고 인정해야 할 것입니다.</p><h3>그리스도께서는 서른 살에야 세례를 받으시지 않았는가?</h3><p>예언자 세례자 요한의 세례는 그리스도 안으로 받는 세례가 아닙니다. 사도 바울로는 이미 요한의 세례를 받은 이들에게 그리스도 안으로 다시 세례를 베풀었습니다:</p><blockquote><p>“당신들이 신도가 되었을 때 성령을 받았습니까?‘하고 물어 보았다. 그랬더니 그들은 ’우리는 성령이라는 것이 있다는 말조차 들어 보지 못하였습니다‘하고 대답하였다. 바울로가 ’<strong>그러면 당신들은 어떤 세례를 받았습니까</strong>?‘하고 다시 묻자 그들은 ’<strong>요한의 세례를 받았습니다</strong>‘하고 대답하였다. 이 때 바울로는 다음과 같이 일러 주었다. ’<strong>요한은 사람들에게 죄를 회개한 표시로 세례를 베풀었습니다</strong>. 그러나 요한은 자기 뒤에 오실 분 곧 예수를 믿으라고 사람들에게 가르쳤던 것입니다.‘ 그들은 이 말을 듣고 <strong>주 예수의 이름으로 세례를 받았다. 바울로가 그들에게 손을 얹자 성령께서 그들에게 내리셨다</strong>. 그러자 그들은 이상한 언어로 말을 하고 예언을 하기 시작하였다.” (<a href="https://bibleox.com/ko/ko-ctb/act/19/#L2-6">사도 19:2-6</a>)</p></blockquote><p>게다가 이런 비난을 그리스도를 이 점에서 본받지 않는 사람들에게서 듣는 것은 이상합니다. 그들은 서른 살에 세례를 받지 않고, 자녀들에게도 유아 때는 아니지만 서른 살을 기다리지 않고 8~12세에 세례를 줍니다. 세례 받는 나이에서 그리스도(요한에게서 받으신 세례)를 본받아야 한다고 믿는다면, 비난하는 사람은 세례를 받기 위해 서른 살까지 기다려야 할 것입니다. 그러나 이것은 틀렸습니다. 예언자 요한의 회개의 세례는 그리스도 안으로 받는 세례가 아니기 때문입니다(<a href="https://bibleox.com/ko/ko-ctb/act/19/#L2-6">사도 19:2-6</a>). 그리스도께서 서른 살까지 기다리신 것은 세례를 받기 위해서가 아니라 공적 활동에 나서기 위해서입니다(<a href="https://bibleox.com/ko/ko-ctb/chis/4/#L3">민 4:3</a>). 곧 설교하고 당신의 영광을 드러내시기 위해서입니다. 그분의 설교는 예언자 요한의 증언으로 시작되었습니다. 요한은 세례를 받으러 온 예수를 그리스도라고 가리킵니다. 요한은 예언자입니다. 그는 구세주의 오심에 관한 예언의 성취를 언제 가리키겠습니까? 구세주께서 공적 활동에 나설 준비가 되셨을 때, 곧 서른 살에 가리킵니다(<a href="https://bibleox.com/ko/ko-ctb/chis/4/#L3">민 4:3</a>).</p><h3>지혜로운 강도는 세례를 받지 못했지만 구원받지 않았는가?</h3><p>이것은 주님께서 아직 세례성사를 제정하시기 전의 일입니다. 믿고 회개한 강도는 물의 세례 없이 구원받았습니다. 구약의 의인들이 신약 교회가 세워지기 전에 구원받은 것과 같습니다. 신약 교회는 그리스도께서 십자가에 못박히신 뒤 52일(2+40+10)이 지나서야 나타납니다.</p><p><strong>세례는 물과 성령으로 나는 것입니다</strong></p><blockquote><p>“정말 잘 들어 두어라. <strong><mark>물과 성령으로 새로 나지 않으면 아무도 하느님 나라에 들어 갈 수 없다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/in/3/#L5">요한 3:5</a>)</p></blockquote><p><strong>그리스도께서 성령으로 세례를 베푸실 것입니다</strong></p><blockquote><p>“그러나 요한은 모든 사람에게 이렇게 말하였다. ‘나는 너희에게 물로 세례를 베풀지만 이제 멀지 않아 <strong><mark>성령과 불로 세례를 베푸실 분이 오신다</mark></strong>. 그분은 나보다 더 훌륭한 분이어서 나는 그분의 신발끈을 풀어 드릴 자격조차 없다.” (<a href="https://bibleox.com/ko/ko-ctb/lk/3/#L16">루가 3:16</a>; <a href="https://bibleox.com/ko/ko-ctb/mf/3/#L11">마태 3:11</a>; <a href="https://bibleox.com/ko/ko-ctb/mk/1/#L8">마르 1:8</a>)</p></blockquote><p><strong>그리스도께서 떠나시기 전에는 성령께서 오시지 않습니다</strong></p><blockquote><p>“그러나 사실은 내가 떠나 가는 것이 너희에게는 더 유익하다. <strong><mark>내가 떠나 가지 않으면 그 협조자가 너희에게 오시지 않을 것이다</mark></strong>. 그러나 내가 가면 그분을 보내겠다.” (<a href="https://bibleox.com/ko/ko-ctb/in/16/#L7">요한 16:7</a>; <a href="https://bibleox.com/ko/ko-ctb/in/14/#L16">요한 14:16</a>; <a href="https://bibleox.com/ko/ko-ctb/in/14/#L26">요한 14:26</a>; <a href="https://bibleox.com/ko/ko-ctb/in/7/#L38-39">요한 7:38-39</a>)</p></blockquote><blockquote><p>“<strong><mark>내가 아버지께 청하여 너희에게 보낼 협조자</mark></strong> 곧 아버지께로부터 나오시는 진리의 성령이 오시면 그분이 나를 증언할 것이다.” (<a href="https://bibleox.com/ko/ko-ctb/in/15/#L26">요한 15:26</a>)</p></blockquote><blockquote><p>“나는 내 아버지께서 약속하신 것을 너희에게 보내 주겠다. 그러니 너희는 <strong>위에서 오는 능력을 받을 때까지 예루살렘에 머물러 있어라</strong>‘하고 말씀하셨다.” (<a href="https://bibleox.com/ko/ko-ctb/lk/24/#L49">루가 24:49</a>)</p></blockquote><p><strong>부활 뒤에도 그리스도께서는 아직 아버지께 올라가지 않으셨습니다</strong></p><blockquote><p>“예수께서는 마리아에게 ‘<strong><mark>내가 아직 아버지께 올라 가지 않았으니</mark></strong> 나를 붙잡지 말고 어서 내 형제들을 찾아 가거라. 그리고 나는 내 아버지이며 너희의 아버지 곧 내 하느님이며 너희의 하느님이신 분께 올라 간다고 전하여라’하고 일러 주셨다.” (<a href="https://bibleox.com/ko/ko-ctb/in/20/#L17">요한 20:17</a>)</p></blockquote><p><strong>약속된 성령 세례는 그리스도 부활 후 50일째에 처음으로 이루어졌습니다</strong></p><blockquote><p>“이 책을 데오필로님께 드린다. 나는 먼젓번 책에서 예수의 모든 행적과 가르치심을 다 기록하였다. 곧 예수께서 당신이 뽑으신 사도들에게 성령의 힘으로 여러 가지 지시를 내리신 다음 승천하신 그 날까지의 일을 시초에서부터 낱낱이 기록하였다. 예수께서는 돌아 가신 뒤에 다시 살아나셔서 <strong><mark>사십 일 동안 사도들에게 자주 나타나시어</mark></strong> 여러 가지 확실한 증거로써 당신이 여전히 살아 계시다는 것을 보여 주시며 하느님 나라에 관한 말씀을 들려 주셨다. 예수께서는 사도들과 함께 계신 자리에서 이렇게 말씀하셨다. ‘<strong><mark>너희는 예루살렘을 떠나지 말고 내가 전에 일러 준 아버지의 약속을 기다려라. 요한은 물로 세례를 베풀었지만 오래지 않아 너희는 성령으로 세례를 받게 될 것이다</mark></strong>.’ &lt;…&gt; 그러나 성령이 너희에게 오시면 너희는 힘을 받아 예루살렘과 온 유다와 사마리아뿐만 아니라 땅 끝에 이르기까지 어디에서나 나의 증인이 될 것이다.‘ 예수께서는 이 말씀을 하시고 사도들이 보는 앞에서 승천하셨는데 마침내 구름에 싸여 그 모습이 보이지 않게 되셨다.” (<a href="https://bibleox.com/ko/ko-ctb/act/1/#L1-5,8-9">사도 1:1-5,8-9</a>)</p></blockquote><blockquote><p>“<strong>마침내 오순절이 되어</strong> 신도들이 모두 한 곳에 모여 있었는데 &lt;…&gt; 그러자 <strong><mark>혀 같은 것들이 나타나 불길처럼 갈라지며 각 사람 위에 내렸다. 그들의 마음은 성령으로 가득 차서</mark></strong> 성령이 시키시는 대로 여러 가지 외국어로 말을 하기 시작하였다.” (<a href="https://bibleox.com/ko/ko-ctb/act/2/#L1,3-4">사도 2:1,3-4</a>)</p></blockquote><p>그러나 그리스도 부활 당일에도 성령의 파견이 언급되지만 세례는 언급되지 않습니다. 이것은 죄를 용서하고 그대로 두는 권한을 주심과 함께 사제 품계를 세우신 일이었습니다:</p><blockquote><p>“<strong>안식일 다음 날 이른 새벽</strong>의 일이었다. 아직 어두울 때에 막달라 여자 마리아가 무덤에 가 보니 무덤을 막았던 돌이 이미 치워져 있었다. &lt;…&gt; <strong>안식일 다음 날 저녁에</strong> 제자들은 유다인들이 무서워서 어떤 집에 모여 문을 모두 닫아 걸고 있었다. 그런데 <strong>예수께서 들어 오셔서</strong> 그들 한 가운데 서시며 ‘너희에게 평화가 있기를!’하고 인사하셨다. &lt;…&gt; 이렇게 말씀하신 다음 예수께서는 그들에게 <strong>숨을 내쉬시며 말씀을 계속하셨다. ‘성령을 받아라</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/in/20/#L1,19,22">요한 20:1,19,22</a>)</p></blockquote><h3>“어린이들이 그리스도께 오는 것을 막지 말라”</h3><p>교회에서 떨어져 나간 단체들은 세례 없이는 구원이 불가능하다는 교회의 가르침(<a href="https://bibleox.com/ko/ko-ctb/in/3/#L3,5-6">요한 3:3,5-6</a>)이 유아의 구원을 가로막는다고 비난합니다. 교회가 유아들을 그리스도께 가지 못하게 한다는 것입니다. 그들은 다음 구절을 듭니다:</p><blockquote><p>“사람들이 <strong>어린아기들을 예수께 데리고 와서</strong> 손을 얹어 축복해 주시기를 청하였다. 이것을 본 제자들이 그들을 나무라자 예수께서는 어떤 아기들을 가까이 오게 하시고 제자들에게 이렇게 말씀하셨다. ‘<strong>어린이들이 나에게 오는 것을 막지 말고 그대로 두어라</strong>. 하느님 나라는 이 어린이들과 같은 사람들의 것이다.” (<a href="https://bibleox.com/ko/ko-ctb/lk/18/#L15-16">루가 18:15-16</a>)</p></blockquote><p>사실 이 구절은 바로 유아 세례 반대자들을 드러냅니다.</p><p>이 성경의 장면에서 글자 그대로 무슨 일이 일어납니까?</p><ol><li><p><strong>어머니들이 아기들을 그리스도께 데려옵니다.</strong> 주님께서 축복해 주시기를 바라서입니다;</p></li><li><p><strong>제자들이 어머니들의 길을 막습니다.</strong> 아기들을 그리스도께 데려오지 못하게 합니다;</p></li><li><p><strong>주님께서 어머니들에게 길을 열어 주십니다.</strong> 제자들에게 아기들을 데려오는 것을 막지 말라고 하시고 아기들을 축복하십니다(<a href="https://bibleox.com/ko/ko-ctb/mk/10/#L16">마르 10:16</a>).</p></li></ol><p>교회의 반대자들은 무엇을 합니까?</p><ol><li><p>어머니들은 아기를 태어날 때부터 그리스도와 결합시키고 싶어 합니다(이단에서 나온 어머니들에게서 직접 들어 압니다);</p></li><li><p>교회의 반대자들은 어머니들의 길을 막고, 성경이 그리스도를 입는 것이라고 부르는 세례를 글자 그대로 금합니다(<a href="https://bibleox.com/ko/ko-ctb/gal/3/#L27">갈라 3:27</a>).</p></li></ol><p>교회는 무엇을 합니까?</p><ol><li><p>어머니들을 아기들과 함께 그리스도께 부릅니다;</p></li><li><p>어머니들이 아기들을 데려오면 교회는 세례와 성체성혈성사와 성물을 통해 아기들을 그리스도와 결합시키고 축복합니다.</p></li></ol><p>교회의 반대자들은 모든 것을 거꾸로 뒤집습니다. 어머니와 아기를 그리스도께 부르는 교회의 초대를 그리스도와의 결합을 막는 것이라 하고, 어머니들이 아기에게 세례를 주지 못하게 하는 자기들의 금지를 어린이들이 그리스도께 오는 것을 “막지 않는 것”이라고 합니다.</p><p>유아가 세례 없이 구원받는다면 교회의 가르침은 그리스도께서 유아를 구원하시는 것을 조금도 막지 못합니다. 그러나 세례 없이는 아무도 하느님 나라에 들어갈 수 없다고 그리스도께서 말씀하셨으니(<a href="https://bibleox.com/ko/ko-ctb/in/3/#L3,5-6">요한 3:3,5-6</a>), 유아 세례를 금하는 이단자들의 금지는 유아의 구원을 크게 가로막습니다.</p><h3>죄의 용서는 물에 잠길 때가 아니라 믿음을 얻을 때 이루어지는가?</h3><p>많은 신개신교인은 물의 세례를 증언(일종의 표지)일 뿐이라고 하고, 사람의 거듭남과 죄의 용서는 그보다 먼저, 곧 사람이 믿고 하느님께 죄를 사과하자마자 이루어진다고 생각합니다. 그러나 성경을 보면 사람이 거듭나고 죄가 씻기는 것은 바로 물의 세례에서이며, 바로 이것이 사람을 구원합니다.</p><p>사울(훗날의 사도 바울로)은 그리스도께 눈이 멀고 곧바로 그분을 <strong>믿지만</strong>, 이것으로 죄가 용서받지는 않습니다. 사울은 물의 세례를 받아 죄를 씻으려고 다마스커스로 보내집니다:</p><blockquote><p>“나는 주님, 누구십니까? 하고 물었습니다. 그랬더니 나는 네가 박해하는 나자렛 예수다 하는 대답이 들려 왔습니다. &lt;…&gt; <strong><mark>주님, 제가 어떻게 하면 좋겠습니까</mark></strong>? 내가 이렇게 물었더니 주께서는 일어나서 <strong>다마스커스로 들어 가거라</strong>. 거기에 가면 네가 해야 할 일을 모두 일러 줄 사람이 있을 것이다 하고 말씀하셨습니다. 나는 그 눈부신 빛 때문에 앞을 못 보게 되어 같이 가던 사람들의 손에 이끌려 다마스커스로 들어 갔습니다. 거기에는 아나니아라는 사람이 있었습니다. 그는 율법을 잘 지키는 경건한 사람이었고 거기에 사는 모든 유다인들에게 존경을 받고 있었습니다. 그가 나를 찾아 와 곁에 서서 사울 형제, 눈을 뜨시오 하고 나에게 말하였습니다. 그 순간 나는 눈이 띄어 그를 보게 되었습니다.” (<a href="https://bibleox.com/ko/ko-ctb/act/22/#L8,10-13">사도 22:8,10-13</a>)</p></blockquote><p>믿는 사울은 세례를 통해 죄를 씻어야 합니다:</p><blockquote><p>“그러니 망설이지 말고 어서 일어나 그분의 이름을 부르며 <strong><mark>세례를 받고 죄를 깨끗이 씻어 버리시오</mark></strong>.‘” (<a href="https://bibleox.com/ko/ko-ctb/act/22/#L16">사도 22:16</a>)</p></blockquote><p>다른 곳에서는 세례가 (증언만 하는 것이 아니라) 구원한다고 직접 말합니다:</p><blockquote><p>“그것은 오늘날 여러분에게 <strong><mark>구원을 가져다 주는 세례</mark></strong>를 미리 보여 준 것입니다. 세례는 몸에서 더러운 때를 벗기는 것이 아니라 깨끗한 양심으로 살겠다고 하느님께 서약을 하는 것이며 예수 그리스도의 부활로써 이루어지는 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/1pet/3/#L21">1베드 3:21</a>; <a href="https://bibleox.com/ko/ko-ctb/tit/3/#L5">디도 3:5</a>)</p></blockquote><h3>사람은 그리스도에 관한 설교로 영적으로 태어나는가?</h3><p>성사 안에서의 하느님의 활동을 거부하는 신개신교인들은 세례의 물에서 일어나는 사람의 영적 탄생도 부정합니다. 그들은 “물과 성령으로” 나는 일(<a href="https://bibleox.com/ko/ko-ctb/in/3/#L3,5">요한 3:3,5</a>)이 설교를 듣는 순간에만 일어나고 나머지는 장엄한 상징 의식일 뿐이라고 가르칩니다. 이를 뒷받침하려고 이런 구절을 듭니다:</p><blockquote><p>“하느님께서는 뜻을 정하시고 <strong>진리의 말씀으로 우리를 낳으셨습니다</strong>. 그래서 우리는 모든 피조물의 첫 열매가 된 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/iak/1/#L18">야고 1:18</a>)</p></blockquote><blockquote><p>“여러분은 <strong>새로 난 사람들입니다</strong>. 그것도 썩어 없어질 씨앗에서 난 것이 아니라 썩지 않을 씨앗 곧 영원히 살아 계시는 <strong>하느님의 말씀을 통해서 났습니다</strong>. 모든 인간은 풀과 같고 인간의 영광은 풀의 꽃과 같다. 풀은 마르고 꽃은 떨어지지만 주님의 말씀은 영원히 살아있다‘ <strong>여러분에게 전해진 복음이 바로 이 말씀입니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/1pet/1/#L23-24">1베드 1:23-24</a>)</p></blockquote><p>하느님께서는 듣는 이의 영혼에 작용하시어 교회의 복음 선포를 도우십니다. 이 설교는 사람에게 전환을 일으켜 회개로 부르고 생명의 길에 세울 수 있습니다. 하느님의 말씀은 사람을 죄의 잠에서 깨우고 회개를 일으키고 믿음을 낳는 수단입니다[1]. 그러나 이 설교가 아직 사람을 죄에서 깨끗하게 하지는 않으며, 물로 새로 나게 하는 씻음에서 이루어지는 물과 성령의 영적 탄생(<a href="https://bibleox.com/ko/ko-ctb/in/3/#L3,5">요한 3:3,5</a>)을 주지도 않습니다(<a href="https://bibleox.com/ko/ko-ctb/ef/5/#L25-26">에페 5:25-26</a>; <a href="https://bibleox.com/ko/ko-ctb/tit/3/#L5">디도 3:5</a>).</p><p>다른 곳에서는 죄의 용서를 위해 물에서 거행되는 세례성사를 받아야 한다고 분명히 말합니다:</p><blockquote><p>“그러니 망설이지 말고 <strong><mark>어서 일어나 그분의 이름을 부르며 세례를 받고 죄를 깨끗이 씻어 버리시오</mark></strong>.‘” (<a href="https://bibleox.com/ko/ko-ctb/act/22/#L16">사도 22:16</a>)</p></blockquote><p>믿음과 회개가 없는 사람은 세례에 받아들여지지 않습니다. 그러므로 먼저 하느님의 말씀을 듣고, 들음에서 믿음이 생기고(<a href="https://bibleox.com/ko/ko-ctb/rim/10/#L17">로마 10:17</a>), 그런 다음에야 물과 성령으로 나고, 죄에서 깨끗해지며, 세례와 견진에서 성령의 인장을 받습니다.</p><p>사도는 먼저 하느님의 말씀을 전하고, 설교를 들은 이들이 마음이 찔리면 죄의 용서를 위해 세례를 받으라고 부릅니다:</p><blockquote><p>“사람들은 <strong><mark>이 말을 듣고</mark></strong> <strong><mark>마음이 찔려</mark></strong> 베드로와 사도들에게 ‘<strong>형제 여러분, 그러면 우리는 어떻게 하면 좋겠습니까</strong>?’하고 물었다. 베드로가 이렇게 대답하였다. ‘<strong><mark>회개하시오. 그리고 여러분은 한 사람도 빠짐없이 예수 그리스도의 이름으로 세례를 받고</mark></strong> <strong><mark>여러분의 죄를 용서받으시오</mark></strong>. 그리하면 성령을 선물로 받게 될 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/act/2/#L37-38">사도 2:37-38</a>)</p></blockquote><h3>“세례는 더러운 때를 벗기는 것이 아니라 서약이다”</h3><blockquote><p>“그것은 오늘날 여러분에게 구원을 가져다 주는 세례를 미리 보여 준 것입니다. 세례는 몸에서 더러운 때를 벗기는 것이 아니라 <strong>깨끗한 양심으로 살겠다고 하느님께 서약을 하는 것이며</strong> 예수 그리스도의 부활로써 이루어지는 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/1pet/3/#L21">1베드 3:21</a>) <em>(“서약”은 그리스어로 ἐπερώτημα, “청원, 간구”입니다.)</em></p></blockquote><p>일부 번역(러시아 시노달 번역, 공동번역 등)은 이 대목을 “약속”이나 “서약”으로 옮기고, NKJV는 “선한 양심의 응답”으로 옮깁니다. 차이는 본질적입니다. “약속”에는 성사가 없고 하느님께 받는 것도 없으며, 오히려 그분께 약속을 드릴 뿐입니다. 그러나 하느님께 청할 때에는 하느님 쪽의 활동(성사)을 기대합니다. 곧 (하느님 쪽에서) 죄를 용서하심으로써 지난 죄의 짐이 없는 선하고 깨끗한 양심을 얻습니다(<a href="https://bibleox.com/ko/ko-ctb/evr/9/#L14">히브 9:14</a>). 개신교인들의 생각처럼 물에 잠길 때 아무 일도 일어나지 않는다면, 아무것도 주시지 않는 하느님께 왜 청하겠습니까?</p><p>사도 베드로의 편지는 그리스어로 쓰였습니다. 슬라브어도 알았던 그리스인 성 키릴로스와 메토디오스 형제는 ἐπερώτημα를 약속이 아니라 청원(간구)으로, 곧 선한 양심을 하느님께 청하는 것으로 옮겼습니다.</p><p>또 옛 그리스도인 가운데 그리스인이자 교회의 주교인 신학자 그레고리오스(4세기)도 이것이 하느님의 활동, 곧 청하는 사람에게 선한 양심을 주시는 일이라고 씁니다(<a href="https://azbyka.ru/otechnik/Grigorij_Bogoslov/slova-izd-2007-g/40">설교 40, 거룩한 세례에 관하여</a>, 러시아어).</p><p>신약 본문에서 이 말(과 그 동사)은 약속으로 옮겨진 적이 없고 언제나 질문, 물음의 뜻입니다.</p><ul><li><p>ἐπερωτῆσαι — 묻다 (마태 22:46)</p></li><li><p>ἐπερωτῶσιν — 묻는다 (마르 7:5)</p></li><li><p>ἐπερωτῆσαι — 묻다 (마르 9:32)</p></li><li><p>Ἐπερωτήσω — 내가 묻겠다 (마르 11:29)</p></li><li><p>ἐπερωτῆσαι — 묻다 (마르 12:34)</p></li><li><p>ἐπερωτῶντα — 묻는 (루가 2:46)</p></li><li><p>Ἐπερωτῶ — 내가 묻는다 (루가 6:9)</p></li><li><p>Ἐπερωτηθεὶς — 질문을 받고 (루가 17:20)</p></li><li><p>ἐπερωτᾶν — 묻다 (루가 20:40)</p></li><li><p>ἐπερωτήσατε — 물어보아라 (요한 9:23)</p></li><li><p>ἐπερωτήσας — 묻고 (사도 23:34)</p></li><li><p>ἐπερωτῶσιν — 묻는 이들에게 (로마 10:20)</p></li><li><p>ἐπερωτάτωσαν — 묻게 하라 (1고린 14:35)</p></li><li><p>ἐπερώτημα — 청원 (교회 슬라브어 번역) (1베드 3:21)</p></li></ul><p>곧 사람이 하느님께 무언가를 드리는 것이 아닙니다. 약속이라면 그렇겠지만, 사람은 청할 뿐이고 주시는 분은 하느님이십니다(“<strong>양심을 깨끗하게 하는</strong>”이라고 직접 기록되어 있습니다, <a href="https://bibleox.com/ko/ko-ctb/evr/9/#L14">히브 9:14</a>).</p><p>사도는 세례가 몸의 때를 씻는 것이 아니라 안으로 죄를 씻는다고 가리킵니다. 곧 세례는 성사, 눈에 감추어져 있고 다 이해하거나 설명할 수 없는 중대한 일입니다.</p><p>이 모든 일은 물에 작용하는 성령의 활동으로 이루어집니다. 그래서 주 예수 그리스도께서 사람들이 성령으로만이 아니라 물과 성령으로 난다고 말씀하셨습니다:</p><blockquote><p>“그러자 예수께서는 ‘정말 잘 들어 두어라. 누구든지 새로 나지 아니하면 아무도 하느님의 나라를 볼 수 없다’하고 말하였다. &lt;…&gt; 정말 잘 들어 두어라. <strong>물과 성령으로 새로 나지 않으면 아무도 하느님 나라에 들어 갈 수 없다</strong>. 육에서 나온 것은 육이며 영에서 나온 것은 영이다.” (<a href="https://bibleox.com/ko/ko-ctb/in/3/#L3,5-6">요한 3:3,5-6</a>)</p></blockquote><p>게다가 사도는 끝에 세례가 구원한다고 말합니다:</p><blockquote><p>“그것은 오늘날 여러분에게 <strong><mark>구원을 가져다 주는 세례</mark></strong>를 미리 보여 준 것입니다. 세례는 몸에서 더러운 때를 벗기는 것이 아니라 깨끗한 양심으로 살겠다고 하느님께 서약을 하는 것이며 예수 그리스도의 부활로써 이루어지는 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/1pet/3/#L21">1베드 3:21</a>)</p></blockquote><p>신개신교인들(침례교인들)은 이에 근본적으로 동의하지 않습니다. 그들에게 세례는 장엄한 약속일 뿐이고 형식이며 구원을 주지 않습니다. 그러나 사도는 바로 세례가 <strong>구원한다</strong>고 말합니다.</p><p>그들은 믿음과 회개를 얻는 순간 죄의 용서를 받는다고 믿습니다. 그러나 사도 바울로는 믿었음에도 나중에 죄를 씻기 위해 세례를 받으라는 말을 들었습니다:</p><blockquote><p>“그러니 망설이지 말고 <strong><mark>어서 일어나 그분의 이름을 부르며 세례를 받고 죄를 깨끗이 씻어 버리시오</mark></strong>.‘” (<a href="https://bibleox.com/ko/ko-ctb/act/22/#L16">사도 22:16</a>)</p></blockquote><p>여기에서도 같은 말을 합니다:</p><blockquote><p>“베드로가 이렇게 대답하였다. ‘회개하시오. 그리고 여러분은 <strong><mark>한 사람도 빠짐없이 예수 그리스도의 이름으로 세례를 받고</mark></strong> <strong><mark>여러분의 죄를 용서받으시오</mark></strong>. 그리하면 성령을 선물로 받게 될 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/act/2/#L38">사도 2:38</a>)</p></blockquote><h3>죄를 씻는 것은 세례가 아니라 하느님의 말씀인가?</h3><blockquote><p>“남편된 사람들은 그리스도께서 교회를 사랑하셔서 당신의 몸을 바치신 것처럼 자기 아내를 사랑하십시오. 그리스도께서는 <strong>물로 씻는 예식과 말씀으로 교회를 거룩하게 하시려고</strong> 당신의 몸을 바치셨습니다.” (<a href="https://bibleox.com/ko/ko-ctb/ef/5/#L25-26">에페 5:25-26</a>)</p></blockquote><p>그리스도께서는 교회를 거룩하게 하시려고 당신을 내주셨습니다. 어떻게 깨끗하게 하십니까? “물로 씻는” 것, 곧 거룩한 세례로 하십니다. 세례에서는 물에 세 번 잠기며 아버지와 아들과 성령의 이름으로라는 말을 합니다(<a href="https://bibleox.com/ko/ko-ctb/mf/28/#L19">마태 28:19</a>). 여기서 말하는 것이 바로 이 말씀입니다. 물도, 아버지와 아들과 성령에 관한 말씀도 뺄 수 없습니다. 다르게 풀이하면 말을 문맥에서 떼어 내는 것입니다. 여기서는 물로 씻을 때 하는 말씀을 말합니다.</p><h3>백인대장 고르넬리오에 관하여. 성령은 세례 없이 주어지는가?</h3><p>은사주의 분파의 지지자들은 기도만으로 성령을 받는다는 자기들의 교리를 변호합니다. 이를 위해 세례 전에 성령께서 오신 유일한 경우를 듭니다:</p><blockquote><p>“베드로가 이렇게 말하고 있는 동안에 성령이 모든 청중에게 내려 오셨다.” (<a href="https://bibleox.com/ko/ko-ctb/act/10/#L44">사도 10:44</a>)</p></blockquote><p>이것은 이방인이었던 백인대장 고르넬리오의 이야기입니다. 당시에는 그들이 세례를 받을 수 있는지, 이방인을 교회에 받아들일 수 있는지 분명하지 않았습니다.</p><p>그래서 주님께서는 이방인이 교회에 들어올 수 있음을 보이시려고 특별한 계시를 주십니다.</p><ol><li><p>하느님께서는 이방인 고르넬리오에게 성령이 아니라 천사를 보내시어, 구원받으려면 교회를 찾아 사도를 불러 그의 말을 들으라고 하십니다.</p></li><li><p>사도 베드로에게 같은 환시가 세 번 나타납니다. 종교적으로 부정한 음식이 내려오고, 음성이 잡아먹으라고 명하며 이렇게 설명합니다: “하느님께서 깨끗하게 만드신 것을 속되다고 하지 말라”(<a href="https://bibleox.com/ko/ko-ctb/act/10/#L15">사도 10:15</a>).</p></li><li><p>사도가 와서 설교를 시작하자 듣고 있던 이방인들에게 성령께서 내려오십니다.</p></li></ol><p>그러자 유다인 출신 그리스도인들은 이 일에 놀랍니다. 어떻게 이방인들에게 성령께서 오실 수 있습니까?</p><blockquote><p>“신자가 된 유다인으로서 베드로와 함께 왔던 사람들은 <strong>성령의 은혜가 이방인들에게까지 내리시는 것을 보고</strong> 깜짝 놀랐다.” (<a href="https://bibleox.com/ko/ko-ctb/act/10/#L45">사도 10:45</a>)</p></blockquote><p>그리고 모든 일은 이방인들의 세례로 끝납니다. 하느님께서 친히 가리키셨으니 이제 의심 없이 세례를 줄 수 있었습니다:</p><blockquote><p>“이 사람들도 우리처럼 성령을 받았으니 <strong>이들이 물로 세례를 받는 것을 어떻게 막을 수 있겠는가</strong>?‘ 하며 <strong>예수 그리스도의 이름으로 세례를 받으라고 일렀다</strong>. 그들은 베드로에게 자기들과 함께 며칠 더 머물러 달라고 간청하였다.” (<a href="https://bibleox.com/ko/ko-ctb/act/10/#L47-48">사도 10:47-48</a>)</p></blockquote><p>그러므로 이것은 성령께서 세례 전에 오신 유일한 경우입니다. 세례 대신이 아니라 세례 전입니다. 세례는 어차피 베풀어지기 때문입니다. 이 특별한 강림에는 예외적인 이유가 있습니다. 성령이신 하느님께서 이방인을 교회에 받아들일 수 있음을 보여 주신 것입니다.</p><p>사람에게 성령께서 내려오시는 것은 그 자체로 세례와 구별되는 성사입니다(<a href="https://bibleox.com/ru/ru/w/миропомазание">자세히</a>).</p><h3>내시는 사도 없이 성령을 받았는가?</h3><p>이 질문은 <a href="https://bibleox.com/ru/ru/w/миропомазание">견진성사</a>의 주제에 속합니다. 필립보와 내시의 경우(<a href="https://bibleox.com/ko/ko-ctb/act/8/#L39">사도 8:39</a>)에는 매우 중요한 세부 사항이 있습니다.</p><p>러시아 시노달 번역과 교회 슬라브어 번역에서 이 구절은 “성령께서 내시에게 내리시고, 주님의 천사가 필립보를 데려갔다”로 되어 있습니다. 그러나 가장 오래된 이들을 포함한 대부분의 주석가들, 그 가운데 성 요한 크리소스토모스는 성령의 강림에 관한 구절(αγιον επεπεϲεν επι τον ευνουχον αγγελοϲ δε) 없이 본문을 인용합니다. 그냥 이렇게 말합니다(공동번역과 NKJV, 대부분의 번역도 그렇습니다):</p><blockquote><p>“<strong>주의 성령이 필립보를 어디론가 데리고 가셨다</strong>” (<a href="https://bibleox.com/ko/ko-ctb/act/8/#L39">사도 8:39</a>)</p></blockquote><p>이 말이 없는 시나이 사본(4세기):</p><blockquote><p>καὶ ἐκέλευσεν στῆναι τὸ ἅρμα, καὶ κατέβησαν ἀμφότεροι εἰς τὸ ὕδωρ, ὁ τε Φίλιππος καὶ ὁ εὐνοῦχος, καὶ ἐβάπτισεν αὐτόν. ὅτε δὲ ἀνέβησαν ἐκ τοῦ ὕδατος, <strong>πνεῦμα Κυρίου ἥρπασεν τὸν Φίλιππον</strong>, καὶ οὐκ εἶδεν αὐτὸν οὐκέτι ὁ εὐνοῦχος· ἐπορεύετο γὰρ τὴν ὁδὸν αὐτοῦ χαίρων. Φίλιππος δὲ εὑρέθη εἰς Ἄζωτον, καὶ διερχόμενος εὐηγγελίζετο τὰς πόλεις πάσας, ἕως τοῦ ἐλθεῖν αὐτὸν εἰς Καισάριαν. (사도 8:39-40)</p></blockquote><p>이 말이 없는 바티칸 사본(4세기):</p><blockquote><p>και εκελευϲε ϲτηναι το αρμα και κατεβηϲαν αμφοτεροι ειϲ το υδωρ ο τε φιλιπποϲ και ο ευνουχοϲ και εβαπτιϲεν αυτον οτε δε ανεβηϲαν εκ του υδατοϲ <strong>πνευμα κ̅υ̅ ηρπαϲεν το̅ φιλιππον</strong> και ουκ ειδε̅ αυτον ουκετι ο ευνουχοϲ επορευετο γαρ αυτου την οδον χαιρων</p></blockquote><p>성 요한 크리소스토모스의 인용(성령의 강림에 관한 말이 없습니다):</p><blockquote><p>Ὅτε δὲ ἀνέβησαν ἀπὸ τοῦ ὕδατος, <strong>Πνεῦμα Κυρίου ἥρπασε τὸν Φίλιππον</strong>, καὶ οὐκ εἶδεν αὐτὸν οὐκ ἔτι ὁ εὐνοῦχος.</p></blockquote><p>(<a href="https://bibleox.com/el/grc/w/dNiR_Ὁμιλίαι_εἰς_τὰς_Πράξεις_τῶν_Ἀποστόλων#HH-ΟΜΙΛΙΑ-ΙΘʹ">In acta apostolorum, ΟΜΙΛΙΑ ΙΘ</a>, 그리스어)</p><p>미하일(루진) 주교의 주해:</p><blockquote><p>“<strong>성령께서 내시에게 내리시고, 주님의 천사가 필립보를 데려갔다</strong>: 이 대목은 소수의 고대 그리스어 사본과 번역(슬라브어와 러시아어 번역이 이를 따릅니다), 소수의 고대 주석가에게만 이렇게 되어 있습니다. 그러나 대부분의 사본과 번역과 주석가(그 가운데 성 크리소스토모스와 테오필락토스)에게는 ‘주님의 영이 필립보를 데려갔다’로 되어 있습니다. 어떤 사본의 첨가인지 다른 사본의 누락인지 판단하기 어렵지만 전자가 더 그럴듯하며, 그렇다면 내시가 성령을 받은 일에 대해 저자가 침묵하고 있어서 생긴 것으로 설명됩니다.”</p></blockquote><p>(<a href="https://azbyka.ru/biblia/in/?Act.8:39&r">출처</a>, 러시아어에서 번역)</p><h2>몇 가지 참고 사항</h2><h3>유아도 믿을 수 있습니다</h3><p>유아도 믿음을 증언하는 대답은 못 하지만 믿고 성령으로 가득 찰 수 있다고 볼 근거는 충분합니다.</p><p>예언자 다윗은 젖먹이 때부터 하느님을 신뢰했습니다:</p><blockquote><p>“당신은 나를 모태에서 나게 하시고, <strong>어머니 젖가슴에 안겨 주신 분</strong>, 날 때부터 이 몸은 당신께 맡겨진 몸, 당신은 모태에서부터 나의 하느님이시오니” (<a href="https://bibleox.com/ko/ko-ctb/ps/22/#L9-10">시편 22:9-10</a>)</p></blockquote><p>예언자 요한은 태어나기 전에도 구세주와의 만남을 느끼고 기뻐합니다:</p><blockquote><p>“며칠 뒤에 <strong>마리아</strong>는 길을 떠나 걸음을 서둘러 유다 산골에 있는 한 동네를 찾아 가서 즈가리야의 집에 들어 가 엘리사벳에게 문안을 드렸다. 엘리사벳이 마리아의 문안을 받았을 때에 <strong>그의 뱃속에 든 아기가 뛰놀았다</strong>. 엘리사벳은 성령을 가득히 받아” (<a href="https://bibleox.com/ko/ko-ctb/lk/1/#L39-41">루가 1:39-41</a>) <em>(마리아는 그리스도를 잉태했고, 아기는 예언자 요한입니다.)</em></p></blockquote><p>그리스도께서는 어린이를 앞에 세우시고 당신을 믿는 “이 작은 이들”을 말씀하십니다.</p><blockquote><p>“예수께서 <strong><mark>어린이 하나를 불러</mark></strong> 그들 가운데 세우시고 나는 분명히 말한다. 너희가 생각을 바꾸어 어린이와 같이 되지 않으면 결코 하늘 나라에 들어 가지 못할 것이다. 그리고 하늘 나라에서 가장 위대한 사람은 <strong>자신을 낮추어 이 어린이와 같이 되는 사람</strong>이다. 또 누구든지 나를 받아 들이듯이 <strong>이런 어린이 하나를 받아 들이는 사람</strong>은 곧 나를 받아 들이는 사람이다‘ 하고 대답하였다. ’그러나 <strong><mark>나를 믿는 이 보잘 것 없는 사람들 가운데 누구 하나라도 죄짓게 하는 사람은</mark></strong> 그 목에 연자맷돌을 달고 깊은 바다에 던져져 죽는 편이 나을 것이다.” (<a href="https://bibleox.com/ko/ko-ctb/mf/18/#L2-6">마태 18:2-6</a>)</p></blockquote><p>어린이들은 예루살렘에 들어가시는 그리스도를 찬양했습니다:</p><blockquote><p>“대사제들과 율법학자들은 예수께서 행하신 여러 가지 놀라운 일이며 성전 뜰에서 ‘<strong>호산나! 다윗의 자손!’ 하고 외치는 아이들</strong>을 보고 화가 치밀어서 예수께 ‘이 아이들이 하는 말이 들립니까?’ 하고 물었다. 예수께서는 그들에게 ‘들린다. 주께서 어린이들과 젖먹이들의 입으로 주를 찬양하게 하시리라고 하신 말씀을 읽어 본 일이 없느냐?’ 하고 대답하셨다.” (<a href="https://bibleox.com/ko/ko-ctb/mf/21/#L15-16">마태 21:15-16</a>)</p></blockquote><h3>세례 없이 구원받을 수 있다는 말은 없습니다</h3><p>성경에는 세례 없이 구원받을 수 있다는 지시가 없습니다. 그러나 세례 없이는 아무도 하느님 나라에 들어갈 수 없다고 합니다(<a href="https://bibleox.com/ko/ko-ctb/in/3/#L3,5-6">요한 3:3,5-6</a>).</p>'
  meta_desc: 사람을 죄에서 씻고 하느님과 함께하는 영원한 삶으로 영적으로 태어나게 하는 구원의 세례에 관한 성경 구절
