  title: 교회는 영원하며 무너지지 않습니다
  copy_cover: true
  body: <h2>하느님께서는 언제나 교회와 함께 계십니다</h2><p>성령께서는 교회에 영원히 파견되십니다:</p><blockquote><p>“내가 아버지께 구하겠으니 그가 또 다른 보혜사를 너희에게 주사 <strong>영원토록 너희와 함께 있게 하리니</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/in/14/#L16">요 14:16</a>)</p></blockquote><p>주 예수 그리스도께서는 언제나 교회와 함께 계시겠다고 약속하셨습니다:</p><blockquote><p>“내가 너희에게 분부한 모든 것을 가르쳐 지키게 하라 볼지어다 내가 <strong>세상 끝날까지 너희와 항상 함께 있으리라</strong> 하시니라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/28/#L20">마 28:20</a>)</p></blockquote><h2>교회는 패하지 않습니다</h2><p>주님께서는 교회가 패하지 않으리라는 예언을 말씀하십니다:</p><blockquote><p>“또 내가 네게 이르노니 너는 베드로라 내가 이 반석 위에 내 교회를 세우리니 <strong>음부의 권세가 이기지 못하리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/16/#L18">마 16:18</a>)</p></blockquote><h2>진리는 언제나 교회 안에 있을 것입니다</h2><p>진리는 영원히 교회와 함께 있을 것입니다:</p><blockquote><p>“장로인 나는 택하심을 받은 부녀와 그의 자녀들에게 편지하노니 내가 참으로 사랑하는 자요 나뿐 아니라 진리를 아는 모든 자도 그리하는 것은 우리 안에 거하여 <strong>영원히 우리와 함께 할 진리</strong>로 말미암음이로다” (<a href="https://bibleox.com/ko/ko-nkrv/2in/1/#L1-2">요이 1:1-2</a>)</p></blockquote><h2>교회는 언제나 하느님을 찬양할 것입니다</h2><p>교회 안에서 모든 세대의 모든 이가 하느님을 찬양할 것입니다:</p><blockquote><p>“<strong>교회 안에서와 그리스도 예수 안에서</strong> <strong>영광이 대대로 영원무궁하기를</strong> 원하노라 아멘” (<a href="https://bibleox.com/ko/ko-nkrv/ef/3/#L21">엡 3:21</a>)</p></blockquote><h2>성체성혈성사는 그리스도께서 오실 때까지 교회에서 거행될 것입니다</h2><blockquote><p>“너희가 이 <strong>떡</strong>을 먹으며 이 잔을 마실 때마다 주의 죽으심을 <strong>그가 오실 때까지</strong> 전하는 것이니라” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/11/#L26">고전 11:26</a>)</p></blockquote>
