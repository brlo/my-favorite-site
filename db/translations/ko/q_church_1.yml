  title: 구원은 그리스도의 교회 안에서만 가능합니다
  copy_cover: true
  body: <h2>기도, 예언, 기적은 구원의 표지가 아닙니다</h2><blockquote><p>“<strong><mark>나더러 주여 주여 하는 자마다 다 천국에 들어갈 것이 아니요</mark></strong> 다만 하늘에 계신 내 아버지의 뜻대로 행하는 자라야 들어가리라 그 날에 많은 사람이 나더러 이르되 주여 주여 우리가 주의 이름으로 <strong>선지자 노릇 하며</strong> 주의 이름으로 <strong>귀신을 쫓아 내며</strong> 주의 이름으로 <strong>많은 권능을 행하지</strong> 아니하였나이까 하리니 그 때에 내가 그들에게 밝히 말하되 <strong><mark>내가 너희를 도무지 알지 못하니</mark></strong> 불법을 행하는 자들아 내게서 떠나가라 하리라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/7/#L21-23">마 7:21-23</a>)</p></blockquote><blockquote><p>“이르시되 <strong>미혹을 받지 않도록 주의하라</strong> <strong>많은 사람이 내 이름으로 와서</strong> 이르되 내가 그라 하며 때가 가까이 왔다 하겠으나 <strong>그들을 따르지 말라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/lk/21/#L8">눅 21:8</a>; <a href="https://bibleox.com/ko/ko-nkrv/mf/24/#L5">마 24:5</a>; <a href="https://bibleox.com/ko/ko-nkrv/mk/13/#L6">막 13:6</a>)</p></blockquote><h2>구원을 받으려면 그리스도의 몸(교회)의 지체가 되어야 합니다</h2><p>교회는 그리스도의 몸입니다:</p><blockquote><p>“나는 이제 너희를 위하여 받는 괴로움을 기뻐하고 그리스도의 남은 고난을 <strong><mark>그의 몸된 교회</mark></strong>를 위하여 내 육체에 채우노라” (<a href="https://bibleox.com/ko/ko-nkrv/kol/1/#L24">골 1:24</a>)</p></blockquote><p>그리스도께서는 몸, 곧 교회의 구세주이십니다:</p><blockquote><p>“이는 남편이 아내의 머리 됨이 그리스도께서 교회의 머리 됨과 같음이니 <strong><mark>그가 바로 몸의 구주시니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ef/5/#L23">엡 5:23</a>)</p></blockquote><p>구원의 문은 그리스도이십니다:</p><blockquote><p>“<strong><mark>내가 문이니 누구든지 나로 말미암아 들어가면 구원을 받고</mark></strong> 또는 들어가며 나오며 꼴을 얻으리라 도둑이 오는 것은 도둑질하고 죽이고 멸망시키려는 것뿐이요 내가 온 것은 양으로 생명을 얻게 하고 더 풍성히 얻게 하려는 것이라” (<a href="https://bibleox.com/ko/ko-nkrv/in/10/#L9-10">요 10:9-10</a>)</p></blockquote><p>주님께서는 구원받는 이들을 교회에 더해 주셨습니다:</p><blockquote><p>“하나님을 찬미하며 또 온 백성에게 칭송을 받으니 <strong><mark>주께서 구원 받는 사람을 날마다 더하게 하시니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/act/2/#L47">행 2:47</a>)</p></blockquote><p>몸 밖에 있는 사람은 열매를 맺을 수 없고, 버려져 불에 던져집니다:</p><blockquote><p>“<strong><mark>내 안에 거하라 나도 너희 안에 거하리라 가지가 포도나무에 붙어 있지 아니하면 스스로 열매를 맺을 수 없음</mark></strong> 같이 너희도 내 안에 있지 아니하면 그러하리라 나는 포도나무요 너희는 가지라 그가 내 안에, 내가 그 안에 거하면 사람이 열매를 많이 맺나니 <strong>나를 떠나서는 너희가 아무 것도 할 수 없음이라</strong> <strong><mark>사람이 내 안에 거하지 아니하면 가지처럼 밖에 버려져 마르나니</mark></strong> <strong>사람들이 그것을 모아다가 불에 던져</strong> 사르느니라” (<a href="https://bibleox.com/ko/ko-nkrv/in/15/#L4-6">요 15:4-6</a>)</p></blockquote><blockquote><p>“이 예수는 너희 건축자들의 버린 돌로서 집 모퉁이의 머릿돌이 되었느니라 <strong><mark>다른 이로써는 구원을 받을 수 없나니</mark></strong> 천하 사람 중에 구원을 받을 만한 다른 이름을 우리에게 주신 일이 없음이라 하였더라” (<a href="https://bibleox.com/ko/ko-nkrv/act/4/#L11-12">행 4:11-12</a>)</p></blockquote><p>그리스도와 함께하지 않는 사람은 그분을 반대하는 사람입니다:</p><blockquote><p>“<strong>나와 함께 하지 아니하는 자는 나를 반대하는 자요</strong> 나와 함께 모으지 아니하는 자는 헤치는 자니라” (<a href="https://bibleox.com/ko/ko-nkrv/lk/11/#L23">눅 11:23</a>)</p></blockquote><h2>그리스도의 몸(교회)에 결합됩니다</h2><h3>세례</h3><blockquote><p>“우리가 유대인이나 헬라인이나 종이나 자유인이나 다 <strong><mark>한 성령으로 세례를 받아 한 몸이 되었고</mark></strong> 또 다 한 성령을 마시게 하셨느니라” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/12/#L13">고전 12:13</a>)</p></blockquote><h3>성체성혈성사</h3><blockquote><p>“우리가 축복하는 바 축복의 잔은 그리스도의 피에 참여함이 아니며 우리가 떼는 <strong>떡</strong>은 <strong>그리스도의 몸에 참여함이 아니냐</strong> <strong><mark>떡이 하나요 많은 우리가 한 몸이니 이는 우리가 다 한 떡에 참여함이라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/10/#L16-17">고전 10:16-17</a>)</p></blockquote><h2>방주는 구원의 구약적 예표입니다</h2><blockquote><p>“이르시되 <strong>내가 창조한 사람을 내가 지면에서 쓸어버리되</strong> 사람으로부터 가축과 기는 것과 공중의 새까지 그리하리니 이는 내가 그것들을 지었음을 한탄함이니라 하시니라 &lt;…&gt; 그 때에 온 땅이 하나님 앞에 부패하여 포악함이 땅에 가득한지라 하나님이 보신즉 땅이 부패하였으니 이는 땅에서 모든 혈육 있는 자의 행위가 부패함이었더라 하나님이 노아에게 이르시되 모든 혈육 있는 자의 포악함이 땅에 가득하므로 그 끝 날이 내 앞에 이르렀으니 <strong>내가 그들을 땅과 함께 멸하리라</strong> <strong><mark>너는 고페르 나무로 너를 위하여 방주를 만들되</mark></strong> 그 안에 칸들을 막고 역청을 그 안팎에 칠하라 &lt;…&gt; <strong>내가 홍수를 땅에 일으켜 무릇 생명의 기운이 있는 모든 육체를 천하에서 멸절하리니</strong> <strong><mark>땅에 있는 것들이 다 죽으리라</mark></strong> 그러나 너와는 내가 내 언약을 세우리니 <strong>너는 네 아들들과 네 아내와 네 며느리들과 함께 그 방주로 들어가고</strong> 혈육 있는 모든 생물을 너는 각기 암수 한 쌍씩 방주로 이끌어들여 너와 함께 생명을 보존하게 하되 새가 그 종류대로, 가축이 그 종류대로, 땅에 기는 모든 것이 그 종류대로 각기 둘씩 네게로 나아오리니 그 생명을 보존하게 하라 너는 먹을 모든 양식을 네게로 가져다가 저축하라 이것이 너와 그들의 먹을 것이 되리라 노아가 그와 같이 하여 하나님이 자기에게 명하신 대로 다 준행하였더라” (<a href="https://bibleox.com/ko/ko-nkrv/gen/6/#L7,11-14,17-22">창 6:7,11-14,17-22</a>)</p></blockquote><blockquote><p>“<strong>땅 위에 움직이는 생물이 다 죽었으니</strong> 곧 새와 가축과 들짐승과 땅에 기는 모든 것과 모든 사람이라 <strong>육지에 있어 그 코에 생명의 기운의 숨이 있는 것은 다 죽었더라</strong> <strong>지면의 모든 생물을 쓸어버리시니</strong> 곧 사람과 가축과 기는 것과 공중의 새까지라 이들은 땅에서 쓸어버림을 당하였으되 <strong><mark>오직 노아와 그와 함께 방주에 있던 자들만 남았더라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gen/7/#L21-23">창 7:21-23</a>)</p></blockquote><blockquote><p>“그들은 전에 노아의 날 방주를 준비할 동안 하나님이 오래 참고 기다리실 때에 복종하지 아니하던 자들이라 <strong><mark>방주에서 물로 말미암아 구원을 얻은 자가 몇 명뿐이니 겨우 여덟 명이라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1pet/3/#L20">벧전 3:20</a>)</p></blockquote><h3>구약의 예표는 우리에게 교훈이 되라고 기록되었습니다</h3><blockquote><p>“<strong>그들에게 일어난 이런 일은</strong> 본보기가 되고 또한 말세를 만난 <strong>우리를 깨우치기 위하여</strong> <strong>기록되었느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/10/#L11">고전 10:11</a>)</p></blockquote><h2>비판</h2><h3>“‘우리만 구원받고 다른 사람은 구원받지 못한다’는 말은 교만에서 나온 것이다”</h3><p>하느님께서는 일찍이 예언자 모세를 통해 구약의 교회를 세우시고 그 안에 당신 마음에 드는 질서를 세우셨습니다. 나중에 그 곁에 이주해 온 여러 민족으로 이루어진 사마리아 사람들이 생겨났습니다. 그들은 예언자 모세의 다섯 두루마리(토라)를 근거로 삼고 후대 저자들(예언자들)의 두루마리는 받아들이지 않은 채, 자기 나름의 질서를 가진 별도의 종교 단체를 스스로 만들어 자기 식으로 하느님을 믿으며 그리스도를 기다렸습니다. 그리스도께서는 사마리아 여인에게 이렇게 대답하십니다:</p><blockquote><p>“<strong>너희는 알지 못하는 것을 예배하고</strong> 우리는 아는 것을 예배하노니 이는 <strong>구원이 유대인에게서 남이라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/in/4/#L22">요 4:22</a>)</p></blockquote><p>그리스도께서는 교만해서 이렇게 말씀하셨습니까, 아니면 책에서 멋대로 만들어 낸 신앙을 가진 제멋대로의 단체에서는 정말 구원받을 수 없기 때문입니까?</p><p>사도가 분열과 이단을 포함한 육체의 일을 하는 사람들은 하느님 나라를 차지하지 못한다고 말할 때, 교만해서 그렇게 말합니까, 아니면 그런 죄를 지니고는 정말 하느님 나라를 차지할 수 없기 때문입니까?</p><blockquote><p>“<strong>육체의 일은 분명하니</strong> 곧 음행과 더러운 것과 호색과 우상 숭배와 주술과 원수 맺는 것과 분쟁과 시기와 분냄과 당 짓는 것과 <strong><mark>분열함과 이단과</mark></strong> 투기와 술 취함과 방탕함과 또 그와 같은 것들이라 전에 너희에게 경계한 것 같이 경계하노니 이런 일을 하는 자들은 <strong><mark>하나님의 나라를 유업으로 받지 못할 것이요</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gal/5/#L19-21">갈 5:19-21</a>)</p></blockquote><p>개신교인들이 여기서 교만을 보는 까닭은 그리스도를 개인의 구주로 인정하기만 하면 곧 구원을 받았다는, 곧 지금 당장 믿음만으로 구원받는다는 그들이 지어낸 가르침 때문입니다. 정교인에게는 이런 가르침이 없고, 구원에 대한 생각도 전혀 다릅니다(<a href="https://bibleox.com/ru/ru/w/спасение">자세히</a>).</p><p><a href="https://bibleox.com/ru/ru/w/Православная-Церковь">정교회</a> (러시아어)에 들어왔다고 해서 이미 구원받은 것이 아니라 구원받아 가는 중입니다. 교회에 온 사람이 모두 구원받는 것이 아니라, 구원의 수단을 사용하여 자기 자신과 부지런히 싸우며 죄스러운 정념을 뽑아내고 복음의 덕을 얻는 사람만 구원받습니다. <a href="https://bibleox.com/ru/ru/w/Православная-Церковь">정교회</a> (러시아어) 안에 있는 것은 구원의 조건 가운데 하나일 뿐입니다. 구원을 찾는 사람에게는 구원의 수단이 필요합니다. 병자에게는 약이, 대양 한가운데서 물에 빠진 사람에게는 배가 필요합니다. 마찬가지로 죄의 정념에 병든 모든 사람은 지상 생활의 바다를 건너 죄의 심연에 빠지지 않고 하느님과 함께하는 삶에 이르기 위해 <strong>구원의 수단, 곧 올바른 신앙과 은총이 가득한 성사</strong>가 필요합니다. 하느님께서는 이 구원의 수단을 당신의 구원의 방주, 곧 <a href="https://bibleox.com/ru/ru/w/Православная-Церковь">정교회</a> (러시아어) 안에 두셨고, 이 교회는 하느님이신 예수 그리스도께서 2000년 전에 친히 오셔서 세우셨습니다.</p><p>평범한 사람들이 최근에 멋대로 세운 공동체들은, 믿는 이들의 일치를 바라시는 하느님의 뜻을 정면으로 거슬러, 구원의 수단을 갖지 못했을 뿐 아니라 오히려 그 분리된 존재 자체로 사람들을 무거운 죄의 상태, 곧 이단과 분열이라는 죽을죄로 이끕니다(<a href="https://bibleox.com/ko/ko-nkrv/gal/5/#L19-21">갈 5:19-21</a>).</p><p>자기 “교회”를 세우는 것, 믿는 이들을 갈라놓는 것은 믿는 이들의 일치를 바라시는 그리스도와 사도들의 뜻을 정면으로 거스르는 일이며, 바로 이것이 교만의 표현입니다:</p><blockquote><p>“내가 <strong><mark>비옵는 것은</mark></strong> 이 사람들만 위함이 아니요 또 그들의 말로 말미암아 나를 믿는 사람들도 위함이니 아버지여, 아버지께서 내 안에, 내가 아버지 안에 있는 것 같이 <strong><mark>그들도 다 하나가 되어</mark></strong> <strong><mark>우리 안에 있게 하사 세상으로 아버지께서 나를 보내신 것을 믿게 하옵소서</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/in/17/#L20-21">요 17:20-21</a>)</p></blockquote><blockquote><p>“형제들아 내가 우리 주 예수 그리스도의 이름으로 너희를 <strong><mark>권하노니</mark></strong> <strong><mark>모두가 같은 말을 하고 너희 가운데 분쟁이 없이 같은 마음과 같은 뜻으로 온전히 합하라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/1/#L10">고전 1:10</a>)</p></blockquote><p>물론 그리스도와 원수가 되어 자기 “교회”를 세우면서 구원받을 수는 없습니다. 사도도 이단과 분열 가운데서 육체의 일을 하면 하늘 나라를 차지할 수 없다고 말합니다:</p><blockquote><p>“<strong>육체의 일은 분명하니</strong> 곧 음행과 더러운 것과 호색과 우상 숭배와 주술과 원수 맺는 것과 분쟁과 시기와 분냄과 당 짓는 것과 <strong><mark>분열함과 이단과</mark></strong> 투기와 술 취함과 방탕함과 또 그와 같은 것들이라 전에 너희에게 경계한 것 같이 경계하노니 이런 일을 하는 자들은 <strong><mark>하나님의 나라를 유업으로 받지 못할 것이요</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gal/5/#L19-21">갈 5:19-21</a>)</p></blockquote><p>사도는 분열을 일으키는 사람들이 주 예수 그리스도를 섬기지 않는다고 직접 말합니다:</p><blockquote><p>“형제들아 내가 너희를 권하노니 너희가 배운 교훈을 거슬러 <strong><mark>분쟁을 일으키거나 거치게 하는 자들을 살피고 그들에게서 떠나라</mark></strong> <strong><mark>이같은 자들은 우리 주 그리스도를 섬기지 아니하고</mark></strong> 다만 자기들의 배만 섬기나니 교활한 말과 아첨하는 말로 순진한 자들의 마음을 미혹하느니라” (<a href="https://bibleox.com/ko/ko-nkrv/rim/16/#L17-18">롬 16:17-18</a>)</p></blockquote><p>그리스도를 거슬러 행동하는 사람을 뒤따라가면서 어떻게 구원받을 수 있겠습니까?</p><p>게다가 이단과 분열만이 죄는 아닙니다. 다른 <a href="https://bibleox.com/ru/ru/w/смертный-грех">죽을죄</a>도 많습니다. 술 취함이라는 죽을죄에 머물러서는 성경 말씀대로 하늘 나라를 차지할 수 없다고 술꾼에게 경고하는 것이 교만입니까(<a href="https://bibleox.com/ko/ko-nkrv/1kor/6/#L9">고전 6:9</a>)? 살인자, 도둑, 마술사, 음행하는 자, 속이는 자에게 같은 말을 하는 것이 교만입니까? 이것이 교만이 아니고 우리가 이 죽을죄들을 경고해야 한다면(<a href="https://bibleox.com/ko/ko-nkrv/ef/5/#L11">엡 5:11</a>), 정직하게 말해 이단자와 분열자에게도 경고해야 합니다. 이단과 분열은 술 취함, 살인 등과 같은 죽을죄의 목록에 들어 있고, 거기에 머물러서는 사람이 하늘 나라를 차지할 수 없기 때문입니다.</p><p>그러면 사람은 이 죄의 상태에서 어떻게 벗어날 수 있습니까? 평범한 사람이 최근에 세운 단체에 머무는 것을 그만두고, 그 사람이 최근에 지어낸 그 단체의 신앙을 버려야 합니다. 그런 다음 주 예수 그리스도께서 세우신 <a href="https://bibleox.com/ru/ru/w/Православная-Церковь">정교회</a> (러시아어)에 들어와, 그리스도께서 사도들에게 가르치시고 사도들이 <a href="https://bibleox.com/ru/ru/w/Православная-Церковь">정교회</a> (러시아어)에 맡겼으며 교회에 영원히 파견되신 성령께서 그리스도의 교회 안에 변함없이 지켜 주시는 정교 신앙을 받아들여야 합니다:</p><blockquote><p>“내가 아버지께 구하겠으니 그가 또 다른 보혜사를 너희에게 주사 <strong><mark>영원토록 너희와 함께 있게 하리니</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/in/14/#L16">요 14:16</a>)</p></blockquote><blockquote><p>“내가 너희에게 분부한 모든 것을 가르쳐 지키게 하라 볼지어다 내가 <strong><mark>세상 끝날까지 너희와 항상 함께 있으리라</mark></strong> 하시니라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/28/#L20">마 28:20</a>)</p></blockquote>
