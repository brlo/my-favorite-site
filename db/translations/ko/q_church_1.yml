  title: 교회
  copy_cover: true
  body: '<h2>정의: 교회는 그리스도의 몸입니다</h2><blockquote><p>“하느님께서는 만물을 그리스도의 발 아래 굴복시키셨으며 그분을 <strong><mark>교회의 머리</mark></strong>로 삼으셔서 모든 것을 지배하게 하셨습니다. <strong><mark>교회는 그리스도의 몸이며</mark></strong> 만물을 완성하시는 분의 계획이 그 안에서 완전히 이루어집니다.” (<a href="https://bibleox.com/ko/ko-ctb/ef/1/#L22-23">에페 1:22-23</a>)</p></blockquote><blockquote><p>“<strong><mark>여러분은 다 함께 그리스도의 몸을 이루고</mark></strong> 있으며 한 사람 한 사람은 그 지체가 되어 있습니다.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/12/#L27">1고린 12:27</a>)</p></blockquote><blockquote><p>“<strong><mark>여러분의 몸이 그리스도의 지체</mark></strong>라는 것을 알지 못합니까? 그런데 그리스도의 몸의 한 부분을 떼어서 창녀의 몸의 지체로 만들어서야 되겠습니까? 절대로 그럴 수 없습니다.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/6/#L15">1고린 6:15</a>)</p></blockquote><blockquote><p>“사람의 몸은 하나이지만 그 몸에는 여러가지 지체가 있고 그 지체의 기능도 각각 다릅니다. 이와 같이 <strong><mark>우리도 수효는 많지만 그리스도 안에서 한 몸을 이루고</mark></strong> 각각 서로 서로의 지체 구실을 하고 있습니다.” (<a href="https://bibleox.com/ko/ko-ctb/rim/12/#L4-5">로마 12:4-5</a>)</p></blockquote><blockquote><p>“그래서 나는, 여러분을 위하여 기꺼이 고통을 겪고 있습니다. 그리고 나는 <strong><mark>그리스도의 몸인 교회를 위하여</mark></strong> 그리스도의 남은 고난을 내 몸으로 채우고 있습니다.” (<a href="https://bibleox.com/ko/ko-ctb/kol/1/#L24">골로 1:24</a>)</p></blockquote><blockquote><p>“도대체 자기 몸을 미워하는 사람은 없습니다. 오히려 자기 몸을 기르고 보살펴 줍니다. <strong><mark>그리스도께서도 교회를 기르시고 보살펴 주십니다</mark></strong>. <strong><mark>우리는 그리스도의 몸의 지체들입니다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/ef/5/#L29-30">에페 5:29-30</a>)</p></blockquote><blockquote><p>“그리스도의 평화가 여러분의 마음을 다스리게 되기를 바랍니다. 그러려면 여러분은 <strong><mark>부르심을 받아 한 몸이 된 것입니다</mark></strong>. 항상 감사하는 마음으로 사십시오.” (<a href="https://bibleox.com/ko/ko-ctb/kol/3/#L15">골로 3:15</a>)</p></blockquote><h2>몸(교회)에 결합됩니다</h2><h3>세례</h3><blockquote><p>“유다인이든지 그리이스인이든 종이든 자유인이든 우리는 모두 <strong><mark>한 성령으로 세례를 받아 한 몸이 되었고</mark></strong> 같은 성령을 받아 마셨습니다.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/12/#L13">1고린 12:13</a>)</p></blockquote><h3>성체성혈성사</h3><blockquote><p>“우리가 감사를 드리면서 그 축복의 잔을 마시는 것은 우리가 그리스도의 피를 나누어 머시는 것이 아니겠습니까?또 우리가 그 <strong>빵</strong>을 떼는 것은 <strong><mark>그리스도의 몸을 나누어 먹는 것</mark></strong>이 아니겠습니까? <strong>빵은 하나이고 우리 모두가 그 한 덩어리의 빵을 나누어 먹는 사람들이니 비록 우리가 여럿이지만 모두 한 몸인 것입니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/10/#L16-17">1고린 10:16-17</a>)</p></blockquote><h2>그리스도는 몸(교회)의 구세주이십니다</h2><blockquote><p>“<strong><mark>그리스도께서 당신의 몸인 교회의 구원자로서 그 교회의 머리가 되시는</mark></strong> 것처럼 남편은 아내의 주인이 됩니다.” (<a href="https://bibleox.com/ko/ko-ctb/ef/5/#L23">에페 5:23</a>)</p></blockquote><blockquote><p>“너희는 <strong><mark>나를 떠나지 말라</mark></strong>. 나도 너희를 떠나지 않겠다. <strong><mark>포도나무에 붙어 있지 않는 가지가 스스로 열매를 맺을 수 없는 것처럼 너희도 나에게 붙어 있지 않으면 열매를 맺지 못할 것이다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/in/15/#L4">요한 15:4</a>)</p></blockquote><h3>그리스도께서 구원받는 이들을 교회로 인도하십니다</h3><blockquote><p>“하느님을 찬양하였다. 이것을 보고 모든 사람이 그들을 우러러 보게 되었다. <strong><mark>주께서는 구원받을 사람을 날마다 늘려 주셔서 신도의 모임이 커 갔다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/act/2/#L47">사도 2:47</a>) <em>(그리스어: “주께서 구원받는 사람들을 날마다 교회에 더해 주셨다”)</em></p></blockquote><p>비유에 나오는 자비로운 사마리아 사람은 사람을 구원하시는 그리스도의 모습입니다. 그는 사람의 상처를 싸매 주고 여관(교회)으로 데려가 회복(구원)을 맡깁니다:</p><blockquote><p>“예수께서는 이렇게 말씀하셨다. ‘어떤 사람이 예루살렘에서 예리고로 내려 가다가 강도들을 만났다. 강도들은 그 사람이 가진 것을 모조리 빼앗아 마구 두들겨서 반쯤 죽여 놓고 갔다. &lt;…&gt; 그런데 길을 가던 어떤 <strong><mark>사마리아 사람</mark></strong>은 그의 옆을 지나다가 그를 보고는 가엾은 마음이 들어 가까이 가서 <strong><mark>상처에 기름과 포도주를 붓고 싸매어 주고는</mark></strong> <strong><mark>자기 나귀에 태워 여관으로 데려가서 간호해 주었다</mark></strong>. 다음 날 자기 주머니에서 돈 두 데나리온을 꺼내어 여관 주인에게 주면서 저 사람을 잘 돌보아 주시오. 비용이 더 들면 돌아 오는 길에 갚아 드리겠소 하며 부탁하고 떠났다.” (<a href="https://bibleox.com/ko/ko-ctb/lk/10/#L30,33-35">루가 10:30,33-35</a>)</p></blockquote><h2>교회의 구성</h2><h3>몸의 머리는 그리스도이십니다</h3><blockquote><p>“그리스도는 또한 <strong>당신의 몸인 교회의 머리이십니다</strong>. 그분은 모든 것의 시작이시고 죽은 자들 가운데서 살아나신 최초의 분이시며 만물의 으뜸이 되셨습니다.” (<a href="https://bibleox.com/ko/ko-ctb/kol/1/#L18">골로 1:18</a>)</p></blockquote><blockquote><p>“하느님께서는 만물을 그리스도의 발 아래 굴복시키셨으며 그분을 <strong>교회의 머리</strong>로 삼으셔서 모든 것을 지배하게 하셨습니다. <strong>교회는 그리스도의 몸</strong>이며 만물을 완성하시는 분의 계획이 그 안에서 완전히 이루어집니다.” (<a href="https://bibleox.com/ko/ko-ctb/ef/1/#L22-23">에페 1:22-23</a>)</p></blockquote><blockquote><p>“그리고 그들은 <strong>그리스도를 머리로 하는 몸</strong>의 지체가 아닙니다. 몸 전체는 각 마디와 힘줄을 통하여 영양을 받으며 서로 연결되어 하느님의 계획대로 자라나는 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/kol/2/#L19">골로 2:19</a>)</p></blockquote><h3>몸에는 그리스도 외에 다른 머리가 없습니다</h3><p>사도들과 주교들은 서로 동등합니다. 사도들은 자기들 가운데 누가 가장 큰지 자주 다투었습니다. 그리스도께서는 서로 위에 권력을 찾지 말라고 하셨습니다 [<a href="https://bibleox.com/ru/ru/w/церковь-епископы-равны">자세히</a>]:</p><blockquote><p>“<strong>제자들 사이에서 누구를 제일 높게 볼 것이냐는 문제로 옥신각신하는</strong> 것을 보시고 예수께서 이렇게 말씀하셨다. ‘이 세상의 왕들은 강제로 백성을 다스린다. 그리고 백성들에게 권력을 휘두르는 사람들은 백성의 은인으로 행세한다. <strong>그러나 너희는 그래서는 안 된다. 오히려 너희 중에서 제일 높은 사람은 제일 낮은 사람처럼 처신해야</strong> 하고 지배하는 사람은 섬기는 사람처럼 처신해야 한다.” (<a href="https://bibleox.com/ko/ko-ctb/lk/22/#L24-26">루가 22:24-26</a>)</p></blockquote><h3>몸의 지체들은 서로 다릅니다</h3><blockquote><p>“하느님께서는 교회 안에 다음과 같은 직책을 두셨습니다. 첫째는 <strong>사도</strong>요 둘째는 <strong>하느님의 말씀을 받아 전하는 사람</strong>이요 셋째는 <strong>가르치는 사람</strong>이요 다음은 <strong>기적을 행하는 사람</strong>이요 또 그 다음은 <strong>병 고치는 능력</strong>을 받은 사람, 남을 도와 주는 사람, 지도하는 사람, <strong>이상한 언어</strong>를 말하는 사람 등입니다. 모두가 다 사도일 수는 없지 않겠습니까? 모두가 다 하느님의 말씀을 받아 전하는 사람일 수는 없지 않겠습니까? 모두가 다 가르치는 사람일 수는 없지 않겠습니까? 모두가 다 기적을 행할 수는 없지 않겠습니까? 모두가 다 병 고치는 능력을 받을 수는 없지 않겠습니까? 모두가 다 이상한 언어를 말할 수는 없지 않겠습니까? 모두가 다 <strong>해석하는 사람</strong>일 수는 없지 않겠습니까?” (<a href="https://bibleox.com/ko/ko-ctb/1kor/12/#L28-30">1고린 12:28-30</a>)</p></blockquote><blockquote><p>“<strong>몸은 한 지체로 된 것이 아니라 많은 지체로 되어 있습니다</strong>. 발이 ‘나는 손이 아니니까 몸에 딸리지 않았다’고 말한다 해서 발이 몸의 한 부분이 아니겠습니까? 또 귀가 ‘나는 눈이 아니니까 몸에 딸리지 않았다’고 말한다 해서 귀가 몸의 한 부분이 아니겠습니까? 만일 온 몸이 다 눈이라면 어떻게 들을 수 있겠습니까? 또 온 몸이 다 귀라면 어떻게 냄새를 맡을 수 있겠습니까? 그래서 하느님께서는 당신의 뜻대로 각각 다른 기능을 가진 여러 지체를 우리의 몸에 두셨습니다. 모든 지체가 다 같은 것이라면 어떻게 몸을 이룰 수 있겠습니까? 그래서 <strong>한 몸에 많은 지체가 있는 것입니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/12/#L14-20">1고린 12:14-20</a>)</p></blockquote><h2>지상 교회와 천상 교회의 일치 (그리스도의 한 몸)</h2><h3>하늘과 땅이 그리스도 안에서 결합됩니다</h3><blockquote><p>“우리 주 예수 그리스도의 아버지 하느님께 찬양을 드립니다. 하느님께서는 그리스도를 통해서 하늘의 온갖 영적 축복을 우리에게 베풀어 주셨습니다. &lt;…&gt; 당신의 심오한 뜻을 알게 해 주셨습니다. 이것은 그리스도를 시켜 이루시려고 하느님께서 미리 세워 놓으셨던 계획대로 된 것으로서 <strong>때가 차면</strong> 이 계획이 이루어져서 <strong><mark>하늘과 땅에 있는 모든 것이 그리스도를 머리로 하고 하나가 될 것입니다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/ef/1/#L3,9-10">에페 1:3,9-10</a>)</p></blockquote><blockquote><p>“나는 <strong><mark>하늘과 땅에 있는 모든 가족</mark></strong>에게 이름을 주신 하느님 아버지 앞에 무릎을 꿇고 기도드립니다. (14절과 같음)” (<a href="https://bibleox.com/ko/ko-ctb/ef/3/#L14-15">에페 3:14-15</a>)</p></blockquote><blockquote><p>“그리스도는 또한 당신의 몸인 교회의 머리이십니다. 그분은 모든 것의 시작이시고 죽은 자들 가운데서 살아나신 최초의 분이시며 만물의 으뜸이 되셨습니다. 하느님께서는 <strong>당신의 완전한 본질을 그리스도에게 기꺼이 주시고</strong> 그리스도를 내세워 <strong><mark>하늘과 땅의 만물을 당신과 화해시켜</mark></strong> 주셨습니다. 곧 십자가에서 흘리신 예수의 피로써 평화를 이룩하셨습니다.” (<a href="https://bibleox.com/ko/ko-ctb/kol/1/#L18-20">골로 1:18-20</a>)</p></blockquote><blockquote><p>“그리스도께서는 <strong><mark>죽은 자의 주님도 되시고 산 자의 주님도</mark></strong> 되시기 위해서 죽으셨다가 다시 살아 나셨습니다.” (<a href="https://bibleox.com/ko/ko-ctb/rim/14/#L9">로마 14:9</a>)</p></blockquote><h3>모든 지체의 유대와 서로에 대한 돌봄</h3><p>온몸은 여러 가지 유대로 묶여 있습니다:</p><blockquote><p>“도리어 우리는 사랑 가운데서 진리대로 살면서 여러 면에서 자라나, 머리이신 그리스도와 한 몸이 되어야 합니다. 우리의 몸은 각 부분이 자기 구실을 다함으로써 <strong><mark>각 마디로 서로 연결되고 얽혀서 영양분을 받아</mark></strong> 자라납니다. 그리스도를 머리로 하는 교회도 이와 같이 하여 사랑으로 자체를 완성해 나가는 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/ef/4/#L15-16">에페 4:15-16</a>)</p></blockquote><blockquote><p>“여러분은 겸손한 체하거나 천사를 숭배하는 자들에게 속아서 여러분이 받을 상을 빼앗기지 마십시오. 그들은 보이는 것에만 정신을 팔고 세속적인 생각으로 헛된 교만에 부풀어 있습니다. 그리고 그들은 그리스도를 머리로 하는 몸의 지체가 아닙니다. <strong><mark>몸 전체는 각 마디와 힘줄을 통하여 영양을 받으며 서로 연결되어</mark></strong> 하느님의 계획대로 자라나는 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/kol/2/#L18-19">골로 2:18-19</a>)</p></blockquote><p>모든 지체는 서로 알고 서로 돌봅니다:</p><blockquote><p>“그래서 하느님께서는 당신의 뜻대로 <strong>각각 다른 기능을 가진 여러 지체를</strong> 우리의 몸에 두셨습니다. 모든 지체가 다 같은 것이라면 어떻게 몸을 이룰 수 있겠습니까? 그래서 <strong>한 몸에 많은 지체가 있는 것입니다</strong>. 눈이 손더러 ‘너는 나에게 소용이 없다’고 말할 수도 없고 머리가 발더러 ‘너는 나에게 소용이 없다’고 말할 수도 없습니다. 그뿐만 아니라 몸 가운데서 다른 것들보다 약하다고 여겨지는 부분이 오히려 더 요긴합니다. 우리는 몸 가운데서 별로 중요하게 여기지 않는 부분을 더욱 조심스럽게 감싸고 또 보기 흉한 부분을 더 보기 좋게 꾸밉니다. 그러나 보기 좋은 지체들에게는 그렇게 할 필요가 없습니다. 이렇게 하느님께서도 변변치 못한 부분을 더 귀중하게 여겨 주셔서 몸의 조화를 이루게 해 주셨습니다. 이것은 <strong>몸 안에 분열이 생기지 않고</strong> <strong><mark>모든 지체가 서로 도와 나가도록</mark></strong> 하시려는 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/12/#L18-25">1고린 12:18-25</a>)</p></blockquote><h3>지상의 교회는 싸우는 교회입니다</h3><blockquote><p>“<strong>정신을 바짝 차리고 깨어 있으십시오</strong>. <strong>여러분의 원수인 악마가 으르렁대는 사자처럼 먹이를 찾아 돌아 다닙니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/1pet/5/#L8">1베드 5:8</a>)</p></blockquote><blockquote><p>“<strong>속임수를 쓰는 악마에 대항할 수 있도록</strong> 하느님께서 주시는 무기로 완전무장을 하십시오. <strong>우리가 대항하여 싸워야 할 원수들은</strong> 인간이 아니라 권세와 세력의 악신들과 암흑세계의 지배자들과 <strong>하늘의 악령들입니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/ef/6/#L11-12">에페 6:11-12</a>)</p></blockquote><blockquote><p>“<strong>이 땅 위에는 우리가 차지할 영원한 도성이 없습니다</strong>. 우리는 다만 앞으로 올 도성을 바라고 있을 뿐입니다.” (<a href="https://bibleox.com/ko/ko-ctb/evr/13/#L14">히브 13:14</a>)</p></blockquote><h3>하늘의 교회는 승리한 교회입니다</h3><blockquote><p>“그러나 여러분이 와 있는 곳은 시온산이고 살아 계신 하느님의 도성이며 <strong>하늘의 예루살렘입니다. 거기에는 수많은 천사들이 있고</strong>, <strong><mark>잔치가 벌어져 있고</mark></strong> 또 <strong><mark>하늘에 등록된 장자들의 교회</mark></strong>가 있고 만민의 심판자이신 하느님이 계시고 <strong>완전히 올바른 사람들의 영혼</strong>이 있습니다.” (<a href="https://bibleox.com/ko/ko-ctb/evr/12/#L22-23">히브 12:22-23</a>)</p></blockquote><h2>교회는 눈에 보입니다</h2><p>교회는 사람들에게 숨겨질 수 없습니다.</p><blockquote><p>“너희는 세상의 빛이다. <strong><mark>산 위에 있는 마을은 드러나게 마련이다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/mf/5/#L14">마태 5:14</a>)</p></blockquote><p>하느님께서는 몸(교회)의 지체들을 분열이 없고 모두가 서로 돌보며 함께 아파하고 함께 기뻐하도록 배치하셨습니다:</p><blockquote><p>“유다인이든지 그리이스인이든 종이든 자유인이든 우리는 모두 <strong>한 성령으로 세례를 받아 한 몸이 되었고</strong> 같은 성령을 받아 마셨습니다. <strong>몸은 한 지체로 된 것이 아니라 많은 지체로 되어 있습니다</strong>. &lt;…&gt; <strong><mark>눈이 손더러 ‘너는 나에게 소용이 없다’고 말할 수도 없고 머리가 발더러 ‘너는 나에게 소용이 없다’고 말할 수도 없습니다</mark></strong>. 그뿐만 아니라 몸 가운데서 다른 것들보다 약하다고 여겨지는 부분이 오히려 더 요긴합니다. 우리는 몸 가운데서 별로 중요하게 여기지 않는 부분을 더욱 조심스럽게 감싸고 또 보기 흉한 부분을 더 보기 좋게 꾸밉니다. 그러나 보기 좋은 지체들에게는 그렇게 할 필요가 없습니다. 이렇게 <strong><mark>하느님께서도 변변치 못한 부분을 더 귀중하게 여겨 주셔서 몸의 조화를 이루게 해 주셨습니다</mark></strong>. 이것은 <strong><mark>몸 안에 분열이 생기지 않고</mark></strong> 모든 지체가 서로 도와 나가도록 하시려는 것입니다. <strong>한 지체가 고통을 당하면 다른 모든 지체도 함께 아파하지 않겠습니까? 또 한 지체가 영광스럽게 되면 다른 모든 지체도 함께 기뻐하지 않겠습니까</strong>?” (<a href="https://bibleox.com/ko/ko-ctb/1kor/12/#L13-14,21-26">1고린 12:13-14,21-26</a>)</p></blockquote><p>온몸은 여러 가지 유대로 묶여 있습니다:</p><blockquote><p>“도리어 우리는 사랑 가운데서 진리대로 살면서 여러 면에서 자라나, 머리이신 그리스도와 한 몸이 되어야 합니다. 우리의 몸은 각 부분이 자기 구실을 다함으로써 <strong><mark>각 마디로 서로 연결되고 얽혀서 영양분을 받아</mark></strong> 자라납니다. 그리스도를 머리로 하는 교회도 이와 같이 하여 사랑으로 자체를 완성해 나가는 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/ef/4/#L15-16">에페 4:15-16</a>)</p></blockquote><blockquote><p>“여러분은 겸손한 체하거나 천사를 숭배하는 자들에게 속아서 여러분이 받을 상을 빼앗기지 마십시오. 그들은 보이는 것에만 정신을 팔고 세속적인 생각으로 헛된 교만에 부풀어 있습니다. 그리고 그들은 그리스도를 머리로 하는 몸의 지체가 아닙니다. <strong><mark>몸 전체는 각 마디와 힘줄을 통하여 영양을 받으며 서로 연결되어</mark></strong> 하느님의 계획대로 자라나는 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/kol/2/#L18-19">골로 2:18-19</a>)</p></blockquote><p>교회에 판단을 청할 수 있습니다:</p><blockquote><p>“‘<strong>어떤 형제가 너에게 잘못한 일이 있거든</strong> 단 둘이 만나서 그의 잘못을 타일러 주어라. 그가 말을 들으면 형제 하나를 얻는 셈이다. &lt;…&gt; 그래도 그들의 말을 듣지 않거든 <strong><mark>교회에 알리고 교회의 말조차 듣지 않거든 그를 이방인이나 세리처럼 여겨라</mark></strong>.’” (<a href="https://bibleox.com/ko/ko-ctb/mf/18/#L15,17">마태 18:15,17</a>)</p></blockquote><p>교회의 경계에 관하여: <a href="https://bibleox.com/ru/ru/w/Церковь-видимое-единство">자세히</a>.</p><h2>교회는 무너지지 않습니다</h2><h3>교회는 패하지 않습니다</h3><blockquote><p>“잘 들어라. 너는 베드로이다. 내가 이 반석 위에 내 교회를 세울 터인즉 <strong><mark>죽음의 힘도 감히 그것을 누르지 못할 것이다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/mf/16/#L18">마태 16:18</a>) <em>(그리스어: “저승의 문들도”)</em></p></blockquote><h3>하느님께서는 언제나 교회와 함께 계십니다</h3><blockquote><p>“내가 아버지께 구하면 다른 협조자를 보내 주셔서 <strong><mark>너희와 영원히 함께 계시도록</mark></strong> 하실 것이다.” (<a href="https://bibleox.com/ko/ko-ctb/in/14/#L16">요한 14:16</a>)</p></blockquote><blockquote><p>“내가 너희에게 명한 모든 것을 지키도록 가르쳐라. 내가 <strong><mark>세상 끝날까지 항상 너희와 함께 있겠다</mark></strong>.‘” (<a href="https://bibleox.com/ko/ko-ctb/mf/28/#L20">마태 28:20</a>)</p></blockquote><h3>교회는 언제나 하느님을 찬양합니다</h3><blockquote><p>“하느님께서 <strong>교회와 그리스도 예수를 통하여</strong> <strong><mark>세세무궁토록 영광을 받으시기를</mark></strong> 빕니다. 아멘.” (<a href="https://bibleox.com/ko/ko-ctb/ef/3/#L21">에페 3:21</a>)</p></blockquote><h3>진리는 언제나 교회 안에 있습니다</h3><blockquote><p>“원로인 나는 선택받은 귀부인과 그 자녀들에게 이 편지를 씁니다. 나는 여러분을 진정으로 사랑합니다. 나뿐만 아니라 진리를 아는 모든 사람들이 여러분을 사랑합니다. 지금 우리 안에 있고 또 <strong><mark>영원히 우리와 함께 있을 진리</mark></strong> 때문에 우리는 여러분을 사랑합니다.” (<a href="https://bibleox.com/ko/ko-ctb/2in/1/#L1-2">2요한 1:1-2</a>)</p></blockquote><h2>교회의 깃발은 십자가입니다</h2><p>구약에서 이스라엘은 약속받은 나라로 가는 길에 십자가 모양으로 이동했습니다: <a href="https://bibleox.com/ru/ru/w/еврейский-стан-крест">자세히</a>. 옛 이스라엘은 그리스도의 교회, 곧 <a href="https://bibleox.com/ru/ru/w/церковь-новый-израиль">새 이스라엘</a>의 예표였습니다. 그래서 십자가는 교회의 주된 깃발이며, 승리와 화해의 상징이고, 제단(곧 위대한 성물)입니다: <a href="https://bibleox.com/ru/ru/w/крест">십자가에 관하여 자세히</a>.</p><p>초기 그리스도인들의 십자 성호 사용: <a href="https://bibleox.com/ru/ru/w/крестное-знамение">자세히</a>.</p><h2>교회가 창조된 날은 그리스도 부활 후 50일째입니다</h2><ol><li><p>세례를 통해 교회에 들어갑니다(<a href="https://bibleox.com/ko/ko-ctb/1kor/12/#L13">1고린 12:13</a>).</p></li><li><p>세례는 물과 성령으로 이루어집니다(<a href="https://bibleox.com/ko/ko-ctb/in/3/#L3,5-6">요한 3:3,5-6</a>).</p></li><li><p>성령 세례는 그리스도 부활 후 50일째에 처음으로 이루어집니다(<a href="https://bibleox.com/ko/ko-ctb/act/1/#L1-5,8-9">사도 1:1-5,8-9</a>).</p></li></ol><h3>세례를 통해 교회에 들어갑니다</h3><blockquote><p>“유다인이든지 그리이스인이든 종이든 자유인이든 우리는 모두 <strong><mark>한 성령으로 세례를 받아 한 몸이 되었고</mark></strong> 같은 성령을 받아 마셨습니다.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/12/#L13">1고린 12:13</a>)</p></blockquote><blockquote><p>“<strong><mark>세례를 받아서 그리스도 안으로 들어 간 여러분은 모두 그리스도를 옷 입듯이 입었습니다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/gal/3/#L27">갈라 3:27</a>)</p></blockquote><h3>세례는 물과 성령으로 나는 것입니다</h3><blockquote><p>“정말 잘 들어 두어라. <strong><mark>물과 성령으로 새로 나지 않으면 아무도 하느님 나라에 들어 갈 수 없다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/in/3/#L5">요한 3:5</a>)</p></blockquote><h3>그리스도께서 성령으로 세례를 베푸실 것입니다</h3><blockquote><p>“그러나 요한은 모든 사람에게 이렇게 말하였다. ‘나는 너희에게 물로 세례를 베풀지만 이제 멀지 않아 <strong><mark>성령과 불로 세례를 베푸실 분이 오신다</mark></strong>. 그분은 나보다 더 훌륭한 분이어서 나는 그분의 신발끈을 풀어 드릴 자격조차 없다.” (<a href="https://bibleox.com/ko/ko-ctb/lk/3/#L16">루가 3:16</a>; <a href="https://bibleox.com/ko/ko-ctb/mf/3/#L11">마태 3:11</a>; <a href="https://bibleox.com/ko/ko-ctb/mk/1/#L8">마르 1:8</a>)</p></blockquote><h3>그리스도께서 떠나시기 전에는 성령께서 오시지 않습니다</h3><blockquote><p>“그러나 사실은 내가 떠나 가는 것이 너희에게는 더 유익하다. <strong><mark>내가 떠나 가지 않으면 그 협조자가 너희에게 오시지 않을 것이다</mark></strong>. 그러나 내가 가면 그분을 보내겠다.” (<a href="https://bibleox.com/ko/ko-ctb/in/16/#L7">요한 16:7</a>; <a href="https://bibleox.com/ko/ko-ctb/in/14/#L16">요한 14:16</a>; <a href="https://bibleox.com/ko/ko-ctb/in/14/#L26">요한 14:26</a>)</p></blockquote><blockquote><p>“<strong><mark>내가 아버지께 청하여 너희에게 보낼 협조자</mark></strong> 곧 아버지께로부터 나오시는 진리의 성령이 오시면 그분이 나를 증언할 것이다.” (<a href="https://bibleox.com/ko/ko-ctb/in/15/#L26">요한 15:26</a>)</p></blockquote><blockquote><p>“나는 내 아버지께서 약속하신 것을 너희에게 보내 주겠다. 그러니 너희는 <strong>위에서 오는 능력을 받을 때까지 예루살렘에 머물러 있어라</strong>‘하고 말씀하셨다.” (<a href="https://bibleox.com/ko/ko-ctb/lk/24/#L49">루가 24:49</a>)</p></blockquote><h3>부활 후에도 그리스도께서는 아직 아버지께 올라가지 않으셨습니다</h3><blockquote><p>“예수께서는 마리아에게 ‘<strong><mark>내가 아직 아버지께 올라 가지 않았으니</mark></strong> 나를 붙잡지 말고 어서 내 형제들을 찾아 가거라. 그리고 나는 내 아버지이며 너희의 아버지 곧 내 하느님이며 너희의 하느님이신 분께 올라 간다고 전하여라’하고 일러 주셨다.” (<a href="https://bibleox.com/ko/ko-ctb/in/20/#L17">요한 20:17</a>)</p></blockquote><h3>그리스도께서 약속하신 일이 부활 후 50일째에 이루어집니다</h3><p>약속된 성령 세례는 그리스도 부활 후 50일째에 처음으로 이루어졌습니다:</p><blockquote><p>“이 책을 데오필로님께 드린다. 나는 먼젓번 책에서 예수의 모든 행적과 가르치심을 다 기록하였다. 곧 예수께서 당신이 뽑으신 사도들에게 성령의 힘으로 여러 가지 지시를 내리신 다음 승천하신 그 날까지의 일을 시초에서부터 낱낱이 기록하였다. 예수께서는 돌아 가신 뒤에 다시 살아나셔서 <strong><mark>사십 일 동안 사도들에게 자주 나타나시어</mark></strong> 여러 가지 확실한 증거로써 당신이 여전히 살아 계시다는 것을 보여 주시며 하느님 나라에 관한 말씀을 들려 주셨다. 예수께서는 사도들과 함께 계신 자리에서 이렇게 말씀하셨다. ‘<strong><mark>너희는 예루살렘을 떠나지 말고 내가 전에 일러 준 아버지의 약속을 기다려라. 요한은 물로 세례를 베풀었지만 오래지 않아 너희는 성령으로 세례를 받게 될 것이다</mark></strong>.’ &lt;…&gt; 그러나 성령이 너희에게 오시면 너희는 힘을 받아 예루살렘과 온 유다와 사마리아뿐만 아니라 땅 끝에 이르기까지 어디에서나 나의 증인이 될 것이다.‘ 예수께서는 이 말씀을 하시고 사도들이 보는 앞에서 승천하셨는데 마침내 구름에 싸여 그 모습이 보이지 않게 되셨다.” (<a href="https://bibleox.com/ko/ko-ctb/act/1/#L1-5,8-9">사도 1:1-5,8-9</a>)</p></blockquote><blockquote><p>“<strong>마침내 오순절이 되어</strong> 신도들이 모두 한 곳에 모여 있었는데 &lt;…&gt; 그러자 <strong><mark>혀 같은 것들이 나타나 불길처럼 갈라지며 각 사람 위에 내렸다. 그들의 마음은 성령으로 가득 차서</mark></strong> 성령이 시키시는 대로 여러 가지 외국어로 말을 하기 시작하였다.” (<a href="https://bibleox.com/ko/ko-ctb/act/2/#L1,3-4">사도 2:1,3-4</a>)</p></blockquote><h3>그러나 그리스도 부활 당일에도 성령의 파견이 언급되지만 세례는 언급되지 않습니다</h3><p>여기서 사도들에게 교회의 권위가 주어지고 사제 품계가 세워집니다:</p><blockquote><p>“<strong>안식일 다음 날 이른 새벽</strong>의 일이었다. 아직 어두울 때에 막달라 여자 마리아가 무덤에 가 보니 무덤을 막았던 돌이 이미 치워져 있었다. &lt;…&gt; <strong>안식일 다음 날 저녁에</strong> 제자들은 유다인들이 무서워서 어떤 집에 모여 문을 모두 닫아 걸고 있었다. 그런데 <strong>예수께서 들어 오셔서</strong> 그들 한 가운데 서시며 ‘너희에게 평화가 있기를!’하고 인사하셨다. &lt;…&gt; 이렇게 말씀하신 다음 예수께서는 그들에게 <strong>숨을 내쉬시며 말씀을 계속하셨다. ‘성령을 받아라</strong>. 누구의 죄든지 너희가 용서해 주면 그들의 죄는 용서받을 것이고 용서해 주지 않으면 용서받지 못한 채 남아 있을 것이다.’” (<a href="https://bibleox.com/ko/ko-ctb/in/20/#L1,19,22-23">요한 20:1,19,22-23</a>)</p></blockquote><h2>비판</h2><h3>“역사적 교회는 타락했다”</h3><p>교회에서 떨어져 나온 단체의 설립자들은 그리스도의 역사적 교회가 하느님에게서 벗어나 타락했으므로 자신들의 별도 단체가 필요했다는 주장 위에 자기 운동의 존재 모델을 세웁니다. 교회의 타락을 증명하지 못하면 그들의 별도 단체도 필요 없게 되고, 그리스도의 역사적 교회에 들어가야 합니다.</p><p>교회의 타락이라는 생각을 뒷받침하려고 이리에 관한 이런 구절을 자주 듭니다:</p><blockquote><p>“<strong><mark>내가 떠나가면 사나운 이리떼가 여러분 가운데 들어 와 양떼를 마구 헤칠 것이며 여러분 가운데서도 진리를 그르치는 말을 하며 신도들을 이탈시켜 자기를 따르라고 할 사람들이 생겨날 것은 분명합니다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/act/20/#L29-30">사도 20:29-30</a>)</p></blockquote><p>그러나 이 구절은 사람들을 교회에서 빼내어 <strong>자기를</strong> 따르게 하려는 거짓 교사들이 나타나리라는 예언일 뿐, 교회가 타락하리라는 예언이 아니라는 것을 인정해야 합니다.</p><p>그 조금 앞에서 사도는 원로(사제)들에게 자신과 양떼를 잘 살피라고 당부합니다:</p><blockquote><p>“밀레도스에서 바울로는 에페소에 사람을 보내어 그 <strong>교회 원로들을 불렀다</strong>. &lt;…&gt; 여러분은 늘 <strong><mark>자신을 살피며 성령께서 맡겨 주신 양떼를 잘 돌보시오</mark></strong>. 성령께서는 여러분을 감독으로 세우셔서 하느님께서 당신 아드님의 피로 값을 치르고 얻으신 당신의 <strong>교회를 보살피게 하셨습니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/act/20/#L17,28">사도 20:17,28</a>)</p></blockquote><p>사도는 왜 양떼를 돌보라고 합니까? 곧바로 답을 줍니다. 거짓 교사들이 나타나 이리처럼 교회의 양떼를 약탈하려 할 것이기 때문입니다(<a href="https://bibleox.com/ko/ko-ctb/act/20/#L29-30">사도 20:29-30</a>). 그러나 성령께서 세우신 원로들은 이를 허용해서는 안 됩니다.</p><p>원로들은 교회의 양떼를 지켜 낼 수 있을까요? 그렇습니다. 교회의 타락에 관한 예언은 없지만 교회가 패하지 않는다는 예언은 있기 때문입니다:</p><blockquote><p>“잘 들어라. 너는 베드로이다. 내가 이 반석 위에 내 <strong>교회</strong>를 세울 터인즉 <strong><mark>죽음의 힘도 감히 그것을 누르지 못할 것이다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/mf/16/#L18">마태 16:18</a>)</p></blockquote><blockquote><p>“하느님께서 <strong>교회</strong>와 그리스도 예수를 통하여 <strong><mark>세세무궁토록</mark></strong> 영광을 받으시기를 빕니다. 아멘.” (<a href="https://bibleox.com/ko/ko-ctb/ef/3/#L21">에페 3:21</a>)</p></blockquote><blockquote><p>“내가 너희에게 명한 모든 것을 지키도록 가르쳐라. 내가 <strong><mark>세상 끝날까지 항상 너희와 함께 있겠다</mark></strong>.‘” (<a href="https://bibleox.com/ko/ko-ctb/mf/28/#L20">마태 28:20</a>)</p></blockquote><blockquote><p>“내가 아버지께 구하면 다른 협조자를 보내 주셔서 <strong><mark>너희와 영원히 함께 계시도록</mark></strong> 하실 것이다.” (<a href="https://bibleox.com/ko/ko-ctb/in/14/#L16">요한 14:16</a>)</p></blockquote><h3>“기도하려고 모인 두세 사람이 곧 교회이다”</h3><p>그리스도께서 당신의 교회를 단번에 세우신 뒤로, 나중에 그리스도교 공동체를 세우는 사람들은 무엇보다 그리스도의 교회와 분리된 자기 새 단체의 출현을 설명해야 합니다. 평범한 사람이 최근에 세운 그런 단체는 초기 그리스도인들과 직접적인 역사적 연결이 없으므로, 자기들이 2000년 전에 세워진 그리스도의 교회의 일부임을 늘 증명해야 합니다. 그래서 공동 기도의 중요성에 관한 성경 구절을 자주 이용합니다. 기도하는 두세 사람 가운데 그리스도께서 계시니 그렇게 기도하는 사람들은 이미 그 자체로 교회라는 것입니다:</p><blockquote><p>“‘내가 다시 말한다. 너희 중의 두 사람이 이 세상에서 마음을 모아 구하면 하늘에 계신 내 아버지께서는 무슨 일이든 다 들어 주실 것이다. <strong>단 두세 사람이라도 내 이름으로 모인 곳에는 나도 함께 있기 때문이다</strong>.’” (<a href="https://bibleox.com/ko/ko-ctb/mf/18/#L19-20">마태 18:19-20</a>)</p></blockquote><p>그러나 이 구절은 글자 그대로 공동 기도의 힘을 말할 뿐, 교회를 말하지 않습니다. 여기에는 교회라는 말이 없습니다. 그러나 조금 앞에는 교회에 관한 말씀이 있습니다:</p><blockquote><p>“‘어떤 형제가 <strong>너에게</strong> 잘못한 일이 있거든 <strong>단 둘이 만나서</strong> 그의 잘못을 타일러 주어라. 그가 말을 들으면 형제 하나를 얻는 셈이다. 그러나 듣지 않거든 <strong>한 사람이나 두 사람을 더</strong> 데리고 가라. 그리하여 두 사람이나 세 사람의 증언을 들어 확정하라는 말씀대로 모든 사실을 밝혀라. <strong><mark>그래도 그들의 말을 듣지 않거든 교회에 알리고 교회의 말조차 듣지 않거든</mark></strong> 그를 이방인이나 세리처럼 여겨라.’” (<a href="https://bibleox.com/ko/ko-ctb/mf/18/#L15-17">마태 18:15-17</a>)</p></blockquote><p>여기서 만나는 사람들은 다음과 같습니다:</p><ul><li><p>나;</p></li><li><p>죄지은 형제;</p></li><li><p>증인 한두 사람.</p></li></ul><p>모두 합하면 1+1+2=4명, 적어도 3명입니다.</p><p>이렇게 모인 세 사람은 아직 교회가 아닙니다. 보시다시피 이들 모두는 자기들 스스로가 아니라 교회에 판단을 청해야 하기 때문입니다. 그러므로 교회는 기도하려고 모인 두세 사람이 아니라, 판단을 청할 수 있고 그 대답을 듣고 따르거나 따르지 않을 수 있는, 늘 눈에 보이게 존재하는 어떤 것입니다. 교회의 이 대답을 듣지 않는 사람은 교회의 지체들에게 “이방인이나 세리처럼” 됩니다.</p><p>판단은 누가 할 수 있습니까? 사도들과 그 후계자인 주교들입니다(<a href="https://bibleox.com/ko/ko-ctb/mf/18/#L18">마태 18:18</a>). 예를 들어 디모테오 주교입니다:</p><blockquote><p>“<strong>두 사람이나 세 사람의 증인이 없이는 원로에 대한 고발을 들어 주지 마시오</strong>. 죄를 짓는 사람들을 모든 사람 앞에서 징계하여 다른 사람들까지도 두려운 마음을 가지게 하시오.” (<a href="https://bibleox.com/ko/ko-ctb/1tim/5/#L19-20">1디모 5:19-20</a>)</p></blockquote><p>그러므로 남을 판단할 권리가 없는 기도하는 두세 사람에 관한 해석은 교회에 해당하지 않습니다. 또 교회에서 분리된 단체의 설립자는 교회의 말을 듣지 않음으로써 스스로 교회에게 “이방인이나 세리처럼” 됩니다(<a href="https://bibleox.com/ko/ko-ctb/mf/18/#L17">마태 18:17</a>). 그가 자기 단체에서 누구를 판단하겠습니까? 자신에게 있었던 적도 없는 판단의 권한을 어떻게 줄 수 있겠습니까? 답은 분명합니다.</p>'
