- src: X7l9DcTY_Спасение_возможно_только_в_Церкви
  path: Sb4k_구원은_그리스도의_교회_안에서만_가능합니다
  title: 구원은 그리스도의 교회 안에서만 가능합니다
  copy_cover: true
  body: '<h2>기도, 예언, 기적은 구원의 표지가 아닙니다</h2><blockquote><p>“‘<strong><mark>나더러 주님, 주님 하고 부른다고 다 하늘 나라에 들어 가는 것이 아니다</mark></strong>. 하늘에 계신 내 아버지의 뜻을 실천하는 사람이라야 들어 간다. 그 날에는 많은 사람이 나를 보고 주님, 주님! 우리가 주님의 이름으로 <strong>예언을 하고</strong> 주님의 이름으로 <strong>마귀를 쫓아 내고</strong> 또 주님의 이름으로 <strong>많은 기적을 행하지</strong> 않았습니까? 하고 말할 것이다. 그러나 그 때에 나는 분명히 그들에게 악한 일을 일삼는 자들아, 나에게서 물러가라. <strong><mark>나는 너희를 도무지 알지 못한다</mark></strong> 고 말할 것이다.’” (<a href="https://bibleox.com/ko/ko-ctb/mf/7/#L21-23">마태 7:21-23</a>)</p></blockquote><blockquote><p>“예수께서는 이렇게 대답하셨다. ‘<strong>앞으로 많은 사람이 내 이름을 내세우며 나타나서</strong> 내가 바로 그리스도다! 혹은 때가 왔다! 하고 떠들더라도 <strong>속지 않도록 조심하고 그들을 따라 가지 말라</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/lk/21/#L8">루가 21:8</a>; <a href="https://bibleox.com/ko/ko-ctb/mf/24/#L5">마태 24:5</a>; <a href="https://bibleox.com/ko/ko-ctb/mk/13/#L6">마르 13:6</a>)</p></blockquote><h2>구원을 받으려면 그리스도의 몸(교회)의 지체가 되어야 합니다</h2><p>교회는 그리스도의 몸입니다:</p><blockquote><p>“그래서 나는, 여러분을 위하여 기꺼이 고통을 겪고 있습니다. 그리고 나는 <strong><mark>그리스도의 몸인 교회</mark></strong>를 위하여 그리스도의 남은 고난을 내 몸으로 채우고 있습니다.” (<a href="https://bibleox.com/ko/ko-ctb/kol/1/#L24">골로 1:24</a>)</p></blockquote><p>그리스도께서는 몸, 곧 교회의 구세주이십니다:</p><blockquote><p>“그리스도께서 <strong><mark>당신의 몸인 교회의 구원자</mark></strong>로서 그 교회의 머리가 되시는 것처럼 남편은 아내의 주인이 됩니다.” (<a href="https://bibleox.com/ko/ko-ctb/ef/5/#L23">에페 5:23</a>)</p></blockquote><p>구원의 문은 그리스도이십니다:</p><blockquote><p>“<strong><mark>나는 문이다. 누구든지 나를 거쳐서 들어 오면 안전할뿐더러</mark></strong> 마음대로 드나들며 좋은 풀을 먹을 수 있다. 도둑은 다만 양을 훔쳐다가 죽여서 없애려고 오지만 나는 양들이 생명을 얻고 더 얻어 풍성하게 하려고 왔다.‘” (<a href="https://bibleox.com/ko/ko-ctb/in/10/#L9-10">요한 10:9-10</a>) <em>(그리스어: “구원을 받고”)</em></p></blockquote><p>주님께서는 구원받는 이들을 교회에 더해 주셨습니다:</p><blockquote><p>“하느님을 찬양하였다. 이것을 보고 모든 사람이 그들을 우러러 보게 되었다. 주께서는 <strong><mark>구원받을 사람을 날마다 늘려 주셔서 신도의 모임이 커 갔다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/act/2/#L47">사도 2:47</a>)</p></blockquote><p>몸 밖에 있는 사람은 열매를 맺을 수 없고, 버려져 불에 던져집니다:</p><blockquote><p>“<strong><mark>너희는 나를 떠나지 말라. 나도 너희를 떠나지 않겠다. 포도나무에 붙어 있지 않는 가지가 스스로 열매를 맺을 수 없는</mark></strong> 것처럼 너희도 나에게 붙어 있지 않으면 열매를 맺지 못할 것이다. 나는 포도 나무요 너희는 가지다. 누구든지 나에게서 떠나지 않고 내가 그와 함께 있으면 그는 많은 열매를 맺는다. <strong>나를 떠나서는 너희가 아무것도 할 수 없다</strong>. <strong><mark>나를 떠난 사람은 잘려 나간 거지처럼 밖에 버려져</mark></strong> 말라 버린다. 그러면 <strong>사람들이 이런 가지를 모아다가 불에 던져</strong> 태워 버린다.” (<a href="https://bibleox.com/ko/ko-ctb/in/15/#L4-6">요한 15:4-6</a>)</p></blockquote><blockquote><p>“이 예수는 집짓는 사람들 곧 여러분에게 버림을 받았지만 모퉁이의 머릿돌이 되신 분입니다. <strong><mark>이분을 힘입지 않고는 아무도 구원받을 수 없습니다</mark></strong>. 사람에게 주신 이름 가운데 우리를 구원할 수 있는 이름은 이 이름밖에는 없습니다.‘” (<a href="https://bibleox.com/ko/ko-ctb/act/4/#L11-12">사도 4:11-12</a>)</p></blockquote><p>그리스도와 함께하지 않는 사람은 그분을 반대하는 사람입니다:</p><blockquote><p>“<strong>내 편에 서지 않는 사람은 나를 반대하는 사람이며</strong> 나와 함께 모아 들이지 않는 사람은 헤치는 사람이다.‘” (<a href="https://bibleox.com/ko/ko-ctb/lk/11/#L23">루가 11:23</a>)</p></blockquote><h2>그리스도의 몸(교회)에 결합됩니다</h2><h3>세례</h3><blockquote><p>“유다인이든지 그리이스인이든 종이든 자유인이든 우리는 모두 <strong><mark>한 성령으로 세례를 받아 한 몸이 되었고</mark></strong> 같은 성령을 받아 마셨습니다.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/12/#L13">1고린 12:13</a>)</p></blockquote><h3>성체성혈성사</h3><blockquote><p>“우리가 감사를 드리면서 그 축복의 잔을 마시는 것은 우리가 그리스도의 피를 나누어 머시는 것이 아니겠습니까?또 우리가 그 <strong>빵</strong>을 떼는 것은 <strong>그리스도의 몸을 나누어 먹는 것</strong>이 아니겠습니까? <strong><mark>빵은 하나이고 우리 모두가 그 한 덩어리의 빵을 나누어 먹는 사람들이니 비록 우리가 여럿이지만 모두 한 몸인 것입니다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/10/#L16-17">1고린 10:16-17</a>)</p></blockquote><h2>방주는 구원의 구약적 예표입니다</h2><blockquote><p>“야훼께서는 ‘<strong>내가 지어 낸 사람이지만, 땅 위에서 쓸어 버리리라</strong>. 공연히 사람을 만들었구나. 사람뿐 아니라 짐승과 땅 위를 기는 것과 공중의 새까지 모조리 없애 버리리라. 공연히 만들었구나’ 하고 탄식하셨다. &lt;…&gt; 하느님 보시기에 세상은 썩어 있었다. 그야말로 무법천지가 되어 있었다. 하느님 보시기에 세상은 속속들이 썩어, 사람들이 하는 일이 땅 위에 냄새를 피우고 있었다. 그래서 하느님께서는 노아에게 이렇게 말씀하셨다. ‘세상은 이제 막판에 이르렀다. 땅 위는 그야말로 무법천지가 되었다. 그래서 나는 <strong>저것들을 땅에서 다 쓸어 버리기로 하였다</strong>. <strong><mark>너는 전나무로 배 한 척을 만들어라</mark></strong>. 배 안에 방을 여러 칸 만들고 안과 밖을 역청으로 칠하여라. &lt;…&gt; 내가 이제 땅위에 폭우를 쏟으리라. <strong>홍수를 내어 하늘 아래 숨쉬는 동물은 다 쓸어 버리리라</strong>. <strong><mark>땅 위에 사는 것은 하나도 살아 남지 못 할 것이다</mark></strong>. 그러나 나는 너와 계약을 세운다. <strong>너는 네 아들들과 네 아내와 며느리들을 데리고 배에 들어 가거라</strong>. 그리고 목숨이 있는 온갖 동물도 암컷과 수컷으로 한 쌍씩 배에 데리고 들어 가 너와 함께 살아 남도록 하여라. 온갖 새와 온갖 집짐승과 땅 위를 기어 다니는 온갖 길짐승이 두 마리씩 너한테로 올 터이니 그것들을 살려 주어라. 그리고 너는 먹을 수 있는 온갖 양식을 가져다가 너와 함께 있는 사람과 동물들이 먹도록 저장해 두어라.’ 노아는 모든 일을 하느님께서 분부하신 대로 하였다.” (<a href="https://bibleox.com/ko/ko-ctb/gen/6/#L7,11-14,17-22">창 6:7,11-14,17-22</a>)</p></blockquote><blockquote><p>“새나 집짐승이나 들짐승이나 땅 위를 기던 벌레나 사람 등 <strong>땅 위에서 움직이던 모든 생물이 숨지고 말았다</strong>. <strong>마른 땅 위에서 코로 숨쉬며 살던 것들이 다 죽고 말았다</strong>. 이렇게 야훼께서는 사람을 비롯하여 모든 짐승들, 길짐승과 새에 이르기까지 <strong>땅 위에서 살던 모든 생물을 쓸어 버리셨다</strong>. 이렇게 땅에 있던 것이 다 쓸려 갔지만, <strong><mark>노아와 함께 배에 있던 사람과 짐승만은 살아 남았다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/gen/7/#L21-23">창 7:21-23</a>)</p></blockquote><blockquote><p>“그들은 옛날에 노아가 방주를 만들었을 때 하느님께서 오래 참고 기다리셨지만 끝내 순종하지 않던 자들입니다. <strong><mark>그 방주에 들어 가 물에 빠지지 않고 구원을 받은 사람은 겨우 여덟 사람뿐이었습니다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/1pet/3/#L20">1베드 3:20</a>)</p></blockquote><h3>구약의 예표는 우리에게 교훈이 되라고 기록되었습니다</h3><blockquote><p>“<strong>그들이 이런 일들을 당함으로써</strong> 다른 사람들에게는 경고가 되었으며 그것이 <strong>기록에 남아서</strong> 이제 세상의 종말을 눈앞에 둔 <strong>우리에게는 교훈이 되었습니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/10/#L11">1고린 10:11</a>)</p></blockquote><h2>비판</h2><h3>“‘우리만 구원받고 다른 사람은 구원받지 못한다’는 말은 교만에서 나온 것이다”</h3><p>하느님께서는 일찍이 예언자 모세를 통해 구약의 교회를 세우시고 그 안에 당신 마음에 드는 질서를 세우셨습니다. 나중에 그 곁에 이주해 온 여러 민족으로 이루어진 사마리아 사람들이 생겨났습니다. 그들은 예언자 모세의 다섯 두루마리(토라)를 근거로 삼고 후대 저자들(예언자들)의 두루마리는 받아들이지 않은 채, 자기 나름의 질서를 가진 별도의 종교 단체를 스스로 만들어 자기 식으로 하느님을 믿으며 그리스도를 기다렸습니다. 그리스도께서는 사마리아 여인에게 이렇게 대답하십니다:</p><blockquote><p>“<strong>너희는 무엇인지도 모르고 예배하지만</strong> 우리는 우리가 예배드리는 분을 잘 알고 있다. <strong>구원은 유다인에게서 오기 때문이다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/in/4/#L22">요한 4:22</a>)</p></blockquote><p>그리스도께서는 교만해서 이렇게 말씀하셨습니까, 아니면 책에서 멋대로 만들어 낸 신앙을 가진 제멋대로의 단체에서는 정말 구원받을 수 없기 때문입니까?</p><p>사도가 분열과 이단을 포함한 육정의 일을 하는 사람들은 하느님 나라를 차지하지 못한다고 말할 때, 교만해서 그렇게 말합니까, 아니면 그런 죄를 지니고는 정말 하느님 나라를 차지할 수 없기 때문입니까?</p><blockquote><p>“<strong>육정이 빚어내는 일은 명백합니다</strong>. 곧 음행, 추행, 방탕, 우상 숭배, 마술, 원수맺는 것, 싸움, 시기, 분노, 이기심, <strong><mark>분열, 당파심</mark></strong>, 질투, 술주정, 흥청대며 먹고 마시는 것, 그 밖에 그와 비슷한 것들입니다. 내가 전에도 경고한 바 있지만 지금 또다시 경고합니다. 이런 짓을 일삼는 자들은 <strong><mark>결코 하느님 나라를 차지하지 못할 것입니다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/gal/5/#L19-21">갈라 5:19-21</a>) <em>(“분열”(διχοστασίαι)은 갈라짐, 쪼개짐을 뜻합니다. “당파심”(αἱρέσεις)은 그리스어로 “이단들”이라는 말입니다.)</em></p></blockquote><p>개신교인들이 여기서 교만을 보는 까닭은 그리스도를 개인의 구주로 인정하기만 하면 곧 구원을 받았다는, 곧 지금 당장 믿음만으로 구원받는다는 그들이 지어낸 가르침 때문입니다. 정교인에게는 이런 가르침이 없고, 구원에 대한 생각도 전혀 다릅니다(<a href="https://bibleox.com/ru/ru/w/спасение">자세히</a>).</p><p><a href="https://bibleox.com/ru/ru/w/Православная-Церковь">정교회</a>에 들어왔다고 해서 이미 구원받은 것이 아니라 구원받아 가는 중입니다. 교회에 온 사람이 모두 구원받는 것이 아니라, 구원의 수단을 사용하여 자기 자신과 부지런히 싸우며 죄스러운 정념을 뽑아내고 복음의 덕을 얻는 사람만 구원받습니다. <a href="https://bibleox.com/ru/ru/w/Православная-Церковь">정교회</a> 안에 있는 것은 구원의 조건 가운데 하나일 뿐입니다. 구원을 찾는 사람에게는 구원의 수단이 필요합니다. 병자에게는 약이, 대양 한가운데서 물에 빠진 사람에게는 배가 필요합니다. 마찬가지로 죄의 정념에 병든 모든 사람은 지상 생활의 바다를 건너 죄의 심연에 빠지지 않고 하느님과 함께하는 삶에 이르기 위해 <strong>구원의 수단, 곧 올바른 신앙과 은총이 가득한 성사</strong>가 필요합니다. 하느님께서는 이 구원의 수단을 당신의 구원의 방주, 곧 <a href="https://bibleox.com/ru/ru/w/Православная-Церковь">정교회</a> 안에 두셨고, 이 교회는 하느님이신 예수 그리스도께서 2000년 전에 친히 오셔서 세우셨습니다.</p><p>평범한 사람들이 최근에 멋대로 세운 공동체들은, 믿는 이들의 일치를 바라시는 하느님의 뜻을 정면으로 거슬러, 구원의 수단을 갖지 못했을 뿐 아니라 오히려 그 분리된 존재 자체로 사람들을 무거운 죄의 상태, 곧 이단과 분열이라는 죽을죄로 이끕니다(<a href="https://bibleox.com/ko/ko-ctb/gal/5/#L19-21">갈라 5:19-21</a>).</p><p>자기 “교회”를 세우는 것, 믿는 이들을 갈라놓는 것은 믿는 이들의 일치를 바라시는 그리스도와 사도들의 뜻을 정면으로 거스르는 일이며, 바로 이것이 교만의 표현입니다:</p><blockquote><p>“나는 이 사람들만을 위하여 간구하는 것이 아니라 이 사람들의 말을 듣고 나를 믿는 사람들을 위하여 <strong><mark>간구합니다</mark></strong>. 아버지, <strong><mark>이 사람들이 모두 하나가 되게 하여 주십시오</mark></strong>. 아버지께서 내 안에 계시고 내가 아버지 안에 있는 것과 같이 <strong><mark>이 사람들도 우리들 안에 있게 하여 주십시오. 그러면 아버지께서 나를 보내셨다는 것을 세상이 믿게 될 것입니다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/in/17/#L20-21">요한 17:20-21</a>)</p></blockquote><blockquote><p>“형제 여러분, 나는 우리 주 예수 그리스도의 이름으로 여러분에게 <strong><mark>호소합니다</mark></strong>. <strong><mark>여러분은 모두 의견을 통일시켜 갈라지지 말고 같은 생각과 같은 뜻으로 굳게 단합하십시오</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/1/#L10">1고린 1:10</a>)</p></blockquote><p>물론 그리스도와 원수가 되어 자기 “교회”를 세우면서 구원받을 수는 없습니다. 사도도 이단과 분열 가운데서 육정의 일을 하면 하늘 나라를 차지할 수 없다고 말합니다:</p><blockquote><p>“<strong>육정이 빚어내는 일은 명백합니다</strong>. 곧 음행, 추행, 방탕, 우상 숭배, 마술, 원수맺는 것, 싸움, 시기, 분노, 이기심, <strong><mark>분열, 당파심</mark></strong>, 질투, 술주정, 흥청대며 먹고 마시는 것, 그 밖에 그와 비슷한 것들입니다. 내가 전에도 경고한 바 있지만 지금 또다시 경고합니다. 이런 짓을 일삼는 자들은 <strong><mark>결코 하느님 나라를 차지하지 못할 것입니다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/gal/5/#L19-21">갈라 5:19-21</a>) <em>(“분열”(διχοστασίαι)은 갈라짐, 쪼개짐을 뜻합니다. “당파심”(αἱρέσεις)은 그리스어로 “이단들”이라는 말입니다.)</em></p></blockquote><p>사도는 분열을 일으키는 사람들이 주 예수 그리스도를 섬기지 않는다고 직접 말합니다:</p><blockquote><p>“형제 여러분, 여러분이 배운 교훈과는 달리 <strong><mark>남들을 분열시키고 죄짓게 하는 사람들을 경계하고 멀리하시기 바랍니다</mark></strong>. <strong><mark>그런 자들은 우리 주 예수 그리스도를 섬기는 것이 아니라</mark></strong> 자기네 뱃속을 채우고 있으며 그럴 듯한 말과 아첨하는 언사로 순진한 사람들의 마음을 유혹하고 있는 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/rim/16/#L17-18">로마 16:17-18</a>)</p></blockquote><p>그리스도를 거슬러 행동하는 사람을 뒤따라가면서 어떻게 구원받을 수 있겠습니까?</p><p>게다가 이단과 분열만이 죄는 아닙니다. 다른 <a href="https://bibleox.com/ru/ru/w/смертный-грех">죽을죄</a>도 많습니다. 술 취함이라는 죽을죄에 머물러서는 성경 말씀대로 하늘 나라를 차지할 수 없다고 술꾼에게 경고하는 것이 교만입니까(<a href="https://bibleox.com/ko/ko-ctb/1kor/6/#L9">1고린 6:9</a>)? 살인자, 도둑, 마술사, 음행하는 자, 속이는 자에게 같은 말을 하는 것이 교만입니까? 이것이 교만이 아니고 우리가 이 죽을죄들을 경고해야 한다면(<a href="https://bibleox.com/ko/ko-ctb/ef/5/#L11">에페 5:11</a>), 정직하게 말해 이단자와 분열자에게도 경고해야 합니다. 이단과 분열은 술 취함, 살인 등과 같은 죽을죄의 목록에 들어 있고, 거기에 머물러서는 사람이 하늘 나라를 차지할 수 없기 때문입니다.</p><p>그러면 사람은 이 죄의 상태에서 어떻게 벗어날 수 있습니까? 평범한 사람이 최근에 세운 단체에 머무는 것을 그만두고, 그 사람이 최근에 지어낸 그 단체의 신앙을 버려야 합니다. 그런 다음 주 예수 그리스도께서 세우신 <a href="https://bibleox.com/ru/ru/w/Православная-Церковь">정교회</a>에 들어와, 그리스도께서 사도들에게 가르치시고 사도들이 <a href="https://bibleox.com/ru/ru/w/Православная-Церковь">정교회</a>에 맡겼으며 교회에 영원히 파견되신 성령께서 그리스도의 교회 안에 변함없이 지켜 주시는 정교 신앙을 받아들여야 합니다:</p><blockquote><p>“내가 아버지께 구하면 다른 협조자를 보내 주셔서 <strong><mark>너희와 영원히 함께 계시도록</mark></strong> 하실 것이다.” (<a href="https://bibleox.com/ko/ko-ctb/in/14/#L16">요한 14:16</a>)</p></blockquote><blockquote><p>“내가 너희에게 명한 모든 것을 지키도록 가르쳐라. 내가 <strong><mark>세상 끝날까지 항상 너희와 함께 있겠다</mark></strong>.‘” (<a href="https://bibleox.com/ko/ko-ctb/mf/28/#L20">마태 28:20</a>)</p></blockquote>'
