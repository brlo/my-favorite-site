  title: 교회에는 처음부터 충만한 진리가 주어졌습니다
  copy_cover: true
  body: <h2>참된 가르침은 이미 단번에 교회에 주어졌습니다</h2><blockquote><p>“사랑하는 자들아 우리가 일반으로 받은 구원에 관하여 내가 너희에게 편지하려는 생각이 간절하던 차에 <strong><mark>성도에게 단번에 주신 믿음의 도를 위하여 힘써 싸우라</mark></strong>는 편지로 너희를 권하여야 할 필요를 느꼈노니” (<a href="https://bibleox.com/ko/ko-nkrv/iud/1/#L3">유 1:3</a>)</p></blockquote><blockquote><p>“<strong><mark>너희는 처음부터 들은 것을 너희 안에 거하게 하라</mark></strong> <strong><mark>처음부터 들은 것이 너희 안에 거하면</mark></strong> 너희가 아들과 아버지 안에 거하리라” (<a href="https://bibleox.com/ko/ko-nkrv/1in/2/#L24">요일 2:24</a>)</p></blockquote><p>그래서 교회를 충만이라고 부릅니다:</p><blockquote><p>“또 만물을 그의 발 아래에 복종하게 하시고 그를 만물 위에 교회의 머리로 삼으셨느니라 <strong><mark>교회는 그의 몸이니 만물 안에서 만물을 충만하게 하시는 이의 충만함이니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ef/1/#L22-23">엡 1:22-23</a>)</p></blockquote><p>교회는 이 진리를 굳게 세웁니다:</p><blockquote><p>“만일 내가 지체하면 너로 하여금 하나님의 집에서 어떻게 행하여야 할지를 알게 하려 함이니 이 집은 살아 계신 하나님의 교회요 <strong><mark>진리의 기둥과 터니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1tim/3/#L15">딤전 3:15</a>)</p></blockquote><h2>참된 가르침은 하느님이신 그리스도께서 친히 드러내어 주셨습니다</h2><p>그리스도께서는 이 가르침을 아버지에게서 받아 전해 주셨습니다:</p><blockquote><p>“나는 <strong>아버지께서 내게 주신 말씀들을 그들에게 주었사오며</strong> 그들은 이것을 받고 내가 아버지께로부터 나온 줄을 참으로 아오며 아버지께서 나를 보내신 줄도 믿었사옵나이다” (<a href="https://bibleox.com/ko/ko-nkrv/in/17/#L8">요 17:8</a>)</p></blockquote><p>그리스도께서 주신 바로 그 가르침 안에 머물러야 합니다:</p><blockquote><p>“지나쳐 그리스도의 교훈 안에 거하지 아니하는 자는 다 하나님을 모시지 못하되 <strong>교훈 안에 거하는 그 사람은 아버지와 아들을 모시느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2in/1/#L9">요이 1:9</a>)</p></blockquote><h2>다르게 가르쳐서는 안 됩니다</h2><blockquote><p>“내가 마게도냐로 갈 때에 너를 권하여 에베소에 머물라 한 것은 <strong><mark>어떤 사람들을 명하여</mark></strong> <strong><mark>다른 교훈을 가르치지 말며</mark></strong> 신화와 족보에 끝없이 몰두하지 말게 하려 함이라 이런 것은 믿음 안에 있는 하나님의 경륜을 이룸보다 도리어 변론을 내는 것이라” (<a href="https://bibleox.com/ko/ko-nkrv/1tim/1/#L3-4">딤전 1:3-4</a>)</p></blockquote><blockquote><p>“또 네가 많은 증인 앞에서 <strong><mark>내게 들은 바를 충성된 사람들에게 부탁하라</mark></strong> 그들이 또 다른 사람들을 가르칠 수 있으리라” (<a href="https://bibleox.com/ko/ko-nkrv/2tim/2/#L2">딤후 2:2</a>)</p></blockquote><blockquote><p>“너희가 모든 일에 나를 기억하고 또 <strong><mark>내가 너희에게 전하여 준 대로 그 전통을 너희가 지키므로</mark></strong> 너희를 칭찬하노라” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/11/#L2">고전 11:2</a>)</p></blockquote><blockquote><p>“형제들아 내가 너희에게 전한 복음을 너희에게 알게 하노니 이는 너희가 받은 것이요 또 그 가운데 선 것이라 너희가 만일 <strong><mark>내가 전한 그 말을 굳게 지키고</mark></strong> 헛되이 믿지 아니하였으면 그로 말미암아 구원을 받으리라” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/15/#L1-2">고전 15:1-2</a>)</p></blockquote><blockquote><p>“그러므로 형제들아 우리가 끝으로 주 예수 안에서 너희에게 구하고 <strong>권면하노니</strong> <strong><mark>너희가 마땅히 어떻게 행하며 하나님을 기쁘시게 할 수 있는지를 우리에게 배웠으니 곧 너희가 행하는 바라 더욱 많이 힘쓰라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1sol/4/#L1">살전 4:1</a>)</p></blockquote><blockquote><p>“그러므로 형제들아 굳건하게 서서 말로나 우리의 편지로 <strong><mark>가르침을 받은 전통을 지키라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2sol/2/#L15">살후 2:15</a>)</p></blockquote><h2>단번에 주어진 믿음을 왜곡하려는 시도가 있을 것입니다</h2><blockquote><p>“미쁜 말씀의 가르침을 그대로 지켜야 하리니 이는 능히 바른 교훈으로 권면하고 거슬러 말하는 자들을 책망하게 하려 함이라 <strong><mark>불순종하고 헛된 말을 하며 속이는 자가 많은 중</mark></strong> 할례파 가운데 특히 그러하니 그들의 입을 막을 것이라 이런 자들이 더러운 이득을 취하려고 마땅하지 아니한 것을 가르쳐 가정들을 온통 무너뜨리는도다” (<a href="https://bibleox.com/ko/ko-nkrv/tit/1/#L9-11">딛 1:9-11</a>)</p></blockquote><blockquote><p>“뱀이 그 간계로 하와를 미혹한 것 같이 너희 마음이 그리스도를 향하는 진실함과 깨끗함에서 떠나 부패할까 두려워하노라 만일 누가 가서 <strong><mark>우리가 전파하지 아니한 다른 예수를 전파하거나</mark></strong> 혹은 너희가 받지 아니한 다른 영을 받게 하거나 혹은 <strong><mark>너희가 받지 아니한 다른 복음을 받게 할 때에는</mark></strong> 너희가 잘 용납하는구나 &lt;…&gt; 그런 사람들은 거짓 사도요 속이는 일꾼이니 자기를 그리스도의 사도로 가장하는 자들이니라 이것은 이상한 일이 아니니라 사탄도 자기를 광명의 천사로 가장하나니 그러므로 사탄의 일꾼들도 자기를 의의 일꾼으로 가장하는 것이 또한 대단한 일이 아니니라 그들의 마지막은 그 행위대로 되리라” (<a href="https://bibleox.com/ko/ko-nkrv/2kor/11/#L3-4,13-15">고후 11:3-4,13-15</a>)</p></blockquote><h2>그리스도께서 남기신 가르침 대신 새 가르침을 들여오는 이들을 멀리하십시오</h2><blockquote><p>“누구든지 <strong>다른 교훈을 하며</strong> 바른 말 곧 <strong>우리 주 예수 그리스도의 말씀과 경건에 관한 교훈을 따르지 아니하면</strong> 그는 교만하여 <strong>아무 것도 알지 못하고</strong> 변론과 언쟁을 좋아하는 자니 이로써 투기와 분쟁과 비방과 악한 생각이 나며 마음이 부패하여지고 진리를 잃어 버려 경건을 이익의 방도로 생각하는 자들의 다툼이 일어나느니라” (<a href="https://bibleox.com/ko/ko-nkrv/1tim/6/#L3-5">딤전 6:3-5</a>) <em>(비잔틴 본문(다수 사본)에는 끝에 <strong>“이런 자들을 멀리하시오”</strong>라는 말이 이어집니다.)</em></p></blockquote><blockquote><p>“디모데야 망령되고 헛된 말과 거짓된 지식의 반론을 <strong><mark>피함으로</mark></strong> <strong>네게 부탁한 것을 지키라</strong> 이것을 따르는 사람들이 있어 믿음에서 벗어났느니라 은혜가 너희와 함께 있을지어다” (<a href="https://bibleox.com/ko/ko-nkrv/1tim/6/#L20-21">딤전 6:20-21</a>)</p></blockquote><blockquote><p>“형제들아 우리 주 예수 그리스도의 이름으로 너희를 명하노니 <strong><mark>게으르게 행하고 우리에게서 받은 전통대로 행하지 아니하는 모든 형제에게서 떠나라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2sol/3/#L6">살후 3:6</a>)</p></blockquote><blockquote><p>“형제들아 내가 너희를 권하노니 <strong><mark>너희가 배운 교훈을 거슬러 분쟁을 일으키거나 거치게 하는 자들을 살피고 그들에게서 떠나라</mark></strong> <strong>이같은 자들은 우리 주 그리스도를 섬기지 아니하고</strong> 다만 자기들의 배만 섬기나니 교활한 말과 아첨하는 말로 순진한 자들의 마음을 미혹하느니라” (<a href="https://bibleox.com/ko/ko-nkrv/rim/16/#L17-18">롬 16:17-18</a>)</p></blockquote><blockquote><p>“<strong>누구든지</strong> <strong><mark>이 교훈을 가지지 않고 너희에게 나아가거든 그를 집에 들이지도 말고</mark></strong> 인사도 하지 말라 그에게 인사하는 자는 그 악한 일에 참여하는 자임이라” (<a href="https://bibleox.com/ko/ko-nkrv/2in/1/#L10-11">요이 1:10-11</a>)</p></blockquote><blockquote><p>“그러나 우리나 혹은 <strong>하늘로부터 온 천사라도 우리가 너희에게 전한 복음 외에 다른 복음을 전하면</strong> <strong><mark>저주를 받을지어다</mark></strong> 우리가 전에 말하였거니와 내가 지금 다시 말하노니 <strong><mark>만일 누구든지 너희가 받은 것 외에 다른 복음을 전하면 저주를 받을지어다</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gal/1/#L8-9">갈 1:8-9</a>)</p></blockquote><p><strong>아나테마</strong>(그리스어 ἀνάθεμα, 개역개정 “저주”) — 교회에서 끊어짐.</p><h2>전통의 왜곡(이단)을 드러내십시오</h2><blockquote><p>“너희는 열매 없는 어둠의 일에 참여하지 말고 <strong>도리어 책망하라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ef/5/#L11">엡 5:11</a>)</p></blockquote><blockquote><p>“미쁜 말씀의 가르침을 그대로 지켜야 하리니 이는 능히 바른 교훈으로 권면하고 <strong><mark>거슬러 말하는 자들을 책망하게</mark></strong> 하려 함이라 불순종하고 헛된 말을 하며 속이는 자가 많은 중 할례파 가운데 특히 그러하니 <strong>그들의 입을 막을 것이라</strong> 이런 자들이 더러운 이득을 취하려고 마땅하지 아니한 것을 가르쳐 가정들을 온통 무너뜨리는도다” (<a href="https://bibleox.com/ko/ko-nkrv/tit/1/#L9-11">딛 1:9-11</a>)</p></blockquote><blockquote><p>“진리를 위하여 죽기까지 싸워라” (<a href="https://bibleox.com/ko/gr-lxx-byz/prsir/4/#L28">집회 4:28</a>, 그리스어에서 번역)</p></blockquote><blockquote><p>“사랑하는 자들아 우리가 일반으로 받은 구원에 관하여 내가 너희에게 편지하려는 생각이 간절하던 차에 <strong>성도에게 단번에 주신 믿음의 도를 위하여 힘써 싸우라</strong>는 편지로 너희를 권하여야 할 필요를 느꼈노니” (<a href="https://bibleox.com/ko/ko-nkrv/iud/1/#L3">유 1:3</a>)</p></blockquote><h2>진리의 성령께서 이끌어 주시는 것</h2><p>성령을 보내시어 사도들에게 내려오시게 하기 전에, 그리스도께서는 성령께서 사도들에게 파견되시면 당신이 하신 모든 말씀을 기억하고 깨닫도록 도와주시리라고 약속하십니다:</p><blockquote><p>“보혜사 곧 아버지께서 내 이름으로 보내실 성령 그가 너희에게 모든 것을 가르치고 <strong><mark>내가 너희에게 말한 모든 것을 생각나게 하리라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/in/14/#L26">요 14:26</a>)</p></blockquote><blockquote><p>“<strong>내가 아직도 너희에게 이를 것이 많으나 지금은 너희가 감당하지 못하리라</strong> 그러나 <strong><mark>진리의 성령이 오시면 그가 너희를 모든 진리 가운데로 인도하시리니</mark></strong> 그가 스스로 말하지 않고 오직 들은 것을 말하며 장래 일을 너희에게 알리시리라 그가 내 영광을 나타내리니 <strong><mark>내 것을 가지고 너희에게 알리시겠음이라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/in/16/#L12-14">요 16:12-14</a>)</p></blockquote>
