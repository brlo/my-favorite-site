  title: 교회에는 처음부터 충만한 진리가 주어졌습니다
  copy_cover: true
  body: '<h2>참된 가르침은 이미 단번에 교회에 주어졌습니다</h2><blockquote><p>“사랑하는 여러분, 본래 나는 우리가 함께 받은 구원에 관해서 여러분에게 편지를 써 보내려고 여러 가지로 애쓰던 참에 이제 여러분에게 간곡한 권고의 편지를 쓸 필요가 생겼습니다. 그것은 <strong><mark>성도들에게 한번 결정적으로 전해진 그 믿음을 지키기 위해서 여러분이 힘써 싸우라</mark></strong>는 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/iud/1/#L3">유다 1:3</a>)</p></blockquote><blockquote><p>“여러분이 <strong><mark>처음부터 들어 온 것을 마음 속에 간직하십시오</mark></strong>. 여러분이 <strong><mark>처음부터 들어 온 것이 여러분의 마음 속에 살아 있으면</mark></strong> 여러분은 아들과 아버지와 함께 살게 될 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/1in/2/#L24">1요한 2:24</a>)</p></blockquote><p>그래서 교회를 충만이라고 부릅니다:</p><blockquote><p>“하느님께서는 만물을 그리스도의 발 아래 굴복시키셨으며 그분을 교회의 머리로 삼으셔서 모든 것을 지배하게 하셨습니다. <strong>교회는</strong> 그리스도의 몸이며 <strong><mark>만물을 완성하시는 분의 계획이 그 안에서 완전히 이루어집니다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/ef/1/#L22-23">에페 1:22-23</a>) <em>(그리스어: “교회는 그리스도의 몸이며, 모든 것을 모든 것 안에서 채우시는 분의 충만입니다”)</em></p></blockquote><p>교회는 이 진리를 굳게 세웁니다:</p><blockquote><p>“만일 내가 늦어지더라도 그대가 하느님의 집에서 어떻게 행동해야 할 것인가를 가르쳐 주기 위해서 이 편지를 쓰고 있습니다. 하느님의 집은 살아 계신 하느님의 교회이고 <strong><mark>진리의 기둥이며 터전입니다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/1tim/3/#L15">1디모 3:15</a>)</p></blockquote><h2>참된 가르침은 하느님이신 그리스도께서 친히 드러내어 주셨습니다</h2><p>그리스도께서는 이 가르침을 아버지에게서 받아 전해 주셨습니다:</p><blockquote><p>“나는 <strong>나에게 주신 말씀을 이 사람들에게 전하였습니다</strong>. 이 사람들은 그 말씀을 받아 들였고 내가 아버지께로부터 온 것을 참으로 깨달았으며 아버지께서 나를 보내신 것을 믿었습니다.” (<a href="https://bibleox.com/ko/ko-ctb/in/17/#L8">요한 17:8</a>)</p></blockquote><p>그리스도께서 주신 바로 그 가르침 안에 머물러야 합니다:</p><blockquote><p>“그리스도의 교훈을 지키지 않고 지나치게 앞서 나가는 자는 누구든지 하느님을 모시지 않는 자입니다. <strong>그리스도의 교훈을 지키는 사람은 하느님 아버지와 그 아들을 함께 모시는 사람입니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/2in/1/#L9">2요한 1:9</a>)</p></blockquote><h2>다르게 가르쳐서는 안 됩니다</h2><blockquote><p>“내가 마케도니아로 떠날 때에 간곡히 부탁한 대로 그대는 에페소에 머물러 있으시오. 거기에는 <strong><mark>그릇된 교리를 가르치거나</mark></strong> 꾸며 낸 이야기나 끝없는 족보 이야기에 정신이 팔린 사람들이 더러 있으니 <strong><mark>그런 일을 못하게 하시오</mark></strong>. 그런 것들은 쓸 데 없는 논쟁이나 일으킬 뿐이고 믿음을 통해서 구원을 얻게 해 주시는 하느님의 계획에는 아무런 도움도 되지 못합니다.” (<a href="https://bibleox.com/ko/ko-ctb/1tim/1/#L3-4">1디모 1:3-4</a>)</p></blockquote><blockquote><p>“그대는 많은 증인들이 있는 데서 <strong><mark>내가 들려 준 것을 믿음직한 사람들에게 전하시오</mark></strong>. 그러면 그들도 또한 다른 사람들에게 가르칠 수 있을 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/2tim/2/#L2">2디모 2:2</a>)</p></blockquote><blockquote><p>“여러분이 늘 나를 기억하고 <strong><mark>내가 전해 준 전통을 그대로 지키고</mark></strong> 있으니 정말 잘한 일입니다.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/11/#L2">1고린 11:2</a>)</p></blockquote><blockquote><p>“형제 여러분, 전에 내가 전해 준 복음을 여러분의 마음 속에 되새겨 주려고 합니다. 이 복음은 여러분이 이미 받아 들였고 또 여러분의 믿음의 기초가 되어 있습니다. 그러므로 여러분이 헛되이 믿는다면 몰라도 그렇지 않고 <strong><mark>내가 전해 준 복음 그대로 굳게 지켜 나간다면</mark></strong> 여러분은 이 복음으로 구원을 받게 될 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/15/#L1-2">1고린 15:1-2</a>)</p></blockquote><blockquote><p>“교우 여러분, 마지막으로 주 예수의 이름으로 부탁하며 <strong>권고합니다</strong>. 여러분은 <strong><mark>어떻게 살아야 하느님을 기쁘시게 해 드릴 수 있는지 우리에게서 배웠고 또 배운 대로 살고 있습니다. 그러니 앞으로 더욱 더 그렇게 살아 가십시오</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/1sol/4/#L1">1데살 4:1</a>)</p></blockquote><blockquote><p>“그러므로 교우 여러분, 굳건히 서십시오. 그리고 우리가 전한 말이나 써 보낸 글을 통해서 여러분에게 <strong><mark>가르쳐 준 전통을 굳게 지키십시오</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/2sol/2/#L15">2데살 2:15</a>)</p></blockquote><h2>단번에 주어진 믿음을 왜곡하려는 시도가 있을 것입니다</h2><blockquote><p>“교회가 가르치는 진실된 말씀을 굳게 지키는 사람이어야 합니다. 그래야 그가 건전한 가르침으로 남을 가르칠 수도 있고 반대자들을 반박할 수도 있을 것입니다. <strong><mark>복종하지 않는 자들과 쓸 데 없는 토론을 일삼는 자들과 속이는 자들이 많이 있는데</mark></strong> 유다교에서 넘어 온 신자들 가운데 그런 자들이 특히 많이 있습니다. 그들의 입을 막아야 합니다. 그들은 더러운 이익을 얻기 위해서 가르쳐서는 안 될 것을 가르쳐 가정들을 온통 뒤흔들어 놓고 있습니다.” (<a href="https://bibleox.com/ko/ko-ctb/tit/1/#L9-11">디도 1:9-11</a>)</p></blockquote><blockquote><p>“내가 염려하는 것은 마치 하와가 뱀의 간사한 꾐에 넘어 간 것처럼 여러분도 미혹되어 생각이 변해서 그리스도에 대한 충성과 순결을 저버리지나 않을까 하는 것입니다. 사실 어떤 사람이 와서 <strong><mark>우리가 전한 것과는 다른 예수를 전하고</mark></strong> 여러분이 받은 성령과는 다른 것을 주며 또 <strong><mark>전에 받아 들인 것과는 다른 복음을 전파하는데도</mark></strong> 여러분은 아무렇지도 않게 여기니까 하는 말입니다. &lt;…&gt; 그런 자들은 거짓사도이며 사람을 속여 먹는 일꾼이며 그리스도의 사도로 가장하는 자들입니다. 그러나 그것은 조금도 놀라운 일이 아닙니다. 사탄도 빛의 천사의 탈을 쓰고 나타나지 않습니까? 이렇게 사탄의 일꾼들이 정의의 일꾼으로 가장하고 나선다 해도 조금도 놀라울 것이 없습니다. 그들의 행실에 따라 그들의 최후가 결정될 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/2kor/11/#L3-4,13-15">2고린 11:3-4,13-15</a>)</p></blockquote><h2>그리스도께서 남기신 가르침 대신 새 가르침을 들여오는 이들을 멀리하십시오</h2><blockquote><p>“<strong>다른 교리를 가르치거나</strong> <strong>우리 주 예수 그리스도의 건전한 말씀을 받아 들이지 않거나</strong> 경건한 생활 원칙을 따르지 않는 사람은 잔뜩 교만해져서 <strong>아무 것도 모르면서도</strong> 쓸데 없는 질문과 토론에만 미친듯이 열중합니다. 그런 데서 시기와 다툼과 비방과 못된 의심과 분쟁이 생깁니다. 마음이 썩고 진리를 잃어서 종교를 한낱 이득의 수단으로 생각하는 사람들 사이에는 분쟁이 있게 마련입니다.” (<a href="https://bibleox.com/ko/ko-ctb/1tim/6/#L3-5">1디모 6:3-5</a>) <em>(비잔틴 본문(다수 사본)에는 끝에 <strong>“이런 자들을 멀리하시오”</strong>라는 말이 이어집니다.)</em></p></blockquote><blockquote><p>“디모테오, <strong>그대가 맡은 것을 잘 간수하시오</strong>. 속된 잡담을 <strong><mark>피하고</mark></strong> <strong>거짓된 지식</strong>에서 나오는 반대 이론을 물리치시오. 이런 반대 이론을 내세우다가 믿음의 길을 잃어 버린 사람들도 더러 있으니 말입니다. 하느님께서 여러분에게 은총을 내려 주시기를 빕니다.” (<a href="https://bibleox.com/ko/ko-ctb/1tim/6/#L20-21">1디모 6:20-21</a>)</p></blockquote><blockquote><p>“교우 여러분, 우리는 주 예수 그리스도의 이름으로 여러분에게 명령합니다. <strong><mark>누구를 막론하고 게으른 생활을 하거나 우리에게서 받은 전통을 따르지 않는 교우는 여러분이 멀리해야 합니다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/2sol/3/#L6">2데살 3:6</a>)</p></blockquote><blockquote><p>“형제 여러분, <strong><mark>여러분이 배운 교훈과는 달리 남들을 분열시키고 죄짓게 하는 사람들을 경계하고 멀리하시기 바랍니다</mark></strong>. <strong>그런 자들은 우리 주 예수 그리스도를 섬기는 것이 아니라</strong> 자기네 뱃속을 채우고 있으며 그럴 듯한 말과 아첨하는 언사로 순진한 사람들의 마음을 유혹하고 있는 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/rim/16/#L17-18">로마 16:17-18</a>)</p></blockquote><blockquote><p>“<strong>만일 누가</strong> 여러분을 찾아 가서 <strong><mark>이 교훈과 다른 것을 전하거든 그를 집 안으로 받아 들이지도 말고</mark></strong> 인사도 하지 마십시오. 그런 자에게 인사를 하면 그의 악한 사업에 참여하는 것이 됩니다.” (<a href="https://bibleox.com/ko/ko-ctb/2in/1/#L10-11">2요한 1:10-11</a>)</p></blockquote><blockquote><p>“우리는 말할 것도 없고 <strong>하늘에서 온 천사라 할지라도 우리가 이미 전한 복음과 다른 것을 여러분에게 전한다면</strong> <strong><mark>그는 저주를 받아 마땅합니다</mark></strong>. 전에도 말한 바 있지만 다시 강조하겠습니다. <strong><mark>누구든지 여러분이 이미 받은 복음과 다른 것을 전하는 자가 있다면 그는 저주를 받아 마땅합니다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/gal/1/#L8-9">갈라 1:8-9</a>)</p></blockquote><p><strong>아나테마</strong>(그리스어 ἀνάθεμα, 공동번역 “저주”) — 교회에서 끊어짐.</p><h2>전통의 왜곡(이단)을 드러내십시오</h2><blockquote><p>“그래서 열매를 맺지 못하는 어둠의 행위에 끼어 들지 말고 오히려 <strong>그런 일을 폭로하십시오</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/ef/5/#L11">에페 5:11</a>)</p></blockquote><blockquote><p>“교회가 가르치는 진실된 말씀을 굳게 지키는 사람이어야 합니다. 그래야 그가 건전한 가르침으로 남을 가르칠 수도 있고 <strong><mark>반대자들을 반박할 수도</mark></strong> 있을 것입니다. 복종하지 않는 자들과 쓸 데 없는 토론을 일삼는 자들과 속이는 자들이 많이 있는데 유다교에서 넘어 온 신자들 가운데 그런 자들이 특히 많이 있습니다. <strong>그들의 입을 막아야 합니다</strong>. 그들은 더러운 이익을 얻기 위해서 가르쳐서는 안 될 것을 가르쳐 가정들을 온통 뒤흔들어 놓고 있습니다.” (<a href="https://bibleox.com/ko/ko-ctb/tit/1/#L9-11">디도 1:9-11</a>)</p></blockquote><blockquote><p>“진리를 위하여 죽기까지 싸워라” (<a href="https://bibleox.com/ko/gr-lxx-byz/prsir/4/#L28">집회 4:28</a>, 그리스어에서 번역)</p></blockquote><blockquote><p>“사랑하는 여러분, 본래 나는 우리가 함께 받은 구원에 관해서 여러분에게 편지를 써 보내려고 여러 가지로 애쓰던 참에 이제 여러분에게 간곡한 권고의 편지를 쓸 필요가 생겼습니다. 그것은 <strong>성도들에게 한번 결정적으로 전해진 그 믿음을 지키기 위해서 여러분이 힘써 싸우라</strong>는 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/iud/1/#L3">유다 1:3</a>)</p></blockquote><h2>진리의 성령께서 이끌어 주시는 것</h2><p>성령을 보내시어 사도들에게 내려오시게 하기 전에, 그리스도께서는 성령께서 사도들에게 파견되시면 당신이 하신 모든 말씀을 기억하고 깨닫도록 도와주시리라고 약속하십니다:</p><blockquote><p>“이제 아버지께서 내 이름으로 보내 주실 성령 곧 그 협조자는 모든 것을 너희에게 가르쳐 주실뿐만 아니라 <strong><mark>내가 너희에게 한 말을 모두 되새기게 하여 주실 것이다</mark></strong>.‘” (<a href="https://bibleox.com/ko/ko-ctb/in/14/#L26">요한 14:26</a>)</p></blockquote><blockquote><p>“<strong>아직도 나는 할 말이 많지만 지금은 너희가 그 말을 알아 들을 수 없을 것이다</strong>. 그러나 <strong><mark>진리의 성령이 오시면 너희를 이끌어 진리를 온전히 깨닫게 하여 주실 것이다</mark></strong>. 그분은 자기 생각대로 말씀하시지 않고 들은 대로 일러 주실 것이며 앞으로 다가 올 일들을 알려 주실 것이다. 또 그분은 <strong><mark>나에게서 들은 것을 너희에게 전하여</mark></strong> 나를 영광스럽게 하실 것이다.” (<a href="https://bibleox.com/ko/ko-ctb/in/16/#L12-14">요한 16:12-14</a>)</p></blockquote>'
  title_sub: 교회에 처음부터 주어진 충만한 진리에 관한 성경 구절
