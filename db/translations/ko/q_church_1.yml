  title: 교회
  copy_cover: true
  body: '<h2>정의: 교회는 그리스도의 몸입니다</h2><blockquote><p>“또 만물을 그의 발 아래에 복종하게 하시고 그를 만물 위에 교회의 머리로 삼으셨느니라 <strong><mark>교회는 그의 몸이니</mark></strong> 만물 안에서 만물을 충만하게 하시는 이의 충만함이니라” (<a href="https://bibleox.com/ko/ko-nkrv/ef/1/#L22-23">엡 1:22-23</a>)</p></blockquote><blockquote><p>“<strong><mark>너희는 그리스도의 몸이요 지체의 각 부분이라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/12/#L27">고전 12:27</a>)</p></blockquote><blockquote><p>“<strong><mark>너희 몸이 그리스도의 지체인 줄을</mark></strong> 알지 못하느냐 내가 그리스도의 지체를 가지고 창녀의 지체를 만들겠느냐 결코 그럴 수 없느니라” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/6/#L15">고전 6:15</a>)</p></blockquote><blockquote><p>“우리가 한 몸에 많은 지체를 가졌으나 모든 지체가 같은 기능을 가진 것이 아니니 <strong><mark>이와 같이 우리 많은 사람이 그리스도 안에서 한 몸이 되어 서로 지체가 되었느니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/rim/12/#L4-5">롬 12:4-5</a>)</p></blockquote><blockquote><p>“나는 이제 너희를 위하여 받는 괴로움을 기뻐하고 그리스도의 남은 고난을 <strong><mark>그의 몸된 교회를 위하여</mark></strong> 내 육체에 채우노라” (<a href="https://bibleox.com/ko/ko-nkrv/kol/1/#L24">골 1:24</a>)</p></blockquote><blockquote><p>“누구든지 언제나 자기 육체를 미워하지 않고 오직 양육하여 보호하기를 <strong><mark>그리스도께서 교회에게 함과 같이</mark></strong> 하나니 <strong><mark>우리는 그 몸의 지체임이라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ef/5/#L29-30">엡 5:29-30</a>)</p></blockquote><blockquote><p>“그리스도의 평강이 너희 마음을 주장하게 하라 <strong><mark>너희는 평강을 위하여 한 몸으로 부르심을 받았나니</mark></strong> 너희는 또한 감사하는 자가 되라” (<a href="https://bibleox.com/ko/ko-nkrv/kol/3/#L15">골 3:15</a>)</p></blockquote><h2>몸(교회)에 결합됩니다</h2><h3>세례</h3><blockquote><p>“우리가 유대인이나 헬라인이나 종이나 자유인이나 다 <strong><mark>한 성령으로 세례를 받아 한 몸이 되었고</mark></strong> 또 다 한 성령을 마시게 하셨느니라” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/12/#L13">고전 12:13</a>)</p></blockquote><h3>성체성혈성사</h3><blockquote><p>“우리가 축복하는 바 축복의 잔은 그리스도의 피에 참여함이 아니며 우리가 떼는 <strong>떡</strong>은 <strong><mark>그리스도의 몸에 참여함이 아니냐</mark></strong> <strong>떡이 하나요 많은 우리가 한 몸이니 이는 우리가 다 한 떡에 참여함이라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/10/#L16-17">고전 10:16-17</a>)</p></blockquote><h2>그리스도는 몸(교회)의 구세주이십니다</h2><blockquote><p>“이는 남편이 아내의 머리 됨이 <strong><mark>그리스도께서 교회의 머리 됨과 같음이니 그가 바로 몸의 구주시니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ef/5/#L23">엡 5:23</a>)</p></blockquote><blockquote><p>“<strong><mark>내 안에 거하라</mark></strong> 나도 너희 안에 거하리라 <strong><mark>가지가 포도나무에 붙어 있지 아니하면 스스로 열매를 맺을 수 없음 같이 너희도 내 안에 있지 아니하면 그러하리라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/in/15/#L4">요 15:4</a>)</p></blockquote><h3>그리스도께서 구원받는 이들을 교회로 인도하십니다</h3><blockquote><p>“하나님을 찬미하며 또 온 백성에게 칭송을 받으니 <strong><mark>주께서 구원 받는 사람을 날마다 더하게 하시니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/act/2/#L47">행 2:47</a>) <em>(비잔틴 본문(다수 사본): “주께서 구원받는 사람들을 날마다 교회에 더하게 하셨다”)</em></p></blockquote><p>비유에 나오는 자비로운 사마리아 사람은 사람을 구원하시는 그리스도의 모습입니다. 그는 사람의 상처를 싸매 주고 여관(교회)으로 데려가 회복(구원)을 맡깁니다:</p><blockquote><p>“예수께서 대답하여 이르시되 어떤 사람이 예루살렘에서 여리고로 내려가다가 강도를 만나매 강도들이 그 옷을 벗기고 때려 거의 죽은 것을 버리고 갔더라 &lt;…&gt; 어떤 사마리아 사람은 여행하는 중 거기 이르러 그를 보고 불쌍히 여겨 가까이 가서 <strong><mark>기름과 포도주를 그 상처에 붓고 싸매고</mark></strong> <strong><mark>자기 짐승에 태워 주막으로 데리고 가서 돌보아 주니라</mark></strong> 그 이튿날 그가 주막 주인에게 데나리온 둘을 내어 주며 이르되 이 사람을 돌보아 주라 비용이 더 들면 내가 돌아올 때에 갚으리라 하였으니” (<a href="https://bibleox.com/ko/ko-nkrv/lk/10/#L30,33-35">눅 10:30,33-35</a>)</p></blockquote><h2>교회의 구성</h2><h3>몸의 머리는 그리스도이십니다</h3><blockquote><p>“<strong>그는 몸인 교회의 머리시라</strong> 그가 근본이시요 죽은 자들 가운데서 먼저 나신 이시니 이는 친히 만물의 으뜸이 되려 하심이요” (<a href="https://bibleox.com/ko/ko-nkrv/kol/1/#L18">골 1:18</a>)</p></blockquote><blockquote><p>“또 만물을 그의 발 아래에 복종하게 하시고 그를 만물 위에 교회의 머리로 삼으셨느니라 <strong>교회는 그의 몸이니</strong> 만물 안에서 만물을 충만하게 하시는 이의 충만함이니라” (<a href="https://bibleox.com/ko/ko-nkrv/ef/1/#L22-23">엡 1:22-23</a>)</p></blockquote><blockquote><p>“머리를 붙들지 아니하는지라 <strong>온 몸이 머리로 말미암아</strong> 마디와 힘줄로 공급함을 받고 연합하여 하나님이 자라게 하시므로 자라느니라” (<a href="https://bibleox.com/ko/ko-nkrv/kol/2/#L19">골 2:19</a>)</p></blockquote><h3>몸에는 그리스도 외에 다른 머리가 없습니다</h3><p>사도들과 주교들은 서로 동등합니다. 사도들은 자기들 가운데 누가 가장 큰지 자주 다투었습니다. 그리스도께서는 서로 위에 권력을 찾지 말라고 하셨습니다 [<a href="https://bibleox.com/ru/ru/w/церковь-епископы-равны">자세히</a>]:</p><blockquote><p>“또 <strong>그들 사이에 그 중 누가 크냐 하는 다툼이 난지라</strong> 예수께서 이르시되 이방인의 임금들은 그들을 주관하며 그 집권자들은 은인이라 칭함을 받으나 <strong>너희는 그렇지 않을지니 너희 중에 큰 자는 젊은 자와 같고 다스리는 자는 섬기는 자와 같을지니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/lk/22/#L24-26">눅 22:24-26</a>)</p></blockquote><h3>몸의 지체들은 서로 다릅니다</h3><blockquote><p>“하나님이 교회 중에 몇을 세우셨으니 첫째는 사도요 둘째는 <strong>선지자요</strong> 셋째는 <strong>교사요</strong> 그 다음은 <strong>능력을 행하는 자요</strong> 그 다음은 <strong>병 고치는 은사</strong>와 서로 돕는 것과 다스리는 것과 <strong>각종 방언</strong>을 말하는 것이라 다 사도이겠느냐 다 선지자이겠느냐 다 교사이겠느냐 다 능력을 행하는 자이겠느냐 다 병 고치는 은사를 가진 자이겠느냐 다 방언을 말하는 자이겠느냐 다 <strong>통역하는 자</strong>이겠느냐” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/12/#L28-30">고전 12:28-30</a>)</p></blockquote><blockquote><p>“<strong>몸은 한 지체뿐만 아니요 여럿이니</strong> 만일 발이 이르되 나는 손이 아니니 몸에 붙지 아니하였다 할지라도 이로써 몸에 붙지 아니한 것이 아니요 또 귀가 이르되 나는 눈이 아니니 몸에 붙지 아니하였다 할지라도 이로써 몸에 붙지 아니한 것이 아니니 만일 온 몸이 눈이면 듣는 곳은 어디며 온 몸이 듣는 곳이면 냄새 맡는 곳은 어디냐 그러나 이제 하나님이 그 원하시는 대로 지체를 각각 몸에 두셨으니 만일 다 한 지체뿐이면 몸은 어디냐 <strong>이제 지체는 많으나 몸은 하나라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/12/#L14-20">고전 12:14-20</a>)</p></blockquote><h2>지상 교회와 천상 교회의 일치 (그리스도의 한 몸)</h2><h3>하늘과 땅이 그리스도 안에서 결합됩니다</h3><blockquote><p>“찬송하리로다 하나님 곧 우리 주 예수 그리스도의 아버지께서 그리스도 안에서 하늘에 속한 모든 신령한 복을 우리에게 주시되 &lt;…&gt; 그 뜻의 비밀을 우리에게 알리신 것이요 그의 기뻐하심을 따라 그리스도 안에서 <strong>때가 찬 경륜을 위하여</strong> 예정하신 것이니 <strong><mark>하늘에 있는 것이나 땅에 있는 것이 다 그리스도 안에서 통일되게 하려 하심이라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ef/1/#L3,9-10">엡 1:3,9-10</a>)</p></blockquote><blockquote><p>“이러므로 내가 <strong><mark>하늘과 땅에 있는 각 족속</mark></strong>에게 이름을 주신 아버지 앞에 무릎을 꿇고 비노니” (<a href="https://bibleox.com/ko/ko-nkrv/ef/3/#L14-15">엡 3:14-15</a>)</p></blockquote><blockquote><p>“그는 몸인 교회의 머리시라 그가 근본이시요 죽은 자들 가운데서 먼저 나신 이시니 이는 친히 만물의 으뜸이 되려 하심이요 <strong>아버지께서는 모든 충만으로 예수 안에 거하게 하시고</strong> 그의 십자가의 피로 화평을 이루사 <strong><mark>만물 곧 땅에 있는 것들이나 하늘에 있는 것들이 그로 말미암아 자기와 화목하게 되기를</mark></strong> 기뻐하심이라” (<a href="https://bibleox.com/ko/ko-nkrv/kol/1/#L18-20">골 1:18-20</a>)</p></blockquote><blockquote><p>“이를 위하여 그리스도께서 죽었다가 다시 살아나셨으니 곧 <strong><mark>죽은 자와 산 자의 주가 되려 하심이라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/rim/14/#L9">롬 14:9</a>)</p></blockquote><h3>모든 지체의 유대와 서로에 대한 돌봄</h3><p>온몸은 여러 가지 유대로 묶여 있습니다:</p><blockquote><p>“오직 사랑 안에서 참된 것을 하여 범사에 그에게까지 자랄지라 그는 머리니 곧 그리스도라 그에게서 온 몸이 <strong><mark>각 마디를 통하여 도움을 받음으로 연결되고 결합되어</mark></strong> 각 지체의 분량대로 역사하여 그 몸을 자라게 하며 사랑 안에서 스스로 세우느니라” (<a href="https://bibleox.com/ko/ko-nkrv/ef/4/#L15-16">엡 4:15-16</a>)</p></blockquote><blockquote><p>“아무도 꾸며낸 겸손과 천사 숭배를 이유로 너희를 정죄하지 못하게 하라 그가 그 본 것에 의지하여 그 육신의 생각을 따라 헛되이 과장하고 머리를 붙들지 아니하는지라 <strong><mark>온 몸이 머리로 말미암아 마디와 힘줄로 공급함을 받고 연합하여</mark></strong> 하나님이 자라게 하시므로 자라느니라” (<a href="https://bibleox.com/ko/ko-nkrv/kol/2/#L18-19">골 2:18-19</a>)</p></blockquote><p>모든 지체는 서로 알고 서로 돌봅니다:</p><blockquote><p>“그러나 이제 하나님이 그 원하시는 대로 <strong>지체를 각각 몸에 두셨으니</strong> 만일 다 한 지체뿐이면 몸은 어디냐 <strong>이제 지체는 많으나 몸은 하나라</strong> 눈이 손더러 내가 너를 쓸 데가 없다 하거나 또한 머리가 발더러 내가 너를 쓸 데가 없다 하지 못하리라 그뿐 아니라 더 약하게 보이는 몸의 지체가 도리어 요긴하고 우리가 몸의 덜 귀히 여기는 그것들을 더욱 귀한 것들로 입혀 주며 우리의 아름답지 못한 지체는 더욱 아름다운 것을 얻느니라 그런즉 우리의 아름다운 지체는 그럴 필요가 없느니라 오직 하나님이 몸을 고르게 하여 부족한 지체에게 귀중함을 더하사 <strong>몸 가운데서 분쟁이 없고</strong> 오직 <strong><mark>여러 지체가 서로 같이 돌보게 하셨느니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/12/#L18-25">고전 12:18-25</a>)</p></blockquote><h3>지상의 교회는 싸우는 교회입니다</h3><blockquote><p>“<strong>근신하라 깨어라</strong> <strong>너희 대적 마귀가 우는 사자 같이 두루 다니며 삼킬 자를 찾나니</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1pet/5/#L8">벧전 5:8</a>)</p></blockquote><blockquote><p>“<strong>마귀의 간계를 능히 대적하기 위하여</strong> 하나님의 전신 갑주를 입으라 <strong>우리의 씨름은</strong> 혈과 육을 상대하는 것이 아니요 통치자들과 권세들과 이 어둠의 세상 주관자들과 <strong>하늘에 있는 악의 영들을 상대함이라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ef/6/#L11-12">엡 6:11-12</a>)</p></blockquote><blockquote><p>“<strong>우리가 여기에는 영구한 도성이 없으므로</strong> 장차 올 것을 찾나니” (<a href="https://bibleox.com/ko/ko-nkrv/evr/13/#L14">히 13:14</a>)</p></blockquote><h3>하늘의 교회는 승리한 교회입니다</h3><blockquote><p>“그러나 너희가 이른 곳은 시온 산과 살아 계신 하나님의 도성인 <strong>하늘의 예루살렘과 천만 천사와</strong> <strong><mark>하늘에 기록된 장자들의 모임과 교회와</mark></strong> 만민의 심판자이신 하나님과 및 <strong>온전하게 된 의인의 영들과</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/evr/12/#L22-23">히 12:22-23</a>)</p></blockquote><h2>교회는 눈에 보입니다</h2><p>교회는 사람들에게 숨겨질 수 없습니다.</p><blockquote><p>“너희는 세상의 빛이라 <strong><mark>산 위에 있는 동네가 숨겨지지 못할 것이요</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/5/#L14">마 5:14</a>)</p></blockquote><p>하느님께서는 몸(교회)의 지체들을 분열이 없고 모두가 서로 돌보며 함께 아파하고 함께 기뻐하도록 배치하셨습니다:</p><blockquote><p>“우리가 유대인이나 헬라인이나 종이나 자유인이나 다 한 성령으로 세례를 받아 한 몸이 되었고 또 다 한 성령을 마시게 하셨느니라 <strong>몸은 한 지체뿐만 아니요 여럿이니</strong> &lt;…&gt; <strong><mark>눈이 손더러 내가 너를 쓸 데가 없다 하거나 또한 머리가 발더러 내가 너를 쓸 데가 없다 하지 못하리라</mark></strong> 그뿐 아니라 더 약하게 보이는 몸의 지체가 도리어 요긴하고 우리가 몸의 덜 귀히 여기는 그것들을 더욱 귀한 것들로 입혀 주며 우리의 아름답지 못한 지체는 더욱 아름다운 것을 얻느니라 그런즉 우리의 아름다운 지체는 그럴 필요가 없느니라 오직 <strong><mark>하나님이 몸을 고르게 하여 부족한 지체에게 귀중함을 더하사</mark></strong> <strong><mark>몸 가운데서 분쟁이 없고</mark></strong> 오직 여러 지체가 서로 같이 돌보게 하셨느니라 <strong>만일 한 지체가 고통을 받으면 모든 지체가 함께 고통을 받고 한 지체가 영광을 얻으면 모든 지체가 함께 즐거워하느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/12/#L13-14,21-26">고전 12:13-14,21-26</a>)</p></blockquote><p>온몸은 여러 가지 유대로 묶여 있습니다:</p><blockquote><p>“오직 사랑 안에서 참된 것을 하여 범사에 그에게까지 자랄지라 그는 머리니 곧 그리스도라 그에게서 온 몸이 <strong><mark>각 마디를 통하여 도움을 받음으로 연결되고 결합되어</mark></strong> 각 지체의 분량대로 역사하여 그 몸을 자라게 하며 사랑 안에서 스스로 세우느니라” (<a href="https://bibleox.com/ko/ko-nkrv/ef/4/#L15-16">엡 4:15-16</a>)</p></blockquote><blockquote><p>“아무도 꾸며낸 겸손과 천사 숭배를 이유로 너희를 정죄하지 못하게 하라 그가 그 본 것에 의지하여 그 육신의 생각을 따라 헛되이 과장하고 머리를 붙들지 아니하는지라 <strong><mark>온 몸이 머리로 말미암아 마디와 힘줄로 공급함을 받고 연합하여</mark></strong> 하나님이 자라게 하시므로 자라느니라” (<a href="https://bibleox.com/ko/ko-nkrv/kol/2/#L18-19">골 2:18-19</a>)</p></blockquote><p>교회에 판단을 청할 수 있습니다:</p><blockquote><p>“<strong>네 형제가 죄를 범하거든</strong> 가서 너와 그 사람과만 상대하여 권고하라 만일 들으면 네가 네 형제를 얻은 것이요 &lt;…&gt; 만일 그들의 말도 듣지 않거든 <strong><mark>교회에 말하고 교회의 말도 듣지 않거든 이방인과 세리와 같이 여기라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/18/#L15,17">마 18:15,17</a>)</p></blockquote><p>교회의 경계에 관하여: <a href="https://bibleox.com/ru/ru/w/Церковь-видимое-единство">자세히</a>.</p><h2>교회는 무너지지 않습니다</h2><h3>교회는 패하지 않습니다</h3><blockquote><p>“또 내가 네게 이르노니 너는 베드로라 내가 이 반석 위에 내 교회를 세우리니 <strong><mark>음부의 권세가 이기지 못하리라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/16/#L18">마 16:18</a>) <em>(그리스어: “음부의 문들도”)</em></p></blockquote><h3>하느님께서는 언제나 교회와 함께 계십니다</h3><blockquote><p>“내가 아버지께 구하겠으니 그가 또 다른 보혜사를 너희에게 주사 <strong><mark>영원토록 너희와 함께 있게 하리니</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/in/14/#L16">요 14:16</a>)</p></blockquote><blockquote><p>“내가 너희에게 분부한 모든 것을 가르쳐 지키게 하라 볼지어다 내가 <strong><mark>세상 끝날까지 너희와 항상 함께 있으리라</mark></strong> 하시니라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/28/#L20">마 28:20</a>)</p></blockquote><h3>교회는 언제나 하느님을 찬양합니다</h3><blockquote><p>“<strong>교회 안에서와 그리스도 예수 안에서</strong> 영광이 대대로 <strong><mark>영원무궁하기를 원하노라</mark></strong> 아멘” (<a href="https://bibleox.com/ko/ko-nkrv/ef/3/#L21">엡 3:21</a>)</p></blockquote><h3>진리는 언제나 교회 안에 있습니다</h3><blockquote><p>“장로인 나는 택하심을 받은 부녀와 그의 자녀들에게 편지하노니 내가 참으로 사랑하는 자요 나뿐 아니라 진리를 아는 모든 자도 그리하는 것은 우리 안에 거하여 <strong><mark>영원히 우리와 함께 할 진리</mark></strong>로 말미암음이로다” (<a href="https://bibleox.com/ko/ko-nkrv/2in/1/#L1-2">요이 1:1-2</a>)</p></blockquote><h2>교회의 깃발은 십자가입니다</h2><p>구약에서 이스라엘은 약속받은 나라로 가는 길에 십자가 모양으로 이동했습니다: <a href="https://bibleox.com/ru/ru/w/еврейский-стан-крест">자세히</a>. 옛 이스라엘은 그리스도의 교회, 곧 <a href="https://bibleox.com/ru/ru/w/церковь-новый-израиль">새 이스라엘</a>의 예표였습니다. 그래서 십자가는 교회의 주된 깃발이며, 승리와 화해의 상징이고, 제단(곧 위대한 성물)입니다: <a href="https://bibleox.com/ru/ru/w/крест">십자가에 관하여 자세히</a>.</p><p>초기 그리스도인들의 십자 성호 사용: <a href="https://bibleox.com/ru/ru/w/крестное-знамение">자세히</a> (러시아어).</p><h2>교회가 창조된 날은 그리스도 부활 후 50일째입니다</h2><ol><li><p>세례를 통해 교회에 들어갑니다(<a href="https://bibleox.com/ko/ko-nkrv/1kor/12/#L13">고전 12:13</a>).</p></li><li><p>세례는 물과 성령으로 이루어집니다(<a href="https://bibleox.com/ko/ko-nkrv/in/3/#L3,5-6">요 3:3,5-6</a>).</p></li><li><p>성령 세례는 그리스도 부활 후 50일째에 처음으로 이루어집니다(<a href="https://bibleox.com/ko/ko-nkrv/act/1/#L1-5,8-9">행 1:1-5,8-9</a>).</p></li></ol><h3>세례를 통해 교회에 들어갑니다</h3><blockquote><p>“우리가 유대인이나 헬라인이나 종이나 자유인이나 다 <strong><mark>한 성령으로 세례를 받아 한 몸이 되었고</mark></strong> 또 다 한 성령을 마시게 하셨느니라” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/12/#L13">고전 12:13</a>)</p></blockquote><blockquote><p>“<strong><mark>누구든지 그리스도와 합하기 위하여 세례를 받은 자는 그리스도로 옷 입었느니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gal/3/#L27">갈 3:27</a>)</p></blockquote><h3>세례는 물과 성령으로 나는 것입니다</h3><blockquote><p>“예수께서 대답하시되 진실로 진실로 네게 이르노니 <strong><mark>사람이 물과 성령으로 나지 아니하면 하나님의 나라에 들어갈 수 없느니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/in/3/#L5">요 3:5</a>)</p></blockquote><h3>그리스도께서 성령으로 세례를 베푸실 것입니다</h3><blockquote><p>“요한이 모든 사람에게 대답하여 이르되 나는 물로 너희에게 세례를 베풀거니와 나보다 능력이 많으신 이가 오시나니 나는 그의 신발끈을 풀기도 감당하지 못하겠노라 그는 <strong><mark>성령과 불로 너희에게 세례를 베푸실 것이요</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/lk/3/#L16">눅 3:16</a>; <a href="https://bibleox.com/ko/ko-nkrv/mf/3/#L11">마 3:11</a>; <a href="https://bibleox.com/ko/ko-nkrv/mk/1/#L8">막 1:8</a>)</p></blockquote><h3>그리스도께서 떠나시기 전에는 성령께서 오시지 않습니다</h3><blockquote><p>“그러나 내가 너희에게 실상을 말하노니 내가 떠나가는 것이 너희에게 유익이라 <strong><mark>내가 떠나가지 아니하면 보혜사가 너희에게로 오시지 아니할 것이요</mark></strong> 가면 내가 그를 너희에게로 보내리니” (<a href="https://bibleox.com/ko/ko-nkrv/in/16/#L7">요 16:7</a>; <a href="https://bibleox.com/ko/ko-nkrv/in/14/#L16">요 14:16</a>; <a href="https://bibleox.com/ko/ko-nkrv/in/14/#L26">요 14:26</a>)</p></blockquote><blockquote><p>“<strong><mark>내가 아버지께로부터 너희에게 보낼 보혜사</mark></strong> 곧 아버지께로부터 나오시는 진리의 성령이 오실 때에 그가 나를 증언하실 것이요” (<a href="https://bibleox.com/ko/ko-nkrv/in/15/#L26">요 15:26</a>)</p></blockquote><blockquote><p>“볼지어다 내가 내 아버지께서 약속하신 것을 너희에게 보내리니 너희는 <strong>위로부터 능력으로 입혀질 때까지 이 성에 머물라</strong> 하시니라” (<a href="https://bibleox.com/ko/ko-nkrv/lk/24/#L49">눅 24:49</a>)</p></blockquote><h3>부활 후에도 그리스도께서는 아직 아버지께 올라가지 않으셨습니다</h3><blockquote><p>“예수께서 이르시되 나를 붙들지 말라 <strong><mark>내가 아직 아버지께로 올라가지 아니하였노라</mark></strong> 너는 내 형제들에게 가서 이르되 내가 내 아버지 곧 너희 아버지, 내 하나님 곧 너희 하나님께로 올라간다 하라 하시니” (<a href="https://bibleox.com/ko/ko-nkrv/in/20/#L17">요 20:17</a>)</p></blockquote><h3>그리스도께서 약속하신 일이 부활 후 50일째에 이루어집니다</h3><p>약속된 성령 세례는 그리스도 부활 후 50일째에 처음으로 이루어졌습니다:</p><blockquote><p>“데오빌로여 내가 먼저 쓴 글에는 무릇 예수께서 행하시며 가르치시기를 시작하심부터 그가 택하신 사도들에게 성령으로 명하시고 승천하신 날까지의 일을 기록하였노라 그가 고난 받으신 후에 또한 그들에게 확실한 많은 증거로 친히 살아 계심을 나타내사 <strong><mark>사십 일 동안 그들에게 보이시며</mark></strong> 하나님 나라의 일을 말씀하시니라 사도와 함께 모이사 그들에게 분부하여 이르시되 <strong><mark>예루살렘을 떠나지 말고 내게서 들은 바 아버지께서 약속하신 것을 기다리라 요한은 물로 세례를 베풀었으나 너희는 몇 날이 못되어 성령으로 세례를 받으리라</mark></strong> 하셨느니라 &lt;…&gt; 오직 성령이 너희에게 임하시면 너희가 권능을 받고 예루살렘과 온 유대와 사마리아와 땅 끝까지 이르러 내 증인이 되리라 하시니라 이 말씀을 마치시고 그들이 보는데 올려져 가시니 구름이 그를 가리어 보이지 않게 하더라” (<a href="https://bibleox.com/ko/ko-nkrv/act/1/#L1-5,8-9">행 1:1-5,8-9</a>)</p></blockquote><blockquote><p>“<strong>오순절 날이 이미 이르매</strong> 그들이 다같이 한 곳에 모였더니 &lt;…&gt; <strong><mark>마치 불의 혀처럼 갈라지는 것들이 그들에게 보여 각 사람 위에 하나씩 임하여 있더니 그들이 다 성령의 충만함을 받고</mark></strong> 성령이 말하게 하심을 따라 다른 언어들로 말하기를 시작하니라” (<a href="https://bibleox.com/ko/ko-nkrv/act/2/#L1,3-4">행 2:1,3-4</a>)</p></blockquote><h3>그러나 그리스도 부활 당일에도 성령의 파견이 언급되지만 세례는 언급되지 않습니다</h3><p>여기서 사도들에게 교회의 권위가 주어지고 사제 품계가 세워집니다:</p><blockquote><p>“<strong>안식 후 첫날 일찍이</strong> 아직 어두울 때에 막달라 마리아가 무덤에 와서 돌이 무덤에서 옮겨진 것을 보고 &lt;…&gt; 이 날 곧 <strong>안식 후 첫날 저녁 때에</strong> 제자들이 유대인들을 두려워하여 모인 곳의 문들을 닫았더니 <strong>예수께서 오사</strong> 가운데 서서 이르시되 너희에게 평강이 있을지어다 &lt;…&gt; 이 말씀을 하시고 그들을 향하사 <strong>숨을 내쉬며 이르시되 성령을 받으라</strong> 너희가 누구의 죄든지 사하면 사하여질 것이요 누구의 죄든지 그대로 두면 그대로 있으리라 하시니라” (<a href="https://bibleox.com/ko/ko-nkrv/in/20/#L1,19,22-23">요 20:1,19,22-23</a>)</p></blockquote><h2>비판</h2><h3>“역사적 교회는 타락했다”</h3><p>교회에서 떨어져 나온 단체의 설립자들은 그리스도의 역사적 교회가 하느님에게서 벗어나 타락했으므로 자신들의 별도 단체가 필요했다는 주장 위에 자기 운동의 존재 모델을 세웁니다. 교회의 타락을 증명하지 못하면 그들의 별도 단체도 필요 없게 되고, 그리스도의 역사적 교회에 들어가야 합니다.</p><p>교회의 타락이라는 생각을 뒷받침하려고 이리에 관한 이런 구절을 자주 듭니다:</p><blockquote><p>“<strong><mark>내가 떠난 후에 사나운 이리가 여러분에게 들어와서 그 양 떼를 아끼지 아니하며 또한 여러분 중에서도 제자들을 끌어 자기를 따르게 하려고 어그러진 말을 하는 사람들이 일어날 줄을 내가 아노라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/act/20/#L29-30">행 20:29-30</a>)</p></blockquote><p>그러나 이 구절은 사람들을 교회에서 빼내어 <strong>자기를</strong> 따르게 하려는 거짓 교사들이 나타나리라는 예언일 뿐, 교회가 타락하리라는 예언이 아니라는 것을 인정해야 합니다.</p><p>그 조금 앞에서 사도는 장로(사제)들에게 자신과 양떼를 잘 살피라고 당부합니다:</p><blockquote><p>“바울이 밀레도에서 사람을 에베소로 보내어 <strong>교회 장로들을 청하니</strong> &lt;…&gt; <strong><mark>여러분은 자기를 위하여 또는 온 양 떼를 위하여 삼가라</mark></strong> 성령이 그들 가운데 여러분을 감독자로 삼고 하나님이 자기 피로 사신 <strong>교회를 보살피게 하셨느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/act/20/#L17,28">행 20:17,28</a>)</p></blockquote><p>사도는 왜 양떼를 돌보라고 합니까? 곧바로 답을 줍니다. 거짓 교사들이 나타나 이리처럼 교회의 양떼를 약탈하려 할 것이기 때문입니다(<a href="https://bibleox.com/ko/ko-nkrv/act/20/#L29-30">행 20:29-30</a>). 그러나 성령께서 세우신 장로들은 이를 허용해서는 안 됩니다.</p><p>장로들은 교회의 양떼를 지켜 낼 수 있을까요? 그렇습니다. 교회의 타락에 관한 예언은 없지만 교회가 패하지 않는다는 예언은 있기 때문입니다:</p><blockquote><p>“또 내가 네게 이르노니 너는 베드로라 내가 이 반석 위에 내 교회를 세우리니 <strong><mark>음부의 권세가 이기지 못하리라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/16/#L18">마 16:18</a>)</p></blockquote><blockquote><p>“교회 안에서와 그리스도 예수 안에서 영광이 대대로 <strong><mark>영원무궁하기를</mark></strong> 원하노라 아멘” (<a href="https://bibleox.com/ko/ko-nkrv/ef/3/#L21">엡 3:21</a>)</p></blockquote><blockquote><p>“내가 너희에게 분부한 모든 것을 가르쳐 지키게 하라 볼지어다 내가 <strong><mark>세상 끝날까지 너희와 항상 함께 있으리라</mark></strong> 하시니라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/28/#L20">마 28:20</a>)</p></blockquote><blockquote><p>“내가 아버지께 구하겠으니 그가 또 다른 보혜사를 너희에게 주사 <strong><mark>영원토록 너희와 함께 있게 하리니</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/in/14/#L16">요 14:16</a>)</p></blockquote><h3>“기도하려고 모인 두세 사람이 곧 교회이다”</h3><p>그리스도께서 당신의 교회를 단번에 세우신 뒤로, 나중에 그리스도교 공동체를 세우는 사람들은 무엇보다 그리스도의 교회와 분리된 자기 새 단체의 출현을 설명해야 합니다. 평범한 사람이 최근에 세운 그런 단체는 초기 그리스도인들과 직접적인 역사적 연결이 없으므로, 자기들이 2000년 전에 세워진 그리스도의 교회의 일부임을 늘 증명해야 합니다. 그래서 공동 기도의 중요성에 관한 성경 구절을 자주 이용합니다. 기도하는 두세 사람 가운데 그리스도께서 계시니 그렇게 기도하는 사람들은 이미 그 자체로 교회라는 것입니다:</p><blockquote><p>“진실로 다시 너희에게 이르노니 너희 중의 두 사람이 땅에서 합심하여 무엇이든지 구하면 하늘에 계신 내 아버지께서 그들을 위하여 이루게 하시리라 <strong>두세 사람이 내 이름으로 모인 곳에는 나도 그들 중에 있느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/18/#L19-20">마 18:19-20</a>)</p></blockquote><p>그러나 이 구절은 글자 그대로 공동 기도의 힘을 말할 뿐, 교회를 말하지 않습니다. 여기에는 교회라는 말이 없습니다. 그러나 조금 앞에는 교회에 관한 말씀이 있습니다:</p><blockquote><p>“<strong>네 형제가</strong> 죄를 범하거든 가서 <strong>너와 그 사람과만 상대하여</strong> 권고하라 만일 들으면 네가 네 형제를 얻은 것이요 만일 듣지 않거든 <strong>한두 사람을 데리고 가서</strong> 두세 증인의 입으로 말마다 확증하게 하라 <strong><mark>만일 그들의 말도 듣지 않거든 교회에 말하고 교회의 말도 듣지 않거든</mark></strong> 이방인과 세리와 같이 여기라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/18/#L15-17">마 18:15-17</a>)</p></blockquote><p>여기서 만나는 사람들은 다음과 같습니다:</p><ul><li><p>나;</p></li><li><p>죄지은 형제;</p></li><li><p>증인 한두 사람.</p></li></ul><p>모두 합하면 1+1+2=4명, 적어도 3명입니다.</p><p>이렇게 모인 세 사람은 아직 교회가 아닙니다. 보시다시피 이들 모두는 자기들 스스로가 아니라 교회에 판단을 청해야 하기 때문입니다. 그러므로 교회는 기도하려고 모인 두세 사람이 아니라, 판단을 청할 수 있고 그 대답을 듣고 따르거나 따르지 않을 수 있는, 늘 눈에 보이게 존재하는 어떤 것입니다. 교회의 이 대답을 듣지 않는 사람은 교회의 지체들에게 “이방인이나 세리처럼” 됩니다.</p><p>판단은 누가 할 수 있습니까? 사도들과 그 후계자인 주교들입니다(<a href="https://bibleox.com/ko/ko-nkrv/mf/18/#L18">마 18:18</a>). 예를 들어 디모데 주교입니다:</p><blockquote><p>“<strong>장로에 대한 고발은 두세 증인이 없으면 받지 말 것이요</strong> 범죄한 자들을 모든 사람 앞에서 꾸짖어 나머지 사람들로 두려워하게 하라” (<a href="https://bibleox.com/ko/ko-nkrv/1tim/5/#L19-20">딤전 5:19-20</a>)</p></blockquote><p>그러므로 남을 판단할 권리가 없는 기도하는 두세 사람에 관한 해석은 교회에 해당하지 않습니다. 또 교회에서 분리된 단체의 설립자는 교회의 말을 듣지 않음으로써 스스로 교회에게 “이방인이나 세리처럼” 됩니다(<a href="https://bibleox.com/ko/ko-nkrv/mf/18/#L17">마 18:17</a>). 그가 자기 단체에서 누구를 판단하겠습니까? 자신에게 있었던 적도 없는 판단의 권한을 어떻게 줄 수 있겠습니까? 답은 분명합니다.</p>'
