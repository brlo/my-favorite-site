  title: 교회는 영원하며 무너지지 않습니다
  copy_cover: true
  body: <h2>하느님께서는 언제나 교회와 함께 계십니다</h2><p>성령께서는 교회에 영원히 파견되십니다:</p><blockquote><p>“내가 아버지께 구하면 다른 협조자를 보내 주셔서 <strong>너희와 영원히 함께 계시도록</strong> 하실 것이다.” (<a href="https://bibleox.com/ko/ko-ctb/in/14/#L16">요한 14:16</a>)</p></blockquote><p>주 예수 그리스도께서는 언제나 교회와 함께 계시겠다고 약속하셨습니다:</p><blockquote><p>“내가 너희에게 명한 모든 것을 지키도록 가르쳐라. 내가 <strong>세상 끝날까지 항상 너희와 함께 있겠다</strong>.‘” (<a href="https://bibleox.com/ko/ko-ctb/mf/28/#L20">마태 28:20</a>)</p></blockquote><h2>교회는 패하지 않습니다</h2><p>주님께서는 교회가 패하지 않으리라는 예언을 말씀하십니다:</p><blockquote><p>“잘 들어라. 너는 베드로이다. 내가 이 반석 위에 내 교회를 세울 터인즉 <strong>죽음의 힘도 감히 그것을 누르지 못할 것이다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/mf/16/#L18">마태 16:18</a>)</p></blockquote><h2>진리는 언제나 교회 안에 있을 것입니다</h2><p>진리는 영원히 교회와 함께 있을 것입니다:</p><blockquote><p>“원로인 나는 선택받은 귀부인과 그 자녀들에게 이 편지를 씁니다. 나는 여러분을 진정으로 사랑합니다. 나뿐만 아니라 <strong>진리</strong>를 아는 모든 사람들이 여러분을 사랑합니다. 지금 우리 안에 있고 또 <strong>영원히 우리와 함께 있을 진리</strong> 때문에 우리는 여러분을 사랑합니다.” (<a href="https://bibleox.com/ko/ko-ctb/2in/1/#L1-2">2요한 1:1-2</a>)</p></blockquote><h2>교회는 언제나 하느님을 찬양할 것입니다</h2><p>교회 안에서 모든 세대의 모든 이가 하느님을 찬양할 것입니다:</p><blockquote><p>“하느님께서 <strong>교회와 그리스도 예수를 통하여</strong> <strong>세세무궁토록 영광을</strong> 받으시기를 빕니다. 아멘.” (<a href="https://bibleox.com/ko/ko-ctb/ef/3/#L21">에페 3:21</a>)</p></blockquote><h2>성체성혈성사는 그리스도께서 오실 때까지 교회에서 거행될 것입니다</h2><blockquote><p>“그러므로 여러분은 이 <strong>빵</strong>을 먹고 이 <strong>잔</strong>을 마실 때마다 주님의 죽으심을 선포하고, 이것을 <strong>주님께서 다시 오실 때까지</strong> 하십시오.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/11/#L26">1고린 11:26</a>)</p></blockquote>
