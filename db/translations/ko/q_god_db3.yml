- src: Бог-безначальный
  path: zue3_시작이없으신하느님
  title: 시작이 없으신 하느님
  copy_cover: true
  body: <p>하느님께서는 시작이 있는 모든 것에 시작을 주셨습니다:</p><blockquote><p>“한 처음, 천지가 창조되기 전부터 말씀이 계셨다. 말씀은 하느님과 함께 계셨고 하느님과 똑같은 분이셨다. &lt;…&gt; 모든 것은 말씀을 통하여 생겨났고 <strong>이 말씀 없이 생겨난 것은 하나도 없다</strong>. 생겨난 모든 것이” (<a href="https://bibleox.com/ko/ko-ctb/in/1/#L1,3">요한 1:1,3</a>)</p></blockquote><p>날들의 시작이 없는 하느님의 아들의 예형인 사제 멜기세덱:</p><blockquote><p>“그는 아버지도 없고 어머니도 없고 족보도 없으며 <strong>생애의 시작도 끝도 없이 하느님의 아들을 닮아서</strong> 영원히 사제직을 맡아 보는 분입니다.” (<a href="https://bibleox.com/ko/ko-ctb/evr/7/#L3">히브 7:3</a>)</p></blockquote>
  meta_desc: 하느님께 시작이 없으심에 관한 성경 구절
