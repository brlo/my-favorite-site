- src: Бог-всемогущий
  path: iVKa_전능하신하느님
  title: 전능하신 하느님
  copy_cover: true
  body: <h2>전능하신 하느님</h2><blockquote><p>“아브람이 구십 구 세 되던 해에 야훼께서 아브람에게 나타나시어 말씀하셨다. ‘<strong>나는 전능한 신이다</strong>. 너는 내 앞을 떠나지 말고 흠 없이 살아라.” (<a href="https://bibleox.com/ko/ko-ctb/gen/17/#L1">창 17:1</a>; <a href="https://bibleox.com/ko/ko-ctb/gen/28/#L3">창 28:3</a>; <a href="https://bibleox.com/ko/ko-ctb/gen/35/#L11">창 35:11</a>; <a href="https://bibleox.com/ko/ko-ctb/gen/43/#L14">창 43:14</a>; <a href="https://bibleox.com/ko/ko-ctb/gen/48/#L3">창 48:3</a>; <a href="https://bibleox.com/ko/ko-ctb/gen/49/#L25">창 49:25</a>; <a href="https://bibleox.com/ko/ko-ctb/chis/24/#L4">민 24:4</a>; <a href="https://bibleox.com/ko/ko-ctb/chis/24/#L16">민 24:16</a>; <a href="https://bibleox.com/ko/ko-ctb/is/13/#L6">이사 13:6</a>; <a href="https://bibleox.com/ko/ko-ctb/iez/1/#L24">에제 1:24</a>; <a href="https://bibleox.com/ko/ko-ctb/iez/10/#L5">에제 10:5</a>; <a href="https://bibleox.com/ko/ko-ctb/iol/1/#L15">요엘 1:15</a>)</p></blockquote><blockquote><p>“나는 아브라함과 이사악과 야곱에게 <strong>전능의 신</strong>으로 나를 드러낸 일은 있지만 야훼라는 이름으로 나를 알린 일은 없었다.” (<a href="https://bibleox.com/ko/ko-ctb/ish/6/#L3">출 6:3</a>)</p></blockquote><blockquote><p>“알았습니다. <strong>당신께서는 못하실 일이 없으십니다</strong>. 계획하신 일은 무엇이든지 이루십니다.” (<a href="https://bibleox.com/ko/ko-ctb/iov/42/#L2">욥 42:2</a>)</p></blockquote><blockquote><p>“주님께서는 <strong>모든 것을 하실 수 있으시므로</strong> 모든 이를 불쌍히 여기시고, 사람들이 회개하도록 그들의 죄를 눈감아 주신다” (<a href="https://bibleox.com/ko/gr-lxx-byz/prs/11/#L23">지혜 11:23</a>, 그리스어에서 번역)</p></blockquote><blockquote><p>“지존하신 분의 거처에 몸을 숨기고 <strong>전능하신 분</strong>의 그늘 아래 머무는 사람아,” (<a href="https://bibleox.com/ko/ko-ctb/ps/91/#L1">시편 91:1</a>; <a href="https://bibleox.com/ko/ko-ctb/ps/68/#L14">시편 68:14</a>)</p></blockquote><blockquote><p>“<strong>주님의 전능하신 말씀이</strong> 하늘 옥좌에서 내려왔다” (<a href="https://bibleox.com/ko/gr-lxx-byz/prs/18/#L15">지혜 18:15</a>, 그리스어에서 번역)</p></blockquote><blockquote><p>“야훼 주님, 주께서는 힘있게 팔을 내뻗으시어 하늘과 땅을 만드셨습니다. <strong>주께서는 못하실 일이 없으십니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/ier/32/#L17">예레 32:17</a>)</p></blockquote><blockquote><p>“나를 보아라. 야훼는 모든 사람을 낸 하느님이라, <strong>못할 일이 없다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/ier/32/#L27">예레 32:27</a>)</p></blockquote><blockquote><p>“예수께서는 ‘<strong>사람의 힘으로는 할 수 없는 일이지만 하느님께서는 하실 수 있다</strong>’하고 대답하셨다.” (<a href="https://bibleox.com/ko/ko-ctb/lk/18/#L27">루가 18:27</a>)</p></blockquote><blockquote><p>“예수께서는 제자들을 똑바로 보시며 ‘그것은 사람의 힘으로는 할 수 없으나 하느님은 하실 수 있는 일이다. <strong>하느님께서는 무슨 일이나 다 하실 수 있다</strong>.’하고 말씀하셨다.” (<a href="https://bibleox.com/ko/ko-ctb/mk/10/#L27">마르 10:27</a>)</p></blockquote><h2>하느님께서 정하신 대로 이루어집니다</h2><blockquote><p>“만군의 야훼께서 맹세코 말씀하신다. ‘<strong>내가 생각한 대로 반드시 되고 내가 정한 대로 반드시 이루어진다</strong>. &lt;…&gt; 이렇게 나는 나의 뜻을 온 땅 위에 이루리라. 이렇게 팔을 뻗쳐 모든 백성을 치리라.’ <strong>만군의 야훼께서 한번 작정하셨으니 누가 그것을 꺾을 수 있으랴</strong>? 그가 한번 팔을 펴시니 누가 감히 거두어 들이게 할 수 있으랴?” (<a href="https://bibleox.com/ko/ko-ctb/is/14/#L24,26-27">이사 14:24,26-27</a>)</p></blockquote>
  meta_desc: 하느님의 전능하심에 관한 성경 구절
