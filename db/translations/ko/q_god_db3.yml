- src: Бог_источник_добра,_но_не_зла
  path: QOPS_하느님은선의근원이시며악의근원이아니시다
  title: 하느님은 선의 근원이시며 악의 근원이 아니십니다
  copy_cover: true
  body: <h2>하느님은 선의 근원이시며 악의 근원이 아니십니다</h2><blockquote><p>“사람이 시험을 받을 때에 내가 하나님께 시험을 받는다 하지 말지니 <strong>하나님은 악에게 시험을 받지도 아니하시고 친히 아무도 시험하지 아니하시느니라</strong> &lt;…&gt; 온갖 좋은 은사와 온전한 선물이 다 위로부터 빛들의 아버지께로부터 내려오나니 그는 변함도 없으시고 회전하는 그림자도 없으시니라” (<a href="https://bibleox.com/ko/ko-nkrv/iak/1/#L13,17">약 1:13,17</a>)</p></blockquote><blockquote><p>“우리가 그에게서 듣고 너희에게 전하는 소식은 이것이니 곧 <strong>하나님은 빛이시라 그에게는 어둠이 조금도 없으시다</strong>는 것이니라” (<a href="https://bibleox.com/ko/ko-nkrv/1in/1/#L5">요일 1:5</a>)</p></blockquote><blockquote><p>“예수께서 이르시되 네가 어찌하여 나를 선하다 일컫느냐 <strong>하나님 한 분 외에는 선한 이가 없느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mk/10/#L18">막 10:18</a>; <a href="https://bibleox.com/ko/ko-nkrv/mf/19/#L17">마 19:17</a>; <a href="https://bibleox.com/ko/ko-nkrv/lk/18/#L19">눅 18:19</a>)</p></blockquote><blockquote><p>“<strong>여호와께서는 모든 것을 선대하시며</strong> 그 지으신 모든 것에 긍휼을 베푸시는도다” (<a href="https://bibleox.com/ko/ko-nkrv/ps/145/#L9">시 145:9</a>)</p></blockquote><h2>죄가 없으신 분</h2><blockquote><p>“그가 우리 죄를 없애려고 나타나신 것을 너희가 아나니 <strong>그에게는 죄가 없느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1in/3/#L5">요일 3:5</a>)</p></blockquote><blockquote><p>“죄를 짓는 자마다 불법을 행하나니 죄는 불법이라 &lt;…&gt; <strong>죄를 짓는 자는 마귀에게 속하나니</strong> 마귀는 처음부터 범죄함이라 하나님의 아들이 나타나신 것은 마귀의 일을 멸하려 하심이라 하나님께로부터 난 자마다 죄를 짓지 아니하나니 이는 하나님의 씨가 그의 속에 거함이요 그도 범죄하지 못하는 것은 하나님께로부터 났음이라” (<a href="https://bibleox.com/ko/ko-nkrv/1in/3/#L4,8-9">요일 3:4,8-9</a>)</p></blockquote><h2>하느님은 사랑이십니다</h2><blockquote><p>“사랑하지 아니하는 자는 하나님을 알지 못하나니 이는 <strong>하나님은 사랑이심이라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1in/4/#L8">요일 4:8</a>)</p></blockquote><blockquote><p>“하나님이 우리를 사랑하시는 사랑을 우리가 알고 믿었노니 <strong>하나님은 사랑이시라</strong> 사랑 안에 거하는 자는 하나님 안에 거하고 하나님도 그의 안에 거하시느니라” (<a href="https://bibleox.com/ko/ko-nkrv/1in/4/#L16">요일 4:16</a>)</p></blockquote><h2>하느님께서는 모든 사람이 구원받기를 바라십니다</h2><blockquote><p>“그러므로 내가 첫째로 권하노니 모든 사람을 위하여 간구와 기도와 도고와 감사를 하되 &lt;…&gt; 이것이 우리 구주 하나님 앞에 선하고 받으실 만한 것이니 <strong>하나님은 모든 사람이 구원을 받으며</strong> 진리를 아는 데에 이르기를 원하시느니라” (<a href="https://bibleox.com/ko/ko-nkrv/1tim/2/#L1,3-4">딤전 2:1,3-4</a>)</p></blockquote><blockquote><p>“주의 약속은 어떤 이들이 더디다고 생각하는 것 같이 더딘 것이 아니라 오직 <strong>주께서는</strong> 너희를 대하여 오래 참으사 <strong>아무도 멸망하지 아니하고 다 회개하기에 이르기를 원하시느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2pet/3/#L9">벧후 3:9</a>)</p></blockquote><blockquote><p>“너는 그들에게 말하라 주 여호와의 말씀이니라 나의 삶을 두고 맹세하노니 <strong>나는 악인이 죽는 것을 기뻐하지 아니하고</strong> <strong>악인이 그의 길에서 돌이켜 떠나 사는 것을 기뻐하노라</strong> 이스라엘 족속아 돌이키고 돌이키라 너희 악한 길에서 떠나라 어찌 죽고자 하느냐 하셨다 하라” (<a href="https://bibleox.com/ko/ko-nkrv/iez/33/#L11">겔 33:11</a>)</p></blockquote><blockquote><p>“주 여호와의 말씀이니라 <strong>내가 어찌 악인이 죽는 것을 조금인들 기뻐하랴</strong> 그가 돌이켜 그 길에서 떠나 사는 것을 어찌 기뻐하지 아니하겠느냐” (<a href="https://bibleox.com/ko/ko-nkrv/iez/18/#L23">겔 18:23</a>)</p></blockquote><blockquote><p>“<strong>하나님이 세상을 이처럼 사랑하사 독생자를 주셨으니 이는 그를 믿는 자마다 멸망하지 않고 영생을 얻게 하려 하심이라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/in/3/#L16">요 3:16</a>)</p></blockquote><blockquote><p>“<strong>인자가 온 것은 잃어버린 자를 찾아 구원하려 함이니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/lk/19/#L10">눅 19:10</a>)</p></blockquote><h2>그러나 모두가 구원받는 것은 아닙니다</h2><blockquote><p>“좁은 문으로 들어가기를 힘쓰라 내가 너희에게 이르노니 <strong>들어가기를 구하여도 못하는 자가 많으리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/lk/13/#L24">눅 13:24</a>)</p></blockquote><blockquote><p>“좁은 문으로 들어가라 <strong>멸망으로 인도하는 문은 크고 그 길이 넓어 그리로 들어가는 자가 많고</strong> 생명으로 인도하는 문은 좁고 길이 협착하여 찾는 자가 적음이라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/7/#L13-14">마 7:13-14</a>)</p></blockquote><blockquote><p>“<strong>나더러 주여 주여 하는 자마다 다 천국에 들어갈 것이 아니요</strong> 다만 하늘에 계신 내 아버지의 뜻대로 행하는 자라야 들어가리라 그 날에 많은 사람이 나더러 이르되 주여 주여 우리가 주의 이름으로 선지자 노릇 하며 주의 이름으로 귀신을 쫓아 내며 주의 이름으로 많은 권능을 행하지 아니하였나이까 하리니 그 때에 내가 그들에게 밝히 말하되 <strong>내가 너희를 도무지 알지 못하니</strong> 불법을 행하는 자들아 내게서 떠나가라 하리라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/7/#L21-23">마 7:21-23</a>)</p></blockquote><blockquote><p>“<strong>모두가 구원받는 것은 아니다</strong>” (<a href="https://bibleox.com/ko/en-nrsv/3ezd/8/#L41">3에스 8:41</a>, 영어 번역(NRSV)에서 옮김)</p></blockquote>
