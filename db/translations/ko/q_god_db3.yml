  path: Zcsu_하느님은만물의창조주이시다
  title: 하느님은 존재하는 모든 것의 창조주이십니다
  copy_cover: true
  body: <h2>하느님께서 모든 것을 창조하셨습니다</h2><blockquote><p>“태초에 말씀이 계시니라 이 말씀이 하나님과 함께 계셨으니 이 말씀은 곧 하나님이시니라 &lt;…&gt; <strong>만물이 그로 말미암아 지은 바 되었으니 지은 것이 하나도 그가 없이는 된 것이 없느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/in/1/#L1,3">요 1:1,3</a>)</p></blockquote><blockquote><p>“<strong><mark>태초에 하나님이 천지를 창조하시니라</mark></strong> &lt;…&gt; 하나님이 자기 형상 곧 하나님의 형상대로 사람을 창조하시되 <strong><mark>남자와 여자를 창조하시고</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gen/1/#L1,27">창 1:1,27</a>)</p></blockquote><blockquote><p>“야곱의 분깃은 이같지 아니하시니 그는 <strong>만물의 조성자요</strong> 이스라엘은 그의 기업의 지파라 그 이름은 만군의 여호와시니라” (<a href="https://bibleox.com/ko/ko-nkrv/ier/10/#L16">렘 10:16</a>)</p></blockquote><blockquote><p>“<strong>우주와 그 가운데 있는 만물을 지으신 하나님께서는</strong> 천지의 주재시니 손으로 지은 전에 계시지 아니하시고” (<a href="https://bibleox.com/ko/ko-nkrv/act/17/#L24">행 17:24</a>)</p></blockquote><blockquote><p>“<strong>영원히 사시는 분께서 만물을 다 함께 창조하셨다</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/prsir/18/#L1">집회 18:1</a>, 그리스어에서 번역)</p></blockquote><blockquote><p>“<strong>주님께서 만물을 지으셨고</strong> 경건한 이들에게 지혜를 주셨다” (<a href="https://bibleox.com/ko/gr-lxx-byz/prsir/43/#L33">집회 43:33</a>, 그리스어에서 번역)</p></blockquote><blockquote><p>“네 구속자요 모태에서 너를 지은 나 여호와가 이같이 말하노라 <strong>나는 만물을 지은 여호와라</strong> 홀로 하늘을 폈으며 나와 함께 한 자 없이 땅을 펼쳤고” (<a href="https://bibleox.com/ko/ko-nkrv/is/44/#L24">사 44:24</a>)</p></blockquote><blockquote><p>“우리 주 하나님이여 영광과 존귀와 권능을 받으시는 것이 합당하오니 <strong>주께서 만물을 지으신지라 만물이 주의 뜻대로 있었고 또 지으심을 받았나이다</strong> 하더라” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/4/#L11">계 4:11</a>)</p></blockquote><blockquote><p>“얘야, 하늘과 땅과 그 안에 있는 모든 것을 바라보고, <strong>하느님께서 이것들을 있는 것에서 만들지 않으셨음을</strong> 깨달아라. 사람도 그렇게 생겨났다” (<a href="https://bibleox.com/ko/gr-lxx-byz/2mak/7/#L28">2마카 7:28</a>, 그리스어에서 번역)</p></blockquote><blockquote><p>“<strong>참으로 만물을 지으신 전능하신 하느님</strong>” (<a href="https://bibleox.com/ko/en-nrsv/3ezd/16/#L62">3에스 16:62</a>, 영어 번역(NRSV)에서 옮김)</p></blockquote><blockquote><p>“<strong>여호와의 말씀으로 하늘이 지음이 되었으며</strong> 그 만상을 그의 입 기운으로 이루었도다 그가 바닷물을 모아 무더기 같이 쌓으시며 깊은 물을 곳간에 두시도다 &lt;…&gt; <strong>그가 말씀하시매 이루어졌으며</strong> 명령하시매 견고히 섰도다” (<a href="https://bibleox.com/ko/ko-nkrv/ps/33/#L6-7,9">시 33:6-7,9</a>)</p></blockquote><blockquote><p>“<strong>오직 주는 여호와시라 하늘과 하늘들의 하늘과 일월 성신과 땅과 땅 위의 만물과 바다와 그 가운데 모든 것을 지으시고</strong> 다 보존하시오니 모든 천군이 주께 경배하나이다” (<a href="https://bibleox.com/ko/ko-nkrv/neem/9/#L6">느 9:6</a>)</p></blockquote><blockquote><p>“그들이 듣고 한마음으로 하나님께 소리를 높여 이르되 대주재여 <strong>천지와 바다와 그 가운데 만물을 지은 이시요</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/act/4/#L24">행 4:24</a>)</p></blockquote><blockquote><p>“이르되 여러분이여 어찌하여 이러한 일을 하느냐 우리도 여러분과 같은 성정을 가진 사람이라 여러분에게 복음을 전하는 것은 이런 헛된 일을 버리고 <strong>천지와 바다와 그 가운데 만물을 지으시고 살아 계신 하나님</strong>께로 돌아오게 함이라” (<a href="https://bibleox.com/ko/ko-nkrv/act/14/#L15">행 14:15</a>)</p></blockquote><blockquote><p>“이는 <strong>엿새 동안에 나 여호와가 하늘과 땅과 바다와 그 가운데 모든 것을 만들고</strong> 일곱째 날에 쉬었음이라 그러므로 나 여호와가 안식일을 복되게 하여 그 날을 거룩하게 하였느니라” (<a href="https://bibleox.com/ko/ko-nkrv/ish/20/#L11">출 20:11</a>)</p></blockquote><blockquote><p>“<strong>만물의 주재자께서는</strong> 누구의 얼굴도 꺼리지 않으시고 위대함도 어려워하지 않으신다. <strong>작은 이도 큰 이도 그분께서 친히 만드시고</strong> 모두를 똑같이 돌보시기 때문이다” (<a href="https://bibleox.com/ko/gr-lxx-byz/prs/6/#L7">지혜 6:7</a>, 그리스어에서 번역)</p></blockquote><blockquote><p>“듣는 귀와 보는 눈은 <strong>다 여호와께서 지으신 것이니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/pr/20/#L12">잠 20:12</a>)</p></blockquote><blockquote><p>“<strong>땅의 깊은 곳이</strong> 그의 손 안에 있으며 산들의 높은 곳도 그의 것이로다 바다도 그의 것이라 그가 만드셨고 <strong>육지도</strong> 그의 손이 지으셨도다 오라 우리가 굽혀 경배하며 <strong>우리를 지으신 여호와</strong> 앞에 무릎을 꿇자” (<a href="https://bibleox.com/ko/ko-nkrv/ps/95/#L4-6">시 95:4-6</a>)</p></blockquote><blockquote><p>“<strong>내가 땅을 만들고</strong> 그 위에 사람을 창조하였으며 내가 내 손으로 하늘을 펴고 <strong>하늘의 모든 군대에게</strong> 명령하였노라” (<a href="https://bibleox.com/ko/ko-nkrv/is/45/#L12">사 45:12</a>)</p></blockquote><blockquote><p>“여호와께서 그의 권능으로 <strong>땅을 지으셨고</strong> 그의 지혜로 <strong>세계를</strong> 세우셨고 그의 명철로 하늘을 펴셨으며” (<a href="https://bibleox.com/ko/ko-nkrv/ier/10/#L12">렘 10:12</a>)</p></blockquote><blockquote><p>“나는 내 큰 능력과 나의 쳐든 팔로 <strong>땅과 지상에 있는 사람과 짐승들을 만들고</strong> 내가 보기에 옳은 사람에게 그것을 주었노라” (<a href="https://bibleox.com/ko/ko-nkrv/ier/27/#L5">렘 27:5</a>)</p></blockquote><blockquote><p>“슬프도소이다 주 여호와여 주께서 큰 능력과 펴신 팔로 <strong>천지를 지으셨사오니</strong> <strong>주에게는 할 수 없는 일이 없으시니이다</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ier/32/#L17">렘 32:17</a>)</p></blockquote><blockquote><p>“하느님을 알지 못하는 사람들은 모두 본성이 어리석어서 … <strong>불이나 바람이나 빠른 공기나 별들의 궤도나 거센 물이나 하늘의 빛나는 것들을</strong> 세상을 다스리는 신으로 여겼다. 그것들의 아름다움에 반하여 신으로 여겼다면, 그것들의 주인이 얼마나 더 뛰어나신지 알아야 한다. <strong>아름다움을 처음 내신 분께서 그것들을 창조하셨기 때문이다</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/prs/13/#L1-3">지혜 13:1-3</a>, 그리스어에서 번역)</p></blockquote><h2>하느님께서는 변하지 않으십니다. 세상 창조 때부터 변하지 않으셨습니다</h2><blockquote><p>“주님, 곧 전능하신 분께서 … <strong>영원 전부터 영원까지 계시는 분이시니 더해진 것도 줄어든 것도 없다</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/prsir/42/#L17,21">집회 42:17,21</a>, 그리스어에서 번역)</p></blockquote>
