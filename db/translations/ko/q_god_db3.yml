  path: Zcsu_하느님은만물의창조주이시다
  title: 하느님은 존재하는 모든 것의 창조주이십니다
  copy_cover: true
  body: <h2>하느님께서 모든 것을 창조하셨습니다</h2><blockquote><p>“한 처음, 천지가 창조되기 전부터 말씀이 계셨다. 말씀은 하느님과 함께 계셨고 하느님과 똑같은 분이셨다. &lt;…&gt; <strong>모든 것은 말씀을 통하여 생겨났고 이 말씀 없이 생겨난 것은 하나도 없다</strong>. 생겨난 모든 것이” (<a href="https://bibleox.com/ko/ko-ctb/in/1/#L1,3">요한 1:1,3</a>)</p></blockquote><blockquote><p>“한 처음에 <strong>하느님께서 하늘과 땅을 지어 내셨다</strong> … 빛이 … 창공이 … 뭍이 … 씨 있는 온갖 과일 나무가 … 하늘 창공에 빛나는 것들이 … 별들도 … 큰 물고기와 … 날아 다니는 온갖 새들을 … 온갖 들짐승과 집짐승과 … 길짐승을 … <strong>사람을 지어 내시되 남자와 여자로 지어 내시고</strong>” (<a href="https://bibleox.com/ko/ko-ctb/gen/1/#L1-27">창 1:1-27</a>)</p></blockquote><blockquote><p>“야곱을 골라 당신을 섬기라고 하신 이는 그런 신이 아니다. <strong>만물을 지으시고</strong> 이스라엘 지파를 당신의 몫으로 고르신 분, 그 이름 만군의 야훼시다.” (<a href="https://bibleox.com/ko/ko-ctb/ier/10/#L16">예레 10:16</a>)</p></blockquote><blockquote><p>“<strong>그분은 이 세상과 그 안에 있는 모든 것을 만드신 하느님이십니다</strong>. 그분은 하늘과 땅의 주인이시므로 사람이 만든 신전에서는 살지 않으십니다.” (<a href="https://bibleox.com/ko/ko-ctb/act/17/#L24">사도 17:24</a>)</p></blockquote><blockquote><p>“<strong>영원히 사시는 분께서 만물을 다 함께 창조하셨다</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/prsir/18/#L1">집회 18:1</a>, 그리스어에서 번역)</p></blockquote><blockquote><p>“<strong>주님께서 만물을 지으셨고</strong> 경건한 이들에게 지혜를 주셨다” (<a href="https://bibleox.com/ko/gr-lxx-byz/prsir/43/#L33">집회 43:33</a>, 그리스어에서 번역)</p></blockquote><blockquote><p>“너를 모태에 생기게 하신 하느님, 너를 구해 내신 야훼께서 말씀하신다. ‘<strong>나 야훼가 만물을 창조하였다</strong>. 나는 혼자서 하늘을 펼치고 땅을 밟아 늘였다. 그 때 누가 나를 도왔느냐?” (<a href="https://bibleox.com/ko/ko-ctb/is/44/#L24">이사 44:24</a>)</p></blockquote><blockquote><p>“주님이신 우리 하느님, 하느님은 영광과 영예와 권능을 누리실 만한 분이십니다. <strong>주님께서는 모든 것을 창조하셨고 만물이 주님의 뜻에 의해서 생겨났고 또 존재합니다</strong>‘하고 찬양했습니다.” (<a href="https://bibleox.com/ko/ko-ctb/otkr/4/#L11">묵시 4:11</a>)</p></blockquote><blockquote><p>“얘야, 하늘과 땅과 그 안에 있는 모든 것을 바라보고, <strong>하느님께서 이것들을 있는 것에서 만들지 않으셨음을</strong> 깨달아라. 사람도 그렇게 생겨났다” (<a href="https://bibleox.com/ko/gr-lxx-byz/2mak/7/#L28">2마카 7:28</a>, 그리스어에서 번역)</p></blockquote><blockquote><p>“<strong>참으로 만물을 지으신 전능하신 하느님</strong>” (<a href="https://bibleox.com/ko/en-nrsv/3ezd/16/#L62">3에스 16:62</a>, 영어 번역(NRSV)에서 옮김)</p></blockquote><blockquote><p>“<strong>야훼의 말씀으로 하늘이 펼쳐지고</strong>, 그의 입김으로 별들이 돋아났다. 바닷물을 독에 담으시고 깊은 땅 속 창고에 넣어 두셨다. &lt;…&gt; <strong>말씀 한 마디에 모든 것이 생기고</strong>, 한 마디 명령에 제 자리를 굳혔다.” (<a href="https://bibleox.com/ko/ko-ctb/ps/33/#L6-7,9">시편 33:6-7,9</a>)</p></blockquote><blockquote><p>“<strong>야훼여, 임께서는 홀로 하늘을 지으셨습니다. 하늘 위의 하늘과 거기에 딸린 별들을 지으셨습니다. 땅과 그 위에 있는 온갖 것, 바다와 그 안에 있는 온갖 것을 지으시고 목숨을 불어 넣으셨습니다</strong>. 하늘의 별들이 하느님께 예배드립니다.” (<a href="https://bibleox.com/ko/ko-ctb/neem/9/#L6">느헤 9:6</a>)</p></blockquote><blockquote><p>“동료들은 그 말을 듣고 일제히 큰 소리로 하느님께 기도드렸다. ‘<strong>하늘과 땅과 바다와 그 안에 모든 것을 창조하신 주님</strong>,” (<a href="https://bibleox.com/ko/ko-ctb/act/4/#L24">사도 4:24</a>)</p></blockquote><blockquote><p>“여러분, 이게 무슨 짓입니까? 우리도 여러분과 똑같은 사람입니다. 우리는 다만 여러분에게 복음을 전하여 여러분이 이런 헛된 우상을 버리고 살아 계신 하느님께 돌아 오게 하려고 왔을 따름입니다. <strong>이 하느님은 하늘과 땅과 바다와 그 안에 있는 모든 것을 만드신 분입니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/act/14/#L15">사도 14:15</a>)</p></blockquote><blockquote><p>“<strong>야훼께서 엿새 동안 하늘과 땅과 바다와 그 안에 있는 모든 것을 만드시고</strong>, 이레째 되는 날 쉬셨기 때문이다. 그래서 야훼께서 안식일을 축복하시고 거룩한 날로 삼으신 것이다.” (<a href="https://bibleox.com/ko/ko-ctb/ish/20/#L11">출 20:11</a>)</p></blockquote><blockquote><p>“<strong>만물의 주재자께서는</strong> 누구의 얼굴도 꺼리지 않으시고 위대함도 어려워하지 않으신다. <strong>작은 이도 큰 이도 그분께서 친히 만드시고</strong> 모두를 똑같이 돌보시기 때문이다” (<a href="https://bibleox.com/ko/gr-lxx-byz/prs/6/#L7">지혜 6:7</a>, 그리스어에서 번역)</p></blockquote><blockquote><p>“듣는 귀, 보는 눈, <strong>모두 야훼께서 만드신 것이다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/pr/20/#L12">잠언 20:12</a>)</p></blockquote><blockquote><p>“깊고 깊은 <strong>땅 속도</strong> 그분 수중에, 높고 높은 산들도 그분의 것, <strong>바다도</strong> 그의 것, 그분이 만드신 것, <strong>굳은 땅도</strong> 그분 손이 빚어 내신 것, 어서 와 허리 굽혀 경배드리자. <strong>우리를 지으신 야훼께</strong> 무릎을 꿇자.” (<a href="https://bibleox.com/ko/ko-ctb/ps/95/#L4-6">시편 95:4-6</a>)</p></blockquote><blockquote><p>“<strong>땅을 만든 것은 나다</strong>. 그 위에 <strong>사람을</strong> 창조해 놓은 것도 나다. 이 손으로 내가 <strong>하늘을</strong> 펼쳤다. 그 모든 <strong>별들에게</strong> 내가 명령을 내렸다.” (<a href="https://bibleox.com/ko/ko-ctb/is/45/#L12">이사 45:12</a>)</p></blockquote><blockquote><p>“당신 힘으로 <strong>땅을 만드시고</strong> 당신 지혜로 <strong>땅덩어리를</strong> 고정시키시고 당신 재주로 <strong>하늘을</strong> 펼치셨다.” (<a href="https://bibleox.com/ko/ko-ctb/ier/10/#L12">예레 10:12</a>)</p></blockquote><blockquote><p>“내가 손을 뻗어 있는 힘을 다하여 <strong>땅을 만들고 그 위에 사람과 짐승을 만들었으니</strong>, 아무나 내 눈에 드는 사람에게 천하를 맡길 권한이 나에게 있다.” (<a href="https://bibleox.com/ko/ko-ctb/ier/27/#L5">예레 27:5</a>)</p></blockquote><blockquote><p>“야훼 주님, 주께서는 힘있게 팔을 내뻗으시어 <strong>하늘과 땅을 만드셨습니다</strong>. <strong>주께서는 못하실 일이 없으십니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/ier/32/#L17">예레 32:17</a>)</p></blockquote><blockquote><p>“하느님을 알지 못하는 사람들은 모두 본성이 어리석어서 … <strong>불이나 바람이나 빠른 공기나 별들의 궤도나 거센 물이나 하늘의 빛나는 것들을</strong> 세상을 다스리는 신으로 여겼다. 그것들의 아름다움에 반하여 신으로 여겼다면, 그것들의 주인이 얼마나 더 뛰어나신지 알아야 한다. <strong>아름다움을 처음 내신 분께서 그것들을 창조하셨기 때문이다</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/prs/13/#L1-3">지혜 13:1-3</a>, 그리스어에서 번역)</p></blockquote><h2>하느님께서는 변하지 않으십니다. 세상 창조 때부터 변하지 않으셨습니다</h2><blockquote><p>“주님, 곧 전능하신 분께서 … <strong>영원 전부터 영원까지 계시는 분이시니 더해진 것도 줄어든 것도 없다</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/prsir/42/#L17,21">집회 42:17,21</a>, 그리스어에서 번역)</p></blockquote>
