- src: Бог-один
  path: Mrqu_하느님은한분이시다
  title: 하느님은 한 분이십니다
  copy_cover: true
  body: <h2>하느님은 한 분이시며 다른 신은 없습니다</h2><blockquote><p>“이스라엘의 임금, 그의 구세주, 만군의 야훼께서 말씀하신다. ‘내가 시작이요, 내가 마감이다. <strong>나밖에 다른 신이 없다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/is/44/#L6">이사 44:6</a>)</p></blockquote><blockquote><p>“내가 야훼다. 누가 또 있느냐? <strong>나밖에 다른 신은 없다</strong>. 너는 비록 나를 몰랐지만 너를 무장시킨 것은 나다.” (<a href="https://bibleox.com/ko/ko-ctb/is/45/#L5">이사 45:5</a>)</p></blockquote><blockquote><p>“이는 나밖에 다른 신이 없음을 해뜨는 곳에서 해지는 곳에까지 알리려는 것이다. <strong>내가 야훼다. 누가 또 있느냐</strong>?” (<a href="https://bibleox.com/ko/ko-ctb/is/45/#L6">이사 45:6</a>)</p></blockquote><blockquote><p>“야훼께서 말씀하신다. ‘에집트의 농민과 에디오피아의 상인들, 스바의 거인족이 너에게로 넘어와 너의 종이 되리라. 사슬에 묶여 네 뒤를 따르며 네 앞에 엎드리고 네 하느님께 비리라. 너에게만 하느님은 있다. 그밖에는 없다. <strong>그밖에는 다른 신이 없다</strong>.’” (<a href="https://bibleox.com/ko/ko-ctb/is/45/#L14">이사 45:14</a>)</p></blockquote><blockquote><p>“야훼께서 말씀하신다. 하늘을 창조하신 그분, 하느님이신 그분, 땅을 빚어 만드신 그분, 땅을 단단하게 다지신 그분, 땅을 황무지로 창조하지 아니하시고 사람이 살 수 있도록 빚어 만드신 그분께서 말씀하신다. ‘<strong>내가 야훼다. 누가 또 있느냐</strong>?” (<a href="https://bibleox.com/ko/ko-ctb/is/45/#L18">이사 45:18</a>)</p></blockquote><blockquote><p>“할 말이 있거든 해 보아라. 증거가 있거든 내놓아 보아라. 서로 의논해 보아라. 처음에 그것을 들려 준 자가 있느냐? 예전부터 그것을 일러 준 자가 있느냐? 나 야훼밖에 누가 있느냐? 나는 정의를 세워 구원을 이루는 하느님이니, <strong>나밖에 다른 신은 없다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/is/45/#L21">이사 45:21</a>)</p></blockquote><blockquote><p>“온 세상 모든 인간들아, 머리를 돌려 나에게로 와서 구원을 받아라. <strong>나만이 하느님, 다른 신은 없다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/is/45/#L22">이사 45:22</a>)</p></blockquote><blockquote><p>“처음부터 이루어진 일들을 생각해 보아라. 내가 신이다. 나밖에 없다. <strong>내가 하느님이다. 나와 같은 자 또 어디 있느냐</strong>?” (<a href="https://bibleox.com/ko/ko-ctb/is/46/#L9">이사 46:9</a>)</p></blockquote><blockquote><p>“이제 알아라. 내가 바로 그다. <strong>나 외에는 신이 없다</strong>. 죽이는 것도 나요 살리는 것도 나며 찌르는 것도 나요 고쳐 주는 것도 나다. 내 손에 잡은 것을 빼낼 자 없다.” (<a href="https://bibleox.com/ko/ko-ctb/vtor/32/#L39">신 32:39</a>)</p></blockquote><blockquote><p>“이 말씀을 듣고 율법학자들은 ‘그렇습니다. 선생님, <strong>하느님은 한 분이시며 그 밖에 다른 이가 없다</strong> 하신 말씀은 과연 옳습니다.” (<a href="https://bibleox.com/ko/ko-ctb/mk/12/#L32">마르 12:32</a>)</p></blockquote><blockquote><p>“우상 앞에 놓았던 제물을 먹는 문제가 나왔지만 우리가 알고 있는 대로 세상에 있는 우상은 아무것도 아니고 또 <strong>하느님은 한 분밖에 안 계십니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/8/#L4">1고린 8:4</a>)</p></blockquote><h2>다른 민족들의 신은 신이 아니라 마귀입니다</h2><blockquote><p>“<strong>하느님 아닌 귀신 듣지도 보지도 못하던 신들</strong>, 너희 선조들이 섬긴 일 없는 새로 나타난 신들에게 제물을 잡아 바치고” (<a href="https://bibleox.com/ko/ko-ctb/vtor/32/#L17">신 32:17</a>)</p></blockquote><blockquote><p>“<strong>귀신들에게 아들 딸을 잡아 바치며</strong>” (<a href="https://bibleox.com/ko/ko-ctb/ps/106/#L37">시편 106:37</a>)</p></blockquote><blockquote><p>“너희는 <strong>하느님이 아니라 마귀들에게 제사를 지내어</strong> 너희를 지으신 분을 노엽게 하였다” (<a href="https://bibleox.com/ko/gr-lxx-byz/var/4/#L7">바룩 4:7</a>, 그리스어에서 번역)</p></blockquote><blockquote><p>“아닙니다. 나는 <strong>이교도들이 바치는 바치는 제물이 하느님께 드리는 것이 아니라 마귀들에게 바치는 것</strong>이라는 말을 하려는 것입니다. 나는 여러분이 마귀들과 상종하는 자가 되지 않기를 바랍니다.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/10/#L20">1고린 10:20</a>)</p></blockquote><blockquote><p>“사람이 어찌 신을 만들 수 있겠습니까? <strong>사람이 만든 것이 어찌 신이 되겠습니까</strong>?‘” (<a href="https://bibleox.com/ko/ko-ctb/ier/16/#L20">예레 16:20</a>)</p></blockquote><blockquote><p>“너 예루살렘이 이 모양인데 어떻게 용서해 주겠느냐? 너의 자식들은 나를 저버리고, <strong>신 아닌 것을 걸어 맹세하였다</strong>. 배불리 먹여 놓았더니, 간음이나 하고, 창녀집에나 몰려 다니는구나.” (<a href="https://bibleox.com/ko/ko-ctb/ier/5/#L7">예레 5:7</a>)</p></blockquote><blockquote><p>“여러분이 하느님을 모르고 있을 때에는 <strong>본래 하느님이 아닌 신들의 종노릇을 하였습니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/gal/4/#L8">갈라 4:8</a>)</p></blockquote><blockquote><p>“<strong>뭇 족속이 섬기는 신은 모두 허수아비지만</strong> 야훼께서는 하늘을 만드셨다.” (<a href="https://bibleox.com/ko/ko-ctb/ps/96/#L5">시편 96:5</a>)</p></blockquote><blockquote><p>“여러분, 이게 무슨 짓입니까? 우리도 여러분과 똑같은 사람입니다. 우리는 다만 여러분에게 복음을 전하여 여러분이 <strong>이런 헛된 우상을 버리고 살아 계신 하느님께 돌아 오게 하려고 왔을 따름입니다</strong>. 이 하느님은 하늘과 땅과 바다와 그 안에 있는 모든 것을 만드신 분입니다.” (<a href="https://bibleox.com/ko/ko-ctb/act/14/#L15">사도 14:15</a>)</p></blockquote><h2>그것들은 구원하지 못합니다</h2><blockquote><p>“민족들 가운데서 살아 남은 자들아 다 모여 오너라. <strong>목상을 새겨 떠받들고 다니는 자들아 살려 줄 힘도 없는 신에게 기도하는 바보들아</strong>” (<a href="https://bibleox.com/ko/ko-ctb/is/45/#L20">이사 45:20</a>)</p></blockquote>
