- src: Бог_источник_добра,_но_не_зла
  path: QOPS_하느님은선의근원이시며악의근원이아니시다
  title: 하느님은 선의 근원이시며 악의 근원이 아니십니다
  copy_cover: true
  body: <h2>하느님은 선의 근원이시며 악의 근원이 아니십니다</h2><blockquote><p>“유혹을 당할 때에 아무도 ‘하느님께서 나를 유혹하신다’는 말을 해서는 안 됩니다. <strong>하느님께서는 악의 유혹을 받으실 분도 아니시지만 악을 행하도록 사람을 유혹하실 분도 아니십니다</strong>. &lt;…&gt; 온갖 훌륭한 은혜와 모든 완전한 선물은 위로부터 오는 것입니다. 하늘의 빛들을 만드신 아버지께로부터 내려 오는 것입니다. 하느님 아버지는 변함도 없으시고 우리를 외면하심으로써 그늘 속에 버려 두시는 일도 없으십니다.” (<a href="https://bibleox.com/ko/ko-ctb/iak/1/#L13,17">야고 1:13,17</a>)</p></blockquote><blockquote><p>“우리가 그분에게서 듣고 그대들에게 전하는 말씀은 이것입니다. 곧 <strong>하느님은 빛이시고 하느님께는 어둠이 전혀 없다</strong>는 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/1in/1/#L5">1요한 1:5</a>)</p></blockquote><blockquote><p>“예수께서는 이렇게 대답하셨다. ‘왜 나를 선하다고 하느냐? <strong>선하신 분은 오직 하느님뿐이시다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/mk/10/#L18">마르 10:18</a>; <a href="https://bibleox.com/ko/ko-ctb/mf/19/#L17">마태 19:17</a>; <a href="https://bibleox.com/ko/ko-ctb/lk/18/#L19">루가 18:19</a>)</p></blockquote><blockquote><p>“<strong>야훼는 모든 것을 인자하게 보살피시고</strong> 그 부드러운 사랑은 모든 피조물에 미친다.” (<a href="https://bibleox.com/ko/ko-ctb/ps/145/#L9">시편 145:9</a>)</p></blockquote><h2>죄가 없으신 분</h2><blockquote><p>“여러분도 아시다시피 그리스도께서는 죄를 없애시려고 이 세상에 나타나셨던 것입니다. <strong>그리스도는 죄가 없는 분이십니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/1in/3/#L5">1요한 3:5</a>)</p></blockquote><blockquote><p>“죄를 짓는 자는 누구나 하느님의 법을 어기는 자입니다. 법을 어기는 것이 곧 죄입니다. &lt;…&gt; <strong>언제나 죄를 짓는 자는 악마에게 속해 있습니다</strong>. 사실 죄는 처음부터 악마의 짓입니다. 악마가 저질러 놓은 일을 파멸시키려고 하느님의 아들이 나타나셨던 것입니다. 누구든지 하느님께로부터 난 사람은 자기 안에 하느님의 본성을 지녔으므로 죄를 짓지 않습니다. 그는 하느님께로부터 난 사람이기 때문에 도대체 죄를 지을 수가 없습니다.” (<a href="https://bibleox.com/ko/ko-ctb/1in/3/#L4,8-9">1요한 3:4,8-9</a>)</p></blockquote><h2>하느님은 사랑이십니다</h2><blockquote><p>“사랑하지 않는 사람은 하느님을 알지 못합니다. <strong>하느님은 사랑이시기 때문입니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/1in/4/#L8">1요한 4:8</a>)</p></blockquote><blockquote><p>“우리는 하느님께서 우리에게 베푸시는 사랑을 알고 또 믿습니다. <strong>하느님은 사랑이십니다</strong>. 사랑 안에 있는 사람은 하느님 안에 있으며 하느님께서는 그 사람 안에 계십니다.” (<a href="https://bibleox.com/ko/ko-ctb/1in/4/#L16">1요한 4:16</a>)</p></blockquote><h2>하느님께서는 모든 사람이 구원받기를 바라십니다</h2><blockquote><p>“나는 무엇보다도 먼저 모든 사람을 위해서 간구와 기원과 간청과 감사의 기도를 드리라고 권하는 바입니다. &lt;…&gt; 이렇게 기도하는 것은 좋은 일이며 우리 구세주 하느님을 기쁘시게 해 드리는 일입니다. <strong>하느님께서는 모든 사람이 다 구원을 받게 되고</strong> 진리를 알게 되기를 바라십니다.” (<a href="https://bibleox.com/ko/ko-ctb/1tim/2/#L1,3-4">1디모 2:1,3-4</a>)</p></blockquote><blockquote><p>“어떤 이들은 <strong>주님께서</strong> 약속하신 것을 미루신다고 생각하고 있지만 사실은 여러분을 위해서 참고 기다리시는 것입니다. <strong>아무도 멸망하지 않고 모두 회개하게 되기를 바라시기 때문입니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/2pet/3/#L9">2베드 3:9</a>)</p></blockquote><blockquote><p>“일러 주어라. ‘내가 맹세한다. <strong>죄인이라고 해도 죽는 것을 나는 기뻐하지 않는다</strong>. 주 야훼가 하는 말이다. <strong>죄인이라도 마음을 바로잡아 버릇을 고치고 사는 것을 나는 기뻐한다</strong>. 그러나 너희는 돌아 오라. 나쁜 버릇을 고치고 돌아 오라. 이스라엘 족속아, 어찌하여 너희는 죽으려고 하느냐!’” (<a href="https://bibleox.com/ko/ko-ctb/iez/33/#L11">에제 33:11</a>)</p></blockquote><blockquote><p>“그가 못된 행실을 한 자라고 해서 <strong>사람이 죽는 것을 내가 기뻐하겠느냐</strong>? 주 야훼가 하는 말이다. 그런 사람이라도 그 가던 길에서 발길을 돌려 살게 되는 것이 어찌 내 기쁨이 되지 않겠느냐?” (<a href="https://bibleox.com/ko/ko-ctb/iez/18/#L23">에제 18:23</a>)</p></blockquote><blockquote><p>“<strong>하느님은 이 세상을 극진히 사랑하셔서 외아들을 보내 주시어 그를 믿는 사람은 누구든지 멸망하지 않고 영원한 생명을 얻게 하여 주셨다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/in/3/#L16">요한 3:16</a>)</p></blockquote><blockquote><p>“<strong>사람의 아들은 잃은 사람들을 찾아 구원하러 온 것이다</strong>‘하고 말씀하셨다.” (<a href="https://bibleox.com/ko/ko-ctb/lk/19/#L10">루가 19:10</a>)</p></blockquote><h2>그러나 모두가 구원받는 것은 아닙니다</h2><blockquote><p>“사실 <strong>많은 사람들이 구원의 문으로 들어 가려고 하겠지만 들어 가지 못할 것이다</strong>. 그러니 좁은 문으로 들어 가도록 있는 힘을 다하여라.” (<a href="https://bibleox.com/ko/ko-ctb/lk/13/#L24">루가 13:24</a>)</p></blockquote><blockquote><p>“‘좁은 문으로 들어 가거라. <strong>멸망에 이르는 문은 크고 또 그 길이 넓어서 그리로 가는 사람이 많지만</strong> 생명에 이르는 문은 좁고 또 그 길이 험해서 그리로 찾아 드는 사람이 적다.’” (<a href="https://bibleox.com/ko/ko-ctb/mf/7/#L13-14">마태 7:13-14</a>)</p></blockquote><blockquote><p>“‘<strong>나더러 주님, 주님 하고 부른다고 다 하늘 나라에 들어 가는 것이 아니다</strong>. 하늘에 계신 내 아버지의 뜻을 실천하는 사람이라야 들어 간다. 그 날에는 많은 사람이 나를 보고 주님, 주님! 우리가 주님의 이름으로 예언을 하고 주님의 이름으로 마귀를 쫓아 내고 또 주님의 이름으로 많은 기적을 행하지 않았습니까? 하고 말할 것이다. 그러나 그 때에 나는 분명히 그들에게 악한 일을 일삼는 자들아, 나에게서 물러가라. <strong>나는 너희를 도무지 알지 못한다</strong> 고 말할 것이다.’” (<a href="https://bibleox.com/ko/ko-ctb/mf/7/#L21-23">마태 7:21-23</a>)</p></blockquote><blockquote><p>“<strong>모두가 구원받는 것은 아니다</strong>” (<a href="https://bibleox.com/ko/en-nrsv/3ezd/8/#L41">3에스 8:41</a>, 영어 번역(NRSV)에서 옮김)</p></blockquote>
