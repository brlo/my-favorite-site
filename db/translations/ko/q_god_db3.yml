- src: Бог_бессмертен
  path: rnqC_하느님은불멸하시다
  title: 하느님은 불멸하십니다
  copy_cover: true
  body: <blockquote><p>“만물에게 생명을 주시는 하느님 앞에서와 본티오 빌라도에게 당당하게 증언하신 그리스도 예수 앞에서 나는 그대에게 명령합니다. &lt;…&gt; <strong>그분은 홀로 불멸하시고</strong> 사람이 가까이 갈 수 없는 빛 가운데 계시며 사람이 일찌기 본 일이 없고 또 볼 수도 없는 분이십니다. 영예와 권세가 영원히 그분에게 있기를 빕니다. 아멘.” (<a href="https://bibleox.com/ko/ko-ctb/1tim/6/#L13,16">1디모 6:13,16</a>)</p></blockquote>
