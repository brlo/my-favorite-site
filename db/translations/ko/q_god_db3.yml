- src: Бог-всемогущий
  path: iVKa_전능하신하느님
  title: 전능하신 하느님
  copy_cover: true
  body: <h2>전능하신 하느님</h2><blockquote><p>“아브람이 구십구 세 때에 여호와께서 아브람에게 나타나서 그에게 이르시되 <strong>나는 전능한 하나님이라</strong> 너는 내 앞에서 행하여 완전하라” (<a href="https://bibleox.com/ko/ko-nkrv/gen/17/#L1">창 17:1</a>; <a href="https://bibleox.com/ko/ko-nkrv/gen/28/#L3">창 28:3</a>; <a href="https://bibleox.com/ko/ko-nkrv/gen/35/#L11">창 35:11</a>; <a href="https://bibleox.com/ko/ko-nkrv/gen/43/#L14">창 43:14</a>; <a href="https://bibleox.com/ko/ko-nkrv/gen/48/#L3">창 48:3</a>; <a href="https://bibleox.com/ko/ko-nkrv/gen/49/#L25">창 49:25</a>; <a href="https://bibleox.com/ko/ko-nkrv/chis/24/#L4">민 24:4</a>; <a href="https://bibleox.com/ko/ko-nkrv/chis/24/#L16">민 24:16</a>; <a href="https://bibleox.com/ko/ko-nkrv/is/13/#L6">사 13:6</a>; <a href="https://bibleox.com/ko/ko-nkrv/iez/1/#L24">겔 1:24</a>; <a href="https://bibleox.com/ko/ko-nkrv/iez/10/#L5">겔 10:5</a>; <a href="https://bibleox.com/ko/ko-nkrv/iol/1/#L15">욜 1:15</a>)</p></blockquote><blockquote><p>“내가 아브라함과 이삭과 야곱에게 <strong>전능의 하나님</strong>으로 나타났으나 나의 이름을 여호와로는 그들에게 알리지 아니하였고” (<a href="https://bibleox.com/ko/ko-nkrv/ish/6/#L3">출 6:3</a>)</p></blockquote><blockquote><p>“<strong>주께서는 못 하실 일이 없사오며</strong> 무슨 계획이든지 못 이루실 것이 없는 줄 아오니” (<a href="https://bibleox.com/ko/ko-nkrv/iov/42/#L2">욥 42:2</a>)</p></blockquote><blockquote><p>“주님께서는 <strong>모든 것을 하실 수 있으시므로</strong> 모든 이를 불쌍히 여기시고, 사람들이 회개하도록 그들의 죄를 눈감아 주신다” (<a href="https://bibleox.com/ko/gr-lxx-byz/prs/11/#L23">지혜 11:23</a>, 그리스어에서 번역)</p></blockquote><blockquote><p>“지존자의 은밀한 곳에 거주하며 <strong>전능자</strong>의 그늘 아래에 사는 자여,” (<a href="https://bibleox.com/ko/ko-nkrv/ps/91/#L1">시 91:1</a>; <a href="https://bibleox.com/ko/ko-nkrv/ps/68/#L14">시 68:14</a>)</p></blockquote><blockquote><p>“<strong>주님의 전능하신 말씀이</strong> 하늘 옥좌에서 내려왔다” (<a href="https://bibleox.com/ko/gr-lxx-byz/prs/18/#L15">지혜 18:15</a>, 그리스어에서 번역)</p></blockquote><blockquote><p>“슬프도소이다 주 여호와여 주께서 큰 능력과 펴신 팔로 천지를 지으셨사오니 <strong>주에게는 할 수 없는 일이 없으시니이다</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ier/32/#L17">렘 32:17</a>)</p></blockquote><blockquote><p>“나는 여호와요 모든 육체의 하나님이라 <strong>내게 할 수 없는 일이 있겠느냐</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ier/32/#L27">렘 32:27</a>)</p></blockquote><blockquote><p>“이르시되 <strong>무릇 사람이 할 수 없는 것을 하나님은 하실 수 있느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/lk/18/#L27">눅 18:27</a>)</p></blockquote><blockquote><p>“예수께서 그들을 보시며 이르시되 사람으로는 할 수 없으되 하나님으로는 그렇지 아니하니 <strong>하나님으로서는 다 하실 수 있느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mk/10/#L27">막 10:27</a>)</p></blockquote><h2>하느님께서 정하신 대로 이루어집니다</h2><blockquote><p>“만군의 여호와께서 맹세하여 이르시되 <strong>내가 생각한 것이 반드시 되며 내가 경영한 것을 반드시 이루리라</strong> &lt;…&gt; 이것이 온 세계를 향하여 정한 경영이며 이것이 열방을 향하여 편 손이라 하셨나니 <strong>만군의 여호와께서 경영하셨은즉 누가 능히 그것을 폐하며</strong> 그의 손을 펴셨은즉 누가 능히 그것을 돌이키랴” (<a href="https://bibleox.com/ko/ko-nkrv/is/14/#L24,26-27">사 14:24,26-27</a>)</p></blockquote>
  meta_desc: 하느님의 전능하심에 관한 성경 구절
