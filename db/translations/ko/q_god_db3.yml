- src: Отец-Бог
  path: 3TQt_성부는하느님이시다
  title: 성부는 하느님이십니다
  copy_cover: true
  body: <blockquote><p>“썩을 양식을 위하여 일하지 말고 영생하도록 있는 양식을 위하여 하라 이 양식은 인자가 너희에게 주리니 인자는 <strong>아버지 하나님께서</strong> 인치신 자니라” (<a href="https://bibleox.com/ko/ko-nkrv/in/6/#L27">요 6:27</a>)</p></blockquote><blockquote><p>“예수께서 대답하시되 내가 내게 영광을 돌리면 내 영광이 아무 것도 아니거니와 내게 영광을 돌리시는 이는 내 아버지시니 곧 <strong>너희가 너희 하나님이라 칭하는 그이시라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/in/8/#L54">요 8:54</a>)</p></blockquote><blockquote><p>“찬송하리로다 그는 <strong>우리 주 예수 그리스도의 하나님이시요 자비의 아버지시요</strong> 모든 위로의 하나님이시며” (<a href="https://bibleox.com/ko/ko-nkrv/2kor/1/#L3">고후 1:3</a>)</p></blockquote><blockquote><p>“찬송하리로다 <strong>하나님 곧 우리 주 예수 그리스도의 아버지</strong>께서 그리스도 안에서 하늘에 속한 모든 신령한 복을 우리에게 주시되” (<a href="https://bibleox.com/ko/ko-nkrv/ef/1/#L3">엡 1:3</a>)</p></blockquote><blockquote><p>“곧 <strong>하나님 아버지의</strong> 미리 아심을 따라 성령이 거룩하게 하심으로 순종하고 예수 그리스도의 피 뿌림을 얻기 위하여 택하심을 받은 자들에게 편지하노니 은혜와 평강이 너희에게 더욱 많을지어다” (<a href="https://bibleox.com/ko/ko-nkrv/1pet/1/#L2">벧전 1:2</a>)</p></blockquote>
  meta_desc: 성부께서 하느님이심에 관한 성경 구절
