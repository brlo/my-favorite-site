  title: 시작이 없으신 하느님
  copy_cover: true
  body: <p>하느님께서는 시작이 있는 모든 것에 시작을 주셨습니다:</p><blockquote><p>“태초에 말씀이 계시니라 이 말씀이 하나님과 함께 계셨으니 이 말씀은 곧 하나님이시니라 &lt;…&gt; 만물이 그로 말미암아 지은 바 되었으니 <strong>지은 것이 하나도 그가 없이는 된 것이 없느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/in/1/#L1,3">요 1:1,3</a>)</p></blockquote><p>날들의 시작이 없는 하느님의 아들의 예형인 사제 멜기세덱:</p><blockquote><p>“아버지도 없고 어머니도 없고 족보도 없고 <strong>시작한 날도 없고 생명의 끝도 없어 하나님의 아들과 닮아서</strong> 항상 제사장으로 있느니라” (<a href="https://bibleox.com/ko/ko-nkrv/evr/7/#L3">히 7:3</a>)</p></blockquote>
  meta_desc: 하느님께 시작이 없으심에 관한 성경 구절
