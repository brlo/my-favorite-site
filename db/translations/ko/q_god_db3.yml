- src: Бог-один
  path: Mrqu_하느님은한분이시다
  title: 하느님은 한 분이십니다
  copy_cover: true
  body: <h2>하느님은 한 분이시며 다른 신은 없습니다</h2><blockquote><p>“이스라엘의 왕인 여호와, 이스라엘의 구원자인 만군의 여호와가 이같이 말하노라 나는 처음이요 나는 마지막이라 <strong>나 외에 다른 신이 없느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/is/44/#L6">사 44:6</a>)</p></blockquote><blockquote><p>“나는 여호와라 나 외에 다른 이가 없나니 <strong>나 밖에 신이 없느니라</strong> 너는 나를 알지 못하였을지라도 나는 네 띠를 동일 것이요” (<a href="https://bibleox.com/ko/ko-nkrv/is/45/#L5">사 45:5</a>)</p></blockquote><blockquote><p>“해 뜨는 곳에서든지 지는 곳에서든지 나 밖에 다른 이가 없는 줄을 알게 하리라 <strong>나는 여호와라 다른 이가 없느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/is/45/#L6">사 45:6</a>)</p></blockquote><blockquote><p>“여호와께서 이같이 말씀하시되 애굽의 소득과 구스가 무역한 것과 스바의 장대한 남자들이 네게로 건너와서 네게 속할 것이요 그들이 너를 따를 것이라 사슬에 매여 건너와서 네게 굴복하고 간구하기를 하나님이 과연 네게 계시고 <strong>그 외에는 다른 하나님이 없다</strong> 하리라 하시니라” (<a href="https://bibleox.com/ko/ko-nkrv/is/45/#L14">사 45:14</a>)</p></blockquote><blockquote><p>“대저 여호와께서 이같이 말씀하시되 하늘을 창조하신 이 그는 하나님이시니 그가 땅을 지으시고 그것을 만드셨으며 그것을 견고하게 하시되 혼돈하게 창조하지 아니하시고 사람이 거주하게 그것을 지으셨으니 <strong>나는 여호와라 나 외에 다른 이가 없느니라</strong> 하시니라” (<a href="https://bibleox.com/ko/ko-nkrv/is/45/#L18">사 45:18</a>)</p></blockquote><blockquote><p>“너희는 알리며 진술하고 또 함께 의논하여 보라 이 일을 옛부터 듣게 한 자가 누구냐 이전부터 그것을 알게 한 자가 누구냐 나 여호와가 아니냐 <strong>나 외에 다른 신이 없나니</strong> 나는 공의를 행하며 구원을 베푸는 하나님이라 나 외에 다른 이가 없느니라” (<a href="https://bibleox.com/ko/ko-nkrv/is/45/#L21">사 45:21</a>)</p></blockquote><blockquote><p>“땅의 모든 끝이여 내게로 돌이켜 구원을 받으라 <strong>나는 하나님이라 다른 이가 없느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/is/45/#L22">사 45:22</a>)</p></blockquote><blockquote><p>“너희는 옛적 일을 기억하라 나는 하나님이라 나 외에 다른 이가 없느니라 <strong>나는 하나님이라 나 같은 이가 없느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/is/46/#L9">사 46:9</a>)</p></blockquote><blockquote><p>“이제는 나 곧 내가 그인 줄 알라 <strong>나 외에는 신이 없도다</strong> 나는 죽이기도 하며 살리기도 하며 상하게도 하며 낫게도 하나니 내 손에서 능히 빼앗을 자가 없도다” (<a href="https://bibleox.com/ko/ko-nkrv/vtor/32/#L39">신 32:39</a>)</p></blockquote><blockquote><p>“서기관이 이르되 선생님이여 옳소이다 <strong>하나님은 한 분이시요 그 외에 다른 이가 없다</strong> 하신 말씀이 참이니이다” (<a href="https://bibleox.com/ko/ko-nkrv/mk/12/#L32">막 12:32</a>)</p></blockquote><blockquote><p>“그러므로 우상의 제물을 먹는 일에 대하여는 우리가 우상은 세상에 아무 것도 아니며 또한 <strong>하나님은 한 분밖에 없는 줄 아노라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/8/#L4">고전 8:4</a>)</p></blockquote><h2>다른 민족들의 신은 신이 아니라 마귀입니다</h2><blockquote><p>“그들은 <strong>하나님께 제사하지 아니하고 귀신들에게 하였으니 곧 그들이 알지 못하던 신들</strong>, 근래에 들어온 새로운 신들 너희의 조상들이 두려워하지 아니하던 것들이로다” (<a href="https://bibleox.com/ko/ko-nkrv/vtor/32/#L17">신 32:17</a>)</p></blockquote><blockquote><p>“그들이 <strong>그들의 자녀를 악귀들에게 희생제물로 바쳤도다</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ps/106/#L37">시 106:37</a>)</p></blockquote><blockquote><p>“너희는 <strong>하느님이 아니라 마귀들에게 제사를 지내어</strong> 너희를 지으신 분을 노엽게 하였다” (<a href="https://bibleox.com/ko/gr-lxx-byz/var/4/#L7">바룩 4:7</a>, 그리스어에서 번역)</p></blockquote><blockquote><p>“무릇 <strong>이방인이 제사하는 것은 귀신에게 하는 것이요 하나님께 제사하는 것이 아니니</strong> 나는 너희가 귀신과 교제하는 자가 되기를 원하지 아니하노라” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/10/#L20">고전 10:20</a>)</p></blockquote><blockquote><p>“<strong>사람이 어찌 신 아닌 것을 자기의 신으로 삼겠나이까</strong> 하리이다” (<a href="https://bibleox.com/ko/ko-nkrv/ier/16/#L20">렘 16:20</a>)</p></blockquote><blockquote><p>“내가 어찌 너를 용서하겠느냐 네 자녀가 나를 버리고 <strong>신이 아닌 것들로 맹세하였으며</strong> 내가 그들을 배불리 먹인즉 그들이 간음하며 창기의 집에 허다히 모이며” (<a href="https://bibleox.com/ko/ko-nkrv/ier/5/#L7">렘 5:7</a>)</p></blockquote><blockquote><p>“그러나 너희가 그 때에는 하나님을 알지 못하여 <strong>본질상 하나님이 아닌 자들에게 종 노릇 하였더니</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gal/4/#L8">갈 4:8</a>)</p></blockquote><blockquote><p>“<strong>만국의 모든 신들은 우상들이지만</strong> 여호와께서는 하늘을 지으셨음이로다” (<a href="https://bibleox.com/ko/ko-nkrv/ps/96/#L5">시 96:5</a>)</p></blockquote><blockquote><p>“이르되 여러분이여 어찌하여 이러한 일을 하느냐 우리도 여러분과 같은 성정을 가진 사람이라 여러분에게 복음을 전하는 것은 <strong>이런 헛된 일을 버리고</strong> 천지와 바다와 그 가운데 만물을 지으시고 <strong>살아 계신 하나님께로 돌아오게 함이라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/act/14/#L15">행 14:15</a>)</p></blockquote><h2>그것들은 구원하지 못합니다</h2><blockquote><p>“열방 중에서 피난한 자들아 너희는 모여 오라 함께 가까이 나아오라 <strong>나무 우상을 가지고 다니며 구원하지 못하는 신에게 기도하는 자들은 무지한 자들이니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/is/45/#L20">사 45:20</a>)</p></blockquote>
