- src: Бог_бессмертен
  path: rnqC_하느님은불멸하시다
  title: 하느님은 불멸하십니다
  copy_cover: true
  body: <blockquote><p>“만물을 살게 하신 하나님 앞과 본디오 빌라도를 향하여 선한 증언을 하신 그리스도 예수 앞에서 내가 너를 명하노니 &lt;…&gt; <strong>오직 그에게만 죽지 아니함이 있고</strong> 가까이 가지 못할 빛에 거하시고 어떤 사람도 보지 못하였고 또 볼 수 없는 이시니 그에게 존귀와 영원한 권능을 돌릴지어다 아멘” (<a href="https://bibleox.com/ko/ko-nkrv/1tim/6/#L13,16">딤전 6:13,16</a>)</p></blockquote>
