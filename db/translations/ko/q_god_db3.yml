- src: Отец-Бог
  path: 3TQt_성부는하느님이시다
  title: 성부는 하느님이십니다
  copy_cover: true
  body: <blockquote><p>“썩어 없어질 양식을 얻으려고 힘쓰지 말고 영원히 살게 하며 없어지지 않을 양식을 얻도록 힘써라. 이 양식은 사람의 아들이 너희에게 주려는 것이다. <strong>하느님 아버지께서</strong> 사람의 아들에게 그 권능을 주셨기 때문이다‘하고 말씀하셨다.” (<a href="https://bibleox.com/ko/ko-ctb/in/6/#L27">요한 6:27</a>)</p></blockquote><blockquote><p>“예수께서 이렇게 대답하셨다. ‘내가 나 자신을 높인다면 그 영광은 아무것도 아니다. 그러나 나에게 영광을 주시는 분은 <strong>너희가 자기 하느님이라고 하는 나의 아버지이시다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/in/8/#L54">요한 8:54</a>)</p></blockquote><blockquote><p>“우리 주 예수 그리스도의 <strong>아버지 하느님</strong>을 찬양합시다. 그분은 인자하신 아버지이시며 모든 위로의 근원이 되시는 하느님으로서” (<a href="https://bibleox.com/ko/ko-ctb/2kor/1/#L3">2고린 1:3</a>)</p></blockquote><blockquote><p>“우리 주 예수 그리스도의 <strong>아버지 하느님</strong>께 찬양을 드립니다. 하느님께서는 그리스도를 통해서 하늘의 온갖 영적 축복을 우리에게 베풀어 주셨습니다.” (<a href="https://bibleox.com/ko/ko-ctb/ef/1/#L3">에페 1:3</a>)</p></blockquote><blockquote><p>“여러분은 <strong>하느님 아버지께서</strong> 미리 세우신 계획에 따라 뽑혀서 성령으로 거룩하게 되어 예수 그리스도께 복종하게 되었으며 그분의 피로 씻겨진 사람들입니다. 여러분에게 은총과 평화가 충만하기를 빕니다.” (<a href="https://bibleox.com/ko/ko-ctb/1pet/1/#L2">1베드 1:2</a>)</p></blockquote>
  meta_desc: 성부께서 하느님이심에 관한 성경 구절
