  path: v2jp_하느님은영원하시다
  title: 하느님은 영원하십니다
  copy_cover: true
  body: <h2>하느님은 영원하십니다</h2><blockquote><p>“너희는 모르느냐? 듣지 못하였느냐? 야훼께서는 <strong>영원하신 하느님</strong>, 땅의 끝까지 창조하신 분이시다. 힘이 솟구쳐 피곤을 모르시고, 슬기가 무궁하신 분이시다.” (<a href="https://bibleox.com/ko/ko-ctb/is/40/#L28">이사 40:28</a>)</p></blockquote><blockquote><p>“아브라함은 브엘세바에 에셀나무를 심고 그 곳에서 <strong>영원하신 하느님 야훼</strong>의 이름을 불러 예배하였다.” (<a href="https://bibleox.com/ko/ko-ctb/gen/21/#L33">창 21:33</a>)</p></blockquote><blockquote><p>“<strong>영원히 야훼를 믿고 의지하여라. 야훼는 영원한 바위시다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/is/26/#L4">이사 26:4</a>)</p></blockquote><blockquote><p>“지극히 높으신 이, <strong>보좌에 영원히 앉아 계시는 이</strong>, 거룩하신 분이라 불리는 이께서 말씀하신다. ‘나는 높고 거룩한 보좌에 앉아 있으면서도 얻어 맞아 용기를 잃은 사람들과 함께 살며 잃은 용기를 되살려 주고, 상한 마음을 아물게 해 주리라.” (<a href="https://bibleox.com/ko/ko-ctb/is/57/#L15">이사 57:15</a>)</p></blockquote><blockquote><p>“<strong>야훼께서 영원히 왕좌에 앉으시고</strong> 재판하실 옥좌를 다지셨으니,” (<a href="https://bibleox.com/ko/ko-ctb/ps/9/#L7">시편 9:7</a>)</p></blockquote><blockquote><p>“높은 산봉우리들아, 어찌 너희가 시샘하느냐? 하느님께서 계시려고 택하신 그 산을. <strong>야훼께서 영원히 여기에 사시리라</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/ps/68/#L16">시편 68:16</a>)</p></blockquote><blockquote><p>“그 옛날부터 든든히 다지신 이 땅이, 손수 만드신 저 하늘들이 <strong>사라질지라도 하느님은 그대로 계시옵니다</strong>. 옷처럼 모든 것이 삭아 빠져도 갈아 입는 헌옷처럼 모든 것이 바뀌어도 <strong>하느님은 언제나 같으신 분, 해가 바뀌고 또 바뀌어도 영원히 계시옵니다</strong>.‘” (<a href="https://bibleox.com/ko/ko-ctb/ps/102/#L25-27">시편 102:25-27</a>; <a href="https://bibleox.com/ko/ko-ctb/evr/1/#L10-12">히브 1:10-12</a>)</p></blockquote><blockquote><p>“낮에는 해가 너를 비출 필요가 없고 밤에는 달이 너를 비출 필요가 없으리라. <strong>야훼가 너의 영원한 빛이 되고</strong> 너의 하느님이 너의 영광이 되리니 다시는 너의 해가 지지 아니하고 너의 달이 다시는 스러지지 아니하리라. <strong>야훼가 너의 영원한 빛이 되리니</strong> 다시는 곡하는 날이 오지 아니하리라.” (<a href="https://bibleox.com/ko/ko-ctb/is/60/#L19-20">이사 60:19-20</a>)</p></blockquote><blockquote><p>“모시옷을 입고 강물 윗쪽에 서 있던 분이 두 손을 하늘로 쳐들고는, <strong>영원히 살아 계시는 이를 두고 맹세하는</strong> 말이 들렸다. ‘한 때, 두 때 하고 반 때가 지나 거룩한 백성의 군대를 부순 자가 죽으면 모든 일이 끝날 것이다.’” (<a href="https://bibleox.com/ko/ko-ctb/dan/12/#L7">다니 12:7</a>)</p></blockquote><h2>하느님께서는 영원히 다스리십니다</h2><blockquote><p>“<strong>야훼만이 영원히 다스리실 왕이시어라</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/ish/15/#L18">출 15:18</a>)</p></blockquote><blockquote><p>“야훼만이 참 신, 살아 계시는 하느님, <strong>영원한 임금이시다</strong>. 한번 분노를 터뜨리시면 땅이 덜덜 떠는데, 어느 민족이 이 하느님의 노여움을 당해 내랴?” (<a href="https://bibleox.com/ko/ko-ctb/ier/10/#L10">예레 10:10</a>)</p></blockquote><blockquote><p>“나는 밤에 또 이상한 광경을 보았는데 <strong>사람 모습을 한 이가</strong> 하늘에서 구름을 타고 와서 태고적부터 계신 이 앞으로 인도되어 나아갔다. 주권과 영화와 나라가 그에게 맡겨지고 인종과 말이 다른 뭇 백성들의 섬김을 받게 되었다. <strong>그의 주권은 스러지지 아니하고 영원히 갈 것이며 그의 나라는 멸망하지 아니하리라</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/dan/7/#L13-14">다니 7:13-14</a>)</p></blockquote><blockquote><p>“<strong>하느님의 영원한 옥좌에 앉으신 임금님</strong>, 당신의 왕권은 정의의 왕권입니다.” (<a href="https://bibleox.com/ko/ko-ctb/ps/45/#L6">시편 45:6</a>) <em>(히브리어 원문은 כִּסְאֲךָ אֱלֹהִים עוֹלָם וָעֶד — “하느님, 당신의 옥좌는 영원무궁합니다”이며, 히브 1:8도 이렇게 인용합니다.)</em></p></blockquote><blockquote><p>“야곱의 후손을 영원히 다스리는 왕이 되겠고 <strong>그의 나라는 끝이 없을 것이다</strong>‘하고 일러 주었다.” (<a href="https://bibleox.com/ko/ko-ctb/lk/1/#L33">루가 1:33</a>)</p></blockquote><blockquote><p>“또한 여러분에게는 <strong>우리의 주님이시며 구세주이신 예수 그리스도의 영원한 나라</strong>로 들어가는 문이 활짝 열릴 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/2pet/1/#L11">2베드 1:11</a>)</p></blockquote><h2>하느님께서는 시간 이전에, 시간을 넘어 계십니다</h2><blockquote><p>“우리 종교는 영원한 생명에 대한 희망을 가져다 줍니다. 이 영원한 생명은 거짓말을 하시지 않는 하느님께서 <strong>아득한 옛날에 벌써 약속해 주신 것입니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/tit/1/#L2">디도 1:2</a>) <em>(“아득한 옛날에”는 그리스어 원문에서 πρὸ χρόνων αἰωνίων — “영원한 시간 이전에”입니다.)</em></p></blockquote>
