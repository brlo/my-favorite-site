  title: 하느님은 모든 것을 아십니다
  copy_cover: true
  body: <h2>모든 것을 아시는 분</h2><p>하느님께서는 모든 것을 아시고 모든 것을 보십니다:</p><blockquote><p>“피조물치고 하느님 앞에 드러나지 않는 것이 없습니다. <strong>하느님의 눈앞에는 모든 것이 다 벌거숭이로 드러나게 마련입니다</strong>. 언젠가는 우리도 그분 앞에서 심판을 받아야 합니다.” (<a href="https://bibleox.com/ko/ko-ctb/evr/4/#L13">히브 4:13</a>)</p></blockquote><blockquote><p>“우리가 양심의 가책을 받을 때에도 그렇습니다. <strong>하느님께서</strong> 우리의 마음보다 크시고 또 <strong>모든 것을 알고 계시기 때문입니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/1in/3/#L20">1요한 3:20</a>)</p></blockquote><blockquote><p>“<strong>주님, 주님께서는 모든 일을 다 알고 계십니다</strong>. 그러니 제가 주님을 사랑한다는 것을 모르실 리가 없습니다” (<a href="https://bibleox.com/ko/ko-ctb/in/21/#L17">요한 21:17</a>)</p></blockquote><blockquote><p>“<strong>주님께서는 당신의 넘치는 지식으로</strong> 그들을 구별하시고 그들의 길을 다르게 하셨다” (<a href="https://bibleox.com/ko/gr-lxx-byz/prsir/33/#L11">집회 33:11</a>, 그리스어에서 번역)</p></blockquote><blockquote><p>“그분께서는 <strong>너희의 생각과 너희가 마음에 품은 것을 아신다</strong>” (<a href="https://bibleox.com/ko/en-nrsv/3ezd/16/#L63">3에스 16:63</a>, 영어 번역(NRSV)에서 옮김)</p></blockquote><blockquote><p>“<strong>모든 육체의 일이 그분 앞에 있으니, 그분의 눈을 피해 숨을 수 없다</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/prsir/39/#L19">집회 39:19</a>, 그리스어에서 번역)</p></blockquote><blockquote><p>“<strong>주님의 영이 온 세상에 가득하고, 만물을 하나로 묶는 그분께서 모든 말소리를 아신다</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/prs/1/#L7">지혜 1:7</a>, 그리스어에서 번역)</p></blockquote><h2>하느님께서는 앞날을 아십니다</h2><blockquote><p>“<strong>전능하신 분께서 어찌하여 재판날을 밝히시지 않는가</strong>? 그와 가까운 자에게 어찌하여 그 날을 감추시는가?” (<a href="https://bibleox.com/ko/ko-ctb/iov/24/#L1">욥 24:1</a>) <em>(칠십인역과 러시아어 번역은 이 구절을 “전능하신 분에게 때가 숨겨져 있지 않다”는 뜻으로 옮깁니다.)</em></p></blockquote><blockquote><p>“<strong>지극히 높으신 분께서는 모든 지식을 아시고 영원한 징조를 살피신다. 지나간 일과 앞으로 올 일을 알려 주시고 숨겨진 일의 자취를 드러내신다</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/prsir/42/#L18-19">집회 42:18-19</a>, 그리스어에서 번역)</p></blockquote><h2>하느님께서는 사람의 생각과 감정과 소원을 아십니다</h2><blockquote><p>“<strong>야훼께서는</strong> 세상이 사람의 죄악으로 가득 차고 <strong>사람마다 못된 생각만 하는 것을 보시고</strong>” (<a href="https://bibleox.com/ko/ko-ctb/gen/6/#L5">창 6:5</a>)</p></blockquote><blockquote><p>“나의 주여, 이 가슴을 다 열어 보입니다. <strong>이 몸의 소원을 숨김없이 아룁니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/ps/38/#L9">시편 38:9</a>)</p></blockquote><blockquote><p>“아무려니, 우리 하느님의 이름을 부르지 아니하였겠으며 다른 신에게 머리를 조아렸으리이까? <strong>마음의 비밀을 다 아시는 하느님께서</strong> 어찌 그걸 알아 차리지 못하셨으리이까?” (<a href="https://bibleox.com/ko/ko-ctb/ps/44/#L20-21">시편 44:20-21</a>)</p></blockquote><blockquote><p>“<strong>야훼께서는 사람의 마음을 헤아리시고 속셈까지 꿰뚫어 보신다</strong>” (<a href="https://bibleox.com/ko/ko-ctb/1par/28/#L9">역상 28:9</a>)</p></blockquote><blockquote><p>“당신께서는 자리잡으신 곳 하늘에서 들으시고 용서해 주십시오. 사람의 마음을 아시는 하느님이여, 사람의 행실에 따라 갚아 주십시오. <strong>당신만이 홀로 사람의 마음을 낱낱이 아십니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/2par/6/#L30">역하 6:30</a>)</p></blockquote><blockquote><p>“주님, 곧 전능하신 분께서 … <strong>어떤 생각도 그분을 비껴가지 못하고, 어떤 말도 그분에게 숨겨지지 않는다</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/prsir/42/#L17,20">집회 42:17,20</a>, 그리스어에서 번역)</p></blockquote><blockquote><p>“<strong>예수께서 그들의 생각을 알아 채시고</strong> ‘<strong>어찌하여 너희들은 악한 생각을 품고 있느냐</strong>?” (<a href="https://bibleox.com/ko/ko-ctb/mf/9/#L4">마태 9:4</a>; <a href="https://bibleox.com/ko/ko-ctb/lk/5/#L22">루가 5:22</a>)</p></blockquote><blockquote><p>“<strong>예수께서 그들의 생각을 알아 채시고</strong> 이렇게 말씀하셨다” (<a href="https://bibleox.com/ko/ko-ctb/mf/12/#L25">마태 12:25</a>)</p></blockquote><blockquote><p>“그러나 <strong>예수께서는 그들의 속셈을 아시고</strong>” (<a href="https://bibleox.com/ko/ko-ctb/lk/6/#L8">루가 6:8</a>)</p></blockquote><blockquote><p>“<strong>예수께서는 그들의 생각을 아시고</strong> 어린이 하나를 데려다가 곁에 세우신 다음” (<a href="https://bibleox.com/ko/ko-ctb/lk/9/#L47">루가 9:47</a>)</p></blockquote><blockquote><p>“그러나 <strong>예수께서는 그들의 생각을 알아채시고</strong> 이렇게 말씀하셨다” (<a href="https://bibleox.com/ko/ko-ctb/lk/11/#L17">루가 11:17</a>)</p></blockquote><blockquote><p>“이렇게 기도하였다. ‘<strong>모든 사람의 마음을 다 아시는 주님</strong>, 주님께서 이 두 사람 중 누구를 뽑으셨는지 알려 주십시오.” (<a href="https://bibleox.com/ko/ko-ctb/act/1/#L24">사도 1:24</a>)</p></blockquote><blockquote><p>“그리고 <strong>사람의 마음 속을 아시는 하느님께서는</strong> 성령을 그들에게도 내리셔서 우리와 똑같이 인정해 주셨습니다.” (<a href="https://bibleox.com/ko/ko-ctb/act/15/#L8">사도 15:8</a>)</p></blockquote><h2>하느님께서는 사람의 모든 죄를 아십니다</h2><blockquote><p>“<strong>하느님, 나의 어리석음을 당신은 아시오니 내 죄를 당신께 숨길 수가 없사옵니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/ps/69/#L5">시편 69:5</a>)</p></blockquote>
