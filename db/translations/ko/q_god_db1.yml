  title: 하느님은 모든 것을 아십니다
  copy_cover: true
  body: <h2>모든 것을 아시는 분</h2><p>하느님께서는 모든 것을 아시고 모든 것을 보십니다:</p><blockquote><p>“지으신 것이 하나도 그 앞에 나타나지 않음이 없고 <strong>우리의 결산을 받으실 이의 눈 앞에 만물이 벌거벗은 것 같이 드러나느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/evr/4/#L13">히 4:13</a>)</p></blockquote><blockquote><p>“이는 우리 마음이 혹 우리를 책망할 일이 있어도 <strong>하나님은</strong> 우리 마음보다 크시고 <strong>모든 것을 아시기 때문이라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1in/3/#L20">요일 3:20</a>)</p></blockquote><blockquote><p>“<strong>주님 모든 것을 아시오매</strong> 내가 주님을 사랑하는 줄을 주님께서 아시나이다” (<a href="https://bibleox.com/ko/ko-nkrv/in/21/#L17">요 21:17</a>)</p></blockquote><blockquote><p>“<strong>주님께서는 당신의 넘치는 지식으로</strong> 그들을 구별하시고 그들의 길을 다르게 하셨다” (<a href="https://bibleox.com/ko/gr-lxx-byz/prsir/33/#L11">집회 33:11</a>, 그리스어에서 번역)</p></blockquote><blockquote><p>“그분께서는 <strong>너희의 생각과 너희가 마음에 품은 것을 아신다</strong>” (<a href="https://bibleox.com/ko/en-nrsv/3ezd/16/#L63">3에스 16:63</a>, 영어 번역(NRSV)에서 옮김)</p></blockquote><blockquote><p>“<strong>모든 육체의 일이 그분 앞에 있으니, 그분의 눈을 피해 숨을 수 없다</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/prsir/39/#L19">집회 39:19</a>, 그리스어에서 번역)</p></blockquote><blockquote><p>“<strong>주님의 영이 온 세상에 가득하고, 만물을 하나로 묶는 그분께서 모든 말소리를 아신다</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/prs/1/#L7">지혜 1:7</a>, 그리스어에서 번역)</p></blockquote><h2>하느님께서는 앞날을 아십니다</h2><blockquote><p>“<strong>어찌하여 전능자는 때를 정해 놓지 아니하셨는고</strong> 그를 아는 자들이 그의 날을 보지 못하는고” (<a href="https://bibleox.com/ko/ko-nkrv/iov/24/#L1">욥 24:1</a>) <em>(칠십인역과 러시아어 번역은 이 구절을 “전능하신 분에게 때가 숨겨져 있지 않다”는 뜻으로 옮깁니다.)</em></p></blockquote><blockquote><p>“<strong>지극히 높으신 분께서는 모든 지식을 아시고 영원한 징조를 살피신다. 지나간 일과 앞으로 올 일을 알려 주시고 숨겨진 일의 자취를 드러내신다</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/prsir/42/#L18-19">집회 42:18-19</a>, 그리스어에서 번역)</p></blockquote><h2>하느님께서는 사람의 생각과 감정과 소원을 아십니다</h2><blockquote><p>“<strong>여호와께서</strong> 사람의 죄악이 세상에 가득함과 <strong>그의 마음으로 생각하는 모든 계획이 항상 악할 뿐임을 보시고</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gen/6/#L5">창 6:5</a>)</p></blockquote><blockquote><p>“주여 <strong>나의 모든 소원이 주 앞에 있사오며</strong> 나의 탄식이 주 앞에 감추이지 아니하나이다” (<a href="https://bibleox.com/ko/ko-nkrv/ps/38/#L9">시 38:9</a>)</p></blockquote><blockquote><p>“우리가 우리 하나님의 이름을 잊어버렸거나 우리 손을 이방 신에게 향하여 폈더면 하나님이 이를 알아내지 아니하셨으리이까 무릇 <strong>주는 마음의 비밀을 아시나이다</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ps/44/#L20-21">시 44:20-21</a>)</p></blockquote><blockquote><p>“<strong>여호와께서는 모든 마음을 감찰하사 모든 의도를 아시나니</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1par/28/#L9">대상 28:9</a>)</p></blockquote><blockquote><p>“주는 계신 곳 하늘에서 들으시며 사유하시되 각 사람의 마음을 아시오니 그의 모든 행위대로 갚으시옵소서 <strong>주만 홀로 사람의 마음을 아심이니이다</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2par/6/#L30">대하 6:30</a>)</p></blockquote><blockquote><p>“주님, 곧 전능하신 분께서 … <strong>어떤 생각도 그분을 비껴가지 못하고, 어떤 말도 그분에게 숨겨지지 않는다</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/prsir/42/#L17,20">집회 42:17,20</a>, 그리스어에서 번역)</p></blockquote><blockquote><p>“<strong>예수께서 그 생각을 아시고</strong> 이르시되 <strong>너희가 어찌하여 마음에 악한 생각을 하느냐</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/9/#L4">마 9:4</a>; <a href="https://bibleox.com/ko/ko-nkrv/lk/5/#L22">눅 5:22</a>)</p></blockquote><blockquote><p>“<strong>예수께서 그들의 생각을 아시고</strong> 이르시되” (<a href="https://bibleox.com/ko/ko-nkrv/mf/12/#L25">마 12:25</a>)</p></blockquote><blockquote><p>“<strong>예수께서 그들의 생각을 아시고</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/lk/6/#L8">눅 6:8</a>)</p></blockquote><blockquote><p>“<strong>예수께서 그 마음에 변론하는 것을 아시고</strong> 어린 아이 하나를 데려다가 자기 곁에 세우시고” (<a href="https://bibleox.com/ko/ko-nkrv/lk/9/#L47">눅 9:47</a>)</p></blockquote><blockquote><p>“<strong>예수께서 그들의 생각을 아시고</strong> 이르시되” (<a href="https://bibleox.com/ko/ko-nkrv/lk/11/#L17">눅 11:17</a>)</p></blockquote><blockquote><p>“그들이 기도하여 이르되 <strong>뭇 사람의 마음을 아시는 주여</strong> 이 두 사람 중에 누가 주님께 택하신 바 되어” (<a href="https://bibleox.com/ko/ko-nkrv/act/1/#L24">행 1:24</a>)</p></blockquote><blockquote><p>“또 <strong>마음을 아시는 하나님이</strong> 우리에게와 같이 그들에게도 성령을 주어 증언하시고” (<a href="https://bibleox.com/ko/ko-nkrv/act/15/#L8">행 15:8</a>)</p></blockquote><h2>하느님께서는 사람의 모든 죄를 아십니다</h2><blockquote><p>“<strong>하나님이여 주는 나의 우매함을 아시오니 나의 죄가 주 앞에서 숨김이 없나이다</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ps/69/#L5">시 69:5</a>)</p></blockquote>
