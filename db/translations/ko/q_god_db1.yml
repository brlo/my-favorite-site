  body: <h2>하느님은 보이지 않으십니다</h2><blockquote><p>“하느님께서는 세상을 창조하신 때부터 창조물을 통하여 <strong>당신의 영원하신 능력과 신성과 같은 보이지 않는 특성</strong>을 나타내 보이셔서 인간이 보고 깨달을 수 있게 하셨습니다. 그러니 사람들이 무슨 핑계를 대겠습니까?” (<a href="https://bibleox.com/ko/ko-ctb/rim/1/#L20">로마 1:20</a>)</p></blockquote><blockquote><p>“그리스도께서는 <strong>보이지 않는 하느님</strong>의 형상이시며 만물에 앞서 태어나신 분이십니다.” (<a href="https://bibleox.com/ko/ko-ctb/kol/1/#L15">골로 1:15</a>)</p></blockquote><blockquote><p>“영원한 왕이시며 오직 한 분뿐이시고 <strong>눈으로 볼 수 없는 불멸의 하느님</strong>께서 영원무궁토록 영예와 영광을 받으시기를 빕니다. 아멘.” (<a href="https://bibleox.com/ko/ko-ctb/1tim/1/#L17">1디모 1:17</a>)</p></blockquote><blockquote><p>“그분은 홀로 불멸하시고 사람이 가까이 갈 수 없는 빛 가운데 계시며 <strong>사람이 일찌기 본 일이 없고 또 볼 수도 없는 분</strong>이십니다. 영예와 권세가 영원히 그분에게 있기를 빕니다. 아멘.” (<a href="https://bibleox.com/ko/ko-ctb/1tim/6/#L16">1디모 6:16</a>)</p></blockquote><blockquote><p>“우리는 믿음이 있으므로 이 세상이 하느님의 말씀으로 창조되었다는 것, 곧 <strong>우리의 눈에 보이는 것이 보이지 않는 것에서 나왔다는 것</strong>을 압니다. &lt;…&gt; 믿음이 없이는 하느님을 기쁘게 해 드릴 수 없습니다. <strong>하느님께로</strong> 가까이 가는 사람은 하느님이 계시다는 것과 하느님께서 당신을 찾는 사람들에게 상을 주신 다는 것을 믿어야 합니다. &lt;…&gt; 모세는 믿음으로 왕의 분노도 무서워하지 않고 에집트를 떠났습니다. 그는 <strong>보이지 않는 하느님</strong>을 본 듯 확신을 가지고 행동했던 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/evr/11/#L3,6,27">히브 11:3,6,27</a>)</p></blockquote><h2>하느님께서는 강생하신 뒤 인성으로 보이게 되셨습니다</h2><blockquote><p>“<strong>일찌기 하느님을 본 사람은 없다</strong>. 그런데 아버지의 품안에 계신 <strong>외아들로서</strong> 하느님과 똑같으신 그분이 <strong>하느님을 알려 주셨다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/in/1/#L18">요한 1:18</a>)</p></blockquote>
