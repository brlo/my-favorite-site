  body: <h2>하느님은 보이지 않으십니다</h2><blockquote><p>“창세로부터 <strong>그의 보이지 아니하는 것들 곧 그의 영원하신 능력과 신성</strong>이 그가 만드신 만물에 분명히 보여 알려졌나니 그러므로 그들이 핑계하지 못할지니라” (<a href="https://bibleox.com/ko/ko-nkrv/rim/1/#L20">롬 1:20</a>)</p></blockquote><blockquote><p>“그는 <strong>보이지 아니하는 하나님</strong>의 형상이시요 모든 피조물보다 먼저 나신 이시니” (<a href="https://bibleox.com/ko/ko-nkrv/kol/1/#L15">골 1:15</a>)</p></blockquote><blockquote><p>“영원하신 왕 곧 썩지 아니하고 <strong>보이지 아니하고 홀로 하나이신 하나님</strong>께 존귀와 영광이 영원무궁하도록 있을지어다 아멘” (<a href="https://bibleox.com/ko/ko-nkrv/1tim/1/#L17">딤전 1:17</a>)</p></blockquote><blockquote><p>“오직 그에게만 죽지 아니함이 있고 가까이 가지 못할 빛에 거하시고 <strong>어떤 사람도 보지 못하였고 또 볼 수 없는 이시니</strong> 그에게 존귀와 영원한 권능을 돌릴지어다 아멘” (<a href="https://bibleox.com/ko/ko-nkrv/1tim/6/#L16">딤전 6:16</a>)</p></blockquote><blockquote><p>“믿음으로 모든 세계가 하나님의 말씀으로 지어진 줄을 우리가 아나니 <strong>보이는 것은 나타난 것으로 말미암아 된 것이 아니니라</strong> &lt;…&gt; 믿음이 없이는 하나님을 기쁘시게 하지 못하나니 <strong>하나님께</strong> 나아가는 자는 반드시 그가 계신 것과 또한 그가 자기를 찾는 자들에게 상 주시는 이심을 믿어야 할지니라 &lt;…&gt; 믿음으로 애굽을 떠나 왕의 노함을 무서워하지 아니하고 곧 <strong>보이지 아니하는 자를</strong> 보는 것 같이 하여 참았으며” (<a href="https://bibleox.com/ko/ko-nkrv/evr/11/#L3,6,27">히 11:3,6,27</a>)</p></blockquote><h2>하느님께서는 강생하신 뒤 인성으로 보이게 되셨습니다</h2><blockquote><p>“<strong>본래 하나님을 본 사람이 없으되</strong> 아버지 품 속에 있는 <strong>독생하신 하나님이</strong> <strong>나타내셨느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/in/1/#L18">요 1:18</a>)</p></blockquote>
  meta_desc: 하느님께서 보이지 않으신다는 것에 관한 성경 구절
