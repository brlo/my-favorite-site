  path: v2jp_하느님은영원하시다
  title: 하느님은 영원하십니다
  copy_cover: true
  body: <h2>하느님은 영원하십니다</h2><blockquote><p>“너는 알지 못하였느냐 듣지 못하였느냐 <strong>영원하신 하나님</strong> 여호와, 땅 끝까지 창조하신 이는 피곤하지 않으시며 곤비하지 않으시며 명철이 한이 없으시며” (<a href="https://bibleox.com/ko/ko-nkrv/is/40/#L28">사 40:28</a>)</p></blockquote><blockquote><p>“아브라함은 브엘세바에 에셀 나무를 심고 거기서 <strong>영원하신 여호와</strong>의 이름을 불렀으며” (<a href="https://bibleox.com/ko/ko-nkrv/gen/21/#L33">창 21:33</a>)</p></blockquote><blockquote><p>“너희는 <strong>여호와를 영원히 신뢰하라 주 여호와는 영원한 반석이심이로다</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/is/26/#L4">사 26:4</a>)</p></blockquote><blockquote><p>“지극히 존귀하며 <strong>영원히 거하시며</strong> 거룩하다 이름하는 이가 이와 같이 말씀하시되 내가 높고 거룩한 곳에 있으며 또한 통회하고 마음이 겸손한 자와 함께 있나니 이는 겸손한 자의 영을 소생시키며 통회하는 자의 마음을 소생시키려 함이라” (<a href="https://bibleox.com/ko/ko-nkrv/is/57/#L15">사 57:15</a>)</p></blockquote><blockquote><p>“<strong>여호와께서 영원히 앉으심이여</strong> 심판을 위하여 보좌를 준비하셨도다” (<a href="https://bibleox.com/ko/ko-nkrv/ps/9/#L7">시 9:7</a>)</p></blockquote><blockquote><p>“너희 높은 산들아 어찌하여 하나님이 계시려 하는 산을 시기하여 보느냐 진실로 <strong>여호와께서 이 산에 영원히 계시리로다</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ps/68/#L16">시 68:16</a>)</p></blockquote><blockquote><p>“주께서 옛적에 땅의 기초를 놓으셨사오며 하늘도 주의 손으로 지으신 바니이다 <strong>천지는 없어지려니와 주는 영존하시겠고</strong> 그것들은 다 옷 같이 낡으리니 의복 같이 바꾸시면 바뀌려니와 <strong>주는 한결같으시고 주의 연대는 무궁하리이다</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ps/102/#L25-27">시 102:25-27</a>; <a href="https://bibleox.com/ko/ko-nkrv/evr/1/#L10-12">히 1:10-12</a>)</p></blockquote><blockquote><p>“다시는 낮에 해가 네 빛이 되지 아니하며 달도 네게 빛을 비추지 않을 것이요 오직 <strong>여호와가 네게 영원한 빛이 되며</strong> 네 하나님이 네 영광이 되리니 다시는 네 해가 지지 아니하며 네 달이 물러가지 아니할 것은 <strong>여호와가 네 영원한 빛이 되고</strong> 네 슬픔의 날이 끝날 것임이라” (<a href="https://bibleox.com/ko/ko-nkrv/is/60/#L19-20">사 60:19-20</a>)</p></blockquote><blockquote><p>“내가 들은즉 그 세마포 옷을 입고 강물 위쪽에 있는 자가 자기의 좌우 손을 들어 하늘을 향하여 <strong>영원히 살아 계시는 이를 가리켜 맹세하여</strong> 이르되 반드시 한 때 두 때 반 때를 지나서 성도의 권세가 다 깨지기까지이니 그렇게 되면 이 모든 일이 다 끝나리라 하더라” (<a href="https://bibleox.com/ko/ko-nkrv/dan/12/#L7">단 12:7</a>)</p></blockquote><h2>하느님께서는 영원히 다스리십니다</h2><blockquote><p>“<strong>여호와께서 영원무궁 하도록 다스리시도다</strong> 하였더라” (<a href="https://bibleox.com/ko/ko-nkrv/ish/15/#L18">출 15:18</a>)</p></blockquote><blockquote><p>“오직 여호와는 참 하나님이시요 살아 계신 하나님이시요 <strong>영원한 왕이시라</strong> 그 진노하심에 땅이 진동하며 그 분노하심을 이방이 능히 당하지 못하느니라” (<a href="https://bibleox.com/ko/ko-nkrv/ier/10/#L10">렘 10:10</a>)</p></blockquote><blockquote><p>“내가 또 밤 환상 중에 보니 <strong>인자 같은 이가</strong> 하늘 구름을 타고 와서 옛적부터 항상 계신 이에게 나아가 그 앞으로 인도되매 그에게 권세와 영광과 나라를 주고 모든 백성과 나라들과 다른 언어를 말하는 모든 자들이 그를 섬기게 하였으니 <strong>그의 권세는 소멸되지 아니하는 영원한 권세요 그의 나라는 멸망하지 아니할 것이니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/dan/7/#L13-14">단 7:13-14</a>)</p></blockquote><blockquote><p>“<strong>하나님이여 주의 보좌는 영원하며</strong> 주의 나라의 규는 공평한 규이니이다” (<a href="https://bibleox.com/ko/ko-nkrv/ps/45/#L6">시 45:6</a>)</p></blockquote><blockquote><p>“영원히 야곱의 집을 왕으로 다스리실 것이며 <strong>그 나라가 무궁하리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/lk/1/#L33">눅 1:33</a>)</p></blockquote><blockquote><p>“이같이 하면 <strong>우리 주 곧 구주 예수 그리스도의 영원한 나라</strong>에 들어감을 넉넉히 너희에게 주시리라” (<a href="https://bibleox.com/ko/ko-nkrv/2pet/1/#L11">벧후 1:11</a>)</p></blockquote><h2>하느님께서는 시간 이전에, 시간을 넘어 계십니다</h2><blockquote><p>“영생의 소망을 위함이라 이 영생은 거짓이 없으신 하나님이 <strong>영원 전부터 약속하신 것인데</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/tit/1/#L2">딛 1:2</a>)</p></blockquote>
