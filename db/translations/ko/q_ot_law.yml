- src: Библия-Закон-Моисея-отмена
  path: Ab21l_모세_율법의_폐지
  title: 모세 율법의 폐지
  copy_cover: true
  body: '<h2>모세 율법의 폐지에 대한 자세한 설명</h2><p>거룩한 교부들의 말씀에 붙인 머리말을 보십시오: <a href="https://bibleox.com/ru/ru/w/Отмена_Закона_Моисея">모세 율법의 폐지에 관하여</a> (러시아어).</p><h2>모세 율법은 폐지되었습니다</h2><blockquote><p>“이제는 <strong><mark>우리가 얽매였던 것에 대하여 죽었으므로 율법에서 벗어났으니</mark></strong> 이러므로 우리가 영의 새로운 것으로 섬길 것이요 <strong>율법 조문의 묵은 것으로 아니할지니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/rim/7/#L6">롬 7:6</a>)</p></blockquote><h3>더 이상 초등교사(율법) 아래에 있지 않습니다</h3><blockquote><p>“그러면 율법이 하나님의 약속들과 반대되는 것이냐 결코 그럴 수 없느니라 만일 능히 살게 하는 율법을 주셨더라면 의가 반드시 율법으로 말미암았으리라 그러나 성경이 모든 것을 죄 아래에 가두었으니 이는 예수 그리스도를 믿음으로 말미암는 약속을 믿는 자들에게 주려 함이라 <strong><mark>믿음이 오기 전에 우리는 율법 아래에 매인 바 되고</mark></strong> 계시될 믿음의 때까지 갇혔느니라 이같이 <strong><mark>율법이 우리를 그리스도께로 인도하는 초등교사가 되어</mark></strong> 우리로 하여금 믿음으로 말미암아 의롭다 함을 얻게 하려 함이라 <strong><mark>믿음이 온 후로는 우리가 초등교사 아래에 있지 아니하도다</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gal/3/#L21-25">갈 3:21-25</a>)</p></blockquote><blockquote><p>“내가 또 말하노니 <strong>유업을 이을 자가</strong> 모든 것의 주인이나 <strong><mark>어렸을 동안에는</mark></strong> 종과 다름이 없어서 그 <strong>아버지가 정한 때까지</strong> 후견인과 청지기 아래에 있나니 &lt;…&gt; 이제는 너희가 하나님을 알 뿐 아니라 더욱이 하나님이 아신 바 되었거늘 어찌하여 다시 약하고 천박한 초등학문으로 돌아가서 <strong>다시 그들에게 종 노릇 하려 하느냐 너희가 날과 달과 절기와 해를 삼가 지키니</strong> 내가 너희를 위하여 수고한 것이 헛될까 두려워하노라 &lt;…&gt; 내게 말하라 <strong><mark>율법 아래에 있고자 하는 자들아</mark></strong> 율법을 듣지 못하였느냐 &lt;…&gt; 그러나 그 때에 <strong>육체를 따라 난 자가 성령을 따라 난 자를 박해한 것 같이 이제도 그러하도다</strong> 그러나 성경이 무엇을 말하느냐 여종과 그 아들을 내쫓으라 <strong>여종의 아들이 자유 있는 여자의 아들과 더불어 유업을 얻지 못하리라</strong> 하였느니라 그런즉 형제들아 <strong><mark>우리는 여종의 자녀가 아니요 자유 있는 여자의 자녀니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gal/4/#L1-2,9-11,21,29-31">갈 4:1-2,9-11,21,29-31</a>) <em>(은둔자 성 테오판에 따르면 10절의 “날”은 안식일을 말합니다. 29절의 “육체를 따라 난 자”는 율법에 견준 것입니다.)</em></p></blockquote><h2>율법 폐지에 관한 공의회의 결정</h2><p>첫 사도 공의회는 그리스도인들이 유대 율법의 규례를 지킬 필요가 없다고 결정했습니다:</p><blockquote><p>“<strong><mark>바리새파 중에 어떤 믿는 사람들이 일어나 말하되</mark></strong> 이방인에게 할례를 행하고 <strong><mark>모세의 율법을 지키라 명하는 것이 마땅하다</mark></strong> 하니라 사도와 장로들이 이 일을 의논하러 모여” (<a href="https://bibleox.com/ko/ko-nkrv/act/15/#L5-6">행 15:5-6</a>) <em>(“바리새파”는 그리스어로 τινες τῶν ἀπὸ τῆς αἱρέσεως τῶν Φαρισαίων, 곧 “바리새인들의 <strong>이단</strong>(분파) 가운데 어떤 이들”입니다.)</em></p></blockquote><blockquote><p>“들은즉 <strong><mark>우리 가운데서 어떤 사람들이 우리의 지시도 없이 나가서 말로 너희를 괴롭게 하고</mark></strong> 마음을 혼란하게 한다 하기로” (<a href="https://bibleox.com/ko/ko-nkrv/act/15/#L24">행 15:24</a>) <em>(비잔틴 본문(다수 사본)에는 “<strong>할례를 받고 율법을 지켜야 한다고 말하여</strong>”가 있습니다.)</em></p></blockquote><blockquote><p>“<strong><mark>성령과 우리는 이 요긴한 것들 외에는 아무 짐도 너희에게 지우지 아니하는 것이 옳은 줄 알았노니 우상의 제물과 피와 목매어 죽인 것과 음행을 멀리할지니라</mark></strong> 이에 스스로 삼가면 잘되리라 평안함을 원하노라 하였더라” (<a href="https://bibleox.com/ko/ko-nkrv/act/15/#L28-29">행 15:28-29</a>)</p></blockquote><blockquote><p>“<strong>주를 믿는 이방인에게는 우리가 우상의 제물과 피와 목매어 죽인 것과 음행을 피할 것을 결의하고 편지하였느니라</strong> 하니” (<a href="https://bibleox.com/ko/ko-nkrv/act/21/#L25">행 21:25</a>)</p></blockquote><blockquote><p>“여러 성으로 다녀 갈 때에 <strong>예루살렘에 있는 사도와 장로들이 작정한 규례를 그들에게 주어 지키게 하니</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/act/16/#L4">행 16:4</a>)</p></blockquote><h2>사도들과 첫 그리스도인들은 모세 율법대로 살지 않았습니다</h2><h3>율법 없는 자에게는 율법 없는 자와 같이 되었습니다(곧 율법을 지키지 않았습니다)</h3><blockquote><p>“유대인들에게 내가 유대인과 같이 된 것은 유대인들을 얻고자 함이요 율법 아래에 있는 자들에게는 내가 율법 아래에 있지 아니하나 율법 아래에 있는 자 같이 된 것은 율법 아래에 있는 자들을 얻고자 함이요 <strong><mark>율법 없는 자에게는 내가 하나님께는 율법 없는 자가 아니요 도리어 그리스도의 율법 아래에 있는 자이나 율법 없는 자와 같이 된 것은</mark></strong> 율법 없는 자들을 얻고자 함이라” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/9/#L20-21">고전 9:20-21</a>)</p></blockquote><h3>보제 스데반은 율법을 바꾸라고 가르친다는 고발을 받았습니다</h3><blockquote><p>“거짓 증인들을 세우니 이르되 이 사람이 이 <strong>거룩한 곳과 율법을 거슬러 말하기를 마지 아니하는도다</strong> 그의 말에 이 나사렛 예수가 이 곳을 헐고 또 <strong><mark>모세가 우리에게 전하여 준 규례를 고치겠다 함을 우리가 들었노라</mark></strong> 하거늘” (<a href="https://bibleox.com/ko/ko-nkrv/act/6/#L13-14">행 6:13-14</a>)</p></blockquote><h3>사도 바울은 율법을 어기며 하느님을 섬기라고 가르친다는 고발을 받았습니다</h3><blockquote><p>“말하되 <strong><mark>이 사람이 율법을 어기면서 하나님을 경외하라고 사람들을 권한다</mark></strong> 하거늘” (<a href="https://bibleox.com/ko/ko-nkrv/act/18/#L13">행 18:13</a>)</p></blockquote><blockquote><p>“그들이 듣고 하나님께 영광을 돌리고 바울더러 이르되 형제여 그대도 보는 바에 유대인 중에 믿는 자 수만 명이 있으니 다 율법에 열성을 가진 자라 네가 <strong><mark>이방에 있는 모든 유대인을 가르치되 모세를 배반하고</mark></strong> <strong><mark>아들들에게 할례를 행하지 말고 또 관습을 지키지 말라 한다 함을</mark></strong> 그들이 들었도다” (<a href="https://bibleox.com/ko/ko-nkrv/act/21/#L20-21">행 21:20-21</a>)</p></blockquote><p>사도 바울이 유대교를 전한다면 유대인들은 왜 그를 박해합니까? 그가 율법을 떠났기 때문에 박해합니다:</p><blockquote><p>“<strong>그리스도께서 우리를 자유롭게 하려고 자유를 주셨으니</strong> 그러므로 굳건하게 서서 <strong><mark>다시는 종의 멍에를 메지 말라</mark></strong> &lt;…&gt; 형제들아 <strong><mark>내가 지금까지 할례를 전한다면 어찌하여 지금까지 박해를 받으리요</mark></strong> 그리하였으면 십자가의 걸림돌이 제거되었으리니” (<a href="https://bibleox.com/ko/ko-nkrv/gal/5/#L1,11">갈 5:1,11</a>)</p></blockquote><p>어떤 그리스도인들은 박해받지 않으려고 유대인들 앞에서 율법 아래에 있는 척합니다:</p><blockquote><p>“<strong>무릇 육체의 모양을 내려 하는 자들이</strong> 억지로 너희에게 할례를 받게 함은 그들이 그리스도의 십자가로 말미암아 <strong>박해를 면하려 함뿐이라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gal/6/#L12">갈 6:12</a>)</p></blockquote><h3>그리스도인들은 할례를 받지 않습니다</h3><blockquote><p>“<strong>할례자로서 부르심을 받은 자가 있느냐 무할례자가 되지 말며</strong> <strong>무할례자로 부르심을 받은 자가 있느냐 할례를 받지 말라</strong> <strong>할례 받는 것도 아무 것도 아니요 할례 받지 아니하는 것도 아무 것도 아니로되</strong> 오직 하나님의 계명을 지킬 따름이니라” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/7/#L18-19">고전 7:18-19</a>)</p></blockquote><blockquote><p>“그리스도 예수 안에서는 <strong>할례나 무할례나 효력이 없으되</strong> 사랑으로써 역사하는 믿음뿐이니라” (<a href="https://bibleox.com/ko/ko-nkrv/gal/5/#L6">갈 5:6</a>)</p></blockquote><blockquote><p>“<strong>할례나 무할례가 아무 것도 아니로되</strong> 오직 새로 지으심을 받는 것만이 중요하니라” (<a href="https://bibleox.com/ko/ko-nkrv/gal/6/#L15">갈 6:15</a>)</p></blockquote><blockquote><p>“거기에는 헬라인이나 유대인이나 <strong>할례파나 무할례파나</strong> 야만인이나 스구디아인이나 종이나 자유인이 차별이 있을 수 없나니 오직 그리스도는 만유시요 만유 안에 계시니라” (<a href="https://bibleox.com/ko/ko-nkrv/kol/3/#L11">골 3:11</a>)</p></blockquote><h3>짐승을 제물로 바치지 않습니다</h3><blockquote><p>“위에 말씀하시기를 주께서는 <strong>제사와 예물과 번제와 속죄제는 원하지도 아니하고 기뻐하지도 아니하신다</strong> 하셨고 (이는 다 율법을 따라 드리는 것이라) 그 후에 말씀하시기를 보시옵소서 내가 하나님의 뜻을 행하러 왔나이다 하셨으니 <strong>그 첫째 것을 폐하심은 둘째 것을 세우려 하심이라</strong> &lt;…&gt; 주께서 이르시되 그 날 후로는 그들과 맺을 언약이 이것이라 하시고 내 법을 그들의 마음에 두고 그들의 생각에 기록하리라 하신 후에 또 그들의 죄와 그들의 불법을 내가 다시 기억하지 아니하리라 하셨으니 <strong>이것들을 사하셨은즉 다시 죄를 위하여 제사 드릴 것이 없느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/evr/10/#L8-9,16-18">히 10:8-9,16-18</a>)</p></blockquote><h3>안식일의 쉼을 지키지 않습니다</h3><blockquote><p>“그러므로 먹고 마시는 것과 절기나 초하루나 <strong>안식일을</strong> 이유로 <strong>누구든지</strong> <strong>너희를 비판하지 못하게 하라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/kol/2/#L16">골 2:16</a>)</p></blockquote><blockquote><p>“그 때에 예수께서 <strong>안식일에</strong> 밀밭 사이로 가실새 제자들이 시장하여 <strong>이삭을 잘라 먹으니</strong> 바리새인들이 보고 예수께 말하되 보시오 당신의 제자들이 안식일에 하지 못할 일을 하나이다 &lt;…&gt; 나는 자비를 원하고 제사를 원하지 아니하노라 하신 뜻을 너희가 알았더라면 <strong>무죄한 자를 정죄하지 아니하였으리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/12/#L1-2,7">마 12:1-2,7</a>)</p></blockquote><h3>이방인과 사귀며, 스스로도 이방인입니다</h3><blockquote><p>“더불어 말하며 들어가 여러 사람이 모인 것을 보고 이르되 <strong>유대인으로서 이방인과 교제하며 가까이 하는 것이 위법인 줄은 너희도 알거니와</strong> <strong>하나님께서 내게 지시하사 아무도 속되다 하거나 깨끗하지 않다 하지 말라 하시기로</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/act/10/#L27-28">행 10:27-28</a>)</p></blockquote><h3>시체를 만집니다</h3><p>주 예수 그리스도께서는 야이로의 죽은 딸을 만지셨습니다:</p><blockquote><p>“<strong>그 아이의 손을 잡고 이르시되</strong> 달리다굼 하시니 번역하면 곧 내가 네게 말하노니 소녀야 일어나라 하심이라” (<a href="https://bibleox.com/ko/ko-nkrv/mk/5/#L41">막 5:41</a>)</p></blockquote><p>율법에 따르면 그리스도께서 십자가에서 돌아가셨을 때 이미 죽은 분으로서 아무도 그분을 만질 수 없었습니다. 친족인 하느님의 어머니만 그렇게 할 수 있었습니다(<a href="https://bibleox.com/ko/ko-nkrv/lev/21/#L1-4">레 21:1-4</a>). 그러나 우리는 신학자 요한과 니고데모와 아리마대 요셉을 정죄하지 않을 뿐 아니라, 아무것도 두려워하지 않고 우리 구세주를 섬긴 그들을 칭송합니다.</p><blockquote><p>“<strong>요셉이</strong> 시체를 가져다가 깨끗한 세마포로 싸서 바위 속에 판 자기 새 무덤에 넣어 두고 큰 돌을 굴려 무덤 문에 놓고 가니” (<a href="https://bibleox.com/ko/ko-nkrv/mf/27/#L59-60">마 27:59-60</a>)</p></blockquote><blockquote><p>“<strong>요한의 제자들이</strong> 듣고 와서 시체를 가져다가 장사하니라” (<a href="https://bibleox.com/ko/ko-nkrv/mk/6/#L29">막 6:29</a>)</p></blockquote><blockquote><p>“백부장에게 알아 본 후에 요셉에게 시체를 내주는지라 <strong>요셉이</strong> 세마포를 사서 예수를 내려다가 그것으로 싸서 바위 속에 판 무덤에 넣어 두고 돌을 굴려 무덤 문에 놓으매” (<a href="https://bibleox.com/ko/ko-nkrv/mk/15/#L45-46">막 15:45-46</a>)</p></blockquote><blockquote><p>“성경에 그를 가리켜 기록한 말씀을 다 응하게 한 것이라 후에 <strong>나무에서 내려다가</strong> 무덤에 두었으나” (<a href="https://bibleox.com/ko/ko-nkrv/act/13/#L29">행 13:29</a>)</p></blockquote><h3>주님께서는 간음하다 잡힌 여인을 놓아주십니다</h3><p>율법은 간음한 자를 돌로 치라고 명하지만(레 20:10), 주님께서는 간음한 여인을 정죄하지 않으시고 놓아주셨습니다:</p><blockquote><p>“대답하되 주여 없나이다 예수께서 이르시되 <strong><mark>나도 너를 정죄하지 아니하노니 가서 다시는 죄를 범하지 말라</mark></strong> 하시니라]” (<a href="https://bibleox.com/ko/ko-nkrv/in/8/#L11">요 8:11</a>)</p></blockquote><h3>주님께서는 당신의 피를 마시라고 명하십니다</h3><p>하느님께서는 피를 먹지 말라고 금하시지만(창 9:4; 레 3:17; 레 7:26; 레 17:14; 신 12:16), 마지막 만찬에서 제자들에게 “마시라, 이것은 내 피다”라는 말씀과 함께 잔을 주십니다:</p><blockquote><p>“그들이 먹을 때에 예수께서 떡을 가지사 축복하시고 떼어 제자들에게 주시며 이르시되 받아서 먹으라 이것은 내 몸이니라 하시고 또 잔을 가지사 감사 기도 하시고 그들에게 주시며 이르시되 <strong><mark>너희가 다 이것을 마시라 이것은</mark></strong> 죄 사함을 얻게 하려고 많은 사람을 위하여 흘리는 바 <strong>나의 피</strong> 곧 언약의 피니라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/26/#L26-28">마 26:26-28</a>)</p></blockquote><h3>주님께서는 유다 지파에서 나시어 대제사장이 되셨습니다</h3><p>율법은 제사장이 레위 지파, 아론의 집안에서만 나와야 한다고 명합니다:</p><blockquote><p>“<strong>아론과 그의 아들들에게</strong> 띠를 띠우며 관을 씌워 그들에게 <strong>제사장의 직분을 맡겨</strong> 영원한 규례가 되게 하라 너는 이같이 아론과 그의 아들들에게 위임하여 거룩하게 할지니라” (<a href="https://bibleox.com/ko/ko-nkrv/ish/29/#L9">출 29:9</a>)</p></blockquote><blockquote><p>“<strong>아론의 성의는 후에 아론의 아들들에게 돌릴지니 그들이 그것을 입고 기름 부음으로 위임을 받을 것이며</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ish/29/#L29">출 29:29</a>)</p></blockquote><p>그러나 주님께서는 유다 지파에서 나시어 대제사장이 되셨습니다:</p><blockquote><p>“<strong><mark>우리 주께서는 유다로부터 나신 것이 분명하도다</mark></strong> <strong>이 지파에는 모세가 제사장들에 관하여 말한 것이 하나도 없고</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/evr/7/#L14">히 7:14</a>)</p></blockquote><h3>참된 유월절 제물은 성전에서 바쳐지지 않습니다</h3><p>유월절 제물은 예루살렘 성전에서만 바칠 수 있었습니다:</p><blockquote><p>“<strong>유월절 제사를 네 하나님 여호와께서 네게 주신 각 성에서 드리지 말고</strong> 오직 네 하나님 여호와께서 자기의 이름을 두시려고 택하신 곳에서 네가 애굽에서 나오던 시각 곧 초저녁 해 질 때에 유월절 제물을 드리고” (<a href="https://bibleox.com/ko/ko-nkrv/vtor/16/#L5-6">신 16:5-6</a>)</p></blockquote><blockquote><p>“그러므로 예수도 자기 피로써 백성을 거룩하게 하려고 <strong><mark>성문 밖에서 고난을 받으셨느니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/evr/13/#L12">히 13:12</a>)</p></blockquote><h2>십계명도 모세 율법인가?</h2><h3>모세를 통해 주신 하느님의 율법 — 레위기의 모든 명령</h3><p><a href="https://bibleox.com/ru/ru/w/10-заповедей">돌판의 계명</a>을 비롯해 하느님의 많은 명령을 나열하는 레위기는 그것들을 <strong>모세를 통해 세우신 여호와의 율법</strong>이라고 부릅니다:</p><blockquote><p>“이것은 <strong><mark>여호와께서</mark></strong> 시내 산에서 자기와 이스라엘 자손 사이에 <strong><mark>모세를 통하여 세우신 규례와 법도와 율법이니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/lev/26/#L46">레 26:46</a>)</p></blockquote><h3>하느님께서는 당신의 모든 명령을 율법이라고 부르십니다</h3><p>예를 들어 만나를 거두라는 명령도 하느님의 율법입니다:</p><blockquote><p>“그 때에 여호와께서 모세에게 이르시되 보라 내가 너희를 위하여 하늘에서 양식을 비 같이 내리리니 <strong><mark>백성이 나가서 일용할 것을 날마다 거둘 것이라</mark></strong> 이같이 하여 그들이 <strong><mark>내 율법</mark></strong>을 준행하나 아니하나 내가 시험하리라 &lt;…&gt; 여호와께서 모세에게 이르시되 <strong><mark>어느 때까지 너희가 내 계명과 내 율법을 지키지 아니하려느냐</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ish/16/#L4,28">출 16:4,28</a>)</p></blockquote><p>출애굽기 16, 24, 31, 34, 35장; 신명기 4, 6, 10장.</p><h3>새 율법은 더 이상 돌판이 아니라 마음에 기록됩니다</h3><p>돌판에 기록된 것을 “율법”이라고 부릅니다:</p><blockquote><p>“그러나 그 날 후에 내가 이스라엘 집과 맺을 언약은 이러하니 곧 <strong><mark>내가 나의 법을 그들의 속에 두며 그들의 마음에 기록하여</mark></strong> 나는 그들의 하나님이 되고 그들은 내 백성이 될 것이라 여호와의 말씀이니라” (<a href="https://bibleox.com/ko/ko-nkrv/ier/31/#L33">렘 31:33</a>)</p></blockquote><blockquote><p>“너희는 우리로 말미암아 나타난 <strong>그리스도의 편지니</strong> 이는 먹으로 쓴 것이 아니요 오직 살아 계신 하나님의 영으로 쓴 것이며 또 <strong><mark>돌판에 쓴 것이 아니요 오직 육의 마음판에 쓴 것이라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2kor/3/#L3">고후 3:3</a>)</p></blockquote><h3>그리스도께서는 십계명을 따로 구별하지 않고 계명들을 말씀하십니다</h3><blockquote><p>“옛 사람에게 말한 바 <strong>살인하지 말라</strong> 누구든지 살인하면 심판을 받게 되리라 하였다는 것을 너희가 들었으나 &lt;…&gt; 또 <strong>간음하지 말라</strong> 하였다는 것을 너희가 들었으나 &lt;…&gt; 또 옛 사람에게 말한 바 <strong><mark>헛 맹세를 하지 말고</mark></strong> 네 맹세한 것을 주께 지키라 하였다는 것을 너희가 들었으나 &lt;…&gt; 또 <strong><mark>눈은 눈으로, 이는 이로 갚으라</mark></strong> 하였다는 것을 너희가 들었으나 &lt;…&gt; 또 <strong><mark>네 이웃을 사랑하고</mark></strong> <strong>네 원수를 미워하라</strong> 하였다는 것을 너희가 들었으나” (<a href="https://bibleox.com/ko/ko-nkrv/mf/5/#L21,27,33,38,43">마 5:21,27,33,38,43</a>)</p></blockquote><h3>사도들은 십계명을 그냥 율법이라고 부릅니다</h3><p>사도 야고보는 “살인하지 말라”는 계명을 어긴 사람이 율법을 범한 자라고 말합니다:</p><blockquote><p>“누구든지 온 율법을 지키다가 그 하나를 범하면 모두 범한 자가 되나니 간음하지 말라 하신 이가 또한 살인하지 말라 하셨은즉 네가 비록 <strong><mark>간음하지 아니하여도 살인하면 율법을 범한 자가 되느니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/iak/2/#L10-11">약 2:10-11</a>)</p></blockquote><h2>율법은 구원하지 못합니다</h2><h3>율법은 장차 올 좋은 일의 그림자이며 죄를 생각나게 하는 것입니다</h3><blockquote><p>“<strong><mark>율법은 장차 올 좋은 일의 그림자일 뿐이요 참 형상이 아니므로</mark></strong> 해마다 늘 드리는 같은 제사로는 나아오는 자들을 언제나 온전하게 할 수 없느니라 그렇지 아니하면 섬기는 자들이 단번에 정결하게 되어 다시 죄를 깨닫는 일이 없으리니 어찌 제사 드리는 일을 그치지 아니하였으리요 그러나 이 제사들에는 해마다 <strong><mark>죄를 기억하게 하는 것이 있나니</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/evr/10/#L1-3">히 10:1-3</a>)</p></blockquote><h3>율법은 구원하지 못합니다. 율법을 아는 것도, 율법의 행위도</h3><blockquote><p>“그러면 율법이 하나님의 약속들과 반대되는 것이냐 결코 그럴 수 없느니라 <strong>만일 능히 살게 하는 율법을 주셨더라면 의가 반드시 율법으로 말미암았으리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gal/3/#L21">갈 3:21</a>)</p></blockquote><h3>율법의 문자를 이루는 것은 구원하지 못합니다</h3><blockquote><p>“내가 너희에게 이르노니 <strong>너희 의가 서기관과 바리새인보다 더 낫지 못하면 결코 천국에 들어가지 못하리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/5/#L20">마 5:20</a>)</p></blockquote><blockquote><p>“<strong>내가</strong> 사람의 방언과 천사의 말을 할지라도 <strong>사랑이 없으면 소리 나는 구리와 울리는 꽹과리가 되고</strong> 내가 예언하는 능력이 있어 모든 비밀과 모든 지식을 알고 또 산을 옮길 만한 모든 믿음이 있을지라도 사랑이 없으면 내가 아무 것도 아니요 <strong>내가 내게 있는 모든 것으로 구제하고 또 내 몸을 불사르게 내줄지라도 사랑이 없으면 내게 아무 유익이 없느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/13/#L1-3">고전 13:1-3</a>)</p></blockquote><h3>율법을 어기면 정죄를 받습니다</h3><blockquote><p>“무릇 율법 없이 범죄한 자는 또한 율법 없이 망하고 무릇 <strong>율법이 있고 범죄한 자는 율법으로 말미암아 심판을 받으리라</strong> 하나님 앞에서는 율법을 듣는 자가 의인이 아니요 오직 율법을 행하는 자라야 의롭다 하심을 얻으리니” (<a href="https://bibleox.com/ko/ko-nkrv/rim/2/#L12-13">롬 2:12-13</a>)</p></blockquote><h3>율법을 다 행하지 않는 자는 저주 아래에 있습니다</h3><blockquote><p>“무릇 율법 행위에 속한 자들은 저주 아래에 있나니 기록된 바 <strong><mark>누구든지 율법 책에 기록된 대로 모든 일을 항상 행하지 아니하는 자는 저주 아래에 있는 자라</mark></strong> 하였음이라 또 하나님 앞에서 아무도 율법으로 말미암아 의롭게 되지 못할 것이 분명하니 이는 의인은 믿음으로 살리라 하였음이라 율법은 믿음에서 난 것이 아니니 율법을 행하는 자는 그 가운데서 살리라 하였느니라” (<a href="https://bibleox.com/ko/ko-nkrv/gal/3/#L10-12">갈 3:10-12</a>)</p></blockquote><h3>율법은 아무것도 온전하게 하지 못했습니다</h3><blockquote><p>“전에 있던 계명은 <strong><mark>연약하고 무익하므로 폐하고</mark></strong> (<strong><mark>율법은 아무 것도 온전하게 못할지라</mark></strong>) 이에 더 좋은 소망이 생기니 이것으로 우리가 하나님께 가까이 가느니라” (<a href="https://bibleox.com/ko/ko-nkrv/evr/7/#L18-19">히 7:18-19</a>)</p></blockquote><h2>그렇다면 모세 율법은 왜 필요한가?</h2><h3>율법은 죄를 깨닫게 합니다</h3><blockquote><p>“그러므로 율법의 행위로 그의 앞에 의롭다 하심을 얻을 육체가 없나니 <strong><mark>율법으로는 죄를 깨달음이니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/rim/3/#L20">롬 3:20</a>)</p></blockquote><blockquote><p>“<strong><mark>율법이 들어온 것은 범죄를 더하게 하려 함이라</mark></strong> 그러나 죄가 더한 곳에 은혜가 더욱 넘쳤나니” (<a href="https://bibleox.com/ko/ko-nkrv/rim/5/#L20">롬 5:20</a>)</p></blockquote><h3>율법은 죄인을 억제합니다(죄인에게 필요합니다)</h3><blockquote><p>“알 것은 이것이니 <strong>율법은 옳은 사람을 위하여 세운 것이 아니요</strong> <strong><mark>오직 불법한 자와</mark></strong> 복종하지 아니하는 자와 경건하지 아니한 자와 죄인과 거룩하지 아니한 자와 망령된 자와 아버지를 죽이는 자와 어머니를 죽이는 자와 살인하는 자며” (<a href="https://bibleox.com/ko/ko-nkrv/1tim/1/#L9">딤전 1:9</a>)</p></blockquote><h3>율법은 구세주가 필요함(구세주를 기다림)을 보게 합니다</h3><blockquote><p>“내 속사람으로는 하나님의 법을 즐거워하되 내 지체 속에서 한 다른 법이 내 마음의 법과 싸워 내 지체 속에 있는 죄의 법으로 나를 사로잡는 것을 보는도다 <strong><mark>오호라 나는 곤고한 사람이로다 이 사망의 몸에서 누가 나를 건져내랴</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/rim/7/#L22-24">롬 7:22-24</a>)</p></blockquote><h2>율법은 영원하지 않습니다</h2><h3>율법은 다 이루어질 때까지 있습니다</h3><blockquote><p>“진실로 너희에게 이르노니 천지가 없어지기 전에는 율법의 일점 일획도 결코 없어지지 아니하고 <strong><mark>다 이루리라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/5/#L18">마 5:18</a>)</p></blockquote><h3>그리스도께서는 율법을 이루심으로 율법을 폐하셨습니다</h3><blockquote><p>“내가 율법이나 선지자를 폐하러 온 줄로 생각하지 말라 <strong><mark>폐하러 온 것이 아니요 완전하게 하려 함이라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/5/#L17">마 5:17</a>)</p></blockquote><h2>그리스도께서 율법의 시대를 끝내십니다</h2><h3>모세와 같은 선지자가 오리라는 예언</h3><p>모세 율법이 세워지자마자, 장차 모세와 같은 선지자, 곧 <strong>입법자</strong>가 오리니 그의 말을 들어야 한다는 말씀이 나옵니다. 이것은 그리스도에 대한 말씀이었습니다:</p><blockquote><p>“네 하나님 여호와께서 너희 가운데 네 형제 중에서 너를 위하여 <strong><mark>나와 같은 선지자 하나를</mark></strong> 일으키시리니 <strong><mark>너희는 그의 말을 들을지니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/vtor/18/#L15">신 18:15</a>)</p></blockquote><blockquote><p>“모세가 말하되 주 하나님이 너희를 위하여 너희 형제 가운데서 <strong><mark>나 같은 선지자 하나를 세울 것이니 너희가 무엇이든지 그의 모든 말을 들을 것이라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/act/3/#L22">행 3:22</a>)</p></blockquote><blockquote><p>“이스라엘 자손에 대하여 <strong><mark>하나님이 너희 형제 가운데서 나와 같은 선지자를 세우리라</mark></strong> 하던 자가 곧 이 모세라” (<a href="https://bibleox.com/ko/ko-nkrv/act/7/#L37">행 7:37</a>)</p></blockquote><p>하느님께서도 친히 같은 말씀으로 이것을 확인하십니다:</p><blockquote><p>“마침 구름이 와서 그들을 덮으며 구름 속에서 소리가 나되 이는 내 사랑하는 아들이니 <strong><mark>너희는 그의 말을 들으라</mark></strong> 하는지라” (<a href="https://bibleox.com/ko/ko-nkrv/mk/9/#L7">막 9:7</a>; <a href="https://bibleox.com/ko/ko-nkrv/mf/17/#L5">마 17:5</a>; <a href="https://bibleox.com/ko/ko-nkrv/lk/9/#L35">눅 9:35</a>)</p></blockquote><h3>그리스도께서는 율법을 “너희” 율법이라고 부르십니다</h3><blockquote><p>“<strong><mark>너희 율법에도</mark></strong> 두 사람의 증언이 참되다 기록되었으니” (<a href="https://bibleox.com/ko/ko-nkrv/in/8/#L17">요 8:17</a>)</p></blockquote><blockquote><p>“예수께서 이르시되 <strong><mark>너희 율법에</mark></strong> 기록된 바 내가 너희를 신이라 하였노라 하지 아니하였느냐” (<a href="https://bibleox.com/ko/ko-nkrv/in/10/#L34">요 10:34</a>)</p></blockquote><h3>율법은 세례 요한 때까지였습니다</h3><blockquote><p>“세례 요한의 때부터 지금까지 천국은 침노를 당하나니 침노하는 자는 빼앗느니라 <strong><mark>모든 선지자와 율법이 예언한 것은 요한까지니</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/11/#L12-13">마 11:12-13</a>)</p></blockquote><h3>율법은 그 자손이 오실 때까지 주어졌습니다</h3><blockquote><p>“그런즉 <strong>율법은</strong> 무엇이냐 <strong><mark>범법하므로 더하여진 것이라</mark></strong> 천사들을 통하여 한 중보자의 손으로 베푸신 것인데 <strong><mark>약속하신 자손이 오시기까지 있을 것이라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gal/3/#L19">갈 3:19</a>)</p></blockquote><h3>계명의 율법이 폐지되었습니다</h3><blockquote><p>“그는 우리의 화평이신지라 둘로 하나를 만드사 원수 된 것 곧 중간에 막힌 담을 자기 육체로 허시고 <strong><mark>법조문으로 된 계명의 율법을 폐하셨으니</mark></strong> 이는 이 둘로 자기 안에서 한 새 사람을 지어 화평하게 하시고 또 십자가로 이 둘을 한 몸으로 하나님과 화목하게 하려 하심이라 원수 된 것을 십자가로 소멸하시고” (<a href="https://bibleox.com/ko/ko-nkrv/ef/2/#L14-16">엡 2:14-16</a>) <em>(러시아어 시노달 번역: “계명의 율법을 <strong>가르침으로</strong> 폐하셨으니”(ἐν δόγμασιν).)</em></p></blockquote><h3>이제 율법에 대한 다툼은 쓸데없습니다</h3><blockquote><p>“그러나 어리석은 변론과 족보 이야기와 <strong>분쟁과 율법에 대한 다툼은 피하라 이것은 무익한 것이요 헛된 것이니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/tit/3/#L9">딛 3:9</a>)</p></blockquote><h3>종의 멍에 — 모세 율법</h3><blockquote><p>“그리스도께서 우리를 자유롭게 하려고 자유를 주셨으니 그러므로 굳건하게 서서 <strong><mark>다시는 종의 멍에를 메지 말라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gal/5/#L1">갈 5:1</a>)</p></blockquote><h3>그리스도의 멍에는 다릅니다 — 가볍습니다</h3><blockquote><p>“수고하고 무거운 짐 진 자들아 다 내게로 오라 내가 너희를 쉬게 하리라 나는 마음이 온유하고 겸손하니 <strong><mark>나의 멍에를 메고 내게 배우라</mark></strong> 그리하면 너희 마음이 쉼을 얻으리니 이는 <strong><mark>내 멍에는 쉽고 내 짐은 가벼움이라</mark></strong> 하시니라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/11/#L28-30">마 11:28-30</a>)</p></blockquote><h3>새 율법, 그리스도의 율법은 사랑입니다</h3><blockquote><p>“사랑은 이웃에게 악을 행하지 아니하나니 그러므로 <strong><mark>사랑은 율법의 완성이니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/rim/13/#L10">롬 13:10</a>)</p></blockquote><blockquote><p>“<strong><mark>온 율법은 네 이웃 사랑하기를 네 자신 같이 하라 하신 한 말씀에서 이루어졌나니</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gal/5/#L14">갈 5:14</a>)</p></blockquote><h3>율법에 대한 긴 논의 뒤에 — 믿음과 사랑</h3><blockquote><p>“무엇이든지 구하는 바를 그에게서 받나니 이는 우리가 그의 계명을 지키고 그 앞에서 기뻐하시는 것을 행함이라 <strong><mark>그의 계명은 이것이니 곧 그 아들 예수 그리스도의 이름을 믿고</mark></strong> <strong><mark>그가 우리에게 주신 계명대로 서로 사랑할 것이니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1in/3/#L22-23">요일 3:22-23</a>)</p></blockquote><blockquote><p>“너희가 짐을 서로 지라 그리하여 <strong><mark>그리스도의 법을 성취하라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gal/6/#L2">갈 6:2</a>)</p></blockquote><blockquote><p>“내가 할례를 받는 각 사람에게 다시 증언하노니 그는 율법 전체를 행할 의무를 가진 자라 <strong><mark>율법 안에서 의롭다 함을 얻으려 하는 너희는 그리스도에게서 끊어지고 은혜에서 떨어진 자로다 우리가 성령으로 믿음을 따라 의의 소망을 기다리노니</mark></strong> 그리스도 예수 안에서는 할례나 무할례나 효력이 없으되 <strong><mark>사랑으로써 역사하는 믿음뿐이니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gal/5/#L3-6">갈 5:3-6</a>)</p></blockquote><blockquote><p>“형제들아 <strong><mark>너희가 자유를 위하여 부르심을 입었으나</mark></strong> 그러나 그 자유로 육체의 기회를 삼지 말고 <strong><mark>오직 사랑으로 서로 종 노릇 하라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gal/5/#L13">갈 5:13</a>)</p></blockquote><h3>죽음은 모세 율법을 어긴 데서가 아니라 믿음이 없는 데서 옵니다</h3><blockquote><p>“<strong>아들이 있는 자에게는 생명이 있고 하나님의 아들이 없는 자에게는 생명이 없느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1in/5/#L12">요일 5:12</a>)</p></blockquote><h3>구원은 모세 율법의 행위와 상관없이 왔습니다</h3><blockquote><p>“<strong><mark>이제는 율법 외에 하나님의 한 의가 나타났으니</mark></strong> 율법과 선지자들에게 증거를 받은 것이라 곧 예수 그리스도를 믿음으로 말미암아 모든 믿는 자에게 미치는 하나님의 의니 차별이 없느니라” (<a href="https://bibleox.com/ko/ko-nkrv/rim/3/#L21-22">롬 3:21-22</a>)</p></blockquote><blockquote><p>“<strong><mark>그러므로 이제 그리스도 예수 안에 있는 자에게는 결코 정죄함이 없나니</mark></strong> 이는 <strong><mark>그리스도 예수 안에 있는 생명의 성령의 법이 죄와 사망의 법에서 너를 해방하였음이라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/rim/8/#L1-2">롬 8:1-2</a>) <em>(비잔틴 본문(다수 사본)에는 1절 끝에 “<strong>육신을 따르지 않고 영을 따라 행하는</strong>”이 있습니다.)</em></p></blockquote><h3>율법에 따른 삶은 육체에 따른 삶입니다</h3><blockquote><p>“내가 너희에게서 다만 이것을 알려 하노니 <strong><mark>너희가 성령을 받은 것이 율법의 행위로냐</mark></strong> 혹은 듣고 믿음으로냐 너희가 이같이 어리석으냐 <strong><mark>성령으로 시작하였다가 이제는 육체로 마치겠느냐</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gal/3/#L2-3">갈 3:2-3</a>)</p></blockquote><h3>성령에 따른 삶은 율법에 따른 삶보다 높습니다</h3><blockquote><p>“내가 이르노니 너희는 <strong>성령을 따라 행하라</strong> 그리하면 육체의 욕심을 이루지 아니하리라 &lt;…&gt; <strong><mark>너희가 만일 성령의 인도하시는 바가 되면 율법 아래에 있지 아니하리라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gal/5/#L16,18">갈 5:16,18</a>)</p></blockquote><blockquote><p>“오직 성령의 열매는 사랑과 희락과 화평과 오래 참음과 자비와 양선과 충성과 온유와 절제니 <strong><mark>이같은 것을 금지할 법이 없느니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gal/5/#L22-23">갈 5:22-23</a>)</p></blockquote>'
  meta_desc: 모세 율법의 폐지에 관한 성경 구절
