- src: прикосновение-к-мертвецу
  path: Td4d_시체를_만지는_일
  title: 시체를 만지는 일
  copy_cover: true
  body: '<h2>구약에서 시체를 만지지 말라는 금지</h2><p>시체를 만지면 사람은 부정해졌습니다(더럽혀졌습니다). 그러나 친족은 죽은 자기 살붙이를 만져도 더럽혀지지 않았습니다:</p><blockquote><p>“여호와께서 모세에게 이르시되 아론의 자손 제사장들에게 말하여 이르라 그의 백성 중에서 <strong>죽은 자를 만짐으로 말미암아 스스로를 더럽히지 말려니와</strong> <strong>그의 살붙이인</strong> 그의 어머니나 그의 아버지나 그의 아들이나 그의 딸이나 그의 형제나 출가하지 아니한 처녀인 그의 자매로 말미암아서는 몸을 더럽힐 수 있느니라 제사장은 그의 백성의 어른인즉 자신을 더럽혀 속되게 하지 말지니라” (<a href="https://bibleox.com/ko/ko-nkrv/lev/21/#L1-4">레 21:1-4</a>)</p></blockquote><blockquote><p>“그 때에 <strong>사람의 시체로 말미암아 부정하게 되어서</strong> 유월절을 지킬 수 없는 사람들이 있었는데 그들이 그 날에 모세와 아론 앞에 이르러” (<a href="https://bibleox.com/ko/ko-nkrv/chis/9/#L6">민 9:6</a>)</p></blockquote><blockquote><p>“누구든지 <strong>죽은 사람의 시체를 만지고 자신을 정결하게 하지 아니하는 자는</strong> 여호와의 성막을 더럽힘이라 그가 이스라엘에서 끊어질 것은 정결하게 하는 물을 그에게 뿌리지 아니하므로 깨끗하게 되지 못하고 그 부정함이 그대로 있음이니라” (<a href="https://bibleox.com/ko/ko-nkrv/chis/19/#L13">민 19:13</a>)</p></blockquote><blockquote><p>“<strong>시체를 가까이 하여 스스로 더럽히지 못할 것이로되</strong> 부모나 자녀나 형제나 시집 가지 아니한 자매를 위하여는 더럽힐 수 있으며” (<a href="https://bibleox.com/ko/ko-nkrv/iez/44/#L25">겔 44:25</a>)</p></blockquote><blockquote><p>“학개가 이르되 <strong>시체를 만져서 부정하여진 자가</strong> 만일 그것들 가운데 하나를 만지면 그것이 부정하겠느냐 하니 제사장들이 대답하여 이르되 <strong>부정하리라</strong> 하더라” (<a href="https://bibleox.com/ko/ko-nkrv/ag/2/#L13">학 2:13</a>)</p></blockquote><h2>의인의 유해를 만지는 일</h2><p>구약 시대에 죽은 사람이 선지자 엘리사의 유해에 닿아 살아났습니다:</p><blockquote><p>“마침 사람을 장사하는 자들이 그 도적 떼를 보고 그의 시체를 엘리사의 묘실에 들이던지매 <strong>시체가 엘리사의 뼈에 닿자 곧 회생하여 일어섰더라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/4ts/13/#L21">왕하 13:21</a>)</p></blockquote><h2>유대교 규례의 폐지</h2><blockquote><p>“성령과 우리는 <strong>이 요긴한 것들 외에는 아무 짐도 너희에게 지우지 아니하는 것이 옳은 줄 알았노니</strong> 우상의 제물과 피와 목매어 죽인 것과 음행을 멀리할지니라 이에 스스로 삼가면 잘되리라 평안함을 원하노라 하였더라” (<a href="https://bibleox.com/ko/ko-nkrv/act/15/#L28-29">행 15:28-29</a>)</p></blockquote><blockquote><p>“<strong>주를 믿는 이방인에게는 우리가 우상의 제물과 피와 목매어 죽인 것과 음행을 피할 것을 결의하고 편지하였느니라</strong> 하니” (<a href="https://bibleox.com/ko/ko-nkrv/act/21/#L25">행 21:25</a>)</p></blockquote><p>자세히: <a href="https://bibleox.com/ru/ru/w/Библия-Закон-Моисея-отмена">유대교 규례의 폐지</a></p><h2>신약에서 시체를 만지는 일</h2><p>주 예수 그리스도께서는 야이로의 죽은 딸을 만지셨습니다:</p><blockquote><p>“<strong>그 아이의 손을 잡고 이르시되</strong> 달리다굼 하시니 번역하면 곧 내가 네게 말하노니 소녀야 일어나라 하심이라” (<a href="https://bibleox.com/ko/ko-nkrv/mk/5/#L41">막 5:41</a>)</p></blockquote><p>율법에 따르면 그리스도께서 십자가에서 돌아가셨을 때 이미 죽은 분으로서 아무도 그분을 만질 수 없었습니다. 친족인 하느님의 어머니만 그렇게 할 수 있었습니다(<a href="https://bibleox.com/ko/ko-nkrv/lev/21/#L1-4">레 21:1-4</a>). 그러나 우리는 신학자 요한과 니고데모와 아리마대 요셉을 정죄하지 않을 뿐 아니라, 아무것도 두려워하지 않고 우리 구세주를 섬긴 그들을 칭송합니다:</p><blockquote><p>“<strong>요셉이</strong> 시체를 가져다가 깨끗한 세마포로 싸서 바위 속에 판 자기 새 무덤에 넣어 두고 큰 돌을 굴려 무덤 문에 놓고 가니” (<a href="https://bibleox.com/ko/ko-nkrv/mf/27/#L59-60">마 27:59-60</a>)</p></blockquote><blockquote><p>“<strong>요한의 제자들이</strong> 듣고 와서 시체를 가져다가 장사하니라” (<a href="https://bibleox.com/ko/ko-nkrv/mk/6/#L29">막 6:29</a>)</p></blockquote><blockquote><p>“백부장에게 알아 본 후에 요셉에게 시체를 내주는지라 <strong>요셉이</strong> 세마포를 사서 예수를 내려다가 그것으로 싸서 바위 속에 판 무덤에 넣어 두고 돌을 굴려 무덤 문에 놓으매” (<a href="https://bibleox.com/ko/ko-nkrv/mk/15/#L45-46">막 15:45-46</a>)</p></blockquote><blockquote><p>“성경에 그를 가리켜 기록한 말씀을 다 응하게 한 것이라 후에 <strong>나무에서 내려다가 무덤에 두었으나</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/act/13/#L29">행 13:29</a>)</p></blockquote><p>사도는 죽은 청년을 만집니다:</p><blockquote><p>“유두고라 하는 청년이 창에 걸터 앉아 있다가 깊이 졸더니 바울이 강론하기를 더 오래 하매 졸음을 이기지 못하여 삼 층에서 떨어지거늘 일으켜보니 <strong>죽었는지라</strong> 바울이 내려가서 <strong>그 위에 엎드려 그 몸을 안고</strong> 말하되 떠들지 말라 생명이 그에게 있다 하고” (<a href="https://bibleox.com/ko/ko-nkrv/act/20/#L9-10">행 20:9-10</a>)</p></blockquote>'
