  path: Wn20e_포도주
  title: 포도주
  copy_cover: true
  body: <h2>주 예수 그리스도께서는 포도주를 드셨습니다</h2><blockquote><p>“<strong>인자는 와서 먹고 마시매</strong> 말하기를 보라 먹기를 탐하고 <strong>포도주를 즐기는 사람이요</strong> 세리와 죄인의 친구로다 하니 지혜는 그 행한 일로 인하여 옳다 함을 얻느니라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/11/#L19">마 11:19</a>)</p></blockquote><blockquote><p>“진실로 너희에게 이르노니 <strong>내가 포도나무에서 난 것을</strong> 하나님 나라에서 새 것으로 마시는 날까지 <strong>다시 마시지 아니하리라</strong> 하시니라” (<a href="https://bibleox.com/ko/ko-nkrv/mk/14/#L25">막 14:25</a>)</p></blockquote><h2>주님께서는 갈릴리 가나의 혼인 잔치에서 물로 포도주를 만드셨습니다</h2><blockquote><p>“연회장은 <strong>물로 된 포도주를 맛보고도</strong> 어디서 났는지 알지 못하되 물 떠온 하인들은 알더라 연회장이 신랑을 불러” (<a href="https://bibleox.com/ko/ko-nkrv/in/2/#L9">요 2:9</a>)</p></blockquote><h2>디모데는 병 때문에 포도주를 조금 마시라는 권고를 받았습니다</h2><blockquote><p>“이제부터는 물만 마시지 말고 네 위장과 자주 나는 병을 위하여는 <strong>포도주를 조금씩 쓰라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1tim/5/#L23">딤전 5:23</a>)</p></blockquote><h2>덧붙임</h2><p>음식을 먹는 것이 죄가 아니라 폭식과 탐식이 죄입니다. 포도주를 마시는 것이 죄가 아니라 술 취함이 죄입니다.</p>
