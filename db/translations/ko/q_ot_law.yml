  path: Cs1o_구약의_사형에_해당하는_죄
  title: 구약에서 사형에 해당하는 죄
  copy_cover: true
  body: '<p>구약에서 사형으로 벌해야 했던 행위:</p><ul><li><p>다른 신들을 섬기도록 꾀는 것: <a href="https://bibleox.com/ko/ko-nkrv/vtor/13/#L6-10">신 13:6-10</a></p></li><li><p>다른 신에게 제사를 드리는 것: <a href="https://bibleox.com/ko/ko-nkrv/ish/22/#L20">출 22:20</a></p></li><li><p>자식을 우상에게 제물로 바치는 것: <a href="https://bibleox.com/ko/ko-nkrv/lev/20/#L2">레 20:2</a></p></li><li><p>신성 모독: <a href="https://bibleox.com/ko/ko-nkrv/lev/24/#L16">레 24:16</a></p></li><li><p>주술: <a href="https://bibleox.com/ko/ko-nkrv/lev/20/#L27">레 20:27</a>; <a href="https://bibleox.com/ko/ko-nkrv/ish/22/#L18">출 22:18</a></p></li><li><p>거짓 예언과 백성을 하느님에게서 돌아서게 하는 것: <a href="https://bibleox.com/ko/ko-nkrv/vtor/13/#L5">신 13:5</a>; <a href="https://bibleox.com/ko/ko-nkrv/vtor/18/#L20">신 18:20</a></p></li><li><p>안식일을 범하는 것: <a href="https://bibleox.com/ko/ko-nkrv/ish/31/#L14-15">출 31:14-15</a>; <a href="https://bibleox.com/ko/ko-nkrv/ish/35/#L2">출 35:2</a></p></li><li><p>살인: <a href="https://bibleox.com/ko/ko-nkrv/ish/21/#L12">출 21:12</a>; <a href="https://bibleox.com/ko/ko-nkrv/lev/24/#L17">레 24:17</a>; <a href="https://bibleox.com/ko/ko-nkrv/lev/24/#L21">레 24:21</a>; <a href="https://bibleox.com/ko/ko-nkrv/chis/35/#L16">민 35:16</a>; <a href="https://bibleox.com/ko/ko-nkrv/chis/35/#L17">민 35:17</a>; <a href="https://bibleox.com/ko/ko-nkrv/chis/35/#L18">민 35:18</a>; <a href="https://bibleox.com/ko/ko-nkrv/chis/35/#L21">민 35:21</a>; <a href="https://bibleox.com/ko/ko-nkrv/chis/35/#L31">민 35:31</a></p></li><li><p>아버지나 어머니를 저주하는 것: <a href="https://bibleox.com/ko/ko-nkrv/ish/21/#L17">출 21:17</a>; <a href="https://bibleox.com/ko/ko-nkrv/lev/20/#L9">레 20:9</a></p></li><li><p>아버지나 어머니를 치는 것: <a href="https://bibleox.com/ko/ko-nkrv/ish/21/#L15">출 21:15</a></p></li><li><p>사람을 납치하거나 종으로 파는 것: <a href="https://bibleox.com/ko/ko-nkrv/ish/21/#L16">출 21:16</a>; <a href="https://bibleox.com/ko/ko-nkrv/vtor/24/#L7">신 24:7</a></p></li><li><p>사람을 받아 죽인 소를 지키지 않은 것: <a href="https://bibleox.com/ko/ko-nkrv/ish/21/#L29">출 21:29</a></p></li><li><p>강간: <a href="https://bibleox.com/ko/ko-nkrv/vtor/22/#L25">신 22:25</a></p></li><li><p>간음(간음한 두 사람 모두 죽임): <a href="https://bibleox.com/ko/ko-nkrv/lev/20/#L10">레 20:10</a>; <a href="https://bibleox.com/ko/ko-nkrv/lev/20/#L11">레 20:11</a>; <a href="https://bibleox.com/ko/ko-nkrv/lev/20/#L12">레 20:12</a>; <a href="https://bibleox.com/ko/ko-nkrv/vtor/22/#L22">신 22:22</a>; <a href="https://bibleox.com/ko/ko-nkrv/vtor/22/#L25">신 22:25</a></p></li><li><p>친족 사이의 성관계: <a href="https://bibleox.com/ko/ko-nkrv/lev/20/#L11-21">레 20:11-21</a></p></li><li><p>제사장 딸의 음행 — 딸을 불사름: <a href="https://bibleox.com/ko/ko-nkrv/lev/21/#L9">레 21:9</a></p></li><li><p>남색: <a href="https://bibleox.com/ko/ko-nkrv/lev/20/#L13">레 20:13</a>; <a href="https://bibleox.com/ko/ko-nkrv/lev/20/#L15">레 20:15</a>; <a href="https://bibleox.com/ko/ko-nkrv/lev/20/#L16">레 20:16</a></p></li><li><p>짐승과의 교합: <a href="https://bibleox.com/ko/ko-nkrv/ish/22/#L19">출 22:19</a></p></li><li><p>제사장과 재판장에게 복종하지 않는 것: <a href="https://bibleox.com/ko/ko-nkrv/vtor/17/#L8-12">신 17:8-12</a></p></li><li><p>(제사장이 아닌) 일반인이 성막에 들어가는 것: <a href="https://bibleox.com/ko/ko-nkrv/chis/3/#L10">민 3:10</a>; <a href="https://bibleox.com/ko/ko-nkrv/chis/3/#L38">민 3:38</a>; <a href="https://bibleox.com/ko/ko-nkrv/chis/18/#L7">민 18:7</a></p></li><li><p>외인이 제사장 직무를 맡는 것: <a href="https://bibleox.com/ko/ko-nkrv/chis/3/#L10">민 3:10</a></p></li><li><p>(레위인이 아닌) 일반인이 성막을 운반하는 것: <a href="https://bibleox.com/ko/ko-nkrv/chis/1/#L51">민 1:51</a></p></li><li><p>(경계를 넘어) 산에 오르는 것: <a href="https://bibleox.com/ko/ko-nkrv/ish/19/#L12">출 19:12</a></p></li></ul><p>그 밖에:</p><ul><li><p>이스라엘 사람들을 브올의 우상 섬김으로 꾀어낸 미디안의 아이들과 여인들을 죽이라는 명령: <a href="https://bibleox.com/ko/ko-nkrv/chis/31/#L15-17">민 31:15-17</a></p></li><li><p>아말렉 백성을 남자와 여자, 아이와 젖먹이까지 죽이라는 명령: <a href="https://bibleox.com/ko/ko-nkrv/1ts/15/#L3">삼상 15:3</a></p></li></ul>'
