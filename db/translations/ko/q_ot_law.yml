  body: <h2>누룩 — 모든 것에 영향을 주는 작은 것</h2><p>신약 성경에서 누룩의 형상은 그 자체로 나쁘거나 좋은 것이 아니라, 작은 부분이 나머지 전체에 어떻게 영향을 주는지 보여 주는 데 쓰입니다. 가루에는 누룩을 조금 넣지만, 결국 온 덩어리를 부풀게 합니다.</p><p>주님께서는 누룩 말고도 소금의 형상을 자주 드시는데, 소금도 마찬가지로 다른 모든 것에 영향을 줍니다(썩지 않게 지켜 줍니다):</p><blockquote><p>“<strong>너희는 세상의 소금이니</strong> 소금이 만일 그 맛을 잃으면 무엇으로 짜게 하리요 후에는 아무 쓸 데 없어 다만 밖에 버려져 사람에게 밟힐 뿐이니라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/5/#L13">마 5:13</a>)</p></blockquote><blockquote><p>“소금은 좋은 것이로되 만일 소금이 그 맛을 잃으면 무엇으로 이를 짜게 하리요 <strong>너희 속에 소금을 두고</strong> 서로 화목하라 하시니라” (<a href="https://bibleox.com/ko/ko-nkrv/mk/9/#L50">막 9:50</a>)</p></blockquote><p>그런데 소금도 누룩처럼 구약의 제사에 쓰였습니다:</p><blockquote><p>“<strong>네 모든 소제물에 소금을 치라</strong> 네 하나님의 언약의 소금을 네 소제에 빼지 못할지니 <strong>네 모든 예물에 소금을 드릴지니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/lev/2/#L13">레 2:13</a>)</p></blockquote><h2>누룩의 좋은 의미</h2><h3>누룩 — 하늘 나라</h3><p>주 예수 그리스도께서는 누룩을 하늘 나라에 비유하십니다. 여기서도 작은 것이 모든 것에 영향을 줍니다:</p><blockquote><p>“또 비유로 말씀하시되 <strong><mark>천국은 마치 여자가 가루 서 말 속에 갖다 넣어 전부 부풀게 한 누룩과 같으니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/13/#L33">마 13:33</a>)</p></blockquote><blockquote><p>“또 이르시되 <strong><mark>내가 하나님의 나라를 무엇으로 비교할까</mark></strong> 마치 여자가 가루 서 말 속에 갖다 넣어 전부 부풀게 한 <strong><mark>누룩과 같으니라</mark></strong> 하셨더라” (<a href="https://bibleox.com/ko/ko-nkrv/lk/13/#L20-21">눅 13:20-21</a>)</p></blockquote><h2>누룩의 나쁜 의미</h2><h3>누룩 — 이단의 가르침</h3><p>주 예수 그리스도께서는 사도들에게 바리새인과 사두개인의 가르침이 해롭다는 것을 가리키십니다. 작은 것이 모든 것에 영향을 줄 수 있음을 보여 주시려고 누룩의 형상을 쓰십니다:</p><blockquote><p>“예수께서 이르시되 삼가 <strong><mark>바리새인과 사두개인들의 누룩을 주의하라</mark></strong> 하시니 &lt;…&gt; 어찌 내 말한 것이 떡에 관함이 아닌 줄을 깨닫지 못하느냐 오직 바리새인과 사두개인들의 누룩을 주의하라 하시니 그제서야 제자들이 떡의 누룩이 아니요 <strong><mark>바리새인과 사두개인들의 교훈을 삼가라고</mark></strong> 말씀하신 줄을 깨달으니라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/16/#L6,11-12">마 16:6,11-12</a>)</p></blockquote><h3>누룩 — 외식</h3><p>다른 때에 그리스도께서는 수많은 사람 앞에서 다시 누룩의 형상으로 바리새인들의 특징인 외식이 해롭다는 것을 가리키십니다. 여기서도 외식은 모든 것에 영향을 주는 작은 것입니다:</p><blockquote><p>“그 동안에 무리 수만 명이 모여 서로 밟힐 만큼 되었더니 예수께서 먼저 제자들에게 말씀하여 이르시되 <strong><mark>바리새인들의 누룩 곧 외식을 주의하라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/lk/12/#L1">눅 12:1</a>)</p></blockquote><h3>누룩 — 공동체 안의 회개하지 않는 음행자</h3><p>사도 바울은 고린도 공동체에 회개하지 않는 음행자가 있다는 것을 나무라면서 누룩의 형상을 씁니다. 음행자는 공동체의 작은 부분이지만 공동체 전체에 영향을 줄 수 있습니다:</p><blockquote><p>“너희 중에 심지어 음행이 있다 함을 들으니 그런 음행은 이방인 중에서도 없는 것이라 누가 그 아버지의 아내를 취하였다 하는도다 &lt;…&gt; 너희가 자랑하는 것이 옳지 아니하도다 <strong><mark>적은 누룩이 온 덩어리에 퍼지는 것을</mark></strong> 알지 못하느냐 너희는 누룩 없는 자인데 <strong>새 덩어리가 되기 위하여 묵은 누룩을 내버리라</strong> 우리의 유월절 양 곧 그리스도께서 희생되셨느니라 이러므로 우리가 명절을 지키되 묵은 누룩으로도 말고 <strong><mark>악하고 악의에 찬 누룩으로도</mark></strong> 말고 누룩이 없이 오직 순전함과 진실함의 떡으로 하자” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/5/#L1,6-8">고전 5:1,6-8</a>)</p></blockquote><p>사도는 누룩 일반이 아니라 악하고 악의에 찬 누룩을 없애라고, 곧 회개하지 않는 음행자를 공동체에서 내쫓으라고 합니다(<a href="https://bibleox.com/ko/ko-nkrv/1kor/5/#L9,11">고전 5:9,11</a>). 여기서 사도는 빵에 대해 말하는 것이 아니라 구약의 의미를 풀어 줍니다:</p><blockquote><p>“너희는 누룩 없는 자인데 <strong><mark>새 덩어리가 되기 위하여</mark></strong> 묵은 누룩을 내버리라 우리의 유월절 양 곧 그리스도께서 희생되셨느니라 이러므로 우리가 명절을 지키되 묵은 누룩으로도 말고 악하고 악의에 찬 누룩으로도 말고 누룩이 없이 오직 순전함과 진실함의 떡으로 하자” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/5/#L7-8">고전 5:7-8</a>)</p></blockquote><blockquote><p>“어찌 내 말한 것이 떡에 관함이 아닌 줄을 깨닫지 못하느냐 오직 바리새인과 사두개인들의 누룩을 주의하라 하시니” (<a href="https://bibleox.com/ko/ko-nkrv/mf/16/#L11">마 16:11</a>)</p></blockquote><h3>누룩 — 공동체를 유대교로 끌어들이는 사람</h3><p>사도 바울은 갈라디아 공동체에, 구원받으려면 모세 율법을 지켜야 한다고 가르치는 어떤 사람들이 그들 가운데 있는 것이 위험하다고 경고하며 누룩의 형상을 씁니다:</p><blockquote><p>“율법 안에서 의롭다 함을 얻으려 하는 너희는 그리스도에게서 끊어지고 은혜에서 떨어진 자로다 우리가 성령으로 믿음을 따라 의의 소망을 기다리노니 &lt;…&gt; <strong><mark>적은 누룩이 온 덩이에 퍼지느니라</mark></strong> 나는 너희가 아무 다른 마음을 품지 아니할 줄을 주 안에서 확신하노라 그러나 <strong><mark>너희를 요동하게 하는 자는</mark></strong> 누구든지 심판을 받으리라 &lt;…&gt; <strong>너희를 어지럽게 하는 자들은 스스로 베어 버리기를 원하노라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gal/5/#L4-5,9-10,12">갈 5:4-5,9-10,12</a>)</p></blockquote>
