- src: суббота-и-воскресенье
  path: Ss26d_안식일과_주일
  title: 안식일과 주일
  copy_cover: true
  body: '<h2>안식일</h2><h3>하느님께서 안식일을 거룩하게 하셨습니다</h3><p>세상을 창조하신 뒤 하느님께서는 일곱째 날(안식일)을 거룩하게 하셨지만 계명을 세우지는 않으셨습니다:</p><blockquote><p>“<strong>하나님이 그 일곱째 날을 복되게 하사</strong> <strong>거룩하게 하셨으니</strong> 이는 하나님이 그 창조하시며 만드시던 모든 일을 마치시고 <strong>그 날에 안식하셨음이니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gen/2/#L3">창 2:3</a>)</p></blockquote><p>가까이에는 하느님께서 다른 명령을 주시는 곳이 많습니다:</p><blockquote><p>“하나님이 그들에게 복을 주시며 <strong>하나님이 그들에게 이르시되</strong> 생육하고 번성하여 땅에 충만하라, 땅을 정복하라, 바다의 물고기와 하늘의 새와 땅에 움직이는 모든 생물을 다스리라 하시니라” (<a href="https://bibleox.com/ko/ko-nkrv/gen/1/#L28">창 1:28</a>)</p></blockquote><blockquote><p>“<strong>하나님이 이르시되</strong> 내가 온 지면의 씨 맺는 모든 채소와 씨 가진 열매 맺는 모든 나무를 너희에게 주노니 너희의 먹을 거리가 되리라” (<a href="https://bibleox.com/ko/ko-nkrv/gen/1/#L29">창 1:29</a>)</p></blockquote><blockquote><p>“<strong>여호와 하나님이 그 사람에게 명하여 이르시되</strong> 동산 각종 나무의 열매는 네가 임의로 먹되 선악을 알게 하는 나무의 열매는 먹지 말라 네가 먹는 날에는 반드시 죽으리라 하시니라” (<a href="https://bibleox.com/ko/ko-nkrv/gen/2/#L16-17">창 2:16-17</a>)</p></blockquote><p>그러나 안식일에 대해서는 아무 명령도 주어지지 않습니다. 창조의 모든 날이 지난 뒤 안식하신 것은 사람이 아니라 하느님이라고 말합니다. 사람은 하느님께서 에덴 동산에 두어 일하게 하셨습니다:</p><blockquote><p>“여호와 하나님이 땅에 비를 내리지 아니하셨고 땅을 갈 사람도 없었으므로 들에는 초목이 아직 없었고 밭에는 채소가 나지 아니하였으며 &lt;…&gt; 여호와 하나님이 동방의 에덴에 동산을 창설하시고 그 지으신 사람을 거기 두시니라 &lt;…&gt; 여호와 하나님이 그 사람을 이끌어 에덴 동산에 두어 그것을 <strong>경작하며 지키게 하시고</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gen/2/#L5,8,15">창 2:5,8,15</a>)</p></blockquote><p>하느님께서 머무시는 그 영원한 안식(<a href="https://bibleox.com/ko/ko-nkrv/gen/2/#L3">창 2:3</a>)에 사람은 장차 들어갈 수 있을 뿐입니다. 그것도 모두가 아니라 하느님께서 친히 들이시는 이들만 들어갑니다:</p><blockquote><p>“<strong>이미 믿는 우리들은 저 안식에 들어가는도다</strong> 그가 말씀하신 바와 같으니 내가 노하여 맹세한 바와 같이 <strong>그들이 내 안식에 들어오지 못하리라</strong> 하셨다 하였으나 세상을 창조할 때부터 그 일이 이루어졌느니라” (<a href="https://bibleox.com/ko/ko-nkrv/evr/4/#L3">히 4:3</a>; <a href="https://bibleox.com/ko/ko-nkrv/ps/95/#L11">시 95:11</a>; <a href="https://bibleox.com/ko/ko-nkrv/evr/3/#L11">히 3:11</a>)</p></blockquote><h3>안식일에 일하지 말라는 계명이 생김</h3><p>안식일의 쉼에 관한 계명은 선지자 모세 때 이스라엘 백성과 언약을 맺으면서 하느님께서 처음 세우셨습니다:</p><blockquote><p>“안식일을 기억하여 거룩하게 지키라 <strong>엿새 동안은 힘써 네 모든 일을 행할 것이나</strong> <strong>일곱째 날은</strong> 네 하나님 여호와의 안식일인즉 너나 네 아들이나 네 딸이나 네 남종이나 네 여종이나 네 가축이나 네 문안에 머무는 객이라도 <strong>아무 일도 하지 말라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ish/20/#L8-10">출 20:8-10</a>; <a href="https://bibleox.com/ko/ko-nkrv/vtor/5/#L12-15">신 5:12-15</a>; <a href="https://bibleox.com/ko/ko-nkrv/lev/19/#L3">레 19:3</a>; <a href="https://bibleox.com/ko/ko-nkrv/lev/19/#L30">레 19:30</a>)</p></blockquote><h3>안식일의 쉼에 관한 계명을 세운 이유</h3><p>계명을 세운 이유는 계명의 말씀 바로 뒤에 나옵니다. 그 이유는 이스라엘 백성이 애굽의 종살이에서 나온 것입니다.</p><blockquote><p>“일곱째 날은 네 하나님 여호와의 안식일인즉 너나 네 아들이나 네 딸이나 네 남종이나 네 여종이나 네 소나 네 나귀나 네 모든 가축이나 네 문 안에 유하는 객이라도 아무 일도 하지 못하게 하고 네 남종이나 네 여종에게 너 같이 안식하게 할지니라 너는 기억하라 <strong><mark>네가 애굽 땅에서 종이 되었더니</mark></strong> 네 하나님 여호와가 강한 손과 편 팔로 <strong><mark>거기서 너를 인도하여 내었나니 그러므로 네 하나님 여호와가 네게 명령하여 안식일을 지키라 하느니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/vtor/5/#L14-15">신 5:14-15</a>)</p></blockquote><p>그분은 그들에게 “안식일”을 주셨습니다. 곧 전에 없던 것을 주셨습니다:</p><blockquote><p>“그러므로 <strong><mark>내가 그들을 애굽 땅에서 나와서 광야에 이르게 하고</mark></strong> 사람이 준행하면 그로 말미암아 삶을 얻을 <strong>내 율례를 주며</strong> 내 규례를 알게 하였고 또 내가 그들을 거룩하게 하는 여호와인 줄 알게 하려고 <strong><mark>내 안식일을 주어</mark></strong> 그들과 나 사이에 표징을 삼았노라” (<a href="https://bibleox.com/ko/ko-nkrv/iez/20/#L10-12">겔 20:10-12</a>)</p></blockquote><blockquote><p>“<strong>우리 하나님 여호와께서 호렙 산에서 우리와 언약을 세우셨나니 이 언약은 여호와께서 우리 조상들과 세우신 것이 아니요 오늘 여기 살아 있는 우리 곧 우리와 세우신 것이라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/vtor/5/#L2-3">신 5:2-3</a>)</p></blockquote><p>하느님께서 일곱째 날을 복되게 하신 것을 가리키는 다른 설명도 있습니다:</p><blockquote><p>“일곱째 날은 네 하나님 여호와의 안식일인즉 너나 네 아들이나 네 딸이나 네 남종이나 네 여종이나 네 가축이나 네 문안에 머무는 객이라도 아무 일도 하지 말라 <strong>이는</strong> 엿새 동안에 나 여호와가 하늘과 땅과 바다와 그 가운데 모든 것을 만들고 <strong><mark>일곱째 날에 쉬었음이라 그러므로 나 여호와가 안식일을 복되게 하여</mark></strong> 그 날을 거룩하게 하였느니라” (<a href="https://bibleox.com/ko/ko-nkrv/ish/20/#L10-11">출 20:10-11</a>; <a href="https://bibleox.com/ko/ko-nkrv/gen/2/#L3">창 2:3</a>)</p></blockquote><p>그러나 이 설명은 관련을 가리키지만, 여기서 주어지는 것은 명령의 이유가 아니라 바로 안식일에 복을 주신 이유입니다: “<strong>그러므로 나 여호와가 안식일을 복되게 하여</strong>”(<a href="https://bibleox.com/ko/ko-nkrv/ish/20/#L10-11">출 20:10-11</a>). 다른 구절에서는 바로 명령의 이유가 가장 분명하게 주어집니다: “<strong>네가 애굽 땅에서 종이 되었더니 … 인도하여 내었나니 그러므로 … 명령하여</strong>”(<a href="https://bibleox.com/ko/ko-nkrv/vtor/5/#L14-15">신 5:14-15</a>).</p><p>이처럼 안식일의 쉼은 하느님의 안식과의 관련도 가리키지만, 이스라엘 백성이 애굽의 종살이에서 풀려난 것 때문에 세워졌습니다.</p><h3>계명의 율법은 폐지되었습니다</h3><p>율법은 그리스도께서 오실 때까지 주어졌습니다:</p><blockquote><p>“그런즉 <strong><mark>율법은</mark></strong> 무엇이냐 <strong><mark>범법하므로 더하여진 것이라</mark></strong> 천사들을 통하여 한 중보자의 손으로 베푸신 것인데 <strong><mark>약속하신 자손이 오시기까지 있을 것이라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gal/3/#L19">갈 3:19</a>)</p></blockquote><p>계명의 율법은 그리스도의 가르침으로 폐지되었습니다:</p><blockquote><p>“그는 우리의 화평이신지라 둘로 하나를 만드사 원수 된 것 곧 중간에 막힌 담을 자기 육체로 허시고 <strong><mark>법조문으로 된 계명의 율법을 폐하셨으니</mark></strong> 이는 이 둘로 자기 안에서 한 새 사람을 지어 화평하게 하시고 또 십자가로 이 둘을 한 몸으로 하나님과 화목하게 하려 하심이라 원수 된 것을 십자가로 소멸하시고” (<a href="https://bibleox.com/ko/ko-nkrv/ef/2/#L14-16">엡 2:14-16</a>)</p></blockquote><p>그리스도인들은 율법에서 벗어났습니다:</p><blockquote><p>“이제는 <strong><mark>우리가 얽매였던 것에 대하여 죽었으므로 율법에서 벗어났으니</mark></strong> 이러므로 우리가 영의 새로운 것으로 섬길 것이요 <strong>율법 조문의 묵은 것으로 아니할지니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/rim/7/#L6">롬 7:6</a>)</p></blockquote><p>모세 율법의 폐지에 대한 자세한 설명: <a href="https://bibleox.com/ru/ru/w/Библия-Закон-Моисея-отмена">모세 율법의 폐지</a></p><h3>그리스도께서는 안식일의 쉼을 어겼다는 고발에서 사도들을 변호하셨습니다</h3><p>바리새인들은 주님과 사도들이 안식일의 쉼을 어겼다고 나무랍니다. 그리스도께서는 사도들을 무죄한 자라고 부르십니다:</p><blockquote><p>“바리새인들이 보고 예수께 말하되 보시오 <strong>당신의 제자들이 안식일에 하지 못할 일을 하나이다</strong> &lt;…&gt; 나는 자비를 원하고 제사를 원하지 아니하노라 하신 뜻을 <strong>너희가 알았더라면</strong> <strong><mark>무죄한 자를 정죄하지 아니하였으리라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/12/#L2,7">마 12:2,7</a>)</p></blockquote><h3>사도는 안식일의 쉼을 지키지 않는다고 그리스도인들을 비판하는 것을 금합니다</h3><blockquote><p>“그러므로 먹고 마시는 것과 절기나 초하루나 <strong><mark>안식일을</mark></strong> 이유로 <strong><mark>누구든지</mark></strong> <strong><mark>너희를 비판하지 못하게 하라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/kol/2/#L16">골 2:16</a>)</p></blockquote><h2>주일</h2><h3>주님께서 나타나신 날</h3><ol><li><p>주 예수 그리스도께서는 주간의 첫날, 곧 주일에 부활하시어 도마 없이 제자들에게 나타나셨습니다(<a href="https://bibleox.com/ko/ko-nkrv/in/20/#L19">요 20:19</a>).</p></li><li><p>주일에 그분은 향유를 가져온 여인들에게(<a href="https://bibleox.com/ko/ko-nkrv/mf/28/#L1,9">마 28:1,9</a>), 막달라 마리아에게(<a href="https://bibleox.com/ko/ko-nkrv/mk/16/#L9">막 16:9</a>), 사도 베드로에게(<a href="https://bibleox.com/ko/ko-nkrv/lk/24/#L34">눅 24:34</a>), 글로바와 누가에게(<a href="https://bibleox.com/ko/ko-nkrv/lk/24/#L13-32">눅 24:13-32</a>) 나타나셨습니다.</p></li><li><p>도마를 위해 구세주께서는 정확히 한 주 뒤, 다시 주님의 날에 나타나십니다(<a href="https://bibleox.com/ko/ko-nkrv/in/20/#L26">요 20:26</a>).</p></li></ol><h3>모임과 성체성혈성사를 거행하는 날</h3><p>드로아에 이레 동안 머문 사도들은 일곱 날 가운데 안식일이 아니라 주일에 예배와 떡을 떼기 위해 모입니다:</p><blockquote><p>“우리는 무교절 후에 빌립보에서 배로 떠나 닷새 만에 <strong>드로아에 있는 그들에게 가서 이레를 머무니라</strong> <strong>그 주간의 첫날에 우리가 떡을 떼려 하여 모였더니</strong> 바울이 이튿날 떠나고자 하여 그들에게 강론할새 말을 밤중까지 계속하매 <strong>우리가 모인</strong> 윗다락에 등불을 많이 켰는데 유두고라 하는 청년이 창에 걸터 앉아 있다가 깊이 졸더니 바울이 강론하기를 더 오래 하매 졸음을 이기지 못하여 삼 층에서 떨어지거늘 일으켜보니 죽었는지라 바울이 내려가서 그 위에 엎드려 그 몸을 안고 말하되 떠들지 말라 생명이 그에게 있다 하고 올라가 떡을 떼어 먹고 오랫동안 곧 날이 새기까지 이야기하고 떠나니라” (<a href="https://bibleox.com/ko/ko-nkrv/act/20/#L6-11">행 20:6-11</a>) <em>(그들은 이레 동안 드로아에 있었지만 떡을 떼려고 모인 것은 바로 주간의 첫날이었습니다.)</em></p></blockquote><p>사도는 주일(모이는 날)에 어려운 이들을 돕기 위해 돈을 조금씩 모아 두라고 합니다:</p><blockquote><p>“<strong>매주 첫날에 너희 각 사람이 수입에 따라 모아 두어서</strong> 내가 갈 때에 연보를 하지 않게 하라” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/16/#L2">고전 16:2</a>)</p></blockquote><h2>반론</h2><p>교회에서 갈라져 나간 어떤 공동체들(주로 제칠일 안식일 예수재림교)은 계명(<a href="https://bibleox.com/ko/ko-nkrv/kol/2/#L16">골 2:16</a>)을 거슬러, 교회가 안식일의 쉼을 지키지 않을 뿐 아니라 주일을 더 성대하게 기린다고 비난하며 주일을 기려서는 안 된다고 말합니다.</p><p>정교회에서는 사람이 평생 모든 날에 선한 일을 하라는 부름을 받으며, 특별한 날(토요일과 특히 주일)에는 개인의 선한 일뿐 아니라 <strong>공동의 일</strong>(그리스어 λειτουργία, 레이투르기아)로 기립니다. 주일은 예배를 위한 공동의 모임으로 기립니다. 다른 날에도 예배를 드리지만, 토요일과 특히 주일에는 더 성대한 특별 예배를 드립니다.</p><p>그리스도인에게 가장 중요한 사건은 그리스도의 파스카, 곧 주 예수 그리스도께서 죽은 자 가운데서 부활하신 일입니다. 이날을 축일 중의 축일, 경축 중의 경축이라 부릅니다. 왜냐하면:</p><blockquote><p>“<strong>그리스도께서 만일 다시 살아나지 못하셨으면</strong> 우리가 전파하는 것도 헛것이요 또 <strong>너희 믿음도 헛것이며</strong> &lt;…&gt; 그리스도께서 다시 살아나신 일이 없으면 너희의 믿음도 헛되고 너희가 여전히 죄 가운데 있을 것이요” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/15/#L14,17">고전 15:14,17</a>)</p></blockquote><p>위에서 보았듯이 사도들은 바로 주일에 예배를 드렸습니다. 이날은 부활하신 주님을 만나는 기쁜 날이 되었습니다. 첫 그리스도인들도 그렇게 했습니다: <a href="https://bibleox.com/ru/ru/w/Евхаристия_в_воскресенье">주일의 성체성혈성사(러시아어)</a></p><p>또 콘스탄티누스 황제(4세기)가 쉬는 날을 토요일에서 주일로 옮겼다고 비난합니다(<a href="https://bibleox.com/ko/ko-nkrv/act/20/#L6-11">행 20:6-11</a>). 그러나 콘스탄티누스 황제는 토요일에 대해 아무 지시도 하지 않고, 한 주의 첫 쉬는 날, 곧 주일을 처음 정했습니다(<a href="https://bibleox.com/ru/ru/w/Воскресенье_выходной_Указ_императора_Константина">자세히, 러시아어</a>). 이 칙령 이전에 로마 제국에는 공통의 주간 휴일이 없었습니다.</p><p>이처럼 비판은 부드럽게 말해도 근거가 없습니다.</p>'
  meta_desc: 안식일과 주일을 기리는 일에 관한 성경 구절
