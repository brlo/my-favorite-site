- src: заповеди-блаженств
  path: Bt7g_참된_행복의_계명
  title: 참된 행복의 계명
  copy_cover: true
  body: <h2>주 예수 그리스도께서 산상 설교에서 주신 아홉 가지 행복</h2><ol><li><p>“<strong>마음이 가난한 사람은</strong> 행복하다. 하늘 나라가 그들의 것이다.” (<a href="https://bibleox.com/ko/ko-nkrv/mf/5/#L3">마 5:3</a>; <a href="https://bibleox.com/ko/ko-nkrv/lk/6/#L20">눅 6:20</a>)</p></li><li><p>“<strong>슬퍼하는 사람은</strong> 행복하다. 그들은 위로를 받을 것이다.” (<a href="https://bibleox.com/ko/ko-nkrv/mf/5/#L4">마 5:4</a>; <a href="https://bibleox.com/ko/ko-nkrv/lk/6/#L21">눅 6:21</a>)</p></li><li><p>“<strong>온유한 사람은</strong> 행복하다. 그들은 땅을 차지할 것이다.” (<a href="https://bibleox.com/ko/ko-nkrv/mf/5/#L5">마 5:5</a>)</p></li><li><p>“<strong>옳은 일에 주리고 목마른 사람은</strong> 행복하다. 그들은 만족할 것이다.” (<a href="https://bibleox.com/ko/ko-nkrv/mf/5/#L6">마 5:6</a>; <a href="https://bibleox.com/ko/ko-nkrv/lk/6/#L21">눅 6:21</a>; <a href="https://bibleox.com/ko/ko-nkrv/lk/6/#L25">눅 6:25</a>)</p></li><li><p>“<strong>자비를 베푸는 사람은</strong> 행복하다. 그들은 자비를 입을 것이다.” (<a href="https://bibleox.com/ko/ko-nkrv/mf/5/#L7">마 5:7</a>; <a href="https://bibleox.com/ko/ko-nkrv/lk/6/#L24">눅 6:24</a>)</p></li><li><p>“<strong>마음이 깨끗한 사람은</strong> 행복하다. 그들은 하느님을 뵙게 될 것이다.” (<a href="https://bibleox.com/ko/ko-nkrv/mf/5/#L8">마 5:8</a>)</p></li><li><p>“<strong>평화를 위하여 일하는 사람은</strong> 행복하다. 그들은 하느님의 아들이 될 것이다.” (<a href="https://bibleox.com/ko/ko-nkrv/mf/5/#L9">마 5:9</a>)</p></li><li><p>“<strong>옳은 일을 하다가 박해를 받는 사람은</strong> 행복하다. 하늘 나라가 그들의 것이다.” (<a href="https://bibleox.com/ko/ko-nkrv/mf/5/#L10">마 5:10</a>; <a href="https://bibleox.com/ko/ko-nkrv/lk/6/#L22">눅 6:22</a>)</p></li><li><p>“<strong>나 때문에 모욕을 당하고 박해를 받으며 터무니없는 말로 갖은 비난을 다 받게 되면</strong> 너희는 행복하다. 기뻐하고 즐거워하여라. 너희가 받을 큰 상이 하늘에 마련되어 있다. 옛 예언자들도 너희에 앞서 같은 박해를 받았다.” (<a href="https://bibleox.com/ko/ko-nkrv/mf/5/#L11-12">마 5:11-12</a>; <a href="https://bibleox.com/ko/ko-nkrv/lk/6/#L22-23">눅 6:22-23</a>; <a href="https://bibleox.com/ko/ko-nkrv/lk/6/#L26">눅 6:26</a>)</p></li></ol><h2>그 밖의 계명</h2><ol><li><p>“너희는 <strong>원수를 사랑하여라</strong>.” (<a href="https://bibleox.com/ko/ko-nkrv/lk/6/#L27">눅 6:27</a>; <a href="https://bibleox.com/ko/ko-nkrv/mf/5/#L44">마 5:44</a>)</p></li><li><p>“너희를 <strong>미워하는 사람들에게 잘해 주고</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/lk/6/#L27">눅 6:27</a>; <a href="https://bibleox.com/ko/ko-nkrv/mf/5/#L44">마 5:44</a>)</p></li><li><p>“너희를 <strong>저주하는 사람들을 축복해 주어라</strong>.” (<a href="https://bibleox.com/ko/ko-nkrv/lk/6/#L28">눅 6:28</a>; <a href="https://bibleox.com/ko/ko-nkrv/mf/5/#L44">마 5:44</a>)</p></li><li><p>“너희를 <strong>학대하는 사람들을 위하여 기도해 주어라</strong>.” (<a href="https://bibleox.com/ko/ko-nkrv/lk/6/#L28">눅 6:28</a>; <a href="https://bibleox.com/ko/ko-nkrv/mf/5/#L44">마 5:44</a>)</p></li><li><p>“누가 <strong>빰을 치거든</strong> 다른 빰마저 <strong>돌려 대 주고</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/lk/6/#L29">눅 6:29</a>)</p></li><li><p>“누가 <strong>겉옷을 빼앗거든</strong> 속옷마저 <strong>내어 주어라</strong>.” (<a href="https://bibleox.com/ko/ko-nkrv/lk/6/#L29">눅 6:29</a>; <a href="https://bibleox.com/ko/ko-nkrv/mf/5/#L40">마 5:40</a>)</p></li><li><p>“<strong>달라는</strong> 사람에게는 <strong>주고</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/lk/6/#L30">눅 6:30</a>; <a href="https://bibleox.com/ko/ko-nkrv/lk/6/#L38">눅 6:38</a>; <a href="https://bibleox.com/ko/ko-nkrv/mf/5/#L42">마 5:42</a>)</p></li><li><p>“<strong>빼앗는</strong> 사람에게는 <strong>되받으려고 하지 말라</strong>.” (<a href="https://bibleox.com/ko/ko-nkrv/lk/6/#L30">눅 6:30</a>)</p></li><li><p>“<strong>너희는 남에게서 바라는 대로 남에게 해 주어라</strong>.” (<a href="https://bibleox.com/ko/ko-nkrv/lk/6/#L31">눅 6:31</a>)</p></li><li><p>“그러니 너희의 아버지께서 자비로우신 것같이 너희도 <strong>자비로운</strong> 사람이 되어라.” (<a href="https://bibleox.com/ko/ko-nkrv/lk/6/#L36">눅 6:36</a>)</p></li><li><p>“<strong>남을 비판하지 말라</strong>. 그러면 너희도 비판받지 않을 것이다.” (<a href="https://bibleox.com/ko/ko-nkrv/lk/6/#L37">눅 6:37</a>)</p></li><li><p>“<strong>남을 단죄하지 말라</strong>. 그러면 너희도 단죄받지 않을 것이다.” (<a href="https://bibleox.com/ko/ko-nkrv/lk/6/#L37">눅 6:37</a>)</p></li><li><p>“<strong>남을 용서하여라</strong>. 그러면 너희도 용서를 받을 것이다.” (<a href="https://bibleox.com/ko/ko-nkrv/lk/6/#L37">눅 6:37</a>)</p></li><li><p>“<strong>남에게 주어라</strong>. 그러면 너희도 받을 것이다. 말에다 누르고 흔들어 넘치도록 후하게 담아서 너희에게 안겨 주실 것이다. 너희가 남에게 되어 주는 분량만큼 너희도 받을 것이다.” (<a href="https://bibleox.com/ko/ko-nkrv/lk/6/#L38">눅 6:38</a>)</p></li><li><p>“너는 형제의 눈 속에 든 티는 보면서도 어째서 제 눈 속에 들어 있는 들보는 깨닫지 못하느냐? 제 눈 속에 있는 들보도 보지 못하면서 어떻게 형제더러 네 눈의 티를 빼내 주겠다고 하겠느냐? 이 위선자야, <strong>먼저 네 눈에서 들보를 빼내어라</strong>. 그래야 눈이 잘 보여 형제의 눈 속에 있는 티를 꺼낼 수 있다.” (<a href="https://bibleox.com/ko/ko-nkrv/lk/6/#L41-42">눅 6:41-42</a>)</p></li><li><p>“살인하지 말라, 살인하는 자는 누구든지 재판을 받아야 한다고 옛 사람들에게 하신 말씀을 너희는 들었다. 그러나 나는 이렇게 말한다. <strong>자기 형제에게 성을 내는 사람은 누구나 재판을 받아야 하며</strong> 자기 형제를 가리켜 바보라고 욕하는 사람은 중앙법정에 넘겨질 것이다. 또 자기 형제에게 미친놈이라고 하는 사람은 불붙는 지옥에 던져질 것이다.” (<a href="https://bibleox.com/ko/ko-nkrv/mf/5/#L21-22">마 5:21-22</a>) <em>(비잔틴 본문(다수 사본)에는 “까닭 없이 성을 내는”으로 되어 있습니다.)</em></p></li><li><p>“그러므로 제단에 예물을 드리려 할 때에 너에게 원한을 품고 있는 형제가 생각나거든 그 예물을 제단 앞에 두고 <strong>먼저 그를 찾아 가 화해하고</strong> 나서 돌아와 예물을 드려라. 누가 너를 고소하여 그와 함께 법정으로 갈 때에는 <strong>도중에서 얼른 화해하여라</strong>. 그렇지 않으면 고소하는 사람이 너를 재판관에게 넘기고 재판관은 형리에게 내 주어 감옥에 가둘 것이다. 분명히 말해 둔다. 네가 마지막 한 푼까지 다 갚기 전에는 결코 거기에서 풀려 나오지 못할 것이다.” (<a href="https://bibleox.com/ko/ko-nkrv/mf/5/#L23-26">마 5:23-26</a>)</p></li><li><p>“간음하지 말라고 하신 말씀을 너희는 들었다. 그러나 나는 너희에게 이렇게 말한다. <strong>누구든지 여자를 보고 음란한 생각을 품는 사람은 벌써 마음으로 그 여자를 범했다</strong>.” (<a href="https://bibleox.com/ko/ko-nkrv/mf/5/#L27-28">마 5:27-28</a>)</p></li><li><p>“또한 누구든지 아내를 버리려면 그에게 이혼장을 써 주어라고 하신 말씀이 있다. 그러나 나는 이렇게 말한다. <strong>누구든지 음행한 경우를 제외하고 아내를 버리면, 이것은 그 여자를 간음하게 하는 것이다</strong>. 또 <strong>그 버림받은 여자와 결혼하면 그것도 간음하는 것이다</strong>.” (<a href="https://bibleox.com/ko/ko-nkrv/mf/5/#L31-32">마 5:31-32</a>)</p></li><li><p>“또 거짓 맹세를 하지 말라. 그리고 주님께 맹세한 것은 다 지켜라고 옛 사람들에게 하신 말씀을 너희는 들었다. 그러나 나는 이렇게 말한다. <strong>아예 맹세를 하지 말라</strong>. 하늘을 두고도 맹세하지 말라. 하늘은 하느님의 보좌이다. 땅을 두고도 맹세하지 말라. 땅은 하느님의 발판이다. 예루살렘을 두고도 맹세하지 말라. 예루살렘은 그 크신 임금님의 도성이다. 네 머리를 두고도 맹세하지 말라. 너는 머리카락 하나도 희게나 검게 할 수 없다. 너희는 그저 예 할 것은 예 하고 아니오 할 것은 아니오 라고만 하여라. 그 이상의 말은 악에서 나오는 것이다.” (<a href="https://bibleox.com/ko/ko-nkrv/mf/5/#L33-37">마 5:33-37</a>)</p></li><li><p>“눈은 눈으로, 이는 이로 라고 하신 말씀을 너희는 들었다. 그러나 나는 이렇게 말한다. <strong>앙갚음하지 말아라</strong>. 누가 오른빰을 치거든 왼빰마저 돌려대고 또 재판에 걸어 속옷을 가지려고 하거든 겉옷까지도 내 주어라. 누가 억지로 오 리를 가자고 하거든 십 리를 같이 가 주어라. 달라는 사람에게 주고 꾸려는 사람의 청을 물리치지 말아라.” (<a href="https://bibleox.com/ko/ko-nkrv/mf/5/#L38-42">마 5:38-42</a>)</p></li><li><p>“하늘에 계신 <strong>아버지께서 완전하신 것같이 너희도 완전한 사람이 되어라</strong>.” (<a href="https://bibleox.com/ko/ko-nkrv/mf/5/#L48">마 5:48</a>)</p></li></ol>
