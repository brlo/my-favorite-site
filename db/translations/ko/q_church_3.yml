  title: 아버지와 스승이라 불리지 말라
  copy_cover: true
  body: '<h2>그리스도께서는 스승과 아버지라 불리지 말라고 명하십니다</h2><blockquote><p>“율법학자들과 바리사이파 사람들은 모세의 자리를 이어 율법을 가르치고 있다. &lt;…&gt; 그들의 하는 일은 모두 남에게 보이기 위한 것이다. 그래서 이마나 팔에 성구 넣는 갑을 크게 만들어 매달고 다니며 옷단에는 커다란 술을 달고 다닌다. 그리고 잔치에 가면 맨 윗자리에 앉으려 하고 회당에서는 제일 높은 자리를 찾으며 길에 나서면 인사받기를 좋아하고 <strong>사람들이 스승이라 불러 주기를 바란다</strong>. <strong><mark>그러나 너희는 스승 소리를 듣지 말아라</mark></strong>. 너희의 스승은 오직 한 분뿐이고 너희는 모두 형제들이다. 또 <strong><mark>이 세상 누구를 보고도 아버지라 부르지 말아라</mark></strong>. 너희의 아버지는 하늘에 계신 아버지 한 분뿐이시다.” (<a href="https://bibleox.com/ko/ko-ctb/mf/23/#L2,5-9">마태 23:2,5-9</a>)</p></blockquote><p>이 말씀은 지체를 잘라 내라는 말씀(<a href="https://bibleox.com/ko/ko-ctb/mf/5/#L29-30">마태 5:29-30</a>)이나, 그리스도께서 평화가 아니라 칼을 주러 오셔서 가족을 갈라놓으신다는 말씀(<a href="https://bibleox.com/ko/ko-ctb/mf/10/#L34-35">마태 10:34-35</a>)처럼 글자 그대로의 뜻이 아닙니다. 믿는 이들이 “스승, 스승”이라 불리기를 바라지 않고(<a href="https://bibleox.com/ko/ko-ctb/mf/23/#L7">마태 23:7</a>), 그런 호칭을 받아도 교만해져 자신을 높이지 않으며, 가장 높은 권위이자 참된 아버지와 스승은 하느님이심을 깨닫도록 겸손을 가르치시는 것입니다.</p><p>문맥에서 출발하여 뜻을 바르게 이해하는 것이 중요합니다. 그렇지 않으면 하느님께서 계명에서 부모라고 부르시는데도(<a href="https://bibleox.com/ko/ko-ctb/vtor/5/#L16">신 5:16</a>) 자녀가 부모를 아버지라고 부를 수 없게 됩니다. 교회에 분명히 교사들이 있는데도 어떤 교사도 교사라고 부를 수 없게 됩니다. 성경을 보면 이런 말을 피하지 않았음을 알 수 있습니다.</p><h2>스승(교사)</h2><h3>그리스도께서는 바리사이 니고데모를 이스라엘의 선생이라고 부르십니다</h3><blockquote><p>“예수께서는 다시 이렇게 말씀하셨다. ‘너는 <strong><mark>이스라엘의 이름난 선생</mark></strong>이면서 이런 것들을 모르느냐?” (<a href="https://bibleox.com/ko/ko-ctb/in/3/#L10">요한 3:10</a>)</p></blockquote><h3>사도는 자신이 교사로 임명되었다고 말합니다</h3><blockquote><p>“<strong><mark>나는</mark></strong> 이 복음을 위해서 전도자와 사도와 <strong><mark>교사로 임명을 받았습니다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/2tim/1/#L11">2디모 1:11</a>)</p></blockquote><blockquote><p>“그분은 자기 자신을 모든 사람을 위한 대속물로 바치셨습니다. 이렇게 해서 하느님의 뜻을 적절한 시기에 분명히 나타내 주셨습니다. <strong><mark>나는</mark></strong> 그리스도를 전하는 전도자와 사도로 임명을 받았으며 이방인들에게 믿음과 진리를 <strong><mark>가르치는 교사가 되었습니다</mark></strong>.나는 거짓말을 하는 것이 아니라 참말을 하고 있습니다.” (<a href="https://bibleox.com/ko/ko-ctb/1tim/2/#L6-7">1디모 2:6-7</a>)</p></blockquote><h3>하느님께서는 교회에 교사들을 세우셨습니다</h3><blockquote><p>“<strong><mark>하느님께서는 교회 안에 다음과 같은 직책을 두셨습니다</mark></strong>. 첫째는 사도요 둘째는 하느님의 말씀을 받아 전하는 사람이요 <strong><mark>셋째는 가르치는 사람이요</mark></strong> 다음은 기적을 행하는 사람이요 또 그 다음은 병 고치는 능력을 받은 사람, 남을 도와 주는 사람, 지도하는 사람, 이상한 언어를 말하는 사람 등입니다.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/12/#L28">1고린 12:28</a>)</p></blockquote><blockquote><p>“<strong><mark>바로 그분이</mark></strong> 사람들에게 각각 다른 선물을 은총으로 주셔서 어떤 사람들은 사도로, 어떤 사람들은 예언하는 사람으로, 어떤 사람들은 전도자로, 어떤 사람들은 <strong><mark>목자와 교사로 삼으셨습니다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/ef/4/#L11">에페 4:11</a>)</p></blockquote><blockquote><p>“그것이 봉사하는 일이라면 봉사하는 데 써야 하고 <strong><mark>가르치는 일이라면</mark></strong> 가르치는 데 써야 하고” (<a href="https://bibleox.com/ko/ko-ctb/rim/12/#L7">로마 12:7</a>)</p></blockquote><blockquote><p>“여러분은 벌써 오래 전에 <strong><mark>남을 가르치는 사람이 되었어야 할 터인데</mark></strong> 하느님의 말씀의 초보적 원리를 남에게서 다시 배워야 할 처지입니다. 단단한 음식을 먹지 못하고 아직도 젖을 먹어야 할 형편입니다.” (<a href="https://bibleox.com/ko/ko-ctb/evr/5/#L12">히브 5:12</a>)</p></blockquote><h3>교사의 책임에 관한 경고</h3><blockquote><p>“내 형제 여러분, <strong><mark>여러분은 저마다 선생이 되려고 하지 마십시오. 여러분도 알다시피 우리 가르치는 사람들은 더 엄한 심판을 받게 됩니다</mark></strong>. 우리는 모두 실수하는 일이 많습니다. 말에 실수가 없는 사람은 온 몸을 잘 다스릴 수 있는 완전한 사람입니다.” (<a href="https://bibleox.com/ko/ko-ctb/iak/3/#L1-2">야고 3:1-2</a>)</p></blockquote><h2>아버지</h2><h3>사도는 자신을 아버지라 하고 믿는 이들을 자녀라고 부릅니다</h3><blockquote><p>“나는 여러분을 부끄럽게 하려고 이런 말을 쓰는 것은 아닙니다. 오히려 여러분을 <strong><mark>내 사랑하는 자녀</mark></strong>로 생각하고 교훈하려는 것입니다. 여러분의 신앙생활을 지도해 줄 교사는 얼마든지 있겠지만 <strong><mark>아버지는 여럿이 있을 수가 없습니다. 여러분에게 복음을 전하여 그리스도 예수를 믿는 교인으로 태어나게 한 사람은 바로 나 입니다</mark></strong>. &lt;…&gt; 내가 디모테오를 여러분에게 보내는 것도 바로 이 때문입니다. 그는 주님을 진실하게 믿는 <strong><mark>내 사랑하는 아들</mark></strong>입니다. 내가 모든 교회에서 가르치고 또 실천하고 있는 그리스도 교인의 생활 원칙을 그가 여러분에게 일깨워 줄 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/4/#L14-15,17">1고린 4:14-15,17</a>)</p></blockquote><blockquote><p>“<strong><mark>나의 자녀인 여러분</mark></strong>, 여러분 속에 그리스도가 형성될 때까지 나는 또다시 <strong>해산의 고통</strong>을 겪어야겠습니다.” (<a href="https://bibleox.com/ko/ko-ctb/gal/4/#L19">갈라 4:19</a>)</p></blockquote><blockquote><p>“나는 <strong><mark>믿음의 자녀인 여러분</mark></strong>이 죄를 짓지 않게 하려고 여러분에게 이 편지를 씁니다. 그러나 혹 누가 죄를 짓더라도 아버지 앞에서 우리를 변호해 주시는 분이 계십니다. 그분은 의로우신 예수 그리스도이십니다.” (<a href="https://bibleox.com/ko/ko-ctb/1in/2/#L1">1요한 2:1</a>)</p></blockquote><blockquote><p>“<strong><mark>사랑하는 자녀들이여</mark></strong>, 우리는 말로나 혀 끝으로 사랑하지 말고 행동으로 진실하게 사랑합시다.” (<a href="https://bibleox.com/ko/ko-ctb/1in/3/#L18">1요한 3:18</a>)</p></blockquote><blockquote><p>“<strong><mark>내 자녀들</mark></strong>이 진리를 좇아서 살고 있다는 말을 듣는 것보다 더 기쁜 일이 어디 있겠습니까?” (<a href="https://bibleox.com/ko/ko-ctb/3in/1/#L4">3요한 1:4</a>)</p></blockquote><blockquote><p>“내가 <strong>갇혀 있는 동안에 얻은</strong> <strong><mark>내 믿음의 아들</mark></strong> 오네시모의 일로 그대에게 이렇게 간청하는 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/fm/1/#L10">필레 1:10</a>)</p></blockquote><h3>아브라함은 믿는 이들의 아버지입니다</h3><blockquote><p>“그러므로 하느님께서는 사람의 믿음을 보시고 그를 상속자로 삼으십니다. 이렇게 하느님께서는 사람의 믿음을 보시고 그를 상속자로 삼으십니다. 이렇게 하느님께서는 은총을 베푸시며 율법을 지키는 사람들에게만 아니라 아브라함의 믿음을 따르는 사람들에게까지 곧 아브라함의 모든 후손들에게 그 약속을 보장해 주십니다. <strong><mark>아브라함은 우리 모두의 조상입니다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/rim/4/#L16">로마 4:16</a>)</p></blockquote><blockquote><p>“그러므로 여러분은 <strong>믿음으로 사는 사람만이 아브라함의 참 자손이 된다</strong>는 것을 알아야 합니다.” (<a href="https://bibleox.com/ko/ko-ctb/gal/3/#L7">갈라 3:7</a>)</p></blockquote><blockquote><p>“아브람이 구십 구 세 되던 해에 야훼께서 아브람에게 나타나시어 말씀하셨다. ‘나는 전능한 신이다. 너는 내 앞을 떠나지 말고 흠 없이 살아라. &lt;…&gt; 내가 너와 계약을 맺는다. <strong><mark>너는 많은 민족의 조상이 되리라</mark></strong>. <strong><mark>내가 너를 많은 민족의 조상으로 삼으리니</mark></strong>, 네 이름은 이제 아브람이 아니라 아브라함이라 불리리라.” (<a href="https://bibleox.com/ko/ko-ctb/gen/17/#L1,4-5">창 17:1,4-5</a>)</p></blockquote><blockquote><p>“아브라함은 할례를 받기 전에 믿음을 통해서 하느님과 올바른 관계를 가지게 되었습니다. 그 뒤 그것을 확인하는 표로 그는 할례를 받았던 것입니다. 이리하여 할례를 받지 않고도 믿음으로써 올바른 사람이라고 인정받은 <strong><mark>모든 사람의 조상</mark></strong>이 되었습니다. 또 아브라함은 <strong>할례받은 사람들의 조상</strong>이기도 합니다. 여기서 할례받은 사람들이란 그저 할례를 받는 데 그치지 않고 <strong><mark>우리 조상 아브라함</mark></strong>이 할례받기 전에 보여 준 믿음을 본받아 사는 사람들을 가리킵니다. &lt;…&gt; 성서에 ‘<strong><mark>내가 너를 만민의 조상으로 삼았다</mark></strong>’고 하지 않았습니까? 그는 죽은 자를 살리시고 없는 것을 있게 만드시는 하느님을 믿었던 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/rim/4/#L11-12,17">로마 4:11-12,17</a>)</p></blockquote><h3>하느님께서는 아버지와 어머니에 관한 계명을 주십니다</h3><blockquote><p>“<strong><mark>너희는 부모를 공경하여라</mark></strong>. 그래야 너희는 너희 하느님 야훼께서 주신 땅에서 오래 살 것이다.” (<a href="https://bibleox.com/ko/ko-ctb/ish/20/#L12">출 20:12</a>)</p></blockquote><blockquote><p>“<strong><mark>너희는 부모를 공경하여라</mark></strong>. <strong>너희 하느님 야훼의 분부다</strong>. 그래야 너희는 오래 살 것이다. 너희 하느님 야훼께서 주시는 땅에서 잘될 것이다.” (<a href="https://bibleox.com/ko/ko-ctb/vtor/5/#L16">신 5:16</a>)</p></blockquote><blockquote><p>“살인하지 말라, 간음하지 말라, 도둑질하지 말라, 거짓 증거하지 말라, 남을 속이지 말라, <strong><mark>부모를 공경하라</mark></strong>고 한 계명들을 너는 알고 있을 것이다.‘” (<a href="https://bibleox.com/ko/ko-ctb/mk/10/#L19">마르 10:19</a>)</p></blockquote><blockquote><p>“<strong><mark>네 부모를 공경하라</mark></strong>‘하신 계명은 약속이 붙어 있는 첫째 계명입니다.” (<a href="https://bibleox.com/ko/ko-ctb/ef/6/#L2">에페 6:2</a>)</p></blockquote><h3>사도는 아버지들에게 말합니다</h3><blockquote><p>“<strong><mark>어버이들은</mark></strong> 자녀의 마음에 상처를 입히지 말고 주님의 정신으로 교육하고 훈계하며 잘 가르십시오.” (<a href="https://bibleox.com/ko/ko-ctb/ef/6/#L4">에페 6:4</a>) <em>(그리스어: “아버지들”)</em></p></blockquote><blockquote><p>“<strong><mark>어버이들은</mark></strong> 자녀들을 못살게 굴지 마십시오. 그들의 의기를 꺾어서는 안 됩니다.” (<a href="https://bibleox.com/ko/ko-ctb/kol/3/#L21">골로 3:21</a>) <em>(그리스어: “아버지들”)</em></p></blockquote><blockquote><p>“<strong><mark>아버지 된 사람들이여</mark></strong>, 천지창조 이전부터 계신 그분을 여러분이 알고 있기 때문에 나는 이 편지를 씁니다. 젊은이들이여, 여러분이 이미 악마를 이겼기 때문에 나는 이 편지를 씁니다.” (<a href="https://bibleox.com/ko/ko-ctb/1in/2/#L13">1요한 2:13</a>)</p></blockquote><h2>하느님께서는 올바른 뜻으로(본성이 아니라 은총으로) “스승”과 “아버지”만이 아니라 “신”이라고까지 부르는 것을 허락하십니다</h2><blockquote><p>“나의 선고를 들어라. <strong>너희가 비록 신들이요</strong> 모두 지극히 높으신 이의 아들들이나 그러나 너희는 보통 인간처럼 죽겠고 여느 군주처럼 넘어지리라.‘” (<a href="https://bibleox.com/ko/ko-ctb/ps/82/#L6-7">시편 82:6-7</a>)</p></blockquote><blockquote><p>“예수께서는 이렇게 말씀하셨다. ‘너희의 율법서를 보면 하느님께서 내가 <strong>너희를 신이라 불렀다</strong> 하신 기록이 있지 않느냐? 이렇게 성서에서는 하느님의 말씀을 받은 사람들을 모두 신이라고 불렀다. 성경 말씀은 영원히 참되시다.” (<a href="https://bibleox.com/ko/ko-ctb/in/10/#L34-35">요한 10:34-35</a>)</p></blockquote><p>그러나 그리스도께서는 우리 자신을 종이라 부르라는 계명을 주십니다(<a href="https://bibleox.com/ko/ko-ctb/lk/17/#L10">루가 17:10</a>).</p><h2>관련 주제</h2><p>그리스도인을 하느님의 종(노예)이라 부르는 것에 대한 반론에 관하여: <a href="https://bibleox.com/ru/ru/w/христианин-раб-Бога">자세히</a>.</p>'
  menu:
    parent: 교회
    title: 아버지와 스승이라 불리지 말라
    priority: 22
  references: "<p>번역: 로디온 블라소프 (AI 도구 활용). 저본: 러시아어 원문. 참고: 영어·일본어 번역. 성경 인용과 링크는 공동번역 성서에 따름.</p>"
