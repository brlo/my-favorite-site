  title: 십자가
  copy_cover: true
  body: <h2>구약의 십자가 예표</h2><ol><li><p><a href="https://bibleox.com/ru/ru/w/прообраз-крестной-жертвы-Авраам-и-Исаак">그리스도의 십자가 희생 — 아브라함과 이사악</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/крест-Моисей">십자가 — 모세</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/еврейский-стан-крест">십자가 — 히브리인의 진영</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/крест-и-крещение-переход-через-море">십자가와 세례 — 바다를 건넘</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/крест-Иаков">십자가 — 야곱의 축복</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/EMRx_Крест__буква_тау">십자가 — 예언자의 환시에서 믿는 이들의 이마에 찍힌 글자 타우</a></p></li></ol><h2>십자가 — 승리와 화해의 도구</h2><blockquote><p>“여러분이 전에는 잘못을 저질렀고 할례를 받지 않은 이방인으로서, 영적으로 죽은 사람들이었으나 이제 하느님께서 여러분을 그리스도와 함께 다시 살려 주시고 우리의 잘못을 모두 용서해 주셨습니다. 또 하느님께서는 여러가지 달갑지 않은 조항이 들어 있는 우리의 빚문서를 무효화하시고 그것을 <strong>십자가에 못박아 없애 버리셨습니다</strong>. 그리고 <strong>십자가로 권세와 세력의 천신들을 사로잡아 그 무장을 해제시키시고</strong> 그들을 구경거리로 삼아 끌고 <strong>개선의 행진을 하셨습니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/kol/2/#L13-15">골로 2:13-15</a>)</p></blockquote><blockquote><p>“또 <strong>십자가에서 죽으심으로써</strong> 둘을 한 몸으로 만드셔서 하느님과 <strong>화해시키시고</strong> <strong>원수되었던 모든 요소를 없이하셨습니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/ef/2/#L16">에페 2:16</a>)</p></blockquote><blockquote><p>“그리스도를 내세워 하늘과 땅의 만물을 당신과 화해시켜 주셨습니다. 곧 <strong>십자가에서 흘리신 예수의 피로써 평화를 이룩하셨습니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/kol/1/#L20">골로 1:20</a>)</p></blockquote><h2>십자가는 제단이며 위대한 성물입니다</h2><p>주 예수 그리스도께서는 제단인 십자가에서 당신 자신을 제물로 바치셨습니다:</p><blockquote><p>“그리스도께서도 단 한 번 당신 자신을 제물로 바치셨습니다. 그러나 많은 사람의 죄를 없애 주셨고 다시 나타나실 때에는 인간의 죄 때문에 다시 희생제물이 되시는 일이 없이 당신을 갈망하고 있는 사람들에게 구원을 가져다 주실 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/evr/9/#L28">히브 9:28</a>)</p></blockquote><p>이를 확인해 주는 것이 그리스도의 십자가 희생의 구약적 예표, 곧 이사악의 희생입니다. 아브라함(아버지)이 이사악(외아들)을 제물로 바칩니다:</p><blockquote><p>“하느님께서는 이렇게 분부하셨다. ‘<strong>사랑하는 네 외아들 이사악</strong>을 데리고 모리야 땅으로 가거라. 거기에서 <strong>내가 일러 주는 산에 올라 가 그를 번제물로 나에게 바쳐라</strong>.’” (<a href="https://bibleox.com/ko/ko-ctb/gen/22/#L2">창 22:2</a>)</p></blockquote><blockquote><p>“하느님은 이 세상을 극진히 사랑하셔서 <strong>외아들을 보내 주시어</strong> 그를 믿는 사람은 누구든지 멸망하지 않고 영원한 생명을 얻게 하여 주셨다.” (<a href="https://bibleox.com/ko/ko-ctb/in/3/#L16">요한 3:16</a>)</p></blockquote><p>이사악은 자기가 바쳐질 제물의 나무를 지고 산에 오릅니다:</p><blockquote><p>“번제물을 사를 장작을 <strong>아들 이사악에게 지우고</strong> 자기는 불씨와 칼을 챙겨 들었다. 그리고 둘이서 길을 떠나려고 하는데,” (<a href="https://bibleox.com/ko/ko-ctb/gen/22/#L6">창 22:6</a>)</p></blockquote><blockquote><p>“그래서 빌라도는 예수를 십자가에 못박으라고 그들에게 내어 주었다. 예수께서는 마침내 그들의 손에 넘어 가 <strong>몸소 십자가를 지시고</strong> 성 밖을 나가 히브리말로 골고타라는 곳으로 향하셨다. 골고타라는 말은 해골산이란 뜻이다. 여기서 그들은 예수를 십자가에 못박았다. 그리고 다른 두 사람도 십자가에 달아 예수를 가운데로 하여 그 양쪽에 하나씩 세워 놓았다.” (<a href="https://bibleox.com/ko/ko-ctb/in/19/#L16-18">요한 19:16-18</a>)</p></blockquote><h3>아브라함은 이사악을 제단에 올렸습니다</h3><blockquote><p>“우리 조상 아브라함은 <strong>자기 아들 이사악을 제단에 바친</strong> 행동으로 말미암아 하느님과의 올바른 관계를 가지게 된 것이 아닙니까?” (<a href="https://bibleox.com/ko/ko-ctb/iak/2/#L21">야고 2:21</a>)</p></blockquote><blockquote><p>“그런데 하느님께서 미리 정하신 뜻과 계획에 따라 여러분의 손에 넘어 간 이 예수를 여러분은 악인들의 손을 빌어 <strong>십자가에 못박아 죽였던 것입니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/act/2/#L23">사도 2:23</a>)</p></blockquote><p>십자가에서, 제단에서처럼, 인류의 구원이 이루어집니다:</p><blockquote><p>“또 <strong>십자가에서 죽으심으로써</strong> 둘을 한 몸으로 만드셔서 하느님과 화해시키시고 <strong>원수되었던 모든 요소를 없이하셨습니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/ef/2/#L16">에페 2:16</a>)</p></blockquote><h3>제단은 지극히 거룩합니다</h3><blockquote><p>“이레 동안 제단 위에 속죄제물을 올려 제단을 거룩하게 하여라. 그러면 <strong>그 제단은 가장 거룩한 것이 되어 제단에 닿는 모든 것이 거룩해지리라</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/ish/29/#L37">출 29:37</a>)</p></blockquote><h2>복음서</h2><blockquote><p>“예수께서는 그를 유심히 바라보시고 대견해 하시며 이렇게 말씀하셨다. ‘너에게 한 가지 부족한 것이 있다. 가서 가진 것을 다 팔아 가난한 사람들에게 나누어 주어라. 그러면 하늘에서 보화를 얻게 될 것이다. 그러니 내가 시키는 대로 하고 나서 <strong>나를 따라 오너라</strong>.’” (<a href="https://bibleox.com/ko/ko-ctb/mk/10/#L21">마르 10:21</a>) <em>(비잔틴 본문(다수 사본)에는 “십자가를 지고”가 있습니다.)</em></p></blockquote><blockquote><p>“예수께서 군중과 제자들을 한 자리에 불러 놓고 이렇게 말씀하셨다. ‘나를 따르려는 사람은 누구든지 자기를 버리고 <strong>제 십자가를 지고</strong> 따라야 한다.” (<a href="https://bibleox.com/ko/ko-ctb/mk/8/#L34">마르 8:34</a>)</p></blockquote><blockquote><p>“또 <strong>자기 십자가를 지고 나를 따라 오지 않는 사람</strong>도 내 사람이 될 자격이 없다.” (<a href="https://bibleox.com/ko/ko-ctb/mf/10/#L38">마태 10:38</a>)</p></blockquote><blockquote><p>“그리고 제자들에게 이렇게 말씀하셨다. ‘나를 따르려는 사람은 누구든지 자기를 버리고 <strong>제 십자가를 지고</strong> 따라야 한다.” (<a href="https://bibleox.com/ko/ko-ctb/mf/16/#L24">마태 16:24</a>)</p></blockquote><blockquote><p>“그리고 사람들에게 이렇게 말씀하셨다. ‘나를 따르려는 사람은 누구든지 자기를 버리고 매일 <strong>제 십자가를 지고</strong> 따라야 한다.” (<a href="https://bibleox.com/ko/ko-ctb/lk/9/#L23">루가 9:23</a>)</p></blockquote><blockquote><p>“그리고 누구든지 <strong>자기 십자가를 지고 나를 따라 오지 않으면</strong> 내 제자가 될 수 없다.‘” (<a href="https://bibleox.com/ko/ko-ctb/lk/14/#L27">루가 14:27</a>)</p></blockquote><blockquote><p>“성전을 헐고 사흘이면 다시 짓는다던 자야, 네 목숨이나 건져라. 네가 정말 하느님의 아들이어거든, 어서 <strong>십자가에서 내려 와 보아라</strong>‘ 하며 모욕하였다.” (<a href="https://bibleox.com/ko/ko-ctb/mf/27/#L40">마태 27:40</a>)</p></blockquote><blockquote><p>“남은 살리면서 자기는 못살리는구나. 저 사람이 이스라엘의 왕이래. <strong>십자가에서 한번 내려 와 보시지</strong>. 그러면 우리가 믿고 말고.” (<a href="https://bibleox.com/ko/ko-ctb/mf/27/#L42">마태 27:42</a>)</p></blockquote><blockquote><p>“<strong>십자가에서 내려 와</strong> 네 목숨이나 건져 보아라‘하며 모욕하였다.” (<a href="https://bibleox.com/ko/ko-ctb/mk/15/#L30">마르 15:30</a>)</p></blockquote><blockquote><p>“어디 이스라엘의 왕 그리스도가 <strong>지금 십자가에서 내려 오나 보자</strong>. 그렇게만 한다면 우린들 안 믿을 수 있겠느냐?‘하고 서로 지껄였다. 예수와 함께 십자가에 달린 자들까지도 예수를 모욕하였다.” (<a href="https://bibleox.com/ko/ko-ctb/mk/15/#L32">마르 15:32</a>)</p></blockquote><h2>사도</h2><blockquote><p>“그리고 우리의 믿음의 근원이시며 완성자이신 예수만을 바라봅시다. 그분은 장차 누릴 기쁨을 생각하며 부끄러움도 상관하지 않고 <strong>십자가의 고통을 견디어 내시고</strong> 지금은 하느님의 옥좌 오른편에 앉아 계십니다.” (<a href="https://bibleox.com/ko/ko-ctb/evr/12/#L2">히브 12:2</a>)</p></blockquote><blockquote><p>“그러나 나에게는 <strong>우리 주 예수 그리스도의 십자가밖에는 아무것도 자랑할 것이 없습니다</strong>. 그리스도께서 십자가에 못박히심으로써 세상은 나에게 대해서 죽었고 나는 세상에 대해서 죽었습니다.” (<a href="https://bibleox.com/ko/ko-ctb/gal/6/#L14">갈라 6:14</a>)</p></blockquote><blockquote><p>“그리스도께서는 세례를 베풀라고 나를 보내신 것이 아니라 복음을 전하라고 보내셨습니다. 그것은 인간의 말재주로 하라는 것은 아니었습니다. 인간의 말재주로 복음을 전하면 <strong>그리스도의 십자가는 그 뜻을 잃고 맙니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/1/#L17">1고린 1:17</a>)</p></blockquote><blockquote><p>“<strong>멸망할 사람들에게는 십자가의 이치가 한낱 어리석은 생각에 불과하지만</strong> 구원받을 우리에게는 곧 하느님의 힘입니다.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/1/#L18">1고린 1:18</a>)</p></blockquote><blockquote><p>“인간적인 겉치레만을 일삼는 자들은 여러분에게 할례를 강요하고 있습니다. 그들은 오직 <strong>그리스도의 십자가 때문에 박해를 면하려고</strong> 그러는 것뿐입니다.” (<a href="https://bibleox.com/ko/ko-ctb/gal/6/#L12">갈라 6:12</a>)</p></blockquote><blockquote><p>“형제 여러분, 만일 내가 여전히 할례의 필요성을 주장하고 있다면 왜 내가 지금까지 박해를 받겠습니까? 내가 아직도 할례를 전하고 있다면 내가 전하는 <strong>십자가가 걸림돌</strong>이 되지는 않을 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/gal/5/#L11">갈라 5:11</a>)</p></blockquote><blockquote><p>“또 <strong>십자가에서 죽으심으로써</strong> 둘을 한 몸으로 만드셔서 하느님과 화해시키시고 <strong>원수되었던 모든 요소를 없이하셨습니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/ef/2/#L16">에페 2:16</a>)</p></blockquote><blockquote><p>“내가 벌써 여러 번 여러분에게 일러 준 것을 지금 또 눈물을 흘리며 말하는 바이지만 많은 사람들이 <strong>그리스도의 십자가의 원수</strong>가 되어 살고 있습니다.” (<a href="https://bibleox.com/ko/ko-ctb/fil/3/#L18">필립 3:18</a>)</p></blockquote><blockquote><p>“그리스도를 내세워 하늘과 땅의 만물을 당신과 화해시켜 주셨습니다. 곧 <strong>십자가에서 흘리신 예수의 피로써 평화를 이룩하셨습니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/kol/1/#L20">골로 1:20</a>)</p></blockquote><blockquote><p>“또 하느님께서는 여러가지 달갑지 않은 조항이 들어 있는 우리의 빚문서를 무효화하시고 그것을 <strong>십자가에 못박아 없애 버리셨습니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/kol/2/#L14">골로 2:14</a>)</p></blockquote>
