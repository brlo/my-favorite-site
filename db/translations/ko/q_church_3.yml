- src: отношение-Церкви-к-государству
  path: Sg3p_국가에_대한_교회의_태도
  title: 국가(권력)에 대한 교회의 태도
  copy_cover: true
  body: '<h2>권력자를 위한 기도</h2><blockquote><p>“나는 무엇보다도 먼저 모든 사람을 위해서 간구와 기원과 간청과 감사의 기도를 드리라고 <strong>권하는 바입니다</strong>. <strong><mark>왕들과 높은 지위에 있는 모든 사람들을 위해서도 기도하시오</mark></strong>. 그래야 우리가 조용하고 평화롭게 살면서 아주 경건하고도 근엄한 신앙생활을 할 수 있을 것입니다. 이렇게 기도하는 것은 좋은 일이며 우리 구세주 하느님을 기쁘시게 해 드리는 일입니다. 하느님께서는 모든 사람이 다 구원을 받게 되고 진리를 알게 되기를 바라십니다.” (<a href="https://bibleox.com/ko/ko-ctb/1tim/2/#L1-4">1디모 2:1-4</a>)</p></blockquote><h2>국가 권력에 대한 복종</h2><blockquote><p>“<strong><mark>통치자들과 지배자들에게 복종하고 순종하며</mark></strong> 언제나 착한 일을 할 수 있는 백성이 되라고 교우들에게 깨우쳐 주시오. 그리고 누구를 헐뜯거나 싸움질을 하지 말고 온순한 사람이 되어서 <strong>모든 사람을 언제나 온유하게 대하도록</strong> 가르치시오.” (<a href="https://bibleox.com/ko/ko-ctb/tit/3/#L1-2">디도 3:1-2</a>)</p></blockquote><blockquote><p>“여러분은 <strong><mark>인간이 세운 모든 제도에 복종하십시오. 그것이 주님을 위하는 것입니다</mark></strong>. <strong><mark>황제는 주권자이니 그에게 복종하고</mark></strong> <strong><mark>총독은</mark></strong> 황제의 임명을 받은 사람으로서 악인을 처벌하고 선인을 표창하는 사람이니 그에게도 복종해야 합니다.” (<a href="https://bibleox.com/ko/ko-ctb/1pet/2/#L13-14">1베드 2:13-14</a>)</p></blockquote><blockquote><p>“모든 사람을 존경하고 형제들을 사랑하며 하느님을 두려워하고 <strong><mark>황제를 존경하십시오</mark></strong>. 하인으로서 일하고 있는 사람은, <strong>주인에게 진정 두려운 마음으로 복종하십시오</strong>. <strong>착하고 너그러운 주인에게뿐만 아니라 고약한 주인에게도</strong> 그렇게 하십시오. 억울하게 고통을 당하더라도 하느님이 계신 것을 생각하며 괴로움을 참으면 그것은 아름다운 일입니다.” (<a href="https://bibleox.com/ko/ko-ctb/1pet/2/#L17-19">1베드 2:17-19</a>)</p></blockquote><blockquote><p>“바울로는 ‘형제 여러분, 나는 그분이 대사제인 줄은 몰랐습니다. <strong><mark>네 백성의 지도자를 욕하지 말라</mark></strong>고 성서에 씌어 있는 것은 나도 잘 알고 있습니다’ 하고 말하였다.” (<a href="https://bibleox.com/ko/ko-ctb/act/23/#L5">사도 23:5</a>)</p></blockquote><blockquote><p>“그리고 소돔과 고모라와 그 주변의 도시들도 그들과 마찬가지로 음란에 흐르고 비정상적인 육욕에 빠졌으므로 영원한 불의 형벌을 받아서 후세의 본보기가 되었습니다. 여러분 가운데 몰래 끼어 든 자들도 이와 마찬가지로 제 정신을 잃고 자기 육체를 더럽히며 하느님의 <strong><mark>권위를 업신여기고 영광스러운 천사들에게 욕설을 퍼붓고</mark></strong> 있습니다.” (<a href="https://bibleox.com/ko/ko-ctb/iud/1/#L7-8">유다 1:7-8</a>) <em>(그리스어에는 “하느님의”와 “천사들”이라는 말이 없습니다: “권위를 업신여기고 영광스러운 이들을 모독합니다”.)</em></p></blockquote><p>하느님께서 주시지 않은 권위는 없고 세상의 권위는 하느님께서 세워 주셨다고 <strong>사도는 이교 숭배가 가득한 로마 제국에 살면서 말합니다</strong>:</p><blockquote><p>“<strong>누구나 자기를 지배하는 권위에 복종해야 합니다</strong>. <strong>하느님께서 주시지 않은 권위는 하나도 없고</strong> <strong><mark>세상의 모든 권위는 다 하느님께서 세워 주신 것</mark></strong>이기 때문입니다. 그러므로 권위를 거역하면 하느님께서 세워 주신 것을 거스리는 자가 되고 거스리는 사람들은 심판을 받게 됩니다. 통치자들은 악을 행하는 자에게나 두려운 존재이지 선을 행하는 사람들에게는 두려울 것이 없습니다. 통치자를 두려워하지 않으려거든 선을 행하십시오. 그러면 그에게서 칭찬을 받을 것입니다. 통치자는 결국 여러분의 이익을 위해서 일하는 <strong>하느님의 심부름꾼입니다</strong>. 그러나 여러분이 잘못을 저지를 때에는 두려워해야 합니다. 그는 공연히 칼을 차고 있는 것이 아닙니다. 그는 <strong>하느님의 심부름꾼으로서 악을 행하는 자들에게 하느님의 벌을 대신 주는</strong> 사람입니다. 그러므로 하느님의 법이 무서워서뿐만 아니라 자기 양심을 따르기 위해서도 <strong>권위에 복종해야 합니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/rim/13/#L1-5">로마 13:1-5</a>)</p></blockquote><p>그리스도께서는 빌라도의 권한이 위에서 온 것임을 가리키십니다:</p><blockquote><p>“예수께서는 이렇게 대답하셨다. ‘<strong><mark>네가 하늘에서 권한을 받지 않았다면 나를 어떻게도 할 수 없을 것이다</mark></strong>. 그러므로 나를 너에게 넘겨 준 사람의 죄가 더 크다.’” (<a href="https://bibleox.com/ko/ko-ctb/in/19/#L11">요한 19:11</a>)</p></blockquote><h2>국가 권력에 대한 복종의 한계</h2><blockquote><p>“그러나 베드로와 요한은 그들에게 ‘<strong>우리가 하느님의 말씀보다 당신들의 말을 듣는 것이 하느님 보시기에 옳은 일이겠는지</strong> 한번 판단해 보시오.” (<a href="https://bibleox.com/ko/ko-ctb/act/4/#L19">사도 4:19</a>)</p></blockquote><blockquote><p>“베드로와 사도들은 이렇게 대답하였다. ‘<strong>사람에게 복종하는 것보다 오히려 하느님께 복종해야 하지 않겠습니까</strong>?” (<a href="https://bibleox.com/ko/ko-ctb/act/5/#L29">사도 5:29</a>)</p></blockquote><h2>세금</h2><blockquote><p>“여러분이 <strong>여러가지 세금을 내는 것</strong>도 이 때문입니다. 통치자들은 그와 같은 직무들을 수행하도록 하느님의 임명을 받은 일꾼들입니다. 그러므로 여러분은 그들에게 <strong>관세를 바쳐야 할 사람에게는 관세를 바치고 두려워해야 할 사람은 두려워하고 존경해야 할 사람은 존경하십시오</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/rim/13/#L6-7">로마 13:6-7</a>)</p></blockquote><h2>구약</h2><blockquote><p>“<strong>내 아들아, 야훼와 임금을 두려워하며</strong> 그들을 거역하지 말아라.” (<a href="https://bibleox.com/ko/ko-ctb/pr/24/#L21">잠언 24:21</a>)</p></blockquote><h3>하느님께서는 외국 왕들을 “고용하여” 벌을 내리십니다</h3><blockquote><p>“<strong>야훼께서 아시리아 왕으로 하여금 너와 너의 겨레와 너의 왕실을 치게 하실 터인즉</strong>, 그 날은 에브라임이 유다와 갈라지던 날 이후로 일찌기 볼 수 없었던 불행한 날이 되리라. &lt;…&gt; 그 날에, <strong><mark>주께서 강 건너 이발사 아시리아 왕을 고용하시어</mark></strong> 머리털과 거웃을 밀고 수염도 깎게 하시리라.” (<a href="https://bibleox.com/ko/ko-ctb/is/7/#L17,20">이사 7:17,20</a>)</p></blockquote><h3>하느님께서는 유다 백성에게 바빌론 왕 느부갓네살에게 복종하라고 명하십니다</h3><blockquote><p>“내가 손을 뻗어 있는 힘을 다하여 땅을 만들고 그 위에 사람과 짐승을 만들었으니, 아무나 내 눈에 드는 사람에게 천하를 맡길 권한이 나에게 있다. 이제 들짐승까지도 그에게 맡겨 부리게 하였다. 그 왕과 그 나라도 섬겨야 한다. 그러니 <strong><mark>바빌론 왕이 씌워 주는 멍에를 메어라. 그 왕 느부갓네살을 섬겨라. 그러지 않는 민족과 나라가 있으면, 나는 그 민족을 전쟁과 기근과 염병으로 벌하여서라도 느부갓네살의 손에 넘겨 주고 말 것이다</mark></strong>. 이는 내 말이라, 어김이 없다. 너희의 예언자들과 박수들과 해몽가들과 점장이들과 마술사들이, 우리가 바빌론 왕을 섬기게 될 리 없다고 하더라도 곧이 듣지 말라. 그자들이 하는 예언은 거짓이다. 그 말을 듣다가는 고향을 멀리 떠나게 되며, 나에게 쫓겨나 망하고 말 것이다. 그러나 <strong><mark>바빌론 왕의 멍에를 메고 그를 섬기는 민족은 제 고장에 남아 농사지으며 살 수 있게 하여 주겠다</mark></strong>. 이는 내 말이라, 어김이 없다.‘ 나는 유다 왕 시드키야에게도 같은 말을 전하였다. ’<strong><mark>너희는 바빌론왕의 멍에를 메어라. 그 왕과 그 백성을 섬겨라. 그러면 모두 죽지 않으리라</mark></strong>. 바빌론 왕을 섬기지 않는 민족에겐 벌을 내리겠다고 하였는데, 너와 너의 백성은 어찌하여 그 벌을 받아 전쟁과 기근과 염병으로 죽으려 하느냐? 바빌론 왕을 섬기게 될 리 없다‘ 고 하는 것들은 거짓 예언을 하는 것들이니, 그 말을 듣지 말아라.” (<a href="https://bibleox.com/ko/ko-ctb/ier/27/#L5-14">예레 27:5-14</a>)</p></blockquote><p>한편 바빌론 왕 느부갓네살은 물론 우상 숭배자였습니다(<a href="https://bibleox.com/ko/ko-ctb/dan/3/#L1-6">다니 3:1-6</a>). 그에게 복종한다는 것은 땅과 재물 같은 외적인 것에 대한 그의 세속 권력을 인정한다는 뜻이었습니다. 느부갓네살이 유다인들에게 우상 숭배를 강요하기 시작하자, 바로 이 불경한 명령이 거부되었습니다:</p><blockquote><p>“느부갓네살이 물었다. ‘사드락, 메삭, 아벳느고, 너희는 <strong>내가 세운 금신상 앞에 절을 하지 않고 내가 위하는 신을 섬기지 않았다니</strong>, 그게 사실이냐?” (<a href="https://bibleox.com/ko/ko-ctb/dan/3/#L14">다니 3:14</a>)</p></blockquote><p>그들은 그를 왕으로 인정하지만 복종하기를 거부합니다:</p><blockquote><p>“사드락과 메삭과 아벳느고가 <strong><mark>느부갓네살왕</mark></strong>에게 대답했다. ‘저희는 <strong><mark>임금님</mark></strong>께서 물으시는 말씀에 대답할 마음이 없습니다. 저희가 섬기는 하느님께서 저희를 구해 주실 힘이 있으시면 임금님께서 소신들을 활활 타는 화덕에 집어 넣으셔도 저희를 거기에서 구해 주실 것입니다. 비록 그렇게 되지 않더라도 저희는 <strong><mark>임금님의 신을 섬기거나 임금님께서 세우신 금신상 앞에 절할 수 없습니다</mark></strong>.’” (<a href="https://bibleox.com/ko/ko-ctb/dan/3/#L16-18">다니 3:16-18</a>)</p></blockquote><p>그 때문에 그들은 화덕에 던져졌습니다:</p><blockquote><p>“사람들은 그들을 도포와 속옷 등 옷을 입고 관을 쓴 채로 묶어서 <strong>활활 타는 화덕 속에 집어 넣었다</strong>. 왕명이 그만큼 급했던 것이다. 화덕이 너무나 달아 있었으므로 사드락과 메삭과 아벳느고를 넣던 사람들이 불길에 타 죽고 말았다. 사드락과 메삭과 아벳느고 세 사람은 꽁꽁 묶인 채 불타는 화덕 속에 던져졌다.” (<a href="https://bibleox.com/ko/ko-ctb/dan/3/#L21-23">다니 3:21-23</a>)</p></blockquote><p>그리고 하느님의 천사가 그들을 해를 입지 않게 지켜 주었습니다:</p><blockquote><p>“그러나 <strong>주의 천사</strong>가 가마로 내려 와서 아자리야와 그의 동료들 곁으로 갔다. 그리고 불꽃을 가마 밖으로 내어 몰고 가마 가운데서 마치 산들바람이나 이슬과 같은 시원한 입김을 그들에게 불어 주었다. 그래서 <strong>불은 그들을 다치지 못하였고</strong> 그들에게는 어떠한 아픔이나 괴로움도 미치지 않았다.” (<a href="https://bibleox.com/ko/ko-ctb/dan/3/#L49-50">다니 3:49-50</a>)</p></blockquote><p>젊은이들은 다른 신들을 섬기라는 이 왕명 하나만을 어겼습니다:</p><blockquote><p>“그런데 느부갓네살왕이 깜짝 놀랄 일이 생겼다. 그는 벌떡 일어나 측근들에게 물었다. ‘꽁꽁 묶어서 화덕에 집어 넣은 것이 세 명 아니었더냐?’ 그들이 대답했다. ‘임금님, 그렇습니다.’ 그들은 불길 가운데를 걸으면서 하느님을 찬양하고 주님께 찬미를 들였다. &lt;…&gt; <strong><mark>사드락과 메삭과 아벳느고가 섬기는 신이야말로 찬양받으실 분이구나</mark></strong>‘ 하며 느부갓네살은 외쳤다. ’저들의 하느님께서, <strong><mark>어명을 어기면서까지 목숨 걸고 당신만을 믿고 저희의 신 아닌 다른 신 앞에서는 절하지도, 섬기지도 않는 이 신하들을 천사를 보내시어 구해 내셨구나</mark></strong>. 이제 나는 영을 내린다. 인종이나 말이 다른 뭇 백성은 사드락과 메삭과 아벳느고가 섬기는 신에게 욕된 말을 하지 못한다. 욕하는 자는 토막내어 죽이고 그의 집은 거름더미로 만들리라. 이처럼 자기를 믿는 자를 구해 줄 수 있는 신은 다시 없으리라.‘” (<a href="https://bibleox.com/ko/ko-ctb/dan/3/#L24,28-29">다니 3:24,28-29</a>)</p></blockquote><h3>하느님께서는 외국 왕들에게서 구해 주셨습니다</h3><blockquote><p>“그러므로 야훼께서 아시리아 왕을 두고 이렇게 말씀하셨소. ‘그는이 성에 들어 오지 못하리라. 이 성에 활을 쏘지도 못하리라. 방패를 가지고 이 성에 쳐들어 오지 못할 것이며 토성을 쌓지도 못하리라. 이 성에는 결코 발을 들여 놓지 못하리라. 이것은 야훼의 말이다. <strong>나 자신을 보아서, 그리고 나의 종 다윗을 보아서 내가 이 성을 지키고 구원하리라</strong>.’‘ 그 날 밤 <strong>야훼의 천사가 나타나 아시리아 진영에서 군인 십 팔만 오천 명을 쳤다</strong>. 아침이 되어 날이 밝았을 때 그들은 모두 시체로발견되었다. 아시리아 왕 산헤립은 막사를 걷어 니느웨로 돌아 가서 그 곳에 머물렀다.” (<a href="https://bibleox.com/ko/ko-ctb/4ts/19/#L32-36">열하 19:32-36</a>)</p></blockquote><h3>벌과 구원은 백성의 경건함에 달려 있었습니다</h3><blockquote><p>“그들은 너희에게 이렇게 전하였다. ‘<strong><mark>너희들은 모두 그 그릇된 길을 버리며, 악한 짓을 더 이상 하지 말고 돌아 오너라</mark></strong>. 그래야만 이 야훼가 너희 조상에게 대대로 살라고 준 땅에서 길이길이 살 수 있으리라. <strong><mark>다른 신들을 받들어 섬기며 예배하면 안 된다</mark></strong>. 너희의 손으로 만든 우상을 섬겨서 나의 분통을 터뜨려 재앙을 받지 않도록 하여라. 나 야훼가 말한다. <strong><mark>너희는 나의 말을 듣지 않고, 너희의 손으로 만든 우상을 섬겼으므로 나의 분통을 터뜨려 재앙을 당하고야 말았다</mark></strong>.’ 그래도 듣지 않으니 이제 만군의 야훼께서 이렇게 말씀하신다. ‘<strong><mark>너희가 내 말을 듣지 않았기 때문에</mark></strong> 나는 내 종 바빌론 왕 느부갓네살을 시켜 북녘의 모든 족속들을 거느리고 쳐들어 와 이 땅에 사는 사람들과 주위에 있는 모든 민족을 <strong>전멸시키고 이 땅을 영원히 쑥밭으로 만들게 하리라</strong>. 사람마다 그 끔직한 모습을 보고 빈정거리리라. 이는 내 말이라, 어김이 없다. 기뻐서 노래하며 흥겹게 노는 소리도, 즐거운 신랑 신부의 소리도, 맷돌질 소리도 더 이상 나지 않으리라. 다시는 등불이 켜지지 않으리라. 이 일대는 끔찍한 폐허가 되고 여기에 살던 민족들은 모두 <strong>칠십 년 동안 바빌론 왕의 종노릇을 할 것이다</strong>. 그 <strong>칠십 년이란 시한이 차면 나는 바빌론 왕과 그 민족의 죄를 벌하여</strong> 바빌론 땅을 영원히 쑥밭으로 만들리라. 이는 내 말이라, 어김이 없다.” (<a href="https://bibleox.com/ko/ko-ctb/ier/25/#L5-12">예레 25:5-12</a>)</p></blockquote><blockquote><p>“임금의 계획을 이루어 주시고, <strong>그의 소원 그대로 채워 주소서</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/ps/20/#L4">시편 20:4</a>)</p></blockquote>'
