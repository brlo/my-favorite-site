  title: 십자가
  copy_cover: true
  body: <h2>구약의 십자가 예표</h2><ol><li><p><a href="https://bibleox.com/ru/ru/w/прообраз-крестной-жертвы-Авраам-и-Исаак">그리스도의 십자가 희생 — 아브라함과 이삭</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/крест-Моисей">십자가 — 모세</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/еврейский-стан-крест">십자가 — 히브리인의 진영</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/крест-и-крещение-переход-через-море">십자가와 세례 — 바다를 건넘</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/крест-Иаков">십자가 — 야곱의 축복</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/EMRx_Крест__буква_тау">십자가 — 예언자의 환시에서 믿는 이들의 이마에 찍힌 글자 타우</a></p></li></ol><h2>십자가 — 승리와 화해의 도구</h2><blockquote><p>“또 범죄와 육체의 무할례로 죽었던 너희를 하나님이 그와 함께 살리시고 우리의 모든 죄를 사하시고 우리를 거스르고 불리하게 하는 법조문으로 쓴 증서를 지우시고 제하여 버리사 <strong>십자가에 못 박으시고</strong> <strong>통치자들과 권세들을 무력화하여 드러내어 구경거리로 삼으시고</strong> <strong>십자가로 그들을 이기셨느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/kol/2/#L13-15">골 2:13-15</a>)</p></blockquote><blockquote><p>“또 <strong>십자가로</strong> 이 둘을 한 몸으로 <strong>하나님과 화목하게 하려 하심이라</strong> <strong>원수 된 것을 십자가로 소멸하시고</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ef/2/#L16">엡 2:16</a>)</p></blockquote><blockquote><p>“<strong>그의 십자가의 피로 화평을 이루사</strong> 만물 곧 땅에 있는 것들이나 하늘에 있는 것들이 그로 말미암아 자기와 화목하게 되기를 기뻐하심이라” (<a href="https://bibleox.com/ko/ko-nkrv/kol/1/#L20">골 1:20</a>)</p></blockquote><h2>십자가는 제단이며 위대한 성물입니다</h2><p>주 예수 그리스도께서는 제단인 십자가에서 당신 자신을 제물로 바치셨습니다:</p><blockquote><p>“이와 같이 그리스도도 많은 사람의 죄를 담당하시려고 단번에 드리신 바 되셨고 구원에 이르게 하기 위하여 죄와 상관 없이 자기를 바라는 자들에게 두 번째 나타나시리라” (<a href="https://bibleox.com/ko/ko-nkrv/evr/9/#L28">히 9:28</a>)</p></blockquote><p>이를 확인해 주는 것이 그리스도의 십자가 희생의 구약적 예표, 곧 이삭의 희생입니다. 아브라함(아버지)이 이삭(외아들)을 제물로 바칩니다:</p><blockquote><p>“여호와께서 이르시되 네 아들 <strong>네 사랑하는 독자 이삭</strong>을 데리고 모리아 땅으로 가서 <strong>내가 네게 일러 준 한 산 거기서 그를 번제로 드리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gen/22/#L2">창 22:2</a>)</p></blockquote><blockquote><p>“하나님이 세상을 이처럼 사랑하사 <strong>독생자를 주셨으니</strong> 이는 그를 믿는 자마다 멸망하지 않고 영생을 얻게 하려 하심이라” (<a href="https://bibleox.com/ko/ko-nkrv/in/3/#L16">요 3:16</a>)</p></blockquote><p>이삭은 자기가 바쳐질 제물의 나무를 지고 산에 오릅니다:</p><blockquote><p>“아브라함이 이에 번제 나무를 가져다가 <strong>그의 아들 이삭에게 지우고</strong> 자기는 불과 칼을 손에 들고 두 사람이 동행하더니” (<a href="https://bibleox.com/ko/ko-nkrv/gen/22/#L6">창 22:6</a>)</p></blockquote><blockquote><p>“이에 예수를 십자가에 못 박도록 그들에게 넘겨 주니라 그들이 예수를 맡으매 예수께서 <strong>자기의 십자가를 지시고</strong> 해골(히브리 말로 골고다)이라 하는 곳에 나가시니 그들이 거기서 예수를 십자가에 못 박을새 다른 두 사람도 그와 함께 좌우편에 못 박으니 예수는 가운데 있더라” (<a href="https://bibleox.com/ko/ko-nkrv/in/19/#L16-18">요 19:16-18</a>)</p></blockquote><h3>아브라함은 이삭을 제단에 올렸습니다</h3><blockquote><p>“우리 조상 아브라함이 <strong>그 아들 이삭을 제단에 바칠</strong> 때에 행함으로 의롭다 하심을 받은 것이 아니냐” (<a href="https://bibleox.com/ko/ko-nkrv/iak/2/#L21">약 2:21</a>)</p></blockquote><blockquote><p>“그가 하나님께서 정하신 뜻과 미리 아신 대로 내준 바 되었거늘 너희가 법 없는 자들의 손을 빌려 <strong>못 박아 죽였으나</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/act/2/#L23">행 2:23</a>)</p></blockquote><p>십자가에서, 제단에서처럼, 인류의 구원이 이루어집니다:</p><blockquote><p>“또 <strong>십자가로</strong> 이 둘을 한 몸으로 하나님과 화목하게 하려 하심이라 <strong>원수 된 것을 십자가로 소멸하시고</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ef/2/#L16">엡 2:16</a>)</p></blockquote><h3>제단은 지극히 거룩합니다</h3><blockquote><p>“너는 이레 동안 제단을 위하여 속죄하여 거룩하게 하라 그리하면 <strong>지극히 거룩한 제단이 되리니 제단에 접촉하는 모든 것이 거룩하리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ish/29/#L37">출 29:37</a>)</p></blockquote><h2>복음서</h2><blockquote><p>“예수께서 그를 보시고 사랑하사 이르시되 네게 아직도 한 가지 부족한 것이 있으니 가서 네게 있는 것을 다 팔아 가난한 자들에게 주라 그리하면 하늘에서 보화가 네게 있으리라 그리고 <strong>와서 나를 따르라</strong> 하시니” (<a href="https://bibleox.com/ko/ko-nkrv/mk/10/#L21">막 10:21</a>) <em>(비잔틴 본문(다수 사본)에는 “십자가를 지고”가 있습니다.)</em></p></blockquote><blockquote><p>“무리와 제자들을 불러 이르시되 누구든지 나를 따라오려거든 자기를 부인하고 <strong>자기 십자가를 지고</strong> 나를 따를 것이니라” (<a href="https://bibleox.com/ko/ko-nkrv/mk/8/#L34">막 8:34</a>)</p></blockquote><blockquote><p>“또 <strong>자기 십자가를 지고 나를 따르지 않는 자</strong>도 내게 합당하지 아니하니라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/10/#L38">마 10:38</a>)</p></blockquote><blockquote><p>“이에 예수께서 제자들에게 이르시되 누구든지 나를 따라오려거든 자기를 부인하고 <strong>자기 십자가를 지고</strong> 나를 따를 것이니라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/16/#L24">마 16:24</a>)</p></blockquote><blockquote><p>“또 무리에게 이르시되 아무든지 나를 따라오려거든 자기를 부인하고 날마다 <strong>제 십자가를 지고</strong> 나를 따를 것이니라” (<a href="https://bibleox.com/ko/ko-nkrv/lk/9/#L23">눅 9:23</a>)</p></blockquote><blockquote><p>“누구든지 <strong>자기 십자가를 지고 나를 따르지 않는 자</strong>도 능히 내 제자가 되지 못하리라” (<a href="https://bibleox.com/ko/ko-nkrv/lk/14/#L27">눅 14:27</a>)</p></blockquote><blockquote><p>“이르되 성전을 헐고 사흘에 짓는 자여 네가 만일 하나님의 아들이어든 자기를 구원하고 <strong>십자가에서 내려오라</strong> 하며” (<a href="https://bibleox.com/ko/ko-nkrv/mf/27/#L40">마 27:40</a>)</p></blockquote><blockquote><p>“그가 남은 구원하였으되 자기는 구원할 수 없도다 그가 이스라엘의 왕이로다 <strong>지금 십자가에서 내려올지어다</strong> 그리하면 우리가 믿겠노라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/27/#L42">마 27:42</a>)</p></blockquote><blockquote><p>“네가 너를 구원하여 <strong>십자가에서 내려오라</strong> 하고” (<a href="https://bibleox.com/ko/ko-nkrv/mk/15/#L30">막 15:30</a>)</p></blockquote><blockquote><p>“이스라엘의 왕 그리스도가 <strong>지금 십자가에서 내려와 우리가 보고 믿게 할지어다</strong> 하며 함께 십자가에 못 박힌 자들도 예수를 욕하더라” (<a href="https://bibleox.com/ko/ko-nkrv/mk/15/#L32">막 15:32</a>)</p></blockquote><h2>사도</h2><blockquote><p>“믿음의 주요 또 온전하게 하시는 이인 예수를 바라보자 그는 그 앞에 있는 기쁨을 위하여 <strong>십자가를 참으사</strong> 부끄러움을 개의치 아니하시더니 하나님 보좌 우편에 앉으셨느니라” (<a href="https://bibleox.com/ko/ko-nkrv/evr/12/#L2">히 12:2</a>)</p></blockquote><blockquote><p>“그러나 내게는 <strong>우리 주 예수 그리스도의 십자가 외에 결코 자랑할 것이 없으니</strong> 그리스도로 말미암아 세상이 나를 대하여 십자가에 못 박히고 내가 또한 세상을 대하여 그러하니라” (<a href="https://bibleox.com/ko/ko-nkrv/gal/6/#L14">갈 6:14</a>)</p></blockquote><blockquote><p>“그리스도께서 나를 보내심은 세례를 베풀게 하려 하심이 아니요 오직 복음을 전하게 하려 하심이로되 말의 지혜로 하지 아니함은 <strong>그리스도의 십자가가 헛되지 않게 하려 함이라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/1/#L17">고전 1:17</a>)</p></blockquote><blockquote><p>“<strong>십자가의 도가 멸망하는 자들에게는 미련한 것이요</strong> 구원을 받는 우리에게는 하나님의 능력이라” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/1/#L18">고전 1:18</a>)</p></blockquote><blockquote><p>“무릇 육체의 모양을 내려 하는 자들이 억지로 너희에게 할례를 받게 함은 그들이 <strong>그리스도의 십자가로 말미암아 박해를 면하려 함뿐이라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gal/6/#L12">갈 6:12</a>)</p></blockquote><blockquote><p>“형제들아 내가 지금까지 할례를 전한다면 어찌하여 지금까지 박해를 받으리요 그리하였으면 <strong>십자가의 걸림돌</strong>이 제거되었으리니” (<a href="https://bibleox.com/ko/ko-nkrv/gal/5/#L11">갈 5:11</a>)</p></blockquote><blockquote><p>“또 <strong>십자가로</strong> 이 둘을 한 몸으로 하나님과 화목하게 하려 하심이라 <strong>원수 된 것을 십자가로 소멸하시고</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ef/2/#L16">엡 2:16</a>)</p></blockquote><blockquote><p>“내가 여러 번 너희에게 말하였거니와 이제도 눈물을 흘리며 말하노니 여러 사람들이 <strong>그리스도의 십자가의 원수</strong>로 행하느니라” (<a href="https://bibleox.com/ko/ko-nkrv/fil/3/#L18">빌 3:18</a>)</p></blockquote><blockquote><p>“<strong>그의 십자가의 피로 화평을 이루사</strong> 만물 곧 땅에 있는 것들이나 하늘에 있는 것들이 그로 말미암아 자기와 화목하게 되기를 기뻐하심이라” (<a href="https://bibleox.com/ko/ko-nkrv/kol/1/#L20">골 1:20</a>)</p></blockquote><blockquote><p>“우리를 거스르고 불리하게 하는 법조문으로 쓴 증서를 지우시고 제하여 버리사 <strong>십자가에 못 박으시고</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/kol/2/#L14">골 2:14</a>)</p></blockquote>
