- src: отношение-Церкви-к-государству
  path: Sg3p_국가에_대한_교회의_태도
  title: 국가(권력)에 대한 교회의 태도
  copy_cover: true
  body: <h2>권력자를 위한 기도</h2><blockquote><p>“그러므로 내가 첫째로 <strong>권하노니</strong> 모든 사람을 위하여 간구와 기도와 도고와 감사를 하되 <strong><mark>임금들과 높은 지위에 있는 모든 사람을 위하여 하라</mark></strong> 이는 우리가 모든 경건과 단정함으로 고요하고 평안한 생활을 하려 함이라 이것이 우리 구주 하나님 앞에 선하고 받으실 만한 것이니 하나님은 모든 사람이 구원을 받으며 진리를 아는 데에 이르기를 원하시느니라” (<a href="https://bibleox.com/ko/ko-nkrv/1tim/2/#L1-4">딤전 2:1-4</a>)</p></blockquote><h2>국가 권력에 대한 복종</h2><blockquote><p>“너는 그들로 하여금 <strong><mark>통치자들과 권세 잡은 자들에게 복종하며 순종하며</mark></strong> 모든 선한 일 행하기를 준비하게 하며 아무도 비방하지 말며 다투지 말며 관용하며 <strong>범사에 온유함을 모든 사람에게 나타낼 것을</strong> 기억하게 하라” (<a href="https://bibleox.com/ko/ko-nkrv/tit/3/#L1-2">딛 3:1-2</a>)</p></blockquote><blockquote><p>“<strong><mark>인간의 모든 제도를 주를 위하여 순종하되</mark></strong> 혹은 <strong><mark>위에 있는 왕이나</mark></strong> 혹은 그가 악행하는 자를 징벌하고 선행하는 자를 포상하기 위하여 보낸 <strong><mark>총독에게 하라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1pet/2/#L13-14">벧전 2:13-14</a>)</p></blockquote><blockquote><p>“뭇 사람을 공경하며 형제를 사랑하며 하나님을 두려워하며 <strong><mark>왕을 존대하라</mark></strong> 사환들아 <strong>범사에 두려워함으로 주인들에게 순종하되</strong> <strong>선하고 관용하는 자들에게만 아니라 또한 까다로운 자들에게도</strong> 그리하라 부당하게 고난을 받아도 하나님을 생각함으로 슬픔을 참으면 이는 아름다우나” (<a href="https://bibleox.com/ko/ko-nkrv/1pet/2/#L17-19">벧전 2:17-19</a>)</p></blockquote><blockquote><p>“바울이 이르되 형제들아 나는 그가 대제사장인 줄 알지 못하였노라 기록하였으되 <strong><mark>너의 백성의 관리를 비방하지 말라</mark></strong> 하였느니라 하더라” (<a href="https://bibleox.com/ko/ko-nkrv/act/23/#L5">행 23:5</a>)</p></blockquote><blockquote><p>“소돔과 고모라와 그 이웃 도시들도 그들과 같은 행동으로 음란하며 다른 육체를 따라 가다가 영원한 불의 형벌을 받음으로 거울이 되었느니라 그러한데 꿈꾸는 이 사람들도 그와 같이 육체를 더럽히며 <strong><mark>권위를 업신여기며 영광을 비방하는도다</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/iud/1/#L7-8">유 1:7-8</a>)</p></blockquote><p>하느님께서 주시지 않은 권위는 없고 세상의 권위는 하느님께서 세워 주셨다고 <strong>사도는 이교 숭배가 가득한 로마 제국에 살면서 말합니다</strong>:</p><blockquote><p>“<strong>각 사람은 위에 있는 권세들에게 복종하라</strong> <strong>권세는 하나님으로부터 나지 않음이 없나니</strong> <strong><mark>모든 권세는 다 하나님께서 정하신 바라</mark></strong> 그러므로 권세를 거스르는 자는 하나님의 명을 거스름이니 거스르는 자들은 심판을 자취하리라 다스리는 자들은 선한 일에 대하여 두려움이 되지 않고 악한 일에 대하여 되나니 네가 권세를 두려워하지 아니하려느냐 선을 행하라 그리하면 그에게 칭찬을 받으리라 그는 <strong>하나님의 사역자가 되어 네게 선을 베푸는 자니라</strong> 그러나 네가 악을 행하거든 두려워하라 그가 공연히 칼을 가지지 아니하였으니 곧 <strong>하나님의 사역자가 되어 악을 행하는 자에게 진노하심을 따라 보응하는 자니라</strong> 그러므로 <strong>복종하지 아니할 수 없으니</strong> 진노 때문에 할 것이 아니라 양심을 따라 할 것이라” (<a href="https://bibleox.com/ko/ko-nkrv/rim/13/#L1-5">롬 13:1-5</a>)</p></blockquote><p>그리스도께서는 빌라도의 권한이 위에서 온 것임을 가리키십니다:</p><blockquote><p>“예수께서 대답하시되 <strong><mark>위에서 주지 아니하셨더라면 나를 해할 권한이 없었으리니</mark></strong> 그러므로 나를 네게 넘겨 준 자의 죄는 더 크다 하시니라” (<a href="https://bibleox.com/ko/ko-nkrv/in/19/#L11">요 19:11</a>)</p></blockquote><h2>국가 권력에 대한 복종의 한계</h2><blockquote><p>“베드로와 요한이 대답하여 이르되 <strong>하나님 앞에서 너희의 말을 듣는 것이 하나님의 말씀을 듣는 것보다 옳은가 판단하라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/act/4/#L19">행 4:19</a>)</p></blockquote><blockquote><p>“베드로와 사도들이 대답하여 이르되 <strong>사람보다 하나님께 순종하는 것이 마땅하니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/act/5/#L29">행 5:29</a>)</p></blockquote><h2>세금</h2><blockquote><p>“너희가 <strong>조세를 바치는 것</strong>도 이로 말미암음이라 그들이 하나님의 일꾼이 되어 바로 이 일에 항상 힘쓰느니라 모든 자에게 줄 것을 주되 조세를 받을 자에게 조세를 바치고 <strong>관세를 받을 자에게 관세를 바치고 두려워할 자를 두려워하며 존경할 자를 존경하라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/rim/13/#L6-7">롬 13:6-7</a>)</p></blockquote><h2>구약</h2><blockquote><p>“<strong>내 아들아 여호와와 왕을 경외하고</strong> 반역자와 더불어 사귀지 말라” (<a href="https://bibleox.com/ko/ko-nkrv/pr/24/#L21">잠 24:21</a>)</p></blockquote><h3>하느님께서는 외국 왕들을 “고용하여” 벌을 내리십니다</h3><blockquote><p>“<strong>여호와께서</strong> 에브라임이 유다를 떠날 때부터 당하여 보지 못한 날을 <strong>너와 네 백성과 네 아버지 집에 임하게 하시리니 곧 앗수르 왕이 오는 날이니라</strong> &lt;…&gt; 그 날에는 <strong><mark>주께서 하수 저쪽에서 세내어 온 삭도 곧 앗수르 왕으로</mark></strong> 네 백성의 머리 털과 발 털을 미실 것이요 수염도 깎으시리라” (<a href="https://bibleox.com/ko/ko-nkrv/is/7/#L17,20">사 7:17,20</a>)</p></blockquote><h3>하느님께서는 유다 백성에게 바벨론 왕 느부갓네살에게 복종하라고 명하십니다</h3><blockquote><p>“나는 내 큰 능력과 나의 쳐든 팔로 땅과 지상에 있는 사람과 짐승들을 만들고 내가 보기에 옳은 사람에게 그것을 주었노라 이제 내가 이 모든 땅을 내 종 바벨론의 왕 느부갓네살의 손에 주고 또 들짐승들을 그에게 주어서 섬기게 하였나니 모든 나라가 그와 그의 아들과 손자를 그 땅의 기한이 이르기까지 섬기리라 또한 많은 나라들과 큰 왕들이 그 자신을 섬기리라 여호와의 말씀이니라 <strong><mark>바벨론의 왕 느부갓네살을 섬기지 아니하며 그 목으로 바벨론의 왕의 멍에를 메지 아니하는 백성과 나라는 내가 그들이 멸망하기까지 칼과 기근과 전염병으로 그 민족을 벌하리라</mark></strong> 너희는 너희 선지자나 복술가나 꿈꾸는 자나 술사나 요술자가 이르기를 너희가 바벨론의 왕을 섬기게 되지 아니하리라 하여도 너희는 듣지 말라 그들은 너희에게 거짓을 예언하여 너희가 너희 땅에서 멀리 떠나게 하며 또 내가 너희를 몰아내게 하며 너희를 멸망하게 하느니라 그러나 <strong><mark>그 목으로 바벨론의 왕의 멍에를 메고 그를 섬기는 나라는 내가 그들을 그 땅에 머물러 밭을 갈며 거기서 살게 하리라</mark></strong> 하셨다 하라 여호와의 말씀이니라 하시니라 내가 이 모든 말씀대로 유다의 왕 시드기야에게 전하여 이르되 <strong><mark>왕과 백성은 바벨론 왕의 멍에를 목에 메고 그와 그의 백성을 섬기소서 그리하면 사시리라</mark></strong> 어찌하여 당신과 당신의 백성이 여호와께서 바벨론의 왕을 섬기지 아니하는 나라에 대하여 하신 말씀과 같이 칼과 기근과 전염병에 죽으려 하나이까 그러므로 당신들은 바벨론의 왕을 섬기게 되지 아니하리라 하는 선지자의 말을 듣지 마소서 그들은 거짓을 예언함이니이다” (<a href="https://bibleox.com/ko/ko-nkrv/ier/27/#L5-14">렘 27:5-14</a>)</p></blockquote><p>한편 바벨론 왕 느부갓네살은 물론 우상 숭배자였습니다(<a href="https://bibleox.com/ko/ko-nkrv/dan/3/#L1-6">단 3:1-6</a>). 그에게 복종한다는 것은 땅과 재물 같은 외적인 것에 대한 그의 세속 권력을 인정한다는 뜻이었습니다. 느부갓네살이 유대인들에게 우상 숭배를 강요하기 시작하자, 바로 이 불경한 명령이 거부되었습니다:</p><blockquote><p>“느부갓네살이 그들에게 물어 이르되 사드락, 메삭, 아벳느고야 <strong>너희가 내 신을 섬기지 아니하며 내가 세운 금 신상에게 절하지 아니한다</strong> 하니 사실이냐” (<a href="https://bibleox.com/ko/ko-nkrv/dan/3/#L14">단 3:14</a>)</p></blockquote><p>그들은 그를 왕으로 인정하지만 복종하기를 거부합니다:</p><blockquote><p>“사드락과 메삭과 아벳느고가 왕에게 대답하여 이르되 <strong><mark>느부갓네살이여</mark></strong> 우리가 이 일에 대하여 왕에게 대답할 필요가 없나이다 <strong><mark>왕이여</mark></strong> 우리가 섬기는 하나님이 계시다면 우리를 맹렬히 타는 풀무불 가운데에서 능히 건져내시겠고 왕의 손에서도 건져내시리이다 그렇게 하지 아니하실지라도 왕이여 <strong><mark>우리가 왕의 신들을 섬기지도 아니하고 왕이 세우신 금 신상에게 절하지도 아니할 줄을 아옵소서</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/dan/3/#L16-18">단 3:16-18</a>)</p></blockquote><p>그 때문에 그들은 화덕에 던져졌습니다:</p><blockquote><p>“그러자 그 사람들을 겉옷과 속옷과 모자와 다른 옷을 입은 채 결박하여 <strong>맹렬히 타는 풀무불 가운데에 던졌더라</strong> 왕의 명령이 엄하고 풀무불이 심히 뜨거우므로 불꽃이 사드락과 메삭과 아벳느고를 붙든 사람을 태워 죽였고 이 세 사람 사드락과 메삭과 아벳느고는 결박된 채 맹렬히 타는 풀무불 가운데에 떨어졌더라” (<a href="https://bibleox.com/ko/ko-nkrv/dan/3/#L21-23">단 3:21-23</a>)</p></blockquote><p>그리고 하느님의 천사가 그들을 해를 입지 않게 지켜 주었습니다:</p><blockquote><p>“<strong>주의 천사가</strong> 아자리야와 그 동료들과 함께 화덕으로 내려와서 불꽃을 화덕 밖으로 몰아내고, 화덕 한가운데를 이슬 머금은 바람이 부는 것처럼 만들었다. <strong>불은 그들에게 전혀 닿지 않았고</strong>, 그들을 해치거나 괴롭히지도 않았다” (<a href="https://bibleox.com/ko/gr-lxx-byz/dan/3/#L49-50">단 3:49-50</a>, 그리스어에서 번역)</p></blockquote><p>젊은이들은 다른 신들을 섬기라는 이 왕명 하나만을 어겼습니다:</p><blockquote><p>“그 때에 느부갓네살 왕이 놀라 급히 일어나서 모사들에게 물어 이르되 우리가 결박하여 불 가운데에 던진 자는 세 사람이 아니었느냐 하니 그들이 왕에게 대답하여 이르되 왕이여 옳소이다 하더라 &lt;…&gt; 느부갓네살이 말하여 이르되 <strong><mark>사드락과 메삭과 아벳느고의 하나님을 찬송할지로다</mark></strong> <strong><mark>그가 그의 천사를 보내사 자기를 의뢰하고 그들의 몸을 바쳐 왕의 명령을 거역하고 그 하나님 밖에는 다른 신을 섬기지 아니하며 그에게 절하지 아니한 종들을 구원하셨도다</mark></strong> 그러므로 내가 이제 조서를 내리노니 각 백성과 각 나라와 각 언어를 말하는 자가 모두 사드락과 메삭과 아벳느고의 하나님께 경솔히 말하거든 그 몸을 쪼개고 그 집을 거름터로 삼을지니 이는 이같이 사람을 구원할 다른 신이 없음이니라 하더라” (<a href="https://bibleox.com/ko/ko-nkrv/dan/3/#L24,28-29">단 3:24,28-29</a>)</p></blockquote><h3>하느님께서는 외국 왕들에게서 구해 주셨습니다</h3><blockquote><p>“그러므로 여호와께서 앗수르 왕을 가리켜 이르시기를 그가 이 성에 이르지 못하며 이리로 화살을 쏘지 못하며 방패를 성을 향하여 세우지 못하며 치려고 토성을 쌓지도 못하고 오던 길로 돌아가고 이 성에 이르지 못하리라 하셨으니 이는 여호와의 말씀이시라 <strong>내가 나와 나의 종 다윗을 위하여 이 성을 보호하여 구원하리라</strong> 하셨나이다 하였더라 이 밤에 <strong>여호와의 사자가 나와서 앗수르 진영에서 군사 십팔만 오천 명을 친지라</strong> 아침에 일찍이 일어나 보니 다 송장이 되었더라 앗수르 왕 산헤립이 떠나 돌아가서 니느웨에 거주하더니” (<a href="https://bibleox.com/ko/ko-nkrv/4ts/19/#L32-36">왕하 19:32-36</a>)</p></blockquote><h3>벌과 구원은 백성의 경건함에 달려 있었습니다</h3><blockquote><p>“그가 이르시기를 <strong><mark>너희는 각자의 악한 길과 악행을 버리고 돌아오라</mark></strong> 그리하면 나 여호와가 너희와 너희 조상들에게 영원부터 영원까지 준 그 땅에 살리라 <strong><mark>너희는 다른 신을 따라다니며 섬기거나 경배하지 말며</mark></strong> 너희 손으로 만든 것으로써 나의 노여움을 일으키지 말라 그리하면 내가 너희를 해하지 아니하리라 하였으나 <strong><mark>너희가 내 말을 순종하지 아니하고 너희 손으로 만든 것으로써 나의 노여움을 일으켜 스스로 해하였느니라</mark></strong> 여호와의 말씀이니라 그러므로 만군의 여호와께서 이와 같이 말씀하시니라 <strong><mark>너희가 내 말을 듣지 아니하였느니라</mark></strong> 보라 내가 북쪽 모든 종족과 내 종 바벨론의 왕 느부갓네살을 불러다가 이 땅과 그 주민과 사방 모든 나라를 쳐서 <strong>진멸하여</strong> 그들을 놀램과 비웃음 거리가 되게 하며 땅으로 영원한 폐허가 되게 할 것이라 여호와의 말씀이니라 내가 그들 중에서 기뻐하는 소리와 즐거워하는 소리와 신랑의 소리와 신부의 소리와 맷돌 소리와 등불 빛이 끊어지게 하리니 이 모든 땅이 폐허가 되어 놀랄 일이 될 것이며 이 민족들은 <strong>칠십 년 동안 바벨론의 왕을 섬기리라</strong> 여호와의 말씀이니라 <strong>칠십 년이 끝나면 내가 바벨론의 왕과 그의 나라와 갈대아인의 땅을 그 죄악으로 말미암아 벌하여</strong> 영원히 폐허가 되게 하되” (<a href="https://bibleox.com/ko/ko-nkrv/ier/25/#L5-12">렘 25:5-12</a>)</p></blockquote><blockquote><p>“<strong>네 마음의 소원대로 허락하시고</strong> 네 모든 계획을 이루어 주시기를 원하노라” (<a href="https://bibleox.com/ko/ko-nkrv/ps/20/#L4">시 20:4</a>)</p></blockquote>
