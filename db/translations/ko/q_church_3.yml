  title: 아버지와 스승이라 불리지 말라
  copy_cover: true
  body: '<h2>그리스도께서는 스승과 아버지라 불리지 말라고 명하십니다</h2><blockquote><p>“서기관들과 바리새인들이 모세의 자리에 앉았으니 &lt;…&gt; 그들의 모든 행위를 사람에게 보이고자 하나니 곧 그 경문 띠를 넓게 하며 옷술을 길게 하고 잔치의 윗자리와 회당의 높은 자리와 시장에서 문안 받는 것과 <strong>사람에게 랍비라 칭함을 받는 것을 좋아하느니라</strong> <strong><mark>그러나 너희는 랍비라 칭함을 받지 말라</mark></strong> 너희 선생은 하나요 너희는 다 형제니라 <strong><mark>땅에 있는 자를 아버지라 하지 말라</mark></strong> 너희의 아버지는 한 분이시니 곧 하늘에 계신 이시니라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/23/#L2,5-9">마 23:2,5-9</a>)</p></blockquote><p>이 말씀은 지체를 잘라 내라는 말씀(<a href="https://bibleox.com/ko/ko-nkrv/mf/5/#L29-30">마 5:29-30</a>)이나, 그리스도께서 평화가 아니라 칼을 주러 오셔서 가족을 갈라놓으신다는 말씀(<a href="https://bibleox.com/ko/ko-nkrv/mf/10/#L34-35">마 10:34-35</a>)처럼 글자 그대로의 뜻이 아닙니다. 믿는 이들이 “스승, 스승”이라 불리기를 바라지 않고(<a href="https://bibleox.com/ko/ko-nkrv/mf/23/#L7">마 23:7</a>), 그런 호칭을 받아도 교만해져 자신을 높이지 않으며, 가장 높은 권위이자 참된 아버지와 스승은 하느님이심을 깨닫도록 겸손을 가르치시는 것입니다.</p><p>문맥에서 출발하여 뜻을 바르게 이해하는 것이 중요합니다. 그렇지 않으면 하느님께서 계명에서 부모라고 부르시는데도(<a href="https://bibleox.com/ko/ko-nkrv/vtor/5/#L16">신 5:16</a>) 자녀가 부모를 아버지라고 부를 수 없게 됩니다. 교회에 분명히 교사들이 있는데도 어떤 교사도 교사라고 부를 수 없게 됩니다. 성경을 보면 이런 말을 피하지 않았음을 알 수 있습니다.</p><h2>스승(교사)</h2><h3>그리스도께서는 바리새인 니고데모를 이스라엘의 선생이라고 부르십니다</h3><blockquote><p>“예수께서 그에게 대답하여 이르시되 너는 <strong><mark>이스라엘의 선생</mark></strong>으로서 이러한 것들을 알지 못하느냐” (<a href="https://bibleox.com/ko/ko-nkrv/in/3/#L10">요 3:10</a>)</p></blockquote><h3>사도는 자신이 교사로 임명되었다고 말합니다</h3><blockquote><p>“<strong><mark>내가</mark></strong> 이 복음을 위하여 선포자와 사도와 <strong><mark>교사로 세우심을 입었노라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2tim/1/#L11">딤후 1:11</a>)</p></blockquote><blockquote><p>“그가 모든 사람을 위하여 자기를 대속물로 주셨으니 기약이 이르러 주신 증거니라 이를 위하여 <strong><mark>내가</mark></strong> 전파하는 자와 사도로 세움을 입은 것은 참말이요 거짓말이 아니니 믿음과 진리 안에서 내가 <strong><mark>이방인의 스승이 되었노라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1tim/2/#L6-7">딤전 2:6-7</a>)</p></blockquote><h3>하느님께서는 교회에 교사들을 세우셨습니다</h3><blockquote><p>“<strong><mark>하나님이 교회 중에 몇을 세우셨으니</mark></strong> 첫째는 사도요 둘째는 선지자요 <strong><mark>셋째는 교사요</mark></strong> 그 다음은 능력을 행하는 자요 그 다음은 병 고치는 은사와 서로 돕는 것과 다스리는 것과 각종 방언을 말하는 것이라” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/12/#L28">고전 12:28</a>)</p></blockquote><blockquote><p>“<strong><mark>그가</mark></strong> 어떤 사람은 사도로, 어떤 사람은 선지자로, 어떤 사람은 복음 전하는 자로, 어떤 사람은 <strong><mark>목사와 교사로 삼으셨으니</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ef/4/#L11">엡 4:11</a>)</p></blockquote><blockquote><p>“혹 섬기는 일이면 섬기는 일로, 혹 <strong><mark>가르치는 자면 가르치는 일로</mark></strong>,” (<a href="https://bibleox.com/ko/ko-nkrv/rim/12/#L7">롬 12:7</a>)</p></blockquote><blockquote><p>“때가 오래 되었으므로 <strong><mark>너희가 마땅히 선생이 되었을 터인데</mark></strong> 너희가 다시 하나님의 말씀의 초보에 대하여 누구에게서 가르침을 받아야 할 처지이니 단단한 음식은 못 먹고 젖이나 먹어야 할 자가 되었도다” (<a href="https://bibleox.com/ko/ko-nkrv/evr/5/#L12">히 5:12</a>)</p></blockquote><h3>교사의 책임에 관한 경고</h3><blockquote><p>“내 형제들아 <strong><mark>너희는 선생된 우리가 더 큰 심판을 받을 줄 알고 선생이 많이 되지 말라</mark></strong> 우리가 다 실수가 많으니 만일 말에 실수가 없는 자라면 곧 온전한 사람이라 능히 온 몸도 굴레 씌우리라” (<a href="https://bibleox.com/ko/ko-nkrv/iak/3/#L1-2">약 3:1-2</a>)</p></blockquote><h2>아버지</h2><h3>사도는 자신을 아버지라 하고 믿는 이들을 자녀라고 부릅니다</h3><blockquote><p>“내가 너희를 부끄럽게 하려고 이것을 쓰는 것이 아니라 오직 너희를 내 사랑하는 자녀 같이 권하려 하는 것이라 <strong><mark>그리스도 안에서 일만 스승이 있으되 아버지는 많지 아니하니 그리스도 예수 안에서 내가 복음으로써 너희를 낳았음이라</mark></strong> &lt;…&gt; 이로 말미암아 내가 주 안에서 <strong><mark>내 사랑하고 신실한 아들</mark></strong> 디모데를 너희에게 보내었으니 그가 너희로 하여금 그리스도 예수 안에서 나의 행사 곧 내가 각처 각 교회에서 가르치는 것을 생각나게 하리라” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/4/#L14-15,17">고전 4:14-15,17</a>)</p></blockquote><blockquote><p>“<strong><mark>나의 자녀들아</mark></strong> 너희 속에 그리스도의 형상을 이루기까지 다시 너희를 위하여 <strong>해산하는 수고</strong>를 하노니” (<a href="https://bibleox.com/ko/ko-nkrv/gal/4/#L19">갈 4:19</a>)</p></blockquote><blockquote><p>“<strong><mark>나의 자녀들아</mark></strong> 내가 이것을 너희에게 씀은 너희로 죄를 범하지 않게 하려 함이라 만일 누가 죄를 범하여도 아버지 앞에서 우리에게 대언자가 있으니 곧 의로우신 예수 그리스도시라” (<a href="https://bibleox.com/ko/ko-nkrv/1in/2/#L1">요일 2:1</a>)</p></blockquote><blockquote><p>“<strong><mark>자녀들아</mark></strong> 우리가 말과 혀로만 사랑하지 말고 행함과 진실함으로 하자” (<a href="https://bibleox.com/ko/ko-nkrv/1in/3/#L18">요일 3:18</a>)</p></blockquote><blockquote><p>“내가 <strong><mark>내 자녀들</mark></strong>이 진리 안에서 행한다 함을 듣는 것보다 더 기쁜 일이 없도다” (<a href="https://bibleox.com/ko/ko-nkrv/3in/1/#L4">요삼 1:4</a>)</p></blockquote><blockquote><p>“<strong>갇힌 중에서</strong> <strong><mark>낳은 아들</mark></strong> 오네시모를 위하여 네게 간구하노라” (<a href="https://bibleox.com/ko/ko-nkrv/fm/1/#L10">몬 1:10</a>)</p></blockquote><h3>아브라함은 믿는 이들의 아버지입니다</h3><blockquote><p>“그러므로 상속자가 되는 그것이 은혜에 속하기 위하여 믿음으로 되나니 이는 그 약속을 그 모든 후손에게 굳게 하려 하심이라 율법에 속한 자에게뿐만 아니라 아브라함의 믿음에 속한 자에게도 그러하니 <strong><mark>아브라함은 우리 모든 사람의 조상이라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/rim/4/#L16">롬 4:16</a>)</p></blockquote><blockquote><p>“그런즉 <strong>믿음으로 말미암은 자들은 아브라함의 자손인 줄 알지어다</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gal/3/#L7">갈 3:7</a>)</p></blockquote><blockquote><p>“아브람이 구십구 세 때에 여호와께서 아브람에게 나타나서 그에게 이르시되 나는 전능한 하나님이라 너는 내 앞에서 행하여 완전하라 &lt;…&gt; 보라 내 언약이 너와 함께 있으니 <strong><mark>너는 여러 민족의 아버지가 될지라</mark></strong> 이제 후로는 네 이름을 아브람이라 하지 아니하고 아브라함이라 하리니 이는 <strong><mark>내가 너를 여러 민족의 아버지가 되게 함이니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gen/17/#L1,4-5">창 17:1,4-5</a>)</p></blockquote><blockquote><p>“그가 할례의 표를 받은 것은 무할례시에 믿음으로 된 의를 인친 것이니 이는 무할례자로서 <strong><mark>믿는 모든 자의 조상</mark></strong>이 되어 그들도 의로 여기심을 얻게 하려 하심이라 또한 <strong>할례자의 조상</strong>이 되었나니 곧 할례 받을 자에게뿐 아니라 우리 조상 아브라함이 무할례시에 가졌던 믿음의 자취를 따르는 자들에게도 그러하니라 &lt;…&gt; 기록된 바 <strong><mark>내가 너를 많은 민족의 조상으로 세웠다</mark></strong> 하심과 같으니 그가 믿은 바 하나님은 죽은 자를 살리시며 없는 것을 있는 것으로 부르시는 이시니라” (<a href="https://bibleox.com/ko/ko-nkrv/rim/4/#L11-12,17">롬 4:11-12,17</a>)</p></blockquote><h3>하느님께서는 아버지와 어머니에 관한 계명을 주십니다</h3><blockquote><p>“<strong><mark>네 부모를 공경하라</mark></strong> 그리하면 네 하나님 여호와가 네게 준 땅에서 네 생명이 길리라” (<a href="https://bibleox.com/ko/ko-nkrv/ish/20/#L12">출 20:12</a>)</p></blockquote><blockquote><p>“너는 <strong>네 하나님 여호와께서 명령한 대로</strong> <strong><mark>네 부모를 공경하라</mark></strong> 그리하면 네 하나님 여호와가 네게 준 땅에서 네 생명이 길고 복을 누리리라” (<a href="https://bibleox.com/ko/ko-nkrv/vtor/5/#L16">신 5:16</a>)</p></blockquote><blockquote><p>“네가 계명을 아나니 살인하지 말라, 간음하지 말라, 도둑질하지 말라, 거짓 증언 하지 말라, 속여 빼앗지 말라, 네 <strong><mark>부모를 공경하라</mark></strong> 하였느니라” (<a href="https://bibleox.com/ko/ko-nkrv/mk/10/#L19">막 10:19</a>)</p></blockquote><blockquote><p>“<strong><mark>네 아버지와 어머니를 공경하라</mark></strong> 이것은 약속이 있는 첫 계명이니” (<a href="https://bibleox.com/ko/ko-nkrv/ef/6/#L2">엡 6:2</a>)</p></blockquote><h3>사도는 아버지들에게 말합니다</h3><blockquote><p>“또 <strong><mark>아비들아</mark></strong> 너희 자녀를 노엽게 하지 말고 오직 주의 교훈과 훈계로 양육하라” (<a href="https://bibleox.com/ko/ko-nkrv/ef/6/#L4">엡 6:4</a>)</p></blockquote><blockquote><p>“<strong><mark>아비들아</mark></strong> 너희 자녀를 노엽게 하지 말지니 낙심할까 함이라” (<a href="https://bibleox.com/ko/ko-nkrv/kol/3/#L21">골 3:21</a>)</p></blockquote><blockquote><p>“<strong><mark>아비들아</mark></strong> 내가 너희에게 쓰는 것은 너희가 태초부터 계신 이를 알았음이요 청년들아 내가 너희에게 쓰는 것은 너희가 악한 자를 이기었음이라” (<a href="https://bibleox.com/ko/ko-nkrv/1in/2/#L13">요일 2:13</a>)</p></blockquote><h2>하느님께서는 올바른 뜻으로(본성이 아니라 은총으로) “스승”과 “아버지”만이 아니라 “신”이라고까지 부르는 것을 허락하십니다</h2><blockquote><p>“내가 말하기를 <strong>너희는 신들이며</strong> 다 지존자의 아들들이라 하였으나 그러나 너희는 사람처럼 죽으며 고관의 하나 같이 넘어지리로다” (<a href="https://bibleox.com/ko/ko-nkrv/ps/82/#L6-7">시 82:6-7</a>)</p></blockquote><blockquote><p>“예수께서 이르시되 너희 율법에 기록된 바 내가 <strong>너희를 신이라 하였노라</strong> 하지 아니하였느냐 성경은 폐하지 못하나니 하나님의 말씀을 받은 사람들을 신이라 하셨거든” (<a href="https://bibleox.com/ko/ko-nkrv/in/10/#L34-35">요 10:34-35</a>)</p></blockquote><p>그러나 그리스도께서는 우리 자신을 종이라 부르라는 계명을 주십니다(<a href="https://bibleox.com/ko/ko-nkrv/lk/17/#L10">눅 17:10</a>).</p><h2>관련 주제</h2><p>그리스도인을 하느님의 종(노예)이라 부르는 것에 대한 반론에 관하여: <a href="https://bibleox.com/ru/ru/w/христианин-раб-Бога">자세히</a>.</p>'
