- src: Христос-Творец-мира
  path: Lb9s_세상의창조주그리스도
  title: 그리스도 — 세상의 창조주
  meta_desc: 예수 그리스도는 세상과 그 안의 모든 것을 창조하신 분이십니다.
  menu:
    parent: 하느님/아들
    title: 그리스도 — 세상의 창조주
    priority: 9
  references: "<p>번역: 로디온 블라소프 (AI 도구 활용). 저본: 러시아어 원문. 참고: 영어·일본어 번역. 성경 인용과 링크는
    공동번역 성서에 따름.</p>"
  body: '<p>성자 하느님이신 예수 그리스도께서는 세상의 창조주이십니다:</p><blockquote><p>“그러나 <strong><mark>아들에
    관해서는</mark></strong> 이렇게 말씀하셨습니다. ‘당신은 하느님이십니다. 당신의 왕권은 영원무궁하시며 당신이 잡으신 지팡이는 정의의
    지팡이입니다. 당신은 정의를 사랑하시고 불의를 미워하셨습니다. 그러므로 하느님 곧 당신의 하느님께서는 당신에게 즐거움의 기름을 부어 왕으로
    삼으시고 당신의 동료들보다 더 기쁘게 해 주셨습니다.’ 또 이런 말씀도 있습니다. ‘<strong><mark>주님, 한 처음 땅을 만드신 이도
    주님이시요 하늘을 손수 만드신 이도 주님이십니다</mark></strong>. 하늘과 땅은 없어질지라도 주님은 영원히 계십니다. 만물은 옷처럼
    낡아질 것이요 주님은 그것들을 겉옷처럼 말아 치우실 것입니다. 만물은 옷처럼 변할지라도 주님은 언제나 같으시고 주님은 영원히 늙지 않으십니다’”
    (<a href="https://bibleox.com/ko/ko-nkrv/evr/1/#L8-12">히 1:8-12</a>)</p></blockquote><blockquote><p>“아버지께서는
    우리를 흑암의 권세에서 건져 내시어 <strong>당신의 사랑하시는 <mark>아들</mark></strong>의 나라로 옮겨 주셨습니다.
    우리는 그 아들로 말미암아 죄를 용서받고 속박에서 풀려 났습니다. 그리스도께서는 보이지 않는 하느님의 형상이시며 <strong>만물에 앞서
    태어나신 분</strong>이십니다. 그것은 <strong><mark>하늘과 땅에 있는 만물, 곧 보이지 않는 것까지도 모두 그분을 통해서
    창조되었기 때문입니다. 만물은 그분을 통해서 그리고 그분을 위해서 창조되었습니다</mark></strong>. 그분은 만물보다 앞서 계시고
    만물은 그분으로 말미암아 존속합니다” (<a href="https://bibleox.com/ko/ko-nkrv/kol/1/#L13-17">골
    1:13-17</a>) <em>(16절은 그리스어 원문에서 “보이는 것과 보이지 않는 것, <strong>왕권이나 주권이나 권세나 세력이나</strong>”를
    모두 포함합니다: τὰ ὁρατὰ καὶ τὰ ἀόρατα, εἴτε θρόνοι εἴτε κυριότητες εἴτε ἀρχαὶ εἴτε
    ἐξουσίαι.)</em></p></blockquote><blockquote><p>“말씀이 세상에 계셨고 <strong>세상이 이 말씀을
    통하여 생겨났는데도</strong> 세상은 그분을 알아 보지 못하였다” (<a href="https://bibleox.com/ko/ko-nkrv/in/1/#L10">요
    1:10</a>)</p></blockquote><blockquote><p>“하느님께서 예전에는 예언자들을 시켜 여러 번 여러 가지 모양으로
    우리 조상들에게 말씀하셨습니다. 그러나 이 마지막 시대에 와서는 당신의 <strong>아들</strong>을 시켜 우리에게 말씀하셨습니다.
    하느님께서는 <strong>당신의 아들을 통해서 온 세상을 창조하셨으며</strong> 그 아들에게 만물을 물려 주시기로 하셨습니다” (<a
    href="https://bibleox.com/ko/ko-nkrv/evr/1/#L1-2">히 1:1-2</a>)</p></blockquote><blockquote><p>“우리는
    믿음이 있으므로 <strong>이 세상이 하느님의 말씀으로 창조되었다는 것</strong>, 곧 우리의 눈에 보이는 것이 보이지 않는 것에서
    나왔다는 것을 압니다” (<a href="https://bibleox.com/ko/ko-nkrv/evr/11/#L3">히 11:3</a>)</p></blockquote>'
