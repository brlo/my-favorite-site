  references: "<p>번역: 로디온 블라소프 (AI 도구 활용). 저본: 러시아어 원문. 참고: 영어·일본어 번역. 성경 인용과 링크는
    공동번역 성서에 따름.</p>"
  body: <h2>구약의 죄 고백</h2><p>구약의 교회에서 하느님께서는 친히 성전에서 사제 앞에서 죄를 고백하는 일과 사제를 통해 죄에서 깨끗해지는
    일을 정해 주셨습니다:</p><blockquote><p>“위에 말한 것 중의 어느 하나에라도 걸렸을 경우에는 <strong>자기가 어긴 그
    잘못을 고백하고</strong> 그 벌로 <strong>야훼께 속죄제물을 드리는 데</strong> 양떼 가운데서 면양이든지 염소든지 암컷
    한 마리를 바쳐야 한다. <strong>이렇게 사제가 그의 죄를 벗겨 주면</strong> 그는 죄를 용서받을 것이다” (<a href="https://bibleox.com/ko/ko-nkrv/lev/5/#L5-6">레
    5:5-6</a>)</p></blockquote><blockquote><p>“제 잘못을 감추고 잘될 리 없다. <strong>제 잘못을 실토하고
    손을 떼어야 동정을 산다</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/pr/28/#L13">잠
    28:13</a>)</p></blockquote><h2>신약의 죄 고백</h2><h3>사제직에는 죄를 용서하는 권한이 있습니다</h3><p>하느님께서는
    사제직을 바꾸십니다 (<a href="https://bibleox.com/ko/ko/w/Pt8h_%EC%8B%A0%ED%92%88%EC%84%B1%EC%82%AC/">자세히</a>):</p><blockquote><p>“<strong>사제
    제도가 변하면</strong> 율법도 변하게 마련입니다” (<a href="https://bibleox.com/ko/ko-nkrv/evr/7/#L12">히
    7:12</a>)</p></blockquote><p>그리고 새로운 사제직에 죄를 용서하는 권한을 주십니다:</p><blockquote><p>“또
    나는 너에게 하늘 나라의 열쇠를 주겠다. 네가 무엇이든지 땅에서 매면 하늘에도 매여 있을 것이며 <strong>땅에서 풀면 하늘에도 풀려 있을
    것이다</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/16/#L19">마 16:19</a>)</p></blockquote><blockquote><p>“나는
    분명히 말한다. 너희가 무엇이든지 땅에서 매면 하늘에도 매어 있을 것이며 <strong>땅에서 풀면 하늘에도 풀려 있을 것이다</strong>”
    (<a href="https://bibleox.com/ko/ko-nkrv/mf/18/#L18">마 18:18</a>)</p></blockquote><blockquote><p>“이렇게
    말씀하신 다음 예수께서는 그들에게 숨을 내쉬시며 말씀을 계속하셨다. ‘성령을 받아라. <strong>누구의 죄든지 너희가 용서해 주면 그들의
    죄는 용서받을 것이고 용서해 주지 않으면 용서받지 못한 채 남아 있을 것이다</strong>’” (<a href="https://bibleox.com/ko/ko-nkrv/in/20/#L22-23">요
    20:22-23</a>)</p></blockquote><p>사제들의 기도를 통해 죄가 용서됩니다:</p><blockquote><p>“여러분
    가운데 앓는 사람이 있으면 그 사람은 <strong>교회의 원로들을 청하십시오</strong>. 원로들은 주님의 이름으로 그에게 기름을 바르고
    <strong>그를 위하여 기도해 주어야 합니다</strong>. 믿고 구하는 기도는 앓는 사람을 낫게 할 것이며 주님께서 그를 일으켜 주실
    것입니다. 또 <strong>그가 지은 죄가 있으면 그 죄도 용서를 받을 것입니다</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/iak/5/#L14-15">약
    5:14-15</a>) <em>(“원로”는 그리스어 원문에서 πρεσβύτεροι로, 정교회에서는 <strong>사제</strong>를 가리키는
    말입니다.)</em></p></blockquote><p>사제들은 교회를 돌보는 이로 세움을 받았습니다:</p><blockquote><p>“밀레도스에서
    바울로는 에페소에 사람을 보내어 <strong>그 교회 원로들을</strong> 불렀다. 원로들이 오자 바울로는 이렇게 말하였다. &lt;…&gt;
    ‘여러분은 늘 자신을 살피며 <strong>성령께서</strong> 맡겨 주신 양떼를 잘 돌보시오. 성령께서는 <strong>여러분을 감독으로
    세우셔서</strong> 하느님께서 당신 아드님의 피로 값을 치르고 얻으신 <strong>당신의 교회를 보살피게 하셨습니다</strong>’”
    (<a href="https://bibleox.com/ko/ko-nkrv/act/20/#L17-18,28">행 20:17-18,28</a>)
    <em>(“감독”은 그리스어 원문에서 ἐπισκόπους로, <strong>주교</strong>와 같은 말입니다. “당신 아드님의 피”는 그리스어
    원문에서 διὰ τοῦ ἰδίου αἵματος — “<strong>당신 자신의 피</strong>로”입니다.)</em></p></blockquote><h3>죄의
    고백은 교회 안에 보존되어 있습니다</h3><p>구약과 신약의 경계에서 사람들은 예언자 세례자 요한에게 나아와 마찬가지로 죄를 고백하였습니다:</p><blockquote><p>“세례자
    요한이 광야에 나타나 ‘회개하고 세례를 받아라. 그러면 <strong>죄를 용서받을 것이다</strong>’ 하고 선포하였다. 그 때 <strong>온
    유다 지방</strong>과 예루살렘에 사는 모든 사람이 <strong>그에게 와서 죄를 고백하며</strong> 요르단강에서 세례를 받았다”
    (<a href="https://bibleox.com/ko/ko-nkrv/mk/1/#L4-5">막 1:4-5</a>)</p></blockquote><p>죄의
    고백은 교회 안에 보존되어 있습니다:</p><blockquote><p>“그리고 많은 <strong>신도들이</strong> 와서 <strong>자기들이
    한 일을 숨김없이 자백하였다</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/act/19/#L18">행
    19:18</a>)</p></blockquote><h3>참된 신앙을 얻은 신자들도 그 뒤에 다시 새로운 죄의 용서가 필요합니다</h3><p>참된
    신자는 이웃을 그릇된 길에서 돌이키게 하여 자신의 많은 죄를 덮을 수 있습니다:</p><blockquote><p>“나의 형제 여러분, 여러분
    가운데 어떤 사람이 <strong>진리를 떠나 그릇된 길을 갈 때에</strong> 누가 그를 바른 길로 돌아 서게 한다고 합시다. 그러면
    <strong><mark>죄인을 그릇된 길에서 돌아 서게 한 그 사람은</mark> 그 죄인의 영혼을 죽음으로부터 구원할 것이고 또 <mark>많은
    죄를 용서받게 해 줄 것입니다</mark></strong>. 이것을 알아 두십시오” (<a href="https://bibleox.com/ko/ko-nkrv/iak/5/#L19-20">약
    5:19-20</a>) <em>(“많은 죄를 용서받게 해 줄 것입니다”는 그리스어 원문에서 καλύψει πλῆθος ἁμαρτιῶν — “많은
    죄를 <strong>덮을 것입니다</strong>”입니다.)</em></p></blockquote><blockquote><p>“<strong>여러분
    가운데</strong> 앓는 사람이 있으면 그 사람은 교회의 원로들을 청하십시오. 원로들은 주님의 이름으로 그에게 기름을 바르고 그를 위하여
    기도해 주어야 합니다. 믿고 구하는 기도는 앓는 사람을 낫게 할 것이며 주님께서 그를 일으켜 주실 것입니다. 또 <strong><mark>그가
    지은 죄가 있으면 그 죄도 용서를 받을 것입니다</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/iak/5/#L14-15">약
    5:14-15</a>)</p></blockquote><h2>주님께서는 회개하는 이를 물리치지 않으십니다</h2><p>하느님께서는 죄인이 아무리
    크게 죄를 지었더라도 언제나 그의 회개를 받아 주실 준비가 되어 있으십니다</p><blockquote><p>“하느님, 내 제물은 <strong>찢어진
    마음뿐, 찢어지고 터진 마음을 당신께서 얕보지 아니하시니</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ps/51/#L17">시
    51:17</a>)</p></blockquote><blockquote><p>“<strong>나에게 오는 사람은 내가 결코 외면하지 않을 것이다</strong>”
    (<a href="https://bibleox.com/ko/ko-nkrv/in/6/#L37">요 6:37</a>)</p></blockquote>
