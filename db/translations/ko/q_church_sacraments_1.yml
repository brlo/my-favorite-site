- src: елеосвящение-соборование
  path: Un10c_성유성사
  title: 성유성사(병자 도유)
  copy_cover: true
  body: <p><a href="https://azbyka.ru/soborovanie-eleosvyashhenie">성유성사</a><strong>(병자 도유)</strong>는 사제들의 협의체가(부득이한 경우에는 사제 한 사람이) 병자에게 거행하는 교회의 성사로서, 기도와 축성된 기름을 바름으로써 병자에게 몸과 영혼의 병을 고치는 치유와 정화의 은총을 청합니다.</p><p><strong>성경 구절:</strong></p><blockquote><p>“너희 중에 병든 자가 있느냐 그는 <strong>교회의 장로들을 청할 것이요</strong> 그들은 <strong><mark>주의 이름으로 기름을 바르며 그를 위하여 기도할지니라</mark></strong> <strong>믿음의 기도는 병든 자를 구원하리니</strong> 주께서 그를 일으키시리라 <strong>혹시 죄를 범하였을지라도 사하심을 받으리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/iak/5/#L14-15">약 5:14-15</a>)</p></blockquote><blockquote><p>“제자들이 나가서 회개하라 전파하고 많은 귀신을 쫓아내며 <strong><mark>많은 병자에게 기름을 발라 고치더라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mk/6/#L12-13">막 6:12-13</a>)</p></blockquote><blockquote><p>“예수께서 그의 열두 제자를 부르사 더러운 귀신을 <strong>쫓아내며</strong> <strong>모든 병과 모든 약한 것을 고치는</strong> <strong>권능을 주시니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/10/#L1">마 10:1</a>)</p></blockquote><blockquote><p>“<strong>병든 자를 고치며</strong> 죽은 자를 살리며 나병환자를 깨끗하게 하며 귀신을 쫓아내되 <strong>너희가 거저 받았으니 거저 주라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/10/#L8">마 10:8</a>)</p></blockquote>
  title_sub: 정교회의 일곱 성사 가운데 하나
