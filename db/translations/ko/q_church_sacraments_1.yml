- src: елеосвящение-соборование
  path: Un10c_성유성사
  title: 성유성사(병자 도유)
  copy_cover: true
  body: <p><a href="https://azbyka.ru/soborovanie-eleosvyashhenie">성유성사</a><strong>(병자 도유)</strong>는 사제들의 협의체가(부득이한 경우에는 사제 한 사람이) 병자에게 거행하는 교회의 성사로서, 기도와 축성된 기름을 바름으로써 병자에게 몸과 영혼의 병을 고치는 치유와 정화의 은총을 청합니다.</p><p><strong>성경 구절:</strong></p><blockquote><p>“여러분 가운데 앓는 사람이 있으면 그 사람은 <strong>교회의 원로들을 청하십시오</strong>. 원로들은 <strong><mark>주님의 이름으로 그에게 기름을 바르고 그를 위하여 기도해 주어야 합니다</mark></strong>. <strong>믿고 구하는 기도는 앓는 사람을 낫게 할 것이며</strong> 주님께서 그를 일으켜 주실 것입니다. 또 <strong>그가 지은 죄가 있으면 그 죄도 용서를 받을 것입니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/iak/5/#L14-15">야고 5:14-15</a>)</p></blockquote><blockquote><p>“이 말씀을 듣고 열 두 제자는 나가서 사람들에게 회개하라고 가르치며 마귀들을 많이 쫓아내고 <strong><mark>수많은 병자들에게 기름을 발라 병을 고쳐 주었다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/mk/6/#L12-13">마르 6:12-13</a>)</p></blockquote><blockquote><p>“예수께서 열 두 제자를 불러 악령들을 제어하는 <strong>권능을 주시어</strong> 그것들을 <strong>쫓아 내고</strong> <strong>병자와 허약한 사람들을 모두 고쳐 주게 하셨다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/mf/10/#L1">마태 10:1</a>)</p></blockquote><blockquote><p>“<strong>앓는 사람은 고쳐 주고</strong> 죽은 사람은 살려 주어라. 나병환자는 깨끗이 낫게 해주고 마귀는 쫓아 내어라. <strong>너희가 거저 받았으니 거저 주어라</strong>.‘” (<a href="https://bibleox.com/ko/ko-ctb/mf/10/#L8">마태 10:8</a>)</p></blockquote>
  title_sub: 정교회의 일곱 성사 가운데 하나
