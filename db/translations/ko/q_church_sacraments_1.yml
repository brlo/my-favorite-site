  title: 견진성사
  copy_cover: true
  body: <h2>정의</h2><p><strong>견진성사</strong>(성령의 은사를 받음)는 교회의 일곱 성사 가운데 하나로서, 사람은 이 성사에서 영적인 길을 가며 자라날 힘(성령의 은사)을 받습니다. 견진성사는 세례성사와 함께, 세례 바로 뒤에 거행됩니다.</p><p>처음에 이 성사는 사도가 기도하며 손을 얹는 것으로 거행되었습니다. 나중에, 그러나 아직 사도 시대에 안수는 성유(축성된 특별한 기름)를 바르는 것으로 대체되었습니다. 아마도 다른 성사처럼 주교들이 권한을 준 사제들도 이 성사를 거행할 수 있게 하려는 것이었을 것입니다[1]. 주교는 성유를 마련하여 이 성사를 거행하는 사제에게 줍니다. 이에 관해서는 <a href="#HH-1세기나-2세기부터-안수는-성유-바름으로-대체되었습니다">아래</a> 해당 부분에서 자세히 다룹니다.</p><h2>성령의 은사를 주는 성사에 대한 언급</h2><p>사도 베드로의 설교.</p><p>사도 베드로는 죄의 용서를 위한 세례로 부른 다음 성령의 선물을 받아야 한다는 것도 덧붙여 말합니다:</p><blockquote><p>“베드로가 이르되 너희가 회개하여 <strong><mark>각각 예수 그리스도의 이름으로 세례를 받고</mark></strong> 죄 사함을 받으라 그리하면 <strong><mark>성령의 선물을 받으리니</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/act/2/#L38">행 2:38</a>)</p></blockquote><h2>성령의 은사는 사도들의 안수로 주어집니다</h2><p>복음사가 누가는 사도행전에서 사도들이 손을 얹어 성령을 받게 했다고 직접 말합니다(<a href="https://bibleox.com/ko/ko-nkrv/act/8/#L18">행 8:18</a>). 이것은 시몬의 말이 아니라 사도행전의 저자인 복음사가 누가의 말입니다. 게다가 사도 베드로는 이어서 성령의 은사를 주는 것을 하느님의 선물이라고 직접 말하며, 이 선물을 돈으로 얻으려 한 시몬을 꾸짖습니다:</p><blockquote><p>“이에 두 사도가 그들에게 안수하매 성령을 받는지라 시몬이 <strong><mark>사도들의 안수로 성령 받는 것을 보고</mark></strong> 돈을 드려 이르되 이 권능을 내게도 주어 누구든지 내가 안수하는 사람은 성령을 받게 하여 주소서 하니 베드로가 이르되 네가 <strong>하나님의 선물을 돈 주고 살 줄로</strong> 생각하였으니 네 은과 네가 함께 망할지어다” (<a href="https://bibleox.com/ko/ko-nkrv/act/8/#L17-20">행 8:17-20</a>)</p></blockquote><p>사도 바울은 에베소에서 세례를 베풉니다. 세례 바로 뒤에 성령의 은사를 주려고 손을 얹습니다:</p><blockquote><p>“바울이 이르되 요한이 회개의 세례를 베풀며 백성에게 말하되 내 뒤에 오시는 이를 믿으라 하였으니 이는 곧 예수라 하거늘 그들이 듣고 주 예수의 이름으로 <strong><mark>세례를 받으니</mark></strong> <strong><mark>바울이 그들에게 안수하매 성령이 그들에게 임하시므로</mark></strong> 방언도 하고 예언도 하니” (<a href="https://bibleox.com/ko/ko-nkrv/act/19/#L4-6">행 19:4-6</a>)</p></blockquote><h2>성령의 은사를 주는 일은 세례와 구별되는 성사입니다</h2><p>사마리아 사람들은 세례를 받았지만 성령께서는 나중에, 사도들이 손을 얹은 뒤에 오셨습니다.</p><p>사마리아 사람들의 세례는 이루어졌습니다. 이 세례에 잘못이 있었다는 말은 어디에도 없습니다. 오히려 그들이 세례는 받았지만 아직 성령은 받지 못했다고 직접 말합니다. 사도들은 사마리아 사람들의 소식을 듣고, 그들이 세례를 받을 뿐 아니라(이것은 빌립도 할 수 있었습니다) 성령의 은사도 받도록(빌립은 할 수 없었습니다. 성령의 은사는 사도들과 그들이 이 은사를 준 이들, 곧 주교들만 줄 수 있습니다) 사도 가운데 누군가가 가야 한다는 것을 알았습니다.</p><blockquote><p>“빌립이 사마리아 성에 내려가 그리스도를 백성에게 전파하니 &lt;…&gt; 빌립이 하나님 나라와 및 예수 그리스도의 이름에 관하여 전도함을 그들이 믿고 남녀가 다 <strong><mark>세례를 받으니</mark></strong> &lt;…&gt; 예루살렘에 있는 사도들이 사마리아도 하나님의 말씀을 받았다 함을 듣고 <strong><mark>베드로와 요한을 보내매 그들이 내려가서 그들을 위하여 성령 받기를 기도하니 이는 아직 한 사람에게도 성령 내리신 일이 없고 오직 주 예수의 이름으로 세례만 받을 뿐이더라</mark></strong> 이에 <strong><mark>두 사도가 그들에게 안수하매 성령을 받는지라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/act/8/#L5,12,14-17">행 8:5,12,14-17</a>)</p></blockquote><h2>1세기나 2세기부터 안수는 성유 바름으로 대체되었습니다</h2><p>처음에 이 성사는 사도들과 주교들의 안수로 거행되었습니다. 그 뒤 아마도 그리스도교로 돌아오는 사람이 늘어나 주교들이 모든 그리스도인에게 손을 얹기가 매우 어려워지자, 특별한 기름(성유)을 축성하여 사제에게 주고, 주교의 안수 대신 견진성사에서 바르게 하는 관습이 자리 잡았습니다.</p><p>이렇게 성사를 거행했다는 언급은 성경 자체와 가장 오래된 여러 그리스도교 저자들에게서 찾아볼 수 있습니다.</p><blockquote><p>“우리를 너희와 함께 그리스도 안에서 굳건하게 하시고 <strong>우리에게 기름을 부으신</strong> 이는 하나님이시니 그가 또한 우리에게 인치시고 보증으로 우리 마음에 성령을 주셨느니라” (<a href="https://bibleox.com/ko/ko-nkrv/2kor/1/#L21-22">고후 1:21-22</a>)</p></blockquote><blockquote><p>“너희는 <strong>거룩하신 자에게서 기름 부음을 받고</strong> 모든 것을 아느니라” (<a href="https://bibleox.com/ko/ko-nkrv/1in/2/#L20">요일 2:20</a>)</p></blockquote><blockquote><p>“너희는 <strong>주께 받은 바 기름 부음이</strong> 너희 안에 거하나니 아무도 너희를 가르칠 필요가 없고 오직 <strong>그의 기름 부음이</strong> 모든 것을 너희에게 가르치며 또 참되고 거짓이 없으니 너희를 가르치신 그대로 주 안에 거하라” (<a href="https://bibleox.com/ko/ko-nkrv/1in/2/#L27">요일 2:27</a>)</p></blockquote><p><strong>안디옥의 성 테오필로스, 2세기</strong></p><blockquote><p>“12. 나를 비웃으며 ‘그리스도인’이라고 부르는 그대는 자기가 무슨 말을 하는지 모릅니다. 먼저, 기름 부음을 받은 것은 향기롭고 쓸모 있으며 결코 업신여길 것이 아닙니다. 어떤 배가 먼저 칠을 하지 않고 쓸모 있고 항해에 적합하겠습니까? 어떤 성채나 집이 칠을 하지 않고 아름답고 쓸모 있겠습니까? 어떤 사람이 이 세상에 들어오거나 체육관에 들어갈 때 기름을 바르지 않습니까? &lt;…&gt; 그러므로 <strong>우리는 하느님의 기름을 바르기 때문에 그리스도인이라고 불립니다</strong>.”</p></blockquote><p>(<a href="https://bibleox.com/en/en/w/theophilus-theophilus-to-autolycus/">아우톨리코스에게</a>, 영어)</p><p>인용문 더 보기:</p><ul><li><p><a href="https://bibleox.com/ru/ru/w/PAKJ0qG7_Понятие_о_таинстве_миропомазания">견진성사의 개념</a> (러시아어)</p></li><li><p><a href="https://azbyka.ru/otechnik/Makarij_Bulgakov/pravoslavno-dogmaticheskoe-bogoslovie-tom2/24">https://azbyka.ru/otechnik/Makarij_Bulgakov/pravoslavno-dogmaticheskoe-bogoslovie-tom2/24</a> (러시아어)</p></li></ul><h2>비판</h2><h3>백인대장 고넬료에게는 사도의 안수 없이 성령께서 오시지 않았는가?</h3><p>사도 베드로가 설교하는 동안 고넬료의 집안에 성령께서 내려오신 것은 사도의 안수 없이, 세례 전에 성령께서 오신 <strong>유일한</strong> 경우입니다. 이 예외적인 경우에 앞서 일련의 특별한 일들이 있었고, 이 일들은 하느님께서 교회가 이방인을 받아들이도록 준비시키고 계셨음을 보여 줍니다. 그 전에는 이방인을 받아들일 수 있는지가 전혀 분명하지 않았고 그 뒤에도 논란이 되었습니다. 이 특별한 성령 강림을 통해 하느님께서는:</p><ol><li><p>이방인을 교회에 받아들일 수 있음을 보여 주셨습니다;</p></li><li><p>이를 의심하거나 사람의 잘못된 판단이라고 비난할 가능성을 없애셨습니다. 하느님께서는 사도 없이 이 일을 하지 않으셨습니다(성령께서 바로 오시지 않고 먼저 천사가 파견되어 사도를 찾으라고 명했습니다). 그러나 성령께서는 사도의 안수 전에 친히 오시어 이방인을 받아들이라는 하느님의 뜻을 분명히 나타내셨습니다.</p></li></ol><p>성령의 강림이 세례성사의 필요성을 없애지 않는다는 점이 중요합니다. 사도는 고넬료의 집안에 성령께서 내려오신 뒤 곧바로 세례를 베풉니다:</p><blockquote><p>“가이사랴에 고넬료라 하는 사람이 있으니 이달리야 부대라 하는 군대의 백부장이라 &lt;…&gt; 베드로가 입을 열어 말하되 내가 참으로 하나님은 사람의 외모를 보지 아니하시고 &lt;…&gt; <strong><mark>베드로가 이 말을 할 때에 성령이 말씀 듣는 모든 사람에게 내려오시니</mark></strong> &lt;…&gt; 이는 방언을 말하며 하나님 높임을 들음이러라 이에 베드로가 이르되 이 사람들이 우리와 같이 성령을 받았으니 누가 능히 물로 세례 베풂을 금하리요 하고 명하여 <strong><mark>예수 그리스도의 이름으로 세례를 베풀라</mark></strong> 하니라 그들이 베드로에게 며칠 더 머물기를 청하니라” (<a href="https://bibleox.com/ko/ko-nkrv/act/10/#L1,34,44,46-48">행 10:1,34,44,46-48</a>)</p></blockquote><p>더 자세히 확인하고 싶은 분들을 위해 설명을 덧붙입니다.</p><p>교회가 생겨난 초기에 이방인을 받아들이는 일은 거의 불가능했습니다. 복음은 유대인들에게만 전해집니다(<a href="https://bibleox.com/ko/ko-nkrv/act/11/#L19">행 11:19</a>; <a href="https://bibleox.com/ko/ko-nkrv/act/11/#L1,18">행 11:1,18</a>; <a href="https://bibleox.com/ko/ko-nkrv/act/14/#L27">행 14:27</a>; <a href="https://bibleox.com/ko/ko-nkrv/act/15/#L4">행 15:4</a>; <a href="https://bibleox.com/ko/ko-nkrv/act/15/#L7">행 15:7</a>). 교회에는 아직 이방인(곧 유대인이 아닌 사람들)을 받아들일 수 있는지에 대한 공통된 이해가 없습니다.</p><p>가장 가까운 제자 가운데 하나인 사도 베드로에게도 특별한 준비가 필요했습니다. 부정한 음식에 관한 같은 환시가 한 번이 아니라 세 번 나타나, 하느님께서 깨끗하게 하신 것을 부정하게 여기지 말라는 명령을 받았습니다(<a href="https://bibleox.com/ko/ko-nkrv/act/10/#L15">행 10:15</a>; <a href="https://bibleox.com/ko/ko-nkrv/act/11/#L9">행 11:9</a>).</p><p>그리하여 사도 베드로가 고넬료에게 오고, 설교를 시작하자 고넬료의 집안에 성령께서 오십니다. 강림 뒤에 사도는 곧바로 그들에게 물로 세례를 베풉니다. 유대인 출신 그리스도인들은 이 일에 놀랍니다:</p><blockquote><p>“베드로와 함께 온 할례 받은 신자들이 이방인들에게도 성령 부어 주심으로 말미암아 놀라니” (<a href="https://bibleox.com/ko/ko-nkrv/act/10/#L45">행 10:45</a>)</p></blockquote><p>예루살렘에서 사도 베드로는 이방인에게 세례를 주었다고 비난을 받지만, 하느님의 계시와 고넬료에게 성령께서 내려오신 일에 관한 이야기를 듣고 잠잠해집니다(<a href="https://bibleox.com/ko/ko-nkrv/act/11/#L1,18">행 11:1,18</a>). 그 뒤에도 문제는 완전히 풀리지 않습니다. 사도 베드로가 안디옥에 있을 때 예루살렘에서 사도 야고보가 보낸 그리스도인들이 옵니다(<a href="https://bibleox.com/ko/ko-nkrv/gal/2/#L12">갈 2:12</a>). 그러자 안디옥의 유대인들은 사도 베드로와 함께, 이방인과 어울린다고 보이지 않으려고 예루살렘 사람들을 피해 숨기 시작합니다.</p><p>그러므로 교회가 이방인을 받아들이도록 특별히 준비시킬 필요가 컸음을 쉽게 알 수 있습니다.</p><ol><li><p>사도조차 세 번이나 따로 가르침을 받아야 했습니다.</p></li><li><p>그리스도인 목격자들은 이 일에 충격을 받았고, 다른 이들 앞에서 해명해야 했습니다.</p></li><li><p>사도들과 논쟁이 벌어지고 예루살렘에서 공의회까지 소집됩니다.</p></li></ol><p>하느님께서 초자연적으로 개입하시어 사도의 안수 없이 친히 이방인들에게 오셨는데도 이러했습니다. 그럼에도 강한 저항이 일어났습니다. 이 일이 없었다면 어떻게 되었겠습니까?</p><p>그러므로 주님께서는 교회가 이방인을 받아들이도록 가르치시려고 단 한 번 예외적으로 행동하십니다.</p><p>이 특별한 사건은 세례를 폐지하지 않았습니다. 사도는 곧바로 고넬료의 집안에 세례를 베풀었습니다.</p><p>사건의 전체 흐름에 특별히 주목해야 합니다. 그 핵심은 하느님께서 당연히 원하시는 대로 행하실 수 있지만… 교회 없이 행하지 않으신다는 것입니다.</p><p>자기 그리스도교 단체를 세우는 사람들은 여기서 자기들의 임의적인 모임을 위한 빠져나갈 구멍만 보려 하며, 복음 설교만으로 성령을 받는다고 증명하려 합니다. 그러나 그들은 완전히 독립적으로 활동하실 수 있고 고넬료와 그의 집안에 오시는 데 사도가 필요하지 않은 성령께서 교회 없이 그렇게 하지 않으셨다는 사실을 완전히 무시합니다.</p><p>하느님께서는 고넬료의 의로움과 기도와 자선을 보시고 그에게 성령의 은사를 보내시는 대신 먼저 천사를 보내시어 교회를 찾으라고 명하십니다. 교회가 사도의 모습으로 오고, 성령의 은사를 줄 권한을 받은 사람이 왔을 때에야 성령께서 고넬료에게 오십니다.</p><p>그러므로 성령께서는 교회 없이 오실 수 있지만 그렇게 하지 않으십니다. 성경에는 그런 경우가 한 번도 없습니다. 다른 모든 경우에 성령께서는 세례 전에 오시지 않았습니다.</p><p>세례 중에 성령께서 내려오신다는 것은 세례 과정에서 손을 얹었고 성령께서 오셨다는 뜻입니다. 오늘날에도 같습니다. 세례 때에 바로 이어서 견진이 거행됩니다.</p><p>세례는 영적 탄생, 교회에 들어감, 몸에 결합됨이라고 불립니다. 성령의 은사를 보내시는 일은 그렇게 불리지 않습니다. 사도의 말대로 세례는 구원합니다. 그러면 물만 구원합니까? 물론 물을 통한 성령의 활동도 구원합니다. 세례의 물에 잠겨 이루어지는 영적 탄생은 성령 없이 이루어지지 않습니다. 그러나 성령의 은사를 주는 성사는 별개입니다. 그래서 사도도 여기서 이것을 성령의 별개의 활동으로 말합니다:</p><blockquote><p>“우리가 유대인이나 헬라인이나 종이나 자유인이나 다 한 성령으로 세례를 받아 한 몸이 되었고 또 <strong><mark>다 한 성령을 마시게 하셨느니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/12/#L13">고전 12:13</a>)</p></blockquote><p>1) 성령으로 <strong>세례를 받았고</strong> 그리고(!)</p><p>2) 성령을 <strong>받아 마셨습니다</strong>.</p><p>이 둘 다 성령께서 이루십니다. 성령의 활동 없이 물에서 나는 사람은 없습니다.</p><p>이것이 별개의 개념이었다면 물에서 나는 것을 하늘 나라를 보고 들어가는 조건으로 삼을 필요가 없었을 것입니다. 성령으로 난다고만 하면 충분했을 것입니다. 그러나 구세주께서는 탄생을 말씀하시면서 물과 성령을 함께 말씀하시며, 물도 성령도 빼지 않으십니다.</p><h3>사도들만 성령의 은사를 줄 수 있다면 왜 보제 빌립의 세례 뒤에 에티오피아 내시에게 성령께서 오시는가?</h3><p>빌립과 내시의 경우(<a href="https://bibleox.com/ko/ko-nkrv/act/8/#L39">행 8:39</a>)에는 매우 중요한 세부 사항이 있습니다.</p><p>러시아 시노달 번역과 교회 슬라브어 번역에서 이 구절은 “성령께서 내시에게 내리시고, 주님의 천사가 빌립을 데려갔다”로 되어 있습니다. 그러나 가장 오래된 이들을 포함한 대부분의 주석가들, 그 가운데 성 요한 크리소스토모스는 성령의 강림에 관한 구절(αγιον επεπεϲεν επι τον ευνουχον αγγελοϲ δε) 없이 본문을 인용합니다. 그냥 이렇게 말합니다(개역개정과 NKJV, 대부분의 번역도 그렇습니다):</p><blockquote><p>“<strong>주의 영이 빌립을 이끌어간지라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/act/8/#L39">행 8:39</a>)</p></blockquote><p>이 말이 없는 시내 사본(4세기):</p><blockquote><p>καὶ ἐκέλευσεν στῆναι τὸ ἅρμα, καὶ κατέβησαν ἀμφότεροι εἰς τὸ ὕδωρ, ὁ τε Φίλιππος καὶ ὁ εὐνοῦχος, καὶ ἐβάπτισεν αὐτόν. ὅτε δὲ ἀνέβησαν ἐκ τοῦ ὕδατος, <strong>πνεῦμα Κυρίου ἥρπασεν τὸν Φίλιππον</strong>, καὶ οὐκ εἶδεν αὐτὸν οὐκέτι ὁ εὐνοῦχος· ἐπορεύετο γὰρ τὴν ὁδὸν αὐτοῦ χαίρων. Φίλιππος δὲ εὑρέθη εἰς Ἄζωτον, καὶ διερχόμενος εὐηγγελίζετο τὰς πόλεις πάσας, ἕως τοῦ ἐλθεῖν αὐτὸν εἰς Καισάριαν. (사도 8:39-40)</p></blockquote><p>이 말이 없는 바티칸 사본(4세기):</p><blockquote><p>και εκελευϲε ϲτηναι το αρμα και κατεβηϲαν αμφοτεροι ειϲ το υδωρ ο τε φιλιπποϲ και ο ευνουχοϲ και εβαπτιϲεν αυτον οτε δε ανεβηϲαν εκ του υδατοϲ <strong>πνευμα κ̅υ̅ ηρπαϲεν το̅ φιλιππον</strong> και ουκ ειδε̅ αυτον ουκετι ο ευνουχοϲ επορευετο γαρ αυτου την οδον χαιρων</p></blockquote><p>이 말이 없는 알렉산드리아 사본(5세기):</p><blockquote><p>και εκελευϲεν ϲτηναι το αρμα και κατεβηϲαν αμφοτεροι ειϲ το υδωρ ο τε φιλιπποϲ και ο ευνουχοϲ και εβαπτιϲεν αυτον οτε δε ανεβηϲαν εκ του υδατοϲ <strong>π̅ν̅α̅ κ̅υ̅ ηρπαϲεν τον φιλιππο̅</strong> και ουκ ειδεν αυτον ουκετι ο ευνουχοϲ επορευετο γαρ την οδο̅ αυτου χαιρων φιλιπποϲ δε ευρεθη ειϲ αζωτον και διερχομενοϲ ταϲ πολειϲ παϲαϲ εωϲ του ελθειν αυτο̅ ειϲ καιϲαριαν</p></blockquote><p>성 요한 크리소스토모스의 인용(성령의 강림에 관한 말이 없습니다):</p><blockquote><p>Ὅτε δὲ ἀνέβησαν ἀπὸ τοῦ ὕδατος, <strong>Πνεῦμα Κυρίου ἥρπασε τὸν Φίλιππον</strong>, καὶ οὐκ εἶδεν αὐτὸν οὐκ ἔτι ὁ εὐνοῦχος.</p></blockquote><p>(<a href="https://bibleox.com/el/grc/w/dNiR_Ὁμιλίαι_εἰς_τὰς_Πράξεις_τῶν_Ἀποστόλων#HH-ΟΜΙΛΙΑ-ΙΘʹ">In acta apostolorum, ΟΜΙΛΙΑ ΙΘ</a>, 그리스어)</p>
