    title: 견진성사
    priority: 2
  references: '<ol><li><p>주교들은 일부 성사의 거행을 사제들에게 맡길 수 있었습니다. 주교의 뜻 없이는 이런 일이 있을 수 없었습니다. 1세기의 성인이자 사도들의 제자인 안티오키아의 주교 이그나티오스는 이렇게 씁니다: “예수 그리스도께서 아버지를 따르셨듯이 모두 주교를 따르십시오. 사도들을 따르듯이 사제단을 따르십시오. 보제들을 하느님의 계명처럼 존중하십시오. <strong>주교를 제쳐 놓고 교회에 관한 일을 아무도 해서는 안 됩니다. 주교 아래에서, 또는 주교가 맡긴 사람이 거행하는 성찬만을 확실한 것으로 여기십시오</strong>. 주교가 나타나는 곳에 회중도 있어야 합니다. 예수 그리스도께서 계신 곳에 보편 교회가 있는 것과 같습니다. <strong>주교를 제쳐 놓고 세례를 주거나 애찬(아가페)을 거행하는 것은 허락되지 않습니다</strong>. 그러나 주교가 옳다고 인정하는 것은 하느님께서도 기뻐하시는 것입니다. 그것은 여러분이 하는 모든 일이 흔들림 없고 확실하게 하려는 것입니다. &lt;…&gt; 하느님과 주교를 아는 것은 좋은 일입니다. 주교를 공경하는 사람은 하느님께 공경을 받고, 주교 몰래 무슨 일을 하는 사람은 악마를 섬기는 것입니다.” (<a href="https://bibleox.com/ko/ko/w/Ig2S_스미르나교회에보낸편지/">스미르나 교회에 보낸 편지</a>, 8~9장)</p><p>구약에서 기름 바름은 널리 행해졌습니다. 왕과 예언자와 사제가 기름 부음을 받았습니다. 위대한 성물인 특별한 기름으로 성전과 모든 기물에 기름을 발라 거룩하게 했습니다. 기름 바름은 그리스도께서 복음을 전하실 때와 그 뒤에도 있었습니다: <a href="https://bibleox.com/ko/ko-ctb/mk/6/#L12-13">마르 6:12-13</a>; <a href="https://bibleox.com/ko/ko-ctb/iak/5/#L14-15">야고 5:14-15</a>.</p><p>함께 보기: <a href="https://azbyka.ru/miropomazanie">https://azbyka.ru/miropomazanie</a> (러시아어)</p></li></ol><p>번역: 로디온 블라소프 (AI 도구 활용). 저본: 러시아어 원문. 참고: 영어·일본어 번역. 성경 인용과 링크는 공동번역 성서에 따름.</p>'
- src: венчание-брак
  path: Mr9g_혼인성사
  title: 혼인성사
  copy_cover: true
  body: <h2>정의</h2><p><a href="https://azbyka.ru/brak">혼인</a>(러시아어)은 교회의 일곱 성사 가운데 하나로서, 그리스도와 교회의 영적 결합을 본받아 남편과 아내의 서로에 대한 사랑을 바탕으로 한 자발적인 부부의 결합에 하느님의 축복을 청합니다.</p><h2>성경 구절</h2><p>혼인에서는 하느님께서 이루시는 성사가 일어납니다:</p><blockquote><p>“야훼 하느님께서는 ‘아담이 혼자 있는 것이 좋지 않으니, 그의 일을 거들 짝을 만들어 주리라.’ 하시고, &lt;…&gt; 그 갈빗대로 여자를 만드신 다음, 아담에게 데려 오시자 아담은 이렇게 외쳤다. ‘드디어 나타났구나! 내 뼈에서 나온 뼈요, 내 살에서 나온 살이로구나. 지아비에게서 나왔으니 지어미라고 부르리라!’ 이리하여 <strong><mark>남자는 어버이를 떠나 아내와 어울려 한 몸이 되게 되었다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/gen/2/#L18,22-23">창 2:18,22-23</a>)</p></blockquote><blockquote><p>“그 때에 바리사이파 사람들이 와서 예수의 속을 떠보려고 ‘남편이 아내를 버려도 좋습니까?’하고 물었다. 예수께서는 ‘모세는 어떻게 하라고 일렀느냐?’하고 반문하셨다. 이혼장을 써 주고 아내를 버리는 것은 허락했습니다‘하고 그들이 대답하자 예수께서는 이렇게 말씀하셨다. ’모세는 너희의 마음이 굳을 대로 굳어져서 이 법을 제정해 준 것이다. 그런데 천지 창조 때부터 하느님께서는 사람을 남자와 여자로 만드셨다. 그러므로 사람은 그 부모를 떠나 자기 아내와 합하여 둘이 한 몸이 되는 것이다. 따라서 그들은 <strong><mark>이제 둘이 아니라 한 몸이다. 그러므로 하느님께서 짝지어 주신 것을 사람이 갈라 놓아서는 안 된다</mark></strong>.‘” (<a href="https://bibleox.com/ko/ko-ctb/mk/10/#L2-9">마르 10:2-9</a>)</p></blockquote><blockquote><p>“여러분의 몸이 그리스도의 지체라는 것을 알지 못합니까? 그런데 그리스도의 몸의 한 부분을 떼어서 창녀의 몸의 지체로 만들어서야 되겠습니까? 절대로 그럴 수 없습니다. 창녀와 관계를 하는 사람은 그 창녀와 한 몸이 된다는 것을 모르십니까? 하느님께서 ‘<strong>두 사람이 한 몸이 되리라</strong>’고 말씀하시지 않았습니까?” (<a href="https://bibleox.com/ko/ko-ctb/1kor/6/#L15-16">1고린 6:15-16</a>)</p></blockquote><blockquote><p>“이와 같이 남편된 사람들도 자기 아내를 제 몸같이 사랑해야 합니다. 자기 아내를 사랑하는 것은 자기 자신을 사랑하는 것이 아니겠습니까? &lt;…&gt; 성서에 ‘그러므로 사람이 부모를 떠나 자기 아내와 결합하여 <strong>둘이 한 몸을 이룬다</strong>’라는 말씀이 있습니다. <strong>참으로 심오한 진리가 담겨져 있는 말씀입니다</strong>. 나는 이 말씀이 그리스도와 교회의 관계를 말해 준다고 봅니다. 그러나 이 말씀은 여러분에게도 적용되는 것으로서 남편된 사람은 자기 아내를 자기 몸같이 사랑하고 아내된 사람은 자기 남편을 존경해야 합니다.” (<a href="https://bibleox.com/ko/ko-ctb/ef/5/#L28,31-33">에페 5:28,31-33</a>) <em>(“심오한 진리”는 그리스어로 μυστήριον, “신비, 성사”입니다.)</em></p></blockquote><h2>1세기에 교회가 혼인을 축복한 일에 관하여</h2><h3>하느님을 모신 성 이그나티오스(37년경~107년경)</h3><blockquote><p>“장가드는 남자와 시집가는 여자는 <strong>주교의 동의를 얻어 결합하는 것이 마땅합니다</strong>. 그것은 혼인이 욕망을 따르지 않고 주님을 따르게 하려는 것입니다.”</p></blockquote><p>(<a href="https://bibleox.com/ko/ko/w/Ig2P_폴리카르포스에게보낸편지/">폴리카르포스에게 보낸 편지</a>, 5)</p>
  title_sub: 정교회의 일곱 성사 가운데 하나
