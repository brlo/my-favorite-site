  references: '<ol><li><p>주교들은 일부 성사의 거행을 사제들에게 맡길 수 있었습니다. 주교의 뜻 없이는 이런 일이 있을 수 없었습니다. 1세기의 성인이자 사도들의 제자인 안디옥의 주교 이그나티오스는 이렇게 씁니다: “예수 그리스도께서 아버지를 따르셨듯이 모두 주교를 따르십시오. 사도들을 따르듯이 사제단을 따르십시오. 보제들을 하느님의 계명처럼 존중하십시오. <strong>주교를 제쳐 놓고 교회에 관한 일을 아무도 해서는 안 됩니다. 주교 아래에서, 또는 주교가 맡긴 사람이 거행하는 성찬만을 확실한 것으로 여기십시오</strong>. 주교가 나타나는 곳에 회중도 있어야 합니다. 예수 그리스도께서 계신 곳에 보편 교회가 있는 것과 같습니다. <strong>주교를 제쳐 놓고 세례를 주거나 애찬(아가페)을 거행하는 것은 허락되지 않습니다</strong>. 그러나 주교가 옳다고 인정하는 것은 하느님께서도 기뻐하시는 것입니다. 그것은 여러분이 하는 모든 일이 흔들림 없고 확실하게 하려는 것입니다. &lt;…&gt; 하느님과 주교를 아는 것은 좋은 일입니다. 주교를 공경하는 사람은 하느님께 공경을 받고, 주교 몰래 무슨 일을 하는 사람은 악마를 섬기는 것입니다.” (<a href="https://bibleox.com/ko/ko/w/Ig2S_스미르나교회에보낸편지/">스미르나 교회에 보낸 편지</a>, 8~9장)</p><p>구약에서 기름 바름은 널리 행해졌습니다. 왕과 예언자와 사제가 기름 부음을 받았습니다. 위대한 성물인 특별한 기름으로 성전과 모든 기물에 기름을 발라 거룩하게 했습니다. 기름 바름은 그리스도께서 복음을 전하실 때와 그 뒤에도 있었습니다: <a href="https://bibleox.com/ko/ko-nkrv/mk/6/#L12-13">막 6:12-13</a>; <a href="https://bibleox.com/ko/ko-nkrv/iak/5/#L14-15">약 5:14-15</a>.</p><p>함께 보기: <a href="https://azbyka.ru/miropomazanie">https://azbyka.ru/miropomazanie</a> (러시아어)</p></li></ol><p>번역: 로디온 블라소프 (AI 도구 활용). 저본: 러시아어 원문. 참고: 영어·일본어 번역. 성경 인용과 링크는 개역개정에 따름.</p>'
- src: венчание-брак
  path: Mr9g_혼인성사
  title: 혼인성사
  copy_cover: true
  body: <h2>정의</h2><p><a href="https://azbyka.ru/brak">혼인</a>(러시아어)은 교회의 일곱 성사 가운데 하나로서, 그리스도와 교회의 영적 결합을 본받아 남편과 아내의 서로에 대한 사랑을 바탕으로 한 자발적인 부부의 결합에 하느님의 축복을 청합니다.</p><h2>성경 구절</h2><p>혼인에서는 하느님께서 이루시는 성사가 일어납니다:</p><blockquote><p>“여호와 하나님이 이르시되 <strong>사람이 혼자 사는 것이 좋지 아니하니 내가 그를 위하여 돕는 배필을 지으리라</strong> 하시니라 &lt;…&gt; 여호와 하나님이 아담에게서 취하신 그 갈빗대로 여자를 만드시고 그를 아담에게로 이끌어 오시니 &lt;…&gt; 이러므로 <strong><mark>남자가 부모를 떠나 그의 아내와 합하여 둘이 한 몸을 이룰지로다</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gen/2/#L18,22,24">창 2:18,22,24</a>)</p></blockquote><blockquote><p>“바리새인들이 예수께 나아와 그를 시험하여 묻되 사람이 아내를 버리는 것이 옳으니이까 대답하여 이르시되 모세가 어떻게 너희에게 명하였느냐 이르되 모세는 이혼 증서를 써주어 버리기를 허락하였나이다 예수께서 그들에게 이르시되 너희 마음이 완악함으로 말미암아 이 명령을 기록하였거니와 창조 때로부터 사람을 남자와 여자로 지으셨으니 이러므로 사람이 그 부모를 떠나서 그 둘이 한 몸이 될지니라 이러한즉 <strong><mark>이제 둘이 아니요 한 몸이니 그러므로 하나님이 짝지어 주신 것을 사람이 나누지 못할지니라</mark></strong> 하시더라” (<a href="https://bibleox.com/ko/ko-nkrv/mk/10/#L2-9">막 10:2-9</a>)</p></blockquote><blockquote><p>“너희 몸이 그리스도의 지체인 줄을 알지 못하느냐 내가 그리스도의 지체를 가지고 창녀의 지체를 만들겠느냐 결코 그럴 수 없느니라 창녀와 합하는 자는 그와 한 몸인 줄을 알지 못하느냐 일렀으되 <strong>둘이 한 육체가 된다</strong> 하셨나니” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/6/#L15-16">고전 6:15-16</a>)</p></blockquote><blockquote><p>“이와 같이 남편들도 자기 아내 사랑하기를 자기 자신과 같이 할지니 자기 아내를 사랑하는 자는 자기를 사랑하는 것이라 &lt;…&gt; 그러므로 사람이 부모를 떠나 그의 아내와 합하여 <strong>그 둘이 한 육체가 될지니</strong> <strong>이 비밀이 크도다</strong> 나는 그리스도와 교회에 대하여 말하노라 그러나 너희도 각각 자기의 아내 사랑하기를 자신 같이 하고 아내도 자기 남편을 존경하라” (<a href="https://bibleox.com/ko/ko-nkrv/ef/5/#L28,31-33">엡 5:28,31-33</a>) <em>(“비밀”은 그리스어로 μυστήριον, “신비, 성사”입니다.)</em></p></blockquote><h2>1세기에 교회가 혼인을 축복한 일에 관하여</h2><h3>하느님을 모신 성 이그나티오스(37년경~107년경)</h3><blockquote><p>“장가드는 남자와 시집가는 여자는 <strong>주교의 동의를 얻어 결합하는 것이 마땅합니다</strong>. 그것은 혼인이 욕망을 따르지 않고 주님을 따르게 하려는 것입니다.”</p></blockquote><p>(<a href="https://bibleox.com/ko/ko/w/Ig2P_폴리카르포스에게보낸편지/">폴리카르포스에게 보낸 편지</a>, 5)</p>
  title_sub: 정교회의 일곱 성사 가운데 하나
