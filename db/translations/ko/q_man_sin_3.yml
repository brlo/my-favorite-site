- src: родовые-грехи
  path: Ac50s_조상의_죄
  title: 조상의 죄
  copy_cover: true
  body: <p>조상의 죄라는 것은 없습니다. 이 개념은 대개 이른바 “민간 치료사”, 영매, 술사들이 지어내어 씁니다. 교회에는 원죄라는 개념이 있지만 그것은 다른 개념입니다(<a href="https://bibleox.com/ru/ru/w/все-люди-грешны">구절</a> 참조). 원죄에서 사람을 완전히 해방하는 것은 술사나 영매가 아니라 교회의 거룩한 세례뿐입니다. 술사와 영매는 하느님이신 주 예수 그리스도께서 사람이 되시기 전에도 있었지만, 그리스도께서 하신 일을 하지 못했습니다.</p><p>하느님께서는 각 사람에게 자기 죄를 물으십니다. 그러나 부모의 의로운 삶의 결과도, 부모의 악한 삶의 결과도 자녀에게 미칩니다. 이것은 부모가 (술이나 마약으로) 자기 건강을 망치면 자녀의 건강도 해치는 것과 같습니다. 부모가 건강을 망친 데 대해 자녀에게는 잘못이 없습니다. 하느님 앞에서 자녀는 부모의 알코올 중독에 책임이 없습니다.</p><p>이 생각은 다음 성경 말씀에서 자세히 이해할 수 있습니다:</p><blockquote><p>“너희가 이스라엘 땅에 관한 속담에 이르기를 <strong>아버지가 신 포도를 먹었으므로 그의 아들의 이가 시다고 함은 어찌 됨이냐</strong> 주 여호와의 말씀이니라 내가 나의 삶을 두고 맹세하노니 너희가 이스라엘 가운데에서 다시는 이 속담을 쓰지 못하게 되리라 모든 영혼이 다 내게 속한지라 아버지의 영혼이 내게 속함 같이 그의 아들의 영혼도 내게 속하였나니 <strong><mark>범죄하는 그 영혼은 죽으리라</mark></strong> <strong><mark>사람이 만일 의로워서 정의와 공의를 따라 행하며</mark></strong> 산 위에서 제물을 먹지 아니하며 이스라엘 족속의 우상에게 눈을 들지 아니하며 이웃의 아내를 더럽히지 아니하며 월경 중에 있는 여인을 가까이 하지 아니하며 사람을 학대하지 아니하며 빚진 자의 저당물을 돌려 주며 강탈하지 아니하며 주린 자에게 음식물을 주며 벗은 자에게 옷을 입히며 변리를 위하여 꾸어 주지 아니하며 이자를 받지 아니하며 스스로 손을 금하여 죄를 짓지 아니하며 사람과 사람 사이에 진실하게 판단하며 <strong><mark>내 율례를 따르며 내 규례를 지켜 진실하게 행할진대 그는 의인이니 반드시 살리라</mark></strong> 주 여호와의 말씀이니라 <strong><mark>가령 그가 아들을 낳았다 하자 그 아들이 이 모든 선은 하나도 행하지 아니하고</mark></strong> 이 죄악 중 하나를 범하여 강포하거나 살인하거나 산 위에서 제물을 먹거나 이웃의 아내를 더럽히거나 가난하고 궁핍한 자를 학대하거나 강탈하거나 빚진 자의 저당물을 돌려 주지 아니하거나 우상에게 눈을 들거나 가증한 일을 행하거나 변리를 위하여 꾸어 주거나 이자를 받거나 할진대 <strong><mark>그가 살겠느냐 결코 살지 못하리니</mark></strong> 이 모든 가증한 일을 행하였은즉 <strong><mark>반드시 죽을지라 자기의 피가 자기에게로 돌아가리라</mark></strong> <strong><mark>또 가령 그가 아들을 낳았다 하자 그 아들이 그 아버지가 행한 모든 죄를 보고 두려워하여 그대로 행하지 아니하고</mark></strong> 산 위에서 제물을 먹지도 아니하며 이스라엘 족속의 우상에게 눈을 들지도 아니하며 이웃의 아내를 더럽히지도 아니하며 사람을 학대하지도 아니하며 저당을 잡지도 아니하며 강탈하지도 아니하고 주린 자에게 음식물을 주며 벗은 자에게 옷을 입히며 손을 금하여 가난한 자를 압제하지 아니하며 변리나 이자를 받지 아니하여 내 규례를 지키며 내 율례를 행할진대 <strong><mark>이 사람은 그의 아버지의 죄악으로 죽지 아니하고 반드시 살겠고</mark></strong> <strong><mark>그의 아버지는 심히 포학하여</mark></strong> 그 동족을 강탈하고 백성들 중에서 선을 행하지 아니하였으므로 <strong><mark>그는 그의 죄악으로 죽으리라</mark></strong> 그런데 너희는 이르기를 <strong><mark>아들이 어찌 아버지의 죄를 담당하지 아니하겠느냐 하는도다 아들이 정의와 공의를 행하며 내 모든 율례를 지켜 행하였으면 그는 반드시 살려니와 범죄하는 그 영혼은 죽을지라 아들은 아버지의 죄악을 담당하지 아니할 것이요 아버지는 아들의 죄악을 담당하지 아니하리니 의인의 공의도 자기에게로 돌아가고 악인의 악도 자기에게로 돌아가리라</mark></strong> <strong><mark>그러나 악인이 만일 그가 행한 모든 죄에서 돌이켜 떠나 내 모든 율례를 지키고 정의와 공의를 행하면 반드시 살고 죽지 아니할 것이라 그 범죄한 것이 하나도 기억함이 되지 아니하리니 그가 행한 공의로 살리라</mark></strong> 주 여호와의 말씀이니라 내가 어찌 악인이 죽는 것을 조금인들 기뻐하랴 그가 돌이켜 그 길에서 떠나 사는 것을 어찌 기뻐하지 아니하겠느냐 <strong><mark>만일 의인이 돌이켜 그 공의에서 떠나 범죄하고 악인이 행하는 모든 가증한 일대로 행하면 살겠느냐 그가 행한 공의로운 일은 하나도 기억함이 되지 아니하리니 그가 그 범한 허물과 그 지은 죄로 죽으리라</mark></strong> 그런데 너희는 이르기를 주의 길이 공평하지 아니하다 하는도다 이스라엘 족속아 들을지어다 내 길이 어찌 공평하지 아니하냐 너희 길이 공평하지 아니한 것이 아니냐 만일 의인이 그 공의를 떠나 죄악을 행하고 그로 말미암아 죽으면 그 행한 죄악으로 말미암아 죽는 것이요 만일 악인이 그 행한 악을 떠나 정의와 공의를 행하면 그 영혼을 보전하리라 그가 스스로 헤아리고 그 행한 모든 죄악에서 돌이켜 떠났으니 반드시 살고 죽지 아니하리라 그런데 이스라엘 족속은 이르기를 주의 길이 공평하지 아니하다 하는도다 이스라엘 족속아 나의 길이 어찌 공평하지 아니하냐 너희 길이 공평하지 아니한 것 아니냐 주 여호와의 말씀이니라 이스라엘 족속아 내가 너희 각 사람이 행한 대로 심판할지라 너희는 돌이켜 회개하고 모든 죄에서 떠날지어다 그리한즉 그것이 너희에게 죄악의 걸림돌이 되지 아니하리라” (<a href="https://bibleox.com/ko/ko-nkrv/iez/18/#L2-30">겔 18:2-30</a>)</p></blockquote><p>그러나 사람들은 흔히 부모의 죄에 대한 책임이 그래도 자녀에게 전해진다고 생각합니다. 이 생각은 다음 성경 구절을 읽은 뒤에 생깁니다:</p><blockquote><p>“그것들에게 절하지 말며 그것들을 섬기지 말라 나 네 하나님 여호와는 질투하는 하나님인즉 <strong>나를 미워하는 자의 죄를 갚되 아버지로부터 아들에게로 삼사 대까지 이르게 하거니와</strong> 나를 사랑하고 내 계명을 지키는 자에게는 천 대까지 은혜를 베푸느니라” (<a href="https://bibleox.com/ko/ko-nkrv/ish/20/#L5-6">출 20:5-6</a>)</p></blockquote><p>이것은 대대로 하느님을 계속 미워하는 사람들에 관한 말씀입니다. “<strong>나를 미워하는 자의 … 삼사 대까지</strong>”. 그런 사람들은 하느님을 미워한 대가로 벌을 받습니다. 왜 그렇습니까? 주님께서는 아버지와 할아버지와 증조할아버지의 미움을 참으셨지만, 이 미움이 이미 3-4대째 이어지므로 인내가 끝나고 벌이 그런 사람들에게 미칩니다.</p><p>시리아의 성 에프렘:</p><blockquote><p>“5-6, 13-14, 16-17, 22-26절. 하느님께서는 산에서 계명을 주시며 말씀하신다. 나는 주이니, 나를 미워하는 자들의 죄를 갚되 아버지로부터 아들에게로 삼사 대까지 이르게 한다. <strong><mark>하느님께서는 오래 참으시어 악한 사람과 그의 아들과 손자를 참으시지만, 그들이 회개하지 않으면, 넷째가 악에서 조상들을 닮자마자 그의 머리에 벌을 내리신다</mark></strong>.”</p></blockquote><p>(<a href="https://azbyka.ru/otechnik/Efrem_Sirin/tolkovanie-na-knigu-iskhod/20">출애굽기 주해 20장</a>, 러시아어 번역에서 옮김)</p>
