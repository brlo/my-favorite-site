- src: матерщина
  path: Fl14l_욕설
  title: 욕설(음담패설)
  copy_cover: true
  body: '<h2>욕설(음담패설)은 죄입니다</h2><blockquote><p>“무릇 <strong>더러운 말은</strong> 너희 입 밖에도 내지 말고 오직 덕을 세우는 데 소용되는 대로 선한 말을 하여 듣는 자들에게 은혜를 끼치게 하라” (<a href="https://bibleox.com/ko/ko-nkrv/ef/4/#L29">엡 4:29</a>)</p></blockquote><blockquote><p>“음행과 온갖 더러운 것과 탐욕은 너희 중에서 그 이름조차도 부르지 말라 이는 성도에게 마땅한 바니라 <strong>누추함과</strong> 어리석은 말이나 희롱의 말이 마땅치 아니하니 오히려 감사하는 말을 하라” (<a href="https://bibleox.com/ko/ko-nkrv/ef/5/#L3-4">엡 5:3-4</a>)</p></blockquote><blockquote><p>“이제는 너희가 이 모든 것을 벗어 버리라 곧 분함과 노여움과 악의와 비방과 <strong>너희 입의 부끄러운 말이라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/kol/3/#L8">골 3:8</a>)</p></blockquote><blockquote><p>“악을 악으로, 욕을 욕으로 갚지 말고 도리어 복을 빌라 이를 위하여 너희가 부르심을 받았으니 이는 복을 이어받게 하려 하심이라 그러므로 <strong>생명을 사랑하고 좋은 날 보기를 원하는 자는 혀를 금하여 악한 말을 그치며 그 입술로 거짓을 말하지 말고</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1pet/3/#L9-10">벧전 3:9-10</a>)</p></blockquote><blockquote><p>“<strong>수다를 미워하는 이는 악이 줄어든다</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/prsir/19/#L6">집회 19:6</a>, 그리스어에서 번역) <em>(러시아어 시노달 번역: “혀를 다스리는 이는 평안히 살리라”.)</em></p></blockquote><blockquote><p>“<strong>혀는</strong> 능히 길들일 사람이 없나니 <strong>쉬지 아니하는 악이요 죽이는 독이 가득한 것이라 이것으로 우리가 주 아버지를 찬송하고 또 이것으로 하나님의 형상대로 지음을 받은 사람을 저주하나니</strong> <strong><mark>한 입에서 찬송과 저주가 나오는도다 내 형제들아 이것이 마땅하지 아니하니라</mark></strong> 샘이 한 구멍으로 어찌 단 물과 쓴 물을 내겠느냐 &lt;…&gt; <strong><mark>너희 중에 지혜와 총명이 있는 자가 누구냐 그는 선행으로 말미암아 지혜의 온유함으로 그 행함을 보일지니라</mark></strong> 그러나 너희 마음 속에 독한 시기와 다툼이 있으면 자랑하지 말라 진리를 거슬러 거짓말하지 말라 이러한 지혜는 위로부터 내려온 것이 아니요 땅 위의 것이요 정욕의 것이요 귀신의 것이니 시기와 다툼이 있는 곳에는 혼란과 모든 악한 일이 있음이라” (<a href="https://bibleox.com/ko/ko-nkrv/iak/3/#L8-11,13-16">약 3:8-11,13-16</a>)</p></blockquote><h2>욕설은 무엇이 문제인가?</h2><p>욕설(공격적인 어휘)의 문제는 사람이 악하고 공격적이며 위험하고 거칠게 보이고 또 그렇게 되기를 원한다는 데 있습니다. 악한 어휘는 이 목표에 이르는 여러 방법 가운데 하나일 뿐입니다. 여기에 악한 감정, 눈빛, 몸짓, 옷, 문신, 습관과 그 밖의 모든 자기표현 수단이 더해집니다. 그러나 말로 돌아갑시다.</p><p>말은 소리로 이루어집니다. 소리의 조합 자체는 아무것도 뜻하지 않습니다. 나쁘지도 좋지도 않습니다. 예를 들어 “아무사다르”라는 말을 지어냈다고 합시다. “아무사다르”는 아직 아무것도 뜻하지 않으므로 나쁘지도 좋지도 않습니다. 그러나 사회가 어떤 말에 뜻을 담으면, 사람은 상황에 따라, 그리고 그 상황에서 어떤 사람으로 보이고 싶은지에 따라 뜻을 지닌 말을 고릅니다. 공손하고 예의 바르게 보이고 싶을 때는 공손한 어휘, 곧 우리의 평화로운 마음, 겸손, 도우려는 마음 같은 좋은 뜻이 담긴 말을 씁니다. 그러나 거칠고 위험하며 악하고 공격적으로 보이고 싶을 때는 공격적인 어휘, 곧 공격적이고 저속하며 그 밖의 부정적인 뜻이 담긴 말을 씁니다. 그런 말은 그 사람에게 나쁜 행동을 막아 줄 교양이나 마음가짐이 없다는 것을 곧바로 알려 줍니다. 그는 둘레 사람들에게 위험하고 악하며 공격적이고 불안정하며 들뜬, 좋은 것이라고는 하나도 없는 사람으로 보이고 싶어 합니다.</p><p>더구나 사람이 이런 악한 상태에 익숙해지면, 담배나 술처럼, 모든 죄스러운 정념처럼 그 상태에 매이게 됩니다. 그 결과 그는 스스로를 이 악한 상태에 들게 하고 속으로 그것을 키우려고 여러 일을 할 수 있습니다. 혼자 있을 때도 욕하고, 악한 음악을 듣고, 자기와 둘레를 음울한 상징으로 채웁니다. 곧 이 모든 것은 악한 상태를 향해 가는 것, 자기 안에 악의와 분노의 정념을 키우는 것입니다. 그러나 주 예수 그리스도께서는 이렇게 가르치십니다:</p><blockquote><p>“나는 너희에게 이르노니 <strong>형제에게 노하는 자마다 심판을 받게 되고</strong> <strong>형제를 대하여 라가라 하는 자는 공회에 잡혀가게 되고 미련한 놈이라 하는 자는 지옥 불에 들어가게 되리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/5/#L22">마 5:22</a>) <em>(“라가”는 모욕하는 말입니다. 비잔틴 본문(다수 사본)에는 “형제에게 <strong>까닭 없이</strong> 노하는 자마다”(εἰκῇ)로 되어 있습니다.)</em></p></blockquote><blockquote><p>“<strong>온유한 자는 복이 있나니 그들이 땅을 기업으로 받을 것임이요</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/5/#L5">마 5:5</a>)</p></blockquote><p>사도는 이렇게 말합니다:</p><blockquote><p>“<strong>너희는 모든 악독과 노함과 분냄과 떠드는 것과 비방하는 것을 모든 악의와 함께 버리고</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ef/4/#L31">엡 4:31</a>)</p></blockquote><p>선지자는 이렇게 말합니다:</p><blockquote><p>“<strong>분을 그치고 노를 버리며</strong> 불평하지 말라 오히려 악을 만들 뿐이라” (<a href="https://bibleox.com/ko/ko-nkrv/ps/37/#L8">시 37:8</a>)</p></blockquote><p>여기서 어리석은 농담에 대해서도 말해 둘 만합니다:</p><blockquote><p>“누추함과 어리석은 말이나 <strong>희롱의 말이 마땅치 아니하니</strong> 오히려 감사하는 말을 하라” (<a href="https://bibleox.com/ko/ko-nkrv/ef/5/#L4">엡 5:4</a>)</p></blockquote><blockquote><p>“화 있을진저 너희 지금 배부른 자여 너희는 주리리로다 <strong>화 있을진저 너희 지금 웃는 자여 너희가 애통하며 울리로다</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/lk/6/#L25">눅 6:25</a>)</p></blockquote>'
