  title: 뇌물(죄)
  copy_cover: true
  body: <blockquote><p>“<strong>너는 뇌물을 받지 말라 뇌물은 밝은 자의 눈을 어둡게 하고 의로운 자의 말을 굽게 하느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ish/23/#L8">출 23:8</a>)</p></blockquote><blockquote><p>“너는 재판을 굽게 하지 말며 사람을 외모로 보지 말며 또 <strong>뇌물을 받지 말라 뇌물은 지혜자의 눈을 어둡게 하고 의인의 말을 굽게 하느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/vtor/16/#L19">신 16:19</a>)</p></blockquote><blockquote><p>“탐욕이 지혜자를 우매하게 하고 <strong>뇌물이 사람의 명철을 망하게 하느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ekl/7/#L7">전 7:7</a>)</p></blockquote><blockquote><p>“<strong>악인은 사람의 품에서 뇌물을 받고 재판을 굽게 하느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/pr/17/#L23">잠 17:23</a>)</p></blockquote><blockquote><p>“왕은 정의로 나라를 견고하게 하나 <strong>뇌물을 억지로 내게 하는 자는 나라를 멸망시키느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/pr/29/#L4">잠 29:4</a>)</p></blockquote><blockquote><p>“사무엘이 늙으매 그의 아들들을 이스라엘 사사로 삼으니 &lt;…&gt; <strong>그의 아들들이 자기 아버지의 행위를 따르지 아니하고 이익을 따라 뇌물을 받고</strong> 판결을 굽게 하니라” (<a href="https://bibleox.com/ko/ko-nkrv/1ts/8/#L1,3">삼상 8:1,3</a>)</p></blockquote><blockquote><p>“경건하지 못한 무리는 자식을 낳지 못할 것이며 <strong>뇌물을 받는 자의 장막은 불탈 것이라</strong> 그들은 재난을 잉태하고 죄악을 낳으며 그들의 뱃속에 속임을 준비하느니라” (<a href="https://bibleox.com/ko/ko-nkrv/iov/15/#L34-35">욥 15:34-35</a>)</p></blockquote><blockquote><p>“내 영혼을 <strong>죄인과</strong> 함께, 내 생명을 살인자와 함께 거두지 마소서 <strong>그들의 손에 사악함이 있고 그들의 오른손에 뇌물이 가득하오나</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ps/26/#L9-10">시 26:9-10</a>)</p></blockquote><blockquote><p>“그들이 <strong>탐심으로써</strong> 지어낸 말을 가지고 너희로 이득을 삼으니 그들의 심판은 옛적부터 지체하지 아니하며 그들의 멸망은 잠들지 아니하느니라 &lt;…&gt; 불의의 값으로 불의를 당하며 낮에 즐기고 노는 것을 기쁘게 여기는 자들이니 점과 흠이라 너희와 함께 연회할 때에 그들의 속임수로 즐기고 놀며 음심이 가득한 눈을 가지고 범죄하기를 그치지 아니하고 굳세지 못한 영혼들을 유혹하며 <strong>탐욕에 연단된 마음을 가진 자들이니</strong> 저주의 자식이라 그들이 바른 길을 떠나 미혹되어 브올의 아들 <strong>발람의 길을 따르는도다</strong> 그는 <strong>불의의 삯을 사랑하다가</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2pet/2/#L3,13-15">벧후 2:3,13-15</a>)</p></blockquote>
  title_sub: 뇌물 수수
