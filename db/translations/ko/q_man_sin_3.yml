- src: Татуировки
  path: Tt18p_문신과_피어싱
  title: 문신, 피어싱
  copy_cover: true
  body: <p>하느님께서는 몸에 문신을 하고 살을 베는 것을 금하십니다:</p><blockquote><p>“너희는 너희 하나님 여호와의 자녀이니 죽은 자를 위하여 <strong>자기 몸을 베지 말며</strong> 눈썹 사이 이마 위의 털을 밀지 말라” (<a href="https://bibleox.com/ko/ko-nkrv/vtor/14/#L1">신 14:1</a>)</p></blockquote><blockquote><p>“머리 가를 둥글게 깎지 말며 수염 끝을 손상하지 말며 죽은 자 때문에 <strong>너희의 살에 문신을 하지 말며 무늬를 놓지 말라</strong> 나는 여호와이니라” (<a href="https://bibleox.com/ko/ko-nkrv/lev/19/#L27-28">레 19:27-28</a>)</p></blockquote><blockquote><p>“그러므로 형제들아 내가 하나님의 모든 자비하심으로 너희를 권하노니 <strong>너희 몸을 하나님이 기뻐하시는 거룩한 산 제물로 드리라</strong> 이는 너희가 드릴 영적 예배니라 너희는 <strong>이 세대를 본받지 말고</strong> 오직 마음을 새롭게 함으로 변화를 받아 하나님의 선하시고 기뻐하시고 온전하신 뜻이 무엇인지 분별하도록 하라” (<a href="https://bibleox.com/ko/ko-nkrv/rim/12/#L1-2">롬 12:1-2</a>)</p></blockquote><blockquote><p>“여호와께서 모세에게 이르시되 아론의 자손 제사장들에게 말하여 이르라 그의 백성 중에서 죽은 자를 만짐으로 말미암아 스스로를 더럽히지 말려니와 &lt;…&gt; 제사장들은 머리털을 깎아 대머리 같게 하지 말며 자기의 수염 양쪽을 깎지 말며 <strong>살을 베지 말고</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/lev/21/#L1,5">레 21:1,5</a>)</p></blockquote>
