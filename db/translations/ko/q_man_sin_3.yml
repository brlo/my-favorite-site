- src: XBGN_Трансвестизм
  path: Tv26s_이성_복장
  title: 이성 복장(복장 도착)
  copy_cover: true
  body: <p><strong>이성 복장 도착</strong>(라틴어 trans — “넘어, 건너”, vestitus — “옷을 입은”)은 전통적으로 반대 성의 것으로 여겨지는 옷을 입으려는 강박적인 욕구입니다.</p><blockquote><p>“<strong>여자는 남자의 의복을 입지 말 것이요 남자는 여자의 의복을 입지 말 것이라</strong> 이같이 하는 자는 네 하나님 여호와께 가증한 자이니라” (<a href="https://bibleox.com/ko/ko-nkrv/vtor/22/#L5">신 22:5</a>)</p></blockquote>
