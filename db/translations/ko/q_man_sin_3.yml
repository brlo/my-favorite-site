- src: человекоугодие
  path: Mp20l_사람을_기쁘게_함
  title: 사람을 기쁘게 함(외모로 사람을 취함)
  copy_cover: true
  body: <blockquote><p>“내 형제들아 영광의 주 곧 우리 주 예수 그리스도에 대한 믿음을 너희가 가졌으니 <strong>사람을 차별하여 대하지 말라</strong> 만일 너희 회당에 금 가락지를 끼고 아름다운 옷을 입은 사람이 들어오고 또 남루한 옷을 입은 가난한 사람이 들어올 때에 너희가 아름다운 옷을 입은 자를 눈여겨 보고 말하되 여기 좋은 자리에 앉으소서 하고 또 가난한 자에게 말하되 너는 거기 서 있든지 내 발등상 아래에 앉으라 하면 너희끼리 서로 차별하며 악한 생각으로 판단하는 자가 되는 것이 아니냐 &lt;…&gt; 너희가 만일 성경에 기록된 대로 네 이웃 사랑하기를 네 몸과 같이 하라 하신 최고의 법을 지키면 잘하는 것이거니와 <strong>만일 너희가 사람을 차별하여 대하면</strong> 죄를 짓는 것이니 율법이 너희를 범법자로 정죄하리라” (<a href="https://bibleox.com/ko/ko-nkrv/iak/2/#L1-4,8-9">약 2:1-4,8-9</a>)</p></blockquote><blockquote><p>“종들아 모든 일에 육신의 상전들에게 순종하되 <strong>사람을 기쁘게 하는 자와 같이 눈가림만 하지 말고</strong> 오직 주를 두려워하여 성실한 마음으로 하라” (<a href="https://bibleox.com/ko/ko-nkrv/kol/3/#L22">골 3:22</a>)</p></blockquote><blockquote><p>“종들아 두려워하고 떨며 성실한 마음으로 육체의 상전에게 순종하기를 그리스도께 하듯 하라 <strong>눈가림만 하여 사람을 기쁘게 하는 자처럼 하지 말고</strong> 그리스도의 종들처럼 마음으로 하나님의 뜻을 행하고 기쁜 마음으로 섬기기를 주께 하듯 하고 사람들에게 하듯 하지 말라” (<a href="https://bibleox.com/ko/ko-nkrv/ef/6/#L5-7">엡 6:5-7</a>)</p></blockquote><blockquote><p>“그런즉 하나님이 영원히 너를 멸하심이여 너를 붙잡아 네 장막에서 뽑아 내며 살아 있는 땅에서 네 뿌리를 빼시리로다 (셀라)” (<a href="https://bibleox.com/ko/ko-nkrv/ps/52/#L5">시 52:5</a>)</p></blockquote><blockquote><p>“너희가 불공평한 판단을 하며 <strong>악인의 낯 보기를 언제까지 하려느냐</strong> (셀라)” (<a href="https://bibleox.com/ko/ko-nkrv/ps/82/#L2">시 82:2</a>)</p></blockquote><blockquote><p>“너희는 재판할 때에 불의를 행하지 말며 가난한 자의 편을 들지 말며 <strong>세력 있는 자라고 두둔하지 말고</strong> 공의로 사람을 재판할지며” (<a href="https://bibleox.com/ko/ko-nkrv/lev/19/#L15">레 19:15</a>)</p></blockquote><blockquote><p>“<strong>이것도 지혜로운 자들의 말씀이라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/pr/24/#L23">잠 24:23</a>)</p></blockquote><blockquote><p>“<strong>사람의 낯을 보아 주는 것이 좋지 못하고</strong> 한 조각 떡으로 말미암아 사람이 범법하는 것도 그러하니라” (<a href="https://bibleox.com/ko/ko-nkrv/pr/28/#L21">잠 28:21</a>)</p></blockquote><blockquote><p>“그분은 정의를 갑옷으로 입으시고 <strong>치우침 없는 심판</strong>을 투구로 쓰시리라” (<a href="https://bibleox.com/ko/gr-lxx-byz/prs/5/#L18">지혜 5:18</a>, 그리스어에서 번역)</p></blockquote><blockquote><p>“이런 일에 부끄러워하지 말고 <strong>사람을 보아 주어 죄를 짓지 말라</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/prsir/42/#L1-2">집회 42:1-2</a>, 그리스어에서 번역)</p></blockquote><blockquote><p>“너희가 내 길을 지키지 아니하고 <strong>율법을 행할 때에 사람에게 치우치게 하였으므로</strong> 나도 너희로 하여금 모든 백성 앞에서 멸시와 천대를 당하게 하였느니라 하시니라” (<a href="https://bibleox.com/ko/ko-nkrv/mal/2/#L9">말 2:9</a>)</p></blockquote><blockquote><p>“이 사람들은 원망하는 자며 불만을 토하는 자며 그 정욕대로 행하는 자라 그 입으로 자랑하는 말을 하며 <strong>이익을 위하여 아첨하느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/iud/1/#L16">유 1:16</a>)</p></blockquote>
