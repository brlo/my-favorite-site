- src: Злословие
  path: Ev16s_비방
  title: 비방
  copy_cover: true
  body: '<h2>비방(모욕)</h2><blockquote><p>“<strong>네 입을 악에게 내어 주고</strong> 네 혀로 거짓을 꾸미며” (<a href="https://bibleox.com/ko/ko-nkrv/ps/50/#L19">시 50:19</a>)</p></blockquote><blockquote><p>“그들의 목구멍은 열린 무덤이요 그 혀로는 속임을 일삼으며 그 입술에는 독사의 독이 있고 <strong>그 입에는 저주와 악독이 가득하고</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/rim/3/#L13-14">롬 3:13-14</a>)</p></blockquote><blockquote><p>“<strong>아무도 비방하지 말며</strong> 다투지 말며 관용하며 범사에 온유함을 모든 사람에게 나타낼 것을 기억하게 하라” (<a href="https://bibleox.com/ko/ko-nkrv/tit/3/#L2">딛 3:2</a>)</p></blockquote><blockquote><p>“<strong>욕을 당하시되 맞대어 욕하지 아니하시고</strong> 고난을 당하시되 위협하지 아니하시고 오직 공의로 심판하시는 이에게 부탁하시며” (<a href="https://bibleox.com/ko/ko-nkrv/1pet/2/#L23">벧전 2:23</a>)</p></blockquote><blockquote><p>“그러므로 <strong>모든 악독과</strong> 모든 기만과 외식과 시기와 <strong>모든 비방하는 말을 버리고</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1pet/2/#L1">벧전 2:1</a>)</p></blockquote><blockquote><p>“이제는 너희가 이 모든 것을 벗어 버리라 곧 분함과 노여움과 악의와 <strong>비방과</strong> 너희 입의 부끄러운 말이라” (<a href="https://bibleox.com/ko/ko-nkrv/kol/3/#L8">골 3:8</a>)</p></blockquote><h3>하느님에 대한 비방</h3><blockquote><p>“그 이스라엘 여인의 아들이 여호와의 이름을 모독하며 저주하므로 무리가 끌고 모세에게로 가니라 그의 어머니의 이름은 슬로밋이요 단 지파 디브리의 딸이었더라 &lt;…&gt; 너는 이스라엘 자손에게 말하여 이르라 <strong>누구든지 그의 하나님을 저주하면 죄를 담당할 것이요</strong> 여호와의 이름을 모독하면 그를 반드시 죽일지니 온 회중이 돌로 그를 칠 것이니라 거류민이든지 본토인이든지 여호와의 이름을 모독하면 그를 죽일지니라” (<a href="https://bibleox.com/ko/ko-nkrv/lev/24/#L11,15-16">레 24:11,15-16</a>)</p></blockquote><h3>부모에 대한 비방</h3><blockquote><p>“<strong>자기의 아버지나 어머니를 저주하는 자는</strong> 반드시 죽일지니라” (<a href="https://bibleox.com/ko/ko-nkrv/ish/21/#L17">출 21:17</a>)</p></blockquote><blockquote><p>“<strong>그의 부모를 경홀히 여기는 자는 저주를 받을 것이라</strong> 할 것이요 모든 백성은 아멘 할지니라” (<a href="https://bibleox.com/ko/ko-nkrv/vtor/27/#L16">신 27:16</a>)</p></blockquote><blockquote><p>“<strong>자기의 아비나 어미를 저주하는 자는</strong> 그의 등불이 흑암 중에 꺼짐을 당하리라” (<a href="https://bibleox.com/ko/ko-nkrv/pr/20/#L20">잠 20:20</a>)</p></blockquote><h3>이웃에 대한 비방</h3><blockquote><p>“<strong>형제들아 서로 비방하지 말라</strong> 형제를 비방하는 자나 형제를 판단하는 자는 곧 율법을 비방하고 율법을 판단하는 것이라 네가 만일 율법을 판단하면 율법의 준행자가 아니요 재판관이로다” (<a href="https://bibleox.com/ko/ko-nkrv/iak/4/#L11">약 4:11</a>)</p></blockquote><h3>권세자와 다스리는 이들에 대한 비방</h3><blockquote><p>“<strong>너는 재판장을 모독하지 말며</strong> <strong>백성의 지도자를 저주하지 말지니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ish/22/#L28">출 22:28</a>) <em>(“재판장”은 히브리어로 אֱלֹהִים, “하나님”으로도 옮길 수 있습니다(NKJV: You shall not revile God).)</em></p></blockquote><blockquote><p>“그러한데 꿈꾸는 이 사람들도 그와 같이 육체를 더럽히며 권위를 업신여기며 <strong>영광을 비방하는도다</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/iud/1/#L8">유 1:8</a>)</p></blockquote><blockquote><p>“특별히 육체를 따라 더러운 정욕 가운데서 행하며 주관하는 이를 멸시하는 자들에게는 형벌할 줄 아시느니라 이들은 당돌하고 자긍하며 떨지 않고 <strong>영광 있는 자들을 비방하거니와</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2pet/2/#L10">벧후 2:10</a>)</p></blockquote>'
