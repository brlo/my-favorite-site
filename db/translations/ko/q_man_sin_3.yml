  title: 동성애(남색)
  copy_cover: true
  body: <p>동성애는 죄이며 하느님 앞에 가증한 일입니다:</p><blockquote><p>“<strong>너는 여자와 동침함 같이 남자와 동침하지 말라 이는 가증한 일이니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/lev/18/#L22">레 18:22</a>)</p></blockquote><blockquote><p>“누구든지 여인과 동침하듯 남자와 동침하면 <strong>둘 다 가증한 일을 행함인즉</strong> 반드시 죽일지니 자기의 피가 자기에게로 돌아가리라” (<a href="https://bibleox.com/ko/ko-nkrv/lev/20/#L13">레 20:13</a>)</p></blockquote><p>동성애는 부끄러운 욕심이며 그에 상당한 보응을 받습니다:</p><blockquote><p>“이 때문에 하나님께서 그들을 <strong>부끄러운 욕심에 내버려 두셨으니</strong> 곧 그들의 여자들도 순리대로 쓸 것을 바꾸어 역리로 쓰며 그와 같이 남자들도 순리대로 여자 쓰기를 버리고 서로 향하여 음욕이 불 일듯 하매 남자가 남자와 더불어 부끄러운 일을 행하여 <strong>그들의 그릇됨에 상당한 보응을 그들 자신이 받았느니라</strong> 또한 그들이 마음에 하나님 두기를 싫어하매 하나님께서 그들을 그 상실한 마음대로 내버려 두사 합당하지 못한 일을 하게 하셨으니 &lt;…&gt; 그들이 이같은 일을 행하는 자는 사형에 해당한다고 하나님께서 정하심을 알고도 자기들만 행할 뿐 아니라 또한 그런 일을 행하는 자들을 옳다 하느니라” (<a href="https://bibleox.com/ko/ko-nkrv/rim/1/#L26-28,32">롬 1:26-28,32</a>)</p></blockquote><p>동성애는 죽음에 이르는 죄입니다:</p><blockquote><p>“불의한 자가 하나님의 나라를 유업으로 받지 못할 줄을 알지 못하느냐 미혹을 받지 말라 음행하는 자나 우상 숭배하는 자나 간음하는 자나 탐색하는 자나 <strong>남색하는 자나</strong> 도적이나 탐욕을 부리는 자나 술 취하는 자나 모욕하는 자나 속여 빼앗는 자들은 <strong>하나님의 나라를 유업으로 받지 못하리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/6/#L9-10">고전 6:9-10</a>)</p></blockquote><p>동성애는 불법이며, 계명이 금하는 것이고, 하느님께로부터 온 바른 교훈을 거스르는 것입니다:</p><blockquote><p>“알 것은 이것이니 율법은 옳은 사람을 위하여 세운 것이 아니요 오직 불법한 자와 복종하지 아니하는 자와 경건하지 아니한 자와 죄인과 거룩하지 아니한 자와 망령된 자와 아버지를 죽이는 자와 어머니를 죽이는 자와 살인하는 자며 음행하는 자와 <strong>남색하는 자와</strong> 인신 매매를 하는 자와 거짓말하는 자와 거짓맹세하는 자와 기타 <strong>바른 교훈을 거스르는 자를 위함이니</strong> 이 교훈은 내게 맡기신 바 복되신 하나님의 영광의 복음을 따름이니라” (<a href="https://bibleox.com/ko/ko-nkrv/1tim/1/#L9-11">딤전 1:9-11</a>)</p></blockquote><p>소돔과 고모라는 동성애의 죄 때문에 멸망했습니다:</p><blockquote><p>“그들이 눕기 전에 그 성 사람 곧 소돔 백성들이 노소를 막론하고 원근에서 다 모여 그 집을 에워싸고 롯을 부르고 그에게 이르되 오늘 밤에 네게 온 사람들이 어디 있느냐 이끌어 내라 <strong>우리가 그들을 상관하리라</strong> 롯이 문 밖의 무리에게로 나가서 뒤로 문을 닫고 이르되 청하노니 내 형제들아 <strong>이런 악을 행하지 말라</strong> &lt;…&gt; 그 사람들이 손을 내밀어 롯을 집으로 끌어들이고 문을 닫고 문 밖의 무리를 대소를 막론하고 그 눈을 어둡게 하니 그들이 문을 찾느라고 헤매었더라 그 사람들이 롯에게 이르되 이 외에 네게 속한 자가 또 있느냐 네 사위나 자녀나 성 중에 네게 속한 자들을 다 성 밖으로 이끌어 내라 그들에 대한 부르짖음이 여호와 앞에 크므로 여호와께서 이 곳을 멸하시려고 우리를 보내셨나니 우리가 멸하리라” (<a href="https://bibleox.com/ko/ko-nkrv/gen/19/#L4-7,10-13">창 19:4-7,10-13</a>)</p></blockquote><blockquote><p>“<strong>소돔과 고모라와 그 이웃 도시들도</strong> 그들과 같은 행동으로 음란하며 <strong>다른 육체를 따라 가다가 영원한 불의 형벌을 받음으로</strong> 거울이 되었느니라” (<a href="https://bibleox.com/ko/ko-nkrv/iud/1/#L7">유 1:7</a>)</p></blockquote><p>민족들은 동성애의 죄 때문에 하느님께서 히브리인들에게 약속하신 땅에서 쫓겨났습니다:</p><blockquote><p>“너는 내가 오늘 네게 명령하는 것을 삼가 지키라 보라 내가 네 앞에서 아모리 사람과 가나안 사람과 헷 사람과 브리스 사람과 히위 사람과 여부스 사람을 <strong>쫓아내리니</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ish/34/#L11">출 34:11</a>)</p></blockquote><blockquote><p>“너는 여자와 동침함 같이 남자와 동침하지 말라 이는 가증한 일이니라 &lt;…&gt; 너희는 이 모든 일로 스스로 더럽히지 말라 <strong>내가 너희 앞에서 쫓아내는 족속들이 이 모든 일로 말미암아 더러워졌고</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/lev/18/#L22,24">레 18:22,24</a>)</p></blockquote><blockquote><p>“누구든지 여인과 동침하듯 남자와 동침하면 둘 다 가증한 일을 행함인즉 반드시 죽일지니 자기의 피가 자기에게로 돌아가리라 &lt;…&gt; 너희는 내가 너희 앞에서 쫓아내는 족속의 풍속을 따르지 말라 <strong>그들이 이 모든 일을 행하므로 내가 그들을 가증히 여기노라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/lev/20/#L13,23">레 20:13,23</a>)</p></blockquote>
