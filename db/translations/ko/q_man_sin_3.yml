- src: yD3R_Воровство
  path: Th19f_도둑질
  title: 도둑질
  copy_cover: true
  body: <blockquote><p>“<strong>불의한 자가 하나님의 나라를 유업으로 받지 못할 줄을 알지 못하느냐</strong> <strong>미혹을 받지 말라</strong> 음행하는 자나 우상 숭배하는 자나 간음하는 자나 탐색하는 자나 남색하는 자나 <strong><mark>도적이나</mark></strong> 탐욕을 부리는 자나 술 취하는 자나 모욕하는 자나 속여 빼앗는 자들은 <strong><mark>하나님의 나라를 유업으로 받지 못하리라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/6/#L9-10">고전 6:9-10</a>)</p></blockquote><blockquote><p>“<strong>도둑질하는 자는 다시 도둑질하지 말고</strong> 돌이켜 가난한 자에게 구제할 수 있도록 자기 손으로 수고하여 선한 일을 하라” (<a href="https://bibleox.com/ko/ko-nkrv/ef/4/#L28">엡 4:28</a>)</p></blockquote><blockquote><p>“<strong><mark>무릇 나 여호와는 정의를 사랑하며 불의의 강탈을 미워하여</mark></strong> 성실히 그들에게 갚아 주고 그들과 영원한 언약을 맺을 것이라” (<a href="https://bibleox.com/ko/ko-nkrv/is/61/#L8">사 61:8</a>)</p></blockquote><blockquote><p>“그가 내게 이르되 이는 온 땅 위에 내리는 저주라 <strong>도둑질하는 자는 그 이쪽 글대로 끊어지고</strong> 맹세하는 자는 그 저쪽 글대로 끊어지리라 하니 만군의 여호와께서 이르시되 내가 이것을 보냈나니 도둑의 집에도 들어가며 내 이름을 가리켜 망령되이 맹세하는 자의 집에도 들어가서 그의 집에 머무르며 그 집을 나무와 돌과 아울러 사르리라 하셨느니라 하니라” (<a href="https://bibleox.com/ko/ko-nkrv/zah/5/#L3-4">슥 5:3-4</a>)</p></blockquote><blockquote><p>“<strong>너희가 도둑질하며</strong> 살인하며 간음하며 거짓 맹세하며 바알에게 분향하며 너희가 알지 못하는 다른 신들을 따르면서 내 이름으로 일컬음을 받는 이 집에 들어와서 <strong>내 앞에 서서</strong> 말하기를 우리가 구원을 얻었나이다 하느냐 이는 이 모든 가증한 일을 행하려 함이로다” (<a href="https://bibleox.com/ko/ko-nkrv/ier/7/#L9-10">렘 7:9-10</a>)</p></blockquote><blockquote><p>“하나님이 이 모든 말씀으로 말씀하여 이르시되 &lt;…&gt; <strong>도둑질하지 말라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ish/20/#L1,15">출 20:1,15</a>)</p></blockquote><blockquote><p>“여호와께서 모세에게 말씀하여 이르시되 &lt;…&gt; <strong>너희는 도둑질하지 말며</strong> 속이지 말며 서로 거짓말하지 말며” (<a href="https://bibleox.com/ko/ko-nkrv/lev/19/#L1,11">레 19:1,11</a>)</p></blockquote><blockquote><p>“<strong><mark>가령 내가 악인에게 말하기를 너는 죽으리라 하였다 하자 그가 돌이켜 자기의 죄에서 떠나서</mark></strong> 정의와 공의로 행하여 <strong><mark>저당물을 도로 주며 강탈한 물건을 돌려 보내고 생명의 율례를 지켜 행하여</mark></strong> 죄악을 범하지 아니하면 <strong><mark>그가 반드시 살고 죽지 아니할지라</mark></strong> <strong>그가 본래 범한 모든 죄가 기억되지 아니하리니</strong> 그가 반드시 살리라 이는 정의와 공의를 행하였음이라 하라” (<a href="https://bibleox.com/ko/ko-nkrv/iez/33/#L14-16">겔 33:14-16</a>)</p></blockquote><blockquote><p>“<strong><mark>삭개오가 서서 주께 여짜오되 주여 보시옵소서 내 소유의 절반을 가난한 자들에게 주겠사오며 만일 누구의 것을 속여 빼앗은 일이 있으면 네 갑절이나 갚겠나이다</mark></strong> 예수께서 이르시되 <strong><mark>오늘 구원이 이 집에 이르렀으니</mark></strong> 이 사람도 아브라함의 자손임이로다 인자가 온 것은 잃어버린 자를 찾아 구원하려 함이니라” (<a href="https://bibleox.com/ko/ko-nkrv/lk/19/#L8-10">눅 19:8-10</a>)</p></blockquote>
  menu:
    parent: 사람/죄
