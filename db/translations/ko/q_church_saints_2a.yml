  path: Vs4n_성인_공경
  title: 성인 공경
  copy_cover: true
  body: '<h2>머리말</h2><p>의로운 성인들과 천사들은 신이 아니라 하느님의 벗으로서 공경받습니다. 그들 자체 때문이 아니라 하느님께 참여하기 때문에, 그들 안에 사는 하느님의 은총 때문에 공경받습니다(글: <a href="https://bibleox.com/ru/ru/w/человек-храм-Божий">사람은 하느님의 성전</a>). 성경에 따르면 영예는 하느님께만 드리는 것이 아니고, 사람들은 하느님께만 절하는 것이 아닙니다. 하느님 자신이 하느님께서 주시는 영광을 찾으라고 우리를 부르셨고, 의인들을 영광스럽게 하겠다고 약속하시고 그렇게 하셨으며, 교회는 하느님을 따라 거룩한 하느님의 벗들을 찬양합니다.</p><p>하느님께서는 성인들을 통해 그들의 생전에도, 그들의 <strong>죽은 몸</strong>(<a href="https://bibleox.com/ko/ko-nkrv/4ts/13/#L21">왕하 13:21</a>)과 <strong>개인 소지품</strong>(<a href="https://bibleox.com/ko/ko-nkrv/act/19/#L12">행 19:12</a>)과 <strong>형상</strong>(<a href="https://bibleox.com/ko/ko-nkrv/act/5/#L15-16">행 5:15-16</a>)을 통해서도 은총을 보내십니다. 그래서 이 모든 것도 공경받습니다. 자세한 내용은 해당 글에 있습니다:</p><ul><li><p><a href="https://bibleox.com/ru/ru/w/почитание-мощей-святых">성인 유해 공경</a>;</p></li><li><p><a href="https://bibleox.com/ru/ru/w/иконы-иконопочитание-иконоборчество">성인 이콘 공경</a>.</p></li></ul><h2>영예는 하느님께만 드리는 것이 아닙니다</h2><h3>하느님께 드리는 영예</h3><blockquote><p>“내 이름을 멸시하는 제사장들아 나 만군의 여호와가 너희에게 이르기를 아들은 그 아버지를, 종은 그 주인을 공경하나니 <strong><mark>내가 아버지일진대 나를 공경함이 어디 있느냐</mark></strong> <strong>내가 주인일진대 나를 두려워함이 어디 있느냐</strong> 하나 너희는 이르기를 우리가 어떻게 주의 이름을 멸시하였나이까 하는도다” (<a href="https://bibleox.com/ko/ko-nkrv/mal/1/#L6">말 1:6</a>)</p></blockquote><h3>사제에게</h3><blockquote><p>“주님을 두려워하고 <strong>사제를 영화롭게 하여라</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/prsir/7/#L31">집회 7:31</a>, 그리스어에서 번역)</p></blockquote><h3>경건한 그리스도인들에게</h3><blockquote><p>“내가 스데바나와 브드나도와 아가이고가 온 것을 기뻐하노니 그들이 너희의 부족한 것을 채웠음이라 그들이 나와 너희 마음을 시원하게 하였으니 그러므로 너희는 <strong><mark>이런 사람들을 알아 주라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/16/#L17-18">고전 16:17-18</a>)</p></blockquote><h3>아내에게</h3><blockquote><p>“남편들아 이와 같이 지식을 따라 너희 아내와 동거하고 그를 더 연약한 그릇이요 또 생명의 은혜를 함께 이어받을 자로 알아 <strong><mark>귀히 여기라</mark></strong> 이는 너희 기도가 막히지 아니하게 하려 함이라” (<a href="https://bibleox.com/ko/ko-nkrv/1pet/3/#L7">벧전 3:7</a>)</p></blockquote><h3>아버지와 어머니에게</h3><blockquote><p>“<strong><mark>네 부모를 공경하라</mark></strong> 그리하면 네 하나님 여호와가 네게 준 땅에서 네 생명이 길리라” (<a href="https://bibleox.com/ko/ko-nkrv/ish/20/#L12">출 20:12</a>)</p></blockquote><h3>노인에게</h3><blockquote><p>“너는 센 머리 앞에서 일어서고 <strong><mark>노인의 얼굴을 공경하며</mark></strong> 네 하나님을 경외하라 나는 여호와이니라” (<a href="https://bibleox.com/ko/ko-nkrv/lev/19/#L32">레 19:32</a>)</p></blockquote><h3>과부에게</h3><blockquote><p>“<strong><mark>참 과부인 과부를 존대하라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1tim/5/#L3">딤전 5:3</a>)</p></blockquote><h3>국가 권력에게</h3><blockquote><p>“뭇 사람을 공경하며 형제를 사랑하며 하나님을 두려워하며 <strong><mark>왕을 존대하라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1pet/2/#L17">벧전 2:17</a>)</p></blockquote><blockquote><p>“각 사람은 <strong><mark>위에 있는 권세들</mark></strong>에게 복종하라 권세는 하나님으로부터 나지 않음이 없나니 모든 권세는 다 하나님께서 정하신 바라 &lt;…&gt; 모든 자에게 줄 것을 주되 조세를 받을 자에게 조세를 바치고 관세를 받을 자에게 관세를 바치고 두려워할 자를 두려워하며 <strong><mark>존경할 자를 존경하라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/rim/13/#L1,7">롬 13:1,7</a>)</p></blockquote><h3>모든 사람에게</h3><blockquote><p>“<strong><mark>뭇 사람을 공경하며</mark></strong> 형제를 사랑하며 하나님을 두려워하며 왕을 존대하라” (<a href="https://bibleox.com/ko/ko-nkrv/1pet/2/#L17">벧전 2:17</a>)</p></blockquote><blockquote><p>“형제를 사랑하여 서로 우애하고 <strong><mark>존경하기를 서로 먼저 하며</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/rim/12/#L10">롬 12:10</a>)</p></blockquote><h2>성인에게 드리는 절</h2><p>십계명의 둘째 계명(<a href="https://bibleox.com/ko/ko-nkrv/ish/20/#L4-5">출 20:4-5</a>; <a href="https://bibleox.com/ko/ko-nkrv/vtor/5/#L8-9">신 5:8-9</a>)은 거짓 신(우상) 숭배를 금합니다. 거짓 신은 실제로 신이 아닙니다. 그들의 신성은 지어낸 것이고 환상이며 거짓입니다.</p><p>성인들은 실제로 존재하고 하느님의 벗이며, 신으로 숭배받지 않습니다. 성인에게 드리는 절은 하느님의 벗, 하느님의 종(천사), 하느님의 어머니인 그분들에 대한 존경의 표현입니다. 천사와 사람과 사물에게 드리는 이런 절은 성경에 나오며 우상 숭배가 아닙니다. 우상 숭배는 거짓 신, 곧 거짓을 숭배하는 것이기 때문입니다. 의인들은 사람에게는 사람으로서, 천사에게는 천사로서, 예언자에게는 예언자로서, 사물에게는 사물로서 늘 절합니다. 이 모든 경우에 그들은 신에게 하듯 절하지 않습니다.</p><h3>천사의 모습으로 나타나신 하느님께 드리는 절</h3><p>하느님께서 나타나셨지만 세 천사는 하느님의 실제 모습, 세상 창조 전부터 그러하신 모습이 아닙니다. 곧 이것은 하느님의 <strong>형상</strong>(그리스어 εἰκόνα, 이콘)이며, 아브라함은 하느님의 이콘 앞에 절합니다:</p><blockquote><p>“<strong>여호와께서</strong> 마므레의 상수리나무들이 있는 곳에서 <strong>아브라함에게 나타나시니라</strong> 날이 뜨거울 때에 그가 장막 문에 앉아 있다가 눈을 들어 본즉 <strong>사람 셋이</strong> 맞은편에 서 있는지라 그가 그들을 보자 곧 장막 문에서 달려나가 영접하며 <strong>몸을 땅에 굽혀</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gen/18/#L1-2">창 18:1-2</a>)</p></blockquote><h3>천사에게 드리는 절</h3><blockquote><p>“그가 이르되 아니라 나는 여호와의 군대 대장으로 지금 왔느니라 하는지라 여호수아가 <strong>얼굴을 땅에 대고 엎드려 절하고</strong> 그에게 이르되 내 주여 종에게 무슨 말씀을 하려 하시나이까” (<a href="https://bibleox.com/ko/ko-nkrv/nav/5/#L14">수 5:14</a>)</p></blockquote><h3>예언자에게 드리는 절</h3><blockquote><p>“맞은편 여리고에 있는 선지자의 제자들이 그를 보며 말하기를 엘리야의 성령이 하시는 역사가 엘리사 위에 머물렀다 하고 가서 그에게로 나아가 <strong>땅에 엎드려 그에게 경배하고</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/4ts/2/#L15">왕하 2:15</a>)</p></blockquote><h3>성전을 향한 절</h3><blockquote><p>“오직 나는 주의 풍성한 사랑을 힘입어 주의 집에 들어가 주를 경외함으로 <strong>성전을 향하여 예배하리이다</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ps/5/#L7">시 5:7</a>)</p></blockquote><h3>하느님의 발판(성전)에 드리는 절</h3><blockquote><p>“너희는 여호와 우리 하나님을 높여 <strong>그의 발등상 앞에서 경배할지어다</strong> <strong>그는 거룩하시도다</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ps/99/#L5">시 99:5</a>)</p></blockquote><blockquote><p>“우리가 <strong>그의 계신 곳으로 들어가서 그의 발등상 앞에서 엎드려 예배하리로다</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ps/132/#L7">시 132:7</a>)</p></blockquote><h3>계약궤 앞의 절</h3><blockquote><p>“여호수아가 옷을 찢고 이스라엘 장로들과 함께 <strong>여호와의 궤 앞에서 땅에 엎드려</strong> 머리에 티끌을 뒤집어쓰고 저물도록 있다가” (<a href="https://bibleox.com/ko/ko-nkrv/nav/7/#L6">수 7:6</a>)</p></blockquote><h3>지팡이에 드리는 절</h3><blockquote><p>“야곱이 또 이르되 내게 맹세하라 하매 그가 맹세하니 <strong>이스라엘이 침상 머리에서 하나님께 경배하니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gen/47/#L31">창 47:31</a>; <a href="https://bibleox.com/ko/ko-nkrv/evr/11/#L21">히 11:21</a>) <em>(칠십인역에는 “지팡이 끝에”(προσεκύνησεν Ισραηλ ἐπὶ τὸ ἄκρον τῆς ῥάβδου αὐτοῦ)로 되어 있습니다. 히브리서 11:21도 같습니다.)</em></p></blockquote><p>더 많은 예: <a href="https://bibleox.com/ru/ru/w/поклоны">절</a>.</p><h3>묵시록에서 천사가 자기가 아니라 하느님께 경배하라고 명하는 까닭</h3><p>사도 요한의 환시에서 하느님께서는 가까이 눈에 보이게 계십니다. 그런 상황에서 천사를 가장 중요한 이처럼 공경하는 것은 이상할 것입니다. 그래서 천사는 하느님께 경배하라고 부릅니다:</p><blockquote><p>“내가 그 발 앞에 엎드려 경배하려 하니 그가 나에게 말하기를 <strong>나는 너와 및 예수의 증언을 받은 네 형제들과 같이 된 종이니 삼가 그리하지 말고</strong> <strong><mark>오직 하나님께 경배하라</mark></strong> 예수의 증언은 예언의 영이라 하더라” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/19/#L10">계 19:10</a>)</p></blockquote><blockquote><p>“그가 내게 말하기를 <strong>나는 너와 네 형제 선지자들과</strong> 또 이 두루마리의 말을 지키는 자들과 함께 된 종이니 그리하지 말고 <strong><mark>하나님께 경배하라</mark></strong> 하더라” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/22/#L9">계 22:9</a>)</p></blockquote><p>다른 때에 천사는 예언자 눈의 아들 여호수아의 절을 받습니다:</p><blockquote><p>“그가 이르되 아니라 나는 여호와의 군대 대장으로 지금 왔느니라 하는지라 여호수아가 <strong>얼굴을 땅에 대고 엎드려 절하고</strong> 그에게 이르되 내 주여 종에게 무슨 말씀을 하려 하시나이까” (<a href="https://bibleox.com/ko/ko-nkrv/nav/5/#L14">수 5:14</a>)</p></blockquote><h2>성인들은 영예를 누릴 것입니다</h2><blockquote><p>“큰 집에는 금 그릇과 은 그릇뿐 아니라 나무 그릇과 질그릇도 있어 <strong>귀하게 쓰는 것도 있고</strong> 천하게 쓰는 것도 있나니 그러므로 <strong><mark>누구든지 이런 것에서 자기를 깨끗하게 하면 귀히 쓰는 그릇이 되어</mark></strong> 거룩하고 주인의 쓰심에 합당하며 모든 선한 일에 준비함이 되리라” (<a href="https://bibleox.com/ko/ko-nkrv/2tim/2/#L20-21">딤후 2:20-21</a>)</p></blockquote><blockquote><p>“<strong><mark>선을 행하는 각 사람에게는 영광과 존귀와 평강이 있으리니</mark></strong> 먼저는 유대인에게요 그리고 헬라인에게라” (<a href="https://bibleox.com/ko/ko-nkrv/rim/2/#L10">롬 2:10</a>)</p></blockquote><h2>주님께서는 의인들을 영광스럽게 하겠다고 약속하셨습니다</h2><blockquote><p>“그러므로 이스라엘의 하나님 나 여호와가 말하노라 내가 전에 네 집과 네 조상의 집이 내 앞에 영원히 행하리라 하였으나 이제 나 여호와가 말하노니 결단코 그렇게 하지 아니하리라 <strong><mark>나를 존중히 여기는 자를 내가 존중히 여기고</mark></strong> 나를 멸시하는 자를 내가 경멸하리라” (<a href="https://bibleox.com/ko/ko-nkrv/1ts/2/#L30">삼상 2:30</a>)</p></blockquote><blockquote><p>“사람이 나를 섬기려면 나를 따르라 나 있는 곳에 나를 섬기는 자도 거기 있으리니 <strong><mark>사람이 나를 섬기면 내 아버지께서 그를 귀히 여기시리라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/in/12/#L26">요 12:26</a>)</p></blockquote><blockquote><p>“내가 비옵는 것은 이 사람들만 위함이 아니요 또 그들의 말로 말미암아 나를 믿는 사람들도 위함이니 &lt;…&gt; <strong><mark>내게 주신 영광을 내가 그들에게 주었사오니</mark></strong> 이는 우리가 하나가 된 것 같이 그들도 하나가 되게 하려 함이니이다” (<a href="https://bibleox.com/ko/ko-nkrv/in/17/#L20,22">요 17:20,22</a>)</p></blockquote><blockquote><p>“하나님이 미리 아신 자들을 또한 그 아들의 형상을 본받게 하기 위하여 미리 정하셨으니 이는 그로 많은 형제 중에서 맏아들이 되게 하려 하심이니라 또 미리 정하신 그들을 또한 부르시고 부르신 그들을 또한 의롭다 하시고 <strong><mark>의롭다 하신 그들을 또한 영화롭게 하셨느니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/rim/8/#L29-30">롬 8:29-30</a>)</p></blockquote><p>영광스럽게 하심은 무엇보다 기도의 성취와 행실을 통해 이루어집니다:</p><blockquote><p>“너희가 내 이름으로 <strong>무엇을 구하든지</strong> <strong><mark>내가 행하리니</mark></strong> 이는 <strong><mark>아버지로 하여금 아들로 말미암아 영광을 받으시게 하려 함이라</mark></strong> 내 이름으로 무엇이든지 내게 구하면 <strong><mark>내가 행하리라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/in/14/#L13-14">요 14:13-14</a>)</p></blockquote><p>그래도 결국 영광을 받으시는 분은 아버지이십니다. 다만 아들 안에서이니 아들도 영광을 받으십니다.</p><h2>하느님께서 주시는 영광을 찾습니다</h2><blockquote><p>“너희가 서로 영광을 취하고 <strong><mark>유일하신 하나님께로부터 오는 영광은 구하지 아니하니</mark></strong> 어찌 나를 믿을 수 있느냐” (<a href="https://bibleox.com/ko/ko-nkrv/in/5/#L44">요 5:44</a>)</p></blockquote><blockquote><p>“다만 네 고집과 회개하지 아니한 마음을 따라 진노의 날 곧 <strong><mark>하나님의 의로우신 심판</mark></strong>이 나타나는 그 날에 임할 진노를 네게 쌓는도다 하나님께서 <strong>각 사람에게 그 행한 대로 보응하시되</strong> <strong><mark>참고 선을 행하여 영광과 존귀와 썩지 아니함을 구하는 자에게는 영생으로 하시고</mark></strong> 오직 당을 지어 진리를 따르지 아니하고 불의를 따르는 자에게는 진노와 분노로 하시리라” (<a href="https://bibleox.com/ko/ko-nkrv/rim/2/#L5-8">롬 2:5-8</a>)</p></blockquote><h2>성인들의 영광</h2><blockquote><p>“그러므로 만물이 그를 위하고 또한 그로 말미암은 이가 <strong><mark>많은 아들들을 이끌어 영광에 들어가게 하시는 일에</mark></strong> 그들의 구원의 창시자를 고난을 통하여 온전하게 하심이 합당하도다” (<a href="https://bibleox.com/ko/ko-nkrv/evr/2/#L10">히 2:10</a>)</p></blockquote><blockquote><p>“우리가 다 수건을 벗은 얼굴로 거울을 보는 것 같이 <strong>주의 영광을 보매</strong> <strong><mark>그와 같은 형상으로 변화하여 영광에서 영광에 이르니</mark></strong> 곧 주의 영으로 말미암음이니라” (<a href="https://bibleox.com/ko/ko-nkrv/2kor/3/#L18">고후 3:18</a>)</p></blockquote><blockquote><p>“악을 행하는 각 사람의 영에는 환난과 곤고가 있으리니 먼저는 유대인에게요 그리고 헬라인에게며 <strong><mark>선을 행하는 각 사람에게는 영광과 존귀와 평강이 있으리니</mark></strong> 먼저는 유대인에게요 그리고 헬라인에게라” (<a href="https://bibleox.com/ko/ko-nkrv/rim/2/#L9-10">롬 2:9-10</a>)</p></blockquote><blockquote><p>“그가 그의 백성의 뿔을 높이셨으니 그는 <strong><mark>모든 성도 곧 그를 가까이 하는 백성 이스라엘 자손의 찬양 받을 이시로다</mark></strong> 할렐루야” (<a href="https://bibleox.com/ko/ko-nkrv/ps/148/#L14">시 148:14</a>)</p></blockquote><h2>교회는 의인들을 찬양할 것입니다</h2><blockquote><p>“이제 영광스러운 사람들을 찬양하자. … <strong>주님께서는 큰 영광을 창조하셨고</strong> 영원부터 <strong>당신의 위엄을 나타내셨다</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/prsir/44/#L1-2">집회 44:1-2</a>, 그리스어에서 번역)</p></blockquote><blockquote><p>“… <strong>그들의 영광은 지워지지 않을 것이다</strong>. 그들의 몸은 평화 속에 묻혔으나 그들의 이름은 대대로 살아 있다. 백성들은 그들의 지혜를 이야기하고 <strong>회중은 그들의 찬양을 전한다</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/prsir/44/#L13-15">집회 44:13-15</a>, 그리스어에서 번역)</p></blockquote><h2>앞서 간 이들의 행실과 믿음을 잊지 말고 본받아야 합니다</h2><blockquote><p>“하나님의 말씀을 너희에게 일러 주고 <strong><mark>너희를 인도하던 자들을 생각하며</mark></strong> 그들의 행실의 결말을 주의하여 보고 <strong><mark>그들의 믿음을 본받으라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/evr/13/#L7">히 13:7</a>)</p></blockquote><blockquote><p>“그러므로 내가 너희에게 권하노니 <strong><mark>너희는 나를 본받는 자가 되라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/4/#L16">고전 4:16</a>)</p></blockquote><blockquote><p>“형제들아 <strong><mark>너희는 함께 나를 본받으라 그리고 너희가 우리를 본받은 것처럼 그와 같이 행하는 자들을 눈여겨 보라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/fil/3/#L17">빌 3:17</a>)</p></blockquote><h2>성인들과 함께하는 삶을 바랍니다</h2><blockquote><p>“내가 여호와께 아뢰되 주는 나의 주님이시오니 주 밖에는 나의 복이 없다 하였나이다 <strong><mark>땅에 있는 성도들은 존귀한 자들이니 나의 모든 즐거움이 그들에게 있도다</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ps/16/#L2-3">시 16:2-3</a>)</p></blockquote><h2>묵시록의 짐승은 성인들을 모독할 것입니다</h2><h3>짐승은 하늘에 사는 이들을 모독할 것입니다</h3><blockquote><p>“짐승이 입을 벌려 하나님을 향하여 비방하되 그의 이름과 그의 장막 곧 <strong><mark>하늘에 사는 자들을 비방하더라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/13/#L6">계 13:6</a>)</p></blockquote><h3>의인들의 영혼과 천사들은 하늘에 삽니다</h3><blockquote><p>“그러나 <strong><mark>너희가 이른 곳은</mark></strong> 시온 산과 살아 계신 하나님의 도성인 <strong><mark>하늘의 예루살렘과 천만 천사와</mark></strong> <strong>하늘에 기록된 장자들의 모임과 교회와</strong> 만민의 심판자이신 하나님과 및 <strong><mark>온전하게 된 의인의 영들과</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/evr/12/#L22-23">히 12:22-23</a>)</p></blockquote><h2>비판</h2><h3>교회는 누가 성인인지 어떻게 압니까? 사람이 하느님 대신 결정하는 것이 아닙니까?</h3><p><a href="https://bibleox.com/ru/ru/w/молитвы-святым">성인들에게 드리는 기도</a>의 해당 부분에서 답을 보십시오.</p><h3>하느님께서는 당신의 영광을 아무에게도 주지 않으신다</h3><blockquote><p>“나는 여호와이니 이는 내 이름이라 <strong>나는 내 영광을 다른 자에게, 내 찬송을 우상에게 주지 아니하리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/is/42/#L8">사 42:8</a>)</p></blockquote><p>이것은 우상, 곧 거짓 신들에 관한 말씀입니다. 하느님께서 친히 사람들을 영광스럽게 하신다는 많은 구절이 위에 있습니다.</p><h2>관련 구절</h2><ol><li><p><a href="https://bibleox.com/ru/ru/w/почитание-мощей-святых">성인 유해 공경</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/иконы-иконопочитание-иконоборчество">이콘 공경</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/молитвы-святым">성인들에게 드리는 기도</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/человек-храм-Божий">사람은 하느님의 성전</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/состав-человека">사람의 구성</a></p></li></ol>'
