  path: Vs4n_성인_공경
  title: 성인 공경
  copy_cover: true
  body: '<h2>머리말</h2><p>의로운 성인들과 천사들은 신이 아니라 하느님의 벗으로서 공경받습니다. 그들 자체 때문이 아니라 하느님께 참여하기 때문에, 그들 안에 사는 하느님의 은총 때문에 공경받습니다(글: <a href="https://bibleox.com/ru/ru/w/человек-храм-Божий">사람은 하느님의 성전</a>). 성경에 따르면 영예는 하느님께만 드리는 것이 아니고, 사람들은 하느님께만 절하는 것이 아닙니다. 하느님 자신이 하느님께서 주시는 영광을 찾으라고 우리를 부르셨고, 의인들을 영광스럽게 하겠다고 약속하시고 그렇게 하셨으며, 교회는 하느님을 따라 거룩한 하느님의 벗들을 찬양합니다.</p><p>하느님께서는 성인들을 통해 그들의 생전에도, 그들의 <strong>죽은 몸</strong>(<a href="https://bibleox.com/ko/ko-ctb/4ts/13/#L21">열하 13:21</a>)과 <strong>개인 소지품</strong>(<a href="https://bibleox.com/ko/ko-ctb/act/19/#L12">사도 19:12</a>)과 <strong>형상</strong>(<a href="https://bibleox.com/ko/ko-ctb/act/5/#L15-16">사도 5:15-16</a>)을 통해서도 은총을 보내십니다. 그래서 이 모든 것도 공경받습니다. 자세한 내용은 해당 글에 있습니다:</p><ul><li><p><a href="https://bibleox.com/ru/ru/w/почитание-мощей-святых">성인 유해 공경</a>;</p></li><li><p><a href="https://bibleox.com/ru/ru/w/иконы-иконопочитание-иконоборчество">성인 이콘 공경</a>.</p></li></ul><h2>영예는 하느님께만 드리는 것이 아닙니다</h2><h3>하느님께 드리는 영예</h3><blockquote><p>“아들은 아비를 어렵게 알고 종은 주인을 어렵게 아는 법인데 <strong><mark>나를 아비로 어렵게 아는 사람이 어디 있느냐</mark></strong>? <strong>나를 주인으로 어렵게 아는 사람이 어디 있느냐</strong>? 나 만군의 야훼가 너희 사제들에게 말하였다. ‘너희 사제라는 것들은 내 이름을 함부로 부르고 있다.’ 그랬더니, 너희는 뻔뻔스럽게도 이렇게 말하였다. ‘우리가 하느님의 이름을 함부로 부르다니요, 당치도 않습니다.’” (<a href="https://bibleox.com/ko/ko-ctb/mal/1/#L6">말라 1:6</a>)</p></blockquote><h3>사제에게</h3><blockquote><p>“주님을 두려워하고 <strong>사제를 영화롭게 하여라</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/prsir/7/#L31">집회 7:31</a>, 그리스어에서 번역)</p></blockquote><h3>경건한 그리스도인들에게</h3><blockquote><p>“나는 스테파나와 포르나도와 아카이고가 나에게 와 준 것을 기쁘게 생각합니다. 그들은 여러분을 보고 싶어하던 내 허전한 마음을 충족시켜 주었습니다. 그들은 나와 여러분의 걱정을 덜어 주었습니다. 그러니 <strong><mark>이런 사람들을 알아 주어야 합니다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/16/#L17-18">1고린 16:17-18</a>)</p></blockquote><h3>아내에게</h3><blockquote><p>“남편된 사람들도 이와 같이 자기 아내가 자기보다 연약한 여성이라는 것을 잘 이해하고 함께 살아 가며 생명의 은총을 상속받을 사람으로 여기고 <strong><mark>존경하십시오</mark></strong>. 그래야 여러분의 기도생활이 끊어지지 않을 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/1pet/3/#L7">1베드 3:7</a>)</p></blockquote><h3>아버지와 어머니에게</h3><blockquote><p>“<strong><mark>너희는 부모를 공경하여라</mark></strong>. 그래야 너희는 너희 하느님 야훼께서 주신 땅에서 오래 살 것이다.” (<a href="https://bibleox.com/ko/ko-ctb/ish/20/#L12">출 20:12</a>)</p></blockquote><h3>노인에게</h3><blockquote><p>“백발이 성성한 어른 앞에서 일어서고 <strong><mark>나이 많은 노인을 공경하여라</mark></strong>. 너희 하느님을 경외하여라. 나는 야훼이다.” (<a href="https://bibleox.com/ko/ko-ctb/lev/19/#L32">레 19:32</a>)</p></blockquote><h3>과부에게</h3><blockquote><p>“<strong><mark>의지할 데 없는 과부들을 돌보아 주시오</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/1tim/5/#L3">1디모 5:3</a>) <em>(그리스어: χήρας τίμα, “과부들을 공경하십시오”)</em></p></blockquote><h3>국가 권력에게</h3><blockquote><p>“모든 사람을 존경하고 형제들을 사랑하며 하느님을 두려워하고 <strong><mark>황제를 존경하십시오</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/1pet/2/#L17">1베드 2:17</a>)</p></blockquote><blockquote><p>“누구나 <strong><mark>자기를 지배하는 권위</mark></strong>에 복종해야 합니다. 하느님께서 주시지 않은 권위는 하나도 없고 세상의 모든 권위는 다 하느님께서 세워 주신 것이기 때문입니다. &lt;…&gt; 그러므로 여러분은 그들에게 관세를 바쳐야 할 사람에게는 관세를 바치고 두려워해야 할 사람은 두려워하고 <strong><mark>존경해야 할 사람은 존경하십시오</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/rim/13/#L1,7">로마 13:1,7</a>)</p></blockquote><h3>모든 사람에게</h3><blockquote><p>“<strong><mark>모든 사람을 존경하고</mark></strong> 형제들을 사랑하며 하느님을 두려워하고 황제를 존경하십시오.” (<a href="https://bibleox.com/ko/ko-ctb/1pet/2/#L17">1베드 2:17</a>)</p></blockquote><blockquote><p>“형제의 사랑으로 서로 사랑하고 다투어 <strong><mark>서로 남을 존경하는 일에</mark></strong> 뒤지지 마십시오.” (<a href="https://bibleox.com/ko/ko-ctb/rim/12/#L10">로마 12:10</a>)</p></blockquote><h2>성인에게 드리는 절</h2><p>십계명의 둘째 계명(<a href="https://bibleox.com/ko/ko-ctb/ish/20/#L4-5">출 20:4-5</a>; <a href="https://bibleox.com/ko/ko-ctb/vtor/5/#L8-9">신 5:8-9</a>)은 거짓 신(우상) 숭배를 금합니다. 거짓 신은 실제로 신이 아닙니다. 그들의 신성은 지어낸 것이고 환상이며 거짓입니다.</p><p>성인들은 실제로 존재하고 하느님의 벗이며, 신으로 숭배받지 않습니다. 성인에게 드리는 절은 하느님의 벗, 하느님의 종(천사), 하느님의 어머니인 그분들에 대한 존경의 표현입니다. 천사와 사람과 사물에게 드리는 이런 절은 성경에 나오며 우상 숭배가 아닙니다. 우상 숭배는 거짓 신, 곧 거짓을 숭배하는 것이기 때문입니다. 의인들은 사람에게는 사람으로서, 천사에게는 천사로서, 예언자에게는 예언자로서, 사물에게는 사물로서 늘 절합니다. 이 모든 경우에 그들은 신에게 하듯 절하지 않습니다.</p><h3>천사의 모습으로 나타나신 하느님께 드리는 절</h3><p>하느님께서 나타나셨지만 세 천사는 하느님의 실제 모습, 세상 창조 전부터 그러하신 모습이 아닙니다. 곧 이것은 하느님의 <strong>형상</strong>(그리스어 εἰκόνα, 이콘)이며, 아브라함은 하느님의 이콘 앞에 절합니다:</p><blockquote><p>“<strong>야훼께서</strong> 마므레의 상수리나무 곁에서 <strong>아브라함에게 나타나셨다</strong>. 아브라함은 한창 더운 대낮에 천막 문 어귀에 앉아 있다가 고개를 들어 <strong>웬 사람 셋이</strong> 자기를 향해 서 있는 것을 보았다. 그는 그들을 보자마자 천막 문에서 뛰어 나가 맞으며 <strong>땅에 엎드려</strong>” (<a href="https://bibleox.com/ko/ko-ctb/gen/18/#L1-2">창 18:1-2</a>)</p></blockquote><h3>천사에게 드리는 절</h3><blockquote><p>“그가 대답하였다. ‘아니다. 나는 야훼 군대의 총사령관으로서 이제 온 것이다.’ 이 대답을 듣고 여호수아는 <strong>엎드려 얼굴을 땅에 대고 절하며</strong> 물었다. ‘내 주여, 당신의 종에게 무슨 말씀을 하시렵니까?’” (<a href="https://bibleox.com/ko/ko-ctb/nav/5/#L14">여호 5:14</a>)</p></blockquote><h3>예언자에게 드리는 절</h3><blockquote><p>“예리고에서 온 예언자 수련생들이 멀리서 그 광경을 보고 말했다.‘엘리야의 영검이 엘리사에게 내렸구나.’ 그러면서 엘리사 앞으로나와 <strong>땅에 엎드려 절하였다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/4ts/2/#L15">열하 2:15</a>)</p></blockquote><h3>성전을 향한 절</h3><blockquote><p>“당신의 크신 사랑만을 믿고 나는 당신 집에 왔사옵니다. 주님 두려워하는 마음으로 <strong>당신의 거룩한 성전을 향하여 엎드립니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/ps/5/#L7">시편 5:7</a>)</p></blockquote><h3>하느님의 발판(성전)에 드리는 절</h3><blockquote><p>“야훼 우리 하느님을 기리어라. <strong>그분의 발판 아래 엎드려라</strong>. <strong>그분은 거룩하시다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/ps/99/#L5">시편 99:5</a>)</p></blockquote><blockquote><p>“<strong>그분 계시는 곳으로 들어 가자. 그 발 앞에 엎드려 경배하자</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/ps/132/#L7">시편 132:7</a>)</p></blockquote><h3>계약궤 앞의 절</h3><blockquote><p>“여호수아와 이스라엘의 장로들은 옷을 찢고 머리에 먼지를 쓴 채 저물 때까지 <strong>야훼의 궤 앞에 엎드려 있었다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/nav/7/#L6">여호 7:6</a>)</p></blockquote><h3>지팡이에 드리는 절</h3><blockquote><p>“그러면 이제 나에게 맹세하여라.‘ 요셉이 시키는 대로 맹세하자, <strong>이스라엘은 침상 머리맡에 엎드려</strong> 하느님께 경배드렸다.” (<a href="https://bibleox.com/ko/ko-ctb/gen/47/#L31">창 47:31</a>; <a href="https://bibleox.com/ko/ko-ctb/evr/11/#L21">히브 11:21</a>) <em>(칠십인역에는 “지팡이 끝에”(προσεκύνησεν Ισραηλ ἐπὶ τὸ ἄκρον τῆς ῥάβδου αὐτοῦ)로 되어 있습니다. 히브리 11:21도 같습니다.)</em></p></blockquote><p>더 많은 예: <a href="https://bibleox.com/ru/ru/w/поклоны">절</a>.</p><h3>묵시록에서 천사가 자기가 아니라 하느님께 경배하라고 명하는 까닭</h3><p>사도 요한의 환시에서 하느님께서는 가까이 눈에 보이게 계십니다. 그런 상황에서 천사를 가장 중요한 이처럼 공경하는 것은 이상할 것입니다. 그래서 천사는 하느님께 경배하라고 부릅니다:</p><blockquote><p>“그 때 나는 그에게 경배를 드리려고 그의 발 앞에 엎드렸습니다. 그러자 그는 나에게 ‘<strong>이러지 말라. 나도 너나 너의 형제들과 같이 일하는 종에 지나지 않는다</strong>. 우리는 다 같이 예수께서 계시하신 진리를 간직하고 있는 자들이다. <strong><mark>예배는 하느님께 드려라</mark></strong>. 예수께서 계시하신 진리야말로 예언자들에게 영감을 주는 것이다’하고 말했습니다.” (<a href="https://bibleox.com/ko/ko-ctb/otkr/19/#L10">묵시 19:10</a>)</p></blockquote><blockquote><p>“그러자 그는 ‘<strong>이러지 말아라. 나도 너나 네 형제인 예언자들이나</strong> 이 책에 기록된 말씀을 지키는 사람들과 같이 일하는 종에 지나지 않는다. <strong><mark>경배는 하느님께 드려라</mark></strong>’하고 말했습니다.” (<a href="https://bibleox.com/ko/ko-ctb/otkr/22/#L9">묵시 22:9</a>)</p></blockquote><p>다른 때에 천사는 예언자 눈의 아들 여호수아의 절을 받습니다:</p><blockquote><p>“그가 대답하였다. ‘아니다. 나는 야훼 군대의 총사령관으로서 이제 온 것이다.’ 이 대답을 듣고 여호수아는 <strong>엎드려 얼굴을 땅에 대고 절하며</strong> 물었다. ‘내 주여, 당신의 종에게 무슨 말씀을 하시렵니까?’” (<a href="https://bibleox.com/ko/ko-ctb/nav/5/#L14">여호 5:14</a>)</p></blockquote><h2>성인들은 영예를 누릴 것입니다</h2><blockquote><p>“큰 집에는 <strong>금그릇과 은그릇</strong>뿐만 아니라 나무그릇과 질그릇도 있어서 어떤 것은 <strong>귀하게 쓰이고</strong> 또 어떤 것은 천하게 쓰입니다. 그러므로 모든 악을 버리고 <strong><mark>자기 자신을 깨끗하게 하는 사람은 누구든지 귀하게 쓰이는 그릇이 될 것입니다</mark></strong>. 그런 사람은 주인에게 쓸모 있는 그릇으로 바쳐져서 모든 좋은 일에 쓰입니다.” (<a href="https://bibleox.com/ko/ko-ctb/2tim/2/#L20-21">2디모 2:20-21</a>)</p></blockquote><blockquote><p>“그러나 <strong><mark>선한 일을 행하는 사람이면 누구나 영광과 명예와 평화를 누리게 될 것입니다</mark></strong>. 먼저는 유다인들이 누리고 그 다음에는 이방인들까지 누릴 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/rim/2/#L10">로마 2:10</a>)</p></blockquote><h2>주님께서는 의인들을 영광스럽게 하겠다고 약속하셨습니다</h2><blockquote><p>“이에 이스라엘의 하느님 나 야훼가 말한다. 내가 일찌기 네 집과 네 가문이 영원히 나를 섬기리라고 했지만 이제 분명히 말해 두거니와 나는 그 약속을 철회한다. <strong><mark>나를 존대하는 자는 소중히 여겨 주겠지만</mark></strong>, 나를 멸시하는 자는 천대하리라. 나 야훼의 말이다.” (<a href="https://bibleox.com/ko/ko-ctb/1ts/2/#L30">삼상 2:30</a>)</p></blockquote><blockquote><p>“누구든지 나를 섬기려면 나를 따라 오너라. 내가 있는 곳에는 나를 섬기는 사람도 같이 있게 될 것이다. <strong><mark>누구든지 나를 섬기면 내 아버지께서 그를 높이실 것이다</mark></strong>.‘” (<a href="https://bibleox.com/ko/ko-ctb/in/12/#L26">요한 12:26</a>)</p></blockquote><blockquote><p>“나는 이 사람들만을 위하여 간구하는 것이 아니라 이 사람들의 말을 듣고 나를 믿는 사람들을 위하여 간구합니다. &lt;…&gt; <strong><mark>아버지께서 내게 주신 영광을 나도 그들에게 주었습니다</mark></strong>. 그것은 아버지와 내가 하나인 것처럼 이 사람들도 하나가 되게 하려는 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/in/17/#L20,22">요한 17:20,22</a>)</p></blockquote><blockquote><p>“하느님께서는 이미 오래 전에 택하신 사람들이 당신의 아들과 같은 모습을 가지도록 미리 정하셨습니다. 그래서 그리스도께서는 많은 형제 중에서 맏아들이 되셨습니다. 하느님께서는 미리 정하신 사람들을 불러 주시고 부르신 사람들을 당신과 올바른 관계에 놓아 주시고, <strong><mark>당신과 올바른 관계를 가진 사람들을 영광스럽게 해 주셨습니다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/rim/8/#L29-30">로마 8:29-30</a>)</p></blockquote><p>영광스럽게 하심은 무엇보다 기도의 성취와 행실을 통해 이루어집니다:</p><blockquote><p>“너희가 내 이름으로 <strong>구하는 것이면</strong> <strong><mark>무엇이든지 이루어 주겠기 때문이다</mark></strong>. 그러면 <strong><mark>아들로 말미암아 아버지께서 영광을 받으실 것이다</mark></strong>. 너희가 내 이름으로 구하는 것이면 무엇이든지 <strong><mark>다 내가 이루어 주겠다</mark></strong>.‘” (<a href="https://bibleox.com/ko/ko-ctb/in/14/#L13-14">요한 14:13-14</a>)</p></blockquote><p>그래도 결국 영광을 받으시는 분은 아버지이십니다. 다만 아들 안에서이니 아들도 영광을 받으십니다.</p><h2>하느님께서 주시는 영광을 찾습니다</h2><blockquote><p>“너희는 서로 영광을 주고 받으면서도 <strong><mark>오직 한 분이신 하느님께서 주시는 영광은 바라지 않으니</mark></strong> 어떻게 나를 믿을 수가 있겠느냐?” (<a href="https://bibleox.com/ko/ko-ctb/in/5/#L44">요한 5:44</a>)</p></blockquote><blockquote><p>“그러고도 마음이 완고해서 회개할 생각도 하지 않으니 이런 자는 <strong><mark>하느님의 공정한 심판</mark></strong>이 내릴 진노의 날에 자기가 받을 벌을 쌓아 올리고 있는 것입니다. 하느님께서는 <strong>각 사람에게 그 행실대로 갚아 주실 것입니다</strong>. <strong><mark>꾸준히 선을 행하면서 영광과 명예와 불멸의 것을 추구하는 사람들에게는 영원한 생명을 주실 것이고</mark></strong> 자기 이익만을 생각하면서 진리를 물리치고 옳지 않은 것을 따르는 사람들에게는 진노와 벌을 내리실 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/rim/2/#L5-8">로마 2:5-8</a>)</p></blockquote><h2>성인들의 영광</h2><blockquote><p>“하느님은 만물을 창조하신 분이시고 만물은 그분을 위해서 있습니다. 그러므로 하느님께서 <strong><mark>당신의 많은 자녀들이 영광에 참여할 수 있도록</mark></strong> 그들의 구원의 창시자로 하여금 고난을 겪게 해서 완전하게 하신다는 것은 당연한 일이었습니다.” (<a href="https://bibleox.com/ko/ko-ctb/evr/2/#L10">히브 2:10</a>)</p></blockquote><blockquote><p>“우리는 모두 얼굴의 너울을 벗어 버리고 <strong>거울처럼 주님의 영광을 비추어 줍니다</strong>. 동시에 우리는 <strong><mark>주님과 같은 모습으로 변화하여 영광스러운 상태에서 더욱 영광스러운 상태로 옮아 가고 있습니다</mark></strong>. 이것이 성령이신 주님께서 이루시는 일입니다.” (<a href="https://bibleox.com/ko/ko-ctb/2kor/3/#L18">2고린 3:18</a>)</p></blockquote><blockquote><p>“악한 일을 행하는 사람이면 누구든지 궁지에 물리고 고통을 당하게 될 것입니다. 먼저는 유다인들이 당하고 그 다음에는 이방인들까지 당할 것입니다. 그러나 <strong><mark>선한 일을 행하는 사람이면 누구나 영광과 명예와 평화를 누리게 될 것입니다</mark></strong>. 먼저는 유다인들이 누리고 그 다음에는 이방인들까지 누릴 것입니다.” (<a href="https://bibleox.com/ko/ko-ctb/rim/2/#L9-10">로마 2:9-10</a>)</p></blockquote><blockquote><p>“당신 백성의 영광을 드높여 주셔서, 당신을 가까이 모신 이 백성, 이스라엘 후손들, <strong><mark>당신을 믿는 모든 신도들에게 자랑이로다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/ps/148/#L14">시편 148:14</a>)</p></blockquote><h2>교회는 의인들을 찬양할 것입니다</h2><blockquote><p>“이제 영광스러운 사람들을 찬양하자. … <strong>주님께서는 큰 영광을 창조하셨고</strong> 영원부터 <strong>당신의 위엄을 나타내셨다</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/prsir/44/#L1-2">집회 44:1-2</a>, 그리스어에서 번역)</p></blockquote><blockquote><p>“… <strong>그들의 영광은 지워지지 않을 것이다</strong>. 그들의 몸은 평화 속에 묻혔으나 그들의 이름은 대대로 살아 있다. 백성들은 그들의 지혜를 이야기하고 <strong>회중은 그들의 찬양을 전한다</strong>” (<a href="https://bibleox.com/ko/gr-lxx-byz/prsir/44/#L13-15">집회 44:13-15</a>, 그리스어에서 번역)</p></blockquote><h2>앞서 간 이들의 행실과 믿음을 잊지 말고 본받아야 합니다</h2><blockquote><p>“하느님의 말씀을 여러분에게 일러 준 <strong><mark>지도자들을 기억하십시오</mark></strong>. 그들이 어떻게 살다가 죽었는지를 살펴보고 <strong><mark>그들의 믿음을 본받으십시오</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/evr/13/#L7">히브 13:7</a>)</p></blockquote><blockquote><p>“그러므로 나는 여러분에게 권합니다. <strong><mark>나를 본받으십시오</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/4/#L16">1고린 4:16</a>)</p></blockquote><blockquote><p>“형제 여러분, <strong><mark>나를 본받으십시오. 그리고 여러분과 같이 우리를 모범으로 삼고 따르는 사람들을 눈여겨 보십시오</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/fil/3/#L17">필립 3:17</a>)</p></blockquote><h2>성인들과 함께하는 삶을 바랍니다</h2><blockquote><p>“야훼께 아뢰옵니다. ‘당신은 나의 주님, 당신만이 나의 행복이십니다.’ 이 땅에 있는 거룩하다는 신들, 그런 것들을 좋아하는 자들에게 저주를 내리소서.” (<a href="https://bibleox.com/ko/ko-ctb/ps/16/#L2-3">시편 16:2-3</a>) <em>(공동번역은 3절을 다르게 옮겼습니다. 히브리어와 NKJV: “땅에 있는 성도들은 존귀한 이들이니, 나의 모든 기쁨이 그들에게 있습니다.”)</em></p></blockquote><h2>묵시록의 짐승은 성인들을 모독할 것입니다</h2><h3>짐승은 하늘에 사는 이들을 모독할 것입니다</h3><blockquote><p>“그래서 그 짐승은 하느님을 모독하기 시작했고 하느님의 이름과 하느님의 집을 모독했으며 <strong><mark>하늘에서 사는 자들에게 욕설을 퍼부었습니다</mark></strong>.” (<a href="https://bibleox.com/ko/ko-ctb/otkr/13/#L6">묵시 13:6</a>)</p></blockquote><h3>의인들의 영혼과 천사들은 하늘에 삽니다</h3><blockquote><p>“그러나 <strong><mark>여러분이 와 있는 곳은</mark></strong> 시온산이고 살아 계신 하느님의 도성이며 <strong><mark>하늘의 예루살렘입니다. 거기에는 수많은 천사들이 있고</mark></strong>, 잔치가 벌어져 있고 또 <strong>하늘에 등록된 장자들의 교회</strong>가 있고 만민의 심판자이신 하느님이 계시고 <strong><mark>완전히 올바른 사람들의 영혼</mark></strong>이 있습니다.” (<a href="https://bibleox.com/ko/ko-ctb/evr/12/#L22-23">히브 12:22-23</a>)</p></blockquote><h2>비판</h2><h3>교회는 누가 성인인지 어떻게 압니까? 사람이 하느님 대신 결정하는 것이 아닙니까?</h3><p><a href="https://bibleox.com/ru/ru/w/молитвы-святым">성인들에게 드리는 기도</a>의 해당 부분에서 답을 보십시오.</p><h3>하느님께서는 당신의 영광을 아무에게도 주지 않으신다</h3><blockquote><p>“나는 야훼다. 이것이 내 이름이다. <strong>내가 받을 영광을 뉘게 돌리랴</strong>? 내가 받을 찬양을 어떤 <strong>우상</strong>에게 돌리랴?” (<a href="https://bibleox.com/ko/ko-ctb/is/42/#L8">이사 42:8</a>)</p></blockquote><p>이것은 우상, 곧 거짓 신들에 관한 말씀입니다. 하느님께서 친히 사람들을 영광스럽게 하신다는 많은 구절이 위에 있습니다.</p><h2>관련 구절</h2><ol><li><p><a href="https://bibleox.com/ru/ru/w/почитание-мощей-святых">성인 유해 공경</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/иконы-иконопочитание-иконоборчество">이콘 공경</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/молитвы-святым">성인들에게 드리는 기도</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/человек-храм-Божий">사람은 하느님의 성전</a></p></li><li><p><a href="https://bibleox.com/ru/ru/w/состав-человека">사람의 구성</a></p></li></ol>'
