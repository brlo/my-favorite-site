- src: Христос-не-архангел-Михаил
  path: Va9h_그리스도는대천사미카엘이아니시다
  title: 그리스도는 대천사 미카엘이 아니십니다
  copy_cover: true
  body: '<h2>머리말</h2><p>먼저 이 견해(그리스도가 대천사 미카엘이라는 견해)는 전체주의 분파인 “여호와의 증인”에게 있다는 것을 밝혀야 합니다. 여호와의 증인은 자기네 가르침을 뒷받침하려고 심각한 왜곡이 있는 자체 성경 번역을 만들었습니다(<a href="https://azbyka.ru/otechnik/sekty/rassuzhdaja-so-svideteljami-iegovy-pri-pomoshhi-pisanija/4_7">여호와의 증인 “신세계 번역”에 대한 전문가 평가</a>, 러시아어). 재림교도들도 구약에 대천사 미카엘로 나타나는 분이 하느님의 아들 예수 그리스도라고 믿습니다.</p><h2>“천사”라는 낱말의 두 가지 뜻</h2><p>성경에서 천사라는 낱말은 두 가지 뜻으로 쓰입니다. 직무와 본성입니다.</p><p>천사의 <strong>직무</strong>는 보냄을 받는 것입니다. 이 고대 그리스어 낱말의 뜻이 문자 그대로 그렇기 때문입니다: ἄγγελος(앙겔로스) — 사자, 전령; 히브리어 ‏מלאך‏‎ — 사자.</p><p>천사의 <strong>본성</strong>은 몸이 없는 영입니다. 천사는 하느님께서 창조하신 영적 존재로서 몸이 없습니다. 곧 영입니다. 이 영들은 사람보다 먼저 창조되었고 자유와 이성을 받았습니다. 그 가운데 일부는 하느님께 순종하며 살기를 원하지 않아 그분에게서 떨어져 나갔지만 여전히 천사라 불립니다(<a href="https://bibleox.com/ko/ko-ctb/mf/25/#L41">마태 25:41</a>). 곧 활동 방식과 상관없는 본성이 있습니다. 보냄을 받든 받지 않든 천사입니다. 그것이 본성입니다. 그래서 사람에게서 태어난 분명한 사람인 예언자 세례자 요한도 천사라 불립니다(<a href="https://bibleox.com/ko/ko-ctb/mal/3/#L1">말라 3:1</a>; <a href="https://bibleox.com/ko/ko-ctb/mf/11/#L10">마태 11:10</a>; <a href="https://bibleox.com/ko/ko-ctb/mk/1/#L2">마르 1:2</a>; <a href="https://bibleox.com/ko/ko-ctb/lk/7/#L27">루가 7:27</a>). 같은 뜻으로 같은 곳에서 그리스도께서도 친히 계약의 천사라 불리십니다(<a href="https://bibleox.com/ko/ko-ctb/mal/3/#L1">말라 3:1</a>). (공동번역은 이 낱말을 “특사”, “사자”, “일꾼”으로 옮겼지만, 그리스어 본문에는 두 곳 모두 ἄγγελος가 있습니다: τὸν ἄγγελόν μου — “나의 천사”, ὁ ἄγγελος τῆς διαθήκης — “계약의 천사”.) 이제 인용구를 봅시다.</p><h2>모든 천사는 섬기는 영이지만 그리스도께서는 옥좌에 앉아 계십니다</h2><p>사도 바울로는 하느님의 아들을 천사들보다 훨씬 뛰어난 분이라고 말합니다(<a href="https://bibleox.com/ko/ko-ctb/evr/1/#L4">히브 1:4</a>). 하느님께서 천사들에게는 아들에게 하시듯 말씀하지 않으시기 때문입니다(<a href="https://bibleox.com/ko/ko-ctb/evr/1/#L5">히브 1:5</a>). 모든 천사가 하느님의 아들에게 예배드릴 것입니다(<a href="https://bibleox.com/ko/ko-ctb/evr/1/#L6">히브 1:6</a>). 그는 천사들에 관한 하느님의 말씀과 아들에 관한 말씀의 차이를 지적합니다. 천사들은 섬기는 존재이고 아들은 옥좌에 앉으신 통치자이십니다(<a href="https://bibleox.com/ko/ko-ctb/evr/1/#L7-8">히브 1:7-8</a>, <a href="https://bibleox.com/ko/ko-ctb/evr/1/#L13">히브 1:13</a>). 창조된 모든 것은 일시적이지만 모든 것을 창조하신 하느님의 아들은 결코 사라지지 않으십니다(<a href="https://bibleox.com/ko/ko-ctb/evr/1/#L10-12">히브 1:10-12</a>). 끝으로 모든 천사는 예외 없이 섬기는 영이고 아들은 성부와 함께 옥좌에 앉아 계신다고 직접 말합니다:</p><blockquote><p>“그런데 <strong>하느님께서 어느 천사에게</strong> ‘내가 네 원수를 네 발 아래 굴복시킬 때까지 너는 <strong>내 오른편에 앉아 있어라</strong>’ 하고 말씀하신 적이 있으십니까? <strong>천사들은 모두 하느님을 섬기는 영적인 존재들로서</strong> 결국은 구원의 유산을 받을 사람들을 섬기라고 파견된 일꾼들이 아닙니까?” (<a href="https://bibleox.com/ko/ko-ctb/evr/1/#L13-14">히브 1:13-14</a>)</p></blockquote><p>아들은 섬김을 받으시고, 성부와 함께 다스리십니다.</p><h2>사람들은 하느님 앞에 무릎을 꿇고, 모든 피조물은 그리스도 앞에 무릎을 꿇습니다</h2><p>하느님께서는 당신 앞에 모든 무릎이 꿇을 것이라고 말씀하시는데(<a href="https://bibleox.com/ko/ko-ctb/rim/14/#L11">로마 14:11</a>), 동시에 사람뿐 아니라 모든 피조물이 그리스도 앞에 무릎을 꿇을 것이고(<a href="https://bibleox.com/ko/ko-ctb/fil/2/#L10">필립 2:10</a>), 거기에는 천사들도 포함됩니다(<a href="https://bibleox.com/ko/ko-ctb/evr/1/#L6">히브 1:6</a>).</p><h2>세상은 천사가 아니라 그리스도께 복종합니다</h2><blockquote><p>“하느님께서는 우리가 지금 말하고 있는 <strong>장차 올 세상을 천사들의 지배 아래 두시지는 않습니다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/evr/2/#L5">히브 2:5</a>)</p></blockquote><p>그런데 세상은 그리스도께 복종합니다:</p><blockquote><p>“하느님께서는 <strong>모든 것을 당신 발 아래 굴복시키셨다</strong>‘고 했습니다. 이렇게 모든 것을 굴복시키셨다고 할 때 굴복시키시는 그분은 그 속에 포함되어 있지 않다는 것이 분명합니다.” (<a href="https://bibleox.com/ko/ko-ctb/1kor/15/#L27">1고린 15:27</a>)</p></blockquote><blockquote><p>“하느님께서는 <strong>만물을 그리스도의 발 아래 굴복시키셨으며</strong> 그분을 교회의 머리로 삼으셔서 모든 것을 지배하게 하셨습니다.” (<a href="https://bibleox.com/ko/ko-ctb/ef/1/#L22">에페 1:22</a>)</p></blockquote><blockquote><p>“<strong>만물을 그의 발 아래 복종시키셨습니다</strong>.‘ 이렇게 만물을 그에게 복종시키셨다는 것은 그의 지배 아래 있지 않은 것은 하나도 없다는 뜻입니다. 그런데도 우리가 보기에는 아직도 만물이 다 그에게 복종하고 있지는 않습니다.” (<a href="https://bibleox.com/ko/ko-ctb/evr/2/#L8">히브 2:8</a>)</p></blockquote><h2>전능하신 분, 왕 중의 왕, 주 중의 주</h2><p>이처럼 모든 천사는 섬기는 영이고, 하느님의 아들 예수 그리스도께서는 하느님께서 거듭 불리시는 이름, 곧 전능하신 분, 왕 중의 왕, 주 중의 주로 불리신다는 것을 확인했습니다. 예언자들은 <strong>하느님</strong>을 주 중의 주라 부릅니다(<a href="https://bibleox.com/ko/ko-ctb/ps/136/#L2-3">시편 136:2-3</a>). 사도들은 <strong>하느님</strong>을 주 중의 주, 왕 중의 왕이라 부릅니다(<a href="https://bibleox.com/ko/ko-ctb/1tim/6/#L15-16">1디모 6:15-16</a>). 사도들은 <strong>예수 그리스도</strong>를 주 중의 주, 왕 중의 왕이라 부르고(<a href="https://bibleox.com/ko/ko-ctb/otkr/17/#L14">묵시 17:14</a>; <a href="https://bibleox.com/ko/ko-ctb/otkr/19/#L16">묵시 19:16</a>), 전능하신 분이라 부릅니다(<a href="https://bibleox.com/ko/ko-ctb/otkr/1/#L8">묵시 1:8</a>). 왕 중의 왕 위에 다른 왕은 없습니다. 주 중의 주 위에 다른 주는 없습니다. 전능하신 분 위에 그분을 붙드는 이는 없습니다. 그분께서 친히 모든 것을 붙들고 계시기 때문입니다. 대천사 미카엘은 천사 군대의 지휘자입니다. 그리스도께서는 천사들과 대천사 미카엘을 포함한 세상 모든 것의 지휘자이십니다.</p><h2>하느님(야훼)께서 친히 예언자들을 보내셨는데, 그리스도께서는 당신이 보냈다고 말씀하십니다</h2><p>그리스도께서는 이스라엘에 많은 예언자를 보낸 분이 당신이라고 말씀하십니다(<a href="https://bibleox.com/ko/ko-ctb/mf/23/#L34">마태 23:34</a>). 그리고 성경은 천사들을 통해서가 아니라 하느님께서 친히 예언자들에게 말씀하시고 친히 이스라엘에 보내셨다고 말합니다(<a href="https://bibleox.com/ko/ko-ctb/ish/3/#L12">출 3:12</a>; <a href="https://bibleox.com/ko/ko-ctb/mal/4/#L1,5">말라 4:1,5</a>; <a href="https://bibleox.com/ko/ko-ctb/sud/6/#L8">판관 6:8</a>; <a href="https://bibleox.com/ko/ko-ctb/2par/25/#L15">역하 25:15</a>; <a href="https://bibleox.com/ko/ko-ctb/1ts/15/#L1">삼상 15:1</a>; <a href="https://bibleox.com/ko/ko-ctb/2ts/12/#L1">삼하 12:1</a>; <a href="https://bibleox.com/ko/ko-ctb/2ts/12/#L24-25">삼하 12:24-25</a>; <a href="https://bibleox.com/ko/en-nrsv/3ezd/1/#L32">3에스 1:32</a>). 곧 그리스도께서는 하느님, 야훼이십니다. 하느님께서 예언자들과 소통하실 때 중개자는 없었습니다.</p><h2>성부에게서 나신 하느님의 아들께서 천사들을 창조하셨습니다</h2><p>그리스도께서는 천사들을 포함하여 보이는 것과 보이지 않는 모든 것의 창조주이십니다(<a href="https://bibleox.com/ko/ko-ctb/kol/1/#L13-17">골로 1:13-17</a>). 곧 천사라면 자기 자신도 창조했어야 합니다.</p><h2>“미카엘”이라는 이름의 어원</h2><p>미카엘은 히브리어 이름으로, ‏מי כמו אלוהים‏‎(미 크모 엘로힘, 줄여서 “미카엘”), 문자 그대로 “누가 하느님과 같은가”에서 왔습니다. 곧 아무도 하느님과 같지 않으며 아무도 그분과 비교될 수 없다는 뜻입니다. 그러나 그리스도께서는 하느님과 같음을 빼앗은 것으로 여기지 않으십니다(<a href="https://bibleox.com/ko/ko-ctb/fil/2/#L6">필립 2:6</a>).</p><h2>옛 계약은 천사들을 통해 주어졌고, 새 계약은 주님께서 전하셨습니다</h2><p>사도 바울로는 옛 계약과 새 계약의 차이를 지적합니다. 옛 계약은 천사들을 통해 주어졌고(<a href="https://bibleox.com/ko/ko-ctb/evr/2/#L2">히브 2:2</a>), 새 계약은 주님께서 친히 전하셨습니다(<a href="https://bibleox.com/ko/ko-ctb/evr/2/#L3">히브 2:3</a>). 곧 적어도 천사들을 통해서가 아닙니다.</p><h2>사람이 되신 하느님께서 천사들에게 당신을 보이셨습니다</h2><blockquote><p>“우리가 믿는 종교의 진리는 참으로 심오합니다. <strong>그분은 사람으로 이 세상에 오셨고</strong> 성령이 그분의 본성을 입증하셨으며 <strong>천사들이 그분을 보았습니다</strong>. 그분은 만방에 전해져서 온 세상이 그분을 믿게 되었으며 영광 가운데 승천하셨습니다.” (<a href="https://bibleox.com/ko/ko-ctb/1tim/3/#L16">1디모 3:16</a>) <em>(비잔틴 본문(다수 사본)에는 θεὸς ἐφανερώθη ἐν σαρκί — “<strong>하느님께서</strong> 육신으로 나타나셨고”라고 되어 있습니다.)</em></p></blockquote><p>아무도 하느님을 본 적이 없습니다(<a href="https://bibleox.com/ko/ko-ctb/in/1/#L18">요한 1:18</a>). 그분은 가까이 갈 수 없는 빛 가운데 계시고 사람은 하느님을 볼 수 없습니다(<a href="https://bibleox.com/ko/ko-ctb/1tim/6/#L16">1디모 6:16</a>). 그러나 참 사람으로 태어나심으로써(<a href="https://bibleox.com/ko/ko-ctb/in/1/#L14">요한 1:14</a>) 하느님께서는 그리스도 안에서 모든 이에게 보이게 되십니다. 사람은 영적 세계의 주민(천사)을 육체의 눈으로 볼 수 없지만, 그리스도께서는 사탄이 하늘에서 떨어지는 것을 보았다고 말씀하십니다(<a href="https://bibleox.com/ko/ko-ctb/lk/10/#L18">루가 10:18</a>). 또한 천사들은 여러 때 여러 곳에서 여러 사람에게 나타나지만, 성경은 그 일(천사의 나타남) 자체에 아무 의미도 두지 않습니다. 곧 “그가 천사들에게 자신을 보였다”는 식으로 말하지 않습니다. 나타났고, 그뿐입니다.</p><h2>천사들은 창조되었고 하느님의 아들은 나셨습니다. 그것도 그저 나신 것이 아니라 외아들로 나셨습니다</h2><p>하느님의 아들은 창조된 것이 아니라 하느님에게서 나셨고, 창조된 모든 것은 그 뒤에 아들을 통해 창조되었습니다(<a href="https://bibleox.com/ko/ko-ctb/kol/1/#L15-16">골로 1:15-16</a>). 그리고 하느님의 아들은 외아들이십니다(<a href="https://bibleox.com/ko/ko-ctb/in/1/#L18">요한 1:18</a>). 이는 외아들처럼 성부의 아들인 이는 아무도 없다는 뜻입니다. 우리는 “창조하다”와 “낳다”라는 말을 구별합니다. 무엇이든 만들 수는 있지만, 낳는 것은 자기와 같은 본성을 지닌 것뿐입니다. 물고기는 물고기를, 사람은 사람을, 하느님은 하느님을 낳습니다. 올리브 나무가 오렌지를 낳지는 않습니다.</p><h2>맺음말</h2><p>그리스도는 대천사 미카엘이 아니라 하느님이십니다. 그리고 거듭 직접 하느님이라 불리십니다. 성경은 이를 분명히 말합니다: <a href="https://bibleox.com/ru/ru/w/Христос-Бог">예수 그리스도는 하느님이십니다</a></p><blockquote><p>“<strong>들어라, 내 백성아</strong>, 내가 말하리라. 이스라엘아, 내가 너의 죄상을 밝히리라. <strong>나 하느님, 너희의 하느님은</strong>” (<a href="https://bibleox.com/ko/ko-ctb/ps/50/#L7">시편 50:7</a>)</p></blockquote>'
