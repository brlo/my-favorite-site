  body: '<p>무슬림에게 중요한 점은, 이슬람이 오직 하느님께만 돌리는 많은 칭호를 성경이 그리스도께 적용한다는 것입니다: 창조주, 거룩하신 분, 왕 중의 왕, 처음이신 분, 변하지 않으시는 분, 전능하신 분:</p><ul><li><p><strong>창조주</strong> (알할리크, ٱلْخَـٰلِقُ) – <a href="https://bibleox.com/ko/ko-nkrv/in/1/#L3,10">요 1:3,10</a>; <a href="https://bibleox.com/ko/ko-nkrv/evr/1/#L1-2">히 1:1-2</a>; <a href="https://bibleox.com/ko/ko-nkrv/evr/11/#L3">히 11:3</a>; <a href="https://bibleox.com/ko/ko-nkrv/evr/1/#L8-12">히 1:8-12</a>; <a href="https://bibleox.com/ko/ko-nkrv/kol/1/#L13-17">골 1:13-17</a>;</p></li><li><p><strong>왕 중의 왕</strong> (말리크 알물크, مالك الملك) – <a href="https://bibleox.com/ko/ko-nkrv/otkr/17/#L14">계 17:14</a>; <a href="https://bibleox.com/ko/ko-nkrv/otkr/19/#L16">계 19:16</a>;</p></li><li><p>지배하시는 분 (알카하르, ٱلْقَهَّـٰرُ) – <a href="https://bibleox.com/ko/ko-nkrv/otkr/17/#L14">계 17:14</a>; <a href="https://bibleox.com/ko/ko-nkrv/otkr/19/#L16">계 19:16</a>;</p></li><li><p><strong>거룩하신 분</strong> (알쿠두스, ٱلْقُدُّوسُ) – <a href="https://bibleox.com/ko/ko-nkrv/otkr/3/#L7">계 3:7</a>; <a href="https://bibleox.com/ko/ko-nkrv/otkr/6/#L10">계 6:10</a>; <a href="https://bibleox.com/ko/ko-nkrv/evr/7/#L26">히 7:26</a>; <a href="https://bibleox.com/ko/ko-nkrv/act/3/#L14">행 3:14</a>;</p></li><li><p>온유하신 분 (알할림, ٱلْحَلِيمُ) – <a href="https://bibleox.com/ko/ko-nkrv/ier/11/#L19">렘 11:19</a>; <a href="https://bibleox.com/ko/ko-nkrv/mf/11/#L29">마 11:29</a>; <a href="https://bibleox.com/ko/ko-nkrv/mf/21/#L5">마 21:5</a>;</p></li><li><p>시작, <strong>처음이신 분</strong> (알아왈, الأول) – <a href="https://bibleox.com/ko/ko-nkrv/in/1/#L1-3">요 1:1-3</a>; <a href="https://bibleox.com/ko/ko-nkrv/otkr/1/#L11">계 1:11</a>; <a href="https://bibleox.com/ko/ko-nkrv/otkr/1/#L17">계 1:17</a>; <a href="https://bibleox.com/ko/ko-nkrv/otkr/2/#L8">계 2:8</a>; <a href="https://bibleox.com/ko/ko-nkrv/otkr/22/#L13">계 22:13</a>;</p></li><li><p>끝, 마지막이신 분 (알아히르, الأخر) – <a href="https://bibleox.com/ko/ko-nkrv/otkr/1/#L11">계 1:11</a>; <a href="https://bibleox.com/ko/ko-nkrv/otkr/1/#L17">계 1:17</a>; <a href="https://bibleox.com/ko/ko-nkrv/otkr/2/#L8">계 2:8</a>; <a href="https://bibleox.com/ko/ko-nkrv/otkr/22/#L13">계 22:13</a>;</p></li><li><p><strong>변하지 않으시는 분</strong> (앗사마드, الصمد) – <a href="https://bibleox.com/ko/ko-nkrv/evr/13/#L8">히 13:8</a>; <a href="https://bibleox.com/ko/ko-nkrv/evr/1/#L10-12">히 1:10-12</a>;</p></li><li><p>살아 계신 분 (알하이, الحي) – <a href="https://bibleox.com/ko/ko-nkrv/otkr/1/#L18">계 1:18</a>; <a href="https://bibleox.com/ko/ko-nkrv/act/3/#L15">행 3:15</a>;</p></li><li><p>구세주 (알무하이민, ٱلْمُهَيْمِنُ) – <a href="https://bibleox.com/ko/ko-nkrv/in/4/#L42">요 4:42</a>; <a href="https://bibleox.com/ko/ko-nkrv/lk/1/#L47">눅 1:47</a>; <a href="https://bibleox.com/ko/ko-nkrv/lk/2/#L11">눅 2:11</a>; <a href="https://bibleox.com/ko/ko-nkrv/act/5/#L31">행 5:31</a>; <a href="https://bibleox.com/ko/ko-nkrv/act/13/#L23">행 13:23</a>; <a href="https://bibleox.com/ko/ko-nkrv/ef/5/#L23">엡 5:23</a>; <a href="https://bibleox.com/ko/ko-nkrv/fil/3/#L20">빌 3:20</a>; <a href="https://bibleox.com/ko/ko-nkrv/1tim/1/#L1">딤전 1:1</a>; <a href="https://bibleox.com/ko/ko-nkrv/2tim/1/#L10">딤후 1:10</a>; <a href="https://bibleox.com/ko/ko-nkrv/tit/1/#L4">딛 1:4</a>; <a href="https://bibleox.com/ko/ko-nkrv/tit/2/#L13">딛 2:13</a>; <a href="https://bibleox.com/ko/ko-nkrv/tit/3/#L6">딛 3:6</a>; <a href="https://bibleox.com/ko/ko-nkrv/2pet/1/#L1">벧후 1:1</a>; <a href="https://bibleox.com/ko/ko-nkrv/2pet/1/#L11">벧후 1:11</a>; <a href="https://bibleox.com/ko/ko-nkrv/2pet/2/#L20">벧후 2:20</a>; <a href="https://bibleox.com/ko/ko-nkrv/2pet/3/#L18">벧후 3:18</a>; <a href="https://bibleox.com/ko/ko-nkrv/1in/4/#L14">요일 4:14</a>;</p></li><li><p>빛 (안누르, النور) – <a href="https://bibleox.com/ko/ko-nkrv/in/1/#L9">요 1:9</a>; <a href="https://bibleox.com/ko/ko-nkrv/in/12/#L46">요 12:46</a>; <a href="https://bibleox.com/ko/ko-nkrv/in/12/#L35-36">요 12:35-36</a>;</p></li><li><p>상속자 (알와리스, الوارث) – <a href="https://bibleox.com/ko/ko-nkrv/evr/1/#L2">히 1:2</a>; <a href="https://bibleox.com/ko/ko-nkrv/mf/21/#L38">마 21:38</a>; <a href="https://bibleox.com/ko/ko-nkrv/2tim/4/#L1">딤후 4:1</a>; <a href="https://bibleox.com/ko/ko-nkrv/2pet/1/#L11">벧후 1:11</a>; <a href="https://bibleox.com/ko/ko-nkrv/rim/8/#L17">롬 8:17</a>;</p></li><li><p>진리 (알하크, الحق) – <a href="https://bibleox.com/ko/ko-nkrv/in/14/#L6">요 14:6</a>; <a href="https://bibleox.com/ko/ko-nkrv/otkr/3/#L7">계 3:7</a>;</p></li><li><p>여시는 분 (알파타흐, ٱلْفَتَّاحُ) – <a href="https://bibleox.com/ko/ko-nkrv/otkr/3/#L7-8">계 3:7-8</a>;</p></li><li><p>살리시는 분 (알바이스, ٱلْبَاعِثُ) – <a href="https://bibleox.com/ko/ko-nkrv/in/5/#L21">요 5:21</a>; <a href="https://bibleox.com/ko/ko-nkrv/in/6/#L54">요 6:54</a>;</p></li><li><p><strong>전능하신 분</strong> (알자바르, ٱلْجَبَّارُ) – <a href="https://bibleox.com/ko/ko-nkrv/evr/1/#L3">히 1:3</a>; <a href="https://bibleox.com/ko/ko-nkrv/otkr/1/#L8">계 1:8</a>; <a href="https://bibleox.com/ko/ko-nkrv/mf/28/#L18">마 28:18</a>.</p></li></ul>'
  meta_desc: 예수 그리스도의 칭호에 관한 성경 구절
