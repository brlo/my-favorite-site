  copy_cover: true
  body: '<h2>예수 그리스도께서는 베들레헴에서 나셨습니다</h2><blockquote><p>“예수께서 헤로데왕 때에 <strong>유다 베들레헴에서 나셨는데</strong> 그 때에 동방에서 박사들이 예루살렘에 와서” (<a href="https://bibleox.com/ko/ko-ctb/mf/2/#L1">마태 2:1</a>; <a href="https://bibleox.com/ko/ko-ctb/lk/2/#L4-7">루가 2:4-7</a>)</p></blockquote><p>예언대로: <a href="https://bibleox.com/ko/ko-ctb/mf/2/#L5">마태 2:5</a>; <a href="https://bibleox.com/ko/ko-ctb/in/7/#L42">요한 7:42</a>; <a href="https://bibleox.com/ko/ko-ctb/mih/5/#L1">미가 5:1</a>.</p><h2>에집트로 피신</h2><p>나신 뒤 요셉과 동정녀 마리아는 헤로데왕의 박해를 피해 아기 예수를 몇 해 동안 에집트로 데려갑니다(<a href="https://bibleox.com/ko/ko-ctb/mf/2/#L16">마태 2:16</a>):</p><blockquote><p>“요셉은 일어나 그 밤으로 아기와 어머니를 데리고 <strong>에집트로 가서</strong> <strong>헤로데가 죽을 때까지 거기에서 살았다</strong>. 이리하여 주께서 예언자를 시켜 ‘내가 내 아들을 에집트에서 불러 내었다’고 하신 말씀이 이루어졌다.” (<a href="https://bibleox.com/ko/ko-ctb/mf/2/#L14-15">마태 2:14-15</a>)</p></blockquote><p>예언대로: <a href="https://bibleox.com/ko/ko-ctb/mf/2/#L15">마태 2:15</a>; <a href="https://bibleox.com/ko/ko-ctb/os/11/#L1">호세 11:1</a>.</p><h2>나자렛으로 돌아옴</h2><p>그 뒤 그들은 나자렛에 있는 요셉의 집으로 돌아옵니다(<a href="https://bibleox.com/ko/ko-ctb/lk/2/#L4">루가 2:4</a>):</p><blockquote><p>“아기의 목숨을 노리던 자들이 이미 죽었으니 일어나 아기와 아기 어머니를 데리고 이스라엘 땅으로 돌아 가라‘하고 일러 주었다. 요셉은 일어나서 <strong>아기와 아기 어머니를 데리고 이스라엘 땅으로 돌아 왔다</strong>. 그러나 아르켈라오가 자기 아버지 헤로데를 이어 유다 왕이 되었다는 말을 듣고 그리로 가기를 두려워하였다. 그러다가 그는 다시 꿈에 지시를 받고 <strong>갈릴래아 지방으로 가서</strong> <strong>나자렛</strong>이라는 동네에서 살았다. 이리하여 예언자를 시켜 ’그를 나자렛 사람이라 부르리라‘고 하신 말씀이 이루어졌다.” (<a href="https://bibleox.com/ko/ko-ctb/mf/2/#L20-23">마태 2:20-23</a>)</p></blockquote><p>예언대로: <a href="https://bibleox.com/ko/ko-ctb/mf/2/#L23">마태 2:23</a>, 아마도: <a href="https://bibleox.com/ko/ko-ctb/sud/13/#L5">판관 13:5</a>.</p><h2>해마다 예루살렘에 올라감</h2><p>예수 그리스도께서는 해마다 부모와 친척과 친지들과 함께 예루살렘 성전에 가셨습니다(<a href="https://bibleox.com/ko/ko-ctb/lk/2/#L43-44">루가 2:43-44</a>):</p><blockquote><p>“<strong>해마다 과월절이 되면 예수의 부모는 명절을 지내러 예루살렘으로 가곤 하였는데</strong> 예수가 열 두 살이 되던 해에도 <strong>예년과 마찬가지로 예루살렘으로 올라 갔다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/lk/2/#L41-42">루가 2:41-42</a>)</p></blockquote><p>열두 살에 소년 예수께서는 이미 큰 지혜를 지니셨고, 그것이 예루살렘 성전의 교사들을 놀라게 했습니다:</p><blockquote><p>“해마다 과월절이 되면 예수의 부모는 명절을 지내러 예루살렘으로 가곤 하였는데 예수가 <strong>열 두 살이 되던 해에도</strong> 예년과 마찬가지로 예루살렘으로 올라 갔다. &lt;…&gt; 사흘 만에 <strong>성전에서</strong> 그를 찾아 냈는데 거기서 예수는 <strong>학자들과 한 자리에 앉아 그들의 말을 듣기도 하고 그들에게 묻기도 하는 중이었다. 그리고 듣고 있던 사람들은 모두 그의 지능과 대답하는 품에 경탄하고 있었다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/lk/2/#L41-42,46-47">루가 2:41-42,46-47</a>)</p></blockquote><p>열두 살 뒤에도 그리스도께서는 나자렛에서 부모에게 순종하며 사셨습니다:</p><blockquote><p>“예수는 부모를 따라 <strong>나자렛으로 돌아 와 부모에게 순종하며 살았다</strong>. 그 어머니는 이 모든 일을 마음 속에 간직하였다.” (<a href="https://bibleox.com/ko/ko-ctb/lk/2/#L51">루가 2:51</a>)</p></blockquote><h2>나자렛에서 가파르나움으로: 전도의 시작</h2><p>서른 살이 되어 예언자 요한에게 세례를 받으신 뒤에야 그리스도께서는 전도를 시작하시려고 나자렛을 떠나 가파르나움으로 옮기십니다:</p><blockquote><p>“요한이 잡혔다는 말을 들으시고 예수께서는 다시 갈릴래아로 가셨다. 그러나 <strong>나자렛에 머물지 않으시고</strong> 즈불룬과 납달리 지방 호숫가에 있는 <strong>가파르나움으로 가서 사셨다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/mf/4/#L12-13">마태 4:12-13</a>)</p></blockquote><p>예언대로: <a href="https://bibleox.com/ko/ko-ctb/mf/4/#L14-16">마태 4:14-16</a>; <a href="https://bibleox.com/ko/ko-ctb/is/8/#L23">이사 8:23</a>; <a href="https://bibleox.com/ko/ko-ctb/is/9/#L1">이사 9:1</a></p><h2>중요한 세부 사항</h2><h3>갈릴래아 사람들은 예수를 목수의 아들로 잘 알고 있습니다</h3><p>갈릴래아에서 전도하실 때 사람들은 예수 그리스도를 평범한 목수, 목수의 아들로 잘 알고 있습니다:</p><blockquote><p>“<strong>저 사람은 그 목수가 아닌가</strong>? 그 어머니는 마리아요, 그 형제들은 야고보, 요셉, 유다, 시몬이 아닌가? 그의 누이들도 다 우리와 같이 여기 살고 있지 않은가?‘ 하면서 좀처럼 예수를 믿으려 하지 않았다.” (<a href="https://bibleox.com/ko/ko-ctb/mk/6/#L3">마르 6:3</a>)</p></blockquote><blockquote><p>“<strong>저 사람은 그 목수의 아들이 아닌가</strong>? 어머니는 마리아요, 그 형제들은 야고보, 요셉, 시몬, 유다가 아닌가?” (<a href="https://bibleox.com/ko/ko-ctb/mf/13/#L55">마태 13:55</a>)</p></blockquote><h3>율법을 지키려고 정기적으로 성전에 가심</h3><p>율법을 지키시려고 그리스도께서는 한 해에 세 번 예루살렘 성전에 가셔야 했습니다:</p><blockquote><p>“<strong>너희 남자들은 일 년에 세번</strong>, 모두 주 야훼 앞에 나와야 한다.” (<a href="https://bibleox.com/ko/ko-ctb/ish/23/#L17">출 23:17</a>)</p></blockquote><blockquote><p>“<strong>모든 남자가 한 해에 세 번씩</strong> 이스라엘의 하느님 주 야훼 앞에 나타나야 한다.” (<a href="https://bibleox.com/ko/ko-ctb/ish/34/#L23">출 34:23</a>)</p></blockquote><blockquote><p>“<strong>너희 가운데 남자는 누구든지 일 년에 세 번, 과월절과 추수절과 초막절에</strong> 너희 하느님 야훼께서 고르신 곳에 와서 그분의 얼굴을 뵈어야 한다. 그러나 아무도 빈손으로 야훼의 얼굴을 뵈러 오면 안 된다.” (<a href="https://bibleox.com/ko/ko-ctb/vtor/16/#L16">신 16:16</a>)</p></blockquote><h3>그리스도께서는 율법을 지키셨습니다</h3><blockquote><p>“‘내가 <strong>율법이나</strong> 예언서의 말씀을 없애러 온 줄로 생각하지 말아라. <strong>없애러 온 것이 아니라 오히려 완성하러 왔다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/mf/5/#L17">마태 5:17</a>)</p></blockquote><blockquote><p>“예수께서 요한에게 ‘지금은 내가 하자는 대로 하여라. <strong>우리가 이렇게 해야 하느님께서 원하시는 모든 일이 이루어진다</strong>’하고 대답하셨다. 그제야 요한은 예수께서 하자는 대로 하였다.” (<a href="https://bibleox.com/ko/ko-ctb/mf/3/#L15">마태 3:15</a>)</p></blockquote><blockquote><p>“<strong>사람의 아들은 성서에 기록된 대로 죽음의 길로 가겠지만</strong> 사람의 아들을 배반한 그 사람은 화를 입을 것이다. 그는 차라리 세상에 태어나지 않았더라면 더 좋을 뻔했다.‘” (<a href="https://bibleox.com/ko/ko-ctb/mf/26/#L24">마태 26:24</a>; <a href="https://bibleox.com/ko/ko-ctb/mk/14/#L21">마르 14:21</a>)</p></blockquote><blockquote><p>“그리고 그들에게 ‘내가 전에 너희와 함께 있을 때에도 말했거니와 <strong>모세의 율법과 예언서와 시편에 나를 두고 한 말씀은 반드시 다 이루어져야 한다</strong>.’ 하시고” (<a href="https://bibleox.com/ko/ko-ctb/lk/24/#L44">루가 24:44</a>)</p></blockquote><blockquote><p>“그러나 때가 찼을 때 하느님께서 당신의 아들을 보내시어 <strong>여자의 몸에서 나게 하시고 율법의 지배를 받게 하시어</strong>” (<a href="https://bibleox.com/ko/ko-ctb/gal/4/#L4">갈라 4:4</a>)</p></blockquote><h3>전도할 나이를 기다리심</h3><p>그리스도께서는 서른 살까지 전도와 기적을 삼가셨습니다. 공적 봉사는 하느님의 규정과 확립된 전통에 따라 서른 살에 시작되었기 때문입니다(<a href="https://bibleox.com/ko/ko-ctb/chis/4/#L3">민 4:3</a>). 그러므로 율법을 없애러 오신 것이 아니라 완성하러 오신 그리스도께서는(<a href="https://bibleox.com/ko/ko-ctb/mf/5/#L17">마태 5:17</a>) 서른 살까지 기다리신 뒤 전도에 나서셨습니다:</p><blockquote><p>“예수께서는 <strong>서른 살 가량 되어 전도하기 시작하셨는데</strong> 사람들이 알기에는 그는 요셉의 아들이요, 요셉은 엘리의 아들이며” (<a href="https://bibleox.com/ko/ko-ctb/lk/3/#L23">루가 3:23</a>)</p></blockquote><p>그리스도께서는 당신의 때가 오기를 기다리셨습니다:</p><blockquote><p>“예수께서는 어머니를 보시고 ‘어머니, 그것이 저에게 무슨 상관이 있다고 그러십니까? <strong>아직 제 때가 오지 않았습니다</strong>’하고 말씀하셨다.” (<a href="https://bibleox.com/ko/ko-ctb/in/2/#L4">요한 2:4</a>)</p></blockquote><blockquote><p>“그러자 그들은 예수를 잡고 싶었으나 그에게 손을 대는 사람은 하나도 없었다. <strong>예수의 때가 아직 이르지 않았던 것이다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/in/7/#L30">요한 7:30</a>)</p></blockquote><blockquote><p>“이것은 예수께서 성전에서 가르치실 때에 헌금궤가 있는 곳에서 하신 말씀이었다. 그러나 아무도 그를 잡지 않았다. <strong>때가 오지 않았던 것이다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/in/8/#L20">요한 8:20</a>)</p></blockquote><blockquote><p>“그래서 예수께서는 그들에게 이렇게 대답하셨다. ‘너희에게는 아무 때나 상관없지만 <strong>나의 때는 아직 오지 않았다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/in/7/#L6">요한 7:6</a>)</p></blockquote><blockquote><p>“너희는 어서 올라 가서 명절을 지내라. <strong>아직 나의 때가 되지 않았으니</strong> 나는 이번 명절에는 올라 가지 않겠다.‘” (<a href="https://bibleox.com/ko/ko-ctb/in/7/#L8">요한 7:8</a>)</p></blockquote><blockquote><p>“내가 받아야 할 세례가 있다. <strong>이 일을 다 겪어 낼 때까지는 내 마음이 얼마나 괴로울지 모른다</strong>.” (<a href="https://bibleox.com/ko/ko-ctb/lk/12/#L50">루가 12:50</a>)</p></blockquote><blockquote><p>“이 말씀을 마치시고 예수께서는 하늘을 우러러 보시며 이렇게 말씀하셨다. ‘<strong>아버지, 때가 왔습니다</strong>. 아들의 영광을 드러내 주시어 아들이 아버지의 영광을 드러내게 하여 주십시오.” (<a href="https://bibleox.com/ko/ko-ctb/in/17/#L1">요한 17:1</a>)</p></blockquote>'
