  references: "<ol><li><p><em>이 글은 그리스도께서 멀리 인도로 가서 지혜를 배웠다는 생각을 반박하는 데 중요합니다.</em></p></li></ol><p>번역: 로디온 블라소프 (AI 도구 활용). 저본: 러시아어 원문. 참고: 영어·일본어 번역. 성경 인용과 링크는 공동번역 성서에 따름.</p>"
