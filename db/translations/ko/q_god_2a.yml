- src: Христос-не-архангел-Михаил
  path: Va9h_그리스도는대천사미카엘이아니시다
  title: 그리스도는 대천사 미카엘이 아니십니다
  copy_cover: true
  body: '<h2>머리말</h2><p>먼저 이 견해(그리스도가 대천사 미카엘이라는 견해)는 전체주의 분파인 “여호와의 증인”에게 있다는 것을 밝혀야 합니다. 여호와의 증인은 자기네 가르침을 뒷받침하려고 심각한 왜곡이 있는 자체 성경 번역을 만들었습니다(<a href="https://azbyka.ru/otechnik/sekty/rassuzhdaja-so-svideteljami-iegovy-pri-pomoshhi-pisanija/4_7">여호와의 증인 “신세계 번역”에 대한 전문가 평가</a>, 러시아어). 재림교도들도 구약에 대천사 미카엘로 나타나는 분이 하느님의 아들 예수 그리스도라고 믿습니다.</p><h2>“천사”라는 낱말의 두 가지 뜻</h2><p>성경에서 천사라는 낱말은 두 가지 뜻으로 쓰입니다. 직무와 본성입니다.</p><p>천사의 <strong>직무</strong>는 보냄을 받는 것입니다. 이 고대 그리스어 낱말의 뜻이 문자 그대로 그렇기 때문입니다: ἄγγελος(앙겔로스) — 사자, 전령; 히브리어 ‏מלאך‏‎ — 사자.</p><p>천사의 <strong>본성</strong>은 몸이 없는 영입니다. 천사는 하느님께서 창조하신 영적 존재로서 몸이 없습니다. 곧 영입니다. 이 영들은 사람보다 먼저 창조되었고 자유와 이성을 받았습니다. 그 가운데 일부는 하느님께 순종하며 살기를 원하지 않아 그분에게서 떨어져 나갔지만 여전히 천사라 불립니다(<a href="https://bibleox.com/ko/ko-nkrv/mf/25/#L41">마 25:41</a>). 곧 활동 방식과 상관없는 본성이 있습니다. 보냄을 받든 받지 않든 천사입니다. 그것이 본성입니다. 그래서 사람에게서 태어난 분명한 사람인 예언자 세례 요한도 천사라 불립니다(<a href="https://bibleox.com/ko/ko-nkrv/mal/3/#L1">말 3:1</a>; <a href="https://bibleox.com/ko/ko-nkrv/mf/11/#L10">마 11:10</a>; <a href="https://bibleox.com/ko/ko-nkrv/mk/1/#L2">막 1:2</a>; <a href="https://bibleox.com/ko/ko-nkrv/lk/7/#L27">눅 7:27</a>). 같은 뜻으로 같은 곳에서 그리스도께서도 친히 계약의 천사라 불리십니다(<a href="https://bibleox.com/ko/ko-nkrv/mal/3/#L1">말 3:1</a>). (개역개정은 이 낱말을 “사자”로 옮겼지만, 그리스어 본문에는 두 곳 모두 ἄγγελος가 있습니다: τὸν ἄγγελόν μου — “나의 천사”, ὁ ἄγγελος τῆς διαθήκης — “계약의 천사”.) 이제 인용구를 봅시다.</p><h2>모든 천사는 섬기는 영이지만 그리스도께서는 보좌에 앉아 계십니다</h2><p>사도 바울은 하느님의 아들을 천사들보다 훨씬 뛰어난 분이라고 말합니다(<a href="https://bibleox.com/ko/ko-nkrv/evr/1/#L4">히 1:4</a>). 하느님께서 천사들에게는 아들에게 하시듯 말씀하지 않으시기 때문입니다(<a href="https://bibleox.com/ko/ko-nkrv/evr/1/#L5">히 1:5</a>). 모든 천사가 하느님의 아들에게 예배드릴 것입니다(<a href="https://bibleox.com/ko/ko-nkrv/evr/1/#L6">히 1:6</a>). 그는 천사들에 관한 하느님의 말씀과 아들에 관한 말씀의 차이를 지적합니다. 천사들은 섬기는 존재이고 아들은 보좌에 앉으신 통치자이십니다(<a href="https://bibleox.com/ko/ko-nkrv/evr/1/#L7-8">히 1:7-8</a>, <a href="https://bibleox.com/ko/ko-nkrv/evr/1/#L13">히 1:13</a>). 창조된 모든 것은 일시적이지만 모든 것을 창조하신 하느님의 아들은 결코 사라지지 않으십니다(<a href="https://bibleox.com/ko/ko-nkrv/evr/1/#L10-12">히 1:10-12</a>). 끝으로 모든 천사는 예외 없이 섬기는 영이고 아들은 성부와 함께 보좌에 앉아 계신다고 직접 말합니다:</p><blockquote><p>“어느 때에 <strong>천사 중 누구에게</strong> 내가 네 원수로 네 발등상이 되게 하기까지 <strong>너는 내 우편에 앉아 있으라</strong> 하셨느냐 <strong>모든 천사들은 섬기는 영으로서</strong> 구원 받을 상속자들을 위하여 섬기라고 보내심이 아니냐” (<a href="https://bibleox.com/ko/ko-nkrv/evr/1/#L13-14">히 1:13-14</a>)</p></blockquote><p>아들은 섬김을 받으시고, 성부와 함께 다스리십니다.</p><h2>사람들은 하느님 앞에 무릎을 꿇고, 모든 피조물은 그리스도 앞에 무릎을 꿇습니다</h2><p>하느님께서는 당신 앞에 모든 무릎이 꿇을 것이라고 말씀하시는데(<a href="https://bibleox.com/ko/ko-nkrv/rim/14/#L11">롬 14:11</a>), 동시에 사람뿐 아니라 모든 피조물이 그리스도 앞에 무릎을 꿇을 것이고(<a href="https://bibleox.com/ko/ko-nkrv/fil/2/#L10">빌 2:10</a>), 거기에는 천사들도 포함됩니다(<a href="https://bibleox.com/ko/ko-nkrv/evr/1/#L6">히 1:6</a>).</p><h2>세상은 천사가 아니라 그리스도께 복종합니다</h2><blockquote><p>“하나님이 우리가 말하는 바 <strong>장차 올 세상을 천사들에게 복종하게 하심이 아니니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/evr/2/#L5">히 2:5</a>)</p></blockquote><p>그런데 세상은 그리스도께 복종합니다:</p><blockquote><p>“<strong>만물을 그의 발 아래에 두셨다</strong> 하셨으니 만물을 아래에 둔다 말씀하실 때에 만물을 그의 아래에 두신 이가 그 중에 들지 아니한 것이 분명하도다” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/15/#L27">고전 15:27</a>)</p></blockquote><blockquote><p>“또 <strong>만물을 그의 발 아래에 복종하게 하시고</strong> 그를 만물 위에 교회의 머리로 삼으셨느니라” (<a href="https://bibleox.com/ko/ko-nkrv/ef/1/#L22">엡 1:22</a>)</p></blockquote><blockquote><p>“<strong>만물을 그 발 아래에 복종하게 하셨느니라</strong> 하였으니 만물로 그에게 복종하게 하셨은즉 복종하지 않은 것이 하나도 없어야 하겠으나 지금 우리가 만물이 아직 그에게 복종하고 있는 것을 보지 못하고” (<a href="https://bibleox.com/ko/ko-nkrv/evr/2/#L8">히 2:8</a>)</p></blockquote><h2>전능하신 분, 왕 중의 왕, 주 중의 주</h2><p>이처럼 모든 천사는 섬기는 영이고, 하느님의 아들 예수 그리스도께서는 하느님께서 거듭 불리시는 이름, 곧 전능하신 분, 왕 중의 왕, 주 중의 주로 불리신다는 것을 확인했습니다. 예언자들은 <strong>하느님</strong>을 주 중의 주라 부릅니다(<a href="https://bibleox.com/ko/ko-nkrv/ps/136/#L2-3">시 136:2-3</a>). 사도들은 <strong>하느님</strong>을 주 중의 주, 왕 중의 왕이라 부릅니다(<a href="https://bibleox.com/ko/ko-nkrv/1tim/6/#L15-16">딤전 6:15-16</a>). 사도들은 <strong>예수 그리스도</strong>를 주 중의 주, 왕 중의 왕이라 부르고(<a href="https://bibleox.com/ko/ko-nkrv/otkr/17/#L14">계 17:14</a>; <a href="https://bibleox.com/ko/ko-nkrv/otkr/19/#L16">계 19:16</a>), 전능하신 분이라 부릅니다(<a href="https://bibleox.com/ko/ko-nkrv/otkr/1/#L8">계 1:8</a>). 왕 중의 왕 위에 다른 왕은 없습니다. 주 중의 주 위에 다른 주는 없습니다. 전능하신 분 위에 그분을 붙드는 이는 없습니다. 그분께서 친히 모든 것을 붙들고 계시기 때문입니다. 대천사 미카엘은 천사 군대의 지휘자입니다. 그리스도께서는 천사들과 대천사 미카엘을 포함한 세상 모든 것의 지휘자이십니다.</p><h2>하느님(여호와)께서 친히 예언자들을 보내셨는데, 그리스도께서는 당신이 보냈다고 말씀하십니다</h2><p>그리스도께서는 이스라엘에 많은 예언자를 보낸 분이 당신이라고 말씀하십니다(<a href="https://bibleox.com/ko/ko-nkrv/mf/23/#L34">마 23:34</a>). 그리고 성경은 천사들을 통해서가 아니라 하느님께서 친히 예언자들에게 말씀하시고 친히 이스라엘에 보내셨다고 말합니다(<a href="https://bibleox.com/ko/ko-nkrv/ish/3/#L12">출 3:12</a>; <a href="https://bibleox.com/ko/ko-nkrv/mal/4/#L1,5">말 4:1,5</a>; <a href="https://bibleox.com/ko/ko-nkrv/sud/6/#L8">삿 6:8</a>; <a href="https://bibleox.com/ko/ko-nkrv/2par/25/#L15">대하 25:15</a>; <a href="https://bibleox.com/ko/ko-nkrv/1ts/15/#L1">삼상 15:1</a>; <a href="https://bibleox.com/ko/ko-nkrv/2ts/12/#L1">삼하 12:1</a>; <a href="https://bibleox.com/ko/ko-nkrv/2ts/12/#L24-25">삼하 12:24-25</a>; <a href="https://bibleox.com/ko/en-nrsv/3ezd/1/#L32">3에스 1:32</a>). 곧 그리스도께서는 하느님, 여호와이십니다. 하느님께서 예언자들과 소통하실 때 중개자는 없었습니다.</p><h2>성부에게서 나신 하느님의 아들께서 천사들을 창조하셨습니다</h2><p>그리스도께서는 천사들을 포함하여 보이는 것과 보이지 않는 모든 것의 창조주이십니다(<a href="https://bibleox.com/ko/ko-nkrv/kol/1/#L13-17">골 1:13-17</a>). 곧 천사라면 자기 자신도 창조했어야 합니다.</p><h2>“미카엘”이라는 이름의 어원</h2><p>미카엘은 히브리어 이름으로, ‏מי כמו אלוהים‏‎(미 크모 엘로힘, 줄여서 “미카엘”), 문자 그대로 “누가 하느님과 같은가”에서 왔습니다. 곧 아무도 하느님과 같지 않으며 아무도 그분과 비교될 수 없다는 뜻입니다. 그러나 그리스도께서는 하느님과 같음을 빼앗은 것으로 여기지 않으십니다(<a href="https://bibleox.com/ko/ko-nkrv/fil/2/#L6">빌 2:6</a>).</p><h2>옛 계약은 천사들을 통해 주어졌고, 새 계약은 주님께서 전하셨습니다</h2><p>사도 바울은 옛 계약과 새 계약의 차이를 지적합니다. 옛 계약은 천사들을 통해 주어졌고(<a href="https://bibleox.com/ko/ko-nkrv/evr/2/#L2">히 2:2</a>), 새 계약은 주님께서 친히 전하셨습니다(<a href="https://bibleox.com/ko/ko-nkrv/evr/2/#L3">히 2:3</a>). 곧 적어도 천사들을 통해서가 아닙니다.</p><h2>사람이 되신 하느님께서 천사들에게 당신을 보이셨습니다</h2><blockquote><p>“크도다 경건의 비밀이여, 그렇지 않다 하는 이 없도다 <strong>그는 육신으로 나타난 바 되시고</strong> 영으로 의롭다 하심을 받으시고 <strong>천사들에게 보이시고</strong> 만국에서 전파되시고 세상에서 믿은 바 되시고 영광 가운데서 올려지셨느니라” (<a href="https://bibleox.com/ko/ko-nkrv/1tim/3/#L16">딤전 3:16</a>) <em>(비잔틴 본문(다수 사본)에는 θεὸς ἐφανερώθη ἐν σαρκί — “<strong>하느님께서</strong> 육신으로 나타나셨고”라고 되어 있습니다.)</em></p></blockquote><p>아무도 하느님을 본 적이 없습니다(<a href="https://bibleox.com/ko/ko-nkrv/in/1/#L18">요 1:18</a>). 그분은 가까이 갈 수 없는 빛 가운데 계시고 사람은 하느님을 볼 수 없습니다(<a href="https://bibleox.com/ko/ko-nkrv/1tim/6/#L16">딤전 6:16</a>). 그러나 참 사람으로 태어나심으로써(<a href="https://bibleox.com/ko/ko-nkrv/in/1/#L14">요 1:14</a>) 하느님께서는 그리스도 안에서 모든 이에게 보이게 되십니다. 사람은 영적 세계의 주민(천사)을 육체의 눈으로 볼 수 없지만, 그리스도께서는 사탄이 하늘에서 떨어지는 것을 보았다고 말씀하십니다(<a href="https://bibleox.com/ko/ko-nkrv/lk/10/#L18">눅 10:18</a>). 또한 천사들은 여러 때 여러 곳에서 여러 사람에게 나타나지만, 성경은 그 일(천사의 나타남) 자체에 아무 의미도 두지 않습니다. 곧 “그가 천사들에게 자신을 보였다”는 식으로 말하지 않습니다. 나타났고, 그뿐입니다.</p><h2>천사들은 창조되었고 하느님의 아들은 나셨습니다. 그것도 그저 나신 것이 아니라 외아들로 나셨습니다</h2><p>하느님의 아들은 창조된 것이 아니라 하느님에게서 나셨고, 창조된 모든 것은 그 뒤에 아들을 통해 창조되었습니다(<a href="https://bibleox.com/ko/ko-nkrv/kol/1/#L15-16">골 1:15-16</a>). 그리고 하느님의 아들은 외아들이십니다(<a href="https://bibleox.com/ko/ko-nkrv/in/1/#L18">요 1:18</a>). 이는 외아들처럼 성부의 아들인 이는 아무도 없다는 뜻입니다. 우리는 “창조하다”와 “낳다”라는 말을 구별합니다. 무엇이든 만들 수는 있지만, 낳는 것은 자기와 같은 본성을 지닌 것뿐입니다. 물고기는 물고기를, 사람은 사람을, 하느님은 하느님을 낳습니다. 올리브 나무가 오렌지를 낳지는 않습니다.</p><h2>맺음말</h2><p>그리스도는 대천사 미카엘이 아니라 하느님이십니다. 그리고 거듭 직접 하느님이라 불리십니다. 성경은 이를 분명히 말합니다: <a href="https://bibleox.com/ru/ru/w/Христос-Бог">예수 그리스도는 하느님이십니다</a></p><blockquote><p>“<strong>내 백성아 들을지어다</strong> 내가 말하리라 이스라엘아 내가 네게 증언하리라 <strong>나는 하나님 곧 네 하나님이로다</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ps/50/#L7">시 50:7</a>)</p></blockquote>'
