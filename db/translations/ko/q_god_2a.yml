  body: '<p>무슬림에게 중요한 점은, 이슬람이 오직 하느님께만 돌리는 많은 칭호를 성경이 그리스도께 적용한다는 것입니다: 창조주, 거룩하신 분, 왕 중의 왕, 처음이신 분, 변하지 않으시는 분, 전능하신 분:</p><ul><li><p><strong>창조주</strong> (알할리크, ٱلْخَـٰلِقُ) – <a href="https://bibleox.com/ko/ko-ctb/in/1/#L3,10">요한 1:3,10</a>; <a href="https://bibleox.com/ko/ko-ctb/evr/1/#L1-2">히브 1:1-2</a>; <a href="https://bibleox.com/ko/ko-ctb/evr/11/#L3">히브 11:3</a>; <a href="https://bibleox.com/ko/ko-ctb/evr/1/#L8-12">히브 1:8-12</a>; <a href="https://bibleox.com/ko/ko-ctb/kol/1/#L13-17">골로 1:13-17</a>;</p></li><li><p><strong>왕 중의 왕</strong> (말리크 알물크, مالك الملك) – <a href="https://bibleox.com/ko/ko-ctb/otkr/17/#L14">묵시 17:14</a>; <a href="https://bibleox.com/ko/ko-ctb/otkr/19/#L16">묵시 19:16</a>;</p></li><li><p>지배하시는 분 (알카하르, ٱلْقَهَّـٰرُ) – <a href="https://bibleox.com/ko/ko-ctb/otkr/17/#L14">묵시 17:14</a>; <a href="https://bibleox.com/ko/ko-ctb/otkr/19/#L16">묵시 19:16</a>;</p></li><li><p><strong>거룩하신 분</strong> (알쿠두스, ٱلْقُدُّوسُ) – <a href="https://bibleox.com/ko/ko-ctb/otkr/3/#L7">묵시 3:7</a>; <a href="https://bibleox.com/ko/ko-ctb/otkr/6/#L10">묵시 6:10</a>; <a href="https://bibleox.com/ko/ko-ctb/evr/7/#L26">히브 7:26</a>; <a href="https://bibleox.com/ko/ko-ctb/act/3/#L14">사도 3:14</a>;</p></li><li><p>온유하신 분 (알할림, ٱلْحَلِيمُ) – <a href="https://bibleox.com/ko/ko-ctb/ier/11/#L19">예레 11:19</a>; <a href="https://bibleox.com/ko/ko-ctb/mf/11/#L29">마태 11:29</a>; <a href="https://bibleox.com/ko/ko-ctb/mf/21/#L5">마태 21:5</a>;</p></li><li><p>시작, <strong>처음이신 분</strong> (알아왈, الأول) – <a href="https://bibleox.com/ko/ko-ctb/in/1/#L1-3">요한 1:1-3</a>; <a href="https://bibleox.com/ko/ko-ctb/otkr/1/#L11">묵시 1:11</a>; <a href="https://bibleox.com/ko/ko-ctb/otkr/1/#L17">묵시 1:17</a>; <a href="https://bibleox.com/ko/ko-ctb/otkr/2/#L8">묵시 2:8</a>; <a href="https://bibleox.com/ko/ko-ctb/otkr/22/#L13">묵시 22:13</a>;</p></li><li><p>끝, 마지막이신 분 (알아히르, الأخر) – <a href="https://bibleox.com/ko/ko-ctb/otkr/1/#L11">묵시 1:11</a>; <a href="https://bibleox.com/ko/ko-ctb/otkr/1/#L17">묵시 1:17</a>; <a href="https://bibleox.com/ko/ko-ctb/otkr/2/#L8">묵시 2:8</a>; <a href="https://bibleox.com/ko/ko-ctb/otkr/22/#L13">묵시 22:13</a>;</p></li><li><p><strong>변하지 않으시는 분</strong> (앗사마드, الصمد) – <a href="https://bibleox.com/ko/ko-ctb/evr/13/#L8">히브 13:8</a>; <a href="https://bibleox.com/ko/ko-ctb/evr/1/#L10-12">히브 1:10-12</a>;</p></li><li><p>살아 계신 분 (알하이, الحي) – <a href="https://bibleox.com/ko/ko-ctb/otkr/1/#L18">묵시 1:18</a>; <a href="https://bibleox.com/ko/ko-ctb/act/3/#L15">사도 3:15</a>;</p></li><li><p>구세주 (알무하이민, ٱلْمُهَيْمِنُ) – <a href="https://bibleox.com/ko/ko-ctb/in/4/#L42">요한 4:42</a>; <a href="https://bibleox.com/ko/ko-ctb/lk/1/#L47">루가 1:47</a>; <a href="https://bibleox.com/ko/ko-ctb/lk/2/#L11">루가 2:11</a>; <a href="https://bibleox.com/ko/ko-ctb/act/5/#L31">사도 5:31</a>; <a href="https://bibleox.com/ko/ko-ctb/act/13/#L23">사도 13:23</a>; <a href="https://bibleox.com/ko/ko-ctb/ef/5/#L23">에페 5:23</a>; <a href="https://bibleox.com/ko/ko-ctb/fil/3/#L20">필립 3:20</a>; <a href="https://bibleox.com/ko/ko-ctb/1tim/1/#L1">1디모 1:1</a>; <a href="https://bibleox.com/ko/ko-ctb/2tim/1/#L10">2디모 1:10</a>; <a href="https://bibleox.com/ko/ko-ctb/tit/1/#L4">디도 1:4</a>; <a href="https://bibleox.com/ko/ko-ctb/tit/2/#L13">디도 2:13</a>; <a href="https://bibleox.com/ko/ko-ctb/tit/3/#L6">디도 3:6</a>; <a href="https://bibleox.com/ko/ko-ctb/2pet/1/#L1">2베드 1:1</a>; <a href="https://bibleox.com/ko/ko-ctb/2pet/1/#L11">2베드 1:11</a>; <a href="https://bibleox.com/ko/ko-ctb/2pet/2/#L20">2베드 2:20</a>; <a href="https://bibleox.com/ko/ko-ctb/2pet/3/#L18">2베드 3:18</a>; <a href="https://bibleox.com/ko/ko-ctb/1in/4/#L14">1요한 4:14</a>;</p></li><li><p>빛 (안누르, النور) – <a href="https://bibleox.com/ko/ko-ctb/in/1/#L9">요한 1:9</a>; <a href="https://bibleox.com/ko/ko-ctb/in/12/#L46">요한 12:46</a>; <a href="https://bibleox.com/ko/ko-ctb/in/12/#L35-36">요한 12:35-36</a>;</p></li><li><p>상속자 (알와리스, الوارث) – <a href="https://bibleox.com/ko/ko-ctb/evr/1/#L2">히브 1:2</a>; <a href="https://bibleox.com/ko/ko-ctb/mf/21/#L38">마태 21:38</a>; <a href="https://bibleox.com/ko/ko-ctb/2tim/4/#L1">2디모 4:1</a>; <a href="https://bibleox.com/ko/ko-ctb/2pet/1/#L11">2베드 1:11</a>; <a href="https://bibleox.com/ko/ko-ctb/rim/8/#L17">로마 8:17</a>;</p></li><li><p>진리 (알하크, الحق) – <a href="https://bibleox.com/ko/ko-ctb/in/14/#L6">요한 14:6</a>; <a href="https://bibleox.com/ko/ko-ctb/otkr/3/#L7">묵시 3:7</a>;</p></li><li><p>여시는 분 (알파타흐, ٱلْفَتَّاحُ) – <a href="https://bibleox.com/ko/ko-ctb/otkr/3/#L7-8">묵시 3:7-8</a>;</p></li><li><p>살리시는 분 (알바이스, ٱلْبَاعِثُ) – <a href="https://bibleox.com/ko/ko-ctb/in/5/#L21">요한 5:21</a>; <a href="https://bibleox.com/ko/ko-ctb/in/6/#L54">요한 6:54</a>;</p></li><li><p><strong>전능하신 분</strong> (알자바르, ٱلْجَبَّارُ) – <a href="https://bibleox.com/ko/ko-ctb/evr/1/#L3">히브 1:3</a>; <a href="https://bibleox.com/ko/ko-ctb/otkr/1/#L8">묵시 1:8</a>; <a href="https://bibleox.com/ko/ko-ctb/mf/28/#L18">마태 28:18</a>.</p></li></ul>'
