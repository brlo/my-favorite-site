  body: '<h2>예수 그리스도께서는 베들레헴에서 나셨습니다</h2><blockquote><p>“헤롯 왕 때에 예수께서 <strong>유대 베들레헴에서 나시매</strong> 동방으로부터 박사들이 예루살렘에 이르러 말하되” (<a href="https://bibleox.com/ko/ko-nkrv/mf/2/#L1">마 2:1</a>; <a href="https://bibleox.com/ko/ko-nkrv/lk/2/#L4-7">눅 2:4-7</a>)</p></blockquote><p>예언대로: <a href="https://bibleox.com/ko/ko-nkrv/mf/2/#L5">마 2:5</a>; <a href="https://bibleox.com/ko/ko-nkrv/in/7/#L42">요 7:42</a>; <a href="https://bibleox.com/ko/ko-nkrv/mih/5/#L2">미 5:2</a>.</p><h2>애굽으로 피신</h2><p>나신 뒤 요셉과 동정녀 마리아는 헤롯 왕의 박해를 피해 아기 예수를 몇 해 동안 애굽으로 데려갑니다(<a href="https://bibleox.com/ko/ko-nkrv/mf/2/#L16">마 2:16</a>):</p><blockquote><p>“요셉이 일어나서 밤에 아기와 그의 어머니를 데리고 <strong>애굽으로 떠나가</strong> <strong>헤롯이 죽기까지 거기 있었으니</strong> 이는 주께서 선지자를 통하여 말씀하신 바 애굽으로부터 내 아들을 불렀다 함을 이루려 하심이라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/2/#L14-15">마 2:14-15</a>)</p></blockquote><p>예언대로: <a href="https://bibleox.com/ko/ko-nkrv/mf/2/#L15">마 2:15</a>; <a href="https://bibleox.com/ko/ko-nkrv/os/11/#L1">호 11:1</a>.</p><h2>나사렛으로 돌아옴</h2><p>그 뒤 그들은 나사렛에 있는 요셉의 집으로 돌아옵니다(<a href="https://bibleox.com/ko/ko-nkrv/lk/2/#L4">눅 2:4</a>):</p><blockquote><p>“일어나 아기와 그의 어머니를 데리고 이스라엘 땅으로 가라 아기의 목숨을 찾던 자들이 죽었느니라 하시니 요셉이 일어나 <strong>아기와 그의 어머니를 데리고 이스라엘 땅으로 들어가니라</strong> 그러나 아켈라오가 그의 아버지 헤롯을 이어 유대의 임금 됨을 듣고 거기로 가기를 무서워하더니 꿈에 지시하심을 받아 <strong>갈릴리 지방으로 떠나가</strong> <strong>나사렛</strong>이란 동네에 가서 사니 이는 선지자로 하신 말씀에 나사렛 사람이라 칭하리라 하심을 이루려 함이러라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/2/#L20-23">마 2:20-23</a>)</p></blockquote><p>예언대로: <a href="https://bibleox.com/ko/ko-nkrv/mf/2/#L23">마 2:23</a>, 아마도: <a href="https://bibleox.com/ko/ko-nkrv/sud/13/#L5">삿 13:5</a>.</p><h2>해마다 예루살렘에 올라감</h2><p>예수 그리스도께서는 해마다 부모와 친척과 친지들과 함께 예루살렘 성전에 가셨습니다(<a href="https://bibleox.com/ko/ko-nkrv/lk/2/#L43-44">눅 2:43-44</a>):</p><blockquote><p>“<strong>그의 부모가 해마다 유월절이 되면 예루살렘으로 가더니</strong> 예수께서 열두 살 되었을 때에 그들이 <strong>이 절기의 관례를 따라 올라갔다가</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/lk/2/#L41-42">눅 2:41-42</a>)</p></blockquote><p>열두 살에 소년 예수께서는 이미 큰 지혜를 지니셨고, 그것이 예루살렘 성전의 교사들을 놀라게 했습니다:</p><blockquote><p>“그의 부모가 해마다 유월절이 되면 예루살렘으로 가더니 예수께서 <strong>열두 살 되었을 때에</strong> 그들이 이 절기의 관례를 따라 올라갔다가 &lt;…&gt; 사흘 후에 성전에서 만난즉 그가 <strong>선생들 중에 앉으사 그들에게 듣기도 하시며 묻기도 하시니 듣는 자가 다 그 지혜와 대답을 놀랍게 여기더라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/lk/2/#L41-42,46-47">눅 2:41-42,46-47</a>)</p></blockquote><p>열두 살 뒤에도 그리스도께서는 나사렛에서 부모에게 순종하며 사셨습니다:</p><blockquote><p>“예수께서 함께 내려가사 <strong>나사렛에 이르러 순종하여 받드시더라</strong> 그 어머니는 이 모든 말을 마음에 두니라” (<a href="https://bibleox.com/ko/ko-nkrv/lk/2/#L51">눅 2:51</a>)</p></blockquote><h2>나사렛에서 가버나움으로: 전도의 시작</h2><p>서른 살이 되어 예언자 요한에게 세례를 받으신 뒤에야 그리스도께서는 전도를 시작하시려고 나사렛을 떠나 가버나움으로 옮기십니다:</p><blockquote><p>“예수께서 요한이 잡혔음을 들으시고 갈릴리로 물러가셨다가 <strong>나사렛을 떠나</strong> 스불론과 납달리 지경 해변에 있는 <strong>가버나움에 가서 사시니</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/4/#L12-13">마 4:12-13</a>)</p></blockquote><p>예언대로: <a href="https://bibleox.com/ko/ko-nkrv/mf/4/#L14-16">마 4:14-16</a>; <a href="https://bibleox.com/ko/ko-nkrv/is/9/#L1-2">사 9:1-2</a></p><h2>중요한 세부 사항</h2><h3>갈릴리 사람들은 예수를 목수의 아들로 잘 알고 있습니다</h3><p>갈릴리에서 전도하실 때 사람들은 예수 그리스도를 평범한 목수, 목수의 아들로 잘 알고 있습니다:</p><blockquote><p>“이 사람이 <strong>마리아의 아들 목수가 아니냐</strong> 야고보와 요셉과 유다와 시몬의 형제가 아니냐 그 누이들이 우리와 함께 여기 있지 아니하냐 하고 예수를 배척한지라” (<a href="https://bibleox.com/ko/ko-nkrv/mk/6/#L3">막 6:3</a>)</p></blockquote><blockquote><p>“이는 <strong>그 목수의 아들이 아니냐</strong> 그 어머니는 마리아, 그 형제들은 야고보, 요셉, 시몬, 유다라 하지 않느냐” (<a href="https://bibleox.com/ko/ko-nkrv/mf/13/#L55">마 13:55</a>)</p></blockquote><h3>율법을 지키려고 정기적으로 성전에 가심</h3><p>율법을 지키시려고 그리스도께서는 한 해에 세 번 예루살렘 성전에 가셔야 했습니다:</p><blockquote><p>“<strong>네 모든 남자는 매년 세 번씩</strong> 주 여호와께 보일지니라” (<a href="https://bibleox.com/ko/ko-nkrv/ish/23/#L17">출 23:17</a>)</p></blockquote><blockquote><p>“<strong>너희의 모든 남자는 매년 세 번씩</strong> 주 여호와 이스라엘의 하나님 앞에 보일지라” (<a href="https://bibleox.com/ko/ko-nkrv/ish/34/#L23">출 34:23</a>)</p></blockquote><blockquote><p>“너의 가운데 <strong>모든 남자는 일 년에 세 번 곧 무교절과 칠칠절과 초막절에</strong> 네 하나님 여호와께서 택하신 곳에서 여호와를 뵈옵되 빈손으로 여호와를 뵈옵지 말고” (<a href="https://bibleox.com/ko/ko-nkrv/vtor/16/#L16">신 16:16</a>)</p></blockquote><h3>그리스도께서는 율법을 지키셨습니다</h3><blockquote><p>“내가 율법이나 선지자를 폐하러 온 줄로 생각하지 말라 <strong>폐하러 온 것이 아니요 완전하게 하려 함이라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/5/#L17">마 5:17</a>)</p></blockquote><blockquote><p>“예수께서 대답하여 이르시되 이제 허락하라 <strong>우리가 이와 같이 하여 모든 의를 이루는 것이 합당하니라</strong> 하시니 이에 요한이 허락하는지라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/3/#L15">마 3:15</a>)</p></blockquote><blockquote><p>“<strong>인자는 자기에 대하여 기록된 대로 가거니와</strong> 인자를 파는 그 사람에게는 화가 있으리로다 그 사람은 차라리 태어나지 아니하였더라면 제게 좋을 뻔하였느니라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/26/#L24">마 26:24</a>; <a href="https://bibleox.com/ko/ko-nkrv/mk/14/#L21">막 14:21</a>)</p></blockquote><blockquote><p>“또 이르시되 내가 너희와 함께 있을 때에 너희에게 말한 바 곧 <strong>모세의 율법과 선지자의 글과 시편에 나를 가리켜 기록된 모든 것이 이루어져야 하리라</strong> 한 말이 이것이라 하시고” (<a href="https://bibleox.com/ko/ko-nkrv/lk/24/#L44">눅 24:44</a>)</p></blockquote><blockquote><p>“때가 차매 하나님이 그 아들을 보내사 <strong>여자에게서 나게 하시고 율법 아래에 나게 하신 것은</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gal/4/#L4">갈 4:4</a>)</p></blockquote><h3>전도할 나이를 기다리심</h3><p>그리스도께서는 서른 살까지 전도와 기적을 삼가셨습니다. 공적 봉사는 하느님의 규정과 확립된 전통에 따라 서른 살에 시작되었기 때문입니다(<a href="https://bibleox.com/ko/ko-nkrv/chis/4/#L3">민 4:3</a>). 그러므로 율법을 없애러 오신 것이 아니라 완성하러 오신 그리스도께서는(<a href="https://bibleox.com/ko/ko-nkrv/mf/5/#L17">마 5:17</a>) 서른 살까지 기다리신 뒤 전도에 나서셨습니다:</p><blockquote><p>“예수께서 <strong>가르치심을 시작하실 때에 삼십 세쯤 되시니라</strong> 사람들이 아는 대로는 요셉의 아들이니 요셉의 위는 헬리요” (<a href="https://bibleox.com/ko/ko-nkrv/lk/3/#L23">눅 3:23</a>)</p></blockquote><p>그리스도께서는 당신의 때가 오기를 기다리셨습니다:</p><blockquote><p>“예수께서 이르시되 여자여 나와 무슨 상관이 있나이까 <strong>내 때가 아직 이르지 아니하였나이다</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/in/2/#L4">요 2:4</a>)</p></blockquote><blockquote><p>“그들이 예수를 잡고자 하나 손을 대는 자가 없으니 이는 <strong>그의 때가 아직 이르지 아니하였음이러라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/in/7/#L30">요 7:30</a>)</p></blockquote><blockquote><p>“이 말씀은 성전에서 가르치실 때에 헌금함 앞에서 하셨으나 잡는 사람이 없으니 이는 <strong>그의 때가 아직 이르지 아니하였음이러라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/in/8/#L20">요 8:20</a>)</p></blockquote><blockquote><p>“예수께서 이르시되 <strong>내 때는 아직 이르지 아니하였거니와</strong> 너희 때는 늘 준비되어 있느니라” (<a href="https://bibleox.com/ko/ko-nkrv/in/7/#L6">요 7:6</a>)</p></blockquote><blockquote><p>“너희는 명절에 올라가라 <strong>내 때가 아직 차지 못하였으니</strong> 나는 이 명절에 아직 올라가지 아니하노라” (<a href="https://bibleox.com/ko/ko-nkrv/in/7/#L8">요 7:8</a>)</p></blockquote><blockquote><p>“나는 받을 세례가 있으니 <strong>그것이 이루어지기까지 나의 답답함이 어떠하겠느냐</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/lk/12/#L50">눅 12:50</a>)</p></blockquote><blockquote><p>“예수께서 이 말씀을 하시고 눈을 들어 하늘을 우러러 이르시되 <strong>아버지여 때가 이르렀사오니</strong> 아들을 영화롭게 하사 아들로 아버지를 영화롭게 하게 하옵소서” (<a href="https://bibleox.com/ko/ko-nkrv/in/17/#L1">요 17:1</a>)</p></blockquote>'
