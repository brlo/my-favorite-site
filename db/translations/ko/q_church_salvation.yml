  title: 구원
  copy_cover: true
  body: '<h2>구원이란 무엇인가</h2><p>구원은 하느님과 함께하는 영원한 생명, 죽음에서 건져짐, 새로운(변모된) 삶입니다.</p><h3>하느님과 함께하는 영원한 생명</h3><blockquote><p>“만일 네 손이나 네 발이 너를 범죄하게 하거든 찍어 내버리라 장애인이나 다리 저는 자로 <strong>영생에 들어가는 것이</strong> 두 손과 두 발을 가지고 영원한 불에 던져지는 것보다 나으니라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/18/#L8">마 18:8</a>)</p></blockquote><blockquote><p>“예수께서 이르시되 어찌하여 선한 일을 내게 묻느냐 선한 이는 오직 한 분이시니라 <strong>네가 생명에 들어 가려면</strong> 계명들을 지키라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/19/#L17">마 19:17</a>)</p></blockquote><h3>신화(神化, 테오시스)</h3><blockquote><p>“<strong>그의 신기한 능력으로</strong> 생명과 경건에 속한 모든 것을 우리에게 주셨으니 이는 자기의 영광과 덕으로써 우리를 부르신 이를 앎으로 말미암음이라 이로써 그 보배롭고 지극히 큰 약속을 우리에게 주사 이 약속으로 말미암아 너희가 정욕 때문에 세상에서 썩어질 것을 피하여 <strong><mark>신성한 성품에 참여하는 자가 되게 하려 하셨느니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2pet/1/#L3-4">벧후 1:3-4</a>)</p></blockquote><blockquote><p>“그는 만물을 자기에게 복종하게 하실 수 있는 자의 역사로 <strong><mark>우리의 낮은 몸을 자기 영광의 몸의 형체와 같이 변하게 하시리라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/fil/3/#L21">빌 3:21</a>)</p></blockquote><p><a href="https://bibleox.com/ko/ko-nkrv/in/17/#L21-23">요 17:21-23</a>; <a href="https://bibleox.com/ko/ko-nkrv/1in/3/#L2">요일 3:2</a>; <a href="https://bibleox.com/ko/ko-nkrv/ps/82/#L6">시 82:6</a>; <a href="https://bibleox.com/ko/ko-nkrv/gal/2/#L20">갈 2:20</a>; <a href="https://bibleox.com/ko/ko-nkrv/rim/8/#L14,16">롬 8:14,16</a></p><h2>구원의 조건</h2><h3>그리스도에 대한 올바른 믿음</h3><blockquote><p>“너희와 모든 이스라엘 백성들은 알라 너희가 십자가에 못 박고 하나님이 죽은 자 가운데서 살리신 <strong>나사렛 예수 그리스도의 이름으로</strong> 이 사람이 건강하게 되어 너희 앞에 섰느니라 이 예수는 너희 건축자들의 버린 돌로서 집 모퉁이의 머릿돌이 되었느니라 <strong>다른 이로써는 구원을 받을 수 없나니</strong> <strong>천하 사람 중에 구원을 받을 만한 다른 이름을 우리에게 주신 일이 없음이라</strong> 하였더라” (<a href="https://bibleox.com/ko/ko-nkrv/act/4/#L10-12">행 4:10-12</a>)</p></blockquote><blockquote><p>“<strong>믿음이 없이는 하나님을 기쁘시게 하지 못하나니</strong> 하나님께 나아가는 자는 반드시 그가 계신 것과 또한 그가 자기를 찾는 자들에게 상 주시는 이심을 믿어야 할지니라” (<a href="https://bibleox.com/ko/ko-nkrv/evr/11/#L6">히 11:6</a>)</p></blockquote><blockquote><p>“<strong><mark>지나쳐 그리스도의 교훈 안에 거하지 아니하는 자는 다 하나님을 모시지 못하되</mark></strong> <strong>교훈 안에 거하는</strong> 그 사람은 아버지와 아들을 모시느니라” (<a href="https://bibleox.com/ko/ko-nkrv/2in/1/#L9">요이 1:9</a>)</p></blockquote><blockquote><p>“<strong>육체의 일은</strong> 분명하니 곧 음행과 더러운 것과 호색과 우상 숭배와 주술과 원수 맺는 것과 분쟁과 시기와 분냄과 당 짓는 것과 분열함과 <strong><mark>이단과</mark></strong> 투기와 술 취함과 방탕함과 또 그와 같은 것들이라 전에 너희에게 경계한 것 같이 경계하노니 <strong><mark>이런 일을 하는 자들은 하나님의 나라를 유업으로 받지 못할 것이요</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gal/5/#L19-21">갈 5:19-21</a>)</p></blockquote><h3>믿음의 행위</h3><h4>계명을 지킴</h4><blockquote><p>“예수께서 이르시되 어찌하여 선한 일을 내게 묻느냐 선한 이는 오직 한 분이시니라 네가 생명에 들어 가려면 <strong><mark>계명들을 지키라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/19/#L17">마 19:17</a>)</p></blockquote><blockquote><p>“그러므로 누구든지 <strong><mark>나의 이 말을 듣고 행하는 자는</mark></strong> 그 집을 반석 위에 지은 지혜로운 사람 같으리니” (<a href="https://bibleox.com/ko/ko-nkrv/mf/7/#L24">마 7:24</a>)</p></blockquote><blockquote><p>“내게 나아와 <strong><mark>내 말을 듣고 행하는 자마다</mark></strong> 누구와 같은 것을 너희에게 보이리라 집을 짓되 깊이 파고 주추를 반석 위에 놓은 사람과 같으니 큰 물이 나서 탁류가 그 집에 부딪치되 잘 지었기 때문에 능히 요동하지 못하게 하였거니와 <strong><mark>듣고 행하지 아니하는 자는 주추 없이 흙 위에 집 지은 사람과 같으니</mark></strong> 탁류가 부딪치매 <strong>집이 곧 무너져</strong> 파괴됨이 심하니라 하시니라” (<a href="https://bibleox.com/ko/ko-nkrv/lk/6/#L47-49">눅 6:47-49</a>)</p></blockquote><blockquote><p>“너희는 <strong><mark>말씀을 행하는 자가 되고</mark></strong> 듣기만 하여 자신을 속이는 자가 되지 말라 누구든지 말씀을 듣고 행하지 아니하면 그는 거울로 자기의 생긴 얼굴을 보는 사람과 같아서” (<a href="https://bibleox.com/ko/ko-nkrv/iak/1/#L22-23">약 1:22-23</a>)</p></blockquote><h4>교회 안에서 사는 삶이 꼭 필요합니다</h4><blockquote><p>“이는 남편이 아내의 머리 됨이 그리스도께서 교회의 머리 됨과 같음이니 <strong><mark>그가 바로 몸의 구주시니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ef/5/#L23">엡 5:23</a>)</p></blockquote><blockquote><p>“나는 이제 너희를 위하여 받는 괴로움을 기뻐하고 그리스도의 남은 고난을 <strong><mark>그의 몸된 교회</mark></strong>를 위하여 내 육체에 채우노라” (<a href="https://bibleox.com/ko/ko-nkrv/kol/1/#L24">골 1:24</a>)</p></blockquote><blockquote><p>“우리가 유대인이나 헬라인이나 종이나 자유인이나 <strong><mark>다 한 성령으로 세례를 받아 한 몸이 되었고</mark></strong> 또 다 한 성령을 마시게 하셨느니라” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/12/#L13">고전 12:13</a>)</p></blockquote><blockquote><p>“누구든지 <strong><mark>그리스도와 합하기 위하여 세례를 받은 자는 그리스도로 옷 입었느니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gal/3/#L27">갈 3:27</a>)</p></blockquote><blockquote><p>“하나님을 찬미하며 또 온 백성에게 칭송을 받으니 <strong><mark>주께서 구원 받는 사람을 날마다 더하게 하시니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/act/2/#L47">행 2:47</a>) <em>(비잔틴 본문(다수 사본): “주께서 구원받는 사람들을 날마다 교회에 더하게 하셨다”)</em></p></blockquote><h4>세례</h4><p>세례는 “위로부터 남”이라고도 합니다:</p><blockquote><p>“예수께서 대답하시되 진실로 진실로 네게 이르노니 <strong><mark>사람이 물과 성령으로 나지 아니하면</mark></strong> <strong>하나님의 나라에 들어갈 수 없느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/in/3/#L5">요 3:5</a>)</p></blockquote><p>자세히: <a href="https://bibleox.com/ru/ru/w/крещение">세례</a></p><h4>그리스도의 살과 피를 모심</h4><blockquote><p>“예수께서 이르시되 내가 진실로 진실로 너희에게 이르노니 <strong><mark>인자의 살을 먹지 아니하고 인자의 피를 마시지 아니하면 너희 속에 생명이 없느니라</mark></strong> 내 살을 먹고 내 피를 마시는 자는 영생을 가졌고 <strong>마지막 날에 내가 그를 다시 살리리니</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/in/6/#L53-54">요 6:53-54</a>)</p></blockquote><p>자세히: <a href="https://bibleox.com/ru/ru/w/Евхаристия">성체성혈성사</a></p><h2>믿음만이 아니라 행위도 구원에 필요합니다</h2><h3>행위 없는 믿음은 구원하지 못합니다</h3><blockquote><p>“내 형제들아 영광의 주 곧 우리 주 예수 그리스도에 대한 믿음을 너희가 가졌으니 사람을 차별하여 대하지 말라 &lt;…&gt; 내 형제들아 <strong><mark>만일 사람이 믿음이 있노라 하고 행함이 없으면 무슨 유익이 있으리요 그 믿음이 능히 자기를 구원하겠느냐</mark></strong> 만일 형제나 자매가 헐벗고 일용할 양식이 없는데 너희 중에 누구든지 그에게 이르되 평안히 가라, 덥게 하라, 배부르게 하라 하며 그 몸에 쓸 것을 주지 아니하면 무슨 유익이 있으리요 이와 같이 <strong><mark>행함이 없는 믿음은 그 자체가 죽은 것이라</mark></strong> 어떤 사람은 말하기를 너는 믿음이 있고 나는 행함이 있으니 행함이 없는 네 믿음을 내게 보이라 나는 행함으로 내 믿음을 네게 보이리라 하리라 네가 하나님은 한 분이신 줄을 믿느냐 잘하는도다 <strong>귀신들도 믿고 떠느니라</strong> 아아 허탄한 사람아 <strong><mark>행함이 없는 믿음이 헛것인 줄을</mark></strong> 알고자 하느냐” (<a href="https://bibleox.com/ko/ko-nkrv/iak/2/#L1,14-20">약 2:1,14-20</a>) <em>(20절의 “헛것”은 비잔틴 본문(다수 사본)에서 νεκρά, 곧 “죽은 것”입니다.)</em></p></blockquote><h3>불법을 행하는 많은 이가 멸망합니다. 그들은 믿었을 뿐 아니라 그리스도의 이름으로 기적까지 행했습니다</h3><blockquote><p>“그 날에 <strong>많은 사람이</strong> 나더러 이르되 주여 주여 우리가 주의 이름으로 <strong>선지자 노릇 하며</strong> 주의 이름으로 <strong>귀신을 쫓아 내며</strong> 주의 이름으로 <strong>많은 권능을 행하지</strong> 아니하였나이까 하리니 그 때에 내가 그들에게 밝히 말하되 <strong><mark>내가 너희를 도무지 알지 못하니</mark></strong> <strong><mark>불법을 행하는 자들아 내게서 떠나가라</mark></strong> 하리라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/7/#L22-23">마 7:22-23</a>)</p></blockquote><h3>심판은 행위에 따라 이루어집니다</h3><blockquote><p>“인자가 아버지의 영광으로 그 천사들과 함께 오리니 그 때에 <strong><mark>각 사람이 행한 대로 갚으리라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/16/#L27">마 16:27</a>)</p></blockquote><blockquote><p>“이는 <strong><mark>우리가 다 반드시</mark></strong> <strong>그리스도의 심판대 앞에 나타나게 되어</strong> <strong><mark>각각 선악간에 그 몸으로 행한 것을 따라 받으려 함이라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2kor/5/#L10">고후 5:10</a>)</p></blockquote><blockquote><p>“기쁜 마음으로 섬기기를 주께 하듯 하고 사람들에게 하듯 하지 말라 이는 <strong><mark>각 사람이 무슨 선을 행하든지 종이나 자유인이나 주께로부터 그대로 받을 줄을 앎이라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ef/6/#L7-8">엡 6:7-8</a>)</p></blockquote><blockquote><p>“주여 인자함은 주께 속하오니 <strong><mark>주께서 각 사람이 행한 대로 갚으심이니이다</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ps/62/#L12">시 62:12</a>)</p></blockquote><blockquote><p>“<strong><mark>하나님께서 각 사람에게 그 행한 대로 보응하시되</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/rim/2/#L6">롬 2:6</a>)</p></blockquote><blockquote><p>“또 내가 사망으로 그의 자녀를 죽이리니 모든 교회가 나는 사람의 뜻과 마음을 살피는 자인 줄 알지라 <strong><mark>내가 너희 각 사람의 행위대로 갚아 주리라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/2/#L23">계 2:23</a>)</p></blockquote><blockquote><p>“보라 내가 속히 오리니 내가 줄 상이 내게 있어 <strong><mark>각 사람에게 그가 행한 대로 갚아 주리라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/22/#L12">계 22:12</a>)</p></blockquote><h3>믿음으로만이 아니라 행함으로 의롭다 하심을 받습니다</h3><blockquote><p>“<strong>우리 조상 아브라함이</strong> 그 아들 이삭을 제단에 바칠 때에 <strong>행함으로 의롭다 하심을 받은 것이 아니냐</strong> 네가 보거니와 믿음이 그의 행함과 함께 일하고 행함으로 믿음이 온전하게 되었느니라 이에 성경에 이른 바 아브라함이 하나님을 믿으니 이것을 의로 여기셨다는 말씀이 이루어졌고 그는 하나님의 벗이라 칭함을 받았나니 이로 보건대 <strong><mark>사람이 행함으로 의롭다 하심을 받고 믿음으로만은 아니니라</mark></strong> 또 이와 같이 <strong>기생 라합이</strong> 사자들을 접대하여 다른 길로 나가게 할 때에 행함으로 의롭다 하심을 받은 것이 아니냐 영혼 없는 몸이 죽은 것 같이 행함이 없는 믿음은 죽은 것이니라” (<a href="https://bibleox.com/ko/ko-nkrv/iak/2/#L21-26">약 2:21-26</a>)</p></blockquote><h3>참고 선을 행함으로 영생을 얻습니다</h3><blockquote><p>“다만 네 고집과 회개하지 아니한 마음을 따라 진노의 날 곧 하나님의 의로우신 심판이 나타나는 그 날에 임할 진노를 네게 쌓는도다 <strong>하나님께서 각 사람에게 그 행한 대로 보응하시되</strong> <strong><mark>참고 선을 행하여 영광과 존귀와 썩지 아니함을 구하는 자에게는 영생으로 하시고</mark></strong> 오직 당을 지어 진리를 따르지 아니하고 불의를 따르는 자에게는 진노와 분노로 하시리라” (<a href="https://bibleox.com/ko/ko-nkrv/rim/2/#L5-8">롬 2:5-8</a>)</p></blockquote><h3>영생을 얻으려면 선한 일에 부유해야 합니다</h3><blockquote><p>“선을 행하고 <strong><mark>선한 사업을 많이 하고</mark></strong> 나누어 주기를 좋아하며 너그러운 자가 되게 하라 이것이 장래에 자기를 위하여 좋은 터를 쌓아 <strong><mark>참된 생명을 취하는 것이니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1tim/6/#L18-19">딤전 6:18-19</a>) <em>(비잔틴 본문(다수 사본): “<strong>영생을</strong> 취하는”(τῆς αἰωνίου ζωῆς))</em></p></blockquote><h3>선한 일을 위하여 지음받았습니다</h3><p>행위가 없다는 것은 자기에 대한 하느님의 뜻을 어기는 것입니다. 선한 행위가 없으면 사람은 자기의 사명, 곧 자기가 지음받은 목적을 이루지 못합니다:</p><blockquote><p>“우리는 그가 만드신 바라 <strong><mark>그리스도 예수 안에서 선한 일을 위하여 지으심을 받은 자니</mark></strong> 이 일은 하나님이 전에 예비하사 우리로 그 가운데서 행하게 하려 하심이니라” (<a href="https://bibleox.com/ko/ko-nkrv/ef/2/#L10">엡 2:10</a>)</p></blockquote><h3>고난을 참으며 그리스도를 따를 때 하느님 나라를 유업으로 받습니다</h3><blockquote><p>“자녀이면 또한 <strong><mark>상속자</mark></strong> 곧 하나님의 상속자요 그리스도와 함께 한 상속자니 <strong><mark>우리가 그와 함께 영광을 받기 위하여 고난도 함께 받아야 할 것이니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/rim/8/#L17">롬 8:17</a>) <em>(그리스어는 조건문입니다: εἴπερ συμπάσχομεν, “<strong>만일</strong> 우리가 그와 함께 고난을 받으면”.)</em></p></blockquote><h3>사도는 복음 전파(행위)가 자기 구원에 도움이 되리라는 것을 압니다</h3><blockquote><p>“이것이 너희의 간구와 예수 그리스도의 성령의 도우심으로 <strong>나를 구원에 이르게 할 줄</strong> 아는 고로” (<a href="https://bibleox.com/ko/ko-nkrv/fil/1/#L19">빌 1:19</a>)</p></blockquote><h3>그리스도인의 의는 서기관과 바리새인의 의보다 나아야 합니다</h3><blockquote><p>“내가 너희에게 이르노니 <strong><mark>너희 의가 서기관과 바리새인보다 더 낫지 못하면</mark></strong> <strong><mark>결코 천국에 들어가지 못하리라</mark></strong> &lt;…&gt; 나는 너희에게 이르노니 형제에게 노하는 자마다 심판을 받게 되고 형제를 대하여 라가라 하는 자는 공회에 잡혀가게 되고 미련한 놈이라 하는 자는 지옥 불에 들어가게 되리라 &lt;…&gt; 나는 너희에게 이르노니 음욕을 품고 여자를 보는 자마다 마음에 이미 간음하였느니라 &lt;…&gt; 나는 너희에게 이르노니 도무지 맹세하지 말지니 하늘로도 하지 말라 이는 하나님의 보좌임이요 &lt;…&gt; 나는 너희에게 이르노니 악한 자를 대적하지 말라 누구든지 네 오른편 뺨을 치거든 왼편도 돌려 대며 &lt;…&gt; 나는 너희에게 이르노니 너희 원수를 사랑하며 너희를 박해하는 자를 위하여 기도하라 &lt;…&gt; 그러므로 하늘에 계신 너희 아버지의 온전하심과 같이 너희도 온전하라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/5/#L20,22,28,34,39,44,48">마 5:20,22,28,34,39,44,48</a>)</p></blockquote><p>서기관과 바리새인은 말만 하고 행하지 않습니다:</p><blockquote><p>“<strong><mark>서기관들과 바리새인들이</mark></strong> 모세의 자리에 앉았으니 그러므로 무엇이든지 그들이 말하는 바는 행하고 지키되 그들이 하는 행위는 본받지 말라 <strong><mark>그들은 말만 하고 행하지 아니하며</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/23/#L2-3">마 23:2-3</a>)</p></blockquote><p>*믿음은 행위가 있을 때 의로 여겨집니다. 사람은 믿음으로만이 아니라 행위로도 의롭다 하심을 받습니다(<a href="https://bibleox.com/ko/ko-nkrv/iak/2/#L21-24">약 2:21-24</a>).</p><h3>의를 행하는 사람이 의롭습니다</h3><blockquote><p>“자녀들아 아무도 너희를 미혹하지 못하게 하라 <strong><mark>의를 행하는 자는 그의 의로우심과 같이 의롭고</mark></strong> <strong>죄를 짓는 자는 마귀에게 속하나니</strong> 마귀는 처음부터 범죄함이라 하나님의 아들이 나타나신 것은 마귀의 일을 멸하려 하심이라” (<a href="https://bibleox.com/ko/ko-nkrv/1in/3/#L7-8">요일 3:7-8</a>)</p></blockquote><h3>의인도 겨우 구원받습니다</h3><p>의인은 하느님의 의를 따라 행하는 사람입니다(<a href="https://bibleox.com/ko/ko-nkrv/iez/33/#L13-16">겔 33:13-16</a>). 죄인은 하느님의 의를 거슬러 행하는 사람, 곧 죄를 짓는 사람입니다. 의인도 겨우 구원받습니다. 그렇다면 죄인은 아예 구원받지 못합니다:</p><blockquote><p>“또 <strong><mark>의인이 겨우 구원을 받으면</mark></strong> 경건하지 아니한 자와 죄인은 어디에 서리요” (<a href="https://bibleox.com/ko/ko-nkrv/1pet/4/#L18">벧전 4:18</a>)</p></blockquote><h3>하느님을 안다고 말하면서 행위로는 그분을 부인할 수 있습니다</h3><blockquote><p>“너희는 나를 불러 주여 주여 하면서도 어찌하여 <strong><mark>내가 말하는 것을 행하지 아니하느냐</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/lk/6/#L46">눅 6:46</a>)</p></blockquote><blockquote><p>“그들이 <strong><mark>하나님을 시인하나 행위로는 부인하니</mark></strong> 가증한 자요 복종하지 아니하는 자요 모든 선한 일을 버리는 자니라” (<a href="https://bibleox.com/ko/ko-nkrv/tit/1/#L16">딛 1:16</a>)</p></blockquote><p>하느님께서 기뻐하시지 않는 행위 가운데에는 이단(<a href="https://bibleox.com/ko/ko-nkrv/gal/5/#L20">갈 5:20</a>)과 믿는 이들 사이에 분열을 일으키는 일(<a href="https://bibleox.com/ko/ko-nkrv/in/17/#L20-21">요 17:20-21</a>; <a href="https://bibleox.com/ko/ko-nkrv/1kor/1/#L10">고전 1:10</a>)이 있습니다.</p><h3>죄인을 미혹된 길에서 돌아서게 하는 일은 허다한 죄를 덮습니다</h3><p>참된 신자가 이웃을 미혹에서 돌아서게 하면, 그 일로 허다한 죄를 덮게 됩니다. 만일 구원이 믿음만으로 얻어진다면, 이웃을 돌아서게 한 일은 그 이웃에게만 도움이 될 뿐 돌아서게 한 사람에게는 아무것도 주지 못하고 그의 죄를 덮지도 못할 것입니다(이미 믿음으로 구원받았다면 무엇 하러 죄를 덮겠습니까?):</p><blockquote><p>“내 형제들아 너희 중에 <strong>미혹되어 진리를 떠난 자를</strong> 누가 돌아서게 하면 너희가 알 것은 <strong><mark>죄인을 미혹된 길에서 돌아서게 하는 자가 그의 영혼을 사망에서 구원할 것이며 허다한 죄를 덮을 것임이라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/iak/5/#L19-20">약 5:19-20</a>)</p></blockquote><h3>하느님의 안식에 들어가기를 힘쓰라는 부르심</h3><p>곧 힘쓰지 않으면 믿는 이들도 들어가지 못할 수 있습니다:</p><blockquote><p>“그러므로 우리가 <strong><mark>저 안식에 들어가기를 힘쓸지니</mark></strong> 이는 누구든지 저 순종하지 아니하는 본에 빠지지 않게 하려 함이라” (<a href="https://bibleox.com/ko/ko-nkrv/evr/4/#L11">히 4:11</a>)</p></blockquote><h3>덕과 영원한 나라에 들어감</h3><p>믿는 이가 덕을 갖추면 열매 없는 사람으로 남지 않습니다. 덕에 굳게 서면 하느님 나라에 넉넉히 들어가게 됩니다. 그러나 덕이 없는 사람은 맹인입니다:</p><blockquote><p>“그러므로 너희가 더욱 힘써 <strong><mark>너희 믿음에 덕을</mark></strong>, 덕에 <strong>지식을</strong>, 지식에 <strong>절제를</strong>, 절제에 <strong>인내를</strong>, 인내에 <strong>경건을</strong>, 경건에 <strong>형제 우애를</strong>, 형제 우애에 <strong>사랑을</strong> 더하라 <strong><mark>이런 것이 너희에게 있어 흡족한즉 너희로 우리 주 예수 그리스도를 알기에 게으르지 않고 열매 없는 자가 되지 않게 하려니와</mark></strong> <strong>이런 것이 없는 자는 맹인이라 멀리 보지 못하고 그의 옛 죄가 깨끗하게 된 것을 잊었느니라</strong> 그러므로 형제들아 <strong><mark>더욱 힘써 너희 부르심과 택하심을 굳게 하라</mark></strong> 너희가 이것을 <strong>행한즉</strong> 언제든지 실족하지 아니하리라 이같이 하면 <strong><mark>우리 주 곧 구주 예수 그리스도의 영원한 나라에 들어감을 넉넉히 너희에게 주시리라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/2pet/1/#L5-11">벧후 1:5-11</a>)</p></blockquote><p>이처럼 행위 없는 믿음도, 믿음 없는 행위도 구원하지 못합니다.</p><h2>세례를 받은 뒤에도 믿는 이들은 여전히 죄를 지을 수 있으며 자기 안의 죄와 싸워야 합니다</h2><blockquote><p>“우리가 <strong>진리를 아는 지식을 받은 후 짐짓 죄를 범한즉</strong> 다시 속죄하는 제사가 없고” (<a href="https://bibleox.com/ko/ko-nkrv/evr/10/#L26">히 10:26</a>)</p></blockquote><blockquote><p>“<strong>만일 우리가 죄가 없다고 말하면 스스로 속이고</strong> 또 진리가 우리 속에 있지 아니할 것이요 만일 우리가 우리 죄를 자백하면 그는 미쁘시고 의로우사 우리 죄를 사하시며 우리를 모든 불의에서 깨끗하게 하실 것이요” (<a href="https://bibleox.com/ko/ko-nkrv/1in/1/#L8-9">요일 1:8-9</a>)</p></blockquote><blockquote><p>“나의 자녀들아 내가 이것을 너희에게 씀은 <strong><mark>너희로 죄를 범하지 않게 하려 함이라</mark></strong> 만일 누가 죄를 범하여도 아버지 앞에서 우리에게 대언자가 있으니 곧 의로우신 예수 그리스도시라” (<a href="https://bibleox.com/ko/ko-nkrv/1in/2/#L1">요일 2:1</a>)</p></blockquote><blockquote><p>“<strong><mark>너희 중에 싸움이 어디로부터 다툼이 어디로부터 나느냐</mark></strong> 너희 지체 중에서 싸우는 정욕으로부터 나는 것이 아니냐” (<a href="https://bibleox.com/ko/ko-nkrv/iak/4/#L1">약 4:1</a>)</p></blockquote><blockquote><p>“너희 중에 병든 자가 있느냐 그는 <strong>교회의 장로들을 청할 것이요</strong> 그들은 주의 이름으로 기름을 바르며 그를 위하여 기도할지니라 <strong>믿음의 기도는 병든 자를 구원하리니</strong> 주께서 그를 일으키시리라 <strong><mark>혹시 죄를 범하였을지라도 사하심을 받으리라</mark></strong> 그러므로 너희 죄를 서로 고백하며 <strong>병이 낫기를 위하여 서로 기도하라 의인의 간구는 역사하는 힘이 큼이니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/iak/5/#L14-16">약 5:14-16</a>)</p></blockquote><blockquote><p>“<strong><mark>깨어 의를 행하고 죄를 짓지 말라</mark></strong> <strong>하나님을 알지 못하는 자가 있기로</strong> 내가 너희를 부끄럽게 하기 위하여 말하노라” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/15/#L34">고전 15:34</a>)</p></blockquote><blockquote><p>“서로 친절하게 하며 불쌍히 여기며 <strong><mark>서로 용서하기를</mark></strong> 하나님이 그리스도 안에서 너희를 용서하심과 같이 하라” (<a href="https://bibleox.com/ko/ko-nkrv/ef/4/#L32">엡 4:32</a>)</p></blockquote><p>끝으로 주 예수 그리스도께서는 제자들에게 기도를 주시며 죄 사함을 청하라고 가르치십니다. 이것은 평생에 한 번 드리는 기도가 아닙니다. 제자들이 기도를 가르쳐 달라고 청하자 그리스도께서 이 본보기를 주셨습니다:</p><blockquote><p>“예수께서 한 곳에서 기도하시고 마치시매 제자 중 하나가 여짜오되 주여 요한이 자기 제자들에게 기도를 가르친 것과 같이 우리에게도 가르쳐 주옵소서 예수께서 이르시되 <strong><mark>너희는 기도할 때에 이렇게 하라</mark></strong> 아버지여 이름이 거룩히 여김을 받으시오며 나라가 임하시오며 우리에게 날마다 일용할 양식을 주시옵고 우리가 우리에게 죄 지은 모든 사람을 용서하오니 <strong><mark>우리 죄도 사하여 주시옵고</mark></strong> 우리를 시험에 들게 하지 마시옵소서 하라” (<a href="https://bibleox.com/ko/ko-nkrv/lk/11/#L1-4">눅 11:1-4</a>; <a href="https://bibleox.com/ko/ko-nkrv/mf/6/#L7-13">마 6:7-13</a>)</p></blockquote><h2>구원은 한 번의 행위가 아니라 평생의 과정입니다</h2><p>구원을 이루어야 합니다(그리스어 κατεργάζεσθε — 이루다, 행하다, 만들어 내다, 성취하다, 완수하다, 굴복시키다, 정복하다):</p><blockquote><p>“그러므로 나의 사랑하는 자들아 너희가 나 있을 때뿐 아니라 더욱 지금 나 없을 때에도 항상 복종하여 <strong>두렵고 떨림으로 너희 구원을 이루라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/fil/2/#L12">빌 2:12</a>)</p></blockquote><p>사도는 세례받은 그리스도인들 속에 그리스도의 형상이 이루어지기까지 해산하는 수고를 합니다. 곧 그리스도께서는 그들 안에 저절로, 한순간에 형성되지 않았습니다:</p><blockquote><p>“나의 자녀들아 <strong>너희 속에 그리스도의 형상을 이루기까지 다시 너희를 위하여 해산하는 수고를 하노니</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gal/4/#L19">갈 4:19</a>)</p></blockquote><blockquote><p>“나는 선한 싸움을 싸우고 <strong>나의 달려갈 길을 마치고</strong> 믿음을 지켰으니” (<a href="https://bibleox.com/ko/ko-nkrv/2tim/4/#L7">딤후 4:7</a>)</p></blockquote><p>구원은 약속되었을 뿐 아직 받은 것이 아닙니다(“구원을 받았다”가 아니라 “구원을 얻으리라”):</p><blockquote><p>“또 너희가 내 이름으로 말미암아 모든 사람에게 미움을 받을 것이나 <strong><mark>끝까지 견디는 자는 구원을 얻으리라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/10/#L22">마 10:22</a>; <a href="https://bibleox.com/ko/ko-nkrv/mf/24/#L13">마 24:13</a>)</p></blockquote><blockquote><p>“너는 장차 받을 고난을 두려워하지 말라 볼지어다 마귀가 장차 너희 가운데에서 몇 사람을 옥에 던져 시험을 받게 하리니 너희가 십 일 동안 환난을 받으리라 <strong><mark>네가 죽도록 충성하라 그리하면 내가 생명의 관을 네게 주리라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/2/#L10">계 2:10</a>)</p></blockquote><p>사도는 자기를 판단하지 않습니다. 하느님을 거스른 일을 스스로 알지 못하지만 그것으로 자기를 의롭다 하지 않고 하느님의 심판을 기다립니다:</p><blockquote><p>“사람이 마땅히 <strong>우리를</strong> 그리스도의 일꾼이요 <strong>하나님의 비밀을 맡은 자로 여길지어다</strong> 그리고 <strong><mark>맡은 자들에게 구할 것은 충성이니라</mark></strong> 너희에게나 다른 사람에게나 판단 받는 것이 내게는 매우 작은 일이라 <strong><mark>나도 나를 판단하지 아니하노니</mark></strong> 내가 자책할 아무 것도 깨닫지 못하나 이로 말미암아 의롭다 함을 얻지 못하노라 <strong><mark>다만 나를 심판하실 이는 주시니라</mark></strong> 그러므로 <strong>때가 이르기 전 곧 주께서 오시기까지 아무 것도 판단하지 말라</strong> 그가 어둠에 감추인 것들을 드러내고 마음의 뜻을 나타내시리니 그 때에 각 사람에게 하나님으로부터 칭찬이 있으리라” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/4/#L1-5">고전 4:1-5</a>)</p></blockquote><h3>그리스도인의 완전함에 이르는 길</h3><p>사도는 모든 그리스도인과 마찬가지로 썩지 않을 관을 얻으려고 달음질하고 수고하며, 자신이 버림받지 않을까 두려워합니다:</p><blockquote><p>“이기기를 다투는 자마다 모든 일에 절제하나니 그들은 썩을 승리자의 <strong>관을 얻고자 하되</strong> 우리는 <strong>썩지 아니할 것을 얻고자 하노라</strong> <strong>그러므로 나는 달음질하기를</strong> 향방 없는 것 같이 아니하고 싸우기를 허공을 치는 것 같이 아니하며 내가 <strong>내 몸을 쳐 복종하게 함은</strong> 내가 남에게 전파한 후에 <strong><mark>자신이 도리어 버림을 당할까 두려워함이로다</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/9/#L25-27">고전 9:25-27</a>)</p></blockquote><blockquote><p>“<strong>내가 이미 얻었다 함도 아니요 온전히 이루었다 함도 아니라</strong> <strong>오직 내가 그리스도 예수께 잡힌 바 된 그것을 잡으려고 달려가노라</strong> 형제들아 <strong>나는 아직 내가 잡은 줄로 여기지 아니하고</strong> 오직 한 일 즉 뒤에 있는 것은 잊어버리고 앞에 있는 것을 잡으려고 <strong>푯대를 향하여</strong> 그리스도 예수 안에서 하나님이 위에서 부르신 부름의 상을 위하여 달려가노라” (<a href="https://bibleox.com/ko/ko-nkrv/fil/3/#L12-14">빌 3:12-14</a>)</p></blockquote><h3>구원받는 이들과 망하는 이들</h3><p>구원받는 이들이 아직 구원받은 것이 아니듯, 망하는 이들도 아직 망한 것이 아닙니다. 둘 다 길 위에 있으며 둘 다 길을 바꿀 수 있습니다. 구원받는 이도 멸망에 이를 수 있고, 망하는 이도 구원에 이를 수 있습니다:</p><blockquote><p>“우리는 <strong><mark>구원 받는 자들에게나</mark></strong> <strong><mark>망하는 자들에게나</mark></strong> 하나님 앞에서 그리스도의 향기니” (<a href="https://bibleox.com/ko/ko-nkrv/2kor/2/#L15">고후 2:15</a>)</p></blockquote><p>많은 이가 하늘 나라에 이르려고 애쓰지만 이르지 못할 것입니다:</p><blockquote><p>“<strong>좁은 문으로 들어가기를 힘쓰라</strong> 내가 너희에게 이르노니 <strong><mark>들어가기를 구하여도 못하는 자가 많으리라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/lk/13/#L24">눅 13:24</a>; <a href="https://bibleox.com/ko/ko-nkrv/mf/7/#L14">마 7:14</a>; <a href="https://bibleox.com/ko/ko-nkrv/mf/7/#L13">마 7:13</a>)</p></blockquote><p>믿는 이들 가운데 많은 이뿐 아니라 그리스도의 이름으로 기적을 행하는 이들조차 하늘 나라에 이르지 못합니다:</p><blockquote><p>“그 날에 <strong>많은 사람이</strong> 나더러 이르되 주여 주여 우리가 주의 이름으로 <strong>선지자 노릇 하며</strong> 주의 이름으로 <strong>귀신을 쫓아 내며</strong> 주의 이름으로 <strong>많은 권능을 행하지</strong> 아니하였나이까 하리니 그 때에 내가 그들에게 밝히 말하되 <strong>내가 너희를 도무지 알지 못하니</strong> 불법을 행하는 자들아 <strong>내게서 떠나가라</strong> 하리라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/7/#L22-23">마 7:22-23</a>)</p></blockquote><h2>그리스도는 모든 이의 심판자이십니다</h2><h3>모든 이가 심판을 받습니다</h3><blockquote><p>“이는 <strong><mark>우리가 다 반드시 그리스도의 심판대 앞에 나타나게 되어</mark></strong> 각각 <strong>선악간에</strong> <strong>그 몸으로 행한 것을</strong> 따라 받으려 함이라” (<a href="https://bibleox.com/ko/ko-nkrv/2kor/5/#L10">고후 5:10</a>)</p></blockquote><blockquote><p>“네가 어찌하여 네 형제를 비판하느냐 어찌하여 네 형제를 업신여기느냐 <strong><mark>우리가 다 하나님의 심판대 앞에 서리라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/rim/14/#L10">롬 14:10</a>) <em>(비잔틴 본문(다수 사본): “그리스도의 심판대”)</em></p></blockquote><blockquote><p>“너희는 자유의 율법대로 <strong><mark>심판 받을 자처럼</mark></strong> 말도 하고 행하기도 하라” (<a href="https://bibleox.com/ko/ko-nkrv/iak/2/#L12">약 2:12</a>)</p></blockquote><blockquote><p>“<strong><mark>하나님은 모든 행위와 모든 은밀한 일을</mark></strong> <strong>선악 간에 심판하시리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ekl/12/#L14">전 12:14</a>)</p></blockquote><blockquote><p>“<strong>인자가</strong> 자기 영광으로 모든 천사와 함께 올 때에 <strong>자기 영광의 보좌에 앉으리니</strong> <strong><mark>모든 민족을 그 앞에 모으고</mark></strong> <strong><mark>각각 구분하기를</mark></strong> <strong><mark>목자가 양과 염소를 구분하는 것 같이</mark></strong> 하여” (<a href="https://bibleox.com/ko/ko-nkrv/mf/25/#L31-32">마 25:31-32</a>)</p></blockquote><h3>심판은 교회에서 시작됩니다</h3><blockquote><p>“<strong><mark>하나님의 집에서 심판을 시작할 때가 되었나니</mark></strong> <strong><mark>만일 우리에게 먼저 하면</mark></strong> 하나님의 복음을 순종하지 아니하는 자들의 그 마지막은 어떠하며 또 <strong>의인이 겨우 구원을 받으면</strong> 경건하지 아니한 자와 죄인은 어디에 서리요” (<a href="https://bibleox.com/ko/ko-nkrv/1pet/4/#L17-18">벧전 4:17-18</a>)</p></blockquote><blockquote><p>“<strong><mark>너희에게나 다른 사람에게나 판단 받는 것이 내게는 매우 작은 일이라 나도 나를 판단하지 아니하노니</mark></strong> 내가 자책할 아무 것도 깨닫지 못하나 <strong><mark>이로 말미암아 의롭다 함을 얻지 못하노라 다만 나를 심판하실 이는 주시니라</mark></strong> 그러므로 때가 이르기 전 곧 주께서 오시기까지 <strong>아무 것도 판단하지 말라</strong> 그가 어둠에 감추인 것들을 드러내고 마음의 뜻을 나타내시리니 그 때에 각 사람에게 하나님으로부터 칭찬이 있으리라” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/4/#L3-5">고전 4:3-5</a>)</p></blockquote><h3>우리는 모두 많이 죄를 짓습니다</h3><blockquote><p>“<strong>우리가 다 실수가 많으니</strong> 만일 말에 실수가 없는 자라면 곧 온전한 사람이라 능히 온 몸도 굴레 씌우리라” (<a href="https://bibleox.com/ko/ko-nkrv/iak/3/#L2">약 3:2</a>)</p></blockquote><blockquote><p>“<strong>만일 우리가 죄가 없다고 말하면 스스로 속이고</strong> 또 진리가 우리 속에 있지 아니할 것이요 &lt;…&gt; 만일 우리가 범죄하지 아니하였다 하면 하나님을 거짓말하는 이로 만드는 것이니 또한 그의 말씀이 우리 속에 있지 아니하니라” (<a href="https://bibleox.com/ko/ko-nkrv/1in/1/#L8,10">요일 1:8,10</a>)</p></blockquote><h3>많은 이가 구원받지 못한 것을 보고 놀랄 것입니다</h3><p>그들은 자기가 구원받았다고 생각했습니다:</p><blockquote><p>“그 날에 <strong>많은 사람이</strong> 나더러 이르되 주여 주여 우리가 주의 이름으로 <strong>선지자 노릇 하며</strong> 주의 이름으로 <strong>귀신을 쫓아 내며</strong> 주의 이름으로 <strong>많은 권능을 행하지</strong> 아니하였나이까 하리니 그 때에 내가 그들에게 밝히 말하되 <strong>내가 너희를 도무지 알지 못하니</strong> 불법을 행하는 자들아 <strong>내게서 떠나가라</strong> 하리라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/7/#L22-23">마 7:22-23</a>)</p></blockquote><h2>비판에 대한 답변</h2><h3>“믿는 자는 심판에 이르지 아니한다”</h3><blockquote><p>“내가 진실로 진실로 너희에게 이르노니 내 말을 듣고 또 나 보내신 이를 믿는 자는 영생을 얻었고 <strong>심판에 이르지 아니하나니</strong> 사망에서 생명으로 옮겼느니라” (<a href="https://bibleox.com/ko/ko-nkrv/in/5/#L24">요 5:24</a>)</p></blockquote><p>간단히 말하면, 이 말씀은 구세주의 말씀을 참으로 믿고 행하는(<a href="https://bibleox.com/ko/ko-nkrv/lk/6/#L47-49">눅 6:47-49</a>; <a href="https://bibleox.com/ko/ko-nkrv/1in/2/#L17">요일 2:17</a>) 이들이 벌을 받는 정죄에 이르지 않는다는 뜻입니다. 그러나 누가 그렇게 믿고 행하는 사람인지는 그리스도께서 친히 심판 때에 판단하실 것입니다(<a href="https://bibleox.com/ko/ko-nkrv/1kor/4/#L3-5">고전 4:3-5</a>). 위에서 보았듯이 모든 이에 대한 심판은 바로 교회에서 시작되며(<a href="https://bibleox.com/ko/ko-nkrv/1pet/4/#L17-18">벧전 4:17-18</a>), 모든 이가 심판을 받기 때문입니다.</p><p>좀 더 자세히 살펴보겠습니다.</p><p>이 구절은 성경 전체가 말하는 바에 비추어 이해해야 합니다. 성경은 구원을 위해 계명을 지키는 것도 필요하고(<a href="https://bibleox.com/ko/ko-nkrv/lk/6/#L47-49">눅 6:47-49</a>; <a href="https://bibleox.com/ko/ko-nkrv/1in/2/#L17">요일 2:17</a>), 세례도 필요하며(<a href="https://bibleox.com/ko/ko-nkrv/in/3/#L5">요 3:5</a>), 성체성혈성사도(<a href="https://bibleox.com/ko/ko-nkrv/in/6/#L53-54">요 6:53-54</a>) 그 밖에 많은 것도 필요하다고 말합니다. 어떤 구절은 보면서 다른 구절에는 눈을 감아서는 안 됩니다.</p><p>구원에 필요한 다른 것들을 빼놓을 수 없으므로, 이 말씀은 세례를 통해 교회에 들어와 성체성혈성사에 참여하며 교회(그리스도의 몸) 안에서 살고, 계명을 지키며, 하느님의 뜻을 알고 그 뜻대로 사는 신자들에 관한 것입니다. 그들이 <strong>그렇게 행한다면</strong> 정죄의 심판에 이르지 않습니다. 그러나 그런 사람이 누구일까요? 심판자이신 그리스도께서 아십니다. 그러므로 우선 모든 이가 심판에 이르며, 이는 다른 곳에서 분명히 말씀하신 바입니다.</p><p>모든 이가 심판을 받습니다:</p><blockquote><p>“이는 <strong>우리가 다 반드시 그리스도의 심판대 앞에 나타나게 되어</strong> 각각 <strong>선악간에</strong> <strong>그 몸으로 행한 것을</strong> 따라 받으려 함이라” (<a href="https://bibleox.com/ko/ko-nkrv/2kor/5/#L10">고후 5:10</a>)</p></blockquote><p>여기서는 바로 <strong>믿는 이들에 대해</strong> 말합니다:</p><blockquote><p>“네가 어찌하여 네 <strong>형제를 비판하느냐</strong> 어찌하여 네 <strong>형제를 업신여기느냐</strong> <strong>우리가 다 하나님의 심판대 앞에 서리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/rim/14/#L10">롬 14:10</a>)</p></blockquote><blockquote><p>“<strong>하나님은 모든 행위와 모든 은밀한 일을 선악 간에 심판하시리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/ekl/12/#L14">전 12:14</a>)</p></blockquote><p>모든 이가 심판받는다고만 말하는 것으로 충분하지 않습니다. 심판은 바로 교회, 곧 믿는 이들에게서 시작됩니다:</p><blockquote><p>“<strong>하나님의 집에서 심판을 시작할 때가 되었나니</strong> <strong>만일 우리에게 먼저 하면</strong> 하나님의 복음을 순종하지 아니하는 자들의 그 마지막은 어떠하며 또 의인이 겨우 구원을 받으면 경건하지 아니한 자와 죄인은 어디에 서리요” (<a href="https://bibleox.com/ko/ko-nkrv/1pet/4/#L17-18">벧전 4:17-18</a>)</p></blockquote><p>그러므로 믿고 행하는 사람(그가 누구인지는 심판자이신 그리스도께서 정하십니다)은 정죄의 심판에 이르지 않습니다.</p><p>이 <strong>많은 신자들</strong>은 분명히 자기가 구원받았으며 심판에 이르지 않으리라 생각했지만, 믿었음에도 불법을 행하는 자로 정죄받습니다:</p><blockquote><p>“그 날에 <strong>많은 사람이</strong> 나더러 이르되 <strong>주여 주여 우리가 주의 이름으로 선지자 노릇 하며</strong> 주의 이름으로 <strong>귀신을 쫓아 내며</strong> 주의 이름으로 <strong>많은 권능을 행하지</strong> 아니하였나이까 하리니 그 때에 내가 그들에게 밝히 말하되 <strong>내가 너희를 도무지 알지 못하니</strong> 불법을 행하는 자들아 <strong>내게서 떠나가라</strong> 하리라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/7/#L22-23">마 7:22-23</a>)</p></blockquote><p>이처럼 그리스도께서는 모든 이를 심판하시며, 심판 때에 그들을 서로 구분하실 것입니다:</p><blockquote><p>“<strong>인자가</strong> 자기 영광으로 모든 천사와 함께 올 때에 <strong>자기 영광의 보좌에 앉으리니</strong> <strong><mark>모든 민족을 그 앞에 모으고</mark></strong> <strong><mark>각각 구분하기를</mark></strong> <strong><mark>목자가 양과 염소를 구분하는 것 같이</mark></strong> 하여” (<a href="https://bibleox.com/ko/ko-nkrv/mf/25/#L31-32">마 25:31-32</a>)</p></blockquote><h3>“사람이 의롭게 되는 것은 율법의 행위로 말미암음이 아니요”</h3><blockquote><p>“<strong><mark>사람이 의롭게 되는 것은 율법의 행위로 말미암음이 아니요 오직 예수 그리스도를 믿음으로 말미암는 줄</mark></strong> 알므로 우리도 그리스도 예수를 믿나니 이는 우리가 <strong><mark>율법의 행위로써가 아니고</mark></strong> 그리스도를 믿음으로써 의롭다 함을 얻으려 함이라 <strong><mark>율법의 행위로써는 의롭다 함을 얻을 육체가 없느니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gal/2/#L16">갈 2:16</a>)</p></blockquote><p>여기서 말하는 것은 모세 율법의 행위이며, 그것으로는 의롭게 될 수 없습니다. 갈라디아서에서는 이것이 중심 주제이며, 그 계기는 이방인에게 할례가 필요한가 하는 논쟁이었습니다. 할례는 필요하지 않습니다. 우리는 모세 율법의 행위가 아니라 그리스도를 믿는 믿음과 그리스도를 믿는 이 믿음의 행위로 구원받기 때문입니다(<a href="#HH-믿음만이-아니라-행위도-구원에-필요합니다">행위가 필요하다는 구절들</a>을 보십시오).</p><h3>“너희는 그 은혜에 의하여 믿음으로 말미암아 구원을 받았으니”</h3><blockquote><p>“허물로 죽은 우리를 그리스도와 함께 살리셨고 (너희는 <strong>은혜로 구원을 받은 것이라</strong>) &lt;…&gt; 너희는 <strong>그 은혜에 의하여 믿음으로 말미암아 구원을 받았으니</strong> 이것은 너희에게서 난 것이 아니요 <strong>하나님의 선물이라</strong> <strong>행위에서 난 것이 아니니</strong> 이는 누구든지 자랑하지 못하게 함이라” (<a href="https://bibleox.com/ko/ko-nkrv/ef/2/#L5,8-9">엡 2:5,8-9</a>)</p></blockquote><p>여기서는 각 사람의 개인적 구원이 아니라 구원받을 <strong>가능성</strong>이 세상에 온 것(그 가능성이 열린 것)을 말합니다.</p><h4>1. 구원의 가능성이 열린 것은 선물입니다</h4><p>그리스도 이전에는 구원받을 가능성이 없었습니다. 그리스도 이후에 구원이 가능해졌고 구원의 방편이 마련되었습니다. 구원의 가능성이 나타나도록 사람은 무엇을 했습니까? 아무것도 하지 않았습니다. 인류의 죄는 늘어나기만 했습니다. 구원의 길은 사람들에게 주신 하느님의 <strong>선물</strong>로 마련되었습니다. 죄 많은 인류는 이 선물을 받을 자격이 없었습니다:</p><blockquote><p>“<strong>우리가 아직 연약할 때에 기약대로 그리스도께서 경건하지 않은 자를 위하여 죽으셨도다</strong> 의인을 위하여 죽는 자가 쉽지 않고 선인을 위하여 용감히 죽는 자가 혹 있거니와 <strong><mark>우리가 아직 죄인 되었을 때에 그리스도께서 우리를 위하여 죽으심으로 하나님께서 우리에 대한 자기의 사랑을 확증하셨느니라</mark></strong> 그러면 이제 우리가 그의 피로 말미암아 의롭다 하심을 받았으니 더욱 그로 말미암아 진노하심에서 구원을 받을 것이니” (<a href="https://bibleox.com/ko/ko-nkrv/rim/5/#L6-9">롬 5:6-9</a>)</p></blockquote><h4>2. 구원의 방편은 선물입니다</h4><p>또 구원의 길에 들어서서 구원의 방편을 받으려면 한 사람 한 사람에게 바로 믿음이 필요합니다. 그는 교회로 인도되고, 세례로 거듭나며, 견진성사로 성령의 은사를 받고, 성체성혈성사로 그리스도와 하나가 됩니다. 이 모든 것은 믿음으로 <strong>값없이 주어집니다</strong>. 사람은 이 선물을 미리 벌어들일 필요가 없습니다.</p><h4>3. 구원의 길은 하느님의 도우심으로(고전 15:10) 사람의 행위로(롬 2:5-8) 평생에 걸쳐(계 2:10) 걸어가는 것입니다</h4><p>이어서 그리스도 안에서 태어난 목적을 말합니다. 그것은 선한 일입니다:</p><blockquote><p>“우리는 그가 만드신 바라 <strong><mark>그리스도 예수 안에서 선한 일을 위하여 지으심을 받은 자니</mark></strong> 이 일은 하나님이 전에 예비하사 우리로 그 가운데서 행하게 하려 하심이니라” (<a href="https://bibleox.com/ko/ko-nkrv/ef/2/#L10">엡 2:10</a>)</p></blockquote><p>성경의 다른 곳에서 말하듯, 이 선한 일 없이는 구원받을 수 없습니다. 행함이 없는 믿음은 죽은 것이고(<a href="https://bibleox.com/ko/ko-nkrv/iak/2/#L20">약 2:20</a>), 사람은 믿음으로만이 아니라 행함으로 의롭다 하심을 받으며(<a href="https://bibleox.com/ko/ko-nkrv/iak/2/#L24">약 2:24</a>), 모든 이가 심판을 받고(<a href="https://bibleox.com/ko/ko-nkrv/2kor/5/#L10">고후 5:10</a>), 심판 자체가 행위에 따라 이루어지기 때문입니다(<a href="https://bibleox.com/ko/ko-nkrv/2kor/5/#L10">고후 5:10</a>; <a href="https://bibleox.com/ko/ko-nkrv/ef/6/#L7-8">엡 6:7-8</a>).</p><p>이처럼 인류에게 한 번 열린 구원은 믿음으로만이 아니라 행위로도 자기 것으로 삼아야 하며, 위에서 보았듯이 이것은 과정, 그것도 힘든 과정이고 많은 이가 그 목표에 이르지 못합니다:</p><blockquote><p>“<strong>좁은 문으로 들어가기를 힘쓰라</strong> 내가 너희에게 이르노니 <strong><mark>들어가기를 구하여도 못하는 자가 많으리라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/lk/13/#L24">눅 13:24</a>; <a href="https://bibleox.com/ko/ko-nkrv/mf/7/#L14">마 7:14</a>; <a href="https://bibleox.com/ko/ko-nkrv/mf/7/#L13">마 7:13</a>)</p></blockquote><h3>회개한 강도는 믿기만 했을 뿐 아무 행위도 하지 않았는가?</h3><p>강도는 구약의 이스라엘에 속한 사람으로서, 하느님과의 옛 언약 안에 있으면서 구세주를 믿는 믿음으로 구원받았으며, 무언가를 행하기도 했습니다.</p><p>왜 옛 언약 안에서입니까? 그리스도께서 성령으로 세례를 베푸시리라고 기록되어 있고(<a href="https://bibleox.com/ko/ko-nkrv/lk/3/#L16">눅 3:16</a>; <a href="https://bibleox.com/ko/ko-nkrv/mf/3/#L11">마 3:11</a>; <a href="https://bibleox.com/ko/ko-nkrv/mk/1/#L8">막 1:8</a>), 그리스도께서는 승천하신 뒤에, 곧 오순절에 성령을 보내 주시겠다고 약속하셨기 때문입니다(<a href="https://bibleox.com/ko/ko-nkrv/in/16/#L7">요 16:7</a>; <a href="https://bibleox.com/ko/ko-nkrv/in/14/#L16">요 14:16</a>; <a href="https://bibleox.com/ko/ko-nkrv/in/14/#L26">요 14:26</a>; <a href="https://bibleox.com/ko/ko-nkrv/in/7/#L38-39">요 7:38-39</a>). 강도에게 회개와 세례를 전했다는 기록도 없고, 강도에게 성령이 내리셨다는 기록도 없습니다(뒷날 다른 옛 그리스도인들의 경우와 다릅니다). 그러므로 회개한 강도는 교회가 세워지기 전에, 세례와 성체성혈성사 없이, 아직 옛 언약 안에서 구원받았습니다.</p><p>그러나 강도도 행위를 했습니다. 그는 자기에게 내려진 벌을 마땅히 받을 것으로 겸손히 받아들였고, 회개에 합당한 열매를 맺었습니다(<a href="https://bibleox.com/ko/ko-nkrv/mf/3/#L8">마 3:8</a>).</p><blockquote><p>“<strong>우리는 우리가 행한 일에 상당한 보응을 받는 것이니 이에 당연하거니와</strong> 이 사람이 행한 것은 옳지 않은 것이 없느니라 하고” (<a href="https://bibleox.com/ko/ko-nkrv/lk/23/#L41">눅 23:41</a>)</p></blockquote><p>하느님께 원망하지 않고, 탓할 다른 사람을 찾지 않고, 남을 정죄하지 않으며 고난을 겸손히 견디는 것은 그리스도인의 행위입니다(<a href="https://bibleox.com/ko/ko-nkrv/pr/3/#L11">잠 3:11</a>). 우리의 첫 조상들은 타락한 뒤에 자기를 탓하지 않고 다른 이를, 어느 정도는 하느님까지 탓하기 시작했습니다:</p><blockquote><p>“아담이 이르되 <strong>하나님이 주셔서 나와 함께 있게 하신 여자 그가 그 나무 열매를 내게 주므로 내가 먹었나이다</strong> 여호와 하나님이 여자에게 이르시되 네가 어찌하여 이렇게 하였느냐 여자가 이르되 <strong>뱀이 나를 꾀므로 내가 먹었나이다</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/gen/3/#L12-13">창 3:12-13</a>)</p></blockquote><p>그러나 강도는 자기를 탓하며 벌을 견뎠습니다. 이것은 행위이며, 그리스도인의 정신에 매우 합당한 행위입니다.</p><p>그는 강도였으므로 위대한 이들 가운데 하나로 영화롭게 되지도 않고, 구세주의 오른편이나 왼편에 예비된 자리를 받지도 않지만(<a href="https://bibleox.com/ko/ko-nkrv/mk/10/#L40">막 10:40</a>), 믿음으로, 그리고 자기가 할 수 있었던 이 작은 행위만으로도 구원받습니다. 그러니 강도에게도 믿음만이 아니라 행위가 있었습니다.</p><p>또 눈여겨볼 것은 강도가 스스로 자기가 구원받았다고 선언하지 않고, 그리스도께서 그에 대해 판결하신다는 점입니다. 강도의 말에는 구원에 대한 확신이 보이지 않습니다. 오히려 그는 자기가 하느님과 함께하는 영원한 생명에 이르지 못하리라는 것을 알기에, 자비에 대한 조심스러운 희망만 품고, 그리스도께서 당신 나라에 임하실 때(강도 자신은 그때 그곳에 있지 못하리라고 생각합니다) 자기를 기억해 달라고 청합니다.</p><h3>“누구든지 주의 이름을 부르는 자는 구원을 받으리라”</h3><blockquote><p>“누구든지 주의 이름을 부르는 자는 구원을 받으리라” (<a href="https://bibleox.com/ko/ko-nkrv/rim/10/#L13">롬 10:13</a>)</p></blockquote><blockquote><p>“누구든지 주의 이름을 부르는 자는 구원을 받으리라 하였느니라” (<a href="https://bibleox.com/ko/ko-nkrv/act/2/#L21">행 2:21</a>)</p></blockquote><p>이런 생각에 어려움을 느낄 수 있습니다. 구원받으려면 주님을 부르기만 하면 되고, 누구든 어떻게 부르든 무엇을 하든 어차피 구원받는가? 사실 여기서 “누구든지”라는 말은 유대인뿐 아니라 어떤 민족의 사람이든 구원받을 수 있다는 뜻입니다.</p><p>사도는 이 말씀을 인용할 뿐입니다. 이 말씀은 원래 구약에서 유대인들에게 미래에 관한 예언으로 주어졌습니다. 이제 사도는 그 말씀을 상기시키며, 그 말씀이 이루어질 때가 왔음을 가리킵니다. 구약에서 이 말씀을 한 이는 선지자 요엘입니다:</p><blockquote><p>“<strong>누구든지 여호와의 이름을 부르는 자는 구원을 얻으리니</strong> 이는 나 여호와의 말대로 시온 산과 예루살렘에서 피할 자가 있을 것임이요 남은 자 중에 나 여호와의 부름을 받을 자가 있을 것임이니라” (<a href="https://bibleox.com/ko/ko-nkrv/iol/2/#L32">욜 2:32</a>)</p></blockquote><p>선지자의 말은 하느님께서 이스라엘 사람만 구원하신다고 확신하던 이스라엘 백성에게 한 것입니다. 그래서 이스라엘 백성에게, 이스라엘 사람만이 아니라 하느님을 부르는 모든 사람(모든 민족)이 구원받을 때가 오리라는 예언이 주어집니다.</p><p>그러므로 이 말씀은 하느님께서 이스라엘 백성하고만 맺으신 옛 언약에서 온 것이며, 새 언약은 하느님께서 모든 민족을 부르신 교회와 맺으신 것입니다. 교회 안에서는 더 이상 민족이 중요하지 않기 때문입니다(<a href="https://bibleox.com/ko/ko-nkrv/kol/3/#L11">골 3:11</a>). 문맥에서 곧바로 보이듯 바로 이것이 요점입니다. 구원에는 민족이 상관없습니다:</p><blockquote><p>“성경에 이르되 <strong>누구든지 그를 믿는 자는</strong> 부끄러움을 당하지 아니하리라 하니 <strong><mark>유대인이나 헬라인이나 차별이 없음이라</mark></strong> 한 분이신 주께서 모든 사람의 주가 되사 그를 부르는 모든 사람에게 부요하시도다 <strong><mark>누구든지 주의 이름을 부르는 자는 구원을 받으리라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/rim/10/#L11-13">롬 10:11-13</a>)</p></blockquote><p>성경의 나머지 말씀도 그 필요성을 잃지 않습니다.</p><p>어떻게 구원받을 수 있습니까? 주님께서는 계명을 지키라고 말씀하십니다:</p><blockquote><p>“예수께서 이르시되 어찌하여 선한 일을 내게 묻느냐 선한 이는 오직 한 분이시니라 네가 생명에 들어 가려면 <strong>계명들을 지키라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/19/#L17">마 19:17</a>)</p></blockquote><p>하느님을 부른다는 말씀이 이것을 폐합니까? 물론 아닙니다.</p><p>물과 성령으로 나지 않은 사람은 하늘 나라를 보지도 못하고 들어가지도 못한다고 말씀하십니다. 이것도 폐해지지 않습니다.</p><blockquote><p>“예수께서 대답하여 이르시되 진실로 진실로 네게 이르노니 사람이 거듭나지 아니하면 <strong>하나님의 나라를 볼 수 없느니라</strong> &lt;…&gt; 예수께서 대답하시되 진실로 진실로 네게 이르노니 사람이 물과 성령으로 나지 아니하면 <strong>하나님의 나라에 들어갈 수 없느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/in/3/#L3,5">요 3:3,5</a>)</p></blockquote><p>성체성혈성사에 관한 말씀도 폐해지지 않습니다. 성체성혈성사 없이는 사람이 자기 안에 생명을 가질 수 없고 마지막 날에 (하느님과 함께하는 삶으로) 다시 살아날 수 없습니다.</p><blockquote><p>“예수께서 이르시되 내가 진실로 진실로 너희에게 이르노니 <strong>인자의 살을 먹지 아니하고 인자의 피를 마시지 아니하면</strong> <strong>너희 속에 생명이 없느니라</strong> 내 살을 먹고 내 피를 마시는 자는 영생을 가졌고 <strong>마지막 날에 내가 그를 다시 살리리니</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/in/6/#L53-54">요 6:53-54</a>)</p></blockquote><p>니골라당과 많은 이단자도 하느님을 부르지만, 이단자와 분열을 일으키는 자로서 하느님 나라를 잃는 정죄를 받습니다:</p><blockquote><p>“육체의 일은 분명하니 곧 음행과 더러운 것과 호색과 우상 숭배와 주술과 원수 맺는 것과 분쟁과 시기와 분냄과 당 짓는 것과 <strong>분열함과</strong> <strong>이단과</strong> 투기와 술 취함과 방탕함과 또 그와 같은 것들이라 전에 너희에게 경계한 것 같이 경계하노니 이런 일을 하는 자들은 하나님의 나라를 유업으로 받지 못할 것이요” (<a href="https://bibleox.com/ko/ko-nkrv/gal/5/#L19-21">갈 5:19-21</a>) <em>(“분열함”(διχοστασίαι)은 갈라짐, 쪼개짐을 뜻합니다.)</em></p></blockquote><p>그러므로 “누구든지”는 유대인만이 아니라 어떤 민족이든 상관없다는 뜻입니다. 사도도 교회에 대해 그렇게 말합니다:</p><blockquote><p>“이제는 너희가 이 모든 것을 벗어 버리라 곧 분함과 노여움과 악의와 비방과 너희 입의 부끄러운 말이라 &lt;…&gt; 새 사람을 입었으니 이는 자기를 창조하신 이의 형상을 따라 지식에까지 새롭게 하심을 입은 자니라 거기에는 <strong><mark>헬라인이나 유대인이나 할례파나 무할례파나 야만인이나 스구디아인이나 종이나 자유인이 차별이 있을 수 없나니</mark></strong> 오직 그리스도는 만유시요 만유 안에 계시니라” (<a href="https://bibleox.com/ko/ko-nkrv/kol/3/#L8,10-11">골 3:8,10-11</a>)</p></blockquote><h3>“대리 희생”(형벌 대속설)</h3><p>믿음만으로(행위 없이) 구원받는다는 가르침을 따르는 이들 가운데 일부는 “대리 희생”이라는 구원 이론을 말하는데, 그 뜻은 이렇습니다. 이삭이 살도록 이삭 대신 어린 양이 제물로 바쳐졌듯이, 죄인이 살도록 죄 많은 사람 대신 그리스도께서 제물로 바쳐지셨다는 것입니다. 그래서 하느님 아버지께서 아들에게 진노를 쏟으셨으므로 이제 믿는 죄인들에게는 더 이상 노하지 않으시고, 믿는 죄인들에게는 하느님과 함께하는 삶을 가로막는 것이 더 이상 없다는 것입니다.</p><p>대리 희생이라는 생각은 진리와 관계가 있어 보이지 않습니다. 이 생각은 문제가 하느님께 있다는(그분이 죄인들에게 노하신다는) 그릇된 전제에서 출발합니다. 그리고 하느님을 바로잡기 위해(그 자체로 얼마나 대담한 생각입니까) 아들이 죽어야 합니다. 그리고 사람은 자기를 전혀 고칠 필요가 없습니다. 하느님께서 아들에게 노하실 것이고, 그래서 (마치 하느님께 있던) 문제가 없어지기 때문입니다. 이런 이론은 상식에 어긋나므로 진리로 받아들일 수 없습니다. 문제가 하느님께 있지 않다는 것은 분명합니다. 깨끗하지 않은 것은 하느님과 함께하는 영원한 생명에 들어갈 수 없습니다:</p><blockquote><p>“그 성은 해나 달의 비침이 쓸 데 없으니 이는 하나님의 영광이 비치고 어린 양이 그 등불이 되심이라 &lt;…&gt; <strong>무엇이든지 속된 것이나 가증한 일 또는 거짓말하는 자는 결코 그리로 들어가지 못하되</strong> 오직 어린 양의 생명책에 기록된 자들만 들어가리라” (<a href="https://bibleox.com/ko/ko-nkrv/otkr/21/#L23,27">계 21:23,27</a>)</p></blockquote>'
