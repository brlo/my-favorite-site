- src: спасутся-не-все
  path: Nt2b_모두가_구원받지는_못합니다
  title: 모두가 구원받지는 못합니다
  copy_cover: true
  body: <h2>많은 이가 구원받지 못할 것입니다</h2><blockquote><p>“좁은 문으로 들어가기를 힘쓰라 내가 너희에게 이르노니 들어가기를 구하여도 <strong><mark>못하는 자가 많으리라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/lk/13/#L24">눅 13:24</a>)</p></blockquote><blockquote><p>“좁은 문으로 들어가라 <strong>멸망으로 인도하는 문은 크고 그 길이 넓어</strong> <strong><mark>그리로 들어가는 자가 많고</mark></strong> <strong>생명으로 인도하는 문은 좁고 길이 협착하여</strong> <strong>찾는 자가 적음이라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/7/#L13-14">마 7:13-14</a>)</p></blockquote><h2>믿는 이라고 다 구원받는 것은 아닙니다</h2><blockquote><p>“<strong><mark>나더러 주여 주여 하는 자마다 다 천국에 들어갈 것이 아니요</mark></strong> 다만 하늘에 계신 내 아버지의 뜻대로 행하는 자라야 들어가리라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/7/#L21">마 7:21</a>)</p></blockquote><blockquote><p>“그 날에 많은 사람이 나더러 이르되 주여 주여 우리가 주의 이름으로 <strong>선지자 노릇 하며</strong> 주의 이름으로 <strong>귀신을 쫓아 내며</strong> 주의 이름으로 <strong>많은 권능을 행하지</strong> 아니하였나이까 하리니 그 때에 내가 그들에게 밝히 말하되 <strong><mark>내가 너희를 도무지 알지 못하니 불법을 행하는 자들아 내게서 떠나가라</mark></strong> 하리라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/7/#L22-23">마 7:22-23</a>)</p></blockquote><blockquote><p>“농부가 땅에 많은 씨를 뿌리고 많은 모종을 심어도, 뿌린 것이 다 제때에 싹트지 않고 심은 것이 다 뿌리내리지 않는 것처럼, 이 세상에 뿌려진 사람들도 <strong>다 구원받지는 못할 것이다</strong>” (<a href="https://bibleox.com/ko/en-nrsv/3ezd/8/#L41">3에스 8:41</a>, 영어 번역(NRSV)에서 옮김) <em>(에스드라 2서(라틴어 성경의 에스드라 4서, 러시아어 성경의 에스드라 3서) 8:41. 개역개정에는 이 책이 없습니다.)</em></p></blockquote>
  title_sub: 모두가 구원받지는 못한다는 성경 구절
  meta_desc: "“이 세상에 뿌려진 사람들도 다 구원받지는 못할 것이다” (에스드라 2서 8:41)"
