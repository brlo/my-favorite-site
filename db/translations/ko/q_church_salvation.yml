- src: спасающихся-мало
  path: Fw8c_구원받는_이는_적습니다
  title: 구원받는 이는 적습니다
  copy_cover: true
  body: <h2>구원받는 이는 적습니다</h2><blockquote><p>“어떤 사람이 여짜오되 <strong><mark>주여 구원을 받는 자가 적으니이까</mark></strong> 그들에게 이르시되 좁은 문으로 들어가기를 힘쓰라 내가 너희에게 이르노니 <strong><mark>들어가기를 구하여도 못하는 자가 많으리라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/lk/13/#L23-24">눅 13:23-24</a>)</p></blockquote><blockquote><p>“좁은 문으로 들어가라 <strong>멸망으로 인도하는 문은 크고 그 길이 넓어</strong> <strong>그리로 들어가는 자가 많고</strong> <strong>생명으로 인도하는 문은 좁고 길이 협착하여</strong> <strong>찾는 자가 적음이라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/7/#L13-14">마 7:13-14</a>)</p></blockquote><blockquote><p>“그 날에 <strong>많은 사람이</strong> 나더러 이르되 주여 주여 우리가 주의 이름으로 선지자 노릇 하며 주의 이름으로 귀신을 쫓아 내며 주의 이름으로 많은 권능을 행하지 아니하였나이까 하리니 그 때에 내가 그들에게 밝히 말하되 <strong>내가 너희를 도무지 알지 못하니 불법을 행하는 자들아 내게서 떠나가라</strong> 하리라” (<a href="https://bibleox.com/ko/ko-nkrv/mf/7/#L22-23">마 7:22-23</a>)</p></blockquote><blockquote><p>“<strong>적은 무리여</strong> 무서워 말라 너희 아버지께서 그 나라를 너희에게 주시기를 기뻐하시느니라” (<a href="https://bibleox.com/ko/ko-nkrv/lk/12/#L32">눅 12:32</a>)</p></blockquote><blockquote><p>“내 것을 가지고 내 뜻대로 할 것이 아니냐 내가 선하므로 네가 악하게 보느냐 이와 같이 <strong>나중 된 자로서 먼저 되고 먼저 된 자로서 나중 되리라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/20/#L15-16">마 20:15-16</a>) <em>(비잔틴 본문(다수 사본)에는 끝에 “<strong>청함을 받은 자는 많되 택함을 입은 자는 적으니라</strong>”(πολλοὶ γάρ εἰσιν κλητοί, ὀλίγοι δὲ ἐκλεκτοί)가 이어집니다.)</em></p></blockquote><blockquote><p>“임금이 사환들에게 말하되 그 손발을 묶어 바깥 어두운 데에 내던지라 거기서 슬피 울며 이를 갈게 되리라 하니라 청함을 받은 자는 많되 <strong><mark>택함을 입은 자는 적으니라</mark></strong>” (<a href="https://bibleox.com/ko/ko-nkrv/mf/22/#L13-14">마 22:13-14</a>)</p></blockquote><blockquote><p>“내가 너희에게 말하노니 <strong>전에 청하였던 그 사람들은 하나도 내 잔치를 맛보지 못하리라</strong> 하였다 하시니라” (<a href="https://bibleox.com/ko/ko-nkrv/lk/14/#L24">눅 14:24</a>) <em>(공인본문과 일부 비잔틴 사본에는 끝에 “<strong>청함을 받은 자는 많되 택함을 입은 자는 적으니라</strong>”가 이어집니다. 러시아어 시노달 번역에도 이 말이 있습니다.)</em></p></blockquote><h2>구원받는 이가 적다는 구약의 본보기</h2><blockquote><p>“하나님이 범죄한 천사들을 용서하지 아니하시고 지옥에 던져 어두운 구덩이에 두어 심판 때까지 지키게 하셨으며 <strong><mark>옛 세상을 용서하지 아니하시고 오직 의를 전파하는 노아와 그 일곱 식구를 보존하시고</mark></strong> 경건하지 아니한 자들의 세상에 홍수를 내리셨으며 <strong>소돔과 고모라 성을 멸망하기로 정하여 재가 되게 하사</strong> 후세에 경건하지 아니할 자들에게 본을 삼으셨으며 무법한 자들의 음란한 행실로 말미암아 고통 당하는 <strong>의로운 롯을 건지셨으니</strong> (이는 이 의인이 그들 중에 거하여 날마다 저 불법한 행실을 보고 들음으로 그 의로운 심령이 상함이라) 주께서 경건한 자는 시험에서 건지실 줄 아시고 불의한 자는 형벌 아래에 두어 심판 날까지 지키시며” (<a href="https://bibleox.com/ko/ko-nkrv/2pet/2/#L4-9">벧후 2:4-9</a>)</p></blockquote><blockquote><p>“<strong>그들에게 일어난 이런 일은 본보기가 되고 또한 말세를 만난 우리를 깨우치기 위하여 기록되었느니라</strong>” (<a href="https://bibleox.com/ko/ko-nkrv/1kor/10/#L11">고전 10:11</a>)</p></blockquote>
  meta_desc: 믿는 이가 적을 뿐 아니라 믿는 이들 가운데서도 구원받는 이는 적습니다
