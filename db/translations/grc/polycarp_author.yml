    body: |-
      <p><strong>Η μνήμη του</strong>: 23 Φεβρουαρίου (8 Μαρτίου)</p><p>Μαθητής του αγίου αποστόλου και ευαγγελιστού Ιωάννου του Θεολόγου, ένας από τους αποστολικούς πατέρες. Πνευματικός διδάσκαλος, υπερασπιστής της καθαρότητας της πίστεως από τις αιρέσεις. Ένας από τους μαθητές του — ο Ειρηναίος Λουγδούνου, ιερομάρτυς.</p><h2>Βίος</h2><p>Ο άγιος Πολύκαρπος, γεννημένος στο δεύτερο μισό του 1ου αιώνα, ήταν μαθητής του αποστόλου Ιωάννου του Θεολόγου. Από παιδί έμεινε ορφανός και τον υιοθέτησε μια χριστιανή, η Καλλίστη. Μετά τον θάνατό της μοίρασε όλη την περιουσία στους φτωχούς και άρχισε να ζει με αυστηρότητα. Ως επίσκοπος Σμύρνης ο Πολύκαρπος αγωνίστηκε κατά του γνωστικισμού, όντας ο πιο σεβαστός θεολόγος της Μικράς Ασίας.</p><p>Τον ακολούθησαν πολλοί μαθητές, ανάμεσά τους και ο Ειρηναίος Λουγδούνου, ο οποίος, εγκατασταθείς στη Δύση, έγινε φορέας της θεολογίας του Πολυκάρπου στη Γαλατία και στην Ιταλία. Έτσι γράφει ο <a href="https://bibleox.com/grc/grc/w/5tBI_%CE%95%E1%BC%B0%CF%81%CE%B7%CE%BD%CE%B1%E1%BF%96%CE%BF%CF%82_%CE%9B%CE%BF%CF%85%CE%B3%CE%B4%CE%BF%CF%8D%CE%BD%CE%BF%CF%85_2%CE%BF%CF%82_%CE%B1%E1%BC%B0">Ειρηναίος Λουγδούνου</a> για τον Πολύκαρπο:</p><blockquote><p>Καὶ <strong>Πολύκαρπος</strong> δὲ <strong>οὐ μόνον ὑπὸ ἀποστόλων μαθητευθεὶς καὶ συναναστραφεὶς πολλοῖς τοῖς τὸν Κύριον ἑωρακόσιν, ἀλλὰ καὶ ὑπὸ ἀποστόλων κατασταθεὶς εἰς τὴν Ἀσίαν ἐν τῇ ἐν Σμύρνῃ ἐκκλησίᾳ ἐπίσκοπος</strong>, ὃν καὶ ἡμεῖς ἑωράκαμεν ἐν τῇ πρώτῃ ἡμῶν ἡλικίᾳ–ἐπὶ πολὺ γὰρ παρέμεινεν καὶ πάνυ γηραλέος ἐνδόξως καὶ ἐπιφανέστατα μαρτυρήσας ἐξῆλθεν τοῦ βίου–, <strong>ταῦτα διδάξας ἀεὶ ἃ καὶ παρὰ τῶν ἀποστόλων ἔμαθεν, ἃ καὶ ἡ ἐκκλησία παραδίδωσιν</strong>, ἃ καὶ μόνα ἐστὶν ἀληθῆ. Μαρτυροῦσι τούτοις αἱ κατὰ τὴν Ἀσίαν ἐκκλησίαι πᾶσαι καὶ οἱ μέχρι νῦν διαδεδεγμένοι τὸν Πολύκαρπον, πολλῷ ἀξιοπιστότερον καὶ βεβαιότερον ἀληθείας μάρτυρα ὄντα Οὐαλεντίνου καὶ Μαρκίωνος καὶ τῶν λοιπῶν κακογνωμόνων. Ὃς καὶ ἐπὶ Ἀνικήτου ἐπιδημήσας τῇ Ῥώμῃ, πολλοὺς ἀπὸ τῶν προειρημένων αἱρετικῶν ἐπέστρεψεν εἰς τὴν ἐκκλησίαν τοῦ Θεοῦ, μίαν καὶ μόνην ταύτην ἀλήθειαν κηρύξας ὑπὸ τῶν ἀποστόλων παρειληφέναι τὴν ὑπὸ τῆς ἐκκλησίας παραδιδομένην</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/jzHD_%E1%BC%9C%CE%BB%CE%B5%CE%B3%CF%87%CE%BF%CF%82_%CE%BA%CE%B1%E1%BD%B6_%E1%BC%80%CE%BD%CE%B1%CF%84%CF%81%CE%BF%CF%80%E1%BD%B4_%CF%84%E1%BF%86%CF%82_%CF%88%CE%B5%CF%85%CE%B4%CF%89%CE%BD%CF%8D%CE%BC%CE%BF%CF%85_%CE%B3%CE%BD%CF%8E%CF%83%CE%B5%CF%89%CF%82_%CE%9A%CE%B1%CF%84%E1%BD%B0_%CE%B1%E1%BC%B1%CF%81%CE%AD%CF%83%CE%B5%CF%89%CE%BD__%CE%92%CE%B9%CE%B2%CE%BB%CE%AF%CE%BF%CE%BD_3#HH-3">Κατὰ αἱρέσεων Γ΄, 3</a>)</p><p>Στον άγιο Πολύκαρπο απευθυνόταν <a href="https://bibleox.com/grc/grc/w/%CE%99%CE%B3%CE%BD%CE%98_%CE%A0%CE%BF%CE%BB">μία από τις επιστολές</a> <a href="https://bibleox.com/grc/grc/w/%CE%99%CE%B3%CE%BD%CE%AC%CF%84%CE%B9%CE%BF%CF%82_%CE%98%CE%B5%CE%BF%CF%86%CF%8C%CF%81%CE%BF%CF%82_%CE%91%CE%BD%CF%84%CE%B9%CE%BF%CF%87%CE%B5%CE%AF%CE%B1%CF%82">Ιγνατίου του Θεοφόρου</a>. Σώθηκε μόνο ένα έργο του ίδιου του Πολυκάρπου — η Επιστολή προς Φιλιππησίους. Γι’ αυτήν γράφει τον 2ο αιώνα ο ιερομάρτυς <a href="https://bibleox.com/grc/grc/w/5tBI_%CE%95%E1%BC%B0%CF%81%CE%B7%CE%BD%CE%B1%E1%BF%96%CE%BF%CF%82_%CE%9B%CE%BF%CF%85%CE%B3%CE%B4%CE%BF%CF%8D%CE%BD%CE%BF%CF%85_2%CE%BF%CF%82_%CE%B1%E1%BC%B0">Ειρηναίος Λουγδούνου</a>:</p><blockquote><p>Ἔστιν δὲ καὶ <strong>ἐπιστολὴ Πολυκάρπου πρὸς Φιλιππησίους γεγραμμένη</strong> ἱκανωτάτη, ἐξ ἧς καὶ τὸν χαρακτῆρα τῆς πίστεως αὐτοῦ καὶ τὸ κήρυγμα τῆς ἀληθείας οἱ βουλόμενοι καὶ φροντίζοντες τῆς ἑαυτῶν σωτηρίας δύνανται μαθεῖν. 6 Ἀλλὰ καὶ ἡ ἐν Ἐφέσῳ ἐκκλησία ὑπὸ Παύλου μὲν τεθεμελιωμένη, Ἰωάννου δὲ παραμείναντος αὐτοῖς μέχρι τῶν Τραϊανοῦ χρόνων, μάρτυς ἀληθής ἐστιν τῆς τῶν ἀποστόλων παραδόσεως</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/jzHD_%E1%BC%9C%CE%BB%CE%B5%CE%B3%CF%87%CE%BF%CF%82_%CE%BA%CE%B1%E1%BD%B6_%E1%BC%80%CE%BD%CE%B1%CF%84%CF%81%CE%BF%CF%80%E1%BD%B4_%CF%84%E1%BF%86%CF%82_%CF%88%CE%B5%CF%85%CE%B4%CF%89%CE%BD%CF%8D%CE%BC%CE%BF%CF%85_%CE%B3%CE%BD%CF%8E%CF%83%CE%B5%CF%89%CF%82_%CE%9A%CE%B1%CF%84%E1%BD%B0_%CE%B1%E1%BC%B1%CF%81%CE%AD%CF%83%CE%B5%CF%89%CE%BD__%CE%92%CE%B9%CE%B2%CE%BB%CE%AF%CE%BF%CE%BD_3#HH-3">Κατὰ αἱρέσεων Γ΄, 3</a>)</p><p>Πήρε μέρος στη διαμάχη με τον πάπα Ανίκητο για την ημερομηνία του Πάσχα (οι κοινότητες της Μικράς Ασίας το γιόρταζαν τη 14η του Νισάν, ενώ οι ρωμαϊκές την πρώτη Κυριακή μετά τη 14η του Νισάν). Η διαμάχη όμως έμεινε άλυτη, χωρίς αυτό να εμποδίσει τους δύο επισκόπους να χωριστούν φίλοι. Σε ηλικία 86 ετών συνελήφθη και, αρνούμενος να αρνηθεί τον Χριστό, κάηκε ζωντανός. Το μαρτύριό του περιγράφηκε λεπτομερώς στην «<a href="https://bibleox.com/grc/grc/w/%CE%9C%CE%B1%CF%81%CF%84%CF%8D%CF%81%CE%B9%CE%BF_%CF%84%CE%BF%CF%85_%CE%91%CE%B3%CE%AF%CE%BF%CF%85_%CE%A0%CE%BF%CE%BB%CF%85%CE%BA%CE%AC%CF%81%CF%80%CE%BF%CF%85_%CE%95%CF%80%CE%B9%CF%83%CE%BA%CF%8C%CF%80%CE%BF%CF%85_%CE%A3%CE%BC%CF%8D%CF%81%CE%BD%CE%B7%CF%82">Εγκύκλιο επιστολή της Εκκλησίας της Σμύρνης</a>».</p><p>Στο ίδιο κείμενο παρατίθενται και τα λόγια του Πολυκάρπου, ότι υπηρετεί τον Χριστό ήδη 86 χρόνια:</p><blockquote><p>ἐγκειμένου δὲ τοῦ ἀνθυπάτου καὶ λέγοντος· Ὄμοσον, καὶ ἀπολύω σε, λοιδόρησον τὸν Χριστόν, ἔφη ὁ Πολύκαρπος· <strong>Ὀγδοήκοντα καὶ ἓξ ἔτη δουλεύω αὐτῷ</strong>, καὶ οὐδέν με ἠδίκησεν· καὶ πῶς δύναμαι βλασφημῆσαι τὸν βασιλέα μου τὸν σώσαντά με;</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%9C%CE%B1%CF%81%CF%84%CF%8D%CF%81%CE%B9%CE%BF_%CF%84%CE%BF%CF%85_%CE%91%CE%B3%CE%AF%CE%BF%CF%85_%CE%A0%CE%BF%CE%BB%CF%85%CE%BA%CE%AC%CF%81%CF%80%CE%BF%CF%85_%CE%95%CF%80%CE%B9%CF%83%CE%BA%CF%8C%CF%80%CE%BF%CF%85_%CE%A3%CE%BC%CF%8D%CF%81%CE%BD%CE%B7%CF%82#HH-9">Μαρτύριο τοῦ ἁγίου Πολυκάρπου, 9</a>)</p><p>Για τον Πολύκαρπο γράφει ο Ευσέβιος Καισαρείας (~258-339), αναφέροντας και παραθέτοντας την επιστολή του προς Φιλιππησίους:</p><blockquote><p>∆ιέπρεπέν γε μὴν κατὰ τούτους ἐπὶ τῆς Ἀσίας <strong>τῶν ἀποστόλων ὁμιλητὴς Πολύκαρπος</strong>, τῆς κατὰ Σμύρναν ἐκκλησίας πρὸς τῶν αὐτοπτῶν καὶ ὑπηρετῶν τοῦ κυρίου τὴν ἐπισκοπὴν ἐγκεχειρισμένος·</p><p>&lt;…&gt;</p><p>καὶ ὁ Πολύκαρπος δὲ τούτων αὐτῶν μέμνηται <strong>ἐν τῇ φερομένῃ αὐτοῦ πρὸς Φιλιππησίους ἐπιστολῇ, φάσκων αὐτοῖς ῥήμασιν·</strong> «παρακαλῶ οὖν πάντας ὑμᾶς πειθαρχεῖν καὶ ἀσκεῖν πᾶσαν ὑπομονήν, ἣν εἴδετε κατ' ὀφθαλμοὺς οὐ μόνον ἐν τοῖς μακαρίοις Ἰγνατίῳ καὶ Ῥούφῳ καὶ Ζωσίμῳ, ἀλλὰ καὶ ἐν ἄλλοις τοῖς ἐξ ὑμῶν καὶ ἐν αὐτῷ Παύλῳ καὶ τοῖς λοιποῖς ἀποστόλοις, πεπεισμένους ὅτι οὗτοι πάντες οὐκ εἰς κενὸν ἔδραμον, ἀλλ' ἐν πίστει καὶ δικαιοσύνῃ, καὶ ὅτι εἰς τὸν ὀφειλόμενον αὐτοῖς τόπον εἰσὶν παρὰ κυρίῳ, ᾧ καὶ συνέπαθον. οὐ γὰρ τὸν νῦν ἠγάπησαν αἰῶνα, ἀλλὰ τὸν ὑπὲρ ἡμῶν ἀποθανόντα καὶ δι' ἡμᾶς ὑπὸ τοῦ θεοῦ ἀναστάντα». <strong>καὶ ἑξῆς ἐπιφέρει·</strong></p><p>«ἐγράψατέ μοι καὶ ὑμεῖς καὶ Ἰγνάτιος, ἵν' ἐάν τις ἀπέρχηται εἰς Συρίαν, καὶ τὰ παρ' ὑμῶν ἀποκομίσῃ γράμματα· ὅπερ ποιήσω, ἐὰν λάβω καιρὸν εὔθετον, εἴτε ἐγὼ εἴτε ὃν πέμπω πρεσβεύσοντα καὶ περὶ ὑμῶν.</p><p>τὰς ἐπιστολὰς Ἰγνατίου τὰς πεμφθείσας ἡμῖν ὑπ' αὐτοῦ καὶ ἄλλας ὅσας εἴχομεν παρ' ἡμῖν, ἐπέμψαμεν ὑμῖν, καθὼς ἐνετείλασθε· αἵτινες ὑποτεταγμέναι εἰσὶν τῇ ἐπιστολῇ ταύτῃ· ἐξ ὧν μεγάλα ὠφεληθῆναι δυνήσεσθε. περιέχουσι γὰρ πίστιν καὶ ὑπομονὴν καὶ πᾶσαν οἰκοδομὴν τὴν εἰς τὸν κύριον ἡμῶν ἀνήκουσαν».</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%95%CE%9A%CE%9A%CE%9B%CE%97%CE%A3%CE%99%CE%91%CE%A3%CE%A4%CE%99%CE%9A%CE%97%CE%A3_%CE%99%CE%A3%CE%A4%CE%9F%CE%A1%CE%99%CE%91%CE%A3-3#HH-36">Ἐκκλησιαστικὴ Ἱστορία Γ΄, 36</a>)</p><h2>Υμνογραφία</h2><p>Τροπάριο, ήχος δ΄:</p><blockquote><p>Και τρόπων μέτοχος, / και θρόνων διάδοχος των αποστόλων γενόμενος, / την πράξη βρήκες, θεόπνευστε, / ως ανάβαση στη θεωρία. / Γι’ αυτό, τον λόγο της αληθείας ορθοτομώντας, / για την πίστη έπαθες μέχρις αίματος, / ιερομάρτυς Πολύκαρπε, / πρέσβευε στον Χριστό τον Θεό // να σωθούν οι ψυχές μας.</p></blockquote><p>Κοντάκιο, ήχος α΄:</p><blockquote><p>Καρπούς λογικούς προσφέροντας στον Κύριο, / Πολύκαρπε σοφέ, θυσίες αρετών, / γι’ αυτό και από τον Θεό ως άξιος ιεράρχης δοξάστηκες. / Γι’ αυτό σήμερα, φωτισμένοι από τα λόγια σου, / υμνούμε την αξιέπαινη μνήμη σου, // δοξάζοντας τον Κύριο.</p></blockquote><h2>Πίστη</h2><h3>Για τη σωτηρία χρειάζονται τα έργα</h3><p>Ο άγιος Πολύκαρπος, ακολουθώντας τον απόστολο Παύλο (<a href="https://bibleox.com/grc/gr-lxx-byz/ef/2/#L8-9">Εφ. 2:8-9</a>), λέει στην Εκκλησία ότι σωζόμαστε με χάρη και όχι με έργα, δηλαδή η δυνατότητα της σωτηρίας είναι ανοιχτή στους ανθρώπους δωρεάν, μέσω της θυσίας του Κυρίου Ιησού Χριστού στον σταυρό και της αναστάσεώς Του, και δεν έχει κερδηθεί από τα έργα μας. Όμως τον δρόμο που άνοιξε η δωρεά πρέπει να τον διαβεί κανείς — να κοπιάσει για το έργο. Γι’ αυτό δεν σώζεται όποιος δεν εκτελεί το θέλημα του Θεού και δεν ζει κατά τις εντολές. Αυτοί δεν θα φτάσουν στην ανάσταση της ζωής, αλλά θα καταδικαστούν σε αιώνια βάσανα:</p><blockquote><p>εἰς ὃν οὐκ ἰδόντες πιστεύετε χαρᾷ ἀνεκλαλήτῳ καὶ δεδοξασμένῃ, εἰς ἣν πολλοὶ ἐπιθυμοῦσιν εἰσελθεῖν, εἰδότες, ὅτι <strong>χάριτί ἐστε σεσωσμένοι, οὐκ ἐξ ἔργων,</strong> ἀλλὰ θελήματι θεοῦ διὰ Ἰησοῦ Χριστοῦ.</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%95%CF%80%CE%B9%CF%83%CF%84%CE%BF%CE%BB%CE%AE-%CE%A0%CE%BF%CE%BB%CF%85%CE%BA%CE%AC%CF%81%CF%80%CE%BF%CF%85-%CF%80%CF%81%CE%BF%CF%82-%CE%A6%CE%B9%CE%BB%CE%B9%CF%80%CF%80%CE%B7%CF%83%CE%AF%CE%BF%CF%85%CF%82#HH-1">Πρὸς Φιλιππησίους, 1</a>)</p><blockquote><p>ὁ δὲ ἐγείρας αὐτὸν ἐκ νεκρῶν <strong><mark>καὶ ἡμᾶς ἐγερεῖ,</mark></strong> <strong><mark><strong><mark><u>ἐὰν</u></mark></strong> ποιῶμεν αὐτοῦ τὸ θέλημα</mark></strong> καὶ <strong><mark>πορευώμεθα ἐν ταῖς ἐντολαῖς αὐτοῦ</mark></strong> καὶ <strong>ἀγαπῶμεν ἃ ἠγάπησεν, ἀπεχόμενοι πάσης ἀδικίας, πλεονεξίας, φιλαργυρίας, καταλαλιᾶς, ψευδομαρτυρίας· μὴ ἀποδιδόντες κακὸν ἀντὶ κακοῦ ἢ λοιδορίαν ἀντὶ λοιδορίας ἢ γρόνθον ἀντὶ γρόνθου ἢ κατάραν ἀντὶ κατάρας· μνημονεύοντες δὲ ὧν εἶπεν ὁ κύριος διδάσκων· Μὴ κρίνετε, ἵνα μὴ κριθῆτε· ἀφίετε, καὶ ἀφεθήσεται ὑμῖν· ἐλεᾶτε, ἵνα ἐλεηθῆτε· ᾧ μέτρῳ μετρεῖτε, ἀντιμετρηθήσεται ὑμῖν· καὶ ὅτι μακάριοι οἱ πτωχοὶ καὶ οἱ διωκόμενοι ἕνεκεν δικαιοσύνης, ὅτι αὐτῶν ἐστὶν ἡ βασιλεία τοῦ θεοῦ.</strong></p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%95%CF%80%CE%B9%CF%83%CF%84%CE%BF%CE%BB%CE%AE-%CE%A0%CE%BF%CE%BB%CF%85%CE%BA%CE%AC%CF%81%CF%80%CE%BF%CF%85-%CF%80%CF%81%CE%BF%CF%82-%CE%A6%CE%B9%CE%BB%CE%B9%CF%80%CF%80%CE%B7%CF%83%CE%AF%CE%BF%CF%85%CF%82#HH-2">Πρὸς Φιλιππησίους, 2</a>)</p><blockquote><p>Εἰδότες, οὖν, ὅτι θεὸς οὐ μυκτηρίζεται, <strong>ὀφείλομεν ἀξίως τῆς ἐντολῆς αὐτοῦ καὶ δόξης περιπατεῖν.</strong> ὁμοίως διάκονοι ἄμεμπτοι κατενώπιον αὐτοῦ τῆς δικαιοσύνης ὡς θεοῦ καὶ Χριστοῦ διάκονοι καὶ οὐκ ἀνθρώπων· μὴ διάβολοι, μὴ δίλογοι, ἀφιλάργυροι, ἐγκρατεῖς περὶ πάντα, εὔσπλαγχνοι, ἐπιμελεῖς, <strong><mark>πορευόμενοι κατὰ τὴν ἀλήθειαν τοῦ κυρίου,</mark></strong> ὃς ἐγένετο διάκονος πάντων· <strong><mark>ᾧ ἐὰν εὐαρεστήσωμεν ἐν τῷ νῦν αἰῶνι, ἀποληψόμεθα καὶ τὸν μέλλοντα,</mark></strong> καθὼς ὑπέσχετο ἡμῖν ἐγεῖραι ἡμᾶς ἐκ νεκρῶν, καὶ ὅτι <strong><mark>ἐὰν πολιτευσώμεθα ἀξίως αὐτοῦ, καὶ συμβασιλεύσομεν αὐτῷ, εἴγε πιστεύομεν.</mark></strong> ὁμοίως καὶ <strong>νεώτεροι ἄμεμπτοι ἐν πᾶσιν,</strong> πρὸ παντὸς προνοοῦντες ἁγνείας καὶ <strong>χαλιναγωγοῦντες ἑαυτοὺς ἀπὸ παντὸς κακοῦ.</strong></p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%95%CF%80%CE%B9%CF%83%CF%84%CE%BF%CE%BB%CE%AE-%CE%A0%CE%BF%CE%BB%CF%85%CE%BA%CE%AC%CF%81%CF%80%CE%BF%CF%85-%CF%80%CF%81%CE%BF%CF%82-%CE%A6%CE%B9%CE%BB%CE%B9%CF%80%CF%80%CE%B7%CF%83%CE%AF%CE%BF%CF%85%CF%82#HH-5">Πρὸς Φιλιππησίους, 5</a>)</p><h3>Η ερμηνεία της Γραφής κατά την Παράδοση</h3><blockquote><p>ὃς ἂν μὴ ὁμολογῇ τὸ μαρτύριον τοῦ σταυροῦ, ἐκ τοῦ διαβόλου ἐστίν· καὶ ὃς ἂν <strong>μεθοδεύῃ τὰ λόγια τοῦ κυρίου πρὸς τὰς ἰδίας ἐπιθυμίας</strong> καὶ λέγῃ μήτε ἀνάστασιν μήτε κρίσιν, <strong>οὗτος πρωτότοκός ἐστι τοῦ σατανᾶ.</strong> διὸ ἀπολιπόντες τὴν ματαιότητα τῶν πολλῶν καὶ τὰς ψευδοδιδασκαλίας ἐπὶ τὸν <strong>ἐξ ἀρχῆς ἡμῖν <strong><mark>παραδοθέντα</mark></strong> λόγον</strong> <strong>ἐπιστρέψωμεν,</strong></p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%95%CF%80%CE%B9%CF%83%CF%84%CE%BF%CE%BB%CE%AE-%CE%A0%CE%BF%CE%BB%CF%85%CE%BA%CE%AC%CF%81%CF%80%CE%BF%CF%85-%CF%80%CF%81%CE%BF%CF%82-%CE%A6%CE%B9%CE%BB%CE%B9%CF%80%CF%80%CE%B7%CF%83%CE%AF%CE%BF%CF%85%CF%82#HH-7">Πρὸς Φιλιππησίους, 7</a>)</p><h3>Υπακοή στην ιεροσύνη</h3><blockquote><p>διὸ δέον ἀπέχεσθαι ἀπὸ πάντων τούτων, <strong>ὑποτασσομένους τοῖς πρεσβυτέροις καὶ διακόνοις ὡς θεῷ καὶ Χριστῷ·</strong> τὰς παρθένους ἐν ἀμώμῳ καὶ ἁγνῇ συνειδήσει περιπατεῖν.</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%95%CF%80%CE%B9%CF%83%CF%84%CE%BF%CE%BB%CE%AE-%CE%A0%CE%BF%CE%BB%CF%85%CE%BA%CE%AC%CF%81%CF%80%CE%BF%CF%85-%CF%80%CF%81%CE%BF%CF%82-%CE%A6%CE%B9%CE%BB%CE%B9%CF%80%CF%80%CE%B7%CF%83%CE%AF%CE%BF%CF%85%CF%82#HH-5">Πρὸς Φιλιππησίους, 5</a>)</p><h3>Οι κεκοιμημένοι άγιοι ζουν ήδη στον ουρανό με τον Χριστό</h3><blockquote><p><em>διὰ τῆς ὑπομονῆς καταγωνισάμενος τὸν ἄδικον ἄρχοντα καὶ οὕτως τὸν τῆς ἀφθαρσίας στέφανον ἀπολαβών,</em> <em>σὺν τοῖς ἀποστόλοις καὶ πᾶσιν δικαίοις ἀγαλλιώμενος δοξάζει τὸν θεὸν καὶ πατέρα παντοκράτορα καὶ εὐλογεῖ τὸν κύριον ἡμῶν Ἰησοῦν Χριστόν, τὸν σωτῆρα τῶν ψυχῶν ἡμῶν καὶ κυβερνήτην τῶν σωμάτων ἡμῶν καὶ ποιμένα τῆς κατὰ τὴν οἰκουμένην καθολικῆς ἐκκλησίας.</em></p><p><em><strong><mark>&lt;…&gt;</mark></strong></em></p><p><em>Ἐρρῶσθαι ὑμᾶς εὐχόμεθα, ἀδελφοί, στοιχοῦντας τῷ κατὰ τὸ εὐαγγέλιον λόγῳ Ἰησοῦ Χριστοῦ, μεθ’ οὗ δόξα τῷ θεῷ καὶ πατρὶ καὶ ἁγίῳ πνεύματι, ἐπὶ σωτηρίᾳ τῇ τῶν ἁγίων ἐκλεκτῶν, καθὼς ἐμαρτύρησεν ὁ μακάριος Πολύκαρπος,</em> <em>οὗ γένοιτο ἐν τῇ βασιλείᾳ Ἰησοῦ Χριστοῦ πρὸς τὰ ἴχνη εὑρεθῆναι ἡμᾶς.</em></p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%9C%CE%B1%CF%81%CF%84%CF%8D%CF%81%CE%B9%CE%BF_%CF%84%CE%BF%CF%85_%CE%91%CE%B3%CE%AF%CE%BF%CF%85_%CE%A0%CE%BF%CE%BB%CF%85%CE%BA%CE%AC%CF%81%CF%80%CE%BF%CF%85_%CE%95%CF%80%CE%B9%CF%83%CE%BA%CF%8C%CF%80%CE%BF%CF%85_%CE%A3%CE%BC%CF%8D%CF%81%CE%BD%CE%B7%CF%82#HH-19">Μαρτύριο τοῦ ἁγίου Πολυκάρπου, 19</a>)</p><h3>Η παρουσία του Χριστού για να κρίνει ζώντες και νεκρούς</h3><blockquote><p>ᾧ ὑπετάγη τὰ πάντα ἐπουράνια καὶ ἐπίγεια, ᾧ πᾶσα πνοὴ λατρεύει, ὃς <strong><mark>ἔρχεται κριτὴς ζώντων καὶ νεκρῶν,</mark></strong> οὗ τὸ αἷμα ἐκζητήσει ὁ θεὸς ἀπὸ τῶν ἀπειθούντων αὐτῷ.</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%95%CF%80%CE%B9%CF%83%CF%84%CE%BF%CE%BB%CE%AE-%CE%A0%CE%BF%CE%BB%CF%85%CE%BA%CE%AC%CF%81%CF%80%CE%BF%CF%85-%CF%80%CF%81%CE%BF%CF%82-%CE%A6%CE%B9%CE%BB%CE%B9%CF%80%CF%80%CE%B7%CF%83%CE%AF%CE%BF%CF%85%CF%82#HH-2">Πρὸς Φιλιππησίους, 2</a>)</p><h3>Όλοι θα κριθούν</h3><blockquote><p>εἰ οὖν δεόμεθα τοῦ κυρίου, ἵνα ἡμῖν ἀφῇ, ὀφείλομεν καὶ ἡμεῖς ἀφιέναι· ἀπέναντι γὰρ τῶν τοῦ κυρίου καὶ θεοῦ ἐσμὲν ὀφθαλμῶν, καὶ πάντας δεῖ <strong><mark>παραστῆναι τῷ βήματι τοῦ Χριστοῦ</mark></strong> καὶ <strong><strong><mark>ἕκαστον ὑπὲρ αὐτοῦ λόγον δοῦναι.</mark></strong></strong></p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%95%CF%80%CE%B9%CF%83%CF%84%CE%BF%CE%BB%CE%AE-%CE%A0%CE%BF%CE%BB%CF%85%CE%BA%CE%AC%CF%81%CF%80%CE%BF%CF%85-%CF%80%CF%81%CE%BF%CF%82-%CE%A6%CE%B9%CE%BB%CE%B9%CF%80%CF%80%CE%B7%CF%83%CE%AF%CE%BF%CF%85%CF%82#HH-6">Πρὸς Φιλιππησίους, 6</a>)</p><h3>Αιώνια βάσανα</h3><blockquote><p>ὁ δὲ Πολύκαρπος εἶπεν· Πῦρ ἀπειλεῖς τὸ πρὸς ὥραν καιόμενον καὶ μετ’ ὀλίγον σβεννύμενον· ἀγνοεῖς γὰρ <strong><mark>τὸ τῆς μελλούσης κρίσεως καὶ αἰωνίου κολάσεως τοῖς ἀσεβέσι τηρούμενον πῦρ.</mark></strong> ἀλλὰ τί βραδύνεις; φέρε, ὃ βούλει.</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%9C%CE%B1%CF%81%CF%84%CF%8D%CF%81%CE%B9%CE%BF_%CF%84%CE%BF%CF%85_%CE%91%CE%B3%CE%AF%CE%BF%CF%85_%CE%A0%CE%BF%CE%BB%CF%85%CE%BA%CE%AC%CF%81%CF%80%CE%BF%CF%85_%CE%95%CF%80%CE%B9%CF%83%CE%BA%CF%8C%CF%80%CE%BF%CF%85_%CE%A3%CE%BC%CF%8D%CF%81%CE%BD%CE%B7%CF%82#HH-11">Μαρτύριο τοῦ ἁγίου Πολυκάρπου, 11</a>)</p><h3>Αποφυγή εκείνων που οδηγούν σε πλάνη</h3><blockquote><p>ζηλωταὶ περὶ τὸ καλόν, ἀπεχόμενοι τῶν σκανδάλων καὶ τῶν ψευδαδέλφων καὶ τῶν ἐν ὑποκρίσει φερόντων τὸ ὄνομα τοῦ κυρίου, οἵτινες <strong>ἀποπλανῶσι κενοὺς ἀνθρώπους.</strong></p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%95%CF%80%CE%B9%CF%83%CF%84%CE%BF%CE%BB%CE%AE-%CE%A0%CE%BF%CE%BB%CF%85%CE%BA%CE%AC%CF%81%CF%80%CE%BF%CF%85-%CF%80%CF%81%CE%BF%CF%82-%CE%A6%CE%B9%CE%BB%CE%B9%CF%80%CF%80%CE%B7%CF%83%CE%AF%CE%BF%CF%85%CF%82#HH-6">Πρὸς Φιλιππησίους, 6</a>)</p><h3>Η νηστεία</h3><blockquote><p>νήφοντες πρὸς τὰς εὐχὰς καὶ <strong><mark>προσκαρτεροῦντες νηστείαις,</mark></strong> δεήσεσιν αἰτούμενοι τὸν παντεπόπτην θεὸν μὴ εἰσενεγκεῖν ἡμᾶς εἰς πειρασμόν, καθὼς εἶπεν ὁ κύριος· Τὸ μὲν πνεῦμα πρόθυμον, ἡ δὲ σὰρξ ἀσθενής.</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%95%CF%80%CE%B9%CF%83%CF%84%CE%BF%CE%BB%CE%AE-%CE%A0%CE%BF%CE%BB%CF%85%CE%BA%CE%AC%CF%81%CF%80%CE%BF%CF%85-%CF%80%CF%81%CE%BF%CF%82-%CE%A6%CE%B9%CE%BB%CE%B9%CF%80%CF%80%CE%B7%CF%83%CE%AF%CE%BF%CF%85%CF%82#HH-7">Πρὸς Φιλιππησίους, 7</a>)</p><h3>Προσευχή για τις αρχές</h3><blockquote><p>Pro omnibus sanctis orate. Orate etiam pro <strong>regibus et potestatibus et principibus</strong> atque pro persequentibus et odientibus vos et pro inimicis crucis, ut fructus vester manifestus sit in omnibus, ut sitis in illo perfecti.</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%95%CF%80%CE%B9%CF%83%CF%84%CE%BF%CE%BB%CE%AE-%CE%A0%CE%BF%CE%BB%CF%85%CE%BA%CE%AC%CF%81%CF%80%CE%BF%CF%85-%CF%80%CF%81%CE%BF%CF%82-%CE%A6%CE%B9%CE%BB%CE%B9%CF%80%CF%80%CE%B7%CF%83%CE%AF%CE%BF%CF%85%CF%82#HH-12">Πρὸς Φιλιππησίους, 12</a> · τὸ χωρίον 12,3 σώζεται μόνο στὰ λατινικά)</p><h3>Οι πιστοί τιμούσαν τον Πολύκαρπο</h3><blockquote><p>ὅτε δὲ ἡ πυρκαϊὰ ἡτοιμάσθη, ἀποθέμενος ἑαυτῷ πάντα τὰ ἱμάτια καὶ λύσας τὴν ζώνην ἐπειρᾶτο καὶ ὑπολύειν ἑαυτόν, μὴ πρότερον τοῦτο ποιῶν διὰ τὸ ἀεὶ <strong><mark>ἕκαστον τῶν πιστῶν σπουδάζειν, ὅστις τάχιον τοῦ χρωτὸς αὐτοῦ ἅψηται·</mark></strong> <strong>παντὶ γὰρ καλῷ ἀγαθῆς ἕνεκεν πολιτείας</strong> <strong><mark>καὶ πρὸ τῆς μαρτυρίας ἐκεκόσμητο.</mark></strong></p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%9C%CE%B1%CF%81%CF%84%CF%8D%CF%81%CE%B9%CE%BF_%CF%84%CE%BF%CF%85_%CE%91%CE%B3%CE%AF%CE%BF%CF%85_%CE%A0%CE%BF%CE%BB%CF%85%CE%BA%CE%AC%CF%81%CF%80%CE%BF%CF%85_%CE%95%CF%80%CE%B9%CF%83%CE%BA%CF%8C%CF%80%CE%BF%CF%85_%CE%A3%CE%BC%CF%8D%CF%81%CE%BD%CE%B7%CF%82#HH-13">Μαρτύριο τοῦ ἁγίου Πολυκάρπου, 13</a>)</p><h3>Οι πιστοί τιμούσαν τα λείψανα του Πολυκάρπου</h3><blockquote><p><em><em>Ὁ δὲ ἀντίζηλος καὶ βάσκανος καὶ πονηρός, ὁ ἀντικείμενος τῷ γένει τῶν δικαίων, ἰδὼν τό τε μέγεθος αὐτοῦ τῆς μαρτυρίας καὶ τὴν ἀπ’ ἀρχῆς ἀνεπίληπτον πολιτείαν, ἐστεφανωμένον τε τὸν τῆς ἀφθαρσίας στέφανον καὶ βραβεῖον ἀναντίρρητον ἀπενηνεγμένον, ἐπετήδευσεν,</em> ὡς μηδὲ τὸ σωμάτιον αὐτοῦ ὑφ’ ἡμῶν ληφθῆναι, καίπερ πολλῶν ἐπιθυμούντων τοῦτο ποιῆσαι καὶ κοινωνῆσαι τῷ ἁγίῳ αὐτοῦ σαρκίῳ. <em>ὑπέβαλεν γοῦν Νικήτην τὸν τοῦ Ἡρώδου πατέρα, ἀδελφὸν δὲ Ἄλκης, ἐντυχεῖν τῷ ἄρχοντι, ὥστε μὴ δοῦναι αὐτοῦ τὸ σῶμα·</em> μή, φησίν, ἀφέντες τὸν ἐσταυρωμένον τοῦτον ἄρξωνται σέβεσθαι. καὶ ταῦτα εἶπον ὑποβαλλόντων καὶ ἐνισχυόντων τῶν Ἰουδαίων, οἳ καὶ ἐτήρησαν, μελλόντων ἡμῶν ἐκ τοῦ πυρὸς αὐτὸν λαμβάνειν· ἀγνοοῦντες, ὅτι οὔτε τὸν Χριστόν ποτε καταλιπεῖν δυνησόμεθα, τὸν ὑπὲρ τῆς τοῦ παντὸς κόσμου τῶν σωζομένων σωτηρίας παθόντα ἄμωμον ὑπὲρ ἁμαρτωλῶν, οὔτε ἕτερόν τινα σέβεσθαι. τοῦτον μὲν γὰρ υἱὸν ὄντα τοῦ θεοῦ προσκυνοῦμεν, τοὺς δὲ μάρτυρας ὡς μαθητὰς καὶ μιμητὰς τοῦ κυρίου ἀγαπῶμεν ἀξίως ἕνεκα εὐνοίας ἀνυπερβλήτου τῆς εἰς τὸν ἴδιον βασιλέα καὶ διδάσκαλον· ὧν γένοιτο καὶ ἡμᾶς κοινωνούς τε καὶ συμμαθητὰς γενέσθαι.</em> <em><em>Ἰδὼν οὖν ὁ κεντυρίων τὴν τῶν Ἰουδαίων γενομένην φιλονεικίαν,</em> θεὶς αὐτὸν ἐν μέσῳ, ὡς ἔθος αὐτοῖς, ἔκαυσεν. οὕτως τε ἡμεῖς ὕστερον ἀνελόμενοι τὰ τιμιώτερα λίθων πολυτελῶν καὶ δοκιμώτερα ὑπὲρ χρυσίον ὀστᾶ αὐτοῦ ἀπεθέμεθα, ὅπου καὶ ἀκόλουθον ἦν. ἔνθα ὡς δυνατὸν ἡμῖν συναγομένοις ἐν ἀγαλλιάσει καὶ χαρᾷ παρέξει ὁ κύριος ἐπιτελεῖν τὴν τοῦ μαρτυρίου αὐτοῦ ἡμέραν γενέθλιον, εἴς τε τὴν τῶν προηθληκότων μνήμην καὶ τῶν μελλόντων ἄσκησίν τε καὶ ἑτοιμασίαν.</em> <em>Τοιαῦτα τὰ κατὰ τὸν μακάριον Πολύκαρπον, ὃς σὺν τοῖς ἀπὸ Φιλαδελφίας δωδέκατος ἐν Σμύρνῃ μαρτυρήσας, <em>μόνος ὑπὸ πάντων μᾶλλον μνημονεύεται, ὥστε καὶ ὑπὸ τῶν ἐθνῶν ἐν παντὶ τόπῳ λαλεῖσθαι· οὐ μόνον διδάσκαλος γενόμενος ἐπίσημος, ἀλλὰ καὶ μάρτυς ἔξοχος,</em> οὗ τὸ μαρτύριον πάντες ἐπιθυμοῦσιν μιμεῖσθαι κατὰ τὸ εὐαγγέλιον Χριστοῦ γενόμενον.</em></p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%9C%CE%B1%CF%81%CF%84%CF%8D%CF%81%CE%B9%CE%BF_%CF%84%CE%BF%CF%85_%CE%91%CE%B3%CE%AF%CE%BF%CF%85_%CE%A0%CE%BF%CE%BB%CF%85%CE%BA%CE%AC%CF%81%CF%80%CE%BF%CF%85_%CE%95%CF%80%CE%B9%CF%83%CE%BA%CF%8C%CF%80%CE%BF%CF%85_%CE%A3%CE%BC%CF%8D%CF%81%CE%BD%CE%B7%CF%82#HH-17">Μαρτύριο τοῦ ἁγίου Πολυκάρπου, 17</a>)</p>
    references: |-
      <p>Τα αποσπάσματα από την Επιστολή προς Φιλιππησίους, το Μαρτύριο του αγίου Πολυκάρπου και την «Εκκλησιαστική Ιστορία» του Ευσεβίου παρατίθενται αυτολεξεί από τα ελληνικά κείμενα που είναι δημοσιευμένα στον ιστότοπο· η στίξη και οι τόνοι διατηρούνται, ενώ η αρίθμηση των παραγράφων παραλείπεται. Οι υπογραμμίσεις ακολουθούν το ρωσικό κείμενο. Τα δύο αποσπάσματα του Ειρηναίου (Κατὰ αἱρέσεων III 3, 4 και III 4) και τα τροπάριο και κοντάκιο του αγίου δεν σώζονται στον ιστότοπο σε ελληνική έκδοση, γι’ αυτό μεταφράστηκαν από το ρωσικό κείμενο (τα υμνογραφικά σε λειτουργικό ύφος).</p><p>Μετάφραση: Ροντιόν Βλάσοφ, με χρήση τεχνητής νοημοσύνης, από τη <a href="https://bibleox.com/grc/ru/w/%D0%9F%D0%BE%D0%BB%D0%B8%D0%BA%D0%B0%D1%80%D0%BF_%D0%A1%D0%BC%D0%B8%D1%80%D0%BD%D1%81%D0%BA%D0%B8%D0%B9">ρωσική σελίδα αναφοράς</a>.</p>
