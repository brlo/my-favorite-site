    title_sub: "ιερομάρτυς (69-155), επίσκοπος Σμύρνης, μαθητής του αποστόλου Ιωάννου του Θεολόγου"
    meta_desc: "Ο άγιος Πολύκαρπος Σμύρνης, αποστολικός πατέρας και ιερομάρτυς του 2ου αιώνα: ο βίος του, η διδασκαλία του κατά των αιρέσεων, η επιστολή προς Φιλιππησίους και το μαρτύριό του."
