    meta_desc: "Ο άγιος Ιγνάτιος ο Θεοφόρος, επίσκοπος Αντιοχείας και ιερομάρτυς του 1ου-2ου αιώνα: ο βίος του, οι επιστολές του, η διδασκαλία του περί Χριστού, της Ευχαριστίας και της Εκκλησίας, και το πρόβλημα της χρονολογήσεως των κειμένων."
