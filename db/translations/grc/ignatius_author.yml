    body: |-
      <p>Τα έργα του Ιγνατίου του Θεοφόρου <strong>στο ελληνικό πρωτότυπο</strong>: <a href="https://bibleox.com/grc/grc/w/%CE%99%CE%B3%CE%BD%CE%98_%CE%95%CF%86">Πρὸς Ἐφεσίους</a>, <a href="https://bibleox.com/grc/grc/w/%CE%99%CE%B3%CE%BD%CE%98_%CE%9C%CE%B1%CE%B3">Πρὸς Μαγνησιεῖς</a>, <a href="https://bibleox.com/grc/grc/w/%CE%99%CE%B3%CE%BD%CE%98_%CE%A4%CF%81%CE%B1%CE%BB">Πρὸς Τραλλιανούς</a>, <a href="https://bibleox.com/grc/grc/w/%CE%99%CE%B3%CE%BD%CE%98_%CE%A1%CF%89%CE%BC">Πρὸς Ῥωμαίους</a>, <a href="https://bibleox.com/grc/grc/w/%CE%99%CE%B3%CE%BD%CE%98_%CE%A6%CE%B9%CE%BB">Πρὸς Φιλαδελφεῖς</a>, <a href="https://bibleox.com/grc/grc/w/%CE%99%CE%B3%CE%BD%CE%98_%CE%A3%CE%BC">Πρὸς Σμυρναίους</a>, <a href="https://bibleox.com/grc/grc/w/%CE%99%CE%B3%CE%BD%CE%98_%CE%A0%CE%BF%CE%BB">Πρὸς Πολύκαρπον</a>. Η εναλλαγή γλώσσας είναι επίσης διαθέσιμη πάνω από τον κατάλογο των έργων.</p><p><strong>Η μνήμη του</strong>: 20 Δεκεμβρίου (2 Ιανουαρίου), 29 Ιανουαρίου (11 Φεβρουαρίου)</p><h2>Βιογραφία</h2><p>Για τη ζωή του Ιγνατίου γνωρίζουμε λίγα. Υπάρχει παράδοση ότι ήταν εκείνο το βρέφος που ο Χριστός πήρε στην αγκαλιά του και ευλόγησε (<a href="https://bibleox.com/grc/gr-lxx-byz/mf/18/#L2-5">Ματθ. 18:2-5</a>). Οι περισσότεροι όμως ερευνητές το θεωρούν επινόηση.</p><p>Μερικοί πιστεύουν, με βάση το ύφος της γλώσσας των επιστολών του, ότι ήταν Σύρος. Είναι φανερό ότι υπήρξε ένας από τους πρώτους χριστιανούς συγγραφείς μη εβραϊκής καταγωγής ή, τουλάχιστον, έξω από την ιουδαϊκή θρησκευτική παιδεία. Σύμφωνα με την «Εκκλησιαστική Ιστορία» του Ευσεβίου Καισαρείας, συνελήφθη στην Αντιόχεια επί Τραϊανού και στάλθηκε στη Ρώμη για εκτέλεση. Στον δρόμο έγραψε επτά επιστολές στις χριστιανικές κοινότητες από τις οποίες περνούσε (Ἔφεσο, Μαγνησία, Τράλλεις, Φιλαδέλφεια, Σμύρνα και Ρώμη), καθώς και <a href="https://bibleox.com/grc/grc/w/%CE%99%CE%B3%CE%BD%CE%98_%CE%A0%CE%BF%CE%BB">μία επιστολή</a> στον <a href="https://bibleox.com/grc/grc/w/%CE%A0%CE%BF%CE%BB%CF%8D%CE%BA%CE%B1%CF%81%CF%80%CE%BF%CF%82_%CE%A3%CE%BC%CF%8D%CF%81%CE%BD%CE%B7%CF%82">Πολύκαρπο Σμύρνης</a>. Φτάνοντας στη Ρώμη, ρίχτηκε στα λιοντάρια στις 20 Δεκεμβρίου του 107.</p><p>Ο Πολύκαρπος γράφει για την επιστολή του Ιγνατίου:</p><blockquote><p><strong>Ἐγράψατέ μοι καὶ ὑμεῖς καὶ Ἰγνάτιος</strong>, ἵν’, ἐάν τις ἀπέρχηται εἰς Συρίαν, καὶ τὰ παρ’ ὑμῶν ἀποκομίσῃ γράμματα</p></blockquote><p>Ο Πολύκαρπος συγκεντρώνει τις επιστολές του Ιγνατίου και ό,τι είναι γνωστό γι’ αυτόν, αντιγράφοντας και διαδίδοντας τα έργα αυτά:</p><blockquote><p><strong>τὰς ἐπιστολὰς Ἰγνατίου τὰς πεμφθείσας ἡμῖν ὑπ’ αὐτοῦ καὶ ἄλλας</strong>, ὅσας εἴχομεν παρ’ ἡμῖν, <strong>ἐπέμψαμεν ὑμῖν</strong>, καθὼς ἐνετείλασθε· αἵτινες ὑποτεταγμέναι εἰσὶν τῇ ἐπιστολῇ ταύτῃ, ἐξ ὧν μεγάλα ὠφεληθῆναι δυνήσεσθε. περιέχουσι γὰρ πίστιν καὶ ὑπομονὴν καὶ πᾶσαν οἰκοδομὴν τὴν εἰς τὸν κύριον ἡμῶν ἀνήκουσαν. <strong>Et de ipso Ignatio et de his, qui cum eo sunt, quod certius agnoveritis, significate</strong></p></blockquote><p>Για τον Ιγνάτιο γράφει διεξοδικά και ο Ευσέβιος Καισαρείας (3ος-4ος αιώνας), απαριθμώντας τις 7 επιστολές του και παραθέτοντας μερικές «κατά λέξη»:</p><blockquote><p>οὕτω δῆτα ἐν Σμύρνῃ γενόμενος, ἔνθα ὁ Πολύκαρπος ἦν, μίαν μὲν τῇ κατὰ τὴν <strong>Ἔφεσον</strong> ἐπιστολὴν ἐκκλησίᾳ γράφει, ποιμένος αὐτῆς μνημονεύων Ὀνησίμου, ἑτέραν δὲ τῇ ἐν <strong>Μαγνησίᾳ</strong> τῇ πρὸς Μαιάνδρῳ, ἔνθα πάλιν ἐπισκόπου ∆αμᾶ μνήμην πεποίηται, καὶ τῇ ἐν <strong>Τράλ3.λεσι</strong> δὲ ἄλλην, ἧς ἄρχοντα τότε ὄντα Πολύβιον ἱστορεῖ</p><p>πρὸς ταύταις καὶ τῇ <strong>Ῥωμαίων</strong> ἐκκλησίᾳ γράφει, ᾗ καὶ παράκλησιν προτείνει ὡς μὴ παραιτησάμενοι τοῦ μαρτυρίου τῆς ποθουμένης αὐτὸν ἀποστερήσαιεν ἐλπίδος· ἐξ ὧν καὶ βραχύτατα εἰς ἐπίδειξιν τῶν εἰρημένων παραθέσθαι ἄξιον. γράφει δὴ οὖν κατὰ λέξιν·</p><p>(παρατίθεται τὸ πλεῖστον τῆς ἐπιστολῆς)</p><p>καὶ ταῦτα μὲν ἀπὸ τῆς δηλωθείσης πόλεως ταῖς καταλεχθείσαις ἐκκλησίαις διετυπώσατο· ἤδη δ' ἐπέκεινα τῆς Σμύρνης γενόμενος, ἀπὸ Τρωάδος τοῖς τε ἐν <strong>Φιλαδελφίᾳ</strong> αὖθις διὰ γραφῆς ὁμιλεῖ καὶ <strong>τῇ Σμυρναίων</strong> ἐκκλησίᾳ ἰδίως τε τῷ ταύτης προηγουμένῳ <strong>Πολυκάρπῳ</strong>· ὃν οἷα δὴ ἀποστολικὸν ἄνδρα εὖ μάλα γνωρίζων, τὴν κατ' Ἀντιόχειαν αὐτῷ ποίμνην οἷα γνήσιος καὶ ἀγαθὸς ποιμὴν παρατίθεται, τὴν περὶ αὐτῆς φροντίδα διὰ σπου δῆς ἔχειν αὐτὸν ἀξιῶν</p><p>ὁ δ' αὐτὸς Σμυρναίοις γράφων, οὐκ οἰδ' ὁπόθεν ῥητοῖς συγκέχρηται, τοιαῦτά τινα περὶ τοῦ Χριστοῦ διεξιών· «ἐγὼ δὲ καὶ μετὰ τὴν ἀνάστασιν ἐν σαρκὶ αὐτὸν οἶδα καὶ πιστεύω ὄντα. καὶ ὅτε πρὸς τοὺς περὶ Πέτρον ἐλήλυθεν, ἔφη αὐτοῖς. λάβετε, ψηλαφήσατέ με καὶ ἴδετε ὅτι οὐκ εἰμὶ δαιμόνιον ἀσώματον· καὶ εὐθὺς αὐτοῦ ἥψαντο καὶ ἐπίστευσαν»</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%95%CE%9A%CE%9A%CE%9B%CE%97%CE%A3%CE%99%CE%91%CE%A3%CE%A4%CE%99%CE%9A%CE%97%CE%A3_%CE%99%CE%A3%CE%A4%CE%9F%CE%A1%CE%99%CE%91%CE%A3-3#HH-36">Ἐκκλησιαστικὴ Ἱστορία Γ΄</a>)</p><p>Ο Ευσέβιος παραθέτει επίσης απόσπασμα από χαμένη επιστολή του Ειρηναίου Λουγδούνου (2ος αιώνας), στην οποία ο Ειρηναίος παραθέτει την επιστολή του Ιγνατίου προς Ῥωμαίους:</p><blockquote><p>οἶδεν δὲ αὐτοῦ τὸ μαρτύριον καὶ <strong>ὁ Εἰρηναῖος</strong>, καὶ <strong>τῶν ἐπιστο λῶν αὐτοῦ</strong> μνημονεύει, λέγων οὕτως· «ὡς εἶπέν τις τῶν ἡμετέρων, διὰ τὴν πρὸς θεὸν μαρτυρίαν κατακριθεὶς πρὸς θηρία, ὅτι σῖτος εἰμι θεοῦ καὶ δι' ὀδόντων θηρίων ἀλήθομαι, ἵνα καθαρὸς ἄρτος εὑρεθῶ»</p><p>καὶ ὁ Πολύκαρπος δὲ τούτων αὐτῶν μέμνηται ἐν τῇ φερομένῃ αὐτοῦ πρὸς Φιλιππησίους ἐπιστολῇ</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%95%CE%9A%CE%9A%CE%9B%CE%97%CE%A3%CE%99%CE%91%CE%A3%CE%A4%CE%99%CE%9A%CE%97%CE%A3_%CE%99%CE%A3%CE%A4%CE%9F%CE%A1%CE%99%CE%91%CE%A3-3#HH-36">Ἐκκλησιαστικὴ Ἱστορία Γ΄</a>)</p><p>Τις επιστολές του Ιγνατίου απαριθμεί και ο άγιος <a href="https://bibleox.com/grc/ru/w/r6fC_%D0%98%D0%B5%D1%80%D0%BE%D0%BD%D0%B8%D0%BC_%D0%A1%D1%82%D1%80%D0%B8%D0%B4%D0%BE%D0%BD%D1%81%D0%BA%D0%B8%D0%B9_IV_%D0%B2%D0%B5%D0%BA">Ιερώνυμος Στριδώνος (ru)</a> (~347-419):</p><blockquote><p><strong>Ιγνάτιος</strong>, τρίτος επίσκοπος της Εκκλησίας της Αντιοχείας μετά τον απόστολο Πέτρο, ήταν <strong>μαθητής του ευαγγελιστή Ιωάννου</strong>. Όταν άρχισε διωγμός, οδηγήθηκε στη Ρώμη και, καταδικασμένος σε θάνατο, ρίχτηκε στα θηρία. Εκεί, ενώ πήγαινε στη Ρώμη, έγραψε επτά επιστολές: στις Εκκλησίες της Ἐφέσου, των Μαγνησίων, των Τράλλεων, των Φιλαδελφέων, των Σμυρναίων και της Ρώμης, καθώς και στον Πολύκαρπο, επίσκοπο της Σμύρνης.</p></blockquote><h2>Πίστη</h2><h3>Ο Χριστός είναι Θεός</h3><blockquote><p>εἷς ἰατρός ἐστιν, <strong>σαρκικός τε καὶ πνευματικός, γεννητὸς καὶ ἀγέννητος</strong>, <strong><mark>ἐν ἀνθρώπῳ θεός</mark></strong>, <strong>ἐν θανάτῳ ζωὴ ἀληθινή, καὶ ἐκ Μαρίας καὶ ἐκ θεοῦ, πρῶτον παθητὸς καὶ τότε ἀπαθής</strong>, <strong><mark>Ἰησοῦς Χριστὸς ὁ κύριος ἡμῶν</mark></strong></p></blockquote><blockquote><p>ὁ γὰρ <strong><mark>θεὸς ἡμῶν Ἰησοῦς ὁ Χριστὸς</mark></strong> ἐκυοφορήθη· ὑπὸ Μαρίας κατ ̓ οἰκονομίαν θεοῦ ἐκ σπέρματος μὲν Δαυείδ, πνεύματος δὲ ἁγίου</p></blockquote><blockquote><p>ὅθεν ἐλύετο πᾶσα μαγεία καὶ πᾶς δεσμὸς ἠφανίζετο κακίας· ἄγνοια καθῃρεῖτο, παλαιὰ βασιλεία διεφθείρετο <strong><mark>θεοῦ ἀνθρωπίνως φανερουμένου</mark></strong> εἰς καινότητα ἀϊδίου ζωῆς</p></blockquote><blockquote><p>ὁ γὰρ <strong><mark>θεὸς ἡμῶν Ἰησοῦς Χριστὸς</mark></strong> ἐν πατρὶ ὢν μᾶλλον φαίνεται</p></blockquote><blockquote><p>Δοξάζω <strong><mark>Ἰησοῦν Χριστὸν τὸν θεὸν</mark></strong> τὸν οὕτως ὑμᾶς σοφίσαντα· ἐνόησα γὰρ ὑμᾶς κατηρτισμένους ἐν ἀκινήτῳ πίστει, ὥσπερ καθηλωμένους ἐν τῷ· σταυρῷ· τοῦ κυρίου Ἰησοῦ Χριστοῦ σαρκί τε καὶ πνεύματι καὶ ἡδρασμένους ἐν ἀγάπῃ ἐν τῷ· αἵματι Χριστοῦ, πεπληροφορημένους εἰς τὸν κύριον ἡμῶν, ἀληθῶς ὄντα ἐκ γένους Δαυεὶδ κατὰ σάρκα</p></blockquote><blockquote><p>ἀσπάζομαι τὸν μέλλοντα καταξιοῦσθαι τοῦ εἰς Συρίαν πορεύεσθαι. ἔσται ἡ χάρις μετ ̓ αὐτοῦ διὰ παντὸς καὶ τοῦ πέμποντος αὐτὸν Πολυκάρπου. ἐρρῶσθαι ὑμᾶς διὰ παντὸς ἐν <strong><mark>θεῷ· ἡμῶν Ἰησοῦ Χριστῷ</mark></strong></p></blockquote><h3>Ο Θεός γεννήθηκε από τη Μαρία</h3><blockquote><p>εἷς ἰατρός ἐστιν, <strong>σαρκικός τε καὶ πνευματικός</strong>, <strong><mark>γεννητὸς</mark></strong> <strong>καὶ ἀγέννητος</strong>, <strong><mark>ἐν ἀνθρώπῳ θεός</mark></strong>, <strong>ἐν θανάτῳ ζωὴ ἀληθινή</strong>, καὶ <strong><mark>ἐκ Μαρίας</mark></strong> <strong>καὶ ἐκ θεοῦ, πρῶτον παθητὸς καὶ τότε ἀπαθής</strong>, <strong><mark>Ἰησοῦς Χριστὸς ὁ κύριος ἡμῶν</mark></strong></p></blockquote><h3>Η Ευχαριστία δεν είναι τύπος, αλλά αληθινή σάρκα και αίμα του Ιησού Χριστού</h3><p>Ο Ιγνάτιος ο Θεοφόρος κατηγορεί τους αιρετικούς ότι δεν πιστεύουν πως η Ευχαριστία είναι η σάρκα του Ιησού Χριστού, που έπαθε και την οποία ανέστησε ο Πατήρ. Ο Ιγνάτιος λέει ότι οι αιρετικοί δεν το πιστεύουν αυτό. Δύσκολα θα μπορούσε να εννοεί ότι οι αιρετικοί δεν πιστεύουν πως η Ευχαριστία είναι απλώς τύπος της σάρκας (συμβολικά) — η απιστία σε ένα σύμβολο είναι αδιανόητη. Δεν πιστεύουν ακριβώς ότι στην Ευχαριστία βρίσκεται η παθητή και αναστημένη σάρκα του Χριστού, όπως λέγεται στη συνέχεια.</p><blockquote><p><em>Μηδεὶς πλανάσθω· καὶ τὰ ἐπουράνια καὶ ἡ δόξα τῶν ἀγγέλων καὶ οἱ ἄρχοντες ὁρατοί τε καὶ ἀόρατοι</em>, <em><strong><mark>ἐὰν μὴ πιστεύσωσιν εἰς τὸ αἷμα Χριστοῦ, κἀκείνοις κρίσις ἐστίν</mark></strong></em>· <em>ὁ χωρῶν χωρείτω … Εὐχαριστίας καὶ προσευχῆς ἀπέχονται, διὰ τὸ μὴ ὁμολογεῖν</em> <em><strong><mark>τὴν εὐχαριστίαν σάρκα εἶναι τοῦ σωτῆρος ἡμῶν Ἰησοῦ Χριστοῦ τὴν ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν παθοῦσαν, ἣν τῇ χρηστότητι ὁ πατὴρ ἤγειρεν</mark></strong></em>. <em>οἱ ουͅν ἀντιλέγοντες τῇ δωρεᾷ· τοῦ θεοῦ</em> <em>συζητοῦντες</em> <em><strong>ἀποθνήσκουσιν</strong></em></p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%B3%CE%BD%CE%98_%CE%A3%CE%BC">Πρὸς Σμυρναίους</a>)</p><h3>Ο χριστιανός δεν θεωρεί τον εαυτό του σωσμένο</h3><blockquote><p><strong><mark>ἡ μὲν γὰρ ἀρχὴ εὐοικονόμητός ἐστιν</mark></strong>, <strong><mark><u>ἐάνπερ χάριτος ἐπιτὑχω</u></mark></strong> <strong><mark>εἰς τὸ τὸν κλῆρόν μου ἀνεμποδίστως ἀπολαβεῖν</mark></strong> φοβοῦμαι γὰρ τὴν ὑμῶν ἀγάπην, μὴ αὐτή με ἀδικήσῃ. ὑμῖν γὰρ εὐχερές ἐστιν, ὃ θέλετε, ποιῆσαι· <strong><mark>ἐμοὶ δὲ δύσκολόν ἐστιν τοῦ θεοῦ ἐπιτυχεῖν</mark></strong>, ἐάνπερ ὑμεῖς μὴ φείσησθέ μου <strong><mark>αἰτήσασθε περί ἐμοῦ, ἵνα ἐπιτύχω</mark></strong>. οὐ κατὰ σάρκα ὑμῖν ἔγραψα, ἀλλὰ κατὰ γνώμην θεοῦ. ἐὰν πάθω, ἠθελήσατε· ἐὰν ἀποδοκιμασθῶ, ἐμισήσατε <strong>ἐγὼ δὲ αἰσχύνομαι ἐξ αὐτῶν λέγεσθαι· οὐδὲ γὰρ ἄξιός εἰμι, ὢν ἔσχατος αὐτῶν καὶ ἔκτρωμα</strong>· <strong><mark>ἀλλ</mark></strong> ̓ <strong><mark>ἠλέημαί τις εἶναι</mark></strong>, <strong><mark><u>ἐὰν θεοῦ ἐπιτύχω</u></mark></strong>. ἀσπάζεται ὑμᾶς τὸ ἐμὸν πνεῦμα καὶ ἡ ἀγάπη· τῶν ἐκκλησιῶν τῶν δεξαμένων με εἰς ὄνομα Ἰησοῦ Χριστοῦ, οὐχ ὡς παροδεύοντα</p></blockquote><h3>Ο χριστιανός αναγνωρίζεται από τα έργα</h3><blockquote><p>οὐδεὶς πίστιν ἐπαγγελλόμενος ἁμαρτάνει, οὐδὲ ἀγάπην κεκτημένος μισεῖ. φανερὸν τὸ δένδρον ἀπὸ τοῦ καρποῦ αὐτοῦ. οὕτως <strong><mark>οἱ ἐπαγγελλόμενοι Χριστοῦ εἶναι</mark></strong> <strong><mark><u>δι ̓ ὧν πράσσουσιν ὀφθήσονται</u></mark></strong>. οὐ γὰρ νῦν ἐπαγγελίας τὸ ἔργον, ἀλλ ̓ ἐν δυνάμει πίστεως ἐάν τις εὑρεθῇ εἰς τέλος <strong><mark>Ἄμεινόν ἐστιν σιωπᾶν καὶ εἶναι, ἢ λαλοῦντα μὴ εἶναι</mark></strong>. καλὸν τὸ διδάσκειν, ἐὰν ὁ λέγων ποιῇ</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%B3%CE%BD%CE%98_%CE%95%CF%86">Πρὸς Ἐφεσίους</a>)</p><blockquote><p>τὸ βάπτισμα ὑμῶν μενέτω ὡς ὅπλα, ἡ πίστις ὡς περικεφαλαία, ἡ ἀγάπη· ὡς δόρυ, ἡ ὑπομονὴ ὡς πανοπλία. <strong><mark>τὰ δεπόσιτα ὑμῶν τὰ ἔργα</mark></strong> <strong>ὑμῶν</strong>, <strong><mark>ἵνα</mark></strong> <strong>τὰ ἄκκεπτα</strong> <strong><mark>ὑμῶν</mark></strong> <strong>ἄξια</strong> <strong><mark>κομίσησθε</mark></strong></p></blockquote><h3>Τα παθήματα για τον Χριστό είναι σημείο εγγύτητας προς τον Θεό</h3><blockquote><p>τί δὲ καὶ ἑαυτὸν ἔκδοτον δέδωκα τῷ· θανάτῳ, πρὸς πῦρ, πρὸς μάχαιραν, πρὸς θηρία; ἀλλ ̓ <strong>ἐγγὺς μαχαίρας ἐγγὺς θεοῦ, μεταξὺ θηρίων μεταζὺ θεοῦ· μόνον ἐν τῷ· ὀνόματι Ἰησοῦ Χριστοῦ</strong> εἰς τὸ συμπαθεῖν αὐτῷ· πάντα ὑπομένω, αὐτοῦ με ἐνδυναμοῦντος τοῦ τελείου ἀνθρώπου</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%B3%CE%BD%CE%98_%CE%A3%CE%BC#HH-4">Πρὸς Σμυρναίους</a>)</p><h3>Χωρίς επίσκοπο, πρεσβυτέρους και διακόνους δεν υπάρχει Εκκλησία</h3><p>Δηλαδή μια απλή συνάθροιση δύο ή τριών δεν είναι Εκκλησία:</p><blockquote><p><em><strong>Ὁμοίως πάντες</strong></em> <em><strong><mark>ἐντρεπέσθωσαν τοὺς διακόνους</mark></strong></em> <em><strong>ὡς Ἰησοῦν Χριστόν</strong></em>, ὡς καὶ <em><strong><mark>τὸν ἐπίσκοπον</mark></strong></em> <em><strong>ὄντα τύπον τοῦ πατρός</strong></em>, <em><strong><mark>τοὺς δὲ πρεσβυτέρους</mark></strong></em> <em><strong>ὡς συνέδριον θεοῦ καὶ ὡς σύνδεσμον ἀποστόλων</strong></em>. <em><strong><mark>χωρὶς τούτων ἐκκλησία οὐ καλεῖται</mark></strong></em>. <em>περὶ ὧν πέπεισμαι ὑμᾶς οὕτως ἔχειν</em></p><p><em>&lt;…&gt;</em></p><p><em>Παρακαλῶ οὖν ὑμᾶς, οὐκ ἐγώ, ἀλλ ̓ ἡ ἀγάπη· Ἰησοῦ Χριστοῦ· μόνῃ τῇ χριστιανῇ τροφῇ χρῆσθε, ἀλλοτρίας δὲ βοτάνης ἀπέχεσθε, ἥτις ἐστὶν αἵρεσις</em>· <em><strong>οἳ ἑαυτοῖς παρεμπλέκουσιν Ἰησοῦν Χριστὸν καταξιοπιστευόμενοι, ὥσπερ θανάσιμον φάρμακον διδόντες μετὰ οἰνομέλιτος, ὅπερ ὁ ἀγνοῶν ἡδέως λαμβάνει ἐν ἡδονῇ κακῇ τὸ ἀποθανεῖν</strong></em></p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%B3%CE%BD%CE%98_%CE%A4%CF%81%CE%B1%CE%BB#HH-3">Πρὸς Τραλλιανούς</a>)</p><blockquote><p><em>Πάντες τῷ· ἐπισκόπῳ ἀκολουθεῖτε, ὡς Ἰησοῦς Χριστὸς τῷ· πατρί, καὶ τῷ· πρεσβυτερίῳ ὡς τοῖς ἀποστόλοις. τοὺς δὲ διακόνους ἐντρέπεσθε ὡς θεοῦ ἐντολήν</em> <em><strong>μηδεὶς χωρὶς τοῦ ἐπισκόπου τι πρασσέτω τῶν ἀνηκόντων εἰς τὴν ἐκκλησίαν</strong></em> <em><strong>ἐκείνη· βεβαία εὐχαριστία ἡγείσθω</strong></em>, <em><strong>ἡ ὑπὸ ἐπίσκοπον οὖσα ἢ ᾧ ἂν αὐτὸς ἐπιτρέψῃ</strong></em> <em><strong><mark><u>ὅπου ἂν φανῇ ὁ ἐπίσκοπος</u></mark></strong></em>, <em><strong><mark>ἐκεῖ τὸ πλῆθος ἤτω, ὥσπερ ὅπου ἂν ᾖ Ἰησοῦς Χριστός</mark></strong></em>, <em><strong><mark><u>ἐκεῖ ἡ καθολικὴ ἐκκλησία</u></mark></strong></em> <em>οὐκ ἐξόν ἐστιν χωρὶς τοῦ ἐπισκόπου οὔτε βαπτίζειν οὔτε ἀγάπην ποιεῖν· ἀλλ ̓ ὃ ἂν ἐκεῖνος δοκιμάσῃ, τοῦτο καὶ τῷ· θεῷ· εὐάρεστον, ἵνα ἀσφαλὲς ᾖ καὶ βέβαιον πᾶν ὃ πράσσετε καλῶς ἔχει, θεὸν καὶ ἐπίσκοπον εἰδέναι. ὁ τιμῶν ἐπίσκοπον ὑπὸ θεοῦ τετίμηται</em> <em><strong><mark>ὁ λάθρα ἐπισκόπου τι πράσσων τῷ· διαβόλῳ λατρεύει</mark></strong></em></p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%B3%CE%BD%CE%98_%CE%A3%CE%BC">Πρὸς Σμυρναίους</a>)</p><blockquote><p><em><strong><mark>Τῷ· ἐπισκόπῳ προσέχετε, ἵνα καὶ ὁ θεὸς ὑμῖν</mark></strong></em>. <em><strong>ἀντίψυχον ἐγὼ τῶν ὑποτασσομένων τῷ· ἐπισκόπῳ, πρεσβυτέροις</strong></em>, <em>διακόνοις</em></p><p><em><strong>καὶ μετ ̓ αὐτῶν μοι τὸ μέρος γένοιτο σχεῖν ἐν θεῷ</strong></em>·. <em>συγκοπιᾶτε ἀλλήλοις, συναθλεῖτε, συντρέχετε, συμπάσχετε</em></p><p><em>συγκοιμᾶσθε, συνεγείρεσθε ὡς θεοῦ οἰκονόμοι καὶ πάρεδροι καὶ ὑπηρέται</em></p><p><em>...</em></p><p><em>ἐρρῶσθαι ὑμᾶς διὰ παντὸς ἐν θεῷ· ἡμῶν Ἰησοῦ Χριστῷ· εὔχομαι</em>, <em><strong>ἐν ᾧ διαμείνητε ἐν ἑνότητι θεοῦ καὶ ἐπισκοπῇ</strong></em></p><p><em>...</em></p><p><em>εἴ τις δύναται ἐν ἁγνείᾳ μένειν εἰς τιμὴν τῆς σαρκὸς τοῦ κυρίου, ἐν ἀκαυχησίᾳ μενέτω</em></p><p><em><strong><mark>ἐὰν καυχήσηται, ἀπώλετο, καὶ ἐὰν γνωσθῇ πλέον τοῦ ἐπισκόπου, ἔφθαρται</mark></strong></em></p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%B3%CE%BD%CE%98_%CE%A0%CE%BF%CE%BB#HH-6">Πρὸς Πολύκαρπον</a>)</p><h3>Η τριμερής ιεραρχία (επίσκοπος, πρεσβύτεροι και διάκονοι)</h3><p>Ο άγιος Ιγνάτιος γράφει ότι η Εκκλησία της Συρίας έμεινε χωρίς επίσκοπο, αν και οι πρεσβύτεροι είναι πολλοί, ενώ επίσκοπος της Συρίας ήταν μόνον ο ίδιος ο Ιγνάτιος, τώρα συλληφθείς και σταλμένος στη Ρώμη για εκτέλεση. Και είναι φανερό ότι οι πρεσβύτεροι δεν μπορούν να χειροτονήσουν επίσκοπο, αλλιώς θα το είχαν κάνει σύντομα και η Συρία δεν θα έμενε χωρίς επίσκοπο:</p><blockquote><p>Μνημονεύετε ἐν τῇ προσευχῇ ὑμῶν <strong><mark>τῆς ἐν Συρίᾳ ἐκκλησίας, ἥτις ἀντὶ ἐμοῦ ποιμένι τῷ· θεῷ· χρῆται</mark></strong>. <strong>μόνος αὐτὴν Ἰησοῦς Χριστὸς ἐπισκοπήσει</strong> καὶ ἡ ὑμῶν ἀγάπη</p></blockquote><p>Αξίζει να προσέξουμε ότι ο επίσκοπος αναφέρεται πάντα στον ενικό, ενώ οι πρεσβύτεροι και οι διάκονοι στον πληθυντικό (το ίδιο και <a href="https://bibleox.com/grc/la/w/Tertullianus">στον Τερτυλλιανό</a>). Δηλαδή σε κάθε τόπο υπάρχει μόνο μία κεφαλή της Εκκλησίας — ο επίσκοπος, στον οποίο υπάγονται πολλοί πρεσβύτεροι (κυριολεκτικά: «οι πρεσβύτεροί του») καθώς και διάκονοι:</p><blockquote><p><em>ἣν ἀσπάζομαι ἐν αἵματι Ἰησοῦ Χριστοῦ, ἥτις ἐστὶν χαρὰ αἰώνιος καὶ παράμονος, μάλιστα ἐὰν ἐν ἑνὶ ὦσιν σὺν τῷ</em>· <em><strong><mark>ἐπισκόπῳ καὶ τοῖς σὺν αὐτῷ· πρεσβυτέροις καὶ διακόνοις</mark></strong></em> <em>ἀποδεδειγμένοις ἐν γνώμῃ Ἰησοῦ Χριστοῦ, οὓς κατὰ τὸ ἴδιον θέλημα ἐστήριξεν ἐν βεβαιωσύνῃ τῷ· ἁγίῳ αὐτοῦ πνεύματι … Σπουδάσατε οὖν μιᾷ· εὐχαριστίᾳ χρῆσθαι· μία γὰρ σὰρξ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ καὶ ἓν ποτήριον εἰς ἕνωσιν τοῦ αἵματος αὐτοῦ, ἓν θυσιαστήριον, ὡς</em> <em><strong><mark>εἷς ἐπίσκοπος ἅμα τῷ· πρεσβυτερίῳ καὶ διακόνοις</mark></strong></em> <em>τοῖς συνδούλοις μου· ἵνα, ὃ ἐὰν πράσσητε, κατὰ θεὸν πράσσητε. … ἐκραύγασα μεταξὺ ὤν, ἐλάλουν μεγάλῃ φωνῇ, θεοῦ φωνῇ· Τῷ</em>· <em><strong><mark>ἐπισκόπῳ προσέχετε καὶ τῷ· πρεσβυτερίῳ καὶ διακόνοις</mark></strong></em>. … <em>θέλουσιν δὲ ὑμῖν οὐκ ἔστιν ἀδύνατον ὑπὲρ ὀνόματος θεοῦ, ὡς καὶ αἱ ἔγγιστα ἐκκλησίαι ἔπεμψαν</em> <em><strong><mark>ἐπισκόπους</mark></strong></em>, <em><strong>αἱ δὲ</strong></em> <em><strong><mark>πρεσβυτέρους καὶ διακόνους</mark></strong></em>.</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%B3%CE%BD%CE%98_%CE%A6%CE%B9%CE%BB">Πρὸς Φιλαδελφεῖς</a>)</p><p>Το ίδιο και σε άλλα σημεία: ένας επίσκοπος (τον οποίο συγκρίνει με τον Χριστό) και πολλοί πρεσβύτεροι (τους συγκρίνει με τους αποστόλους) και διάκονοι:</p><blockquote><p><em><strong>Ὁμοίως πάντες</strong></em> <em><strong><mark>ἐντρεπέσθωσαν τοὺς διακόνους</mark></strong></em> <em><strong>ὡς Ἰησοῦν Χριστόν, ὡς καὶ</strong></em> <em><strong><mark>τὸν ἐπίσκοπον</mark></strong></em> <em><strong>ὄντα τύπον τοῦ πατρός,</strong></em> <em><strong><mark>τοὺς δὲ πρεσβυτέρους</mark></strong></em> <em><strong>ὡς συνέδριον θεοῦ καὶ ὡς σύνδεσμον ἀποστόλων.</strong></em> χωρὶς τούτων ἐκκλησία οὐ καλεῖται. <em>περὶ ὧν πέπεισμαι ὑμᾶς οὕτως ἔχειν.</em></p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%B3%CE%BD%CE%98_%CE%A4%CF%81%CE%B1%CE%BB#HH-3">Πρὸς Τραλλιανούς</a>)</p><blockquote><p><em>Πάντες</em> <em><strong><mark>τῷ· ἐπισκόπῳ</mark></strong></em> <em>ἀκολουθεῖτε, ὡς Ἰησοῦς Χριστὸς τῷ· πατρί, καὶ</em> <em><strong><mark>τῷ· πρεσβυτερίῳ</mark></strong></em> <em>ὡς τοῖς ἀποστόλοις.</em> <em><strong><mark>τοὺς δὲ διακόνους</mark></strong></em> <em>ἐντρέπεσθε ὡς θεοῦ ἐντολήν.</em> μηδεὶς χωρὶς τοῦ <em><strong>ἐπισκόπου</strong></em> <em>τι πρασσέτω τῶν ἀνηκόντων εἰς τὴν ἐκκλησίαν. ἐκείνη· βεβαία εὐχαριστία ἡγείσθω, ἡ ὑπὸ ἐπίσκοπον οὖσα ἢ ᾧ ἂν αὐτὸς ἐπιτρέψῃ. ὅπου ἂν φανῇ ὁ ἐπίσκοπος, ἐκεῖ τὸ πλῆθος ἤτω, ὥσπερ ὅπου ἂν ᾖ Ἰησοῦς Χριστός, ἐκεῖ ἡ καθολικὴ ἐκκλησία. οὐκ ἐξόν ἐστιν χωρὶς τοῦ ἐπισκόπου οὔτε βαπτίζειν οὔτε ἀγάπην ποιεῖν· ἀλλ ̓ ὃ ἂν ἐκεῖνος δοκιμάσῃ, τοῦτο καὶ τῷ· θεῷ· εὐάρεστον, ἵνα ἀσφαλὲς ᾖ καὶ βέβαιον πᾶν ὃ πράσσετε. … καλῶς ἔχει, θεὸν καὶ</em> <em><strong>ἐπίσκοπον</strong></em> <em>εἰδέναι. ὁ τιμῶν</em> <em><strong>ἐπίσκοπον</strong></em> <em>ὑπὸ θεοῦ τετίμηται· ὁ λάθρα</em> <em><strong>ἐπισκόπου</strong></em> <em>τι πράσσων τῷ· διαβόλῳ λατρεύει.</em></p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%B3%CE%BD%CE%98_%CE%A3%CE%BC">Πρὸς Σμυρναίους</a>)</p><blockquote><p><em>Τῷ· ἐπισκόπῳ προσέχετε, ἵνα καὶ ὁ θεὸς ὑμῖν. ἀντίψυχον ἐγὼ τῶν ὑποτασσομένων τῷ</em>· <em><strong><mark>ἐπισκόπῳ, πρεσβυτέροις, διακόνοις</mark></strong></em><em>·</em></p><p><em>καὶ μετ ̓ αὐτῶν μοι τὸ μέρος γένοιτο σχεῖν ἐν θεῷ·. συγκοπιᾶτε ἀλλήλοις, συναθλεῖτε, συντρέχετε, συμπάσχετε</em></p><p><em>συγκοιμᾶσθε, συνεγείρεσθε ὡς θεοῦ οἰκονόμοι καὶ πάρεδροι καὶ ὑπηρέται.</em></p><p>...</p><p><em>ἐρρῶσθαι ὑμᾶς διὰ παντὸς ἐν θεῷ· ἡμῶν Ἰησοῦ Χριστῷ· εὔχομαι, ἐν ᾧ διαμείνητε ἐν ἑνότητι θεοῦ </em>καὶ <em><strong>ἐπισκοπῇ</strong></em></p><p>...</p><p><em>εἴ τις δύναται ἐν ἁγνείᾳ μένειν εἰς τιμὴν τῆς σαρκὸς τοῦ κυρίου, ἐν ἀκαυχησίᾳ μενέτω.</em></p><p><em>ἐὰν καυχήσηται, ἀπώλετο, καὶ ἐὰν γνωσθῇ πλέον τοῦ</em> <em><strong>ἐπισκόπου</strong></em><em>, ἔφθαρται.</em></p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%B3%CE%BD%CE%98_%CE%A0%CE%BF%CE%BB#HH-6">Πρὸς Πολύκαρπον</a>)</p><h3>Ο σταυρός είναι το όργανο του Χριστού και των χριστιανών</h3><blockquote><p><strong><mark>ἀναφερόμενοι</mark></strong> <strong>εἰς τὰ ὕψη</strong> διὰ τῆς <strong><mark>μηχανῆς</mark></strong> <strong>Ἰησοῦ Χριστοῦ</strong>, ὅς ἐστιν <strong><mark>σταυρός</mark></strong>, σχοινίῳ χρώμενοι τῷ πνεύματι τῷ ἁγίῳ· ἡ δὲ πίστις ὑμῶν ἀναγωγεὺς ὑμῶν, ἡ δὲ ἀγάπη ὁδὸς ἡ ἀναφέρουσα εἰς Θεόν</p></blockquote><h3>Η αξία της ενότητας της Εκκλησίας</h3><blockquote><p><strong><mark>τῆς ἑνώσεως φρόντιζε, ἧς οὐδὲν ἄμεινον</mark></strong>.</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%B3%CE%BD%CE%98_%CE%A0%CE%BF%CE%BB#HH-1">Πρὸς Πολύκαρπον</a>)</p><blockquote><p><strong><mark>τὴν ἕνωσιν ἀγαπᾶτε</mark></strong>, <strong>τοὺς μερισμοὺς φεύγετε</strong>, μιμηταὶ γίνεσθε Ἰησοῦ Χριστοῦ, ὡς καὶ αὐτὸς τοῦ πατρὸς αὐτοῦ. … Ἐγὼ μὲν οὖν τὸ ἴδιον ἐποίουν ὡς ἄνθρωπος εἰς ἕνωσιν κατηρτισμένος. <strong>οὗ δὲ μερισμός ἐστιν καὶ ὀργῄ, θεὸς οὐ κατοικεῖ</strong>. <strong>πᾶσιν οὖν μετανοοῦσιν ἀφίει ὁ κύριος</strong>, <strong><mark>ἐὰν μετανοήσωσιν εἰς ἑνότητα</mark></strong> <strong>θεοῦ καὶ συνέδριον τοῦ ἐπισκόπου</strong>.</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%B3%CE%BD%CE%98_%CE%A6%CE%B9%CE%BB">Πρὸς Φιλαδελφεῖς</a>)</p><blockquote><p>καταξιωθεὶς γὰρ ὀνόματος θεοπρεπεστάτου, ἐν οἷς περιφέρω δεσμοῖς <strong>ᾄδω τὰς ἐκκλησίας, ἐν αἷς ἕνωσιν εὔχομαι</strong> <strong><mark>σαρκὸς καὶ πνεύματος</mark></strong> <strong>Ἰησοῦ Χριστοῦ</strong>, τοῦ διὰ παντὸς ἡμῶν ζῆν, <strong><mark>πίστεώς τε καὶ ἀγάπης</mark></strong></p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%B3%CE%BD%CE%98_%CE%9C%CE%B1%CE%B3#HH-1">Πρὸς Μαγνησιεῖς</a>)</p><blockquote><p><strong><mark>μηδὲν ἔστω ἐν ὑμῖν, ὃ δυνήσεται ὑμᾶς μερίσαι</mark></strong> <strong>ἀλλ ̓ </strong><strong><mark>ἑνώθητε τῷ· ἐπισκόπῳ</mark></strong> καὶ τοῖς προκαθημένοις εἰς τύπον καὶ διδαχὴν ἀφθαρσίας</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%B3%CE%BD%CE%98_%CE%9C%CE%B1%CE%B3#HH-6">Πρὸς Μαγνησιεῖς</a>)</p><blockquote><p>ὑποτάγητε τῷ· ἐπισκόπῳ καὶ ἀλλήλοις, ὡς Ἰησοῦς Χριστὸς τῷ· πατρὶ καὶ οἱ ἀπόστολοι τῷ· Χριστῷ· καὶ τῷ· πατρὶ <strong><mark>ἵνα ἕνωσις ᾖ</mark></strong> <strong>σαρκική τε</strong> <strong><mark>καὶ πνευματική</mark></strong></p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%B3%CE%BD%CE%98_%CE%9C%CE%B1%CE%B3#HH-13">Πρὸς Μαγνησιεῖς</a>)</p><blockquote><p>οὐχ ὅτι παρ ̓ ὑμῖν μερισμὸν εὗρον, ἀλλ ̓ ἀποδιϋλισμόν. * <strong>ὅσοι γὰρ θεοῦ εἰσιν καὶ Ἰησοῦ Χριστοῦ, οὗτοι μετὰ τοῦ ἐπισκόπου εἰσίν. καὶ ὅσοι ἂν</strong> <strong><mark>μετανοήσαντες ἔλθωσιν ἐπὶ τὴν ἑνότητα τῆς ἐκκλησίας, καὶ οὗτοι θεοῦ ἔσονται</mark></strong>, ἵνα ὦσιν κατὰ Ἰησοῦν Χριστὸν ζῶντες. μὴ πλανᾶσθε, ἀδελφοί μου· <strong>εἴ τις σχίζοντι ἀκολουθεῖ, βασιλείαν θεοῦ οὐ κληρονομεῖ</strong></p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%B3%CE%BD%CE%98_%CE%A6%CE%B9%CE%BB#HH-3">Πρὸς Φιλαδελφεῖς</a>)</p><blockquote><p><strong>μηδὲ πειράσητε εὔλογόν τι φαίνεσθαι ἰδίᾳ ὑμῖν</strong>, ἀλλ ̓ ἐπὶ τὸ αὐτὸ μία προσευχή, μία δέησις, εἷς νοῦς, μία ἐλπὶς ἐν ἀγάπῃ, ἐν τῇ χαρᾷ· τῇ ἀμώμῳ</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%B3%CE%BD%CE%98_%CE%9C%CE%B1%CE%B3#HH-7">Πρὸς Μαγνησιεῖς</a>)</p><h3>Ο μοναχισμός</h3><blockquote><p>εἴ τις δύναται ἐν ἁγνείᾳ μένειν εἰς τιμὴν τῆς σαρκὸς τοῦ κυρίου, ἐν ἀκαυχησίᾳ μενέτω.</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%B3%CE%BD%CE%98_%CE%A0%CE%BF%CE%BB#HH-5">Πρὸς Πολύκαρπον</a>)</p><h3>Στις αιρέσεις και στα σχίσματα δεν υπάρχει σωτηρία</h3><blockquote><p>Τέκνα <em>οὖν</em> <strong><em>φωτὸς ἀληθείας</em></strong>, <strong><mark><em>φεύγετε τὸν μερισμὸν καὶ τὰς κακοδιδασκαλίας</em></mark></strong>· <strong><em>ὅπου δὲ ὁ ποιμήν ἐστιν, ἐκεῖ ὡς πρόβατα ἀκολουθεῖτε</em></strong>. <em>πολλοὶ γὰρ λύκοι ἀξιόπιστοι ἡδονῇ κακῇ αἰχμαλωτίζουσιν τοὺς θεοδρόμους</em>· ἀλλ ̓ ἐν τῇ ἑνότητι ὑμῶν οὐχ ἕξουσιν τόπον. <strong><em>Ἀπέχεσθε τῶν κακῶν βοτανῶν, ἅστινας οὐ γεωργεῖ Ἰησοῦς Χριστός, διὰ τὸ μὴ εἶναι αὐτοὺς</em></strong> <strong><mark><em>φυτείαν πατρός</em></mark></strong>· <strong><em>οὐχ ὅτι παρ ̓ ὑμῖν μερισμὸν εὗρον, ἀλλ ̓ ἀποδιϋλισμόν</em></strong>. * <strong><mark><em>ὅσοι γὰρ θεοῦ εἰσιν καὶ Ἰησοῦ Χριστοῦ, οὗτοι μετὰ τοῦ ἐπισκόπου εἰσίν</em></mark></strong>. <em>καὶ ὅσοι ἂν μετανοήσαντες ἔλθωσιν ἐπὶ τὴν ἑνότητα τῆς ἐκκλησίας, καὶ οὗτοι θεοῦ ἔσονται, ἵνα ὦσιν κατὰ Ἰησοῦν Χριστὸν ζῶντες. μὴ πλανᾶσθε, ἀδελφοί μου</em>· <strong><em><mark>εἴ τις σχίζοντι ἀκολουθεῖ, βασιλείαν θεοῦ οὐ κληρονομεῖ· εἴ τις ἐν ἀλλοτρίᾳ γνώμῃ περιπατεῖ, οὗτος τῷ· πάθει οὐ συγκατατίθεται</mark></em></strong>.</p><p><em>&lt;…&gt;</em></p><p><strong><em>οὗ δὲ μερισμός ἐστιν καὶ ὀργῄ, θεὸς οὐ κατοικεῖ</em></strong>. <em>πᾶσιν οὖν μετανοοῦσιν</em> <strong><em>ἀφίει ὁ κύριος</em></strong>,</p><p><strong><em>ἐὰν μετανοήσωσιν εἰς ἑνότητα θεοῦ καὶ συνέδριον τοῦ ἐπισκόπου</em></strong>.</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%B3%CE%BD%CE%98_%CE%A6%CE%B9%CE%BB#HH-8">Πρὸς Φιλαδελφεῖς</a>)</p><blockquote><p>Μὴ πλανᾶσθε, ἀδελφοί μου· οἱ οἰκοφθόροι βασιλείαν θεοῦ οὐ κληρονομήσουσιν. εἰ οὖν οἱ κατὰ σάρκα ταῦτα πράσσοντες ἀπέθανον, πόσῳ μᾶλλον, <strong><mark>ἐὰν πίστιν θεοῦ ἐν κακῇ διδασκαλίᾳ φθείρῃ, ὑπὲρ ἧς Ἰησοῦς Χριστὸς ἐσταυρώθη· ὁ τοιοῦτος ῥυπαρὸς γενόμενος, εἰς τὸ πῦρ τὸ ἄσβεστον χωρήσει, ὁμοίως καὶ ὁ ἀκούων αὐτοῦ</mark></strong>.</p><p>Διὰ τοῦτο μύρον ἔλαβεν ἐπὶ τῆς κεφαλῆς αὐτοῦ ὁ κύριος, ἵνα πνέῃ τῇ ἐκκλησίᾳ ἀφθαρσίαν. <strong>μὴ ἀλείφεσθε δυσωδίαν τῆς διδασκαλίας τοῦ ἄρχοντος τοῦ αἰῶνος τούτου, μὴ αἰχμαλωτίσῃ ὑμᾶς ἐκ τοῦ προκειμένου ζῆν</strong>.</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%B3%CE%BD%CE%98_%CE%95%CF%86#HH-16">Πρὸς Ἐφεσίους</a>)</p><h3>Απομάκρυνση από τους αιρετικούς</h3><blockquote><p><strong><mark>Φεύγετε οὖν τὰς κακὰς παραφυάδας</mark></strong> <strong>τὰς γεννώσας καρπὸν θανατηφόρον, οὗ ἐὰν γεύσηταί τις, παρ ̓ αὐτὰ ἀποθνήσκει. οὕτοι γὰρ</strong> <strong><mark>οὒκ εἰσιν φυτεία πατρός</mark></strong>. εἰ γὰρ ἦσαν, ἐφαίνοντο ἂν κλάδοι τοῦ σταυροῦ, καὶ ἦν ἂν ὁ καρπὸς αὐτῶν ἄφθαρτος·</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%B3%CE%BD%CE%98_%CE%A4%CF%81%CE%B1%CE%BB#HH-11">Πρὸς Τραλλιανούς</a>)</p><blockquote><p>Τέκνα οὖν φωτὸς ἀληθείας, <strong><mark>φεύγετε</mark></strong> <strong>τὸν μερισμὸν καὶ</strong> <strong><mark>τὰς κακοδιδασκαλίας</mark></strong>· ὅπου δὲ ὁ ποιμήν ἐστιν, ἐκεῖ ὡς πρόβατα ἀκολουθεῖτε. πολλοὶ γὰρ λύκοι ἀξιόπιστοι ἡδονῇ κακῇ αἰχμαλωτίζουσιν τοὺς θεοδρόμους· ἀλλ ̓ ἐν τῇ ἑνότητι ὑμῶν οὐχ ἕξουσιν τόπον. <strong><mark>Ἀπέχεσθε τῶν κακῶν βοτανῶν</mark></strong>, ἅστινας οὐ γεωργεῖ Ἰησοῦς Χριστός, διὰ τὸ μὴ εἶναι αὐτοὺς φυτείαν πατρός· … <strong>εἴ τις ἐν ἀλλοτρίᾳ γνώμῃ περιπατεῖ, οὗτος τῷ· πάθει οὐ συγκατατίθεται</strong>.</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%B3%CE%BD%CE%98_%CE%A6%CE%B9%CE%BB">Πρὸς Φιλαδελφεῖς</a>)</p><h3>Η ζωή της ψυχής μετά τον θάνατο του σώματος</h3><blockquote><p>καλὸν τὸ δῦναι ἀπὸ κόσμου πρὸς θεόν, ἵνα εἰς αὐτὸν ἀνατείλω. … ἐὰν γὰρ εὑρεθῶ, καὶ λέγεσθαι <strong><mark>δύναμαι</mark></strong>, <strong>καὶ τότε</strong> <strong>πιστὸς εἶναι</strong>, <strong><mark>ὅταν κόσμῳ μὴ φαίνωμαι</mark></strong>. <strong><mark>οὐδὲν φαινόμενον καλόν</mark></strong>· νῦν ἄρχομαι μαθητὴς εἶναι. <strong><mark>μηθέν με ζηλώσαι τῶν ὁρατῶν καὶ ἀοράτων, ἵνα Ἰησοῦ Χριστοῦ ἐπιτύχω</mark></strong>. τὸν τοῦ θεοῦ θέλοντα εἶναι <strong>κόσμῳ μὴ χαρίσησθε, μηδὲ ὕλῃ ἐξαπατήσητε· ἄφετέ με καθαρὸν φῶς λαβεῖν</strong>· <strong><mark>ἐκεῖ παραγενόμενος ἄνθρωπος ἔσομαι</mark></strong>. ζῶν γὰρ γράφω ὑμῖν, ἐρῶν τοῦ ἀποθανεῖν. ὁ ἐμὸς ἔρως ἐσταύρωται, καὶ οὐκ ἔστιν ἐν ἐμοὶ πῦρ φιλόϋλον· ὕδωρ δὲ ζῶν καὶ <strong>λαλοῦν</strong> <strong><mark>ἐν ἐμοί, ἔσωθέν μοι λέγον· Δεῦρο πρὸς τὸν πατέρα</mark></strong>.</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%B3%CE%BD%CE%98_%CE%A1%CF%89%CE%BC">Πρὸς Ῥωμαίους</a>)</p><h3>Η κατάργηση του ιουδαϊκού νόμου</h3><blockquote><p><strong><mark>εἰ γὰρ μέχρι νῦν κατὰ Ἰουδαϊσμὸν ζῶμεν, ὁμολογοῦμεν χάριν μὴ εἰληφέναι</mark></strong>. οἱ γὰρ θειότατοι προφῆται κατὰ Χριστὸν Ἰησοῦν ἔζησαν. διὰ τοῦτο καὶ ἐδιώχθησαν, ἐνπνεόμενοι ὑπὸ τῆς χάριτος αὐτοῦ, εἰς τὸ πληροφορηθῆναι τοὺς ἀπειθοῦντας, ὅτι εἷς θεός ἐστιν, ὁ φανερώσας ἑαυτὸν διὰ Ἰησοῦ Χριστοῦ τοῦ υἱοῦ αὐτοῦ ὅς ἐστιν αὐτοῦ λόγος ἀπὸ σιγῆς προελθών, … Εἰ οὖν οἱ ἐν παλαιοῖς πράγμασιν ἀναστραφέντες εἰς καινότητα ἐλπίδος ἦλθον, <strong><mark>μηκέτι σαββατίζοντες, ἀλλὰ κατὰ κυριακὴν ζῶντες</mark></strong>, ἐν ᾗ καὶ ἡ ζωὴ ἡμῶν ἀνέτειλεν δι ̓ αὐτοῦ καὶ τοῦ θανάτου αὐτοῦ, <strong>ὅν τινες ἀρνοῦνται</strong>, δι ̓ οὗ μυστηρίου ἐλάβομεν τὸ πιστεύειν, καὶ διὰ τοῦτο ὑπομένομεν, ἵνα εὑρεθῶμεν μαθηταὶ Ἰησοῦ Χριστοῦ τοῦ μόνου διδασκάλου ἡμῶν· … διὰ τοῦτο, <strong>μαθηταὶ αὐτοῦ γενόμενοι, μάθωμεν κατὰ Χριστιανισμὸν ζῆν</strong>. ὃς γὰρ ἄλλῳ ὀνόματι καλεῖται πλέον τούτου, οὐκ ἔστιν τοῦ θεοῦ. * <strong><mark>ὑπέρθεσθε οὖν τὴν κακὴν ζύμην, τὴν παλαιωθεῖσαν καὶ ἐνοξίσασαν, καὶ μεταβάλεσθε εἰς νέαν ζύμην, ὅ ἐστιν Ἰησοῦς Χριστός</mark></strong>. ἁλίσθητε ἐν αὐτῷ·, ἵνα μὴ διαφθαρῇ τις ἐν ὑμῖν, ἐπεὶ ἀπὸ τῆς ὀσμῆς ἐλεγχθήσεσθε. <strong><mark>ἄτοπόν ἐστιν, Ἰησοῦν Χριστὸν λαλεῖν καὶ ἰουδαΐζειν</mark></strong>. <strong>ὁ γὰρ Χριστιανισμὸς οὐκ εἰς Ἰουδαϊσμὸν ἐπίστευσεν, ἀλλ ̓ Ἰουδαϊσμὸς εἰς Χριστιανισμόν</strong>,</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%B3%CE%BD%CE%98_%CE%9C%CE%B1%CE%B3">Πρὸς Μαγνησιεῖς</a>)</p><blockquote><p><strong><mark>Ἐὰν δέ τις ἰουδαϊσμὸν ἑρμηνεύῃ ὑμῖν, μὴ ἀκούετε αὐτοῦ</mark></strong>. <strong>ἄμεινον γάρ ἐστιν παρὰ ἀνδρὸς περιτομὴν ἔχοντος χριστιανισμὸν ἀκούειν, ἢ παρὰ ἀκροβύστου ἰουδαϊσμόν</strong>. ἐὰν δὲ ἀμφότεροι περὶ Ἰησοῦ Χριστοῦ μὴ λαλῶσιν, οὗτοι ἐμοὶ στῆλαί εἰσιν καὶ τάφοι νεκρῶν, ἐφ ̓ οἷς γέγραπται μόνον ὀνόματα ἀνθρώπων.</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%B3%CE%BD%CE%98_%CE%A6%CE%B9%CE%BB#HH-6">Πρὸς Φιλαδελφεῖς</a>)</p><blockquote><p>Ἐὰν δέ τις <strong><mark>ἰουδαϊσμὸν ἑρμηνεύῃ ὑμῖν, μὴ ἀκούετε αὐτοῦ</mark></strong>. ἄμεινον γάρ ἐστιν παρὰ ἀνδρὸς περιτομὴν ἔχοντος χριστιανισμὸν ἀκούειν, ἢ παρὰ ἀκροβύστου ἰουδαϊσμόν.</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%B3%CE%BD%CE%98_%CE%A6%CE%B9%CE%BB#HH-6">Πρὸς Φιλαδελφεῖς</a>)</p><h3>Ατελείωτα βάσανα στην κόλαση</h3><blockquote><p>εἰ οὖν οἱ κατὰ σάρκα ταῦτα πράσσοντες ἀπέθανον, πόσῳ μᾶλλον, ἐὰν πίστιν θεοῦ ἐν κακῇ διδασκαλίᾳ φθείρῃ, ὑπὲρ ἧς Ἰησοῦς Χριστὸς ἐσταυρώθη· ὁ τοιοῦτος ῥυπαρὸς γενόμενος, εἰς τὸ <strong><mark>πῦρ τὸ ἄσβεστον</mark></strong> <strong>χωρήσει</strong>, ὁμοίως καὶ ὁ ἀκούων αὐτοῦ.</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%B3%CE%BD%CE%98_%CE%95%CF%86#HH-16">Πρὸς Ἐφεσίους</a>)</p><h3>Μομφή σε όσους οικοδομούν την πίστη «μόνο στη Γραφή»</h3><p>Μιλά για ανθρώπους που φιλονικούν και αρνούνται να πιστέψουν ό,τι δεν μπορεί να τους αποδειχθεί από τις Γραφές της Παλαιάς Διαθήκης, και όταν τους δείχνεται, συνεχίζουν να φιλονικούν για το νόημα του κειμένου. Ο Ιγνάτιος ο Θεοφόρος απαντά ότι, αν και είναι γραμμένο, γι’ αυτόν αρχαιότερος (σπουδαιότερος) είναι ο Ιησούς Χριστός και η πίστη του, την οποία ο άγιος Ιγνάτιος έλαβε απευθείας από τους αποστόλους και τους διαδόχους τους:</p><blockquote><p>πιστεύω τῇ χάριτι Ἰησοῦ Χριστοῦ, ὃς λύσει ἀφ ̓ ὑμῶν πάντα δεσμόν. παρακαλῶ δὲ ὑμᾶς <strong><mark>μηδὲν κατ ̓ ἐριθείαν πράσσειν, ἀλλὰ κατὰ χριστομαθίαν</mark></strong>. ἐπεὶ <strong><mark>ἤκουσά τινων</mark></strong> <strong>λεγόντων, ὅτι</strong> <strong><mark>ἐὰν μὴ ἐν τοῖς ἀρχείοις εὕρω ἐν τῷ· εὐαγγελίῳ οὐ πιστεύω</mark></strong>· <strong>καὶ λέγοντός μου αὐτοῖς ὅτι γέγραπται, ἀπεκρίθησάν μοι ὅτι πρόκειται</strong>. <strong><mark>ἐμοὶ δὲ ἀρχεῖά ἐστιν Ἰησοῦς Χριστός</mark></strong>, τὰ ἄθικτα ἀρχεῖα ὁ σταυρὸς αὐτοῦ καὶ ὁ θάνατος καὶ ἡ ἀνάστασις αὐτοῦ <strong><mark>καὶ ἡ πίστις ἡ δι ̓ αὐτοῦ</mark></strong>, ἐν οἷς θέλω ἐν τῇ προσευχῇ ὑμῶν δικαιωθῆναι.</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%B3%CE%BD%CE%98_%CE%A6%CE%B9%CE%BB#HH-8">Πρὸς Φιλαδελφεῖς</a>)</p><h2>Περί της χρονολογήσεως των κειμένων</h2><p>Υπάρχουν τρεις μορφές των κειμένων του Ιγνατίου του Θεοφόρου: η βραχεία, η μέση και η μακρά. Η μέση είναι η αρχαιότερη και η πιο διαδεδομένη. Αυτό το σώμα επιστολών το αναφέρει τον 3ο-4ο αιώνα ο Ευσέβιος Καισαρείας.</p><p>Ξεχωριστές επιστολές αναφέρονται και νωρίτερα. Για παράδειγμα, τον 2ο αιώνα ο σύγχρονος του Ιγνατίου, Πολύκαρπος Σμύρνης, γράφει για την επιστολή του Ιγνατίου:</p><blockquote><p><strong>Ἐγράψατέ μοι καὶ ὑμεῖς καὶ Ἰγνάτιος</strong>, ἵν’, ἐάν τις ἀπέρχηται εἰς Συρίαν, καὶ τὰ παρ’ ὑμῶν ἀποκομίσῃ γράμματα</p></blockquote><p>Ο Πολύκαρπος συγκεντρώνει τις επιστολές του Ιγνατίου και ό,τι είναι γνωστό γι’ αυτόν, αντιγράφοντας και διαδίδοντας τα έργα αυτά:</p><blockquote><p><strong>τὰς ἐπιστολὰς Ἰγνατίου τὰς πεμφθείσας ἡμῖν ὑπ’ αὐτοῦ καὶ ἄλλας</strong>, ὅσας εἴχομεν παρ’ ἡμῖν, <strong>ἐπέμψαμεν ὑμῖν</strong>, καθὼς ἐνετείλασθε· αἵτινες ὑποτεταγμέναι εἰσὶν τῇ ἐπιστολῇ ταύτῃ, ἐξ ὧν μεγάλα ὠφεληθῆναι δυνήσεσθε. περιέχουσι γὰρ πίστιν καὶ ὑπομονὴν καὶ πᾶσαν οἰκοδομὴν τὴν εἰς τὸν κύριον ἡμῶν ἀνήκουσαν. Et de ipso Ignatio et de his, qui cum eo sunt, quod certius agnoveritis, significate</p></blockquote><p>Ο αρχαιότερος σωζόμενος ελληνικός κώδικας (5ος αιώνας) είναι η ήδη αναφερθείσα από τον Πολύκαρπο επιστολή προς Σμυρναίους. Αν και οι ελληνικοί κώδικες της επιστολής προς Ῥωμαίους είναι αρκετά μεταγενέστεροι, από τον 5ο αιώνα υπάρχουν μεταφράσεις της προς Ῥωμαίους στα συριακά και τα αρχαία αρμενικά. Υπάρχουν επίσης κοπτικές μεταφράσεις του 4ου αιώνα των επιστολών προς Ῥωμαίους, Σμυρναίους, Πολύκαρπον, Τραλλιανούς και Φιλαδελφεῖς.</p><p>Ο Ευσέβιος Καισαρείας (3ος-4ος αιώνας) παραθέτει από χαμένη επιστολή του Ειρηναίου Λουγδούνου (2ος αιώνας), στην οποία ο Ειρηναίος παραθέτει την επιστολή προς Ῥωμαίους του Ιγνατίου του Θεοφόρου:</p><blockquote><p>οἶδεν δὲ αὐτοῦ τὸ μαρτύριον καὶ <strong>ὁ Εἰρηναῖος</strong>, καὶ τῶν ἐπιστο λῶν αὐτοῦ μνημονεύει, λέγων οὕτως· «ὡς εἶπέν τις τῶν ἡμετέρων, διὰ τὴν πρὸς θεὸν μαρτυρίαν κατακριθεὶς πρὸς θηρία, ὅτι σῖτος εἰμι θεοῦ καὶ δι' ὀδόντων θηρίων ἀλήθομαι, ἵνα καθαρὸς ἄρτος εὑρεθῶ» καὶ ὁ Πολύκαρπος δὲ τούτων αὐτῶν μέμνηται ἐν τῇ φερομένῃ αὐτοῦ πρὸς Φιλιππησίους ἐπιστολῇ</p></blockquote><p>(Ἐκκλησιαστικὴ Ἱστορία Γ΄, 36)</p><p>Ο Ευσέβιος παραθέτει τη μέση μορφή του κειμένου. Μπορεί κανείς να συγκρίνει τα κείμενα του Ευσεβίου και ό,τι έχουμε σήμερα. Η διαφορά υπογραμμίζεται (οι δύο λέξεις που προστίθενται δεν αλλάζουν την ουσία, περιγράφουν είδη βασανισμού):</p><table class="custom-table"><colgroup></colgroup><tbody><tr><td><p><strong>Από την «Εκκλησιαστική Ιστορία» του Ευσεβίου</strong></p><p>ἀπὸ Συρίας μέχρι Ῥώμης θηριομαχῶ διὰ γῆς καὶ θαλάσσης, νυκτὸς καὶ ἡμέρας, ἐνδεδεμένος δέκα λεοπάρδοις, ὅ ἐστιν στρατιωτικὸν τάγμα, οἳ καὶ εὐεργετούμενοι χείρονες γίνονται, ἐν δὲ τοῖς ἀδικήμασιν αὐτῶν μᾶλλον μαθητεύομαι· ἀλλ' οὐ παρὰ τοῦτο δεδικαίωμαι. ὀναίμην τῶν θηρίων τῶν ἐμοὶ ἑτοίμων, ἃ καὶ εὔχομαι σύντομά μοι εὑρεθῆναι· ἃ καὶ κολακεύσω συντόμως με καταφαγεῖν, οὐχ ὥσπερ τινῶν δειλαινόμενα οὐχ ἥψαντο, κἂν αὐτὰ δὲ ἄκοντα μὴ θέλῃ, ἐγὼ προσβιάσομαι. συγγνώμην μοι ἔχετε· τί μοι συμφέρει, ἐγὼ γινώσκω, νῦν ἄρχομαι μαθητὴς εἶναι. μηδέν με ζηλώσαι τῶν ὁρατῶν καὶ ἀοράτων, ἵνα Ἰησοῦ Χριστοῦ ἐπιτύχω· πῦρ καὶ σταυρὸς θηρίων τε συστάσεις, <strong><u>___</u></strong> σκορπισμοὶ ὀστέων, συγκοπαὶ μελῶν, ἀλεσμοὶ ὅλου τοῦ σώματος, κολάσεις τοῦ διαβόλου εἰς ἐμὲ ἐρχέσθωσαν, μόνον ἵνα Ἰησοῦ Χριστοῦ ἐπιτύχω</p><p><a href="https://bibleox.com/grc/grc/w/%CE%95%CE%9A%CE%9A%CE%9B%CE%97%CE%A3%CE%99%CE%91%CE%A3%CE%A4%CE%99%CE%9A%CE%97%CE%A3_%CE%99%CE%A3%CE%A4%CE%9F%CE%A1%CE%99%CE%91%CE%A3-3/#HH-36">https://bibleox.com/grc/grc/w/ΕΚΚΛΗΣΙΑΣΤΙΚΗΣ_ΙΣΤΟΡΙΑΣ-3/#HH-36</a></p></td><td><p><strong>Από την επιστολή του Ιγνατίου</strong></p><p>Ἀπὸ Συρίας μέχρι Ῥώμης θηριομαχῶ, διὰ γῆς καὶ θαλάσσης, νυκτὸς καὶ ἡμέρας, δεδεμένος δέκα λεοπάρδοις, ὅ ἐστιν στρατιωτικὸν τάγμα· οἳ καὶ εὐεργετούμενοι χείρους γίνονται. ἐν δὲ τοῖς ἀδικήμασιν αὐτῶν μᾶλλον μαθητεύομαι, ἀλλ ̓ οὐ παρὰ τοῦτο δεδικαίωμαι. ὀναίμην τῶν θηρίων τῶν ἐμοὶ ἡτοιμασμένων καὶ εὔχομαι σύντομά μοι εὑρεθῆναι· ἃ καὶ κολακεύσω, συντόμως με καταφαγεῖν, οὐχ ὥσπερ τινῶν δειλαινόμενα οὐχ ἥψαντο. κἂν αὐτὰ δὲ ἄκοντα μη· θελήσῃ, ἐγὼ προσβιάσομαι. συγγνώμην μοι ἔχετε· τί μοι συμφέρει, ἐγὼ γινώσκω, νῦν ἄρχομαι μαθητὴς εἶναι. μηθέν με ζηλώσαι τῶν ὁρατῶν καὶ ἀοράτων, ἵνα Ἰησοῦ Χριστοῦ ἐπιτύχω. πῦρ καὶ σταυρὸς θηρίων τε συστάσεις, <strong><u>ἀνατομαί, διαιρέσεις</u></strong>, σκορπισμοὶ ὀστέων, συγκοπὴ μελῶν, ἀλεσμοὶ ὅλου τοῦ σώματος, κακαὶ κολάσεις τοῦ διαβόλου ἐπ ̓ ἐμὲ ἐρχέσθωσαν, μόνον ἵνα Ἰησοῦ Χριστοῦ ἐπιτύχω</p><p><a href="https://bibleox.com/grc/grc/w/%CE%99%CE%B3%CE%BD%CE%98_%CE%A1%CF%89%CE%BC/#L23-26">https://bibleox.com/grc/grc/w/ΙγνΘ_Ρωμ/#L23-26</a></p></td></tr></tbody></table><p>Μπορεί να υποθέσει κανείς ότι η βραχεία συλλογή των επιστολών του Ιγνατίου δεν εμφανίστηκε καθόλου ως πλαστογραφία. Στην αρχαιότητα υπήρχε η πρακτική να συντάσσονται σύντομες επαναδιατυπώσεις γνωστών έργων. Έτσι, τον 2ο αιώνα ο μαθητής του Ιουστίνου του Φιλοσόφου (Τατιανός) συνέταξε σε ένα έργο και τα τέσσερα Ευαγγέλια — το Διατεσσάρων. Είναι ένα γνωστό έργο που διαβαζόταν επί μακρόν στην Εκκλησία, μερικές φορές ακόμη και αντί των Ευαγγελίων, ώστε αργότερα χρειάστηκε να διορθωθεί αυτή η τάξη και να επιστρέψει η ανάγνωση του Ευαγγελίου. Το Διατεσσάρων δεν σχεδιάστηκε ως πλαστογραφία, αλλά δημιουργήθηκε απλώς ως πρόσθετο έργο, που διαδόθηκε ακριβώς με αυτόν τον τρόπο.</p><p>Η ύπαρξη του Διατεσσάρων δεν σημαίνει ότι τα Ευαγγέλια είναι πλαστά, δεν μεταθέτει τη χρονολόγηση της εμφάνισής τους στον 2ο αιώνα, και το ίδιο το Διατεσσάρων δεν διεκδικεί τον 1ο αιώνα. Είναι έργο του 2ου αιώνα.</p><p>Τα κείμενα του ιερομάρτυρος Ιγνατίου χαίρουν αρκετά υψηλής εμπιστοσύνης των ερευνητών. Περισσότερες πληροφορίες <a href="https://azbyka.ru/otechnik/Ignatij_Antiohijskij/ignatij-antiokhijskij-episkop-muchenik-i-proiskhozhdenie-episkopata/5">εδώ</a>.</p>
