      <p>Τα αποσπάσματα από τις επιστολές του Ιγνατίου, την Επιστολή προς Φιλιππησίους του Πολυκάρπου και την «Εκκλησιαστική Ιστορία» του Ευσεβίου παρατίθενται αυτολεξεί από τα ελληνικά κείμενα που είναι δημοσιευμένα στον ιστότοπο· η στίξη και οι τόνοι διατηρούνται, ενώ η αρίθμηση των παραγράφων παραλείπεται. Οι υπογραμμίσεις ακολουθούν το ρωσικό κείμενο. Η μαρτυρία του Ιερωνύμου για τον Ιγνάτιο δεν σώζεται στον ιστότοπο σε λατινική ή ελληνική έκδοση και μεταφράστηκε από το ρωσικό κείμενο. Στο κείμενο του Ευσεβίου (Γ΄ 36) η ηλεκτρονική έκδοση έχει σημεία με κομμένες λέξεις στα όρια των παραγράφων· στα παραθέματα ελήφθησαν τα αναγνώσιμα μέρη.</p><p>Μετάφραση: Ρόντιον Βλάσοφ, με χρήση τεχνητής νοημοσύνης, από τη <a href="https://bibleox.com/grc/ru/w/%D0%98%D0%B3%D0%BD%D0%B0%D1%82%D0%B8%D0%B9_%D0%90%D0%BD%D1%82%D0%B8%D0%BE%D1%85%D0%B8%D0%B9%D1%81%D0%BA%D0%B8%D0%B9">ρωσική σελίδα αναφοράς</a>.</p>
