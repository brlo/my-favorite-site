    title_sub: "άγιος μάρτυς (~100-165), φιλόσοφος, καταγόμενος από τη Φλαβία Νέα Πόλη (Συχέμ) της Σαμαρείας"
    meta_desc: "Ο Ιουστίνος ο Φιλόσοφος (Ιουστίνος Μάρτυς), χριστιανός άγιος του 2ου αιώνα: ο βίος του, η διδασκαλία του περί Θεού, ο νόμος του Μωυσή, τα μυστήρια, η μετά θάνατον κατάσταση και τα έσχατα, με τα δικά του λόγια."
