      <p>Τα αποσπάσματα από τις Απολογίες και τον Διάλογο προς Τρύφωνα παρατίθενται αυτολεξεί από το ελληνικό κείμενο των έργων του Ιουστίνου που είναι δημοσιευμένο στον ιστότοπο (Ἀπολογία 1, Ἀπολογία 2, Διάλογος πρὸς Τρύφωνα)· η στίξη και οι τόνοι διατηρούνται όπως στο κείμενο της έκδοσης, ενώ η αρίθμηση των παραγράφων και οι πλάγιοι χαρακτήρες των χωρίων παραλείπονται. Οι υπογραμμίσεις (έντονα, μαρκάρισμα, πλάγια) ακολουθούν το ρωσικό κείμενο. Οι μαρτυρίες των Τερτυλλιανού, Μεθοδίου, Επιφανίου, Ιερωνύμου και Θεοδωρήτου δεν υπάρχουν στον ιστότοπο σε ελληνική ή λατινική έκδοση, γι’ αυτό μεταφράστηκαν από το ρωσικό κείμενο. Η μετάφραση της αφήγησης, των τίτλων και των σχολίων είναι δική μας, στη δημοτική με μονοτονικό, ανεξάρτητα από το πολυτονικό των παραθεμάτων. Οι επεξηγήσεις του ρωσικού κειμένου σε παρενθέσεις (για το «ζεστό νερό» του Σαββάτου, για τις «αιώνιες εντολές» αντί του νόμου του Μωυσή, για την «Ευχαριστία» στη «ξηρά και υγρά τροφή») δεν μεταφέρονται στις παραθέσεις, που δίνονται από το πρωτότυπο. Στον Διάλογο 44 η ηλεκτρονική έκδοση έχει το προφανές τυπογραφικό «σβεςθήσεται» αντί «σβεσθήσεται»· διορθώνεται στην παράθεση, ενώ το κείμενο του έργου μένει ως έχει.</p><p>Μετάφραση: Ροντιόν Βλάσοφ, με χρήση τεχνητής νοημοσύνης, από τη <a href="https://bibleox.com/grc/ru/w/%D0%98%D1%83%D1%81%D1%82%D0%B8%D0%BD_%D0%A4%D0%B8%D0%BB%D0%BE%D1%81%D0%BE%D1%84_%D0%BC%D1%83%D1%87%D0%B5%D0%BD%D0%B8%D0%BA">ρωσική σελίδα αναφοράς</a>.</p>
