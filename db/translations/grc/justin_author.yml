      <h2>Βιογραφία</h2><p>Η μνήμη του εορτάζεται την 1η (14η) Ιουνίου</p><p>Γεννήθηκε στη Συχέμ, την αρχαία πόλη της Σαμαρείας. Οι γονείς του Ιουστίνου, Έλληνες στην καταγωγή, ήταν ειδωλολάτρες. Από παιδί ο άγιος ξεχώριζε για το βαθύ του πνεύμα, την αγάπη για τη μάθηση και τον ένθερμο πόθο να γνωρίσει την Αλήθεια. Μελέτησε σε βάθος τις διάφορες σχολές της ελληνικής φιλοσοφίας — τους Στωικούς, τους Περιπατητικούς, τους Πυθαγορείους και τους Πλατωνικούς — και πείστηκε ότι καμία από αυτές τις ειδωλολατρικές διδασκαλίες δεν ανοίγει τον δρόμο για τη γνώση του αληθινού Θεού.</p><p>Κάποτε, ενώ περπατούσε σε έναν έρημο τόπο έξω από την πόλη και σκεφτόταν πού να αναζητήσει τον δρόμο προς τη γνώση της Αλήθειας, συνάντησε έναν γέροντα, ο οποίος σε μια μακρά συνομιλία του αποκάλυψε την ουσία της χριστιανικής διδασκαλίας και τον συμβούλεψε να αναζητήσει την απάντηση σε όλα τα ερωτήματα της ζωής στα βιβλία της Αγίας Γραφής.</p><p>Σε ηλικία τριάντα ετών ο Ιουστίνος έλαβε το άγιο Βάπτισμα (μεταξύ 133 και 137). Από τότε αφιέρωσε τα χαρίσματά του και τις πλούσιες φιλοσοφικές του γνώσεις στο κήρυγμα του Ευαγγελίου στους ειδωλολάτρες. Άρχισε να περιοδεύει στη Ρωμαϊκή Αυτοκρατορία, σπείροντας παντού τους σπόρους της σωτήριας πίστης. Ο Ιουστίνος ίδρυσε σχολή στην οποία δίδασκε τη χριστιανική φιλοσοφία. Υπερασπιζόταν με συνέπεια την αλήθεια και τη σωστική δύναμη της χριστιανικής διδασκαλίας, ανατρέποντας πειστικά τόσο τις ειδωλολατρικές σοφιστείες (όπως, για παράδειγμα, στη διαμάχη του με τον κυνικό φιλόσοφο Κρήσκεντα) όσο και τις αιρετικές διαστρεβλώσεις του χριστιανισμού (ιδιαίτερα στράφηκε εναντίον της διδασκαλίας του γνωστικού Μαρκίωνα).</p><p>Γύρω στο 155, όταν ο αυτοκράτορας Αντωνίνος ο Ευσεβής (138-161) άρχισε διωγμό κατά των χριστιανών, ο άγιος Ιουστίνος παρέδωσε ο ίδιος στον αυτοκράτορα μια «Απολογία» προς υπεράσπιση των χριστιανών Πτολεμαίου και Λουκίου, που είχαν καταδικαστεί άδικα σε θάνατο, ενώ το όνομα του τρίτου παραμένει άγνωστο. Στην «Απολογία» απέδειξε το ψεύδος των κατηγοριών εναντίον των χριστιανών «εξ ονόματος των αδίκως μισουμένων και διωκομένων χριστιανών».</p><p>Στην Έφεσο έγινε ο διάλογος του αγίου Ιουστίνου με τον ραββίνο Τρύφωνα. Με βάση τις προφητικές γραφές της Παλαιάς Διαθήκης ο χριστιανός φιλόσοφος απέδειξε την αλήθεια της χριστιανικής διδασκαλίας. Τη συζήτηση αυτή την εξιστόρησε ο άγιος Ιουστίνος στο έργο του «Διάλογος προς Τρύφωνα τον Ιουδαίο».</p><p>Η δεύτερη «Απολογία» του αγίου Ιουστίνου απευθυνόταν στη ρωμαϊκή σύγκλητο. Γράφτηκε το 161, λίγο μετά την άνοδο του Μάρκου Αυρηλίου στον θρόνο (161-180). Στις απολογίες του εμφανίζεται για πρώτη φορά η ιδέα ότι για τους ειδωλολάτρες ακριβώς η φιλοσοφία ήταν πρόδρομος του χριστιανισμού. Είναι ενδιαφέρον ότι οι απολογίες περιέχουν επίσης πληροφορίες για τις πρακτικές του Βαπτίσματος και της Ευχαριστίας που ίσχυαν τότε. Ο Ιουστίνος έγραψε ακόμη ένα μεγάλο έργο κατά των γνωστικών, το οποίο δεν σώθηκε έως τις μέρες μας, το λεγόμενο «Σύνταγμα κατά πασών των αιρέσεων».</p><p>Επιστρέφοντας στην Ιταλία, ο άγιος Ιουστίνος, όπως οι Απόστολοι, κήρυττε παντού το Ευαγγέλιο και οδηγούσε πολλούς στη χριστιανική πίστη. Σύμφωνα με τις «Πράξεις του Ιουστίνου», κατά τη διαμονή του στη Ρώμη, αυτός και έξι μαθητές του συνελήφθησαν και οδηγήθηκαν στο δικαστήριο του επάρχου Κοίντου Ιουνίου Ρουστίκου (163-168), στωικού φιλοσόφου και δασκάλου του αυτοκράτορα Μάρκου Αυρηλίου. Στην ερώτηση του επάρχου για τη διδασκαλία που ακολουθεί ο μάρτυς, εκείνος απάντησε: «Προσπάθησα να γνωρίσω κάθε διδασκαλία, αλλά τελικά προσκολλήθηκα στις αληθινές διδασκαλίες των χριστιανών, αν και δεν αρέσουν σε εκείνους που φρονούν ψευδώς». Ο Ιουστίνος ομολόγησε την πίστη του στον Θεό «που έπλασε τον κόσμο και δημιούργησε όλη την κτίση» και στον «Κύριο Ιησού Χριστό, τον Παίδα του Θεού, για τον οποίο προφήτευσαν οι προφήτες ότι θα έρθει προς το ανθρώπινο γένος ως κήρυξ της σωτηρίας και δάσκαλος των καλών διδαγμάτων». Αφού ο Ιουστίνος και οι μαθητές του ομολόγησαν αποφασιστικά ότι είναι χριστιανοί, ο έπαρχος Ρούστικος ρώτησε αν εκείνος είναι βέβαιος ότι μετά τη μαστίγωση και την εκτέλεση θα ανέβει στον ουρανό. «Ελπίζω ότι, αν υπομείνω, θα λάβω τα δώρα του· γιατί γνωρίζω ότι η χάρη του Θεού μένει σε όλους όσοι έζησαν ορθά», απάντησε ο μάρτυς. Παρά τις απειλές του επάρχου, οι μάρτυρες αρνήθηκαν να προσφέρουν θυσία στα είδωλα, και έπειτα μαστιγώθηκαν και αποκεφαλίστηκαν.</p><p>Η διαδεδομένη στη βιβλιογραφία άποψη ότι ο κυνικός Κρήσκης είχε σχέση με τον θάνατο του Ιουστίνου στηρίζεται στη μαρτυρία του Ευσεβίου Καισαρείας. Επειδή όλες οι αξιόπιστες πηγές, συμπεριλαμβανομένων και των «Πράξεων του Ιουστίνου», σιωπούν γι’ αυτό, δεν είναι δυνατόν να προσδιοριστεί αν ο εχθρικός προς τον Ιουστίνο Κρήσκης είχε οποιαδήποτε συμμετοχή στη σύλληψη και στον θάνατό του.</p><h2>Διδασκαλία</h2><h3>Ο μάρτυς Ιουστίνος εκθέτει τη χριστιανική πίστη που έλαβε από τον χριστιανό γέροντα</h3><blockquote><p>Διὰ ταῦτά σοι, ὦ Τρύφων, καὶ τοῖς βουλομένοις προσηλύτοις γενέσθαι κηρύξω ἐγὼ θεῖον λόγον, ὃν παρ' ἐκείνου ἤκουσα τοῦ ἀνδρός</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%BF_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82-%CE%94%CE%B9%CE%AC%CE%BB%CE%BF%CE%B3%CE%BF_%CF%80%CF%81%CE%BF%CF%82_%CE%A4%CF%81%CF%8D%CF%86%CF%89%CE%BD%CE%B1#HH-23">Διάλογος πρὸς Τρύφωνα</a>)</p><h2>Θεός</h2><h3>Τα άπειρα ιδιώματα του Θεού</h3><blockquote><p>ὁ γὰρ ἄρρητος πατὴρ καὶ κύριος τῶν πάντων οὔτε ποι ἀφῖκται οὔτε περιπατεῖ οὔτε καθεύδει οὔτε ἀνίσταται, ἀλλ' ἐν τῇ αὐτοῦ χώρᾳ, ὅπου ποτέ, μένει, ὀξὺ ὁρῶν καὶ ὀξὺ ἀκούων, οὐκ ὀφθαλμοῖς οὐδὲ ὠσὶν ἀλλὰ δυνάμει ἀλέκτῳ· καὶ πάντα ἐφορᾷ καὶ πάντα γινώσκει, καὶ οὐδεὶς ἡμῶν λέληθεν αὐτόν· <strong>οὔτε κινούμενος</strong>, ὁ τόπῳ τε <strong>ἀχώρητος</strong> καὶ τῷ κόσμῳ ὅλῳ, ὅς γε <strong>ἦν καὶ πρὶν τὸν κόσμον γενέσθαι</strong></p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%BF_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82-%CE%94%CE%B9%CE%AC%CE%BB%CE%BF%CE%B3%CE%BF_%CF%80%CF%81%CE%BF%CF%82_%CE%A4%CF%81%CF%8D%CF%86%CF%89%CE%BD%CE%B1#HH-127">Διάλογος πρὸς Τρύφωνα</a>)</p><h3>Το όνομα του Θεού</h3><blockquote><p><strong><mark>Ὄνομα δὲ τῷ πάντων πατρὶ θετόν, ἀγεννήτῳ ὄντι, οὐκ ἔστιν· ᾧ γὰρ ἂν καὶ ὄνομά τι προσαγορεύηται, πρεσβύτερον ἔχει τὸν θέμενον τὸ ὄνομα</mark></strong>. τὸ δὲ πατὴρ καὶ θεὸς καὶ κτίστης καὶ κύριος καὶ δεσπότης <strong>οὐκ ὀνόματά ἐστιν, ἀλλ’ ἐκ τῶν εὐποιϊῶν καὶ τῶν ἔργων προσρήσεις</strong></p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82_%E1%BC%88%CF%80%CE%BF%CE%BB%CE%BF%CE%B3%CE%AF%CE%B1_2#HH-6">Ἀπολογία 2</a>)</p><h3>Ο Θεός είναι ομοούσιος</h3><blockquote><p>ὅτι ἀρχὴν πρὸ πάντων τῶν κτισμάτων <strong>ὁ θεὸς γεγέννηκε δύναμίν τινα ἐξ ἑαυτοῦ λογικήν, ἥτις καὶ δόξα κυρίου ὑπὸ τοῦ πνεύματος τοῦ ἁγίου καλεῖται, ποτὲ δὲ υἱός, ποτὲ δὲ σοφία, ποτὲ δὲ ἄγγελος, ποτὲ δὲ θεός, ποτὲ δὲ κύριος καὶ λόγος</strong>, ποτὲ δὲ ἀρχιστράτηγον ἑαυτὸν λέγει, ἐν ἀνθρώπου μορφῇ φανέντα τῷ τοῦ Ναυῆ Ἰησοῦ· ἔχει γὰρ πάντα προσονομάζεσθαι ἔκ τε τοῦ ὑπηρετεῖν τῷ πατρικῷ βουλήματι καὶ ἐκ τοῦ <strong>ἀπὸ τοῦ πατρὸς θελήσει γεγεννῆσθαι</strong>. ἀλλ' οὐ τοιοῦτον ὁποῖον καὶ ἐφ' ἡμῶν γινόμενον ὁρῶμεν; λόγον γάρ τινα προβάλλοντες, <strong><mark>λόγον γεννῶμεν, οὐ κατὰ ἀποτομήν</mark></strong>, ὡς ἐλαττωθῆναι τὸν ἐν ἡμῖν λόγον, προβαλλόμενοι. καὶ ὁποῖον ἐπὶ πυρὸς ὁρῶμεν ἄλλο γινόμενον, οὐκ ἐλαττουμένου ἐκείνου ἐξ οὗ ἡ ἄναψις γέγονεν, ἀλλὰ τοῦ αὐτοῦ μένοντος, καὶ τὸ ἐξ αὐτοῦ ἀναφθὲν καὶ αὐτὸ ὂν φαίνεται, οὐκ ἐλαττῶσαν ἐκεῖνο ἐξ οὗ ἀνήφθη. μαρτυρήσει δέ μοι <strong>ὁ λόγος τῆς σοφίας, αὐτὸς ὢν οὗτος ὁ θεὸς ἀπὸ τοῦ πατρὸς τῶν ὅλων γεννηθείς</strong>, καὶ λόγος καὶ σοφία καὶ δύναμις καὶ δόξα τοῦ γεννήσαντος ὑπάρχων</p><p>&lt;…&gt;</p><p>εἰσὶ δὲ οἱ λόγοι οὗτοι· Καὶ εἶπεν ὁ θεός· Ἰδοὺ Ἀδὰμ γέγονεν ὡς εἷς ἐξ ἡμῶν τοῦ γινώσκειν καλὸν καὶ πονηρόν. οὐκοῦν εἰπὼν Ὡς εἷς ἐξ ἡμῶν, <strong><mark>καὶ ἀριθμὸν τῶν ἀλλήλοις συνόντων, καὶ τὸ ἐλάχιστον δύο μεμήνυκεν</mark></strong></p><p>&lt;…&gt;</p><p>τοῦτο τὸ τῷ ὄντι ἀπὸ τοῦ πατρὸς προβληθὲν γέννημα <strong><mark>πρὸ πάντων τῶν ποιημάτων συνῆν τῷ πατρί</mark></strong></p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%BF_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82-%CE%94%CE%B9%CE%AC%CE%BB%CE%BF%CE%B3%CE%BF_%CF%80%CF%81%CE%BF%CF%82_%CE%A4%CF%81%CF%8D%CF%86%CF%89%CE%BD%CE%B1#HH-61">Διάλογος πρὸς Τρύφωνα</a>)</p><h3>Ένα θέλημα στον Θεό</h3><blockquote><p>οὗτος ὅ τε τῷ Ἀβραὰμ καὶ τῷ Ἰακὼβ καὶ τῷ Μωυσεῖ ὦφθαι λεγόμενος καὶ γεγραμμένος θεὸς ἕτερός ἐστι τοῦ τὰ πάντα ποιήσαντος θεοῦ, <strong><mark>ἀριθμῷ λέγω ἀλλὰ οὐ γνώμῃ</mark></strong></p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%BF_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82-%CE%94%CE%B9%CE%AC%CE%BB%CE%BF%CE%B3%CE%BF_%CF%80%CF%81%CE%BF%CF%82_%CE%A4%CF%81%CF%8D%CF%86%CF%89%CE%BD%CE%B1#HH-56">Διάλογος πρὸς Τρύφωνα</a>)</p><h3>Ο Θεός είναι τριαδικός</h3><blockquote><p>τὸν διδάσκαλόν τε τούτων γενόμενον ἡμῖν καὶ εἰς τοῦτο γεννηθέντα Ἰησοῦν Χριστόν, τὸν σταυρωθέντα ἐπὶ Ποντίου Πιλάτου, τοῦ γενομένου ἐν Ἰουδαίᾳ ἐπὶ χρόνοις Τιβερίου Καίσαρος ἐπιτρόπου, <strong><mark>υἱὸν</mark></strong> <strong>αὐτοῦ τοῦ ὄντως θεοῦ</strong> μαθόντες <strong>καὶ ἐν</strong> <strong><mark>δευτέρᾳ</mark></strong> <strong>χώρᾳ ἔχοντες</strong>, <strong><mark>πνεῦμά</mark> τε</strong> <strong>προφητικὸν ἐν</strong> <strong><mark>τρίτῃ</mark></strong> <strong>τάξει</strong></p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82_%E1%BC%88%CF%80%CE%BF%CE%BB%CE%BF%CE%B3%CE%AF%CE%B1_1#HH-13">Ἀπολογία 1</a>)</p><h3>Ο Υιός του Θεού δεν είναι ένας Θεός χωριστός από τον Πατέρα</h3><blockquote><p>τὴν δύναμιν ταύτην γεγεννῆσθαι ἀπὸ τοῦ πατρός, δυνάμει καὶ βουλῇ αὐτοῦ, <strong><mark>ἀλλ' οὐ κατὰ ἀποτομήν, ὡς ἀπομεριζομένης τῆς τοῦ πατρὸς οὐσίας</mark></strong>, ὁποῖα τὰ ἄλλα πάντα μεριζόμενα καὶ τεμνόμενα οὐ τὰ αὐτά ἐστιν ἃ καὶ πρὶν τμηθῆναι</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%BF_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82-%CE%94%CE%B9%CE%AC%CE%BB%CE%BF%CE%B3%CE%BF_%CF%80%CF%81%CE%BF%CF%82_%CE%A4%CF%81%CF%8D%CF%86%CF%89%CE%BD%CE%B1#HH-128">Διάλογος πρὸς Τρύφωνα</a>)</p><h3>Ο Υιός του Θεού γεννήθηκε από τον Θεό με ιδιαίτερο τρόπο</h3><blockquote><p>εἰ δὲ καὶ ἰδίως, παρὰ τὴν κοινὴν γένεσιν, γεγεννῆσθαι αὐτὸν ἐκ θεοῦ λέγομεν λόγον θεοῦ, ὡς προέφημεν</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82_%E1%BC%88%CF%80%CE%BF%CE%BB%CE%BF%CE%B3%CE%AF%CE%B1_1#HH-22">Ἀπολογία 1</a>)</p><h3>Ο Θεός ως άνθρωπος γεννήθηκε από την Παρθένο</h3><blockquote><p>ὅτι ἐκ παρθένου γεννητὸς καὶ διὰ παρθένου γεννηθῆναι αὐτὸν διὰ Ἠσαίου ἐπεπροφήτευτο, καὶ αὐτὴν τὴν προφητείαν πάλιν ἔλεγον. ἔστι δὲ αὕτη· Καὶ προσέθετο κύριος λαλῆσαι τῷ Ἄχαζ, λέγων· Αἴτησαι σεαυτῷ σημεῖον παρὰ κυρίου τοῦ θεοῦ σου εἰς βάθος ἢ εἰς ὕψος. καὶ εἶπεν Ἄχαζ· Οὐ μὴ αἰτήσω οὐδὲ μὴ πειράσω κύριον. καὶ εἶπεν Ἠσαίας· Ἀκούσατε δή, οἶκος Δαυείδ. μὴ μικρὸν ὑμῖν ἀγῶνα παρέχειν ἀνθρώποις; καὶ πῶς κυρίῳ παρέχετε ἀγῶνα; διὰ τοῦτο δώσει κύριος αὐτὸς ὑμῖν σημεῖον· <strong>ἰδοὺ <mark>ἡ παρθένος</mark></strong> <strong>ἐν γαστρὶ λήψεται</strong> <strong>καὶ τέξεται υἱόν</strong>, καὶ καλέσουσι τὸ ὄνομα αὐτοῦ Ἐμμανουήλ</p><p>&lt;…&gt;</p><p>Καὶ τὸ Ἰδοὺ <mark><strong>ἡ παρθένος</strong></mark> ἐν γαστρὶ λήψεται καὶ τέξεται υἱὸν εἰς τοῦτον προείρητο. εἰ γὰρ μὴ ἐκ παρθένου οὗτος, περὶ οὗ Ἠσαίας ἔλεγεν, ἔμελλε γεννᾶσθαι, εἰς ὃν τὸ ἅγιον πνεῦμα ἐβόα· Ἰδοὺ κύριος αὐτὸς ἡμῖν δώσει σημεῖον· ἰδοὺ ἡ παρθένος ἐν γαστρὶ λήψεται καὶ τέξεται υἱόν; <strong>εἰ γὰρ ὁμοίως τοῖς ἄλλοις ἅπασι πρωτοτόκοις καὶ οὗτος γεννᾶσθαι ἐκ συνουσίας ἔμελλε, τί καὶ ὁ θεὸς σημεῖον, ὃ μὴ πᾶσι τοῖς πρωτοτόκοις κοινόν ἐστιν, ἔλεγε ποιεῖν</strong>; ἀλλ' ὅπερ ἐστὶν ἀληθῶς σημεῖον καὶ πιστὸν τῷ γένει τῶν ἀνθρώπων ἔμελλε γίνεσθαι, τοῦτ' ἔστι <strong>διὰ παρθενικῆς μήτρας τὸν πρωτότοκον τῶν πάντων ποιημάτων σαρκοποιηθέντα ἀληθῶς παιδίον γενέσθαι</strong></p><p>&lt;…&gt;</p><p><strong>μονογενὴς γὰρ ὅτι ἦν τῷ πατρὶ τῶν ὅλων</strong> οὗτος, ἰδίως ἐξ αὐτοῦ λόγος καὶ δύναμις γεγεννημένος, καὶ <strong>ὕστερον</strong> <strong><mark>ἄνθρωπος διὰ τῆς παρθένου γενόμενος</mark></strong>, ὡς ἀπὸ τῶν ἀπομνημονευμάτων ἐμάθομεν</p><p>&lt;…&gt;</p><p>ἀλλ' ἐκεῖνον τὸν κατὰ βουλὴν τὴν ἐκείνου καὶ <strong><mark>θεὸν ὄντα, υἱὸν αὐτοῦ</mark></strong>, καὶ ἄγγελον ἐκ τοῦ ὑπηρετεῖν τῇ γνώμῃ αὐτοῦ· ὃν καὶ <strong><mark>ἄνθρωπον γεννηθῆναι διὰ τῆς παρθένου</mark></strong> βεβούληται, ὃς καὶ πῦρ ποτε γέγονε τῇ πρὸς Μωυσέα ὁμιλίᾳ τῇ ἀπὸ τῆς βάτου</p><p>&lt;…&gt;</p><p>τὸν Χριστὸν τοῦτον τοῦ θεοῦ υἱόν, ὃς καὶ πρὸ ἑωσφόρου καὶ σελήνης ἦν, καὶ διὰ τῆς παρθένου ταύτης τῆς ἀπὸ τοῦ γένους τοῦ Δαυεὶδ <strong>γεννηθήναι σαρκοποιηθεὶς</strong> ὑπέμεινεν</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%BF_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82-%CE%94%CE%B9%CE%AC%CE%BB%CE%BF%CE%B3%CE%BF_%CF%80%CF%81%CE%BF%CF%82_%CE%A4%CF%81%CF%8D%CF%86%CF%89%CE%BD%CE%B1#HH-66">Διάλογος πρὸς Τρύφωνα</a>)</p><blockquote><p>ἐν δὴ ταῖς τῶν προφητῶν βίβλοις εὕρομεν προκηρυσσόμενον παραγινόμενον, <strong><mark>γεννώμενον διὰ παρθένου</mark></strong>, καὶ ἀνδρούμενον, καὶ θεραπεύοντα πᾶσαν νόσον καὶ πᾶσαν μαλακίαν καὶ νεκροὺς ἀνεγείροντα, καὶ φθονούμενον καὶ ἀγνοούμενον καὶ σταυρούμενον Ἰησοῦν τὸν ἡμέτερον Χριστόν, καὶ ἀποθνήσκοντα καὶ ἀνεγειρόμενον καὶ εἰς οὐρανοὺς ἀνερχόμενον, καὶ <strong>υἱὸν θεοῦ ὄντα καὶ κεκλημένον</strong>, καί τινας πεμπομένους ὑπ’ αὐτοῦ εἰς πᾶν γένος ἀνθρώπων κηρύξοντας ταῦτα, καὶ τοὺς ἐξ ἐθνῶν ἀνθρώπους μᾶλλον αὐτῷ πιστεύειν</p><p>&lt;…&gt;</p><p>διὰ γὰρ παρθένου τῆς ἀπὸ τοῦ σπέρματος Ἰακώβ, τοῦ γενομένου πατρὸς Ἰούδα, τοῦ δεδηλωμένου Ἰουδαίων πατρός, <strong><mark>διὰ δυνάμεως θεοῦ ἀπεκυήθη</mark></strong></p><p>&lt;…&gt;</p><p>δι’ ἣν δ’ αἰτίαν διὰ δυνάμεως τοῦ λόγου κατὰ τὴν τοῦ πατρὸς πάντων καὶ δεσπότου θεοῦ βουλὴν <strong><mark>διὰ παρθένου ἄνθρωπος ἀπεκυήθη</mark></strong> καὶ Ἰησοῦς ἐπωνομάσθη, καὶ σταυρωθεὶς ἀποθανὼν ἀνέστη καὶ ἀνελήλυθεν εἰς οὐρανόν</p><p>&lt;…&gt;</p><p>ὅτι ἐστὶν <strong><strong><mark>υἱὸς</mark></strong> τῷ πατρὶ τῶν ὅλων</strong> γινώσκοντες· <strong>ὃς καὶ <strong><mark>λόγος πρωτότοκος ὢν τοῦ θεοῦ</mark></strong></strong> <strong>καὶ <strong><mark>θεὸς</mark></strong> ὑπάρχει</strong>. καὶ πρότερον διὰ τῆς τοῦ πυρὸς μορφῆς καὶ εἰκόνος ἀσωμάτου τῷ Μωυσεῖ καὶ τοῖς ἑτέροις προφήταις ἐφάνη· νῦν δ’ ἐν χρόνοις τῆς ὑμετέρας ἀρχῆς, ὡς προείπομεν, <strong><mark>διὰ παρθένου ἄνθρωπος γενόμενος</mark></strong> κατὰ τὴν τοῦ πατρὸς βουλὴν ὑπὲρ σωτηρίας τῶν πιστευόντων αὐτῷ καὶ ἐξουθενηθῆναι καὶ παθεῖν ὑπέμεινεν, ἵνα ἀποθανὼν καὶ ἀναστὰς νικήσῃ τὸν θάνατον</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82_%E1%BC%88%CF%80%CE%BF%CE%BB%CE%BF%CE%B3%CE%AF%CE%B1_1#HH-31">Ἀπολογία 1</a>)</p><h4>Η Θεοτόκος παρέμεινε παρθένος</h4><blockquote><p>τὸ οὖν Ἰδοὺ ἡ παρθένος ἐν γαστρὶ ἕξει σημαίνει <strong><mark>οὐ συνουσιασθεῖσαν τὴν παρθένον συλλαβεῖν· εἰ γὰρ ἐσυνουσιάσθη ὑπὸ ὁτουοῦν, οὐκ ἔτι ἦν παρθένος</mark></strong>· ἀλλὰ δύναμις θεοῦ ἐπελθοῦσα τῇ παρθένῳ ἐπεσκίασεν αὐτήν, καὶ <strong><mark>κυοφορῆσαι παρθένον οὖσαν</mark></strong> πεποίηκε</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82_%E1%BC%88%CF%80%CE%BF%CE%BB%CE%BF%CE%B3%CE%AF%CE%B1_1#HH-33">Ἀπολογία 1</a>)</p><h3>Ο Χριστός είναι Θεός</h3><blockquote><p>προϋπάρχειν <mark><strong>θεὸν ὄντα πρὸ αἰώνων τοῦτον τὸν Χριστόν</strong></mark>, εἶτα καὶ <strong>γεννηθῆναι ἄνθρωπον γενόμενον ὑπομεῖναι</strong>, καὶ ὅτι οὐκ ἄνθρωπος ἐξ ἀνθρώπου, οὐ μόνον παράδοξον δοκεῖ μοι εἶναι ἀλλὰ καὶ μωρόν.</p><p>Οἶδ' ὅτι παράδοξος ὁ λόγος δοκεῖ εἶναι, καὶ μάλιστα τοῖς ἀπὸ τοῦ γένους ὑμῶν, οἵτινες τὰ τοῦ θεοῦ οὔτε νοῆσαι οὔτε ποιῆσαί ποτε βεβούλησθε, ἀλλὰ τὰ τῶν διδασκάλων ὑμῶν, ὡς αὐτὸς ὁ θεὸς βοᾷ. ἤδη μέντοι, ὦ Τρύφων, εἶπον, οὐκ ἀπόλλυται τὸ <mark><strong>τοῦτον εἶναι Χριστὸν τοῦ θεοῦ</strong></mark>, ἐὰν ἀποδεῖξαι μὴ δύνωμαι ὅτι καὶ <mark><strong>προϋπῆρχεν υἱὸς τοῦ ποιητοῦ τῶν ὅλων, θεὸς ὤν, καὶ γεγένηται ἄνθρωπος διὰ τῆς παρθένου</strong></mark>.</p><p>&lt;…&gt;</p><p>καὶ γὰρ εἰσί τινες, ὦ φίλοι, ἔλεγον, ἀπὸ τοῦ ὑμετέρου γένους <strong>ὁμολογοῦντες αὐτὸν Χριστὸν εἶναι, ἄνθρωπον δὲ ἐξ ἀνθρώπων γενόμενον ἀποφαινόμενοι· οἷς οὐ συντίθεμαι, οὐδ' ἂν πλεῖστοι ταὐτά μοι δοξάσαντες εἴποιεν</strong>, ἐπειδὴ οὐκ ἀνθρωπείοις διδάγμασι κεκελεύσμεθα ὑπ' αὐτοῦ τοῦ Χριστοῦ πείθεσθαι, ἀλλὰ τοῖς διὰ τῶν μακαρίων προφητῶν κηρυχθεῖσι καὶ δι' αὐτοῦ διδαχθεῖσι.</p><p>&lt;…&gt;</p><p>ὅτι γοῦν καὶ <mark><strong>προσκυνητός ἐστι καὶ θεὸς καὶ Χριστὸς</strong></mark> ὑπὸ τοῦ ταῦτα ποιήσαντος μαρτυρούμενος</p><p>&lt;…&gt;</p><p><mark><strong>θεὸν ἰσχυρὸν καὶ προσκυνητόν, Χριστὸν ὄντα</strong></mark></p><p>&lt;…&gt;</p><p>τονοῖ τὴν ἐλπίδα ἐκκρεμαμένην ἀπὸ τοῦ σταυρωθέντος Χριστοῦ, ἀλλ' ὡς προειπόντος τοῦ θεοῦ τὰ ὑφ' ὑμῶν πάντων καὶ τῶν ὁμοίων ὑμῖν, μὴ ἐπισταμένων τοῦτον εἶναι <strong>τὸν πρὸ πάντων ὄντα καὶ αἰώνιον τοῦ θεοῦ ἱερέα καὶ βασιλέα καὶ Χριστὸν</strong> μέλλοντα γίνεσθαι.</p><p>&lt;…&gt;</p><p>καὶ υἱὸν θεοῦ γεγραμμένον αὐτὸν ἐν τοῖς ἀπομνημονεύμασι τῶν ἀποστόλων αὐτοῦ ἔχοντες καὶ υἱὸν αὐτὸν λέγοντες νενοήκαμεν ὄντα καὶ <strong>πρὸ πάντων ποιημάτων ἀπὸ τοῦ πατρὸς δυνάμει αὐτοῦ καὶ βουλῇ προελθόντα</strong></p><p>&lt;…&gt;</p><p>ὅτι δὲ καὶ <mark><strong>θεὸν τὸν Χριστὸν καλεῖ</strong></mark>, ἐν πολλοῖς ἀποδέδεικται.</p><p>&lt;…&gt;</p><p>ὅπερ καὶ διὰ τοῦ μυστηρίου τῆς πάλης, ἣν ἐπάλαισεν Ἰακὼβ μετὰ τοῦ φαινομένου μὲν ἐκ τοῦ τῇ τοῦ πατρὸς βουλῇ ὑπηρετεῖν, <mark><strong>θεοῦ δὲ ἐκ τοῦ εἶναι τέκνον πρωτότοκον τῶν ὅλων κτισμάτων</strong></mark>, ἐπεπροφήτευτο οὕτως καὶ <strong>ἄνθρωπος γενόμενος</strong> <mark><strong>ὁ Χριστὸς</strong></mark> ποιήσειν.</p><p>&lt;…&gt;</p><p><strong>ἄγγελος μεγάλης βουλῆς</strong> ποτε, καὶ <strong>ἀνὴρ</strong> διὰ Ἰεζεκιήλ, καὶ ὡς <strong>υἱὸς ἀνθρώπου</strong> διὰ Δανιήλ, καὶ <strong>παιδίον</strong> διὰ Ἠσαίου, καὶ <strong>Χριστὸς</strong> καὶ <strong>θεὸς προσκυνητὸς</strong> διὰ Δαυείδ, καὶ <strong>Χριστὸς</strong> καὶ <strong>λίθος</strong> διὰ πολλῶν, καὶ <strong>σοφία</strong> διὰ Σολομῶνος, καὶ <strong>Ἰωσὴφ</strong> καὶ <strong>Ἰούδας</strong> καὶ <strong>ἄστρον</strong> διὰ Μωυσέως, καὶ <strong>ἀνατολὴ</strong> διὰ Ζαχαρίου, καὶ <strong>παθητὸς</strong> καὶ <strong>Ἰακὼβ</strong> καὶ <strong>Ἰσραὴλ</strong> πάλιν διὰ Ἠσαίου, καὶ <strong>ῥάβδος</strong> καὶ <strong>ἄνθος</strong> καὶ <strong>λίθος ἀκρογωνιαῖος</strong> κέκληται καὶ <strong>υἱὸς θεοῦ</strong>, εἰ ἐγνώκειτε, ὦ Τρύφων, ἔφην, οὐκ ἂν ἐβλασφημεῖτε εἰς αὐτὸν ἤδη καὶ παραγενόμενον καὶ γεννηθέντα καὶ παθόντα καὶ ἀναβάντα εἰς τὸν οὐρανόν· ὃς καὶ πάλιν παρέσται, καὶ τότε κόψονται ὑμῶν αἱ δώδεκα φυλαί. ἐπεὶ εἰ νενοήκατε τὰ εἰρημένα ὑπὸ τῶν προφητῶν, οὐκ ἂν ἐξηρνεῖσθε αὐτὸν εἶναι <mark><strong>θεόν, τοῦ μόνου καὶ ἀγεννήτου καὶ ἀρρήτου θεοῦ υἱόν</strong></mark>.</p><p>&lt;…&gt;</p><p>ἀλλ' ἐκεῖνον τὸν κατὰ βουλὴν τὴν ἐκείνου καὶ <mark><strong>θεὸν ὄντα, υἱὸν αὐτοῦ</strong></mark>, καὶ ἄγγελον ἐκ τοῦ ὑπηρετεῖν τῇ γνώμῃ αὐτοῦ· ὃν καὶ <strong>ἄνθρωπον γεννηθῆναι διὰ τῆς παρθένου</strong> βεβούληται, ὃς καὶ πῦρ ποτε γέγονε τῇ πρὸς Μωυσέα ὁμιλίᾳ τῇ ἀπὸ τῆς βάτου.</p><p>&lt;…&gt;</p><p>Καὶ ὅτι <mark><strong>κύριος ὢν ὁ Χριστός, καὶ θεὸς θεοῦ υἱὸς ὑπάρχων</strong></mark>, καὶ δυνάμει φαινόμενος πρότερον ὡς ἀνὴρ καὶ ἄγγελος, καὶ ἐν πυρὸς δόξῃ, ὡς ἐν τῇ βάτῳ, πέφανται καὶ ἐπὶ τῆς κρίσεως τῆς γεγενημένης ἐπὶ Σόδομα, ἀποδέδεικται ἐν πολλοῖς τοῖς εἰρημένοις.</p><p>&lt;…&gt;</p><p>καὶ <strong>θεὸς καὶ κύριος τῶν δυνάμεων</strong> <strong>ὁ Χριστὸς</strong> καὶ Ἰακὼβ καλεῖται ἐν παραβολῇ ὑπὸ τοῦ ἁγίου πνεύματος</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%BF_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82-%CE%94%CE%B9%CE%AC%CE%BB%CE%BF%CE%B3%CE%BF_%CF%80%CF%81%CE%BF%CF%82_%CE%A4%CF%81%CF%8D%CF%86%CF%89%CE%BD%CE%B1#HH-48">Διάλογος πρὸς Τρύφωνα</a>)</p><blockquote><p>ἡ δὲ πρώτη δύναμις μετὰ τὸν πατέρα πάντων καὶ δεσπότην θεὸν καὶ <mark><strong>υἱὸς ὁ λόγος ἐστίν· ὃς τίνα τρόπον σαρκοποιηθεὶς ἄνθρωπος γέγονεν</strong></mark></p><p>&lt;…&gt;</p><p><strong>ὅτι ἐστὶν</strong> <mark><strong>υἱὸς τῷ πατρὶ τῶν ὅλων</strong></mark> γινώσκοντες· <strong>ὃς καὶ</strong> <mark><strong>λόγος πρωτότοκος ὢν τοῦ θεοῦ</strong></mark> <strong>καὶ</strong> <mark><strong>θεὸς ὑπάρχει</strong></mark>. καὶ πρότερον διὰ τῆς τοῦ πυρὸς μορφῆς καὶ εἰκόνος ἀσωμάτου τῷ Μωυσεῖ καὶ τοῖς ἑτέροις προφήταις ἐφάνη· νῦν δ’ ἐν χρόνοις τῆς ὑμετέρας ἀρχῆς, ὡς προείπομεν, <mark><strong>διὰ παρθένου ἄνθρωπος γενόμενος</strong></mark> κατὰ τὴν τοῦ πατρὸς βουλὴν ὑπὲρ σωτηρίας τῶν πιστευόντων αὐτῷ καὶ ἐξουθενηθῆναι καὶ παθεῖν ὑπέμεινεν, ἵνα ἀποθανὼν καὶ ἀναστὰς νικήσῃ τὸν θάνατον</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82_%E1%BC%88%CF%80%CE%BF%CE%BB%CE%BF%CE%B3%CE%AF%CE%B1_1#HH-32">Ἀπολογία 1</a>)</p><h3>Ο Χριστός είναι Θεός και άνθρωπος</h3><blockquote><p>ἀπ' ἄκρων τῶν οὐρανῶν προέρχεσθαι ἔμελλεν καὶ πάλιν εἰς τοὺς αὐτοὺς τόπους ἀνιέναι ἐμηνύετο, ἀναμνήσθητε, ἵνα καὶ <mark><strong>θεὸν ἄνωθεν προελθόντα καὶ ἄνθρωπον</strong></mark> ἐν ἀνθρώποις γενόμενον γνωρίσητε, καὶ πάλιν ἐκεῖνον παραγενησόμενον, ὃν ὁρᾶν μέλλουσι καὶ κόπτεσθαι οἱ ἐκκεντήσαντες αὐτόν.</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%BF_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82-%CE%94%CE%B9%CE%AC%CE%BB%CE%BF%CE%B3%CE%BF_%CF%80%CF%81%CE%BF%CF%82_%CE%A4%CF%81%CF%8D%CF%86%CF%89%CE%BD%CE%B1#HH-64">Διάλογος πρὸς Τρύφωνα</a>)</p><blockquote><p>ὑπ’ αὐτοῦ τοῦ <strong>λόγου</strong> μορφωθέντος καὶ <strong>ἀνθρώπου γενομένου καὶ Ἰησοῦ Χριστοῦ κληθέντος</strong></p><p>&lt;…&gt;</p><p><strong>ὅτι ἐστὶν</strong> <mark><strong>υἱὸς τῷ πατρὶ τῶν ὅλων</strong></mark> γινώσκοντες· <strong>ὃς καὶ</strong> <mark><strong>λόγος πρωτότοκος ὢν τοῦ θεοῦ</strong></mark> <strong>καὶ</strong> <mark><strong>θεὸς ὑπάρχει</strong></mark>. καὶ πρότερον διὰ τῆς τοῦ πυρὸς μορφῆς καὶ εἰκόνος ἀσωμάτου τῷ Μωυσεῖ καὶ τοῖς ἑτέροις προφήταις ἐφάνη· νῦν δ’ ἐν χρόνοις τῆς ὑμετέρας ἀρχῆς, ὡς προείπομεν, <mark><strong>διὰ παρθένου ἄνθρωπος γενόμενος</strong></mark> κατὰ τὴν τοῦ πατρὸς βουλὴν ὑπὲρ σωτηρίας τῶν πιστευόντων αὐτῷ καὶ ἐξουθενηθῆναι καὶ παθεῖν ὑπέμεινεν, ἵνα ἀποθανὼν καὶ ἀναστὰς νικήσῃ τὸν θάνατον</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82_%E1%BC%88%CF%80%CE%BF%CE%BB%CE%BF%CE%B3%CE%AF%CE%B1_1#HH-5">Ἀπολογία 1</a>)</p><blockquote><p>τὸν γὰρ ἀπὸ <strong>ἀγεννήτου καὶ ἀρρήτου</strong> <mark><strong>θεοῦ</strong></mark> <mark><strong>λόγον</strong></mark> <strong>μετὰ τὸν θεὸν προσκυνοῦμεν καὶ ἀγαπῶμεν</strong>, ἐπειδὴ καὶ <mark><strong>δι’ ἡμᾶς ἄνθρωπος γέγονεν</strong></mark>, ὅπως καὶ τῶν παθῶν τῶν ἡμετέρων συμμέτοχος γενόμενος καὶ ἴασιν ποιήσηται.</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82_%E1%BC%88%CF%80%CE%BF%CE%BB%CE%BF%CE%B3%CE%AF%CE%B1_2#HH-13">Ἀπολογία 2</a>)</p><h3>Ο Χριστός (ανθρώπινο σώμα και ψυχή) ανήκει εξ ολοκλήρου στον Θεό</h3><blockquote><p>τὸ λογικὸν τὸ ὅλον τὸν φανέντα δι’ ἡμᾶς Χριστὸν γεγονέναι, <strong>καὶ σῶμα καὶ λόγον καὶ ψυχήν</strong>.</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82_%E1%BC%88%CF%80%CE%BF%CE%BB%CE%BF%CE%B3%CE%AF%CE%B1_2#HH-10">Ἀπολογία 2</a>)</p><h2>Ο νόμος του Μωυσή</h2><h3>Ο Χριστός εκπλήρωσε τον νόμο για να πραγματοποιήσει το θέλημα του Πατέρα</h3><blockquote><p>Ὡμολόγησά τε καὶ ὁμολογῶ· ἀλλ' οὐχ ὡς δικαιούμενον αὐτὸν διὰ τούτων ὡμολόγησα ὑπομεμενηκέναι πάντα, ἀλλὰ <strong>τὴν οἰκονομίαν ἀπαρτίζοντα, ἣν ἤθελεν ὁ πατὴρ αὐτοῦ</strong> καὶ τῶν ὅλων ποιητὴς καὶ κύριος καὶ θεός</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%BF_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82-%CE%94%CE%B9%CE%AC%CE%BB%CE%BF%CE%B3%CE%BF_%CF%80%CF%81%CE%BF%CF%82_%CE%A4%CF%81%CF%8D%CF%86%CF%89%CE%BD%CE%B1#HH-67">Διάλογος πρὸς Τρύφωνα</a>)</p><h3>Ο νόμος του Μωυσή καταργήθηκε</h3><blockquote><p><strong>ὁ γὰρ ἐν Χωρὴβ παλαιὸς ἤδη νόμος καὶ ὑμῶν μόνων, ὁ δὲ πάντων ἁπλῶς</strong>· <strong>νόμος δὲ κατὰ νόμου τεθεὶς</strong> <strong>τὸν πρὸ αὐτοῦ</strong> <strong><mark>ἔπαυσε</mark></strong>, καὶ διαθήκη μετέπειτα γενομένη <strong>τὴν προτέραν</strong> ὁμοίως <strong><mark>ἔστησεν</mark></strong>. <strong>αἰώνιός τε ἡμῖν νόμος καὶ τελευταῖος ὁ Χριστὸς ἐδόθη καὶ ἡ διαθήκη πιστή, μεθ' ἣν οὐ νόμος, οὐ πρόσταγμα, οὐκ ἐντολή</strong></p><p>&lt;…&gt;</p><p>ὁρᾶτε ὅτι τὰ στοιχεῖα οὐκ ἀργεῖ <strong><mark>οὐδὲ σαββατίζει</mark></strong>. μείνατε ὡς γεγένησθε. <strong><mark>εἰ γὰρ πρὸ τοῦ Ἀβραὰμ οὐκ ἦν χρεία περιτομῆς οὐδὲ πρὸ Μωυσέως σαββατισμοῦ καὶ ἑορτῶν καὶ προσφορῶν, οὐδὲ νῦν</mark></strong>, μετὰ τὸν κατὰ τὴν βουλὴν τοῦ θεοῦ διὰ Μαρίας τῆς ἀπὸ γένους τοῦ Ἀβραὰμ παρθένου γεννηθέντα υἱὸν θεοῦ Ἰησοῦν Χριστόν, <strong><mark>ὁμοίως ἐστὶ χρεία</mark></strong>. καὶ γὰρ αὐτὸς ὁ Ἀβραὰμ ἐν ἀκροβυστίᾳ ὢν διὰ τὴν πίστιν, ἣν ἐπίστευσε τῷ θεῷ, ἐδικαιώθη καὶ εὐλογήθη, ὡς ἡ γραφὴ σημαίνει· τὴν δὲ περιτομὴν εἰς σημεῖον, ἀλλ' οὐκ εἰς δικαιοσύνην ἔλαβεν, ὡς καὶ αἱ γραφαὶ καὶ τὰ πράγματα ἀναγκάζει ἡμᾶς ὁμολογεῖν</p><p>&lt;…&gt;</p><p>τὰ δὲ ἔθνη τὰ πιστεύσαντα εἰς αὐτὸν καὶ μετανοήσαντα ἐφ' οἷς ἥμαρτον, αὐτοὶ κληρονομήσουσι μετὰ τῶν πατριαρχῶν καὶ τῶν προφητῶν καὶ τῶν δικαίων ὅσοι ἀπὸ Ἰακὼβ γεγέννηνται· <strong><mark>εἰ καὶ μὴ σαββατίζουσι μηδὲ περιτέμνονται μηδὲ τὰς ἑορτὰς φυλάσσουσι</mark></strong>, πάντως κληρονομήσουσι τὴν ἁγίαν τοῦ θεοῦ κληρονομίαν</p><p>&lt;…&gt;</p><p><strong>θερμὸν πίνομεν ἐν τοῖς σάββασι</strong>, δεινὸν ἡγεῖσθε· ἐπειδὴ καὶ ὁ θεὸς τὴν αὐτὴν διοίκησιν τοῦ κόσμου ὁμοίως καὶ ἐν ταύτῃ τῇ ἡμέρᾳ πεποίηται καθάπερ καὶ ἐν ταῖς ἄλλαις ἁπάσαις, καὶ οἱ ἀρχιερεῖς τὰς προσφορὰς καθὰ καὶ ταῖς ἄλλαις ἡμέραις καὶ ἐν ταύτῃ κεκελευσμένοι ἦσαν ποιεῖσθαι, καὶ οἱ τοσοῦτοι δίκαιοι <strong><mark>μηδὲν τούτων τῶν νομίμων πράξαντες</mark></strong> μεμαρτύρηνται ὑπὸ τοῦ θεοῦ αὐτοῦ</p><p>&lt;…&gt;</p><p>κἂν Σκύθης ᾖ τις ἢ Πέρσης, <strong>ἔχει δὲ τὴν τοῦ θεοῦ γνῶσιν καὶ τοῦ Χριστοῦ αὐτοῦ</strong> καὶ φυλάσσει <strong>τὰ αἰώνια δίκαια</strong>, περιτέτμηται τὴν καλὴν καὶ ὠφέλιμον περιτομήν, καὶ φίλος ἐστὶ τῷ θεῷ, καὶ ἐπὶ τοῖς δώροις αὐτοῦ καὶ ταῖς προσφοραῖς χαίρει</p><p>&lt;…&gt;</p><p>σύνετε, βοῶ, ὅτι τὸ αἷμα τῆς περιτομῆς ἐκείνης κατήργηται, καὶ αἵματι σωτηρίῳ πεπιστεύκαμεν· <strong><mark>ἄλλη διαθήκη τὰ νῦν, καὶ ἄλλος ἐξῆλθεν ἐκ Σιὼν νόμος</mark></strong></p><p>&lt;…&gt;</p><p><strong>ἀπὸ Ἀβραὰμ ἤρξατο περιτομὴ</strong> καὶ <strong>ἀπὸ Μωυσέως σάββατον καὶ θυσίαι καὶ προσφοραὶ καὶ ἑορταί</strong>, καὶ ἀπεδείχθη <strong>διὰ τὸ σκληροκάρδιον τοῦ λαοῦ ὑμῶν ταῦτα διατετάχθαι</strong>, οὕτως <strong><mark>παύσασθαι ἔδει</mark></strong> κατὰ τὴν τοῦ πατρὸς βουλὴν εἰς τὸν διὰ τῆς ἀπὸ τοῦ γένους τοῦ Ἀβραὰμ καὶ φυλῆς Ἰούδα καὶ Δαυεὶδ παρθένου γεννηθέντα υἱὸν τοῦ θεοῦ Χριστόν, ὅστις καὶ <strong><mark>αἰώνιος νόμος καὶ καινὴ διαθήκη τῷ παντὶ κόσμῳ</mark></strong> ἐκηρύςσετο προελευσόμενος, ὡς αἱ προλελεγμέναι προφητεῖαι σημαίνουσι</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%BF_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82-%CE%94%CE%B9%CE%AC%CE%BB%CE%BF%CE%B3%CE%BF_%CF%80%CF%81%CE%BF%CF%82_%CE%A4%CF%81%CF%8D%CF%86%CF%89%CE%BD%CE%B1#HH-11">Διάλογος πρὸς Τρύφωνα</a>)</p><h3>Η αληθινή σημασία του νόμου του Μωυσή είναι συμβολική και αιώνια και εκπληρώνεται από τους χριστιανούς</h3><blockquote><p><strong>συκοφαντεῖσθαι δυνατός ἐστιν ὁ θεὸς ὑπὸ τῶν νοῦν μὴ ἐχόντων, ὡς τὰ αὐτὰ δίκαια μὴ πάντας ἀεὶ διδάξας</strong>. πολλοῖς γὰρ ἀνθρώποις ἄλογα καὶ οὐκ ἄξια θεοῦ τὰ τοιαῦτα διδάγματα ἔδοξεν εἶναι, μὴ λαβοῦσι χάριν τοῦ γνῶναι ὅτι τὸν λαὸν ὑμῶν πονηρευόμενον καὶ ἐν νόσῳ ψυχικῇ ὑπάρχοντα εἰς ἐπιστροφὴν καὶ μετάνοιαν τοῦ πνεύματος κέκληκε, καὶ αἰώνιός ἐστι μετὰ τὸν Μωυσέως θάνατον προελθοῦσα ἡ προφητεία. καὶ διὰ τοῦ ψαλμοῦ τοῦτο εἴρηται, ὦ ἄνδρες. καὶ ὅτι <strong>γλυκύτερα ὑπὲρ μέλι καὶ κηρίον ὁμολογοῦμεν αὐτά, οἱ σοφισθέντες ἀπ' αὐτῶν, ἐκ τοῦ καὶ μέχρι θανάτου ἀνεξαρνήτους ἡμᾶς γίνεσθαι τοῦ ὀνόματος αὐτοῦ</strong> φαίνεται. ὅτι δὲ καὶ <strong>αἰτοῦμεν αὐτόν, οἱ πιστεύοντες εἰς αὐτόν, ἵνα ἀπὸ τῶν ἀλλοτρίων, τοῦτ' ἔστιν ἀπὸ τῶν πονηρῶν καὶ πλάνων πνευμάτων, συντηρήσῃ ἡμᾶς, ἀπὸ προσώπου ἑνὸς τῶν εἰς αὐτὸν πιστευόντων</strong> <strong><mark>σχηματοποιήσας</mark></strong> <strong>ὁ λόγος τῆς προφητείας λέγει</strong>, πᾶσι φανερόν ἐστιν</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%BF_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82-%CE%94%CE%B9%CE%AC%CE%BB%CE%BF%CE%B3%CE%BF_%CF%80%CF%81%CE%BF%CF%82_%CE%A4%CF%81%CF%8D%CF%86%CF%89%CE%BD%CE%B1#HH-30">Διάλογος πρὸς Τρύφωνα</a>)</p><h3>Η αιτία του νόμου του Μωυσή</h3><h4>Η αιτία των θυσιών</h4><blockquote><p>Ὁμοίως δὲ ἀνερωτῶ σε πάλιν, ἔφην· Τὰς προσφορὰς καὶ τὰς θυσίας δι' ἔνδειαν ὁ θεὸς ἐνετείλατο ποιεῖν τοὺς πατέρας ὑμῶν, ἢ <strong>διὰ τὸ σκληροκάρδιον αὐτῶν καὶ εὐχερὲς πρὸς εἰδωλολατρείαν</strong>;</p><p>Καὶ τοῦτο, ἔφη, αἱ γραφαὶ ὁμοίως ἀναγκάζουσιν ὁμολογεῖν ἡμᾶς</p><p>&lt;…&gt;</p><p><strong>διὰ τὰς ἁμαρτίας τοῦ λαοῦ ὑμῶν καὶ διὰ τὰς εἰδωλολατρείας</strong>, ἀλλ' οὐ διὰ τὸ ἐνδεὴς εἶναι τῶν τοιούτων προσφορῶν, ἐνετείλατο ὁμοίως ταῦτα γίνεσθαι, ἀκούσατε πῶς περὶ τούτων λέγει διὰ Ἀμώς, ἑνὸς τῶν δώδεκα</p><p>&lt;…&gt;</p><p>οὔτε οὖν θυσίας παρ' ὑμῶν λαμβάνει, <strong>οὔτε ὡς ἐνδεὴς τὴν ἀρχὴν ἐνετείλατο ποιεῖν, ἀλλὰ διὰ τὰς ἁμαρτίας ὑμῶν</strong>. καὶ γὰρ τὸν ναὸν τὸν ἐν Ἰερουσαλὴμ ἐπικληθέντα οὐχ ὡς ἐνδεὴς ὢν ὡμολόγησεν οἶκον αὐτοῦ ἢ αὐλήν, ἀλλ' ὅπως καὶ κατὰ τοῦτο προσέχοντες αὐτῷ μὴ εἰδωλολατρῆτε. καὶ ὅτι τοῦτό ἐστιν, Ἠσαίας λέγει</p><p>&lt;…&gt;</p><p><strong>ἀπὸ Ἀβραὰμ ἤρξατο περιτομὴ</strong> καὶ <strong>ἀπὸ Μωυσέως σάββατον καὶ θυσίαι καὶ προσφοραὶ καὶ ἑορταί</strong>, καὶ ἀπεδείχθη <strong>διὰ τὸ σκληροκάρδιον τοῦ λαοῦ ὑμῶν ταῦτα διατετάχθαι</strong>, οὕτως παύσασθαι ἔδει κατὰ τὴν τοῦ πατρὸς βουλὴν εἰς τὸν διὰ τῆς ἀπὸ τοῦ γένους τοῦ Ἀβραὰμ καὶ φυλῆς Ἰούδα καὶ Δαυεὶδ παρθένου γεννηθέντα υἱὸν τοῦ θεοῦ Χριστόν</p><p>&lt;…&gt;</p><p>τὶς μὲν <strong>ἐντολὴ εἰς θεοσέβειαν καὶ δικαιοπραξίαν διετέτακτο</strong>, τὶς δὲ <strong><mark>ἐντολὴ καὶ πρᾶξις ὁμοίως εἴρητο ἢ εἰς μυστήριον τοῦ Χριστοῦ ἢ διὰ τὸ σκληροκάρδιον τοῦ λαοῦ ὑμῶν</mark></strong></p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%BF_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82-%CE%94%CE%B9%CE%AC%CE%BB%CE%BF%CE%B3%CE%BF_%CF%80%CF%81%CE%BF%CF%82_%CE%A4%CF%81%CF%8D%CF%86%CF%89%CE%BD%CE%B1#HH-67">Διάλογος πρὸς Τρύφωνα</a>)</p><h4>Η αιτία του Σαββάτου</h4><blockquote><p><strong>διὰ τὰς ἀδικίας ὑμῶν καὶ τῶν πατέρων ὑμῶν</strong> εἰς σημεῖον, ὡς προέφην, <strong>καὶ τὸ σάββατον ἐντέταλται ὁ θεὸς φυλάσσειν ὑμᾶς καὶ τὰ ἄλλα προστάγματα προσετετάχει</strong>, καὶ σημαίνει ὅτι διὰ τὰ ἔθνη, ἵνα μὴ βεβηλωθῇ τὸ ὄνομα αὐτοῦ παρ' αὐτοῖς, διὰ τοῦτο εἴασέ τινας ἐξ ὑμῶν ὅλως ζῶντας, αὐταὶ αἱ φωναὶ αὐτοῦ τὴν ἀπόδειξιν ποιήσασθαι δύνανται ὑμῖν</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%BF_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82-%CE%94%CE%B9%CE%AC%CE%BB%CE%BF%CE%B3%CE%BF_%CF%80%CF%81%CE%BF%CF%82_%CE%A4%CF%81%CF%8D%CF%86%CF%89%CE%BD%CE%B1#HH-21">Διάλογος πρὸς Τρύφωνα</a>)</p><p>Οι προφήτες υπενθύμιζαν το Σάββατο εξαιτίας της διαφθοράς του λαού, της εγκατάλειψης της θεοσέβειας και της στροφής στην ειδωλολατρία:</p><blockquote><p>Οὐχ ὡς ἐναντιουμένων μοι τῶν τοιούτων προφητειῶν, ὦ φίλοι, παρέλιπον αὐτάς, ἀλλὰ ὡς ὑμῶν νενοηκότων καὶ νοούντων ὅτι, κἂν διὰ πάντων τῶν προφητῶν κελεύῃ ὑμῖν τὰ αὐτὰ ποιεῖν ἃ καὶ διὰ Μωυσέως ἐκέλευσε, <strong><mark>διὰ τὸ σκληροκάρδιον ὑμῶν καὶ ἀχάριστον εἰς αὐτὸν ἀεὶ τὰ αὐτὰ βοᾷ</mark></strong>, ἵνα κἂν οὕτως ποτὲ μετανοήσαντες εὐαρεστῆτε αὐτῷ, καὶ μήτε τὰ τέκνα ὑμῶν τοῖς δαιμονίοις θύητε, μήτε κοινωνοὶ κλεπτῶν καὶ φιλοῦντες δῶρα καὶ διώκοντες ἀνταπόδομα, ὀρφανοῖς οὐ κρίνοντες καὶ κρίσει χήρας οὐ προσέχοντες, ἀλλ' οὐδὲ πλήρεις τὰς χεῖρας αἵματος</p><p>...</p><p>ὥστε ὃν τρόπον τὴν ἀρχὴν διὰ τὰς κακίας ὑμῶν ταῦτα ἐντέταλτο, ὁμοίως διὰ τὴν ἐν τούτοις ὑπομονήν, μᾶλλον δὲ ἐπίτασιν, <strong><mark>διὰ τῶν αὐτῶν εἰς ἀνάμνησιν αὐτοῦ</mark></strong> καὶ γνῶσιν ὑμᾶς καλεῖ</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%BF_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82-%CE%94%CE%B9%CE%AC%CE%BB%CE%BF%CE%B3%CE%BF_%CF%80%CF%81%CE%BF%CF%82_%CE%A4%CF%81%CF%8D%CF%86%CF%89%CE%BD%CE%B1">Διάλογος πρὸς Τρύφωνα, 27</a>)</p><h4>Η κοινή αιτία</h4><blockquote><p><strong>δι' αἰτίαν δὲ τὴν τῶν ἁμαρτωλῶν ἀνθρώπων</strong> τὸν αὐτὸν ὄντα ἀεὶ ταῦτα καὶ τὰ τοιαῦτα ἐντετάλθαι ὁμολογεῖν, καὶ φιλάνθρωπον καὶ προγνώστην καὶ ἀνενδεῆ καὶ δίκαιον καὶ ἀγαθὸν ἀποφαίνειν ἔστιν</p><p>&lt;…&gt;</p><p><strong>τὸν λαὸν ὑμῶν πονηρευόμενον καὶ ἐν νόσῳ ψυχικῇ ὑπάρχοντα</strong> εἰς ἐπιστροφὴν καὶ μετάνοιαν τοῦ πνεύματος κέκληκε</p><p>&lt;…&gt;</p><p><strong><mark>Διὰ τὸ σκληροκάρδιον τοῦ λαοῦ ὑμῶν</mark></strong> <strong>πάντα τὰ τοιαῦτα ἐντάλματα νοεῖτε τὸν θεὸν διὰ Μωυσέως ἐντειλάμενον ὑμῖν</strong>, ἵνα διὰ πολλῶν τούτων ἐν πάσῃ πράξει πρὸ ὀφθαλμῶν ἀεὶ ἔχητε τὸν θεὸν καὶ μήτε ἀδικεῖν μήτε ἀσεβεῖν ἄρχησθε. καὶ γὰρ τὸ κόκκινον βάμμα περιτιθέναι αὐτοῖς ἐνετείλατο ὑμῖν, ἵνα διὰ τούτου μὴ λήθη ὑμᾶς λαμβάνῃ τοῦ θεοῦ, καὶ φυλακτήριον ἐν ὑμέσι λεπτοτάτοις γεγραμμένων χαρακτήρων τινῶν, ἃ πάντως ἅγια νοοῦμεν εἶναι, περικεῖσθαι ὑμᾶς ἐκέλευσε, καὶ διὰ τούτων δυσωπῶν ὑμᾶς ἀεὶ μνήμην ἔχειν τοῦ θεοῦ, ἅμα τε καὶ ἔλεγχον ἐν ταῖς καρδίαις ὑμῶν. οὐ δὲ μικρὰν μνήμην ἔχετε τοῦ θεοσεβεῖν</p><p>...</p><p>καὶ <strong>οὐδὲν συμβάλλεσθαι πρὸς δικαιοπραξίαν καὶ εὐσέβειαν</strong> τὰ <strong><mark>διὰ τὴν σκληροκαρδίαν τοῦ λαοῦ ὑμῶν</mark></strong> <strong>διαταχθέντα</strong> γινώσκομεν</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%BF_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82-%CE%94%CE%B9%CE%AC%CE%BB%CE%BF%CE%B3%CE%BF_%CF%80%CF%81%CE%BF%CF%82_%CE%A4%CF%81%CF%8D%CF%86%CF%89%CE%BD%CE%B1#HH-23">Διάλογος πρὸς Τρύφωνα</a>)</p><h3>Αφιερώνει στον Θεό όλη τη ζωή, όχι το Σάββατο</h3><blockquote><p><strong><mark>σαββατίζειν ὑμᾶς ὁ καινὸς νόμος διὰ παντὸς ἐθέλει, καὶ ὑμεῖς μίαν ἀργοῦντες ἡμέραν εὐσεβεῖν δοκεῖτε</mark></strong>, μὴ νοοῦντες διὰ τί ὑμῖν προσετάγη· καὶ ἐὰν ἄζυμον ἄρτον φάγητε, πεπληρωκέναι τὸ θέλημα τοῦ θεοῦ φατε. οὐκ ἐν τούτοις εὐδοκεῖ κύριος ὁ θεὸς ἡμῶν. <strong>εἴ τις ἐστὶν ἐν ὑμῖν ἐπίορκος ἢ κλέπτης, παυσάσθω</strong>· <strong><mark>εἴ τις μοιχός, μετανοησάτω, καὶ σεσαββάτικε τὰ τρυφερὰ καὶ ἀληθινὰ σάββατα τοῦ θεοῦ</mark></strong><strong>·</strong></p><p>&lt;…&gt;</p><p>καὶ γὰρ <strong><mark>μὴ σαββατίσαντες οἱ προωνομασμένοι πάντες δίκαιοι τῷ θεῷ εὐηρέστησαν</mark></strong> καὶ μετ' αὐτοὺς Ἀβραὰμ καὶ οἱ τούτου υἱοὶ ἅπαντες μέχρι Μωυσέως, ἐφ' οὗ ἄδικος καὶ ἀχάριστος εἰς τὸν θεὸν ὁ λαὸς ὑμῶν ἐφάνη ἐν τῇ ἐρήμῳ μοσχοποιήσας. ὅθεν ὁ θεὸς ἁρμοσάμενος πρὸς τὸν λαὸν ἐκεῖνον καὶ θυσίας φέρειν ὡς πρὸς ὄνομα αὐτοῦ ἐνετείλατο, ἵνα μὴ εἰδωλολατρῆτε· ὅπερ οὐδὲ ἐφυλάξατε, ἀλλὰ καὶ τὰ τέκνα ὑμῶν ἐθύετε τοῖς δαιμονίοις. <strong>καὶ σαββατίζειν οὖν ὑμῖν προστέταχεν, ἵνα μνήμην λαμβάνητε τοῦ θεοῦ</strong>· καὶ γὰρ ὁ λόγος αὐτοῦ τοῦτο σημαίνει λέγων· Τοῦ γινώσκειν ὅτι ἐγώ εἰμι ὁ θεὸς ὁ λυτρωσάμενος ὑμᾶς</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%BF_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82-%CE%94%CE%B9%CE%AC%CE%BB%CE%BF%CE%B3%CE%BF_%CF%80%CF%81%CE%BF%CF%82_%CE%A4%CF%81%CF%8D%CF%86%CF%89%CE%BD%CE%B1#HH-12">Διάλογος πρὸς Τρύφωνα</a>)</p><h3>Η Κυριακή είναι μεγαλύτερη από το Σάββατο</h3><blockquote><p><strong><mark>ἡ ἡμέρα ἡ ὀγδόη</mark></strong> μυστήριόν τι εἶχε κηρυσσόμενον διὰ τούτων ὑπὸ τοῦ θεοῦ μᾶλλον τῆς ἑβδόμης. ἀλλ' ἵνα τὰ νῦν μὴ ἐπ' ἄλλους ἐκτρέπεσθαι λόγους δοκῶ, σύνετε, βοῶ, ὅτι τὸ αἷμα τῆς περιτομῆς ἐκείνης κατήργηται, καὶ αἵματι σωτηρίῳ πεπιστεύκαμεν· <strong>ἄλλη διαθήκη τὰ νῦν, καὶ ἄλλος ἐξῆλθεν ἐκ Σιὼν νόμος</strong></p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%BF_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82-%CE%94%CE%B9%CE%AC%CE%BB%CE%BF%CE%B3%CE%BF_%CF%80%CF%81%CE%BF%CF%82_%CE%A4%CF%81%CF%8D%CF%86%CF%89%CE%BD%CE%B1#HH-24">Διάλογος πρὸς Τρύφωνα</a>)</p><h4>Οι συνάξεις την Κυριακή</h4><p>Στη Ρωμαϊκή Αυτοκρατορία αυτή η ημέρα της εβδομάδας ονομαζόταν ημέρα του ήλιου:</p><blockquote><p><strong><mark>τῇ τοῦ ἡλίου λεγομένῃ ἡμέρᾳ πάντων κατὰ πόλεις ἢ ἀγροὺς μενόντων ἐπὶ τὸ αὐτὸ συνέλευσις γίνεται</mark></strong>, καὶ τὰ ἀπομνημονεύματα τῶν ἀποστόλων ἢ τὰ συγγράμματα τῶν προφητῶν ἀναγινώσκεται, μέχρις ἐγχωρεῖ. εἶτα παυσαμένου τοῦ ἀναγινώσκοντος ὁ προεστὼς διὰ λόγου τὴν νουθεσίαν καὶ πρόκλησιν τῆς τῶν καλῶν τούτων μιμήσεως ποιεῖται. ἔπειτα ἀνιστάμεθα κοινῇ πάντες καὶ εὐχὰς πέμπομεν· καί, ὡς προέφημεν, παυσαμένων ἡμῶν τῆς εὐχῆς ἄρτος προσφέρεται καὶ οἶνος καὶ ὕδωρ, καὶ ὁ προεστὼς εὐχὰς ὁμοίως καὶ εὐχαριστίας, ὅση δύναμις αὐτῷ, ἀναπέμπει, καὶ ὁ λαὸς ἐπευφημεῖ λέγων τὸ Ἀμήν, καὶ ἡ διάδοσις καὶ ἡ μετάληψις ἀπὸ τῶν εὐχαριστηθέντων ἑκάστῳ γίνεται, καὶ τοῖς οὐ παροῦσι διὰ τῶν διακόνων πέμπεται</p><p>...</p><p><strong><mark>τὴν δὲ τοῦ ἡλίου ἡμέραν κοινῇ πάντες τὴν συνέλευσιν ποιούμεθα</mark></strong>, ἐπειδὴ πρώτη ἐστὶν ἡμέρα, ἐν ᾗ ὁ θεὸς τὸ σκότος καὶ τὴν ὕλην τρέψας κόσμον ἐποίησε, καὶ Ἰησοῦς Χριστὸς ὁ ἡμέτερος σωτὴρ τῇ αὐτῇ ἡμέρᾳ ἐκ νεκρῶν ἀνέστη· τῇ γὰρ πρὸ τῆς κρονικῆς ἐσταύρωσαν αὐτόν, καὶ τῇ μετὰ τὴν κρονικήν, ἥτις ἐστὶν ἡλίου ἡμέρα, φανεὶς τοῖς ἀποστόλοις αὐτοῦ καὶ μαθηταῖς ἐδίδαξε ταῦτα, ἅπερ εἰς ἐπίσκεψιν καὶ ὑμῖν ἀνεδώκαμεν</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82_%E1%BC%88%CF%80%CE%BF%CE%BB%CE%BF%CE%B3%CE%AF%CE%B1_1#HH-67">Ἀπολογία 1</a>)</p><h2>Η σωτηρία (Σωτηριολογία)</h2><h3>Ο Θεός έγινε άνθρωπος για να σώσει τους ανθρώπους</h3><blockquote><p>καὶ Ἰησοῦς Χριστὸς <strong>μόνος ἰδίως υἱὸς τῷ θεῷ γεγέννηται</strong>, λόγος αὐτοῦ ὑπάρχων καὶ πρωτότοκος καὶ δύναμις, καὶ τῇ βουλῇ αὐτοῦ <strong><mark>γενόμενος ἄνθρωπος ταῦτα ἡμᾶς ἐδίδαξεν ἐπ’ ἀλλαγῇ καὶ ἐπαναγωγῇ τοῦ ἀνθρωπείου γένους</mark></strong></p><p>&lt;…&gt;</p><p>ὅτι ἐστὶν <strong><mark>υἱὸς</mark></strong> <strong>τῷ πατρὶ τῶν ὅλων</strong> γινώσκοντες· <strong>ὃς καὶ</strong> <strong><mark>λόγος πρωτότοκος ὢν τοῦ θεοῦ</mark></strong> καὶ <strong><mark>θεὸς</mark></strong> <strong>ὑπάρχει</strong>. καὶ πρότερον διὰ τῆς τοῦ πυρὸς μορφῆς καὶ εἰκόνος ἀσωμάτου τῷ Μωυσεῖ καὶ τοῖς ἑτέροις προφήταις ἐφάνη· νῦν δ’ ἐν χρόνοις τῆς ὑμετέρας ἀρχῆς, ὡς προείπομεν, <strong><mark>διὰ παρθένου ἄνθρωπος γενόμενος</mark></strong> κατὰ τὴν τοῦ πατρὸς βουλὴν <strong><mark>ὑπὲρ σωτηρίας τῶν πιστευόντων αὐτῷ</mark></strong> καὶ ἐξουθενηθῆναι καὶ παθεῖν ὑπέμεινεν, <strong><mark>ἵνα ἀποθανὼν καὶ ἀναστὰς νικήσῃ τὸν θάνατον</mark></strong></p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82_%E1%BC%88%CF%80%CE%BF%CE%BB%CE%BF%CE%B3%CE%AF%CE%B1_1#HH-23">Ἀπολογία 1</a>)</p><blockquote><p>τὸν γὰρ ἀπὸ <strong>ἀγεννήτου καὶ ἀρρήτου</strong> <strong><mark>θεοῦ</mark></strong> <strong><mark>λόγον</mark></strong> <strong>μετὰ τὸν θεὸν προσκυνοῦμεν καὶ ἀγαπῶμεν</strong>, ἐπειδὴ καὶ <strong><mark>δι’ ἡμᾶς ἄνθρωπος γέγονεν</mark></strong>, <strong><mark>ὅπως καὶ τῶν παθῶν τῶν ἡμετέρων συμμέτοχος γενόμενος καὶ ἴασιν ποιήσηται</mark></strong></p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82_%E1%BC%88%CF%80%CE%BF%CE%BB%CE%BF%CE%B3%CE%AF%CE%B1_2#HH-13">Ἀπολογία 2</a>)</p><h3>Για τη σωτηρία χρειάζονται πίστη και έργα</h3><blockquote><p>τοῦ γὰρ αἰωνίου καὶ καθαροῦ βίου ἐπιθυμοῦντες τῆς μετὰ θεοῦ τοῦ πάντων πατρὸς καὶ δημιουργοῦ διαγωγῆς ἀντιποιούμεθα, καὶ σπεύδομεν ἐπὶ τὸ ὁμολογεῖν, οἱ πεπεισμένοι καὶ πιστεύοντες <strong>τυχεῖν τούτων δύνασθαι τοὺς</strong> τὸν θεὸν <strong><mark>δι’ ἔργων πείσαντας</mark></strong>, <strong>ὅτι αὐτῷ εἵποντο καὶ τῆς παρ’ αὐτῷ διαγωγῆς ἤρων</strong>, ἔνθα κακία οὐκ ἀντιτυπεῖ</p><p>&lt;…&gt;</p><p>προγνώστου τοῦ θεοῦ ὄντος τῶν μελλόντων ὑπὸ πάντων ἀνθρώπων πραχθήσεσθαι, καὶ δόγματος ὄντος παρ’ αὐτόν, <strong><mark>κατ’ ἀξίαν τῶν πράξεων</mark></strong> <strong>ἕκαστον ἀμείψεσθαι μέλλοντα τῶν ἀνθρώπων</strong>, <strong>καὶ τὰ παρ’ αὐτοῦ</strong> <strong><mark>κατ’ ἀξίαν τῶν πραττομένων</mark></strong> ἀπαντήσεσθαι, διὰ τοῦ προφητικοῦ πνεύματος προλέγει</p><p>&lt;…&gt;</p><p>τοῦ γὰρ αἰωνίου καὶ καθαροῦ βίου ἐπιθυμοῦντες τῆς μετὰ θεοῦ τοῦ πάντων πατρὸς καὶ δημιουργοῦ διαγωγῆς ἀντιποιούμεθα, καὶ σπεύδομεν ἐπὶ τὸ ὁμολογεῖν, οἱ πεπεισμένοι καὶ πιστεύοντες <strong>τυχεῖν τούτων δύνασθαι τοὺς</strong> τὸν θεὸν <strong><mark>δι’ ἔργων</mark></strong> <strong>πείσαντας, ὅτι αὐτῷ εἵποντο καὶ τῆς παρ’ αὐτῷ διαγωγῆς ἤρων</strong>, ἔνθα κακία οὐκ ἀντιτυπεῖ</p><p>&lt;…&gt;</p><p><strong>ἐὰν</strong> ἀξίους τῷ ἐκείνου βουλεύματι ἑαυτοὺς <strong><mark>δι’ ἔργων</mark></strong> δείξωσι, <strong>τῆς μετ’ αὐτοῦ ἀναστροφῆς καταξιωθῆναι προσειλήφαμεν συμβασιλεύοντας</strong>, ἀφθάρτους καὶ ἀπαθεῖς γενομένους. ὃν τρόπον γὰρ τὴν ἀρχὴν οὐκ ὄντας ἐποίησε, τὸν αὐτὸν ἡγούμεθα τρόπον διὰ τὸ ἑλέσθαι τοὺς αἱρουμένους τὰ αὐτῷ ἀρεστὰ καὶ ἀφθαρσίας καὶ συνουσίας καταξιωθῆναι</p><p>&lt;…&gt;</p><p>Ἀρωγοὶ δ’ ὑμῖν καὶ σύμμαχοι πρὸς εἰρήνην ἐσμὲν πάντων μᾶλλον ἀνθρώπων, οἳ ταῦτα δοξάζομεν, ὡς λαθεῖν θεὸν κακόεργον ἢ πλεονέκτην ἢ ἐπίβουλον ἢ ἐνάρετον ἀδύνατον εἶναι, καὶ <strong>ἕκαστον</strong> <strong>ἐπ’ αἰωνίαν κόλασιν ἢ σωτηρίαν</strong> <strong><mark>κατ’ ἀξίαν τῶν πράξεων</mark></strong> πορεύεσθαι</p><p>εἰ γὰρ οἱ πάντες ἄνθρωποι ταῦτα ἐγίνωσκον, οὐκ ἄν τις τὴν κακίαν πρὸς ὀλίγον ᾑρεῖτο, γινώσκων πορεύεσθαι ἐπ’ αἰωνίαν διὰ πυρὸς καταδίκην, ἀλλ’ ἐκ παντὸς τρόπου <strong><mark>ἑαυτὸν συνεῖχε</mark></strong> <strong>καὶ</strong> <strong><mark>ἐκόσμει ἀρετῇ</mark></strong><strong>,</strong> <strong><mark>ὅπως τῶν παρὰ τοῦ θεοῦ τύχῃ</mark></strong> <strong>ἀγαθῶν καὶ τῶν κολαστηρίων ἀπηλλαγμένος εἴη</strong></p><p>&lt;…&gt;</p><p><strong>οἳ δ’ ἂν μὴ εὑρίσκωνται βιοῦντες, ὡς ἐδίδαξε, γνωριζέσθωσαν μὴ ὄντες Χριστιανοί, κἂν λέγωσιν διὰ γλώττης τὰ τοῦ Χριστοῦ διδάγματα</strong>· <strong><mark>οὐ γὰρ τοὺς μόνον λέγοντας, ἀλλὰ τοὺς καὶ τὰ ἔργα πράττοντας σωθήσεσθαι</mark></strong> ἔφη. εἶπε γὰρ οὕτως· <strong>Οὐχὶ πᾶς ὁ λέγων μοι Κύριε κύριε</strong> εἰσελεύσεται εἰς τὴν βασιλείαν τῶν οὐρανῶν, ἀλλ’ ὁ ποιῶν τὸ θέλημα τοῦ πατρός μου τοῦ ἐν τοῖς οὐρανοῖς. ὃς γὰρ ἀκούει μου καὶ ποιεῖ ἃ λέγω ἀκούει τοῦ ἀποστείλαντός με. <strong>πολλοὶ δὲ ἐροῦσί μοι· Κύριε κύριε</strong>, οὐ τῷ σῷ ὀνόματι ἐφάγομεν καὶ ἐπίομεν καὶ δυνάμεις ἐποιήσαμεν; καὶ τότε ἐρῶ αὐτοῖς· Ἀποχωρεῖτε ἀπ’ ἐμοῦ, ἐργάται τῆς ἀνομίας. τότε κλαυθμὸς ἔσται καὶ βρυγμὸς τῶν ὀδόντων, ὅταν οἱ μὲν δίκαιοι λάμψωσιν ὡς ὁ ἥλιος, οἱ δὲ ἄδικοι πέμπωνται εἰς τὸ αἰώνιον πῦρ. πολλοὶ γὰρ ἥξουσιν ἐπὶ τῷ ὀνόματί μου, ἔξωθεν μὲν ἐνδεδυμένοι δέρματα προβάτων, ἔσωθεν δὲ ὄντες λύκοι ἅρπαγες· <strong><mark>ἐκ τῶν ἔργων αὐτῶν ἐπιγνώσεσθε αὐτούς</mark></strong>. πᾶν δὲ δένδρον, μὴ ποιοῦν καρπὸν καλόν, ἐκκόπτεται καὶ εἰς πῦρ βάλλεται. <strong>κολάζεσθαι δὲ τοὺς οὐκ ἀκολούθως τοῖς διδάγμασιν αὐτοῦ βιοῦντας, λεγομένους δὲ μόνον Χριστιανούς</strong>, καὶ ὑφ’ ὑμῶν ἀξιοῦμεν</p><p>&lt;…&gt;</p><p>πιστεύοντες, μᾶλλον δὲ καὶ πεπεισμένοι, <strong><mark>κατ’ ἀξίαν τῶν πράξεων</mark></strong> <strong>ἕκαστον</strong> <strong>τίσειν διὰ πυρὸς αἰωνίου δίκας</strong>, καὶ πρὸς ἀναλογίαν ὧν ἔλαβε δυνάμεων παρὰ θεοῦ <strong><mark>τὸν λόγον ἀπαιτηθήσεσθαι</mark></strong>, ὡς ὁ Χριστὸς ἐμήνυσεν εἰπών· Ὧι πλέον ἔδωκεν ὁ θεός, πλέον καὶ ἀπαιτηθήσεται παρ’ αὐτοῦ</p><p>&lt;…&gt;</p><p>ἀπαθανατίζεσθαι δὲ ἡμεῖς μόνους δεδιδάγμεθα <strong><mark>τοὺς ὁσίως καὶ ἐναρέτως ἐγγὺς θεῷ βιοῦντας</mark></strong>, κολάζεσθαι δὲ τοὺς ἀδίκως καὶ μὴ μεταβάλλοντας ἐν αἰωνίῳ πυρὶ</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82_%E1%BC%88%CF%80%CE%BF%CE%BB%CE%BF%CE%B3%CE%AF%CE%B1_1#HH-8">Ἀπολογία 1</a>)</p><blockquote><p>καὶ πρὸς τούτοις ἑαυτοὺς καὶ ὑμᾶς βουκολοῦσιν, <strong>ὑπολαμβάνοντες ὅτι πάντως τοῖς ἀπὸ τῆς σπορᾶς τῆς κατὰ σάρκα τοῦ Ἀβραὰμ οὖσι, κἂν ἁμαρτωλοὶ ὦσι καὶ ἄπιστοι καὶ ἀπειθεῖς πρὸς τὸν θεόν, ἡ βασιλεία ἡ αἰώνιος δοθήσεται</strong>, ἅπερ ἀπέδειξαν αἱ γραφαὶ οὐκ ὄντα. ἦ γὰρ τοῦτο οὐκ ἂν εἶπεν Ἠσαίας· Καὶ εἰ μὴ κύριος Σαβαὼθ ἐγκατέλιπεν ἡμῖν σπέρμα, ὡς Σόδομα ἂν καὶ Γόμορρα ἐγενήθημεν· καὶ Ἰεζεκιήλ· ὅτι κἂν Νῶε καὶ Ἰακὼβ καὶ Δανιὴλ ἐξαιτήσωνται υἱοὺς ἢ θυγατέρας, οὐ μὴ δοθῇ αὐτοῖς· ἀλλ' οὔτε πατὴρ ὑπὲρ υἱοῦ οὔτε υἱὸς ὑπὲρ πατρός, ἀλλ' <strong><mark>ἕκαστος τῇ ἁμαρτίᾳ αὐτοῦ ἀπολεῖται καὶ ἕκαστος τῇ ἑαυτοῦ δικαιοπραξίᾳ σωθήσεται</mark></strong></p><p>&lt;…&gt;</p><p>βουλόμενος τοὺς ἀγγέλους καὶ τοὺς ἀνθρώπους ἕπεσθαι τῇ βουλῇ αὐτοῦ ὁ θεὸς ἐβουλήθη ποιῆσαι τούτους αὐτεξουσίους πρὸς δικαιοπραξίαν, μετὰ λόγου τοῦ ἐπίστασθαι αὐτοὺς ὑφ' οὗ γεγόνασι, καὶ δι' ὅν εἰσι πρότερον οὐκ ὄντες, καὶ <strong>μετὰ νόμου τοῦ</strong> <strong><mark>ὑπ' αὐτοῦ κρίνεσθαι</mark></strong>, <strong>ἐὰν</strong> <strong>παρὰ τὸν ὀρθὸν λόγον</strong> <strong><mark>πράττωσι</mark></strong></p><p>&lt;…&gt;</p><p><strong><mark>οὐκ ἐδέξασθε τὸν Χριστὸν αὐτοῦ. ὁ γὰρ τοῦτον ἀγνοῶν ἀγνοεῖ καὶ τὴν βουλὴν τοῦ θεοῦ</mark></strong>, καὶ ὁ τοῦτον ὑβρίζων καὶ μισῶν καὶ τὸν πέμψαντα δῆλον ὅτι καὶ μισεῖ καὶ ὑβρίζει· καὶ εἰ <strong><mark>οὐ πιστεύει τις εἰς αὐτόν, οὐ πιστεύει τοῖς τῶν προφητῶν κηρύγμασι</mark></strong> τοῖς αὐτὸν εὐαγγελισαμένοις καὶ κηρύξασιν εἰς πάντας</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%BF_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82-%CE%94%CE%B9%CE%AC%CE%BB%CE%BF%CE%B3%CE%BF_%CF%80%CF%81%CE%BF%CF%82_%CE%A4%CF%81%CF%8D%CF%86%CF%89%CE%BD%CE%B1#HH-140">Διάλογος πρὸς Τρύφωνα</a>)</p><h3>Όλοι οι άνθρωποι έχουν ροπή προς το κακό</h3><blockquote><p>ὅπερ γὰρ οὐκ ἠδυνήθησαν οἱ ἀνθρώπειοι νόμοι πρᾶξαι, ταῦτα ὁ λόγος θεῖος ὢν εἰργάσατο, εἰ μὴ οἱ φαῦλοι δαίμονες κατεσκέδασαν πολλὰ ψευδῆ καὶ ἄθεα κατηγορήματα, σύμμαχον λαβόντες <strong><mark>τὴν ἐν ἑκάστῳ κακὴν πρὸς πάντα καὶ ποικίλην φύσει ἐπιθυμίαν</mark></strong>, ὧν οὐδὲν πρόσεστιν ἡμῖν</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82_%E1%BC%88%CF%80%CE%BF%CE%BB%CE%BF%CE%B3%CE%AF%CE%B1_1#HH-10">Ἀπολογία 1</a>)</p><h3>Οι άνθρωποι μπορούν να διακρίνουν το καλό από το κακό</h3><blockquote><p>διὰ τὸ ἐν τῇ φύσει τῇ τῶν ἀνθρώπων εἶναι <strong>τὸ γνωριστικὸν καλοῦ καὶ αἰσχροῦ</strong></p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82_%E1%BC%88%CF%80%CE%BF%CE%BB%CE%BF%CE%B3%CE%AF%CE%B1_2#HH-14">Ἀπολογία 2</a>)</p><h3>Η ανάγκη της μετάνοιας για τις αμαρτίες</h3><blockquote><p>ὃς μετανοήσας ἐπὶ τοῖς ἁμαρτήμασι τῶν ἁμαρτημάτων παρὰ τοῦ θεοῦ λάβῃ ἄφεσιν, <strong>ἀλλ' οὐχ, ὡς ὑμεῖς ἀπατᾶτε ἑαυτοὺς καὶ ἄλλοι τινὲς ὑμῖν ὅμοιοι κατὰ τοῦτο, οἳ</strong> <strong><mark>λέγουσιν ὅτι, κἂν ἁμαρτωλοὶ ὦσι, θεὸν δὲ γινώσκουσιν, οὐ μὴ λογίσηται αὐτοῖς κύριος ἁμαρτίαν</mark></strong>. μαρτύριον δὲ τούτου τὴν μίαν τοῦ Δαυεὶδ διὰ τὴν καύχησιν αὐτοῦ γενομένην παράπτωσιν ἔχομεν, <strong><mark>ἥτις τότε ἀφείθη, ὅτε οὕτως ἔκλαυσε καὶ ἐθρήνησεν</mark></strong> ὡς γέγραπται. εἰ δὲ τῷ τοιούτῳ <strong><mark>ἄφεσις πρὶν μετανοῆσαι οὐκ ἐδόθη, ἀλλ' ὅτε τοιαῦτα ἔκλαυσε καὶ ἔπραξεν ὁ μέγας οὗτος βασιλεὺς καὶ χριστὸς καὶ προφήτης</mark></strong>, πῶς οἱ ἀκάθαρτοι καὶ πάντα ἀπονενοημένοι, ἐὰν μὴ θρηνήσωσι καὶ κόψωνται καὶ μετανοήσωσιν, ἐλπίδα ἔχειν δύνανται ὅτι οὐ μὴ λογίσηται αὐτοῖς κύριος ἁμαρτίαν;</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%BF_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82-%CE%94%CE%B9%CE%AC%CE%BB%CE%BF%CE%B3%CE%BF_%CF%80%CF%81%CE%BF%CF%82_%CE%A4%CF%81%CF%8D%CF%86%CF%89%CE%BD%CE%B1#HH-141">Διάλογος πρὸς Τρύφωνα</a>)</p><h2>Τα μυστήρια</h2><h3>Το βάπτισμα (αναγέννηση) με νερό και πίστη</h3><blockquote><p>Χριστός, πρωτότοκος πάσης κτίσεως ὤν, καὶ ἀρχὴ πάλιν ἄλλου γένους γέγονε, <strong>τοῦ ἀναγεννηθέντος ὑπ' αὐτοῦ</strong> <strong><mark>δι' ὕδατος</mark></strong> <strong>καὶ πίστεως</strong> καὶ ξύλου, τοῦ <strong>τὸ μυστήριον τοῦ σταυροῦ</strong> ἔχοντος, ὃν τρόπον καὶ ὁ Νῶε ἐν ξύλῳ διεσώθη ἐποχούμενος τοῖς ὕδασι μετὰ τῶν ἰδίων</p><p>&lt;…&gt;</p><p>εἶπον δέ, <strong><mark>δι' ὕδατος</mark></strong> <strong>καὶ πίστεως</strong> καὶ ξύλου οἱ προπαρασκευαζόμενοι καὶ μετανοοῦντες ἐφ' οἷς ἥμαρτον ἐκφεύξονται τὴν μέλλουσαν ἐπέρχεσθαι τοῦ θεοῦ κρίσιν</p><p>&lt;…&gt;</p><p>σπουδάσαι δεῖ ἐπιγνῶναι, δι' ἧς ὁδοῦ ἄφεσις ὑμῖν τῶν ἁμαρτιῶν γενήσεται καὶ ἐλπὶς τῆς κληρονομίας τῶν κατηγγελμένων ἀγαθῶν· <strong><mark>ἔστι δ' οὐκ ἄλλη ἢ αὕτη, ἵνα τοῦτον τὸν Χριστὸν ἐπιγνόντες καὶ λουσάμενοι τὸ ὑπὲρ ἀφέσεως ἁμαρτιῶν</mark></strong> διὰ Ἠσαίου κηρυχθὲν λουτρὸν ἀναμαρτήτως λοιπὸν ζήσητε</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%BF_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82-%CE%94%CE%B9%CE%AC%CE%BB%CE%BF%CE%B3%CE%BF_%CF%80%CF%81%CE%BF%CF%82_%CE%A4%CF%81%CF%8D%CF%86%CF%89%CE%BD%CE%B1#HH-138">Διάλογος πρὸς Τρύφωνα</a>)</p><h4>Αναγεννιούνται με το νερό</h4><blockquote><p>ὅσοι ἂν πεισθῶσι καὶ πιστεύωσιν ἀληθῆ ταῦτα τὰ ὑφ’ ἡμῶν διδασκόμενα καὶ λεγόμενα εἶναι, καὶ βιοῦν οὕτως δύνασθαι ὑπισχνῶνται, εὔχεσθαί τε καὶ αἰτεῖν νηστεύοντες παρὰ τοῦ θεοῦ τῶν προημαρτημένων ἄφεσιν διδάσκονται, ἡμῶν συνευχομένων καὶ συννηστευόντων αὐτοῖς. ἔπειτα ἄγονται <strong>ὑφ’ ἡμῶν</strong> <strong><mark>ἔνθα ὕδωρ ἐστί</mark></strong><strong>, καὶ</strong> <strong><mark>τρόπον ἀναγεννήσεως, ὃν καὶ ἡμεῖς αὐτοὶ ἀνεγεννήθημεν, ἀναγεννῶνται</mark></strong>· ἐπ’ ὀνόματος <strong>γὰρ</strong> τοῦ πατρὸς τῶν ὅλων καὶ δεσπότου θεοῦ καὶ τοῦ σωτῆρος ἡμῶν Ἰησοῦ Χριστοῦ καὶ πνεύματος ἁγίου <strong><mark>τὸ ἐν τῷ ὕδατι τότε λουτρὸν ποιοῦνται</mark></strong>. καὶ γὰρ ὁ Χριστὸς εἶπεν· Ἂν μὴ ἀναγεννηθῆτε, οὐ μὴ εἰσέλθητε εἰς τὴν βασιλείαν τῶν οὐρανῶν</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82_%E1%BC%88%CF%80%CE%BF%CE%BB%CE%BF%CE%B3%CE%AF%CE%B1_1#HH-61">Ἀπολογία 1</a>)</p><h4>Το βάπτισμα ελευθερώνει από τις προηγούμενες αμαρτίες</h4><blockquote><p><em><strong>Ὃν τρόπον δὲ καὶ ἀνεθήκαμεν ἑαυτοὺς τῷ θεῷ</strong></em> <em>καινοποιηθέντες διὰ τοῦ Χριστοῦ, <em>ἐξηγησόμεθα</em>, ὅπως μὴ τοῦτο παραλιπόντες δόξωμεν πονηρεύειν τι ἐν τῇ ἐξηγήσει. ὅσοι ἂν πεισθῶσι καὶ πιστεύωσιν ἀληθῆ ταῦτα τὰ ὑφ’ ἡμῶν διδασκόμενα καὶ λεγόμενα εἶναι, καὶ βιοῦν οὕτως δύνασθαι ὑπισχνῶνται, <em><strong>εὔχεσθαί τε καὶ αἰτεῖν νηστεύοντες παρὰ τοῦ θεοῦ τῶν προημαρτημένων ἄφεσιν</strong></em> διδάσκονται, ἡμῶν συνευχομένων καὶ συννηστευόντων αὐτοῖς</em>. ἔπειτα ἄγονται ὑφ’ ἡμῶν ἔνθα ὕδωρ ἐστί, καὶ τρόπον ἀναγεννήσεως, ὃν καὶ ἡμεῖς αὐτοὶ ἀνεγεννήθημεν, ἀναγεννῶνται· <em><strong>ἐπ’ ὀνόματος γὰρ τοῦ πατρὸς τῶν ὅλων καὶ δεσπότου θεοῦ καὶ τοῦ σωτῆρος ἡμῶν Ἰησοῦ Χριστοῦ καὶ πνεύματος ἁγίου</strong></em> <em><strong><mark>τὸ ἐν τῷ ὕδατι τότε λουτρὸν ποιοῦνται</mark></strong></em>. <em>καὶ γὰρ ὁ Χριστὸς εἶπεν· Ἂν μὴ ἀναγεννηθῆτε, οὐ μὴ εἰσέλθητε εἰς τὴν βασιλείαν τῶν οὐρανῶν. ὅτι δὲ καὶ ἀδύνατον εἰς τὰς μήτρας τῶν τεκουσῶν τοὺς ἅπαξ γενομένους ἐμβῆναι, φανερὸν πᾶσίν ἐστι. καὶ διὰ Ἠσαίου τοῦ προφήτου, ὡς προεγράψαμεν, εἴρηται</em>, <em><strong><mark>τίνα τρόπον φεύξονται τὰς ἁμαρτίας οἱ ἁμαρτήσαντες καὶ μετανοοῦντες</mark></strong></em>. <em>ἐλέχθη δὲ οὕτως</em>· <em><strong><mark>Λούσασθε</mark></strong></em>, <em>καθαροὶ γένεσθε, ἀφέλετε τὰς πονηρίας ἀπὸ τῶν ψυχῶν ὑμῶν, μάθετε καλὸν ποιεῖν, κρίνατε ὀρφανῷ καὶ δικαιώσατε χήραν, καὶ δεῦτε καὶ διαλεχθῶμεν, λέγει κύριος· καὶ ἐὰν ὦσιν αἱ ἁμαρτίαι ὑμῶν ὡς φοινικοῦν, ὡσεὶ ἔριον λευκανῶ, καὶ ἐὰν ὦσιν ὡς κόκκινον, ὡς χιόνα λευκανῶ. ἐὰν δὲ μὴ εἰσακούσητέ μου, μάχαιρα ὑμᾶς κατέδεται· τὸ γὰρ στόμα κυρίου ἐλάλησε ταῦτα</em>. <em><strong>καὶ λόγον δὲ εἰς τοῦτο παρὰ τῶν ἀποστόλων ἐμάθομεν τοῦτον</strong></em>. <em>ἐπειδὴ τὴν πρώτην γένεσιν ἡμῶν ἀγνοοῦντες κατ’ ἀνάγκην γεγεννήμεθα ἐξ ὑγρᾶς σπορᾶς κατὰ μῖξιν τὴν τῶν γονέων πρὸς ἀλλήλους καὶ ἐν ἔθεσι φαύλοις καὶ πονηραῖς ἀνατροφαῖς γεγόναμεν, ὅπως μὴ ἀνάγκης τέκνα μηδὲ ἀγνοίας μένωμεν ἀλλὰ προαιρέσεως καὶ ἐπιστήμης</em>, <em><strong><mark>ἀφέσεώς τε ἁμαρτιῶν ὑπὲρ ὧν προημάρτομεν τύχωμεν, ἐν τῷ ὕδατι ἐπονομάζεται τῷ ἑλομένῳ ἀναγεννηθῆναι καὶ μετανοήσαντι ἐπὶ τοῖς ἡμαρτημένοις τὸ τοῦ πατρὸς τῶν ὅλων καὶ δεσπότου θεοῦ ὄνομα</mark></strong></em>, <em>αὐτὸ τοῦτο μόνον ἐπιλέγοντος τοῦ τὸν λουσόμενον ἄγοντος ἐπὶ τὸ λουτρόν. ὄνομα γὰρ τῷ ἀρρήτῳ θεῷ οὐδεὶς ἔχει εἰπεῖν· εἰ δέ τις τολμήσειεν εἶναι λέγειν, μέμηνε τὴν ἄσωτον μανίαν</em>. <em><strong><mark>καλεῖται δὲ τοῦτο τὸ λουτρὸν φωτισμός</mark></strong></em><em>, ὡς</em> <em><strong><mark>φωτιζομένων τὴν διάνοιαν τῶν ταῦτα μανθανόντων</mark></strong></em>. <em>καὶ ἐπ’ ὀνόματος δὲ Ἰησοῦ Χριστοῦ, τοῦ σταυρωθέντος ἐπὶ Ποντίου Πιλάτου, καὶ ἐπ’ ὀνόματος πνεύματος ἁγίου, ὃ διὰ τῶν προφητῶν προεκήρυξε τὰ κατὰ τὸν Ἰησοῦν πάντα, ὁ φωτιζόμενος λούεται</em></p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82_%E1%BC%88%CF%80%CE%BF%CE%BB%CE%BF%CE%B3%CE%AF%CE%B1_1">Ἀπολογία 1, κεφ. 61</a>)</p><h3>Η Ευχαριστία: το αληθινό σώμα και αίμα του Ιησού Χριστού</h3><blockquote><p><em><strong><mark>οὐ γὰρ ὡς κοινὸν ἄρτον οὐδὲ κοινὸν πόμα</mark></strong></em> <em><strong>ταῦτα λαμβάνομεν</strong></em>· <em>ἀλλ’ ὃν τρόπον διὰ λόγου θεοῦ σαρκοποιηθεὶς Ἰησοῦς Χριστὸς ὁ σωτὴρ ἡμῶν</em> <em><strong>καὶ σάρκα καὶ αἷμα ὑπὲρ σωτηρίας ἡμῶν ἔσχεν</strong></em>, <em>οὕτως καὶ</em> <em><strong>τὴν δι’ εὐχῆς λόγου τοῦ παρ’ αὐτοῦ εὐχαριστηθεῖσαν</strong></em> <em><strong><mark>τροφήν</mark></strong></em>, <em>ἐξ ἧς αἷμα καὶ σάρκες κατὰ μεταβολὴν τρέφονται ἡμῶν</em>, <em><strong><mark>ἐκείνου τοῦ σαρκοποιηθέντος Ἰησοῦ καὶ σάρκα καὶ αἷμα ἐδιδάχθημεν εἶναι</mark></strong></em></p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82_%E1%BC%88%CF%80%CE%BF%CE%BB%CE%BF%CE%B3%CE%AF%CE%B1_1">Ἀπολογία 1, 65-67</a>)</p><blockquote><p><strong>Τὸ μυστήριον οὖν τοῦ προβάτου, ὃ τὸ πάσχα θύειν ἐντέταλται ὁ θεός, τύπος ἦν</strong> <strong><mark>τοῦ Χριστοῦ, οὗ τῷ αἵματι</mark></strong> <strong>κατὰ τὸν λόγον τῆς εἰς αὐτὸν πίστεως</strong> <strong><mark>χρίονται τοὺς οἴκους ἑαυτῶν, τοῦτ' ἔστιν ἑαυτούς</mark></strong></p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%BF_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82-%CE%94%CE%B9%CE%AC%CE%BB%CE%BF%CE%B3%CE%BF_%CF%80%CF%81%CE%BF%CF%82_%CE%A4%CF%81%CF%8D%CF%86%CF%89%CE%BD%CE%B1#HH-40">Διάλογος πρὸς Τρύφωνα</a>)</p><h3>Η αναίμακτη θυσία προς τον Θεό στην Ευχαριστία</h3><blockquote><p>Πάσας οὖν διὰ τοῦ ὀνόματος τούτου <strong><mark>θυσίας</mark></strong>, <strong><mark>ἃς παρέδωκεν Ἰησοῦς ὁ Χριστὸς γίνεσθαι</mark></strong>, τοῦτ' ἔστιν <strong><mark>ἐπὶ τῇ εὐχαριστίᾳ τοῦ ἄρτου καὶ τοῦ ποτηρίου, τὰς ἐν παντὶ τόπῳ τῆς γῆς γινομένας ὑπὸ τῶν Χριστιανῶν</mark></strong>, προλαβὼν ὁ θεὸς μαρτυρεῖ εὐαρέστους ὑπάρχειν αὐτῷ· τὰς δὲ ὑφ' ὑμῶν καὶ δι' ἐκείνων ὑμῶν τῶν ἱερέων γινομένας ἀπαναίνεται</p><p>&lt;…&gt;</p><p>ὅτι μὲν οὖν καὶ εὐχαὶ καὶ εὐχαριστίαι, ὑπὸ τῶν ἀξίων γινόμεναι, τέλειαι μόναι καὶ εὐάρεστοί εἰσι τῷ θεῷ θυσίαι, καὶ αὐτός φημι. <mark><strong>ταῦτα γὰρ μόνα καὶ Χριστιανοὶ παρέλαβον ποιεῖν, καὶ ἐπ' ἀναμνήσει δὲ τῆς τροφῆς αὐτῶν <strong>ξηρᾶς τε καὶ ὑγρᾶς</strong></strong></mark></p><p>&lt;…&gt;</p><p>εὐδόκησε γὰρ καὶ εἰς τὰ ἔθνη, καὶ <strong><mark>τὰς θυσίας ἥδιον παρ' ἡμῶν ἢ παρ' ὑμῶν λαμβάνει</mark></strong></p><p>&lt;…&gt;</p><p>Καὶ ἡ τῆς σεμιδάλεως δὲ προσφορά, ὦ ἄνδρες, ἔλεγον, ἡ ὑπὲρ τῶν καθαριζομένων ἀπὸ τῆς λέπρας προσφέρεσθαι παραδοθεῖσα, <strong>τύπος ἦν τοῦ ἄρτου τῆς εὐχαριστίας</strong>, ὃν εἰς ἀνάμνησιν τοῦ πάθους, οὗ ἔπαθεν ὑπὲρ τῶν καθαιρομένων τὰς ψυχὰς ἀπὸ πάσης πονηρίας ἀνθρώπων, <strong>Ἰησοῦς Χριστὸς ὁ κύριος ἡμῶν</strong> <strong><mark>παρέδωκε ποιεῖν</mark></strong>, <strong>ἵνα ἅμα τε εὐχαριστῶμεν τῷ θεῷ</strong> ὑπέρ τε τοῦ τὸν κόσμον ἐκτικέναι σὺν πᾶσι τοῖς ἐν αὐτῷ διὰ τὸν ἄνθρωπον, καὶ ὑπὲρ τοῦ ἀπὸ τῆς κακίας, ἐν ᾗ γεγόναμεν, ἠλευθερωκέναι ἡμᾶς, καὶ τὰς ἀρχὰς καὶ τὰς ἐξουσίας καταλελυκέναι τελείαν κατάλυσιν διὰ τοῦ παθητοῦ γενομένου κατὰ τὴν βουλὴν αὐτοῦ</p><p>&lt;…&gt;</p><p><strong><mark>περὶ δὲ τῶν ἐν παντὶ τόπῳ ὑφ' ἡμῶν</mark></strong> τῶν ἐθνῶν <strong><mark>προσφερομένων</mark></strong> <strong>αὐτῷ θυσιῶν, τοῦτ' ἔστι</strong> <strong><mark>τοῦ ἄρτου τῆς εὐχαριστίας</mark></strong> καὶ τοῦ ποτηρίου ὁμοίως τῆς εὐχαριστίας, προλέγει τότε, εἰπὼν καὶ τὸ ὄνομα αὐτοῦ δοξάζειν ἡμᾶς, ὑμᾶς δὲ βεβηλοῦν</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%BF_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82-%CE%94%CE%B9%CE%AC%CE%BB%CE%BF%CE%B3%CE%BF_%CF%80%CF%81%CE%BF%CF%82_%CE%A4%CF%81%CF%8D%CF%86%CF%89%CE%BD%CE%B1#HH-117">Διάλογος πρὸς Τρύφωνα</a>)</p><blockquote><p>ἀνενδεῆ αἱμάτων καὶ σπονδῶν καὶ θυμιαμάτων, ὡς ἐδιδάχθημεν, λέγοντες, <strong>λόγῳ εὐχῆς</strong> καὶ <strong>εὐχαριστίας ἐφ’ οἷς προσφερόμεθα πᾶσιν</strong>, ὅση δύναμις, <strong>αἰνοῦντες</strong></p><p>&lt;…&gt;</p><p><strong><mark>μόνην ἀξίαν αὐτοῦ τιμὴν ταύτην παραλαβόντες</mark></strong>, <strong><mark>τὸ τὰ ὑπ’ ἐκείνου εἰς διατροφὴν γενόμενα</mark></strong> <strong>οὐ πυρὶ δαπανᾶν, ἀλλ’</strong> <strong><mark>ἑαυτοῖς καὶ τοῖς δεομένοις προσφέρειν</mark></strong>, ἐκείνῳ δὲ εὐχαρίστους ὄντας διὰ λόγου πομπὰς καὶ ὕμνους πέμπειν ὑπέρ τε τοῦ γεγονέναι καὶ τῶν εἰς εὐρωστίαν πόρων πάντων, ποιοτήτων μὲν γενῶν καὶ μεταβολῶν ὡρῶν, καὶ τοῦ πάλιν ἐν ἀφθαρσίᾳ γενέσθαι διὰ πίστιν τὴν ἐν αὐτῷ αἰτήσεις πέμποντες</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82_%E1%BC%88%CF%80%CE%BF%CE%BB%CE%BF%CE%B3%CE%AF%CE%B1_1#HH-13">Ἀπολογία 1</a>)</p><h3>Ρήσεις περί της Ευχαριστίας</h3><blockquote><p>τίς ἀναγγελεῖ ὑμῖν τὸν τόπον τὸν αἰώνιον; πορευόμενος ἐν δικαιοσύνῃ, λαλῶν εὐθεῖαν ὁδόν, μισῶν ἀνομίαν καὶ ἀδικίαν, καὶ τὰς χεῖρας ἀφωσιωμένος ἀπὸ δώρων, βαρύνων ὦτα ἵνα μὴ ἀκούσῃ κρίσιν ἄδικον αἵματος, καμμύων τοὺς ὀφθαλμοὺς ἵνα μὴ ἴδῃ ἀδικίαν· οὗτος οἰκήσει ἐν ὑψηλῷ σπηλαίῳ πέτρας ἰσχυρᾶς. <strong>ἄρτος δοθήσεται</strong> αὐτῷ, καὶ τὸ ὕδωρ αὐτοῦ πιστόν. βασιλέα μετὰ δόξης ὄψεσθε, καὶ οἱ ὀφθαλμοὶ ὑμῶν ὄψονται πόρρωθεν</p><p>...</p><p>ὅτι μὲν οὖν καὶ <strong>ἐν ταύτῃ τῇ προφητείᾳ περὶ τοῦ ἄρτου, ὃν παρέδωκεν ἡμῖν ὁ ἡμέτερος Χριστὸς ποιεῖν εἰς ἀνάμνησιν τοῦ τε σωματοποιήσασθαι αὐτὸν διὰ τοὺς πιστεύοντας εἰς αὐτόν, δι' οὓς καὶ παθητὸς γέγονε, καὶ περὶ τοῦ ποτηρίου, ὃ εἰς ἀνάμνησιν τοῦ αἵματος αὐτοῦ παρέδωκεν εὐχαριστοῦντας ποιεῖν, φαίνεται</strong></p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%BF_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82-%CE%94%CE%B9%CE%AC%CE%BB%CE%BF%CE%B3%CE%BF_%CF%80%CF%81%CE%BF%CF%82_%CE%A4%CF%81%CF%8D%CF%86%CF%89%CE%BD%CE%B1#HH-70">Διάλογος πρὸς Τρύφωνα</a>)</p><h4>Περιγραφή της τέλεσης της Ευχαριστίας</h4><blockquote><p>Ἡμεῖς δὲ μετὰ τὸ οὕτως λοῦσαι τὸν πεπεισμένον καὶ συγκατατεθειμένον ἐπὶ τοὺς λεγομένους ἀδελφοὺς ἄγομεν, ἔνθα συνηγμένοι εἰσί, κοινὰς εὐχὰς ποιησόμενοι ὑπέρ τε ἑαυτῶν καὶ τοῦ φωτισθέντος καὶ ἄλλων πανταχοῦ πάντων εὐτόνως, ὅπως καταξιωθῶμεν τὰ ἀληθῆ μαθόντες καὶ δι’ ἔργων ἀγαθοὶ πολιτευταὶ καὶ φύλακες τῶν ἐντεταλμένων εὑρεθῆναι, ὅπως τὴν αἰώνιον σωτηρίαν σωθῶμεν. ἀλλήλους φιλήματι ἀσπαζόμεθα παυσάμενοι τῶν εὐχῶν. ἔπειτα προσφέρεται τῷ προεστῶτι τῶν ἀδελφῶν ἄρτος καὶ ποτήριον ὕδατος καὶ κράματος, καὶ οὗτος λαβὼν αἶνον καὶ δόξαν τῷ πατρὶ τῶν ὅλων διὰ τοῦ ὀνόματος τοῦ υἱοῦ καὶ τοῦ πνεύματος τοῦ ἁγίου ἀναπέμπει καὶ εὐχαριστίαν ὑπὲρ τοῦ κατηξιῶσθαι τούτων παρ’ αὐτοῦ ἐπὶ πολὺ ποιεῖται· οὗ συντελέσαντος τὰς εὐχὰς καὶ τὴν εὐχαριστίαν πᾶς ὁ παρὼν λαὸς ἐπευφημεῖ λέγων· Ἀμήν. τὸ δὲ Ἀμὴν τῇ Ἑβραΐδι φωνῇ τὸ Γένοιτο σημαίνει. εὐχαριστήσαντος δὲ τοῦ προεστῶτος καὶ ἐπευφημήσαντος παντὸς τοῦ λαοῦ οἱ καλούμενοι παρ’ ἡμῖν διάκονοι διδόασιν ἑκάστῳ τῶν παρόντων μεταλαβεῖν ἀπὸ τοῦ εὐχαριστηθέντος ἄρτου καὶ οἴνου καὶ ὕδατος καὶ τοῖς οὐ παροῦσιν ἀποφέρουσι</p><p>Καὶ ἡ τροφὴ αὕτη καλεῖται παρ’ ἡμῖν εὐχαριστία, ἧς οὐδενὶ ἄλλῳ μετασχεῖν ἐξόν ἐστιν ἢ τῷ πιστεύοντι ἀληθῆ εἶναι τὰ δεδιδαγμένα ὑφ’ ἡμῶν, καὶ λουσαμένῳ τὸ ὑπὲρ ἀφέσεως ἁμαρτιῶν καὶ εἰς ἀναγέννησιν λουτρόν, καὶ οὕτως βιοῦντι ὡς ὁ Χριστὸς παρέδωκεν. οὐ γὰρ ὡς κοινὸν ἄρτον οὐδὲ κοινὸν πόμα ταῦτα λαμβάνομεν· ἀλλ’ ὃν τρόπον διὰ λόγου θεοῦ σαρκοποιηθεὶς Ἰησοῦς Χριστὸς ὁ σωτὴρ ἡμῶν καὶ σάρκα καὶ αἷμα ὑπὲρ σωτηρίας ἡμῶν ἔσχεν, οὕτως καὶ τὴν δι’ εὐχῆς λόγου τοῦ παρ’ αὐτοῦ εὐχαριστηθεῖσαν τροφήν, ἐξ ἧς αἷμα καὶ σάρκες κατὰ μεταβολὴν τρέφονται ἡμῶν, ἐκείνου τοῦ σαρκοποιηθέντος Ἰησοῦ καὶ σάρκα καὶ αἷμα ἐδιδάχθημεν εἶναι</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82_%E1%BC%88%CF%80%CE%BF%CE%BB%CE%BF%CE%B3%CE%AF%CE%B1_1#HH-65">Ἀπολογία 1</a>)</p><h3>Οι τελετές της λατρείας</h3><blockquote><p><strong>μόνην ἀξίαν αὐτοῦ τιμὴν ταύτην παραλαβόντες, τὸ τὰ ὑπ’ ἐκείνου εἰς διατροφὴν γενόμενα οὐ πυρὶ δαπανᾶν, ἀλλ’ ἑαυτοῖς καὶ τοῖς δεομένοις προσφέρειν</strong>, ἐκείνῳ δὲ εὐχαρίστους ὄντας <strong>διὰ λόγου</strong> <mark><strong>πομπὰς</strong></mark> <strong>καὶ</strong> <mark><strong>ὕμνους</strong></mark> πέμπειν <strong>ὑπέρ τε τοῦ γεγονέναι καὶ τῶν εἰς εὐρωστίαν πόρων πάντων, ποιοτήτων μὲν γενῶν καὶ μεταβολῶν ὡρῶν</strong>, καὶ <strong>τοῦ πάλιν ἐν ἀφθαρσίᾳ γενέσθαι διὰ πίστιν τὴν ἐν αὐτῷ</strong> <mark><strong>αἰτήσεις πέμποντες</strong></mark></p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82_%E1%BC%88%CF%80%CE%BF%CE%BB%CE%BF%CE%B3%CE%AF%CE%B1_1#HH-13">Ἀπολογία 1</a>)</p><h2>Η τιμή των αγίων και των ιερών</h2><h3>Η τιμή των αγγέλων</h3><blockquote><p>ἀλλ’ <strong><mark>ἐκεῖνόν</mark></strong> τε καὶ <strong><mark>τὸν παρ’ αὐτοῦ υἱὸν ἐλθόντα</mark></strong> καὶ διδάξαντα ἡμᾶς ταῦτα, καὶ <strong><mark>τὸν τῶν ἄλλων ἑπομένων καὶ ἐξομοιουμένων ἀγαθῶν ἀγγέλων στρατόν</mark></strong>, <strong><mark>πνεῦμά τε τὸ προφητικὸν</mark></strong> <strong><mark>σεβόμεθα καὶ προσκυνοῦμεν</mark></strong>, <strong>λόγῳ καὶ ἀληθείᾳ τιμῶντες</strong>, καὶ παντὶ βουλομένῳ μαθεῖν, ὡς ἐδιδάχθημεν, ἀφθόνως παραδιδόντες</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82_%E1%BC%88%CF%80%CE%BF%CE%BB%CE%BF%CE%B3%CE%AF%CE%B1_1#HH-6">Ἀπολογία 1</a>)</p><h3>Η τιμή του σταυρού</h3><blockquote><p><strong><mark>ὅπερ, ὡς προεῖπεν ὁ προφήτης, τὸ μέγιστον σύμβολον τῆς ἰσχύος καὶ ἀρχῆς αὐτοῦ ὑπάρχει</mark></strong>, ὡς καὶ ἐκ τῶν ὑπ’ ὄψιν πιπτόντων δείκνυται· κατανοήσατε γὰρ πάντα τὰ ἐν τῷ κόσμῳ, εἰ ἄνευ τοῦ σχήματος τούτου διοικεῖται ἢ κοινωνίαν ἔχειν δύναται. θάλασσα μὲν γὰρ οὐ τέμνεται, ἢν μὴ τοῦτο τὸ τρόπαιον, ὃ καλεῖται ἱστίον, ἐν τῇ νηῒ σῶον μείνῃ· γῆ δὲ οὐκ ἀροῦται ἄνευ αὐτοῦ· σκαπανεῖς δὲ τὴν ἐργασίαν οὐ ποιοῦνται οὐδὲ βαναυσουργοὶ ὁμοίως εἰ μὴ διὰ τῶν τὸ σχῆμα τοῦτο ἐχόντων ἐργαλείων. τὸ δὲ ἀνθρώπειον σχῆμα οὐδενὶ ἄλλῳ τῶν ἀλόγων ζώων διαφέρει, ἢ τῷ ὀρθόν τε εἶναι καὶ ἔκτασιν χειρῶν ἔχειν καὶ ἐν τῷ προσώπῳ ἀπὸ τοῦ μετωπίου τεταμένον τὸν λεγόμενον μυξωτῆρα φέρειν, δι’ οὗ ἥ τε ἀναπνοή ἐστι τῷ ζώῳ, καὶ οὐδὲν ἄλλο δείκνυσιν ἢ τὸ σχῆμα τοῦ σταυροῦ. καὶ διὰ τοῦ προφήτου δὲ ἐλέχθη οὕτως· Πνεῦμα πρὸ προσώπου ἡμῶν χριστὸς κύριος. καὶ τὰ παρ’ ὑμῖν δὲ σύμβολα τὴν τοῦ σχήματος τούτου δύναμιν δηλοῖ, [ἵνα ἀμε]λῶμεν <strong>καὶ τῶν τροπαίων, δι’ ὧν</strong> <strong><mark>αἵ τε πρόοδοι</mark></strong> ὑμῶν πανταχοῦ γίνονται, τῆς ἀρχῆς καὶ δυνάμεως τὰ σημεῖα ἐν τούτοις δεικνύντες, <strong>εἰ καὶ μὴ νοοῦντες τοῦτο πράττετε</strong></p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82_%E1%BC%88%CF%80%CE%BF%CE%BB%CE%BF%CE%B3%CE%AF%CE%B1_1#HH-55">Ἀπολογία 1</a>)</p><blockquote><p>τὸ γὰρ ὀπτώμενον πρόβατον σχηματιζόμενον ὁμοίως τῷ σχήματι τοῦ σταυροῦ ὀπτᾶται· εἷς γὰρ ὄρθιος ὀβελίσκος διαπερονᾶται ἀπὸ τῶν κατωτάτω μερῶν μέχρι τῆς κεφαλῆς, καὶ εἷς πάλιν κατὰ τὸ μετάφρενον, ᾧ προσαρτῶνται καὶ αἱ χεῖρες τοῦ προβάτου</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%BF_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82-%CE%94%CE%B9%CE%AC%CE%BB%CE%BF%CE%B3%CE%BF_%CF%80%CF%81%CE%BF%CF%82_%CE%A4%CF%81%CF%8D%CF%86%CF%89%CE%BD%CE%B1#HH-40">Διάλογος πρὸς Τρύφωνα</a>)</p><h2>Η μετά θάνατον κατάσταση</h2><h3>Η ύπαρξη των ψυχών μετά θάνατον</h3><blockquote><p>τὸ δὲ εἰρημένον ἐκ βάτου τῷ Μωυσεῖ· <strong>Ἐγώ εἰμι ὁ ὤν, ὁ θεὸς Ἀβραὰμ καὶ ὁ θεὸς Ἰσαὰκ καὶ ὁ θεὸς Ἰακὼβ καὶ ὁ θεὸς τῶν πατέρων σου, σημαντικὸν τοῦ</strong> <strong><mark>καὶ ἀποθανόντας ἐκείνους μένειν καὶ εἶναι αὐτοῦ τοῦ Χριστοῦ ἀνθρώπους</mark></strong></p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82_%E1%BC%88%CF%80%CE%BF%CE%BB%CE%BF%CE%B3%CE%AF%CE%B1_1#HH-63">Ἀπολογία 1</a>)</p><p>Ο γέροντας (που οδήγησε τον Ιουστίνο στον χριστιανισμό):</p><blockquote><p>ἡ ψυχὴ ἤτοι ζωή ἐστιν ἢ ζωὴν ἔχει. εἰ μὲν οὖν ζωή ἐστιν, ἄλλο τι ἂν ποιήσειε ζῆν, οὐχ ἑαυτήν, ὡς καὶ κίνησις ἄλλο τι κινήσειε μᾶλλον ἢ ἑαυτήν. <strong><mark>ὅτι δὲ ζῇ ψυχή, οὐδεὶς ἀντείποι</mark></strong>. εἰ δὲ ζῇ, οὐ ζωὴ οὖσα ζῇ, ἀλλὰ μεταλαμβάνουσα τῆς ζωῆς· ἕτερον δέ τι τὸ μετέχον τινὸς ἐκείνου οὗ μετέχει. <strong>ζωῆς δὲ ψυχὴ μετέχει, ἐπεὶ ζῆν αὐτὴν ὁ θεὸς βούλεται. οὕτως ἄρα καὶ οὐ μεθέξει ποτέ, ὅταν αὐτὴν μὴ θέλοι ζῆν</strong>. οὐ γὰρ ἴδιον αὐτῆς ἐστι τὸ ζῆν ὡς τοῦ θεοῦ· ἀλλὰ ὥσπερ ἄνθρωπος οὐ διὰ παντός ἐστιν οὐδὲ <strong><mark>σύνεστιν ἀεὶ τῇ ψυχῇ τὸ σῶμα, ἀλλ', ὅταν δέῃ λυθῆναι τὴν ἁρμονίαν ταύτην, καταλείπει ἡ ψυχὴ τὸ σῶμα</mark></strong> καὶ ὁ ἄνθρωπος οὐκ ἔστιν, <strong>οὕτως καί, ὅταν δέῃ τὴν ψυχὴν μηκέτι εἶναι, ἀπέστη ἀπ' αὐτῆς τὸ ζωτικὸν πνεῦμα καὶ οὐκ ἔστιν ἡ ψυχὴ ἔτι, ἀλλὰ καὶ αὐτὴ ὅθεν ἐλήφθη ἐκεῖσε χωρεῖ πάλιν</strong></p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%BF_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82-%CE%94%CE%B9%CE%AC%CE%BB%CE%BF%CE%B3%CE%BF_%CF%80%CF%81%CE%BF%CF%82_%CE%A4%CF%81%CF%8D%CF%86%CF%89%CE%BD%CE%B1#HH-6">Διάλογος πρὸς Τρύφωνα</a>)</p><p>Ο Ιουστίνος:</p><blockquote><p>καὶ τὸ ἀπὸ ῥομφαίας καὶ στόματος λέοντος καὶ ἐκ χειρὸς κυνὸς αἰτεῖν αὐτὸν τὴν ψυχὴν σωθῆναι, <strong>ἵνα μηδεὶς κυριεύσῃ τῆς ψυχῆς αὐτοῦ αἴτησις ἦν</strong>, ἵνα, ἡνίκα <strong><mark>ἡμεῖς πρὸς τῇ ἐξόδῳ τοῦ βίου γινόμεθα</mark></strong>, <strong>τὰ αὐτὰ αἰτῶμεν τὸν θεόν</strong>, τὸν δυνάμενον <strong><mark>ἀποστρέψαι</mark></strong> <strong>πάντα ἀναιδῆ</strong> <strong><mark>πονηρὸν ἄγγελον μὴ λαβέσθαι ἡμῶν τῆς ψυχῆς</mark></strong>. καὶ ὅτι <strong><mark>μένουσιν αἱ ψυχαὶ ἀπέδειξα</mark></strong> <strong>ὑμῖν ἐκ τοῦ καὶ τὴν Σαμουὴλ ψυχὴν κληθῆναι ὑπὸ τῆς ἐγγαστριμύθου, ὡς ἠξίωσεν ὁ Σαούλ</strong>. φαίνεται δὲ καὶ ὅτι πᾶσαι αἱ ψυχαὶ τῶν οὕτως δικαίων καὶ προφητῶν ὑπὸ ἐξουσίαν ἔπιπτον τῶν τοιούτων δυνάμεων, ὁποία δὴ καὶ ἐν τῇ ἐγγαστριμύθῳ ἐκείνῃ ἐξ αὐτῶν τῶν πραγμάτων ὁμολογεῖται</p><p>ὅθεν καὶ οὗτος διδάσκει ἡμᾶς καὶ διὰ τοῦ υἱοῦ αὐτοῦ τὸ πάντως ἀγωνίζεσθαι δικαίους γίνεσθαι, <strong><mark>καὶ πρὸς τῇ ἐξόδῳ αἰτεῖν μὴ ὑπὸ τοιαύτην τινὰ δύναμιν ὑποπεσεῖν τὰς ψυχὰς ἡμῶν</mark></strong></p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%BF_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82-%CE%94%CE%B9%CE%AC%CE%BB%CE%BF%CE%B3%CE%BF_%CF%80%CF%81%CE%BF%CF%82_%CE%A4%CF%81%CF%8D%CF%86%CF%89%CE%BD%CE%B1#HH-105">Διάλογος πρὸς Τρύφωνα</a>)</p><blockquote><p>ἀλλ’ ἐπεὶ καὶ <strong>αἴσθησις πᾶσι γενομένοις μένει</strong> καὶ κόλασις αἰωνία ἀπόκειται, μὴ ἀμελήσητε πεισθῆναί τε καὶ πιστεῦσαι ὅτι ἀληθῆ ταῦτά ἐστι. νεκυομαντεῖαι μὲν γὰρ καὶ αἱ ἀδιαφθόρων παίδων ἐποπτεύσεις καὶ ψυχῶν ἀνθρωπίνων κλήσεις καὶ οἱ λεγόμενοι παρὰ τοῖς μάγοις ὀνειροπομποὶ καὶ πάρεδροι καὶ τὰ γινόμενα ὑπὸ τῶν ταῦτα εἰδότων πεισάτωσαν ὑμᾶς, ὅτι <strong><mark>καὶ μετὰ θάνατον ἐν αἰσθήσει εἰσὶν αἱ ψυχαί</mark></strong></p><p>&lt;…&gt;</p><p>τῷ γὰρ λέγειν ἡμᾶς ὑπὸ θεοῦ πάντα κεκοσμῆσθαι καὶ γεγενῆσθαι Πλάτωνος δόξομεν λέγειν δόγμα· τῷ δὲ ἐκπύρωσιν γενέσθαι Στωϊκῶν· τῷ δὲ <strong><mark>κολάζεσθαι ἐν αἰσθήσει καὶ μετὰ θάνατον οὔσας τὰς τῶν ἀδίκων ψυχάς</mark></strong>, <strong><mark>τὰς δὲ τῶν σπουδαίων ἀπηλλαγμένας τῶν τιμωριῶν εὖ διάγειν</mark></strong>, ποιηταῖς καὶ φιλοσόφοις τὰ αὐτὰ λέγειν δόξομεν</p><p>&lt;…&gt;</p><p>πρεσβύτερος γὰρ Μωυσῆς καὶ πάντων τῶν ἐν Ἕλλησι συγγραφέων. καὶ πάντα, ὅσα περὶ <strong><mark>ἀθανασίας ψυχῆς ἢ τιμωριῶν τῶν μετὰ θάνατον ἢ θεωρίας οὐρανίων</mark></strong> ἢ τῶν ὁμοίων δογμάτων καὶ φιλόσοφοι καὶ ποιηταὶ ἔφασαν, παρὰ τῶν προφητῶν τὰς ἀφορμὰς λαβόντες καὶ νοῆσαι δεδύνηται καὶ ἐξηγήσαντο. ὅθεν παρὰ πᾶσι σπέρματα ἀληθείας δοκεῖ εἶναι</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82_%E1%BC%88%CF%80%CE%BF%CE%BB%CE%BF%CE%B3%CE%AF%CE%B1_1#HH-18">Ἀπολογία 1</a>)</p><h3>Τα τελώνια (οι μετά θάνατον δοκιμασίες της ψυχής)</h3><blockquote><p>καὶ τὸ ἀπὸ ῥομφαίας καὶ στόματος λέοντος καὶ ἐκ χειρὸς κυνὸς αἰτεῖν αὐτὸν τὴν ψυχὴν σωθῆναι, <strong>ἵνα μηδεὶς κυριεύσῃ τῆς ψυχῆς αὐτοῦ αἴτησις ἦν</strong>, ἵνα, ἡνίκα <strong><mark>ἡμεῖς πρὸς τῇ ἐξόδῳ τοῦ βίου γινόμεθα</mark></strong>, <strong>τὰ αὐτὰ αἰτῶμεν τὸν θεόν</strong>, τὸν δυνάμενον <strong><mark>ἀποστρέψαι</mark></strong> <strong>πάντα ἀναιδῆ</strong> <strong><mark>πονηρὸν ἄγγελον μὴ λαβέσθαι ἡμῶν τῆς ψυχῆς</mark></strong>. καὶ ὅτι μένουσιν αἱ ψυχαὶ ἀπέδειξα ὑμῖν ἐκ τοῦ καὶ τὴν Σαμουὴλ ψυχὴν κληθῆναι ὑπὸ τῆς ἐγγαστριμύθου, ὡς ἠξίωσεν ὁ Σαούλ. φαίνεται δὲ καὶ ὅτι πᾶσαι αἱ ψυχαὶ τῶν οὕτως δικαίων καὶ προφητῶν ὑπὸ ἐξουσίαν ἔπιπτον τῶν τοιούτων δυνάμεων, ὁποία δὴ καὶ ἐν τῇ ἐγγαστριμύθῳ ἐκείνῃ ἐξ αὐτῶν τῶν πραγμάτων ὁμολογεῖται</p><p>ὅθεν καὶ οὗτος διδάσκει ἡμᾶς καὶ διὰ τοῦ υἱοῦ αὐτοῦ τὸ πάντως ἀγωνίζεσθαι δικαίους γίνεσθαι, <strong><mark>καὶ πρὸς τῇ ἐξόδῳ αἰτεῖν μὴ ὑπὸ τοιαύτην τινὰ δύναμιν ὑποπεσεῖν τὰς ψυχὰς ἡμῶν</mark></strong></p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%BF_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82-%CE%94%CE%B9%CE%AC%CE%BB%CE%BF%CE%B3%CE%BF_%CF%80%CF%81%CE%BF%CF%82_%CE%A4%CF%81%CF%8D%CF%86%CF%89%CE%BD%CE%B1#HH-105">Διάλογος πρὸς Τρύφωνα</a>)</p><h3>Οι ψυχές των δικαίων βρίσκονται σε καλύτερο τόπο και βλέπουν τον Θεό, ενώ οι ψυχές των αμαρτωλών υποφέρουν σε άλλο τόπο</h3><p>Ο Ιουστίνος διηγείται τη μεταστροφή του στον χριστιανισμό και παραθέτει τα λόγια του χριστιανού γέροντα:</p><blockquote><p>Ἀλλὰ μὴν <strong>οὐδὲ ἀποθνήσκειν φημὶ πάσας τὰς ψυχὰς ἐγώ</strong>· ἕρμαιον γὰρ ἦν ὡς ἀληθῶς τοῖς κακοῖς. ἀλλὰ τί; <strong><mark>τὰς μὲν τῶν εὐσεβῶν ἐν κρείττονί ποι χώρῳ μένειν, τὰς δὲ ἀδίκους καὶ πονηρὰς ἐν χείρονι</mark></strong>, τὸν τῆς κρίσεως ἐκδεχομένας χρόνον τότε. οὕτως αἱ μέν, <strong><mark>ἄξιαι τοῦ θεοῦ φανεῖσαι</mark></strong>, οὐκ ἀποθνήσκουσιν ἔτι· αἱ δὲ κολάζονται, ἔστ' ἂν αὐτὰς καὶ εἶναι καὶ κολάζεσθαι ὁ θεὸς θέλῃ</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%BF_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82-%CE%94%CE%B9%CE%AC%CE%BB%CE%BF%CE%B3%CE%BF_%CF%80%CF%81%CE%BF%CF%82_%CE%A4%CF%81%CF%8D%CF%86%CF%89%CE%BD%CE%B1#HH-5">Διάλογος πρὸς Τρύφωνα</a>)</p><blockquote><p>καὶ πάντα, ὅσα περὶ <strong><mark>ἀθανασίας ψυχῆς ἢ τιμωριῶν τῶν μετὰ θάνατον</mark></strong> ἢ θεωρίας οὐρανίων ἢ τῶν ὁμοίων δογμάτων καὶ φιλόσοφοι καὶ ποιηταὶ ἔφασαν, παρὰ τῶν προφητῶν τὰς ἀφορμὰς λαβόντες καὶ νοῆσαι δεδύνηται καὶ ἐξηγήσαντο. ὅθεν παρὰ πᾶσι σπέρματα ἀληθείας δοκεῖ εἶναι</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82_%E1%BC%88%CF%80%CE%BF%CE%BB%CE%BF%CE%B3%CE%AF%CE%B1_1#HH-44">Ἀπολογία 1</a>)</p><h4>Οι ψυχές των μαρτύρων πηγαίνουν στον Πατέρα και Βασιλιά των ουρανών</h4><blockquote><p>καὶ ὃς οὐδὲν ἄλλο ἀποκρινάμενος καὶ πρὸς τὸν Λούκιον ἔφη· Δοκεῖς μοι καὶ σὺ εἶναι τοιοῦτος. καὶ Λουκίου φήσαντος· Μάλιστα, πάλιν καὶ αὐτὸν ἀπαχθῆναι ἐκέλευσεν. <strong>ὁ δὲ καὶ χάριν εἰδέναι ὡμολόγει, πονηρῶν δεσποτῶν τῶν τοιούτων ἀπηλλάχθαι γινώσκων καὶ</strong> <strong><mark>πρὸς τὸν πατέρα καὶ βασιλέα τῶν οὐρανῶν πορεύεσθαι</mark></strong></p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82_%E1%BC%88%CF%80%CE%BF%CE%BB%CE%BF%CE%B3%CE%AF%CE%B1_2#HH-2">Ἀπολογία 2</a>)</p><h3>Οι χριστιανοί φτάνουν στη ζωή με τον Θεό</h3><blockquote><p>Λογίσασθε δ’ ὅτι ὑπὲρ ὑμῶν ταῦτα ἔφημεν ἐκ τοῦ ἐφ’ ἡμῖν εἶναι ἀρνεῖσθαι ἐξεταζομένους. ἀλλ’ οὐ βουλόμεθα ζῆν ψευδολογοῦντες· τοῦ γὰρ αἰωνίου καὶ καθαροῦ βίου ἐπιθυμοῦντες <strong>τῆς μετὰ θεοῦ τοῦ πάντων πατρὸς καὶ δημιουργοῦ διαγωγῆς ἀντιποιούμεθα, καὶ</strong> <strong><mark>σπεύδομεν ἐπὶ τὸ ὁμολογεῖν, οἱ πεπεισμένοι καὶ πιστεύοντες τυχεῖν τούτων δύνασθαι τοὺς τὸν θεὸν δι’ ἔργων πείσαντας, ὅτι αὐτῷ εἵποντο καὶ τῆς παρ’ αὐτῷ διαγωγῆς ἤρων</mark></strong>, ἔνθα κακία οὐκ ἀντιτυπεῖ</p><p>&lt;…&gt;</p><p>οἳ ἐὰν ἀξίους τῷ ἐκείνου βουλεύματι ἑαυτοὺς δι’ ἔργων δείξωσι, <strong><mark>τῆς μετ’ αὐτοῦ ἀναστροφῆς καταξιωθῆναι προσειλήφαμεν συμβασιλεύοντας</mark></strong>, <strong>ἀφθάρτους καὶ ἀπαθεῖς γενομένους</strong>. ὃν τρόπον γὰρ τὴν ἀρχὴν οὐκ ὄντας ἐποίησε, τὸν αὐτὸν ἡγούμεθα τρόπον διὰ τὸ ἑλέσθαι τοὺς αἱρουμένους τὰ αὐτῷ ἀρεστὰ καὶ <strong><mark>ἀφθαρσίας καὶ συνουσίας καταξιωθῆναι</mark></strong></p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82_%E1%BC%88%CF%80%CE%BF%CE%BB%CE%BF%CE%B3%CE%AF%CE%B1_1#HH-8">Ἀπολογία 1</a>)</p><h3>Ο Χριστός είναι κριτής ζώντων και νεκρών</h3><blockquote><p>καὶ ὅτι <strong>κριτὴς ζώντων καὶ νεκρῶν ἁπάντων αὐτὸς οὗτος ὁ Χριστός</strong>, εἶπον ἐν πολλοῖς</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%BF_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82-%CE%94%CE%B9%CE%AC%CE%BB%CE%BF%CE%B3%CE%BF_%CF%80%CF%81%CE%BF%CF%82_%CE%A4%CF%81%CF%8D%CF%86%CF%89%CE%BD%CE%B1#HH-118">Διάλογος πρὸς Τρύφωνα</a>)</p><h3>Η γέεννα είναι τόπος βασάνων</h3><blockquote><p><strong><mark>ἡ δὲ γέεννά ἐστι τόπος, ἔνθα κολάζεσθαι μέλλουσιν</mark></strong> οἱ ἀδίκως βιώσαντες καὶ μὴ πιστεύοντες ταῦτα γενήσεσθαι ὅσα ὁ θεὸς διὰ τοῦ Χριστοῦ ἐδίδαξε</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82_%E1%BC%88%CF%80%CE%BF%CE%BB%CE%BF%CE%B3%CE%AF%CE%B1_1#HH-19">Ἀπολογία 1</a>)</p><h3>Αιώνια βάσανα στην κόλαση</h3><blockquote><p>ὑμῖν δὲ καὶ πᾶσι τοῖς ἀδίκως ἐχθραίνουσι καὶ μὴ μετατιθεμένοις <strong><mark>κόλασιν διὰ πυρὸς αἰωνίαν</mark></strong> ἐργάζεται</p><p>&lt;…&gt;</p><p>ἡμεῖς δὲ τὸ αὐτὸ πρᾶγμά φαμεν γενήσεσθαι, ἀλλ’ ὑπὸ τοῦ Χριστοῦ, καὶ τοῖς αὐτοῖς σώμασι μετὰ τῶν ψυχῶν γινομένων καὶ <strong><mark>αἰωνίαν κόλασιν κολασθησομένων, ἀλλ’ οὐχὶ χιλιονταετῆ περίοδον, ὡς ἐκεῖνος ἔφη</mark></strong>, μόνον</p><p>&lt;…&gt;</p><p>ὡς λαθεῖν θεὸν κακόεργον ἢ πλεονέκτην ἢ ἐπίβουλον ἢ ἐνάρετον ἀδύνατον εἶναι, καὶ <strong><mark>ἕκαστον ἐπ’ αἰωνίαν κόλασιν ἢ σωτηρίαν κατ’ ἀξίαν τῶν πράξεων πορεύεσθαι</mark></strong></p><p><strong>εἰ γὰρ οἱ πάντες ἄνθρωποι ταῦτα ἐγίνωσκον, οὐκ ἄν τις τὴν κακίαν πρὸς ὀλίγον ᾑρεῖτο, γινώσκων</strong> <strong><mark>πορεύεσθαι ἐπ’ αἰωνίαν διὰ πυρὸς καταδίκην</mark></strong>, ἀλλ’ ἐκ παντὸς τρόπου ἑαυτὸν συνεῖχε καὶ ἐκόσμει ἀρετῇ, ὅπως τῶν παρὰ τοῦ θεοῦ τύχῃ ἀγαθῶν καὶ τῶν κολαστηρίων ἀπηλλαγμένος εἴη</p><p>&lt;…&gt;</p><p>πιστεύοντες, μᾶλλον δὲ καὶ πεπεισμένοι, κατ’ ἀξίαν τῶν πράξεων <strong>ἕκαστον τίσειν</strong> <strong><mark>διὰ πυρὸς αἰωνίου δίκας</mark></strong>, καὶ πρὸς ἀναλογίαν ὧν ἔλαβε δυνάμεων παρὰ θεοῦ τὸν λόγον ἀπαιτηθήσεσθαι, ὡς ὁ Χριστὸς ἐμήνυσεν εἰπών· Ὧι πλέον ἔδωκεν ὁ θεός, πλέον καὶ ἀπαιτηθήσεται παρ’ αὐτοῦ</p><p><strong><mark>ὅπερ εἰ εἰς ἀναισθησίαν ἐχώρει, ἕρμαιον ἂν ἦν τοῖς ἀδίκοις πᾶσιν. ἀλλ’ ἐπεὶ καὶ αἴσθησις πᾶσι γενομένοις μένει καὶ κόλασις αἰωνία ἀπόκειται</mark></strong>, μὴ ἀμελήσητε πεισθῆναί τε καὶ πιστεῦσαι ὅτι ἀληθῆ ταῦτά ἐστι</p><p>&lt;…&gt;</p><p>ἀπαθανατίζεσθαι δὲ ἡμεῖς μόνους δεδιδάγμεθα τοὺς ὁσίως καὶ ἐναρέτως ἐγγὺς θεῷ βιοῦντας, <strong><mark>κολάζεσθαι δὲ τοὺς ἀδίκως καὶ μὴ μεταβάλλοντας ἐν αἰωνίῳ πυρὶ</mark></strong> πιστεύομεν</p><p>&lt;…&gt;</p><p>Παρ’ ἡμῖν μὲν γὰρ ὁ ἀρχηγέτης τῶν κακῶν δαιμόνων ὄφις καλεῖται καὶ σατανᾶς καὶ διάβολος, ὡς καὶ ἐκ τῶν ἡμετέρων συγγραμμάτων ἐρευνήσαντες μαθεῖν δύνασθε· <strong>ὃν εἰς τὸ πῦρ πεμφθήσεσθαι μετὰ τῆς αὐτοῦ στρατιᾶς καὶ τῶν ἑπομένων ἀνθρώπων</strong> <strong><mark>κολασθησομένους τὸν ἀπέραντον αἰῶνα</mark></strong>, προεμήνυσεν ὁ Χριστός</p><p>&lt;…&gt;</p><p>ὑμῖν δὲ καὶ πᾶσι τοῖς ἀδίκως ἐχθραίνουσι καὶ μὴ μετατιθεμένοις <strong><mark>κόλασιν διὰ πυρὸς αἰωνίαν</mark></strong> ἐργάζεται</p><p>&lt;…&gt;</p><p>δύο γὰρ αὐτοῦ παρουσίας προεκήρυξαν οἱ προφῆται· μίαν μέν, τὴν ἤδη γενομένην, ὡς ἀτίμου καὶ παθητοῦ ἀνθρώπου, τὴν δὲ δευτέραν, ὅταν μετὰ δόξης ἐξ οὐρανῶν μετὰ τῆς ἀγγελικῆς αὐτοῦ στρατιᾶς παραγενήσεσθαι κεκήρυκται, ὅτε καὶ τὰ σώματα ἀνεγερεῖ πάντων τῶν γενομένων ἀνθρώπων, καὶ τῶν μὲν ἀξίων ἐνδύσει ἀφθαρσίαν, <strong><mark>τῶν δ’ ἀδίκων ἐν αἰσθήσει αἰωνίᾳ μετὰ τῶν φαύλων δαιμόνων εἰς τὸ αἰώνιον πῦρ πέμψει</mark></strong></p><p>&lt;…&gt;</p><p>ἐν οἵᾳ δὲ <strong>αἰσθήσει</strong> καὶ <strong>κολάσει</strong> γενέσθαι μέλλουσιν οἱ ἄδικοι, ἀκούσατε τῶν ὁμοίως εἰς τοῦτο εἰρημένων. ἔστι δὲ ταῦτα· <strong><mark>Ὁ σκώληξ αὐτῶν οὐ παυθήσεται, καὶ τὸ πῦρ αὐτῶν οὐ σβεσθήσεται. καὶ τότε μετανοήσουσιν, ὅτε οὐδὲν ὠφελήσουσι</mark></strong></p><p>&lt;…&gt;</p><p><strong>Οὐ γὰρ μὴ γενέσθαι τὴν ἐκπύρωσιν ἐπὶ κολάσει τῶν ἀσεβῶν οἱ φαῦλοι δαίμονες πεῖσαι δύνανται</strong></p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82_%E1%BC%88%CF%80%CE%BF%CE%BB%CE%BF%CE%B3%CE%AF%CE%B1_1#HH-45">Ἀπολογία 1</a>)</p><blockquote><p>τοὺς ἀδίκους καὶ ἀκολάστους <strong><mark>ἐν αἰωνίῳ πυρὶ κολασθήσεσθαι</mark></strong>, τοὺς δ’ ἐναρέτους καὶ ὁμοίως Χριστῷ βιώσαντας ἐν ἀπαθείᾳ συγγενέσθαι τῷ θεῷ (λέγομεν δὲ τῶν γενομένων Χριστιανῶν)</p><p>&lt;…&gt;</p><p>τοῖς οὐ σωφρόνως καὶ μετὰ λόγου ὀρθοῦ βιοῦσιν ἔσεσθαι <strong><mark>ἐν αἰωνίῳ πυρὶ κόλασιν</mark></strong></p><p>&lt;…&gt;</p><p>οἳ τὴν ἀξίαν κόλασιν καὶ τιμωρίαν κομίσονται <strong><mark>ἐν αἰωνίῳ πυρὶ ἐγκλεισθέντες</mark></strong></p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82_%E1%BC%88%CF%80%CE%BF%CE%BB%CE%BF%CE%B3%CE%AF%CE%B1_2#HH-1">Ἀπολογία 2</a>)</p><blockquote><p>ἀπὸ μὲν τῶν ἁμαρτιῶν τῶν προτέρων καθαρισθέντες, <strong>ἀπὸ δὲ τῆς θλίψεως καὶ τῆς πυρώσεως</strong>, ἣν πυροῦσιν ἡμᾶς ὅ τε διάβολος καὶ οἱ αὐτοῦ ὑπηρέται πάντες, ἐξ ὧν καὶ πάλιν <strong>ἀποσπᾷ ἡμᾶς Ἰησοῦς ὁ υἱὸς τοῦ θεοῦ</strong></p><p>&lt;…&gt;</p><p>ἃ ῥυπαρὰ καὶ αὐτὰ ἐνδύματα, περιτεθέντα ὑφ' ὑμῶν πᾶσι τοῖς ἀπὸ τοῦ ὀνόματος τοῦ Ἰησοῦ γενομένοις Χριστιανοῖς, δείξει αἰρόμενα ἀφ' ἡμῶν ὁ θεός, ὅταν πάντας ἀναστήσῃ, καὶ τοὺς μὲν ἐν αἰωνίῳ καὶ ἀλύτῳ βασιλείᾳ ἀφθάρτους καὶ ἀθανάτους καὶ ἀλύπους καταστήσῃ, <strong>τοὺς δὲ εἰς</strong> <strong><mark>κόλασιν αἰώνιον</mark></strong> <strong>πυρὸς παραπέμψῃ</strong></p><p>&lt;…&gt;</p><p>τοῦ τέμνειν ὑμῶν τὸ γένος διχῆ μέλλοντος, καὶ τοὺς μὲν ἀξίους σὺν τοῖς ἁγίοις πατριάρχαις καὶ προφήταις τῆς αἰωνίου βασιλείας καταξιοῦν μέλλοντος, τοὺς δὲ <strong>ἐπὶ τὴν καταδίκην τοῦ ἀσβέστου πυρὸς</strong> σὺν τοῖς ὁμοίοις ἀπειθέσι καὶ ἀμεταθέτοις ἀπὸ πάντων τῶν ἐθνῶν πέμψειν ἤδη φήσαντος. Ἥξουσι γάρ, εἶπεν, ἀπὸ δυσμῶν καὶ ἀνατολῶν, καὶ ἀνακλιθήσονται μετὰ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ ἐν τῇ βασιλείᾳ τῶν οὐρανῶν· οἱ δὲ υἱοὶ τῆς βασιλείας ἐκβληθήσονται εἰς τὸ σκότος τὸ ἐξώτερον</p><p>&lt;…&gt;</p><p>καὶ ἐν τῷ Ἠσαίᾳ εἰς τοῦτο αὐτὸ ἔφη οὕτως· Εἶπε κύριος ὁ θεός· Καὶ ἐξελεύσονται καὶ ὄψονται <strong><mark>τὰ κῶλα τῶν παραβεβηκότων ἀνθρώπων· ὁ γὰρ σκώληξ αὐτῶν οὐ τελευτήσει, καὶ τὸ πῦρ αὐτῶν οὐ σβεσθήσεται</mark></strong>, καὶ ἔσονται εἰς ὅρασιν πάσῃ σαρκί</p><p>&lt;…&gt;</p><p>ἵνα διὰ τῆς οἰκονομίας ταύτης ὁ πονηρευσάμενος τὴν ἀρχὴν ὄφις καὶ οἱ ἐξομοιωθέντες αὐτῷ ἄγγελοι καταλυθῶσι, καὶ ὁ θάνατος καταφρονηθῇ καὶ <strong>ἐν τῇ δευτέρᾳ αὐτοῦ τοῦ Χριστοῦ παρουσίᾳ</strong> ἀπὸ τῶν πιστευόντων αὐτῷ καὶ εὐαρέστως ζώντων παύσηται τέλεον, ὕστερον μηκέτ' ὤν, ὅταν οἱ μὲν <strong><mark>εἰς κρίσιν καὶ καταδίκην τοῦ πυρὸς ἀπαύστως κολάζεσθαι πεμφθῶσιν</mark></strong>, οἱ δὲ ἐν ἀπαθείᾳ καὶ ἀφθαρσίᾳ καὶ ἀλυπίᾳ καὶ ἀθανασίᾳ συνῶσιν</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%BF_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82-%CE%94%CE%B9%CE%AC%CE%BB%CE%BF%CE%B3%CE%BF_%CF%80%CF%81%CE%BF%CF%82_%CE%A4%CF%81%CF%8D%CF%86%CF%89%CE%BD%CE%B1#HH-116">Διάλογος πρὸς Τρύφωνα</a>)</p><h3>Τα βάσανα είναι θέμα δικαιοσύνης</h3><blockquote><p>Ἵνα δὲ μή τις εἴπῃ τὸ λεγόμενον ὑπὸ τῶν νομιζομένων φιλοσόφων, ὅτι κόμποι καὶ φόβητρά ἐστι τὰ λεγόμενα ὑφ’ ἡμῶν ὅτι <strong>κολάζονται ἐν αἰωνίῳ πυρὶ οἱ ἄδικοι, καὶ διὰ φόβον ἀλλ’ οὐ διὰ τὸ καλὸν εἶναι καὶ ἀρεστὸν ἐναρέτως βιοῦν τοὺς ἀνθρώπους ἀξιοῦμεν, βραχυεπῶς πρὸς τοῦτο ἀποκρινοῦμαι, ὅτι, εἰ μὴ τοῦτό ἐστιν, οὔτε ἔστι θεός, ἤ, εἰ ἔστιν, οὐ μέλει αὐτῷ τῶν ἀνθρώπων, καὶ οὐδέν ἐστιν ἀρετὴ οὐδὲ κακία, καί, ὡς προέφημεν, ἀδίκως τιμωροῦσιν οἱ νομοθέται τοὺς παραβαίνοντας τὰ διατεταγμένα καλά</strong>. ἀλλ’ ἐπεὶ οὐκ ἄδικοι ἐκεῖνοι καὶ ὁ αὐτῶν πατήρ, τὰ αὐτὰ αὐτῷ πράττειν διὰ τοῦ λόγου διδάσκων, οἱ τούτοις συντιθέμενοι οὐκ ἄδικοι</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82_%E1%BC%88%CF%80%CE%BF%CE%BB%CE%BF%CE%B3%CE%AF%CE%B1_2#HH-9">Ἀπολογία 2</a>)</p><h2>Εσχατολογία</h2><h3>Μόνο δύο παρουσίες του Χριστού</h3><blockquote><p>Ἐὰν οὖν ὁ λόγος ἀναγκάζῃ ὁμολογεῖν ὅτι <strong><mark>δύο παρουσίαι τοῦ Χριστοῦ</mark></strong> <strong>προεφητεύοντο γενησόμεναι</strong>, <strong><mark>μία μέν</mark></strong>, ἐν ᾗ παθητὸς καὶ ἄτιμος καὶ ἀειδὴς φανήσεται, <strong><mark>ἡ δὲ ἑτέρα</mark></strong>, ἐν ᾗ καὶ ἔνδοξος καὶ κριτὴς ἁπάντων ἐλεύσεται, ὡς καὶ ἐν πολλοῖς τοῖς προλελεγμένοις ἀποδέδεικται, οὐχὶ τῆς φοβερᾶς καὶ μεγάλης ἡμέρας τοῦτ' ἔστι τῆς δευτέρας παρουσίας αὐτοῦ, πρόοδον γενήσεσθαι τὸν Ἠλίαν νοήσομεν τὸν λόγον τοῦ θεοῦ κεκηρυχέναι</p><p>&lt;…&gt;</p><p>Ἠλίαν ἐλεύσεσθαι· καὶ ἡμεῖς <strong>τοῦτο ἐπιστάμεθα γενησόμενον, ὅταν μέλλῃ ἐν δόξῃ ἐξ οὐρανῶν παραγίνεσθαι ὁ ἡμέτερος κύριος Ἰησοῦς Χριστός</strong>, <strong>οὗ καὶ τῆς πρώτης φανερώσεως κῆρυξ προῆλθε</strong> τὸ ἐν Ἠλίᾳ γενόμενον πνεῦμα τοῦ θεοῦ, ἐν Ἰωάννῃ, τῷ γενομένῳ ἐν τῷ γένει ὑμῶν προφήτῃ, μεθ' ὃν οὐδεὶς ἕτερος λοιπὸς παρ' ὑμῖν ἐφάνη προφήτης</p><p>&lt;…&gt;</p><p>ἀλόγιστοι, μὴ συνιέντες, ὅπερ διὰ πάντων τῶν λόγων ἀποδέδεικται, ὅτι <strong><mark>δύο παρουσίαι αὐτοῦ</mark></strong> κατηγγελμέναι <strong>εἰσί·</strong> <strong><mark>μία μέν</mark></strong>, <strong>ἐν ᾗ παθητὸς καὶ ἄδοξος καὶ ἄτιμος καὶ σταυρούμενος κεκήρυκται</strong>, <strong><mark>ἡ δὲ δευτέρα</mark></strong>, <strong>ἐν ᾗ μετὰ δόξης ἀπὸ τῶν οὐρανῶν παρέσται</strong></p><p>&lt;…&gt;</p><p>ἡ γὰρ φυτευθεῖσα ὑπὸ τοῦ θεοῦ ἄμπελος καὶ σωτῆρος Χριστοῦ ὁ λαὸς αὐτοῦ ἐστι. τὰ δὲ λοιπὰ τῆς προφητείας <strong>ἐν τῇ δευτέρᾳ αὐτοῦ παρουσίᾳ ἀποβήσεται</strong></p><p>&lt;…&gt;</p><p>Καὶ ὅτι <strong>δύο παρουσίας</strong> συμβολικῶς γενήσεσθαι τούτου τοῦ Χριστοῦ καὶ ὑπὸ Μωυσέως προελέγετο, προεῖπον διὰ τοῦ συμβόλου τῶν ἐν τῇ νηστείᾳ προσφερομένων τράγων</p><p>&lt;…&gt;</p><p><strong><mark>τῶν δύο παρουσιῶν τοῦ Χριστοῦ</mark></strong> καταγγελία ἦσαν· <strong><mark>μιᾶς μέν</mark></strong>, ἐν ᾗ ὡς ἀποπομπαῖον αὐτὸν παρεπέμψαντο οἱ πρεσβύτεροι τοῦ λαοῦ ὑμῶν καὶ οἱ ἱερεῖς, ἐπιβαλόντες αὐτῷ τὰς χεῖρας καὶ θανατώσαντες αὐτόν, καὶ <strong><mark>τῆς δευτέρας δὲ αὐτοῦ παρουσίας</mark></strong>, ὅτι <strong>ἐν τῷ αὐτῷ τόπῳ τῶν Ἰεροσολύμων</strong> ἐπιγνωσθήσεσθε αὐτόν, τὸν ἀτιμωθέντα ὑφ' ὑμῶν, καὶ προσφορὰ ἦν ὑπὲρ πάντων τῶν μετανοεῖν βουλομένων ἁμαρτωλῶν καὶ νηστευόντων ἣν καταλέγει Ἠσαίας νηστείαν</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%BF_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82-%CE%94%CE%B9%CE%AC%CE%BB%CE%BF%CE%B3%CE%BF_%CF%80%CF%81%CE%BF%CF%82_%CE%A4%CF%81%CF%8D%CF%86%CF%89%CE%BD%CE%B1#HH-49">Διάλογος πρὸς Τρύφωνα</a>)</p><blockquote><p><strong><mark>δύο γὰρ αὐτοῦ παρουσίας</mark></strong> προεκήρυξαν οἱ προφῆται· <strong><mark>μίαν μέν</mark></strong>, τὴν ἤδη γενομένην, ὡς ἀτίμου καὶ παθητοῦ ἀνθρώπου, <strong><mark>τὴν δὲ δευτέραν</mark></strong>, ὅταν <strong>μετὰ δόξης ἐξ οὐρανῶν μετὰ τῆς ἀγγελικῆς αὐτοῦ στρατιᾶς παραγενήσεσθαι κεκήρυκται, ὅτε καὶ τὰ σώματα ἀνεγερεῖ πάντων τῶν γενομένων ἀνθρώπων, καὶ τῶν μὲν ἀξίων ἐνδύσει ἀφθαρσίαν, τῶν δ’ ἀδίκων ἐν αἰσθήσει αἰωνίᾳ μετὰ τῶν φαύλων δαιμόνων εἰς τὸ αἰώνιον πῦρ πέμψει</strong></p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82_%E1%BC%88%CF%80%CE%BF%CE%BB%CE%BF%CE%B3%CE%AF%CE%B1_1#HH-52">Ἀπολογία 1</a>)</p><h3>Η δεύτερη παρουσία του Χριστού γίνεται για την ανάσταση, την κρίση, την τιμωρία και την ανταμοιβή</h3><blockquote><p>δύο γὰρ αὐτοῦ παρουσίας προεκήρυξαν οἱ προφῆται· μίαν μέν, τὴν ἤδη γενομένην, ὡς ἀτίμου καὶ παθητοῦ ἀνθρώπου, τὴν δὲ δευτέραν, ὅταν <strong><mark>μετὰ δόξης ἐξ οὐρανῶν</mark></strong> <strong>μετὰ τῆς ἀγγελικῆς αὐτοῦ στρατιᾶς παραγενήσεσθαι κεκήρυκται, ὅτε καὶ τὰ σώματα</strong> <strong><mark>ἀνεγερεῖ</mark></strong> <strong>πάντων τῶν γενομένων ἀνθρώπων, καὶ τῶν μὲν ἀξίων ἐνδύσει ἀφθαρσίαν, τῶν δ’ ἀδίκων ἐν αἰσθήσει αἰωνίᾳ μετὰ τῶν φαύλων δαιμόνων εἰς τὸ αἰώνιον πῦρ πέμψει</strong></p><p>&lt;…&gt;</p><p><strong>παραγενησόμενον τὸν Χριστόν, καὶ κολασθησομένους διὰ πυρὸς τοὺς ἀσεβεῖς τῶν ἀνθρώπων</strong></p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82_%E1%BC%88%CF%80%CE%BF%CE%BB%CE%BF%CE%B3%CE%AF%CE%B1_1#HH-52">Ἀπολογία 1</a>)</p><h3>Η δεύτερη παρουσία του Χριστού μπορεί να γίνει από στιγμή σε στιγμή</h3><blockquote><p><strong>βραχὺς οὗτος ὑμῖν περιλείπεται προσηλύσεως χρόνος</strong>· <strong><mark>ἐὰν φθάσῃ ὁ Χριστὸς ἐλθεῖν, μάτην μετανοήσετε</mark></strong>, μάτην κλαύσετε· οὐ γὰρ εἰσακούσεται ὑμῶν</p><p>&lt;…&gt;</p><p><strong>εἰς τὸν οὐρανὸν ἀνελήφθη μετὰ τὸ ἐκ νεκρῶν ἀναστῆναι</strong> ὁ ἡμέτερος κύριος Ἰησοῦς Χριστός, <strong><mark>τῶν χρόνων συμπληρουμένων</mark></strong> καὶ τοῦ βλάσφημα καὶ τολμηρὰ εἰς τὸν ὕψιστον μέλλοντος λαλεῖν <strong>ἤδη ἐπὶ θύραις ὄντος</strong>, ὃν <strong>καιρὸν καὶ καιροὺς καὶ ἥμισυ καιροῦ</strong> διακαθέξειν Δανιὴλ μηνύει</p><p>&lt;…&gt;</p><p>ὁ γὰρ Χριστὸς βασιλεὺς καὶ ἱερεὺς καὶ θεὸς καὶ κύριος καὶ ἄγγελος καὶ ἄνθρωπος καὶ ἀρχιστράτηγος καὶ λίθος καὶ παιδίον γεννώμενον καὶ παθητὸς γενόμενος πρῶτον, <strong><mark>εἶτα εἰς οὐρανὸν ἀνερχόμενος καὶ πάλιν παραγινόμενος μετὰ δόξης καὶ αἰώνιον τὴν βασιλείαν ἔχων</mark></strong> κεκήρυκται, ὡς ἀπὸ πασῶν τῶν γραφῶν ἀποδείκνυμι. ἵνα δὲ καὶ ὃ εἶπον νοήσητε, τοὺς τοῦ ψαλμοῦ λόγους λέγω. εἰσὶ δ' οὗτοι· Ὁ θεός, τὸ κρίμα σου τῷ βασιλεῖ δὸς καὶ τὴν δικαιοσύνην σου τῷ υἱῷ τοῦ βασιλέως, κρίνειν τὸν λαόν σου ἐν δικαιοσύνῃ καὶ τοὺς πτωχούς σου ἐν κρίσει. ἀναλαβέτω τὰ ὄρη εἰρήνην τῷ λαῷ καὶ οἱ βουνοὶ δικαιοσύνην. <strong>κρινεῖ</strong> τοὺς πτωχοὺς τοῦ λαοῦ, καὶ σώσει τοὺς υἱοὺς τῶν πενήτων, καὶ ταπεινώσει συκοφάντην· καὶ <strong>συμπαραμενεῖ</strong> τῷ ἡλίῳ καὶ πρὸ τῆς σελήνης <strong>εἰς γενεὰς γενεῶν</strong></p><p>&lt;…&gt;</p><p>εὐχόμεθα, ἵνα μεταγνόντες σὺν ἡμῖν μὴ βλασφημῆτε τὸν διά τε τῶν ἔργων καὶ τῶν ἀπὸ τοῦ ὀνόματος αὐτοῦ καὶ νῦν γινομένων δυνάμεων καὶ ἀπὸ τῶν τῆς διδαχῆς λόγων καὶ ἀπὸ τῶν προφητευθεισῶν εἰς αὐτὸν προφητειῶν ἄμωμον καὶ ἀνέγκλητον κατὰ πάντα Χριστὸν Ἰησοῦν, ἀλλὰ πιστεύσαντες εἰς αὐτὸν <strong>ἐν τῇ πάλιν γενησομένῃ ἐνδόξῳ αὐτοῦ παρουσίᾳ σωθῆτε καὶ μὴ καταδικασθῆτε εἰς τὸ πῦρ</strong></p><p>&lt;…&gt;</p><p>Ἔστω καὶ ταῦτα οὕτως ἔχοντα ὡς λέγεις, καὶ ὅτι παθητὸς Χριστὸς προεφητεύθη μέλλειν εἶναι, καὶ λίθος κέκληται, καὶ ἔνδοξος <strong><mark>μετὰ τὴν πρώτην αὐτοῦ παρουσίαν</mark></strong>, ἐν ᾗ παθητὸς φαίνεσθαι κεκήρυκτο, <strong><mark>ἐλευσόμενος καὶ κριτὴς πάντων λοιπὸν καὶ αἰώνιος βασιλεὺς</mark></strong> καὶ ἱερεὺς γενησόμενος· εἰ οὗτος δέ ἐστι περὶ οὗ ταῦτα προεφητεύθη, ἀπόδειξον</p><p>&lt;…&gt;</p><p>τὸν σταυρωθέντα τοῦτον ἀξιῶν πείθειν ἡμᾶς γεγενῆσθαι μετὰ Μωυσέως καὶ Ἀαρὼν καὶ λελαληκέναι αὐτοῖς ἐν στύλῳ νεφέλης, εἶτα ἄνθρωπον γενόμενον σταυρωθῆναι, καὶ ἀναβεβηκέναι εἰς τὸν οὐρανόν, καὶ πάλιν παραγίνεσθαι ἐπὶ τῆς γῆς, καὶ προσκυνητὸν εἶναι</p><p>&lt;…&gt;</p><p>ἵνα διὰ τῆς οἰκονομίας ταύτης ὁ πονηρευσάμενος τὴν ἀρχὴν ὄφις καὶ οἱ ἐξομοιωθέντες αὐτῷ ἄγγελοι καταλυθῶσι, καὶ ὁ θάνατος καταφρονηθῇ καὶ <strong><mark>ἐν τῇ δευτέρᾳ αὐτοῦ τοῦ Χριστοῦ παρουσίᾳ</mark></strong> ἀπὸ τῶν πιστευόντων αὐτῷ καὶ εὐαρέστως ζώντων παύσηται τέλεον, ὕστερον μηκέτ' ὤν, ὅταν οἱ μὲν <strong><mark>εἰς κρίσιν καὶ καταδίκην τοῦ πυρὸς ἀπαύστως κολάζεσθαι πεμφθῶσιν</mark></strong>, <strong><mark>οἱ δὲ ἐν ἀπαθείᾳ καὶ ἀφθαρσίᾳ καὶ ἀλυπίᾳ καὶ ἀθανασίᾳ συνῶσιν</mark></strong></p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%BF_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82-%CE%94%CE%B9%CE%AC%CE%BB%CE%BF%CE%B3%CE%BF_%CF%80%CF%81%CE%BF%CF%82_%CE%A4%CF%81%CF%8D%CF%86%CF%89%CE%BD%CE%B1#HH-28">Διάλογος πρὸς Τρύφωνα</a>)</p><h4>Όλοι περιμένουν τη δεύτερη παρουσία του Χριστού</h4><blockquote><p>τὸ δὲ Αὐτὸς ἔσται προσδοκία ἐθνῶν μηνυτικὸν ἦν ὅτι <strong>ἐκ πάντων τῶν ἐθνῶν προσδοκήσουσιν αὐτὸν πάλιν παραγενησόμενον</strong>, <strong>ὅπερ ὄψει ὑμῖν πάρεστιν ἰδεῖν καὶ ἔργῳ πεισθῆναι</strong>· <strong><mark>ἐκ πάντων γὰρ γενῶν ἀνθρώπων προσδοκῶσι τὸν ἐν Ἰουδαίᾳ σταυρωθέντα</mark></strong>, μεθ’ ὃν εὐθὺς δοριάλωτος ὑμῖν ἡ γῆ Ἰουδαίων παρεδόθη</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82_%E1%BC%88%CF%80%CE%BF%CE%BB%CE%BF%CE%B3%CE%AF%CE%B1_1#HH-32">Ἀπολογία 1</a>)</p><h3>Ο Ιουστίνος πιστεύει ότι ο Χριστός θα έρθει να κρίνει στη διάρκεια της δικής του ζωής</h3><p>Πιστεύει ότι θα σωθεί αυτό το γένος, και <strong>ίσως</strong> ακόμη και εκείνοι που δεν έχουν γεννηθεί:</p><blockquote><p>Παρ’ ἡμῖν μὲν γὰρ ὁ ἀρχηγέτης τῶν κακῶν δαιμόνων ὄφις καλεῖται καὶ σατανᾶς καὶ διάβολος, ὡς καὶ ἐκ τῶν ἡμετέρων συγγραμμάτων ἐρευνήσαντες μαθεῖν δύνασθε· ὃν <strong>εἰς τὸ πῦρ πεμφθήσεσθαι μετὰ τῆς αὐτοῦ στρατιᾶς καὶ τῶν ἑπομένων ἀνθρώπων κολασθησομένους τὸν ἀπέραντον αἰῶνα</strong>, προεμήνυσεν ὁ Χριστός. καὶ γὰρ <strong>ἡ ἐπιμονὴ τοῦ μηδέπω τοῦτο πρᾶξαι τὸν θεὸν διὰ τὸ ἀνθρώπινον γένος γεγένηται· προγινώσκει γάρ τινας ἐκ μετανοίας σωθήσεσθαι μέλλοντας</strong> <strong><mark>καί τινας μηδέπω ἴσως γεννηθέντας</mark></strong></p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82_%E1%BC%88%CF%80%CE%BF%CE%BB%CE%BF%CE%B3%CE%AF%CE%B1_1#HH-28">Ἀπολογία 1</a>)</p><h3>Ο Χριστός βασιλεύει στον ουρανό</h3><blockquote><p><strong>ὁ καθ’ ἡμᾶς δὲ Ἰησοῦς Χριστὸς σταυρωθεὶς</strong> καὶ <strong>ἀποθανὼν ἀνέστη</strong>, καὶ <strong><mark>ἐβασίλευσεν ἀνελθὼν εἰς οὐρανόν</mark></strong>, καὶ ἐπὶ τοῖς παρ’ αὐτοῦ διὰ τῶν ἀποστόλων ἐν τοῖς πᾶσιν ἔθνεσι κηρυχθεῖσιν εὐφροσύνη ἐστὶ προσδοκώντων τὴν κατηγγελμένην ὑπ’ αὐτοῦ ἀφθαρσίαν</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82_%E1%BC%88%CF%80%CE%BF%CE%BB%CE%BF%CE%B3%CE%AF%CE%B1_1#HH-42">Ἀπολογία 1</a>)</p><h3>Η αιώνια βασιλεία του Χριστού</h3><blockquote><p>ὁ μὲν γὰρ πρόσκαιρον ἔδωκεν αὐτοῖς τὴν κληρονομίαν, ἅτε οὐ Χριστὸς ὁ θεὸς ὢν οὐδὲ υἱὸς θεοῦ, ὁ δὲ <strong>μετὰ τὴν ἁγίαν ἀνάστασιν</strong> <strong><mark>αἰώνιον ἡμῖν τὴν κατάσχεσιν</mark></strong> δώσει</p><p>&lt;…&gt;</p><p>ἐνδῦσαι ἡμᾶς τὰ ἡτοιμασμένα ἐνδύματα, ἐὰν πράξωμεν αὐτοῦ τὰς ἐντολάς, ὑπέσχετο, καὶ <strong><mark>αἰώνιον βασιλείαν</mark></strong> <strong>προνοῆσαι ἐπήγγελται</strong></p><p>&lt;…&gt;</p><p>τοῦ τέμνειν ὑμῶν τὸ γένος διχῆ μέλλοντος, καὶ <strong>τοὺς μὲν ἀξίους</strong> <strong>σὺν τοῖς ἁγίοις πατριάρχαις καὶ προφήταις</strong> <strong><mark>τῆς αἰωνίου βασιλείας</mark></strong> καταξιοῦν μέλλοντος, τοὺς δὲ ἐπὶ τὴν καταδίκην τοῦ ἀσβέστου πυρὸς σὺν τοῖς ὁμοίοις ἀπειθέσι καὶ ἀμεταθέτοις ἀπὸ πάντων τῶν ἐθνῶν πέμψειν ἤδη φήσαντος</p><p>&lt;…&gt;</p><p>ὁ γὰρ Χριστὸς βασιλεὺς καὶ ἱερεὺς καὶ θεὸς καὶ κύριος καὶ ἄγγελος καὶ ἄνθρωπος καὶ ἀρχιστράτηγος καὶ λίθος καὶ παιδίον γεννώμενον καὶ παθητὸς γενόμενος πρῶτον, <strong><mark>εἶτα εἰς οὐρανὸν ἀνερχόμενος καὶ πάλιν παραγινόμενος μετὰ δόξης καὶ αἰώνιον τὴν βασιλείαν ἔχων</mark></strong> κεκήρυκται, ὡς ἀπὸ πασῶν τῶν γραφῶν ἀποδείκνυμι. ἵνα δὲ καὶ ὃ εἶπον νοήσητε, τοὺς τοῦ ψαλμοῦ λόγους λέγω. εἰσὶ δ' οὗτοι· Ὁ θεός, τὸ κρίμα σου τῷ βασιλεῖ δὸς καὶ τὴν δικαιοσύνην σου τῷ υἱῷ τοῦ βασιλέως, κρίνειν τὸν λαόν σου ἐν δικαιοσύνῃ καὶ τοὺς πτωχούς σου ἐν κρίσει. ἀναλαβέτω τὰ ὄρη εἰρήνην τῷ λαῷ καὶ οἱ βουνοὶ δικαιοσύνην. <strong>κρινεῖ</strong> τοὺς πτωχοὺς τοῦ λαοῦ, καὶ σώσει τοὺς υἱοὺς τῶν πενήτων, καὶ ταπεινώσει συκοφάντην· καὶ <strong>συμπαραμενεῖ</strong> τῷ ἡλίῳ καὶ πρὸ τῆς σελήνης <strong>εἰς γενεὰς γενεῶν</strong></p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%BF_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82-%CE%94%CE%B9%CE%AC%CE%BB%CE%BF%CE%B3%CE%BF_%CF%80%CF%81%CE%BF%CF%82_%CE%A4%CF%81%CF%8D%CF%86%CF%89%CE%BD%CE%B1#HH-113">Διάλογος πρὸς Τρύφωνα</a>)</p><h3>Η βασιλεία του Χριστού δεν είναι ανθρώπινη βασιλεία</h3><p>Ο μάρτυς Ιουστίνος, στην επιστολή του προς τη ρωμαϊκή εξουσία, υπερασπίζεται τους χριστιανούς και καθησυχάζει τους άρχοντες, λέγοντας ότι η βασιλεία που περιμένουν οι χριστιανοί δεν απειλεί τη Ρώμη και δεν πρέπει να τη βλέπουμε ως απειλή, γιατί δεν είναι ανθρώπινη βασιλεία:</p><blockquote><p>Καὶ ὑμεῖς, ἀκούσαντες βασιλείαν προσδοκῶντας ἡμᾶς, <strong><mark>ἀκρίτως ἀνθρώπινον λέγειν ἡμᾶς ὑπειλήφατε, ἡμῶν τὴν μετὰ θεοῦ λεγόντων</mark></strong>, ὡς καὶ ἐκ τοῦ ἀνεταζομένους ὑφ’ ὑμῶν ὁμολογεῖν εἶναι Χριστιανούς, γινώσκοντες τῷ ὁμολογοῦντι θάνατον τὴν ζημίαν κεῖσθαι, φαίνεται. <strong><mark>εἰ γὰρ ἀνθρώπινον βασιλείαν προσεδοκῶμεν, κἂν ἠρνούμεθα, ὅπως μὴ ἀναιρώμεθα, καὶ λανθάνειν ἐπειρώμεθα, ὅπως τῶν προσδοκωμένων τύχωμεν</mark></strong>· ἀλλ’ ἐπεὶ οὐκ εἰς τὸ νῦν τὰς ἐλπίδας ἔχομεν, <strong>ἀναιρούντων οὐ πεφροντίκαμεν τοῦ καὶ πάντως ἀποθανεῖν ὀφειλομένου</strong>.</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82_%E1%BC%88%CF%80%CE%BF%CE%BB%CE%BF%CE%B3%CE%AF%CE%B1_1#HH-11">Ἀπολογία 1</a>)</p><h3>Η χιλιετία πριν από τη δεύτερη παρουσία του Χριστού</h3><p>Την εποχή του Ιουστίνου απαγορευόταν ακόμη στους Ιουδαίους να επιστρέψουν στην κατεστραμμένη Ιερουσαλήμ:</p><blockquote><p>καὶ ὅτι <strong>ἠρήμωτο Ἰερουσαλήμ, ὡς προείρητο γεγενῆσθαι</strong>, πεπεισμένοι ἐστέ. εἴρηται δὲ καὶ περὶ τῆς ἐρημώσεως αὐτῆς, καὶ περὶ τοῦ μὴ ἐπιτραπήσεσθαι μηδένα αὐτῶν οἰκεῖν, διὰ Ἠσαίου τοῦ προφήτου οὕτως· Ἡ γῆ αὐτῶν ἔρημος, ἔμπροσθεν αὐτῶν οἱ ἐχθροὶ αὐτῶν αὐτὴν φάγονται, καὶ οὐκ ἔσται ἐξ αὐτῶν ὁ κατοικῶν ἐν αὐτῇ. ὅτι δὲ <strong>φυλάσσεται ὑφ’ ὑμῶν ὅπως μηδεὶς ἐν αὐτῇ γένηται, καὶ θάνατος κατὰ τοῦ καταλαμβανομένου Ἰουδαίου εἰσιόντος ὥρισται</strong>, ἀκριβῶς ἐπίστασθε.</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82_%E1%BC%88%CF%80%CE%BF%CE%BB%CE%BF%CE%B3%CE%AF%CE%B1_1#HH-47">Ἀπολογία 1</a>)</p><p>Ο Ιουστίνος μιλά γι’ αυτό σε μια εποχή κατά την οποία η Ιερουσαλήμ ήταν κατεστραμμένη από τους Ρωμαίους ως συνέπεια των ιουδαϊκών εξεγέρσεων, στους Ιουδαίους δεν επιτρεπόταν να ζουν σε αυτήν και οι χριστιανοί υφίσταντο σκληρούς διωγμούς. Ο Ιουστίνος μιλά για την αποκατάσταση της Ιερουσαλήμ και για τη βασιλεία των χριστιανών σε αυτήν, αλλά αναφέρει επίσης ότι υπάρχουν χριστιανοί που κατανοούν διαφορετικά τα λόγια περί της χιλιετούς βασιλείας:</p><blockquote><p>ἀληθῶς ὑμεῖς ἀνοικοδομηθῆναι τὸν τόπον Ἰερουσαλὴμ τοῦτον ὁμολογεῖτε, καὶ συναχθήσεσθαι τὸν λαὸν ὑμῶν καὶ εὐφρανθῆναι σὺν τῷ Χριστῷ, ἅμα τοῖς πατριάρχαις καὶ τοῖς προφήταις καὶ τοῖς ἀπὸ τοῦ ἡμετέρου γένους ἢ καὶ τῶν προσηλύτων γενομένων πρὶν ἐλθεῖν ὑμῶν τὸν Χριστόν, προσδοκᾶτε, ἤ, ἵνα δόξῃς περικρατεῖν ἡμῶν ἐν ταῖς ζητήσεσι, πρὸς τὸ ταῦτα ὁμολογεῖν ἐχώρησας;</p><p>Κἀγὼ εἶπον· Οὐχ οὕτω τάλας ἐγώ, ὦ Τρύφων, ὡς ἕτερα λέγειν παρ' ἃ φρονῶ. <strong>ὡμολόγησα οὖν σοι καὶ πρότερον ὅτι ἐγὼ μὲν καὶ ἄλλοι πολλοὶ ταῦτα φρονοῦμεν, ὡς καὶ πάντως ἐπίστασθε τοῦτο γενησόμενον· πολλοὺς δ' αὖ καὶ τῶν τῆς καθαρᾶς καὶ εὐσεβοῦς ὄντων Χριστιανῶν γνώμης τοῦτο μὴ γνωρίζειν ἐσήμανά σοι</strong>. τοὺς γὰρ λεγομένους μὲν Χριστιανούς, ὄντας δὲ ἀθέους καὶ ἀσεβεῖς αἱρεσιώτας, ὅτι κατὰ πάντα βλάσφημα καὶ ἄθεα καὶ ἀνόητα διδάσκουσιν, ἐδήλωσά σοι.</p><p>&lt;…&gt;</p><p>εἰ γὰρ καὶ συνεβάλετε ὑμεῖς τισι λεγομένοις Χριστιανοῖς, καὶ τοῦτο μὴ ὁμολογοῦσιν, ἀλλὰ καὶ βλασφημεῖν τολμῶσι τὸν θεὸν Ἀβραὰμ καὶ τὸν θεὸν Ἰσαὰκ καὶ τὸν θεὸν Ἰακώβ, οἳ καὶ λέγουσι <strong>μὴ εἶναι νεκρῶν ἀνάστασιν</strong>, ἀλλὰ ἅμα τῷ ἀποθνήσκειν τὰς ψυχὰς αὐτῶν ἀναλαμβάνεσθαι εἰς τὸν οὐρανόν, μὴ ὑπολάβητε αὐτοὺς Χριστιανούς, ὥσπερ οὐδὲ Ἰουδαίους, ἄν τις ὀρθῶς ἐξετάσῃ, ὁμολογήσειεν εἶναι τοὺς Σαδδουκαίους ἢ τὰς ὁμοίας αἱρέσεις</p><p>&lt;…&gt;</p><p><strong>ἐγὼ δέ, καὶ εἴ τινές εἰσιν ὀρθογνώμονες κατὰ πάντα Χριστιανοί, καὶ σαρκὸς ἀνάστασιν γενήσεσθαι ἐπιστάμεθα</strong> καὶ χίλια ἔτη ἐν Ἰερουσαλὴμ οἰκοδομηθείσῃ καὶ κοσμηθείσῃ καὶ πλατυνθείσῃ, ὡς οἱ προφῆται Ἰεζεκιὴλ καὶ Ἠσαίας καὶ οἱ ἄλλοι ὁμολογοῦσιν.</p><p>&lt;…&gt;</p><p>τὸ οὖν εἰρημένον ἐν τοῖς λόγοις τούτοις, ἔφην· Κατὰ γὰρ τὰς ἡμέρας τοῦ ξύλου αἱ ἡμέραι τοῦ λαοῦ μου ἔσονται, τὰ ἔργα τῶν πόνων αὐτῶν &lt;παλαιώσουσι>, νενοήκαμεν ὅτι χίλια ἔτη ἐν μυστηρίῳ μηνύει. ὡς γὰρ τῷ Ἀδὰμ εἴρητο, ὅτι ᾗ δ' ἂν ἡμέρᾳ φάγῃ ἀπὸ τοῦ ξύλου, ἐν ἐκείνῃ ἀποθανεῖται, ἔγνωμεν αὐτὸν μὴ ἀναπληρώσαντα χίλια ἔτη. συνήκαμεν καὶ τὸ εἰρημένον, ὅτι Ἡμέρα κυρίου ὡς χίλια ἔτη, εἰς τοῦτο συνάγειν. καὶ ἔπειτα καὶ παρ' ἡμῖν ἀνήρ τις, ᾧ ὄνομα Ἰωάννης, εἷς τῶν ἀποστόλων τοῦ Χριστοῦ, ἐν ἀποκαλύψει γενομένῃ αὐτῷ <strong>χίλια ἔτη ποιήσειν ἐν Ἰερουσαλὴμ τοὺς τῷ ἡμετέρῳ Χριστῷ πιστεύσαντας</strong> προεφήτευσε, καὶ <strong><mark>μετὰ ταῦτα</mark></strong> τὴν <strong><mark>καθολικὴν</mark></strong> καί, <strong>συνελόντι φάναι</strong>, <strong><mark>αἰωνίαν ὁμοθυμαδὸν ἅμα πάντων ἀνάστασιν</mark></strong> <strong>γενήσεσθαι</strong> <strong>καὶ <strong><mark>κρίσιν</mark></strong></strong>. ὅπερ καὶ ὁ κύριος ἡμῶν εἶπεν, ὅτι Οὔτε γαμήσουσιν οὔτε γαμηθήσονται, ἀλλὰ ἰσάγγελοι ἔσονται, τέκνα τοῦ θεοῦ τῆς ἀναστάσεως ὄντες.</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%BF_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82-%CE%94%CE%B9%CE%AC%CE%BB%CE%BF%CE%B3%CE%BF_%CF%80%CF%81%CE%BF%CF%82_%CE%A4%CF%81%CF%8D%CF%86%CF%89%CE%BD%CE%B1#HH-80">Διάλογος πρὸς Τρύφωνα</a>)</p><p><strong><mark>Σημαντικό!</mark> </strong>Πρέπει να έχουμε υπόψη ότι οι άγιοι πατέρες του 1ου αιώνα, μεταξύ των οποίων και εκείνοι που διδάχτηκαν από τον απόστολο Ιωάννη τον Θεολόγο (τον συγγραφέα της Αποκάλυψης), δεν μίλησαν για χιλιετή βασιλεία των χριστιανών στην Ιερουσαλήμ. Υπάρχει μαρτυρία, την οποία συγγραφέας του 2ου αιώνα αποδίδει στα εγγόνια του αποστόλου που έζησαν τον 1ο αιώνα (<a href="https://bibleox.com/grc/en/w/Millennium-against-Chiliasm">αποσπάσματα (en)</a>), ότι η βασιλεία του Χριστού δεν θα είναι στη γη αλλά στον ουρανό. Από τον 3ο περίπου αιώνα η Εκκλησία μαρτυρεί σαφώς ότι τα λόγια περί της χιλιετούς βασιλείας από το βιβλίο της Αποκάλυψης πρέπει να κατανοούνται αλληγορικά, όπως και το μεγαλύτερο μέρος του υπόλοιπου βιβλίου της Αποκάλυψης, στο οποίο παρουσιάζεται το όραμα του αποστόλου Ιωάννη. Αυτή η χιλιετής περίοδος είναι όλος ο χρόνος από την πρώτη έως τη δεύτερη παρουσία του Κυρίου Ιησού Χριστού. Αποσπάσματα: <a href="https://bibleox.com/grc/en/w/Millennium-against-Chiliasm">https://bibleox.com/grc/en/w/Millennium-against-Chiliasm</a></p><p>Ο Ιουστίνος αναφέρει επίσης ότι οι χριστιανοί περιμένουν συγκεκριμένα τη δεύτερη παρουσία του Χριστού (και όχι χιλιετή βασιλεία), ότι αυτή η παρουσία μπορεί να γίνει οποιαδήποτε στιγμή, ότι απομένει μόνο μία παρουσία του Χριστού, ότι οι χριστιανοί περιμένουν αιώνια (και όχι χιλιετή) βασιλεία που δεν μοιάζει με τις ανθρώπινες βασιλείες, ότι ο ίδιος ο Χριστός βασιλεύει ήδη στον ουρανό και ότι κατά τη δεύτερη παρουσία του Χριστού πρόκειται να γίνουν όλα τα υπόλοιπα γεγονότα: μία γενική ανάσταση όλων των ανθρώπων, μία γενική κρίση, η τιμωρία των αμαρτωλών, η ανταμοιβή των δικαίων και η μετάβαση όλων αυτών στην αιώνια κατάσταση.</p><p>Ιδιαίτερα, πρέπει να πούμε κάτι για το απόσπασμα αυτό:</p><blockquote><p>εἰ γὰρ καὶ συνεβάλετε ὑμεῖς τισι λεγομένοις Χριστιανοῖς, καὶ τοῦτο μὴ ὁμολογοῦσιν, ἀλλὰ καὶ βλασφημεῖν τολμῶσι τὸν θεὸν Ἀβραὰμ καὶ τὸν θεὸν Ἰσαὰκ καὶ τὸν θεὸν Ἰακώβ, οἳ καὶ λέγουσι <strong>μὴ εἶναι νεκρῶν ἀνάστασιν, ἀλλὰ ἅμα τῷ ἀποθνήσκειν τὰς ψυχὰς αὐτῶν ἀναλαμβάνεσθαι εἰς τὸν οὐρανόν, μὴ ὑπολάβητε αὐτοὺς Χριστιανούς</strong>, ὥσπερ οὐδὲ Ἰουδαίους, ἄν τις ὀρθῶς ἐξετάσῃ, ὁμολογήσειεν εἶναι τοὺς Σαδδουκαίους ἢ τὰς ὁμοίας αἱρέσεις</p></blockquote><p>Ο Ιουστίνος ήταν φιλόσοφος. Εδώ ελέγχει τις γνωστικές διδασκαλίες της εποχής του, που δανείζονται και επεξεργάζονται πλατωνικές ιδέες. Σε μερικές από αυτές τις διδασκαλίες το σώμα είναι φυλακή για τον νου, συνέπεια της αποστασίας από τον Θεό. Στο τέλος αναμένεται η επιστροφή όλων αυτών των νοών στην αρχική τους κατάσταση, ως αόρατων νοών που παραμένουν με τον Θεό. Ακριβώς αυτή την αρχαία φιλοσοφική διδασκαλία καταδικάζει εδώ ο φιλόσοφος Ιουστίνος. <a href="https://bibleox.com/grc/ru/w/%D0%98%D1%83%D1%81%D1%82%D0%B8%D0%BD_%D1%84%D0%B8%D0%BB%D0%BE%D1%81%D0%BE%D1%84-%D0%B2%D0%B5%D1%80%D0%B0_%D0%B2_%D0%BF%D0%BE%D1%81%D0%BC%D0%B5%D1%80%D1%82%D0%BD%D1%83%D1%8E_%D1%83%D1%87%D0%B0%D1%81%D1%82%D1%8C_%D1%81_%D0%91%D0%BE%D0%B3%D0%BE%D0%BC">Λεπτομερής ανάλυση και αποδείξεις (ru)</a>.</p><p>Ότι οι ψυχές των δικαίων μετά τον θάνατο πηγαίνουν στον Πατέρα και στον ουράνιο Βασιλιά (στον Χριστό, που βασιλεύει στον ουρανό), το ομολογεί ρητά σε άλλο σημείο:</p><blockquote><p>καὶ ὃς οὐδὲν ἄλλο ἀποκρινάμενος καὶ πρὸς τὸν Λούκιον ἔφη· Δοκεῖς μοι καὶ σὺ εἶναι τοιοῦτος. καὶ Λουκίου φήσαντος· Μάλιστα, πάλιν καὶ αὐτὸν ἀπαχθῆναι ἐκέλευσεν. <strong>ὁ δὲ καὶ χάριν εἰδέναι ὡμολόγει, πονηρῶν δεσποτῶν τῶν τοιούτων ἀπηλλάχθαι γινώσκων καὶ</strong> <strong><mark>πρὸς τὸν πατέρα καὶ βασιλέα τῶν οὐρανῶν πορεύεσθαι</mark></strong>.</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82_%E1%BC%88%CF%80%CE%BF%CE%BB%CE%BF%CE%B3%CE%AF%CE%B1_2#HH-2">Ἀπολογία 2</a>)</p><blockquote><p>Ἀλλὰ μὴν <strong>οὐδὲ ἀποθνήσκειν φημὶ πάσας τὰς ψυχὰς ἐγώ</strong>· ἕρμαιον γὰρ ἦν ὡς ἀληθῶς τοῖς κακοῖς. ἀλλὰ τί; <strong><mark>τὰς μὲν τῶν εὐσεβῶν ἐν κρείττονί ποι χώρῳ μένειν, τὰς δὲ ἀδίκους καὶ πονηρὰς ἐν χείρονι</mark></strong>, τὸν τῆς κρίσεως ἐκδεχομένας χρόνον τότε. οὕτως αἱ μέν, <strong><mark>ἄξιαι τοῦ θεοῦ φανεῖσαι</mark></strong>, οὐκ ἀποθνήσκουσιν ἔτι· αἱ δὲ κολάζονται, ἔστ' ἂν αὐτὰς καὶ εἶναι καὶ κολάζεσθαι ὁ θεὸς θέλῃ.</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%BF_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82-%CE%94%CE%B9%CE%AC%CE%BB%CE%BF%CE%B3%CE%BF_%CF%80%CF%81%CE%BF%CF%82_%CE%A4%CF%81%CF%8D%CF%86%CF%89%CE%BD%CE%B1#HH-5">Διάλογος πρὸς Τρύφωνα</a>)</p><h3>Μία γενική ανάσταση και μία γενική κρίση</h3><blockquote><p>ἃ ῥυπαρὰ καὶ αὐτὰ ἐνδύματα, περιτεθέντα ὑφ' ὑμῶν πᾶσι τοῖς ἀπὸ τοῦ ὀνόματος τοῦ Ἰησοῦ γενομένοις Χριστιανοῖς, δείξει αἰρόμενα ἀφ' ἡμῶν ὁ θεός, <strong><mark>ὅταν πάντας ἀναστήσῃ</mark></strong>, καὶ τοὺς μὲν <strong>ἐν αἰωνίῳ καὶ ἀλύτῳ βασιλείᾳ</strong> <strong>ἀφθάρτους καὶ ἀθανάτους καὶ ἀλύπους καταστήσῃ</strong>, <strong>τοὺς δὲ εἰς κόλασιν αἰώνιον πυρὸς παραπέμψῃ</strong>.</p><p>&lt;…&gt;</p><p>εἰ δὲ <strong>ἐν τῇ ἀτίμῳ καὶ ἀειδεῖ καὶ ἐξουθενημένῃ πρώτῃ παρουσίᾳ αὐτοῦ</strong> τοσοῦτον ἔλαμψε καὶ ἴσχυσεν, ὡς ἐν μηδενὶ γένει ἀγνοεῖσθαι αὐτὸν καὶ ἀπὸ παντὸς μετάνοιαν πεποιῆσθαι ἀπὸ τῆς παλαιᾶς κακῆς ἑκάστου γένους πολιτείας, ὥστε καὶ τὰ δαιμόνια ὑποτάσσεσθαι αὐτοῦ τῷ ὀνόματι καὶ πάσας τὰς ἀρχὰς καὶ τὰς βασιλείας τούτου τὸ ὄνομα παρὰ πάντας τοὺς ἀποθανόντας δεδοικέναι, οὐκ ἐκ παντὸς τρόπου <strong><mark>ἐν τῇ ἐνδόξῳ αὐτοῦ παρουσίᾳ καταλύσει πάντας τοὺς μισήσαντας αὐτὸν καὶ τοὺς αὐτοῦ ἀδίκως ἀποστάντας, τοὺς δὲ ἰδίους ἀναπαύσει, ἀποδιδοὺς αὐτοῖς τὰ προσδοκώμενα πάντα</mark></strong>;</p><p>&lt;…&gt;</p><p>ἐπειδή γε ἐκεῖνος ὁ ἐμὸς κύριος, ὡς ἰσχυρὸς καὶ δυνατός, <strong><mark>τὰ ἴδια παρὰ πάντων ἀπαιτήσει ἐλθών</mark></strong>, καὶ τὸν οἰκονόμον τὸν ἑαυτοῦ οὐ καταδικάσει, εἰ γνωρίζοι αὐτόν, διὰ τὸ ἐπίστασθαι ὅτι δυνατός ἐστιν ὁ κύριος αὐτοῦ καὶ <strong>ἐλθὼν ἀπαιτήσει τὰ ἴδια</strong>, ἐπὶ πᾶσαν τράπεζαν διδόντα, ἀλλ' οὐ δι' αἰτίαν οἱανδηποτοῦν κατορύξαντα.</p><p>&lt;…&gt;</p><p>ἤδη καὶ παραγενόμενον καὶ γεννηθέντα καὶ παθόντα καὶ ἀναβάντα εἰς τὸν οὐρανόν· ὃς καὶ <strong>πάλιν παρέσται, καὶ τότε κόψονται ὑμῶν αἱ δώδεκα φυλαί</strong>.</p><p>&lt;…&gt;</p><p>πρὸς τὸ καὶ ἐξ αὐτῆς συνιέναι ὑμᾶς τὸν Ἰησοῦν, ὃν καὶ ἡμεῖς ἐπέγνωμεν Χριστὸν υἱὸν θεοῦ, σταυρωθέντα καὶ ἀναστάντα καὶ ἀνεληλυθότα εἰς τοὺς οὐρανοὺς καὶ <strong><mark>πάλιν παραγενησόμενον κριτὴν πάντων ἁπλῶς ἀνθρώπων μέχρις αὐτοῦ Ἀδάμ</mark></strong>.</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%BF_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82-%CE%94%CE%B9%CE%AC%CE%BB%CE%BF%CE%B3%CE%BF_%CF%80%CF%81%CE%BF%CF%82_%CE%A4%CF%81%CF%8D%CF%86%CF%89%CE%BD%CE%B1#HH-117">Διάλογος πρὸς Τρύφωνα</a>)</p><h3>Στην ανάσταση οι άνθρωποι εγείρονται υγιείς</h3><blockquote><p>κἄν τις, ἐν λώβῃ τινὶ σώματος ὑπάρχων, φύλαξ τῶν παραδεδομένων ὑπ' αὐτοῦ διδαγμάτων ὑπάρξῃ, ὁλόκληρον αὐτὸν ἐν τῇ δευτέρᾳ αὐτοῦ παρουσίᾳ μετὰ τοῦ καὶ ἀθάνατον καὶ ἄφθαρτον καὶ ἀλύπητον ποιῆσαι ἀναστήσει.</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%BF_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82-%CE%94%CE%B9%CE%AC%CE%BB%CE%BF%CE%B3%CE%BF_%CF%80%CF%81%CE%BF%CF%82_%CE%A4%CF%81%CF%8D%CF%86%CF%89%CE%BD%CE%B1#HH-69">Διάλογος πρὸς Τρύφωνα</a>)</p><h3>Η ανάσταση στα ίδια τους τα σώματα</h3><blockquote><p>οἷς κἂν ὁμοίως ἡμᾶς ἀποδέξασθε, οὐχ ἧττον ἐκείνων θεῷ πιστεύοντας ἀλλὰ μᾶλλον, οἳ καὶ <strong><mark>τὰ νεκρούμενα καὶ εἰς γῆν βαλλόμενα πάλιν ἀπολήψεσθαι ἑαυτῶν σώματα προσδοκῶμεν</mark></strong>, ἀδύνατον μηδὲν εἶναι θεῷ λέγοντες.</p><p>...</p><p><strong><mark>διαλυθέντα καὶ δίκην σπερμάτων εἰς γῆν διαχυθέντα τὰ ἀνθρώπεια σώματα κατὰ καιρὸν προστάξει θεοῦ ἀναστῆναι καὶ ἀφθαρσίαν ἐνδύσασθαι</mark></strong> οὐκ ἀδύνατον.</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82_%E1%BC%88%CF%80%CE%BF%CE%BB%CE%BF%CE%B3%CE%AF%CE%B1_1#HH-18">Ἀπολογία 1</a>)</p><h2>Διάφορα ζητήματα</h2><h3>Ποιοι μπορούν να σωθούν και ποιοι δεν μπορούν</h3><h4>Η σωτηρία και όσοι τηρούν τον νόμο του Μωυσή</h4><p>Κατά τη γνώμη του αγίου Ιουστίνου, μπορούν να σωθούν και εκείνοι οι χριστιανοί που, από αδυναμία της συνειδήσεως, φοβούνται να εγκαταλείψουν την τήρηση του νόμου του Μωυσή. Ο Ιουστίνος θεωρεί ότι ένας τέτοιος θα μπορούσε να σωθεί, αρκεί μόνο να μη χωρίζεται από τους άλλους χριστιανούς (που δεν ιουδαΐζουν), να μη διδάσκει κανέναν και να μην εξαναγκάζει κανέναν να ιουδαΐζει:</p><blockquote><p><strong><mark>Ὡς μὲν ἐμοὶ δοκεῖ</mark></strong>, ὦ Τρύφων, λέγω ὅτι <strong>σωθήσεται ὁ τοιοῦτος, ἐὰν μὴ τοὺς ἄλλους ἀνθρώπους, λέγω δὴ τοὺς ἀπὸ τῶν ἐθνῶν διὰ τοῦ Χριστοῦ ἀπὸ τῆς πλάνης περιτμηθέντας, ἐκ παντὸς πείθειν ἀγωνίζηται ταὐτὰ αὐτῷ φυλάσσειν, λέγων οὐ σωθήσεσθαι αὐτοὺς ἐὰν μὴ ταῦτα φυλάξωσιν</strong>, ὁποῖον ἐν ἀρχῇ τῶν λόγων καὶ σὺ ἔπραττες, ἀποφαινόμενος οὐ σωθήσεσθαί με ἐὰν μὴ ταῦτα φυλάξω.</p><p><strong><mark>Διὰ τί οὖν εἶπας· Ὡς μὲν ἐμοὶ δοκεῖ, σωθήσεται ὁ τοιοῦτος</mark></strong>, <strong>εἰ μήτι εἰσὶν οἱ λέγοντες ὅτι οὐ σωθήσονται οἱ τοιοῦτοι;</strong></p><p><strong><mark>Εἰσίν</mark></strong>, ἀπεκρινάμην, ὦ Τρύφων, καὶ <strong>μηδὲ κοινωνεῖν ὁμιλίας ἢ ἑστίας τοῖς τοιούτοις τολμῶντες</strong>· οἷς ἐγὼ οὐ σύναινός εἰμι. ἀλλ' <strong>ἐὰν αὐτοὶ διὰ τὸ ἀσθενὲς τῆς γνώμης καὶ τὰ ὅσα δύνανται νῦν ἐκ τῶν Μωυσέως, ἃ διὰ τὸ σκληροκάρδιον τοῦ λαοῦ νοοῦμεν διατετάχθαι, μετὰ τοῦ ἐπὶ τοῦτον τὸν Χριστὸν ἐλπίζειν καὶ τὰς αἰωνίους καὶ φύσει δικαιοπραξίας καὶ εὐσεβείας φυλάσσειν βούλωνται καὶ αἱρῶνται συζῆν τοῖς Χριστιανοῖς καὶ πιστοῖς, ὡς προεῖπον, μὴ πείθοντες αὐτοὺς μήτε περιτέμνεσθαι ὁμοίως αὐτοῖς μήτε σαββατίζειν μήτε ἄλλα ὅσα τοιαῦτά ἐστι τηρεῖν, καὶ προσλαμβάνεσθαι καὶ κοινωνεῖν ἁπάντων, ὡς ὁμοςπλάγχνοις καὶ ἀδελφοῖς, δεῖν ἀποφαίνομαι</strong>. <strong><mark>ἐὰν δὲ</mark></strong> οἱ ἀπὸ τοῦ γένους τοῦ ὑμετέρου <strong><mark>πιστεύειν λέγοντες ἐπὶ τοῦτον τὸν Χριστόν, ὦ Τρύφων, ἔλεγον, ἐκ παντὸς κατὰ τὸν διὰ Μωυσέως διαταχθέντα νόμον ἀναγκάζουσι ζῆν τοὺς ἐξ ἐθνῶν πιστεύοντας ἐπὶ τοῦτον τὸν Χριστὸν</mark></strong><strong> ἢ </strong><strong><mark>μὴ κοινωνεῖν αὐτοῖς τῆς τοιαύτης συνδιαγωγῆς αἱροῦνται, ὁμοίως καὶ τούτους οὐκ ἀποδέχομαι</mark></strong>. τοὺς δὲ πειθομένους αὐτοῖς ἐπὶ τὴν ἔννομον πολιτείαν μετὰ τοῦ φυλάσσειν τὴν εἰς τὸν Χριστὸν τοῦ θεοῦ ὁμολογίαν καὶ σωθήσεσθαι ἴσως ὑπολαμβάνω. <strong>τοὺς δὲ ὁμολογήσαντας καὶ ἐπιγνόντας τοῦτον εἶναι τὸν Χριστὸν καὶ ᾑτινιοῦν αἰτίᾳ μεταβάντας ἐπὶ τὴν ἔννομον πολιτείαν</strong>, <strong><mark>ἀρνησαμένους ὅτι οὗτός ἐστιν ὁ Χριστός, καὶ πρὶν τελευτῆς μὴ μεταγνόντας</mark></strong>, <strong>οὐδ' ὅλως</strong> <strong><mark>σωθήσεσθαι ἀποφαίνομαι</mark></strong>. καὶ <strong>τοὺς ἀπὸ τοῦ σπέρματος τοῦ Ἀβραὰμ</strong> <strong><mark>ζῶντας κατὰ τὸν νόμον καὶ ἐπὶ τοῦτον τὸν Χριστὸν μὴ πιστεύοντας πρὶν τελευτῆς τοῦ βίου</mark></strong> <strong><mark>οὐ σωθήσεσθαι ὁμοίως ἀποφαίνομαι</mark></strong>, καὶ μάλιστα τοὺς ἐν ταῖς συναγωγαῖς καταθεματίσαντας καὶ καταθεματίζοντας τοὺς ἐπ' αὐτὸν τοῦτον τὸν Χριστὸν πιστεύοντας ὅπως τύχωσι τῆς σωτηρίας καὶ τῆς τιμωρίας τῆς ἐν τῷ πυρὶ ἀπαλλαγῶσιν. ἡ γὰρ χρηστότης καὶ ἡ φιλανθρωπία τοῦ θεοῦ καὶ τὸ ἄμετρον τοῦ πλούτου αὐτοῦ τὸν μετανοοῦντα ἀπὸ τῶν ἁμαρτημάτων, ὡς δι' Ἰεζεκιὴλ μηνύει, ὡς δίκαιον καὶ ἀναμάρτητον ἔχει· καὶ τὸν ἀπὸ εὐσεβείας ἢ δικαιοπραξίας μετατιθέμενον ἐπὶ ἀδικίαν καὶ ἀθεότητα ὡς ἁμαρτωλὸν καὶ ἄδικον καὶ ἀσεβῆ ἐπίσταται. διὸ καὶ ὁ ἡμέτερος κύριος Ἰησοῦς Χριστὸς εἶπεν· Ἐν οἷς ἂν ὑμᾶς καταλάβω, ἐν τούτοις καὶ κρινῶ.</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%BF_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82-%CE%94%CE%B9%CE%AC%CE%BB%CE%BF%CE%B3%CE%BF_%CF%80%CF%81%CE%BF%CF%82_%CE%A4%CF%81%CF%8D%CF%86%CF%89%CE%BD%CE%B1#HH-47">Διάλογος πρὸς Τρύφωνα</a>)</p><h4>Πώς θα σωθούν οι δίκαιοι της Παλαιάς Διαθήκης</h4><blockquote><p>Εἰπὲ οὖν μοι, ἔφη· Οἱ ζήσαντες κατὰ τὸν νόμον τὸν διαταχθέντα διὰ Μωυσέως ζήσονται ὁμοίως τῷ Ἰακὼβ καὶ τῷ Ἑνὼχ καὶ τῷ Νῶε ἐν τῇ τῶν νεκρῶν ἀναστάσει ἢ οὔ;</p><p>Εἰπόντος μου, ὦ ἄνθρωπε, τὰ λελεγμένα ὑπὸ τοῦ Ἰεζεκιήλ, ὅτι Κἂν Νῶε καὶ Δανιὴλ καὶ Ἰακὼβ ἐξαιτήσωνται υἱοὺς καὶ θυγατέρας, οὐ δοθήσεται αὐτοῖς, ἀλλ' ἕκαστος <strong>τῇ αὐτοῦ δικαιοσύνῃ</strong> δῆλον ὅτι σωθήσεται, ὅτι καὶ <strong>τοὺς κατὰ τὸν νόμον τὸν Μωυσέως πολιτευσαμένους ὁμοίως σωθήσεσθαι</strong> εἶπον. καὶ γὰρ ἐν τῷ Μωυσέως νόμῳ <strong>τὰ φύσει καλὰ καὶ εὐσεβῆ καὶ δίκαια νενομοθέτηται πράττειν τοὺς πειθομένους αὐτοῖς, καὶ πρὸς σκληροκαρδίαν δὲ τοῦ λαοῦ διαταχθέντα γίνεσθαι ὁμοίως ἀναγέγραπται</strong>, <strong><mark>ἃ καὶ ἔπραττον οἱ ὑπὸ τὸν νόμον</mark></strong>. ἐπεὶ οἳ τὰ καθόλου καὶ φύσει καὶ αἰώνια καλὰ ἐποίουν εὐάρεστοί εἰσι τῷ θεῷ, <strong>καὶ διὰ τοῦ Χριστοῦ τούτου ἐν τῇ ἀναστάσει ὁμοίως τοῖς προγενομένοις αὐτῶν δικαίοις, Νῶε καὶ Ἑνὼχ καὶ Ἰακὼβ καὶ εἴ τινες ἄλλοι γεγόνασι, σωθήσονται</strong> σὺν τοῖς ἐπιγνοῦσι τὸν Χριστὸν τοῦτον τοῦ θεοῦ υἱόν</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%BF_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82-%CE%94%CE%B9%CE%AC%CE%BB%CE%BF%CE%B3%CE%BF_%CF%80%CF%81%CE%BF%CF%82_%CE%A4%CF%81%CF%8D%CF%86%CF%89%CE%BD%CE%B1#HH-45">Διάλογος πρὸς Τρύφωνα</a>)</p><h3>Ελευθερία και ειμαρμένη</h3><blockquote><p>τὰς τιμωρίας καὶ τὰς κολάσεις καὶ τὰς ἀγαθὰς ἀμοιβὰς κατ’ ἀξίαν τῶν πράξεων ἑκάστου ἀποδίδοσθαι διὰ τῶν προφητῶν μαθόντες καὶ ἀληθὲς ἀποφαινόμεθα· ἐπεὶ <strong><mark>εἰ μὴ τοῦτό ἐστιν, ἀλλὰ καθ’ εἱμαρμένην πάντα γίνεται, οὔτε τὸ ἐφ’ ἡμῖν ἐστιν ὅλως</mark></strong>· <strong>εἰ γὰρ εἵμαρται τόνδε τινὰ ἀγαθὸν εἶναι καὶ τόνδε φαῦλον, οὔθ’ οὗτος ἀπόδεκτος οὐδὲ ἐκεῖνος μεμπτέος</strong>. καὶ αὖ εἰ μὴ προαιρέσει ἐλευθέρᾳ πρὸς τὸ φεύγειν τὰ αἰσχρὰ καὶ αἱρεῖσθαι τὰ καλὰ δύναμιν ἔχει τὸ ἀνθρώπειον γένος, ἀναίτιόν ἐστι τῶν ὁπωσδήποτε πραττομένων. ἀλλ’ ὅτι ἐλευθέρᾳ προαιρέσει καὶ κατορθοῖ καὶ σφάλλεται, οὕτως ἀποδείκνυμεν. τὸν αὐτὸν ἄνθρωπον τῶν ἐναντίων τὴν μετέλευσιν ποιούμενον ὁρῶμεν. <strong><mark>εἰ δὲ εἵμαρτο ἢ φαῦλον ἢ σπουδαῖον εἶναι, οὐκ ἄν ποτε τῶν ἐναντίων δεκτικὸς ἦν καὶ πλειστάκις μετετίθετο</mark></strong>· ἀλλ’ οὐδ’ οἱ μὲν ἦσαν σπουδαῖοι, οἱ δὲ φαῦλοι, <strong>ἐπεὶ τὴν εἱμαρμένην αἰτίαν φαύλων καὶ ἐναντία ἑαυτῇ πράττουσαν ἀποφαινοίμεθα</strong>, ἢ ἐκεῖνο τὸ προειρημένον δόξαι ἀληθὲς εἶναι, ὅτι οὐδέν ἐστιν ἀρετὴ οὐδὲ κακία, ἀλλὰ δόξῃ μόνον ἢ ἀγαθὰ ἢ κακὰ νομίζεται· ἥπερ, ὡς δείκνυσιν ὁ ἀληθὴς λόγος, μεγίστη ἀσέβεια καὶ ἀδικία ἐστίν. ἀλλ’ <strong><mark>εἱμαρμένην φαμὲν ἀπαράβατον ταύτην εἶναι, τοῖς τὰ καλὰ ἐκλεγομένοις τὰ ἄξια ἐπιτίμια, καὶ τοῖς ὁμοίως τὰ ἐναντία τὰ ἄξια ἐπίχειρα</mark></strong>.</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82_%E1%BC%88%CF%80%CE%BF%CE%BB%CE%BF%CE%B3%CE%AF%CE%B1_1#HH-43">Ἀπολογία 1</a>)</p><blockquote><p>οὐδὲ καθ’ εἱμαρμένην πράττειν τοὺς ἀνθρώπους ἢ πάσχειν τὰ γινόμενα, ἀλλὰ <strong><mark>κατὰ μὲν τὴν προαίρεσιν ἕκαστον κατορθοῦν ἢ ἁμαρτάνειν</mark></strong>, καὶ κατὰ τὴν τῶν φαύλων δαιμόνων ἐνέργειαν τοὺς σπουδαίους, οἷον Σωκράτην καὶ τοὺς ὁμοίους, διώκεσθαι καὶ ἐν δεσμοῖς εἶναι, Σαρδανάπαλον δὲ καὶ Ἐπίκουρον καὶ τοὺς ὁμοίους ἐν ἀφθονίᾳ καὶ δόξῃ δοκεῖν εὐδαιμονεῖν. ὃ μὴ νοήσαντες οἱ Στωϊκοὶ καθ’ εἱμαρμένης ἀνάγκην πάντα γίνεσθαι ἀπεφήναντο. ἀλλ’ ὅτι αὐτεξούσιον τό τε τῶν ἀγγέλων γένος καὶ τῶν ἀνθρώπων τὴν ἀρχὴν ἐποίησεν ὁ θεός, δικαίως ὑπὲρ ὧν ἂν πλημμελήσωσι τὴν τιμωρίαν ἐν αἰωνίῳ πυρὶ κομίσονται. γεννητοῦ δὲ παντὸς ἥδε ἡ φύσις, κακίας καὶ ἀρετῆς δεκτικὸν εἶναι· οὐ γὰρ ἂν ἦν ἐπαινετὸν οὐδὲν αὐτῶν, εἰ οὐκ ἦν ἐπ’ ἀμφότερα τρέπεσθαι καὶ δύναμιν εἶχε.</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82_%E1%BC%88%CF%80%CE%BF%CE%BB%CE%BF%CE%B3%CE%AF%CE%B1_2#HH-7">Ἀπολογία 2</a>)</p><h3>Προτιμούσε τη μετάφραση των Εβδομήκοντα</h3><blockquote><p><strong>μὴ πείθεσθαι τοῖς διδασκάλοις ὑμῶν, οἵτινες τολμῶσι λέγειν τὴν ἐξήγησιν, ἣν ἐξηγήσαντο οἱ ἑβδομήκοντα ὑμῶν πρεσβύτεροι παρὰ Πτολεμαίῳ τῷ τῶν Αἰγυπτίων βασιλεῖ γενόμενοι, μὴ εἶναι ἔν τισιν ἀληθῆ; ἃ γὰρ ἂν διαρρήδην ἐν ταῖς γραφαῖς φαίνονται ἐλέγχοντα αὐτῶν τὴν ἀνόητον καὶ φίλαυτον γνώμην, ταῦτα τολμῶσι λέγειν μὴ οὕτω γεγράφθαι· ἃ δὲ ἂν καὶ ἕλκειν πρὸς ἃ νομίζουσι δύνασθαι ἁρμόζειν πράξεις ἀνθρωπείους, ταῦτα οὐκ εἰς τοῦτον τὸν ἡμέτερον Ἰησοῦν Χριστὸν εἰρῆσθαι λέγουσιν, ἀλλ' εἰς ὃν αὐτοὶ ἐξηγεῖσθαι ἐπιχειροῦσιν.</strong></p><p>&lt;…&gt;</p><p>Ἀλλ' <strong>οὐχὶ τοῖς διδασκάλοις ὑμῶν πείθομαι, μὴ συντεθειμένοις καλῶς ἐξηγεῖσθαι τὰ ὑπὸ τῶν παρὰ Πτολεμαίῳ τῷ Αἰγυπτίων γενομένῳ βασιλεῖ ἑβδομήκοντα πρεσβυτέρων</strong>, ἀλλ' αὐτοὶ ἐξηγεῖσθαι πειρῶνται. καὶ ὅτι <strong>πολλὰς γραφὰς τέλεον περιεῖλον ἀπὸ τῶν ἐξηγήσεων τῶν γεγενημένων ὑπὸ τῶν παρὰ Πτολεμαίῳ γεγενημένων πρεσβυτέρων, ἐξ ὧν διαρρήδην οὗτος αὐτὸς ὁ σταυρωθεὶς ὅτι θεὸς καὶ ἄνθρωπος καὶ σταυρούμενος καὶ ἀποθνήσκων κεκηρυγμένος ἀποδείκνυται</strong>, εἰδέναι ὑμᾶς βούλομαι· ἅς, ἐπειδὴ ἀρνεῖσθαι πάντας τοὺς ἀπὸ τοῦ γένους ὑμῶν ἐπίσταμαι, ταῖς τοιαύταις ζητήσεσιν οὐ προςβάλλω, ἀλλ' ἐπὶ τὰς ἐκ τῶν ὁμολογουμένων ἔτι παρ' ὑμῖν τὰς ζητήσεις ποιεῖν ἔρχομαι</p><p>&lt;…&gt;</p><p>ὑμεῖς δὲ καὶ ἐν τούτοις <strong>παραγράφειν τὰς ἐξηγήσεις, ἃς ἐξηγήσαντο οἱ πρεσβύτεροι ὑμῶν παρὰ Πτολεμαίῳ τῷ τῶν Αἰγυπτίων βασιλεῖ γενομένῳ, τολμᾶτε</strong>, λέγοντες μὴ ἔχειν τὴν γραφὴν ὡς ἐκεῖνοι ἐξηγήσαντο, ἀλλ' Ἰδού, φησίν, ἡ νεᾶνις ἐν γαστρὶ ἕξει, ὡς μεγάλων πραγμάτων σημαινομένων, εἰ γυνὴ ἀπὸ συνουσίας τίκτειν ἔμελλεν</p><p>&lt;…&gt;</p><p>ὑμεῖς ἐξηγεῖσθε λέγοντες εἰρῆσθαι· Ἕως ἂν ἔλθῃ τὰ ἀποκείμενα αὐτῷ· ἐπειδὴ <strong>οὐχ οὕτως ἐξηγήσαντο οἱ ἑβδομήκοντα</strong></p><p>&lt;…&gt;</p><p><strong>ἐν δὲ τῇ τῶν ἑβδομήκοντα ἐξηγήσει</strong> εἴρηται· Ἰδοὺ δὴ ὡς ἄνθρωποι ἀποθνήσκετε, καὶ ὡς εἷς τῶν ἀρχόντων πίπτετε· ἵνα</p><p>&lt;…&gt;</p><p>Καὶ εἰπὼν ταῦτα ἐπήνεγκα λέγων ὅτι <strong>οἱ ἑβδομήκοντα ἐξηγήσαντο</strong>, ὅτι Ἔστησεν ὅρια ἐθνῶν κατὰ ἀριθμὸν ἀγγέλων θεοῦ.</p><p>&lt;…&gt;</p><p>Ἐγώ, ὦ φίλοι, καὶ τὰς γραφὰς <strong>λέγω</strong> νῦν <strong>ὡς ἐξηγήσαντο οἱ ἑβδομήκοντα</strong>· εἰπὼν γὰρ αὐτὰς πρότερον ὡς ὑμεῖς αὐτὰς ἔχετε, πεῖραν ὑμῶν ἐποιούμην πῶς διάκεισθε ἤδη τὴν γνώμην.</p><p>&lt;…&gt;</p><p><strong>ὡς ἐξηγήσαντο οἱ ἑβδομήκοντα ἐπήνεγκα</strong>· Ἄρωμεν τὸν δίκαιον, ὅτι δύσχρηστος ἡμῖν ἐστιν· ἐμοῦ ἐν ἀρχῇ τῆς ὁμιλίας καὶ εἰπόντος ὅπερ ὑμεῖς εἰρῆσθαι βούλεσθε, εἰπόντες· Δήσωμεν τὸν δίκαιον, ὅτι δύσχρηστος ἡμῖν ἐστιν.</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%BF_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82-%CE%94%CE%B9%CE%AC%CE%BB%CE%BF%CE%B3%CE%BF_%CF%80%CF%81%CE%BF%CF%82_%CE%A4%CF%81%CF%8D%CF%86%CF%89%CE%BD%CE%B1#HH-68">Διάλογος πρὸς Τρύφωνα</a>)</p><h4>Η ιστορία των Εβδομήκοντα</h4><blockquote><p>ὅτε δὲ Πτολεμαῖος, ὁ Αἰγυπτίων βασιλεύς, βιβλιοθήκην κατεσκεύαζε καὶ τὰ πάντων ἀνθρώπων συγγράμματα συνάγειν ἐπειράθη, πυθόμενος καὶ περὶ τῶν προφητειῶν τούτων, προσέπεμψε τῷ τῶν Ἰουδαίων τότε βασιλεύοντι Ἡρώδῃ ἀξιῶν διαπεμφθῆναι αὐτῷ τὰς βίβλους τῶν προφητειῶν. καὶ ὁ μὲν βασιλεὺς Ἡρώδης τῇ προειρημένῃ Ἑβραΐδι αὐτῶν φωνῇ γεγραμμένας διεπέμψατο. ἐπειδὴ δὲ οὐκ ἦν γνώριμα τὰ ἐν αὐταῖς γεγραμμένα τοῖς Αἰγυπτίοις, πάλιν αὐτὸν ἠξίωσε πέμψας τοὺς μεταβαλοῦντας αὐτὰς εἰς τὴν Ἑλλάδα φωνὴν ἀνθρώπους ἀποστεῖλαι. καὶ τούτου γενομένου ἔμειναν αἱ βίβλοι καὶ παρ’ Αἰγυπτίοις μέχρι τοῦ δεῦρο, καὶ πανταχοῦ παρὰ πᾶσίν εἰσιν Ἰουδαίοις</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82_%E1%BC%88%CF%80%CE%BF%CE%BB%CE%BF%CE%B3%CE%AF%CE%B1_1#HH-31">Ἀπολογία 1</a>)</p><h3>Ονόμαζε το Ευαγγέλιο απομνημονεύματα των αποστόλων και γραφή των αποστόλων</h3><blockquote><p>καὶ <strong>υἱὸν θεοῦ γεγραμμένον αὐτὸν ἐν τοῖς ἀπομνημονεύμασι τῶν ἀποστόλων αὐτοῦ</strong> ἔχοντες καὶ υἱὸν αὐτὸν λέγοντες νενοήκαμεν ὄντα καὶ πρὸ πάντων ποιημάτων ἀπὸ τοῦ πατρὸς δυνάμει αὐτοῦ καὶ βουλῇ προελθόντα</p><p>&lt;…&gt;</p><p>σιγήσαντος αὐτοῦ καὶ μηκέτι ἐπὶ Πιλάτου ἀποκρίνασθαι μηδὲν μηδενὶ βουλομένου, ὡς <strong>ἐν τοῖς ἀπομνημονεύμασι τῶν ἀποστόλων αὐτοῦ</strong> δεδήλωται, ὅπως καὶ τὸ διὰ Ἠσαίου εἰρημένον καρπὸν ἐνεργῆ ἔχῃ</p><p>&lt;…&gt;</p><p>τῆς φωνῆς αὐτῷ λεχθείσης· Υἱός μου εἶ σύ, ἐγὼ σήμερον γεγέννηκά σε· <strong>ἐν τοῖς ἀπομνημονεύμασι τῶν ἀποστόλων</strong> γέγραπται προσελθὼν αὐτῷ καὶ πειράζων</p><p>&lt;…&gt;</p><p>ἐν γὰρ τοῖς <strong>ἀπομνημονεύμασιν</strong>, ἅ φημι <strong>ὑπὸ τῶν ἀποστόλων αὐτοῦ</strong> καὶ τῶν ἐκείνοις παρακολουθησάντων συντετάχθαι, γέγραπται ὅτι ἱδρὼς ὡσεὶ θρόμβοι κατεχεῖτο</p><p>&lt;…&gt;</p><p>συνήχθησαν οἱ ἀγωνιζόμενοι ἐπὶ τῷ καταδικάσασθαι αὐτόν· ὅπερ καὶ <strong>ἐν τοῖς ἀπομνημονεύμασι τῶν ἀποστόλων αὐτοῦ</strong> γέγραπται γενόμενον</p><p>&lt;…&gt;</p><p>μονογενὴς γὰρ ὅτι ἦν τῷ πατρὶ τῶν ὅλων οὗτος, ἰδίως ἐξ αὐτοῦ λόγος καὶ δύναμις γεγεννημένος, καὶ ὕστερον ἄνθρωπος διὰ τῆς παρθένου γενόμενος, ὡς ἀπὸ <strong>τῶν ἀπομνημονευμάτων</strong> ἐμάθομεν</p><p>&lt;…&gt;</p><p>Πάτερ, εἰς χεῖράς σου παρατίθεμαι τὸ πνεῦμά μου, ὡς καὶ ἐκ <strong>τῶν ἀπομνημονευμάτων</strong> καὶ τοῦτο ἔμαθον</p><p>&lt;…&gt;</p><p>πρὸς τὸ ὑπερβάλλειν τὴν Φαρισαίων πολιτείαν τοὺς μαθητὰς αὐτοῦ συνωθῶν, εἰ δὲ μή γε, ἐπίστασθαι ὅτι οὐ σωθήσονται, ταῦτα εἰρηκέναι ἐν τοῖς <strong>ἀπομνημονεύμασι</strong> γέγραπται</p><p>&lt;…&gt;</p><p>καὶ μετ' αὐτῶν διάγων ὕμνησε τὸν θεόν, ὡς καὶ <strong>ἐν τοῖς ἀπομνημονεύμασι τῶν ἀποστόλων</strong> δηλοῦται γεγενημένον</p><p>&lt;…&gt;</p><p>μετωνομακέναι αὐτὸν Πέτρον ἕνα τῶν ἀποστόλων, καὶ γεγράφθαι ἐν τοῖς <strong>ἀπομνημονεύμασιν</strong> αὐτοῦ γεγενημένον</p><p>&lt;…&gt;</p><p>τῇ τρίτῃ ἡμέρᾳ ἔμελλεν ἀναστήσεσθαι μετὰ τὸ σταυρωθῆναι, γέγραπται ἐν τοῖς <strong>ἀπομνημονεύμασιν</strong></p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%BF_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82-%CE%94%CE%B9%CE%AC%CE%BB%CE%BF%CE%B3%CE%BF_%CF%80%CF%81%CE%BF%CF%82_%CE%A4%CF%81%CF%8D%CF%86%CF%89%CE%BD%CE%B1#HH-100">Διάλογος πρὸς Τρύφωνα</a>)</p><h3>Δεχόταν το βιβλίο της Αποκάλυψης</h3><blockquote><p>καὶ ἔπειτα καὶ παρ' ἡμῖν ἀνήρ τις, ᾧ ὄνομα <strong>Ἰωάννης, εἷς τῶν ἀποστόλων τοῦ Χριστοῦ, ἐν ἀποκαλύψει γενομένῃ αὐτῷ</strong> χίλια ἔτη ποιήσειν ἐν Ἰερουσαλὴμ τοὺς τῷ ἡμετέρῳ Χριστῷ πιστεύσαντας προεφήτευσε, καὶ μετὰ ταῦτα τὴν καθολικὴν καί, συνελόντι φάναι, αἰωνίαν ὁμοθυμαδὸν ἅμα πάντων ἀνάστασιν γενήσεσθαι καὶ κρίσιν. ὅπερ καὶ ὁ κύριος ἡμῶν εἶπεν, ὅτι Οὔτε γαμήσουσιν οὔτε γαμηθήσονται, ἀλλὰ ἰσάγγελοι ἔσονται, τέκνα τοῦ θεοῦ τῆς ἀναστάσεως ὄντες.</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%BF_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82-%CE%94%CE%B9%CE%AC%CE%BB%CE%BF%CE%B3%CE%BF_%CF%80%CF%81%CE%BF%CF%82_%CE%A4%CF%81%CF%8D%CF%86%CF%89%CE%BD%CE%B1#HH-81">Διάλογος πρὸς Τρύφωνα</a>)</p><h3>Οι αιρετικοί</h3><blockquote><p>ὅπερ οὐχ ὑπομένουσι πρᾶξαι οἱ ἀπὸ τῶν ἐθνῶν διὰ Ἰησοῦ τοῦ σταυρωθέντος ἐπιγνόντες τὸν ποιητὴν τῶν ὅλων θεόν, ἀλλὰ πᾶσαν αἰκίαν καὶ τιμωρίαν μέχρις ἐσχάτου θανάτου ὑπομένουσι περὶ τοῦ μήτε εἰδωλολατρῆσαι μήτε εἰδωλόθυτα φαγεῖν.</p><p>Καὶ μὴν <strong>πολλοὺς τῶν τὸν Ἰησοῦν λεγόντων ὁμολογεῖν καὶ λεγομένων Χριστιανῶν πυνθάνομαι ἐσθίειν τὰ εἰδωλόθυτα καὶ μηδὲν ἐκ τούτου βλάπτεσθαι λέγειν</strong>.</p><p>Καὶ <mark><strong>ἐκ τοῦ τοιούτους εἶναι ἄνδρας, ὁμολογοῦντας ἑαυτοὺς εἶναι Χριστιανοὺς καὶ τὸν σταυρωθέντα Ἰησοῦν ὁμολογεῖν καὶ κύριον καὶ Χριστόν, καὶ μὴ τὰ ἐκείνου διδάγματα διδάσκοντας ἀλλὰ τὰ ἀπὸ τῶν τῆς πλάνης πνευμάτων</strong></mark>, ἡμεῖς, οἱ τῆς ἀληθινῆς Ἰησοῦ Χριστοῦ καὶ καθαρᾶς διδασκαλίας μαθηταί, πιστότεροι καὶ βεβαιότεροι γινόμεθα ἐν τῇ ἐλπίδι τῇ κατηγγελμένῃ ὑπ' αὐτοῦ.</p><p>&lt;…&gt;</p><p><mark><strong>εἰσὶν οὖν καὶ ἐγένοντο, ὦ φίλοι ἄνδρες, πολλοὶ οἳ ἄθεα καὶ βλάσφημα λέγειν καὶ πράττειν ἐδίδαξαν, ἐν ὀνόματι τοῦ Ἰησοῦ προσελθόντες· καὶ &lt;καλούμενοί> εἰσιν ὑφ' ἡμῶν ἀπὸ τῆς προσωνυμίας τῶν ἀνδρῶν, ἐξ οὗπερ ἑκάστη διδαχὴ καὶ γνώμη ἤρξατο</strong></mark>. ἄλλοι γὰρ κατ' ἄλλον τρόπον βλασφημεῖν τὸν ποιητὴν τῶν ὅλων καὶ τὸν ὑπ' αὐτοῦ προφητευόμενον ἐλεύσεσθαι Χριστὸν καὶ τὸν θεὸν Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ διδάσκουσιν· <mark><strong>ὧν οὐδενὶ κοινωνοῦμεν, οἱ γνωρίζοντες ἀθέους καὶ ἀσεβεῖς καὶ ἀδίκους καὶ ἀνόμους αὐτοὺς ὑπάρχοντας, καὶ ἀντὶ τοῦ τὸν Ἰησοῦν σέβειν ὀνόματι μόνον ὁμολογεῖν</strong></mark>. καὶ <strong>Χριστιανοὺς ἑαυτοὺς λέγουσιν, ὃν τρόπον οἱ ἐν τοῖς ἔθνεσι τὸ ὄνομα τοῦ θεοῦ ἐπιγράφουσι τοῖς χειροποιήτοις, καὶ ἀνόμοις καὶ ἀθέοις τελεταῖς κοινωνοῦσι</strong>. καί εἰσιν αὐτῶν οἱ μέν τινες καλούμενοι <strong>Μαρκιανοί</strong>, οἱ δὲ <strong>Οὐαλεντινιανοί</strong>, οἱ δὲ <strong>Βασιλειδιανοί</strong>, οἱ δὲ <strong>Σατορνιλιανοί</strong>, καὶ <strong>ἄλλοι ἄλλῳ ὀνόματι,</strong> <mark><strong>ἀπὸ τοῦ ἀρχηγέτου τῆς γνώμης ἕκαστος ὀνομαζόμενος</strong></mark>, ὃν τρόπον καὶ ἕκαστος τῶν φιλοσοφεῖν νομιζόντων, ὡς ἐν ἀρχῇ προεῖπον, ἀπὸ τοῦ πατρὸς τοῦ λόγου τὸ ὄνομα ἧς φιλοσοφεῖ φιλοσοφίας ἡγεῖται φέρειν.</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%BF_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82-%CE%94%CE%B9%CE%AC%CE%BB%CE%BF%CE%B3%CE%BF_%CF%80%CF%81%CE%BF%CF%82_%CE%A4%CF%81%CF%8D%CF%86%CF%89%CE%BD%CE%B1#HH-34">Διάλογος πρὸς Τρύφωνα</a>)</p><blockquote><p>ὃν τρόπον οἱ ἐν Ἕλλησι τὰ αὐτοῖς ἀρεστὰ δογματίσαντες ἐκ παντὸς τῷ ἑνὶ ὀνόματι φιλοσοφίας προσαγορεύονται, καίπερ τῶν δογμάτων ἐναντίων ὄντων, οὕτως καὶ τῶν ἐν βαρβάροις γενομένων καὶ <mark><strong>δοξάντων</strong></mark> <strong>σοφῶν</strong> τὸ ἐπικατηγορούμενον ὄνομα κοινόν ἐστι· <strong>Χριστιανοὶ γὰρ πάντες προσαγορεύονται</strong>.</p><p>&lt;…&gt;</p><p><mark><strong>οἳ δ’ ἂν μὴ εὑρίσκωνται βιοῦντες, ὡς ἐδίδαξε, γνωριζέσθωσαν μὴ ὄντες Χριστιανοί, κἂν λέγωσιν διὰ γλώττης τὰ τοῦ Χριστοῦ διδάγματα</strong></mark>· οὐ γὰρ τοὺς <strong>μόνον λέγοντας, ἀλλὰ τοὺς καὶ τὰ ἔργα πράττοντας σωθήσεσθαι</strong> ἔφη. εἶπε γὰρ οὕτως· <strong>Οὐχὶ πᾶς ὁ λέγων μοι Κύριε κύριε</strong> εἰσελεύσεται εἰς τὴν βασιλείαν τῶν οὐρανῶν, ἀλλ’ ὁ ποιῶν τὸ θέλημα τοῦ πατρός μου τοῦ ἐν τοῖς οὐρανοῖς. ὃς γὰρ ἀκούει μου καὶ ποιεῖ ἃ λέγω ἀκούει τοῦ ἀποστείλαντός με. <strong>πολλοὶ δὲ ἐροῦσί μοι· Κύριε κύριε</strong>, οὐ τῷ σῷ ὀνόματι ἐφάγομεν καὶ ἐπίομεν καὶ δυνάμεις ἐποιήσαμεν; καὶ τότε ἐρῶ αὐτοῖς· Ἀποχωρεῖτε ἀπ’ ἐμοῦ, ἐργάται τῆς ἀνομίας. τότε κλαυθμὸς ἔσται καὶ βρυγμὸς τῶν ὀδόντων, ὅταν οἱ μὲν δίκαιοι λάμψωσιν ὡς ὁ ἥλιος, οἱ δὲ ἄδικοι πέμπωνται εἰς τὸ αἰώνιον πῦρ. πολλοὶ γὰρ ἥξουσιν ἐπὶ τῷ ὀνόματί μου, ἔξωθεν μὲν ἐνδεδυμένοι δέρματα προβάτων, ἔσωθεν δὲ ὄντες λύκοι ἅρπαγες· <mark><strong>ἐκ τῶν ἔργων αὐτῶν ἐπιγνώσεσθε αὐτούς</strong></mark>. πᾶν δὲ δένδρον, μὴ ποιοῦν καρπὸν καλόν, ἐκκόπτεται καὶ εἰς πῦρ βάλλεται. κολάζεσθαι δὲ <strong>τοὺς οὐκ ἀκολούθως τοῖς διδάγμασιν αὐτοῦ βιοῦντας, λεγομένους δὲ μόνον Χριστιανούς</strong>, καὶ ὑφ’ ὑμῶν ἀξιοῦμεν.</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82_%E1%BC%88%CF%80%CE%BF%CE%BB%CE%BF%CE%B3%CE%AF%CE%B1_1#HH-7">Ἀπολογία 1</a>)</p><h3>Ο μοναχισμός</h3><blockquote><p><mark><strong>πολλοί τινες καὶ πολλαὶ ἑξηκοντοῦται καὶ ἑβδομηκοντοῦται, οἳ ἐκ παίδων ἐμαθητεύθησαν τῷ Χριστῷ, ἄφθοροι διαμένουσι</strong></mark>· καὶ εὔχομαι κατὰ πᾶν γένος ἀνθρώπων τοιούτους δεῖξαι.</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82_%E1%BC%88%CF%80%CE%BF%CE%BB%CE%BF%CE%B3%CE%AF%CE%B1_1#HH-15">Ἀπολογία 1</a>)</p><h3>Οι ψευδοπροφήτες μπορούν να κάνουν θαύματα</h3><blockquote><p>ὅπερ οἱ ἀπὸ τοῦ πλάνου καὶ ἀκαθάρτου πνεύματος ἐμπιπλάμενοι ψευδοπροφῆται οὔτε ἐποίησαν οὔτε ποιοῦσιν, ἀλλὰ <strong>δυνάμεις τινὰς ἐνεργεῖν εἰς κατάπληξιν τῶν ἀνθρώπων τολμῶσι καὶ τὰ τῆς πλάνης πνεύματα καὶ δαιμόνια δοξολογοῦσιν</strong>.</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%BF_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82-%CE%94%CE%B9%CE%AC%CE%BB%CE%BF%CE%B3%CE%BF_%CF%80%CF%81%CE%BF%CF%82_%CE%A4%CF%81%CF%8D%CF%86%CF%89%CE%BD%CE%B1#HH-7">Διάλογος πρὸς Τρύφωνα</a>)</p><h3>Κατηγορεί τους ειδωλολάτρες που θεωρούσαν τα αντικείμενα θεούς</h3><blockquote><p>οὐδὲ θυσίαις πολλαῖς καὶ πλοκαῖς ἀνθῶν τιμῶμεν <strong>οὓς ἄνθρωποι μορφώσαντες καὶ ἐν ναοῖς ἱδρύσαντες θεοὺς προσωνόμασαν</strong>, ἐπεὶ <strong>ἄψυχα καὶ νεκρὰ ταῦτα γινώσκομεν καὶ θεοῦ μορφὴν μὴ ἔχοντα (</strong><mark><strong>οὐ γὰρ τοιαύτην ἡγούμεθα τὸν θεὸν ἔχειν τὴν μορφήν, ἥν φασί τινες εἰς τιμὴν μεμιμῆσθαι)</strong></mark>, ἀλλ’ <mark><strong>ἐκείνων τῶν φανέντων κακῶν δαιμόνων καὶ ὀνόματα καὶ σχήματα ἔχειν</strong></mark>. τί γὰρ δεῖ εἰδόσιν ὑμῖν λέγειν, ἃ τὴν ὕλην οἱ τεχνῖται διατιθέασι ξέοντες καὶ τέμνοντες καὶ χωνεύοντες καὶ τύπτοντες; καὶ ἐξ ἀτίμων πολλάκις σκευῶν διὰ τέχνης τὸ σχῆμα μόνον ἀλλάξαντες καὶ μορφοποιήσαντες <strong>θεοὺς ἐπονομάζουσιν</strong>.</p><p>&lt;…&gt;</p><p><strong>ἀνθρώπους ἀκολάστους θεοὺς εἰς τὸ προσκυνεῖσθαι πλάσσειν λέγεσθαι καὶ μεταποιεῖν</strong>, καὶ τῶν ἱερῶν, ἔνθα <strong>ἀνατίθενται</strong>, φύλακας τοιούτους καθιστάναι, μὴ συνορῶντας ἀθέμιτον καὶ τὸ νοεῖν ἢ λέγειν <strong>ἀνθρώπους θεῶν εἶναι φύλακας</strong>.</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82_%E1%BC%88%CF%80%CE%BF%CE%BB%CE%BF%CE%B3%CE%AF%CE%B1_1#HH-9">Ἀπολογία 1</a>)</p><h3>Κατηγορεί τους ειδωλολάτρες ότι το είδωλο δεν έχει ομοιότητα με τον Θεό</h3><blockquote><p>οὐδὲ θυσίαις πολλαῖς καὶ πλοκαῖς ἀνθῶν τιμῶμεν οὓς ἄνθρωποι μορφώσαντες καὶ ἐν ναοῖς ἱδρύσαντες <strong>θεοὺς προσωνόμασαν, ἐπεὶ ἄψυχα καὶ νεκρὰ ταῦτα γινώσκομεν καὶ</strong> <mark><strong>θεοῦ μορφὴν μὴ ἔχοντα (οὐ γὰρ τοιαύτην ἡγούμεθα τὸν θεὸν ἔχειν τὴν μορφήν, ἥν φασί τινες εἰς τιμὴν μεμιμῆσθαι)</strong></mark>, ἀλλ’ ἐκείνων τῶν φανέντων κακῶν <strong>δαιμόνων</strong> καὶ <mark><strong>ὀνόματα</strong></mark> <strong>καὶ <mark><strong>σχήματα</strong></mark></strong> <strong>ἔχειν</strong>. τί γὰρ δεῖ εἰδόσιν ὑμῖν λέγειν, ἃ τὴν ὕλην οἱ τεχνῖται διατιθέασι ξέοντες καὶ τέμνοντες καὶ χωνεύοντες καὶ τύπτοντες; καὶ ἐξ ἀτίμων πολλάκις σκευῶν διὰ τέχνης <strong>τὸ σχῆμα μόνον ἀλλάξαντες</strong> καὶ μορφοποιήσαντες θεοὺς ἐπονομάζουσιν. ὅπερ οὐ μόνον ἄλογον ἡγούμεθα, ἀλλὰ καὶ ἐφ’ ὕβρει τοῦ θεοῦ γίνεσθαι, ὃς ἄρρητον δόξαν καὶ μορφὴν ἔχων ἐπὶ φθαρτοῖς καὶ δεομένοις θεραπείας πράγμασιν ἐπονομάζεται.</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82_%E1%BC%88%CF%80%CE%BF%CE%BB%CE%BF%CE%B3%CE%AF%CE%B1_1#HH-9">Ἀπολογία 1</a>)</p><h3>Η νηστεία</h3><blockquote><p>ὅσοι ἂν πεισθῶσι καὶ πιστεύωσιν ἀληθῆ ταῦτα τὰ ὑφ’ ἡμῶν διδασκόμενα καὶ λεγόμενα εἶναι, καὶ βιοῦν οὕτως δύνασθαι ὑπισχνῶνται, <strong>εὔχεσθαί τε καὶ</strong> <strong>αἰτεῖν <mark><strong>νηστεύοντες</strong></mark> παρὰ τοῦ θεοῦ τῶν προημαρτημένων ἄφεσιν διδάσκονται, ἡμῶν συνευχομένων καὶ</strong> <mark><strong>συννηστευόντων</strong></mark> <strong>αὐτοῖς</strong>.</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82_%E1%BC%88%CF%80%CE%BF%CE%BB%CE%BF%CE%B3%CE%AF%CE%B1_1#HH-61">Ἀπολογία 1</a>)</p><h3>Υπακούει στους νόμους του κράτους</h3><blockquote><p><strong>Φόρους δὲ καὶ εἰσφορὰς τοῖς ὑφ’ ὑμῶν τεταγμένοις πανταχοῦ πρὸ πάντων πειρώμεθα φέρειν, ὡς ἐδιδάχθημεν παρ’ αὐτοῦ</strong>. κατ’ ἐκεῖνο γὰρ τοῦ καιροῦ προσελθόντες τινὲς ἠρώτων αὐτόν, εἰ δεῖ Καίσαρι φόρους τελεῖν. καὶ ἀπεκρίνατο· Εἴπατέ μοι, τίνος εἰκόνα τὸ νόμισμα ἔχει; οἱ δὲ ἔφασαν· Καίσαρος. καὶ πάλιν ἀνταπεκρίνατο αὐτοῖς· Ἀπόδοτε οὖν τὰ Καίσαρος τῷ Καίσαρι καὶ τὰ τοῦ θεοῦ τῷ θεῷ.</p><p>ὅθεν θεὸν μὲν μόνον προσκυνοῦμεν, ὑμῖν δὲ πρὸς τὰ ἄλλα χαίροντες ὑπηρετοῦμεν, βασιλεῖς καὶ ἄρχοντας ἀνθρώπων ὁμολογοῦντες καὶ εὐχόμενοι μετὰ τῆς βασιλικῆς δυνάμεως καὶ σώφρονα τὸν λογισμὸν ἔχοντας ὑμᾶς εὑρεθῆναι.</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82_%E1%BC%88%CF%80%CE%BF%CE%BB%CE%BF%CE%B3%CE%AF%CE%B1_1#HH-17">Ἀπολογία 1</a>)</p><h2>Μαρτυρίες αρχαίων συγγραφέων και αγίων πατέρων για τον Ιουστίνο</h2><h3><a href="https://bibleox.com/grc/ru/w/%CF%84%CE%B5%CF%81%CF%84%CF%85%CE%BB%CE%BB%CE%B9%CE%B1%CE%BD">Τερτυλλιανός (ru)</a> (~155-220)</h3><blockquote><p>Δεν νομίζω ότι μπορεί να μας κατηγορήσει κανείς για αυθαίρετη επινόηση των ζητημάτων που εξέθεσαν και αντέκρουσαν <strong>άνδρες άγιοι και φωτισμένοι</strong>, όχι μόνο οι προγενέστεροι αλλά και οι σύγχρονοι των αιρεσιαρχών, δηλαδή: <strong>ο Ιουστίνος, φιλόσοφος και μάρτυς</strong>, ο Μιλτιάδης, ο υπέρμαχος των εκκλησιών, ο Ειρηναίος, ο πολυμαθής ερευνητής όλων των παρόμοιων διδασκαλιών, ο δικός μας Πρόκλος, παρθένος ως τα βαθιά γεράματα, τιμή και δόξα της χριστιανικής ευγλωττίας. Είθε ο Θεός να μου δώσει να τους φτάσω τόσο στους άλλους αγώνες της πίστεως όσο και στο έργο που έχω μπροστά μου.</p></blockquote><p>(<a href="https://azbyka.ru/otechnik/Tertullian/protiv-valentinian/">Κατὰ Οὐαλεντινιανῶν, Ε΄</a>)</p><h3>Μεθόδιος Ολύμπου, ιερομάρτυς (~260-312)</h3><p>Ονομάζει τον Ιουστίνο άνδρα που δεν απέχει πολύ από τους αποστόλους ως προς την αρετή:</p><blockquote><p>Ο Ιουστίνος ο Νεαπολίτης, άνδρας <strong>που δεν απέχει πολύ από τους αποστόλους</strong> και ως προς τους χρόνους και ως προς <strong>την αρετή</strong>, λέει ότι κληρονομείται το θνητό, ενώ κληρονομεί η ζωή, και ότι πεθαίνει η σάρκα, ενώ ζει η βασιλεία των ουρανών.</p></blockquote><p>(<a href="https://azbyka.ru/otechnik/Mefodij_Olimpijskij/O_Voskresenii_protiv_Origena/">Περὶ ἀναστάσεως, κατὰ Ὠριγένους</a>)</p><h3>Επιφάνιος Κύπρου, ιεράρχης (~315-403)</h3><p>Ονομάζει τον μάρτυρα Ιουστίνο τον Φιλόσοφο άγιο και φίλο του Θεού:</p><blockquote><p>13. Τατιανοί. Ο Τατιανός ήταν συνομήλικος του <strong>αγίου μάρτυρος και φιλοσόφου Ιουστίνου</strong>. Μετά δε την τελευτήν του μάρτυρος και φιλοσόφου Ιουστίνου, αφού έγινε μαθητής του Μαρκίωνα, διεφθάρη από τα δόγματά του και δίδασκε τα ίδια με εκείνον, προσθέτοντας και άλλα πέραν του Μαρκίωνα. Έλεγαν ότι καταγόταν από τη Μεσοποταμία.</p><p>&lt;…&gt;</p><p>Διάδοχός τους εμφανίστηκε κάποιος Τατιανός, είτε ζήσας στους καιρούς εκείνων είτε παρουσιάσας ύστερα από εκείνους τη ματαιολόγο διδασκαλία του. Στην αρχή, ως καταγόμενος από Έλληνες και έχων ελληνική παιδεία, ήταν συνομήλικος του <strong>Ιουστίνου του Φιλοσόφου, ανδρός αγίου και φίλου του Θεού</strong>, ο οποίος από τους Σαμαρείτες πίστεψε στον Χριστό. Διότι ο Ιουστίνος αυτός ήταν Σαμαρείτης στην καταγωγή, πίστεψε στον Χριστό, <strong>επιτέλεσε μεγάλους άθλους, έδειξε ενάρετη ζωή και τέλος, δεχθείς το μαρτύριο για τον Χριστό</strong> από τους Ρωμαίους επί του ηγεμόνος Ρουστίκου και του αυτοκράτορος Αδριανού, <strong>αξιώθηκε του τελείου στεφάνου</strong> σε ακμή της ηλικίας, δηλαδή τριάντα ετών. Όντας σύγχρονός του, ο προαναφερθείς Τατιανός είχε στην αρχή ορθή πορεία και υγιή πίστη, όσο βρισκόταν μαζί με τον <strong>άγιο μάρτυρα Ιουστίνο</strong>. Όταν δε ο άγιος Ιουστίνος εκοιμήθη, συνέβη στον Τατιανό ό,τι συμβαίνει με τον τυφλό, ο οποίος, αν τον εγκαταλείψει ο οδηγός που τον οδηγούσε, τότε, όταν φτάσει σε γκρεμό, από την τύφλωσή του πέφτει ασυγκράτητα ώσπου να σκοτωθεί, &lt;…&gt; μετά την κοίμηση του αγίου Ιουστίνου, στις ανατολικές χώρες, αναχώρησε για τις ανατολικές χώρες, και κατά τη διαμονή του εκεί έπεσε σε κακές γνώμες και άρχισε, σύμφωνα με τους μύθους του Ουαλεντίνου, να εισάγει κάποιους αιώνες και κάποιες αρχές και ουράνια γεννήματα.</p></blockquote><p>(<a href="https://azbyka.ru/otechnik/Epifanij_Kiprskij/na-vosemdesjaty-eresej-panarij-ili-kovcheg">Κατὰ αἱρέσεων</a>)</p><h3>Ιερώνυμος Στριδώνος, όσιος (~347-419)</h3><p>Τοποθετεί τα έργα του Ιουστίνου του Φιλοσόφου στο ίδιο επίπεδο με τα έργα του Ιγνατίου του Θεοφόρου, του Πολυκάρπου Σμύρνης και του Ειρηναίου Λουγδούνου, αφήνοντας στο πλάι τον Τερτυλλιανό:</p><blockquote><p>Επειδή όμως ο λόγος μας ξέφυγε πια από τους υποθαλάσσιους βράχους και τους επικίνδυνους τόπους, πρέπει να ανοίξουμε τα πανιά και να σπεύσουμε στον επίλογό του, όπου, νομίζοντας τον εαυτό του ειδήμονα, καλεί ως μάρτυρα τον <strong>Τερτυλλιανό</strong> και παραθέτει τα λόγια του Βικτωρίνου, επισκόπου Πεταβίου. Για τον Τερτυλλιανό δεν λέω τίποτε άλλο παρά ότι <strong>δεν ήταν άνθρωπος της Εκκλησίας</strong>. Για τον Βικτωρίνο δε λέω ό,τι και για τους ευαγγελιστές, ότι δηλαδή μίλησαν για τους αδελφούς του Κυρίου και όχι για τους γιους της Μαρίας, και για αδελφούς με την έννοια που εκθέσαμε πιο πάνω, αδελφούς κατά τη συγγένεια και όχι κατά τη φύση. Αλλά φλυαρούμε για μικροπράγματα και, αφήνοντας την πηγή της αληθείας, κυνηγάμε τα ρυάκια των γνωμών. Δεν μπορώ να σου αντιτάξω <strong>όλη τη σειρά των αρχαίων συγγραφέων: τον Ιγνάτιο, τον Πολύκαρπο, τον Ειρηναίο, τον Ιουστίνο τον Μάρτυρα και πολλούς άλλους αποστολικούς και σοφούς άνδρες</strong>, που εναντίον του Εβίωνα, του Θεοδότου του Βυζαντίου και του Ουαλεντίνου, πραγματευόμενοι το ίδιο θέμα με τον ίδιο τρόπο, <strong>έγραψαν βιβλία γεμάτα σοφία; Αν τα είχες διαβάσει ποτέ, θα ήσουν σοφότερος</strong>. Νομίζω όμως καλύτερο να απαντήσω σύντομα σε κάθε σημείο παρά να μακρηγορήσω και να επεκτείνω το έργο.</p></blockquote><p>(<a href="https://azbyka.ru/otechnik/Ieronim_Stridonskij/o-prisnodevstve-blazhennoj-marii/">Περὶ τῆς ἀειπαρθενίας τῆς ἁγίας Μαρίας</a>)</p><blockquote><p><strong>Ο Ιουστίνος</strong>, φιλόσοφος από τη Νεάπολη, πόλη της Παλαιστίνης, γιος του Πρίσκου Βακχίου, <strong>εργάστηκε με ζήλο για χάρη της διδασκαλίας του Χριστού</strong>. &lt;…&gt; Στο τέλος, ο Ιουστίνος, κατηγορηθείς ότι ήταν χριστιανός, με τις ενέργειες του Κρήσκεντος <strong>έχυσε το αίμα του για τον Χριστό</strong>.</p></blockquote><p>(<a href="https://azbyka.ru/otechnik/Ieronim_Stridonskij/o_znamenityh/2">Περὶ ἐνδόξων ἀνδρῶν</a>)</p><h3>Θεοδώρητος Κύρρου, μακάριος (386-457)</h3><p>Τοποθετεί τον Ιουστίνο στη χορεία των αγίων και λέει ότι κοσμεί τον χορό των μαρτύρων, τον αποκαλεί μεγαλόφωνο κήρυκα της αλήθειας:</p><blockquote><p>Ποιος από τους <strong>αγίους πατέρες</strong> δεν κήρυξε την ίδια διδασκαλία; &lt;…&gt;</p><p>Και ο διδάσκαλός του Αλέξανδρος αγωνίστηκε για αυτά τα <strong>δόγματα [περί Θεού]</strong>. Τέτοιοι υπήρξαν και ο Ευστάθιος, ο Μελέτιος, ο Φλαβιανός, τα φώτα της Ανατολής, ο Εφραίμ, η λύρα του Αγίου Πνεύματος, που καθημερινά ποτίζει τον συριακό λαό με ρεύματα χάριτος, ο Ιωάννης (ο Χρυσόστομος) και ο Αττικός (ο Κωνσταντινουπόλεως), οι <strong>μεγαλόφωνοι κήρυκες της αληθείας</strong> και αρχαιότεροι αυτών Ιγνάτιος, Πολύκαρπος, Ειρηναίος, <strong>Ιουστίνος</strong> και Ιππόλυτος, από τους οποίους οι περισσότεροι όχι μόνο λάμπουν μεταξύ των αρχιερέων, αλλά και <strong>κοσμούν τον χορό των μαρτύρων</strong>.</p></blockquote><p>(<a href="https://azbyka.ru/otechnik/Feodorit_Kirskij/pisma/1">Ἐπιστολαί</a>)</p>
