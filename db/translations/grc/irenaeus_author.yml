      <h2>Αρχαία κείμενα</h2><p>Το σημαντικό έργο του Ειρηναίου Λουγδούνου «Κατά αιρέσεων» γράφτηκε στα αρχαία ελληνικά και σήμερα έχει κατά μεγάλο μέρος χαθεί. Λείψανα του ελληνικού κειμένου σώζονται εδώ: <a href="https://bibleox.com/grc/grc/w/Az9E_%E1%BC%9C%CE%BB%CE%B5%CE%B3%CF%87%CE%BF%CF%82_%CE%BA%CE%B1%E1%BD%B6_%E1%BC%80%CE%BD%CE%B1%CF%84%CF%81%CE%BF%CF%80%E1%BD%B4_%CF%84%E1%BF%86%CF%82_%CF%88%CE%B5%CF%85%CE%B4%CF%89%CE%BD%CF%8D%CE%BC%CE%BF%CF%85_%CE%B3%CE%BD%CF%8E%CF%83%CE%B5%CF%89%CF%82_%CE%9A%CE%B1%CF%84%E1%BD%B0_%CE%B1%E1%BC%B1%CF%81%CE%AD%CF%83%CE%B5%CF%89%CE%BD__%CE%92%CE%B9%CE%B2%CE%BB%CE%AF%CE%BF%CE%BD_1">«Κατά αιρέσεων»</a></p><p>Στην αρχαιότητα όμως το έργο μεταφράστηκε στα λατινικά. Οι σύγχρονες μεταφράσεις γίνονται συνήθως από το λατινικό κριτικό κείμενο: <a href="https://bibleox.com/grc/la/w/LATIN-Adversus_haereses_LIBER_I">«Κατά αιρέσεων» (στα λατινικά)</a></p><h2>Βιογραφία</h2><p>Ο Ειρηναίος Λουγδούνου (λατ. Irenaeus Lugdunensis)</p><p><strong>Η μνήμη του</strong>: 23 Αυγούστου (5 Σεπτεμβρίου)</p><h3>Η πορεία προς την ποιμαντική διακονία</h3><p>Για τις λεπτομέρειες της ζωής και της ποιμαντικής διακονίας του αγίου Ειρηναίου Λουγδούνου γνωρίζουμε λίγα. Ακόμη και ο τόπος και η ημερομηνία της γέννησης αυτού του μεγάλου αγίου κρύβονται από εμάς πίσω από το πέπλο της ιστορίας. Θεωρείται ότι οι γονείς του Ειρηναίου ήταν χριστιανοί.</p><p>Με μεγάλη βεβαιότητα μπορεί να λεχθεί ότι γεννήθηκε στο δεύτερο τέταρτο του 2ου αιώνα. Με βάση ορισμένα έμμεσα στοιχεία, το γεγονός αυτό χρονολογείται γύρω στο 130.</p><p>Σύμφωνα με τις αναμνήσεις του ίδιου του Ειρηναίου που έφτασαν ως εμάς, στα παιδικά του χρόνια είχε επαφή με τον άγιο Πολύκαρπο Σμύρνης, φίλο του εξαίρετου ποιμένα της Εκκλησίας Ιγνατίου του Θεοφόρου, μαθητή του ευαγγελιστή Ιωάννη του Θεολόγου. Στον κύκλο των γνωστών του Ειρηναίου ανήκαν και άλλοι άνδρες, που υπήρξαν αυτόπτες μάρτυρες του αποστολικού κηρύγματος και των αποστολικών θαυμάτων.</p><p>Η κοινότητα του Πολυκάρπου, στην επιστολή της για το μαρτύριο του Πολυκάρπου, γράφει ότι ο Ειρηναίος υπήρξε μαθητής του:</p><blockquote><p>Ταῦτα μετεγράψατο μὲν Γάϊος ἐκ τῶν <strong>Εἰρηναίου, μαθητοῦ τοῦ Πολυκάρπου</strong>, ὃς καὶ συνεπολιτεύσατο τῷ Εἰρηναίῳ. ἐγὼ δὲ Σωκράτης ἐν Κορίνθῳ ἐκ τῶν Γαΐου ἀντιγράφων ἔγραψα.</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%9C%CE%B1%CF%81%CF%84%CF%8D%CF%81%CE%B9%CE%BF_%CF%84%CE%BF%CF%85_%CE%91%CE%B3%CE%AF%CE%BF%CF%85_%CE%A0%CE%BF%CE%BB%CF%85%CE%BA%CE%AC%CF%81%CF%80%CE%BF%CF%85_%CE%95%CF%80%CE%B9%CF%83%CE%BA%CF%8C%CF%80%CE%BF%CF%85_%CE%A3%CE%BC%CF%8D%CF%81%CE%BD%CE%B7%CF%82#HH-22">Μαρτύριον τοῦ ἁγίου Πολυκάρπου, 22</a>)</p><p>Το ελληνικό όνομα, ο στενός δεσμός με τον επίσκοπο Σμύρνης, η καλή γνώση της ελληνικής λογοτεχνίας, φιλοσοφίας και ποίησης, η εξοικείωση με τις μεθόδους της διαλεκτικής δίνουν αφορμή να σκεφτεί κανείς ότι ο Ειρηναίος ήταν Έλληνας στην καταγωγή (άλλοι πάντως ερευνητές της ζωής και του έργου του δέχονται ότι είχε συριακές ρίζες).</p><p>Κατά πάσα πιθανότητα, ιδιαίτερη πατρίδα του Ειρηναίου είναι η Σμύρνη ή μία από τις γειτονικές της γεωγραφικές περιοχές.</p><p>Η πνευματική ατμόσφαιρα μέσα στην οποία ανατράφηκε ο Ειρηναίος επηρέασε την ανατροφή του με τον πιο ωφέλιμο τρόπο.</p><p>Η Εκκλησία της Σμύρνης, παρά τη φτώχεια της (Αποκ. 2:9), ξεχώριζε για την καλή της οργάνωση. Το κηρυκτικό και ιεραποστολικό έργο διακρινόταν για την αυστηρή συμμόρφωσή του με το πνεύμα του Ευαγγελίου και της αποστολικής Παράδοσης. Ο ζήλος του αγίου Πολυκάρπου Σμύρνης να διαφυλάσσει και να διαδίδει την πίστη αμόλυντη και καθαρή πέρασε με τον καιρό και στον μαθητή του, τον Ειρηναίο.</p><h3>Η ιερατική διακονία στη Γαλατία</h3><p>Σε ποια ηλικία και κάτω από ποιες συγκεκριμένες συνθήκες ο Ειρηναίος εγκατέλειψε τον τόπο της καταγωγής του και έφυγε για τη Γαλατία (την περιοχή της σημερινής Γαλλίας), η ιστορία δεν το λέει. Ένα πάντως είναι βέβαιο: σκοπός του ήταν η διάδοση του κηρύγματος και η ενίσχυση της πίστης στον πληθυσμό εκείνων των τόπων. Θεωρείται ότι για την αποστολή αυτή τον ευλόγησε ο ίδιος ο Πολύκαρπος Σμύρνης. Και αυτό δεν είναι παράξενο. Ανάμεσα στους χριστιανούς της Σμύρνης και της Γαλατίας υπήρχε άλλωστε από παλιά φιλική επικοινωνία.</p><p>Την εποχή εκείνη κεφαλή της Εκκλησίας του Λουγδούνου ήταν ο επίσκοπος Ποθεΐνος. Ο Ειρηναίος, χειροτονημένος πρεσβύτερος, έφερε με ζήλο δίπλα του το βάρος της ποιμαντικής διακονίας, ήταν θερμός αγωνιστής για την καθαρότητα της πίστης και βοηθός του κυβερνώντος αρχιερέα.</p><p>Τα χρόνια της διακονίας του Ειρηναίου συνέπεσαν με την εποχή των σκληρότερων διωγμών της Εκκλησίας, που άλλοτε έσβηναν και άλλοτε φούντωναν με νέα δύναμη. Τους χριστιανούς τους λήστευαν, τους τιμωρούσαν για κατασκευασμένα εγκλήματα, τους στερούσαν την περιουσία, τους χτυπούσαν, τους βασάνιζαν, τους βίαζαν, τους σκότωναν. Στους εξωτερικούς αυτούς κινδύνους προστίθεντο και εσωτερικοί, που συνδέονταν με τη διάδοση αιρέσεων και σχισματικών τάσεων.</p><p>Όλα αυτά απαιτούσαν από τους κληρικούς ιδιαίτερη αγάπη, ζήλο και υπευθυνότητα απέναντι στον Θεό και στο ποίμνιο. Οι χριστιανοί του Λουγδούνου, και ανάμεσά τους ο επίσκοπος Ποθεΐνος, έβλεπαν στον Ειρηναίο ακριβώς έναν τέτοιο πρεσβύτερο.</p><p>Την περίοδο εκείνη μεγάλη επιρροή απέκτησε η αίρεση των Μοντανιστών. Οι οπαδοί αυτής της κοινότητας διεκδικούσαν την πρωτοκαθεδρία στην κατοχή των χαρισμάτων. Όταν οι οπαδοί του Μοντανού έφτασαν στη Ρώμη και άρχισαν να σπέρνουν τις πλάνες τους ανάμεσα στους χριστιανούς της Ρώμης, ο επίσκοπος εκείνων των τόπων Ελευθέριος, έχοντας πλήρη επίγνωση του κινδύνου, δήλωσε ότι διακόπτει τις καλές θρησκευτικές σχέσεις με τους οπαδούς αυτής της αίρεσης.</p><p>Οι μάρτυρες του Λουγδούνου, δείχνοντας το πιο ζωηρό ενδιαφέρον για τα γεγονότα εκείνα, έστειλαν επιστολή στον Ελευθέριο και εμπιστεύτηκαν την παράδοσή της στον πρεσβύτερο Ειρηναίο, για τον οποίο στην ίδια επιστολή ειπώθηκαν λίγες γραμμές. Στις γραμμές αυτές οι μάρτυρες εξέφρασαν προς τον Ειρηναίο την πλήρη εμπιστοσύνη τους, αποκαλώντας τον αδελφό και συνεργό. Εκεί επίσης ανέφεραν ότι, αν η θέση του πρεσβυτέρου καθοριζόταν αποκλειστικά από τη δικαιοσύνη, ο Ειρηναίος θα ήταν πρώτος ανάμεσά τους.</p><p>Η επιστολή έπαιξε θετικό ρόλο. Ο επίσκοπος της Ρώμης έλαβε υπόψη τις επιθυμίες των πιστών του Λουγδούνου και έδωσε την ειρήνη σε όσους πλανώνταν.</p><h3>Η επισκοπική διακονία</h3><p>Μετά τον θάνατο του ενενηντάχρονου επισκόπου Ποθεΐνου, που πέθανε στη φυλακή το 177 ή το 178, ο άγιος Ειρηναίος, με τη στήριξη του λαού, αξιώθηκε να ανέβει στον επισκοπικό θρόνο του Λουγδούνου.</p><p>Ως ένα από τα άμεσα καθήκοντά του έθεσε την αποκατάσταση της ζωής της Εκκλησίας του Λουγδούνου μετά τον πρόσφατο διωγμό. Το έργο δεν ήταν εύκολο: πολλά μέλη της Εκκλησίας είχαν υποστεί μαρτύριο ή είχαν σκοτωθεί, και η δυσαρέσκεια των ειδωλολατρών εξακολουθούσε να εκδηλώνεται.</p><p>Ο επίσκοπος Ειρηναίος δεν έπαυε να κάνει ό,τι περνούσε από το χέρι του για τη στερέωση της πίστης. Κήρυττε ο ίδιος πολύ και έστελνε πρεσβυτέρους να κηρύξουν στις απομακρυσμένες περιοχές της Γαλατίας, ιδίως στη Βαλάνς και στη Μπεζανσόν.</p><p>Ένα άλλο σημαντικό πεδίο για τον νέο επίσκοπο ήταν ο αγώνας κατά του γνωστικισμού. Στον τομέα αυτόν ο άγιος Ειρηναίος αναγνωρίζεται ως η πιο εξέχουσα προσωπικότητα της εποχής του.</p><p>Σε γενικές γραμμές, οι γνωστικές πλάνες αποτελούσαν ένα εκρηκτικό μείγμα από διαστρεβλωμένες χριστιανικές ιδέες, ειδωλολατρικούς μύθους, φιλοσοφικές διδασκαλίες και προσωπικές φαντασίες. Εξαιτίας αυτού όλες τους διακρίνονταν για την ασάφεια και τη σύγχυση του περιεχομένου τους. Η δυσκολονόητη αυτή φύση των αντιλήψεων προβαλλόταν ως μυστηριότητα. Σε ορισμένες αιρέσεις, προκειμένου να ενισχυθεί η ατμόσφαιρα του μυστηρίου ή του μυστικισμού, επιτελούνταν ψευδοθαύματα. Οι οπαδοί κάθε γνωστικής αίρεσης πίστευαν ότι ακριβώς η δική τους «πίστη» είναι τέλεια. Αυτό συχνά προσέλκυε στις τάξεις τους θρησκευτικά αμόρφωτους και κενόδοξους ανθρώπους.</p><p>Όλη αυτή η κατάσταση ανησυχούσε και προβλημάτιζε τον Ειρηναίο Λουγδούνου. Με κάθε ευκαιρία εξηγούσε στο ποίμνιό του ποιος είναι ο κίνδυνος της παρέκκλισης από την πίστη του Χριστού και της ανυπακοής στην Εκκλησία, και απογύμνωνε τον παραλογισμό των γνωστικών διδασκαλιών.</p><p>Αγωνιζόμενος για την καθαρότητα της πίστης, δεν περιοριζόταν στα όρια της επαρχίας του. Έτσι, έστειλε επιστολή στον πρεσβύτερο Φλωρίνο και του επισήμανε τις αιρετικές παρεκκλίσεις του, και όταν εκείνος αρνήθηκε να ακούσει τη σωστή νουθεσία, ο Ειρηναίος έγραψε στον επίσκοπο της Ρώμης, ζητώντας του να αντιδράσει, να λάβει άμεσα μέτρα και να σβήσει την εστία της αίρεσης.</p><p>Στη διάρκεια λίγων ετών της ποιμαντικής του διακονίας ερεύνησε προσεκτικά, περιέγραψε και κατήγγειλε μια ολόκληρη σειρά γνωστικών ρευμάτων. Αργότερα τα έργα του συγκεντρώθηκαν σε ένα ενιαίο σύγγραμμα, που έγινε κτήμα της Οικουμενικής Εκκλησίας. Ο βαθμός εξοικείωσης με τις γνωστικές ιδέες που επέδειξε ο Ειρηναίος Λουγδούνου προκαλεί θαυμασμό μέχρι σήμερα. Στις μέρες μας το έργο αυτό είναι γνωστό στον αναγνώστη με τον τίτλο: Έλεγχος και ανατροπή της ψευδωνύμου γνώσεως (Κατά αιρέσεων)</p><h3>Η συμμετοχή στη διαμάχη για το Πάσχα</h3><p>Εκτός από όσα αναφέρθηκαν, ο άγιος Ειρηναίος έμεινε στη μνήμη των πιστών και ως υποστηρικτής της διευθέτησης των διαφορών που σχετίζονται με την ημέρα εορτασμού του Πάσχα.</p><p>Το ζήτημα του χρόνου εορτασμού του Πάσχα είχε τεθεί ήδη το 154. Τότε έγινε αντικείμενο συζήτησης ανάμεσα στον Πολύκαρπο Σμύρνης και τον επίσκοπο της Ρώμης Ανίκητο. Από τη συζήτηση αυτή οι δύο πλευρές έμειναν στις θέσεις τους, χωρίς όμως αυτό να τις οδηγήσει σε σύγκρουση.</p><p>Η διαφορά των προσεγγίσεων οφειλόταν στο ότι οι κοινότητες της Μικράς Ασίας, επικαλούμενες την αυθεντία του Ιωάννη του Θεολόγου και του αποστόλου Φιλίππου, ακολουθούσαν την παράδοση να εορτάζουν το Πάσχα τη 14η ημέρα του μήνα Νισάν (κατά το σεληνιακό ημερολόγιο), δηλαδή την ημέρα εκείνη του ετήσιου κύκλου κατά την οποία ο Ισραήλ τελούσε το παλαιοδιαθηκικό Πάσχα (η ίδια ημέρα συνδεόταν με την ημέρα του θανάτου του Χριστού στον Σταυρό). Η Εκκλησία της Ρώμης, μολονότι συνέδεε το Πάσχα με τη 14η του Νισάν, το εόρταζε όχι οποιαδήποτε ημέρα της εβδομάδας αλλά αυστηρά την Κυριακή.</p><p>Επί Ειρηναίου, περίπου το 190, ξέσπασε γύρω από το ζήτημα αυτό μια νέα διαμάχη: αυτή τη φορά ανάμεσα στον επίσκοπο της Ρώμης Βίκτωρα και τον Πολυκράτη τον Εφέσιο. Η κατάσταση οδήγησε σε ένταση στις σχέσεις των αρχιερέων και απειλούσε με ρήξη των σχέσεων ανάμεσα στις Εκκλησίες που ποίμαιναν. Ο Ειρηναίος, επεμβαίνοντας, έπεισε τον επίσκοπο της Ρώμης να συμφιλιωθεί με τον Πολυκράτη, και η ειρήνη αποκαταστάθηκε.</p><p>Το 202 ο Ειρηναίος Λουγδούνου υπέστη μαρτυρικό θάνατο.</p><h2>Η συγγραφική κληρονομιά</h2><p>Από τον άγιο Ειρηναίο έχουν φτάσει ως εμάς μόνο λίγα συγγράμματα: ο Έλεγχος και ανατροπή της ψευδωνύμου γνώσεως (Κατά αιρέσεων), το Δοκίμιον της αποστολικής κηρύξεως και το Περί της τυραννικής βασιλείας του Αντιχρίστου. Ωστόσο η γνώση που παραδίδεται σε αυτά τα έργα δύσκολα μπορεί να υπερεκτιμηθεί.</p><p>Πρώτα απ' όλα εδώ παρουσιάζεται μια θετική έκθεση της χριστιανικής διδασκαλίας. Στις σελίδες των έργων που αναφέρθηκαν ο Ειρηναίος θίγει σημαντικά κεφάλαια της δογματικής, όπως η διδασκαλία για τον Θεό, για την Απολύτρωση, για τη δημιουργία του κόσμου, για την πτώση, για την Εκκλησία, για τα Μυστήρια, για την Παράδοση κ.ά.</p><p>Από την άλλη μεριά, δίνει μια αρμονική εικόνα και έναν σαφή χαρακτηρισμό των πιο επικίνδυνων πλανών της εποχής του. Κάθε καταγγελία συνοδεύεται από ακαταμάχητα επιχειρήματα και μπορεί να χρησιμεύσει ως επίκαιρο βοήθημα στον αγώνα για την καθαρότητα της πίστης ακόμη και σήμερα.</p><h2>Σύνοψη των έργων του Ειρηναίου Λουγδούνου</h2><p>Στην παρούσα έκδοση παρουσιάζονται όλα τα σωζόμενα έργα του ιεράρχη Ειρηναίου Λουγδούνου – ο «Έλεγχος και ανατροπή της ψευδωνύμου γνώσεως» σε πέντε βιβλία (που, κατά το παράδειγμα του «πατέρα της εκκλησιαστικής ιστορίας» Ευσεβίου και του μακαρίου Ιερωνύμου, αναφέρεται συνήθως συντομευμένα ως «Κατά αιρέσεων») και το «Δοκίμιον της αποστολικής κηρύξεως». Ο άγιος Ειρηναίος, επίσκοπος Λουγδούνου, υπήρξε πνευματικό τέκνο του αγίου Πολυκάρπου Σμύρνης, μαθητή του αποστόλου Ιωάννη του Θεολόγου, και διατηρούσε ακόμη στα χείλη του τη ζωντανή αποστολική φωνή και το πνεύμα της αποστολικής διδασκαλίας και Παράδοσης. Απολάμβανε ευρύτατη φήμη και τεράστιο σεβασμό από ολόκληρη την Οικουμενική Εκκλησία και υπήρξε ειρηνοποιός στη διαμάχη ανάμεσα στη Ρώμη και τις Εκκλησίες της Μικράς Ασίας για τελετουργικές διαφορές, αλλά διακρίθηκε ιδιαίτερα στον αγώνα του εναντίον των πιο επικίνδυνων αιρετικών της εποχής του – των γνωστικών. Αποστομώνοντας με ζήλο όλες τις γνωστικές πλάνες που υπήρχαν τότε, ο άγιος Ειρηναίος εκθέτει με αξιοθαύμαστη σαφήνεια και βάθος την αποστολική διδασκαλία για τον Θεό, για τη σωτηρία, την απολύτρωση και την ανάσταση του ανθρώπου, για την Ευχαριστία και τα έσχατα του σύμπαντος. Στο πρόσωπό του βλέπουμε τον πιο λαμπρό υπερασπιστή της ιδέας της Εκκλησίας, της σημασίας της και της ανάγκης να ανήκει κανείς σε αυτήν. Πολύτιμη είναι και η ερμηνευτική πλευρά των έργων του αγίου Ειρηναίου, στην οποία δόθηκε ιδιαίτερη προσοχή στην παρούσα έκδοση: οι παραπομπές στην Αγία Γραφή εξακριβώθηκαν και συμπληρώθηκαν, και καταρτίστηκε ευρετήριο βιβλικών παραπομπών στα έργα του αγίου Ειρηναίου. Η παλαιότερη ρωσική μετάφραση του πρωτοπρεσβυτέρου Π. Πρεομπραζένσκι παραδίδεται σε νέα επεξεργασία και εφοδιάζεται, όπου είναι απαραίτητο, με κειμενολογικές σημειώσεις.</p><p>Για όλους όσοι επιθυμούν να έχουν στέρεο θεμέλιο της πίστης του Κυρίου, της αποστολικής και της εκκλησιαστικής, και να πίνουν νερό σωτηρίας από τις ζωντανές πηγές.</p><h2>Η πίστη</h2><h3>Ο Θεός — η Τριάδα</h3><blockquote><p><em>Ἡ μὲν γὰρ Ἐκκλησία, καίπερ καθ' ὅλης τῆς οἰκουμένης ἕως περάτων τῆς γῆς διεσπαρμένη, παρὰ δὲ τῶν Ἀποστόλων, καὶ τῶν ἐκείνων μαθητῶν παραλαβοῦσα τὴν <strong>εἰς ἕνα Θεὸν Πατέρα</strong> παντοκράτορα, τὸν πεποιηκότα τὸν οὐρανὸν, καὶ τὴν γῆν, καὶ τὰς θαλάσσας, καὶ πάντα τὰ ἐν αὐτοῖς, πίστιν· καὶ <strong>εἰς ἕνα Χριστὸν Ἰησοῦν, τὸν υἱὸν τοῦ Θεοῦ</strong>, τὸν σαρκωθέντα ὑπὲρ τῆς ἡμετέρας σωτηρίας· καὶ <strong>εἰς Πνεῦμα ἅγιον</strong>, τὸ διὰ τῶν προφητῶν κεκηρυχὸς τὰς οἰκονομίας, καὶ τὰς ἐλεύσεις, καὶ τὴν ἐκ Παρθένου γέννησιν, καὶ τὸ πάθος, καὶ τὴν ἔγερσιν ἐκ νεκρῶν, καὶ τὴν ἔνσαρκον εἰς τοὺς οὐρανοὺς ἀνάληψιν τοῦ ἠγαπημένου Χριστοῦ Ἰησοῦ τοῦ Κυρίου ἡμῶν, καὶ τὴν ἐκ τῶν οὐρανῶν ἐν τῇ δόξῃ τοῦ Πατρὸς παρουσίαν αὐτοῦ</em></p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/Az9E_%E1%BC%9C%CE%BB%CE%B5%CE%B3%CF%87%CE%BF%CF%82_%CE%BA%CE%B1%E1%BD%B6_%E1%BC%80%CE%BD%CE%B1%CF%84%CF%81%CE%BF%CF%80%E1%BD%B4_%CF%84%E1%BF%86%CF%82_%CF%88%CE%B5%CF%85%CE%B4%CF%89%CE%BD%CF%8D%CE%BC%CE%BF%CF%85_%CE%B3%CE%BD%CF%8E%CF%83%CE%B5%CF%89%CF%82_%CE%9A%CE%B1%CF%84%E1%BD%B0_%CE%B1%E1%BC%B1%CF%81%CE%AD%CF%83%CE%B5%CF%89%CE%BD__%CE%92%CE%B9%CE%B2%CE%BB%CE%AF%CE%BF%CE%BD_1#HH-10-2">Κατὰ αἱρέσεων, βιβλ. Α΄, κεφ. 10</a>)</p><blockquote><p><em>Κατέχοντες δὲ ἡμεῖς τὸν κανόνα τῆς ἀληθείας, τοῦτ' ἔστιν ὅτι <strong>εἷς ἐστιν ὁ Θεὸς ὁ παντοκράτωρ</strong>, ὁ τὰ πάντα κτίσας διὰ τοῦ <strong>Λόγου</strong> αὐτοῦ καὶ καταρτίσας καὶ ποιήσας ἐκ τοῦ μὴ ὄντος εἰς τὸ εἶναι τὰ πάντα, καθὼς ἡ Γραφὴ λέγει· «Τῷ λόγῳ τοῦ Κυρίου οἱ οὐρανοὶ ἐστερεώθησαν, καὶ τῷ <strong>πνεύματι</strong> τοῦ στόματος αὐτοῦ πᾶσα ἡ δύναμις αὐτῶν» …</em></p><p><em>οὐδενὸς γὰρ ὁ Θεὸς ἐνδεής ἐστιν, ἀλλὰ <strong>διὰ τοῦ Λόγου καὶ τοῦ Πνεύματος αὐτοῦ πάντα ποιῶν</strong> καὶ διατάσσων καὶ κυβερνῶν καὶ πᾶσι τὸ εἶναι παρέχων.</em></p></blockquote><p>(<a href="https://bibleox.com/grc/la/w/LATIN-Adversus_haereses_LIBER_I#HH-22-15">Κατὰ αἱρέσεων, βιβλ. Α΄, κεφ. 22 (λατ.)</a>)</p><blockquote><p><em>Οὐδὲ γὰρ ἐδεῖτο τούτων <strong>ὁ Θεὸς</strong> εἰς τὸ ποιῆσαι ἃ αὐτὸς παρ' ἑαυτῷ προώρισεν γενέσθαι, ὡς ἂν μὴ ἔχων τὰς ἑαυτοῦ χεῖρας. <strong>Πάρεστι γὰρ αὐτῷ ἀεὶ ὁ Λόγος καὶ ἡ Σοφία, ὁ Υἱὸς καὶ τὸ Πνεῦμα</strong>, δι' ὧν καὶ ἐν οἷς πάντα ἐλευθέρως καὶ αὐτοβούλως ἐποίησεν, <strong>πρὸς οὓς καὶ λέγει· «Ποιήσωμεν ἄνθρωπον κατ' εἰκόνα καὶ καθ' ὁμοίωσιν ἡμετέραν»</strong>· αὐτὸς παρ' ἑαυτοῦ τὴν οὐσίαν τῶν κτισμάτων καὶ τὸ παράδειγμα τῶν γεγονότων καὶ τὴν μορφὴν τῶν ἐν τῷ κόσμῳ κοσμημάτων λαμβάνων.</em></p></blockquote><p>(<a href="https://bibleox.com/grc/la/w/LATIN-Adversus_haereses%2C_LIBER_IV#HH-20-34">Κατὰ αἱρέσεων, βιβλ. Δ΄, κεφ. 20 (λατ.)</a>)</p><blockquote><p><em>Ἡ δὲ τῶν ἀπὸ τῆς Ἐκκλησίας ὁδὸς περιτρέχει τὸν κόσμον ὅλον, ἅτε βεβαίαν ἔχουσα τὴν ἀπὸ τῶν Ἀποστόλων παράδοσιν, καὶ παρέχουσα ἡμῖν ἰδεῖν ὅτι μία καὶ ἡ αὐτὴ πάντων ἐστὶν ἡ πίστις, πάντων <strong>ἕνα καὶ τὸν αὐτὸν Θεὸν Πατέρα</strong> κηρυσσόντων, καὶ τὴν αὐτὴν τῆς ἐνανθρωπήσεως τοῦ <strong>Υἱοῦ τοῦ Θεοῦ</strong> οἰκονομίαν πιστευόντων, καὶ τὴν αὐτὴν τοῦ <strong>Πνεύματος</strong> δωρεὰν εἰδότων, καὶ τὰ αὐτὰ μελετώντων παραγγέλματα, καὶ τὸν αὐτὸν τύπον τῆς κατὰ τὴν Ἐκκλησίαν διατάξεως φυλασσόντων.</em></p></blockquote><p>(<a href="https://bibleox.com/grc/la/w/LATIN-Adversus_haereses%2C_LIBER_V#HH-20">Κατὰ αἱρέσεων, βιβλ. Ε΄, κεφ. 20 (λατ.)</a>)</p><blockquote><p><em>Ταύτην εἶναι τὴν διανομὴν καὶ οἰκονομίαν τῶν σωζομένων, φασὶν οἱ πρεσβύτεροι, οἱ τῶν Ἀποστόλων μαθηταί, καὶ διὰ τοιαύτης βαθμίδος προκόπτειν, καὶ <strong>διὰ μὲν τοῦ Πνεύματος πρὸς τὸν Υἱόν, διὰ δὲ τοῦ Υἱοῦ πρὸς τὸν Πατέρα</strong> ἀνέρχεσθαι· τοῦ Υἱοῦ ἔπειτα παραδιδόντος τῷ Πατρὶ τὸ ἔργον αὐτοῦ.</em></p></blockquote><p>(<a href="https://bibleox.com/grc/la/w/LATIN-Adversus_haereses%2C_LIBER_V#HH-36">Κατὰ αἱρέσεων, βιβλ. Ε΄, κεφ. 36 (λατ.)</a>)</p><h3>Ο Χριστός — Θεός</h3><blockquote><p><em>Τοῦτ' ἔστι τὸ μυστήριον ὃ λέγει κατὰ ἀποκάλυψιν ἐγνωρίσθαι αὐτῷ, ὅτι <strong><mark>ὁ παθὼν ἐπὶ Ποντίου Πιλάτου, οὗτος</mark> Κύριος τῶν πάντων καὶ Βασιλεὺς καὶ <mark>Θεὸς</mark> καὶ Κριτής ἐστιν</strong>, παρ' αὐτοῦ τοῦ πάντων Θεοῦ λαβὼν τὴν ἐξουσίαν, ἐπειδὴ «ὑπήκοος ἐγένετο μέχρι θανάτου, θανάτου δὲ σταυροῦ».</em></p></blockquote><p>(<a href="https://bibleox.com/grc/la/w/LATIN-Adversus_haereses%2C_LIBER_III#HH-12">Κατὰ αἱρέσεων, βιβλ. Γ΄, κεφ. 12 (λατ.)</a>)</p><h3>Ο Θεός έγινε άνθρωπος, γεννημένος από την Παρθένο</h3><blockquote><p><em><strong><mark>Ὁ Θεὸς οὖν ἄνθρωπος ἐγένετο</mark></strong> καὶ αὐτὸς Κύριος ἔσωσεν ἡμᾶς, δοὺς τὸ <strong><mark>τῆς παρθένου</mark></strong> σημεῖον. …</em></p><p><em>Οὕτω καὶ αὐτὸς ὁ Λόγος ὤν, τὸν Ἀδὰμ ἐν ἑαυτῷ ἀνακεφαλαιούμενος, <strong><mark>ἐκ Μαρίας ἔτι παρθένου οὔσης</mark></strong> δικαίως ἐλάμβανε τὴν γέννησιν τῆς ἀνακεφαλαιώσεως τοῦ Ἀδάμ.</em></p></blockquote><p>(<a href="https://bibleox.com/grc/la/w/LATIN-Adversus_haereses%2C_LIBER_III#HH-21-23">Κατὰ αἱρέσεων, βιβλ. Γ΄, κεφ. 21 (λατ.)</a>)</p><h3>Η σωτηρία είναι δυνατή μόνο στην Εκκλησία</h3><blockquote><p><em><strong><mark>Ἐν τῇ Ἐκκλησίᾳ</mark></strong> γάρ, φησίν, <strong><mark>ἔθετο ὁ Θεὸς</mark></strong> ἀποστόλους, προφήτας, διδασκάλους (Α΄ Κορ. 12:28), καὶ τὴν λοιπὴν <strong>πᾶσαν</strong> <strong><mark>ἐνέργειαν τοῦ Πνεύματος· ἧς οὐ μετέχουσιν <mark>πάντες</mark> οἱ μὴ συνρέχοντες πρὸς τὴν Ἐκκλησίαν</mark></strong>, ἀλλ' <strong><mark>ἑαυτοὺς ἀποστεροῦσι τῆς ζωῆς διὰ φρονήματος πονηροῦ καὶ πράξεως κακίστης</mark>. Ὅπου γὰρ ἡ Ἐκκλησία, ἐκεῖ καὶ τὸ Πνεῦμα τοῦ Θεοῦ· καὶ ὅπου τὸ Πνεῦμα τοῦ Θεοῦ, ἐκεῖ ἡ Ἐκκλησία καὶ πᾶσα χάρις· τὸ δὲ Πνεῦμά ἐστιν ἡ ἀλήθεια.</strong> Ὅθεν <strong><mark>οἱ μὴ μετέχοντες αὐτοῦ οὔτε ἀπὸ τῶν μαστῶν τῆς μητρὸς τρέφονται εἰς ζωήν, οὔτε τῆς ἀπὸ τοῦ σώματος τοῦ Χριστοῦ προχεομένης εἰλικρινεστάτης πηγῆς μεταλαμβάνουσιν· ἀλλ' ὀρύσσουσιν ἑαυτοῖς λάκκους συντετριμμένους ἐκ βόθρων γηίνων (Ἱερ. 2:13), καὶ ἐκ τοῦ βορβόρου πίνουσιν ὕδωρ σαπρόν, φεύγοντες τὴν πίστιν τῆς Ἐκκλησίας</mark></strong> ἵνα μὴ ἐλεγχθῶσιν, καὶ <strong><mark>ἀπορρίπτοντες τὸ Πνεῦμα</mark></strong> ἵνα μὴ παιδευθῶσιν. <strong>Ἀλλοτριωθέντες δὲ τῆς ἀληθείας, εἰκότως ἐν πάσῃ κυλίονται πλάνῃ, ὑπ' αὐτῆς κυμαινόμενοι, ἄλλοτε ἄλλως περὶ τῶν αὐτῶν κατὰ καιροὺς φρονοῦντες, καὶ ἐπιστήμην βεβαίαν οὐδέποτε ἔχοντες</strong>, σοφισταὶ λόγων μᾶλλον εἶναι θέλοντες ἢ μαθηταὶ τῆς ἀληθείας. Οὐ γὰρ ἐπὶ τὴν μίαν πέτραν τεθεμελίωνται, ἀλλ' ἐπὶ τὴν ἄμμον τὴν ἔχουσαν ἐν ἑαυτῇ λίθους πολλούς.</em></p></blockquote><p>(<a href="https://bibleox.com/grc/la/w/LATIN-Adversus_haereses%2C_LIBER_III#HH-24-38">Κατὰ αἱρέσεων, βιβλ. Γ΄, κεφ. 24 (λατ.)</a>)</p><blockquote><p><em>Διὸ τοῖς ἐν τῇ Ἐκκλησίᾳ οὖσι πρεσβυτέροις πείθεσθαι δεῖ, τοῖς τὴν διαδοχὴν ἔχουσιν ἀπὸ τῶν ἀποστόλων, ὡς ἐδείξαμεν, οἵτινες μετὰ τῆς ἐπισκοπῆς διαδοχῆς χάρισμα ἀληθείας βέβαιον κατὰ τὴν τοῦ Πατρὸς εὐδοκίαν ἔλαβον· τοὺς δὲ λοιποὺς <strong>τοὺς ἀφισταμένους τῆς προηγουμένης διαδοχῆς καὶ ὅπου δήποτε συνάγονται, ὑπόπτους ἔχειν, ἢ ὡς αἱρετικοὺς καὶ κακῆς γνώμης, ἢ ὡς σχίζοντας καὶ ἐπηρμένους καὶ ἑαυτοῖς ἀρέσκοντας, ἢ αὖθις ὡς ὑποκριτάς, κέρδους χάριν καὶ κενοδοξίας τοῦτο πράσσοντας. <mark>Πάντες δὲ οὗτοι ἐξέπεσον τῆς ἀληθείας</mark></strong>. Καὶ <strong>οἱ μὲν <mark>αἱρετικοὶ</mark> πῦρ ἀλλότριον προσφέροντες τῷ θυσιαστηρίῳ τοῦ Θεοῦ, τουτέστι διδαχὰς ἀλλοτρίας, <mark>πυρὶ οὐρανίῳ κατακαυθήσονται</mark></strong>, καθὼς Ναδὰβ καὶ Ἀβιούδ (Λευ. 10:1-2). <strong><mark>Οἱ δὲ ἀνιστάμενοι κατὰ τῆς ἀληθείας</mark> καὶ τοὺς ἄλλους <mark>παρορμῶντες κατὰ τῆς Ἐκκλησίας τοῦ Θεοῦ ἐν τῷ ᾅδῃ μένουσιν</mark></strong>, ὑπὸ τῆς γῆς καταποθέντες, καθὼς οἱ περὶ Κορὲ Δαθὰν καὶ Ἀβειρών (Ἀριθ. 16:33). <strong><mark>Οἱ δὲ σχίζοντες καὶ διαιροῦντες τὴν ἑνότητα τῆς Ἐκκλησίας τὴν αὐτὴν τῷ Ἱεροβοὰμ παρὰ τοῦ Θεοῦ τιμωρίαν λήψονται</mark></strong> (Γ΄ Βασ. 14:10 ἑξ.). &lt;…&gt; <strong>Ἀπὸ πάντων οὖν τῶν τοιούτων ἀφίστασθαι δεῖ· <mark>προσκολλᾶσθαι δὲ τοῖς, ὡς προέφην, τὴν τῶν ἀποστόλων διδαχὴν φυλάσσουσιν, καὶ μετὰ τοῦ τῆς πρεσβυτερίας τάγματος τὸν ὑγιᾶ λόγον</mark> καὶ τὴν ἀπρόσκοπον ἀναστροφὴν παρέχουσιν</strong>, εἰς τὴν ἑτέρων οἰκοδομὴν καὶ διόρθωσιν.</em></p></blockquote><p>(<a href="https://bibleox.com/grc/la/w/LATIN-Adversus_haereses%2C_LIBER_IV#HH-26-">Κατὰ αἱρέσεων, βιβλ. Δ΄, κεφ. 26 (λατ.)</a>)</p><h3>Η μετά θάνατον ζωή της ψυχής</h3><p>Εδώ επίσης απορρίπτεται η μετενσωμάτωση (στρέφεται κατά του πλατωνισμού):</p><blockquote><p>Πληρέστατα δὲ ὁ Κύριος ἐδίδαξεν ὅτι <strong><mark>αἱ ψυχαὶ οὐ μόνον διαμένουσιν</mark>, οὐ μεταβαίνουσαι ἀπὸ σώματος εἰς σῶμα, ἀλλὰ καὶ τὸν χαρακτῆρα τοῦ σώματος, ᾧ καὶ προσαρμόζονται, φυλάσσουσιν τὸν αὐτόν, καὶ μέμνηνται τῶν ἔργων ὧν ἔπραξαν ἐνταῦθα καὶ ἀφ' ὧν ἐπαύσαντο</strong>, ἐν τῇ διηγήσει τῇ γεγραμμένῃ περὶ τοῦ πλουσίου καὶ τοῦ Λαζάρου τοῦ ἀναπαυομένου ἐν τῷ κόλπῳ τοῦ Ἀβραάμ· ἐν ᾗ φησιν τὸν πλούσιον γινώσκειν τὸν Λάζαρον μετὰ τὸν θάνατον, καὶ τὸν Ἀβραὰμ ὁμοίως, καὶ μένειν ἐν τῇ ἰδίᾳ τάξει ἕκαστον αὐτῶν, καὶ αἰτεῖσθαι ἀποσταλῆναι αὐτῷ εἰς ἐπικουρίαν τὸν Λάζαρον, ᾧ οὐδὲ τῶν ψιχίων τῆς τραπέζης αὐτοῦ μετεδίδου· καὶ περὶ τῆς ἀποκρίσεως τοῦ Ἀβραάμ, ὃς οὐ μόνον τὰ καθ' ἑαυτὸν ἀλλὰ καὶ τὰ κατὰ τὸν πλούσιον ᾔδει, καὶ προσέτασσε Μωσεῖ καὶ τοῖς προφήταις πείθεσθαι τοὺς μὴ βουλομένους εἰς ἐκεῖνον τὸν τόπον τῆς κολάσεως ἐλθεῖν, καὶ δεχομένους τὸ κήρυγμα τοῦ ἐκ νεκρῶν ἀναστάντος. Διὰ τούτων γὰρ φανερώτατα ἀπεδείχθη καὶ τὸ <strong><mark>διαμένειν τὰς ψυχὰς</mark> καὶ τὸ μὴ μεταβαίνειν ἀπὸ σώματος εἰς σῶμα, καὶ τὸ ἔχειν ἀνθρώπου μορφήν, ὥστε καὶ γινώσκεσθαι, καὶ τὸ μεμνῆσθαι τῶν ἐνταῦθα· καὶ τὸ προφητικὸν δὲ τῷ Ἀβραὰμ παρεῖναι, καὶ <mark>ἀξίαν οἴκησιν ἕκαστον γένος λαμβάνειν καὶ πρὸ τῆς κρίσεως</mark></strong>.</p></blockquote><p>(<a href="https://bibleox.com/grc/la/w/LATIN-Adversus_haereses_LIBER_II#HH-34-55">Κατὰ αἱρέσεων, βιβλ. Β΄, κεφ. 34 (λατ.)</a>)</p><h3>Οι ψυχές των δικαίων μετά τον θάνατο παραμένουν με τον Θεό</h3><blockquote><p><em>Ἡ Ἐκκλησία ἐν παντὶ τόπῳ, διὰ τὴν πρὸς τὸν Θεὸν ἀγάπην ἣν ἔχει, <strong><mark>πλῆθος μαρτύρων ἐν παντὶ καιρῷ προπέμπει πρὸς τὸν Πατέρα</mark></strong>.</em></p></blockquote><p>(<a href="https://bibleox.com/grc/la/w/LATIN-Adversus_haereses%2C_LIBER_IV#HH-33-50">Κατὰ αἱρέσεων, βιβλ. Δ΄, κεφ. 33 (λατ.)</a>)</p><p>Περισσότερα: <a href="https://bibleox.com/ru/ru/w/%D0%98%D1%80%D0%B8%D0%BD%D0%B5%D0%B9_%D0%9B%D0%B8%D0%BE%D0%BD%D1%81%D0%BA%D0%B8%D0%B9-%D0%B2%D0%B5%D1%80%D0%B0_%D0%B2_%D0%BF%D0%BE%D1%81%D0%BC%D0%B5%D1%80%D1%82%D0%BD%D1%83%D1%8E_%D1%83%D1%87%D0%B0%D1%81%D1%82%D1%8C_%D1%81_%D0%91%D0%BE%D0%B3%D0%BE%D0%BC">Ο Ειρηναίος Λουγδούνου — η πίστη στη ζωή της ψυχής με τον Θεό (ru)</a></p><h3>Ο αγιασμός της κτιστής ύλης</h3><blockquote><p><em>οἳ λεπροὶ ὄντες ἐν ταῖς ἁμαρτίαις <strong>διὰ τοῦ <mark>ἁγίου ὕδατος</mark> καὶ τῆς τοῦ Κυρίου ἐπικλήσεως καθαριζόμεθα</strong> τῶν παλαιῶν παραπτωμάτων, ὡς παιδία νεόγονα πνευματικῶς ἀναγεννώμενοι, καθὼς καὶ ὁ Κύριος ἔφη· ἐὰν μή τις ἀναγεννηθῇ δι' ὕδατος καὶ πνεύματος, οὐ μὴ εἰσελεύσεται εἰς τὴν βασιλείαν τῶν οὐρανῶν.</em></p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/xg4M_%CE%98%CF%81%CE%B1%CF%8D%CF%83%CE%BC%CE%B1%CF%84%CE%B1_%CE%98%CF%81%CE%B1%CF%8D%CF%83%CE%BC%CE%B1%CF%84%CE%B1#HH-33">Θραύσματα, 33</a>)</p><h3>Η πραγματικότητα του σώματος και του αίματος του Χριστού στην Ευχαριστία</h3><blockquote><p><em>Μάταιοι δὲ πάντως οἱ πᾶσαν τὴν οἰκονομίαν τοῦ Θεοῦ καταφρονοῦντες, καὶ <strong>τὴν σωτηρίαν τῆς σαρκὸς</strong> ἀρνούμενοι καὶ τὴν ἀναγέννησιν αὐτῆς ἐξουθενοῦντες, λέγοντες αὐτὴν μὴ εἶναι δεκτικὴν τῆς ἀφθαρσίας. Εἰ δὲ μὴ σώζεται αὕτη, οὐδὲ ὁ Κύριος τῷ ἰδίῳ αἵματι ἐλυτρώσατο ἡμᾶς, οὐδὲ <strong>τὸ ποτήριον τῆς εὐχαριστίας</strong> κοινωνία τοῦ αἵματος αὐτοῦ ἐστιν, οὐδὲ ὁ ἄρτος ὃν κλῶμεν κοινωνία τοῦ σώματος αὐτοῦ ἐστιν. Τὸ γὰρ <strong>αἷμα οὐκ ἔστιν εἰ μὴ ἀπὸ φλεβῶν καὶ σαρκῶν καὶ τῆς λοιπῆς τῆς κατὰ τὸν ἄνθρωπον ὑποστάσεως, ἧς ἀληθῶς γέγονεν ὁ Λόγος τοῦ Θεοῦ, τῷ ἰδίῳ αἵματι λυτρωσάμενος ἡμᾶς</strong>, καθὼς καὶ ὁ Ἀπόστολος αὐτοῦ φησιν· «Ἐν ᾧ ἔχομεν τὴν ἀπολύτρωσιν διὰ τοῦ αἵματος αὐτοῦ, τὴν ἄφεσιν τῶν ἁμαρτιῶν» (Κολ. 1:14). Ἐπειδὴ <strong>μέλη αὐτοῦ ἐσμεν καὶ διὰ τῆς κτίσεως τρεφόμεθα</strong>, τὴν δὲ κτίσιν αὐτὸς ἡμῖν παρέχει, τὸν ἥλιον αὐτοῦ ἀνατέλλων καὶ βρέχων καθὼς βούλεται, τὸ ἀπὸ τῆς κτίσεως ποτήριον ἴδιον αἷμα ὡμολόγησεν, ἐξ οὗ δεύσει τὸ ἡμέτερον αἷμα, καὶ τὸν ἀπὸ τῆς κτίσεως ἄρτον ἴδιον σῶμα διεβεβαιώσατο, ἀφ' οὗ τὰ ἡμέτερα αὔξει σώματα. </em></p><p><em>Ὁπότε οὖν καὶ <strong><mark>τὸ κεκραμένον ποτήριον καὶ ὁ γεγονὼς ἄρτος ἐπιδέχεται τὸν λόγον τοῦ Θεοῦ καὶ γίνεται εὐχαριστία καὶ σῶμα Χριστοῦ</mark></strong>, ἐκ τούτων τε αὔξει καὶ συνέστηκεν ἡ τῆς σαρκὸς ἡμῶν ὑπόστασις, πῶς δεκτικὴν μὴ εἶναι τὴν σάρκα λέγουσι τῆς δωρεᾶς τοῦ Θεοῦ, ἥτις ἐστὶ ζωὴ αἰώνιος, <strong>τὴν ἀπὸ τοῦ σώματος καὶ αἵματος τοῦ Κυρίου τρεφομένην</strong> καὶ μέλος αὐτοῦ ὑπάρχουσαν; Καθὼς ὁ μακάριος Ἀπόστολός φησιν ἐν τῇ πρὸς Ἐφεσίους ἐπιστολῇ ὅτι «Μέλη ἐσμὲν τοῦ σώματος αὐτοῦ, ἐκ τῆς σαρκὸς αὐτοῦ καὶ ἐκ τῶν ὀστέων αὐτοῦ», <strong><mark>οὐ περὶ πνευματικοῦ τινος καὶ ἀοράτου ἀνθρώπου λέγων ταῦτα</mark>, «τὸ γὰρ πνεῦμα οὔτε ὀστέα οὔτε σάρκας ἔχει», ἀλλὰ περὶ τῆς κατὰ τὸν ἀληθινὸν ἄνθρωπον οἰκονομίας, τῆς ἐκ σαρκῶν καὶ νεύρων καὶ ὀστέων συνεστώσης, ἥτις καὶ ἐκ τοῦ ποτηρίου ὅ ἐστιν αἷμα αὐτοῦ τρέφεται καὶ ἐκ τοῦ ἄρτου ὅ ἐστι σῶμα αὐτοῦ αὔξεται</strong>.</em></p></blockquote><p>(<a href="https://bibleox.com/grc/la/w/LATIN-Adversus_haereses%2C_LIBER_V#HH-2">Κατὰ αἱρέσεων, βιβλ. Ε΄, κεφ. 2 (λατ.)</a>)</p><blockquote><p><em>Καθαρὰν προσφορὰν μόνη ἡ Ἐκκλησία προσφέρει τῷ Ποιητῇ, <strong>προσφέρουσα αὐτῷ μετ' εὐχαριστίας</strong> ἀπὸ τῆς κτίσεως αὐτοῦ. Ἰουδαῖοι δὲ οὐκέτι προσφέρουσιν· αἱ γὰρ χεῖρες αὐτῶν αἵματος πλήρεις· οὐ γὰρ ἐδέξαντο τὸν Λόγον, δι' οὗ προσφέρεται τῷ Θεῷ. Ἀλλ' οὐδὲ πᾶσαι αἱ τῶν αἱρετικῶν συναγωγαὶ προσφέρουσι τῷ Θεῷ. Οἱ μὲν γὰρ ἕτερον παρὰ τὸν Ποιητὴν λέγοντες εἶναι τὸν Πατέρα, διὰ τοῦτο τὰς καθ' ἡμᾶς κτίσεις προσφέροντες αὐτῷ, ἐπιθυμητὴν ἀλλοτρίων δεικνύουσιν αὐτὸν καὶ ἀλλότρια ἐπιθυμοῦντα. Οἱ δὲ ἐξ ἐκτροπῆς καὶ ἀγνοίας καὶ πάθους γεγονέναι λέγοντες τὰ καθ' ἡμᾶς, ἀγνοίας καὶ πάθους καὶ ἐκτροπῆς καρποὺς προσφέροντες, ἁμαρτάνουσιν εἰς τὸν ἑαυτῶν Πατέρα, ὕβριν αὐτῷ μᾶλλον ἢ εὐχαριστίαν προσάγοντες. Πῶς δὲ αὐτοῖς βέβαιον ἔσται τὸ <strong><mark>τὸν ἄρτον ἐν ᾧ ηὐχαρίστηται σῶμα εἶναι τοῦ ἰδίου Κυρίου, καὶ τὸ ποτήριον τοῦ αἵματος αὐτοῦ</mark></strong>, εἰ μὴ αὐτὸν τὸν Υἱὸν τοῦ Ποιητοῦ τοῦ κόσμου λέγοιεν, τουτέστι τὸν Λόγον αὐτοῦ, δι' οὗ τὸ ξύλον καρποφορεῖ καὶ πηγαὶ ῥέουσιν, καὶ «ἡ γῆ δίδωσι πρῶτον μὲν χόρτον, εἶτα στάχυν, εἶτα πλήρη σῖτον ἐν τῷ στάχυι» (Μκ. </em></p><p><em>4:28)? Πῶς τὴν σάρκα λέγουσιν εἰς φθορὰν χωρεῖν καὶ μὴ μετέχειν τῆς ζωῆς <strong><mark>τὴν ἀπὸ τοῦ σώματος τοῦ Κυρίου καὶ τοῦ αἵματος αὐτοῦ τρεφομένην</mark></strong>; Ἢ τὴν γνώμην οὖν ἀλλαξάτωσαν, ἢ τὸ προσφέρειν τὰ εἰρημένα παραιτησάσθωσαν. Ἡμῖν δὲ σύμφωνος τῇ γνώμῃ ἡ εὐχαριστία καὶ ἡ εὐχαριστία βεβαιοῖ τὴν γνώμην. Προσφέρομεν αὐτῷ τὰ ἴδια, ἐμμελῶς κοινωνίαν καὶ ἕνωσιν καταγγέλλοντες σαρκὸς καὶ Πνεύματος. Ὡς γὰρ <strong>ὁ ἀπὸ τῆς γῆς ἄρτος προσλαβόμενος τὴν ἐπίκλησιν τοῦ Θεοῦ οὐκέτι κοινὸς ἄρτος ἐστίν, ἀλλ' εὐχαριστία ἐκ δύο πραγμάτων συνεστηκυῖα, ἐπιγείου τε καὶ οὐρανίου, οὕτως καὶ τὰ σώματα ἡμῶν μεταλαμβάνοντα τῆς εὐχαριστίας μηκέτι εἶναι φθαρτά, τὴν ἐλπίδα τῆς εἰς αἰῶνα ἀναστάσεως ἔχοντα</strong>.</em></p></blockquote><p>(<a href="https://bibleox.com/grc/la/w/LATIN-Adversus_haereses%2C_LIBER_IV#HH-18-31">Κατὰ αἱρέσεων, βιβλ. Δ΄, κεφ. 18 (λατ.)</a>)</p><h3>Στην Ευχαριστία ο άρτος και ο οίνος προσφέρονται στον Θεό ως θυσία</h3><blockquote><p><em><strong>Ἡ τῆς Ἐκκλησίας οὖν προσφορά, ἣν ὁ Κύριος ἐδίδαξεν ἐν ὅλῳ τῷ κόσμῳ προσφέρεσθαι, καθαρὰ θυσία παρὰ τῷ Θεῷ ἐλογίσθη καὶ ἀποδεκτὴ αὐτῷ· οὐχ ὅτι δεῖται θυσίας παρ' ἡμῶν, ἀλλ' ὅτι ὁ προσφέρων αὐτὸς δοξάζεται ἐν ᾧ προσφέρει, ἐὰν ἀποδεκτὸν ᾖ τὸ δῶρον αὐτοῦ. Διὰ γὰρ τοῦ δώρου καὶ ἡ πρὸς τὸν βασιλέα τιμὴ καὶ ἀγάπη δείκνυται</strong>· καὶ <strong>ὁ Κύριος, ἐν πάσῃ ἁπλότητι καὶ ἀκακίᾳ βουλόμενος ἡμᾶς <mark>προσφέρειν</mark></strong>, οὕτως ἐκήρυξεν· «Ἐὰν οὖν προσφέρῃς τὸ δῶρόν σου ἐπὶ τὸ θυσιαστήριον καὶ ἐκεῖ μνησθῇς ὅτι ὁ ἀδελφός σου ἔχει τι κατὰ σοῦ, ἄφες τὸ δῶρόν σου ἔμπροσθεν τοῦ θυσιαστηρίου καὶ ὕπαγε πρῶτον διαλλάγηθι τῷ ἀδελφῷ σου, καὶ τότε ἐλθὼν πρόσφερε τὸ δῶρόν σου» (Μθ. 5:23-24). <strong><mark>Δεῖ τοίνυν προσφέρειν τῷ Θεῷ τὰς ἀπαρχὰς τῆς κτίσεως αὐτοῦ</mark></strong>, καθὼς καὶ Μωσῆς λέγει· </em></p><p><em>«Οὐκ ὀφθήσῃ ἐνώπιον Κυρίου τοῦ Θεοῦ σου κενός» (Δευτ. 16:16), ἵνα ἐν οἷς εὐχάριστος ἐγένετο ὁ ἄνθρωπος, ἐν τούτοις εὐχάριστος λογισθεὶς τὴν παρ' αὐτοῦ τιμὴν ἀπολάβῃ. <strong>Καὶ <mark>οὐ τὸ γένος τῶν προσφορῶν ἀποδεδοκιμασμένον ἐστίν· εἰσὶ γὰρ κἀκεῖ προσφοραί, εἰσὶ δὲ καὶ ἐνταῦθα· θυσίαι ἐν τῷ λαῷ, θυσίαι καὶ ἐν τῇ Ἐκκλησίᾳ· ἀλλ' ἢ τὸ εἶδος μόνον ἠλλάγη</mark></strong>. &lt;…&gt; Ἐξ ἀρχῆς γὰρ <strong>ἐπεῖδεν ὁ Θεὸς ἐπὶ τοῖς δώροις Ἅβελ, ὅτι ἐν ἁπλότητι καὶ δικαιοσύνῃ προσέφερεν</strong>· ἐπὶ δὲ τῇ θυσίᾳ τοῦ Κάϊν οὐκ ἐπεῖδεν, ὅτι ἐν ζήλῳ καὶ κακίᾳ τῇ κατὰ τοῦ ἀδελφοῦ διῃρημένην εἶχεν τὴν καρδίαν. &lt;…&gt; Εἰ γάρ τις μόνον κατὰ τὸ φαινόμενον καθαρῶς καὶ ὀρθῶς καὶ νομίμως προσφέρειν ἐπιχειρήσειε, κατὰ δὲ τὴν ψυχὴν αὐτοῦ μὴ ὀρθῶς διαιρῇ τὴν πρὸς τὸν πλησίον κοινωνίαν, μηδὲ φόβον ἔχοι τοῦ Θεοῦ, οὐ διὰ τὸ ὀρθῶς ἔξωθεν προσενεχθῆναι τὴν θυσίαν ἀπατήσει τὸν Θεόν, ἁμαρτίαν ἔνδον ἔχων· </em></p><p><em>καὶ οὐδὲν ὠφελήσει αὐτὸν ἡ τοιαύτη προσφορά. &lt;…&gt; Ἐπειδὴ τοίνυν ἐν ἁπλότητι <strong>ἡ Ἐκκλησία προσφέρει, δικαίως τὸ δῶρον αὐτῆς καθαρὰ θυσία παρὰ τῷ Θεῷ ἐλογίσθη</strong>. &lt;…&gt; Δεῖ γὰρ <strong>ἡμᾶς <mark>τὴν προσφορὰν τῷ Θεῷ ποιεῖσθαι</mark> καὶ ἐν πᾶσιν εὐχαρίστους εὑρίσκεσθαι τῷ Ποιητῇ Θεῷ, ἐν γνώμῃ καθαρᾷ καὶ πίστει ἀνυποκρίτῳ, ἐν ἐλπίδι βεβαίᾳ, ἐν ἀγάπῃ θερμῇ, <mark>τὰς ἀπαρχὰς τῶν αὐτοῦ κτισμάτων προσφέροντας</mark></strong>. Καὶ ταύτην τὴν προσφορὰν μόνη ἡ Ἐκκλησία καθαρὰν προσφέρει τῷ Ποιητῇ, προσφέρουσα αὐτῷ μετ' εὐχαριστίας ἀπὸ τῆς κτίσεως αὐτοῦ. Ἰουδαῖοι δὲ οὐκέτι προσφέρουσιν· αἱ γὰρ χεῖρες αὐτῶν αἵματος πλήρεις· οὐ γὰρ ἐδέξαντο τὸν Λόγον, δι' οὗ προσφέρεται τῷ Θεῷ. Ἀλλ' οὐδὲ <strong>πᾶσαι αἱ τῶν αἱρετικῶν συναγωγαὶ προσφέρουσι τῷ Θεῷ</strong>. &lt;…&gt; Πῶς δὲ αὐτοῖς βέβαιον ἔσται τὸ τὸν ἄρτον ἐν ᾧ ηὐχαρίστηται σῶμα εἶναι τοῦ ἰδίου Κυρίου, καὶ τὸ ποτήριον τοῦ αἵματος αὐτοῦ, εἰ μὴ αὐτὸν τὸν Υἱὸν τοῦ Ποιητοῦ τοῦ κόσμου λέγοιεν, &lt;…&gt; Πῶς τὴν σάρκα λέγουσιν εἰς φθορὰν χωρεῖν καὶ μὴ μετέχειν τῆς ζωῆς τὴν ἀπὸ τοῦ σώματος τοῦ Κυρίου καὶ τοῦ αἵματος αὐτοῦ τρεφομένην; </em></p><p><em><strong>Ἢ τὴν γνώμην οὖν ἀλλαξάτωσαν, ἢ τὸ προσφέρειν τὰ εἰρημένα παραιτησάσθωσαν. Ἡμῖν δὲ σύμφωνος τῇ γνώμῃ ἡ εὐχαριστία καὶ ἡ εὐχαριστία βεβαιοῖ τὴν γνώμην.</strong> <strong><mark>Προσφέρομεν αὐτῷ τὰ ἴδια</mark></strong>, ἐμμελῶς κοινωνίαν καὶ ἕνωσιν καταγγέλλοντες σαρκὸς καὶ Πνεύματος. Ὡς γὰρ ὁ ἀπὸ τῆς γῆς ἄρτος προσλαβόμενος τὴν ἐπίκλησιν τοῦ Θεοῦ οὐκέτι κοινὸς ἄρτος ἐστίν, ἀλλ' <strong>εὐχαριστία</strong> ἐκ δύο πραγμάτων συνεστηκυῖα, ἐπιγείου τε καὶ οὐρανίου, οὕτως καὶ τὰ σώματα ἡμῶν μεταλαμβάνοντα τῆς <strong>εὐχαριστίας</strong> μηκέτι εἶναι φθαρτά, τὴν ἐλπίδα τῆς εἰς αἰῶνα ἀναστάσεως ἔχοντα. <strong><mark>Προσφέρομεν δὲ αὐτῷ οὐχ ὡς ἐνδεεῖ, ἀλλ' εὐχαριστοῦντες</mark> τῇ δεσποτείᾳ αὐτοῦ καὶ ἁγιάζοντες τὴν κτίσιν</strong>. &lt;…&gt; Ὥσπερ οὖν <strong><mark>οὐδενὸς τούτων δεῖται, βούλεται δὲ ὅμως ταῦτα γίνεσθαι ὑφ' ἡμῶν δι' ἡμᾶς αὐτούς</mark></strong>, ἵνα μὴ ἄκαρποι ὦμεν· </em></p><p><em>οὕτως <strong>αὐτὸς ὁ Λόγος ἔδωκε τῷ λαῷ ἐντολὴν τοῦ ποιεῖσθαι τὰς προσφοράς, καίπερ μὴ δεόμενος αὐτῶν, ἵνα μάθῃ δουλεύειν τῷ Θεῷ· οὕτω καὶ διὰ τοῦτο <mark>βούλεται καὶ ἡμᾶς προσφέρειν τὸ δῶρον τῷ θυσιαστηρίῳ πυκνῶς καὶ ἀδιαλείπτως</mark></strong>.</em></p></blockquote><p>(<a href="https://bibleox.com/grc/la/w/LATIN-Adversus_haereses%2C_LIBER_IV#HH-18-31">Κατὰ αἱρέσεων, βιβλ. Δ΄, κεφ. 18 (λατ.)</a>)</p><h3>Η άρνηση ότι για τη σωτηρία αρκεί μόνο η πίστη και η αγάπη, ενώ τα λοιπά (έργα, μυστήρια) είναι δήθεν αδιάφορα</h3><blockquote><p><strong><mark>Ἐν δὲ τοῖς συγγράμμασιν αὐτῶν οὕτως ἀναγέγραπται</mark></strong>, καὶ αὐτοὶ οὕτως ἐξηγοῦνται, τὸν Ἰησοῦν λέγοντες ἐν μυστηρίῳ τοῖς μαθηταῖς αὐτοῦ καὶ ἀποστόλοις κατ' ἰδίαν λελαληκέναι, καὶ αὐτοὺς ἀξιῶσαι, τοῖς ἀξίοις καὶ τοῖς πειθομένοις ταῦτα παραδιδόναι. <strong><mark>Διὰ πίστεως γὰρ καὶ ἀγάπης σώζεσθαι· τὰ δὲ λοιπὰ ἀδιάφορα ὄντα</mark></strong>, κατὰ τὴν δόξαν τῶν ἀνθρώπων, πῆ μὲν ἀγαθὰ, πῆ δὲ κακὰ νομίζεσθαι, οὐδενὸς φύσει κακοῦ ὑπάρχοντος.</p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/Az9E_%E1%BC%9C%CE%BB%CE%B5%CE%B3%CF%87%CE%BF%CF%82_%CE%BA%CE%B1%E1%BD%B6_%E1%BC%80%CE%BD%CE%B1%CF%84%CF%81%CE%BF%CF%80%E1%BD%B4_%CF%84%E1%BF%86%CF%82_%CF%88%CE%B5%CF%85%CE%B4%CF%89%CE%BD%CF%8D%CE%BC%CE%BF%CF%85_%CE%B3%CE%BD%CF%8E%CF%83%CE%B5%CF%89%CF%82_%CE%9A%CE%B1%CF%84%E1%BD%B0_%CE%B1%E1%BC%B1%CF%81%CE%AD%CF%83%CE%B5%CF%89%CE%BD__%CE%92%CE%B9%CE%B2%CE%BB%CE%AF%CE%BF%CE%BD_1#HH-25-20">Κατὰ αἱρέσεων, βιβλ. Α΄, κεφ. 25</a>)</p><h3>Η αναγκαιότητα του βαπτίσματος για τη σωτηρία</h3><blockquote><p>Καὶ ὥσπερ ἡ ξηρὰ γῆ, ἐὰν μὴ λάβῃ ὑγρασίαν, οὐ καρποφορεῖ, οὕτως καὶ ἡμεῖς, ξύλον ξηρὸν ὄντες τὸ πρῶτον, οὐκ ἄν ποτε ἐκαρποφορήσαμεν ζωήν, ἄνευ τῆς ἄνωθεν ἑκουσίου βροχῆς. Τὰ γὰρ <strong><mark>σώματα ἡμῶν διὰ τοῦ λουτροῦ ἐκείνου, τοῦ εἰς ἀφθαρσίαν ἄγοντος, τὴν ἑνότητα ἔλαβον, αἱ δὲ ψυχαὶ διὰ τοῦ Πνεύματος. Ὅθεν καὶ ἀμφότερα ἀναγκαῖα</mark></strong>, ἐπειδὴ ἀμφότερα προκόπτουσιν εἰς τὴν ζωὴν τοῦ Θεοῦ.</p></blockquote><p>(<a href="https://bibleox.com/grc/la/w/LATIN-Adversus_haereses%2C_LIBER_III#HH-17-18">Κατὰ αἱρέσεων, βιβλ. Γ΄, κεφ. 17 (λατ.)</a>)</p><blockquote><p>Διὰ τοῦτο καὶ ὁ Φίλιππος, ὅτε εὗρε τὸν εὐνοῦχον τῆς βασιλίσσης τῶν Αἰθιόπων ἀναγινώσκοντα τὰ γεγραμμένα· «Ὡς πρόβατον ἐπὶ σφαγὴν ἤχθη, καὶ ὡς ἀμνὸς ἐναντίον τοῦ κείροντος αὐτὸν ἄφωνος, οὕτως οὐκ ἤνοιξεν τὸ στόμα αὐτοῦ· ἐν τῇ ταπεινώσει αὐτοῦ ἡ κρίσις αὐτοῦ ἤρθη» (Ἠσ. 53:7· Πράξ. 8:27) καὶ τὰ λοιπὰ ὅσα περὶ τοῦ πάθους αὐτοῦ καὶ τῆς ἐν σαρκὶ παρουσίας, καὶ ὅτι ἠτιμώθη ὑπὸ τῶν μὴ πιστευόντων αὐτῷ, διεξῆλθεν ὁ προφήτης, ῥᾳδίως ἔπεισεν αὐτὸν πιστεῦσαι ὅτι οὗτός ἐστιν Ἰησοῦς ὁ Χριστός, ὁ ἐπὶ Ποντίου Πιλάτου σταυρωθεὶς καὶ παθὼν ὅσα προεῖπεν ὁ προφήτης, καὶ ὅτι αὐτός ἐστιν ὁ Υἱὸς τοῦ Θεοῦ, ὁ τὴν αἰώνιον ζωὴν τοῖς ἀνθρώποις διδούς. Καὶ εὐθὺς ὡς ἐβάπτισεν αὐτόν, ἀνεχώρησεν ἀπ' αὐτοῦ. <strong>Οὐδὲν γὰρ ἄλλο ἐνέλειπεν αὐτῷ τῷ ὑπὸ τῶν προφητῶν προκατηχηθέντι</strong>· </p><p>οὐ τὸν Θεὸν Πατέρα, οὐ τὴν τῆς πολιτείας διάταξιν, ἀλλὰ μόνον τὴν παρουσίαν ἠγνόει τοῦ Υἱοῦ τοῦ Θεοῦ· ἣν ὅτε ἐν βραχεῖ ἔγνω, ἐπορεύετο χαίρων, κῆρυξ ἐσόμενος ἐν Αἰθιοπίᾳ τῆς παρουσίας τοῦ Χριστοῦ. Διὸ οὐ πολὺν ἐκοπίασεν περὶ αὐτὸν ὁ Φίλιππος, ἐπεὶ ἐν φόβῳ Θεοῦ ἦν προητοιμασμένος ὑπὸ τῶν προφητῶν. Διὰ τοῦτο δὲ καὶ οἱ ἀπόστολοι, τὰ πρόβατα συλλέγοντες τὰ ἀπολωλότα τοῦ οἴκου Ἰσραήλ, ἐκ τῶν Γραφῶν αὐτοῖς διαλεγόμενοι ἀπεδείκνυον ὅτι Ἰησοῦς ὁ ἐσταυρωμένος οὗτός ἐστιν ὁ Χριστὸς ὁ Υἱὸς τοῦ Θεοῦ τοῦ ζῶντος, καὶ πλῆθος μέγα ἔπειθον, ὃ ὅμως εἶχεν τὸν φόβον πρὸς τὸν Θεόν· καὶ ἐν μιᾷ ἡμέρᾳ ἐβαπτίσθησαν ἄνθρωποι τρισχίλιοι, καὶ τετρακισχίλιοι, καὶ πεντακισχίλιοι.</p></blockquote><p>(<a href="https://bibleox.com/grc/la/w/LATIN-Adversus_haereses%2C_LIBER_IV#HH-23-37">Κατὰ αἱρέσεων, βιβλ. Δ΄, κεφ. 23 (λατ.)</a>)</p><h3>Το βάπτισμα των νηπίων</h3><blockquote><p><em>Τριάκοντα μὲν ἐτῶν ὑπάρχων, ὅτε ἦλθεν ἐπὶ τὸ βάπτισμα, ἔπειτα τὴν τελείαν τοῦ διδασκάλου ἡλικίαν ἔχων, ἦλθεν εἰς Ἱερουσαλήμ, ὥστε ὑπὸ πάντων δικαίως ἀκούεσθαι διδάσκαλος· οὐ γὰρ ἄλλο ἐφαίνετο καὶ ἄλλο ἦν, ὥς φασιν οἱ τὸ δοκεῖν εἰσάγοντες· ἀλλ' ὃ ἦν, τοῦτο καὶ ἐφαίνετο. Διδάσκαλος οὖν ὑπάρχων καὶ τὴν τοῦ διδασκάλου ἡλικίαν εἶχεν, οὐκ ἀποδοκιμάζων οὐδὲ ὑπερβαίνων τὸν ἄνθρωπον, οὐδὲ λύων τὸν ἑαυτοῦ νόμον ἐν ἑαυτῷ τοῦ ἀνθρωπίνου γένους, ἀλλὰ πᾶσαν ἡλικίαν ἁγιάζων διὰ τῆς πρὸς αὐτὸν ὁμοιότητος. <strong>Πάντας γὰρ ἦλθεν δι' ἑαυτοῦ σῶσαι</strong>· πάντας, φημί, <strong>τοὺς</strong> δι' αὐτοῦ<strong> <mark>ἀναγεννωμένους εἰς Θεόν</mark></strong>, <strong>νηπίους</strong> καὶ παιδία καὶ παῖδας καὶ νεανίσκους καὶ πρεσβυτέρους. Διὰ τοῦτο διὰ πάσης ἦλθεν ἡλικίας, καὶ τοῖς νηπίοις νήπιος ἐγένετο, ἁγιάζων τοὺς νηπίους· </em></p><p><em>ἐν τοῖς παιδίοις παιδίον, ἁγιάζων τοὺς ταύτην τὴν ἡλικίαν ἔχοντας, ἅμα καὶ παράδειγμα αὐτοῖς εὐσεβείας γενόμενος καὶ δικαιοσύνης καὶ ὑποταγῆς· ἐν τοῖς νεανίσκοις νεανίσκος, παράδειγμα τοῖς νεανίσκοις γινόμενος καὶ ἁγιάζων τῷ Κυρίῳ. Οὕτως καὶ ἐν τοῖς πρεσβυτέροις πρεσβύτης, ἵνα τέλειος ἐν πᾶσιν ᾖ διδάσκαλος, οὐ μόνον κατὰ τὴν ἔκθεσιν τῆς ἀληθείας, ἀλλὰ καὶ κατὰ τὴν ἡλικίαν, ἁγιάζων ἅμα καὶ τοὺς πρεσβυτέρους, παράδειγμα καὶ αὐτοῖς γινόμενος· ἔπειτα καὶ μέχρι θανάτου ἦλθεν, ἵνα ᾖ «πρωτότοκος ἐκ νεκρῶν καὶ ἐν πᾶσιν ἔχων τὰ πρωτεῖα» (Κολ. 1:18), «ἀρχηγὸς τῆς ζωῆς» (Πράξ. 3:15), πρῶτος πάντων καὶ προηγούμενος πάντων.</em></p></blockquote><p>(<a href="https://bibleox.com/grc/la/w/LATIN-Adversus_haereses_LIBER_II#HH-22-">Κατὰ αἱρέσεων, βιβλ. Β΄, κεφ. 22 (λατ.)</a>)</p><p>«<strong>Αναγέννηση στον Θεό</strong>» ονομάζεται το βάπτισμα (σταθερή έκφραση των αρχαίων χριστιανών). Ο άγιος Ειρηναίος το λέει κατά λέξη:</p><blockquote><p><em>Καὶ ὅτι μὲν εἰς ἐξάρνησιν <strong><mark>τοῦ βαπτίσματος τῆς εἰς Θεὸν ἀναγεννήσεως</mark></strong>, καὶ πάσης τῆς πίστεως ἀπόθεσιν ὑποβέβληται τὸ εἶδος τοῦ [τοῦτο] ὑπὸ τοῦ Σατανᾶ, ἐλέγχοντες αὐτοὺς ἀπαγγελοῦμεν ἐν τῷ προσήκοντι τόπῳ.</em></p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/Az9E_%E1%BC%9C%CE%BB%CE%B5%CE%B3%CF%87%CE%BF%CF%82_%CE%BA%CE%B1%E1%BD%B6_%E1%BC%80%CE%BD%CE%B1%CF%84%CF%81%CE%BF%CF%80%E1%BD%B4_%CF%84%E1%BF%86%CF%82_%CF%88%CE%B5%CF%85%CE%B4%CF%89%CE%BD%CF%8D%CE%BC%CE%BF%CF%85_%CE%B3%CE%BD%CF%8E%CF%83%CE%B5%CF%89%CF%82_%CE%9A%CE%B1%CF%84%E1%BD%B0_%CE%B1%E1%BC%B1%CF%81%CE%AD%CF%83%CE%B5%CF%89%CE%BD__%CE%92%CE%B9%CE%B2%CE%BB%CE%AF%CE%BF%CE%BD_1#HH-21-14">Κατὰ αἱρέσεων, βιβλ. Α΄, κεφ. 21</a>)</p><blockquote><p><em><strong>διδοὺς τοῖς μαθηταῖς ἐξουσίαν <mark>ἀναγεννήσεως εἰς Θεόν</mark></strong>, ἔλεγεν αὐτοῖς· «Πορευθέντες μαθητεύσατε πάντα τὰ ἔθνη,<strong> <mark>βαπτίζοντες</mark> αὐτοὺς εἰς τὸ ὄνομα τοῦ Πατρὸς καὶ τοῦ Υἱοῦ καὶ τοῦ Ἁγίου Πνεύματος</strong>» (Μτ. 28:19). Τοῦτον γὰρ ἐπηγγείλατο διὰ τῶν προφητῶν ἐκχέαι ἐν ἐσχάτοις καιροῖς ἐπὶ δούλους καὶ δούλας, ἵνα προφητεύσωσιν· ὅθεν καὶ ἐπὶ τὸν Υἱὸν τοῦ Θεοῦ, Υἱὸν τοῦ Ἀνθρώπου γενόμενον, κατῆλθεν.</em></p></blockquote><p>(<a href="https://bibleox.com/grc/la/w/LATIN-Adversus_haereses%2C_LIBER_III#HH-17-18">Κατὰ αἱρέσεων, βιβλ. Γ΄, κεφ. 17 (λατ.)</a>)</p><p>Τον όρο αυτόν τον χρησιμοποιεί και ο σύγχρονός του άγιος Ιουστίνος ο Μάρτυς:</p><blockquote><p><em>Χριστός, πρωτότοκος πάσης κτίσεως ὤν, καὶ ἀρχὴ πάλιν ἄλλου γένους γέγονε, τοῦ <strong><mark>ἀναγεννηθέντος</mark> ὑπ' αὐτοῦ <mark>δι' ὕδατος</mark> καὶ πίστεως</strong></em></p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%BF_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82-%CE%94%CE%B9%CE%AC%CE%BB%CE%BF%CE%B3%CE%BF_%CF%80%CF%81%CE%BF%CF%82_%CE%A4%CF%81%CF%8D%CF%86%CF%89%CE%BD%CE%B1#HH-138">Ἰουστῖνος, Διάλογος πρὸς Τρύφωνα, 138</a>)</p><blockquote><p><em>ἔπειτα <strong>ἄγονται ὑφ’ ἡμῶν ἔνθα ὕδωρ ἐστί, καὶ τρόπον ἀναγεννήσεως, ὃν καὶ ἡμεῖς αὐτοὶ ἀνεγεννήθημεν, <mark>ἀναγεννῶνται</mark>· ἐπ’ ὀνόματος γὰρ τοῦ πατρὸς τῶν ὅλων καὶ δεσπότου θεοῦ καὶ τοῦ σωτῆρος ἡμῶν Ἰησοῦ Χριστοῦ καὶ πνεύματος ἁγίου τὸ ἐν τῷ <mark>ὕδατι</mark> τότε <mark>λουτρὸν ποιοῦνται</mark></strong>.</em></p><p><em>4. καὶ γὰρ ὁ Χριστὸς εἶπεν· Ἂν μὴ ἀναγεννηθῆτε, οὐ μὴ εἰσέλθητε εἰς τὴν βασιλείαν τῶν οὐρανῶν.</em></p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/%CE%99%CE%BF%CF%85%CF%83%CF%84%CE%AF%CE%BD%CE%BF%CF%82_%CE%A6%CE%B9%CE%BB%CF%8C%CF%83%CE%BF%CF%86%CE%BF%CF%82_%E1%BC%88%CF%80%CE%BF%CE%BB%CE%BF%CE%B3%CE%AF%CE%B1_1#HH-61">Ἰουστῖνος, Ἀπολογία 1, 61</a>)</p><h3>Οι «άλλες γλώσσες» — ξένες γλώσσες</h3><p>Οι χριστιανοί μιλούσαν με θαυματουργικό τρόπο σε ξένες γλώσσες:</p><blockquote><p><em>Διὸ καὶ ὁ Ἀπόστολος λέγει· «Σοφίαν λαλοῦμεν ἐν τοῖς τελείοις», τελείους λέγων τοὺς εἰληφότας τὸ Πνεῦμα τοῦ Θεοῦ καὶ διὰ τοῦ Πνεύματος τοῦ Θεοῦ <strong><mark>λαλοῦντας <u>πάσαις</u> γλώσσαις</mark></strong>, καθὼς καὶ αὐτὸς ἐλάλει. Ὃν τρόπον καὶ <strong>πολλῶν ἠκούσαμεν ἀδελφῶν ἐν τῇ Ἐκκλησίᾳ προφητικὰ χαρίσματα ἐχόντων καὶ διὰ τοῦ Πνεύματος <mark><u>παντοδαπαῖς</u></mark> γλώσσαις λαλούντων, καὶ τὰ κρύφια τῶν ἀνθρώπων εἰς φανερὸν ἀγόντων <mark>πρὸς τὸ συμφέρον</mark> καὶ <mark>ἐξηγουμένων τὰ μυστήρια</mark> τοῦ Θεοῦ</strong>, οὓς καὶ πνευματικοὺς ὁ Ἀπόστολος καλεῖ, κατὰ μετοχὴν τοῦ Πνεύματος πνευματικοὺς ὄντας, οὐ κατὰ στέρησιν καὶ περιαίρεσιν τῆς σαρκὸς καὶ τὸ ψιλὸν τοῦτο μόνον.</em></p></blockquote><p>(<a href="https://bibleox.com/grc/la/w/LATIN-Adversus_haereses%2C_LIBER_V#HH-6">Κατὰ αἱρέσεων, βιβλ. Ε΄, κεφ. 6 (λατ.)</a>)</p><p>Μιλάει για έναν αιρετικό που, με απάτη και με τη βοήθεια δαιμονικών δυνάμεων, δεν έδινε χάρισμα, αλλά δίδασκε (όπως κάνουν οι σημερινοί πεντηκοστιανοί και χαρισματικοί) να ανοίγουν το στόμα και να λένε ό,τι ανοησία τούς έρθει στο μυαλό, πείθοντάς τους ότι δήθεν προφητεύουν:</p><blockquote><p><em>Εἰκὸς δὲ αὐτὸν καὶ <strong>δαίμονά τινα πάρεδρον ἔχειν, δι' οὗ αὐτός τε προφητεύειν δοκεῖ, καὶ ὅσας ἀξίας ἡγεῖται μετόχους τῆς χάριτος αὐτοῦ, προφητεύειν ποιεῖ</strong>. Μάλιστα γὰρ περὶ γυναῖκας ἀσχολεῖται, καὶ τούτων τοῦτο τὰς εὐπαρύφους, καὶ περιπορφύρους, καὶ πλουσιωτάτας, ἃς πολλάκις ὑπάγεσθαι πειρώμενος, κολακεύων φησὶν αὐταῖς· Μεταδοῦναί σοι θέλω τῆς ἐμῆς χάριτος, ἐπειδὴ ὁ Πατὴρ τῶν ὅλων τὸν ἄγγελόν σου διαπαντὸς βλέπει πρὸ προσώπου αὑτοῦ· ὁ δὲ τόπος τοῦ μεγέθους ἐν ἡμῖν ἐστι δι' ἡμᾶς &lt;…&gt; δεῖ ἡμᾶς ἓν καταστῆσαι. Λάμβανε πρῶτον ἀπ' ἐμοῦ, καὶ δι' ἐμοῦ τὴν χάριν. Εὐτρέπισον σεαυτὴν, ὡς νύμφη ἐκδεχομένη τὸν νυμφίον ἑαυτῆς, ἵνα ἔσῃ ὃ ἐγὼ, καὶ ἐγὼ ὃ σύ. Καθίδρυσον ἐν τῷ νυμφῶνί σου τὸ σπέρμα τοῦ φωτός. Λάβε παρ' ἐμοῦ τὸν νυμφίον, καὶ χώρησον αὐτὸν, καὶ χωρήθητι ἐν αὐτῷ. </em></p><p><em><strong>Ἰδοὺ ἡ χάρις κατῆλθεν ἐπί σε· ἄνοιξον τὸ στόμα σου, καὶ προφήτευσον. Τῆς δὲ γυναικὸς ἀποκρινομένης, οὐ προεφήτευσα πώποτε, καὶ οὐκ οἶδα προφητεύειν· ἐπικλήσεις τινὰς ποιούμενος ἐκ δευτέρου εἰς κατάπληξιν τῆς ἀπατωμένης, φησὶν αὐτῇ· Ἄνοιξον τὸ στόμα σου, λάλησον ὅ τι δήποτε, καὶ προφητεύσεις</strong>. Ἡ δὲ χαυνωθεῖσα, καὶ κεπφωθεῖσα ὑπὸ τῶν προειρημένων, διαθερμανθεῖσα τὴν ψυχὴν ὑπὸ τῆς προσδοκίας τοῦ μέλλειν αὐτὴν προφητεύειν, τῆς καρδίας πλέον τοῦ δέοντος παλλούσης, <strong>ἀποτολμᾷ λαλεῖν &lt;…&gt; καὶ λαλεῖ ληρώδη καὶ τὰ τυχόντα πάντα κενῶς καὶ τολμηρῶς, ἅτε ὑπὸ κενοῦ τεθερμαμένη πνεύματος</strong> &lt;…&gt;</em></p></blockquote><p>(<a href="https://bibleox.com/grc/grc/w/Az9E_%E1%BC%9C%CE%BB%CE%B5%CE%B3%CF%87%CE%BF%CF%82_%CE%BA%CE%B1%E1%BD%B6_%E1%BC%80%CE%BD%CE%B1%CF%84%CF%81%CE%BF%CF%80%E1%BD%B4_%CF%84%E1%BF%86%CF%82_%CF%88%CE%B5%CF%85%CE%B4%CF%89%CE%BD%CF%8D%CE%BC%CE%BF%CF%85_%CE%B3%CE%BD%CF%8E%CF%83%CE%B5%CF%89%CF%82_%CE%9A%CE%B1%CF%84%E1%BD%B0_%CE%B1%E1%BC%B1%CF%81%CE%AD%CF%83%CE%B5%CF%89%CE%BD__%CE%92%CE%B9%CE%B2%CE%BB%CE%AF%CE%BF%CE%BD_1#HH-13-7">Κατὰ αἱρέσεων, βιβλ. Α΄, κεφ. 13</a>)</p><h3>Ελευθερία από τα δεσμά του νόμου του Μωυσή</h3><blockquote><p>2. Καὶ γὰρ ὁ νόμος, ἅτε δούλοις κείμενος, διὰ τῶν ἔξωθεν σωματικῶν ἐπαίδευε τὴν ψυχήν, οἷον δεσμῷ ἕλκων αὐτὴν εἰς τὴν ὑπακοὴν τῶν ἐντολῶν, ἵνα μάθῃ ὁ ἄνθρωπος δουλεύειν Θεῷ· ὁ δὲ Λόγος ἐλευθερώσας τὴν ψυχὴν καὶ δι' αὐτῆς τὸ σῶμα ἑκουσίως καθαίρεσθαι ἐδίδαξεν. Οὗ γενομένου <strong><mark>ἀναγκαῖον ἦν ἀρθῆναι μὲν τοὺς δεσμοὺς τῆς δουλείας</mark></strong>, οἷς ἤδη ὁ ἄνθρωπος εἴθιστο, καὶ <strong><mark>ἄνευ δεσμῶν ἀκολουθεῖν τῷ Θεῷ</mark></strong>, ἐπεκταθῆναι δὲ τὰ τῆς ἐλευθερίας δόγματα καὶ αὐξηθῆναι τὴν πρὸς τὸν βασιλέα ὑποταγήν, ἵνα μὴ ἀναποδίσας τις ἀνάξιος φανῇ τῷ ἑαυτὸν ἐλευθερώσαντι· τὴν δὲ πρὸς τὸν οἰκοδεσπότην εὐσέβειαν καὶ ὑπακοὴν τὴν αὐτὴν μὲν εἶναι καὶ δούλοις καὶ ἐλευθέροις, μείζονα δὲ τὴν παρρησίαν ἔχειν τοὺς ἐλευθέρους, ὅτι <strong>μείζων καὶ ἐνδοξοτέρα ἡ τῆς ἐλευθερίας ἐνέργεια ἢ ἡ ἐν τῇ δουλείᾳ ὑπακοή</strong>. …</p><p>Οὗτος δέ ἐστιν ὁ Κύριος ἡμῶν, ὁ τοῦ Θεοῦ Λόγος, <strong><mark>ὁ πρῶτον μὲν δούλους εἵλκυσε πρὸς τὸν Θεόν, ἔπειτα δὲ ἠλευθέρωσεν τοὺς ὑποταγέντας αὐτῷ</mark></strong>, καθὼς αὐτὸς λέγει τοῖς μαθηταῖς· «Οὐκέτι ὑμᾶς λέγω δούλους, ὅτι ὁ δοῦλος οὐκ οἶδεν τί ὁ κύριος αὐτοῦ ποιεῖ· ὑμᾶς δὲ εἴρηκα φίλους, ὅτι πάντα ἃ ἤκουσα παρὰ τοῦ Πατρός μου ἐγνώρισα ὑμῖν» (Ἰω. 15,15). Ἐν γὰρ τῷ λέγειν· «Οὐκέτι ὑμᾶς λέγω δούλους» σαφέστατα ἐσήμανεν ἑαυτὸν εἶναι τὸν <strong><mark>πρῶτον μὲν τὴν πρὸς Θεὸν δουλείαν τοῖς ἀνθρώποις διὰ τοῦ νόμου καταστησάμενον, ἔπειτα δὲ τὴν ἐλευθερίαν αὐτοῖς δωρησάμενον</mark></strong>. Ἐν δὲ τῷ λέγειν· «Ὁ δοῦλος οὐκ οἶδεν τί ποιεῖ ὁ κύριος αὐτοῦ» τὴν ἄγνοιαν τοῦ δουλικοῦ λαοῦ περὶ τῆς παρουσίας αὐτοῦ δηλοῖ. Ἐν δὲ τῷ λέγειν τοὺς ἑαυτοῦ μαθητὰς φίλους φανερῶς δείκνυσιν ἑαυτὸν εἶναι τὸν τοῦ Θεοῦ Λόγον, ᾧ καὶ Ἀβραὰμ ἑκουσίως καὶ ἄνευ δεσμῶν διὰ τὴν εὐγένειαν τῆς πίστεως ἀκολουθήσας φίλος ἐγένετο Θεοῦ (Ἰακ. 2,23).</p></blockquote><p>(<a href="https://bibleox.com/grc/la/w/LATIN-Adversus_haereses%2C_LIBER_IV#HH-13-24">Κατὰ αἱρέσεων, βιβλ. Δ΄, κεφ. 13 (λατ.)</a>)</p><blockquote><p><em>οἱ ἄνθρωποι <strong><mark>ζήσονται οὐκ ἐν πολυλογίαις τοῦ νόμου, ἀλλ' ἐν βραχύτητι τῆς πίστεως καὶ τῆς ἀγάπης</mark></strong>, καὶ περὶ τούτου Ἠσαΐας οὕτως λέγει· «Λόγον βραχὺν καὶ ἀκριβῆ ἐν δικαιοσύνῃ, ὅτι λόγον συντετμημένον ποιήσει ὁ Θεὸς ἐν ὅλῃ τῇ γῇ» (Ἠσ. 10,22–23). Καὶ διὰ τοῦτο ὁ ἀπόστολος Παῦλος λέγει· «Ἡ ἀγάπη πλήρωμα νόμου ἐστίν» (Ῥωμ. 13,10)· <strong><mark>ὁ γὰρ ἀγαπῶν τὸν Θεὸν τὸν νόμον πεπλήρωκεν</mark></strong>. Οὕτως δὲ καὶ ὁ Κύριος, ὅτε αὐτὸν ἠρώτησαν ποία ἐντολὴ μεγίστη ἐστίν, ἀπεκρίνατο· «Ἀγαπήσεις Κύριον τὸν Θεόν σου ἐξ ὅλης τῆς καρδίας σου καὶ ἐξ ὅλης τῆς ἰσχύος σου· καὶ ἡ δευτέρα ὁμοία αὐτῇ· ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν. Ἐν ταύταις ταῖς δυσὶν ἐντολαῖς ὅλος ὁ νόμος καὶ οἱ προφῆται κρέμανται» (Μάρκ. 12,30 ἑξῆς· Ματθ. 22,37 ἑξῆς). Διὰ τῆς εἰς αὐτὸν πίστεως τὴν πρὸς Θεὸν καὶ πρὸς τὸν πλησίον ἀγάπην ἡμῶν αὔξει, δι' ἧς εὐσεβεῖς καὶ δίκαιοι καὶ ἀγαθοὶ γινόμεθα· καὶ διὰ τοῦτο «Λόγον συντετμημένον ἐποίησεν ἐπὶ τῆς γῆς, ἐν ὅλῃ τῇ οἰκουμένῃ». …</em></p><p><em><strong><mark>Ὅτι οὐ θέλει ἐπανάγειν τοὺς λελυτρωμένους εἰς τὴν νομοθεσίαν Μωϋσέως – ὁ γὰρ νόμος ἐν τῷ Χριστῷ πεπλήρωται – ἀλλ' ὅτι δεῖ ζῆν πίστει καὶ ἀγάπῃ</mark></strong> ἐκ τοῦ Υἱοῦ τοῦ Θεοῦ κατὰ τὴν καινότητα τοῦ λόγου τούτου, περὶ τούτου Ἠσαΐας οὕτως ἀπαγγέλλει· «<strong>Μὴ μνημονεύετε τὰ πρῶτα καὶ τὰ ἀρχαῖα μὴ συλλογίζεσθε. Ἰδοὺ ποιῶ καινά</strong>, ἃ νῦν ἀνατέλλει, καὶ γνώσεσθε αὐτά· καὶ ποιήσω ἐν τῇ ἐρήμῳ ποταμοὺς καὶ ἐν τῇ ἀνύδρῳ χειμάρρους, ποτίσαι τὸν λαόν μου τὸν ἐκλεκτόν, τὸν λαόν μου ὃν περιεποιησάμην, ὅπως τὴν ἀρετήν μου διηγήσηται» (Ἠσ. 43,19–21). Ἔρημος δὲ καὶ ἄνυδρος πρότερον ἦν ἡ τῶν ἐθνῶν κλῆσις· οὐδὲ γὰρ ὁ Λόγος δι' αὐτῆς διῆλθεν, οὐδὲ ἐπότισεν αὐτὴν τὸ Πνεῦμα τὸ Ἅγιον, ὅπερ ὡδοιπόρησεν ὁδὸν καινὴν εὐσεβείας καὶ δικαιοσύνης καὶ ἀνέβλυσεν ῥεύματα ἄφθονα, τουτέστιν ἐπὶ τῆς γῆς ἐξέχεεν τὸ Πνεῦμα τὸ Ἅγιον, καθὼς ἐπηγγείλατο διὰ τῶν προφητῶν ἐν ταῖς ἐσχάταις ἡμέραις ἐκχέαι τὸ Πνεῦμα ἐπὶ πᾶσαν τὴν γῆν.</em></p><p><em>90. Οὕτως οὖν <strong><mark>ἡ κλῆσις ἡμῶν δι' ἀνακαινώσεως τοῦ πνεύματος καὶ οὐκ ἐν τῷ παλαιώματι ἡμῶν</mark></strong>, καθὼς προεφήτευσεν Ἱερεμίας …</em></p><p><em>Ἡ πρώτη σύναξις (τουτέστιν ἡ Ἐκκλησία) ἄνδρα εἶχεν αὐτὸν τὸν νόμον. …</em></p><p><em>Ἐπειδὴ γὰρ διὰ ταύτης τῆς κλήσεως ἡμῖν ἡ ζωὴ δέδοται, καὶ ἐπεὶ ὁ Θεὸς τὴν πίστιν Ἀβραὰμ τὴν εἰς αὐτὸν ἐν ἡμῖν αὖθις εἰς τελείωσιν ἤγαγεν, οἶμαι <strong>δεῖν ἡμᾶς <mark>μηκέτι ἐπανέρχεσθαι πρὸς τὴν πρώτην νομοθεσίαν.</mark> Τὸν γὰρ Κύριον τοῦ νόμου ἐλάβομεν, τὸν Υἱὸν τοῦ Θεοῦ. Καὶ διὰ τῆς εἰς αὐτὸν πίστεως διδασκόμεθα ἀγαπᾶν τὸν Θεὸν ἐξ ὅλης τῆς καρδίας καὶ τοὺς πλησίον ὡς ἑαυτούς</strong>. Ἡ δὲ πρὸς Θεὸν ἀγάπη μακράν ἐστιν πάσης ἁμαρτίας, καὶ ἡ πρὸς τὸν πλησίον ἀγάπη κακὸν τῷ πλησίον οὐκ ἐργάζεται (πρβλ. Ῥωμ. 13,10).</em></p><p><em>96. Διὰ τοῦτο <strong><mark>οὐ χρείαν ἔχομεν νόμου τινὸς ὡς παιδαγωγοῦ</mark></strong>· ἰδοὺ γὰρ τῷ Πατρὶ λαλοῦμεν καὶ ἐνώπιον αὐτοῦ ἱστάμεθα πρόσωπον πρὸς πρόσωπον, νήπιοι ἐν τῇ κακίᾳ γενόμενοι καὶ ἐν δικαιοσύνῃ καὶ εὐκοσμίᾳ κραταιωθέντες. <strong>Ὁ νόμος οὐκέτι ἐρεῖ· «Οὐ μοιχεύσεις» τῷ μηκέτι ἐπιθυμίαν πονηρὰν ἐπὶ γυναῖκα ἀλλοτρίαν προσδεχομένῳ· καὶ ὁ νόμος οὐκέτι ἐρεῖ· «Οὐ φονεύσεις» τῷ πᾶσαν ὀργὴν καὶ πᾶσαν ἔχθραν ἀφ' ἑαυτοῦ ἀποθεμένῳ· οὐκ ἐρεῖ· «Οὐκ ἐπιθυμήσεις τὸν οἶκον τοῦ πλησίον σου, οὐδὲ τὸν βοῦν αὐτοῦ, οὐδὲ τὸν ὄνον αὐτοῦ» τοῖς μηδὲν ὅλως φροντίζουσι τῶν ἐπιγείων, ἀλλὰ τοὺς οὐρανίους καρποὺς συνάγουσιν· καὶ οὐκ ἐρεῖ· «Ὀφθαλμὸν ἀντὶ ὀφθαλμοῦ καὶ ὀδόντα ἀντὶ ὀδόντος» (Ἐξ. 21,24) τῷ μηδένα νομίζοντι ἐχθρὸν ἑαυτοῦ, ἀλλὰ πάντας πλησίον ἑαυτοῦ· διὸ οὐδέποτε δύναται τὰς χεῖρας ἑαυτοῦ ἐκτείνειν πρὸς ἐκδίκησιν. Οὐκ ἔστιν ἀπαιτῆσαι δεκάτην παρὰ τοῦ πᾶσαν τὴν ὕπαρξιν ἑαυτοῦ προσφέροντος τῷ Θεῷ καὶ ἀφιέντος πατέρα, μητέρα καὶ πᾶσαν τὴν συγγένειαν ἑαυτοῦ καὶ ἀκολουθοῦντος τῷ Λόγῳ τοῦ Θεοῦ. Καὶ <mark>οὐκ ἐντέταλται ἡμέραν ἐν ἀναπαύσει καὶ σχολῇ διάγειν τῷ καθ' ἑκάστην ἡμέραν σαββατίζοντι, τουτέστιν ἐν τῷ ναῷ τοῦ Θεοῦ, ὅ ἐστιν τὸ σῶμα τοῦ ἀνθρώπου, τὴν ἀξίαν λατρείαν τῷ Θεῷ ἐπιτελοῦντι καὶ πάσῃ ὥρᾳ δικαιοσύνην ποιοῦντι</mark>. «Ἔλεον γὰρ θέλω καὶ οὐ θυσίαν, – φησίν, – καὶ γνῶσιν Θεοῦ ἢ ὁλοκαυτώματα»</strong> (Ὡσ. 6,6).</em></p></blockquote><p>(Δοκίμιον τῆς ἀποστολικῆς κηρύξεως, 87)</p><h3>Το Σάββατο (η δικαιοσύνη) κάθε ημέρα</h3><blockquote><p>Καὶ ὅτι τὴν περιτομὴν <strong>οὐχ ὡς τελειωτικὴν δικαιοσύνης</strong>, ἀλλ' ἐν σημεῖῳ ἔδωκεν ὁ Θεός, ἵνα γνωστὸν διαμένῃ τὸ γένος Ἀβραάμ, ἐξ αὐτῆς τῆς Γραφῆς μανθάνομεν. Εἶπεν γάρ, φησίν, ὁ Θεὸς πρὸς Ἀβραάμ· «Περιτμηθήσεται πᾶν ἀρσενικὸν ὑμῶν, καὶ περιτμήσετε τὴν σάρκα τῆς ἀκροβυστίας ὑμῶν ἐν σημεῖῳ διαθήκης ἀνὰ μέσον ἐμοῦ καὶ ὑμῶν» (Γέν. 17,10–11). <strong>Τὸ αὐτὸ δὲ καὶ περὶ τῶν σαββάτων Ἰεζεκιὴλ ὁ προφήτης φησίν</strong>· «Καὶ τὰ <strong>σάββατά μου</strong> ἔδωκα αὐτοῖς, ἵνα ὦσιν ἐν σημεῖῳ ἀνὰ μέσον ἐμοῦ καὶ αὐτῶν, ἵνα γνῶσιν ὅτι ἐγώ εἰμι Κύριος ὁ ἁγιάζων αὐτούς» (Ἰεζ. 20,12). Καὶ ἐν τῇ Ἐξόδῳ ὁ Θεὸς λέγει τῷ Μωϋσεῖ· «Καὶ τὰ <strong>σάββατά μου</strong> φυλάξεσθε· ἔσται γὰρ σημεῖον ἀνὰ μέσον ἐμοῦ καὶ ὑμῶν εἰς τὰς γενεὰς ὑμῶν» (Ἐξ. 31,13). <strong>Ἐν σημεῖῳ ἄρα δέδοται ταῦτα· </strong></p><p><strong>οὐκ ἦν δὲ ἄνευ συμβόλου τὰ σημεῖα, τουτέστιν ἄνευ ἐπιχειρήματος, οὐδὲ ἀργά, ὡς ἂν ὑπὸ σοφοῦ τεχνίτου διδόμενα</strong>· ἀλλ' ἡ κατὰ σάρκα περιτομὴ προεσήμαινεν τὴν πνευματικήν. Καὶ γὰρ ἡμεῖς, φησὶν ὁ Ἀπόστολος, περιτετμήμεθα περιτομῇ ἀχειροποιήτῳ (Κολ. 2,11). Καὶ ὁ προφήτης φησίν· «Περιτμήθητε τὴν σκληροκαρδίαν ὑμῶν» (Δευτ. 10,16). <strong>Τὰ δὲ σάββατα <mark>τὴν <mark>δι' ὅλης τῆς ἡμέρας</mark> εἰς τὸν Θεὸν ἐπιμονὴν τῆς ὑπηρεσίας</mark> ἐδίδασκεν</strong>. <strong>Ἐλογίσθημεν γάρ, φησὶν ὁ Ἀπόστολος Παῦλος, ὅλην τὴν ἡμέραν ὡς πρόβατα σφαγῆς</strong> (Ῥωμ. 8,36), τουτέστιν <strong><mark>ἀφιερωθέντες καὶ παντὶ χρόνῳ τῇ πίστει ἡμῶν ὑπηρετοῦντες καὶ ἐμμένοντες αὐτῇ, καὶ ἀπεχόμενοι πάσης πλεονεξίας, μὴ κτώμενοι μηδὲ κεκτημένοι θησαυροὺς ἐπὶ τῆς γῆς</mark></strong>. <strong>Ἐφανεροῦτο δὲ καὶ ἡ τοῦ Θεοῦ ἀνάπαυσις ἡ μετὰ τὴν κτίσιν τῶν γεγονότων, τουτέστιν ἡ βασιλεία, ἐν ᾗ ἀναπαυσόμενος ὁ ἄνθρωπος ἐκεῖνος ὁ ἐμμείνας τῷ Θεῷ παραστῆναι μεθέξει τῆς τραπέζης τοῦ Θεοῦ</strong>. </p><p>Καὶ ὅτι οὐ διὰ τούτων ἐδικαιοῦτο ὁ ἄνθρωπος, ἀλλ' ἐν σημεῖῳ ἐδόθη τῷ λαῷ, δείκνυσιν ὅτι αὐτὸς ὁ <strong>Ἀβραὰμ <mark>ἄνευ περιτομῆς καὶ ἄνευ τηρήσεως σαββάτων</mark> «ἐπίστευσεν τῷ Θεῷ, καὶ ἐλογίσθη αὐτῷ εἰς δικαιοσύνην</strong>, καὶ φίλος Θεοῦ ἐκλήθη» (Ἰακ. 2,23). Καὶ ὁ <strong>Λὼτ</strong> ἄνευ περιτομῆς ἐξήχθη ἀπὸ τῶν Σοδόμων, τὴν σωτηρίαν παρὰ τοῦ Θεοῦ λαβών. Ὁμοίως δὲ καὶ ὁ <strong>Νῶε</strong> εὐαρεστήσας τῷ Θεῷ καίπερ ἀπερίτμητος ὤν, ἔλαβεν τὰ μέτρα τοῦ κόσμου τῆς δευτέρας γενεᾶς.</p></blockquote><p>(<a href="https://bibleox.com/grc/la/w/LATIN-Adversus_haereses%2C_LIBER_IV#HH-16-27">Κατὰ αἱρέσεων, βιβλ. Δ΄, κεφ. 16 (λατ.)</a>)</p><h3>Η προτυπική σημασία του Σαββάτου</h3><blockquote><p><em>«Θῦσον τῷ Θεῷ θυσίαν αἰνέσεως, καὶ ἀπόδος τῷ Ὑψίστῳ τὰς εὐχάς σου· καὶ ἐπικάλεσαί με ἐν ἡμέρᾳ θλίψεώς σου, καὶ ἐξελοῦμαί σε, καὶ δοξάσεις με» (Ψαλμ. 49,14–15), – <strong>ἀποποιούμενος μὲν ἐκεῖνα δι' ὧν οἱ ἁμαρτάνοντες ἐνόμιζον ἐξιλάσκεσθαι τὸν Θεόν</strong>, δεικνὺς δὲ ὅτι αὐτὸς οὐδενὸς ἐπιδεής ἐστιν, προτρεπόμενος δὲ καὶ ὑποδεικνὺς ἐκεῖνα δι' ὧν ὁ ἄνθρωπος δικαιοῦται καὶ ἐγγίζει τῷ Θεῷ. Τὸ αὐτὸ δὲ καὶ Ἠσαΐας λέγει· «Τί μοι πλῆθος τῶν θυσιῶν ὑμῶν; λέγει Κύριος· πλήρης εἰμί» (Ἠσ. 1,11). Καὶ <strong><mark>ἀποποιησάμενος</mark> τὰ ὁλοκαυτώματα καὶ τὰς θυσίας καὶ τὰς προσφορὰς καὶ ἔτι τὰς νουμηνίας καὶ <mark>τὰ σάββατα</mark> καὶ τὰς ἑορτὰς καὶ τὴν λοιπὴν πᾶσαν τὴν ἑπομένην αὐτοῖς παρατήρησιν, ἐπήγαγεν, <mark>παραινῶν αὐτοῖς τὰ σωτηριώδη</mark>· «Λούσασθε, καθαροὶ γένεσθε, <mark>ἀφέλετε τὰς πονηρίας ἀπὸ τῶν καρδιῶν ὑμῶν</mark> ἀπὸ τῶν ὀφθαλμῶν μου</strong>· <strong>παύσασθε ἀπὸ τῶν κακιῶν ὑμῶν, μάθετε καλὸν ποιεῖν, ἐκζητήσατε κρίμα, ῥύσασθε τὸν ἀδικούμενον, κρίνατε ὀρφανῷ, καὶ δικαιώσατε χήραν, καὶ δεῦτε καὶ διαλεχθῶμεν, λέγει Κύριος» (Ἠσ. 1,16–18).</strong></em></p></blockquote><p>(<a href="https://bibleox.com/grc/la/w/LATIN-Adversus_haereses%2C_LIBER_IV#HH-17-29">Κατὰ αἱρέσεων, βιβλ. Δ΄, κεφ. 17 (λατ.)</a>)</p><blockquote><p><em>1. Καὶ ὅτι τὴν περιτομὴν οὐχ ὡς τελειωτικὴν δικαιοσύνης, ἀλλ' ἐν σημεῖῳ ἔδωκεν ὁ Θεός, ἵνα γνωστὸν διαμένῃ τὸ γένος Ἀβραάμ, ἐξ αὐτῆς τῆς Γραφῆς μανθάνομεν. Εἶπεν γάρ, φησίν, ὁ Θεὸς πρὸς Ἀβραάμ· «Περιτμηθήσεται πᾶν ἀρσενικὸν ὑμῶν, καὶ περιτμήσετε τὴν σάρκα τῆς ἀκροβυστίας ὑμῶν ἐν σημεῖῳ διαθήκης ἀνὰ μέσον ἐμοῦ καὶ ὑμῶν» (Γέν. 17,10–11). Τὸ αὐτὸ δὲ καὶ περὶ τῶν σαββάτων Ἰεζεκιὴλ ὁ προφήτης φησίν· «Καὶ τὰ σάββατά μου ἔδωκα αὐτοῖς, ἵνα ὦσιν ἐν σημεῖῳ ἀνὰ μέσον ἐμοῦ καὶ αὐτῶν, ἵνα γνῶσιν ὅτι ἐγώ εἰμι Κύριος ὁ ἁγιάζων αὐτούς» (Ἰεζ. 20,12). Καὶ ἐν τῇ Ἐξόδῳ ὁ Θεὸς λέγει τῷ Μωϋσεῖ· «Καὶ τὰ σάββατά μου φυλάξεσθε· ἔσται γὰρ σημεῖον ἀνὰ μέσον ἐμοῦ καὶ ὑμῶν εἰς τὰς γενεὰς ὑμῶν» (Ἐξ. 31,13). <strong><mark>Ἐν σημεῖῳ ἄρα δέδοται ταῦτα· </mark></strong></em></p><p><em><strong><mark>οὐκ ἦν δὲ ἄνευ συμβόλου τὰ σημεῖα, τουτέστιν ἄνευ ἐπιχειρήματος, οὐδὲ ἀργά, ὡς ἂν ὑπὸ σοφοῦ τεχνίτου διδόμενα</mark></strong>· ἀλλ' <strong>ἡ κατὰ σάρκα περιτομὴ προεσήμαινεν τὴν πνευματικήν</strong>. Καὶ γὰρ ἡμεῖς, φησὶν ὁ Ἀπόστολος, περιτετμήμεθα περιτομῇ ἀχειροποιήτῳ (Κολ. 2,11). Καὶ ὁ προφήτης φησίν· «Περιτμήθητε τὴν σκληροκαρδίαν ὑμῶν» (Δευτ. 10,16). <strong><mark>Τὰ δὲ σάββατα τὴν δι' ὅλης τῆς ἡμέρας εἰς τὸν Θεὸν ἐπιμονὴν τῆς ὑπηρεσίας ἐδίδασκεν</mark>. Ἐλογίσθημεν γάρ, φησὶν ὁ Ἀπόστολος Παῦλος, ὅλην τὴν ἡμέραν ὡς πρόβατα σφαγῆς (Ῥωμ. 8,36), τουτέστιν ἀφιερωθέντες καὶ <mark>παντὶ χρόνῳ τῇ πίστει ἡμῶν ὑπηρετοῦντες καὶ ἐμμένοντες αὐτῇ, καὶ ἀπεχόμενοι πάσης πλεονεξίας, μὴ κτώμενοι μηδὲ κεκτημένοι θησαυροὺς ἐπὶ τῆς γῆς</mark>.</strong> <strong><mark>Ἐφανεροῦτο δὲ καὶ ἡ τοῦ Θεοῦ ἀνάπαυσις ἡ μετὰ τὴν κτίσιν τῶν γεγονότων, τουτέστιν ἡ βασιλεία, ἐν ᾗ ἀναπαυσόμενος ὁ ἄνθρωπος ἐκεῖνος ὁ ἐμμείνας τῷ Θεῷ παραστῆναι μεθέξει τῆς τραπέζης τοῦ Θεοῦ.</mark></strong></em></p><p><em>2. Καὶ ὅτι <strong><mark>οὐ διὰ τούτων ἐδικαιοῦτο ὁ ἄνθρωπος, ἀλλ' ἐν σημεῖῳ ἐδόθη τῷ λαῷ</mark></strong>, δείκνυσιν ὅτι αὐτὸς ὁ <strong>Ἀβραὰμ ἄνευ περιτομῆς καὶ ἄνευ τηρήσεως σαββάτων «ἐπίστευσεν τῷ Θεῷ, καὶ ἐλογίσθη αὐτῷ εἰς δικαιοσύνην</strong>, καὶ φίλος Θεοῦ ἐκλήθη» (Ἰακ. 2,23).</em></p></blockquote><p>(<a href="https://bibleox.com/grc/la/w/LATIN-Adversus_haereses%2C_LIBER_IV#HH-16-27">Κατὰ αἱρέσεων, βιβλ. Δ΄, κεφ. 16 (λατ.)</a>)</p><blockquote><p><em>96. Διὰ τοῦτο <strong>οὐ χρείαν ἔχομεν νόμου τινὸς ὡς παιδαγωγοῦ</strong>· ἰδοὺ γὰρ τῷ Πατρὶ λαλοῦμεν καὶ ἐνώπιον αὐτοῦ ἱστάμεθα πρόσωπον πρὸς πρόσωπον, νήπιοι ἐν τῇ κακίᾳ γενόμενοι καὶ ἐν δικαιοσύνῃ καὶ εὐκοσμίᾳ κραταιωθέντες. Ὁ νόμος οὐκέτι ἐρεῖ· «Οὐ μοιχεύσεις» τῷ μηκέτι ἐπιθυμίαν πονηρὰν ἐπὶ γυναῖκα ἀλλοτρίαν προσδεχομένῳ· καὶ ὁ νόμος οὐκέτι ἐρεῖ· «Οὐ φονεύσεις» τῷ πᾶσαν ὀργὴν καὶ πᾶσαν ἔχθραν ἀφ' ἑαυτοῦ ἀποθεμένῳ· οὐκ ἐρεῖ· «Οὐκ ἐπιθυμήσεις τὸν οἶκον τοῦ πλησίον σου, οὐδὲ τὸν βοῦν αὐτοῦ, οὐδὲ τὸν ὄνον αὐτοῦ» τοῖς μηδὲν ὅλως φροντίζουσι τῶν ἐπιγείων, ἀλλὰ τοὺς οὐρανίους καρποὺς συνάγουσιν· καὶ οὐκ ἐρεῖ· «Ὀφθαλμὸν ἀντὶ ὀφθαλμοῦ καὶ ὀδόντα ἀντὶ ὀδόντος» (Ἐξ. 21,24) τῷ μηδένα νομίζοντι ἐχθρὸν ἑαυτοῦ, ἀλλὰ πάντας πλησίον ἑαυτοῦ· διὸ οὐδέποτε δύναται τὰς χεῖρας ἑαυτοῦ ἐκτείνειν πρὸς ἐκδίκησιν. Οὐκ ἔστιν ἀπαιτῆσαι δεκάτην παρὰ τοῦ πᾶσαν τὴν ὕπαρξιν ἑαυτοῦ προσφέροντος τῷ Θεῷ καὶ ἀφιέντος πατέρα, μητέρα καὶ πᾶσαν τὴν συγγένειαν ἑαυτοῦ καὶ ἀκολουθοῦντος τῷ Λόγῳ τοῦ Θεοῦ. Καὶ <strong><mark>οὐκ ἐντέταλται ἡμέραν ἐν ἀναπαύσει καὶ σχολῇ διάγειν τῷ καθ' ἑκάστην ἡμέραν σαββατίζοντι, τουτέστιν ἐν τῷ ναῷ τοῦ Θεοῦ, ὅ ἐστιν τὸ σῶμα τοῦ ἀνθρώπου, τὴν ἀξίαν λατρείαν τῷ Θεῷ ἐπιτελοῦντι καὶ πάσῃ ὥρᾳ δικαιοσύνην ποιοῦντι</mark></strong>. «Ἔλεον γὰρ θέλω καὶ οὐ θυσίαν, – φησίν, – καὶ γνῶσιν Θεοῦ ἢ ὁλοκαυτώματα» (Ὡσ. 6,6).</em></p></blockquote><p>(Δοκίμιον τῆς ἀποστολικῆς κηρύξεως, 96)</p><h3>Αιώνια τιμωρία</h3><blockquote><p><em>Ὥσπερ γὰρ ἐν τῇ Καινῇ Διαθήκῃ ἡ εἰς τὸν Θεὸν πίστις τῶν ἀνθρώπων ηὐξήθη, προσθήκην λαβοῦσα τὸν Υἱὸν τοῦ Θεοῦ, ἵνα καὶ ὁ ἄνθρωπος γένηται μέτοχος τοῦ Θεοῦ, οὕτως καὶ ἡ τῆς ἀναστροφῆς ἐπιμέλεια ηὐξήθη, ἐπειδὴ οὐ μόνον ἀπὸ τῶν πονηρῶν ἔργων ἀπέχεσθαι κελευόμεθα, ἀλλὰ καὶ ἀπὸ αὐτῶν τῶν πονηρῶν λογισμῶν καὶ ἀργῶν ῥημάτων καὶ λόγων κενῶν καὶ αἰσχρῶν ῥημάτων· οὕτως <strong><mark>ηὐξήθη καὶ ἡ κόλασις</mark></strong> τῶν μὴ πιστευόντων τῷ Λόγῳ τοῦ Θεοῦ καὶ καταφρονούντων τῆς παρουσίας αὐτοῦ καὶ εἰς τὰ ὀπίσω στρεφομένων, <strong><mark>οὐ μόνον πρόσκαιρος γενομένη, ἀλλὰ καὶ αἰωνία</mark></strong>.</em></p></blockquote><p>(<a href="https://bibleox.com/grc/la/w/LATIN-Adversus_haereses%2C_LIBER_IV#HH-28-44">Κατὰ αἱρέσεων, βιβλ. Δ΄, κεφ. 28 (λατ.)</a>)</p><p>Αντιπαράθεση:</p><blockquote><p>Καὶ γὰρ αὐτοὶ οἱ προειρημένοι ὑφ' ἡμῶν αἱρετικοὶ ἑαυτοὺς ἐξηπάτησαν, κατηγοροῦντες τοῦ Κυρίου, εἰς ὃν λέγουσι πιστεύειν. Ἃ γὰρ ἐπισημαίνονται ἐν τῷ Θεῷ, τῷ <strong><mark><u>τότε προσκαίρως</u> κολάζοντι τοὺς ἀπίστους</mark></strong> καὶ πατάξαντι τοὺς Αἰγυπτίους, σώσαντι δὲ τοὺς ὑπακούοντας αὐτῷ, ταῦτα οὐδὲν ἧττον ἥξει καὶ ἐπὶ τὸν Κύριον, τὸν <strong><mark><u>εἰς αἰῶνα</u> μὲν κατακρίνοντα οὓς κατακρίνει</mark>, καὶ πάντοτε ἀφιέντα τούτους οὓς ἀφίησιν</strong>·</p></blockquote><p>(<a href="https://bibleox.com/grc/la/w/LATIN-Adversus_haereses%2C_LIBER_IV#HH-28-44">Κατὰ αἱρέσεων, βιβλ. Δ΄, κεφ. 28 (λατ.)</a>)</p><h3>Η αναγκαιότητα της αποστολικής διαδοχής</h3><blockquote><p><em>Διὸ <strong><mark>δεῖ τοῖς ἐν τῇ Ἐκκλησίᾳ πρεσβυτέροις ὑπακούειν, τοῖς τὴν διαδοχὴν ἔχουσιν ἀπὸ τῶν ἀποστόλων, καθὼς ἐδείξαμεν, οἵτινες σὺν τῇ τῆς ἐπισκοπῆς διαδοχῇ τὸ τῆς ἀληθείας χάρισμα τὸ βέβαιον κατὰ τὴν εὐδοκίαν τοῦ Πατρὸς εἰλήφασιν· τοὺς δὲ λοιποὺς τοὺς ἀφισταμένους τῆς προηγουμένης διαδοχῆς καὶ ὅπου ποτὲ συνάγονται ὑπόπτους ἔχειν, ἢ ὡς αἱρετικοὺς καὶ κακογνώμονας, ἢ ὡς σχίζοντας καὶ ἐπηρμένους καὶ ἑαυτοῖς ἀρέσκοντας, ἢ πάλιν ὡς ὑποκριτὰς κέρδους ἕνεκα καὶ κενοδοξίας τοῦτο πράττοντας</mark></strong>. <strong><mark>Πάντες οὗτοι τῆς ἀληθείας ἐξέπεσαν. Καὶ οἱ αἱρετικοί</mark></strong>, ἀλλότριον πῦρ προσφέροντες τῷ θυσιαστηρίῳ τοῦ Θεοῦ, τουτέστιν ἀλλοτρίας διδασκαλίας, ὑπὸ τοῦ ἐξ οὐρανοῦ πυρὸς κατακαυθήσονται, καθὼς Ναδὰβ καὶ Ἀβιούδ (Λευιτ. 10:1–2). Οἱ δὲ ἀνιστάμενοι κατὰ τῆς ἀληθείας καὶ ἑτέρους παροτρύνοντες κατὰ τῆς Ἐκκλησίας τοῦ Θεοῦ μένουσιν ἐν τῷ ᾅδῃ, ὑπὸ τοῦ χάσματος τῆς γῆς καταποθέντες, καθὼς οἱ περὶ Κορὲ Δαθὰν καὶ Ἀβειρών (Ἀριθ. 16:33). Οἱ δὲ <strong><mark>σχίζοντες καὶ διαιροῦντες τὴν ἑνότητα τῆς Ἐκκλησίας τὴν αὐτὴν κόλασιν παρὰ τοῦ Θεοῦ λαμβάνουσιν</mark></strong>, ἣν καὶ Ἱεροβοάμ (Γ΄ Βασ. 14:10 κ.ἑ.).</em></p></blockquote><p>(<a href="https://bibleox.com/grc/la/w/LATIN-Adversus_haereses%2C_LIBER_IV#HH-26-">Κατὰ αἱρέσεων, βιβλ. Δ΄, κεφ. 26 (λατ.)</a>)</p><h3>Η αλήθεια πρέπει να αναζητείται στην Εκκλησία</h3><blockquote><p><em>Τοσούτων οὖν ἀποδείξεων οὐσῶν, <strong><mark>οὐ δεῖ ἔτι παρ' ἑτέροις ζητεῖν τὴν ἀλήθειαν, ἣν εὐχερὲς ἐκ τῆς Ἐκκλησίας λαβεῖν</mark>, τῶν ἀποστόλων ὥσπερ εἰς πλουσίαν ἀποθήκην πληρέστατα ἐν αὐτῇ καταθεμένων πάντα τὰ τῆς ἀληθείας, ἵνα πᾶς ὁ βουλόμενος ἐξ αὐτῆς λαμβάνῃ τὸ τῆς ζωῆς ποτόν</strong> (Ἀποκ. 22:17). Αὕτη γάρ ἐστιν ἡ εἴσοδος τῆς ζωῆς· οἱ δὲ λοιποὶ πάντες κλέπται εἰσὶν καὶ λῃσταί. Διὸ δεῖ μὲν ἐκείνους ἀποφεύγειν, τὰ δὲ τῆς Ἐκκλησίας μετὰ πάσης ἐπιμελείας ἀγαπᾶν καὶ <strong>ἀντιλαμβάνεσθαι τῆς παραδόσεως τῆς ἀληθείας</strong>. Τί γάρ; Εἰ καὶ περὶ μικροῦ τινος ζητήματος ἀμφιλογία γένοιτο, οὐκ ἔδει ἐπὶ τὰς ἀρχαιοτάτας ἐκκλησίας καταφεύγειν, ἐν αἷς οἱ ἀπόστολοι ἀνεστράφησαν, καὶ παρ' αὐτῶν λαβεῖν τὸ βέβαιον καὶ ἀκριβὲς περὶ τοῦ παρόντος ζητήματος; Τί δέ; Εἰ δὲ μηδὲ τὰς Γραφὰς οἱ ἀπόστολοι ἡμῖν κατέλιπον, οὐκ ἔδει τῇ τάξει ἀκολουθεῖν τῆς παραδόσεως ἣν παρέδωκαν οἷς τὰς ἐκκλησίας ἐνεχείριζον; …</em></p><p><em>Πρὸ γὰρ τοῦ Οὐαλεντίνου οὐκ ἦσαν οἱ ἀπὸ Οὐαλεντίνου, οὐδὲ πρὸ τοῦ Μαρκίωνος ἦσαν οἱ ἀπὸ Μαρκίωνος, οὐδὲ ὅλως ἦσαν αἱ λοιπαὶ πονηραὶ γνῶμαι, ἃς ἀνετάξαμεν, πρὶν ἢ τοὺς ἐξηγητὰς καὶ ἐφευρετὰς τῆς κακίας αὐτῶν γενέσθαι.</em></p></blockquote><p>(<a href="https://bibleox.com/grc/la/w/LATIN-Adversus_haereses%2C_LIBER_III#HH-4">Κατὰ αἱρέσεων, βιβλ. Γ΄, κεφ. 4 (λατ.)</a>)</p><h3>Το κύρος της Παράδοσης</h3><blockquote><p><em>2. Ὅταν δὲ πάλιν <strong><mark>ἀναφέρωμεν αὐτοὺς ἐπὶ τὴν ἀπὸ τῶν ἀποστόλων παράδοσιν, τὴν διὰ τῶν διαδοχῶν τῶν πρεσβυτέρων ἐν ταῖς Ἐκκλησίαις φυλασσομένην</mark></strong>, ἀνθίστανται τῇ παραδόσει, λέγοντες ἑαυτοὺς οὐ μόνον τῶν πρεσβυτέρων, ἀλλὰ καὶ τῶν ἀποστόλων εἶναι σοφωτέρους, τὴν εἰλικρινῆ ἀλήθειαν ηὑρηκέναι. Τοὺς μὲν γὰρ ἀποστόλους νενοθευκέναι τὰ νομικὰ τοῖς τοῦ Σωτῆρος λόγοις· οὐ μόνον δὲ τοὺς ἀποστόλους, ἀλλὰ καὶ αὐτὸν τὸν Κύριον, ποτὲ μὲν ἀπὸ τοῦ Δημιουργοῦ, ποτὲ δὲ ἀπὸ τοῦ μέσου, ἐνίοτε δὲ ἀπὸ τοῦ ὕψους πεποιῆσθαι τοὺς λόγους· ἑαυτοὺς δὲ ἀναμφιβόλως καὶ ἀκηλιδώτως καὶ καθαρῶς εἰδέναι τὸ ἀπόκρυφον μυστήριον· ὅπερ ἐστὶν ἀναιδεστάτως βλασφημεῖν τὸν ἑαυτῶν ποιητήν. Συμβαίνει οὖν αὐτοὺς <strong>μηκέτι μήτε ταῖς Γραφαῖς μήτε τῇ παραδόσει συγκατατίθεσθαι</strong>.</em></p><p><em>3. Πρὸς τοιούτους ὁ ἀγὼν ἡμῖν ἐστιν, ὦ φίλτατε, τοῖς ὥσπερ οἱ ὄφεις ὀλισθηροῖς καὶ πάντοθεν ἐκφεύγειν πειρωμένοις. Διὸ πάντοθεν ἀντιστατέον αὐτοῖς, εἴ τινας ἐξ αὐτῶν ἐντροπῇ συντρίβοντες πρὸς τὴν τῆς ἀληθείας ἐπιστροφὴν ἀγαγεῖν δυνηθῶμεν. Εἰ γὰρ οὐκ εὐχερὲς ὑπὸ πλάνης κατεχομένην μεταπεῖσαι ψυχήν, ἀλλ' οὐ πάντη ἀδύνατον τὴν πλάνην ἐκφυγεῖν τῆς ἀληθείας παρατεθείσης.</em></p><p><em>1. <strong><mark>Πᾶσιν τοῖς βουλομένοις τὴν ἀλήθειαν ὁρᾶν ἔξεστιν ἐν πάσῃ Ἐκκλησίᾳ τὴν ἀπὸ τῶν ἀποστόλων παράδοσιν</mark> τὴν ἐν ὅλῳ τῷ κόσμῳ φανερωθεῖσαν κατανοεῖν, καὶ ἔχομεν ἀπαριθμεῖσθαι τοὺς ὑπὸ τῶν ἀποστόλων κατασταθέντας ἐπισκόπους ἐν ταῖς ἐκκλησίαις καὶ τὰς διαδοχὰς αὐτῶν μέχρις ἡμῶν, οἵτινες οὐδὲν τοιοῦτον ἐδίδαξαν οὐδὲ ἔγνωσαν, ὁποῖα οὗτοι παραληροῦσιν</strong>. Εἰ γὰρ ἀπόκρυφα μυστήρια ᾔδεισαν οἱ ἀπόστολοι, ἃ κατ' ἰδίαν καὶ λάθρα τῶν λοιπῶν τοῖς τελείοις ἐδίδασκον, ἐκείνοις ἂν μάλιστα παρεδίδοσαν αὐτά, οἷς καὶ αὐτὰς τὰς ἐκκλησίας ἐνεχείριζον. Πάνυ γὰρ τελείους καὶ ἀνεπιλήπτους ἐν πᾶσιν εἶναι ἤθελον ἐκείνους, οὓς καὶ <strong><mark>διαδόχους κατέλειπον, τὸν ἑαυτῶν τόπον τῆς διδασκαλίας παραδιδόντες</mark>· ὧν ὀρθῶς ἀναστρεφομένων μεγάλη ὠφέλεια ἐγίνετο, ἐκπιπτόντων δὲ τὰ ἔσχατα κακά</strong>.</em></p><p><em>2. Ἐπεὶ δὲ πολὺ ἂν εἴη ἐν τοιούτῳ βιβλίῳ πάσας τῶν ἐκκλησιῶν ἀπαριθμήσασθαι τὰς διαδοχάς, <strong><mark>τὴν παράδοσιν ἣν ἔχει</mark> ἀπὸ τῶν ἀποστόλων ἡ μεγίστη καὶ ἀρχαιοτάτη καὶ πᾶσιν γνώριμος ἐκκλησία ἡ ἐν Ῥώμῃ ὑπὸ τῶν δύο ἐνδοξοτάτων ἀποστόλων Πέτρου καὶ Παύλου θεμελιωθεῖσα καὶ συσταθεῖσα</strong>, καὶ τὸ κήρυγμα τὸ εἰς ἀνθρώπους ἐλθὸν διὰ τῶν διαδοχῶν τῶν ἐπισκόπων μέχρις ἡμῶν παραδιδόμενον ἐνδεικνύμενοι, καταισχύνομεν πάντας τοὺς ὁπωσοῦν ἢ διὰ κακὴν ἑαυτοῖς ἀρέσκειαν ἢ διὰ κενοδοξίαν ἢ διὰ τύφλωσιν καὶ πονηρὰν γνώμην παρὰ τὸ δέον συνάγοντας. Πρὸς ταύτην γὰρ τὴν ἐκκλησίαν διὰ τὴν ἐντιμοτέραν προστασίαν ἀνάγκη πᾶσαν συμφωνεῖν τὴν Ἐκκλησίαν, τουτέστιν τοὺς πανταχόθεν πιστούς, <strong><mark>ἐν ᾗ πάντοτε ὑπὸ τῶν πανταχόθεν πιστῶν τετήρηται ἡ ἀπὸ τῶν ἀποστόλων παράδοσις</mark></strong>.</em></p><p><em>3. Θεμελιώσαντες οὖν καὶ οἰκοδομήσαντες οἱ μακάριοι ἀπόστολοι τὴν ἐκκλησίαν, <strong>Λίνῳ τὴν τῆς ἐπισκοπῆς λειτουργίαν ἐνεχείρισαν</strong>· τούτου τοῦ Λίνου Παῦλος ἐν ταῖς πρὸς Τιμόθεον ἐπιστολαῖς μέμνηται. <strong>Διαδέχεται δὲ αὐτὸν Ἀνέγκλητος</strong>. Μετὰ τοῦτον δὲ τρίτῳ τόπῳ ἀπὸ τῶν ἀποστόλων τὴν ἐπισκοπὴν κληροῦται <strong>Κλήμης</strong>, ὁ καὶ ἑωρακὼς τοὺς μακαρίους ἀποστόλους καὶ συμβεβληκὼς αὐτοῖς, καὶ ἔτι ἔναυλον τὸ κήρυγμα τῶν ἀποστόλων καὶ τὴν παράδοσιν πρὸ ὀφθαλμῶν ἔχων, οὐ μόνος· ἔτι γὰρ πολλοὶ ὑπελείποντο τότε ὑπὸ τῶν ἀποστόλων δεδιδαγμένοι. Ἐπὶ τούτου οὖν τοῦ Κλήμεντος στάσεως οὐκ ὀλίγης τοῖς ἐν Κορίνθῳ γενομένης ἀδελφοῖς, ἐπέστειλεν ἡ ἐν Ῥώμῃ ἐκκλησία ἱκανωτάτην γραφὴν τοῖς Κορινθίοις, εἰς εἰρήνην συμβιβάζουσα αὐτοὺς καὶ ἀνανεοῦσα τὴν πίστιν αὐτῶν καὶ <strong><mark>ἣν νεωστὶ ἀπὸ τῶν ἀποστόλων παράδοσιν εἰλήφει</mark></strong>, κηρύσσουσαν ἕνα Θεὸν παντοκράτορα, ποιητὴν οὐρανοῦ καὶ γῆς, πλάστην τοῦ ἀνθρώπου, τὸν ἐπαγαγόντα τὸν κατακλυσμὸν καὶ καλέσαντα Ἀβραάμ, τὸν ἐξαγαγόντα τὸν λαὸν ἐκ γῆς Αἰγύπτου, τὸν λαλήσαντα Μωϋσεῖ, τὸν νομοθετήσαντα καὶ προφήτας ἀποστείλαντα, τὸν ἡτοιμακότα τὸ πῦρ τῷ διαβόλῳ καὶ τοῖς ἀγγέλοις αὐτοῦ. </em></p><p><em>Τοῦτον τὸν Πατέρα τοῦ Κυρίου ἡμῶν Ἰησοῦ Χριστοῦ κηρύσσεσθαι ὑπὸ τῶν ἐκκλησιῶν ἐξ αὐτῆς τῆς γραφῆς οἱ βουλόμενοι μαθεῖν δύνανται, καὶ <strong><mark>τὴν ἀποστολικὴν τῆς Ἐκκλησίας παράδοσιν νοῆσαι</mark></strong>, πρεσβυτέρας οὔσης τῆς ἐπιστολῆς τῶν νῦν ψευδοδιδασκούντων καὶ ἄλλον Θεὸν ὑπὲρ τὸν Δημιουργὸν καὶ ποιητὴν τῶν ὅλων ἐπινοούντων. Τὸν δὲ Κλήμεντα τοῦτον <strong>διαδέχεται Εὐάρεστος, καὶ τὸν Εὐάρεστον Ἀλέξανδρος, εἶθ' οὕτως ἕκτος ἀπὸ τῶν ἀποστόλων καθίσταται Ξύστος, μετὰ δὲ τοῦτον Τελεσφόρος, ὃς καὶ ἐνδόξως ἐμαρτύρησεν· ἔπειτα Ὑγῖνος, εἶτα Πίος, μεθ' ὃν Ἀνίκητος· διαδεξαμένου τὸν Ἀνίκητον Σωτῆρος, νῦν δωδεκάτῳ τόπῳ τὸν τῆς ἐπισκοπῆς ἀπὸ τῶν ἀποστόλων κατέχει κλῆρον Ἐλεύθερος</strong>. Τῇ αὐτῇ τάξει καὶ <strong><mark>τῇ αὐτῇ διδαχῇ ἥ τε ἀπὸ τῶν ἀποστόλων ἐν τῇ ἐκκλησίᾳ παράδοσις καὶ τὸ τῆς ἀληθείας κήρυγμα κατήντηκεν εἰς ἡμᾶς. </mark></strong></em></p><p><em><strong><mark>Καὶ ἔστιν αὕτη ἡ πληρεστάτη ἀπόδειξις, μίαν καὶ τὴν αὐτὴν ζωοποιὸν πίστιν εἶναι, τὴν ἐν τῇ Ἐκκλησίᾳ ἀπὸ τῶν ἀποστόλων μέχρι νῦν τετηρημένην καὶ ἐν ἀληθείᾳ παραδεδομένην</mark></strong>.</em></p><p><em>4. Καὶ <strong>Πολύκαρπος δὲ οὐ μόνον ὑπὸ ἀποστόλων μαθητευθεὶς καὶ συναναστραφεὶς πολλοῖς τοῖς τὸν Κύριον ἑωρακόσιν, ἀλλὰ καὶ ὑπὸ ἀποστόλων κατασταθεὶς εἰς τὴν Ἀσίαν ἐν τῇ ἐν Σμύρνῃ ἐκκλησίᾳ ἐπίσκοπος, ὃν καὶ ἡμεῖς ἑωράκαμεν ἐν τῇ πρώτῃ ἡμῶν ἡλικίᾳ–ἐπὶ πολὺ γὰρ παρέμεινεν καὶ πάνυ γηραλέος ἐνδόξως καὶ ἐπιφανέστατα μαρτυρήσας ἐξῆλθεν τοῦ βίου–, ταῦτα διδάξας ἀεὶ ἃ καὶ παρὰ τῶν ἀποστόλων ἔμαθεν, ἃ καὶ ἡ ἐκκλησία παραδίδωσιν, ἃ καὶ μόνα ἐστὶν ἀληθῆ. Μαρτυροῦσι τούτοις αἱ κατὰ τὴν Ἀσίαν ἐκκλησίαι πᾶσαι καὶ οἱ μέχρι νῦν διαδεδεγμένοι τὸν Πολύκαρπον, πολλῷ ἀξιοπιστότερον καὶ βεβαιότερον ἀληθείας μάρτυρα ὄντα</strong> Οὐαλεντίνου καὶ Μαρκίωνος καὶ τῶν λοιπῶν κακογνωμόνων. Ὃς καὶ ἐπὶ Ἀνικήτου ἐπιδημήσας τῇ Ῥώμῃ, πολλοὺς ἀπὸ τῶν προειρημένων αἱρετικῶν ἐπέστρεψεν εἰς τὴν ἐκκλησίαν τοῦ Θεοῦ, μίαν καὶ μόνην ταύτην ἀλήθειαν κηρύξας ὑπὸ τῶν ἀποστόλων παρειληφέναι τὴν ὑπὸ τῆς ἐκκλησίας παραδιδομένην. </em></p><p><em>Καὶ εἰσὶν οἱ ἀκηκοότες αὐτοῦ ὅτι Ἰωάννης ὁ τοῦ Κυρίου μαθητὴς ἐν τῇ Ἐφέσῳ πορευθεὶς λούσασθαι καὶ ἰδὼν ἔσω Κήρινθον ἐξήλατο τοῦ βαλανείου μὴ λουσάμενος, ἀλλ' ἐπειπών· «Φύγωμεν, μὴ καὶ τὸ βαλανεῖον συμπέσῃ, ἔνδον ὄντος Κηρίνθου τοῦ τῆς ἀληθείας ἐχθροῦ.» Καὶ αὐτὸς δὲ ὁ Πολύκαρπος Μαρκίωνί ποτε εἰς ὄψιν αὐτῷ ἐλθόντι καὶ φήσαντι· «Ἐπιγίνωσκε ἡμᾶς», ἀπεκρίθη· «Ἐπιγινώσκω, ἐπιγινώσκω τὸν πρωτότοκον τοῦ Σατανᾶ.» Τοσαύτην οἱ ἀπόστολοι καὶ οἱ μαθηταὶ αὐτῶν ἔσχον εὐλάβειαν πρὸς τὸ μηδὲ μέχρι λόγου κοινωνεῖν τινι τῶν παραχαρασσόντων τὴν ἀλήθειαν, ὡς καὶ Παῦλος ἔφησεν· «Αἱρετικὸν ἄνθρωπον μετὰ μίαν καὶ δευτέραν νουθεσίαν παραιτοῦ, εἰδὼς ὅτι ἐξέστραπται ὁ τοιοῦτος καὶ ἁμαρτάνει ὢν αὐτοκατάκριτος.» Ἔστιν δὲ καὶ ἐπιστολὴ Πολυκάρπου πρὸς Φιλιππησίους γεγραμμένη ἱκανωτάτη, ἐξ ἧς καὶ τὸν χαρακτῆρα τῆς πίστεως αὐτοῦ καὶ τὸ κήρυγμα τῆς ἀληθείας οἱ βουλόμενοι καὶ φροντίζοντες τῆς ἑαυτῶν σωτηρίας δύνανται μαθεῖν. </em></p><p><em>Ἀλλὰ καὶ ἡ ἐν Ἐφέσῳ ἐκκλησία ὑπὸ Παύλου μὲν τεθεμελιωμένη, Ἰωάννου δὲ παραμείναντος αὐτοῖς μέχρι τῶν Τραϊανοῦ χρόνων, μάρτυς ἀληθής ἐστιν τῆς τῶν ἀποστόλων παραδόσεως.</em></p><p><em>1. Τοσούτων οὖν ἀποδείξεων οὐσῶν, <strong>οὐ δεῖ ἔτι παρ' ἑτέροις ζητεῖν τὴν ἀλήθειαν, ἣν εὐχερὲς ἐκ τῆς Ἐκκλησίας λαβεῖν, τῶν ἀποστόλων ὥσπερ εἰς πλουσίαν ἀποθήκην πληρέστατα ἐν αὐτῇ καταθεμένων πάντα τὰ τῆς ἀληθείας, ἵνα πᾶς ὁ βουλόμενος ἐξ αὐτῆς λαμβάνῃ τὸ τῆς ζωῆς ποτόν</strong> (Ἀποκ. 22:17). Αὕτη γάρ ἐστιν ἡ εἴσοδος τῆς ζωῆς· οἱ δὲ λοιποὶ πάντες κλέπται εἰσὶν καὶ λῃσταί. Διὸ δεῖ μὲν ἐκείνους ἀποφεύγειν, τὰ δὲ τῆς Ἐκκλησίας μετὰ πάσης ἐπιμελείας ἀγαπᾶν καὶ <strong><mark>ἀντιλαμβάνεσθαι τῆς παραδόσεως τῆς ἀληθείας</mark></strong>. Τί γάρ; Εἰ καὶ περὶ μικροῦ τινος ζητήματος ἀμφιλογία γένοιτο, οὐκ <strong>ἔδει ἐπὶ τὰς ἀρχαιοτάτας ἐκκλησίας καταφεύγειν, ἐν αἷς οἱ ἀπόστολοι ἀνεστράφησαν, καὶ παρ' αὐτῶν λαβεῖν τὸ βέβαιον καὶ ἀκριβὲς</strong> περὶ τοῦ παρόντος ζητήματος; Τί δέ; Εἰ δὲ μηδὲ τὰς Γραφὰς οἱ ἀπόστολοι ἡμῖν κατέλιπον, οὐκ ἔδει <strong><mark>τῇ τάξει ἀκολουθεῖν τῆς παραδόσεως</mark> ἣν παρέδωκαν οἷς τὰς ἐκκλησίας ἐνεχείριζον</strong>;</em></p><p><em>2. Ταύτῃ τῇ τάξει συντίθενται καὶ πολλὰ γένη βαρβάρων τῶν εἰς Χριστὸν πιστευόντων, οἵτινες <mark><strong>ἔχουσι τὴν σωτηρίαν αὐτῶν ἄνευ χάρτου ἢ μέλανος</strong> ἐγγεγραμμένην ἐν ταῖς καρδίαις αὐτῶν διὰ τοῦ Πνεύματος, καὶ τὴν ἀρχαίαν παράδοσιν ἐπιμελῶς φυλάσσουσι</mark>, πιστεύοντες εἰς ἕνα Θεὸν τὸν ποιητὴν τοῦ οὐρανοῦ καὶ τῆς γῆς καὶ πάντων τῶν ἐν αὐτοῖς, διὰ Ἰησοῦ Χριστοῦ τοῦ Υἱοῦ τοῦ Θεοῦ· ὃς διὰ τὴν ὑπερβάλλουσαν πρὸς τὸ πλάσμα αὐτοῦ ἀγάπην καὶ τὴν ἐκ τῆς Παρθένου γέννησιν ὑπέμεινεν, αὐτὸς δι' ἑαυτοῦ ἑνώσας τὸν ἄνθρωπον τῷ Θεῷ, καὶ παθὼν ἐπὶ Ποντίου Πιλάτου, καὶ ἀναστάς, καὶ ἐν λαμπρότητι παραληφθείς, ἐν δόξῃ ἐλεύσεται Σωτὴρ τῶν σῳζομένων καὶ κριτὴς τῶν κρινομένων, καὶ πέμψων εἰς τὸ αἰώνιον πῦρ τοὺς μεταστρέφοντας τὴν ἀλήθειαν καὶ τοὺς καταφρονοῦντας τοῦ Πατρὸς αὐτοῦ καὶ τῆς παρουσίας αὐτοῦ. </em></p><p><em><strong>Ταύτην τὴν πίστιν <mark>οἱ ἄνευ γραμμάτων πιστεύσαντες</mark> βάρβαροι μέν εἰσι πρὸς τὸν ἡμέτερον λόγον, κατὰ δὲ τὴν γνώμην καὶ τὴν συνήθειαν καὶ τὴν ἀναστροφὴν διὰ τὴν πίστιν σοφώτατοί εἰσιν καὶ ἀρέσκουσι τῷ Θεῷ, ἀναστρεφόμενοι ἐν πάσῃ δικαιοσύνῃ καὶ ἁγνείᾳ καὶ σοφίᾳ</strong>. Οἷς ἐάν τις ἀναγγείλῃ τὰ ὑπὸ τῶν αἱρετικῶν ἐπινοηθέντα, τῇ ἰδίᾳ αὐτῶν διαλέκτῳ ὁμιλῶν, εὐθέως συγκλείσαντες τὰ ὦτα πορρωτάτω φεύξονται, μηδὲ ἀκοῦσαι ὑπομένοντες βλάσφημον ὁμιλίαν. Οὕτως διὰ τὴν ἀρχαίαν ἐκείνην ἀποστολικὴν παράδοσιν οὐδὲ εἰς ἔννοιαν νοὸς παραδέχονται ὅ τι ποτὲ τῶν αἱρετικῶν τερατολογία ἐστίν, ἐπεὶ μηδὲ συνέλευσις ἦν παρ' αὐτοῖς μηδὲ διδασκαλία καθιδρυμένη. Οὐαλεντῖνος μὲν γὰρ ἦλθεν εἰς Ῥώμην ἐπὶ Ὑγίνου· ἤκμασε δὲ ἐπὶ Πίου καὶ παρέμεινεν ἕως Ἀνικήτου. </em></p><p><em>Κέρδων δὲ ὁ πρὸ Μαρκίωνος, καὶ αὐτὸς ἐπὶ Ὑγίνου, ὃς ἦν ἔνατος ἐπίσκοπος, εἰς τὴν ἐκκλησίαν ἐλθὼν καὶ ἐξομολογούμενος οὕτως διετέλεσε, ποτὲ μὲν λαθροδιδασκαλῶν, ποτὲ δὲ πάλιν ἐξομολογούμενος, ποτὲ δὲ ἐλεγχόμενος ἐφ' οἷς ἐδίδασκε κακῶς καὶ ἀφιστάμενος τῆς τῶν ἀδελφῶν συνοδίας. Μαρκίων δὲ διαδεξάμενος αὐτὸν ἐνίσχυσεν ἐπὶ Ἀνικήτου, τὸ δέκατον τῆς ἐπισκοπῆς ἐπέχοντος. Οἱ δὲ λοιποὶ οἱ καλούμενοι Γνωστικοί, ἀπὸ Μενάνδρου τοῦ Σίμωνος μαθητοῦ, καθὼς ἐδείξαμεν, τὰς ἀρχὰς λαβόντες, ἕκαστος αὐτῶν οὗ μετέσχε δόγματος, τούτου καὶ πατὴρ καὶ προστάτης ἀνεφάνη. Πάντες δὲ οὗτοι πολλῷ ὕστερον, ἤδη μεσούντων τῶν τῆς Ἐκκλησίας χρόνων, εἰς τὴν ἑαυτῶν ἀποστασίαν ἐπανέστησαν.</em></p></blockquote><p>(<a href="https://bibleox.com/grc/la/w/LATIN-Adversus_haereses%2C_LIBER_III#HH-2">Κατὰ αἱρέσεων, βιβλ. Γ΄, κεφ. 2–4 (λατ.)</a>)</p><blockquote><p><em><strong>Πάντες οὗτοι πολλῷ ὕστεροι τῶν ἐπισκόπων εἰσίν, οἷς οἱ ἀπόστολοι τὰς Ἐκκλησίας παρέδωκαν</strong>· καὶ τοῦτο ἐν τῇ τρίτῃ βίβλῳ μετὰ πάσης ἐπιμελείας ἐδηλώσαμεν. Ἀνάγκην οὖν ἔχουσιν οἱ προειρημένοι αἱρετικοί, τυφλοὶ ὄντες πρὸς τὴν ἀλήθειαν, <strong>ἄλλην καὶ ἄλλην ἐκτρεπόμενοι βαδίζειν ὁδόν</strong>· καὶ διὰ τοῦτο <strong><mark>ἀσυμφώνως καὶ ἀνακολούθως διεσκορπισμένα ἐστὶ τὰ ἴχνη τῆς διδασκαλίας αὐτῶν</mark></strong>. <strong><mark>Ἡ δὲ τῶν ἀπὸ τῆς Ἐκκλησίας ὁδὸς περιλαμβάνει τὸν κόσμον ὅλον, ἅτε βεβαίαν ἔχουσα <u>τὴν ἀπὸ τῶν ἀποστόλων παράδοσιν</u></mark></strong>, καὶ παρέχουσα ἡμῖν ὁρᾶν <strong>μίαν καὶ τὴν αὐτὴν πάντων εἶναι τὴν πίστιν</strong>, <strong>πάντων ἕνα καὶ τὸν αὐτὸν Θεὸν</strong> Πατέρα κηρυσσόντων, καὶ τὴν αὐτὴν τῆς ἐνανθρωπήσεως τοῦ Υἱοῦ τοῦ Θεοῦ οἰκονομίαν πιστευόντων, καὶ τὴν αὐτὴν τοῦ Πνεύματος δωρεὰν εἰδότων, καὶ <strong>τὰ αὐτὰ φυλασσόντων παραγγέλματα</strong>, καὶ <strong>τὸν αὐτὸν τύπον τῆς κατὰ τὴν Ἐκκλησίαν οἰκονομίας φυλασσόντων</strong>, καὶ τὴν αὐτὴν προσδοκώντων παρουσίαν τοῦ Κυρίου, καὶ <strong>τὴν αὐτὴν σωτηρίαν τοῦ ὅλου ἀνθρώπου, τουτέστι ψυχῆς καὶ σώματος, ἐκδεχομένων</strong>. </em></p><p><em>Καὶ τὸ κήρυγμα τῆς Ἐκκλησίας ἀληθὲς καὶ βέβαιόν ἐστιν, παρ' ᾗ μία καὶ ἡ αὐτὴ ὁδὸς σωτηρίας ἐν ὅλῳ τῷ κόσμῳ δείκνυται. Ταύτῃ γὰρ ἐπιστεύθη τὸ φῶς τοῦ Θεοῦ· καὶ διὰ τοῦτο ἡ σοφία τοῦ Θεοῦ, δι' ἧς σῴζει πάντας ἀνθρώπους, «ἐν ἐξόδοις ὑμνεῖται, ἐν πλατείαις δὲ παρρησίᾳ ἀναστρέφεται, ἐν δὲ τοῖς ὑψηλοῖς τείχεσι κηρύσσεται, ἐν δὲ ταῖς πύλαις τῆς πόλεως ἀδιαλείπτως λαλεῖ» (Ψαλμ. 31:1–2). Πανταχοῦ γὰρ ἡ Ἐκκλησία κηρύσσει τὴν ἀλήθειαν· καὶ αὕτη ἐστὶν ἡ ἑπτάμυχος λυχνία, τὸ φῶς τοῦ Χριστοῦ βαστάζουσα.</em></p><p><em>2. Διὸ <strong><mark>οἱ τὴν κήρυξιν τῆς Ἐκκλησίας καταλιπόντες ἀμαθίαν τῶν ἁγίων πρεσβυτέρων ἐγκαλοῦσιν, μὴ συνορῶντες ὅσῳ πλείονος ἄξιός ἐστιν ὁ εὐσεβὴς ἰδιώτης τοῦ βλασφήμου καὶ ἀναιδοῦς σοφιστοῦ</mark></strong>. Τοιοῦτοι δέ εἰσιν πάντες οἱ αἱρετικοί, καὶ οἱ πλέον τι παρὰ τὴν ἀλήθειαν εὑρηκέναι δοκοῦντες, ἀκολουθοῦντες τοῖς προειρημένοις, <strong><mark>ποικίλως καὶ πολυτρόπως καὶ ἀσθενῶς ποιούμενοι τὴν ὁδόν, περὶ τῶν αὐτῶν οὐκ ἀεὶ τὰς αὐτὰς ἔχοντες γνώμας, ὡς τυφλοὶ ὑπὸ τυφλῶν ὁδηγούμενοι, δικαίως εἰς τὸν λανθάνοντα τῆς ἀγνοίας βόθρον ἐμπεσοῦνται, πάντοτε ζητοῦντες καὶ μηδέποτε τὴν ἀλήθειαν εὑρίσκοντες</mark></strong>. Διὸ δεῖ φεύγειν τὰς γνώμας αὐτῶν, καὶ ἐπιμελέστερον φυλάσσεσθαι μή πού τι ὑπ' αὐτῶν βλαβῶμεν· <strong><mark>δεῖ δὲ καὶ <u>πρὸς τὴν Ἐκκλησίαν καταφεύγειν</u> καὶ ἐν τοῖς κόλποις αὐτῆς ἐκτρέφεσθαι καὶ ταῖς κυριακαῖς Γραφαῖς ἐντρέφεσθαι</mark></strong>. Πεφύτευται γὰρ ἡ Ἐκκλησία παράδεισος ἐν τῷ κόσμῳ τούτῳ. Διὸ «ἀπὸ παντὸς ξύλου τοῦ παραδείσου βρώσει φαγῇ», φησὶν τὸ Πνεῦμα τοῦ Θεοῦ (Γέν. 2:16), τουτέστιν <strong><mark>ἀπὸ πάσης Γραφῆς κυριακῆς φάγεσθε, ἐπὶ δὲ ὑψηλῷ φρονήματι μὴ φάγητε, μηδὲ ἅψησθε πάσης αἱρετικῆς διαφωνίας</mark></strong>.</em></p></blockquote><p>(<a href="https://bibleox.com/grc/la/w/LATIN-Adversus_haereses%2C_LIBER_V#HH-20">Κατὰ αἱρέσεων, βιβλ. Ε΄, κεφ. 20 (λατ.)</a>)</p><h3>Μερικά έθνη διατηρούν την πίστη χωρίς Γραφή, μόνο με την Παράδοση</h3><blockquote><p><em>Τοσούτων οὖν ἀποδείξεων οὐσῶν, <strong>οὐ δεῖ ἔτι παρ' ἑτέροις ζητεῖν τὴν ἀλήθειαν, ἣν εὐχερὲς ἐκ τῆς Ἐκκλησίας λαβεῖν, τῶν ἀποστόλων ὥσπερ εἰς πλουσίαν ἀποθήκην πληρέστατα ἐν αὐτῇ καταθεμένων πάντα τὰ τῆς ἀληθείας, ἵνα πᾶς ὁ βουλόμενος ἐξ αὐτῆς λαμβάνῃ τὸ τῆς ζωῆς ποτόν</strong> (Ἀποκ. 22:17). Αὕτη γάρ ἐστιν ἡ εἴσοδος τῆς ζωῆς· οἱ δὲ λοιποὶ πάντες κλέπται εἰσὶν καὶ λῃσταί. Διὸ δεῖ μὲν ἐκείνους ἀποφεύγειν, τὰ δὲ τῆς Ἐκκλησίας μετὰ πάσης ἐπιμελείας ἀγαπᾶν καὶ <strong><mark>ἀντιλαμβάνεσθαι τῆς παραδόσεως τῆς ἀληθείας</mark></strong>. Τί γάρ; <strong>Εἰ καὶ περὶ μικροῦ τινος ζητήματος ἀμφιλογία γένοιτο, οὐκ ἔδει ἐπὶ τὰς ἀρχαιοτάτας ἐκκλησίας καταφεύγειν, ἐν αἷς οἱ ἀπόστολοι ἀνεστράφησαν, καὶ παρ' αὐτῶν λαβεῖν τὸ βέβαιον καὶ ἀκριβὲς περὶ τοῦ παρόντος ζητήματος; </strong></em></p><p><em><strong>Τί δέ; Εἰ δὲ μηδὲ τὰς Γραφὰς οἱ ἀπόστολοι ἡμῖν κατέλιπον, οὐκ ἔδει <mark>τῇ τάξει ἀκολουθεῖν τῆς παραδόσεως</mark> ἣν παρέδωκαν οἷς τὰς ἐκκλησίας ἐνεχείριζον; <strong>Ταύτῃ τῇ τάξει συντίθενται καὶ πολλὰ γένη βαρβάρων τῶν εἰς Χριστὸν πιστευόντων, οἵτινες <mark>ἔχουσι τὴν σωτηρίαν αὐτῶν ἄνευ χάρτου ἢ μέλανος ἐγγεγραμμένην ἐν ταῖς καρδίαις αὐτῶν διὰ τοῦ Πνεύματος, καὶ τὴν ἀρχαίαν παράδοσιν ἐπιμελῶς φυλάσσουσι</mark></strong></strong>, πιστεύοντες εἰς ἕνα Θεὸν τὸν ποιητὴν τοῦ οὐρανοῦ καὶ τῆς γῆς καὶ πάντων τῶν ἐν αὐτοῖς, διὰ Ἰησοῦ Χριστοῦ τοῦ Υἱοῦ τοῦ Θεοῦ· ὃς διὰ τὴν ὑπερβάλλουσαν πρὸς τὸ πλάσμα αὐτοῦ ἀγάπην καὶ τὴν ἐκ τῆς Παρθένου γέννησιν ὑπέμεινεν, αὐτὸς δι' ἑαυτοῦ ἑνώσας τὸν ἄνθρωπον τῷ Θεῷ, καὶ παθὼν ἐπὶ Ποντίου Πιλάτου, καὶ ἀναστάς, καὶ ἐν λαμπρότητι παραληφθείς, ἐν δόξῃ ἐλεύσεται Σωτὴρ τῶν σῳζομένων καὶ κριτὴς τῶν κρινομένων, καὶ πέμψων εἰς τὸ αἰώνιον πῦρ τοὺς μεταστρέφοντας τὴν ἀλήθειαν καὶ τοὺς καταφρονοῦντας τοῦ Πατρὸς αὐτοῦ καὶ τῆς παρουσίας αὐτοῦ. </em></p><p><em><strong>Ταύτην τὴν πίστιν <mark>οἱ ἄνευ γραμμάτων πιστεύσαντες</mark> βάρβαροι μέν εἰσι πρὸς τὸν ἡμέτερον λόγον, κατὰ δὲ τὴν γνώμην καὶ τὴν συνήθειαν καὶ τὴν ἀναστροφὴν διὰ τὴν πίστιν σοφώτατοί εἰσιν καὶ ἀρέσκουσι τῷ Θεῷ, ἀναστρεφόμενοι ἐν πάσῃ δικαιοσύνῃ καὶ ἁγνείᾳ καὶ σοφίᾳ</strong>. Οἷς ἐάν τις ἀναγγείλῃ τὰ ὑπὸ τῶν αἱρετικῶν ἐπινοηθέντα, τῇ ἰδίᾳ αὐτῶν διαλέκτῳ ὁμιλῶν, εὐθέως συγκλείσαντες τὰ ὦτα πορρωτάτω φεύξονται, μηδὲ ἀκοῦσαι ὑπομένοντες βλάσφημον ὁμιλίαν. Οὕτως διὰ τὴν ἀρχαίαν ἐκείνην ἀποστολικὴν παράδοσιν οὐδὲ εἰς ἔννοιαν νοὸς παραδέχονται ὅ τι ποτὲ τῶν αἱρετικῶν τερατολογία ἐστίν, ἐπεὶ μηδὲ συνέλευσις ἦν παρ' αὐτοῖς μηδὲ διδασκαλία καθιδρυμένη.</em></p></blockquote><p>(<a href="https://bibleox.com/grc/la/w/LATIN-Adversus_haereses%2C_LIBER_III#HH-4">Κατὰ αἱρέσεων, βιβλ. Γ΄, κεφ. 4 (λατ.)</a>)</p><h3>Η αξία της ενότητας της Εκκλησίας και η καταδίκη των σχισμάτων</h3><blockquote><p><em>Ἀνακρινεῖ δὲ καὶ τοὺς ψευδοπροφήτας, οἵτινες μήτε τὴν προφητικὴν χάριν παρὰ τοῦ Θεοῦ λαβόντες μήτε τὸν φόβον τοῦ Θεοῦ ἔχοντες, ἀλλὰ διὰ κενοδοξίαν ἢ δι' αἴσχροκέρδειαν ἤ τι ἕτερον, ἢ καὶ ἄλλως κατ' ἐνέργειαν τοῦ πονηροῦ πνεύματος ὑποκρίνονται προφητεύειν, ψευδόμενοι κατὰ τοῦ Θεοῦ. Ἀνακρίνει δὲ <strong>τὸ θεῖον <mark>τοὺς τὰ σχίσματα ἐργαζομένους, κενοὺς ὄντας τῆς τοῦ Θεοῦ ἀγάπης καὶ τὸ ἴδιον λυσιτελὲς σκοποῦντας, ἀλλὰ μὴ τὴν ἕνωσιν τῆς ἐκκλησίας</mark></strong>, καὶ διὰ μικρὰς καὶ τὰς τυχούσας αἰτίας <strong><mark>τὸ μέγα καὶ ἔνδοξον σῶμα τοῦ Χριστοῦ τέμνοντας καὶ διαιροῦντας</mark></strong> καὶ ὅσον τὸ ἐπ' αὐτοῖς ἀναιροῦντας, <strong><mark>εἰρήνην λαλοῦντας καὶ πόλεμον ἐργαζομένους</mark></strong>, ἀληθῶς «διϋλίζοντας τὸν κώνωπα, τὴν δὲ κάμηλον καταπίνοντας»· οὐδεμία γὰρ τηλικαύτη δύναται πρὸς αὐτῶν κατόρθωσις γενέσθαι, <strong><mark>ἡλίκη τοῦ σχίσματός ἐστιν ἡ βλάβη</mark></strong>. Ἀνακρινεῖ δὲ καὶ πάντας τοὺς ἔξω τῆς ἀληθείας ὄντας, τουτέστι τοὺς ἔξω τῆς Ἐκκλησίας.</em></p></blockquote><p>(<a href="https://bibleox.com/grc/la/w/LATIN-Adversus_haereses%2C_LIBER_IV#HH-33-50">Κατὰ αἱρέσεων, βιβλ. Δ΄, κεφ. 33 (λατ.)</a>)</p><h3>Ο Σίμων ο μάγος — αιρετικός και γενάρχης των αιρέσεων</h3><blockquote><p>2. Οὗτος ὁ <strong><mark>Σίμων</mark> ὁ Σαμαρείτης, ἐξ οὗ <mark>πᾶσαι αἱ αἱρέσεις ὑπέστησαν</mark></strong>, <strong><mark>τοιαύτην τὴν ἑαυτοῦ αἵρεσιν συνεστήσατο</mark></strong>. Οὗτος γυναῖκά τινα Ἑλένην τοὔνομα, ἐν Τύρῳ τῇ Φοινίκων πόλει λυτρωσάμενος, πανταχοῦ μεθ' ἑαυτοῦ περιῆγεν, λέγων αὐτὴν εἶναι τὴν πρώτην Ἔννοιαν, τὴν μητέρα πάντων.</p></blockquote><p>(<a href="https://bibleox.com/grc/la/w/LATIN-Adversus_haereses_LIBER_I#HH-23-16">Κατὰ αἱρέσεων, βιβλ. Α΄, κεφ. 23 (λατ.)</a>)</p><h3>Οι αιρετικοί συγκαλύπτονται με το όνομα του Ιησού</h3><blockquote><p><em>Τούτῳ μὲν οὖν, ἐπειδὴ καὶ μόνος φανερῶς ἐτόλμησε περικόπτειν τὰς Γραφάς, καὶ ἀναισχύντως ὑπὲρ πάντας καταλαλεῖν τοῦ Θεοῦ, ἰδίᾳ ἀντιλέξομεν, ἐξ ὧν αὐτὸς ἔγραψεν ἐλέγχοντες αὐτόν, καὶ σὺν τῇ τοῦ Θεοῦ βοηθείᾳ <strong>τὴν ἀνατροπὴν αὐτοῦ ποιησόμεθα ἐκ τῶν λόγων τοῦ Κυρίου καὶ τοῦ Ἀποστόλου, οἷς αὐτὸς χρῆται</strong>. Νῦν δὲ ἀναγκαίως ἐμνήσθημεν αὐτοῦ, ἵνα εἰδῇς ὅτι πάντες οἱ ὁπωσοῦν νοθεύοντες τὴν ἀλήθειαν καὶ τὸ κήρυγμα τῆς Ἐκκλησίας βλάπτοντες, Σίμωνος τοῦ Σαμαρείτου τοῦ μάγου μαθηταὶ καὶ διάδοχοί εἰσιν. <strong>Εἰ καὶ μὴ ὁμολογοῦσι τὸ ὄνομα τοῦ ἑαυτῶν διδασκάλου πρὸς ἀπάτην τῶν λοιπῶν, ἀλλ' ὅμως τὴν ἐκείνου γνώμην διδάσκουσιν· <mark>τὸ μὲν ὄνομα τοῦ Ἰησοῦ Χριστοῦ ὡς δέλεαρ προφέροντες</mark>, τὴν δὲ ἀσέβειαν τοῦ Σίμωνος ποικίλως εἰσάγοντες, πολλοὺς ἀποκτείνουσιν, διὰ τοῦ ἀγαθοῦ ὀνόματος τὴν ἑαυτῶν γνώμην κακῶς διαφθείροντες, καὶ διὰ τῆς γλυκύτητος καὶ τοῦ κάλλους τοῦ ὀνόματος τὸ πικρὸν καὶ πονηρὸν ἰὸν τοῦ ὄφεως τοῦ ἀρχηγοῦ τῆς ἀποστασίας ὀρέγοντες αὐτοῖς</strong>.</em></p></blockquote><p>(<a href="https://bibleox.com/grc/la/w/LATIN-Adversus_haereses_LIBER_I#HH-27-24">Κατὰ αἱρέσεων, βιβλ. Α΄, κεφ. 27 (λατ.)</a>)</p><h3>Η αποφυγή των λόγων των αιρετικών</h3><blockquote><p><em>Καὶ εἴ τις αὐτοῖς ἀναγγέλλοι τὰ ὑπὸ τῶν αἱρετικῶν ἐπινενοημένα, τῇ ἰδίᾳ αὐτῶν γλώσσῃ διαλεγόμενος, αὐτίκα <strong><mark>ἐμφράξαντες τὰ ὦτα πόρρω πορρωτέρω φεύξονται, μηδὲ ἀκοῦσαι ἀνεχόμενοι βλασφήμου ὁμιλίας</mark></strong>. Οὕτως διὰ τῆς ἀρχαίας ἐκείνης τῶν Ἀποστόλων παραδόσεως <strong><mark>οὐδὲ εἰς ἔννοιαν τῆς διανοίας ἀφιᾶσι τὸ τερατῶδες τῶν αἱρετικῶν φθέγμα</mark></strong>.</em></p></blockquote><p>(<a href="https://bibleox.com/grc/la/w/LATIN-Adversus_haereses%2C_LIBER_III#HH-4">Κατὰ αἱρέσεων, βιβλ. Γ΄, κεφ. 4 (λατ.)</a>)</p><blockquote><p><em>Οἱ τοίνυν ἀφιστάμενοι τοῦ κηρύγματος τῆς Ἐκκλησίας τὴν ἀπειρίαν τῶν ἁγίων πρεσβυτέρων ἐλέγχουσιν, οὐ κατανοοῦντες ὅσῳ πλείονος ἄξιός ἐστιν ὁ εὐσεβὴς ἰδιώτης τοῦ βλασφήμου καὶ ἀναιδοῦς σοφιστοῦ. <strong>Τοιοῦτοι δέ εἰσι πάντες οἱ αἱρετικοί</strong>, καὶ οἱ δοκοῦντες πλέον τι παρὰ τὴν ἀλήθειαν ἐξευρηκέναι, τοῖς προειρημένοις ἑπόμενοι, ποικίλως καὶ πολυτρόπως καὶ ἀσθενῶς τὴν ὁδὸν ποιούμενοι, περὶ τῶν αὐτῶν οὐ τὰ αὐτὰ ἀεὶ φρονοῦντες, ὡς τυφλοὶ ὑπὸ τυφλῶν περιάγονται, δικαίως ἐμπεσοῦνται εἰς τὸν λανθάνοντα τῆς ἀγνοίας βόθρον, ἀεὶ ζητοῦντες καὶ μηδέποτε τὴν ἀλήθειαν εὑρίσκοντες. Διὸ <strong><mark>φευκτέαι μὲν αἱ τούτων γνῶμαι, καὶ ἐπιμελέστερον τηρητέον, μή πού τι ὑπ' αὐτῶν βλαβῶμεν</mark>· καταφευκτέον δὲ ἐπὶ τὴν Ἐκκλησίαν, καὶ ἐν τοῖς κόλποις αὐτῆς ἀνατραφῆναι, καὶ ταῖς Κυριακαῖς Γραφαῖς ἐντραφῆναι</strong>.</em></p></blockquote><p>(<a href="https://bibleox.com/grc/la/w/LATIN-Adversus_haereses%2C_LIBER_V#HH-20">Κατὰ αἱρέσεων, βιβλ. Ε΄, κεφ. 20 (λατ.)</a>)</p><h3>Οι αιρετικοί αντιφάσκουν μεταξύ τους</h3><p>Οι αιρετικοί αντιφάσκουν διαρκώς μεταξύ τους και επινοούν νέες διδασκαλίες:</p><blockquote><p><em>ἼΔΩΜΕΝ νῦν καὶ τὴν τούτων ἀσύστατον γνώμην, δύο που καὶ τριῶν ὄντων, πῶς περὶ τῶν αὐτῶν <strong><mark>οὐ τὰ αὐτὰ λέγουσιν, ἀλλὰ τοῖς πράγμασι καὶ τοῖς ὀνόμασιν ἐναντία ἀποφαίνονται</mark></strong>. …</em></p><p><em><strong>ἕκαστος δὲ αὐτῶν ὡς βούλεται διδάσκει</strong>.</em></p></blockquote><p>(Κατὰ αἱρέσεων, βιβλ. Α΄, κεφ. 11)</p><blockquote><p><em>κατ' αὐτοὺς γὰρ ἡ ἀλήθεια, <strong>ποτὲ μὲν ἐν Οὐαλεντίνῳ, ποτὲ δὲ ἐν Μαρκίωνι, ποτὲ δὲ ἐν Κηρίνθῳ, ἔπειτα δὲ ἐν Βασιλείδῃ, γέγονεν ἂν καὶ ἐν ἐκείνῳ τῷ ἀντιλέγοντι</strong>, τῷ μηδὲν σωτήριον εἰπεῖν δυνηθέντι. Ἕκαστος γὰρ αὐτῶν πάντη διεστραμμένος, ἑαυτὸν κανόνα τῆς ἀληθείας διαφθείρων, κηρύσσειν ἑαυτὸν οὐκ αἰσχύνεται.</em></p></blockquote><p>(<a href="https://bibleox.com/grc/la/w/LATIN-Adversus_haereses%2C_LIBER_III#HH-2">Κατὰ αἱρέσεων, βιβλ. Γ΄, κεφ. 2 (λατ.)</a>)</p><blockquote><p><em>Ἐλεγχόμενοι ὑπὸ τῶν ἐν ταῖς Γραφαῖς εἰς τὴν παρουσίαν τοῦ Χριστοῦ ἀναφερομένων, λέγουσιν ὅτι πρὸς τούτοις τινὰ ἀπὸ τοῦ Πληρώματος εἴρηται. Τίνα δὲ ταῦτά ἐστιν, οὐκέτι ταὐτὸ φρονοῦσιν, ἀλλ' <strong>ἄλλος ἄλλα περὶ αὐτῶν ἀποκρίνονται</strong>. <strong>Εἴ τις γὰρ βουλόμενος αὐτῶν πεῖραν λαβεῖν κατ' ἰδίαν ἐρωτήσειε περί τινος λόγου τοὺς παρ' αὐτοῖς ἐξοχωτάτους, εὑρήσει</strong> τὸν μὲν λέγοντα περὶ τοῦ Προπάτορος, τουτέστι τοῦ Βυθοῦ, εἶναι τὸ ἐρωτηθέν· ἄλλον δὲ περὶ τῆς Ἀρχῆς τῶν πάντων, τουτέστι τοῦ Μονογενοῦς· ἕτερον δὲ περὶ τοῦ Πατρὸς τῶν πάντων, τουτέστι τοῦ Λόγου· ἄλλον δὲ περὶ ἑνὸς τῶν ἐν τῷ Πληρώματι Αἰώνων λέγεσθαι· ἄλλον δὲ περὶ τοῦ Χριστοῦ, καὶ ἄλλον περὶ τοῦ Σωτῆρος. Ὁ δὲ παρ' αὐτοῖς ἐμπειρότατος, ἐπὶ πολὺ σιωπήσας, περὶ τοῦ Ὅρου φησὶν εἰρῆσθαι· ἄλλος δὲ τὴν ἐντὸς τοῦ Πληρώματος Σοφίαν σημαίνεσθαι· ἄλλος δὲ τὴν ἐκτὸς τοῦ Πληρώματος Μητέρα ἀναγγέλλεσθαι· ἄλλος δὲ τὸν Δημιουργὸν Θεὸν ἐρεῖ. Τοσαῦται <strong><mark>περὶ ἑνὸς ἐν αὐτοῖς εἰσι διαφωνίαι, περὶ τῶν αὐτῶν Γραφῶν διαφόρους ἔχοντες γνώμας</mark></strong>·</em></p></blockquote><p>(<a href="https://bibleox.com/grc/la/w/LATIN-Adversus_haereses%2C_LIBER_IV#HH-35-57">Κατὰ αἱρέσεων, βιβλ. Δ΄, κεφ. 35 (λατ.)</a>)</p><blockquote><p><em>Πάντες γὰρ οὗτοι πολλῷ ὕστεροι τῶν ἐπισκόπων εἰσίν, οἷς οἱ Ἀπόστολοι τὰς Ἐκκλησίας παρέδωκαν· καὶ τοῦτο ἐν τῷ τρίτῳ βιβλίῳ μετὰ πάσης ἐπιμελείας ἐδηλώσαμεν. Ἀνάγκην οὖν ἔχουσιν οἱ προειρημένοι αἱρετικοί, ἐπειδὴ τυφλοί εἰσι πρὸς τὴν ἀλήθειαν, ἄλλην καὶ ἄλλην πλανώμενοι πορεύεσθαι ὁδόν· καὶ διὰ τοῦτο ἀσυμφώνως καὶ ἀνακολούθως διεσπαρμένα ἐστὶ τὰ ἴχνη τῆς διδασκαλίας αὐτῶν. Ἡ <strong><mark>ὁδὸς</mark></strong> δὲ τῶν ἀπὸ τῆς Ἐκκλησίας περιτρέχει τὸν κόσμον ὅλον, ἅτε <strong><mark>βεβαίαν ἔχουσα τὴν ἀπὸ τῶν Ἀποστόλων παράδοσιν, καὶ παρέχουσα ἡμῖν ἰδεῖν ὅτι μία καὶ ἡ αὐτὴ πάντων ἐστὶν ἡ πίστις</mark></strong>, πάντων ἕνα καὶ τὸν αὐτὸν Θεὸν Πατέρα κηρυσσόντων, καὶ τὴν αὐτὴν τῆς ἐνανθρωπήσεως τοῦ Υἱοῦ τοῦ Θεοῦ οἰκονομίαν πιστευόντων, καὶ τὴν αὐτὴν τοῦ Πνεύματος δωρεὰν εἰδότων, καὶ τὰ αὐτὰ μελετώντων παραγγέλματα, καὶ <strong><mark>τὸν αὐτὸν τύπον τῆς περὶ τὴν Ἐκκλησίαν διατάξεως φυλασσόντων</mark></strong>, καὶ τὴν αὐτὴν τοῦ Κυρίου παρουσίαν προσδοκώντων, καὶ τὴν αὐτὴν τοῦ ὅλου ἀνθρώπου σωτηρίαν, τουτέστι ψυχῆς καὶ σώματος, ἀναμενούντων. </em></p><p><em>Καὶ τὸ κήρυγμα τῆς Ἐκκλησίας ἀληθές ἐστι καὶ βέβαιον, παρ' ᾗ μία καὶ ἡ αὐτὴ ὁδὸς σωτηρίας ἐν ὅλῳ τῷ κόσμῳ δείκνυται. Ταύτῃ γὰρ πεπίστευται τὸ φῶς τοῦ Θεοῦ, καὶ διὰ τοῦτο ἡ σοφία τοῦ Θεοῦ, δι' ἧς σῴζει πάντας ἀνθρώπους, «ἐν ἐξόδοις ὑμνεῖται, ἐν πλατείαις δὲ παρρησιάζεται, ἐπ' ἄκρων τειχῶν κηρύσσεται, ἐν δὲ πύλαις πόλεως θαρρούντως λαλεῖ». Πανταχοῦ γὰρ ἡ Ἐκκλησία κηρύσσει τὴν ἀλήθειαν· καὶ αὕτη ἐστὶν ἡ ἑπτάμυχος λυχνία, τὸ φῶς τοῦ Χριστοῦ βαστάζουσα. Οἱ τοίνυν <strong>ἀφιστάμενοι τοῦ κηρύγματος τῆς Ἐκκλησίας τὴν ἀπειρίαν τῶν ἁγίων πρεσβυτέρων ἐλέγχουσιν</strong>, οὐ κατανοοῦντες ὅσῳ πλείονος ἄξιός ἐστιν ὁ εὐσεβὴς ἰδιώτης τοῦ βλασφήμου καὶ ἀναιδοῦς σοφιστοῦ. <strong><mark>Τοιοῦτοι δέ εἰσι πάντες οἱ αἱρετικοί</mark></strong>, καὶ οἱ δοκοῦντες πλέον τι παρὰ τὴν ἀλήθειαν ἐξευρηκέναι, τοῖς προειρημένοις ἑπόμενοι, ποικίλως καὶ πολυτρόπως καὶ ἀσθενῶς τὴν ὁδὸν ποιούμενοι, <strong><mark>περὶ τῶν αὐτῶν οὐ τὰ αὐτὰ ἀεὶ φρονοῦντες</mark></strong>, ὡς τυφλοὶ ὑπὸ τυφλῶν περιάγονται, δικαίως ἐμπεσοῦνται εἰς τὸν λανθάνοντα τῆς ἀγνοίας βόθρον, ἀεὶ ζητοῦντες καὶ μηδέποτε τὴν ἀλήθειαν εὑρίσκοντες. </em></p><p><em>Διὸ φευκτέαι μὲν αἱ τούτων γνῶμαι, καὶ ἐπιμελέστερον τηρητέον, μή πού τι ὑπ' αὐτῶν βλαβῶμεν· <strong>καταφευκτέον δὲ ἐπὶ τὴν Ἐκκλησίαν, καὶ ἐν τοῖς κόλποις αὐτῆς ἀνατραφῆναι, καὶ ταῖς Κυριακαῖς Γραφαῖς ἐντραφῆναι</strong>. Πεφύτευται γὰρ ἡ Ἐκκλησία ὡς παράδεισος ἐν τῷ κόσμῳ τούτῳ. Διὸ «ἀπὸ παντὸς ξύλου τοῦ παραδείσου βρώσει φάγῃ», φησὶ τὸ Πνεῦμα τοῦ Θεοῦ, τουτέστιν ἀπὸ πάσης Γραφῆς Κυριακῆς φάγεσθε· ἐπὶ δὲ ὑψηλῷ φρονήματι μὴ φάγητε, <strong><mark>μηδὲ ἅψησθε τῆς ὅλης αἱρετικῆς διχοστασίας</mark></strong>.</em></p></blockquote><p>(<a href="https://bibleox.com/grc/la/w/LATIN-Adversus_haereses%2C_LIBER_V#HH-20">Κατὰ αἱρέσεων, βιβλ. Ε΄, κεφ. 20 (λατ.)</a>)</p><h3>Η διάταξη του χριστιανικού ναού είναι όμοια με την ουράνια πραγματικότητα στην Αποκάλυψη του Ιωάννη του Θεολόγου</h3><p>Η διάταξη του χριστιανικού ναού είναι όμοια με τη διάταξη του ουράνιου ναού (Αποκ. 11:1, 19):</p><ul><li><p>ο θρόνος — Αποκ. 4:10</p></li><li><p>το θυσιαστήριο — Αποκ. 8:3-5</p></li><li><p>η επτάφωτη λυχνία — Αποκ. 4:5</p></li><li><p>το θυμίαμα — Αποκ. 8:3, 5</p></li><li><p>οι άγιοι άγγελοι — Αποκ. 8:3; Αποκ. 15:6</p></li><li><p>οι άγιοι άνθρωποι — Αποκ. 6:9-11; Αποκ. 14:4-5</p></li></ul><p>Ο Ειρηναίος αναφέρεται στην Αποκάλυψη του Ιωάννη του Θεολόγου, λέγοντας ότι στα επίγεια πράγματα αρμόζει να είναι εικόνες των επουρανίων, που δημιουργήθηκαν από τον Θεό:</p><blockquote><p><em>Ὥσπερ οὖν οὐδενὸς τούτων δεῖται, βούλεται δὲ ὅμως ταῦτα γίνεσθαι ὑφ' ἡμῶν δι' ἡμᾶς αὐτούς, ἵνα μὴ ἄκαρποι ὦμεν· οὕτως αὐτὸς ὁ Λόγος ἔδωκε τῷ λαῷ ἐντολὴν τοῦ ποιεῖσθαι τὰς προσφοράς, καίπερ μὴ δεόμενος αὐτῶν, ἵνα μάθῃ δουλεύειν τῷ Θεῷ· οὕτω καὶ διὰ τοῦτο βούλεται <strong>καὶ ἡμᾶς</strong> <strong>προσφέρειν τὸ δῶρον <mark>τῷ θυσιαστηρίῳ</mark></strong> πυκνῶς καὶ ἀδιαλείπτως. Ἔστιν οὖν <strong><mark>θυσιαστήριον ἐν τοῖς οὐρανοῖς</mark></strong>· ἐκεῖ γὰρ αἱ προσευχαὶ ἡμῶν καὶ αἱ προσφοραὶ ἡμῶν κατευθύνονται· <strong><mark>καὶ ναός</mark></strong>, ὡς λέγει Ἰωάννης ἐν τῇ Ἀποκαλύψει· «καὶ ἠνοίγη ὁ ναὸς τοῦ Θεοῦ» (Ἀποκ. 11:19), καὶ σκηνή· «Ἰδοὺ γάρ, φησίν, ἡ σκηνὴ τοῦ Θεοῦ, ἐν ᾗ κατοικήσει μετὰ τῶν ἀνθρώπων» (Ἀποκ. 21:3). Τὰ δὲ δῶρα καὶ αἱ προσφοραὶ καὶ τὰ θύματα πάντα ἐν τύπῳ ὁ λαὸς ἔλαβεν, ὡς ἐδείχθη τῷ Μωυσῇ ἐν τῷ ὄρει, ὑπὸ ἑνὸς καὶ τοῦ αὐτοῦ Θεοῦ, οὗ καὶ νῦν ἐν τῇ Ἐκκλησίᾳ δοξάζεται τὸ ὄνομα ἐν πᾶσι τοῖς ἔθνεσιν. Ἀλλὰ τὰ μὲν <strong><mark>περὶ ἡμᾶς διακείμενα ἐπίγεια πρέπει τύπους εἶναι τῶν ἐπουρανίων</mark></strong>, γεγονότα ὅμως ὑπὸ τοῦ αὐτοῦ Θεοῦ. <strong>Οὐδὲ γὰρ ἄλλως ἠδύνατο ἀφομοιῶσαι τὴν τῶν πνευματικῶν εἰκόνα</strong>.</em></p></blockquote><p>(<a href="https://bibleox.com/grc/la/w/LATIN-Adversus_haereses%2C_LIBER_IV#HH-18-31">Κατὰ αἱρέσεων, βιβλ. Δ΄, κεφ. 18–19 (λατ.)</a>)</p>
    references: |-
      <p>Τα αποσπάσματα από το «Κατ’ αιρέσεων» (Έλεγχος και ανατροπή της ψευδωνύμου γνώσεως) παρατίθενται, όπου το ελληνικό κείμενο σώζεται, αυτολεξεί από την ελληνική έκδοση που είναι δημοσιευμένη στον ιστότοπο· η ορθογραφία, η στίξη και οι τόνοι μένουν όπως στην έκδοση, και διορθώνονται μόνο προφανή τυπογραφικά παράσιτα της ηλεκτρονικής μορφής (π. χ. τὸ σύμβολο ∆ ἀντὶ Δ, κολλημένες λέξεις). Επειδή όμως από το έργο σώζονται στα ελληνικά μόνο το πρώτο βιβλίο και αποσπάσματα των άλλων, το μεγαλύτερο μέρος των παραθεμάτων μεταφράστηκε από το λατινικό κείμενο του ιστοτόπου — την αρχαία λατινική μετάφραση, που είναι ο κύριος μάρτυρας του έργου — και σημειώνεται με «(λατ.)» στη γραμμή της πηγής· το ρωσικό κείμενο χρησιμοποιήθηκε ως έλεγχος. Όπου ένα χωρίο σώζεται εν μέρει στα ελληνικά, το ελληνικό μέρος δίνεται αυτούσιο και το υπόλοιπο μεταφράζεται από τα λατινικά. Τα αποσπάσματα από το «Δοκίμιον της αποστολικής κηρύξεως» μεταφράστηκαν από το ρωσικό, γιατί το έργο σώζεται μόνο αρμενικά. Οι μαρτυρίες του αγίου Ιουστίνου (Διάλογος προς Τρύφωνα 138, Απολογία 1, 61) και του Μαρτυρίου του αγίου Πολυκάρπου παρατίθενται από τις ελληνικές σελίδες τους στον ιστότοπο.</p><p>Η αφήγηση, οι τίτλοι και τα σχόλια είναι δική μας μετάφραση, στη δημοτική με μονοτονικό, ανεξάρτητα από το πολυτονικό των παραθεμάτων. Οι υπογραμμίσεις (έντονα, μαρκάρισμα, πλάγια) ακολουθούν το ρωσικό κείμενο. Οι ρωσικές επεξηγήσεις και οι μεταφραστικές σημειώσεις μέσα στις παραθέσεις («— σημ.») παραλείπονται. Η αρίθμηση των κεφαλαίων ακολουθεί την έκδοση του ελληνικού κειμένου· σε παρένθεση δίνεται ο αριθμός της λατινικής, όπου διαφέρει.</p><p>Μετάφραση: Ροντιόν Βλάσοφ, με χρήση τεχνητής νοημοσύνης, από τη <a href="https://bibleox.com/grc/ru/w/%D0%98%D1%80%D0%B8%D0%BD%D0%B5%D0%B9_%D0%9B%D0%B8%D0%BE%D0%BD%D1%81%D0%BA%D0%B8%D0%B9">ρωσική σελίδα αναφοράς</a>.</p>
