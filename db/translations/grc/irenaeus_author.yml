    meta_desc: "Ο Ειρηναίος Λουγδούνου, ιερομάρτυρας και επίσκοπος Λουγδούνου, μαθητής του Πολυκάρπου Σμύρνης: ο βίος του, η διδασκαλία του για τον Θεό και την Τριάδα, τον Χριστό και την ενανθρώπηση, την Εκκλησία και την Παράδοση, τα μυστήρια και τα έσχατα, με τα δικά του λόγια."
