    body: |-
      <p>Der Abschnitt mit den Werken des Basilius des Großen <strong>in griechischer Sprache</strong>: <a href="https://bibleox.com/de/grc/w/uQIN_%CE%92%CE%B1%CF%83%CE%AF%CE%BB%CE%B5%CE%B9%CE%BF%CF%82_%CE%BF_%CE%9C%CE%AD%CE%B3%CE%B1%CF%82_%CE%91%CE%B9%CF%8E%CE%BD%CE%B1%CF%82_IV/">hier entlang</a>. Der Wechsel in andere Sprachen ist ebenfalls oben über der Werkliste möglich.</p>
      <p><strong>Gedenktage</strong>: 1. (14.) Januar, 30. Januar (12. Februar) (Synaxis der ökumenischen Lehrer und Hierarchen)</p>
      <h2>Biografie</h2>
      <h3>Geburt, Kindheit, Jugend- und junge Jahre des Hierarchen</h3>
      <p>Er wurde um das Jahr 330 in Kappadokien geboren. Er stammte aus einer vornehmen, reichen und sehr frommen Familie. Seine leibliche Großmutter väterlicherseits, Makrina die Ältere, war zu ihrer Zeit eine Schülerin Gregors des Wundertäters. Ihr Gemahl, der Großvater des Basilius des Großen, war ebenfalls ein eifriger Christ. Beide wurden durch das Bekenntnis des Herrn verherrlicht. In den Zeiten der Verfolgungen mussten sie sich verbergen und viele Entbehrungen und erzwungene Trauer ertragen.</p>
      <p>Ihr Sohn, Basilius der Ältere, der Vater des Basilius des Großen, war ein anerkannter Advokat und zugleich Lehrer der Rhetorik. Er besaß Güter in Kappadokien, Pontus und Kleinarmenien. Aus seiner Ehe mit der seltenen Schönheit Emmelia, einer Waise, der Tochter eines Märtyrers, die Keuschheit und Jungfräulichkeit verehrte, aber heiratete, um den aufdringlichen Nachstellungen gottloser Menschen zu entgehen, gingen fünf Töchter und vier Söhne hervor: Basilius, Naucratius, Gregor und Petrus.</p>
      <p>Naucratius starb ziemlich jung, Gregor wurde mit der Zeit der bekannte Hierarch von Nyssa, und Petrus – Bischof von Sebaste. Die Mutter Emmelia widmete nach dem Tod ihres geliebten Gatten ihr Leben der monastischen Tat. Ihre Tochter, Makrina die Jüngere, die Schwester des Basilius des Großen, erwählte ebenfalls den monastischen Weg.</p>
      <p>Die Kindheit des Basilius verlief auf dem Gut seines Vaters in Pontus. Als Säugling erlitt er eine schwere Krankheit, von der er nicht anders als durch ein Wunder geheilt wurde. Die frühen Anschauungen und die Verhaltensweise des Basilius bildeten sich unter Mitwirkung seiner Mutter heraus. Doch eine besondere Rolle in der Erziehung spielte seine Großmutter Makrina. Als das Kind herangewachsen war, übernahm der Vater seine Unterweisung. Insbesondere lehrte er den Sohn die griechische Grammatik und die Literatur.</p>
      <p>Die weitere Bildung erhielt Basilius in Cäsarea in Kappadokien. Wahrscheinlich begegnete er dort zum ersten Mal dem künftigen Hierarchen Gregor dem Theologen. Danach studierte Basilius in Konstantinopel, wo er, wie man annimmt, den bekannten Sophisten Libanios kennenlernte.</p>
      <p>Schließlich begab sich Basilius in das „Zentrum der Bildung“, nach Athen. Dort ergänzte er seine Kenntnisse in der Literatur und der Philosophie und schärfte seine Meisterschaft in der Beredsamkeit und der Redekunst. Man behauptet, dass Basilius außerdem Astronomie und Medizin erlernte. In Athen führte die göttliche Vorsehung ihn erneut mit Gregor dem Theologen zusammen, der etwas früher dorthin gekommen war. Der gemeinsame Aufenthalt nährte und festigte ihre Freundschaft. Ebenda machte Basilius die Bekanntschaft des künftigen Kaisers Julian, des Verfolgers und Verwüsters der Kirche.</p>
      <h3>Die ersten Schritte des Basilius des Großen auf dem christlichen Wirkungsfeld</h3>
      <p>Um das Jahr 358, fast fünf Jahre nach seinem Aufenthalt in Athen, kehrte Basilius nach Cäsarea zurück. Eine Zeit lang beschäftigte er sich auf Bitten der Mitbürger mit dem Unterricht in der Rhetorik. In diesem Zeitraum empfing er die Taufe, möglicherweise vom Bischof von Cäsarea Dianius, den er verehrte. Obwohl Basilius selbst in so reifem Alter getauft wurde, wies er später auf die Unangemessenheit hin, dieses Ereignis hinauszuzögern.</p>
      <p>Bald darauf begab sich Basilius, bewegt von Wissbegier und vom Streben, das asketische Leben kennenzulernen, auf eine Wanderschaft durch die Länder Syriens, Palästinas und Ägyptens. Hier trat er aufs engste den Idealen der Asketen nahe.</p>
      <p>Nach seiner Rückkehr verteilte er sein ganzes Vermögen an die Bedürftigen, behielt nur die notwendige Kleidung bei sich und zog sich mit wenigen Gleichgesinnten an einen einsamen Ort in Pontus zurück. In der Abgeschiedenheit verrichtete er körperliche Arbeit, widmete sich Gebeten, der Lektüre der Schriften und der Werke der Väter sowie asketischen Taten. Die gewöhnliche Nahrung des Basilius waren Brot und Wasser. Er schlief auf der Erde. Bald gesellte sich ihm sein treuer Gefährte Gregor der Theologe zu. In dieser Zeit stellten die Freunde aus Auszügen aus den Werken des Origenes eine Sammlung zusammen – die „Philokalie“.</p>
      <p>Die harten Taten und das hochsittliche Leben der christlichen Einsiedler zogen ihnen viele Nachahmer und Anhänger zu, die herbeikamen und sich in der Nähe niederließen. Basilius nahm regen Anteil an der Gestaltung des religiös-sittlichen Lebens der sich mehrenden Gemeinden.</p>
      <p>Man muss sagen, dass die Vorstellungen des Basilius des Großen vom Mönchtum sich von den Überzeugungen unterschieden, die damals unter den Asketen Ägyptens herrschten. Bekanntlich gab er der gemeinschaftlichen Ordnung der Klöster den Vorzug, da er meinte, diese Form des Mönchtums biete größere Möglichkeiten zur Verwirklichung der brüderlichen christlichen Liebe. Auf die Bitte der Einsiedler stellte Basilius eine für sie notwendige Sammlung sittlicher Regeln zusammen.</p>
      <p>Auch die dogmatischen Streitigkeiten, die die Kirche bewegten, blieben nicht außerhalb seiner Aufmerksamkeit. Es wird behauptet, dass Basilius, um der Kirche beizustehen, es sich erlauben konnte, seine ihm ans Herz gewachsene Zuflucht zu verlassen. So begab er sich im Jahr 360 zusammen mit dem Bischof Dianius, der ihn inzwischen zum Lektor geweiht hatte, nach Konstantinopel zu einer kirchlichen Synode.</p>
      <h3>Der Dienst des Basilius des Großen im Rang eines Presbyters</h3>
      <p>Im Jahr 363 oder 364 lud Eusebius von Cäsarea, der Nachfolger des Dianius, Basilius nach Cäsarea ein und weihte ihn zum Priester. Anfangs widersetzte sich Basilius, da er sich für unwürdig hielt und darüber betrübt war, die Möglichkeit der ihm lieb gewordenen monastischen Einsamkeit verlieren zu müssen.</p>
      <p>Der Zustand der Kirche war damals verworren, um nicht zu sagen: bedrückend. Die Habgier der Priester, die Simonie, der Triumph häretischer Irrtümer, Intrigen, Feindschaft – das sind nur wenige der Schwierigkeiten, mit denen Basilius in seiner Art hirtenamtlichen Wirkens konfrontiert wurde.</p>
      <p>Als außergewöhnliche Persönlichkeit wurde er von nun an dem Erzhirten ein Helfer sowohl in Verwaltungsangelegenheiten als auch im Kampf um die Reinheit des Glaubens und der Sitten unter den Christen. In der Folge rief dies bei dem Bischof, der dem Basilius in Beredsamkeit und Bildung erheblich nachstand, eine ungesunde Eifersucht hervor, und zwischen ihnen kam es zur Zwietracht. Da Basilius die ohnehin schon verwickelte Lage nicht verschärfen wollte, zeigte er Besonnenheit und zog sich erneut in die Abgeschiedenheit zurück. Indessen hielt Basilius es angesichts der zunehmenden Macht des Arianismus für seine Pflicht, zurückzukehren. Die Zwietracht wurde geglättet und überwunden.</p>
      <p>Im Jahr 368, während einer durch Dürre verursachten Hungersnot, bewog Basilius durch die Kraft hirtenamtlicher Ermahnung, des Beispiels und der Autorität die wohlhabenden Bürger zur Wohltätigkeit und überzeugte sie, die Speicher zu öffnen und mit den Bedürftigen zu teilen. Für die Hilfe an die Hungernden wurde auch das Gut der inzwischen verstorbenen Mutter des Basilius verwendet, das ihm von Rechts wegen als Erbe zugefallen war.</p>
      <h3>Die hierarchische Tätigkeit des Basilius des Großen</h3>
      <p>Im Jahr 370 bestieg nach dem Tod des Eusebius Basilius der Große den Stuhl – entgegen dem Unwillen und dem Widerstand einiger Laien und Bischöfe. Kaiser Valens, der sich als strenger Vorkämpfer des Arianismus erklärte, unternahm viele Anstrengungen, um die Standhaftigkeit der Gegner zu brechen, darunter die des Hierarchen Basilius, der der Orthodoxie treu war. Die orthodoxen Menschen sahen sich Verfolgungen, Entbehrungen und Verbannungen ausgesetzt.</p>
      <p>Zu dieser Zeit wurde Kappadokien in zwei Provinzen geteilt, was zur Verkleinerung des Gebietes führte, das von den orthodoxen Hirten kanonisch geleitet wurde: einen seiner Teile leitete in religiöser Hinsicht der gottlose Bischof von Tyana, Anthimos. Seinerseits hörte der in seinen Überzeugungen feste Basilius nicht auf, für die Reinheit des Glaubens auf dem Gebiet ganz Kappadokiens zu kämpfen, und fuhr fort, würdige Bischöfe einzusetzen. In diesem Zusammenhang wurde zum Beispiel der Bruder des Hierarchen Basilius, Gregor, zum Bischof in Nyssa eingesetzt.</p>
      <p>Neben der asketischen und hirtenamtlichen Frömmigkeit war das Wirken des Basilius des Großen durch die Organisation der Hilfe für die Armen gekennzeichnet, wobei er selbst aus eigenem Willen einer der ärmsten Menschen war. Unter anderem richtete der Hierarch Armenhäuser ein. Zum Beispiel errichtete er in Cäsarea ein Krankenhaus und eine Fremdenherberge.</p>
      <p>Basilius der Große starb am 1. Januar 379, ohne noch ein paar Jahre bis zum Zweiten Ökumenischen Konzil erlebt zu haben. Ihn betrauerte nahezu die gesamte Bevölkerung Cäsareas. Für seine Verdienste und die höchste Heiligkeit seines Lebens wurde Basilius von der Kirche in die Schar der Heiligen aufgenommen und wird mit dem Namen „der Große“ verehrt.</p>
      <h2>Das Werk des Hierarchen Basilius als kirchlicher Schriftsteller</h2>
      <p>Im Verlauf seines literarischen Weges erwies sich Basilius der Große als ein Schriftsteller von weitem Horizont und vielfältigen theologischen Richtungen. Unter seinen Werken ragen Schriften asketischen und geistlich-sittlichen, polemischen und dogmatischen Charakters hervor. Einen bedeutenden Teil der schöpferischen Werke bilden Reden und Briefe. Außerdem gehört dem großen Kappadokier eine Vielzahl von Regeln.</p>
      <p>Leider sind nicht alle Werke des Hierarchen bis auf unsere Tage gelangt. Zugleich erweckt eine kleine Zahl der ihm traditionell zugeschriebenen Schriften Zweifel an der Echtheit.</p>
      <p>In seinen asketischen Schriften behandelte und erschloss Basilius der Große Themen wie die Liebe zu Gott und zum Nächsten; Fragen über den Glauben, die Sünde, die Buße; über Wahrheit und Lüge; über die Verführten und die Verführer, über die Festigkeit in Versuchungen; über Armut und Reichtum; über das Nachtragen von Unrecht; die Trauer beim Anblick eines sündigenden Bruders; über die Gaben Gottes; das Gericht Gottes; die Freude an Leiden für Christus; über die Trauer um Sterbende; den menschlichen Ruhm; über Kinder und Eltern, Jungfrauen und Witwen, Krieger und Herrscher u. a.</p>
      <p>Auf dem Gebiet der orthodoxen Dogmatik hatte und hat die von ihm klar formulierte Bestimmung und Abgrenzung der Begriffe „Wesen“ (οὐσία) und „Hypostase“ (ὑπόστασις) die größte Bedeutung, die für die rechte Erfassung des Dogmas von der Heiligsten Dreifaltigkeit notwendig sind. Die Lehre über den Vater, den Sohn und den Heiligen Geist legte er in den Büchern gegen den Häretiker Eunomius und in der Schrift „Über den Heiligen Geist“ dar.</p>
      <p>Viel Aufmerksamkeit widmete der Hierarch den Sakramenten der Kirche – der Taufe und der Eucharistie – sowie der Frage des Priesterdienstes. Eines der wichtigsten Verdienste des Erzhirten ist die Abfassung der Ordnung der Göttlichen Liturgie (siehe ausführlicher: Liturgie).</p>
      <p>Unter den exegetischen Werken des Basilius des Großen ragen die Homilien über das Hexaemeron, über die Psalmen und die Auslegung des Buches des Propheten Jesaja hervor.</p>
      <h2>Hymnographie</h2>
      <p><strong>Tropar an den heiligen Basilius den Großen, Erzbischof von Cäsarea in Kappadokien, 1. Ton</strong></p>
      <blockquote>
      <p>Über die ganze Erde erging deine Verkündigung, / denn sie nahm dein Wort auf, / durch das du gottgemäß gelehrt hast, / die Natur des Seienden hast du erhellt, / die menschlichen Sitten hast du geschmückt, / königliches Priestertum, ehrwürdiger Vater, / flehe Christus Gott an // dass er unsere Seelen rette.</p>
      </blockquote>
      <p><strong>Kondak an den heiligen Basilius den Großen, Erzbischof von Cäsarea in Kappadokien, 4. Ton</strong></p>
      <blockquote>
      <p>Du bist erschienen als unerschütterliches Fundament der Kirche, / allen Menschen schenkend die unverlierbare Herrschaft, / sie versiegelnd mit deinen Weisungen, / du vom Himmel Geoffenbarter, ehrwürdiger Basilius.</p>
      </blockquote>
