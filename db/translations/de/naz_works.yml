      <p><em>Ausgewählte Reden (Bibliothek der Kirchenväter).</em></p><h2>I. Rede</h2><p>* I. Rede.*</p><p><em>Das hl. Osterfest. Erwähnung der eigenen Zaghaftigkeit</em>.</p><p>Tag der Auferstehung! Ein günstiger Anfang! Lassen wir unser Licht leuchten am Festtage! Umarmen wir einander! Bezeichnen wir als Brüder auch die, welche uns hassen, und selbstverständlich die, welche aus Liebe gearbeitet und gelitten haben! Fügen wir uns in allem der Auferstehung! Verzeihen wir einander! Ich verzeihe euch die süße Gewalttat, die ich jetzt erwähnen muß, und ihr, die süßen Gewaltmenschen, verzeiht, wenn meine Zaghaftigkeit euren Tadel erregte; denn sie ist ja besser und Gott lieber als die Voreiligkeit anderer. Es ist nämlich gut, sowohl einige Zeit sich Gott zu entziehen, wie es der bekannte Moses seinerzeit getan hat und später Jeremias, als auch bereitwillig gleich Aaron und Isaias dem Rufe Gottes zu folgen, wenn nur beides in Gott wohlgefälliger Weise geschieht: das eine um der eigenen Schwäche willen, das andere wegen der Macht des Rufenden.</p><p>Die geheimnisvolle Gnade hat mich gesalbt, der geheimnisvollen Gnade habe ich mich ein wenig entzogen, bis ich mich geprüft hatte. Mit der geheimnisvollen Gnade bin ich hier. Ich begrüße den Tag als Helfer in meiner Feigheit und Schwäche. Möge der, welcher heute von den Toten auferstanden ist, auch mich durch seinen Geist erneuern! Möge er mir den neuen Menschen anziehen und mich der neuen Schöpfung, den nach Gott Geborenen, als guten Erzieher und als einen Lehrer beigesellen, der mit Christus gerne getötet wird und mit ihm aufersteht!</p><p>[Forts. v. ] Gestern wurde das Lamm geschlachtet und wurden die Türpfosten bestrichen. Ägypten beweinte die Erstgeburt, aber an uns ging der Würgengel vorüber; das Siegel war ihm schrecklich und ehrwürdig, durch das kostbare Blut wurden wir geschützt. Heute sind wir vollends dem Ägypter, dem Despoten Pharao und den lästigen Aufsehern entkommen und aus dem Lehme und vom Ziegelbrennen befreit worden. Niemand soll uns hindern, daß wir unserem Herrn und Gott das Fest des Auszuges feiern, und zwar „nicht im alten Sauerteige der Sünde und Bosheit, sondern mit dem Ungesäuerten der Lauterkeit und Wahrheit“, frei vom Sauerteige Ägyptens und der Gottlosigkeit.</p><p>Gestern wurde ich mit Christus gekreuzigt, heute werde ich mit ihm verherrlicht. Gestern wurde ich mit ihm getötet, heute werde ich mit ihm zum Leben gerufen. Gestern wurde ich mit ihm begraben, heute werde ich mit ihm auferweckt. Wohlan, bringen wir Opfer dem, der für uns gelitten hat und auferstanden ist! Ihr denkt vielleicht an Gold oder Silber oder feines Gewebe oder glänzende und kostbare Steine, an vergängliche, irdische, niedrige Stoffe, woran immer die Bösen und die Diener der Erde und des Fürsten dieser Welt größeren Anteil haben. Opfern wir uns selbst, den Gott teuersten und eigensten Besitz! Geben wir dem Bilde das, was nach dem Bilde geschaffen ist, erkennen wir unsere Würde, halten wir das Urbild in Ehren! Erfassen wir die Bedeutung des geheimnisvollen Festes und den Zweck des Todes Christi!</p><p>[Forts. v. ] Werden wir wie Christus, da Christus gleich uns geworden ist! Werden wir seinetwillen Götter, da er unsertwegen Mensch geworden ist! Das Geringere nahm er an, um das Bessere zu geben. Er wurde arm, damit wir durch seine Armut reich würden. Er nahm die Gestalt eines Knechtes an, damit wir die Freiheit erhielten. Er stieg auf die Erde herab, damit wir erhöht würden. Er ließ sich versuchen, damit wir siegen. Er ließ sich entehren, um uns zu ehren. Er starb, um zu retten. Er fuhr zum Himmel, um die, welche von der Sünde zu Boden gestreckt wurden, an sich zu ziehen. Alles möge man ihm geben, ihm opfern, der sich als Lösegeld und Sühne für uns hingegeben hat! Keine Gabe aber wird wertvoller sein als die eigene Person, soferne sie das Geheimnis erfaßt und um Christi willen alles geworden ist, was er unsertwegen geworden war.</p><p>Der gute Hirte, der sein Leben für seine Schafe hingibt, schenkt euch, wie ihr seht, einen Hirten Er gibt sich euch hin in doppelter statt in einfacher Gestalt. Die Stütze des Alters macht er zu einer Stütze im geistlichen Dienste. Dem leblosen Tempel gibt er einen lebendigen bei, dem herrlichen, ja himmlischen den, der so und so geartet war und so und so viele Jahre zählt, aber doch ihm nun sehr wertvoll ist, da er unter vielen Schweißtropfen und Mühen fertiggestellt wurde und ― fügen wir es bei! ― der Mühen würdig war. Und all das Seinige gibt der Hirte euch hin. Welche Hochherzigkeit oder, um es richtiger zu sagen, welche väterliche Liebe! Er gibt euch das Alter, die Jugend, den Tempel, den Hohenpriester, den Erblasser, den Erben und die Lehren, nach welchen ihr verlangtet, nicht eitle, in der Luft verfliegende, nur bis zu den Ohren reichende Lehren, sondern Lehren, die der Geist schreibt und auf Tafeln von Stein oder von Fleisch eingräbt, Lehren, die nicht auf die Oberfläche geritzt sind und leicht ausgelöscht werden können, die vielmehr tief eingezeichnet sind mit Gnade, nicht mit Tinte.</p><p>Dies hat euch geschenkt unser ehrwürdiger Abraham, der Patriarch, das teure, ehrwürdige Haupt, die Wohnstätte alles Guten, der Wegweiser zur Tugend, der vollkommene Priester, der heute dem Herrn das freiwillige Opfer darbringt, nämlich den Eingeborenen, der uns verheißen war. Ihr eurerseits aber sollt euch Gott und uns schenken, indem ihr eine gute Herde werdet, euch am Orte der Weide lagert, am erquickenden Wasser erfrischet, euren Hirten recht kennenlernet und von ihm erkannt werdet, ihm, wenn er mit Hirtenliebe und in Freiheit ruft, durch die Türe folgend, nicht aber einem Fremden euch anschließend, der gleich Räubern und Feinden über die Umfriedung steigt, und nicht auf fremde Stimme hörend, welche verführt und von der Wahrheit weg ins Gebirge, in die Wüste, in Schluchten, an vom Herrn nicht aufgesuchte Orte verlockt, vom gesunden Glauben an den Vater, den Sohn und den Heil. Geist, an die eine Gottheit und Macht trennt, mit verdorbenen Truglehren fesselt und vom wahren, ersten Hirten ablenkt. Meine Schafe haben stets auf die Stimme des Glaubens gehört und mögen immer darauf hören. Möchten wir alle, Hirten und Herde, fern von den Truglehren, der ungesunden, tödlichen Weide, geweidet werden und weiden, alle jetzt und in der jenseitigen Ruhe eins in Christus Jesus, dem die Ehre und Macht sei in Ewigkeit! Amen.II. Rede</p><h2>II. Rede</h2><p><em>II. Rede.</em></p><p><em>Gregor verteidigt seine nach der Priesterweihe erfolgte Flucht in den Pontus und seine Rückkehr und spricht über die Bedeutung des Priestertums.</em></p><p>Ich bin besiegt und gebe meine Niederlage zu, „Ich habe mich dem Herrn unterworfen und zu ihm gebetet.“ Mit dem seligen David oder vielmehr mit dem, der durch ihn gesprochen hat und immer noch durch ihn spricht, soll die Rede beginnen. Denn wer eine Rede oder eine Handlung unternimmt, tut am besten, mit Gott anzufangen und in Gott zu enden. Über mein anfängliches Aufbegehren und meinen Kleinmut, die mich zur Flucht in die Ferne und zu einer den Freunden wohl zu langen Abwesenheit von euch verleiteten, oder über meine jetzige Gefügigkeit und Sinnesänderung, welche mich euch wieder zurückgaben, mag der eine so, der andere anders denken und urteilen, je nachdem er von Haß oder Liebe sich führen läßt. Der eine kennt keine Verzeihung, der andere nimmt mich ohne weiteres auf. Am liebsten reden ja die Menschen über fremde Angelegenheiten, vor allem, wenn sie eben von Wohlwollen oder Haß geleitet werden, von Gefühlsstimmungen, bei denen die Wahrheit in der Regel zu kurz kommt. Ich aber werde furchtlos der Wahrheit die Ehre geben und unparteiisch sowohl gegenüber unseren Anklägern wie gegenüber unseren eifrigen Verteidigern entscheiden, mich selbst teils anklagend, teils verteidigend.</p><p>[Forts. v. ] Um methodisch vorzugehen, will ich sachgemäß zuerst von meiner Feigheit sprechen. Denn ich möchte nicht, daß solche, die all unser gutes und sonstiges Tun und Treiben genau beobachten, an mir Anstoß nehmen, nachdem es nun einmal Gott gefügt hatte, daß wir bei den Christen eine Stellung einnehmen. Sollten einige bereits Anstoß genommen haben, dann wird meine Verteidigungsrede den Schaden wieder gutmachen. Es ist nämlich gut, weder durch tatsächliche Fehler noch, so weit es möglich ist und die Umstände es gestatten, durch Erregung von Verdacht dem Volke Anstoß und Ärgernis zu geben; wissen wir ja doch, daß der Wahrhaftige über die, die nur eines von den Kleinen ärgern, unerläßliche und schwerste Strafen verhängt.</p><p>Was mir begegnete, ihr Männer, geschah nicht, weil es mir an Bildung oder Erkenntnis fehlte, noch viel weniger ― um mich ein wenig zu rühmen ― aus Geringschätzung göttlicher Gesetze und Gebote. Wie im Körper das eine Glied eine beherrschende und überragende Bedeutung hat, während ein anderes beherrscht und geführt wird, so hat Gott in den Kirchen teils in seiner vergeltenden Gerechtigkeit, teils in seiner das Ganze zusammenfassenden Fürsorge bestimmt, daß die einen, für die es so nützlich ist, geweidet und regiert und durch Wort und Tat zur Pflicht angehalten werden, die anderen aber, welche sich vor dem Volke durch Tugend und durch innige Beziehung zu Gott auszeichnen, zur Verwirklichung der Kirche Hirten und Lehrer seien als Seele des Leibes oder als Geist der Seele. Beide Teile, die Nichtbevorzugten und die Bevorzugten, sollen nämlich gleich Gliedern miteinander vereint und verbunden und durch das Band des Geistes zusammengefügt und zusammengekettet als ein einziger vollkommener Körper erscheinen, welcher Christi, unseres Hauptes, würdig ist.</p><p>Weder Menschen noch anderen Wesen ist ― ich weiß es ― Anarchie und Unordnung vorteilhafter als Ordnung und Obrigkeit. Für Menschen ist sie am allerschlimmsten, da sie mehr Gefahren ausgesetzt sind. Wenn sie nicht das erste Gebot der Vernunft, Abwege zu meiden, beachten, ist es wichtig, daß sie sich doch nach dem zweiten Gebot der Vernunft richten, nämlich sich vom Abweg zurückführen zu lassen. Da diese Forderung gut und gerecht erschien, so ist der Wunsch, alle sollen regieren, nach meinem Dafürhalten nicht weniger schlimm und ordnungswidrig wie das Verlangen, keiner solle die Herrschaft übernehmen. Würden alle die Führung, mag man sie als Würde oder als Vorrang bezeichnen, von sich weisen, dann würde das schöne Ganze der Kirche größtenteils verstümmelt werden, und es würde seine Schönheit verlieren. Wo würde bei uns noch Gott von jemandem die geheimnisvolle, erhebende Verehrung, die an Größe und Würde alles bei uns übertrifft, erhalten, wenn König und Führer, Priestertum und Opfer und alles fehlt, was den Treulosen in alter Zeit wegen ihrer großen Sünden zu schwerster Bestrafung entzogen worden war?</p><p>Daß aus einem Untergebenen ein Führer wird, ist doch für die vielen, welche der göttlichen Philosophie obliegen, nichts Unerhörtes und Verkehrtes. Es widerspricht nicht den Gesetzen der Philosophie und ist nicht tadelnswert, so wenig als die Übernahme des Dienstes eines Untersteuermannes durch einen erprobten Schiffer oder die Anvertrauung des Kapitänspostens an einen Untersteuermann, der sich gut auf die Winde versteht, oder ― wenn du ein anderes Beispiel willst ― die Bekleidung der Hauptmannstelle durch einen tapferen Soldaten und die Führung des Feldherrnamtes und des Oberbefehles im ganzen Kriege durch einen tüchtigen Hauptmann.</p><p>Wahrlich, ich habe mich auch nicht, wie wohl mancher von den ganz Törichten und Schlimmen, welche den Mitmenschen nach den eigenen Leidenschaften beurteilen, annimmt, aus Verlangen nach höherer Stelle geschämt, die Rangordnung einzuhalten. Von der göttlichen Größe und menschlichen Schwäche bin ich zu sehr überzeugt, um nicht zu wissen, daß es für jedes Geschöpf eine große Ehre ist, wenn es nur auf irgend welche Weise sich Gott, dem allerherrlichsten und glänzendsten Wesen, das durch seine Reinheit über allen materiellen und geistigen Geschöpfen erhaben ist, nähern darf.</p><p>Was ist es, das ich erfahren mußte? Welches ist der Grund meines Widerstrebens? Denn der Masse schien ich damals nicht konsequent zu verfahren, nicht der zu sein, für den man mich hielt, von Grund aus mich verändert zu haben und mehr als billig zu widerstreben und eigene Wege zu gehen. Da ihr schon längst darnach verlangt, sollt ihr nunmehr die Gründe meines Betragens vernehmen.</p><p>Vor allem geriet ich, weil mich der Schlag unerwartet traf, außer Fassung gleich denen, die durch plötzlichen Lärm verwirrt werden; so verlor ich den Respekt, an den ich ständig gewöhnt war. Ferner überkam mich Liebe zum teuren Gut der Einsamkeit und Zurückgezogenheit. Da ich mich wie kaum ein anderer von den Gebildeten früh darnach sehnte, sie Gott in recht großen und schweren Gefahren versprach, bereits daran nippte, so daß ich dem Ziele nahe war, und das Kosten die Sehnsucht noch mehr anfachte, konnte ich es nicht ertragen, daß man mich tyrannisierte, mitten in das Weltgetümmel hineinstieß und mit Gewalt aus dem heiligen Asyle dieses Lebens wegschleppte.</p><p>[Forts. v. ] Etwas unvergleichlich Großes schien es mir zu sein, den Sinneseindrücken verschlossen, dem Fleisch und der Welt entrückt, in sich selbst versunken, mit Menschen nur, wo es notwendig ist, in Fühlung stehend, mit sich und Gott sprechend jenseits der sichtbaren Welt zu leben, die göttlichen Eingebungen stets rein, ungetrübt durch irdische, trügerische Eindrücke in sich zu bewahren, ein wahrhaft fehlerloser Spiegel Gottes und der göttlichen Ideen zu sein und, Licht für das Licht, Helligkeit für das Halbdunkel erhaltend, immer wieder zu werden, bereits das Glück der zukünftigen Welt hoffend zu genießen, mit den Engeln zu verkehren, noch auf Erden weilend, aber der Erde entrückt vom Geiste in den Himmel gehoben zu werden. Wenn einer unter euch von der gleichen Sehnsucht ergriffen ist, versteht er meine Worte und wird meiner damaligen Leidenschaft verzeihen. Die meisten dürfte ich wohl nicht mit Worten überzeugen. Ihnen erscheint die Sache lächerlich; denn sie sind schlecht unterrichtet von ihrem eigenen Unverstand oder von denen, welche dieses Berufes unwürdig sind, einer guten Sache einen schlechten Namen gegeben, Philosophie zu ehrgeizigen Bestrebungen verwendet haben, unterstützt vom Neid und von der Bosheit der Masse, die zu noch Schlimmerem bereit ist. Sünder sind sie, sei es, daß sie das Böse vollbringen, sei es, daß sie dem Guten nicht Glauben schenken.</p><p>Überdies wandelte mich ― um euch alle Geheimnisse zu verraten ― noch eine andere Regung an, von der ich aber nicht weiß, ob sie als gemein oder als edel zu bezeichnen ist. Genug, ich hatte sie. Ich schämte mich nämlich wegen der anderen, welche um nichts besser als die Masse sind ― es will etwas heißen, daß sie nicht um vieles schlimmer sind! ― und welche mit ungewaschenen Händen, wie man sagt, und mit ungeweihter Seele ins Allerheiligste eindringen und noch, ehe sie würdig sind, dem Heiligtum zu nahen, nach dem Altare trachten und sich um den heiligen Tisch drängen und stoßen, gerade als würden sie in diesem Amt nicht ein Vorbild für die Tugend, sondern ein Mittel für den Lebensunterhalt erblicken und glauben, der heilige Beruf sei nicht mit Verantwortung verbunden, sondern kontrollfreier Dienst. Der Zahl nach sind sie denen überlegen, über welche sie gesetzt sind. Traurige Gläubige, armselige Würdenträger sind sie. Mir will scheinen, daß, wenn das Böse mit der Zeit zunimmt, es ihnen sogar an solchen fehlen wird, über die sie herrschen, daß es statt solcher, die sich von Gott belehren lassen, wovon die Verheißung spricht, nur Lehrer und nur Propheten gibt, so daß selbst Saul unter die Propheten kommt, wie es in jener alten Geschichte und sinnbildlichen Rede heißt. Dann und wann herrschten mancherlei Übel, sie nahmen aber wieder ab. Doch nie erreichen oder erreichten sie eine solche Höhe, wie jetzt dieses schimpfliche und sündhafte Streben unter den Christen. Mag es auch über unsere Kräfte gehen, dem gewaltigen Verderben zu wehren, so müssen wir es doch, um ein klein wenig Tugend zu üben, hassen und uns darüber schämen.</p><p>Ich komme nun zum letzten und wichtigsten Grunde, zum Gipfelpunkte meiner Ausführung. Nicht werde ich lügen. Nicht darf lügen, wer über so wichtige Dinge spricht.</p><p>Weder halte ich es jetzt, noch hielt ich es für einerlei, ob man eine Herde Schafe oder Rinder hütet oder ob man Seelen leitet. Im ersten Falle genügt es, die Rinder oder Schafe recht feist und fett zu machen. Mit Rücksicht auf diesen Zweck sucht der Hirte wasserreiche, günstige Weideplätze, wechselt die Weide, gönnt Ruhe und verschafft Bewegung, treibt bisweilen mit dem Stocke, meist mit der Flöte. Etwas anderes hat der Hirte nicht zu tun, nur muß er noch gelegentlich mit Wölfen kämpfen und bisweilen nach einem kranken Stücke schauen. Meist kümmert er sich um Flötenspiel unter schattigen Eichen, sorgt dafür, sich auf schönen Matten neben kühlem Wasser auszustrecken, unter sanften Winden ein Naturlager zu bereiten, wohl auch ein Liebeslied beim Becher zu singen, mit den Rindern und Schafen zu plaudern und ein recht fettes Stück zu verzehren oder zu verkaufen. Noch keiner aber hat an Tugenden von Schafen oder Rindern gedacht. Welche Tugend sollte ihnen denn eigen sein? Oder wer achtet mehr auf das Wohl der Herden als auf sein eigenes Glück?</p><p>[Forts. v. ] Ist es für den Menschen schon schwer, gehorchen zu lernen, so ist es für ihn noch viel schwieriger, das Befehlen zu verstehen, namentlich in unserem Berufe, der auf göttlichem Gesetze gegründet ist und zu Gott führt, und der in den Augen der Vernünftigen entsprechend seiner Erhabenheit und Würde auch Gefahren in sich birgt.</p><p>Zunächst darf einer gleich Silber und Gold in keiner Lage, zu keiner Zeit, in keinen Verhältnissen einen falschen, unechten Klang haben und keinerlei Schlacken an sich zeigen, welche noch stärkeres Feuer nötig hätten. Das Unglück wäre um so größer, je größer die Zahl der Untergebenen ist. Denn wenn eine Sünde über viele gebietet, ist sie schlimmer, als wenn sie nur mit einem einzelnen zu tun hat.</p><p>Nicht so leicht nimmt ein Tuch die beste Farbe oder ein nahe liegender Gegenstand schlechten oder guten Geruch an, nicht so leicht verbreitet sich Krankheitsstoff wie z. B. Pest in der Luft und teilt sich durch die Luft den Lebewesen mit, als ein Untergebener sich die Sünde das Vorgesetzten zu eigen macht; viel leichter eignet er sich seine Sünde als seine Tugend an. Darin übertrifft vor allem ― was ich von ganzem Herzen bedaure ― die Schlechtigkeit die Tugendhaftigkeit, daß die Sünde so leicht Nachahmung oder Nachfolge findet und daß nichts leichter ist als sündigen, mag uns auch niemand dazu verleiten. Selten und mit Schwierigkeit gelangt man in den Besitz der Tugend, mögen wir auch viel dazu angetrieben und aufgefordert werden. An diese Tatsache scheint mir auch der selige Aggäus zu denken in der herrlichen, so wahren Gleichnisrede: „Fraget die Priester, ob denn nach dem Gesetze geweihtes Fleisch, das einer in seinem Gewande trägt, sobald es mit Speisen, Getränken, Gefäßen in Berührung kommt, sofort den berührten Gegenstand heiligt! Wenn sie die Frage verneinen, fraget weiter: ob denn nicht etwas davon, wenn es mit etwas Unreinem in Berührung kommt, sofort unrein wird!“ Erwartet wurde die Antwort: Ja, nichts bleibt infolge der Berührung rein.</p><p>[Forts. v. ] Was will der Prophet damit sagen? Er bestätigt meine Ansicht, daß die menschliche Natur für das Gute so schwer empfänglich ist wie nasses Holz für Feuer, daß dagegen die meisten zum Bösen gerne bereit sind und trockenem Stroh gleichen, das beim Winde gerne von Funken Feuer fängt. Schneller nimmt einer von ein wenig Schlechtigkeit viel an als nur ein wenig von tief wurzelnder Tüchtigkeit. Ebenso teilt ein wenig Wermut dem Honig gar schnell seine Bitterkeit mit, dagegen nicht einmal die doppelte Menge Honig dem Wermut etwas von seiner Süßigkeit. Und schon ein kleiner Stein kann, wenn er sich losgerissen hat, einen ganzen Strom zu Tale eilen lassen; kaum aber ist der mächtigste Wall imstande, ihn aufzuhalten oder zurückzudämmen.</p><p>[Forts. v. ] Zunächst also müssen wir ― das ist meine Lehre ― uns hüten, als schlechte Maler der herrlichen Tugend zu erscheinen oder vielmehr, wenn wir vielleicht keine schlechten Maler sein sollten, der Menge ein schlechtes Vorbild zu geben und, wie es im Sprichworte heißt, andere heilen zu wollen, während wir selbst voll von Geschwüren sind.</p><p>Zweitens ist zu bedenken: wenn auch einer sich von jeder Sünde möglichst rein hält, so ist dies ― meines Erachtens ― noch nicht genügend für den, der andere zur Tugend erziehen will. Denn wer mit der Erziehung betraut ist, darf nicht nur nichts Böses tun, was ja auch den meisten der Untergebenen als sehr schändlich erscheint, sondern er muß sich auch im Guten auszeichnen entsprechend dem Befehle: „Wendet euch ab vom Bösen und tuet das Gute!“ Nicht soll er nur die schlimmen Bilder aus der Seele auswischen; es ist auch Pflicht, bessere einzuzeichnen, so daß die sittliche Würde die Amtswürde übertrifft. Im Gutestun und Aufwärtsstreben darf er nicht Maß halten. Lieber achte er auf das, was noch zu eigenem Schaden fehlt, als daß er das Erreichte als Gewinn preise! Was er gewonnen, benütze er immer als Mittel, noch weiter zu kommen. Sind wir besser wie die Masse, dann seien wir nicht stolz, erniedrigen wir uns vielmehr, wenn wir noch hinter den Amtspflichten zurückbleiben! Maßstab für die Leistungen muß das Gesetz sein, nicht der Mitmensch, sei er lasterhaft oder in der Tugend etwas vorgeschritten. Nicht darf er mit kleinem Gewichte die Tugend abwägen, welche er dem Höchsten schuldet, „durch welchen und für welchen alles ist“.</p><p>Er soll nicht glauben, daß das gleiche sich für alle schickt! Es haben ja auch nicht alle das gleiche Alter und denselben Gesichtsausdruck, und es wechselt die Natur der Tiere, die Beschaffenheit des Bodens, die Schönheit und Größe der Gestirne. Bei einem Laien soll er es für Sünde halten, wenn er etwas tut, was vom strengen Gesetze geahndet wird, bei einem Beamten und Vorsteher aber sehe er eine Sünde darin, wenn er nicht möglichst gut ist und nicht ständig im Guten fortschreitet; dieser soll ja darnach verlangen, das Volk durch die Vorzüglichkeit seiner Tugend auf den rechten Weg zu leiten und es durch Überzeugung zu gewinnen, statt durch Gewalt zu beherrschen. Wenn etwas nicht freiwillig geschieht, ist es das Resultat der Gewalt, verdient nicht Lob und ist nicht dauerhaft. Was vergewaltigt ist, pflegt wie ein von der Hand gewaltsam umgebogener Baum, sobald es die Freiheit hat, wieder zurückzuschnellen. Was dagegen aus freien Stücken geschieht, ist das Rechtmäßigste und Sicherste zugleich; durch das Band der Liebe bleibt es erhalten. Eben daher befiehlt unser Gesetz und unser Gesetzgeber, man solle die Herde willig, aber nicht gezwungen weiden.</p><p>[Forts. v. ] Mag einer auch frei von Sünden sein und auf dem Gipfel der Tugend stehen, ich kenne nicht das Wissen und nicht die Kraft, welche ohne Furcht dieses Amt übernehmen lassen. Denn mir scheint es wahrlich die Kunst der Künste und die Wissenschaft der Wissenschaften zu sein, den Menschen, das vielseitigste und unbeständigste Wesen zu leiten. Um dies zu verstehen, muß man die Seelsorge mit der Medizin vergleichen, muß man die Schwierigkeit der letzteren kennengelernt und daneben die noch größere Schwierigkeit der ersteren erprobt haben und den größeren Wert der letzteren in bezug auf Objekt, Mittel und Zweck kennen. Die Medizin bemüht sich um den Körper, den vergänglichen, irdischen Stoff, der auf jeden Fall dem Untergang geweiht ist und sein Schicksal erleidet, auch wenn sie einstweilen mit künstlichen Mitteln die innere Zerrüttung bemeistert; Krankheit oder Zeit lösen ihn auf, er muß der Natur das Opfer bringen, kann seine Grenzen nicht überschreiten.</p><p>Die Seelsorge aber kümmert sich um die von Gott stammende göttliche Seele, welche am himmlischen Adel teilhat und ihn erstrebt, mag sie auch (im Körper) einen schlimmen Genossen haben. Für die Verbindung mit dem Körper mag es verschiedene Gründe geben, welche nur Gott, der (Leib und Seele verbunden) hat, kennt, und derjenige, welcher etwa von Gott in seine Geheimnisse eingeweiht worden ist. Nach der Ansicht, welche ich und meine Freunde vertreten, sind es zwei Gründe. Erstens soll die Seele durch Kampf und Streit wie durch läuterndes Feuer gewaltsam die himmlische Herrlichkeit erobern und das, was sie hofft, nicht nur als Gottes Gnade, sondern auch als Lohn für Verdienste erhalten. Es war ein Zeichen der höchsten Barmherzigkeit, das Gute auch als unser Werk zu erklären, soferne es nicht bloß mechanisch uns gegeben wird, sondern auch durch unseren Willen und unsere freie, selbständige Entscheidung ersteht. Zweitens soll die Seele den schlimmen Genossen etwas von seiner Schwerfälligkeit erlösen, an sich ziehen und himmelwärts richten; sie soll für den Körper das werden, was Gott für die Seele ist, indem sie den Stoff sich unterwirft und erzieht, den Genossen für Gott gewinnt.</p><p>[Forts. v. ] Der Arzt muß auf örtliche und zeitliche Verhältnisse, auf Alter, Witterung u. dgl. Rücksicht nehmen, muß Arzneien verordnen und die Lebensweise vorschreiben. Er hat auf schädliche Einflüsse zu achten, damit nicht das Gelüsten des Kranken seiner Kunst entgegenarbeitet. Bisweilen wird er bei einigen wohl auch brennen und schneiden und noch schmerzlichere Heilmittel anwenden. Mag dies auch sehr mühevoll und schwierig erscheinen, aber noch schwieriger als all dies ist es, Sitten, Leidenschaften, Lebensgewohnheiten, Neigungen u. dgl. genau zu studieren und zu heilen, alles Tierische und Wilde aus unserer Gemeinde zu entfernen, dafür alles Zarte und Gottgefällige einzuführen und zu festigen, gerecht zwischen Seele und Leib zu scheiden, nicht zu gestatten, daß das Gute vom Bösen beherrscht werde, was das größte Unrecht wäre, vielmehr das der Natur nach Minderwertige dem Höheren und Vorzüglicheren zu unterwerfen, wie es dem göttlichen Gesetze entspricht, das trefflich über die gesamte Schöpfung, die sichtbare und übersinnliche, regiert.</p><p>Jedes von den erwähnten ärztlichen Mitteln bleibt ― wie ich sehe ― so, wie es ist; nichts wirkt aus sich listig entgegen und will weiser sein als die ärztliche Kunst. Die Medizin beherrscht den Stoff, es müßte denn sein, daß auf kurze Zeit das Gelüsten des Kranken störend dazwischentritt, was aber unschwer zu beachten und abzuwenden ist. Aber in der Heilung zur Tugend legt sich Einbildung, Selbstliebe und das Unvermögen, rasch sich zu überwinden, als größtes Hindernis, gleichsam als feindliche Macht gegen die Helfer uns in den Weg. Den Eifer, welchen wir aufwenden sollten, unsere Krankheit den Ärzten zu enthüllen, wenden wir auf, der Heilung zu entfliehen. Tapfer sind wir im Kampfe gegen uns, klug im Wirken gegen unsere Gesundheit.</p><p>[Forts. v. ] Bald nämlich verheimlichen wir in sklavischer Gesinnung unsere Sünde und verbergen sie wie ein eiterndes, bösartiges Geschwür in der Tiefe unserer Seele, gleich als könnten wir, wenn wir den Menschen verborgen bleiben, auch dem scharfblickenden Auge Gottes und seiner Gerechtigkeit entrinnen. Bald haben wir Entschuldigungen für unsere Sünden und erfinden Ausreden für unsere Leidenschaften. Bald verschließen wir unsere Ohren „gleich tauber Otter, die ihre Ohren verstopft“, wollen nicht die Stimme der Beschwörer hören und nicht mit weisen Heilmitteln die kranke Seele kurieren lassen. Bald setzen wir uns, wenn wir zu den Frecheren und Kühneren gehören, „mit bloßem Kopfe“, wie man zu sagen pflegt, über Sünde und Seelenarzt offen hinweg, um uns in völlige Lasterhaftigkeit hineinzustürzen. Welcher Wahnsinn! Oder welche Bezeichnung paßt besser für solche Leidenschaft? Diejenigen, welche wir als unsere Wohltäter lieben sollten, stoßen wir zurück, als wären sie unsere Feinde, „wir hassen die, welche uns am Tore zurechtweisen, und verabscheuen heilige Rede“. Wenn wir uns selbst möglichst schaden, meinen wir die, welche uns wohlwollen, noch mehr zu treffen; wir gleichen denen, welche, um den Nächsten aufzufressen, sich am eigenen Fleische vergreifen.</p><p>Dies sind die Gründe, warum ich die Seelsorge für weit wichtiger und darum wertvoller erachte als die Medizin. Diese sieht wenig in die Tiefe, sie beschäftigt sich mehr mit dem, was in die Augen fällt. Wir dagegen wenden uns mit aller Sorgfalt heilend an das verborgene menschliche Herz; wir richten uns gegen den, der in uns kämpft und streitet, der sich unser ― es ist das Ärgste ― als Waffen gegen uns bedient, um uns dem Tode der Sünde zu überantworten. Demgegenüber bedarf es eines starken und vollkommenen Glaubens, reichlichen göttlichen Beistandes und, wie ich glaube, nicht geringer Anstrengung unserseits in Wort und Tat, wenn die Seele, unser kostbarster Besitz, gut geheilt und gereinigt und recht wertvoll werden soll.</p><p>[Forts. v. ] Noch müssen wir das Ziel der beiden Heilkünste untersuchen. Die eine bezweckt, Gesundheit und Wohlbefinden des Körpers zu erhalten oder wiederherzustellen. Ob aber ihr Besitz von Vorteil ist, bleibt noch dahingestellt. Denn oftmals bringt das Gegenteil größeren Gewinn. Armut und Reichtum, Ehre und Unehre, Erniedrigung und Auszeichnung, kurz alles Indifferente und Neutrale, erhält erst durch den freiwilligen Gebrauch den Charakter von Gut und Bös. Die andere Heilkunst aber hat die Aufgabe, die Seele zu beflügeln, der Welt zu entreißen und Gott zu geben, das Ebenbild (Gottes) zu erhalten, in der Gefahr zu führen oder im Falle der Vernichtung wiederherzustellen, durch den Geist in den Herzen für Christus Wohnung zu bereiten und ― was die Hauptsache ist ― ihn, der einer höheren Ordnung angehört, zu Gott zu machen und an der himmlischen Seligkeit teilnehmen zu lassen.</p><p>Dies bezweckt unser Zuchtmeister, das Gesetz; dies die Propheten, welche zwischen Christus und dem Gesetze lebten; dies Christus, der Vollender des geistigen Gesetzes und sein Ziel; dies die Selbstentäußerung Gottes, die Menschwerdung, die unerhörte Mischung von Gott und Mensch, in welchen einer aus zweien und beide durch einen sind. Zu genanntem Zwecke hat sich Gott mit dem Fleische unter Vermittlung der Seele vermischt, sind die Gegensätze durch das Mittelglied (die Seele), das mit dem einen und mit dem anderen verwandt ist, verbunden worden, hat sich alles um aller und um des einen Stammvaters wegen geeint: die Seele nämlich wegen der Seele, die den Gehorsam verweigert hatte, das Fleisch wegen des Fleisches, das am Ungehorsam teilgenommen hatte und verurteilt worden war, Christus, obwohl weit erhaben über der Sünde, wegen des sündhaften Adam.</p><p>Zu genanntem Zwecke trat das Neue an Stelle des Alten, rief das Leid den Leidenden (Jesus), wurde das ganze Leben des über uns Erhabenen ein Lösegeld für unser Leben, offenbarte sich in neuer, geheimnisvoller Weise die liebevolle Sorge für den durch Ungehorsam Gefallenen. Aus genanntem Grunde hören wir von der Geburt (Jesu) und der Jungfrau, der Krippe und Bethlehem; die Geburt erinnert an die Schöpfung, die Jungfrau an das Weib, Bethlehem an Eden, die Krippe an das Paradies, das Kleine an das Große, das Sinnfällige an das Geheimnisvolle. Aus genanntem Grunde hören wir von den Engeln, welche dem Himmlischen und hierauf dem Irdischen Lob sangen, von den Hirten, welche wegen des Lammes und des Hirten die Herrlichkeit schauten, vom Sterne, der den Weg wies, von den Magiern, welche niederfielen und Geschenke brachten, um dem Götzendienst ein Ende zu bereiten. Zu genanntem Zwecke wurde Jesus getauft, empfing er Zeugnis vom Himmel, fastete er, ließ er sich versuchen und besiegte er den Sieger, wurden ferner Teufel ausgetrieben, Krankheiten geheilt und das erhabene Predigtamt einfachen Männern anvertraut, die es recht verwalteten.</p><p>[Forts. v. ] Aus erwähntem Grunde „toben die Heiden und sinnen die Völker Eitles“. Darum auch wirkte Holz gegen Holz, waren Hände gegen Hände, nämlich die edlen, ausgespannten Hände (Jesu) gegen die lüsternen ausgestreckten Hände (des Adam), die mit Nägeln durchbohrten Hände (Jesu) gegen die ausschweifenden Hände (des Adam), die Hände, welche die Grenzen umfassen, gegen die Hände, welche Adam (aus dem Paradiese) vertrieben. Darum ferner einerseits Fall, anderseits Erhöhung, einerseits Genußsucht, anderseits Tränkung mit Galle, einerseits schlimme Herrschsucht, anderseits Dornenkrone, hier Tod und dort Tod, hier Finsternis, dort Licht, hier Grab, dort Menschwerdung, hier Auflehnung, dort Auferstehung. In all dem hat Gott uns erzogen und uns von unserer Schwachheit geheilt, indem er den alten Adam wieder an den Ort brachte, von dem er ihn verstoßen hatte, und zu dem Baume des Lebens führte, von welchem uns der unzeitige und törichte Genuß vom Baume der Erkenntnis entfernt hatte.</p><p>Wir alle, die wir über andere gesetzt sind, arbeiten und wirken für seelische Therapie. Uns gilt es schon als hoher Beruf, die eigenen Leidenschaften und Krankheiten zu erkennen und zu heilen; eigentlich ist es noch kein hoher Beruf, doch die Schlechtigkeit vieler, welche diesen Posten bekleiden, veranlaßt uns, so zu reden. Aber viel wichtiger ist es uns, wenn wir die Krankheiten anderer verständnisvoll heilen und beseitigen können, so daß beide Nutzen haben, sowohl die, welche der Heilung bedürfen, wie die, welche mit der Heilung betraut sind.</p><p>[Forts. v. ] Ferner müssen die, welche es mit der Heilung des Körpers zu tun haben, wie wir wissen, Mühen, schlaflose Nächte, Sorgen ertragen, im fremden Unglück, wie ein heidnischer Weise behauptet, für sich Leiden ernten und die Mittel für die Kranken teils selbst mühsam ausfindig machen, teils bei anderen erwerben und sammeln. Und nichts von dem, was sie anwenden oder verbieten, auch nicht das Geringste ist ihnen so bedeutungslos, daß es nicht Wert hätte für die Gesundheit oder zur Vermeidung einer Gefahr. Und wozu dies alles? Damit ein Mensch noch einige Tage länger auf Erden lebe und nicht einmal ein tadelloser, sondern ein ganz schlechter Mensch, für welchen wegen seiner Schlechtigkeit es vielleicht schon längst besser gewesen wäre, wenn er gestorben wäre, um von der schlimmsten Krankheit, der Sünde, befreit zu werden. Gesetzt aber, es handelt sich um einen guten Menschen, wie lange wird er noch leben? Ewig? Oder was für einen Gewinn wird er von dem Leben hienieden haben, dessen Auflösung zu suchen für einen wirklich gesunden und verständigen Menschen das Beste und Sicherste ist.</p><p>[Forts. v. ] Bei uns aber handelt es sich um Rettung der begnadigten, unsterblichen Seele, welche ewig bestraft oder belohnt wird je nach ihrer Sünde oder ihrem Verdienste. Wie heißt es aber da für uns ringen und lernen, um zu heilen und geheilt zu werden, um zu bessern und den Staub dem Geiste zu unterwerfen! Denn nicht die gleichen geistigen und seelischen Anlagen haben Mann und Weib, Jung und Alt, Reich und Arm, schwermütige und fröhliche Menschen, Gesunde und Kranke, Untertanen und Herrscher, Mutige und Ängstliche, Sanftmütige und Zornige, Fallende und Helfer.</p><p>Und wie groß ist bei genauer Beobachtung der Unterschied zwischen Verheirateten und Unverheirateten und bei letzteren wiederum zwischen Eremiten und gemeinsam lebenden Coenobiten, zwischen denen, welche im betrachtenden Leben erprobt und fortgeschritten sind, und denen, welche den gewöhnlichen geraden Weg gehen, zwischen Städtern und Landleuten, zwischen Einfältigen und Verschmitzten, zwischen denen, welche im Beruf, und denen, welche im Ruhestand leben, zwischen den von Schicksalsschlägen Getroffenen und den Glücklichen, welche nichts Unangenehmes erfahren! Sie alle unterscheiden sich voneinander bisweilen mehr durch ihr Sinnen und Trachten als durch körperliche Eigentümlichkeiten oder ― wenn du willst ― als durch die Mischungen von Elementen, aus welchen wir bestehen. Nicht sehr leicht ist es, sie zu betreuen.</p><p>[Forts. v. ] Gleichwie nicht für alle Körper ein und dieselbe Medizin und Kost verordnet wird, sondern bald diese, bald jene, je nach dem Gesundheits- oder Krankheitszustand, so müssen die Seelen, um zu heilen, immer wieder anders belehrt und geleitet werden. Die Kranken beweisen es: die einen werden durch Worte geleitet, andere durch Beispiele bestimmt; die einen bedürfen der Sporen, andere des Zügels; die Trägen und Schwerfälligen müssen durch scharfe Worte geweckt werden; die aber ungewöhnlich hitzig und schwer zu bändigen sind gleich Füllen, die über das Ziel hinauseilen, werden durch besänftigende und beruhigende Worte gebessert.</p><p>[Forts. v. ] Lob und Tadel nützen, wenn sie zu rechter Zeit erteilt werden; sie schaden, wenn sie zur unrechten Zeit und ohne Grund erfolgen. Die einen richtet Ermunterung, die anderen Tadel zurecht und zwar der Tadel bald durch öffentliche, bald durch geheime Zurechtweisung. Die einen wollen nicht auf Warnungen achten, wenn sie unter vier Augen erteilt werden, bekehren sich aber, wenn die Öffentlichkeit kritisiert; andere schämen sich nicht bei öffentlicher Kritik, lassen sich wohl aber etwas sagen, wenn man sie im Geheimen rügt, und vergelten schonende Behandlung mit Gehorsam.</p><p>Bei den einen, welche durch den Glauben und das Bestreben, (in ihren Sünden) unbekannt zu sein, eingebildet werden, muß man genau auf alles, auch das Geringste achten. Bei anderen ist es besser, manches zu übersehen, also ― wie das Sprichwort sagt ― zu sehen und nicht zu sehen, zu hören und nicht zu hören, um sie nicht unter der drückenden Last von Vorwürfen zur Verzweiflung zu treiben, um nicht die Achtung, die Voraussetzung für erfolgreiche Belehrung zu verlieren, und schließlich Frechheit zu ernten. Bei anderen verlangt die Naturanlage zu zürnen, ohne zu zürnen, zu übersehen, ohne zu übersehen, die Hoffnung aufzugeben, ohne sie aufzugeben. Andere sind durch Milde und Sanftmut zu heilen und dadurch, daß man ihnen gute Hoffnung zu machen bereit ist. Bald ist es vorteilhafter, den Sieger zu spielen, bald den Unterlegenen. Bei den einen muß man Reichtum und Macht, bei den anderen Armut und Mißgeschick bald loben, bald verwünschen.</p><p>[Forts. v. ] Während die Tugend stets für alle das Schönste und Nützlichste ist, die Sünde dagegen das Schlimmste und Schädlichste, verhält es sich mit der Seelsorge anders; nicht erweist sich hier ein und dasselbe stets und immer wieder als das Gesündeste bzw. als das Gefährlichste, wie Strenge, Sanftmut oder die übrigen erwähnten Mittel. Vielmehr ist den einen gut und heilsam, was bei anderen gegenteilige Wirkung hat. Es kommt wohl auf Zeit und Umstände und auf den Zustand des Kranken an. Eine Kasuistik zu lehren und in exakter Übersicht die Heilkunde zusammenzufassen, ist unmöglich, mag einer noch so fleißig sein und über reichstes Wissen verfügen. Erst Erfahrung und Praxis geben der Heilkunde und dem Arzte Aufklärung.</p><p>Im allgemeinen wissen wir jedoch: gleichwie es für die, welche auf hochgespanntem Seile tanzen, nicht ungefährlich ist, sich nach der einen oder anderen Seite hin zu beugen und wie schon eine unscheinbare Neigung nicht geringe Folgen hat, während das Gleichgewicht Sicherheit gibt, so besteht, wenn Seelsorger aus Schlechtigkeit oder aus Unwissenheit sich nach der einen oder anderen Seite hin beugen, sowohl für sie wie für ihre Herde eine nicht geringe Gefahr, in Sünden zu fallen. Der goldene Weg ist zweifellos einzuschlagen und dafür ist zu achten, daß man nicht, wie es im Buche der Sprüche heißt, nach rechts und links abweiche.</p><p>So steht es mit den seelischen Krankheiten und so schwer ist die Aufgabe eines guten Hirten, der die Seelen seiner Herde recht kennenlernen und nach der echten, rechten Hirtenlehre des wahren Hirten führen will.</p><p>[Forts. v. ] Wenn ― um von dem Wichtigsten zuletzt zu sprechen ― die Verkündigung der göttlichen, erhabenen Lehre, an welche sich jetzt alles heranmacht, von irgendeinem Fremden kühn versucht wird in der Meinung, sie passe für jeden Geist, so wundere ich mich über einen solchen wegen seiner Einbildung, ― um nicht zu sagen ― wegen seiner Einfalt. Ich aber achte es nicht als Sache der Ungebildeten und Geistesschwachen, jedem zur rechten Zeit von der Lehre kosten zu lassen und die wahren Lehren mit verständiger Sorgfalt zu verwalten, nämlich die Lehren über die Welten oder die Welt, über die Materie, die Seele, den Geist, die vernünftigen guten und bösen Wesen, über die Vorsehung, welche alles zusammenhält und leitet, mag es nun vernunftgemäß erscheinen oder der irdischen und menschlichen Vernunft widersprechen.</p><p>Dazu kommen die Glaubenssätze über unsere Erschaffung und Wiederherstellung, über Vorbilder und Wirklichkeit, über die (beiden) Testamente, über Christi erste und zweite Erscheinung, über seine Menschwerdung, sein Leiden, seinen Tod und seine Auferstehung, über das Weltenende, das Gericht und die schreckliche und anderseits herrliche Vergeltung und das Hauptdogma von der erhabenen, heiligen Dreifaltigkeit. Für diejenigen, welche mit der Predigt betraut sind, besteht die größte Gefahr, daß sie aus Angst vor Polytheismus nur von einer einzigen Person sprechen, dadurch uns zum Glauben verleiten, der Vater und der Sohn und der Heilige Geist seien ein und derselbe, und so die Namen entwerten, oder es besteht die Gefahr, daß sie von drei getrennten, verschiedenen Personen, welche sich widersprechen und auflehnen, reden, also gewissermaßen von sich feindlichen Göttern und so von anderem Gesichtspunkt aus ebenfalls dem Irrtum verfallen. Für sie besteht Gefahr, daß sie einem gekrümmten Baume gleich werden, der sich stark nach einer Seite hin neigt.</p><p>[Forts. v. ] Zur Zeit gibt es drei theologische Irrtümer: Gottesleugnung, Judaismus und Polytheismus; Sabellius aus Libyen ist der Hauptvertreter des ersten, Arius von Alexandrien der des zweiten, einige Hyperorthodoxe unter uns vertreten den dritten Irrtum. Was ist meine Lehre? Wir müssen das Schädliche der drei Richtungen meiden, in den Grenzen des Glaubens bleiben und dürfen uns nicht zur Gottesleugnung des Sabellius auf Grund seiner neuen These von der Auflösung und Zusammenziehung verführen lassen und meinen, daß alles eins sei, während doch eher das einzelne nichts ist; was nämlich ineinander strömt und überläuft, hat kein Sein. Nicht sollen wir uns Gott als etwas Zusammengezogenes, Widersinniges, als eines von den sagen- und schattenhaften Wesen einbilden und darstellen. Wir dürfen aber auch nicht, wie es die mit Recht als toll bezeichnete Lehre des Arius will, die Naturen trennen, und so dem armseligen Judaismus verfallen, indem wir der göttlichen Natur Neid zutrauend nur dem Ungezeugten die göttliche Natur zuschreiben aus Furcht, Gott möchte uns verlorengehen, wenn er der Vater eines wahren, an Ehren gleichen Sohnes ist. Endlich dürfen wir nicht drei Prinzipien gegeneinander oder nebeneinander aufstellen und so der griechischen Vielgötterei verfallen, von der wir uns losgesagt hatten.</p><p>Nicht darf man den Vater in einer Weise bevorzugen, daß man ihn nicht Vater sein läßt. Wessen Vater wäre er denn noch, wenn der Sohn nicht die Natur des Vaters hätte und gleich der Schöpfung ihm fremd wäre, da ja das Fremde nicht Sohn ist, oder wenn er mit dem Vater vermengt und vermischt würde und, was dasselbe ist, den Vater mit sich vermischen würde? Auch darf man anderseits nicht Christus in einer Weise bevorzugen, daß man ihm nicht das Sohn-Sein und dem Vater nicht die Würde des Prinzips, welche ihm als Vater und Erzeuger zukommt, läßt. Denn von wem soll der Sohn abstammen, wenn er sich nicht vom Vater als Prinzip ableitet? Und der Vater wäre nur noch das Prinzip von kleinen und würdelosen Wesen, vielmehr, er wäre Vater in kleiner, würdeloser Art, wenn er nicht das Prinzip der Gottheit und Güte wäre, welche im Sohn und Geiste geschaut wird, in dem einen, soferne er Sohn und Logos ist, in dem anderen, soferne er als Geist ausgeht und unlösbar ist. Wir müssen nämlich* einen* Gott festhalten und anderseits drei Personen bekennen, von denen jede ihre Eigentümlichkeit hat.</p><p>Um diese Lehren zu verstehen und eingehend und würdig darzustellen, bedarf es eines Vortrages, der für jetzt, ich glaube sogar für das Leben, zu lang wäre. Noch mehr bedarf es dazu jetzt und jeder Zeit des Geistes, durch welchen allein Gott erkannt, bekannt und verstanden wird. Denn nur der Reine kann den Reinen und Gleichwertigen erfassen. Weshalb haben wir aber nun davon kurz gesprochen? Wir wollten zeigen, daß es für einen Theologen schwer ist, gerade vor einer Menge verschiedenen Alters und verschiedener Begabung, welche gleich einem vielsaitigen Instrumente verschiedener Griffe bedarf, das Wort zu finden, das jeden zu erbauen und mit dem Lichte der Erkenntnis zu erleuchten vermag. Da sowohl der Verstand wie das Wort und das Zuhören Schwierigkeiten bereitet, ist es zunächst unvermeidlich, wenigstens in* einer* Hinsicht, wenn nicht überall, Fehler zu machen: entweder nämlich fehlt es dem Verstande an Erleuchtung oder dem Worte an Kraft oder es versagt die Zuhörerschaft, weil es ihr an reiner Gesinnung mangelt; ebenso ist es mit Rücksicht auf einen oder auf alle Gründe unvermeidlich, daß die Wahrheit Schaden leidet. Ferner ist die Ängstlichkeit der Zuhörer, welche sonst Lehrern die Aufgabe sehr erleichtert und angenehm macht, in unserem Falle nachteilig und gefährlich.</p><p>[Forts. v. ] Da sie nämlich für Gott, das höchste Wesen, ihr Seelenheil und die allen vorzüglichste Hoffnung eifernd, sich, je feuriger ihr Glaube ist, um so heftiger der Belehrung widersetzen in dem Wahne, Gehorsam sei Verrat an der Wahrheit und nicht Tugendhaftigkeit, so verzichten sie lieber auf alles als auf ihre von Hause mitgebrachten Meinungen und die gewohnten Ansichten, in denen sie erzogen worden sind. Ich spreche hier nicht von ganz schlimmen Sündern, sondern von recht mittelmäßigen Menschen, die zwar vom Wege der Wahrheit abirren, aber wegen ihrer krankhaften Scheu und ihres ― allerdings unverständigen ― Eifers wohl zu denen gehören, welche nicht so streng gerichtet und nicht so hart bestraft werden wie diejenigen, welche aus Schlechtigkeit und Sündhaftigkeit vom Willen des Herrn abfallen. Vielleicht könnten diese gelegentlich umgestimmt und von ihrer widersetzlichen Scheu bekehrt werden, wenn sie von einem Worte getroffen würden, das wie das Eisen den Feuerstein, so ihre schwere, der Erleuchtung würdige Seele zur rechten Zeit von innen oder außen her schlagen würde. Gar schnell könnte in der Seele infolge eines kleinen Funkens das Feuer der Wahrheit aufleuchten.</p><p>Was soll man von denen sagen, welche aus Ruhm- und Herrschsucht „sündhafte Reden gegen den Höchsten führen“, von der Prahlerei eines Jannes oder Jambres, welche nicht gegen Moses, sondern gegen die Wahrheit sich empörten und wider die gesunde Lehre sich erhoben? Oder was soll man von der dritten Klasse sagen, von denen, welche aus Dummheit und daraus folgender Frechheit gleich Schweinen auf jede Lehre stürzen und die herrlichen Perlen mit Füßen zertreten?</p><p>[Forts. v. ] Oder was soll man von denen sagen, welche gar keine Anschauung, weder einen schlechten noch einen guten Glauben über Gott von Hause mitbringen und sich allen möglichen Reden und Lehren unterwerfen, um daraus das Beste und Sicherste auszuwählen im Vertrauen auf ihren eigenen mangelhaften kritischen Geist, und welche bald von diesem bald von jenem Überredungskünstler sich bald dahin bald dorthin führen und leiten lassen, von allen möglichen Meinungen überschwemmt und erdrückt, immer wieder ihre Lehrer wechseln und vieles, was sie gelernt haben, leichtsinnig wie Staub in den Wind schleudern, um schließlich ― welche Torheit! ― des Hörens und Denkens müde, vor jedem Unterricht den gleichen Ekel zu empfinden und den bösen Vorsatz zu fassen, unseren Glauben als unbeständig und höchst schädlich zu verlachen und zu verspotten, von den Rednern in dummer Weise auf die Lehre schließend? Sie gleichen dem Augenkranken, welcher die Sonne beschuldigt, sie sei finster und leuchte nicht, oder dem Ohrenleidenden, welcher den Tönen den Vorwurf macht, sie seien unmelodisch und unhörbar.</p><p>Es ist daher leichter, einer Seele, die einer noch unbeschriebenen Wachstafel gleicht, eine Wahrheit zum ersten Male einzuprägen, als Buchstaben, ich meine schlimme Anweisungen und Sätze, mit frommer Lehre zu überschreiben, da die zweite Schrift mit der ersten unkenntlich verwischt wird. Allerdings ist es besser, einen ebenen, gebahnten Weg zu gehen als einen unbetretenen und rauhen, und besser ist es, einen Acker zu pflügen, der schon oft gepflügt und gelockert worden ist. Doch ist es vorteilhafter, in eine Seele zu schreiben, in welche noch keine bösen Worte Eindrucke gemacht haben und in deren Tiefen noch nicht die Lehren der Sünde gesät worden sind. Denn sonst hätte der gottesgläubige Seelenbildner die doppelte Aufgabe, die früheren Eindrücke auszumerzen und an deren Stelle kostbarere zu setzen, welche es verdienen, zu bleiben. So zahlreich die schlimmen Eindrücke und Einzeichnungen des Bösen sind ― man darf nur an die verschiedenen Sünden und an die Irrlehre denken ―; so schwer ist der Beruf für den Seelenhirten und Seelenführer. Das meiste habe ich noch übergangen, um nicht über Gebühr zu reden.</p><p>[Forts. v. ] Wenn einer ein vielartiges Ungeheuer von vielerlei Formen, das aus vielen großen und kleinen, zahmen und wilden Tieren zusammengesetzt wäre, leiten und bändigen wollte, so obläge ihm wahrlich keine kleine Arbeit und kein kleiner Kampf, um über ein solch seltsames, unnatürliches Wesen Herr zu werden, da nicht alle Tiere die gleiche Stimme, die gleiche Nahrung, die gleiche Berührung, den gleichen Pfiff, die gleiche Behandlung lieben, sondern jedes je nach seiner Natur und Anlage wieder andere Freuden und andere Launen hat. Was hätte ein solcher Tierbändiger zu tun? Vielseitig und umfassend müßte seine Geschicklichkeit sein; jedem Tiere müßte er entsprechende Behandlung angedeihen lassen, damit es gut erzogen werde und lange am Leben bleibe. In gleicher Weise ist es absolut notwendig, daß der Vorsteher dieses einheitlichen, aus vielen und verschiedenen Bräuchen und Lehren zusammengesetzten Kirchenkörpers, der einem einzigen, aber zusammengesetzten und vielartigen Wesen gleicht, einerseits etwas Einheitliches sei, wenn es gilt, auf die Masse einzuwirken, anderseits aber recht geschmeidig und vielseitig sich zeige, wenn es sich um Einzelseelsorge handelt und um eine Belehrung, von welcher jeder Vorteil und Nutzen haben soll.</p><p>Die einen, welche noch unmündig sind und sozusagen eben erst geboren wurden, bedürfen zur Nahrung der Milch, der einfacheren, elementareren Lehren, da sie die männliche Kost des Wortes nicht ertragen können. Würden sie die letztere wider ihre Kräfte in sich aufnehmen, dann würden sie damit überladen und beschwert werden und müßten es an ihren bisherigen Kräften büßen, da ihr Geist so wenig wie der Körper des Kindes die Fähigkeit besitzt, die aufgenommene Nahrung sich anzueignen und zu verdauen. Andere dagegen, welche nach der unter Vollkommenen gelehrten Weisheit und nach höherer, kräftigerer Nahrung Bedürfnis haben und welche ihre Sinne für die Unterscheidung von Wahrheit und Lüge geübt haben, würden unwillig werden, wenn sie mit Milch getränkt oder mit Gemüse, der Krankenkost, ernährt würden. Und es wäre begreiflich, da sie nicht mit der Kraft Christi gestärkt würden und nicht zu jener rühmlichen Größe heranwachsen könnten, welche vom Worte gewirkt wird, indem es den, welcher gut ernährt wird, zum Manne vollendet und zum Vollmaß des geistlichen Alters führt.</p><p>Und wer ist zum Unterricht geeignet? Denn wir sind nicht wie die meisten imstande, das Wort der Wahrheit zu fälschen und den Wein mit Wasser zu mischen, d. i. die das Herz des Menschen erfreuende Lehre mit jener, die es überall gibt, die wohlfeil ist, auf der Erde hinfließt, verrinnt und nutzlos verfließt. Nicht vermögen wir zu denen, die zu uns kommen, bald so und bald anders zu reden, um ihnen zu gefallen und durch Fälschung für uns Profit zu ziehen, als wären wir Bauchredner und eitle Schwätzer, welche mit irdisch klingenden und irdisch führenden Worten eigenen Lüsten frönen, um bei der Masse große Anerkennung zu finden, obwohl sie doch dieselbe schwer schädigen oder vernichten und obwohl sie das unschuldige Blut reiner Seelen, das von ihren Händen gefordert werden wird, vergießen.</p><p>[Forts. v. ] Wir sind überzeugt, daß es besser ist, die Zügel geschickteren Männern zu überlassen, als ungeschickt andere am Zügel zu führen, besser, willig Gehör zu schenken, als unerfahrener Zunge Freiheit zu lassen. Dies haben wir überlegt bei uns selbst, die wir uns wohl keine schlimmen, vielmehr wohlwollende Ratgeber sind, und haben es für besser befunden, in unserer Unwissenheit das Reden und Handeln zu lernen als es trotz unserer Unkenntnis zu lehren. Man muß (noch) froh sein, wenn einer erst im hohen Alter vom Worte eines bejahrten Mannes belehrt wird; es vermag einer im Glauben noch unerfahrenen Seele zu nützen. Andere belehren wollen, ehe man selbst genügend unterrichtet ist, und, wie das Sprichwort sagt, das Töpferhandwerk mit dem Fasse beginnen, d. i. erst in der Seelsorge den Glauben auszuprobieren, scheint mir überaus töricht und vermessen zu sein, töricht, sofern man nicht einmal seine eigene Dummheit einsieht, vermessen, sofern man zwar die Einsicht hat, aber gleichwohl sich an die Sache heranwagt.</p><p>Die Hebräer hatten, wie ihre Gelehrten berichten, früher den trefflichen, löblichen Brauch, nicht jedem Alter jede Schrift in die Hand zu geben. Sie hielten es nicht für vorteilhaft, da nicht jeder die Fähigkeit besäße, die ganze Schrift sofort zu verstehen, und da vor allem die geheimnisvolleren Bücher den meisten durch die Form schaden. Die einen Schriften gestatteten sie von Anfang an allen zum gemeinsamen Gebrauche und zwar jene, bei welchen die Form nicht anstößig war. Andere vertrauten sie nur jenen an, welche schon über 25 Jahre alt waren, und zwar solche Schriften, welche die geheimnisvolle Schönheit in ärmliches Gewand kleiden, damit sie ein Lohn werde für Arbeitsfreudigkeit und rühmlichen Wandel und damit sie nur den Reinen leuchte und glänze; denn nur solche Reife vermag die Ketten des Körperlichen zu sprengen und leicht vom Buchstaben weg zum Geiste emporzusteigen.</p><p>Bei uns sind aber zwischen Lehrer und Schüler keine Grenzen gezogen gleich den Grenzen, welche einst bestanden zwischen den Stämmen jenseits und diesseits des Jordan. Nicht sind bestimmten Personen bestimmte Aufgaben zugewiesen. Es fehlt die Norm, nach der man sich zu richten hat. Alles ist so verworren und untereinander, und wir sind in so schlimmer Lage, daß die meisten aus uns ― um nicht zu sagen alle ―, noch ehe ihnen die ersten Haare geschnitten sind, und sie das Kinderstammeln verloren haben, ehe sie die göttlichen Vorhöfe betreten, ehe sie von den heiligen Schriften nur die Namen wissen, ehe sie vom Neuen und Alten Testamente Sprache und Autoren kennen, um nicht zu sagen: ehe sie sich noch vom Schmutze und den durch die Sünde verursachten Seelenflecken rein gewaschen haben ―. Wenn wir zwei oder drei fromme Sprüche handhaben und zwar nicht, weil wir dieselben gelesen haben, sondern weil wir durch Hören davon wissen, oder wenn wir nur kurze Zeit uns mit David abgegeben haben oder wir den Philosophenmantel hübsch zu tragen verstehen oder bis zum Gürtel Philosophen sind und mit eingebildeter, scheinbarer Frömmigkeit uns schminken: da soll man schon von Vorstehern und von Weisheit reden! Da Samuel schon von der Wiege an heilig war, meinen wir auch sofort, Weise und Lehrer zu sein, erleuchtet in den göttlichen Dingen und in den vorzüglichsten Kenntnissen der Schriftgelehrten und Gesetzeslehrer. Wir zählen uns selbst zu den himmlischen Männern und verlangen von den Menschen, Rabbi genannt zu werden. Nirgends soll der Buchstabe gelten, alles soll geistig verstanden werden. Und obwohl solche Träumereien leeres Geschwätz sind, sind wir ungehalten, wenn wir nicht großes Lob finden. In solcher Weise reden diejenigen unter uns, welche noch zu den Besseren und Bescheideneren gehören. Wie aber machten es die, welche geistlicher und edler zu sein wähnen? Vielfach verdammten sie uns, wenn es ihnen so gefiel, verfolgten und entehrten uns und sagten sich von uns los unter dem Vorwand, sie wollten mit Gottlosen keine Gemeinschaft pflegen.</p><p>Wenn wir einen von diesen Leuten verstandesgemäß beeinflussen mit den gütigen Worten: „Sage mir, Verehrtester, gilt bei dir Tanzen und Flötenspielen etwas?“ würden sie mit ja antworten, auch die Frage: „Was gilt dir Weisheit und Weise-Sein? Ist es dir gleichbedeutend mit Kenntnis des Göttlichen und Menschlichen?“ werden sie bejahen. „Haltet ihr Tanzen und Flötenspielen für besser und wichtiger als Weisheit oder eher umgekehrt?“ „Über allem steht die Weisheit“, werden sie natürlich antworten, und soweit sind sie ganz vernünftig. „Während nun Tanz und Flötenspiel gelehrt und gelernt werden muß, Zeit, viel Schweißtropfen und Mühen, bisweilen auch Geld erfordert, der Empfehlungen, weiter Reisen und aller jener Arbeiten und Leiden bedarf, wodurch man sich Erfahrung sammelt, sollten wir die Weisheit, die in allem den ersten Rang einnimmt und alles Herrliche in sich birgt, so daß selbst Gott, der doch viele Namen führt, sich am liebsten mit diesem Namen bezeichnen läßt, für etwas so Leichtes und Abgedroschenes halten, daß es außer dem Willen, weise zu sein, nichts braucht? Das wäre vollendeter Unsinn.“ Wenn wir oder sonst ein Unterrichteter und Gebildeter so zu ihnen sprechen, um sie etwas von ihrem Irrtum zu bekehren, so heißt dies, auf Felsen säen und tauben Ohren predigen. Sie besitzen nicht einmal so viel Weisheit, daß sie ihre eigene Dummheit einsehen. Mit Recht scheint mir Salomon von ihnen zu sagen: „Schlimmes sah ich unter der Sonne, nämlich einen Menschen, der sich einbildete, weise zu sein.“ Und noch schlimmer ist es, wenn einer, der seine eigene Unwissenheit nicht einsieht, mit der Erziehung anderer betraut wird.</p><p>[Forts. v. ] Kein Unglück verdient so sehr beweint und beklagt zu werden wie dieser Fehler. Oft habe ich darüber gejammert; denn ich weiß wohl, daß das Sein unter der Einbildung am meisten Schaden leidet und daß auf dem Wege zur Tugend der Ehrgeiz ein großes Hindernis ist. Das Unheil zu heilen und ihm Einhalt zu tun, wäre eine Aufgabe für Petrus und Paulus, die großen Jünger Christi, welche nicht nur den Auftrag, in Wort und Tat zu regieren, erhielten, sondern auch die Gnade dazu und welche allen alles wurden, um alle zu gewinnen. Für uns aber bedeutet es schon etwas, wenn wir uns willig von den bestellten Seelsorgern lenken und führen lassen.</p><p>[Forts. v. ] Da wir Pauli und seinesgleichen gedacht haben, wollen wir, wenn es gestattet ist, alle übrigen Männer übergehen, welche als Gesetzgeber, Propheten, Feldherren oder in anderer derartiger Stellung das Volk führten wie Moses, Aaron, Josua, Elias, Elisäus, die Richter, Samuel, David, die Schar der Propheten, Johannes, später die zwölf Apostel, welche alle unter viel Schweiß und Mühe zu ihrer Zeit ihren Führerberuf ausgeübt hatten. Unter Übergehung all dieser Männer wollen wir Paulus allein als Zeugen auftreten lassen, um an ihm zu sehen, welche Bedeutung die Seelsorge hat, ob sie nämlich wenig Arbeit und geringes Verständnis erfordert. Um leicht zur Erkenntnis und Einsicht zu gelangen, wollen wir hören, was Paulus selbst über Paulus spricht.</p><p>Unerwähnt lasse ich seine Mühen, seine Nachtwachen, seine Schrecken, was er an Hunger und Durst, durch Kälte und Blöße gelitten, die Nachstellungen äußerer Feinde, die Angriffe innerer. Ich übergehe die Verfolgungen, die jüdischen Gerichte, die Gefängnisse, die Ketten, die Ankläger, die heidnischen Gerichte, die täglichen und stündlichen Todesgefahren, den Korb, die Steinigungen, die Geißelungen, die Reisen, die Gefahren zu Wasser und zu Lande, die Meerestiefe, die Schiffbrüche, die Gefahren auf den Flüssen, die Gefahren von Räubern, von Volksgenossen, von falschen Brüdern, sein Leben von der Hände Arbeit, die unentgeltliche Predigt des Evangeliums, wie er Engeln und Menschen zum Schauspiel wurde, wie er zu Gott und Menschen stand, indem er für diese kämpfte und jenem ein trefflicheres Volk zuführte und schenkte; von anderem sehe ich ab. Wer könnte seine tägliche Sorge, seine Teilnahme für jeden einzelnen wie für sämtliche Gemeinden, sein alle umfassendes Mitleiden und Mitlieben gebührend erzählen? Strauchelte einer, so litt Paulus; wurde einer geärgert, so brannte Paulus.</p><p>Zu erwähnen ist sein unermüdlicher Lehreifer, seine vielseitige Seelsorge, einerseits seine Menschenfreundlichkeit und anderseits seine Strenge, die sich beide so mischten und verbanden, daß er weder aus Güte weichlich noch aus Strenge rauh wurde. Er gibt Vorschriften Dienern und Herren, Herrschern und Untertanen, Männern und Frauen, Eltern und Kindern, für Ehe und Ehelosigkeit, für Enthaltsame und Weltkinder, für Weise und Ungebildete, für Juden und Heiden, für Kirche und Welt, Fleisch und Geist. Für die einen dankt er, die anderen tadelt er. Die einen bezeichnet er als seine Freude und seine Krone, anderen wirft er Unverstand vor. Mit denen, welche den geraden Weg einschlagen, geht er einträchtig zusammen; diejenigen, welche den bösen Weg gehen, hält er zurück. Bald schließt er aus der Gemeinde aus, bald läßt er Liebe walten. Bald trauert er, bald freut er sich. Bald tränkt er mit Milch, bald greift er zu den Geheimnissen. Zu den einen läßt er sich herab, die anderen zieht er zu sich empor. Bald droht er mit dem Stocke, bald zeigt er den Geist der Sanftmut. Bald erhebt er sich mit den Hohen, bald verdemütigt er sich mit den Demütigen. Das eine Mal ist er der letzte der Apostel, das andere Mal beruft er sich auf den in ihm sprechenden Christus. Jetzt verlangt er fort und opfert sich; jetzt hält er es für notwendiger, im Fleische zu verbleiben. Denn nicht sucht er das Seinige, sondern das Wohl seiner Kinder, welche er durch das Evangelium in Christus erzeugt hatte. Für jedes geistliche Amt gilt: mit Rücksicht auf das Wohl der Mitmenschen muß man überall auf seinen eigenen Nutzen verzichten.</p><p>Paulus rühmt sich in seinen Schwachheiten und Bedrängnissen. Er schmückt sich mit dem Sterben Jesu wie mit einem kostbaren Schatze. Über das Fleisch erhaben, frohlockt er im Geiste. Obwohl nicht ungelehrt, behauptet er, er sehe „in einem Spiegel und in Rätseln“. Er ist kühn im Geiste und bändigt seinen Körper, ihn wie einen Feind zu Boden werfend. Was will uns Paulus damit lehren, wozu will er uns erziehen? Wir sollen nicht auf irdische Dinge stolz sein, nicht durch Wissen aufgeblasen werden, nicht das Fleisch wider den Geist erregen. Paulus kämpft für alle, betet für alle, eifert für alle, erglüht für alle, sowohl für die, welche außerhalb des Gesetzes stehen, wie für die, welche dem Gesetze unterworfen sind. Er ist Herold den Heiden, Vormund den Juden. Zu noch kühnerer Tat verstieg er sich aus Liebe zu seinen Brüdern im Fleische ― ich wage es, so zu sprechen ―: in seiner Liebe bittet er, sie möchten an seiner Statt Christus zugeführt werden. Welche Hochherzigkeit! Welcher Feuergeist! Paulus ahmt Christus nach, der aus Liebe zu uns zum Fluche geworden war, unsere Schwachheiten auf sich genommen und unsere Krankheiten getragen hatte. Oder ― um mich etwas bescheidener auszudrücken ― Paulus ist nach Christus der erste, der, obwohl als Gottloser verspottet, verlangt, für die Menschen zu leiden, nur damit sie erlöst werden.</p><p>Wozu soll ich auf Einzelheiten eingehen? Paulus lebte nicht für sich, sondern für Christus und die Predigt; die Welt hatte er sich gekreuzigt, und er war der Welt und dem Sichtbaren gekreuzigt. Und darum achtet er alles für unbedeutend und zu gering, um darnach zu verlangen. Gleichwohl hat er das Evangelium von Jerusalem und seiner Umgebung in vollem Maße verkündet bis Illyrien, gleichwohl wurde er in den dritten Himmel entrückt, gleichwohl erhielt er Einblick ins Paradies, gleichwohl durfte er unaussprechliche Worte hören. So ist Paulus, so sind die Paulusjünger.</p><p>Wir aber müssen fürchten, neben diesen als „törichte Herrscher von Tanis“ zu erscheinen, als Bedrücker, die selbst noch den Halm eintreiben, als schmeichelnde Volksbetrüger, die ― wie ich beifügen möchte ― sich umschmeicheln lassen, als Pfadverderber, als spöttische Herrscher und knabenhafte Gebieter, als unreife Männer, die nicht einmal so viel Brot und Kleidung haben, um ein Amt führen zu können, als Propheten, welche Gottlosigkeit predigen, als abtrünnige Herrscher, welche es verdienen, um des quälenden Hungers willen mit den Ihrigen verflucht zu werden, oder als Priester, die weit davon entfernt sind, Jerusalem zu Herzen zu reden. Alle diese treffenden Vorwürfe sind* Isaias* entlehnt, der vom Seraphim durch eine Kohle gereinigt worden war.</p><p>Die Arbeit ist schwer und mühevoll in den Augen derer, die ein fühlendes und kummervolles Herz haben; hat einer Verstand, dann ist sie ihm Knochenfraß. Ist klein die Gefahr, oder braucht man das Fallen nicht zu fürchten? Fürwahr, große Angst flößt mir der selige* Oseas* ein durch das Wort, gegen uns, gegen die Priester und Führer, wende sich das Gericht, weil wir zum Fallstrick wurden auf der Warte und auf Tabor ausgespannt wurden als Netz, das von Jägern auf Menschenseelen befestigt worden war, ferner durch die Drohung, er werde die bösen Propheten abmähen und die Richter mit Feuer verzehren und werde ein wenig einhalten mit der Salbung von Königen und Fürsten, da sie sich selbst und nicht durch ihn Könige gewählt hätten.</p><p>[Forts. v. ] Der göttliche* Michäas* schreckt mich; denn er ist unwillig über Sion, weil es durch das Blut dieses oder jenes erbaut wurde, über Jerusalem, weil es durch Freveltat errichtet wurde, über seine Führer, welche gegen Geschenke richten, über die Priester, welche gegen Bezahlung Auskunft erteilen, über die Propheten, welche um Geld weissagen. Was sollte nun die Folge solcher Verhältnisse sein? Sion soll wie ein Feld gepflügt werden, Jerusalem der Hütte eines Obstwächters gleichen, der Tempelberg zum Eichenhaine werden. Michäas klagt, die Zahl derer, welche aufrichten, sei klein, so daß kaum mehr ein Halm oder eine Traube übrigbleibe; auch der Fürst bettle, und der Richter fälle Urteile nach Gunst. Seine Worte lauten fast wie die des großen David, der sagt: „Rette mich, o Herr; denn es fehlt an Heiligen!“ Die Folge sei, daß die Güter dahinschwinden wie von der Motte verzehrt.</p><p>* Joel* fordert uns auf zum Wehklagen und will, daß die Diener des Altares während der Hungersnot jammern. Weit ist er davon entfernt, zu gestatten, daß sie es sich Wohlsein lassen, während andere leiden. Er will, daß sie das Fasten heiligen, Heilung verkünden, Greise und Kinder, die beklagenswerten Altersstufen, versammeln und selbst im Heiligtum in Sack und Asche, in aller Demut auf dem Boden ausgestreckt, wegen der Unfruchtbarkeit des Landes und wegen des Fehlens von Speise- und Trankopfern im Hause des Herrn durch ihre Selbstverdemütigung Barmherzigkeit erwirken.</p><p>Was sagt* Habakuk?* Er bedient sich noch schärferer Worte und rechtet mit Gott selbst und erhebt gleichsam seine Stimme wider den gütigen Herrn wegen der Sünden der Richter, indem er spricht: „Wie lange, o Herr, soll ich schreien, ohne daß du auf mich hörest? Soll ich in dem Unrecht, das ich leide, zu dir rufen, ohne daß du mir hilfst? Warum hast du mir Mühen und Arbeiten gezeigt und mir Elend und Gottlosigkeit sehen lassen? Vor meinen Augen wird gerichtet; doch der Richter nimmt Geschenke an. Darum wird vernichtet das Gesetz und hat das Gericht keinen Zweck“. Dann folgt eine Drohung und die Worte: „Sehet, Verächter und schauet! Bewundert die Wunder! Werdet zunichte um des Werkes willen, das ich verrichte!“ Wozu soll ich die ganze Drohung zitieren? Es ist wohl besser, eine Stelle anzufügen, die bald darauf folgt. Nachdem der Prophet sich gegen Sünder und Frevler gewandt und über sie geklagt hat, wendet er sich schließlich an die Führer und Lehrer der Sünde; er bezeichnet ihre Sünde als schmutzige Verwirrung, Rausch und Verirrung des Geistes. Er behauptet, daß sie den Mitmenschen solchen Trank reichen, damit sie in die Finsternis ihrer Seele blicken, in die Höhle von Schlangen und wilden Tieren, in die Behausung schlimmer Gedanken. So sind sie, und so sind ihre Lehren, wenn sie mit uns sprechen.</p><p>[Forts. v. ] Wie dürfte ich* Malachias* übergehen? Bald macht er den Priestern bittere Vorwürfe und schilt sie, weil sie den Namen des Herrn verachten. Er begründet es mit der Erklärung, sie brächten an den Altar unreine Brote, Speisen, die nicht Erstlinge sind, und das, was sie kaum ihren Fürsten bringen könnten, ohne sich zu blamieren, opferten sie dem König der Welt: lahme, kranke, verdorbene, gänzlich unreine, verabscheuungswürdige Tiere. Bald erinnert er an den Bund Gottes mit den Leviten, der ein Bund des Lebens und des Friedens war, und verlangt, den Herrn zu fürchten und vor seinem Namen zu beben. „Das Gesetz der Wahrheit ― sagt er ― war in seinem Munde, und Unrecht wurde nicht auf seinen Lippen gefunden. Im Frieden wandelte er mit mir den rechten Weg, und viele bekehrte er von der Sünde; denn die Lippen des Priesters sollen die Wahrheit hüten und man soll das Gesetz in seinem Munde suchen.“ Der ehrende und zugleich furchtbare Grund hiefür ist: „Der Priester ist ein Engel des allmächtigen Herrn.“ Von den sodann folgenden Verwünschungen übergehe ich, was mir Beleidigungen eintragen könnte; denn ich muß die Wahrheit fürchten. Noch mäßig sind die lehrreichen Worte: „Verdient ihr es, daß ich auf euer Opfer schaue und etwas von eurer Hand wohlgefällig annehme?“ In größter Erbitterung weist er wegen ihrer Bosheit ihren Priesterdienst zurück.</p><p>Sooft ich an* Zacharias* denke, erschrecke ich vor der „Sichel“ und vor seinen Reden wider die Priester. Seinen Bericht über den angesehenen Hohenpriester Josua, dem man die schmutzigen, unwürdigen Kleider abgenommen und ein glänzendes Priestergewand angelegt haben soll, ferner das Wort und den Befehl des Engels an Josua übergehen wir mit ehrfurchtsvollem Schweigen, da sie so hohe und erhabene Geheimnisse enthalten, daß sie sich nicht auf die Masse der Priester beziehen lassen. Allerdings, die Tatsache, daß auch zur Rechten des Josua der Teufel stand, um ihm zu widerstehen, scheint mir von nicht geringer Bedeutung und sollte nicht wenig Furcht und Vorsicht wirken.</p><p>Wer sollte so kalt und hartherzig sein, daß er nicht zittert und bescheidener wird, wenn er von den ernsten Beschuldigungen und Vorwürfen hört, welche Zacharias gegen die übrigen Hirten erhebt? „Hirten ― sagt er ― erheben klagend ihre Stimme, weil ihre Pracht ein schreckliches Ende gefunden hat. Löwen brüllen, weil sie solches leiden.“ Es ist fast, als würde Zacharias bereits mit den eigenen Ohren das Klagen hören und zugleich mit den Leidenden wehklagen. Bald darauf klagt er noch schmerzlicher und ungestümer: „Weidet die Schlachtschafe, welche die Käufer erbarmungslos abschlachten, und deren Verkäufer sagen: dem Herrn sei Dank, wir haben Geschäft gemacht! Und die Hirten hatten kein Mitleid mit ihnen. Daher werde ich die Bewohner des Landes nicht weiterhin schonen, spricht der allmächtige Herr.“ Und wiederum sagt er: „Schwert, erhebe dich wider die Hirten! Schlaget die Hirten und führet heraus die Schafe! Meine Hand will ich ausstrecken wider die Hirten, und mein Zorn ist entbrannt wider die Hirten. Die Lämmer aber will ich heimsuchen.“ Auch den Volksführern gilt nun seine Drohung. Mit solchem Eifer verweilt er bei seiner Rede, und nicht leicht kann er sich von den Drohungen losmachen. Würde ich alle seine Worte der Reihe nach erwähnen, müßte ich fürchten, lästig zu werden.</p><p>Soweit Zacharias.</p><p>[Forts. v. ] Über die Ältesten, von denen* Daniel* erzählt, wollen wir hinwegeilen, ebenso auch über das treffliche Wort, das der Herr über sie geweissagt hatte: „Unrecht ist von Babylon ausgegangen, von Ältesten, von Richtern, die meinten, das Volk zu regieren.“ Wie werden wir bestehen vor* Ezechiel*, der erhabene Geheimnisse und Gesichte sah und deutete? Wie werden wir bestehen vor seinem Befehle, die Wächter sollen die Sünde und das der Sünde drohende Schwert nicht verschweigen; denn es würde weder ihnen noch den Sündern von Nutzen sein. Das Voraussehen und Vorausverkünden brächte beiden Teilen, sofern die einen sprechen, die anderen hören, Nutzen, auf jeden Fall denen, welche reden.</p><p>Wie wollen wir bestehen vor dem weiteren Ansturm, den er auf die Hirten macht? Bald nämlich wendet er sich gegen sie mit den Worten: „Wehe auf Wehe wird folgen und Gerücht auf Gerücht. Von dem Propheten wird man ein Gesicht fordern. Dem Priester wird das Gesetz fehlen und den Ältesten der Rat;“ bald wiederum in den Worten: „Menschensohn, sage zu Jerusalem: Du bist ein Land, auf das kein Tau und kein Regen fällt am Tage des Zornes. Die Führer in seiner Mitte sind wie brüllende Löwen, die auf Raub ausgehen und Seelen gewaltsam verschlingen.“ Und gleich darauf sagt er: „Seine Priester mißachteten mein Gesetz und entweihten mein Heiligtum. Zwischen unrein und heilig machten sie keinen Unterschied, sondern alles war ihnen eins. Von meinen Sabbaten wandten sie ihre Augen ab, und ich wurde entheiligt in ihrer Mitte.“ Er droht, er werde die Wand und ihre Tüncher vernichten, d. i. die Sünder und die, welche sie in Schutz nehmen. Mit den erwähnten Worten sind die schlimmen Fürsten und Priester gezeichnet, welche das Haus Israel nach ihren eigenen abtrünnigen, leidenschaftlichen Herzen verführen.</p><p>[Forts. v. ] Schweigen will ich über das, was er von denen berichtet, die sich selbst weiden, die Milch verzehren, sich in Wolle kleiden, Masttiere schlachten, aber die Schafe nicht weiden, das Schwache nicht unterstützen, das Verwundete nicht verbinden, das Verirrte nicht heimführen, das Verlorene nicht suchen, das Starke nicht bewachen, sondern durch Not verderben und mit Fleiß zugrunde richten, so daß die Schafe, weil die Hirten fehlen und niemand da ist, der sie sucht und heimführt, sich über alle Felder und Berge zerstreuen und allen Vögeln und wilden Tieren zur Beute werden. Wie heißt es weiter? „So wahr ich lebe ― spricht der Herr ― da dem so ist und da meine Schafe zur Beute geworden sind, so will ich über die Hirten kommen und meine Schafe aus ihrer Hand fordern“; die Schafe will ich sammeln und zu meinem Eigentum machen, diese aber sollen Strafen erleiden, wie sie schlechte Hirten verdienen.</p><p>[Forts. v. ] Um nicht durch Aufzählung aller Propheten und ihrer Worte die Rede in die Länge zu ziehen, will ich die übrigen übergehen und nur noch eines einzigen gedenken, des* Jeremias,* „der schon erkannt war, ehe er gebildet wurde, und der vom Mutterleibe an heilig war“. Er begehrt Wasser für sein Haupt und Tränenquellen für seine Augen, um Israel gebührend zu beweinen; nicht minder klagt er auch über die Ruchlosigkeit der Führer.</p><p>Die Priester beschuldigend spricht Gott zu Jeremias: „Die Priester fragten nicht: wo ist der Herr? Und die, welche sich mit dem Gesetze befaßten, kannten mich nicht, und die Hirten sündigten wider mich.“ Wiederum sagt er: „Die Hirten haben den Verstand verloren und suchten nicht den Herrn; daher ist auch die ganze Herde töricht geworden und hat sich zerstreut.“ „Viele Hirten ― sagt er ― haben meinen Weinberg verwüstet; mein kostbares Grundstück haben sie geschändet, so daß es zur weglosen Wüste geworden ist.“ Sodann wendet er sich an die Hirten mit den Worten: „Wehe den Hirten, welche die Schafe meiner Herde verderben und zerstreuen! Darum spricht der Herr wider die Hirten meines Volkes: Ich habe zerstreut meine Schafe und habe sie verjagt und nicht auf sie geachtet. Siehe, ich bestrafe euch entsprechend euren bösen Plänen.“ Und er will, daß die Hirten heulen und die Widder unter den Schafen wehklagen, weil sich erfüllt haben die Tage, da sie geschlachtet werden.</p><p>[Forts. v. ] Doch wozu soll ich alte Zeugnisse erwähnen? Wenn sich einer nach den Regeln und Vorschriften Pauli richtet, welche er über Bischöfe und Priester erlassen hat, daß sie nämlich nüchtern und besonnen seien, nicht dem Trunke ergeben, nicht streitsüchtig, aber gelehrig, tadellos in allem, unangreifbar für die Bösen, wird er da nicht vieles finden, was von der geraden Linie dieser Vorschriften abweicht? Wozu soll ich die Vorschriften erwähnen, welche Jesus seinen Jüngern gab, als er sie aussandte zu predigen? Der Hauptinhalt derselben ― um nicht auf Einzelheiten einzugehen ― ist, sie sollen so tugendhaft, so bescheiden und genügsam und, um es kurz zu sagen, so himmlisch sein, daß das Evangelium ebensosehr durch seine Wahrheit wie durch ihren Wandel wachse und gedeihe.</p><p>Mich schrecken die Vorwürfe an die Pharisäer und die Zurechtweisungen der Schriftgelehrten. Wir müssen, wie uns befohlen ist, sie an Tugend weit übertreffen, wenn wir das Himmelreich erlangen wollen. Schmählich wäre es nun, wenn wir uns noch schlimmer als sie zeigen würden. Nicht soll man auch uns mit Recht als Schlangen bezeichnen können, als Natterngezücht, als blinde Führer, welche Mücken seien und Kamele verschlucken, als Gräber, welche innen schmutzig sind, außen aber schön erscheinen, als Schüsseln von reinem Aussehen und noch als vieles andere, was jene sind und genannt werden.</p><p>[Forts. v. ] Tag und Nacht beschäftige ich mich mit solchen Gedanken. Sie trocknen mir das Mark aus und zehren an meinem Fleische, nehmen mir den Mut und lassen mich nicht aufschauen. Sie demütigen meine Seele, schnüren meinen Geist ein, legen meiner Zunge Fesseln an und lassen mich nicht an Ämter und an die Besserung und Leitung anderer, wozu es reichlicher Begabung bedürfte, denken, vielmehr nur daran, wie ich selbst dem kommenden Zorne entrinne und wie ich etwas von dem Roste meiner Sünden abschabe. Es ist notwendig, zuerst rein zu sein, erst dann zu reinigen, zuerst Weisheit zu lernen, erst dann sie zu lehren, zuerst Licht zu werden, erst dann zu leuchten, zuerst zu Gott zu treten, erst dann zu ihm zu führen, zuerst sich zu heiligen, erst dann andere zu heiligen. Man braucht Hände, um zu führen, und einen Verstand, um Rat zu erteilen.</p><p>„Wann werden nun die Vorbedingungen erfüllt sein?“ fragen die Voreiligen und Unzuverlässigen, welche leichtsinnig aufbauen und niederreißen. „Und wann wird das Licht auf den Leuchter gestellt werden? Und wo ist das Talent?“ Darunter verstehen sie die Gnade. Solche Fragen stellen die, welche sich eher für freundlichen Verkehr mit anderen als für Frömmigkeit erwärmen können. Wann sind die Vorbedingungen erfüllt? Welches ist meine Ansicht, ihr edlen Männer? Selbst das höchste Greisenalter ist kein später Termin. Besser ist verständiges Greisenalter als ungebildete Jugend, besser überlegtes Zögern als unüberlegte Eile, besser kurze Herrschaft als lange Tyrannei, wie auch ein kleiner ehrenvoller Besitz besser ist als großes, wertloses und unsicheres Eigentum, etwas Gold besser als viele Talente Blei, ein wenig Licht besser als große Finsternis.</p><p>[Forts. v. ] Möge man nicht durch dieses gefährliche Hetzen und übertriebene Hasten jenen Samenkörnern gleichen, welche auf Felsen fielen und, weil sie keinen tiefen Boden hatten, zwar sofort keimten, aber nicht einmal die erste Sonnenhitze ertragen konnten, oder jener Grundmauer, welche auf Sand gebaut wurde und Regen und Winden nicht einmal kurze Zeit standhielt. „Wehe dir, o Stadt, weil dein König noch zu jung ist!“ ruft Salomon aus. „Sei nicht rasch in deinen Worten!“ lehrt der gleiche Salomon; er behauptet, noch schlimmer als schnelle Rede sei hitziges Handeln. Wer sollte gleichwohl die Schnelligkeit der Sicherheit und dem Nutzen vorziehen? Wer will in gleicher Schnelligkeit, in der tönerne Gefäße an einem einzigen Tage gemacht werden, den Lehrer der Wahrheit bilden, der an die Seite der Engel treten und mit den Erzengeln lobsingen soll, der die Opfer zum himmlischen Altare senden, an dem Priesterdienste Christi teilnehmen, die Schöpfung erneuern, das Bild herstellen, der himmlischen Welt dienen und, was das Wichtigste ist, ein Gott werden und zu Göttern machen soll.</p><p>Ich weiß, wessen Diener wir sind, wo wir aufgestellt sind und wem wir die (Opfer) senden. Ich kenne Gottes Majestät und der Menschen Schwachheit und Kraft. „Erhaben ist der Himmel, die Erde aber ist unten.“ Wer von denen, welche die Sünde niedergeworfen hat, wird hinaufsteigen? Wer wird, solange er noch mit irdischer Finsternis und mit der Schwerfälligkeit des Fleisches umgeben ist, mit ganzer Seele und in reiner Weise den anschauen, der ganz Geist ist? Wer wird, solange er mitten in der veränderlichen, sichtbaren Welt lebt, sich den unveränderlichen, unsichtbaren Wesen zugesellen? Kaum dürfte einer, wenn er auch ganz gereinigt ist, hienieden das Bild des Schönen schauen, wie man die Sonne im Wasser schaut. „Wer hat das Meer mit der Hand, den Himmel mit der Spanne und die ganze Erde mit der Faust gemessen? Wer hat die Berge mit Gewichten und die Wälder auf einer Wage gewogen?“ „Wo ist der Ort seiner Ruhe?“ „Mit wem in aller Welt kann er verglichen werden?“</p><p>[Forts. v. ] Wer hat das All durch sein Wort erschaffen? Wer hat in seiner Weisheit den Menschen gebildet, das Getrennte vereint, Staub und Geist verbunden und Sichtbares und Unsichtbares, Zeitliches und Ewiges, Irdisches und Himmlisches zusammengefügt zu einem Wesen, das Gott ahnen, aber nicht fassen kann, ihm naht und doch ihm ferne ist? „Ich sprach: Weise werde ich sein, ― erklärt Salomon ― aber sie, die Weisheit, zog noch weiter als je fort von mir.“ Und wahrlich, „wer seine Erkenntnis mehrt, mehrt seinen Kummer.“ Denn die Freude über das Gefundene ist nicht größer als der Schmerz über das, was noch fehlt. Es ergeht uns da wie denen, welche noch durstig von der Quelle weggerissen werden, oder denen, die schon wähnen, etwas zu haben, es aber nicht bekommen können, oder denen, welche vom Blitzstrahl erleuchtet und schon wieder verlassen sind.</p><p>Was mich niederdrückte, kleinmütig machte und überzeugte, daß es besser ist, die Stimme des Lobes zu hören, als trotz fehlender Kraft zu predigen, dies war: die Majestät, Erhabenheit und Würde (Gottes), die reinen Naturen, welche kaum den Glanz Gottes fassen können, welchen der Abgrund verhüllt, die Finsternis verbirgt, welcher das reinste, für die meisten unzugängliche Licht ist, welcher in diesem Weltall und auch außerhalb desselben ist, welcher ganz Schönheit ist, aber auch erhaben über alle Schönheit, welcher den Geist erleuchtet, aber ihm entflieht, so rasch und so hoch er fliegen kann, welcher sich stets um so weiter vor dem Geiste zurückzieht, je mehr dieser ihn begreift und welcher seinen Freund dadurch himmelwärts führt, daß er ihm entflieht und gewissermaßen seinen Händen wieder entschlüpft.</p><p>So groß und so bedeutend ist in unseren Augen das erwünschte und erstrebte Ziel. Dies sind die Anforderungen, welche an den Brautführer und Werber der Seelen gestellt werden. Ich für mich muß fürchten, daß ich, an den Händen und Füßen gebunden, als einer, der kein hochzeitliches Gewand trägt und sich frech zu den Gästen eingeschlichen hat, aus dem Hochzeitssaale hinausgeworfen werde. Allerdings wurde ich ― um etwas zu verraten, was den meisten unbekannt ist ― schon in der Jugend berufen und „vom Mutterschoße an dem Herrn ausgeliefert“ und infolge eines Gelübdes der Mutter ihm geweiht. Durch Gefahren wurde ich später (im Vorhaben) gefestigt. Die Sehnsucht wuchs und die Überlegung wirkte mit. Dem, der mich erwählte und erlöste, gab ich alles hin: Vermögen, Ruhm, Gesundheit, selbst Beredsamkeit. Diese Güter verschafften mir nur den einen Vorteil, daß ich sie gering schätzen lernte und daß ich an ihnen etwas hatte, dem ich Christus vorziehen konnte. Die Worte Gottes wurden mir wertvoll wie Honigseim. „Die Einsicht rief ich zu Hilfe, der Weisheit galt meine Stimme.“ Ich mäßigte u. a. den Zorn, zügelte die Zunge, hielt die Augen in Zucht, bändigte den Magen, trat weltliche Ehre mit Füßen. „In Torheit rede ich“; doch es sei gesagt! In all dem war ich wohl nicht schlimmer als die meisten.</p><p>[Forts. v. ] Seelen zu leiten und zu führen und uns mit dem Hirtenamte betrauen zu lassen, ohne daß wir noch recht gelernt haben, geweidet zu werden, und ohne unsere Seele entsprechend gereinigt zu haben, geht über unsere Kräfte, zumal in solchen Zeiten, da man sehen muß, wie die Mitmenschen vom Sturme auf und nieder geschleudert werden, und es daher am besten ist, aus der Öffentlichkeit zu fliehen, an einen Zufluchtsort sich zurückzuziehen und vor dem Sturme und der Finsternis des Bösen gesichert zu sein, in Zeiten, da die Glieder gegen sich selbst Krieg führen, der letzte Rest von Liebe geschwunden ist und der Priester weiter nichts ist als ein leerer Name; denn wie die Schrift sagt: „Schmach ist ausgegossen über die Führer.“</p><p>Möchte es doch beim leeren Namen bleiben! So aber muß Lästerung über die Häupter der Gottlosen kommen. Alle Furcht ist aus den Seelen verbannt, an ihre Stelle ist Unverschämtheit getreten, jeder beliebige erhebt Anspruch auf Erkenntnis und die Tiefen des Geistes. Wir alle sind nur insofern fromm, als wir andere der Gottlosigkeit beschuldigen. Gottlose Menschen nehmen wir zu Richtern, werfen das Heilige den Hunden und die Perlen den Schweinen vor, indem wir unheiligen Ohren und Herzen die göttlichen Lehren predigen. Wir Armseligen erfüllen sorgfältig die Wünsche der Gegner und schämen uns nicht, unser Tun und Treiben zu beflecken. Moabiter und Ammoniter, denen es nicht einmal erlaubt war, in die Gemeinde des Herrn einzutreten, dringen in unser Allerheiligstes ein. Nicht die „Tore der Gerechtigkeit“, wohl aber die Türen der Lästerung und Frechheit gegen den Mitbruder haben wir allen aufgetan. Nicht der ist in unseren Augen der beste, der aus Furcht vor Gott nicht einmal ein „unnützes Wort“ ausspricht, sondern der, welcher seinen Mitmenschen offen oder versteckt am meisten beschimpft und „unter seiner Zunge Mühe und Schmerz“ oder ― besser gesagt ― Natterngift verarbeitet.</p><p>[Forts. v. ] Wir geben acht auf die Sünden des Nächsten, nicht um darüber zu weinen, sondern zu schimpfen, nicht um zu heilen, sondern zu schlagen und unsere eigenen Fehler mit den Wunden der Mitmenschen zu entschuldigen. Nicht vom Lebenswandel macht man günstiges und ungünstiges Urteil abhängig, sondern von der Frage, ob einer fernesteht oder Freund ist. Was wir heute loben, machen wir morgen schlecht. Was bei anderen als Schande gilt, wird bei uns bewundert. Gerne wird dem Sünder alles verziehen, großmütig sind wir im Schlechten.</p><p>[Forts. v. ] Alles ist geworden, wie es am Anfang war, da die Welt noch nicht bestand, und noch nicht die jetzige Ordnung und Gestaltung war, da die Verwirrung und Unordnung des Alls der gestaltenden Hand und Kraft bedurfte. Es sieht ― wenn ihr so lieber wollt ― aus wie in einem nächtlichen Kampfe und bei trübem Mondlicht, wenn man die Gesichter von Freund und Feind nicht unterscheiden kann, oder wie bei einer Seeschlacht und einem Seesturme, wenn die Winde heulen, die Brandung braust, die Wogen sich türmen, die Schiffe zerschellen, die Ruder zusammenstoßen, die Kommandorufe ertönen, die Stürzenden wehklagen und man seine eigene Stimme nicht hört, die Fassung und die Gelegenheit zur Tapferkeit verliert. Welch ein Unheil! Wir fallen übereinander her und verschlingen einander.</p><p>Mit dem Priester verhält es sich nicht anders als mit dem Volke. Es scheint mir jetzt vollauf das alte Drohwort in Erfüllung zu gehen: „Der Priester ist geworden wie das Volk.“ Die Vornehmen und Führer des Volkes sind nicht anders als die Masse. Offen führen jene Kampf mit den Priestern und bedienen sich der Kirche, um für ihre Sache zu gewinnen. Wer um des Glaubens und der höchsten und ersten Fragen willen sich solchen Kampf gefallen lassen muß, den tadle auch ich nicht, vielmehr ― um die Wahrheit zu sagen ― lobe ich ihn und beglückwünsche ihn. Ich wünsche einer von diesen zu sein, welche für die Wahrheit streiten und ihretwegen gehaßt werden; ja ich würde mich dessen freuen. Besser ein löblicher Krieg, als ein Friede ohne Gott. Darum rüstet der Geist den Sanftmütigen zum Kampfe, daß er gut zu kämpfen verstehe.</p><p>[Forts. v. ] Es gibt solche, welche um Kleinigkeiten einen unnützen Kampf kämpfen und gar dumm und frech, wenn sie nur können, für die schlechte Sache anwerben. Überall wird da der Glaube vorgeschoben; bei persönlichen Streitigkeiten muß dieser ehrwürdige Name herhalten. So kommt es natürlich, daß die Heiden uns hassen. Und, was das Schlimmere ist, wir können nicht einmal behaupten, daß sie unrecht haben. Wir sind aber auch unter den Rechtschaffenen, unter unseren Leuten verachtet. Daß wir es bei der Masse sind, ist ja nicht zu verwundern, da sie nur mit Mühe etwas Richtiges zu verstehen vermag.</p><p>[Forts. v. ] „Die Sünder arbeiten auf unserem Rücken“, und, was wir widereinander sinnen, werfen sie allen vor. Wir sind ein neues Schauspiel geworden, aber nicht „Engeln und Menschen“ wie Paulus, der edelste unter den Kämpfern, der wider „die Mächte und Herrschaften“ stritt, sondern fast allen schlimmen Elementen aller Zeiten und aller Orte, auf Märkten, bei Gastmählern, in Freud und in Leid. Bereits läßt man uns ― fast unter Tränen sage ich es ― auf der Bühne auftreten, um uns mit den liederlichsten Menschen zu verlachen. Nichts ist so lustig anzuhören und anzusehen wie die Rolle eines Priesters in einem Lustspiel.</p><p>Dies hat uns der innere Krieg beschert; dies haben uns die eingetragen, welche einen ungeregelten Kampf für den Guten und Sanftmütigen führen, die, welche für Gott mehr eifern, als zuträglich ist. Wer ringen oder sonst irgendwie kämpfen will, hat sich an Gesetze zu halten. Wer im Ringen sich nicht an die Ordnung hält oder sonst unrichtig kämpft und nicht die bestehenden Kampfgesetze beobachtet, wird niedergeschrien, ausgespottet und verliert den Sieg, mag er auch tüchtig und recht geschult sein. Soll man für Christus kämpfen, ohne sich an Christi Gesetze zu halten? Wird man dem Frieden dienen, wenn man für ihn in unerlaubter Weise kämpft?</p><p>[Forts. v. ] Noch heute zittern die Dämonen, wenn der Name Christus genannt wird. Und die Kraft dieses Namens ist trotz aller Bosheit nicht geschwunden. Wir aber scheuen uns nicht, diese heilige Idee, diesen heiligen Namen zu entehren, trotzdem der Herr selbst es täglich uns fast in die Ohren ruft: „Euretwegen wird mein Name unter den Heiden gelästert.“</p><p>[Forts. v. ] Den äußeren Krieg fürchte ich nicht, auch nicht das Tier, das sich jetzt gegen die Kirche erhoben hat und die Fülle der Bosheit ist, mag es auch mit Feuer, mit Schwert, mit wilden Tieren, mit steilen Höhen und mit Abgründen drohen, mag es auch der unmenschlichste Wüterich sein, der je gelebt hat, mag es auch noch schlimmere Strafen, als schon bestehen, ausfindig machen. Gegen alles habe ich* ein* Heilmittel,* einen* Weg zum Siege, nämlich den Tod um Christi willen: „In Christus will ich mich rühmen.“</p><p>In meinen persönlichen Kämpfen aber kenne ich mich nicht aus; nicht weiß ich, wo ich Hilfe, weisen Rat, Freundschaft finde und zu welchen Waffen ich gegen die Ränke des Bösen greifen soll. Wo ist, um ihn zu besiegen, ein Moses, der auf dem Berge seine Hände ausstreckte, damit das Kreuz, das auf solche Weise vorgebildet und prophezeit war, den Sieg gewänne? Wo ist sein Nachfolger, ein Josua, der mit dem Führer des göttlichen Heeres auszog? Wo ein David, der, sei es, daß er die Harfe spielt, sei es, daß er mit der Schleuder kämpft, von Gott für den Krieg mit Kraft umgürtet ist und dessen Finger geübt sind für den Streit? Wo ein Samuel, der für das Volk betet und opfert, und der den zum König salbt, der zu siegen versteht? Wo wird ein Jeremias sein, der unser Elend nach Gebühr beweint und Klagelieder über Israel schreibt?</p><p>[Forts. v. ] Wer will klagen: „Schone, o Herr, dein Volk und liefere dein Erbe nicht der Schmach aus, so daß die Heiden über dasselbe herrschen!“ Wer will wie ein Noe, Job, Daniel, deren gemeinsames Gebet erwähnt ist, für uns beten, daß der Krieg bei uns ein wenig nachlasse, daß wir wieder zueinander gehören, endlich einander kennen, daß wir statt des einen Israel nicht mehr ein Juda und ein Israel, nicht mehr Roboam und Jeroboam, nicht mehr Jerusalem und Samaria seien, welche um ihrer Sünden willen beide dahingehen und beweint werden.</p><p>Ich gestehe es, daß ich für einen solchen Kampf zu schwach bin. Daher habe ich ihm den Rücken gekehrt und mich „mit verhülltem Gesichte auf die Flucht begeben“, um in all meiner Bitterkeit allein zu sein und zu schweigen. Denn ich sehe, daß „die Zeit böse ist“, daß „die Geliebten ausschlagen“, daß wir „abtrünnige Kinder“ geworden sind, wir, „der schönrankende Weinstock“, wir, der wahre, ganz fruchtbare, ganz reizende, im himmlischen Regen herrlich wachsende Weinstock, daß das „Diadem der Schönheit“, das Siegel meiner Herrlichkeit, „mein Ruhmeskranz“ mir zur Schande geworden ist. Ist einer zum Kampfe kühn und mutig, so preise ich ihn glücklich wegen seiner Kühnheit und seines Mutes.</p><p>[Forts. v. ] Ich spreche noch nicht von dem inneren, seelischen Kampfe, den wir Tag und Nacht versteckt und offen zu kämpfen haben wegen des „nichtigen Körpers“, wegen der Sinnlichkeit und der Lüste dieses Lebens, welche uns erregen, auf und nieder werfen und nicht zur Ruhe kommen lassen, wegen des Erdenschmutzes, in dem wir stecken, wegen des Gesetzes der Sünde, das gegen das Gesetz des Geistes streitet und das königliche Ebenbild in uns und alles, was von Gott uns zugeflossen ist, zu zerstören sucht. Daher wird einer nur mit Mühe über die niederziehende Macht der Materie die Herrschaft behalten, mag er auch in langer Beschäftigung mit der Philosophie sich erzogen haben und den edlen, lichten Teil der Seele allmählich von dem niederen, an die Finsternis gebundenen losgerissen haben, oder mag er der Barmherzigkeit Gottes teilhaftig geworden sein, oder mag er beides zugleich erreicht haben, und mag er sich möglichst viel Mühe geben, den Blick nach oben zu lenken. Nach meinem Dafürhalten ist es nicht ungefährlich, die Seelsorge oder die Vermittlung zwischen Gott und den Menschen, was wohl Aufgabe des Priesters ist, zu übernehmen, noch ehe man die Materie so weit als möglich bezwungen, die Seele genügend gereinigt und sich Gott mehr als die anderen genähert hat.</p><p>Was hat diese Ängstlichkeit in mir hervorgerufen? Ihr sollt nicht glauben, daß ich über Gebühr ängstlich bin, vielmehr mir wegen meiner Vorsicht großes Lob spenden. Als Gott mit Moses sprach und mehrere, worunter Aaron und seine beiden priesterlichen Söhne waren, und der Rat der 70 Ältesten an den Berg berufen worden waren, da hat Moses, wie ich bei ihm selbst lese, allein den Auftrag erhalten, näherzutreten, während die übrigen nur von ferne anbeten durften und das Volk nicht mit hinaufsteigen sollte, weil in der Tat nicht alle Gott nahetreten können, sondern nur solche, welche gleich Moses die Herrlichkeit Gottes zu ertragen imstande sind. Früher noch, am Anfang der Gesetzgebung, wurden andere durch Posaunen, Blitze, Donner, Finsternis, den Rauch des ganzen Berges, die schrecklichen Drohungen: „Selbst wenn ein Tier den Berg berührt, soll es gesteinigt werden“ und andere Schreckmittel ferngehalten. Und obwohl sie sich gehörig gereinigt hatten, war es für sie schon eine große Begünstigung, nur die Stimme Gottes zu hören. Moses jedoch steigt hinauf, tritt ein in die Wolke, empfängt das Gesetz und die Tafeln; für die Masse waren es beschriebene Tafeln, für die Auserwählten sind es Tafeln des Geistes.</p><p>[Forts. v. ] Wie ich weiter lese, wurden Nadab und Abiud nur, weil sie mit fremdem Feuer geräuchert hatten, auch von fremdem Feuer verzehrt. Worin sie gesündigt hatten, wurden sie bestraft; zu der gleichen Zeit und am gleichen Orte, da sie gefrevelt hatten, gingen sie zugrunde. Nicht einmal Aaron, ihr Vater, der nach Moses Gott am nächsten stand, konnte ihnen helfen. Ich kenne auch den Priester Heli und den etwas später lebenden Oza und weiß, daß jener bestraft wurde für die Sünde seiner Söhne, welche diese an den Opfergaben begangen hatten, soferne sie vor der Zeit für sich zuerst aus dem Kessel genommen hatten; übrigens hatte Heli ihren Frevel nicht gutgeheißen, vielmehr sie oft und viel verwarnt. Ich weiß, daß Oza nur, weil er die vom Rinde auf die Seite gezogene Bundeslade berührt hatte, trotz deren Rettung umkam, da Gott für die Heilighaltung der Bundeslade eingetreten war.</p><p>Wie mir bekannt ist, blieben weder bei den Priestern noch bei den Opfertieren leibliche Fehler ungeprüft. Es war verordnet, daß nur Vollkommene Vollkommenes opfern dürfen, womit, wie ich glaube, vorbildlich die Reinheit der Seele gefordert ist. Nicht war es jedem gestattet, das priesterliche Gewand oder ein heiliges Gefäß zu berühren. Die Opfergaben durften nur zu bestimmter Zeit und an bestimmtem Orte von bestimmten Personen genossen werden. Weder das Salböl noch das Rauchwerk in seiner besonderen Mischung durfte nachgemacht werden. Und wer nicht bis ins kleinste rein war an Leib und Seele, durfte das Heiligtum nicht betreten. Um so weniger war es erlaubt, kühn in das Allerheiligste einzutreten, welches nur einmal im Jahre nur* einer* betreten durfte. Und um so weniger war es irgendeinem erlaubt, den Vorhang, den Sühnedeckel, die Bundeslade, die Cherubim anzusehen oder zu betasten.</p><p>Da mir dies bekannt war und ich wußte, daß niemand des großen Gottes und Opfers und Hohenpriesters würdig ist, der nicht zuerst sich selbst Gott als lebendiges, heiliges Opfer hingegeben, den vernünftigen, wohlgefälligen Dienst erwiesen und Gott ein Opfer des Lobes und einen zerknirschten Geist gebracht hat, das einzige Opfer, welches Gott, der uns alles gegeben hat, von uns fordert, wie hätte ich den Mut haben sollen, ihm das objektive Opfer zu bringen, welches die die großen Geheimnisse enthaltende Erfüllung ist, wie hätte ich es wagen sollen, Würde und Name eines Priesters anzunehmen, ohne zuvor meine Hände durch heilige Werke gereinigt, ohne das Auge zur gesunden Weltbetrachtung ― nur zur Bewunderung des Schöpfers, nicht aber zum Verderben des Geschöpfes ― erzogen zu haben, ohne daß zuvor meine Ohren durch die Zucht des Herrn genügend geöffnet sind und mir ein Gehör gegeben ist, das nicht schwer zu hören vermag, ohne daß goldenem Ohrgehänge ein kostbarer Edelstein eingelegt ist, (d. h.) das Wort der Weisheit seinen Weg in aufmerksames Ohr gefunden hat. Wie hätte ich es wagen sollen, ehe der Mund sich öffnete, um den Geist in sich aufzunehmen, ehe er sich weit auftat, angefüllt durch den Geist mit geheimnisvollen und lehrreichen Worten, ehe meine Lippen ― um ein Wort der Weisheit zu gebrauchen ― sich in göttlichem Genusse schlossen und ― wie ich beifügen möchte ― zur rechten Zeit sich wieder lösten, ehe meine Zunge von Freude überströmte und ein Instrument göttlicher Melodie wurde, erwachend zur Verherrlichung, erwachend am Morgen und erst ermüdend, wenn sie am Gaumen klebt? Wie hätte ich es wagen sollen, ohne daß zuvor meine Füße, aufrecht wie die Füße von Hirschen, auf Felsen stehen und ohne daß meine Schritte den Weg Gottes geradeaus wandeln, nirgend, auch nicht ein wenig abweichend, ohne daß zuvor jedes Glied ein Werkzeug der Gerechtigkeit geworden ist und wir alles Sterbliche abgelegt haben, nachdem es vom Leben verschlungen und dem Geiste gewichen ist?</p><p>Wer sollte es wagen, solange noch nicht die reinen und brennenden Worte Gottes und die Erklärung der Schrift sein Herz erglühen lassen, solange er dieselben nicht dreimal auf die Tafel seines Herzens geschrieben hat, um Christi Geist zu besitzen, solange er nicht in die den meisten verborgenen, unsichtbaren und dunklen Schätze eingedrungen ist, um ihren Reichtum zu schauen und andere damit zu bereichern, Geistigen Geistiges erklärend.</p><p>[Forts. v. ] Wer sollte es wagen, solange er noch nicht, wie es sich gehört, „die Freude des Herrn geschaut und seinen Tempel besucht hat“, bzw. solange er nicht ein Tempel des lebendigen Gottes und durch den Geist ein lebendiges Haus Christi geworden ist? Wer sollte es wagen, solange er noch nicht die Beziehungen und den Unterschied zwischen Vorbild und Wahrheit erkannt, von jenem sich losgesagt und dieser sich angeschlossen hat, um den alten Buchstaben zu verlassen und dem neuen Geiste zu dienen und von dem durch Ertötung des Fleisches sich geistig erfüllenden Gesetze weg rein zur Gnade überzugehen.</p><p>[Forts. v. ] Wer sollte es wagen, ohne bereits alle Namen und Eigenschaften Christi praktisch und theoretisch durchgenommen zu haben, sowohl die erhabeneren und früheren, als auch die, welche unsertwegen niederer und später sind, nämlich: Gott, Sohn, Bild, Wort, Weisheit, Wahrheit, Licht, Leben, Kraft, Hauch, Ausfluß, Glanz, Schöpfer, König, Haupt, Gesetz, Weg, Türe, Grund, Fels, Perle, Friede, Gerechtigkeit, Heiligung, Erlösung, Mensch, Knecht, Hirte, Lamm, Hohepriester, Opfer, Erstgeborener vor der Schöpfung, Auferstehung? Wer sollte es wagen, solange er von diesen Namen und Ideen ohne Nutzen hört und sich noch nicht mit dem Logos verbunden und an ihm teilgenommen hat bezüglich dessen, was er da ist und genannt wird?</p><p>Wenn einer noch nicht die Zeit gefunden hat, zu lernen, „Gottes in Geheimnisse gehüllte Weisheit zu verkünden“, wenn einer noch unmündig ist, erst mit Milch ernährt wird, noch nicht zu den Israeliten gezählt wird und noch nicht dem Heere Gottes angehört, noch nicht die Kraft hat, Christi Kreuz männlich zu tragen, noch in keiner Weise den Edleren eingegliedert ist, wie sollte er da freudig und gerne an die Spitze der Gemeinde Christi treten wollen? Nach meinem Urteile und Dafürhalten ist es unmöglich. Wer weiß, wie schwer es ist, aufzubauen, und welcher Schaden durch Mißgriffe angerichtet wird, muß sich vor dem Führeramte fürchten und in ihm größte Gefahren erblicken.</p><p>[Forts. v. ] Anderen überlasse ich es, ― so sagte ich mir ― als Kaufleute auf die See zu gehen und die weiten Meere zu befahren und ständig mit Winden und Wogen zu kämpfen, um ― je nachdem ― viel zu gewinnen und viel zu riskieren. Ich überlasse es allen, welche besonders see- und handelstüchtig sind. Besser, als langen und schweren Gefahren um großen Gewinnes willen sich zu unterziehen, ist es für mich, auf dem Lande zu bleiben, einen kleinen, guten Acker zu pflügen, Gewinne und Meere nur von ferne zu grüßen, von möglichst geringer und schmaler Kost, in Sicherheit, unbehelligt von den Meereswogen, zu leben.</p><p>[Forts. v. ] Ist einer ein bedeutender Mann, dann wäre es für ihn ein Nachteil, wenn er nicht große Aufgaben in Angriff nähme und seine Kraft nicht vielen zugute kommen ließe, sondern im kleinen steckenbliebe, wenn er also gleichsam mit hellem Lichte nur ein kleines Haus erleuchten oder männliche Rüstung einem Knaben anlegen würde. Ist einer aber ein kleiner Mann, dann ist es für ihn besser, kleine Lasten zu tragen, statt durch übermäßige Belastung der eigenen Kraft sich zugleich Gelächter und Gefahren auszusetzen. Es ist ja, wie wir hören, auch nur dem erlaubt, einen Turm zu bauen, der das Zeug hat, ihn fertigzustellen.</p><p>Ihr kennt nun meine Verteidigung bezüglich meiner Flucht. Vielleicht ist sie über Gebühr lang geworden. Dies ist es nun, meine Freunde und Brüder, was mich von euch fortgeführt hat, zu meinem und vielleicht auch eurem Schmerze; doch es mußte sein, wie ich damals wenigstens glaubte. Was mich aber wieder zurückführte, war zunächst meine Sehnsucht nach euch und das Empfinden, daß auch ihr euch nach mir sehnet. Denn nichts vermag so sehr Liebe zu entflammen wie Gegenliebe.</p><p>[Forts. v. ] Sodann veranlaßten mich (zur Rückkehr) die, denen mein Sorgen und Wirken gilt, nämlich meine bejahrten und gebrechlichen ehrwürdigen Eltern, die mehr meinetwegen, als infolge des Alters leiden, Abraham, dieser Patriarch, mein teurer, zu den Engeln zählender Führer, und Sara, welche uns durch die Lehre des Glaubens auch geistig geboren hatte. Vor allem war es mein Wunsch, ihnen im Alter ein Stab zu werden und sie in ihrer Schwachheit zu unterstützen, was ich auch tatsächlich, soweit wie möglich durchgeführt hatte, so sehr, daß ich sogar darauf verzichtete, Philosoph (= Mönch) zu werden, was ich am liebsten erstrebt und wovon ich am liebsten gesprochen hatte, bzw. daß ich ― um mich richtiger auszudrücken ― meine philosophische Aufgabe besonders darin erblickte, auf das Äußere eines Philosophen zu verzichten. Daher hätte ich es nicht ertragen, wenn durch eine einzige Idee mein Mühen und Sorgen entwertet worden wäre und ich auf solche Weise des Segens verlustig gegangen wäre, welchen sich schon ein Ehrwürdiger unter den Alten erschlichen haben soll, indem er seinen Vater durch Speise und härenes Gewand täuschte und das Gute durch Unrecht und List erraffte.</p><p>Die zwei angegebenen Gründe sind es, welche mich veranlaßten, mich zu fügen und nachzugeben. Und es ist wohl am Platze, aus beiden Gründen sich zu beugen und nachzugeben. Denn alles hat wohl seine Zeit, auch das Nachgeben. Und besser ist es, ehrlich zu unterliegen, als einen unsicheren, unehrlichen Sieg zu erringen.</p><p>Ich komme zum dritten und wichtigsten Grunde (meiner Rückkehr). Wenn ich diesen erwähnt habe, kann ich von dem übrigen schweigen. „Ich gedachte längst vergangener Tage“, und in der Erinnerung an die alte Geschichte holte ich mir Rat für die Gegenwart. Denn wir dürfen nicht glauben, daß die Geschichte umsonst aufgezeichnet ist; wir dürfen sie nicht bloß für eine Sammlung von Worten und Tatsachen halten, welche nur zur Unterhaltung der Hörer als Ohrenschmaus für sinnliche Befriedigung vorgenommen wurde. Spielereien mögen in ihren Mythen die Heiden treiben, welche, sich nur wenig um die Wahrheit kümmernd, Ohr und Herz durch prunkhafte Darstellung und reizende Worte bezaubern.</p><p>[Forts. v. ] Wir aber, welche die Sorgfalt des (Hl.) Geistes auch auf die kleinsten Zeichen und Striche ausdehnen, werden, da es unrecht wäre, auch von den unbedeutendsten Geschichten niemals zugeben, daß sie von den Schriftstellern ohne tieferen Grund ausgearbeitet worden sind und ohne solchen bis auf den heutigen Tag erhalten werden. Wir sollen uns vielmehr bei ähnlichen Fällen und Zeitverhältnissen an dieselben erinnern und von ihnen belehren lassen und uns nach den früheren Beispielen als Regeln und Vorbildern richten, um da etwas zu meiden, dort etwas zu tun.</p><p>Was für eine Geschichte ist es nun, die uns beraten hat? Die Geschichte zu erzählen, dient ja wohl zur Beruhigung der Menge.</p><p>Es floh Jonas vor Gott, oder vielmehr, er glaubte zu fliehen. Doch das Meer, der Sturm, das Los, der Bauch des Fisches, das dreitägige Begräbnis ― ein Vorbild eines großen Geheimnisses ― hielten ihn zurück. Jonas war geflohen, um nicht, nachdem er den Niniviten die traurige, ungünstige Botschaft verkündet hatte, hernach, im Falle die Stadt durch Reue gerettet würde, als Lügner ertappt zu werden. Nicht war er nämlich darüber ungehalten, daß die Sünder gerettet werden, er fürchtete vielmehr, der Lüge zu dienen und war gleichsam eifersüchtig auf das Vertrauen, das die Propheten genossen hatten und das ihm verlorenzugehen drohte; denn die Menge hatte nicht in die Tiefe des göttlichen Waltens einzudringen vermocht.</p><p>[Forts. v. ] Wie ich von einem bibelkundigen Manne, der nicht ungeschickt das, was an der Geschichte ungereimt erscheint, löste und die Fähigkeit besaß, in die Tiefe der Prophetie einzudringen, gehört habe, war es nicht der angegebene Grund, der den seligen Jonas zur Flucht veranlaßte, seine Flucht dem Meere anvertrauen hieß, ihn nach Joppe führte und von Joppe gegen Tharsis trieb. Es ist nicht wahrscheinlich, daß ihm, einem Propheten, unbekannt war, daß Gott in seiner großen Weisheit, in seinem unerforschlichen Ratschluß, auf seinen unergründlichen, unbegreiflichen Wegen durch die Drohung bezweckte, den Niniviten die angedrohten Leiden zu ersparen. Und wenn er davon wußte, ist es nicht wahrscheinlich, daß er Gott den Gehorsam verweigerte, mochte er den Niniviten so oder anders Rettung verschaffen wollen. Die Meinung aber, Jonas habe gehofft, auf dem Meere sich zu verbergen und durch die Flucht dem weitblickenden Auge Gottes zu entgehen, wäre doch recht ungereimt und töricht, und man soll sie nicht einem Propheten, ja nicht einmal irgendeinem Menschen zutrauen, der noch ein normales Verständnis für Gott und seine Allmacht besitzt.</p><p>Nach meinem Gewährsmann, dem ich folge, wußte Jonas besser als alle, was die Predigt bei den Niniviten erreichen werde, und daß er im Falle der Flucht nur den Ort wechsle, aber nicht Gott entrinne. Kein Mensch kann ihm ja entrinnen, mag er sich im Schoße der Erde oder in den Tiefen des Meeres verbergen, mag er das Fliegen ersinnen und auf Flügeln sich in die Luft erheben, mag er die untersten Teile der Unterwelt besuchen, mag er sich in dichte Wolken hüllen oder mag er irgend etwas anderes zur Sicherung seiner Flucht ausdenken. Nur Gott allein ist es, dem man, wenn er jemanden packen und in seine Hand bekommen will, absolut nicht entfliehen und nicht widerstehen kann. Den Eiligen kommt er zuvor, die Klugen betört er, die Starken wirft er nieder, die Stolzen demütigt er, er zähmt den Mut und beugt die Kraft.</p><p>[Forts. v. ] Jonas kannte gut die gewaltige Hand Gottes, da er anderen damit drohte. Nicht dürfen wir glauben, daß er daran dachte, der Gottheit gänzlich zu entfliehen. Da er den Fall Israels sah, und merkte, daß die Gnade der Weissagung auf die Heiden überging, darum entzieht er sich der Predigt, schiebt die Ausführung des Auftrages hinaus, verläßt die „Freudenwarte“, hebräisch: Joppe, ― ich meine die einstige Größe und Würde der Stadt ― und stürzt sich in das Meer der Trauer, darum gerät er in den Sturm, schläft ein, erleidet Schiffbruch, wird aus dem Schlafe geweckt, vom Lose getroffen, gesteht seine Flucht, wird ins Meer geworfen, vom Meerfisch verschlungen, ohne jedoch verzehrt zu werden, ruft Gott zu Hilfe und wird wunderbarerweise gleich Christus nach drei Tagen wieder freigegeben. Dies möge bezüglich Jonas genügen, etwas später werden wir, so Gott will, eingehender darüber sprechen.</p><p>[Forts. v. ] Es kam mir nun ― dies ist der Zweck dieser Bemerkungen ― der Gedanke: für Jonas war es ja vielleicht noch einigermaßen verzeihlich, wenn er aus dem angegebenen Grunde mit der Predigt zögerte, aber was soll ich zur Verteidigung sagen, wenn ich ausreiße und das mir auferlegte Joch des Dienstes ― mag es als leicht oder schwer bezeichnet werden müssen ― abschüttle?</p><p>Wenn man auch ― was hier allein in Betracht kommen kann ― zugeben könnte, daß wir viel zu tief stehen, um Gottes Priester sein zu können, und daß man zuerst ein würdiges Glied der Kirche sein muß, um an den Altar treten zu dürfen, und daß man erst des Altares würdig sein muß, ehe man der Gemeinde vorstehen kann, so wird man uns doch wohl den Vorwurf des Ungehorsams nicht ersparen.</p><p>Hart sind die Drohungen, hart die Strafen wider die Ungehorsamen, hart anderseits wider die, welche nicht zögern und nicht Bedenken tragen und nicht, gleich Saul, sich „hinter die Geräte des Vaters verstecken“, mögen sie auch nur kurze Zeit zum Führeramt berufen werden, wider die, welche dasselbe wie eine Kleinigkeit und eine Bagatelle gerne auf sich nehmen. Und umzusatteln und den ersten Entschluß durch einen zweiten gutmachen zu wollen, wäre gewagt.</p><p>[Forts. v. ] Die Frage, was ich zu tun habe, kostete mich schmerzliche Überlegungen; ich stand zwischen zwei Drohungen, die eine drückte mich nieder, die andere richtete mich auf. Nach sehr langem Zögern und Hin- und Herschwanken, nachdem ich unter dem Einfluß wechselnder Winde bald dahin, bald dorthin meinen Kurs genommen hatte, erlag ich schließlich der stärkeren Drohung. Die Drohung wegen des Ungehorsames bezwang mich; von ihr werde ich geleitet. Ich richte mich, wie ihr seht, pflichtgemäß und recht nach der Warnung, nach einem Amte zu streben, das nicht angetragen wird, und der Warnung, ein Amt zurückzuweisen, das angetragen wird. Das eine ist Verwegenheit, das andere Ungehorsam; das eine und andere ist Dummheit. Ich halte mich in der Mitte zwischen den Allzukühnen und den Allzuängstlichen. Ich bin ängstlicher als die, welche nach allen Ämtern jagen, aber kühner als die, welche vor allen Ämtern fliehen.</p><p>Dies habe ich in dieser Sache zu sagen.</p><p>Wir wollen noch genauer unterscheiden. Wenn einer Scheu hat vor dem Führeramte, dann möge ihm der Gedanke zu Hilfe kommen, daß es der Gehorsam in der Regel mit sich bringt, daß Gott das Vertrauen mit Barmherzigkeit beantwortet und daß er dem, der sich mutig auf ihn verläßt und alle Hoffnung auf ihn setzt, die notwendige Fähigkeit verleiht. Wenn wir aber uns in die Gefahr des Ungehorsams stürzen, so weiß ich nicht, wer uns helfen und was uns Mut machen sollte. Wir müssen fürchten, bezüglich der uns anvertrauten Seelen das Wort zu hören: „Ich werde ihre Seele aus eurer Hand fordern“ und „gleichwie ihr es verschmäht habt, Führer und Fürsten meines Volkes zu sein, so werde auch ich es verschmähen, euch König zu sein“ und „gleichwie ihr nicht auf meine Stimme gehört, sondern mir euren harten Nacken geboten habt, um mir den Gehorsam zu verweigern, so will ich, wenn ihr mich anruft, nicht auf euer Gebet achten und nicht darauf hören“. Möchten wir doch nicht solche Worte vom gerechten Richter zu hören bekommen, dessen Gerechtigkeit wir genau so preisen müssen wie seine Barmherzigkeit.</p><p>[Forts. v. ] Doch ich wende mich wieder der Geschichte zu. Wenn ich auf die trefflichen Männer der alten Geschichte achte, finde ich, daß von denen, welche jemals von der Gnade zum Führer- und Predigtamt berufen wurden, die einen bereitwillig dem Rufe folgten, andere die Annahme der Gnade verzögerten, und daß weder die einen wegen ihrer Ängstlichkeit, noch die anderen wegen ihrer Bereitwilligkeit getadelt wurden. Aaron war bereit, Moses lehnte ab. Isaias gehorchte gerne, Jeremias fürchtete sich wegen seiner Jugend und nahm das Predigtamt erst dann mutig an, als Gott ihm eine Verheißung gab und eine Kraft, welche seine Jugend aufwog.</p><p>Solche Erwägungen beruhigen mich, und meine Seele wird allmählich gefügig und wird weich wie (feuriges) Eisen. Rat gibt mir die Zeit, geben mir Gottes Weisungen, welchen ich mich in meinem ganzen Leben unterworfen habe. Darum „bin ich nicht ungehorsam und widerspreche ich nicht“. So sprach mein Herr, als er wie ein Lamm zur Schlachtbank geführt wurde, nicht etwa, als ihm ein Führeramt übertragen wurde. Ich falle nieder und demütige mich unter die gewaltige Hand Gottes. Und wenn mir wegen früherer Untätigkeit und wegen Ungehorsams ein Vorwurf gemacht werden sollte, bitte ich um Verzeihung. Ich habe geschwiegen, aber ich werde nicht immer schweigen. Ich habe mich auf einige Zeit zurückgezogen, um über mich selbst nachzudenken und Trost in meinem Schmerze zu finden. Doch nunmehr bin ich entschlossen, den Herrn „in der Versammlung des Volkes zu preisen und ihn zu loben auf dem Stuhle der Ältesten“. Verdiene ich im einen Falle Tadel, so im anderen Verzeihung.</p><p>[Forts. v. ] Was soll ich noch weiter reden? Hier bin ich, meine Hirten und Mithirten. Hier bin ich, heilige Herde, die du Christi, des Hohenpriesters, würdig bist. Hier bin ich, mein Vater; in allem bin ich besiegt, bin unterworfen, doch mehr den Gesetzen Christi, als weltlichen Gesetzen. Ich bin dir gehorsam. Gib mir dafür deinen Segen! Führe auch du mich durch deine Gebete, leite mich durch dein Wort, stärke mich durch deinen Geist! „Der Segen des Vaters baut den Kindern Häuser.“ Möchten wir befestigt werden, ich und dieses geistige Haus, das ich erwählt habe und von dem ich wünsche, daß es mir in alle Ewigkeit zur Ruhe diene, wenn ich einmal von der irdischen Kirche zur himmlischen, zur „Versammlung der Erstgeborenen, die im Himmel eingeschrieben sind“, hinübergegangen bin.</p><p>Dies ist meine wohlbegründete Bitte. Der Gott des Friedens, der „das Getrennte vereint“, der uns gegenseitig schenkt, der die Könige auf ihre Throne setzt, der „den Armen von der Erde aufrichtet und den Dürftigen aus dem Schmutze erhebt“, der David zu seinem Diener erwählt und ihn, obwohl er der letzte und jüngste unter den Söhnen des Jesse war, von seinen Schafherden genommen hat, der „den Verkündigern des Evangeliums die Gewalt des Wortes verleiht“ zur Vollendung des Evangeliums, er möge unsere Rechte ergreifen, uns nach seinem Willen führen und mit Ehren annehmen, er, der die Hirten weidet und die Führer leitet, damit wir seine Herde mit Weisheit führen, wofür den Alten Segen beschieden war, und damit wir nicht „mit den Mitteln eines törichten Hirten“ führen, wofür jenen Fluch zuteil geworden war. Möge Gott seinem Volke Kraft und Stärke verleihen! Er bereite sich in der Wohnung der Fröhlichen, im Glanze der Heiligen eine herrliche, unbefleckte Herde, welche der himmlischen Hürde würdig ist, auf daß wir alle, Herde wie Hirten, in seinem Tempel das Lob singen in Christus Jesus, unserm Herrn, dem die Ehre sei in alle Ewigkeit! Amen.III. Rede</p><h2>III. Rede</h2><p><em>III. Rede.</em></p><p><em>An die, welche Gregor riefen, aber ihm nicht entgegen kamen</em>.</p><p>Meine Freunde und Brüder, warum zögert ihr, auf unser Wort zu hören, während es doch euch eilte, uns zu vergewaltigen und uns aus unserer Burg zu schleppen, d. i. aus der Einsamkeit, welche ich über alles geliebt und besonders verehrt hatte, da sie mir mütterlich beistand, zu Gott emporzusteigen und zu Gott zu werden, da sie auch mein ganzes Leben beeinflussen sollte? Wie kam es, daß ihr das, was ihr haben wolltet, nun, nachdem ihr es habt, verachtet? Warum zogt ihr es vor, nach denen zu verlangen, welche in der Ferne waren, statt diejenigen zu genießen, welche bei euch sind, gerade als wäre es euch lieber gewesen, unserer Einsamkeit ein Ende zu machen, statt aus ihr Profit zu ziehen. Auch ich kann mit Recht sagen: „Wir sind euch zum Überdruß geworden“, noch ehe wir verkostet und versucht wurden. Dies ist sehr seltsam.</p><p>[Forts. v. ] Nicht habt ihr uns, da wir als Fremde kamen, beherbergt, bzw. ― um vertraulicher zu reden ― nicht seid ihr mit uns beherbergt worden; nicht habt ihr auf dieses Gebot oder auf sonst etwas Rücksicht genommen. Trotzdem wir Anfänger waren, habt ihr uns nicht die Hand geboten. Nicht habt ihr uns in unserer Angst Mut gemacht. Da uns Gewalt angetan wurde, habt ihr uns nicht getröstet. Ich zögere es auszusprechen, aber es muß gesagt sein: Ihr habt unserem Feste die Festesfreude genommen. Nicht gut habt ihr uns aufgenommen. Dem Feste habt ihr Trauer beigemischt, da ihm die Hauptsache fehlte, nämlich ihr, meine Besieger; euch Lieblinge zu nennen, verbietet mir die Wahrheit. Wer sich leicht besiegen läßt, wird verachtet. Wer sich erhebt, wird geehrt; wer sich vor Gott verbeugt, wird geschmäht.</p><p>[Forts. v. ] Was zieht ihr vor? Soll ich mich von euch richten lassen oder soll ich euer Richter sein? Soll ich ein Urteil fällen oder ein Urteil entgegennehmen? Ich hoffe im Falle eines Prozesses zu gewinnen; für den Fall aber, daß ich Richter bin, hoffe ich gerecht zu urteilen. Meine Anklage lautet: Ihr beantwortet unsere Liebe nicht mit entsprechender Gegenliebe, unsere Nachgiebigkeit nicht mit Ehrung; mögt ihr auch momentan willig sein, aber ihr verbürgt euch nicht für die Zukunft, auf welche man sich gleichwohl kaum verlassen kann, mag auch zunächst jeder noch etwas warm sein. Bald habt ihr dies, bald jenes an dem alten und dem jungen Hirten auszusetzen; vor dem Alter habt ihr keine Ehrfurcht, für die Jugend keine Ermunterung.</p><p>Die Evangelien erzählen von einem glänzenden Mahle, einem tüchtigen Gastgeber, von Freunden und köstlichen Speisen anläßlich der Hochzeit des Sohnes. Der Gastgeber lädt ein, doch die Gäste kommen nicht. Da wird er unwillig und besetzt die Tafel mit Nichtgeladenen. Was sonst noch geschah, übergehe ich, weil es zu heikel ist; ich erwähne, was annehmbarer ist. Wir wünschen nicht, daß es euch ergeht wie jenen Geladenen, wiewohl ihr euch ― warum soll ich mich milde ausdrücken? ― gegen mich noch hochmütiger und kühner benommen habt als jene, welche, obwohl geladen, das Mahl verschmähten und den Gastgeber beschimpften. Denn ihr gehört nicht zu denen, die man herbeiholen mußte, nicht zu den Hochzeitsgästen; ihr seid vielmehr selbst unsere Gastgeber, da ihr uns zu dieser heiligen Tafel gezogen und uns den Glanz der Hochzeit gezeigt habt. Trotzdem aber habt ihr uns in eurem Edelmute verlassen, und ist der eine auf seinen Acker, der andere zu seinem neuen Joch Ochsen, dieser zu seinem jungen Weibe, jener zu irgendeinem unbedeutenden Geschäfte fortgegangen. So habt ihr die Hochzeit und den Bräutigam verachtet.</p><p>[Forts. v. ] Ich wurde daher sehr erbittert und kam in große Verlegenheit. Ich verschweige nämlich nicht, was ich erfahren mußte. Wenig fehlte, und ich hätte meine Rede, meine schönste und wertvollste Gabe, mein Hochzeitsgeschenk, zurückbehalten; wenig fehlte, und ich hätte euch, nach denen ich mich gesehnt hatte, angegriffen, nachdem ich nun einmal vergewaltigt war. So Herrliches ließ sich sagen. Dazu hatte Begeisterung die Zunge belebt. Wird aber Begeisterung durch unerwartete Kränkung schmerzlich enttäuscht, dann wird sie zur Erbitterung, und nun ist es ihre Freude, heftig anzugreifen. Wenn einem von euch begeisterte Liebe einmal mit Verachtung beantwortet wurde, versteht er mein Leid und wird mir verzeihen, wenn ich in meinem Leid mich zu solchem Unmut versteige.</p><p>Doch darf ich jetzt nicht scharf gegen euch auftreten. Ich wünsche, daß es auch sonst nicht geschehe. Vielleicht habe ich hiemit mehr, als es recht ist, die heilige Herde, die trefflichen Schafe Christi, das göttliche Erbe getadelt, durch das du, wenn du auch arm wärest, reich bist. Auf dich passen wohl die Worte: „Das Los fiel dir auf Herrliches; herrlich ist dein Erbe.“ Stark bevölkerte Städte, große Herden, kommen an Reichtum uns nicht gleich, die wir zu den wenigen des letzten Stammes der Söhne Israels, zur mindesten unter den Tausendschaften Judas, zur kleinen Stadt Bethlehem gehören, in der Christus geboren worden ist und jetzt wie am Anfange richtig erkannt und verehrt wird. Bei uns wird der Vater geehrt, der Sohn ihm gleich geachtet, der Heilige Geist zugleich mit diesen verherrlicht. Wir sind ein Herz und ein Sinn. Wir beeinträchtigen die Dreifaltigkeit nicht; nichts fügen wir hinzu, nichts tun wir hinweg. Nicht machen wir es wie die Schlimmen, welche über die Gottheit zu Gericht sitzen und an ihr herummessen, und welche dadurch, daß sie eine Person über Gebühr erheben, das Ganze entehren und schmähen.</p><p>Wollt ihr mir einen Gefallen erweisen, ihr, mein Ackerfeld, mein Weinberg, mein Herz, bzw. das Herz unseres gemeinsamen Vaters, ihr, welche der Vater in Christus durch das Evangelium erzeugt hat, dann habet Ehrfurcht vor uns! Es ist dies billig, da wir euch allen vorgezogen haben, was ihr mit denjenigen bezeugen könnt, welche uns dieses Führeramt bzw. diesen Dienst übertragen haben. Wenn demjenigen, der mehr geliebt hat, mehr geschuldet wird, dann sollte ich die Liebe nicht messen können, zu welcher euch meine Liebe verpflichtet hat. Habet vor allem Ehrfurcht vor euch selbst, vor dem anvertrauten Ebenbilde, vor dem, der es anvertraut hat, vor den Leiden Christi, vor der daraus fließenden Hoffnung! Haltet an dem Glauben fest, den ihr empfangen habt, in dem ihr erzogen worden seid, durch den ihr erlöst werdet und der euch anvertraut ist, auch andere zu erlösen. Nicht vieler ⁬― wohl gemerkt! ― könnt ihr euch nämlich rühmen. Ihr müßt wissen, daß die Religion nicht darin besteht, daß man viel über Gott spricht, sondern daß sie eher sich im Schweigen zeigt. Wird die Zunge von der Vernunft nicht im Zaume gehalten, bringt sie die Menschen zum Falle. Glaubet, daß das Hören nie so gefährlich ist, wie das Reden, daß es daher besser ist, über Gott Unterricht zu empfangen, als zu geben! Lasset die eingehenden theologischen Untersuchungen den Predigern des Wortes! Eure Frömmigkeit soll sich weniger in Worten als in Taten äußern. Nicht so sehr durch Bewunderung des Gesetzes, als durch Beobachtung der Gesetze, sollt ihr eure Begeisterung für das Gesetz kundgeben. Fliehet die Sünde, strebet nach Tugend, lebet nach dem Geiste, wandelt im Geiste, um Erkenntnis zu gewinnen! Auf den Grund des Glaubens sollt ihr nicht Holz, Heu oder Stoppeln, nicht leichtes, am Tage, da wir durch Feuer gerichtet und gereinigt werden, rasch zerstörtes Material bauen, sondern, was bleibt und besteht, nämlich Gold, Silber, Edelsteine.</p><p>[Forts. v. ] So sollt ihr handeln. Auf solche Weise sollt ihr uns ehren, mögt ihr bei uns oder fern von uns sein, mögt ihr nach unseren Reden verlangen oder Wichtigeres zu tun haben. Trotzdem ihr mitten unter einem bösen und verkehrten Geschlechte lebt, sollt ihr zu reinen, tadellosen Kindern Gottes werden! Lasset euch nicht von den Stricken der Gottlosen umgarnen, die euch ringsum umgeben, laßt euch nicht von den Ketten eurer eigenen Sünden fesseln! Möge das Wort nicht von den Sorgen des Lebens erstickt werden, so daß ihr ohne Früchte bleibt! Wandelt den königlichen Weg, ohne nach rechts oder links abzuweichen! Laßt euch vom Geiste auf den schmalen Weg führen; er soll euch sein wie eine breite Straße! So wird es euch gut gehen, sowohl jetzt wie dereinst beim Gerichte durch Jesus Christus, unseren Herrn, dem Ehre sei in alle Ewigkeit! Amen.IV. Rede</p><h2>IV. Rede</h2><p>* IV. Rede.*</p><p><em>Erste Kampfrede</em>* wider Kaiser Julian*.</p><p>„Höret, alle Völker, merket auf, alle Bewohner des Erdkreises!“ Alle rufe ich mit feierlicher, lauter Stimme von weithin sichtbarer, zentraler Warte. Höret, Völker, Stämme, Nationen, Menschen jeden Geschlechtes und jeden Alters, Lebende und Kommende! Und damit meine Rede noch feierlicher ist, rufe ich euch alle, ihr himmlischen Kräfte, euch alle, ihr Engel, die ihr den Sturz des Tyrannen bewirkt, die ihr nicht einen Seon, König der Amorrhäer, nicht einen Og, König von Basan, die nur unbedeutende Herrscher waren und nur Israel, einen kleinen Teil der Erde, bedrängt hatten, vernichtet habt, sondern den Drachen, den Apostaten, den Hochmut der Assyrer, den gemeinsamen Widersacher und Feind aller, den weithin herrschenden Wahnsinn und Schrecken der Erde, den vielfachen Gotteslästerer.</p><p>„Höre, o Himmel, vernimm, o Erde!“ Es ist ja eine Zeit, da ich mich der gleichen Worte bedienen kann wie Isaias, der redegewaltigste unter den Propheten. Während jedoch Isaias mit diesen Worten Zeugnis gegen das widerspenstige Israel gibt, tue ich es wider einen widerspenstigen Tyrannen, der zur gerechten Strafe für seine Gottlosigkeit gestürzt wurde.</p><p>Merke auf, auch du, Seele des großen Konstantius, sofern du noch hören kannst, und merket auf, all ihr Herrscherseelen vor ihm, soweit ihr Christus geehrt habt! Obwohl des Konstantius Macht mit der Macht der Kirche Christi gewachsen war, obwohl er diese nach Kräften gefördert und im Laufe der Zeit befestigt hatte, so daß er von allen ehemaligen Kaisern ― was er nicht verdient! ― das größte Ansehen genießt, fiel vor allem er in eine Torheit, die ganz im Widerspruch mit seiner Kirchlichkeit stand. Ohne es zu merken, zog er gegen die Christen den Feind Christi groß. Darin allein war seine Humanität ungesund, daß er den schützte und zum Cäsar nahm, der zum Unglück am Leben blieb und zur Herrschaft gelangte. Wie über die Niederlage der Gottlosen und die Wiederherstellung der christlichen Kirche wird sich Konstantius wohl auch sehr über meine Rede freuen. Gott will ich aus Dankbarkeit meine Rede weihen. Sie ist reiner und heiliger als irgendein unvernünftiges Opfer; nicht gleicht sie den ungerechten Reden und Schwätzereien eines Julian, nicht den ungerechteren Opfern, deren Macht und Stärke Kraft der Sünde und sozusagen törichte Weisheit war. Denn alle Macht und Bildung dieser Welt wandelt in Finsternis und ist fern vom Licht der Wahrheit. Bezüglich ihrer Art, ihrer Vertreter, ihrer Früchte erinnert sie an „die Gräser, die rasch verdorren, an die grünen Kräuter, die früh verwelken“; sie schwindet hin mit den Vätern, die geräuschvoll zugrunde gehen und durch ihren Untergang noch berüchtigter sind als durch ihre Gottlosigkeit.</p><p>[Forts. v. ] Wenn ich nun heute ein Opfer des Lobes bringe und das unblutige Opfer der Rede weihe, wer wird mir das Publikum geben, das zur Dankesfeier paßt? Oder welche Zunge wird mit mir so einstimmen, wie ich es wünsche? Welches Ohr wird willig auf mein Wort hören? Durch das Wort gebührt dem Worte (dem Logos) besonderer Dank, zumal der Logos, mehr als über die übrigen Titel, sich über diesen Namen wegen seiner Bedeutung vor allem freut; das Wort ist es, durch das anderseits Julian wegen seiner Sünden gegen die Bildung* (λόγοι)* [logoi] Bestrafung verdient. Obwohl die Bildung allen vernünftigen Wesen gemeinsam ist, mißgönnte sie Julian, gerade als wenn er allein das Recht darauf gehabt hätte, den Christen. Er, der sich einbildete, der allervernünftigste zu sein, dachte am unvernünftigsten über die Bildung.</p><p>Denn zunächst deutete er listig das Wort Grieche, als würde es nicht eine Sprache, sondern eine Religion bezeichnen, im konfessionellen Sinne, um uns von den Wissensschätzen zu vertreiben, als hätten wir uns diebisch fremdes Eigentum angeeignet; er schien zu glauben, daß, wenn er uns von den sog. griechischen Künsten ausschließe, er eben als Grieche Vorteil davon habe. Ferner glaubte er, wir merkten es nicht, daß er uns, die wir doch tief auf jene Bildung herabschauen, ja nicht eines besonders hohen Gutes beraubte und daß er selber gerade den heidnischen Lehren mißtraute, da ihre Kraft nicht in der Erkenntnis der Wahrheit, sondern in der Form und in Bestrebungen liegt, denen sich anzuschließen uns unmöglicher ist, als Gott trotz der Zunge nicht zu lobpreisen. Wir stellen mit den anderen wie den Körper, so auch das Wort in den Dienst Gottes, sooft es notwendig ist, damit für die Wahrheit zu kämpfen. Julian mag das Verbot erlassen haben, griechische Bildung anzunehmen, die Wahrheit konnte er doch nicht in Ketten schlagen. Seine eigene Schwäche hat er verraten, den Anklagen konnte er nicht entrinnen. Daß er immer mehr zu denselben Anlaß gegeben, wußte er wohl.</p><p>Wenn Julian unsere Bildung zu verhindern suchte, so war es ein Beweis, daß er auf seine Religion und seine Bildung nicht vertraute. Er glich einem Wettkämpfer, der sich selbst den Vorzug gibt und öffentlich als der Beste ausgerufen werden will, nachdem er zuerst verboten hat, daß irgendein Kraftmensch mitkämpfe und den Kampfplatz betrete, was doch vielmehr auf Feigheit als auf Kraft schließen läßt. Der Kampfpreis wird doch über Kämpfer und nicht über Müßiggänger, über solche, welche im Vollbesitz ihrer Kraft sind, und nicht über solche, welche großenteils ihrer Kraft beraubt sind, gewonnen. Wenn du dich von vornherein vor Krieg und Kampf fürchtest, so hast du schon damit deine Niederlage bewiesen; du hast mir kampflosen Sieg gewährt, da du darnach strebtest, einem Kampf mit mir aus dem Wege zu gehen. So handelte unser weiser Kaiser und Gesetzgeber. Nichts sollte sich seiner Herrschaft entziehen. Er wollte schon zu Beginn seiner Regierung besonders durch Monopolisierung des Wissens die Torheit proklamieren lassen. Uns aber gebührt es, Gott auch für die Freiheit der Wissenschaft zu danken. Wir müssen ihm zunächst durch die üblichen Opfergaben höchste Ehre erweisen; nicht dürfen wir da Geld und Gut sparen, welches uns trotz der politischen Zeitverhältnisse durch Gottes Güte erhalten worden ist. Vor allem aber müssen wir ihn ehren durch das Wort, dieses Opfer der Gerechtigkeit, das allen Begnadeten gemeinsam ist. Doch, was ich da über Wissen und Reden gesprochen, genügt. Wir wollen nicht durch Weitschweifigkeit Zeit verlieren und den Schein erwecken, als würden wir den Zweck unserer Zusammenkunft vergessen.</p><p>Es eilt und drängt bereits zum Festspiel. Erfreut über das Geschaute lade ich zum geistigen Reigen alle ein, welche Tag und Nacht unter Fasten, Weinen und Beten um Befreiung von den drückenden Sorgen gefleht und durch die Hoffnung, die nicht zuschanden werden läßt, sich im Unglück ein probates Mittel verschafft haben. Alle lade ich ein, welche schwere Kämpfe und Mühen zu bestehen und viel unter den harten Schlägen der Zeit zu leiden gehabt haben, wodurch sie ― um ein Wort des Apostels zu gebrauchen ― der Welt, den Engeln und Menschen zum Schauspiel geworden waren, alle, welche körperlich zu leiden gehabt haben, seelisch aber unbesiegt geblieben sind, da sie in der Kraft Christi in allem standgehalten haben. Ich lade ein alle, welche sich von der sündhaften Welt und ihrer Macht losgesagt oder mit Freuden es hingenommen haben, wenn sie ihres Besitzes beraubt worden sind, alle, welche ― wie bekannt ― mit Unrecht aus ihrer Heimat vertrieben und von Mann, Weib, Eltern, Kindern ― oder wie all die kleinen Verwandtschaftsverhältnisse sonst noch heißen mögen, durch welche wir gebunden sind ― für einige Zeit getrennt worden sind, aber im Namen Christi ihre Leiden für Christus geopfert haben und nun mit Recht beten und singen können: „Menschen hast du über unsere Häupter gesetzt, durch Feuer und Wasser sind wir gegangen; doch du hast uns herausgeführt, damit wir neu aufleben.“</p><p>[Forts. v. ] Zum Feste lade ich auch die anderen ein, nämlich alle, welche zwar Gott als Herrn des Alls bekennen und insofern gesunde Anschauung vertreten, aber in die Gesetze der Vorsehung, welche oftmals in ihrer Güte aus dem Widerwärtigen das Gute schafft und das Rechte wirkt, nicht eindringen, vielmehr infolge der Armut und Leichtfertigkeit ihrer Seele über den Hochmut der Sünder in Feuer und Flamme geraten, den Frieden der Sünder, wie der Psalmist sagt, nicht ertragen und das Urteil Gottes nicht erwarten können und in der Geduld nicht bis zum Ende ausharren, alle jene, welche sich stets vom Augenblick und dem sinnlich Geschauten abhängig machen und durch diese Schrecken gegen die Wahrheit einnehmen lassen.</p><p>[Forts. v. ] Auch die Frauen, welche über die Vorgänge und das große Schauspiel dieser Welt sich entsetzt haben, lade ich ein und zwar mit den Worten des Isaias: Ihr Frauen, die ihr vom Schauspiel kommet, gehet hierher, wendet eure geistigen Augen ab vom weltlichen Irrtum, beruhiget euch und erkennet, daß Gott erhaben ist unter den Völkern, erhaben auf Erden wie stets in der Vergangenheit in allen Wundern und Taten, die er gewirkt hatte, so noch mehr in der Gegenwart.</p><p>Möchte sich unserem Chore doch auch jene Schar anschließen, welche einst mit uns Gottes Lob ehrlich und rühmlich am richtigen Platze gesungen hatte, den sie, wie ich glaube, auch bald wieder einnehmen darf. Denn was sie zur Aufgabe der Verbindung und Stellung plötzlich veranlaßt hatte, ist mir unbegreiflich; was mir aber noch mehr auffällt, ist, daß nicht einmal die gemeinsame Freude sie zurückführt. Sie besitzt nun einen eigenen Chor, dem aber Takt und Harmonie fehlt, was sie wohl selbst zugeben müssen. Die Erbitterung drängt zwar, über ihn und seine Art mich zu äußern; doch das Vertrauen hält mich zurück. Ich will das bittere Wort im Munde behalten, da ich noch Hoffnung habe. Ich will noch schonen. Lieber will ich ihrer einstigen Liebe gedenken als ihres jetzigen Hochmutes. Meine Langmut berechtigt mich später zu um so schärferem Tadel.</p><p>[Forts. v. ] Nur* einer* Richtung, nur* einer* Menschenklasse verbiete ich den Zutritt zum Feste. Ich tue es unter Tränen und Schmerzen; ich bedauere natürlich die, welche nicht zur Erkenntnis kommen, ich beklage die, welche ihren Untergang nicht einsehen. Daß ihnen diese Einsicht fehlt, ist das Schlimmste in ihrem Unglück. Gleichwohl verweigere ich denen den Zutritt, welche den Samen nicht auf harten, unerschütterlichen Felsen, sondern auf trockenen, unfruchtbaren Boden gesät haben. Es gibt nämlich solche, welche leichtsinnig und kleingläubig auf das Wort hörten. Weil sie keinen tiefen Boden hatten, keimten sie rasch, und, um bei anderen Gefallen zu finden, streckten sie sich. Schon bei kurzem feindlichem Angriff und nur etwas heißer Versuchung trockneten sie aber alsdann aus und starben ab. Es gibt aber auch solche, die noch schlimmer sind als diese und es noch mehr verdienen, von dem Feste ausgeschlossen zu werden. Es sind alle jene, welche nicht einmal auf einige Zeit der Welt und denen standhielten, die uns in schlimme Gefangenschaft schleppen und uns von dem trennen, der in die Höhe aufgefahren ist, um uns in gutem Sinne gefangenzunehmen, alle jene, deren hervorragende Schlechtigkeit und Käuflichkeit bekannt ist und die, statt etwas Widerstand zu leisten und in Drangsal und Versuchung um des Logos willen Verfolgungen auf sich zu nehmen, ihr Seelenheil als erbärmliche Wichte um zeitlichen Gewinn, um eine kleine Gefälligkeit oder Stellung verkauft haben.</p><p>Nachdem wir durch unser Wort für die Reinheit des gesamten Chores gesorgt haben, wollen wir, so gut es geht, uns körperlich und seelisch heiligen, um einstimmig und in dem einen Geiste jenes Siegeslied zu singen, das einst die Israeliten beim Untergang der Ägypter im Roten Meere angestimmt hatten unter Führung Mariens, welche die Pauke schlug: „Lasset uns dem Herrn singen; denn groß ist seine Herrlichkeit; Roß und Reiter hat er gestürzt“ nicht ins Meer. Hier muß ich vom Liede abweichen. Der Herr stürzte ihn, wohin er es in der von ihm bestimmten Weise wollte. „Er, der alles macht und ändert, verwandelt ― wie der göttliche Prophet Amos einmal in seiner Prophetie sagte ― in Morgen die Finsternis des Todes und verfinstert den Tag in Nacht.“ Wie in einem Kreise lenkt und leitet er die ganze Welt und unser Leben, mag es stürmisch sein oder nicht, mag es immer wieder wechseln und sich ändern, mag es so verlaufen oder anders. In den Augen der Vorsehung ist es fest und unbeweglich. Mag es sich auch in Gegensätzen abwickeln, die uns unverständlich sind, der Logos aber versteht sie. „Dieser stürzt Fürsten von ihren Thronen“ und „schmückt den mit einem Diadem, der es nicht vermutet.“ So lese ich nämlich in der göttlichen Schrift. „Schwachen Knien verleiht er Kraft“ und „den Arm des Sünders und Bösewichtes zerschmettert er.“ Diese Worte entnehme ich einem anderen Gesange. Ich zitiere, wie es mir das Gedächtnis gerade eingibt. Der Gesang besteht aus einer Reihe von Schriftstellen, welche mir die Lobrede liefern müssen. Wir schauen nicht nur durch Gottes Fügung die über die Zedern sich erhebende Macht des Gottlosen, sondern auch seinen völligen Untergang, wenn wir es verstehen, mit schnellem und sicherem Schritte an seiner Sünde vorüberzugehen.</p><p>Welcher Theologe wird über unser Thema entsprechend singen und erzählen? „Wer wird erzählen von der Macht des Herrn, wer wird all sein Lob verkünden?“ Wer wird der Sprache, dem Worte die Kraft geben, die in dem wunderbaren Ereignis liegt? Wer zerschlug Waffen, Schwert und Krieg? Wer hat die Häupter der Drachen im Wasser gespalten? Wer hat ihn den Völkern, an die er ausgeliefert worden war, zur Speise gegeben? Wer hat den Sturmwind in leisen Hauch verwandelt? Wer sprach zum Meere: „Schweige und verstumme!“ und: „In dir sollen zerschellen deine Wogen!“ Wer ist es, der tatsächlich sie niedergehalten hat, daß sie nicht mehr sich erhoben und brandeten? Wer ermöglichte es uns, Schlangen und Skorpione zu treten, welche nicht mehr, wie es das Fluchurteil verkündet hatte, heimlich der Ferse nachstellten, sondern offen sich aufrichteten und das Haupt erhoben, das nach dem Urteil zertreten werden soll. Wer ist es, der Gericht und Gerechtigkeit unvermutet an ihm übte? Wer ist es, der keineswegs die Rute der Sünder gelassen hat ― wenn ich ein kühnes Wort gebrauchen darf ― über dem Lose der Gerechten, bzw. ― um mich bescheidener auszudrücken ― über dem Lose derer, die Gott erkennen?</p><p>Denn nicht als Gerechte haben wir gelitten. Nur einige suchten gelegentlich als edle Kämpfer den Versucher zu beschämen. Als Sünder wurden wir vielmehr gezüchtigt. Dann aber, als wir, um vernünftiger zu werden und uns zu Gott zu bekehren, heilsam und väterlich geschlagen worden waren, fanden wir sein Erbarmen. Er wies zurecht, doch nicht aus Unwille; er hat erzogen, doch nicht im Zorne. Im einen wie im anderen Falle zeigte er seine gütige Absicht, zu mahnen und zu verzeihen. Wer ist es, der zu Gericht sitzt über die Heiden, Strafen verhängt über die Völker? „Der starke und mächtige Herr, der kriegsgewaltige Herr.“</p><p>[Forts. v. ] * Einen* Gesang weiß ich,* ein* Lied, das der Anwesenden würdig ist, das vollständig für die Gegenwart paßt und die Größe der empfangenen Wohltat ausdrückt. Isaias hat es einst gesungen: „Freuen soll sich der Himmel oben, die Wolken mögen Gerechtigkeit herabtauen; die Berge mögen jubeln und die Hügel frohlocken!“ Denn die ganze Schöpfung und die himmlischen Kräfte nehmen, wie ich glaube, an den Ereignissen Anteil. Die Schöpfung seufzt und leidet nämlich nicht nur, indem sie dem Untergang dient, mit denen, die auf Erden leben und dahingehen, deren Ende und Offenbarung erwartend, um auch selbst dereinst an der erhofften Freiheit Anteil zu erhalten; denn wider ihren Willen ist sie jetzt durch die Kraft des Schöpfers an das Elend gebunden. Die Schöpfung frohlockt und jubelt auch mit den fröhlichen Kindern Gottes.</p><p>„Darum möge“ ― wenn ich nämlich göttlicher Macht gedenke, muß ich göttlicher Worte mich bedienen ― „sich freuen und gleich der Lilie aufblühen die Wüste“, worunter ich die Kirche, die gestern und vorgestern noch eine Witwe und des Mannes beraubt zu sein schien, verstehe; freuen mögen sich alle, welche von den schlimmen, traurigen Stürmen der Gottlosigkeit bisher bedrängt worden waren! Denn der Herr erbarmte sich seines Volkes und „ließ sein Erbe nicht im Stich“. Er wirkte Wundertaten, vollzog „den alten Beschluß der Treue“, „gnädig zu sein denen, die ihn fürchten und auf sein Erbarmen hoffen“. Denn „er zerstörte eherne Tore und zerbrach eiserne Riegel“. Wenn wir auch unserer Sünden wegen gedemütigt wurden, wurden wir doch wieder gerufen und wurden wir, nachdem die Schlinge zerschnitten worden war, durch die Gnade Gottes erlöst, der uns gerufen hat und die, welche demütigen Herzens sind, tröstet.</p><p>[Forts. v. ] Wie ihr seht, flechte ich meinen Gesang aus göttlichen Worten und Gedanken. Ich darf mich doch nicht stolz mit Weltlichem schmücken und mich daran entzückt begeistern! Ich verachte alles Niedere und Gemeine. Fremdes ordne und weise ich zu Fremden. Das, was des einen Geistes ist, füge ich zusammen.</p><p>Dereinst hatte sich Gottes wunderbare Macht geoffenbart in der Entrückung Enochs, in der Himmelfahrt Elias’, in der Geschichte Noes, der selbst gerettet wurde und in kleinem Schiffe die Welt, die Samen der Völker, rettete, welche der Überschwemmung der Erde entronnen waren, damit die Erde mit frömmeren Bewohnern bevölkert werde, in der Geschichte Abrahams, der berufen, trotz des Alters wegen des Glaubens an einen anderen Samen, d. i. den verheißenen, mit einem Knaben beschenkt wurde, bereit war, seinen eigenen Sohn zu opfern, aber ein Ersatzopfer fand, ferner im auffallenden Untergang der Gottlosen, welche durch Feuer und Schwefel vertilgt wurden, in der noch auffallenderen Errettung der Frommen, in der Salzsäule, diesem Zeichen des Sieges über sündhafte Neugierde, in der Geschichte Josephs, der zwar verkauft wurde, aber Liebe fand, der Keuschheit übte, von Gott mit Weisheit ausgestattet wurde, die Freiheit erhielt, zur Herrscherwürde emporstieg und im Interesse einer besseren Lebensmittelverteilung über die Ernte verfügte, ferner in der Geschichte des Moses, der Gott schauen durfte, das Gesetz erhielt und gab, für Pharao ein Gott wurde und Israel bis zum Land der Verheißung führte, weiterhin in den zahlreichen Heimsuchungen der Ägypter und in der Befreiung derer, die mitten unter den Ägyptern in Not dahinleben mußten, im Verhalten des Meeres, das vor einem Stabe zurückwich und auf ein Wort hin wieder zusammenstürzte und das den einen auf dem Marsche zum festen Boden war, während es die anderen, seiner wahren Natur entsprechend, versenkte.</p><p>[Forts. v. ] Weiterhin hatte sich sodann Gottes wunderbare Macht geoffenbart in den zwei Wegführern, nämlich in der Wolkensäule, die bei Tag beschattete, und in der Feuersäule, die bei Nacht leuchtete; ferner in dem Brote, das in der Wüste gleich Regen fiel, und in dem Fleische, das vom Himmel gesandt wurde, wovon jenes den Bedürfnissen diente, dieses über die Bedürfnisse hinaus befriedigte, in dem Wasser, das hier aus Felsen geschlagen, dort versüßt wurde, in der Besiegung Amaleks, die durch das Gebet und die geheimnisvolle, mystische Ausstreckung der Hände erfolgte, im Stillstehen der Sonne und des Mondes und in der Zurückdämmung der Jordanfluten, im Einsturz der Mauern durch den mit Erfolg wiederholten Umzug der Priester unter Trompetenschall, im Boden und Vlies, die abwechselnd befeuchtet wurden und trocken blieben, in der Kraft der Haare, die einer Heeresmacht gleichkam, in den wenigen auserwählten Mannen, die, weil sie das Wasser schlürften, mit dem Siege betraut wurden und, obwohl klein an Zahl, doch die Überzahl von Tausenden hoffnungsfreudig besiegten. Wozu soll ich alle Wunder aufzählen, welche Christus selbst während seines segensreichen Erdenlebens und seiner Menschwerdung und nach ihm und durch ihn seine heiligen Apostel und die heiligen Diener des Wortes gewirkt haben? Wieviele Schriften und Denkmäler wissen davon zu berichten!</p><p>„Alle, die ihr Gott fürchtet, kommet hierher und höret! Ich will erzählen“, was sich nunmehr zugetragen hat, „damit es auch andere Geschlechter wissen“ und die nachfolgenden Generationen, welche Wunder Gott in seiner Kraft getan hat! Es ist zwar nun unmöglich von Julian zu erzählen, ohne zu schildern, welch große Gefahr er bedeutete, es ist ferner diese Schilderung unmöglich, wenn nicht über die Schlechtigkeit seines Charakters und darüber berichtet wird, wie sich seine Sündhaftigkeit aus ersten Anfängen zu dieser satanischen Art entwickelt hat, wie sich in kurzer Zeit seine Bosheit vermehrte wie das Gift gefährlichster Schlangen und anderer Tiere. Doch müssen wir eine vollständige Beschreibung seines traurigen Lebens Geschichtswerken überlassen. Wir haben unter den gegenwärtigen Verhältnissen keine Zeit, uns zu lange über Julian zu unterhalten. Nur einiges werden wir aus seinem reichhaltigen Leben anführen, nur auf das Wichtigste und Bekannteste eingehen. Meine Worte sollen den Nachkommen gleichsam eine mit Schandtaten beschriebene Säule sein.</p><p>Julian wurde ― was zunächst zu erwähnen ist ― von dem großen Konstantius am Leben gelassen, als dieser von seinem Vater die Herrschaft übernommen hatte. Es war damals, als das Heer gegen die Behörden zu den Waffen griff, um aus Furcht vor Reformen zu reformieren, und als durch neue Präfekten die Monarchie gesichert wurde. Obwohl Julian zugleich mit seinem Bruder wider alles Erwarten am Leben blieb, dankte er doch für das Leben weder Gott noch dem Kaiser, der ihn errettet hatte. An beiden wurde er zum Sünder: gegen den einen ersann er Abfall, gegen den anderen Aufstand.</p><p>[Forts. v. ] Beide Brüder hatten ― was vor allem gesagt werden muß ― die Ehre, auf kaiserlichem Besitz von der milden Hand des Kaisers kaiserlich gepflegt und erzogen zu werden, um als die letzten der Familie dem Throne erhalten zu bleiben. Auf solche Weise suchte Konstantius die zu Beginn seiner Regierung ergriffenen Maßnahmen in günstigeres Licht zu stellen, als wären sie nicht auf seinen Wunsch hin getroffen worden; zugleich wollte er durch die Gewährung der Teilnahme an der Regierung seine Großmut zeigen; ferner wollte er seine Herrschaft durch die Berufung der beiden Brüder festigen, was mehr Güte denn Weisheit verriet.</p><p>[Forts. v. ] Da die Brüder volle Muße hatten, sofern für sie das Regieren noch Sache der Zukunft war und erst erstrebt werden mußte und für die Cäsarenwürde weder Alter noch Hoffnung reif war, ließen sie sich in den üblichen Wissenschaften unterrichten und von dem kaiserlichen Vetter in die ganze Enzyklopädie des Wissens einführen, bemühten sich aber noch mehr um unsere Philosophie und zwar nicht nur um unser Wissen, sondern auch um ein frommes, gesittetes Leben. Sie verkehrten mit den Gelehrtesten und in Kreisen, wo Wohlanständigkeit und Tugend ganz zu Hause waren. Sie traten dem Klerus bei und lasen sogar die göttliche Schrift dem Volke vor in der Überzeugung, daß es für sie nichts Ehrenvolleres gäbe wie dies, und daß Frömmigkeit der allergrößte Schmuck wäre.</p><p>Durch Errichtung kostbarster Denkmäler für Märtyrer, durch Schenkung von Weihegaben und durch all das, was sonst noch Gottesfurcht kennzeichnet, trugen sie Liebe zur Weisheit und zu Christus zur Schau. Der eine allerdings war in der Tat kirchlich gesinnt; wenn er auch von Natur hitziger war, war er doch von aufrichtiger Frömmigkeit. Der andere aber, der bedächtig war, verbarg unter dem Scheine der Frömmigkeit seine Bosheit. Zum Beweise diene ein wunderbares Ereignis, das ich nicht unerwähnt lassen darf, da es verdient, recht bekannt zu bleiben und da es viele Ungläubige zu bekehren vermag.</p><p>[Forts. v. ] Beide Brüder ließen aus erwähnter Sorge für die Märtyrer und, um sich in glänzendem Wettkampfe an Freigebigkeit zu übertreffen, unter vieler Arbeit und großem Aufwand Kirchen errichten. Doch ihr Bemühen entsprang nicht gleicher Gesinnung und gleicher Absicht. Das Unternehmen des älteren Bruders gedieh und schritt planmäßig vorwärts; denn Gott gab ihm gerne den Segen wie dem Opfer Abels, das richtig dargebracht und geteilt worden war. Der Segen war gewissermaßen die Weihe des Erstgeborenen. Das Unternehmen des anderen aber hat der Gott der Märtyrer gleich dem Opfer Kains verschmäht. O, schon auf Erden wird über die Gottlosen eine Strafe verhängt, welche das Los im Jenseits bestätigt und durch kleine Andeutungen Gewaltiges prophezeit.</p><p>Julian bemühte sich, aber die Erde erschütterte, was er mit Mühe baute. Und als Julian erst recht nicht nachließ, weigerte sich die Erde, (nur schon) das von dem Elenden gelegte Fundament für kirchliche Zwecke anzunehmen. Sie verkündete die Erschütterung, die von ihm ausgehen sollte, und ehrte die Märtyrer durch Beschämung des Gottlosen. Dieses Ereignis wies hin auf den von ihm später eingeschlagenen Weg der Despotie und des Wahnsinnes, auf dem er die Märtyrer entehrte und die heiligen Gebäude schändete. Andere merkten den Hinweis nicht, aber den Verfolger verfolgte er schon früh, um ihm die Früchte seiner Gottlosigkeit zu zeigen.</p><p>[Forts. v. ] Die Seele mag es verstehen, Unrecht zu tun, aber dem eigenen Schicksal kann sie nicht entrinnen! Gott ist es, der die Zukunft verkündet, um das Unrecht zu vernichten und sein Vorherwissen zu bekunden! Ein unglaubliches oder eher ein wahres als ein unglaubliches Wunder war es! Diese Bruderliebe der Märtyrer! Sie wollten sich nicht von dem, der viele Märtyrer entehren sollte, ehren lassen, kein Geschenk aus der Hand dessen annehmen, der viele für den Kampf bestimmen oder vielmehr sie sogar um den Kampf beneiden sollte. Oder ― um mich richtiger auszudrücken ― sie wollten nicht die einzigen von den Märtyrern sein, welche geschändet werden, während andere von heiligen Händen bestattet und geehrt werden sollten. Nicht wollten sie es dem Sophisten der Bosheit gewähren, daß er sich ihrer Schändung rühme. Nicht sollten von ein und derselben Hand, welche den Märtyrern Denkmäler errichtet, solche auch wieder zerstört werden. Nicht sollten die einen Märtyrer geehrt werden, während die anderen entehrt werden. Nicht sollte unmittelbar vor der wahren Mißachtung scheinbare Achtung vorhergehen. Nicht sollte sich Julian infolge der Größe seiner Überhebung etwas einbilden und nicht sollte er infolge des Scheinmanövers glauben, so wenig wie die Menschen merke es Gott, der doch das tiefstblickende und weiseste Wesen ist und die Weisen in ihrer Arglist fängt. Er sollte erkennen, daß er erkannt ist, und sollte, weil ertappt, vor Überhebung bewahrt bleiben.</p><p>Wenn auch der Gott der Märtyrer aus ihm bekannten Gründen, in seiner unaussprechlichen Regentenweisheit, in der er auch die Amorrhäer ihre Sünden vollenden ließ, die Gottlosigkeit nicht verhindert und die heimlich ersonnene Bosheit nicht sofort wie einen bösen Ausfluß ausgetrocknet und gehemmt hatte, so mußte doch die Schlechtigkeit gehaßt und die Ehrung um der Menge willen abgewiesen und gezeigt werden, daß Gott bezüglich aller Opfer in gleicher Weise Reinheit fordert.</p><p>[Forts. v. ] Wenn Gott zum sündhaften Israel sagte: „Wenn ihr Weizenbrote opfert, so hilft es nichts; Rauchopfer ist mir ein Greuel.“, wenn er ihre Neumonde, ihre Sabbate und den großen Tag nicht annahm, da er in seinem Reichtum auch nicht der geringsten menschlichen Geschenke bedurfte und darum nicht unwürdiger Opfergaben sich zu freuen brauchte, wenn er das Opfer des Sünders, selbst wenn es ein Kalb gewesen wäre, wie einen geopferten Hund verabscheute und Weihrauch wie Gotteslästerung und Buhlerinnenlohn aus dem Tempel weist und verbannt, wenn er nur das Opfer achtet, das reine Hände und hoher, heiliger Sinn dem Heiligsten darbringen, ist es dann zu verwundern, daß er auch die Ehrung nicht annahm, welche Julian böswillig und in schlimmer Absicht ihm erwiesen hatte? Denn Gott achtet nicht auf das, worauf Menschen achten. Er sieht nicht auf das Äußere, sondern auf das, was im Menschen verborgen ist, auf die geheimen Werkstätten böser oder guter Handlungen. So verhält sich die Sache. Wenn aber einer meinem Berichte nicht glauben will, berufen wir uns auf Augenzeugen. Es sind deren viele, welche uns das erwähnte wunderbare Ereignis erzählt haben und es ihren Nachkommen erzählen werden.</p><p>Als sie zum Mannesalter bereits herangereift waren und die philosophischen Lehren kosteten ― was sie nie hätten tun sollen! ― und die Redekunst sich aneigneten, welche für die Ehrlichen eine Waffe der Tugend, für die Nichtswürdigen dagegen ein Stachel der Sünde ist, konnte Julian nicht mehr seinen ganzen krankhaften Zustand verbergen und seine gottlose Arglist nur für sich ganz allein ersinnen. Wie das unter einer Masse schlummernde Feuer, ehe es noch zu heller Flamme emporsteigt, von einzelnen Funken oder von Rauch in seiner Tiefe verraten wird, oder ― wenn dir ein anderes Beispiel lieber ist ― wie Quellen, die in Höhlen brausend sprudeln, an vielen Stellen des Bodens, weil sie keinen Raum haben und keinen freien Ausgang finden, unter unterirdischem Gurgeln Blasen aufsteigen lassen, von der brausenden Macht emporgetrieben, von der darüber liegenden Last aber niedergehalten und gehemmt, so hat Julian zwar mit Rücksicht auf die Zeitverhältnisse unter der Zucht des Kaisers seine ganze Gottlosigkeit zurückgehalten; es wäre ja noch nicht opportun gewesen, die Gottlosigkeit offen zu zeigen. Aber denen, die mehr Verständnis für Gottlosigkeit als für Weisheit hatten, offenbarte er bisweilen seine geheimen Pläne. Er offenbarte sie in den Reden an seinen Bruder, in welchen er mehr, als es recht war, für die Hellenen eiferte; angeblich allerdings wollte er sich in den Anfängen der Redekunst üben, tatsächlich aber übte er sich im Kampfe gegen die Wahrheit. Ferner offenbarte er seine geheimen Pläne in der Freude an all dem, was den Gottlosen charakterisiert.</p><p>Während die Güte des Kaisers den Bruder (Gallus) zum Cäsar erwählte und ihm einen nicht geringen Teil des Erdkreises überließ, gab er dem Julian Gelegenheit, recht frei und ungebunden sich den gefährlichsten Lehren und Lehrern hinzugeben; zur Schule der Gottlosigkeit wurde ihm Asien, das der Astrologie, Wahrsagerei und der diesen folgenden Zauberei huldigt. Eines fehlte noch der Gottlosigkeit Julians: die Herrschaft. Es dauerte nicht lange, und die Herrschaft über uns wurde ihm geschenkt von der sehr verdorbenen Volksmasse, aber auch von uns Christen infolge unseres Wohlergehens, das sozusagen den Gipfel erreicht hatte und zu umstürzlerischen Veränderungen geneigt ist, infolge unserer Freiheit, unserer höfischen Gesinnung und unseres Überflusses, der uns über die Schnur hauen ließ.</p><p>[Forts. v. ] Es scheint tatsächlich schwieriger zu sein, das Gute zu bewahren, als es erst zu erwerben. Und leichter scheint es für einen Schlauen zu sein, ein entschwundenes Glück zurückzurufen, als es im Besitze zu erhalten. „Vor dem Falle kommt die Überhebung“, sagen mit Recht die Sprüche, „und vor dem Ruhme die Erniedrigung.“ Oder ― um mich deutlicher auszudrücken, der Überhebung folgt der Fall, der Erniedrigung der Ruhm. Denn „der Herr widersteht den Hochmütigen, den Demütigen aber gibt er seine Gnade.“ Er, der alles gerecht verteilt, vergilt mit Gegensätzen. In Erkenntnis dieser Wahrheit erklärt David seine Verdemütigung als ein Glück und dankt dem, der ihn verdemütigte, weil er ihn dadurch seine Satzungen gelehrt habe. „Ehe ich verdemütigt wurde, sagt er, habe ich gesündigt; daher beobachte ich dein Gebot.“ Zwischen Sünde und Erhöhung setzt er die Verdemütigung; denn sie ersteht aus jener und bewirkt diese. Die Sünde ist die Mutter der Erniedrigung, die Erniedrigung aber ist die Mutter der Bekehrung. Durch unsere Ehrlichkeit und Bescheidenheit waren wir hoch gekommen und hatten wir uns allmählich vermehrt, so daß wir durch Gottes Fügung damals zu Macht und Ansehen gelangt waren. Als wir aber fett wurden, schlugen wir aus, und als wir in die Breite gingen, kamen wir in Not. Die Ehre und die Macht, welche wir in Verfolgungen und Drangsalen erworben hatten, haben wir im Glück verloren, wie sich im folgenden zeigen wird.</p><p>Des Cäsaren (Gallus) Herrschaft und Leben haben ihr Ende gefunden. Was sich bis dahin zugetragen hatte, will ich mit Rücksicht auf den, der das Schicksal veranlaßte, und den, der ihm erlag, verschweigen. Wenn ich auch ihre kirchliche Gesinnung anerkenne, kann ich doch ihre Verwegenheit nicht loben. Da sie als Menschen notwendig Sünder waren, kann man sie als solche gewiß nicht preisen; wir könnten allerdings auch in diesem Falle den einen in dem Punkte freisprechen, in welchem wir den anderen verurteilen. Sofort wird Julian Nachfolger seines Bruders in der Regierung, nicht aber in seiner religiösen Betätigung. Bald übernimmt er auch das Erbe dessen, der ihn teils freiwillig, teils ― nach einer für die ganze Welt schlimmen und verderblichen Niederlage ― vom Tode gezwungen zum Herrscher gemacht hatte.</p><p>Was hast du, erlauchtester, christlichster Kaiser, da angestellt? Als würdest du vor mir stehen und mich anhören, so will ich dich rügen, selbst wenn ich wüßte, daß du bei Gott weilst und Erbe der himmlischen Glorie bist und die Herrschaft nur gewechselt hast, und daß du also viel zu gut daran bist, um von mir getadelt werden zu können. Was für einen Plan hast du da gefaßt, obwohl du doch alle an Verständnis und Geistesschärfe weit übertrafst, nicht nur die, welche zu deiner Zeit regierten, sondern auch deine Vorgänger! Du hast die ringsum wohnenden Barbaren niedergeworfen und im eigenen Lande bald durch Worte, bald mit Waffen die Großen in deine Hand gebracht; die einen rangst du so leicht nieder, als wärest du gar nicht (zugleich) von der anderen Seite belästigt worden. Große Siege hast du mit Waffen im Kampfe erworben, noch größer und glänzender aber sind die, welche du ohne Blutvergießen errungen hast. Von allen Seiten kamen zu dir Gesandtschaften und Bittsteller. Die einen waren dir Untertan, die anderen erklärten sich zum Gehorsam bereit. Alle die, welche du erst zu unterwerfen hofftest, waren schon so gut wie unterworfen. Gottes Hand hat dich in allen Plänen und Taten geführt. Dein Geist wurde mehr angestaunt als deine Tatkraft, deine Tatkraft aber auch wieder mehr als dein Geist. Deine religiöse Gesinnung steht aber noch höher als das, was Geist und Hände geschaffen haben.</p><p>[Forts. v. ] Wie war es möglich, daß du in dem einen Punkt von deinem Geist und Scharfblick verlassen wurdest? Wie konnte deine Güte rasch ungut werden? Welcher Dämon hatte dich betört? Wie konntest du das große Erbe, den Schatz der Väter ― nämlich die Christen ―, das überall auf dem Erdkreis leuchtende Geschlecht, das königliche Priestertum, das unter vielen Mühen und vielen Schweißtropfen sich emporgearbeitet hatte, so rasch, in kurzem Augenblick, dem gemeingefährlichen Manne ausliefern?</p><p>[Forts. v. ] Vielleicht glaubt ihr, Brüder, daß ich nicht recht verfahre und daß meine Worte unvernünftig sind, weil ich nicht mit der Anklage (gegen Konstantius) sogleich einen Bericht über die tatsächlichen Verhältnisse verbinde. Doch meine Anklage ist auch schon eine Verteidigung, wenn ihr nur auf die Anklagen aufgepaßt habt; die Anklage enthält in diesem Falle schon die Freisprechung. Ich sprach ja doch von der Güte des Konstantius, habe ihn also verteidigt. Wer sollte selbst von denen, die ihn nur einigermaßen gekannt haben, nicht wissen, daß er um der Kirche willen und aus Liebe und lauter Wohlwollen zu uns nicht nur Julian und die Ehrung durch das ganze Menschengeschlecht und die Vermehrung seines Reiches außer acht gelassen hätte, ja daß er für unsere Sicherheit und unser Heil ohne Mühe selbst sein Reich und all seinen Besitz und sogar sein Leben, das Kostbarste, was es für den Menschen gibt, hingegeben hätte.</p><p>Niemand hat je für etwas mit so heißer Liebe gewirkt wie Konstantius für die Ausbreitung, Ehre und Macht des Christentums. Nicht die Unterjochung der Völker, nicht die treffliche Ordnung des Staatswesens, nicht der finanzielle Reichtum, nicht die Fülle von Ruhm, nicht die Ehre, Kaiser zu sein und Kaiser zu heißen, nicht all das, was sonst noch das Glück der Menschen ausmacht, nichts von all dem hat ihn so erfreut wie die Tatsache, daß wir durch ihn und er durch uns bei Gott und den Menschen in Ehren stehen und daß unsere Herrschaft für alle Zeit gefestigt ist. Da er tiefer und aristokratischer als die meisten dachte, wußte er auch genau, daß die Macht der Römer mit der der Christen wuchs und daß erst durch das Erscheinen Christi sich das Reich zur vollständigen Alleinherrschaft entwickelt hatte. Wohl vor allem deshalb hat er uns sein Wohlwollen gezeigt. Mag er uns auch gekränkt haben, so tat er es doch nicht, um uns zu verachten oder zu schmähen oder um andere zu bevorzugen, sondern um eine Union zu erzielen und die Trennung und Spaltungen zu beseitigen.</p><p>Doch, wie gesagt, die Einfalt ist nicht auf der Hut, und Güte und Schwäche gehen Hand in Hand. Und wer frei von Bosheit ist, vermutet am wenigsten Bosheit. Daher wurde, was bevorstand, nicht erkannt und die Verstellung nicht aufgedeckt; daher drang die Gottlosigkeit allmählich vor und begegnete sich zweierlei Wohlwollen: das Wohlwollen gegen die Gottesfürchtigen und das Wohlwollen gegen den Schlimmsten und Gottlosesten unter allen. Was konnte Julian den Christen vorwerfen, was konnte er an unserer Kirche aussetzen, oder was war für ihn das Imponierende und Unangreifbare in den heidnischen Lehren, oder welches war sein großes Vorbild, daß er sich zum Berüchtigsten auf dem Boden der Gottlosigkeit machte und sich in unerhörter Weise mit dem zerkriegte, der ihn zum Herrscher ernannt hatte? Da er diesen an Tugend und Vorzügen nicht übertreffen konnte, suchte er auf entgegengesetztem Wege etwas zu werden, nämlich durch ungestümen Kampf gegen Gott und durch sein emsiges Wirken für die Sünde.</p><p>Hiemit habe ich vor Christen des Konstantius Verhalten gegenüber den Christen verteidigt und zwar auf gerechte Weise, wie jeder einsieht, der noch Verstand hat.</p><p>[Forts. v. ] Da nun manche uns in genannter Beziehung recht geben, aber insofern nicht, als sie es als Torheit bezeichnen, daß Konstantius einem so erbitterten, zu Kampf gereizten Manne die Herrschaft übertragen, ihn zuerst zum Feinde gemacht und hernach ihn mit Gewalt ausgestattet hatte, indem er nämlich durch Ermordung des Bruders die Feindschaft veranlaßt, durch die Cäsarenwürde die Macht anvertraut hatte, muß ich mich auch hierüber noch kurz äußern, um zu zeigen, daß des Konstantius Güte durchaus nicht töricht war, daß sie fürstlichen Sinn und Vorsicht verriet. Schämen würde ich mich, wenn ich von ihm solche Ehre empfangen hätte, aber trotz Kenntnis seiner hervorragenden Frömmigkeit ihm die gebührende Ehre versagen würde. Schulden wir als Diener des Wortes und der Wahrheit dieselbe doch auch denen, die uns nichts Gutes getan haben! Wir schulden die Ehre nach dem Tode (des Wohltäters), da wir nicht mehr dem Verdachte der Schmeichelei ausgesetzt sind und die Rede nicht mehr beargwöhnt werden kann.</p><p>Wer hätte nicht gehofft, den Julian schließlich wenigstens noch durch Ehrenerweisungen milder und auf Grund des Vertrauens, das ihm wider Gebühr geschenkt worden ist, gerechter zu machen? Es war ein gerechtes und königliches Urteil, das den einen bestrafte und den anderen emporkommen ließ. Der, welcher den jüngeren Bruder in einer Weise ehrte, wie es niemand, selbst nicht der Geehrte, erwartet hatte, konnte selbstverständlich den älteren Bruder nicht ohne gerechten Zorn gestraft haben. Im einen Fall zeigte sich die Voreiligkeit des Gallus, im anderen Fall, in der Ehrung, die Güte des Konstantius.</p><p>[Forts. v. ] Konstantius konnte ― um einen noch triftigeren Grund anzuführen ― das Wagnis nicht so sehr riskieren, weil er dem Julian Vertrauen schenkte, als mit Rücksicht auf seine eigene Macht. Im Vertrauen auf seine eigene Macht hatte wohl auch Alexander der Große es riskiert, dem besiegten Porus nicht nur das Leben zu lassen, und zwar obwohl dieser so tatkräftig für sein Reich gekämpft hatte, sondern ihm auch das Reich der Inder zurückzugeben. Gerade auf solche Weise wollte er seine ritterliche Gesinnung bekunden; durch sie von einem anderen übertroffen zu werden, hätte ein Alexander für schlimmer gehalten als eine Niederlage im Felde. Er hatte es ja in seiner Gewalt, ihn im Falle einer Auflehnung sich zu unterwerfen. Im Vertrauen und Wagen zeigte sich seine Güte.</p><p>[Forts. v. ] Wozu streite ich noch für eine Sache, welche sich vollständig zu meinen Gunsten entschieden hat? Denn wenn der, welcher das Vertrauen schenkte, ein Verbrecher wäre, muß es nicht noch mehr der sein, dem das Vertrauen geschenkt wurde? Und wenn der, welcher den Charakter nicht durchschaut, schuldig gesprochen werden muß, wer ist denn dann des Vergehens selbst zu beschuldigen? Wahrlich, die Sünde ist unberechenbar, und die Verbrecher lassen sich nicht bessern. Das, was gerechterweise Julian hätte zur Einsicht bringen und den Brand der Leidenschaft hätte ersticken sollen, entfachte ja noch mehr seinen Haß und weckte das Verlangen, sich an dem zu rächen, der sein Wohltäter war.</p><p>Seine Lehrer waren die Anhänger Platos und Chrysipps, sowie die berühmte Peripatetikerschule und die angesehene Stoa und die schöngeistigen Schwätzer. Ferner beeinflußten ihn die Geometrie mit ihrer Anschauung über Gleichheit, die Lehren über Gerechtigkeit und der Grundsatz: „Es ist notwendig, daß man lieber Unrecht leidet, als Unrecht tut.“ Er lernte von vornehmen Lehrern und von Beamten und Gesetzgebern seines Reiches, die er sich von den Straßenecken und aus Löchern geholt hatte, und die er nicht wegen ihres Charakters pries, sondern wegen ihrer schönen Phrasen bewunderte, ja vielleicht nicht einmal deswegen, sondern nur wegen ihrer Gottlosigkeit, welche er nicht zur Lehrerin, sondern zur tüchtigen Gehilfin für seine Unternehmungen brauchte.</p><p>Man darf doch nicht jene bewundern, welche nur mit Worten Staaten gründen, sie aber nicht verwirklichen können, sich vor hohen Tyrannen fast niederwerfen und sich vor einem Obolus tiefer verbeugen als vor den Göttern, und jene, welche teils lehren, es gebe überhaupt keinen Gott, teils die göttliche Vorsehung leugnen und welche alles vom blinden Zufall oder von Sternen und von den dem Zwange unterworfenen, von irgendeiner unbekannten Person und Kraft geleiteten Formen abhängen lassen, und jene, welche annehmen, alles strebe nach sinnlichen Freuden und diese seien der Zweck des menschlichen Lebens. Nur ein schönes Wort ist ihnen die Tugend, deren Wert nicht über dieses Leben hinausreiche. Es gebe ferner über dieses Leben kein Gericht, das das Unrecht später bestrafe. Entweder war jeder jener Weisen ohne Verstand, blieb sozusagen im tiefen Schmutze und in lichtloser Finsternis des Irrtums und der Unwissenheit stecken, war nicht einmal so weit geistig geläutert, um (nur) die Strahlen der Wahrheit zu schauen, war vom Irdischen und Sinnlichen befleckt und unfähig, über die Dämonen sich zu erheben und des Schöpfers würdig, emporzusteigen. Oder aber, wenn einer noch etwas tiefer blickte, nahm er wohl die Vernunft, nicht aber Gott zum Führer und ließ sich vom Rationalismus leiten, welcher den meisten entsprach und sie daher mehr anzog.</p><p>[Forts. v. ] Ist es zu verwundern, wenn einer, der solche Lehren genossen hat und von solchen Lehrern erzogen worden ist, sich gegen den, der ihm Vertrauen schenkte und ihn durch Ehren auszeichnete, trotz des Vertrauens und trotz der Ehren so schlimm benommen hat? Wenn man auch selbst in der Anklage die Entschuldigungen nicht vergessen darf, so glaube ich doch, daß seine Angriffe auf die bestehende Ordnung und sein Kampf für Ungebundenheit und Verwegenheit nicht so sehr auf seinen Schmerz über seinen Bruder, in dem er wegen seines Bekenntnisses seinen Feind erblickte, zurückzuführen sind, als vielmehr auf seine Erbitterung über die Macht der Christen und auf seinen Haß gegen die Religion. Nach der Lehre jener Männer sollte nämlich Weltanschauung und Politik zusammenarbeiten, nicht damit die Staaten vom Unglück befreit, sondern daß sie damit erfüllt würden.</p><p>[Forts. v. ] Seine erste verwegene und kühne Tat war, sich selbst die Herrscherwürde zu übertragen und sich mit dem erhabenen Titel auszuzeichnen, der von den Zeitverhältnissen oder durch Beschluß des Kaisers oder wie früher durch das Urteil des Senates als Lohn für Tugend, nicht aber als Zufallsbeute verliehen wird; nicht hatte er es dem Herrscher überlassen, das Maß der Ehren zu bestimmen. Was war der zweite Plan Julians, dem, wie er selbst wußte, infolge seiner Tollkühnheiten die Verwegenheit bereits zur Natur geworden war? Bis zu welcher Ruchlosigkeit und Kühnheit ließ er sich hinreißen? Welcher Wahnsinn: Julian zieht gegen Konstantius zu Felde! Er bricht vom Westen her unter dem Vorwande auf, sich wegen der Herrscherwürde zu verteidigen; denn noch glaubte er, seine Verwegenheit verbergen zu können. In der Tat aber bricht er auf, um die ganze Herrschaft an sich zu ziehen und wegen seiner Rücksichtslosigkeit Bewunderung zu finden. In dieser Erwartung allerdings wurde er nicht getäuscht.</p><p>Nicht möge man ihn bewundern! (Die ihn bewundern), kennen nicht die unfaßbare Tiefe der göttlichen Gedanken, von welchen alles getragen wird, und wollen nicht die Regierung des Schöpfers anerkennen, obwohl er doch in allem weiser ist als wir und seine eigenen Pläne ganz nach seinem Belieben ausführt ― immer natürlich zum Vorteil und Wohl auch derer, welche über ihre Heilung ungehalten sind. Nicht Gottes Gedanken sind es, welche den Julian zur Sünde geführt hatten. Denn da Gott seinem Wesen nach gut ist, ist er nie für die Sünde und für den, der den Weg der Sünde sich erwählte, verantwortlich. Von seinem Vormarsch ließ sich Julian nicht abhalten. In aller Eile marschierte er durch sein eigenes Gebiet, fuhr einen Teil des barbarischen Ufers entlang und legte mehr inkognito, denn als Eroberer, die ganze Strecke zurück und rückte in die Nähe der Residenz. Nach der Ansicht seiner Freunde wurde Julian zum Feldzug ermuntert durch sein Vorherwissen und durch das Treiben der Dämonen, welche Erfolg versprachen und in die Geschichte eingreifen; nach wahren Berichten aber unternahm er ihn, da er einen geheimen, verborgenen Plan gefaßt hatte und da er nach Mord verlangte, den er selbst mit Hilfe eines vertrauten Dieners hatte vollbringen lassen. Es handelt sich also nicht um ein Vorherwissen, sondern um ein Wissen, und, was geschah, war nicht die Wohltat von Dämonen, sondern das Werk frevlerischer Gesinnung. Was von der Treffsicherheit der Dämonen in diesen Dingen zu halten ist, hat Persien deutlich gelehrt. Möge man nicht weiter mehr den raschen Aufmarsch Julians den Dämonen zuschreiben! Allerdings, die Sünde selbst müssen wir ihnen zuweisen.</p><p>Wenn nicht der Tod des Kaisers der Ankunft des Tyrannen zuvorgekommen wäre, wenn nicht der geheime Anschlag über die offene Macht gesiegt hätte, dann hätte der Elende wohl erkennen müssen, daß seine Eile zu seinem Nachteile war. Und ehe seine Verwegenheit und Torheit von den Persern gezüchtigt wurde, wäre er auf römischem Boden für seine Tollkühnheit bestraft worden. Beweis hiefür ist, daß er noch während seines Anmarsches, da er noch wähnte, unbemerkt zu sein, vom edlen Kaiser durch ein Heer umzingelt und so abgeschnitten wurde, daß eine Flucht unmöglich gewesen wäre, wie sich aus der späteren Geschichte ergeben hatte. Denn selbst als Julian bereits zur Herrschaft gekommen war, kostete es ihn keine geringe Mühe, jenes Heer niederzuwerfen. Nun mußte der, welcher über die Verwegenheit und Gottlosigkeit zugleich entrüstet war und den Weisesten (schon) in der Schlinge hatte, mitten auf dem Wege ― eine Strafe für unsere Sündhaftigkeit! ― sein Leben beenden, nachdem er vor Gott und den Menschen wiederholt seine Nachgiebigkeit gerechtfertigt und durch seinen Hingang den Christen gezeigt hatte, daß es ihm um Förderung der Religion zu tun war.</p><p>Hier mischt sich wegen dessen, was ich noch zu sagen habe, eine Träne in meine Freude; es ist, wie wenn ein Fluß sich mit dem Meere kämpfend und streitend vermischt: widerstrebend einigen sie sich. Der Hingang (des Julian) bereitet mir Freude. Was ihm aber vorherging, verursacht Tränen nicht bloß wegen der Christen und der Verfolgungen, die sie zu ertragen hatten, bzw. die ihnen der Böse geschickt hatte, und die Gott aus ihm bekannten Gründen, vielleicht auch, weil unsere Erlösung einer Erläuterung bedarf, zugelassen hatte, sondern auch wegen der Seele Julians und derer, die von ihm ins gleiche Verderben gerissen worden waren.</p><p>[Forts. v. ] Manche beklagen den Hingang und das irdische Schicksal. Es sind die, welche nur an dieses Leben glauben und sich seelisch nicht ins Jenseits zu erheben vermögen und leugnen, daß es für dieses Leben ein Gericht und eine Vergeltung gibt. Sie leben wie die unvernünftigen Tiere stets nur in den Tag hinein und für den Augenblick. Irdische Behaglichkeit ist ihnen ihre einzige Seligkeit, und was dieser Behaglichkeit widerspricht, ist ihnen Unglück. Ich aber bedaure sie vor allem wegen ihres Schicksals in der anderen Welt und wegen der den Bösen bestimmten Strafe. Die schlimmste Strafe für sie ist, von Gott verstoßen zu sein.</p><p>[Forts. v. ] Soll ich den Unglücklichen nicht bedauern? Soll ich nicht die, welche nachgegeben haben, mehr beklagen als die Verfolgten? Soll ich nicht denjenigen mehr als die Überläufer zum Bösen beweinen, welcher sie hinübergezogen hat? Für die Christen ist ja das Leiden um Christi willen nichts Schlimmes, im Gegenteil, es ist das Allerbeseligendste nicht nur wegen des anderen Lebens, sondern auch wegen des Ruhmes der Offenheit und Ehrlichkeit, den sie sich in den Gefahren dieses Lebens erworben haben. Für die anderen aber ist das, was sie gelitten haben, eine Einleitung zu dem, was ihnen als Los angedroht ist. Besser wäre es für sie, auf dieser Welt länger zu leiden, als dem jenseitigen Gerichte ausgeliefert zu werden. Das Gesetz befiehlt uns, sich nicht über den Fall des Feindes zu freuen, und es verlangt Mitleid von denen, welche feststehen.</p><p>Doch kehren wir zum Thema zurück!</p><p>Wie sehr eiferte Julian für das Böse! Wie liebte er die Gottlosigkeit! Wie rasch eilte er dem Verderben zu! Woher kam dieser Christenhaß? War er doch ein Jünger Christi gewesen, vertraut mit den erhabenen Lehren der Wahrheit! Hatte er doch, was zum Heile gereicht, sowohl gehört wie gelehrt! Kaum war er zur Herrschaft gelangt, bekannte er offen seine Gottlosigkeit, gleich als hätte er sich geschämt, je Christ gewesen zu sein, oder als hätte er den Christen deswegen gezürnt, weil er mit ihnen den Namen gemeinsam gehabt hatte. Wie diejenigen, welche stolz auf sein unsagbares Beginnen sind, berichten, war der Anfang seiner Vermessenheit: Mit unheiligem Blute ― gezwungen erzähle ich es ― wäscht er seine Taufe ab, unseren Weihen setzt er abscheuliche Weihungen entgegen, ein Schwein, das sich im Schmutze wälzte, wie das Sprichwort sagt. Seine Hände entweiht er und „reinigt“ er von dem unblutigen* Opfer, durch welches wir an Christus, seinen Leiden und seiner Gottheit Anteil haben.* Unter Opfern geschlachteter Tiere errichtet er seine Herrschaft, auf schlimme Ratgeber seines schlimmen Reiches horchend.</p><p>Da ich die geschlachteten Opfertiere und den Aberglauben Julians oder ― besser gesagt ― seinen teuflischen Sinn erwähnte, weiß ich nicht, ob ich von dem allgemein erzählten Wunder schreiben soll oder ob es besser ist, den Berichten nicht zu glauben. Ich bin unschlüssig und weiß nicht zu entscheiden, da Glaubwürdiges mit Unglaubwürdigem vermischt ist. Daß einem solch neuerungssüchtigen, gottlosen Frevler ein wunderbares Zeichen gegeben wird, ist zu glauben, hat sich sogar schon wiederholt in Zeiten größter Umwälzungen bewahrheitet. Daß es auf die bekannte Weise gegeben wurde, erregt mein Erstaunen und das Staunen aller, welche wünschen und glauben, daß das Reine sich durch Reine offenbare.</p><p>[Forts. v. ] Wie nun erzählt wird, zeigte sich dem Julian, als er die Eingeweide opferte, ein gekröntes Kreuz. Den einen verursachte diese Erscheinung Schrecken und Furcht, so daß sie unsere Macht anerkannten. Dem Lehrer der Gottlosigkeit aber machte sie angeblich Mut. Er legte das Kreuz und die Krone in einer Weise aus, als wären wir völlig in die Enge getrieben gewesen. Ich selbst wundere mich über die Erscheinung. Sollte sie nicht auf Wahrheit beruhen, dann mögen die Lüfte den Bericht hierüber wegtragen! Beruht sie aber auf Wahrheit, dann wiederholte sich das, was bei der Prophezeiung Balaams, bei der wahren oder scheinbaren Beschwörung Samuels durch die Zauberin, bei der unfreiwilligen Anerkennung Jesu durch die Dämonen geschehen war. Um besser geglaubt zu werden, offenbart sich die Wahrheit durch ihre Feinde. Wohl sollte Julian auf solche Weise von seiner Gottlosigkeit abgehalten werden. Denn Gott weiß in seiner Barmherzigkeit viele und wunderbare Wege, um immer wieder auf neue Art die Menschen zu retten. Was von der Mehrzahl erzählt wird, ist auch glaubwürdig.</p><p>Julian stieg in eine der Erdschlünde hinab, welche für die meisten unzugänglich und schauerlich sind. Wäre er doch, ehe er noch in solche Sünden stürzte, zuvor gleich den Weg in die Unterwelt gegangen! Sein Begleiter war einer, der für würdig galt, in viele Erdschlünde einzutreten, ein Weiser in jenen Reichen oder vielmehr ein Sophist. Ihre Zauberei besteht nämlich auch darin, im Schattenreiche sich mit den Geistern der Unterwelt über die Zukunft zu unterhalten. Entweder haben sie besondere Freude an der Finsternis, da sie selbst Finsternis sind und der Finsternis der Sünde dienen, oder sie meiden die Zusammenkünfte mit den Frommen über der Erde, da sie in denselben den Kürzeren ziehen würden. Als Julian, der Ehrenmann, beim Vorwärtsgehen von einem Schrecken, der immer größer und furchtbarer wurde, befallen wurde ― man spricht von ungewöhnten Tönen, unangenehmen Gerüchen, feurigen Erscheinungen, von Fratzen und Possen ―, da nahm er, von dem Seltsamen gepackt, als Neuling zum Kreuze, dem alten Heilmittel, seine Zuflucht, bezeichnete sich damit gegen die Schrecken und ruft das zu Hilfe, was er verfolgt.</p><p>Noch schrecklicher ist folgendes.</p><p>[Forts. v. ] Das Kreuzzeichen wirkt, die Dämonen ergeben sich, der Schrecken schwindet. Doch was folgt? Die Sünde atmet auf, faßt wieder Mut und stürzt sich von neuem auf Julian mit den gleichen Schrecken. Wiederum wird das Kreuzzeichen gemacht und wiederum geben die Geister Ruhe. Der Myste ist in Verlegenheit. Doch der Mystagoge, der in seiner Nähe weilt, gibt wahrheitswidrig die Deutung: „Wir fürchteten uns, nicht haben wir sie vertrieben; denn der Mindere ist es, der siegt.“ So deutet er, und durch diese Erklärung gelingt es ihm, zu überreden. Nachdem er seinen Schüler Julian überredet hatte, führt er ihn in den Abgrund des Verderbens. Kein Wunder! Denn lieber hört die Sünde auf die Sünde, als daß sie sich von dem Guten beeinflussen läßt. Was nun Julian sprach, was er tat, wie er sich täuschen ließ, ehe er zurückkehrte, wissen die, welche sich aktiv und passiv daran beteiligten. Auf jeden Fall war, als er heraufstieg, seine Seele und sein Handeln verzaubert und zeigten seine rasenden Blicke, wen er verehrte. Oder vielmehr, er war von jenem Tage an, da er so böse Pläne faßte, von den Dämonen besessen. Die Zukunft zeigte es noch deutlicher. Denn nicht vergeblich sollte er hinabgestiegen sein und sich den Dämonen angeschlossen haben, was ihm allerdings von seiten derer, welche es sich zur Ehre anrechnen, Namen zu vertauschen, die Bezeichnung Enthusiast eingetragen hatte. Dies war der Anfang.</p><p>Als die Geburt seiner bösen Tat nahe war und die Verfolgung hervorzubrechen drohte, da hatte Julian, entweder, weil er das Zeug zu einem Weisen auf dem Gebiete der Sünde oder zu einem Helden auf dem Felde der Gottlosigkeit besaß, oder weil er von seinen Lehrern dazu gesalbt wurde, eingesehen, daß, wenn er den Krieg offen beginnen und sich an die Spitze der kirchenfeindlichen Bewegung stellen würde, dies nicht nur äußerst verwegen und töricht wäre, sondern auch vollständig von dem erstrebten Ziele wegführen würde, und daß gewaltsames Vorgehen uns kampfmutiger machen und uns veranlassen würde, als christliche Ehrenmänner dem Tyrannen entgegenzutreten. Edle Gesinnung liebt es, offen und ohne Furcht sich gegen die Gewalt zu wenden; sie gleicht einer Flamme, welche vom Winde angefacht wird: je stärker der Wind in sie fährt, um so mehr lodert sie empor. Dies sagte ihm nicht nur der Verstand, sondern konnte er auch auf Grund der früheren Verfolgungen wissen, welche dem Christentum mehr Ehre als Schaden brachten, da sie die Seelen in der Frömmigkeit kräftigten und sie durch die Gefahren wie ein ins Wasser gehaltenes heißes Eisen härteten. Julian hatte gemeint, daß, wenn er den Krieg mit Vorsicht führe und die Gewalt hinter schmeichelnden Worten verberge und für seine Schreckensherrschaft wie für eine Angel Lockspeisen verwende, sein Kampf vernünftig und erfolgreich zugleich sein würde.</p><p>[Forts. v. ] Julian gönnte nämlich u. a. den Kämpfern nicht die Ehre des Martyriums. Daher war sein Plan, zwar Gewalt anzuwenden, aber doch den Schein zu erwecken, als gebrauche er keine Gewalt, und uns leiden zu lassen, aber uns die Ehre zu entziehen, daß wir für Christus leiden. Wie einfältig! Zunächst meinte er, er könne den Grund unserer Verfolgung geheimhalten und die Wahrheit durch Sophisterei verbergen und es verhindern, daß wir um so mehr und um so herrlicher geehrt werden, je mehr er uns entehrte.</p><p>Sodann meinte er, daß wir aus Ruhmsucht und nicht aus Liebe zur Wahrheit uns den Gefahren unterziehen. Solche Dummheit mögen Männer wie Empedokles, Arsitäus, Empedotimus, Trophonius und ihre unglückselige Gesellschaft treiben! Empedokles hatte ausgegeben, er sei als Gott in den Krater Siziliens gegangen und habe uns verlassen, um einen besseren Platz zu erwählen, wurde aber durch seinen teuren Pantoffel, den das Feuer wieder ausgespien hatte, verraten. Nicht als Gott offenbarte er sich nach seinem menschlichen Dasein, sondern als Mensch, der nach eitlem Ruhm gestrebt hatte, nach dem Tode die philosophische Begabung verlor und nicht einmal mehr einen hausbackenen Verstand besaß. Die anderen aber hatten sich, von der gleichen krankhaften Selbstliebe ergriffen, in Höhlen versteckt, wo sie jedoch ertappt wurden, so daß nicht das heimliche Verschwinden ihnen Ehre, sondern die Unmöglichkeit, verborgen zu bleiben, ihnen Verachtung eintrug.</p><p>[Forts. v. ] Den Christen ist es lieber zu leiden, selbst wenn niemand etwas davon erfährt, denn als Sünder bei anderen angesehen zu sein. Wir reden nicht viel, um Menschen zu gefallen. All unser Verlangen ist darauf gerichtet, von Gott geehrt zu werden. Doch noch mehr: Als wahre Freunde der Weisheit und Gottes lieben wir die Vereinigung mit dem Guten, und zwar wegen des Guten selbst, nicht wegen der im Jenseits verwahrten Ehren. Wer auf der zweiten Stufe der Preiswürdigen steht, handelt um des Lohnes und der Vergeltung wegen; wer auf der dritten Stufe steht, flieht die Sünde aus Furcht vor Strafe. So ist es bei uns, was dem, der guten Willens ist, auf verschiedene Weise leicht zu beweisen wäre.</p><p>Da Julian die Christen ihres hohen Ansehens berauben wollte (― die meisten beurteilen ja den Nächsten nach ihren eigenen Leidenschaften ―), hat er es vor allem auf das abgesehen, was unser Stolz und unsere Ehre ist. Nicht offen und ehrlich wie die anderen Christenverfolger läßt er die Gottlosigkeit verkünden. Auch gibt er keineswegs kaiserliche oder doch eigenmächtige Entscheidungen gegen uns heraus; denn nicht soll sein schlimmes Unterfangen, das Volk des Erdkreises zu unterjochen und die Lehre, welche über allen Lehren erhaben ist, zu knechten, mit Glanz und Glorie einsetzen. Vielmehr verfolgt er die Kirche gar hinterlistig und niederträchtig, und in der Hetze gegen uns bedient er sich eines zweideutigen Gewebes von Erklärungen. Da er als Regent eine doppelte Aufgabe verfolgte, nämlich zu schmeicheln und zu vergewaltigen, überließ er das Unmännliche, die Knechtung, dem Demos und den Städten, weil diesen wegen ihrer mangelnden Kenntnis und wegen ihres stets unüberlegten Draufgehens Ausschreitungen leichter verziehen werden. Nicht durch Staatsgesetze schritt er ein. Dadurch, daß er Angriffe nicht verhinderte, gab er seinen Willen in ungeschriebenem Gesetze kund.</p><p>Was das Angenehmere war und der kaiserlichen Würde mehr entsprach, behält er natürlich sich selbst vor, nämlich das Schmeicheln. Aber nicht in allem wendet er es an. Denn nicht hätte das Schmeicheln ermöglicht, einem Panther das gefleckte Fell oder einem Äthiopier die schwarze Farbe, oder dem Feuer die Hitze, oder dem Teufel, der ein Mörder von Anbeginn ist, den Menschenhaß zu nehmen, oder Julian selbst die Bosheit, mit der er auf uns losstürzte. Wie nach Berichten das Chamäleon mit Leichtigkeit sich vielfach ändert und alle möglichen Farben mit Ausnahme der weißen Farbe annimmt ― den ägyptischen Sophisten Proteus, von dem die Sage erzählt, übergehe ich ―, so war und wurde Julian den Christen alles mögliche, nur nicht gnädig. Ihnen gegenüber wurde seine Barmherzigkeit zur großen Unmenschlichkeit, sein Herablassen zur Gewalttätigkeit, seine Güte zur Entschuldigung für seine Grausamkeit; der Verzicht auf seine schmeichelnden Worte sollte den Schein erwecken, als würde er mit gutem Grunde zur Gewalt übergehen.</p><p>[Forts. v. ] Seine Absicht (Gewalt anzuwenden) ergibt sich daraus, daß er die Methode des Schmeichelns nur kurz anwandte, die der Gewalt aber um so rascher folgen ließ, damit wir wie gejagte Tiere entweder mit Schlingen oder auf der Verfolgung gefangen werden und auf jeden Fall vollständig in seine Gewalt kommen. Aus solchen Erwägungen und Überlegungen schlägt er den zweiten Weg (d. i. den Weg der Gewalt) ein und beginnt ganz vorsichtig, aber sehr gottlos seine Untat nach dem Brauch aller Verfolger bei seiner nächsten Umgebung und seinen Gardetruppen. Denn nicht hätte er es bei anderen Truppen versuchen können, ohne sich zuerst der eigenen versichert zu haben, wie man ja auch nicht mit einem Heere, das sich gegen den eigenen Führer auflehnt, gegen den Feind ausrücken kann.</p><p>[Forts. v. ] Daher reformierte er zuerst seinen Hofstaat indem er die einen durch Mord aus dem Wege räumen ließ, die anderen entließ und zwar nicht nur deshalb, weil sie zum Kaiser (Konstantius) hielten, sondern auch deshalb, weil sie noch mehr an dem größeren König hingen, also in zweifacher Hinsicht für ihn unbrauchbar waren. Das Heer gewann er teils persönlich, teils durch seine Offiziere. Er glaubte es leichter zu gewinnen, da es teils nach Ehren strebte, teils aus einfältigen Leuten zusammengesetzt war und da es nur ein einziges Gesetz kannte, nämlich den Willen des Cäsar.</p><p>Es war wahrlich nicht der geringste Teil des Heeres, den er sich unterworfen hatte und sich zu unterwerfen hoffte, es waren alle faulen und schwachen Elemente, die immer dem Augenblick dienten, damals und früher. Aber nicht alle gewann er für sich. Nicht zu groß war die Masse, welche zum Kampfe gegen uns an den Teufel ausgeliefert wurde, durch welchen der Verfolger wirkte. Es waren noch mehr als 7000 Mann, welche ihr Knie nicht vor Baal beugten und nicht das goldene Bild anbeteten und nicht, da sie auf die angeheftete, durch die Leiden Christi vernichtete Schlange blickten, von den Schlangen verwundet wurden. Darunter waren viele in Würden und hohen Stellungen, bei denen es besonders verständlich gewesen wäre, wenn sie aus Furcht oder Hoffnung nachgegeben hätten, ferner viele gemeine Soldaten, die nur als Zahlen gewertet wurden. Als er diese angriff, prallte er zurück wie eine ungefährliche Maschine vor einer starken Mauer. Die Aufregung über die, welche ihn verlassen hatten, war ebenso groß wie die ihn in seinem Zorne beruhigende Befriedigung über die, welche er für sich eingefangen hatte. Die Hoffnung mußte den Erfolg ersetzen.</p><p>Julian eifert nunmehr auch gegen das Legionsfeldzeichen, das mit dem Kreuze und hocherhoben das Heer geleitet und führt, das die Kraft hat, von Mühen zu befreien, und daher bei den Römern den Namen (Labarum) trägt und das alle übrigen Feldzeichen gewissermaßen beherrscht, welche mit den Bildern der Kaiser und mit ausgespannten Tüchern von verschiedener Farbe und mit verschiedenen Schriften geschmückt sind oder welche auf Lanzenspitzen zu wilden Drachen aufgeblasen und durch bunte Riemen mit gewobenen Schuppen bewegt werden, und welche einen zugleich sehr angenehmen wie schrecklichen Anblick bieten. Nachdem Julian an seinem Hofe alles nach seinem Willen durchgeführt und die Gefahren, über die er Herr zu sein glaubte, gebannt hat, geht er nunmehr in folgender Weise weiter vor.</p><p>[Forts. v. ] O Törichtester, Gottlosester, in den wichtigen Fragen Ungebildetster! Du wendest dich gegen dieses große Erbe und gegen die internationale Opfergemeinde, welche alle Länder gewonnen hat durch einfältige Worte und durch törichte Predigt, von welcher auch ihr sprechet, welche aber die Weisen besiegte, die Dämonen fesselte und sich über das Zeitliche erhob. Denn sie ist alt und neu zugleich ― eine wunderbare Erscheinung, die ihr einem eurer Götter andichtet. Im einen Fall ist sie für wenige, im anderen Fall für die Vielen bestimmt. Im einen Fall dient sie dem Schatten, im anderen Fall der Vollendung des Geheimnisses, das zur bestimmten Zeit in Kraft getreten ist. Du wendest dich gegen das große Erbe Christi. Wer bist du denn? Wo ist deine Größe, welches ist deine Herkunft? Groß ist das Erbe und nicht wird es aufhören, auch dann nicht, wenn andere noch mehr als du gegen dasselbe wüten. Immer noch wird es sich ausbreiten und wachsen. Ich glaube nämlich dem, was prophezeit worden ist, und dem, was man sehen kann. Was Gott geschaffen, hat er als Mensch sich zum Erbe genommen. Das Gesetz hat das Erbe vorgebildet, die Gnade hat es verwirklicht. Die Propheten haben dazu den Grund gelegt, die Apostel haben es zusammengefügt, die Evangelisten haben es vollendet.</p><p>Du wendest dich durch deine Befleckungen gegen das Opfer Christi, durch deine blutigen Greuel gegen das Blut, welches die Welt gereinigt hat. Krieg führst du gegen den Frieden. Deine Hand erhebst du gegen die Hand, welche für dich und durch dich durchbohrt worden ist. Deine Gaumenlust kann die Galle nicht ertragen. Dein Sieg spottet über das Kreuz, deine Ausgelassenheit über den Tod, dein revolutionärer Geist über die Auferstehung. Gegen den Märtyrer hast du nichts aufzuweisen, was an einen Blutzeugen erinnert. Als Verfolger trittst du in die Fußtapfen des Herodes, als Verräter in die des Judas, nur daß du nicht gleich diesem durch den Strick deine Reue bekundest. Als Christusmörder folgst du Pilatus nach, als Gotteshasser den Juden.</p><p>[Forts. v. ] Du hattest keine Achtung vor den Opfern, welche für Christus geschlachtet wurden. Du hattest keine Verehrung für die großen Kämpfer, für Johannes, Petrus, Paulus, Jakobus, Stephanus, Lukas, Andreas, Thekla und für alle, welche nach und vor ihnen sich um der Wahrheit willen den Gefahren unterzogen haben, für jene, welche sich mutig dem Feuer, dem Schwerte, den wilden Tieren, den Tyrannen, den angewandten wie den angedrohten Leiden entgegengestellt haben, als wären sie in fremdem Körper oder ohne Körper. Warum hielten sie stand? Um ihre Religion auch nicht mit einem Wörtchen zu verraten. Hohe Ehren und Auszeichnungen werden ihnen zuteil. Denn sie treiben die Dämonen aus und heilen Krankheiten; sie haben die Gabe, zu erscheinen und zu prophezeien. Schon von ihren Körpern geht, wenn sie berührt oder geehrt werden, die gleiche Kraft aus wie von heiligen Seelen. Schon Blutstropfen und kleine Leidensreliquien vermögen das gleiche zu wirken wie ein Körper.</p><p>Hiefür hast du keine Verehrung, sondern Verachtung. Du bewunderst dagegen den Scheiterhaufen des Herakles, den doch Mißgeschick und Weiberbosheit verschuldet hatten, bewunderst den für Gäste oder Götter zerfleischten Pelops, aus welchem die durch ihre Elfenbeinschulter berühmten Pelopiden hervorgingen, bewunderst die Verstümmlung der Phrygier, welche von Flötenspiel sich betäuben lassen, um dann geschändet zu werden. Du bewunderst als recht und billig die mystischen Kasteiungen und Verbrennungen im Mithraskult, bewunderst die Sitte der Taurier, die Fremden zu opfern, und das Opfer der trojanischen Königstochter, ferner das Blut, welches Menoikeus für die Thebaner vergossen hatte, und das Blut der später in Leuktra getöteten Töchter des Skedasus. Du lobst die spartanischen Knaben, welche gegeißelt wurden und deren Blut auf dem Altare zur Besänftigung der reinen, jungfräulichen Göttin vergossen wurde. Du ehrst den Schierlingstrank, den Sokrates genießen mußte, das Bein, an dem Epiktet gefesselt war, den Sack, in den Anaxarchus gesteckt wurde; aber ihre Philosophie war doch weniger eine sittliche Tat als vielmehr die Folge eines Zwanges. Du lobst den Kleombrotus aus Ambrakia, der seine Philosophie aus dem Buche über die Seele geschöpft hatte, ferner die Erbitterung des Pythagoras über die Bohnen und die Todesverachtung der Theano und all derer, welche etwa in den Kult und in die Lehren des Pythagoras eingeweiht sind.</p><p>Weisester, Edelster! Willst du nicht unsere vergangene Geschichte bewundern, dann bewundere wenigstens die gegenwärtige, zumal du Verständnis hast für die Selbstüberwindung von Männern wie Epaminondas und Scipio und da du selbst mit dem Heere ausrückst, mit der Menage so, wie sie sich gerade bietet, vorlieb nimmst und den Feldzug lobst, an dem der Führer selber teilnimmt. Es ist ja Pflicht eines edlen und weisen Mannes, auch die Tüchtigkeit der Feinde nicht zu verachten und den Edelmut der Gegner höher zu werten als die Verdorbenheit und Feigheit der Leibtruppen. Bei uns siehst du Menschen, die auf das Leben und die Heimat verzichten, die fast ohne Fleisch und Blut sind, aber dadurch sich Gott nähern. Du siehst Menschen, irdische und doch überirdische, welche „mit ungewaschenen Füßen auf dem Boden liegen“, wie dein Homer sagt, um damit einen seiner Helden zu ehren. Sie leben unter den Menschen, sind aber über dem menschlichen Leben erhaben. Sie sind gefesselt und doch frei; stehen unter der Regierung und sind doch ungebunden. Auf der Welt haben sie nichts; aber alles, was über der Welt ist, gehört ihnen. Sie führen ein doppeltes Leben; das eine ist verachtet, das andere erstrebenswert. Durch ihren Tod werden sie unsterblich, durch ihre Auflösung mit Gott verbunden. Liebe kennen sie nicht, wohl aber jene Liebe, die göttlich ist und frei von Leidenschaft. Sie haben die Quelle des Lichtes und genießen bereits ihre Strahlen. Sie haben englische Gesänge, Feiern, welche ganze Nächte andauern, und weilen verzückt bei ihrem Herrgott. Sie haben eine Taufe und tatsächliche Reinigung. Ihr Aufstieg und ihre Vergöttlichung hat kein Ende. Sie wohnen in Felsenhöhlen und in Himmelshöhen. Sie werden verstoßen und erhalten Throne. Sie werden entblößt und erhalten das Gewand der Unvergänglichkeit. Sie leben in der Einsamkeit, werden aber im Himmel festlich gefeiert. Sie beherrschen ihre Sinne, doch ihr Genuß ist unendlich und unbeschreiblich. Sie weinen, doch ihre Tränen sind eine Flut zur Tilgung der Sünden und eine Reinigung für die Welt. Ihre ausgestreckten Hände löschen das Feuer, besänftigen die wilden Tiere, stumpfen die Schwerter, schlagen Heere und werden ― merke es dir! ― auch deine Gottlosigkeit zur Ruhe bringen, magst du auch noch einige Zeit dich überheben und mit deinen Helden den Gottlosen spielen.</p><p>Allzu Verwegener, Todesmutiger ― wenn überhaupt einer so gewesen ist ―, mußt du nicht vor solchen Tatsachen erschrecken? Hast du davor keine Achtung? Viel geringere Achtung verdient die unersättliche Gier des weisen Gesetzgebers Solon, den das lydische Gold des Krösus verraten hatte, oder die Schönheitsliebe des Sokrates; von seiner Päderastie zu sprechen schäme ich mich, obwohl man sie zu beschönigen sucht. Geringere Achtung verdient das Schmarotzertum, welches Plato in Sizilien trieb und dessentwegen er verkauft wurde, ohne daß er aber von einem seiner Schüler oder überhaupt von einem Griechen losgekauft worden wäre, oder die Freßlust des Xenokrates, oder die witzige Mundfertigkeit, durch welche der Faßbewohner Diogenes Fremde vor Tyrannen und gewöhnliche Brote vor Kuchen im Anschluß an ein Dichterwort ausweichen ließ, oder die Philosophie des Epikur, nach welcher das sinnliche Vergnügen das einzige Gut ist. Groß war nach eurer Meinung Krates. Allerdings ist es eines Philosophen würdig, seinen Besitz für Schafweiden herzugeben, erinnert auch an das Verhalten unserer Philosophen. Allein in einer Rede tat er mit seiner Freiheit groß, als hätte er nicht die Weisheit, sondern vielmehr den Ruhm geliebt. Für groß haltet ihr den, der, als bei stürmischer Seefahrt alles über Bord geworfen wurde, dem Schicksale Dank sagte, weil es ihn zum Tragen des Philosophenmantels verdemütigte. Groß gilt euch Antisthenes, weil er, als ein ausgelassener, frecher Mensch ihm das Gesicht zerschlagen hatte, nur den Namen des Raufboldes auf seine Stirne schrieb, gleich dem Bildhauer, der den Namen der Statue einmeißelt; es sollte wohl eine recht kräftige Anklage sein. Über einen von denen, welche nicht lange vor uns gelebt haben, weißt du lobend zu berichten, daß er den ganzen Tag dagestanden sei und zur Sonne gebetet habe. Doch vielleicht hatte er gewartet, bis die Sonne (am Abend) sich der Erde nähert, um sein Gebet kurz fassen und mit Sonnenuntergang beenden zu können. Du lobst den, der in Potidäa zur Winterszeit die ganze Nacht hindurch dagestanden sei, um angestrengt zu betrachten, ohne aber in seiner Verzückung den Frost zu spüren. Du lobst die Wißbegierde des Homer anläßlich der Frage, welche die Arkader an ihn gestellt hatten, und des Aristoteles ausdauerndes Studium über die Strömungen des Euripus, weil beide ihrem Eifer durch Tod erlegen seien. Du lobst den Brunnen des Kleanthes, den „Riemen“ des Anaxagoras, die Traurigkeit des Heraklit.</p><p>Doch wie viele haben sich in solcher Weise ausgezeichnet und wie lange? Nicht bewunderst du die vielen Tausenden, welche unter uns ebenso und in noch wunderbarerer Weise wirken, und zwar während ihres ganzen Lebens und sozusagen auf dem ganzen Erdkreis, Männer wie auch Frauen, welch letztere im Wettkampf nach Männlichkeit ringen und nur in diesem Falle ihre Natur vergessen, wo es sich darum handelt, Gott durch Keuschheit und Mut zu gewinnen. Darunter sind nicht nur Leute niederen Standes, welche in Armut geboren, sich an schwere Arbeit gewöhnen mußten, sondern auch solche, die einst in sehr hohen Stellungen waren und infolge ihres Vermögens, ihrer Geburt und ihrer Macht Ansehen genossen, nun aber durch die Nachfolge Christi ungewohntes Leid übernahmen. Und wenn manche auch nicht die Kraft des Wortes besaßen, da ja die Religion nicht im Worte liegt und, wie schon einer eurer Dichter lehrte, weiser Mund kleine Erfolge bringt, so ist zu beachten, daß Vernünftigkeit und praktische Weisheit mehr Wert haben.</p><p>Doch auf all dies achtete er nicht, er dachte vielmehr nur daran, wie er seinen Dämonen, die ihn schon wiederholt verdienterweise geschlagen hatten, willfährig sein könnte. Und noch ehe er staatliche Angelegenheiten ordnete, erhob er sich gegen die Christen. Nach zwei Richtungen ging sein Kampf: gegen die Galiläer, wie er selbst spöttisch (die Christen) nannte, und gegen die Perser, die hartnäckig in ihrer Kriegsstimmung verharrten. Unsere Sache war ihm aber wichtiger und vordringlicher, so daß er den persischen Krieg dagegen nur als eitles Kinderspiel ansah. Er sprach dies zwar nicht aus, aber er verheimlichte es auch nicht. In einem Übermaße wütete er, daß er es immer und immer wieder vor allen zu erkennen gab. Der allergescheiteste und tüchtigste Staatspräsident wußte nicht einmal, daß, während mit den früheren Verfolgungen nur wenig Erschütterungen und Störungen verbunden waren, und zwar deshalb, weil unsere Lehre noch nicht in die Massen gedrungen war, die Wahrheit sich nur erst an wenige gewandt und noch nicht alles erleuchtet hatte, dagegen nunmehr, nachdem die heilsame Lehre sich ausgegossen und bei uns zu einer großen Macht entwickelt hatte, der Versuch, das Christentum umzugestalten und zu erschüttern, nichts war als eine Erschütterung des römischen Staates und eine Gefahr für die Gesamtheit und nichts anderes bedeutete, als Leiden, wie sie der äußere Feind nicht schlimmer wünschen konnte, von seiten der Christen selbst und von seiten dieser neuen, wunderbaren Philosophie und Regierung sich aufladen, der wir unser Glück verdanken und durch die wir zu diesem goldenen Geschlecht und Reich, das keine Revolution und keinen Krieg kennt, geworden sind.</p><p>Hatte Julians liberale Regierung, sein Nachlaß von Steuern und Abgaben, seine Auswahl der Beamten, sein Einschreiten gegen Diebe und, was sonst noch auf kurze Zeit und einen Moment Glück bringt und Aufsehen erregt, der Gesamtheit großen Nutzen verschaffen können? War es notwendig, daß unsere Ohren vom Lobe hierüber surrten? Haben die Aufstände des Volkes und der Städte, die Streitigkeiten unter den Familien, die häuslichen Zwistigkeiten, die ehelichen Differenzen, die alle selbstverständlich der schlimmen Tat Julians folgen mußten und tatsächlich auch reichlich gefolgt waren, ihm viel Ehre und dem Volke Sicherheit gebracht? Wer ist so sehr zu Gottlosigkeit geneigt und entbehrt so sehr des einfachsten Denkens, daß er diese Fragen mit ja beantworten möchte? Gleichwie dann, wenn in einem Körper ein oder zwei Glieder kränklich sind, doch die übrigen Teile nicht darunter leiden, sondern das Gut der Gesundheit gerade durch den größeren (gesunden) Teil erhalten bleibt, der schließlich auch jene Glieder wieder gesunden läßt, dann jedoch, wenn der größere Teil sich auflehnt und krank wird, keine Möglichkeit besteht, den ganzen Körper vor Krankheit zu bewahren, und die Gefahr nunmehr dadurch gewiß geworden ist, ebenso können in einem Staate einzelne Unpäßlichkeiten durch eine gesunde Masse abgewendet werden, während das Ganze in Gefahr ist, wenn der größere Teil leidet. In der jetzigen Zeit, da das Christentum solche Fortschritte gemacht hat, dürfte wohl auch einer, der uns von ganzer Seele haßt, dies einsehen. Allerdings, Julians Frevel verdunkelte den Verstand, so daß er auf Verfolgung sann, ob sie nur wenige oder viele traf.</p><p>[Forts. v. ] Besonders kindisch und leichtfertig und eines nur einigermaßen im Denken geschulten Mannes, geschweige denn eines Kaisers unwürdig war es, daß er in der Meinung, es würde sich, wenn er unseren Namen ändere, auch unsere Gesinnung ändern und er könne uns dadurch wie durch beschämendste Anschuldigungen beschimpfen, sofort an eine Änderung unseres Namens ging, indem er uns Galiläer statt Christen nannte und eine Verordnung erließ, welche diese Bezeichnung vorschrieb. Er gab damit deutlich zu erkennen, daß der Name Christus sehr ruhmreich und ehrenvoll ist; denn nur deshalb dachte er daran, uns desselben zu berauben. Oder aber er wählte, weil er gleich den Dämonen die Kraft des Namens fürchtete, eine ungewöhnlichere, wenig bekannte Bezeichnung.</p><p>Wir aber denken nicht daran, die Namen der Gegner zu ändern. Denn es gibt keine lächerlichere Bezeichnung, in die wir noch umändern könnten die Namen: Phalli, Ithyphalli, Melampygi, Apygi, Tragopus, ehrwürdiger Pan, der zwar nur* ein* Gott, aber aus allen möglichen Freiern hervorgegangen ist und dessen Name mit Recht zum Spotte dient. Bei den Gegnern muß der Eine und Höchste sich an vielen (Göttinnen) versündigen oder es muß der Schändlichste (Pan) von vielen erzeugt werden. Wir beneiden sie nicht um ihre Religionsgeschichte und nicht um ihre Namen. Sie mögen ihre Dummheiten genießen und auf ihre abscheulichsten Namen stolz sein! Wir wollen ihnen, wenn sie es wünschen, den Ochsenfresser und, um ihnen einen noch größeren Gefallen zu erweisen, den Dreiabendmann lassen. In dieser Zeit mußte (Herakles) erzeugt werden und wunderbarerweise mußte er selber erzeugen, und im dreizehnten Kampfe mußte er es in einer einzigen Nacht mit den 50 Töchtern des Thestius aufnehmen, um als Gott bezeichnet werden zu können. Wollten wir Christen neue Namen einführen, es gäbe für Julian viele, noch häßlichere und zugleich passendere, seinem Leben entnommene Bezeichnungen. Was stünde denn im Wege, daß wir, den Spott des Kaisers der Römer und, wie er, von Dämonen betrogen, wähnte, auch des ganzen Erdkreises erwidernd, ihn als Idolianus, Pisäus, Adonäus und Ochsenbrater, wie ihn mit Rücksicht auf reichliche Tatsachen bereits manche Liebenswürdige unter uns genannt haben, bezeichnen und ihm all die Namen erdichten und ersinnen, welche geschichtliche Tatsachen nahelegen?</p><p>Wenn der Erlöser und Herr der Welt, der das All erschaffen hat und leitet, der Sohn und das Wort des großen Vaters, der Erzieher und Hohepriester, der (mit dem Vater) auf dem Throne sitzt, der für uns, die wir sein Ebenbild entehrt haben und in Staub erniedrigt wurden und das große Geheimnis der Einigung nicht erkannt haben, sich nicht nur zur Gestalt eines Knechtes herabgelassen, sondern selbst das Kreuz bestiegen hat, um meine auf sich geladenen Sünden zu töten, als Samaritan oder, was noch viel schlimmer ist, als Teufel bezeichnet wird, so wäre es doch ganz am Platze gewesen, sich deswegen zu schämen und die Schmäher zurechtzuweisen. Denn leicht wäre es Jesus gewesen, durch Engelscharen und durch das bloße Wort sich an den Bösewichten zu rächen. Doch in aller Sanftmut und Geduld entließ er die Schmäher und weinte für die, welche ihn kreuzigten. Von uns aber meinte Julian, wir würden, wenn er unseren Namen ändert, von Schmerz ergriffen werden oder würden uns schämen oder in unserem Eifer für das Gute nachlassen und es würden uns solche Beschimpfungen mehr am Herzen liegen als Leib und Leben, welche wir um der Wahrheit willen zu verachten wissen. Solche Meinung verdient, wie gesagt, eher, daß man darüber lacht, als daß man darüber weint. Wir überlassen sie Schauspielern. Wahrlich möchten wir nicht die überbieten, welche leichtfertig auf der Bühne sich unter Schmähworten über die Ohren hauen lassen oder über die Ohren hauen.</p><p>[Forts. v. ] Besonders schlimm und verwerflich aber ist es nun, daß er, da er einerseits nicht offen überzeugen konnte, anderseits sich schämte, herrisch Gewalt anzuwenden, das Löwenfell mit dem Fuchsfell vertauschte, bzw. dem größten Unrecht den Stempel des Minos aufprägte, d. i. Gewalt unter frommen Gebärden anwandte. Wollen andere noch andere Tatsachen erzählen und niederschreiben, ich will es ihnen überlassen; denn die Rede drängt vorwärts. Um die Tragödie, bzw. Komödie jener Zeit werden sich wohl noch viele kümmern, denen es infolge ihres religiösen Standpunktes zukommen dürfte, dem Frevler mit Worten heimzuleuchten, damit diese wichtige Geschichte, die keineswegs vergessen werden darf, auch den Nachkommen überliefert werde. Um Beispiele zu geben, werde ich aus der ganzen Geschichte nur noch die eine oder andere Tatsache den intimen Julianverehrern mitteilen, damit sie einsehen, daß sie einen Mann ehren wollen, für den kein Tadel zu schlimm ist.</p><p>Wenn vielleicht auch nicht für alle, die unter einem Monarchen stehen, so besteht doch für die Römer das königliche ― auch streng beobachtete ― Gesetz, die Kaiser durch öffentliche Denkmäler zu ehren. Nicht Kränze und Diademe, nicht prachtvolle Purpurgewänder, nicht zahlreiche Lanzenträger, nicht die Masse der Untergebenen genügen ihnen zur Festigung ihrer Herrschaft. Um würdiger zu erscheinen, verlangen sie auch Anbetung. Doch Anbetung allein befriedigt sie noch nicht; sie muß in Statuen und Gemälden zum Ausdruck kommen, damit ihre Ehrung kein Ende nehme und vollkommener sei. Jeder Kaiser wünscht, daß auf diesen Bildern wieder andere Darstellungen angebracht werden. Nach den einen sollen die Bilder berühmte Städte darstellen, welche Geschenke darbringen, nach anderen Siegestaten, welche gleich einem Kranze das Haupt krönen, nach anderen die hohen Beamten in anbetender Stellung und mit den Abzeichen ihrer Würde angetan, nach anderen Jagden und Fechterfolge, nach anderen bunte Szenen besiegter, zu Füßen liegender oder erschlagener Barbaren. Denn nicht nur lieben sie die Taten, auf welche sie stolz sind, sie wünschen auch ihre Darstellung.</p><p>Was plante Julian? Welche List ersann er gegen die Christen, welche noch fester standen? Wie manche unter die Speisen Gift mischen, so verband er mit der üblichen Verehrung der Kaiser gottlose Bräuche und erhob den Götzendienst zum römischen Gesetze. Seine Bilder, auf welche er an Stelle der üblichen Darstellungen Götzen zeichnen ließ, wurden vor dem Volke, den Städten, besonders vor den Volkshäuptern aufgestellt, damit es ganz ausgeschlossen war, dem Unheil zu entrinnen. Denn entweder verehrten sie die Kaiser und zugleich die Götzen oder sie weigerten sich, die Götzen zu verehren, und entzogen, da die Verehrung sich nicht trennen ließ, auch den Kaisern die Ehre. Solcher List, dieser so schlau ersonnenen Schlinge der Kirchenfeinde sind einige entronnen, welche kirchlich besonders feststehen und im Denken besonders geschult sind. Doch hatten sie ihre bessere Schulung zu büßen. Allerdings gab man vor, sie hätten sich gegen die den Kaisern schuldige Ehrung verfehlt; tatsächlich aber hatten sie für den wahren König und für ihre Religion zu leiden. Von den unerfahrenen und einfachen Leuten aber ließen sich viele einfangen. Ihre Unwissenheit mochte sie vielleicht entschuldigen, da sie ja doch durch List auf die Seite der Kirchenfeinde hinübergezogen worden waren. Dieses Verfahren allein genügte, um das Andenken des Kaisers zu schänden. Es ist, wie ich glaube, zwischen Fürsten und Privatleuten zu unterscheiden, da ihr Ansehen verschieden ist. Einem Privatmanne kann man es noch nachsehen, wenn er hinterlistig handelt; denn wenn einem keine äußere Macht zu Verfügung steht, muß man es einem verzeihen, wenn er schlau zu sein sucht. Für einen Kaiser aber ist es nicht nur schändlich, von einer Macht besiegt zu werden, sondern, wie ich glaube, noch schmählicher und ungeziemender, wenn er seine Unternehmungen und Pläne hinterlistig verbirgt.</p><p>Dem Gesagten habe ich noch etwas beizufügen, was zwar den gleichen Geist und Willen verrät, aber doch noch viel schlimmer und gottloser ist, da das Übel noch mehr Personen erfaßt hatte. Es war ein Tag kaiserlicher Gunstbezeigung, entweder eine Jahresfeier oder ein vom Kaiser in böser Absicht speziell festgesetzter Tag. Die Militärpersonen mußten zur Entgegennahme einer ihrer Würde und ihrer Stellung entsprechenden Auszeichnung antreten. Wieder war es ein Schauspiel der Unfreiheit, wieder ein religionsfeindlicher Auftritt. Seine Unmenschlichkeit würzte Julian mit Freundlichkeit. Soldatische Unwissenheit und Habgier, oftmals Begleiter soldatischen Lebens, wurde mit Geld geködert. Julian selbst führte in seiner Pracht den Vorsitz, er feierte ein glänzendes Fest gegen die Religion; stolz war er auf seine hinterlistigen Pläne. Wohl gleich (den Zauberern) Melampus und Proteus war und wurde er alles; leicht konnte er sich verwandeln. Doch was war es denn, das sich vor ihm zugetragen hatte und das von allen Gutgesinnten, mögen sie damals dabei gewesen sein oder jetzt von dem Schauspiele hören, beklagt werden muß?</p><p>[Forts. v. ] Gold und Weihrauch lag da, Feuer brannte in der Nähe, Aufsichtspersonal stand bereit. Die Aufmachung weckte Vertrauen. Sie schien auf Befehl kaiserlicher Freigebigkeit, wie sie von alters her Brauch war und geliebt wurde, erfolgt zu sein. Was geschah nun? Man mußte Weihrauch ins Feuer legen, um vom Kaiser den Lohn des Verderbens zu empfangen — einen kleinen Lohn für schweren Dienst, für Hingabe der Seele und Verzicht auf Gottes Ehre. Welch schlimmer Dienst, welch schlimme Belohnung! Durch eine einzige List konnte das ganze Heer erkauft werden. Die, welche den ganzen Erdkreis unterwarfen, verloren wegen ein bißchen Feuer und Gold und durch ein wenig Opferduft ihren Halt, ja, was das Schlimmste ist, erkannten großenteils nicht einmal ihre eigenen Metzger. Man trat an, um Gewinn zu machen, verlor aber nach dem Gewinn sich selbst; man betete die Rechte des Kaisers an und merkte es nicht, daß man seinen Mörder anbetete. Wenn manche es aber auch merkten, es half ihnen doch nichts mehr, nachdem sie nun einmal von dem einen Übel sich hatten ergreifen lassen und ihre erste Torheit als unabänderliches Gesetz ansahen. Wie viele Tausende von Persern, wie viele Bogenschützen, wie viele Schleuderer, welche feindliche Soldaten, mochten sie auch bepanzert sein und ringsum unverwundbar erscheinen, welche mauerstürmende Widder hätten das erreichen können, was eine einzige Hand, ein einziger Augenblick, ein schlimmer Entschluß vermocht hatte?</p><p>Ich will noch eine Erzählung beifügen, die ergreifender ist als das Gesagte. Einige von denen, welche sich aus Unwissenheit hatten fangen lassen, sollen, nach diesem Vorfall nach Hause zurückgekehrt, sich mit ihren Kameraden zu Tische gesetzt haben und, als man gewohnheitsgemäß zum starken Wein übergegangen war, nun, wie wenn nichts Schlimmes vorgefallen wäre, beim Becher starken Weines unter Kreuzzeichen und Aufblick zum Himmel Christus angerufen haben. Da aber einer der Kameraden entsetzt fragte: „Wie, zuerst verleugnet ihr Christus, und nun ruft ihr ihn an?“ sollen sie außer sich vor Schrecken geantwortet haben: „Inwieferne haben wir ihn verleugnet? Welche Neuigkeit müssen wir da hören?“ Jener antwortete: „Ihr habt Weihrauch ins Feuer gelegt, womit — wie er belehrend beifügte — Christus verleugnet wurde.“ Sofort sprangen sie nun wie wahnsinnig und verrückt vom Tische auf und eilten leidenschaftlich und wütend über den Markt unter den Rufen: „Wir sind Christen, Christen! Jeder soll es hören und vor allem Gott, dem wir leben und einst sterben werden. Nicht haben wir dich belogen, Erlöser Christus, nicht haben wir unseren heiligen Glauben verleugnet. Hat die Hand gesündigt, aber die Gesinnung schloß sich ja der Tat nicht an. Der Kaiser hat uns hintergangen, doch vom Golde wurden wir nicht beschmutzt. Wir reinigen uns von der Sünde, durch Blut waschen wir uns.“ Darauf eilten sie zum Kaiser und warfen ihm siegesbewußt das Gold vor die Füße, unter den Rufen: „Nicht Geschenke haben wir erhalten, Kaiser, sondern zum Tode sind wir verurteilt worden. Nicht zu Ehren wurden wir berufen, sondern Schmach wurde uns bestimmt. Erweise deinen Soldaten den Gefallen und opfere uns Christus, dem wir allein dienen! Für das Feuer gib uns Feuer! Für die Asche mache uns zu Asche! Schlage die Hände ab, die wir sündhaft ausgestreckt haben, und die Füße, mit denen wir zur Sünde eilten! Mit Gold magst du andere ehren, welche es entgegennehmen, ohne es zu bereuen! Uns genügt Christus, der uns alles ersetzt.“ So sprachen sie und forderten zugleich die anderen auf, sie sollten den Betrug erkennen, von der Unbesonnenheit erwachen und sich mit ihrem Blute zu Christus bekenne. Der Kaiser wurde hierüber aufgebracht. Doch mied er es, sie offen hinrichten zu lassen, um sie nicht zu Märtyrern zu machen, was sie aber eigentlich schon waren. Er rächte sich an ihnen, indem er sie in die Verbannung schickte. Doch dadurch, daß er sie aus seiner schmutzigen, unheimlichen Umgebung entfernte, erwies er ihnen die größte Wohltat.</p><p>[Forts. v. ] Obwohl Julian in solch versteckter Weise vorgegangen war und in solcher Weise vielfach seine Gesinnung betätigte, so vermochte er doch, da seinem Charakter die Festigkeit eines Mannes fehlte, und er weniger das Werkzeug seiner eigenen Ideen, als vielmehr der Spielball des Teufels war, seine Absichten nicht vollständig zu verdecken und seine schlechten Geheimnisse nicht bei sich zu behalten. Gleichwie nach Erzählungen das Feuer des Ätna in dessen Schlünden verborgen ist und in seiner Tiefe gewaltsam am Überströmen entweder durch das Blasen eines gestraften Giganten oder durch sonst eine Kraft verhindert wird, gleichwie es zunächst nur furchtbar donnert und, um das Unglück anzumelden, Rauch aus dem Krater ausspeit, doch, wenn es übermächtig geworden ist und nicht mehr eingedämmt werden kann, aus dem Schoße auflodert, nach oben dringt und sich über den Krater ergießt, um in ungeahnten, furchtbaren Strömen umliegendes Gelände zu zerstören, ebenso konnte man finden, daß Julian zwar einige Zeit, sich selbst beherrschend, seine schlauen Pläne für sich behielt und über sein schlimmes Verhalten uns gegenüber hinwegtäuschte, daß er aber, sobald sein ungezähmter Zorn überbrauste, seine Schlechtigkeit nicht mehr zu verbergen vermochte, sondern als offener Verfolger in unsere göttliche und kirchliche Ordnung einbrach.</p><p>Nicht will ich von seinen gegen die kirchlichen Gebäude erlassenen Verfügungen sprechen, welche amtlich gegeben, aber privat durchgeführt wurden, nicht von der Einziehung von Weihgeschenken und Geldern, die ebensosehr aus Habsucht wie aus Gottlosigkeit erfolgte, nicht von dem Raub heiliger Gefäße durch frevelhafte Hände, nicht von den Priestern und dem Volke, welche, um für sie einzutreten, sich verhaften und foltern ließen, nicht von den blutbespritzten Geißelsäulen, die von den Geschlagenen mit Händen umringt und von ihnen umarmt wurden, nicht von den Soldaten, welche noch roher und leidenschaftlicher als ihr Befehlshaber, Stadt und Land durcheilten, gerade als hätten sie uns, und nicht die Perser, Skythen und die übrigen Barbaren zu unterwerfen gehabt. Doch davon will ich schweigen.</p><p>Wer weiß nicht von dem grausamen Vorgehen der Alexandriner? Außer vielem anderen Unfug, den sie sich mutwillig unter Mißbrauch der Zeitverhältnisse gegen uns erlaubt hatten, sollen sie als aufgeregtes, wildes Volk zu ihren Schandtaten hinzu auch noch unser Gotteshaus sowohl mit dem Blute von Opfern, wie von Menschen befleckt haben, und zwar unter Führung eines vom Kaiser protegierten Philosophen, der einzig dadurch sich einen Namen erworben hatte. Wer kennt nicht die Erhebung der Bewohner von Heliopolis? Wer kennt nicht die Ausgelassenheit der Bewohner von Gaza? Julian bewunderte und verehrte sie; in reichem Maße durften sie seine Großmut erfahren. Wem sollte das wahnsinnige Gebaren der Einwohner von Arethusa unbekannt sein? Früher wußte man allerdings nichts von ihnen; doch seitdem kennt man sich gar gut mit ihnen aus. Denn nicht nur Tüchtigkeit macht berühmt, sondern auch Bosheit, wodurch die Bösen sich ihren Ruhm streitig machen können.</p><p>Von den vielen Vorkommnissen sei jenes berichtet, das selbst bei Gottlosen Schauer erregen muß. Jene sollen nämlich heilige, von der Welt unberührte Jungfrauen, die kaum noch der Blick eines Mannes getroffen hatte, vorgeführt und entkleidet haben, um sie zunächst den schmähenden Blicken auszusetzen. Sodann sollen sie dieselben ihrer Haare beraubt und zerfleischt haben. O mein Christus, wie hätte ich es ertragen, daß du damals in Langmut zusahest! Darauf hätten die einen dieselben mit eigenen Zähnen verzehrt und ihrer Rohheit entsprechend sich mit der rohen Leber gesättigt, um hernach noch das gemeinsame, gewöhnliche Mahl einzunehmen. Andere dagegen hätten unter die noch zuckenden Eingeweide Schweinefutter getan, recht gefräßige Schweine darübergelassen und dann — ein ekelhaftes Schauspiel! — zugesehen, wie sie das Fleisch zerfetzten und mit der Gerste fraßen. Eine noch nie gesehene, unerhörte Zusammenstellung von Speisen! Julian, der schuld daran war, verdiente es, daß seine Dämonen durch diese seine Rohheit noch besser gediehen. Diese ernährte er auch mit seinem eigenen Blute und seiner eigenen Wunde. Allerdings sind elende Menschen für solche Vorgänge unempfindlich und verlieren durch ihren Mangel an Religion sogar das Denken.</p><p>Wer sollte so weltfremd sein, daß er nicht die Geschichte des bewundernswerten Markus und der Bewohner von Arethusa kennt und davon selbst noch besser zu berichten weiß? Da Markus unter der Regierung des trefflichen Konstantius auf Grund der damals den Christen eingeräumten Freiheit einen Götzentempel zerstört und viele vom heidnischen Irrtum zum christlichen Heile bekehrt hatte, und zwar sowohl infolge seines reinen Lebenswandels, als auch durch die Kraft seiner Rede, erntete er in reichlichem Maße den Zorn der Bewohner von Arethusa, vor allem aber den Zorn der Götzenfreunde. Als sich aber die Lage der Christen wieder änderte und die der Heiden sich allmählich wieder günstiger gestaltete, floh er doch nicht vor der Macht der Zeitverhältnisse. Mag das Volk auch eine Zeitlang seinen Groll niederhalten gleich dem Feuer, das in der Materie eingeschlossen ist, oder gleich einem mit Gewalt eingedämmten Strome, aber, sobald die Gelegenheit günstig ist, wird es leicht Feuer und Flamme und revoltiert gerne. Da nun Markus sah, daß das Volk sich gegen ihn wandte und daß es nichts Geringes im Schilde führte, dachte er zunächst an Flucht, jedoch nicht aus Feigheit, sondern vielmehr wegen des Gebotes, von einer Stadt zur anderen zu fliehen und den Verfolgern zu entrinnen. Mögen Christen auch noch so kühn und mutig sein, so dürfen sie doch nicht einzig an sich denken, sie müssen vielmehr auch die Verfolger schonen, dürfen nicht ihrerseits die Gefahr der Feinde vergrößern. Als jedoch Markus merkte, daß viele seinetwegen belästigt und gefangengenommen werden und viele infolge der Grausamkeit der Verfolger auch an ihrer Seele Schaden leiden, ließ ihm das Bewußtsein, daß seine eigene Sicherheit anderen Gefahr bringe, keine Ruhe, und er faßte den Plan eines echten Helden und Philosophen. Er kehrte aus seinem Verstecke zurück und lieferte sich der Willkür des Volkes aus. Er nahm es mit der bösen Zeit auf. Was fehlte damals noch an Schrecken! Was war nicht an Furchtbarem ausgedacht worden! Denn jeder ersann wieder andere Mittel für das eine Ziel der Verfolgung. Nicht einmal vor dem heldenhaften Verhalten dieses Philosophen — geschweige denn vor sonst etwas — hatten die Bedränger Achtung. Ja, sie waren gerade darüber besonders erbittert; denn seine Rückkehr hielten sie nicht für Heldenmut, sondern für Verachtung ihrer Person.</p><p>Der betagte Priester, dieser freiwillige Kämpfer, wurde mitten durch die Stadt geschleppt; alle, mit Ausnahme der Verfolger und Wüteriche, hatten wegen seines Alters, besonders aber wegen seines Lebenswandels Ehrfurcht vor ihm. Die ihn führten, gehörten jedem Alter und allen sozialen Schichten ohne Ausnahme an; alles war darunter: Männer und Weiber, Jung und Alt, Staatsmänner und Würdenträger. Diese alle hatten das eine Verlangen, sich an Ausgelassenheit gegenüber dem Greise zu übertreffen. Alle hielten es für eine religiöse Pflicht, Markus möglichst zu plagen und den greisen Helden in seinem Kampfe gegen die ganze Stadt niederzuringen. Durch die Straßen wurde er gezogen, in Kanäle geworfen. Von solchen, welche im Mithraskult mit Fug und Recht geschändet werden, wurde er an den Haaren und am ganzen Körper gezerrt, indem man zur Qual noch den Spott fügte. Von Knaben wurde er Knaben zugeschleudert. Mit Griffeln fingen sie den edlen Körper auf und trieben mit dem Unglück ihr Spiel. Seine Beine wurden bis auf die Knochen gequetscht. Durch seine Ohren wurden sehr steife, dünne Schnüre gezogen. In einem Korbe wurde er in die Höhe gezogen, dann mit Honig und Garumbrühe übergossen, so daß er untertags, als die Sonne glühte, von Wespen und Bienen zerstochen wurde. Indem die Sonne sein Fleisch ausschwitzen ließ, erwärmte sie den Wespen und Bienen die heilige — um nicht zu sagen — armselige Fleischspeise. Da nun soll — was ebenfalls überliefert zu werden verdient — Markus, zwar alt an Jahren, aber jung an Kampfesmut, ohne in den Schrecken den heiteren Sinn zu verlieren, trotz der Martern vergnügt das unvergeßliche, treffliche Wort gesprochen haben: „Wer sich selbst erhöht sieht, die anderen aber erniedrigt und unter sich, mag sich an dem Schauspiel freuen!“ Er war so erhaben über seinen Henkern und so frei von eigenen Schmerzen, als hätte er dem Schicksal eines Fremden zugeschaut und sein Erlebnis nicht als Unglück, sondern als Ehre angesehen.</p><p>Wer von denen, die noch ein wenig Gefühl und Herz haben, sollte nicht davon ergriffen werden? Doch bei jenen ließ dies weder die Zeit zu, noch das stürmische Verhalten des Kaisers, das vom Volke, den Städten und den Beamten Grausamkeit verlangte, wenn es auch die Masse, welcher die Tiefe seiner Schlechtigkeit unbekannt war, nicht wollte.</p><p>Dies waren die Leiden des starkmütigen alten Mannes. Und wofür ertrug er sie? Er wollte seinen Peinigern auch nicht eine einzige Goldmünze ausliefern. Es war klar, daß er aus religiösen Gründen sich widersetzte. Denn solange die Bewohner von Arethusa, welche den (zerstörten) Tempel sehr hoch einschätzen ließen, die ganze Summe in Gold, bzw. den Wiederaufbau des Tempels forderten, konnte man glauben, daß er sich wegen der Unmöglichkeit, den Befehl auszuführen, und nicht aus religiösen Gründen widersetzt hatte. Da er sie in kurzer Zeit durch seine Standhaftigkeit besiegte und von der Entschädigungssumme immer mehr abzog, erreichte er es schließlich, daß nur noch eine ganz kleine Summe gefordert wurde, welche sehr leicht bezahlt werden konnte. Während die eine Partei darnach rang, durch Eintreibung irgendeiner Summe zu siegen, strebte Markus darnach, durch Entrichtung keiner Summe Sieger zu bleiben. Allerdings wären viele nicht nur aus religiöser Gesinnung, sondern auch aus Hochachtung vor seiner Unbezwingbarkeit und Unbesiegbarkeit gerne bereit gewesen, eine größere Summe zusammenzusteuern. Markus zeigte damals deutlich, daß es ihm in seinem Kampfe nicht um irdische Schätze zu tun war, sondern daß er seine religiöse Gesinnung betätigen wollte.</p><p>Diejenigen, welche den Philosophen-Kaiser bewundern, mögen uns sagen, ob solches Verhalten auf Milde und Sanftmut oder aber auf Verwegenheit und Unmenschlichkeit schließen läßt. Ich glaube, daß niemand um eine gerechte, wahrheitsgemäße Antwort verlegen sein wird. Noch nicht habe ich erwähnt, daß Markus einer von denen war, welche dem Verfluchten damals, als seine Familie in Lebensgefahr war, das Leben gerettet und ihn entführt hatten. Wohl nur seinetwegen hatte Markus mit Recht solches erduldet und auch noch mehr Leiden verdient; denn er hatte dieses Ungeheuer dem ganzen Erdkreis heimlich erhalten. Der damalige Präfekt ― zwar ein Heide, doch seiner Gesinnung nach über den Heiden stehend und ein Mann, der zu den Tüchtigsten unter den berühmten Persönlichkeiten alter und neuer Zeit gehört ― soll mit Rücksicht auf das erwähnte Martyrium, ungehalten über all das, was Markus zu leiden und zu ertragen hatte, an den Kaiser das freimütige Wort gerichtet haben: „Schämen wir uns nicht, o Kaiser, daß wir hinter allen Christen so weit zurückstehen, daß wir nicht einmal einem einzigen alten Manne Herr werden konnten, trotzdem dieser alle möglichen Torturen durchzumachen hatte? Ist es nicht große Schmach, einem Manne nachgeben zu müssen, dessen Besiegung keine Kunst gewesen wäre?“ Während sich Präfekten der Tat schämten, schienen sich Kaiser derselben gerühmt zu haben. Was da die Peiniger zu erfahren hatten, war doch noch schlimmer als das, was die Gepeinigten zu erdulden hatten? Nichts Schlimmeres hätte sie doch treffen können! Dies war das Verhalten der Bewohner von Arethusa. Die Grausamkeit eines Echetos und Phalaris war noch gering im Vergleich mit der Rohheit jener, vor allem aber gegenüber dem, was Julian anriet und tat. Gewächse entstehen aus Samen, Schiffbrüche durch Winde.</p><p>Wie viel Schlimmes wäre sonst noch zu sagen! Wer könnte mir die Muße und die Sprache eines Herodot und eines Thukydides geben, daß ich die Bosheit dieses Mannes der Zukunft überliefere und daß die Geschichte seiner Zeit für die Nachwelt festgenagelt bleibt? Schweigen will ich vom Orontes und von den nächtlichen Opfern, welche unter dem Beistand des Kaisers der Fluß verbarg, voll von Leichen, ein geheimer Mörder Hier ist es am Platze, sich der Worte des Dichters (Homer) zu bedienen. Übergehen will ich auch die verborgenen, abgelegenen Orte seiner Residenz und all die Gruben, Zisternen und Kanäle, die voll von schlimmen Schätzen und Geheimnissen waren, nicht nur voll von Jünglingen und Jungfrauen, welche zu Beschwörungen und Weissagungen und zu unerlaubten Opfern verstümmelt wurden, sondern auch von solchen, die um ihres Glaubens willen gefoltert wurden. Wir wollen darüber, wenn es gut dünkt, schweigen, da er selbst in diesen Fällen kein Radikaler war und sich der Taten schämte. Dies ergibt sich daraus, daß er solche Vorgänge zu verheimlichen suchte in der Meinung, der Frevel verdiene nicht bekannt zu werden. Daß er unsere Glaubensgenossen in Cäsarea, diese edlen, religiösen Leute, so sehr verfolgte und mißhandelte, verdient vielleicht noch nicht einmal tadelnd hervorgehoben zu werden. Denn in begreiflicher Erregung für Fortuna scheint er, weil das Glück Unglück hatte, Rache genommen zu haben; man muß dem Unrecht auch einmal seine Herrschaft verzeihen.</p><p>Wer weiß nicht, daß, als ein Volk gegen die Christen wütete, viele mordete und noch mehr bedrohte, der Statthalter, welcher, den Mittelweg einschlagend, sich sowohl nach den Forderungen der Zeit richten zu müssen glaubte, als auch den Gesetzen gewisse Achtung schenkte und dementsprechend zwar viele Christen abführen ließ, aber auch manche von den Heiden bestrafte, angezeigt, vor den Kaiser geführt, seiner Ehren verlustig erklärt und abgesetzt wurde? Er entschuldigte sich unter Hinweis auf die Gesetze, nach denen er zu richten beauftragt gewesen wäre. Es hätte wenig gefehlt, daß er hingerichtet worden wäre. Schließlich aber fand er Gnade und wurde in die Verbannung geschickt. Zu bewundern ist seine Antwort; sie verrät menschlichen Sinn. „Was ist es denn Großes, ― frgt der gerechte Richter, der kein Christenverfolger war, ― wenn die Hand eines einzigen Heiden zehn Galiläer niedergemacht hat?“ War dies nicht offenkundige Rohheit? War dies nicht eine Aufforderung zur Verfolgung, die noch viel deutlicher und furchtbarer sprach als die öffentlichen Erlasse? Wie unterscheidet sich denn noch der, der den Christenverfolgern freundlich begegnet und maßvolles Verhalten den Christen gegenüber als Unrecht erklärt, von dem, der den (direkten) Befehl erläßt, gegen sie einzuschreiten? Des Kaisers Wille ist ein ungeschriebenes Gesetz, gestützt auf seine Gewalt; es hat viel mehr Kraft als geschriebene Gesetze, welche in der Macht keine Stütze finden.</p><p>Die Verehrer Julians, welche uns den neuen, freundlichen und liebenswürdigen Gott schenken wollen, wenden, um Julian von der Schuld der Verfolgung zu befreien, ein: Nicht hat Julian öffentlich bestimmt: „Die Christen müssen verfolgt werden und haben alles zu erdulden, was die Verfolger beschließen!“ Als milde Wesen sind aber doch noch niemals bezeichnet worden die Hydra, weil sie ― wenn man der Sage glauben darf ― statt eines einzigen Hauptes neun Häupter trug, oder die Chimäre von Petara, weil sie drei verschiedene Köpfe hatte, wodurch sie noch viel schrecklicher war, oder der Hadesbewohner Cerberus, weil er drei ähnliche Köpfe hatte, oder das Seeungeheuer Scylla, weil es von sechs furchtbaren Häuptern bekränzt war. Ihr Oberkörper soll allerdings angenehm und freundlich und nicht unschön gewesen sein; sie war eine Jungfrau und hatte etwas von unserer menschlichen Natur. Nur hatte sie Köpfe von Hunden und wilden Tieren; sie brachten Unheil, raubten ganze Flotten und unterschieden sich an Gefährlichkeit in nichts von der gegenüberliegenden Charybdis. Willst du die Pfeile und Steine beschuldigen statt der Bogenschützen und Schleuderer und die Hunde statt der Jäger, das Gift statt des Giftmischers, die Hörner und Krallen statt der stößigen Rinder und kratzenden Tiere? Sollen die, welche sich der Werkzeuge bedienen, ohne Verantwortung sein und keine Schuld an dem haben, was sie unternehmen? Die Einwände von Julians Verehrern verraten große Torheit; sie brauchen wahrlich einen Sophisten, der die eigenen Untaten verteidigt und durch die Macht des Wortes die Wahrheit zudeckt. Doch sich selbst wird Julian nicht vergessen machen, mag er sich hinwenden, wo er will, mag er sich geistig ändern, wie er will, mag er sich ― wie man zu sagen pflegt ― den Helm des Hades anlegen oder sich durch den Ring des Gyges und durch Drehen der Ringfassung verschwinden lassen. Im Gegenteil, je mehr er zu entrinnen und zu entfliehen sucht, um so eher wird er vor dem Richterstuhle der Wahrheit und vor allen vernünftigeren Richtern eben der Taten und Unternehmungen überführt, welche er nicht einmal selbst als recht verteidigen könnte. So hat sich seine Bosheit festgerannt; in eigenen Schlingen hat sie sich überall gefangen.</p><p>Man kann nicht sagen, daß nur seine Taten in dieser Weise kaiserlicher Würde und Majestät widersprachen, seine Absichten aber milder und edler waren. Es wäre viel wert gewesen, wenn sie nicht noch viel roher gewesen wären als die erwähnten Taten. Gleichwie die Schuppen eines Drachen, der sich in Bewegung setzt, teils schon emporstarren, teils sich erst aufrichten, teils emporstarren werden und, selbst wenn sie noch ruhig liegen, doch notwendig noch in Bewegung kommen, oder ― wenn du ein anderes Beispiel willst ― gleichwie der Blitz manches sofort entzündet, anderes aber noch im Dunklen läßt, um es zu ergreifen, sobald seine Macht sich ausgebreitet hat, so hat Julian in den einen Fällen den Frevel sofort begangen, während er ihn in anderen durch Versprechungen und Drohungen gegen uns erst andeutete. Und was er andeutete, war so ausgesucht und ungewöhnlich, daß es nur ihm einfallen konnte, solches beschließen und in die Tat umsetzen zu wollen, trotzdem es doch schon vor ihm viele Christenverfolger und Christenfeinde gegeben hatte.</p><p>Was weder Diokletian, der den Anfang in der (letzten) Christenverfolgung gemacht hatte, noch sein Nachfolger Maximinianus, der ihn noch übertraf, je ersonnen hätte, noch auch Maximinus, der erst nach jenen, aber noch mehr als sie, gegen die Christen einschritt, und an dessen Verfolgung noch öffentliche Denkmäler erinnern, die von den Foltern erzählen, an das dachte Julian, wie uns die berichten, welche in seine Geheimnisse eingeweiht waren. Allerdings wurde er an der Ausführung seiner Ideen verhindert durch Gottes Güte und durch die Tränen der Christen, die bei vielen reichlich flossen als einziges Mittel gegen den Verfolger. Was er wollte, war, daß die Christen jeglicher Freiheit beraubt und von allen Versammlungen, bürgerlichen Zusammenkünften, festlichen Akten, Gerichtsstühlen ausgeschlossen würden. Er glaubte nämlich, es gehe nicht an, daß einer sich daran beteilige, der nicht vor den aufgestellten Altären Weihrauch streut und auf solche Weise für die Beteiligung an jenen Ehren schwere Entschädigung zahlt. O ihr Gesetze, ihr Gesetzgeber, ihr Fürsten! Gleichwie der schöne Himmel, das Sonnenlicht, das Luftmeer sich in uneingeschränkter, neidloser Liebe allen mitteilt, so habt ihr allen Freien die Befugnis eingeräumt, in gleicher Weise und mit gleichem Rechte die Gesetze zu genießen. Julian jedoch hatte beabsichtigt, den Christen diese Befugnis zu nehmen, damit die, welche vergewaltigt werden, keinen Rechtsanspruch erheben können und die, welche an Hab und Gut geschädigt werden oder sonst eine unstatthafte kleinere oder größere Strafe erhalten, im Gesetze keinen Beschützer finden, sondern in Verbannung und Tod geschickt und fast des Rechtes auf Luft verlustig erklärt werden können. Solches Unrecht verschaffte den Betroffenen größere Ehre und größere Freiheit vor Gott, erhöhte dagegen die Sündhaftigkeit und Ehrlosigkeit seiner Urheber.</p><p>[Forts. v. ] Mit aller möglichen Weisheit schmückt sich die Rede dieses Mörders und Führers, dieses Gesetzesübertreters und Gesetzgebers oder — um aus unserer Schrift einen noch passenderen Ausdruck zu entnehmen ― dieses „Feindes und Rächers“. Er behauptet nämlich, unser Gesetz verbiete, Rache zu nehmen, zu prozessieren, überhaupt etwas zu besitzen und etwas als sein Eigentum zu erklären; es verlange, in einer anderen Welt zu leben und die Gegenwart zu verachten, als bestünde sie nicht. Auch sei es (darnach) nicht erlaubt, Böses mit Bösem zu vergelten und, wenn man auf die eine Wange geschlagen werde, die andere zu schonen; man müsse vielmehr auch diese dem Schlagenden anbieten. Nicht nur die Tunica, auch das Obergewand müsse man hergeben. Vielleicht wird er noch beifügen, daß unser Gesetz auch will, daß wir für die beten, welche uns Unrecht tun, und daß wir unseren Verfolgern Gutes wünschen. Er mußte diese Lehren ja genau kennen, da er einst Lektor der göttlichen Schrift war, der Ehre, an den Altarstufen zu dienen, gewürdigt wurde und ihm die Verehrung der Märtyrer an den heiligen und ehrwürdigen Stätten anvertraut war.</p><p>Vor allem wundere ich mich, daß er, der mit unseren Lehren so vertraut war, das Wort „Der Sünder wird elend zugrunde gehen“ nicht gelesen oder absichtlich übergangen hatte. Zugrunde gehen werden alle, die Gott verleugnet haben, und, was noch schlimmer ist, diejenigen verstoßen, welche ihrem Bekenntnisse treu verbleiben, und sie in Leiden stürzen, die sie selbst verdient hätten. Wenn Julian, der uns an die genannten Gesetzesvorschriften erinnert, damit wir uns nach deren Bestimmungen richten, uns zeigen kann, daß ihm selbst das Gesetz gegeben ist, ein großer Sünder zu sein, bzw. daß seine Götter Freude daran haben, und daß von den beiden verschiedenen Mächten, der Tugend und dem Laster, uns der bessere Teil bestimmt ist, ihm und den Seinigen dagegen der schlimmere zufällt, so möge er es bekennen! Sollten aber auch sie, wenn nicht infolge ihrer Taten, so doch wenigstens infolge ihrer Worte auf Rechtschaffenheit und Milde Anspruch erheben und sollten sie trotz all ihrer Schlechtigkeit und trotz ihrer Freude an sündhaften Göttern doch noch nicht so schamlos sein, daß sie erklären, die Sünde sei gewissermaßen ihr Lebensberuf, dann mögen sie dartun, warum und mit welchem Recht wir leiden und ertragen müssen, während sie nicht einmal die zu schonen brauchen, welche Barmherzigkeit üben! Möge er es sich überlegen! Als für uns die Zeit der Macht kam, dagegen für euch sich die Verhältnisse immer wieder änderten und umgestalteten, hattet ihr da je von den Christen so etwas zu ertragen, wie die Christen von euch zu erdulden hatten? Welcher Freiheit haben wir euch beraubt? Gegen wen haben wir das erhitzte Volk aufgehetzt, gegen wen übereifrige Beamte? Wen haben wir in Lebensgefahr gebracht? Wen haben wir vor allem aus Ämtern verdrängt? Haben wir, wenn Ehren den Tüchtigsten gebührten, sie darum gebracht? Um mich kurz zu fassen, haben wir irgendeinem etwas angetan, was in reichlichem Maße uns zugefügt und angedroht worden war? Ihr mögt uns Milde und Barmherzigkeit zum Vorwurf machen, doch diese Fragen könnt ihr nicht bejahen.</p><p>Weisester und verständigster Julian, der du die Christen zwingst, den Gipfel der Vollkommenheit zu besteigen, weißt du nicht, daß die einen Vorschriften unseres Gesetzes verpflichtende Kraft haben, so daß ihre Übertretung Strafe nach sich zieht, während die anderen nicht verpflichten, sondern freie Wahl lassen, so daß ihre Beobachtung zwar Ehre und Lohn einträgt, ihre Vernachlässigung aber nicht die geringste Strafe verursacht? Wenn alle vollkommen sein und den Gipfel der Tugend besteigen könnten, so wäre es das Schönste und das Beste. Da jedoch zwischen Gott und Mensch ein großer Unterschied besteht und die einen zwar an gar allen Tugenden Anteil haben, es für die anderen aber schon eine Leistung ist, wenn sie nur bis zur Mitte vordringen, warum willst du Gesetze, die nicht alle beobachten können, oder warum willst du Gesetzesübertreter und Verdammte? Wie einer, der keine Strafe verdient, nicht auch schon des öffentlichen Lobes würdig ist, so verdient nicht einer deshalb, weil er nicht des öffentlichen Lobes würdig ist, auch schon Strafe. Nicht dürfen wir über die Grenzen christlicher Lehre und menschlichen Könnens hinaus sittliche Forderungen stellen.</p><p>Wiederum muß ich von der Wissenschaft sprechen. Es ist notwendig, daß ich zu diesem Thema wiederholt zurückkehre, und daß ich nach Kräften die Wissenschaft zu unterstützen suche. Obwohl es viele furchtbare Taten sind, die Julian mit Recht Haß eingetragen haben, so scheint er doch ganz besonders wegen seines Vorgehens gegen die Wissenschaft Haß zu verdienen. Mit mir möge sich jeder über ihn entrüsten, der Freude am Wissen hat und zu den Gelehrten gehört, zu denen auch ich mich, was ich nicht leugnen will, zähle. Ich habe nämlich auf Reichtum, vornehme Verwandtschaft, Ruhm und Macht, diese irdischen Vorzüge und schattenhaften Schätze, zugunsten derer verzichtet, die darnach verlangten. Der Wissenschaft allein habe ich mich ergeben. Und wenn es Mühen zu Wasser und zu Land kostete, um Wissensschätze zu erwerben, so habe ich mich darüber nicht aufgehalten. Ich wünsche, daß in mir und in meinen Freunden das Wissen auch zur Kraft werde. Diese Kraft liebte ich und liebe ich zunächst nach dem, was das erste ist, nämlich nach Gott und nach dem, was nicht geschaut, nur gehofft wird. Wenn, wie Pindar sagt, das Eigene alles in Anspruch nimmt, dann ist es notwendig, daß ich von der Wissenschaft spreche. Es ist auch vollständig gerecht, der Wissenschaft den ihr gebührenden Dank durch das Wort abzustatten.</p><p>[Forts. v. ] Du allerleichtsinnigster und unersättlichster Julian, wie kamst du auf den Gedanken, den Christen die Bildung zu entziehen? Mit der Entziehung hast du nicht etwa gedroht, du hast sie gesetzlich gefordert. Wie kamst du dazu, was war dein Grund? Welcher Sprecher Hermes ― um deinen eigenen Ausdruck zu gebrauchen ― hat dich auf diesen Gedanken gebracht? Welche schlimmen Zauberer und dämonischen Verleumder? Wenn du willst, wollen wir den Grund angeben. Nach dem du in viele schlimme Sünden gefallen warst, solltest du schließlich auch dazu verführt werden, dir selber eine Schlinge zu legen, damit du, worin du der Verständigste sein zu müssen glaubtest, darin, ohne es zu merken, es am meisten fehlen ließest und als dumm gältest. Antworte mir: Welchen Zweck hatte deine Verfügung? Welche Bedeutung hatten deine Reformen im Bildungswesen? Schienest du in deinem Erlaß gerecht zu sein, dann wollen wir uns korrigieren und den Tadel zurücknehmen. Denn wir haben nicht nur gelernt, vernünftig zu siegen, sondern auch ehrlich nachzugeben.</p><p>Julian wendet ein: „Uns gehört Wissenschaft und Bildung, denn wir verehren die Götter. Für euch paßt Dummheit und Rohheit; euer oberster Grundsatz und eure Weisheit ist: Glaube!“ Die, welche unter euch der pythagoreischen Philosophie anhängen, würden wohl über die Glaubenspflicht nicht lachen. Denn ihr erster und wichtigster Beweis ist: „Pythagoras hat es gesagt.“ Diese Worte gelten ihnen mehr als die goldenen und selbst in Blei gegossenen Gedichte. Den in die Philosophie des Pythagoras Eingeweihten wurde, nachdem sie zuerst das viel gepriesene Silentium, um sich durch das Schweigen im mäßigen Gebrauch des Wortes zu üben, beobachtet hatten, vorgeschrieben, daß sie, wenn sie über irgendeine Lehre befragt und ausgeforscht und um einen Grund gebeten würden, nur die eine Antwort geben dürften: „Pythagoras hat es so gelehrt.“ Was ihm eingegeben wurde, sei das nicht zu bekrittelnde, nicht zu untersuchende Lehrprinzip. Mit anderen Buchstaben und anderen Worten wird durch die Erklärung: „Er hat es gesagt“, das gleiche ausgedrückt wie durch unsere Formel „Glaube!“, mögt ihr euch auch darüber lustig machen und darüber spotten. Für uns besagt die Formel, daß wir den Worten der von Gott inspirierten Männer nicht mißtrauen dürfen, daß vielmehr ihre Glaubwürdigkeit die Wahrheit ihrer Lehre garantiert, und zwar besser als jede kritische Auseinandersetzung.</p><p>Zugegeben, daß wir in dieser Beziehung Anstoß erregen, doch wie willst du dein Recht auf die Wissenschaft beweisen? Wenn du auch Anspruch darauf erhebst, aber wie kannst du in deiner Torheit bestimmen, daß wir davon ausgeschlossen sind? Wem gehört die Weisheit des Hellenisierens? Und in welchem Sinn wird das Hellenisieren verstanden? Ich will dir, da du dich ja an doppelsinnige Worte hältst, die Bedeutung des Wortes auseinanderlegen und dartun, daß wir bald durch ein und dasselbe Wort Verschiedenes, bald durch verschiedene Worte das gleiche lehren, bald auch durch verschiedene Worte Verschiedenes. Du wirst sagen, daß unter Hellenisieren bald ein Kultus, bald natürlich ein Volk und die, welche zuerst die Kraft der Sprache erfunden haben, zu verstehen sind. Nehmen wir das Wort im Sinne von Kultus, dann zeige uns, wo und bei welchen Priestern das Hellenisieren Gesetz war, so wie es Vorschrift war, gewisse Gaben gewissen Dämonen zu opfern! Nicht bestand nämlich nach euren Opferlehrern und Ceremoniaren die Vorschrift, daß alle die gleichen Opfer oder daß einer alle (verschiedene) Opfer darbrachte und daß sie auf die gleiche Weise erfolgten. Wie die Verfluchung des Ochsenfressers (Herakles) bei den Lindiern, die durch seine Beschimpfung Gott zu ehren glaubten, religiöser Brauch war, die Ermordung von Fremden bei den Tauriern, die Geißelungen am Altare bei den Lacedämoniern, die Verstümmelungen unter betäubendem Flötenklang nach erschlaffenden Tänzen bei den Phrygiern, Päderastie bei anderen, bei anderen Unzucht und ― um nicht alles aufzuzählen ― noch andere Untaten bei anderen Mysterien, war etwa ebenso auch das Hellenisieren (als Kultus) nur für gewisse Götter und Dämonen bestimmt? Wäre es eine solche Spezialität gewesen, dann könnte man, gerade weil das Gemeinsame nur einem eurer Götter und Dämonen zugeschrieben wurde, noch nicht von Hellenisieren reden; es werden ja auch die vielen Opfer, die gemeinsam sind, durch (allgemeine) Gesetze geregelt.</p><p>[Forts. v. ] Wenn du aber nicht davon reden willst, sondern meinst, auf die Sprache dürft ihr allein Anspruch erheben, und wenn du also uns von ihr ferne halten willst, als wäre sie euer väterliches Erbe, auf das wir kein Recht haben, so kann ich zunächst den Grund hiefür nicht einsehen, bzw. nicht verstehen, warum du das Hellenisieren in diesem Sinne den Dämonen zuweisest. Selbst wenn es zutreffen würde, daß die Sprachhellenisten und die Kulthellenisten ein und dieselben wären, würde doch noch nicht der Kult Anspruch auf die Wissenschaft haben, so daß wir mit Recht ausgeschlossen würden. Doch deine Annahme dünkt selbst euren Opferlehrern sehr töricht. Wenn nämlich zwei sich mit demselben Gegenstand beschäftigen, sind sie noch nicht miteinander identisch. Fällt, wenn wir annehmen würden, es wäre einer zugleich Goldarbeiter und Maler, das Goldschmelzen mit dem Malen und das Malen mit dem Goldschmelzen zusammen? Julians Behauptungen strotzen von Dummheit.</p><p>Du Freund des Hellenismus und der Weisheit, ich stelle die Frage: Willst du jede Art des Hellenisierens, also selbst diese gewöhnlichen und einfachen Worte, den Sprachgebrauch des Volkes, verbieten oder die elegante, feine Form, da sie nur der geistigen Elite zukomme? Willst du das Letztere, warum werden die Formen* σμερδαλέον, κοναβίζειν, μῶν, δήπουθεν, ἅττα, ἀμωσγέπως* [smerdaleon, konabizein, mōn, dēpouthen, hatta, amōsgepōs] im Sprachgebrauch bevorzugt, während andere in das Kynosarges verwiesen werden, wo einst die außerehelichen Kinder weilten? Wenn aber unter das Hellenisieren auch die einfache, schmucklose Rede fällt, warum verbietet ihr uns nicht auch diese und überhaupt jeden griechischen Laut, gleichviel wie er klingt und wie er gerade heißt? Dies wäre noch liebenswürdiger von euch und vollends ein Beweis eurer mangelhaften Bildung.</p><p>Die Sache verhält sich ― um dir in diesen Fragen ein tieferes und vollkommeneres Verständnis zu geben ― also. Wenn wir annehmen würden, es seien gewisse Worte, die durch die Sprachorgane ausgesprochen werden, in die Luft austreten und ins Ohr gelangen, göttlich und besser und vorzüglicher als unsere Worte, obwohl ich über die Ausdrücke* μῶλυ, Ξάνθος, Χαλκίς* [mōly, Xanthos, Chalkis] eurer ehrwürdigen Götter lachen muß, oder wenn wir annehmen würden, die Götter verkehren miteinander durch die leeren Gedanken und Zeichen, dann käme es uns nicht zu, (solche Worte und Zeichen) auszusprechen. Unsere Anschauung ist die: Die Sprache gehört nicht nur ihren Erfindern, sondern allen, die sich ihrer bedienen; eine Kunst, ein Studium gehört, wenn du ihr Erfinder sein willst, gleichwohl nicht dem Erfinder. Gleichwie vielmehr in Kunst und Musik zwar jeder Ton einer anderen Saite angehört, welcher er bald durch Anspannen, bald durch Nachgeben entlockt wird, das Ganze (als solches) aber, das zu harmonisch-schöner Einheit verbunden ist, das Werk des einen Dirigenten und Künstlers sein will, ebenso mag in unserem Falle die schaffende, gewaltige Sprache für die Termini des verschiedenen Bestrebens und Formens verschiedene Erfinder aufweisen, aber das Ganze ist es, was sie uns bietet, um uns allen, wenn wir guten Willens sind, durch das Gemeinsame und Beglückende (der Sprache) das Leben zu einen und zu veredeln.</p><p>[Forts. v. ] Hast nur du das Recht des Hellenisierens? Gib Antwort auf folgende Fragen! Stammen die Buchstaben nicht von den Phöniziern oder, wie manche meinen, von den Ägyptern oder von den Hebräern, die noch weiser als diese sind und glauben, daß Gott sein Gesetz auf eigenhändig geschriebenen Tafeln gegeben hat? Kommt von dir das* ἀττικίζειν* [attikizein]? Von wem kommt das Brettspiel, das Zählen, das Rechnen mit Fingerbreite, von wem die Maße und Gewichte und aus noch früherer Zeit die Feldherrn- und Kriegskunst? Nicht etwa von den Euböern, da ja aus Euböa Palamedes stammte, der wegen seiner vielseitigen Erfindungen Neid erregte, wegen seiner Weisheit zur Rechenschaft gezogen und von denen, die nach Ilion fuhren, verurteilt wurde? Wie nun? Wenn die Ägypter, die Phönizier und die Hebräer, von deren Bildung wir profitieren, wenn die Bewohner der Insel Euböa, deinen Grundsätzen entsprechend, auf ihre Erfindungen als ihr (alleiniges) Eigentum Anspruch erheben, was werden wir tun? Was können wir noch ihnen gegenüber geltend machen, wenn wir uns durch unser eigenes Verhalten gebunden haben? Sind wir nicht vollständig gezwungen, auf ihre Erfindungen zu verzichten und das Schicksal der Dohle zu teilen, d. h. die fremden Federn zu verlieren, um nackt und geschändet zu sein?</p><p>Stammt das Dichten von dir? Wie? Kommt es nicht von jenem alten Weibe, das ― so erzählt man sich ― von einem plötzlich entgegeneilenden Manne an der Schulter angerempelt wurde und, indem es wegen des scharfen Anpralles schimpfte, dichterische Worte sprach, welche dem jungen Manne sehr gefielen und, nachdem sie noch sorgfältiger in Versmaß gekleidet worden waren, die Grundlage für die von dir bewunderte Dichtung bildeten? Weiterhin, wenn du auf deine Waffen stolz bist, von wem, o edelster Julian, rühren die Waffen her? Nicht von den Zyklopen, welche die Schmiedkunst erfunden haben? Wenn dir aber der Purpur viel, ja das Allermeiste wert ist, weil er dich zum Weisen und irdischen Gesetzgeber macht, willst du ihn nicht den Tyriern verdanken, bei denen die Schäferhündin war, welche, weil ihre Schnauze durch das Auffressen einer Purpurschnecke blutig war, dem Hirten die Farbe verriet und dadurch euch Kaisern das stolze, den Bösen leidvolle Gewand schenkte? Was könnten wir einwenden, wenn die Athener uns Ackerbau und Weinbau verbieten, in dem sie auf eine Demeter, einen Triptolemus, die Drachen, ferner auf einen Celeus und Icarius und auf die ganze einschlägige Mythologie verweisen, aus welcher eure schändlichen, nachtechten Mysterien entstanden sind.</p><p>Um anderes beiseite zu lassen, will ich auf das übergehen, was hauptsächlich deine Verblendung und Gottverlassenheit bekundet. Wo hat dein Mysterienkult seinen Anfang genommen? Nicht etwa bei den Thraziern, wie schon der Namen lehren sollte? Ist der Opferbrauch nicht bei den Chaldäern oder den Bewohnern von Cypern zu Hause, die Astrologie bei den Babyloniern, die Geometrie bei den Ägyptern, die Magie bei den Persern? Weißt du nicht, daß die Traumdeuterei den Bewohnern von Telmissos eigen war und die Deutung des Vogelfluges nur von den Phrygiern kam, die sich zuerst mit Flug und Bewegung der Vögel abgegeben hatten? Um nicht weiter darüber zu sprechen, woher hast du jedes einzelne Können? Hat nicht jedes seinen speziellen Ursprung? Da all dies Können vereint wurde, entstand das eine Geheimnis des Aberglaubens. Sollen wir nun zugeben, daß alles den Urhebern und Erfindern zurückgestellt wird und uns nichts bleibt als unser Leid und (Julians) religiöse Reform? Denn Julian revolutionierte als erster gegen seinen christlichen Herrn gleich den Sklaven, die sich einst gegen die Skythen aufgelehnt haben sollen. Es wäre viel wert gewesen, wenn deine schlimme Macht sich auf Grund deiner Ideen und Gesetze aufgelöst hätte, damit wir uns frei gefühlt hätten und es uns vergönnt gewesen wäre, das römische Reich wieder im alten Glück und frei von allen inneren Unruhen zu sehen, welche viel gefährlicher und furchtbarer als äußere Kriege sind, wie es ja auch gefährlicher ist, das eigene Fleisch zu verzehren als fremdes Fleisch.</p><p>Sollte man meinen, in den erwähnten Fällen sei Julians Schlauheit noch zu schlicht aufgetreten und zeige noch zu wenig von seiner kaiserlichen Größe, wohlan, so will ich von noch größerer Verschlagenheit erzählen! Da Julian einsah, daß sich unsere Lehre durch ihre Grundsätze und ihre himmlischen Zeugnisse auszeichnet und daß sie alt und jung zugleich ist: alt durch die Prophezeiungen und die leuchtenden Kundgebungen Gottes, jung durch die schließliche Ankunft Gottes und durch die auf Grund derselben und ihretwegen bewirkten Wunder, dazu aber auch noch größer und erhabener durch die überlieferte und bis heute sich erhaltende Organisation der Kirche, und da er auch dieser Größe gegenüber seine Verschlagenheit bewahren wollte, was ersinnt er, was unternimmt er? Er macht es dem Assyrer Rabsakes nach, welcher für Senacherim, den König der Assyrer, ein Heer kommandierte. Als er gegen Judäa ausgezogen war, mit zahlreichen Truppen Jerusalem fest umzingelte und vor der Stadt lagerte, sie aber weder mit Gewalt erobern konnte, noch durch Verräter das, was in der Stadt war, in seine Hand gelangte, suchte er die Stadt durch schmeichelnde, einheimische (jüdische) Worte zu gewinnen. Da die Belagerten die Absicht erkannten, sollen sie sich zunächst dagegen gewehrt und gebeten haben, daß man mit ihnen syrisch und nicht hebräisch spreche; sie wollten nicht durch Schmeichelworte in Knechtschaft geraten.</p><p>Von der gleichen Gesinnung beseelt, schickte sich Julian an, in allen Städten Schulen zu errichten, Lektor-Pulte* (βήματα)* [bēmata], höhere und niedere Bänke anzubringen, das Vorlesen der hellenistischen Lehren und das Auslegen derselben einzuführen, um durch dieses moralisch zu erziehen und in den Geheimnissen zu unterrichten. Ferner suchte er dem abwechselnd verrichteten Chorgebet und kirchlichen Strafgesetzen, den Zeremonien für die Neueingetretenen und Fortgeschrittenen, kurz allem Eingang zu verschaffen, was natürlich unserer trefflichen Organisation zu verdanken ist. Außerdem wollte er Herbergen und Gaststätten, Heime für Keusche und Jungfrauen und Betrachtungsstätten errichten und wünschte, daß sich die Charitas den Armen gegenüber u. a. auch der Empfehlungsschreiben bediene, welche wir den Dürftigen für die Reise von Volk zu Volk mitgeben. Diese Vorzüge hatte Julian bei uns bewundert.</p><p>An solche Neuerungen dachte der Reformator und Sophist. Es ist fraglich, ob der Umstand, daß Julians Pläne unvollendet blieben und sich nicht verwirklichten, uns zum Vorteil war, soferne wir durch sein Verhalten von seinen Plänen ziemlich rasch befreit worden sind, oder aber ihm selber Nutzen brachte, da er nicht über einen Traum hinaus kam. Es hätte sich zeigen können, was Original und was Nachäfferei ist. Affen sollen nämlich menschliche Handlungen nachahmen, wenn man so schlau ist, ihnen schmackhafte Brocken vorzuwerfen. Durch diese lassen sie sich gewinnen; unsere Weisheit aber können sie trotz ihrer Nachahmungskunst nicht erreichen. Thessalische Pferde, lacedämonische Frauen und aus der Arethusaquelle trinkende Männer ― ich meine, dem Orakel folgend, die Sizilianer ―, sind in ihrer Art nicht besser, als es in ihrer Art die erwähnten Bräuche und Gesetze sind, welche vor allem für die Christen passen und von keinem, die uns nachgehen wollen, nachgemacht worden sind; denn sie verdanken nicht so sehr menschlichen Erwägungen, als vielmehr göttlicher Kraft und dem Konservatismus ihren Sieg.</p><p>Es ist nicht möglich, diese ihre bewunderte Besserung und Reform verwirklicht zu schauen und hören zu können, worin ihre Lehre besteht und was der Zweck ihrer Zusammenkünfte ist, damit wir, wie Plato über den nur mit Worten gelehrten Staat sagt, ihre Gedanken in Bewegung sehen. Denn jede Philosophie besteht aus zwei Teilen, einem theoretischen und einem praktischen, wovon der erstere erhabener, aber auch schwieriger, der letztere einfacher, aber (im Leben) brauchbarer ist, und wovon beide bei uns infolge ihrer wechselseitigen Beziehung in Ehren stehen, da wir die Theorie zum Reiseführer in den Himmel erwählen, die Praxis aber zur Leiter machen, auf der wir zur Theorie gelangen, weil ja der an der Weisheit keinen Anteil haben kann, der nicht weise lebt. Jenen aber scheint irgendeiner von beiden Teilen lächerlicher und schwächer zu sein, da ihnen die göttliche Eingebung mangelt und sie daher keinen festen Halt haben können, den Wurzeln gleichend, welche nicht festgewachsen sind und daher im Wasser bewegt werden. Besuchen wir ihre glückliche Aufführung, damit wir, wenn sie spotten und fabulieren, wie es in vielen Schauspielen Brauch ist, an ihrem Spott ein wenig teilnehmen können! Zu dem Worte: „Freue dich mit den Fröhlichen und weine mit den Weinenden!“ gehört noch die Aufforderung: „Nimm es auf dich, mit den Schwätzern dumm zu reden!“ Auch Dichter verstehen es, trotz Tränen zu lachen.</p><p>[Forts. v. ] Möge ihr Theater Eindruck machen! Ich weiß nicht, wie sie sonst ihren Tempel genannt haben wollen. Die Rufer sollen schreien: „Das Volk trete zusammen!“ Vorne sollen diejenigen Platz nehmen, welche durch ihr graues Haar, ihre Anciennität oder ihre Stellung im öffentlichen Leben Vorrang haben oder sich durch Geburt und Würde auszeichnen oder durch irdische Weisheit, die mehr Vergnügen bietet als wahre Frömmigkeit! Über diese Vorzüge wollen wir sie selbst entscheiden lassen. Was werden sie sodann tun? Mögen sie auch noch ihre Würdenträger eintragen! Mit Purpur, Stirnbändern, schönen Blumenkränzen werden sie geschmückt sein. Vielfach habe ich die Wahrnehmung gemacht, daß sie gerne Hochwürden spielen und mehr als gewöhnliche Menschenkinder sein wollen. Verachtung halten sie für das Los des gemeinen und niederen Mannes, dem Stolzen und Unzugänglichen dagegen gebühre Glaube und Vertrauen. Oder sollten sie vielleicht auch hierin zu uns herabsteigen und sich zu unserem Glauben bekehren wollen, daß sich nicht Eitelkeit, sondern Seelengröße geziemt? Wir nämlich fragen wenig nach Schein und Form. Uns handelt es sich mehr um den inneren Menschen; wir wollen lieber die Augen auf die Seele lenken und so die Masse erziehen.</p><p>So steht es bei ihnen. Was wird aber von nun ab geschehen? Man wird Männer holen, welche die ― natürlich wie ihr selber sagen werdet ― göttlichen Worte auslegen müssen; man wird theologische und Moral-Bücher nachschlagen. Sage mir, was für Bücher werden es sein, und wer wird sie verfaßt haben? Es wird sich hübsch machen, wenn von Hesiods Göttergeschichte mit ihren Kämpfen und Wirren, von den schrecklichen Namen und Taten der Titanen und Giganten vorgesungen wird. Man wird erzählen von Kotus, Briareus, Gyges, von Enceladus, von euren Drachenfüßlern, von Blitze schleudernden Göttern, von Inseln, welche diesen entgegengeworfen wurden als Geschoße und zugleich als Gräber für die Entgegenstürmenden, von ihren schlimmen Kindern und Sprößlingen, den Hydren, Chimären, Cerberen, Gorgonen, dem Ausbund aller Schlechtigkeit. Solche saubere Geschichten aus Hesiod werden den Zuhörern vorgetragen werden. Orpheus mag mit seiner Laute unter den alles lockenden Gesängen erscheinen und an Zeus die gewaltigen hochtönenden theologischen Worte und Gedanken richten: „Herrlichster, Größter unter den Göttern, der du im Schmutze steckst!“ ― nämlich im Schmutze von Schafen, Pferden, Maultieren, wodurch wohl Zeus als Tierschöpfer und Lebenspender gekennzeichnet werden soll; anders läßt es sich nicht erklären. Auch an anderen großen Worten wird man es nicht fehlen lassen. „Also sprach die Göttin und entblößte beide Schenkel,“ um ihre Liebhaber einzuweihen, was noch jetzt unter Symbolen geschieht. Am Schluß wird Phanes und Ericapäus auftreten und der, welcher alle Götter verschlingt und wiedergibt, um der Vater der Menschen und Götter zu sein. Ihre Lehren mögen denen vorgetragen werden, die unverständlicherweise auf solche theologische Weisheit hören! Hierauf möge man dazu allegorische, wundersame Auslegungen ersinnen, wobei aber die Rede von ihrem Thema abkommen und in Schlünde und Abgründe fallen wird, da dem Denken der feste Grund fehlt.</p><p>Welche Stellung wird man dem großen Homer anweisen, der bald als Komödiendichter, bald als Tragödiendichter über die Götter geschrieben hatte? In seinen bewunderten Dichtungen findest du nämlich beides: Unglück und Lächerlichkeiten. Wahrlich nicht klein ist das Verlangen, zu erfahren, inwiefern sich Oceanus mit Tethys, da ja der Welt im Falle ihrer vorübergehenden Enthaltsamkeit Gefahr drohen würde, durch Vermittlung der nach Dirnenart geschmückten Hera versöhnen wird. Mußte sich Trockenheit und Feuchtigkeit versöhnen, damit die Welt nicht durch die Übermacht des einen Teiles zusammenbreche, oder ist an etwas noch Dümmeres zu denken? Was bedeutet die merkwürdige Ehe des Wolkensammlers (Zeus) mit der ehrwürdigen Hera, welche ihn am hellen Tage zum Verkehr aufforderte? Allerdings die Dichter schmeicheln ihm in ihren Gedichten, indem sie ihm frische Lotusblumen streuen und Krokus und Hyazinthen aus der Erde sprossen lassen. Woher kommen diese Blumen, wie sind sie zu erklären? Wie ist zu erklären, daß eure Hera, die zugleich Schwester und Ehefrau ist, das eine Mal in der Luft und in den Wolken schwebt, von eisernen Ambossen hinabgeschleudert und mit ihren weißen Armen und rosenfarbigen Fingern in goldene Fesseln geschlagen wird, so daß den Göttern, welche Fürsprache einlegen wollen, schon dieser Liebesdienst gefährlich wird, und daß Hera ein andermal, nachdem sie sich für Zeus geschmückt hatte, den ganzen Liebesgürtel an sich bringt, so daß Zeus gesteht, daß vor dieser einen Liebe alle Liebesempfindungen zu allen möglichen Göttern zurücktreten? Was bedeutet die Furcht, daß, da die Götter sich wegen der lacedämonischen Buhlerin (Helena) aufregten und der Himmel mit Trompeten Zeichen gab, der Sitz der Erde berste, das Meer sich empöre, das Reich des Hades sich öffne und das, was (hier) lange verborgen war, offenbar werde? Was bedeutet das Nicken mit den finsteren Augenbrauen, das Schütteln der göttlichen Haare, das den ganzen Olymp bewegt? Was der verwundete und in ehernen Ketten gefesselte Ares, der ungeschlachte Liebhaber der Aphrodite, der unvorsichtige Buhler, der von dem doppelt gelähmten (Hephästos) festgenommen wurde und, nachdem er in schändlicher Lage den Göttern ein Schauspiel geworden, gegen kleine Geschenke wieder entlassen wurde?</p><p>Wer von euch ist so ideal veranlagt, so groß und besitzt tatsächlich so viel von des Zeus Einsicht, daß er alle diese so weise und so schlau ersonnenen, ganz außergewöhnlichen Erzählungen, die noch vermehrt werden können, mit theoretischen, überirdischen, für uns nicht faßbaren Erwägungen auf sittliche Ideen zurückzuführen vermöchte? Beruhen diese Erzählungen auf Wahrheit, dann braucht man sich derselben nicht zu schämen, dann möge man stolz darauf sein, bzw. dann möge man beweisen, daß die Erzählungen nicht schändlich sind! Was braucht man dann noch seine Zuflucht zu der Ausrede zu nehmen, es sei ein Mythus, als wenn der Mythus die Schmach zudecken könnte? Nicht Mutige, sondern Flüchtlinge brauchen den Mythus. Sollten die Erzählungen aber unwahr sein, dann möge man uns zunächst die nackte, theologische Wahrheit lehren, auf daß wir uns damit befassen können, sodann möge man erklären, ob es nicht töricht ist, mit Stolz von der hohen Bedeutung einer Erzählung, deren man sich, sofern sie ein Mythus ist, schämen muß, zu sprechen und das, was den meisten, da Bildung kein Gemeingut ist, verborgen bleiben könnte, aller Augen in Bildern und Darstellungen und unter schrecklich hohen finanziellen Auslagen in Tempeln, an Altären, Standbildern, Weihgeschenken und kostbarsten Opfergaben zugänglich zu machen und ein gottloses, mit vielen Ausgaben verbundenes Leben einem frommen Leben vorzuziehen, das keine Auslagen auferlegt.</p><p>[Forts. v. ] Wenn man behaupten sollte, jene Erzählungen seien Einbildungen und Schwätzereien von Dichtern, welche Verse und Mythus um des Kunstgenusses willen brauchen, da sie damit das Gehör befriedigen, und der in den Erzählungen liegende Gedanke sei ihnen selbst ein ziemlich tiefes Geheimnis, in das nur wenige Weise einzudringen vermöchten, so achtet darauf, wie einfach und gerecht ich mich darüber äußere! Zunächst, warum lobt man die, welche ihre verehrten Helden verspotten, und stattet man fast mit göttlichen Ehren diejenigen aus, welche es schon für großen Gewinn ansehen mußten, nicht für ihre Gottlosigkeit gestraft worden zu sein? Wenn schon die Gesetze über die, welche nur einen einzigen Gott privat ein wenig lästern, Tod und Geldstrafe verhängen, was müßten denn alsdann die erdulden, welche mit ihren Gedichten alle Götter zugleich und noch dazu öffentlich und in schändlichster Form angreifen und ihre Komödien noch späteren Zeiten überliefern? Sodann sollte auch folgendes in Betracht gezogen werden: Es gibt auch bei uns ― ich will es nicht leugnen ― Allegorien, doch welcher Art ist ihr Doppelsinn und was bedeuten sie? Einerseits ist ihre äußere Form nicht unanständig, anderseits ist der verborgene Gedanke wunderbar und für die, welche in die Tiefe eingeführt werden, überaus klar; es ist, wie wenn ein schöner, keuscher Körper von einem nicht unschönen Gewande umhüllt wird. Das nämlich, wodurch das Göttliche angezeigt und angedeutet wird, darf meines Erachtens nicht unanständig sein und nicht die Würde des Geoffenbarten verletzen, auch nicht Anstoß erregen, wenn es auf die Menschen bezogen wird. Es muß entweder durchaus tadellos sein oder darf nicht gar schändlich sein, damit es einerseits die Weiseren erfreue, andererseits der Masse nicht schade.</p><p>Bei euch jedoch verdient einerseits die (verborgene) Idee keinen Glauben und ist anderseits die Schale verderblich. Was für einen Sinn hat es, durch Schmutz zur Stadt zu führen oder über Klippen und Sandbänke nach dem Ziele zu streben? Was wird sich in solchen Fällen ergeben? Was wird der Erfolg der Worte sein? Du magst schwätzen und dein Schicksal oder deine Einbildungen verblümen, aber es findet sich niemand, der dir Glauben schenkt. Denn der Augenschein belehrt eines Besseren. Einerseits bringst du dem Zuhörer keinen Profit, anderseits schadest du dem Zuschauer durch die Darstellungen. Ihre theoretische Darstellung ist von einer Art und ist von ihren Grundsätzen so verschieden, daß es noch eher gelingt, alles mögliche miteinander zu verbinden und selbst das Entlegenste zu vereinen, als hier (Mythus und Erklärung) zu einen und zu verbinden und zu behaupten, Mythus und Erklärung kämen aus einem und demselben Kopfe.</p><p>Was soll man über ihre Moral urteilen? Mit welchen Mitteln, welchen Gründen, durch welche Erwägungen werden sie zur Tugend erziehen können und werden ihre Mahnungen würdige Menschen machen? Etwas Vorzügliches ist die Eintracht und der Friede der Staaten, der Völker, der Familien, der Einzelpersonen und ihr Gehorsam gegen die Gesetze und die Ordnung der Natur, welche alles trennt und bindet und in diesem All aus vielem eine einzige Welt gestaltet hat. Unter welchen Bildern können sie Friede und Eintracht lehren? Etwa dadurch, daß die von Kriegen, Zwistigkeiten und Empörungen der Götter und von der Unmenge der Übel reden, welche diese selbst privat und öffentlich zeigen und anderen zufügen und von welchen es in fast allen ihren Erzählungen und Dichtungen wimmelt? Durch solche Mythen können sie eher aus friedfertigen Menschen Krieger und aus Weisen Verrückte machen, als freche und ungebildete Menschen zu gesitteten und züchtigen umgestalten. Wer vermag die, welche selbst dann, wenn keine Verführer wirken, nur mit Mühe von der Sünde abgehalten und vom Schlimmeren zum Besseren geführt werden können, zu Demut und Bescheidenheit zu erziehen, wenn ihnen die Götter Führer und Erzieher zu Leidenschaft sind? Dort ist die Sünde etwas Ehrenvolles, da sie unter dem Schutze eines der Götter steht und da die Leidenschaft auf Altären und durch Opfer ausgezeichnet wird und anerkannte Freiheit erlangt hat. Es ist haarsträubend, das als göttlich zu verehren, was gesetzlich bestraft wird. Soweit ist es mit eurer Unmoral gekommen!</p><p>[Forts. v. ] Das zweitwichtige Gebot muß lauten: Du sollst deine Eltern achten und lieben, nach dem ersten Grunde des Seins auch den zweiten Grund ehren! So muß Vernunft und Theologie lehren. Kronos aber kann es doch nicht lehren, da er den Uranos kastrierte, damit er keine Götter erzeuge und den Meereswogen die Macht gebe, die schaumgeborene Göttin zu vollenden, und Zeus kann es nicht, da er, der süße Stein und wütende Tyrannenmörder, dem Beispiele des Vaters folgend, sich gegen Kronos erhoben hatte, ― um zu schweigen von dem, was sonst noch in ihren Büchern zur Ehre der Eltern überliefert wird.</p><p>Das dritte Gebot verlangt, Geld zu verachten, nicht überall nach Gewinn zu streben und sich nicht schlimmen Besitz als Unterpfand des Unglückes zu erwerben. Warum nun wird ihnen Kerdoos vorgeführt und dessen Sack vorgezeigt? Warum wird das Diebstalent des Gottes geehrt, und warum weissagt Phöbos nur gegen Geld, und warum geht nichts über die Münze?</p><p>Ferner sollen Mäßigung lehren und Enthaltsamkeit predigen ihr nächster Lehrer Zeus, der um der Weiber willen alle möglichen Gestalten angenommen hatte, der Allerliebste, der phrygischen Knaben als liebwerter Adler erschien, damit die Götter beim Kredenzen des Weines an die Knaben des Zeus möglichst vergnügt zechten, außerdem Triesperos Herakles, der in einer einzigen Nacht die fünfzig Töchter des Testius bezwang; es war seine dreizehnte Heldentat, obwohl sie unbegreiflicherweise den anderen Taten nicht beigezählt wird. Ares möge seinen Zorn bezähmen, Dionysos seine Trunksucht, Artemis ihren Haß gegen Fremde, der orakelnde Apollo seine Lügenhaftigkeit, sein ungezügeltes Lachen der Gott (Hephästos), der zum Leidwesen der Götter hinkte und sich auf schwächliche Beine stützte. Ihre Gefräßigkeit mögen bezähmen Zeus, der mit den übrigen Dämonen zum fetten Mahle der trefflichen Äthiopier eilte, der Ochsenfresser, der den Bauern überwältigte und den pflügenden Ochsen verschlang, was ihm seinen Namen eintrug, und alle Götter, welche dem Opfergeruch und den Trankopfern nachlaufen!</p><p>Unsere Religion weiß nichts von solchen Ausartungen. Denn unsere Philosophie ist Altruismus; sie verlangt, daß wir dem Nächsten das gleiche wünschen wie uns selbst. Nicht nur böse sein, sondern schon nach dem Bösen etwas verlangen, halten wir für Sünde; der Wille wird bestraft wie die Tat. Wir üben in einer Weise Enthaltsamkeit, daß schon der Blick verhindert wird. Unsere Hände wissen nichts von Mord; denn wir enthalten uns schon vom Zorne. Meineid ist uns etwas so Schlimmes und Arges, daß wir allein es sind, welche keinen Eid schwören. Die meisten haben überhaupt keinen Besitz; viele wollen allein deshalb etwas besitzen, damit sie, Armut wie Reichtum liebend, verzichten können. Die bittere, abscheuliche Herrschaft des Magens, des Vaters aller Übel, weisen sie zurück; sie überlassen ihm die Masse. Es ist nicht zu viel gesagt, wenn man behauptet, daß sie sich vom Fleische gewaltsam losgerissen haben, da sie das Sterbliche durch das Unsterbliche überwinden. Ihr moralischer Grundsatz ist, auch nicht in Kleinigkeiten, die die Welt nicht beachtet, zu unterliegen. Der größte Vorzug ist, daß, während andere in ihren Gesetzen (nur) die Ausartungen bestrafen, wir das Übel in seiner Wurzel bekämpfen, den gefährlichen, reißenden Fluß schon an der Quelle dämmend.</p><p>Sage mir, wo und bei welchen Menschen segnen die, welche geschmäht werden, sind freundlich die, welche gelästert werden ― bloße Beschimpfungen zu hören, ist ja nicht so bitter, wie begründete Beschuldigungen einstecken zu müssen ―, demütigen sich die, welche verfolgt werden, geben die ihre Kleider hin, welche entblößt werden, beten diejenigen, welche verflucht werden, für ihre Schmäher, wird ― um es mit einem einzigen Worte zu sagen ― die Frechheit durch Güte besiegt, und werden die Missetäter durch standhaftes Leiden gebessert? Geben wir einmal zu, daß die Heiden durch geschickt ausgedachte Gesetze dem Laster begegnen: doch erreichen sie etwa den Grad der Tugend und Bildung unserer Leute, die es für Sünde erachten, stillzustehen, im Guten nicht vorwärtszuschreiten und sich nicht ständig aus den alten Zuständen heraus zu verjüngen? Jene sind Kreisel, welche sich um das Laster drehen, von ihm aber nicht loskommen und wie von einer Peitsche an ein und demselben Platze bewegt werden. Das Gute müssen wir teils vollbringen, teils müssen wir uns an dasselbe klammern, teils müssen wir darnach streben, bis wir zu jener Vollkommenheit und Vergöttlichung gelangt sind, für welche wir erschaffen sind und zu welcher wir kommen, wenn wir nur vernünftig sind und ein Ziel erhoffen, das der Größe Gottes würdig ist.V. Rede</p><h2>V. Rede</h2><p><em>V. Rede.</em></p><p>[Forts. v. ]* Zweite Kampfrede wider Kaiser Julian.*</p><p>Hiemit habe ich meine erste Kampfrede vollendet und abgeschlossen. Deutlich genug habe ich Julians Charakter gezeichnet, der sich sowohl in dem offenbarte, was er sich tatsächlich gegen uns erlaubt hatte, als auch in dem, was er, der immer noch Schlimmeres wußte als er tat, erst im Sinne hatte. Nun verfolgen wir mit dieser Rede noch ein anderes Ziel, das sich vielleicht noch keiner gesteckt hat; sie wird Gottes Heiligkeit noch mehr dienen, uns besser passen und den Nachkommen noch nützlicher sein. Wir wollen auch noch über die gerechten Vergeltungen Gottes sprechen, welche ein Gegengewicht gegen die Lasterhaftigkeit sind und welche die einen sofort, die anderen etwas später treffen. Meine Rede wird ― meine ich ― dem schöpferischen Logos, meinem Herrn, gefallen, der das Unglück durch sein Erbarmen zu mildern, die Verwegenheit durch Entehrungen und Schläge zu züchtigen weiß; denn dies sind seine Erziehungsmittel.</p><p>Wer vermöchte entsprechend darzustellen die verdienten Krankheiten der Gottlosen, ihr offenkundiges Zusammenbrechen, ihre sonstigen verschiedenartigen, den Übeltaten angepaßten Heimsuchungen und Schläge, die außergewöhnliche Art ihres Sterbens, ihre in der Not gegebenen Geständnisse, ihr verspätetes Erkennen, die Zurechtweisungen, welche sie bald in Träumen, bald in wirklichen Erscheinungen erhielten? Solche Erfahrungen mußten sie machen wegen ihrer Frevel an Gotteshäusern, an Altären und heiligen Kelchen, wegen ihrer schamlosen Gier nach unserem Fleisch und wegen all ihrer übrigen Tollkühnheiten. Klar und deutlich gibt sich hier Gottes Zorn zu erkennen. Ich beabsichtige aber nicht, von all dem zu sprechen, doch nicht etwa, weil ich den Ereignissen und Erzählungen mißtraue oder weil ich gleich denen, die an das Fatum glauben, die Geschehnisse auf zufällig wirkende Schicksale zurückführe, sondern weil ich nicht den Schein erwecken möchte, daß ich mich mit Kleinigkeiten abgebe und das Große und Wichtige vernachlässige. Ich will vielmehr von dem altbekannten Wunder erzählen, das selbst die Gottlosen nicht bestreiten.</p><p>[Forts. v. ] Immer größer wurde Julians Wut gegen uns; immer mehr raste diese See. Er wütete zunächst gegen sich selbst, er trat das Heilige mit Füßen und „verhöhnte den Geist der Gnade“. Man sollte ihn eigentlich Jeroboam oder Achab, den Israeliten, welche große Verbrecher waren, nennen, oder Pharao, den Ägypter, oder Nabuchodonosor, den Assyrer. Oder sollen wir zusammenfassend ihm alle Namen zugleich geben? Denn offenbar hatte er die Schlechtigkeit aller in sich vereint, die Treulosigkeit des Jeroboam, die Blutgier des Achab, die Hartnäckigkeit des Pharao, den sakrilegischen Sinn des Nabuchodonosor, dazu noch von allen die Gottlosigkeit. Da er alle möglichen Mißhandlungen versucht hatte und ihm jede Art der Vergewaltigung, trotzdem niemand besser als er Leiden erfinden und erklügeln konnte, noch zu gering und unbedeutend erschien, hetzte er schließlich noch die Juden, welche er wegen ihrer alten Leichtfertigkeit und ihres alten glühenden Christenhasses für seine Pläne brauchte, gegen uns auf, indem er, Wohlwollen heuchelnd, es unter Hinweis auf ihre Bücher und Geheimlehren als göttlichen Willen bezeichnete, daß sie nunmehr in ihre Heimat zurückkehrten, ihren Tempel wieder aufbauten und die Herrlichkeit der väterlichen Bräuche wieder herstellten.</p><p>Da Julian mit diesem Plane umging und für ihn gewann ― zu allem, was man gerne tut, läßt man sich leicht verführen ―, dachten die Juden daran, den Tempel wieder zu errichten, und gingen fleißig und bereitwillig ans Werk. Wie solche, welche die Juden bewundern, erzählen, verzichteten deren Frauen nicht nur gerne auf all ihren körperlichen Schmuck zugunsten des Unternehmens und der Arbeiter, sondern glaubten auch, Gott einen Dienst zu erweisen, wenn sie an ihrer eigenen Brust den Schutt wegschleppten und weder auf ihre kostbaren Kleider, noch auf ihre zarten Glieder achteten; nichts ging ihnen über das Unternehmen. Als nun Sturm und Erdbeben entstanden, kamen sie plötzlich zusammen. Teils eilten sie in benachbarte Gotteshäuser, um zu beten, teils kamen sie mit dem, was sie gerade hatten, ― wie es in solchen Fällen zu gehen pflegt ― zu Hilfe, teils ließen sie sich einfach vom Tumult und der eilenden Masse mitfortreißen. Da wurden sie aber, wie manche berichten, vom Gotteshaus nicht aufgenommen, sondern als sie sich den geöffneten Toren näherten, schlossen sich dieselben vor ihnen infolge einer unsichtbaren, geheimen Kraft, welche zum Schrecken der Gottlosen und zur Festigung der Guten wirkt. Was aber alle berichten und glauben, ist, daß aus dem Tempel Feuer brach, sich gegen die, welche hartnäckig den Zugang erzwangen, stürzte und die einen gleich den Bewohnern von Sodoma oder gleich Nadab und Abiud, welche wider die Gewohnheit Weihrauch streuten und einen ungewöhnlichen Tod fanden, verbrannte und vernichtete, die anderen schwer verstümmelte, um sie zu lebenden Denkmälern göttlicher Rache gegenüber den Sündern zu machen. Dies ist Tatsache. Keiner darf daran zweifeln, so wenig als an den anderen Wundern Gottes. Was aber noch wunderbarer und auffallender war, ist, daß am Himmel ein feuriges Kreuz erschien, und daß das Zeichen und der Name, welche einst auf Erden von den Ungläubigen verachtet worden waren, nunmehr am Himmel für alle in gleicher Weise sichtbar wird und Gott zum überragenden Zeichen über die Gottlosen dient.</p><p>Was können die Weisen dieser Welt, welche auf ihr Wissen stolz sind, lange Bärte tragen und feine Mäntel umwerfen, dem gegenüberstellen? Setze auch du mir deine Lehre auseinander! Denn du schreibst lange Reden, erzählst unglaubliche Geschichten und gaffst in die Höhe, um Unwahres über den Himmel zu berichten und aus den Bewegungen der Sterne Geburt und Geschichte zu erklären. Erzähle mir von deinen Sternen, von der Krone der Ariadne, vom Haare der Beronike, vom ausschweifenden Schwan, vom hartnäckigen Stier oder, wenn du willst, von deinem Schlangenträger, dem Steinbock, dem Löwen und allen anderen, welche du, auf ihre Schlechtigkeit vertrauend, zu Göttern oder Sternen gemacht hast! Wo berichtet deine Wissenschaft von jenem Glanze, wo von dem Sterne, der einst von Osten her nach Bethlehem eilte und deinen Magiern ein Führer und Freund wurde? Auch ich verstehe mich auf Sternkunde: jener Stern hat das Kommen Christi geoffenbart; diese (Glanz) erscheinung ist Christi Siegeskranz.</p><p>[Forts. v. ] Dies ist mein Wissen über die Gestirne und Erscheinungen am Himmel, sofern sie gemäß der schönen, harmonischen Einheit des Weltalls an unseren Schicksalen Anteil haben. ― Das weitere Schicksal ist im Psalm ausgesprochen mit den Worten: „Städte hast du vernichtet“. Wie die alten Städte durch ihre Lasterhaftigkeit zugrunde gegangen waren, so wurden wegen der an uns begangenen Verbrechen gleicher Art die einen Städte von den Meereswogen vernichtet, die anderen durch Erdbeben zerstört und zwar in einer Weise, daß man auch noch das weitere Psalmwort verwerten kann: „Unter Lärmen wurde ihr Andenken ausgelöscht“, im Tumulte des Unterganges schwand es dahin. So war der Fall, so der Zusammenbruch der gleichgesinnten Städte, vor allem derer, welche sich ihrer Laster freuten. Lange Zeit bräuchte es, um sie eventuell wieder aufzubauen.</p><p>So sind Erde und Himmel unsere Lehrer. Doch für Julian war der Himmel in solchen Zeiten nicht Lehrer, nicht ließ er sich damals durch die Zeichen der Drangsale heiligen. Diejenigen, welche jenes (Kreuzes) wunder schauten und dabei waren, mögen jetzt noch ihre damals mit dem Bilde des Kreuzes gekennzeichneten Kleider sehen lassen! Sobald nämlich einer der Unsrigen oder der Außenstehenden davon erzählte oder davon erzählen hörte, sah er das Wunder an sich oder an seinem Nachbarn; entweder trug er selbst das himmlische Zeichen oder er schaute es am Nachbarn, dessen Kleider herrlicher waren als das trefflichste Gewebe und das kostbarste Gemälde. Was war die Folge? Das Staunen über die Erscheinung war so groß, daß fast alle gemeinsam und einstimmig den Christengott anriefen und in vielen Lob- und Bittgebeten versöhnten. Viele eilten unverzüglich, auf der Stelle zu unseren Priestern und wurden auf ihre inständigen Bitten hin in die Kirche aufgenommen, in der heiligen Taufe geheiligt und in die erhabenen Geheimnisse eingeweiht. Der Schrecken war ihr Gewinn.</p><p>Die Geschichte verlief also. Allmählich wurde Julian von seinem Wahne auf den Gipfel seines Unglückes gejagt und gehetzt. Da er nämlich glaubte, die Sache der Christen stehe für ihn günstig, und da er auf Grund seiner Unternehmungen hoffte, er dürfe nur wollen, um alles zu erreichen, und da er gegen die Barbaren im Westen bereits Erfolge hatte, faßte er den allein sehr klugen und vorteilhaften Entschluß: mit einem doppelten Heere, einem Heere von Kriegern und einem Heere von Dämonen, die seine Führer waren und auf die er sein besonderes Vertrauen setzte, brach er gegen die Perser auf, sich mehr auf törichte Verwegenheit als auf die sichere Kraft verlassend und trotz aller Weisheit unfähig, einzusehen, daß* θάρσος* [tharsos] und* θράσος* [thrasos], obwohl die Wörter dem Laute nach verwandt sind, doch tatsächlich sehr verschiedenes bedeuten: nämlich Männlichkeit und Unmännlichkeit. In der Gefahr ist Mut Männlichkeit. Nachgiebigkeit Feigheit. Wer aber in übergroßer Gefahr angreift, statt sich zurückzuziehen, ist verwegen; wer jedoch vor solcher Gefahr sich zurückhält, geht den sicheren Weg. Es ist zweierlei, ob man seine Position verteidigt oder ob man nach etwas verlangt, was man nicht hat. Jenes ist vor allem Ehrensache für alle Verständigen; dies mag man tun, wenn es keine Schwierigkeit bereitet, muß man aber andernfalls unterlassen. Es war sehr töricht von Julian, um eines Besitzes willen, den er erst erhoffte, seine ganze Position aufs Spiel zu setzen. Er kommt mir vor wie ein schlechter Faustkämpfer, der den Kampf beginnt, ehe er noch fest steht, oder wie ein Steuermann, der mit einem noch nicht seetüchtigen Schiffe auf der See ein feindliches Schiff versenkt oder versenken will. Ohne Überlegung und ohne Vorsicht nahm er, wie ich glaube, das in Angriff, was er sich in den Kopf gesetzt hatte. Als das römische Reich für ihn erst geboren werden sollte und als es wegen der Verfolgung noch krank war, dachte er schon gierig an fremdes Land. Er glich Salmoneus, der mit Häuten donnerte, er nahm sich Männer wie Trajan und Hadrian zum Vorbilde, welche jedoch wegen ihrer Klugheit nicht weniger bewundert wurden als wegen ihrer Tapferkeit. Er dachte weder an das Schicksal des Carus, noch an das des Valerian, welche für törichte Angriffe bestraft worden waren, d. i. ― um nicht, wie es in der Tragödie heißt, „dem Schicksal Vorwürfe zu machen“ ― an der persischen Grenze auf der Höhe ihres Glückes zusammenbrachen.</p><p>Sein Beschluß stand fest. Alle Wunder der Wahrsagerei und Zauberei, der öffentlichen und geheimen Opfer mußten herhalten, um in kurzem den Feldzug vollständig zu vereiteln. O Christus und Logos, ihr Leiden des Leidenlosen, o Geheimnis der ganzen Welt, wie gewaltsam und widernatürlich war das, was er im Falle des Gelingens gelobte! Das ganze Geschlecht der Christen wollte er an die Dämonen ausliefern, sobald sein Wunsch erfüllt wäre. Der Beginn der Expedition war für ihn sehr günstig und fand den Beifall vieler seiner Anhänger. Er besetzte und verwüstete Assyrien, soweit es vom Euphrat durchströmt wird, und Persien bis zur Mündung des Euphrat in den Tigris und eroberte einige feste Plätze, in denen er keinen Widerstand fand, sei es, daß er infolge des raschen Vorstoßes unvermutet eingetroffen war, sei es, daß ihn die Perser bereits in Händen hatten und allmählich vorwärts drängten ― beides wird behauptet. So kam Julian mit seinem Heere, das von seinem Proviant und seinem Train auf den Schiffen des Flusses begleitet war, ohne viel Aufenthalt vor Ktesiphon an. Sein Erscheinen vor der Stadt wurde seinem Wunsche entsprechend als Sieg gefeiert.</p><p>Von da ab jedoch ging es nun abwärts; es war, als wenn der Boden nun unter den Füßen schwand oder die Wogen über das Schiff schlugen. Ktesiphon ist nämlich eine starke Festung, welche nur schwer genommen werden kann, da sie durch Mauern aus gebrannten Ziegelsteinen, durch tiefe Gräben und durch die vom Fluß gespeisten Sümpfe geschützt ist. Sie wird noch verstärkt durch eine andere Festung, namens Koche, welche sowohl von Natur, wie künstlich gefestigt ist. Beide Festungen, welche nur durch den Fluß getrennt sind, erscheinen als eine einzige Stadt. Es war unmöglich, die Stadt im plötzlichen Ansturm zu nehmen oder sie durch Belagerung zu gewinnen. Auch konnte man nicht mit der Flotte vorwärts kommen; sie hätte riskiert, auf beiden Seiten von oben herab angegriffen und abgeschnitten zu werden. Daher machte er kehrt und zwar auf folgende Weise. Vom Euphrat, dem größten Flusse, ließ er einen ganz bedeutenden Teil in einem schiffbaren Kanal, der noch alte Spuren zeigen soll, ableiten, um ihn etwas oberhalb mit dem Tigris zu verbinden. So gelang es ihm, die Flotte aus dem einen Fluß in den anderen in Sicherheit zu bringen und sich dem gefahrvollen Bereiche der Festungen zu entziehen. Persische Truppen, welche ihm nun auf seinem Marsche in die Flanke kamen, wollten ihn, trotzdem ihre Zahl immer größer wurde, doch nicht in der Front angreifen und trotz ihrer Überlegenheit nichts ohne zwingende Notwendigkeit wagen; sie schossen vielmehr von Anhöhen und aus Verstecken, wo sich gerade Gelegenheit bot, besetzten vor dem Gegner die wichtigsten Wegstellen und hinderten auf solche Weise Julian leicht am Weitermarsche. Groß war nun seine Bedrängnis. Da er sich nicht mehr auskannte, erdachte er einen bösen Ausweg.</p><p>[Forts. v. ] Ein ziemlich angesehener Perser hatte in Nachahmung des Zopyrus, welcher dem Cyrus zur Übergabe Babylons verholfen hatte, sich gestellt, als hätte er sich des Perserkönigs Haß durch bedeutende Vergehen zugezogen und als wäre er nun auf die Sache des Königs schlecht zu sprechen, den Römern dagegen sehr gewogen. Nachdem er durch seine Verstellung Julians Vertrauen erobert hatte, sagte er zu ihm: „Was tust du da, o König? Wie schlecht bist du im entscheidenden Momente beraten! Was sorgst du dich um die mit Getreide beladenen Schiffe und um den übergroßen Train? Willst du zur Feigheit erziehen? Wer an den Magen denkt und sein Leben in der Hand haben will, paßt schlecht zum Kampfe und hat keine Disziplin. Willst du ein wenig auf mich hören, dann verabschiede deine Flotte, damit dein tüchtiges Heer nicht Schaden leide! Auf einem anderen, günstigeren und sichereren Weg, den ich dich führen will ― denn ich kenne mich so gut wie irgendeiner in Persien aus ―, wirst du ins feindliche Gebiet eindringen, um befriedigt wieder nach Hause zurückzukehren. Uns aber zeige alsdann dein Wohlwollen, sobald wir durch die Tat unsere aufrichtige, freundliche Gesinnung bewiesen haben!“</p><p>Julian ließ sich durch diese Worte beeinflussen; Charakterlosigkeit ist ja leichtgläubig, mag Gott noch so eindringlich mahnen. Nun wurde das Maß des Unglückes voll: die Flotte verbrannte, das Brot ging aus. Dabei hatte man für Spott nicht zu sorgen. Fast könnte man von Selbstmord sprechen. Alle Hoffnung war geschwunden; Führer und Führerversprechungen waren einmal. Ringsum aber stand der Feind, ringsum drohte der Krieg. An ein Weiterkommen war nicht leicht zu denken, die Verpflegung machte Schwierigkeit. Das Heer wurde mutlos, es zürnte dem Kaiser. Keine Aussicht war auf Rettung. Nur eines allein schien unter den gegebenen Verhältnissen zu retten: Verzicht auf das schlecht verwaltete Amt eines Kaisers und Generals.</p><p>So verliefen die Ereignisse. Über die weiteren Geschehnisse stimmen die Berichte nicht überein. Sie lauten verschieden, mögen sie von Kriegsteilnehmern oder von Unbeteiligten stammen. Nach einigen wurde er bei einem ungestümen Ausfall, als er keinen Ausweg mehr fand, von einer Lanze niedergestreckt; er habe das Schicksal des Cyrus, des Sohnes der Parysatis, geteilt, welcher, als er gegen seinen Bruder Artaxerxes mit starker Heeresmacht auszog, im mutigen Kampfe durch Tollkühnheit des Sieges verlustig gegangen war. Andere wissen noch Worte aus seinem Munde zu berichten. Als er auf eine Anhöhe gestiegen war, um Überblick über das Heer zu gewinnen und zu sehen, wieviel der Krieg noch verschont habe, und er noch eine große Schar schaute, die stärker war, als er vermutet hatte, soll er gesagt haben: „Wie schmählich ist es, wenn ich noch alle diese Truppen ins römische Gebiet zurückbringe!“ Gerade als hätte er sie um die Errettung ihres Lebens beneidet! Über diese Worte erzürnt, stieß ein Soldat, der sich nicht mehr beherrschen konnte, dem Julian, ohne an sich selber zu denken, das Schwert in den Leib. Wie wieder andere berichten, tat dies einer der barbarischen Spaßmacher, welche im Gefolge des Heeres sind, um in der Zeit der mühevollen Strapazen zu ermuntern und bei Trinkgelagen zu erheitern. Manche allerdings schreiben diese Ruhmestat einem Sarazenen zu. Auf jeden Fall erhielt Julian eine tödliche, dem ganzen Erdkreis heilsame Wunde. Durch die eine Verletzung mußte er dafür büßen, daß er so oft den Eingeweiden töricht Glauben geschenkt hatte. Ich wundere mich, daß er, der in seiner Verblendung alles aus den Eingeweiden erkennen zu können glaubte, dies eine, nämlich die Verletzung seiner Eingeweide, nicht vorausgewußt hatte.</p><p>[Forts. v. ] Noch etwas muß aus der Geschichte Julians erwähnt werden, weil es besonders klar seine Verkommenheit erkennen läßt. Er lag schwer verwundet am Ufer des Flusses. Weil er nun wußte, daß vor ihm viele übermenschlich geehrt wurden, indem man sie künstlich dem menschlichen Leben entrückte und so für Götter erklärte, wurde er von der Gier nach gleichem Ruhm ergriffen. Da er aber wegen seiner Unüberlegtheit eines ruhmlosen Todes sterben sollte, was ersann er nun, was tat er in seiner schändlichen Lage? Mit seinem Leben erlosch nicht zugleich auch seine Bosheit. Er versuchte sich in den Fluß mit Hilfe von Getreuen, welche in die Geheimnisse eingeweiht waren, zu stürzen. Hätte nicht ein Eunuche des Königs die Sache gemerkt, darüber berichtet und aus Ekel vor dem Frevel den Versuch verhindert, so wäre aus dem Unglück für die Dummen ein neuer Gott geworden. Julians Regierung und Heeresführung entsprach der Abschluß seines Lebens.</p><p>Julians unmittelbarer Nachfolger in der Regierung (Jovian) wurde noch im Lager selbst, als die höchste Gefahr einen Führer erheischte, ausgerufen. Er war ein Mann, der sich u. a. durch Frömmigkeit und in seinem äußeren Erscheinen auszeichnete und tatsächlich den Thron verdiente. Doch vermochte er keineswegs sich mit den Persern in einen Kampf einzulassen und vorwärtszukommen. Obwohl es ihm an Tapferkeit und gutem Willen nicht fehlte, plante er, da das Heer keine Kraft und keine Hoffnung mehr hatte, den Rückzug. Da er nicht eine Macht, sondern eine Niederlage erbte, suchte er wenigstens mit heiler Haut davonzukommen. Wenn sich nicht die Perser, welche dazu erzogen waren, im Glücke Maß zu halten, in ihrer Siegesfreude gemäßigt oder sich nicht ängstlich infolge sonstiger Gerüchte zu solch unerwartet günstigen Verhandlungen herbeigelassen hätten, hätten sie von dem Heere nicht einmal ― wie man zu sagen pflegt ― den Feuerträger übriggelassen. Die Perser hätten nämlich dieses ganz in ihrer Hand gehabt, da sie in ihrem eigenen Lande kämpften und durch die Ereignisse gehoben waren. Gute Erfolge stärken ja die Hoffnung. Nun aber lag, wie gesagt, Jovian alles daran, das Heer zu retten und den Römern die Macht zu erhalten; denn das Heer war eine Macht, da es ja nicht schlecht gehandelt hatte aus Feigheit, sondern vielmehr durch die Unüberlegtheit ihres Generals. Die Perser schlossen die Verträge ab, welche so schmählich und ― um es kurz zu sagen ― der römischen Herrschaft unwürdig waren. Wenn einer Julian von der Schuld an den Verträgen freispricht, Jovian aber die Schuld daran zuschreibt, dann versteht er wohl absolut nichts von dem, was sich damals zugetragen hatte. Die Ähren gehören doch nicht dem, der erntet, sondern dem, der sät. Und an einem Brande hat nicht der die Schuld, welcher ihn nicht löschen kann, sondern der, welcher ihn gestiftet hat. Es ist am Platze, an das Wort, das Herodot in seinem Berichte über die Herrschaft der Samier geschrieben hat, zu erinnern: „Histiaeus hat diesen Schuh genäht, Aristagoras hat ihn angezogen als Nachfolger seines Vorgängers.“</p><p>[Forts. v. ] Es blieb nichts anderes übrig, als den Leichnam des Gottlosen, der so aus dem Leben geschieden war, den Römern auszuliefern. Denken wir an unseren Toten (Konstantius), welcher vor Julian das Leben verlassen hatte, und ziehen wir nun einen Vergleich zwischen den beiden Kaisern, so wird er dem einen Toten zur Ehre, dem anderen zur Unehre gereichen. Konstantius wurde unter andächtiger Teilnahme des Volkes, festlich, mit unseren Zeremonien, bei nächtlichen Gesängen und im Lichterglanz so, wie wir Christen einen frommen Toten ehren zu müssen glauben, beigesetzt. Die Bestattung war eine festliche Trauer. Nach einem verbreiteten, aber fraglichen Gerüchte hatten, als sein Leichnam über das Taurusgebirge gekommen war, um in die Heimat, die gleiche, berühmte Stadt, gebracht zu werden, einige von den Bergen herab Stimmen von Sängern gehört, welche das Geleite gaben; es mögen Engel gewesen sein. Es war eine Ehrung seiner Frömmigkeit, eine Vergeltung im Tode. Mag Konstantius auch den Schein erweckt haben, als hätte er den wahren Glauben geschädigt, der Vorwurf hiefür trifft jedoch seine törichten, im Glauben schlecht geschulten Beamten, welche seine empfängliche, religiös wenig gefestigte Seele, die nicht in die Tiefen zu schauen vermochte, nach ihrem Belieben führten und unter dem Vorwande der Bildung seinen Eifer mißbrauchten.</p><p>Gemeinsam sahen wir in Konstantius einen Vater, da er die äußere Macht des christlichen Glaubens begründet und das Erbe der Lehre übernommen hatte. Wir haben daher, wie es sich gebührte, das Zelt dessen geehrt, der zeit seines Lebens gerecht regiert, sein Leben heilig abgeschlossen und uns eine Macht hinterlassen hat. Soll ich erinnern an die Ankunft vor der großen Kaiserstadt, an das militärische Geleite der ganzen Armee, an das polizeiliche Aufgebot, das sonst zu Lebzeiten eines Kaisers erfolgte, oder an das Hinausströmen der festlich gestimmten Bevölkerung, wie es niemals war und niemals sein wird? Selbst der verwegene, hochgeborene Julian, der sich erst mit dem Purpur geschmückt hatte und daher natürlich sehr stolz war, nahm an der glänzenden Ehrung des Konstantius teil; die gleichen Ehren, welche er gerne entgegennahm, erwies er, wie man sagt, nur gezwungen. Mochte auch das ganze Heer sich vor dem anwesenden Gewalthaber beugen, so zeigte es doch größere Ehrfurcht vor dem Verstorbenen; denn wir haben mehr Gefühl für frisches Unglück, haben Mitleid mit einem treuen Freunde und schenken ihm unser Erbarmen. Da man es dringend verlangte, daß Konstantius als Kaiser geehrt werde, veranlaßte man den Apostaten, nachzugeben, und zwang ihn, der Leiche in gebührendem Verhalten entgegenzugehen, d. h. er sollte ohne den Schmuck des Diadems auf dem Haupte und unter gebührender Verbeugung vor dem Kaiser, obwohl er sich dessen Ehren angemaßt hatte, mit den anderen das Geleite geben bis zum Grabe und zum berühmten Heiligtum der Apostel, welche das heilige Geschlecht übernommen haben und behüten. So erging es unserem Kaiser (Konstantius).</p><p>Für Julian war schon der Ausmarsch schmählich, soferne er sich von Völkern und Städten, von dem Geschrei der Masse und der Possenreißer treiben ließ, woran sich noch heute viele erinnern; noch schmählicher jedoch war seine Rückkehr. Und worin bestand die Schmach? Komödianten begleiteten ihn unter Flötenspiel und Verhöhnungen und unter Schandreden, die sie der Bühne entlehnt hatten, und spotteten über seine Treulosigkeit, seine Niederlage und sein Ende. Welche Kränkungen mußte er nicht von denen, die darin geschult sind und im Spott ihren Beruf sehen, hinnehmen und anhören, bis endlich die Stadt Tarsus ihn aufnahm! Warum und wofür diese sich solche Entehrung gefallen lassen mußte, weiß ich nicht. In Tarsus ist sein schmutziger Hain, sein unheiliges Grab, sein häßlicher, fromme Augen verletzender Tempel.</p><p>[Forts. v. ] Hiemit habe ich die größten und bedeutendsten Anklagen erwähnt, die gegen Julian erhoben werden können. Aber ich weiß auch wohl, daß zwei oder drei Schmeichler am kaiserlichen Hofe, die an Gottlosigkeit ihm gleichkamen, ― andere will ich übergehen ― für ihre Gottlosigkeit solchen Lohn erhielten, daß sie ohne Mühe in kurzer Zeit das ganze über Wasser und Land sich erstreckende römische Reich hätten an sich reißen können, wenn nicht so schnell der Geschichte ein verdientes Ende bereitet worden wäre; an Gier und Unersättlichkeit übertrafen sie die ehemaligen Hunderthänder. Die höchsten Ämter wurden nicht an die Würdigsten, sondern an die Grausamsten verliehen. Maßgebend war bei Besetzung nur der Abfall (vom Glauben) und daß man für seine schlechte Gesinnung, die man gegen sich selbst hegte, von ihm Geschenke annahm.</p><p>Was soll ich von seinen Rechtsverdrehungen und Rechtsbeugungen sagen? Oft genügt eine einzige Nacht, um das Recht umzuändern und zu verdrehen. Gerechtigkeit war ihm wie Ebbe und Flut. Da der hochgeborene Julian aus Ehrgeiz alles an sich riß, wollte er sich nämlich auch mit Rechtsprechung abgeben. Vielleicht erwecke ich den Schein, als ob ich nur recht unbedeutende Fehler ihm zum Vorwurf mache und als ob ich durch solch kleinliche Vorwürfe das Schlimmste in den Hintergrund stellen möchte. Auf jeden Fall muß man zugeben, daß Julians Taten nicht die Gefilde des Elysiums verdienen, auch nicht den Ruhm, welchen dort Rhadamanthys genießt, an welchem Julian aber seine Genossen und Kollegen teilnehmen lassen. Nur eines will ich noch staunend erwähnen. Er ließ sich nämlich alles daran gelegen sein, zahlreiche Bekannte und Freunde vor allem aus der Zeit seines Aufenthaltes in Asien zu wunderbaren Leistungen einzuladen und sie in ihren Hoffnungen durch Erinnerung an gegebene Versprechungen zu stärken. Als sie aber erschienen waren, lautete das Urteil anders und waren die Augen enttäuscht. Über die einen machte er sich auf diese, über die anderen auf jene Weise lustig. Manche hatte er ehrend zur Tafel gezogen. Aber obwohl er ihnen fleißig mit dem Rufe „Freund!“ zutrank und statt anderer Lockmittel seine geschwätzige Zunge benützte, entließ er sie, ohne daß sie etwas von ihm hatten. Nun wußten sie nicht, ob sie mehr ihm wegen seiner Falschheit oder sich selbst wegen ihres Leichtsinnes Vorwürfe machen sollten.</p><p>[Forts. v. ] War es nicht Ruhm für seine philosophische Bildung, daß er gleich denen unter den früheren Kaisern, welche sich durch ein gesetztes, ruhiges Benehmen auszeichneten und in kritischen Momenten nicht einmal mit den Augen zuckten und nicht eine Spur von Leidenschaft hinterließen, sich so sehr von Aufregung freihielt und so sehr über den Leidenschaften erhaben war, daß er bei Rechtsprechungen in seinem Palaste erschütternden Lärm schlagen ließ, gerade als hätte er nicht anderen in ihrem Leid zu helfen gehabt, sondern als wäre er selbst der Vergewaltigte und Gezüchtigte gewesen? Doch davon will ich nicht reden. Wer aber wüßte nicht, daß viele Leute vom Lande, wenn sie offen vor ihn traten, um kaiserliche Gnaden zu erflehen, von ihm öffentlich mit Faustschlägen und Fußstößen so traktiert wurden, daß sie froh sein mußten, daß ihnen nicht noch Schlimmeres zugestoßen war?</p><p>Wohin sollen wir es schreiben, daß der sonderbare Mann beim Anfachen des Altarfeuers blies und wieder blies, um unsere Bräuche nachzuäffen und alten Weibern etwas vorzumachen? Nahm es sich etwa gut aus, wenn ein römischer Kaiser seine Backen häßlich aufblies, so daß sie nicht nur Gegner, sondern auch die zum lauten Lachen reizten, denen er damit zu gefallen glaubte? Er wußte es nicht, daß Athene, seine Göttin, die Flöten verwünschte, seitdem sie im Spiegel des Wassers gesehen hatte, wie sie durch das Flötenspiel entstellt wird. Berührt es nicht sonderbar, daß er bei Trinkgelagen offen Buhlerinnen zutrank und sich von ihnen zutrinken ließ, daß er unter geheimnisvollen Vorwänden seine Schlechtigkeit verbarg?</p><p>[Forts. v. ] Den Charakter Julians lernte man kennen auf Grund der Erfahrungen in der Zeit, da er sich in seiner Herrschaft frei fühlte; allerdings mir war er in mancher Beziehung schon längst bekannt, da ich mit ihm in Athen zusammengekommen war. Ein doppelter Zweck hatte ihn dorthin geführt. Der eine, ehrenwerte, war, Griechenland und seine Bildungsstätten zu besuchen. Der andere, geheimnisvolle und wenig bekannte, war, sich von dortigen Priestern und Betrügern in ihre Geheimnisse einweihen zu lassen; denn seine Gottlosigkeit war noch nicht offene Wege gegangen. Ich habe mir damals von dem Manne kein unrichtiges Bild gemacht, obwohl ich ja nicht zu seinen Vertrauten gehört hatte. Sein anormales Benehmen und seine ganz eigenartige Erscheinung ließ mich über ihn prophezeien; wer gut beobachtet, dürfte ja der beste Prophet sein. Keinen guten Charakter schien mir zu verraten sein wenig fester Nacken, seine zuckenden, schaukelnden Schultern, seine leidenschaftlichen, unruhigen Augen, sein aufgeregter Blick, sein nervöser, unsicherer Gang, seine Nase, die Hochmut und Geringschätzung zeigte, sein verächtlicher Gesichtsausdruck, der die gleiche Gesinnung verriet, sein ungezügeltes, erschütterndes Lachen, sein unbegründetes Zunicken und Abweisen, sein stockendes, durch Atmen unterbrochenes Sprechen, sein ungeordnetes, törichtes Fragen, seine nicht besseren Antworten, welche sich widersprachen und Klarheit, Konsequenz und Bildung vermissen ließen.</p><p>Soll ich mich auf Einzelheiten einlassen? Ich hatte mir Julian schon vor seinem Auftreten so vorgestellt, wie ich ihn nun aus seinen Taten erkannt habe. Wenn einige von denen, die damals bei mir waren und mich gehört hatten, jetzt hier wären, würden sie mir gerne Zeugnis geben. Kaum hatte ich nämlich Julians Verhalten beachtet, sagte ich zu ihnen: „Welch ein Unglück zieht sich der römische Staat heran!“ Nach diesen Worten betete ich, daß ich als falscher Prophet erfunden werden möchte. Denn dies wäre besser gewesen, als daß die Erde mit solchen Leiden überhäuft wurde und daß sie ein solches Entsetzen schauen mußte, wie sie zuvor noch keines gesehen hatte trotz der bekannten vielen Überschwemmungen, trotz der vielen Brände, trotz der Erderschütterungen und Erdspalten, trotz all der rohen Menschen und trotz der seltsamsten, vielgestaltigen Tiere, welche die Natur ersonnen hatte. Daher fand er auch ein Ende, das seiner Torheit würdig war. An seinem Ende gedachte Gott nicht mehr seiner gewohnten Langmut. Denn damals wäre Güte Versündigung an der Masse gewesen, damals hätte sie die Guten recht mutlos, die Sünder recht verwegen gemacht; damals hätte es den Schein erweckt, als gäbe es keine Vorsehung, keine Regierung, keine Vergeltung, sondern als würde das Weltall von einem blinden, bösen Zufall, der das Höchste überaus gefährdet, getragen und getrieben.</p><p>Wir, die so berichten, sind, wie man sagt, Galiläer, unangesehene Menschen, beten den Gekreuzigten an, sind Jünger von ungebildeten Fischern, sitzen Psalmen singend bei alten Weibern, sind vor vielem Fasten abgezehrt und halbtot, berauben uns unnützerweise des Schlafes und vergeuden mit eitlem Gerede ganze Nächte an den Stationen. Um euch zu schlagen, fragen wir: Wo sind (jetzt) eure Gelehrten, wo sind eure Ratgeber? Einem unserer „Toren“ ― um euren Ausdruck zu benützen ― entnehme ich diese siegesbewußte Antwort. Wo sind die Opfer, die Weihen, die Mysterien? Wo sind die offenen und geheimen Opferschlachtungen? Wo ist die gerühmte Kunst der Wahrsager? Wo sind die Erfolge der Prophezeiungen, wo die Wunder der Bauchredner? Wo ist das gepriesene Babylon? Wo der Erdkreis, den du mit ein wenig heiligem Blute erfassen wolltest? Wo sind die Perser und Meder, die du beherrschen wolltest? Wo sind die Götter, die vorausgeschickt wurden und euch begleiteten, die vor und mit euch kämpften? Wo sind die Orakel, welche gegen die Christen sprachen, wo die gegen diese gerichteten Drohungen? Wo ist unsere schon auf einen bestimmten Termin festgesetzte Ausrottung, welche sich sogar auf unseren Namen erstrecken sollte? Alles ist dahingegangen, alles ist vereitelt, zerronnen; der Ruhm der Gottlosen erschien als Traum.</p><p>Als ein fremder König mit großer Heeresmacht gegen den jüdischen König Ezechias zog, Jerusalem belagerte und scharfe, sündhafte, lästernde Worte gegen den König und gegen Gott selbst ausstieß, gerade als hätte dieser keineswegs die Kraft gehabt, die Stadt aus seiner Gewalt zu befreien, ging Ezechias in den Tempel, zerriß sich die Kleider und erinnerte unter Strömen von Tränen mit zum Himmel gestreckten Händen Gott an die Lästerungen des Senacherib mit der Bitte, seine frechen Drohworte zu strafen. „O Herr, ― rief er ― du hast es gesehen, wie sehr der Fremde dich, den Gott Israels, geschmäht hat. Du hast es gesehen, o Herr, schweige nicht!“ Und des Ezechias Bitte wurde nicht abgeschlagen. Der, welcher gegen Gott kämpfte, erkannte tatsächlich seine eigene Verwegenheit und zog mit seinen Drohungen unter dem plötzlichen Einfluß einer unsichtbaren Gewalt unverrichteter Dinge wieder ab. Einen großen Teil seines Heeres büßte er ein. Wegen einer bitteren Kunde, welche unerwartet die Belagerung und seine Hoffnungen vereitelte, mußte er seine Position aufgeben. Solche Worte sprach Ezechias, der von starker Macht umgeben war, der König des großen Jerusalem, der wohl auch mit eigener Kraft hätte den Feind verdrängen können. Wir aber, deren einzige Waffe, Mauer und sonstiger Schutz die Hoffnung auf Gott ist, da uns jede menschliche Hilfe vollständig genommen und abgeschnitten ist, wen haben wir, daß er auf unsere Bitte höre und die Drohungen abwende, außer Gott, der „bei dem großen Israel schwört“? O die unverlässigen Erzählungen! O die kühnen Erwartungen! Statt eines anderen Opfers hatte man uns den Dämonen geweiht. Aber wir, das große Erbe Gottes, „das heilige Geschlecht, das königliche Priestertum“, sind der Kampfpreis geworden, der allein erwartet werden darf, der Siegespreis im einen Kriege.</p><p>Schlecht hast du es den Christen gelohnt, daß du durch sie erlöst worden warst. In solcher Weise hast du dem Herrn, deinem Gott, vergolten. Seinerzeit war Gott noch nicht für uns eingetreten, und hatte er seinen Zorn noch gedämpft und aufgeschoben und noch nicht all seinen Grimm entbrennen lassen, sondern seine Hand nur erst hoch über den Gottlosen ausgestreckt und den angelegten, bereitgehaltenen Bogen noch gewaltsam zurückgehalten und vorerst noch abgewartet, bis Julians ganze Schlechtigkeit wie eine eiternde, böse Wunde aufbräche; denn so ist es bei dem göttlichen Richter Brauch, um entweder Reue zu wecken und zu retten oder um in der Bestrafung die Gerechtigkeit schärfer zu betonen. Darüber wurden wir damals unwillig und fürchteten für die Zukunft, da wir es nicht verstehen konnten, daß sich Gottes Barmherzigkeit für die Seinen vorerst noch verhüllt habe. Daher wandten wir uns an Gott und zwar teils, um ihn als Herrn anzurufen, teils um ihn als gütigen Vater anzuflehen, teils um ihm nach Art der Querulanten Vorhalt zu machen und mit ihm zu rechten. „Warum (riefen wir) hast du, o Gott, uns immerfort verstoßen? Warum zürnest du den Schafen deiner Weide? Gedenke deiner Gemeinde, die du von Anfang an erworben hast“, die du durch die Leiden deines eingeborenen Sohnes dir zu eigen gemacht, des großen Bündnisses gewürdigt und durch das neue Geheimnis und „das Angeld des Geistes“ in den Himmel erhoben hast. Und wir riefen: „Erhebe deine Hände wider ihren endlosen Hochmut!“ und erinnerten an all das Böse, das die Feinde wider deine Heiligen getan hatten, und wie sie sich wider deine Feste rühmten. Wir forderten das Schwert und die Plagen Ägyptens, verlangten, daß Gott sein Recht vertrete, und erklärten, er müsse nun endlich einmal sich gegen die Gottlosen erheben. Wir sagten: „Wie lange noch, o Herr, wie lange werden sich die Sünder brüsten, dein Volk demütigen, dein Erbe bedrängen, Gesetzlosigkeit verkünden und Gesetzlosigkeit tun?“ Ja, wir sprachen auch das folgende, noch bezeichnendere Klagewort: „Uns hast du gemacht für die Nachbarn zum Widerspruch und zur Verachtung, für die Heiden zum Sprichwort, für alle Menschen zum Gelächter.“ Wir sprachen auch von einem „Weinberge, der aus Ägypten verpflanzt wurde“, aus der Finsternis der Gottlosigkeit, und der zur Schönheit und Größe des Glaubens heranwuchs, sodann aber des Zaunes, der einige Zeit währenden, uns schützenden Aufsicht Gottes, beraubt wurde, allen Passanten, schlimmen Tyrannen, offen stand, und von Wildschweinen, den Sündern, welche in der Sünde zu Hause sind und vom Schmutze der Sünde strotzen, verwüstet wurde.</p><p>So dachte ich früher und rief ich früher zu Gott. Wie habe ich aber nunmehr meine Stimme geändert! Jetzt weine ich über den Untergang der Gottlosen, habe Mitleid mit den Feinden und sage: „Wie sind sie geworden zur Einsamkeit! Plötzlich sind sie dahingesunken, sind ihrer Sünden wegen zugrundegegangen, sind geworden wie der Sand, den der Orkan erfaßt, wie der Staub, der vom Winde fortgetragen wird, wie der Morgentau, wie das Schwirren des abgeschossenen Pfeiles, wie der gewaltige Donner, wie der leuchtende Blitz!“ Wenn sie nun ihre Gesinnung ändern, von ihrem vielen Irrtum und ihrer vielen Unbesonnenheit lassen, und dafür den Weg der Wahrheit wandeln, so haben sie doch wohl Gewinn von ihrem Sturze. Züchtigung ist ja oft für die Betroffenen ein Vorteil. Würden sie aber bei ihrer alten Lehre verharren und weiterhin an den Götzen festhalten, so würden sie nicht einmal im Unglück, wo selbst Einfältige sich belehren lassen, vernünftiger werden. Jeremias hatte so sehr über Jerusalem geweint, daß er selbst den leblosen Dingen befahl, zu weinen und die Mauern aufforderte, zu klagen. Welche Klagen aber könnten genügen anläßlich der jetzigen Erlebnisse? Oder wer könnte über die Gegenwart weinen, ohne zu klagen über die bevorstehenden Strafen dafür, daß sie töricht gehandelt hatten, abgewichen waren und „dem Geschöpfe mehr gedient hatten als dem Schöpfer“, ja sich auch gegen die, welche Gott dienten, erhoben und wider sie ihre sündhafte, solcher Strafe würdige Hand ausgestreckt hatten?</p><p>Es soll so sein, wie es Gott gefällt! Wer weiß, ob nicht Gott, der „die Gefesselten befreit“ und den Beschwerten und Niederblickenden aus „den Toren des Todes“ herausführt, der „nicht den Tod des Sünders, sondern seine Umkehr will“, der auch uns, als wir noch „in der Finsternis und im Schatten des Todes saßen“, erleuchtet und belehrt hatte, sich auch noch einmal dieser annehmen und sie, die schwere, eiserne Rute beiseite legend, mit seinem Hirtenstabe weiden wird? Noch ein neues Siegeslied will ich anstimmen: „Beel ist gefallen, Dagon gestürzt, Saron ist zur Wüste geworden und der Libanon mit Schmach bedeckt.“ Nicht mehr soll man Toren, nicht mehr der leblosen, gefühllosen Schar der Götzen die Herrschaft überlassen. Und nicht wird man „nach der Fliegengöttin Akkaron fragen“ oder nach etwas, was noch lächerlicher ist als sie. Nicht mehr werden sie sich um Haine, Höhen und all die waldreichen und schattigen Berge kümmern. Nicht mehr werden sie ihre Söhne und Töchter den Dämonen opfern, was dereinst Israel von den Propheten zum Vorwurf gemacht worden war. Doch wozu diese Erinnerungen? Wenden wir uns der Gegenwart und unseren eigenen Verhältnissen zu! Nicht mehr wirft man sündhafte Blicke in unsere heiligen Kirchen. Nicht mehr befleckt man mit unheiligem Blute die Altäre, welche nach dem heiligsten, unblutigen Opfer genannt sind. Nicht mehr schändet man geweihte Orte durch heidnische Altäre. Nicht mehr raubt und entheiligt man in götzendienerischer Habgier die geweihten Gegenstände. Nicht mehr verspottet man das graue Haar der Priester, die Würde der Diakonen, die Keuschheit der Jungfrauen. Nicht mehr läßt man schmutzige Schweine auf zerfleischte Christen, damit sie sich bei der Fütterung auch mit deren Fleisch sättigen. Nicht mehr zündet man die Denkmale der Märtyrer an, durch welche Freveltat man andere hatte vom Martyrium abhalten wollen. Nicht mehr verbrennt man die Reliquien der Märtyrer wie wertlose Knochen, nicht mehr übergibt man (deren Asche) den Winden, um die Reliquien der schuldigen Ehre zu berauben. Nicht mehr errichtet man Stühle der Pest und freut sich, Bischöfe, Priester, Propheten und Apostel, ja Christus selbst, zu schmähen. Nicht mehr triumphiert man über uns und erläßt Gesetze, welche uns von der falschen Bildung ausschließen sollen, gerade als hätte man dadurch auch unsere Zungen zum Schweigen bringen können.</p><p>Lasse deine kaiserlichen, sophistischen Reden, deine zwingenden Schlüsse, deine Erwägungen! Wollen wir sehen, was unsere Fischer und Bauern zu sagen haben! „Ändere den Ton deiner Gesänge und dein Harfenspiel!“ befiehlt dir mein Prophet. David möge wieder in Freiheit singen, er, welcher den Riesen Goliath mit den vielsagenden Steinen schlug, viele durch seine Güte überwand und Saul, als er vom bösen Dämon umstrickt war, durch seinen versöhnenden Geist heilte! Der Fackelträger möge das Feuer auslöschen! Die klugen, heiligen Jungfrauen mögen ihre Lampen für den Bräutigam anzünden! Der Hierophant möge das unsaubere Gewand ausziehen! Ihr Priester, ziehet Gerechtigkeit und statt des Geistes der Widerwärtigkeit das Kleid der Herrlichkeit an, ziehet Christum an, das große, fleckenlose Gewand, unseren Schmuck!</p><p>Dein Herold möge seine schändlichen Worte unterlassen! Der meine möge die göttlichen Worte sprechen! Beseitige deine Zauber- und Wahrsagebücher! Nur noch die Bücher der Propheten und Apostel sollen aufgeschlagen werden! Gib deine schändlichen Nächte voll Finsternis auf! Heilige, ständig helle Nächte will ich dafür geben. Versperre deine Heiligtümer und die Wege, die zur Hölle führen! Ich will die hellen Wege zum Himmel weisen. Hätten große Waffenrüstungen und Erfindungen von Kriegsmaschinen, hätten Menschenmassen und Truppen das wirken können, was unsere Gebete und Gottes Wille vermocht haben? Durch sein Wort hat Gott die Finsternis zerstreut, durch sein Wort das Licht erschaffen, die Erde gefestigt, den Himmel gerundet, die Sterne aneinandergereiht, die Luft ausgebreitet, dem Meere die Grenzen, den Flüssen die Läufe gegeben, die Lebewesen beseelt, den Menschen sich ähnlich gestaltet, alles geordnet. Durch sein Wort hat er auch die gegenwärtige Finsternis verscheucht und allem Licht, Ordnung und Einigkeit verliehen. Nicht mehr haben lüsterne, trügerische Dämonen die Gewalt. Nicht mehr wird die Schöpfung unter dem Vorwande der Ehrung geschändet, nicht mehr wird sie statt des Schöpfers angebetet. Vernichte die Gestalten eines Triptolemus, eines Celeus und die geheimnisvollen Drachen! Schäme dich endlich der Bücher deines Gottesgelehrten Orpheus! Benütze das Geschenk, das dir die Gegenwart bietet, welche deine Schmach verhüllen will! Um zu sehen, ob du nur Mythen und Dichtungen hattest, will ich dir deine nächtlichen Geheimnisse aufdecken.</p><p>Nicht mehr sprechen die Eichen, nicht mehr prophezeit der Krug* (λέβης)* [lebēs]. Nicht mehr ist Pythia voll von allen möglichen Mythen und Schwätzereien. Kastalia ist wieder zum Schweigen gebracht und schweigt; nicht mehr raunt ihr Wasser, man lacht darüber. Wiederum ist Apollo die stumme Statue. Wieder wird der Daphnebaum im Mythus beklagt. Wieder ist Dionysus das Zwitterwesen, das sich mit einem Chore von Trunkenen umgibt, und ist dein großes Geheimnis der Gott Phallus, der sich dem schönen Proshymnus zuneigt. Wieder wird Semele vom Blitze getroffen. Hephaestus hinkt wieder auf beiden Füßen und ist gleichwohl wieder bei Ehebruch schnell zur Stelle und ist wieder trotz seiner Kunstfertigkeit der rußige Gott und der olympische Thersites. Wiederum ist Ares wegen Ehebruchs mit Deimos (Schrecken) und Phobos (Furcht) und den Kydoimen (Schlachtengetümmel) gefesselt und wegen seiner Frechheit verwundet. Wiederum ist Aphrodite die schändlich geborene Buhlerin, die Beschützerin schmählicher Verbindungen. Wiederum ist Athene die Jungfrau, welche einen Drachen geboren hat. Wieder rast Herakles, bzw. rast nicht mehr. Wieder geht Zeus, der Berater der Götter und ihr oberster Herr, der allein alle Götter samt allem zu sich emporzieht, obwohl er von keinem herabgezogen werden kann, alle möglichen Verwandlungen aus Geilheit und Schlechtigkeit ein. Wieder wird das Grab des Zeus auf Kreta gezeigt. Sooft ich deinen Kerdoos und Logios und Enagonios sehe, verhülle ich meine Augen und eile aus Schamgefühl an deinem Gott vorbei. Verehre meinetwegen das feurige Wort und den Sack! Achtung magst du haben allein vor den Ehrungen, welche bei den Ägyptern durch Eunuchen dem Nil zuteil werden, vor den Isisgestalten, den göttlichen Böcken und den Stieren und all den übrigen, sonderbar zusammengesetzten Tieren, welche du dir einbildest oder über welche du schreibst. Ich lache über deinen Plan, Priapos, Hermaphroditos und die Götter, welche aus Wahnsinn verstümmelt oder zerstückelt worden sind. Doch ich will diese Gestalten der Bühne und den ausschmückenden Dichtern überlassen. Mit einer Mahnung will ich meine Rede schließen.</p><p>Männer und Frauen, Jünglinge und Greise, ihr alle, die ihr den Vorzug habt, an diesen Altar zu treten, und ihr alle, die ihr unten eingeordnet seid, alle vom Herrn zuerst aus Irrtum und Gottlosigkeit, nunmehr aber aus heidnischer Bedrängung und aus gegenwärtigen und erwarteten Übeln Erlösten, höret auf die Worte eines Mannes, den die täglichen Erfahrungen, die Geschichte, Bücher und Taten genügend unterrichtet haben! Nichts Mißliches erfahren zu haben, ist etwas Großes, bzw. es ist nichts Großes, wenn das Wort wahr ist: „Wen Gott lieb hat, züchtigt er, er schlägt jedes Kind, das er annimmt und an dem ihm gelegen ist.“ Etwas wahrhaft Großes ist es, überhaupt nicht oder nicht schwer zu sündigen. Denn den, welcher vollständig von Sünden frei ist, hat Gott über die menschliche Natur erhoben. Das Nächstgroße aber ist, wie ich glaube, daß die, welche wegen Fehltritte gezüchtigt wurden, sich emporarbeiten und in der Gewalt des Erziehers bleiben und nicht durch neue Sünden in neue Strafen fallen.</p><p>[Forts. v. ] Nun müssen auch wir auf die göttliche Züchtigung achten. Zeigen wir uns würdig nicht dessen, was wir früher erlitten haben, sondern dessen, was wir später erhalten haben! Eine gewisse Verteidigung ist notwendig wegen des Unglückes, das uns ereilt hatte; denn nicht, weil wir Missetäter waren, sind wir den Heiden ausgeliefert worden, sondern als Kinder sollten wir erzogen werden. Vergessen wir nicht in der Ruhe den Sturm, nicht in gesunden Tagen die Krankheit, nicht die Gefangenschaft, da wir wohlbehalten nach Jerusalem zurückgekehrt sind, nicht Ägypten, weil wir es hinter uns haben! Die sittlichen Verhältnisse in der Zeit der Drangsale sollen nicht besser sein als in der Zeit der Ruhe! Sie wären es aber, wenn wir, nachdem wir uns damals demütig und züchtig gezeigt und alle Hoffnung auf den Himmel gesetzt hatten, nunmehr hochmütig und aufgeblasen wiederum in die gleichen Sünden verfielen, durch welche wir in das Unglück gestürzt worden waren. „Nicht so, nicht so, meine Kinder!“ ruft einmal der Priester Heli mahnend seinen gegen Gott sündigen Söhnen zu. Merken wir uns: Es ist leichter, ein entschwundenes Glück von neuem zurückzurufen, als sich Gottes Segen zu erhalten, weil jenes durch Besonnenheit wiedererlangt wird, dieses aber durch Leichtsinn verlorengeht, und ein kranker Körper erholt sich bei Pflege und Diät, bricht aber trotz der Genesung bei Sorglosigkeit und Übersättigung allmählich wieder zusammen, um in die alte Krankheit zurückzufallen. Dies wollen wir uns merken, wollen einander belehren, um Herr über uns zu werden und die Zeit mäßig zu genießen.</p><p>Zunächst, Brüder, wollen wir unsere Feste nicht in äußerem Glanze, nicht in besonderen, kostbaren Kleidern, nicht in Gelagen und Schmausereien feiern, deren Früchte, wie ihr wißt, Sinnlichkeit und Schlechtigkeit sind. Nicht wollen wir unsere Wege mit Blumen bestreuen, nicht die Tische und Vorhöfe mit entehrenden Salben parfümieren. Nicht sollen irdische Lichter die Häuser erleuchten, noch sollen diese widerhallen von Flötenspiel und Lärm. So werden nämlich die heidnischen Festmonate begangen. Wir aber dürfen Gott nicht in solcher Weise ehren. Nicht in unwürdiger Form, sondern mit reiner Seele und leuchtendem Geiste, mit Lichtern, die den ganzen Körper der Kirche erleuchten, d. i. mit göttlichen Erwägungen und Gedanken, welche auf den heiligen Leuchter gestellt sind und der ganzen Welt Licht geben, wollen wir Festzeiten halten. Im Vergleich zu diesem Lichte ist alles unbedeutend, was die Menschen bei ihren privaten und öffentlichen Feiern anzünden. Auch ich habe eine Salbe. Doch mit ihr werden nur Priester und Könige gesalbt. Sie ist verschiedenartig und kostbar. Unsertwegen wird sie gebraucht. Von der Kunstfertigkeit eines großen Salbenhändlers wird sie hergestellt. Könnte ich doch den Wohlgeruch dieser Salbe Gott opfern! Auch einen Tisch habe ich. Es ist unser geistiger, göttlicher Tisch, den „mir der Herr bereitet hat gegen meine Bedränger“, an dem ich ruhe und mich labe; sein Überfluß läßt mich nicht ausarten, sondern beruhigt im Gegenteil jede aufwallende Leidenschaft. Auch Blumen habe ich. Sie sind lieblicher und haltbarer als alle Frühlingsblumen. Sie wachsen auf dem „üppigen Felde, das der Herr gesegnet hat.“ Es sind die heiligen, wohlriechenden Hirten und Lehrer und das ganze reine, auserwählte Volk. Mit diesen Blumen will ich geschmückt und geziert werden, nachdem ich ― um mit dem heiligen Paulus zu sprechen ― „den guten Kampf gekämpft, den Lauf vollendet, den Glauben bewahrt habe“. Wir wollen nicht Pauken, sondern Hymnen, nicht schändliche Rhythmen und Lieder, sondern Psalmengesänge, nicht Bühnenlärm, sondern laute Danksagung und wohlklingendes Händeklatschen, nicht Gelächter, sondern ernste Gesinnung, nicht Trunkenheit, sondern Besonnenheit, nicht Weichlichkeit, sondern Würde. Mußt du als Festteilnehmer dem Feste zuliebe tanzen, dann tanze, aber nicht nach Art der Herodias, welche den Tod des Täufers verschuldet hatte, sondern wie David bei der Überführung der Lade, der, wie ich glaube, die schönen, verschiedenartigen Bewegungen derer, die Gottes Wege wandeln, veranschaulichen sollte. Dies ist meine erste und wichtigste Mahnung.</p><p>Die zweite Mahnung wird, wie ich überzeugt bin, ihre Schwierigkeiten haben und von den meisten nicht gerne angenommen werden. Wer nämlich die Möglichkeit hat, jemandem mit Bösem zu vergelten, zumal wenn er wegen böser Erfahrungen mit Recht erzürnt ist, liebt es keineswegs, sich den Zügeln des den Unmut bändigenden Wortes zu fügen. Gleichwohl geziemt es sich, die Mahnung zu hören und entgegenzunehmen. Lassen wir die Zeit nicht nutzlos verstreichen! Mißbrauchen wir nicht unsere Freiheit! Seien wir nicht erbittert auf die, welche uns Unrecht getan hatten, damit wir nicht in die gleichen Fehler fallen, die wir verurteilt hatten! Nachdem sich für uns die Lage glücklich geändert hat und wir den Schrecken entronnen sind, wollen wir alles verabscheuen, was an Rache erinnert! Normale Menschen sind sich selber Richter: sie sind in Angst wegen der Leiden, die sie angetan haben, sie erwarten gebührende Strafe und werden von ihrem eigenen Gewissen gequält. Die Leiden, die einer erst fürchtet, leidet er schon, auch wenn sie noch nicht verhängt sind; noch mehr wird er wohl durch sich als durch die Henker bestraft. Nicht wollen wir nach Zorn verlangen, auch wollen wir nicht als zu gute Richter erscheinen. Wir wollen vielmehr, da wir nicht alles einfordern können, alles verzeihen. Auf solche Weise wollen wir die, welche uns Unrecht getan hatten, übertreffen und überbieten. Wir wollen es erkennen lassen, was jenen von den Dämonen gelehrt wurde und was dagegen Christus uns lehrt, welcher zwar schon durch sein Leiden sich bewährt hatte, aber ebensosehr dadurch gesiegt hatte, daß er das nicht tat, was er hätte tun können. Vergelten wir es Gott dadurch in Dankbarkeit, daß wir durch Tugendhaftigkeit das Geheimnis vermehren und dazu die Zeit ausnützen!</p><p>Lasset uns unsere Tyrannen durch Nachsicht besiegen! Nachgiebigkeit erfolge vor allem aus Liebe! Die Kraft des Gebotes vergilt uns die Liebe in allem, worin wir sie nötig haben. Wir wissen ja, daß uns mit dem gleichen Maße gemessen wird, mit welchem wir messen. Ist einer ganz unausstehlich, dann überlassen wir unsere Beleidiger Gott und dem jenseitigen Gerichte. Unsere Hände sollen den kommenden Zorn nicht verringern! Sinnen wir nicht auf Konfiskation, zitieren wir nicht vor die Gerichte, verbannen wir nicht, strafen wir nicht durch Geißeln, tun wir ― um mich kurz zu fassen ― nichts von dem, was wir an uns erfahren mußten! Machen wir, soweit es möglich ist, durch unser Beispiel unsere Feinde milder gestimmt! Hatte einer einen Sohn, den Vater, die Frau, einen Verwandten, einen Freund oder sonst einen Vertrauten unter den Märtyrern, dann wollen wir allen den Schmerz wertvoll und verdienstlich gestalten, indem wir sie zum geduldigen Ertragen ermuntern! Wir können ihnen keinen größeren Gefallen erweisen. Soll ich noch auf unsere Erfahrung hinweisen? Volk und Städte verurteilen unsere Verfolger in Theatern, auf Märkten, in Versammlungen. Was früher gepriesen wurde, wird nunmehr geschmäht. Gerade von denen, welche die Verfolgung mitgemacht haben, werden ― es klingt unglaublich ― unter allen möglichen Verspottungen die Götter gestürzt; lange seien sie von diesen an der Nase herumgeführt worden und erst spät würde ihr Betrug bestraft. Können wir etwas Wunderbareres ausfindig machen? Für erbärmliche Menschen allerdings mag es vielleicht eine Kleinigkeit sein. Es kommt noch die Stunde, da ich sehen werde, wie meine Feinde und ihr großer Führer über ihre Sünden weinen, die Stunde, da jede Bosheit gerichtet und bestraft wird.</p><p>[Forts. v. ] Ich spreche nicht weiter von den Züchtigungen, welche Gott über uns verhängt und welche, wie ich sagte, (die Bösen) im Jenseits erwarten. Erinnere dich an deine eigenen schrecklichen Lehren, woran nicht nur Dichter, sondern auch Philosophen ihre Freude haben! Ich denke an deine Pyriphlegethontes, die Kokytoi, die Acherontes, wo Tantalus, Tityus, Ixion büßen, Euer Kaiser Julian gehört zu derselben Gesellschaft. Diesen wird er beigezählt werden, ja er wird nach meinem Dafürhalten sie noch übertreffen. Nicht wird er, bis zum Kinne im Wasser stehend, mit Durst bestraft, nicht hat er ― wie es in einer Tragödie heißt ― einen überragenden drohenden Felsen zu fürchten, der, sooft er hinaufgewälzt wird, immer wieder hinabrollt, nicht wird er von sausendem Rade gedreht, nicht wird ihm von Vögeln die Leber in einer Weise gefressen, daß diese nie weniger wird, sondern stets bleibt. Mögen diese Erzählungen Wahrheit oder Mythus sein, hinter der Dichtung steckt Wahrheit. Wir werden es sehen, daß er dereinst noch viel schwerer bestraft wird als die genannten Männer, wenn anders Strafe und Vergeltung sich nach der Größe der Sünden richten.</p><p>Weisester Freund ― um dich mit deinen Worten anzureden ―, solche gastfreundlichen Geschenke erwarten dich für deinen Fuß. So antworten dir wir, welche du durch deine große, wunderbare Gesetzgebung von der Bildung ausgeschlossen hast. Siehst du es, daß wir nicht ständig schweigen müssen, daß wir durch deine Dekrete nicht zur Unwissenheit verurteilt sind, daß vielmehr unser Wort frei deine Unwissenheit kritisiert? Wie es nicht möglich ist, die Stromschnellen des Nil, welche von Äthiopien über Ägypten stürzen, oder die Strahlen der Sonne, mögen sie auch gelegentlich durch Wolken verhüllt werden, aufzuhalten, so ist es unmöglich, die Zunge der Christen zu binden, daß sie nicht eure Verhältnisse tadle. Basilius und Gregor, deine Gegner und Rivalen, wofür du selber sie hieltest und wovon du andere überzeugtest, als du uns durch deine Drohungen ehrtest und erst recht zur Frömmigkeit anhieltest, waren, wie du schon in Griechenland erfahren hattest, bekannt und berühmt durch ihre Lebensführung, ihre Reden, ihre Einmütigkeit. Nach Zyklopenart hast du sie geehrt und sie bis zuletzt für die Verfolgung aufbewahrt. Du dachtest wohl daran, sie den Dämonen zum Dank für den Sieg als große, herrliche Opfer zu weihen, sobald wir dich nach deiner Rückkehr aus Persien empfangen würden, bzw. hofftest du in deinem falschen Glauben, sie mit dir in den Abgrund zu stürzen.</p><p>Wir sind nicht weniger edel gesinnt als jene jungen Männer, welche mitten im Feuer von Tau erquickt wurden, durch ihren Glauben Tiere überwältigten, sich mit ihrer edlen Mutter und ihrem noch edleren Priester willig in Gefahr begaben und zeigten, daß der Glaube ganz allein es ist, der nicht besiegt werden kann. Nicht stehen wir zurück gegenüber jenen unter deiner Regierung lebenden jungen Männern, von denen der eine wegen Verachtung der Mutter deiner Götter und wegen Zerstörung eines Altares wie ein Missetäter zitiert wurde, aber wie ein Sieger unter wiederholter Verspottung deines Purpurs und deiner minderwertigen, lächerlichen Reden auftrat, um mit noch größerem Freimut abzutreten, gleich einem, der vom Essen und von glänzender Bewirtung nach Hause zurückkehrt, und von denen der andere, obwohl er durch Geißelstreiche am ganzen Körper zerfleischt war und infolge der Verwundung nur noch wenig atmen konnte, doch den Qualen so wenig nachgab und so wenig auf die Gegenwart achtete, daß er, als er merkte, daß sein Leib an einer Stelle unverletzt blieb, seinen Peinigern schwere Vorwürfe machte, weil sie nicht seinem ganzen Körper Ehre angetan, sondern ihn zum Teil verschont und der Heiligkeit beraubt hätten, wobei er das Bein, welches allein verschont blieb, sehen ließ mit der Forderung, auch es nicht zu schonen.</p><p>Nimm diese Worte hin an Stelle der Lügen und Faseleien des Prophyrius, an denen ihr eure Freude habt, wie wenn es göttliche Worte wären, oder an Stelle deines Misopogon oder der Antiochenischen Rede, wie du auch deine Schrift betitelst! Was ist in den Augen der Christen wertloser als diese Schrift! Dein Purpur und die all dein Tun bewundernden Schmeichler hatten ihr viel Ansehen verschafft. Nun aber ist die Schrift ein Pogon (Bart), der ringsum gezogen und gezupft wird und über den man sich wie über die Miturheber der Schrift lustig macht. In der Schrift rühmst du dich sehr der körperlichen Diät und daß du niemals dir durch Übersättigung Verdauungsbeschwerden zugezogen habest, gerade als ob du damit etwas Wunderbares sagen würdest; mit Absicht aber schweigst du über deine bittere Christenhetze, in der du ein so bedeutendes und heiliges Volk zwecklos hinopfern wolltest. Wenn nun ein einziger sich aus Verdauungsbeschwerden ergeben hat, welchen Schaden hat dabei die Gesamtheit? Da du aber solche Verfolgung veranlaßt und solche Erschütterungen verschuldet hast, mußte da nicht naturnotwendig der römische Staat Schaden leiden, wie er offenbar auch Schaden gelitten hat?</p><p>[Forts. v. ] Hiemit haben wir gegen dich eine Säule errichtet, welche höher und bedeutender ist als die Säulen des Herakles. Diese stehen an einer bestimmten Stelle und können nur von denen gesehen werden, die dorthin gehen. Jene aber ist beweglich und kann überall von allen geschaut werden. Wie ich sicher weiß, übernimmt die Zukunft diese Säule, die da dich und deine Geschichte richtet, um alle dazu zu erziehen, daß sie nicht in gleicher Weise sich gegen Gott zu erheben wagen und nicht durch gleiches Tun gleiches Schicksal ernten.VI. Rede</p><h2>VI. Rede</h2><p><em>VI. Rede.</em></p><p><em>Erste Rede über den Frieden</em>* und zwar mit den Mönchen, nach Beobachtung des Stillschweigens, gehalten in Gegenwart des Vaters*.</p><p>Meine Gutmütigkeit löst mir die Zunge, und das Gesetz des Geistes läßt mich über Menschenbräuche hinwegsehen. Dem Frieden weihe ich das Wort; nichts anderem habe ich es zuvor gewidmet. Denn als noch die Glieder gegen uns in Aufruhr waren und der große, ehrwürdige Körper Christi uneins und zerrissen war, so daß fast „unsere Gebeine im Totenreiche ausgestreckt dalagen“, gleich der Erde, die vom Pfluge tief aufgewühlt und auf dem Boden ausgebreitet wird, als der Böse noch das nicht zerschnittene, ungeteilte, vollständig gewobene Gewand auftrennte, um es sich ganz zu eigen zu machen, was ihm durch uns, nicht aber durch die, welche Christum gekreuzigt hatten, möglich wurde, da gab ich eine Sperre meiner Zunge, die nicht gewöhnt ist, ohne weiteres zu sprechen; denn ich glaubte, ein geordnetes Geistesleben verlange, daß ich zunächst durch die Philosophie der Tat mich reinige, alsdann den Mund des Verstandes öffne, um Geist einzuatmen und schließlich ein gutes Wort zu reden und Gottes vollkommene „Weisheit unter den Vollkommenen zu verkünden“. Wie nach dem trefflichen und sehr weisen Ausspruche Salomons jedes Ding, das kleine wie das große, seine Zeit hat, so wußte ich so gut wie ein anderer, daß es auch eine Zeit des Redens und eine Zeit des Schweigens gibt.</p><p>Deshalb wurde ich stumm; allem Guten fernegerückt, entsagte ich. Eine Wolke zog sich gleichsam über meine Seele und verhüllte den Strahl meiner Rede. Tag und Nacht lebte mein Schmerz neu auf. Brennende Erinnerungen an die Trennung der Brüder war mir alles, waren mir ihre Nachtwachen, ihre Fasten, ihre Gebete, ihre Tränen, die Schwielen an den Füßen, das Schlagen an die Brust, das tiefe Seufzen, die nächtlichen Stationen, das geistige Verweilen bei Gott, das stille Weinen während des Betens, für die Hörer Anlaß zur Verdemütigung, ihre Psalmengesänge, ihre Lobpreisungen, ihr Tag und Nacht dauerndes Betrachten im Gesetze des Herrn, ihre Verherrlichung Gottes. Dazu gehörten auch die folgenden schönen Anzeichen und Äußerungen eines Lebens in Gott: Die schweigenden Führer, das struppige, ungepflegte Haar, die bloßen Füße, welche es den Aposteln nachmachen wollen und nichts Irdisches tragen, die tadellose Tonsur, das Gewand, welches keine Hoffart zuläßt, der Gürtel, dessen Schmuck die Schmucklosigkeit ist und der das Kleid nur etwas und fast unbemerkbar aufschürzt, der gemessene Schritt, der nicht umherschweifende Blick, das freundliche Lachen bzw. die lächelnden Züge, welche übermäßiges Lachen zurückhalten, die vom Verstand geleiteten Worte, das Schweigen, noch kostbarer als das Reden, das mit Salz gewürzte, nicht schmeichelnde, sondern bessernde Loben, die Zurechtweisung, wünschenswerter als schöne Worte, das ausgleichende Maßhalten im Niedergeschlagensein und Sichgehenlassen, jene Vereinigung von Zartheit und Edelmut, von Strenge und Rücksichtnahme, die keinem schadet, sondern jedem sein gutes Recht läßt, die kluge Abwechslung von Gesellschaft und Zurückgezogenheit, um einesteils den Nächsten zu erziehen, andernteils in die Geheimnisse des Geistes eingeweiht zu werden und um einerseits in der Gesellschaft nicht das Individuelle, anderseits in der individuellen Abgeschlossenheit nicht die sozialen Aufgaben zu vergessen, ferner, was noch wichtiger und bedeutender ist, der Reichtum der Armen, der Besitz der Fremdlinge, die Ehre der Verachteten, die Kraft der Schwachen, der Kindersegen der Ehelosen, soferne Gottes Kinder höher stehen als fleischliche Kinder, das Schwelgen im Verzichten, die Erniedrigung um des Himmels willen, das Leben auf der Welt, ohne in ihr zu leben, das Wohnen im Fleische, um mit Christus außerhalb des Fleisches zu wohnen, die Armut um des Reiches willen und die Herrlichkeit infolge der Armut.</p><p>Diese Mönche, mein Reichtum und meine reine Lust, haben mich, solange sie bei uns waren, erfreut, solange sie aber ferne waren, verstimmt. Ihr Handeln hat mich geärgert und aufgeregt. Deshalb ging ich „traurig und finster“ einher. Deshalb verzichtete ich wie auf andere Freuden so auch auf das Reden. Denn die Geliebten schlugen aus und „wandten mir statt des Angesichtes den Rücken zu“ und wurden ― um mich eines stärkeren Ausdruckes zu bedienen ― eine Herde, die freier war als ihr Hirte. Der wahre Weinstock, der von tüchtigem Winzer aufs beste gereinigt worden war und sein herrliches Erträgnis an die göttlichen Keltern abgeliefert hatte, verwandelte sich mir in Bitterkeit. „Meine Freunde und Verwandten kamen und traten wider mich auf und die, welche mir zunächst gewesen waren, blieben ferne von mir stehen“. Wir, die wir so sehr Gott und Christus liebten, haben Christus geteilt. Um der Wahrheit willen haben wir einander belogen, um der Liebe willen haben wir Haß gesonnen, wegen des Ecksteines haben wir uns entzweit, und wegen des Felsens ließen wir uns erschüttern. Mehr, als recht war, haben wir um des Friedens willen Krieg geführt, um dessen willen, der am Kreuze erhöht wurde, sind wir gefallen, und wegen dessen, der begraben wurde und auferstand, haben wir uns getötet.</p><p>Zunächst folgendes! Warum soll man an heiteren Tagen Widerwärtigkeiten auffrischen und in Trauer verweilen? Man soll sie vielmehr verwünschen und es meiden, sich daran zu erinnern. Statt darüber zu sprechen, wollen wir lieber darüber schweigen und das Unheil in die Tiefen des Vergessens versenken. Nur aus dem einen Grunde könnte man die Erinnerung an das Leid wachrufen, damit wir nämlich durch Erfahrung klug werden und wie der genesene Kranke das meiden, was uns ins Leid gestürzt hat. Da nunmehr „Leid, Schmerz und Klagen schwanden“, da wir, die Kinder des Einen, eins wurden, wir als Kinder der Dreieinigkeit Natur, Geist und Ehre teilten, als Kinder des Logos die Torheit ablegten, als Kinder des Geistes nicht gegen-, sondern miteinander erglühten, als Kinder der Wahrheit* eines* Sinnes und* einer* Rede wurden, als Kinder der Weisheit Verstand annahmen, als Kinder des Lichtes „ehrbar wie am Tage wandelten“, als Kinder des Weges gemeinsam den geraden Weg gingen, als Kinder der Türe alle im Innern blieben, als Kinder des Lammes und des Hirten sanft wurden und in* einen* Stall und unter* einen* Hirten traten, welcher nicht „in der Ausrüstung eines ungeschickten Hirten“ weidet, die Herde nicht der Weide beraubt und sie nicht Wölfen und Abgründen überläßt, sondern sehr umsichtig und verständig ist, da wir ferner als Kinder dessen, der für uns gelitten hat, Mitleid zeigten und einander die Lasten trugen, als Kinder des Hauptes zu einem einzigen, organischen, einheitlichen Körper wurden, wie es die Vereinigung im Geiste erforderte, da der, welcher alles macht und zum besten lenkt, uns den Schmerz in Freude verwandelte und das Bußkleid mit Wonne vertauschte, nehme ich von Vergangenheit und Schweigen Abschied, weihe ich mich der Gegenwart und meine Rede euch, bzw. Gott, um ihm zu danken und ihm ein gebührendes Opfer zu bringen, ein Geschenk, das reiner ist als Gold, wertvoller als Edelsteine, kostbarer als Gewebe, würdiger als das Opfer des (mosaischen) Gesetzes, heiliger als das Opfer der Erstgeburt, Gott wohlgefälliger als ein junges Rind mit noch nicht entwickelten Hörnern, Klauen und Sinnen, wohlgefälliger als Rauchopfer, als Brandopfer, als Tausende von fetten Widdern ― Opfer, durch welche das als Vorschule dienende Gesetz das noch unmündige Israel festhielt, durch die blutigen Opfer das kommende Opfer schattenhaft andeutend.</p><p>Gott opfere ich, ihm weihe ich, was allein mir noch übriggeblieben ist, worin allein ich reich bin. Alles andere nämlich habe ich für das Gebot und für den Geist hingegeben. Die kostbare Perle habe ich gegen alles, was ich je besaß, eingetauscht; ich wurde zum Großhändler, vielmehr, ich habe den Wunsch, der Großhändler zu werden, welcher um geringe, vollständig vergängliche Werte die großen, unzerstörbaren Schätze gekauft hat. Als Diener des Wortes halte ich mich nur noch an das Wort. Niemals dürfte ich mit Überlegung diesen Besitz vernachlässigen. Ja ich schätze ihn, liebe ihn und freue mich darüber mehr als über alle anderen Schätze zusammen, an denen die Masse ihre Freude hat. Das Wort nehme ich zum Begleiter in meinem ganzen Leben, zum guten Ratgeber, zum Genossen, zum Führer auf dem Wege in den Himmel, zum willigen Kriegskameraden. Da ich alle Freuden dieser Welt verachte, gehört nach Gott dem Worte alle meine Liebe. In höherem Grade aber gehört sie Gott; denn durch den Verstand führt das Wort zu Gott, der nur mittels des Wortes richtig erfaßt und festgehalten wird und in uns hineinwächst. Ich sagte der Weisheit, sie sei meine Schwester. Ich ehrte sie und erhob sie so hoch wie möglich. Für mein Haupt wünsche ich den Kranz der Anmut und Freude, d. i. die Gabe der Weisheit und des Verstandes, der die seelische Kraft, die uns führen soll, erleuchtet und die göttlichen Wege erhellt.</p><p>Mit dem Worte bändige ich die Ausgelassenheit, beruhige ich den verzehrenden Neid, stille ich den das Herz einschnürenden Schmerz, mäßige ich die Sinneslust, schränke ich den Haß, nicht aber die Liebe ein; denn der Haß braucht seine Schranken, die Liebe aber darf keine Grenzen kennen. Das Wort macht mich im Reichtum mäßig, in der Armut hochherzig. Es überredet mich, mit guten Läufern zu laufen und dem Fallenden die Hand zu reichen, mit dem Kranken zu leiden und mich mit dem Gesunden zu freuen. Begleitet mich das Wort, dann ist mir Vaterland und Fremde ein und dasselbe, und örtliche Veränderungen in der Fremde sind mir egal, nicht allerdings eine Verbannung aus der Heimat. Das Wort trennt mir die Welten; es entfremdet mich der einen und befreundet mich der anderen. Mit der Peitsche der Gerechtigkeit in der Rechten treibt mich das Wort, wenn ich mich nicht aufraffe, weiter und spannt noch die Hoffnung, die nicht zuschanden werden läßt, vor, um die Gegenwart durch die Zukunft zu erleichtern. Nunmehr begrüße ich durch das Wort meine Freunde und Brüder und bereite ihnen den Tisch des Logos und den nie sich leerenden Becher des Geistes, welche man nicht an irdischen Tafeln, die einen entkräfteten, unheilbaren Magen kitzeln, kennt.</p><p>„Ich schwieg. Soll ich immer schweigen? Ich wartete wie eine Gebärende. Soll ich immer warten?“ Die Geburt des Johannes löste Zacharias das Schweigen; denn nicht hätte es sich geziemt, daß der Vater der „Stimme“ bei ihrem Erscheinen geschwiegen hätte. Wie die Stimme, da sie nicht geglaubt wurde, die Zunge gelähmt hatte, so mußte sie nach ihrer Offenbarung dem Vater die Freiheit geben, dem die Stimme und der Leuchter als Vorläufer des Wortes und Lichtes verkündet und geboren worden war. Die günstigen Verhältnisse der Gegenwart, dieses herrlichste Schauspiel, die Einigung der zerstreuten Gotteskinder, die unter den gleichen Flügeln ruhen und einmütig in schöner, geistiger Eintracht das Haus Gottes betreten, lösen mir die Zunge und stärken meine Stimme gleich der einer Trompete. Nicht mehr bekämpfen wir uns, nicht mehr lassen wir uns vom Bösen so sehr täuschen und vergewaltigen und in der Finsternis, die er über uns gebracht hatte, in einer Weise seelisch niederringen, daß wir uns gewissermaßen am Unglück des Nächsten freuen und am Untergang der Brüder keinen Schaden für das Ganze erblicken. „Juda und Israel bestellen sich ein einziges Oberhaupt“, und Jerusalem und Samaria vereinigen sich im einen himmlischen Jerusalem. Nicht mehr gibt es eine Partei des Paulus, eine Partei des Apollo, eine Partei des Kephas; Hochmut war es, der dafür und dagegen aufgetreten war. Wir sind doch alle Kinder Christi.</p><p>[Forts. v. ] Nachdem ihr mich, wenn auch nicht wider meinen Willen, durch eure Liebe bezwungen habt und ich und das Wort bei euch sind, will ich eurem Wunsche gemäß sprechen, obwohl es mir Mühe kostet. Ich will Worte des Dankes und der Belehrung sprechen. Dies sind meine Dankesworte: „Wer wird von der Herrlichkeit des Herrn erzählen?“ Wer wird allen Ohren das allseitig begründete Lob verkünden? Denn „aus zweien ist eins geworden und die trennende Zwischenwand ist niedergerissen.“ Denn du hast es gefügt, daß wir nicht mehr zum Gespötte der Heiden dienen, daß nicht mehr die Völker über uns das Haupt schütteln. Solange hast du uns gezüchtigt, bis wir in unserer Uneinigkeit die Wohltat des Friedens erkannten; nachdem du uns hattest den Schmerz fühlen lassen, hast du uns wiederhergestellt. Wunderbare Wege der Heilung! Du sorgtest dafür, daß wir möglichst bald den Haß haßten, und führtest uns so zum Frieden. Durch Gegensätze wirktest du. Du trenntest uns, damit wir um so sehnsüchtiger einander aufsuchten. Wenn Pflanzen gewaltsam von Menschenhänden abgebogen werden und dann wieder sich selbst überlassen bleiben, nehmen sie rasch wieder ihre alte Form ein; können sie, zuerst gewaltsam abgebogen, sich dann wieder frei aufrichten, so geben sie ihre Eigentümlichkeit zu erkennen. Nicht mehr verachtet die Hand das Auge, nicht mehr das Auge die Hand. Nicht mehr erhebt sich der Kopf wider die Füße, noch verkennen die Füße den Kopf. Nicht bringen oder vielmehr nehmen Schaden die Glieder durch Auflehnung und Widersetzlichkeit, welche den ganzen Körper vernichten und zerstören. In gleicher Weise sorgen die Glieder füreinander durch die vom Naturgesetz geforderte Unterordnung, welche alle Glieder gegenseitig zusammenfügt und erhält. Wir sind „<em>ein</em> Körper und* ein* Geist, da wir gerufen sind durch die eine Hoffnung der Berufung“.</p><p>Daher soll das arme Volk, welches aus Not zu Reichtum gelangt ist, dich loben! Denn wunderbar hast du dich unser erbarmt, und zu den Berichten der Alten fügen sich neue Erzählungen. „Wo die Sünde groß war, wurde die Gnade übergroß.“ Da ich Samen säete, erhielt ich Ähren; als ich wegen meiner Schafe weinte, erhielt ich sie und dazu noch Hirten. Wie ich wohl weiß, werde ich den würdigsten der Hirten haben, wenn er auch noch aus seelischen Gründen mit der Übernahme des Hirtenamtes zögert. Der Geist, das Wirken mit den Talenten, die Sorge für die Herde ist ihm anvertraut. Er ist mit dem Chrisma des Priestertums und der Vollendung gesalbt. Aus Weisheit schiebt er aber noch den Antritt des Amtes hinaus und stellt noch das Licht unter den Scheffel, das er aber bald auf den Leuchter stecken wird. Die ganze Seele der Kirche wird er erleuchten; auf unseren Wegen wird er ein Licht sein. Er durchforscht Wälder, Berge und Flüsse und legt den die Seelen raubenden Wölfen Netze, um zur rechten Zeit den Hirtenstab zu erlangen und zugleich mit dem wahren Hirten diese geistige Herde zu weiden, indem er sie unter seinen ewig grünen Worten auf Wiesenplätzen lagern läßt und mit erfrischendem Wasser, d. i. dem Geiste tränkt. Dies hoffen und wünschen wir. Nunmehr aber ist es Zeit, dem Danke auch die Mahnung beizufügen. Ich will sie möglichst kurz machen; denn größtenteils haben auch schon die Tatsachen belehrt, und, wer aus der Erfahrung klug geworden ist, bedarf nicht langer Lehren.</p><p>Zunächst hätte, Brüder, die Trennung unterbleiben und unser alter Ruhm und Stolz nicht verlorengehen sollen, welcher unsere, wenn auch kleine, nicht einmal recht nennenswerte Herde den größten und ausgedehntesten hatte an die Seite treten lassen; ich hatte sie sogar manchen Herden wegen ihrer Geisteskraft vorgezogen. Während sich andere Herden dieses oder jenes kleineren oder größeren Vorzuges hatten erfreuen können, war es tatsächlich eine besondere Eigenart unserer Herde gewesen, sich nicht zu spalten und nicht zu revoltieren, so daß sie oft als Arche Noes bezeichnet worden war, da sie allein der Sintflut der ganzen Welt entgangen war und die Samen der Frömmigkeit auf ihr noch erhalten hatte. Nachdem sich aber nun unsere Menschlichkeit gezeigt hat, wir nicht vollständig dem Neide des Bösen entronnen sind und nicht der alles beherrschenden Krankheit getrotzt haben, wir vielmehr durch Beteiligung an dem allgemeinen Elende das schöne und väterliche Erbe, das Gut der Eintracht, schließlich haben verlorengehen lassen, haben wir gleichwohl noch die anderen ― wenn man sich bezüglich seiner Feindschaft im Vertrauen auf Christus rühmen darf ― nicht wenig dadurch übertroffen, daß wir zuletzt gesunken, aber auch zuerst aufgestanden sind. Zu erkranken ist das gemeinsame Schicksal der Natur und ergibt sich aus der menschlichen Schwäche, die allen anhaftet, selbst denen, die körperlich und geistig sehr kräftig sind. Sich aber heilen zu lassen und wieder den Weg zum Nächsten zurückfinden, ist das Zeichen des Verstandes und der Gnade, welche gut und recht und über unsere Wünsche und die Hoffnungen der anderen hinaus für uns entschieden hat.</p><p>In Gnaden haben wir die Häupter aufgenommen, welche bereit waren, sich köpfen zu lassen, und den Schein erweckt hatten, als wären sie aus religiösen Gründen und, um der bedrohten Orthodoxie zu helfen, abgeschlagen worden. Nicht wie Feinde haben wir sie abgewiesen, sondern wir haben sie wie Brüder, die sich wegen eines väterlichen Erbes brüderlich, nicht böswillig etwas aufgeregt hatten, umarmt. Nicht haben wir sie wegen ihrer feindlichen Absonderung belobt, doch wegen ihres Eifers haben wir uns ihrer angenommen. Eine Zwistigkeit aus religiösen Gründen ist noch besser als sündhafter Friede. Trotz ihrer Separation kamen wir ihnen daher entgegen, überwanden ihre Abneigung gegen uns durch Liebe und ließen wider die Ordnung statt auf die Wahl die Weihe, auf die Weihe die Wahl folgen, fremden Händen das Recht der Weihe lassend; der Geist war uns gewissermaßen etwas zuvorgekommen. Ohne an den Buchstaben (des Gesetzes) zu denken, seid ihr zum Geiste geeilt. Euch an den Schein der Worte haltend, gabt ihr uns zwar nicht das Lob der Tadellosigkeit, vermutetet aber auch nicht Gottlosigkeit. Ihr wußtet ja, daß wir an der Trinität unerschütterlich festhalten und nichts von ihrem Wesen aufgeben, und daß etwas von der Trinität wegnehmen oder entfernen uns so viel ist als sie vollständig leugnen und mit entblößtem Haupte gegen die Gotteslehre überhaupt losziehen. Auch während der Trennung traten wir gelegentlich da und dort für sie ein, was der deutlichste Beweis dafür ist, daß die Wahrheit auch nicht durch die Zeitverhältnisse beeinträchtigt wurde und daß der Kampf unsere Liebe keineswegs ersticken konnte. Trotz des Aufstandes blieb uns die Hauptsache, die Einheit des Glaubens und Denkens. Denn in Fragen der Wahrheit zogen wir nicht uneins an verschiedenen Stricken; die gleiche Gestaltungskraft des Glaubens und unserer alten Hoffnung formte uns.</p><p>Gerade die gleiche Gotteslehre ist es, welche die wahren Gotteskinder zu einen vermag, während nichts so sehr Trennungen begünstigt, wie verschiedene Anschauungen über Gott. Mag einer in anderen Fragen noch so sehr seine Würde bewahren, wenn es sich aber um theologische handelt, wird er hitzig. Der Sanftmütige wird tatsächlich streitsüchtig, wenn er sieht, wie er durch Gottes Langmut benachteiligt wird; eigentlich allerdings benachteiligt er durch sein Fallen Gott, der doch reich ist für uns und uns reich macht. Wie schon gesagt, bewahrten wir trotz der Spaltung so viel Ruhe, daß mehr das Einigende als das Trennende zutage trat und das, was unter uns bestand, gegenüber dem Guten und Rechten, das uns umgab, verschwinden mußte. Da Friedensbereitschaft allein noch nicht zur Herstellung der Ordnung genügt, da auch das Wort mit eingreifen, und Gott, der alles Gute beginnen läßt und zu Ende führt, helfen muß, so wollen wir durch Gebete und durch Aufklärungen dem Frieden Kraft und Dauer verleihen. Erwägen wir vor allem, daß Gott das schönste und höchste der Wesen ist, sofern nicht einer Gott noch über das Wesen erheben oder alles Sein in ihn, der es den Geschöpfen gegeben hat, verlegen will. Sodann ist all das, was zunächst aus Gott ist und Gott umgibt, nämlich die englischen und himmlischen Kräfte, welche zuerst vom ersten Lichte empfangen und welche vom Worte der Wahrheit durchdrungen werden, Licht und Abglanz des vollkommenen Lichtes. Nicht zu streiten und sich nicht zu widersetzen, ist ihnen vor allem eigen. In Gott gibt es nämlich keine Auflehnung, da es in ihm keine Zerstörung gibt; denn Auflehnung gebiert Zerstörung. Eintracht ist Gott und dem, was zunächst von Gott ist, so sehr eigen, daß Gott nebst den übrigen und vor den übrigen Namen, deren er sich erfreut, auch mit diesem Vorzug bezeichnet wird. Gott läßt sich Friede, Liebe u. dgl. nennen, um uns durch diese Bezeichnungen zu mahnen, diesen seinen Vorzügen nachzustreben.</p><p>Derjenige Engel, welcher kühn sich widersetzt und über seine Stellung hinaus mit trotzigem Nacken wider den allmächtigen Herrn erhoben und, wie der Prophet sagte, nach dem Sitz über den Wolken verlangt hatte, wurde seiner Torheit entsprechend bestraft. Er wurde verurteilt, statt Licht Finsternis zu sein, bzw. ― um mich richtiger auszudrücken ― er machte sich selbst zur Finsternis. Die übrigen Engel blieben in ihrer Würde und erfreuten sich darin vor allem des Friedens und der Ruhe, da die gepriesene, heilige Trinität ihnen Einheit und Erleuchtung verliehen hatte. Denn die Trinität selbst ist* ein* Gott und wird als* ein* Gott geglaubt, da sie sowohl eins ist im Denken, wie gleich in ihrem Wesen. Daher treten Gott und dem Göttlichen alle diejenigen nahe, welche offen und ehrlich das Gut des Friedens begrüßen, dagegen Auflehnung hassen und verabscheuen. Zur Gegenpartei aber gehören alle jene, welche Streit suchen, durch Neuerungen Ruhm ernten wollen und stolz auf ihre Schande sind. Der Satan steht im Streit mit sich selbst und wirkt als Menschenmörder von Anbeginn und als Feind des Guten durch Zerrissenheit und Leidenschaften auch in anderen Streit, um im Dunkeln, in der Finsternis der Auflehnung sich verbergend, den einen Leib der Kirche niederzustrecken. Auch an den einzelnen macht er sich wohl oftmals listig und schlau heran und öffnet sich geschickt in uns ein Plätzchen, um dann vollständig einzubrechen wie ein kühner Krieger in eine Mauerbresche oder eine Heereslücke.</p><p>[Forts. v. ] Gott und die göttlichen Eigenschaften nachzuahmen, ist erste Pflicht; es führt notwendig zur Einheit in Wort und Gesinnung. Die nach Gottes Bild erschaffene Seele braucht nur auf die göttlichen Eigenschaften zu achten, um, wenn ihr Wille darauf gerichtet ist, mit Sicherheit durch die Verähnlichung das mögliche zu erreichen und ihre Würde recht zu wahren. Sodann wollen wir, ein göttliches Wort befolgend, zum Himmel hinauf- und auf die Erde hinabschauen, um die Gesetze der Schöpfung zu lernen. Solange der Himmel, die Erde, das Meer, diese ganze Schöpfung, das große, angestaunte Werk Gottes, welches schweigend Gott verkündet und offenbart, in sich Ruhe und Friede bewahrt, in seinen eigenen natürlichen Grenzen bleibt, sich nicht auflehnt und nicht die friedlichen Schranken überschreitet, durch die das schöpferische Wort das Weltall zusammenhält, ist es, was es genannt wird, ein Kosmos, etwas unfaßbar Schönes, das Glänzendste und Großartigste, das jemals ersonnen werden konnte. Sobald es aber aufhört, Friede zu haben, hört es auf, ein Kosmos zu sein. Oder merkst du es nicht, wie der Himmel, da er gefügig an die Luft von seinem Lichte und an die Erde von seinem Regen mitteilt, vom Gesetze der Eintracht beherrscht wird, oder wie dadurch, daß die Erde allen Lebewesen Nahrung, die Luft ihnen Atmen ermöglicht, sie ihnen das Leben erhält und die Elternliebe nachahmt?</p><p>Merkst du nicht, wie die Jahreszeiten dadurch, daß sie sorgfältig ineinander geordnet sind, sich langsam ablösen und durch Zwischenzeiten die Extreme verhindern, rauh aneinander zu stoßen, friedlich und geschickt wie der Freude, so dem Bedürfnisse dienen? Tag und Nacht stehen sich gleichwertig gegenüber und lösen sich ruhig ab, um uns zur Arbeit anzutreiben, bzw. Erholung zu gönnen. In Ordnung kommen und gehen Sonne und Mond und die Sterne in ihrer Pracht und Zahl. Meer und Land, die sanft ineinander greifen und gütig einander geben, um voneinander zu empfangen, ernähren liebevoll den Menschen und bieten ihm reichlich im Wetteifer ihre Schätze. Die Flüsse, welche zwischen den Bergen und über den Ebenen dahinziehen, treten nicht aus, es sei denn, um wohlzutun, und wenden sich nicht gegen das Land, es zu überschwemmen. Die Stoffe mischen und mengen sich zur Ordnung und Harmonie der Teile. Die Tiere finden ihre Nahrung, sie pflanzen sich fort; jedes hat seine eigene Behausung. Die einen haben Gewalt über uns, über die anderen haben wir die Gewalt; die einen sind uns Untertan, die anderen bleiben unabhängig. Da demnach die ganze Schöpfung nach den Grundsätzen der Harmonie durch Zusammenfließen oder Zusammenhauchen gelenkt und geleitet wird, will sie doch nur Liebe und Einigkeit den Menschen verkünden und sie zur Eintracht auffordern.</p><p>Wenn jedoch die Stoffe sich wider sich selbst erheben, außer Ordnung geraten und durch Auflehnung nach Auflösung streben oder wenn Gott, zum Schrecken und zur Strafe der Sünder, etwas von der Harmonie aufhebt, wenn das Meer austritt, die Erde erbebt, außerordentliche Regengüsse niederstürzen, die Sonne sich verfinstert, eine Jahreszeit ausartet oder Feuer ausbrechen, dann wird aus dem Kosmos Unordnung und alles von Schrecken erfüllt, dann lernt der Mensch das Gut des Friedens in dieser Revolution kennen. Übergehen will ich, daß Völker, Städte, Reiche, ferner Chöre, Heere, Familien, Schiffsgesellschaften, Ehen, Genossenschaften durch Frieden zusammengehalten, durch Auflehnung aufgelöst werden. Verweisen will ich aber noch auf Israel, seine Leiden, seine Zerstreuung und seine Irrfahrten, welche es jetzt zu machen hat und welche nach seinen Prophetenschriften noch lange dauern werden. Wenn ich euch genau unterrichtet habe, will ich euch nach der Ursache des Schicksals fragen, damit wir aus den Leiden Fremder für uns Einigkeit lernen.</p><p>[Forts. v. ] Wurden nicht die Israeliten, solange sie in Ägypten wie in einem eisernen Ofen bedrängt und von gemeinsamer Not zusammengehalten waren und daher ― die Not ist ja bisweilen ein vorzügliches Heilmittel ― unter sich und mit Gott in Frieden lebten, als „heiliges Volk, Anteil des Herrn, königliches Priestertum“ bezeichnet? Ihre Geschichte machte auch der Bezeichnung Ehre. Sie standen nämlich unter gottgeleiteten Führern. Bei Nacht wies ihnen eine Feuersäule, bei Tag eine Wolke den Weg. Auf ihrer Flucht wich das Meer vor ihnen zurück. Da sie Hunger litten, reichte ihnen der Himmel Speise; da sie dürsteten, tränkte sie ein Fels. Menn [ber.: Wenn statt Menn] (Moses) im Kampfe die Hände ausstreckte, war es, wie wenn Tausende zu Felde zögen; durch sein Gebet wirkte er Sieg und ermöglichte er den Vormarsch. Um es dem verwandten Meere nachzumachen, wichen vor Israel die Flüsse zurück; die Natur machte Halt. Durch Trompeten wurden Mauern eingestürzt. Soll ich noch erzählen von den Heimsuchungen der Ägypter, von der Stimme Gottes auf dem Berge, von der zweimaligen Übergabe des Gesetzes, von dem geschriebenen Gesetze und dem Gesetze des Geistes, und von den übrigen Auszeichnungen, welche Israel dereinst wider sein Verdienst erfahren hatte? Doch als die Israeliten anfingen, krank zu werden, gegen sich selbst wüteten und sich vielfach spalteten, als sie, den im Menschen wohnenden Gott nicht erkennend, in ihrem törichten Handeln wider Gott und unseren Erlöser durch das Kreuz ins letzte Verderben gestürzt wurden und die längst angedrohte eiserne Rute auf sich lenkten, nämlich die jetzige siegreiche Macht und Herrschaft, was geschah da? Was mußten sie da über sich ergehen lassen?</p><p>Jeremias klagt über ihre früheren Leiden und weint über die babylonische Gefangenschaft. Ihr Schicksal war auch tatsächlich der Klagen und Tränen wert. Wahrlich, überaus schmerzlich war das Einreißen der Mauern, die Vernichtung der Stadt, welche dem Erdboden gleichgemacht worden war, die Zerstörung des Tempels, der Raub der Weihgeschenke, der Frevel der Füße, welche geweihte Stätte betraten, der Frevel der Hände, welche mit Gefäßen schwelgten, die sie nicht hätten berühren dürfen, ferner das Schweigen der Propheten, der Abtransport der Priester, die schonungslose Behandlung der Greise, die Schändung der Jungfrauen, der Zusammenbruch der Jugend, das unheilige, feindliche Feuer und die Ströme von Blut, welche das heilige Feuer und das heilige Blut ersetzt hatten, die Fortschleppung der Nazaräer, die Verdrängung der Hymnen durch Klagelieder. Nur einige wenige Worte aus den Klageliedern des Jeremias will ich anführen. Er spricht von den „werten Söhnen Sions, welche mit Gold aufgewogen wurden“ und welche zart und sündelos den Weg der Fremde gingen, von den „Wegen Sions, welche trauern, da niemand mehr zum Feste kommt“, und kurz zuvor von den Händen weichherziger Frauen“, welche zur Zeit der Belagerung ihren Kindern nicht Nahrung reichen, sondern sie zerreißen, um sie zu genießen, und mit ihren Liebsten ihren Hunger befriedigen. Sind diese Verhältnisse nicht schrecklich, ja mehr als schrecklich, nicht nur für die, welche sie damals erlebten, sondern auch für die, welche jetzt davon hören? Sooft ich diese Schrift zur Hand nehme und in den Klageliedern lese, was immer geschieht, wenn ich an Tagen irdischen Glückes ein Exerzitienbüchlein benützen will, da erstickt mir die Stimme und werde ich zu Tränen gerührt, da sehe ich das Elend gleichsam vor meinen Augen und klage ich mit dem klagenden Jeremias. Wer von denen, die Klagelieder zu schreiben verstehen und Leid in Worten auszudrücken vermögen, wird nach Gebühr klagen über die letzte Heimsuchung und Zerstreuung der Israeliten, über das ihnen jetzt auferlegte Joch der Knechtschaft, über ihre bekannte Erniedrigung unter die Römer, die sie vor allem ihrem revolutionärem Geiste zu verdanken haben? Welche Bücher könnten dies Leid fassen? Einem Marterl, auf das ihre Schicksale aufgezeichnet sind, gleicht der ganze Erdkreis, über den sie zerstreut sind, die verlassene Kultstätte, der kaum mehr erkennbare Boden Jerusalems, das sie nur auf einen Tag betreten dürfen, wenn sie sich in der Erinnerung an vergangene Herrlichkeit freuen und die wüste Stätte beweinen wollen.</p><p>[Forts. v. ] Ist schon Auflehnung schrecklich und Ursache solcher Leiden, wie sie die Ausführungen gezeigt haben und wie sie noch mehr Beispiele lehren könnten, so ist es noch viel schrecklicher, wenn man, nachdem man bereits aus kleinlichem Sinn sich erhoben und die Schönheiten des Friedens gekostet hat, wiederum in die alte Krankheit zurückfällt und sozusagen zu dem zurückkehrt, was man ausgespien hat, und nicht einmal durch Erfahrungen, welche Toren belehren, zur Vernunft gelangt. Ich merke nämlich, daß nicht diejenigen als leichtfertig und töricht gelten, welche in einem Fehler verharren, sondern die, welche ohne weiteres sich bald dahin, bald dorthin drehen und wenden wie der unstete Wind oder die Strömungen der Meerengen oder die wechselnden Wogen des Meeres. Ich mache auch die Wahrnehmung, daß gerade die Hoffnung, sich wieder zu versöhnen, diejenigen, welche im Aufstand verharren, ermuntert und ihnen meist ihr Schicksal erleichtert; die größte Linderung in der Not ist ja die Hoffnung auf Änderung und die Aussicht auf eine bessere Zukunft. Doch die, welche sich oftmals versöhnen, um immer wieder in ihre Sünden zurückzufallen, berauben sich u. a. auch der Hoffnung auf bessere Verhältnisse. Sie haben vor der Versöhnung ebenso Respekt wie vor der Revolution und setzen weder auf diese noch auf jene ihr Vertrauen; überall wollen sie sein und nicht sein.</p><p>Man möge nicht glauben, daß ich jeden Frieden empfehle! Ich weiß, es gibt eine Auflehnung, die sehr gut ist, und eine Versöhnung, die sehr schädlich ist. Ich empfehle einen Frieden, der gut ist, um des Guten willen geschlossen wird und mit Gott verbindet. Soll ich mich kurz aussprechen, meine Meinung ist: Man soll weder übermäßig kalt, noch übermäßig warm sein, man soll also weder allen kriechend nachgeben, noch sich von allen erbittert abwenden. Kälte ist untätig, Kriecherei sozial wertlos. Wo Bosheit offenkundig ist, ist es besser, mit Feuer und Schwert, mit Geschick und Macht und auf alle mögliche Weise vorzugehen, als am Sauerteig der Bosheit teilzunehmen und mit den Bösewichtern gemeinsame Sache zu machen; gar nichts ist so sehr zu fürchten, als daß man etwas noch mehr als Gott fürchte und daß man also, während man der Wahrheit dient, Glaube und Wahrheit verrät. Wo aber in einem kritischen Falle Verdacht und Furcht sich nicht begründen lassen, da ist Langmut besser als Voreiligkeit und gütiges Herablassen besser als Trotz, da ist es auch viel vorteilhafter und nützlicher, im gemeinsamen Körper zu verbleiben und sich als Glieder gegenseitig aufzurichten, als durch Abfall sich voreingenommen zu zeigen, durch Trennung das Vertrauen zu lösen und dann statt brüderlich nach Tyrannenart das Gute zu kommandieren.</p><p>In solcher Erkenntnis wollen wir, Brüder, einander herzlich umarmen, aufrichtig eins sein und den nachahmen, der „die trennende Scheidewand niedergerissen“ und durch sein Blut alles verbunden und friedlich geeint hat. Zu unserem gemeinsamen Vater, dem ehrwürdigen Greis, dem sanften und gütigen Hirten wollen wir sagen: Siehst du den Lohn deiner Würde? Schaue um dich und blicke auf deine Söhne, welche dir zugeführt worden sind, wie du gewünscht hattest und was dein einziges Gebet bei Tag und bei Nacht gewesen war, um in glücklichem Alter die Pilgerschaft beschließen zu können! Sieh, alle sind zu dir gekommen und ruhen unter deinen Fittichen! Sie reihen sich um ihren Altar. Unter Tränen weilten sie ferne von ihm, mit Freuden sind sie zu ihm zurückgekehrt. Freue dich und frohlocke, bester Vater und Kinderfreund, denn wie die Braut mit dem Schmuck hast du dich mit ihnen allen gekleidet und umgeben! Rufe auch du uns zu: „Siehe, da bin ich, und hier sind die Kinder, welche mir Gott gegeben hat!“ Füge auch noch das andere, sehr passende Herrenwort bei: „Die du mir gegeben hast, habe ich bewahrt und keines von ihnen habe ich verloren!“</p><p>Niemand möge verlorengehen! Wir wollen alle beisammenbleiben „in* einem* Geiste, einmütig kämpfend im Glauben an das Evangelium“, einträchtig, eines Sinnes, bewaffnet „mit dem Schilde des Glaubens“, die Lenden mit Wahrheit umgürtet, geschult nur in dem Kampfe gegen den Bösen und seine Scharen, ohne Furcht vor denen, „welche den Körper töten können, der Seele aber nichts anzuhaben vermögen“, fürchtend aber den, der Herr ist über die Seele und über den Leib, „wohlbewahrend die herrliche Tradition“, welche wir von den Vätern ererbt haben. Anbetend wollen wir niederfallen vor dem Vater, dem Sohne und dem Heiligen Geiste, im Sohne den Geist erkennend. Auf sie sind wir getauft worden, an sie haben wir geglaubt, auf sie sind wir verpflichtet worden, sie trennend, ehe wir sie einigen, und sie einigend, ehe wir sie trennen, ohne aber die Drei zu Einem zu machen. Sie sind nämlich nicht ohne Hypostasen, haben auch nicht nur eine einzige Hypostase, so daß ihr Reichtum für uns nur in den Namen, nicht aber in der Wirklichkeit bestünde und die Drei nur Eins wären. Eins sind sie nämlich nicht in der Hypostase, sondern in der Gottheit. In der Dreiheit wird die Gottheit angebetet, und die Dreiheit wird in der Einheit zusammengefaßt. Die ganze Dreiheit wird angebetet, hat königliche Gewalt,* einen* Thron,* eine* Ehre, ist über der Welt und der Zeit erhaben, ist unerschaffen, unsichtbar, unberührbar, unfaßbar, in ihrem Wesen und ihrer Ordnung nur von sich selbst erkannt, für uns aber verehrungswürdig und anbetungswürdig, allein in das Allerheiligste eindringend, die ganze Schöpfung außer sich lassend, wovon der eine Teil durch die erste, der andere Teil durch die zweite Trennung geschieden wurde; die erste Trennung schied den Himmel und die Engel von der Gottheit, die zweite Trennung schied uns vom Himmel.</p><p>Dies wollen wir tun und so wollen wir uns verhalten, Brüder! Derer, welche anders gesinnt sind und die Wahrheit nicht kennen, wollen wir uns, solange es geht, sorgend annehmen; die Unheilbaren aber wollen wir von uns weisen um nicht, statt von unserer Gesundheit mitzuteilen, von ihrer Krankheit angesteckt zu werden. Der Gott „des Friedens der alle Sinne übersteigt“, wird mit uns sein in Christus Jesus, unserem Herrn! Amen.VII. Rede</p><h2>VII. Rede</h2><p><em>VII. Rede</em>.</p><p><em>Trauerrede auf Cäsarius</em><em>, seinen Bruder; zu Lebzeiten der Eltern.</em></p><p>Ihr Freunde, Brüder, Väter, liebwerte Personen und Namen, ihr meint vielleicht, daß ich, dem Verstorbenen Tränen und Klagen weihend, voreilig das Wort ergreife oder eine lange, kunstvolle Rede, wie sie die meisten wünschen, halten werde. Zum Teil habt ihr euch angeschickt, mit mir zu trauern und zu weinen, in meinem Leid euer eigenes, sofern ihr solches erlitten habt, zu beklagen und im Schmerze des Freundes das Leid zu ergründen; zum Teil aber wollt ihr euch Ohrenschmaus verschaffen und euch ergötzen in der Meinung, ein Unglück müsse uns Anlaß sein, uns hervorzutun. Einst war es allerdings so, als wir u. a. noch gar sehr am Irdischen hingen und als Redner uns auszeichnen wollten, als wir noch nicht zu dem wahren, idealen Worte aufblickten, noch nicht Gott, von dem alles kommt, alles gaben, um für alles Gott zu erhalten. Wollt ihr eine richtige Meinung über uns gewinnen, dann dürft ihr doch nicht solchen Argwohn hegen! Wir werden nicht über das Maß hinaus den Verstorbenen beklagen, da wir ja auch von anderen nicht wünschen, daß sie es so machen. Wir werden aber auch nicht über Maß und Gebühr Lob spenden, obwohl für den Gebildeten das Wort und für den, der in besonderer Liebe an meinem Worte hing, die schöne Rede mehr als sonst etwas eine teure, sehr passende Gabe ist ― ja nicht bloß eine Gabe, sondern geradezu die allernotwendigste Pflicht. Durch Tränen und Bewunderung genügen wir den Forderungen des Gesetzes. Dies widerspricht nämlich nicht unserer Weltanschauung; denn „das Andenken der Gerechten sei in Ehren“ und ― so heißt es ― „um eines Toten willen vergieße Tränen und weine, da du Schlimmes erduldet hast!“ Doch halten wir uns ebenso frei von übergroßem Schmerze wie von Gefühllosigkeit. Wir verweisen sodann auf die Schwäche der menschlichen Natur, erinnern an die Würde der Seele, trösten, wie es sich gebührt, die Trauernden und lenken den Schmerz vom Fleischlichen und Vergänglichen auf das Geistige und Ewige.</p><p>Um mit dem zu beginnen, was am nächsten liegt: die Eltern des Cäsarius kennt ihr alle. Ihr seht ihre Tugenden und hört davon. Ihr ahmt diese nach und bewundert sie und erzählt davon denen, die nichts davon wissen, wenn es überhaupt solche Leute gibt. Und jeder weiß etwas anderes darüber zu berichten; denn keiner könnte alles erzählen, dies vermöchte die Zunge keines einzigen, mag einer noch so fleißig und eifrig sein. Unter den vielen großen Vorzügen, welche zu rühmen wären, wenn es nicht als Anmaßung erscheinen würde, daß ich über eigene Familienverhältnisse lobend spreche, ist vor allem als charakteristisch zu erwähnen ihre Kirchlichkeit. Diese würdigen, alten Leute verdienen meines Erachtens ebensosehr wegen ihrer Tugend, wie wegen ihres Alters Verehrung. Ihr Körper ist zwar infolge der Jahre geschwächt, doch ihre Seele ist jung in Gott.</p><p>[Forts. v. ] Der Vater war mit gutem Erfolg von einem wilden Ölbaum auf einen edlen Ölbaum aufgepfropft worden und hatte von dessen Kraft so viel erhalten, daß er auch andere aufpfropfen durfte und mit der Seelsorge betraut wurde, hoch erhaben über seinem Volke thronend, ein zweiter Aaron oder Moses, gewürdigt, vor Gott zu treten und dessen Worte Fernstehenden zu übermitteln, sanft, frei von Zorn, mild, reich an äußeren Vorzügen, noch reicher an verborgenen. Doch wozu soll ich noch den charakterisieren, den ihr kennt? Und selbst wenn ich lange sprechen würde, könnten wir doch nicht alles sagen, was erwähnenswert ist und was jedermann weiß und vom Redner verlangt. Besser ist es, euch darüber nachdenken zu lassen, als das viele Bewundernswerte durch meine Worte vorwegzunehmen.</p><p>Die Mutter war schon längst durch ihre Vorfahren Gott geweiht worden und hatte die Frömmigkeit als unveräußerliches Erbe nicht nur selbst bewahrt, sondern auch ihren Kindern, der heiligen Masse aus der Erstlingsgabe, übermittelt. Dieses Erbe hat sie so sehr vergrößert und vermehrt, daß ― ich wage das kühne Wort, das auch geglaubt und erzählt wird, ― keinem anderen als ihr die Bekehrung ihres Mannes zu verdanken ist. Man staune: Als Lohn für ihre Frömmigkeit wurde ihr noch größere und vollkommenere Frömmigkeit verliehen. Beide Eltern lieben ihre Kinder und lieben Christus, ja sie lieben ― eine Seltenheit! ― Christus noch mehr als ihre Kinder. Von den Kindern wollten sie keinen anderen Vorteil, als daß sie von Christus erkannt und nach ihm benannt würden. Sie wünschten sich nur deshalb Kinder, um sie für die Tugend und für das Höhere zu erziehen. Sie sind gütig und barmherzig. Motten und Dieben und dem Herrn dieser Welt rauben sie zahlreiche Schätze, um sie aus der Fremde in die Heimat zu bringen und als schönstes Erbe ihren Kindern die Ehren einer anderen Welt zu hinterlassen. So erreichten sie ein hohes Alter, geehrt ebenso wegen ihrer Tugenden, wie wegen ihrer hohen Jahre, reich an Tagen, sowohl an solchen, die bleiben, wie an solchen, die vergehen. Beide wetteiferten in diesem Leben um den Vorrang. Sie waren durchweg glücklich bis vielleicht auf dieses eben erst erfolgte Schicksal, das man ebenso als Prüfung wie als gnädige Fügung bezeichnen kann. Die Gnade wollte aber, wie ich glaube, daß das Kind, welches wegen seines Alters am meisten gefährdet war, den Eltern (in den Tod) vorausgehe, damit diese nunmehr in Ruhe ihr Leben beschließen und mit ihrer ganzen Familie in den Himmel kommen.</p><p>Davon spreche ich nicht, um die Eltern zu rühmen. Denn ich weiß, daß wohl keiner dies nach Gebühr zu tun vermöchte, selbst dann nicht, wenn er ihr Lob zum einzigen Gegenstand seiner Rede machen würde. Meine Absicht ist vielmehr, zu zeigen, daß Cäsarius seine Tugenden seinen Eltern verdankte. Ihr dürft euch nicht ungläubig verwundern, wenn ein Sohn solcher Eltern sich solchen Lobes würdig zeigt. Wundern hättet ihr euch müssen, wenn er nicht auf die Vorbilder in der eigenen Familie und in seiner Nähe geachtet und auf Fremde geschaut hätte. Seine ersten Lebensjahre waren so, wie sie bei edlen Menschen von schöner Zukunft zu verlaufen pflegen. Von dem Nebensächlichen, seiner Schönheit, seiner Größe, seiner allgemeinen Beliebtheit, seiner Vornehmheit im Ausdruck will ich schweigen, da es uns nicht zukommt, solche Vorzüge zu bewundern, mögen sie auch anderen nicht unbedeutend erscheinen. Ich gehe daher auf das Folgende über, was ich, selbst wenn ich wollte, nicht leicht übergehen könnte.</p><p>[Forts. v. ] Unter dem sittlichen Einfluß der Eltern wurden wir erzogen und gebildet, in den Lehrgegenständen hiesiger Schulen wurden wir gründlich unterrichtet, worin Cäsarius infolge seiner Regsamkeit und guten Entwicklung erstaunlich rasch die meisten übertraf. Sollte ich etwa ohne Tränen daran denken? Darf nicht trotz meines Versprechens der Schmerz mich doch noch aus der philosophischen Gelassenheit reißen? Als die Zeit gekommen schien, in die Fremde zu ziehen, wurden wir das erste Mal voneinander getrennt. Ich selbst blieb aus Liebe zur Rhetorik in den damals blühenden Schulen Palästinas, während sich Cäsarius nach Alexandrien begab, das bekanntlich schon damals wie noch heute Universitätsstadt war. Welchen seiner Vorzüge soll ich zuerst nennen oder welchen soll ich als den größten bezeichnen? Welchen kann ich übergehen, ohne meiner Rede schwer zu schaden? Wer hing mit größerer Treue an seinen Lehrern als er? Wer war bei seinen Altersgenossen beliebter? Wer mied sorgfältiger die Kameradschaft und den Umgang mit den Bösen? Wer suchte eifriger den Verkehr mit den Besten auf, gleichviel ob sie Fremde waren oder die berühmtesten und angesehensten Personen der Heimat? Er wußte, daß die Gesellschaft auf die Charakterbildung nicht geringen Einfluß habe. Wer war daher mehr als er bei den Vorgesetzten geachtet? Und wenn auch der einzelne in einer Großstadt verschwindet, wer war gleichwohl in der ganzen Stadt wegen seiner Einfachheit bekannter und wegen seines Wissens berühmter?</p><p>Welchem Wissenszweige hat er sich nicht gewidmet? Er gab sich allen in einer Weise hin, wie ein anderer sich nicht einmal einem einzigen Gegenstande gewidmet hätte. Wer von seinen Kollegen und Altersgenossen, ja selbst von den Bejahrteren und den höheren Semestern konnte es nur auf einige Zeit mit ihm aufnehmen? Er verlegte sich auf alle Wissenschaften mit einer Leichtigkeit, wie wenn er nur eine einzige zu studieren gehabt hätte, und auf jede einzelne verlegte er sich mit einer Kraft, wie wenn er alle anderen hätte vernachlässigen wollen. Die Regsamen übertraf er durch Fleiß, die Fleißigen durch Geistesschärfe; bzw. den Geistesgewandten war er durch Gewandtheit, den Fleißigen durch Fleiß überlegen, und die, welche durch beides sich auszeichneten, übertraf er durch beides. Von der Geometerie, der Astronomie und den Disziplinen, welche für andere gefährlich sind, wählte er das Brauchbare aus, d. h. er bewunderte in der Harmonie und Ordnung des Himmels den Schöpfer. Was aber daran schädlich war, wies er zurück, d. h. das, was ist und geschieht, machte er nicht von der Bewegung der Sterne abhängig wie diejenigen, welche die Schöpfung, die gleich ihnen zu dienen hat, gegen den Schöpfer reizen, sondern wie alles, so schrieb er auch in gebührender Weise die Bewegung der Dinge Gott zu. Wer sollte so töricht oder so eifersüchtig sein, daß er dem Cäsarius in der Arithmetik und Mathematik und in der bewundernswerten Medizin, welche sich mit den Elementen und ihren Verbindungen und mit den Ursachen der Krankheiten beschäftigt, um die Übel mit der Wurzel auszureißen, seinen Platz erst im zweiten Range anweist und sich nicht damit befriedigt, sofort nach Cäsarius, also an zweiter Stelle, den Ehrenplatz einnehmen zu dürfen? Für das, was ich da sage, fehlen nicht die Zeugen. Vielmehr verkündet das Morgenland und das Abendland, auch jede Gegend, die er erst später betrat, klar und deutlich sein Wissen.</p><p>Nachdem er seine Seele mit allen möglichen Tugenden und Kenntnissen beladen hatte, gleich einem großen Frachtschiffe, das alle möglichen Waren aufnimmt, und er in die Vaterstadt zurückgekehrt war, um auch anderen von seiner schönen geistigen Fracht mitzuteilen, da ereignete sich etwas Merkwürdiges. Weil mich die Erinnerung daran außerordentlich freut und eine Erwähnung auch euch angenehm sein dürfte, ist es das beste, kurz davon zu sprechen. In mütterlicher Art und aus Liebe zu den Kindern flehte die Mutter im Gebete, daß sie uns, die wir gemeinsam von ihr ausgeschickt worden waren, auch gemeinsam heimkehren sähe. Sah man uns beisammen, so wurden wir, wenn auch nicht von anderen, so doch von der Mutter als ein Zweigespann angesehen, des Gebetes und des Anblickes wert; nun allerdings hat uns ein neidisches Geschick böswillig getrennt. Nicht infolge eines gemeinsamen Planes oder einer Verabredung, sondern weil Gott, der auf gerechte Bitten hört und auf die Liebe der Eltern zu wohlerzogenen Kindern achtet, es gefügt hatte, kamen wir, der eine von Alexandrien, der andere aus Griechenland, der eine zu Land, der andere zu Wasser, zu gleicher Zeit in der gleichen Stadt an. Die Stadt war Byzanz, nunmehr die Hauptstadt Europas. Hier erwarb sich Cäsarius in kurzer Zeit solchen Ruhm, daß ihm öffentliche Ämter, eine vornehme Heirat und ein Sitz im Senate angeboten wurden und daß man einstimmig eine Gesandtschaft an den Kaiser schickte, um ihn zu bitten, er möge die erste Stadt durch Aufnahme des ersten Gelehrten ehren und auszeichnen, soferne ihm daran gelegen sei, daß sie in der Tat die erste ist und ihren Namen verdient, ferner möge er allen Berichten über sie noch den beifügen, daß sie sich mit dem Arzte und dem Bürger Cäsarius geschmückt habe, obwohl es natürlich ― abgesehen von anderem Glanze ― noch viele, in der Philosophie und in anderen Wissenschaften hervorragende Männer sind, welche ihr zu Ansehen verhelfen sollten. Doch genug davon! Anderen schien in dem erwähnten Zusammentreffen blinder Zufall gespielt zu haben, wie es oft im Leben vorkommt; den Frommen aber war es völlig klar, daß es nur das Werk der gottesfürchtigen Eltern war, welche ihre Kinder zu Wasser und zu Lande einzig durch die Wirkung des Gebetes zusammengeführt hatten.</p><p>Noch einen Vorzug des Cäsarius dürfen wir nicht übergeben [ber.: „übergehen“ statt „übergeben“]. Anderen mag er vielleicht unbedeutend und nicht erwähnenswert erscheinen, ich aber hielt ihn damals schon und halte ihn noch heute für bedeutend, es müßte denn sein, daß Bruderliebe kein Lob verdient. Sooft ich über meinen Bruder berichte, werde ich diesen Vorzug immer wieder an erster Stelle nennen. Byzanz suchte ihn durch die Ehren, von denen ich sprach, festzuhalten; es weigerte sich, ihn aus irgendeinem Grunde ziehen zu lassen. Da aber ich mich dagegen stemmte, Cäsarius mich ehrte und ich bei ihm alles galt, setzte ich es durch, daß er den Wunsch seiner Eltern und seine Pflicht gegen das Vaterland erfüllte und mein Verlangen befriedigte. Er machte mich zum Begleiter und Reisegefährten und zog mich nicht nur Städten und Völkern, Ämtern und Einkünften, welche ihm reichlich von vielen Seiten bereits zuflossen und noch erwartet werden durften, sondern fast selbst dem Kaiser und seinen Verordnungen vor. Ich für mich entschloß mich hierauf, Mönch zu werden und mich für das jenseitige Leben einzurichten, jeglichen Ehrgeiz wie einen tyrannischen Herrn und eine schwere Krankheit abweisend; das Verlangen darnach war allerdings schon lange dagewesen, ehe es ausgeführt wurde. Cäsarius dagegen ging, nachdem er seine besten Wissensschätze dem eigenen Vaterlande gewidmet und für seine Mühen entsprechende Bewunderung geerntet hatte, aus Verlangen nach Ehren und nach einer leitenden Stellung in Byzanz, wozu er auch mich zu bereden gesucht hatte, an den kaiserlichen Hof. Damit handelte er wahrlich nicht nach unseren Wünschen und unserem Gutachten. Ich muß es euch offen sagen: es ist wohl besser und erhebender, bei Gott den letzten Platz einzunehmen, als bei einem irdischen Kaiser an erster Stelle zu stehen. Gleichwohl verdient er keinen Tadel. Denn Mönch zu sein, ist etwas sehr Hohes, aber auch etwas sehr Schwieriges. Nicht viele sind dazu berufen, sondern nur jene, welche die göttliche Vorsehung dazu bestimmt hat, die den Auserlesenen gütig die Hand reicht. Es ist aber auch nichts Geringes, wenn jemand die zweite Lebensstufe betritt und nach einem schönen, guten Leben (in der Welt) strebt und sich (dabei) mehr um Gott und seine eigene Seele, als um irdischen Glanz kümmert und, das Leben in dieser Welt als Schauspiel auffassend, im Glanz nur eine Szenerie oder eine Maske für die vielen Eitelkeiten sieht und sich mit seinem Ebenbilde, das er, wie er weiß, von Gott erhalten hat und dem Geber zurückerstatten muß, Gott weiht. Daß Cäsarius von solchem Streben beseelt war, sind wir überzeugt.</p><p>Er wurde unter die erstklassigen Ärzte eingereiht, ohne daß es ihm große Mühe gekostet hätte; er brauchte nur sein Wissen zur Geltung zu bringen, bzw. nur eine kleine Andeutung seines Wissens zu geben. Auch wurde er sofort in den Freundeskreis des Kaisers aufgenommen, wo er die höchsten Ehren genoß. Unentgeltlich bot er den hohen Kreisen seine ärztlichen Dienste an, wohl wissend, daß man am besten durch Tugend und treffliche Bewährung vorwärtskomme. Diejenigen, welche noch über ihm standen, übertraf er vielfach an Ansehen. Wegen seiner Sittenreinheit war er bei allen beliebt und wurde er in vertrauliche Dinge eingeweiht, ohne daß er gleich Hippokrates hätte einen Eid schwören müssen. Selbst die Biederkeit eines Krates konnte mit der des Cäsarius nicht verglichen werden. Es wurden ihm überall noch größere Ehren, als er für seine Stellung erwarten konnte, erwiesen und zwar sowohl von Seiten der Kaiser, wie von Seiten derer, welche diesen zunächst standen. Groß waren die Ehren, deren er bereits gewürdigt worden war; noch größer waren die, welche er erhoffen durfte und deren er würdig erklärt wurde. Das Wichtigste aber ist, daß weder sein Ruhm, noch die irdischen Freuden, die vor ihm ausgebreitet waren, seine reine Seele verderben konnten. Unter den vielen großen Ehrungen, die ihm zuteil geworden waren, schätzte er am höchsten die Würde, Christ zu sein und Christ zu heißen; im Vergleich mit dieser Würde beurteilte er alles andere als Kinderspiel und Tand. Dieses wird bald von diesem, bald von jenem auf einer Bühne gespielt, die schleunigst errichtet und wieder abgebrochen wird, vielleicht noch schneller niedergerissen als aufgeschlagen wird, wie aus den vielen Wechselfällen des Lebens und aus dem ständigen Steigen und Fallen das Glückes zu ersehen ist. Frömmigkeit dagegen ist das einzig wahre, sichere und bleibende Gut.</p><p>So dachte Cäsarius, auch als er am Hofe weilte. In solcher Gesinnung lebte er und starb er. Noch größer als die Frömmigkeit, welche er nach außen zeigte, war die, welche in seinem Inneren verborgen war und welche er Gott offenbarte und weihte. Soll ich alles übergehen, nämlich seine Sorge für die notleidenden Verwandten, seinen Abscheu vor dem Hochmut, seine unparteiische Freundlichkeit, seine Offenheit gegenüber den Herrschern, seine Kämpfe für die Wahrheit, seine vielen nicht nur klaren, sondern auch durchaus religiösen und begeisternden Reden, die er an viele gehalten hatte, und soll ich statt alles, was er geleistet hat, nur etwas berichten: das Erwähnenswerteste ist folgendes. Ein Kaiser von schlimmem Rufe raste gegen uns. Nachdem er durch seinen Abfall von Christus zunächst gegen sich selbst gewütet hatte, wurde er nun auch seinem Nächsten gegenüber unausstehlich. Aber nicht gleich den übrigen Christusfeinden bekannte er sich offen zur Gottlosigkeit, vielmehr verbarg er seine Verfolgungssucht unter dem Scheine der Loyalität. Gleich der sich krümmenden Schlange, welche von seiner Seele Besitz genommen hatte, zog er auf alle mögliche Weise armselige Menschen in seinen Abgrund. Da dieser Edelmann die Christen sogar um die Ehre des Martyriums beneidete und darum nicht einmal wollte, daß wir dieser Ehre gewürdigt werden, war es vor allem sein Sinnen und Trachten, zum Martyrium verurteilte Christen als Verbrecher hinzustellen. Sodann wollte er, daß man sein Einschreiten nicht als Gewalt, sondern als Erziehung bezeichne, gerade als ob die, welche freiwillig zur Gottlosigkeit übertreten, mehr auf Ehre als auf Sicherheit geben. Nachdem er die einen durch Geld, andere durch Ehren oder Versprechungen oder durch alle möglichen Auszeichnungen, welche er nicht in königlicher Vornehmheit, sondern echt demokratisch vor aller Augen erwies, und alle durch seine bestrickenden Worte und durch sein Beispiel für sich gewonnen hatte, versuchte er es aus vielen Gründen auch mit Cäsarius. Welche Torheit, welcher Wahnsinn war es, zu hoffen, einen Cäsarius, der mein Bruder und der Sohn solcher Eltern war, zu erbeuten!</p><p>[Forts. v. ] Ich will mich etwas bei der Erzählung aufhalten. Der Bericht über das seltsame Ereignis soll mir eine Freude sein, wie dieses selbst eine Freude für die Teilnehmer war. Der edle Cäsarius trat, mit dem Zeichen Christi bewaffnet und von dem großen Logos geschützt, vor den starkgerüsteten, redegewandten Kaiser. Des Kaisers Anblick erschreckte den Cäsarius nicht und seine Schmeichelreden raubten ihm nicht die Gesinnung. Er war ein Kämpfer, der in Worten und Taten seinen Mann stellte gegenüber dem, der es verstand, hier wie dort zu streiten. So war der Kampfplatz, auf welchem dieser große Kreuzesritter sich zu messen hatte. Den Kampf bestimmte auf der einen Seite Christus, der den Kämpfer mit seinem Kreuze bewaffnete, auf der anderen Seite ein furchtbarer Tyrann, der durch freundliche Worte schmeichelte und durch die Wucht seiner Gewalt schreckte. Die Zuschauer waren einerseits solche, die der Kirche treu geblieben waren, anderseits solche, welche der Kaiser abtrünnig gemacht hatte. Sie warteten, nach welcher Seite sich der Kampf entschiede; sie waren auf den Sieg gespannter als die Schauspieler.</p><p>Warst du nicht um Cäsarius in Sorge? Hattest du nicht gefürchtet, er möchte aus Willensschwäche sich unwürdig benehmen? Geduld! Der Sieg war Christi, der „die Welt besiegt hat“. Es wäre mir ― wisset es wohl! ― eine große Ehre, wenn ich die Reden und Ansichten, die damals vorgetragen worden waren, jetzt im einzelnen wiedergeben könnte. Die Disputation enthielt geistreiche Wendungen und Feinheiten, an die ich mich mit Vergnügen erinnere. Aber Zeit und Thema gestatten durchaus nicht, darauf einzugehen. Nachdem Cäsarius alle Spitzfindigkeiten seines Gegners widerlegt und alle geheimen und offenen Angriffe gewissermaßen spielend zurückgewiesen hatte, erklärte er laut und feierlich: „Ich bin Christ und bleibe Christ.“ Doch trotz dieses Bekenntnisses wurde er keineswegs seines Amtes entsetzt. Denn zu stark war des Kaisers Verlangen, den wissenschaftlichen Verkehr mit Cäsarius weiter zu genießen. Damals war es, daß der Kaiser vor allen das bekannte Wort sprach: „O glücklicher Vater, o unglückliche Söhne!“ Er geruhte nämlich, zugleich auch uns zu beschimpfen, da er in Athen unsere Kenntnisse und unsere religiöse Gesinnung kennengelernt hatte. Da die gerechte Vorsehung den Kaiser zum Kampfe gegen die Perser gerüstet hatte, sollte Cäsarius noch ein zweites Mal (an den Hof in Konstantinopel) kommen dürfen, nachdem er als glücklicher Flüchtling und unverwundeter Sieger, berühmter durch die Schmach, die er erlitten, als durch den Glanz, der ihn umgeben hatte, zu uns zurückgekehrt war.</p><p>Ich halte diesen Sieg für weit herrlicher und wertvoller als seines Gegners große Macht, herrlichen Purpur und kostbares Diadem. Daß ich dies erzählen kann, freut mich mehr, als wenn der Kaiser sein ganzes Reich mit ihm geteilt hätte. Den bösen Zeiten ging er aus dem Wege gemäß unserer Moral, welche zwar verlangt, daß man sich zu gegebener Zeit um der Wahrheit willen Gefahren unterziehe und nicht feige die Religion im Stiche lasse, aber auch will, daß man, solange es möglich ist, sowohl aus Sorge für die eigene Seele, wie aus Rücksicht auf die Feinde, die Gefahren nicht heraufbeschwöre. Als die Finsternis verscheucht war, das Ausland gut und gerecht entschieden, das gezückte Schwert den Gottlosen niedergestreckt hatte und für die Christen wieder geordnete Verhältnisse eingetreten waren, mit welchen Auszeichnungen und welchem Glanze, mit wieviel schönen Ehrenbezeigungen wurde er da wieder am Hofe aufgenommen! Es war, wie wenn er nicht Ehren empfangen, sondern Ehren gespendet hätte. Eine Ehrenperiode war einer anderen gefolgt. Während die Zeit die Kaiser verdrängte, konnten Cäsarius’ Würden und kaiserliche höchste Ämter nicht genommen werden. Die Kaiser stritten sich darum, wer ihm nähertreten dürfe und wer das größere Recht darauf besäße, sein Freund und Vertrauter zu heißen. Solchen Lohn erntete Cäsarius für solch religiöse Gesinnung. Mögen sich dies Jünglinge und Männer merken und mögen sie, da „die Frucht guter Werke herrlich ist“, durch gleiche Tugend zu gleichem Glanze emporgeführt werden, zumal wenn sie darnach streben und im Glanze einen Teil des Glückes vermuten.</p><p>Noch ein Ereignis aus seinem Leben erregt Staunen; es gibt klares Zeugnis sowohl von seiner eigenen Gottesfurcht wie von der seiner Eltern. Es war während seines Aufenthaltes in Bithynien, wo er ein Amt bekleidete, das ihn dem Kaiser sehr nahebrachte. Er hatte nämlich die Aufgabe, für den Kaiser die Gelder einzutreiben und die Kassen zu verwalten. Dieses Amt sollte nach der Absicht des Kaisers die Vorstufe zu noch höheren sein. Als in Nicäa vor nicht langer Zeit ein Erdbeben, welches das schlimmste seit Menschengedenken gewesen sein soll, fast alle Einwohner ergriffen und zugleich mit der schönen Stadt vertilgt hatte, entging er als der einzige von den höheren Persönlichkeiten mit nur ganz wenigen Menschen, wunderbarerweise von den Trümmern selbst geschützt, mit nur geringen Erinnerungen an die Gefahr dem Untergange. Der überstandene Schrecken sollte ihn erziehen, noch Größeres zu retten und sich ganz dem höheren Leben zu weihen durch Aufgebung seines Dienstes am Vergänglichen und durch Wegzug vom Hofe. Daran dachte er auch und darnach ging sein heißes Verlangen, wie ich mich aus einem Briefe überzeugen konnte, den er an mich schrieb, als ich, die günstige Gelegenheit benützend, mahnende Worte an ihn gerichtet hatte. An solch mahnenden Worten hatte ich es übrigens nie fehlen lassen, da mir daran gelegen war, daß seine Talente sich nicht in minderwertigen Beschäftigungen verbrauchen, seine ausgesprochene Denkernatur sich nicht mit gemeinen Arbeiten abgebe und er nicht der Sonne gleiche, die von Wolken verhüllt wird. Dem Erdbeben war Cäsarius zwar entgangen, der Krankheit jedoch entging er als Mensch nicht. Jenes Glück war ihm speziell zuteil geworden; das Los der Krankheit aber teilte er mit den übrigen Menschen. Jenes Glück war ein Lohn für seine Frömmigkeit, dieses Los eine Folge seiner Natur. Die tröstliche Freude war dem Schmerze vorausgegangen, damit wir in der Erschütterung über seinen Hingang uns über seine einstige wunderbare Rettung freuen. Nun ist uns der große Cäsarius wiedergegeben worden als kostbare Asche, als ruhmreicher Toter. Unter ständigen Gesängen wird ihm das Geleite gegeben, an der Stätte der Märtyrer wird er beigesetzt, mit heiligen Händen schmücken ihn seine Eltern; fromme Gesinnung an Stelle der Trauer treten lassend, trägt seine Mutter weißes Gewand, hält entsagend ihre Tränen zurück und beruhigt ihren Schmerz durch Lieder. Die neugeschaffene Seele, welche der Geist durch die Taufe umgewandelt hatte, erntet Ehren, die ihrer würdig sind.</p><p>Diese Worte, o Cäsarius, sind mein Totengeschenk. Hiemit spende ich dir die Erstlingsgabe meiner Reden. Oft hattest du mein Schweigen getadelt, für dich aber solltest du meine Zunge lösen. Meine Rede ist der Leichenschmuck, den ich dir gebe. Sie ist, wie ich wohl weiß, dir der allerschönste Schmuck, sie ist dir lieber als wallende, weiche Seidengewänder, an denen du zu Lebzeiten, nur von der Tugend geschmückt, nicht gleich der Menge Gefallen hattest, lieber als die Gewebe durchsichtiger Leinwand oder als die kostbaren Salben, die du auch schon früher den Frauengemächern überlassen hattest und deren Wohlgeruch an einem einzigen Tage dahin ist, lieber als sonst etwas Minderwertiges, das nur kleinliche Leute schätzen. All dies wäre heute gleich deinem wertvollen Leichnam von diesem unbarmherzigen Steine zugedeckt worden. Ich brauche nicht die heidnischen Wettkämpfe und Vorträge, durch welche unglückliche Jünglinge ausgezeichnet wurden, und welche für unbedeutende Kämpfe unbedeutende Preise verliehen. Nicht brauche ich all die Trankopfer und Spenden, die Kränze und frischen Blumen, durch welche man die Verstorbenen ehrte, nicht der Vernunft, sondern vielmehr ererbter Sitte und unverständiger Trauer folgend. Mein Geschenk ist das Wort, welches vielleicht auch in der Zukunft sich erhält, sich ständig fortpflanzend und den Hingeschiedenen nicht völlig verabschiedend, und welches dafür sorgt, daß der Name des Gelehrten immer im Gehör und im Gedächtnis bleibt, und das Bild des Ersehnten lebhafter zeichnet, als es Gemälde tun könnten.</p><p>[Forts. v. ] Darin besteht unser Geschenk. Ist es auch klein und würde dir noch mehr gebühren, so ist doch das, was wir unseren Kräften entsprechend bieten, Gott wohlgefällig. Zu dem Geschenk, das wir geben, fügen wir aber später noch andere; denn jährlich wollen wir Hinterbliebenen dich ehren und deiner gedenken. Du, göttliches, heiliges Haupt, tritt ein in den Himmel und ruhe aus im sog. Schoße Abrahams! Mögest du die Reigen der Engel und der Seligen Glanz und Herrlichkeit schauen, bzw. mögest du selbst an ihren Reigen und Freuden teilnehmen und von der Höhe herab über alles Irdische, die sog. Reichtümer, die nichtigen Würden, die falschen Ehren, den trügerischen Sinnenreiz, die Unstetigkeit des Lebens, die an nächtliche Kämpfe erinnernde, aussichtslose Verwirrung lächeln, wenn du zur Seite des großen Königs stehst und von dessen Licht durchströmt wirst! Möchten wir davon einen kleinen Strahl hienieden empfangen, um das Licht in Spiegeln und Rätseln zu schauen, und möchten wir nach diesem Leben unmittelbar zur Quelle des Guten gelangen, mit reinem Sinne die reine Wahrheit erkennend, und als Lohn für unser irdisches Ringen um das Gute dort ein vollkommeneres Genießen und Schauen des Guten finden, was Schriften und Geistliche uns als Zweck des kirchlichen Lebens verkünden!</p><p>Was haben wir noch zu sagen? Noch wollen wir den Trauernden durch das Wort Linderung verschaffen. Kräftig wirkt ein Heilmittel, wenn es den Klagenden von solchen gereicht wird, die mitleiden. Wer vom gleichen Schmerz ergriffen ist, kann die Heimgesuchten am besten trösten. Ich denke da vor allem an jene, deren ich mich schämen würde, wenn sie sich nicht in der Geduld ebenso vor allen auszeichnen würden wie in allen anderen Tugenden. Mehr als alle lieben sie ihre Kinder, doch in noch höherem Grade übertreffen sie alle an Liebe zur Weisheit und zu Christus. Gerne dachten sie an das Hinscheiden aus dieser Welt, und gerne erinnerten sie ihre Kinder daran; eigentlich war ihr ganzes Leben nichts anderes als eine Erinnerung an den Tod. Sollte noch mein Schmerz meine Ausführungen verdunkeln und wie eine Augenentzündung mich hindern, meine Pflicht klar zu erkennen, wohlan, nehmet gleichwohl den Trost hin, den die Jugend dem Alter, der Sohn den Eltern, der, welcher noch der Belehrungen solcher Erzieher bedarf, denen bietet, die in langjähriger Erfahrung viele belehrt haben! Wundert euch nicht, wenn ich als junger Mensch bejahrten Leuten Mahnungen gebe! Euch verdanke ich es ja, wenn ich manches besser sehe als das Alter. Ihr ehrwürdigen Greise, die ihr Gott nahe seid, wie lange werden wir noch leben? Wie lange werden wir noch auf dieser Welt zu leiden haben? Im Vergleich mit dem göttlichen, ewigen Leben ist schon das ganze Menschenleben kurz, geschweige denn der Rest des Lebens, das ― wenn ich so sagen darf ― Erlöschen des menschlichen Atems, das Ende des hinfälligen Lebens. Wie weit ist uns Cäsarius vorausgeeilt? Wie lange werden wir noch sein Hinscheiden beklagen? Eilen wir nicht der gleichen Wohnung zu? Wird uns nicht bald der gleiche Stein zudecken? Werden wir nicht in kurzem zu gleichem Staube werden? Sollen uns nicht diese wenigen Tage den Vorteil bringen, daß wir noch Schlimmeres sehen, leiden, vielleicht auch tun, um dem Gesetze der Natur den gemeinsamen, unnachläßlichen Zoll zu zahlen und nicht nur nachzufolgen, sondern auch voranzugehen, nicht nur zu beweinen, sondern auch beweint zu werden und die Liebesgabe der Tränen, die wir anderen geschenkt haben, auch zu empfangen?</p><p>Brüder, so ist unser Leben. Nur vorübergehend existieren wir. Das ist die irdische Tragödie: wir sind nicht und werden geboren, und wir werden geboren und sind nicht mehr. Wir gleichen dem Traume, der verfliegt, dem Phantasiegebilde, das keinen Bestand hat, dem vorbeifliegenden Vogel, dem Schiffe, das auf dem Meere keine Spur hinterläßt, dem Staube, dem Rauche, dem Morgentau, der Blume, die blüht und verwelkt. „Wie Gras sind die Tage des Menschen; er verblüht wie die Blume des Feldes.“ Über unsere Schwäche hat sich der treffliche David auch in folgenden Worten gut ausgesprochen: „Nenne mir die kleine Zahl meiner Tage!“ Das Maß, das er den Tagen des Menschen gibt, ist nur eine Spanne. Was sagst du dazu, daß Jeremias seiner Mutter aus Schmerz wegen seiner Geburt Vorwürfe machte und noch dazu wegen der Angriffe, die ihm Fremde bereiteten? Alles ― sagt der Prediger ― habe ich gesehen, alles Menschliche habe ich an meinem Geiste vorüberziehen lassen: Reichtum, Lust, Macht, unsicheren Ruhm, die Weisheit, welche entflieht, ehe sie festgehalten wird, dann wieder die Lust und wieder die Weisheit, zu den gleichen Gütern wiederholt zurückkehrend; ferner die Genüsse des Gaumens, Lustgärten, zahlreiche Dienerschaft, große Besitzungen, Kellner und Kellnerinnen, Sänger und Sängerinnen, Waffen, Speerträger, huldigende Völker, reichliche Abgaben, königliche Würde, allen Überfluß und alles Notwendige, so daß ich alle Könige, die vor mir lebten, übertroffen habe. Und was ist mein Urteil über all dies? „Alles ist größte Eitelkeit, alles ist Eitelkeit und Einbildung.“ D. h. es wird törichterweise von den Seelen erstrebt und vom Menschen verlangt zur Strafe für seine erste Sünde. Zum Schluß mahnt der Prediger: „Höre auf alles und fürchte Gott!“ In der Furcht Gottes hat die Unruhe ihr Ende. Der einzige Gewinn, den du vom irdischen Leben haben kannst, ist, daß du durch die Unruhe der sichtbaren, unsteten Dinge zu dem Ewigen, Unbeweglichen geführt wirst.</p><p>Da wir die Übel kennen, von denen Cäsarius befreit worden ist, wollen wir nicht ihn beklagen; vielmehr uns selbst wollen wir beklagen, da wir in diesen Übeln zurückgelassen worden sind und wir deren noch viele ernten werden, wenn wir nicht in aufrichtiger Hingabe an Gott und unter Verachtung des Vergänglichen dem himmlischen Leben zustreben, wenn wir Erdenkinder nicht die Erde verlassen und allen Ernstes dem Geiste folgen, der in die Höhe führt. Solche Pflichten empfinden kleinmütige Menschen schmerzlich, starken Geistern aber erscheinen sie leicht. Doch überlegen wir nur! Cäsarius herrscht zwar nicht; aber er wird auch nicht von anderen beherrscht. Zwar flößt er niemandem Furcht ein; aber er hat auch keine strengen Gebieter zu fürchten, die oftmals gar nicht würdig sind, an der Spitze zu stehen. Zwar sammelt er keine Reichtümer; aber er braucht nicht scheel auf Neider zu schauen, und seine Seele krankt nicht an sündhafter Habgier und an dem Streben, um so mehr zu erwerben, je mehr man besitzt. Denn Reichtum ist die Krankheit, in der man unaufhörlich nach mehr verlangt und durch Trinken stets wieder neuen Durst erregt. Nicht tritt er als Redner auf; aber in Reden wird er bewundert. Nicht behandelt er die Lehren des Hippokrates und Galenos und nicht die entgegengesetzten Ansichten; aber fremdes Unglück bereitet ihm selbst kein Leid mehr, er steht nicht mehr unter dem schmerzenden Einfluß der Krankheiten. Nicht beweist er die Sätze des Euklid, des Ptolemäus, des Heron; aber er braucht sich auch nicht über den Hochmut der Ungebildeten, die alles besser wissen wollen, zu ärgern. Er schmückt sich nicht mehr mit Aussprüchen von Plato, Aristoteles, Pyrrhon, Demokrit, Heraklit, Anaxagoras, Kleanthes und Epikur und irgendwelchen Worten der ehrwürdigen Stoa und Akademie; aber er ist auch der Sorge enthoben, deren Lehren zu widerlegen. Was soll ich sonst noch erwähnen? Es fehlt ihm das, was allen wertvoll und erstrebenswert ist: er hat kein Weib, keine Kinder. Doch er braucht sie auch nicht zu beweinen und wird von ihnen nicht beweint; denn er braucht sie nicht zu verlassen und wird auch nicht als unglückliche Erinnerung verlassen. Er erbt keine Schätze; aber er wird beerbt und zwar von den besten, selbsterwählten Erben, um, alles bei sich führend, reich von hinnen zu scheiden. Welche Ehren! Ein neuer Trost! Starken Geistes sind die, welche darnach streben. Alle Ohren sollten auf diese Worte hören! In frommem, heiligem Gelübde wird einer Mutter Schmerz erstickt. Alle Güter ihres Sohnes, alles, was sie ihm schenken könnte, legt sie zu seinem Vorteil ihm ins Grab, und wer etwas erwartete, ging leer aus.</p><p>Doch ich bin mit meinen Trostworten noch nicht zu Ende. Ich will noch ein kräftigeres Trostmittel verabreichen. Ich schließe mich den Worten der Weisen an, welche lehren: Jede gute, Gott wohlgefällige Seele gelangt, sobald sie von dem mitgefesselten Körper befreit ist und ihn verläßt, sofort zum Genuß und zur Anschauung des Guten, von dem sie erwartet wird, da ja das, was sie verfinsterte, gereinigt oder beseitigt wird oder sonst etwas damit geschieht; sie erfreut sich einer wunderbaren Seligkeit und jubelt, sie tritt, da sie dem beschwerlichen Gefängnis des Erdenlebens entronnen ist und die hindernden Ketten, welche die Flügel des Geistes lahmlegten, abgeschüttelt hat, beglückt vor ihren Herrn und genießt die ihr bestimmte Herrlichkeit, um sie nunmehr zu schauen. Bald erhält sie ihren Genossen, den Körper, mit dem sie auf Erden lebte, von der Erde, welche ihn gegeben hatte und welcher er anvertraut war, in einer Weise wieder zurück, die Gott, der beide verbunden und gelöst hat, kennt, und übernimmt gemeinsam mit dem Körper das Erbe der himmlischen Herrlichkeit. Wie die Seele an den Mühen des Körpers wegen der Vereinigung mit ihm teilgenommen hatte, so läßt sie ihn an ihren eigenen Freuden teilnehmen; denn sie nimmt ihn ganz in sich auf, wird mit ihm eins, wird mit ihm Geist, Verstand, Gott, da das Sterbliche und Vergängliche durch das Leben vertilgt sein wird. Vernimm, was dem trefflichen Ezechiel über die Zusammenfügung von Knochen und Nerven gelehrt wird und was später dem trefflichen Paulus über das irdische Zelt, das niedergerissen werden wird, und über das nicht von Menschenhänden erbaute Haus, das im Himmel hergerichtet ist, geoffenbart wird! Paulus bezeichnet das Verlassen des Körpers als Erscheinen vor dem Herrn und beklagt das Wohnen im Körper als Verbannung, weshalb er sehnsüchtig seine Auflösung herbeiwünschte. Soll ich noch kleinmütig sein, wenn ich solche Hoffnungen habe? Warum soll ich an der Zeit hängen? Ich warte auf die Stimme des Erzengels, auf den letzten Posaunenschall, auf die Umwandlung des Himmels, die Veränderung der Erde, die Befreiung der Elemente, die Erneuerung des Weltalls. Wenn ich alsdann Cäsarius schaue, ist er nicht mehr in der Fremde, nicht mehr auf der Bahre, wird er nicht mehr beklagt, nicht mehr bemitleidet, dann ist er im Lichte, in der Herrlichkeit, im Himmel. Und so sah ich dich, teuerster Bruder, der so sehr an seinen Geschwistern hing, oftmals im Traume, mochte mein Wunsch oder die Wahrheit dich also verklärt haben.</p><p>Ich will die Tränen lassen und nunmehr in mich gehen und schauen, ob nicht, ohne daß ich es merke, manches in mir ist, was ich beweinen muß. Auf meine eigenen Verhältnisse will ich achten. „Ihr Menschenkinder ― denn euch geht die Rede an ―, wie lange ist euer Herz schwer und euer Geist stumpf? Warum liebt ihr die Eitelkeit und sucht ihr die Lüge?“ Wie kommt ihr dazu, das irdische Leben und diese wenigen Tage hoch einzuschätzen? Sollen wir uns von solch süßem, liebem Scheiden abwenden, als wäre es etwas Drückendes und Schreckliches? Wollen wir nicht zur Selbsterkenntnis gelangen? Wollen wir nicht das Sinnliche ablegen? Wollen wir nicht auf das Geistige achten? Und wenn geklagt sein muß, wollen wir uns nicht vielmehr darüber ärgern, daß der Aufenthalt in dieser Fremde so lange währt? Wollen wir uns nicht dem trefflichen David anschließen, der das irdische Leben als Zelt der Finsternis, „Stätte der Trübsal, „Schlamm der Tiefe“, „Schatten des Todes“ bezeichnet? Wollen wir uns nicht darüber ärgern, daß wir so lange in den Gräbern, die wir herumtragen, bleiben, daß wir, obwohl wir zu Göttern geworden sind, doch noch als Menschen den Tod der Sünde sterben? Die Furcht vor diesem Tode hält mich Tag und Nacht fest. Daß in der Ferne nicht nur die Herrlichkeit, sondern auch das Gericht winkt, läßt mich nicht zur Ruhe kommen. Nach der Herrlichkeit strebe ich so sehr, daß ich ausrufen kann: „Es schmachtet meine Seele nach deinem Heile“; vor dem Gerichte aber erschrecke ich und entsetze ich mich. Nicht das fürchte ich, daß dieser Leib, wenn er zerflossen und vernichtet ist, vollständig dahingeht, sondern daß das edle Gebilde Gottes ― edel ist es, wenn es seine Pflicht tut; unedel aber, wenn es sündigt ―, in welchem Vernunft, Gesetz, Hoffnung wohnen, zur gleichen Strafe wie die unvernünftigen Wesen verurteilt werde und nach seiner Trennung um nichts besser sein soll, ein Los, das allerdings denen gebührt, die in Gottlosigkeit leben und das höllische Feuer verdienen.</p><p>Möchte ich doch die irdischen Glieder ertöten! Möchte ich alles im Geiste aufgehen lassen, indem ich den schmalen, von wenigen betretenen Weg gehe und den breiten, bequemen Weg meide! Denn, was diesem Leben folgt, ist Glanz und Größe, und, was wir erhoffen dürfen, ist mehr, als uns gebührt. „Was ist der Mensch, daß du seiner gedenkest?“ Was ist dieses neue Geheimnis, das in mir offenbar wird? Ich bin klein und doch groß, nieder und doch erhaben, sterblich und doch unsterblich, irdisch und doch himmlisch. Das eine bin ich durch diese Welt, das andere bei Gott, das eine im Fleische, das andere durch den Geist. Mit Christus muß ich begraben werden, mit Christus auferstehen, mit Christus erben; ich muß Gottes Sohn werden, Gott selbst. Bis zu welcher Höhe hat uns doch die Rede allmählich emporgeführt! Fast möchte ich dem Schmerze danken, der solche Ideen eingegeben und es bewirkt hat, daß ich mich noch mehr nach dem Scheiden sehne. So will es das große Geheimnis, so will es Gott, der für uns Mensch geworden ist und sich zur Armut erniedrigt hat, um das Fleisch zu erwecken, das Ebenbild zu retten und den Menschen neu zu schaffen, auf daß wir alle eins werden in Christus, der in uns allen auf vollkommene Weise das geworden ist, was er selbst ist, auf daß nicht mehr die Verschiedenheit des Fleisches besteht und nicht mehr ein Unterschied ist zwischen Mann und Weib, Barbare, Skythe, Sklave, Freiem, daß wir vielmehr nur noch das Merkmal Gottes an uns tragen, von welchem und für welchen wir erschaffen worden sind, und daß wir so von ihm umgestaltet und gezeichnet werden, daß er allein es ist, der uns kenntlich macht.</p><p>Möge uns das, was wir hoffen, nach der großen Güte des freigebigen Gottes zuteil werden! Wenig verlangt er, aber reichlich schenkt er jetzt und später denen, die ihn aufrichtig lieben. „Alles ertragen wir, alles erdulden wir“, da wir ihn lieben und auf ihn hoffen. In allem sagen wir ihm Dank, im Glück wie im Unglück, in Freuden wie in Leiden, da auch sie bekanntlich oftmals Werkzeuge des Heiles sind. Ihm empfehlen wir unsere eigenen Seelen und die derer, welche auf dem gemeinsamen Wege voraneilen und früher dahingehen. Dies wollen wir tun, und mit diesem Vorsatze beenden wir unsere Rede und beendet ihr eure Tränen, um nunmehr an euer Grab zu eilen, das Cäsarius von euch als trauriges und einziges Geschenk erhält, das allerdings eigentlich den Eltern und dem Alter bestimmt ist, das aber dem Sohne und der Jugend geschenkt wird wider die Ordnung ― doch nicht wider die Ordnung Gottes, der unsere Geschicke leitet. O Herr und Bildner aller, vor allem auch dieses Geschöpfes, o Gott deiner Menschen, o Vater und Lenker, o Herr über Leben und Tod, Hüter und Wohltäter unserer Seelen, der du alles machst und alles durch dein schöpferisches Wort zur rechten Zeit, wie du es in der Tiefe deiner weisen Anordnung für gut hältst, änderst, nimm nun Cäsarius als Erstlingsgabe unserer Pilgerschaft entgegen! Wenn der Jüngste der erste sein soll, wir fügen uns deinen Worten, durch welche du das Weltall trägst. Nimm aber auch uns selbst später zur bestimmten Zeit zu dir, nachdem du uns, solange es für uns gut ist, im Fleische hast wohnen lassen! In der Furcht vor dir wollen wir vorbereitet sein, nicht wollen wir verzagen, nicht am letzten Tage feige werden, nicht nach Art derer, welche die Welt und das Fleisch lieben, nur mühsam uns von dieser Welt losmachen, sondern gerne wollen wir kommen, wenn du uns in das andere, dauernde, selige Leben, das in Christus Jesus, unserm Herrn, ist, aufnimmst! Amen.VIII. Rede</p><h2>VIII. Rede</h2><p><em>VIII. Rede</em>.</p><p><em>Trauerrede auf seine Schwester Gorgonia</em>.</p><p>Wenn ich meiner Schwester eine Lobrede halte, ist es Eigenlob. Doch wahrlich spreche ich nicht deshalb, weil ich Eigenlob verkünde, Unwahres. Nein, weil es wahr ist, verkünde ich das Lob. Wahr aber sind meine Worte nicht nur deshalb, weil sie gerecht sind, sondern auch deshalb, weil sie anerkannt sind. Nach Gunst dürfen wir nicht reden, auch wenn wir wollten. Wie ein gewiegter Richter steht der Zuhörer zwischen Rede und Wahrheit, um, wie es sich gebührt, ungehörigen Worten den Beifall zu verweigern und verdiente Worte zu fordern. Nicht fürchte ich, mehr zu sagen, als wahr ist. Wohl aber habe ich Angst, hinter der Wahrheit zurückzubleiben und, viel Wertvolles übergehend, ihren Ruhm durch meine Lobrede zu schmälern. Es ist nämlich schwer, ihrem Charakter in Wort und Tat zu entsprechen. Nicht soll all das, was fremd ist, gelobt werden, was unrecht wäre, noch soll das Eigene, wenn es Ehre verdient, der Ehre beraubt werden; denn im ersten Falle wäre das Fremdsein ein Vorteil, im anderen Falle die Verwandtschaft ein Nachteil. Würde das Fremde gelobt, das Eigene verschwiegen, so würde die Gerechtigkeit verletzt werden. Unsere Richtschnur ist die Wahrheit, auf sie allein schauen wir, ohne im geringsten auf das zu achten, was bei der käuflichen Menge Wert hat. Wir loben und verschweigen daher das, was des Lobens und Verschweigens wert ist.</p><p>[Forts. v. ] Das allertörichtste ist es, einerseits es zwar als pietätlos zu bezeichnen, wenn man die eigenen Angehörigen vernachlässigt, schmäht, anklagt oder ihnen sonst ein kleineres oder größeres Unrecht zufügt, ja ein Verfehlen gegen die Nächststehenden als allergrößte Sünde zu erklären, anderseits aber es als recht zu erachten, daß die Rede, welche vor allem den Guten gebührt und durch welche wir ihr Andenken verewigen möchten, ihnen versagt wird und daß man mehr Rücksicht auf die schlimmen Elemente, welche der Schmeichelei beschuldigen, nimmt, als auf die verständigen, welche eine würdige Rede wünschen. Wenn man auch nichts weiß und keine Beweise hat, werden gleichwohl ― was allerdings noch nicht das Schlimmste ist ― Fernstehende ungehindert gepriesen; aber wenn man jemanden kennt und mit ihm befreundet ist, dann gestattet es der Neid vieler nicht, ihm Lob zu spenden, vor allem dann nicht, wenn er aus diesem Leben geschieden ist, obwohl ihm doch, weil er u. a. auch seine Freunde und Tadler verlassen hat, kein Gefallen mehr erwiesen werden kann.</p><p>Nachdem wir uns genügend gerechtfertigt haben und gezeigt haben, daß unsere Worte notwendig sind, wollen wir nun zur Lobrede übergehen. Feinheit und Eleganz im Ausdruck wollen wir dabei verschmähen, da auch die Selige den Prunk nicht liebte und Prunklosigkeit ihr Schmuck war. Wir wollen unsere Pflicht erfüllen und die drückendste Schuld abtragen, zugleich aber auch das Volk zur eifrigen Nachahmung der gleichen Tugenden erziehen; denn in all unserem Reden und Handeln ist es uns darum zu tun, die anvertrauten Seelen aufzurichten. Ein anderer möge unter Einhaltung der rhetorischen Regeln das Vaterland und die Familie der Heimgegangenen rühmen. Es wird ihm nicht an Stoff zu einer umfangreichen Lobrede fehlen, falls er die Verstorbene mit Äußerlichkeiten schmücken will, wie man eine edle, schöne Gestalt mit Gold, Edelsteinen und kunstvoll gefertigten Kostbarkeiten ziert. Solcher Schmuck entstellt erst recht eine häßliche Frau, während er eine schöne Frau nicht schöner macht, da er hinter ihrer Schönheit zurückbleibt. Ich werde den erwähnten rhetorischen Gesetzen nur insofern folgen, als ich der gemeinsamen Eltern gedenke, zumal es taktlos wäre, die Erzeuger und Erzieher eines solchen Gutes zu ignorieren. Möglichst rasch werde ich dann auf die Verstorbene selber übergehen, um dem Wunsche derer zu entsprechen, welche ihren Lebenslauf erfahren möchten.</p><p>Wer kennt nicht unseren jetzigen Abraham und unsere derzeitige Sara, nämlich Gregor und Nonna, sein Weib? Es ist gut, auch ihrer Namen zu gedenken, da sie eine Mahnung zur Tugend sind. Er wurde gerechtfertigt durch den Glauben, sie verband sich mit dem Gläubigen; er wurde wider Erwarten Vater vieler Völker, sie wurde wunderbarerweise Mutter; er entzog sich durch Flucht der Knechtschaft der heimatlichen Götter, sie wurde die Tochter und Mutter der Freien; er verließ um des Landes der Verheißungen willen seine Verwandtschaft und sein Vaterhaus, sie veranlaßte ihn, fortzuziehen, worin allein sie ― wenn ich so sagen darf ― noch Sara übertraf; er zog in guter Absicht in die Fremde, sie begleitete ihn bereitwillig; er weihte sich dem Herrn, sie betitelte und betrachtete ihren Mann als Herrn und erhielt deshalb Anteil an seiner Rechtfertigung. Beiden wurde die Verheißung gegeben, beide hatten in gewisser Beziehung ihren Isaak, beide brachten das Opfer.</p><p>[Forts. v. ] Dem Gebete und der Leitung der Mutter verdanken wir den guten Hirten und das Vorbild eines guten Hirten. Des Vaters Verdienst ist es, allen Ernstes den Götzendienst verlassen zu haben und nunmehr die Dämonen zu verscheuchen. Sie hatte niemals das Salz mit den Götzendienern geteilt. In der Ehe, welche sie nicht nur fleischlich, sondern auch in den Tugenden und mit Gott verbunden hat, teilen sie ihre Ehren, ihre Gesinnungen, ihre Seelen. Gleich sind sie an Lebensjahren, gleich an Verständigkeit und Tugendglanz. Dem Fleische nach werden sie allerdings noch einige Zeit hienieden zurückgehalten; geistig aber sind sie, wenn sie auch noch nicht gestorben sind, doch der Welt entrückt. Die Welt hat auf sie keinen Einfluß, aber sie auf die Welt; denn sie verachten die Welt und achten sie wieder. Sie verzichten auf Reichtum, werden aber im Gutestun reich; indem sie die Welt verachten, tauschen sie himmlische Schätze ein. Kurz ist der Rest dieses Lebens, der ihnen noch verbleibt, um Gott zu dienen; sehr lang aber war das Leben, das sie in Mühen verbringen mußten. Nur noch ein einziges weiteres Wort will ich über die Eltern sprechen: in schöner und gerechter Weise wurden sie den beiden Geschlechtern zugewiesen, er als Zierde der Männer, sie als Zierde der Frauen, doch nicht nur als Zierde, sondern auch als Vorbild.</p><p>Solchen Eltern verdankte Gorgonia Leben und Ehre, die Keime der Religiosität, den guten Lebenswandel, die Hoffnung auf ein besseres Leben, den seligen Tod. Dies sind Vorzüge, die manchen versagt bleiben, welche auf edle Abstammung etwas geben und auf ihre Ahnen stolz sind. Soll ich aber noch Edleres und Höheres über Gorgonia berichten: ihr Vaterland war das himmlische Jerusalem, die unsichtbare, nur geistig geschaute Stadt, in der unser Wandel ist und der wir zueilen, deren Bürger Christus ist und mit ihm „die festliche Schar der Erstgeborenen, die im Himmel eingeschrieben sind“ und rings um den großen Gründer jener Stadt im Genusse seiner Herrlichkeit sich freuen und ewige Chöre aufführen. Gorgonias Adel offenbarte sich in der Reinhaltung des Ebenbildes, in der durch Verstand und Tugend bewirkten Verähnlichung mit dem Urbilde, in dem Verlangen, die wahren Idealisten immer mehr zu vergöttlichen, und in der Erkenntnis des menschlichen Ursprungs, Wesens und Zieles.</p><p>[Forts. v. ] Ich bin hierüber unterrichtet. Darum erkläre ich mit Überlegung ihre Seele für edler als alles, was das Morgenland bietet. Der Maßstab, nach dem ich hohe oder niedere Geburt bemesse, ist besser als bei den meisten; denn nicht frage ich nach dem Blute, sondern nach den Sitten. Bei Lob oder Tadel schaue ich nicht auf die Verwandtschaft, sondern auf die Person. Da ich vor solchen spreche, die Gorgonias Vorzüge gekannt haben, möge der eine noch dies, der andere noch jenes zur Ergänzung meiner Worte beitragen! Mag einer noch so gut hören und verstehen, er kann doch nicht allein alles wissen.</p><p>Gorgonia zeichnete sich durch Enthaltsamkeit aus und übertraf hierin alle Frauen ihrer Zeit, um nicht zu sagen, die in dieser Beziehung viel gerühmten Frauen des Altertums so sehr, daß sie von den beiden in der Regel unterschiedenen Ständen, dem ehelichen und unehelichen Stande, wovon der eine erhabener und göttlicher, aber auch opferreicher und gefährlicher, der andere erniedrigender und ungefährlicher ist, die Schattenseiten mied und das Schönste erkor, die Erhabenheit des ehelosen Lebens mit der Ungefährlichkeit des ehelichen Lebens verbindend. Sie pflegte die Enthaltsamkeit, ohne sich zu brüsten. Als Ehefrau eignete sie sich die Vorzüge einer Unverheirateten an und zeigte, daß weder der eine noch der andere Stand ohne weiteres mit Gott und der Welt verbindet oder davon trennt, daß man also weder den einen als solchen allgemein fliehen, noch den anderen in jeder Beziehung empfehlen darf. Der Geist ist es, der sowohl die Ehe, wie die Jungfräulichkeit zum Guten lenkt. Durch sein schaffendes Wort werden beide wie eine Masse geformt und gebildet, um zur Tugend zu werden. Nicht war Gorgonia, da sie sich fleischlich verbunden hatte, deshalb vom Geiste getrennt, und obwohl sie in ihrem Manne ihr Haupt sah, anerkannte sie gleichwohl ihr oberstes Haupt. Nachdem sie nur kurze Zeit der Welt und dem Fleische gedient hatte, soweit es nämlich das Gesetz des Fleisches oder vielmehr der Geber dieses Gesetzes verlangt hatte, weihte sie sich vollständig Gott. Das Schönste und Erhabenste ist, daß sie ihren Mann für sich gewann und in ihm nicht einen mürrischen Herrn, sondern einen gütigen Mitarbeiter erhielt. Doch sie machte auch noch die Frucht des Leibes, ihre Kinder und die Kinder der Kinder, zu einer Frucht des Geistes. Ihre ganze Familie und ihr ganzes Haus schuf sie zu einer einzigen Seele, um sie Gott zu weihen. Sie ehrte ihre Ehe durch ihr würdiges Eheleben und die schönen ehelichen Früchte. Solange sie lebte, war sie ihren Kindern ein Vorbild für alles Gute, und nachdem sie abberufen war, hinterließ sie ihrem Hause ihren Willen als stumme Predigt.</p><p>Der treffliche Salomon lobt in seiner Pädagogik, d. i. in den Sprüchen, das Weib, das zu Hause bleibt und seinen Mann liebt. Im Gegensatz zu dem Weibe, das außer dem Hause herumstreift, das lüstern, unschamhaft, durch schlechte Gebärden und Worte ehrbare Menschen in seine Netze lockt, stellt er das Weib, welches sittsam zu Hause bleibt, seine weiblichen Pflichten männlich erfüllt, seine Hände stets an den Spinnrocken legt, seinem Manne doppelte Kleidung fertigt, zur rechten Zeit den Acker kauft, seinen Knechten gute Nahrung reicht, die Freunde an reichlicher Tafel bewirtet und alles tut, was Salomon sonst noch an einer verständigen, fleißigen Frau gepriesen hat. Wollte ich aber meine Schwester nur wegen solcher Vorzüge loben, dann wäre es so viel, als wenn ich eine Bildsäule wegen ihres Schattens oder einen Löwen wegen seiner Krallen loben würde, dann würde ich das Wichtigere und Vollkommenere beiseite lassen. Wer verdiente es mehr, gesehen zu werden? Wer aber ließ sich seltener sehen als sie, die sich vor den Augen der Männer zurückhielt? Wer verstand in Leid und Freud besser Maß zu halten als sie, die bekanntlich in ihrer Trauer nicht die Menschenwürde und in ihrer Lieblichkeit nicht den Anstand vergaß, dort Klugheit, hier Zartheit offenbarte und durch Vereinigung von Freundlichkeit und Würde die Schicklichkeit zu wahren wußte? Vernehmet es, ihr Frauen, die ihr gar so gerne euch sehen lasset und dem Leichtsinne huldiget und euch lustig macht über die, welche sich schüchtern verhüllen! Wer hat seine Augen so gehütet? Wer hat das Lachen so sehr verabscheut, daß sogar schon ein beginnendes Lächeln zuviel war? Wer hat seine Ohren mehr verschlossen? Wer hat sie anderseits den Worten Gottes mehr geöffnet? Wer hat mehr den Geist zum Führer der Zunge gemacht, daß sie die Lehren Gottes verkünde? Wer hat in solcher Weise den Lippen Ordnung vorgeschrieben?</p><p>Da ihr es wollt, spreche ich auch noch von folgendem Vorzug. Ihr selbst schien er allerdings nicht der Beachtung wert, so wenig als allen denen, die wahrhaft keusch und ehrbar in ihrem Betragen sind; nur die, welche allzusehr an der Welt und der Schönheit hängen und sich durch kein aufklärendes Wort belehren lassen wollen, sind schuld, daß man etwas dahinter findet. Nicht Gold, das man künstlich bearbeitet, um die Schönheit zu erhöhen, hat sie geschmückt, nicht hell- und dunkelblond gefärbtes und gelocktes Haar, nicht die schmählichsten Künste derer, welche ein ehrwürdiges Haupt zu einem Schauplatz machen wollen, nicht kostbare, wallende, durchsichtige Kleider, nicht glänzende, funkelnde Edelsteine, die den Körper umstrahlen, nicht die täuschende Kunst der Maler, nicht käufliche Schönheit, nicht ein irdischer, gegen den Schöpfer arbeitender Bildner, der das Gebilde Gottes mit trügerischen Farben bedeckt, durch seine Auszeichnungen nur entehrt und die von Gott geschaffene Gestalt frechen Augen als Götzenbild der Lüsternheit hinstellt, damit das für Gott und die Zukunft bestimmte Geschöpf ein Raub falscher Schönheit werde. Obwohl sie allen weiblichen Schmuck jeder Art kannte, hielt sie doch ihren Charakter und den Glanz ihrer Seele für den wertvollsten. Nur* ein* Rot liebte sie, das Erröten der Schamhaftigkeit, und nur* ein* Weiß liebte sie, das Weiß der Unschuld. Das Schminken und das Untermalen, die lebenden Zeichnungen, die wandelnden Kunstwerke ließ sie den Schauspielerinnen und öffentlichen Dirnen und allen denen, die es für Schmach und Schande halten, sich zu schämen.</p><p>So verhielt sie sich gegenüber äußerem Schmuck. Ihre Verständigkeit und Frömmigkeit könnte niemand genügend schildern. Es gibt wenige solche Vorbilder; zu ihnen gehören ihre leiblichen und geistigen Eltern. Auf diese allein achtete sie, und obwohl sie ihnen an Tugend keineswegs nachstand, gab sie ihnen doch in dem einen Punkte bereitwilligst nach, als sie es mit Überlegung zugab, daß sie das Gute von ihnen empfangen hätte und daß sie die Wurzel ihres eigenen Glanzes wären. Welcher Verstand war schärfer als der ihrige? Denn nicht nur ihre Verwandten und Landsleute und Nachbarn, sondern auch die ganze Umgebung fragten sie um Rat. Ihre Vorschriften und Mahnungen wurden als unverletzliches Gesetz betrachtet. Welche Reden waren treffender als die ihrigen? Wo war ein Schweigen so verständig wie das ihrige? Doch da ich gerade vom Schweigen spreche, will ich noch etwas besonders Charakteristisches von ihr erzählen; es geziemt den Frauen sehr und ist für die Gegenwart besonders zu empfehlen. Wer schöpfte sowohl aus der Offenbarung wie aus dem eigenen Wissen reichlichere Gotteserkenntnis? Wer sprach so wenig wie sie und blieb so sehr innerhalb der dem Weibe von der Religion gesteckten Grenzen? Und ― was zu einer wahrhaft gottesfürchtigen Frau gehört und worin sich eine gesunde Verschwendung offenbarte ― wer hat so sehr wie sie die Kirchen beschenkt, sowohl die fremden, wie die hiesige, die vielleicht nach ihrem Tode nicht mehr geschmückt werden wird? Noch mehr, wer hat sich so wie sie zum lebendigen Tempel Gottes gemacht? Wer hat so wie sie die Priester geehrt, u. a. den, der ihr religiöser Kampfgenosse und Lehrer war und dem es zu verdanken ist, daß ihre Kinder fromm sind und zwei derselben sich Gott geweiht haben.</p><p>[Forts. v. ] Welche Frau hat den Gottesfürchtigen mehr ihr Haus als nettes, gastfreundliches Heim zur Verfügung gestellt? Und was noch mehr ist, wer nahm sie mit solcher Ehrfurcht und so gottgefälligem Entgegenkommen auf? Wer hat ferner in Leiden größere Ruhe bewahrt und den Leidenden größeres Mitleid gezeigt? Wer hat den Dürftigen freigebiger seine Hand geöffnet? Ich stehe nicht an, ihr Lob mit den Worten Jobs zu verkünden: „Ihre Türe stand jedem Wanderer offen; kein Fremder mußte draußen warten. Auge war sie den Blinden, Fuß den Lahmen und Mutter den Waisen.“ Um ihr Erbarmen mit den Witwen zu würdigen, genügt der Hinweis darauf, daß sie zum Lohne dafür vom Los einer Witwe bewahrt blieb. Ihr Haus war die gemeinsame Herberge für alle notleidenden Verwandten. Was sie besaß, gehörte allen Dürftigen, als wäre es deren Eigentum gewesen. „Sie teilte aus und gab den Armen.“ Da die Verheißung (des Herrn) bestimmt ist und nicht trügt, hat sie sich in den himmlischen Scheunen viele Güter aufgespeichert. Oftmals hat sie in denen, die von ihr Gutes empfangen hatten, Christum aufgenommen. Das Wichtigste ist, daß es ihr nicht um den Schein, sondern um die Ehrlichkeit zu tun war. Im Geheimen übte sie, wie es sich gehört, im Gedanken an den, der das Verborgene sieht, ihre Frömmigkeit. Dem Fürsten dieser Welt nahm sie alles weg, um es in die sicheren Scheunen zu legen. Außer ihrem Leichnam hinterließ sie der Welt nichts. Gegen alles, was sie besaß, hatte sie das erhoffte Jenseits eingetauscht. Der einzige Reichtum, den sie ihren Kindern vermachte, war, daß sie ihre Mutter nachahmen und ihren Stolz in die gleichen Tugenden setzen.</p><p>Während Gorgonia in dieser unglaublichen Weise für ihre große Seele wirkte, hat sie aber anderseits nicht gleich der Menge, welche sich für ihre karitativen Bestrebungen gegenüber den Armen sinnliche Freuden erlaubt und, statt durch das Gute das Böse zu heilen, die Tugend mit der Sünde vertauscht, im Vertrauen auf ihre guten Werke ihr Fleisch der Weichlichkeit und den ungezügelten Freuden des Bauches, dem wütenden und bissigen Hunde, überlassen. Sie hat aber auch nicht, wenn sie ihr eigenes Fleisch durch Fasten bändigte, anderen das gesunde Schlafen auf bloßem Boden empfohlen. Und wenn sie ihrer Seele durch das Schlafen auf dem Boden half, dann gönnte sie sich selbst nicht längeren Schlaf als andere. Und wenn sie sich, als hätte sie keinen Körper gehabt, des Schlafes beraubte, legte sie sich nicht auf die Erde, um andere in aufrechter Stellung, wie es unternehmungslustige Mönche lieben, die ganze Nacht verbringen zu lassen. Und wenn sie sich in dieser Abtötung stärker als die mutigsten Frauen und Männer erwies, hat sie etwa irgendeinem Manne oder Weibe den Ruhm gelassen, sie zu übertreffen im verständnisvollen Singen der Psalmen, im Lesen und Offenbaren göttlicher Worte, in der rechtzeitigen Betrachtung, im Verbeugen der abgehärteten und fast mit dem Boden verwachsenen Knie, im Vergießen von Tränen, welche den Sündenschmutz eines zerknirschten Herzens und eines gedemütigten Geistes reinigen, in erhebenden Gebeten, durch einen festen, dem Himmel zugewandten Sinn u. dgl.? Es ist zwar viel gesagt, aber es ist wahr: nach den einen Tugenden strebte sie, in den anderen war sie ein glänzendes Vorbild; die einen eignete sie sich an, die anderen übertraf sie. Wenn sie auch in einzelnen Tugenden Mitbewerber fand, so war sie doch darin allen überlegen, daß sie allein alle Tugenden in sich vereinte. Die Gesamtheit der Tugenden pflegte sie in einer Weise, wie ein anderer nicht einmal eine einzige mäßige Tugendübung gepflegt hatte. In jeder einzelnen Tugend brachte sie es zu einer Vollkommenheit, daß schon eine Tugend allein statt aller genügt hätte.</p><p>Wie wenig gepflegt war ihr Körper! Ihre Kleider ließen außer der Tugend nichts Schönes erkennen. Wie herrschte ihre Seele über ihren Leib! Sie ließ ihn fast ohne Nahrung, als hätte er nicht aus irdischen Stoffen bestanden. Eigentlich zwang sie den Körper, schon vor dem Hinscheiden zu sterben, damit ihre Seele frei wäre und nicht von sinnlichen Empfindungen gestört würde. Ganze Nächte durchwachte sie, und ihr Psalmengesang und ihr Stehen erstreckte sich von einem Tag auf den anderen. O David, aufrichtig frommen Seelen sind deine Lieder nicht zu lang! Die zarten Glieder, mit denen Gorgonia sich zur Erde beugte, verloren ihre Natur und wurden hart. Sie vergoß Tränen, welche in Trübsal gesät wurden, um in Freuden ernten zu können. Ihr Rufen bei Nacht durchdrang die Wolken und kam vor Gott. Ihr feuriger Geist fürchtete in seinem Gebetseifer nicht die in der Nacht umherschweifenden Hunde, nicht Kälte, nicht Regen, nicht Gewitter, nicht Hagel, nicht Finsternis. Ihre weibliche Natur erwies sich im gemeinsamen Kampfe für die Erlösung der männlichen überlegen und zeigte, daß die Geschlechter sich nur dem Leibe, nicht der Seele nach unterscheiden. Rein lebte sie nach der Taufe; ihre Seele wohnte als Braut Christi im Leibe wie in reinem Brautgemache. Durch ihr Entsagen hat sie das bittere Verlangen (der Stammeltern), Eva, die Mutter des Menschengeschlechtes und der Sünde, die trügerische Schlange und den Tod überwunden. Durch ihre Abtötung hat sie die Selbstentäußerung Christi, seine Knechtsgestalt, seine Leiden geehrt.</p><p>Soll ich alle ihre Tugenden aufzählen oder soll ich, indem ich einen Teil übergehe, es wagen, diejenigen zu kränken, welche sie nicht gekannt haben? Doch es wird gut sein, nunmehr auch noch vom Lohne ihrer Frömmigkeit zu sprechen. Diejenigen, welche ihr Leben gut gekannt haben, scheinen mir schon längst zu wünschen und zu verlangen, daß ich nicht nur von ihrem gegenwärtigen Schicksal und den Freuden, die sie jetzt im Himmel genießt, und die das menschliche Denken, Hören und Sehen übersteigen, spreche, sondern auch von dem Lohne, den ihr der gerechte Vergelter schon hienieden zuteil werden ließ. Denn gerne belohnt er schon hienieden, um durch das Kleine das Große, durch das Sichtbare das Unsichtbare glaubwürdig zu machen und so die Ungläubigen aufzurichten. Von dem, was ich nun berichte, ist ein Teil allgemein bekannt, während ein anderer Teil nicht erzählt wird, da Gorgonia selbst sich in ihrer Demut nicht ihrer Gnadengaben gerühmt hatte. Als die Maultiere scheuten, der Wagen mit ihnen dahinraste, unglücklicherweise umstürzte, schrecklich fortgeschleppt wurde und furchtbar zerschellte, da nahmen, wie ihr wißt, die Ungläubigen daran Anstoß, daß die Gerechten so heimgesucht würden, wurden aber bald eines Besseren belehrt. Obwohl alle ihre Knochen und Glieder, die verhüllten wie die unverhüllten, erschüttert und zerschlagen waren, ließ sie keinen Arzt zu, außer den, der sie heimgesucht hatte; denn einerseits wollte sie auch in ihrer Krankheit die Sittsamkeit bewahren und sich darum nicht den Blicken und Berührungen von Männern aussetzen, anderseits wollte sie nur bei dem Schutz suchen, der das Unglück zugelassen hatte. Von diesem allein, sonst von niemandem, erhielt sie Genesung. Die Folge davon war, daß manche mehr, als sie über das Unglück erschraken, noch über das Genesungswunder erstaunt waren. Der traurige Vorfall schien eben den Zweck zu haben, durch das Unglück Gott zu verherrlichen. Die Tatsache, daß sie als Mensch gelitten hatte, aber über menschliches Können hinaus geheilt worden war, berichtet und beweist einerseits deutlich Gorgonias Vertrauen im Leiden und ihre Ausdauer im Unglück, mehr aber noch anderseits Gottes Güte gegen solche Seelen. Zu der schönen Stelle, in der es vom Gerechten heißt: „Wenn er fällt, bricht er nicht zusammen“, wird später noch das Wort beigefügt: „Und wenn er zusammengebrochen ist, wird er doch gar bald aufgerichtet und verherrlicht.“ Gorgonia hatte wider Erwarten zu leiden, aber wider Erwarten konnte sie auch wieder nach Hause zurückkehren. Fast wurde ihr Leiden von der Genesung überrascht; noch auffallender als ihre Verwundung war ihre Heilung.</p><p>Das Unglück müssen wir preisen und bewundern. Es war besser zu leiden, als von Leiden frei zu bleiben. Mögen auch die Worte „Er wird schlagen und verbinden und heilen und nach drei Tagen wieder auferstehen lassen“, sich auf ein größeres, geheimnisvolleres Ereignis bezogen haben, wie die Geschichte gezeigt hat, so können sie doch ebensosehr auch auf das Unglück der Gorgonia angewandt werden. Der erzählte Vorgang ist allgemein, auch Fernstehenden bekannt; denn überallhin ist die Kunde von dem Wunder gedrungen und überall erzählt und hört man von diesem Ereignis im Zusammenhang mit den sonstigen Wundertaten Gottes. Ein anderer Vorgang jedoch ist bis jetzt den meisten unbekannt und verborgen geblieben infolge der erwähnten Demut und der bescheidenen und zurückhaltenden Frömmigkeit Gorgonias. Soll ich nun, o bester und vollkommenster Hirte, der du auch dieses heilige Schäflein geführt hast, davon sprechen? Gibst du deine Einwilligung? Sind wir, denen allein das Geheimnis anvertraut worden war und die wir beide Zeugen des Wunders waren, etwa noch weiterhin um der Verstorbenen willen (zum Schweigen) verpflichtet? Wie es früher Zeit war zu schweigen, so ist es nach meinem Dafürhalten jetzt Zeit zu reden und zwar nicht nur, um damit Gott zu verherrlichen, sondern auch, um die zu trösten, die in Bedrängnissen leben.</p><p>Sie war schwach geworden und lag schwerkrank darnieder. Es war eine außergewöhnliche, seltsame Krankheit. Der ganze Körper wurde plötzlich von Fieber ergriffen. Das Blut kochte und siedete, um dann wieder zu stocken und zu gerinnen. Unglaubliche Blässe bedeckte sie, und Geist und Glieder waren wie gelähmt. Diese Erscheinungen traten nicht in langen Zwischenräumen auf, sondern bisweilen ohne Unterbrechung. Man hielt die Krankheit nicht für etwas Natürliches. Weder die Kunst der Ärzte, welche sich sowohl einzeln, wie gemeinsam aufs angelegentlichste der Krankheit annahmen, noch die oft vielvermögenden Tränen der Eltern, noch die öffentlichen Gebete und Bitten, welche das ganze Volk mit einem Eifer verrichtete, als wenn es sich um das eigene Wohl eines einzelnen gehandelt hätte, konnten etwas ausrichten. Gorgonias Wiedergenesung war eben die Rettung aller, gleichwie umgekehrt ihre Krankheit das Leiden aller war.</p><p>Was tat nun die große, der höchsten Auszeichnungen würdige Seele? Wie erfolgte ihre Genesung? Die Antwort ist noch unbekannt. Nachdem sie die Hoffnung auf jede menschliche Hilfe aufgegeben hatte, nahm sie ihre Zuflucht zum höchsten Arzte. Die ungünstige Nachtzeit abwartend, warf sie sich, als gerade die Krankheit etwas nachließ, vertrauensvoll vor dem Altare nieder, indem sie den, der auf dem Altare verehrt wird, mit lauter Stimme und mit allen seinen Namen anrief und ihn an alle seine früheren Wundertaten erinnerte; sie war ja in der alten und neuen Geschichte wohl bewandert. Ein letztes, heiliges, schönes Wagnis wagte sie. Sie ahmte jenes Weib nach, das durch den Saum des Gewandes Christi ihren Blutfluß heilte. Was tat Gorgonia? Sie berührte mit ihrem Haupte den Altar unter den gleichen Rufen und mit jenem Strom von Tränen, den einst ein Weib auf die Füße Christi fließen ließ, und versicherte, sie würde nicht nachlassen, bis sie ihre Gesundheit gefunden hätte. Mit diesem Mittel (der Tränen) salbte sie ihren ganzen Körper und, wenn irgendwo die Hand etwas von dem verheißenen Geheimnis* (ἀντίτυπον)* [antitypon] des kostbaren Leibes oder des Blutes verwahrt hatte, vermischte sie es mit ihren Tränen. Da geschah das Wunder! Sofort, als sie wegging, fühlte sie sich wohl und körperlich, seelisch und geistig erleichtert. Was sie gehofft hatte, erhielt sie zum Lohne für ihre Hoffnung. Durch ihre seelische Kraft erwarb sie sich körperliche Kraft. Dies war ein großes Ereignis, und es ist nicht erfunden. Ihr alle, Gesunde wie Kranke, sollt es glauben, damit die einen die Gesundheit bewahren, die anderen die Gesundheit erlangen. Ich erzähle dies aber nicht, um Gorgonia zu rühmen. Denn solange sie lebte, schwieg ich darüber; erst jetzt spreche ich davon. Und jetzt ― wohl verstanden! ― gebe ich dies nur deshalb öffentlich bekannt, weil ich mir eine Schuld aufladen würde, wenn ich ein solches Wunder vor Gläubigen und Ungläubigen, vor der Gegenwart und Zukunft verheimlichen würde.</p><p>[Forts. v. ] So verlief das Leben Gorgonias. Ziemlich viel mußten wir übergehen, da unserer Rede Grenzen gesetzt sind und da wir nicht unmäßig im Loben erscheinen möchten. Wir würden uns aber wohl an ihrem heiligen, herrlichen Tode versündigen, wenn wir nicht noch der Schönheiten ihrer Sterbestunde gedenken würden, zumal sie so sehnsüchtig nach dem Tode verlangt hatte. Ich werde mich in meinem Berichte so kurz wie möglich fassen. Gorgonia verlangte aufgelöst zu werden, da sie großes Vertrauen auf den setzte, der sie rief; bei Christus zu sein, war ihr mehr als alles auf der Welt. Mag einer noch so verliebt und zügellos sein, er kann den Körper nicht so lieben, wie Gorgonia, nachdem sie die irdischen Ketten abgeworfen und den Schmutz, in dem wir leben, überschritten hatte, den Guten liebte, dem sie in reiner Liebe ergeben war und den sie als Geliebten, bzw. sie als seine Geliebte völlig aufgenommen hatte, der uns jetzt aber nur mit wenigen Strahlen erleuchtet und von dessen Erkenntnis wir noch ausgeschlossen sind. In diesem ihrem edlen, erhabenen Verlangen wurde sie auch nicht getäuscht. Und was noch mehr ist, sie erkannte und genoß den Guten in den vielen schlaflosen Nächten schon im voraus. Auf diese Nächte folgte ein überaus süßer Schlaf und ein einziger Traum, in dem ihr der Tod bestimmt mitgeteilt und selbst der Tag kundgegeben wurde; Gott hatte also dafür gesorgt, daß sie vorbereitet war und nicht zu erschrecken brauchte.</p><p>Vor kurzem erst war ihr zuteil geworden die Gnade der Reinigung und Vollendung ― die Gabe, welche wir alle gemeinsam als Grundlage des zweiten Lebens von Gott empfangen haben. Eigentlich war ihr ganzes Leben eine Reinigung und Vollendung. Der Geist gab ihr die Gabe der Wiedergeburt, ihr eigenes Leben hatte ihr diese Gnade gesichert. Sie war es ― um mich kühn auszudrücken ― fast allein, welcher das Geheimnis nicht als Gnade, sondern (bereits) als Siegel verliehen worden war. Außer all dem, was sie empfangen hatte, wünschte sie nur noch eines: die Bekehrung* (τελείωσις)* [teleiōsis] ihres Mannes. Soll ich euch denselben kurz beschreiben? Er war ihr Mann! Besseres wüßte ich nicht zu sagen. Gorgonia wollte sich mit dem ganzen Leibe Gott weihen und wollte bei ihrem Hinscheiden nicht nur zur einen Hälfte vollendet sein und also einen Teil ihres Ich unvollendet zurücklassen. Ihre Bitte blieb nicht unerhört von seiten dessen, welcher den Wunsch derer, die ihn fürchten, erhört und ihr Verlangen erfüllt.</p><p>[Forts. v. ] Als sie alles hatte, was sie wollte, ihr nichts von dem abging, was sie wünschte, und ihre Stunde gekommen war, bereitete sie sich nun auf den Tod und die (ewige) Heimat vor und legte sich nieder, um dem Gebote der Stunde zu gehorchen. Nachdem sie ihrem Manne, ihren Kindern und ihren Freunden zugesprochen hatte, wie es einer liebenden Frau, Mutter und Schwester geziemt; nachdem sie herrliche Worte über das Jenseits vorgetragen hatte, um ihren Sterbetag zu einem Festtag zu machen, entschlief sie. Nicht zwar war sie reich an irdischen Tagen, nach denen sie sich auch gar nicht gesehnt hatte, da sie in denselben für sich nichts Gutes, sondern meist Staub und Irrtum vermutete; dagegen war sie reich an Tagen, die vor Gott großen Wert haben, reicher wohl als die, welche in hohem Alter gestorben sind und viele Lebensjahre gezählt haben. So war ihre Auflösung oder ― besser gesagt ― ihre Aufnahme; so flog sie dahin, so wanderte sie hinüber, so eilte sie dem Leibe etwas voraus.</p><p>Doch fast hätte ich noch etwas vergessen. Wohl aber hättest du, ihr geistlicher Vater, es nicht zugelassen; denn du hast das wunderbare Wort sorgfältig bewahrt und uns mitgeteilt. Es war ein großes Wort, das ihr selbst zur Ehre gereicht, uns aber eine Aufforderung zur Tugend und zur Sehnsucht nach einem gleichen Tode ist. Wenn ich des Wortes gedenke, überkommen mich Schauder und Tränen. Sie lag am Sterben und in den letzten Zügen. Es umstanden sie rings Angehörige und Fremde, um ihr noch die letzten Ehren zu erweisen. Die alte Mutter beugte sich über sie. Die krampfhaft zuckende Seele verlangte fort. In die Liebe aller mischte sich der Todesschrecken; die einen wünschten von ihr noch ein Wort als Andenken zu hören, andere wollten sie noch sprechen, ohne es aber zu wagen. Still flossen in unheilbarem Schmerz die Tränen; denn man hätte es nicht für recht gehalten, diese Sterbende mit Klagen zu ehren. Es herrschte tiefes Schweigen; ihr Sterben war Gottesdienst. Sie atmete nicht, war bewegungslos und, wie es schien, unfähig zu sprechen. Da ihr Körper kein Zeichen mehr gab, glaubte man, der Tod sei eingetreten; denn man meinte, daß, weil das Lebensprinzip bereits gewichen sei, die Stimmorgane tot seien. Doch als ihr Seelenhirte, der sie wegen all der wunderbaren Vorgänge in allem genau beobachtet hatte, merkte, daß sich ihre Lippen etwas bewegten, und in einer Kühnheit, die sein Charakter und sein Mitleid gestatteten, seine Ohren ihren Lippen näherte, da spielte sich in der Stille etwas Wunderbares ab, worüber du selbst erzählen mögest! Denn deinen Worten wird jeder Glauben schenken. Sie flüsterte Psalmenworte, die sich aufs Sterben bezogen ― tatsächlich ein Beweis, mit welchem Vertrauen sie gestorben ist! Selig, wer das Leben verläßt mit den Worten: „Im Frieden werde ich ruhen und schlafen“. Diese Worte hast du, beste der Frauen, gebetet, und sie sind dir in Erfüllung gegangen. Das Wunderbare war das Psalmenwort, es ist zugleich der Nachruf für die Hingeschiedene geworden. Herrlichen Frieden hast du erlangt, frei von Leiden; du hast außer dem gewöhnlichen Schlummer die Ruhe gefunden, welche die (von Gott) Geliebten verdienen, wie es sich für die geziemt, welche von Worten der Frömmigkeit gelebt hat und mit diesen Worten verschieden ist.</p><p>Besser und wertvoller als das, was unsere Augen sehen, ist, wie ich wohl weiß, das, was dir jetzt beschieden ist: der Jubel der Festteilnehmer, der Chorgesang der Engel, die Einordnung in das himmlische Reich, der Anblick der Herrlichkeit, die Erleuchtung, welche nebst anderem so rein und vollkommen von der höchsten Dreifaltigkeit bewirkt wird, die nicht mehr einem gefesselten und durch Sinne zerstreuten Geiste entflieht, sondern vollständig vom ganzen Geiste geschaut und erfaßt wird und die mit dem vollen Lichte der Gottheit unsere Seelen erhellt. Mögest du all das genießen, wovon dir schon auf Erden wegen deines aufrichtigen Verlangens darnach ein Teil zugeflossen ist! Solltest du noch an uns denken und sollten die heiligen Seelen von Gott die Gnade erhalten, Kenntnis von unserem Tun zu haben, dann nimm unsere Rede hin statt vieler und vor vielen Totenehrungen! Vor dir habe ich Cäsarius die Leichenrede gehalten, dir halte ich sie nach ihm; uns fällt die Aufgabe zu, den Geschwistern diese Ehre am Grabe zu erweisen. Nicht kann ich sagen, ob nach euerem Hingange auch uns solche Ehre erwiesen werden wird. Doch wollen wir ― sei es dort, sei es hier ― nur von Gott geehrt werden in Christus Jesus, unserem Herrn, dem mit dem Vater und dem Heiligen Geiste die Ehre sei in alle Ewigkeit! Amen!IX. Rede</p><h2>IX. Rede</h2><p><em>IX. Rede.</em></p><p><em>Verteidigungsrede, gehalten vor seinem Vater in Gegenwart des Basilius nach der Wahl zum Bischof von Sasima</em>.</p><p>Wiederum werden Chrisam und Geist über mich ausgegossen, wiederum gehe ich traurig und niedergeschlagen einher. Es wird euch wohl auffallen. Auch Isaias hatte, ehe er die Herrlichkeit des Herrn und den hohen und erhabenen Thron und um ihn herum die Seraphim schaute, nicht so gesprochen, er war nicht verdrossen und nicht furchtsam; vielmehr hatte er seine Stimme gegen Israel erhoben, während er auf sich selbst geachtet hatte, als wäre er ein Schuldloser gewesen. Nachdem er jedoch jenes Gesicht geschaut und die heilige und geheimnisvolle Stimme gehört hatte, da ging er mehr in sich und rief: „O ich Armseliger, ich werde niedergeschlagen!“ Die weiteren Worte übergehe ich, um nicht der Lästerung zu verfallen. Ferner erinnere ich mich an den alten Richter Manue und in neuerer Zeit an Petrus, die Säule der Kirche. Als Manue Überirdisches und Wunderbares geschaut hatte, rief er: „Weib, wir gehen zugrunde, wir haben Gott geschaut!“ Petrus, der die beim Fischfang sich allen offenbarende Allwissenheit und wunderbare Macht des Erlösers nicht ertragen konnte, wies ihn trotz seiner Bewunderung aus dem Schiffe mit der Begründung, er sei nicht würdig, Gott zu schauen und mit ihm zu verkehren.</p><p>Da ich höre, daß nach dem Berichte der Evangelien der Hauptmann zwar um ein Wunder bat, aber, weil sein Haus nicht die göttliche Würde und Größe fassen könnte, (den Herrn) ersuchte, nicht persönlich zu erscheinen, brauche ich mir wegen meiner Schüchternheit und Niedergeschlagenheit keinen Vorwurf zu machen. Wie die Sonne das Auge blendet, so erinnert Gott den, dem er erscheint, an seine Schwachheit. Den einen ist Gott Licht, den anderen Feuer, je nach der Natur und Verfassung des einzelnen. Was wissen wir von Saul? Er wurde gesalbt, erhielt Anteil am Geiste und war seinerzeit ein Mann des Geistes. Auch ich kann nichts anderes lehren. Wurde er doch auch Prophet und zwar wider Erwarten und in außergewöhnlicher Weise, so daß aus dieser wunderbaren Tatsache das noch jetzt übliche Sprichwort entstand: „War auch Saul unter den Propheten?“ Da er sich jedoch nicht ganz dem Geiste hingab und sich nicht aufrichtig der Verheißung gemäß zu einem neuen Menschen umwandelte, vielmehr noch ein alter Funke von Sündhaftigkeit und etwas vom bösen Keime in ihm verblieb und Geist und Fleisch sich in ihm bekämpften: ― wozu soll ich all das Schlimme aufzählen? Ihr kennt den bösen Geist und wißt von dem Psalmensänger, der ihn besänftigte. Wenn es auch nicht unwürdige Menschen sind, an welche sich die Gnade heftet, und wenn auch die Werkzeuge, deren sie sich bedient, nicht schlimm und widersetzlich sind, da nach einem schönen Worte, von dem ich überzeugt bin, die Weisheit nicht in eine böswillige Seele einzieht, so ist doch, wie ich glaube, wegen der Wandelbarkeit und Veränderlichkeit der menschlichen Beschaffenheit und Natur die Bewahrung der Würde und Gefügigkeit gewiß keine kleinere Aufgabe als deren erstmalige Erwerbung. Sooft die Gnade ― um das schlimmste und auffallendste Übel zu erwähnen ― Aufgeblasenheit wirkte, entfernte sie die von Gott, welche sich ihm nicht ehrlich genähert hatten, und wir wurden im Augenblick unserer Erhebung gestürzt, damit „die Sünde, welche durch das Gute mir den Tod wirkte, über die Maßen sündhaft würde.“</p><p>Solche Erwägungen erfüllten mich mit Angst, Bitterkeit und Niedergeschlagenheit, und ich empfand das gleiche wie Knaben, welche beim Beobachten des Blitzens sich freuen und zugleich fürchten. Ich liebte den Geist und fürchtete mich zugleich vor ihm. Einige Zeit brauchte ich, um mich zu sammeln, wieder ruhiger zu werden, einen sichereren, besseren Weg einzuschlagen, die Angst auszumerzen, wie das Unkraut aus der Saat ausgemerzt wird, und die schlimmen Gedanken den besseren Platz einräumen zu lassen, auf daß der Geist völlig die Herrschaft erlange und mich in seinen Dienst und in sein Amt nehme zur Aufrichtung dieses Volkes, zur Seelenleitung, zur Belehrung in Wort, wie durch Taten und Beispiel „mit den Waffen der Gerechtigkeit in der Rechten und in der Linken“, zu jener gesunden Hirtentätigkeit, welche von der Welt ablenkt und zu Gott führt, den Körper überwindet und dem Geiste dient, die Finsternis verscheucht und sich am Lichte freut, die wilden Tiere verjagt und die Herde zusammenhält, Schluchten und Wüsten meidet und auf Bergen und Höhen geleitet. Darüber scheint mir der bewundernswerte Michäas zu sprechen, wenn er uns von der Erde zu unseren Höhen emporzieht mit den Worten: „Tretet zu den ewigen Höhen! Stehe auf und wandle, denn nicht hier ist deine Ruhe,“ nicht, wie manche meinen, in dem, was auf dem Boden liegt und niederzieht!</p><p>[Forts. v. ] Lehret mich solche Hirtentätigkeit, meine Freunde, meine Hirten, meine Kollegen im Hirtenamte! Zeige dich hierin als Freund, sowohl du, unser gemeinsamer Vater, der du in langer Zeit viele Hirten nacheinander aufgestellt hast, als auch du, der du mich in meiner Lebensführung prüfest und beurteilest! Achte klug auf meine Frage: Ist es denn möglich, daß wir, solange wir inmitten der tosenden Wogen des Meeres hin und her getrieben werden, das Hirtenamt mit Weisheit verwalten und die Herde erziehen? Als du (o Basilius) noch zu den Schäflein zähltest und mit mir ― du wirst es mir nicht übel nehmen ― zur törichten Herde gehörtest, kamst du mir mehr entgegen als jetzt, da du zu den Hirten zählst und wir des geistlichen Amtes gewürdigt worden sind. Du hast uns nun so, wie du uns gewünscht hast; du hast den Unüberwindbaren überwunden. Und hiemit hast du u. a. auch die gewünschte, dir wohl bekannte Antwort, welche du lobend mit deinen Worten zudecktest, wie die Schneemassen ein Brachfeld zudecken.</p><p>Der Freundschaft habe ich einen Vorwurf zu machen. Wer von den gemeinsamen Freunden wird mir recht geben? Oder wo wird der unbestechliche Richter sein, der ein gerechtes Urteil fällt und nicht mit der Masse auf das Ansehen der Person Rücksicht nimmt? Soll ich den Vorwurf nennen? Wirst du nicht von neuem eine Rede gegen mich loslassen? Bewundernswürdiger, zwischen dir und uns spielte sich etwas ab, was nicht bekannt ist, was tatsächlich nicht besprochen und nicht geglaubt wird, etwas bisher Unerhörtes. Nicht freiwillig, sondern gezwungen haben wir gehandelt. Wie sonderbar! Alles hat sich geändert. Wie viel hat uns getrennt! Willst du, daß ich von dem Throne oder von der Größe der Gnade spreche? Doch „gehe voraus, schreite mutig voran und herrsche“ und weide uns, die Hirten! Wir sind bereit, dir zu folgen und uns von deinem erhabenen, gottbegnadigten Hirtengeiste führen zu lassen. Es ist uns ernst damit, wenn wir auch wider die Gewohnheit im Geiste der Liebe etwas gewagt haben. Lehre uns deine Hirtenliebe, deine Sorgfalt und Klugheit, deinen Führergeist, dein nächtliches Wachen, deine geistige Herrschaft über das Fleisch, deinen Opfersinn, der Kraft und Jugend für die Herde hingibt, deine Kunst, Strenge und Milde zu vereinen und ― was selten zu finden ist und worin es an Vorbildern fehlt ― im Handeln Ruhe und Sanftmut zu bewahren! Lehre uns, um der Herde willen in den Kampf zu gehen und die Siege zu erringen, welche du in Christus gewonnen hast!</p><p>Sage: Auf welche Weiden soll ich führen, zu welchen Quellen soll ich gehen, welche Weiden und Wasser soll ich meiden? Wer muß mit dem Stocke, wer mit der Flöte auf die Weide geführt werden? Wann treibt man auf die Weide, wann ruft man zurück? Wie begegnet man den Wölfen, wie darf man den Hirten nicht begegnen? Diese Fragen sind vor allem am Platze jetzt, da „die Hirten töricht geworden sind und die Herden ihrer Weide zerstreut haben; mit den ehrwürdigen Propheten teile ich diese Klage. Wie kann ich das Schwache stärken, das Gefallene aufrichten, das Irrende zurückführen, das Verlorene finden und das Starke erhalten? Wie kann ich dies lernen? Was muß ich tun, um nach euren gesunden Pastoralgrundsätzen zu handeln? Nicht will ich gleich einem schlimmen Hirten (selbst) „die Milch verzehren und mich in Wolle kleiden“, nicht will ich die fetten Stücke schlachten oder verkaufen, um das übrige den wilden Tieren und Schluchten zu lassen. Nicht will ich mich statt der Schafe weiden, was einst den Führern Israels zum Vorwurf gemacht worden war. Belehret mich in diesem Sinne, befestiget mich durch solche Mahnungen! Mit solchen Lehren möget ihr mich weiden und mit mir weiden! Rettet mich und meine heilige Herde, sowohl durch Belehrung, wie durch Gebet, damit ich sicher bin, und ihr Ruhm habet am Tage des Erscheinens und der Offenbarung des großen Gottes und Jesu Christi, unseres Hohenpriesters, durch den und mit dem die Ehre sei dem allmächtigen Vater zugleich mit dem heiligen, lebendigmachenden Geiste jetzt und in alle Ewigkeit! Amen.X. Rede</p><h2>X. Rede</h2><p><em>X. Rede.</em></p><p><em>In eigener Sache, in Gegenwart seines Vaters und Basilius des Großen gehalten nach der Rückkehr von der Flucht.</em></p><p>Nichts ist unwiderstehlicher als das Alter, nichts ist ehrwürdiger als die Freundschaft. Alter und Freundschaft haben mich zu euch geführt als einen Gefesselten in Christus, nicht in eisernen Ketten, sondern in den unlösbaren Banden des Geistes. Bisher glaubte ich stark und unbesiegbar zu sein. Ich Tor, ich kümmerte mich nicht einmal um diese meine besten Freunde und Brüder. Ich wollte frei sein und in Ruhe leben und überließ alle Ämter denen, die darnach strebten, weil ich nur mit mir und dem Geiste verkehren wollte. Ich dachte an Elias auf dem Karmel, an Johannes in der Wüste und an die, welche gleich diesen der Betrachtung des Überirdischen lebten. Mir ist das Leben ein Sturm, vor dem ich mich auf einem Felsen, einem Abhange, hinter einem Damme zu schützen suchte. Andere mögen ― so sagte ich mir ― die Ehren und Mühen haben, andere die Kämpfe und Siege. Ich will den Kampf fliehen und auf mich achten und mich mit dem begnügen, was mir möglich ist: Auf leichtem Nachen will ich ein kleines Gewässer befahren, durch armseliges Erdenleben will ich mir eine kleine Wohnung im Jenseits erobern! Es ist wohl nicht geistreich, so zu denken; aber es ist vorteilhaft, sich in gleicher Weise vor Erhöhung und vor Erniedrigung zu hüten.</p><p>So stand es mit mir, solange ich Schatten- und und Traumbilder zeichnen und meinen Geist mit Luftschlössern befriedigen durfte. Und wie steht es jetzt? Die Freundschaft (d. i. Basilius) und das Alter des Vaters haben mich gezwungen: Das Alter durch seine Klugheit und die Zahl der Jahre und weil es im sicheren Hafen ruht, die Freundschaft aber durch ihren Reichtum in Gott und weil sie den Nächsten bereichert. Bereits legt sich mein Groll. „Die Sanftmütigen mögen es hören und sich freuen!“ Bereits erscheint mir milde die Hand, welche mir Gewalt angetan hatte. Ich juble im Inneren und mein Herz befriedigt sich und die ruhige Überlegung kehrt zurück. Wie eine Flamme, die ausgelöscht und erstickt war, erwacht die Freundschaft aus kleinem Funken wieder zu neuem Leben. „Meine Seele hatte sich nicht trösten lassen wollen und mein Geist war verzagt.“ Ich hatte gesagt: Nicht mehr will ich der Freundschaft trauen, und warum soll ich auf einen Menschen meine Hoffnung setzen? Denn „jeder Mensch schreitet listig einher, und der Bruder bringt seinen Bruder zu Fall“ und wir alle sind aus dem gleichen Staube und der gleichen Masse und haben von dem gleichen Holze der Sünde gegessen, mag auch der eine den anderen äußerlich an Schönheit übertreffen. Ich hatte mir gesagt: Welchen Nutzen habe ich von dieser beneidenswerten, rühmlichen Freundschaft, welche mit den Sinnen begann und zum Geiste fortschritt, und welchen Nutzen bringt es mir, mit dem Freunde Wohnung und Tisch, Lehrer und Unterricht geteilt zu haben und mehr als brüderlich mit ihm verkehrt zu sein und ― wie es später der Fall war ― wahrlich eines Sinnes mit ihm gewesen zu sein, wenn mir nicht einmal erlaubt ist, in einer Zeit, da ich zu Macht und Ansehen gelangen konnte, in Zurückgezogenheit zu bleiben im Gegensatz zu einer streberischen Masse, welche mitregieren und am Glück der Freunde teilnehmen möchte?</p><p>Wozu soll ich von all dem sprechen, was Schmerz und Niedergeschlagenheit, die ich als seelische Finsternis bezeichne, ersonnen hatten? In erwähnter Weise hatte ich gedacht und noch verkehrtere Gedanken hatte ich. Selbst will ich aber mein Handeln verurteilen, mag es nun Unbesonnenheit oder Verwegenheit gewesen sein. Nunmehr habe ich meine Stellung geändert und bin umgestimmt für das, was viel richtiger und uns geziemender ist. Wie ehrlich unsere Umwandlung ist, kannst du, Bewundernswerter, nicht nur daraus ersehen, daß du mich zum Aufgeben des von dir getadelten und oft kritisierten Schweigens gebracht hast, sondern auch aus der Übereinstimmung unserer Lehren. Dies ist nun ein sicherer Beweis für unsere Freundschaft und für den in uns wohnenden Geist. Doch worin besteht die Übereinstimmung? Sollte ich noch einen Fehler machen, dann korrigiere ihn, wie du es auch sonst zu tun pflegtest! Nicht wolltest du eine Zurücksetzung des Geistes gegenüber der Freundschaft dulden. Zwar sind wir dir wohl mehr als die übrigen, doch den Geist schätzest du noch viel höher als uns. Nicht wolltest du es ertragen, daß das Talent in der Erde verborgen und vergraben werde, oder daß der Leuchter noch länger unter den Scheffel gestellt werde; solche Meinung hast du nämlich von meinem Lichte und meinem Wirken. Du strebtest darnach, daß dir, dem Paulus, auch noch ein Barnabas beigesellt werde, und daß sich dem Silvanus und Timotheus auch noch ein Titus anschließe, damit durch die Mithilfe derer, welche sich um deinetwillen aufrichtig der Seelsorge hingeben, die Gnaden wachsen und du „von Jerusalem und seiner Umgebung aus bis nach Illyrien das Evangelium vollendest“.</p><p>[Forts. v. ] Du berufst mich in dieser Absicht in die Öffentlichkeit, nimmst mich, den Flüchtling, bei der Hand und setzest mich an deine Seite. „Darin ― so wirst du wohl sagen ― besteht das Unrecht, das ich dir antue.“ Und du lässest mich teilnehmen an deinen Sorgen und Kronen. Du salbest mich in genannter Absicht zum Hohenpriester, umgibst mich mit dem langen Gewande, setzest mir den Kopfbund auf, führest mich an den Altar des geistigen Opfers, schlachtest das vollkommene Rind, weihest die Hände dem Geiste, geleitest mich in das Allerheiligste, daß ich es schaue, und machst mich zum Diener des „wahren Zeltes, welches der Herr, und nicht ein Mensch errichtet hat“. Ob ich aber auch würdig bin, sowohl euer, die ihr salbet, wie dessen, für den und auf dessen Namen hin gesalbt wird, dies weiß der Vater des wahren und wirklichen Christus, der von ihm „mit dem Öl der Freude zur Auszeichnung vor seinen Genossen gesalbt wurde“, dessen Menschheit mit der Gottheit gesalbt wurde, auf daß „Beides eins sei“, dies weiß ferner Jesus Christus, unser Gott und Herr, durch den wir die Versöhnung erhalten haben, und der Heilige Geist, der uns zu diesem Dienste bestimmt hat, in dem wir feststehen und dessen wir uns freuen in der Hoffnung auf die Herrlichkeit unseres Herrn Jesus Christus, dem die Ehre sei in alle Ewigkeit! Amen.XI. Rede</p><h2>XI. Rede</h2><p><em>XI. Rede.</em></p><p><em>An den Bruder Basilius des Großen, Gregor von Nyssa, welcher nach der Weihe gekommen war.</em></p><p>Mit einem treuen Freunde ist nichts zu vergleichen, und nichts wägt seine Güte auf.“ „Ein treuer Freund ist ein starker Schutz“ und eine feste Burg. Ein treuer Freund ist ein lebender Schatz. Ein treuer Freund ist „mehr als Gold und viele Edelsteine“. Ein treuer Freund ist „ein geschlossener Garten, eine versiegelte Quelle“, welche zur rechten Zeit dem Zutritt geöffnet wird. Ein treuer Freund ist ein Hafen der Erholung. Zeichnet sich der Freund auch durch Klugheit aus, wie groß ist dann sein Wert! Und steht er auch noch hoch an Weisheit, an Kenntnissen aller Art ― ich denke an unser Wissen, auch an das, welches ich einst besessen hatte ―, wieviel herrlicher ist sein Glanz! Wenn er auch noch „Sohn des Lichtes“, „Mann Gottes“, „Wanderer zu Gott“ oder „Mann des besonderen Verlangens“ genannt zu werden verdient, mit welchen Bezeichnungen die Schrift jene Idealisten beehrt, welche in Gott wohnen, und deren Anteil der Himmel ist, so offenbart sich hierin bereits Gottes Gnade und ein deutliches Wirken über unsere Verdienste hinaus. Wenn aber auch noch diese Gnade von dem Freunde auf uns übergeht, so bereitet uns diese noch mehr Freude und Wonne als der Freund, mag dieser auch durch seine Tugenden und durch seine Liebe zu uns so wertvoll sein wie unsere eigene Person, und noch mehr Wohlgeruch als das Salböl, welches den Bart des Priesters und die Borden seines Gewandes auszeichnete.</p><p>Genügen diese Andeutungen? Haben meine Worte euch den Mann in angemessener Weise geschildert? Oder ist es notwendig, es den fleißigen Malern nachzumachen und immer wieder frische Farben aufzutragen, um euch ein vollkommenes Bild zu entwerfen? Wir wollen euch den Mann noch besser und genauer darstellen. Wer war der berühmteste Gesetzgeber? Moses. Wer war der heiligste unter den Priestern? Aaron. Wie Moses und Aaron leibliche Brüder waren, waren sie auch Brüder im religiösen Leben. Allerdings ist der eine (d. i. Moses, bzw. Basilius) „der Gott Pharaos“, der Führer und Gesetzgeber Israels, der in die Wolke eintritt, die göttlichen Geheimnisse schaut und in sie einweiht, der das wahre Zelt Gottes fertigt, das der Herr und nicht ein Mensch errichtet hatte. Priester aber waren sie beide in gleicher Weise. Heißt es doch: „Moses und Aaron waren unter seinen Priestern.“ Jener war der oberste Führer und der oberste Priester; den Aaron benützte er als Redner, wofür er zwischen diesem und Gott vermittelte. Aaron hatte seine Stellung gleich nach jenem, aber infolge seiner Würde und seiner nahen Beziehung zu Gott weit vor den übrigen. Beide schicken dem Ägypter Heimsuchungen, teilen das Meer, führen Israel durch dasselbe, ertränken die Feinde in demselben, lassen Brot vom Himmel regnen, Wasser wider Erwarten in der Wüste bald hervorsprudeln, bald süß werden. Beide bekämpfen die Amalekiter durch heiliges Erheben der Hände und durch das Vorbild eines großen Geheimnisses. Beide führen mit Eifer zum Lande der Verheißung. Kann man das Bild noch klarer zeichnen? Hat euch nicht meine Charakteristik den kongenialen Namenskollegen deutlich dargestellt?</p><p>Der eine der beiden Brüder hat uns gesalbt und uns aus der Zurückgezogenheit in die Öffentlichkeit geführt. Was ihn dazu veranlaßt hat, weiß ich nicht. Sein Handeln entspricht nicht dem in ihm wohnenden Geist. Das Wort ist zwar scharf, aber es muß gesagt sein. Freundschaft vermag alles zu ertragen und zu hören. Der andere der beiden Brüder ist gekommen, uns zu trösten und zu festigen und unseren Geist zu besänftigen. Es ist mir viel wert, daß er jetzt noch gekommen ist. Ja, sehr viel ist es mir wert; denn ich hatte euch zum Führer meines ganzen Lebens erkoren. Zu beanstanden habe ich nur, daß er in meiner Bedrängnis zu spät gekommen ist. Bester Freund und Kampfgenosse, welchen Wert hat es, wenn der Kampfgenosse erst nach der Niederlage und nach dem Angriff eintrifft? Welchen Wert hat denn ein Steuermann erst nach dem Sturme oder ein Heilmittel nach der Vernarbung der Wunde? Hast du dich wie ein lieber Bruder über meine Vergewaltigung geschämt oder warst auch du als Gewaltherrscher über meinen Ungehorsam ungehalten? Gegen welchen Bruder wendest du dich, und welchem ersparst du den Tadel? Ich will mich dir gegenüber der Worte Jobs bedienen, der ebenfalls im Leid zu einem Freunde sprach, wenn auch der Freund wie die Leiden anderer Art waren. Er sprach: „Wem schließt du dich an? Oder wem bist du bereit, zu helfen? Nicht etwa dem, der reich ist an Kraft, an Weisheit, an Kenntnissen?“ Viele, die jetzt zu urteilen haben, sind, wie ich sehe, von solcher Parteilichkeit beeinflußt; es fällt ihnen leichter, den Oberen die größten Wünsche zu erfüllen, als den Niederen das Geringste zu gewähren. Dies dürftest du selbst wissen. Da du immer Vorbild und Richtschnur im Guten bist, habe ich nicht das Recht, von dir etwas Ungehöriges zu behaupten; auch warnt mich die Schrift, voreilig im Urteil zu sein. Gerne will ich dir und jedem, der freundschaftlich darum bittet, Rechenschaft geben über mein Verhalten, das manche als Ungehorsam erklären möchten, ich selber aber ausdrücklich als Klugheit bezeichne und das Vorsicht war, wie du einsehen dürftest, soferne du mich nicht als einen völlig ungeschickten und dummen Freund ansiehst, sondern als einen Freund, der manches besser zu verstehen vermag als viele und Mut zeigt, wo Mut am Platze ist, Ängstlichkeit aber da, wo sie begründet ist und wo der Vernünftige sich vor Mangel an Mut fürchtet.</p><p>Was ist nun zu tun? Was ist das beste? Wünschet ihr, daß wir jetzt euch Rechenschaft geben? Haltet ihr diesen Tag, der ein Tag des Festes und nicht der Gerichtssitzung ist, dazu nicht für unpassend? Sollen wir unsere Verteidigung nicht auf einen anderen Tag und auf eine andere Zusammenkunft verschieben? Sie ist doch zu lang für die jetzt zur Verfügung stehende Zeit. Was sollen wir nun aber als Gastgeber zu euch sagen, um der Festfeier zu entsprechen und euch nicht ungesättigt zu entlassen? Brüder, wir wollen uns den Märtyrern oder vielmehr dem weihen, dem sich die Märtyrer mit ihrem Blute durch das Bekenntnis der Wahrheit geweiht hatten! „Reinigen wir uns von allem Schmutze des Fleisches und des Geistes!“ „Waschen wir uns, werden wir rein!“ „Machen wir unseren Leib und unsere Seele zu einem lebendigen, heiligen, Gott wohlgefälligen Opfer, damit unser Dienst und unsere Zusammenkunft vernünftig ist!“ Der Reine schätzt nichts so hoch als Reinheit und Reinigung. Um der Helden willen wollen wir kämpfen wie Helden, um der Sieger willen wollen wir siegen, um der Blutzeugen willen wollen wir der Wahrheit Zeugnis geben! Ihre Kämpfe wollen wir dadurch belohnen, daß wir selbst Bekränzte werden und dieselben Ehren erben und zwar sowohl jene, welche sie von uns erhalten, wie auch jene, die im Himmel bereitet sind und wovon die irdischen Ehren nur unbedeutende Anzeichen und Abbilder sind! Lasset uns kämpfen „gegen die Mächte und Herrschaften“, gegen die unsichtbaren Verfolger und Tyrannen, „gegen die Beherrscher der Finsternis dieser Welt, gegen die Geister der Bosheit in den Himmeln“ und im Umkreis der Himmel, gegen die inneren, von den Leidenschaften erregten Unruhen und gegen die täglichen von außen drohenden Angriffe!</p><p>Der Zorn darf uns so wenig wie ein wildes Tier, die Zunge so wenig wie ein scharfes Schwert etwas anhaben. Die Sinnlichkeit wollen wir wie ein Feuer auslöschen! Den Ohren wollen wir Türen geben, die zur rechten Zeit geöffnet und verschlossen werden! Die Lust der Augen wollen wir bezähmen! Die unbändigen Gefühle und die Gier des Gaumens wollen wir in Zucht halten, damit nicht „der Tod einsteige durch unsere Fenster“; mit diesem Worte sind nämlich meines Erachtens unsere Sinne gemeint. Ausgelassenes Lachen wollen wir verachten! In der Not wollen wir nicht vor Baal unser Knie beugen und in der Angst nicht ein goldenes Bild anbeten! Nur davor wollen wir uns fürchten, daß wir irgend etwas noch mehr als Gott fürchten und daß wir sein Abbild durch eine Sünde entehren. Immer wollen wir „den Schild des Glaubens ergreifen und allen Geschoßen des Bösen“ entrinnen! Auch hier gibt es gewaltige Kriege, große Schlachten und herrliche Siege. Wenn wir in dieser Absicht uns versammelt haben und hierher geeilt sind, dann begehen wir das Fest wahrlich im Geiste Christi, dann sind die Märtyrer tatsächlich von uns geehrt, bzw. werden sie von uns geehrt werden, und wir feiern wahre Triumphe. Wenn wir aber zusammenkommen, um der Gaumenlust zu frönen, eitle Freuden zu genießen und wertlose Opfer zu bringen, wenn wir meinen, hier sei nicht eine Stätte der Enthaltsamkeit, sondern eine Stätte des Sinnentaumels und jetzt sei eine Zeit zu Handel und zu Geschäften, nicht aber eine Zeit zur geistigen Erhebung und ― um ein kühneres Wort zu gebrauchen ― zur Vergöttlichung, welche uns die Märtyrer vermitteln, dann muß ich zunächst bemerken: Ich anerkenne einen solchen Zweck des Tages nicht. Was hat denn die Spreu mit dem Weizen zu tun? Wie paßt denn Weichlichkeit des Fleisches zu dem Ringen der Märtyrer? Das eine gehört ins Theater, das andere in meine Versammlungen; das eine ist Zeichen ausgearteter Menschen, das andere Zeichen gesitteter Menschen; das eine verrät Fleischesliebe, das andere Loslösung vom Fleische. Sodann möchte ich aber noch einen kühneren Einwand erheben. Doch mit Rücksicht auf die Würde des Tages will ich von schärferen Worten abstehen. Die Märtyrer ― um mich recht vorsichtig auszudrücken ― verlangen doch nicht solche Dinge von uns.</p><p>Brüder, das Heilige wollen wir also nicht unheilig, das Erhabene nicht gemein, das Würdige nicht unwürdig und ― um es kurz zu sagen ― die Feste des Geistes nicht irdisch feiern! Der Jude begeht Feste, um dem Buchstaben zu dienen, der Heide, um den Dämonen zu gefallen. Wir aber haben die Pflicht, Feste und Festesfreuden zu vergeistigen, da bei uns alles im Geiste geschehen muß: Die Handlungen, die Bewegungen, das Wollen, das Reden, selbst das Gehen und Ankleiden und das Verbeugen; denn der Logos will alles erfassen und den Menschen nach Gott gestalten. Nicht verhindere ich die Erholung, aber der Zügellosigkeit setze ich Schranken. Wenn wir in gewünschter Weise zusammenkommen und Feste halten, dann können wir uns rühmen, den gleichen Kampfpreis zu erlangen und dieselbe Herrlichkeit zu erben; denn was kein Auge gesehen und kein Ohr gehört und kein menschlicher Geist, mochte er die Seligkeit noch so sehr zu ergründen suchen, je ersonnen hat, das ist nach unserem Glauben denen bestimmt, welche sich durch das Blut gereinigt und das Opfer Christi nachgeahmt haben. Doch ist es nach meiner Lehre noch etwas Großes, das uns beschieden sein wird: Wir werden die Herrlichkeit der Märtyrer schauen, in die Freude des Herrn selbst eingehen und heller und reiner im Lichte der seligen, ewigen Dreifaltigkeit leuchten, an welche wir glauben, welcher wir dienen und welche wir furchtlos, ohne uns vor den äußeren Feinden und vor den falschen Christen und den Gegnern des Geistes im eigenen Kreise zu schämen, vor Gott und den Menschen bekennen. Möchten wir die herrliche Überlieferung der Christus nahestehenden, heiligen Väter und unseres ersten Glaubens, das Bekenntnis, zu dem wir von Kindheit an erzogen worden sind und das wir zuerst bekannt haben, bis zum letzten Atemzuge in aller Offenheit bekennen, um mit diesem Bekenntnis schließlich die Welt zu verlassen und, wenn wir sonst nichts mehr haben, die Gottesliebe zu behalten.</p><p>Der Gott des Friedens, welcher uns, die wir infolge der Sünde seine Feinde waren, durch sein Kreuz mit sich versöhnt hat, welcher „sowohl denen, die ihm fernestanden, wie denen, die ihm nahe waren“, sowohl denen, die unter dem Gesetze, wie denen, die außerhalb des Gesetzes waren, den Frieden verkündet hat, er, welcher der Vater der Liebe und „die Liebe ist“ und sich vor allem über diese Bezeichnung freut, um schon durch diese Titel die Bruderliebe zu predigen, er, welcher „das neue Gesetz erlassen hat, daß wir einander ebenso zu lieben haben, wie wir (von ihm) geliebt worden sind“, er, welcher die Kraft gab, gut zu herrschen, aber auch aus Furcht, sich beherrschen zu lassen, mit Vernunft nachzugeben, aber auch wiederum aus Vernunft Mut zu zeigen, er, welcher durch seine Gnade den großen Herden die Vollkommenheit verleiht und die kleinen groß macht, ― er möge nach der Größe seiner Güte uns mit reichlichem Troste erquicken und vorwärtsgeleiten und mit uns die Herde weiden und retten, er möge euch zu jedem guten Werke vervollkommnen, euch veranlassen, das Fest der Märtyrer geistig zu feiern, euch des himmlischen Paradieses würdigen, in dem „die Wohnung aller Fröhlichen ist“, und euch, wenn ihr vor ihm in Gerechtigkeit erscheint, mit seiner Herrlichkeit sättigen, welche offenbar werden wird in Christus Jesus, unserem Herrn, dem die Herrlichkeit und Kraft, die Ehre und Anbetung sei in alle Ewigkeit! Amen.XII. Rede</p><h2>XII. Rede</h2><p><em>XII. Rede.</em></p><p><em>An seinen Vater, nachdem dieser ihm die Sorge über die Kirche von Nazianz übertragen hatte</em>.</p><p>„Meinen Mund habe ich geöffnet und den Geist aufgenommen.“ Dem Geiste weihe ich alles, was ich habe und mich selbst. Ich weihe ihm mein Tun und Reden, mein Ruhen und Schweigen. Er allein möge von mir Besitz nehmen und mich führen und mir Hände, Verstand und Zunge leiten, wohin es notwendig ist und wohin er will! Er möge mich auch wieder zurückführen, wenn es notwendig und besser ist! Ich bin Gottes Instrument, ein vernünftiges Instrument, ein Instrument, das vom Geiste, dem trefflichen Künstler, gestimmt und gespielt wird. Gestern wirkte er in mir das Schweigen, und meine Weisheit war, still zu sein. Heute berührt er meinen Geist, und ich gebe dem Worte die Freiheit, und meine Weisheit ist, zu sprechen. Ich bin nicht so gesprächig, daß ich zu reden wünsche, wenn der Geist das Schweigen wirkt. Ich bin aber auch nicht so redensmüde und geistesschwach, daß ich, wenn es Zeit zu reden ist, meinem Munde einen Korb anlege. Bald verschließe, bald öffne ich meine Türe für den Verstand, den Logos, den Geist, die Gottheit, die eins ist in der Natur.</p><p>Ich will also sprechen, weil ich dazu beauftragt bin. Zu diesem guten Hirten und zu euch, der heiligen Herde, will ich das sprechen, wovon ich weiß, daß es heute gut ist, es zu sprechen und zu hören. Wie kommt es, daß du eines Amtsgenossen bedarfst? Zuerst will ich nämlich von dir sprechen, teures, geehrtes Haupt, ehrwürdig gleich dem des Aaron, auf welches das geweihte, priesterliche Salböl floß, um bis zum Barte und Gewande herabzuträufeln. Wie kommt es, daß du, der du doch noch viele zu stützen und zu leiten vermagst und wahrlich in der Kraft des Geistes führest, für den geistlichen Beruf einen Stab und eine Stütze brauchst? Hast du etwa an jene Erzählung gedacht, wonach zugleich mit dem trefflichen Aaron seine Söhne Eleazar und Ithamar gesalbt worden waren? Mit Absicht übergehe ich nämlich Nadab und Abiud, damit kein böses Wort falle. Oder hast du an Moses gedacht, der noch zu seinen Lebzeiten Josue als seinen Vertreter, als Gesetzgeber und Führer für das dem Lande der Verheißung zueilende Volk aufgestellt hatte? Absichtlich möchte ich übergehen, daß Aaron und Hur auf dem Berge die Hände des Moses stützten, damit die Amalekiter durch das damals versinnbildete und verheißene Kreuz besiegt würden. Denn diese Geschichte paßt und dient uns nicht, da Moses die beiden Männer nicht als Gesetzgeber, sondern als Gehilfen im Gebete und als Stütze seiner ermüdeten Hände erwählt hatte.</p><p>Inwiefern bist du leidend und krank? Etwa körperlich? Ich bin bereit, dich zu unterstützen; ja ich habe dich unterstützt, und wie ein Jakob bin ich mit väterlichem Segen gestärkt worden. Bist du geistig leidend und krank? Wann hat der Geist mehr Stärke und Wärme als gerade jetzt, da die Kräfte des Fleisches sich vor ihm zurückziehen, wie vor dem Lichte das schwindet, was lichtscheu ist und den Glanz verhindert? Geist und Fleisch liegen in der Regel mit sich in Kampf und Streit. Dem Fleische geht es gut, wenn die Seele krank ist; die Seele aber gedeiht und blickt aufwärts, wenn mit dem Fleische sich die Vergnügungen zurückziehen und schwinden. Übrigens habe ich dich gerade wegen deines Alters und deiner Würde bewundert. Hattest du nicht befürchtet, man möchte, wie es jetzt sooft geschieht, den Geist nur als Schminke betrachten, und die Menge möchte glauben, wir fassen, obwohl wir uns als Männer des Geistes ausgeben, dieses Leben sinnlich auf? Die Menge hat es ja zuwege gebracht, daß dieses Amt als das eines Großen und Herrschers, als fette Pfründe angesehen wird, selbst wenn die Herde, die einer führt und leitet, noch kleiner ist als diese und die Mühen und Leiden die Annehmlichkeiten noch weit mehr überwiegen. Diese Worte sind an deine Einfalt und Kindlichkeit gerichtet, welche es ebensowenig zulassen, daß du selbst ein Unrecht auf dich nimmst, wie daß du von anderen etwas Böses leichtfertig behauptest; wer selbst nicht zur Sünde neigt, hegt nicht leicht Argwohn. Ein zweites kurzes Wort habe ich noch an dieses dein, bzw. mein Volk zu richten.</p><p>Freunde, Brüder, uns ist Gewalt angetan worden. Jetzt will ich euch anrufen, nachdem ich es seinerzeit nicht getan habe. Gewalt haben wir erlitten durch das Alter des Vaters und ― um mich milde auszudrücken ― durch die Güte des Freundes. Helfet mir, soweit es dem einzelnen möglich ist! Reichet die Hand einem Gedrückten, der von persönlichem Verlangen und vom Geiste gepackt ist! Die Sehnsucht treibt zur Flucht in die Berge und in die Wüste, zur Ruhe für Körper und Geist, sie rät dem Verstande, sich zurückzuziehen und sich vom Sinnlichen freizumachen, um, wenn Irdisches und Schmutziges sich nicht beimischen und das göttliche Licht nicht stören können, rein von Makel mit Gott zu verkehren und von den Strahlen des Geistes sich ungehindert erleuchten zu lassen, bis wir zur Quelle des irdischen Glanzes gelangen und, wenn die Wahrheit nicht mehr im Spiegel geschaut wird, Sehnsucht und Verlangen gestillt sind. Der Geist aber will, daß ich in die Öffentlichkeit trete, Früchte für das Gemeinwohl bringe, durch den Dienst am Nächsten mir selber diene, die Herrlichkeit zum Gemeingut mache, ein großes Volk, „ein heiliges Geschlecht, ein königliches Priestertum“, das in den meisten wiederhergestellte Ebenbild Gott zuführe. Besser und größer als eine einzelne Pflanze ist der Garten, als ein einzelner Stern der ganze Himmel mit all seiner Schönheit, als ein einzelnes Glied der Körper; ebenso ist es aber auch etwas Besseres und Größeres, die ganze Kirche für Gott zu gewinnen, als nur sich selbst ihm zu weihen. Nicht nur für sich allein soll man sorgen, sondern auch für die ganze Welt. Denn Christus hat, obwohl er in seiner Herrlichkeit und Gottheit hätte bleiben können, sich nicht nur bis zur Knechtsgestalt erniedrigt, er hat sogar, der Schmach nicht achtend, das Kreuz auf sich genommen, um durch seine eigenen Leiden die Sünde hinwegzunehmen und durch seinen Tod den Tod zu töten. Den Einbildungen des persönlichen Verlangens stehen die Lehren des Geistes gegenüber. Da ich zwischen persönlichem Verlangen und Geist stehe und nicht weiß, wem ich den Vorzug geben soll, so will ich euch, was mir das Beste und Sicherste zu sein scheint, mitteilen, damit ihr mir euer Gutachten abgebet und an meinem Entschluß teilhabet.</p><p>Mir schien es das Beste und Ungefährlichste zu sein, eine Mittelstraße zwischen persönlichem Verlangen und Furchtsamkeit einzuschlagen und sowohl dem Verlangen wie dem Geiste nachzugeben, d. h. einerseits das Amt nicht vollständig abzuweisen, um mich nicht der Gefahr auszusetzen, die Gnade zu mißachten, anderseits aber auch nicht mich in die Schwierigkeit zu begeben, und eine Bürde, die meine Kraft übersteigt, mir aufzuladen. Der eine (der ohne weiteres abweist) würde den Weg der Unsicherheit, der andere (der auch das schwierigste Amt übernimmt) den der Selbstüberhebung und beide den der Torheit gehen. Zeichen von Frömmigkeit und Vorsicht ist es, bei der Übernahme eines Amtes es zu machen wie bei der Aufnahme von Speisen, d. h. sich nach seinen Kräften zu richten und das Amt, das den Kräften entspricht, anzunehmen, dasjenige aber, das die Kräfte übersteigt, zurückzuweisen. Durch Mäßigung bewahrt der Körper seine Gesundheit, die Seele ihre Ruhe. Ich weigere mich daher jetzt nicht, zugleich mit meinem guten Vater die Seelsorge zu übernehmen; ich will dem Jungen gleichen, das nicht untätig sich im Fluge in der Nähe des mächtigen, hochfliegenden Adlers hält. Später aber will ich mich im Fluge dem Geiste überlassen auf allen Wegen, die er will. Wenn er mich leitet, soll keiner die Gewalt haben, mich von seinen Wegen abzubringen. Es ist angenehm, dem Vater die Mühen abzunehmen und eine Herde zu leiten, die einem vertrauter ist als eine fremde und unbekannte. Es ist auch noch, wie ich beifügen möchte, Gott erwünschter, soferne ich nur mich nicht durch die Liebe täuschen und durch das Vertrautsein irreführen lasse. Doch ist es nicht so ersprießlich und sicher, als wenn einer freiwillig die Herrschaft über Freiwillige übernimmt. Unser Prinzip ist es nämlich, nicht mit Gewalt und gezwungen, sondern freiwillig zu führen. Durch Gewalt wird auch anderen Organisationen die Existenzmöglichkeit genommen; denn wer mit Gewalt beherrscht wird, strebt darnach, bei Gelegenheit sich wieder frei zu machen. Freiheit gibt ganz besonders unserer Organisation, bzw. unserer Seelenführung Kraft. Das Geheimnis des Gutseins liegt nicht in der Gewalt, sondern in der Freiheit.</p><p>[Forts. v. ] Diese meine Worte sind zu euch, ihr Männer, in Einfalt und mit vollem Wohlwollen gesprochen; hierin liegt das Geheimnis meines Geistes. Möge uns ― um zum Anfangsgedanken zurückzukehren ― der Geist, dem wir uns und das vom Öle der Vollkommenheit gesalbte Haupt geweiht haben, leiten und möge so das, was euch an uns von Nutzen sein wird, in Kraft treten durch den allmächtigen Vater, den eingeborenen Sohn und den heiligen göttlichen Geist. Wie lange noch sollen wir das Licht unter den Scheffel stellen und den Mitmenschen die vollkommene Gotteslehre vorenthalten? Notwendig ist es, die Gottheit nunmehr auf den Leuchter zu stellen und allen Kirchen und Seelen und dem gesamten Erdkreise zu leuchten; sie darf nicht mehr dem Verstande im Vorbilde und als Schatten verkündet, sondern muß klar und deutlich gepredigt werden. Die Lehre von Gott ist der Hauptinhalt der Theologie für die, welche dieser Gnade gewürdigt wurden in Christus Jesus, unserm Herrn, dem die Herrlichkeit, Ehre und Macht sei in alle Ewigkeit! Amen.XIII. Rede</p><h2>XIII. Rede</h2><p><em>XIII. Rede</em>.</p><p><em>Rede an Bischof Eulalius anläßlich seiner Weihe in Doara</em>.</p><p>Brüder, höret auf unsere Rede, mag sie auch sehr kurz sein und bei weitem nicht der Würde (der Feier) entsprechen! Doch Gott, der Herr, weiß trotz seiner Gerechtigkeit auch der Barmherzigkeit einen Platz einzuräumen. Er nahm ja auch die Pflanzung des Paulus an, die Begießung durch Apollo, die zwei Scherflein der Witwe, die Demut des Zöllners, das Bekenntnis des Manasses. Nehmet an das neue Wort um des neuen Hirten willen! Nehmet hin die Worte, welche ein Dank für die geschauten Wunder sind! Unter den Söhnen Israels sind wir zwar unbedeutend und sehr gering. Doch liegt nichts im Wege, daß auch unbedeutende Menschen reichlichen Dank sprechen. Allerdings werden vollkommenere Menschen Gott einen vollkommeneren Dank abstatten. Wir wollen heute nach unseren Kräften danken. „Singet dem Herrn ein neues Lied, da er Wunder gewirkt hat!“ Von den Wogen wurden wir erfaßt, der Krieg zog ins Land, wir wurden vertrieben; Schreckliches kam bereits über uns, weitere Schrecken drohen. Wer ist es, der den Sturm gestillt hat? Wer hat die Schilde, die Schwerter, den Krieg vernichtet. Wer hat uns aufgenommen, nachdem wir vertrieben und verstoßen worden waren? Warst nicht du es, o Gott, der solches gewirkt hat? „Der Herr ist mächtig und stark, stark im Kriege.“</p><p>Der Herr teilte das Meer, ernährte das Volk auf seiner Flucht in der Wüste, spendete ihm in unerhörter Weise Regen und ließ aus dem Felsen Wasser sprudeln. Durch stilles, sinnreiches Ausstrecken der Hände besiegte er die Amalekiter. Was viele Tausende von Händen nicht vermocht hätten, vermochten die auf dem Berge zum Gebete erhobenen Priesterhände. Ohne Kampf und Krieg riß der Herr Mauern ein. Er streckte ― um die Aufzählung zu beschließen ― den hochmütigen prahlerischen, von den Riesen abstammenden Goliath, der den Kampf gegen den großen David gewagt hatte, zu Boden. Einmütig wollen wir es daher sprechen: „Gepriesen sei der Herr, welcher uns nicht zur Beute ihrer Zähne werden ließ; einen reißenden Fluß haben wir überwunden; gleich dem Sperlinge sind wir dem Netze der Jäger entronnen.“ Und noch vieles andere könnten wir im Jubel über Gottes große Güte sagen. „Nicht sind wir gekommen, das Schwert zu bringen, sondern den Frieden.“ Wir sind nicht gekommen, dem großen Hirten, der über die glänzende Stadt gesetzt ist, Schmach anzutun. Wir kennen seine Würde, wir anerkennen ihn als Oberhaupt, wir bezeichnen ihn als Heiligen, mag er uns auch Unrecht getan haben. Möge er nur seine Kinder lieben und für das Wohl der ganzen Kirche sorgen! Unser Bestreben war, den Priestern zu dienen, nicht sie zu beeinträchtigen, die Irrlehrer zu bekämpfen, nicht aber den Rechtgläubigen zu schaden.</p><p>Was sagst du, Sohn des Dathan und Abiron, törichter Führer? Du bist gegen Moses aufgestanden und hast erhoben deine Hände wider uns, so, wie jene ihre Zungen gegen den großen Diener (Gottes) gerichtet hatten. Hast du dich nicht entsetzt? Hast du deine Gesinnung nicht geändert? Hat dir nicht die Erinnerung an das, was geschehen, das Fleisch vom Leibe fallen lassen? Nach der Tat erhebst du noch deine Hand zu Gott, willst du noch Gaben opfern, noch Gebete für das Volk verrichten? Ich fürchte, daß einen solchen Menschen Gottes Schwert und die Erde verschlingen werden. Einerseits hast du deinem Hirten keinen großen Dienst erwiesen, anderseits hast du dir selbst schwer geschadet, da du dich von der Gnade Gottes entfernt hast.</p><p>Nun aber, bester, vollkommenster Hirte, tritt zu mir und empfange mit uns und vor uns dein Volk, welches dir der Heilige Geist übergeben hat, die Engel dir zuführen, dein Leben und dein Charakter dir anvertraut hat! Du darfst dich nicht darüber wundern, daß du unter Prüfungen und Hindernissen den Thron übernehmen mußt. Mit allem Großen sind Heimsuchungen und Prüfungen verbunden. Es ist naturgemäß, daß geringfügige Dinge sich mit leichter Mühe, Großes dagegen mit vieler Anstrengung erreichen läßt. Du hast das Wort gehört: „Unter vielen Trübsalen müssen wir in das Himmelreich eingehen.“ Auch du sollst sagen: „Durch Feuer und Wasser sind wir gegangen; aber du hast uns zur Ruhe geführt.“ Wie wunderbar: „Am Abend herrscht Wehklagen, am Morgen Jubel.“ Lasse die Streitsüchtigen dummes Zeug reden, sie sollen schimpfen wie Hunde, die nicht wissen, warum sie bellen! Wir wollen uns von Streit fernhalten. Lehre Gott, den Vater, Gott, den Sohn, Gott den Heiligen Geist in drei Personen und in der einen Majestät und Herrlichkeit anbeten! Suche das Verlorene, stärke das Schwache, erhalte das Starke! Wir wünschen, daß du dich im geistlichen Amte ebenso bewährest, wie du dich im weltlichen tatsächlich erprobt hast. Von den höheren Führern sollst du eine noch bessere Waffenrüstung erhalten, welche dich befähigt, „die feurigen Geschoße des Bösen zu löschen“ und dem Herrn ein vollkommenes Volk, ein heiliges Geschlecht, ein königliches Priestertum vorzuführen in Christus Jesus, unserm Herrn, dem die Ehre sei in alle Ewigkeit! Amen.XIV. Rede</p><h2>XIV. Rede</h2><p>[Forts. v. ]* XIV. Rede*.</p><p><em>Über die Liebe zu den Armen.</em></p><p>Nehmet die Rede über die Liebe zu den Armen nicht engherzig entgegen, meine Brüder und meine Genossen in der Armut! Arm sind wir nämlich alle und alle bedürfen wir der göttlichen Gnade, mag auch, wenn man einen kleinlichen Maßstab anlegt, der eine vor dem anderen etwas vorauszuhaben scheinen. Nehmet die Rede wohlwollend an, damit ihr die Schätze des Reichtums empfanget! Betet mit mir, damit wir euch reichlich spenden und eure Seele mit dem Worte nähren und den Hungrigen das geistige Brot brechen, indem wir gleich dem alten Moses Speisen regnen lassen und Engelsbrote verabreichen oder mit wenigen Broten Tausende in der Wüste sättigen, wie es später Jesus, das wahre Brot und die Quelle des wahren Lebens, getan hat. Unter den verschiedenen Tugenden die vorzüglichste herauszufinden und einer einzelnen den Vorzug und Sieg zuzuschreiben, ist ebenso schwierig, als auf einer blumenreichen, duftenden Wiese festzustellen, welches die schönste und wohlriechendste Blume ist; denn bald zieht diese, bald jene Blume Geruchsinn und Augen an sich, um zum Pflücken einzuladen. Nach meiner Meinung ist bei der Bewertung folgendes zu beachten.</p><p>Etwas Schönes sind „Glaube, Hoffnung und Liebe, diese Drei“. Zeuge des Glaubens war Abraham, der auf Grund des Glaubens gerechtfertigt worden war. Zeuge der Hoffnung waren Enos, welcher zuerst „gehofft hatte, den Herrn für sich anzurufen“, und alle Gerechte, welche um der Hoffnung willen Böses erduldet hatten. Zeuge der Liebe war der ehrwürdige Apostel, der um Israels willen sogar sich selbst verflucht hätte, und Gott selbst, der als Liebe bezeichnet wird. Etwas Schönes ist die Gastfreundschaft. Ein Beispiel hierfür ist der gerechte Loth, der Sodomite, aber nicht ein Sodomite im Benehmen, und unter den Sündern die Buhlerin Rahab, die aber nicht aus Schlechtigkeit Buhlerin war, da sie um der Gastfreundschaft willen gelobt und auch gerettet wurde. Schön ist die Bruderliebe, wie wiederum Jesus lehrt, da er nicht nur den Menschen zum Guten erschaffen und dem Staube das Ebenbild beigesellt hatte, damit es zum Besten führe und die himmlischen Güter vermittle, sondern da er auch für uns Mensch geworden ist. Etwas Schönes ist es um die Langmut, wie wiederum derselbe bezeugt, soferne er gegen die, welche sich wider ihn erhoben und ihn vergewaltigt hatten, nicht nur nicht Legionen von Engeln erbat und nicht nur dem Petrus, der das Schwert gezogen hatte, Vorwürfe machte, sondern auch dem Verwundeten das Ohr heilte. Das gleiche Beispiel von Langmut gab später Stephanus, der Jünger Christi, der für die betete, welche ihn steinigten. Schön ist Sanftmut, welche nach den Berichten vor allem Moses und David bekundeten und ihr Lehrer, der nicht zankte und nicht lärmte und nicht auf den Straßen schrie und sich denen, die ihn fortschleppten, nicht widersetzte.</p><p>Schön ist der Eifer, wie uns Phinees zeigt, der, um Israels Söhne von der Schmach zu reinigen, die Madianitin zugleich mit dem Israeliten durchbohrte, was ihm seinen Namen eintrug. Ein Beispiel von Eifer sind nach ihm die, welche erklärten: „Geeifert habe ich für den Herrn“ und „mit dem Eifer Gottes eifere ich für euch“ und „der Eifer für dein Haus verzehrt mich“. So sprachen sie nicht nur, so handelten sie auch. Schön ist körperliche Abtötung. Davon könnte dich Paulus überzeugen, der sich noch selbst züchtigte und durch Israel jene schreckte, welche auf sich selbst vertrauen und ihrem Fleische schmeicheln, aber auch Jesus selbst, als er fastete, sich versuchen ließ und den Versucher überwand. Etwas Schönes ist es um das Beten und Wachen. Gott möge dich davon überzeugen, da er wachte und betete, ehe er litt. Schön ist Keuschheit und Jungfräulichkeit. Lasse dich von Paulus belehren, der darüber Anweisungen gibt und über Ehe und Ehelosigkeit entscheidet, aber auch von Jesus selbst, der von einer Jungfrau geboren werden wollte, um einerseits die Geburt zu ehren, anderseits die Jungfräulichkeit zu bevorzugen. Schön ist Enthaltsamkeit. Davon möge dich David überzeugen, der, obwohl er Wasser aus der Zisterne von Bethlehem erhalten hatte, doch nicht trank, sondern das Wasser ausgoß, da er nicht mit fremdem Blute seinen eigenen Durst befriedigen wollte.</p><p>Schön ist ein Leben in Abgeschiedenheit und Ruhe. Dies lehrt mich Elias auf dem Berge Karmel, Johannes in der Wüste oder Jesus auf dem Berge, auf den er sich bekanntlich oftmals zurückzog, um in der Einsamkeit mit sich zu verkehren. Schön ist Armut. Dies zeigt mir Elias, der bei einer Witwe sich erholte, Johannes, der sich mit Kamelhaaren bedeckte, Petrus, der, um sich zu nähren, um ein As Lupinen kaufte. Schön ist Demut. Die Beispiele hiefür sind zahlreich und überall zu finden. Vor allem ist zu erwähnen, daß der Erlöser und Herr aller sich nicht nur „bis zur Knechtsgestalt erniedrigte, nicht nur sein Antlitz der Schmach des Anspeiens aussetzte und, obwohl er die Welt von Sünden reinigte, „Sündern gleichgehalten wurde“, sondern auch wie ein Sklave den Jüngern die Füße wusch. Schön ist die völlige Besitzlosigkeit und die Verachtung des Geldes, wie uns Zachäus und Christus selbst beweisen. Jener gab, als Christus bei ihm einkehrte, fast alles zum Opfer hin; dieser aber erklärte dem Reichen, in solchem Verhalten liege die Vollkommenheit. Und ― um mich kürzer zu fassen ― etwas Schönes ist es um die Betrachtung, etwas Schönes um die Betätigung. Die Betrachtung erhebt von der Erde und strebt zum Allerheiligsten und führt unseren Geist zu dem, was ihm verwandt ist; die Betätigung aber nimmt Christum auf, dient ihm und macht die Liebe in Werken kund.</p><p>Jede der genannten Tugenden bildet* einen* Weg zum Heile und in irgend eine der ewigen, seligen Wohnungen. Wie es verschiedene Lebensberufe gibt, so gibt es bei Gott viele Wohnungen, welche je nach dem Verdienste des Einzelnen verteilt und zugewiesen werden. Mag einer diese oder jene Tugend, mag einer mehrere oder ― wenn es möglich sein sollte ― alle Tugenden pflegen, auf jeden Fall bleibe er nicht stehen, strebe vorwärts und trete in die Fußstapfen des kundigen sicheren Führers, welcher auf engem Wege und durch schmale Pforte auf die breiten Gefilde der himmlischen Seligkeit geleitet. Wenn wir es Paulus und Christus selbst glauben müssen, daß die Liebe das erste und größte Gebot, der Hauptinhalt des Gesetzes und der Propheten ist, dann erkläre ich die Liebe zur Armut, das Mitempfinden und Mitleiden mit dem Nächsten als die größte Liebe. Durch gar nichts wird ja Gott so sehr geehrt wie durch Mitleid. Denn nichts ist Gott eigentümlicher als das Erbarmen, da „vor ihm Mitleid und Wahrheit einherschreiten“ und ihm Erbarmen lieber ist als Verurteilung. Der, welcher gerecht vergilt und sich nach der Wage und nach den Gewichten erbarmt, schenkt seine Liebe keinem so sehr wie dem Barmherzigen.</p><p>[Forts. v. ] Unser Herz müssen wir allen Armen öffnen, gleichviel aus welchen Gründen sie in Not sind; denn das Gebot verlangt, sich zu freuen mit den Fröhlichen und zu weinen mit den Weinenden. Als Menschen müssen wir in zuvorkommender Weise Liebesdienste den Mitmenschen tun, mögen sie deren bedürfen, weil sie verwitwet oder verwaist sind oder weil sie aus dem Vaterlande verbannt sind, oder wegen der Grausamkeit der Herren, der Härte der Beamten, der Unbarmherzigkeit der Steuereinnehmer, der Blutgier der Räuber, der Habgier der Diebe oder wegen Konfiskation oder wegen Schiffbruch. Sie alle sind in gleicher Weise mitleidswert und blicken zu unseren Händen auf wie wir zu den Händen Gottes, so oft wir etwas brauchen. Von jenen Unglücklichen sind die, welche unverdienter Weise zu leiden haben, noch mitleidenswerter als die, welche an das Unglück gewöhnt sind. Ganz besonders müssen wir unser Herz denen öffnen, welche von der heiligen Krankheit zugrunde gerichtet worden sind, selbst an Fleisch, Knochen und Mark ― nach einer Drohung ― zerfressen werden und von ihrem armseligen, schwachen, treulosen Körper verraten sind. Es entzieht sich meiner Kenntnis, wie ich mit diesem Fleische zusammengespannt worden war und wie ich, ein Ebenbild Gottes, mit dem Staube vermengt werde. Geht es dem Körper gut, dann führt er Krieg; wird er bekämpft, dann leidet er. Ich liebe ihn, weil er mein Mitsklave ist; ich wende mich von ihm ab, weil er mein Feind ist. Da er meine Fessel ist, fliehe ich ihn; da er mein Miterbe ist, verehre ich ihn. Wenn ich mich bemühe, ihn kaltzustellen, dann fehlt mir der Gehilfe, den ich brauche, um zum herrlichen Ziel zu gelangen; denn ich weiß, wozu ich erschaffen bin, und weiß, daß ich nur durch irdische Betätigung zu Gott emporsteigen kann.</p><p>Ich behandle ihn mit Nachsicht, da er mein Genosse ist. Aber ich weiß nicht, wie ich seinen Angriffen entgehen kann oder wie ich, wenn ich, von seinen Fesseln beschwert, niedergedrückt oder auf dem Boden niedergehalten werde, es machen soll, um nicht von Gott abzufallen. Der Körper ist ein freundlicher Feind und ein feindlicher Freund. Man fühlt sich verbunden und abgestoßen. Was ich fürchte, umarme ich, und was ich liebe, fürchte ich. Noch ehe ich den Kampf beginne, versöhne ich mich; noch ehe ich Frieden schließe, beginne ich die Feindschaft. Was will die Weisheit mit mir? Was für ein großes Geheimnis beobachten wir hier? Beabsichtigt etwa Gott, dessen Anteil wir sind und von dessen Höhen wir stammen, uns im Kampf und Streit mit dem Körper ständig zu zwingen, auf ihn zu schauen, und uns durch die mit uns verbundene Schwachheit zum Idealismus anzuhalten, damit wir nicht wegen unserer Menschenwürde uns hochmütig erheben und nicht den Schöpfer verachten und damit wir es einsehen, daß wir zugleich sehr hoch und sehr tief stehen, irdische und himmlische, vergängliche und unsterbliche Geschöpfe sind, Erben des Lichtes und des Feuers oder auch der Finsternis, je nachdem wir uns entscheiden. In genannter Weise sind Seele und Körper meines Erachtens zu dem Zwecke zusammengemischt, daß, wenn wir auf unsere Ebenbildlichkeit stolz sind, der Staub uns niederdrücke. Darüber mag jeder denken, wie er will; wir werden uns bei gegebener Gelegenheit noch darüber aussprechen.</p><p>Brüder, was ich mir in meiner schmerzlichen Erregung über meine fleischliche Natur und aus Mitleid mit fremden Schmerzen zu sagen vorgenommen habe, wollen wir nun tun: Pflegen wir den Genossen und Mitsklaven! Wenn ich ihn auch wegen seiner Sündhaftigkeit angeklagt habe, so will ich mich doch seiner wie eines Freundes annehmen um dessen willen, der ihn mit meiner Seele verbunden hat. Ebenso wie für den eigenen Körper müssen wir für den Leib des Nächsten sorgen, mag er gesund sein oder ebenfalls an Krankheit dahinsiechen. Denn alle „sind wir eins in Christus“, ob reich oder arm, ob Sklave oder Freie, ob gesund oder krank; und einer ist das Haupt aller, Christus, von dem alles kommt. Was ein Körperteil dem anderen ist, ist der eine Mensch dem anderen, sind alle allen. Ereilt jemanden früher als uns das allgemeine Schicksal, krank zu werden, dann wollen wir ihm also unsere Aufmerksamkeit und unsere Sorge nicht entziehen. Die Freude über unser körperliches Wohlbefinden darf nicht größer sein als der Schmerz über das Elend der Brüder. In der Bruderliebe müssen wir die einzige Voraussetzung für unser leibliches und seelisches Wohl erblicken. Beginnen wir unsere Erwägungen!</p><p>Manche verdienen unser Mitleid nur, weil sie arm sind; hier können vielleicht die Zeit, die Arbeit, ein Freund, ein Verwandter, veränderte Verhältnisse helfen. Andere sind ebenso, wenn nicht noch mehr mitleidswert, soferne sie infolge von Arbeitslosigkeit der notwendigen leiblichen Mittel beraubt sind und ihre Furcht vor dem Zusammenbruch immer noch größer ist als die Hoffnung auf Besserung der Verhältnisse, so daß ihnen die Hoffnung, das einzige Heilmittel für Unglückliche, wenig Hilfe bringen kann. Ein weiteres Übel, außer der Armut, ist die Krankheit; sie ist das gefürchtetste und schlimmste Übel, das von vielen auch bei Flüchen zunächst angewünscht wird. Ein drittes Übel besteht darin, daß man nicht besucht und nicht angeschaut werden darf, daß man geflohen und verabscheut wird und als Ekel gilt; noch schlimmer als die Krankheit selbst ist das Gefühl, wegen eines Unglückes auch noch gehaßt zu werden. Ihr Leiden verursacht mir Tränen, und schon die Erinnerung daran erschüttert mich. Möchtet ihr von gleichen Stimmungen ergriffen sein, damit eure Tränen euch den Tränen entreißen! Ich weiß aber auch, daß von den Anwesenden alle jene meine Empfindungen teilen, welche Christum und die Armut lieben und welchen Gott ein Herz geschenkt hat. An bitteren eigenen Erfahrungen fehlt es euch ja nicht.</p><p>Mit eigenen Augen schauen wir ein schreckliches, erbarmungswürdiges Schauspiel, das nur der glaubt, der es selbst gesehen hat. Da sind Tote und Lebende, an den meisten Gliedern in einer Weise verstümmelt, daß man kaum erkennt, wer sie einmal waren oder woher sie stammen. Es sind eigentlich nur noch elende Überreste gewesener Menschen. Um erkannt zu werden, müssen sie Vater, Mutter, Geschwister, Heimat angeben und erklären: „So und so heißt mein Vater und meine Mutter, und dies ist mein eigener Name und du warst einst mein Freund und mein Verwandter.“ So sprechen sie, da sie ja nichts Charakteristisches mehr an sich haben. Sie sind verunstaltete Menschen, die ihres Vermögens, ihrer Verwandten, ihrer Freunde, selbst ihres Körpers beraubt sind. Es sind die einzigen Menschen, welche sich bemitleiden und zugleich hassen. Sie wissen nicht, sollen sie diejenigen Körperteile mehr beklagen, die sie nicht mehr haben, oder diejenigen, welche ihnen noch geblieben sind, diejenigen, welche die Krankheit bereits aufgezehrt hat, oder diejenigen, welche für die Krankheit noch übrig geblieben sind. Die einen Glieder sind unter großen Schmerzen verzehrt worden; die anderen bleiben noch größeren Martern erhalten. Die einen sind dahingeschwunden, ehe sie das Grab schauen; die anderen wird niemand bestatten. Mag einer noch so gut und barmherzig sein, für diese Krankheit hat er absolut kein Herz; ihnen gegenüber allein haben wir vergessen, daß wir Fleisch sind und daß wir von einem erbärmlichen Körper umgeben sind. Wir sind so weit entfernt, unsere (aussätzigen) Verwandten zu pflegen, daß wir vielmehr glauben, wir seien in Sicherheit, wenn wir vor ihnen fliehen. Während man zu einem schon älteren Leichnam, der vielleicht bereits riecht, hingeht und den stinkenden Kadaver vernunftloser Tiere erträgt und es sich gefallen läßt, ganz beschmutzt zu werden, fliehen wir schleunigst in aller Herzlosigkeit vor den Aussätzigen, fast unwillig darüber, daß wir die gleiche Luft wie sie einatmen.</p><p>Wer ist anhänglicher als ein Vater? Wer besorgter als eine Mutter? Aber auch ihr natürliches Empfinden hat Grenzen. Den Sohn, den der Vater erzeugt und erzogen hat, den er als seinen Augapfel erklärt, für den er schon oft und viel zu Gott gebetet hat, beklagt er zwar (wenn er von Aussatz befallen wird), aber gleichwohl jagt er ihn davon, teils freiwillig, teils gezwungen. Und eine Mutter gedenkt ihrer Schmerzen bei der Geburt (des nun an Aussatz erkrankten Kindes), ihr Herz zerreißt, erschütternd schreit sie zum Himmel, und ihr noch lebendes Kind, das sie ausgesetzt hat, beweint sie, wie wenn es schon gestorben wäre. „Armes Kind einer unglücklichen Mutter, ― ruft sie ― die Krankheit war so grausam, mein Recht auf dich mit mir zu teilen! O bedauernswertes Kind, o Kind, nicht mehr bist du zu erkennen, o Kind, nur mehr für Schluchten, für Berge, für Wüsten habe ich dich erzogen! Bei den Tieren wirst du hausen, Felsen werden dein Schutz sein. Nur noch die heiligsten unter den Menschen werden dich sehen.“ Die Wehrufe Jobs macht sie sich zu eigen: „Warum wurdest du im Mutterschoße gebildet? Warum hast du den Schoß verlassen? Warum bist du nicht sofort gestorben? Warum sind sich nicht Tod und Geburt begegnet? Warum bist du nicht vor der Zeit abgegangen, ehe du noch die Leiden des Lebens kosten konntest? Warum hat dich der Schoß aufgenommen? Wozu hast du an den Brüsten gesogen, da du doch in Elend leben und ein Leben, das schlimmer ist als der Tod, führen sollst?“ So klagt sie unter Strömen von Tränen. Auch umarmen möchte die Unglückliche ihr Kind, aber vor seinem Körper fürchtet sie sich, in ihm erblickt sie einen Feind. Nicht Verbrecher, sondern diese Aussätzigen werden vom ganzen Volke verflucht und verfolgt. Ist einer ein Mörder, dann wohnt man noch mit ihm zusammen, und mit einem Ehebrecher teilt man Haus und Tisch, einen Kirchenräuber macht man zum Freunde seines Lebens, und mit denen, die einem Böses angetan haben, schließt man ein Bündnis; aber von dem Leiden eines Menschen, der einem kein Unrecht getan hat, wendet man sich ab, als wäre es ein Verbrechen. Besser ist ein Verbrecher daran als ein Kranker. Den Herzlosen umarmen wir wie einen Edelmann; den Barmherzigen aber verachten wir wie einen Schuldbeladenen.</p><p>Die Aussätzigen werden aus den Städten vertrieben, aus den Häusern, von den Marktplätzen, den Versammlungen, den Straßen, den Festlichkeiten und Gelagen und selbst ― welch ein Jammer! ― vom Wasser werden sie weggejagt. Nicht haben sie mit den übrigen Menschen Anteil an den sprudelnden Quellen; auch die Flüsse sollen von ihnen angesteckt werden. Das Ungeheuerlichste ist, daß wir sie wie Schuldbeladene fortjagen, sie dann aber wieder wegen ihrer Schuldlosigkeit an uns locken, allerdings ohne ihnen Wohnung oder die nötigen Nahrungsmittel oder ihren Wunden Heilungsmittel anzubieten, und ohne den Kranken nach Kräften schützende Kleidung zu gewähren. Tag und Nacht irren sie umher, arm und nackt und ohne Unterkunft. Ihre Krankheit tragen sie zur Schau, erzählen, wer sie einst waren, flehen zum Schöpfer. Mit ihren Gliedern helfen sie sich gegenseitig in ihrer Not aus. Sie ersinnen Lieder, um Mitleid zu wecken. Sie betteln um ein Stücklein Brot, um ein bißchen Fleisch und um einen zerlumpten Fetzen, damit sie ihre Blöße und ihre Geschwüre bedecken können. Als mitleidig gilt nicht der, welcher ihre Not lindert, sondern schon der, welcher sie nicht hart abweist. Die meisten der Kranken scheuen sich nicht einmal, die Festversammlungen zu besuchen; ihre Not treibt sie im Gegenteil geradezu in dieselben hinein. Ich rede hier von jenen öffentlichen, heiligen Versammlungen, welche wir aus seelischen Bedürfnissen eingeführt haben zur Feier eines Geheimnisses oder wegen der Märtyrer, um durch Verehrung ihres Martyriums ihre Tugenden nachzuahmen. Da sie doch auch Menschen sind, schämen sich die Aussätzigen einerseits, in ihrem Elende vor Menschen zu erscheinen, und möchten am liebsten im Gebirge, in Schluchten und Wäldern und schließlich in Nacht und Finsternis verschwinden; doch anderseits treibt es diese elenden Jammergestalten (immer wieder) unter die Menschen. Und das ist wohl recht so. Denn sie sollen uns an unsere Schwachheit erinnern und davor bewahren, daß wir uns an die Gegenwart und das Sinnliche halten, als wenn es immer Bestand hätte. Die einen treibt es zu uns, um eine menschliche Stimme zu hören, die anderen, um ein menschliches Angesicht zu sehen, andere, um von denen, die im Überfluß leben, eine kleine Gabe zur Fristung des Lebens zu erhalten; alle kommen sie, um durch Offenbarung ihres Leids Linderung zu finden.</p><p>[Forts. v. ] Wer wird nicht erschüttert bei den Klagetönen ihrer Trauerchöre? Wer kann solches mit anhören, solches mit ansehen? Dort liegen die einen, durch die Krankheit schmachvoll vereinigt, beisammen, und jeder erzählt, um Mitleid zu finden, von seinem Elend etwas anderes. Gegenseitig erschweren sie sich noch ihr Schicksal; sind sie bedauernswert wegen ihres Leidens, so sind sie es noch mehr wegen ihres Mitleidens. Eine bunte Menge umsteht sie gaffend, um mit ihnen zu klagen ― auf einige Zeit. Dort schleppen sich andere zu den Füßen der Menschen trotz Sonne und Staub, manchmal auch trotz heftiger Kälte und Regengüsse und stürmischer Winde; nur unserem Ekel von ihnen verdanken sie es, wenn sie von unseren Füßen nicht getreten werden. Auf unsere heiligen Gesänge in der Kirche respondieren sie mit schmerzlichen Bitten, und auf unsere geistlichen Lieder ist ihre Antwort: ergreifendes Wehgeschrei. Wozu soll ich euch, die ihr in festlicher Stimmung gekommen seid, all ihr Elend schildern? Vielleicht würde ich euch zu Tränen rühren, wenn ich über all ihre Not genau berichten würde, und der Schmerz würde die Festfreude verderben. Ich weiß ja, daß ich euch noch nicht dazu überreden könnte, gelegentliche Leiden höher als Freuden, Traurigkeit höher als Festesstimmung, lobenswerte Tränen höher als unschönes Lachen einzuschätzen.</p><p>Dies ist das Los der Aussätzigen. Ja, es ist noch schlimmer, als ich es geschildert habe. Sie aber sind ― ob ihr es wollt oder nicht ― unsere Brüder vor Gott. Sie haben die gleiche Natur wie wir empfangen; sie sind aus der gleichen Erde gebildet, aus der wir zu Beginn erschaffen worden waren. Gleich uns sind sie aus Muskeln und Knochen zusammengesetzt; wie alle sind sie mit Haut und Fleisch umkleidet, wie einmal der treffliche Job in seinen Betrachtungen über das Leiden erklärt, um unsere sinnliche Natur bloßzustellen. Sie haben ― um noch mehr zu sagen ― sogar wie wir das göttliche Ebenbild erhalten und bewahren es vielleicht besser als wir, trotzdem sie äußerlich zugrunde gehen. Sie haben innerlich denselben Christus angezogen und sind mit dem gleichen Unterpfand des Geistes betraut worden wie wir. Sie haben an den gleichen Gesetzen, Lehren, Verträgen, Versammlungen, Geheimnissen, Hoffnungen teil wie wir. Auch für sie ist Christus gestorben, der die Sünden der ganzen Welt hinweggenommen hat. Mit Christus sind sie Erben des himmlischen Lebens, mögen sie auch von diesem Leben gar nichts haben. Mit Christus werden sie begraben und mit ihm werden sie auferstehen, „soferne sie nur mit ihm leiden, um auch mit ihm verherrlicht zu werden“.</p><p>Was haben nun wir zu tun, die wir den großen, neuen Namen geerbt haben und uns nach Christus bezeichnen, wir, „das heilige Geschlecht, das königliche Priestertum, das überragende, auserwählte Volk, das nach guten, heilsamen Werken strebt, die Jünger des sanften, barmherzigen Christus, der unsere Schwachheiten auf sich genommen, sich bis zu unserem Staube erniedrigt und sich unsertwegen der Armut dieses Fleisches und des irdischen Zeltes unterworfen hat, der aus Liebe zu uns leiden und dulden wollte, damit wir durch seine Gottheit reich würden. Was ist unsere Aufgabe gegenüber einem solchen Vorbilde der Herzensgüte und des Mitleids? Was sollen wir über die Aussätzigen denken und was sollen wir ihnen gegenüber tun? Dürfen wir sie verachten, vernachlässigen? Sollen wir sie verlassen wie Tote, wie Geächtete, wie äußerst gefährliche Schlangen und andere Tiere? Durchaus nicht, meine Brüder! Dies entspräche nicht unserer Würde als Zöglinge Christi, des guten Hirten, der das Verirrte zurückführt, das Verlorene aufsucht, das Schwache stärkt. Dies entspräche aber auch nicht unserer menschlichen Natur, welche, da sie von gleichem Elende bedroht ist, zu Güte und Barmherzigkeit erzogen wird und Mitleid zum Gesetze gemacht hat.</p><p>[Forts. v. ] Sollen wir, während diese unter freiem Himmel dahinsiechen, in glänzendsten, mit verschiedenen Steinen geschmückten Häusern wohnen, welche in Gold und Silber, in Mosaik und bunten Gemälden leuchten und die Augen durch den Reiz täuschen? Sollen wir solche Häuser bewohnen? Sollen wir sie bauen? Doch für wen? Wir bauen sie vielleicht gar nicht für unsere Erben, sondern für Fremde und Ausländer, welche uns wohl nicht einmal lieben, sondern, was das schlimmste ist, uns mit all ihrem Hasse und Neide verfolgen. Während die Aussätzigen in abgenutzten, zerrissenen Lumpen frieren und vielleicht selbst daran Mangel leiden, sollen wir in weichen, wallenden Kleidern und in luftigen Geweben aus Leinen und Seide schwelgen, von welchen die einen nicht so sehr ein Schmuck als vielmehr eine Schande sind, als was ich alles Überflüssige und Unnütze bezeichne, und von welchen die anderen in Kästen aufbewahrt werden, um uns unnütze, zwecklose Sorgen zu machen und von Motten und der alles tilgenden Zeit verschlungen zu werden? Selbst die notwendige Nahrung fehlt jenen. Hier Schwelgerei, dort Elend! Vor unseren Türen liegen sie, erschöpft und hungrig. Ihr Körper hat nicht die Kraft, zu betteln. Es mangelt ihnen die Stimme, um zu klagen. Es fehlen ihnen die Hände, um zu flehen, die Füße, um da hinzugehen, wo man etwas hat, die Kraft der Lunge, um ihre Klagelieder ertönen zu lassen. Das schwerste Unglück nehmen sie am leichtesten: für ihre Blindheit sind sie dankbar, weil sie ihnen ihr Elend verhüllt.</p><p>Während jene in solchem Elend leben, sollen wir in aller Pracht auf hohem, erhabenem Lager mit reichlichen Decken, die man nicht berühren darf, ruhen, um uns schon aufzuregen, wenn wir nur die flehende Stimme der Kranken vernehmen? Unser Boden muß von Blumen duften, oftmals selbst dann, wenn nicht die Zeit der Blumen ist. Unser Tisch muß mit den wohlriechendsten kostbarsten Salben übergossen sein, damit wir noch mehr verweichlicht werden. Knaben müssen aufwarten. Die einen von ihnen stehen in Reih und Glied, nach Mädchenart tragen sie langes Haar und Simpelfransen und sind selbst lüsternen Augen zuviel geschmückt. Andere halten so zierlich und zugleich so sicher als nur möglich mit ihren Fingerspitzen die Becher oder erregen geschickt über den Häuptern mit ihren Fächern Lüftchen und durch die Bewegung ihrer Hände den Fleischmassen Abkühlung. Ferner muß die Tafel mit Speisen überladen sein; alle Elemente, Luft, Erde und Wasser müssen uns reichlich ihre Gaben spenden. Wir wollen von den Kunstwerken der Köche und Speisemeister erdrückt werden; um die Wette sollen sich alle bei dem gierigen, undankbaren Magen einschmeicheln, bei dieser schwerfälligen Last, dem Unheilstifter, dem unersättlichen, unverlässigsten Tiere, das zugleich mit den verdauten Speisen dem Untergange geweiht ist. Während die Aussätzigen es als Glück betrachten würden, wenigstens genug Wasser zu haben, trinken wir Wein bis zur Betrunkenheit und in unserer Ausschweifung noch darüber hinaus und weisen die einen Weine zurück, um andere wegen ihrer Blume anzuerkennen und sie weise zu loben und es als Mangel zu bezeichnen, wenn nicht außer den einheimischen Weinen gleichsam als Krone des Ganzen noch eine berühmte ausländische Marke vorgesetzt wird. Wir wollen Feinschmecker und Lebemenschen sein oder heißen und schämen uns fast, wenn wir nicht als schlecht oder nicht als Sklaven der Bäuche und anderer Organe gelten.</p><p>Warum wollen wir solches Leben, meine Freunde und Brüder? Warum leiden wir unserseits seelisch an einer Krankheit, die noch viel schlimmer ist als körperliches Leiden? Die eine Krankheit ist doch unfreiwillig, die andere aber freiwillig; die eine hat mit diesem Leben ihr Ende, die andere begleitet uns, wenn wir diese Welt verlassen; die eine findet Mitleid, die andere Haß ― wenigstens bei den Verständigen. Warum helfen wir nicht der Natur, solange wir noch Zeit haben? Warum bedecken wir, die wir doch selbst Fleisch sind, nicht die Not des Fleisches? Warum schwelgen wir beim Unglück der Brüder? Es sei mir ferne, mich zu bereichern, während diese darben, oder mich wohl zu fühlen, solange ich ihre Wunden nicht lindern kann, oder mich zu sättigen und einzuhüllen und mich gemütlich unter einem Dache niederzulassen, solange ich ihnen nicht Brot, genügend Kleidung und Erholung unter meinem Dache geben kann. Entweder müssen wir alles Christus zu Liebe hingeben, um mit dem Kreuze beladen, ihm aufrichtig zu folgen und leicht und frei, von nichts niedergedrückt, in den Himmel zu folgen und, durch Demut erhöht und durch Armut bereichert, gegen alles Christus einzutauschen; oder wir müssen unseren Besitz mit Christus teilen, um ihn durch Anteilnahme der Armen zu einem guten Besitz zu machen und so ihn gewissermaßen zu heiligen. Für mich mag ich säen, doch andere sollen mit mir die Früchte teilen. Mit Job will auch ich das Wort sprechen: „Statt Weizen mögen Disteln, statt Gerste Dornen bestimmt sein“; versengender Wind möge kommen und Wirbelsturm möge meine Arbeiten erfassen, so daß ich mich umsonst geplagt habe; noch in dieser Nacht soll meine Seele von mir gefordert werden, auf daß ich Rechenschaft gebe wegen meiner Habsucht, wenn ich Scheunen baue und Schätze sammle für den Mammon!</p><p>Sollen wir nicht endlich einmal zur Besinnung kommen? Wollen wir nicht unsere Gefühllosigkeit ― um nicht zu sagen: unsere Herzlosigkeit ― ablegen? Wollen wir nicht ernstlich erwägen, was es um den Menschen ist? Wollen wir nicht infolge der Leiden der Mitmenschen unsere eigene Sache richtig bestellen? Alles Menschliche ist seinem Wesen nach unbeständig, wankend, ungenügend, veränderlich. Unser ganzes Leben dreht sich wie im Kreise und verändert sich bald nach dieser Richtung, bald nach jener, oft an einem einzigen Tage, manchmal schon in einer einzigen Stunde. Eher kann man den unsicheren Winden und den Spuren eines Meerschiffes und den täuschenden, kurzen Träumen der Nacht und den Sandzeichnungen spielender Kinder vertrauen als dem Glücke der Menschen. Weise sind die, welche aus Mißtrauen gegenüber der Gegenwart in der Zukunft Schätze suchen und wegen der Unbeständigkeit und Unsicherheit des menschlichen Glückes die Barmherzigkeit lieben, die nicht zu Fall kommt. Von drei Vorteilen gewinnen sie auf jeden Fall wenigstens einen: Entweder geht es ihnen immer gut, da Gott oft die Frommen auch mit irdischen Gütern beschenkt, um durch seine Güte zum Mitleid aufzufordern, oder, wenn es ihnen schlecht geht, finden sie Trost und Kraft in Gott, da nicht Sündhaftigkeit, sondern Gottes Ratschluß ihr Leid veranlaßt hat, oder endlich sie haben das Recht, von den Glücklichen Barmherzigkeit zu fordern, da sie selbst, als sie noch glücklich waren, den Notleidenden Barmherzigkeit erwiesen hatten.</p><p>„Nicht rühme sich der Weise seiner Weisheit, sagt der Prophet, noch der Reiche seines Reichtums, noch der Starke seiner Kraft,“ mögen sie auch den Gipfel der Weisheit oder des Reichtums oder der Macht erstiegen haben! Ich will noch die weiteren Mahnungen beifügen: Nicht rühme sich der Berühmte seines Ruhmes, nicht der Gesunde seiner Gesundheit, nicht der Schöne seiner Gestalt, nicht der junge Mensch seiner Jugend, nicht ― um es kurz zu sagen ― rühme sich einer in dem, was der Welt rühmenswert erscheint! „Wer sich rühmt, rühme sich allein Gott zu kennen“ und ihn zu suchen, mit den Leidenden Mitleid zu haben und sich Schätze für die Zukunft zu sammeln! Während das Übrige unbeständig und vergänglich ist und wie im Würfelspiel bald diesem, bald jenem zufällt und keiner es so sehr besitzt, daß er es nicht mit der Zeit oder infolge von Mißgunst verlieren könnte, sind diese Vorzüge beständig und bleibend, ohne jemals im Stiche zu lassen und zu entschwinden und die Hoffnungen zu täuschen. Alle irdischen Güter scheinen mir deshalb unverlässig und undauerhaft zu sein, damit wir nach einer ― wenn irgendwo, gerade hierin ― trefflichen Einrichtung des schöpferischen Logos und der alle Vernunft übersteigenden Weisheit durch die sichtbaren Dinge, wenn sie bald diesen, bald jenen Wechsel erleiden, sich auf und nieder bewegen und drehen und, noch ehe sie erfaßt werden, schon wieder entrinnen und entfliehen, verhöhnt und verspottet werden und durch Erkenntnis ihrer Unbeständigkeit und Unsicherheit uns veranlaßt sehen, uns der Zukunft zuzuwenden. Hätte unser Glück Bestand, was wäre denn die Folge gewesen, da wir ja doch, trotz der Unbeständigkeit des Glückes, schon so sehr an ihm hängen und uns von den Freuden und Täuschungen des Glückes so sehr knechten lassen, daß wir dieses Leben für das beste und höchste halten, obwohl wir doch gelernt haben und es glauben, daß wir nach Gottes Ebenbild, das im Himmel ist und zu sich hinaufzieht, erschaffen worden sind.</p><p>„Wer ist weise und wird dies verstehen?“ Wer eilt an dem Vergänglichen vorüber? Wer hält sich an das, was bleibt? Wer glaubt an das Schwinden der Gegenwart und an den Bestand dessen, was wir hoffen? Wer unterscheidet Sein und Schein, um dem einen zu folgen und das andere zu verachten? Wer hält auseinander Bild und Wahrheit, irdische Wohnung und himmlische Stadt, Fremde und Heimat, Finsternis und Licht, Schmutz des Abgrundes und heiliges Land, Fleisch und Geist, Gott und weltliche Herrscher, Todesschatten und ewiges Leben? Wer erkauft mit der Gegenwart die Zukunft, mit dem vergänglichen Reichtum den unvergänglichen, mit dem Sichtbaren das Unsichtbare? Selig, wer hier auseinanderzuhalten und zu scheiden vermag durch das Schwert des Geistes, welches das Bessere von dem Minderen trennt. „Er bereitet Aufstiege in seinem Herzen“, wie irgendwo der treffliche David sagt. Er entkommt so gut wie möglich diesem Tränentale und sucht das, was oben ist. Mit Christus ist er der Welt gekreuzigt, steht mit Christus auf und fährt mit Christus zum Himmel als Erbe eines nicht mehr vergänglichen und trügerischen Lebens, wo keine bissige Schlange mehr auf dem Wege ist, die der Ferse nachstellt und deren Haupt zertreten wird. Der erwähnte David bezeichnet als Herold mit gewaltiger Stimme von hoher, öffentlicher Warte uns Überlebende als schwerfällige Menschen, welche die Lüge lieben, und gibt uns die schöne Mahnung, wir sollen uns nicht allzusehr an das Sinnliche halten und nicht glauben, in der Sättigung mit vergänglichem Getreide und Weine oder in Niederem liege all unser irdisches Glück. Den gleichen Gedanken vertritt wohl auch der selige Michäas, wenn er gegen die auf dem Boden kriechenden, scheinbaren Güter predigt und erklärt: „Nahet euch den ewigen Bergen! Stehe auf und wandle; denn nicht hier ist deine Ruhe!“ Es sind dies fast die gleichen Worte, welche unser Herr und Erlöser sprach, als er aufforderte: „Steht auf! Wir wollen von hier gehen!“ Mit diesen Worten hat Jesus nicht, wie man glauben könnte, nur die Jünger seiner Zeit von einem bestimmten Platze abgerufen, sondern er zieht damit stets alle seine Jünger von der Erde und dem irdischen Wege zum Himmel und dem Himmlischen hin.</p><p>Hören wir also nunmehr auf den Logos! Suchen wir unsere Ruhe im Jenseits! Werfen wir die Schätze dieses Lebens von uns! Was an ihnen gut ist, wollen wir uns allein aneignen. Durch Almosen wollen wir unsere Seele retten. Von unserem Besitze wollen wir den Armen mitteilen, um im Jenseits reich zu werden. Gib auch der Seele etwas, nicht bloß dem Leibe! Gib auch Gott etwas, nicht bloß der Welt! Entziehe etwas dem Bauche und weihe es dem Geiste! Raube etwas dem Feuer und bewahre es in Sicherheit ferne von dem verzehrenden Feuer der Hölle! Entreiße es dem Tyrannen und vertraue es dem Herrn an! „Gib Anteil den Sieben,“ d. i. diesem Leben, „aber auch den Acht“, d. i. dem Leben, das uns später aufnehmen wird! Gib dem, von dem du vieles hast! Gib alles dem, der dir alles geschenkt hat! Niemals wirst du Gott an Freigebigkeit übertreffen, wenn du auch alles hingibst und dich dazu. Gott sich hinzugeben, selbst dies ist ja ein Geschenk Gottes. Wieviel du auch opfern magst, immer ist das noch mehr, was dir übrigbleibt. Und nichts von dem, was du schenkst, gehört dir; denn alles hast du von Gott. Wie es unmöglich ist, über seinen eigenen Schatten hinaus zu kommen, da er, sooft wir vorwärts gehen, nachschleicht, bzw. immer vorauseilt, und wie die Körpergröße sich nicht über das Haupt erheben kann, da es stets den Körper überragt, so können wir Gott nicht durch unsere Geschenke überbieten. Denn nicht geben wir etwas, was ihm nicht gehört; nicht übertreffen wir seine Freigebigkeit.</p><p>Erkenne es, wer es dir gegeben hat, daß du bist, daß du atmest, daß du denkst, daß du ― was das Höchste ist ― Gott erkennst, daß du das himmlische Reich, die Gleichstellung mit den Engeln, das Schauen der Herrlichkeit erhoffest, welches jetzt noch in Spiegeln und Rätseln erfolgt, dereinst aber vollkommener und reiner sein wird! Erkenne, wer es dir gegeben hat, daß du Gottes Sohn, Erbe Christi und ― um ein kühnes Wort zu gebrauchen ― Gott selber bist! Woher kommt dir all das, wer hat es dir gegeben? Oder ― um von dem Geringeren und dem Sichtbaren zu reden ― wer hat dir die Möglichkeit gegeben, zu schauen die Schönheit des Himmels, den Wandel der Sonne, die Scheibe des Mondes, die Zahl der Sterne, die hier überall sich offenbarende, der Leier gleiche Harmonie und Ordnung, den Ablauf der Stunden, den Wechsel der Jahreszeiten, den Kreislauf der Jahre, die gleiche Verteilung von Tag und Nacht, die Erzeugnisse der Erde, das Luftmeer, die weite Fläche des bald entfesselten, bald ruhigen Meeres, die Tiefe der Flüsse, die Strömungen der Winde? Wer gab dir die einen Tiere zur Zähmung und Dienstbarmachung, die anderen zur Nahrung? Wer hat dich zum Herrn und König über die ganze Erde aufgestellt? Wer hat ― um nicht auf Einzelheiten einzugehen ― den Menschen den Vorrang in allem verliehen? Ist es nicht der, welcher jetzt von dir vor allem und für alles Barmherzigkeit verlangt? Nachdem wir von ihm so vieles bereits empfangen haben und noch erwarten, müssen wir uns da nicht schämen, daß wir Gott nicht einmal das eine Opfer, die Barmherzigkeit, bringen wollen? Er hat uns von den Tieren geschieden und uns allein von den irdischen Geschöpfen mit Vernunft ausgezeichnet, wir aber möchten uns zu Tieren machen und sind von der Sinnenlust so sehr verdorben und von solchem Wahnsinn ― oder wie ich mich ausdrücken soll ― ergriffen, daß wir schon, wenn wir nur Gerstenbrei und Kleie haben, mögen sie auch vielleicht nicht einmal ehrlich erworben sein, glauben, wir seien bessere Menschen als die Aussätzigen. Wie es in alter Zeit neben den gewöhnlichen Menschen Riesen gegeben haben soll, so wollen wir gegenüber den Aussätzigen die Riesen und die Übermenschen sein gleich einem Nimrod oder dem Geschlechte des Enak, welches die Israeliten seinerzeit bedrängt hatte, oder gleich denen, durch deren Schuld die Sintflut die Erde vernichtet hatte. Während unser Herr und Gott es nicht verschmäht, sich unseren Vater nennen zu lassen, wollen wir nicht einmal von unseren Verwandten etwas wissen.</p><p>Meine Freunde und Brüder, wir wollen keineswegs schlechte Verwalter der uns anvertrauten Güter sein, auf daß wir nicht die Worte Petri zu hören bekommen: „Schämet euch, fremdes Eigentum zurückzubehalten, ahmet Gottes Gerechtigkeit nach, und keiner wird arm sein.“ Während andere unter der Armut zu leiden haben, wollen wir uns nicht durch Aufhäufen und Aufbewahren von Schätzen Leiden bereiten! Denn nicht soll uns der treffliche Amos die bitteren Vorwürfe und Drohungen zurufen müssen: „Wohlan, die ihr sprechet: Wann ist der Neumond vorüber, um verkaufen zu können; wann ist der Sabbat zu Ende, um unsere Schätze feilzubieten?“ und nicht die weiteren Worte, womit der Prophet den Zorn Gottes denen androht, welche eine große und eine kleine Wage führen. Nicht soll der treffliche Michäas etwa auch an uns die Lüsternheit bekämpfen müssen, denn Überfluß erzeugt Ausgelassenheit. Nicht soll er tadeln müssen, daß wir auf elfenbeinernen Ruhebetten schwelgen, uns mit den besten Salben verweichlichen, uns mit den zartesten Kälbern und den Zicklein von der Weide mästen und der Instrumentalmusik Beifall klatschen, und daß wir gar noch glauben, solches habe Wert und Bestand. Doch vielleicht hält der Prophet solche Genüsse noch nicht für so schlimm, als wenn wir in unserem Wohlleben mit den Leiden Josephs kein Mitleid haben; außer der Unmäßigkeit tadelt er nämlich die Unbarmherzigkeit. Vor solchem Benehmen und solcher Ausschweifung wollen wir uns jetzt hüten, nicht wollen wir also die Güte Gottes verachten, welcher auf solche Weise zum Zorn gereizt wird, mag er auch seinen Zorn der Sünde nicht auf den Fuß und allsogleich folgen lassen.</p><p>Wir wollen dem obersten und ersten Gesetze Gottes folgen. Gott aber läßt über Gerechte und Sünder regnen und über alle in gleicher Weise seine Sonne aufgehen, er hat allen, die auf dem Lande leben, das freie Land, die Quellen, die Flüsse, die Wälder und den Vögeln die Luft, den Wassertieren das Wasser bereitet. Nicht kargend spendete er allen den ersten Lebensunterhalt, der nicht beschlagnahmt, durch kein (menschliches) Gesetz eingeschränkt, nicht abgemessen wird; er hat ihn allen gemeinsam und reichlich und ohne irgendwelchen Abzug gegeben. Er wollte durch die Gleichheit der Gabe die Gleichheit der Geschöpfe betonen; er wollte den Reichtum seiner Güte offenbaren. Wenn aber Menschen Gold und Silber, alle möglichen weichlichen, überflüssigen Kleider und glänzende Edelsteine oder dgl. verwahren, wodurch Kriege, Revolutionen, schlimmste Tyrannei veranlaßt werden, dann heben sie in ihrer Torheit den Kopf hoch, künden armen Verwandten das Mitleid und weigern sich in ihrer Ungeschliffenheit und Albernheit, mit ihrem Überfluß die Not zu unterstützen, dann wollen sie nicht einmal einsehen, daß Armut wie Reichtum, die sog. Freiheit wie die Knechtschaft und derartige Begriffe als gemeinsame Krankheit zugleich mit der Sünde als deren Erfindungen erst später im Menschengeschlechte Eingang erhalten hatten. „Von Anfang an war es jedoch, wie es heißt, nicht so.“ Vielmehr hat der, welcher den Menschen am Anfang erschaffen hatte, ihn frei und selbständig ausgesandt, nur dem Gesetze des Gebotes unterstellt und ihn mit dem Reichtum paradiesischer Wonne ausgestattet; in dem einen ersten Menschen hat er auch dem übrigen Menschengeschlechte diese Gaben bestimmt und geschenkt. Nur dem, der das Gebot hielt, war Freiheit und Reichtum verliehen; der Übertretung aber folgten Armut und Knechtschaft.</p><p>Seitdem Neid und Streitsucht und die listige Gewalt der Schlange, welche stets durch den Reiz der Sinnlichkeit zu verführen und die Stärkeren gegen die Schwächeren aufzustacheln weiß, sich eingeschlichen haben, ist die Einheitlichkeit in Verschiedenheiten zerrissen und der Adel der Natur durch die Habsucht unter Zuhilfenahme despotischer Gesetze zerschnitten. Achte auf die anfängliche Einheit, nicht auf die spätere Zerrissenheit, auf das Gesetz des Schöpfers, nicht auf das des Tyrannen! Hilf, so gut du kannst, der Natur, ehre die ursprüngliche Freiheit, habe acht auf dich selbst, verhülle dem Geschlechte die Schmach, unterstütze die Kranken, tröste die Notleidenden! Bist du gesund und reich, dann lindere die Not des Kranken und Darbenden! Bist du selbst nicht gefallen, dann hilf dem in seiner Not, der gefallen ist und in Bedrängnis lebt! Bist du vergnügt, dann stehe dem Trostlosen bei; bist du mit Gütern gesegnet, dann erbarme dich dessen, der im Unglück schmachtet! Zeige dich Gott dafür dankbar, daß du zu denen gehörst, denen es gut geht, und nicht zu denen, die der Wohltaten bedürfen, daß du nicht auf fremde Hände zu schauen brauchst, sondern vielmehr andere auf die deinigen schauen! Dein Reichtum soll nicht bloß in Hab und Gut, sondern auch in Frömmigkeit, nicht nur in Gold, sondern auch in Tugend, ja eigentlich in dieser allein bestehen! Suche durch Wohltun die Ehre des Nächsten zu übertreffen! Ahme Gottes Erbarmen nach und werde für den Notleidenden ein Gott!</p><p>Durch nichts hat der Mensch so sehr an Gott Anteil als durch das Wohltun, mag der eine auch mehr, der andere weniger Wohltaten spenden; jeder verfährt, wie ich glaube, nach seinen Kräften. Wenn Gott den Menschen erschaffen und nach seiner Verstoßung wieder aufgenommen hat, dann verachte auch du nicht den, der gefallen ist! Gott hat sich des gefallenen Menschen mit vollem Erbarmen angenommen, indem er ihm außer allem anderem das Gesetz (des Moses), die Propheten und zuvor schon als Richter das ungeschriebene Gesetz gegeben hat, um ihn zurechtzuweisen, zu mahnen, zu erziehen, und indem er schließlich sich selbst als Sühnopfer für das Leben der Welt hingegeben und Apostel, Evangelisten, Lehrer und Hirten, ferner Heilungen, Wunder, Rückkehr zum Leben, Befreiung vom Tode, Sieg über den Sieger, einen schattenhaften und einen wahren Bund, die Gaben des Heiligen Geistes, die Geheimnisse des Neuen Bundes verliehen hat. Du aber, fähig, sogar seelische Wohltaten zu spenden, da Gott, wenn du nur guten Willen hast, dich auch hierin reich gemacht hat, unterlasse es nicht, dem Notleidenden auch seelisch zu helfen! Gib die notwendigsten Gaben vor allem dem, der dich darum bittet, erweise dich aber auch, ehe du gebeten wirst, den ganzen Tag barmherzig und leihe das Wort aus, um es eifrig mit Zins zurückzufordern, d. h. von dem Profit, welchen der Schuldner stets von dem Worte hat, etwas einzuverlangen, damit du allmählich die Samen des religiösen Lebens mehrest! Willst du nicht das Notwendigste spenden, dann gib das weniger Notwendige und Geringere, soweit du darüber verfügst! Bringe Hilfe, verabreiche Nahrungsmittel, schenke ein abgetragenes Kleid her, gib Arzneimittel, verbinde die Wunden, erkundige dich nach den Unglücklichen, ermuntere zur Geduld, fasse Mut, gehe selbst zu den Leuten! Du erniedrigst dich dadurch nicht, du wirst nicht angesteckt werden, wenn auch übertrieben ängstliche Menschen dies meinen, welche sich durch dummes Geschwätz betören lassen oder vielmehr, weil sie für ihre Weichlichkeit und Gottlosigkeit eine Entschuldigung brauchen, zur Feigheit, als wäre sie etwas Großes und Weises, ihre Zuflucht nehmen. Lasse dich von der Vernunft und von den Kindern der Ärzte und von den Wärtern überzeugen, welche mit den Kranken zusammenwohnen; denn von diesen ist noch keiner trotz der Krankenpflege umgekommen. Mag auch der Krankendienst etwas Abstoßendes und Abschreckendes haben, aber du, Diener Christi, der du Gott und die Menschen liebst, darfst dir nichts Unwürdiges zuschulden kommen lassen. Fasse Mut im Glauben! Das Mitleid siege über die Feigheit, die Furcht Gottes über die Ängstlichkeit! Das religiöse Empfinden darf keine fleischlichen Einwände kennen. Den Bruder darfst du nicht verachten, an ihm nicht vorübergehen, nicht darfst du dich von ihm abwenden, als wäre er belastet, unrein oder sonst etwas, das man fliehen und verfluchen muß! Er ist ein Glied von dir, wenngleich er vom Unglück niedergebeugt ist. Der Arme ist dir als einem Gotte anvertraut, magst du auch hochmütig an ihm vorübereilen. Vielleicht vermag dieser Gedanke dich zu erweichen. Ein Vorbild der Nächstenliebe ist dir gegeben, mag auch der Fremde dich davon abhalten, das gute Vorbild nachzuleben.</p><p>Jeder, der mit dem Schiffe fährt, ist dem Schiffbruche nahe und zwar um so mehr, je kühner seine Fahrt ist. Und jeder, der mit dem Leibe umgeben ist, ist den körperlichen Leiden nahe und zwar um so mehr, je aufrechter er einherschreitet und je weniger er auf die achtet, welche vor ihm liegen. Solange du mit günstigem Winde fährst, reiche dem Schiffbrüchigen die Hand; solange du glücklich und reich bist, bringe den Leidenden Hilfe! Warte nicht so lange, bis du an dir selbst erfährst, wie schlimm es ist, unbarmherzig behandelt zu werden und wie angenehm es ist, wenn sich die Herzen den Notleidenden öffnen! Veranlasse Gott nicht, daß er seine Hand gegen die erhebe, welche ihren Nacken hochhalten und an den Armen vorübereilen! Lerne vom Unglück des Nächsten! Gibst du dem Dürftigen auch nur Weniges, es ist nicht wenig für den, dem es an allem gebricht, aber auch nicht in den Augen Gottes, soferne es deinen Mitteln entspricht. Hast du keine große Gabe, dann zeige guten Willen! Hast du nichts, dann schenke deine Tränen! Barmherzigkeit, die von Herzen kommt, ist große Beruhigung für den, der im Unglück ist. Aufrichtiges Mitleid ist große Erleichterung im Elend. O Mensch, der Mensch hat nicht weniger Wert als das Tier, das du, wie dir das Gesetz befiehlt, wenn es in eine Grube gefallen ist, herausziehen und, wenn es sich verirrt hat, zurückführen mußt. Sollte in dem Befehle des Gesetzes noch ein geheimnisvollerer und tieferer Sinn verborgen sein, da oftmals im Gesetze noch ein anderer, tieferer Gedanke liegt, dann kommt es nicht mir zu, ihn zu verstehen, sondern dem Geiste, der alles erforscht und erkennt. Soweit ich den Gesetzesbefehl erfasse und verstehe, will er, daß wir vom Mitleid im Kleinen zum vollkommeneren und höheren fortschreiten. Wenn schon Mitleid gegen vernunftlose Wesen verlangt wird, wie groß sollte dann erst die Liebe zu denen sein, welche mit uns Geschlecht und Ehre teilen!</p><p>Zur Barmherzigkeit fordert uns die Vernunft, das Gesetz und alle gesetzten Menschen auf; denn diese schätzen es höher, Gutes zu tun, als Gutes zu empfangen, und wollen lieber Barmherzigkeit erweisen, als Gewinne machen. Was sagst du über unsere Mönche? Nicht will ich sprechen von den Außenstehenden, welche Götter erfinden, die den Patron ihrer Leidenschaften spielen müssen, und welche dem Kerdoos den ersten Platz anweisen, ja welche, was noch schlimmer ist, da und dort bestimmen, man müsse gewissen Dämonen Menschen opfern, und Grausamkeit als Gottesdienst ansehen und sich nicht nur selbst über solche Opfer freuen, sondern auch als sündhafte Priester und als Diener der Sünde diese Freuden ihren Göttern zuschreiben. Es ist zum Weinen, daß es sogar unter uns Leute gibt, welche so weit davon entfernt sind, mit den Heimgesuchten Mitleid zu haben und ihnen zu helfen, daß sie ihnen vielmehr bittere Vorwürfe machen und sie belästigen. Sie machen eitles, dummes Geschwätz; ihre Worte sind tatsächlich von der Erde. Sie reden in die Luft und nicht zu Ohren verständiger Menschen, welche gewöhnt sind, göttliche Lehren zu vernehmen. Sie wagen zu erklären: „Jene haben von Gott ihr Elend, wir haben von Gott unser Glück. Wer bin ich, daß ich Gottes Fügung aufheben und besser als Gott erscheinen dürfte? Sie sollen ihre Krankheit, ihr Elend, ihr Unglück haben! Es ist so bestimmt.“ Nur dann, wenn sie es für notwendig halten, ihre Oboli zurückzuhalten und sich über die Unglücklichen lustig zu machen, wollen sie Gottes Freunde sein. Daß sie aber (tatsächlich) nicht daran denken, ihr Glück komme von Gott, ergibt sich deutlich aus ihren Reden. Wer könnte denn in solcher Weise über die Armseligen urteilen, wenn er sich bewußt wäre, daß Gott es ist, der ihm seinen Besitz gegeben hat? Wer es weiß, daß er etwas von Gott erhalten hat, verwendet es zugleich auch im Sinne Gottes.</p><p>Ob übrigens ein Unglück von Gott verhängt wird, ist noch nicht ausgemacht, soferne die Materie wie z. B. ein Fluß auch selbst Ursache der Unordnung sein kann. Wer kann es wissen, ob der eine seiner Sünde wegen gestraft wird, und ob ein anderer, weil er Lob verdient, erhoben wird, und ob nicht vielmehr der eine wegen seiner Schlechtigkeit in die Höhe kommt, während der andere wegen seiner Tugendhaftigkeit heimgesucht wird? Der eine darf höher steigen, damit sich zuerst noch seine ganze Sündhaftigkeit gleich einer Krankheit entwickeln kann und er dann um so schwerer falle und mit um so größerem Recht Strafe finde. Der andere wird wider Erwarten heimgesucht, damit er wie Gold im Schmelzofen geläutert und von seinen Fehlern, wenn er noch einige hat, gereinigt werde; denn überhaupt kein Menschenkind ist, wie wir gehört haben, rein von Schmutz, mag es auch ziemlich geläutert erscheinen. Jene geheimnisvolle Wahrheit finde ich auch in der göttlichen Schrift. Doch es würde zu weit führen, alle Offenbarungen des Geistes aufzuzählen, welche mich dieses Geheimnis lehren. „Wer könnte den Sand am Meere, die Tropfen des Regens, die Tiefe des Abgrundes messen?“ Wer könnte die Tiefe der überall sich offenbarenden Weisheit ergründen, mit welcher Gott alles erschaffen hat und alles so, wie er es will und versteht, leitet? Es genügt, mit dem trefflichen Apostel das Unerforschliche und Unfaßbare seiner Weisheit nur bewundernd anzudeuten. „O Tiefe des Reichtums und der Weisheit und der Erkenntnis Gottes! Wie unerforschlich sind seine Gerichte, wie unergründlich seine Wege! Wer hat die Gedanken des Herrn erkannt?“ „Wer ist ― um mit Job zu reden ― bis zu den äußersten Grenzen seiner Weisheit vorgedrungen?“ „Wer ist weise und wird dies verstehen?“ Wird er das Unermeßliche nicht mit ungenügendem Maße messen?</p><p>Mögen andere im Urteil über Glück und Unglück verwegen und kühn sein ― es wäre allerdings besser, wenn sie es nicht wären! ―, ich für mich wage es nicht, ganz allgemein das irdische Unglück als Folge der Sünde und das irdische Wohlergehen als Folge der Tugend zu erklären. Es kommt allerdings gelegentlich vor und es hat seine Bedeutung, daß, wenn es den Sündern schlecht ergeht, die Sünde eingeschränkt wird und daß die Tugend gedeiht, wenn die Guten Glück haben. Nicht immer und nicht allgemein, sondern erst in der Zukunft empfangen die einen für ihre Tugenden den Kampfpreis, die anderen für ihre Sünden die verdienten Strafen. „Die einen ― so heißt es ― werden auferstehen zur Auferstehung des Lebens, die anderen zur Auferstehung des Gerichtes.“ Die Verhältnisse hier auf Erden sind anders, hier herrscht eine andere Ordnung, wenn auch alle Wege nach dem Jenseits weisen. Das, was uns als Unordnung erscheint, erhält in Gott durchwegs Ordnung. Es ist wie mit den äußeren und den inneren, den größeren und kleineren Organen im Körper oder wie mit den Erhebungen und Senkungen der Erde; die Verschiedenheit des Verhältnisses, in welchem die Teile zueinander stehen, ergibt die Schönheit und weckt ästhetisches Empfinden. Der von einem Handwerker bearbeitete Stoff ist auch zunächst noch ohne Form und Gestalt, er wird aber zu einem sehr kunstvollen Werk, sobald er etwas darstellt. Wenn wir einmal die vollendete Schönheit eines Werkes schauen, dann kommen wir zur Einsicht und lassen wir uns belehren. Gott ist im Wirken nicht so planlos wie wir; seine Werke sind nicht ohne Ordnung deshalb, weil uns der Einblick in ihre Logik mangelt.</p><p>Um unseren krankhaften Seelenzustand durch einen Vergleich zu veranschaulichen, wir sind ähnlich denen, welche von Seekrankheit und Schwindel erfaßt sind, welche meinen, alles drehe sich, während sie sich doch selbst drehen. So geht es denen, von welchen wir sprechen. Sie wollen es nämlich, wenn gewisse Ereignisse ihnen Schwindel verursachen, nicht zugeben, daß Gott weiser ist als sie. Ihre Pflicht wäre es, entweder mühsam nach dem tieferen Grund zu forschen, da vielleicht mühsames Suchen mit der Wahrheit belohnt wird, oder bei solchen, die mehr Weisheit und Geist als sie selber besitzen, sich Rat zu erholen, da ja auch dies eine Gnadengabe ist und Erkenntnis nicht allen geschenkt ist, oder endlich sich Erkenntnis durch Reinheit des Lebens zu erwerben und Weisheit von der wahren Weisheit zu erbitten. Jene aber halten sich in ihrer Torheit an das Näherliegende und machen sich weis, in der Welt herrsche der Unverstand; denn sie verstehen nicht den Verstand. Sie sind weise in ihrer Dummheit, oder vielmehr, sie sind wegen ihrer übergroßen Weisheit ― um mich so auszudrücken ― unweise und unverständig. Daher haben die einen angenommen, es gebe einen Zufall und ein blindes Geschick. Wirklich blinde, vom Zufall ersonnene Ideen! Sie glauben an eine blinde, zwingende Herrschaft der Gestirne, welche nach ihrem Willen, bzw. mit Notwendigkeit unser Leben leiten. Sie betonen die Konstellation der Planeten und Fixsterne und eine alles beherrschende Bewegung. Andere haben, dem armen Menschengeschlechte ihre Einfälle lehrend, das Unerreichbare und Unerfaßbare der Vorsehung dadurch näher zu bringen gesucht, daß sie in den Lehren und Bezeichnungen Unterscheidungen machten. Manche haben die Vorsehung sogar zu großer Armut verurteilt, indem sie zwar annahmen, daß das, was über uns ist, von ihr geleitet wird, aber Bedenken trugen, die Vorsehung auch auf uns, die wir doch vor allem deren bedürfen, auszudehnen, gerade als ob sie gefürchtet hätten, sie könnten den Wohltäter, wenn sie ihm zu viel Wohltaten zuschreiben, zu gut machen oder Gott möchte ermüden, wenn er zu vielen Gutes erweist.</p><p>Doch lassen wir diese, wie gesagt, beiseite, da schon die Schrift dieselben abgewiesen hat mit den Worten: „Ihr unverständiges Herz ist eitel geworden; wenn sie behaupten, sie seien weise, sind sie Toren. Die Herrlichkeit des unvergänglichen Gottes haben sie vertauscht“, indem sie mit nebelhaften Sagen die alles beherrschende Vorsehung entehrten. Wir aber wollen weder selber solche wunderliche Dinge ersinnen, sofern wir als vernünftige Wesen und Verehrer der Vernunft für Logik Verständnis haben, noch wollen wir den Glauben jener Leute annehmen, mag auch ihre Zunge die albernen Behauptungen und Lehren recht geschickt darstellen und durch die Neuheit anziehend wirken. Wir wollen vielmehr glauben, daß der, welcher alles geschaffen und gemacht hat, Gott ist. Wie könnte denn das Weltall bestehen, wenn nicht einer ist, der ihm Sein und Ordnung verliehen hat? Wir wollen auch an eine Vorsehung glauben, welche dieses Weltall zusammenhält und vereint; denn der Schöpfer muß für seine Werke sorgen. Sollte aber das Weltall von blindem Zufall getragen werden, dann würde es, da der Materie die Ordnung fehlt, gleich einem vom Sturm erfaßten Schiffe sofort in Trümmer zerfallen und ins alte Tohuwabohu zurückkehren. Wir wollen daran festhalten, daß vor allem unser Leben von unserem Schöpfer oder ― wenn dir der Ausdruck lieber ist ― von unserem Bildner geleitet wird, mag auch unser Leben durch Gegensätze gehen, welche uns vielleicht deshalb unverständlich bleiben, damit uns unsere Unkenntnis zur Bewunderung der höchsten Weisheit führe. Denn alles, was leicht erfaßt wird, wird leicht verachtet, während das, was über uns ist, um so mehr Bewunderung findet, je schwerer es zu erreichen ist, und all das, was sich unserem Verlangen entzieht, die Sehnsucht weckt.</p><p>Wir wollen daher nicht jeden Gesunden bewundern, aber auch nicht den Kranken verachten. Nicht wollen wir uns an den vergänglichen Reichtum hängen, mehr als recht ist, dem Vergänglichen mit dem Herzen ergeben und mit dem Vergänglichen gewissermaßen einen Teil der Seele verzehrend. Nicht wollen wir die Armut verfolgen, als wäre sie etwas ganz Abscheuliches und Fluchwürdiges oder als wäre in ihr ein Los zu sehen, das wir hassen müssen. Wir wollen es lernen, eine törichte Gesundheit, deren Frucht die Sünde ist, zu verachten und eine heilige Krankheit zu ehren; wir wollen diejenigen schätzen, welche im Leiden gesiegt haben, und bedenken, in den Leidenden kann ein Job verborgen sein, der viel ehrwürdiger ist als die gesunden Menschen, mag er auch seine Geschwüre abschaben müssen, mag er auch Tag und Nacht unter freiem Himmel darben, von Krankheit, dem Weibe und den Freunden bedrängt. Ungerechten Reichtum wollen wir zurückweisen, der schuld daran ist, daß der Reiche in den Flammen mit Recht leidet und um einen kleinen Tropfen Wasser zur Abkühlung bittet. Dankbare und weise Armut wollen wir preisen; sie hat Lazarus gerettet und mit der Ruhe in Abrahams Schoß beschenkt.</p><p>Mir scheint Barmherzigkeit und Mitleid mit den Dürftigen auch deshalb notwendig zu sein, um die Unbarmherzigen zum Schweigen zu bringen und törichten Reden nicht einen Sieg zu lassen, welcher die Grausamkeit gegen uns selbst zum Gesetze erheben würde. Wir müssen mehr Achtung vor den Geboten und Beispielen aller haben. Wie lauten ihre Gebote? Sie sind, worauf ihr zu achten habt, immer ein und dieselben. Denn nicht haben die Männer des Geistes, nachdem sie ein oder zweimal ihre Forderung bezüglich der Armen gestellt hatten, ihre Forderung geändert. Auch haben nicht die einen das Gebot gegeben, die anderen nicht, noch haben die einen dasselbe mehr, die anderen weniger betont, als wenn es sich nicht um ein bedeutendes Gebot und nicht um eine zwingende Notwendigkeit handeln würde. Vielmehr haben alle dasselbe mit gleichem Nachdruck als erste oder eine der ersten Forderungen erlassen, bald in der Form von Mahnungen, bald in der von Drohungen und Zurechtweisungen; bisweilen auch haben sie die, welche ihre Pflicht taten, belobt, um ja durch andauerndes Drängen ihre Forderung wirksam zu machen. „Wegen des Elendes der Armen und der Bedrängung der Notleidenden will ich mich nun erheben, spricht der Herr.“ Wer sollte nicht den Herrn fürchten, wenn er sich erhebt? „Herr, mein Gott erhebe dich, deine Hand strecke sich aus, vergiß nicht der Armen! Wir wollen uns vor solchem Ausstrecken sicherstellen, nicht wollen wir darnach verlangen, zu sehen, wie sich seine Hand gegen die Ungehorsamen erhebt, bzw. wie schwer sie auf den Hartherzigen ruht. „Nicht vergaß ich des Geschreies der Armen.“ „Nicht vollständig wird der Arme vergessen werden.“ „Seine Augen schauen auf den Armen; seine Augenlider forschen nach den Kindern der Menschen.“ Der Blick mit den Augen ist wichtiger und mächtiger; das Schauen mit den Augenlidern ist sozusagen unbedeutender und geringer.</p><p>Vielleicht möchte jemand einwenden, diese Worte seien zugunsten jener gesprochen, welche in Armut und Dürftigkeit Unrecht erleiden müssen. Es mag sein. Doch lasse dich auch durch folgende Erwägung zum Mitleid bewegen! Wenn jenen Unrecht geschieht, ist die Sorge (Gottes) so groß; wenn jene aber Gutes erfahren, ist (Gottes) Dank offenbar noch größer. Wenn der, welcher einen Armen verachtet, den Schöpfer zum Zorne reizt, dann ehrt den Schöpfer der, welcher sich seines Geschöpfes annimmt. Wenn du (das Schriftwort) hörst: „Der Arme und der Reiche begegnen sich; beide hat der Herr erschaffen“, dann darfst du nicht meinen, der Herr habe den einen als Armen, den anderen als Reichen erschaffen, damit du dich noch mehr über den Armen erhebest. Denn es steht nicht fest, daß jene Verschiedenheit von Gott komme. Vielmehr sind ― so will die Schrift sagen ― beide in gleicher Weise Gottes Geschöpfe, mögen auch ihre äußeren Verhältnisse verschieden sein. Lasse dich durch diese Erwägung zu Mitleid und Bruderliebe bewegen! Während der erste Teil (der Schriftworte) dich stolz machen könnte, soll der zweite Gedanke dich demütigen und bescheidener machen. Weiter heißt es in der Schrift: „Wer sich des Armen erbarmt, leiht Gott auf Zinsen.“ Wer sollte einen solchen Schuldner zurückweisen, der das Darlehen zur Zeit mit Zinsen zurückgibt? Wiederum steht geschrieben: „Durch Barmherzigkeit und Treue wird man von Sünden gereinigt.“</p><p>Zeigen wir daher Mitleid, um gereinigt zu werden! Den Schmutz und die Flecken der Seele wollen wir mit diesem schönen Pflänzchen beseitigen. Wir wollen weiß wie Wolle, bzw. wie Schnee werden, je nachdem wir Barmherzigkeit erwiesen haben. Ich will noch einen packenden Gedanken vorlegen: Wenn du auch keinen Beinbruch, keine Strieme, keine entzündete Wunde hast, auch die Seele nicht an Aussatz leidet und du keinen Ausschlag, der Aussatz vermuten läßt oder deutlich zeigt, hast, welcher, wenn ihn auch das Gesetz rasch rein erklärte, gleichwohl des kommenden Heilandes bedurfte, so erschrick doch in Ehrfurcht vor dem, der unsertwegen verwundet und mißhandelt worden ist! In Ehrfurcht wirst du aber erschrecken, wenn du dich gegen das Glied Christi gut und mitleidig zeigst. Sollte jedoch etwa der Räuber und Tyrann unserer Seelen dich, entweder da du von Jerusalem nach Jericho hinabgingst oder da er dich sonst irgendwo unbewaffnet und ungerüstet fand, in einer Weise zugerichtet haben, daß du mit Recht sagen kannst: „Meine Striemen riechen und faulen infolge meiner Torheit“, solltest du so schlecht daran sein, daß du nicht einmal Heilung suchst und daß du gar nicht den Weg zur Gesundung kennst, dann steht es wahrlich schlimm mit deinen Wunden, und geht dein Elend in die Tiefe. Wenn du dich aber noch nicht vollständig verloren gibst und noch Hoffnung auf Heilung hast, dann gehe zum Arzte, bitte ihn und heile die Wunden durch die Wunden; erwirb das Ähnliche durch das Ähnliche, bzw. heile das Größere durch das Geringere! Der Herr wird zu deiner Seele sprechen: „Ich bin dein Heil“, „dein Glaube hat dir geholfen“ und „siehe, du bist gesund geworden“. Alle diese tröstenden Worte wird er zu dir sprechen, wenn er nur sieht, daß du für die Notleidenden ein Herz hast.</p><p>Der Herr sagt: „Selig sind die Barmherzigen, denn sie werden Barmherzigkeit finden.“ Barmherzigkeit ist nicht die geringste unter den Seligkeiten. Und selig ist, wer Verständnis hat für den Dürftigen und Armen“. Und „selig der Mann, der sich erbarmt und gibt“. Und „den ganzen Tag erbarmt sich der Gerechte und leiht aus“. Reißen wir den Segen an uns, lassen wir uns als verständig bezeichnen, seien wir milde! Selbst die Nacht soll dich nicht im Gutestun unterbrechen. Sage nicht: „Komme wieder, morgen werde ich dir geben!“ Nichts trete zwischen den Vorsatz und die Ausführung der Wohltaten! Nur Barmherzigkeit duldet keinen Aufschub. „Brich dem Hungernden dein Brot, führe die armen Obdachlosen in dein Haus“ und zwar mit Bereitwilligkeit! Denn es heißt: „Wer sich erbarmt, tue es mit Freude!“ Durch die Bereitwilligkeit verdoppelt sich der Wert deiner Wohltat. Was mit Bitterkeit und gezwungen geschieht, entbehrt der Freundlichkeit und Gefälligkeit. Wohltaten sollen Freuden und nicht Tränen hervorrufen. „Wenn du ― wie es heißt ― die Fessel wegnimmst“ und nicht wählerisch bist, d. i. nicht kleinlich und empfindlich, nicht zögernd und mürrisch, was wirst du ernten? Großes und Wunderbares! Herrlich und reichlich ist dein Lohn. „Am Morgen wird dein Licht hervorbrechen, und schnell wird deine Heilung kommen.“ Wer sollte sich nicht nach Licht und Heilung sehnen?</p><p>[Forts. v. ] Auf mich macht Eindruck die Kassa, welche Christus hatte führen lassen, und durch welche er uns zur Armenfürsorge auffordert, ferner das einmütige Verhalten von Paulus und Petrus, von welchen zwar jeder in der Predigt des Evangeliums seinen eigenen Weg ging, welche aber gemeinsam sich der Armen annahmen, endlich die Vollkommenheit des (reichen) Jünglings, welche nach der Vorschrift (Jesu) sich darin zeigen sollte, daß sie gab und Gutes den Armen schenkte. Glaubst du vielleicht, Nächstenliebe sei freigestellt und nicht Pflicht, sei nur Rat und nicht Gesetz? Auch ich hatte den ganz gleichen Wunsch und die gleiche Meinung. Doch mich schrecken die linke Hand (des göttlichen Richters), die Böcke und die Strafworte, welche ihnen der Richter zuruft; nicht waren sie ja wegen Diebstahl oder Tempelraub oder Ehebruch oder wegen der Übertretung eines sonstigen Verbotes verurteilt worden, sondern weil sie nicht in den Notleidenden Christus gedient hatten.</p><p>Wenn ihr, Diener, Brüder und Erben Christi, nun auf mich hören wollt, dann wollen wir, solange es noch Zeit ist, Christus besuchen, Christus heilen, Christus ernähren, Christus bekleiden, Christus beherbergen, Christus ehren, aber nicht nur durch Bewirtung, wie es einige getan haben, und nicht gleich Maria mit Salben und nicht bloß durch ein Grab wie Joseph von Arimathea, auch nicht durch Geschenke für die Beerdigung gleich Nicodemus, der ein heiliger Christ war, auch nicht mit Gold, Weihrauch und Myrrhen, wie es vor den Genannten die Magier getan hatten. Da der Herr der Welt Barmherzigkeit will und nicht Opfer, und da Mitleid mehr Wert hat als Tausende von fetten Lämmern, so wollen wir ihm in den Notleidenden, die heute niedergestreckt sind, Barmherzigkeit zeigen, damit sie, wenn wir von hier scheiden müssen, uns in die ewigen Zelte aufnehmen in Christus, unserem Herrn, dem die Ehre sei in alle Ewigkeit. Amen!XV. Rede</p><h2>XV. Rede</h2><p><em>XV. Rede.</em></p><p><em>Gregor des Theologen Rede auf die Makkabäer</em>.</p><p>Wie steht es mit den Makkabäern? Heute ist ja ihr Fest. Von vielen werden sie nicht verehrt, da ihr Kampf nicht in die Zeit nach Christus fällt. Doch verdienen sie von allen geehrt zu werden, da sie für den väterlichen Glauben gelitten hatten. Wenn sie schon vor dem Leiden Christi ins Martyrium gegangen sind, wozu wären sie erst bereit gewesen, wenn sie erst nach Christus verfolgt worden wären und seinen Tod, in den er für uns gegangen ist, hätten nachahmen können! Wenn sie sich, ohne im Besitze dieses Vorbildes zu sein, so tugendhaft zeigten, hätte sich dann nicht ihr Edelmut noch glänzender geoffenbart, im Falle sie in ihrem Leid dieses Vorbild gehabt hätten? Geheimnisvoll und tief und für mich und alle Gottliebenden vollständig einleuchtend ist die Lehre: Diejenigen, welche vor der Ankunft Christi lebten, haben ihre Vollkommenheit nur auf Grund des Glaubens an Christus erlangt. Mag auch der Logos erst später zur festgesetzten Zeit verkündet worden sein, so hat er sich doch den Reinen auch schon früher geoffenbart, wie sich daraus ergibt, daß schon vor ihm viele verehrt worden sind.</p><p>[Forts. v. ] Wir dürfen also nicht die, welche vor dem Kreuze gelebt haben, gering achten. Vielmehr verdienen diese, wenn sie dem Kreuze entsprechend gelebt haben, unser Lob und es gebührt sich, daß wir sie in Worten verherrlichen. Nicht soll damit ihre Herrlichkeit vergrößert werden. Denn wie wäre dies möglich, da ihr Tun mit der Herrlichkeit belohnt ist? Vielmehr sollen die, welche ihr Lob singen, Herrlichkeit finden und die, welche ihr Lob hören, ihre Tugenden nachahmen, durch die Erinnerungen an sie angetrieben, es ihnen gleichzumachen. Wer die Makkabäer waren, woher sie stammten und welches zunächst die Leitung und Erziehung war, die sie zu solcher Tugend und Herrlichkeit geführt hatten, daß sie sogar jährlich festlich gefeiert werden und daß sie in den Herzen aller noch größere Ehren finden, als ihnen äußerlich zuteil werden, darüber gibt den Lernbegierigen und Strebsamen das Buch der Makkabäer Aufschluß. Dasselbe lehrt, den Verstand über die Leidenschaften herrschen zu lassen und frei zwischen Tugend und Sünde zu entscheiden. Das Buch enthält sowohl die Kämpfe der Makkabäer als auch die Zeugnisse einiger anderer Männer. Ich begnüge mich mit den ersteren.</p><p>Wie nach Christus Stephanus, so ist vor Christus der in dem Buche erwähnte Eleazar das Erstlingsopfer. Er war ein bejahrter Priester, ergraut an Jahren und ergraut im Wissen. Zuerst brachte er Opfer und Gebete für das Volk dar, alsdann opferte er sich selbst als vollkommenstes Opfer Gott, um das ganze Volk zu reinigen. Es war ein würdiges Vorspiel des Kampfes. Sein Reden wie sein Schweigen war eine Ermunterung. Auch seine sieben (geistigen) Söhne, die Früchte seiner Erziehung, brachte er als „lebendiges, heiliges, Gott wohlgefälliges Opfer“, welches glänzender und reiner war als jedes gesetzliche Opfer. Es ist ja nur recht und billig, das Verdienst an den Taten der Söhne dem Vater zuzuschreiben. Es waren tapfere, hochherzige Söhne, edle Sprößlinge einer edlen Mutter, ehrgeizige Verfechter der Wahrheit, die zu groß waren für die Zeiten eines Antiochus, wahre Jünger des mosaischen Gesetzes, gewissenhafte Beobachter der väterlichen Bräuche. Ihre Zahl galt bei den Hebräern als heilig und war wegen der Erinnerung an (Gottes) Ruhe am siebten Tage geehrt. Sie strebten nur nach Einem, nur auf Eines war ihr Blick gerichtet. Sie kannten nur* einen* Weg des Lebens: den Tod um Gottes willen. Sie waren der Seele nach ebenso Brüder, wie dem Leibe nach. Wunderbar war es, wie sie sich um den Tod beneideten. Gierig wie nach einem Schatz verlangten sie nach den Foltern. Sie gingen in die Gefahr aus Liebe zu ihrem Erzieher, dem Gesetze. Ihr Schrecken vor den bereits angewandten Martern war nicht so groß als ihre Sehnsucht nach den noch drohenden. Sie fürchteten nur, der Tyrann möchte mit der Strafe einhalten lassen und es möchten einige von ihnen ungekrönt bleiben und wider ihren Willen von den Brüdern getrennt werden und einen unseligen, leidenlosen Sieg davon tragen.</p><p>Ihre Mutter war mutig und edel, sie liebte sowohl ihre Kinder als auch Gott. Ganz eigenartig war der Schmerz ihrer mütterlichen Seele. Sie wurde nämlich durch das Leiden ihrer Kinder nicht von Mitleid ergriffen, sondern war in Sorge, sie möchten nicht leiden. Größer als die Sehnsucht nach denen, die bereits ihr Leben geendet hatten, war der Wunsch, daß die noch Übriggebliebenen ihnen folgen möchten. Ihre Worte galten mehr diesen als den Verstorbenen. Der Kampf der einen war ja noch unentschieden, während das Ende der anderen sicher war. Die einen hatte sie Gott bereits übergeben, während sie für die Annahme der anderen durch Gott erst sorgen mußte. Eine starke Seele in weiblichem Körper! Ein wunderbarer Opfergeist und Heldenmut! Größer war, wenn ich dies sagen darf, ihr Opfer als das des Abraham. Denn Abraham hatte freiwillig nur * einen* Sohn geopfert, der allerdings der eingeborene und verheißene war, auf den auch die Verheißung lautete, der ― was noch mehr ist ― Anfang und Wurzel nicht nur des Volkes, sondern auch solcher Opfer ist. Die makkabäische Mutter aber weihte die ganze Schar ihrer Söhne Gott; sie übertraf Mütter und Priester dadurch, daß ihre Opfer sich nach der Schlachtbank sehnten, vernünftige Opfer waren und zum Opferaltare eilten. Sie zeigte zwar ihre Brüste, erinnerte daran, daß sie von ihr aufgezogen worden waren, wies flehentlich auf ihr graues Haar und ihr Alter, aber nicht um ihre Söhne für das Leben zu gewinnen, sondern um zum Leiden zu ermuntern und weil sie nicht den Tod, sondern die Verzögerung für eine Gefahr hielt. Nichts konnte sie beugen oder erweichen oder mutlos machen: nicht Stricke zum Ausrenken der Glieder, nicht aufgestellte Räder, nicht Haken, nicht Foltern, nicht Spitzen eiserner Nägel, nicht scharfe Schwerter, nicht siedende Kessel, nicht brennendes Feuer, nicht der drohende Tyrann, nicht die Volksmasse, nicht der drängende Scherge, nicht der Anblick der Ihrigen, nicht die zerfleischten Glieder, nicht das zerissene Fleisch, nicht die Ströme von Blut, nicht die vernichtete Jugend, nicht die gegenwärtigen Schrecken, nicht die drohenden Bitterkeiten. Und was in solchen Verhältnissen sonst das Schwerste ist, nämlich der langsame Gang der Martern, war für sie das Leichteste; sie hatte ihre Freude am Schauspiel. Nicht nur die Verschiedenartigkeit der Martern, welche alle zusammen mehr von ihnen verachtet wurden als eine einzige Marter von einem einzigen, sondern auch die verschiedenen Reden des Tyrannen, der bald höhnte, bald drohte, bald schmeichelte, verursachten Verzögerungen im Martyrium; denn er setzte alles in Bewegung, um zu erreichen, was er hoffte.</p><p>Was die Antworten betrifft, welche die Söhne dem Tyrannen gaben, so waren sie zugleich so weise und mutig, daß alle herrlichen Worte aller anderen zusammengenommen gegenüber ihrer Tapferkeit unbedeutend sind, und daß die Tapferkeit aller anderen gegenüber der Weisheit, die aus den Worten der Brüder sprach, gering war, daß ferner nur ihnen es eigentümlich ist, so zu leiden und zugleich auf die Drohungen des Tyrannen und auf die angewandten Martern, denen weder die mutigen Söhne noch die mutigere Mutter erlag, so weise zu antworten. Die Mutter übertrifft alle und, mit der Liebe den Mut vereinigend, machte sie sich für ihre Söhne zum herrlichen Totenopfer, da sie den Verstorbenen im Tode nachfolgte. Freiwillig nämlich ging sie in den Tod. Und wie war die Leichenrede, die sie hielt? Mögen auch die Worte, welche die Söhne an den Tyrannen richteten, begreiflicherweise schön gewesen sein und an Schönheit alles übertroffen haben, da sie ihre Waffe waren, mit der sie den Tyrannen niederstreckten, aber herrlicher noch waren die Worte der Mutter, welche zuerst Mahnrede, dann Leichenrede waren. Welches waren nun die Reden der Söhne? Es ist nämlich gut, sie euch ins Gedächtnis zu rufen, auf daß ihr, soferne wieder solche Zeiten kommen, ein Vorbild für den Kampf und die Reden habt, welche Martyrern geziemen. Ihre Worte waren verschieden je nach der Rede des Tyrannen oder der Art der Folter oder dem Eifer der Seele. Sie lassen sich also wiedergeben: „O Antiochus und ihr alle, die ihr hier stehet, Gott ist unser einziger König, von dem wir erschaffen sind und zu dem wir zurückkehren. Unser einziger Gesetzgeber ist Moses, den wir nicht verleugnen und nicht verachten werden, so wahr ihn seine Tugend in viele Gefahren geführt und er viele Wunder gewirkt hat; wir würden es auch nicht tun, wenn ein anderer Antiochus uns mit noch Schlimmerem als du drohen würde. Wir kennen nur* eine* Waffe, die Beobachtung des Gebotes und die Festigung des Gesetzes, das unsere Mauer ist. Unsere einzige Herrlichkeit ist, allen Ruhm um dieser Leiden willen gering zu achten. Unser einziger Reichtum sind die Schätze, die wir erhoffen. Das Furchtbarste ist, etwas mehr zu fürchten als Gott. Diese Gedanken sind unsere Rüstung und unsere Waffen. Mit solchen Männern hast du es zu tun. Süß allerdings ist auch diese Welt, der heimatliche Boden, die Freunde, die Verwandten, die Jugendgenossen, dieser Tempel, dessen Name groß und berühmt ist, die heimatlichen Festversammlungen und Geheimnisse und all das, wodurch wir uns sonst noch von anderen Völkern zu unterscheiden scheinen, aber man möge glauben, daß nichts süßer ist als Gott und das, was wir um des Guten willen leiden. Unser Vaterland aber ist das himmlische Jerusalem, das stark und uneinnehmbar ist und das kein Antiochus erobern und sich zu unterwerfen hoffen darf. Unsere Verwandten sind die, welche den Geist besitzen und für die Tugend geboren sind. Unsere Freunde sind die Propheten und Patriarchen; sie sind uns Vorbilder im religiösen Leben. Unsere Jugendgenossen sind die, welche mit uns heute gemartert werden und zu gleicher Zeit ihre Standhaftigkeit bekunden. Prachtvoller aber noch als der Tempel ist der Himmel. Unsere Festversammlungen sind die Chöre der Engel. Und unser einziges, großes und größtes Geheimnis, welches der Menge verborgen bleibt, ist Gott, das Ziel der Geheimnisse dieses Lebens.</p><p>Versprich uns daher nicht weiter das Unbedeutende und Nichtswürdige! Nicht wollen wir Ehren, die schändlich sind, und nicht wollen wir etwas gewinnen, was uns Schaden bringt. So elende Geschäfte werden wir nicht mitmachen. Lasse auch deine Drohungen! Andernfalls drohen wir mit Aufdeckung deiner Schwachheit und außerdem mit den Strafen, die uns zur Verfügung stehen. Denn wir haben ein Feuer, die Tyrannen zu strafen. Meinst du, du hast es mit Völkern und Städten zu tun oder mit recht feigen Fürsten? Während die einen siegen, wirst du vielleicht über die anderen Herr werden. Sie kämpfen ja nicht um die gleiche Sache wie wir. Was du bekämpfst, ist das Gesetz, die von Gott geschriebenen Tafeln, sind die väterlichen Bräuche, welche von* einem* Geiste beseelt sind und welche dich durch siebenfachen Triumph beschämen werden. Diese zu besiegen, ist keine Heldentat; aber von ihnen besiegt zu werden, ist äußerst schmählich. Wir sind die Nachkommen und Schüler jener, die von der Feuer- und Wolkensäule geführt wurden, für die sich das Meer teilte, der Fluß haltmachte, die Sonne stehen blieb, Brot vom Himmel regnete, durch Ausstreckung der Hände und durch Gebet Tausende in die Flucht geschlagen wurden, vor denen Tiere zurückwichen, die das Feuer nicht berührte, und vor denen Könige in Bewunderung ihres Mutes flohen. Wir wollen noch von dem sprechen, was dir bekannt ist. Wir sind Schüler Eleazars, dessen Standhaftigkeit du erfahren konntest. Der Vater hat zuerst den Kampf bestanden, nach ihm werden ihn die Söhne bestehen. Der Priester ist hingegangen, die Opfer werden ihm folgen. Mit Vielem schreckst du uns, zu noch Schlimmerem sind wir bereit. Übermütiger Mann, was willst du bei uns mit deinen Drohungen erreichen? Was werden wir noch zu leiden haben? Nichts ist stärker als die, welche bereit sind, alles zu ertragen. Henker, was zögert ihr? Warum zaudert ihr? Warum wartet ihr erst noch auf den gnädigen Befehl? Wo sind die Schwerter, wo die Fesseln? Ich wünsche Eile. Facht das Feuer noch mehr an, machet die Tiere wilder, suchet noch mehr Qualen aus! Überall entfalte sich noch mehr königliche Pracht! Ich bin der Erstgeborene, opfere mich zuerst! Ich bin zwar der Letztgeborene, doch kehre man die Ordnung um! Auch einer von denen, die dazwischen geboren wurden, soll unter denen sein, die zuerst darankommen, damit wir zugleich geehrt werden! Willst du schonen? Erwartest du vielleicht Gesinnungswechsel? Immer und immer wiederholen wir die gleiche Erklärung: Wir können nichts Unreines essen, wir werden nicht nachgeben. Eher wirst du unsere Lehren achten, als daß wir den deinigen nachgeben. Um es kurz zu sagen: Sei überzeugt, daß wir die aufgestellten Foltern verachten, du mußt noch andere ersinnen.“</p><p>So sprachen die Brüder zum Tyrannen. Was sie einander an Ermunterungen gaben, was sie dem Auge boten, war so herrlich und heilig! Es war für die Gottesfürchtigen lieblicher als alles, was sonst zu schauen und zu hören ist. Sooft ich daran denke, werde ich von Freude erfüllt; im Geiste nehme ich an ihren Kämpfen Anteil und es ist mir ein Genuß, davon zu erzählen. Sie umarmten sich und küßten sich; es war ein Fest, wie wenn der Kampf bereits beendet gewesen wäre. Sie riefen: „Lasset uns, Brüder, in die Leiden ziehen! Gehen wir, drängen wir, solange der Tyrann noch gegen uns entbrannt ist! Nicht soll er sich erweichen lassen, nicht wollen wir des Heiles verlustig gehen! Das Mahl ist bereitet. Versäumen wir es nicht! Es ist zwar schön, wenn Brüder beisammen wohnen, beisammen essen und für sich sorgen. Noch schöner aber ist es, wenn sie gemeinsam für das Gute in den Kampf ziehen. Wäre es möglich gewesen, hätten wir mit der Waffe für die väterlichen Bräuche gekämpft; denn der Tod in solchem Kampfe wäre rühmlich. Da aber die Zeit solche Kämpfe nicht erlaubt, wollen wir unseren Leib auf den Opferaltar legen! Wenn wir jetzt nicht sterben, werden wir denn dann überhaupt nicht sterben? Müssen wir nicht der Geburt den schuldigen Sold zahlen? Was notwendig ist, wollen wir bereitwillig tun. Zeigen wir unsere Weisheit im Sterben! Was uns gemeinsam ist, wollen wir uns aneignen! Lasset uns das Leben durch den Tod erkaufen! Keiner von uns hänge sich an das Leben, keiner sei verzagt! Wie an uns möge sich der Tyrann auch an den anderen täuschen! Er mag die Reihenfolge der Martern bestimmen, wir wollen die Verfolgung beschließen. An Eifer und Bereitwilligkeit wollen wir einander nicht zurückstehen. Der Erste wird den anderen den Weg zeigen, der Letzte wird den Kampf besiegeln. Davon wollen wir alle in gleicher Weise überzeugt sein, daß wir gemeinsam gekrönt werden, und daß der Tyrann an uns keinen Anteil erhält, daß es seiner aufgeblasenen Bosheit also nicht vergönnt sein wird, nur einen zu gewinnen und sich dann zu freuen, als hätte er über alle gesiegt. Zeigen wir, daß wir Brüder sind, nicht nur infolge der Geburt, sondern auch im Sterben! Alle wollen wir wie ein Mann und jeder für alle anderen in den Tod gehen! Eleazar, nimm uns auf! Mutter, folge uns nach! Jerusalem, wenn noch Glieder zur Bestattung übriggelassen werden, dann begrabe feierlich deine Toten! Erzähle unsere Taten, zeige der Nachwelt und deinen Freunden die heilige Begräbnisstätte der Brüder!“</p><p>Nachdem die Brüder vom ältesten bis zum jüngsten so gesprochen und gehandelt und sich gegenseitig geschärft hatten, daß sie gleichsam Eberzähne waren, verharrten sie einmütig in ihrer Standhaftigkeit. Ihren Landsleuten gereichten sie zur Freude und Bewunderung, ihren Verfolgern aber zum Schrecken und Entsetzen. Denn obwohl diese gegen das ganze Volk vorgegangen waren, erlagen sie sieben Brüdern, die einmütig für ihre Religion eintraten, so sehr im Kampfe, daß sie nicht mehr viel Hoffnung hatten, die übrigen zu gewinnen. Die mutige, wahrhafte Mutter jener großen Söhne, die sich so sehr auszeichneten, die große, edelgesinnte Schülerin des Gesetzes, wurde unterdessen von Freude und Furcht zugleich erfüllt, war mitten zwischen zwei Gefühlen. Sie freute sich wegen des Edelmutes, den sie bereits offenbarten; sie fürchtete sich aber wegen der übergroßen Leiden, die noch bevorstanden. Wie ein Vogel beim Herannahen einer Schlange oder einer anderen Gefahr, so umflog sie ihre Jungen, umflatterte sie, ermunterte sie, half ihnen im Kampfe. Wie wirkt sie in Wort und Tat, während sich ihre Söhne zum Siege rüsten! Sie sammelte eiligst ihre Blutstropfen, hob die Knochensplitter auf und küßte, was von ihnen noch übrigblieb. Von dem einen las sie auf, was noch da war, einen anderen lieferte sie (der Marter) aus, wieder einen anderen bereitete sie (für die Marter) vor. Allen rief sie zu: „Heil euch, meine Söhne! Heil euch, meine Tapferen! Heil euch, die ihr noch im Körper wohnend, schon fast vom Körper befreit seid! Heil euch, die ihr für das Gesetz, für mich, die Greisin, für die Stadt, die euch erzogen und zu solcher Tugend emporgeführt hat, eintretet! Es dauert nicht mehr lange, und wir haben gesiegt. Nur das macht mir noch Angst, daß die Henker ermüdet sind. Nur noch eine Weile, und ich bin gepriesen unter den Müttern, und ihr seid gepriesen unter den Jünglingen. Doch ihr habt Sehnsucht nach der Mutter. Nicht werde ich euch verlassen, ich verspreche es euch. Nein, so hasse ich meine Kinder nicht!“</p><p>Als die Mutter sah, daß ihre Söhne aus dem Leben geschieden waren, und wegen ihrer Vollendung beruhigt war, da erhob sie freudigst ihr Haupt gleich einem olympischen Sieger, streckte hochgemut ihre Hände aus und betete mit lauter, feierlicher Stimme: „Ich danke dir, heiliger Vater, und dir, Meister Gesetz, und dir, Vater Eleazar, Vorkämpfer deiner Söhne, denn ihr habt die Früchte meiner Schmerzen hingenommen, und ich bin zu einer Mutter geworden, heiliger als alle Mütter. Nichts ließ ich der Welt, alles habe ich Gott geopfert: meinen Schatz, die Hoffnungen und Stützen meines Alters. Wie herrlich bin ich geehrt, wie vorzüglich ist für mein Alter gesorgt! Ich habe, meine Söhne, den Lohn für eure Erziehung erhalten. Ich sah, wie ihr für das Gute kämpftet; ich schaute, wie ihr alle gekrönt wurdet. Die Henker betrachte ich als meine Wohltäter. Fast möchte ich dem Tyrannen Dank dafür sagen, daß er durch die von ihm befohlene Reihenfolge mich zuletzt zum Martyrium kommen ließ. Denn ich wollte zuerst meine Söhne auftreten lassen und am Kampfe jedes einzelnen teilnehmen, um dann vollständig beruhigt den vollkommenen Opfern im Tode zu folgen. Nicht reiße ich mir die Haare aus, nicht zerreiße ich mein Kleid, nicht kratze ich mir mit den Nägeln das Fleisch, nicht erhebe ich ein Klagegeschrei, nicht rufe ich nach Klageweibern, nicht will ich mich, damit auch die Luft mit mir traure, in Finsternis einschließen, nicht warte ich auf Tröster, nicht lege ich Trauerbrote vor. Dies würden unedle Mütter tun, welche nur Mütter des Fleisches sind und deren Söhne hinscheiden, ohne daß man ihnen einen würdigen Nachruf geben kann. Für mich seid ihr, meine liebsten Söhne, nicht tot, sondern geopfert. Ihr seid nicht verschwunden, sondern ihr habt nur den Platz gewechselt. Nicht wurdet ihr zerrissen, sondern zusammengefügt. Nicht hat euch ein wildes Tier geraubt, nicht eine Woge verschlungen, nicht ein Mörder ermordet, nicht eine Krankheit aufgelöst, nicht ein Krieg, noch sonst ein kleineres oder größeres menschliches Schicksal dahingerafft. Würde euch so etwas zugestoßen sein, dann würde ich euch schmerzlichst beweinen, dann würde ich meine Mutterliebe durch Tränen bekunden, wie ich sie jetzt dadurch zeige, daß ich keine Tränen vergieße. Noch mehr! Ich würde euch in aller Form betrauern, wenn ihr als Feiglinge Rettung gefunden, wenn ihr wegen der Martern nachgegeben hättet, wenn nur einer von euch unterlegen wäre, wie jetzt die Verfolger unterlegen sind. Nun aber ist Ruhm, Freude, Ehre, Lust und Jubel den Hinterbliebenen beschieden. Denn außer euch werde ich geopfert. Dem Phinees werden wir gleichgestellt, mit Anna verherrlicht werden. Allerdings war Phinees nur einer, euer aber sind es mehrere, welche mit Leidenschaft die Unzucht durchbohrt haben, nicht meine ich die Unzucht des Leibes, sondern die der Seele. Und Anna hatte nur einen einzigen Sohn Gott geschenkt, und zwar gleich nach der Geburt; ich aber habe sieben Männer, und zwar mit ihrer eigenen Einwilligung Gott geweiht. Jeremias singt mir das Grablied, doch soll es kein Klaglied, sondern ein Lobgesang auf das heilige Ende sein. Ihr habt mir geleuchtet wie Schnee, wurdet heller als Milch, und mehr als Saphir ist eure Schar, die für Gott geboren und geopfert wurde. Und endlich, o Tyrann, geselle mich, soferne Feinde überhaupt Gnaden erweisen, den Söhnen bei, damit dein Kampf noch berühmter werde! Hätte ich doch durch alle ihre Martern gehen können, damit mein Blut bei ihrem Blute und mein bejahrtes Fleisch bei ihrem Fleische ruhe! Um der Söhne willen sehne ich mich nach ihren Foltern. Sollte mir dies nicht gewährt werden, dann füge doch meine Asche zu ihrer Asche, dann möge ein und dasselbe Grab uns aufnehmen! Mißgönne denen, die an Tugend gleich waren, nicht die gleiche Ehre des Todes! Lebet wohl, ihr Mütter! Erziehet zu solchen Menschen eure Kinder! Lebet wohl, ihr Söhne! Lasset euch zu solchen Helden erziehen! Ein gutes Vorbild haben wir euch gegeben. Kämpfet!“</p><p>Nach dieser Rede gesellte sie sich zu ihren Söhnen. Auf welche Weise? Zum Scheiterhaufen, zu dem sie verurteilt worden war, eilte sie, als wäre er ihr Brautgemach gewesen. Nicht wartete sie erst auf die, welche sie hinschleppen sollten; denn nicht wollte sie, daß ein unheiliger Körper ihren heiligen, edlen Leib antaste. Solch herrliche Frucht hatte das priesterliche Wirken Eleazars gezeitigt, der in die himmlischen Geheimnisse eingeweiht war und einweihte und Israel nicht mit äußeren Besprengungen, sondern mit seinem eigenen Blute heiligte, und dessen Tod das höchste Geheimnis wurde. Solch herrliche Früchte hatte die Jugend der Brüder gezeitigt, welche nicht den Vergnügungen ergeben waren, sondern die Leidenschaften bemeisterten und ihren Körper heiligten, so daß sie in ein Leben ohne Leiden eingegangen sind. Solche Früchte hatte die Fruchtbarkeit der Mutter gezeitigt; die lebenden Kinder waren ihr Stolz, mit den toten beschloß sie ihr Leben. Die, welche sie der Welt geboren hatte, schenkte sie Gott. Wie die Zahl der Geburtsschmerzen, so groß war die Zahl der Martyrien, und die Reihenfolge der Hinrichtungen erinnerte sie daran, in welcher Reihenfolge die Söhne geboren wurden; mit dem Ältesten begann der Kampf, beim Jüngsten endete er. Wie die Wogen sich drängen, so bewies einer nach dem anderen seine Tüchtigkeit und drängte jeder noch mehr zum Leiden, gestärkt durch die Leiden des Vorgängers. Der Tyrann war daher froh, daß die Mutter nicht noch mehr Kindern das Leben geschenkt hatte. Seine schändliche Niederlage wäre noch schlimmer gewesen. Zum ersten Male erkannte er die Unbrauchbarkeit seiner Waffen, als er gegen wehrlose Söhne vorging, deren einzige Waffe das fromme Gemüt war und die noch mehr zum Leiden drängten als er selbst zum Handeln.</p><p>Das Opfer der makkabäischen Brüder gibt sichereren Erfolg und ist herrlicher als das Opfer Jephthas. Denn jenes war nicht wie dieses notwendig geworden durch ein übereiliges Versprechen und durch das Verlangen nach einem Siege, an dem man schon verzweifelte. Ihr Opferdienst war vielmehr freiwillig, und der einzige Lohn, den sie erwarteten, war die andere Welt. Ihr Opfer steht an Wert nicht hinter den Kämpfen Daniels zurück, der Löwen zur Speise vorgeworfen wurde, aber durch Ausstrecken der Hände die Tiere bezwang. Es ist nicht geringer als das der Jünglinge in Assyrien, welche im Feuer von einem Engel Kühlung erhielten, da sie, um das heimatliche Gesetz nicht zu übertreten, die unreine und unheilige Speise abgewiesen hatten. Es verdient auch nicht geringere Ehre als die Opfer, die erst Spätere um Christi willen gebracht haben. Während diese, wie ich eingangs bemerkte, dem blutenden Christus nachfolgten und sich zu ihren Kämpfen von dem erhabenen, wunderbaren Opfer leiten ließen, das Gott für uns gebracht hatte, fehlten den makkabäischen Brüdern die zahlreichen und herrlichen Vorbilder der Tapferkeit. Ganz Judäa bewunderte ihre Standhaftigkeit, und es jubelte und erhob sich, wie wenn es selbst gekrönt worden wäre. Es handelte sich nämlich an jenem Tage in dem schwersten Kampfe, welcher die Stadt je bedroht hatte, darum, ob das Gesetz aufgehoben werden oder zu Ehren kommen solle. Das Martyrium der Brüder war ein kritischer Moment in der Geschichte des gesamten jüdischen Volkes. Selbst Antiochus mußte staunen, und sein Drohen verwandelte sich in Bewunderung. Selbst Feinde wissen nämlich, sobald sich ihr Zorn gelegt hat und die Macht der Tatsachen sich Geltung verschafft, die Tapferkeit an Männern zu bewundern. Antiochus zog daher unverrichteter Dinge ab. Seinen Vater Seleukus lobte er sehr, weil er das (jüdische) Volk achtete und den Tempel ehrte; dagegen macht er Simon schwere Vorwürfe, weil er sein Kommen, seine Grausamkeit und seine Schmach veranlaßt hatte.</p><p>Wir alle, Priester, Mütter und Söhne, wollen diese Märtyrer nachahmen! Die Priester sollen es tun zur Ehre des Eleazar, des geistigen Vaters, der in Wort und Tat das Beste gelehrt hatte, die Mütter aber, indem sie zur Ehre der tapferen Mutter so recht ihre Mutterliebe offenbaren, ihre Kinder Christus opfern, damit ihre Ehe durch solche Opfer geheiliget werde, die Söhne aber, indem sie in Verehrung der heiligen Söhne ihre Jugend nicht in schändlichen Leidenschaften, sondern im Kampfe gegen sie verbringen und tagtäglich mutig gegen den Antiochus ringen, der in verschiedenen Verfolgungen gegen alle Glieder kämpft. Ich verlange Streiter zu jeder Zeit und auf jede Weise, Streiter jeden Geschlechtes und jeden Alters, mögen sie offen angegriffen oder heimlich überfallen werden. In der alten wie in der neuen Geschichte mögen sie Kraft holen. Gleich Bienen mögen sie überall das Beste sammeln, auf daß eine einzige süße Wabe herrlich erstehe, damit sowohl im Alten wie im Neuen Bunde in uns Gott verherrlicht werde, der in dem Sohne und dem Geiste gepriesen ist, der die Seinigen kennt und von den Seinigen erkannt wird, der bekannt wird und bekennt, verherrlicht wird und verherrlicht in Christus, dem die Ehre sei in alle Ewigkeit! Amen.XVI. Rede</p><h2>XVI. Rede</h2><p><em>XVI. Rede.</em></p><p><em>An den schweigenden Vater anläßlich eines Hagelschlages</em>.</p><p>Warum stört ihr eine löbliche Ordnung? Warum zwingt ihr eine Zunge, welche sich dem Gesetze fügt? Warum fordert ihr ein Wort, das sich willig dem Geiste unterordnen möchte? Warum verzichtet ihr auf das Haupt und eilt ihr zu den Füßen? Warum übergeht ihr den Aaron und verlangt ihr den Eleazar? Mir gefällt es nicht, daß man die Quelle verstopft und dem Gießbach freien Lauf läßt, die Sonne versteckt und einen Stern sehen läßt, daß das Alter sich zurückzieht und die Jugend gebietet, daß die Weisheit schweigt und die Unerfahrenheit sich hervortut. Nicht ist stets ein stärkerer Regen vorteilhafter als ein geringerer. Denn ein starker Regen nimmt das Erdreich mit sich und bringt dem Landmann großen Schaden. Ein sanfter Regen aber dringt in die Tiefen, befruchtet den Boden, nützt dem Landmann und entwickelt die Ähren rechtzeitig zur Frucht. So verhält es sich mit dem Redegewandten und dem Weisen; jener bringt nicht größeren Nutzen als dieser. Jener bereitet wohl einiges Vergnügen, dann aber tritt er ab und verschwindet zugleich mit der Luft, die er in Bewegung gesetzt hat. Dies ist seine ganze Leistung. Lüsternen Ohren schmeichelt er mit schönen Phrasen. Der Weise dagegen dringt in die Seele ein. Öffnet er seinen Mund, dann ist er voll des Geistes; er wächst über sich selbst hinaus. Und schon wenige Worte bringen reichliche Ernte.</p><p>[Forts. v. ] Ich rede noch nicht die wahre und erste Weisheit, welche vor allem unser bewundernswerter Landmann und Hirte beherrscht. Erste Weisheit ist ein gutes Leben, das schon geweiht ist oder erst geweiht wird dem Herrn, der vollkommen makellos und rein ist und von uns kein anderes Opfer fordert als Reinheit oder ― wie die Schrift sich gerne ausdrückt ― „ein zerknirschtes Herz“, „ein Opfer des Lobes“, „ein neues Geschöpf in Christus“, einen neuen Menschen“ u. dgl. Die erste Weisheit besteht darin, jene Weisheit gering zu achten, welche sich auf Worte und Redewendungen und auf schlaue, geschwollene Kritiken verlegt. Ich will lieber fünf verständige Worte in der Kirche reden als tausend schöne Phrasen in unverständlichem Trompetentone, der meine Soldaten nicht zum geistigen Kampfe zu wecken vermag. Ich lobe und ehre die Weisheit, durch welche Männer ohne Bildung zu Ruhm gelangten und bei welcher verachtete Menschen die Ehre des Vortrittes erhielten und mit welcher Fischer den ganzen Erdkreis gewannen, indem sie ihn mit dem Netze des Evangeliums fingen und mit kurzen, kräftigen Worten die geschwächte Weisheit besiegten. In meinen Augen ist nicht der weise, der gescheit reden kann oder der zwar eine gewandte Zunge, aber ein unbeständiges, unverständiges Herz besitzt und den Gräbern gleicht, die außen schön und schmuck sind, innen jedoch moderndes Totengebein und viel Gestank bergen, sondern der, welcher wenig über Tugend spricht, aber sie oft in seinen Werken offenbart und seine Worte durch den Lebenswandel bestätigt.</p><p>Wie nach meinem Dafürhalten eine Schönheit, welche geschaut wird, besser wirkt als eine, die mit Worten geschildert wird, und ein Reichtum, den man in Händen hat, besser ist als einer, von dem man nur träumt, so ist die Weisheit, welche sich in Werken kundtut, besser als die, welche nur in Worten glänzt. Treffliche Weisheit besitzen, wie die Schrift sagt, alle diejenigen, welche die Weisheit tun, nicht diejenigen, welche sie verkünden. Die Zeit ist es, in der sich die Weisheit am sichersten erprobt; „ein Alter, das Ruhm verleiht, ist wahrhaft eine Krone.“ Da man ― worin ich Salomon beistimme ― keinen Menschen vor seinem Tode glücklich preisen darf, und da man nicht weiß, was der kommende Tag gebären wird, weil das irdische Leben vielfachem Wechsel unterworfen ist, und der armselige Leib Stößen und Veränderungen ausgesetzt ist, ist nicht deswegen derjenige, welcher den größten Teil seines Lebens unbescholten beendet hat und bereits nahe dem Hafen des gemeinsamen Lebensmeeres segelt, gesicherter und darum glücklicher als der, welcher noch eine weite Fahrt vor sich hat?</p><p>Verschließe also nicht deinen Mund, der viel Gutes gesprochen hatte! Denn zahlreich sind seine Früchte, groß ist die Gerechtigkeit, welche er gewirkt hatte. Willst du die Zahl deiner Kinder und deiner Schätze wissen, dann blicke um dich! Siehe, dieses ganze Volk ist es, das du in Christus durch das Evangelium erzogen hast! Versage uns nicht deine Reden, die zwar kurz, aber dafür um so trefflicher sind, verschone uns noch mit dem Hinweis auf den drohenden Verlust! Rede! Ist es auch wenig, es ist mir doch lieb und so angenehm. Sind deine Worte auch schwer verständlich, so werden sie doch vernehmbar durch den Geist, der in dir ruft, wie ja auch Gott Moses trotz seines Schweigens vernommen hatte; obwohl dieser sich nur geistig an Gott gewandt hatte, wird er gefragt: „Warum rufst du zu mir?“ Richte das Volk auf für mich, der ich zuerst dein Schüler, alsdann Hirte wurde und nunmehr erster Hirte bin! Belehre mich über die Pflichten des Seelsorgers, dieses Volk aber über den Gehorsam! Gib uns einigen Aufschluß über die gegenwärtige Heimsuchung und über die gerechten Gerichte Gottes, mögen wir sie nun erfassen oder mögen sie uns in ihrer ganzen Tiefe unbegreiflich bleiben! Zeige, inwieferne das Wort des heiligen Isaias „Die Erbarmung wird auf die Wage gelegt“ richtig ist; denn die Güte verfährt nicht ohne Kritik wie die, welche zuerst im Weinberge in Arbeit getreten waren, meinten, da sie es nicht begriffen, daß es trotz der Gleichheit noch eine Verschiedenheit gibt. Zeige, inwieferne der Zorn, der als Kelch in der Hand des Herrn und als Schale des Verderbens, welche man austrinkt, bezeichnet wird, den Sünden entspricht, mag auch allen etwas von der verdienten Strafe erlassen und dem ungemischten Zorne Barmherzigkeit beigemischt werden! Der Herr „wendet“ zwar die Härte zur Milde denen, welche sich von Furcht leiten lassen, aus kleinen Leiden empfangen, die Bekehrung in Geburtswehen in sich tragen und den vollkommenen Geist der Erlösung gebären. Die Hefe jedoch, d. i. den heftigsten Zorn, bewahrt er auf, um sie zu leeren für die, welche sich nicht durch Güte heilen lassen, sondern sich verhärten gleich dem hartherzigen Pharao, der (dem jüdischen Volke) schwere Arbeiten auflud und ein Beispiel dafür ist, wie Gottes Macht gegen die Gottlosen verfährt.</p><p>Sage, woher kommen solche Schläge und Heimsuchungen? Wie sind sie zu erklären? Wird etwa das All von Unordnung und Verkehrtheit und von blindem Schicksal und Unverstand bewegt, so daß niemand ist, der das Sein leitet, und wird es vom Zufall geführt, wie jene meinen, die in der Torheit weise sind und sich blindlings von einem verkehrten und finsteren Geiste leiten lassen? Oder wird das All, wie es anfänglich von Verstand und Ordnung geschaffen, zusammengesetzt und verbunden und zweckmäßig in einer dem Urheber allein bekannten Weise bewegt wurde, auch auf gleiche Weise unter den Zügeln der Vorsehung in seiner Bewegung und Stellung geändert? Woher kommen Unfruchtbarkeit, Sturmschäden, Hagelschlag, die uns jetzt bedrängen und heimsuchen? Woher die Störungen in der Luft, Krankheiten, Erdbeben, Meeresstürme und die Schrecken am Himmel? Wie kommt es, daß die Schöpfung, welche zum Genuß der Menschen ins Dasein gerufen worden war und alle in gleicher Weise erfreuen sollte, zur Strafanstalt der Sünder umgewandelt wird? Die Schöpfung soll, weil wir ihre Ehrungen nicht dankbar anerkannt haben, uns züchtigen und uns, weil wir nicht Gottes Macht aus den Wohltaten erkennen wollten, durch Leiden zur Erkenntnis derselben gelangen lassen. Warum empfangen die einen aus der Hand des Herrn das Doppelte für ihre Sünden und wird das Maß des Bösen zweimal aufgefüllt, wie die Bestrafung Israels zeigt, während den anderen das Siebenfache in den Busen gegeben wird und die Sünden erlassen werden? Warum ist das Maß der Amorrhäer noch nicht voll? Wie kommt es, daß der Sünder entweder straflos ausgeht oder doppelt bestraft wird? In einem Falle wird er wohl für das Jenseits zurückgestellt; im anderen wird er noch auf Erden geheilt. Und wie kommt es, daß der eine Gerechte leidet? Wohl weil er geprüft wird. Und wie kommt es, daß der andere sich des Wohlergehens freut? Er wird verschont, wenn er geistig schwach ist und sich gar nicht über das Sichtbare erheben kann. Über das Schicksal der Sünder und Gerechten belehrt auch das Gewissen, unser eigener, verlässiger Richter. Wie steht es mit unserem eigenen Unglück, welches ist seine Ursache? Soll durch dasselbe unsere Tugendhaftigkeit geprüft werden oder soll es unsere Sündhaftigkeit beweisen? Ich antworte: Es ist besser, sich, auch wenn es nicht notwendig ist, strafen zu lassen, um sich zu beugen und sich unter die gewaltige Hand Gottes zu erniedrigen, als eine Belobigung zu erhalten und stolz zu werden. Gib uns solche Lehren und Mahnungen, damit wir uns nicht wegen des derzeitigen Unglückes zu sehr aufregen oder ― was vielfach der Fall ist ― es, tief in Sünden versunken, ignorieren, sondern die Heimsuchung verständnisvoll hinnehmen und nicht uns durch Verständnislosigkeit eine noch schwerere zuziehen.</p><p>Es ist furchtbar, wenn der Boden nichts trägt und die Früchte vernichtet sind. Oder nicht? Weckten die Früchte doch schon freudige Hoffnung, und waren sie schon den Scheunen nahe! Furchtbar ist es, wenn man nicht zur rechten Zeit ernten kann, wenn der Bauer sich über die aufgewandten Mühen ärgern muß und gleichsam am Grabe seiner Pflanzung sitzt, welche ein milder Regen großzog, ein stürmischer Regen vernichtete. „Nicht füllte der Landmann damit seine Hand, und nicht seinen Schoß der Garbenbinder“, und er empfing deswegen nicht den Gruß, den die Vorübergehenden den Landleuten geben. Ein erbarmungswürdiger Anblick ist ein verwüstetes, verheertes und seines Schmuckes beraubtes Land. Mehr als ein anderer beweint der selige Joel in klagenden Tönen die Vernichtung des Landes und die Hungersnot. Noch ein anderer Prophet bricht, da er die frühere Schönheit der späteren Verwüstung gegenüberstellt, über den Zorn des Herrn, der die Erde vernichtet, in die Klage aus: „Zuerst war es ein Garten der Lust, dann wurde es ein Feld des Todes.“ Solche Erlebnisse sind hart und mehr als hart, solange nur erst die Gegenwart schmerzt und nicht noch schmerzlichere Erfahrungen niederdrücken; wie bei Krankheiten ist der gegenwärtige Schmerz immer bitterer als der, welcher gerade nicht plagt. Doch die Schätze des göttlichen Zornes bergen in sich noch schlimmeres Leid als dieses. Möchtet ihr es nicht erfahren müssen! Ihr werdet es auch nicht erfahren, wenn ihr eure Zuflucht zu den Erbarmungen Gottes nehmet und den, der Barmherzigkeit will, durch Tränen für euch gewinnet und durch Umkehr die Folgen des Zornes abwendet. Was wir erleben, ist noch Milde und Güte, sanfte Züchtigung, erst der Anfang des Unglückes, das Erziehungsmittel für Jugendliche. Es ist erst der Rauch des Zornes, das Vorspiel der Plagen, aber noch nicht verzehrendes Feuer, noch nicht Höhepunkt in der Bewegung, noch nicht glühende Kohle, nicht das Ende der Züchtigung, welche Gott bald androhte, bald hinausschob, bald mit Gewalt zurückhielt, bald verhängte. Durch die Verhängung wie durch die Androhung des Unglückes erzieht er uns in gleicher Weise; im Übermaß seiner Güte „ebnet er seinem Zorne die Bahn“. Mit geringeren Züchtigungen beginnt er, damit wir nicht der schwereren bedürfen; aber auch mit größeren erzieht er, wenn er dazu gereizt wird.</p><p>Ich kenne das blinkende Schwert und das trunkene Messer am Himmel, das beauftragt ist, zu schlachten, zu vernichten, kinderlos zu machen, Fleisch, Mark und Knochen nicht zu schonen. Ich kenne den Gefühllosen, der dem notleidenden Bären gleicht und dem Panther auf dem Wege der Assyrer; ich meine nicht nur die früheren Assyrer, sondern jeden, der jetzt durch seine Schlechtigkeit ein Assyrer ist. Nicht kann man der Gewalt und der Schnelligkeit seines Zornes entfliehen, wenn er sich gegen unsere Freveltaten erhebt und sein Grimm, der die Widersacher zu verzehren weiß, seine Feinde verfolgt. Ich kenne das Hangen und Bangen, die Aufregungen, die Unruhe des Herzens, das Schlottern der Knie und die anderen derartigen Strafen der Gottlosen. Ich schweige von den Gerichten im Jenseits, welchen diejenigen ausgeliefert werden, die hier Nachsicht erhalten. Ich erkläre nur: Es ist besser, jetzt gezüchtigt und gereinigt, als im Jenseits den Leiden ausgeliefert zu werden; denn dort gibt es nur Strafe, keine Läuterung. Wie derjenige, welcher hier Gottes gedenkt, nach einem herrlichen, weisen Ausspruch des trefflichen David den Tod überwindet, so kennen die Verstorbenen in der Hölle keine Lobpreisung und keine Besserung. Das Diesseits hat Gott zum Leben und Handeln bestimmt, im Jenseits soll über das, was man tut, entschieden werden.</p><p>[Forts. v. ] Was werden wir tun am Tage der „Vorführung“, womit mich einer der Propheten schreckt, mag damit gemeint sein, daß Gott über uns zu Gericht sitzt, oder daß er uns auf Berge und Hügel führt, wovon wir gehört haben, oder mag darunter verstanden werden irgendein Verbringen an irgendwelche Stelle, wenn er uns prüft und uns gegenübertritt, um unsere Sünden, unsere bitteren Ankläger, gegen uns vorzuführen, den Wohltaten, die wir empfangen haben, unser Unrecht gegenüberzuhalten, Rede mit Rede zu schlagen, Taten den Taten gegenüberzustellen und die Würde des Ebenbildes, das durch die Sünde beschmutzt und verwüstet worden war, zurückzufordern, und wenn er schließlich uns, nachdem wir uns selbst verurteilt und gerichtet haben, abführt, so daß wir nicht einmal behaupten dürfen, wir erlitten Unrecht, was die, welche auf Erden leiden, bisweilen zum Troste in ihrem Leide sagen können?</p><p>Wer wird dort unseren Advokaten machen? Womit werden wir unsere Sache begründen? Welche Lüge wird noch die Verteidigung führen können? Welchen Kunstmitteln wird die Überredung gelingen? Welche Schlauheit wird den Gerichtshof gegen die Wahrheit gewinnen und das rechte Urteil verhindern können, welches für alle alles, sowohl Handlungen wie Worte und Gedanken, auf die Wage legt, Sünden und Tugenden gegeneinanderhält, um dem Übergewichte und der Überzahl die Entscheidung zu lassen, so daß es keine Berufung, keine höhere Instanz, keine neue Verteidigung mehr gibt, und es ausgeschlossen ist, noch bei den klugen Jungfrauen oder bei den Händlern für die erloschenen Lampen Öl zu erhalten, und der Reiche, der in der Feuerflamme schmachtet und um Bekehrung seiner Verwandten bittet, keine Gelegenheit zur Buße und keine Zeit zur Umkehr findet? Es wird nur ein einziges Gericht geben. Dieses wird endgültig und furchtbar sein, mehr noch gerecht als furchtbar, oder vielmehr es wird wegen seiner Gerechtigkeit recht furchtbar werden. Wenn die Throne aufgestellt werden, der Bejahrte den Vorsitz übernimmt, die Bücher aufgeschlagen werden, der Feuerstrom sich ergießt, das Licht vor uns erscheint und die Finsternisse bereitet sind, dann „werden die, welche Gutes getan haben, hervorgehen zur Auferstehung des Lebens“, das jetzt noch in Christus verborgen ist, dereinst aber zugleich mit ihm offenbar werden wird; „diejenigen aber, welche Böses getan haben, werden hervorgehen zur Auferstehung der Verdammung, zu der die, welche nicht glaubten, bereits von dem sie richtenden Verstande verurteilt sind. Die einen werden zum unaussprechlichen Lichte gelangen und zur Anschauung der heiligen, erhabenen Dreifaltigkeit, welche so rein und hell leuchtet und sich vollständig dem ganzen Verstande hingibt, zu jener Anschauung, worin nach meiner Ansicht allein der Himmel besteht. Die anderen aber werden u. a., ja vor allen anderen dadurch gepeinigt, daß sie von Gott verworfen sind und daß ihr Gewissen von einer nimmer endenden Schmach gedrückt wird. Darüber werde ich noch später sprechen.</p><p>Was wollen wir jetzt tun, Brüder, nachdem wir erniedrigt und gedemütigt wurden und wir trunken sind, jedoch nicht von hitzigem Getränke oder vom Weine, der auf einige Zeit wanken läßt und benebelt, sondern von den Leiden, womit uns der Herr heimgesucht hat, der da spricht: „Du, o Herz, errege dich und sei unruhig“, und der die Spötter mit dem Geiste der Trauer und der Finsternis tränkt, welchen auch das Wort gilt: „Sehet, ihr Spötter, schauet auf, wundert euch und vergehet!“ Wie werden wir seine Anklagen ertragen? Was für eine Antwort werden wir geben, wenn er uns nicht nur die Menge seiner Wohltaten, für welche wir keinen Dank haben, sondern auch die Heimsuchungen vorhält und die Heilmittel aufzählt, welche wir nicht angewendet haben, wenn er uns als ungezogene Kinder und fremde Söhne, welche vom rechten Pfad wegen seiner Wildheit und Rauhheit abgewichen sind, bezeichnet und erklärt: „Auf welche Art und Weise hätte ich euch erziehen sollen, ohne daß ich es getan habe? Hätte ich es mit leichteren Mitteln versuchen sollen? Ich habe sie angewandt. Nicht versuchte ich es mit dem Blute, das in Ägypten bei der ersten Plage aus Quellen, Flüssen und jeglicher Zisterne getrunken wurde, nicht versuchte ich es mit den Fröschen, Fliegen, Mücken, den weiteren Plagen. Ich fing erst mit der fünften Plage an, mit der Strafe am Vieh, an den Rindern und Schafen. Nur gegen die vernunftlosen Wesen habe ich mich gewandt, die vernünftigen dagegen geschont. Auf euch machte es keinen Eindruck; ihr wurdet vielmehr noch unvernünftiger und dümmer als die getroffenen Tiere. Den Regen habe ich euch entzogen; nur ein Teil wurde vom Regen befeuchtet, während ein anderer Teil, der keinen Regen erhielt, austrocknete. Ihr erklärtet: Als Männer wollen wir uns zeigen. Ich habe euch Hagel geschickt, um euch durch dieses Unglück zu erziehen, und habe eure Weinberge, Sträucher und Früchte vernichtet, doch eurer Bosheit habe ich kein Ende bereitet.“</p><p>[Forts. v. ] „Ich weiß, daß du hart bist, und daß dein Nacken eiserne Sehnen hat“, so wird er wohl zu mir sagen, wenn ich mich von den Heimsuchungen nicht belehren lasse. Wer schmähte, schmäht noch; wer das Gesetz übertrat, übertritt es noch. Nichts fruchtete die Belehrung von oben, nichts die Geißelhiebe. „Der Blasebalg hat aufgehört, das Blei ist ausgegangen“ ― Worte des Jeremias, die ich schon früher einmal benützte, euch Vorhalt zu machen. Umsonst hat der Silberschmied gearbeitet; eure Sünden sind nicht geschmolzen. „Werdet ihr ― fragt der Herr ― meinen Zorn ertragen können? Kann meine Hand nicht noch andere Plagen über euch bringen? Noch stehen mir die Beulen zur Verfügung, die sich infolge des Ofenrußes gebildet hatten, welchen Moses oder sonst ein Diener des göttlichen Willens gegen den Himmel gestreut hatte, um Ägypten durch Krankheit zu züchtigen, ferner Heuschrecken und dichte Finsternis und jene Plage, welche zwar zuletzt verhängt wurde, aber dem Schmerz und der Wirkung nach die erste Stelle einnahm, nämlich die Vernichtung und der Tod der Erstgeburt.“ Um solchem Schrecken zu entgehen und den Tod abzuwenden, ist es das beste, die Pfosten des Geistes, nämlich das Denken und Handeln, mit dem großen, heilsamen Siegel, d. i. dem Blute des Neuen Bundes, zu salben und mit Christus gekreuzigt zu werden und zu sterben, auf daß wir auch mit ihm jetzt und bei seiner letzten Wiederkunft aufstehen, verherrlicht werden und herrschen. Nicht sollen wir zerschmettert und erledigt werden und trauern; nicht soll der Böse uns in stürmischer Nacht und in dieser Finsternis des Lebens schlagen und die Erstgeburt der gottgeheiligten Keime und Triebe unseres Lebens vernichten!</p><p>Ferne sei es, daß der Gütige außer dem Unglück, das er geschickt hat, mir wegen meiner Verkehrtheit in seinem Zorne und seiner Erbitterung auch noch den Vorwurf mache: „Ich habe euch geschlagen mit Getreidebrand, Glutwind und Fäulnis, doch umsonst. Auf dem Felde schlug mein Schwert eure Söhne, doch nicht habt ihr euch zu mir bekehrt, spricht der Herr.“ Nicht möchte ich jener Weinberg des Geliebten werden, welcher, nachdem er gepflanzt, mit einem Walle und Zaune umgeben, durch einen Turm und alle notwendigen Vorsichtsmaßregeln gesichert war, unfruchtbar blieb und Dornen trug, so daß man ihn verachtete, seinen Turm und seine Umzäunung niederriß, ihn nicht versorgte und nicht umgrub, vielmehr alle ihn plünderten, gemeinsam verwüsteten und niedertraten. Da ich solches Schicksal fürchte, spreche ich. Zu solch beängstigenden Gedanken führt mich unser Unglück. Meinen Worten will ich noch das Gebet beifügen: „‚Wir haben gesündigt, Unrecht getan, gottlos gehandelt.’ Denn wir haben deine Gebote vergessen und sind unseren schlechten Gedanken nachgegangen. Nicht wie es unsere Berufung, das Evangelium deines Christus, seine heiligen Leiden und die Erniedrigung, der er sich unsertwegen unterzogen hatte, verlangten, sind wir gewandelt. Zur Schande sind wir deinem Geliebten geworden. Priester und Volk zugleich haben ausgeschlagen.,Gemeinsam sind wir abgewichen und nutzlos geworden; keiner ist, der Recht und Gerechtigkeit täte, auch nicht ein einziger.‛ Deine Erbarmungen, deine Güte, die mitleidige Liebe unseres Gottes haben wir durch unsere Sünden und durch die Bosheit unserer Gesinnung und unseres Wandels von uns gewiesen. Du bist gut, aber wir sind Sünder. Du bist langmütig, aber wir verdienen Bestrafung. Wir kennen deine Güte, aber gleichwohl sind wir Toren. Nur für einige wenige unserer Sünden wurden wir geschlagen. ‚Schrecklich bist du, wer kann dir widerstehen?’ Vor dir werden die Berge erzittern, wer wird sich gegen die Größe deines Armes stemmen? Wenn du den Himmel verschließest, wer wird ihn öffnen? Wenn du deine Schleußen öffnest, wer wird sie schließen? In deinen Augen ist es eine Leichtigkeit, arm zu machen und reich werden zu lassen, Leben zu spenden und zu töten, zu schlagen und zu heilen. Was du willst, ist sogleich geschehen.,Du erzürntest, wir aber haben gesündigt’, bekennt einer der Alten. Ich aber muß mit Rücksicht auf meine Verhältnisse die Worte umkehren und sagen:,Wir haben gesündigt, und du zürntest’. Darum ‚haben uns unsere Nachbarn geschmäht’. Dein Angesicht hast du abgewendet, und wir wurden mit Schande bedeckt. Doch halte ein, o Herr, verzeihe, o Herr, sei gnädig, o Herr! Verstoße uns nicht für immer wegen unserer Sünden! Nicht sollen Fremde von unserer Bestrafung lernen. Könnten doch wir aus dem Schicksale Fremder klug werden! Wen meine ich da? Ich denke an die Heiden, welche dich nicht kennen, und an die Reiche, welche sich deiner Herrschaft nicht unterworfen haben, während wir dein Volk sind, o Herr, und der Stab deines Erbes. Du magst uns daher wohl züchtigen, doch in Güte und nicht in deinem Zorne; nicht sollst du uns zum kleinsten und mindesten unter allen Völkern der Erde machen!“</p><p>Mit solchen Worten erobere ich das Erbarmen Gottes. Hätte sein Zorn auch durch Schlachtopfer oder Brandopfer versöhnt werden können, würde ich hierin nicht gespart haben. Mich, einen schüchternen Hirten, müßt ihr aber auch nachahmen. Ja tuet es, geliebte Kinder, die ihr mit mir die göttliche Züchtigung und das göttliche Erbarmen teilet! Rettet eure Seele unter Tränen! Besänftiget den Zorn durch Besserung der Lebensführung! „Beobachtet ein heiliges Fasten, verkündet Heilung!“ wie mit mir der Prophet Joel mahnt. Versammelt Greise und Säuglinge, das erbarmungswürdige Alter, das am meisten der Güte Gottes bedarf! Ich weiß, daß mir, dem Diener des Herrn, und euch, die ihr der gleichen Herrlichkeit gewürdigt wurdet, befohlen ist, im Bußgewande einzutreten, Tag und Nacht zwischen Stufen und Altar zu wehklagen und, Mitleid erweckend durch die Kleidung, mehr aber noch durch die Stimme, und, ohne Geißeln und Worte, womit Gott versöhnt wird, zu sparen, für sich und das Volk zu flehen: „Schone, o Herr, dein Volk und überlasse dein Erbe nicht der Schmach usw.!“ Je höher unsere Würde ist, um so tiefer sollen wir uns erniedrigen, damit das Volk durch uns zur Reue und Bekehrung und damit zur Güte Gottes und zur Befreiung von den Schlägen gelange.</p><p>„Kommet also alle, die ihr unsere Brüder seid, lasset uns anbeten, niederfallen und wohnen vor dem Herrn, dem Schöpfer!“ Mag auch Alter und Geschlecht uns trennen, aber im Schmerze wollen wir eins sein! Senden wir unsere flehentlichen Bitten zu ihm empor! Nicht verhaßtes Geschrei wollen wir an das Ohr des Herrn der Heerscharen richten, sondern das Gebet: „Lasset uns durch Bekenntnis seinen Zorn besänftigen!“ Wir wollen nicht nur seinen Zorn, sondern auch seine Gnade schauen. „Wer weiß, ― wendet man ein ― ob der Herr nachgeben und einlenken wird, um uns Segen zu hinterlassen?“ Ich weiß es bestimmt, ich stehe ein für Gottes Erbarmung. Er läßt ab von seinem Zorne, der seiner Natur widerspricht, und wendet sich zur Güte, die seinem Wesen entspricht. Zum Zorne wird er von uns gezwungen; zur Güte aber treibt ihn sein eigenes Ich. Wenn er deshalb schlägt, weil er dazu gezwungen wird, sollte er nicht deshalb, weil es seiner Natur gemäß ist, wieder davon ablassen? Es ist nur notwendig, daß wir, nachdem wir der gerechten Liebe des Vaters den Weg geöffnet haben, einander uns mitleidig schenken. Wir wollen in Tränen säen, um in Freuden zu ernten. Den Bewohnern von Ninive, nicht denen von Sodoma, wollen wir gleichen. Die Sünden wollen wir heilen, um nicht zugleich mit der Sünde zugrunde zu gehen. Lasset uns auf die Predigt des Jonas hören, um nicht von Feuer und Schwefel überschüttet zu werden! Und wenn wir aus Sodoma ausziehen, dann wollen wir ins Gebirge gehen, nach Segor fliehen, schon bei Sonnenaufgang dort sein! Nirgend in der Umgebung wollen wir stehen bleiben, nicht wollen wir umschauen, um nicht zu einer Salzsäule zu erstarren, die tatsächlich ewig bleibt als Anklage gegen jene Seele, die in die Sünde zurückfiel.</p><p>Wir müssen wissen, daß Sündelosigkeit, welche die Kraft des Menschen tatsächlich übersteigt, nur Gott zukommt; ich unterlasse es nämlich, von den Engeln zu sprechen, um nicht bösen Widerspruch herauszufordern und Leidenschaften zu wecken. Verstocktheit aber kommt der bösen Natur des Widersachers zu und denen, die sich von ihm beeinflussen lassen. Sache der Menschen jedoch, soferne sie nur würdig sind und an der Erlösung teilhaben, ist es, von der Sünde sich zu bekehren. Mag auch der Staub in gewisser Beziehung die Sünde nach sich ziehen und das irdische Zelt den in die Höhe strebenden oder doch für das Ideale erschaffenen Geist niederdrücken, so hat doch das (göttliche) Ebenbild die Pflicht, den Schmutz zu reinigen und das verbündete Fleisch mit den Flügeln des Verstandes zu beschwingen und zu erheben. Allerdings wäre es besser, es wäre die ursprüngliche Würde, zu welcher wir nun durch die Schule dieses Lebens gelangen, uns geblieben, und wir hätten nicht durch den bitteren Genuß der Sünde den Baum des Lebens verloren, so daß wir nicht jener Reinigung bedürften und nicht erst gereinigt werden müßten. Doch von der Sünde sich zu bekehren ist noch besser, als trotz der Sünde nicht gestraft zu werden. Denn, „wen der Herr lieb hat, den züchtigt er“. Und zu strafen ist Sache eines Vaters. Eine Seele, welche nicht zurechtgewiesen wird, findet keine Heilung. Das Schlimme ist also nicht, geschlagen zu werden, sondern trotz der Schläge nicht vernünftiger zu werden. Einer von den Propheten sagt über das verstockte und im Herzen unbeschnittene Israel: „O Herr, du geißeltest sie, aber sie empfanden keinen Schmerz; du züchtigst sie, aber sie wollten sich nicht bekehren lassen“, und wiederum heißt es: „Das Volk bekehrte sich nicht, solange es geschlagen wurde“, und „Warum hat sich mein Volk böswillig von mir gewendet? Vollständig soll es daher zermalmt und vernichtet werden!“</p><p>„Es ist schrecklich, Brüder, in die Hände des lebendigen Gottes zu fallen“. Schrecklich ist es, „wenn der Herr auf die Missetäter blickt, um das Böse vollständig auszurotten. Schrecklich ist es, von Gott, der selbst im schweigenden Blute die Stimme Abels hörte, vernommen zu werden. Schrecklich ist es, wenn seine Füße die Bosheit einholen. Schrecklich ist seine Allgegenwart, welche nicht gestattet, irgendwie dem Willen Gottes zu entfliehen, mag man zum Himmel fliegen oder in die Unterwelt hinabsteigen oder gegen Osten eilen oder sich in den Tiefen des Meeres oder an seinen äußersten Grenzen verstecken. Nahum aus Elkosch fürchtete schon vor mir, als er seinerzeit das Gotteswort gegen Ninive verkündete, den „eifersüchtigen Gott, den Herrn, der voll Grimm sich an seinen Feinden rächt“ und mit solcher Strenge verfährt, daß es keiner weiteren Bestrafung der Sünder mehr bedarf. Wenn ich die Drohungen des Isaias gegen die Bewohner von Sodoma und die Fürsten von Gomorrha und sein Wort höre: „Wie soll ich euch, die ihr Sünde auf Sünde häuft, noch weiter schlagen?“, dann möchte ich fast vor Schrecken vergehen und in Tränen zerfließen. Der Prophet will sagen: es ist nicht möglich, für jede neue Sünde noch eine neue Strafe ausfindig zu machen; so sehr habt ihr schon alles durchgekostet, jede Art von Strafe ausprobiert; immer habt ihr wieder neue Strafen durch eure Sünden herausgefordert. „Da ist nicht mehr eine einzelne Wunde oder Strieme oder brennende Beule. Der ganze Körper ― sagt er ― ist eine Wunde und unheilbar. Kein Linderungsmittel, nicht Öl, nicht Verband kann angewendet werden.“ Die weiteren Drohungen übergehe ich, um euch nicht in eurer gegenwärtigen Not lästig zu fallen.</p><p>Doch suchen wir den Grund des Unglückes zu erkennen! Warum sind die Äcker ausgetrocknet, die Scheunen ihres Schmuckes beraubt, die Viehweiden verödet, die Landschaften so wenig lieblich, die Felder saftlos und voller Trauer? Warum wogt in den Tälern nicht das Getreide? Warum sind sie Tränentäler geworden? Warum träufeln uns nicht die Berge Süßigkeit, wie sie es später den Gerechten tun werden? Warum wurde ihnen Schmuck und Herrlichkeit genommen? Warum empfingen sie für die Verkehrtheiten den Fluch der Berge Gilboas? Die ganze Erde ist geworden, wie sie in der Urzeit war, ehe sie sich noch mit Schönheit geschmückt hatte. „Du schautest nach der Erde und machtest sie trunken.“ Aber dein Schauen war böse und die Trunkenheit verderblich. O, was müssen wir sehen! Halme müssen wir als Früchte ansehen. Was wir gesät haben, erkennt man nur noch an kleinen Überresten. Kaum heimsen wir soviel ein, um dem Herrn den Zehnten zu geben. Nicht so sehr die Garben als die Monate sagen uns, daß Erntezeit ist. So verhält es sich mit dem Reichtum der Gottlosen, mit den Feldern derer, welche Sünde säen. Ein altes Fluchwort sagt: Man schaut nach vielem aus, aber wenig heimst man ein; man sät, ohne zu ernten, und pflanzt, ohne zu keltern; wo zehn Joch Ochsen arbeiten, erhält man nur einen einzigen Eimer; man hört von herrlicher Ernte bei anderen, wird aber selbst von Not niedergedrückt. Woher kommt dies? Wo liegt die Ursache des Elendes? Warten wir nicht, bis uns andere anklagen! Seien wir selbst unsere Richter! Ein kräftiges Heilmittel gegen die Sünde ist das Bekenntnis und die Flucht vor dem Fall. Ich bin, wie ich es meinem Volke schon früher kundgetan habe, sein Führer und stehe auf hoher Warte. Gleichwie ich das Kommen des Schwertes nicht verheimlicht habe, um meine Seele und die der Zuhörer zu retten, so bekenne ich, des Volkes Sache zu meiner eigenen machend, seinen Ungehorsam in der Hoffnung, durch das Bekenntnis Erbarmen und Ruhe zu finden.</p><p>Die einen unter uns haben die Armen unterdrückt, ein Stück Land an sich gerissen, ungerechterweise, sei es durch Betrug, sei es mit Gewalt, die Grenzen erweitert, Haus an Haus und Acker an Acker gefügt, um den Nachbarn zu schädigen, und, als wollten sie allein auf Erden wohnen, darnach gestrebt, überhaupt keinen Nachbarn zu haben. Andere haben durch Zins und Wucher die Erde befleckt, indem sie sammelten, wo sie nicht gesät hatten, und ernteten, wo sie nicht ausgestreut hatten, nicht den Boden, sondern die Not der Armen ausbeutend. Andere haben die Erstlinge der Tenne und Kelter Gott, der alles gegeben hatte, vorenthalten, wodurch sie sich undankbar und töricht zugleich zeigten; für das, was sie empfingen, haben sie nicht gedankt und für die Zukunft ― um von anderem zu schweigen ― haben sie nicht durch edle Gesinnung vorgesorgt. Wieder andere haben sich der Witwen und Waisen nicht erbarmt und auch nicht ein Stücklein von ihrem Brote und ihren Speisen den Notleidenden, bzw. Christus mitgeteilt, der von uns gespeist wird, wenn wir auch nur schon einen Bissen (dem Nächsten) verabreichen. Die es nicht getan haben, waren vielleicht reich, glaubten aber trotz ihrer reichen Scheunen, da sie ― was ihre größte Sünde war ― arm an Hoffnung blieben, noch in Not zu leben; teils füllten sie ihre Scheunen, teils rissen sie dieselben nieder, um sie für spätere Ernten zu vergrößern, ohne zu wissen, daß sie noch, ehe ihre Hoffnung sich erfüllt, dahingerafft werden und sich als schlechte Verwalter fremden Eigentums wegen ihres irdischen Reichtums und ihres Prunkes zu verantworten haben. Wieder andere haben den Weg der Elenden aus der Richtung gebracht und das Recht durch Unrecht verdreht. Andere haben den mit Haß verfolgt, der sie am Tore zurechtgewiesen, und haben heilige Worte verabscheut. Andere haben ihrem Netze, das reichen Fang gemacht hatte, Opfer gebracht, weil sie das, was sie den Armen geraubt hatten, in ihren Häusern verwahren. Entweder dachten sie nicht an Gott oder, wenn sie an ihn dachten, sündigten sie, da sie beteten: „O Herr, sei gepriesen, da wir reich geworden sind!“ und da sie ihn verdächtigten, soferne sie glaubten, von Gott das erhalten zu haben, wofür sie gestraft werden sollten. „Daher kommt der Zorn Gottes über die treulosen Söhne.“ Daher wird der Himmel entweder verschlossen oder zum Fluche geöffnet, und zwar um so mehr, wenn wir uns nicht auf Grund der Züchtigung bekehren und uns nicht dem zuwenden wollten, der sich uns in den Naturmächten naht.</p><p>Was wollen wir gegen Gottes Strafe einwenden, da wir doch Getreide aufkaufen und verkaufen und die Mißgunst der Zeiten benützen, um Profite zu machen und das Unglück des Nächsten zur eigenen Lust zu verwerten und in verbrecherischer Weise das Eigentum der Landsleute an uns zu ziehen im Gegensatz zu Joseph, welcher die Ernten der Ägypter im Interesse der Allgemeinheit einforderte. Joseph verstand es nämlich nicht bloß, Getreide aufzukaufen, sondern auch weise zu verteilen; da er die Hungersnot vorauswußte, arbeitete er im voraus dagegen. Wir sagten: „Wann ist der Monat vorüber, um verkaufen zu können? Wann sind die Sabbate zu Ende, damit wir unsere Schätze öffnen können und mit zweierlei Maß und Gewicht das Recht unmöglich machen und das bleierne Gewicht zu unseren Gunsten legen?“ Was wollen wir einwenden? Denn unsere Habsucht kennt keine Grenze, und wir beten Gold und Silber an, so wie unsere Vorfahren die Baal und Astarte und den abscheulichen Chamos angebetet haben. Wir hängen uns an kostbare, glänzende Steine und weiche und wallende Kleider, welche von Motten verzehrt und von Räubern, Tyrannen und Dieben gesammelt werden. Wir sind stolz auf viele Diener und Hände. Auf Ebenen und Bergen machen wir uns breit, da wir nicht nur zu den Besitzern gehören, sondern auch unseren Besitz erweitern und immer noch mehr vergrößern, gleich dem Blutegel, von dem Salomon spricht und der gleich der Unterwelt, der Erde, dem Feuer und dem Wasser unersättlich ist. Auch anderes, schon bewohntes Land möchten wir noch besitzen. Wir sind böse auf die von Gott gesetzten Grenzen, weil sie für unsere Gier und Unersättlichkeit zu enge sind. Was können jene einwenden, welche auf den hohen Thronen sitzen, ihr fürstliches Zelt aufrichten und ihre Stirne noch kühner erheben als die Schauspieler und nicht daran denken, daß Gott über allen erhaben und die Höhe seiner wahren Herrlichkeit unzugänglich ist und daß sie in ihren Untertanen, mit welchen sie doch dasselbe Hilfsbedürfnis verbindet, Genossen erblicken sollten? Achte auch noch auf die, gegen welche sich der treffliche Amos mit Recht wendet, da sie auf elfenbeinernen Betten schwelgen, sich mit kostbaren Ölen salben, dem Spiele der Musikinstrumente Beifall klatschen und sich an das Flüchtige hängen, als wäre es ewig, mit dem Schicksal Josephs aber kein Mitleid haben! Gegen die, welche schon vor ihnen vom Unglück ereilt worden waren, hätten sie mildtätig sein sollen, um durch Mitleid Mitleid zu erwerben. Die Tanne hätte heulen sollen, als die Zeder fiel. Das Unglück des Nächsten hätte ihnen eine Warnung sein und das Leid Fremder sie zur Sorge für sich selbst veranlassen sollen; sie waren gegenüber dem früheren Geschlechte im Vorteil, da dieses ihnen, nicht aber sie diesem den Weg zum Heile wiesen.</p><p>Sprich solche Worte der Weisheit mit uns, o erhabenes, heiliges Haupt, das du in langer Zeit genug reichliche Erfahrung gesammelt hast, um Weisheit zu besitzen! Richte mit solchen Worten dein Volk auf! Lehre das Brot den Hungernden brechen, die Obdachlosen beherbergen, die Nackten bekleiden, die Mitbürger achten! Jetzt lehre vor allem, daß nicht aus dem Überflusse, sondern aus der Not unser Glück kommt, und daß Gott an diesem unserem Opfer mehr Freude hat als an vielen, reichlichen Spenden und Gaben! Außerdem, ja vor allem sei mir heute ein Moses oder Phinees! Tritt ein für uns und versöhne uns! Beseitige die Heimsuchung durch geistiges Opfer oder durch Gebet und vernünftige Vermittlung! Beschwichtige durch dein Eintreten den Zorn des Herrn! Halte weitere Züchtigungen auf! Der Herr weiß das Alter eines Vaters, der für seine Kinder fleht, zu ehren. Lege Fürbitte ein für die Sünden, die geschehen sind, und verbürge dich für die Zukunft! Opfere dem Herrn dein Volk, das durch Leiden und Furcht geläutert ist! Bitte um irdische Nahrung, ganz besonders aber um die englische, himmlische Speise! Auf solche Weise wirst du Gott versöhnen, den Himmel besänftigen, Früh- und Spätregen erwirken. „Der Herr wird seine Barmherzigkeit zeigen und unsere Erde wird ihre Früchte spenden“, d. h. die Erde des Ackers wird das tägliche Brot, die Erde (unseres Fleisches) die ewige Frucht geben, welche wir in den göttlichen Scheunen durch dich, der du uns und unsere Gaben opferst, aufspeichern in Christus Jesus, unserem Herrn, dem die Ehre sei in alle Ewigkeit! Amen.XVII. Rede</p><h2>XVII. Rede</h2><p><em>XVII. Rede.</em></p><p><em>An die geängstigten Einwohner von Nazianz und an den zürnenden Statthalter</em>.</p><p>„In meinen Eingeweiden, in meinen Eingeweiden empfinde ich Schmerz und die Gefühle meines Herzens sind stürmisch“, sagt einmal in seinen Reden Jeremias, der feinfühlendste unter den Propheten. Er klagt daselbst über den Ungehorsam Israels, das sich von der Liebe Gottes abgewendet hatte. Bildlich nennt er seine Seele „Eingeweide“. In dieser Weise wird sie oftmals in der Schrift bezeichnet, da die Seele gleich den Eingeweiden einerseits etwas Verborgenes und Unsichtbares ist, anderseits die Bestimmung hat, die geistige Nahrung aufzunehmen und gewissermaßen wiederzugeben; was nämlich für den Leib die Speise, ist für die Seele der Geist. „Die Gefühle“ sind wohl die Regungen und Gedanken der Seele und zwar vor allem jene, welche durch die Sinne veranlaßt werden und welche den Gerechten packen, erhitzen, aufregen und im Feuer des Geistes aus der Fassung bringen; denn das Verbum* μαιμάσσειν* [maimassein] (stürmisch werden) bedeutet ungestüme Leidenschaft. Versteht man aber unter den Gefühlen die des Körpers, so greift man auch nicht fehl, da auch Augen und Ohren nicht nur schmerzlich berührt werden, wenn sie Arges sehen, bzw. hören, sondern auch aus Mitleid sich sehnen, Besseres zu sehen, bzw. zu hören. Doch mag man den Ausdruck verstehen, wie man will, auf jeden Fall ist es der Gerechte, welcher Schmerz empfindet und stürmisch erregt wird. Und sehr erbittert ist Jeremias über die Leiden Israels, mag man nun darunter die von den Sinnen erfaßten körperlichen Drangsale verstehen oder die Leiden der Seele, welche vom Geiste wahrgenommen werden. Derselbe Prophet wünscht sich nämlich an anderer Stelle eine Quelle von Tränen und sehnt sich nach einem völlig abgelegenen Orte und begehrt nach der Einsamkeit, um sein schmerzbeladenes Herz zu entleeren, in der Stille Israel zu beweinen und so in seinem Seelenleide etwas erleichtert zu werden.</p><p>Etwas früher hatte der treffliche David in ähnlicher Weise über sein Schicksal geklagt. „Wer gibt mir ― fragt er ― Flügel gleich einer Taube, daß ich fortfliege und Ruhe finde?“ Um von den ihn umgebenden Leiden möglichst weit wegzukommen, wünscht er sich Taubenflügel, entweder weil sie so leicht und rasch sind wie jeder Gerechte, oder weil sie an den Geist erinnern, mit dessen Hilfe allein es uns möglich ist, den Gefahren zu entgehen. Hiebei gibt er das Heilmittel für die Zeit der Not an, nämlich die Hoffnung. „Ich hoffte ― sagt er ― auf Gott, der mich von Kleinmut und Stürmen befreit.“ Es ist bekannt, daß er auch sonst so handelte. Denn gar rasch bietet er dem Betrübten Arznei und durch Wort und Tat weist er ihm einen guten Weg zur Standhaftigkeit im Unglück. „Meine Seele ― sagt er ― wollte sich nicht trösten lassen.“ Hörst du, wie aus diesen Worten die Niedergeschlagenheit und Verzweiflung spricht? Fürchtest du nicht, David möchte nicht mehr zu helfen sein? Was sagst du? Du willst dich nicht trösten lassen? Du willst verzweifeln? Sollte dir niemand helfen können? Kein Wort, kein Freund, kein Verwandter, kein Ratgeber, keiner, der an deinem Schmerze teilnimmt, keiner, der auf seine eigenen Erlebnisse verweist oder von früheren Schicksalen erzählt oder durch Vergleiche zeigt, daß andere in noch viel schlimmerer Lage waren und doch wieder daraus gerettet wurden? Ist alles umsonst, wertlos, verloren? Ist alle Hoffnung geschwunden? Bleibt nichts anderes übrig, als sich niederzulegen und das Ende abzuwarten? Ist das der große David, dem sonst im Leid sich das Herz erweitert hatte, und der sich, trotzdem ihn Todesschatten umgeben hatten, doch wieder mit Gottes Hilfe erhoben hatte? Was habe erst ich auszuhalten, der ich klein, schwach, irdisch bin und nicht diesen Geist besitze? Wenn sich ein David nicht mehr auskannte, wer wird dann noch durchkommen? Welche Hilfe, welchen Trost kann ich noch in meinem Leiden finden? Zu wem soll ich in meiner Not fliehen? David, der große Arzt, der durch den in ihm wohnenden Geist mit seinem Gesang die bösen Geister bewältigt hatte, gibt die Antwort. Zu wem du fliehen sollst, möchtest du von mir erfahren. Weißt du es selber nicht? Wer ist es, der die müden Hände stärkt und die erschlafften Knie kräftigt, der durch das Feuer führt und aus dem Wasser befreit? Nicht brauchst du ― antwortet dir David ― Heere, nicht Waffen, nicht Bogenschützen, nicht Reiter, nicht Ratgeber, nicht Freunde, nicht fremde Hilfe. In dir selbst hast du die Hilfe; ich selbst habe sie und jeder hat sie, der sie haben will. Man muß sie nur haben wollen, darnach verlangen. Nahe ist der Trost; er ist in deinem Munde, in deinem Herzen. „Ich erinnerte mich an Gott, ― sagt David ― und Freude kehrte in mir ein.“ Was ist leichter als sich erinnern? Erinnere auch du dich und freue dich! Wie leicht kann man das Heilmittel erhalten! Wie rasch ist Gesundung zu finden! Wie groß ist die Gabe! Denken wir an Gott, dann nimmt er uns nicht nur Kleinmut und Trauer, er schenkt uns auch Freude.</p><p>Willst du noch andere Aussprüche über Gottes Liebe hören? Es heißt: „Wenn du dich unter Seufzen an den Herrn wendest, wirst du gerettet werden.“ Wie ihr sehet, ist mit dem Seufzen die Rettung schon verbunden. Ferner heißt es: „Während du noch redest, wird (der Herr) zu dir sagen: Siehe, hier bin ich! und er wird zu deiner Seele sprechen: Ich bin dein Heil.“ Zwischen die Bitte und ihre Erfüllung muß nicht erst noch etwas dazwischen treten, nicht Gold, nicht Silber, nicht glänzende, kostbare Steine, nichts von all dem, wodurch Menschen erst umgestimmt werden. Sophonias sagte einmal im Namen des zürnenden und erbitterten Gottes: „Ich will ihre Straßen vollständig verwüsten, daß niemand mehr darauf wandelt; verödet sind ihre Städte, da niemand sie bewohnt.“ Nachdem er aber die schrecklichsten Drohungen ausgesprochen, die Herzen entmutigt und durch die Drohungen verfinstert hatte, läßt er sofort das Licht der guten Hoffnung leuchten und sucht mich zu gewinnen mit den Worten: „Wahrlich sage ich: Fürchtet mich, und nehmet meine Lehre an, und keineswegs werdet ihr aus der Stadt vertilgt werden.“ Und bald darauf spricht er die noch freundlicheren und lieblicheren Worte: „In jener Zeit wird der Herr sagen: Habe Mut, Sion, deine Hände sollen nicht ermüden! Der Herr, dein Gott, ist in dir, er kann dich retten. Freude wird er dir bringen und in seiner Liebe wird er dich erneuern. Die Bedrängten wird er versammeln, die Niedergeschlagenen erlösen und die Verstoßenen aufnehmen.“ Solchen Mut wünschen die heiligen Männer und die Erwägungen der Vernunft, ihn verlangen auch meine Worte. „Nehmet hin die Worte der Weisheit!“ fordert der treffliche Salomon auf, damit ihr nicht in die Grube der Leiden stürzet und fluchet und nicht von eurer eigenen Torheit noch mehr als vom jetzigen Schicksal verschlungen werdet!</p><p>Brüder, die Menschengeschichte dreht sich im Kreise, und Gott erzieht uns durch Gegensätze. Wie er das Weltall weise geordnet und zusammengefügt hat, so sorgt er in weiser Regierung durch seine unfaßbaren, unerforschlichen Gerichte für alles, u. a. auch für uns. Das All bewegt sich gewissermaßen um den Unbeweglichen. Und es schwankt, natürlich nicht in seinen Gesetzen, da die Gesetze überall fest und unbeweglich sind, mögen sie auch von unserer Schwachheit nicht begriffen werden, sondern es schwankt in den Augen derer, welche in ihm täglich leben und mit ihm in Konflikt geraten. Es ist ein alter, fester Grundsatz Gottes, sich vor unseren Augen in der Finsternis zu verstecken und die vielen Pläne seiner Fürsorge nur in dunklen Rätseln und Bildern sehen zu lassen. Entweder will er auf solche Weise unseren Hochmut zähmen und uns zur Erkenntnis, daß wir neben der ersten und wahren Weisheit nichts sind, führen, damit wir uns einzig und allein vor ihm beugen und darnach streben, stets von seinen himmlischen Strahlen erleuchtet zu werden, oder er will uns durch die Unbeständigkeit dessen, was wir in Bewegung sehen, zu dem leiten, was fest bleibt. Beweglich, unbeständig, ungenügend, vollständig ungleich ist, wie gesagt, alles: Heiterkeit und Verdrossenheit, Reichtum und Armut, Kraft und Schwäche, Erniedrigung und Hoheit, Gegenwart und Zukunft, Eigentum und Fremdherrschaft, Kleinheit und Größe usw. Was ungleich ist, ist darin gleich, daß es sich in allem verändert. Alles dreht sich, ändert sich und wechselt so rasch, daß man noch eher den Winden und einer auf Wasser gezeichneten Schrift als dem Glück der Menschen trauen darf. Neid hemmt das Glück, Mitleid das Unglück. Und dies ist meines Erachtens weise und wunderbar eingerichtet; denn der Schmerz soll nicht ohne Trost und das Glück nicht ohne Zuchtmeister sein.</p><p>Klug handeln jene, welche durch Unglück sich belehren lassen und welche, nachdem sie geläutert worden sind, wie das Gold im Feuer geläutert wird, also bekennen: „Es ist gut für mich, daß du mich gedemütigt hast, auf daß ich deine Gebote lerne.“ Verdemütigung erzeugt nämlich Verständnis für die Gebote. Sie machen die gleiche Erfahrung wie Petrus, der in dem Augenblick, da er zu versinken drohte, um Hilfe rief. Infolge ihres Leides treten sie Gott näher; in ihrer Bedrängnis gewinnen sie den Wohltäter. Denn eine bekümmerte Seele ist Gott nahe, und Not führt zu dem, der geben kann, der aber, wenn er uneingeschränkt spenden würde, wohl verachtet würde. Darum, Brüder, wollen wir die Herzen erheben und zu jeder Zeit und in jeder Lage gute Hoffnung hegen! Lassen wir in der Freude nicht die Furcht und im Leid nicht die Hoffnung vermissen! Denken wir bei heiterem Himmel an den Sturm und bei Sturm an den Steuermann! Nicht wollen wir in der Drangsal mißmutig werden. Gleichen wir nicht schlimmen Sklaven, welche ihren Herrn preisen, solange er gut ist, von ihm aber nichts wissen wollen, sobald er straft! Jedenfalls ist bisweilen Schmerz besser als Gesundheit, Ertragen besser als Ruhm, Anspannung besser als Ausspannung, Zurechtweisung besser als Nachsicht. Um es kurz zu sagen: Im Unglück wollen wir nicht zusammenbrechen, in guten Tagen nicht übermütig werden!</p><p>[Forts. v. ] Unterwerfen wir uns Gott, den Mitmenschen und den irdischen Herrschern, und zwar Gott, weil alles dazu auffordert, den Mitmenschen, weil die Bruderliebe es verlangt, den Herrschern um der Ordnung willen und diesen um so mehr, je milder und gütiger sie sind! Gefährlich ist es, ständig Nachsicht zu beanspruchen und so die Milde zu erschöpfen. Wenn wir Windstille mit Sturm verscheuchen, Licht durch Finsternis verdrängen und mit Honig Wermut mischen, müßten wir dafür gestraft werden, daß die Herrscher sich zur Schärfe verleiten lassen. Eines unserer Gesetze, eine der berühmten, trefflichen Forderungen des Geistes, der nur das Mögliche gutheißt und verlangt, lautet: Wie die Knechte ihren Gebietern, die Frauen ihren Männern, die Kirche dem Herrn, die Jünger den Hirten und Lehrern zu gehorchen haben, so müssen wir uns allen vorgesetzten Obrigkeiten fügen und ihre Steuern entrichten und zwar nicht nur, weil wir ihren Zorn fürchten, sondern auch aus Gewissensgründen. Nicht sollen wir wegen unserer Vergehen das Gesetz hassen und das rächende Schwert erwarten müssen, vielmehr sollen wir uns aus Furcht reinhalten, um von der Obrigkeit gelobt zu werden.</p><p>Ein und dasselbe Gesetz wirkt gegenüber dem Guten schonend, gegenüber dem Übermaße einschränkend. Ein und dieselbe Sonne wirkt erleuchtend auf das gesunde Auge, blendend aber auf das kranke. Soll ich auch noch offen aus unserer Geschichte ein Beispiel anführen? Ein und derselbe Christus gereicht den Ungläubigen zum Falle, den Gläubigen aber zur Auferstehung. Während Christus für jene, welche nicht zur Erkenntnis und Einsicht gelangt sind, sondern in Finsternis wandeln, soferne sie Götzen dienen oder nur den Buchstaben kennen, über diesen hinaus aber nichts wissen wollen und können, ein Stein des Anstoßes und Ärgernisses ist, ist er für jene, welche sich vom Verstand binden lassen und sich auf den Felsen stellen, ein Eckstein und ein gepriesener Fels, bzw. jene Perle, welche sich der gute Händler gegen Hingabe all seines Besitzes erwarb. Brüder, wenn wir, obwohl wir nicht unsere Pflicht tun, über unsere Obrigkeit aufgebracht sind, dann gleichen wir demjenigen, der, obwohl er die Kampfgesetze außer acht gelassen hat, sich über die Ungerechtigkeit des Kampfrichters beklagt, oder demjenigen, der, obwohl er schwerkrank darniederliegt und strenger Eingriffe bedarf, doch den Arzt, weil er schneidet und brennt, als dumm und waghalsig beschuldigt. Den Untergebenen möchte ich mit diesen Bemerkungen Trost und Belehrung geben, ich, der arme Hirte, der Erzieher dieser kleinen Herde, der es für seine Hirtenpflicht erachtet, sich mit den Fröhlichen zu freuen und mit den Trauernden zu klagen.</p><p>Wie steht es aber mit euch, ihr Herrscher und Beamten? Mit euch habe ich nunmehr zu reden. Wir wollen nämlich nicht den Anschein erwecken, als wären wir ungerecht, als würden wir wohl die einen an ihre Pflicht erinnern, den Beamten aber nichts zu sagen haben und aus Respekt oder Furcht auf unsere christliche Freiheit verzichten, oder als würden wir wohl für die einen sorgen, euch aber vernachlässigen, um welche man sich um so mehr kümmern muß, je mehr sich die Sache der Entscheidung nähert und je größer die Reparation ist, die gefordert wird. Voreingenommenheit sei mir und meiner Rede ferne! Was habt ihr nun zu sagen? Wie verständigen wir uns? Werdet ihr rückhaltlos mein Wort hinnehmen? Das Gesetz Christi hat euch meiner Herrschaft und meiner Jurisdiktion unterstellt. Denn auch wir sind Herrscher, ja wir sind es in höherer und vollkommenerer Weise. Oder soll etwa der Geist dem Fleische und das Himmlische dem Irdischen nachgeben? Du wirst mein freies Wort hinnehmen. Du bist, wie ich weiß, ein Schäflein meiner Herde, ein heiliges Schäflein der heiligen Herde, ein Zögling des großen Hirten, der seit langer Zeit vom Geiste gut geführt und gleich uns vom Lichte der heiligen, seligen Dreifaltigkeit erleuchtet wird. Meine Rede an dich ist daher kurz und bündig.</p><p>[Forts. v. ] Du übst deine Herrschaft und Verwaltung mit uns aus. Von Christus hast du das Schwert empfangen, nicht um es zu ziehen, sondern um damit zu drohen. Als reines Weihgeschenk werde es für den, der es dir gegeben hat, bewahrt! Du bist ein Bild Gottes. Auch, worüber du herrschest, ist sein Bild. Auf dieser Erde wird es regiert, dann aber tritt es in ein anderes Leben ein, in welches wir alle übertreten werden, nachdem wir ein wenig im Gefängnis, bzw. in der Rennbahn oder in der Vorschule und im Dunkel dieses Lebens getändelt haben. Ehre diejenigen, welche die gleiche Natur haben wie du! Achte das Urbild! Halte es mit Gott, nicht aber mit dem Fürsten der Welt! Halte es mit dem guten Herrn, nicht aber mit dem grausamen Tyrannen! Dieser war Menschenmörder von Anbeginn und hatte den ersten Menschen durch Ungehorsam verwundet; er ist schuld an den Mühen des Lebens und hat durch die Sünde das Strafrecht eingeführt. O Mann Gottes, denke daran, wessen Geschöpf du bist, wozu du berufen wurdest, was du besitzest, welche Pflichten dir auferlegt sind, wer dir die Vernunft, das Gesetz, die Propheten, die Erkenntnis Gottes, das Vertrauen auf die Zukunft gegeben hat! Ahme daher Gottes Güte nach! Gerade das Wohltun vergöttlicht am meisten den Menschen. Mühelos kannst du Gott werden. Versäume nicht die Gelegenheit zur Vergöttlichung!</p><p>Die einen verzichten um des Geistes willen auf Hab und Gut, andere auf ihre körperlichen Bedürfnisse; sie töten sich um Christi willen ab und ersterben vollständig der Welt. Andere weihen Gott ihr Teuerstes. Du hast gewiß schon von dem Opfer Abrahams gehört. Er hatte Gott seinen eingeborenen Sohn, der ihm auf Grund einer Verheißung geboren worden war und auf den sich die Verheißung bezog, mit noch größerer Liebe geopfert, als er ihn seinerzeit von Gott empfangen hatte. Nicht solche Opfer fordern wir von dir. Schenke statt aller anderen Gaben Gott die Barmherzigkeit, worüber er sich mehr freut, als über alle anderen Geschenke zusammen! Sie ist eine wahrhafte, eine tadellose Gabe, welche Gottes Wetteifer herausfordert. Verbinde Milde mit Schrecken, Hoffnung mit Drohung! Güte vermag, wie ich weiß, viel gutzumachen; sie führt zur notwendigen Genugtuung. Wir müssen nur, wenn wir Anlaß haben, mit Gewalt einzuschreiten, Nachsicht üben und durch Mitleid und Wohlwollen die Menschen bezwingen. Lasse dich durch nichts zu einer Handlung hinreißen, welche deiner Stellung unwürdig ist! Nichts darf dich veranlassen, auf Barmherzigkeit und Milde zu verzichten, keine Zeitverhältnisse, keine Herrscher, keine Furcht, nicht Hoffnung auf höhere Ämter, nicht Dünkel und Selbstbewußtsein! Erwirb dir für die Zeiten der Drangsale das himmlische Wohlwollen! Schenke Gott deine Barmherzigkeit! Noch niemand hat es bereut, Gott etwas geopfert zu haben. Er kann reichlich vergelten. Denen, welche etwas zuvor bei ihm hinterlegt und ausgeliehen haben, vergilt er meist mit himmlischen Gütern, gelegentlich aber auch mit irdischen, um den Glauben an die jenseitigen zu wecken.</p><p>Noch eine kurze Zeit, und die Welt vergeht, und das Zelt wird abgebrochen. Nützen wir die Zeit aus! Erkaufen wir uns die bleibenden Güter mit den unbeständigen! Jeder von uns verdient Strafe. Der Staub ist mit viel Schuld beladen. Verzeihen wir, damit uns verziehen werde! Schenken wir Nachsicht, damit wir Nachsicht erlangen! Wie du aus dem Evangelium weißt, wurde einer, der viele Talente schuldig war, vorgeführt, aber von seinen Schulden freigesprochen; der Herr nämlich, dem er vorgeführt wurde, war gut. Allerdings, obwohl ihm verziehen wurde, verzieh er selbst nicht; denn er hatte sklavische Gesinnung. Die Nachsicht, welche ihm trotz seiner großen Schulden geschenkt worden war, schenkte er nicht seinem Mitknechte, trotz dessen kleinerer Schulden; nicht einmal das hochherzige Vorbild der Nächstenliebe hatte auf ihn Einfluß. Der Herr wurde zornig. Das Übrige verschweige ich. Es ist auf jeden Fall für jeden besser, in diesem Leben sich mit Rücksicht auf das andere Leben mildtätig zu erweisen.</p><p>[Forts. v. ] Was hast du zu bemerken? Fügst du dich meinen Worten, welche du nach deinem wiederholten Eingeständnis liebtest, du trefflichster und ― es sei noch beigefügt! ― du mildester unter den Statthaltern? Oder soll ich zur Versöhnung auch noch auf dieses graue Haar, die Zahl der Jahre und das lange, tadellose Priestertum hinweisen, vor dem wohl selbst die Engel, die reinen Diener des Reinsten, Ehrfurcht haben, weil es ihrem eigenen Dienste entspricht? Läßt du dich dadurch überreden? Oder muß ich noch kühner werden? Der Schmerz macht mich kühn. Ich erinnere dich an Christus, an Christi Selbstentäußerung um unsertwillen, an die Leiden des Leidenslosen, an sein Kreuz, seine Nägel, welche mich von der Sünde erlöst haben, an sein Blut, sein Grab, seine Auferstehung, seine Himmelfahrt, an diesen Tisch, zu welchem wir gemeinsam kommen, und an die Typen meines Heiles, welche ich mit dem gleichen Munde, mit dem ich diese Worte an dich richte, feiere, ich meine das heilige, uns zum Himmel führende Geheimnis.</p><p>Sollte einer von diesen Gründen nicht genügen, so mögen sie alle zusammen dich bewegen, mir und dir selbst, sowie deinen christlichen Hausgenossen und dieser ansehnlichen Christengemeinde gnädig zu sein, welche, wie du glauben darfst, sich unserer Bitte anschließt, mag sie auch uns wegen der uns anvertrauten Würde die Vermittlung überlassen und durch amtliche Verordnung zugleich verhindert sein, die Bitte zu stellen. Nur in diesem einen Falle lasse dich besiegen! Es gereicht dir zur Ehre. Uns besiege durch deine Güte! Siehe, vor Gott und den Engeln um des himmlischen Reiches und der himmlischen Vergeltung willen führe ich meine Schützlinge zu dir! Mache dem Vertrauen, das man mir schenkt und das ich geschenkt habe, Ehre, damit du in noch wichtigeren und höheren Dingen Vertrauen findest! Vor allem darfst du nicht vergessen: Du hast einen Herrn im Himmel. Möge er als Richter dich so behandeln, wie du als Richter deine Untertanen behandelst! Möge es uns allen schon hier gut und im Jenseits noch besser ergehen in Christus Jesus, unserem Herrn, dem die Herrlichkeit und Macht, die Ehre und Herrschaft sei mit dem Vater und dem Heiligen Geiste, wie es war und sein wird, jetzt und in alle Ewigkeit! Amen.XVIII. Rede</p><h2>XVIII. Rede</h2><p><em>XVIII. Rede.</em></p><p><em>Grabrede auf den Vater, in Gegenwart des Basilius</em>.</p><p>O Mann Gottes, treuer Diener, Verwalter der göttlichen Geheimnisse, ersehnter Mann des Geistes! Diese Bezeichnung verleiht die Schrift den fortgeschrittenen, großen Männern, welche über dem Sinnlichen erhaben sind. Ich nenne dich aber auch „Gott Pharaos“, d. i. Gott der ganzen ägyptischen, feindlichen Macht, ferner „Säule und Grundfeste“ der Kirche, „Wille des Herrn“, „Stern, der in der Welt das Lebenswort bietet“, Stütze des Glaubens und Wohnung des Geistes. Wie sollte ich alle Titel aufzählen können, welche du dir bald durch diese, bald durch jene Tugend erworben und zu eigen gemacht hast?</p><p>[Forts. v. ] Sage mir doch, woher bist du gekommen, was tust du, wem willst du hier bei uns die Ehre geben? Denn ich weiß, daß du dich in allem, was du tust, von Gott führen und veranlassen und von dem Wohl derer, welche dich aufnehmen, bestimmen läßt. Bist du gekommen, uns zu sehen oder den Hirten aufzusuchen oder die Herde zu inspizieren?* Wir* sind (eigentlich) nicht mehr da, (mit dem Verstorbenen) sind wir größtenteils dahingegangen und wollen von dem Jammertale nichts wissen, vor allem jetzt nicht, nachdem wir den weisen Steuermann, die Leuchte unseres Lebens, verloren haben, der uns von Gott das Licht des Heiles brachte, um uns, soferne wir darauf achten, emporzurichten.* Der Hirte* ist fortgegangen mit allem Guten und aller Hirtenklugheit, welche er sich in langer Zeit erworben hatte; er war reich wie an Jahren, so an Erkenntnissen, und war ― um mit Salomon zu reden ― „gekrönt mit ruhmvollem Alter“.* Die Herde* ist geschlagen und in Bedrängnis, sie ist, wie du siehst, voll Mutlosigkeit und Niedergeschlagenheit. Nicht mehr erholt sie sich auf Weideplätzen, nicht mehr erquickt sie sich an erfrischenden Wassern. Sie sucht nach Abgründen, Einöden und Schluchten, wo sie sich zerstreuen und zugrunde gehen wird. Nicht kann sie es glauben, daß sie je wieder einen verständigen Hirten bekommen werde. Sie ist fest überzeugt, daß dies nicht der Fall sein wird, und sie wäre schon zufrieden, wenn der Nachfolger nur nicht viel minderer wäre.</p><p>Die drei genannten Faktoren, wir, der Hirte und die Herde, haben alle in gleicher Weise dein Kommen veranlaßt. Entsprechend deinem seelsorglichen Verständnis gib jedem, was er braucht, und walte mit Klugheit deines Redneramtes, damit wir deine Weisheit noch mehr bewundern! Wie aber wirst du dieses Amt ausüben? Den Hirten wirst du wegen seiner Tugendhaftigkeit gebührend loben, nicht nur, um dem Reinen eine reine Grabrede zu halten, sondern um seinen Lebenswandel anderen als aufmunterndes Vorbild der Frömmigkeit hinzustellen. Uns wirst du in Kürze weise Lehren geben über Leben und Tod, über die Einigung und Trennung von Leib und Seele und über die beiden Welten, von welchen die eine, die vor unseren Augen liegt, unbeständig ist, die andere, die mit dem Geiste erfaßt wird, von Dauer ist. Uns wirst du überreden, das, was falsch, ohne Ordnung und unausgeglichen ist und gleich den Wogen in beständigem Auf und Nieder sich befindet, zu verachten, dagegen sich dem, was fest und solid und göttlich ist, sich gleich bleibt und keine Aufregung und keine Zerstörung kennt, anzuschließen. Die, welche vor uns hingegangen sind, werden uns nicht so sehr Schmerz als Freude bereiten, wenn dein Wort uns von dieser Welt ablenkt und in den Himmel versetzt, wenn es die freudelose Gegenwart durch den Gedanken an die Zukunft verhüllt und wenn es uns überzeugt, daß auch wir zu einem guten Herrn eilen, daß es besser ist, in der Heimat, als ferne von ihr zu weilen, daß der Übergang ins Jenseits für die Kämpfer dieser Erde dasselbe ist, wie für die Seefahrer die Landung in einem ruhigen Hafen oder daß, gleichwie die, welche einen weiten Weg bereits zurückgelegt haben, sich leichter und freier fühlen als die, welche mühsame Märsche machen, ebenso diejenigen, welche die himmlische Herberge schon erreicht haben, besser und günstiger daran sind als die, welche noch die krummen und abschüssigen Wege dieses Lebens wandeln.</p><p>In solcher Weise wirst du uns ermuntern. Wie aber wirst du die Herde trösten? Zunächst wirst du versprechen, daß du sie führest und leitest; denn du bist der, unter dessen Flügeln alle gerne ruhen und nach dessen Stimme sie mehr dürsten, als die vom Durste Gequälten nach reiner Quelle verlangen. Alsdann wirst du uns überzeugen, daß wir auch jetzt nicht von dem guten Hirten verlassen sind, der sein Leben für seine Schafe hingibt, daß er vielmehr noch zugegen ist, die Schafe weidet und führt, die Seinigen kennt und von den Seinigen gekannt wird, wenn er auch nicht mit den Sinnen geschaut wird, sondern geistig verkehrt, daß er für seine Herde gegen die Wölfe kämpft, niemandem gestattet, diebisch und hinterlistig in den Stall einzusteigen und die von der Wahrheit trefflich geführten Seelen mit ungewohnter Stimme zu entführen und zu rauben. Ich bin überzeugt, daß der Verstorbene jetzt durch seine Fürbitte mehr wirkt als früher durch seine Belehrungen, soferne er Gott näher ist, da er die körperlichen Fesseln abgeschüttelt und sich von dem den Geist verunreinigendem Schmutze frei gemacht hat und mit dem ersten, reinsten, lauteren Geiste als lauteres Wesen verkehrt, gewürdigt ― wenn man so sagen darf ― englischer Hoheit und Freiheit. Darüber wirst du, da du die Kraft des Wortes und Geistes besitzest, besser diskutieren und belehren, als ich mich darüber aussprechen könnte. Damit nicht durch Außerachtlassung seiner Vorzüge meine Rede zu wenig seiner Würde gerecht werde, will ich in kurzen Umrissen auf Grund persönlicher Erlebnisse sein Bild zeichnen, um es dann deiner Tüchtigkeit zu überlassen, genauer die Schönheit seines Tugendwandels für die Ohren und den Geist aller zu schildern.</p><p>Nicht will ich von der Heimat des Verstorbenen, seiner Familie, seinen körperlichen Vorzügen, seinen äußeren Würden oder all dem, worauf die Menschen stolz sind, sprechen; ich will es Lobrednern überlassen. Ich beginne mit dem, was uns das Wichtigste ist und am nächsten liegt. Der Verstorbene war der Sprosse nicht berühmten Geschlechtes; dasselbe hatte sich nicht durch Frömmigkeit ausgezeichnet. Nicht schäme ich mich nämlich meiner Vorfahren; ich vertraue auf das Ende. Sein Geschlecht war nicht in das Haus Gottes verpflanzt. Zwei große Gegensätze, heidnischer Irrtum und Gesetzeswahnsinn, waren in seinem Geschlechte gar sonderbar und widersinnig vermischt; einen Teil dieser Irrtümer vermied es, einen Teil nahm es auf. Seine Vorfahren verwarfen zwar die heidnischen Götzen und Opfer, verehrten aber das Feuer und die Lichter; sie beobachteten den jüdischen Sabbat und das Verbot gewisser Speisen, wollten aber von der Beschneidung nichts wissen. Hypsistarier nennen sich die Armseligen. Ihr höchstes Wesen ist allein der Schöpfer. Wer führte nun ihn, dessen Religion so verschiedene Elemente in sich schloß, zu dem Ziele, das er erreicht hatte? Ich weiß nicht, soll ich mehr die Gnade preisen, welche ihn gerufen hatte, oder seinen guten Willen. Auf jeden Fall hat er die ihn belästigende Krankheit seines geistigen Auges in einer Weise beseitigt und ist so schnell zur Wahrheit geeilt, daß ich mich darüber, daß er um des himmlischen Vaters und des wahren Erbes willen den Verlust der Mutter und eines Teiles seines Vermögens ertrug und diese Kränkung gelassener hinnahm als andere die größten Ehren, nicht so sehr wundere, so sehr man ihn auch deshalb bewundern muß. Und warum? Diesen Eifer hat er ja mit vielen anderen gemeinsam und es müssen doch alle in das große Netz Gottes eingehen und sich von den Lehren der Fischer fangen lassen, mögen auch die einen früher, die anderen später durch das Evangelium gebunden werden. Was mich von seiner Bekehrungsgeschichte besonders ergreift, muß ich mitteilen.</p><p>Als der Verstorbene noch außerhalb unseres Schafstalles war, gehörte er schon zu uns. Sein sittliches Leben hatte ihn mit uns verbunden. Wie viele von uns eigentlich nicht zu uns gehören, da ihre Lebensführung sie dem gemeinsamen Körper entfremdet, so gehören anderseits viele der Außenstehenden zu uns, soferne ihr sittliches Verhalten dem Glauben vorauseilt und ihnen nur der Name, nicht die Sache fehlt. Zu den letzteren zählte auch mein Vater; er war zwar ein fremder Zweig, doch durch sein Leben hatte er sich zu uns geneigt. Durch seine weise Mäßigung hatte er sich so sehr ausgezeichnet, daß er der Liebste und Einfältigste zugleich war, was schwer zusammenfällt. Gibt es einen besseren und deutlicheren Beweis für seine Gerechtigkeit als den, daß er, nachdem er in nicht unbedeutende staatliche Stellen eingerückt war, sein Vermögen auch nicht um eine einzige Drachme vermehrte, obwohl er doch sehen mußte, daß die anderen Beamten ihre Briareos-Hände nach Volkseigentum ausstreckten und gierig nach bösen Mitteln ― ich meine ungerechten Reichtum ― strebten? Auch nicht wenige Beweise für seine Klugheit wären zu erbringen; ich will davon mehrere aber erst im Laufe der Rede erwähnen. Hiefür erhielt mein Vater, wie ich glaube, als Lohn den (wahren) Glauben. Auf welche Weise er sich denselben erwarb, darf nicht verschwiegen werden; ich will es dartun.</p><p>[Forts. v. ] Die göttliche Schrift sagt mir: „Wer wird ein starkes Weib finden?“ Ein solches Geschenk wird von Gott verliehen; der Herr ist es, welcher eine gute Gattin in die Ehe gibt. Auch die Heiden haben diese Wahrheit erkannt. Einer von ihnen sagt nämlich: „Der Mann kann nichts Schöneres gewinnen als ein edles Weib, aber auch nichts Schlimmeres als ein böses.“ Man kann nicht sagen, daß jemand in der Ehe glücklicher war als der Verstorbene. Wenn einer nicht den Gang in die äußerste Ferne und zu allen möglichen Menschen scheute, um die beste Ehe zu gründen, dann gibt es wohl nichts Besseres und Innigeres als diese. Das Vorzüglichste von männlicher und weiblicher Natur hatte sich geeint, so daß die Ehe ebensosehr eine körperliche wie seelische Verbindung war. Mochten sie anderen Menschen gegenüber Vorzüge aufweisen, gegenseitig konnten sich die beiden nicht übertreffen, so gleichmäßig und gleichwertig war ihre seelische Begabung.</p><p>Das Weib, welches dem Adam zur Unterstützung gegeben worden war, weil es nicht gut war, daß der Mensch allein blieb, wurde ihm keine Gehilfin, sondern eine Feindin, keine Genossin, sondern eine Gegnerin. Durch Sinnlichkeit hatte sie ihren Mann verführt und durch den Baum der Erkenntnis hatte sie ihn um den Baum des Lebens gebracht. Meinem Vater aber war das Weib, das ihm Gott geschenkt hatte, nicht nur eine Gehilfin, was noch nichts Besonderes wäre, sie wurde ihm auch eine Führerin, die ihn durch Wort und Tat persönlich zum besten geleitete. Sie hielt es für das beste, sich dem Gesetze der Ehe zu fügen und sich darum dem Manne unterzuordnen, doch schämte sie sich nicht, sich als Lehrerin in religiösen Fragen anzubieten. Seine Frau verdient es, daß man sie deswegen bewundert, noch größere Bewunderung aber gebührt ihrem Manne, weil er ihr gerne nachgab. Im Gegensatz zu anderen Frauen, welche sich auf ihre natürliche oder gekünstelte Schönheit viel einbilden, kannte sie nur eine einzige Schönheit, nämlich die der Seele und des göttlichen Ebenbildes, das sie entweder bewahrte oder nach Kräften wieder reinmachte. Künstlich aufgetragene Schönheit überließ sie den Schauspielerinnen. Wahre Vornehmheit sah sie nur im frommen Leben und in der Erkenntnis unseres Ursprunges und unseres Zieles. Das Almosen für Gott und an die Armen, vor allem an unglückliche Verwandte, hielt sie allein für sicheren, unentwendbaren Reichtum. Ihnen nur das Notdürftigste zu bieten, erschien ihr nicht als Linderung der Not, sondern als Erinnerung daran; nur durch freigebiges Spenden glaubte sie ihre Ehre zu retten und andere vollständig zu trösten. Während die einen Frauen sich durch Sinn für häuslichen Wohlstand, andere durch Frömmigkeit auszeichnen ― zu Wohlstand und Frömmigkeit zugleich zu gelangen ist nämlich schwer ―, hat sie alle Frauen in beiden Beziehungen übertroffen. Nicht nur erreichte sie in beider Hinsicht das Höchste, sie allein hat es auch verstanden, beides zu einen. Den Wohlstand ihres Hauses erhöhte sie gemäß den von Salomo für die starke Frau gegebenen Anleitungen und Bestimmungen durch ihre Sorgfalt und Umsicht in einer Weise, als hätte sie von Frömmigkeit nichts gewußt; Gott und dem göttlichen Leben widmete sie sich in einer Weise, als wenn sie sich um das Familienleben gar nicht gekümmert hätte. Der weltliche Dienst war ihr kein Hindernis für den göttlichen Dienst; vielmehr forderte der eine den anderen.</p><p>[Forts. v. ] Sie kannte genau die Gebetszeiten und die Gebetsstätten. Das Gebet war ihr die wichtigste Tagesbeschäftigung. Wer konnte in gleicher Weise hoffen, schon beim Beten erhört zu werden? Wer verehrte in solcher Weise Hände und Antlitz der Priester? Wer schätzte ebenso jede Art von Gelehrsamkeit? Wer bändigte das Fleisch noch mehr durch Fasten und Wachen, wer stand beim Psalmengesang Tag und Nacht fest, gleich einer Säule da? Wer war eine größere Bewunderin der Jungfräulichkeit, obwohl sie doch stets (ehelich) gebunden war? Wer war ein besserer Schutz für Waisen und Witwen? Wer erleichterte so sehr den Trauernden ihr Schicksal? Diese Vorzüge mögen vielleicht unbedeutend sein und wohl manchen verächtlich erscheinen, weil sie von den meisten nicht leicht nachgeahmt werden können und weil man aus Neid nicht gerne an das glaubt, was man nicht erreicht. Mir jedoch sind sie sehr verehrungswürdig; denn sie waren Erfindungen des Glaubens und Kundgebungen seelischer Begeisterung. Dazu gehört auch, daß man niemals ihre Stimme in heiligen Versammlungen vernahm, ausgenommen jene Fälle, in welchen der Gottesdienst das Sprechen gefordert hatte.</p><p>Wenn seinerzeit darauf geachtet wurde, daß kein Beil den Altar berührte und daß keine Axt darauf gesehen oder gehört wurde, um anzudeuten, daß alles, was Gott geweiht ist, von Natur und frei von Kunst sein soll, muß man es dann nicht auch anerkennen, daß die Frau des Verstorbenen stillschweigend dem Gottesdienste beiwohnte, daß sie niemals dem heiligen Altare den Rücken zuwandte oder auf den geweihten Boden spuckte, daß sie niemals heidnischen Frauen, mögen sie auch ganz ehrbare Verwandte gewesen sein, die Hände reichte oder sie küßte, daß sie weder freiwillig noch gezwungen mit solchen, die an unheiliger, ungeweihter Tafel saßen, das Salz teilte und es niemals zuließ, ein unreines Haus, den Vorschriften des Gewissens zum Trotze, zu betreten oder anzuschauen, daß sie ihre Ohren, welche göttliche Worte hörten, nicht durch heidnische Erzählungen und ihre Zunge, welche göttliche Worte sprachen, nicht durch heidnische Theatermusik entehrte, weil Unheiliges nicht zum Heiligen passe, daß sie ferner ― was noch staunenswerter ist ― sich, trotzdem sie auch außerordentlich vom Leide der Mitmenschen niedergedrückt wurde, doch niemals so sehr äußerem Schmerze überließ, daß sie eher in Klage- als in Dankesworte ausgebrochen wäre, oder daß ihren vom Sakramente gesalbten Augen Tränen entströmt wären, oder daß sie an einem Festtage mit Rücksicht auf ihr vieles Leid in Trauer einhergegangen wäre? Nach ihrer Ansicht hatte eine gottgesalbte Seele die Pflicht, alles Menschliche dem Göttlichen unterzuordnen.</p><p>Ich schweige von ihren weniger bekannten Bräuchen, deren Zeuge Gott ist und die treuen Dienerinnen, welchen sie ihr Tun und Lassen anvertraut hatte. Von mir zu sprechen, geziemt sich wohl nicht, denn ich bin nicht würdig der Hoffnungen, die sie auf mich gesetzt hatte. Allerdings hatte sie das Große gewagt und uns ohne Angst vor der Zukunft schon vor der Geburt Gott versprochen und sofort nach der Geburt auch Gott geweiht. Gott hatte sie es zu verdanken, daß ihr Gebet nicht ganz umsonst war und ihr Opfer angenehm wurde. Das Gebet wurde bereits erhört, das Opfer aber, durch teilweise Zusätze vermehrt, lag in der Zukunft. Wie die Sonne durch ihre Morgenstrahlen sanftes Licht verbreitet, am Mittag aber wärmer und heller wird, so strahlte die Frömmigkeit der Mutter zunächst nicht unbedeutendes Licht aus, um schließlich aber noch heller zu leuchten. Der Vater empfing damals, nachdem er sie heimgeführt hatte, zu Hause von ihr nicht wenig Anregung zu gottgefälligem Leben; denn schon frühzeitig wurde ihr von den Ahnen Liebe zu Gott und Christus eingepflanzt und das Erbe, das sie von den Eltern hatte, war die Tugend. Nicht war sie, wie ihr Mann, von einem wilden Ölbaume auf einen edlen Ölbaum gepfropft worden. In ihrem Glaubenseifer konnte sie es nicht ertragen, daß sie nicht beide unter das gleiche Joch gespannt waren. Obwohl sie die stärkste und männlichste unter den Frauen war, vermochte sie es nicht hinzunehmen, daß sie nur halb und halb, in Zerspaltung sich mit Gott vereinen; nicht nur die Körper, auch die Seelen sollten verbunden sein. Tag und Nacht warf sie sich daher vor Gott nieder und bat ihn unter vielem Fasten und vielen Tränen, ihr Haupt zu retten. Eifrig drang sie in ihren Mann und suchte ihn auf alle mögliche Weise, durch Vorwürfe, Belehrungen, Gefälligkeiten, Zurückhaltung zu gewinnen, vor allem aber durch ihre Persönlichkeit und durch zarte Ehrfurcht, wodurch eine Seele am ehesten zur Nachgiebigkeit veranlaßt wird, so daß sie sich gerne auf den Weg der Tugend führen läßt. Steter Tropfen sollte den Stein höhlen und mit der Zeit das bewirken, was sie erstrebte. Aus folgendem wird es sich ergeben.</p><p>Die Mutter erbat und erhoffte das, was mehr die Leidenschaft ihres Glaubens als die der Jugend wünschte. Das Vertrauen anderer auf die Gegenwart war nicht größer als ihr Vertrauen auf die erhoffte Zukunft; sie kannte ja bereits aus Erfahrung Gottes Güte. Zum Heile gereichten dem Vater einerseits sein klares Denken, das immer mehr zu retten vermag, anderseits Träume, wodurch Gott oftmals solchen hilft, welche des Heiles würdig sind. Was sah er im Traume? Das Schönste will ich erzählen. Es war ihm im Traume, als würde er ― was er früher trotz der vielen inständigen Gebete seiner Frau noch nie getan hatte ― aus den Psalmen des trefflichen David die Worte singen: „Ich freute mich über die, welche zu mir sagten: In das Haus des Herrn werden wir einziehen.“ Der Psalmengesang war ihm fremd. Aber mit dem Gesang wurde zugleich das in demselben ausgesprochene Verlangen (nach dem Hause Gottes) wach. Als die Mutter merkte, daß ihr Gebet erhört worden war, benützte sie sofort die Gelegenheit, legte den Traum günstig und wahrheitsgemäß aus, erklärte mit Freuden die Größe der angenehmen Offenbarung und eilte mit der Konversion, damit sich ja kein Hindernis der Gnade in den Weg lege und ihren Wunsch vereitle. Es war gerade damals, als mehrere Bischöfe nach Nicäa eilten, um gegen den arianischen Wahnsinn Stellung zu nehmen, der von neuem sich erhob, die Gottheit zu teilen, da wandte sich mein Vater an Gott und die Lehrer der Wahrheit, sprach offen seinen Wunsch aus und bat, ihn an der allen gemeinsamen Erlösung teilnehmen zu lassen. Unter den Bischöfen war der berühmte Leontius, der damals an der Spitze unserer Metropole stand. Gegen die Gnade würde ich mich schwer versündigen, wenn ich nicht von jenem Wunder erzählen würde, welches die Gnade damals gewirkt hatte. Nicht wenige waren Zeugen des Wunders. Da die diensttuenden Katecheten einen Ritusfehler machten, deutete die (hier wirkende) Gnade das Kommende an; schon mit der Katechese wurde die Priesterweihe verbunden. Eine unfreiwillige Weihe! Als er auf den Knien lag, wurde er durch die Worte der Katechese in einer Weise aufgerichtet, daß viele Anwesende, und zwar nicht bloß die geistig höher Stehenden, sondern auch die weniger Begabten, gestützt auf die nicht dunklen Vorgänge, die Zukunft voraussagten.</p><p>Nach kurzer Zeit folgte diesem wunderbaren Vorgang ein anderer. Ich erzähle ihn nur den Gläubigen; denn Unheilige schenken dem keinen Glauben, was erhaben ist. Der Vater kam zu der durch Wasser und Geist erfolgenden Wiedergeburt, in der wir Gott bekennen, daß der wahre Christ umgestaltet und vollendet und das Irdische vergeistigt wird. Mit heißem Verlangen und strahlender Hoffnung kam er zur Taufe, nachdem er sich nach Kräften zuvor gereinigt und sich seelisch und geistig noch gründlicher geheiligt hatte als die, welche von Moses die Tafeln erhalten sollten. Denn diese hatten nur ihre Kleider gereinigt, Diät beobachtet und sich kurze Zeit etwas enthalten. Dem Vater aber diente das ganze vorhergehende Leben zur Vorbereitung für die Erleuchtung, und noch vor der Reinigung suchte er schon durch Reinigung die Gabe zu sichern, damit die Reinheit mit der Vollkommenheit betraut werde und damit die Gabe nicht gefährdet werde durch vermessentliches Verhalten. Als er aber dem Wasser entstieg, umstrahlte ihn ein Licht und eine Herrlichkeit, welche der Gesinnung, mit der er zur Gnade des Glaubens gekommen war, entsprach. Auch einige von den Teilnehmern sahen den Glanz. Allerdings schwiegen sie zunächst noch über das Wunder und wagten nicht, darüber zu sprechen, da jeder meinte, er allein habe die Erscheinung gesehen. Etwas später aber erzählten sie einander davon. Dem, der die Taufe und die Weihe vornahm, war der Glanz so klar erkennbar, daß er den wunderbaren Vorfall nicht bei sich behalten konnte, sondern offen ausrief, er salbe seinen Nachfolger mit dem Geiste.</p><p>Wer von diesen Vorgängen hört und erfährt, braucht nicht daran zu zweifeln. Denn zu einer Zeit, da Moses noch wenig Ansehen hatte und noch keiner Offenbarung gewürdigt worden war, erging an ihn von dem Dornstrauch aus, der brannte, aber nicht verbrannte, oder vielmehr von dem, der in demselben sich zu erkennen gab, die Berufung und wurde er durch das erste Wunder gewonnen. Es war jener Moses, unter welchem sich das Meer teilte, es Brot regnete, der Felsen Wasser spendete, Feuersäule und Wolke abwechselnd Führer waren und welcher durch Ausstreckung der Hände das Kreuz vorbildete und ein Siegeszeichen aufstellte, durch welches er viel Tausende besiegte. Isaias, der die Herrlichkeit und die Seraphim schaute, hörte eine göttliche Stimme und wurde, ehe er zum Propheten ernannt wurde, mit einer Kohle gereinigt. Jeremias, der mit der großen Gewalt über Volk und Könige betraut wurde, wurde noch vor seiner Bildung erkannt und noch vor seiner Geburt geheiligt. Paulus, der große Prediger der Wahrheit, der Glaubenslehrer der Heiden, wurde noch als Verfolger vom Lichte umstrahlt, um den zu erkennen, welchen er verfolgt, wird mit dem großen Dienste betraut, um alle Ohren und Geister mit dem Evangelium zu erfüllen.</p><p>[Forts. v. ] Wozu soll ich alle jene aufzählen, welche von Gott berufen und gleich meinem Vater durch Wunder für den Dienst Gottes gewonnen worden waren? Nach diesen so unglaublichen, wunderbaren Anfängen hat aber nicht etwa das spätere Verhalten des Vaters das frühere Leben zuschanden gemacht, wie es bei manchen der Fall ist, welche gar rasch vom Guten übersättigt werden und darum nicht mehr an die Zukunft denken oder welche sogar wieder vollständig in Sünden zurückfallen. Solche Vermutung ist hier nicht am Platze. Im Gegenteil, er blieb sich in allem ganz konsequent: Das, was er vor der Priesterweihe tat, entsprach der Würde eines Priesters, und das, was er als Priester wirkte, stand im Einklang mit seinem früheren Leben. Man darf nicht anders anfangen, als man endet, und nicht anders enden, als man angefangen hat. Er empfing die Priesterweihe nicht mit jener Leichtfertigkeit und Gleichgültigkeit, die heute üblich ist, sondern erst nach einiger Zeit, um ― wie es die geistliche Ordnung fordert ― nicht nur gereinigt zu werden, sondern auch Erfahrung und Befähigung zum Reinigen zu gewinnen. Nach dem Empfang wurde die Gnade noch mehr geehrt und zwar als wahrhaft göttliche Gnade, nicht als solche, die von Menschen kommt, und nicht ― wie der Prediger sagt ― als etwas Ungestümes und Stürmisches.</p><p>Nachdem er die Wald- und Bauerndiözese übernommen hatte, die zwar noch vor kurzem einen Hirten, den einzigen, der vor ihm der Diözese zur Ehre gereichte, einen bewundernswerten, engelreinen Mann, ehrlicher als die heutigen Führer des Volkes, besaß, die aber nach dessen baldigem Hingang infolge der Führerlosigkeit wiederum sehr vernachlässigt wurde und verwilderte, da bändigte er zunächst die Sitten der Menschen unschwer durch seine Worte voll Hirtenweisheit und durch sein eigenes Beispiel, indem er gewissermaßen zu einer geistigen Statue wurde, an der jede tugendhafte Handlung schön zum Ausdruck kam. Infolge seiner eifrigen Beschäftigung mit dem göttlichen Worte gewann er sodann, trotzdem er sich erst spät damit befaßte, in kurzer Zeit solche Weisheit, daß er in nichts hinter irgendeinem von denen, welche sich schon längst damit beschäftigt hatten, zurückstand und von Gott die außerordentliche Gnade empfing, Vater und Lehrer der Orthodoxie zu werden. Nicht paßte er sich wie die modernen Gelehrten den Zeitverhältnissen an, nicht verteidigte er unsere Lehre mittelmäßig und mit schönen Phrasen wie diejenigen, welche die Festigkeit des Glaubens nicht kennen oder mit der Wahrheit Geschäfte treiben. Die Gebildeten übertraf er durch Frömmigkeit, die Gläubigen durch Gelehrsamkeit; der Bildung wies er die zweite, der Religion die erste Stelle an. Er anerkannte* einen* Gott, der in der Dreiheit angebetet wird, und Drei* (τρία)* [tria], welche in* einer* Gottheit geeint sind. Nicht lehrte er, die Gottheit zusammenziehend und Göttliches verflüchtigend, die Einheit nach der Art des Sabellius; noch lehrte er, dieselbe in an Herrlichkeit und Natur ungleiche, verschiedene Teile trennend, eine Dreiheit wie Arius. Wie kann, wo jedes unfaßbar ist und unseren Verstand übersteigt, das Überragende erkannt oder gelehrt werden? Wie kann man das Unermeßliche messen? Unterliegt denn die Gottheit den gleichen Bedingungen wie das Meßbare, so daß sie in ihrer Höhe und Tiefe gemessen werden könnte?</p><p>Da jener große Gottesmann, der ein Theologe im wahren Sinne des Wortes war und vom Heiligen Geiste geleitet wurde, solchen Glauben besaß, darf man nicht leugnen, daß er diese Kirche zu einem neuen Jerusalem, und gleich dem großen Noe, dem Vater dieser neuen Welt, zu einer zweiten, über den Wassern gleitenden Arche werden ließ. Sicher hob sich dieselbe über die seelische Sintflut und über den Ansturm der Häretiker. Mochte sie auch an Seelenzahl hinter den anderen Kirchen zurückstehen, aber an Ruhm übertraf sie dieselben. Mit dem heiligen Bethlehem durfte sie sich vergleichen, das zwar eine kleine Stadt war, aber gleichwohl ungehindert zur Metropole des Erdkreises wurde, soferne es Ernährerin und Mutter Christi, des Schöpfers und Siegers der Welt, wurde.</p><p>[Forts. v. ] Dies ergibt sich aus folgendem. Als wir von der hitzigeren Partei der Kirche niedergestürmt und durch Schrift und schöne Worte zu einer schlimmen Gemeinschaft überlistet worden waren, fand es sich, daß mein Vater allein noch in seinem Geiste unverletzt blieb und seine Seele nicht gleich dem Schwarzen schwarz werden ließ, mochte er auch von seiner Einfalt hingerissen werden und in seiner Kindlichkeit nicht aller List aus dem Wege gegangen sein. Er war es allein, bzw. er war der erste, welcher die revolutionären Elemente durch seinen kirchlichen Eifer mit sich und den übrigen Gläubigen wieder versöhnte; die, welche zuletzt abtrünnig geworden waren, beugten sich zuerst unter seine Autorität und unter die Reinheit der Lehre. Der gewaltige Aufruhr in der Kirche legte sich daher wieder, der Sturm wurde zum Lüftchen, da er beschwichtigt wurde durch des Vaters Gebete und Mahnungen, sowie ― wenn der Jugend ein Wort gestattet ist ― durch uns, die wir ihn in seiner kirchlichen Tätigkeit unterstützten, und mit ihm zusammengespannt, neben ihm zu allem Guten liefen und sprangen, so daß wir die Ehre hatten, hier das meiste beizutragen. Da wir in unserer Rede etwas vorgegriffen haben, wollen wir diese Sache nicht weiter ausführen.</p><p>Wer könnte alles, was er geleistet hat, aufzählen? Oder wem würde es nicht, wenn er nur eine kleine Auswahl treffen soll, schwer fallen, etwas zu übergehen? Denn stets scheint das, was einem noch einfällt, noch besser zu sein als das, was bereits erwähnt worden ist. Das ist meine Meinung. Die Frage: „Was soll man weglassen?“ bereitet mir mehr Schwierigkeit als anderen Lobrednern die Frage: „Was soll man sagen?“ Die Fülle dessen, was zu sagen ist, beschwert mich gewissermaßen, und da der Geist sich abmüht, die Taten des Verstorbenen abzuwägen, ohne aber die Möglichkeit zu haben, unter den gleichwertigen Handlungen eine Auswahl zu finden, ist er gequält. Auf ruhigem Wasser können wir die Beobachtung machen, daß, wenn man einen Stein hineinwirft, von ihm als Mittelpunkt aus ein Kreis nach dem anderen entsteht, welche im engen Nachdringen immer wieder den äußersten Kreis vernichten. Ganz die gleiche Beobachtung mache ich bei mir selbst; der eine Gedanke kommt, ein anderer folgt nach, wieder ein anderer wird verdrängt. Die Auswahl macht mir viel zu schaffen, da die ersten Gedanken den späteren immer wieder Platz machen müssen.</p><p>Wer zeigte in öffentlichen Diensten größeren Eifer als der Verstorbene? Wer war weiser in der Verwaltung der häuslichen Angelegenheiten? Gott, welcher das Gute und Verschiedenartige ordnet, hatte ihm nämlich ein Haus und reichlichen Besitz zugewiesen. Wer war gegen die Armen, den entehrtesten Teil des doch gleichwertigen Menschengeschlechtes, mitleidiger und freigebiger? Seine eigenen Güter verwaltete er in der Tat so, als wären sie fremde Güter gewesen. Nach Möglichkeit erleichterte er die Not der Armen. Nicht nur von dem Überflüssigen teilte er aus, sondern auch von dem, was er selbst notwendig brauchte, wodurch sich erst recht deutlich seine Liebe zu den Armen zu erkennen gab. Gemäß der Mahnung Salomos teilte er nicht nur den Sieben mit; wenn noch ein Achter kam, wurde er auch nicht knauserig. Geben machte ihm größere Freude, als anderen bekanntlich das Nehmen bereitet. Sein Almosen kannte nicht „Bedrückung und Fingerzeigen“, worunter ich Knauserei und Prüfung des Empfängers auf seine Würdigkeit verstehe, auch nicht „übles Nachreden“, wodurch sich die meisten verfehlen, da sie wohl geben, aber nicht gerne geben, was doch mehr Wert hat und vollkommener ist als das Schenken (an und für sich). Er hielt es für viel besser, mit Rücksicht auf die Würdigen auch Unwürdigen etwas zu spenden, als in der Angst, Unwürdige zu beschenken, die Würdigen zu vernachlässigen. Der gleiche Gedanke scheint in der Forderung, man solle sein Brot auch in das Wasser werfen, ausgesprochen zu sein. Nicht soll das Brot nämlich verschwinden, auch soll es nicht in den Augen des gerechten Richters dieser Welt verloren sein, sondern es soll dahin gelangen, wo all unser Tun aufbewahrt sein wird; es wird wieder erscheinen, auch wenn wir nicht daran glauben.</p><p>Seine schönste und bedeutendste Tugend war, daß er mit seiner hochherzigen Gesinnung nicht Ehrgeiz verband. Wie wenig er es tat, will ich dartun. Obwohl er sowohl die Güter, wie die Freigebigkeit gemeinsam mit seinem Weibe besaß, und beide um die schönsten Ideale wetteiferten, so überließ er doch das Schenken meist* ihrer* Hand, da sie die beste und verlässigste Verwalterin in solchen Dingen war. Welch treffliches Weib war sie, von der ich da rede! Nicht einmal der Atlantische Ozean oder sonst ein Riesengewässer hätte, wenn sie dieselben hätte ausschöpfen können, ihrer Freigebigkeit genügt. So groß und unermeßlich war ihre Liebe zum Schenken. Sie ahmte den Blutegel nach, von dem Salomon spricht, allerdings in entgegengesetzter Beziehung. Denn durch die Unersättlichkeit im guten Sinne überwand sie die Unersättlichkeit im schlimmen Sinne; im Wohltun konnte sie sich nicht genug tun. Alles, was sie besaßen oder sich erwarben, war ihr zu wenig im Vergleich zu dem, was sie schenken wollte. Ja, gerne hätte sie ― wie ich oft aus ihrem eigenen Munde gehört habe ― sich selbst und ihre Kinder, wenn es möglich gewesen wäre, hingegeben, um den Armen zu dienen. Der Vater ließ der Freigebigkeit der Mutter alle Zügel schießen. Hierin war er meines Erachtens das beste Vorbild. Hochherzige Freigebigkeit kann man zwar unschwer auch sonst finden, mag man sein Geld hinauswerfen, um in der Öffentlichkeit und im politischen Leben seinen Ehrgeiz zu befriedigen, oder mag man es durch Vermittlung der Armen an Gott ausleihen als einzige Kostbarkeit derer, welche es ausgeben. Nicht leicht aber dürften wir jemanden finden, der auch noch auf den Ruhm (der Freigebigkeit) verzichten würde; denn der Ehrgeiz ist es ja, der die meisten freigebig macht. Wo man von der Gabe nichts erfährt, da erstirbt das Geben.</p><p>[Forts. v. ] So war seine Freigebigkeit. Noch mehr davon zu erzählen, überlassen wir denen, die ihn gekannt haben. Sollte jemand auch uns wohltätige Gesinnung bezeugen, sie hätte bei ihm ihre Quelle, wäre Anteil an seinem Wirken. Wer hat ferner mehr als er mit Gottes Hilfe (Gottgeweihte) an den Altar geführt oder hat sich mehr gegen Gotteslästerungen ereifert oder hat mehr den heiligen Tisch von Unheiligen aus Furcht gereinigt? Wer hat mit gleicher Entschlossenheit und Unparteilichkeit Urteile gefällt, die Bosheit verfolgt, die Tugend geehrt, die Besten bevorzugt? Wer war in gleicher Weise bereit, den Sündern zu verzeihen und denen sich anzuschließen, die den guten Weg gingen? Wer hatte besseres Verständnis für Rute und Stab und hatte dem Stab größeren Vorzug gegeben? Wessen Augen schauten noch mehr „auf die Treuen im Lande“ und u. a. vor allem auf die, welche in einsamem, ehelosem Leben unter der Verachtung der Welt und alles Irdischen Gott dienen?</p><p>Wer hat mehr als er Aufgeblasenheit bekämpft und Demut geliebt und letzteres nicht etwa heuchlerisch und oberflächlich, wie es die vielen tun, die jetzt vorgeben, fromm zu leben* (φιλοσοφεῖν)* [philosophein], und nach außen hin zierlich sind wie die so törichten Frauen, welche, nachdem sie ihre eigene Schönheit verloren haben, zu Schminken ihre Zuflucht nehmen und ― wenn ich so sagen darf ― hübsch sind wie Schauspielerinnen, d. h. garstig in ihrer Schönheit und in ihrer Häßlichkeit erst recht häßlich. Demut suchte er nicht in der Kleidung, sondern durch die Gesinnung auszudrücken. Nicht heuchelte er Demut durch biegsamen Nacken, gedämpfte Stimme, Komplimente, langen Bart, glattrasiertes Haupt, abgemessenen Schritt, wodurch man einige Zeit wirkt, sehr bald aber sich verrät; denn was gekünstelt ist, ist nicht von Bestand. Der Vater war ausgesprochener Aktivist und doch in seiner Gesinnung äußerst demütig. Sein Tugendleben konnte man nicht erreichen; sehr leicht aber war es, in Verkehr mit ihm zu gelangen. Seine Kleidung war die des gewöhnlichen Mannes, so daß er weder stolz war, noch sich etwas vergab; an innerem Glanze aber übertraf er viele. Magenkrankheit und Völlerei bekämpfte er gleich anderen, aber er trug es nicht zur Schau; das eine tat er, um sich rein zu halten, das andere, um nicht mit dem ungewöhnlichen Verhalten Ruhmsucht zu verbinden und sich zu überheben. Er glaubte, es sei Sache des Politikers, immer das zu tun und zu reden, was bei anderen Ansehen verschafft; für diesen gäbe es nichts Beseligenderes als das irdische Leben, Sache des Geistesmenschen und Christen aber sei es, nur an die Erlösung zu denken und das zu schätzen, was dazu führt, das aber, was nicht dazu führt, als nichtswürdig zu verabscheuen, also das Sinnfällige gering zu achten, dagegen nur nach dem zu streben, daß seine Seele sich durch Schönheit und Pracht auszeichne, und das hochzuhalten, was ihn der höchsten Ehre würdig macht und wodurch er seinen Mitmenschen zum Höchsten emporzieht.</p><p>Die vorzüglichsten Tugenden, die ihn besonders charakterisierten und die alle kannten, waren seine Einfachheit und Wahrhaftigkeit und seine Bereitwilligkeit, Unrecht zu vergessen. Andere Menschen der alten und neuen Zeit sollen sich entsprechend der Gnade, welche den einzelnen von Gott zuteil wurde, bald durch diese, bald durch jene Tugend ausgezeichnet haben: Job durch unerschütterliche Geduld im Leiden, Moses und David durch Sanftmut, Samuel, der in die Zukunft sah, durch prophetische Begabung, Phinees durch seinen Eifer, dem er seinen Namen verdankte, Petrus und Paulus durch die Kraft der Predigt, die Söhne des Zebedäus durch Beredsamkeit, die ihnen die Bezeichnung Donnersöhne eintrug. Wozu soll ich aber alle aufzählen? Ich spreche ja doch im Kreise von Gebildeten. Das charakteristische Merkmal eines Stephanus und meines Vaters aber war vor allem die Gutmütigkeit. Jener haßte nicht einmal in der Todesstunde seine Peiniger, vielmehr betete er, da er gesteinigt wurde, für die, welche ihn steinigten, als Jünger Christi, dem zulieb er das Leiden trug, Gott durch die Geduld ein größeres Opfer bringend, als es der Tod selbst gewesen war. Der Vater aber ließ zwischen erlittenem Unrecht und zwischen Verzeihung keine Zeit verstreichen; ja so schnell die Verzeihung erfolgte, so rasch schlich sich fast auch schon der Schmerz ein.</p><p>Wir glauben es und wir hören davon, daß es eine Hefe des göttlichen Zornes gibt. Sie ist das, was von seiner Erbitterung gegen die, welche (den Zorn) verdienen, übrigbleibt; Gott ist ja „der Herr der Rache“. Mag er auch bei seiner Güte geneigt sein, statt Strenge Nachgiebigkeit walten zu lassen, so verzeiht er doch nicht vollständig den Sündern, damit sie nicht durch seine Barmherzigkeit noch schlimmer werden. Der Verstorbene jedoch trug denen, welche ihn erzürnten, nichts nach, mag er auch gegenüber dem Zorne nicht ganz unverwundbar gewesen sein und vor allem in geistigen Dingen sich vom Eifer haben hinreißen lassen. Wenn er sich einmal rüstete und waffnete, war es auch, um gegen Kränkungen wie gegenüber einem Feinde schon von ferne Stellung zu nehmen. Selbst sozusagen von Tausenden hätte er sich nicht aus der Fassung bringen lassen. Seine Erregung war sanft. War er erregt, so war er nicht gleich einer Schlange innerlich unruhig und rachsüchtig und schritt nicht schon im ersten Augenblicke zu hitziger Tat und Vergeltung, sondern glich dem Stachel einer Biene, indem er verletzte, ohne zu töten. Seine Menschenliebe war übermenschlich. Oftmals waren Folterräder und Geißeln angedroht worden und standen die Schergen schon bereit; die Strafe aber war, daß die Ohren etwas zu fühlen bekamen, Backenstreiche erteilt und Ohrfeigen versetzt wurden. So stand er von seinen Drohungen ab. Lag ein Verbrecher bereits ohne Kleider und Schuhe auf dem Boden, dann wandte sich des Vaters Unmut nicht gegen den Übeltäter, sondern gegen den, der bereitwillig Dienst tat, als hätte dieser dem Bösen gedient. Auf welche Weise hätte einer noch mehr seine Gutmütigkeit und seine Befähigung zum Priester offenbaren können? Kaum war er gereizt worden, hatte er schon den Beleidiger wieder in Schutz genommen, über dessen Vergehen errötend, wie wenn er es selbst begangen hätte.</p><p>Noch eher würde der Tau den Strahlen der Morgensonne widerstehen, als daß in ihm etwas Zorn geblieben wäre. Kaum war ein Zorneswort gesprochen, war auch schon mit dem Wort der Zorn entflogen, nur Liebe zum Guten zurücklassend und nie über Sonnenuntergang hinausdauernd. Seine Erbitterung wußte nichts von dem Zorne, der auch am Leben verständiger Menschen nagt, hinterließ keine Spur von ihren Schmerzen an seinem Körper, bewahrte ihm vielmehr auch im Sturme seine Sanftmut. So geschah das Staunenswerte, daß er zwar nicht allein es war, der zurechtwies, wohl aber einzig und allein bei den Angeklagten Liebe und Bewunderung erntete, da eben seine Güte über seine Erbitterung siegte. Und wahrlich, es ist ehrenvoller, von einem gerechten Manne getadelt als von einem schlimmen Menschen gesalbt zu werden. Die Rauhheit des ersteren wirkt angenehm, da sie Nutzen bringt; die Güte des letzteren dagegen erregt Verdacht, da seinem Leben die Güte fehlt. Trotzdem der Vater ein Mann von Gemüt, von Einfalt und göttlicher Gesinnung war, so war er doch wegen seiner Gläubigkeit von denen gefürchtet, welche sich groß dünkten; nichts hatte es ihm so sehr angetan als Verachtung der Einfalt. Wünschte er jemandem etwas Gutes oder etwas Schlechtes, sofort mußte er ihm etwas Gutes geben, das Bestand hatte, oder etwas Unangenehmes widerfahren lassen, das nicht von Bestand war. Der gute Wunsch kam aus der Tiefe des Herzens, der böse aber lag nur auf den Lippen und war väterliche Zurechtweisung. Viele von denen, welche sich gegen ihn verfehlt hatten, wurden nicht erst spät von der Vergeltung ereilt. Nicht hinkte, wie ein Dichter sagt, die Strafe erst nach, sondern auf der Stelle wurden sie geschlagen, kehrten um, kamen, fielen auf die Knie nieder, erlangten Verzeihung, um, zu ihrem Vorteile besiegt, wegzugehen und durch die Züchtigung und Verzeihung bessere Menschen zu werden; denn Verzeihen hat oft großen Erlösungswert, da es durch Beschämung den Sünder niederzwingt und aus der Angst heraus zu Liebe und sicherem Wohlwollen führt. Heimgesucht wurden die einen, indem sie von Rindern, welche durch noch ungewohntes Joch scheu wurden und plötzlich ausrissen, in die Höhe geworfen wurden, andere, indem sie von Pferden, trotzdem diese sehr lenksam und zahm waren, zu Boden geschleudert und getreten wurden, wieder andere, indem sie von unerträglicher Hitze sowie von der Erinnerung an ihre Taten erfaßt wurden. Die einen wurden auf diese, die anderen auf jene Weise geschult und lernten aus ihrer Züchtigung Gehorsam.</p><p>Sollte nun er, dessen Milde so groß und allgemein bekannt war, im Eifer und in den aktiven Tugenden irgend jemandem zurückgestanden sein? Nein! Er war zwar so mild wie nur einer; aber so mild er war, so energisch war er auch. Obwohl Milde und Energie sich vielfach widersprechen und bekämpfen, obwohl Einfachheit und Milde unpraktisch sind, die der Güte entbehrende Schärfe dagegen sich aufs praktische Leben versteht, so einigten sich doch in ihm die beiden Richtungen in wunderbarer Weise; obwohl er streng war, handelte er mit Milde, und obwohl er unpraktisch war, fügte er sich mit Eifer den Pflichten eines Vorstehers, Redners, Herrschers. Da er gegenüber dem Bösen Schlangenklugheit und zugleich im Guten Taubeneinfalt beobachtete, ließ seine Klugheit nie Böses und seine Einfalt nie Törichtes geschehen. Die Vereinigung beider Gegensätze vervollkommnete, soweit wie möglich, seinen Charakter. Ist es, nachdem der Vater solche Fortschritte gemacht, in solcher Weise des Priesteramtes gewaltet und überall so großes Ansehen gewonnen hatte, noch zu verwundern, daß er auch durch Wunder ausgezeichnet worden, wodurch Gott die Frömmigkeit bestätigt?</p><p>Eines dieser Wunder, die er erlebte, will ich erzählen. Er war unwohl, körperlich krank. Muß man sich etwa darüber aufhalten, daß auch Heilige leiden? Das Leiden dient entweder zur Reinigung von ihrem bißchen Schmutz oder zur Erprobung der Tugend und zur Prüfung der Gesinnung oder zur Stärkung der Schwächlinge unter ihnen, welche Ausdauer und Unverzagtheit im Leiden lernen sollen. Der Vater erkrankte zur Zeit des heiligen, berühmten Osterfestes, des Königs der Tage; es war jene leuchtende Nacht, welche die Finsternis der Sünde verscheucht und in welcher wir mit zahlreichen Lichtern unsere Erlösung feiern und zugleich mit dem für uns getöteten Lichte sterben, um mit dem auferstandenen Lichte aufzuerstehen. Dies war die Zeit seines Leidens. In Kürze will ich darüber berichten. Ein starkes, hitziges Fieber durchglühte das Innerste, seine Kräfte schwanden, Nahrung konnte er nicht zu sich nehmen, zu schlafen vermochte er nicht. Sein Zustand wurde bedenklich, sein Puls hämmerte. Die ganze Mundhöhle, der Gaumen und der Oberkiefer waren mit so vielen Geschwüren vollständig bedeckt, daß man Wasser nicht leicht und ungehindert eingeben konnte. Nichts vermochte die Kunst der Ärzte, das ständige Gebet der Angehörigen, alle angewandten Mittel. Er lispelte wenige unverständliche Worte. Nicht einmal die Anwesenden erkannte er. Er war vollständig abwesend und weilte bei dem, was er schon längst ersehnt hatte und was ihm in Aussicht stand. Wir aber gingen in die Kirche, um zu opfern und zu beten; da wir nämlich an allen anderen Mitteln verzweifelten, nahmen wir unsere Zuflucht zu dem großen Arzt, der Kraft der Osternacht, der letzten Hilfe. Sollten wir jubeln oder klagen? Sollten wir uns der Festesfreude hingeben oder für den, der nicht mehr dabei war, Trauerfeier halten? Wieviele Tränen wurden damals vom ganzen Volke vergossen! Rufen und Schreien mischte sich in die Psalmengesänge. Von der Kirche forderten sie den Priester, vom Gottesdienst den Opfernden, von Gott den würdigen Gehilfen. Und dies geschah unter Führung meiner Maria, welche nicht die Sieges-, sondern die Bittpauke schlug und im damaligen Schmerze zum ersten Male die schamhafte Schüchternheit vergaß. Das Volk und Gott rief sie zugleich an, jenes, damit es mit ihr Mitleid zeige und mit ihr im Weinen wetteifere, diesen aber, damit er auf die Bitten höre. Sie erinnerte Gott an die früheren Wunder; denn Leiden macht erfinderisch.</p><p>Was wirkte nun der, welcher der Gott jener Nacht und der Gott des Kranken war? Schauer ergreift mich, wenn ich die folgenden Ereignisse erzähle. Schauer soll auch euch, wenn ihr davon hört, erfassen, nicht jedoch Unglaube, den meine Erzählung nicht verdient. Die Zeit des Gottesdienstes, das feierliche Stehen und der Akt, der für das Mysterium Schweigen verlangt, waren gekommen, da wurde er von dem, der die Toten zum Leben erweckt, in der heiligen Nacht hergestellt. Zunächst bewegte er sich nur ein wenig, bald lebhafter. Schließlich rief er einen anwesenden Diener mit Namen, allerdings noch ganz leise und mit schwacher Stimme, und forderte ihn auf, zu kommen, ihm seine Kleider zu bringen und ihm behilflich zu sein. Dieser trat verwundert vor ihn und bediente ihn bereitwillig. Der Vater aber ließ sich von den Händen stützen wie Moses auf dem Berge, streckte die müden Hände zum Gebete aus und vollendete in Geistesfrische mit dem Volke, bzw. für dasselbe das heilige Geheimnis mit zwar wenigen, seinem Zustand entsprechenden Worten, jedoch gewiß mit vollständiger Aufmerksamkeit. Ein Wunder! Ferne dem Presbyterium war er doch in demselben; obwohl er nicht am Altare war, opferte er; er war Priester, trotzdem er ferne den Geheimnissen weilte. Der Heilige Geist hatte ihm dies alles vergegenwärtigt; er schaute es, während die Anwesenden nichts davon merkten. Er fügte sodann noch die üblichen Danksagungsgebete bei, sprach den Segen über das Volk und legte sich wieder zur Ruhe. Nachdem er noch etwas Nahrung zu sich genommen und geschlafen hatte, erholte er sich. Die Gesundheit hatte sich bereits mehr und mehr gefestigt, da kam das sog. „Neue Fest“, der erste Sonntag nach Ostern. Er begab sich in die Kirche, erneuerte mit der ganzen Gemeinde die Erinnerung an die Erlösung und brachte das Danksagungsopfer dar. Was der Vater erlebte, scheint mir nicht geringfügiger zu sein als das, was Ezechias schauen durfte. Da dieser in seiner Krankheit gebetet hatte, verherrlichte ihn Gott durch Verlängerung seines Lebens, was er dadurch andeutete, daß er mit Rücksicht auf das Gebet des Genesenen den Schatten der Sonnenuhr zurückgehen ließ. Er zeichnete den König aus sowohl durch die Gnade (des langen Lebens), als auch durch das wunderbare Zeichen; durch Verlängerung des Tages bestätigte er die Verlängerung des Lebens.</p><p>Das gleiche Wunder erlebte bald darauf auch meine Mutter. Es verdient ebenfalls erwähnt zu werden. Einerseits ehren wir damit in gebührender Weise die Mutter, welche wie keine andere der Ehrung würdig ist, anderseits erhält der Vater die Ehre, mit ihr erwähnt zu werden. Auch sie fiel in Krankheit, obwohl sie stets kräftig und rüstig war und Krankheit sie sonst immer verschont hatte. Unter vielen anderen Leiden war, um mich kurz zu fassen, das quälendste, daß sie mehrere Tage nacheinander keine Nahrung zu sich nehmen konnte und dagegen keine Hilfe fand. Wie nun hatte Gott sie ernährt? Nicht ließ er, wie seinerzeit den Israeliten, Manna regnen, nicht spaltete er, wie dem dürstenden Volke, den Felsen, nicht brachte er durch Raben wie einem Elias Speisen, nicht sättigte er sie durch einen fliegenden Propheten wie dereinst einen Daniel, der in der Grube schmachtete. Auf welche Weise ernährte er sie nun? Es träumte ihr, daß ich, den sie am meisten liebte und dem sie selbst im Traum keinen anderen bevorzugte, nachts plötzlich vor ihr mit einem Korbe und den hellsten Broten erschienen sei, diese gesegnet und über sie dem Brauche entsprechend das Kreuzzeichen gemacht habe, um sie zu ernähren, ihr die Gesundheit zu geben und sie wieder zur Kraft kommen zu lassen. Dem nächtlichen Traume entsprach die Wirklichkeit. Von da an nämlich erholte sie sich und hatte sie wieder mehr Hoffnung, wie sich klar und deutlich zeigen sollte. Denn als ich am Morgen des anderen Tages die Mutter besuchte, sah ich sie vergnügter wie zuvor, und als ich sie, wie gewöhnlich, fragte: „Wie hast du geschlafen und was wünschest du?“ da gab sie mir zur Antwort: „Mein Kind, entgegenkommend und in aller Stille hast du mir etwas zu essen gegeben, und nun fragst du noch so lieb und freundlich, wie es mir geht.“ Und sofort gab mir die Dienerin durch Winke zu verstehen, ich solle nichts einwenden, sondern mich mit der Antwort befriedigen, damit die Mutter sich nicht darüber aufrege, daß sie die Wahrheit ausgesagt habe. Noch eine Geschichte, welche Vater und Mutter gemeinsam betreffen, will ich erzählen.</p><p>Ich fuhr auf dem jungfräulichen Meere von Alexandrien nach Griechenland auf einem äginäischen Schiffe und zwar zu ganz ungünstiger, aber selbst gewählter Zeit; Anlaß war mir vor allem das Zusammentreffen mit bekannten Schiffsleuten. Bald nach der Abfahrt entstand ein so gewaltiger Sturm, daß die Mitfahrenden sich nicht leicht, wie sie behaupteten, an einen solchen erinnern konnten. Während alle den gewöhnlichen Tod fürchteten, wurde mir der Tod der Seele etwas Furchtbareres. Es bestand nämlich für mich Armseligen die Gefahr, daß ich, obwohl ich mich im gefährlichen Meeressturme nach dem geistigen Wasser sehnte, ohne Taufe das Leben verlassen müsse. Ich rief daher und bat inständig, noch etwas länger leben zu dürfen. Und zugleich schrien meine Reisegefährten wegen der gemeinsamen irdischen Gefahr als mitleidige Gastfreunde, welche wegen der Gefahr mitfühlen lernten, nicht aber als Gesinnungsgenossen. Ich litt und mit mir litten meine Eltern, welche infolge nächtlicher Erscheinung von meiner Gefahr wußten. Vom Lande aus halfen sie mir, indem sie durch Gebete die Wogen glätteten, wie wir später nach unserer Heimkehr erfuhren, als wir von diesem Tage sprachen. Diese Hilfe wurde uns auch in einem wohltuenden Schlafe mitgeteilt, den wir, nachdem sich der Sturm etwas gelegt hatte, endlich genießen konnten. (Im Traume) wurde ich über ein finster blickendes, mit dem Tode drohendes Rachegespenst Herr; ganz deutlich hat mir die Nacht dasselbe erscheinen lassen. Ein anderer aus der Reisegesellschaft, ein mir sehr wohlwollender und lieber junger Mensch, der für mich in jener Lage sehr besorgt war, träumte, meine Mutter sei auf das Meer gekommen, habe das Schiff ergriffen und ohne viel Mühe ans Land gezogen. Der Traum bestätigte sich; denn das Meer wurde ruhig und wir landeten alsbald, ohne inzwischen noch viel durchzumachen, auf Rhodos. Von dem Sturme hatten wir selbst den Profit. Denn da wir im Falle der Rettung uns Gott gelobt hatten, haben wir uns auch ihm nach der tatsächlichen Rettung hingegeben.</p><p>Dieser Vorfall betraf beide Eltern. Längst werden nun aber wohl solche, welche die Geschichte meines Vaters genau kennen, sich darüber wundern, daß wir bei dem Erwähnten so lange verweilten, als wenn es das einzige wäre, was zu seiner Ehre gesagt werden könnte, daß wir dagegen zögern, an jene schlimmen Zeitverhältnisse zu erinnern, gegen welche der Vater offen angekämpft hatte. Man könnte meinen, daß wir entweder von diesem Kampfe nichts wissen oder ihn für unbedeutend halten. Darum wollen wir auch noch davon sprechen. Unsere Zeit hatte das erste und wohl auch das Endübel hervorgebracht in dem Kaiser, der sowohl von Gott als auch von der Vernunft abgefallen war. Julian hielt es für ein Geringes, sich die Perser zu unterwerfen, er erachtete es dagegen für eine große Tat, die Christen zu bezwingen, wozu ihm auch seine Dämonen, von denen er sich leiten ließ, rieten. Er schrak daher vor keiner Art Bosheit zurück. Er gewann durch Überreden, Drohen und Belehren, bald mit List, bald durch Gewalt. Es konnte gar nicht verborgen bleiben, daß hinter seinen philosophischen Ideen die Verfolgung lauerte, oder daß er seine Macht direkt benützte, uns auf jede Weise, sei es durch List, sei es mit Gewalt, vollständig in seine Hand zu bekommen. Wer hätte nun mehr (als mein Vater) den Kaiser verachtet und abgetan? Daß er ihn verachtete, beweisen außer vielem anderen jene Bogenschützen samt ihrem Kommandanten, welche Julian in unsere Kirchen schickte, um sie in Besitz zu nehmen bzw. zu bezwingen. Nachdem er sich bereits gegen viele andere gerichtet hatte und nun auch hier in gleicher Absicht erschien und dem Befehle gemäß nach der Kirche trachtete, war der Vater von einem Entgegenkommen so weit entfernt, daß jener vielmehr, wenn er nicht, klug auf einen Berater hörend, sich eilends meinem Vater gefügt hätte, mit Fußtritten weiterbefördert worden wäre; denn der Priester brannte von Unmut gegen ihn und von Eifer für das Haus Gottes. Hätte einer wohl besser seine Erledigung bewerkstelligen können als dadurch, daß er den Frevler beseitigte, einerseits öffentlich durch Bitten und Gebete des ganzen Volkes ohne Rücksicht auf die Zeit, anderseits privat, indem er nächtliche Angriffe auf ihn machte, soferne er seine alten, feuchten Glieder, auf der Erde liegend, marterte und den Boden mit Tränen benetzte? Fast ein volles Jahr hindurch übte er diese Abtötung, welche nur dem, der das Verborgene sieht, bekannt war, da er sie in der schon erwähnten Absicht, seine Frömmigkeit nicht zur Schau zu tragen, zu verheimlichen suchte. Die vollständige Verheimlichung wäre ihm gelungen, wenn ich nicht einmal unvermutet bei ihm eingetreten wäre, seine auf dem Boden vorgenommenen Übungen gesehen, ihn darnach gefragt und so das nächtliche Geheimnis erfahren hätte.</p><p>Noch eine kühne Tat aus gleicher Zeit will ich berichten. In einer bischöflichen Angelegenheit, als der eine Bischof gestorben war und ein neuer gewählt werden sollte, revoltierten die Bürger von Cäsarea. Es war ein erbitterter Aufstand, der nicht leicht beizulegen war. Da die Bürgerschaft in Glaubenssachen sehr hitzig war, kam es natürlich zu heftigen Auseinandersetzungen; die Berühmtheit des bischöflichen Stuhles steigerte noch die Erbitterung. Unter solchen Verhältnissen waren einige Bischöfe zur Neuwahl erschienen. Nachdem das Volk, wie es in solchen Fällen zu geschehen pflegt, sich in mehrere Parteien mit verschiedenen Kandidaten gespalten hatte, da sich die einen von menschlichen Zuneigungen, andere von Gottesfurcht leiten ließen, einigte sich schließlich alles auf einen vornehmen Mann der Stadt, der zwar sittlich unbescholten, aber noch nicht getauft und gefirmt war. Wider seinen Willen schleppte man ihn mit Hilfe der damals in der Stadt liegenden militärischen Besatzung herbei, brachte ihn vor den Altar und vor die Bischöfe und verlangte bald unter Zurufen, bald mit Gewalt seine Taufe und Wahl. Der Vorgang war allerdings durchaus nicht ordnungsgemäß, aber er geschah in gläubiger Begeisterung. Hier ist noch nicht der Platz, zu erklären, wer sich im Laufe der Zeit noch mehr als der Gewählte durch Tüchtigkeit und Frömmigkeit ausgezeichnet hatte. Halten wir uns an den Gang der Handlung und fragen wir nach dem Erfolg des Aufstandes. Die Bischöfe ließen sich beeinflussen und nahmen die Weihe, die Wahl und die Inthronisation vor, allerdings, wie sich später zeigte, mehr äußerlich als willig und mit innerer Zustimmung. Denn nachdem sie das Glück hatten, sich wieder zu entfernen, und sie wieder ihre eigenen Herren waren, traten sie zu einer Beratung zusammen; ob sie vernünftig war, weiß ich nicht. Sie berieten sich und erklärten, daß die vorgenommenen Handlungen wertlos und die Wahl ungültig wäre. Sie machten dem Gewählten Gewalttätigkeit zum Vorwurf, obwohl er selbst nicht weniger unter der Gewalt gelitten hatte, und beriefen sich darauf, daß damals manche Worte mehr aus Voreiligkeit als mit Überlegung gesprochen worden seien. Der Hohepriester aber ließ sich als guter Kritiker keineswegs durch diese Richter irreführen und zur Gutheißung des Beschlusses veranlassen. Er blieb fest und standhaft, wie wenn er überhaupt nicht mit Gewalt beeinflußt worden wäre. Weil hier wie dort Gewalt angewandt wurde, hätten entweder die, welche anklagten, angeklagt werden sollen, oder die, welche freisprachen, freigesprochen werden müssen; eigentlich hätten sie auch dann nicht, wenn sie freigesprochen hätten, freigesprochen werden sollen. Wenn sie Verzeihung verdient hätten, dann hätte sie wahrlich auch jener verdient; wenn sie aber jenem nicht gebührt hätte, dann kaum diesen. Viel vernünftiger wäre es, zuerst unter Gefahren äußersten Widerstand zu leisten, als später jemandem Schikanen zu bereiten, zumal in einer Zeit, da man besser daran täte, die bestehenden Zwistigkeiten beizulegen, statt neue auszusinnen. Die Sache entwickelte sich also.</p><p>Der Kaiser erschien, wutentbrannt gegen die Christen. Die Wahl war ihm ein Greuel. Dem Gewählten drohte Gefahr. Die Stadt war in äußerst kritischer Lage: sie konnte von diesem Tage an aufhören zu bestehen, sie konnte aber auch ihre Existenz retten und des Kaisers Gnade finden. Auf die gleiche Stufe mit der aufregenden Zerstörung des Fortunatempels zur Zeit der Erfolge wurde die Wahl dieses Mannes gestellt, in der man ein wahres Volksunglück erblickte. Der Statthalter suchte zu beruhigen und sann auf Strafe für ihn; war er sonst schon nicht gut auf ihn zu sprechen, so kam er nun wegen politischer Differenzen mit ihm in Konflikt. Er lud die, welche den Bischof gewählt hatten, schriftlich vor, damit sie Anklage gegen ihn erhöben; das Schreiben war nicht gerade höflich, sein Ton war bereits etwas drohend, wie wenn der Kaiser die Forderung gestellt hätte. Da die schriftliche Vorladung auch an meinen Vater gerichtet war, antwortete er ohne Furcht und ohne geringstes Zögern. Aus seiner Entgegnung wollen wir lernen, wie groß sein Mut und wie klar sein Geist war. Seine Antwort lautete: „Mächtigster Herrscher, wir haben nur einen einzigen Richter, der alle Handlungen prüft; es ist der König, gegen den nun der Kampf geht. Er wird auch urteilen über vorliegende Wahl, die wir dem Recht und Gott entsprechend vorgenommen haben. In anderen Dingen uns nach eurem Willen zu bezwingen, wird euch überaus leicht fallen. Doch wird niemand uns daran hindern, Handlungen zuzustimmen, die recht und gerecht geschehen sind; es müßte denn sein, daß ihr das Gesetz erlasset, es sei ein Unrecht, wenn wir für unsere Angelegenheiten sorgen.“ Selbst der Adressat mußte dieses Schreiben bewundern, wenn er sich auch etwas darüber geärgert hatte, wie die vielen aus seiner nächsten Umgebung berichteten. Das Schreiben besänftigte aber auch das stürmische Wesen des Kaisers und befreite die Stadt von der drohenden Gefahr und ― wie ich mit gutem Grunde beifügen dürfte ― uns selbst von der Schmach. Es war die Tat des Bischofs einer kleinen Stadt, eines Mannes, der erst nach dem Metropoliten kam. Ist es nicht viel besser, in dieser Weise (als einfacher Bischof) seine führende Stellung auszunützen, als von höherem Bischofsstuhle aus Worte zu machen? Ist es nicht besser ein Herrscher in der Tat, als einer dem Namen nach zu sein?</p><p>Wer sollte so weltfremd sein, aus der Geschichte meines Vaters nicht zu wissen, was zwar chronologisch erst spät geschah, der Bedeutung nach aber das Wichtigste ist und an den Anfang gehört? Wieder einmal gab es in der gleichen Stadt einen Aufstand aus gleichem Anlaß; es war nach dem rasch erfolgten Tode dessen, der zum Glück (bei der Wahl) vergewaltigt worden war, nach seinem Heimgang zu Gott, für den er ehrlich und mutig in den Verfolgungen gekämpft hatte. Je hitziger der Aufstand war, um so törichter war er auch. Wer Führer sein sollte, wußte man nämlich ebensogut, wie es bekannt ist, daß die Sonne die Führung unter den Sternen hat. Dies war durchaus klar, sowohl allen anderen, als auch besonders dem auserlesenen, reinsten Teile des Volkes, mochte er am Altare dienen oder zu unseren Nazaräern gehören, welchen allein oder doch vor allem im Interesse der Kirche die Wahl hätte zukommen sollen unter Ausschluß der reichsten und mächtigsten Leute, sowie der leidenschaftlichen und törichten Volksmasse und vor allem der käuflichsten Elemente unter ihr. Trotzdem komme ich nun in Verdacht, daß ich einer Volksherrschaft größere Ordnung zuschreibe als der kirchlichen Regierung, in der bekanntlich die Gnade herrscht, und daß ich Furcht als besseren Regenten erkläre, denn Vernunft. Welcher vernünftige Mensch hätte denn einen anderen wählen sollen, nachdem du übergangen worden warst, du, das treffliche, heilige Haupt, du, der auf die Hände des Herrn gezeichnet ist, der auf Ehe und Besitz verzichtet, fast ohne Fleisch und Blut, als Mann des Geistes seine Stellung gleich nach dem Logos hat, weise unter den Mönchen, überirdisch unter den Weltkindern, du, mein Freund und Mitarbeiter, der ― um es kühn zu sagen ― ein Teil meiner Seele ist, mein Lebens- und Studiengenosse? Ich möchte vor anderen offen über dich sprechen können und wünschte, daß in deiner Abwesenheit diese Geschichte untersucht und durch weitere Berichte erläutert wird, da ich der Schmeichelei verdächtigt werde. Ich wollte erklären: Der Geist kannte ― und das ist doch selbstverständlich! ― seinen Mann. Der Neid aber arbeitete gegen ihn. Wessen Neid? Dies zu sagen, schäme ich mich. Auch von anderen soll man es nicht erfahren, mögen sie auch fleißig über uns spotten! Wie der Fluß über die Steine, die mitten in seinem Wege liegen, so wollen wir über diese Geschichte hinwegeilen, das, was vergessen werden soll, verschweigen, und das Thema weiterführen.</p><p>Der Mann des Geistes wußte genau, was des Geistes war. Daher hielt er es für notwendig, sich vor niedriger Gesinnung zu hüten und nicht aus Parteigründen und aus Voreingenommenheit zu kämpfen, und erachtete es als Pflicht, mehr Gott als Menschen zu gefallen und nur auf den Nutzen der Kirche und das gemeinsame Wohl bedacht zu sein. In solchem Geiste schrieb und mahnte er und einigte er Volk und Priester, die Laien und die Diener des Altares, gab er Zeugnis, wählte er, ordinierte er, mochte er auch noch abwesend sein, und bevollmächtigte er greise Männer, über Fremde zu verfügen, wie wenn sie Angehörige wären. Da sich nun die Wahl an die Canones zu halten hatte, schleppte er sich schließlich, weil zur (feierlichen) Verkündigung noch ein Bischof fehlte, aus dem Bette und eilte, obwohl von Alter und Krankheit aufgerieben, wie ein junger Mann zur Stadt; eigentlich, er ließ seinen sterbenden, nur noch schwer atmenden Leib dorthin tragen in der Überzeugung, daß sein Eifer ihm trotz allem zur sanften Grabesruhe gereichen werde. Auch hier geschah ein Wunder, dem wir den Glauben nicht versagen können. Die Mühe stählte ihn, die Sorge gab ihm Jugendkraft: er nahm die Sache in die Hand, stellte seinen Mann und führte die Inthronisation durch. Auf dem Heimwege glich sein Wagen nicht mehr einem Sarge, sondern einer Arche Gottes. Seine Güte, die ich oben rühmend erwähnt hatte, zeigte sich hier in besonders schönem Lichte. Obwohl nämlich seine Kollegen über ihre schändliche Niederlage und über die tatsächliche Macht des greisen Vaters sich ärgerten und deshalb über ihn ungehalten waren und ihm zürnten, gelang es ihm durch seine Geduld, über sie Herr zu werden, da er vor allem seine Würde zum Kampfgenossen machte und nicht diejenigen schmähte, von denen er geschmäht wurde. Wäre es etwa charaktervoll gewesen, wenn er zuerst durch sein Auftreten gesiegt hätte, dann aber sich hätte von seiner Zunge besiegen lassen? Mit Hilfe der Zeit brachte er sie durch seine Güte so weit, daß sie, statt sich über ihn aufzuregen, ihn bewunderten, ihn in Schutz nahmen, vor ihm niederfielen, sich ihres früheren Verhaltens schämten, und statt ihn zu hassen, ihn als Patriarchen, Gesetzgeber und Richter verehrten.</p><p>[Forts. v. ] Den gleichen Eifer bekundete er in seinem Auftreten gegen die Häretiker, als diese in Verein mit dem gottlosen Kaiser gegen uns vorgingen, um uns gleich den übrigen zu unterwerfen, die schon fast alle geknechtet waren. Uns war er hier nicht von geringem Nutzen, teils durch seine persönliche Tätigkeit, teils wohl auch durch die Vermittlung von uns, welche er als mutige Hunde auf jene gar wilden Tiere hetzte, um uns in der Frömmigkeit zu üben. Einen Vorwurf muß ich allerdings gegen beide erheben. Nehmet mir das freie Wort nicht übel! Ich muß mich, wenn es auch lästig sein sollte, darüber beklagen, daß ihr mich über den herrlichen Weg des Priestertums gewissermaßen auf den tollen, unsauberen Markt des Seelenhandels gelockt habt, obwohl ich mich doch über das Elend des Lebens aufregte, mich deshalb wie wohl kein anderer der Altersgenossen nach der Einsamkeit sehnte und darnach strebte, sobald wie möglich diesen unheiligen Sturm und Staub loszuwerden und mich in Sicherheit zu bringen. So kam es, daß viel Leid über mich hereinbrach und auch noch bevorsteht. Wer nämlich bereits bittere Erfahrungen gemacht hat, steht der Zukunft mißtrauisch gegenüber, mag auch der Verstand anders urteilen und Besseres versprechen.</p><p>Auch folgende rühmliche Tatsache will ich nicht übergehen. In allem war er abgehärtet und konnte auch den Mantel entbehren. In der letzten Krankheit aber, welche ihn in seinem Alter heimsuchte, siechte er, da sie anhielt und gefährlich wurde, gleich anderen Menschen dahin. Etwas aber zeichnete ihn vor den übrigen Menschen vollständig aus; es kann den anderen Wundern beigezählt werden. Bisweilen nämlich, auch an einem Tage öfter, manchmal auch stündlich war er von Leiden frei, nur weil die Kommunion ihn stärkte; wie auf Befehl wurde die Krankheit geschlagen und zog sich zurück. Nachdem er fast hundert Jahre, also länger, als es David für unser Leben bestimmt, gelebt hatte, und 45 Jahre, also ein Menschenalter, Priester gewesen war, schied er in schönem Greisenalter aus dem Leben, und zwar unter den Worten und in der Haltung eines Beters, keine Spur von Sünde, wohl aber reichliche Erinnerungen an sein Tugendleben zurücklassend. Daher genießt er außergewöhnliche Verehrung bei allen, mögen sie von ihm sprechen oder nur an ihn denken. Es wird kaum jemand zu finden sein, der nicht, wenn er an ihn denkt, auch sein Bild verehrt, „die Hand an den Mund legend“, wie die Schrift sagt. So lebte er, so starb er, so wurde er vollendet.</p><p>Da die Nachwelt ein Denkmal seiner Hochherzigkeit haben sollte, gab es nichts Besseres als jene Kirche, die er Gott und uns mit kleinen Zuschüssen des Volkes, größtenteils aber aus eigenen Mitteln erbauen ließ. Das Werk darf nicht verschwiegen werden, da es an Größe die meisten, an Schönheit aber fast alle Kirchen überragt. Die Kirche ist in einem gleichseitigen, geradlinigen Achteck erbaut und strebt in zwei herrlichen Stockwerken von Säulen und Säulenhallen mit naturgetreu dargestellten Figuren in die Höhe. Von oben her wird sie durch das Gewölbe erleuchtet; zahlreiche Lichtquellen blenden das Auge: eine wahre Lichthalle. Ringsum zieht sich ein gleichwinkeliger Wandelgang von glänzendstem Gestein, welcher den großen Raum in der Mitte umschließt. Anmutig strahlen die Tore und Vorhallen und begrüßen schon von ferne die Kommenden. Noch nicht rede ich von dem äußeren Schmuck, der Schönheit und Größe der gutgefügten Quadersteine; bald ist es Marmor, wie an den Sockeln und Kapitellen, welche die Kanten verdecken, bald ist es einheimischer Stein, der aber dem ausländischen nicht nachsteht. Noch nicht spreche ich von den vielgestaltigen, bunten Gurten, welche vorspringen und eingelassen sind vom Fundament bis zur Spitze, die, den Blick versperrend, den Besucher belästigt. Wie kann man mit wenigen Worten ein Denkmal schildern, das von einer solchen Hand in so langer Zeit unter so vielen Mühen errichtet worden ist? Vielleicht genügt die Bemerkung: Während andere Städte zahlreicher privater und öffentlicher Denkmäler zu ihrem Schmucke bedürfen, vermochte diese Kirche allein schon uns weit und breit berühmt zu machen. Dies ist die Bedeutung unseres Gotteshauses. Da es aber auch einen Priester brauchte, verschaffte er ihn aus Eigenem; ob dieser dem Gotteshause entspricht, vermag ich nicht zu sagen. Genug, daß er ihn gegeben hat. Da man endlich noch der Opfer bedurfte, sorgte er hiefür in den Leiden und im Opfermut seines Sohnes, damit Gott von ihm eine vernünftige Gabe, ein geistiges Opfer erhalte, das würdig ist, an Stelle des Gesetzesopfers dargebracht zu werden.</p><p>Was sagst du, Vater? Genügen meine Worte? Nimmst du diese Lobrede, welche dir das Ehrengeleite geben, bzw. dein Grab segnen soll, als Dank für die Mühen hin, die du dir um meiner Ausbildung willen gemacht hast? Gibst du nach altem Brauch meiner Rede den Frieden, und wünschest du aus Abscheu vor einem Zuviel, daß ich sie beende, damit sie maßvoll bleibe? Oder was soll ich noch beifügen? Ich weiß, du willst, daß ich die Rede schließe. Sie genügt auch. Genehmige jedoch, daß ich noch folgendes bitte! Teile uns mit, wo der Ort deiner Herrlichkeit ist und welches Licht dich umgibt und bald auch deine Gattin umgeben wird! Berichte über diejenigen Kinder, welche du selbst noch zu Grabe getragen hast! Nimm auch mich in deine Zelte auf, wenn ich auch noch nichts oder nur erst wenig in diesem Leben gelitten habe! Zuvor aber nimm mich auf in diesem werten Grabdenkmal, das du für uns beide errichten ließest, um auch hier deinen geweihten gleichnamigen Sohn zu ehren! Schenke Nachsicht der Gemeinde (von Sasima), die ich verlassen, wie der (von Nazianz), die ich dir zulieb übernommen habe! Vor allem die ganze Herde und alle Hirten, deren Vater du genannt worden warst, ganz besonders aber den, der von dir bezwungen und väterlich und geistig überwältigt worden war, schütze auf ihren Wegen vor Gefahren, damit ich nicht weiter mehr über deine Gewaltherrschaft zu klagen brauche!</p><p>Du aber, der du über meine Worte und Handlungen richtest, was hältst du von mir? Genügen meine Worte und entsprechen sie dir, dann stimme mir zu, und wir hören darauf. Auf deine Worte warten wir; denn deine Stimme ist wahrlich Gottes Stimme. Entsprechen sie aber nicht im entferntesten der Ehre des Vaters und deinen Erwartungen: der Helfer ist nahe. Auf deine Worte warten wir, widme sie den Verdiensten des Verstorbenen, sie mögen einem erwünschten Regen gleichen! In den wichtigsten Dingen bist du ihm wahrlich verpflichtet: als Hirte dem Hirten, als geistiger Sohn dem Vater. Wäre es denn sonderbar, wenn er, der sich deiner bediente, um der Welt zu predigen, nun sich einer Rede aus deinem Munde erfreuen dürfte? Noch obliegt mir die Pflicht, mich an die geistige Sara, die gleichalterige Gattin unseres großen Vaters Abraham, vom Grabe aus mit einigen Worten zu wenden.</p><p>Meine Mutter! Verschieden ist das Leben Gottes und das der Menschen, bzw. das Leben derer, die bei Gott sind, und derer, die auf Erden weilen. Das Sein jener und alles, was zu ihrem Sein gehört, ist unveränderlich und unsterblich; denn wer fest ist, steht fest. Wie aber ist es bei uns? Unser Leben fließt dahin und vergeht und ändert sich immer wieder. Das, was wir Leben und Tod nennen, scheint zwar großer Gegensatz zu sein, geht aber ineinander über und löst sich ab. Das Leben nimmt seinen Anfang in der Vergänglichkeit, d. i. in der Mutter; es schreitet fort durch Vergänglichkeit, da es stets von neuem aus der Gegenwart ersteht; es endet in Vergänglichkeit, in der Auflösung dieses Lebens. Da der Tod von den irdischen Leiden befreit und oftmals zum himmlischen Leben führt und mehr dem Namen nach als in der Tat furchtbar ist, verdient er wohl eigentlich nicht seine Bezeichnung. Wir geraten in törichte Leidenschaft, wenn wir das fürchten, was nicht schrecklich ist, und dem freudig nachjagen, wovor man sich fürchten sollte. Nur der lebt, der nach dem Leben ausschaut. Nur der stirbt, der sündigt; denn die Sünde ist der Tod der Seele. Andere Güter, auf welche die Leute stolz sind, sind Traumgebilde, welche der Wahrheit spotten, und Erscheinungen, welche die Seele täuschen. Wenn wir dies bedenken, o Mutter, dann macht uns weder das Leben übermütig, noch das Sterben übermäßig traurig. Geht es uns denn schlecht, wenn wir das irdische Leben einmal mit dem ewigen eingetauscht haben, wenn wir, befreit von dem unsteten, trügerischen, unmäßigen, schmählich ausbeutenden Leben, als kleine Lichter das große Licht umschwärmen und dort sein werden, wo nichts in Fluß ist, alles Bestand hat?</p><p>[Forts. v. ] Du bist betrübt wegen der Trennung. Die Hoffnung soll dir Freude geben. Gewiß ist es schmerzlich, verwitwet zu sein. Für ihn jedoch ist die Trennung nicht schmerzlich. Wo ist die Liebe, wenn man das, was leichter ist, sich selbst gibt, das Schwerere aber dem Nächsten zuweist? Übrigens, was sollte derjenigen noch schmerzlich sein, die der Auflösung nahe ist? Nicht mehr ferne ist der Tag, und der Schmerz hat sein Ende. Erschweren wir uns nicht das Geringfügigste durch törichte Gedanken! Haben wir auch viel verloren, wir haben es ja gefunden. Zu verlieren, ist das Schicksal aller; zu finden, das Glück von nicht vielen. Lassen wir uns nicht durch den Verlust niederdrücken; das Finden möge uns trösten! Was wertvoller ist, soll uns beherrschen! Du hattest es sehr mutig und geduldig ertragen, noch jugendfrische, lebensfrohe Söhne zu verlieren. Ertrage es auch, daß man einen greisen Körper bestatte, der bereits lebensmüde war, mochte auch die geistige Regsamkeit ihm noch die Kraft der Nerven erhalten haben! Hast du etwa niemanden, der für dich sorgt? Wo ist denn dein Sohn Isaak, den der Vater als Ersatz für alle Verluste hinterlassen hat? Richte an den Sohn die geringe Bitte, er möge dich führen und dir dienen! Dafür aber gib ihm noch mehr, nämlich deinen mütterlichen Segen, deine Gebete und die himmlische Freiheit! Bist du ungehalten über meine Mahnungen? An dir lobe ich es, daß du viele, welche in so langer Zeit sich deiner Weisheit anvertraut haben, gemahnt hast. Nicht können sich meine Worte mit deiner großen Weisheit messen. Die in Trauer sind, bedürfen in gleicher Weise der heilenden Mahnung. Sie sollen wissen, daß es Menschen sind, die Menschen das Geleite geben.XIX. Rede</p><h2>XIX. Rede</h2><p>* XIX. Rede*.</p><p><em>Über seine eigenen Reden an den Steuerbeamten Julian</em>.</p><p>Was für eine Gewaltherrschaft ist es, unter welche uns die Liebe immer wieder beugen will? Welches ist meine Weisheit und meine Kenntnis, daß wir an allen Festtagen bestürmt werden? Mag ich auch nach allen Seiten prüfen und untersuchen: ich finde in mir gar nichts davon. Dies ist alles, was ich von mir weiß, und dies ist vielleicht ein gutes Zeichen, obwohl manche da von Dummheit sprechen werden. Mein Wunsch war es, für mein ganzes Leben dieser Welt abzusterben und ein in Christus verborgenes Leben zu führen und dem großen Kaufmann zu gleichen, der alles, was er besitzt, hingibt, um die kostbare Perle zu kaufen und das Dauerhafte und Himmlische gegen das Fließende und Irdische einzutauschen, was nach dem Urteil der Verständigen der größte und sicherste Handel ist. Sollte mir dies nicht möglich sein, so wollte ich doch in Bescheidenheit leben und die hohen Würden denen, welche darnach verlangen, abtreten, um selbst das Leben eines Schülers und Jüngers zu führen, bis es mir gelingt, mit dem süßen Wasser vernünftiger Lehren das bittere Meerwasser wegzuspülen. Dies ist der eine und erste Grund, warum ich mich nach dem Mönchtum oder der Einfalt sehne. Ich habe aber noch einen zweiten Grund und dieser ist der wichtigste.</p><p>Da ich durch meine Reden der Geschwätzigkeit der Masse nicht Einhalt gebieten, auch das alle packende leidenschaftliche Verlangen, ohne Geist die Lehren des Geistes zu lehren und vorzutragen, nicht aufhalten konnte, schlug ich einen neuen Weg, der meiner Ansicht nach besser und müheloser war, ein und suchte durch das Vorbild des Schweigens alle für Ruhe zu gewinnen. Wenn sie mich hochschätzten, mußten sie vor meiner seelischen Überlegenheit Respekt haben; wenn sie aber meine Würde nicht erkannten und mich gering achteten, mußten sie doch selbst mit dem, den sie sich gleichstellten, Schritt halten. Dies ist der Grund, warum ich Schweigen beobachtete; dies ist der Sinn unserer Zurückgezogenheit.</p><p>Was muß ich aushalten! Bald werden wir dahin, bald dorthin gezogen und gezerrt. Man prozessiert mit mir um meine Bemühungen und treibt unerbittlich von mir eine Rede wie eine Schuld ein. Man hat an mir mehr Interesse wie ich selbst. Alle sind weiser als ich und wissen besser wie ich, wann man zu reden und wann man zu schweigen hat. Sie erklärten, sie würden handeln wie das Eisen am Feuerstein und würden von ihren Belästigungen nicht eher ablassen, als bis sie dem kleinen Funken das Feuer der Rede entlockt hätten. Andere wiederum versuchen es bereits mit günstigen Versprechungen und setzen für die Rede schon hohe Preise aus. Aber sie wollen, nachdem sie Gott und uns auf die Rede hin die Ehre gegeben haben, zunächst sich selbst dienen. Sodann möchten sie, daß die Gesamtheit bezüglich der Steuerabgabe Vorteil habe und zwar sowohl mein eigenes Vermögen, soferne die Hinterlassenschaft des Vaters mir zukomme, als auch meine Gemeinde, der ich großes Unrecht täte, wenn ich nicht bereit wäre, ihr auf alle mögliche Weise Nutzen zu verschaffen. Das Gelungenste ist, daß man uns für die Rede das anbieten will, was wir durch die Rede unter vielen Mühe erreichen sollten. Ein netter Eifer, der mich hinunterkriegen möchte! Eine rühmliche Freigebigkeit! Die hübschen Folgen meines Schweigens könnt ihr selber sehen: es hat in euch erst ein recht großes Verlangen gerade nach meinen Reden geweckt. Ihr seht die Frucht unserer Weltflucht. Möge nun mein Reden ebenso schöne Früchte zeitigen wie mein Schweigen!</p><p>Da ihr es nun so wollt und ihr den Unbesiegbaren besiegt und über meine Askese triumphiert habt, so will ich an euch Worte richten, die wertvoller sind als mein Schweigen. Meine Rede wird nicht weich und zurückhaltend, kein Künstlergenuß sein, wie ihn die Masse so sehr liebt; sie soll keine süße Antwort auf euere Liebe sein, sondern kräftige, harte Worte, die euch bessern sollen, indem sie euch vom Fleische weg zum Geiste führen und euere Gedanken mit Macht zum Himmel erheben. „Ihr Menschenkinder, wie lange noch sind eure Herzen beschwert? Warum liebt ihr Eitelkeit und sucht ihr Lüge?“ ― um meine Rede mit dem redegewaltigen David zu beginnen. Denn ihr haltet viel auf das irdische Leben, auf Vergnügungen, auf ein bißchen Ansehen, ein wenig Herrschaft und fleischliches Wohlergehen. Doch von diesen Gütern haben die, welche sie besitzen, nicht mehr als die, welche sie erhoffen, und diese nicht mehr als die, welche sie gar nicht einmal erwarten. Wie der Staub vom Sturmwind werden sie bald dahin, bald dorthin geworfen und geschleudert, oder sie schwinden wie der Rauch, täuschen wie der Traum oder sind unfaßbar wie der Schatten. Sind sie fern, dann hat der, welcher sie nicht hat, noch einige Hoffnung; sind sie da, dann kann sich der, welcher sie hat, nicht auf sie verlassen.</p><p>Sollen wir nicht zum Himmel aufblicken? Sollen wir nicht nüchtern werden? Sollen wir nicht die Augen reinigen und heilen? Wollen wir nicht lernen, welches der wahre Reichtum, die wirkliche Herrlichkeit ist? Wo ist die unvergängliche Würde? Welches ist das grenzenlose Glück? Wo ist das Gute, das nicht erschüttert wird, sich nicht ändert und nicht unter Nachstellungen leidet? Müssen wir nicht die irdischen Güter, wenn wir sie überhaupt erhalten, mit viel Schweiß und Mühe erwerben? Ist es, wenn man auf dieser Welt Freude haben soll, nicht die Hoffnung, die uns erfreut? Wollen wir nicht auf die heiligen Märtyrer achten, sowohl auf alle jene, welche gemeinsam wie ein Netz den ganzen Erdkreis umspannen, als auch auf die, welchen das heutige Fest gilt? Warum haben sie Wunden, Fesseln, Foltern, die Drohungen mit Feuer und Schwert, wilde Tiere, Finsternis, Hunger, Abgründe, Konfiskation, Verstümmelung und schließlich den Tod geduldig ertragen und gekämpft, wie wenn sie an ihrem eigenen Leibe nichts spüren würden? Wenn wir auch die Fragen nicht beantworten, muß es doch allen klar sein, daß sie etwas werden, etwas erben wollten. Sollen wir nicht in derselben Hoffnung unter dem gleichen Preis- und Kampfrichter gegen denselben Tyrannen, den dauernden, bitteren Verfolger der Seelen, den unsichtbaren Feind und Gegner, streiten? Sollen wir nicht in ähnlicher Weise in dieser Welt ringen und sie zu einem gemeinsamen Kampfplatz machen? Nicht bedarf es tödlicher Gefahren, es genügt das Ringen und Kämpfen des Alltags, um des gleichen oder eines ähnlichen Lohnes gewürdigt zu werden.</p><p>[Forts. v. ] Da derselbe Kampf alle ruft, mahne ich alle, Männer und Frauen, alt und jung, Städter und Landleute, hoch und nieder, reich und arm, sich gerne zu ihm zu rüsten, nicht zu erlahmen und zu zögern und die Gelegenheit, die nimmer wiederkehrt, nicht unbenutzt vorübergehen zu lassen. Jetzt ist die Zeit zu arbeiten; die Zukunft bringt den Lohn. Ihr habt das Wort des Heilandes gehört: „Stehet auf! Lasset uns weggehen!“ Damit wollte er nicht so sehr seine damaligen Jünger von dem Orte in Judäa wegführen, als vielmehr alle späteren Jünger aus dieser Welt abberufen und dem Versprechen gemäß zu sich in den Himmel ziehen. Folgen wir dem guten Herrn! Fliehen wir vor den weltlichen Begierden! Fliehen wir vor der trügerischen Welt und ihrem trügerischen Herrn! Weihen wir uns ehrlich unserem Schöpfer! Haben wir Ehrfurcht vor seinem Ebenbilde! Achten wir auf unsere Berufung, ändern wir das Leben! Warum erniedrigen wir uns, nachdem wir doch erhöht worden sind? Warum hängen wir uns an sinnliche Dinge?</p><p>Jeder soll, was er kann, Gott opfern zu jeder Zeit, in jeder Lebenslage nach dem Maße seines jeweiligen Vermögens und der ihm geschenkten Gaben, damit wir alle himmlischen Wohnungen mit lauter Tugenden anfüllen und ernten, was wir gesät haben, bzw. in den göttlichen Scheunen aufspeichern, was wir gearbeitet haben. Der eine bringt als Opfer Geld, der andere seine Armut, der eine seinen guten Willen, der andere die Aufnahme eines gutwilligen Menschen, der eine eine lobwürdige Tat, der andere eine treffliche Idee, der eine ein zeitgemäßes Wort, der andere vernünftiges Schweigen, der eine eine korrekte Lehre und ein unanstößiges Leben, der andere einen willigen und verständigen Gehorsam, der eine eine heilige, von der Welt vollständig trennende Jungfräulichkeit, der andere eine würdige, sich nicht ganz von Gott trennende Ehe, der eine ein bescheidenes Fasten, der andere ein nicht ausschweifendes Genießen, der eine das Verharren im Gebete und in geistigen Gesängen, der andere die Armenfürsorge, alle aber Tränen, Läuterung, Aufstieg und „Streben nach dem, was vorwärts liegt“.</p><p>Eine schöne, einfältige Gabe ist es, sich im Lachen zu mäßigen, im Zorn zu beherrschen, die Augen im Zaum zu halten und den Geist vor Irrgängen zu bewahren. Mag eine Gott dargebrachte Gabe noch so geringfügig sein und seiner Würde bei weitem nicht entsprechen, sie ist doch nie so unbedeutend, daß sie gar nicht genehm wäre und nicht angenommen würde, wenngleich er Barmherzigkeit nach Gerechtigkeit zuweist. Er nimmt an des Paulus Pflanzen, des Apollos Begießen, die zwei Heller der Witwe, die Demut des Zöllners und das Bekenntnis des Manasse. Als Moses das Zelt, welches ein Abbild des Himmels war, aufgeschlagen hatte, brachten alle die vorgeschriebenen Gaben dar: die einen gaben gerne Gold, andere Silber, andere Edelsteine für das Schultertuch, Frauen brachten zum Teil gewobenen Byssus, gesponnenen Karmesin oder Purpur, teils rotgefärbtes Widderfell, teils das mindeste, nämlich Ziegenhaare für Zeltarbeiten. Jeder Mann, jede Frau gaben, was sie gerade hatten; alle nahmen am Opfer teil, keiner, auch nicht der Ärmste, kam mit leerer Hand. So wollen wir unserseits dem ehrwürdigen Zelte Gottes, d. i. der Kirche, welche der Herr und nicht ein Mensch aufgeschlagen hat und welche durch die bunte Schönheit der Tugend errichtet wird, kleinere oder größere Opfer bringen, auf daß ein vollkommenes Werk erstehe, Christus, der heilige Tempel erbaut werde, in dem wir durch die Kunst des Geistes uns harmonisch verbinden. Doch mögen wir auch alles opfern, so stehen gleichwohl unsere Opfer gegenüber den Gaben, die wir empfangen haben, vollständig zurück. Denn Gott verdanken wir es, daß wir sind, daß wir Gott kennen und daß wir etwas, was wir opfern können, besitzen. Das schönste und Erfreulichste ist aber, daß Gott die Opfer nicht nach der Güte der geschenkten Materie, sondern nach der Seele und nach der Gesinnung des Opfernden einschätzt.</p><p>Darum schiebe es nicht hinaus, gütig zu sein! Sei es sofort! Verzichte nicht deshalb ganz und gar darauf zu opfern, weil du kein ansehnliches Opfer bringen kannst! Etwas opfere gleich, anderes halte zum Opfer bereit, für anderes erbitte dir wegen deiner Dürftigkeit Verzeihung! „Nicht sollst du“, wie die Schrift sagt, „leer vor mir erscheinen!“ Keiner soll leer und ohne Opfer sein, keine Seele sei unfruchtbar und ohne Erträgnis! Jeder bringe Gott ein Opfer von dem, was es gerade gibt und was er selbst besitzt! Der Sünder bringe als Gabe die Reue, der, welcher den rechten Weg geht, die Ausdauer, der Jüngling die Enthaltsamkeit, der Greis die Klugheit, der Reiche die Freigebigkeit, der Arme den Dank, der Mächtige die Bescheidenheit, der Steuerbeamte die Milde! Ihr Priester, kleidet euch mit Gerechtigkeit! Oder ― um mich richtiger auszudrücken ― kleiden wir uns damit! Zerstreuen wir nicht die Schafe der Herde, und richten wir sie nicht zugrunde, für welche der gute Hirte sein Leben hingegeben hat, der die Seinigen kennt und von den Seinigen gekannt wird, der sie mit Namen ruft, sie eintreibt und vom Unglauben zum Glauben und von diesem Leben in die Ruhe des Jenseits führt! Fürchten wir, daß, wie die Schrift droht, das Gericht bei uns beginnt und daß wir von der Hand des Herrn sowohl dafür gestraft werden, daß wir selbst nicht hineingehen, wie dafür, daß wir andere am Eintritt hindern!</p><p>[Forts. v. ] Ihr Schafe, nicht dürft ihr die Hirten weiden, nicht sollt ihr euch über die euch gesetzten Grenzen erheben! Es muß euch genügen, wenn ihr auf gute Weide geführt werdet. Richtet nicht über die Richter, und gebet nicht Gesetze den Gesetzgebern! Denn „Gott ist nicht ein Gott der Auflehnung und Unordnung, sondern des Friedens und der Ordnung.“. Nicht soll einer Haupt sein, wenn er kaum Hand oder Fuß oder sonst ein minderwertiges Glied des Körpers ist. Brüder, jeder verbleibe in seinem Berufe, mag er auch eines höheren würdig sein! Wenn er den Beruf, in dem er steht, hochhält, findet er mehr Anerkennung, als wenn er nach einem Berufe strebt, den er nicht erhalten hat. Kann einer ohne Gefahr einem anderen Menschen folgen, dann soll er nicht darnach verlangen, unter Gefahren ihm voranzugehen. Das Gesetz der Unterordnung, das die Erde wie den Himmel beherrscht, möge man nicht aufgeben! Vermeiden wir die Vielherrschaft, um nicht in Anarchie zu fallen! Ihr Gelehrten, vertraut nicht zu sehr auf euere Gelehrsamkeit, eure Gescheitheit übersteige nicht die Grenzen der Vernünftigkeit! Seid nicht so töricht, alles bemeistern zu wollen, sondern nehmet es gutmütig hin, wenn ihr manchmal die Waffen strecken müßt! Euer Wort gelte der Vernunft! Machet aus eurer Bildung eine Waffe der Gerechtigkeit, nicht des Todes!</p><p>Soldaten, seid mit eurem Lohne zufrieden und stellet nicht unmäßige Forderungen! So will es von euch auch Johannes, der große Herold der Wahrheit, die dem Worte vorauseilende Stimme. Was für einen Lohn meint er? Natürlich die vom König verliehene Verköstigung und die vom Gesetz für die Würden bestimmten Geschenke. Von wem kommt das, was zu viel ist? Ich zögere, das beleidigende Wort zu sprechen. Ihr wißt es übrigens, wenn ich auch zurückhalte. Ihr Politiker, „gebt dem Kaiser, was des Kaisers ist, und Gott, was Gottes ist!“ Gebet dem einen die Steuer, dem anderen Ehrfurcht! Wenn ich von Ehrfurcht rede, warne ich vor Habsucht. Welchen Vorteil ― so werdet ihr wohl fragen ― werden wir nun davon haben? Den allergrößten! Ihr werdet ― wenn ihr wollt, durch meine Vermittlung ― das Herrliche, was wir hoffen, und die höchsten Stellen im Himmelreiche gewinnen, nicht Ämter in dieser kleinen, unbedeutendsten Stadt, über die zu regieren keineswegs erhebend und ruhmvoll ist, um mich gegenüber meiner Vaterstadt maßvoll auszudrücken. Unser Wunsch soll sein, daß wir im Himmel die Ersten werden. Nach himmlischem Glanze sollen wir streben. Zum Lohn für unser Wohltun im Diesseits wollen wir im Schoße Abrahams ausruhen. Gerechte Gerichte wollen wir halten, der Armen und Dürftigen uns annehmen, der Witwen und Waisen uns erbarmen, die zum Tode Verurteilten loskaufen, bzw. ― um mich vorsichtig auszudrücken ― an ihrer Hinrichtung nicht teilhaben. Den, der uns sogar um die Brosamen des Tisches anbettelt, können wir nicht verachten, an dem, der mit Wunden bedeckt vor unseren Türen sitzt, nicht vorübergehen; wir können nicht, während andere leiden, den Vergnügungen nacheilen, von unserem Mitarbeiter uns nicht mit Ekel abwenden. Meine Freunde und Brüder, wir wollen es nicht mit dem Reichen halten, um nicht in den Flammen zu leiden, von den Heiligen durch einen Abgrund getrennt zu werden und den armen Lazarus umsonst zu bitten, unsere glühende Zunge mit den Fingerspitzen zu kühlen. Befleißigen wir uns der Güte, der Barmherzigkeit, des Mitleids! Ahmen wir die Güte dessen nach, der seine Sonne über Gute und Böse aufgehen und über alle in gleicher Weise regnen läßt! Bereichern wir uns nicht durch die Not anderer! Entfernen wir uns nicht so weit von der göttlichen Gerechtigkeit! An unserem Reichtum sollen nicht anderer Tränen haften, welche gleich Rost und Motte ihn verzehren oder ― um mit der Schrift zu sprechen ― „ausspeien“ würden. Haben wir mehr, als wir brauchen: auch Überfluß hat sein Gutes. Schenken wir davon in diesem Leben etwas her, damit wir im anderen Leben reich werden!</p><p>Diese Mahnungen betreffen alle in gleicher Weise, nicht nur die im politischen Leben stehenden Leute. Da die Krankheit gemeinsam ist, sind auch die Heilmittel gemeinsam. Stelle als unser Steuerbeamter eine gerechte Steuerliste auf! Nicht brauchst du bezüglich meiner Reden, die keinen oder nur wenig Gewinn abwerfen und die nur den Ohren dienen und sie erfreuen, ein besorgter Finanzbeamter zu sein; wohl aber sollst du gut und nachsichtig gegen mein Volk sein. Wenn von nichts anderem, dann lasse dich doch von der Festzeit beeinflussen; denn eine Zeit der Steuerlistenaufstellung war es, da der Heiland geboren wurde. Es erging, wie es heißt, vom Kaiser Augustus der Befehl, den ganzen Erdkreis zu beschreiben, was auch geschah, und Joseph ging mit Maria, dem mit ihm verlobten Weibe, nach Bethlehem hinauf, um sich eintragen zu lassen, da er aus dem Hause und der Familie Davids war. Damals nun wurde der Erlöser geboren und zwar ― wie sonderbar! ― er, der Weltschöpfer und Herr, in einer armseligen kleinen Herberge. Ehren wir dies Geheimnis! Beten wir den Ratschluß an! Bringen auch wir für den Festtag ein Opfer! Jetzt freuen sich die Engel, jetzt werden die Hirten von Licht umstrahlt, jetzt geht im Osten der Stern auf, um dem größten und unzugänglichen Lichte entgegenzueilen, jetzt fallen die Magier unter Darbringung von Geschenken nieder, erkennen den König der Welt, schließen aus dem erschaffenen Stern mit Recht auf den himmlischen. Jetzt rast Herodes und mordet die Knäblein, um des Befreiers willen tötet er die, welche die Freiheit erlangen sollten. Wir wollen uns denen anschließen, welche ihn anbeten, wollen aber dem, der unsertwegen sich bis zur Menschwerdung erniedrigt hat, nicht wegen seiner Gottheit Weihrauch oder wegen seiner Königswürde Gold, oder, weil er uns zulieb den Tod gekostet hat, Myrrhe opfern, sondern geistige, übersinnliche Gaben, d. h. wir wollen nicht auf Kosten der Armen etwas annehmen oder uns bereichern, noch ein Geschöpf gegen das andere ausnützen.</p><p>Ob du Steuern eintreibst, ob du sie auszahlst, du tust es in Christus. In Vereinigung mit dem Haupte machst du die Schätzung, mit dem Logos erwägst du. Christus wird dir jetzt geboren. Er ist Gott und wird Mensch und verkehrt mit Menschen. Was ist damit gesagt? Ich meine, es ist denen, welche mit solchen Ämtern betraut sind, die Lehre gegeben, daß sich Gott an den wichtigsten Ämtern stets beteiligt. Um die Steuerbeamten zur Gewissenhaftigkeit zu erziehen, ist er gerade damals Fleisch und Mensch geworden; um uns in unseren Untertanenpflichten zu ermuntern und die nicht zu vernachlässigende Loyalität zu lehren, zahlte er die Doppeldrachme nicht nur für sich selbst, sondern auch für Petrus, den geehrtesten seiner Jünger. Denn unsertwegen ist er Mensch geworden und hat er Knechtsgestalt angenommen, und unserer Sünden wegen ist er in den Tod geführt worden. So wirkte der Erlöser; nur durch seinen Willen wollte er, der Gott, uns erlösen, nachdem er durch sein Wort die Welt erschaffen hatte. Das Wertvollste und Ergreifendste, was er uns geschenkt hat, ist Mitleid und Solidarität. Was haben wir als Jünger des sanften, gütigen, so dienstbereiten Christus zu tun? Müssen wir nicht die Barmherzigkeit des Herrn nachahmen? Müssen wir nicht gegen unsere Mitknechte gut sein, damit der Herr uns mit gleichem Maße vergelte, mit dem wir messen? Sollen wir nicht durch Milde unsere Seelen retten? Es ist genug, daß man als freier Mensch dienen muß und daß die Gegensätze so groß sind, daß, obwohl alle aus dem gleichen Staube kommen, die einen herrschen, die anderen beherrscht werden, die einen Abgaben auferlegen, die anderen Abgaben zahlen, die einen Unrecht und Leid zufügen dürfen, die anderen betteln und ringen müssen, um von der Not verschont zu bleiben. Diese Gegensätze finden sich an ein und demselben (göttlichen) Ebenbilde, an den Geschöpfen derselben Würde, an den Erben des gleichen Lebens, für welche Christus in gleicher Weise gestorben ist. Es ist genug, daß freie Menschen solches Schicksal erfahren müssen. Nicht darf das Joch noch schwerer, nicht die Strafe für die Erbsünde noch drückender werden!</p><p>Möge die Sünde, ihre erste Grundlage, sowie der Böse zugrunde gehen, welcher, während wir schliefen, unter uns das Unkraut säte, damit, gleichwie das Aufhören des Lichtes der Anfang der Finsternis ist, ebenso die Vernachlässigung des Guten der Anfang der Sünde würde. An unserem irdischen Elend ist schuld der Baum (im Paradiese), der verfluchte Genuß, die verführerische Schlange, der Ungehorsam, welcher dem Leben den Schweiß des Angesichtes eintrug. Hierin liegt die Ursache meiner Nacktheit und Unschönheit. Deshalb habe ich meine Blöße erkannt und mich mit Fellen bekleidet. Deshalb wurde ich aus dem Paradies vertrieben und auf die Erde, von welcher ich gekommen war, verstoßen, wo ich an Stelle der (verlorenen Paradieses-)freuden nur noch das eine Glück genieße, daß ich meine Sünden erkenne. Nicht zur Verminderung der Freuden, sondern zu dauerndem Schmerze und zum Kampfe mit dem, der mir schmeichelte und mich durch den Genuß verführte, wurde ich verurteilt. Dies ist der Lohn für die Sünde. Sie ist schuld, daß ich in Mühsalen geboren wurde und lebe, um zu sterben. Sie ist die Mutter der Not, die Not aber ist die Mutter der Habsucht und die Habsucht die Mutter der Kriege. Der Krieg aber ist der Vater der Steuern, der schwersten Last in diesem verfluchten Leben. Verlängern wir nicht noch die Strafe! Wir leiden ja alle unter dem gleichen Urteile. Tun wir einander nichts Böses! Gott will, daß wir einander Wohltaten erweisen, möge er auch uns strafen.</p><p>[Forts. v. ] Es wird noch eine Aufzeichnung und einen Aufzeichnenden von anderer Art geben. Vielleicht hast du gehört von einem Buche der Lebenden und einem Buche derer, welche gerettet werden? Wir alle werden eingeschrieben werden, bzw. jeder ist bereits seiner Lebensführung entsprechend eingetragen. Reichtum hat dort keinen Vorzug und Armut ist nicht im Nachteil; Schönheit, Anfeindung und alle die übrigen Umstände, durch welche sich in diesem Leben das Gericht beeinflussen läßt, haben dort keine Bedeutung. Der Finger Gottes hat uns alle eingeschrieben, und am Tage der Offenbarung wird uns das Buch geöffnet werden. Der kleine und der große Mann ist dort eingetragen, der Diener zugleich mit dem Herrn, um mit Salomon zu reden, ferner der König zugleich mit dem Untertan, der Steuerbeamte mit dem Steuerpflichtigen und die Herrlichkeit ist nahe bei... Doch ich will das unschöne Wort nicht aussprechen. Wie wir die Listen führen, so wird die Liste über uns geführt werden. Zeige dich uns milde und gütig, und du wirst dir eine günstige Aufzeichnung verschaffen.</p><p>Was sagst du dazu? Was schreibst du, bester Freund und Altersgenosse, der du die gleichen Lehrer und die gleiche Schule wie wir gehabt hast? Allerdings hat Gott uns jetzt, um euch Beamte zu belehren, ein besseres ― um nicht zu sagen ― schwereres Los übertragen. O Sprosse eines gottesfürchtigen Landes und Geschlechtes, heiliger Sohn heiliger Eltern, du Wurzel noch heiligerer Kinder! Wie nimmst du wohl meine Worte entgegen? Oder sollen wir noch länger sprechen, um dich zu gewinnen? Daß mein Wort dich schon längst beeinflußt hat, brauche ich nicht erst zu vermuten; ich weiß es bestimmt. Auf jeden Fall können wir uns gerade darauf verlassen, daß du dich stets mit Leichtigkeit dafür gewinnen läßt, entweder im Guten voranzugehen oder zu folgen. Hierin unterscheiden sich die Gebildeten von der Masse. Nur noch Weniges will ich dem Gesagten beifügen. Du hast mich für meine Rede irgendwie belohnt. Meine Rede aber schenkt dir und führt dir zu die Armen, die ganze Schar der Priester, die Schar der Mönche, welche keine Fessel an diese Erde kettet, welche nur den Körper ― und nicht einmal diesen vollständig ― ihr eigen nennen, welche dem Kaiser nichts geben können, alles aber Gott geben, nämlich ihre Gesänge, Gebete, Nachtwachen, Tränen, einen unfaßbaren Besitz, das Sterben gegenüber der Welt, das Leben in Christus, das Ertöten des Fleisches, die seelische Loslösung vom Leibe. Mit diesen Leuten habe Nachsicht oder vielmehr überlasse mit reinen Händen Gott die Diener Gottes, seine Geweihten, die das Himmlische schauen, die Erstlinge unseres Geschlechtes, die Säulen, die Kronen des Glaubens, die kostbaren Perlen, die Steine des Tempels, d. i. der herrlichen Macht der Kirche, deren Grund- und Eckstein Christus ist! Du würdest ihnen, dir selbst und uns allen einen herrlichen Dienst erweisen. Ich wünsche dir mehr diesen unseren Reichtum als viele Schätze von Gold und Silber, welche stets gegeben werden, um nach kurzem nicht mehr zu sein.</p><p>Hiemit habt ihr ein Geschenk meiner Beredsamkeit. Ihr möget vielleicht ein größeres erwartet haben, aber es entspricht unseren Kräften. Zur Vergeltung mögt ihr mir als noch größere Gabe eure Glaubensbereitschaft schenken! Dann bedürft ihr u. a. auch nicht mehr so sehr meiner Worte; denn ihr werdet auf einander achten, um euch zu Liebe und guten Werken zu ermuntern. Dann werden wir in der guten, lieben, himmlischen Liste eingetragen und führen unseren Reigen vor dem Weltkönig auf, worin die einzige Tätigkeit der im Himmel Eingeschriebenen besteht. Dann wollen wir Gott dienen, indem wir ein und dasselbe Lob dem Vater, dem Sohne und dem Heiligen Geiste spenden, die Herrlichkeit und den Glanz der Gottheit schauend und verherrlichend; denn ihm ist Herrlichkeit und Ehre und Anbetung in alle Ewigkeit. Amen.XX. Rede</p><h2>XX. Rede</h2><p><em>XX. Rede</em>.</p><p><em>Über die Glaubenslehre und die Aufstellung der Bischöfe</em>.</p><p>Wenn ich die Geschwätzigkeit unserer Zeit wahrnehme und die Eintagsphilosophen und die durch Stimmenzahl gewordenen Theologen, die nur dem Wollen ihre Weisheit verdanken, sehe, dann sehne ich mich nach der himmlischen Weisheit und suche mit Jeremias einen entlegenen Platz auf, um für mich allein zu sein. Was ich am höchsten schätze, ist, die Sinne einschlummern zu lassen, vom Fleisch und der Welt loszukommen, mit menschlichen Angelegenheiten mich nur im höchsten Notfalle abzugeben, mich mit mir und Gott zu unterhalten, über dem Sinnlichen erhaben zu leben, stets die göttliche Prägung tadellos und frei von den irdischen Eindrücken und Irrtümern in mir zu erhalten, jetzt und immer dem reinen Spiegel zu gleichen, der Gott und das Göttliche widerspiegelt, mit dem schwächeren Lichte das stärkere aufzunehmen, bis wir zur Quelle irdischen Glanzes gelangen und das glückliche Ziel erreichen, wo der Spiegel durch die Wahrheit ersetzt wird. Denn mag sich einer auch durch lange Beschäftigung mit der Philosophie geschult und gebildet und allmählich das Edle und Lichte seiner Seele von dem Erniedrigenden und Düsteren losgerissen haben oder mag er Gottes Barmherzigkeit gefunden haben oder mag ihm beides zuteil geworden sein und er sich ganz besonders damit abgeben, seinen Blick himmelwärts zu richten, so wird er doch nur mit großer Mühe über die abwärtsziehende Materie Herr. Solange wir nicht diese mit aller Kraft bezwungen und Ohren und Denken genügend gereinigt haben, halte ich es für unsicher, Seelenführung zu übernehmen oder sich mit theologischen Fragen zu befassen.</p><p>[Forts. v. ] Was führt mich zu dieser Besorgnis? Denn nicht sollt ihr meinen, ich sei ohne Not ängstlich. Ihr sollt vielmehr meine Vorsicht bewundern. Als Gott zu Moses sprach, mußten, wie ich höre, obwohl viele an den Berg gerufen worden waren und unter diesen sich selbst Aaron mit seinen zwei Söhnen, den beiden Priestern, befand, doch alle übrigen nur von ferne anbeten; Moses allein durfte sich nähern, während es dem Volke untersagt war, mit ihm hinaufzusteigen. Die übrigen wurden, wie kurz zuvor berichtet wird, von Blitz und Donner, vom Trompetenschall, von dem Rauch, welcher den Berg ganz eingehüllt hatte, von den beängstigenden Drohungen und dergleichen Schrecken in der Ebene festgebannt; es war ihnen schon viel wert, daß sie, nachdem sie sich gründlich gereinigt hatten, Gottes Stimme hören durften. Moses dagegen stieg hinauf, trat in die Wolke ein, verkehrte mit Gott und empfing das Gesetz, das der Masse Buchstaben, denen aber, die über dem Volke stehen, Geist bedeutet.</p><p>Auch die Geschichte des Priesters Heli und des etwas später lebenden Oza ist mir bekannt. Jener wurde für die von seinen Söhnen an den Opfern begangenen Sünden bestraft und zwar, obwohl er ihre Gottlosigkeit nicht zuließ, sondern sie deswegen wiederholt zurechtwies. Dieser rettete zwar die von dem Rinde umgestürzte Bundeslade, starb aber, nur weil er dieselbe zu berühren wagte; so schützte Gott deutlich die Heiligkeit, welche man der Bundeslade schuldete. Wie ich weiß, durfte die Menge nicht einmal die Mauern des Tempels berühren, weshalb für das Volk noch besondere äußere Mauern errichtet werden mußten. Auch durften die Opfer nur von bestimmten Personen, zu bestimmter Zeit und an bestimmten Orten gegessen werden. So wenig war es gestattet, daß jedermann ungehindert den Tempel betrete oder den Vorhang, den Sühnedeckel und die Bundeslade schaue oder berühre.</p><p>Da mir diese Erzählungen bekannt sind und ich weiß, daß keiner des großen Gottes, Opfers und Priesters würdig ist, der nicht zuvor sich selbst als lebendiges Opfer Gott geweiht hat, bzw. ein heiliger und lebender Tempel des lebendigen Gottes geworden ist, wie sollte ich es wagen, voreilig mich der Theologie zu widmen und jemanden zu genehmigen, der sich verwegen heranmachen möchte! Solches Verlangen nach dem geistlichen Amte ist nicht zu loben; die Übernahme wäre schrecklich. Zunächst ist es notwendig, sich selbst zu reinigen; dann erst kann man mit dem Reinen verkehren. Andernfalls würden wir das Schicksal des Manue erleiden und beim Anblick Gottes ausrufen: „Wir gehen zugrunde, Weib, wir haben Gott geschaut!“ Oder wir müßten gleich Petrus Jesus aus dem Schiffe weisen, weil wir solchen Verkehres nicht würdig wären, oder wir müßten gleich dem bekannten Hauptmann zwar um Heilung bitten, dürften aber den Arzt nicht aufnehmen. Solange einer von uns noch Hauptmann ist und über die Masse noch sündhafte Gewalt ausübt und noch im Dienste des Kaisers, des Weltbeherrschers und Gebieters über die Erdenpilger, steht, muß er sagen: „Ich bin nicht würdig, daß du in mein Zelt eintrittst.“ Wenn ich aber, mag ich auch geistig klein, ein Zachäus, sein, von einem Feigenbaume herab Christus sehe, nachdem ich die irdischen Glieder ertötet und den erniedrigten Leib vertilgt habe, dann werde ich Jesus aufnehmen und von ihm die Worte hören: „Heute ist diesem Hause Heil widerfahren“, dann werde ich das Heil erlangen und ein vollkommener Weiser sein und die sündhaft gesammelten Güter, sei es Geld, seien es Wissensschätze, nutzbringend verteilen.</p><p>Nachdem wir mit Worten an der persönlichen Reinigung der Theologen gearbeitet haben, wollen wir nun im Vertrauen auf den Vater, den Sohn und den Heiligen Geist, denen unsere Rede gehören soll, uns kurz über Gott unterhalten. Ich will mit Salomon von mir sagen können, daß ich über Gott weder eigene Gedanken noch eigene Worte habe. Wenn nämlich Salomon erklärt: „Ich bin der törichteste von allen Menschen, und menschlicher Verstand ist nicht in mir“, so will er sich damit keineswegs der Torheit beschuldigen. Wie soll er, der doch Weisheit, Kenntnis und Weite des Herzens, was er von Gott vor allem erfleht hatte, in einer Fülle und Menge, welche den Sand übertrifft, empfangen hatte, und der so weise war und solche Gnaden erhalten hatte, sich selbst als den allertörichtesten bezeichnen? Er will offenbar sagen, daß er seine Weisheit nicht aus sich habe, daß göttliche und vollkommene Weisheit in ihm wirke. Wenn Paulus sagte: „Nicht mehr ich lebe, sondern Christus lebt in mir“, wollte er sich keineswegs als tot bezeichnen, sondern erklären, daß sein Leben vorzüglicher ist als das der Menge, weil er an dem wahren, von keinem Tod begrenzten Leben Anteil erhalten habe.</p><p>Wir beten den Vater, den Sohn und den Heiligen Geist an, ihre Proprietäten unterscheidend, aber ihre Einheit in der Gottheit bekennend. Um nicht in die Krankheit des Sabellius zu fallen, verwischen wir nicht die Drei zu Einem. Und um nicht an dem Wahnsinn des Arius teilzunehmen, trennen wir sie nicht in drei fremde, verschiedene Wesen. Muß man denn ein Bäumchen, wenn es sich nach der verkehrten Seite hinüberneigt, gewaltsam nach der entgegengesetzten Seite wenden? Soll man die Verkrümmung durch Verkrümmung heilen? Soll man nicht vielmehr in der Mitte gerade aufrichten, um innerhalb der Grenzen des Glaubens zu bleiben?</p><p>Wenn ich das lehre, was in der Mitte liegt, sage ich die Wahrheit; auf sie allein achten wir mit Recht. Wir wollen keine schlimme Vermengung und keine noch törichtere Trennung. Dadurch, daß man aus Furcht vor Vielgötterei den Logos zu einer einzigen Hypostase vereint, würden uns in dem Bekenntnis des einen Vaters und Sohnes und Heiligen Geistes nur noch leere Namen gelassen werden, und wir würden nicht so sehr erklären, alle seien* eins*, als vielmehr, jeder sei nichts; denn, wenn sie ineinander über- und aufgehen, würden sie aufhören zu sein, was sie sind. Nicht sollen sie anderseits, wie es die mit Recht als Wahnsinn bezeichnete Lehre des Arius will, in drei fremde, ungleiche und auseinandergerissene Wesen getrennt werden oder der Macht und Ordnung entbehren und gewissermaßen gottfeindlich sein, sofern sie bald, wenn nur dem Unerzeugten Göttlichkeit zugeschrieben wird, in jüdische Engherzigkeit eingeschlossen werden, bald ― was noch törichter denn das Gesagte ist ― als drei Mächte und drei Götter in das entgegengesetzte, gleich große Übel gestürzt werden. Man darf den Vater nicht so lieben, daß man ihm die Vaterschaft raubt. Denn könnte er Vater sein, wenn der Sohn anderen Wesens und gleich der Schöpfung ihm entfremdet ist? Auch darf man Christus nicht so lieben, daß man nicht auch die Sohnschaft festhält. Denn wie könnte er Sohn sein, wenn er nicht (Gott) den Vater als seinen Urgrund erklärt? Nicht darf man dem Vater die Würde des Anfanges, d. i. die Würde, Vater und Erzeuger zu sein, schmälern. Wäre er nicht die Ursache der im Sohne und im Geiste geschauten Gottheit, dann wäre er nur der Anfang für kleine, minderwertige Geschöpfe. Es ist notwendig, die Einheit Gottes festzuhalten und die Dreiheit in den Hypostasen, bzw. Personen zu bekennen, deren jede ihre Proprietät besitzt.</p><p>[Forts. v. ] Nach meiner Ansicht dürfte die Lehre von dem einen Gott dadurch festgehalten werden, daß der Sohn und der Geist auf eine einzige Ursache zurückgeführt, nicht aber vermengt und verwischt werden. Auf eine einzige Ursache sind sie zurückzuführen wegen ein und derselben sog. Bewegung und ein und desselben Willens der Gottheit und wegen der Gleichheit ihres Wesens. Die Lehre von den drei Hypostasen dürfte dadurch festgehalten werden, daß an keine Verwischung, Auflösung oder Vermengung gedacht wird; denn nicht soll das All durch die aufgelöst werden, welche die Einheit ungebührlich hochschätzen. Die Lehre von den Proprietäten dürfte dadurch festgehalten werden, daß man den Vater als anfangslos und als Anfang, d. i. als Ursache, Quelle, ewiges Licht, denkt und erklärt, den Sohn aber als nicht anfangslos und als Anfang der Schöpfung. Wenn ich hier von Anfang rede, darfst du aber nicht an eine Zeit denken, nichts zwischen dem Erzeuger und dem Erzeugten annehmen, nicht die Natur dadurch teilen, daß du ungeschickt zwischen die Ewigen und Verbundenen etwas einschaltest. Wäre nämlich die Zeit älter als der Sohn, dann wäre offenbar der Vater zunächst die Ursache der Zeit. Wie aber kann der, welcher unter der Zeit steht, „der Schöpfer der Zeit“ sein? Wie kann er „der Herr des Weltalls“ sein, wenn ihm die Zeit vorhergeht und sie ihn beherrscht? Der Vater ist also ohne Anfang; denn er hat das Sein nicht anderswoher, noch aus sich selbst. Der Sohn aber ist, wenn du den Vater als Ursache ansiehst, nicht ohne Anfang; denn der Vater ist als Ursache der Anfang des Sohnes. Würdest du aber den Anfang zeitlich verstehen, dann hat er keinen Anfang; denn der Herr der Zeiten erhält seinen Anfang nicht von der Zeit.</p><p>Würdest du deshalb, weil die körperliche Welt der Zeit unterworfen ist, annehmen, daß auch der Sohn der Zeit untersteht, dann würdest du dem Unkörperlichen einen Körper zuschreiben. Wenn du deshalb, weil die irdischen Geburten aus einem Nichts ins Werden übergehen, auch den Sohn zwingen willst, aus dem Nichts in das Dasein getreten zu sein, dann vergleichst du Unvergleichbares, nämlich Gott und Mensch, die körperlichen und unkörperlichen Wesen. In diesem Falle würde er gleich unseren Körpern leiden und zugrunde gehen. Du meinst, Gott sei deshalb also geboren worden, weil die Körper so geboren sind. Ich aber meine deshalb nicht das gleiche, weil diese Art der Geburt den Körpern eigen ist, (welche, da sie sich nicht in bezug auf das Sein gleich sind, auch in bezug auf das Erzeugen Ungleichheit zeigen). Es müßte denn sein, daß der Sohn auch im übrigen der Materie unterworfen ist, so daß er leidet, betrübt ist, hungert und dürstet oder wie sonst all die Leiden des Körpers und der Doppelnatur heißen mögen. Doch dies kann dein Verstand nicht zulassen. Da von Gott die Rede ist, darfst du seine Geburt nur als göttliche annehmen.</p><p>Doch man frägt: „Wie ist der Sohn geboren, wenn er geboren ist?“ Siegesbewußter Sophist, antworte mir zuerst: „Wenn er erschaffen wäre, auf welche Weise ist er erschaffen worden?“ Dann magst du mich fragen, auf welche Weise er erzeugt worden ist. Du wendest ein: „Eine Erzeugung ist mit Leidenschaft verbunden.“ Aber auch das Erschaffene ist es. Wenn man etwas ausdenkt, sich darum kümmert und wenn das, was rasch in den Sinn kommt, nach allen Seiten ausgestaltet wird, erfordert dies keine Leidenschaft? Du wendest ein: „Eine Erzeugung braucht Zeit.“ Auch das Erschaffen braucht Zeit. Du sagst: „Erzeugung ist an einen Ort gebunden.“ Auch das Erschaffen ist es. Bei der Geburt soll es Mißerfolge geben. Sie kommen auch beim Schaffen vor, wie ich von euren Philosophen höre. Was nämlich der Verstand vorschreibt, kann oftmals die Hand nicht vollenden. Man wendet ein: „Durch sein Wort und seinen Willen hat er alles erschaffen; denn,er sprach und es wurde, er befahl und es war erschaffen’.“ Wenn du sagst, durch das Wort sei alles erschaffen worden, dann sprichst du von einem nicht menschlichen Schaffen. Denn keiner von uns bewirkt durch sein Wort, daß etwas wird. Es gäbe nichts Erhabeneres und Leidenschaftsloseres als uns, wenn schon das Wort die Tat vollbrächte. Wenn Gott durch sein Wort die Schöpfung erschaffen hat, so war sein Erschaffen nicht etwas Menschliches. Entweder zeige mir, daß auch der Mensch durch sein Wort etwas erschafft, oder nimm an, daß Gott nicht nach Menschenart erschafft! Habe den Willen, dir eine Stadt vorzustellen, und die Stadt muß da sein! Habe den Willen, einen Sohn zu bekommen, und das Kind muß da sein! Habe den Willen nach irgend etwas anderem, und der Wille muß zur Tat werden! Wenn aber das Gewünschte nicht dem Willen folgt, Gottes Wollen dagegen mit dem Werden verbunden ist, dann ist ein Unterschied zwischen dem Erschaffen der Menschen und zwischen dem des Weltschöpfers, Gottes. Wenn nun Gott nicht auf menschliche Weise schafft, wie soll er gezwungen werden, auf menschliche Weise zu erzeugen? Du warst zuerst nicht, dann wurdest du, dann erzeugst du. Du schenkst einem, der nicht war, das Licht der Welt. Oder, um mich gründlicher auszudrücken, du führst eigentlich nicht einmal aus dem Nichts in das Dasein. Denn Levi war, wie es heißt, im Schoße des Vaters, ehe er ins Dasein trat. Möge keiner sich an dem Logos versündigen! Denn nicht behaupte ich, daß der Sohn aus dem Vater in einer Weise hervorgehe, daß er früher im Vater war, später aber ins Dasein getreten sei; nicht bezeichne ich ihn entsprechend dem Gesetze menschlichen Erzeugens zuerst als unvollständig und dann als vollständig.</p><p>So behaupten die Frevler, die, welche gierig alle Lehren angreifen. Wir aber denken nicht so und lehren nicht so. Zugleich mit dem unerzeugten Sein des Vaters ― er war immer, und dem Verstand fällt es nicht ein, anzunehmen, daß er einmal nicht war ― ist das erzeugte Sein des Sohnes. Also ist das Sein des Vaters gleichzeitig mit dem Erzeugtsein des Eingeborenen, welcher aus ihm, nicht aber nach ihm ist oder welcher existiert nur durch den Gedanken des Anfangs, d. i. der Ursache. Da ich wegen deiner geistigen Schwerfälligkeit in Sorge bin, wiederhole ich öfter den gleichen Gedanken. Wenn du dich nicht unnötig um das Erzeugtsein des Sohnes, bzw. um seine Hypostase oder um das, was anderen als noch wichtiger erscheint, kümmerst ― denn, was ich denke und meine, läßt sich nicht in Worte fassen ―, dann mache dir auch nicht zu viel zu schaffen mit dem Ausgange des Geistes! Mir genügt es, zu hören, daß der Sohn ist, und daß er aus dem Vater ist, daß der Vater und der Sohn ist. Weiter grüble ich nicht. Nicht möchte ich nämlich das Schicksal jener Stimmen, welche, weil sie sich überschreien, völlig zusammenbrechen, oder das Schicksal jener Augen, welche in die Sonne schauen, erfahren. Denn je mehr und je genauer einer sehen will, um so mehr schädigt er seine Sinne. Er beraubt sich der Möglichkeit, überhaupt noch zu sehen; denn das Augenlicht wird vernichtet, wenn das Geschaute zu groß ist, wenn man alles sehen will und nicht bloß das, was man mit Sicherheit sehen kann.</p><p>Hörst du von Erzeugung, dann grüble nicht! Hörst du vom Ausgang des Geistes aus dem Vater, dann forsche nicht nach dem Wie! Wenn du gleichwohl über die Erzeugung des Sohnes und den Ausgang des Geistes nachgrübelst, dann forsche ich über die Einigung deiner Seele und deines Körpers. Wie ist es möglich, daß du Staub bist und Ebenbild Gottes? Was ist das, was dich bewegt, was ist das, was bewegt wird? Wie kommt es, daß das gleiche sowohl bewegt als auch bewegt wird? Wie ist es möglich, daß die Sinne im Körper bleiben und doch das Ferne herbeiziehen? Wie ist es zu erklären, daß der Verstand in dir bleibt und doch im Verstande eines anderen Gedanken erzeugt? Wie hat das Wort die Möglichkeit, Gedanken zu vermitteln? Noch nicht spreche ich von dem, was noch größer ist. Wie ist das Himmelsgewölbe zu erklären? Wie die Bewegung der Sterne, ihre Ordnung, ihre Regelmäßigkeit, ihr Sichvereinen und Sichentfernen? Welches sind die Grenzen des Meeres? Woher kommt das Wehen der Winde, der Wechsel der Jahreszeiten? Woher die Regengüsse? Wenn du, o Mensch, von diesen Erscheinungen nichts verstehst, ― verstehen wirst du sie wohl dereinst, wenn du die Vollkommenheit erlangt hast; denn „ich werde“, wie es heißt, „die Himmel, die Werke deiner Finger schauen“, so daß der Schluß erlaubt ist: das, was wir jetzt sehen, ist nicht die Wahrheit, sondern sind Bilder der Wahrheit ―, wenn du dich jetzt nicht kennst und nicht weißt, wer du bist, obwohl du über solche Fragen disputierst, wenn du das, wovon deine Sinne Zeugnis geben, nicht erfassen kannst, wie kannst du glauben, genau zu wissen, wer Gott ist, und wie groß er ist! Solcher Glaube ist große Torheit.</p><p>Wenn du auf mich, einen von Verwegenheit freien Theologen, hören willst, dann bitte darum, auch das eine zu verstehen, wie du das andere verstanden hast! Liebe das eine und sorge dafür, daß es in dir bleibt! Das andere möge als himmlischer Schatz aufgezeichnet sein! Durch Tüchtigkeit steige empor! Durch Reinigung erwirb dir das Reine! Willst du einmal Theologe werden und der Gottheit würdig sein, dann beobachte die Gebote, schreite durch die Satzungen vorwärts! Handeln führt zum Schauen. Diene der Seele durch den Körper! Sollte es einer so weit wie Paulus bringen können, dann beachte er jedoch, daß Paulus sagt, er schaue durch einen Spiegel und durch Rätsel und es komme eine Zeit, da werde er schauen von Angesicht zu Angesicht. Solltest du im Reden gescheiter als andere sein, aber auf jeden Fall stehst du hinter Gott zurück. Vielleicht bist du weiser als andere, aber der Abstand zwischen dir und der Wahrheit ist so groß wie der zwischen deinem Sein und Gottes Sein. Wir haben die Verheißung, daß wir dereinst erkennen werden, soferne wir erkannt sind. Wenn ich in diesem Leben nicht die völlige Erkenntnis der Dinge besitzen kann, was ist das, was mir noch übrigbleibt, was ich zu hoffen habe? Du wirst auf jeden Fall antworten: das Himmelreich. Dieses besteht aber nach meiner Ansicht in nichts anderem als in dem Besitze des Reinsten und Vollkommensten. Das Vollkommenste aber, was es gibt, ist die Erkenntnis Gottes. Erkenntnisse wollen wir teils festhalten, teils ― solange wir auf Erden leben ― zu erwerben suchen, teils im Jenseits aufgespeichert lassen, auf daß wir als Lohn für unsere Mühen das volle Licht der heiligen Dreifaltigkeit, d. i. das Verständnis für ihr Sein, ihre Art und ihre Größe erhalten in Christus, unserem Herrn, dem die Ehre und Kraft sei in alle Ewigkeit! Amen.</p>
