      <p><em>Rede über den Propheten Jonas (Bibliothek der Kirchenväter).</em></p><h2>1</h2><p>*„ ‚Auf, geh’ nach Ninive, der großen Stadt, und richte an sie die Predigt, welche ich dir sagen werde!’ Und Jonas stand auf und ging nach Ninive gemäß dem Worte des Herrn.“ [Jonas 3,2. 3.]</p><p>Der syrische Text ist der Handschrift Cod. vat. 117, sect. 46 entnommen und in der römischen Ausgabe im II. syrisch-lateinischen Bande S. 359-386 abgedruckt. Die Autorschaft des Ephräm ist noch durch den Cod. Musei Britannici Add. 14 573, der dem sechsten Jahrhundert angehört, sehr gut bezeugt.</p><p>Der Inhalt läßt sich kurz also zusammenfassen: Jonas verkündete im Auftrage Gottes dem sündigen Ninive baldigen Untergang. Große Angst befiel die Bewohner, und ohne daß sie der Prophet dazu ermahnt hätte, bekehrten sie sich und taten Buße in der idealsten und umfassendsten Weise ohne Unterschied des Alters, des Geschlechtes und des Ranges. Der König selbst ging mit dem besten Beispiele voran und hielt sogar in eigener Person seinen erprobten Kriegern eine erschütternde Bußpredigt und sandte Herolde aus, welche die Niniviten zur Buße und Umkehr auffordern sollten [1-19]. Hierauf schildert Ephräm den Eindruck, welchen dieser heroische Bußeifer der heidnischen Stadt auf den Propheten machte: das beschämende Gefühl, das derselbe beim Vergleich mit der moralischen Versunkenheit seines Volkes empfand, und den Ärger, der in ihm aufstieg, weil er fürchtete, Gott werde, durch solche Bußfertigkeit bewogen, die Stadt begnadigen und er selbst dann als Lügenprophet dastehen [20-25]. Je näher der verkündete Zeitpunkt des Strafgerichtes rückte, desto höher stieg die Angst der Bewohner; um so größer war aber auch der Jubel, als es sich herausstellte, daß die Buße die Stadt gerettet hatte [26-30]. Voll des Dankes zogen die Geretteten vor die Stadt hinaus zu Jonas und wurden dort Zeugen, wie Gott den Propheten wegen seiner Hartherzigkeit zurechtwies [31-33]. Hierauf huldigten sie ihm und geleiteten ihn im Triumph in sein Vaterland zurück [34-35]. Da er fürchtete, sie möchten durch den Anblick des bösen Beispiels seiner Landsleute wieder rückfällig werden, suchte er seine Begleiter vom Betreten des Landes abzuhalten, und nur durch eine Lüge gelang es ihm, sie zu verabschieden. Aber sie bestiegen einen Berg und schauten von ihm aus in das Judenland hinein und waren entsetzt über die unzähligen Zeichen der Abgötterei und die anderen Greuel bei dem auserwählten Volke Gottes. Mit Dank gegen Gott, der sie zu Büßern gemacht, kehrten sie in ihre Heimat zurück [36-45]. Es scheint jedoch in 45 der Text nicht in Ordnung zu sein Der Schluß [46] bildet eine Belehrung über wahre Buße. [Vgl Zingerle I,310 f.]*</p><h2>2</h2><p>Siehe, Jonas predigte in Ninive, der Jude unter den Gottlosen. Kühn betrat er die Stadt und schreckte sie mit schrecklichen Reden. Die Stadt der Heiden ward durch den hebräischen Prediger in Bestürzung versetzt und dem Meere gleich erregt durch Jonas, der dem Meere entstiegen war. Es schlugen an sie auch Wogen gleich den Wellen im Meere. Jonas ging aufs Meer und erregte es; er stieg ans Land und schreckte es. Als er floh, stürmte das Meer; als er predigte, bebte das Land. Durch Gebet ward das Meer ruhig, ebenso das Land durch Buße. Er betete im großen Fisch, die Niniviten in der großen Stadt. Gebet rettete den Jonas und Flehen die Niniviten. Jonas floh vor Gott, die Niniviten vor der Reinheit. Die Gerechtigkeit schlug beide als Schuldige in Bande. Beide Parteien brachten ihr Buße dar und wurden gerettet. Den Jonas erhielt sie [die Buße] im Meere, die Niniviten auf dem Lande.</p><h2>3</h2><p>Von und an sich selbst lernte Jonas, daß man sich der Büßer erbarmen solle. Die [göttliche] Güte gab ihm an seiner eigenen Person ein Beispiel für die Sünder; denn wie er aus dem Meer herausgezogen wurde, so sollte er die [in Laster] versunkene Stadt emporziehen. Der See Ninive ward erregt durch Jonas, der aus der See emporgetaucht war. Der gerechte Jonas öffnete seinen Mund, Ninive hörte ihn und ward bestürzt. Ein einziger hebräischer Prediger versetzte die Stadt von einem Ende bis zum andern in Schrecken. Er nahm den Mund voll und rief „Wehe!“ und an seine Zuhörer teilte er Tod aus. Der schwächliche Prediger trat auf in einer Stadt von Gewaltigen. Seine Rede brach den Mut der Könige, und er kehrte über ihnen die Stadt um. Durch ein Wort, das die Hoffnung benahm, reichte er den Zornkelch zum Trinken. Es hörten ihn die Könige und wurden mutlos, sie warfen ihre Kronen weg und verdemütigten sich. Es hörten ihn die Vornehmen und wurden bestürzt, statt der Gewänder zogen sie Bußsäcke an. Es hörten ihn die ehrwürdigen Greise und bedeckten ihr Haupt mit Asche. Es hörten ihn die Reichen und öffneten ihre Schätze vor den Armen. Es hörten ihn auch die Gläubiger und spendeten durch die [zurückgegebenen] Schuldscheine Almosen. Es hörten ihn in der rechten Weise die Geldverleiher, daher bestanden sie nicht auf der Heimzahlung der Schulden; die Auszahler wurden zu Heimzahlern, die Schuldherren zu Nachlassern; denn jeder sorgte in der rechten Weise für seine Rettung. Da gab es niemand mehr, der auf eine List gesonnen hätte, um zu übervorteilen. Man war in einem edlen Wettstreite begriffen, daß jeder seine Seele gewänne. Es hörten auf Jonas die Diebe, und die Räuber verließen [sogar] ihr Eigentum. Jeder richtete sich selbst, aber erbarmte sich seines Mitbruders; keiner richtete seinen Nächsten, da jeder [nur] sich selbst richtete. Jeder wies sich selbst zurecht, weil das Strafgericht alle bedrohte, Es hörten ihn die Mörder und gestanden, weil sie die Furcht vor den Richtern verachteten. Es hörten ihn auch die Richter und gaben [das Richten] auf. Die Gerichte wurden durch das [drohende] Strafgericht zum Schweigen gebracht. Man wollte nicht mehr nach Gerechtigkeit richten, damit man nicht nach Gerechtigkeit dem Gerichte verfalle. Jedermann säte Barmherzigkeit, um davon Rettung zu ernten. Es hörten den Jonas die Sünder, und jeder bekannte seine Sünden. Es hörte ihn die [moralisch] häßliche Stadt und legte sofort ihre Häßlichkeit ab. Es hörten ihn auch die Gebieter und verkündeten den Untergebenen die Freiheit. Es hörten ihn in der rechten Weise die Sklaven und wurden überaus ehrerbietig gegen ihre Gebieter. Auf die Rede des Jonas hin demütigten die vornehmen Frauen den Hochmut durch Bußsäcke. Das war in Wahrheit Buße, als die stolzen Damen Demütigung anzogen.</p><h2>4</h2><p>Denn im Vergleich mit jener Buße ist die unsere wie ein Traum, und im Vergleich mit jenem Flehen ist das unsere nur ein Schatten, und im Vergleich mit jener Verdemütigung ist diese unsere Verdemütigung nur ein schwaches Abbild; denn nur wenige sind es, die in dieser Fastenzeit Schulden nachgelassen haben. Die Niniviten gaben Almosen; wir sollten wenigstens mit den Bedrückungen aufhören. Die Niniviten schenkten den Sklaven die Freiheit; erbarmt euch wenigstens der Freigeborenen! Als Jonas in jene Stadt voll Schulden geschickt ward, führte sie die Gerechtigkeit zur Rechtschaffenheit. Mit schrecklichen Reden beauftragt, entsandte ihn die Gerechtigkeit und ließ der Stadt durch ihn den Untergang verkündigen. Mit scharfen Arzneien ward der schreckliche Arzt in die Stadt voll Krankheiten entsandt. Er öffnete und zeigte seine Arzneien; sie waren schrecklich und gewaltig. Die [göttliche] Güte entsandte den Propheten nicht zu dem Zwecke, die Stadt zu zerstören. Der Prediger riet den Einwohnern nicht zur Buße, um anzudeuten, daß der Bedrängte sich selbst um seine Rettung sorgen müsse. Er verschloß vor ihnen das Tor, um offenbar zu machen, wie heftig sie anklopften. Jonas verkündete den Urteilsspruch; sie sprachen mit ihm und glaubten ihm. Dies zeigt, wie sehr die Buße imstande ist, Versöhnung zu erwirken, und wie hartnäckig der Büßer sein muß, um durch Ungestüm Erbarmen zu erlangen. Die Krankheit rührte von der Sünde her, vom freien Willen und nicht vom Zwang. Der Schreckensruf [des Jonas] schreckte wie durch ein Schwert, damit der Frevler durch Schrecken von der Sünde geheilt würde. Der Arzt, der kam, um zu heilen, zeigte dem Kranken das Schwert. Die Stadt sah es und ward bestürzt. Wie ein Henker stand er da; die von der Furcht zu Boden gestreckten Kranken erhoben sich und eilten zur Buße. Die Rede des Jonas schnitt einem Schwerte gleich die langjährigen Übel weg. Er war ein Arzt, dessen Rute besser heilte als die Arznei der anderen. Der Arzt gibt gute Worte und heilt; Jonas aber predigte und heilte. Mit heftigem Tadel behandelte er weise [die Leute]. Es war ein Besucher, dessen Besuch den Kranken Schrecken einflößte. Der Kranke verließ sein Lager, als er die Strafrute sah. Gesund wurden die, welche an der Krankheit der Begierden litten. Jeder tadelte seine Begierde und ward so sein eigener Arzt.</p><h2>5</h2><p>Die Tafel der Könige und das Gastmahl der Fürsten hörten auf. Wenn man sogar den Säuglingen die Milch entzog, wer mochte da ein Freudenmahl bestellen? Das Vieh entwöhnte man des Wassers, wer mochte da Wein trinken? Wenn der König den Bußsack anzog, wer mochte sich da in Gala werfen? Wenn die Dirnen keusch wurden, wer mochte da an das Ehebett denken? Wenn die Ausgelassenen von Schauder ergriffen wurden, wer erlaubte sich da noch zu lachen? Wenn die Fröhlichen weinten, wer mochte sich da an Späßen ergötzen? Wenn die Diebe Redlichkeit übten, wer mochte da seinem Nebenmenschen Unrecht tun? Wenn die Stadt von einem Ende bis zum andern zitterte, wer mochte da sein Haus bewachen? Das Gold lag auf dem Boden, aber niemand stahl es; offen standen die Schätze, aber niemand raubte sie. Die Weibernarren entwöhnten ihre Augen, die Weiber zu begaffen; die Weiber verbargen ihre Reize, um den Anblickenden keinen Anstoß zu geben; denn sie wußten wohl, daß dadurch allgemeiner Schaden entstünde und daß auch sie dem Verderben nicht entgehen würden, wenn sie anderen zum Ärgernis gereicht hätten. Die schönen Weiber legten der Buße der Stadtbewohner kein Hindernis in den Weg; sie wußten gar wohl, daß ihretwegen die Büßer jetzt trauern müßten. So heilten sie einander und wurden geheilt durch die Buße. Keiner verführte den andern zur Sünde, denn jeder verfolgte die Sünde. Jeder trieb den andern zum Gebet und zur Fürbitte auf. Die ganze Stadt war ein Leib! Jeder Bewohner ohne Ausnahme überwachte die andern, daß ja niemand sich gegen den Nächsten verfehle. Jeder belehrte den andern, damit er durch sein Mitglied Rechtfertigung erlange.</p><h2>6</h2><p>Dort betete niemand, daß nur er allein gerettet würde, sondern solidarisch wie die Glieder eines [Leibes] beteten sie alle gegenseitig einer für den andern. Die ganze Stadt war wie ein Körper dem Untergang geweiht. Die Unschuldigen unter ihnen konnten nicht ohne die Sünder am Leben bleiben; denn die Guten und die Bösen waren ganz gleichmäßig wie die Glieder miteinander verbunden. Ihre Gerechten flehten für die Sünder um Rettung, und die Sünder flehten wiederum für die Gerechten um deren Erhörung. Die Rechtschaffenen unter ihnen beteten für die Frevler, daß sie gerettet werden möchten, und die Frevler beteten wiederum, daß das Gebet der Rechtschaffenen angenommen werden möchte. Das zarte Wimmern der Kinder brachte die ganze Stadt zum Weinen; die sich erhebende Stimme der Säuglinge rief in den Herzen und Gemütern eine Umwandlung hervor. Die Greise bestreuten sich mit Asche; die Greisinnen rauften sich die ehrwürdigen Silberhaare aus, warfen sie weg und bedeckten sich so mit beschimpfendem Leid. Die Jünglinge wehklagten noch lauter beim Anblick ihrer Greise; die Greise rührten die Jünglinge, diese trefflichen Stäbe des Greisenalters, zu Tränen. Sie wehklagten, daß sie alle miteinander begraben würden, die Begrabenden und die zu Begrabenden. Die Häupter der ehrbaren Männer und Frauen wurden vor Wehklagen kahl. Die Mutter stand in der Mitte, rings um sie her ihre Lieblinge, welche sich an ihre Säume anklammerten, um bei ihr Rettung vor dem Tode zu finden. Vor dem Schreckensruf entfloh der Knabe zum Schoße seiner Mutter, und der Säugling barg sich vor dem Strafgerichte am Busen seiner Amme. Es wurde Tag, es wurde Nacht; man zählte Stunde für Stunde die anberaumten Tage. Man berechnete die Tage, die schon vorüber waren, und wenn wieder ein Tag vorüber war, so klagte man, daß das Leben um ihn kürzer geworden sei. Mit dem entschwindenden Tage entschwand eben [auch] ihr Leben. Die Kinder fragten unter Weinen, Tränen in den Augen, ihre Eltern: „O Eltern, sagt uns doch, wie viele Tage bleiben uns noch von den Tagen, die uns jener hebräische Prediger bestimmt hat? Welches ist die von ihm bezeichnete Stunde, in welcher wir zur Unterwelt hinabsteigen müssen? Welches ist der Tag, an dem diese herrliche Stadt zerstört werden soll? Welches ist wohl der letzte Tag, nach dem wir nicht mehr sein werden? Welches ist der Zeitpunkt wo uns alle der Schwindel erfassen wird, und welches ist der Tag, an dem die Kunde von unserem Untergang in alle Welt hinausfliegen wird und Schauende vorübergehen werden, um die Stadt anzusehen, die über ihren Bürgern zusammengestürzt ist?“</p><h2>7</h2><p>Als die Eltern solche Fragen aus dem Munde ihrer Kinder vernahmen, vergossen sie in bitterem Leid heiße Tränen über ihre Kleinen, und es zerflossen die Seelen beider, der Redenden und der Hörenden [vor Schmerz] Die Eltern vermochten vor Schluchzen nicht zu sprechen, weil der Schmerz den ebenen Weg der Worte versperrt hatte; andererseits wurde ihre Rede durch das Weinen ihrer Lieblinge verhindert. Um aber ihre Kinder nicht noch mehr zu quälen und aus Furcht, dieselben möchten noch vor dem festgesetzten Tag aus Gram sterben, hielten die Eltern ihre Tränen zurück und bezwangen mit Gewalt ihr Mitleid, um die Kinderschar über diese Fragen klug beruhigen zu können. Die Eltern scheuten sich, die Wahrheit ihren Kindern offen mitzuteilen, daß nämlich der Tag nahe sei, der nach dem Ausspruch des Propheten kommen sollte; daher beschwichtigten sie ihre Kinder nach dem Beispiele Abrahams durch eine Weissagung. Isaak fragte nämlich, wo denn das Opferlamm sei. Um nicht unter Seufzen antworten zu müssen und dadurch sein Opfer zu beflecken, band er seinen einzigen Sohn unter zärtlichen Reden, bevor er sein Opfermesser zückte. Da Abraham wußte, daß die Antwort für seinen Sohn zu hart wäre, so behalf er sich zwar nicht mit Schweigen, um ihm Kummer zu ersparen, aber er offenbarte ihm auch nicht das Schmerzliche, damit das Opfer nicht durch Traurigkeit einen Makel erhalte. Er sann jedoch darüber nach, wie er seinen Liebling zufriedenstellen könnte. Während er davor zurückschreckte, das ihm Bekannte zu offenbaren, weissagte er ein verborgenes Geheimnis, und während er ihm nichts mitteilen wollte, offenbarte er ihm die Wahrheit. Er scheute sich, ihm zu sagen: „Du bist es!“ und weissagte ihm, daß es ein anderes Opfer sein werde. Er glaubte, daß es Isaak sei, weissagte aber, daß er es nicht sein werde. Denn Abrahams Zunge wußte mehr als sein Herz. Das Herz lernte vom Munde, der sonst von ihm lernt. Der Verstand war wissend, weil die Zunge prophetisch war; der Verstand, der sonst belehrt, ward durch die Zunge belehrt. „Ich und der Knabe wollen hinaufgehen“, sprach Abraham zu den Knechten, „und wir werden wieder zu euch zurückkommen.“ Er wollte täuschen und weissagte; er war aber kein Lügner, weil er für die Wahrheit kämpfte; sein Wort wurde zur Weissagung, weil er bestrebt war zu helfen.</p><h2>8</h2><p>Ebenso machten es die Niniviten mit ihren Kindern. Sie bedienten sich einer List, um sie zu beschwichtigen. Sie begannen unter Tränen zu ihren Lieblingen also zu sprechen: „Gott ist gut und wohlwollend; er vernichtet das Bild nicht, das er angefertigt hat. Wenn ein Maler ein Bild gemalt hat, so bewahrt er es sorgsam auf; wieviel mehr wird der Gütige sein lebendiges und vernunftbegabtes Bild bewahren! Nein, Kinder, die Stadt wird nicht zerstört, unsere Stadt wird nicht zugrunde gerichtet. Durch die Androhung des Unterganges will er uns vielmehr zur Buße rufen. Durch das schreckliche [angedrohte] Strafgericht will er uns nur zur Reinheit zurückführen. Liebe Kinder, wie oft seid ihr nicht schon von uns gestraft worden? Ihr habt die Züchtigung ausgehalten und seid durch die Schläge verständiger geworden. Denn nicht im Zorne wurde diese [unsere] Rute erhoben, um zu zermalmen. Wir züchtigten euch, weil ihr euch verfehlt hattet, und freuten uns, weil ihr dadurch gebessert wurdet. Ihr habt es selbst eingesehen, daß ihr nur aus Liebe gestraft wurdet. Ihr habt es selbst verstanden, daß ihr aus Barmherzigkeit geschlagen wurdet. Denn durch die Streiche wurde euch ein Dienst erwiesen, und ihr seid dadurch [würdige] Erben geworden. Der Schmerz infolge der Schläge ward nachher voll Freude, und die Qual infolge der Rutenhiebe wurde ein Schatz von Entzücken. Euer Leid verwandelte sich in lauter Wonne.</p><h2>9</h2><p>„Lernet also, meine Lieblinge, aus der Prüfung eurer Züchtigung und lasset euch durch die weise Rute eurer Eltern belehren, daß auch jener Vater uns zu unserem Besten züchtigt, um uns zur Einsicht zu bringen. Seine Rute ist im Zorne erhoben, um uns Schrecken einzuflößen und uns dadurch zur Einsicht zu bringen. Wie nämlich wir Eltern euch unter Schelten bestrafen, um euch durch die Züchtigung zu gewinnen und euch durch die schmerzlichen Schläge zu nützen, ebenso straft uns jener Gute und Wohlwollende durch sein Schelten, rettet uns aber in seiner Güte und schüttet über uns den Reichtum seiner Erbarmungen aus. Durch seine Rute gibt er uns seine Liebe zu erkennen, und durch seine Geißel öffnet er uns seinen Schatz. Wenn ihr euch davon überzeugt habt, daß wir euch aus Liebe schlugen, wie sollten wir dann annehmen, daß Gott uns nicht aus Liebe züchtige? Unser Züchtigen diene euch als Spiegel, um in ihm zu sehen, wie die [göttliche] Barmherzigkeit und Güte züchtigt. O unsere Lieblinge, alle unsere Liebe ist nicht imstande, euch so zu lieben, wie Gott in seiner Barmherzigkeit die Menschenkinder liebt. Unsere Liebe zu euch steht seiner Liebe zu uns weit nach. Mag auch seine Strafe sehr groß sein, größer noch ist seine Güte; denn seine Strafe ist den Menschenkindern als Gnadengeschenk gegeben. Betrübte Kinder, tröstet euch also und trocknet ein wenig eure Tränen! Der Schrecken wird von uns ablassen und das Strafgericht uns verschonen. Binnen kurzem wird die Stadt getröstet werden, und bald werden die Einwohner gerettet sein. Dann wird sich freuen der Züchtiger, weil er sieht, daß ihr, Kinder, gebessert seid.“ Dieses und Ähnliches sprachen die Niniviten zu ihren Lieblingen. Während sie nach Trost suchten, weissagten sie den Frieden. Weil sie sofort Büßer geworden waren, daher weissagten sie als Wahrhafte. Die Buße ward zur Tatsache, und daher die Weissagung zur Wahrheit. Trotzdem sie so redeten, hörten sie doch nicht zu weinen auf; trotz dieser Trostesworte ließen sie doch nicht von der Trauer ab. Die Angst trieb zu strengerem Fasten an, die Furcht zu eifrigerem Gebete, Sie erkannten eben mit Recht, um wieviel mehr die Sünder trauern müßten, wenn selbst die Gerechten davon nicht abließen; denn das Ende stand vor der Türe.</p><h2>10</h2><p>Der König trat hervor und zeigte sich. Beim Anblick seines Bußsackes erschauerte die Stadt. Welcher Vornehme hätte da noch Bedenken tragen können, in dieser Strafzeit auf Byssusgewänder zu verzichten? Auch der König weinte, als er die ganze Stadt in Trauer sah. Die Stadt weinte angesichts des Königs, weil sie Asche auf seinem Haupte sah; der König weinte angesichts der Stadt, weil sie vor lauter Bußgewändern ganz schwarz geworden war. Da die ganze Stadt weinte, rührte sie sogar die Steine in den Mauern zu Tränen. Wer betete jemals so [wie die Niniviten]? Wer flehte je so inbrünstig? Wer hat sich je so verdemütigt? Wer hat sich je so erniedrigt? Wer hat je seine Schändlichkeiten, die verborgenen sowohl wie die offenkundigen, in diesem Maße abgelegt? Wer hat jemals so seine Lustbarkeiten, gleichsam seine Glieder, von sich geworfen? Wer hat je bloß eine Stimme vernommen und [allsogleich] sein Herz wegen seiner Sünden zerrissen? Wer hat je das Wort eines Mundes gehört und ward daraufhin [sofort] in seinem Geiste zerknirscht? Wen ergriffen wegen der Stimme eines schwachen Menschen je Todesängste? Wer stellte sich je bei seiner Buße Gott so vor Augen? Wer schaute je so den Gerechten, wie er sein unsichtbares Schwert zückt?</p><h2>11</h2><p>Wer sah je eine ganze große Stadt so schreien und weinen? Wer hätte das Wehklagen und Weinen der Kinder aushalten können? Denn sie, die ein langes Leben liebten, hörten, daß ihr Leben abgekürzt worden sei. Wer hätte ferner vermocht, das Wehgeschrei der Greise zu ertragen? Denn sie, die das Grab und die Begrabenden liebten, hörten, daß die Stadt zugrunde gehen werde. Wer hätte das laute Jammern der Jünglinge ertragen können, die da sahen, daß ihre Hochzeitsgäste zu ihrem Tode geladen seien? Wer hätte das Wehklagen und Weinen der Bräute ertragen können, die, in ihren Brautgemächern sitzend, zu den Grüften der Erde geladen waren? Wer hätte sich der Tränen erwehren können, wenn er den König hätte weinen sehen, der geladen war, statt in den Königspalast zurückzukehren, in die Unterwelt hinabzusteigen? Er, der unter den Lebendigen König war, sollte unter den Toten Staub sein. Anstatt auf einem Prunkwagen einherzufahren, hatte er vernehmen müssen, daß seine Stadt zugrunde gehen werde. Anstatt sich seinen Schwelgereien und Lustbarkeiten hingeben zu können, hatte er vernehmen müssen, daß ihn der Tod verschlingen werde. Anstatt sich auf seinem Ruhebette ausstrecken zu können, war der König samt seiner Stadt plötzlich zu dem Abgrund des Strafgerichtes geladen worden.</p><h2>12</h2><p>Er rief seine Truppen zusammen, weinte über sie, und sie beweinten ihn. Der König erzählte vor ihnen, in wieviel Kriegen sie Siegeskränze errungen hatten und erinnerte sie daran, in wieviel Kämpfen sie sich rühmlich ausgezeichnet hatten. Nun aber wurde er kleinmütig und mutlos, weil kein Retter und Helfer sich zeigte. Dann begann er zu ihnen zu sprechen: „Meine Teuren! Dies ist kein Krieg, um auszuziehen und nach unserer Gewohnheit zu siegen und nach unserem Wunsche Triumphe zu erringen; denn auch die Heldenmütigsten sind durch die furchtbare Kunde, die uns wurde, in Schrecken versetzt worden. Uns, die wir so viele besiegt haben, besiegt ein einziger Hebräer. Königen und uns hat er Schrecken eingejagt, seine Stimme bringt uns in Verwirrung. Wir haben viele Städte zerstört, und er besiegt uns in unserer Stadt. Ninive, die Mutter der Helden, fürchtet sich vor einem einzigen schwachen Manne. Die Löwin ward in ihrem Lager von einem Hebräer in Furcht versetzt. Früher brüllte Assyrien in der Welt, jetzt brüllt die Stimme des Jonas in ihm. So tief ist die Nachkommenschaft des Helden Nimrod gesunken!“</p><h2>13</h2><p>Hierauf gab der König seinen gewaltigen Heeren einen guten Rat: „Ich rate euch, meine Teuren, auch jetzt nicht mutlos zu werden, sondern wie Helden zu kämpfen, damit wir nicht wie Feiglinge zugrunde gehen. Wer sich in seiner Prüfung herzhaft und heldenmütig zeigt, der fällt als ein Held; bleibt er aber am Leben, so steht er glorreich da; Denn der Edle kann durch seinen Heldenmut einen zweifachen Lohn erringen: entweder einen ruhmvollen Tod oder ein ehrenvolles Leben. Wer hingegen kleinmütig ist, hat zweifachen Nachteil zu gewärtigen; denn sein Tod ist überaus schimpflich und sein Leben schmachvoll. Rüsten wir uns daher, fassen wir Mut, zeigen wir uns als Helden und erwerben wir uns Ruhm! Wenn wir auch nichts weiter erreichen würden, so erringen wir uns doch den Ruhm tapferer Männer. Wir wissen aber aus der Urtradition unserer Väter, daß Gott nicht nur Gerechtigkeit, sondern auch Barmherzigkeit besitzt. In seiner Gerechtigkeit droht er, aber in seiner Barmherzigkeit erbarmt er sich wieder. Versöhnen wir also seine Gerechtigkeit und ehren wir zugleich seine Barmherzigkeit, damit, wenn seine Gerechtigkeit versöhnt ist, auch seine Barmherzigkeit uns beistehe! Ist nämlich seine Gerechtigkeit versöhnt, so ergießt sich sein Erbarmen reichlich über alle; aber auch wenn seine Gerechtigkeit erzürnt ist, so wird doch unser Gebet nicht getadelt, und wenn sie auch nicht versöhnt ist, so wird doch unser Flehen nicht gerügt. In der Mitte zwischen der Gerechtigkeit und der Barmherzigkeit wird die Buße nicht verworfen. Meine Teuren! Fertigen wir uns also für eine neue Stadt neue Waffen an! Nachdem wir einmal zu diesem unsichtbaren Kampfe berufen wurden, wollen wir auch unsichtbare Waffen ergreifen!</p><h2>14</h2><p>„Wir haben [dies] von den Voreltern überkommen, die in der Welt die Wahrheit verkündet haben. Ihre Worte und die Kunde ihrer Großtaten sind uns überliefert worden; denn nicht ist der Menschheit die Kenntnis der Wissenschaft vorenthalten. Es ging in alle Welt die Kunde, daß die Gerechten auf die genannte Weise gerettet wurden. Die ganze Welt ist voll davon, daß der Schalgewordene gerichtet wird. Wir haben ferner bezüglich der Frevler gehört, wie sie sich empört haben, aber auch ausgerottet wurden. Auch ward ein Spiegel aufgestellt, damit jeder Widerspenstige beschämt werde. Ein Zeichen wurde aufgerichtet in der Welt, damit die Schauenden ihre Blicke darauf richten. Barmherzigkeit ward verkündet, damit die Hörenden darauf achten. Die Buße wurde auf Erden zur Anschauung gebracht, damit die Sünder sie ansehen. Wer hätte nicht von jener gewaltigen Flut gehört? Dieses Ereignis in den Tagen Noës liegt uns ja nicht so fern, unsere Generation reicht ja nahe an dieses Strafgericht heran; daher entbehrt niemand der Kunde davon, und niemanden bleibt die Kenntnis desselben verschlossen. Die Menschen, jenes Geschlecht, in den Tagen des Noë sündigten und wurden bestraft. Auch damals verkündete eine Stimme die kommende Flut. Aber als die Gottlosen jene Stimme vernahmen, erzürnten sie [Gott] noch mehr, weil sie darüber spotteten. Die Stimme der Axt und die Stimme der Säge predigten die Flut; die Stimme der schneidenden Säge wehklagte laut über die Überschwemmung. Aber die Stimme der Axt verlachten sie, und die Stimme der Säge verhöhnten sie. Als jedoch die Arche vollendet war, da offenbarte sich die [strafende] Gerechtigkeit, und als die Gerechtigkeit sich offenbarte, fand die Frechheit ihre Strafe. Es brachen tosend die Quellen hervor gegen die Frevler, die gespottet hatten. Plötzlich brauste die Flut über die Gottlosen her, welche gehöhnt hatten. Die zuvor die Stimme der Axt verspottet hatten, entsetzten sich über die Stimme des Donners; die zuvor die Stimme der Säge verlacht hatten, wurden von den Blitzen und Donnerschlägen geblendet. Nun begannen sie zur Arche zu eilen, über die sie gespottet hatten; allein diese schloß ihre Türe vor ihnen, weil sie ihren Bau verhöhnt hatten.</p><h2>15</h2><p>„Verachten wir daher, meine Brüder, die Stimme des Hebräers Jonas nicht! Es geziemt uns nicht, diese Predigt auf die leichte Achsel zu nehmen; sondern wir wollen sie mit Verständnis betrachten und von allen Seiten ins Auge fassen. Ich wenigstens geriet durch die Stimme seiner Predigt in große Angst. Man hält sie zwar [vielfach] für Vermessenheit, ja für Wahnsinn sieht man sie an. Will ihn [den Jonas] aber jemand für einen Narren erklären, so möge er doch beachten, daß er einen reichen Vorrat weiser Lehren in sich birgt, daß er Verstand und Einsicht sein eigen nennt, weil in ihm ein Born der Weisheit quillt. Sein Äußeres ist zwar verächtlich und gewöhnlich, aber seine Rede ist erhaben und ehrwürdig. In eurer Gegenwart richtete ich an ihn beliebige Fragen, um seine Aussprüche wie in einem Feuerofen zu prüfen. Er geriet weder in Furcht noch in Angst; er zögerte nicht, kam auch nicht in Verlegenheit. Er modifizierte den Ausspruch seines Mundes nicht, denn dieser ist mit der Wahrheit verbunden; er wich nicht von seinem Thema ab, denn sein Gedächtnis ist sehr treu. Ich versuchte es mit Schmeicheleien, er aber ließ sich nicht betören; ich versuchte es mit Drohungen, er aber blieb kalt. Ich bot ihm Reichtum an, er aber lachte darüber; ich zeigte ihm das Schwert, aber dieses verachtete er noch viel mehr. Das Schwert und das glänzende Angebot ließen ihn kalt. So mancher läßt sich durch das Gold betören, andere werden durch das Schwert in Schrecken gesetzt; ihn aber schreckte die Strafe nicht, noch reizte ihn das Gold. Wir haben diesen Hebräer zwischen Schmeicheleien und Drohungen gestellt, er aber entzog sich beiden, indem er beide verachtete. Ich zeigte ihm Reichtum, er aber lachte darüber, und über das Schwert verzog er spöttisch die Lippen. Die Liebe zum Golde wurde überwunden und die Furcht vor dem Tode zuschanden gemacht. Jedes Wort, das er sprach, gleicht einem Schwerte, das Felsen zerschlägt. Meine Macht fürchtete er nicht, und auf meine Majestät nahm er keine Rücksicht. All unsere Herrlichkeit achtete er wie auf dem Boden liegenden Kot; denn unseren Reichtum verschmähte er gänzlich, und unser Schwert verachtete er vollständig. Er hatte seine Stirne zu Erz gemacht, als er in unser Land kam; daher konnte ihn nichts bewegen, auf unsere königliche Würde Rücksicht zu nehmen,</p><h2>16</h2><p>„Sein Wort wurde uns zum Spiegel, in dem wir unsere Schandflecken sehen können. In ihm sehen wir Gott, wie er wegen unserer Missetaten droht; in ihm sehen wir die Gerechtigkeit, wie sie über unsere Sünden zürnt; in ihm sehen wir unsere Stadt, wie das Strafgericht über sie kommt; in ihm sehen wir seine Predigt, wie sie aus gerechtem Munde hervorgeht; denn es ist keine Spiegelfechterei oder listige Wortmacherei. Wenn er uns Frieden verkündigt hätte, dann könnte man annehmen, daß er ein Spiegelfechter sei, um durch die gute Kunde, die er verkündet, einen guten Lohn zu erhalten; denn wer Gewinn liebt, dessen Verheißung ist herrlich. Die Versprechungen des Wahrsagers sind verlockend, weil er habgierig ist. Der Sterndeuter stellt ein günstiges Horoskop, weil er hungrig ist. Um von dem Toren viel zu erhalten, verspricht er ihm ein Los des Reichtums. Nicht daß er ihm etwas geben wollte, geschweige daß er ihm etwas wirklich geben würde, sondern durch das Versprechen des Reichtums ködert er ihn, um ihm auch das, was er besitzt, abzunehmen. Der Arzt dagegen ist durch und durch wahrhaftig, er sagt dem Kranken die Wahrheit. Er tritt in das Haus des Kranken und verkündet ihm das Urteil. Er kündigt ihm in seinem Zimmer das schmerzliche Brennen mit Feuer an. Er scheut sich nicht, jedem Patienten, wer er auch sei, das Ausreißen eines Backenzahnes in Aussicht zu stellen. Er scheut sich nicht einmal vor dem König, ihm seine Meinung zu sagen. Ebensowenig scheut er sich, einem Prinzen eine scharfe Arznei einzugeben. Er hat keine Furcht vor einem Gefürchteten, sondern er bindet und operiert ihn. Nicht zittert er vor einem Helden, sondern schwächt seine Kraft durch Brennen. Wer könnte also den Propheten, der das Strafgericht verkündet hat, einen Lügner nennen? Er ist ja kein Betrüger, wenn auch seine Stimme in Verwirrung setzt. Wenn auch seine Stimme gewaltig ist, so ist doch seine Gesinnung aufrichtig.</p><h2>17</h2><p>„Ein Arzt kann, wenn er auch noch so furchtlos ist, doch des Lohnes wegen sich [zu einer falschen Aussage] verleiten lassen; aber dieser Hebräer überragt den Stand der Ärzte in hohem Maße. Nicht einmal das tägliche Brot will er von unserer Stadt essen. Seit dem Tage seiner Ankunft lebt er in strengem Fasten und in Buße. Wer hat ihn gezwungen, ohne Entgelt uns den großen Zorn anzukündigen? Wie kommt es, daß er sich nicht fürchtete, dieses in unserer Stadt zu verkünden? Wir haben von den Hebräern gehört, daß Moses und Elias sich volle vierzig Tage der Speise enthielten. Fastet dieser hebräische Prophet vielleicht ebenso? Wenn nun er, der Gerechte, so fastet, wohlan, dann wollen auch wir fasten, denn wir haben gesündigt! Wenn er, der Rechtschaffene, betet, so mögen uns Bußkleid und Asche demütigen. Vielleicht fastet und betet er, damit er nicht unter uns als Lügner dastehe. Er bemüht sich, daß die Stadt zerstört werde, damit seine Ankündigung sich bewahrheite. Da er durch Fasten mit uns Krieg führt, so wollen auch wir mit ihm durch Fasten streiten. Nicht aber wollen wir mit dem Propheten durch Buße streiten; denn er hat sich nicht gegen uns verfehlt, sondern unsere Sünden haben das Verbrechen an uns begangen. Nicht der Hebräer zerstört die Stadt, sondern ihre Schlechtigkeit stürzt sie ins Verderben.</p><h2>18</h2><p>„Meine Freunde, wir haben einen anderen unsichtbaren Feind, gegen den wir heldenmütig streiten müssen. Die Geschichte Jobs, des Gerechten der Vorzeit, ist bei uns so bekannt, daß vielleicht sogar taube Tiere von seinen Triumphen gehört haben. Seine Prüfung verkündet einer Posaune gleich seinen Sieg auf der [ganzen] Erde. Nach der Erzählung unserer Väter klagte ihn Satan an; wenn nun der Böse diesen Gerechten der Vorzeit anklagte, wie wird er erst seinen Mund aufsperren, um uns Sünder anzuklagen! Verschieden und doch wieder gleichartig ist seine Bosheit gegen die Gerechten und gegen die Sünder. Denn dem Gerechten stellt er nach, damit er ein Sünder werde; den Sünder tötet er, damit er nicht etwa ein Büßer werde. Er zog aus, um das Haus der Söhne Jobs zu zerstören. Er vermischte ihr Blut mit dem Weine und ihre Becher mit ihren Leibern. Er machte dem Mahl ein Ende und stürzte das Haus über seine Bewohner. Vielleicht ist er auch gesandt, um unsere Stadt und unser Gebiet zu zerstören. In Kriegen habt ihr Könige besiegt; besieget jetzt den Satan durch Gebet! Eure Reihen sollen also ausziehen, um mit ihm zu kämpfen! Herab und weg mit euren Panzern! Rüstet euch vielmehr gegen ihn mit Bußgewändern! Zerbrecht und werfet weg die Bögen und nehmet eure Zuflucht zu Gebeten! Verachtet das schwache Schwert und erwählt dafür das sieghafte Schwert [des Fastens]! Die Schärfe des Fastens schneidet auch die verborgene Sündhaftigkeit weg, die sich in unserer Stadt vorfindet. Nichts ist der Sieg, den ihr im Kriege davongetragen habt; wenn wir aber hier siegen, dann übertrifft dies alle unsere übrigen Siege. Da ich in den Kriegen und bei den Feldzügen den Zug eröffnete, so will ich auch der erste in diesem gewaltigen Kriege sein. Rüstet euch also, wie ich es tue, und folget mir nach, geliebte Truppen!“</p><h2>19</h2><p>Der König erhob sich, legte seine Kleider ab und stieg vom Throne herab; ebenso legten auch alle übrigen ihre Kleider ab. Sogleich zog der König das Bußgewand an, und seine Truppen kleideten sich ebenfalls in Schwarz. Die sonst so glänzenden Assyrer waren plötzlich schwarz geworden. Durch die härenen Bußkleider fand das Geheimnis Jakobs seinen Ausdruck. Dadurch, daß sie sich freiwillig zur Klage niederwarfen, wurde die Buße zum Triumphe. Der Satan aber verlor wie Esau, der Lehrer gleich seinem Schüler. Diese siegten wie Jakob, ebenfalls wie der Meister so auch seine Schüler [die Niniviten]. Der König berief den Oberbefehlshaber, daß er ausziehe und sein Feldlager rüste. Herolde gingen zu den Truppenteilen und riefen aus: „Jeder soll ein Büßer werden: der Unreine lege seine Unreinheit ab, damit sie ihn nicht im Kriege besiege; der Habgierige entferne seine Habsucht, damit er nicht beim Kampfe in Verwirrung gerate; der Zornmütige versöhne sich mit seinem Nächsten, damit der erzürnte Gerechte [Gott] gleichfalls versöhnt werde! Kein Groll soll im Herzen bleiben, damit die Rettung nicht verzögert werde! Kein streitsüchtiger Mund soll mitkommen, damit die Stadt durch Liebe gesegnet werde! Niemand unterdrücke und bedrücke, niemand schwöre und betrüge, damit nicht das uns angedrohte Gericht als vollkommen gerechtfertigt sich erweise! Wir wollen die Bande unserer Herzen lösen, damit unser Gebet nicht zurückgehalten werde! Niemand räche ein Unrecht, damit uns viele Vergebung zuteil werde!“ Solches und Ähnliches verkündeten die Herolde in der großen Stadt.</p><h2>20</h2><p>Der König stand trauernd da und rüstete sorgfältig die Stadt. Er ordnete seinem Heere Fasten an und gab es ihm als die wahre Rüstung. Er rief seine Soldaten zum Gebete als dem vollkommenen Rettungsmittel. Er pries das Gebet als den Bogen, dessen Pfeile siegreich sind, als die Rüstung, welche die Bedrängten umgibt, als das furchtbare Schwert für die, die es ergreifen. Nachdem der König seine Scharen sorgfältig gerüstet hatte, wandte er sich der Rüstung der Stadt, sowohl der Männer als auch der Weiber, zu, auf daß das ganze Volk ohne Ausnahme für die Rettung kämpfe. Mit seinem Bußkleid hatte er das Beispiel gegeben und rüstete nun auch die Stadt mit Bußgewändern. Er war ein Sohn des Helden Nimrod, er war tapfer und ein Jäger, der aber aufhörte, viele Tiere zu töten, und statt Tiere des Waldes zu töten, vielmehr die Schlechtigkeiten seines Volkes tötete. Statt im Freien zu jagen, reinigte er die Stadt von Vergehen. Er ließ von den Tieren draußen ab und tötete die Bosheiten drinnen. Er verschmähte das Gift des Drachen und versüßte durch Fasten seinen Geist. Anstatt auf seinem Galawagen, durchzog er die Stadt zu Fuß, besuchte das ganze Volk, um es zur Buße zu erwecken. Inkognito ging er umher, um von ihnen die Unreinheit abzuwaschen, Demütig schritt er einher und brachte die erschütterte Stadt wieder in Ordnung. Bei seinem bescheidenen Umherwandeln säte er Frieden zwischen den Gassen aus.</p><h2>21</h2><p>Bei diesem Anblick erfaßte den Jonas Staunen, und er schämte sich über die Söhne seines Volkes. Bei den Niniviten sah er Herrliches, aber über den Samen Abrahams mußte er weinen. Er sah den Samen Kanaans gebessert, den Samen Jakobs aber verschlechtert. Er sah, daß die Unbeschnittenen ihr Herz beschnitten, die Beschnittenen hingegen es verhärteten. Die einst auf die Sabbate stolz waren, verachteten jetzt die Beschneidung und stellten sie zwischen Tod und Leben. Der König von Ninive erkannte, daß Sittenlosigkeit die Ursache des Strafgerichts sei; er schnitt also die Ursache des Unheils ab, und sogleich hörten die Stürme auf. Er war der Arzt, der seine Stadt behandeln konnte und wußte, welche Arznei ihr zuträglich war. Durch Fasten, das herrliche Heilmittel, heilte er die Krankheit der Stadt, durch Sack und Asche vertrieb er die Sünde aus ihr. Weil sie die Schulden nachließen, verlieh ihnen der Gütige viele Gnade. Kapital und Zins ließen sie nach, und Stadt und Bezirk wurden gerettet. Jonas trieb die Schulden ein, das Fasten ließ die Sünden nach. Die Niniviten traten zusammen und berieten, wie sie ihr Leben retten könnten. Das ganze Volk legte sich Fasten auf, um dadurch Gott zu versöhnen.</p><h2>22</h2><p>Wer offenbarte denn den Niniviten die verborgenen Geheimnisse Gottes, daß nämlich das Fasten die Kraft habe, Gottes Strafurteil aufzuheben? Jonas hatte es ihnen sicher nicht geoffenbart, er befürchtete ja die Verzeihung; denn er hatte den Niniviten gepredigt, daß das Strafurteil feststehe. Obwohl sie dem Worte des Jonas glaubten, wandten sie doch das Urteil des Jonas ab. Als einsichtige Leute kannten sie Gott und die Menschen; sie wußten, daß ein Mensch menschlich, Gott aber gnädig handle. Sie sahen, daß der Prophet strenge war, urteilten aber weise, daß Gott gütig sei. Sie stritten sich nicht mit dem Strengen, während sie den Gnädigen zu versöhnen trachteten. Dem Propheten gaben sie Recht, Gott aber schrieben sie Güte zu. Während Jonas die Hoffnung abschnitt, wuchs durch das Fasten die Hoffnung. Während Jonas den Mut brach, hob das Gebet den Mut. Während das Strafgericht immer drohender wurde, ward seine Gewalt durch die Bußkleider geschwächt. Das Gewölk umkleidete sich mit Schwarz, aber durch die Farbe der Bußgewänder wurde es zerstreut. Die Luft war damals dunkel, aber sie wurde durch die Buße aufgehellt. Die zitternden Bewohner Asiens richtete die [eingetretene] Sittenreinheit wieder auf. Die Stadt wankte, sollte aber nicht fallen; denn sie verschaffte sich durch Almosenspenden starke Stützen. Durch den Mammon, der viele Sünden bewirkt hatte, wurden die Sünden gesühnt. Die Kinder im Mutterschoße wurden gerettet, denn sie hatten Fasten und Beten gelernt. Die Greise wehklagten in ihren Bußsäcken und sicherten sich dadurch ihr Leben. Weil die Jünglinge vor Schmerz weinten, bewahrten sie sich ihre Hochzeitskränze. Weil die Bräute sich in Trauer kleideten, entsühnten sie ihre Brautgemächer. Es klagten sogar die verschiedenen Tierarten, indem sie des Wassers entbehrten.</p><h2>23</h2><p>So erhob sich also Klagegeschrei jeglicher Art von Menschen- und Tierstimmen. Ihr Jammern vernahm die Gerechtigkeit, und die Güte errettete ihre Stadt vor dem Tage, den Jonas bestimmt hatte. Es war ein gewaltiges Hin- und Herlaufen, sehr anhaltend war das Gebet, ein Fasten löste das andere ab, ein Bußsack den andern, ohne Aufhören. Viel Asche lag auf ihnen, kein Auge ließ vom Weinen der Buße ab, keine Zunge verstummte dort vom Wehklagen und Flehen um Erbarmen. Das Ohr hörte dort keinen andern Laut, weil die Stimme des Jammerns und Weinens von allen Seiten kam. Die Augen schauten dort keine heitere Gesichtsfarbe, keinen lächelnden Mund, sondern finster und gebrochen vergossen sie in Strömen immer neue Tränen der Buße. Tag für Tag wurden dort Almosen aller Alt gespendet, Gebete jeder Gattung wurden dort täglich immer aufs neue dargebracht, Flehen um allen möglichen Beistand wurde dort täglich beobachtet; denn durch die Barmherzigkeit wurde dort die Quelle allen Trostes erschlosssen. Ohne Zögern hüllten sich Männer wie Frauen in das Gewand der Keuschheit. Unbeirrt wurde dort die Reinheit durch das Fasten bewahrt. Durch gegenseitige Freundlichkeit machten sie ihre Reden lieblich. Durch Eintracht und Gleichheit waren sie wie Glieder miteinander verbunden. Da ließ sich dann auch die Güte zu ihnen herab und übergoß sie mit Erbarmen. Zwischen den Kindern herrschte Liebe, zwischen den Männern Wahrheit, zwischen den Erzürnten Versöhnung, zwischen den Entzweiten Einigkeit, bei den Frauen Ruhe und hilfsbereites Schweigen, bei den Greisen Versöhnung und wertvoller Rat, bei den Jünglingen Keuschheit, bei den Jungfrauen Sittsamkeit, zwischen den Mägden und den Herrinnen volle Eintracht.</p><h2>24</h2><p>Da sah man keinen Hochmut mehr, denn sie hatten die Gewänder der Verdemütigung angelegt. Da gab es keine Eifersucht mehr, denn der Ehrgeiz war durch das [angekündigte] Strafgericht aufgehoben. Eine Frömmigkeit beseelte Untertanen und Könige; einen Trank der Gleichheit hatten Herr und Knecht; eine Speise der Verdemütigung reich und arm; ein Bußgewand kleidete den Taglöhner wie den Fürsten; unter einem Joch wandelte die ganze Stadt die Bahn der Buße; eine Arbeit verrichtete sie, um eine Rettung zu erlangen, Wehklagen in jeder Stimmlage ertönte dort täglich, Wehruf über jeglichen Schmerz erscholl dort täglich, Jammer über jegliches Leid wurde dort von allen Seiten vernommen, Verwirrung jeglicher Art erschütterte die ganze Stadt, Bestürzung über alle möglichen Schrecknisse kam über die ganze Stadt. Wie ein Vogel auf einem Dornstrauch, so saß die Stadt voll Furcht da; sie bebte und wankte wie ein Schilfrohr zwischen Winden. Wenn es tagte, so dachten sie den Untergang des Tages nicht mehr zu erleben; wenn es dunkelte, so glaubten sie, den Morgen nicht mehr anbrechen zu sehen. Jeden Tag stand der Tod bevor, alles Volk zitterte. Die ganze Stadt pochte an die Pforten des Totenreiches.</p><h2>25</h2><p>Jonas zählte die Tage, die Niniviten aber zählten ihre Sünden. Jonas berechnete die Nächte, Ninive beweinte seine Missetaten. Sechs Wochen lang mühte es sich mit Weinen, Nachtwachen und Seufzen ab. Jonas hielt sich unter der Laube auf, die Niniviten aber weinten in der Stadt. Jonas, der ihre Tränen sah, fürchtete sehr ihr Fasten. Er weilte im Schatten der Kürbislaube, sie litten unter der Hitze des Tages. Seine Laube rollte sich [verdorrend] zusammen, sie aber überschattete [Gottes] Rechte. Er sah ihre Seelen wie Wasser vor dem Allerhöchsten hingegossen, er sah die Fürsten in den Staub hingeworfen fasten, er sah die Kinder wimmern, die Kälber und die Lämmer blöken, er sah, wie die Mütter mit ihren Tränen ihre Kinder benetzten, er sah die Busen der Säuglinge in den Zähren ihrer Gebärerinnen gebadet. Er sah die Greise weinen, während die Greise seines Volkes schwelgten. Er sah Ninive in Trauer und Sion in Schwelgerei versunken. Er sah Assyrien und verachtete daher gar sehr das stolze Jerusalem. Er sah, daß die Dirnen Ninives keusch geworden waren, die Töchter seines Volkes aber sich befleckten. Er sah, daß in Ninive die Besessenen zur Ruhe gelangten und die Wahrheit lernten; in Sion dagegen sah er die Propheten voll Lug und Trug. Er sah, wie bei den Heiden die Götzenbilder öffentlich zertrümmert wurden, er beobachtete aber auch und sah, daß die Gemächer des Volkes [Israel] voll von Heidentum waren.</p><h2>26</h2><p>Dieser Hebräer hatte nun seine Erfahrung unter den Heiden gemacht und legte daher die Verwunderung darüber ab, daß der [heidnische] Priester den Moses and die Witwe den Elias aufgenommen hatten und daß David, als ihn Saul verfolgte, bei den Heiden ehrenvoll behandelt worden war. Er befürchtete jedoch, daß er, der abgesandte Bote, als Lügner angesehen werde, da er wahrnahm, daß seine Ankündigung [des Untergangs] durch die Buße vereitelt werde. Er sah, wie die Töchter der Heiden den Götzen ihrer Väter entsagten, und beweinte die Töchter seines Volkes, die den Tammuz beweinten. Er sah, wie in Ninive die Wahrsager und die Beschwörer ausgerottet wurden, wie dagegen in Judäa die Zauberer mit den Sterndeutern umherzogen. Er sah, wie die Götzenpriester mit eigenen Händen die Altäre Assyriens zerstörten, und sah, wie in Sion jeder vor seiner Türe einen Altar errichtete. Jonas sah, wie Ninive gleich einer Kirche seine Kinder, versammelte, wie die ganze Stadt sich reinigte und wie in ihr ein großartiges Fasten gehalten wurde; den hl. Tempel in Sion hatte man dagegen zu einer Räuberhöhle gemacht. Den König von Ninive sah er den [wahren] Gott anbeten, den Jeroboam aber sah er Kälber anbeten. Die Niniviten stellten ihre Kleinen in Reihen unter Wehklagen vor Gott auf, die Hebräer aber opferten ihre Söhne und schlachteten ihre Töchter den Teufeln zu Ehren. Die Niniviten spendeten Gott auch ihre Tränen mit Fasten, die Hebräer dagegen spendeten ihren Götzenbildern ihre Weine. Von den Niniviten stieg der Duft trauernder Mienen empor, in Sion aber dufteten der Wohlgeruch und der Weihrauch der Götzen. Das [hebräische] Volk schnitt sich die Hoffnung ab, für die Heiden aber vermehrte sie sich. Bei den Juden herrschte Ausgelassenheit, bei den Niniviten Verdemütigung. In Judäa war die Bosheit, in Ninive die große Trauer offenkundig. Sonst beweinen die Lebenden die Gestorbenen; die Niniviten aber beweinten die Lebenden, jeder beweinte seinen Sohn und wehklagte über seinen Verwandten. Die Schönheit der Frauen ward durch Weinen und Fasten entstellt. Jeder küßte [zum Abschied] seinen Freund und weinte an seiner Brust.</p><h2>27</h2><p>Groß war dort die Trauer und furchtbar das Leid; denn es war ihnen bestimmt, bei lebendigem Leibe unter die Erde zu sinken. Je näher der Termin heranrückte, desto reichlicher strömten ihre Tränen. Es war, als ob sie schon dahingeschieden wären und nicht mehr in der Welt weilen würden. Es kam der Tag heran, an dem die Stadt zerstört werden sollte; es nahte der Tag, an dem sie vernichtet werden sollte. Darum herrschte in der ganzen Stadt Trauer, Weinen und Wehklagen. Der Staub der Erde ward von den Tränen derer benetzt, welche ihn geformt hatten. Die Väter stellten vor ihren Kindern deren Erbgüter auf, um so zugleich die Erben und die Erbschaften zu beweinen. Sie stellten die verlobten Söhne und Töchter der Reihe nach unter Tränen auf. Wer konnte einen so schmerzlichen Anblick überleben? Sie stellten die jungen Ehepaare auf und erregten so deren Klagen und Weinen. Sie stellten Knaben und Mädchen auf, während Wehgeschrei zum Himmel aufstieg. Sie schauten auf die Schönheit der Kleinen und auf die [blühenden] Gestalten ihrer Kinder. Auf der Erde stehend bildeten sie sich ein, sie sei erschüttert. Sie schien wie ein Schiff zu sein, das unter ihnen hin und her schwankte.</p><h2>28</h2><p>Da standen auch Greise beiderlei Geschlechtes und ihre Bestatter bei ihnen, laut klagend und weinend darüber, wer ihnen die Augen schließen und sie begraben würde. Sie weinten über ihre Todesfälle, weil niemand da wäre, der sie begraben und [die Hinterbliebenen] trösten würde. Sie weinten über ihre Gräber, weil niemand dieselben ausheben und sie hineinlegen würde. Sie weinten über ihre Gewänder, da niemand ihre Blöße bedecken würde. Jedermann stellte sich seinen Tod schmerzlich vor Augen, und wenn sie sich daran erinnerten, so wehklagten sie darüber, daß sie zu einem solchen Ende bestimmt seien. Jeder war bestürzt, wenn er daran dachte, daß ihm ein solcher Tod bereitet sei. Jedem zerriß es das Herz, wenn er vernahm, daß die Erde sich spalten werde. Es entfärbten sich ihre Gesichter, wenn sie vernahmen, daß der Erdboden sich umkehren werde. Es standen Könige und Königinnen da, ihre Kronen lagen auf Bußsäcken. Sie sahen voraus, daß sie morgen nicht mehr sein würden. Sie verhüllten sich, während ihre Ängste wuchsen. Jedermann raffte [zum Zeichen der Trauer] Staub auf und rief dann wiederum zu Gott. Jedermann klagte im Gebete und füllte sein Haupt mit Asche. Es gibt keine Klage, die dort nicht geklagt und geschluchzt worden wäre. Selbst die Mauern, zum Bußgewande [der Stadt] geworden, erregten mit Trauerasche bestreut Weinen.</p><h2>29</h2><p>Auch der Tag gürtete sich dort mit Dunkelheit wie mit Bußsäcken; die Luft verdüsterte sich, und der Himmel geriet in Aufruhr. Das Gewölk hüllte sich in Dunkel, und dichte, tiefe Finsternis trat ein. Krachen folgte auf Krachen, ein Donnerschlag dröhnte dem andern entgegen, ein Blitz schlug den andern, so daß die Herzen bangten und bebten. Da richtete jeder seinen Blick auf den Boden in der Erwartung, daß er sich umkehren würde. Alle weinten zusammen als solche, die plötzlich dahingerafft werden sollten. Jeder beweinte seinen Bruder, jeder wehklagte über seinen Freund, jeder rief nach seinem Genossen, um ihn noch einmal zu sehen und sich an seinem Anblicke zu sättigen, um das letzte Wort mit ihm zu wechseln und dann vereint ins Totenreich hinabzusinken. Als der Termin zu Ende ging, standen sie insgesamt auf der Stufe zum Tode, sich gegenseitig festhaltend. Es kam der Tag, wo die Hoffnung schwinden und das Strafgericht eintreten sollte. Es kam die Nacht, welche auf die sechs Wochen folgte. Unter Tränen sannen sie darüber nach, zu welcher Stunde die Stadt untergehen würde, ob sie am Abend zerstört oder ob sie am Morgen umgestürzt würde, in welcher Nachtwache ihr entsetzlicher Schreckensruf erschallen würde. Sie erwarteten, daß die Stadt am Abend umgestürzt würde; der Abend kam, und sie stand noch. Sie erwarteten, in der Nacht verschlungen zu werden; aber sie überlebten die Nacht. Sie erwarteten, in der Finsternis unterzugehen; die Finsternis ging vorüber, und sie waren unversehrt. Sie erwarteten, daß die Stadt am Morgen umgestürzt würde; der Morgen kam und gab große Hoffnung. Als sie zugrunde zu gehen glaubten, ward ihnen plötzlich Rettung zuteil. Jeder sah seinen Genossen wieder und begrüßte ihn mit Freuden. Aber während dieser vierzig Tage hatte die Erde unausgesetzt gebebt.</p><h2>30</h2><p>Jonas stand in der Ferne und fürchtete, als Lügner angesehen zu werden. Das Erdbeben und die Erschütterung hörten auf. Gerade als alle Hoffnung aufgegeben war, wurde die Nachricht von der Erbarmung gegeben. Als sie das Zeichen der Gnade sahen, wurden sie durch dieses Zeichen mit Hoffnung erfüllt. Weil die Erde nicht mehr bebte und Blitz und Donner aufhörten, wurden Ohr und Auge erfreut. Der Allgütige sah ihre Tränen und erbarmte sich ihres Lebens. Obwohl sie nicht starben, litten sie doch Qualen, da sie den Tod bei lebendigem Leibe kosteten. Während dieser sechs Wochen hatten es die Toten besser als sie; sie lebten zwar ihr Leben fort, aber sie waren schon tot, wenn auch noch nicht begraben. Da begegnete ein Bruder dem andern, aber er erkannte dessen Züge nicht; ein Mann traf seinen Freund, aber er vermochte nicht seine Gestalt zu unterscheiden. Auch das Ohr war nicht imstande, die Stimmen voneinander zu unterscheiden, wie auch das Auge die Gestalten nicht voneinander unterscheiden konnte. Vor Gram waren sie ja den Schatten der Finsternis und durch jenes strenge Fasten angebrannten Scheitern gleich geworden. Vor Nachtwachen waren ihre Leiber dahingeschwunden und nur mehr Haut und Gerippe übrig geblieben. Gerade als Jonas meinte, die Stadt sei schon untergegangen, an eben diesem Tage und zu eben dieser Stunde ward sie vom Untergang gerettet. Nebel und Wolkendunkel zerstreuten sich plötzlich, vergingen und entschwanden. Es trat Ruhe ein, die Hoffnung stieg, und die sterbende Stadt erwachte zu neuem Leben.</p><h2>31</h2><p>Jonas empfand großes Leid, die Niniviten aber gewannen wieder eine heitere Gesichtsfarbe. Allen ward frohe Kunde gegeben, weil sie sahen, daß die Luft sich aufhellte. Sie beugten ihre Knie zum Gebete, breiteten ihre Hände zum Himmel aus, jeder Mund dankte und jede Zunge pries den, der trotz seines Zornes ihnen das Leben wiedergab wegen ihrer Buße. „Den Herrn im Himmel haben wir versöhnt. Du hast uns, dein Volk, auf Erden erfreut; denn du hast uns aus dem Staube wiedererweckt, daß wir ein neues Leben leben. Durch dich haben wir die Güter gefunden, die uns zuteil geworden sind. Du hast uns auch hierin nicht getäuscht, daß du uns aus der Finsternis ins Leben zurückbrachtest; denn durch dich fanden wir ja den Schlüssel der Buße, durch den uns aus Gottes Schatzkammer gute Hoffnung gegeben ward. Was würde es dir nützen, o Hebräer, wenn wir alle untergegangen wären? Was würdest du gewinnen, o Prediger, wenn wir alle umgekommen wären? Was würde es dir helfen, o Sohn Amathis, wenn wir nun stumm im Totenreiche lägen? Was hast du umgekehrt jetzt für einen Nachteil davon, daß du durch unsere Bekehrung verherrlicht bist? Warum tut es dir leid, daß du uns geheilt hast, wo doch das ganze Volk dich preist? Warum bist du traurig darüber, daß du unsere Stadt gewonnen hast? Warum bist du betrübt, Berühmter, darüber, daß du durch Büßer berühmt geworden bist? Das sei dein Ruhm, daß du Erhalter und nicht Zerstörer geworden bist; das biete dir hinreichende Ursache zur Freude, daß du die Wächter in der Höhe [die Engel] erfreut hast! Du sollst dich auf Erden freuen, da Gott im Himmel sich freut! Das möge dein Herz erheben, daß nunmehr jeder deinen Gott preist. Das tröste dein Gemüt, daß Stadt und König dir huldigen. Schaue doch die Kinder an, die gerettet wurden! Bete für ihr Leben! Schau doch die Säuglinge an, welche erhalten blieben, damit dein Andenken in der Stadt lange währe! Segne die Stadt, die erhalten blieb und vor der Züchtigung bewahrt wurde! Segne, o Jonas, unsere Stadt, die von nun an nach dir genannt werden wird! Sechs Wochen lang hat sich dein Mund der Speise enthalten; gib jetzt dein Fasten auf und laß deine Trauer fahren! Freue dich mit uns, o Hebräer! Dies ist ein großes Fest, dessen Andenken von allen Geschlechtern gefeiert werden wird; ein Geschlecht wird dem andern von unserer Trauer und von unserer Rettung erzählen.“</p><h2>32</h2><p>Dieses und Ähnliches und noch mehr dergleichen sprachen sie. Jonas saß außerhalb der Stadt, und die ganze Bevölkerung ging zu ihm hinaus. Sie hörten, wie er [Gott] fragte und wie er wiederum [von Gott] gefragt wurde. Der Hl. Geist, der durch seinen Mund sprach, rechtete in ihm mit ihm selbst und stellte zwei Personen, Gott und den Propheten, in ihm dar. Die ganze Stadt vernahm es, wie der Prophet für seine Staude und sich selbst und [zugleich] für seinen Herrn und dessen Stadt sprach. Sie vernahmen, wie er mit seinem Herrn wegen dessen Stadt rechtete. Aus seinem Munde vernahm man die Stimme von zwei Parteien. O über den hebräischen Anwalt, der beiden zugleich diente! Scharenweise strömten sie herbei, um die Stimme des Propheten zu vernehmen, und sie hörten, wie er in ihrer Sprache vor Gott erklärte, er sei wegen der Vernichtung der Staude betrübt und sehne sich nach dem Tode.</p><h2>33</h2><p>Der Hl. Geist antwortete ihm, indem er durch seinen [des Jonas] Mund mit ihm stritt. Seine eigene Zunge bekämpfte ihn an Stelle Gottes. Sie hörten von ihm, wie Gott wegen der Stadt sagte: „O Jonas, wenn du dich wegen dieses armseligen Kürbisses grämst, auf den du keine Mühe verwendet und den du nicht aufgezogen hast, der über Nacht aufschoß und über Nacht verwelkte, kann denn die verdorrte und vernichtete Staude mit der bestehenden Stadt in Vergleich kommen? Die Staude sei dein Lehrer, von dem du Einsicht lernen sollst! An der verachteten Staude mögest du ersehen, welches die Gesinnung des Barmherzigen ist. Du willst den Kürbis verschont haben, ich die Stadt. Die Stadt sollte durch dich zu dieser Stadt der Büßer werden. Du rammtest eine Laube im Boden fest, aber Städte willst du entwurzeln. Eine elende Staude willst du erhalten wissen, aber eine große Steinmasse möchtest du zusammenstürzen sehen. Wo bleibt da dein Gerechtigkeitsgefühl, o Jonas, wenn du Kürbis und Stadt so ungleich behandelst? Gegen eine Laube bist du mitleidig, gegen eine Stadt aber hart. Der Kürbis, der Nahrung gewährt, gilt dir mehr als seine Verzehrer; die dem Verdorren preisgegebene Staude ist dir wertvoller als die Büßer. Die Blätter des Kürbisses achtest du höher als die vernünftigen Menschen, und die Zweige und Blüten der Staude ziehst du den Kleinen und den Kindern vor.“</p><h2>34</h2><p>Die Stadt hörte dies und brachte wie mit einer Stimme Gott Lobpreis dar dafür, daß er für sie rechtete und für sie eintrat. Gott machte den Jonas aus einem Gegner zum Anwalte; gegen seinen Willen mußte er der Gegenpartei recht geben. Gott ließ seine Worte nicht in Erfüllung gehen, damit die Bewohner der Stadt gerettet würden, Jonas bewirkte deren Buße, und Gott, daß Jonas nicht als Lügner erfunden würde. Die Gerechten ärgern sich nicht über die Bekehrungen der Gottlosen, und auch Jonas war über die Buße der Sünder nicht betrübt. Es war ihm der Gedanke gekommen, wie die Stadt wohl ihre Rettung erfahren solle. Es wäre unschön gewesen, wenn er es ihnen einfach verschwiegen hätte, so daß die Büßer nicht erfahren hätten, wie die Sachen gegangen waren, wie die Gerechtigkeit zürnte, die Buße aber rettete. Jonas hatte gepredigt, um zu verkünden, wie die Gerechtigkeit zürnte; die zugrunde gegangene Staude rief laut, wie die Güte verschonte. Das Volk um Jonas pries Gott mit lauter Stimme wegen alles dessen, was es mit eigenen Ohren gehört und mit eigenen Augen gesehen hatte. Mit den Ohren hörten sie den Gerechten, mit den Augen sahen sie die Staude. In dem Kürbis, der plötzlich aufgeschossen war, erblickten sie ein übernatürliches Zeichen, und durch sein Verdorren lernten sie deutlich die überaus große Barmherzigkeit kennen.</p><h2>35</h2><p>Die Niniviten ergriffen dann in Liebe den hebräischen Prediger. Er wurde auf ihren Händen getragen, und in Ehren, wie ein König, zog er in die Stadt ein. Sie setzten ihn auf einen Thron und huldigten ihm. Scharenweise brachten ihm die Büßer ihre Gaben und Zehnten dar, trugen ihm ihre Gelübde herbei, die sie in ihren Nöten gelobt hatten. Die Knaben opferten ihre Gürtel und die Jünglinge ihre Halsketten; sie überreichten ihm zum Geschenke ihre Stirnbänder, Schärpen und Schleifen. Der König schloß seine große Schatzkammer auf und beschenkte ihn reichlich. Von jedem Munde wurde Gott als der Barmherzige gepriesen, aber auch Jonas als der Prediger gesegnet. Ein Wagen wurde herbeigeschafft und mit den Gaben und Zehnten beladen; es kamen Männer herbei, um ihm das Ehrengeleite in das Land zu geben, von dem er hergekommen war. Jonas zog im Triumph wie ein König heimwärts, und wie ein Königssohn wurde Amathis Sohn festlich heimgeleitet. Im Meer hatte ihn ein Fisch getragen, auf dem Festlande ein Prunkwagen. Früher war er unter die Erde hinab erniedrigt worden, und nun wurde er hoch über sie erhoben. Als er im Meer dahinzog, schwammen Fische vor ihm her; auf dem trockenen Lande sprengten Reiter vor ihm her. Er spaltete das Meer, als er hinabstieg [nach Ninive], und das Festland, als er heraufstieg [nach Palästina]. Sein Erscheinen wurden die Fische des Meeres gewahr, auf dem Festlande die Menschen. In den Abgründen entstand Aufregung, in den Städten große Unruhe. Auf nassem Pfade stieg er hinab, und auf trockener Bahn kehrte er zurück. Vor ihm fürchteten sich sogar die schrecklichen Tiere im Meere, und mächtige Städte machten ihm Platz, als er heraufstieg. Der Fisch, welcher ihn verschlungen hatte, war gewaltig; der König, der ihn aufnahm, war mächtig. Der Fisch bereitete ihm den Pfad, und der König ebnete ihm den Weg. Seinen Fisch begleiteten andere Fische und seinen Wagen Reiter.</p><h2>36</h2><p>Der König von Ninive beeilte sich, Gesandte dem Propheten vorauszusenden, um für ihn Herbergen zur Unterkunft bereitstellen zu lassen. Dem Fische hatte Gott den Weg gezeigt, den er einschlagen sollte; dem Propheten aber zeigte der König den Weg, auf dem er heimkehren sollte. In Ehren und reichbeschenkt zog er triumphierend heimwärts. Alles ging ihm entgegen und huldigte ihm in Ehrfurcht. Könige erschauderten vor ihm, weil er ein so gewaltiger Prediger war. Mit großer Ehrerbietung kamen sie ihm aus Furcht vor seiner Predigt entgegen. Jede Stadt, die seiner ansichtig wurde, verging vor Angst, er möchte sie bei seinem Eintritt umstürzen. Er wurde in den Städten ehrenvoll behandelt, weil Ninive zum Vorbild geworden war. Es war für die Welt zum Spiegel geworden, in welchem man die Gerechtigkeit schauen konnte.</p><h2>37</h2><p>Als Jonas bei seinem Vaterlande angelangt war und die Grenze seiner Landsleute erreicht hatte, entließ er seine Begleiter, damit sie in Frieden von ihm scheiden sollten. Er dachte nämlich mit Beschämung daran, sie möchten das Heidentum seiner Landsleute sehen und, nachdem sie als Bekehrte eingezogen, unter den Gottlosen wieder verdorben werden. Er besorgte, daß sie, von den [heidnischen] Völkern herkommend, vom [jüdischen] Volke Gottlosigkeit lernen könnten. Er fürchtete, daß die vernarbte und geheilte Wunde wieder aufbrechen könnte. Schon das schlimme Beispiel gemeiner Leute schadet anderen; um wieviel mehr Schaden richtet das Beispiel eines solchen an, der von einer hohen Stufe herabgefallen ist! Wenn jemand sich verfehlt hat, dann aber sich verdemütigt, so ist trotz der Verdemütigung Schaden vorhanden; um wieviel schlimmer ist aber der Schaden von seiten eines solchen, der sündigt und verstockt bleibt! Denn der Sauerteig des Verstockten durchdringt mit Gewalt die anderen, weil sein Betragen und der Umgang mit ihm andere frech macht.</p><h2>38</h2><p>Jonas befürchtete, es möchten die Rechtschaffenen aus den Völkern, wenn sie hineinkämen, von dem verdorbenen, alles verderbenden Volke verdorben werden. Sie ohne Angabe des Grundes zu entlassen, scheute er sich, aber den Grund zu offenbaren, schämte er sich: sie kühn mit sich hineingehen zu lassen, trug er Bedenken, auf daß die Nachkommenschaft Kanaans nicht über die Kinder Abrahams spotte. Er dankte der Begleitung, die mit ihm gekommen war, küßte sie liebevoll, segnete sie feierlich, redete ihnen klug zu, beriet sie freundschaftlich, suchte sie zu überreden, seinem Rate zu folgen und seinem Worte zu gehorchen. Er redete ihnen dringend zu, aber sie ließen sich nicht umstimmen; er bat sie inständig, aber sie ließen sich nicht abbringen. Er mochte ihnen raten, wie er wollte: niemand entfernte sich. Er küßte und entließ sie; aber keiner sagte Lebewohl.</p><h2>39</h2><p>„Wir gehen“, erklärten sie, „mit dir in dein Land, um davon Nutzen zu ziehen und gute Sitten, Lebensregeln und Lebensart zu lernen. Wir wollen in deinem Lande Rechtschaffenheit lernen, weil darin ein sittenreines Volk wohnt. Wir wollen von ihm Reinheit lernen, weil sich darin ein reines Geschlecht aufhält. Wir wollen von ihm Tugenden lernen, weil darin Tugendhafte weilen. Wir wollen hineingehen und die Trefflichen sehen; wir wollen hineingehen und die Auserwählten sehen; wir wollen hineingehen und das Land sehen, in dem der Glaube herrscht. Wir wollen hineingehen und den Ort sehen, wohin noch kein Götzendienst gedrungen ist. Wir wollen hineingehen, sehen und lobpreisen, weil es dort keine Wahrsagerei gibt. Wir wollen hineingehen und ihre Sabbate sehen, die von aller Schlechtigkeit frei sind. Wir wollen hineingehen und die Beschnittenen sehen, die das Herz mit dem Leibe beschnitten haben. Wir wollen hineingehen und die Heiligen sehen, bei denen kein Unrecht herrscht. Bei dem Volke, das andere zurechtweist, gibt es keine Ausgelassenheit. Wie weit muß doch das Volk, das die Abscheulichen anklagt, von aller Abscheulichkeit entfernt sein! Sie sind anderen zum Spiegel geworden; wie schön müssen also sie selbst sein! Die Fremden haben sie fasten gelehrt; können sie dann Schwelger sein? Anderen lehrten sie die Wahrhaftigkeit; können sie dann Lügner sein? Wenn sie uns wegen unserer Sünden verachten, wer sollte wohl sie verachten? So beraube denn, o Hebräer, unsere Gesellschaft dieser Vorteile nicht! Durch dich sind wir Büßer geworden, durch dich wollen wir auch Gerechte werden. Als Lohn für die Müdigkeit unserer Füße gestatte uns den Eintritt zu deinem Volke! Wir wollen von deinem Lande gute Beispiele für unsere Stadt empfangen und mitnehmen. Wir wollen hineingehen und von dort gute Vorbilder für unsere Stadt mitnehmen. Wir wollen hineingehen und die Jünglinge sehen als Ideale voll edler Zucht. Wir wollen hineingehen und an den Knaben ein Beispiel voll Nutzens nehmen. Wir wollen hineingehen und ihre Könige sehen, damit unser König ihnen nacheifere. Wir wollen auch ihre Richter sehen und unserem Lande ein Muster mitbringen.“</p><h2>40</h2><p>Wer könnte alles berichten, was die Büßer vorbrachten? Während sie dieses und noch vieles andere redeten, hörte Jonas nur schweigend und mit zur Erde gesenktem Haupte zu; denn er schämte sich seiner sittenlosen und ruchlosen Landsleute. Diese Lage war für Amathis Sohn schlimmer als die Geschichte mit der Staude, als die Sonne glühend auf seinen Kopf brannte und er sich sogar den Tod wünschte. Sollte ihm vielleicht die Flucht Ruhe verschaffen? Aber wohin sollte er entfliehen? Die Niniviten versetzten ihn in eine schlimmere Lage als selbst jene, die ihn einst ergriffen und ins Meer geworfen hatten. Wie hätte Jonas die Laster seiner Landsleute verbergen können? Er wandte die Kniffe, die er auf dem Meere gebraucht hatte, auch bei dieser Angelegenheit auf dem Festlande an. Wie er auf der Flucht [vor Gott] die Seeleute unehrlich überredet hatte [ihn mitzunehmen], so überredete er auch hier mit Lügen die Niniviten, als er von ihnen scheiden wollte. Jonas brachte Ausreden vor und gebrauchte vielerlei Vorwände. "Es ist“, sagte er, „gerade ein großes Fest in unserem Lande, dem kein Fremder beiwohnen darf. Es ist ein Fest der Juden, kein Heide hat Zutritt. Es ist ein hohes Fest für die Beschnittenen, und der Unbeschnittene wird nicht zugelassen. Ihr seid zwar Bekehrte, aber doch nicht beschnitten. Dieses reine Fest würde durch eure Unbeschnittenheit verunreinigt werden. Gehet also in Ruhe fort und kehret in Frieden in die Heimat zurück! Später, wenn die Festfeier vorüber ist, könnt ihr dann kommen. Nehmt unseren Rat willig und unsere Bitten ohne Murren an!“</p><h2>41</h2><p>Arglos nahmen sie seine Ausrede an, die er vorbrachte. Sie verabschiedeten sich von ihm, huldigten ihm und empfingen seinen Segen. Die ganze Schar war traurig und schied von ihm, den Zufall und die Ungunst der Festfeier beklagend, von der Jonas gesprochen. Jonas hatte wegen seiner groben Lüge viel weniger Bedenken als darüber, daß sie sich nicht bereden lassen würden, wegzubleiben. Während nun Jonas sich entfernte und weiterzog, die Niniviten aber noch an der Grenze standen, da erblickten sie neben ihrem Standort einen hohen Berg. Sie überlegten und kamen zu dem Entschluß, denselben schleunigst zu besteigen, um soviel als möglich von dem nahen Lande zu sehen. Sie schickten sich an, denselben zu besteigen und seinen Kamm zu erklimmen, um das Land der Verheißung zu schauen, damit sie wenigstens seines Anblickes nicht beraubt würden, nachdem sie es nicht betreten durften. Als sie ihn erstiegen hatten, erhoben sie ihre Augen und erblickten das ganze Land vor sich ausgebreitet: da erschraken sie, entsetzten sich und gerieten in Bestürzung wegen der Altäre auf den Bergen und der Kapellen auf den Anhöhen. Zwischen den Sträuchern zeigte sich Heidentum und zwischen den Bäumen Beflecktheit. Vor den Türen waren Götzen aufgestellt, die man vor dem Eintreten anbetete. Zahllos waren ihre Idole, unzählbar ihre Schandtaten. An ihren Quellen nahmen sie Reinigungen und an ihren Brunnen Waschungen vor; aber auf den Dächern standen Statuen und in den Gärten trieben sie Ehebruch. Wahrsager und Zauberer zogen auf den Straßen umher. Die Niniviten stiegen noch höher hinauf: da sahen sie auf den Dächern eine Unzahl von Altären. Der eine betete ein Bild an, der andere opferte einem Dämon Wein. Die Kälber, welche Jeroboam hatte anfertigen lassen, waren an ihren Grenzen aufgestellt, das eine in Bersabee [!], das andere in Dan. Dort stieg Weihrauch empor und wurden Trank- und Schlachtopfer dargebracht. Vor den toten Kälbern schlachteten sie lebendige Kälber, und vor seinem Götzen und vor seinem Idole stieß jedermann seinen Kopf [auf den Boden].</p><h2>42</h2><p>Dort herrschte auch die Habsucht und ihre Freundin, die Bedrückung; dort herrschte die Schwelgerei und ihre Schwester, die Trunksucht; dort herrschte auch die Schamlosigkeit und ihre Gefährtin, die Unzucht; dort herrschte die Betrügerei und ihre Verwandte, die Dieberei; dort herrschte die Zauberei und ihre Vertraute, die Magie; dort herrschte die Sterndeuterei und ihre Anhängerin, die Wahrsagerei; dort herrschte öffentliche Gottlosigkeit und ihre Genossin, die heimliche Sünde. Sie sahen die hier aufgezählten Freveltaten, die Ungerechtigkeiten und die Betrügereien der Bewohner. Die Männer weilten bei den Dirnen; Mutter, Braut und Tochter standen gleich Fallstricken auf den Straßen. Alles war dort dem Tode und seinem Ratgeber, dem Satan, verfallen. Ihre Fürsten waren Verbrecher und ihre Richter Schurken. Die Habgier brannte in ihnen wie Feuer, und ihre Tyrannei wie die Hölle. Ihre Wohnstätten waren ein Abgrund und ihre Behausungen ein Schlund. Der Schuldner war ein Pfuhl, der Schuldherr ein Satan; beide peinigten sich gegenseitig, um einander in die eine [höllische] Pein zu stürzen. Ihre Kinder schwören bei den Namen ihrer Götter. Bei den Heiden war nur ein Teil des Sittenverderbnisses, bei ihnen dagegen neunundneunzig Teile. Wer vermöchte die Unmenge ihrer Sünden zu zählen? Ja, die Böcke der linken Seite haben die Zahl ihrer Sünden groß gemacht!</p><h2>43</h2><p>Beim Anblick solcher Verkommenheit wurden die Niniviten von Schauder und Entsetzen ergriffen. Einer sagte zum andern: „Schauen wir denn ein Traumgesicht? Ist dieses wirklich das Land der Verheißung oder schauen wir Sodom? Ist dieses der Same Abrahams oder trafen wir vielleicht auf Dämonen? Schauen wir denn Menschen oder schattenhafte Geister? Hat sich denn die Verkommenheit, die aus unserem Lande entwich, hierher gewendet? Sind denn die Götzen, die wir dort zerbrochen haben, hier wieder aufgestellt worden? Haben denn die Altäre, die wir zerstörten, Flügel erhalten und sind hierher geflogen? Wie kommt es, daß die Pest [die Verkommenheit], die in unserem Lande aufgehört hat, hier erstrebt wird? Wie kommt es, daß der Stern, dem wir abgeschworen haben, hier angebetet wird? Die Wahrsagerei, die in unserem Lande abgetan ist, nimmt hier breiten Raum ein. Aus allen Fenstern schaut das Heidentum, das von uns wegzog. Auf ihre Türen malten sie die Tierkreiszeichen, die wir getilgt haben. Auf ihren Stirnen wohnt die Flatterhaftigkeit, die wir verschmäht haben, und die Geilheit, die von uns floh, lagert auf ihren Augen; man sieht sie in ihren Augensternen und nimmt sie sogar an ihren Nasenflügeln wahr. Wie kommt es, daß die Sonne, die dort nicht mehr angebetet wird, hier verehrt wird? Wie kommt es, daß die Kälber, welche dort verachtet werden, hier angebetet werden? Wenn wir von diesen Sachen sagen, sie seien von unserem Lande hierher geflohen, so kommen dazu noch viele andere neue Dinge und unzählige Schändlichkeiten; denn hier gibt es Schlechtigkeiten, die man in unserem Lande nicht kennt; Sünden geschehen hier, die in unserem Lande nicht begangen wurden.</p><h2>44</h2><p>„Den Typus des viergesichtigen Götzen erfand Micha. Der ehernen Schlange spendete in unserem Lande niemand Trankopfer, niemand betete sie an; aber auf diesem Volke ruht der Fluch der alten Schlange. Wie die lebendige Schlange sind sie verflucht, weil sie der toten Schlange Trankopfer spenden. Wir haben den Dämonen keine Kinder geopfert, allein hier sehen wir solche geschlachtet werden. Bei uns wurden Tiere geopfert, hier werden dagegen ihre Töchter geopfert. Das Volk, das solche [ausgezeichnete] Satzungen hat, dessen Sitten sind so schlecht; das Volk, das solche Gesetze hat, dessen Taten sind so schimpflich; das Volk, das solche Ahnen hat, dessen Nachkommenschaft ist so fluchwürdig; das Volk, das einen solchen Gott hat, ist eine Quelle von Götzenbildern geworden; das Volk, das nur einen Bildner [Schöpfer] hat, fertigt Götzenbilder an und handelt damit. Nur auf Namen bilden sie sich etwas ein, weil sie nämlich Söhne der Gerechten genannt werden. Sie meinen, es genüge für sie, Söhne Jakobs zu heißen. Diese Toren meinen, durch den Namen ’Gerechte’, den sie tragen, gerechtfertigt zu sein. Ihr Name überflutet allerdings die ganze Welt, aber ihre Werke überfließen von Sündhaftigkeit. Wegen Abrahams meinen sie, Söhne der Gerechten zu sein. All ihr Stolz beruht nur auf Namen, weil sie nämlich den Namen Israels führen. All ihr Ruhm besteht darin, daß sie beschnitten sind, mögen sie auch noch so sündhaft sein. Ihre Sitten sind aber nicht derart, wie sie Abrahams Söhnen zukommen würden. Viel gilt ihnen der Name Abrahams, viel seine Beschneidung, viel mehr als sein Glaube. Der Sabbat, den ihnen Gott gab, gilt ihnen mehr als Gott selbst. Ja, sie tadeln sogar Gott, wenn er seine Gesetze abschafft. Sie schreiben also dem Gesetzgeber ein Gesetz vor. Sie leben ohne Gesetz, aber Gott soll unter dem Gesetze stehen; denn sie schätzen das Gesetz höher als den Gesetzgeber. Es liegt ihnen nichts daran, sein Gesetz zu halten, viel aber, dessen Geber zu tadeln. In ihren Augen bedeuten Moses und die Propheten weniger als der Opferkult. In den Opfern besteht all ihr Ruhm, der Opferduft ist ihr Stolz. Diese Stolzen sind zufrieden, wenn sie sich mit Rauch brüsten können; diese Blinden sind zufrieden, wenn sie sich mit Blut und Schmutz besudelt haben. Nach ihrer Ansicht liebt der Herr den Opferduft mehr als die lautere Wahrheit, die er gelehrt hat.“</p><h2>45</h2><p>Solcherlei Reden führten die Büßer über die Hebräer. So sehr sie früher danach verlangt hatten, hinaufzusteigen [auf den Berg], um das Land zu sehen, so genug hatten sie jetzt an ihm und verabscheuten es. Entsetzt flohen sie es, und Schauder ergriff sie über die Frevel, die sie dort sahen, über die Missetaten, mit denen sie, die Büßer, die Hebräer bedeckt sahen. Die Heiden hatten das Heidentum abgelegt, aber das abscheuliche [Juden-] Volk trug es an sich. Sie sprachen zueinander: „Machen wir, daß wir von hier fortkommen, damit wir nicht wegen ihrer Sünden mitgestraft werden; denn dies ist ein widerspenstiges Volk. In Ninive war große Zuversicht am Platze, hier aber ist große Besorgnis berechtigt. Vielleicht wird anstatt Ninives, das nicht umgestürzt wurde, dieses Land von Grund aus vernichtet werden. Dieses Volk ist wahrhaftig für die Ausrottung und den Untergang reif. Dieses Volk ist nicht mehr schön; denn es hat sich mit unserer Häßlichkeit geschmückt. Aber das Andenken dieses seligen Propheten wird groß sein in unserem Lande; denn er war uns die Ursache des Lebens, daß wir all dieses Glück erlangt haben.“</p><h2>46</h2><p>Mit diesen Worten stiegen sie angstvoll wieder [von dem Berge] herab. Die Seligen brachen dann von dort auf und kehrten fröhlich heim. Alle sprachen, mit echter Freude erfüllt, in Weisheit also: „Preis sei Gott, der das Volk [der Juden] durch die Völker beschämt hat! Als gerechtfertigte Sünder wollen wir ihm Loblieder darbringen; als bekehrte und gereinigte Unreine wollen wir ihm reine Früchte darreichen; mit der [ehedem] getrübten Denkkraft wollen wir ihm ein neues Loblied darbringen!“ Auch die Rachsüchtigen und die Zornmütigen dankten ihm für [ihre] Friedfertigkeit; auch die Unkeuschen priesen ihn und dankten ihm dafür, daß sie keusch geworden waren. Es dankten ihm auch die Bedrücker dafür, daß er sie Almosen geben gelehrt hatte. Es dankten ihm auch die Schlemmer dafür, daß er sie fasten gelehrt hatte. Es dankten ihm auch die Trunkenbolde dafür, daß er sie mit Maß trinken gelehrt hatte. Es dankten ihm auch die Räuber dafür, daß sie in Geber verwandelt wurden. Es dankten ihm auch die Ehebrecher dafür, daß ihnen nunmehr der eheliche Umgang genügte. Es benedeiten ihn gar sehr die Wollüstigen dafür, daß sie von der Wollust befreit worden waren. Es dankten ihm die Frevler dafür, daß sie jetzt die Grenze des Erlaubten einhielten. Großes Lob spendeten ihm die Ausgelassenen dafür, daß sie Vernunft und Einsicht angenommen hatten. Es dankten ihm auch die Flucher dafür, daß ihr Mund das Segnen gelernt hatte. Es dankte ihm der Verwaiste dafür, daß er ihm zum Pflegevater geworden war. Es betete ihn die Witwe an dafür, daß er sich mitleidig ihrer Unterdrückung angenommen hatte. Es dankte ihm der Bettler dafür, daß sich sein Korb mit reichem Segen angefüllt hatte. Es dankte ihm der Ackersmann dafür, daß er seinen Pflug wieder bespannt und seinen Leib mit Sättigung angefüllt hatte. Es dankte ihm der Landmann, und der Winzer pries ihn, es dankten ihm auch die Handwerker dafür, daß sie wieder ihr Gewerbe ausüben konnten. Es dankten ihm die Könige dafür, daß sie die Städte wieder in Frieden und ihre Kronen in Sicherheit sahen. Es dankten ihm die Heere dafür, daß sie der Vernichtung entronnen waren. Es dankten ihm die Herrscher dafür, daß sie wieder zu ihrer Herrschaft zurückkehren konnten. Es dankten ihm die Reichen dafür, daß sie ihre Schätze wieder sahen. Es dankten ihm die Eltern dafür, daß sie wieder große Hoffnung auf ihre Sprößlinge setzen konnten. Es dankten ihm die Sprößlinge beim Anblick ihrer Eltern. Es dankten ihm die unschuldigen Kinder dafür, daß ihr Leben verlängert worden war. Es dankten ihm die Kleinen dafür, daß sie [wieder] auf den Schultern getragen werden konnten. Es dankten ihm die Schwangeren dafür, daß ihr Schoß nicht aufgeschlitzt worden war. Es dankten ihm die Bräute dafür, daß sie ihre Brautgemächer mit Freuden betreten konnten. Es dankten ihm die Gebärenden dafür, daß sie mit ihren Säuglingen niederkommen konnten. Es segnete ihn die Säugende dafür, daß sie gesegnet war mit dem Säugling an ihrer Brust. Es dankten ihm die Jungfrauen dafür, daß sie dem Untergang entgangen waren. Es benedeiten ihn gar sehr die Richter dafür, daß sie nicht nach ihren Gerichten gerichtet worden waren. Es benedeiten den Gütigen [Gott] die Schuldforderer dafür, daß von ihnen nicht in der Weise gefordert wurde, wie sie zu fordern pflegten. Es priesen ihn die Wucherer dafür, daß ihre Schulden nicht eingefordert worden waren. Es benedeiten ihn die Schuldner dafür, daß man ihre Schuldbriefe zerrissen hatte. Es brachten die Plünderer ihren Lobpreis dar dafür, daß sie plötzlich zu Gebern geworden sind. Es priesen der Peiniger und sein Opfer Gott gar sehr, und zwar taten es beide auf dieselbe Weise, dafür, daß ihnen in gleicher Weise geholfen worden war: dem Peiniger dadurch, daß er nicht beschädigt wurde, seinem Opfer dadurch, daß es unversehrt blieb. Man brachte in den Palästen Danksagung dar dafür, daß deren Bewohner nicht mehr zu zittern brauchten. Man pries Gott laut in den Burgen dafür, daß sie vor dem Untergang bewahrt worden waren und ihrem Leben noch Jahre hinzugefügt wurden. Ihre Knechte und Mägde dankten und priesen gar sehr; denn eine schwere Knechtschaft ist besser als die Freiheit in den Gräbern. Es freute sich die Mutter und war getröstet; denn sie sah ihren Liebling wieder. Alle Stände und Lebensalter priesen miteinander einander Gott in großem Jubel dafür, daß sie vom Untergang gerettet und gleichsam aufs neue geboren worden waren.</p><h2>47</h2><p>Im Vergleiche zur Buße der Niniviten habe ich unsere Buße einen Schatten genannt. Der wahre Büßer fürchtet sich auch mitten im tiefsten Frieden. Wenn er sich auch einige Hoffnung macht, so erinnert er sich doch immer an seine Züchtigung. Ein Knecht, den sein Herr geschlagen hat, vergißt an keinem Tage seine Schläge. Einen Augenblick fürchtet sich jedermann; ist aber der Zorn [Gottes] vorüber, denkt man nicht mehr daran. Am Anfang des Strafgerichts tut man Buße; allein am Ende desselben empört man sich wieder, wie jemand, der sicher erwartet, daß kein Unheil mehr kommen werde, oder der sich eingeredet hat, der Allerhöchste werde die Sünden nicht mehr bestrafen. Die Niniviten aber bekehrten sich damals von ganzem Herzen. Es dankte ihm die ganze Stadt, die Tag für Tag in ihrer ganzen Ausdehnung gebebt hatte; es benedeite ihn die ganze Stadt, die wie ein Schiff hin und her geschleudert worden war. Es dankten ihm die vernünftigen und die unvernünftigen Wesen, die Menschen und die Tiere. In ihrer Herzensfreude wurden weiße Kleider anstatt der Bußsäcke herbeigeschafft. Gebenedeit sei Er, der die Gerechten liebt und der in Assyrien viele zu Büßern gemacht hat!</p>
    references: |-
      <p><strong>Quelle:</strong> Übersetzung der BKV-Ausgabe, <em>Rede über den Propheten Jonas</em>. Text nach <a href="https://bkv.unifr.ch/de/works/cpg-4082/versions/rede-uber-den-propheten-jonas-und-die-busse-der-niniviten-jonas-32-3-bkv">bkv.unifr.ch</a>; die Anmerkungen der Ausgabe sind weggelassen.</p>

  - src: "fNhS_Поучительные_слова_к_египетским_монахам"
    path: "Ephraem_Asketische_Abhandlungen"
    title: "Auswahl asketischer Abhandlungen"
    menu: { parent: "Asketische Werke", title: "Auswahl asketischer Abhandlungen", priority: 1 }
    update: true
    body: |-
      <p><em>Auswahl asketischer Abhandlungen (Bibliothek der Kirchenväter).</em></p><h2>1</h2><h3>Einleitung.</h3><p>Wie ich schon in der kurzen Einleitung zu den ausgewählten Gesängen Ephräms gegen die Ketzer, S. 226 der zunächst vorhergehenden Abtheilung, angekündigt habe, lasse ich hiemit für die Bibliothek der Kirchenväter und die geneigten Leser derselben eine sorgfältige und fleissig bearbeitete Auswahl seiner ascetischen Schriften über christliche Tugend und Vollkommenheit folgen. Eine reiche Ausbeute dafür liefern die drei griechisch-lateinischen Bände der römischen Ausgabe. Einzelnes hieher Gehörige bietet auch der dritte syrische Band. Das daraus Entnommene wird eigens bemerkt werden.</p><p>Mehrere dieser ascetischen Schriften sind zwar an Einsiedler und Mönche gerichtet, im Ganzen jedoch so gehalten, daß jeder Christ, von was immer für einem Alter und Stande, großen Nutzen daraus für sein Leben schöpfen kann. Sie dienen als ein Spiegel tiefer Selbsterkenntniß. So ist z. B. gleich die erste Darstellung verschiedener Tugenden und Laster meisterhaft, so in’s Einzelne gehend geschrieben, daß man sie mit allem Fug und Recht den berühmten Charakteren des griechischen Klassikers Theophrast an die Seite stellen kann. So genau und lebendig aus dem Leben gegriffen sind die Schilderungen in einfacher, anziehender Klarheit des Stiles. Überhaupt gilt von diesen ascetischen Abhandlungen, was ich in der allgemeinen Einleitung zu Ephräms Schriften, S. 34 der ersten Lieferung, an ihm gerühmt habe, besonders was seine Kunst zu individualisiren betrifft, das Allgemeine konkret an einzelnen Fällen vor das Auge und den Geist des Lesers zu stellen. Ich habe daher nur zu wünschen, daß auch diese neue Abtheilung der Auswahl aus seinen geist- und lehrreichen Schriften freundlich und wohlwollend aufgenommen werden möge.</p><p>P.P.Z.</p><h2>2</h2><h3>Eingang.</h3><p>1. Lob der Mönche von Nisibis. Klage über sich.</p><p>Selig preis’ ich euer Leben, o Freunde Christi, weil es edel und lobenswürdig ist; das meinige aber bejammere ich, weil es schlecht und nutzlos ist. Euch preis’ ich selig, o Edle, weil ihr durch rechtschaffnen Wandel euch zu Freunden Gottes und der Engel gemacht habt; wer aber kann mich genug beklagen, weil ich Gott durch meine eitlen Werke beleidigt habe? Selig seid ihr; denn eures reinen Wandels und eurer unermeßlichen Liebe wegen seid ihr Erben des Paradieses. Ich bewundere euch wahrhaft, daß ihr nicht die große Mühe gescheut habt, zum Nutzen der Seele einen so weiten Weg zu machen; allein noch wunderbarer ist es, daß ihr zu einem Elenden und seiner Sünden wegen Verdammungswürdigen gekommen seid, um von ihm einen heilsamen Unterricht zu verlangen.</p><p>2. Demüthige Verwunderung darüber, daß sie an ihn sich wendeten.</p><p>Ja, es ist wahrlich ein Wunder, wie ihr Gesättigten zu Dem kommet, der vor Hunger verschmachtet; wie ihr, die am geistigen Thaue theilnehmen, zu Dem kommet, der vor Durst ausgetrocknet lechzet; wie ihr, welche der Tugend Süßigkeit haben, zu Dem durch Sünden bitter Gemachten kommet; wie ihr Reichen zu dem Armen, ihr Weisen zu dem Unwissenden, ihr Reinen zu dem Schmutzigen, ihr Gesunden zu dem am Gewissen Kranken, ihr Gottgefälligen zu dem Beleidiger (Gottes), ihr Freien zu dem Gefangenen, ihr Sorgfältigen zu dem Sorglosen kommet. Ihr seid nämlich durch eure Tugenden bewunderungswürdig; allein ich bin thöricht und bettelarm. Ihr besitzt die Enthaltsamkeit und seid gottgefällig; ich aber bin gleichgültig und zu verdammen. Ihr seid durch die guten Werke und eure hellleuchtende Reinheit ein guter Geruch Christi; ich aber bin meiner Weichlichkeit und Nachlässigkeit wegen nur übler Geruch. Wahrhaft wunderbar ist es also, daß ihr, die ihr einen so großen Vorzug in euch enthaltet, zu mir gekommen seid, der ich nicht einmal mir selbst nützlich bin.</p><p>3. Ihr Beweggrund zu ihm zu kommen. Seine Bereitwilligkeit ihnen zu dienen.</p><p>Doch ihr thatet Dieß wahrscheinlicher Weise wohl, o Freunde Christi, weil ihr meine Weichlichkeit stärken und meine träge Seele eifrig machen und meine Nachlässigkeit kräftigen und stark machen wollet; denn euch Vollkommnen gebricht es ja an Nichts. Da ihr aber einmal aus Demuth von mir Armseligen einen ersprießlichen Unterricht verlangt und um mein Leben zu rügen mir diesen Dienst aufgetragen habt, so will ich um der Frucht des Gehorsams willen reden; allein ich schäme mich. Sobald ich anfange euch Rathschläge zu ertheilen, verdamme ich mich selbst, und wenn ich Andere zu tadeln beginne, spreche ich mein eigenes Urtheil. Mit Recht kann man folglich auch mir den Ausspruch des Herrn sagen: “Arzt, heile dich selbst!” Doch hat ja der Herr und Heiland Aller selbst auch gesagt: “Alles, was sie euch thun heissen, thuet; ihren Werken aber machet es nicht nach!” Bin ich also gleich selbst unrein, so weiß ich doch recht zu rathen. Im Hinblicke daher auf diese englische Lebensweise hab’ ich jeden Vorzug von ihr selig gepriesen; denn wer sollte nicht einen Menschen, der recht und gottgefällig lebt und in Reinigkeit wandelt, wegen der ihm aufbewahrten, endlosen und unermeßlichen Güter selig preisen? Und wer sollte einen Menschen nicht beklagen, der sorglos dahinlebt und wegen seiner erbärmlichen Aufführung vom Himmelreich’ ausgeschlossen ist und seiner Gleichgültigkeit wegen aus jenem Brautgemache verstoßen wird?</p><h3>1. Von der Gottesfurcht.</h3><p>1. Seligkeit des Gottesfürchtigen; Gründe dafür.</p><p>Selig ist jener Mensch, welcher die Furcht Gottes in sich hat; denn ein solcher ist offenbar auch vom hl. Geiste selig gepriesen (mit den Worten): „Selig der Mann, welcher den Herrn fürchtet.“ In der That, ja, wirklich befindet sich, wer den Herrn fürchtet, fern von jeder Tücke des Feindes und entgeht jeder Nachstellung des Widersachers. Wer im Besitze der Gottesfurcht ist, überwindet leicht die Anschläge des Gegners; denn dieser macht ihn durch Nichts zum Gefangenen. Wegen dieser Furcht (Gottes) nämlich läßt er keine Lust des Fleisches zu.</p><p>2. Charakter desselben.</p><p>Der Gottesfürchtige schweift nicht leichtsinnig da- und dorthin aus; denn er ist immer in Erwartung, sein Herr möchte plötzlich kommen und ihn im Zustande der Unthätigkeit antreffen und ihn ausscheiden. Wer die Furcht Gottes besitzt, ist nicht sorglos; denn er ist allezeit wachsam. Der Gottesfürchtige überläßt sich nicht unmäßigem Schlafe; denn er bleibt wach und harret auf die Ankunft seines Herrn. Der Gottesfürchtige ist nicht gleichgiltig, damit er seinen Herrn nicht beleidige. Der Gottesfürchtige ist nicht fahrlässig; denn er sorgt immer für seinen Besitz (der Gnade), damit er nicht verdammt werde. Der Gottesfürchtige prüft immer, was seinem Herrn wohlgefällig sein möchte, und bereitet sich Dieß zu thun, damit sein Herr, wenn er kommt, ihn in Vielem loben könne. Viel Gutes also verursacht die Furcht des Herrn ihren Besitzern.</p><h3>2. Von dem Mangel an Gottesfurcht.</h3><p>Gefahren und traurige Folgen desselben.</p><p>Wer die Gottesfurcht nicht in sich hat, kann durch die Angriffe des Teufels leicht gefangen werden. Wer die Furcht Gottes nicht bei sich hat, ist leichtfertig, gleichgiltig, schläft sorglos dahin, verfährt nachlässig bei seinen Arbeiten, wird ein Sammelplatz für die sinnlichen Gelüste. An Allem, was immer Vergnügen macht, erfreut er sich; denn er fürchtet sich nicht vor der Erscheinung des Herrn. Er schwelgt in Befriedigung der Leidenschaften, findet nur an Ergötzungen Freude, flieht das Unangenehme, verabscheut die Verdemüthigung, liebt den Hochmuth. Endlich aber kommt sein Herr und findet ihn mit Dingen beschäftigt, woran er kein Wohlgefallen hat, wird ihn absondern von den Guten und der ewigen Finsterniß überliefern. Wer soll aber einen Solchen nicht bejammern?</p><h3>3. Von der Liebe.</h3><p>1. Glück des Menschen, der die Liebe Gottes hat; Charakterschilderung desselben.</p><p>Selig ist jener Mensch, welcher die Liebe Gottes hat; denn er trägt Gott in sich umher, weil „Gott die Liebe ist und, wer in der Liebe bleibt, in Gott bleibt.“ Wer die Liebe besitzt, überwindet Alles mit Gott. Wer die Liebe hat, fürchtet sich nicht; denn „die Liebe treibt die Furcht aus.“ Wer Liebe hat, verabscheut Niemanden jemals, weder einen Kleinen noch Großen, weder einen Angesehenen noch Gemeinen, weder einen Armen noch Reichen, sondern er wird „der Auswurf Aller.“ Er deckt Alles zu, erträgt Alles. Wer die Liebe besitzt, erhebt sich gegen Niemanden, bläht sich nicht auf, verleumdet Niemanden, sondern verabscheut vielmehr die Verleumder. Wer Liebe hat, wandelt nicht in Falschheit, läßt sich nicht überlisten, überlistet aber auch nicht den Bruder. Wer Liebe besitzt, ist nicht eifersüchtig, beneidet nicht, ist nicht mißgünstig, freut sich nicht über den Fall Anderer; er verhöhnt den Strauchelnden nicht, sondern bemitleidet und unterstützt ihn; er verachtet den Bruder in der Noth keineswegs, sondern steht ihm bei und ist bereit mit ihm zu sterben. Wer Liebe hat, thut den Willen Gottes und ist sein Jünger; denn unser liebenswürdiger Herr hat selbst gesagt: „Daran werden Alle erkennen, daß ihr meine Jünger seid, wenn ihr euch unter einander liebet.“ Wer die Liebe besitzt, erwirbt sich Nichts für sich selbst allein, nennt Nichts sein Eigenthum, sondern Alles, was er immer hat, gibt er für Alle zum gemeinschaftlichen Gebrauche bin. Wer Liebe hat, sieht Keinen für einen Fremdling, sondern Alle als die Seinigen an. Wer die Liebe besitzt, erbittert sich nicht, wird nicht aufgeblasen, entbrennt nicht in Zornhitze, freut sich nicht über das Unrecht, verharret nicht in Lüge, hält Niemanden für einen Feind, ausser den Teufel. Wer Liebe hat, hält Alles aus, ist gütig und langmüthig.</p><p>2. Selige Folgen der Liebe für Jenseits. Wohlthaten der Liebe für die Menschheit.</p><p>Selig also ist, wer die Liebe besitzt und mit ihr zu Gott hinpilgert; denn Gott wird ihn als den Seinigen anerkennen und in seinem Schooße aufnehmen. Ferner wird ein Genosse der Engel sein, wer die Liebe ausübt, und wird mit Christus herrschen. Durch sie ist auch Gott, das Wort, auf die Erde herabgekommen; durch sie ist uns das Paradies aufgethan und der Rückweg in den Himmel eröffnet. Da wir zuvor Feinde Gottes waren, sind wir durch sie wieder mit ihm ausgesöhnt worden. Mit Recht sagen wir daher: „Gott ist die Liebe, und wer in der Liebe bleibt, bleibt auch in Gott.“</p><h3>4. Von Denjenigen, welche die Liebe nicht haben.</h3><p>Ihr Unglück und ihre Gefahren. Traurige Folgen der Lieblosigkeit.</p><p>Elend und unglücklich ist, wer von der Liebe fern ist. Ein Solcher durchlebt nämlich seine Tage wie ein Träumer. Wer sollte aber einen Menschen nicht bedauern, der fern von Gott, des Lichtes beraubt, in der Finsterniß dahinwandelt? Ich sage euch, Brüder: Wer die Liebe Christi nicht hat, ist sein Feind; denn nicht lügt Jener, der da sagt: „Wer seinen Bruder hasset, ist ein Menschenmörder und wandelt in der Finsterniß“ und geräth leicht in die Gefangenschaft jeder Sünde. Wer die Liede nicht besitzt, wird nämlich schnell aufgebracht, geräth gleich in Zorn und wird zum Haß entflammt. Wer die Liebe nicht hat, erfreut sich über das Unrecht Anderer, empfindet kein Mitleid für den Strauchelnden, reicht dem Niedergefallnen nicht die Hand, spricht dem Verunglückten nicht tröstend zu, stärket den Wankenden nicht. Wer nicht im Besitze der Liebe ist, leidet an Geistes=Verblendung, ist ein Freund des Teufels. Er ist ein Erfinder jeglicher Bosheit, ein Anstifter von Streitigkeiten, ein Freund der Lästerer, ein Genosse der Verläumder, ein Rathgeber der Spötter, ein Ermunterer der Neidischen, ein Verüber von übermüthigen Handlungen, ein Gefäß der Prahlerei. Kurz: Wer die Liebe nicht besitzt, ist ein Werkzeug des Widersachers, irrt auf jedem Abweg herum und sieht es gar nicht ein, daß er in der Finsterniß hin und her wandelt.</p><h3>5. Von der Langmuth.</h3><p>Seligkeit des Langmüthigen, Eigenschaften desselben.</p><p>Wahrhaft selig ist jeder Mensch, der die Langmuth sich erworben hat; denn einen Solchen lobt auch die hl. Schrift, indem sie sagt: „Ein langmüthiger Mann ist reich an Einsicht.“ Was ist mehr als Dieß? Der Langmüthige ist nämlich allzeit in freudiger, heiterer und sehr fröhlicher Gemüthsstimmung; denn er setzt seineHoffnung auf den Herrn. Der Langmüthige ist frei von allem Zorne; denn er hält Alles aus. Darum entbrennt er nicht sogleich in Grimm, läßt sich nicht zur Beleidigung verleiten und durch leere Worte nicht leicht aufregen. Wird ihm ein Unrecht zugefügt, so betrübt er sich nicht darüber. Den Widersachern widersetzt er sich nicht; in allen Umständen bleibt er standhaft sich gleich. Er läßt sich nicht leicht durch Täuschungen fangen, ist nicht leicht reizbar zur Erbitterung. Bei Bedrängnissen erfreut er sich, nimmt an jedem guten Werke thätigen Antheil. Er verträgt sich in Allem gern mit den Mißgünstigen; widerspricht nicht, wenn er einen Auftrag erhält; wenn man ihm Vorwürfe macht, wird er darüber nicht mürrisch. Durch die Langmuth weiß er allzeit sich in Ruhe zu erhalten.</p><h3>6. Von Demjenigen, der die Langmuth nicht hat.</h3><p>Charakterzüge und Unglück eines solchen Menschen.</p><p>Wer nicht Langmuth hat, ist auch ohne Geduld; denn wer nicht langmüthig ist, kommt leicht ausser Fassung, ist zur Erbitterung aufgelegt und wird leicht zum Streiten entflammt. Er vergilt Beleidigung mit Beleidigung, rächt sich, wenn ihm Unrecht geschieht, läßt sich in unnütze Wortstreite ein. Er schwankt in seinem Thun und Lassen wie vom Wind erschütterte Blätter, hält in seinen Reden nicht Stand, springt schnell von einem Gegenstande zum andern über. Wer keine Langmuth besitzt, ist auch von Charakterfestigkeit weit entfernt; denn er ändert sich schnell. Er hat keine Gabe der Beurtheilung, schließt sich dem Schlechten an, gesellt sich zu dem Tadler, vereinigt sich mit dem, der Unrecht übt, zur Rache. Er verschweigt kein Geheimniß und ist bereit, das ihm Anvertraute zu offenbaren. Was ist nun wohl elender als ein solcher Mensch?</p><h3>7. Von der Geduld.</h3><p>1. Des Geduldigen Seligkeit.</p><p>Selig ist, o Brüder, wer sich Geduld erworben hat, weil die Geduld Hoffnung hat; „die Hoffnung aber Macht nicht zu Schanden“ Wahrhaft selig also und dreimal selig ist Derjenige, welcher Geduld besitzt. „Wer nämlich geduldig aushält bis an’s Ende, der wird selig werden.“ Was gibt es aber wohl Besseres, als diese Verheissung? Gütig ist der Herr gegen Diejenigen, die auf Ihn harren. Wisset ihr aber, o Brüder, wie hoch die Geduld zu schätzen ist? Oder soll ich darüber zu eurer Beruhigung noch ausführlicher sprechen?</p><p>2. Einfluß dieser Tugend auf den Charakter des Menschen.</p><p>Die Geduld ist nicht bloß eine für sich allein bestehende Tugend, sondern sie steht mit vielen andern in Verbindung. Der Geduldige macht sich nämlich jede Tugend eigen; denn er freut sich in Trübsalen und zeichnet sich (durch Standhaftigkeit) in Drangsalen aus. Bei Versuchungen ist er fröhlichen Muthes und läßt sich zum Gehorsame bereit finden. In der Langmuth ist er vollkommen, mit Liebe erfüllt. Bei Beleidigungen spricht er Segen aus, bei Streitigkeiten bleibt er friedfertig, in der Ruhe zeigt er männliche Beharrlichkeit. Er ist unverdrossen beim Psalmgesange, eifrig im Fasten, anhaltend im Gebete, tadellos bei Arbeiten, in seinen Antworten aufrichtig, pünktlich gehorsam bei Aufträgen und sorgfältig in seinem Betragen überhaupt. Bei Dienstleistungen zeigt er sich liebenswürdig und in der ganzen Lebensweise vollkommen. Im gemeinsamen brüderlichen Leben erscheint er einnehmend und bei Berathungen ungemein freundlich. Bei den Nachtwachen ist er heiter und bei der Sorge für die Fremden sehr thätig. Für die Kranken ist er voll Vorsicht und immer der Erste, Leidenden zu Hilfe zu eilen. Im Denken ist er nüchtern und zu jedem guten Werke aufgeweckt, bereit.</p><p>3. Hoffnung des Geduldigen.</p><p>Wer im Besitze der Geduld ist, hat sich auch Hoffnung erworben; denn ein Solcher ist mit jedem guten Werke geschmückt. Darum wird ein solcher auch voll Zuversicht zum Herrn rufen: „Harrend harrte ich auf den Herrn und er achtete auf mich.“</p><h3>8. Von Demjenigen, der keine Geduld hat.</h3><p>1. Unglückliche Lage eines solchen Menschen; seine schlechten Eigenschaften.</p><p>Unglücklich aber und elend ist der Mensch, welcher die Geduld nicht besitzt; denn über Solche ruft die hl. Schrift drohend „Wehe“ aus, indem sie sagt: „Wehe denen, welche die Geduld verloren haben!“ Und wahrlich, wahrlich Wehe Demjenigen, der die Geduld nicht hat! Ein Solcher wird nämlich wie ein Blatt vom Winde hin und her getrieben, verträgt keine Beleidigung, ist bei Drangsalen nachlässig. Ein Solcher ist in Streitigkeiten leicht zu verwickeln, mürrisch beim Erdulden (z. B. von Mühen, Leiden) und beim Gehorchen geneigt zum Widersprechen. Bei Gebeten ist er träge und bei Nachtwachen nachlässig; beim Fasten traurig und in der Enthaltsamkeit sorglos. Er ist zu faul zu antworten, und bei den Geschäften arbeitet er schlecht. An Bosheit hingegen ist er unüberwindlich und gebieterisch bei Anordnungen von Arbeiten, tapfer bei Wortstreiten, in der Ruhe aber vermag er Nichts zu leisten. Ein Solcher ist ein Widersacher der Ruhmwürdigen und auf die Fortschreitenden (im Guten) eifersüchtig.</p><p>2. Wie schädlich die Ungeduld sei.</p><p>Wer die Geduld nicht hat, zieht sich vielfachen Schaden zu, und ein Solcher ist nicht im Stande, die Tugend sich zu eigen zu machen; denn „durch die Geduld laufen wir, “wie der Apostel sagt, „den uns aufgelegten Wettlauf.“ Wer die Geduld nicht besitzt, ist fern von dieser Hoffnung. Darum bitte ich euch, die ihr gleich mir ungeduldig seid: „Erwerbt euch die Geduld, damit ihr selig werdet!“</p><h3>9. Von der Freiheit vom Zorne.</h3><p>Seligkeit und Charakter eines von Zornmüthigkeit freien Menschen.</p><p>Selig ist jener Mensch, der sich nicht leicht erzürnt oder nicht leicht in Hitze geräth. Ein Solcher lebt jederzeit im Frieden. Wer den Geist der Heftigkeit und des Zorns von sich vertreibt, ist frei von Krieg und Verwirrung und befindet sich allzeit in tiefster Seelenruhe und verräth durch sein Gesicht schon die innere Freude. Wer nicht jähzornig ist, läßt sich nicht von jedem leeren Worte aufbringen. Ein Solcher übt Gerechtigkeit und Wahrheit, er hält sich ohne Mühe zurück und erträgt leicht die Redsüchtigen. Er macht sich keiner Ungerechtigkeit schuldig; Schwachheiten begegnen ihm nicht. Ein Solcher hat keine Freude an Streitigkeiten; denn er zeigt sich gegen Alle liebevoll. Wer dem Zorne nicht ergeben ist, hat kein Vergnügen an Wortzänkereien, und ein Solcher befindet sich jederzeit in gesundem (glücklichem) Zustande. Er hat seine Freude am Frieden und hält sich bei der Langmuth (wie bei einer Freundin) auf. Wer nicht leicht den Geist des Jähzorns bei sich aufnimmt, wird eine Wohnung des hl. Geistes, und wer den Geist des Jähzorns nicht hat, reizt den hl. Geist nicht gegen sich auf. Ein Solcher kann auch sanftmüthig sein, kann auch Liebe haben und Geduld und Demuth. Wer dem Zorne nicht ergeben ist, ist mit jedem guten Werke geschmückt und wird von Christus geliebt. Dreimal selig ist also Jener, welcher den Geist des Zorns und der Hitze allzeit von sich vertreibt, weil sein Leib und seine Seele und sein Geist jederzeit fest in gutem Zustande bleiben.</p><h3>10. Von dem Jähzorn.</h3><p>1. Unglück des Jähzornigen.</p><p>Wer sich gewöhnlich vom Jähzorn beherrschen läßt und oft und schnell wegen der geringsten Kleinigkeit in Hitze geräth, der höre wohl, was der hl. Apostel sagt: „Der Zorn der Menschen thut nicht die Gerechtigkeit Gottes“ (d. i. was Gott gefällt). Ja, in der That unglücklich und elend ist Derjenige, welcher von diesen Leidenschaften sich beherrschen läßt; denn ein dem Zorn Ergebener, heißt es, tödtet sich selbst. Wahrhaftig: der Zornmüthige tödtet und richtet sich selbst zu Grunde; denn ein solcher Mensch lebt beständig in Aufregungen und ist in ruhelosem Zustande. Er ist fern vom Frieden und zerstört zugleich seine Gesundheit; denn sein Leib wird unausgesetzt (durch Ärger) abgezehrt und die Seele betrübt, und das Fleisch schwindet dahin, und Blässe entfärbt sein Gesicht.</p><p>2. Traurige Wirkungen des Zorns auf den Geist.</p><p>Auch der Geist wird verändert, der Verstand geschwächte, die Gedanken wogen wie ein Strom hin und her, und er wird bei Allen verhaßt. Ein solcher Mensch weiß Nichts von Langmuth und Liebe; schon leere Worte bringen ihn leicht in Verwirrung; wegen jeder elenden Veranlassung fängt er Streitigkeiten an. Wo man seiner gar nicht bedarf, dringt er sich auf und zieht sich auf diese Weise vielen Haß zu. Nebstdem hat er aber auch Freude an Schwätzereien und hat seine Lust an schädlichen Vorfällen. Er ergötzt sich an Lästerungen, ist schwach in Übung der Sanftmuth, gewaltig hingegen in Ränken der Bosheit. Wer sollte nun einen solchen Menschen nicht beklagen? Er ist ja bei Gott und bei den Menschen verabscheut. Der Jähzornige ist nämlich durchaus unglücklich. Hütet euch also vor dem Jähzorns!</p><h3>11. Von der Sanftmuth.</h3><p>1. Des Sanftmüthigen Glück.</p><p>Selig fürwahr, ja dreimal selig ist der Mensch, welcher die Sanftmuth besitzt. Damit stimmt auch unser heiliger Erlöser und Herr überein, indem er sagt: „Selig sind die Sanftmüthigen; denn sie werden das Land als Erbtheil besitzen.“ Was gibt es aber Seligeres, als diese Seligpreisung? Was ist erhabener als diese Verheissung? Was für ein glänzenderes Glück gibt es wohl als diese Freude, das Land des Paradieses als Erbtheil in Besitz zu nehmen? Da ihr, o Brüder, also gehört habt, was für ein überströmendes Maß von Reichthum diese Verheissung enthält, so ringet mit allem Eifer dahin zu gelangen!</p><p>2. Ermunterung zur Sanftmuth.</p><p>Trachtet mit begieriger Eile nach dem Glanze dieser Tugend! Mit tiefgerührtem Gemüthe strebet mit aller Kraft darnach, damit ja Keiner unwürdig werde, dieses Land als Erbtheil zu besitzen, und mit bitterer Reue seine Thorheit beweine! Weil ihr die Seligpreisungen der Sanftmuth gehört habt, so eilet zu ihr und vernehmt, was der wahrhafte Prophet Jesaias im hl. Geiste über sie sagt: „Über wem werd’ ich ruhen, spricht der Herr, als über dem Sanftmüthigen und Ruhigen und Jenem, der vor meinen Worten zittert?“ Muß man sich über diese Verheissung nicht verwundern? Was gibt es Herrlicheres als diese Ehre? Habt daher wohl Acht, Brüder, daß Keiner diese Seligkeit und unermeßliche Freude und Wonne verliere! Eilet also, ermahn’ ich euch, eilet und erwerbet euch die Sanftmuth!</p><p>3. Charakter des Sanftmüthigen.</p><p>Der Sanftmüthige ist mit jedem guten Werke (mit jeder Tugend) geziert. Der Sanftmüthige freut sich, auch wenn er beleidigt wird; er dankt, auch wenn er bedrängt wird, und besänftigt mit Liebe die Erzürnten. Gescholten bleibt er gelassen, bei einem Streite ruhig, freudig bei einem Auftrage. Bei übermüthigem Betragen läßt er sich nicht reizen; bei Demüthigungen fühlt er Freude. In glücklichen Umständen wird er nicht hochmüthig und brüstet sich nicht. Allen gegenüber beobachtet er ein ruhiges Verhalten, gehorcht in aller Unterthänigkeit, ist zu jedem guten Werke bereitwillig. Er steht bei Allen im besten Rufe, erntet von Allen Lob, ist weit entfernt von Bosheit und Verstellung. Ein Solcher erniedrigt sich niemals zu einer Falschheit und wird nie ein Sklave des Neides. Mit Abscheu wendet er sich von Lästerungen ab und läßt keine üble Nachrede zu. Die Tadler sind ihm verhaßt und die Verläumder ein Gräuel. O, welch’ ein Reichthum von Seligkeit liegt also in der Sanftmuth, da sie von Allen gepriesen wird!</p><h3>12. Von der Bosheit.</h3><p>1. Beklagenswerther Zustand boshafter Leute.</p><p>Wehklagen also, Brüder, und jammern muß man über Diejenigen, welche die Sanftmuth nicht haben, sondern an das Joch der Bosheit gespannt sind, weil sie einem schlimmen Urtheilsspruche unterliegen. Es heißt nämlich: „Die böse sind, werden ausgerottet werden.“ Unser heiliger Gott aber (Christus) beschimpft solche Leute, indem er sagt: „Ein böser Mensch bringt aus dem bösen Schatze seines Herzens Böses hervor.“ Ferner sagt auch der Prophet David: „Über die Bösewichte, die sich gegen mich empören, hört mein Ohr.“ Etwas Entsetzliches ist es um den Geist der Bosheit, o Brüder! Deßwegen nehmt euch in Acht, daß ja Keiner in die Gewalt desselben falle und sich selbst verwerflich mache!</p><p>2. Charakterschilderung derselben.</p><p>Der Böse hat nämlich niemals Frieden, sondern befindet sich jederzeit in Unruhen, immerfort ist er voll Hitze, Arglist und Zorn, allzeit hat er seine Blicke auf seinen Nächsten (tadelsüchtig) gerichtet, beständig streut er Verleumdungen aus, ist immer neidisch, eifersüchtig und rauh in seinem Benehmen. Wird ihm Etwas aufgetragen, so widerspricht er allzeit; erhält er einen Befehl, so macht er die Sache verkehrt; gibt man ihm einen guten Rath, so handelt er schlecht. Wird er zur Ordnung verwiesen, so spottet er darüber; zeigt man ihm Liebe, so verhöhnt er es. Die im guten Rufe stehen, verabscheut er; die da Fortschritte (im Guten) machen, sind ihm zuwider. Die Ermahnungen achtet er gering, verkehrt die Brüder, den Einfältigen fügt er Übles zu, die Langmüthigen verlacht er. Fremde täuscht er durch Verstellung; er verleumdet den Einen bei einem Andern, ist aber selbst Jedem ein Widersacher, hetzt zu Streitigkeiten an, regt zur Erbitterung auf, hilft zur Wiedervergeltung (des Bösen) mit. Er ist bereit zu Lästerungen, hat seine Lust an Verleumdungen, ist zur Beleidigung rasch aufgelegt, ein gewaltiger Schwätzer, zum Schelten fertig, zu Unruhen der erste Mithelfer. Hingegen zeigt er sich schwach zum Psalmgesang, zum Fasten unfähig, zu jedem guten Werke untauglich und ohne Einsicht. Gegen geistliche Unterredungen ist er gleichgiltig; denn die Bosheit verschließt ihm dazu ganz seinen Mund. Ein solcher Mensch ist daher wohl sehr zu beklagen. Deßwegen ermahn’ ich euch, Brüder: „Hütet euch vor der Bosheit!“</p><h3>13. Von der Wahrheit.</h3><p>Glückseligkeit und edles Betragen des Freundes der Wahrheit.</p><p>1. Glückselig ist, wer sein Leben nach der Wahrheit einrichtet und sich nie auf einer Lüge ertappen läßt. Selig und dreimal selig ist, wer die Wahrheit übt; denn „Gott ist wahrhaft, und an ihm ist keine Lüge.“ Wer soll also Denjenigen, der die Wahrheit beobachtet, nicht selig preisen? Ein Solcher ahmt ia Gott nach. Der Wahrhafte ist wirklich allzeit Gott angenehm und allen Leuten nützlich. Er ist ein Muster in der Brüderschaft und bei jeder Angelegenheit gerade.</p><p>2. Der Wahrhafte nimmt keine Rücklicht auf Personen und richtet nie ungerecht. Er sieht nicht parteiisch auf Ansehen und Ehre und verachtet daher einen Armen und Dürftigen nicht. Bei Antworten ist er ohne Falsch und der Gesinnung nach redlich. Er verrichtet sein Geschäft mit gewissenhafter Sorgfalt und ist deßwegen bei dem gemeinschaftlichen Körper der Brüderschaft hoch in Ehren. Von Arglist weiß er Nichts, ist kein Liebhaber von Verstellung. Mit jedem guten Werke geschmückt steht er da und befleißt sich jeder Tugend. Selig ist daher, wer allzeit der Wahrheit dient.</p><h3>14. Von der Lüge.</h3><p>Unseliger Zustand eines lügenhaften Menschen. Charakterbeschreibung desselben.</p><p>Elend aber und unglückselig ist Derjenige, welcher sich völlig der Lüge ergeben hat; denn „der Teufel ist ein Lügner von Anbeginn.“ Wer dem Lügen ergeben ist, kann kein Vertrauen genießen; denn er ist bei Gott sowohl als auch bei den Menschen verhaßt. Wer sollte den, welcher in der Lüge dahinlebt, nicht bejammern? Denn ein Solcher ist unzuverlässig bei jeder Angelegenheit, und man kann ihm bei seinen Antworten nicht trauen. Ein Solcher erregt im Kloster Unfrieden und Streitigkeiten und ist für das Gemeinwohl der Brüderschaft wie Rost am Eisen. Er hat nämlich ein dreistes Herz und verbirgt dieß auch nicht. Gern hört er Geheimnisse und entdeckt sie leichtsinnig. So weiß er durch seine Zunge die Einträchtigen in Uneinigkeit zu bringen. Er fängt irgend einen Handel an und stellt sich dann als unschuldig. Alles betheuert er mit einem Schwure und glaubt durch Geschwätz zu überreden. Der Lügner ist reich an Kunstgriffen und verschlagen. Es gibt kein größer Übel als dieß (die Lügenhaftigkeit), aber auch nichts Schändlicheres; denn ein Lügner ist bei Allen verabscheut und dient Allen zum Gelächter. Hütet euch also, o Brüder, euch an das Lügen zu gewöhnen!</p><h3>15. Glück und Betragen des Gehorsamen.</h3><p>1. Selig ist, wer sich den wahren und ungeheuchelten Gehorsam zu eigen gemacht; denn ein Solcher ist Nachahmer unsers guten Lehrers, „der gehorsam geworden bis zum Tode.“ Wahrhaft selig ist daher, wer den Gehorsam hat; weil er nämlich Nachahmer des Herrn ist, wird er auch sein Miterbe.</p><p>2. Wer den Gehorsam besitzt, ist mit Allen durch die Liebe vereint. Wer Gehorsam hat, hat sich ein kostbares Gut erworben, einen großen Reichthum gewonnen. Der Gehorsame ist bei Allen hochbeliebt, wird von Allen gelobt, von Allen gerühmt. Der Gehorsame steigt schnell hoch, macht schnell große Fortschritte. Der Gehorsame unterwirft sich ohne Widerrede, entzieht sich keinem Auftrage, erzürnt sich nicht über Vorwürfe, ist zu jedem guten Werke bereit. Vom Jähzorne wird er nicht leicht ergriffen. Vernimmt er einen Vorwurf, so geräth er dadurch nicht in Verwirrung, und bei Unbilden wird er nicht entflammt. Er freut sich bei Betrübnissen, dankt in Bedrängnissen. Er wechselt nicht alle Augenblicke seinen Aufenthalt und zieht von einem Kloster in’s andere; denn er wird durch Ermahnungen nicht gekränkt. Er bleibt am Orte seines ersten Berufs und läßt sich ihn nicht verleiden. Den Vater (Abt) achtet er nicht gering. Mitbrüder schätzt er ebenfalls nicht gering und verkehrt die Ordnung des Klosters nicht. Er hat keine Freude an Erholungen, ergötzt sich nicht an (angenehmen) Orten, hat kein Vergnügen an Luftveränderungen, sondern er bleibt nach dem Ausspruch des hl. Apostels Paulus „am Orte, wo er berufen ward.“ Zahlreich sind also in Wahrheit die Früchte des Gehorsams; daher ist Derjenige selig, welcher in seinem Besitze ist.</p><h3>16. Vom Ungehorsam und besonders vom Fehler des Murrens.</h3><p>Elend des Menschen, der den Geist des Gehorsams nicht hat. Traurige Folgen der Sucht zu murren. Charakter der diesem Fehler Ergebenen.</p><p>1. Verfluchungswürdig und elend ist der Mensch, welcher sich nicht den Gehorsam angeeignet hat, sondern das Murren; denn das Murren ist in einem Kloster eine große Plage, ein Ärgerniß für die Gemeinschaft, Umsturz der Liebe, Auflösung der Eintracht, Verwirrung des Friedens. Wer dem Murren ergeben ist, widerspricht, wenn er einen Auftrag erhält, ist unbrauchbar beim Arbeiten, und ein solcher Mensch erntet nie einen Dank ein. Zudem ist er auch träge; denn die Trägheit ist mit dem Murren innigst verbunden. Jeder Träge wird in Übel fallen, sagt die hl. Schrift; „denn,“ spricht sie, „der Träge sagt, wenn er irgendwo hingeschickt wird: Es ist ein Löwe auf den Wegen herum, Mörder sind auf den Strassen.“</p><p>2. Der dem Murren Ergebene weiß allzeit eine Ausflucht zu machen. Wenn ihm befohlen wird ein Werk zu verrichten, so murrt er und macht gleich auch Andere abwendig. „Wozu das? Warum Jenes?“ sagt er; „die Sache ist ja nicht zuträglich.“ Wird er auf einen Weg hinausgeschickt, so gibt er vor, daß ihm bei der Reise große Schäden bevorstehen. Wenn man ihn zum Psalmgesange aufweckt, so geräth er in Hitze. Soll er Nachtwache halten, so schützt er Bauch- und Kopfweh vor. Gibst du ihm eine Ermahnung, so antwortet er: „Ermahne du nur dich selbst! In Bezug auf mich mag es gehen, wie Gott will.“ Belehrest du ihn, so erwidert er: „Wüßtest du nur die Sache so gut, wie ich sie verstehe!“ Keiner Arbeit unterzieht er sich allein, wenn er nicht irgend einen Andern als Theilnehmer für sich gewinnt.</p><p>3. Bei einem dem Murren Ergebenen ist jedes Werk verwerflich, unnütz und ohne Tugendwerth. Seine einzige Freude sind Ergötzungen, am Übelbefinden hat er kein Vergnügen. An Schmausereien findet er Lust, das Fasten hingegen ist ihm ein Gräuel. Ein solcher murrsüchtiger Müssiggänger versteht es auch gut, Ohrenbläsereien und allerlei Geschwätz zusammenzustellen; denn er ist sehr gewandt und verschlagen und in Plaudereien unüberwindlich. Ein solcher Mensch verleumdet in Einem fort die Leute bei einander. Bei guten Werken macht er ein finsteres Gesicht und taugt zur Aufnahme von Fremden gar nicht. Er ist ein Heuchler in der Liebe, stark aber im Hasse.</p><p>Murren wir daher, o Brüder, nicht bei Aufträgen (der Obern), widersprechen wir nicht und vertheidigen wir uns nicht, als ob wir mehr verstünden!</p><h3>17. Über das Freisein von Neid und Eifersucht.</h3><p>Glück des Menschen ohne Neid und Eifersucht. Charakterschilderung eines solchen Menschen.</p><p>1. Selig ist, wer kein Sklave des Neides und der Eifersucht ist; denn Eifersucht und Neid hängen von einander ab, und wer Einen dieser Fehler hat, hat beide miteinander. Wahrhaft selig ist daher, der in diese Fehler nicht verfallen und von keinem derselben verwundet ist. Wer nämlich eine ungerechte Eifersucht gegen seinen Bruder hat, wird mit dem Teufel verdammt. Der Eifersüchtige wird (von seiner Leidenschaft) besiegt und hegt auch Haß und Feindseligkeit und ärgert sich über den Fortschritt Anderer (im Guten).</p><p>2. Wer ohne Neid und Eifersucht ist, betrübt sich niemals über den Fortschritt Anderer. Wird ein Anderer geehrt, so wird er darüber nicht beunruhigt. Wenn ein Anderer erhöht wird, so empfindet er darob keinen Verdruß; denn er zieht Alle vor, Alle schätzt er höher als sich selbst. Sich selbst sieht er als einen Unwürdigen und als den Letzten von Allen an: Alle hält er für größer und besser als sich selbst. Der Neidlose trachtet nicht nach Ehre, freut sich mit den sich Freuenden, legt sich keinen Ruhm bei, steht den (im Guten) Fortschreitenden bei, frohlockt mit Denjenigen, die einen schönen Wandel führen, und lobt die Rechtschaffnen. Sieht er einen Bruder tugendhaft leben, so legt er ihm kein Hinderniß in den Weg, sondern ermuntert vielmehr einen Solchen durch Ermahnungen. Sieht er einen Andern der Ruhe sich hingeben, so redet er ihm deßwegen nicht übel nach, sondern nimmt freundlich Antheil daran. Bemerkt er aber bei einem Bruder Fehltritte, so zieht er ihn nicht lästernd durch, sondern ermahnt ihn auf die rechte Weise.</p><p>3. Sieht er Jemand erzürnt, so bringt er ihn nicht noch mehr auf, sondern besänftigt ihn mit Liebe und bewegt ihn versöhnend zum Frieden. Bemerkt er einen Trauernden, so ist er nicht gleichgiltig dagegen, sondern trägt Mitleid mit ihm und tröstet ihn durch nützliche Zureden. Kommt ihm Jemand zu Gesicht, der wenig unterrichtet ist und unerfahren, so bemüht er sich, ihn zu belehren und zum Nützlichen anzuleiten. Erblickt er einen Unwissenden, so zeigt er ihm willig den Weg zum Bessern. Bemerkt er, daß Jemand zur Zeit des Psalmgesangs eingeschlafen ist, so weckt er ihn sorgfältig auf. Um es kurz zu sagen: Wer von Neid und Eifersucht frei ist, behandelt in keinem Stücke den Nächsten mit höhnischem Neide, sondern erfreut sich über jeden Fortschritt und jede tugendhafte Handlung des Freundes.</p><h3>18. Von dem Neid und der Eifersucht.</h3><p>Großes Unglück der damit behafteten Menschen. Betragen derselben gegen Andere. Ermahnung, diese Laster zu fliehen.</p><p>1. Wer an den Wunden dieser Fehler leidet, ist unglückselig; denn er ist ein Genosse des Teufels, „durch welchen der Tod in die Welt gekommen ist.“ Wer nämlich Neid und Eifersucht hat, ist ein Widersacher Aller; denn er will Niemanden sich vorgezogen wissen. Er verkleinert daher Diejenigen, welche in gutem Rufe stehen, und legt Solchen, die einen schönen Lebenswandel führen, allerlei Hindernisse in den Weg. Die rechtschaffen Lebenden tadelt er und verabscheut den Gewissenhaften. Wer gern fastet, den nennt er ruhmsüchtig, und den im Psalmgesang Eifrigen lobbegierig. Wer im Dienste eifrig ist, den heißt er vorwitzig, und den bei Arbeiten Muntern ehrgeizig. Wer sich gern mit der hl. Schrift beschäftigt, den nennt er einen Müssiggänger, und den bei Antworten Bewährten einen Schlemmer. Niemals erfreut sich der Neidische über den Fortschritt eines Andern. Sieht er Jemanden nachlässig dahinleben, so erweckt er ihn nicht (zu Fleiß und Thätigkeit), sondern muntert ihn noch mehr zum Übel (d. i. zur Sorglosigkeit) auf. Bemerkt er zur Zeit des Gebets einen Schlafenden, so weckt er ihn nicht auf, sondern verschafft ihm vielmehr noch Ruhe dazu. Sieht er einen Bruder ausruhen, so redet er ihm übel nach, und betritt er Jemanden auf einem Versehen, so zieht er ihn bei Allen spottend durch.</p><p>2. Wehe dem Neidischen! Allzeit leidet nämlich sein Herz an Empfindungen des Grams, und der Körper wird immer blässer und abgezehrter, seine Kräfte schwinden dahin. Gegen Alle ist er bitter, wird zum Feinde Aller, haßt Alle, spielt gegen Alle den Heuchler, schmiedet Ränke, ist voll Menschenrücksicht. Heut’ schließt er sich an Diesen, morgen an Jenen an. Er ist bei Jedem ein anderer Mensch, verändert sich nach dem Willen eines Jeden, und im nächsten Augenblicke spricht er über Alle das Verdammungsurtheil. Er verleumdet Einen bei dem Andern und bringt Alle wie durch Zauber hinter einander. Ein schreckliches Gift also sind Neid und Eifersucht, weil daraus üble Nachreden, Haß und sogar Todtschläge entstehen.</p><p>3. Fliehet daher weit vom Neide, ihr Kämpfer für das Himmelreich! Entfernet weit von euch Eifersucht und Neid, damit ihr nicht mit dem Teufel verdammt werdet!</p><h3>19. Ueber die Freiheit von der Lästersucht.</h3><p>Glückseligkeit des von Lästersucht Freien; Beschreibung seines Wandels.</p><p>1. Glückselig, ja dreimal selig ist Derjenige, welcher seine Zunge nicht mit Lästerungen Anderer beschädigt und durch die Zunge sein Herz nicht befleckt, sondern im Bewußtsein, daß wir insgesammt tadelnswürdig sind, an der Lästerung über Andere keine Freude hat, sondern darüber sich vielmehr erzürnt. Wer Andere nicht lästert, bewahrt sich selbst unbefleckt. Ein Solcher wandelt ohne Anstoß und erhält sein Gewissen unbemakelt. Wer den Lästergeist flieht, hütet sich vor der Verbindung mit Bösen und besiegt die Heerschaar der bösen Geister. Wer keine Lästerzunge hat, besitzt einen unverletzlichen Schatz.</p><p>2. Wer zur Lästerung Anderer sich nicht herabwürdigt, vermeidet auch den Brudermord und wird auch von Andern nicht gelästert werden. Wer von dem Geiste der Lästerung nicht besessen ist, erkennt sich wahrhaft als einen Menschen von Fleisch und bewahrt sich selbst unbefleckt. Wer sich nicht in der Gesellschaft von Lästerern aufhält, wird einst in die Wohnung der Engel gelangen. Wessen Ohren und Zunge durch Lästersucht nicht vergiftet sind, ist ganz von der Arznei der Liebe erfüllt. Wer seinen Mund nicht mit Lästerungen verunreinigt, dessen Mund duftet lieblich von den Früchten des hl. Geistes. Wahrhaft glückselig und noch einmal selig ist also Derjenige, welcher sich vor der Lästerung bewahrt.</p><h3>20. Von der Lästerung und den Lästerern.</h3><p>Urtheil über den Charakter der Lästerer. Gegensatz ist das Betragen Derjenigen, die von diesem Fehler frei sind. Unglück und Schändlichkeit der Lästersucht.</p><p>1. Wer am Lästern über Andere sein Vergnügen findet, hat offenbar in die Fehler, die er Andern vorwirft, sich selbst verstrickt; denn wer einen Andern lästert, verdammt sich selbst: er ist nämlich ein fleischlich gesinnter Mensch, in die Netze der Welt verwickelt. Der Lästersüchtige vereinigt in sich mit einanderVerläumdung und Haß und Ohrenbläserei. Ein Solcher wird daher als Brudermörder, als unbarmherzig und lieblos beurtheilt.</p><p>2 Wer aber die Furcht Gottes allzeit in sich trägt und sein Herz rein bewahrt, hat am Lästern über Andere keine Freude, findet kein Vergnügen am Bekanntmachen verborgener Fehler Anderer und ergötzt sich nicht am Falle anderer Leute.</p><p>3. Wahrhaft beklagenswerth und bedaurungswürdig ist daher, wer sich an Verlästerungen gewöhnt hat. Was ist auch schändlicher als dieser häßliche Fehler? Deßwegen zählt auch der hl. Apostel Paulus, da er die Werke der Gottlosigkeit verdammend anführt, den Lästerer darunter, indem er spricht: „Weder Lästerer noch Räuber werden das Reich Gottes erben.“</p><h3>21. Von der Enthaltsamkeit.</h3><p>1. Das Selige und Hohe dieser Tugend, Umfang und Gegenstände desselben.</p><p>Wahrhaft selig und zwar dreimal selig ist Derjenige, welcher die Enthaltsamkeit beobachtet; denn die Enthaltsamkeit ist in der That eine große Tugend. Vernehmt nun aber, wie weit die Enthaltsamkeit sich erstrecke, wie hoch man sie schätze, bei welchen Gegenständen sie genannt oder beurtheilt oder gesucht werde!</p><p>2. Von der Enthaltsamkeit der Zunge.</p><p>Die Enthaltsamkeit in Bezug auf die Zunge besteht darin, daß man seine Reden nicht in weitschweifige und leere Geschwätze hinausziehe, daß man die Zunge beherrsche und keine Lästerungen ausspreche, nicht spotte, nicht fluche, nicht eitle und ungebührliche Reden führe, die Zunge im Zaume halte und nicht Einen beim Andern verleumde, keinen Bruder tadle, Geheimnisse nicht offenbare, sich um Dinge nicht kümmere, die Einen Nichts angehen.</p><p>3. Enthaltsamkeit in Bezug auf Gehör und Gesicht.</p><p>Es gibt auch eine Enthaltsamkeit hinsichtlich des Gehörs, daß man sich nämlich überwinde und thörichtem Gerede nicht aufhorche. Die Enthaltsamkeit in Rücksicht auf die Augen zeigt sich darin, daß man die Lust, herumzuschauen, beherrsche und seine Blicke nicht auf alle die anziehenden und unehrbaren Gegenstände richte.</p><p>4. Enthaltsamkeit des Gemüths hinsichtlich des Ruhms und in Gedanken.</p><p>Die Enthaltsamkeit im Gemüthe liegt darin, daß man den Zorn bemeistere und nicht gleich in Hitze gerathe. Die Enthaltsamkeit rücksichtlich des Ruhms besteht darin, daß man über seinen Geist Herr sei und nicht verherrlicht werden wolle, nicht Ruhm suche, sich nicht hochmüthig erhebe, nicht nach Ehre verlange, nicht aufgeblasen sei und auf Lobeserhebungen nicht stolz werde. — Die Enthaltsamkeit in Gedanken besteht darin, daß man auch sie durch die Gottesfurcht zügle und in keinen reizenden und lustentzündenden Gedanken einwillige.</p><p>3. Enthaltsamkeit im Essen und Trinken.</p><p>Die Enthaltsamkeit in Bezug auf die Speisen zeigt sich darin, daß man sich beherrsche und nicht übermäßig viele oder köstliche Speisen suche, daß man nicht ausser der festgesetzten Zeit und Stunde esse, sich nicht vom Geiste der Gefrässigkeit fesseln lasse, nicht unersättlich nach trefflichen Speisen trachte und nicht bald diese bald jene Speise sich wünsche. — Die Enthaltsamkeit in Rücksicht auf das Trinken liegt darin, daß man sich überwinde und sich nicht in Saufgelage einlasse oder nach süßen Weinen lüstern werde, nicht schamlos zeche und nicht verschiedene und angenehme künstlich bereitete Getränke aufsuche, endlich, daß man nicht bloß vom Übermaße im Weine sich hüte, sondern auch, wenn möglich, von zu vielem Wassertrinken.</p><p>6. Endlich im gewöhnlichen Sinne rücksichtlich der Unzucht und Wollust.</p><p>Die Enthaltsamkeit bezüglich der lasterhaften Begierlichkeit und Wollust besteht darin, daß man die Sinnlichkeit beherrscht, in die aufsteigenden Begierden nicht einwilligte den zur Wollust reizenden Gedanken sich nicht hingibt, daß man sich an der Vorstellung einer schändlichen Handlung nicht belustigt, den Willen des Fleisches nicht erfüllt, sondern die fleischlichen Lüste durch die Furcht Gottes bezähmt.</p><p>7. Der wahrhaft Enthaltsame.</p><p>Wahrhaft enthaltsam ist nämlich Derjenige, welcher nach jenen unsterblichen Gütern verlangend und mit unverwandtem Blicke des Geistes auf sie schauend diese (die irdische oder fleischliche) Begierde von sich weist, den Umgang mit dem weiblichen Geschlecht schon als den Schatten (einer sündhaften Lust) verabscheut, am Anblicke weiblicher Personen keine Freude findet, an Körpern kein Vergnügen hat, bei Schönheiten sich nicht aufhält. Ein Solcher ergötzt sich sogar selbst an den lieblichsten Lüsten nicht, wird durch Reden der Schmeichelei nicht verlockt, pflegt mit weiblichen Personen, besonders mit ausgelassenen, keinen Umgang und hält sich in Gesellschaften von Weibern nicht auf. Der wahrhaft männlich Gesinnte und Enthaltsame, der sich für jene unermeßliche Ruhe aufbewahrt, beherrscht sich bei jedem Gedanken und jeder Begierde aus Verlangen nach dem Bessern und aus Furcht vor der zukünftigen Welt.</p><h3>22. Von der Unenthaltsamkeit.</h3><p>Fast ganz nur Charakterschilderung eines Unenthaltsamen dem weiblichen Geschlechte gegenüber, zuerst positiv, was er liebt, dann negativ, was er flieht, daher drittens Erwähnung seines unglücklichen Zustands und Ermunterung zur Enthaltsamkeit.</p><p>1. Der Unmäßige und Unenthaltsame verfällt leicht in jede Ungebührlichkeit; der Unmäßige ist auch ein Liebhaber der Wollust. Der Unmäßige hat Freude an vielen und leeren Geschwätzen, ergötzt sich an müssigen Reden und witzigen Possen und findet seine Lust am reizenden Genusse von Speisen. Er ist ein gewaltiger Fresser und Säufer, läßt sich von jeder thörichten Lust entzünden, willigt in die unreinen Gedanken ein und wird durch die Wollust völlig zum Thoren. Er trachtet nach Ruhm und schwärmt in stolzen Einbildungen von Ehre, als hätte er dieselbe schon wirklich errungen. Sein Vergnügen ist der Umgang mit weiblichen Personen, mit Schönheiten trifft er gern zusammen, blühende Farben von Körpern machen ihn wie schwindlig, reizende Angesichter versetzen ihn in Entzücken, von Gefälligkeiten, (weiblicher Wesen) wird er bezaubert, fest hängt er an der Gesellschaft von Personen weiblichen Geschlechts und von Possenreissern. Seine Phantasie schwelgt an der Erinnerung der Schönheiten, die er gesehen, und das Andenken daran beherrscht ihn ganz. Er malt sich in Gedanken wieder die Gesichter der weiblichen Personen, das Betasten der Hände, die Umarmungen der Körper, die leidenschaftlichen Reden, das bezaubernde Lächeln, das verliebte Winken der Augen, den Schmuck der Kleider, die einschmeichelnden Gespräche, das Zusammenpressen der Lippen, das körperliche Lustgefühl, die anziehenden Geberden, die Stunden und Plätze der Zusammenkünfte und Alles, was immer zur Nahrung der Wollust dient. Diese Bilder malt sich der Wollüstling und Unenthaltsame in seinem Geist’ und seinen Gedanken.</p><p>2. Kommt einem solchen Menschen eine Schrift zu Gesicht, die über Eingezogenheit (Keuschheit) gelesen wird, so macht er ein finsteres Gesicht. Sieht er eine nützliche Versammlung von Vätern, so weicht er aus und will davon Nichts wissen. Bemerkt er die strenge Lebensweise von Vätern, so empfindet er Widerwillen dagegen. Hört er vom Fasten sprechen, so geräth er in Unruhe. An der Gesellschaft von Brüdern findet er kein Vergnügen; wird er aber eine weibliche Person gewahr, da heitert sich sein ganzes Wesen auf, da rennt er auf und ab, um ihr Dienste zu leisten; da ist er aufgelegt zum Singen, Scherzen, Lachen: Alles nur, um sich zu ergötzen und den nächsten besten Personen des weiblichen Geschlechts sich als einen artigen und unterhaltenden Mann zu zeigen. In den Zeiten der heiligen Ruhe aber ist er traurig und schwach.</p><p>3. So ist denn unglücklich und elend der Mensch, welcher nicht in jeder Hinsicht und Angelegenheit die Tugend der Enthaltsamkeit besitzt. Da wir nun, o Brüder, gehört haben, welche Früchte die Enthaltsamkeit mit sich bringe, und welche aus der Unenthaltsamkeit entstehen, so wollen wir daher von dieser fliehen und an jener festhalten. Groß ist nämlich die Belohnung der Enthaltsamkeit, und ihre Erhabenheit ist unendlich. Wahrhaft selig ist also Derjenige, welcher die Enthaltsamkeit sich zu eigen gemacht hat.</p><h3>Schlußbemerkung.</h3><p>Demüthige Selbstanklage. Ermahnung zum fortgesetzten Eifer im Guten.</p><p>1. Selig zu preisen ist, wer in jeder Tugend sich gleichmäßig ausbildet und in den Werken der Gerechtigkeit hervorzuleuchten sich bestrebt. Glückselig ist auch, wer nie im Verborgenen etwas Gott Mißfälliges begeht, sondern aller Wahrheit dient und alle seine Handlungen im Lichte verrichtet und niemals in einen Gedanken einwilligt, der Thörichtes (Böses) räth.</p><p>2. Was soll aber ich beginnen, der ich jede Tugend lobe und in keiner derselben wandle, sondern meine Jahre in allem Bösen verschleudert habe? Wahrlich an mir geht in Erfüllung, was geschrieben steht: „Ihr leget den Menschen unerträgliche Lasten auf und rührt sie mit keinem Finger an.“ Deßwegen ermahne ich die Liebe von euch allen, von Christus Gesegnete und Theilnehmer am Paradiese: bestrebt euch alle, eurem Heerführer Christus zu gefallen, auf daß Keiner aus euch als ein Gleichgiltiger oder Sorgloser verworfen werde! Soviel von euch durch die Gnade Christi an das Joch gespannt sind, habet darauf Acht, ja nicht die Gelüste des Fleisches zu erfüllen, damit wir nicht ohne Vertheidigung gefunden werden vor jenem schaudervollen Richterstuhle, bei dem Jedem wird vergolten werden, je nachdem er Gutes oder Böses gethan hat.</p><p>3. Wehe aber mir dann, denn ich werde dasteh’n ohne Zuversicht; was werd’ ich also in der Stunde der unvermeidlichen Noth anfangen? Selig sind Alle, die dann mit Vertrauen sich dem Richter darstellen und den heiligen Lohn von der Hand des Herrn in Empfang nehmen werden. Wehe aber Denjenigen, die um eines so geringfügigen und nichtswürdigen Dinges willen dann zu Schanden werden!</p><p>4. Was ich aber sagen will, ist Dieß. Wie kann sich einer vertheidigen, der wegen Ehrsucht oder Anmaßung oder Ungehorsam oder Widerspenstigkeit oder Schlemmerei oder Frechheit oder Geschwätzigkeit oder Übermuth oder Herrschsucht oder Prahlerei oder Neid, Streitsucht, Zornmüthigkeit oder Lästerung oder Verleumdung angeklagt wird? Welche Vertheidigung hat wohl Derjenige, welcher wegen dieser so geringfügigen Dinge angeklagt wird? Welcher Gewinn oder welche Wollust wird dir davon zu Theil? Welche Schwierigkeit ist es wohl, sich davor zu bewahren?</p><p>5. Darum red’ ich euch zu, o Brüder, daß ja Keiner von euch dieser Vergebungen wegen sich die Verdammung zuziehe. Ich weiß es wohl. daß ihr euch von den noch schwerern Sünden enthaltet; diese aber achtet Jeder, als wenn sie ganz unbedeutend wären, für Nichts, indem er wähnt, er werde darüber gar nicht zur Rechenschaft gezogen werden. Gerade dadurch bringt uns der Teufel in seine Gefangenschaft, indem er bewirkt, daß Jeder aus uns sie als völlig unbedeutend für Nichts achtet. Bestrebt euch aber eifrig, in diese Fehler nicht zu verfallen, sondern bewahrt euch mit aller Sorgfalt, damit ihr mit Christus verherrlicht werdet! Ihm sei Ehre von Ewigkeit zu Ewigkeit! Amen.</p><h2>3</h2><h3>Eingang.</h3><p>Diese sehr lehrreiche moralische Abhandlung findet sich im I. griech.-latein. Bande von S. 23 an bis 28. Wie man aus Nr. 13 abnehmen kann, ist sie wohl an einen Ordensmann und Freund geschrieben, der etwa einmal aus Sucht nach weltlicher Ehre Lust in sich verspürte, in der Welt sein Glück zu suchen. Lob der Demuth und warnende Charakteristik des Stolzes nebst dringender Aufforderung zum Streben nach Selbsterniedrigung bilden die zwei Hauptpunkte, unterstützt durch Anführung von ermunternden Beispielen der Demuth und abschreckenden Beispielen des Stolzes.</p><h3>Text</h3><p>1. Ohne die Demuth ist jede Tugendübung, alle Enthaltsamkeit, aller Gehorsam, alle Armuth und alle Gelehrsamkeit eitel. Wie nämlich die Demuth der Anfang und das Ende alles Guten ist, so ist der Hochmuth der Anfang und das Ende alles Bösen.</p><p>2. Dieser unreine Geist (des Hochmuths nämlich) ist gewandt und vielgestaltig; denn er ringt nach der Herrschaft über Alle und weiß Jedem gerade auf dem Wege, den er wandelt, einen Fallstrick zu legen. Den Weisen sucht er durch seine Weisheit zu fangen, den Starken durch die Stärke, den Reichen durch den Reichthum, den Wohlgebildeten durch die Schönheit, den Beredten durch seine Beredsamkeit, den mit einer schönen Stimme Begabten durch den Wohllaut seiner Stimme, den Künstler durch seine Kunstfertigkeit, den Gewandten durch seine Gewandtheit.</p><p>3. Auf ähnliche Weise versucht er auch ohne Unterlaß Diejenigen, welche sich dem geistlichen Leben widmen. Denjenigen, welcher der Welt entsagt hat, versucht er durch eben diese Entsagung, den Enthaltsamen durch die Enthaltsamkeit, den Ruhigen durch die Ruhe, den Dürftigen durch die Dürftigkeit, den Gelehrten durch die Gelehrsamkeit, den Gottesfürchtigen durch seine Gottesfurcht, den Einsichtsvollen durch die Einsicht. Die wahre Einsicht aber ist mit der Demuth innigst verbunden. So bemüht er (nämlich der Geist des Hochmuths) sich, sein Unkraut in die Herzen Aller zu säen.</p><p>4. Deßwegen hat der Herr, wohl kundig der Verderblichkeit dieser Leidenschaft (denn wo sie einmal eingewurzelt ist, macht sie den ganzen Menschen mit aller seiner Thätigkeit unnütz), uns ein Mittel in die Hände gegeben, den Stolz zu besiegen, die Demuth nämlich, indem er sagt: „Wenn ihr auch Alles gethan habt, was euch aufgetragen worden ist, so sagt: Wir sind unnütze Knechte.“</p><p>5. Warum ziehen wir uns also selbst Geringschätzung und Täuschung zu, da doch der Apostel sagt: „Wenn Jemand wähnt Etwas zu sein, da er Nichts ist, so betrügt er sich selbst. Ein Jeder prüfe daher sein Werk, und dann wird er an sich selbst Ruhm haben, aber nicht bei einem Andern.“ Warum täuschen wir uns also selbst, indem wir uns gegen einander erheben, als wären wir angesehen in den Augen der Welt, und die Geringern verachten? Wir finden ja, daß unser Herr lehrt: „Was bei den Menschen hoch angesehen ist, ist vor Gott verabscheuungswürdig.“</p><p>6. Allein vielleicht erheben wir uns Enthaltsame über die Schwächern? Da werden wir aber wieder vom Apostel zurechtgewiesen, der da spricht: „Nicht wer sich selbst empfiehlt, ist bewährt, sondern wen Gott empfiehlt.“ Oder rühmen wir uns etwa als Solche, die übermäßig im Dienste (der Religion oder Bruderliebe) sich abgemüht, gegenüber den in Ruhe dahin Lebenden, so finden wir, daß der Herr die Maria (Schwester des Lazarus) mehr gelobt und erklärt hat, daß sie den bessern Theil erwählt habe. Allein wir erheben uns vielleicht als Ruhige (in Beschaulichkeit Lebende) im Vergleiche zu Solchen, die sich eifrig im Dienste (thätigen Leben) abmühen? Da finden wir aber wieder, daß der Herr gelehrt und gesprochen hat: „Ich bin nicht gekommen, mich bedienen zu lassen, sondern zu dienen und mein Leben für Viele hinzugeben.“</p><p>7. Wir müssen demnach dem Hochmuth in jeder Hinsicht entsagen. Oder bilden wir uns vielleicht viel ein als Bewohner der Einöde und Sandwüsten? Doch die Beschaffenheit des Ortes wird uns zu Nichts frommen, wenn wir nicht in Demuth wandeln, indem der Apostel sagt, man solle nicht auf das Sichtbare schauen, sondern auf das Unsichtbare; denn das Sichtbare sei nur zeitweilig, das Unsichtbare ewig. Aber vielleicht sind wir aufgeblasen, weil wir in einer Zisterne oder Höhle uns’re Behausung haben? Dieß sind äussere Zeichen der Abtödtung und Sorglosigkeit gegen die irdischen Dinge. Was du dir also zur Beförderung der Tugend gewählt hast, soll dir nicht zum Falle in Übermuth gereichen. Sonst würdest du einem thörichten Schmied’ ähnlich, der das Handwerk nicht versteht und anstatt eines Stückes Eisens Holz im Feuer glühend machen wollte.</p><p>8. Es ist daher unumgänglich nothwendig, sich mit aller Kraft an der Demuth festzuhalten. Doch — du bist reich und bleibst dabei in den Schranken der Gerechtigkeit. Du hast aber noch nicht die Tugendgröße Abrahams erreicht, der sich Staub und Asche nannte. Vielleicht ist dir die Sorge über ein Volk anvertraut; allein auch Moses hatte die Sorge für ein Volk übernommen. Nachdem nämlich Gott Ägypten durch die Hand des Moses und Aaron geschlagen, das rothe Meer ausgetrocknet, Israel trockenen Fußes hindurchgeführt und es durch jene furchtbare Wüste geleitet hatte, so kamen sie nahe an die Grenze von Moab, und als die Moabiter diese Volksmenge erblickten, so sagten sie, wie da geschrieben steht, zu den Ältesten der Madianiter: „Nun wird dieses Volk Alle, die um uns her sich aufhalten, zu Grunde richten, wie ein Rind das Grün (Gras, Kräuter) vom Felde abweidet.“ Die Musterung der Volksmenge betrug nämlich, abgerechnet die Weiber, Kinder und Leviten, bloß an Männern von zwanzig Jahren und darüber, die alle kampffähige Israeliten waren, sechshundert und dreitausend fünfhundert und fünfzig. Von Diesen allen war Moses der Anführer. Zudem durfte er mit Gott auf das vertraulichste umgehen und hatte die Herrlichkeit des Herrn geschaut. Dennoch wurde er nicht hochmüthig und vernachlässigte die Demuth nicht. Daher gibt ihm auch die hl. Schrift das Zeugniß: „Moses war der sanftmüthigste unter allen Menschen auf Erden.“</p><p>9. Vielleicht bist du schön von Gestalt, ausgerüstet mit Stärke und etwa gar mit einer Krone geschmückt? Allein du bist nicht zur Größe des Königs David gelangt, der in demüthigem Sinne sagte: „Ich bin ein Wurm und nicht ein Mensch.“ Oder du besitzest Einsicht, Weisheit und Enthaltsamkeit? Du kommst aber darin doch nicht den drei Jünglingen und dem Propheten Daniel gleich, von denen dieser sagte: „Dein, o Herr, ist die Gerechtigkeit, unser hingegen die Beschämung, wie an diesem Tage;“ Jene aber beteten: „Mit zerknirschter Seele und dem Geiste der Verdemüthigung mögen wir angenommen werden.“ Wenn nun die Gerechten eine so große Demuth bewiesen, wie demüthig müssen erst wir Sünder sein! Übermuth und Hoffart sind nämlich eine Gesinnung des Fleisches; allein der Apostel sagt: „Wenn ihr nach dem Fleische lebet, so werdet ihr sterben; wenn ihr aber durch den Geist die Werke des Fleisches ertödtet, so werdet ihr leben.“ Es ist jedoch nicht möglich, über die Leidenschaften Herr zu werden, wenn man nicht in dieser Tugend (der Demuth) fest gegründet ist.</p><p>10. Hast du nicht gehört, wie Vieles der hl. Paulus für die Religion ausgestanden hat? Er schreibt ja in einem Briefe an die Korinther: „Ich habe viel mehr gearbeitet, habe viel mehr Schläg’ erlitten. Von den Juden hab’ ich fünfmal neununddreissig Streich’ erhalten, dreimal ward ich mit Ruthen gestrichen, einmal gesteinigt. Dreimal erlitt ich Schiffbruch und brachte Tag und Nacht auf der See zu. Ich machte sehr viele Reisen, war in Gefahren von Flüssen, in Gefahren von Räubern, in Gefahren von meinem Volk, Gefahren von den Heiden, Gefahren in der Stadt, Gefahren in der Wüste, Gefahren auf dem Meere, Gefahren unter falschen Brüdern, in Arbeit und Mühe, in oftmaligenNachtwachen, in Hunger und Durst, oft in Fasten, in Kälte und Blöße“ u.s.w. Können wir dem gegenüber auch nur den Mund aufthun? Und nun betrachtet die Tugend (der Demuth in ihm)! Nach so vielen Gefahren und so großen herrlichen Thaten sagte er demüthig gesinnt: „Brüder, ich denke von mir nicht, daß ich es (das Ziel) schon erreicht habe.“ Dieß aber sprach er aus, indem er die Selbsterhebung verbannte, da er wohl wußte, welches Strafgericht dieselbe Denjenigen zuziehe, welche sie lieben.</p><p>11. Was ist aber die Hoffart? Sich selbst erheben bedeutet ebenso viel, als Gott seine eigenen guten Werke vorwerfen, wie bei menschlichen Angelegenheiten, wenn Jemand seinem Nebenmenschen ein Geschenk gibt und sich deßwegen gegen ihn übermüthig beträgt, der ganze Werth desselben verloren geht und die Freundschaft mit dem Nächsten aufgelöst wird; daher auch ein solcher Mensch verabscheuungswürdig wird. Deßwegen lehrte auch unser Herr, besorgt für unser Heil, indem er uns von dieser verderblichen Leidenschaft fern halten wollte: „Wenn ihr auch alles euch Aufgetragene verrichtet habt, so saget dennoch: Wir sind unnütze Knechte!“ Wenn wir aber (das Aufgetragene) gar nicht einmal thun, so sind wir nicht einmal würdig, unnütze Knechte genannt zu werden: denn groß ist unser Herr, und groß und mächtig sind seine Geschenke.</p><p>12. Damit du aber lernest, daß uns der Herr nicht bloß demüthig zu reden gelehrt hat, sondern auch demüthig gesinnt zu sein, hat er uns durch die That selbst unterrichtet, indem er sich mit einem Tuche umgürtete und den Aposteln die Füße wusch. Darum sagt er auch: „Lernet von mir; denn ich bin sanft und demüthig, und ihr werdet für eure Seelen Ruhe finden.“ Wenn du aber die Leiden, welche deinem Sinne zuwider sind, so zu übertragen vermagst, als wären sie ganz nach deinem Sinne, dann wisse, daß du die vollkommne Höhe eines wahrhaft tugendhaften und demüthigen Mannes erreicht hast.</p><p>13. Mit Entsetzen jedoch hab’ ich in Erfahrung gebracht, wie du dich von einem täuschenden Gedanken einnehmen ließest, welcher dir unerlaubte Dinge vorspiegelt. Ich sage dir daher: Willst du wirklich dadurch dich einnehmen lassen? Wie Vielen hat diese eitle Einbildung nicht schon die Köpfe verrückt! Ich frage dich selbst: Wer bist du wohl? Welche Stufe (der Tugend) hast du erreicht? Bist du vielleicht ein Elias? Hast du gleich ihm Wunder gewirkt? Er hat nämlich durch sein Gebet den Himmel verschlossen, daß es drei Jahr’ und sechs Monate lang nicht regnete; hernach aber regnete um seines Gebetes willen der Himmel wieder. Ferner hat er durch sein Gebet dreimal Feuer vom Himmel herabgerufen. Oder besitzest du vielleicht allen Glauben? Nun wohl, so gib eine Probe davon! Laß Zeichen und Wunder schauen! Erwecke Todte durch dein Gebet! Öffne die Augen von Blinden! Treibe böse Geister aus! Reinige Aussätzige, heile Lahme! Wandle auf dem Meere wie auf trockenem Lande! Verwandle Wasser in Wein! Sättige vermittelst des Gebetes große Mengen mit fünf Broden und zwei Fischen! Denn es lügt nicht, der da sagte: „Wer an mich glaubt, wird die Werke, die ich thue, auch thun, ja er wird noch größere thun.“</p><p>14. Vielleicht aber wird Jemand so im Vorübergehen sagen: „Wenn also Jemand nicht jene Gott eigenen Werke thut, so hat er keine Hoffnung des Heils.“ Wir haben die Hoffnung des Heiles (der Seligkeit), wenn auch dergleichen Wunder durch uns nicht gewirkt werden, wofern wir nur uns’re eigne Schwäche und Kleingläubigkeit bekennen; denn der Schwache bedarf Mitleid und nicht Selbsterhebung. Wenn wir aber des Mitleids bedürfen, so bedürfen wir ebenso auch der Demuth, auf daß wir durch Demuth uns Barmherzigkeit vom Herrn erwerben. Es steht nämlich geschrieben: „Bei unsrer Demüthigung hat sich der Herr an uns erinnert und von unsern Feinden uns errettet.“ Und ferner: „Ich ward gedemüthigt, und er hat mich errettet.“ Wenn wir hingegen, auf windige Einbildungen uns stützend, hochmüthig werden, so thun wir nichts Anderes, als daß wir uns selbst in den Abgrund stürzen. Nimm daher die Krankheit des Hochmuths nicht auf, damit dir der Feind nicht urplötzlich die gesunde Vernunft raube.</p><p>15. Erwache also von der hochfahrenden Gesinnung der Selbstgefälligkeit! Lege nicht Netze an deine eignen Füße (d. i. sei nicht Sklave der Eigenliebe)! Reinige deinen Geist von diesem tödtlichen Gifte (des Stolzes) durch die Demuth! Belehren wird dich das Gleichniß von einem Menschen, der sein eignes Haus kehrt. Er bückt sich bis auf den Boden, und so säubert er es. Um wie viel sorgfältiger müssen wir uns bücken und erniedrigen, um die Seele zu reinigen und nichts Gott Mißfälliges in ihr zu lassen! Denn in einer demüthigen Seele wohnen der Vater und der Sohn und der Hl. Geist. Es steht ja geschrieben: „Welche Gemeinschaft hat die Gerechtigkeit mit der Gottlosigkeit, oder das Licht mit der Finsterniß? Welche Übereinstimmung ist zwischen Christus und Belial? Welchen Antheil hat der Gläubige mit dem Ungläubigen?“ Wie kann man den Tempel Gottes mit Götzen zusammenstellen? Wir sind nämlich ein Tempel des lebendigen Gottes, wie Gott selbst spricht: „Ich werde unter ihnen wohnen und wandeln, und ich werde ihr Gott sein, und sie werden mir Volk sein. Deßhalb geht weg aus ihrer Mitte und trennet euch, sagt der Herr, und rührt nichts Unreines an! Dann werd’ ich euch aufnehmen, und ich werde euer Vater sein, und ihr werdet mir Söhne und Töchter sein, spricht der Herr, der Allmächtige!“</p><p>16. Da wir nun solche Verheissungen haben, Geliebte, so sollen wir uns selbst von jeder Befleckung des Fleisches und Geistes reinigen und Heiligkeit in der Furcht Gottes zur Vollendung bringen. Wenn du also zum Kampfe von den Dingen dieses Lebens ausgezogen bist und dich den stürmischen Wogen des mühseligen Lebens entrissen hast, so kämpfe desto eifriger, mit dem unreinen Geiste des Hochmuths ja keine Gemeinschaft zu haben, damit der Herr dich aufnehme! Denn jeder Hochmüthige ist unrein vor dem Herrn. Erinnerst du dich nicht an jenes Feuer durch welches wir geh’n müssen? Wenn wir, nachdem wir durch dasselbe gegangen sind, rein und makellos gefunden werden, dann werden wir uns selbst erkennen, wie wir beschaffen sind; denn jener Tag wird das Werk eines Jeden offenbar machen, wie geschrieben steht: „Denn es wird im Feuer erprobt werden.“ Flehen wir daher zum Herrn mit großer Demuth, damit er uns vor dem Schrecken der Zukunft bewahre und uns jener Entrückung würdige, wann die Gerechten in Wolken, in die Luft dem Könige der Herrlichkeit entgegen dahingetragen, und wir mit den Sanft- und Demüthigen das Himmelreich erben werden, wie da geschrieben steht: „Selig sind die Armen im Geiste; denn ihrer ist das Himmelreich.“ Wehe aber den Stolzen und Hochmüthigen! Denn ihrer ist der Feuerofen!</p><p>17. Im Hochmuthe wohnt nämlich Derjenige, welcher da spricht: „Durch meine Kraft werd’ ich es vollbringen, durch die Weisheit des Verstandes will ich die Grenzen der Völker verrücken und ihre Kraft plündernd entreissen. Erschüttern werd’ ich bewohnte Städte und die ganze Erde mit meiner Hand wie eine Vögelbrut ergreifen und wie verlassene Eier wegnehmen. Niemanden gibt es, der mir entrinnen oder widersprechen wird. Gott der Heerschaaren wird aber über seine Ehre Ehrlosigkeit senden, und über seine Herrlichkeit wird verzehrend Feuer sich entzünden.“ Ferner steht geschrieben: „Du aber sagtest in deinem Sinne: In den Himmel will ich emporsteigen, über den Gestirnen des Himmels werd’ ich meinen Thron aufstellen, werde mich setzen auf dem hohen Berge, auf das erhabne Gebirg gegen Norden. Erheben will ich mich über die Wolken und gleich sein dem Allerhöchsten. Nun aber wirst du in die Hölle stürzen und hinab bis zu den Grundfesten der Erde.“</p><p>18. Fliehen wir daher die Hoffart, welche dem Herrn verhaßt ist! Lieben wir die Demuth, wodurch alle Gerechten dem Herrn wohlgefällig geworden sind! Ein großes Geschenk ist nämlich die Demuth, ein großer Ruhm, ein großer Gewinn und eine große Ehre für Diejenigen, welche sie besitzen; denn in ihr liegt eine Laufbahn ohne Anstoß und vollkommne Weisheit. Seines Hochmuths wegen wurde der Pharisäer erniedrigt, und der Demuth wegen der Zöllner erhöht. Mit diesem würdige uns der Herr der Erlangung des unverweslichen Antheils mit allen Gerechten! Ihm gebührt Verherrlichung in alle Ewigkeiten. Amen!</p><h2>4</h2><h3>Eingang.</h3><p>1. Die Belehrung aus Liebe und Gehorsam verfaßt.</p><p>Als der Herr zur Erlösung der Menschen auf der Welt wandelte, hat er uns das Gebot gegeben, einander zu lieben. Ein Werk der Liebe ist es aber auch, einander in der Furcht Gottes zu ermahnen. Weil also deine Gottseligkeit verlangt hat, von meiner Wenigkeit eine Belehrung zu vernehmen, so hab’ ich mich aus Gehorsam und mit dem Beistand der Gnade herbeigelassen (nämlich: deinem Verlangen zu entsprechen). Ich habe daher über diese Gegenstände (worüber du Unterricht wünschest) in dieser Denkschrift meine Belehrung niedergelegt.</p><p>2. Bescheidene Ermahnung, sie zu benutzen.</p><p>Triffst du etwas Brauchbares darin an, so nimm es zu Herzen, damit du dem Herrn Früchte bringest und auch ich auf diese Weise Belohnung für den guten Rath bekomme! Suche jedoch bei mir, der ich unter Ordensbrüdern lebe, die Redekunst nicht, die ich nicht gelernt habe, noch auch eine zierliche Schreibart, von der ich gar Nichts weiß, sondern nimm Dasjenige, was ich einfältig, wahr und kunstlos in Liebe dir geschrieben habe, auch mit Liebe auf und erweitere dir den kurzen Unterricht selbst! Du bist ja geschickter dazu als ich.</p><p>3. Der Unterricht selbst vom Leser zu erweitern und Andern mitzutheilen.</p><p>Du erhältst von mir gleichsam nur Samen und Stoff; diesen nimm auf und bringe so auf dem Felde deines Geistes reichliche Frucht hervor! Was ich nur mangelhaft und schwach dir angedeutet habe, das stelle du, mein lernbegierigster Freund, den bei dir Weilenden mit kräftigem Nachdrucke vor und rede ihnen zu, daß sie sich vor der Tiefe meiner Unwissenheit in Acht nehmen, da ich weder gewohnt bin, gelehrte Abhandlungen zu schreiben, noch auch geübt in der Redekunst. Die Liebe aber munterte mich auf, dir und allen deinen Mitbrüdern Anweisungen zu geben. Wie ich früher schon eifrig bestrebt war, auf dein Ansuchen Belehrungen über Tugend zu ertheilen, so habe ich auch jetzt mich bereitwillig gezeigt, mit der Gnade Gottes eine Vorschule wahren Unterrichts zu geben. Theile nun auch du mit eifriger Liebe sie den Andern nach der Gnade mit, die dir vom Herrn ertheilt ist, auf daß die Brüder nicht mehr von Täuschung hin und her getrieben werden!</p><h3>Erste Ermahnung. Von der Flucht böser Gesellschaften; Empfehlung der Keuschheit und Demuth; Charakter des Demüthigen.</h3><p>1. Vor einem bösen Rathe muß man sich in Acht nehmen. Wie nämlich zuweilen zwei prächtig Gekleidete zugleich auf dem Platze einherschreiten und einer davon aus Unachtsamkeit anstoßend in den Koth fällt und das glänzende Gewand ganz beschmutzt, dann aber aufgeregt von Neid auch den Nächsten in den Koth wirft, damit er nicht allein garstig aussehe: ebenso bestreben sich oft Diejenigen, welche von der Tugend abgefallen sind, auch die Übrigen zum Falle zu bringen, auf daß sie nicht allein in schändlicher Lebensweise sich befinden. Sie führen gar demüthige Reden und geben süße Antworten her, damit sie ihre folgsamen Schüler von der Eingezogenheit abwendig machen und in Sünden stürzen. Ohne Scheu verüben sie die Schlechtigkeiten und muntern den Nächsten dazu auf, indem sie sagen: „Warum verabscheust du uns? Verdammst du uns, weil wir Sünder sind? Thun Dieser und Jener, von denen man so viel hört, nicht auch das Nämliche? Weißt du nicht, daß diese ganze Geschichte nichts Anderes ist als Fallen und wieder Aufstehen?“ Solche Reden führen sie, ohne sich zu schämen.</p><p>2. Und warum? Weil einmal gefallen, wollen sie nicht mehr aufstehen, sondern gereichen auch Vielen zum Ärgernisse, Falle und Verderben, und der Teufel bedient sich ihrer eines Köders im Angelhacken. Zuweilen kommen sie so weit, daß sie sogar die heiligen Propheten lästern (als Träumer ausgeben), um schwankende Seelen anzulocken. O des verkehrten Herzens solcher Menschen! O des Mundes voll Bosheit und Arglist! O Kehle, offenes Grab, das die Hineinfallenden auf der Stelle zu Grunde richtet! Mit Recht werden sie schmählichen Gelüsten preisgegeben, weil sie die Kenntniß Gottes verworfen haben. Darum werden sie auch wegen der Menge ihrer Gottlosigkeiten von Gott verstoßen werden, weil sie weder Gott fürchteten noch die Gottesfurcht der Christen achteten, indem sie die Seelen junger Leute berückten.</p><p>3. Hüte dich deßhalb, o Lieber, vor ihnen, damit sie dich nicht durch, ihre weichlichen Reden entzünden (zu böser Lust)! Fliehe das Zusammentreffen mit ihnen, damit du nicht bitterer als Galle werdest und in ein zweischneidiges Schwert fallest, nach der Ermahnung Salomons. Sonst bemüht sich doch Jeder, welchem am Wohle des Nebenmenschen etwas gelegen ist, wenn er ihn straucheln und fallen sieht, ihm wieder aufzuhelfen, und wenn er aufgestanden ist, hält er ihn kräftig aufrecht, damit er nicht mehr falle. Diese jedoch, als Verderber, bieten alle ihre Kräfte auf, um die Stehenden niederzuwerfen, die Gefallenen aber, die schon zu Boden liegen, morden sie durch Verzweiflung, anstatt zu sagen: „Geliebter, hab’Acht auf dich selbst! Nichts übertrifft die Gottesfurcht. Nichts ist schätzbarer als ein tugendhaftes Leben. Du hast gesündigt; fahre nicht fort, sondern bitte wegen deiner vorigen Sünden um Verzeihung!“</p><p>4. Noch sind wir bei einander, allein nach kurzer Zeit werden wir von einander getrennt. Haben wir dem Nächsten Schaden zugefügt, so wird er seufzend uns die Schuld geben, sprechend: „Das Zusammentreffen mit diesem Menschen hat mir Schaden gebracht. Hätte ich ihn doch nie kennen gelernt! Er hat nämlich meiner Seele Ärgerniß gegeben. Wie viel Unheile hat mir die Verbindung mit ihm gebracht!“ Haben wir hingegen dem Nebenmenschen zum Guten genutzt, so wird er auch unser gedenken und sagen: „Hilf, o Herr, diesem Bruder, wie er mir geholfen hat, um deines Namens willen! Er hat meine Seele bestärkt in deiner Furcht, und als ich in Gefahr war zu Grunde zu gehen, hat er mich durch deine Gnade gerettet.“</p><p>5. Jene (oben erwähnten) Verführer haben aber die gerade entgegengesetzte Gesinnung und betrügen die Seelen; denn sie thun Dieß nicht bloß selbst, sondern sie geben auch Andern, die es so machen, ihre Zustimmung. Allein wenn sie wieder Jemanden von einer schändlichen Handlung sich enthalten sehen, so führen sie eine Masse sinnloser Vorwände auf und sagen z. B. „Der da hat ein kaltes Temperament“ (und enthält sich nur deßwegen). Sie werden jedoch auch in dieser Hinsicht überwiesen, daß sie es nicht mit gutem Grunde sagen; denn wenn der Andere sich bloß deßwegen (wegen des weniger feurigen Temperamentes) enthalten würde, so hätte der Apostel nicht sagen sollen: „Wer da kämpft, enthält sich von Allem,“ sondern er hätte sagen müssen: «Jeder, der kämpft und ein hitziges Temperament hat, enthält sich von Allem.„ Wenn also (nach dem Vorgeben dieser Betrüger) nur die Einen (mit hitzigem Naturell) Enthaltsamkeit nöthig haben, die Andern (mit kälterem Temperament) aber nicht, wer von Denjenigen, welche den Herrn lieben, wird nicht eine so thörichte Meinung tadeln? Denn welchen Menschen, seien es männliche oder weibliche Personen, bekriegt und bedrängt der Widersacher nicht (ohne Rücksicht auf das Temperament)?</p><p>6. Die Enthaltsamkeit ist daher nothwendig, nur daß sie mit frommer Gesinnung verbunden sein muß. Seien wir deßwegen auf uns’rer Hut, daß wir uns ja nicht, weder in diesem Leben noch nach dem Ende desselben, eine furchtbare Verdammung zuziehen! Wer heute noch wohlgestaltet ist, kann morgen mißgestaltet aussehen; denn dieser unser Körper unterliegt großer Gebrechlichkeit. Die nach einem tugendhaften Leben Verlangen tragen, werden also nicht bloß in ihrem blühenden Alter deßhalb gelobt werden, daß sie die Enthaltsamkeit sich erwählt haben, sondern sie werden deßwegen auch im Greisenalter hoch bewundert werden; denn eine schöne Saat ergötzt Jene, welche sie sehen, nicht bloß wenn sie auf dem Felde emporsproßt, sondern sie erfreut auch, wenn die Felder schon weiß zur Ernte sind und die Ähren sich gebeugt zur Erde neigen, gar sehr Diejenigen, welche sie anschauen. Das größte Gut ist dem zu Folge ein tugendhaftes Leben. Hab’ also Acht, daß du ja nicht von wollüstigen Menschen dahingerissen wirst, welche durch allerlei ausschweifende Handlungen ihre Leiber beflecken, nach den Worten dessen, der da sagt: “Was heimlich von ihnen verübt wird, ist schon abscheulich auszusprechen.„</p><p>7. Allein auch der Verfasser der Sprüchwörter tadelt die lasterhafte Lebensweise, indem er sagt: “So ist auch der Weg (das Betragen) eines ehebrecherischen Weibes, welches nach begangener Lasterthat sich den Mund abwischt und sagt, sie habe nichts Böses gethan.„ Ebenso sind auch Diese, durch die sündhafte Gewohnheit dahingerissen, über ihre schändlichsten Handlungen so gleichgiltig, als hätten sie gar nichts Böses verübt. Ihr ganzes Streben ist auf teuflische Fleischeslust gerichtet, und daher setzen sie sogar die hl. Schrift in die Reihe lächerlicher Albernheiten und spotten darüber; “ihre Verdammung aber ist gerecht,„ Diese halten sich gern in Schenken auf und trinken bis zur Berauschung Wein; daher ist auch die Gottseligkeit und Enthaltsamkeit bei ihnen verabscheut. Ja, Solche sind noch viel unverschämter als die Verworfensten unter dem Pöbel.</p><p>8. Es ist in Wahrheit kläglich und bejammernswürdig, daß wir die glänzende und herrliche Tugend zu so großer Erniedrigung herabgezogen haben; allein Gott, der groß und menschenfreundlich ist, reich an Erbarmen und mächtig in Thaten, möge uns’re Schwäche unterstützen und den Satan unter uns’re Füße treten und uns Kraft und geistiges Verständniß geben, auf daß wir die uns noch übrige Lebenszeit in Wahrheit zubringen und vor ihm Gnade finden an jenem großen und schrecklichen Tage des Gerichts! Ihm gebührt Lobpreisung und Herrschaft und Macht von Geschlecht zu Geschlecht in alle Ewigkeiten. Amen!</p><p>9. Sei daher klug wie eine Schlange und arglos wie eine Taube! Du hältst dich ja mitten unter Wölfen auf. Nimm zu Herzen, was ich sage, Geliebter! Fürchte dich nicht, für Christus zu sterben, wenn auch Erwürgung oder das Schwert dich bedroht; und wenn sie dich auch in einen Kerker werfen oder in den Strom eines Flusses oder in den Abgrund des Meeres, gib nie aus Menschenfurcht die Enthaltsamkeit Preis, da du doch bald wieder in Staub aufgelöst werden wirst! Verachte Gottes Gebot nicht! Wenn auch Keine gegenwärtig sind, die dich zurechtweisen, so bleibt doch Gott dem Herrn Nichts verborgen, der den Abel gerächt hat. Magst du also in einer Genossenschaft oder Wüste leben, verachte die Keuschheit und Enthaltsamkeit nie; denn der Herr sagt: “Seid heilig, wie ich heilig bin.„ und: «Wer sich selbst erniedrigt, wird erhöht werden.“</p><p>10. Demüthig aber (wahrhaft) ist Derjenige, der die Tugend durch die That predigt. Wer also daran (an Werke der Demuth) sich hält, ist wirklich demüthig nach dem Willen des Herrn. Ich will jedoch noch etwas Weniges über diese Tugend beifügen, auf daß du dadurch zum Theil ihre Macht vermöge der Gnade Christi erkennest. Der Demüthige strebt nicht nach eitlem Ruhme und beträgt sich nicht hochmüthig in Bezug auf den Dienst des Herrn. Der Demüthige stellt nicht widersprechend seinen eignen Willen der Wahrheit entgegen, sondern gehorcht der Wahrheit. Der Demüthige ist nicht eifersüchtig auf den Fortschritt des Nebenmenschen, noch erfreut er sich über einen, der gestürzt ist, sondern er freut sich vielmehr mit den Freudigen und weint mit den Weinenden. Der Demüthige wird durch Mangel und Noth nicht niedergeschlagen, sowie im Glück und Ruhm nicht hoffärtig, sondern er bleibt beständig in der gleichen tugendhaften Gemüthsstimmung.</p><p>11. Der Demüthige verleumdet nicht einen Bruder beim andern, was eine satanische Bosheit ist, sondern er ist ein Friedensstifter und vergilt nicht Böses mit Bösem. Der Demüthige schätzt nicht bloß Jene hoch, die größer sind als er, sondern auch die Geringern. Der Demüthige trachtet mit aller Kraft nach Gottseligkeit. Er läßt sich nicht vom Zorne dahinreissen, beleidigt nicht, lärmt nicht schreiend, sondern alles (ihm etwa zugefügte Unrecht) achtet er aus Gottesfurcht gering. Der Demüthige beträgt sich nicht boshaft und gibt sich nicht der Trägheit bin, sollte er auch um Mitternacht zu irgend einer Arbeit gerufen werden; denn er hat sich einmal dem Gehorsam gegen die Gebote des Herrn geweiht. Der Demüthige weiß Nichts von Bitterkeit und Falschheit, sondern in Einfalt und Arglosigkeit dient er dem Herrn in Heiligkeit und Frieden und geistlicher Freude.</p><p>12. Der Demüthige berauscht sich nicht mit Wein und ergibt sich nicht der Unmäßigkeit im Essen, indem er das Gebot des Herrn fürchtet. Wenn er ein Schimpfwort hört, so murrt er nicht; empfängt er auch einen Backenstreich, so wird er nicht ungehalten darüber; denn er ist ein Jünger Desjenigen, welcher sogar das Kreuz für uns erduldete. Der Demüthige haßt die Eigenliebe; daher trachtet er auch nicht nach dem ersten Platze, sondern sieht sich nur als einen gemeinen Reisenden in einem Schiffe in diesem Leben an. Er hört gern geistliche Reden an und wendet seinen Geist nicht ab von den Geboten des Allerhöchsten; denn um der Hoffnung auf unsern Herrn Jesus Christus willen hat er sich wahrhaft selbst verläugnet. Solche sind selig, weil der Herr zu ihnen sagen wird: „Ich werde euch nicht mehr Knechte nennen, sondern Freunde und Brüder.“ Ihm sei Ehre in alle Ewigkeiten. Amen!</p><h3>Zweite Ermahnung. Von dem Kampfe gegen das Böse, besonders gegen die bösen Gedanken; die traurige Sklaverei des Lasters; vomVertrauen auf Gott; Aufmunterung zu früher rechtzeitiger Buße.</h3><p>1. Was du mir in Bezug auf die den Geist beunruhigenden Gedanken klagtest, ist mir nicht unbekannt; denn auch ich selbst habe mit dem nämlichen Leiden zu kämpfen und verhehle meine Schwachheit gar nicht. Wir müssen daher unablässig beten, daß uns der Herr von den Nachstellungen der bösen Geister errette. Sie bedrängen uns nämlich nicht bloß, wenn wir in der Ruhe und Einsamkeit uns befinden, sondern auch wenn wir im Hause des Herrn uns versammeln, setzen sie uns heftig zu. Sie reizen uns sogar zu schändlichen und unehrbaren Blicken auf die Körper männlicher Personen; ja der Drache (der böse Feind, die alte Schlange) stellt uns selbst Bilder des abscheulichsten Lasters in der Phantasie vor. Er bringt ein Wirrwar von Gedanken in die Einbildungskraft des Bruders, um ihn zu zerstreuen, daß er nicht mit reinem Geiste auf die unbefleckten Geheimnisse unsers göttlichen Erlösers Acht geben kann.</p><p>2. Der Enthaltsame wird jedoch durch Bewachung der Augen und Aufmerksamkeit des Geistes unter Mitwirkung der göttlichen Gnade überwinden. Man muß daher sein Herz und die Sinne mit aller Wachsamkeit bewahren; denn wir befinden uns in diesem Leben in einem großen Kriege, und der Widersacher tobt rasend; allein man darf dem Kampfe sich nicht entziehen. Wir sollen vielmehr seine phantastischen Bilder besiegen und ihn (vor Grimm) zerbersten lassen; denn der Herr weiß, wie viele Brandmale unser Dränger durch die Gedanken unsern Herzen aufdrückt. Der Herr sieht nämlich nicht wie ein Mensch; „denn der Mensch sieht nur das Äusserliche, Gott aber sieht in das Herz.“</p><p>3. Der Faustkämpfer Sache ist es, keinen Faustschlag zuzulassen: allein wer mit den Leidenschaften im Frieden lebt, wie wird der gegen sie Krieg führen? Er hat sich ja schon zum Sklaven der Lüste gemacht und zahlt mit aller Bereitwilligkeit dem Tyrannen Tribut. Nur wo Feindschaft ist, da herrscht auch Krieg, und wo Krieg stattfindet, dort zeigt sich auch Kampf, und wo Kampf vor sich geht, warten auch Siegerkränze. Wenn also irgend Jemand von der bittern Sklaverei befreit werden will, so muß er Krieg gegen den Teufel anfangen. Durch Siege, die sie in diesem Krieg errangen, haben sich die Heiligen der himmlischen Güter würdig gemacht.</p><p>4. Vielleicht aber wird Jemand im Vorübergehen den Einwurf machen: „Wenn denn, wo Feindschaft gegen die Leidenschaften obwaltet, auch Krieg zu entstehen pflegt, wie geht es dann zu, daß wir die Wollüstlinge heftig von verderblichen Leidenschaften angefochten sehen, ohne daß sie dadurch sich zur Buße bewegen lassen?“ Allein, mein lieber Freund, ich glaube nicht, daß dieser Krieg für die Tugend und aus Widersetzlichkeit gegen den Tyrannen stattfinde, sondern ein mit der Knechtschaft unter den Leidenschaften und mit der Wollust zusammenhängendes Leiden sei. Daher können sie sich auch nicht entschließen, von dem Feinde sich loszureissen. Die nämlich wirklich im Kriege mit einander begriffen sind, haben durchaus keine Gemeinschaft oder Verbindung mit einander, wie auch der Philister zum Saul sagte: „Gebt mir einen Mann, auf daß wir allein mit einander kämpfen! Erlegt er mich, so wollen wir eure Sklaven sein; erlege aber ich ihn, so sollet ihr uns dienstbar werden.“ Da nun jene Wüstlinge sich schon zu Sklaven der Willkür des Widersachers und der Lüste gemacht haben, wie kann ihre Lage ein Krieg genannt werden?</p><p>5. Bekriegen sie ihre Leidenschaften auch wirklich, so thun sie Dieß nicht aus dem Streben nach Tugend, sondern natürlich im Gefühle der hilflosen Lage, worin sie der Bund mit dem Laster versetzt hat. Darum werfen sich auch Diejenigen, welche sich ganz solchen Leidenschaften ergeben, völlig weg, erniedrigen sich zu sündhaften Gefälligkeiten und Diensten, um den Willen ihres Verführers zu vollziehen. Daher ist es ihnen, wenn sie eine Gelegenheit zum Bösen finden, völlig unmöglich, die Sache ruhig zu beurtheilen oder sich zu enthalten oder das Böse zu unterlassen.</p><p>6. So verhält sich aber die Sache nicht mit dem Krieg und Kampfe der Heiligen; denn Diese widersetzen sich, wenn sie bekriegt werden, den Angriffen und enthalten sich im Feuer (der Versuchungen) und harren in der Bedrängniß aus und wenden sich um der Furcht Gottes willen ab, wenn ihnen der (verführerische) Gegenstand auch nahe ist. Jene hingegen werden angefochten, nicht, als ob sie eine dem Tyrannen entgegengesetzte Gesinnung hätten, sondern, damit sie die gewöhnlichen Tribute bezahlen und die Dienstleistungen der bösen Begierden nicht versagen: von wem nämlich Jemand überwunden worden ist, Dem ist er auch als Sklave unterworfen.</p><p>7. Wenn sonst ein Wettkämpfer niedergeworfen wird, so steht er sogleich wieder auf. Die nämlich von Barbaren gefangen gehalten werden oder in die Gewalt eines Tyrannen fallen, freuen sich nicht alle über die Sklaverei bei Denjenigen, in deren Gefangenschaft sie gerathen sind, sondern nur Jene, welche sich entschließen, mit ihnen die Reisenden auszurauben und umzubringen. Diese allein bleiben mit Freuden bei ihnen, werden deßwegen von Fesseln und Kerker frei, sind jedoch Sklaven der Leidenschaften; daher kämpfen sie auch für die Barbaren und werden zu Spionen gegen ihre Landsleute gebraucht, weil ihre lasterhafte Denkart sie an die Barbaren fesselt. Die sich hingegen über die Plünderung und Verwüstung bei ihren Landsleuten und über ihr eigenes Elend betrüben, suchen so schnell als möglich zu entfliehen, weil ihnen das zuchtlose Leben unerträglich ist, und sie lauern beständig auf eine Gelegenheit, die Freiheit wieder zu erlangen, welche sie vorher genossen haben, und sie empfinden gar keine Zuneigung zu ihren Gegnern. Darum zeigen sie sich auch, wenn sie aus ihrer Hand errettet sind, als Widersacher der Gottlosen und werden wieder Vertheidiger der Gottseligkeit.</p><p>8. Es gibt demnach eine Zeit der Buße. Die also von jener Schmach (der Lüste) los werden und Befreiung von der harten Sklaverei erlangen wollen, müssen sich dem Willen des Tyrannen widersetzen und ihn durch Liebe des Schöpfers bekriegen. Dann werden sie selbst Erfahrung vom tugendhaften Kampfe gewinnen, werden selbst den herabrinnenden Schweiß für die Tugend vergießen, wenn sie nicht bloß mit den Lippen, sondern aus ganzem Herzen sagen: „Wisse, o Teufel, daß wir deine Stimme nie hören und deinen Lüsten niemals fröhnen werden!“ Man muß in diesem Kampfe aber auch flehentliche Stimmen zu Gott hinauf schicken mit Denjenigen, welche sagen: „Es werden nicht zu Schanden, die auf dich ihr Vertrauen setzen. Und nun folgen wir dir aus ganzem Herzen und fürchten dich und suchen dein Angesicht. Laß uns nicht zu Schanden werden, sondern verfahre mit uns nach deiner Güte und nach der Größe deiner Barmherzigkeit! Errette uns gemäß deiner Wunderthaten und verherrliche deinen Namen, o Herr, und beschämt werden sollen Alle, die deinen Dienern Böses zufügen, und zu Schanden werde alle ihre Macht und zermalmt ihre Kraft, und sie sollen erkennen, daß du allein, o Herr, Gott bist und hochherrlich auf der ganzen Erde.“</p><p>9. Mag der Tyrann auch mit der höchsten Wuth den Feuerofen der Wollüste siebenmal glühender machen, so sollen die auf den Herrn Vertrauenden unerschrocken hoffen, daß der Feuerofen in kurzer Zeit in Thau werde verwandelt werden, und der vorher von ihnen gefürchtete Tyrann wird hernach vor ihrem Schatten zittern wegen des Beistandes, der ihnen von oben herab zugekommen ist. Selig sind daher Diejenigen, welche die Heiligung in Demuth und Milde bewahren; denn ihre Glieder werden einen tiefen Frieden genießen, indem sich ihre Seele im hl. Geist erfreut. Niemand aber hege das Vertrauen, Ruhe zu finden, wenn er sich dem Willen des Widersachers gehorsam erzeigt; denn der Tyrann behandelt Solche wie Kriegsgefangene, indem er sie zu jedem Werke der Gottlosigkeit dahinreißt und ihre Leiber durch sodomitische Schandthaten verderbt und schändlich befleckt. Weil sie, erkärt er, nie mit weiblichen Personen zu thun gehabt hätten, so verdienten sie den Ruhm der Jungfräulichkeit, ob sie gleich am ganzen Körper befleckt sind. Ja, der Widersacher sucht sie soweit zu bringen, daß sie sich trotzdem brüsten, als wären sie von jeder Sünde frei, ungeachtet er sie mit herben Beeren und bittern Gifttrauben anfüllt. O wie schrecklich ist dieser Krieg! O wie schwierig! Auf wie vielfache Arten verleitet dieser erzböse Jäger uns Menschen, den Herrn zu erzürnen!</p><p>10. Selig sind Diejenigen, welche nicht in sein Netz fallen oder, wenn sie schon hineingerathen sind, seine Netze zerreissen und sich daraus flüchten wie ein Fisch, welcher sich aus dem Ziehgarne rettet. Wenn nämlich ein Fisch, der sich im Wasser befindet, gefangen wird, aber das Netz zerbeißt und in die Tiefe hinabschießt, so entkommt er gerettet; ist er aber einmal schon auf’s trockne Land gezogen, kann er sich nicht mehr helfen. Ebenso haben auch wir, solange wir in diesem Leben uns befinden, Gewalt von Gott, den Banden der Willkür des Feindes uns zu entreissen und die Bürde der Sünden durch die Reue abzuwerfen und in das Himmelreich uns zu retten: allein wenn uns jener furchtbare Befehl trifft und die Seele aus dem Leibe gefahren und der Leib in das Grab gelegt worden ist, so vermögen wir uns nicht mehr zu helfen, wie auch der Fisch, welcher aus dem Wasser emporgezogen und in ein Behältniß eingeschlossen worden ist, sich nicht mehr helfen kann.</p><p>11. Bestreben wir uns daher, Geliebte, den Schlingen des Feindes durch gute Werke zu entgeh’n, bevor jener große und erhabene Tag kommt, an welchem Alles offenbar wird, was immer wir heimlich und im Dunkel begangen haben. Warten wir daher nicht, bis der Tod kommt, damit wir nicht zu Schanden werden bei der Auferstehung der Todten, wann die Heiligen mit dem glänzenden Gewande bekleidet werden, welches sie sich durch gute Werke bereitet haben! Wenn wir uns dann nicht bloß von der wie Blitze strahlenden Herrlichkeit entblößt, sondern auch verfinstert und voll Gestankes sehen würden, welche Beschämung würde uns da wohl ergreifen! Verachten wir doch das Werk böser Begierlichkeit, achten wir sie für Nichts, überwinden wir dieß Verächtliche um der Gottseligkeit willen, und lassen wir uns im Geringsten nicht unbewährt finden! Ein großer Schiffbruch ist das Begehen einer Sünde; ringen wir daher wie in einem Wettkampfe, in eine so große Gefahr nicht zu gerathen!</p><p>12. Wir werden nämlich durch uns’re eigene Sorglosigkeit von den Leidenschaften unterjocht, indem wir ohne Mühe dahinleben wollen und in uns selbst unzeitige Vorwände (zur Beschönigung der Leidenschaften) ersinnen. Einer z. B. sagt: „Ich wohne von Kindheit an im Kloster, und deßwegen setzen mir die Leidenschaften so heftig zu.“ Ein Solcher aber soll hören: Viele von den Heiligen haben von zarter Jugend auf den schönen Kampf gekämpft und die Lüste mit Füßen getreten. Ein Anderer dagegen sagt: „Ich bin in der Welt aufgewachsen und habe viel Böses durch Erfahrung kennen gelernt; daher drängt mich die Gewohnheit zu den Begierden.“ Allein Dieser höre: Viele der Heiligen führten einst auch das allerschlechteste Leben, bekehrten sich aber endlich und wurden Gott im höchsten Grade wohlgefällig. Sie gehorchten nämlich von Herzen Dem, der da spricht: „Sei nicht eifersüchtig auf Bösewichter und beneide die Übelthäter nicht! Denn sie werden schnell wie Heu vertrocknen und wie grünend Kraut bald (verdorrt) abfallen.“ Der Böse (Satan) bezaubert uns, indem er zu allem Schädlichen aufregt, um uns zur Verachtung der Furcht des Herrn zu verleiten. Wir aber sollen mit desto stärkerer Geistesanstrengung sein Gift von uns abwehren mit dem Beistande unsers Herrn Jesu Christi, dem da Ehre sei und Macht in alle Ewigkeiten. Amen.</p><h3>Dritte Ermahnung. Von der Betrachtung. Eitelkeit des weltlichen Ruhms; von dem wahren Ruhme. Ermunterung zur Buße. Finsterniß und Licht. Von den Drangsalen dieses Lebens. Über die Standhaftigkeit in dem Berufe. Worin das wahre Mitleid bestehe. Warnung vor Zerstreuung. Ermahnung zur Demuth. Von der Eitelkeit der Welt.</h3><p>1. Einer von den Heiligen sagte: „Trachte sorgfältig nach guten Dingen, damit du nicht nach schlechten trachtest; denn der Geist hält es nicht aus, unthätig zu bleiben.“ Beschäftigen wir daher unsern Geist mit der Betrachtung von Aussprüchen Gottes, mit Gebet und guten Gedanken; denn das Nachsinnen über unnütze Dinge bringt auch unnütze Werke hervor. Nachdenken aber über Gutes gibt eine gute Frucht.</p><p>2. Tragen wir auch Dieß im Geiste, daß viele Herrscher Länder und Festungen im Besitze hatten; ihr Ruhm aber erlosch, und sie wurden, als wenn sie gar nie da gewesen wären. Wie viele Könige herrschten über eine Menge Völker, errichteten sich Bilder und Denksäulen, in der Meinung, dadurch nach dem Hinscheiden aus dem Leben ihre Namen zu verewigen! Allein es kamen Andere nach ihnen, zerstörten die Bilder und zertrümmerten die Säulen, ließen die Abbildungen wegnehmen und stellten ihre eigenen Porträte dafür auf; doch auch die Werke Dieser werden von Andern wieder zu Grunde gerichtet werden. Andere aber erbauten sich prächtige Grabmäler, indem sie sich dadurch einen ewigen Namen festzugründen einbildeten, da sie in der Grabschrift ihren Charakter darstellen ließen. Es kamen jedoch andere Geschlechter; der Ort kam unter die Herrschaft Anderer. Diese wollten natürlicher Weise da den Schutthaufen wegräumen und führten ihre Gebeine wie Kalksteine weg. Was nützte ihnen dann die kostbare aufgehäufte Pracht oder eine Pyramide? Alle diese Werke thörichter Eitelkeit also lösen sich in Nichts auf.</p><p>3. Die aber in Hinsicht auf Gott reich und vor (in) ihm verherrlicht sind, haben nicht ein solches Loos; denn sie haben sich das ewige Leben und eine unzerstörbare Herrlichkeit bereitet. Gleichwie nämlich das Licht der Sonne und des Mondes und Sternenchors bis jetzt weder verfinstert noch in Veraltung umgewandelt worden ist von ihrer Erschaffung an bis nun (denn jedes Geschlecht aus Fleisch und Blut wird gleich dem reifen Getreide zu seiner Zeit geerntet und eingesammelt, das Licht der Sonne und des Mondes und der Gestirne aber bleibt immerfort jung und blühend und heiter nach der Anordnung des Schöpfers, die er ihnen bestimmt hat zu herrschen über Tag und Nacht), ebenso hat er auch Denjenigen, die ihn lieben, das himmlische Reich und eine unverwüstliche Freude vorherbestimmt, und wie er in Jenem ohne Lüge ist, so ist er auch in Diesem (was die Gerechten betrifft) wahrhaft. Jene (d. i. die Himmelskörper) werden vergehen, wann der Schöpfer will; allein die Glorie der Heiligen dauert ohne Ende fort.</p><p>4. Bestreben wir uns daher, eifrig Früchte der Buße zu bringen, damit wir von jener Freude nicht ausgeschlossen und verbannt werden in jenes dunkle und düstere Land, in das Land ewiger Finsterniß. Geh’ einmal, wenn es dir gefällt, in dein Schlafgemach und verschließ’ die Thüre, verstopfe auch Alles, wodurch Licht hineinschimmern könnte, und bleibe darin sitzen! Dann wirst du sehen, wie traurig es schon in dieser Finsterniß ist, wo du doch ohne Schmerz und Qual sitzest, weil es in deiner Macht liegt, wann du öffnen und herausgehen willst. Wie schmerzlich, denkst du nun, muß es erst in jener äussern Finsterniß sein, wo Heulen und Zähneknirschen ist!</p><p>5. Betrachte inwendig die Rauchfänge deines Herdes und erhebe dann die Augen zum Aufgange der Sonne und betrachte den Unterschied und fliehe die Werke der Finsterniß! Die Bosheit ist Finsterniß, die Tugend aber Licht. Die Bosheit macht, wenn man ihr nachforscht, Diejenigen schwarz, welche sie begehen; die Tugend hingegen verleiht, wenn man sich ernstlich darin übt, ihren Verehrern einen herrlichen Lichtglanz.</p><p>6. Glaube ja nicht, Geliebter, daß du ganz allein mehr bedrängt werdest als alle Andern! Denn „jeder Kopf fühlt Schmerzen und jedes Herz Betrübniß.“ Wie es unmöglich ist, daß irgend Jemand, der sich auf der Erde befindet, dieser Luft entgehe, ebenso ist es für den Menschen, der da lebt, unmöglich, von Bedrängnissen und Leiden nicht geprüft zu werden. Die sich mit den zeitlichen Dingen abmühen, werden dadurch bedrängt werden; die aber den geistigen Angelegenheiten nachtrachten, haben geistige Leiden zu ertragen. Diese werden jedoch selig sein; denn ihre Frucht ist reich im Herrn.</p><p>7. Halte in dem Werke, wozu du berufen bist, mit vollkommener Beharrlichkeit aus! Befestige die Anker und Seile wohl, damit dein Schilflein nicht sobald in’s offne Meer hinaus verschlagen werde und dann die Erfahrung dich belehre, welchen Frieden du genossen habest, solang du dich im Hafen aufhieltest! Die Welt ist unter dem Bilde des Meers dargestellt, das ascetische Leben aber unter dem Gleichnisse des Hafens. Sei kein Liebhaber des Herumschweifens, sondern erwirb dir vielmehr durch Ausdauer Gewinnste, anstatt in der Fremde Ärgernisse zu sehen! Ja, ich sage auch Dieses noch: Wenn wir auch die ganze Welt durchzogen haben, wartet zuletzt auf uns nicht dennoch nur die Zelle, wenn wir anders selig werden wollen? Können wir weder in einer Genossenschaft aushalten noch in einer Einöde Ruhe finden, wo werden wir uns dann noch niederlassen können? Das heißt ebenso viel als sagen: Ich kann weder die Sonnenhitze ertragen noch den Schatten aushalten. Wo werden wir uns also hinstellen? Ich fürchte daher, es möchte jener Feuerofen (die Hölle) uns aufnehmen.</p><p>8. Seien wir daber nicht nachlässig, und lieben wir nicht den Abscheu vor Anstrengung! Wenn wir Gebundene unsers göttlichen Heilandes sind (wie der hl. Apostel Paulus sich an mehreren Stellen nennt), so sollen wir uns über die Ketten der Drangsale nicht schämen, sondern sie mit Freuden ertragen, indem wir seine Ankunft vom Himmel erwarten, damit er uns dem Chore der Heiligen beizähle. Die nämlich an seinen Leiden Antheil genommen haben, werden auch Theilnehmer am Troste sein. Fällt aber Jemanden die Mühe der Anstrengung zu schwer: Wie Viele gibt es in der Welt, die am Chiragra oder Podagra leiden, reiche und von vielen Dienern umgebene Leute, die aber Tag und Nacht keine Ruhe genießen, indem sie von der Noth der Leiden gepeinigt und wie mit Banden und Ketten gefesselt werden! Übernehmen wir daher, um der Gottesfurcht wegen, eine selbstgewählte Beschwerde mit freiwilliger Geduld! Vernachlässigen wir auch nicht die Geduld, Demuth, Enthaltsamkeit und das Mitleid!</p><p>9. Mitleid aber verstehe ich nicht in dem Sinne, als solltest du an der Schlechtigkeit des Nebenmenschen Antheil nehmen; sondern du sollst dem Bruder in geistlichen Angelegenheiten beistehen, daß er Zerknirschung und Thränen (der Buße) erlange. Wenn auch das Weinen nicht sichtbar zum Vorschein kommt, soll dennoch die Zerknirschung des Herzens fortdauernd bleiben; denn in Bezug auf die Thränen findet ein Unterschied statt. Selig ist Derjenige, welcher den Herrn in seiner eigenen Seele wie in einem Spiegel betrachtet und mit Weinen vor seiner Güte sein Lob ergießt; denn sein Gebet wird erhört werden.</p><p>10. Ich gebe dir als einem Menschen, der Gott geweiht ist und selig werden will, noch ein anderes Depositum (eine andere Lehre. Vergleiche in dem ersten und zweiten Briefe des hl. Paulus an Timotheus das Depositum des Glaubens, die anvertraute Glaubenslehre). Wenn du vom Essen aufgestanden bist, so gehe nicht in die Zellen herum, sondern bleibe ruhig in deiner Zelle; denn Viele schon hat der Teufel durch den Wein betrogen. Wenn du dich also nach dem Aufstehen von dem Mahle in einer andern Zelle finden lässest, so ist dieß ein Zeichen von Furchtlosigkeit (vor Gott) und von verkehrter Gesinnung. Aus solchen heimlichen Zusammenkünften folgen nämlich Unfälle (das Verlorengehen) von Seelen, und zwar vorzüglich, wenn die Zuchtruthe des Vorstehers ruhig liegen bleibt. Denn die durch die Gottesfurcht ihren Sinn nicht zügeln wollen, bedürfen der Menschenfurcht, um dadurch von nutzlosen Dingen abgehalten zu werden, gleichwie ein Sklave durch die Strenge seines Herrn im Zaume gehalten wird! Habe also Acht auf dich selbst und sei nicht gleichgiltig; denn wenn du einmal das Weintrinken gut lernst, so wirst du weder Nutzen stiften noch Nutzen gewinnen.</p><p>11. Wenn du auch die ganze hl. Schrift auswendig gelernt hast, so überhebe dich deßwegen im Geiste nicht, da ja die ganze von Gott eingegebene Schrift Demuth lehrt! Wer aber dem, was er gelernt hat, Entgegengesetztes denkt oder thut, erweist sich dadurch als einen Übertreter. Beunruhigt dich der Geist des Hochmuths oder der Herrschsucht oder der Begierde nach Reichthum, so laß dich nicht davon hinreissen, sondern widersetze dich vielmehr hochherzig dem Angriffe des bösen und betrügerischen Geistes! Denke an alte Gebäude und veraltete Bilder und vom Roste zerfressene Statuen, und überlege bei dir und betrachte, wo denn jetzt jene Künstler sind, welche diese erwähnten Werke künstlich ausgearbeitet haben, und beeifere dich dem Herrn zu gefallen, damit du des Himmelreichs gewürdigt werdest! „Denn alles Fleisch ist Gras und alle Herrlichkeit des Menschen wie die Blume des Grases.“</p><p>12. Was gibt es Größeres und Herrlicheres als ein Königreich? Einige, die darnach strebten und es erlangten, verachteten aber wegen der damit verbundenen Sorgen und Unfälle die Herrlichkeit und trachteten sogar sich selbst nach dem Leben, indem sie den Tod dem Leben vorzogen, weil sie Gott nicht suchten und ihre Hoffnung nicht auf sein Heil setzten. Die aber des Himmelreichs gewürdigt werden, werden Nichts von Diesem allen (Gefahren und Nöthen nämlich) erfahren, sondern sie leben im Frieden und Jubel im Himmel mit den Engeln ohne Schmerz und Trauer und Seufzen, mit Freude und Frohlocken preisend und verherrlichend und erhebend den König der Himmel und Herrn der ganzen Erde, dem Lob und Ehre und Verherrlichung gebührt in alle Ewigkeiten. Amen.</p><h2>5</h2><h3>Eingang. Von der Sorge für’s Seelenheil. Veranlassung zum Nachtrage. Das Schreckliche der Todesstunde. Nothwendigkeit der Sorge für das Seelenheil. Demüthige Selbstanklage.</h3><p>1. Ich hielt es für nothwendig, Geliebter, auch das Nachfolgende an diese (vorhergehende) Ermahnungsschrift anzureihen, damit der Leser für mich armen und durch die Werke beschämten Sünder zum Herrn bete, daß er mir Verzeihung der Sünden schenke und ich eine ihm wohlgefällige Frucht bringe, bevor der furchtbare Befehl kommt, meine Seele von meinem Körper wegzunehmen.</p><p>2. Dann schwindet alles menschliche Trachten und Treiben dahin. Wehe dann (beim Sterben) Demjenigen, welcher den Herrn, unsern Gott, beleidigt und sich nicht bekehrt hat! Denn er wird die Zeit, welche er in Sorglosigkeit verloren hat, suchen und nicht finden. Weinen wir daher vor unserm Gotte, damit wir von ihm Barmherzigkeit erlangen! Solang wir Zeit haben, schonen wir uns selbst und machen wir uns den Herrn geneigt!</p><p>3. Nicht um Geld haben wir den Kampf zu besteh’n: wenn Jemand an diesem einen Schaden erleidet, so kann er wieder Anderes dafür erwerben. Für die Seele schweben wir in Gefahr. Haben wir diese einmal verloren, so können wir sie nicht mehr zurück gewinnen, wie geschrieben steht: „Was wird es dem Menschen nützen, wenn er auch die ganze Welt gewinnt, aber an seiner Seele Schaden leidet? Oder was für ein Lösegeld kann der Mensch für seine Seele geben? Denn der Menschensohn wird in seiner Herrlichkeit kommen und dann Jedem nach seinen Werken vergelten.“ Wenn es also eine Vergeltung gibt und keines unserer Werke Gott verborgen bleiben kann, warum thun wir nicht das Gute und enthalten uns vom Bösen, damit uns nicht Übel zustoßen? Es steht ja geschrieben: „Enthalte dich vom Unrechten, und du wirst dich nicht zu fürchten haben, und kein Schrecken wird dir nahen.“</p><p>4. Ich schäme mich zu reden und kann dennoch nicht schweigen. Beschämt bin ich über meine Sorglosigkeit und die mir ähnlichen Trägen; denn die weltlichen Soldaten bekommen von ihrem Könige erbärmliche Geschenke und setzen sich doch bereitwillig für ihn Gefahren bis zum Tode aus. Um wieviel mehr sind wir (als Gottes Kämpfer), die wir so herrliche Verheissungen haben, verpflichtet, in Ausübung der Gerechtigkeit nie nachzugeben, damit wir aus dem kommenden Gerichte gerettet werden! Behandeln wir doch unsere Seele, für welche Gott so besorgt ist, nicht wie eine Feindin! Erwägen wir, daß wir nicht einmal die Hitze der Sonne und die Glut des Fiebers ertragen können; wie mögen wir nun das unauslöschliche Feuer gering achten? Gott führe uns nach seinem Wohlgefallen und beschirme uns durch seine allmächtige Hand von Ewigkeit zu Ewigkeit. Amen!</p><h3>1. Glück einer guten, Unglück einer schlechten Leitung.</h3><p>1. Glücklich ist die Stadt, welche von Gottesfürchtigen regiert wird, und ein Schiff, das von erfahrnen Seemännern gesteuert wird, und ein Kloster, welches von Enthaltsamen bewohnt wird.</p><p>2. Weh’ aber einer Stadt, die von Gottlosen beherrscht, und einem Fahrzeuge, das von Unerfahrnen gelenkt wird, und einem Kloster, welches Wollüstlinge bewohnen! Die Stadt wird wegen der Gottlosigkeit der Beherrscher von Barbaren angefüllt werden, das Schiff wegen der Unerfahrenheit seiner Lenker in Trümmer geh’n, das Kloster aber wird wegen der Trägheit der Bewohner veröden.</p><h3>2. Vom Gehorsame. Zunächst für Ordenspersonen, dann für Untergebene überhaupt. Beispiele von Heiligen dafür; Folgen des Ungehorsams.</h3><p>1. Wenn du unter dem Gehorsame geistlicher Väter dich befindest, so zeigt sich die Festigkeit deines Glaubens nicht, wenn man sich dir gefällig erweist und du Reden der Schmeichelei vernimmst, sondern wenn du dich (gegen Beleidigungen) wehren mußt und geschlagen wirst; denn zahm und sanft wird auch ein wildes Thier, wenn man ihm schmeichelt. Erbittre dich daher nicht gegen Denjenigen, welcher dich zurechtweist, wenn du anders ein Gefäß der Auserwählung werden willst, sondern wisse im Herrn Fortschritte zu machen in Unterwürfigkeit und Demuth, weil du dazu gekommen bist, wenn du anders im Bewußtsein der Herrlichkeit derselben sie dir erwählt hast!</p><p>2. Das Leben der Heiligen, o Bruder, zeigt sich dadurch im glänzendsten Lichte verherrlicht. So hat z. B. Moses, der Diener des Herrn, obschon er nicht Schüler nach der Lehre des Jethro (seines Schwiegervaters) war, diesem sich doch unterworfen und gedient, wenn er gleich während seines Aufenthalts in Ägypten hinreichend ausgebildet worden war. Auch Josue, der Sohn Nave’s (oder Nun), wurde seines vollkommnen Gehorsams wegen einer so hohen Gabe (Auszeichnung) gewürdigt, der Nachfolger des Moses zu werden. Samuel wurde, als er unter dem Gehorsam des Priesters Heli sich befand, der Anrede von Gott gewürdigt. Elisäus aber hat dieser Tugend wegen den Mantel und die Gnade seines Lehrmeisters (Elias) erhalten. Doch — was rede ich von Menschen, welche gleichen Leidenschaften, wie wir, unterworfen waren? Wurde ja Gott, das Wort, selbst Mensch und brachte sein Leben in Demuth und Unterwürfigkeit zu, wie uns der Evangelist belehrt, indem er sagt: „Und er war ihnen unterthänig.“ Der Apostel aber sagt ferner: „Er hat sich selbst verdemüthigt, indem er gehorsam geworden bis zum Tode und zwar zum Tod am Kreuze.“</p><p>3. Allein auch dem gewöhnlichen Leben nach stürzen sich Diejenigen, welche die gute Erziehung der Eltern nicht annehmen wollen, in nicht geringe Gefahr: denn die Meisten von Denjenigen, welche in Städten von Obrigkeiten bestraft werden, müssen wegen Ungehorsams, Widerspenstigkeit und Halsstarrigkeit Prügelstrafen aushalten. Auch Mädchen, welche den guten Ermahnungen nicht gehorchen, verlassen den Pfad der Eingezogenheit, schweifen als öffentliche Buhldirnen auf Gassen und Straßen herum und überlassen sich dem frechsten Muthwillen. Die aber fleissig sich der Arbeit widmen und in sittsamer Ruhe ein zurückgezogenes Leben führen, werden bei den Menschen Ehre erlangen, von Gott aber verherrlicht werden. Du hast einen guten Entschluß gefaßt; halte standhaft darin aus, auf daß du mit den Sanften und Demüthigen vom Herrn in dem Himmelreiche großen Ruhm erlangest!</p><h3>3. Vom Mitleiden gegen Kranke. Warnung vor unbefugter Übernahme der Arbeiten Anderer.</h3><p>1. Wenn dein Bruder irgend eine Arbeit nur zur Hälfte verrichtet hat und es sich ereignet, daß er krank wird und deines Beistands zum Werke bedarf, so übernimm die Besorgung desselben und unterstütze den Leidenden mit aller Demuth in der Mühe! Hat er aber wieder seine Gesundheit erlangt, so verlange nicht mehr nach den Geschäften deines Bruders, damit du dir nicht Verdammung vom Herrn und von den Menschen zuziehest!</p><p>2. Allein vielleicht kommt dir der Gedanke in den Sinn: Eine Fügung Gottes ist darin. daß Jener krank geworden ist und ich nun dieß Geschäft bekomme. Doch warum hast du nicht lieber den guten Gedanken, es sei eine Anordnung Gottes, damit deine Gesinnung offenbar werde, wie du in dieser Hinsicht beschaffen seist, ob du nur dich selbst oder den Bruder liebest? Wenn aber der Andere nach seiner Genesung von der Krankheit die Arbeit sich selbst verbittet, dann kannst du dieselbe mit gutem Gewissen, wenn der Vorgesetzte es erlaubt, selbst übernehmen, damit du auch von denen, die draußen sind, ein schönes Zeugniß bekommest. Die Gerechtigkeit ist nämlich zu einem gottseligen Leben nothwendig. Über den hl. Simeon, der unsern Herrn in seine Arme nahm, steht geschrieben: „Er war gerecht und gottesfürchtig!“</p><h3>4. Von der Standhaftigkeit im Guten. Nachtheile der Trägheit.</h3><p>1. Wir müssen ein standhaftes Herz haben, Geliebter; denn die Trägheit widersteht feindlich der Tugend. Wenn uns also eine kleine Unlust überfällt, so dürfen wir deßhalb nicht kleinmüthig werden, sondern wir sollen uns Gewalt anthun wie ein rüstiger Wanderer.</p><p>2. Ein Solcher nämlich läßt, wenn er auf dem Wege matt zu werden anfängt, dennoch von dem Streben nicht ab, das Ziel der langen Reise zn erreichen, sondern er muntert sich selbst mit den Worten auf: „Nur noch eine kleine Weile, dann wirst du in die Herberge kommen und dort ausruhen.“ Auch der Herr gewährt ihm beim Anblicke der Gewalt (die er sich anthut) Stärke und erleichtert ihm die Beschwerlichkeit des Weges. Die Trägheit und Nachlässigkeit führen die Armuth herbei, und zwar nicht bloß in Bezug auf den Geist der Gnadengaben, sondern auch in Rücksicht auf die leiblichen Bedürfnisse.</p><h3>5. Von Vermeidung des geistlichen Stolzes. Warnung vor Trunkenheit und Unzucht jeder Art. Ermahnung zur allseitigen Wachsamkeit.</h3><p>1. Wenn du bei dem Gottesdienste vor allen Andern erscheinst und dabei ganz bis an’s Ende aushältst, so werde deßwegen nicht hochmüthig; denn auch die Handwerker wenden bei ihrer Arbeit viel Müh’ und Wachsamkeit an. Stelle dich aber dem Herrn nicht bloß dem Leibe nach vor, sondern versammle auch mit demüthigem Herzen deine Gedanken! Der Hochmuth ist nämlich einer Höhle ähnlich, in welcher der Drache gern haust und den Nahekommenden tödtet.</p><p>2. Daß du dich nicht mit Wein berauschen und mit weiblichen Personen nicht Umgang pflegen sollest, darüber scheint es mir überflüssig, dir, mein gottliebender Bruder, eine Andeutung zu geben. Es ist ja Allen ohnehin bekannt genug, daß Dieß alles der Tugend fremd ist. Doch ist es nothwendig, nicht bloß in dieser Hinsicht (nämlich was den weiblichen Umgang betrifft) vor den Anfechtungen der bösen Geister sich zu hüten, sondern selbst mit männlichen Personen darf man sich nicht in wollüstige und weibische Gespräche einlassen, welche zum Verderben der Seele führen. Wir verwerfen den Umgang mit dem weiblichen Geschlechte nicht, als wäre er an sich schon böse, sondern weil es unserm Widersacher leicht ist, durch den vertrauten Umgang mit weiblichen Personen uns zu verkehren und zur Übertretung des Gebotes Gottes zu verführen.</p><p>3. Wir müssen daher von allen Seiten auf uns’rer Hut sein vor den Anfällen der bösen Geister, muthig vertrauend auf die Waffenrüstung Gottes und die Kraft des hl. Geistes; denn wer dem Feind ein Thor versperrt, ihm aber zwei andere aufthut und in Sicherheit zu bleiben wähnt, ein Solcher betrügt sich. Es ist also nothwendig, uns von allen Seiten sicher zu stellen und Denjenigen, welche eine Gelegenheit suchen, keine zu geben. Denn Gott läßt sich nicht verspotten, und „es ist schrecklich in die Hände des lebendigen Gottes zu fallen.“ Sein ist die Ehre und Macht in alle Ewigkeiten, Amen.</p>
    references: |-
      <p><strong>Quelle:</strong> Übersetzung der BKV-Ausgabe, <em>Auswahl asketischer Abhandlungen</em>. Text nach <a href="https://bkv.unifr.ch/de/works/-38b/versions/auswahl-ascetischer-abhandlungen-uber-die-christliche-tugend-und-vollkommenheit-bkv">bkv.unifr.ch</a>; die Anmerkungen der Ausgabe sind weggelassen.</p>

  - src: "mfw6_Надгробные_песнопения"
    path: "Ephraem_Nisibische_Hymnen"
    title: "Ausgewählte nisibische Hymnen"
    menu: { parent: "Werke", title: "Ausgewählte nisibische Hymnen", priority: 3 }
    update: true
    body: |-
      <p><em>Ausgewählte nisibische Hymnen (Bibliothek der Kirchenväter).</em></p><h2>1</h2><h3>1. Die Kriegsnöte der Stadt Nisibis.</h3><p>Die ersten zwölf Gedichte haben die Belagerung und Befreiung der Stadt Nisibis sowie damit zusammenhängende Heimsuchungen zum geschichtlichen Hintergrund. In welches Jahr ist nun das erste Ereignis zu setzen? Nisibis hat drei Belagerungen durch Sapor, den tatkräftigen Perserkönig und grausamen Christenverfolger, durchkosten müssen, da er durchaus die östlichste Provinz des Römerreiches und Armenien seinem Reiche einverleiben wollte. Die erste fand nach dem Tode Konstantins, also 338, die zweite 346, und eine dritte 350 statt. Diese dreimalige Einschließung bezeugt sowohl Ephräm als auch Sextus Rufus in seinem etwas nach 369 verfaßten Breviarium rerum gestarum populi Romani, cap. 27, und das aus dem Jahre 380 stammende Chronicon des Hieronymus [Berliner Kirchenväterausgabe, Eusebius VII 1, S. 234, 236 und 237]. Wollen wir dann bei den griechischen und syrischen Chroniken nähere Auskunft suchen, so stoßen wir auf ein Chaos der verschiedensten Darstellungen. Diesem Umstand ist es zuzuschreiben, daß Bickell in der im ersten Gedichte geschilderten Kriegsnot die dritte Belagerung vom Jahre 350 erblickt, während Lamy [S. Ephraem Syri Hymni et Sermones, Bd. 4, S. XXII] ihm Unrecht gibt und alles auf die erste Belagerung vom Jahre 338 bezieht. Woher diese Verschiedenheit in der Datierung? Lamy bringt die dort von Ephräm erzählten Ereignisse mit der Errettung der Stadt durch den Bischof Jacobus zusammen und muß daher, da Jacobus nach einheitlichem Zeugnis der Geschichtschreiber im Jahre 338 gestorben ist, wie es auch Ephräm wenigstens andeutet [13. Hymnus, 80 ff.], die erste Belagerung als Anlaß nehmen. Aber zu dieser Voraussetzung, daß beide Ereignisse, die Errettung aus Wassernot, die als das hervorstechende Kennzeichen der von Ephräm geschilderten Belagerung zu gelten hat, und die Befreiung durch das Gebet des Jacobus bezw. durch das Auftreten von Mückenschwärmen, bei ein und derselben Belagerung stattgefunden hätten, sind wir weder genötigt noch berechtigt. Wie wir sehen werden, haben erst spätere Berichterstatter, die wohl samt und sonders auf Theodoret zurückgehen, dieses Zusammenschmelzen ursprünglich getrennter Ereignisse vorgenommen; Theodoret hat, weil er nur einmal von der Belagerung in seiner Kirchengeschichte und in der Historia religiosa spricht, alles, was er wußte, in dieser einen Schilderung zusammengetragen.</p><p>Nun haben wir aber außer der Schilderung Ephräms noch die eines kompetenten Zeitgenossen, nämlich des Kaisers Julian, der in seiner I. und II. oratio ad imperatorem Constantium auch die Befreiung von Nisibis auf das Ruhmeskonto des letzteren schreiben möchte und uns darum eine sehr lebendige Darstellung hinterlassen hat [Juliani imperatoris quae supersunt ed. Hertlein; oratio I, S. 33 f.; II, S. 79 ff.]. Die von ihm gebotene Erzählung gehört ganz sicher in das Jahr 350; andererseits sind die ihr zugrunde liegenden charakteristischen Ereignisse [Wassernot!] entschieden identisch mit den von Ephräm berichteten; also muß auch die im ersten Hymnus geschilderte Belagerung ins Jahr 350 fallen. Die Schwierigkeiten, die sich aus den verschiedenen Angaben über die Dauer der Belagerung nach den Ausführungen Lamys gegen diesen Schluß erheben, halte ich für unerheblich. Auch kann ich nicht glauben, daß etwa Sapor beidemal eine Überschwemmung herbeigeführt hat. Außerdem, wenn die Errettung wirklich auf das unmittelbare Eingreifen des Bischofs Jacobus zurückzuführen wäre, wie es Theodoret dramatisch aufputzt, dann hätte Ephräm, der große Verehrer seines Lehrers Jacobus, schwerlich verfehlt, in seinem Gedicht diesen Zug kräftig zu unterstreichen; er erwähnt ihn gar nicht, nur 13,113 – 115 sagt er, daß die Reliquien jenes die Stadt retteten, und 17,106 f. wünscht er, daß der neue Bischof Abraham der Stadt eine Mauer sei wie Jakob. [Lamy, S. XX führt in die Irre, wenn er beide Zitate so verbindet: Jacobus, qui fuit Nisibenis sicut murus et salvavit urbem.] Ob überhaupt aus der auch von Ephräm vertretenen Anschauung, daß die Reliquien dieses heiligen Bischofs ein rettendes Panier für die Stadt bedeuteten, erst der spätere, und dann als legendär zu betrachtende Zug, daß Jacobus durch sein persönliches Eingreifen die Stadt errettete, entstanden sei, möchte ich dahingestellt sein lassen.&lt;br|&gt;Da die lebhafte, bisweilen von gelehrten Reflexionen unterbrochene Schilderung Julians die zuverlässigste Erläuterung zum ersten Hymnus ist, möge sie hier im Abriß folgen. Sapor zieht mit ungeheuren Truppen und Troß heran und schließt die Stadt ein; durch Dämme gelingt es ihm, den ohnehin zur Frühjahrszeit angeschwollenen Mygdonius so zu stauen, daß die Stadt nur noch wie eine Insel aus dem See hervorragt. Nun schafft er auf Schiffen Belagerungsmaschinen an die Stadt heran. Die Bewohner leisten erbitterten Widerstand, werfen Steine und Feuerbrände auf die Belagerer, die große Verluste an Soldaten und Maschinen erleiden. Doch inzwischen hat das Wasser eine Mauer unterspült, sie fällt ein; aber auch die Staudämme scheinen teilweise der Gewalt des Wassers nicht mehr gewachsen zu sein; denn das Wasser tritt zurück, und Sapor muß auf dem völlig versumpften Gelände einen Angriff machen, der ihm nur große Verluste an Reiterei und Elephanten einbringt. So hat er inzwischen vier Monate vor der Stadt zugebracht. Die Belagerten haben unter dem Schutz von Soldaten in unerwarteter Schnelligkeit die eingestürzte Mauer wieder aufgerichtet, so daß ein erneuter Angriff durch Bogenschützen gerade gegen jene Bresche erfolglos bleibt. Krankheiten und Hunger scheinen ebenfalls sein Heer heimgesucht zu haben, so daß er schließlich die Belagerung aufheben muß, nicht ohne vorher ein strenges Strafgericht über jene Führer abgehalten zu haben, die nach seiner Ansicht den Mißerfolg verschuldet hatten. Vielleicht haben auch Unruhen in anderen Gebieten seines weiten Reiches seine baldige Anwesenheit nötig gemacht; so meinen spätere Geschichtschreiber.</p><p>Theodoret, der, wie erwähnt, die Ereignisse der ersten und dritten Belagerung zur Darstellung einer einzigen zusammenschweißt, spricht sowohl in der Vita des Jacobus [Historia religiosa I, Migne PG. 82,1304] als auch in der Kirchengeschichte [Migne PG. 82,1076f.; Berliner Kirchenväter: Theodoret, Kirchengeschichte, herausgegeben von Parmentier, 167 ff.] von einem Eingreifen des Bischofs Jacobus und verlegt demgemäß auch das Ereignis in die Zeit kurz nach dem Tode Konstantins. Schon die Erfolglosigkeit des ersten Angriffs mit den Belagerungsmaschinen wird dem Gebete des Jacobus zugeschrieben. Das Stauen des Mygdonius hat den Einsturz der Mauer zur Folge, doch wartet Sapor einen Tag mit dem Angriff, damit sich das Wasser erst verlaufe. Die Bewohner stellen auf Betreiben des Jacobus die Mauern wieder her; er betet inzwischen in der Kirche. Der Sturm ist wieder erfolglos. Nach der Historia religiosa wird Jacobus gebeten, die Mauer zu besteigen und den Feind zu verfluchen; als er die Menge der Feinde erblickt, bittet er, Gott möge Mückenscharen gegen sie kommen lassen; sofort geschieht es, und die von ihnen gequälten Elephanten und Pferde richten eine fürchterliche Verwirrung unter den Soldaten an. Sapor glaubt in dem Heiligen auf der Mauer den Kaiser selbst erblickt zu haben und bestraft seine Umgebung, weil man ihm verschwiegen habe, daß der Kaiser anwesend sei.</p><p>In der Kirchengeschichte ist das letztere etwas anders dargestellt. Der Kaiser sieht nach der Wiederherstellung der Mauer auf ihr einen Mann in kaiserlichem Gewande und glaubt, daß es Konstantius sei; er schießt voll Wut einen Pfeil gen Himmel. Dann erst wird erzählt, wie Ephräm den Bischof Jacobus bittet, auf die Mauer steigen zu dürfen; ihm, nicht dem Bischof, wird dann die Verfluchung zugeschrieben. Der Erfolg ist der gleiche wie oben.</p><p>Diese Darstellung ist dann von den meisten späteren Schreibern, oft in sklavischer Anlehnung, übernommen worden. So in den syrischen Viten des Ephräm, die den Schluß natürlich in der Fassung der Kirchengeschichte Theodorets bieten.</p><p>Das Chronicon paschale [Migne PG. 92, 717 u. 724; vgl. Berliner Kirchenväterausgabe: Philostorgios, ed. Bidez, S. 216 ff.], das auch die Belagerung vom Jahre 337 kennt, schreibt für die vom Jahre 350 eine ausführlich arianische Quelle aus, die merkwürdigerweise auf den Bischof Vologeses von Nisibis zurückgeführt wird. Die Darstellung Theodorets ist noch um einige Züge bereichert, doch wird Jacobus nicht genannt; der Mann auf der Mauer, den Sapor für den Kaiser hält, ist nur ein „Jemand“. Dieselbe Quelle benutzt auch Theophanes in seiner Chronographia [ed. de Boor I, 34, 33; 38, 10; 39,13].</p><p>Unter den Syrern erscheint die Schilderung der Belagerung nach Theodorets Kirchengeschichte; so in der Vita des Jacobus [Bedjan, Acta Martyrum et Sanctorum 4, 270 ff.), in der Chronik Michaels des Großen [herausgegeben von Chabot, S. 135 f., Übersetzung S. 266 f.] und bei Barhebraeus, Chronicon [ed. Bedjan S. 61]. Georg, der Araberbischof, beruft sich für seine Notiz über die Rolle, die Ephräm bei der Belagerung spielte, ausdrücklich auf Theodoret [Georgs des Araberbischofs Gedichte und Briefe, übersetzt von Ryssel, Leipzig 1891, S. 47]. In der wertvollen Chronik von Arbela [= Sources syriaques, vol. 1, ed. Mingana, Leipzig 1907, S. 48 f.; E. Sachau, Die Chronik von Arbela, Abhandlung der Berliner Akad. d. Wiss. 1915, Philos.-histor. Klasse, Nr. 6, S. 74] heißt es, daß nach dem Tode Konstantins Sapor Nisibis belagerte; infolge des Gebets des Bischofs Jakob, das er auf der Mauer zu Gott richtete, schickte Gott Insekten gegen die Armee des Perserkönigs; diese belästigten die Pferde, und darob entstand große Verwirrung, der König mußte abziehen. - Zum Jahre 351 berichtet die Chronik von einer erneuten Belagerung von Nisibis, ohne Einzelheiten anzugeben; Sapor muß wegen Aufruhrs anderer Völkerschaften heimkehren, läßt aber viele Truppen vor Nisibis und in Mesopotamien stehen.</p><p>Von den Berichten anderer Chroniken, die meist Auszüge aus älteren Quellen bringen und für unseren Fall in letzter Linie auf Theodoret zurückgehen, kann wohl abgesehen werden.</p><p>Als Resultat ergibt sich jedenfalls, daß man drei Belagerungen der Stadt Nisibis anzunehmen hat, von denen die zweite keine nähere Darstellung gefunden hat und die erste und dritte vielfach verwechselt und verschmolzen worden sind. Die erste fand bald nach dem Tode Konstantins statt und scheint durch ein Eingreifen des Bischofs Jakob eine günstige Wendung genommen zu haben. Vielleicht haben wir das Auftreten von Mückenschwärmen, wie es die auch sonst zuverlässige Chronik von Arbela schildert, wenn es überhaupt historisch ist, hier unterzubringen. Die dritte Belagerung, die uns Ephräm als Augenzeuge, Julian als Zeitgenosse schildert, ist charakterisiert durch die künstlich herbeigeführte Überschwemmung der Umgebung von Nisibis. Die erste und dritte Belagerung erscheinen bald in den Berichten – die älteste greifbare Quelle hierfür ist Theodoret – als eine, und die bei beiden verschiedenen Vorgänge sind auf ein Ereignis zusammengedrängt, das, wenn es überhaupt zeitlich bestimmt erscheint, meist in die Zeit nach dem Tode Konstantins verlegt wird, also mit der ersten Belagerung konkurriert. In der Zuteilung der Rollen des Mauerbesteigens und Verfluchens ist Theodoret noch schwankend; – ob überhaupt Ephräm im Jahre 338 schon eine solche Stellung neben dem Bischof einnehmen konnte? – Neuere Bearbeiter der Geschichte dieser Zeit, denen die Ereignisse bei der Belagerung fester mit dem Jahre 350 verankert erscheinen als mit der genauen Zeit des Bischofs Jacobus, lassen ihn einfach bis zum Jahre 350 leben; dieser Charybdis sind sowohl Gibbon [The History of the Decline and Fall of the Roman Empire, edited by J. B. Bury, London 1896, Vol. 2, S. 229] als auch Seeck [Geschichte des Untergangs der antiken Welt, IV. Bd. [1911], S. 95] verfallen; nach Tillemont, Histoire des Empereurs 4,2 [Bruxelles 1709] hat Jakob in allen drei Belagerungen die Rettung herbeigeführt.</p><p>Die Abfassungszeit dieser ersten Reihe von Hymnen dürfte nach Bickell folgendermaßen zu bestimmen sein: Nr. 1 ist während oder bald nach der Belagerung von 350 entstanden, ebenso 2 – 3 kurz darauf; 4 – 12 stammen aus dem Jahre 359, wie sich aus den angedeuteten kriegerischen Ereignissen ergibt, die bei Ammianus Marcellinus näher beschrieben sind.</p><p>Nach der Melodie: Ich will meinen Mund öffnen in Weisheit.</p><p><em>In diesem Gedicht führt Ephräm die Stadt Nisibis sprechend ein; sie ist zum drittenmal belagert, und diesmal haben die Feinde die ganze Umgebung der Stadt unter Wasser gesetzt, so daß die Stadt sich mit der Arche Noës vergleichen kann. Der Vergleich wird bis ins einzelne durchgeführt.</em></p><p><em>Der äußeren Form nach besteht das Gedicht aus 11 Strophen, die mit dem ersten, dritten, fünften usw. Buchstaben des syrischen Alphabets beginnen. Jede Strophe hat 14 Verse, je die letzten zwei kommen auf den Kehrvers [Unitha], der hier, wie sonst selten, für jede Strophe ein anderer ist.</em></p><p>Barmherziger Gott, der du Noë Ruhe verliehest, da auch er deine Barmherzigkeit versöhnte; Opfer brachte er dar und hemmte die Fluten, Spenden gab er, und Verheißung empfing er. [5] Durch Gebet und Weihrauch versöhnte er dich, mit Eidschwur und dem Regenbogen beschenktest du ihn gnädig, und wo die Flut droht, der Erde zu schaden, sollte gegen sie der Regenbogen auftreten, [10] um sie zu vertreiben und der Erde neuen Mut zu geben; denn deine Eidschwüre sollen den Frieden sichern, und dein Bogen soll deinem Zorne Widerstand leisten. – [Kehrvers:]Spanne deinen Bogen aus gegen die Flut, denn ihre Wogen türmen sich gegen unsere Mauern auf.</p><p>[15] Freimütig klage ich, Herr: Wenn das schwache Blut, das Noë ausgoß, für alle Zeit deinem Zorne Einhalt gebot, um wieviel kräftiger sollte das Blut deines Eingeborenen sein, daß sein Vergießen unsere Flut hemme! [20] Denn siehe, als sein Vorbild nur erhielten jene schwachen Opfer Kraft, die Noë darbrachte, und so den Zorn aufhielt. Laß dich versöhnen durch das Opfer auf meinem Altar und halte fern von mir die Sturmflut der Leiden. [25] So möge Schutz gewähren das Paar deiner Wunderzeichen: mir dein Kreuz, dem Noë dein Bogen. – Dein Kreuz soll das Wassermeer durchschneiden, dein Bogen des Regens Flut vertreiben.</p><p>Siehe es bedrängen mich all die Fluten, [30] aber der Arche ließest du den Vorteil, daß nur die Wogen sie rings umgaben, mich aber umdräuen Wälle, Waffen und Wogen. Sie war dir ein Hort teurer Güter, ich freilich bin ein Sammelplatz der Sünden; [35] sie glitt auf den Wogen dahin, von deiner Liebe getragen, ich aber bin durch deinen Zorn hilflos Speeren preisgegeben; sie trug die Flut, mich umtost der Fluß. Lenker jener Arche, [40] sei auch mein Führer auf dem festen Lande. – Jene hast du in dem Hafen auf dem Berge ausruhen lassen, gewähre auch mir Ruhe in dem Hafen meiner Mauern!</p><p>Der gerechte Gott züchtigte mich mit Fluten, jene mitten auf den Fluten liebte er zärtlich. [45] Hat doch Noë die Wogen der Begierde besiegt, die zu seiner Zeit die Söhne Seths fortrissen, er, dessen Fleisch den Töchtern Kains widerstand, machte der Fluten Rücken sich zum Thron, er, den Weiber nicht befleckten, führte die Tiere einander zu, [50] da er in der Arche sie alle paarweise miteinander verband. Die Olive, die durch ihr Öl das Angesicht erstrahlen läßt, erfreute hier schon durch ihr Laub ihr Antlitz. – [55] Der Fluß, dessen Trank erquickt, macht durch seine Überschwemmung, o Herr, mich traurig.</p><p>Deine Gerechtigkeit erblickte den Schmutz meiner Sünden, und deine heiligen Augen verabscheuten mich. Wasser hast du angesammelt durch den Unreinen [den heidnischen Feind], [60] um von mir meine Sünden abzuwaschen, zwar nicht um mich in diesem taufend zu läutern, sondern um mich dadurch zu schrecken und zu züchtigen, denn die Fluten nötigen mich zum Gebet, das meine Sünden abwäscht. [65] Ihr Anblick, der mich mit Reue erfüllt, wirkt in mir als Taufe. In dem Meere das bestimmt ist, mich zu ertränken, möge, Herr, deine Barmherzigkeit die Sünden ertränken. - In dem Schilfmeer hast du Menschenleiber versenkt, [70] in diesem mögest du anstatt der Leiber Sünden versenken.</p><p>Aus Liebe hast du die Arche gebaut, um in ihr alles, was übrig war, zu erhalten. Um die Erde durch deinen Zorn nicht zu veröden, machte deine Gnade eine Erde aus Holz. [75] Du hast die eine in die andere entleert, um die eine mit der andern wieder herzustellen. Mein Landwurde schon dreimal gefüllt und entleert, und jetzt stürzen auf mich die Wasserfluten, um den Flüchtling zu verschlingen, [80] der in mir Zuflucht gefunden. In der Arche hast du den Überrest gerettet, bewahre, Herr, auch in mir den Sauerteig! – Die Arche gebar auf dem Berge, für mein Land laß mich die Eingeschlossenen gebären.</p><p>[85] Herr, erfreue die in meinen Festungen Eingeschlossenen, der du jene Eingeschlossenen durch den Ölzweig erfreut hast; als Arzt sandtest du ihn durch die Taube den Kranken, die durch den Wogenschwall geängstigt waren; er kam und vertrieb alle Krankheiten, [90] denn die Freude über ihn verschlang den Kummer, und die Trauer schwand dahin durch seinen Trost. Und wie ein Feldherr flößte er Mut den Zaudernden ein, gab die Sprache den Verlassenen wieder [95] und ließ die Augen den Anblick des Friedens kosten, und sogleich öffnete sich der Mund zu deinem Lob. – Als Ölzweig in diesen Fluten erhalte mich, damit sich an mir erfreuen die in der Feste Eingeschlossenen.</p><p>Die Flut stürmt dreist gegen unsere Mauern an, [100] doch wird sie die Kraft, die alles stützt, erhalten; nicht wird sie fallen, wie ein Haus auf Sand gebaut, denn meine Lehre habe ich nicht auf Sand gegründet, ein Fels ward mein Fundament, denn auf deinen Felsen baute ich meinen Glauben. [105] Das verborgene Fundament meiner Hoffnung wird meine Mauer tragen. Jerichos Mauern fielen freilich, denn seine Hoffnung war auf Sand gebaut, Moses aber baute im Meere eine Mauer auf,die sein gläubiger Sinn auf Felsen gründete. – Noës Fundament war auf Felsen gegründet, es trug das Holzhaus auf dem Meere.</p><p>Vergleiche doch die Seelen, die in mir sind, mit den Tieren der Arche! [115] Und anstatt Noës, der traurig in ihr lebte, sieh deinen Altar, schmucklos und erniedrigt! Und anstatt der Ehefrauen in ihr siehe meine Jungfrauen, die ehelos bleiben! Und anstatt Chams, der hinging [120] und die Scham seines Vaters entblößte, siehe jene, die Wohltun üben, wie sie züchtig die Nacktenbekleiden! In meinem Schmerze rede ich irre, Herr, rechne es mir nicht an, wenn meine Worte deinen Zorn reizen! – [125] Die Übermütigen, welche murrten, brachtest du zum Schweigen, mir sei gnädig, wie dem Überrest, der Schweigen beobachtete.</p><p>Vor deinem Zornesausbruche erbautest du eine Zufluchtsstätte, und es flüchteten sich in sie alle Arten der Geschöpfe. Noë erfreute sich der Ruhe [wohnung], [130] denn Ruhe bedeutete ihm die Wohnung wie sein Name. Du verschlossest das Tor, um den Gerechten zu hüten, du öffnetest die Regenschleußen, um die Gottlosen zu vernichten. Noë stand da inmitten der Wogen, die draußen schrecklich drohten, [135] und mitten unter den furchtbaren Rachendrinnen. Es trieben ihn die Wellen umher, es verwirrten ihn die Rachen, doch du versöhntest mit ihm die Hausgenossen drinnen und unterwarfst ihm die [Fluten] draußen. - Das Lästige machtest du schnell erträglich, [140] denn leicht ist dir, Herr, das Schwierigste.</p><p>Höre, Herr, und vergleiche meine Lage mit der des Noë, und wäre mein Kummer leichter als der seine, so mache uns in der Errettung gleich! Denn siehe, meine Kinder stehen da, gleichwie er, [145] zwischen Rasenden und Übeltätern. Gib Frieden mit den Hausgenossen drinnen, und unterwirf mir die Feinde draußen und verdoppele so meinen Sieg, und da zum drittenmal der Mörder seinen Zorn ausläßt, [150] so möge auch zum drittenmal der „Dreitägige" [Christus] seine Gnade walten lassen. Möge der Böse nicht über die Barmherzigkeit triumphieren. Besiege den, der zum zweiten- und drittenmal es wagte. Es wird mein Sieg die Erde durchfliegen und dir Ruhm auf Erden verschaffen. [155] O, der du am dritten Tage auferstandest, laß mich nicht in meiner dritten [Trübsal] untergehen!</p><p>Über die Errettung der Stadt. Nach der Melodie: Tröstet durch Verheißungen.</p><p>Die befreite Stadt sagt Gott Dank für die Errettung, und klagt gleichzeitig über die Sünden ihrer Bewohner. - Die ersten Buchstaben der einzelnen Strophen ergeben als Akrostich: Afrem [Ephräm, Afrem, Fremion, Verkleinerungsform von Ephräm als Ausdruck der Verdemütigung].</p><p>Heut öffnet sich jeder Mund, um Dank zu sagen; jene, die Breschen schlugen, haben auch den Mund meiner Kinder geöffnet, [5] sie preisen den Erbarmer, der unser Volk errettet hat. Er hat jetzt sein Augenmerk nicht darauf gerichtet, uns die Verfehlungen heimzuzahlen, die auf uns lasteten. Erhoben sich doch bereits jene, die uns in Gefangenschaft führen wollten, [10] aber die Welt hat in unserer Errettung deine Gnade fühlen gelernt. – [Kehrvers:] Preis sei deiner Güte von jedem, der sprechen kann!</p><p>Er rettete uns ohne Mauer [15] und lehrte uns, daß er unsere Mauer ist; er rettete uns ohne Königund bewies, daß er unser König ist; er rettete uns in allem und jedem und zeigte, daß er alles ist. [20] Er rettete uns durch seine Gnade und offenbarte dadurch, daß er umsonst Gnade erweist und Leben gibt. Wer immer sich rühmt, dem nimmt er den Ruhm und gibt ihm seine Gnade.</p><p>[25] Der Jubelruf in aller Mund ist zu gering für, deinen Ruhm; denn in jener Stunde, als unser Licht nur flackerte und am Erlöschen war, [30] flammte es plötzlich wieder auf und leuchtete, denn dir ist alles leicht. Wer sah zwei solche Wunder, daß sich jenem, der von aller Hoffnung abgeschnitten war, plötzlich reiche Hoffnung nahte! [35] Die Stunde des Wehklagens ist der frohen Kunde gewichen.</p><p>Ein Festtag ist’s, aus dem frohe Feste hervorgehen; denn wenn uns der Zorn erfaßt hätte, dann hätten auch die Feste aufgehört, [40] nun aber hat unser Friede den Sieg davongetragen, darum ertönet Festjubel. Dieser gesegnete Tag brachte alles mit sich; von ihm hing das Schicksal der Stadt ab, von der Stadt das Volk, [45] vom Volk der Frieden, vom Frieden alles.</p><p>Sogar durch die Breschen hast du den Ruhm vermehrt; [50] Lobpreis stieg zu dem Dreieinigen empor von den drei Mauerbreschen; denn er stieg herab und verschloß sie in seiner Barmherzigkeit, die den Zorn zurückhält. Er fegte jenen hinweg, der nicht erkennen wollte, daß er uns [nur] eine Lehre geben wollte. Er lehrte die Eingeschlossenen, [55] daß er aus Gerechtigkeit die Mauern brach, er lehrte aber auch die Belagerer, daß er sie aus Güte wieder schloß.</p><p>Rufet und lobpreiset, meine Geretteten, am heutigen Tage, [60] ihr Greise und Knaben, ihr Jünglinge und Jungfrauen, ihr Kinder und Unschuldigen, und du, Kirche, Mutter der Stadt, denn die Greise wurden vor der Gefangenschaft bewahrt, [65] die Jünglinge vor Qualen, die Kinder vor der Zerschmetterung, die Frauen vor der Schande und die Kirche vor der Verachtung!</p><p>Er kam zu uns mit harten Strafen, [70] und wir waren im Augenblick vom Schrecken erfaßt; er kam mit Milde, und sogleich blühten wir wieder auf; er wandte sich ab und verließ uns ein wenig, da irrten wir umher ohne Ziel [75] wie ein reißendes Tier, das Lock- und Schreckmitteln folgt, das aber, wenn man von ihm abläßt, wütet und umherirrt und dem bebauten Lande Schaden zufügt.</p><p>Er zahlte uns heim, und wir gerieten in Furcht, er befreite uns, und wir wurden nicht beschämt; er führte uns in Bedrängnis, und zahlreich wurden die Gelübde, er ließ Milde walten, und zahlreich wurden die Sünden; wenn er uns bedrängte, wurde ein Bund geschlossen, [85] wenn er uns aufatmen ließ, trat Verirrung ein. Er ließ sich herab, uns zu stärken, obwohl er uns kannte; am Abend erhoben wir ihn, am Morgen brachen wir ihm die Treue; verließ uns die Not, [90] so ging auch die Wahrheit von uns fort.</p><p>Er bedrängte uns durch die Breschen, um unsere Verfehlungen heimzuzahlen, Hügelerrichtete er, um unsere Ruhmsucht zu erniedrigen, [95] die Gewässer ließ er hervorbrechen, um unsere Unreinheit abzuwaschen; er schloß uns ein, um uns in seinem Tempel zu versammeln; er schloß uns ein, und wir verlöschten, er öffnete uns, und wir gingen in die Irre. [100] Der Wolle glichen wir, die alle Farben wiedergibt.</p><p>Wisse, daß die seligen Niniviten, als sie Buße taten, es nicht taten wegen der Hügel, [105] nicht wegen der Gewässer, nicht wegen der Breschen, auch nicht wegen der Bogen, und auch nicht aus Furcht vor dem Klange der Bogensehne taten sie Buße: sie hörten auf eine verachtete Stimme, [110] ließen ihre Kinder fasten, sie machten ihre Jünglinge keusch und ihre Herrscher demütig.</p><p>Du hast uns gezüchtigt, und wir haben zugeben müssen, daß es nicht unverdient geschah. [115] Du hast uns gerettet, und wir danken dir, denn wir waren dessen nicht wert. Du hast Gnade walten lassen, obwohl du dich nicht der trügerischen Hoffnung hingabst, daß wir uns bekehren würden. [120] Du wußtest, daß wir sündigten und erkanntest, daß wir wieder sündigen würden; du durchschautest unsere frühere und zukünftige Sündhaftigkeit, als du an uns Gnade übtest.</p><p>Er wog unsere Buße ab, ob sie schwerer sei als unsere Sünde, aber nicht einmal zum Gleichgewicht stiegen die Wagschalen gleich hoch, da unsere Sünden das Übergewicht hatten und unsere Buße zu leicht war. [130] Schon hatte er den Befehl gegeben, uns für unsere Sünden zu verkaufen, aber seine Gnade war unsere Fürsprecherin. Die Grundschuld mit den Zinsen haben wir mit dem Scherflein bezahlt, das unsere Buße darbot.</p><p>[135] Zehntausend Talente der Schuld ließ er uns um weniges nach, obgleich er gar sehr berechtigt war, sie einzufordern, um seiner Gerechtigkeit Genüge zu leisten; aber wiederum fühlte er sich gedrängt, Nachlassung zu gewähren, [140] um seine Güte leuchten zu lassen. Nur für einen Augenblick boten, wir ihm Tränen dar, er kämpfte seine Gerechtigkeit nieder, indem er nur weniges forderte und empfing; er ließ seine Gnade leuchten, [145] um weniges ließ er vieles nach.</p><p>Unermeßlich sind unsere Schulden, die er nachließ, unermeßlich, so daß unsere Zungen seiner Güte gegenüber versagen. [150] Er verzieh uns, wir vergelten es ihm auf entgegengesetzte Weise, die begangene Schuld tragen wir von neuem ein. „Lasse nach, Herr!“ rufen wir: „strafe, Herr!“ beten wir. [155] „Lasse nach“ nämlich, was wir gesündigt haben, „strafe“ den, der gegen uns gesündigt hat!</p><p>Wir haben auch nicht einmal wie die Belagerer für unser Leben uns abgemüht: jene haben Hügel erhoben, [160] wir nicht einmal unsere Stimme; jene haben die Mauern gebrochen, wir haben nicht einmal die schwachen Fesseln in unsern Herzen gesprengt. Und doch versagte er den Erfolg den Tätigen [165] wegen uns Trägen; die Arbeit draußen achtete er nicht, während er selbst drinnen mißachtet wurde.</p><p>Er überging die Sprachbegabten und traf das Stumme; [170] die Mauer ward hinfällig, das Volk aber empfing eine Lehre. Er verschonte die Leidensfähigen und schlug das Leidensunfähige. Für uns selbst, die wir empfinden, [175] schlug er die Steine, die unempfindlich sind, um uns eine Lehre zu geben. In seiner Liebe sah er von unserem Leibe ab und schlug eilends unsere Mauer.</p><p>Wer hat jemals gesehen, [180] daß eine Bresche zu Spiegel geworden ist? Von beiden Seiten konnten sie hineinsehen, er diente denen drinnen und denen draußen, sie konnten in ihm gleichsam mit den Augen schauen die Macht, die zerstört und aufrichtet, [185] sie sahen jenen, der eine Bresche schlägt und wieder schließt. Die Belagerer sahen seine Macht, machten sich davon, ohne den Abend zu erwarten; die Belagerten sahen seine Hilfe und dankten ohne Ende.</p><p>[190] Der Tag deiner Rettung möge deine Saumseligkeit aufrütteln. Als die Mauer barst, und als die Elephanten hervorbrachen, als die Pfeile herabregneten, [195] als die Kämpfer wüteten, da war es ein Schauspiel für die Himmlischen: die Sünde kämpfte, aber die Gnade behielt die Oberhand. Hienieden siegte die Barmherzigkeit, [200] die Engel oben jauchzen auf.</p><p>Und es strengte sich dein Feind an, durch seine Listen die Mauer, die dich als Schutzwall deiner Bewohner umgab, zu brechen; [205] er mühte sich ab, aber er hatte keinen Erfolg. Und damit er sich nicht etwa der Hoffnung hingebe, daß, wenn er sie gebrochen hätte, er auch eindringen und uns wegführen könnte, durchbrach er sie nicht nur einmal und wurde zuschanden, sondern [210] sogar dreimal [tat er es], damit er dreifach in den drei Versuchen beschämt werde.</p><p>Möge auch mir in dir durch die Gnade das große Glück zuteil werden, daß, nachdem in dir meine Sünden zahlreich geworden sind, [215] auch meine Früchte in dir vermehrt werden, und wenn in dir meine Jugend gesündigt hat, so möge in dir mein Greisenalter Gnade finden. Mit dem Munde deiner Kinder flehe für deinen Sohn, der ich über meine Kräfte gesündigt und unter meinen Kräften gebüßt habe; ich habe gesät ohne Maß und geerntet nur ein geringes Maß.</p><p>Ein zweites Lied nach derselben Melodie.</p><p>Gottes Wesen und Beziehungen [Arianismus] erforschen zu wollen, ist zwecklos; er hat die Menschheit angenommen, um uns auch durch Heimsuchungen ihm ähnlich zu machen. Diesem Zwecke diente auch die Belagerung der Stadt. Die ersten Strophen enthalten ähnliche Gedanken, wie sie in den Gedichten gegen die Grübler niedergelegt sind; Bickell ist der Meinung, daß dieser erste Teil des Gedichtes sich gegen die Arianer richte. – Die Strophenanfänge ergeben als Akrostichon Qôlan Nesbaje anan, d. h. unsere Stimme, o Nisibener klagt.</p><p>Gib Festigkeit unserm Gehör, damit es nicht losgelassen in die Irre gehe! Ein Irrtum ist es, forschen zu wollen, wer er ist und wem er gleicht; [5] denn wie können wir imstande sein, ein Bild jenes in uns wiederzugeben, dessen Wesen dem Intellekt gleichsteht. In ihm gibt es keine Beschränkung; er ist ganz sehend und hörend, [10] er ist gleichsam ganz sprechend, er ist ganz in allen Regungen. – [Kehrvers:] Preis sei dem einen Wesen, das unerforschlich für uns ist!</p><p>Sein Aussehen ist unbegreiflich, [15] um in unserm Geiste dargestellt zu werden. Er hört ohne Ohren, er spricht ohne Mund, er wirkt ohne Hände, sieht ohne Augen, [20] so daß unser Geist dabei keine Befriedigung findet und abläßt von dem, der so beschaffen ist. Er aber bekleidete sich in seiner Güte mit dem Kleide der Menschheit und sammelte uns zu seiner Nachahmung.[25] Lasset uns nun lernen, wie er, ein Geisteswesen, mit Menschenleib auftrat und so, obschon ein reiner Geist, wie ein Zürnender erschien. [30] Zu unserm Heile war’s, daß sein Wesen sich uns in unserer Gestalt ähnlich machte, damit wir ihm ähnlich würden. Einer nur ist, der ihm gleicht, sein Sohn, der von ihm ausging, [35] der geprägt ist nach seinem Bilde.</p><p>Nisibis, höre dies, denn deinetwegen ist so geschrieben und gesprochen. Sowohl dir wie andern auf dem Erdenrund [40] warst du ein Grund zu Heimsuchungen und Bußpredigten; mancher Mund hat über dich, o du Belagerte, geweissagt; da du nun, errettet, triumphierst, [45] öffnet sich ihr Mund in dir zu Lob- und Dankesliedern.</p><p>Das Gebet deiner Bewohner reichte hin zur Errettung, nicht weil sie gerecht, [50] sondern weil sie bußfertig waren. Wie sehr sie auch gefrevelt hatten, so beugten sie sich doch, ein Gemisch von Sünden und Vorzügen, unter der Zuchtrute. Möchten doch sie, die groß waren in Sünden, [55] auch groß sein in ihren [guten] Früchten, möchten sie, nachdem sie sich in Sack und Asche ausgezeichnet haben, auch ihre Kronen erringen!</p><p>Der Tag deiner Errettung ist der König aller Tage. [60] Ein Sabbat hat deine Mauern umgestürzt, gestürzt die unzuverlässigen; der Auferstehungstag des Sohnes [Sonntag] hat dich von deinem Falle aufgerichtet, der Auferstehungstag hat dich auferweckt, wie sein Name sagt, [65] und hat so seinem Namen Ehre gemacht: der Sabbat verließ seine Wache, und durch das Werk seiner Breschen fügte er sich selbst Schande zu.</p><p>In Samaria wurde der Hunger übermächtig, [70] in dir aber herrschte Überfluß; doch bald kam für Samaria wieder die Fülle, für dich aber kam plötzlich das Meer herangebraust. [75] In jenem wurde das Kind verzehrt, und dieses rettete ihm das Leben, in dir wird der lebendige und lebenspendende Leibgenossen, – gar schnell rettete er sie, der Genossene seine Genießer.</p><p>[80] Sicher ist, daß jener Gütige kein Wohlgefallen hat an Heimsuchungen, die zu allen Zeiten eintreten, obgleich er selbst sie schickt: unsere Sünden sind [85] die Ursachen unserer Qualen. Kein Mensch darf den Schöpfer beschuldigen, er ist es, der uns beschuldigen kann; denn wir haben gesündigt und ihn zu zürnen genötigt, obgleich er es nicht wollte, [90] und zu strafen, obgleich er kein Wohlgefallen daran hat.</p><p>Erde, Weinstock und Olive bedürfen der Zucht: erst wenn der Ölbaum geschlagen wird, geben seine Zweige [die Früchte] ab. [95] Erst wenn der Weinstock beschnitten wird, werden seine Früchte schön; erst wenn der Boden gepflügt wird, wird sein Ertrag gut; erst wenn das Meer mit den Rudern gepeitscht wird, unterwirft es sich; [100] Erz, Silber und Gold glänzen erst, wenn sie geglättet sind.</p><p>Wenn nun der Mensch alles dadurch verbessert daß er es in Zucht nimmt, [105] und wenn alles unschön und widerwärtig ist, falls er ihm seine Sorge versagt, so mögen wir aus dem Umstande, daß er Zucht anwendet jenen kennen lernen, der ihn in Zucht nimmt. Während aber jeder, der etwas in Zucht nimmt, es tut zu seinem Nutzen – denn jeder, [110] der seine Sklaven züchtigt, tut es, um sie sich zu unterwerfen –, erzieht der Gütige seine Knechte, damit sie sich selbst besitzen.</p><p>Es mögen so deine Bedrängnisse werden zu Chroniken der Erinnerung für dich; [115] denn die dreimal Eingeschlossenen werden hinreichen, um dir als Bücher zu dienen, in deren Berichten du zu jeder Stunde betrachten magst. Weil du die beiden Testamente zu gering geschätzt hattest, [120] um in ihnen dein Heil zu suchen, darum schrieb er dir drei schwere Bücher, damit du in ihnen deine Heimsuchungen erforschest.</p><p>Lasset uns also mit dem Vergangenen [125] das Zukünftige abwenden; lassen wir uns belehren durch das Erlebte, um Kommendes zu vermeiden; seien wir eingedenk dessen, was vorangegangen ist, damit wir Zukünftigem entgehen. [130] Da wir den ersten Schlag vergessen hatten, traf uns ein weiterer, da wir auch den zweiten nicht beachteten, ist ein dritter auf uns niedergefallen; wer wird nun noch einmal vergessen?</p><p><em>Dieser Hymnus ist unvollständig überliefert, da ein Blatt ausgefallen ist; er enthielt hauptsächlich Bitten um Frieden, um Hilfe gegen den herannahenden Feind und um baldige Heimkehr der Flüchtlinge. Nach Bickell fällt die Abfassung ins Frühjahr 359.</em></p><p>Nach der Melodie: Seufzend deine Herde.</p><p><em>Um den Vormarsch Sapors aufzuhalten, hatten die Römer im Frühjahr 359 alles Land in der Umgebung verwüstet und geplündert [vgl. Ammianus Marcellinus 18,3]; Nisibis bittet, daß das Nötigste erhalten bleiben möchte. – Der Hymnus ist ein alphabetischer; teilweise treten einzelne Buchstaben wiederholt auf, doch ist das Alphabet nicht zu Ende geführt.</em></p><p>Laß hören in deiner Gnade Rettungsbotschaft! Indem unser Gehör zur Durchgangspforte geworden ist [5] haben furchtbare Nachrichten unser Gemüt erschüttert. – [Kehrvers] Preis sei deinem Siege, Ruhm deiner Herrlichkeit!</p><p>Ermutige mit Erträgen, [10] wenn auch klein und gering, jene, die nur Schaden bei ihren Mühen davongetragen haben; in Zeiten des Gewinnes [Ernte] wurde Mangel ihr Anteil.</p><p>[15] Ersichtlich ist’s, daß jener Zorn mitten in die Welt getreten ist; Verlust und Gewinn verteilte er übelwollend, bald Vernichtung bringend, [20] bald Glück im Übermaß.</p><p>Um so zu zeigen, daß er die Macht hat, hat er auf jede Weise mich heimgesucht; er hat, als er sah, daß mir die Verfolger furchtbar vor den Augen standen, [25] mich vor meinen Kindern zu Boden gestreckt, und es haben mich meine Freunde geschlagen.</p><p>Ja, er lehrte mich, nur ihn zu fürchten und nicht die Menschen. Wenn niemand ist, der uns schlägt, [30] da greift sein Zorn befehlend plötzlich ein, und jeder streckt sich hin, und er ist’s, der die Schläge austeilt.</p><p>Und sogar den Babylonier, der alle Könige unterworfen hatte, ließ er, [35] als er hoffend sich vermaß, daß niemand mehr wäre, der ihm entgegentrete, sich selbst mit eigener Hand zerfleischen.</p><p>Seine Majestät und sein Geist [40] verschwanden auf einmal plötzlich; er zerriß und warf die Kleider von sich, lief fort und irrte in der Wüste umher; zunächst verfolgte er sich dann selbst, dann verfolgten ihn seine Knechte.</p><p>[45] Er zeigte so allen Königen, die er in die Gefangenschaft geführt hatte, daß nicht er mit seiner Macht es vollbracht hatte, sie zu unterjochen, sondern die Macht, die ihn selbst nun traf, [50] sie war es, die sie gezüchtigt hatte.</p><p>Ich habe ertragen und ausgehalten, Herr, die Schläge meiner Beschützer; du vermagst in deiner Gnade Gutes zu vollbringen durch die Feinde, [55] du kannst aber auch in deiner Gerechtigkeit züchtigen durch die Helfer.</p><p>An dem Tage, an welchem das Heer gegen Samaria zum Angriff heranzog, mußten [die Feinde] Genüsse und Freuden, [60] Schätze und Reichtümer völlig im Stich lassen und fliehen; er bereicherte es durch seine Belagerer.</p><p>Es umgaben mich meine Freunde mit einer Mauer, Hilfe brachten meine Befreier, [65] aber wegen der Sünden meiner Bewohner suchten mich meine Helfer heim. Gib mir zu trinken von meinen Reben einen Becher des Trostes.</p><p>Die Ähre und den Weinstock, Herr, [70] beschütze in deiner Gnade. Es bringe Trost dem Landmanne der Weinstock des Winzers, Freude bereite dem Winzer die Ähre des Landmannes.</p><p>[75] Ähre und Rebe gehören zueinander; auf dem Felde vermag der Wein die Schnitter zu erquicken, im Weinberge hinwieder [80] gibt das Brot dem Winzer Kraft.</p><p>Auch mich könnten diese beiden in meinen Sorgen trösten, doch mehr vermag mit seinem Troste der Dreieinige, [85] den ich preisen muß, weil ich sobald durch seine Gnade errettet wurde.</p><p>Wenn nun jemand, dessen Leben durch die Güte erhalten blieb, murrend einhergeht [90] wegen des Verlustes seines Vermögens, dann zeigt er sich unwürdig der Gnade dessen, der ihn verschonte.</p><p>Nach seinem Ratschlüsse wollte er das eine an Stelle des andern vernichten; [95] er vernichtete das Vermögen und ließ den Besitzer am Leben, er zerstörte unsere Pflanzungen an Stelle unseres Lebens.</p><p>Hüten wir uns, zu murren, [100] damit nicht sein Zorn erwacht und er den Besitz zwar verschont, die Besitzer selbst aber schlägt, und wir so am Ende einsehen, daß zuvor [beim Verlust des Vermögens] doch nur die Gnade waltete.</p><p>[105] Möchten wir doch einsehen, wogegen wir uns eigentlich auflehnen müßten! Lerne anzukämpfen nicht gegen den Erzieher, sondern gegen deinen Willen, [110] der dich zur Sünde reizt und straffällig macht.</p><p>Lassen wir ab vom Murren und widmen wir uns dem Gebete! Denn wenn der Besitzer untergeht, hört für ihn auch sein Vermögen auf, [115] solange er aber am Leben bleibt, kann er dem Verlorenen nachgehen.</p><p>Möchten doch die Tröstungen recht zahlreich werden durch das Erbarmen mit meinen Bewohnern! Was uns noch als Rest geblieben, [120] möge uns inmitten des Strafgerichtes zum Tröste gereichen; laß uns über dem, was noch erhalten ist, den Schmerz über das Verlorene vergessen.</p><p>Pflege und laß wachsen, o Herr, die Pflanzen, die das Strafgericht übrig ließ; [125] sie gleichen den Kranken, die die Pest überstanden haben. Laß mich bei dem Wenigen den Schmerz über das Viel vergessen!</p><p>Bei diesem meinem Worte, Herr, denke ich daran, daß in diesem Monat die Ranke [des Weinstockes] welk und krank geworden ist; möchte sie wieder zu Kräften kommen und uns Trost bereiten.</p><p>[135] Sie sind ja der Pest entronnen, die ihre Brüder dahingerafft hat. Obschon stumm, klagen die Reben, daß vor ihnen abgeschnitten daliegen in Menge [140] die Bäume, ihre Freunde.</p><p>Nach dem Verkehr mit den Pflanzen sehnt sich die Erde; es weinen die Wurzeln über die Landleute und machen [jene] weinen. [145] Ihre Pracht entfaltete sich und gab Schatten, und doch vernichtete sie eine einzige Stunde.</p><p>Es nahte die Axt und schnitt sie ab, sie hat auch den Landmann verwundet. Das Abschneiden der Bäume [150] war ein Schmerz für den Landmann; von jedem Schlag der Axt fühlte er den Schmerz.</p><p><em>Behandelt ebenfalls die Verwüstungen des Landes. In der dreißigsten Strophe findet sich eine Zeitbestimmung, wonach diese Ereignisse [und wohl auch die Abfassung des Gedichtes] in den Monat Mai zu verlegen sind; es sei das Himmelfahrtsfest und das der Märtyrer auf einen Tag gefallen, welcher, da es sich um das Jahr 359 handelt, nach Bickell der 13. Mai gewesen sein muß. – Die einzelnen Strophen beginnen mit den Buchstaben des Alphabets, doch traten eine Reihe von Buchstaben mehrfach auf.</em></p><p><em>Am Schluß unvollständig; das vorhandene Stück fordert zur Buße auf, da die Heimsuchungen eine Folge der Sünde seien.</em></p><p><em>fehlt.</em></p><p><em>Am Anfang unvollständig; die vorhandenen Strophen beginnen sämtlich mit dem Buchstaben B. Der Dichter mahnt, von heidnischem Wesen abzulassen, da sonst Gott nicht helfen wird.</em></p><p>Der dritte Hymnus über die Festung Anazit, nach derselben Melodie.</p><p>*Nach der besonderen Numerierung waren hier fünf Hymnen [8 – 12] mit der gleichen Melodie zusammengefaßt.</p><p>Anazit ist nach Bickell dieselbe Stadt, die bei Ammianus 19. 6. 1 Ziata heißt; ihre hier geschilderte Eroberung fiele demnach in die Zeit der Belagerung Amidas durch Sapor [Sommer 359]; Schilderung nach Ammian bei O. Seeck, Geschichte des Untergangs der antiken Welt 4, S. 227 f. und Gibbon-Burey, The History of the Decline and Fall of the Roman Empire 2, S. 268 f. An Nisibis war Sapor diesmal vorübergezogen, ohne es zu belagern, wohl weil er durch die trüben Erfahrungen bei den früheren Belagerungen belehrt war. Dafür wurde das Gebiet und die Orte der Gegend von Amida um so mehr heimgesucht, darunter dürfte auch Anazit gewesen sein, das wir wohl dem Hauptort der armenischen Provinz Hanzit gleichzusetzen haben; auch im Syrischen wird die Stadt Anzit oder Anazit oder Hanzit genannt. Wenn Bickells Annahme der Identität von Anazit-Ziata zutrifft, dann würde es sich um das heutige Karput handeln. Doch ist es eher das etwas südöstlich von Karput gelegene Thilenzid, das schon keilschriftlich als Enzite bezeugt ist. Vgl. Assemani, Bibl. Orient. II, dissert. de Monoph. S. 64 und besonders die Angaben der griechischen und orientalischen Quellen bei H. Hübschmann, Die altarmenischen Ortsnamen [Indogermanische Forschungen, 16. Bd., S. 301 ff.]. – Ein anderes Anazit [Handzit] liegt nach Ibn Serapion zwischen Malatia und Semsat [Journal of the Royal Asiatic Society 1895, S. 10 und 49].*</p><p><em>Das Gedicht schildert die durch Hitze und Durst verursachten Leiden, die schließlich zur Übergabe führten, sehr anschaulich, teilweise sogar für unser Empfinden zu realistisch. – Das Vers 60 genannte Wasser wäre nach Hübschmann der Böjuk-Tschai, ein Nebenfluß des Murad-su, des östlichen Quellarmes des Euphrat.</em></p><p>Meine Kinder sind hingeschlachtet und meine Töchter, die fern von mir sind; ihre Mauern niedergerissen, ihre Kinder zerstreut, [5] ihre Heiligtümer zertreten. – [Kehrvers:] Gepriesen seien deine Heimsuchungen!</p><p>Die Jäger haben von meiner Feste meine Tauben gefangen, die ihre Nester verlassen hatten [10] und in Höhlen geflohen waren; in Netzen fingen sie sie.</p><p>Wie Wachs vor dem Feuer schmilzt, so zerschmolzen und vergingen die Leiber [15] meiner Söhne vor Hitze und Durst in den Befestigungen.</p><p>Anstatt der Quellen und der Milch, die für meine Söhne und Kinder flossen, [20] fehlt nun die Milch den Kleinen und das Wasser den Großen.</p><p>In Todeszuckungen, entfällt das Kind der Mutter, denn es kann nicht mehr saugen, [25] und sie vermag es nicht mehr zu stillen; sie geben den Geist auf und sterben.</p><p>Wie konnte deine Güte ihrem Ausfluß Zügel anlegen, [30] da doch die Fülle ihrer Quelle nicht verstopft werden kann?</p><p>Und wie hat da deine Güte ihr Mitleid gezügelt und sein Ausströmen gehemmt [35] dem Volke gegenüber, das aufschrie, daß es seine Zunge befeuchten könnte?</p><p>Und es war da ein Abgrund zwischen ihnen und ihren Brüdern, wie bei dem Reichen, [40] der rief, und keiner war, der ihn erhörte und seine Zunge anfeuchtete.</p><p>Und gleichsam mitten ins Feuer wurden die Unglücklichen geworfen, [45] und Gluthitze strömt das Feuer inmitten des Durstes aus, und es brannte in ihnen.</p><p>Es zerschmolzen ihre Glieder und wurden von der Hitze aufgelöst; [50] da tränkten die Verdursteten wieder die Erde mit ihren verwesenden Körpern.</p><p>Und die Festung, die ihre Bewohner durch den Durst ermordet hat, [55] trank nun wieder die sich auflösenden Leichname derer, die vor Durst dahingeschwunden waren.</p><p>Wer sah je ein Volk, von Durst gequält, [60] wie es eine Mauer von Wasser umgibt, und es doch nicht seine Zunge benetzen kann?</p><p>Mit dem Urteil von Sodom wurden auch meine Lieben gerichtet, und meine Kinder wurden heimgesucht [65] mit der qualvollen Strafe Sodoms, die nur einen Tag dauerte.</p><p>Die Qual des Feuertodes, Herr, währt nur eine Stunde, aber im langsamen Verdursten [70] steckt ein langsamer Tod und eine brennende Qual.</p><p>Nach meinen Schmerzen und bitteren Leiden ist dies, Herr, ein neuer Trost, [75] mit dem du mich getröstet hast, daß du meine Traurigkeit vermehrt hattest.</p><p>Die Medizin, die ich erwarte, möge mir der wahre Schmerz, den Verband, den ich wünsche, [80] möge mir die bittere Zerknirschung bringen.</p><p>Und wenn ich erwartet hatte, dem Sturm zu entrinnen, ward mir der Sturm [85] im Hafen gefährlicher als der im offenen Meer.</p><p>Und wenn ich gehofft hatte in meiner Beschränktheit, daß ich emporgeklommen und entstiegen sei der Grube, [90] so warfen mich meine Sünden wieder mitten hinein.</p><p>Sieh, Herr, meine Glieder, wie sehr die Schwerter mich getroffen und auf meinen Armen Male hinterlassen haben, [95] und die Narben von den Pfeilen, die meinen Seiten aufgeprägt sind.</p><p>Tränen in meinen Augen, [Unglücks-] Kunde in meinen Ohren, Weherufe in meinem Munde, [100] Trauer in meinem Herzen – halte ein, o Herr!</p><p>Der vierte Hymnus nach derselben Melodie.</p><p><em>Über den sittlichen Wert der Heimsuchungen. – Der Hymnus ist alphabetisch, mit dem Buchstaben M beginnend; mit S [und zwar mit dem gleichen Wort] beginnen mehrere Strophen.</em></p><p>Deine Züchtigung ist wie eine Mutter für unsere kindliche Torheit, wohltätig ist dein Tadeln, womit du die Kinder abhältst vom Spielen, [5] damit sie weise werden. – [Kehrvers:] Preis sei deiner Gerechtigkeit!</p><p>Betrachten wir deine Gerechtigkeit – wer kann freilich ihre Hilfsmittel ausmessen! – [10] wie durch sie oft die Lasterhaften zur Einsicht kommen.</p><p>Vielfach heilt, o Herr, ihre Hand die Kranken; denn sie ist eine verborgene [15] Heilkraft ihrer Leiden und eine Quelle ihres Lebens.</p><p>Sehr fein ist der Finger der Gerechtigkeit, mit Liebe und Schonung [20] berührt er die Wunden dessen, der geheilt werden soll.</p><p>Sehr ruhig und sanft ist ihr Schneiden an dem, der verständig ist; ihre scharfe Medizin [25] nimmt durch ihre starke Liebe die Fäulnis hinweg.</p><p>Sehr angemessen erscheint dem Einsichtigen ihr Zorn, verhaßt sind ihre Heilmittel [30] nur dem Toren, der sich am Mißbrauch seiner Glieder ergötzt.</p><p>Eiligst verbindet sie, was sie aufgeschnitten hat, sobald sie geschlagen hat, zeigt sie sich mild; [35] durch beides führt sie Heilung herbei.</p><p>Sehr angemessen ist ihr Zorn und wohltätig ihr Unwillen und süß ihre Erbitterung [40], die süß macht die Bitteren, damit sie wohlgefällig werden.</p><p>Ein Anlaß zur Untätigkeit ist dein Ausruhen für die Trägen, eine Ursache des Gewinnes [45] ist deine Rute für die Faulen, damit sie eifrig [wörtlich: Kaufleute] werden.</p><p>Die Ursache unseres Eifers ist deine Gerechtigkeit, die Ursache unseres Nachlassens [50] die Gnade, denn unsere Einsicht ist beschränkt.</p><p>Pharao wurde hart infolge deiner Gnade, denn sobald seine Strafen nachließen, [55] wurde seine Bosheit stärker, und er hielt seine Versprechungen nicht.</p><p>Es zahlte ihm aber die Gerechtigkeit heim, weil er so oft ihre edle Schwester getäuscht hatte; [60] auch ihn bezwang sie, damit er nicht noch mehr den Zorn herausfordere.</p><p>Meine Falschheit, Herr, dämme ein, die täuschen möchte wie Ägypten; meine Gebete aber mögen überzeugen, [65[ daß ich nicht bin wie jenes, da ich deine Pforte nicht verlassen habe.</p><p>Dein Kreuz, Herr, das sich auf der offenen Bresche erhob, möge auch die verborgenen schließen, [70] denn anstatt äußerer Feinde zerreißen mich nun innere.</p><p>Das Meer brach hervor und warf den Turm um, mit dem ich mich brüstete; es wagt der Frevel, [75] einen Tempel zu errichten, vor dem ich erröten muß; seine Opfer ersticken mich.</p><p>Meine Gebete auf den Mauern haben meine Verfolger gehört, zuschanden ward in ihren Magiern [80] die Sonne und ihre Anbeter, da ich mit dem Kreuze triumphierte.</p><p>Es schrien die Geschöpfe auf, als sie den Kampf sahen, die Wahrheit kämpfte mit dem Irrtum [85] auf stürzender Mauer und trug den Sieg davon.</p><p>Die Kraft der Wahrheit schlug den Irrtum, in ihren Schlägen mußte er sie fühlen, [90] und an seiner Ruchlosigkeit konnte er ihre Reinheit ermessen.</p><p>Eine große Furcht beschleicht mich, da nach der Errettung die Großen und Mächtigen, [95] die auf meinem Altare opferten, nun in mir Altäre bauen.</p><p>Wenn meine sieben SinneQuellen des Weinens wären, [100] würden meine Tränen nicht hinreichen, um unseren Fall zu beweinen.</p><p>Die Straßen, die in Sack und Asche um Hilfe schrien, sind nun mit Spiel beschäftigt, [105] einem ähnlichen, wie jenes in der Wüste vor dem Kalb.</p><p>Das Gift verlangt nach der Schönheit der Lilie und bekleidet sich damit, und wenn ihre Triebe noch versteckt [110] und verborgen sind, treiben ihre Bitterkeiten schon Keime.</p><p>Der fünfte Hymnus nach derselben Melodie.</p><p><em>Die Strophenanfänge ergeben als Akrostich den Namen Ephräm, aber unter Verdoppelung einiger Buchstaben.</em></p><p>In meinen Bedrängnissen rufe ich an die Macht, die alles stärkt; denn sie kann auch überwältigen den wütenden Eroberer, [5] wie sie bezwang die Legion [der Dämonen]. [Kehrvers:] Preis sei seiner Gnade!</p><p>Es hat mir der Böse heimgezahlt die Schulden, die er nicht von mir lieh, es hat mir auch der Gütige wiedergegeben [10] die Barmherzigkeit, die ich nicht an ihn ausgeliehen: wohlan, staunet über beides!</p><p>Der Gütige übergab meine Schulden der Gnade zum Anteil, meine Heimsuchung seiner Gerechtigkeit; [15] meine Schulden tilgte seine Gnade, meine Plage rächte sein Gericht.</p><p>Die Sünde geriet in Aufregung und blieb in Verwirrung, als sie die Gnade sah, [20] wie sie die Freiheit stärkte, damit sie die Laster besiege.</p><p>Entbrenne Herr, und gieße deine Liebe aus, öffne, gieße aus deinen Zorn; deinen Zorn zum Vernichten, [25] deine Liebe, um die Gefangenen dem Eroberer zu entreißen.</p><p>In jenen Tagen, in welchen sich der Böse anschickte, um mich wie mit einer Schleuder ins Verderben zu schleudern, [30] damals umgab rettend der Gütige mein Leben mit einer lebendigen Hülle.</p><p>Die Redner, die nicht aufhören, jederzeit zu rühmen, daß sie mich in den Wogen gerettet haben [35] und mich gehalten haben, damit ich nicht falle, sie mögen, Herr, Dank sagen für mich.</p><p>Denn wer hat es jemals gekonnt gegenüber der Gnade der Barmherzigkeit, die ihn umgibt, [40] so daß auch ich es vermöchte, die Barmherzigkeit zu preisen, die mich [mit einem Walle] umgab?</p><h3>2. Die Bischöfe von Nisibis.</h3><p>Die Hymnen 13 – 21 enthalten eine Anzahl geschichtlicher Anspielungen, besonders in den Vergleichen zwischen den drei ersten Bischöfen. Für die Feststellung der Bischofsliste von Nisibis ergibt sich aus ihnen das wichtige Resultat, daß Jacobus der erste Bischof war [ob der älteste überhaupt?], nicht Babu. wie das Opus chronologicum des Elias von Nisibis will; es heißt da unter Angabe der Quelle, des Bischofskatalogs von Nisibis [Corpus Scriptorum Christianorum Orientalium, Scriptores Syri, Ser. III, tom. 7, S. 97 u. ff.): Im Jahre 300/1 wurde Babu zum Bischof von Nisibis eingesetzt, und weil er den Grad eines Metropoliten nicht hatte, wurde sein Name in den Diptychen hinter dem des Mar Jakob gesetzt. – Im Jahre 308/9 starb Babu, Jacobus tritt an seine Stelle. – 337/8 berichtet dieselbe Quelle den Tod des Jacobus und die Einsetzung des Walagesch [Walgesch — Vologeses], dessen Tod beim Jahre 360/1 angegeben ist und dessen Nachfolger Abraham wird. In dieser Anordnung steht das Opus Chronologicum nicht allein, auch im Chronicon Edessenum [Corpus etc. tom. IV, S. 4] folgt Walagesch unmittelbar auf Jacobus; darum ist man bisher dieser Darstellung gefolgt [Assemani, Bibliotheca orientalis I, S. 18; III, II, S. 768; J. Labourt, Le christianisme dans l’empire Perse, Paris 1904, S. 2, Anm. 6]. Trotzdem dürfte es richtiger sein, der wiederholt [17, 106 ff.; 19, l5l ff.] von Ephräm, einem Zeitgenossen, in diesen Gedichten festgestellten Reihenfolge den Vorrang zu geben, zumal im Hinblick auf die merkwürdige Begründung der Umstellung in jener Quelle des Opus chronologicum, die eher auf einen späteren Eingriff in die Reihenfolge schließen läßt. Außerdem überliefern nach Assemani, Bibl. Orient. I, S. 18 auch die arabischen Chronisten el Makin und Abulfaragius die Reihenfolge: Jacobus, Babu. Die Zeitereignisse unter den vier Bischöfen Jacobus, Babu, Walagesch [oder Walgesch, wie bei Ephräm] und Abraham sind nach den Andeutungen in den folgenden Gedichten von Bickell, S. 20 f. scharfsinnig ausgelegt und dargestellt.</p><p>Die Abfassungszeit von Nr. 13 und 14 läßt sich ziemlich genau bestimmen, da gesagt wird, daß unter dem dritten Bischof [Walagesch] Friede geherrscht habe; das stimmt nur bis 359, doch sind auch die Verhandlungen des Jahres 358 zwischen Römern und Persern erwähnt. Nr. 15 – 16 sind etwas später anzusetzen, da schon von dem Beginn der Unruhen gesprochen wird. Nr. 17 – 21, über den Bischof Abraham, dürften nach Bickell im Jahre 363 verfaßt sein, da der Tod Julians angedeutet, die Übergabe von Nisibis aber noch nicht erwähnt ist.</p><p>Über Mar[i] Jakob und seine Amtsgenossen.</p><p>Nach der Melodie: Wunderbar ist alles, was du ertragen.</p><p>Die drei glorreichen Priester haben wie die zwei Himmelsleuchteneinander abgelöst und Bischofsstuhl, Handauflegung und Herde einander übertragen. [5] Zwar ist unsere Trauer groß um die beiden ersten, doch gibt uns der letzte vollen Trost. – [Kehrvers:] Preis sei dir, der du sie auserwählt!</p><p>Der, welcher die zwei Leuchten schuf, wählte sich drei Leuchten aus [10] und stellte sie in den drei Finsternissenauf, die uns einschlossen; ein Paar der Leuchten sind erloschen, die letzte strahlt in vollem Glanz.</p><p>Die drei Priester als Schatzbewahrer [15] besaßen in ihrer Treue den Schlüssel zu einer Dreiheit: drei Pforten öffneten sie uns, ein jeder von ihnen öffnete mit seinem Schlüssel zu seiner Zeit seine Pforte.</p><p>[20] Durch den ersten öffnete er die Pforte der Heimsuchung, die über uns kam, durch den mittleren öffnete er die Pforte der königlichen Würde, die bei uns Einzug nahm, durch den letzten öffnete er die Pforte [25] für die Hoffnung, die sich bei uns erhob.</p><p>Durch den ersten öffnete er das Tor zum Kampfe beider Völker, durch den zweiten öffnete er die Pforte den Königen von beiden Windrichtungen, [30] durch den dritten öffnete er die Pforte für die Gesandten von beiden Seiten.</p><p>Durch den ersten öffnete er die Pforte für den Krieg wegen der Sünden, durch den zweiten öffnete er die Pforte [35] den Königen zum Kampfe, durch den letzten öffnete er die Pforte den Gesandten aus Barmherzigkeit.</p><p>Sieh, an diesen dreien, die aufeinander folgten, läßt sich wie in einem geheimnisvollen Bild [40] der Zorn mit der Sonne vergleichen; er fing an bei dem ersten, wurde stärker bei dem zweiten, versank und verlöschte bei dem letzten.</p><p>Auch die Sonne zeigt ein dreifaches Aussehen [45] in drei verschiedenen Zeiten; hell und leuchtend von Anfang, heftig brennend in der Mitte, am Ende sanft und lieblich, wie eine Lampe, die verlöscht.</p><p>[50] Mild und leuchtend ist der Anfang, wenn sie kommt, um die Schläfer zu wecken, heiß und brennend ist sie am Mittag, um die Früchte zur Reife zu bringen, sanft und angenehm, [55] wenn sie der Vollendung entgegengeht.</p><p>Wer ist jene geweihte Jungfrau, gepriesen von allen Frauen, bei der die Nachfolge sich so vollzieht, deren Weihen so zahlreich sind, [60] deren Stufen so aufsteigen, deren Lehrer so hervorragend sind?</p><p>Besaß nur die Tochter Abrahams [d. h. das Volk Israel] solche Formen, oder nicht auch du, geweihte Jungfrau, [65] deren Schönheit auch der Schmuck entsprach? Wie ihre Zeit, war auch ihre Hilfe, und wie ihre Hilfe, ihr Vollstrecker.</p><p>Wenn mangelte, was sie bedurfte, so kam die Erfüllung ihres Mangels; [70] ihre Väter waren ihren Kindern angepaßt, ihre Lehrer ihren Fähigkeiten, ihre Erziehung ihrem Wachstum, ihre Kleidung ihrer Gestalt.</p><p>Abgewogen gab die Gnade [75] alles wie auf einer Wage, sie brachte es ins Gleichgewicht, damit aus ihnen Nutzen hervorgehe; sie setze sie fort in der Nachfolge, damit aus ihnen die Vollendung hervorsprieße.</p><p>[80] In den Tagen des ersten war tiefer Friede, in den Tagen des zweiten kamen und gingen die Könige, in den Tagen des letzten [85] drohten die Heere und verschwanden wieder.</p><p>Mit dem ersten trat Ordnung ein, sie kam mit ihm und ging mit ihm fort, mit dem zweiten näherte und entfernte sich wieder die Krone, die unsere Kirchen erfreut, [90] mit dem letzten stieg die Gnade zu uns herab, die nicht vergolten werden kann.</p><p>Gegen den Zorn am Anfang wendete sich die Sorge des ersten, gegen die Hitze des Mittags [95] erhob sich der Schatten des zweiten, gegen den schmählichen Frieden richtete der letzte viele Ermahnungen.</p><p>Dem ersten Belagerer ging der erste ruhmreiche Priester entgegen, [100] dem zweiten Belagerer trat der zweite mildherzige Priester entgegen, die Gebete des letzten schlossen unbemerkt unsere Breschen.</p><p>Nisibis ist auf Wassern erbaut, [105] verborgenen und offenen Wassern, lebendige Quellen sind innerhalb, ein stolzer Fluß außerhalb; der Fluß draußen betrog sie [die Stadt Nisibis], die Quelle drinnen rettete sie.</p><p>[110] Der erste Priester, ihr Gärtner, machte ihre Triebe bis in den Himmel wachsen: er starb und ward in ihr begraben, und als Frucht verblieb er in ihrem Busen; als nun die Schnitter kamen, [115] da rettete sie die Frucht in ihrem Busen.</p><p>Es kam nun die Zeit, da sie abgeschnitten werden sollte, es drang jener ein, der ihren Gärtner hinwegführen wollte, damit er nicht mehr für sie beten könnte; eilig barg sie in ihrer Klugheit [120] ihren Gärtner in ihrem Busen, damit sie Rettung fände durch ihren Gärtner.</p><p>Kluge Töchterstädte von Nisibis, werdet ähnlich Nisibis, die den Körper in sich barg, [125] und er ward zum Bollwerk nach außen; berget in euch den lebendigen Leib, damit er das Bollwerk eures Lebens sei.</p><p><em>In diesem Hymnus werden in ganz ähnlicher Weise wie im vorhergehenden die Vorzüge der drei Bischöfe gepriesen.</em></p><p><em>Lobeshymnen auf den letzten der drei Bischöfe, Vologeses, dessen Fähigkeiten als Prediger besonders hervorgehoben werden. Gegen Schluß des 16. Hymnus nimmt er die Vergleiche der drei Hirten untereinander wieder auf, die schon einen großen Teil von 13 – 14 ausmachten. Er legt 16,81 ff. der Stadt Nisibis folgende Worte in der Mund:</em></p><p>In der Ausgelassenheit des Jugendalters hatte ich einen strengen Erzieher, seine Rute hielt mich vom Spiel ab und seine Strenge vom Laster, [85] und von Ausschreitungen die Furcht vor ihm.</p><p>Einen anderen Vater gab er meinem Jünglingsalter; wenn sich Knabenhaftes noch in mir regte, dann zeigte dieser seine Strenge; wenn sich aber der Ernst des Alters in mir geltend machte, [90] dann bewies er seine Güte.</p><p>Als ich aber die Stufen des Knaben- und Jünglingsalters überschritten hatte, da war auch die Härte des ersten und die Strenge des zweiten vorüber; [95] Gott gab mir einen sanften Hirten</p><p>Der Hymnus Nr. 16 ist in der Mitte unvollständig, da in den beiden Handschriften Blätter ausgefallen sind. 17 – 21 bilden wieder mit gleicher Melodie einen kleinen Zyklus für sich, da sie den vierten Bischof von Nisibis, Abraham, zum Gegenstand haben.</p><p>Über Abraham, den Bischof von Nisibis.</p><p>Nach der Melodie: Ermordet wurden die Kinder.</p><p>[Der Kehrvers zeigt bei jeder Strophe eine kleine Abänderung.]</p><p>Gestatte, Herr, auch meiner Niedrigkeit, daß sie ihr Scherflein in deinen Schatz wirft. Jener hat wie ein Kaufmann unserer Herde mit dem Talente deiner Lehre gewuchert, [5] er verschied und landete in deinem Hafen; nun will ich über seinen Unterhirten reden, der das Haupt der Herde ward; ein Schüler jener drei, wurde er der vierte Lehrer. – [10] Gepriesen sei der, der ihn zum Troste uns gesandt!</p><p>Mit gleicher Liebe will ich ihn schmücken und zu einem Kranze zusammenflechten die prächtigen Blumen und die duftenden Blüten [15] jenes Lehrers und seines Schülers, den er zurückließ wie Elisäus; das Salbungshorn seiner Auserwählung schäumte über, er ward geweiht zum Haupte und erhoben zum Lehrer. – [20] Gepriesen sei, der ihn zum Lehrer gesetzt!</p><p>Es freuten sich die himmlischen Patrone, daß sie durch den Hirten, den sie erzogen, die Herde weideten; es freute sich die Schar der Unterhirten, als sie Fortführung ihrer Ämter sahen. [25] Er wählte ihn aus und hauchte ihn gleichsam als Geist dem großen Körper der Kirche ein, und es umgaben ihn seine Glieder, damit sie von ihm Leben empfingen, Lehre und neues Brot. – [30] Gepriesen sei, der ihr Kleinod hervorgebracht!</p><p>Er wählte ihn aus von vielen Unterhirten, weil er die Prüfung seiner Treue bestanden hatte; es hatte ihn die Zeit inmitten seiner Herde geprüft, es hatte ihn erprobt die lange Dauer wie ein Feuerofen; [35] denn die Prüfung, die er selbst sich auferlegt, machte ihn zur festen Mauer für viele. Dein Fasten sei eine Waffe unserm Land, dein Gebet ein Schild für unsere Stadt, dein Weihrauch verschaffte uns Versöhnung. – [40] Gepriesen sei, der dein Opfer heiligte!</p><p>Der Hirt, den er von seiner Herde abberief, hatte sie auf geistigen Auen geweidet und mit seinem siegreichen Hirtenstab vor verborgenen Wölfen behütet. [45] Fülle du aus deines Lehrers Platz, der sich nach dem Wohllaut seiner Stimme sehnt; stelle dich hin als eine Säule in der Stadt des bebenden Volkes, durch deine Gebete möge es gestärkt werden! – [50] Gepriesen sei, der dich als Säule hingestellt hat!</p><p>Er übergab seine Hand seinem Schüler, den Thron einem Würdigen, den Schlüssel einem Bewährten, die Herde einem, der sich ausgezeichnet hatte. [55] Deine Hand ziere Barmherzigkeit, dein Opfer Versöhnung, deine Zunge Trost; Friede möge deine Herrschaft schmücken, im Innern mögen Wächter [schirmen], nach Außen die Volksscharen. – [60] Gepriesen sei, der dich auserwählt, uns zur Freude!</p><p>Deine Lehre möge reicher sein an Taten denn an Worten; karg nur säend der Worte Samen, mögest du durch Taten unser Land bebauen, [65] auf daß durch eifrige Pflege auch der geringe Same sich vermehre; wenn des alten Samens Frucht uns dreißigfachen Segen brachte, dann sechzigfach dein neuer Samen. –Gepriesen sei, der hundertfach vermehrt!</p><p>Fern von dir ist Zorn, denn Friede überströmt dich ganz; Eifersucht ist in dir erloschen, denn Liebe brennt jederzeit in dir; [75] du hast den Stachel des Neides abgebrochen, damit er niemanden im verborgenen verletze; dem Verleumder, der Verwirrung stiftet, liehest du nie dein Ohr, da nur Wahrheit und Offenheit dich erfreut. – [80] Gepriesen sei, der deinen Leib so schmückte!</p><p>Zeige dich als guten Berater inmitten deines Volkes, wie Jetro unter den Hebräern, schließe dich ganz jenem an, der dir nützlichen Rat gibt, [85] halte dich völlig fern von jenem, der dir Verkehrtes rät, Roboam mag dir ein warnend Beispiel sein. Wähle dir kluge Räte aus, weise zurück neidischen Ratgeber. – [90] Gepriesen sei, der klugen Rat dir gab!</p><p>Die Gabe, die dir gegeben ward, ist aus der Höhe zu dir herabgeschwebt; nenne sie nicht nach eines Menschen Namen, verbinde sie nicht mit einer andern Macht, [95] damit nicht etwa in ihr Bereich der hinterlistige Satan Zutritt finde und vortäusche, daß die Menschen sie dir verliehen, damit jenes freie Geschenk den Menschen als Sklave diene. – [100] Gepriesen sei, der seine Gabe gnädigst lieh!</p><p>In deiner Person bist du ein Abbild deines Lehrers, denn siehe, ganz bist du ihm gleich, er schied von uns, und doch ist derselbe noch bei uns. In dir sehen wir jene drei [105] Glorreichen, die von uns geschieden; sei uns eine Mauer gleich Jakob, voll Erbarmen gleich Babu, ein Schatz der Rede gleich Walgesch [Vologeses]. – Gepriesen sei, der uns in einem jene malte!</p><p>[110] Auch ich, der Auswurf der Herde, habe nicht geschwiegen von dem, was ziemend war; ich habe gemalt das Bild jener beiden mit Farben, die von beiden stammen, damit die Gemeinde [wörtlich: Herde] ihre Vorzüge [115] und die Herde ihre Schönheit sähe. Und da ich selbst ein Lamm bin, der ich sprach, dich, Gott Abrahams, will ich in Abrahams Haltungpreisen. – Gepriesen sei, der mich zu seiner Zither machte!</p><p><em>Loblied auf den Bischof Abraham; sein Widerstand gegen die christenfeindlichen Bestrebungen Julians sind angedeutet.</em></p><p><em>Behandelt das gleiche Thema; bemerkenswert ist die Schlußstrophe mit einer Charakterisierung der drei Vorgänger Abrahams, wie sie schon der 17. Hymnus enthielt:</em></p><p>[151] Mit dem glorreichen Priester Jakob siegte sie [die Kirche] gleichwie er, weil er Liebe mit Eifer vereinte, mit Ehrfurcht und Liebe war sie bekleidet. [155] Unter Babu, dem Wohltäter, kaufte sie mit Geld die Gefangenen frei, unter Walgesch, dem Schriftgelehrten, öffnete sie ihr Herz den Schriften, unter deiner Leitung mögen ihre Hilfsmittel wachsen. – [160] Gepriesen sei, der ihre Kaufleute reich machte!</p><p><em>Abraham wird aufgefordert, die Kirche vom Unkraut der Häresie rein zu erhalten.</em></p><p><em>Ephräm wünscht, daß unter Abrahams Leitung die Bewohner von Nisibis immer mehr die schlimmen Gewohnheiten aus ihrer heidnischen Vergangenheit ablegen möchten. Am Schluß stellt er die drei Bischöfe, Jakob, Walgesch und Abraham, in Parallele zu den weltlichen Herrschern, unter denen wohl Konstantin, Konstantius und Jovianus zu verstehen sind; das Lied klingt aus in einer allgemeinen Schilderung der beiden Mächte, Kirche und Staat:</em></p><p>[201] Der erste Priester und erste König waren wie füreinander geschaffen, wie auf der Wage waren sie gegeneinander abgewogen. So auch Walgesch und des Königs Sohn, [205] beide milde und sanften Sinnes. Mögen auch die letzten einander gleichen! Die Priester mögen Leuchten sein, die Könige Fackeln, die Richter Blitzesstrahlen! – [210] Gepriesen sei, der unsere Seelen erleuchtete!</p><p>Vom Königtum sollen Gesetze hervorgehen, vom Priestertum Versöhnung; es ist vom Übel, wenn beide mild sind, doch unerträglich ist’s, wenn beide streng sind. [215] Der eine walte kraftvoll, der andere mild, in Einsicht und Weisheit paare sich Furcht und Mitleid. Unser Priestertum sei milde, unser Königtum stark! – [220] Gepriesen sei, der unsere Stützen so bereitete!</p><p>Beten mögen die Priester für die Könige, daß sie ein Bollwerk seien für die Menschheit. Sieg gehe aus von den Königen, Glaube von den Priestern. [225] Der Sieg beschütze unsern Leib, der Glaube unsere Seelen. Die Könige sollen Waffenkämpfe schlichten, die Priester Geisteskämpfe, Zwistigkeit und Krieg sei zu Ende! – [230] Gepriesen sei der Sohn dessen, der aller Frieden gibt, Preis dir für deine Gabe!</p><p>Nr. 22 – 24 fehlen; vielleicht gehört aber der Sermo de Reprehensione [Lamy, S. Ephraem Syri Hymni et Sermones, II, 325 – 62] hierher; der Fall von Nisibis dient als Hintergrund für eine ernste Bußpredigt.</p><h3>3. Über Edessa.</h3><p>Eine neue Gruppe von Gedichten, und zwar 25 – 30, wovon das erste, und damit die Überschrift, sowie ein Teil des zweiten verloren sind, handeln, wie Bickell nachgewiesen hat, über Ereignisse in der Kirche von Edessa.</p><p>Aus Angaben wie 26,11 und 28,38 ersieht man, daß die Kirche von Edessa schon sechs Jahre lang durch eine Spaltung heimgesucht ist, und zwar war es, wie sich aus andern Quellen ergibt, der Arianismus, der die Gemeinde in zwei Lager schied. Man ging, wie Hymnus 29 zeigt, von Seiten der Gegner soweit, Barses [361 – 78], den bejahrten Bischof der Orthodoxen, eines sträflichen Lebenswandels zu bezichtigen; von Einzelheiten wird ferner noch erwähnt, daß durch ein Glied der Gemeinde der König versöhnt worden sei. Bickell nimmt an, daß damit auf die Milde des Kaisers Konstantius hingewiesen werden solle, mit der er den Edessenern die Beschimpfung seines Standbildes nachsah. In Hymnus 33,44 wird die aus den Chroniken bekannte Tatsache erwähnt, daß Barses vorher Bischof von Harran war; das Chronicon Edessenum [ad annum 672 Gr.] und spätere Ausschreiber motivieren diese Translation mit dem Befehl des Kaisers. Seine Verbannung durch Valens fällt in die Zeit nach Ephräms Tod [373]; über sie berichtet ausführlich Theodoret, Kirchengeschichte IV,16 ff. – Da das in den Gedichten erwähnte Schisma wohl erst mit dem Regierungsantritt des arianisch gesinnten Kaisers Valens [364] begonnen haben dürfte, so wären die Gedichte in das Jahr 370 zu verlegen.</p><p><em>Ein dritter Hymnus nach derselben Melodie.</em></p><p><em>Im vorliegenden Hymnus wird die Kirche von Edessa wie oben die von Nisibis selbst als sprechend eingeführt.</em></p><p>Herr, den Ärzten ist’s wohl leicht, ein Glied abzuschneiden, aber nicht so leicht ist’s ihnen, es wieder an seiner Stelle anzufügen. [5] Dir, Herr, ist beides leicht, denn Gott bist du. – [Kehrvers:] Höre die Stimme des Rufes meiner Kinder!</p><p>Zwölf Jahre lang entblößten die Ärzte [10] jene blutflüssige Frau, sie entblößten sie, halfen ihr aber nicht. Wenn sie sie geheilt hätten, war es schon etwas Unehrbares, um wieviel mehr, da sie sie nicht heilten.</p><p>Während jene sie entblößten, [15] hast du sie gereinigt und geheilt, als sie verhüllt dein Gewand berührte und nicht einmal deinen Körper. Das Gewand reinigte sie ganz, als Heilmittel erwies es sich ihr.</p><p>[20] Wie sehr hast du doch, o Herr, deine Kirche in Scham versetzt! Sieh, so ist sie in Verachtung geraten, daß die Vorübergehenden vom Wege abbiegen, um ihre Schmach zu sehen; die hinfällige Frau hast du gereinigt, [25] und deine Braut hast du bloßgestellt.</p><p>Auch steht die Dauer meiner Krankheit in keinem Verhältnis zur Krankheit jener, sechs Jahreerst dauert sie, die Hälfte der Jahre jener. [30] Heile auch das jüngere Leiden, der du das alte geheilt hast!</p><p>Wenn du nun, weil ich ein wenig abstoßend geworden bin, mich verlassest und verstößt, wie kann dir dann noch ein Mann verhaßt sein, [35] der sein Weib verachtet, weil es häßlich geworden ist? Erbarme dich meiner Häßlichkeit und lehre [so durch dein Beispiel], daß jener auch seiner Ehegattin die Liebe bewahrt!</p><p>Lia, die ungeliebte, hast du wohlgefällig gemacht; [40] ihre Augen waren glanzlos, ihre Kinder aber waren sehr schön; mich, Herr, die ich schön bin, schmähen meine Kinder.</p><p>Du allein und deine Mutter, [45] ihr seid viel schöner als alles, keine Makel ist an dir, Herr, und kein Fehl an deiner Mutter; welcher von diesen beiden Schönheiten lassen sich meine Kinder vergleichen?</p><p>[50] Dein Vater ertrug jene schändliche Menge, die um das [goldene] Kalb hurte, darum ist auch ihr Sproß verhaßt, der gleichsam nach dem Vorbild [55] jenes fremden Götzen gestaltet ist.&lt;br Nach seiner Art sind sie, die die Vertreter der Wahrheit, Moses und die Propheten, lesen; obgleich sie jederzeit gelesen haben, [60] hast du, o Herr, erfahren, was alles sie dir angetan.</p><p>Der Apostelhat mich dir verlobt als reine Jungfrau; das Kalb meiner Väter [65] hasse ich, Herr, nur dir bin ich zugetan; möchten doch die Kinder meiner Herde nicht ihre Brüder verwunden!</p><p>Von jenem Lamme stammen sie ab, das die Züchtigung ertrug, ohne seinen Mund aufzutun, [70] das geschlachtet wurde, ohne zu klagen, das gekreuzigt wurde, ohne daß es murrte, und das, zum Leben erweckt, sich abmühte, seinen Mördern das Leben zu verleihen.</p><p>Nicht Adam hat euch gezeugt, [75] der sich gegen das Gesetz empörte, noch sein Sohn, der freventlich ohne Grund seinen Bruder erschlug: Söhne des Geistes seid ihr, und Kinder, aus dem Wasser geboren.</p><p>[80] Auch von mir kann ich euch erzählen, daß man mich steinigte, ohne daß ich zornig wurde, daß man mich kreuzigte, ohne daß ich schmähte, daß man mich verbrannte, ohne daß ich Fluchworte ausstieß. Machet euch ähnlich eurem Herrn, [85] befolget das Beispiel eurer Mutter!</p><p>Schlangenbrut wurden die Menschen genannt, nicht wegen ihrer Natur, sondern wegen ihrer Taten; [90] denn das Gift des freien Willens übertrifft noch das der Schlangen.</p><p>So wurden die Menschen auch Götter genannt, nicht wegen ihres Wesens, [95] sondern wegen der Gnade; diese nämlich knüpfte zwischen sich und euch ein Band der Verwandtschaft.</p><p>Ein Wunder ist’s, daß Gott sich mit euch verbrüderte, [100] ihr aber habt das Band eurer Verwandtschaft mit ihm zerschnitten; denn wie wenn er ein Geschöpf wäre, habt ihr den Schöpfer zum Verwandten erhalten.</p><p>Dir sei Ruhm, mein Gott, [105] daß du uns nicht mit den Geschöpfen, sondern mit dir selbst, dem Herrn alles Geschaffenen, verbrüdert hast! Preis sei dieser Vereinigung!</p><p>[110] Denn etwas Wunderbares wäre es nicht gewesen, wenn wir mit der [übrigen] Schöpfung zusammen als verwandt angesehen worden wären, denn die Schöpfung ist nur eine. Gepriesen sei der Herr, der wollte, daß seine Knechte seine Brüder seien!</p><p><em>Der fünfte Hymnus nach derselben Melodie.</em></p><p><em>Klage Edessas über die abgefallenen Bewohner und Gebet um die Bekehrung der Irrenden.</em></p><p><em>Der sechste Hymnus nach derselben Melodie.</em></p><p><em>Zur Klage über die zur Irrlehre Abgefallenen gesellt sich noch der Schmerz über die Verleumdungen, die man gegen den Bischof von Edessa aufgebracht hatte. Es handelt sich, wie Bickell nachweist, um den betagten Bischof Barses [361–78].</em></p><p>Der sechste Hymnus nach derselben Melodie.</p><p><em>Der Dichter zeigt an Moses und Daniel ein Gegenbild von Edessa: beide hervorragenden Männer des Alten Bundes sind in heidnischer Umgebung aufgewachsen und trotzdem nicht vom Glauben abgewichen; Edessa hingegen hat die Wahrheit, die es besaß, von sich geworfen.</em></p><h3>4. Über Harran.</h3><p>31 – 34 handeln über die Stadt Harran und insbesondere über deren Bischof Vilus und sind in Edessa verfaßt. – In Harran, der zum größten Teil heidnischen Nachbarschalt Edessas, hatten die Christen, vor allem ihr Bischof, viel von den Heiden zu erdulden; zu diesen Gegnern gesellten sich noch arianische Kreise, da der nach 33, 47 aus Edessa stammende Vitus, der auch am Konzil von Konstantinopel 381 teilnahm, ein eifriger Verfechter der Orthodoxie gewesen zu sein scheint. Er war wohl der Nachfolger des nach Edessa transferierten Barses und zur Zeit der Abfassung dieser Hymnen noch nicht lange im Amte. Da ferner die Kirche von Edessa nur lobend erwähnt wird, dürfte damals das oben erwähnte Schisma noch nicht ausgebrochen gewesen sein; demnach fällt die Abfassung der Gedichte in die Zeit zwischen 361 – 64.</p><p>Das erste und dritte Gedicht enthalten die Bitte, Gott möge dem Bischof beistehen, das Heidentum auszurotten und die häretischen Gegner zu überführen. Nr. 32 ist in der Mitte unvollständig. In Nr. 34 klagt Ephräm über die Hartnäckigkeit, mit der die Bewohner der Stadt am Heidentum festhalten. Die biblischen Erinnerungen, die sich aus der Patriarchenzeit an diesen Ort knüpfen, sind vom Dichter reichlich ausgebeutet.</p><p>Als Beispiel dieser Gruppe von Gedichten mag Nr. 33 folgen.</p><p>Der dritte Hymnus nach derselben Melodie.</p><p>Dornen und Unkraut und Disteln des Heidentums, begossen durch die Trankopfer, aus denen der Irrtum ausströmt, – [5] sie wuchern inmitten von Harran, jenem Heiligtum der Dämonen. – [Kehrvers:] In dir mögen meine Kinder einig sein!</p><p>Wenn Adam Anlaß war, daß natürliche Dornen sproßten, [10] weil er freiwillig die Schranken des Gebotes übertrat, so sproßten nach ihrem freien Willen Dornen in Harran.</p><p>Der Landmann stieg zur Erde hernieder [15] den Menschen zuliebe, die Dornen geworden waren, damit sie Weizen würden: die Dornen flochten Dornen um das Haupt des Landmannes.</p><p>[20] Nicht ging verloren der Same aus jenem Bilde, das sie malten: sieh, in Rosen und Lilien wurden die Dornen verwandelt zu einer Krone für den Landmann, [25] der eine Dornenkrone trug.</p><p>So möge auch jenem Landmann, der in Harran sich abmüht, aus den Dornen Weizen erstehen, mögen sie durch deine Gnade werden [30] Zypressen, Myrthen und Blüten, eine Krone für deinen Kämpfer!</p><p>Dein Hirt ist dir in allem gleich, [35] und wie seine Schmach deiner Erniedrigung gleicht, so möge er dir auch in deiner Erhöhung gleichen, auf seinen Thron möge er erhöht werden!</p><p>Der Weg der Versöhnung und der Pfad der Freuden [40] möge von Edessa bis nach Harran reichen, und von Kirche zu Kirche mögen sie in Eintracht wallen!</p><p>Von Edessa möge der Greis [der Bischof Barses] [45] Harran besuchen, seine Tochter, die er erzogen hat, und Edessas Sohn [den Bischof Vitus von Harran, der demnach aus Edessa stammt] möge seine Mutter besuchen und wieder nach Harran, seiner Braut, heimkehren!</p><p>[50] Fülle aus mit deiner Gnade die Kluft, die Satan schuf, eine große Spaltung führte er herbei, um sie in zwei Parteien zu scheiden; in diesen Abgrund wirf ihn [55] und bahne einen Weg über ihn!</p><p>Wir wollen deine Gnade preisen, die den Weg ebnete und bahnte vor den Volksscharen, die zu den Fasten pilgerte;die leichten Schrittes dahinziehen, bringen überströmenden Dank dir dar.</p><p>Es danken für sie auch Jakob, Isaak und Abraham;denn wenn ihre Namen jenen Kalbanbetern Segen brachten, so mag sich ihres Andenkens auch erfreuen unser Volk in Phaddan.</p><p>Und wie durch den verborgenen Trieb Abrahams [70] nach unserem Land gelenkt wurden alle Väter, so auch durch jenes [Verlangen] der Apostel ihre Mitapostel.</p><p>[75] In den Gebeinen des Johannes, von denen ein Teil in unserer Stadt ruht, kamen die Propheten zu uns; in Guria und Schamona und ihrem Genossen Habib kamen die Märtyrer, uns zu besuchen.</p><p>II. 35 – 42. Vorwort: Über unsern Herrn und über den Tod und den Teufel.<k>[Die Gedichte der zweiten Hälfte sind durchweg erst in Edessa entstanden.]</k></p><p>Der Dichter zeichnet mit dramatischer Kraft die Beratung, die er sich bei Beginn von Jesu Leiden zwischen dem Teufel, dem Tode und der Sünde entstanden vorstellt. Der Teufel möchte den Tod als Bundesgenossen gewinnen in seinem Kampf um die Behauptung seiner Macht; der Tod fürchtet seinerseits, durch Jesus seine Herrschaft über das Totenreich zu verlieren. Die Dialoge erscheinen wie ein Nebenspiel zum Schauspiel des Erlösungstodes. Wir werden sofort in medias res, in die Versammlung in der Hölle, geführt.</p><h2>2</h2><h3>1. Über unsern Herrn und über den Tod und den Teufel.</h3><p>Nach der Melodie: Horn und Trompete.</p><p>Der Ruf erscholl. – Da eilten herbei die Scharen Satans mit seinen Dienern. [5] Das Lager des Unkrauts versammelte sich ganz, weil sie sahen, daß Jesus zum Ärger der ganzen linken Seite [d. h. der Partei der Gottlosen] glorreich sei. Weil niemand unter ihnen war, der nicht Qual empfand, so fing ein jeder an, aufzuzählen, [10] was alles sie zu ertragen hätten. Die Sünde und die Unterweltwaren bestürzt, der Tod zitterte, da die Toten sich empörten, und Satan, da die Sünder sich gegen ihn erhoben. – [Kehrvers:] Preis dir, denn bei deinem Anblick geriet Satan in Verwirrung!</p><p>[15] Die Sünde rief und erteilte ihren Söhnen, den Dämonen und Teufeln, Rat und sprach zu ihnen: „Legion, das Haupt eures Reiches, ist nicht mehr; [20] das Meer hat ihn und seine Gesellen verschlungen. Auch euch wird dieser Jesus, wenn ihr gleichgültig bleibt, zugrunde richten, euch, die ihr doch den Salomon gefangen habt. Eine Schmach wäre es also, [25] wenn ihr den Jüngern, den Fischern und ungelehrten Leuten, unterliegen würdet. Seht, sie haben schon Menschen gefangen, die unsere Beute waren.“</p><p>„Das ist das größte aller Übel“, [30] sprach nun Satan in bezug auf unsern Erlöser; „es genügte ihm nicht, uns zu berauben, sondern er begann, sich an uns wegen Jonas, des Sohnes Mattais, zu rächen. [35] An Legion nämlich nahm er Rache für ihn, den er ergriff und ins Meer warf. Jonas kam nach drei Tagen wieder ans Trockene, Legion aber auch nicht nach langer Zeit, [40] denn die Tiefe des Meeres hält ihn auf Christi Befehl fest.</p><p>Ich reizte ihn nach seinem Fastendurch das lockende Brot, aber er begehrte nicht danach. [45] Zu meinem Verdrusse habe ich mich bemüht, einen Psalm zu lernen, damit ich ihn mit seinem Psalm fangen könnte. Vergebens; da wiederholte ich es ein zweites Mal, er machte aber meine Wiederholung erfolglos. Ich führte ihn auf einen hohen Berg und zeigte ihm [50] alle Güter, bot sie ihm an, er ließ sich aber nicht verlocken. Glücklicher war ich in den Tagen Adams; denn er verursachte mir nicht soviel Mühe, ihn zu überreden.“</p><p>Satan überging nun seine [weitere] Mühe [55] und fuhr fort: „Zum Nichtstun gereicht mir [zwingt mich] dieser Jesus; denn sieh, sogar Zöllner und Buhlerinnen nehmen zu ihm ihre Zuflucht. Was für eine Arbeit soll ich mir fürderhin suchen? [60] Bei wem soll ich, der ich bisher der Lehrer aller Menschen war, in die Schule gehen?“ Da nahm die Sünde wieder das Wort: „So muß ich denn ablassen und aufgeben das, was ich bin; [65] denn dieser Sohn Marias, der da kam, hat die Menschheit zu einer neuen Schöpfung gemacht“.</p><p>Der gierige Tod heulte und sprach: „Nun habe ich fasten gelernt, [70] das ich sonst nicht kannte. Seht, Jesus sammelt die Menge um sich, sein Gastmahl aber kündet mir Fasten an. Dieser eine Mensch schließt mir den Mund, der ich den Mund vieler schloß.“ [75] Die Unterwelt aber sprach: „Ich muß meine Freßgier hemmen, es ist nun Hungerszeit. Dieser da, der bei der Hochzeit sich glorreich zeigte, verwandelt wie das Wasser in Wein, so auch das Gewand der Toten zum Leben.</p><p>[80] Auch hat Gott die Sintflut gesandt und die Erde abgewaschen und sie von ihren Schulden gereinigt; auch Feuer und Schwefel ließ er über sie kommen, [85] um sie von Flecken zu reinigen. Durch das Feuer gab er mir die Sodomiter und durch die Flut die Riesen. Er schloß den Mund der Leute Sanheribs und öffnete den [Rachen] der Unterwelt. [90] Dieses und Ähnliches machte mir Freude. Aber statt der Todesstrafen der Gerechtigkeit hat er nun in seinem Sohn Wiederbelebung der Toten in seiner Gnade verliehen.“</p><p>„Es kamen mir Propheten und Gerechte zu Gesicht“, [95] sprach Satan zu den Seinen, „obgleich gewaltig waren ihre Kräfte, so war doch ein Hauch von mir in ihnen; denn das Gebilde der Menschenkinder [100] hat etwas von unserm Sauerteig an sich. Dieser ist zwar mit Adams Leib bekleidet, aber es verwirrt uns, daß unser Sauerteig über ihn ohnmächtig ist. Mensch ist er nämlich und Gott; [105] denn seine Menschheit ist mit seiner Gottheit vermischt.</p><p>Ich habe Adam gesehen, jene Quelle, aus der alle Geschlechter hervorgingen. [110] Seine Kinder habe ich erforscht und jeden einzelnen versucht, doch niemals sah ich einen Menschen, der zu einem Teile Gott war und zur andern Hälfte Mensch. Moses, der im Lichtglanz strahlte, [115] auch ihn habe ich versucht und durch seine Zunge in Verwirrung gebracht; diesen aber nicht einmal in seinem Innern; denn die Quelle seiner Gedanken ist völlig rein.</p><p>Die Fleischeslust [120] steckt in jedem Körper, daß sie sogar, wenn sie schlafen, in ihnen wach bleibt. Wer in wachem Zustande sich rein erhält, den verwirre ich im Traume. [125] Die Unreinheit des Fleisches erregt sich durch eine geheime Bewegung in seinem Innern; Wachende und Schlafende also bringe ich in gleicher Weise in Unruhe. Dieser allein ist rein, [130] so daß ich ihn nicht einmal im Traume erregen konnte; denn auch im Schlafe ist er makellos und heilig.</p><p>So war denn auch seine Kindheit anders als die anderer Knaben, [135] die ich kennen lernte; an ihm fand ich keinen Anteil an dem Meinigen. Schon in seiner Kindheit hatte ich Furcht vor ihm, darum trieb ich den Herodes an, damit er mit den Kindern ermordet würde, [140] Doch auch das, daß er entkam, verstärkte meine Furcht; denn wie konnte er von unserm Geheimnis Kenntnis haben? Er empfing die Gaben der Magier, spottete unser, da er entkam und unserm Schwerte entging.</p><p>[145] Ich sah Knaben, Söhne Gerechter, und Kinder, Söhne züchtiger Frauen, und prüfte sie einzeln vom Mutterleibe an [150] und entdeckte in ihnen unsern Sauerteig, daß sie zornmütig, zum Lästern geneigt, hitzig und gierig waren, Früchte, die erst durch den Unterricht reif und süß wurden. [155] Dieser aber war schon von seinem Entsprossen an eine gute Frucht, die voll Süßigkeit war, denn durch sie wurden die Sünder süß.</p><p>Schon als unmündiges Kind ward er zum Lehrer [160] für die Menschen; über den Glanz, der über ihm war, wunderte sich schon jener Priester, der ihn trug. Mit der Weisheit der Greise war er [schon] bekleidet. Joseph trat ehrfurchtsvoll vor ihm zurück, [165] seine Mutter durfte sich seiner rühmen. Eine Hilfe war er in seiner Jugend allen, die ihn sahen, ein Beistand denen, die ihn kannten. Vom Tage an, an dem er in die Welt trat, [170] war er ein Helfer der Menschheit durch seine Wundertaten.</p><p>Woher ist nun also diese Frucht Mariens entsprossen, die Traube, deren Wein nicht von natürlicher Art ist? [175] So schwebe ich nun zwischen Verlegenheiten; denn ich fürchte, wenn ich ihn frei gewähren lasse, daß jene mit seiner Lehre Süßigkeit annehmen, die meine Bitterkeit an sich tragen; [180] es schaudert mich aber auch, ihn zu keltern und zu treten, damit er nicht etwa zu neuem Weine werde für die Sünder, die dann, sobald sie von ihm berauscht sind, ihre Götzen vergessen.</p><p>Seht, vor beidem fürchte ich mich, [185] vor seinem Tode wie vor seinem Leben.“ – Dem Bösen antworteten nun seine Diener und rieten ihm: „Wenn auch beides uns hart ankommt, [190] so ist die Sache doch für uns etwas leichter, wenn wir seinen Tod wählen und nicht sein Leben; sein Tod möge uns sagen, ob jemals einer von den Gerechten wieder zum Leben ward erweckt. [195] Keiner von den Heldensöhnen und Glorreichen kam aus Scheols Rachen je zurück.“</p><p>[Satan:] „Des Windes Wehen mag der Mensch erforschen, [200] wer aber kann Mariens Sohn durchschauen? Als er weinte, wurde ich durch seine Tränen getäuscht, und als ich ihm sagte, er solle sich vom heiligen Tempel herabstürzen, wähnte ich, er wollte sich aus Furcht nicht herabstürzen. [205] Als sie ihn vom Berge herabstürzen wollten, flog er in die Luft davon. Ermüdet saß er ferner am Brunnen. Diese verschiedenen Erscheinungen an ihm vermag ich nicht zu deuten: er wandelte sowohl auf dem Festlande wie auf den Fluten.</p><p>[210] Ich sah ihn hungern wie einen Menschen, und doch wurde [dieser Befund] wieder gegenstandslos durch die Brotvermehrung. Gleich zu Anfang forschte ich ihn aus und ging hin, [215] er aber stellte Fragen wie ein Unwissender. Auch das wurde hinfällig, da er zeigte, daß er auch das Verborgene wisse. Er wählte ferner den Iskariot, als kännte er ihn nicht, [220] und wieder zeigte er, daß er ihn kannte, obgleich [auch] er die Binde- und Lösegewalt hatte. Ich täuschte mich in ihm, da er sich taufen ließ; denn er tauchte empor und versenkte mich.</p><p>Doch ein Zeichen, das ich an ihm sah, [225] gibt mir den Mut wieder, mehr als alles andere. Als er nämlich betete, sah ich ihn, und ich freute mich, daß er seine Farbe veränderte und von Furcht ergriffen ward, und es wurde sein Schweiß zu Blutstropfen, [230] da er merkte, daß sein Tag gekommen sei. Dies Zeichen gefiel mir über alles, wenn er mich nicht auch dadurch wieder getäuscht hat. [235] Wenn er mich also täuscht, dann ist es um mich und um euch, meine Helfer, geschehen.“</p><p>Nun zürnt die Versammlung der Dämonen: „Abscheulich ist das Zeichen, das wir an dir sahen. [240] Denn noch niemals ist dir es so ergangen. Sonst zeichnetest du dich aus durch kurze Ratschläge, [jetzt] erobert Mariens Sohn die Festungen, und du hältst lange Reden. Auf, hinaus! Laß uns kämpfen mit ihm! [245] Eine Schmach ist’s doch für uns, wenn viele von einem überwunden werden. Wenn Schmerz du hast oder Furcht, so gib uns einen Rat für den Kampf und bleib zu Haus!“</p><p>[Satan:] „Dieser Jesus, – [250] von seinen Worten kann ich lernen, ihn zu bekämpfen. Sprach er doch [einmal]: Wenn Satan mit sich selbst uneins ist, kann er nicht bestehen. [255] Indem er uns bekriegen will, hat er uns die Waffe wider ihn gegeben. Geht, entzweit mir seine Jünger; wenn diese unter sich uneins sind, dann seid ihr Sieger. [260] Durch die Schlange und Eva, diese schwachen Wesen, durch seinesgleichen besiegte ich den ersten Adam.“</p><p>Der Tod antwortete nun dem Teufel und sprach: "Was ziehst du dich zurück, [265] was du sonst nicht tatest? Bist du doch Geringen und Unbedeutenden mit Eifer nachgegangen; womit willst du Jesus, der größer ist als alles, fangen? [270] Die Kraft seiner Pfeile, die er auf dich schleuderte, als er von dir versucht wurde, fürchtest du. Du und ich und deine Getreuen, – zu schwach ist unsere Schar zum Kampfe gegen Mariens Sohn.</p><p>[275] Ich rate dir, wenn überhaupt uns dieser Kampf noch etwas zu tun gestattet: Geh hin und fahre in seinen Jünger, [280] daß das Oberhaupt sich mit den Oberhäuptern bespreche; dann laß dein ganzes Heer los, daß es hinziehe und die Pharisäer aufreize. Sprich aber nicht barsch, wie du sonst gewohnt bist: [285] Wenn du Gott bist, stürze dich hier hinab, sondern küsse ihn mit Liebe und verrate ihn, und dann wollen wir auftreten lassen den Neid und das Schwert der Leviten.“</p><p>Die Gedichte 36 – 41, die noch zu derselben Gruppe gehören, enthalten hauptsächlich bewegliche Klagen des Todes über den Verlust seiner Macht infolge des Todes Christi. Die Grundlage bilden vielfach Ereignisse des Alten [besonders Nr. 39] sowie des Neuen Testamentes. In Nr. 40 rühmt sich der Teufel seiner Siege über die Menschen; ebenso in Nr. 41, doch fürchtet er, durch den am Kreuze hängenden Heiland eine Niederlage zu erleiden; seine Scharen suchen ihn zu trösten.</p><p><em>Gehört nur äußerlich zu dieser Gruppe [dieselbe Melodie] und enthält eine Klage des Teufels über die Wunderkraft der Reliquien des hl. Thomas in Edessa.</em></p><p>Der Böse jammerte: „Wohin soll ich vor den Gerechten fliehen? [5] Ich habe den Tod aufgereizt, die Apostel zu töten, um ihren Schlägen zu entgehen, durch ihren Tod werde ich aber noch viel grausamer gepeinigt. Der Apostel, den ich in Indien tötete, [10] ist mir nach Edessa zuvorgekommen. Hier ist er und auch dort mit ganzer Kraft. – [Kehrvers:] Gepriesen sei die Kraft, die in den glorreichen Gebeinen wohnt!</p><p>[15] Die Gebeine trug jener Kaufmann, oder vielmehr sie haben ihn getragen. Sie haben einander gegenseitig Gewinn gebracht; [20] aber mir, was haben sie mir geholfen? Sie haben sich wechselseitig Hilfe gebracht, mir aber ward Nachteil durch beide zuteil. Wer zeigt mir den Reliquienschrein des Iskariot, [25] daß ich von ihm Kraft erhalte? Der Reliquienschrein des Thomas hat mir Verderben gebracht; denn die geheime Kraft, die darin wohnt, quält mich.</p><p>Der auserwählte Moses brachte die Gebeine[30] im Glauben auf Gewinn; wenn jener große Prophet glaubte, daß in den Gebeinen Hilfe ruhte, so hat der Kaufmann mit Recht geglaubt [35] und trug mit Recht den Namen „Kaufmann“ [der Gewinnmachende]. Ja, der Kaufmann hat Gewinn gemacht, ist groß und herrschend geworden. Sein Schatz hat mich sehr arm gemacht, sein Schatz wurde in Edessa geöffnet, [40] und hat die große Stadt mit Hilfe bereichert.</p><p>Über dieses Schatzbehältnis staune ich, denn nur klein war zunächst sein Schatz, [45] und solange niemand davon etwas wegnahm, war die Quelle seines Reichtums schwach; als sich aber viele darum drängten und ihn plünderten und Vorteile ihm entnahmen, [50] wuchs sein Reichtum, je mehr sie ihn plünderten; denn wenn jemand sich mit einer verborgenen Quelle abmüht, dann wird sie weiter geöffnet und fließt aufs reichlichste.</p><p>[55] So war offenbar auch Elisäus eine reichliche Quelle für das durstende Volk, und weil die Durstigen sich nicht darum kümmerten, war ihr Ausströmen nicht stark; [60] als aber Naaman sie aufsuchte, so ergoß sie sich und strömte Gesundheit aus; die Quelle nahm ihn zu einer [andern] Quelle [Jordan] mit und ließ ihn hineinsteigen, im Flusse heilte er den Aussatz. [65] Jesus, das Meer der Heilmittel, sandte den Blinden zum Siloah[teiche], und er wurde sehend.</p><p>Giezi war nicht imstande, mit dem totenbelebenden Stabe [70] den Knaben zum Leben zu erwecken; wie hätte durch eine Hexe der Ruhmreiche [Samuel] heraufbeschworen werden können? Wir verlachten Saul, denn anstatt eines Geistes, den er rief, stiegen zwei Dämonen herauf und spotteten seiner. [75] Aus den Gebeinen des Elisäus und Samuels magst du lernen; wenn die Gebeine einen Toten wieder lebendig machten, so kann doch toter Zauber die lebendigen und heiligen Gebeine nicht auferstehen machen.</p><p>[80] So sehr ich auch um Erfüllung dieser Bitte flehte, erfüllte mir sie der Geber aller Dinge nicht. Denn wenn auch [einmal] Dämonen aufgeregt würden [85] durch die Gebeine eines Götzenpriesters oder eines Magiers oder Zauberers oder eines Chaldäers oder Wahrsagers, so wüßte ich doch, daß es nur zum Spott geschähe. [90] Auf zweifache Weise führe ich in Irrtum, indem ich entweder die Apostel zu Lügner stemple, oder meine Apostel die [wahren] Apostel nachäffen lasse.</p><p>Die Reichen der Dämonen sind nun zunichte gemacht worden, [95] die Reichen der Teufel müssen Schläge ertragen; obgleich niemand sichtbar die Rute schwingt, schreien die Dämonen vor Schmerzen auf; obgleich niemand fesselt und bindet, [100] sind doch die Geister gehemmt und gebunden. Das ist das stille Strafgericht, das ruhig und schweigsam sich vollzieht und das sich mit Untersuchung gar nicht beschäftigt. – Eine Macht, die alles vermag, [105] ruht in den Gebeinen dieses zweiten Elisäus.</p><p>Er [Christus] übergab das Gericht den Zwölf, auf daß sie die zwölf Stämme richteten; wenn aber die Apostel die Kinder des großen Abraham richten werden, so ist es wahrlich nichts Großes, daß sie jetzt schon die Dämonen richten; und wenn die Kreuziger [115] das zukünftige Gericht nicht für wahr halten, so werden sie bei unserm Gericht geprüft werden, indem sie noch ärger als wie vor den Aposteln, den Richtern der Stämme, schreien werden.</p><p>Ein Wolf war nämlich einst [120] der Apostel Saulus, und mit dem Blute von Lämmern zog ich ihn groß, und er wurde stark und ein Wolf von einziger Art. Bei Damaskus aber wurde plötzlich [125] der Wolf in ein Lamm verwandelt. Er erklärte, daß die Apostel sogar Engel richten würden; unter den Engeln verstand er nämlich die Priester, wie geschrieben steht. [130] Wenn die Apostel so mächtig sind, wehe den Dämonen vor den Schlägen ihrer Gebeine!“</p><h3>2. Über die Auferstehung</h3><p>Eine zweite Gruppe der Gedichte dogmatischen Inhalts umfaßt die Nrn. 43 – 51, über die Auferstehung handelnd. Beispiele aus der Natur, aus der Hl. Schrift bilden meist die Grundlage; einige Gedichte sind größtenteils polemischer Natur, gegen Bardesanes, Mani und Marcion gerichtet. – Mit Ausnahme der letzten beiden Hymnen werden alle durch dieselbe Melodie auch äußerlich als Einheit zusammengefaßt. – Als Muster aus dieser Gruppe mag das folgende dienen, das aus der Natur die Notwendigkeit der Auferstehung folgert.</p><p>Ein zweites Gedicht nach derselben Melodie [Tröstet in Verheißungen].</p><p>Der Gütige [selbst] schuf den Leib, um den Irrlehrern zu zeigen, wie hervorragend das Werk seiner Hände sei und daß es für die Ewigkeit bestimmt sei. [5] Der Gerechte [selbst] hauchte die Seele ein, um zu lehren, um wieviel erhabener sie ist als die der Tiere, die er nicht einhauchte. Diese, die nicht eingehaucht ist, hat einen schweigenden und stummen Mund, [10] jene, die sein Mund einhauchte, hat einen der Sprache fähigen Mund. – [Kehrvers:] Seele und Leib, o Herr, mögen sich über deine Auferstehung freuen!</p><p>Wäge ab den Menschen [15] mit den Tieren auf der Wagschale der Natur und betrachte im Geiste: wie jenes Tier ein Teil des Vergänglichen ist [20] und in jeder Hinsicht ganz und gar vorübergehend, so ist hingegen die menschliche Natur ein Schatz zur Erhaltung, und ganz ist sie durch die Auferstehung ein Teil des Lebens.</p><p>[25] Betrachte ferner den Bau der Tiere und sieh, daß er durchaus nicht vollkommen ist; ganz ist es nur darin entsprechend, [30] daß es ohne Hoffnung ist, so daß es die Irrlehrer überführt, die die Natur des Menschen teilen und, obgleich er etwas [in sich]. Gleichartiges ist, annehmen, daß die Hälfte der Hoffnung angehört, [35] die andere ohne Hoffnung ist.</p><p>Es bezeugt unsere Belohnung das Zugtier, welches keinen Lohn erhält, denn seine Arbeit ist ohne Hoffnung, sein Lauf ohne Belohnung, [40] sein Schmerz ohne Verheißung, und es ist ganz ohne Auferstehung, damit es dem Menschen die Überzeugung beibringe, daß der Lauf beider [Leib und Seele] unter einem Joche eine Belohnung zur Folge habe, [45] ihre Arbeit mit Verheißung, ihre Schmerzen mit Glorie verknüpft sei.</p><p>Diese beiden Dinge nämlich sind dem Schwachen vorgelegt, damit er einsehe, [50] daß der Lauf der Tiere ohne Lohn bleibt, und damit er sich überzeuge bezüglich des dem Menschen versprochenen Lohnes, und damit er erkenne, daß unser Schöpfer nicht Unrecht tat, wenn er dem Menschen [55] Paradies und Hölle versprach und den lebenden Wesen reichlich Ruhe gab ohne Strafen.</p><p>Betrachte wiederum die Tiere! Keines tötet sich ab [60] und verpflichtet Gott durch irgend etwas, so daß es sagen könnte, es sei um seinen Lohn gekommen. Der Leib aber tötet sich ab, indem er durch sein Fasten sich die Gerechtigkeit verpflichtet, so daß er, wenn es keine Auferstehung gäbe, um seinen Lohn käme, und mehr als das Blut Abels würde sein Schweigen auf der Erde nach dem anvertrauten Gute vor dem Allvergelter schreien.</p><p>Töte ein Tier und lerne, [70] daß keiner dich [dafür] töten wird, denn seine Seele geht zugleich mit dem Körper unter, und nichts ist an ihr, das zur Auferstehung gelangt. [75] Dieses Wort macht allem Streit ein Ende: wie bei den Tieren für ihre Seele das gleiche gilt wie für ihren Leib, so wird unser Leib leben wie unsere Seele.</p><p>[80] Die Schrift lehrt die Weisen, die Natur die Ungläubigen, daß das Vergängliche nur für eine Zeitlang erhalten bleibt und das Unvergängliche [85] für ewige Erhaltung bestimmt ist, und daß der, der solches tötet, wieder getötet werden soll. Sogar seine Trennung zeigt, daß es für die Ewigkeit bestimmt war; über alles wird die Schlange von jedem verflucht, [90] weil sie betrog und die Trennung verursachte.</p><p>Siehe doch, Vögel, Fische und [sonstige] Tiere werden unter Segensspruch geschlachtet und ebenso gegessen; [95] unter Segensspruch wird die Saat geerntet, die Frucht gepflückt, aber nicht verflucht wird der, welcher erntet oder pflückt. Wenn also der Leib des Menschen für die Vergänglichkeit bestimmt wäre, [100] wem könnte da die Schlange oder der Mörder fluchwürdig oder verflucht erscheinen?</p><p>Das Getreide, welches überständig ist und ausfällt, die Frucht, welche welk und geschmacklos geworden ist, klagen den Landmann an, [105] daß er lässig war und nicht erntete und den Samen nicht drosch noch aus der Spreu aussonderte, – darum wäre nach ihremWort der im Unrecht, der nicht [110] den Greis tötete, dessen Geist stumpf geworden, um so diese Seele von ihrer lästigen Fessel zu befreien.</p><p>Eben darum geschieht es, daß man die Greise, die nichts mehr nützen, doch am Leben läßt, [115] damit der Gütige durch sie jenen Lügnern die Wahrheit lehre. Und obgleich das Schwert für den Greis etwas Ruhebringendes wäre, würde doch der junge Mann, der es ergriff, selbst dem Schwerte verfallen. [120] Er vernichtet die Jugend, die das Greisenalter vernichtete, damit er zeige, wie teuer der Leib seinem Schöpfer ist.</p><p>Jedermann erwartet den Tod eines Greises, der nach dem Zeugnis aller [125] eine schlimme Last ist, und doch wird ihn keiner töten; obgleich sein Tod erwünscht ist, ist doch noch mehr gefürchtet seine Tötung, [130] um uns zu lehren, wie achtenswert er auch in seinem Elend ist, und wie sehr geehrt im Paradiese, und wie groß seine Glorie, wenn er zum Leben auferstehen wird.</p><h3>3. Über den Teufel und den Tod</h3><p>Die dritte Gruppe des zweiten Hauptteiles, Nr. 52 – 68, bildet ein Zyklus von Hymnen vom Teufel und Tod in Dialogform. Alle 17 Lieder gehen nach derselben Melodie. Die ganze Reihe wurde von Macke in der „Gottesminne“ [III] in deutscher Nachdichtung übersetzt. – Als Muster folgt hier der 1. <a href="ch002.xhtml#section-28">52.</a> Hymnus.</p><p>Über den Teufel und den Tod.</p><p>Nach der Melodie: O Tod, überhebe dich nicht.</p><p>Ich hörte [einst] den Tod und den Teufel miteinander darüber streiten, wer von ihnen gegenüber dem Mensehen der mächtigere sei. – [5] [Kehrvers:] Preis sei dir, o Sohn des Hirten, über alle, der seine Herde von den unsichtbaren Wölfen erlöste, die sie verschlangen, dem Teufel nämlich und dem Tode!</p><p>Der Tod zeigte seine Macht,die alles unterwirft, der Teufel seine Arglist, die alle zur Sünde verführte.</p><p>[Tod:] „Auf dich, o Teufel, hört nur der, welcher will, [15] zu mir aber kommen alle, ob sie wollen oder nicht.“</p><p>[Teufel:] „Du, o Tod, besitzest nur den Zwang der Tyrannei, mir aber stehen Schlingen und Netze [20] der Arglist zu Gebote.“</p><p>[Tod:] „Vernimm, o Böser, wer klug ist, zerbricht dein Joch, keiner aber kann sich meinem Joche widersetzen.“</p><p>[Teufel:] [25] „Du, o Tod, versuchst deine Macht an Kranken, ich aber bin den Gesunden gegenüber erst recht stark.“</p><p>[Tod:] „Der Teufel hat nicht Macht über alle, [30] die ihn lästern, in meine Hände aber fallen alle, die mich verflucht haben und mich verfluchen.“</p><p>[Teufel:] „Du, o Tod, hast deine Macht von Gott erhalten, [35] mir allein hilft niemand, wenn ich zur Sünde reize.“</p><p>[Tod:] „O Teufel, du legst wie ein Schwacher nur Fallstricke, ich aber bediene mich [40] wie ein König meiner Macht.“</p><p>[Teufel:] „Du bist zu dumm, o Tod, um zu begreifen, wie groß ich bin; denn ich bin imstande, den selbständigen freien Willen gefangen zu nehmen.</p><p>[Tod:] [45] „ O Teufel, du schleichst wie ein Spitzbube umher, ich zermalme wie ein Löwe und kenne keine Furcht.“</p><p>[Teufel:] „Dir, o Tod, erweist niemand Verehrung, [50] noch betet man dich an; mir aber dienen Könige mit Opfern gleich einem Gotte.“</p><p>[Tod:] „Den Tod nennen viele als etwas Gutes, [55] dich, o Teufel, hat noch niemand angerufen, noch ruft man dich an.“</p><p>[Teufel:] „Hast du das noch nie vernommen, wieviele mich auf alle Arten anrufen [60] und mir Opfer bringen?“</p><p>[Tod:] „Abscheulich ist dein Name, Teufel, du kannst ihn nicht schön machen; alle verfluchen deinen Namen, verbirg deine Schmach!“</p><p>[Teufel:] [65] „Du bist schwerhörig, Tod, denn du hörst nicht, daß jedermann über dich klagt; verstecke dich nur!“</p><p>[Tod:] „Ich trete offen auf in der Welt, [70] ich täusche nicht wie du, der ohne Täuschung nicht bestehen kann.“</p><p>[Teufel:] „Nichts hast du mehr bestätigt gefunden, [75] als daß du bei den Menschen ebenso verhaßt bist als ich.“</p><p>[Tod:] „Vor mir fürchtet sich jedermann wie vor einem Herrn, dich aber hassen sie [80] als den Bösen.“</p><p>[Teufel:] „Bei dir, o Tod, haßt man den Namen sowohl wie dein Tun, mein Name ist zwar verhaßt, aber meine Lockmittel sind sehr geschätzt.“</p><p>[Tod:] [85] „In Schlangengift verwandelt sich deine Süßigkeit. Reue folgt immerdar deinen Anreizungen.“</p><p>[Teufel:] „Die Unterwelt ist verhaßt, weil in ihr [90] keine Reue mehr sich findet, sie ist ein Abgrund, der verschlingt und jede Regung verhindert.“</p><p>[Tod:] „Die Unterwelt ist ein Schlund; jeder, der hineingeraten ist, wird wieder auferweckt, [95] die Sünde ist verhaßt, weil sie den Menschen die Hoffnung abschneidet.“</p><p>[Teufel:] „Schmerz bereiten mir zwar jene, die Buße tun; doch lasse ich ihnen wenigstens Gelegenheit dazu; du schneidest aber dem Sünder, [100] der in seinen Sünden dahinstirbt, die Hoffnung ab.“</p><p>[Tod:] "Du deinerseits kommst ihm zuvor, und zu Ende ist seine Hoffnung; denn wenn du ihn nicht zur Sünde verleitetest, würde er gut sterben.“</p><p>[105] Gepriesen sei jener, der die verwünschten Knechte aufeinanderhetzte, damit wir auf sie schauen, wie sie auf uns und sich über uns lustig machen!</p><p>Ein Unterpfand ist’s für uns, meine Brüder, [110] unsern Blick auf sie gerichtet zu haben, dafür, daß wir auf sie werden schauen können, wenn wir zum Leben auferweckt werden.</p><h3>4. Eschatologie</h3><p>Die vierte Gruppe der zweiten Hälfte, Nr. 66 – 77, umfaßt Gedichte, die hauptsächlich die Auferstehung von den Toten behandeln, die durch biblische Beispiele, häufig auch durch den Hinweis auf die Gerechtigkeit bewiesen wird; der Tod mit der Trauer, die er verursacht, und mit seinen Lehren über den Wert der irdischen Güter ist der Gegenstand der letzten Gedichte. Als Beispiel dieser Gruppe diene die folgende Ermahnung, über den Tod Nahestehender nicht in übermäßige Trauer auszubrechen.</p><p>Ein zweiter Hymnus nach derselben Melodie [Bote der rechten Führung [?]].</p><p>O wie bitter ist, meine Brüder, dieser Kelch des Todes, der auch die Nüchternen berauscht, so daß sie unter Tränen irre werden. – [Kehrvers:] [5] Gepriesen sei, der die Toten lebendig macht!</p><p>Durch das Verscheiden des Toten wird auch der Ernste überwältigt, und er klagt erschüttert über den Freund, der dahinging. [10] Es schreit auf in seiner Liebe das Glied, das zurückblieb, über seinen Gefährten, der ihm entrissen, und dessen Umgang und dessen Stimme ihm nun fehlt.</p><p>Wenige vermögen Abraham nachzueifern, [15] der so stark war, daß er seines Leibes Frucht [d. i. Isaak] um seines Herrn willen dem Tode weihte.</p><p>Er war der Wahrheit Säule, die die Last im Volke trug; [20] ihn erschütterten der Schmerzen Wogen, doch seine Stärke wankte nicht.&lt;br&lt; Sieh an den Winzer, als er an seinem unfruchtbaren Weinstock eine Frucht erblickte; die späte Traube, [25] als Erstling brachte er sie dar.</p><p>Bewundernswert war auch Jephtes Tat, dieses Winzers, welcher die jungfräuliche Traube pflückte und sie dem Herrn des Weinbergs opferte.</p><p>[30] Sein Kampf siegte über sein Erbarmen, er unterdrückte seine Liebe und opferte jene, und trotz seines Schmerzes wurde er nicht irre, denn sein Glaube stützte ihn.</p><p>Der Wein des Todes [35] ist Hefe, die in Schmerzen aufbraust, mit Tränen machte er seine Zecher trunken und mit Weinen seine Gäste.</p><p>Reichen Trost spendet das erhabene Beispiel Jephtes, [40] der mit dem Schwerte den Schatz des Lebens dessen Herrn opferte.</p><p>Seine Rechte streckte Jephte aus und brachte das Opfer dar, die Taube sah sein Trauern [45] und flößte Mut ihm ein mit ihren Werken.</p><p>Würdig war der Priester, der mit Blut von sich seines Amtes waltete, ein Vorbild seines Herrn zu sein, der mit seinem eigenen Blute opferte.</p><p>[50] Wer immer von der Liebe trunken ist, aber aus Liebe zur Wahrheit [die Traurigkeit] besiegt, wird wie im Traume seinen Freund sehen, der von ihm schied.</p><p>Er sah wohl schon im Traume [55] seinen Freund im Sterben liegen; doch kam der Morgen, so tröstete er ihn über den Schmerz des Traumgesichts.</p><p>Wie gleicht doch der Tote jenem, der im Traum entschlafen, [60] und wie gleicht der Tod dem Traume und die Auferstehung dem Morgen!</p><p>Einst wird in uns die Wahrheit aufleuchten wie das Licht in unserm Auge, und wir werden den Tod betrachten [65] wie ein banges Traumgebilde.</p><p>Ein Tor ist, der da erkennt, daß der Schlaf am Morgen aufhört, aber meint, daß der Tod ein Schlaf ist, der ewig währt.</p><p>[70] Wenn das Auge von Hoffnung beseelt ist, vermag es das Verborgene zu schauen, dass der Schlaf des Todes an jenem Morgen endigt.</p><p>Er ist entschwebt, der Wunderduft [75] jenes Lebensschatzes im Körper, der Seele Wohnzelt, aus dem sie schaudernd entfloh.</p><p>Reich wird sein Schmuck und seine Pracht sein, denn er ist der geliebte Tempel des Geistes, [80] wiederhergestellt, was vorher nicht war, und er wird eine Wohnung des Friedens sein.</p><p>Die Stimme der Posaune ruft den stummen [Seelen-] Harfen zu: „Wacht auf, lobsinget und prüfet [85] vor dem Bräutigam in Liedern!“</p><p>Ein Rauschen von Stimmen wird sein, wenn die Gräber sich öffnen; einer um den andern wird in seine Harfe greifen und Jubellieder anstimmen.</p><p>[90] Preis sei dir, der du den Adam erhöhtest, als er noch schuldlos war! Preis sei dir, der du ihn in die Unterwelt niederbeugtest, als er sich überhob!</p><p>Lob sei dem, der erniedrigt, [95] Lob sei dem, der wiederaufweckt! Möge auch meine Zither bei ihrer Auferstehung ihrem Herrn Lob singen!</p>
