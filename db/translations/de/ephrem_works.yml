      <p><em>Rede über die Auferweckung des Lazarus (Bibliothek der Kirchenväter).</em></p><p><em>„Nachdem er dies gesagt hatte, rief er mit lauter Stimme:,Lazarus, komm heraus!’“ ([Joh. 11, 43.)</em></p><p>Der syrische Text ist der Handschrift Cod. vat. 117, sect. 153 entnommen und in der römischen Ausgabe im II. syrisch-lateinischen Bande S. 387-395 als Werk Ephräms abgedruckt. Aber der Cod. Musei Britannici Add. 17 158 des sechsten oder siebten Jahrhunderts eignet diese Rede dem monophysitischen Bischof Jakob von Sarug [451-521] zu. Der Umstand, daß sie nicht in dem gewöhnlichen zwölfsilbigen Metrum Jakobs, sondern in Ephräms Lieblingsversmaß, dem Siebensilbener, gedichtet ist, könnte dazu beigetragen haben, sie dem hl. Ephräm zuzuschreiben. Allerdings ein absolut untrügliches Zeugnis bilden auch die Autorenangaben der Handschriften der vorislamitischen Zeit nicht, wie Th. Jos. Lamy an der eingangs zitierten Stelle hervorhebt. Aus den christologischen Partien der Rede ergibt sich kein Anhaltspunkt für oder gegen die Zugehörigkeit ihres Verfassers zum Monophysitismus bezw. Dyophysitismus, da derselbe es ausdrücklich ablehnt, auf derartige Fragen näher einzugehen [10 gegen Ende].</p><p>Inhalt: Nach einer ernsten Ermahnung zur Aufmerksamkeit im rechten Geiste und nach einer Anrede an die Kirche verspricht der Redner, seinen Zuhörern Wunderbares zu zeigen; dann richtet er plötzlich das Wort an Lazarus. Hierauf handelt er vom Zwecke der Ankunft Christi, von seinem Sieg über den Tod und von der Verleihung des Lebens; weiterhin erörtert er die Frage, warum gerade Lazarus und nicht ein früher Gestorbener erweckt wurde, wobei er auch auf die beiden anderen Totenerweckungen zu sprechen kommt [4-5]. Alsdann macht er auf die Umstände bei der Erweckung des Lazarus aufmerksam, gibt die Gründe an, weshalb der Herr seine Ankunft in Bethanien verzögerte, und beweist, daß seine Frage nach dem Orte des Grabes keinen begründeten Einwand gegen seine Gottheit darbiete. Nach erneuter Aufforderung zur Aufmerksamkeit schildert der Verfasser den Heiland am Grabe, die Stadt der Toten, das Erschrecken des Todes und der Toten beim Rufe des Herrn an Lazarus und schließlich dessen Wiederbelebung, wobei besonderer Nachdruck darauf gelegt wird, daß es hieß: Komm heraus! [Einzahl] und nicht: Kommet heraus! [Mehrzahl] [11—14]. [Nach Zingerle a. a. O. I,248.]*</p><p>Dir, o heilige Gemeinde, wünsche ich ein Getränk zu bereiten, damit auch du meine Worte trinkest. Zu dir, o Reine, spreche ich; denn du bist allen Eitelkeiten fremd. Offen tritt die Lehre auf, um dir die Wahrheit zu verkünden; sie verbirgt sich vor den Zuschauern unter keiner fremden Hülle. Die Wahrheit wird mit entschleiertem Angesicht auf ihrer Kanzel ausgelegt, und sie versteckt sich nicht vor der Menge; denn sie ist nicht dazu da, um zu täuschen. Im Gewande der Wahrheit tritt die Lehre auf, fragt in ihrer eigenen Weise und handelt über sie [die Wahrheit] in ihr eigentümlichen Formen. Wenn sie darüber täuschen wollte, was sie ist, so wäre es für sie passend, sich zu verhüllen. Weil aber die Wahrheit so ist, wie sie ist, so verändert sie ihre Gestalt nicht. Wenn sie aber an sich dunkel wäre, so wäre ihr allerdings eine Verhüllung angemessen; weil sie aber ein hellstrahlendes Licht ist, so steht sie offen und klar da.</p><p>So tritt jetzt die Lehre mit offenem Visier vor euch; öffnet daher auch ihr das Gehör, damit sie durch dieses aufrichtig aufgenommen werde! Wunderbare Szenen kann ich heute vor euren Augen vorüberziehen lassen. Seid kluge Beobachter des Wunders, das sich euch tatsächlich darstellt! Von den Szenen Christi führe ich euch nur eine vor, die kein Prophet schaute und die nur der gläubige Sinn zu sehen vermag. Reinigt das Auge eures Geistes, um die Wahrheit zu schauen, und wenn die Wahrheit das Ihrige gezeigt hat, so lobpreiset Gott, wenn es wunderbar ist! Komme her zu mir, o toter Lazarus, der du von der Verwesung auferweckt wurdest! Komm heraus und verkünde der Gemeinde das Wunderbare in deiner wunderreichen Geschichte! Komm heraus, der du gebunden einherwandelst und eingewickelt daherschreitest, und offenbare deine wunderbare Geschichte der Menge, die Neues liebt! Ob der Tote erweckenden Stimme bebt meine Rede vor euch. Staunend wollen wir dir zuhören; denn die ganze Begebenheit ist ein Wunder. Nur ein einziges Wunderzeichen Christi will ich einigermaßen besprechen. Voll des Erstaunlichen sind sie ja alle, aber ich bin unfähig, auch nur das Eine entsprechend zu behandeln.</p><p>Der Sohn, der die Toten auferweckt, wurde vom Allerhöchsten gesandt, um dem Menschengeschlechte die Auferstehung am Jüngsten Tage zu verkündigen. Der starke Sohn Adonais kam zum schwachen Geschlechte Adams, um es durch das Leben, das er den Begrabenen verkündete, vom Falle aufzurichten. Der Sohn des Reiches ward gesandt, die Stadt des Todes zu bezwingen, und er stieg hinab, um in ihr sein Banner zum Zeichen seines Sieges aufzustellen. Durch die zwölf Heerführer, die er sich auserwählte, damit sie mit ihm ziehen sollten, unterwarf er die Stadt der Finsternis, die sich durch ihre Größe auszeichnete. Am toten, verwesenden Lazarus wollte er seine Macht zeigen, damit er die Totenerweckung durch die Tat bestätige und sie nicht bloß mit Worten predige. Nicht einen von den Entfernten oder einen aus den früheren Geschlechtern erweckte er, damit nicht die Anwesenden zweifelnd fragen könnten: „Wer ist denn dieser? Woher stammt er?“ Denn hätte er den Seth oder den Enos oder den Adam selbst auferweckt, so wäre dessen Auferweckung zweifelhaft gewesen, da ja niemand diese gekannt hätte. Darum erweckte er einen Toten der gleichen Generation, von dem bekannt war, wessen Sohn er sei, damit gerade diejenigen, die ihn begraben hatten, die klassischen Zeugen für seine Auferweckung abgeben würden.</p><p>Eine [die Tochter des Jairus] entriß er dem Rachen des Todes, einen andern [den Jüngling von Naim] seinen Krallen, den Lazarus aber holte er aus seinen vernichtenden Eingeweiden heraus. Dem Beleber der Toten war es nicht so sehr darum zu tun, die Genannten zu erwecken, als vielmehr durch die Geiseln, die er der Unterwelt entführte, dort sein Banner aufzurichten. Dem ganzen Menschengeschlechte predigte er Ermutigung durch die gute Hoffnung, indem er durch drei Zeugen, die er ins Leben zurückrief, die Auferstehung beglaubigte. Weise wählte und nahm er drei Altersstufen aus den Sterblichen: einen Mann, ein Mädchen und einen Jüngling, für die Ersten, Letzten und Mittleren. Er wollte die eine Auferweckung von Adam bis zum Ende dadurch glaubhaft machen, daß er durch die nahen Toten den fernen große Hoffnung bereitete. Die ersten [Toten] stellte er durch Lazarus dar, die mittleren durch den Jüngling, die letzten durch das Mädchen: allen kündigte er eine Auferweckung an. Nicht solche, deren Zeiten und Geschlechter bereits dahingegangen waren, rief er zum Zeugnis für die Auferweckung vor jenem ungläubigen Volke ins Leben zurück, sondern den Lazarus von Bethanien, dessen Dorf und Haus bekannt war, dessen Schwestern noch lebten und dessen Verwandtschaft sich in der Nähe befand.</p><p>Gerade als die Trauer um ihn heftig war und seine Lieben ihn bitter beweinten, als man in der Synagoge, jener Hasserin der Wahrheit, die Geschichte seines Todes besprach und die Wölbung des Trauerhauses noch von dem Getöse der Scharen von Juden dröhnte, als einer dem andern erzählte, daß Lazarus gestorben sei, wie andere vor ihm, und die Klage über ihn noch nicht verhallt war, als die Kunde von seinem Tode noch lebendig war und jedermann kam, seine Schwestern seinetwegen zu trösten, als die Nachricht von seinem Hinscheiden sicher und sein Begräbnis vielen bekannt war, als die Totenklage noch in seinem Hause gehalten wurde und seine Bekannten ihn noch beklagten: da erschien der Herr der Auferweckung, um seine Macht zu zeigen, nicht so sehr, um den Lazarus aufzuerwecken, als vielmehr, um die Hoffnung [auf die allgemeine Auferstehung] zu stärken. Durch diesen einen Entschlafenen gab er der ganzen Welt ein Beispiel der [allgemeinen] Auferweckung und richtete in der Festung der Begrabenen das Banner des Lebens auf. Er ließ den Verstorbenen in Verwesung übergehen, und dann erst kam er, um ihn aufzuerwecken. Auf diese Weise beglaubigte sein Verwesungsgeruch den Tod und seine Auferstehung die Auferweckung. Der Entschlafene wanderte drei Tage lang unversehrt im Lande des Todes, erst am vierten Tage stieg er hinab in das Meer der Verwesung. Der Tod nahm ihn und führte ihn im Jenseits drei Tagreisen weit; aber an der vierten Station schloß er ihn wie die übrigen [Toten] im Abgrunde der Toten ein.</p><p>Jesus ließ dem Lazarus Zeit, damit er bis zum Grunde des Totenreiches hinabsteigen konnte, um ihn dann aus der Tiefe der Grube heraufzuholen und dadurch die Verwesung des Todes zu besiegen. Der Tod ergriff den Begrabenen und übergab ihn der Verwesung. Der Wurm nagte an ihm, und die Fäulnis zersetzte seinen Leichnam. Er schwamm im Tümpel der Gestorbenen und versank in der Unterwelt der Begrabenen, Er wurde dem Ozean der Untergegangenen überliefert und dort zum Schweigen gebracht. Es versenkte ihn der Todesengel in den Abgrund der Vermodernden, damit die erscheinende Auferstehung die der Unterwelt Verfallenen erfreuen könnte. Jesus ließ ihn bis in die Tiefe des Todes hinabtauchen, damit dann die Stimme seiner Auferweckung hinabdringen und das Haupt der Abgründe zertreten würde. Der Tod raubte ihn aus dem Hause des Lebens und brachte ihn in die Stadt der Burg; er verschloß ihre starken Tore und hoffte zuversichtlich, daß sie niemand öffnen würde. Jesus aber verzog eine Weile, damit die Verwesung sich des Leichnams bemächtigen und der Modergeruch des Toten seine Auferweckung klar bezeugen würde. Der Allwissende eröffnete seinen Jüngern: „Unser Freund Lazarus schläft; [ich aber gehe hin, ihn aufzuerwecken“] Dadurch, dass er dieses offenbarte, ehe er hinging, wies er auf seine Allmacht hin; dadurch aber, daß er zögerte, bis der Tote in Verwesung übergegangen war, steigerte er das Wunder seiner Auferweckung.</p><p>Das Mädchen rief er im Hause ins Leben zurück und übergab es seinem Vater; den Jüngling erweckte er auf dem Wege zum Grabe, als er hinausgetragen wurde; den Lazarus aber ließ er im Kerker des Grabes zu verwesen anfangen. Dann aber drang sein Ruf hinein in die Burg des Starken und erweckte ihn zum Leben. So rief er also im Hause, auf dem Wege und aus dem Grabe Tote wieder ins Leben, um so auf der ganzen Straße des Todes Meilensteine der Auferstehung aufzustellen. Auf den ganzen Pfad der Entschlafenen streute er die Hoffnung des Lebens aus; denn er ließ am Anfang, am Ende und in der Mitte desselben seine Auferstehung erscheinen. Darum zögerte er, als sein Freund Lazarus gestorben war, damit dieser den Anfang des Weges begehen und er ihn dann von dort zurückbringen könnte. Der Lebendige [Christus] ging dem Tode auf dem Wege seiner Macht auf der Ferse nach und träufelte auf die ganze Straße, vom Anfange bis zum Ende, seine Auferweckung. Er sprach: „Unser Freund Lazarus ist gestorben, und ich freue mich, daß ich nicht dort war“. Es war ihm bekannt, daß er anfangen würde, zu verwesen, und so wartete er darauf, um ihn dann ins Leben zurückzurufen.</p><p>Als aber der Tod den Toten schon drei Tage lang in seiner Gewalt gehabt und am vierten das Gewürm an seinem Leichnam zu nagen begonnen hatte, kam der Lebenspender mit seinen Jüngern in die Ortschaft des Toten und fragte dessen versammelte Begraber: „Wo habt ihr ihn hingelegt?“ Wenn er darnach fragte, so geschah es nur um der Vermessenen willen; denn es ist sonnenklar, daß er es nicht nötig gehabt hätte, darnach zu fragen. Er wollte nur die Tatsache seines Begräbnisses sicher stellen dadurch, daß er fragte: „Wo habt ihr ihn hingelegt?“ Er fragte nicht, wo sein Grab sei, sondern wohin sie ihn gelegt hätten. Er kannte ihre Hartnäckigkeit, mit der sie seine Wundertaten leugneten, daher legte er sie fest durch die Frage, wohin sie den Begrabenen gelegt hätten. Er fragte nicht, wo Lazarus liege oder wo er begraben sei, sondern: „Wo habt ihr ihn hingelegt? Zeiget es selbst, ihr Ungläubige!“ Auch vom Vater gibt es eine ähnliche Frage, die viel besprochen wird; aber ich übergehe sie mit ehrfürchtigem Schweigen, um nicht in verkehrtes Grübeln zu geraten. Die Wahrheit besteht für sich selbst. Wortkünsteleien führen nicht zum Glauben; die Einfalt schaut mit offenen Augen die Wahrheit, wie sie ist, und ohne Gerede und Wortstreit steht sie auf der Seite der unbestreitbaren und unerforschlichen Wahrheit. Was war wohl größer, zu wissen, wo sein Grab war, oder den Verwesenden aufzuerwecken? Daß er das Verborgene wußte, bewies er dadurch, daß er seinen Aposteln, noch ehe er dorthin kam, offenbarte: „Unser Freund Lazarus schläft.“ Die ungläubigen Bestatter aber fragte er: „Wo habt ihr ihn hingelegt?“, um von ihnen ein Unterpfand seiner Bestattung zu erhalten, und erst dann rief er ihn ins Leben zurück. Weise legte er sie fest durch ihre Aussage, daß sie selbst den Begrabenen bestattet hätten, so daß sie dann, als er ihn anrief und auferweckte, die Wirklichkeit seiner Auferweckung bezeugen mußten. Er fragte: „Wo habt ihr ihn hingelegt?“ Sie antworteten: „Komm und sieh!“ Durch diese Frage wurden sie festgelegt, so daß ihnen jede Ausrede abgeschnitten war.</p><p>Der Sohn ist deshalb, weil er nach dem Grabe fragte, nicht geringer als der Vater. Dadurch, daß er über Lazarus weinte, bewies er andererseits die Wahrheit seiner Menschwerdung. Wenn es heißt, daß er weinte und daß er schwitzte, so waren es seine Tränen und seine Schweißtropfen. Aber dadurch wird der Sohn nicht unter den Vater herabgesetzt; denn er ist ebenso Totenerwecker wie sein Vater. Er weinte, um die Wirklichkeit seiner Menschheit zu beweisen; er rief den Toten hervor, um seine Allmacht zu zeigen. Er fragte, um die Ungläubigen festzulegen; er betete, um seine Übereinstimmung [mit dem Vater] zu offenbaren. Auch dieses Beten am Grabe erniedrigt ihn nicht unter seinen Erzeuger. Daß er nicht aus Notwendigkeit betete, kannst du aus seinen eigenen Worten ersehen: „Dies sage ich um der Menge der Juden willen, damit sie glauben, daß du mich gesendet hast [und damit sie erkennen, daß du in mir bist und ich in dir bin]“. Er heilte die Gesinnung der Menge, deren Gehör krank war und die offen bezweifelte, daß Jesus der Sohn des Allerhöchsten sei. Daher schrieb er alle seine Werke dem Vater zu, um zu zeigen, daß er nicht durch Anmaßung Herr und Lebensspender sei. An dem Niedrigen, das an ihm geschah, sollten die Verständigen seine Liebe erkennen. Doch darüber zu sprechen, ist jetzt nicht meine Absicht. Die Wahrheit ist schon an sich klar und leuchtet hell ohne unser Wort. Vollkommen ist der Sohn wie sein Erzeuger, wunderbar der Erstgeborene wie sein Sender, Totenerwecker wie auch sein Vater; denn der nämliche, der weinte, erweckte zum Leben. Darüber hätte ich vieles zu sagen, wenn ihr es wünschet, das heißt, wenn ich sehe, daß der Same meines Wortes in euren Ohren aufgekeimt ist. Ja, selbst wenn ihr widerstrebt, werde ich trotzdem nicht ablassen, den Samen auszustreuen.</p><p>Seid doch nicht ein Felsen für mein Wort, noch ein Weg, noch ein Dorngestrüpp! Der Acker Christi ist bestellt, kein Unkraut möge auf ihm sprossen. Er ist mit dem Pfluge des Kreuzes bebaut, und die Dornen sind aus ihm völlig ausgerottet worden. Gottgesegnete Männer [die Patriarchen und die Propheten] haben im Vorbilde schon dieses Feld urbar gemacht, die Apostel reinigten es vom Gestrüppe durch ihre verschiedenen Martyrien. Der Sohn Gottes verfertigte durch sein Leiden das Werkzeug zu seiner Bearbeitung, um durch das Joch der Kreuzigung das Unkraut aus ihm auszurotten. Die harten Felsen darin zerschlug er durch die Nägel in seinen Händen, damit keine Stelle leer bleibe und der Früchte des Kreuzes ermangle. Der Anbetungswürdige machte die Götter zuschanden, die den Dornen gleich auf der Erde hervorgesproßt waren, sandte über sie die Glut des Apostolates und verbrannte sie. Diese bitteren Dornen wurden durch die Pein des Gekreuzigten ausgerottet, möchte doch nicht Satan sie wieder durch die Possen aussäen! Den Sterblichen ist von allen Thematen jenes von der Auferstehung der Toten das liebste, und hier wird auch täglich von der Kanzel die Wiederbelebung der Toten gepredigt. O Staub, den die Erbarmung geformt, o Mensch, der du Asche bist, was hörst du lieber als die Kunde von deiner Auferstehung? Hier [in der Kirche] wirst du durch Worte und Handlungen über deine Erneuerung unterrichtet; draußen in den Theatern aber siehst du nur Possen des Heidentums. Höre weiter! Ich habe dir noch einiges von der Geschichte des Lazarus vorzutragen, die voll Hoffnung der Auferstehung ist und dich, o Sterblicher, mit Trost erfüllt. Neige weise dein Ohr der wunderbaren Begebenheit Christi zu, und du wirst seine große, dir Erstaunen erregende Macht bei der Auferstehung der Toten schauen.</p><p>Der Held ) stieg von seinem Orte herab, der starke Sohn Adonais, um die Auferstehung der Toten durch die Hoffnung zu offenbaren, die er den Begrabenen verkündete. Er fragte und kam zum Grabe des Lazarus, wie ihr gehört habt, und sah die Stadt des Todes, der mit Macht über die Tausende Toter gebietet. Hoch sind die Mauern des Totenreiches, damit sie nicht von den Lebenden erstürmt werden. Verschlossen sind die Tore der Finsternis vor allen Dahingeschiedenen, und starke Riegel sind vorgeschoben, damit niemand, der hineinging, wieder herauskomme. Überfüllt mit Leichen ist die große Homon der Begrabenen, und wohl befestigt ist die Burg des Todes, auf daß die Auferstehung nicht in sie hineingelange. Myriaden Toter ziehen hinein, aber heraus kommt nicht ein einziger. Der Tod vertraut darauf, daß kein Held seinen Platz zu erobern imstande sei. Die Kunde vom Leben ist ferne jener Stadt der Eingeschlossenen, und die Gefangenschaft aller Zeiten staut sich in den Palästen der Unterwelt. Gefesselt und eingeschlossen wohnen dort die Verbannten in der Finsternis. Damals stand die Auferstehung am Abgrunde der Gebundenen; indem er einen aus ihm befreite, gab er allen Hoffnung. Der Verstorbene war aber in den Schlund aller Toten hinabgesunken, mit den Banden des Todes gefesselt und am Orte der Begrabenen eingeschlossen. Der Zaum des Schweigens war ihm angelegt, und er lag in dem elenden Totenreiche, an Händen und Füßen in die Ketten und Bande des Todes geschlagen. Der Leichnam begann in seinen Staub zu zerfallen, der Leib in seinen Lehm zu zerbröckeln, und der Gestank seiner Vermoderung wehte allen seinen Bestattern entgegen. Seine Schwestern beweinten den Toten, welcher der Verwesung verfallen war. Eine Menge Juden war versammelt und tröstete sie. Dann befahl Jesus, den Grabstein vom Eingange wegzuheben. Auch dies geschah aus unfaßbarer Weisheit. Er veranlaßte die ungläubigen Juden, das Grab aufzudecken, damit ihnen beim Entfernen des Steines der Totengeruch Übelkeit verursache. Beim Wegnehmen des Grabsteines wurden sie von dem Gestank des Toten betäubt, damit sie, während sein Modergeruch noch an ihren Kleidern haftete, das Wunder seiner Erweckung sähen.</p><p>Der Erlöser stand am Grabe und die finstere Homon erbebte. Die Mauern der [mit Toten] überfüllten [Stadt] wankten, und ihre Bollwerke zeigten Risse. Die Schlösser ihrer Macht wurden zertrümmert und die hohen Tore aufgerissen. Alle ihre Riegel wurden zerbrochen, und ihre Häuser begannen zu beben. Der Ruf der Auferweckung zermalmte sie [die Totenstadt], und ihre Mauern schlugen aneinander. Der Jungleu brüllte in der Unterwelt, und Schrecken befiel den Tod. Der schöne Hirsch röhrte am Felsenspalt der Schlange, und sie entfloh. Der himmlische Adler schrie im Neste der Habichte, und sie stoben auseinander. Der Tod hörte den neuen Ruf des Lebens an seine Pforte donnern und eilte, die Ketten zu sprengen, um die Gefesselten freizugeben. Er zog seine Hand von seinen Gefangenen zurück, um sie nicht am Fortgehen zu hindern. Er [der Tod] stieg von seiner hohen Stufe herab, damit das Leben [Christus] zu derselben hinaufsteige und dort bleibe. Er gab seine Gewalt über die Toten auf, damit die Auferstehung über sie herrsche. Als er aber, von Angst verwirrt, daran war, die ganze Gefangenschaft freizulassen, da vernahm er die Stimme Jesu, der jedoch nicht rief: „Kommet heraus!“ sondern nur: „Komm heraus!“" Er sprach: „Lazarus, komm heraus!“ Die Anrede betraf nur einen einzigen und berührte alle übrigen Toten nicht; sie erweckte nur Einen zum Leben, damit durch den Einen die Hoffnung bis auf die Zeit des Jüngsten Tages bestärkt würde. Hätte Christus anstatt „Komm!“ gesagt „Kommet heraus!“, so wäre die ganze Schar der Toten mit Lazarus herausgekommen. Sein Ruf aber machte einen Unterschied; denn er forderte nur Einen auf, für die übrigen wurde die Auferweckung bis ans Ende der Zeit verschoben. Hätte er damals schon statt „Komm!“ gesagt „Kommet!“, so wäre nicht Lazarus allein, sondern die Gesamtheit der Entschlafenen hervorgekommen. Darum unterschied er und rief nur Einen aus den vielen, damit ihre Auferstehung nicht eine Verwirrung in bezug auf die Endzeit anrichte, die hierfür [für die allgemeine Auferstehung] bestimmt ist.</p><p>Der Ruf der Erweckung brachte Bewegung in den hingestreckten Toten und richtete ihn auf. Er faßte ihn ausdrücklich bei seinem Namen, auf daß nur er allein herauskäme. Der Jungleu von Juda brüllte im leichengefüllten Walde, und seine Stimme drang zu der Herde der Toten. Er ergriff Einen und führte ihn heraus, wie es ihm gefiel. Auf den Ruf stand der Entschlafene auf, und die Stricke der Unterwelt fesselten ihn nicht mehr. Der Odem des Lebens wehte und richtete ihn zum Wandeln auf. „Lazarus, komm heraus!“ rief er, und dieser kam. Dem Worte folgte die Tat; auf den Ruf hin geschah die Auferstehung, und die Erweckung fand unverzüglich statt. Der Wind der Auferweckung führte ihn aus der Mitte aller Entschlafenen weg. Weil ihn allein der Hauch des Befehles anwehte, erstand er [allein] aus dem Grabe, und zwar verschnürt. Seine Füße waren gebunden, und doch wandelte er; sein Gang war natürlich und rasch, obgleich seine Gelenke noch nicht frei waren. „Löset ihn und laßt ihn gehen!“ Sehet also, daß er beim Herauskommen [aus dem Grabe] noch nicht freigemacht, sondern gebunden, eingewickelt und verhüllt war. Und doch war sein Gang nicht gelähmt. Der Lebensspender befreite ihn vom Tode, nicht aber von der Verschnürung, damit dieselben Hände, welche den Begrabenen bekleidet hatten, ihn wieder freimachen könnten und auf diese Weise nicht mißachtet würden. Überaus wunderbar sind die Taten unseres Erlösers! Alle vollbrachte er zu unserem Heile, und zwar, wie er wollte; denn er hat im Himmel und auf Erden Gewalt. Preis und Verherrlichung und Anbetung und Majestät ihm und seinem Sender und dem Hl. Geiste; über uns, Elende und Sünder, aber komme jederzeit sein Erbarmen!</p>
